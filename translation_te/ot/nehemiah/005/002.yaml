source:
  edition: WLC
  text: וְ/יֵשׁ֙ אֲשֶׁ֣ר אֹמְרִ֔ים בָּנֵ֥י/נוּ וּ/בְנֹתֵ֖י/נוּ אֲנַ֣חְנוּ רַבִּ֑ים וְ/נִקְחָ֥ה דָגָ֖ן וְ/נֹאכְלָ֥ה וְ/נִחְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/002.yaml
  text: And there were those who said[a], “We have many sons and daughters. Let us get grain, so that we may eat and live.”
translation:
  language: te
  text: 'కొంతమంది ఇలా అన్నారు: “మాకు చాలామంది కుమారులు, కుమార్తెలు ఉన్నారు.[a] ధాన్యం సమకూర్చుకుందాం; తిని బతుకుదాం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “మా కుమారులు, మా కుమార్తెలు, మేము అనేకమందిమి” అని కుదించిన రూపంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: కొందరు ఇలా అన్నారు
  rationale: ఈ హీబ్రూ అస్తిత్వ సూచక ప్రయోగం ఫిర్యాదు చేస్తున్నవారిలో ఒక వర్గాన్ని పరిచయం చేస్తుంది. ఆధునిక తెలుగులో ‘కొందరు ఇలా అన్నారు’ సహజంగా అదే భావాన్ని అందిస్తుంది.
- source_word: בָּנֵינוּ וּבְנֹתֵינוּ אֲנַחְנוּ רַבִּים
  choice: మేము, మా కుమారులు, మా కుమార్తెలు—మేము అనేకమందిమి
  rationale: హీబ్రూలోని కుదించిన, సమాససదృశ వరుసను అలాగే ప్రతిబింబిస్తూ, אֲנַחְנוּ అనే స్పష్టమైన ‘మేము’ను విడిచిపెట్టదు. కుటుంబమంతా పెద్ద సంఖ్యలో ఉందనే భావాన్ని నిలుపుతుంది.
- source_word: וְנִקְחָה
  choice: మేము ధాన్యం సంపాదించుకొని
  rationale: మొదటి పురుష బహువచన cohortative అవసరం లేదా సంకల్పాన్ని తెలియజేస్తుంది. ఈ కష్టకాల సందర్భంలో ‘సంపాదించుకొని’ అనేది కేవలం ‘తీసుకొని’ కంటే ఆహారాన్ని సమకూర్చుకోవడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דָגָן
  choice: ధాన్యం
  rationale: ఈ పదం సాధారణ ఆహారాన్ని కాకుండా ప్రత్యేకంగా ధాన్య పంటను సూచిస్తుంది; ‘ధాన్యం’ ఖచ్చితమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: וְנֹאכְלָה וְנִחְיֶה
  choice: తిని బతకాలి
  rationale: వరుస cohortative రూపాలు ధాన్యం సంపాదించుకోవలసిన అత్యవసర ఉద్దేశాన్ని తెలియజేస్తాయి. ‘తిని బతకాలి’ రెండు క్రియలనూ నిలుపుతూ జీవనావశ్యకతను సహజంగా వ్యక్తం చేస్తుంది.
