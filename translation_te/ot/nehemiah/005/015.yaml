id: NEH.5.15
reference: Nehemiah 5:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/פַּחוֹת֩ הָ/רִאשֹׁנִ֨ים אֲשֶׁר לְ/פָנַ֜/י הִכְבִּ֣ידוּ עַל הָ/עָ֗ם וַ/יִּקְח֨וּ מֵ/הֶ֜ם בְּ/לֶ֤חֶם וָ/יַ֨יִן֙ אַחַר֙ כֶּֽסֶף שְׁקָלִ֣ים אַרְבָּעִ֔ים גַּ֥ם נַעֲרֵי/הֶ֖ם שָׁלְט֣וּ עַל הָ/עָ֑ם וַ/אֲנִי֙ לֹא עָשִׂ֣יתִי כֵ֔ן מִ/פְּנֵ֖י יִרְאַ֥ת אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/015.yaml
  text: But the former governors who were before me laid heavy burdens on the people[a], and took from them bread and wine, besides forty shekels of silver. Even their servants ruled over the people. But I did not do so[c][b], because of the fear of God.
translation:
  language: te
  text: కాని నాకు ముందున్న పాలకులు ప్రజలపై భారాలు మోపి, వారి దగ్గర నుంచి రొట్టెను, ద్రాక్షారసాన్ని, వాటికి అదనంగా నలభై షెకెలుల వెండిని[a] తీసుకున్నారు. వారి సేవకులు[b] కూడా ప్రజలపై అధికారం చెలాయించారు. కాని దేవుని పట్ల భయం వల్ల[c] నేను అలా చేయలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రొట్టె, ద్రాక్షారసంతో పాటు నలభై షెకెలుల వెండిని.’ హీబ్రూ పదబంధం రొట్టె, ద్రాక్షారసానికి అదనంగా విధించిన వెండి వసూలును సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘సేవకులు’ అనే పదానికి ‘సహాయకులు’ లేదా ‘యువకులు’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం పాలకుల కింద పనిచేసే సహాయక అధికారులను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘దేవుని పట్ల భయభక్తుల వల్ల.’ హీబ్రూ పదబంధానికి అక్షరార్థం ‘దేవుని భయం వల్ల.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפַּחוֹת
  choice: పాలకులు
  rationale: పర్షియా కాలంలోని ప్రాంత పాలనాధికారులను సూచించే పదం. ఆధునిక తెలుగు పాఠకులకు సహజంగా ఉండేలా ‘పాలకులు’ అని అనువదించాం.
- source_word: הָרִאשֹׁנִים אֲשֶׁר לְפָנַי
  choice: నాకు ముందున్న పాలకులు
  rationale: నెహెమ్యాకు ముందు అదే పదవిలో ఉన్నవారిని స్పష్టంగా సూచిస్తుంది.
- source_word: הִכְבִּידוּ עַל הָעָם
  choice: ప్రజలపై భారాలు మోపి
  rationale: హీబ్రూ పదంలోని ‘భారీ చేయడం’ అనే రూపకాన్ని నిలుపుతూ, ప్రజలపై మోపిన కఠినమైన ఆర్థిక భారం అనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: וַיִּקְחוּ מֵהֶם
  choice: వారి దగ్గర నుంచి ... తీసుకున్నారు
  rationale: మూలంలోని సాధారణ ‘తీసుకోవడం’ అనే క్రియను నిలుపుతుంది; సందర్భం అది అధికారిక వసూలు అని తెలియజేస్తుంది.
- source_word: בְּלֶחֶם וָיַיִן
  choice: రొట్టెను, ద్రాక్షారసాన్ని
  rationale: మూలంలో పేర్కొన్న రెండు నిర్దిష్ట వస్తువులను సాధారణీకరించకుండా అనువదిస్తుంది.
- source_word: אַחַר כֶּסֶף שְׁקָלִים אַרְבָּעִים
  choice: వాటికి అదనంగా నలభై షెకెలుల వెండిని
  rationale: אַחַר‌ను ఇక్కడ అదనపు వసూలును సూచించే పదంగా గ్రహించాం. బరువు ప్రమాణాన్ని మార్చకుండా ‘షెకెలు’గా ఉంచాం; వాక్యనిర్మాణంలోని సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- source_word: נַעֲרֵיהֶם
  choice: వారి సేవకులు
  rationale: నַעַר అక్షరార్థంగా యువకుడిని సూచించగలిగినా, ఈ పరిపాలనా సందర్భంలో పాలకుల కింద పనిచేసే సేవకులు లేదా సహాయక అధికారులను సూచించడం సహజం.
- source_word: שָׁלְטוּ עַל הָעָם
  choice: ప్రజలపై అధికారం చెలాయించారు
  rationale: ప్రజలపై ఆధిపత్యం లేదా అధికారాన్ని ప్రయోగించారనే మూల భావాన్ని, అతిగా వ్యాఖ్యానించకుండా తెలియజేస్తుంది.
- source_word: וַאֲנִי לֹא עָשִׂיתִי כֵן
  choice: కాని ... నేను అలా చేయలేదు
  rationale: మునుపటి పాలకుల ప్రవర్తనకు నెహెమ్యా ప్రవర్తనను నేరుగా వ్యతిరేకంగా చూపిస్తుంది.
- source_word: מִפְּנֵי יִרְאַת אֱלֹהִים
  choice: దేవుని పట్ల భయం వల్ల
  rationale: ‘దేవుని భయం’ అనే బైబిలు భావాన్ని మెత్తబరచకుండా నిలుపుతూ, తెలుగులో సంబంధాన్ని స్పష్టంగా తెలిపేందుకు ‘పట్ల’ ఉపయోగించాం.
theological_decisions:
- issue: יִרְאַת אֱלֹהִים అనువాదం
  choice: దేవుని పట్ల భయం వల్ల
  alternative: దేవుని పట్ల భయభక్తుల వల్ల; దేవుని గౌరవించినందువల్ల
  rationale: ఈ మాట దేవుని ఎదుట భక్తితో కూడిన భయాన్ని, నైతిక జవాబుదారీతనాన్ని సూచిస్తుంది. ‘భయం’ అనే మూల పదాన్ని నిలుపడం ద్వారా దాని ధార్మిక బలాన్ని తగ్గించకుండా, అది కేవలం భీతిని మాత్రమే సూచిస్తుందని కూడా నిర్బంధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించాం. ‘షెకెలు’ అనే చారిత్రక బరువు ప్రమాణాన్ని నిలిపాం. మూలంలోని ఆర్థిక దోపిడి, అధికార దుర్వినియోగం, దేవుని భయమే నెహెమ్యా ప్రవర్తనకు కారణం అనే ఉద్వేగాన్ని స్పష్టంగా ఉంచాం.
