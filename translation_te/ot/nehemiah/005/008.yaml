source:
  edition: WLC
  text: וָ/אֹמְרָ֣/ה לָ/הֶ֗ם אֲנַ֣חְנוּ קָ֠נִינוּ אֶת אַחֵ֨י/נוּ הַ/יְּהוּדִ֜ים הַ/נִּמְכָּרִ֤ים לַ/גּוֹיִם֙ כְּ/דֵ֣י בָ֔/נוּ וְ/גַם אַתֶּ֛ם תִּמְכְּר֥וּ אֶת אֲחֵי/כֶ֖ם וְ/נִמְכְּרוּ לָ֑/נוּ וַֽ/יַּחֲרִ֔ישׁוּ וְ/לֹ֥א מָצְא֖וּ דָּבָֽר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/008.yaml
  text: And I said to them[a], “We have bought back our Jewish brothers who were sold to the nations, as much as we were able. But now you yourselves are even selling your brothers[b], and they must be sold to us!” Then they were silent and found nothing to say.
translation:
  language: te
  text: 'నేను వారితో ఇలా అన్నాను: “అన్యజనులకు అమ్మబడిన మన యూద సోదరులను[a] మనకు చేతనైనంతవరకు మేము తిరిగి కొనుగోలు చేశాం. అయితే మీరుకూడా మీ సోదరులను అమ్ముతున్నారు; వారు మనకే అమ్మబడుతున్నారు![b]” అప్పుడు వారు మౌనంగా ఉండిపోయారు; వారికి చెప్పడానికి మాటేమీ దొరకలేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మన తోటి యూదులను.” హీబ్రూ పాఠంలో అక్షరార్థంగా “మన సోదరులైన యూదులను” అని ఉంది; ఇక్కడ పురుషలింగ బంధుత్వ పదం సమాజంలోని తోటి సభ్యులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా దీనిని అలంకారిక ప్రశ్నగా, “వారు మనకే అమ్మబడాలా?” అని అనువదించవచ్చు. హీబ్రూ వాక్యభాగం సంక్షిప్తంగా ఉంది; తమ సోదరులు మళ్లీ తమ ప్రజలకే అమ్మబడే విరోధాభాసమైన పర్యవసానాన్ని ఇది సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: קָנִינוּ
  choice: తిరిగి కొనుగోలు చేశాం
  rationale: ఈ సందర్భంలో విదేశీయులకు అమ్మబడిన తోటి యూదులను డబ్బు చెల్లించి విడిపించడం ఉద్దేశం. ‘విమోచించాం’ అనే పదానికి ఉండగల విస్తృత మతపరమైన భావభారాన్ని జోడించకుండా, తిరిగి కొనడం అనే సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַחֵינוּ הַיְּהוּדִים
  choice: మన యూద సోదరులను
  rationale: హీబ్రూలోని పురుషలింగ బంధుత్వ పదాన్నీ, ‘యూదులు’ అనే ప్రత్యక్ష గుర్తింపునీ నిలుపుతుంది; సమాజంలోని తోటి సభ్యుల పట్ల ఐక్యతను కూడా వ్యక్తం చేస్తుంది.
- source_word: הַנִּמְכָּרִים לַגּוֹיִם
  choice: అన్యజనులకు అమ్మబడిన
  rationale: గּוֹיִם ఇక్కడ ఇశ్రాయేలీయేతర ప్రజలను సూచిస్తుంది. ‘అన్యజనులు’ ఆధునిక తెలుగు బైబిలు సందర్భంలో సహజంగా ఉండి, హీబ్రూ కర్మణి భావాన్ని నిలుపుతుంది.
- source_word: כְּדֵי בָנוּ
  choice: మనకు చేతనైనంతవరకు
  rationale: అందుబాటులో ఉన్న సామర్థ్యం లేదా వనరుల మేరకు చేసిన చర్యను తెలిపే హీబ్రూ నుడికారానికి సహజమైన తెలుగు రూపం.
- source_word: וְגַם אַתֶּם
  choice: కాని ఇప్పుడు మీరే
  rationale: ముందు ‘మేము’ చేసిన పనికీ, ఇప్పుడు ‘మీరు’ చేస్తున్న విరుద్ధమైన పనికీ మధ్యనున్న గట్టి వ్యత్యాసాన్ని ‘మీరే’ నిలుపుతుంది; ‘కాని ఇప్పుడు’ సందర్భంలోని మందలింపు బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תִּמְכְּרוּ
  choice: అమ్ముతున్నారు
  rationale: నెహెమ్యా వారి ప్రస్తుత ప్రవర్తనను నేరుగా మందలిస్తున్న భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וְנִמְכְּרוּ לָנוּ
  choice: చివరికి వారు మనకే అమ్మబడుతున్నారు!
  rationale: 'సంక్షిప్తమైన, క్లిష్టమైన హీబ్రూ వాక్యాన్ని వారి చర్యల వ్యంగ్యమైన పర్యవసానంగా చూపుతుంది: విదేశీయుల చేతిలోనుంచి విడిపించిన తమవారినే మళ్లీ తమ సమాజం కొనవలసిన స్థితి ఏర్పడుతోంది. ‘మనకే’ ఆ అసంబద్ధతను నొక్కిచెబుతుంది; ప్రశ్నార్థక పఠనాన్ని పాదసూచికలో ఉంచాం.'
- source_word: וַיַּחֲרִישׁוּ
  choice: మౌనంగా ఉండిపోయారు
  rationale: మందలింపుకు సమాధానం లేక నిశ్శబ్దంగా ఉండడాన్ని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וְלֹא מָצְאוּ דָּבָר
  choice: వారికి చెప్పడానికి మాటేమీ దొరకలేదు
  rationale: ‘వారు ఏ మాటనూ కనుగొనలేదు’ అనే హీబ్రూ నుడికారాన్ని అర్థానికి దగ్గరగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: אַחֵינוּ / אַחֵיכֶם అనే లింగసూచక బంధుత్వ పదం
  choice: సోదరులు
  alternative: తోటి యూదులు; సోదర సోదరీమణులు
  rationale: మూల హీబ్రూ పురుషలింగ బహువచన బంధుత్వ పదాన్ని ఉపయోగిస్తుంది. అందువల్ల ప్రధాన పాఠ్యంలో దాని రూపాన్ని నిలిపి, అది సమాజంలోని తోటి యూదులను సూచించగలదని పాదసూచికలో వివరించాం.
- issue: וְנִמְכְּרוּ לָנוּ అనే సంక్షిప్త వాక్యభాగం యొక్క వాక్యబలం
  choice: పర్యవసానాన్ని తెలిపే ఆశ్చర్యార్థక ప్రకటన
  alternative: ‘వారు మనకే అమ్మబడాలా?’ అనే అలంకారిక ప్రశ్న
  rationale: హీబ్రూ రూపం ప్రశ్నార్థక కణం లేకుండా సంక్షిప్తంగా ఉంది; వారి చర్యల విరోధాభాసమైన ఫలితాన్ని ప్రకటనగా చదవవచ్చు. అయితే సందర్భంలో అలంకారిక ప్రశ్నగా గ్రహించడం కూడా సాధ్యమే కాబట్టి ఆ నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని పాటించాం. ‘తిరిగి కొనుగోలు చేశాం,’ ‘మనకు చేతనైనంతవరకు,’ ‘మౌనంగా ఉండిపోయారు’ వంటి రూపాలు సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ఎంచుకున్నాం. మూలంలోని గట్టి మందలింపును ‘మీరే,’ ‘మనకే,’ ఆశ్చర్యార్థక చిహ్నం ద్వారా నిలిపి, క్లిష్టమైన చివరి ఉపవాక్యంలోని సందిగ్ధతను పాదసూచికలో వెల్లడించాం.
