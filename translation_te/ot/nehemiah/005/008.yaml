    rationale: וְגַם אַתֶּםలో ‘మీరు కూడా/మీరు సైతం’ అనే గట్టి విరుద్ధత ఉంది; ‘ఇప్పుడు’ సందర్భానుసారంగా ఊహించవచ్చుగానీ మూలానికి మరింత సన్నిహితంగా ఉండేందుకు తొలగించడం మంచిది.
  revised_text: 'నేను వారితో ఇలా అన్నాను: “అన్యజనులకు అమ్మబడిన మన యూద సోదరులను[a] మనకు చేతనైనంతవరకు మేము తిరిగి కొనుగోలు చేశాం. అయితే మీరుకూడా మీ సోదరులను అమ్ముతున్నారు; వారు మనకే అమ్మబడుతున్నారు![b]” అప్పుడు వారు మౌనంగా ఉండిపోయారు; వారికి చెప్పడానికి మాటేమీ దొరకలేదు.'
