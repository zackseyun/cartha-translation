    issue: కాలసామరస్యం
    rationale: ‘సిద్ధం చేసేవారు’ మరియు ‘సమకూర్చేవారు’తో ఉన్న చారిత్రక పునరావృత కథనంలో ‘పని భారం అధికంగా ఉంది’ బదులు ‘శ్రమభారం ఎక్కువగా ఉండేది’ సహజంగా ఉంటుంది.
