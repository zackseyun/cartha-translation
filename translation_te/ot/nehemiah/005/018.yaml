  to: ప్రతిరోజు సిద్ధం చేసేవాటిలో ఒక ఎద్దు, ఎంపిక చేసిన ఆరు గొర్రెలు ఉండేవి. పక్షులను కూడా నా కోసం సిద్ధం చేసేవారు; పది రోజులకు ఒకసారి అన్ని రకాల ద్రాక్షారసం సమృద్ధిగా సమకూర్చేవారు. అయినప్పటికీ, పాలనాధికారి ఆహార వాటాను[a] నేను కోరలేదు, ఎందుకంటే ఈ ప్రజలపై శ్రమభారం ఎక్కువగా ఉండేది[b].
