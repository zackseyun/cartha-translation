  revision_rationale: సవరణలు అర్థాన్ని మార్చకుండా కథన కాలాన్ని సహజంగా చేశాయి; పది రోజుల విరామాన్ని స్పష్టపరిచాయి; ‘పాలనాధికారి రొట్టె’ అనే మూలపదబంధంలోని సంబంధార్థాన్ని అతిగా నిర్దిష్టీకరించకుండా ఉంచాయి. ఫుట్‌నోట్ గుర్తులు సంబంధిత పదబంధాల వద్దనే ఉన్నాయి.
