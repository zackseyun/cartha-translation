source:
  edition: WLC
  text: וַ/אֲשֶׁר֩ הָיָ֨ה נַעֲשֶׂ֜ה לְ/י֣וֹם אֶחָ֗ד שׁ֣וֹר אֶחָ֞ד צֹ֠אן שֵׁשׁ בְּרֻר֤וֹת וְ/צִפֳּרִים֙ נַֽעֲשׂוּ לִ֔/י וּ/בֵ֨ין עֲשֶׂ֧רֶת יָמִ֛ים בְּ/כָל יַ֖יִן לְ/הַרְבֵּ֑ה וְ/עִם זֶ֗ה לֶ֤חֶם הַ/פֶּחָה֙ לֹ֣א בִקַּ֔שְׁתִּי כִּֽי כָֽבְדָ֥ה הָ/עֲבֹדָ֖ה עַל הָ/עָ֥ם הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/018.yaml
  text: What was prepared for each day was one ox and six choice sheep[a]; also birds were prepared for me, and every ten days an abundance of all kinds of wine. Yet even with this, I did not demand the governor’s food allowance[b], because the service was heavy on this people.
translation:
  language: te
  text: ప్రతిరోజు సిద్ధం చేసేవాటిలో ఒక ఎద్దు, ఎంపిక చేసిన ఆరు గొర్రెలు ఉండేవి. పక్షులను కూడా నా కోసం సిద్ధం చేసేవారు; పది రోజులకు ఒకసారి అన్ని రకాల ద్రాక్షారసం సమృద్ధిగా సమకూర్చేవారు. అయినప్పటికీ, పాలనాధికారి ఆహార వాటాను[a] నేను కోరలేదు, ఎందుకంటే ఈ ప్రజలపై శ్రమభారం ఎక్కువగా ఉండేది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘పాలనాధికారి రొట్టె.’ ఇది పాలనాధికారి పదవికి సంబంధించిన ఆహార సరఫరా లేదా అధికారిక వాటాను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘శ్రమ భారంగా ఉండేది’ లేదా ‘పని కఠినంగా ఉండేది’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదబంధం ప్రజలు మోస్తున్న భారాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר הָיָה נַעֲשֶׂה לְיוֹם אֶחָד
  choice: రోజుకు ... సిద్ధం చేసేవారు
  rationale: ఆహార ఏర్పాట్ల సందర్భంలో నַעֲשֶׂה అనే నిష్క్రియారూపం ‘సిద్ధం చేయబడేది’ అనే భావాన్ని ఇస్తుంది. לְיוֹם אֶחָד పునరావృతమయ్యే ఒక్కో రోజు పరిమాణాన్ని సూచిస్తున్నందున సహజమైన తెలుగులో ‘రోజుకు’ అని అనువదించాం.
- source_word: שׁוֹר אֶחָד
  choice: ఒక ఎద్దు
  rationale: שׁוֹר సాధారణంగా గోవుజాతి పశువును సూచిస్తుంది; భోజన సరఫరా సందర్భంలో ‘ఒక ఎద్దు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: צֹאן שֵׁשׁ בְּרֻרוֹת
  choice: ఎంపిక చేసిన ఆరు గొర్రెలు
  rationale: צֹאן చిన్న పశువుల మందను సమూహార్థంలో సూచించగలదు. సంఖ్యతో కూడిన ఈ ఆహార సందర్భంలో ‘గొర్రెలు’ సహజం; בְּרֻרוֹת వాటిని ప్రత్యేకంగా ఎంపిక చేసినవిగా తెలియజేస్తుంది.
- source_word: וְצִפֳּרִים נַעֲשׂוּ לִי
  choice: పక్షులను కూడా నా కోసం సిద్ధం చేసేవారు
  rationale: צִפֳּרִים విస్తృతంగా పక్షులను సూచిస్తుంది. భోజన సందర్భాన్ని బట్టి ‘సిద్ధం చేసేవారు’ అనే ప్రయోగం వంటకై సిద్ధపరచడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּבֵין עֲשֶׂרֶת יָמִים
  choice: ప్రతి పది రోజులకు
  rationale: ఈ హీబ్రూ ప్రయోగం పది రోజుల చొప్పున పునరావృతమయ్యే విరామాన్ని సూచిస్తుంది; ‘ప్రతి పది రోజులకు’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: בְּכָל יַיִן לְהַרְבֵּה
  choice: అన్ని రకాల ద్రాక్షారసం సమృద్ధిగా
  rationale: בְּכָל విస్తృతిని, לְהַרְבֵּה సమృద్ధిని సూచిస్తాయి. ‘అన్ని రకాల ... సమృద్ధిగా’ అనే రూపం ఈ రెండు అంశాలనూ నిలుపుతుంది.
- source_word: וְעִם זֶה
  choice: అయినా
  rationale: ముందు చెప్పిన విస్తారమైన ఏర్పాట్లు ఉన్నప్పటికీ నెహెమ్యా అధికారిక వాటాను కోరలేదనే వ్యత్యాసాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לֶחֶם הַפֶּחָה
  choice: పాలనాధికారికి కేటాయించిన ఆహార వాటా
  rationale: అక్షరార్థం ‘పాలనాధికారి రొట్టె.’ అయితే לֶחֶם ఇక్కడ ఆహార సరఫరాకు పర్యాయంగా, పదవికి సంబంధించిన అధికారిక వాటాను సూచిస్తుంది. ‘కేటాయించిన ఆహార వాటా’ అర్థాన్ని స్పష్టం చేస్తూనే పన్ను అని అతిగా నిర్దిష్టీకరించదు.
- source_word: לֹא בִקַּשְׁתִּי
  choice: నేను కోరలేదు
  rationale: בקשׁ అడగడం, కోరడం, హక్కుగా అభ్యర్థించడం వంటి భావాలు కలిగి ఉంది. ‘కోరలేదు’ మూలంలోని విస్తృతిని నిలుపుతూ, ‘బలవంతంగా వసూలు చేయలేదు’ వంటి అదనపు భావాన్ని చేర్చదు.
- source_word: כִּי כָבְדָה הָעֲבֹדָה עַל הָעָם הַזֶּה
  choice: ఎందుకంటే ఈ ప్రజలపై పని భారం అధికంగా ఉంది
  rationale: כָבְדָה భారంగా ఉండడాన్ని, עֲבֹדָה పని/శ్రమ/సేవను సూచిస్తాయి. ‘పని భారం అధికంగా’ అనే ప్రయోగం ప్రజలు మోస్తున్న భారాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ప్రజల భారాన్ని బట్టి నెహెమ్యా అధికారిక పోషణను స్వీకరించకపోవడం
  choice: పాలనాధికారి పదవికి కేటాయించిన ఆహార వాటాను నెహెమ్యా కోరలేదని అనువదించడం
  alternative: నెహెమ్యా పాలనాధికారి రొట్టెను మాత్రమే అడగలేదని అక్షరార్థంగా అనువదించడం; లేదా ఒక నిర్దిష్ట పన్నును వసూలు చేయలేదని చెప్పడం
  rationale: సందర్భం పదవికి సంబంధించిన ఆహార సరఫరాను సూచిస్తుంది. ప్రజలపై ఇప్పటికే ఉన్న భారాన్ని బట్టి నెహెమ్యా దానిని కోరలేదు. అయితే మూలపాఠం దానిని నేరుగా ‘పన్ను’ అని పిలవనందున ఆ నిర్దిష్టీకరణను నివారించాం.
translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా, అయితే చారిత్రక వర్ణనకు తగిన గంభీరతతో అనువదించాం. ‘పాలనాధికారి,’ ‘ఆహార వాటా,’ ‘పని భారం’ వంటి పదాలు పరిపాలనా మరియు సామాజిక సందర్భాన్ని స్పష్టంగా ఉంచుతాయి. మూలంలోని నిష్క్రియ నిర్మాణాన్ని తెలుగులో కఠినంగా పునరావృతం చేయకుండా సహజమైన బహువచన కర్తలేని క్రియారూపాలను ఉపయోగించాం.
