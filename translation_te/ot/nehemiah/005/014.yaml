id: NEH.5.14
reference: Nehemiah 5:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: גַּ֞ם מִ/יּ֣וֹם אֲשֶׁר צִוָּ֣ה אֹתִ֗/י לִ/הְי֣וֹת פֶּחָ/ם֮ בְּ/אֶ֣רֶץ יְהוּדָה֒ מִ/שְּׁנַ֣ת עֶשְׂרִ֗ים וְ֠/עַד שְׁנַ֨ת שְׁלֹשִׁ֤ים וּ/שְׁתַּ֨יִם֙ לְ/אַרְתַּחְשַׁ֣סְתְּא הַ/מֶּ֔לֶךְ שָׁנִ֖ים שְׁתֵּ֣ים עֶשְׂרֵ֑ה אֲנִ֣י וְ/אַחַ֔/י לֶ֥חֶם הַ/פֶּ֖חָה לֹ֥א אָכַֽלְתִּי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/014.yaml
  text: Also[a], from the day that he appointed me to be governor in the land of Judah, from the twentieth year until the thirty-second year of King Artaxerxes—twelve years—I and my brothers did not eat the governor’s food allowance.
translation:
  language: te
  text: అంతేకాక, యూదా దేశంలో వారికి అధిపతిగా ఉండేందుకు ఆయన నన్ను నియమించిన రోజు మొదలుకొని, అర్తహషస్త రాజు పరిపాలనలో ఇరవయ్యవ సంవత్సరం నుండి ముప్పై రెండవ సంవత్సరం వరకు—ఈ పన్నెండు సంవత్సరాలూ—నేనుగానీ నా సహోదరులుగానీ అధిపతికి రావలసిన ఆహారభత్యాన్ని[a] తీసుకోలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అధిపతి రొట్టెను తినలేదు”; అంటే అధిపతికి సంప్రదాయంగా సమకూర్చే ఆహారాన్ని లేదా భత్యాన్ని తీసుకోలేదు.
    reason: లֶחֶם הַפֶּחָה మరియు לֹא אָכַלְתִּי అనే స్పష్టమైన ఆహార రూపకాన్ని చూపుతూ, పరిపాలనా సందర్భార్థాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: גַּם
  choice: అంతేకాక
  rationale: నెహెమ్యా తన సమర్థనలో మరో అంశాన్ని జోడిస్తున్నాడనే సంకలిత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מִיּוֹם אֲשֶׁר
  choice: రోజు మొదలుకొని
  rationale: కొనసాగిన కాలవ్యవధి ఆరంభాన్ని సూచించే హీబ్రూ నుడికారాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: צִוָּה אֹתִי
  choice: ఆయన నన్ను నియమించిన
  rationale: צוה సాధారణంగా ‘ఆజ్ఞాపించు’ అయినప్పటికీ, ఇక్కడ పరిపాలనా పదవిలో ఉంచడాన్ని సూచిస్తున్నందున ‘నియమించిన’ అనేది సందర్భోచితం.
- source_word: לִהְיוֹת פֶּחָם
  choice: అధిపతిగా ఉండేందుకు
  rationale: פֶּחָה పర్షియా సామ్రాజ్యంలోని ప్రాంతీయ పరిపాలకుని పదవి. మూలపాఠంలోని సర్వనామ ప్రత్యయాన్ని తెలుగులో నిర్దిష్టంగా పరిష్కరించకుండా, పదవిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: యూదా దేశంలో
  rationale: భౌగోళిక పదబంధాన్ని నేరుగా, సహజంగా అనువదిస్తుంది; ‘ప్రాంతం’ అనే పరిపాలనా వ్యాఖ్యానాన్ని అనవసరంగా చేర్చదు.
- source_word: מִשְּׁנַת עֶשְׂרִים וְעַד שְׁנַת שְׁלֹשִׁים וּשְׁתַּיִם לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: అర్తహషస్త రాజు పరిపాలనలో ఇరవయ్యవ సంవత్సరం నుండి ముప్పై రెండవ సంవత్సరం వరకు
  rationale: ఇది రాజ్యపాలనా సంవత్సరాల తేదీ సూత్రం; తెలుగులో కాలసూచన స్పష్టంగా ఉండేందుకు ‘పరిపాలనలో’ అని వ్యక్తపరచబడింది.
- source_word: שָׁנִים שְׁתֵּים עֶשְׂרֵה
  choice: ఈ పన్నెండు సంవత్సరాలూ
  rationale: ముందు చెప్పిన తేదీల కాలవ్యవధిని సంగ్రహించే అనుబంధ పదబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲנִי וְאַחַי
  choice: నేనుగానీ నా సహోదరులుగానీ
  rationale: אַחַי యొక్క పుంలింగ బహువచన అర్థాన్ని ‘నా సహోదరులు’గా నిలుపుతూ, తరువాతి ప్రతికూల క్రియతో సహజ తెలుగు వాక్య నిర్మాణాన్ని ఇస్తుంది.
- source_word: לֶחֶם הַפֶּחָה
  choice: అధిపతికి రావలసిన ఆహారభత్యం
  rationale: లాక్షణికంగా ‘అధిపతి రొట్టె’ అయిన ఈ పరిపాలనా పదబంధం, అధిపతికి సంప్రదాయంగా సమకూర్చే ఆహారం లేదా భత్యాన్ని సూచిస్తుంది.
- source_word: לֹא אָכַלְתִּי
  choice: తీసుకోలేదు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘తినలేదు’; అయితే ఆహారభత్యం అనే నామపదంతో తెలుగులో ‘తీసుకోలేదు’ అనడం ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది. అక్షరార్థం పాదసూచికలో నిలుపబడింది.
theological_decisions:
- issue: אַחַי అనే పదానికి సామాజికంగా విస్తృత ప్రతినిధి భావం ఉండవచ్చా
  choice: నా సహోదరులు
  alternative: నా సహచరులు / నా తోటి యూదులు
  rationale: మూలంలోని స్పష్టమైన పుంలింగ బహువచన బంధుత్వ పదాన్ని ప్రధాన పాఠంలో నిలుపుతుంది; సందర్భం అనుమతించే విస్తృత భావాన్ని అనువాదంలో బలవంతంగా నిర్ణయించదు.
- issue: לֶחֶם הַפֶּחָה ను అక్షరార్థంగా లేదా సందర్భార్థంగా అనువదించడం
  choice: అధిపతికి రావలసిన ఆహారభత్యం
  alternative: అధిపతి రొట్టె / అధిపతి ఆహారం
  rationale: నెహెమ్యా 5లోని ఆర్థిక-పరిపాలనా సందర్భంలో ఇది అధిపతికి ప్రజల నుండి సమకూరే అధికారిక పోషణను సూచిస్తుంది. ‘ఆహారభత్యం’ సాధారణ పాఠకునికి ఆ భావాన్ని స్పష్టంగా అందిస్తుంది; అక్షరార్థం పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ‘అధిపతి’ పర్షియా ప్రాంతీయ పాలకుని పదవిని సాధారణ పాఠకునికి అర్థమయ్యేలా తెలుపుతుంది. కాలసూచనకు స్పష్టతనిస్తూ, మూలంలోని పన్నెండు సంవత్సరాల పునరుక్తిని నిలిపింది.
