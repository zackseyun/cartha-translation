source:
  edition: WLC
  text: וְ/יֵשׁ֙ אֲשֶׁ֣ר אֹמְרִ֔ים שְׂדֹתֵ֛י/נוּ וּ/כְרָמֵ֥י/נוּ וּ/בָתֵּ֖י/נוּ אֲנַ֣חְנוּ עֹרְבִ֑ים וְ/נִקְחָ֥ה דָגָ֖ן בָּ/רָעָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/003.yaml
  text: And there were others who said[a], “We are mortgaging our fields, our vineyards, and our houses to get grain during the famine.”
translation:
  language: te
  text: 'మరికొందరు ఇలా అన్నారు: “కరవు సమయంలో ధాన్యం పొందడానికి మా పొలాలను, ద్రాక్షతోటలను, ఇళ్లను మేము తాకట్టు పెడుతున్నాం[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మా పొలాలను, ద్రాక్షతోటలను, ఇళ్లను మేము హామీగా ఇస్తున్నాం.” హీబ్రూ క్రియ అప్పు కోసం ఆస్తిని భద్రతగా ఉంచడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: మరికొందరు ఇలా అన్నారు
  rationale: ఈ హీబ్రూ ప్రయోగం ఫిర్యాదు చేస్తున్న మరో వర్గాన్ని పరిచయం చేస్తుంది. ‘మరికొందరు’ ఆ సంభాషణా క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שְׂדֹתֵינוּ וּכְרָמֵינוּ וּבָתֵּינוּ
  choice: మా పొలాలను, ద్రాక్షతోటలను, ఇళ్లను
  rationale: మూడు ఆస్తి పదాల నిర్దిష్టతను, వాటి క్రమాన్ని నేరుగా నిలుపుతుంది.
- source_word: אֲנַחְנוּ עֹרְבִים
  choice: మేము తాకట్టు పెడుతున్నాం
  rationale: ఈ సందర్భంలో ערב అనే క్రియ అప్పు లేదా అవసరమైన సరుకు కోసం ఆస్తిని భద్రతగా ఉంచడాన్ని సూచిస్తుంది. ‘తాకట్టు పెడుతున్నాం’ ఆధునిక తెలుగులో స్పష్టమైన ఆర్థిక ప్రయోగం.
- source_word: וְנִקְחָה
  choice: సంపాదించుకోవడానికి
  rationale: ఈ రూపం ఇక్కడ ఆస్తిని తాకట్టు పెట్టే ఉద్దేశాన్ని సూచిస్తుంది. మూలక్రియలో కొనుగోలు విధానం స్పష్టంగా లేనందున ‘కొనడానికి’ అని కాక, ధాన్యం పొందడాన్ని తెలిపే ‘సంపాదించుకోవడానికి’ ఎంచుకోబడింది.
- source_word: דָגָן
  choice: ధాన్యం
  rationale: ఈ పదం ధాన్యపు పంట లేదా ఆహార ధాన్యాన్ని సూచిస్తుంది; విస్తృతమైన ‘ఆహారం’ కంటే ‘ధాన్యం’ మరింత ఖచ్చితం.
- source_word: בָּרָעָב
  choice: కరవు సమయంలో
  rationale: בְּ అనే విభక్తి ఇక్కడ పరిస్థితి లేదా కాలాన్ని సూచిస్తుంది. కారణార్థాన్ని బలవంతంగా చేర్చకుండా ‘కరవు సమయంలో’ మూలంలోని సందర్భార్థాన్ని నిలుపుతుంది.
