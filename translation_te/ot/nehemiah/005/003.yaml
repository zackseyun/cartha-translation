  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. ఆర్థిక సందర్భంలో సాధారణ పాఠకులకు స్పష్టంగా ఉండే ‘తాకట్టు పెట్టడం’ అనే పదబంధాన్ని ఎంచుకున్నాం; మూలంలోని ఆస్తుల జాబితా, కరవు పరిస్థితి యథాతథంగా నిలుపబడ్డాయి.
