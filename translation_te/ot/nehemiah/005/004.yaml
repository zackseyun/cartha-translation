  text: וְ/יֵשׁ֙ אֲשֶׁ֣ר אֹמְרִ֔ים לָוִ֥ינוּ כֶ֖סֶף לְ/מִדַּ֣ת הַ/מֶּ֑לֶךְ שְׂדֹתֵ֖י/נוּ וּ/כְרָמֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/004.yaml
  text: And there were those who said[b][a], “We have borrowed money for the king’s tax on our fields and our vineyards.”
translation:
  language: te
  text: 'ఇంకొందరు ఇలా అన్నారు: “మా పొలాల మీద, మా ద్రాక్షతోటల మీద రాజుకు చెల్లించాల్సిన పన్ను కోసం మేము డబ్బు[a] అప్పు తీసుకున్నాం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో “వెండి”; ఇక్కడ డబ్బు అనే అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: ఇంకొందరు ఇలా అన్నారు
  rationale: ఇది ముందటి ఫిర్యాదులకు తోడు మరో వర్గం చెప్పిన మాటలను పరిచయం చేస్తుంది. కథన సందర్భంలో సహజమైన తెలుగు భూతకాల రూపాన్ని వాడాం.
- source_word: לָוִינוּ
  choice: మేము అప్పు తీసుకున్నాం
  rationale: మూల క్రియకు ‘అప్పు తీసుకోవడం’ అనే స్పష్టమైన ఆర్థిక అర్థం ఉంది; ఆధునిక తెలుగులో ఇది సహజమైన ప్రయోగం.
- source_word: כֶסֶף
  choice: డబ్బు
  rationale: పదశః ‘వెండి’ అయినా, ఈ ఆర్థిక సందర్భంలో అది చెలామణి ధనాన్ని సూచిస్తుంది. అందువల్ల ‘డబ్బు’ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְמִדַּת הַמֶּלֶךְ
  choice: రాజుకు చెల్లించాల్సిన పన్ను కోసం
  rationale: ఈ పదబంధం రాజుకు విధిగా చెల్లించవలసిన అంచనా మొత్తాన్ని సూచిస్తుంది. ‘పన్ను’ ఆధునిక పాఠకులకు అత్యంత స్పష్టమైన సమానార్థకం.
- source_word: שְׂדֹתֵינוּ וּכְרָמֵינוּ
  choice: మా పొలాల మీద, మా ద్రాక్షతోటల మీద
  rationale: ఈ ఆస్తుల ఆధారంగా లేదా వాటిపై పన్ను విధించబడిందనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే కథనానికి తగిన గౌరవప్రదమైన శైలిలో అనువదించబడింది. ‘పన్ను’ అనే పదమే రాజుకు చెల్లించాల్సిన నిర్బంధ మొత్తాన్ని స్పష్టంగా తెలియజేస్తున్నందున ‘కప్పం’ అనే ప్రత్యామ్నాయానికి ప్రత్యేక పాదసూచిక ఇవ్వలేదు.
