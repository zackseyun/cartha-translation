source:
  edition: WLC
  text: זָכְרָ/ה לִּ֥/י אֱלֹהַ֖/י לְ/טוֹבָ֑ה כֹּ֥ל אֲשֶׁר עָשִׂ֖יתִי עַל הָ/עָ֥ם הַ/זֶּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/019.yaml
  text: Remember me[a], my God, for good, for all that I have done for this people.
translation:
  language: te
  text: నా దేవా, ఈ ప్రజల కోసం నేను చేసినదంతటికీ నన్ను మేలుకోసం జ్ఞాపకం చేసుకోండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను అనుకూలంగా జ్ఞాపకం చేసుకోండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרָה ... לִי
  choice: నన్ను జ్ఞాపకం చేసుకోండి
  rationale: זכר అనే క్రియతో వచ్చిన לִי ప్రార్థనా సందర్భంలో జ్ఞాపకం చేయబడే వ్యక్తిని సూచిస్తుంది. తెలుగులో సహజమైన గౌరవపూర్వక ప్రార్థనా వాక్యంగా ఇలా అనువదించాం.
- source_word: אֱלֹהַי
  choice: నా దేవా
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న రూపం ఇక్కడ ప్రత్యక్ష సంబోధన. ‘నా దేవా’ వ్యక్తిగత ప్రార్థనా స్వరాన్ని సహజంగా నిలుపుతుంది.
- source_word: לְטוֹבָה
  choice: నాకు మేలు కలిగేలా
  rationale: לְטוֹבָה అనుకూలమైన లేదా మేలు కలిగించే జ్ఞాపకాన్ని సూచిస్తుంది. తెలుగు పాఠకులకు స్పష్టంగా ఉండేందుకు ప్రయోజనార్థాన్ని సహజంగా వ్యక్తం చేశాం; ‘అనుకూలంగా’ అనే భావం కూడా సాధ్యమేనని పాదటిప్పణిలో ఉంచాం.
- source_word: כֹּל אֲשֶׁר עָשִׂיתִי
  choice: నేను చేసినదంతటినిబట్టి
  rationale: כֹּל אֲשֶׁר అంటే ‘చేసినదంతా’; సందర్భంలోని ప్రార్థనకు ఆధారాన్ని తెలిపే సంబంధాన్ని తెలుగులో ‘-నిబట్టి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַל הָעָם הַזֶּה
  choice: ఈ ప్రజల కోసం
  rationale: ఇక్కడ עַל ప్రజల పక్షాన లేదా వారి మేలు కోసం చేసిన కార్యాన్ని సూచిస్తుంది. ‘ఈ ప్రజల కోసం’ ఆ ప్రయోజనార్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: నెహెమ్యా దేవుడు తనను జ్ఞాపకం చేసుకోవాలని చేసిన ప్రార్థన స్వభావం
  choice: ప్రజల కోసం తాను చేసిన కార్యాల దృష్ట్యా దేవుడు తనను మేలుకై జ్ఞాపకం చేసుకోవాలని చేసిన విన్నపం
  alternative: బహిరంగంగా నిర్దోషిగా నిరూపించమనే విన్నపం లేదా తన క్రియలవల్ల ప్రతిఫలం సంపాదించాననే హక్కుదావా
  rationale: హీబ్రూ వాక్యం అనుకూలమైన దైవిక జ్ఞాపకాన్ని కోరుతుంది; అయితే అది ప్రతిఫలార్హతకు సంబంధించిన ఏ ప్రత్యేక సిద్ధాంతాన్నీ తప్పనిసరిగా స్థాపించదు. అందువల్ల ఆ వేదాంతపరమైన ఉద్వేగాన్ని పరిష్కరించకుండా పాఠ్యంలోనే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవపూర్వక ప్రార్థనా శైలిని ఉపయోగించాం. ‘జ్ఞాపకం చేసుకోండి’ అనే రూపం దైవసంబోధనలో గౌరవాన్ని చూపుతుంది; మూలంలోని వ్యక్తిగత విన్నపం, ప్రయోజనార్థం, ప్రజల కోసం చేసిన కార్యాల ప్రస్తావన అన్నీ నిలుపబడ్డాయి.
