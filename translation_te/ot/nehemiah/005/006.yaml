  text: I became very angry when I heard their outcry and these words[a].
translation:
  language: te
  text: వారి మొరను, ఈ మాటలను[a] విన్నప్పుడు నాకు చాలా కోపం వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ విషయాలను.’ హీబ్రూ పదం పలికిన మాటలను గానీ, నివేదించబడిన విషయాలను గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לִי
  choice: నాకు కోపం వచ్చింది
  rationale: హీబ్రూ జాతీయాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తూ, నెహెమ్యాలో కోపం రగిలిన భావాన్ని తెలియజేస్తుంది.
- source_word: מְאֹד
  choice: చాలా
  rationale: కోప తీవ్రతను స్పష్టమైన, సహజమైన ఆధునిక తెలుగు వాడుకలో తెలియజేస్తుంది.
- source_word: כַּאֲשֶׁר
  choice: విన్నప్పుడు
  rationale: సందర్భంలో ఇది నెహెమ్యా కోపానికి సంబంధించిన కాలపరిస్థితిని సూచిస్తుంది; తెలుగులో క్రియతో కలిపి అనువదించడం సహజం.
- source_word: שָׁמַעְתִּי
  choice: విన్నప్పుడు
  rationale: ఇక్కడ שמע ప్రజల మొరను, వారు చెప్పిన సంగతులను వినడాన్ని సూచిస్తుంది.
- source_word: זַעֲקָתָם
  choice: వారి మొరను
  rationale: זעקה బాధలో లేదా అన్యాయానికి వ్యతిరేకంగా చేసే తీవ్ర విజ్ఞప్తి లేదా కేకను సూచిస్తుంది; ‘మొర’ ఈ సామాజిక బాధ సందర్భంలో సహజంగా ఆ తీవ్రతను నిలుపుతుంది.
- source_word: וְאֵת הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలను
  rationale: דברים ఇక్కడ ‘మాటలు’ లేదా ‘విషయాలు’ అనే రెండు అర్థాలను అనుమతిస్తుంది. ప్రజలు చెప్పినదాన్ని నెహెమ్యా విన్న సందర్భంలో ‘ఈ మాటలను’ ప్రత్యక్షమైన ఎంపిక; ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
