    issue: “అన్యజనాలు” for הַגּוֹיִם
    rationale: This wording can carry a later ‘Gentiles’ association in Telugu and is less precise for the hostile surrounding nations in Nehemiah’s setting. “మన శత్రువులైన జాతులు” preserves the Hebrew apposition and historical sense.
  - severity: low
    issue: “నిందను బట్టి” is awkward
    rationale: Although it can express a causal relation, “నింద కారణంగా” is more natural modern Telugu and represents the main-text causal/motivational interpretation without adopting the footnote’s avoidance interpretation.
