source:
  edition: WLC
  text: ו/יאמר לֹא ט֥וֹב הַ/דָּבָ֖ר אֲשֶׁר אַתֶּ֣ם עֹשִׂ֑ים הֲ/ל֞וֹא בְּ/יִרְאַ֤ת אֱלֹהֵ֨י/נוּ֙ תֵּלֵ֔כוּ מֵ/חֶרְפַּ֖ת הַ/גּוֹיִ֥ם אוֹיְבֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/009.yaml
  text: So I said[a], “What you are doing is not good. Should you not walk in the fear of our God because of the reproach of the nations, our enemies?”
translation:
  language: te
  text: 'అప్పుడు నేను ఇలా అన్నాను: “మీరు చేస్తున్నది మంచిది కాదు. మన శత్రువులైన జాతుల నింద కారణంగా, మీరు మన దేవుని భయభక్తితో నడుచుకోవాలి కదా?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మన శత్రువులైన జాతుల నిందకు గురికాకుండా ఉండేందుకు, మీరు మన దేవుని భయభక్తితో నడుచుకోవాలి కదా?” హీబ్రూ ఉపసర్గ కారణాన్ని లేదా ఉద్దేశించిన నివారణను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు నేను ఇలా అన్నాను
  rationale: వావ్-వరుస కథనాన్ని ముందుకు తీసుకెళ్తుంది. ‘అప్పుడు’ సందర్భంలోని క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לֹא טוֹב
  choice: మంచిది కాదు
  rationale: హీబ్రూ మూలంలోని సూటియైన నైతిక మూల్యాంకనాన్ని అతివ్యాఖ్యానం చేయకుండా నిలుపుతుంది.
- source_word: הַדָּבָר אֲשֶׁר אַתֶּם עֹשִׂים
  choice: మీరు చేస్తున్నది
  rationale: హీబ్రూ నామవాచక నిర్మాణాన్ని అర్థం కోల్పోకుండా సహజమైన తెలుగులో సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: הֲלוֹא
  choice: నడుచుకోవాలి కదా?
  rationale: ఈ ప్రశ్నలోని అలంకారికతను, నైతిక విజ్ఞాపనను తెలుగు ప్రశ్నాంతకమైన ‘కదా?’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּיִרְאַת אֱלֹהֵינוּ
  choice: మన దేవునికి భయపడి
  rationale: יִרְאָה లోని భయభక్తుల భావాన్ని ‘భయపడి’ నిలుపుతుంది; కేవలం ‘గౌరవించి’ అని పలుచన చేయదు.
- source_word: תֵּלֵכוּ
  choice: నడుచుకోవాలి
  rationale: הלך అనే నైతిక జీవన రూపకాన్ని తెలుగులో అర్థమయ్యే ‘నడుచుకోవడం’ ద్వారా నిలుపుతుంది.
- source_word: מֵחֶרְפַּת
  choice: నిందను బట్టి
  rationale: מִן ఇక్కడ కారణం లేదా ప్రేరణను సూచించగలదు. ‘బట్టి’ ఆ సంబంధాన్ని ఉద్దేశపూర్వక నివారణగా పూర్తిగా నిర్ణయించకుండా ఉంచుతుంది.
- source_word: הַגּוֹיִם אֹיְבֵינוּ
  choice: మన శత్రువులైన అన్యజనాలు
  rationale: సందర్భంలోని విదేశీ ప్రజలను సూచిస్తుంది; ‘మన శత్రువులైన’ అనే విశేషణ నిర్మాణం హీబ్రూ సమానాధికార సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: הלך యొక్క నైతిక జీవన రూపకం
  choice: ‘నడుచుకోవాలి’ అనే రూపకాన్ని నిలుపడం
  alternative: ‘జీవించాలి’ లేదా ‘ప్రవర్తించాలి’
  rationale: ఈ వాక్యం దేవుని పట్ల భయభక్తులతో కూడిన ఒడంబడిక జీవనాన్ని కోరుతుంది. ‘నడుచుకోవాలి’ మూల రూపకాన్నీ దాని ధార్మిక గాఢతనూ నిలుపుతూ తెలుగులో సహజంగానే ఉంటుంది.
- issue: מֵחֶרְפַּת లో కారణార్థం లేదా నివారణార్థం
  choice: ప్రధాన పాఠ్యంలో ‘నిందను బట్టి’
  alternative: ‘నిందకు గురికాకుండా ఉండేందుకు’
  rationale: హీబ్రూ ఉపసర్గ కారణం/ప్రేరణను లేదా ఉద్దేశించిన నివారణను సూచించవచ్చు. ప్రధాన పాఠ్యం విస్తృత సంబంధాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో చూపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘దేవునికి భయపడి నడుచుకోవడం’ అనే బైబిలీయ నైతిక రూపకాన్ని నిలుపుతూ, వాక్యాన్ని సాధారణ పాఠకులకు స్పష్టంగా ఉంచాం.
