revisions:
- from: 'అప్పుడు నేను ఇలా అన్నాను: “మీరు చేస్తున్నది మంచిది కాదు. మన శత్రువులైన అన్యజనాల నిందను బట్టి, మీరు మన దేవునికి భయపడి నడుచుకోవాలి కదా?[a]”'
  to: 'అప్పుడు నేను ఇలా అన్నాను: “మీరు చేస్తున్నది మంచిది కాదు. మన శత్రువులైన జాతుల నింద కారణంగా, మీరు మన దేవుని భయభక్తితో నడుచుకోవాలి కదా?[a]”'
  rationale: The revision replaces potentially anachronistic “అన్యజనాలు” with contextually neutral “జాతులు,” improves natural Telugu syntax, and preserves both the Hebrew ethical-walking metaphor and the disputed causal/avoidance nuance through the existing footnote structure.
