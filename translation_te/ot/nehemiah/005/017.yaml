id: NEH.5.17
reference: Nehemiah 5:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/יְּהוּדִ֨ים וְ/הַ/סְּגָנִ֜ים מֵאָ֧ה וַ/חֲמִשִּׁ֣ים אִ֗ישׁ וְ/הַ/בָּאִ֥ים אֵלֵ֛י/נוּ מִן הַ/גּוֹיִ֥ם אֲשֶׁר סְבִיבֹתֵ֖י/נוּ עַל שֻׁלְחָנִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/017.yaml
  text: The Jews and the officials[a], a hundred and fifty men, and those who came to us from the nations that were around us[b], were at my table.
translation:
  language: te
  text: యూదులు[a], అధికారులు—మొత్తం నూట యాభై మంది—అలాగే మా చుట్టుపక్కల ఉన్న ప్రజల నుండి మా దగ్గరికి వచ్చినవారు నా బల్ల వద్ద భోజనం చేసేవారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదయ ప్రజలు.”
    reason: lexical_alternative
  - marker: b
    text: “నా బల్ల వద్ద భోజనం చేసేవారు” అంటే నెహెమ్యా తన ఆతిథ్యంలోను పరిపాలనా బాధ్యతలోను వారికి ఆహారం సమకూర్చాడని భావం.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַיְּהוּדִים
  choice: యూదులు
  rationale: ఈ సందర్భంలో యూద ప్రజలను సూచించే సహజమైన ఆధునిక తెలుగు పదం; భౌగోళికంగా ‘యూదయులు’ అనే అర్థం కూడా సాధ్యమని పాదటిప్పణిలో ఉంచాం.
- source_word: וְהַסְּגָנִים
  choice: అధికారులు
  rationale: పరిపాలనా బాధ్యతగల అధీన నాయకులను సూచిస్తుంది; నిర్దిష్ట పారసీక హోదాను అనవసరంగా నిర్ణయించకుండా సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: מֵאָה וַחֲמִשִּׁים אִישׁ
  choice: మొత్తం నూట యాభై మంది
  rationale: ఈ సంఖ్య యూదులు, అధికారులు కలిసిన సమూహాన్ని వివరిస్తున్నదని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהַבָּאִים אֵלֵינוּ
  choice: మా దగ్గరికి వచ్చినవారు
  rationale: హీబ్రూ కృదంతం ‘వస్తున్నవారు’ అని అక్షరార్థంగా ఉన్నా, గత పరిపాలనా పరిస్థితిని వివరించే సందర్భంలో తెలుగు భూతకాల రూపం సహజంగా ఉంటుంది.
- source_word: מִן הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵינוּ
  choice: మా చుట్టూ ఉన్న జనాల నుంచి
  rationale: పరిసర అన్యజన సమూహాలను సూచిస్తుంది; ‘అన్యజనులు’ వంటి వేదాంతపరంగా బరువైన పదాన్ని వాడకుండా భౌగోళిక భావాన్ని నిలుపుతుంది.
- source_word: עַל שֻׁלְחָנִי
  choice: నా భోజన బల్ల వద్ద ఉండేవారు
  rationale: ‘నా బల్లపై/వద్ద’ అనే మూల చిత్రాన్ని నిలుపుతూ, ఇది భోజన సందర్భమని సహజ తెలుగులో తెలియజేస్తుంది; నెహెమ్యా వారికి ఆహారం సమకూర్చాడనే భావాన్ని ప్రధాన వాక్యంలో అతిగా విప్పదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ఎబ్రీ మూలంలో లేని కాలసూచక ‘ఇప్పుడు’ను చేర్చలేదు. సంఖ్య సూచించే సమూహాన్ని డాష్‌లతో స్పష్టపరిచాం; ‘భోజన బల్ల’ అనే చిత్రాన్ని ఉంచి దాని సాంస్కృతిక భావాన్ని పాదటిప్పణిలో వివరించాం.
