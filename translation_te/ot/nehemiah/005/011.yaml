revisions:
- from: దయచేసి ఈ రోజే వారి పొలాలను, ద్రాక్షతోటలను, ఒలీవ తోటలను, ఇళ్లను వారికి తిరిగి ఇచ్చేయండి. అలాగే మీరు వారి దగ్గర వసూలు చేస్తున్న[b] డబ్బు, ధాన్యం, కొత్త ద్రాక్షారసం, నూనెలో నూరవ వంతును[a] కూడా తిరిగి ఇచ్చేయండి.
  to: దయచేసి ఈ రోజే వారి పొలాలను, ద్రాక్షతోటలను, ఆలివ్ తోటలను, ఇళ్లను వారికి తిరిగి ఇవ్వండి. అలాగే మీరు వారి నుండి వసూలు చేస్తున్న[b] డబ్బు, ధాన్యం, కొత్త ద్రాక్షారసం, నూనె—ఈ ప్రతి దానిలో నూరవ వంతును[a] కూడా వారికి తిరిగి ఇవ్వండి.
