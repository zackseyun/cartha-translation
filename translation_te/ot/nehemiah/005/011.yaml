id: NEH.5.11
reference: Nehemiah 5:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הָשִׁיבוּ֩ נָ֨א לָ/הֶ֜ם כְּ/הַ/יּ֗וֹם שְׂדֹתֵי/הֶ֛ם כַּרְמֵי/הֶ֥ם זֵיתֵי/הֶ֖ם וּ/בָתֵּי/הֶ֑ם וּ/מְאַ֨ת הַ/כֶּ֤סֶף וְ/הַ/דָּגָן֙ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָ֔ר אֲשֶׁ֥ר אַתֶּ֖ם נֹשִׁ֥ים בָּ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/011.yaml
  text: Please restore to them this very day their fields[a], their vineyards, their olive orchards, and their houses, and the hundredth part of the money, the grain, the new wine[b], and the oil that you have been exacting from them.
translation:
  language: te
  text: దయచేసి ఈ రోజే వారి పొలాలను, ద్రాక్షతోటలను, ఆలివ్ తోటలను, ఇళ్లను వారికి తిరిగి ఇవ్వండి. అలాగే మీరు వారి నుండి వసూలు చేస్తున్న[b] డబ్బు, ధాన్యం, కొత్త ద్రాక్షారసం, నూనె—ఈ ప్రతి దానిలో నూరవ వంతును[a] కూడా వారికి తిరిగి ఇవ్వండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నూరవ వంతు,” అంటే ఒక శాతం. ఇది వారి నుండి వసూలు చేస్తున్న భాగాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారికి వడ్డీకి ఇస్తున్న” లేదా “వారిపై వడ్డీ మోపుతున్న.”
    reason: alternative_reading
lexical_decisions:
- source_word: הָשִׁיבוּ
  choice: తిరిగి ఇచ్చేయండి
  rationale: హిఫీల్ ఆజ్ఞారూపం ‘తిరిగి వచ్చేలా చేయండి’ అనే భావంతో, స్వాధీనం చేసుకున్న ఆస్తి మరియు వసూలు చేసిన భాగం రెండింటికీ సహజంగా సరిపోతుంది.
- source_word: נָא
  choice: దయచేసి
  rationale: ఆజ్ఞను విజ్ఞాపనాత్మకంగా చేసే కణం; ఆధునిక తెలుగులో మర్యాదతో కూడిన బలమైన అభ్యర్థనను తెలియజేస్తుంది.
- source_word: כְּהַיּוֹם
  choice: ఈ రోజే
  rationale: వెంటనే చేయాలనే కాలపరమైన తక్షణతను, హెబ్రీలోని నొక్కిచెప్పే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שְׂדֹתֵיהֶם
  choice: వారి పొలాలు
  rationale: వ్యవసాయ భూములకు సాధారణమైన, స్పష్టమైన తెలుగు పదం.
- source_word: כַּרְמֵיהֶם
  choice: వారి ద్రాక్షతోటలు
  rationale: כרם అనే సాగుభూమి పదానికి ప్రామాణికమైన సమానార్థకం.
- source_word: זֵיתֵיהֶם
  choice: వారి ఒలీవ తోటలు
  rationale: వ్యక్తిగత చెట్లకంటే సాగు ఆస్తులను సూచించే సమాంతర జాబితా సందర్భాన్ని నిలుపుతుంది.
- source_word: וּבָתֵּיהֶם
  choice: వారి ఇళ్లు
  rationale: స్వాధీనం చేసుకున్న స్థిరాస్తుల జాబితాను సూటిగా అందిస్తుంది.
- source_word: וּמְאַת
  choice: నూరవ వంతు
  rationale: అక్షరార్థమైన భిన్నాన్ని నిలుపుతూ, దానిని నేరుగా వడ్డీ అని నిర్ధారించకుండా ఆర్థిక సందర్భంలోని అస్పష్టతను కాపాడుతుంది.
- source_word: הַכֶּסֶף
  choice: డబ్బు
  rationale: ‘వెండి’ అనే పదార్థార్థం ఉన్నప్పటికీ, రుణాలు మరియు వసూళ్ల సందర్భంలో ఆర్థిక కార్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַדָּגָן
  choice: ధాన్యం
  rationale: వివిధ తృణధాన్యాలను సూచించే సాధారణ వ్యవసాయ పదం.
- source_word: הַתִּירוֹשׁ
  choice: కొత్త ద్రాక్షారసం
  rationale: తీరోష్ సాధారణంగా కొత్తగా వచ్చిన ద్రాక్షారసాన్ని సూచిస్తుంది; ‘ద్రాక్షారసం’ మూల పదార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: הַיִּצְהָר
  choice: నూనె
  rationale: సందర్భంలో ప్రధానంగా ఒలీవ నూనె భావం ఉన్నా, మూలంలోని విస్తృత పదాన్ని అతిగా నిర్దిష్టం చేయకుండా ఉంచుతుంది.
- source_word: נֹשִׁים בָּהֶם
  choice: వారి దగ్గర వసూలు చేస్తున్న
  rationale: రుణదాతగా వ్యవహరించడం లేదా బాకీ రాబట్టడం అనే విస్తృత భావాన్ని నిలుపుతూ, ‘వడ్డీ వసూలు’ అనే సాంకేతిక అర్థాన్ని ప్రధాన పాఠంలో నిర్బంధంగా పెట్టదు.
theological_decisions:
- issue: సామాజిక న్యాయ సందర్భంలో נֹשִׁים అనే ఆర్థిక క్రియ యొక్క పరిధి
  choice: వారి దగ్గర వసూలు చేస్తున్న
  alternative: వారికి వడ్డీకి ఇస్తున్న / వారిపై వడ్డీ మోపుతున్న
  rationale: సందర్భం అణచివేసే రుణ పద్ధతులను ఖండిస్తున్నప్పటికీ, హెబ్రీ క్రియ రుణదాత చర్యను విస్తృతంగా సూచించగలదు. అందువల్ల నైతిక తీవ్రతను నిలుపుతూ, ఖచ్చితమైన ఆర్థిక విధానాన్ని పాఠంలో నిర్ణయించలేదు.
- issue: וּמְאַת యొక్క సంబంధం మరియు పరిమాణం
  choice: డబ్బు, ధాన్యం, కొత్త ద్రాక్షారసం, నూనెలో నూరవ వంతు
  alternative: వసూలు చేస్తున్న వడ్డీ లేదా శాతం అని వివరణాత్మకంగా అనువదించడం
  rationale: ‘నూరవ వంతు’ అనే మూల రూపాన్ని ఉంచడం ద్వారా ఒక శాతం అనే పరిమాణం తెలుస్తుంది; అది నెలవారీ వడ్డీయా, వేరే వసూలా అనే అంశాన్ని అనువాదం స్వయంగా తీర్మానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవపూర్వక బహువచన ఆజ్ఞారూపం వాడబడింది. వాక్యాన్ని చదవడానికి సులభంగా రెండు వాక్యాలుగా విభజించినా, ‘అలాగే’ మరియు పునరుక్త ఆజ్ఞ ద్వారా మూలంలోని ఒకే పునరుద్ధరణ ఆజ్ఞ యొక్క ఏకత్వం నిలుపబడింది. వ్యవసాయ, ఆర్థిక పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవభరితంగా ఎంపికయ్యాయి.
