source:
  edition: WLC
  text: וְ/עַתָּ֗ה כִּ/בְשַׂ֤ר אַחֵ֨י/נוּ֙ בְּשָׂרֵ֔/נוּ כִּ/בְנֵי/הֶ֖ם בָּנֵ֑י/נוּ וְ/הִנֵּ֣ה אֲנַ֣חְנוּ כֹ֠בְשִׁים אֶת בָּנֵ֨י/נוּ וְ/אֶת בְּנֹתֵ֜י/נוּ לַ/עֲבָדִ֗ים וְ/יֵ֨שׁ מִ/בְּנֹתֵ֤י/נוּ נִכְבָּשׁוֹת֙ וְ/אֵ֣ין לְ/אֵ֣ל יָדֵ֔/נוּ וּ/שְׂדֹתֵ֥י/נוּ וּ/כְרָמֵ֖י/נוּ לַ/אֲחֵרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/005.yaml
  text: And now[a], our flesh is like the flesh of our brothers, our children like their children; yet here we are, forcing our sons and our daughters into slavery, and some of our daughters have already been enslaved. But it is not in our power to help[b], and our fields and our vineyards belong to others.
translation:
  language: te
  text: ఇప్పుడు[a], మా సహోదరుల శరీరం ఎలాంటిదో మా శరీరమూ అలాంటిదే; వారి పిల్లలు ఎలాంటివారో మా పిల్లలూ అలాంటివారే. అయినా చూడండి, మా కుమారులను, కుమార్తెలను బానిసలుగా చేస్తున్నాం; మా కుమార్తెలలో కొందరు ఇప్పటికే బానిసలుగా చేయబడ్డారు. దీన్ని ఆపే శక్తి మాకు లేదు[b], ఎందుకంటే మా పొలాలు, ద్రాక్షతోటలు ఇతరుల వశంలో ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మేమూ మా సహోదరులంతే ఒకే మాంసశరీరము కలవారము.” హీబ్రూ ఉమ్మడి మానవత్వాన్ని, బంధుత్వాన్ని నొక్కిచెప్పడానికి ‘శరీరం’ అనే స్పష్టమైన ప్రతిమను ఉంచుతుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “మా చేతికి శక్తి లేదు.” తమ పొలాలు, ద్రాక్షతోటలు ఇతరుల వశంలో ఉండటంతో వారికి దాన్ని అడ్డుకునే సామర్థ్యమో సాధనాలో లేవని ఈ మాట తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּבְשַׂר אַחֵינוּ בְּשָׂרֵנוּ
  choice: మా సహోదరుల శరీరం ఎలాంటిదో మా శరీరమూ అలాంటిదే
  rationale: בשר అనే concrete పదానికి ‘శరీరం’ అని ఇచ్చి, ఒకే మానవత్వం మరియు బంధుత్వాన్ని తెలిపే హీబ్రూ పోలికను సహజమైన తెలుగులో నిలిపింది.
- source_word: אַחֵינוּ
  choice: మా సహోదరులు
  rationale: అక్షరార్థమైన పురుషలింగ బంధుత్వ పదాన్ని నిలిపి, సందర్భంలోని సమాజ సభ్యుల భావాన్ని అనవసరంగా విస్తరించలేదు.
- source_word: כִּבְנֵיהֶם בָּנֵינוּ
  choice: వారి పిల్లలు ఎలాంటివారో మా పిల్లలూ అలాంటివారే
  rationale: בנים ఇక్కడ సమూహార్థంలో పిల్లలను సూచిస్తుంది; తరువాత కుమారులు, కుమార్తెలు విడిగా ప్రస్తావించబడటం దీనికి మద్దతిస్తుంది.
- source_word: כֹבְשִׁים ... לַעֲבָדִים
  choice: బానిసలుగా చేయవలసి వస్తోంది
  rationale: כבשׁ యొక్క బలవంతపు లోబరచే భావాన్నీ, עבדים సూచించే బానిస స్థితినీ స్పష్టంగా తెలియజేస్తుంది; ‘వలసి వస్తోంది’ అప్పుల ఒత్తిడిలో తల్లిదండ్రుల నిర్బంధిత పరిస్థితిని చూపుతుంది.
- source_word: מִבְּנֹתֵינוּ נִכְבָּשׁוֹת
  choice: మా కుమార్తెలలో కొందరు ఇప్పటికే బానిసలయ్యారు
  rationale: నిఫాల్ రూపంలోని passive stateను, ఆ పరిస్థితి ఇప్పటికే సంభవించిందనే విలాపాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְאֵין לְאֵל יָדֵנוּ
  choice: దీన్ని ఆపే శక్తి మాకు లేదు
  rationale: ఇక్కడ אֵל దేవుని బిరుదుగా కాక ‘శక్తి/సామర్థ్యం’ అనే అర్థంలో ఉన్న హీబ్రూ నుడికారాన్ని సందర్భానుగుణంగా స్పష్టం చేస్తుంది.
- source_word: וּשְׂדֹתֵינוּ וּכְרָמֵינוּ לַאֲחֵרִים
  choice: మా పొలాలు, ద్రాక్షతోటలు ఇతరుల వశంలో ఉన్నాయి
  rationale: క్రియలేని హీబ్రూ వాక్యంలోని స్వాధీన భావాన్ని, వారి ఆర్థిక అశక్తతకు కారణమైన ఆస్తి నియంత్రణను తెలుగులో సహజంగా తెలుపుతుంది.
theological_decisions:
- issue: సామాజిక న్యాయ ఫిర్యాదులో బంధుత్వ భాష
  choice: ‘సహోదరులు’ను నిలిపి, పోలికలో ‘పిల్లలు’ను వాడటం
  alternative: అంతటా లింగతటస్థంగా ‘బంధువులు’ అనడం లేదా అంతటా ‘కుమారులు’ అనడం
  rationale: హీబ్రూ אַחֵינוּ లోని పురుషలింగ బంధుత్వ పదాన్ని నిలుపుతూ, בנים యొక్క సమూహార్థాన్ని సందర్భానుసారంగా అందిస్తుంది.
- issue: బానిసత్వ భాష యొక్క తీవ్రత
  choice: ‘బానిసలు/బానిసలయ్యారు’
  alternative: ‘సేవకులు/దాస్యసేవలో ఉన్నారు’
  rationale: ఈ వాక్యం పిల్లలను అప్పు కారణంగా బలవంతంగా బానిస స్థితిలోకి నెట్టడాన్ని వర్ణిస్తుంది; మృదువైన పదజాలం మూలంలోని తీవ్రతను తగ్గిస్తుంది.
- issue: אֵל యొక్క అర్థం
  choice: ‘శక్తి’
  alternative: దైవనామంగా ‘దేవుడు’
  rationale: לְאֵל יָדֵנוּ అనే నుడికారంలో సందర్భం సామర్థ్యం లేదా సాధనాల లేమిని సూచిస్తుంది; దైవనామంగా చదవడం వాక్యార్థాన్ని అసహజం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘శరీరం’ అనే హీబ్రూ concrete imageను నిలిపి, బానిసత్వాన్ని మృదువుచేయకుండా పేర్కొంది. మూలంలోని వరుస ‘మా’ రూపాలను సాధ్యమైనంతవరకు కాపాడి సామూహిక విలాప స్వరాన్ని నిలిపింది.
