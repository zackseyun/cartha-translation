review_pass:
  verdict: revise
  source_fidelity: The comparison of shared flesh/kinship, the collective sense of ‘children,’ the explicit reference to sons and daughters, the lack of power, and the loss of fields and vineyards are conveyed faithfully. However, ‘బానిసలుగా చేయవలసి వస్తోంది’ adds an explicit necessity (‘have to’) and weakens the active force of the Hebrew participle ‘we are subjecting/forcing.’ The passive description of the daughters should likewise make their having been subjected to slavery explicit.
  naturalness: The Telugu is generally clear and appropriately formal-modern. ‘బానిసలుగా చేస్తున్నాం’ is more direct, natural, and faithful than the periphrastic ‘చేయవలసి వస్తోంది.’
  terminology: ‘సహోదరులు,’ ‘పిల్లలు,’ ‘బానిసలు,’ ‘శక్తి,’ ‘పొలాలు,’ and ‘ద్రాక్షతోటలు’ are suitable. The slavery terminology should retain both the coercive active action and the passive outcome in the daughters’ clause.
  issues:
  - severity: medium
    issue: ‘చేయవలసి వస్తోంది’ introduces a necessity not explicitly stated in the Hebrew and obscures the active participial accusation.
    rationale: 'כֹבְשִׁים is an active participle: ‘we are forcing/subjecting.’ The economic distress explains the complaint but does not grammatically replace the parents’ active action with an expressed ‘must.’'
  - severity: medium
    issue: ‘బానిసలయ్యారు’ does not clearly retain the passive force of נִכְבָּשׁוֹת.
    rationale: The Niphal form portrays daughters who have been brought into bondage. An explicit passive Telugu expression better preserves this.
