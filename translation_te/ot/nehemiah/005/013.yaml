revisions:
- from: 'నేను నా వస్త్రపు మడతను కూడా దులిపి ఇలా అన్నాను[a]: “ఈ మాటను నిలబెట్టని ప్రతి మనిషినీ దేవుడు అతని ఇంటినుండి, అతని కష్టార్జితం నుండీ ఇలాగే దులిపివేయాలి; అతడు ఇలా దులిపివేయబడి, ఖాళీగా మిగలాలి.” అప్పుడు సమావేశమంతా, “ఆమేన్” అని చెప్పి యెహోవాను స్తుతించింది. ప్రజలు ఈ మాట ప్రకారమే చేశారు.'
  to: 'నేను కూడా నా వస్త్రపు మడతను దులిపి ఇలా అన్నాను[a]: “ఈ మాటను నిలబెట్టని ప్రతి మనిషిని దేవుడు అతని ఇంటినుండి, అతని కష్టార్జితం నుండీ ఇలాగే దులిపివేయుగాక; అతడు ఇలాగే దులిపివేయబడి ఖాళీగా ఉండుగాక.” అప్పుడు సమాజమంతా, “ఆమేన్” అని చెప్పి యాహ్వేను స్తుతించింది. ప్రజలు ఈ మాట ప్రకారమే చేశారు.'
  rationale: దైవనామాన్ని ప్రాజెక్టు విధానానికి అనుగుణంగా ‘యాహ్వే’గా మార్చాను. మూలంలోని శాపకోరిక స్వరాన్ని స్పష్టపరచడానికి క్రియారూపాలను కోరికార్థకంగా సవరించాను. הַקָּהָלకు ‘సమాజమంతా’ని వాడి, సమకూడిన ప్రజల భావాన్ని సహజంగా నిలిపాను. ఇతర పదచిత్రాలు, మూలభాషా సందిగ్ధత, మరియు పాదటిప్పణి అంకరును కాపాడాను.
