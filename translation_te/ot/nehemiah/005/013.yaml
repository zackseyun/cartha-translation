source:
  edition: WLC
  text: גַּם חָצְנִ֣/י נָעַ֗רְתִּי וָֽ/אֹמְרָ֡/ה כָּ֣כָה יְנַעֵ֪ר הָֽ/אֱלֹהִ֟ים אֶת כָּל הָ/אִישׁ֩ אֲשֶׁ֨ר לֹֽא יָקִ֜ים אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה מִ/בֵּית/וֹ֙ וּ/מִ֣/יגִיע֔/וֹ וְ/כָ֛כָה יִהְיֶ֥ה נָע֖וּר וָ/רֵ֑ק וַ/יֹּאמְר֨וּ כָֽל הַ/קָּהָ֜ל אָמֵ֗ן וַֽ/יְהַלְלוּ֙ אֶת יְהוָ֔ה וַ/יַּ֥עַשׂ הָ/עָ֖ם כַּ/דָּבָ֥ר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/013.yaml
  text: I also shook out the fold of my garment and said[a], “So may God shake out every man who does not fulfill this promise, from his house and from his labor; so may he be shaken out and emptied.” And all the assembly said, “Amen,” and praised Yahweh[c][b]. And the people did according to this promise.
translation:
  language: te
  text: 'నేను కూడా నా వస్త్రపు మడతను దులిపి ఇలా అన్నాను[a]: “ఈ మాటను నిలబెట్టని ప్రతి మనిషిని దేవుడు అతని ఇంటినుండి, అతని కష్టార్జితం నుండీ ఇలాగే దులిపివేయుగాక; అతడు ఇలాగే దులిపివేయబడి ఖాళీగా ఉండుగాక.” అప్పుడు సమాజమంతా, “ఆమేన్” అని చెప్పి యాహ్వేను స్తుతించింది. ప్రజలు ఈ మాట ప్రకారమే చేశారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నా వస్త్రపు మడత’ అని అనువదించిన హీబ్రూ పదం ‘నా ఒడి’ లేదా ‘వస్త్రపు ముందరి మడత’ అని కూడా అర్థమవుతుంది. ఆ మడతలో వస్తువులను ఉంచేవారు; దానిని దులపడం, ఆ వ్యక్తి తనకున్నదంతా కోల్పోవాలని సూచించే సంకేతాత్మక చర్య.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָצְנִי
  choice: నా వస్త్రపు మడత
  rationale: వస్తువులను ఉంచగల వస్త్రపు ముందుభాగపు మడతను సూచిస్తుంది; నెహెమ్యా చేసిన సంకేతాత్మక చర్యను స్పష్టంగా చూపుతుంది.
- source_word: נָעַרְתִּי / יְנַעֵר / נָעוּר
  choice: దులిపి / దులిపివేయాలి / దులిపివేయబడి
  rationale: ఒకే హీబ్రూ మూలపదపు పునరావృతాన్ని నిలుపుతూ, వస్త్రాన్ని ఖాళీ చేయడానికీ వ్యక్తిని ఆస్తి నుండి తొలగించడానికీ మధ్య ఉన్న పదచిత్రాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: יָקִים אֶת הַדָּבָר הַזֶּה
  choice: ఈ మాటను నిలబెట్టని
  rationale: చెప్పిన మాటను అమలు చేయడం లేదా నెరవేర్చడం అనే భావాన్ని ఇస్తుంది; ‘మాటను నిలబెట్టడం’ ఆధునిక తెలుగులో వాగ్దానపాలనను సహజంగా తెలియజేస్తుంది.
- source_word: מִבֵּיתוֹ וּמִיגִיעוֹ
  choice: అతని ఇంటినుండి, అతని కష్టార్జితం నుండీ
  rationale: יְגִיעַ శ్రమను లేదా శ్రమ ఫలితాన్ని సూచించగలదు. సందర్భంలో స్వాధీనాల నష్టమే ప్రధానంగా ఉన్నందున ‘కష్టార్జితం’ రెండు భావాలకు దగ్గరగా ఉంటుంది.
- source_word: וָרֵק
  choice: ఖాళీగా మిగలాలి
  rationale: దులిపివేసిన వస్త్రం ఖాళీ కావడం అనే సంకేతాన్ని, ఆ వ్యక్తి సమస్తం కోల్పోవడం అనే శాపార్థాన్ని నిలుపుతుంది.
- source_word: הַקָּהָל
  choice: సమావేశమంతా
  rationale: సమకూడిన సమాజమంతటినీ సూచిస్తుంది; మతశాఖాపరమైన ప్రత్యేక భావం లేకుండా సహజంగా ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని తెలుగులో సుపరిచితమైన ప్రత్యక్ష లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: כַדָּבָר הַזֶּה
  choice: ఈ మాట ప్రకారమే
  rationale: దీనికి ముందు చేసిన ప్రతిజ్ఞ/అంగీకారాన్ని సూచిస్తుంది; హీబ్రూ דָּבָר యొక్క ‘మాట/విషయం’ అనే విస్తృతతను అతిగా నిర్దిష్టం చేయకుండా కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో బిరుదు కాక దైవనామమే ఉంది. తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపం పేరును పేరుగానే నిలుపుతుంది; ‘యాహ్వే’ మరొక సముచిత లిప్యంతరీకరణ.
- issue: כָּל הָאִישׁ లోని ప్రతినిధి పుంలింగ ఏకవచనం
  choice: ప్రతి మనిషినీ
  alternative: ప్రతి ఒక్కరినీ
  rationale: మూలంలోని ఏకవచన ప్రతినిధి నిర్మాణాన్ని, పుంలింగ పదరూపాన్ని నిలుపుతుంది; సందర్భంలో ఇది వర్తించే ప్రతి వ్యక్తిని సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘దులిపి/దులిపివేయాలి/దులిపివేయబడి’ అనే పునరుక్తితో మూలంలోని సంకేతాత్మక పదచిత్రం నిలుపబడింది. ‘కష్టార్జితం’ శ్రమకూ దాని ఫలానికీ మధ్యనున్న మూలభాషా సందిగ్ధతను సాధ్యమైనంతవరకు కాపాడుతుంది.
