source:
  edition: WLC
  text: וַ/יָּבֹ֨א חֲנָ֜נִי אֶחָ֧ד מֵ/אַחַ֛/י ה֥וּא וַ/אֲנָשִׁ֖ים מִֽ/יהוּדָ֑ה וָ/אֶשְׁאָלֵ֞/ם עַל הַ/יְּהוּדִ֧ים הַ/פְּלֵיטָ֛ה אֲשֶֽׁר נִשְׁאֲר֥וּ מִן הַ/שֶּׁ֖בִי וְ/עַל יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/002.yaml
  text: Hanani[a], one of my brothers, came—he and some men from Judah—and I asked them about the Jews who had escaped, who were left from the captivity[c][b], and about Jerusalem.
translation:
  language: te
  text: నా సహోదరులలో ఒకడైన హనానీ, యూదా నుండి వచ్చిన కొందరు మనుషులతో కలిసి వచ్చాడు. చెర నుండి[b] తప్పించుకొని మిగిలిన యూదుల[a] గురించి, యెరూషలేము గురించి నేను వారిని అడిగాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యూదా ప్రజలు.’ హీబ్రూ పదం యూదా ప్రాంతపు ప్రజలను లేదా మరింత విస్తృతంగా యూదు ప్రజలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘తప్పించుకొని మిగిలిన’ అనే మాటలకు ‘బతికి బయటపడినవారు’ లేదా ‘శేషించినవారు’ అని కూడా అనువదించవచ్చు; ‘చెర నుండి’కు ‘ప్రవాసం నుండి’ అనేది ప్రత్యామ్నాయం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చాడు
  rationale: בוא యొక్క కథన రూపం సాధారణ భూతకాల గమనాన్ని సూచిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘వచ్చాడు’ సహజంగా ఉంటుంది.
- source_word: חֲנָנִי
  choice: హనానీ
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: אֶחָד מֵאַחַי הוּא
  choice: నా సహోదరులలో ఒకడైన
  rationale: ఇది హనానీని నెహెమ్యా సహోదరులలో ఒకడిగా గుర్తిస్తుంది. ‘సహోదరుడు’ కుటుంబ సంబంధాన్ని నిలుపుతుంది; విస్తృతమైన ‘బంధువు’ అనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: וַאֲנָשִׁים מִיהוּדָה
  choice: యూదా నుండి వచ్చిన కొందరు మనుషులతో కలిసి
  rationale: హనానీతో పాటు యూదా ప్రాంతం నుండి వచ్చిన వ్యక్తులు ఉన్నారని సహజ తెలుగులో తెలియజేస్తుంది; నిర్దిష్ట సంఖ్యను సూచించకుండా ‘కొందరు’ వాడాం.
- source_word: וָאֶשְׁאָלֵם עַל
  choice: వారి గురించి ... వారిని అడిగాను
  rationale: שׁאל మరియు עַל ఇక్కడ వ్యక్తులు, స్థలం గురించిన విచారణను సూచిస్తాయి; తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా అంశాలను ముందుంచి ‘అడిగాను’తో ముగించాం.
- source_word: הַיְּהוּדִים
  choice: యూదులు
  rationale: పర్షియా కాలపు సందర్భంలో ఈ పదం యూదా ప్రజలను లేదా మరింత విస్తృతంగా యూదు ప్రజలను సూచించగలదు; ప్రధాన పాఠంలో సుపరిచితమైన ‘యూదులు’ను ఉంచి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: הַפְּלֵיטָה אֲשֶׁר נִשְׁאֲרוּ
  choice: తప్పించుకొని మిగిలిన
  rationale: הַפְּלֵיטָהలోని తప్పించుకున్న/బతికి బయటపడిన సమూహ భావాన్ని, נִשְׁאֲרוּలోని మిగిలిన స్థితిని రెండింటినీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: מִן הַשֶּׁבִי
  choice: చెర నుండి
  rationale: שׁבי యొక్క బంధిత స్థితి లేదా చెర భావాన్ని నేరుగా ప్రతిబింబిస్తుంది; ‘ప్రవాసం’ కూడా సందర్భానుసార ప్రత్యామ్నాయం కావడంతో పాదటిప్పణిలో ఇచ్చాం.
- source_word: וְעַל יְרוּשָׁלִָם
  choice: యెరూషలేము గురించి
  rationale: మునుపటి עַל పదబంధానికి సమాంతరంగా విచారణలోని రెండవ అంశాన్ని సూచిస్తుంది.
