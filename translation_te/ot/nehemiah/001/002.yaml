  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలిని వాడాం. హీబ్రూ వాక్యంలోని రెండు విచారణ అంశాలను నిలుపుతూ, తెలుగు సహజ పదక్రమానికి అనుగుణంగా వాక్యాన్ని రెండు భాగాలుగా తీర్చిదిద్దాం.
