source:
  edition: WLC
  text: תְּהִ֣י נָ֣א אָזְנְ/ךָֽ קַשֶּׁ֣בֶת וְֽ/עֵינֶ֪י/ךָ פְתֻוּח֟וֹת לִ/שְׁמֹ֣עַ אֶל תְּפִלַּ֣ת עַבְדְּ/ךָ֡ אֲשֶׁ֣ר אָנֹכִי֩ מִתְפַּלֵּ֨ל לְ/פָנֶ֤י/ךָ הַ/יּוֹם֙ יוֹמָ֣ם וָ/לַ֔יְלָה עַל בְּנֵ֥י יִשְׂרָאֵ֖ל עֲבָדֶ֑י/ךָ וּ/מִתְוַדֶּ֗ה עַל חַטֹּ֤אות בְּנֵֽי יִשְׂרָאֵל֙ אֲשֶׁ֣ר חָטָ֣אנוּ לָ֔/ךְ וַ/אֲנִ֥י וּ/בֵית אָבִ֖/י חָטָֽאנוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/006.yaml
  text: Please let your ear be attentive and your eyes open to hear the prayer of your servant that I am now praying before you day and night, for the sons of Israel, your servants, while confessing the sins of the sons of Israel that we have sinned against you. I and my father's house have sinned.
translation:
  language: te
  text: దయచేసి నీ చెవి శ్రద్ధగా ఉండనీ, నీ కళ్లు తెరిచి ఉండనీ; నీ సేవకుడనైన నేను ఈ రోజు పగలూ రాత్రీ నీ సన్నిధిలో నీ సేవకులైన ఇశ్రాయేలు కుమారుల[a] కోసం చేస్తున్న ప్రార్థనను ఆలకించు. అందులోనే, ఇశ్రాయేలు కుమారుల పాపాలను—మేము నీకు విరోధంగా చేసిన పాపాలను—ఒప్పుకుంటున్నాను. నేనూ నా తండ్రి ఇంటివారూ పాపం చేశాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలు ప్రజలు,’ ‘ఇశ్రాయేలీయులు.’ హెబ్రీలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అని ఉంది; ఇది కుటుంబ-నిబంధనాత్మకమైన వ్యక్తీకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהִי נָא
  choice: దయచేసి ... ఉండనీ
  rationale: జస్సివ్ రూపంతో కూడిన נָא వినయపూర్వకమైన వేడుకోలును వ్యక్తం చేస్తుంది.
- source_word: אָזְנְךָ קַשֶּׁבֶת וְעֵינֶיךָ פְתֻחוֹת
  choice: నీ చెవి శ్రద్ధగా ఉండనీ, నీ కళ్లు తెరిచి ఉండనీ
  rationale: దేవుని శ్రద్ధను తెలిపే మూలంలోని శరీరావయవ రూపకాన్నీ, ఏకవచన ‘చెవి’ మరియు బహువచన ‘కళ్లు’ సమాంతరతనూ నిలుపుతుంది.
- source_word: לִשְׁמֹעַ אֶל תְּפִלַּת עַבְדְּךָ
  choice: నీ సేవకుడనైన ... నా ప్రార్థనను ఆలకించు
  rationale: తెలుగులో సహజమైన వాక్య నిర్మాణం కోసం ప్రార్థనను ఆలకించాలనే అభ్యర్థనను చివర ఉంచి, עבדను ప్రార్థనా సందర్భానికి తగిన ‘సేవకుడు’గా అనువదించాం.
- source_word: אֲשֶׁר אָנֹכִי מִתְפַּלֵּל לְפָנֶיךָ הַיּוֹם יוֹמָם וָלַיְלָה
  choice: నేను ఇప్పుడు నీ సన్నిధిలో పగలూ రాత్రీ ... ప్రార్థిస్తూ
  rationale: వర్తమాన కృదంతపు కొనసాగుతున్న క్రియను ‘ప్రార్థిస్తూ’ తెలియజేస్తుంది; הַיּוֹם యొక్క ప్రస్తుతకాల భావాన్ని ‘ఇప్పుడు’తో, יוֹמָם וָלַיְלָהను ‘పగలూ రాత్రీ’తో ప్రతిబింబిస్తుంది.
- source_word: עַל בְּנֵי יִשְׂרָאֵל עֲבָדֶיךָ
  choice: నీ సేవకులైన ఇశ్రాయేలు కుమారుల కోసం
  rationale: עַל ఇక్కడ మధ్యవర్తిత్వ ప్రార్థనలో ‘కోసం’ అనే భావం ఇస్తుంది; בְּנֵי అనే పుత్ర సంబంధ పదాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וּמִתְוַדֶּה
  choice: ఒప్పుకుంటున్నాను
  rationale: ముందటి కొనసాగుతున్న ప్రార్థనా క్రియతో సమకాలికంగా జరుగుతున్న పాపాంగీకారాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֲשֶׁר חָטָאנוּ לָךְ
  choice: మేము నీకు విరోధంగా పాపం చేశాము
  rationale: לָךְ ఇక్కడ పాపం దేవునికి విరోధంగా జరిగిందనే నైతిక దిశను సూచిస్తుంది.
- source_word: וַאֲנִי וּבֵית אָבִי
  choice: నేనూ నా తండ్రి ఇంటివారూ
  rationale: నెహెమ్యాను వ్యక్తిగతంగానూ అతని పితృకుటుంబాన్ని సమష్టిగానూ చేర్చుతుంది; తెలుగులో ‘ఇంటివారు’ కుటుంబ గృహ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: దేవునికి ‘చెవి,’ ‘కళ్లు’ అనే మానవరూప భాష
  choice: మూలంలోని మానవరూప ప్రార్థనా భాషను నేరుగా నిలిపాం
  alternative: ‘శ్రద్ధ చూపు’ అని శరీరావయవ రూపకాన్ని తొలగించడం
  rationale: దైవ శ్రద్ధను కోరే ప్రార్థన యొక్క కవితాత్మక సమాంతరతను హెబ్రీ పాఠం ఉద్దేశపూర్వకంగా ఉపయోగిస్తుంది; దానిని వ్యాఖ్యానాత్మకంగా సవరించలేదు.
- issue: בְּנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలు ప్రజలు / ఇశ్రాయేలీయులు
  rationale: మూలంలోని కుటుంబ-నిబంధనాత్మకమైన ‘కుమారులు’ అనే వ్యక్తీకరణను నిలుపుతూ, దాని సామూహిక సూచనను పాదసూచికలో వివరించాం.
- issue: సామూహిక పాపాంగీకారం మరియు వ్యక్తిగత బాధ్యత
  choice: ‘మేము’ అనే అంగీకారానంతరం ‘నేనూ నా తండ్రి ఇంటివారూ’ అనే ప్రత్యేక అంగీకారాన్ని నిలిపాం
  alternative: వ్యక్తిగత వాక్యాన్ని ముందటి సామూహిక అంగీకారంలో కలపడం
  rationale: హెబ్రీ పాఠంలోని సామూహిక బాధ్యత మరియు నెహెమ్యా వ్యక్తిగత/కుటుంబ బాధ్యత మధ్య ఉన్న ఒత్తిడిని పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన ప్రార్థనా శైలి. దేవునితో నేర సంబోధనలో ఏకవచన ‘నీ’ రూపాన్ని, మూలంలోని సమీపత మరియు నిరంతర సంబోధనను అనుసరించి వాడాం. పొడవైన హెబ్రీ వాక్యాన్ని తెలుగులో స్పష్టత కోసం విభజించినా భావ సంబంధాన్ని నిలిపాం.
