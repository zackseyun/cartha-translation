  text: אָנָּ֣א אֲדֹנָ֗/י תְּהִ֣י נָ֣א אָזְנְ/ךָֽ קַ֠שֶּׁבֶת אֶל תְּפִלַּ֨ת עַבְדְּ/ךָ֜ וְ/אֶל תְּפִלַּ֣ת עֲבָדֶ֗י/ךָ הַֽ/חֲפֵצִים֙ לְ/יִרְאָ֣ה אֶת שְׁמֶ֔/ךָ וְ/הַצְלִֽיחָ/ה נָּ֤א לְ/עַבְדְּ/ךָ֙ הַ/יּ֔וֹם וּ/תְנֵ֣/הוּ לְ/רַחֲמִ֔ים לִ/פְנֵ֖י הָ/אִ֣ישׁ הַ/זֶּ֑ה וַ/אֲנִ֛י הָיִ֥יתִי מַשְׁקֶ֖ה לַ/מֶּֽלֶךְ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/011.yaml
  text: Please[a], Lord, let your ear be attentive to the prayer of your servant and to the prayer of your servants who delight to fear your name, and please give success to your servant today and grant him compassion before this man[c][b]. Now I was cupbearer to the king.
translation:
  language: te
  text: ప్రభువా, దయచేసి[a], నీ సేవకుని ప్రార్థనకూ, నీ నామానికి భయపడాలని ఇష్టపడే నీ సేవకుల ప్రార్థనకూ నీ చెవి శ్రద్ధగా ఉండునుగాక. దయచేసి, ఈ రోజు నీ సేవకునికి విజయాన్ని కలిగించి, ఈ మనిషి[c] ఎదుట అతనికి దయ లభించేలా చేయు[b]. అప్పుడు నేను రాజుకు పానపాత్రవాహకుడిగా ఉన్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘విన్నవించుకుంటున్నాను.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఈ మనిషి ఎదుట అతనికి అనుగ్రహం లభించేలా చేయు.’ హీబ్రూ నుడికారం అక్షరార్థంగా ‘అతనిని కనికరాల కొరకు ఇవ్వు’ అని చెబుతుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘ఈ మనిషి’ అనేది రాజును సూచిస్తుంది; తరువాతి వాక్యంలో నెహెమ్యా తాను ఆ రాజుకు పానపాత్రవాహకుడినని చెబుతున్నాడు.
    reason: cross_reference
lexical_decisions:
- source_word: אָנָּא
  choice: దయచేసి
  rationale: విన్నపాన్ని బలపరిచే హీబ్రూ నిపాతం; ఆధునిక తెలుగులో సహజమైన, గౌరవపూర్వకమైన ప్రార్థనా అభ్యర్థన.
- source_word: אֲדֹנָי
  choice: ప్రభువా
  rationale: దేవునికి ప్రత్యక్ష సంబోధనగా ఉన్న బిరుదు; ఇది యెహోవా అనే చతురక్షర నామం కాదు.
- source_word: תְּהִי נָא אָזְנְךָ קַשֶּׁבֶת
  choice: నీ చెవి ఆలకించుగాక
  rationale: దేవుడు అనుకూలంగా వినాలని కోరే చెవి రూపకాన్ని కాపాడుతూ సహజమైన ప్రార్థనా భాషను వాడింది.
- source_word: תְּפִלַּת עַבְדְּךָ
  choice: నీ సేవకుడి ప్రార్థన
  rationale: దేవుని ఎదుట వినయపూర్వక స్వీయసూచనను తెలిపే నిర్మాణం.
- source_word: עֲבָדֶיךָ
  choice: నీ సేవకులు
  rationale: ఏకవచనంలోని పదంతో పదసామ్యాన్ని నిలుపుతూ దేవునికి అంకితమైన సమూహాన్ని సూచిస్తుంది.
- source_word: הַחֲפֵצִים
  choice: ఆనందించే
  rationale: ఈ కృదంతం ఇష్టపడడం లేదా ఆనందించడం అనే భావాన్ని కలిగి ఉంది; కోరిక అనే ప్రత్యామ్నాయ భావం పాదటిప్పణిలో ఉంచబడింది.
- source_word: לְיִרְאָה אֶת שְׁמֶךָ
  choice: నీ నామానికి భయపడడంలో
  rationale: భయభక్తులు, గౌరవం రెండూ కలిగిన హీబ్రూ వాడుకలోని ఉద్దేశపూర్వక ఉద్రిక్తతను ‘భయపడడం’ నిలుపుతుంది.
- source_word: וְהַצְלִיחָה נָּא
  choice: దయచేసి ... సఫలత అనుగ్రహించి
  rationale: హిఫీల్ ఆజ్ఞారూపం దేవుడే విజయవంతమైన ఫలితాన్ని కలిగించాలని చేసే విన్నపం.
- source_word: וּתְנֵהוּ לְרַחֲמִים
  choice: అతనికి కనికరం కలిగించు
  rationale: అక్షరార్థంగా ‘కనికరాల కోసం అతనిని ఇవ్వు’ అనే హీబ్రూ నుడికారాన్ని, నెహెమ్యా ఆ మనిషి చేత కనికరంతో చూడబడాలని చేసే విన్నపంగా సహజ తెలుగులో తెలిపింది.
- source_word: לִפְנֵי הָאִישׁ הַזֶּה
  choice: ఈ మనిషి ఎదుట
  rationale: నెహెమ్యా ప్రార్థనలో రాజును పేరు పెట్టకుండా సూచించే కొంత దూరీకరణ గల వ్యక్తీకరణను నిలిపింది.
- source_word: וַאֲנִי הָיִיתִי מַשְׁקֶה לַמֶּלֶךְ
  choice: అప్పుడు నేను రాజుకు పానపాత్రవాహకుడిగా ఉన్నాను
  rationale: ప్రార్థన నుంచి కథన వివరణకు మార్పును సూచిస్తూ నెహెమ్యా రాజసభ పదవిని స్పష్టంగా తెలిపింది.
theological_decisions:
- issue: ప్రార్థనా భాషలో עבד అనువాదం
  choice: సేవకుడు
  alternative: దాసుడు
  rationale: ఈ సందర్భంలో న్యాయపరమైన బానిసత్వం కంటే దేవుని ఎదుట వినయపూర్వకమైన విధేయత ప్రధానంగా ఉంది; అందువల్ల ‘సేవకుడు’ సందర్భోచితం.
- issue: దేవుని నామంతో ירא అనువాదం
  choice: నీ నామానికి భయపడడం
  alternative: నీ నామాన్ని భక్తితో గౌరవించడం / నీ నామం ఎదుట విస్మయభక్తితో నిలవడం
  rationale: హీబ్రూ పదంలో భయం, భక్తి, గౌరవం కలిసి ఉన్నాయి. ప్రధాన పాఠంలో ‘భయపడడం’ను ఉంచి దాని బైబిలు సంబంధమైన తీవ్రతను మృదువుపరచలేదు; ఇతర సాధ్యమైన భావాలను పాదటిప్పణిలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవపూర్వక ప్రార్థనా శైలిని వాడింది. హీబ్రూ చెవి రూపకాన్ని, ‘నీ నామానికి భయపడడం’ అనే బైబిలు నుడికారాన్ని, ‘ఈ మనిషి’ అనే ఉద్దేశపూర్వక సూచనను నిలిపింది. ‘పానపాత్రవాహకుడు’ రాజసభలో రాజుకు పానీయం అందించి దాని భద్రతను పర్యవేక్షించే పదవిని సూచిస్తుంది.
