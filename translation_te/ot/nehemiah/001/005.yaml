  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֹמַ֗ר אָֽנָּ֤א יְהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם הָ/אֵ֥ל הַ/גָּד֖וֹל וְ/הַ/נּוֹרָ֑א שֹׁמֵ֤ר הַ/בְּרִית֙ וָ/חֶ֔סֶד לְ/אֹהֲבָ֖י/ו וּ/לְ/שֹׁמְרֵ֥י מִצְוֺתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/005.yaml
  text: And I said[a], “Please, O Yahweh, God of heaven, the great and awesome God[b], who keeps the covenant and steadfast love for those who love him and keep his commandments,”
translation:
  language: te
  text: 'అప్పుడు నేను ఇలా అన్నాను: “దయచేసి, యాహ్వే, పరలోక దేవా, గొప్పవాడవును భయభక్తి కలిగించేవాడవునైన దేవా[a], నిన్ను ప్రేమించి నీ ఆజ్ఞలను పాటించేవారిపట్ల నిబంధననూ స్థిరమైన ప్రేమనూ కాపాడేవాడా,[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గొప్పవాడవును భయాన్ని కలిగించేవాడవునైన దేవా.”
    reason: נוֹרָא దేవుని పట్ల గౌరవభయాన్ని, భయాన్ని కలిగించే స్వభావాన్ని సూచించవచ్చు.
  - marker: b
    text: లేదా “నిబంధనా విశ్వసనీయతను”; సాంప్రదాయంగా “కృపను.”
    reason: חֶסֶד నిబంధన సందర్భంలో స్థిరమైన ప్రేమ, విశ్వసనీయత, కృప అనే పరస్పర సంబంధిత భావాలను కలిగి ఉంది.
lexical_decisions:
- source_word: וָאֹמַר
  choice: అప్పుడు నేను ఇలా అన్నాను
  rationale: వయ్యిక్తోల్ రూపం కథన క్రమంలో నెహెమ్యా ప్రార్థన మాటలను ప్రారంభిస్తుంది; ‘అప్పుడు’ క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אָנָּא
  choice: నీకు విన్నవించుకుంటున్నాను
  rationale: ప్రార్థనలో వినయపూర్వక విజ్ఞాపనను సూచించే కణం. తెలుగులో ‘దయచేసి’ కంటే ఈ సందర్భంలో ఇది సహజంగా, గౌరవంగా వినిపిస్తుంది; నిర్దిష్టంగా ‘విను’ వంటి క్రియను మూలంలో లేకుండానే చేర్చదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ప్రత్యక్ష లిప్యంతరీకరణతో వ్యక్తిగత నామంగా ఉంచింది.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: పరలోక దేవా
  rationale: ‘ఆకాశముల దేవుడు’ అనే మరింత పదానువాద రూపం కంటే ఆధునిక తెలుగులో సహజమైన సంబోధన; దేవుని పరలోకాధిపత్య భావాన్ని నిలుపుతుంది.
- source_word: הָאֵל הַגָּדוֹל וְהַנּוֹרָא
  choice: మహోన్నతుడవూ భయభక్తి పుట్టించేవాడవూ అయిన దేవా
  rationale: גָּדוֹל యొక్క గొప్పతనాన్ని ‘మహోన్నతుడు’ తెలియజేస్తుంది; נוֹרָאలోని భయం-విస్మయం కలిసిన భావాన్ని కేవలం ‘భయంకరుడు’గా కుదించకుండా ‘భయభక్తి పుట్టించేవాడు’గా వ్యక్తం చేసింది.
- source_word: שֹׁמֵר הַבְּרִית
  choice: నిబంధనను ... నిలబెట్టేవాడా
  rationale: שׁמר ఇక్కడ నిబంధనను కాపాడి నెరవేర్చే దేవుని విశ్వసనీయతను సూచిస్తుంది; ‘నిలబెట్టు’ సహజమైన తెలుగు నిబంధనా ప్రయోగం.
- source_word: וָחֶסֶד
  choice: స్థిరమైన ప్రేమను
  rationale: నిబంధన సందర్భంలోని חֶסֶד ప్రేమ, విశ్వసనీయత, విధేయతల సమృద్ధ భావాన్ని పాఠ్యంలో సులభంగా చదవదగిన రూపంలో ఇస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֺתָיו
  choice: నిన్ను ప్రేమిస్తూ నీ ఆజ్ఞలను పాటించేవారి పట్ల
  rationale: సమాంతర కృదంత పదబంధాలను ఒకే సహజ తెలుగు సంబంధవాచక నిర్మాణంలో కలిపి, రెండు లక్షణాలనూ సమానంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న నామరూపంతో నిలుపుకుంది.
- issue: נוֹרָאలోని భయము మరియు విస్మయము
  choice: భయభక్తి పుట్టించేవాడు
  alternative: భయంకరుడు
  rationale: ఈ రూపం దేవుడు గౌరవభరితమైన భయాన్ని కలిగిస్తాడనే భావాన్ని తెలియజేస్తుంది; కేవలం హానికరమైన భయాన్ని సూచించేలా అర్థాన్ని పరిమితం చేయదు.
- issue: నిబంధన సందర్భంలో חֶסֶד
  choice: స్థిరమైన ప్రేమ
  alternative: నిబంధనా విశ్వసనీయత
  rationale: ప్రేమ మరియు నిలకడ అనే రెండు ముఖ్య కోణాలను సాధారణ పాఠకునికి అర్థమయ్యేలా ఉంచుతూ, నిబంధనా విశ్వసనీయత అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో పరిరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలిని ఉపయోగించింది. సంబోధనలకు సహజమైన ‘దేవా/వాడా’ రూపాలు వాడబడ్డాయి. వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివర కామాను ఉంచింది; మూలంలోని నిబంధన–ప్రేమ జంటను విడదీయకుండా కాపాడింది.
