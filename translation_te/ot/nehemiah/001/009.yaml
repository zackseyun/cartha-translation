  naturalness: భాష ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంది. ‘సమకూర్చి ... తీసుకొస్తాను’ మరియు ‘నివసింపజేయడానికి’ వచన సందర్భానికి సరిపోతాయి.
