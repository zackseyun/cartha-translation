  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שַׁבְתֶּ֣ם אֵלַ֔/י וּ/שְׁמַרְתֶּם֙ מִצְוֺתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אִם יִהְיֶ֨ה נִֽדַּחֲ/כֶ֜ם בִּ/קְצֵ֤ה הַ/שָּׁמַ֨יִם֙ מִ/שָּׁ֣ם אֲקַבְּצֵ֔/ם ו/הבואתי/ם אֶל הַ/מָּק֔וֹם אֲשֶׁ֣ר בָּחַ֔רְתִּי לְ/שַׁכֵּ֥ן אֶת שְׁמִ֖/י שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/009.yaml
  text: but if you return to me and keep my commandments and do them[a], though your outcasts are at the end of the heavens, from there I will gather them and bring them to the place that I have chosen[c][b], to make my name dwell there.
translation:
  language: te
  text: కాని మీరు నా వైపు తిరిగి, నా ఆజ్ఞలను పాటించి వాటిని ఆచరిస్తే, మీ చెదరగొట్టబడినవారు[a] ఆకాశాల అంచున[b] ఉన్నా, అక్కడి నుండే నేను వారిని సమకూర్చి, నా నామాన్ని అక్కడ నివసింపజేయడానికి[c] నేను ఎంచుకున్న స్థలానికి వారిని తీసుకొస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మీ బహిష్కృతులు’ లేదా ‘మీ చెదరిపోయినవారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘ఆకాశాల అంచున.’ ఇది సాధ్యమైనంత సుదూరాన్ని సూచించే నానుడి.
    reason: cultural_note
  - marker: c
    text: ‘నా నామాన్ని అక్కడ ఉంచడానికి’ అని కూడా అనువదించవచ్చు. హీబ్రూ పాఠం దేవుని నామం ఆయన ఎంచుకున్న స్థలంలో నివసించే దృశ్యాన్ని నిలుపుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׁבְתֶּם אֵלַי
  choice: కాని మీరు నా వైపు తిరిగి
  rationale: שׁוּב తో אֶל కలిసినప్పుడు ‘తిరిగి రావడం/మళ్లడం’ అనే భావం వస్తుంది. మునుపటి వచనంలో ప్రారంభమైన షరతుకు కొనసాగింపుగా ‘కాని’ అనే వ్యతిరేక సంధిని ఉంచి, దేవుని వైపు తిరగడాన్ని సహజమైన తెలుగులో తెలిపింది.
- source_word: וּשְׁמַרְתֶּם מִצְוֺתַי
  choice: నా ఆజ్ఞలను పాటించి
  rationale: ఆజ్ఞల సందర్భంలో שׁמר అంటే వాటిని జాగ్రత్తగా గైకొని విధేయత చూపడం. ‘పాటించి’ ఆధునిక తెలుగులో సహజంగా ఉండి నిబంధన సంబంధమైన విధేయతను నిలుపుతుంది.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: వాటిని ఆచరిస్తే
  rationale: హీబ్రూ పాఠం ఆజ్ఞలను పాటించడాన్నీ వాటిని చేయడాన్నీ విడివిడిగా చెబుతుంది. ‘వాటిని ఆచరిస్తే’ ఆ పునరుక్తి భావాన్ని నిలుపుతూ సహజమైన తెలుగును ఇస్తుంది.
- source_word: נִדַּחֲכֶם
  choice: మీ చెదరగొట్టబడినవారు
  rationale: נדח బలవంతంగా దూరం చేయబడిన లేదా చెదరగొట్టబడిన ప్రజలను సూచిస్తుంది. ఈ రూపం ప్రవాస నేపథ్యాన్నీ కర్మణి భావాన్నీ నిలుపుతుంది.
- source_word: בִּקְצֵה הַשָּׁמַיִם
  choice: ఆకాశపు అంచున
  rationale: అత్యంత సుదూరాన్ని సూచించే హీబ్రూ విశ్వచిత్రణను ‘ఆకాశపు అంచు’ అనే గ్రాహ్యమైన తెలుగు రూపంలో నిలిపింది.
- source_word: מִשָּׁם אֲקַבְּצֵם
  choice: అక్కడి నుండే నేను వారిని సమకూర్చి
  rationale: קבץ చెదరిపోయిన ప్రజలను మళ్లీ ఒకచోట చేర్చడాన్ని సూచిస్తుంది. ‘సమకూర్చి’ పునఃసమీకరణ భావాన్ని తెలుపుతుంది; ‘నుండే’ దూరం ఎంతైనా అక్కడి నుండే అనే ఉద్ఘాటనను సహజంగా అందిస్తుంది.
- source_word: וַהֲבֹאתִים
  choice: వారిని తీసుకొస్తాను
  rationale: בוא యొక్క హిఫిల్ రూపం ‘రప్పించడం/తీసుకురావడం’ అనే కారణార్థాన్ని కలిగి ఉంది. ‘తీసుకొస్తాను’ తెలుగులో సహజమైన కారణార్థక వ్యక్తీకరణ.
- source_word: הַמָּקוֹם אֲשֶׁר בָּחַרְתִּי
  choice: నేను ఎంచుకున్న స్థలం
  rationale: בחר దేవుడు ఆరాధనా స్థలాన్ని ఎన్నుకోవడాన్ని సూచిస్తుంది. ‘ఎంచుకున్న’ ఆ ఎంపిక యొక్క కొనసాగుతున్న ప్రాముఖ్యతను సహజంగా తెలియజేస్తుంది.
- source_word: לְשַׁכֵּן אֶת שְׁמִי שָׁם
  choice: నా నామాన్ని అక్కడ నివసింపజేయడానికి
  rationale: שׁכן యొక్క కారణార్థక రూపాన్నీ దేవుని ‘నామం’ నివసించే దృశ్యాన్నీ ఈ అనువాదం స్పష్టంగా నిలుపుతుంది; దానిని కేవలం జ్ఞాపకార్థక గుర్తుగా మార్చదు.
theological_decisions:
- issue: ఎంచుకున్న స్థలంలో దేవుని సన్నిధిని తెలిపే ‘నామం నివసించడం’ అనే సూత్రం
  choice: నా నామాన్ని అక్కడ నివసింపజేయడానికి
  alternative: నా నామాన్ని అక్కడ ఉంచడానికి
  rationale: మూలంలోని నిబంధన–పరిశుద్ధస్థల భాష దేవుని నామం ఎంచుకున్న స్థలంలో ‘నివసించడం’ అనే దృశ్యాన్ని ఉంచుతుంది. ఈ రూపం ఆ స్థలంతో దేవుని ప్రత్యేక సంబంధాన్ని తెలియజేస్తూనే, దేవుని సంపూర్ణ అస్తిత్వం అక్కడికే పరిమితమని తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘నామం,’ ‘నివసింపజేయడానికి’ వంటి పదాలు మూలంలోని పరిశుద్ధస్థల దృశ్యాన్ని కాపాడేందుకు కొద్దిగా ఉన్నత శైలిలో ఉంచబడ్డాయి; మిగతా వాక్య నిర్మాణం సాధారణ పాఠకులకు సహజంగా ఉండేలా రూపొందించబడింది.
