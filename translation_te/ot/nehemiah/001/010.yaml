  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הֵ֥ם עֲבָדֶ֖י/ךָ וְ/עַמֶּ֑/ךָ אֲשֶׁ֤ר פָּדִ֨יתָ֙ בְּ/כֹחֲ/ךָ֣ הַ/גָּד֔וֹל וּ/בְ/יָדְ/ךָ֖ הַ/חֲזָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/010.yaml
  text: But they are your servants and your people[b][a], whom you redeemed by your great power and by your strong hand.
translation:
  language: te
  text: అయితే వారు నీ సేవకులు, నీ ప్రజలు; నీవు నీ గొప్ప శక్తితో, నీ బలమైన చేతితో[b] విమోచించినవారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘విడిపించినవారు’ లేదా ‘వెల చెల్లించి విడిపించినవారు’; హీబ్రూ క్రియ విడుదల కార్యం ద్వారా స్వేచ్ఛ కలిగించే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నీ శక్తిమంతమైన చేతితో’; హీబ్రూలో అక్షరార్థంగా ‘నీ బలమైన చేతితో’ అని ఉంది. ఇది దేవుని శక్తివంతమైన కార్యాన్ని సూచించే సాధారణ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: అయితే వారు
  rationale: ముందటి వచనాల్లోని పాపం, చెదరగొట్టబడటం అనే నేపథ్యానికి విరుద్ధంగా, వారు ఇంకా దేవునికి చెందినవారనే భావాన్ని సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: עֲבָדֶיךָ
  choice: నీ సేవకులు
  rationale: עבד దాసుడు అనే అర్థాన్నీ ఇవ్వగలిగినా, ఇక్కడ దేవునితో నిబంధనా సంబంధం ప్రధానంగా ఉంది; అందువల్ల ‘సేవకులు’ సహజమైనది.
- source_word: וְעַמֶּךָ
  choice: నీ ప్రజలు
  rationale: עם ఇక్కడ దేవునికి చెందిన సమాజాన్ని సమష్టిగా సూచిస్తుంది; స్వామ్యార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: פָּדִיתָ
  choice: విమోచించావు
  rationale: פדה విడుదల కలిగించడం, విడిపించడం, వెల చెల్లించి విడిపించడం వంటి భావవ్యాప్తి కలిగి ఉంది; ‘విమోచించావు’ నిర్గమ జ్ఞాపకంతో కూడిన నిబంధనా గంభీరతను నిలుపుతుంది.
- source_word: בְכֹחֲךָ הַגָּדוֹל
  choice: నీ గొప్ప శక్తితో
  rationale: כח కు ‘శక్తి’ సహజమైన తెలుగు సమానార్థకం; בְ సాధనాన్ని సూచిస్తున్నందున ‘తో’ అనువైనది.
- source_word: וּבְיָדְךָ הַחֲזָקָה
  choice: నీ బలమైన చేతితో
  rationale: హీబ్రూ రూపకాన్ని పారదర్శకంగా నిలుపుతూ, దేవుని ప్రభావవంతమైన కార్యాన్ని సూచిస్తుంది.
theological_decisions:
- issue: నెహెమ్యా ప్రార్థనలో విమోచనా భాష
  choice: విమోచించావు
  alternative: విడిపించావు; వెల చెల్లించి విడిపించావు
  rationale: ఈ మాట దేవుడు గతంలో చేసిన నిబంధనా విడుదల కార్యాన్ని, ముఖ్యంగా నిర్గమ ప్రతిధ్వనిని, సూచిస్తుంది. ‘విమోచించావు’ ఆ గంభీరతను నిలుపుతుంది; అయితే తరువాతి సిద్ధాంతార్థాలను వచనంలోకి బలవంతంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలి. మూలంలోని ‘బలమైన చేయి’ రూపకాన్ని నిలిపి, విమోచనా క్రియలోని అర్థవిస్తృతిని పాదసూచికలో భద్రపరిచాం.
