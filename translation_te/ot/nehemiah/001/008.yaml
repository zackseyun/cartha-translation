source:
  edition: WLC
  text: זְכָר נָא֙ אֶת הַ/דָּבָ֔ר אֲשֶׁ֥ר צִוִּ֛יתָ אֶת מֹשֶׁ֥ה עַבְדְּ/ךָ֖ לֵ/אמֹ֑ר אַתֶּ֣ם תִּמְעָ֔לוּ אֲנִ֕י אָפִ֥יץ אֶתְ/כֶ֖ם בָּ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/008.yaml
  text: Please remember the word that you commanded your servant Moses[a], saying, ‘If you act unfaithfully[b], I will scatter you among the peoples.’
translation:
  language: te
  text: '“దయచేసి, నీ సేవకుడైన మోషేకు నీవు ఇలా ఆజ్ఞాపించిన మాటను జ్ఞాపకం చేసుకో: ‘మీరు నమ్మకద్రోహం చేస్తే[a], నేను మిమ్మల్ని ప్రజల మధ్య[b] చెదరగొడతాను.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీరు నమ్మకంగా ఉండకపోతే’ లేదా ‘మీరు విశ్వాసాన్ని భంగపరిస్తే.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దేశాల మధ్య.’
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר נָא
  choice: దయచేసి ... జ్ఞాపకం చేసుకో
  rationale: זְכָר అనేది ‘జ్ఞాపకం చేసుకో’ అనే ఆజ్ఞార్థకం; נָא గౌరవపూర్వకమైన వేడుకోలును సూచిస్తుంది. ఈ పదక్రమం ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: הַדָּבָר
  choice: మాటను
  rationale: דָּבָר ఇక్కడ దేవుడు మోషేకు తెలిపిన నిర్దిష్ట వాక్యాన్ని సూచిస్తుంది. ‘మాట’ దాని విస్తృత అర్థాన్ని కాపాడుతుంది; దీనిని కేవలం ‘వాగ్దానం’గా పరిమితం చేయదు.
- source_word: צִוִּיתָ
  choice: ఆజ్ఞాపించిన
  rationale: צוה యొక్క ప్రత్యక్ష అర్థం ‘ఆజ్ఞాపించు.’ తరువాతి విషయం హెచ్చరికను కలిగి ఉన్నప్పటికీ, మూలపాఠం దానిని దేవుడు మోషేకు ఆజ్ఞాపించిన మాటగా పేర్కొంటుంది.
- source_word: עַבְדְּךָ
  choice: నీ సేవకుడైన
  rationale: మోషే దేవుని సేవలో ఉన్నవాడనే అధికారిక, సంబంధపూర్వక భావాన్ని ‘సేవకుడు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֵאמֹר
  choice: నీవు ఇలా అన్నావు
  rationale: ఉద్ధరణను పరిచయం చేసే לֵאמֹר భావాన్ని తెలుగులో సహజమైన ప్రత్యక్ష వాక్యంగా అందిస్తుంది.
- source_word: תִּמְעָלוּ
  choice: నమ్మకద్రోహంగా ప్రవర్తిస్తే
  rationale: מעל ఒడంబడిక సంబంధంలో విశ్వాసభంగం చేయడం లేదా నమ్మకాన్ని వమ్ము చేయడం అనే భావాన్ని కలిగి ఉంది. ‘పాపం చేస్తే’ కంటే ఈ ఎంపిక ఆ ప్రత్యేక భావాన్ని కాపాడుతుంది.
- source_word: אָפִיץ
  choice: చెదరగొడతాను
  rationale: פוץ యొక్క హిఫిల్ రూపం ఇతరులను చెదరగొట్టడం లేదా విస్తరింపజేయడం అనే కారణార్థక భావాన్ని ఇస్తుంది.
- source_word: בָּעַמִּים
  choice: జనాల మధ్య
  rationale: עַמִּים బహువచనంగా వివిధ ప్రజా సమూహాలను సూచిస్తుంది. ‘జనాల మధ్య’ తెలుగులో సహజంగా ఉండి, మూలంలోని బహువచన భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: షరతు వాక్యంలో מעל యొక్క ఒడంబడికపరమైన భావం
  choice: మీరు నమ్మకద్రోహంగా ప్రవర్తిస్తే
  alternative: మీరు విశ్వాసఘాతకులైతే; మీరు విశ్వాసాన్ని భంగపరిస్తే
  rationale: ఈ వాక్యం మోషే ద్వారా ఇచ్చిన ఒడంబడిక శిక్షను జ్ఞాపకం చేస్తుంది. ‘నమ్మకద్రోహంగా ప్రవర్తిస్తే’ అనేది నిర్దిష్ట న్యాయవర్గాన్ని బలవంతంగా చేర్చకుండా, సంబంధపూర్వక విశ్వాసభంగ భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలిని ఉపయోగించాం. దేవునితో ప్రత్యక్ష సంభాషణలో ఏకవచన ‘నీ/నీవు’ను నిలిపి, ఇశ్రాయేలు ప్రజలను ఉద్దేశించిన బహువచన ‘మీరు/మిమ్మల్ని’ను స్పష్టంగా వేరు చేశాం.
