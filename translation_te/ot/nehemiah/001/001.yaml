  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే కథనశైలి. మూలంలోని శీర్షికా నిర్మాణం, అస్పష్టమైన ‘ఇరవయ్యవ సంవత్సరం,’ మరియు కోట/దుర్గ భావపరిధి నిలుపబడ్డాయి.
