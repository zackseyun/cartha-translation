source:
  edition: WLC
  text: דִּבְרֵ֥י נְחֶמְיָ֖ה בֶּן חֲכַלְיָ֑ה וַ/יְהִ֤י בְ/חֹֽדֶשׁ כסלו שְׁנַ֣ת עֶשְׂרִ֔ים וַ/אֲנִ֥י הָיִ֖יתִי בְּ/שׁוּשַׁ֥ן הַ/בִּירָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/001.yaml
  text: The words of Nehemiah son of Hacaliah[a]. Now it happened in the month of Kislev, in the twentieth year, while I was in Susa the citadel[c][b],
translation:
  language: te
  text: 'హకల్యా కుమారుడైన నెహెమ్యా మాటలు[a]. ఇరవయ్యవ సంవత్సరంలో[b], కిస్లేవు నెలలో, నేను షూషను రాజదుర్గంలో[c] ఉన్నప్పుడు ఇలా జరిగింది:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హకల్యా కుమారుడైన నెహెమ్యా వృత్తాంతం.’ ‘మాటలు’ అనే హీబ్రూ శీర్షిక జ్ఞాపకాల వృత్తాంతాన్ని లేదా కథన నమోదును పరిచయం చేయవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో ‘ఇరవయ్యవ సంవత్సరంలో’ అని మాత్రమే ఉంది. అది ఎవరి పాలనలోని సంవత్సరమో ఈ వచనం స్పష్టంగా చెప్పదు; తరువాతి సందర్భం అర్తహషస్తను సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘షూషను దుర్గంలో.’ హీబ్రూ పదం బలపరచబడిన రాజప్రాసాద సముదాయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: మాటలు
  rationale: హీబ్రూ శీర్షికను సమీపంగా నిలుపుతూ, ఇది వృత్తాంతం లేదా జ్ఞాపకాల నమోదు అనే విస్తృత భావాన్ని కూడా అనుమతిస్తుంది.
- source_word: נְחֶמְיָה בֶּן חֲכַלְיָה
  choice: హకల్యా కుమారుడైన నెహెమ్యా
  rationale: వ్యక్తుల పేర్లను ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, సంబంధాన్ని సహజమైన తెలుగులో తెలిపింది.
- source_word: וַיְהִי
  choice: ఇలా జరిగింది
  rationale: కథనాన్ని ప్రారంభించే హీబ్రూ సూత్రప్రయోగాన్ని పురాతన శైలికి పోకుండా సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְחֹדֶשׁ כִּסְלֵו
  choice: కిస్లేవు నెలలో
  rationale: నెల పేరును లిప్యంతరీకరించి, తెలుగు తేదీప్రయోగ క్రమంలో సహజంగా అమర్చింది.
- source_word: שְׁנַת עֶשְׂרִים
  choice: ఇరవయ్యవ సంవత్సరంలో
  rationale: మూలంలో ఎవరి పాలనా సంవత్సరమో ఈ వచనంలో చెప్పలేదు; అందువల్ల ఆ సమాచారాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: וַאֲנִי הָיִיתִי
  choice: నేను ... ఉన్నప్పుడు
  rationale: కథకుడు ఆ సమయంలో ఉన్న పరిస్థితిని తెలుగులో సహజమైన కాలసంబంధ ఉపవాక్యంగా అందిస్తుంది.
- source_word: בְשׁוּשַׁן הַבִּירָה
  choice: షూషను కోటలో
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, בִּירָה సూచించే బలపరచబడిన రాజసముదాయ భావానికి ‘కోట’ను ఎంచుకుంది.
