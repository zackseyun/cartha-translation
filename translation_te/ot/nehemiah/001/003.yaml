  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֮ לִ/י֒ הַֽ/נִּשְׁאָרִ֞ים אֲשֶֽׁר נִשְׁאֲר֤וּ מִן הַ/שְּׁבִי֙ שָׁ֣ם בַּ/מְּדִינָ֔ה בְּ/רָעָ֥ה גְדֹלָ֖ה וּ/בְ/חֶרְפָּ֑ה וְ/חוֹמַ֤ת יְרוּשָׁלִַ֨ם֙ מְפֹרָ֔צֶת וּ/שְׁעָרֶ֖י/הָ נִצְּת֥וּ בָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/003.yaml
  text: And they said to me[a], “The remnant there in the province who survived the captivity are in great trouble and disgrace, and the wall of Jerusalem is broken down[b], and its gates have been burned with fire.”
translation:
  language: te
  text: 'వారు నాతో ఇలా అన్నారు: “చెరనుండి మిగిలిన శేషజనులు అక్కడ ఆ ప్రావిన్సులో తీవ్రమైన దుస్థితిలోను అవమానంలోను ఉన్నారు. యెరూషలేము ప్రాకారం కూలిపోయి ఉంది; దాని ద్వారాలు అగ్నితో కాల్చివేయబడ్డాయి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ לִי
  choice: వారు నాతో ఇలా అన్నారు
  rationale: సాధారణ కథన కొనసాగింపును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘ఇలా’ తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: הַנִּשְׁאָרִים אֲשֶׁר נִשְׁאֲרוּ
  choice: తప్పించుకొని ... మిగిలివున్నవారు
  rationale: שׁאר ధాతువు పునరుక్తిలో ఉన్న విపత్తు తరువాత మిగిలినవారనే భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది; ప్రత్యేక సాంకేతిక పదమైన ‘శేషజనులు’ను బలవంతంగా చేర్చదు.
- source_word: מִן הַשְּׁבִי
  choice: చెర నుంచి
  rationale: ఈ నామవాచకం చెర లేదా ప్రవాస స్థితిని సూచించగలదు. ‘చెర నుంచి’ మూలపాఠానికి దగ్గరగా ఉండగా, ‘ప్రవాసం నుంచి’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: שָׁם בַּמְּדִינָה
  choice: ఆ ప్రాంతంలో
  rationale: పర్షియా కాలపు పరిపాలనా భూభాగాన్ని సూచిస్తుంది. ‘ఆ ప్రాంతంలో’ సాధారణ పాఠకునికి సహజంగా ఉంటుంది; ‘ఆ రాష్ట్రంలో’ ఆధునిక రాజకీయ వ్యవస్థను అనవసరంగా సూచించవచ్చు.
- source_word: בְּרָעָה גְדֹלָה וּבְחֶרְפָּה
  choice: తీవ్రమైన దుస్థితిలో, అవమానంలో
  rationale: רָעָה ఇక్కడ నైతిక చెడును కాక తీవ్రమైన కష్టస్థితిని సూచిస్తుంది; חֶרְפָּה బహిరంగ నింద లేదా సామాజిక అవమానాన్ని సూచిస్తుంది.
- source_word: חוֹמַת יְרוּשָׁלִַם מְפֹרָצֶת
  choice: యెరూషలేము ప్రాకారం బీటలు వారిపోయి ఉంది
  rationale: פרץ రూపం ప్రాకారం ఛేదించబడిన లేదా అనేక చోట్ల తెగిపోయిన స్థితిని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం ప్రస్తుత శిథిల స్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: וּשְׁעָרֶיהָ נִצְּתוּ בָאֵשׁ
  choice: దాని ద్వారాలు అగ్నితో కాల్చివేయబడ్డాయి
  rationale: మూలంలోని ‘అగ్నితో’ అనే స్పష్టమైన సాధనప్రయోగాన్ని నిలుపుతూ, ద్వారాలు కాల్చి నాశనం చేయబడిన గత సంఘటనను తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘ప్రాకారం,’ ‘ద్వారాలు’ వంటి బైబిలు-చారిత్రక సందర్భానికి తగిన పదాలను ఉంచి, అత్యంత గ్రాంథికమైన నిర్మాణాలను నివారించాం. మూలపాఠంలోని చెర/ప్రవాసం మరియు అవమానం/నింద అర్థవిస్తృతిని పాదసూచికల్లో నిలిపాం.
