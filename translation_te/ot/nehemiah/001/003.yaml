  to: 'వారు నాతో ఇలా అన్నారు: “చెరనుండి మిగిలిన శేషజనులు అక్కడ ఆ ప్రావిన్సులో తీవ్రమైన దుస్థితిలోను అవమానంలోను ఉన్నారు. యెరూషలేము ప్రాకారం కూలిపోయి ఉంది; దాని ద్వారాలు అగ్నితో కాల్చివేయబడ్డాయి.”'
