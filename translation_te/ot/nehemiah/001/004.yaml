id: NEH.1.4
reference: Nehemiah 1:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֞י כְּ/שָׁמְעִ֣/י אֶת הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה יָשַׁ֨בְתִּי֙ וָֽ/אֶבְכֶּ֔ה וָ/אֶתְאַבְּלָ֖/ה יָמִ֑ים וָֽ/אֱהִ֥י צָם֙ וּ/מִתְפַּלֵּ֔ל לִ/פְנֵ֖י אֱלֹהֵ֥י הַ/שָּׁמָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/004.yaml
  text: And when I heard these words[a], I sat down and wept and mourned for days[b], and I was fasting and praying before the God of heaven.
translation:
  language: te
  text: ఈ మాటలు[a] విన్నప్పుడు నేను కూర్చున్నాను, ఏడ్చాను, రోజులు తరబడి దుఃఖించాను; పరలోక దేవుని సన్నిధిలో ఉపవాసం ఉంటూ, ప్రార్థిస్తూ ఉన్నాను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఈ సంగతులు.’ హెబ్రీ పదం דְּבָרִיםకు ‘మాటలు,’ ‘విషయాలు,’ లేదా ‘సంగతులు’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఉపవాసముండి ప్రార్థించాను.’ హెబ్రీలో היהతో కూడిన కృదంతాలు ఈ చర్యలు కొనసాగినట్లు సూచిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעִי
  choice: విన్నప్పుడు
  rationale: వావ్-వరుసతో కూడిన היה మరియు כְּ + క్రియానామ రూపం కథనంలోని కాలసంబంధాన్ని సూచిస్తాయి. తెలుగులో ‘విన్నప్పుడు’ సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది; ‘అప్పుడు జరిగినదేమంటే’ వంటి కృత్రిమ విస్తరణ అవసరం లేదు.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలు
  rationale: דְּבָרִים అనే పదానికి ‘మాటలు,’ ‘విషయాలు,’ ‘సంగతులు’ అనే అర్థాలు సాధ్యమైనవి. ఇక్కడ ముందుగా తెలియజేసిన నివేదికలోని మాటలను సూచించడం వల్ల ‘ఈ మాటలు’ సహజమైనదీ మూలానికి సమీపమైనదీ.
- source_word: יָשַׁבְתִּי
  choice: నేను కూర్చుండి
  rationale: ישׁב యొక్క ప్రాథమిక అర్థం ‘కూర్చోవడం.’ దుఃఖవార్తకు నెహెమ్యా చూపిన తక్షణ శారీరక ప్రతిస్పందనను ‘కూర్చుండి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וָאֶבְכֶּה
  choice: ఏడ్చాను
  rationale: בכה అంటే ‘ఏడవడం.’ ఆధునిక ప్రామాణిక తెలుగులో ఇది సహజమైన, ఖచ్చితమైన పదం.
- source_word: וָאֶתְאַבְּלָה
  choice: దుఃఖిస్తూ
  rationale: אבל దీర్ఘమైన లేదా ఆచారసంబంధమైన శోకాన్ని సూచించగలదు. ‘దుఃఖిస్తూ’ అనే రూపం తరువాతి ‘కొన్ని రోజులపాటు’తో సహజంగా కలసి, కొనసాగిన శోకాన్ని వ్యక్తం చేస్తుంది.
- source_word: יָמִים
  choice: కొన్ని రోజులపాటు
  rationale: బహువచనమైన ‘రోజులు’ ఇక్కడ కాలవ్యవధిని సూచిస్తుంది. నిర్దిష్ట సంఖ్య చెప్పబడనందున ‘కొన్ని రోజులపాటు’ తెలుగులో సహజంగా అనిశ్చిత బహువచన కాలాన్ని వ్యక్తం చేస్తుంది.
- source_word: וָאֱהִי צָם וּמִתְפַּלֵּל
  choice: ఉపవాసముండి ప్రార్థిస్తూ ఉన్నాను
  rationale: היה తో కూడిన రెండు కృదంతాలు కొనసాగుతున్న చర్యను సూచిస్తాయి. ‘ఉపవాసముండి ప్రార్థిస్తూ ఉన్నాను’ ఆ కాలవ్యాప్త భావాన్ని తెలుగులో నిలుపుతుంది.
- source_word: לִפְנֵי
  choice: సన్నిధిలో
  rationale: לִפְנֵי అంటే ‘ఎదుట’ లేదా ‘సన్నిధిలో.’ ప్రార్థనా సందర్భంలో ‘సన్నిధిలో’ సహజంగా ఉండి, దేవుని సమక్షంలో చేసిన చర్య అనే భావాన్ని కాపాడుతుంది.
- source_word: אֱלֹהֵי הַשָּׁמָיִם
  choice: పరలోక దేవుడు
  rationale: ఇది ఎజ్రా–నెహెమ్యా గ్రంథాల్లో కనిపించే దైవ బిరుదు. ‘పరలోక దేవుడు’ ఆధునిక తెలుగు బైబిలు శైలిలో సహజంగా ఉండి, ఇది యెహోవా అనే దైవనామం కాక ప్రత్యేక బిరుదు అన్న విషయాన్ని నిలుపుతుంది.
theological_decisions:
- issue: אֱלֹהֵי הַשָּׁמָיִם అనే దైవ బిరుదు అనువాదం
  choice: పరలోక దేవుడు
  alternative: ఆకాశముల దేవుడు
  rationale: ఈ పదబంధం ఇశ్రాయేలు దేవునికి వాడిన బిరుదే గాని, యెహోవా అనే దైవనామం కాదు. ‘పరలోక దేవుడు’ దాని బిరుదు స్వభావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; మూలంలో లేని ఒడంబడిక దైవనామాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వచనం. ‘సన్నిధిలో,’ ‘ఉపవాసముండి’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యే బైబిలు-సంబంధ గంభీరతను నిలుపుతాయి. దీర్ఘకాల చర్యను తెలుగులో స్పష్టంగా తెలియజేయడానికి కృదంత నిర్మాణం వాడబడింది.
