  yaml_path: translation/ot/nehemiah/001/007.yaml
  text: We have acted very corruptly against you and have not kept the commandments[a], the statutes[b], and the judgments that you commanded your servant Moses.
translation:
  language: te
  text: మేము నీకు విరోధంగా ఎంతో చెడుగా ప్రవర్తించాము. నీ సేవకుడైన మోషేకు నీవు ఆజ్ఞాపించిన ఆజ్ఞలను, శాసనాలను, న్యాయనిర్ణయాలను[a] మేము పాటించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “న్యాయనిర్ణయాలు” అనే హెబ్రీ పదాన్ని “నియమాలు” లేదా “న్యాయవిధులు” అని కూడా అనువదించవచ్చు; అది న్యాయపరమైన తీర్పులను లేదా ప్రత్యేక సందర్భాలకు వర్తించే చట్టాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבֹל חָבַלְנוּ
  choice: ఎంతో చెడుగా ప్రవర్తించాము
  rationale: అనంతక్రియారూపంతో కూడిన సమాపక క్రియ హెబ్రీలో క్రియాభావాన్ని బలపరుస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘ఎంతో’ ఆ ఉద్ఘాటనను తెలియజేస్తుంది; మూలధాతువు ఇక్కడ నాశనం చేయడాన్ని కాక చెడు ప్రవర్తనను సూచిస్తుంది.
- source_word: לָךְ
  choice: నీకు విరోధంగా
  rationale: పాపాంగీకార సందర్భంలో ఈ విభక్తి దేవునితో సంబంధానికి విరుద్ధంగా చేసిన అపరాధాన్ని సూచిస్తుంది. ‘నీకు విరోధంగా’ ఆ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: שָׁמַרְנוּ
  choice: పాటించలేదు
  rationale: ఆజ్ఞలు, శాసనాల సందర్భంలో שׁמר అంటే వాటిని గైకొనడం లేదా పాటించడం. ఆధునిక తెలుగులో ‘పాటించలేదు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: הַמִּצְוֺת
  choice: ఆజ్ఞలను
  rationale: ఈ పదం ఆజ్ఞాపించబడిన విధులను సూచిస్తుంది. ‘ఆజ్ఞలు’ దాని అధికారిక, నిబంధనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: הַחֻקִּים
  choice: శాసనాలను
  rationale: ఈ పదం స్థిరంగా నిర్దేశించిన చట్టాలను లేదా విధులను సూచిస్తుంది. మిగతా రెండు తోరా పదాలనుంచి భేదాన్ని నిలుపుతూ ‘శాసనాలు’ చట్టపరమైన భావాన్ని అందిస్తుంది.
- source_word: הַמִּשְׁפָּטִים
  choice: న్యాయనిర్ణయాలను
  rationale: ఈ పదం న్యాయపరమైన తీర్పులు, కేసు చట్టాలు లేదా నియమాలను సూచించగలదు. ‘న్యాయనిర్ణయాలు’ దాని న్యాయసంబంధ ఛాయను, ఇతర రెండు పదాలతో ఉన్న భేదాన్ని కాపాడుతుంది.
- source_word: צִוִּיתָ
  choice: నీవు ఆజ్ఞాపించిన
  rationale: క్రియ నేరుగా ఆజ్ఞాపించడాన్ని సూచిస్తుంది; ఈ అనువాదం దైవిక అధికారాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: עַבְדֶּךָ
  choice: నీ సేవకుడైన
  rationale: עבד అంటే దాసుడు లేదా సేవకుడు కావచ్చు. దేవునితో మోషే సంబంధాన్ని తెలిపే బిరుదుగా ‘సేవకుడు’ సందర్భోచితంగా, గౌరవప్రదంగా ఉంది.
theological_decisions:
- issue: తోరాకు సంబంధించిన మూడు పదాల ప్రత్యేకతను నిలుపడం
  choice: ఆజ్ఞలు, శాసనాలు, న్యాయనిర్ణయాలు
  alternative: ఆదేశాలు, కట్టడలు, నియమాలు
  rationale: హెబ్రీ మూలం మూడు వేర్వేరు న్యాయ-నిబంధన పదాలను ఉపయోగిస్తుంది. వాటిని ఒకే సాధారణ భావంలో కలపకుండా పదభేదాన్ని నిలపడం మూలంలోని నిబంధనాత్మక, చట్టపరమైన స్వరూపాన్ని కాపాడుతుంది; వాటికి కృత్రిమమైన సిద్ధాంత విభజనను కూడా ఆపాదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనలోని పాపాంగీకారానికి తగిన గంభీరమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. హెబ్రీ ఉద్ఘాటనను సహజమైన ‘ఎంతో’తో వ్యక్తం చేసి, మూడు చట్టపరమైన పదాల భేదాన్ని నిలిపాము.
