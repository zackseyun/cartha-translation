  yaml_path: translation/ot/ruth/002/005.yaml
  text: Then Boaz said to his young man who was set over the reapers[a], “Whose young woman is this?”
translation:
  language: te
  text: 'అప్పుడు బోయజు కోత కోసేవారిపై నియమించబడిన తన యువకునితో ఇలా అడిగాడు: “ఈ యువతి ఎవరిది?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ యువతి ఎవరికి చెందినది?” హీబ్రూ ప్రశ్న ఆమె కుటుంబం లేదా ఇంటివారితో ఆమెకున్న అనుబంధం గురించి అడుగుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అడిగాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ప్రశ్నను పరిచయం చేస్తున్నందున తెలుగులో ‘అప్పుడు ... అని అడిగాడు’ సహజంగా ఉంటుంది.
- source_word: בֹּעַז
  choice: బోయజు
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: לְנַעֲרוֹ
  choice: తన యువకునితో
  rationale: נַעַר అనే పదంలోని ‘యువకుడు/సేవకుడు’ భావాల్లో, మూలపదపు ప్రాథమిక వయోభావాన్ని నిలుపుతూ అతని పర్యవేక్షక పాత్రను తరువాతి పదబంధం ద్వారా తెలియజేశాం.
- source_word: הַנִּצָּב עַל הַקּוֹצְרִים
  choice: కోత కోసేవారిపై నియమించబడిన
  rationale: నిఫాల్ రూపంలోని నియమింపబడిన/నిలపబడిన భావాన్నీ, עַל సూచించే పర్యవేక్షణ సంబంధాన్నీ నిలుపుతుంది.
- source_word: לְמִי
  choice: ఎవరిది
  rationale: ఈ హీబ్రూ ప్రయోగం ఆమె ఎవరి కుటుంబానికి లేదా గృహానికి చెందినదో అడుగుతుంది; ‘ఎవరిది’ సంక్షిప్తంగా, సహజంగా ఉండి అసలు సామాజిక అనుబంధ భావాన్ని కాపాడుతుంది.
- source_word: הַנַּעֲרָה
  choice: యువతి
  rationale: נַעֲרָה ఒక యువ స్త్రీని సూచిస్తుంది; ‘యువతి’ ఆధునిక, గౌరవప్రదమైన పదం, సేవకురాలు అనే స్థితిని అనవసరంగా చేర్చదు.
- source_word: הַזֹּאת
  choice: ఈ
  rationale: నామవాచకాన్ని విశేషించే సాధారణ సూచనార్థక పదానికి సహజమైన తెలుగు సమానం.
