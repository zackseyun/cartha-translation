  text: וַ/יֹּאמֶר֩ לָ֨/ה בֹ֜עַז לְ/עֵ֣ת הָ/אֹ֗כֶל גֹּ֤שִֽׁי הֲלֹם֙ וְ/אָכַ֣לְתְּ מִן הַ/לֶּ֔חֶם וְ/טָבַ֥לְתְּ פִּתֵּ֖/ךְ בַּ/חֹ֑מֶץ וַ/תֵּ֨שֶׁב֙ מִ/צַּ֣ד הַ/קּֽוֹצְרִ֔ים וַ/יִּצְבָּט לָ֣/הּ קָלִ֔י וַ/תֹּ֥אכַל וַ/תִּשְׂבַּ֖ע וַ/תֹּתַֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/014.yaml
  text: At mealtime Boaz said to her[a], “Come here and eat some bread, and dip your piece in the sour wine.” So she sat beside the reapers, and he passed her roasted grain. She ate and was satisfied, and she had some left over.
translation:
  language: te
  text: భోజన సమయంలో బోయజు ఆమెతో, “ఇక్కడికి వచ్చి కొంత రొట్టె తిను; నీ రొట్టె ముక్కను పుల్లని ద్రాక్షారసంలో ముంచుకో[a]” అన్నాడు. ఆమె పంట కోసేవారి పక్కన కూర్చుంది. అతడు ఆమెకు కాల్చిన ధాన్యం అందించాడు. ఆమె తిని తృప్తిపడింది; ఆమె దగ్గర ఇంకా కొంత మిగిలింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ ముక్కను వెనిగర్‌లో ముంచుకో.” హీబ్రూ పదం חֹמֶץ వెనిగరునుగానీ పుల్లని ద్రాక్షారస పానీయాన్నిగానీ సూచించవచ్చు; ఈ వ్యవసాయ భోజన సందర్భంలో పుల్లని ద్రాక్షారసం ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת הָאֹכֶל
  choice: భోజన సమయంలో
  rationale: పనివారు భోజనం చేసే వేళను సూచించే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: גֹּשִׁי הֲלֹם
  choice: ఇక్కడికి వచ్చి
  rationale: దగ్గరకు రమ్మనే ప్రత్యక్ష ఆహ్వానాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְאָכַלְתְּ מִן הַלֶּחֶם
  choice: కొంత రొట్టె తిను
  rationale: מִן పదంలోని భాగార్థాన్ని ‘కొంత’ ద్వారా స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְטָבַלְתְּ פִּתֵּךְ בַּחֹמֶץ
  choice: నీ రొట్టె ముక్కను పుల్లని ద్రాక్షారసంలో ముంచుకో
  rationale: פַּת ఇక్కడ భోజన సందర్భంలో రొట్టె ముక్కను సూచిస్తుంది. חֹמֶץ పులిసిన ద్రాక్షారస పానీయాన్నిగానీ వెనిగరునుగానీ సూచించవచ్చు; వ్యవసాయ కూలీల భోజన సందర్భంలో పుల్లని ద్రాక్షారసం సంభావ్యమైన అర్థం. ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: מִצַּד הַקּוֹצְרִים
  choice: కోత కోసేవారి పక్కన
  rationale: వారి పక్కనే ఉన్న స్థానాన్ని, వ్యవసాయ నేపథ్యాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: וַיִּצְבָּט לָהּ קָלִי
  choice: అతడు ఆమెకు వేయించిన ధాన్యం అందించాడు
  rationale: అరుదైన క్రియ సందర్భంలో ఆహారాన్ని ఆమెకు చాచి ఇవ్వడం లేదా అందించడం అనే భావాన్ని ఇస్తుంది. קָלִי కాల్చిన లేదా వేయించిన ధాన్యాన్ని సూచిస్తుంది.
- source_word: וַתִּשְׂבַּע
  choice: తృప్తిపడింది
  rationale: ఆమె కడుపునిండా తిని సంతృప్తి పొందిందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַתֹּתַר
  choice: ఇంకా కొంత మిగుల్చుకుంది
  rationale: స్త్రీలింగ ఏకవచన క్రియాశ్రేణిని అనుసరించి, తిన్న తరువాత కూడా ఆమె వద్ద ఆహారం కొంత మిగిలిందనే భావాన్ని వ్యక్తం చేస్తుంది.
