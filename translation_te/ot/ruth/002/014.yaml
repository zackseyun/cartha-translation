- from: భోజన సమయంలో బోయజు ఆమెతో, “ఇక్కడికి వచ్చి కొంత రొట్టె తిను; నీ రొట్టె ముక్కను పుల్లని ద్రాక్షారసంలో ముంచుకో[a]” అన్నాడు. ఆమె కోత కోసేవారి పక్కన కూర్చుంది. అతడు ఆమెకు వేయించిన ధాన్యం అందించాడు. ఆమె తిని తృప్తిపడింది; ఇంకా కొంత మిగుల్చుకుంది.
