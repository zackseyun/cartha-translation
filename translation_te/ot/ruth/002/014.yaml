  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. కథనంలోని వ్యవసాయ నేపథ్యం స్పష్టంగా ఉండేందుకు ‘కోత కోసేవారు’, ‘వేయించిన ధాన్యం’ అనే పదబంధాలు ఎంచుకున్నాం. חֹמֶץ పదంలోని నిజమైన అర్థసందిగ్ధతను పాదసూచికలో నిలిపాం.
