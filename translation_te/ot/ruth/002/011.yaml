revisions:
- from: 'అప్పుడు బోయజు ఆమెకు ఇలా జవాబిచ్చాడు: “నీ భర్త చనిపోయిన తర్వాత నీవు నీ అత్తకు చేసినదంతా, అలాగే నీ తండ్రిని, నీ తల్లిని, నీవు పుట్టిన దేశాన్ని విడిచిపెట్టి, ఇంతకుముందు నీకు తెలియని ప్రజల దగ్గరికి వచ్చిన సంగతీ నాకు పూర్తిగా తెలిసింది.[a]”'
  to: 'అప్పుడు బోయజు ఆమెతో ఇలా అన్నాడు: “నీ భర్త చనిపోయిన తర్వాత నీవు నీ అత్త కోసం చేసినదంతా, నీ తండ్రినీ తల్లినీ, నీవు పుట్టిన నేలనూ విడిచిపెట్టి, ఇంతకుముందు నీకు తెలియని[a] ప్రజల దగ్గరకు వెళ్లిన సంగతంతా నాకు వివరంగా తెలియజేయబడింది.”'
  rationale: The revision retains the draft's meaning and register while rendering the Hebrew passive report more faithfully, restoring ‘went’ for הלך, using ‘land’ rather than ‘country,’ and moving the footnote anchor to the idiom it documents.
