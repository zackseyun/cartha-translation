id: RUT.2.11
reference: Ruth 2:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֤עַן בֹּ֨עַז֙ וַ/יֹּ֣אמֶר לָ֔/הּ הֻגֵּ֨ד הֻגַּ֜ד לִ֗/י כֹּ֤ל אֲשֶׁר עָשִׂית֙ אֶת חֲמוֹתֵ֔/ךְ אַחֲרֵ֖י מ֣וֹת אִישֵׁ֑/ךְ וַ/תַּֽעַזְבִ֞י אָּבִ֣י/ךְ וְ/אִמֵּ֗/ךְ וְ/אֶ֨רֶץ֙ מֽוֹלַדְתֵּ֔/ךְ וַ/תֵּ֣לְכִ֔י אֶל עַ֕ם אֲשֶׁ֥ר לֹא יָדַ֖עַתְּ תְּמ֥וֹל שִׁלְשֽׁוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/011.yaml
  text: Then Boaz answered and said to her[a], “I have been fully told all that you have done for your mother-in-law after the death of your husband, and how you left your father and your mother and the land of your birth, and went to a people whom you did not know before.”
translation:
  language: te
  text: 'అప్పుడు బోయజు ఆమెతో ఇలా అన్నాడు: “నీ భర్త చనిపోయిన తర్వాత నీవు నీ అత్త కోసం చేసినదంతా, నీ తండ్రినీ తల్లినీ, నీవు పుట్టిన నేలనూ విడిచిపెట్టి, ఇంతకుముందు నీకు తెలియని[a] ప్రజల దగ్గరకు వెళ్లిన సంగతంతా నాకు వివరంగా తెలియజేయబడింది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నిన్నగానీ మొన్నగానీ నీకు తెలియని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֻגֵּד הֻגַּד לִי
  choice: నాకు పూర్తిగా తెలిసింది
  rationale: నגד క్రియలోని infinitive absoluteతో కూడిన Hophal రూపం నివేదిక తనకు నిశ్చయంగా లేదా సమగ్రంగా చేరిందనే తీవ్రతను వ్యక్తం చేస్తుంది. సహజమైన ఆధునిక తెలుగులో ఈ భావాన్ని ‘నాకు పూర్తిగా తెలిసింది’ స్పష్టంగా అందిస్తుంది.
- source_word: כֹּל אֲשֶׁר עָשִׂית אֶת חֲמוֹתֵךְ
  choice: నీవు నీ అత్తకు చేసినదంతా
  rationale: כֹּל యొక్క సమగ్ర భావాన్ని ‘చేసినదంతా’ నిలుపుతుంది; సందర్భంలో אֶת‌తో వచ్చిన కర్మకు ప్రయోజనార్థక భావం ఉన్నందున ‘నీ అత్తకు’ సహజంగా ఉంది.
- source_word: אַחֲרֵי מוֹת אִישֵׁךְ
  choice: నీ భర్త చనిపోయిన తర్వాత
  rationale: హీబ్రూ నామవాచక నిర్మాణంలోని కాలసంబంధాన్ని ఆధునిక తెలుగులో సహజంగా, గంభీరత కోల్పోకుండా వ్యక్తం చేస్తుంది.
- source_word: וַתַּעַזְבִי אָבִיךְ וְאִמֵּךְ
  choice: నీ తండ్రిని, నీ తల్లిని ... విడిచిపెట్టి
  rationale: మూలంలో తండ్రి, తల్లి విడివిడిగా పేర్కొనబడ్డారు; ‘తల్లిదండ్రులు’ అని సంక్షిప్తం చేయకుండా ఆ ప్రత్యేకతను నిలిపింది.
- source_word: וְאֶרֶץ מוֹלַדְתֵּךְ
  choice: నీవు పుట్టిన దేశాన్ని
  rationale: מוֹלֶדֶת ఇక్కడ జన్మస్థలం లేదా స్వదేశాన్ని సూచిస్తుంది. ‘నీవు పుట్టిన దేశం’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి మూలార్థానికి దగ్గరగా ఉంది.
- source_word: וַתֵּלְכִי אֶל עַם
  choice: ప్రజల దగ్గరికి వచ్చిన
  rationale: הלך అక్షరార్థంగా ‘వెళ్లడం’; అయితే బోయజు ఇశ్రాయేలు దేశంలో రూతుతో మాట్లాడుతున్న కథన దృష్టికోణంలో తెలుగులో ‘వచ్చిన’ సహజంగా ఉంటుంది. గమ్యమైన సమాజాన్ని ‘ప్రజల దగ్గరికి’గా వ్యక్తం చేసింది.
- source_word: עַם
  choice: ప్రజలు
  rationale: ఇక్కడ పదం రాజకీయ రాజ్యంకన్నా ఒక జాతి లేదా సామాజిక సమూహాన్ని సూచిస్తుంది; ‘ప్రజలు’ ఆ విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר לֹא יָדַעַתְּ תְּמוֹל שִׁלְשׁוֹם
  choice: ఇంతకుముందు నీకు తెలియని
  rationale: ידע ఇక్కడ వ్యక్తిగత పరిచయాన్ని సూచిస్తుంది; תְּמוֹל שִׁלְשׁוֹם అనే కాలవాచక నుడికారాన్ని సహజ తెలుగులో ‘ఇంతకుముందు’గా ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో నిలిపింది.
