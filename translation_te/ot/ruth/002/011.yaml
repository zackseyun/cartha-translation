translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. బోయజు మాటలో రూతు చేసిన త్యాగాల వరుసను, మూలంలోని సమగ్ర నివేదిక భావాన్ని నిలిపాం; కాలవాచక హీబ్రూ నుడికారానికి అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
