revisions:
- from: మోయాబీయురాలైన రూతు నయోమితో, “దయచేసి నన్ను పొలానికి వెళ్లనివ్వు. ఎవరి దృష్టిలో నాకు అనుగ్రహం లభిస్తుందో, అతని వెనుక ధాన్యపు వెన్నులను ఏరుకుంటాను[a]” అంది. అందుకు నయోమి, “వెళ్లు, నా కూతురా” అంది.
  to: మోయాబీయురాలైన రూతు నయోమితో, “దయచేసి నన్ను పొలానికి వెళ్లనివ్వు. ఎవరి దృష్టిలో నాకు దయ దొరుకుతుందో, అతని వెనుక ధాన్యపు కంకులను ఏరుకుంటాను[a]” అంది. అప్పుడు నయోమి ఆమెతో, “వెళ్లు, నా కూతురా” అంది.
  rationale: The revision replaces an unclear agricultural term with the standard “ధాన్యపు కంకులు,” uses natural Telugu word order for Ruth’s intended gleaning after a favorably disposed man, and renders the social sense of חֵן without unnecessary theological coloring. The footnote preserves the literal ‘eyes’ idiom and explains it.
