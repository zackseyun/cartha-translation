translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడాం. ‘మోయాబీయురాలు,’ ‘ధాన్యపు వెన్నులు,’ ‘నా కూతురా’ వంటి రూపాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి మూలంలోని జాతి గుర్తింపు, వ్యవసాయ నేపథ్యం, ఆప్యాయతలను కాపాడుతాయి.
