  edition: WLC
  text: וַ/תֹּאמֶר֩ ר֨וּת הַ/מּוֹאֲבִיָּ֜ה אֶֽל נָעֳמִ֗י אֵֽלְכָה נָּ֤א הַ/שָּׂדֶה֙ וַ/אֲלַקֳטָּ֣ה בַ/שִׁבֳּלִ֔ים אַחַ֕ר אֲשֶׁ֥ר אֶמְצָא חֵ֖ן בְּ/עֵינָ֑י/ו וַ/תֹּ֥אמֶר לָ֖/הּ לְכִ֥י בִתִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/002.yaml
  text: And Ruth the Moabite said to Naomi[a], “Please let me go to the field and glean among the ears of grain after him in whose eyes I find favor.” And she said to her, “Go[b], my daughter.”
translation:
  language: te
  text: మోయాబీయురాలైన రూతు నయోమితో, “దయచేసి నన్ను పొలానికి వెళ్లనివ్వు. ఎవరి దృష్టిలో నాకు దయ దొరుకుతుందో, అతని వెనుక ధాన్యపు కంకులను ఏరుకుంటాను[a]” అంది. అప్పుడు నయోమి ఆమెతో, “వెళ్లు, నా కూతురా” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఎవరి కళ్లలో నాకు దయ దొరుకుతుందో, అతని వెనుక.” ఇది ఒకరి అనుకూలమైన ఆదరణ పొందడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמּוֹאֲבִיָּה
  choice: మోయాబీయురాలైన
  rationale: రూతు మోయాబు జాతికి చెందినదని తెలిపే స్త్రీలింగ జాతివాచక పదం; కథనంలో ఆమె విదేశీయురాలు అనే ప్రాధాన్యాన్ని సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: אֵלְכָה נָּא
  choice: దయచేసి నన్ను ... వెళ్లనివ్వు
  rationale: కోహోర్టేటివ్ రూపంతో కూడిన נָא నయోమి అనుమతిని మర్యాదగా కోరుతున్న భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: הַשָּׂדֶה
  choice: పొలానికి
  rationale: పంట కోత జరుగుతున్న వ్యవసాయ భూమిని సూచించే సరళమైన, సందర్భోచిత పదం.
- source_word: וַאֲלַקֳטָּה
  choice: ఏరుకుంటాను
  rationale: לקט కోతవారి వెనుక మిగిలిన ధాన్యాన్ని ఏరుకోవడాన్ని సూచిస్తుంది; తెలుగులో క్రియ సహజంగా ఉండేందుకు దాని వస్తువైన ‘ధాన్యపు వెన్నులను’ స్పష్టంగా ఉంచాం.
- source_word: בַשִּׁבֳּלִים
  choice: ధాన్యపు వెన్నులను
  rationale: שִׁבֳּלִים కట్టిన పనలను కాకుండా ధాన్యపు కంకులు లేదా వెన్నులను సూచిస్తుంది; ‘వెన్నులు’ వ్యవసాయ సందర్భానికి సహజమైన తెలుగు పదం.
- source_word: אַחַר אֲשֶׁר אֶמְצָא חֵן בְּעֵינָיו
  choice: ఎవరి దృష్టిలో నాకు అనుగ్రహం లభిస్తుందో, అతని వెనుక
  rationale: మూలంలోని అనిర్దిష్ట వ్యక్తిని, పుంలింగ ఏకవచన ప్రత్యయాన్ని, అలాగే ‘కళ్లలో అనుగ్రహం పొందడం’ అనే హీబ్రూ నుడికారాన్ని సాధ్యమైనంతగా నిలుపుతుంది.
- source_word: לְכִי בִתִּי
  choice: వెళ్లు, నా కూతురా
  rationale: సరళమైన ఆజ్ఞతో పాటు నయోమి చూపే ఆప్యాయమైన కుటుంబ సంబోధనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
