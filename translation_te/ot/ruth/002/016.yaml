translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపాలు వాడబడ్డాయి. వ్యవసాయ సందర్భాన్ని స్పష్టంగా ఉంచేందుకు ‘పనలు’, ‘కంకులు’, ‘ఏరుకోనివ్వండి’ అనే పదాలను ఎంచుకున్నాం. మూలంలోని క్రియాబలాన్ని ‘ఉద్దేశపూర్వకంగా’ ద్వారా నిలిపాం.
