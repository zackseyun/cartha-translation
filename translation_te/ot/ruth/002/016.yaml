revisions:
- from: అంతేకాదు, పనలలోనుంచి కూడా ఆమె కోసం కొన్ని కంకులను ఉద్దేశపూర్వకంగా తీసి పడవేయండి; ఆమె వాటిని ఏరుకోనివ్వండి. ఆమెను గద్దించకండి.
  to: అంతేకాక, ఆమె కోసం పంట కట్టలలోనుంచి కొన్ని కంకులను ఉద్దేశపూర్వకంగా తీసి అక్కడే వదిలేయండి; ఆమె వాటిని ఏరుకోనివ్వండి. ఆమెను గద్దించకండి.
  rationale: ‘పడవేయండి’ స్థానంలో ‘అక్కడే వదిలేయండి’ ఉంచి, రూతు ఏరుకోవడానికి ధాన్యాన్ని ఉద్దేశపూర్వకంగా మిగిల్చే మూలభావాన్ని స్పష్టం చేశాం. ‘పంట కట్టలు’ అనేది צְבָתִים‌కు ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన సమానార్థకం. మిగతా ఆజ్ఞల బలం, రూతు ప్రయోజనం, మరియు గద్దించవద్దనే నిషేధం యథాతథంగా ఉంచబడ్డాయి.
