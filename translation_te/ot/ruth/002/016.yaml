source:
  edition: WLC
  text: וְ/גַ֛ם שֹׁל תָּשֹׁ֥לּוּ לָ֖/הּ מִן הַ/צְּבָתִ֑ים וַ/עֲזַבְתֶּ֥ם וְ/לִקְּטָ֖ה וְ/לֹ֥א תִגְעֲרוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/016.yaml
  text: And also[a], you must surely pull out some for her from the bundles and leave it, so that she may gather it[b], and you must not rebuke her.
translation:
  language: te
  text: అంతేకాక, ఆమె కోసం పంట కట్టలలోనుంచి కొన్ని కంకులను ఉద్దేశపూర్వకంగా తీసి అక్కడే వదిలేయండి; ఆమె వాటిని ఏరుకోనివ్వండి. ఆమెను గద్దించకండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: అంతేకాదు
  rationale: మునుపటి ఆజ్ఞకు మరొక బలమైన సూచనను జోడించే సంధానాత్మక, సంకలన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: שֹׁל תָּשֹׁלּוּ
  choice: ఉద్దేశపూర్వకంగా తీసి పడవేయండి
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియ చర్యను బలపరుస్తుంది; సందర్భంలో పనల నుంచి కంకులను కావాలనే బయటకు తీసి రూతు కోసం వదలడం భావం. తెలుగులో క్రియ ఫలితాన్నీ స్పష్టంచేయడానికి ‘తీసి పడవేయండి’ అని ఇచ్చాం.
- source_word: לָהּ
  choice: ఆమె కోసం
  rationale: లబ్ధిదారుని సూచించే దత్తార్థాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: מִן הַצְּבָתִים
  choice: పనలలోనుంచి
  rationale: צְבָתִים కోసి కట్టిన ధాన్యపు కట్టలను సూచిస్తుంది; వ్యవసాయ సందర్భంలో ‘పనలు’ సహజమైన, నిర్దిష్టమైన తెలుగు పదం.
- source_word: וַעֲזַבְתֶּם
  choice: పడవేయండి
  rationale: తీసిన కంకులను రూతు ఏరుకోవడానికి అక్కడే వదలాలనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְלִקְּטָה
  choice: ఆమె వాటిని ఏరుకోనివ్వండి
  rationale: לקט పంట కోత తర్వాత మిగిలిన వాటిని ఏరడాన్ని సూచించే ప్రామాణిక క్రియ; ‘ఏరుకోనివ్వండి’ అనుమతితో కూడిన ఆజ్ఞను సహజంగా తెలుపుతుంది.
- source_word: וְלֹא תִגְעֲרוּ בָהּ
  choice: ఆమెను గద్దించకండి
  rationale: גער లోని కఠినంగా మందలించే భావాన్ని సాధారణ ఆధునిక తెలుగులో తగిన బలంతో వ్యక్తపరుస్తుంది.
