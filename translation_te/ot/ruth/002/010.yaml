revisions:
- from: అప్పుడు ఆమె సాష్టాంగపడి, నేలవరకు వంగి అతనితో, “నేను పరదేశి స్త్రీనైనా, మీరు నన్ను గుర్తించి ఆదరించడానికి మీ దృష్టిలో నాకు ఎందుకు అనుగ్రహం దొరికింది?” అని అడిగింది.[a]
  to: 'అప్పుడు ఆమె ముఖం నేలవైపు వంచి పడిపోయి, నేలవరకు వంగి అతనితో ఇలా అంది: “నేను పరదేశీ స్త్రీనైనా, మీరు నన్ను గమనించడానికి మీ దృష్టిలో నాకు ఎందుకు దయ కలిగింది?”[a]'
  rationale: The revision removes the added sense “ఆదరించడానికి,” uses a contextually natural expression for favor, and retains both Hebrew gestures of deep deference without characterizing the act as religious worship. The footnote remains anchored to the rendering of להכירני and gives viable lexical alternatives.
