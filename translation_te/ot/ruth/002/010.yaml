  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּפֹּל֙ עַל פָּנֶ֔י/הָ וַ/תִּשְׁתַּ֖חוּ אָ֑רְצָ/ה וַ/תֹּ֣אמֶר אֵלָ֗י/ו מַדּוּעַ֩ מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ לְ/הַכִּירֵ֔/נִי וְ/אָּנֹכִ֖י נָכְרִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/010.yaml
  text: Then she fell on her face and bowed to the ground and said to him[a], “Why have I found favor in your eyes, that you should take notice of me, though I am a foreign woman?”
translation:
  language: te
  text: 'అప్పుడు ఆమె ముఖం నేలవైపు వంచి పడిపోయి, నేలవరకు వంగి అతనితో ఇలా అంది: “నేను పరదేశీ స్త్రీనైనా, మీరు నన్ను గమనించడానికి మీ దృష్టిలో నాకు ఎందుకు దయ కలిగింది?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నన్ను గమనించడానికి” అనే చోట “నన్ను గుర్తించడానికి,” “నన్ను పరిగణించడానికి,” లేదా “నన్ను అంగీకరించడానికి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפֹּל עַל־פָּנֶיהָ
  choice: ఆమె సాష్టాంగపడి
  rationale: ముఖం నేలకు ఆనేటట్లు పడడం అనే లోతైన వినయభావపు భంగిమను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַתִּשְׁתַּחוּ אָרְצָה
  choice: నేలవరకు వంగి
  rationale: ఇది బోయజుకు చూపిన గౌరవభరితమైన శారీరక భంగిమ; ఆరాధన అనే మతపరమైన భావాన్ని అనవసరంగా చేర్చదు.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: మీ దృష్టిలో నాకు ఎందుకు అనుగ్రహం దొరికింది
  rationale: హీబ్రూ నుడికారంలోని ‘మీ కళ్లలో’ అనే భావాన్ని సహజమైన తెలుగు ‘మీ దృష్టిలో’గా ఉంచి, సామాజిక సందర్భానికి తగిన ‘అనుగ్రహం’ను వాడింది.
- source_word: לְהַכִּירֵנִי
  choice: నన్ను గుర్తించి ఆదరించడానికి
  rationale: హిఫీల్ రూపం గుర్తించడం, పరిగణించడం, శ్రద్ధ చూపడం అనే విస్తృత భావాన్ని కలిగి ఉంది; సందర్భంలో బోయజు రూతును అనుకూలంగా పరిగణించిన భావాన్ని ఈ పదబంధం తెలుపుతుంది.
- source_word: וְאָנֹכִי
  choice: నేను … అయినా
  rationale: వావ్‌తో కూడిన స్వతంత్ర సర్వనామం ఇక్కడ విరుద్ధత లేదా concessive భావాన్ని సూచిస్తుంది.
- source_word: נָכְרִיָּה
  choice: పరదేశి స్త్రీ
  rationale: స్త్రీలింగ ఏకవచన రూపాన్ని స్పష్టంగా నిలుపుతూ, రూతు విదేశీయురాలనే సామాజిక స్థితిని తెలియజేస్తుంది.
theological_decisions:
- issue: וַתִּשְׁתַּחוּ అనే క్రియకు ఆరాధనా భావం ఉందా
  choice: బోయజుకు గౌరవంగా నేలవరకు వంగిన భంగిమగా అనువదించడం
  alternative: ‘ఆరాధించింది’ అని మతపరమైన అర్థంతో అనువదించడం
  rationale: కథన సందర్భంలో రూతు బోయజుకు సామాజిక వినయాన్ని, గౌరవాన్ని చూపుతోంది; దేవునికి చేసే ఆరాధనను పాఠ్యం సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవసూచక ‘మీరు’ ప్రయోగం. కథన గాంభీర్యాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది.
