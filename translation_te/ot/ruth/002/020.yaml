  source_fidelity: 'హెబ్రీ మూలార్థాన్ని ముసాయిదా సరిగ్గా ప్రతిబింబిస్తుంది: నయోమి బోయజు కొరకు యెహోవా ఆశీర్వాదాన్ని కోరుతుంది; ‘తన కృప’కు యెహోవానే ప్రధాన పాఠ్యంలోని సూచనగా ఉంది; సజీవులు, మృతులు అనే రెండు వర్గాలూ నిలిచాయి. గోఎల్‌కు ‘విమోచకుడు’ అనే అనువాదం పాదసూచికలోని కుటుంబ-చట్టపరమైన వివరణతో సముచితంగా ఉంది.'
