  text: וַ/תֹּ֨אמֶר נָעֳמִ֜י לְ/כַלָּתָ֗/הּ בָּר֥וּךְ הוּא֙ לַ/יהוָ֔ה אֲשֶׁר֙ לֹא עָזַ֣ב חַסְדּ֔/וֹ אֶת הַ/חַיִּ֖ים וְ/אֶת הַ/מֵּתִ֑ים וַ/תֹּ֧אמֶר לָ֣/הּ נָעֳמִ֗י קָר֥וֹב לָ֨/נוּ֙ הָ/אִ֔ישׁ מִֽ/גֹּאֲלֵ֖/נוּ הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/020.yaml
  text: Naomi said to her daughter-in-law[a], “Blessed be he by Yahweh, whose kindness has not forsaken the living or the dead.” Then Naomi said to her, “The man is a close relative of ours[b]; he is one of our redeemers.”
translation:
  language: te
  text: నయోమి తన కోడలితో[a], “సజీవుల పట్లనూ మృతుల పట్లనూ తన కృపను విడిచిపెట్టని యెహోవా అతన్ని ఆశీర్వదించుగాక” అంది. తరువాత నయోమి ఆమెతో, “ఆ వ్యక్తి మన దగ్గరి బంధువు[b]; అతడు మన విమోచకుల్లో ఒకడు” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “సజీవుల పట్లనూ మృతుల పట్లనూ తన దయను విడిచిపెట్టని అతన్ని యెహోవా ఆశీర్వదించుగాక.” ఈ పఠనంలో “తన దయ” అనేది యెహోవా కృపను కాక బోయజు చూపిన దయను సూచిస్తుంది.'
    reason: alternative_reading
  - marker: b
    text: హెబ్రీ పదం కుటుంబ సభ్యుణ్ణి లేదా కుటుంబ ఆస్తిని విడిపించే గుర్తింపు పొందిన హక్కు లేదా బాధ్యతగల సమీప బంధువును సూచిస్తుంది; అందువల్ల “బంధు-విమోచకుడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ הוּא לַיהוָה
  choice: యెహోవా అతన్ని ఆశీర్వదించుగాక
  rationale: క్రియలేని హెబ్రీ ఆశీర్వాద సూత్రాన్ని ఆధునిక తెలుగులో సహజమైన ఆశీర్వచనంగా వ్యక్తం చేస్తుంది; לַיהוָה ను ఆశీర్వాద మూలమైన యెహోవాతో అనుసంధానిస్తుంది.
- source_word: חַסְדּוֹ
  choice: తన కృపను
  rationale: חֶסֶד లోని దయ, నిబద్ధమైన ప్రేమ, విశ్వసనీయ కృప అనే భావపరిధిని సందర్భానుకూలంగా సంక్షిప్తంగా అందిస్తుంది. సర్వనామం ఎవరిని సూచిస్తుందనే సందిగ్ధతను పాదసూచికలో ఉంచాం.
- source_word: לֹא עָזַב
  choice: విడిచిపెట్టని
  rationale: עזב యొక్క విడిచిపెట్టు, వదిలివేయు అనే సంబంధాత్మక బలాన్ని నేరుగా నిలుపుతుంది.
- source_word: אֶת הַחַיִּים וְאֶת הַמֵּתִים
  choice: సజీవులపట్ల, మృతులపట్ల
  rationale: హెబ్రీలోని రెండు వర్గాల సమగ్రతను సహజమైన తెలుగు నిర్మాణంలో కాపాడుతుంది.
- source_word: קָרוֹב לָנוּ
  choice: మనకు దగ్గరి బంధువు
  rationale: ఇక్కడ קָרוֹב స్థలసామీప్యాన్ని కాక బంధుత్వ సామీప్యాన్ని సూచిస్తుంది.
- source_word: מִגֹּאֲלֵנוּ
  choice: మన విమోచకుల్లో ఒకడు
  rationale: גאל రూపం కుటుంబ సభ్యుని లేదా కుటుంబ ఆస్తిని విడిపించే హక్కు లేదా బాధ్యతగల సమీప బంధువును సూచిస్తుంది; ప్రధాన పాఠ్యంలో పదాన్ని అనువదించి, దాని కుటుంబ-చట్టపరమైన భావాన్ని పాదసూచికలో వివరిస్తుంది.
theological_decisions:
- issue: 'ఆశీర్వాద వాక్యంలోని సర్వనామాల సూచన: నయోమి బోయజును ఆశీర్వదిస్తున్నదా, ‘తన కృప’ యెహోవాను సూచిస్తున్నదా లేక బోయజును సూచిస్తున్నదా?'
  choice: నయోమి బోయజు కోసం యెహోవా ఆశీర్వాదాన్ని కోరుతుంది; ‘తన కృప’ యెహోవా కృపను సూచిస్తుంది.
  alternative: ‘తన కృప’ బోయజు సజీవులకూ మృతులకూ చూపిన దయను సూచించవచ్చు.
  rationale: బָּרוּךְ הוּא లోని ‘అతడు’ తక్షణ సందర్భంలో బోయజును సహజంగా సూచిస్తుంది; సంబంధవాక్యంలోని אֲשֶׁר కు సమీప పూర్వపదం యెహోవా కావడం వల్ల ‘తన కృప’ యెహోవాను సూచించవచ్చు. అయితే హెబ్రీ వాక్యనిర్మాణం బోయజును సూచించే పఠనానికీ వీలు ఇస్తుంది కాబట్టి ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘కోడలు,’ ‘దగ్గరి బంధువు’ వంటి సాధారణ పదాలతో స్పష్టతను కాపాడుతూ, ‘కృప,’ ‘విమోచకుడు’ అనే బైబిలు భావపదాలను సందర్భ వివరణతో ఉపయోగించాం. దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
