  terminology: ‘యెహోవా,’ ‘కృప,’ ‘విమోచకుడు’ పదాలు స్థిరమైన, గౌరవప్రదమైన బైబిలు రిజిస్టర్‌లో ఉన్నాయి. ‘బంధు-విమోచకుడు’ను ప్రత్యామ్నాయంగా, వివరణతో పాదసూచికలో ఉంచడం సరైనది. సర్వనామ సూచనలోని మూలభాషా సందిగ్ధతను పాదసూచిక సముచితంగా కాపాడుతుంది.
