revisions:
- from: నయోమికి తన భర్త వైపు బంధువొకడు ఉన్నాడు. అతడు ఎలీమెలెకు వంశానికి చెందిన గొప్ప స్థితిగల వ్యక్తి[a]. అతని పేరు బోయజు.
  to: నయోమి భర్తకు బంధువైన ఒక వ్యక్తి ఉన్నాడు. అతడు ఎలీమెలెకు వంశానికి చెందిన గొప్ప స్థితిగతులు కలిగిన వ్యక్తి[a]. అతని పేరు బోయజు.
  rationale: The revision makes two low-risk stylistic improvements while preserving the source's ambiguity and narrative sense. It does not add a temporal “ఇప్పుడు/అప్పుడు,” does not specify a legal redeemer role, and retains the single footnote anchor for the broad Hebrew expression.
