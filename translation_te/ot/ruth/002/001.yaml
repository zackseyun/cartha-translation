id: RUT.2.1
reference: Ruth 2:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּֽ/לְ/נָעֳמִ֞י מידע לְ/אִישָׁ֗/הּ אִ֚ישׁ גִּבּ֣וֹר חַ֔יִל מִ/מִּשְׁפַּ֖חַת אֱלִימֶ֑לֶךְ וּ/שְׁמ֖/וֹ בֹּֽעַז׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/001.yaml
  text: Naomi had a relative of her husband[a], a man of great worth, from the clan of Elimelech[b], and his name was Boaz.
translation:
  language: te
  text: నయోమి భర్తకు బంధువైన ఒక వ్యక్తి ఉన్నాడు. అతడు ఎలీమెలెకు వంశానికి చెందిన గొప్ప స్థితిగతులు కలిగిన వ్యక్తి[a]. అతని పేరు బోయజు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బలసామర్థ్యంగల వ్యక్తి,’ ‘ప్రముఖుడు,’ లేదా ‘ధనవంతుడు’; హీబ్రూ పదబంధంలో బలం, సామర్థ్యం, హోదా, సంపద అనే భావాలు కలిసివున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְנָעֳמִי
  choice: నయోమికి ... ఉన్నాడు
  rationale: హీబ్రూ సంబంధవాచక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు స్వామ్య నిర్మాణంతో అందించింది; వాక్యారంభ וְను ప్రత్యేక కాలసూచక పదంతో అతిగా అనువదించలేదు.
- source_word: מידע לְאִישָׁהּ
  choice: తన భర్త వైపు బంధువొకడు
  rationale: מידע అనేది తెలిసిన లేదా అనుబంధమున్న వ్యక్తిని సూచించగలదు; ఎలీమెలెకు వంశానికి చెందినవాడనే తరువాతి వివరణ కుటుంబ బంధాన్ని స్పష్టం చేస్తుంది. 'భర్త వైపు' అనే మాట ఆ సంబంధం నయోమికి నేరుగా కాక ఆమె భర్త ద్వారా ఉందని తెలియజేస్తుంది; తరువాత వచ్చే విమోచక-బంధువు పాత్రను ముందుగానే నిర్దిష్టం చేయదు.
- source_word: אִישׁ גִּבּוֹר חַיִל
  choice: గొప్ప స్థితిగల వ్యక్తి
  rationale: ఈ పదబంధంలో బలం, సామర్థ్యం, సంపద, సామాజిక ప్రాధాన్యం వంటి భావాలు కలిసివున్నాయి. సైనికేతర సందర్భంలో 'గొప్ప స్థితిగల' అనేది యుద్ధవీరత్వాన్ని అనవసరంగా చేర్చకుండా విస్తృత గౌరవార్థాన్ని నిలుపుతుంది.
- source_word: מִמִּשְׁפַּחַת אֱלִימֶלֶךְ
  choice: ఎలీమెలెకు వంశానికి చెందిన
  rationale: מִשְׁפָּחָה ఇక్కడ చిన్న కుటుంబం కంటే విస్తృతమైన బంధుగణాన్ని సూచించగలదు; తెలుగులో 'వంశం' సహజంగా ఆ విస్తృత బంధుత్వ భావాన్ని అందిస్తుంది.
- source_word: וּשְׁמוֹ בֹּעַז
  choice: అతని పేరు బోయజు
  rationale: పాత్రను పరిచయం చేసే హీబ్రూ కథన సూత్రాన్ని సహజమైన తెలుగు వాక్యంగా అందించింది; పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
theological_decisions:
- issue: מידע ద్వారా సూచితమైన బంధం యొక్క ఖచ్చిత స్వభావం
  choice: బంధువు
  alternative: పరిచయస్థుడు
  rationale: తరువాతి వంశసూచన కుటుంబ సంబంధాన్ని బలపరుస్తుంది; అయితే తరువాతి న్యాయపరమైన విమోచక-బంధువు హోదాను ఈ వచనంలోనే ముందుగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. దీర్ఘమైన హీబ్రూ వాక్యాన్ని పఠనసౌలభ్యం కోసం మూడు చిన్న వాక్యాలుగా విభజించాం. ప్రధాన పాఠంలోని [a] సూచికకు అనుగుణంగా ఒకే పాదసూచిక ఇచ్చాం.
