translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘పరిగె ఏరుకోవడం’ అనే ఖచ్చితమైన వ్యవసాయపదాన్ని నిలుపుతూ, నַעֲרוֹת సందర్భంలో పనివారైన యువతులని స్పష్టం చేశాం. మూలంలోని రెండు ప్రధాన క్రియల అర్థవిస్తృతిని పాదసూచికల్లో సంరక్షించాం.
