  text: וַ/תִּדְבַּ֞ק בְּ/נַעֲר֥וֹת בֹּ֨עַז֙ לְ/לַקֵּ֔ט עַד כְּל֥וֹת קְצִֽיר הַ/שְּׂעֹרִ֖ים וּ/קְצִ֣יר הַֽ/חִטִּ֑ים וַ/תֵּ֖שֶׁב אֶת חֲמוֹתָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/023.yaml
  text: So she stayed close to Boaz's young women to glean[a], until the end of the barley harvest and the wheat harvest[b]. And she lived with her mother-in-law.
translation:
  language: te
  text: పొలంలో మిగిలిన ధాన్యాన్ని ఏరుకోవడానికి ఆమె బోయజు యువ పనివారితో సన్నిహితంగా ఉండి,[a] యవల కోత, గోధుమల కోత ముగిసేవరకు ఏరుకుంది. ఆమె తన అత్తతో కలిసి నివసించింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బోయజు యువ పనివారిని అంటిపెట్టుకొని ఉండింది.’ హెబ్రీ క్రియ గట్టి అనుబంధాన్ని లేదా సన్నిహితంగా ఉండడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆమె తన అత్తతో ఉండిపోయింది.’ హెబ్రీ క్రియ సందర్భాన్ని బట్టి ‘ఉండడం,’ ‘మిగిలి ఉండడం,’ లేదా ‘నివసించడం’ అని అర్థమివ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּדְבַּק
  choice: దగ్గరగా ఉంటూ వచ్చింది
  rationale: דבק అనే క్రియకు ‘అంటిపెట్టుకోవడం, గట్టిగా హత్తుకొని ఉండడం’ అనే మూలభావం ఉంది. ఇక్కడ అది బోయజు యువ పనివారితో రూతు కొనసాగించిన సన్నిహిత సహవాసాన్ని సూచిస్తుంది; సహజమైన ఆధునిక తెలుగులో ‘దగ్గరగా ఉంటూ వచ్చింది’ ఆ భావాన్ని అతిశయింపకుండా తెలియజేస్తుంది.
- source_word: בְּנַעֲרוֹת בֹּעַז
  choice: బోయజు పనివారైన యువతులకు
  rationale: נַעֲרוֹת స్త్రీలింగ బహువచనం; సందర్భంలో వారు బోయజు పొలాల్లో పనిచేసే యువతులు. ‘పనివారైన’ అని చేర్చడం సందర్భాన్ని స్పష్టం చేస్తూనే, ‘యువతులు’ అనే మూలార్థాన్ని నిలుపుతుంది.
- source_word: לְלַקֵּט
  choice: పరిగె ఏరుకోవడానికి
  rationale: ఈ infinitive ఉద్దేశాన్ని సూచిస్తుంది. ‘పరిగె ఏరుకోవడం’ అనేది కోత పూర్తైన తర్వాత పొలంలో మిగిలిన ధాన్యాన్ని ఏరుకునే ఆచారానికి సరైన తెలుగు వ్యవసాయపదప్రయోగం.
- source_word: עַד כְּלוֹת
  choice: ముగిసేవరకు
  rationale: ఈ నిర్మాణం ఒక పని పూర్తయ్యే కాలపరిమితిని సూచిస్తుంది. ‘ముగిసేవరకు’ సహజంగానూ సంక్షిప్తంగానూ ఆ భావాన్ని అందిస్తుంది.
- source_word: קְצִיר הַשְּׂעֹרִים וּקְצִיר הַחִטִּים
  choice: యవల కోత, గోధుమల కోత
  rationale: మూలంలోని రెండు వేర్వేరు పంటకోతలను వరుసగా నిలుపుతుంది; దీని ద్వారా రూతు చాలాకాలం పరిగె ఏరుకున్నదనే భావం స్పష్టమవుతుంది.
- source_word: וַתֵּשֶׁב
  choice: నివసించింది
  rationale: ישב కు ‘కూర్చోవడం, ఉండడం, నివసించడం’ వంటి అర్థాలు ఉన్నాయి. ఇక్కడ అత్తతో నివాసం కొనసాగించడమే సందర్భోచిత భావం; ‘నివసించింది’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: אֶת חֲמוֹתָהּ
  choice: తన అత్తతో కలిసి
  rationale: ישב తో వచ్చిన ఈ పదబంధం ఒకరితో నివసించడాన్ని సూచిస్తుంది. తెలుగులో సంబంధాన్ని సహజంగా వ్యక్తపరచడానికి ‘తో కలిసి’ ఉపయోగించబడింది.
