- from: కాబట్టి ఆమె పరిగె ఏరుకోవడానికి బోయజు పనివారైన యువతులకు దగ్గరగా ఉంటూ వచ్చింది.[a] యవల కోత, గోధుమల కోత ముగిసేవరకు ఆమె అలాగే చేసింది. ఆమె తన అత్తతో కలిసి నివసించింది.[b]
