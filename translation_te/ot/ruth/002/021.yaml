id: RUT.2.21
reference: Ruth 2:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֖אמֶר ר֣וּת הַ/מּוֹאֲבִיָּ֑ה גַּ֣ם כִּי אָמַ֣ר אֵלַ֗/י עִם הַ/נְּעָרִ֤ים אֲשֶׁר לִ/י֙ תִּדְבָּקִ֔י/ן עַ֣ד אִם כִּלּ֔וּ אֵ֥ת כָּל הַ/קָּצִ֖יר אֲשֶׁר לִֽ/י׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/021.yaml
  text: Then Ruth the Moabite said[a], “He also said to me, ‘You are to stay close by my young women until they have finished all my harvest.’”
translation:
  language: te
  text: అప్పుడు మోయాబీయురాలైన రూతు, “అంతేకాదు, ‘నా యువకులతోనే దగ్గరగా ఉండాలి; నా పంట కోతంతా వారు పూర్తిచేసేవరకు’ అని ఆయన నాతో చెప్పాడు” అంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అప్పుడు ... అంది
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: רוּת הַמּוֹאֲבִיָּה
  choice: మోయాబీయురాలైన రూతు
  rationale: వ్యక్తి పేరును సాధారణ తెలుగు రూపంలో ఉంచి, స్త్రీలింగ జాతివాచకాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: גַּם כִּי אָמַר אֵלַי
  choice: అంతేకాదు ... అని ఆయన నాతో చెప్పాడు
  rationale: גַּם כִּי ఇక్కడ రూతు చెప్పే అదనపు విషయాన్ని బలపరుస్తుంది; ‘అంతేకాదు’ ఆ సంభాషణ సంబంధాన్ని సహజంగా చూపుతుంది.
- source_word: עִם הַנְּעָרִים אֲשֶׁר לִי
  choice: నా పనివారితోనే
  rationale: నְעָרִים రూపరీత్యా పుంలింగ బహువచనం; సందర్భంలో బోయజు ఆధీనంలోని యువ సేవకులు లేదా పనివారిని సూచించవచ్చు. ప్రధాన పాఠంలో సహజమైన సమూహవాచకాన్ని ఎంచుకుని, లింగస్పష్టమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: תִּדְבָּקִין
  choice: వారిని అంటిపెట్టుకుని ఉండు
  rationale: דבק యొక్క ‘గట్టిగా అతుక్కొని/సన్నిహితంగా ఉండడం’ అనే బలాన్ని కాపాడుతూ, కోత సందర్భంలో వారితోనే దగ్గరగా ఉండమనే భావాన్ని సహజ తెలుగులో ఇస్తుంది.
- source_word: עַד אִם כִּלּוּ
  choice: వారు ముగించేవరకు
  rationale: చర్య ముగిసే కాలపరిమితిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אֵת כָּל הַקָּצִיר אֲשֶׁר לִי
  choice: నా పంట కోతంతా
  rationale: కోత పని లేదా కోతకాలపు సమగ్ర పంట అనే భావాన్ని, బోయజు స్వామ్యాన్ని మరియు ‘అంతా’ అనే సంపూర్ణతను సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథనశైలి. మూలంలోని నְעָרִים అనే పుంలింగ రూపాన్ని దాచకుండా పాదటిప్పణిలో స్పష్టం చేశాం; సమీప సందర్భంలోని స్త్రీ పనివారనే సాధ్యమైన అవగాహనను ప్రధాన పాఠంలో బలవంతంగా చేర్చలేదు.
