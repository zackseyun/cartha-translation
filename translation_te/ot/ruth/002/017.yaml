id: RUT.2.17
reference: Ruth 2:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תְּלַקֵּ֥ט בַּ/שָּׂדֶ֖ה עַד הָ/עָ֑רֶב וַ/תַּחְבֹּט֙ אֵ֣ת אֲשֶׁר לִקֵּ֔טָה וַ/יְהִ֖י כְּ/אֵיפָ֥ה שְׂעֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/017.yaml
  text: So she gleaned in the field until evening[a], and beat out what she had gleaned, and it was about an ephah of barley.
translation:
  language: te
  text: ఆమె సాయంత్రం వరకు పొలంలో కోతవారు విడిచిపెట్టిన వాటిని ఏరుకుంది. తర్వాత తాను ఏరుకున్న వాటిని కొట్టి గింజలను వేరు చేసింది; అవి దాదాపు ఒక ఏఫా[a] యవలు అయ్యాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఏఫా అనేది ప్రాచీన కాలంలో పొడి పదార్థాలను కొలిచే కొలమానం; ఇది సుమారు 20–22 లీటర్లు.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּלַקֵּט
  choice: మిగిలిన వెన్నులను ఏరుకుంది
  rationale: לקט ఇక్కడ కోతవారు విడిచిన ధాన్యపు వెన్నులను ఏరుకునే ప్రత్యేక వ్యవసాయ ఆచారాన్ని సూచిస్తుంది. సాధారణమైన ‘ఏరుకుంది’ కంటే ఈ విస్తృత రూపం సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: בַּשָּׂדֶה
  choice: పొలంలో
  rationale: שׂדה అనేది సాధారణంగా ‘పొలం’; నిర్దిష్టత తెలుగులో సందర్భం ద్వారానే సహజంగా వ్యక్తమవుతుంది.
- source_word: עַד הָעָרֶב
  choice: సాయంత్రం వరకు
  rationale: ఆమె పనిచేసిన కాలవ్యవధిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַתַּחְבֹּט
  choice: దుళ్లగొట్టినప్పుడు
  rationale: חבט ఇక్కడ ఏరుకున్న వెన్నులను కొట్టి ధాన్యాన్ని వేరుచేయడాన్ని సూచిస్తుంది. ‘దుళ్లగొట్టు’ ఆ వ్యవసాయ చర్యను సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: אֵת אֲשֶׁר לִקֵּטָה
  choice: తాను ఏరుకున్నవాటిని
  rationale: సాపేక్ష నిర్మాణాన్ని సహజమైన తెలుగులో అందిస్తూ, ఏరుకున్న పంటనే దుళ్లగొట్టిందని స్పష్టం చేస్తుంది.
- source_word: וַיְהִי
  choice: వచ్చాయి
  rationale: దుళ్లగొట్టిన తరువాత లభించిన ధాన్యపు మొత్తాన్ని తెలుగులో సహజమైన ఫలిత వాక్యంగా వ్యక్తం చేస్తుంది.
- source_word: כְּאֵיפָה
  choice: దాదాపు ఒక ఏఫా
  rationale: ఉపసర్గ כְּ తెలిపే సుమారు పరిమాణాన్ని ‘దాదాపు’గా ఉంచి, ప్రాచీన కొలమానమైన אֵיפָהను లిప్యంతరీకరించింది.
- source_word: שְׂעֹרִים
  choice: యవలు
  rationale: שׂעריםకు ప్రామాణిక తెలుగు ధాన్యనామం ‘యవలు’; కొలత తరువాత వచ్చే పదంగా ఇది సహజంగా సరిపోతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఏరుకుంది’ అనే సాధారణ పదానికి ‘మిగిలిన వెన్నులను’ జోడించి gleaning అనే ప్రత్యేక వ్యవసాయ భావాన్ని స్పష్టం చేశాం. మూలంలోని వరుస వావ్ నిర్మాణాలను యాంత్రికంగా పునరుత్పత్తి చేయకుండా, చర్య–ఫలితం సంబంధాన్ని తెలుగులో సహజంగా అమర్చాం.
