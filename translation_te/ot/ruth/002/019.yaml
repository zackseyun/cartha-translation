  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘ఏరుకున్నావు’ అనే పదానికి ధాన్యం అనే కర్మను చేర్చకుండా మూలంలోని సంక్షిప్తతను నిలిపాం; సమీప సందర్భం దాని అర్థాన్ని స్పష్టం చేస్తుంది.
