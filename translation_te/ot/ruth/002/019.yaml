source:
  edition: WLC
  text: וַ/תֹּאמֶר֩ לָ֨/הּ חֲמוֹתָ֜/הּ אֵיפֹ֨ה לִקַּ֤טְתְּ הַ/יּוֹם֙ וְ/אָ֣נָה עָשִׂ֔ית יְהִ֥י מַכִּירֵ֖/ךְ בָּר֑וּךְ וַ/תַּגֵּ֣ד לַ/חֲמוֹתָ֗/הּ אֵ֤ת אֲשֶׁר עָשְׂתָה֙ עִמּ֔/וֹ וַ/תֹּ֗אמֶר שֵׁ֤ם הָ/אִישׁ֙ אֲשֶׁ֨ר עָשִׂ֧יתִי עִמּ֛/וֹ הַ/יּ֖וֹם בֹּֽעַז־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/019.yaml
  text: And her mother-in-law said to her[a], “Where did you glean today, and where have you worked? Blessed be the one who took notice of you.” So she told her mother-in-law with whom she had worked, and she said, “The name of the man with whom I worked today is Boaz.”
translation:
  language: te
  text: అప్పుడు ఆమె అత్త ఆమెతో, “నువ్వు ఈ రోజు ఎక్కడ ఏరుకున్నావు? ఎక్కడ పని చేశావు? నిన్ను గమనించినవాడు ఆశీర్వదించబడుగాక!” అంది. తాను ఎవరి వద్ద పని చేసిందో ఆమె తన అత్తకు చెప్పి, “నేను ఈ రోజు ఎవరి వద్ద పని చేశానో ఆ మనిషి పేరు బోయజు” అంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తాను ఎవరి వద్ద పని చేసిందో,” “నేను ఈ రోజు ఎవరి వద్ద పని చేశానో” అనే మాటలకు హీబ్రూలో మరింత అక్షరార్థంగా “ఆమె అతనితో చేసినది,” “నేను ఈ రోజు అతనితో చేసినది” అని ఉంది. ఇక్కడ పొలంలో చేసిన పనిని సందర్భం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמוֹתָהּ
  choice: ఆమె అత్త
  rationale: తెలుగులో సందర్భానికి సహజమైన బంధుత్వ పదం; ఇక్కడ భర్త తల్లిని సూచిస్తుంది.
- source_word: לִקַּטְתְּ
  choice: ఏరుకున్నావు
  rationale: కోత తరువాత మిగిలిన ధాన్యాన్ని ఏరడాన్ని సందర్భం స్పష్టం చేస్తుంది; సాధారణ పాఠకునికి సహజంగా ఉండే పదాన్ని ఎంచుకున్నాం.
- source_word: עָשִׂית
  choice: పని చేశావు
  rationale: మూల క్రియ సాధారణంగా ‘చేయు’ అని అర్థమైనా, ఈ సందర్భంలో పొలంలో చేసిన పనిని సూచిస్తుంది.
- source_word: יְהִי מַכִּירֵךְ בָּרוּךְ
  choice: నిన్ను ఆదరించినవాడు ఆశీర్వదించబడుగాక
  rationale: מַכִּירֵךְ అక్షరార్థంగా నిన్ను గుర్తించిన లేదా గమనించిన వ్యక్తిని సూచిస్తుంది; సందర్భంలో రూతుపట్ల అనుకూల శ్రద్ధ చూపిన భావాన్ని ‘ఆదరించినవాడు’ సహజంగా తెలియజేస్తుంది.
- source_word: אֵת אֲשֶׁר עָשְׂתָה עִמּוֹ
  choice: తాను ఎవరి దగ్గర పని చేసిందో
  rationale: హీబ్రూ అక్షరార్థం ‘ఆమె అతనితో చేసినది’; పొలపని సందర్భంలో తెలుగులో అపార్థం రాకుండా సందర్భార్థాన్ని ఇచ్చాం.
- source_word: אֲשֶׁר עָשִׂיתִי עִמּוֹ
  choice: నేను ఎవరి దగ్గర పని చేశానో
  rationale: ‘అతనితో చేశాను’ అనే అక్షరార్థాన్ని పొలపని సందర్భానికి అనుగుణంగా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בֹּעַז
  choice: బోయజు
  rationale: హీబ్రూ వ్యక్తినామానికి స్థిరపడిన తెలుగు బైబిలు లిప్యంతరీకరణను అనుసరించాం.
