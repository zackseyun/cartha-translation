revisions:
- from: అలా ఆమె వెళ్లి, కోత కోసేవారి వెనుక పొలంలో పరిగె ఏరడం మొదలుపెట్టింది. అనుకోకుండా[a] ఆమె ఎలీమెలెకు వంశానికి చెందిన బోయజు పొలంలోని భాగానికి వచ్చింది.
  to: ఆమె వెళ్లి, పొలానికి వచ్చి, కోతకోయువారి వెనుక పరిగె ఏరింది. అనుకోకుండా[a] ఆమె ఎలీమెలెకు కుటుంబానికి చెందిన బోయజుకు చెందిన పొలంలోని భాగానికి వచ్చింది.
  rationale: The revision restores the Hebrew’s sequential ‘went … came … gleaned’ narration, removes the unsupported inception nuance, and improves the reaper expression. It retains apparent chance in the main text and confines the wider narrative observation about providence to the footnote, preserving the source’s theological tension.
