base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/003.yaml
  text: So she went and came and gleaned in the field behind the reapers[a], and she happened to come to the portion of the field belonging to Boaz, who was from the family of Elimelech.
translation:
  language: te
  text: ఆమె వెళ్లి, పొలానికి వచ్చి, కోతకోయువారి వెనుక పరిగె ఏరింది. అనుకోకుండా[a] ఆమె ఎలీమెలెకు కుటుంబానికి చెందిన బోయజుకు చెందిన పొలంలోని భాగానికి వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “ఆమె యాదృచ్ఛికం సంభవించింది” అని ఉంది—‘యాదృచ్ఛికం’ అనే పదాన్ని పునరుక్తి చేసే జాతీయం. ఇది మానవ దృష్టిలో అనుకోకుండా జరిగినట్లు కనిపించే సంఘటనను సూచిస్తుంది; అయితే ఈ పుస్తకపు విస్తృత కథనం ఇందులో దైవ నిర్వహణను కూడా చూడమని పాఠకుణ్ణి ఆహ్వానిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ וַתָּבוֹא
  choice: ఆమె వెళ్లి ... వచ్చింది
  rationale: రెండు వరుస కథన క్రియలైన ‘వెళ్లింది, వచ్చింది’ అనే కదలికను సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలిపింది.
- source_word: וַתְּלַקֵּט
  choice: పరిగె ఏరడం మొదలుపెట్టింది
  rationale: לקט కోతవారి వెనుక మిగిలిన ధాన్యాన్ని ఏరడాన్ని సూచిస్తుంది. ‘పరిగె ఏరు’ ఈ వ్యవసాయ ఆచారానికి సహజమైన, నిర్దిష్టమైన తెలుగు ప్రయోగం; సందర్భంలో క్రియారంభ భావాన్ని ‘మొదలుపెట్టింది’ స్పష్టం చేస్తుంది.
- source_word: בַּשָּׂדֶה
  choice: పొలంలో
  rationale: నిర్దిష్ట ఉపవిభాగం ఇంకా పరిచయం కాకముందు, కోత జరుగుతున్న పొలప్రాంతాన్ని సహజంగా సూచిస్తుంది.
- source_word: אַחֲרֵי הַקֹּצְרִים
  choice: కోత కోసేవారి వెనుక
  rationale: 'אַחֲרֵי ఇక్కడ కాలక్రమం కన్నా స్థల సంబంధాన్ని సూచిస్తుంది: ఆమె కోత కోసేవారిని వెంబడిస్తూ మిగిలిన ధాన్యాన్ని ఏరింది.'
- source_word: וַיִּקֶר מִקְרֶהָ
  choice: అనుకోకుండా
  rationale: క్రియతో దాని సహజాత నామవాచకం కలిసిన హెబ్రీ జాతీయం మానవ దృష్టిలో యాదృచ్ఛికంగా జరిగిన సంగతిని బలపరుస్తుంది. ‘అనుకోకుండా’ సహజమైన తెలుగులో ఆ భావాన్ని ఇస్తుంది; దైవ నిర్వహణను ప్రధాన వాక్యంలో ప్రత్యక్షంగా చేర్చదు.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: పొలంలోని భాగానికి
  rationale: חֶלְקָה భూమిలోని భాగం లేదా పొలం ముక్కను సూచిస్తుంది. ‘పొలంలోని భాగం’ మూలంలోని సంబంధాన్ని అతిగా సాంకేతికం కాకుండా నిలుపుతుంది.
- source_word: לְבֹעַז
  choice: బోయజు పొలంలోని
  rationale: לְ ఇక్కడ స్వామ్యాన్ని లేదా అనుబంధాన్ని సూచిస్తుంది; తెలుగు షష్ఠీ నిర్మాణం దాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֲשֶׁר מִמִּשְׁפַּחַת אֱלִימֶלֶךְ
  choice: ఎలీమెలెకు వంశానికి చెందిన
  rationale: מִשְׁפָּחָה విస్తృత కుటుంబ లేదా వంశ సమూహాన్ని సూచిస్తుంది. కథలోని బంధుత్వ ప్రాధాన్యాన్ని ‘వంశం’ స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యాదృచ్ఛిక సంఘటనలా కనిపించడం మరియు దైవ నిర్వహణ మధ్య కథన ఉద్వేగం
  choice: ప్రధాన పాఠ్యంలో ‘అనుకోకుండా’ అని మానవ దృష్టిలో కనిపించే యాదృచ్ఛికతను వ్యక్తపరచడం
  alternative: దైవ నిర్వహణను ప్రధాన పాఠ్యంలోనే స్పష్టంగా పేర్కొనడం, లేదా ‘ఆమెకు అవకాశం సంభవించింది’ అని అక్షరానువాదం చేయడం
  rationale: హెబ్రీ పాఠ్యం యాదృచ్ఛికతకు సంబంధించిన జాతీయాన్ని వాడుతుంది; అయితే పుస్తకపు విస్తృత కథనం దైవ నిర్వహణను గ్రహించమని పాఠకుణ్ణి ఆహ్వానిస్తుంది. అనువాదం ఈ ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. వ్యవసాయ సందర్భానికి నిర్దిష్టమైన ‘పరిగె ఏరు’ను ఉపయోగించి, ‘అనుకోకుండా’ అనే మాటకు వెంటనే [a] సూచికను ఉంచి మూలంలోని కథన వ్యంగ్యాన్ని, వేదాంత ఉద్వేగాన్ని కాపాడింది.
