source:
  edition: WLC
  text: יְשַׁלֵּ֥ם יְהוָ֖ה פָּעֳלֵ֑/ךְ וּ/תְהִ֨י מַשְׂכֻּרְתֵּ֜/ךְ שְׁלֵמָ֗ה מֵ/עִ֤ם יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר בָּ֖את לַ/חֲס֥וֹת תַּֽחַת כְּנָפָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/012.yaml
  text: May Yahweh repay your work[a], and may your reward be full from Yahweh, the God of Israel, under whose wings you have come to seek refuge.
translation:
  language: te
  text: నీ పనికి యాహ్వే ప్రతిఫలమిచ్చుగాక; నీవు ఎవరి రెక్కల కింద ఆశ్రయం పొందడానికి వచ్చావో, ఆ ఇశ్రాయేలు దేవుడైన యాహ్వే నుండి నీ ప్రతిఫలం సంపూర్ణంగా ఉండుగాక.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ కూలి సంపూర్ణంగా ఉండుగాక.” హీబ్రూ పదం ‘కూలి’ లేదా ‘ప్రతిఫలం’ అనే అర్థాన్ని ఇవ్వగలదు; ‘సంపూర్ణ’ అనే భావాన్ని తెలిపే హీబ్రూ పదం, మొదటి వాక్యభాగంలో ‘ప్రతిఫలమిచ్చు’ అని అనువదించిన పదంతో ఒకే పదమూలానికి చెందినది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלֵּם
  choice: ప్రతిఫలమిచ్చుగాక
  rationale: పియేల్ రూపం ఇక్కడ బోయజు పలికిన ఆశీర్వాదకాంక్షను తెలియజేస్తుంది. ‘ప్రతిఫలమిచ్చుగాక’ అనేది ఆ కాంక్షను, రూతు చేసిన కార్యానికి తగిన ప్రతిఫల భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించాం.
- source_word: פָּעֳלֵךְ
  choice: నీ పని
  rationale: ఈ పదం పని, కార్యం లేదా చేసిన క్రియను సూచించగలదు. సందర్భంలో రూతు చేసిన విశ్వాసపూర్వక కార్యాలన్నిటినీ సంక్షిప్తంగా సూచించడానికి ‘నీ పని’ సహజంగా ఉంది.
- source_word: וּתְהִי
  choice: కలుగుగాక
  rationale: ఈ జస్సివ్ రూపం మొదటి వాక్యభాగంలోని ఆశీర్వాదకాంక్షను కొనసాగిస్తుంది.
- source_word: מַשְׂכֻּרְתֵּךְ
  choice: నీకు ... ప్రతిఫలం
  rationale: ఈ నామవాచకం కూలి లేదా ప్రతిఫలం అనే రెండు భావాలను ఇవ్వగలదు. ఇక్కడ యజమాని ఇచ్చే సాధారణ కూలికన్నా దేవుడు ఇచ్చే ప్రతిఫలం ఉద్దేశించబడినందున ‘ప్రతిఫలం’ సరిపోతుంది.
- source_word: שְׁלֵמָה
  choice: సంపూర్ణ
  rationale: పూర్తి, లోటులేని అనే భావాన్ని తెలియజేస్తుంది; అలాగే יְשַׁלֵּם తో ఉన్న שׁלם పదమూల ప్రతిధ్వనిని అర్థస్థాయిలో నిలుపుతుంది.
- source_word: מֵעִם
  choice: నుండి
  rationale: ప్రతిఫలం వచ్చే మూలాన్ని సూచించే ఈ ఉపసర్గను తెలుగులో సహజంగా ‘నుండి’ అని అనువదించాం.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: హీబ్రూ సమాస నిర్మాణానికి నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: אֲשֶׁר בָּאת לַחֲסוֹת
  choice: నీవు ఎవరి ... ఆశ్రయం పొందడానికి వచ్చావో
  rationale: సంబంధవాచక ఉపవాక్యాన్ని తెలుగులో సహజమైన ‘ఎవరి...వచ్చావో’ నిర్మాణంతో వ్యక్తం చేశాం; రావడంలోని ఉద్దేశాన్ని ‘ఆశ్రయం పొందడానికి’ నిలుపుకున్నాం.
- source_word: תַּחַת כְּנָפָיו
  choice: ఆయన రెక్కల కింద
  rationale: దేవుని సంరక్షణను సూచించే రెక్కల రూపకాన్ని వివరణగా మార్చకుండా యథాతథంగా నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని నామ స్వరూపాన్ని కాపాడుతుంది.
- issue: దేవుని రెక్కల కింద ఆశ్రయం అనే రూపకం
  choice: రెక్కల కింద ఆశ్రయం పొందడానికి
  alternative: దేవుని రక్షణలోకి రావడానికి
  rationale: మూలంలోని సజీవమైన రక్షణ రూపకాన్ని సిద్ధాంతపరమైన వివరణతో సమతలీకరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన ఆశీర్వాద శైలిని ‘-గాక’ రూపాలతో నిలిపాం. సాధారణ పాఠకులకు అర్థమయ్యే పదాలను వాడుతూ, ‘రెక్కల కింద’ అనే మూల రూపకాన్ని అలాగే ఉంచాం.
