review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Ruth’s polite request to glean and gather among/behind the reapers, and it appropriately acknowledges the difficulty of the final Hebrew clause. However, “పని చేస్తూనే ఉంది” explicitly adds labor, whereas וַתָּבֹא וַתַּעֲמוֹד more conservatively reports that she came and remained/stood there. The main text also selects “shelter” while the note labels “house” as the alternative, reversing the source’s explicit הַבַּיִת (‘the house’) and the English audit trail’s main/alternative arrangement.
  naturalness: The Telugu is generally fluent and appropriately respectful. “కోత కోసేవారి” is redundant; “కోతకారుల” is more natural. “ఆ ఇంట్లో కొద్దిసేపు మాత్రమే కూర్చుంది” is natural while retaining the Hebrew wording; the footnote can explain that this may have been a field shelter.
  terminology: “ఏరుకొని” and “పోగుచేసుకోవడానికి” effectively retain the distinction between gleaning and gathering. “ధాన్యపు పనల మధ్య” clearly identifies the sheaves. “కోతకారుల వెనుక” preserves the spatial sense of אַחֲרֵי.
  issues:
  - severity: medium
    issue: “పని చేస్తూనే ఉంది” adds an explicit action not stated by the Hebrew verb.
    rationale: The context implies gleaning, but the Hebrew says that she came and stood/remained from morning until now. Rendering this as “అక్కడే ఉంది” preserves the durative contextual sense without adding ‘worked.’
  - severity: medium
    issue: The main text and footnote reverse the relative status of ‘house’ and ‘shelter.’
    rationale: הַבַּיִת explicitly reads ‘the house.’ Since its reference may be a workers’ shelter, that contextual interpretation belongs in the note rather than replacing ‘house’ in the main text.
  - severity: low
    issue: “కోత కోసేవారి” is pleonastic.
    rationale: “కోతకారుల” is concise, idiomatic modern Telugu and retains the meaning ‘reapers.’
