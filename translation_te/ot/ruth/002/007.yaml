  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֗אמֶר אֲלַקֳטָה נָּא֙ וְ/אָסַפְתִּ֣י בָֽ/עֳמָרִ֔ים אַחֲרֵ֖י הַ/קּוֹצְרִ֑ים וַ/תָּב֣וֹא וַֽ/תַּעֲמ֗וֹד מֵ/אָ֤ז הַ/בֹּ֨קֶר֙ וְ/עַד עַ֔תָּה זֶ֛ה שִׁבְתָּ֥/הּ הַ/בַּ֖יִת מְעָֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/007.yaml
  text: She said[a], ‘Please let me glean and gather among the sheaves after the reapers.’ So she came and has remained from morning until now; she has sat in the house only a little.
translation:
  language: te
  text: ఆమె, “దయచేసి కోతకారుల వెనుక ధాన్యపు పనల మధ్య ఏరుకొని పోగుచేసుకోవడానికి నన్ను అనుమతించండి” అని చెప్పింది. అలా ఆమె వచ్చి ఉదయం మొదలుకొని ఇప్పటివరకు అక్కడే ఉంది; ఆ ఇంట్లో కొద్దిసేపు మాత్రమే కూర్చుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ మూలంలోని చివరి వాక్యభాగం క్లిష్టంగా ఉంది. మరొక అనువాదం: “ఆశ్రయంలో ఆమె కొద్దిసేపు మాత్రమే విశ్రాంతి తీసుకుంది.” ఇక్కడ “ఇల్లు” అనే మాట పొలంలోని పనివారి ఆశ్రయాన్ని సూచించవచ్చు.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲלַקֳטָה
  choice: ఏరుకోవడానికి నన్ను అనుమతించండి
  rationale: ఈ సందర్భంలో cohortative రూపం వినయపూర్వకమైన అభ్యర్థనను సూచిస్తుంది; కోత తర్వాత మిగిలిన ధాన్యాన్ని ఏరుకోవడం అనే వ్యవసాయార్థాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: נָּא
  choice: దయచేసి
  rationale: రూతు గౌరవంగా చేసిన అభ్యర్థనలోని మర్యాదను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְאָסַפְתִּי
  choice: పోగుచేసుకోవడానికి
  rationale: לקט అనే ‘ఏరుకొను’ క్రియకు భిన్నంగా, ఏరుకున్నదాన్ని ఒకచోట చేర్చే భావాన్ని నిలుపుతుంది.
- source_word: בָעֳמָרִים
  choice: పనల మధ్య
  rationale: עֳמָרִים అంటే కట్టిన ధాన్యపు పనలు; పొలంలోని దృశ్యానికి సరిపోయే సాధారణ తెలుగు వ్యవసాయ పదం.
- source_word: אַחֲרֵי הַקּוֹצְרִים
  choice: కోత కోసేవారి వెనుక
  rationale: స్థలపరమైన ‘వెనుక’ అనే ప్రాథమిక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וַתָּבֹא וַתַּעֲמוֹד
  choice: అలా ఆమె వచ్చి ... పని చేస్తూనే ఉంది
  rationale: అక్షరార్థంగా ‘వచ్చి నిలిచింది’ అయినా, వెంట వచ్చే కాలవ్యవధి ఆమె అక్కడే ఉండి పనిచేసిన నిరంతరతను సూచిస్తుంది; సందర్భానికి సహజమైన తెలుగులో ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: מֵאָז הַבֹּקֶר וְעַד עַתָּה
  choice: ఉదయం మొదలుకొని ఇప్పటివరకు
  rationale: ఉదయం నుంచి నివేదిక ఇచ్చే సమయం వరకూ కొనసాగిన వ్యవధిని సహజంగా తెలియజేస్తుంది.
- source_word: זֶה שִׁבְתָּהּ הַבַּיִת מְעָט
  choice: ఆశ్రయంలో కొద్దిసేపు మాత్రమే కూర్చుంది
  rationale: హీబ్రూ వాక్యభాగం క్లిష్టమైనది. పొలంలోని పనివారి ఆశ్రయంలో ఆమె గడిపిన సమయం చాలా తక్కువనే సంభావ్య భావాన్ని ప్రధాన పాఠ్యంలో సహజంగా ఇస్తూ, అనిశ్చితిని పాదటిప్పణిలో తెలిపింది.
