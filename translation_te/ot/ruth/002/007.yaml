translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గ్రామీణ వ్యవసాయ సందర్భానికి సరిపోయే ‘పన’, ‘ఏరుకొను’, ‘పోగుచేసుకొను’ వంటి పదాలను ఉపయోగించాం. వాక్యం గౌరవప్రదంగా, సాధారణ పాఠకులకు సులభంగా ఉండేలా రూపొందించాం; క్లిష్టమైన చివరి హీబ్రూ వాక్యభాగంలోని అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
