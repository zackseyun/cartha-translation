translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. వ్యవసాయ సందర్భానికి సరిపోయే ‘పనలు’ అనే పదాన్ని ఉపయోగించింది; మూలంలోని ‘మధ్య’ అనే స్థల సంబంధాన్ని నిలిపింది. అవసరం లేని పాదటిప్పణులను చేర్చలేదు.
