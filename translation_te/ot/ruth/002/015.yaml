  text: וַ/תָּ֖קָם לְ/לַקֵּ֑ט וַ/יְצַו֩ בֹּ֨עַז אֶת נְעָרָ֜י/ו לֵ/אמֹ֗ר גַּ֣ם בֵּ֧ין הָֽ/עֳמָרִ֛ים תְּלַקֵּ֖ט וְ/לֹ֥א תַכְלִימֽוּ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/015.yaml
  text: When she rose to glean[a], Boaz commanded his young men, saying, “Let her glean even among the sheaves[b], and do not humiliate her.”
translation:
  language: te
  text: 'ఆమె ఏరుకోవడానికి లేచినప్పుడు, బోయజు తన యువ పనివారికి ఇలా ఆజ్ఞాపించాడు: “ఆమెను ధాన్యపు కట్టల మధ్య కూడా ఏరుకోనివ్వండి; ఆమెను అవమానపరచకండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם לְלַקֵּט
  choice: ఆమె ఏరుకోవడానికి లేచినప్పుడు
  rationale: קום అనే క్రియ కథనాన్ని ముందుకు నడిపిస్తుంది; לקט యొక్క ఉద్దేశార్థక క్రియారూపాన్ని ‘ఏరుకోవడానికి’ సహజంగా తెలియజేస్తుంది.
- source_word: וַיְצַו ... לֵאמֹר
  choice: ఇలా ఆజ్ఞాపించాడు
  rationale: צוה లోని అధికారపూర్వక ఆదేశ భావాన్ని ‘ఆజ్ఞాపించాడు’ నిలుపుతుంది; לֵאמֹר ను తెలుగులో సహజమైన ప్రత్యక్ష వాక్య పరిచయమైన ‘ఇలా’ ద్వారా వ్యక్తం చేసింది.
- source_word: נְעָרָיו
  choice: తన పనివాళ్లకు
  rationale: నַעַר యువకుడు, సేవకుడు లేదా సహాయకుడు అని సూచించగలదు. ఈ కోత సందర్భంలో బోయజు అధీనంలోని పురుష క్షేత్ర కార్మికులనే ఉద్దేశించినందున ‘పనివాళ్లు’ సహజంగా, సందర్భోచితంగా ఉంది.
- source_word: גַּם בֵּין הָעֳמָרִים
  choice: పనల మధ్య కూడా
  rationale: גַּם అనుమతి సాధారణ హద్దును మించి విస్తరించిందని ‘కూడా’ తెలియజేస్తుంది. בֵּין యొక్క ‘మధ్య’ భావాన్ని నిలిపి, עֳמָרִים ను కోసి కట్టిన ధాన్యపు కట్టలకు వాడే ‘పనలు’గా అనువదించింది.
- source_word: תְּלַקֵּט
  choice: ఏరుకోనివ్వండి
  rationale: ఇక్కడ imperfect అనుమతిని తెలిపే ఆదేశంగా పనిచేస్తుంది; ‘ఏరుకోనివ్వండి’ ఆ అనుమతిపూర్వక ఆజ్ఞను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְלֹא תַכְלִימוּהָ
  choice: ఆమెను అవమానపరచకండి
  rationale: כלם యొక్క హిఫిల్ రూపం సిగ్గుపరచడం లేదా సామాజికంగా అవమానించడం అనే బలమైన భావాన్ని కలిగి ఉంది; ‘అవమానపరచకండి’ దానిని గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
