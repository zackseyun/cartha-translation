id: RUT.2.9
reference: Ruth 2:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עֵינַ֜יִ/ךְ בַּ/שָּׂדֶ֤ה אֲשֶׁר יִקְצֹרוּ/ן֙ וְ/הָלַ֣כְתִּ אַחֲרֵי/הֶ֔ן הֲ/ל֥וֹא צִוִּ֛יתִי אֶת הַ/נְּעָרִ֖ים לְ/בִלְתִּ֣י נָגְעֵ֑/ךְ וְ/צָמִ֗ת וְ/הָלַכְתְּ֙ אֶל הַ/כֵּלִ֔ים וְ/שָׁתִ֕ית מֵ/אֲשֶׁ֥ר יִשְׁאֲב֖וּ/ן הַ/נְּעָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/009.yaml
  text: Keep your eyes on the field where they are harvesting[a], and follow behind them. Have I not commanded the young men not to touch you? When you are thirsty, go to the jars and drink from what the young men have drawn.
translation:
  language: te
  text: వారు కోస్తున్న పొలంమీదే నీ దృష్టి ఉంచి, ఆ స్త్రీల వెనకే వెళ్లు. నిన్ను ముట్టవద్దని[a] నేను యువకులకు ఆజ్ఞాపించాను కదా? నీకు దాహమేస్తే, నీళ్ల కుండల దగ్గరికి వెళ్లి యువకులు తోడిన నీళ్లు తాగు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సందర్భానుసారంగా, “నీ మీద చెయ్యి వేయవద్దని.” హీబ్రూలో అక్షరార్థంగా “నిన్ను ముట్టవద్దని” ఉంది; ఇది వేధించడం లేదా దాడి చేయడం నుంచి రక్షణను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַיִךְ
  choice: నీ దృష్టి ఉంచి
  rationale: మూలంలో అక్షరార్థంగా ‘నీ కళ్లు’ ఉన్నా, ఇక్కడ అంతర్లీనంగా ఉన్న ఆదేశాన్ని సహజమైన ఆధునిక తెలుగులో ‘దృష్టి ఉంచి’ అని వ్యక్తం చేసింది.
- source_word: בַּשָּׂדֶה אֲשֶׁר יִקְצֹרוּן
  choice: వారు కోస్తున్న పొలంమీదే
  rationale: కొనసాగుతున్న కోత పనిని, దృష్టి అదే పొలంపై ఉండాలనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְהָלַכְתְּ אַחֲרֵיהֶן
  choice: ఆ స్త్రీల వెనకే వెళ్లు
  rationale: హీబ్రూ ప్రత్యయం స్త్రీలింగ బహువచనం; అందువల్ల అస్పష్టమైన ‘వారి’కు బదులు సందర్భంలోని స్త్రీ పనివారిని స్పష్టపరుస్తూ, אַחֲרֵי యొక్క వెనక నడిచే స్థలసంబంధ భావాన్ని నిలిపింది.
- source_word: הֲלוֹא צִוִּיתִי
  choice: ఆజ్ఞాపించాను కదా?
  rationale: భరోసా ఇచ్చే హీబ్రూ అలంకారప్రశ్న రూపాన్ని సహజమైన తెలుగు ప్రశ్నాంతంతో నిలిపింది.
- source_word: הַנְּעָרִים
  choice: యువకులు
  rationale: ఇక్కడ బోయజు ఆధీనంలోని పురుష పనివారిని సూచిస్తుంది; ముందున్న స్త్రీలింగ సమూహంతో ఉన్న భేదాన్ని కాపాడుతుంది.
- source_word: לְבִלְתִּי נָגְעֵךְ
  choice: నిన్ను ముట్టవద్దని
  rationale: נגע యొక్క ప్రాథమిక అర్థమైన ‘ముట్టు’ను ప్రధాన పాఠంలో నిలిపి, సందర్భంలో ఉండగల వేధింపు లేదా దాడి భావాన్ని పాదసూచికలో తెలిపింది.
- source_word: וְצָמִת
  choice: నీకు దాహమేస్తే
  rationale: దాహం కలిగే పరిస్థితిని సహజమైన షరతు వాక్యంగా వ్యక్తం చేస్తుంది; ‘దాహమేసినప్పుడు’ అనే భావమూ సందర్భానికి సరిపోతుంది.
- source_word: הַכֵּלִים
  choice: నీళ్ల కుండలు
  rationale: పదానికి సాధారణంగా ‘పాత్రలు’ అని అర్థం; తాగడానికి తోడిన నీటిని ఉంచే సందర్భంలో ‘నీళ్ల కుండలు’ స్పష్టమైన, సహజమైన తెలుగు రూపం.
- source_word: וְשָׁתִית מֵאֲשֶׁר יִשְׁאֲבוּן
  choice: యువకులు తోడిన నీళ్లు తాగు
  rationale: హీబ్రూలో నీరు అనే కర్మ అంతర్లీనంగా ఉంది; తెలుగులో దాన్ని స్పష్టంగా చేర్చి, బావి నుంచి నీరు తీయడాన్ని ‘తోడిన’ అని సహజంగా అనువదించింది.
theological_decisions:
- issue: ‘ముట్టడం’ అనే క్రియ యొక్క సందర్భార్థం
  choice: ప్రధాన పాఠంలో ‘నిన్ను ముట్టవద్దని’
  alternative: ‘నీ మీద చెయ్యి వేయవద్దని’ లేదా ‘నిన్ను వేధించవద్దని’
  rationale: మూలంలోని విస్తృతమైన పదాన్ని ప్రధాన పాఠంలో కాపాడుతూ, అది వేధింపు లేదా దాడి నుంచి రక్షణను కూడా సూచించవచ్చనే సందర్భార్థాన్ని పాదసూచికలో ఉంచింది; దీనివల్ల మూలంలోని ఉద్దేశపూర్వక విస్తృతి సంకుచితం కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. రూతును ఉద్దేశించిన ఏకవచన స్త్రీ సంబోధన తెలుగు క్రియారూపాల్లో సహజంగా లింగచిహ్నం లేకుండా వస్తుంది. ముందున్న స్త్రీ పనివారిని ‘ఆ స్త్రీలు’ అని స్పష్టపరచి హీబ్రూ స్త్రీలింగ బహువచన ప్రత్యయాన్ని నిలిపింది.
