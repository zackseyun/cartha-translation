  text: וַ/תִּשָּׂא֙ וַ/תָּב֣וֹא הָ/עִ֔יר וַ/תֵּ֥רֶא חֲמוֹתָ֖/הּ אֵ֣ת אֲשֶׁר לִקֵּ֑טָה וַ/תּוֹצֵא֙ וַ/תִּתֶּן לָ֔/הּ אֵ֥ת אֲשֶׁר הוֹתִ֖רָה מִ/שָּׂבְעָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/018.yaml
  text: She picked it up and went into the city[a], and her mother-in-law saw what she had gleaned. Then she brought out and gave her what she had left over after she was satisfied.
translation:
  language: te
  text: ఆమె దాన్ని మోసుకొని పట్టణంలోకి వచ్చింది. ఆమె ఏరుకున్నదాన్ని ఆమె అత్త చూసింది. అప్పుడు రూతు తాను తృప్తి చెందిన తర్వాత[a] మిగిల్చినదాన్ని బయటకు తీసి అత్తకు ఇచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కడుపు నిండా తిన్న తర్వాత.”
    reason: מִשָּׂבְעָהּ అనే పదబంధం భోజనం చేసి కడుపు నిండిన భావాన్ని సందర్భానుసారంగా మరింత స్పష్టంగా వ్యక్తం చేయవచ్చు.
lexical_decisions:
- source_word: וַתִּשָּׂא
  choice: ఆమె దాన్ని మోసుకొని
  rationale: נשׂא అంటే ‘ఎత్తు/మోయు.’ రూతు తాను ఏరిన ధాన్యాన్ని ఇంటికి మోసుకువెళ్తున్న సందర్భంలో ‘మోసుకొని’ భౌతిక చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: הָעִיר
  choice: పట్టణంలోకి
  rationale: עִיר నగరం లేదా పట్టణాన్ని సూచించవచ్చు. బేత్లెహేము నేపథ్యానికి ఆధునిక తెలుగులో ‘పట్టణం’ సహజంగా సరిపోతుంది.
- source_word: חֲמוֹתָהּ
  choice: ఆమె అత్త
  rationale: ఈ బంధుత్వ పదం భర్త తల్లిని సూచిస్తుంది; తెలుగులో ‘అత్త’ సహజమైన, స్పష్టమైన సమానార్థకం.
- source_word: אֵת אֲשֶׁר לִקֵּטָה
  choice: ఆమె ఏరుకున్నదాన్ని
  rationale: לקט పంట కోసేవారి వెనుక మిగిలిన ధాన్యాన్ని ఏరడాన్ని సూచిస్తుంది. సందర్భంలో ‘ఏరుకున్నది’ ఆ ప్రత్యేక వ్యవసాయ చర్యను సహజంగా నిలుపుతుంది.
- source_word: וַתּוֹצֵא
  choice: బయటకు తీసి
  rationale: Hiphil రూపంలోని יצא ‘బయటకు తీయు/తెచ్చు’ అనే అర్థమిస్తుంది. రూతు దాచిపెట్టిన ఆహారాన్ని తీసి ఇవ్వడాన్ని ఇది స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַתִּתֶּן לָהּ
  choice: అత్తకు ఇచ్చింది
  rationale: לָהּ లోని పరోక్ష కర్మను తెలుగులో ‘అత్తకు’ అని స్పష్టపరచడం సహజంగా ఉంటుంది; సందర్భంలో దాని సూచన నయోమికే.
- source_word: אֵת אֲשֶׁר הוֹתִרָה
  choice: మిగిల్చినదాన్ని
  rationale: יתר యొక్క ఈ రూపం మిగిలేలా ఉంచడం లేదా మిగిల్చడం అని అర్థం. రూతు తన భోజనంలో మిగిల్చిన భాగాన్ని సూచించడానికి ఈ రూపం సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: מִשָּׂבְעָהּ
  choice: తాను తృప్తి చెందిన తర్వాత
  rationale: שׂבע తృప్తి లేదా నిండుదనాన్ని సూచిస్తుంది; מִן ఉపసర్గతో ఇక్కడ తృప్తి చెందిన తరువాతి స్థితి భావం వస్తుంది. ప్రధాన పాఠంలో భోజనాన్ని అవసరానికి మించి స్పష్టీకరించకుండా మూలంలోని వ్యక్తీకరణను నిలిపాం.
