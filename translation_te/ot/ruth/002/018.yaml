translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. చివరి వాక్యంలో వరుసగా వచ్చే స్త్రీలింగ సర్వనామాల వల్ల కలిగే అస్పష్టతను తగ్గించడానికి ‘రూతు,’ ‘అత్తకు’ అని పేరూ బంధుత్వ పదమూ స్పష్టంగా ఉంచబడ్డాయి.
