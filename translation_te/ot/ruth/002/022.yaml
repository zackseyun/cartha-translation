  text: וַ/תֹּ֥אמֶר נָעֳמִ֖י אֶל ר֣וּת כַּלָּתָ֑/הּ ט֣וֹב בִּתִּ֗/י כִּ֤י תֵֽצְאִי֙ עִם נַ֣עֲרוֹתָ֔י/ו וְ/לֹ֥א יִפְגְּעוּ בָ֖/ךְ בְּ/שָׂדֶ֥ה אַחֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/022.yaml
  text: Then Naomi said to Ruth her daughter-in-law[a], “It is good, my daughter, that you go out with his young women, so that they do not come upon you in another field.”
translation:
  language: te
  text: అప్పుడు నయోమి తన కోడలైన రూతుతో, “నా బిడ్డా, నువ్వు బోయజు యువతులతో కలిసి వెళ్లడం మంచిది; అలా చేస్తే వేరొక పొలంలో ఎవరూ నిన్ను ఇబ్బంది పెట్టరు[a],” అని చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వేరొక పొలంలో ఎవరూ నిన్ను ఎదుర్కోరు.” హీబ్రూ క్రియకు సాధారణంగా ఎదురుపడడం అనే అర్థమూ, సందర్భానుసారంగా ఇబ్బంది కలిగించే లేదా హానికరమైన ఎదురుపడడం అనే అర్థమూ ఉండవచ్చు. రూతు భద్రత పట్ల నయోమి చూపుతున్న శ్రద్ధ ఇక్కడ ప్రతికూల భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అప్పుడు ... చెప్పింది
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: כַּלָּתָהּ
  choice: తన కోడలైన
  rationale: మూడవ పురుష ఏకవచన స్త్రీలింగ ప్రత్యయం నయోమితో రూతుకు ఉన్న కోడలి సంబంధాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: טוֹב
  choice: మంచిది
  rationale: ఇది నయోమి చేసిన సాధారణ మదింపు; ‘అత్యుత్తమం’ వంటి అతిశయార్థాన్ని చేర్చదు.
- source_word: בִּתִּי
  choice: నా కుమారీ
  rationale: ఇక్కడ ఇది అక్షరార్థ మాతృత్వం కాకుండా కుటుంబ అనురాగాన్ని, సామాజిక సంబంధాన్ని తెలిపే సంబోధన.
- source_word: כִּי
  choice: నువ్వు ... వెళ్లడం
  rationale: నయోమి ‘మంచిది’ అని మదింపు చేసిన విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో నామీకృత క్రియారూపంతో సహజంగా వ్యక్తమవుతుంది.
- source_word: תֵצְאִי
  choice: వెళ్లడం
  rationale: మూల క్రియ ‘బయలుదేరడం/వెళ్లడం’ మాత్రమే చెబుతుంది; సందర్భంలో ఉన్న ‘ఏరుకోవడం’ అనే భావాన్ని అనవసరంగా క్రియలో చేర్చలేదు.
- source_word: נַעֲרוֹתָיו
  choice: అతని పనిపిల్లలతో
  rationale: స్త్రీలింగ బహువచనం బోయజు వద్ద పనిచేసే యువతులను సూచిస్తుంది; ఆధునిక తెలుగులో వారి పని సంబంధాన్ని సహజంగా తెలియజేస్తుంది, అయితే వారి చట్టపరమైన సేవక హోదాను అతిగా నిర్దిష్టం చేయదు.
- source_word: וְלֹא יִפְגְּעוּ בָךְ
  choice: అప్పుడు ... ఎవరూ నీకు హాని చేయరు[a]
  rationale: פגע కలవడం నుండి హానికరంగా ఎదురుపడడం వరకు అర్థాలను కలిగి ఉంటుంది. భద్రత గురించిన సందర్భం ప్రతికూల భావాన్ని సూచిస్తుంది; ప్రధాన పాఠం సహజంగా ఉండేందుకు ‘హాని చేయరు’ అని ఇచ్చి, అసలు పదంలోని విస్తృతిని పాదటిప్పణిలో ఉంచాం.
- source_word: בְּשָׂדֶה אַחֵר
  choice: వేరొక పొలంలో
  rationale: స్థలాన్ని తెలిపే పదబంధానికి సూటిగా, సహజంగా ఉన్న తెలుగు రూపం.
theological_decisions:
- issue: פגע అనే క్రియలోని ముప్పు తీవ్రత
  choice: ప్రధాన పాఠంలో ‘హాని చేయరు’
  alternative: ‘నీకు ఎదురుపడరు’ లేదా ‘నిన్ను వేధించరు/దాడి చేయరు’
  rationale: సందర్భం రూతు భద్రతపై ఆందోళనను సూచించినా, మూల క్రియ తప్పనిసరిగా దాడినే నిర్దిష్టం చేయదు. అందువల్ల సాధారణ ప్రతికూల భావాన్ని ప్రధాన పాఠంలో ఉంచి, సంభావ్య అర్థ పరిధిని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘నా కుమారీ’ అనురాగపూర్వక సంబోధనను నిలుపుతుంది. భద్రతకు సంబంధించిన అస్పష్టతను ప్రధాన పాఠం మరియు పాదటిప్పణి కలిసి కాపాడుతాయి.
