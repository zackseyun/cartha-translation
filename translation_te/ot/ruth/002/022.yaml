revisions:
- from: అప్పుడు నయోమి తన కోడలైన రూతుతో, “నా కుమారీ, నువ్వు అతని పనిపిల్లలతో కలిసి వెళ్లడం మంచిది. అప్పుడు వేరొక పొలంలో ఎవరూ నీకు హాని చేయరు[a]” అని చెప్పింది.
  to: అప్పుడు నయోమి తన కోడలైన రూతుతో, “నా బిడ్డా, నువ్వు బోయజు యువతులతో కలిసి వెళ్లడం మంచిది; అలా చేస్తే వేరొక పొలంలో ఎవరూ నిన్ను ఇబ్బంది పెట్టరు[a],” అని చెప్పింది.
  rationale: The revision improves modern Telugu idiom, avoids over-specifying the status of Boaz's female workers and the severity of the potential encounter, and makes the Hebrew clause relationship clear. The footnote preserves the lexical ambiguity of פגע without asserting a specific form of assault.
