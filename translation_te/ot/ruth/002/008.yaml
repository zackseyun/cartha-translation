id: RUT.2.8
reference: Ruth 2:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ בֹּ֨עַז אֶל ר֜וּת הֲ/ל֧וֹא שָׁמַ֣עַתְּ בִּתִּ֗/י אַל תֵּלְכִי֙ לִ/לְקֹט֙ בְּ/שָׂדֶ֣ה אַחֵ֔ר וְ/גַ֛ם לֹ֥א תַעֲבוּרִ֖י מִ/זֶּ֑ה וְ/כֹ֥ה תִדְבָּקִ֖י/ן עִם נַעֲרֹתָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/008.yaml
  text: 'Then Boaz said to Ruth, “Listen, my daughter: do not go to glean in another field, and also do not go away from here, but stay close with my young women.”'
translation:
  language: te
  text: 'అప్పుడు బోయజు రూతుతో ఇలా అన్నాడు: “నా కుమారీ, విన్నావా? వేరే పొలంలో ఏరుకోవడానికి వెళ్లకు; ఇక్కడి నుంచి వెళ్లిపోకు. నా యువతులతోనే సన్నిహితంగా ఉండు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא שָׁמַעַתְּ
  choice: విను
  rationale: అక్షరార్థంగా ప్రశ్నారూపంలో ‘నీవు వినలేదా?’ అయినా, ఈ సందర్భంలో ఇది శ్రద్ధగా వినమనే ఆప్యాయమైన ఆదేశంగా పనిచేస్తుంది.
- source_word: בִּתִּי
  choice: నా కుమారీ
  rationale: బంధుత్వాన్ని కాకుండా బోయజు చూపిన ఆప్యాయతను, పెద్దవాడిగా పలికిన గౌరవపూర్వక సంబోధనను తెలియజేస్తుంది.
- source_word: לִלְקֹט
  choice: ఏరుకోవడానికి
  rationale: కోత తరువాత పొలంలో మిగిలిన ధాన్యపు కంకులను సేకరించడాన్ని సందర్భానుసారంగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְגַם לֹא תַעֲבוּרִי מִזֶּה
  choice: ఇక్కడి నుంచి వెళ్లిపోకు
  rationale: మరొక చోటికి దాటిపోవద్దనే భావాన్ని సహజంగా అందిస్తుంది; ముందున్న ‘వేరే పొలంలో ... వెళ్లకు’ అనే మాటతో ఉద్దేశపూర్వకంగా బలపరచబడిన నిషేధాన్ని నిలుపుతుంది.
- source_word: תִדְבָּקִין עִם נַעֲרֹתָי
  choice: నా పనికత్తెలతోనే కలిసి ఉండు
  rationale: דבק లోని దగ్గరగా అంటిపెట్టుకొని ఉండే భావాన్ని ‘కలిసి ఉండు’గా, נערות ను ఈ వ్యవసాయ సందర్భంలో పనిచేసే యువతులుగా ‘పనికత్తెలు’ అని అందిస్తుంది; ‘తో’ అనే సంబంధాన్ని కూడా కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: 'సహజమైన ఆధునిక ప్రామాణిక తెలుగు; బోయజు మాటల్లోని ఆప్యాయతతో కూడిన అధికారాన్ని నిలిపి, సాధారణ పాఠకులకు అర్థమయ్యే వ్యవసాయ పదజాలాన్ని ఉపయోగించాం. ముగింపు ప్రత్యక్ష వాక్యానికి తెలుగు ముగింపు ఉద్ధరణ చిహ్నం జోడించాలి: ”'
