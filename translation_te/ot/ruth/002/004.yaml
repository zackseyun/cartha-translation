source:
  edition: WLC
  text: וְ/הִנֵּה בֹ֗עַז בָּ֚א מִ/בֵּ֣ית לֶ֔חֶם וַ/יֹּ֥אמֶר לַ/קּוֹצְרִ֖ים יְהוָ֣ה עִמָּ/כֶ֑ם וַ/יֹּ֥אמְרוּ ל֖/וֹ יְבָרֶכְ/ךָ֥ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/004.yaml
  text: And behold[a], Boaz came from Bethlehem and said to the reapers, “Yahweh be with you.” And they said to him[b], “May Yahweh bless you.”
translation:
  language: te
  text: ఇదిగో[a], బోయజు బేత్లెహేము నుండి వచ్చి పంట కోసేవారితో ఇలా అన్నాడు, “యహ్వే మీతో ఉండుగాక!” వారు అతనితో ఇలా అన్నారు, “యహ్వే నిన్ను ఆశీర్వదించుగాక[b]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం కొత్త దృశ్యాన్ని పాఠకుని దృష్టికి సజీవంగా తీసుకొస్తుంది; ‘చూడండి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ క్రియారూపం కోరిక లేదా ఆశీర్వాదాన్ని వ్యక్తం చేస్తుంది; ‘యహ్వే నిన్ను ఆశీర్వదించును గాక’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హీబ్రూ కథనంలో ఇది కొత్త దృశ్యాన్ని సజీవంగా పాఠకుని దృష్టికి తెచ్చే సూచక పదం. ‘ఇదిగో’ దాని కథన ఉజ్జీవాన్ని నిలుపుతుంది.
- source_word: בֹעַז
  choice: బోయజు
  rationale: వ్యక్తి పేరును ఆధునిక తెలుగు బైబిలు పాఠకులకు గుర్తుపట్టదగిన రూపంలో లిప్యంతరీకరించింది.
- source_word: בָּא מִבֵּית לֶחֶם
  choice: బేత్లెహేము నుండి వచ్చి
  rationale: בוא క్రియకు సహజమైన ‘వచ్చు’ను, מִן ఉపసర్గకు నేరుగా ‘నుండి’ని వాడింది.
- source_word: לַקֹּצְרִים
  choice: కోత కోసేవారితో
  rationale: קצר అనే వ్యవసాయ క్రియను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలిపే సహజ పదబంధం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ వ్యక్తినామానికి సమీపంగా లిప్యంతరీకరించింది.
- source_word: עִמָּכֶם
  choice: మీకు తోడుగా ఉండుగాక
  rationale: పదశః ‘మీతో’ అనే క్రియారహిత వాక్యం ఈ సందర్భంలో పలకరింపు-ఆశీర్వాద భావాన్ని కలిగి ఉంది; తెలుగు ఆశీర్వచనంలో ఆ భావాన్ని సహజంగా వ్యక్తం చేసింది.
- source_word: יְבָרֶכְךָ
  choice: మిమ్మల్ని ఆశీర్వదించుగాక
  rationale: ఈ క్రియారూపం కోరిక లేదా ఆశీర్వాదాన్ని వ్యక్తం చేస్తుంది; ‘గాక’ ఆ భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా, సాధ్యమైన హీబ్రూ ఉచ్చారణకు సమీపంగా ‘యహ్వే’ అని ఇచ్చింది.
- issue: יְהוָה עִמָּכֶם వాక్య స్వభావం
  choice: ఆశీర్వాదపూర్వక పలకరింపుగా ‘యహ్వే మీకు తోడుగా ఉండుగాక’
  alternative: ‘యహ్వే మీతో ఉన్నాడు’ అనే ప్రకటన
  rationale: క్రియలేని హీబ్రూ నిర్మాణం వ్యాకరణపరంగా ప్రకటనలా అర్థమయ్యే అవకాశం ఉన్నా, పనివారికి పలికిన అభివాద సందర్భం ఆశీర్వచన భావాన్ని బలపరుస్తుంది; ఆ సందర్భార్థాన్ని తెలుగులో ‘ఉండుగాక’తో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడింది. ‘ఉండుగాక’, ‘ఆశీర్వదించుగాక’ అనే రూపాలు పలకరింపు మరియు ఆశీర్వచన స్వరాన్ని నిలుపుతాయి; మిగతా వాక్య నిర్మాణం సాధారణ పాఠకులకు సులభంగా ఉండేలా ఉంచింది.
