    text: లేదా, “మీ దాసురాలితో దయగా మాట్లాడారు.” హీబ్రూలో అక్షరార్థంగా, “మీ దాసురాలి హృదయానికి మాట్లాడారు” అని ఉంది.
    reason: lexical_alternative
  revision_rationale: The revision corrects the direction of the Hebrew idiom “speak to the heart,” using an idiomatic Telugu main-text rendering (“హృదయాన్ని తాకేలా మాట్లాడారు”) and a properly aligned literal explanation in the footnote. It also smooths the final comparison without altering Ruth’s humble self-assessment.
