translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవభరితమైన శైలిని వాడాం. రూతు వినయాన్ని చూపడానికి బోయజును బహువచన గౌరవ రూపాలతో సంబోధింపజేశాం. ప్రధాన పాఠ్యంలో హీబ్రూ ‘హృదయంతో మాట్లాడడం’ అనే రూపకాన్ని నిలిపి, దాని సహజ భావాన్ని పాదసూచికలో ఇచ్చాం.
