source:
  edition: WLC
  text: וַ֠/תֹּאמֶר אֶמְצָא חֵ֨ן בְּ/עֵינֶ֤י/ךָ אֲדֹנִ/י֙ כִּ֣י נִֽחַמְתָּ֔/נִי וְ/כִ֥י דִבַּ֖רְתָּ עַל לֵ֣ב שִׁפְחָתֶ֑/ךָ וְ/אָנֹכִי֙ לֹ֣א אֶֽהְיֶ֔ה כְּ/אַחַ֖ת שִׁפְחֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/013.yaml
  text: Then she said[a], “May I find favor in your eyes, my lord, because you have comforted me and because you have spoken to the heart of your servant, though I am not like one of your female servants.”
translation:
  language: te
  text: అప్పుడు ఆమె, “నా ప్రభువా, మీ దృష్టిలో నాకు దయ లభించుగాక. ఎందుకంటే మీరు నన్ను ఓదార్చారు, మీ దాసురాలితో హృదయాన్ని తాకేలా మాట్లాడారు[a]. అయినా నేను మీ దాసురాళ్లలో ఒకదానిలా కూడా లేను” అని చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ దాసురాలితో దయగా మాట్లాడారు.” హీబ్రూలో అక్షరార్థంగా, “మీ దాసురాలి హృదయానికి మాట్లాడారు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶמְצָא חֵן
  choice: నాకు దయ లభించుగాక
  rationale: ఈ సందర్భంలో ప్రథమ పురుష అసంపూర్ణ క్రియ వినయపూర్వకమైన కోరికను లేదా ఆశను వ్యక్తం చేస్తుంది. ‘దయ లభించుగాక’ అనే రూపం ఆ భావాన్నీ, ‘అనుగ్రహం పొందడం’ అనే హీబ్రూ నుడికారాన్నీ సహజమైన తెలుగులో అందిస్తుంది.
- source_word: בְּעֵינֶיךָ
  choice: మీ దృష్టిలో
  rationale: ‘నీ కళ్లలో’ అనే హీబ్రూ చిత్రాన్ని పదక్షరంగా అనువదించడం తెలుగులో కృత్రిమంగా ఉంటుంది. ‘మీ దృష్టిలో’ మూలంలోని అంచనా/అనుకూలత భావాన్ని నిలుపుతూ సహజంగా ఉంటుంది.
- source_word: אֲדֹנִי
  choice: నా ప్రభువా
  rationale: ఇది బోయజును గౌరవంగా సంబోధించే మానవ బిరుదు, దేవుని బిరుదు కాదు. ‘నా ప్రభువా’ సామాజిక వినయాన్ని నిలుపుతుంది; సందర్భం దీని మానవ ప్రయోగాన్ని స్పష్టం చేస్తుంది.
- source_word: נִחַמְתָּנִי
  choice: మీరు నన్ను ఓదార్చారు
  rationale: נחם ఇక్కడ రూతు దుర్బల స్థితిలో పొందిన ఆదరణ, మనశ్శాంతిని సూచిస్తుంది. ‘ఓదార్చారు’ ఆ భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דִבַּרְתָּ עַל־לֵב
  choice: హృదయంతో మాట్లాడారు
  rationale: మూల నుడికారం అక్షరార్థంగా ‘హృదయానికి/హృదయం మీద మాట్లాడడం’; దాని భావం దయగా, ధైర్యం కలిగించేలా మాట్లాడడం. ప్రధాన పాఠ్యంలో హీబ్రూ రూపకాన్ని సాధ్యమైనంత నిలిపి, భావానువాదాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: שִׁפְחָתֶךָ / שִׁפְחֹתֶיךָ
  choice: మీ దాసురాలు / మీ దాసురాళ్లు
  rationale: ఈ నామవాచకం స్త్రీ సేవకురాలిని లేదా బానిస స్త్రీని ప్రత్యేకంగా సూచిస్తుంది. ఇక్కడ రూతు వినయపూర్వక స్వీయసంబోధన, ఇంటి సేవకురాళ్లతో పోలిక ప్రధానమైనవి కాబట్టి ‘దాసురాలు/దాసురాళ్లు’ లింగ విశిష్టతను, సామాజిక స్థాయిని నిలుపుతుంది.
- source_word: וְאָנֹכִי לֹא אֶהְיֶה כְּאַחַת
  choice: అయినా నేను ... ఒకదానితో కూడా సమానం కాను
  rationale: ఈ వాక్యభాగం బోయజు చూపిన దయకు, రూతు తనకు ఉన్నదని భావించిన తక్కువ స్థాయికి మధ్య వ్యత్యాసాన్ని తెలియజేస్తుంది. ‘అయినా’ ఆ concessive సంబంధాన్ని సహజంగా చూపుతుంది; ‘సమానం కాను’ כְּאַחַת లోని పోలికను నిలుపుతుంది.
