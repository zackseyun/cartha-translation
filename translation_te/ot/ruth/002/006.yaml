source:
  edition: WLC
  text: וַ/יַּ֗עַן הַ/נַּ֛עַר הַ/נִּצָּ֥ב עַל הַ/קּוֹצְרִ֖ים וַ/יֹּאמַ֑ר נַעֲרָ֤ה מֽוֹאֲבִיָּה֙ הִ֔יא הַ/שָּׁ֥בָה עִֽם נָעֳמִ֖י מִ/שְּׂדֵ֥ה מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/006.yaml
  text: Then the young man who was set over the reapers answered and said[a], “She is a young Moabite woman who returned with Naomi from the fields of Moab.”
translation:
  language: te
  text: 'అప్పుడు కోత కోసేవారికి బాధ్యుడిగా నియమించబడిన యువకుడు జవాబిచ్చి ఇలా అన్నాడు: “ఈమె నయోమితో కలిసి మోయాబు పొలాల నుండి తిరిగి వచ్చిన మోయాబీయ యువతి[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మోయాబు పొలం నుండి”; హీబ్రూలోని ఏకవచన పదాన్ని మోయాబులోని వ్యవసాయ భూమిని సమష్టిగా సూచించేదిగా కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: జవాబిస్తూ ... అన్నాడు
  rationale: హీబ్రూ కథనంలోని ‘జవాబిచ్చి చెప్పాడు’ అనే ద్వంద్వ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది; ప్రతిస్పందన భావాన్ని నిలుపుతుంది.
- source_word: הַנַּעַר
  choice: యువకుడు
  rationale: నామవాచకపు ప్రాథమిక అర్థాన్ని నిలుపుతూ, అతని పర్యవేక్షణ బాధ్యతను తరువాతి విశేషణ భాగంలో ప్రత్యేకంగా తెలియజేస్తుంది.
- source_word: הַנִּצָּב עַל הַקּוֹצְרִים
  choice: కోత కోసేవారిపై నియమించబడిన
  rationale: נצב యొక్క స్థాపించబడిన/నియమితుడైన భావాన్నీ, עַל సూచించే పర్యవేక్షణ అధికారాన్నీ అతిగా వ్యాఖ్యానించకుండా తెలియజేస్తుంది.
- source_word: הַקּוֹצְרִים
  choice: కోత కోసేవారు
  rationale: ధాన్యాన్ని కోసే పనివారిని సాధారణ పాఠకులకు స్పష్టమైన, సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: נַעֲרָה מוֹאֲבִיָּה הִיא
  choice: ఈమె మోయాబీయ యువతి
  rationale: యువతి అనే భావాన్నీ మోయాబు జాతి/ప్రాంత సంబంధాన్నీ నేరుగా నిలుపుతుంది; స్వతంత్ర సర్వనామాన్ని సహజమైన గుర్తింపు వాక్యంగా ‘ఈమె’తో వ్యక్తం చేస్తుంది.
- source_word: הַשָּׁבָה עִם נָעֳמִי
  choice: నయోమితో కలిసి ... తిరిగి వచ్చింది
  rationale: שוב యొక్క ‘తిరిగి రావడం’ అనే కథనపరమైన ముఖ్య భావాన్ని, Naomiతో సహవాసాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מִשְּׂדֵה מוֹאָב
  choice: మోయాబు పొలప్రాంతం నుండి
  rationale: ఏకవచన שְׂדֵה ఇక్కడ సామూహికంగా లేదా ప్రాంతార్థంలో ఉండగలదనే అస్పష్టతను ‘పొలప్రాంతం’ సహజంగా ప్రతిబింబిస్తుంది.
