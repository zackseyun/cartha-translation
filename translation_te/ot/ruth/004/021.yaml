    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שַׂלְמוֹן
  choice: శల్మోను
  rationale: వంశావళిలోని వరుసను తెలుగులో సహజంగా కొనసాగించేందుకు ఆరంభ సంధికారకాన్ని ప్రత్యేకంగా అనువదించలేదు; వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: యలద్ ధాతువు హిఫీల్ రూపం వంశావళి సందర్భంలో ‘కనెను/జన్మనిచ్చాడు’ అనే భావం ఇస్తుంది. ‘తండ్రి అయ్యాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, పురుష వంశ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אֶת
  choice: '[అనువదించలేదు]'
  rationale: ఇది నిర్దిష్ట ప్రత్యక్ష కర్మను సూచించే హీబ్రూ వ్యాకరణ చిహ్నం; తెలుగులో దీనికి ప్రత్యేక పదం అవసరం లేదు.
- source_word: בֹּעַז
  choice: బోయజు
  rationale: వ్యక్తి పేరును ఆధునిక తెలుగు బైబిలు పాఠకులకు పరిచితమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: וּ/בֹעַז
  choice: బోయజు
  rationale: రెండవ వాక్యభాగాన్ని అర్థవిరామ చిహ్నంతో సమన్వయపరిచినందున prefixed conjunctionను విడిగా ‘మరియు’ అని అనువదించలేదు; హీబ్రూ వంశావళి క్రమం మాత్రం నిలిచింది.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళిలోని సమాంతర నిర్మాణం, పదప్రయోగ స్థిరత్వం నిలిచేలా అదే అనువాదాన్ని పునరావృతం చేశాం.
- source_word: עוֹבֵד
  choice: ఓబేదు
  rationale: వ్యక్తి పేరును తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
