lexical_decisions:
- source_word: וַתִּקַּח
  choice: తీసుకొని
  rationale: לקח అనే క్రియ ఇక్కడ కథన క్రమంలో బిడ్డను భౌతికంగా తీసుకోవడాన్ని సూచిస్తుంది; అందువల్ల సహజమైన తెలుగు రూపం ‘తీసుకొని’.
- source_word: הַיֶּלֶד
  choice: ఆ బిడ్డను
  rationale: יֶלֶדకు ‘బిడ్డ’ లేదా ‘బాలుడు’ అనే అర్థాలు ఉండవచ్చు. సందర్భంలో నవజాత శిశువు ఉన్నందున ‘బిడ్డ’ వయస్సుకు తగిన సహజ పదం.
- source_word: וַתְּשִׁתֵהוּ
  choice: ఉంచుకుంది
  rationale: שׁית క్రియకు ‘పెట్టు/ఉంచు’ అనే భావం. ఒడిలో బిడ్డను పెట్టుకొని ఉండే సన్నిహిత దృశ్యాన్ని తెలుగులో ‘ఉంచుకుంది’ సహజంగా తెలియజేస్తుంది.
- source_word: בְחֵיקָהּ
  choice: తన ఒడిలో
  rationale: חֵיק వక్షస్థలం లేదా ఒడి ప్రాంతాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘తన ఒడిలో’ స్పష్టంగా, సహజంగా ఉంది; మూలంలోని శారీరక దృశ్యాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: וַתְּהִי לוֹ
  choice: ఆమె అతనికి … అయింది
  rationale: היה + ל నిర్మాణం ఏర్పడిన పాత్రను లేదా సంబంధాన్ని సూచిస్తుంది. తెలుగులో ‘అతనికి … అయింది’ ఆ కథన పరిణామాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְאֹמֶנֶת
  choice: సంరక్షకురాలు
  rationale: אֹמֶנֶת బిడ్డను పోషించి, పెంచి, చూసుకునే స్త్రీని సూచిస్తుంది. ‘సంరక్షకురాలు’ వైద్య వృత్తిలోని నర్సు అనే అపార్థాన్ని నివారిస్తూనే ప్రధాన భావాన్ని అందిస్తుంది; పూర్తి భావవ్యాప్తిని పాదసూచిక వివరిస్తుంది.
