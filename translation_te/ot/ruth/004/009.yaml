  text: וַ/יֹּאמֶר֩ בֹּ֨עַז לַ/זְּקֵנִ֜ים וְ/כָל הָ/עָ֗ם עֵדִ֤ים אַתֶּם֙ הַ/יּ֔וֹם כִּ֤י קָנִ֨יתִי֙ אֶת כָּל אֲשֶׁ֣ר לֶֽ/אֱלִימֶ֔לֶךְ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר לְ/כִלְי֖וֹן וּ/מַחְל֑וֹן מִ/יַּ֖ד נָעֳמִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/009.yaml
  text: Then Boaz said to the elders and all the people[b][a], “You are witnesses today that I have acquired from the hand of Naomi all that belonged to Elimelech and all that belonged to Chilion and Mahlon.”
translation:
  language: te
  text: 'అప్పుడు బోయజు పెద్దలకూ ప్రజలందరికీ ఇలా అన్నాడు: “ఈ రోజు మీరు సాక్షులు: ఎలీమెలెకుకు చెందినదంతటినీ, కిల్యోను, మహ్లోనులకు చెందినదంతటినీ నయోమి చేతినుండి[b] నేను సొంతం చేసుకున్నాను[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కొన్నాను,” “కొనుగోలు చేశాను”; హీబ్రూ క్రియ న్యాయపరమైన లావాదేవీలో కొనుగోలు ద్వారా సొంతం చేసుకోవడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ నుడికారంలో “నయోమి చేతినుండి” అంటే నయోమి అధీనంలోనుండి లేదా ఆమె నియంత్రణలోనుండి అని అర్థం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజమైన ఆధునిక తెలుగు కథనశైలిలో తెలియజేస్తుంది.
- source_word: לַזְּקֵנִים וְכָל הָעָם
  choice: పెద్దలతోనూ ప్రజలందరితోనూ
  rationale: న్యాయపరమైన లావాదేవీ వద్ద ఉన్న రెండు వర్గాలనూ స్పష్టంగా ఉంచుతూ, ప్రత్యక్షంగా వారితో మాట్లాడిన భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: עֵדִים אַתֶּם הַיּוֹם
  choice: ఈ రోజు మీరు సాక్షులు
  rationale: హీబ్రూ విధేయ-ప్రథమ నిర్మాణాన్ని అర్థస్పష్టమైన తెలుగు పదక్రమంలో అందిస్తుంది; ‘ఈ రోజు’ ఆధునికంగా, సహజంగా ఉంది.
- source_word: כִּי
  choice: అనడానికి
  rationale: ఇక్కడ כִּי కారణాన్ని కాకుండా సాక్ష్య ప్రకటనలోని విషయాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘అనడానికి’ ఆ సంబంధాన్ని సహజంగా చూపిస్తుంది.
- source_word: קָנִיתִי
  choice: నేను సొంతం చేసుకున్నాను
  rationale: ఈ న్యాయపరమైన ఆస్తి బదిలీలో క్రియకు ‘పొందడం/కొనుగోలు చేయడం’ అనే విస్తృత భావం ఉంది. ‘సొంతం చేసుకున్నాను’ నగదు కొనుగోలనే భావాన్ని తప్పనిసరి చేయకుండా హక్కుల బదిలీని తెలియజేస్తుంది.
- source_word: אֶת כָּל אֲשֶׁר לֶאֱלִימֶלֶךְ
  choice: ఎలీమెలెకుకు చెందినదంతటినీ
  rationale: ‘ఎలీమెలెకుకు ఉన్నదంతా’ అనే హీబ్రూ స్వామ్య ప్రయోగాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְאֵת כָּל אֲשֶׁר לְכִלְיוֹן וּמַחְלוֹן
  choice: కిల్యోనుకు మహ్లోనుకు చెందినదంతటినీ
  rationale: ముందటి స్వామ్య వాక్యభాగానికి సమాంతరతను నిలుపుతూ ఇద్దరి పేర్లనూ స్పష్టంగా అనుసంధానిస్తుంది.
- source_word: מִיַּד נָעֳמִי
  choice: నయోమి చేతినుండి
  rationale: హీబ్రూ న్యాయపరమైన నుడికారంలోని ‘చేతినుండి’ రూపాన్ని నిలుపుతుంది; దాని భావం నయోమి అధీనంలోనుండి లేదా ఆమె నియంత్రణలోనుండి అని పాదటిప్పణి వివరిస్తుంది.
theological_decisions:
- issue: బోయజు చేసిన లావాదేవీ స్వభావం
  choice: ఆస్తి హక్కుల బదిలీని ‘సొంతం చేసుకున్నాను’ అని అనువదించడం
  alternative: ‘కొన్నాను’ లేదా ‘కొనుగోలు చేశాను’
  rationale: వాక్యం ఎలీమెలెకు, కిల్యోను, మహ్లోనులకు చెందిన ఆస్తిని నయోమి చేతినుండి పొందిన న్యాయపరమైన లావాదేవీ గురించి చెబుతుంది. ‘సొంతం చేసుకున్నాను’ అనేది వ్యక్తులను కొనుగోలు చేశాడనే సూచనను కలిగించకుండా, మూలపాఠంలోని విస్తృతమైన స్వాధీన భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. న్యాయపరమైన సందర్భం స్పష్టంగా ఉండేలా పదాలను ఎంచుకున్నప్పటికీ, హీబ్రూ క్రియ సూచించగల ‘సొంతం చేసుకోవడం/కొనుగోలు చేయడం’ అనే భావ విస్తృతిని పాదటిప్పణిలో నిలిపాం. అన్ని పాదటిప్పణి గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
