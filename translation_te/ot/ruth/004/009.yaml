revisions:
- from: 'అప్పుడు బోయజు పెద్దలతోనూ ప్రజలందరితోనూ ఇలా అన్నాడు: “ఎలీమెలెకుకు చెందినదంతటినీ, కిల్యోనుకు మహ్లోనుకు చెందినదంతటినీ నయోమి చేతినుండి[b] నేను సొంతం చేసుకున్నాను[a] అనడానికి ఈ రోజు మీరు సాక్షులు.”'
  to: 'అప్పుడు బోయజు పెద్దలకూ ప్రజలందరికీ ఇలా అన్నాడు: “ఈ రోజు మీరు సాక్షులు: ఎలీమెలెకుకు చెందినదంతటినీ, కిల్యోను, మహ్లోనులకు చెందినదంతటినీ నయోమి చేతినుండి[b] నేను సొంతం చేసుకున్నాను[a].”'
