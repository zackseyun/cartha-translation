    issue: The verb for the sandal action is slightly imprecise.
    rationale: וַיִּשְׁלֹף means ‘drew off/took off.’ In Telugu, ‘విప్పాడు’ may mean ‘unfastened/undid,’ whereas ‘తీసివేశాడు’ directly communicates removal.
