id: RUT.4.8
reference: Ruth 4:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר הַ/גֹּאֵ֛ל לְ/בֹ֖עַז קְנֵה לָ֑/ךְ וַ/יִּשְׁלֹ֖ף נַעֲלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/008.yaml
  text: So the redeemer said to Boaz[b][a], “Buy it for yourself,” and he took off his sandal.
translation:
  language: te
  text: అప్పుడు ఆ విమోచకుడు[a] బోయజుతో, “నువ్వే కొనుక్కో” అని చెప్పి, తన చెప్పును తీసివేశాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సమీప బంధువైన విమోచకుడు.” ఇక్కడి హీబ్రూ పదం కుటుంబ ఆస్తిని లేదా వంశాన్ని విమోచించే చట్టబద్ధ బాధ్యతగల దగ్గరి బంధువును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ లావాదేవీలో చెప్పును తీసివేయడం ఆ కాలపు ఆచారబద్ధమైన చట్టసూచక చర్య. రూతు 4:7 చూడండి.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... చెప్పి
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ క్రమానుసరణను సహజంగా తెలియజేస్తుంది.
- source_word: הַגֹּאֵל
  choice: ఆ విమోచకుడు
  rationale: రూతు గ్రంథంలో ఈ పదం కుటుంబ ఆస్తి లేదా వంశ పరిరక్షణకు సంబంధించిన చట్టబద్ధ బాధ్యతగల సమీప బంధువును సూచిస్తుంది. ‘విమోచకుడు’ మూలపదంలోని ప్రధాన భావాన్ని సంక్షిప్తంగా ఉంచుతుంది; ప్రత్యేక అర్థాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: לְבֹעַז
  choice: బోయజుతో
  rationale: తెలుగులో ‘చెప్పు’ అనే క్రియతో సంభాషణ గ్రహీతను సహజంగా ‘-తో’ విభక్తితో సూచించవచ్చు; బోయజు అనే పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: קְנֵה
  choice: కొనుక్కో
  rationale: קנה యొక్క ఆజ్ఞార్థకం ఈ ఆస్తి లావాదేవీలో ‘కొను’ అని అర్థం. తరువాతి לָךְతో కలిపి, బోయజే తన కోసం కొనాలని సూచించే సహజ తెలుగు రూపం ‘కొనుక్కో’.
- source_word: לָךְ
  choice: నువ్వే ... -క్కో
  rationale: ఈ సందర్భంలో ‘నీ కోసం/నీ కొరకు’ అనే స్వప్రయోజన భావాన్ని తెలుగు ప్రత్యయాత్మక క్రియారూపం ‘కొనుక్కో’ వ్యక్తం చేస్తుంది; ‘నువ్వే’ బాధ్యతను బోయజుకు వదలివేయడాన్ని స్పష్టం చేస్తుంది.
- source_word: וַיִּשְׁלֹף
  choice: విప్పాడు
  rationale: ఈ క్రియకు బయటకు తీయడం లేదా తొలగించడం అనే భావం ఉంది. పాదరక్ష సందర్భంలో ‘చెప్పును విప్పాడు’ సహజమైన, స్పష్టమైన తెలుగు.
- source_word: נַעֲלוֹ
  choice: తన చెప్పును
  rationale: נַעַל ప్రాచీన పాదరక్షను సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘చెప్పు’ సాధారణంగా అర్థమయ్యే పదం; ‘తన’ కర్తనే యజమానిగా స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని సంక్షిప్త చట్టపరమైన సంభాషణను అలాగే ఉంచి, ‘విమోచకుడు’ అనే సాంస్కృతిక-చట్టపరమైన పదాన్ని పాదటిప్పణిలో వివరించాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
