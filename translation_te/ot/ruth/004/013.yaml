id: RUT.4.13
reference: Ruth 4:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח בֹּ֤עַז אֶת רוּת֙ וַ/תְּהִי ל֣/וֹ לְ/אִשָּׁ֔ה וַ/יָּבֹ֖א אֵלֶ֑י/הָ וַ/יִּתֵּ֨ן יְהוָ֥ה לָ֛/הּ הֵרָי֖וֹן וַ/תֵּ֥לֶד בֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/013.yaml
  text: So Boaz took Ruth[a], and she became his wife. He went in to her, and Yahweh granted her conception, and she bore a son.
translation:
  language: te
  text: బోయజు రూతును తీసుకున్నాడు; ఆమె అతని భార్య అయింది. అతడు ఆమెతో దాంపత్య సంబంధం కలిగించాడు. యాహ్వే ఆమెకు గర్భధారణను అనుగ్రహించాడు[a]; ఆమె ఒక కుమారుణ్ణి కనింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యాహ్వే ఆమెకు గర్భధారణను ఇచ్చాడు”; లేదా, “యాహ్వే ఆమె గర్భం ధరించేలా చేశాడు.”
    reason: హెబ్రీయ పదబంధం యాహ్వే ఆమెకు గర్భధారణను ఇచ్చాడని నేరుగా చెబుతుంది; ప్రత్యామ్నాయాలు దాని అక్షరార్థాన్ని మరియు సహజ తెలుగు వ్యక్తీకరణను చూపుతాయి.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకున్నాడు
  rationale: לקח అనే క్రియకు ప్రాథమిక అర్థం ‘తీసుకున్నాడు.’ వెంటనే వచ్చే వాక్యం వివాహ సంబంధాన్ని స్పష్టం చేస్తున్నందున, దానిని ముందుగానే ‘పెళ్లి చేసుకున్నాడు’ అని విపులీకరించకుండా మూలంలోని క్రమాన్ని నిలిపింది.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: ఆమె అతనికి భార్య అయింది
  rationale: ఈ హెబ్రీయ ఇడియమ్ అధికారిక వివాహ సంబంధాన్ని సూచిస్తుంది. తెలుగు కథన శైలిలో సహజంగా ఉండేలా, వరుసగా జరిగిన విషయాన్ని కూడా నిలిపే విధంగా అనువదించబడింది.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: అతడు ఆమె దగ్గరకు వెళ్లాడు
  rationale: ఇది లైంగిక కలయికను సూచించే హెబ్రీయ మర్యాదోక్తి. మూలంలోని నిగూఢమైన, గౌరవప్రదమైన శైలిని నిలిపేందుకు తెలుగులో సమానమైన మర్యాదోక్తిని ఉపయోగించింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించింది.
- source_word: וַיִּתֵּן יְהוָה לָהּ הֵרָיוֹן
  choice: యాహ్వే ఆమె గర్భం ధరించేలా చేశాడు
  rationale: హֵרָיוֹן గర్భధారణను సూచిస్తుంది; נתן దేవుని ప్రత్యక్ష అనుగ్రహాన్ని తెలియజేస్తుంది. తెలుగు పాఠకులకు సహజంగా ఉండేలా దైవ కార్యసాధకత్వాన్ని స్పష్టంగా నిలిపింది.
- source_word: וַתֵּלֶד בֵּן
  choice: ఆమె ఒక కుమారుణ్ణి కనింది
  rationale: ילד + בן అనే సంక్షిప్త హెబ్రీయ వ్యక్తీకరణకు సహజమైన, గౌరవప్రదమైన తెలుగు కథన రూపం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగు లిపిలో ‘యాహ్వే’గా ఇచ్చింది.
- issue: రూతు గర్భధారణలో దైవ కార్యసాధకత్వం
  choice: యాహ్వే ఆమె గర్భం ధరించేలా చేశాడు
  alternative: యాహ్వే ఆమెకు గర్భధారణను ఇచ్చాడు / యాహ్వే ఆమె గర్భం ధరించడానికి అనుగ్రహించాడు
  rationale: హెబ్రీయ పాఠం గర్భధారణను యాహ్వే ఇచ్చినదిగా ప్రత్యక్షంగా పేర్కొంటుంది. అనువాదం ఈ దైవ కార్యసాధకత్వాన్ని నిలుపుతూ, దాని మీద అదనపు సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. లైంగిక కలయిక విషయంలో మూలపాఠంలోని మర్యాదోక్తిని నిలిపింది. గమనిక [a] అది వివరించే గర్భధారణ పదబంధం దగ్గరే ఉంచబడింది.
