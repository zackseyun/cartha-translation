id: RUT.4.4
reference: Ruth 4:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲנִ֨י אָמַ֜רְתִּי אֶגְלֶ֧ה אָזְנְ/ךָ֣ לֵ/אמֹ֗ר קְ֠נֵה נֶ֥גֶד הַֽ/יֹּשְׁבִים֮ וְ/נֶ֣גֶד זִקְנֵ֣י עַמִּ/י֒ אִם תִּגְאַל֙ גְּאָ֔ל וְ/אִם לֹ֨א יִגְאַ֜ל הַגִּ֣ידָ/ה לִּ֗/י ו/אדע כִּ֣י אֵ֤ין זוּלָֽתְ/ךָ֙ לִ/גְא֔וֹל וְ/אָנֹכִ֖י אַחֲרֶ֑י/ךָ וַ/יֹּ֖אמֶר אָנֹכִ֥י אֶגְאָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/004.yaml
  text: So I thought I should inform you[a], saying, ‘Buy it in the presence of those sitting here and in the presence of the elders of my people. If you will redeem it, redeem it; but if he will not redeem it, tell me, so that I may know, for there is no one besides you to redeem it, and I am after you.’ And he said[b], ‘I will redeem it.’
translation:
  language: te
  text: 'నేను నీకు ఈ విషయం తెలియజేయాలని అనుకున్నాను[a]: ‘ఇక్కడ కూర్చున్నవారి సమక్షంలోను నా ప్రజల పెద్దల సమక్షంలోను దాన్ని కొనుగోలు చేయి. నీవు దాన్ని విమోచిస్తే, విమోచించు; అయితే అతడు దాన్ని విమోచించకపోతే[b], నేను తెలుసుకోవడానికి నాకు చెప్పు. ఎందుకంటే దాన్ని విమోచించడానికి నీవు తప్ప మరెవరూ లేరు; నీ తరువాత నేనే ఉన్నాను.’ అందుకు అతడు, ‘నేను దాన్ని విమోచిస్తాను’ అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘నీ చెవిని తెరవడం’; ఇది ‘నీకు తెలియజేయడం’ లేదా ‘నీకు తెలియనివ్వడం’ అనే అర్థమిచ్చే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠంలో ‘అతడు విమోచించకపోతే’ అని ఉంది. సందర్భాన్ని బట్టి కొందరు దీనిని ‘నీవు విమోచించకపోతే’ అని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶגְלֶה אָזְנְךָ
  choice: నీకు ఈ విషయం తెలియజేయాలని
  rationale: హీబ్రూ నుడికారం అక్షరార్థంగా ‘నీ చెవిని తెరవడం’; ఆధునిక తెలుగులో దాని సహజ భావం ‘తెలియజేయడం’.
- source_word: קְנֵה
  choice: దాన్ని కొనుగోలు చేయి
  rationale: కנה అంటే సంపాదించు/కొను; భూమి సంబంధమైన ఈ బహిరంగ న్యాయ సందర్భంలో ‘కొనుగోలు చేయి’ సహజంగా ఉండి లావాదేవీని స్పష్టపరుస్తుంది.
- source_word: נֶגֶד הַיֹּשְׁבִים
  choice: ఇక్కడ కూర్చున్నవారి సమక్షంలో
  rationale: נגד బహిరంగ సాక్షుల సమక్షాన్ని సూచిస్తుంది; ‘ఇక్కడ’ అనేది పట్టణ ద్వారం వద్ద ఉన్న తక్షణ సందర్భాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: זִקְנֵי עַמִּי
  choice: నా ప్రజల పెద్దలు
  rationale: קהమ్యూనిటీకి గుర్తింపు పొందిన నాయకులను సూచించే పదబంధానికి సూటి, సహజ తెలుగు.
- source_word: תִּגְאַל ... גְּאָל
  choice: నీవు దాన్ని విమోచిస్తే, విమోచించు
  rationale: גאל పదపునరుక్తిని నిలిపి, కుటుంబ ఆస్తిని తిరిగి స్వాధీనం చేసుకునే న్యాయబద్ధమైన హక్కు/బాధ్యతను ‘విమోచించు’ ద్వారా కాపాడుతుంది.
- source_word: וְאִם לֹא יִגְאַל
  choice: అయితే అతడు దాన్ని విమోచించకపోతే
  rationale: మసొరా పాఠంలోని మూడవ పురుష ఏకవచన రూపాన్ని, ముందు ఉన్న రెండవ పురుష సంబోధనతో కలిగే ఆకస్మిక మార్పుతో సహా, ప్రధాన పాఠంలో నిలిపింది.
- source_word: הַגִּידָה לִּי
  choice: నాకు చెప్పు
  rationale: సూటియైన ఆజ్ఞారూపానికి సహజమైన ఆధునిక తెలుగు.
- source_word: אֵין זוּלָתְךָ
  choice: నీవు తప్ప మరెవరూ లేరు
  rationale: మినహాయింపు మరియు ప్రత్యేకతను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְאָנֹכִי אַחֲרֶיךָ
  choice: నీ తరువాత నేనే ఉన్నాను
  rationale: విమోచన హక్కు లేదా బాధ్యత వరుసలో బోయజు తరువాతివాడని సహజంగా తెలియజేస్తుంది.
- source_word: אָנֹכִי אֶגְאָל
  choice: నేను దాన్ని విమోచిస్తాను
  rationale: విమోచన హక్కు/బాధ్యతను స్వీకరించే సమాధానం; సందర్భం వల్ల అర్థమయ్యే కర్మను తెలుగులో స్పష్టంగా చేర్చింది.
theological_decisions:
- issue: కుటుంబ-న్యాయ సందర్భంలో גאל అనువాదం
  choice: విమోచించు
  alternative: విడిపించు; కుటుంబ విమోచకునిగా వ్యవహరించు; తిరిగి కొనుగోలు చేయి
  rationale: ఈ వాక్యంలో కుటుంబ ఆస్తిపై ఉన్న తిరిగి స్వాధీనపరచుకునే హక్కు, బాధ్యత రెండూ అంతర్లీనంగా ఉన్నాయి. ‘విమోచించు’ కీలక పదానికి ఉన్న న్యాయ మరియు ఒడంబడిక సంబంధిత ప్రతిధ్వనిని నిలుపుతుంది; ‘కుటుంబ విమోచకుడు’ అనే వివరణాత్మక వ్యాఖ్యానాన్ని క్రియలోకి దిగుమతి చేయదు.
- issue: రెండవ పురుషం నుండి మూడవ పురుషానికి మార్పు
  choice: ‘అతడు ... విమోచించకపోతే’ అని మసొరా పాఠాన్ని నిలపడం
  alternative: ‘నీవు ... విమోచించకపోతే’ అని సందర్భానుసారంగా సవరించడం
  rationale: WLC పాఠం יִגְאַל అనే మూడవ పురుష ఏకవచనాన్ని ఇస్తుంది. సందర్భంలో రెండవ పురుష భావం సాధ్యమైనప్పటికీ, అసలు పాఠంలోని అస్పష్టతను ప్రధాన పాఠంలో నిలిపి, సులభీకరించిన ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రజలకు అర్థమయ్యేలా సహజమైనప్పటికీ న్యాయపరమైన సందర్భానికి తగిన గంభీరతను నిలిపింది. ‘విమోచించు’ అనే కీలక పదాన్ని పునరావృతం చేసి హీబ్రూ పదబంధ బలాన్ని కాపాడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
