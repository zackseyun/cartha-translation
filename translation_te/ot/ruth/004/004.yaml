revisions:
- from: 'అప్పుడు నేను నీకు ఈ విషయం తెలియజేయాలని అనుకున్నాను[a]: ‘ఇక్కడ కూర్చున్నవారి సమక్షంలోను, నా ప్రజల పెద్దల సమక్షంలోను దాన్ని కొనుగోలు చేయి. నీవు దాన్ని విమోచిస్తే, విమోచించు; అయితే అతడు దాన్ని విమోచించకపోతే, నాకు చెప్పు. ఎందుకంటే దాన్ని విమోచించడానికి నీవు తప్ప మరెవరూ లేరని, నీ తరువాత నేనే ఉన్నానని నేను తెలుసుకోవాలి.’ అందుకు అతడు, ‘నేను దాన్ని విమోచిస్తాను’ అన్నాడు.[b]'
  to: 'నేను నీకు ఈ విషయం తెలియజేయాలని అనుకున్నాను[a]: ‘ఇక్కడ కూర్చున్నవారి సమక్షంలోను నా ప్రజల పెద్దల సమక్షంలోను దాన్ని కొనుగోలు చేయి. నీవు దాన్ని విమోచిస్తే, విమోచించు; అయితే అతడు దాన్ని విమోచించకపోతే[b], నేను తెలుసుకోవడానికి నాకు చెప్పు. ఎందుకంటే దాన్ని విమోచించడానికి నీవు తప్ప మరెవరూ లేరు; నీ తరువాత నేనే ఉన్నాను.’ అందుకు అతడు, ‘నేను దాన్ని విమోచిస్తాను’ అన్నాడు.'
  rationale: మూలపాఠానికి సంబంధించిన మూడవ పురుష అస్పష్టతను ప్రధాన పాఠంలోనే నిలిపి, దానికి వివరణనిచ్చే పాదసూచికను సరిగ్గా ఆ పదబంధానికే జతచేశాను. మూలంలో లేని కాలసూచకాన్ని తొలగించాను; అలాగే ‘చెప్పు—నేను తెలుసుకోవడానికి’ అనే హీబ్రూ వాక్యప్రవాహాన్ని సహజ తెలుగు నిర్మాణంలో వ్యక్తం చేశాను. పాదసూచిక aలో అక్షరార్థాన్ని మరింత ఖచ్చితంగా సూచించాను.
