revisions:
- from: అప్పుడు పొరుగింటి స్త్రీలు, “నయోమికి ఒక కుమారుడు పుట్టాడు” అంటూ అతనికి పేరు పెట్టి[a], అతనికి ఓబేదని పేరు పెట్టారు. అతడు యెష్షయికి తండ్రి; యెష్షయి దావీదుకు తండ్రి.
  to: 'అప్పుడు పొరుగున ఉన్న స్త్రీలు అతనికి పేరు పెడుతూ ఇలా అన్నారు: “నయోమికి ఒక కుమారుడు పుట్టాడు.”[a] వారు అతనికి ఓబేదు అని పేరు పెట్టారు. అతడు యెష్షయికి తండ్రి; యెష్షయి దావీదుకు తండ్రి.'
  rationale: The revision preserves the Hebrew’s two naming formulations without creating an unintended sequence of two separate namings. It retains the source’s deliberately familial wording “నయోమికి ఒక కుమారుడు,” while the footnote clarifies the literary-family perspective without substituting ‘grandson’ in the text. The revised anchor now marks the exact phrase the note explains.
  reviewer_model: gpt-5.6-terra
