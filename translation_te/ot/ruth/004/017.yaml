source:
  edition: WLC
  text: וַ/תִּקְרֶאנָה֩ ל֨/וֹ הַ/שְּׁכֵנ֥וֹת שֵׁם֙ לֵ/אמֹ֔ר יֻלַּד בֵּ֖ן לְ/נָעֳמִ֑י וַ/תִּקְרֶ֤אנָֽה שְׁמ/וֹ֙ עוֹבֵ֔ד ה֥וּא אֲבִי יִשַׁ֖י אֲבִ֥י דָוִֽד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/017.yaml
  text: Then the neighbor women gave him a name[a], saying, “A son has been born to Naomi.” And they named him Obed. He was the father of Jesse, the father of David.
translation:
  language: te
  text: 'అప్పుడు పొరుగున ఉన్న స్త్రీలు అతనికి పేరు పెడుతూ ఇలా అన్నారు: “నయోమికి ఒక కుమారుడు పుట్టాడు.”[a] వారు అతనికి ఓబేదు అని పేరు పెట్టారు. అతడు యెష్షయికి తండ్రి; యెష్షయి దావీదుకు తండ్రి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో, “నయోమికి ఒక కుమారుడు పుట్టాడు.” రూతు బిడ్డ ద్వారా నయోమి కుటుంబ వంశం పునరుద్ధరించబడిందనే దృష్టితో ఆ స్త్రీలు ఇలా అంటున్నారు; నయోమి ఆ బిడ్డకు జీవసంబంధ తల్లి అని ఇది చెప్పడం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁכֵנוֹת
  choice: పొరుగింటి స్త్రీలు
  rationale: స్త్రీలింగ బహువచన రూపం సమీపంలో నివసించే స్త్రీలను స్పష్టంగా సూచిస్తుంది; ఈ తెలుగు ప్రయోగం వారి లింగాన్నీ పొరుగుతనాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: וַתִּקְרֶאנָה לוֹ שֵׁם
  choice: అతనికి పేరు పెట్టి
  rationale: ‘అతనికోసం/అతనికి పేరు పిలిచారు’ అనే హీబ్రూ నుడికారంలోని పరోక్ష కర్మను నిలుపుతూ, ఆధునిక తెలుగులో సహజమైన నామకరణ ప్రయోగాన్ని వాడింది.
- source_word: לֵאמֹר
  choice: అంటూ
  rationale: తరువాతి ప్రకటనను పరిచయం చేసే ఉద్ధరణార్థక క్రియారూపాన్ని తెలుగు వాక్యప్రవాహంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יֻלַּד בֵּן לְנָעֳמִי
  choice: నయోమికి ఒక కుమారుడు పుట్టాడు
  rationale: కర్మణి క్రియతో కూడిన לְ రూపం నయోమిని లబ్ధిదారుగా/సంబంధిత వ్యక్తిగా చూపుతుంది. ఆమె జీవసంబంధ తల్లి అని వివరణాత్మకంగా మార్చకుండా మూలంలోని ఉద్దేశపూర్వక కుటుంబార్థ ఉద్వేగాన్ని నిలుపుతుంది.
- source_word: וַתִּקְרֶאנָה שְׁמוֹ עוֹבֵד
  choice: అతనికి ఓబేదని పేరు పెట్టారు
  rationale: ప్రామాణిక హీబ్రూ నామకరణ సూత్రాన్ని ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా అందిస్తుంది.
- source_word: עוֹבֵד
  choice: ఓబేద
  rationale: ఇది వ్యక్తిపేరు కాబట్టి అర్థానువాదం చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించబడింది.
- source_word: אֲבִי
  choice: తండ్రి
  rationale: ఈ తక్షణ వంశావళి క్రమంలో విస్తృతార్థమైన ‘పూర్వికుడు’ కంటే ప్రత్యక్షమైన ‘తండ్రి’ సరిపోతుంది.
- source_word: יִשַׁי
  choice: యెష్షయి
  rationale: హీబ్రూ వ్యక్తిపేరుకు సమీపమైన, తెలుగు బైబిలు పాఠకులకు గుర్తుపట్టదగిన లిప్యంతరీకరణ.
- source_word: דָוִד
  choice: దావీదు
  rationale: తెలుగులో స్థిరపడిన సంప్రదాయ వ్యక్తిపేరు రూపం.
theological_decisions:
- issue: “నయోమికి ఒక కుమారుడు పుట్టాడు” అనే ప్రకటనలో నవజాత శిశువుతో నయోమి సంబంధం
  choice: ప్రధాన పాఠ్యంలో ‘నయోమికి’ అనే మాటను ఉంచి, ఆమెనే జీవసంబంధ తల్లి అని స్పష్టీకరించలేదు.
  alternative: ‘నయోమికి ఒక మనవడు పుట్టాడు’ లేదా ‘నయోమికి ఒక కుమారుడు లభించాడు’
  rationale: రూతు బిడ్డ ద్వారా నయోమి కుటుంబ వంశం పునరుద్ధరించబడిందని పొరుగింటి స్త్రీలు చెప్పే సాహిత్యపరమైన దృష్టిని హీబ్రూ నిలుపుతుంది. ‘మనవడు’ అని మార్చడం మూలంలోని కుటుంబార్థ, ధార్మిక ఉద్వేగాన్ని అనవసరంగా పరిష్కరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ నామకరణ వాక్యంలోని పునరుక్తిని సాధ్యమైనంతవరకు నిలిపి, నయోమితో శిశువు సంబంధంలోని ఉద్దేశపూర్వక అస్పష్టతను పాదటిప్పణితో వివరించింది.
