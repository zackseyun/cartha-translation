  text: וַ/תֹּאמַ֤רְנָה הַ/נָּשִׁים֙ אֶֽל נָעֳמִ֔י בָּר֣וּךְ יְהוָ֔ה אֲ֠שֶׁר לֹ֣א הִשְׁבִּ֥ית לָ֛/ךְ גֹּאֵ֖ל הַ/יּ֑וֹם וְ/יִקָּרֵ֥א שְׁמ֖/וֹ בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/014.yaml
  text: Then the women said to Naomi[a], “Blessed be Yahweh, who has not left you without a redeemer today[c][b], and may his name be renowned in Israel.”
translation:
  language: te
  text: అప్పుడు ఆ స్త్రీలు నయోమితో, “నీకు ఈ రోజు విమోచకుడు[a][b] లేకుండా ఉండనీయని యెహోవా స్తుతింపబడుగాక! అతని పేరు ఇశ్రాయేలులో ప్రఖ్యాతి పొందుగాక[c]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విమోచకుడు’ అనే పదానికి ‘బంధు-విమోచకుడు’ లేదా ‘కుటుంబ సంరక్షకుడు’ అని కూడా అనువదించవచ్చు. ఇది కుటుంబ వంశాన్ని, ఆస్తి హక్కులను కాపాడి పునరుద్ధరించే సమీప బంధువు యొక్క కుటుంబ-చట్టపరమైన బాధ్యతను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘విమోచకుడు’ అనే మాట నయోమికి పునరుద్ధరణ కలిగించే నవజాత శిశువును ప్రత్యేకంగా సూచించవచ్చు. అయితే ఈ అధ్యాయంలో విమోచకునిగా బోయజు చేసిన కార్యాన్ని కూడా దృష్టిలో ఉంచుకొని కొందరు దీన్ని విస్తృతంగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: c
    text: హెబ్రీలో అక్షరార్థంగా, ‘అతని పేరు ఇశ్రాయేలులో పిలువబడుగాక.’ అంటే అతని పేరు ఇశ్రాయేలులో ప్రసిద్ధమై, గౌరవింపబడాలని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְנָה
  choice: అప్పుడు ... అన్నారు
  rationale: కథన క్రమంలో తదుపరి సంఘటనను పరిచయం చేసే wayyiqtol రూపాన్ని సహజమైన ఆధునిక తెలుగు కథన శైలిలో వ్యక్తపరుస్తుంది.
- source_word: הַנָּשִׁים
  choice: ఆ స్త్రీలు
  rationale: నిర్దిష్ట బహువచన నామవాచకం; సందర్భంలో ఉన్న సమాజపు స్త్రీలను సూచిస్తుంది.
- source_word: בָּרוּךְ יְהוָה
  choice: యెహోవా స్తుతింపబడుగాక
  rationale: హెబ్రీ ఆశీర్వాద సూత్రంలోని స్తుతి భావాన్ని గౌరవప్రదమైన, సహజమైన తెలుగు ప్రార్థనాత్మక రూపంలో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని ఒక బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: אֲשֶׁר לֹא הִשְׁבִּית לָךְ
  choice: నీకు ... లేకుండా చేయని
  rationale: శబ్దార్థమైన ‘నీ కొరకు నిలిపివేయని’ కంటే, సందర్భంలో విమోచకుడు లేకుండా విడిచిపెట్టలేదనే భావాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: גֹּאֵל
  choice: విమోచకుడు
  rationale: రూతు గ్రంథంలోని కుటుంబ-చట్టపరమైన కీలక పదానికి సంక్షిప్తమైన ప్రధాన పాఠ్య రూపం; సమీప బంధువు కుటుంబ హక్కులను కాపాడి పునరుద్ధరించే ప్రత్యేక భావాన్ని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: కాలసూచక పదానికి సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: וְיִקָּרֵא שְׁמוֹ
  choice: అతని పేరు ... ప్రఖ్యాతి పొందుగాక
  rationale: అక్షరార్థంగా ‘అతని పేరు పిలువబడుగాక’ అన్నదానికంటే, ఇక్కడ పేరు ఇశ్రాయేలులో తెలిసి గౌరవింపబడాలనే ఆశీర్వాద భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో
  rationale: ఆ పేరు తెలిసి గౌరవింపబడే పరిధిని సూచించే స్థానార్థక పదబంధం.
theological_decisions:
- issue: ‘విమోచకుడు’ (גֹּאֵל) ఎవరిని సూచిస్తున్నాడు?
  choice: ప్రధాన పాఠ్యంలో ‘విమోచకుడు’ అనే పదాన్ని ఉంచి, అది నవజాత శిశువునా లేక బోయజు ద్వారా కలిగిన విమోచన ఏర్పాటునా అని నిర్దిష్టంగా తేల్చలేదు.
  alternative: సమీప సూచనగా ఈ పదం ప్రత్యేకంగా నవజాత శిశువైన ఓబేదును సూచిస్తుంది; మరొక అవగాహనలో అధ్యాయమంతటిలో విమోచకునిగా వ్యవహరించిన బోయజు కూడా దృష్టిలో ఉన్నాడు.
  rationale: జనన ప్రకటన తరువాతి తక్షణ సందర్భం మరియు ‘అతని పేరు’ అనే తదుపరి మాటలు శిశువును సమీప సూచనగా బలపరుస్తాయి. అయినా, గ్రంథంలోని కుటుంబ-చట్టపరమైన విమోచన కథలో బోయజు పాత్ర కూడా నేపథ్యంగా ఉంది. అందువల్ల హెబ్రీ పాఠ్యంలోని నిజమైన అనిశ్చితిని అనువాదం పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన-ఆశీర్వాద శైలి వాడబడింది. ‘విమోచకుడు’ అనే కీలక పదం సంక్షిప్తంగా ప్రధాన పాఠ్యంలో ఉంచి, దాని కుటుంబ-చట్టపరమైన భావం మరియు సూచిత వ్యక్తి విషయంలోని అనిశ్చితి పాదటిప్పణుల్లో నిలుపబడ్డాయి. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
