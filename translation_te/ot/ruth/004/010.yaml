source:
  edition: WLC
  text: וְ/גַ֣ם אֶת ר֣וּת הַ/מֹּאֲבִיָּה֩ אֵ֨שֶׁת מַחְל֜וֹן קָנִ֧יתִי לִ֣/י לְ/אִשָּׁ֗ה לְ/הָקִ֤ים שֵׁם הַ/מֵּת֙ עַל נַ֣חֲלָת֔/וֹ וְ/לֹא יִכָּרֵ֧ת שֵׁם הַ/מֵּ֛ת מֵ/עִ֥ם אֶחָ֖י/ו וּ/מִ/שַּׁ֣עַר מְקוֹמ֑/וֹ עֵדִ֥ים אַתֶּ֖ם הַ/יּֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/010.yaml
  text: And also Ruth the Moabite[a], the wife of Mahlon, I have acquired for myself as a wife, to raise up the name of the dead over his inheritance, so that the name of the dead may not be cut off from among his brothers and from the gate of his place[c][b]. You are witnesses today.
translation:
  language: te
  text: అంతేకాక, మోయాబీయురాలైన రూతును—మహ్లోను భార్యను—నా భార్యగా నేను సంపాదించుకున్నాను[a], మృతుని పేరు అతని స్వాస్థ్యంపై[b] నిలబెట్టడానికి, మృతుని పేరు అతని సహోదరుల మధ్యనుండి, అతని ఊరి ద్వారం నుండి[c] తెగిపోకుండా ఉండడానికి. ఈ రోజు మీరు సాక్షులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను కొనుక్కున్నాను.” హీబ్రూ క్రియ న్యాయపరమైన లావాదేవీలో కొనుగోలు చేసి సొంతం చేసుకోవడం అనే భావాన్ని కూడా కలిగి ఉంటుంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, మృతుని కుటుంబ వంశమూ అతని వారసత్వ ఆస్తితో సంబంధమైన న్యాయపరమైన స్థానమూ కొనసాగేటట్లు చేయడం.
    reason: cultural_note
  - marker: c
    text: ఊరి ద్వారం ప్రజలు కూడి న్యాయ విషయాలను సాక్షుల సమక్షంలో నిర్ణయించే స్థలం.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם
  choice: అంతేకాక
  rationale: ముందటి న్యాయపరమైన ప్రకటనకు దీనిని జోడిస్తూ ఉన్న బలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: רוּת הַמֹּאֲבִיָּה
  choice: మోయాబీయురాలైన రూతు
  rationale: స్త్రీలింగ జాతివాచకాన్ని స్పష్టంగా ఉంచుతూ పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరిస్తుంది.
- source_word: אֵשֶׁת מַחְלוֹן
  choice: మహ్లోను భార్యను
  rationale: మూలంలోని ‘మహ్లోను భార్య’ అనే నిర్మాణాన్ని నిలుపుతుంది; సందర్భానుసారంగా ఆమె విధవరాలైనా, మూలపాఠం ఇక్కడ ‘విధవరాలు’ అనే పదాన్ని వాడదు.
- source_word: קָנִיתִי לִי
  choice: నేను సంపాదించుకున్నాను
  rationale: קנה లోని సంపాదించడం/కొనడం అనే న్యాయ-లావాదేవీ భావాన్ని నిలుపుతూ, రూతును కేవలం వస్తువుగా చూపే అపార్థాన్ని తగ్గిస్తుంది; ‘కొనుక్కున్నాను’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: לְאִשָּׁה
  choice: నా భార్యగా చేసుకోవడానికి
  rationale: వివాహ ఉద్దేశాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְהָקִים שֵׁם הַמֵּת
  choice: చనిపోయినవాని పేరు ... నిలబెట్టడానికి
  rationale: ‘పేరును లేపడం/నిలబెట్టడం’ అనే హీబ్రూ రూపకాన్ని తెలుగులో అర్థవంతంగా ఉంచి, వంశపరమైన మరియు న్యాయపరమైన కొనసాగింపును సూచిస్తుంది.
- source_word: עַל נַחֲלָתוֹ
  choice: అతని స్వాస్థ్యంపై
  rationale: మృతుని పేరును అతని వారసత్వ భూమి లేదా ఆస్తితో అనుసంధానించే న్యాయపరమైన భావాన్ని కాపాడుతుంది.
- source_word: וְלֹא יִכָּרֵת
  choice: తెగిపోకుండా ఉండడానికి
  rationale: כרת నిఫాల్ రూపంలోని ‘తెగిపోవడం’ అనే గంభీరమైన బైబిలీయ నుడికారాన్ని నిలుపుతుంది.
- source_word: מֵעִם אֶחָיו
  choice: అతని సహోదరుల మధ్యనుండి
  rationale: సందర్భంలో విస్తృత బంధువర్గం సూచితమయ్యే అవకాశమున్నా, మూలంలోని ‘అతని సహోదరులు’ అనే పదాన్ని నేరుగా నిలుపుతుంది.
- source_word: וּמִשַּׁעַר מְקוֹמוֹ
  choice: అతని ఊరి ద్వారం నుండి
  rationale: ‘అతని స్థలపు ద్వారం’ అనే పదబంధాన్ని సహజ తెలుగులో అందిస్తూ, ప్రజా న్యాయ గుర్తింపు జరిగే పట్టణ ద్వారాన్ని సూచిస్తుంది.
- source_word: עֵדִים אַתֶּם הַיּוֹם
  choice: ఈ రోజు మీరు సాక్షులు
  rationale: సమకూరిన ప్రజలకు చేసిన అధికారిక న్యాయ ప్రకటనను స్పష్టంగా, గౌరవప్రదంగా అందిస్తుంది.
theological_decisions:
- issue: రూతు విషయంలో బోయజు చేసిన చర్య యొక్క న్యాయ-విమోచన స్వభావం
  choice: ‘నా భార్యగా చేసుకోవడానికి నేను సంపాదించుకున్నాను’ అని అనువదించి, వివాహ ఉద్దేశాన్నీ స్వాస్థ్య పునరుద్ధరణనూ స్పష్టంగా ఉంచడం
  alternative: ‘రూతును నా భార్యగా కొనుక్కున్నాను’ లేదా ‘రూతును నా భార్యగా తీసుకున్నాను’
  rationale: קנה అనే క్రియలో లావాదేవీ భావం ఉంది; అయితే అది ఇక్కడ విమోచన, స్వాస్థ్యం, మృతుని పేరు నిలబెట్టడం అనే సమగ్ర న్యాయ సందర్భంలో ఉంది. ఎంపిక చేసిన రూపం ఆ న్యాయ బలాన్ని నిలుపుతూ అతిగా వస్తుకరణ చేయదు.
- issue: אֶחָיו యొక్క పరిధి
  choice: అతని సహోదరులు
  alternative: అతని బంధువులు / అతని వంశస్థులు
  rationale: వంశ-గోత్ర సందర్భంలో పదానికి విస్తృత పరిధి ఉండవచ్చును; అయినా మూలపాఠం ప్రత్యక్షంగా ‘సహోదరులు’ అంటున్నందున ఆ అనిశ్చితిని విస్తరించి పరిష్కరించకుండా మూలరూపాన్ని నిలిపాం.
- issue: మృతుని పేరును స్వాస్థ్యంపై నిలబెట్టడం
  choice: రూపకాన్ని ‘పేరు ... నిలబెట్టడానికి’ అని నిలుపడం
  alternative: ‘మృతుని వంశాన్ని కొనసాగించడానికి’ అని వివరణాత్మకంగా మార్చడం
  rationale: వంశ కొనసాగింపు భావంలో భాగమైనప్పటికీ, మూలంలోని పేరు, స్వాస్థ్యం, ప్రజా న్యాయస్థానం మధ్యనున్న ఉద్దేశపూర్వక ఉద్రిక్తతను ఒకే సిద్ధాంతాత్మక వివరణగా కుదించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన న్యాయ-ప్రకటన శైలి. ‘స్వాస్థ్యం,’ ‘సహోదరులు,’ ‘సాక్షులు’ వంటి బైబిలీయంగా పరిచితమైన పదాలను ఉంచి, వాక్య నిర్మాణాన్ని సాధారణ పాఠకుడికి సహజంగా తీర్చిదిద్దాం. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో క్రమంగా చేర్చబడ్డాయి.
