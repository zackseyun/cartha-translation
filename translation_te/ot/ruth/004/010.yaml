revisions:
- from: అంతేకాక, మోయాబీయురాలైన రూతును—మహ్లోను భార్యను—నా భార్యగా చేసుకోవడానికి నేను సంపాదించుకున్నాను[a]. చనిపోయినవాని పేరు అతని స్వాస్థ్యంపై నిలబెట్టడానికి, అతని పేరు అతని సహోదరుల మధ్యనుండి, అతని ఊరి ద్వారం నుండి తెగిపోకుండా ఉండడానికి ఇలా చేశాను[b][c]. ఈ రోజు మీరు సాక్షులు.
  to: అంతేకాక, మోయాబీయురాలైన రూతును—మహ్లోను భార్యను—నా భార్యగా నేను సంపాదించుకున్నాను[a], మృతుని పేరు అతని స్వాస్థ్యంపై[b] నిలబెట్టడానికి, మృతుని పేరు అతని సహోదరుల మధ్యనుండి, అతని ఊరి ద్వారం నుండి[c] తెగిపోకుండా ఉండడానికి. ఈ రోజు మీరు సాక్షులు.
  rationale: The revision removes an unsupported explanatory clause, more directly expresses the Hebrew legal-marital construction, and relocates footnote markers to the relevant terms. It also corrects footnote b’s inaccurate reference to a court while retaining the intended cultural explanation.
