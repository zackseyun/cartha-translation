  yaml_path: translation/ot/ruth/004/022.yaml
  text: And Obed fathered Jesse[a], and Jesse fathered David.
translation:
  language: te
  text: ఓబేదు యెష్షయికి తండ్రి అయ్యాడు[a]; యెష్షయి దావీదుకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కన్నాడు’; హీబ్రూ వంశావళి భాషలో ఈ క్రియకు ‘తండ్రి అయ్యాడు’ లేదా ‘కన్నాడు’ అనే అర్థం ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: '[సందర్భానుసారంగా ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది వంశావళిలో ముందున్న వాక్యాన్ని కొనసాగించే సంధాయకం. తెలుగులో ప్రతి భాగం ముందు ‘మరియు’ పెట్టకుండా, అర్ధవిరామంతో సహజంగా అనుసంధానించడం స్పష్టంగా ఉంటుంది.
- source_word: עֹבֵד
  choice: ఓబేదు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపంలో లిప్యంతరీకరించాం.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: ילד ధాతువు హిఫిల్ రూపం వంశావళిలో ‘కన్నాడు/తండ్రి అయ్యాడు’ అనే అర్థాన్ని ఇస్తుంది. ‘తండ్రి అయ్యాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, పురుష వంశావళి భావాన్ని నిలుపుతుంది.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది ప్రత్యక్ష కర్మ సూచకం; తెలుగులో దీనికి స్వతంత్ర పదసమానం అవసరం లేదు.
- source_word: יִשַׁי / יִשָׁי
  choice: యెష్షయి
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన బైబిలు రూపాన్ని ఉపయోగించాం.
- source_word: דָּוִד
  choice: దావీదు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో విస్తృతంగా గుర్తింపున్న సాంప్రదాయ బైబిలు రూపాన్ని ఉపయోగించాం.
theological_decisions:
- issue: వంశావళి క్రియ అనువాదం
  choice: తండ్రి అయ్యాడు
  alternative: కన్నాడు; జన్మనిచ్చాడు
  rationale: వచనం దావీదుతో ముగిసే సరళమైన వంశావళిని తెలియజేస్తుంది. ఈ ఎంపిక హీబ్రూ క్రియలోని పితృవంశ సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; వచనంలో లేని అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వంశావళి శైలి. పేర్లకు తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపాలు వాడబడ్డాయి; హీబ్రూ సంధాయకాన్ని యాంత్రికంగా పునరావృతం చేయకుండా తెలుగు వాక్యప్రవాహానికి అనుగుణంగా అర్ధవిరామం ఉపయోగించబడింది.
