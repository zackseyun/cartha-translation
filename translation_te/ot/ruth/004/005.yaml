id: RUT.4.5
reference: Ruth 4:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר בֹּ֔עַז בְּ/יוֹם קְנוֹתְ/ךָ֥ הַ/שָּׂדֶ֖ה מִ/יַּ֣ד נָעֳמִ֑י וּ֠/מֵ/אֵת ר֣וּת הַ/מּוֹאֲבִיָּ֤ה אֵֽשֶׁת הַ/מֵּת֙ קניתי לְ/הָקִ֥ים שֵׁם הַ/מֵּ֖ת עַל נַחֲלָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/005.yaml
  text: Then Boaz said[a], “On the day you acquire the field from the hand of Naomi, you also acquire Ruth the Moabite, the wife of the dead man[c][b], in order to raise up the name of the dead on his inheritance.”
translation:
  language: te
  text: 'అప్పుడు బోయజు ఇలా అన్నాడు[a]: “నయోమి చేతినుండి ఆ పొలాన్ని నీవు స్వాధీనం చేసుకునే రోజున, చనిపోయినవాని భార్య అయిన మోయాబీయురాలు రూతును కూడా నీవు స్వీకరించాలి; చనిపోయినవాని పేరును అతని వారసత్వ ఆస్తిపై నిలబెట్టడానికి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీయ పాఠంలో అక్షరార్థంగా, “మోయాబీయురాలు రూతును నేను సంపాదించుకున్నాను” లేదా “నేను స్వీకరించాను” అని ఉంది. అయితే ఈ సందర్భంలో చాలామంది దీనిని, “రూతును కూడా నీవు స్వీకరించాలి” అనే భావంలో అర్థం చేసుకుంటారు.
    reason: textual_variant
lexical_decisions:
- source_word: בְּיוֹם קְנוֹתְךָ
  choice: సంపాదించుకునే రోజున
  rationale: కాలసూచకమైన ‘ఆ రోజున’ అనే హెబ్రీయ వ్యక్తీకరణను, ఆస్తి బదిలీకి సంబంధించిన న్యాయపరమైన సందర్భాన్ని నిలుపుతూ సహజమైన తెలుగులో ఇచ్చింది.
- source_word: הַשָּׂדֶה
  choice: ఆ పొలాన్ని
  rationale: సందర్భంలో చర్చలో ఉన్న నిర్దిష్ట భూభాగాన్ని సూచిస్తుంది; ‘భూమి’ కంటే ‘పొలం’ మూలపదానికి మరింత నేరుగా సరిపోతుంది.
- source_word: מִיַּד נָעֳמִי
  choice: నయోమి చేతినుండి
  rationale: అధీనంలోనుండి లేదా స్వాధీనంనుండి బదిలీ అవుతున్న భావాన్ని తెలిపే హెబ్రీయ న్యాయపరమైన నుడికారాన్ని తెలుగులో అర్థమయ్యేంత దగ్గరగా నిలిపింది.
- source_word: רוּת הַמּוֹאֲבִיָּה
  choice: మోయాబీయురాలు రూతు
  rationale: రూతు జాతి గుర్తింపును మూలపాఠం ప్రకారమే సంక్షిప్తంగా, సహజంగా తెలిపింది.
- source_word: קניתי
  choice: రూతును కూడా నీవు స్వీకరించాలి
  rationale: మసొరా పాఠంలోని రూపం అక్షరార్థంగా ‘నేను సంపాదించుకున్నాను’ అని ఉన్నా, కథా సందర్భంలో పొలాన్ని విమోచించే సమీప బంధువుపై వచ్చే బాధ్యతనే బోయజు వివరిస్తున్నాడు. అందువల్ల సందర్భానుసార భావాన్ని ప్రధాన పాఠంలో ఇచ్చి, మూలపాఠ రూపాన్ని [a] పాదటిప్పణిలో నిలిపింది. రూతును వస్తువుగా కొనుగోలు చేసినట్టు అనిపించకుండా ‘స్వీకరించాలి’ అని అనువదించింది.
- source_word: אֵשֶׁת הַמֵּת
  choice: చనిపోయినవాని భార్య
  rationale: ‘మృతుని భార్య’ అనే మూలార్థాన్ని నేరుగా నిలుపుతుంది; ‘విధవరాలు’ అని అనువదించడం కంటే తక్కువ వ్యాఖ్యాత్మకం.
- source_word: לְהָקִים שֵׁם
  choice: పేరును ... నిలబెట్టడానికి
  rationale: చనిపోయినవాని వంశపరమైన పేరు, హక్కు కొనసాగించడాన్ని సూచించే హెబ్రీయ రూపకాన్ని సహజమైన తెలుగులో నిలిపింది.
- source_word: עַל נַחֲלָתוֹ
  choice: అతని వారసత్వ ఆస్తిపై
  rationale: మృతుని పేరు అతని వంశపారంపర్య ఆస్తితో అనుసంధానమై ఉండే న్యాయపరమైన భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: రూతుకు సంబంధించిన వాక్యభాగంలో קניתי అనే మొదటి పురుష ఏకవచన రూపం కలిగించే పాఠ్య, వాక్యనిర్మాణ క్లిష్టత
  choice: పొలాన్ని సంపాదించుకునే వ్యక్తి రూతును కూడా స్వీకరించవలసి ఉంటుందని సందర్భానుసారంగా అనువదించడం
  alternative: మసొరా స్వరచిహ్నాల ప్రకారం ‘నేను మోయాబీయురాలు రూతును సంపాదించుకున్నాను’ లేదా ‘నేను స్వీకరించాను’ అని అనువదించడం
  rationale: తరువాతి కథనం ప్రకారం బోయజు సమీప విమోచకునికి విమోచనతో కూడిన బాధ్యతను తెలియజేస్తున్నాడు. అయితే హెబ్రీయ పాఠంలోని నిజమైన క్లిష్టతను తొలగించకుండా [a] పాదటిప్పణిలో అక్షరార్థ పఠనాన్ని నమోదు చేసింది.
- issue: ‘చనిపోయినవాని పేరును నిలబెట్టడం’ అనే కుటుంబ-న్యాయపరమైన భావం
  choice: మూలంలోని రూపకాన్ని ప్రధాన పాఠంలో నిలిపి, దాని సాంస్కృతిక భావాన్ని పాదటిప్పణిలో వివరించడం
  alternative: ప్రధాన పాఠంలోనే ‘అతని వంశాన్ని కొనసాగించడానికి’ అని పూర్తిగా వివరణాత్మకంగా అనువదించడం
  rationale: మూలపాఠంలోని ‘పేరు’ మరియు ‘వారసత్వ ఆస్తి’ మధ్య ఉన్న ఉద్దేశపూర్వక సంబంధాన్ని కాపాడుతూ, పాఠకునికి అవసరమైన నేపథ్యాన్ని విడిగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని అనుసరించింది. ఆస్తి విమోచన సందర్భంలోని న్యాయపరమైన గంభీరత కోసం ‘చేతినుండి,’ ‘వారసత్వ ఆస్తి,’ ‘పేరును నిలబెట్టడం’ వంటి పదబంధాలను ఉంచింది; రూతును వస్తువుగా చూపే ప్రమాదాన్ని తగ్గించడానికి ‘సంపాదించు’ బదులు ఆమె విషయంలో ‘స్వీకరించాలి’ అని వాడింది.
