id: RUT.4.12
reference: Ruth 4:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וִ/יהִ֤י בֵֽיתְ/ךָ֙ כְּ/בֵ֣ית פֶּ֔רֶץ אֲשֶׁר יָלְדָ֥ה תָמָ֖ר לִֽ/יהוּדָ֑ה מִן הַ/זֶּ֗רַע אֲשֶׁ֨ר יִתֵּ֤ן יְהוָה֙ לְ/ךָ֔ מִן הַֽ/נַּעֲרָ֖ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/012.yaml
  text: And may your house be like the house of Perez[a], whom Tamar bore to Judah[b], from the offspring that Yahweh will give you by this young woman.
translation:
  language: te
  text: ఈ యువతి ద్వారా యహ్వే నీకు ఇచ్చే సంతానంతో[b], తామారు యూదాకు కనిన పెరెసు వంశంలా నీ వంశం[a] ఉండుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వంశం’కు మూల హెబ్రీలో ‘ఇల్లు’ అని ఉంది; ఇక్కడ అది కుటుంబాన్ని, సంతతి పరంపరను సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: ‘సంతానం’కు మూల హెబ్రీలో అక్షరార్థంగా ‘విత్తనం’ అని ఉంది; అది సంతతిని సూచించే సాధారణ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי
  choice: ఉండుగాక
  rationale: ఇక్కడి క్రియ ఆశీర్వాదం లేదా ఆకాంక్షను వ్యక్తపరుస్తుంది. తెలుగు ఆశీర్వచన శైలిలో ‘ఉండుగాక’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: בֵיתְךָ / כְבֵית פֶּרֶץ
  choice: నీ వంశం / పెరెసు వంశంలా
  rationale: בַּיִת ఇక్కడ భౌతిక గృహాన్ని కాక కుటుంబం, సంతతి, వంశపరంపరను సూచిస్తుంది. ‘వంశం’ సందర్భార్థాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది; హెబ్రీ ‘ఇల్లు’ అనే రూపకాన్ని పాదటిప్పణిలో సూచించాం.
- source_word: אֲשֶׁר יָלְדָה תָמָר לִיהוּדָה
  choice: తామారు యూదాకు కనిన
  rationale: ילד అనే ప్రసవ క్రియను నేరుగా ప్రతిబింబిస్తూ, లְ ఉపసర్గలోని వంశావళి సంబంధాన్ని ‘యూదాకు’తో నిలుపుతుంది.
- source_word: מִן הַזֶּרַע
  choice: సంతానంతో
  rationale: זֶרַע అక్షరార్థంగా ‘విత్తనం’; వంశావళి సందర్భంలో ‘సంతానం’ అని అర్థం. మִן ఇక్కడ ఆ వంశం ఏర్పడే మూలం లేదా సాధనాన్ని సూచిస్తుంది; తెలుగు వాక్యంలో ‘సంతానంతో’ సహజంగా ఆ సంబంధాన్ని చూపుతుంది.
- source_word: אֲשֶׁר יִתֵּן יְהוָה לְךָ
  choice: యహ్వే నీకు ఇచ్చే
  rationale: అసంపూర్ణ క్రియ ఆశీర్వాద సందర్భంలో ఎదురుచూస్తున్న దైవిక అనుగ్రహాన్ని సూచిస్తుంది. తెలుగు సంబంధవాచక నిర్మాణం మూల వాక్య సంబంధాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హెబ్రీ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు సమీపమైన తెలుగు లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: מִן הַנַּעֲרָה הַזֹּאת
  choice: ఈ యువతి ద్వారా
  rationale: נַעֲרָה అంటే యువతి. సంతానోత్పత్తి సందర్భంలో మִן సూచించే మాతృమూలాన్ని ‘ద్వారా’ సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో ఒడంబడిక దైవనామమే ప్రత్యక్షంగా ఉంది. దానిని సాధారణ బిరుదుగా మార్చకుండా తెలుగు లిపిలో అందించాం.
- issue: בֵּית అనే పదానికి వంశావళి ఆశీర్వాదంలో ఉన్న భావం
  choice: వంశం
  alternative: ఇల్లు / కుటుంబం / ఇంటివారు
  rationale: ఈ ఆశీర్వాదం సంతానం ద్వారా కొనసాగే కుటుంబ పరంపర గురించి ఉంది. ‘వంశం’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది; ‘ఇల్లు’ అనే మూల రూపకాన్ని పాదటిప్పణి కాపాడుతుంది.
- issue: מִן הַזֶּרַע యొక్క సంబంధం
  choice: సంతానంతో
  alternative: సంతానం నుండి / సంతానం వల్ల
  rationale: మִן మూలం, ఉద్భవం లేదా సాధనాన్ని సూచించగలదు. కారణార్థాన్ని అతిగా నిర్ధారించకుండా, ఇవ్వబడే సంతానం ద్వారా వంశం ఏర్పడుతుందనే సంబంధాన్ని ‘తో’ ద్వారా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ఆశీర్వచన శైలిని ఉపయోగించాం. మూలంలోని పదక్రమాన్ని తెలుగు సహజ వాక్యక్రమానికి మార్చినా, ఆశీర్వాద భావం, వంశావళి సంబంధం, దైవనామం, సంతాన మూలం అన్నీ నిలుపుకున్నాం.
