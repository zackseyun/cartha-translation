source:
  edition: WLC
  text: וַ/יֹּ֨אמְר֜וּ כָּל הָ/עָ֧ם אֲשֶׁר בַּ/שַּׁ֛עַר וְ/הַ/זְּקֵנִ֖ים עֵדִ֑ים יִתֵּן֩ יְהוָ֨ה אֶֽת הָ/אִשָּׁ֜ה הַ/בָּאָ֣ה אֶל בֵּיתֶ֗/ךָ כְּ/רָחֵ֤ל וּ/כְ/לֵאָה֙ אֲשֶׁ֨ר בָּנ֤וּ שְׁתֵּי/הֶם֙ אֶת בֵּ֣ית יִשְׂרָאֵ֔ל וַ/עֲשֵׂה חַ֣יִל בְּ/אֶפְרָ֔תָה וּ/קְרָא שֵׁ֖ם בְּ/בֵ֥ית לָֽחֶם־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/011.yaml
  text: Then all the people who were at the gate[a], and the elders, said, “We are witnesses. May Yahweh make the woman who is coming into your house like Rachel and Leah, who together built up the house of Israel. And may you prosper in Ephrathah and proclaim a name in Bethlehem.”
translation:
  language: te
  text: 'అప్పుడు పట్టణ ద్వారం దగ్గర ఉన్న ప్రజలందరూ, పెద్దలూ ఇలా అన్నారు: “మేము సాక్షులం. నీ ఇంటికి వస్తున్న ఈ స్త్రీని యాహ్వే రాహేలులా, లేయాలా చేయుగాక. వారిద్దరూ కలిసి ఇశ్రాయేలు వంశాన్ని నిర్మించారు. నీవు ఎఫ్రాతాలో వర్ధిల్లుగాక[a], బేత్లెహేములో పేరు పొందుగాక.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పరాక్రమం చూపుగాక,” “సామర్థ్యాన్ని చాటుగాక,” లేదా “సంపన్నుడవుగాక”; హీబ్రూ మాట శౌర్యం, బలం, సంపద లేదా వర్ధమాన విజయాన్ని సూచించవచ్చు.
    reason: חיל అనే పదంలోని విస్తృతార్థాన్ని ఒకే తెలుగు పదంతో పూర్తిగా వ్యక్తం చేయలేము కాబట్టి ప్రధాన ప్రత్యామ్నాయాలను అందిస్తుంది.
lexical_decisions:
- source_word: עֵדִים
  choice: మేము సాక్షులం
  rationale: హీబ్రూలో ఇది నామవాచక రూపంలో ‘సాక్షులు’ అని ఉన్నప్పటికీ, ప్రత్యక్ష సంభాషణలో అంతర్లీనంగా ఉన్న ‘మేము’ మరియు సమాసక్రియను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִתֵּן יְהוָה
  choice: యాహ్వే ... చేయుగాక
  rationale: נתן మూలంగా ‘ఇవ్వు’ అని అర్థమైనా, పోలికతో కూడిన ఈ ఆశీర్వాద సూత్రంలో ‘చేయుగాక’ అనే ప్రయోగం ఉద్దేశించిన ఆశార్థక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, దాని వ్యక్తినామ రూపాన్ని తెలుగులో లిప్యంతరీకరించింది.
- source_word: הָאִשָּׁה הַבָּאָה אֶל בֵּיתֶךָ
  choice: నీ ఇంటికి వస్తున్న ఈ స్త్రీని
  rationale: వివాహం ద్వారా ఇంటిలోకి వస్తున్నదనే సమీప/కొనసాగుతున్న భావాన్ని కాపాడుతుంది; సందర్భంలో నిర్దిష్టంగా ఉన్న స్త్రీని తెలుగులో సహజంగా సూచించేందుకు ‘ఈ’ వాడబడింది.
- source_word: כְּרָחֵל וּכְלֵאָה
  choice: రాహేలులా, లేయాలా
  rationale: రెండు స్త్రీలతో చేసిన పోలికను సహజమైన తెలుగు తులనార్థక రూపంలో ఉంచుతుంది.
- source_word: אֲשֶׁר בָּנוּ שְׁתֵּיהֶם אֶת בֵּית יִשְׂרָאֵל
  choice: వారిద్దరూ కలిసి ఇశ్రాయేలు వంశాన్ని నిర్మించారు
  rationale: ‘ఇల్లు కట్టడం’ అనే హీబ్రూ రూపకాన్ని వంశం/కుటుంబాన్ని స్థాపించడం అనే సందర్భార్థంతో తెలుగులో స్పష్టంగా వ్యక్తం చేస్తూ, ‘వారిద్దరూ’ అనే ఉద్ఘాటనను నిలుపుతుంది.
- source_word: וַעֲשֵׂה חַיִל
  choice: నీవు ... వర్ధిల్లి
  rationale: חיל అనే పదానికి శౌర్యం, సామర్థ్యం, సంపద, విజయం వంటి విస్తృతార్థాలు ఉన్నాయి. వివాహాశీర్వాద సందర్భంలో ‘వర్ధిల్లి’ సమగ్రంగా సరిపోతుంది; ఇతర సాధ్యార్థాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: בְּאֶפְרָתָה
  choice: ఎఫ్రాతాలో
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగు ధ్వన్యనుసారంగా నిలుపుతూ, స్థానార్థక విభక్తిని సహజంగా జోడిస్తుంది.
- source_word: וּקְרָא שֵׁם
  choice: పేరు పొందుగాక
  rationale: అక్షరార్థంగా ‘పేరు పిలువు/ప్రకటించు’ అనే నిర్మాణం ఇక్కడ కీర్తి లేదా ఖ్యాతి పొందడాన్ని సూచించే నుడికారంగా ఉంది; తెలుగు ప్రయోగం ఆ భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: בְּבֵית לָחֶם
  choice: బేత్లెహేములో
  rationale: స్థలనామాన్ని ప్రమాణ తెలుగు బైబిలు రూపానికి దగ్గరగా లిప్యంతరీకరించి, స్థానిక ఖ్యాతి భావాన్ని సూచిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తమైన ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలభాషా సాక్ష్యాన్ని నేరుగా కాపాడుతుంది.
- issue: ‘ఇశ్రాయేలు ఇంటిని నిర్మించారు’ అనే రూపకం
  choice: ఇశ్రాయేలు వంశాన్ని నిర్మించారు
  alternative: ఇశ్రాయేలు ఇంటిని కట్టారు
  rationale: ఇక్కడ ‘ఇల్లు’ భవనాన్ని కాక కుటుంబం లేదా వంశాన్ని సూచిస్తుంది. తెలుగు పాఠకునికి అర్థం స్పష్టంగా ఉండేలా రూపకంలోని వంశస్థాపన భావాన్ని వ్యక్తం చేసింది; నిర్దిష్ట మతసిద్ధాంతాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; ప్రజలకు సులభంగా అర్థమయ్యేలా, అయితే ఆశీర్వాద సందర్భానికి తగిన గంభీరతతో రూపొందించబడింది. ఆశార్థక ‘చేయుగాక/పొందుగాక’ రూపాలు మూలంలోని ఆశీర్వాద బలాన్ని నిలుపుతాయి. [a] గుర్తు సంబంధిత ‘వర్ధిల్లి’ పదం వద్ద ఉంచబడింది.
