  to: 'అప్పుడు పట్టణ ద్వారం దగ్గర ఉన్న ప్రజలందరూ, పెద్దలూ ఇలా అన్నారు: “మేము సాక్షులం. నీ ఇంటికి వస్తున్న ఈ స్త్రీని యాహ్వే రాహేలులా, లేయాలా చేయుగాక. వారిద్దరూ కలిసి ఇశ్రాయేలు వంశాన్ని నిర్మించారు. నీవు ఎఫ్రాతాలో వర్ధిల్లుగాక[a], బేత్లెహేములో పేరు పొందుగాక.”'
  rationale: అర్థంలో మార్పు చేయకుండా, హీబ్రూ ఆశీర్వాదంలోని సమాంతర క్రియారూపాలను తెలుగులో స్పష్టంగా ప్రతిబింబించేందుకు “వర్ధిల్లి”ని “వర్ధిల్లుగాక”గా మార్చాం. పాదసూచికను కూడా సహజమైన ఆధునిక ప్రమాణ తెలుగులో సవరించాం.
