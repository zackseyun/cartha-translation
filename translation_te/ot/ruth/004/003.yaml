  text: וַ/יֹּ֨אמֶר֙ לַ/גֹּאֵ֔ל חֶלְקַת֙ הַ/שָּׂדֶ֔ה אֲשֶׁ֥ר לְ/אָחִ֖י/נוּ לֶ/אֱלִימֶ֑לֶךְ מָכְרָ֣ה נָעֳמִ֔י הַ/שָּׁ֖בָה מִ/שְּׂדֵ֥ה מוֹאָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/003.yaml
  text: Then he said to the redeemer[a], “Naomi, who has returned from the fields of Moab[c][b], is selling the portion of the field that belonged to our brother Elimelech.”
translation:
  language: te
  text: అప్పుడు అతడు విమోచక బంధువుతో, “మోయాబు ప్రాంతం నుండి[b] తిరిగి వచ్చిన నయోమి, మన బంధువైన ఎలీమెలెకుకు చెందిన పొలంలోని భాగాన్ని[a] అమ్ముతోంది[c]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “భూఖండాన్ని.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థంగా “మోయాబు పొలం నుండి”; ఇది మోయాబు దేశాన్ని లేదా గ్రామీణ ప్రాంతాన్ని సూచించే ప్రయోగం.
    reason: cultural_note
  - marker: c
    text: లేదా “అమ్మింది.” హీబ్రూ రూపం పూర్తయిన చర్యను సూచించగలదు; అయితే ఇక్కడ కొనసాగుతున్న న్యాయపరమైన చర్చలో దాన్ని వర్తమాన చర్యగా అనువదించారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు అతడు … అన్నాడు
  rationale: వావ్-క్రమనిర్మాణం కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగులో సహజమైన క్రమాన్ని చూపించేందుకు ‘అప్పుడు’ వాడబడింది.
- source_word: לַגֹּאֵל
  choice: విమోచక బంధువుతో
  rationale: גֹּאֵל కుటుంబానికి సంబంధించిన ఆస్తి, వంశ పరిరక్షణ బాధ్యతగల సమీప బంధువును సూచిస్తుంది. ‘విమోచక బంధువు’ న్యాయపరమైన పాత్రను, బంధుత్వాన్ని రెండింటినీ సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: పొలంలోని భాగాన్ని
  rationale: חֶלְקָה అనేది ఒక భాగం లేదా నిర్దిష్ట భూఖండాన్ని సూచిస్తుంది. ఈ అనువాదం హీబ్రూ రూపానికి దగ్గరగా ఉంటూనే తెలుగులో సహజంగా ఉంది.
- source_word: אֲשֶׁר לְאָחִינוּ לֶאֱלִימֶלֶךְ
  choice: మన సహోదరుడైన ఎలీమెలెకుకు చెందిన
  rationale: లామెద్ నిర్మాణం స్వామ్యాన్ని లేదా సంబంధాన్ని తెలియజేస్తుంది. ‘చెందిన’ ఆ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; ‘సహోదరుడు’ ఇక్కడ విస్తృత వంశబంధుత్వ భాషను ప్రతిబింబిస్తుంది.
- source_word: מָכְרָה
  choice: అమ్ముతోంది
  rationale: హీబ్రూ పర్ఫెక్ట్ రూపాన్ని ‘అమ్మింది’ లేదా ‘అమ్ముతోంది’ అని అర్థం చేసుకోవచ్చు. కొనసాగుతున్న న్యాయపరమైన చర్చలో లావాదేవీ ఇంకా పరిష్కార దశలో ఉన్నందున వర్తమాన భావం ప్రధాన పాఠ్యంలో సహజంగా సరిపోతుంది; పూర్తయిన చర్య భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: נָעֳמִי
  choice: నయోమి
  rationale: తెలుగులో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: הַשָּׁבָה
  choice: తిరిగి వచ్చిన
  rationale: ఈ రూపం నయోమిని తిరిగి వచ్చిన వ్యక్తిగా గుర్తిస్తుంది; పూర్తయిన తిరుగు ప్రయాణం యొక్క ప్రస్తుత ప్రాసంగికతను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: מִשְּׂדֵה מוֹאָב
  choice: మోయాబు పొలప్రాంతం నుండి
  rationale: హీబ్రూలోని ‘మోయాబు పొలం/పొలాలు’ అనే స్పష్టమైన దృశ్యాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, అది దేశం లేదా గ్రామీణ ప్రాంతాన్ని సూచించే ప్రయోగమని తెలుగులో అర్థమయ్యేలా ‘పొలప్రాంతం’ వాడబడింది.
theological_decisions:
- issue: גֹּאֵל యొక్క కుటుంబ-న్యాయపరమైన పాత్ర
  choice: విమోచక బంధువు
  alternative: సమీప బంధువు; విమోచకుడు
  rationale: ‘సమీప బంధువు’ న్యాయపరమైన విమోచన బాధ్యతను పూర్తిగా తెలియజేయదు; ‘విమోచకుడు’ మాత్రమే అయితే బంధుత్వం మరుగునపడుతుంది. ఎలాంటి ప్రత్యేక సిద్ధాంతార్థాన్ని చేర్చకుండా రెండింటినీ కలిపి ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా తెలుగు సహజ క్రమానికి మార్చినా, ఆస్తి భాగం, కుటుంబ బంధం, అమ్మకం కాలసంబంధ అస్పష్టత, మోయాబు ప్రాంతపు మూల దృశ్యం అన్నీ నిలుపబడ్డాయి.
