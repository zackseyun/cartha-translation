translation:
  language: te
  text: 'పెరెసు వంశావళి[a] ఇది: పెరెసు హెస్రోనుకు తండ్రి అయ్యాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పెరెసు సంతతి’ లేదా ‘పెరెసు వంశక్రమం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ఇది
  rationale: వావ్‌తో కూడిన సూచన సర్వనామం ఇక్కడ కొత్త వంశావళి విభాగాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘ఇది’ సహజంగా ఆ సూత్రప్రాయ పరిచయాన్ని తెలియజేస్తుంది; మూలంలో కాలార్థకమైన ‘ఇప్పుడు’ లేకపోవడం వల్ల దాన్ని చేర్చలేదు.
- source_word: תּוֹלְדוֹת
  choice: వంశావళి
  rationale: ఈ సందర్భంలో ఈ పదం పెరెసు నుంచి మొదలయ్యే వంశపరంపర జాబితాను సూచిస్తుంది. ‘వంశావళి’ ఆధునిక తెలుగులో సహజమైనది, స్పష్టమైనది; ‘తరాలు’, ‘సంతతి’, ‘వంశక్రమం’ కూడా భావసాధ్యమైన ప్రత్యామ్నాయాలు.
- source_word: פָּרֶץ
  choice: పెరెసు
  rationale: హీబ్రూ పేరును ఆధునిక తెలుగు లిప్యంతరీకరణలో అందించింది.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: యలద్ ధాతువు హిఫీల్ రూపం వంశావళుల్లో ‘కన్నాడు/తండ్రి అయ్యాడు’ అనే భావాన్ని ఇస్తుంది. ‘తండ్రి అయ్యాడు’ జీవశాస్త్రీయ పితృత్వాన్ని సహజంగా వ్యక్తపరుస్తూ, పురాతన శైలిలోని ‘కనెను’ను నివారిస్తుంది.
- source_word: אֶת
  choice: '[ప్రత్యక్ష కర్మ సూచిక; అనువదించలేదు]'
  rationale: ఇది హీబ్రూలో నిర్దిష్ట ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ కణం; తెలుగులో దీనికి ప్రత్యేక పదరూపం అవసరం లేదు.
- source_word: חֶצְרוֹן
  choice: హెస్రోను
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు లిప్యంతరీకరణలో అందించింది; విభక్తి సందర్భంలో ‘హెస్రోనుకు’గా రూపాంతరం చెందుతుంది.
