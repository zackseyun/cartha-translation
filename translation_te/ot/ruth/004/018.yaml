  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. వంశావళి పరిచయ సూత్రాన్ని సంక్షిప్తంగా ఉంచి, మూలంలోని భావపరిధిని పాదసూచికలో సంరక్షించింది.
