id: RUT.4.1
reference: Ruth 4:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בֹ֨עַז עָלָ֣ה הַ/שַּׁעַר֮ וַ/יֵּ֣שֶׁב שָׁם֒ וְ/הִנֵּ֨ה הַ/גֹּאֵ֤ל עֹבֵר֙ אֲשֶׁ֣ר דִּבֶּר בֹּ֔עַז וַ/יֹּ֛אמֶר ס֥וּרָ/ה שְׁבָ/ה פֹּ֖ה פְּלֹנִ֣י אַלְמֹנִ֑י וַ/יָּ֖סַר וַ/יֵּשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/001.yaml
  text: Boaz had gone up to the gate and sat down there[a], and behold, the kinsman-redeemer of whom Boaz had spoken was passing by. So he said, "Turn aside, sit down here[b], so-and-so." And he turned aside and sat down.
translation:
  language: te
  text: బోయజు పట్టణ ద్వారం దగ్గరికి వెళ్లి అక్కడ కూర్చున్నాడు.[a] ఇదిగో, బోయజు ఇంతకుముందు ప్రస్తావించిన విమోచక బంధువు[b] అటుగా వెళ్తున్నాడు. బోయజు అతనితో, “ఫలానా[c], ఇటు వచ్చి ఇక్కడ కూర్చో” అన్నాడు. అతడు ఇటు వచ్చి కూర్చున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ప్రాచీన ఇశ్రాయేలు పట్టణ ద్వారం ప్రజా సమావేశాలు, పౌర వ్యవహారాలు, చట్టపరమైన నిర్ణయాలు జరిగే స్థలంగా ఉండేది.
    reason: cultural_note
  - marker: b
    text: ‘విమోచక బంధువు’ అంటే కుటుంబానికి చెందిన భూమి లేదా హక్కులను తిరిగి సంపాదించేందుకు బాధ్యత వహించే సమీప పురుష బంధువు.
    reason: cultural_legal_note
  - marker: c
    text: హీబ్రూలో ‘పెలోనీ అల్మోనీ’; పేరు చెప్పకుండా ఉద్దేశపూర్వకంగా ‘ఫలానా’ అని సూచించే నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה הַשַּׁעַר
  choice: పట్టణ ద్వారం దగ్గరికి వెళ్లి
  rationale: עָלָה అనే క్రియలోని గమనం తెలుగులో సహజంగా ‘వెళ్లి’ అని వచ్చింది. కేవలం ‘ద్వారం’ అంటే ఇంటి ద్వారమని అపార్థం కావచ్చు కాబట్టి సందర్భంలో ఉద్దేశించిన పట్టణ ద్వారాన్ని స్పష్టం చేశాం; ‘పైకి వెళ్లి’ అనడం తెలుగులో అసహజంగా ఉంటుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: కథలో అకస్మాత్తుగా ఎదురైన ముఖ్య పరిణామంపై పాఠకుని దృష్టి నిలిపే హీబ్రూ సూచక పదంలోని సజీవతను కాపాడుతుంది.
- source_word: הַגֹּאֵל
  choice: విమోచక బంధువు
  rationale: గֹּאֵל అనే పదంలో బంధుత్వమూ, కుటుంబ ఆస్తి తదితరాలను తిరిగి సంపాదించే చట్టబద్ధమైన విమోచన పాత్రా రెండూ ఉన్నాయి. ‘విమోచకుడు’ మాత్రమే అంటే బంధుత్వ భావం పోతుంది; ‘సమీప బంధువు’ మాత్రమే అంటే చట్టపరమైన బాధ్యత కనబడదు.
- source_word: עֹבֵר
  choice: అటుగా వెళ్తున్నాడు
  rationale: హీబ్రూ కృదంతం సూచించే కొనసాగుతున్న చర్యను సహజమైన తెలుగు వర్తమాన ప్రగతిశీల రూపంతో తెలిపాం.
- source_word: אֲשֶׁר דִּבֶּר בֹּעַז
  choice: బోయజు ఇంతకుముందు ప్రస్తావించిన
  rationale: ఇది ముందే చెప్పబడిన వ్యక్తిని గుర్తిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ‘ఇంతకుముందు ప్రస్తావించిన’ అనేది ఈ పూర్వసూచనను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: סוּרָה שְׁבָה פֹה
  choice: ఇటు వచ్చి ఇక్కడ కూర్చో
  rationale: సור అనే క్రియలో తన దారినుంచి ఇటు తిరిగే భావం ఉంది. ‘ఇటు వచ్చి’ అనేది ఆ దిశాభావాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది; שְׁבָה פֹה ను ‘ఇక్కడ కూర్చో’ అని నేరుగా అనువదించాం.
- source_word: פְּלֹנִי אַלְמֹנִי
  choice: ఫలానా
  rationale: వ్యక్తి పేరును ఉద్దేశపూర్వకంగా చెప్పకుండా ఉంచే హీబ్రూ నానుడికి ‘ఫలానా’ సహజమైన తెలుగు సమానం. పురుషుణ్ని నేరుగా సంబోధిస్తున్న విషయం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: וַיָּסַר וַיֵּשֶׁב
  choice: అతడు ఇటు వచ్చి కూర్చున్నాడు
  rationale: బోయజు ఆజ్ఞకు అతడు లోబడినట్లు చూపుతూ, סור క్రియకు ముందున్న ‘ఇటు వచ్చి’ అనే అనువాదంతో పదప్రతిధ్వనిని నిలిపాం.
theological_decisions:
- issue: גֹּאֵל అనే కుటుంబ-చట్టపరమైన పాత్రను ఎలా వ్యక్తపరచాలి
  choice: విమోచక బంధువు
  alternative: విమోచకుడు / సమీప బంధువు
  rationale: ఈ సందర్భంలో పదం సాధారణ ఆధ్యాత్మిక ‘విమోచకుడు’ అనే భావానికి మాత్రమే పరిమితం కాదు; బంధుత్వం ఆధారంగా కుటుంబ హక్కులను కాపాడే వ్యక్తిని సూచిస్తుంది. అయితే అతని ఖచ్చిత బాధ్యతలన్నిటినీ ప్రధాన పాఠ్యంలో చేర్చి భావాన్ని అతిగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. న్యాయపరమైన సందర్భాన్ని స్పష్టం చేయడానికి ‘పట్టణ ద్వారం’, ‘విమోచక బంధువు’ అన్న రూపాలు వాడినా, వాక్యాన్ని సాంకేతిక పదజాలంతో భారంగా చేయలేదు. హీబ్రూ కథనంలోని దృష్టి ఆకర్షణను ‘ఇదిగో’తో నిలిపాం.
