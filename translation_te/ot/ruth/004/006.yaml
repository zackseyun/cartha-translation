  text: וַ/יֹּ֣אמֶר הַ/גֹּאֵ֗ל לֹ֤א אוּכַל֙ ל/גאול לִ֔/י פֶּן אַשְׁחִ֖ית אֶת נַחֲלָתִ֑/י גְּאַל לְ/ךָ֤ אַתָּה֙ אֶת גְּאֻלָּתִ֔/י כִּ֥י לֹא אוּכַ֖ל לִ/גְאֹֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/006.yaml
  text: Then the redeemer said[a], “I cannot redeem it for myself, lest I ruin my own inheritance. Redeem for yourself my right of redemption[b], for I cannot redeem it.”
translation:
  language: te
  text: 'అప్పుడు విమోచించే హక్కుగల బంధువు[a] ఇలా అన్నాడు: “నేను నా కోసం దాన్ని విమోచించలేను; అలా చేస్తే నా సొంత వారసత్వానికి నష్టం కలుగుతుందేమో. నా విమోచన హక్కును[b] నీవే నీ కోసం వినియోగించు; ఎందుకంటే నేను దాన్ని విమోచించలేను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “విమోచించే హక్కుగల బంధువు” అంటే బోయజుకంటే ముందుగా హక్కు కలిగిన సమీప బంధువు. ఈ సందర్భంలో అతనికి కుటుంబ ఆస్తిని విమోచించే హక్కు, బాధ్యత ఉన్నాయి.
    reason: cultural_note
  - marker: b
    text: అక్షరార్థంగా “నా విమోచనం” అని కూడా అనువదించవచ్చు. ఇక్కడ అది ఆస్తిని విమోచించే న్యాయపరమైన హక్కు, బాధ్యతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגֹּאֵל
  choice: విమోచించే హక్కుగల బంధువు
  rationale: గאל్ ధాతువు నుంచి వచ్చిన ఈ రూపం కుటుంబ ఆస్తిని తిరిగి స్వాధీనం చేసుకునే హక్కు, బాధ్యత గల వ్యక్తిని సూచిస్తుంది. సందర్భంలో బంధుత్వం స్పష్టంగా ఉన్నందున ఈ సహజమైన న్యాయసంబంధ పదబంధం ఎంచుకున్నాం.
- source_word: לִגְאֹל / גְּאַל / גְּאֻלָּתִי
  choice: విమోచించు / విమోచన హక్కు
  rationale: పునరావృతమయ్యే గאל్ పదకుటుంబాన్ని తెలుగులోనూ సాధ్యమైనంత స్థిరంగా ప్రతిబింబిస్తూ, నామవాచక రూపంలో ఉన్న న్యాయపరమైన హక్కును స్పష్టం చేశాం.
- source_word: לִי
  choice: నా కోసం
  rationale: వ్యక్తిగత ప్రయోజనం లేదా తనకోసం చేయడాన్ని సూచించే దాతివ్ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: פֶּן
  choice: అలా చేస్తే ... నాశనం చేసుకుంటానేమో
  rationale: ఆశంకను తెలిపే హెబ్రీ పదం. ఆధునిక తెలుగులో హెచ్చరికతో కూడిన భయాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אַשְׁחִית
  choice: నాశనం చేసుకుంటాను
  rationale: ఇక్కడ అక్షరార్థ విధ్వంసం కంటే తన వారసత్వానికి తీవ్రమైన ఆర్థిక లేదా న్యాయపరమైన నష్టం కలిగించడాన్ని సూచిస్తుంది.
- source_word: נַחֲלָתִי
  choice: నా సొంత వారసత్వం
  rationale: తన పితృసంపదను సూచిస్తుంది; ‘సొంత’ అనే పదం విమోచించాల్సిన ఇతర ఆస్తితో ఉన్న వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
- source_word: לְךָ אַתָּה
  choice: నువ్వే నీ కోసం
  rationale: సర్వనామంలోని ఉద్ఘాటనను ‘నువ్వే’ ద్వారా, వ్యక్తిగత ప్రయోజనాన్ని ‘నీ కోసం’ ద్వారా నిలిపాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: తాను విమోచించలేనన్న పూర్వ వాక్యానికి వివరణాత్మక కారణాన్ని సహజంగా కలుపుతుంది.
theological_decisions:
- issue: గאל్ పదకుటుంబానికి న్యాయపరమైన, కుటుంబపరమైన భావం
  choice: విమోచించే హక్కుగల బంధువు / విమోచన హక్కు
  alternative: విమోచకుడు / నా విమోచనం
  rationale: ఈ సందర్భంలో ప్రధానంగా కుటుంబ ఆస్తిపై ఉన్న న్యాయబద్ధమైన హక్కు, బాధ్యత ఉద్దేశించబడింది. అయినప్పటికీ ‘విమోచించు’ అనే మూలపదాన్ని నిలిపి విస్తృత బైబిలు పదసంబంధాన్ని కోల్పోకుండా చూశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. గאל్ పదకుటుంబపు పునరావృతాన్ని ‘విమోచించు/విమోచన’ ద్వారా నిలిపి, సాంస్కృతిక-న్యాయ భావాన్ని ‘హక్కుగల బంధువు’ మరియు పాదసూచనలతో స్పష్టం చేశాం.
