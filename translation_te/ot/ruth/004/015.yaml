- from: అతడు నీ ప్రాణాన్ని పునరుద్ధరించేవాడిగా[a], నీ ముసలితనంలో నిన్ను పోషించేవాడిగా ఉంటాడు. ఎందుకంటే నిన్ను ప్రేమించే నీ కోడలు అతనికి జన్మనిచ్చింది; ఆమె నీకు ఏడుగురు కుమారులకంటే మేలు.[b][c]
