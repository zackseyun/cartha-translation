  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָ֤יָה לָ/ךְ֙ לְ/מֵשִׁ֣יב נֶ֔פֶשׁ וּ/לְ/כַלְכֵּ֖ל אֶת שֵׂיבָתֵ֑/ךְ כִּ֣י כַלָּתֵ֤/ךְ אֲֽשֶׁר אֲהֵבַ֨תֶ/ךְ֙ יְלָדַ֔תּ/וּ אֲשֶׁר הִיא֙ ט֣וֹבָה לָ֔/ךְ מִ/שִּׁבְעָ֖ה בָּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/015.yaml
  text: And he will be to you a restorer of life and a sustainer of your old age[a], for your daughter-in-law, who loves you[c][b], has borne him—she who is better to you than seven sons.
translation:
  language: te
  text: అతడు నీ ప్రాణాన్ని పునరుద్ధరించేవాడిగా[a], నీ ముసలితనంలో[b] నిన్ను పోషించేవాడిగా ఉంటాడు. ఎందుకంటే నిన్ను ప్రేమించే నీ కోడలు అతనికి జన్మనిచ్చింది; ఆమె నీకు ఏడుగురు కుమారులకంటే మిన్న.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ జీవితాన్ని పునరుద్ధరించేవాడిగా’; హీబ్రూ పదబంధం అక్షరార్థంగా ‘ప్రాణం/జీవాన్ని పునరుద్ధరించేవాడు.’
    reason: lexical_alternative
  - marker: b
    text: ‘ముసలితనం’కు వాడిన హీబ్రూ పదం అక్షరార్థంగా ‘నీ నెరిసిన జుట్టు’ అని కూడా అర్థమిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘ఏడుగురు కుమారులు’ అనే మాటలో ఏడు సంపూర్ణతను సూచించే సంఖ్య. అనేకమంది కుమారులు ఉన్న ఆదర్శ స్థితికంటే రూతు నయోమికి ఎక్కువ విలువైనదని భావం.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: ఉంటాడు
  rationale: సందర్భంలో ఈ రూపం శిశువు నయోమికి భవిష్యత్తులో కలిగించే ఫలితాన్ని తెలిపే వాక్యంగా ఉంది; తెలుగు భవిష్యత్ రూపం సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: לְמֵשִׁיב נֶפֶשׁ
  choice: నీ ప్రాణాన్ని పునరుద్ధరించేవాడిగా
  rationale: מֵשִׁיב పునరుద్ధరించడం/తిరిగి తీసుకురావడం అనే భావాన్ని, נֶפֶשׁ ఇక్కడ జీవం లేదా వ్యక్తిగత ప్రాణం అనే స్పష్టమైన భావాన్ని ఇస్తాయి; ‘ఆత్మ’ అని అనువదిస్తే సందర్భానికి లేని తాత్త్విక భావం చేరవచ్చు.
- source_word: וּלְכַלְכֵּל
  choice: నిన్ను పోషించేవాడిగా
  rationale: כלכל పోషించడం, సంరక్షించడం, అవసరాలు తీర్చడం అనే భావాన్ని కలిగి ఉంది; వ్యక్తిని కర్మగా చేర్చడం తెలుగులో సహజం.
- source_word: אֶת שֵׂיבָתֵךְ
  choice: నీ ముసలితనంలో
  rationale: שֵׂיבָה అక్షరార్థంగా నెరిసిన జుట్టును, ప్రయోగార్థంగా వృద్ధాప్యాన్ని సూచిస్తుంది; ‘ముసలితనంలో’ సందర్భంలోని కాలపరమైన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כַלָּתֵךְ אֲשֶׁר אֲהֵבַתֶךְ
  choice: నిన్ను ప్రేమించే నీ కోడలు
  rationale: కుటుంబ సంబంధాన్ని ‘కోడలు’ సరిగ్గా తెలియజేస్తుంది; పరిపూర్ణ క్రియా ఇక్కడ నిరూపితమైన, కొనసాగుతున్న ప్రేమను సూచిస్తున్నందున వర్తమాన విశేషణ రూపం తగినది.
- source_word: יְלָדַתּוּ
  choice: అతనికి జన్మనిచ్చింది
  rationale: పుంలింగ ఏకవచన ప్రత్యయం ముందున్న శిశువునే సూచిస్తుంది; ‘జన్మనిచ్చింది’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: אֲשֶׁר הִיא טוֹבָה לָךְ
  choice: ఆమె నీకు ... కంటే మేలు
  rationale: מן తో కూడిన טוֹבָה తులనాత్మకంగా ఎక్కువ మేలు లేదా విలువను సూచిస్తుంది; ఈ నిర్మాణం ఆ సంబంధపరమైన తులనను నిలుపుతుంది.
- source_word: מִשִּׁבְעָה בָּנִים
  choice: ఏడుగురు కుమారులకంటే
  rationale: మూలంలో లింగం స్పష్టంగా ‘కుమారులు’; ఏడు సంపూర్ణతను సూచించే సాంప్రదాయ సంఖ్య అయినా దానిని పాఠ్యంలో యథాతథంగా ఉంచడం అవసరం.
theological_decisions:
- issue: נֶפֶשׁ అనువాదం
  choice: ప్రాణం
  alternative: ఆత్మ; జీవితం; వ్యక్తి
  rationale: ఈ సందర్భం నయోమి జీవిత పునరుద్ధరణ, భవిష్యత్ పోషణ గురించి ఉంది; అమూర్తమైన ‘ఆత్మ’ భావాన్ని ప్రవేశపెట్టకుండా మూలంలోని జీవం/వ్యక్తి భావాన్ని ‘ప్రాణం’ నిలుపుతుంది.
- issue: מִשִּׁבְעָה בָּנִים లో లింగ నిర్దిష్టత
  choice: ఏడుగురు కుమారులు
  alternative: ఏడుగురు పిల్లలు
  rationale: హీబ్రూ స్పష్టంగా కుమారులను పేర్కొంటుంది; ప్రాచీన సమాజంలో వృద్ధాప్య సహాయం, కుటుంబ సంపూర్ణతకు సంబంధించిన సాంస్కృతిక తులనను లింగనిరపేక్షంగా మార్చకూడదు.
- issue: వాక్యం ఆశీర్వాదమా లేక ఫలిత ప్రకటననా
  choice: ఉంటాడు
  alternative: ఉండుగాక
  rationale: וְהָיָה సందర్భంలో భవిష్యత్/ఫలిత ప్రకటనగా సహజంగా చదవబడుతుంది. అయినా స్త్రీల మాటలకు ఆశీర్వాద ఛాయ ఉండవచ్చు; దానిని కఠిన ఆజ్ఞార్థకంగా మార్చకుండా ప్రకటన రూపాన్ని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. స్త్రీలు నయోమితో మాట్లాడుతున్నందున ఏకవచన ద్వితీయ పురుష రూపాలు వాడబడ్డాయి. మూలంలోని ‘కుమారులు’ అనే సాంస్కృతికంగా ముఖ్యమైన లింగ నిర్దిష్ట పదం నిలుపబడింది.
