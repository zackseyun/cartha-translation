translation:
  language: te
  text: హెస్రోను రాముకు తండ్రి అయ్యాడు; రాము అమ్మీనాదాబుకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/חֶצְרוֹן
  choice: హెస్రోను
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం. ఆరంభంలోని וְ సంధిని వంశావళి కొనసాగింపుగా భావించి విడిగా అనువదించలేదు.
- source_word: הוֹלִיד
  choice: కనెను
  rationale: ילד హిఫీల్ రూపం వంశావళి సందర్భంలో ‘సంతానానికి తండ్రి అయ్యాడు/కన్నాడు’ అనే భావం ఇస్తుంది. ‘కనెను’ సంక్షిప్తంగా ఉండి పురుష వంశక్రమ భావాన్ని నిలుపుతుంది.
- source_word: אֶת
  choice: '[విడిగా అనువదించలేదు]'
  rationale: ఇది ప్రత్యక్ష కర్మ సూచిక; తెలుగు విభక్తి రూపంలో దాని వ్యాకరణ కార్యం వ్యక్తమవుతుంది.
- source_word: רָם
  choice: రాము
  rationale: వ్యక్తి పేరును తెలుగులో సహజంగా విభక్తి స్వీకరించే సంప్రదాయ రూపంలో లిప్యంతరీకరించాం.
- source_word: וְ/רָם
  choice: రాము
  rationale: రెండవ వంశావళి వాక్యాన్ని తెలుగు విరామచిహ్నంతో సహజంగా కలిపాం; וְ ను తప్పనిసరిగా ‘మరియు’ అని విడిగా పలకకుండానే సమన్వయం స్పష్టంగా ఉంది.
- source_word: הוֹלִיד
  choice: కనెను
  rationale: వంశావళిలో పునరావృతమైన క్రియకు ఒకే తెలుగు రూపాన్ని నిలిపాం.
- source_word: עַמִּינָדָב
  choice: అమ్మీనాదాబు
  rationale: హీబ్రూ עַמִּינָדָב లోని ద్విత్వ మ్ మరియు దీర్ఘ స్వరాన్ని సాధ్యమైనంత స్పష్టంగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళులకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. పేర్లకు తెలుగు విభక్తులు సహజంగా చేరేలా ఉకారాంత రూపాలు వాడబడ్డాయి; మూలంలోని సమాంతర నిర్మాణం కాపాడబడింది.
