base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/007.yaml
  text: 'This was formerly the custom in Israel concerning redemption and exchange[a], to confirm any matter: a man removed his sandal and gave it to his neighbor[c][b], and this was the attestation in Israel.'
translation:
  language: te
  text: 'విమోచనం మరియు మార్పిడికి సంబంధించి ఏ విషయాన్నైనా ధృవపరచడానికి, పూర్వకాలంలో ఇశ్రాయేలులో ఈ ఆచారం ఉండేది: ఒక వ్యక్తి తన చెప్పును తీసి తన తోటివానికి ఇచ్చేవాడు; ఇశ్రాయేలులో ఇదే సాక్ష్యంగా ఉండేది.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలులో ఇదే ధృవీకరణగా ఉండేది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנִים
  choice: పూర్వకాలంలో
  rationale: ఈ పదం గతంలో అమలులో ఉన్న ఆచారాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా కాలార్థాన్ని తెలియజేస్తుంది.
- source_word: הַגְּאוּלָּה
  choice: విమోచన హక్కు
  rationale: రూతు 4లోని బంధుత్వ-ఆస్తి న్యాయ సందర్భంలో ఇది తిరిగి పొందే లేదా విడిపించే హక్కును సూచిస్తుంది; కేవలం ‘విమోచనం’ కంటే సందర్భార్థం స్పష్టంగా ఉంటుంది.
- source_word: הַתְּמוּרָה
  choice: మార్పిడి
  rationale: పదంలోని exchange/substitution భావాన్ని న్యాయపద్ధతిని అతిగా నిర్దిష్టం చేయకుండా నేరుగా తెలియజేస్తుంది.
- source_word: לְקַיֵּם כָּל דָּבָר
  choice: ఏ విషయాన్నైనా ధృవపరచడానికి
  rationale: לְקַיֵּם లోని స్థిరపరచడం లేదా ధృవీకరించడం అనే భావాన్నీ, כָּל דָּבָר లోని విస్తృతార్థాన్నీ నిలుపుతుంది.
- source_word: שָׁלַף
  choice: తీసి
  rationale: చెప్పును పాదం నుంచి తొలగించే చర్యకు సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: נַעֲלוֹ
  choice: తన చెప్పును
  rationale: నַעַל ప్రాచీన పాదరక్షను సూచిస్తుంది; ‘చెప్పు’ సాధారణ తెలుగు పాఠకునికి సహజంగా అర్థమవుతుంది.
- source_word: לְרֵעֵהוּ
  choice: తన తోటివానికి
  rationale: רֵעַ యొక్క సహచరుడు/తోటివాడు అనే విస్తృత భావాన్ని నిలుపుతూ, లావాదేవీలోని ఎదుటి వ్యక్తిని అతిగా వ్యాఖ్యానించదు.
- source_word: הַתְּעוּדָה
  choice: ధృవీకరణ
  rationale: ఇక్కడ లావాదేవీని చెల్లుబాటు చేసే సాక్ష్యపూర్వక చర్య లేదా సంకేతాన్ని సూచిస్తుంది; తెలుగులో న్యాయసంబంధ భావం స్పష్టంగా ఉంటుంది.
