  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కథన-న్యాయ శైలి. మూలంలోని ఆచార వివరణను స్పష్టంగా ఉంచి, ఆధునిక న్యాయపరిభాషను అతిగా రుద్దలేదు. పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
