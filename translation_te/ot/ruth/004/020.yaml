translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వంశావళి శైలిని ఉపయోగించాం. ‘కనెను’ వంటి పాత ప్రయోగానికి బదులుగా ‘తండ్రి అయ్యాడు’ అని వాడాం. మూలపాఠంలోని ‘సల్మా’ రూపాన్ని ప్రధాన పాఠంలో ఉంచి, సాంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
