translation:
  language: te
  text: అమ్మీనాదాబు నహ్షోనుకు తండ్రి అయ్యాడు, మరియు నహ్షోను సల్మాకు[a] తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ పాఠంలో “సల్మా” అని ఉంది; సమాంతర వంశావళులతో సరిపోల్చుతూ కొన్ని అనువాదాలు “సల్మోను” అని వాడుతాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: עַמִּינָדָב
  choice: అమ్మీనాదాబు
  rationale: వ్యక్తి పేరును హెబ్రీ రూపానికి దగ్గరగా, తెలుగులో సహజంగా ఉచ్చరించగల విధంగా లిప్యంతరీకరించాం.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో హిఫిల్ రూపం ‘తండ్రి కావడం/కనడం’ అనే భావాన్ని ఇస్తుంది. ఆధునిక సాధారణ తెలుగులో సహజంగా ఉండటంతో పాటు పురుష వంశసంబంధాన్ని స్పష్టంగా ఉంచేలా ‘తండ్రి అయ్యాడు’ అని అనువదించాం.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది నిర్దిష్ట ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగులో దీనికి ప్రత్యేక పదం అవసరం లేదు.
- source_word: נַחְשׁוֹן
  choice: నహ్షోను
  rationale: హెబ్రీ వ్యక్తి పేరును మూలంలోని వ్యంజన క్రమానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וְ
  choice: ;
  rationale: రెండు సమాంతర వంశావళి వాక్యభాగాల సంబంధాన్ని తెలుగులో సహజంగా చూపించేందుకు విరామచిహ్నంతో అనుసంధానించాం; హెబ్రీ సంధానార్థం నిలిచి ఉంటుంది.
- source_word: שַׂלְמָה
  choice: సల్మా
  rationale: WLC పాఠంలోని שַׂלְמָה రూపాన్ని నేరుగా ప్రతిబింబించేలా ‘సల్మా’ అని లిప్యంతరీకరించాం; సమాంతర వంశావళుల ఆధారంగా ‘సల్మోను’గా మార్చలేదు.
