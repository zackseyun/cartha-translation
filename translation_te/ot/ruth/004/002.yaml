translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘పట్టణ పెద్దలు’ అనే పదబంధం ప్రజాపరమైన అధికారిక సందర్భాన్ని సహజంగా తెలియజేస్తుంది. మూలంలోని ‘కూర్చోండి—కూర్చున్నారు’ అనే పునరుక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది.
