source:
  edition: WLC
  text: וַ/יִּקַּ֞ח עֲשָׂרָ֧ה אֲנָשִׁ֛ים מִ/זִּקְנֵ֥י הָ/עִ֖יר וַ/יֹּ֣אמֶר שְׁבוּ פֹ֑ה וַ/יֵּשֵֽׁבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/002.yaml
  text: Then he took ten men from the elders of the city and said[a], “Sit here,” and they sat down.
translation:
  language: te
  text: అప్పుడు అతడు పట్టణ పెద్దలలో పదిమందిని తీసుకొని[a], “ఇక్కడ కూర్చోండి” అన్నాడు. వారు కూర్చున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పట్టణ పెద్దలలో పదిమందిని ఎంపిక చేసుకొని.” హీబ్రూ క్రియ ఒక నిర్దిష్ట ఉద్దేశం కోసం తీసుకోవడం అనే భావాన్ని ఇవ్వగలదు; ఇక్కడ న్యాయపరమైన వ్యవహారానికి సాక్షులుగా వారిని ఎంపిక చేయడం భావం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకొని
  rationale: לקח అనే క్రియకు ప్రాథమికంగా ‘తీసుకొను’ అనే అర్థం ఉంది. ఈ సందర్భంలో న్యాయపరమైన వ్యవహారానికి పెద్దలలో పదిమందిని ఎంపిక చేసుకోవడం భావం; ప్రధాన పాఠంలో మూలంలోని సాధారణ పదప్రయోగాన్ని నిలిపి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: పదిమందిని
  rationale: హీబ్రూ పదబంధం పది మంది పురుషులను సూచిస్తుంది. తెలుగులో ‘పట్టణ పెద్దలలో పదిమందిని’ అన్నప్పుడు వారు పురుష పెద్దలని సందర్భం సహజంగా తెలియజేస్తుంది; అనవసరమైన పదభారం లేకుండా సంఖ్యను ఖచ్చితంగా ఉంచుతుంది.
- source_word: מִזִּקְנֵי הָעִיר
  choice: పట్టణ పెద్దలలో
  rationale: מן లోని విభాగార్థాన్ని ‘పెద్దలలో’ స్పష్టంగా వ్యక్తం చేస్తుంది; זִקְנֵי הָעִיר ఇక్కడ గుర్తింపు పొందిన పట్టణ నాయకులను సూచిస్తుంది.
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: ప్రత్యక్ష సంభాషణకు ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, మూలానికి నేరుగా సరిపడే కథన క్రియ.
- source_word: שְׁבוּ פֹה
  choice: ఇక్కడ కూర్చోండి
  rationale: బహువచన ఆజ్ఞను గౌరవసూచకమైన సహజ తెలుగు రూపంలో అందిస్తుంది; פֹה ను ‘ఇక్కడ’గా నేరుగా అనువదిస్తుంది.
- source_word: וַיֵּשֵׁבוּ
  choice: వారు కూర్చున్నారు
  rationale: ఆజ్ఞకు వారు స్పందించి కూర్చున్నారనే వరుస కథన చర్యను సరళంగా, మూలంలోని పునరుక్తిని నిలుపుతూ తెలియజేస్తుంది.
