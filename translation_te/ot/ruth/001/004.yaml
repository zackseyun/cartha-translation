  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వివాహ ప్రయోగాన్ని తెలుగులో అసహజంగా అక్షరానువదించకుండా దాని ఉద్దేశార్థాన్ని నేరుగా తెలిపింది; పేర్లు లిప్యంతరీకరించబడ్డాయి.
