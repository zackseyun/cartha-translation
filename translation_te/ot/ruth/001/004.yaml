  text: וַ/יִּשְׂא֣וּ לָ/הֶ֗ם נָשִׁים֙ מֹֽאֲבִיּ֔וֹת שֵׁ֤ם הָֽ/אַחַת֙ עָרְפָּ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית ר֑וּת וַ/יֵּ֥שְׁבוּ שָׁ֖ם כְּ/עֶ֥שֶׂר שָׁנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/004.yaml
  text: And they took for themselves Moabite wives. The name of the one was Orpah[a], and the name of the other was Ruth. And they lived there about ten years.
translation:
  language: te
  text: వారు మోయాబీయ స్త్రీలను వివాహం చేసుకున్నారు.[a] ఒకామె పేరు ఒర్పా, రెండవామె పేరు రూతు. వారు అక్కడ దాదాపు పది సంవత్సరాలు నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు తమ కొరకు మోయాబీయ భార్యలను తీసుకున్నారు.” హీబ్రూలో ఇది వివాహాన్ని సూచించే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ לָהֶם נָשִׁים
  choice: వివాహం చేసుకున్నారు
  rationale: נָשָׂא నָשִׁים అనే హీబ్రూ ప్రయోగానికి ‘భార్యలను తీసుకున్నారు’ అనేది అక్షరార్థ రూపం; ఆధునిక తెలుగులో దాని వివాహార్థాన్ని సహజంగా, స్పష్టంగా తెలిపేది ‘వివాహం చేసుకున్నారు.’
- source_word: נָשִׁים מֹאֲבִיּוֹת
  choice: మోయాబు స్త్రీలను
  rationale: మూలంలోని స్త్రీలు/భార్యలు అనే భావాన్నీ, వారి మోయాబు గుర్తింపునూ నిలుపుతుంది; క్రియ ఇప్పటికే వివాహార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: שֵׁם הָאַחַת ... וְשֵׁם הַשֵּׁנִית
  choice: ఒకామె పేరు ... రెండో ఆమె పేరు
  rationale: אַחַת మరియు הַשֵּׁנִית మధ్య ఉన్న ‘ఒకరు—రెండోవారు’ నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עָרְפָּה
  choice: ఒర్పా
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగులో ధ్వన్యనుసారంగా లిప్యంతరీకరించింది.
- source_word: רוּת
  choice: రూతు
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న ధ్వన్యనుసార రూపంలో లిప్యంతరీకరించింది.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: వారు అక్కడ ... నివసించారు
  rationale: יָשַׁב ఇక్కడ దీర్ఘకాలం ఉండడం లేదా నివసించడం అనే భావాన్ని ఇస్తుంది; ‘నివసించారు’ సందర్భానికి తగిన ఆధునిక పదం.
- source_word: כְּעֶשֶׂר שָׁנִים
  choice: దాదాపు పది సంవత్సరాలు
  rationale: ఉపసర్గ כְּ సూచించే సుమారు పరిమాణాన్ని ‘దాదాపు’ స్పష్టంగా ప్రతిబింబిస్తుంది.
