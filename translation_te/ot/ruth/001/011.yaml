id: RUT.1.11
reference: Ruth 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר נָעֳמִי֙ שֹׁ֣בְנָה בְנֹתַ֔/י לָ֥/מָּה תֵלַ֖כְנָה עִמִּ֑/י הַֽ/עֽוֹד לִ֤/י בָנִים֙ בְּֽ/מֵעַ֔/י וְ/הָי֥וּ לָ/כֶ֖ם לַ/אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/011.yaml
  text: But Naomi said[a], “Turn back, my daughters. Why would you go with me? Do I still have sons in my womb, that they may become husbands for you?”
translation:
  language: te
  text: 'అయితే నయోమి ఇలా అంది: “నా కుమార్తెలారా[a], వెనక్కి వెళ్లండి. మీరు నాతో ఎందుకు రావాలి? మీకు భర్తలయ్యే కుమారులు ఇంకా నా గర్భంలో ఉన్నారా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా “నా కుమార్తెలారా.” నయోమి తన కోడళ్లను కుటుంబ ఆప్యాయతతో ఇలా సంబోధిస్తోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అయితే నయోమి ఇలా అంది
  rationale: వావ్-అనుక్రమ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; సందర్భంలో కోడళ్ల ఉద్దేశానికి నయోమి విరుద్ధంగా స్పందిస్తున్నందున ‘అయితే’ ఆ భావసంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שֹׁבְנָה
  choice: వెనక్కి వెళ్లండి
  rationale: שוב అనే క్రియ తిరిగి వెళ్లడం లేదా వెనుదిరగడం అనే దిశాత్మక భావాన్ని ఇక్కడ వ్యక్తం చేస్తుంది; ఆధునిక తెలుగులో ఈ రూపం సహజంగా ఉంది.
- source_word: בְנֹתַי
  choice: నా కుమార్తెలారా
  rationale: హీబ్రూ పదబంధానికి అక్షరార్థం ‘నా కుమార్తెలు’; నయోమి తన కోడళ్లను ఆప్యాయమైన కుటుంబ సంబోధనతో పిలుస్తోంది. మూలంలోని బంధుత్వ భాషను ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: לָמָּה תֵלַכְנָה עִמִּי
  choice: మీరు నాతో ఎందుకు రావాలి?
  rationale: అసంపూర్ణ క్రియారూపం ఇక్కడ భవిష్యత్తును మాత్రమే కాక, నయోమి అడిగే అలంకారిక ప్రశ్నలో ఉద్దేశం లేదా సముచితతను కూడా సూచిస్తుంది; ‘ఎందుకు రావాలి?’ ఆ విజ్ఞాపనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַעוֹד לִי
  choice: ఇంకా ... ఉన్నారా?
  rationale: עוֹד మరియు దత్తివ సర్వనామం కొనసాగుతున్న ఉనికి లేదా స్వాధీనతను సూచిస్తాయి; తెలుగు అస్తిత్వ నిర్మాణం ఈ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: בָנִים
  choice: కుమారులు
  rationale: హీబ్రూ ప్రత్యేకంగా మగ సంతానాన్ని సూచిస్తుంది; తరువాతి వివాహ తర్కానికి ఇది కీలకం కాబట్టి సాధారణ ‘పిల్లలు’ అని చేయలేదు.
- source_word: בְּמֵעַי
  choice: నా గర్భంలో
  rationale: ఈ సందర్భంలో ఈ నామవాచకం అంతర్భాగాలను, ప్రత్యేకంగా సంతానోత్పత్తికి సంబంధించిన గర్భాన్ని సూచిస్తుంది; ‘గర్భం’ సందర్భార్థాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: וְהָיוּ לָכֶם לַאֲנָשִׁים
  choice: మీకు భర్తలయ్యే
  rationale: అక్షరార్థ నిర్మాణం ‘వారు మీకు భర్తలుగా అవుతారు’; తెలుగులో సంబంధవాచక రూపం ఊహాత్మక ఫలితాన్ని సహజంగా తెలిపి, אֲנָשִׁים ఇక్కడ ‘పురుషులు’ కాక ‘భర్తలు’ అనే అర్థమని నిలుపుతుంది.
