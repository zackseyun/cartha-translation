  yaml_path: translation/ot/ruth/001/003.yaml
  text: Then Elimelech[a], Naomi’s husband, died, and she was left, and her two sons.
translation:
  language: te
  text: అప్పుడు నయోమి భర్త ఎలీమెలెకు మరణించాడు; ఆమె, ఆమె ఇద్దరు కుమారులు మిగిలారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: తర్వాత ... చనిపోయాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని తదుపరి సంఘటనకు తీసుకెళ్తుంది. ఆధునిక తెలుగులో ‘తర్వాత’ ఈ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֱלִימֶלֶךְ
  choice: ఎలీమెలెకు
  rationale: వ్యక్తి పేరును తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אִישׁ נָעֳמִי
  choice: నయోమి భర్త
  rationale: ఈ నిర్మాణంలో אִישׁ సాధారణంగా ‘పురుషుడు’ అని కాక, వైవాహిక సంబంధాన్ని సూచించే ‘భర్త’ అని అర్థం.
- source_word: וַתִּשָּׁאֵר
  choice: మిగిలిపోయింది
  rationale: మరణం వల్ల ఏర్పడిన నష్టానంతరం ఆమె మిగిలి ఉండడాన్ని ఈ రూపం సహజంగా, సందర్భోచితంగా వ్యక్తం చేస్తుంది.
- source_word: הִיא וּשְׁנֵי בָנֶיהָ
  choice: ఆమె తన ఇద్దరు కుమారులతో
  rationale: హీబ్రూలోని ‘ఆమె మరియు ఆమె ఇద్దరు కుమారులు’ అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తూ, ముగ్గురూ మిగిలారనే అర్థాన్ని కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా, దాని సంఘటన క్రమం మరియు నష్టం తర్వాత మిగిలిన స్థితిని స్పష్టంగా నిలిపింది.
