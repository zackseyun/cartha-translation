id: RUT.1.6
reference: Ruth 1:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תָּ֤קָם הִיא֙ וְ/כַלֹּתֶ֔י/הָ וַ/תָּ֖שָׁב מִ/שְּׂדֵ֣י מוֹאָ֑ב כִּ֤י שָֽׁמְעָה֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב כִּֽי פָקַ֤ד יְהוָה֙ אֶת עַמּ֔/וֹ לָ/תֵ֥ת לָ/הֶ֖ם לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/006.yaml
  text: Then she arose with her daughters-in-law and returned from the fields of Moab[a], because in the field of Moab she had heard that Yahweh had visited his people to give them food.
translation:
  language: te
  text: అప్పుడు ఆమె తన కోడళ్లతో కలిసి లేచి, మోయాబు ప్రాంతం నుండి తిరిగి వెళ్లడానికి సిద్ధపడింది. ఎందుకంటే యాహ్వే తన ప్రజల పట్ల శ్రద్ధ చూపి వారికి ఆహారం[a] ఇచ్చాడని ఆమె మోయాబు ప్రాంతంలో విన్నది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రొట్టె’. హీబ్రూ పదమైన లెహెమ్ సాధారణంగా రొట్టెను సూచిస్తుంది; అయితే విస్తృత అర్థంలో ఆహారం లేదా జీవనోపాధికి కావలసిన సరఫరాలను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: అప్పుడు ఆమె ... లేచి
  rationale: קום అనే క్రియ కథనంలోని తదుపరి చర్యను సూచిస్తుంది. ‘అప్పుడు’ కథన క్రమాన్ని తెలియజేస్తుంది; ‘లేచి’ మూలంలోని కదలికను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְכַלֹּתֶיהָ
  choice: తన కోడళ్లతో కలిసి
  rationale: హీబ్రూ సంధానాన్ని తెలుగులో సహచర్యాన్ని స్పష్టంగా తెలిపే సహజమైన రూపంలో అనువదించాం.
- source_word: וַתָּשָׁב
  choice: తిరిగి వెళ్లడానికి బయలుదేరింది
  rationale: שׁוב అంటే తిరగడం లేదా తిరిగి వెళ్లడం. తరువాతి వచనాల్లో ప్రయాణం కొనసాగుతున్నందున, ఇక్కడ తిరుగు ప్రయాణాన్ని ప్రారంభించిందనే భావాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: מִשְּׂדֵי מוֹאָב / בִּשְׂדֵה מוֹאָב
  choice: మోయాబు ప్రాంతం నుండి / మోయాబు ప్రాంతంలో
  rationale: שׂדה అక్షరార్థంగా పొలం అయినా, ఈ సందర్భంలో దేశప్రాంతం లేదా భూభాగాన్ని సూచిస్తుంది. తెలుగులో ‘మోయాబు పొలాలు’ అనడం తప్పుదారి పట్టించగలదు కాబట్టి ‘ప్రాంతం’ ఎంచుకున్నాం; రెండు సందర్భాల్లోనూ మూలంలోని పునరుక్తిని నిలిపాం.
- source_word: שָׁמְעָה
  choice: విన్నది
  rationale: ఆమె తిరుగు ప్రయాణ నిర్ణయానికి ముందే అందిన సమాచారాన్ని వాక్య నిర్మాణం స్పష్టంగా చూపుతుంది; తెలుగులో సాధారణ భూతకాలమే సహజంగా సరిపోతుంది.
- source_word: פָּקַד
  choice: కటాక్షించి
  rationale: ఇక్కడ פקד దేవుడు తన ప్రజల పట్ల అనుకూలంగా శ్రద్ధ చూపి వారి పరిస్థితిలో జోక్యం చేసుకున్నాడనే భావాన్ని ఇస్తుంది. ‘కటాక్షించి’ ఆ అనుకూల దృష్టిని గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది; కేవలం భౌతిక సందర్శనగా పరిమితం చేయదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను ఒక బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: עַמּוֹ
  choice: తన ప్రజలను
  rationale: עם ఇక్కడ దేవునితో సంబంధమున్న సమాజాన్ని సూచిస్తుంది; ‘తన ప్రజలు’ ఆ సంబంధ భావాన్ని నిలుపుతుంది.
- source_word: לָתֵת לָהֶם לָחֶם
  choice: వారికి ఆహారం ఇచ్చాడని
  rationale: לֶחֶם అక్షరార్థంగా రొట్టె అయినప్పటికీ, కరవు ముగిసి జీవనావసరమైన భోజనం లభించడాన్ని ఈ సందర్భంలో విస్తృతంగా సూచిస్తుంది. అందువల్ల ప్రధాన పాఠ్యంలో ‘ఆహారం’ వాడి, అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠ్యంలో సాధారణ బిరుదు కాకుండా నాలుగు అక్షరాల దైవనామం నేరుగా ఉంది. అందువల్ల వ్యక్తిగత నామాన్ని తెలుగులో గుర్తించదగిన లిప్యంతరీకరణతో నిలిపాం.
- issue: פקד సూచించే దేవుని చర్య
  choice: తన ప్రజలను కటాక్షించి
  alternative: తన ప్రజలను దర్శించి
  rationale: ఈ సందర్భంలో ఈ క్రియ కేవలం వచ్చి చూడడాన్ని కాక, అనుకూల శ్రద్ధతో ప్రజలకు ఉపశమనం కలిగించడాన్ని సూచిస్తుంది. అయితే సహాయం ఏ విధంగా జరిగిందో అవసరానికి మించి నిర్దిష్టం చేయకుండా ‘కటాక్షించి’ అని ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించాం. కథన క్రమం స్పష్టంగా ఉండేందుకు మొదటి హీబ్రూ సంధానానికి ‘అప్పుడు’ వాడాం. ‘మోయాబు ప్రాంతం’ భౌగోళిక భావాన్ని స్పష్టంగా ఇస్తుంది. పాదసూచిక గుర్తు [a] సంబంధిత ‘ఆహారం’ పదం వెంటనే ఉంచబడింది.
