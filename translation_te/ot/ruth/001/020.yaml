  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֲלֵי/הֶ֔ן אַל תִּקְרֶ֥אנָה לִ֖/י נָעֳמִ֑י קְרֶ֤אןָ לִ/י֙ מָרָ֔א כִּי הֵמַ֥ר שַׁדַּ֛י לִ֖/י מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/020.yaml
  text: But she said to them[a], “Do not call me Naomi; call me Mara, for the Almighty has made me very bitter.”
translation:
  language: te
  text: అప్పుడు ఆమె వారితో, “నన్ను నయోమి అని పిలవకండి; నన్ను మారా అని పిలవండి[a]; ఎందుకంటే సర్వశక్తిమంతుడు నన్ను ఎంతో చేదుగా చేశాడు” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నయోమి” అనే పేరుకు “ఆహ్లాదకరమైనది” అనే భావం ఉంది; “మారా” అంటే “చేదు.”
    reason: పేర్ల మధ్యనున్న హీబ్రూ పదప్రయోగం తెలుగు పాఠకునికి స్పష్టమయ్యేందుకు.
lexical_decisions:
- source_word: וַתֹּאמֶר אֲלֵיהֶן
  choice: అప్పుడు ఆమె వారితో … అంది
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; స్త్రీలింగ బహువచన ప్రత్యయం సందర్భంలోని బేత్లెహేము స్త్రీలను సూచిస్తుంది. తెలుగులో సహజమైన ప్రత్యక్ష వాక్య నిర్మాణం కోసం ‘వారితో … అంది’ వాడబడింది.
- source_word: אַל תִּקְרֶאנָה לִי נָעֳמִי
  choice: నన్ను నయోమి అని పిలవకండి
  rationale: קרא ఇక్కడ ఒకరిని ఒక పేరుతో పిలవడం అనే అర్థంలో ఉంది. స్త్రీలింగ బహువచన నిషేధ ఆజ్ఞను తెలుగు గౌరవ/బహువచన రూపం ‘పిలవకండి’ సహజంగా తెలియజేస్తుంది.
- source_word: קְרֶאןָ לִי מָרָא
  choice: నన్ను మారా అని పిలవండి
  rationale: ముందటి ఆజ్ఞతో ఉన్న వాక్యసామ్యాన్ని నిలుపుతూ పేర్ల మధ్య వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది. מָרָא వ్యక్తిపేరుగా లిప్యంతరీకరించబడింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: పేరు మార్చమన్న అభ్యర్థనకు కారణాన్ని పరిచయం చేసే వివరణాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הֵמַר … לִי מְאֹד
  choice: నన్ను ఎంతో చేదుగా చేశాడు
  rationale: מרר హిఫీల్ రూపంలోని ‘చేదుగా చేయు/తీవ్రంగా చేదు అనుభవానికి గురిచేయు’ భావాన్ని నేరుగా ప్రతిబింబించి, ‘మారా’ అనే పేరుతో ఉన్న పదప్రయోగాన్ని కాపాడుతుంది.
- source_word: שַׁדַּי
  choice: సర్వశక్తిమంతుడు
  rationale: దైవ బిరుదును లిప్యంతరీకరించకుండా దాని సంప్రదాయబద్ధమైన, అర్థస్పష్టమైన తెలుగు సమానార్థకంతో అనువదించింది.
theological_decisions:
- issue: שַׁדַּי అనే దైవ బిరుదు అనువాదం
  choice: సర్వశక్తిమంతుడు
  alternative: షద్దయి
  rationale: ఇది వ్యక్తిపేరుగా కాక దైవ బిరుదుగా పనిచేస్తుంది. అర్థాన్ని పాఠకునికి నేరుగా అందించేందుకు బిరుదును అనువదించాం; మూలంలోని భావపరిధి గురించి అదనపు సిద్ధాంతార్థాన్ని చేర్చలేదు.
- issue: నయోమి తన అనుభవాన్ని దేవుని క్రియగా వర్ణించడం
  choice: సర్వశక్తిమంతుడు నన్ను ఎంతో చేదుగా చేశాడు
  alternative: సర్వశక్తిమంతుడు నాతో ఎంతో కఠినంగా వ్యవహరించాడు
  rationale: నయోమి పలికిన ధార్మిక ఉద్వేగాన్ని మెత్తబరచకుండా, దేవునికే క్రియను ఆపాదించే మూల వాక్యాన్ని నిలిపాం. అలాగే מרר మరియు מָרָא మధ్యనున్న ‘చేదు’ పదసంబంధాన్ని సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ప్రత్యక్ష సంభాషణలో బహువచన సంబోధనను ‘పిలవకండి/పిలవండి’తో తెలిపాం. ‘చేదుగా చేశాడు’ కొద్దిగా ఘాటైన రూపమే అయినా, మూలంలోని పదప్రయోగం మరియు నయోమి వాక్యంలోని ధార్మిక ఉద్వేగాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది.
