  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ/לָהֵ֣ן תְּשַׂבֵּ֗רְנָה עַ֚ד אֲשֶׁ֣ר יִגְדָּ֔לוּ הֲ/לָהֵן֙ תֵּֽעָגֵ֔נָה לְ/בִלְתִּ֖י הֱי֣וֹת לְ/אִ֑ישׁ אַ֣ל בְּנֹתַ֗/י כִּֽי מַר לִ֤/י מְאֹד֙ מִ/כֶּ֔ם כִּֽי יָצְאָ֥ה בִ֖/י יַד יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/013.yaml
  text: Would you wait for them until they were grown? Would you refrain from belonging to a man for them? No[a], my daughters, for it is much more bitter for me than for you, because the hand of Yahweh has gone out against me.
translation:
  language: te
  text: వారు పెద్దవారయ్యే వరకు మీరు వారి కోసం ఎదురుచూస్తారా? వారి కోసమే మీరు పెళ్లి చేసుకోకుండా ఉండిపోతారా? కాదు,[a] నా కుమార్తెలారా! ఎందుకంటే నా పరిస్థితి మీకంటే ఎంతో చేదుగా ఉంది; యాహ్వే చెయ్యి నాకు విరోధంగా బయలుదేరింది.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి కోసం మీరు ఒక పురుషునికి చెందకుండా ఉండిపోతారా?” ఇక్కడి హీబ్రూ క్రియ అరుదైనది; భవిష్యత్తు భర్తల కోసం ఎదురుచూస్తూ పెళ్లి చేసుకోకుండా ఉండడాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׂבֵּרְנָה
  choice: ఎదురుచూస్తారా
  rationale: שׂבר ఇక్కడ ఆశతో నిరీక్షించడం లేదా ఎదురుచూడడం అనే భావాన్ని ఇస్తుంది. ఊహాత్మక కుమారులు పెరిగేవరకు వేచి ఉండడమే సందర్భంలోని ఆచరణాత్మక భావం.
- source_word: עַד אֲשֶׁר יִגְדָּלוּ
  choice: వారు పెద్దవారయ్యే వరకు
  rationale: ఆ ఊహాత్మక కుమారులు వివాహయోగ్య వయస్సుకు చేరే వరకు అనే కాలసంబంధ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תֵּעָגֵנָה ... לְבִלְתִּי הֱיוֹת לְאִישׁ
  choice: పెళ్లి చేసుకోకుండా ఉండిపోతారా
  rationale: అరుదైన עגן క్రియను వెంట వచ్చే ‘ఒక పురుషునికి చెందకుండా’ అనే పదబంధం వివరిస్తుంది. సందర్భంలో భావం భవిష్యత్తు భర్తల కోసం వివాహం చేసుకోకుండా ఉండడమే; తెలుగు అనువాదం ఆ భావాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: אַל בְּנֹתַי
  choice: వద్దు, నా కుమార్తెలారా!
  rationale: אַל ఇక్కడ నేరుగా నిషేధం కంటే నయోమి భావోద్వేగంతో తిరస్కరించడాన్ని సూచిస్తుంది. ‘వద్దు’ ఆ సంభాషణాత్మక బలాన్ని నిలుపుతుంది.
- source_word: כִּי מַר לִי מְאֹד מִכֶּם
  choice: మీకంటే నాకు కలిగిన చేదు చాలా ఎక్కువగా ఉంది
  rationale: מִכֶּם లోని తులనాత్మక భావాన్ని ‘మీకంటే’ అని స్పష్టంగా ఉంచి, నయోమి తన పరిస్థితిని చేదుగా వర్ణించిన రూపకాన్ని కాపాడుతుంది.
- source_word: יָצְאָה בִי יַד יְהוָה
  choice: యెహోవా చెయ్యి నాకు విరోధంగా చాచబడింది
  rationale: దైవిక చర్య ద్వారా తనకు బాధ కలిగిందని నయోమి చెప్పే హీబ్రూ రూపకాన్ని నిలుపుతూ, בִי లోని విరోధార్థాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో అందించింది.
theological_decisions:
- issue: నయోమి బాధలో దేవుని చర్యను ఎలా వ్యక్తం చేయాలి
  choice: యెహోవా చెయ్యి నాకు విరోధంగా చాచబడింది
  alternative: యెహోవా నాకు విరోధంగా మారాడు
  rationale: మూలంలో నయోమి తన శ్రమను యెహోవా చెయ్యి చేసిన చర్యగా నేరుగా పేర్కొంటుంది. దానిని మృదువుపరచకుండా, దేవుని స్వభావం గురించి అదనపు తీర్మానం చేయకుండా మూలంలోని వేదాంత ఉద్రిక్తతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి. నయోమి వేసే రెండు అలంకారప్రశ్నల బలం, ‘చేదు’ మరియు ‘యెహోవా చెయ్యి’ అనే హీబ్రూ రూపకాలు నిలుపబడ్డాయి.
