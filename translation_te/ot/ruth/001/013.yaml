  to: వారు పెద్దవారయ్యే వరకు మీరు వారి కోసం ఎదురుచూస్తారా? వారి కోసమే మీరు పెళ్లి చేసుకోకుండా ఉండిపోతారా? కాదు,[a] నా కుమార్తెలారా! ఎందుకంటే నా పరిస్థితి మీకంటే ఎంతో చేదుగా ఉంది; యాహ్వే చెయ్యి నాకు విరోధంగా బయలుదేరింది.”
