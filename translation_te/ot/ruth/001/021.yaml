id: RUT.1.21
reference: Ruth 1:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֲנִי֙ מְלֵאָ֣ה הָלַ֔כְתִּי וְ/רֵיקָ֖ם הֱשִׁיבַ֣/נִי יְהוָ֑ה לָ֣/מָּה תִקְרֶ֤אנָה לִ/י֙ נָעֳמִ֔י וַֽ/יהוָה֙ עָ֣נָה בִ֔/י וְ/שַׁדַּ֖י הֵ֥רַֽע לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/021.yaml
  text: I went away full[a], but Yahweh has brought me back empty. Why do you call me Naomi[b], when Yahweh has testified against me and the Almighty has brought calamity on me?
translation:
  language: te
  text: నేను నిండుగా వెళ్లాను; కానీ యెహోవా నన్ను ఖాళీగా తిరిగి తీసుకొచ్చాడు. యెహోవా నాకు విరోధంగా సాక్ష్యమిచ్చాడు[a], సర్వశక్తిమంతుడు నాకు విపత్తు కలిగించాడు[b] గనుక, మీరు నన్ను నయోమి అని ఎందుకు పిలుస్తారు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాకు విరోధంగా జవాబిచ్చాడు.’ హీబ్రూ క్రియకు ఎవరికైనా విరోధంగా జవాబివ్వడం లేదా సాక్ష్యమివ్వడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నాకు హాని చేశాడు.’ హీబ్రూ పదబంధం నయోమికి కలిగిన విపత్తు లేదా దురవస్థను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָה
  choice: నిండుగా
  rationale: నయోమి పూర్వస్థితిని తెలిపే విశేషణం; తరువాతి ‘ఖాళీగా’తో ఉన్న స్పష్టమైన వ్యతిరేకతను నిలుపుతుంది.
- source_word: הָלַכְתִּי
  choice: వెళ్లాను
  rationale: సాధారణ, సహజ తెలుగు; సందర్భంలో స్వదేశం విడిచి వెళ్లిన భావం స్పష్టంగా ఉంది.
- source_word: וְרֵיקָם
  choice: ఖాళీగా
  rationale: మూలంలోని సంక్షిప్తమైన ‘empty’ భావాన్ని, ‘నిండుగా’తో దాని వ్యతిరేకతను నిలుపుతుంది; ‘వట్టి చేతులతో’ కంటే తక్కువ వ్యాఖ్యాత్మకం.
- source_word: הֱשִׁיבַנִי
  choice: నన్ను తిరిగి తీసుకొచ్చాడు
  rationale: שוב హిఫీల్ రూపంలోని కారణార్థాన్ని, దైవిక కార్యసాధకత్వాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: לָמָּה תִקְרֶאנָה לִי נָעֳמִי
  choice: మీరు నన్ను నయోమి అని ఎందుకు పిలుస్తారు?
  rationale: బేత్లెహేము స్త్రీలను ఉద్దేశించిన బహువచన అలంకారప్రశ్నను సహజ తెలుగులో నిలుపుతుంది.
- source_word: נָעֳמִי
  choice: నయోమి
  rationale: వ్యక్తినామాన్ని లిప్యంతరీకరిస్తుంది; ‘ఆహ్లాదకరమైనది’ అనే దాని అర్థాన్ని ప్రధాన వచనంలో కలపదు.
- source_word: עָנָה בִי
  choice: నాకు విరోధంగా సాక్ష్యమిచ్చి
  rationale: ఈ నిర్మాణానికి సాధ్యమైన న్యాయస్థాన సంబంధమైన ‘వ్యతిరేకంగా సాక్ష్యమివ్వడం’ అనే భావాన్ని కాపాడుతుంది; తరువాతి విపత్తు వాక్యంతో దీనిని కలిపివేయదు.
- source_word: שַׁדַּי
  choice: సర్వశక్తిమంతుడు
  rationale: దైవబిరుదు యొక్క సాంప్రదాయిక భావానువాదం; ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: הֵרַע לִי
  choice: నా మీదికి విపత్తు రప్పించినప్పుడు
  rationale: హాని లేదా దురవస్థ కలిగించడాన్ని తెలుపుతూ, దేవుడు నైతిక చెడు చేశాడనే అనవసర భావాన్ని రానివ్వదు; అయినా దైవిక కార్యసాధకత్వాన్ని తగ్గించదు.
theological_decisions:
- issue: నయోమి బాధలో దేవుని కార్యసాధకత్వాన్ని ఎలా వ్యక్తం చేయాలి
  choice: ‘యెహోవా నాకు విరోధంగా సాక్ష్యమిచ్చి, సర్వశక్తిమంతుడు నా మీదికి విపత్తు రప్పించినప్పుడు’ అని బలమైన దైవిక కార్యసాధకత్వాన్ని నిలుపడం.
  alternative: ‘విపత్తు నా మీదికి రావడానికి అనుమతించాడు’ అని మృదువుగా చెప్పడం, లేదా עָנָהను ‘నన్ను బాధించాడు’గా అర్థం చేసుకోవడం.
  rationale: హీబ్రూ వచనం నయోమి దురవస్థను నేరుగా యెహోవా, షద్దయి కార్యంతో అనుసంధానిస్తుంది. ఆ ధార్మిక ఉద్రిక్తతను అనువాదం తగ్గించకూడదు. అయితే הֵרַעను ‘నాకు చెడు చేశాడు’ అని కాక ‘విపత్తు రప్పించాడు’ అని చెప్పడం ద్వారా నైతిక దుష్టత్వాన్ని ఆరోపిస్తున్నట్టుగా అనిపించకుండా మూలభావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనా గౌరవప్రదమైన శైలి. ‘నిండుగా/ఖాళీగా’ అనే కఠిన వ్యతిరేకతను, నయోమి మాటల్లోని వేదనను, దేవుని కార్యంపై ఉన్న ధార్మిక ఉద్రిక్తతను నిలుపుకుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన వచనంలో చేర్చబడ్డాయి.
