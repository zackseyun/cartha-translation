revisions:
- from: నేను నిండుగా వెళ్లాను; కానీ యెహోవా నన్ను ఖాళీగా తిరిగి తీసుకొచ్చాడు. యెహోవా నాకు విరోధంగా సాక్ష్యమిచ్చి[a], సర్వశక్తిమంతుడు నా మీదికి విపత్తు రప్పించినప్పుడు[b], మీరు నన్ను నయోమి అని ఎందుకు పిలుస్తారు?
  to: నేను నిండుగా వెళ్లాను; కానీ యెహోవా నన్ను ఖాళీగా తిరిగి తీసుకొచ్చాడు. యెహోవా నాకు విరోధంగా సాక్ష్యమిచ్చాడు[a], సర్వశక్తిమంతుడు నాకు విపత్తు కలిగించాడు[b] గనుక, మీరు నన్ను నయోమి అని ఎందుకు పిలుస్తారు?
  rationale: 'సవరణ మూలంలోని వాక్యనిర్మాణాన్ని మరింత దగ్గరగా అనుసరిస్తుంది: యెహోవా సాక్ష్యమిచ్చాడని, సర్వశక్తిమంతుడు విపత్తు కలిగించాడని నయోమి చెప్పిన రెండు ప్రకటనలు ఆమెను ‘నయోమి’ అని పిలవడంపై వేసిన ప్రశ్నకు కారణంగా నిలుస్తాయి. దైవిక కార్యసాధకత్వాన్ని మృదువుపరచకుండా, హాని భావాన్ని ‘విపత్తు’గా సహజ తెలుగులో వ్యక్తం చేసింది.'
