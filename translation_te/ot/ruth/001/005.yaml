id: RUT.1.5
reference: Ruth 1:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּמ֥וּתוּ גַם שְׁנֵי/הֶ֖ם מַחְל֣וֹן וְ/כִלְי֑וֹן וַ/תִּשָּׁאֵר֙ הָֽ/אִשָּׁ֔ה מִ/שְּׁנֵ֥י יְלָדֶ֖י/הָ וּ/מֵ/אִישָֽׁ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/005.yaml
  text: Then both of them also died[a], Mahlon and Chilion, and the woman was left without her two children and without her husband.
translation:
  language: te
  text: ఆ తరువాత వారిద్దరూ కూడా—మహ్లోను, కిల్యోను—చనిపోయారు. ఆ స్త్రీ తన ఇద్దరు పిల్లలనూ[a], తన భర్తనూ కోల్పోయి మిగిలిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తన ఇద్దరు కుమారులనూ.’ హీబ్రూ మూలంలో ‘పిల్లలు’ లేదా మరింత సాధారణంగా ‘సంతానం’ అని అర్థమిచ్చే పదం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמ֥וּתוּ
  choice: ఆ తరువాత ... చనిపోయారు
  rationale: మూలంలోని wayyiqtol కథనాన్ని ముందుకు నడిపించే తదుపరి సంఘటనను సూచిస్తుంది. ఆధునిక తెలుగు కథనశైలిలో ‘ఆ తరువాత ... చనిపోయారు’ సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: גַם שְׁנֵיהֶם
  choice: వారిద్దరూ కూడా
  rationale: שְׁנֵיהֶם ఇద్దరినీ కలిపి స్పష్టంగా సూచిస్తుంది; גַם మునుపటి మరణానికి అదనంగా వీరి మరణమూ జరిగిందనే భావాన్ని ఇస్తుంది.
- source_word: מַחְלוֹן וְכִלְיוֹן
  choice: మహ్లోను, కిల్యోను
  rationale: వ్యక్తుల పేర్లను ఆధునిక ప్రామాణిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וַתִּשָּׁאֵר
  choice: కోల్పోయి మిగిలిపోయింది
  rationale: שׁאר ఇక్కడ మరణించిన కుటుంబసభ్యులు లేకుండా ఆమె మిగిలిన స్థితిని సూచిస్తుంది. ‘మిగిలిపోయింది’ ఆ స్థితిని, ‘కోల్పోయి’ מִן తో వ్యక్తమైన వియోగాన్ని సహజమైన తెలుగులో తెలియజేస్తాయి.
- source_word: הָאִשָּׁה
  choice: ఆ స్త్రీ
  rationale: మూలం నయోమి పేరును మళ్లీ ఉపయోగించకుండా ‘ఆ స్త్రీ’ అని చెబుతుంది; అనువాదం అదే కథనపదాన్ని నిలుపుతుంది.
- source_word: מִשְּׁנֵי יְלָדֶיהָ
  choice: తన ఇద్దరు పిల్లలనూ
  rationale: יְלָדִים సాధారణంగా పిల్లలు లేదా సంతానం అనే విస్తృత అర్థాన్ని కలిగి ఉంటుంది. సందర్భంలో వారు పెద్దవారైన కుమారులైనా, ‘పిల్లలు’ అనే పదం మూలంలోని పదప్రయోగాన్నీ తల్లి దృష్టికోణాన్నీ నిలుపుతుంది.
- source_word: וּמֵאִישָׁהּ
  choice: తన భర్తనూ
  rationale: స్వామ్య ప్రత్యయంతో ఉన్న אִישׁ ఇక్కడ ‘భర్త’ అనే సంబంధార్థాన్ని ఇస్తుంది. పునరుక్తమైన מִן తెలిపే వియోగం తెలుగులో ‘కోల్పోయి’ అనే క్రియతో సహజంగా వ్యక్తమవుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. మూలంలోని ‘ఆ స్త్రీ’ అనే నిర్దిష్ట కథనపదాన్ని నిలిపి, వాక్యాంతంలోని వియోగ భావాన్ని తెలుగులో సహజంగా వ్యక్తపరచడానికి ‘కోల్పోయి మిగిలిపోయింది’ అని అనువదించాం.
