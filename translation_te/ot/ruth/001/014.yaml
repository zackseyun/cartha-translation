  text: Then they lifted up their voices and wept again. Orpah kissed her mother-in-law[a], but Ruth clung to her.
translation:
  language: te
  text: అప్పుడు వారు మళ్లీ బిగ్గరగా ఏడ్చారు. ఓర్పా తన అత్తను ముద్దుపెట్టుకుంది; అయితే రూతు ఆమెను అంటిపెట్టుకొని ఉండిపోయింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు రూతు ఆమెను అంటిపెట్టుకొని ఉండిపోయింది.” హీబ్రూ సంధిని సాధారణంగా “మరియు” అని కూడా అర్థం చేసుకోవచ్చు; అయితే ఓర్పా ముద్దుపెట్టుకోవడం మరియు రూతు నయోమిని విడువకుండా ఉండిపోవడం మధ్య వ్యత్యాసాన్ని సందర్భం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשֶּׂנָה קוֹלָן וַתִּבְכֶּינָה
  choice: వారు బిగ్గరగా ఏడ్చారు
  rationale: ‘తమ స్వరాన్ని ఎత్తి ఏడ్చారు’ అనే హీబ్రూ విలాప నుడికారాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా, వినిపించేలా ఏడ్చారనే భావంతో వ్యక్తం చేస్తుంది.
- source_word: עוֹד
  choice: మళ్లీ
  rationale: మునుపటి ఏడుపు తరువాత చర్య పునరావృతమైందని సందర్భం సూచిస్తుంది.
- source_word: וַתִּשַּׁק
  choice: ముద్దుపెట్టుకుంది
  rationale: మూల క్రియ యొక్క సూటి అర్థాన్ని సహజమైన తెలుగు రూపంలో ఇస్తుంది.
- source_word: לַחֲמוֹתָהּ
  choice: తన అత్తను
  rationale: חמות అనేది ప్రత్యేకంగా అత్తను, అంటే భర్త తల్లిని, సూచిస్తుంది; తెలుగు సందర్భంలో ‘తన అత్తను’ సహజంగా ఉంది.
- source_word: דָּבְקָה בָּהּ
  choice: ఆమెను అంటిపెట్టుకొని ఉండిపోయింది
  rationale: דבק లోని గట్టి అనుబంధం, విడువకుండా ఉండడం అనే భావాలను తెలియజేస్తూ, కేవలం శారీరకంగా పట్టుకోవడానికే పరిమితం చేయదు.
- source_word: וְ
  choice: అయితే
  rationale: సంధి అక్షరార్థంగా ‘మరియు’ కావచ్చు; అయితే ఓర్పా చర్యకు రూతు విడువకుండా ఉండడాన్ని సందర్భం వ్యతిరేకంగా నిలుపుతుంది.
- source_word: עָרְפָּה
  choice: ఓర్పా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సాధారణంగా గుర్తించదగిన రూపంలో లిప్యంతరీకరించింది.
- source_word: רוּת
  choice: రూతు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో లిప్యంతరీకరించింది.
theological_decisions:
- issue: ఓర్పా చర్యకు రూతు చర్యతో ఉన్న సంబంధం
  choice: ‘అయితే’ అని వ్యతిరేక భావంతో అనువదించడం
  alternative: ‘మరియు’ అని సాధారణ సంధిగా అనువదించడం
  rationale: హీబ్రూ וְ సాధారణంగా ‘మరియు’ అయినప్పటికీ, ఈ సందర్భంలో ఓర్పా ముద్దుపెట్టుకోవడం మరియు రూతు అంటిపెట్టుకొని ఉండిపోవడం మధ్య కథనాత్మక వ్యత్యాసం ఉంది. ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. హీబ్రూ విలాప నుడికారాన్ని పదశః కాకుండా సహజమైన ‘బిగ్గరగా ఏడ్చారు’గా ఇచ్చి, דבק యొక్క కొనసాగుతున్న అనుబంధ భావాన్ని ‘అంటిపెట్టుకొని ఉండిపోయింది’తో నిలిపాం.
