source:
  edition: WLC
  text: שֹׁ֤בְנָה בְנֹתַ/י֙ לֵ֔כְןָ כִּ֥י זָקַ֖נְתִּי מִ/הְי֣וֹת לְ/אִ֑ישׁ כִּ֤י אָמַ֨רְתִּי֙ יֶשׁ לִ֣/י תִקְוָ֔ה גַּ֣ם הָיִ֤יתִי הַ/לַּ֨יְלָה֙ לְ/אִ֔ישׁ וְ/גַ֖ם יָלַ֥דְתִּי בָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/012.yaml
  text: Turn back[a], my daughters; go on, for I am too old to belong to a husband. Even if I were to say[b], ‘There is still hope for me’—even if I were with a husband tonight and even bore sons—
translation:
  language: te
  text: నా కుమార్తెలారా, వెనక్కి తిరిగి వెళ్లండి; నేను భర్తను పొందేంత వయసులో లేను. ఒకవేళ నేను, ‘నాకు ఇంకా ఆశ ఉంది’ అని చెప్పినా[a]—ఈ రాత్రే నాకు భర్త ఉన్నా, కుమారులను కన్నా—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒకవేళ నేను, ‘నాకు ఆశ ఉంది’ అని చెప్పినా.” ఇక్కడి హీబ్రూ వరుస ఊహాత్మక పరిస్థితులను ప్రతిపాదిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁבְנָה ... לֵכְןָ
  choice: వెనక్కి తిరిగి వెళ్లండి
  rationale: రెండు స్త్రీలింగ బహువచన ఆజ్ఞలను తెలుగులో సహజమైన ఒక దిశాత్మక ఆజ్ఞగా వ్యక్తం చేస్తుంది; నయోమి వారిని తమ దారిలో వెనక్కి వెళ్లమని కోరుతున్న సందర్భాన్ని నిలుపుతుంది.
- source_word: בְנֹתַי
  choice: నా కుమార్తెలారా
  rationale: కోడళ్లపట్ల నయోమి చూపే కుటుంబ అనుబంధం, ఆప్యాయత రెండింటినీ గౌరవప్రదంగా నిలుపుతుంది.
- source_word: זָקַנְתִּי מִהְיוֹת לְאִישׁ
  choice: నేను మళ్లీ పెళ్లి చేసుకునేంత వయసులో లేను
  rationale: హీబ్రూ వాక్యబంధం అక్షరార్థంగా ‘ఒక పురుషునికి/భర్తకు చెందే స్థితిలో ఉండడం’ అని ఉన్నా, సందర్భంలో ఉద్దేశం భర్తను పొందడం లేదా తిరిగి వివాహం చేసుకోవడం. తెలుగు సహజత్వం కోసం భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: כִּי אָמַרְתִּי
  choice: ఒకవేళ నేను ... అని అనుకున్నా
  rationale: ఇది కారణవాచకం కంటే ఊహాత్మక షరతుల పరంపరను ప్రారంభిస్తుంది. ‘అనుకున్నా’ అనేది స్వయంగా తన పరిస్థితి గురించి చెప్పుకోవడాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: יֶשׁ לִי תִקְוָה
  choice: నాకు ఇంకా ఆశ ఉంది
  rationale: హీబ్రూ అస్తిత్వ నిర్మాణాన్ని సహజ తెలుగులో అందిస్తూ, అసంభవంగా కనిపించే అవకాశమూ మిగిలి ఉందనే వాక్యబలాన్ని ‘ఇంకా’ తెలియజేస్తుంది.
- source_word: גַּם הָיִיתִי הַלַּיְלָה לְאִישׁ
  choice: ఈ రాత్రే నాకు భర్త కలిగి
  rationale: తక్షణమే భర్త ఉండే ఊహాత్మక పరిస్థితిని వ్యక్తం చేస్తుంది; హీబ్రూలో స్పష్టంగా లేని వివాహ కర్మ వివరాన్ని చేర్చదు.
- source_word: וְגַם יָלַדְתִּי בָנִים
  choice: కుమారులను కన్నా
  rationale: יַלד యొక్క ప్రసవార్థాన్నీ, בָנִים లోని పురుషలింగ నిర్దిష్టతనూ సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: కుటుంబ వంశ కొనసాగింపు సందర్భంలో సంతానానికి పురుషలింగ పదం
  choice: కుమారులు
  alternative: పిల్లలు
  rationale: మూలంలో בָנִים అని నిర్దిష్టంగా ‘కుమారులు’ ఉంది; తరువాతి వచనంలోని వివాహం మరియు కుటుంబ కొనసాగింపు వాదనకు ఇదే అవసరం. అందువల్ల లింగాన్ని తటస్థీకరించలేదు.
- issue: నయోమి ప్రతిపాదించే ఊహాత్మక షరతుల పరంపర
  choice: ‘ఒకవేళ ... అనుకున్నా— ... కలిగి, ... కన్నా—’ అనే అసంపూర్ణ పరంపర
  alternative: ప్రతి షరతును స్వతంత్ర సంపూర్ణ వాక్యంగా మార్చడం
  rationale: మూల వాక్యం తరువాతి వచనంలో పూర్తయ్యే దీర్ఘ ఊహాత్మక ప్రశ్నలో భాగం. ఈ వచనం చివర ఉన్న ఉద్రిక్తతను, వ్యాకరణ అసంపూర్ణతను అనవసరంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆప్యాయమైనా గౌరవప్రదమైన సంబోధన. మూలంలోని ఊహాత్మక పరంపర మరియు తరువాతి వచనంలో పూర్తయ్యే వాక్య నిర్మాణాన్ని చివరి దీర్ఘ విరామచిహ్నంతో నిలిపాం. ‘మళ్లీ’ అనేది నయోమి విధవరాలు అనే తక్షణ సందర్భాన్ని సహజంగా వ్యక్తం చేసే సందర్భసిద్ధ పదం.
