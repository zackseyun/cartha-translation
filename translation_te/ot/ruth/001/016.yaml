  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר רוּת֙ אַל תִּפְגְּעִי בִ֔/י לְ/עָזְבֵ֖/ךְ לָ/שׁ֣וּב מֵ/אַחֲרָ֑יִ/ךְ כִּ֠י אֶל אֲשֶׁ֨ר תֵּלְכִ֜י אֵלֵ֗ךְ וּ/בַ/אֲשֶׁ֤ר תָּלִ֨ינִי֙ אָלִ֔ין עַמֵּ֣/ךְ עַמִּ֔/י וֵ/אלֹהַ֖יִ/ךְ אֱלֹהָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/016.yaml
  text: But Ruth said[a], “Do not press me to leave you, to turn back from following after you. For where you go, I will go; and where you lodge, I will lodge. Your people will be my people[d][c][b], and your God my God.”
translation:
  language: te
  text: 'రూతు ఇలా అంది: “నిన్ను విడిచిపెట్టి, నీ వెంట రావడం మానుకొని వెనక్కి తిరిగి వెళ్లమని నన్ను ఒత్తిడి చేయకు[a][b]. నువ్వు ఎక్కడికి వెళ్తే అక్కడికి నేనూ వస్తాను; నువ్వు ఎక్కడ రాత్రి బస చేస్తే అక్కడ నేనూ రాత్రి బస చేస్తాను[c]. నీ ప్రజలే నా ప్రజలు; నీ దేవుడే నా దేవుడు[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నన్ను ఒత్తిడి చేయకు’ అనే మాటను ‘నన్ను గట్టిగా కోరకు,’ ‘నన్ను వేడుకోకు,’ లేదా ‘నన్ను వెళ్లమని పట్టుబట్టకు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో అక్షరార్థంగా ‘నీ వెనుకనుండి తిరిగి వెళ్లడానికి’ అని ఉంది; ఇది నీ వెంట రావడం మానుకొని వెనక్కి వెళ్లడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: ‘రాత్రి బస చేస్తే’ అనే మాటను ‘రాత్రి గడిపితే’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: ‘నీ ప్రజలే నా ప్రజలు; నీ దేవుడే నా దేవుడు’ అనే హెబ్రీ వాక్యాల్లో ‘ఉన్నారు/అవుతారు’ అనే క్రియ లేదు. కాబట్టి వీటిని వర్తమాన భావంతోనూ, రూతు చేసే ప్రతిజ్ఞకు తగిన భవిష్యత్ భావంతోనూ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּפְגְּעִי בִי
  choice: నన్ను పట్టుబట్టకు
  rationale: ב తో కూడిన פגע ఇక్కడ గట్టిగా కోరడం, పదేపదే ఒత్తిడి చేయడం అనే భావాన్ని ఇస్తుంది. ‘పట్టుబట్టకు’ అనేది శారీరక బలవంతం లేదా శత్రుత్వాన్ని సూచించకుండా, నయోమి తనను తిరిగి వెళ్లమని ఒత్తిడి చేయడం మానాలని రూతు కోరుతున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לְעָזְבֵךְ
  choice: నిన్ను విడిచిపెట్టి
  rationale: עזב యొక్క సాధారణ భావమైన ‘విడిచిపెట్టు’ను నిలుపుతుంది; సందర్భం అవసరం లేని మరింత భారమైన ‘త్యజించు’ వంటి పదాన్ని నివారిస్తుంది.
- source_word: לָשׁוּב מֵאַחֲרָיִךְ
  choice: నీ వెంట రావడం మానుకొని వెనక్కి తిరిగి వెళ్లమని
  rationale: שׁוב లోని వెనక్కి తిరిగే భావాన్నీ, מאחרי లోని ‘నీ వెనుక/నీ వెంట’ అనే దిశాత్మక చిత్రాన్నీ సహజమైన తెలుగులో కలిపి తెలియజేస్తుంది.
- source_word: כִּי
  choice: ప్రత్యేక సంధానపదం లేకుండా తదుపరి వాక్యంగా
  rationale: ఈ సందర్భంలో כִּי రూతు అభ్యర్థనకు కారణాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘ఎందుకంటే’ అని తప్పనిసరిగా చేర్చకుండా, వెంటనే వచ్చే ప్రతిజ్ఞలే ఆ కారణాన్ని సహజంగా స్పష్టం చేస్తాయి.
- source_word: אֶל אֲשֶׁר תֵּלְכִי אֵלֵךְ
  choice: నువ్వు ఎక్కడికి వెళ్తే అక్కడికి నేనూ వస్తాను
  rationale: గమ్యాన్ని సూచించే హెబ్రీ సమాంతర నిర్మాణాన్ని తెలుగులో సహజమైన ‘ఎక్కడికి… అక్కడికి’ రూపంలో నిలుపుతుంది. రూతు నయోమితో కలిసి వెళ్తున్న సందర్భంలో ‘నేనూ వస్తాను’ సహజ తెలుగు ప్రయోగం.
- source_word: וּבַאֲשֶׁר תָּלִינִי אָלִין
  choice: నువ్వు ఎక్కడ రాత్రి బస చేస్తే అక్కడ నేనూ రాత్రి బస చేస్తాను
  rationale: לון సాధారణంగా రాత్రి గడపడం లేదా రాత్రి బస చేయడాన్ని సూచిస్తుంది. ‘రాత్రి బస’ మూలంలోని నిర్దిష్ట భావాన్నీ, వాక్య సమాంతరతనూ కాపాడుతుంది.
- source_word: עַמֵּךְ עַמִּי
  choice: నీ ప్రజలే నా ప్రజలు
  rationale: మూలంలో క్రియలేని సంక్షిప్త వాక్యాన్ని తెలుగులోనూ క్రియ లేకుండా సహజంగా నిలుపుతుంది. ‘ఏ’ నిశ్చయార్థకం రూతు యొక్క దృఢమైన అనుబంధ ప్రకటనను తెలియజేస్తుంది; కాలాన్ని అనవసరంగా నిర్ణయించదు.
- source_word: וֵאלֹהַיִךְ אֱלֹהָי
  choice: నీ దేవుడే నా దేవుడు
  rationale: మూలంలోని క్రియలేని, జ్ఞాపకంలో నిలిచే సంక్షిప్త ప్రకటనను తెలుగులో సహజంగా నిలుపుతుంది. ఏకవచన రూపం మరియు సందర్భం ప్రకారం ‘దేవుడు’ అని అనువదించబడింది.
theological_decisions:
- issue: ప్రజలు మరియు దేవునితో గుర్తింపును తెలిపే క్రియలేని రెండు హెబ్రీ వాక్యాల అనువాదం
  choice: రెండింటినీ ‘నీ ప్రజలే నా ప్రజలు; నీ దేవుడే నా దేవుడు’ అని క్రియలేని వర్తమాన-భవిష్యత్ నిర్దిష్టత లేని రూపంలో ఉంచడం
  alternative: ‘నీ ప్రజలు నా ప్రజలవుతారు; నీ దేవుడు నా దేవుడవుతాడు’ అని భవిష్యత్ కాలాన్ని చేర్చడం
  rationale: హెబ్రీలో రెండు వాక్యాల్లోనూ సంధానక్రియ లేదు. తెలుగు కూడా అటువంటి క్రియలేని నామవాక్యాలను సహజంగా అనుమతిస్తుంది. అందువల్ల వర్తమానమా భవిష్యత్తా అని నిర్ణయించకుండా మూలంలోని ఉద్దేశపూర్వక కాల అస్పష్టతను, ప్రతిజ్ఞాత్మక బలాన్ని రెండింటినీ నిలుపవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ప్రత్యక్ష సంభాషణ. రూతు–నయోమి మధ్య సన్నిహిత సంబంధానికి అనుగుణంగా ఏకవచన ‘నువ్వు/నీ’ రూపాలు వాడబడ్డాయి. మూలంలోని సమాంతరత, సంక్షిప్తత, ప్రతిజ్ఞాత్మక స్వరం కాపాడబడ్డాయి.
