base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/022.yaml
  text: So Naomi returned[a], and Ruth the Moabite, her daughter-in-law, with her, who returned from the fields of Moab. And they came to Bethlehem at the beginning of the barley harvest.
translation:
  language: te
  text: ఈ విధంగా నయోమి తిరిగి వచ్చింది. ఆమె కోడలైన మోయాబీయురాలు రూతు ఆమెతో పాటు మోయాబు పొలాల నుంచి[a] తిరిగి వచ్చింది. వారు యవల కోత ప్రారంభంలో బేత్లెహేముకు చేరుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, భావానుసారంగా: ‘మోయాబు దేశం నుంచి.’ హీబ్రూ మూలంలో అక్షరార్థంగా ‘మోయాబు పొలాల నుంచి’ అని ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשָׁב
  choice: తిరిగి వచ్చింది
  rationale: שׁוב అనే క్రియ తిరిగి రావడాన్ని సూచిస్తుంది. కథన సందర్భంలో నయోమి బేత్లెహేముకు తిరిగి రావడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַמּוֹאֲבִיָּה
  choice: మోయాబీయురాలు
  rationale: ఇది స్త్రీలింగ జాతివాచక విశేషణం; రూతు మోయాబు జాతికి చెందినదనే కథన ప్రాధాన్యాన్ని నిలుపుతుంది.
- source_word: כַלָּתָהּ
  choice: ఆమె కోడలు
  rationale: ప్రామాణిక బంధుత్వ పదానికి ఆధునిక తెలుగులో నేరమైన, సహజమైన సమానం.
- source_word: הַשָּׁבָה
  choice: రూతు కూడా ... తిరిగి వచ్చింది
  rationale: స్త్రీలింగ ఏకవచన కృదంతం సమీపంలోని రూతును సూచిస్తున్నట్లు వాక్య నిర్మాణంలో స్పష్టం చేసి, ఆమె తిరిగి వచ్చినదనే గుర్తింపును నిలిపింది.
- source_word: מִשְּׂדֵי מוֹאָב
  choice: మోయాబు పొలాల నుంచి
  rationale: שָׂדֶה పదంలోని ‘పొలం’ అనే మౌలిక చిత్రాన్ని నిలుపుతుంది; సందర్భానుసారం ఇది విస్తృతంగా దేశం లేదా ప్రాంతాన్ని కూడా సూచించవచ్చు.
- source_word: בֵּית לֶחֶם
  choice: బేత్లెహేము
  rationale: స్థలనామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: בִּתְחִלַּת קְצִיר שְׂעֹרִים
  choice: యవల కోత ప్రారంభంలో
  rationale: కాల సూచనను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తూ యవల కోతకాల ఆరంభాన్ని కాపాడుతుంది.
