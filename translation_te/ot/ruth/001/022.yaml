translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని పొడవైన అన్వయాన్ని స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; రూతు ‘తిరిగి వచ్చింది’ అనే కృదంత భావాన్ని విడిచిపెట్టలేదు. ‘యవలు’ అనే సాధారణ తెలుగు ధాన్యపదాన్ని ఉపయోగించాం.
