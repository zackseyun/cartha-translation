  to: ఈ విధంగా నయోమి తిరిగి వచ్చింది. ఆమె కోడలైన మోయాబీయురాలు రూతు ఆమెతో పాటు మోయాబు పొలాల నుంచి[a] తిరిగి వచ్చింది. వారు యవల కోత ప్రారంభంలో బేత్లెహేముకు చేరుకున్నారు.
