  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/ימֵי֙ שְׁפֹ֣ט הַ/שֹּׁפְטִ֔ים וַ/יְהִ֥י רָעָ֖ב בָּ/אָ֑רֶץ וַ/יֵּ֨לֶךְ אִ֜ישׁ מִ/בֵּ֧ית לֶ֣חֶם יְהוּדָ֗ה לָ/גוּר֙ בִּ/שְׂדֵ֣י מוֹאָ֔ב ה֥וּא וְ/אִשְׁתּ֖/וֹ וּ/שְׁנֵ֥י בָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/001.yaml
  text: It happened in the days when the judges judged that there was a famine in the land[c][b][a], and a man went from Bethlehem of Judah to sojourn in the fields of Moab—he and his wife and his two sons.
translation:
  language: te
  text: న్యాయాధిపతులు న్యాయం తీర్చిన కాలంలో[a], దేశంలో కరవు వచ్చింది. అప్పుడు యూదాలోని బేత్లెహేము నుండి ఒక మనిషి మోయాబు పొలాల్లో[b] కొంతకాలం పరదేశిగా నివసించడానికి[c] వెళ్లాడు—అతనితోపాటు అతని భార్య, ఇద్దరు కుమారులు వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “న్యాయాధిపతులు పాలించిన కాలంలో.” హీబ్రూలో “న్యాయాధిపతులు న్యాయం తీర్చినప్పుడు” అని ఒకే మూలపదం పునరుక్తమవుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మోయాబు ప్రాంతంలో.” అక్షరార్థంగా, “మోయాబు పొలాల్లో.”
    reason: lexical_alternative
  - marker: c
    text: ఈ మాట తాను అక్కడివాడు కాకపోయినా, సాధారణంగా కొంతకాలం మాత్రమే నివసించడాన్ని సూచిస్తుంది; శాశ్వతంగా స్థిరపడటాన్ని తప్పనిసరిగా సూచించదు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: వచ్చింది / అప్పుడు
  rationale: మొదటి వాక్యంలో కథనారంభాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలిపేందుకు ‘కరవు వచ్చింది’ అని, తదుపరి సంఘటనను కలపడానికి ‘అప్పుడు’ అని అనువదించాం; మూలంలో లేని ప్రత్యేక ‘ఇప్పుడు’ భావాన్ని చేర్చలేదు.
- source_word: בִּימֵי
  choice: కాలంలో
  rationale: ‘రోజుల్లో’ అనే అక్షరార్థం కంటే కాలవ్యవధిని సూచించే ఆధునిక సహజ తెలుగు రూపం.
- source_word: שְׁפֹט הַשֹּׁפְטִים
  choice: న్యాయాధిపతులు న్యాయం తీర్చిన
  rationale: హీబ్రూలో ఒకే ధాతువు పునరుక్తిని సాధ్యమైనంతవరకు నిలుపుతూ, వారి న్యాయనిర్వహణ/పాలనా పాత్రను ముందుగానే సంకుచితం చేయకుండా ఉంచుతుంది.
- source_word: רָעָב
  choice: కరవు
  rationale: ప్రాంతాన్ని ప్రభావితం చేసే తీవ్రమైన ఆహార కొరతకు సహజమైన తెలుగు పదం.
- source_word: בָּאָרֶץ
  choice: దేశంలో
  rationale: సందర్భంలోని భూభాగాన్ని సూచించే సహజ తెలుగు రూపం; నిర్దిష్టంగా ‘యూదా దేశం’ అని మూలం చెప్పనందున దాన్ని చేర్చలేదు.
- source_word: אִישׁ
  choice: ఒక మనిషి
  rationale: తరువాత ఎలీమెలెకుగా గుర్తించబడే పురుష వ్యక్తిని మూలానికి అనుగుణంగా సూచిస్తుంది.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: యూదా బేత్లెహేముకు చెందిన
  rationale: ఇతర బేత్లెహేముల నుంచి వేరు చేసే స్థలనామ సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לָגוּר
  choice: కొంతకాలం పరదేశిగా నివసించడానికి
  rationale: גור లోని తాత్కాలిక నివాసం మరియు బయటి వ్యక్తిగా జీవించడం అనే రెండు భావ ఛాయలనూ నిలుపుతుంది.
- source_word: בִּשְׂדֵי מוֹאָב
  choice: మోయాబు పొలాల్లో
  rationale: ‘మోయాబు ప్రాంతంలో’ అనే భావం సాధ్యమైనప్పటికీ, మూలంలోని స్పష్టమైన ‘పొలాలు’ రూపాన్ని నిలిపింది.
- source_word: הוּא וְאִשְׁתּוֹ וּשְׁנֵי בָנָיו
  choice: అతనితోపాటు అతని భార్య, ఇద్దరు కుమారులు
  rationale: కుటుంబ సభ్యుల స్పష్టమైన జాబితాను సహజ తెలుగు క్రమంలో నిలుపుతుంది.
theological_decisions:
- issue: న్యాయాధిపతుల కార్యానికి న్యాయం తీర్చడం లేదా పాలించడం అనే భావం
  choice: ప్రధాన పాఠ్యంలో ‘న్యాయం తీర్చిన’
  alternative: ‘పాలించిన’
  rationale: שׁפט ధాతువు న్యాయనిర్వహణతో పాటు నాయకత్వం/పాలనను కూడా సూచించగలదు. ప్రధాన పాఠ్యం ధాతు పునరుక్తిని ప్రతిబింబిస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచడం ద్వారా భావ పరిధిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘న్యాయాధిపతులు న్యాయం తీర్చిన’ అనే స్వల్ప పునరుక్తి మూల హీబ్రూ పదప్రయోగాన్ని ఉద్దేశపూర్వకంగా ప్రతిబింబిస్తుంది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
