source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר נָעֳמִי֙ לִ/שְׁתֵּ֣י כַלֹּתֶ֔י/הָ לֵ֣כְנָה שֹּׁ֔בְנָה אִשָּׁ֖ה לְ/בֵ֣ית אִמָּ֑/הּ יעשה יְהוָ֤ה עִמָּ/כֶם֙ חֶ֔סֶד כַּ/אֲשֶׁ֧ר עֲשִׂיתֶ֛ם עִם הַ/מֵּתִ֖ים וְ/עִמָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/008.yaml
  text: And Naomi said to her two daughters-in-law[a], “Go, return, each to her mother’s house. May Yahweh show you kindness, as you have shown it to the dead and to me.”
translation:
  language: te
  text: 'నయోమి తన ఇద్దరు కోడళ్లతో ఇలా అంది: “వెళ్లండి, తిరిగి వెళ్లండి; మీరిద్దరూ మీ మీ తల్లుల ఇళ్లకు వెళ్లండి. చనిపోయినవారి పట్ల, నా పట్ల మీరు దయ చూపించినట్లే, యాహ్వే మీ పట్ల దయ[a] చూపించుగాక.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ חֶסֶד (హెసెద్) పదానికి ‘నిబద్ధ ప్రేమ,’ ‘విశ్వసనీయ ప్రేమ,’ లేదా ‘ఒడంబడిక నిబద్ధత’ అనే భావాలు కూడా ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַלֹּתֶיהָ
  choice: తన ఇద్దరు కోడళ్లతో
  rationale: ఈ సందర్భంలో כַּלָּה అంటే కుమారుని భార్య. ఆధునిక ప్రామాణిక తెలుగులో ‘కోడలు’ సహజమైన, కచ్చితమైన పదం.
- source_word: לֵכְנָה שֹּׁבְנָה
  choice: వెళ్లండి ... తిరిగి వెళ్లండి
  rationale: రెండు ఆజ్ఞారూప క్రియలనూ నిలిపి, నయోమి వారిని గట్టిగా ప్రోత్సహిస్తున్న భావాన్ని కాపాడింది.
- source_word: אִשָּׁה לְבֵית אִמָּהּ
  choice: మీలో ప్రతి ఒక్కరూ తమ తల్లి ఇంటికి
  rationale: אִשָּׁה ఇక్కడ విభజనార్థకంగా ‘ప్రతి ఒక్కరు’ అనే భావం ఇస్తుంది. ‘తల్లి ఇల్లు’ అనే నిర్దిష్ట హీబ్రూ వ్యక్తీకరణను సాధారణ ‘పుట్టింటి’గా మార్చకుండా నిలిపింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణ Yahweh‌కు సరితూగే తెలుగు లిప్యంతరీకరణగా ఇచ్చింది.
- source_word: חֶסֶד
  choice: దయ
  rationale: ఈ ఆశీర్వాద సందర్భంలో ‘దయ’ సహజంగా అర్థమవుతుంది. పదంలోని నిబద్ధత, విశ్వసనీయ ప్రేమ అనే విస్తృత భావసూచనను పాదసూచికలో ఉంచింది.
- source_word: עֲשִׂיתֶם עִם הַמֵּתִים וְעִמָּדִי
  choice: చనిపోయినవారి పట్ల, నా పట్ల మీరు దయ చూపించినట్లే
  rationale: עשה ... חֶסֶד అనే ప్రయోగాన్ని తెలుగులో సహజమైన ‘దయ చూపించు’గా అనువదించింది; ‘చనిపోయినవారు’ అనే మూలంలోని బహువచనాన్ని నిలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతుంది. అందువల్ల బిరుదైన ‘ప్రభువు’తో భర్తీ చేయలేదు; ‘Jehovah’కు దగ్గరైన ‘యెహోవా’కన్నా Yahweh ఉచ్చారణకు అనుగుణమైన ‘యాహ్వే’ను ఎంచుకుంది.
- issue: חֶסֶד యొక్క భావపరిధి
  choice: దయ
  alternative: నిబద్ధ ప్రేమ; విశ్వసనీయ ప్రేమ; ఒడంబడిక నిబద్ధత
  rationale: రూతు, ఓర్పా తమ మరణించిన భర్తలకూ నయోమికీ చూపిన ప్రవర్తనను సూచించే ఈ సందర్భంలో ‘దయ’ సహజం. అయితే పదంలోని నిలకడైన నిబద్ధతను ఏకార్థంగా కుదించకుండా పాదసూచికలో ప్రత్యామ్నాయ భావాలను తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అదే సమయంలో గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని ‘వెళ్లండి/తిరిగి వెళ్లండి,’ ‘తల్లి ఇల్లు,’ ‘చనిపోయినవారు’ వంటి ప్రత్యేకతలు నిలిపబడ్డాయి.
