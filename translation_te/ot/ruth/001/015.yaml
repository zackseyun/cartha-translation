  yaml_path: translation/ot/ruth/001/015.yaml
  text: And she said[a], “Look, your sister-in-law has gone back to her people and to her gods[b]. Go back after your sister-in-law.”
translation:
  language: te
  text: 'అప్పుడు ఆమె ఇలా అంది: “చూడు, నీ తోడికోడలు తన ప్రజల దగ్గరకు, తన దేవుళ్ల దగ్గరకు[b] తిరిగి వెళ్లింది[a]. నీ తోడికోడలి వెనుక నువ్వూ తిరిగి వెళ్లు.”


    [a] లేదా, “తిరిగి వచ్చింది.” ఇక్కడ “తిరిగి వెళ్లింది” అని అనువదించిన హీబ్రూ క్రియనే వచనం చివర “తిరిగి వెళ్లు” అనే ఆజ్ఞలోనూ మళ్లీ ఉపయోగించారు.


    [b] మూలభాషలో “ఆమె దేవుళ్ల దగ్గరకు.” కొందరు “ఆమె దేవుని దగ్గరకు” అని అనువదిస్తారు; అయితే ఇక్కడ బహువచనం మోయాబు దేవతలను సూచించే అవకాశం ఎక్కువ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తిరిగి వచ్చింది.” ఇక్కడ “తిరిగి వెళ్లింది” అని అనువదించిన హీబ్రూ క్రియనే వచనం చివర “తిరిగి వెళ్లు” అనే ఆజ్ఞలోనూ మళ్లీ ఉపయోగించారు.
    reason: lexical_alternative
  - marker: b
    text: మూలభాషలో “ఆమె దేవుళ్ల దగ్గరకు.” కొందరు “ఆమె దేవుని దగ్గరకు” అని అనువదిస్తారు; అయితే ఇక్కడ బహువచనం మోయాబు దేవతలను సూచించే అవకాశం ఎక్కువ.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అప్పుడు ఆమె ఇలా అంది
  rationale: కథన ప్రవాహంలోని wayyiqtol రూపాన్ని సహజమైన ఆధునిక తెలుగు కథన శైలిలో వ్యక్తం చేస్తుంది; మాట్లాడేది నయోమి అని సందర్భం స్పష్టం చేస్తుంది.
- source_word: הִנֵּה
  choice: చూడు
  rationale: శ్రోత దృష్టిని ప్రస్తుత పరిస్థితిపైకి మళ్లించే సూచక అవ్యయ బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: שָׁבָה / שׁוּבִי
  choice: తిరిగి వెళ్లిపోయింది / తిరిగి వెళ్లు
  rationale: ఒకే మూలక్రియ שוב వచనంలో రెండుసార్లు రావడాన్ని తెలుగులోనూ ‘తిరిగి వెళ్లు’ అనే పునరావృతితో సాధ్యమైనంత స్పష్టంగా నిలుపుతుంది.
- source_word: יְבִמְתֵּךְ
  choice: నీ తోడికోడలు
  rationale: ఓర్పా, రూతు అన్నదమ్ముల భార్యలు కావడంతో ఈ కుటుంబ సంబంధానికి ‘తోడికోడలు’ సహజమైన, సందర్భోచితమైన తెలుగు పదం.
- source_word: אֶל עַמָּהּ
  choice: తన ప్రజల దగ్గరికి
  rationale: עַם ఇక్కడ కేవలం దగ్గరి బంధువులను కాక ఆమె జాతి-సమాజ ప్రజలను సూచిస్తుంది.
- source_word: וְאֶל אֱלֹהֶיהָ
  choice: తన దేవుళ్ల దగ్గరికి
  rationale: ప్రత్యయంతో కూడిన బహువచన రూపాన్ని, మోయాబు మతపరమైన సందర్భాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: אַחֲרֵי יְבִמְתֵּךְ
  choice: నీ తోడికోడలి వెనుక
  rationale: ఓర్పా వెళ్లిన మార్గాన్నే రూతు కూడా అనుసరించాలనే ‘వెనుక/తర్వాత’ భావాన్ని రూపకాన్ని చెరపకుండా నిలుపుతుంది.
theological_decisions:
- issue: మోయాబు ఆరాధనను సూచించే אֱלֹהֶיהָ అనువాదం
  choice: తన దేవుళ్ల దగ్గరికి
  alternative: తన దేవుని దగ్గరికి
  rationale: אֱלֹהִים కొన్ని సందర్భాల్లో ఏకవచనార్థంలో వాడబడగలిగినా, ఇక్కడ పదరూపం మరియు మోయాబు ప్రజలు-ఆరాధనల సమాంతర ప్రస్తావన బహువచన ‘దేవుళ్లు’ అనే అర్థానికే ఎక్కువ మద్దతు ఇస్తాయి. ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం మూలంలోని సాధ్యమైన సందిగ్ధతను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన ప్రత్యక్ష సంభాషణ శైలి వాడబడింది. ‘తోడికోడలు’ కుటుంబ సంబంధాన్ని సంక్షిప్తంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా తెలియజేస్తుంది. שוב పదపునరావృతిని ‘తిరిగి’ ద్వారా నిలుపుతూ, మూలంలోని ఆజ్ఞ బలాన్ని కాపాడింది.
