id: RUT.1.17
reference: Ruth 1:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בַּ/אֲשֶׁ֤ר תָּמ֨וּתִי֙ אָמ֔וּת וְ/שָׁ֖ם אֶקָּבֵ֑ר כֹּה֩ יַעֲשֶׂ֨ה יְהוָ֥ה לִ/י֙ וְ/כֹ֣ה יֹסִ֔יף כִּ֣י הַ/מָּ֔וֶת יַפְרִ֖יד בֵּינִ֥/י וּ/בֵינֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/017.yaml
  text: Where you die[a], I will die, and there I will be buried. May Yahweh do so to me, and more also[b], if anything but death separates me from you.
translation:
  language: te
  text: నీవు ఎక్కడ చనిపోతావో అక్కడ నేనూ చనిపోతాను; అక్కడే నేను సమాధి చేయబడతాను. యహ్వే నాకు ఇలా చేసి, ఇంకా ఎక్కువ చేయుగాక—మరణం తప్ప మరేదైనా నన్ను నీ నుండి వేరు చేసినట్లయితే.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “యహ్వే నాకు ఇలా చేసి, ఇంకా ఎక్కువ చేయుగాక” అనేది దైవిక తీర్పును తనమీదికి ఆహ్వానించే హీబ్రూ ప్రమాణ సూత్రం; తనకు కలగవలసిన శిక్ష ఏమిటో రూతు స్పష్టంగా చెప్పలేదు.
    reason: cultural_or_idiomatic_explanation
  - marker: b
    text: 'మరింత పదశః: “మరణం నాకూ నీకూ మధ్య వేరు చేస్తే.” హీబ్రూ ప్రమాణప్రయోగంలో దీని భావం మరణం తప్ప మరేదీ వారిని వేరు చేయకూడదని.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּאֲשֶׁר
  choice: ఎక్కడ … అక్కడ
  rationale: בְּ + אֲשֶׁר స్థలాన్ని సూచిస్తుంది. తెలుగు సహసంబంధ నిర్మాణమైన ‘ఎక్కడ … అక్కడ’ మూలంలోని స్థాన సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תָּמוּתִי / אָמוּת
  choice: నీవు … చనిపోతావో … నేనూ చనిపోతాను
  rationale: מות ధాతువు పునరుక్తి రూతు చేస్తున్న గంభీర ప్రతిజ్ఞను బలపరుస్తుంది; రెండింటినీ ఒకే సాధారణ క్రియతో అనువదించడం ఆ సమాంతరతను నిలుపుతుంది.
- source_word: וְשָׁם אֶקָּבֵר
  choice: అక్కడే నేను సమాధి చేయబడతాను
  rationale: שָׁם మునుపటి స్థలాన్నే తిరిగి సూచిస్తుంది; కాబట్టి ‘అక్కడే’ తగినది. קבר నిఫాల్ రూపంలోని కర్మణి భావాన్ని ‘సమాధి చేయబడతాను’ నిలుపుతుంది.
- source_word: כֹּה יַעֲשֶׂה יְהוָה לִי וְכֹה יֹסִיף
  choice: యహ్వే నాకు ఇలా చేసి, అంతకంటే ఎక్కువ చేయుగాక
  rationale: ఇది తనమీదికి దైవిక తీర్పును ఆహ్వానించే సంప్రదాయ హీబ్రూ ప్రమాణ సూత్రం. శిక్ష ఏమిటో మూలం చెప్పనందున అనువాదం కూడా దాన్ని నిర్దిష్టం చేయదు.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యంతరీకరించింది.
- source_word: כִּי הַמָּוֶת יַפְרִיד בֵּינִי וּבֵינֵךְ
  choice: మరణం తప్ప మరేదైనా నన్ను నీ నుంచి వేరు చేసినట్లయితే
  rationale: ప్రమాణ సందర్భంలో כִּי షరతును పరిచయం చేస్తుంది. వాక్యభావం మరణమే వారిని వేరు చేయడానికి అనుమతించబడిన ఏకైక కారణమని సూచిస్తుంది; తెలుగు రూపం ఆ ప్రమాణబలాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో సాధారణ బిరుదు కాక ఇశ్రాయేలు దేవుని వ్యక్తిగత నామం ఉంది; అందువల్ల దానిని ‘యహ్వే’గా ధ్వన్యంతరీకరించాం.
- issue: చివరి షరతులో మరణం యొక్క పాత్ర
  choice: మరణం తప్ప మరేదైనా వేరు చేస్తే
  alternative: మరణం నన్ను నీ నుంచి వేరు చేస్తే
  rationale: సందర్భం మరియు హీబ్రూ ప్రమాణ ప్రయోగం రూతు మరణాన్ని మాత్రమే విడదీయగల కారణంగా అంగీకరిస్తోందని సూచిస్తాయి. అయితే పదశః నిర్మాణం కేవలం ‘మరణం వేరు చేస్తే’ అని కూడా చదవగలదు; ఆ నిజమైన భాషాత్మక ఉద్రిక్తతను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన ప్రతిజ్ఞ స్వరాన్ని నిలిపాం. ‘చనిపోతాను’ సహజ వాడుక; ‘సమాధి చేయబడతాను’ మూలంలోని కర్మణి రూపాన్ని కాపాడుతుంది. ప్రమాణ సూత్రంలోని ఉద్దేశపూర్వక అస్పష్టతను వివరించి గాని పూరించలేదు.
