    text: మరింత నేరుగా, ‘తాను ఉన్న స్థలం నుండి బయటకు వెళ్లింది’ అని అనువదించవచ్చు. హీబ్రూ క్రియ అక్షరార్థంగా ‘బయటకు వెళ్లింది’ అని సూచిస్తుంది.
    reason: lexical_alternative
  revision_rationale: The revision retains the lexical alternative footnote and all source elements, while using ‘అప్పుడు’ for narrative progression and replacing the durative ‘ప్రయాణం సాగించారు’ with a closer simple-motion expression. The semicolon keeps the daughters-in-law’s association with Naomi’s departure clear without making their action more explicit than the Hebrew does.
