- from: కాబట్టి ఆమె తాను ఉన్న చోటు నుండి బయలుదేరింది[a]. ఆమె ఇద్దరు కోడళ్లు కూడా ఆమెతో ఉన్నారు. వారు యూదా దేశానికి తిరిగి వెళ్లడానికి దారిలో ప్రయాణం సాగించారు.
  to: అప్పుడు ఆమె తాను ఉన్న స్థలం నుండి బయలుదేరింది[a]; ఆమె ఇద్దరు కోడళ్లు ఆమెతో ఉన్నారు. వారు యూదా దేశానికి తిరిగి వెళ్లేందుకు మార్గంలో వెళ్లారు.
