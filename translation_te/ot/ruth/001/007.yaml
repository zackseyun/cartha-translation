source:
  edition: WLC
  text: וַ/תֵּצֵ֗א מִן הַ/מָּקוֹם֙ אֲשֶׁ֣ר הָיְתָה שָׁ֔מָּ/ה וּ/שְׁתֵּ֥י כַלֹּתֶ֖י/הָ עִמָּ֑/הּ וַ/תֵּלַ֣כְנָה בַ/דֶּ֔רֶךְ לָ/שׁ֖וּב אֶל אֶ֥רֶץ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/007.yaml
  text: So she went out from the place where she had been[a], and her two daughters-in-law with her, and they went on the way to return to the land of Judah.
translation:
  language: te
  text: అప్పుడు ఆమె తాను ఉన్న స్థలం నుండి బయలుదేరింది[a]; ఆమె ఇద్దరు కోడళ్లు ఆమెతో ఉన్నారు. వారు యూదా దేశానికి తిరిగి వెళ్లేందుకు మార్గంలో వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత నేరుగా, ‘తాను ఉన్న స్థలం నుండి బయటకు వెళ్లింది’ అని అనువదించవచ్చు. హీబ్రూ క్రియ అక్షరార్థంగా ‘బయటకు వెళ్లింది’ అని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: కాబట్టి ఆమె ... బయలుదేరింది
  rationale: వావ్-అనుక్రమ రూపం మునుపటి వాక్యంతో సంబంధాన్ని చూపుతూ కథను ముందుకు నడిపిస్తుంది. ‘బయలుదేరింది’ అనేది יצא సూచించే బయటకు వెళ్లే కదలికను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מִן־הַמָּקוֹם אֲשֶׁר הָיְתָה שָׁמָּה
  choice: తాను ఉన్న చోటు నుండి
  rationale: నయోమి అప్పటివరకు నివసించిన స్థలాన్ని సూచించే సంబంధవాక్యాన్ని సహజంగా, సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: וּשְׁתֵּי כַלֹּתֶיהָ עִמָּהּ
  choice: ఆమె ఇద్దరు కోడళ్లు కూడా ఆమెతో ఉన్నారు
  rationale: ఈ సందర్భంలో כַּלָּה అంటే ‘కోడలు’. ‘కూడా’ సహవాస భావాన్ని సహజంగా తెలియజేస్తుంది; ప్రత్యేక వాక్యం తెలుగు పఠనాన్ని సులభం చేస్తుంది.
- source_word: וַתֵּלַכְנָה בַדֶּרֶךְ
  choice: వారు ... దారిలో ప్రయాణం సాగించారు
  rationale: స్త్రీలింగ బహువచన క్రియ నయోమి మరియు ఆమె కోడళ్లను కలిపి సూచిస్తుంది. ‘దారిలో ప్రయాణం సాగించారు’ అనేది ప్రయాణ సందర్భాన్ని స్పష్టంగా ఉంచుతూ సహజమైన కథన భాషను ఇస్తుంది.
- source_word: לָשׁוּב
  choice: తిరిగి వెళ్లడానికి
  rationale: שׁוב యొక్క ‘తిరుగు’ భావాన్ని కాపాడుతుంది; రూతు మొదటి అధ్యాయంలో పునరావృతమయ్యే ఈ ముఖ్య పదబంధాన్ని అనవసరంగా వ్యాఖ్యానించదు.
- source_word: אֶל־אֶרֶץ יְהוּדָה
  choice: యూదా దేశానికి
  rationale: אֶרֶץ‌ను విడిచిపెట్టకుండా, ఆధునిక తెలుగులో సహజంగా యూదా భూభాగాన్ని సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘తిరుగు’ భావం మరియు యూదా ‘దేశం’ అనే స్పష్టత నిలుపబడ్డాయి.
