revisions:
- from: ఆ ఇద్దరూ బేత్లెహేముకు చేరుకునే వరకు ప్రయాణం సాగించారు. వారు బేత్లెహేముకు చేరుకున్నప్పుడు, వారిని చూసి ఊరంతా కలవరపడింది. అప్పుడు స్త్రీలు, “ఈమె నయోమి కాదా?” అని అన్నారు.
  to: ఆ ఇద్దరూ బేత్లెహేముకు చేరే వరకు వెళ్లారు. వారు బేత్లెహేముకు చేరుకున్నప్పుడు, వారి రాకతో ఊరంతా కలవరపడింది. స్త్రీలు, “ఈమె నయోమినా?” అని అన్నారు.
  rationale: The revision removes an unwarranted visual implication, renders the causal occasion of the town’s reaction naturally, and uses a direct Telugu interrogative that better preserves the Hebrew’s astonished recognition. It also uses a closer, unembellished narrative verb for the journey while retaining the feminine-plural speakers explicitly in the main text.
  reviewer_model: gpt-5.6-terra
