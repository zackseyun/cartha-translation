id: RUT.1.19
reference: Ruth 1:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֵּלַ֣כְנָה שְׁתֵּי/הֶ֔ם עַד בֹּאָ֖/נָה בֵּ֣ית לָ֑חֶם וַ/יְהִ֗י כְּ/בֹאָ֨/נָה֙ בֵּ֣ית לֶ֔חֶם וַ/תֵּהֹ֤ם כָּל הָ/עִיר֙ עֲלֵי/הֶ֔ן וַ/תֹּאמַ֖רְנָה הֲ/זֹ֥את נָעֳמִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/019.yaml
  text: So the two of them went on until they came to Bethlehem. And when they came to Bethlehem[a], the whole town was stirred because of them, and the women said, “Is this Naomi?”
translation:
  language: te
  text: ఆ ఇద్దరూ బేత్లెహేముకు చేరే వరకు వెళ్లారు. వారు బేత్లెహేముకు చేరుకున్నప్పుడు, వారి రాకతో ఊరంతా కలవరపడింది. స్త్రీలు, “ఈమె నయోమినా?” అని అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלַכְנָה שְׁתֵּיהֶם
  choice: ఆ ఇద్దరూ ... ప్రయాణం సాగించారు
  rationale: స్త్రీలిద్దరి కొనసాగుతున్న ప్రయాణాన్ని సూచించే కథన క్రియను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, వారిద్దరూ కలిసి వెళ్లారనే ఉద్ఘాటనను నిలుపుతుంది.
- source_word: עַד בֹּאנָה בֵּית לָחֶם
  choice: బేత్లెహేముకు చేరుకునే వరకు
  rationale: עַד తో కూడిన בוא ప్రయాణపు గమ్యబిందువును సూచిస్తుంది; ‘చేరుకునే వరకు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וַיְהִי כְּבֹאנָה
  choice: వారు ... చేరుకున్నప్పుడు
  rationale: హీబ్రూ కథన సూత్రంలోని కాలసంబంధ భావాన్ని నిలుపుతూ, తెలుగులో కృత్రిమంగా వినిపించే ‘అప్పుడు జరిగిందేమంటే’ వంటి పదబంధాన్ని నివారిస్తుంది.
- source_word: וַתֵּהֹם כָּל הָעִיר
  choice: ఊరంతా కలవరపడింది
  rationale: המה ఇక్కడ సమాజమంతటిలో కలిగిన ఉద్వేగం, కలకలం లేదా ఆందోళనను సూచిస్తుంది. ‘కలవరపడింది’ ఆ భావవ్యాప్తిని నిలుపుతుంది; ‘అల్లకల్లోలమైంది’ అనవసరంగా తీవ్రంగా ఉంటుంది.
- source_word: עֲלֵיהֶן
  choice: వారిని చూసి
  rationale: עַל ఇక్కడ ఆ ఇద్దరి రాకను కలవరానికి సందర్భం లేదా కారణంగా చూపుతుంది. తెలుగు సందర్భంలో ‘వారిని చూసి’ ఆ కారణ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַתֹּאמַרְנָה
  choice: స్త్రీలు ... అని అన్నారు
  rationale: క్రియ స్త్రీలింగ బహువచనంలో ఉంది; అందువల్ల మాట్లాడినవారు స్త్రీలని ప్రధాన వాక్యంలో స్పష్టంగా పేర్కొనడం మూలభాషలోని లింగ సమాచారాన్ని కాపాడుతుంది.
- source_word: הֲזֹאת נָעֳמִי
  choice: ఈమె నయోమి కాదా?
  rationale: ప్రశ్నార్థక הֲ మరియు ‘ఈమె’ అనే సూచన ఆశ్చర్యంతో కూడిన గుర్తింపును తెలియజేస్తాయి. తెలుగు సహజ ప్రశ్నారూపమైన ‘కాదా?’ ఆ స్వరాన్ని అతిగా వ్యాఖ్యానించకుండా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. మూలంలోని స్త్రీలింగ బహువచన క్రియను ‘స్త్రీలు’ అని ప్రధాన పాఠ్యంలోనే స్పష్టం చేసినందున పాదసూచిక అవసరం లేదు.
