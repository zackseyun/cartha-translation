  yaml_path: translation/ot/ruth/001/018.yaml
  text: When she saw that she was determined to go with her[a], she stopped speaking to her.
translation:
  language: te
  text: రూతు నయోమితో కలిసి వెళ్లాలని దృఢంగా నిశ్చయించుకుందని నయోమి చూసినప్పుడు, ఆమె రూతుతో మాట్లాడడం మానేసింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: చూసినప్పుడు
  rationale: వావ్-క్రమ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఇక్కడ నయోమి గ్రహించిన విషయాన్ని కాలసంబంధంగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: అని
  rationale: 'నయోమి గ్రహించిన విషయవస్తువును పరిచయం చేస్తుంది: రూతు గట్టిగా నిశ్చయించుకున్నదని.'
- source_word: מִתְאַמֶּצֶת
  choice: గట్టిగా నిశ్చయించుకున్నది
  rationale: אמץ హిత్పయేల్ రూపం తనను తాను బలపరచుకోవడం నుంచి దృఢసంకల్పంతో ఉండడం అనే భావాన్ని ఇస్తుంది; ఈ సందర్భంలో ఈ తెలుగు ప్రయోగం సహజంగా ఆ దృఢతను తెలియజేస్తుంది.
- source_word: הִיא
  choice: రూతు
  rationale: హీబ్రూలోని స్వతంత్ర సర్వనామం కర్తను ఉద్ఘాటిస్తుంది. తెలుగులో అస్పష్టత నివారించి ఆ కేంద్రీకరణను నిలుపుటకు పేరును ఉపయోగించాం.
- source_word: לָלֶכֶת
  choice: రావాలని
  rationale: הלך ప్రయాణ సందర్భంలో ‘వెళ్లు/రా’ అని అర్థం. నయోమి దృష్టికోణంలో ఆమెతో పాటు రావడం తెలుగులో సహజం.
- source_word: אִתָּהּ
  choice: తనతో
  rationale: రూతు నయోమితో కలిసి ప్రయాణించాలనే ఉద్దేశాన్ని తెలియజేస్తుంది; వాక్యంలోని నయోమి దృష్టికోణానికి ‘తనతో’ సహజంగా సరిపోతుంది.
- source_word: וַתֶּחְדַּל
  choice: మానేసింది
  rationale: חדל అంటే ఆపడం లేదా మానడం; ఆధునిక తెలుగులో ‘మాట్లాడడం మానేసింది’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: לְדַבֵּר אֵלֶיהָ
  choice: ఆమెతో మాట్లాడడం
  rationale: అక్షరార్థంగా ‘ఆమెకు/ఆమె వైపు మాట్లాడడం’; తెలుగులో సంభాషణను సూచించడానికి ‘ఆమెతో మాట్లాడడం’ సహజమైన రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. సర్వనామాల వల్ల కలిగే అస్పష్టతను నివారించేందుకు మొదటి ఉపవాక్యంలో ‘రూతు’, ‘నయోమి’ పేర్లు స్పష్టంగా ఇచ్చాం. చివరి మాటల ఉద్దేశం సందర్భంలో రూతును తిరిగి వెళ్లమని ఒప్పించే ప్రయత్నాన్ని ఆపడం కావచ్చునన్న భావాన్ని అనువాదంలో అదనంగా చేర్చకుండా, హీబ్రూ వాక్యంలోని సాధారణ ‘మాట్లాడడం మానేసింది’ అనే రూపాన్నే నిలిపాం.
