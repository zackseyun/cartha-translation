id: RUT.1.9
reference: Ruth 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יִתֵּ֤ן יְהוָה֙ לָ/כֶ֔ם וּ/מְצֶ֣אןָ מְנוּחָ֔ה אִשָּׁ֖ה בֵּ֣ית אִישָׁ֑/הּ וַ/תִּשַּׁ֣ק לָ/הֶ֔ן וַ/תִּשֶּׂ֥אנָה קוֹלָ֖/ן וַ/תִּבְכֶּֽינָה׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/009.yaml
  text: May Yahweh grant that you find rest[a], each of you in the house of her husband." Then she kissed them, and they lifted up their voices and wept.
translation:
  language: te
  text: “మీరిద్దరూ, ఒక్కొక్కరు తన భర్త ఇంటిలో విశ్రాంతి[a] పొందేలా యాహ్వే అనుగ్రహించుగాక!” అప్పుడు ఆమె వారిని ముద్దుపెట్టుకుంది. వారు తమ స్వరాలను ఎత్తి ఏడ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “భద్రత” లేదా “స్థిరమైన జీవితం.” ఇక్కడ “విశ్రాంతి” అనేది భర్త ఇంటిలో లభించే స్థిరమైన, భద్రమైన జీవితాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֵּן
  choice: అనుగ్రహించుగాక
  rationale: నయోమి పలికిన ఆశీర్వాదపు ఆకాంక్షను తెలుగులో సహజంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించదగిన వ్యక్తినామ రూపంలో ఉంచుతుంది; ‘ప్రభువు’గా బిరుదీకరించదు.
- source_word: וּמְצֶאןָ מְנוּחָה
  choice: విశ్రాంతి పొందేలా
  rationale: ఆశీర్వాదాన్ని కొనసాగించే క్రియాసంబంధాన్ని సహజ తెలుగులో చూపుతూ, מְנוּחָה యొక్క ‘విశ్రాంతి’ అర్థాన్ని నిలుపుతుంది.
- source_word: אִשָּׁה בֵּית אִישָׁהּ
  choice: మీరిద్దరూ మీ మీ భర్త ఇంట్లో
  rationale: ఇద్దరు స్త్రీలలో ఒక్కొక్కరికి వర్తించే విభజనార్థాన్ని ‘మీరిద్దరూ మీ మీ’ ద్వారా స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַתִּשַּׁק לָהֶן
  choice: ఆమె వారిని ముద్దుపెట్టుకుంది
  rationale: సరళమైన కథన క్రియను సహజ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וַתִּשֶּׂאנָה קוֹלָן וַתִּבְכֶּינָה
  choice: వారు బిగ్గరగా ఏడ్చారు
  rationale: ‘తమ స్వరాన్ని ఎత్తి ఏడ్చారు’ అనే హీబ్రూ నుడికారపు భావాన్ని సాధారణ పాఠకుడికి సహజమైన తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో ఉన్న ప్రత్యేక దైవనామాన్ని బిరుదుగా మార్చకుండా వ్యక్తినామంగానే నిలుపుతూ, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపాన్ని ఎంచుకుంది.
- issue: מְנוּחָה యొక్క సందర్భార్థం
  choice: విశ్రాంతి
  alternative: భద్రత; స్థిరమైన జీవితం
  rationale: పునర్వివాహం ద్వారా భర్త ఇంట్లో లభించే స్థిరత్వం, భద్రత సందర్భంలో సూచించబడుతున్నా, మూలపదంలోని రూపక విస్తృతిని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భార్థాన్ని పాదసూచికలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సులభగ్రాహ్యమైన శైలి. ఆశీర్వాదానికి ‘అనుగ్రహించుగాక’ను ఉపయోగించి, చివరి హీబ్రూ నుడికారాన్ని సహజమైన ‘బిగ్గరగా ఏడ్చారు’గా అందించింది.
