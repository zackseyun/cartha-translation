source:
  edition: WLC
  text: וְ/שֵׁ֣ם הָ/אִ֣ישׁ אֱֽלִימֶ֡לֶךְ וְ/שֵׁם֩ אִשְׁתּ֨/וֹ נָעֳמִ֜י וְ/שֵׁ֥ם שְׁנֵֽי בָנָ֣י/ו מַחְל֤וֹן וְ/כִלְיוֹן֙ אֶפְרָתִ֔ים מִ/בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וַ/יָּבֹ֥אוּ שְׂדֵי מוֹאָ֖ב וַ/יִּֽהְיוּ שָֽׁם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/002.yaml
  text: The man's name was Elimelech[a], and his wife's name was Naomi, and the names of his two sons were Mahlon and Chilion. They were Ephrathites from Bethlehem in Judah[c][b]. They came to the fields of Moab and were there.
translation:
  language: te
  text: ఆ మనిషి పేరు ఎలీమెలెకు; అతని భార్య పేరు నయోమి; అతని ఇద్దరు కుమారుల పేర్లు మహ్లోను, కిల్యోను. వారు యూదాలోని బేత్లెహేముకు చెందిన ఎఫ్రాతీయులు[a]. వారు మోయాబు పొలాలకు[b] వచ్చి అక్కడే ఉన్నారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఎఫ్రాతీయులు’ అంటే ఎఫ్రాతా ప్రాంతానికి చెందినవారు; ఇక్కడ అది యూదాలోని బేత్లెహేముతో అనుసంధానించబడింది. వీరిని ఎఫ్రాయిమీయులతో కలపకూడదు.
    reason: lexical_clarification
  - marker: b
    text: ‘మోయాబు దేశం’ లేదా ‘మోయాబు భూభాగం’ అని కూడా అనువదించవచ్చు; హీబ్రూలో అక్షరార్థంగా ‘మోయాబు పొలాలు.’
    reason: lexical_alternative
  - marker: c
    text: ‘అక్కడే ఉండిపోయారు’ లేదా ‘అక్కడ నివసించారు’ అని కూడా భావానువాదం చేయవచ్చు; హీబ్రూలో అక్షరార్థంగా ‘వారు అక్కడ ఉన్నారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם הָאִישׁ
  choice: ఆ మనిషి పేరు
  rationale: హీబ్రూ నామపరిచయ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; సందర్భంలో ఇప్పటికే ప్రస్తావించిన మనిషిని ‘ఆ మనిషి’ సూచిస్తుంది.
- source_word: אֱלִימֶלֶךְ
  choice: ఎలీమెలెకు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రామాణికంగా లిప్యంతరీకరించింది.
- source_word: אִשְׁתּוֹ
  choice: అతని భార్య
  rationale: స్వామ్య సంబంధాన్ని తెలుగులో సహజమైన రీతిలో నిలుపుతుంది.
- source_word: נָעֳמִי
  choice: నయోమి
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో విస్తృతంగా గుర్తింపున్న లిప్యంతరీకరణ.
- source_word: שְׁנֵי בָנָיו
  choice: అతని ఇద్దరు కుమారులు
  rationale: సంఖ్యను, బంధుత్వాన్ని స్పష్టంగా మరియు సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: מַחְלוֹן וְכִלְיוֹן
  choice: మహ్లోను, కిల్యోను
  rationale: రెండు హీబ్రూ వ్యక్తినామాలను వాటి ధ్వనులకు సమీపంగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֶפְרָתִים
  choice: ఎఫ్రాతీయులు
  rationale: ఇది ఎఫ్రాతా ప్రాంతంతో అనుబంధమున్న ప్రజలను సూచించే జాతి/ప్రాంత నామం; ‘ఎఫ్రాయిమీయులు’ అని అనువదిస్తే వేరే ప్రాంతమైన ఎఫ్రాయిముతో తప్పుగా కలిసిపోతుంది.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: యూదాలోని బేత్లెహేముకు చెందిన
  rationale: బేత్లెహేము యూదా ప్రాంతంలో ఉందని, వారు అక్కడివారని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיָּבֹאוּ
  choice: వచ్చి
  rationale: בוא అనే సాధారణ గమన క్రియను కథకుడి దృష్టికోణానికి అనుగుణంగా నేరుగా అనువదిస్తుంది.
- source_word: שְׂדֵי מוֹאָב
  choice: మోయాబు పొల ప్రాంతానికి
  rationale: ‘పొలాలు’ అనే మూలంలోని స్పష్ట రూపాన్ని నిలుపుతూ, బహువచన నిర్మాణం ఇక్కడ విస్తృత భూభాగాన్ని సూచించవచ్చనే భావాన్ని ‘ప్రాంతం’ ద్వారా సహజంగా అందిస్తుంది.
- source_word: וַיִּהְיוּ שָׁם
  choice: అక్కడే ఉన్నారు
  rationale: హీబ్రూలోని ‘వారు అక్కడ ఉన్నారు’ అనే నిర్మాణానికి దగ్గరగా ఉంటుంది; ‘నివసించారు’ లేదా ‘స్థిరపడ్డారు’ అనే అదనపు భావాన్ని చేర్చదు.
