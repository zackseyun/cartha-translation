  edition: WLC
  text: וַ/תֹּאמַ֖רְנָה לָּ֑/הּ כִּי אִתָּ֥/ךְ נָשׁ֖וּב לְ/עַמֵּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/010.yaml
  text: But they said to her[a], “No, we will return with you to your people.”
translation:
  language: te
  text: 'కాని వారు ఆమెకు ఇలా అన్నారు: “లేదు[a], మేము నీతో కలిసి నీ ప్రజల దగ్గరకు తిరిగి వస్తాం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “ఎందుకంటే నీతో కలిసి నీ ప్రజల దగ్గరకు తిరిగి వస్తాం.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְנָה
  choice: కాని వారు … అన్నారు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; ముందటి వచనంలో నయోమి చేసిన విజ్ఞప్తికి వీరి మాట వ్యతిరేకంగా ఉన్నందున సందర్భానుసారంగా ‘కాని’ సహజంగా ఉంది. స్త్రీల బహువచన రూపం తెలుగులో సందర్భంలోని ‘వారు’ ద్వారా వ్యక్తమవుతుంది.
- source_word: לָּהּ
  choice: ఆమెతో
  rationale: ל ఉపసర్గతో కూడిన మూడవ పురుష ఏకవచన స్త్రీలింగ ప్రత్యయం నయోమిని ఉద్దేశించిన పరోక్ష కర్మను సూచిస్తుంది; తెలుగు సంభాషణ పరిచయంలో ‘ఆమెతో … అన్నారు’ సహజమైన ప్రయోగం.
- source_word: כִּי
  choice: లేదు
  rationale: ఈ ప్రత్యక్ష సంభాషణలో כִּי నయోమి చెప్పినదాన్ని గట్టిగా తిరస్కరిస్తూ తమ నిర్ణయాన్ని నొక్కిచెబుతుంది. ఆధునిక తెలుగులో ‘లేదు’ ఆ ప్రతివాదాన్ని సహజంగా తెలియజేస్తుంది; ‘ఎందుకంటే/నిశ్చయంగా’ అనే మరింత అక్షరార్థ అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: אִתָּךְ
  choice: నీతోపాటు
  rationale: రెండవ పురుష ఏకవచన స్త్రీలింగ ప్రత్యయంతో ఉన్న ఈ ఉపసర్గ నయోమితో కలిసి వెళ్లడాన్ని సూచిస్తుంది; ‘నీతోపాటు’ సహచర్యాన్ని స్పష్టంగా, సహజంగా తెలుపుతుంది.
- source_word: נָשׁוּב
  choice: తిరిగి వస్తాం
  rationale: שׁוּב అంటే ‘తిరుగు/తిరిగి వెళ్లు లేదా రా.’ రూతు 1లో పదేపదే వచ్చే ‘తిరుగు’ భావసూత్రాన్ని నిలుపుతూ, నయోమితో కలిసి ఆమె ప్రజల వద్దకు చేరే దృక్కోణంలో ‘తిరిగి వస్తాం’ అని అనువదించాం.
- source_word: לְעַמֵּךְ
  choice: నీ ప్రజల వద్దకు
  rationale: עַם ఇక్కడ కేవలం సమీప బంధువులను కాక నయోమి చెందిన సమాజ-జన సమూహాన్ని సూచిస్తుంది. ‘నీ ప్రజలు’ ఆ విస్తృత భావాన్ని సహజంగా నిలుపుతుంది.
