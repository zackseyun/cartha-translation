translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణను ఉపయోగించాం. మూలంలోని ప్రతివాద బలాన్ని ప్రధాన పాఠంలో సహజంగా వ్యక్తం చేస్తూనే, כִּי పదానికి ఉన్న అనుసంధాన లేదా నిశ్చయార్థ అవకాశాన్ని పాదసూచికలో నిలిపాం.
