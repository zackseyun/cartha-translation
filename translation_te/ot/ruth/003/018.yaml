source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ שְׁבִ֣י בִתִּ֔/י עַ֚ד אֲשֶׁ֣ר תֵּֽדְעִ֔י/ן אֵ֖יךְ יִפֹּ֣ל דָּבָ֑ר כִּ֣י לֹ֤א יִשְׁקֹט֙ הָ/אִ֔ישׁ כִּֽי אִם כִּלָּ֥ה הַ/דָּבָ֖ר הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/018.yaml
  text: Then she said[a], “Wait, my daughter, until you learn how the matter will fall out[b], for the man will not rest unless he has settled the matter today.”
translation:
  language: te
  text: అప్పుడు ఆమె, “నా కుమార్తె, ఈ విషయం ఎలా పరిణమిస్తుందో నీకు తెలిసేవరకు వేచి ఉండు[a]. ఆ మనిషి ఈ రోజే ఈ విషయాన్ని పూర్తి చేసేవరకు విశ్రమించడు[b]” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వేచి ఉండు’ అని అనువదించిన హీబ్రూ పదానికి అక్షరార్థంగా ‘కూర్చో’ లేదా ‘అక్కడే ఉండు’ అని కూడా అర్థం రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆ మనిషి’ అనేది బోయజును సూచిస్తుంది; అయితే హీబ్రూ పాఠం ఇక్కడ అతని పేరును చెప్పదు.
    reason: cross_reference
lexical_decisions:
- source_word: שְׁבִי
  choice: వేచి ఉండు
  rationale: ఈ ఆజ్ఞకు అక్షరార్థంగా ‘కూర్చో/ఉండు’ అనే భావం ఉన్నా, ఈ సందర్భంలో రూతు అక్కడే ఉండి ఫలితం కోసం వేచి చూడాలని నయోమి చెబుతోంది. ఆధునిక తెలుగులో ‘వేచి ఉండు’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בִתִּי
  choice: నా కుమార్తె
  rationale: నయోమి ప్రేమతో పలికిన సంబోధనను, హీబ్రూలో స్పష్టంగా ఉన్న స్వామ్యార్థాన్ని నిలుపుతుంది.
- source_word: תֵּדְעִין
  choice: నీకు తెలిసేవరకు
  rationale: ఇక్కడ ידע భవిష్యత్తులో ఒక విషయం తెలిసికోవడాన్ని సూచిస్తుంది; ఫలితం వెల్లడయ్యే వరకు వేచి ఉండాలనే భావం.
- source_word: אֵיךְ יִפֹּל דָּבָר
  choice: ఈ విషయం ఎలా పరిణమిస్తుందో
  rationale: అక్షరార్థం ‘విషయం ఎలా పడుతుందో.’ తెలుగులో ఆ రూపకం సహజంగా లేకపోవడంతో, దాని అనిశ్చిత ఫలితార్థాన్ని ‘ఎలా పరిణమిస్తుందో’ అని అందించాం.
- source_word: הָאִישׁ
  choice: ఆ మనిషి
  rationale: సందర్భంలో బోయజును సూచించినప్పటికీ మూలపాఠం అతని పేరును చెప్పకుండా ‘ఆ మనిషి’ అంటుంది; అదే నిర్దిష్ట సూచనను నిలిపాం.
- source_word: יִשְׁקֹט
  choice: విశ్రమించడు
  rationale: విషయం ముగిసేవరకు అతడు ఊరుకోడనే దృఢసంకల్పాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: כִּי אִם כִּלָּה
  choice: పూర్తి చేసేవరకు
  rationale: ఈ నిర్మాణం అతడు విశ్రమించే ముందు తప్పనిసరిగా విషయం ముగించడాన్ని సూచిస్తుంది. ‘పూర్తి చేసేవరకు’ షరతు మరియు ముగింపు రెండింటినీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַדָּבָר
  choice: ఈ విషయం
  rationale: దבר ఇక్కడ విమోచన-వివాహానికి సంబంధించిన పెండింగ్ వ్యవహారాన్ని సూచిస్తుంది; దాని విస్తృతతను అనవసరంగా సంకుచితం చేయకుండా ‘విషయం’ అని అనువదించాం.
- source_word: הַיּוֹם
  choice: ఈ రోజే
  rationale: ‘ఈ రోజే’ మూలంలోని కాలసూచనతో పాటు, అదే రోజున పూర్తి చేయాలనే ఉద్ఘాటనను సహజ తెలుగులో తెలియజేస్తుంది.
