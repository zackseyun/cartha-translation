  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే కథనానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని పునరుక్తి (‘విషయం’) మరియు బోయజు పేరును చెప్పని సూచన నిలుపబడ్డాయి.
