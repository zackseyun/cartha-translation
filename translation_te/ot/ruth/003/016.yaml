id: RUT.3.16
reference: Ruth 3:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תָּבוֹא֙ אֶל חֲמוֹתָ֔/הּ וַ/תֹּ֖אמֶר מִי אַ֣תְּ בִּתִּ֑/י וַ/תַּ֨גֶּד לָ֔/הּ אֵ֛ת כָּל אֲשֶׁ֥ר עָֽשָׂה לָ֖/הּ הָ/אִֽישׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/016.yaml
  text: When she came to her mother-in-law[a], she said, “Who are you, my daughter?” Then she told her all that the man had done for her.
translation:
  language: te
  text: ఆమె తన అత్త దగ్గరకు వచ్చినప్పుడు, ఆమె, “నా కూతురా, నువ్వెవరు?”[a] అని అడిగింది. అప్పుడు ఆ మనిషి రూతు కోసం చేసినదంతా రూతు తన అత్తకు చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత భావానువాదంగా, “నా కూతురా, నీ సంగతి ఎలా జరిగింది?” అని అనువదించవచ్చు. హీబ్రూలో అక్షరార్థంగా, “నా కూతురా, నువ్వెవరు?” అని ఉంది. ఇది రూతు స్థితిలో వచ్చిన మార్పు గురించో, ఆమె సమావేశం ఎలా ముగిసిందో అడుగుతున్న ప్రశ్న కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּבוֹא
  choice: ఆమె ... వచ్చినప్పుడు
  rationale: వయ్యిక్తోల్ కథనాన్ని ముందుకు నడిపిస్తుంది; తరువాతి మాటతో సహజమైన కాలసంబంధాన్ని తెలుగులో చూపడానికి ‘వచ్చినప్పుడు’ ఎంచుకున్నాం.
- source_word: אֶל חֲמוֹתָהּ
  choice: తన అత్త దగ్గరికి
  rationale: חֲמוֹת అంటే వివాహ సంబంధంలోని అత్త, ఇక్కడ రూతు అత్త నయోమి. ఆధునిక తెలుగులో సహజంగా ఉండేలా ‘తన అత్త దగ్గరికి’ అని అనువదించాం.
- source_word: מִי אַתְּ
  choice: నువ్వెవరు?
  rationale: హీబ్రూ మాటల ప్రత్యక్ష అర్థాన్ని నిలిపి, రూతు స్థితి లేదా సమావేశ ఫలితం గురించి అంతర్లీనంగా ఉండగల ప్రశ్నను వ్యాఖ్యానంతో పరిష్కరించకుండా ఉంచాం.
- source_word: בִּתִּי
  choice: నా కుమారీ
  rationale: నయోమి రూతును ఆప్యాయంగా సంబోధించే కుమార్తెసమానమైన పిలుపును గౌరవప్రదమైన, సహజమైన తెలుగులో నిలిపింది.
- source_word: וַתַּגֶּד לָהּ
  choice: రూతు ఆమెకు చెప్పింది
  rationale: హిఫిల్ రూపంలోని נגד ఇక్కడ ‘తెలియజేయడం/చెప్పడం’ అనే అర్థం ఇస్తుంది. సర్వనామ సందిగ్ధతను నివారించేందుకు తెలుగులో కర్తగా ‘రూతు’ను స్పష్టం చేశాం.
- source_word: אֵת כָּל אֲשֶׁר
  choice: చేసినదంతా
  rationale: నివేదికలోని సంపూర్ణ విషయాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: עָשָׂה לָהּ הָאִישׁ
  choice: ఆ మనిషి తన కోసం చేసినదంతా
  rationale: לָהּ ఇక్కడ రూతు ప్రయోజనార్థం చేసిన కార్యాలను సూచిస్తుంది; ‘తన కోసం’ ఆ ప్రయోజన భావాన్ని చూపుతుంది. మూలంలోని విధంగా బోయజు పేరును చెప్పకుండా ‘ఆ మనిషి’ అని ఉంచాం.
theological_decisions:
- issue: నయోమి ప్రశ్నలోని భావం
  choice: ప్రధాన పాఠ్యంలో ‘నువ్వెవరు?’ అనే ప్రత్యక్ష అర్థాన్ని నిలిపాం.
  alternative: ‘నా కుమారీ, ఏమైంది?’ లేదా ‘నీ సంగతి ఏమైంది?’
  rationale: ప్రశ్న రూతు మారిన స్థితిని లేదా సమావేశ ఫలితాన్ని సూచించవచ్చు; అయితే మూల హీబ్రూ ఉద్దేశపూర్వకంగా ఉంచిన అస్పష్టతను వ్యాఖ్యానాత్మక అనువాదంతో తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ప్రధాన పాఠ్యంలో హీబ్రూ ప్రశ్నలోని అస్పష్టతను నిలిపి, దాని సాధ్యమైన సందర్భార్థాన్ని పాదసూచికలో ఇచ్చాం. పునరుక్త సర్వనామాల వల్ల తెలుగులో కలిగే అయోమయాన్ని నివారించేందుకు ‘అత్త’ మరియు ‘రూతు’ అనే సూచనలను సందర్భానుసారంగా స్పష్టం చేశాం.
