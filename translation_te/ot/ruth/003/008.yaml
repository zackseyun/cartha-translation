id: RUT.3.8
reference: Ruth 3:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/חֲצִ֣י הַ/לַּ֔יְלָה וַ/יֶּחֱרַ֥ד הָ/אִ֖ישׁ וַ/יִּלָּפֵ֑ת וְ/הִנֵּ֣ה אִשָּׁ֔ה שֹׁכֶ֖בֶת מַרְגְּלֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/008.yaml
  text: And it happened at midnight that the man trembled and turned himself[a], and behold[b], a woman was lying at his feet.
translation:
  language: te
  text: అర్ధరాత్రి వేళ ఆ మనిషి ఉలిక్కిపడి, ఒళ్లు తిప్పుకున్నాడు[a]. ఇదిగో, అతని పాదాల దగ్గర ఒక స్త్రీ పడుకొని ఉంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఒళ్లు మెలితిప్పుకున్నాడు’ లేదా ‘వంగాడు’; ఇక్కడి హీబ్రూ క్రియ అరుదైనది. ఆశ్చర్యంతో అతడు తిరగడం, మెలికపడడం లేదా వంగడం వంటి కదలికను ఇది సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘అతని పాదాల దగ్గర’; హీబ్రూ పదం పాదాలు లేదా కాళ్ల దిగువ భాగం ఉన్న ప్రాంతాన్ని మరింత విస్తృతంగా కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: వేళ
  rationale: హీబ్రూ కథన క్రమాన్ని తెలుగులో సహజంగా కొనసాగించేందుకు ప్రత్యేకంగా ‘జరిగింది’ అని చేర్చకుండా కాలసూచక నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: בַּחֲצִי הַלַּיְלָה
  choice: అర్ధరాత్రి వేళ
  rationale: ‘రాత్రి మధ్యలో’ అనే మూలార్థాన్ని సహజమైన, సంక్షిప్తమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיֶּחֱרַד
  choice: ఉలిక్కిపడి
  rationale: ఈ క్రియ సూచించే అకస్మాత్తు భయకంపన లేదా దిగ్భ్రాంతిని, నిర్దిష్ట భావోద్వేగాన్ని అతిగా నిర్ణయించకుండా సహజంగా తెలియజేస్తుంది.
- source_word: הָאִישׁ
  choice: ఆ మనిషి
  rationale: సందర్భంలో బోయజును సూచించే సాధారణ నామవాచకానికి నేరమైన సమానార్థకం; ‘భర్త’ వంటి సందర్భవిరుద్ధ అర్థాన్ని నివారిస్తుంది.
- source_word: וַיִּלָּפֵת
  choice: ఒళ్లు తిప్పుకున్నాడు
  rationale: అరుదైన హీబ్రూ క్రియ సూచించే తిరగడం, మెలికపడడం లేదా వంగడం వంటి శరీర కదలికను అతిగా నిర్దిష్టం చేయకుండా తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: ఆకస్మికంగా గమనించడం, ఆశ్చర్యంతో కనుగొనడం అనే కథన బలాన్ని నిలుపుతుంది.
- source_word: אִשָּׁה
  choice: ఒక స్త్రీ
  rationale: ఈ సందర్భంలో ‘స్త్రీ’ అనే సాధారణ అర్థమే సరైనది; ‘భార్య’ అనడం సందర్భానికి విరుద్ధం.
- source_word: שֹׁכֶבֶת
  choice: పడుకొని ఉంది
  rationale: కనుగొన్న క్షణంలో కొనసాగుతున్న శరీర స్థితిని తెలుగు వర్తమాన స్థితి నిర్మాణంతో స్పష్టంగా తెలియజేస్తుంది.
- source_word: מַרְגְּלֹתָיו
  choice: అతని పాదాల దగ్గర
  rationale: పాదాలు లేదా పాదాల/కాళ్ల దిగువ భాగం సమీపంలోని ప్రదేశాన్ని సూచించే పదానికి సహజమైన తెలుగు రూపం; అనవసరమైన శృంగారార్థాన్ని ప్రధాన పాఠ్యంలోకి తీసుకురాదు.
theological_decisions:
- issue: ఈ దృశ్యానికి లైంగిక లేదా సభ్యోక్తి అర్థాన్ని అతిగా ఆపాదించే అవకాశం
  choice: రూతు బోయజు పాదాల దగ్గర పడుకొని ఉన్నదని సూటిగా అనువదించడం.
  alternative: సంభావ్య ద్వంద్వార్థాన్ని ముందుకు తెచ్చేలా ‘అతని పాదాలు/కాళ్ల దిగువ భాగం ఉన్న చోట’ అని అనువదించడం.
  rationale: హీబ్రూ వాక్యం ఎలాంటి లైంగిక చర్యనూ స్పష్టంగా చెప్పదు. అందువల్ల ప్రధాన పాఠ్యం కథనంలోని ఉద్వేగాన్ని నిలిపి, మూలంలో లేని నైతిక లేదా సిద్ధాంత తీర్పును చేర్చదు; స్థానసూచక పదంలోని విస్తృత అవకాశాన్ని పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇదిగో’ ద్వారా మూలంలోని ఆకస్మిక గమనింపు నిలుపబడింది. అరుదైన శరీర కదలిక క్రియలోని అనిశ్చితిని [a], స్థానసూచక పదంలోని విస్తృతిని [b] సంరక్షిస్తాయి.
