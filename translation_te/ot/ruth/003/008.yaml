  source_fidelity: హీబ్రూ కథనంలోని కాలసూచన, అకస్మాత్తు ఉలికిపాటు, అరుదైన శరీర-కదలిక క్రియలోని అనిశ్చితి, మరియు స్త్రీ అతని పాదాల సమీపంలో పడుకొని ఉన్న స్థితి అన్నీ విశ్వసనీయంగా ప్రతిబింబించబడ్డాయి. «ఉలిక్కిపడి» חרד యొక్క దిగ్భ్రాంతి/వణుకు భావవ్యాప్తిని సహజంగా తెలియజేస్తుంది; «ఒళ్లు తిప్పుకున్నాడు» וַיִּלָּפֵת‌కు జాగ్రత్తైన ప్రధాన-పాఠ్య ఎంపికగా ఉంది.
