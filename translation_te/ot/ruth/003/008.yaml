  terminology: «ఆ మనిషి», «ఒక స్త్రీ», «పడుకొని ఉంది» అనేవి సందర్భానుసారంగా సరైనవి. లైంగిక సభ్యోక్తిని ప్రధాన పాఠ్యంలోకి చేర్చకుండా మַרְגְּלֹתָיוను «అతని పాదాల దగ్గర»గా అనువదించడం మూలానికి, ఆంగ్ల ఆడిట్ నిర్ణయానికి అనుగుణం.
