  source_fidelity: 'ప్రధాన పాఠం మసొరెటిక్ హీబ్రూ పాఠాన్ని విశ్వసనీయంగా అనుసరిస్తోంది: పైవస్త్రాన్ని పట్టుకోవాలని ఆజ్ఞ, పేర్కొనబడని కొలమానంతో ఆరు యవధాన్యాలు, ఆమెపై ఉంచడం, చివర్లో పుంలింగ క్రియ—అన్నీ సరిగానే ప్రతిఫలించాయి. ‘పరచి పట్టుకో’ అనేది ధాన్యాన్ని స్వీకరించడానికి అవసరమైన సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది; మూలార్థాన్ని మార్చదు.'
