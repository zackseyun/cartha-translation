source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הָ֠בִי הַ/מִּטְפַּ֧חַת אֲשֶׁר עָלַ֛יִ/ךְ וְ/אֶֽחֳזִי בָ֖/הּ וַ/תֹּ֣אחֶז בָּ֑/הּ וַ/יָּ֤מָד שֵׁשׁ שְׂעֹרִים֙ וַ/יָּ֣שֶׁת עָלֶ֔י/הָ וַ/יָּבֹ֖א הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/015.yaml
  text: Then he said[a], “Bring the cloak that is on you and hold it out.” So she held it out, and he measured six measures of barley and put it on her[b]. Then he went into the city.
translation:
  language: te
  text: అప్పుడు అతడు, “నీ మీదున్న పైవస్త్రాన్ని తీసి, దాన్ని పరచి పట్టుకో” అన్నాడు. ఆమె దాన్ని పట్టుకుంది. అతడు ఆరు కొలతల యవధాన్యాన్ని[a] కొలిచి, ఆమెపై పెట్టాడు. తరువాత అతడు పట్టణంలోకి వెళ్లాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘ఆరు యవధాన్యం’ అని ఉంది; కొలమానం పేరు చెప్పబడలేదు. అందువల్ల స్పష్టత కోసం ‘కొలతల’ అనే పదం చేర్చబడింది.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రాచీన అనువాదాలు, అనేక అనువాదాలు ‘తరువాత ఆమె పట్టణంలోకి వెళ్లింది’ అని చదువుతాయి. మసొరెటిక్ పాఠంలో ‘తరువాత అతడు పట్టణంలోకి వెళ్లాడు’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: הָבִי
  choice: తీసి
  rationale: స్త్రీలింగ ఏకవచన ఆజ్ఞారూపం. రూతు తన మీదున్న వస్త్రాన్ని బోయజుకు అందుబాటులోకి తేవాలనే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַמִּטְפַּחַת
  choice: పైవస్త్రం
  rationale: ధాన్యాన్ని మోయగల చుట్టుకునే లేదా కప్పుకునే వస్త్రాన్ని సూచిస్తుంది. ‘ముసుగు’ కంటే ‘పైవస్త్రం’ సందర్భానికి తగినంత విస్తృతంగా, స్పష్టంగా ఉంది.
- source_word: וְאֶחֳזִי בָהּ
  choice: దాన్ని పరచి పట్టుకో
  rationale: అక్షరార్థంగా ‘దాన్ని పట్టుకో’. ధాన్యం పోయడానికి వస్త్రాన్ని పట్టి ఉంచాలనే సందర్భాన్ని ‘పరచి’ సహజంగా స్పష్టం చేస్తుంది; చర్యను అతిగా వివరించదు.
- source_word: וַיָּמָד
  choice: కొలిచి
  rationale: ధాన్యాన్ని ఉద్దేశపూర్వకంగా కొలిచి ఇచ్చిన చర్యను నేరుగా ప్రతిబింబిస్తుంది.
- source_word: שֵׁשׁ שְׂעֹרִים
  choice: ఆరు కొలతల యవధాన్యాన్ని
  rationale: హీబ్రూ పాఠంలో సంఖ్య ‘ఆరు’ మరియు యవధాన్యం మాత్రమే ఉన్నాయి; కొలమానం పేరు లేదు. తెలుగులో భావం స్పష్టంగా ఉండేందుకు సాధారణమైన ‘కొలతల’ పదం చేర్చి, నిర్దిష్ట ప్రమాణాన్ని ఊహించలేదు.
- source_word: וַיָּשֶׁת עָלֶיהָ
  choice: ఆమెపై పెట్టాడు
  rationale: కొలిచిన ధాన్యపు భారాన్ని రూతు మోయడానికి ఆమెపై ఉంచిన చర్యను సరళంగా తెలియజేస్తుంది; హీబ్రూలో లేని ‘మూట’ వంటి వివరాన్ని చేర్చదు.
- source_word: וַיָּבֹא הָעִיר
  choice: అతడు పట్టణంలోకి వెళ్లాడు
  rationale: మసొరెటిక్ పాఠంలోని క్రియ పుంలింగ ఏకవచనంలో ఉంది. అందువల్ల ప్రధాన పాఠం ‘అతడు’ అని అనువదిస్తుంది; ‘ఆమె’ అనే ప్రాచీన పాఠాంతరాన్ని పాదసూచికలో ఉంచుతుంది.
theological_decisions:
- issue: చివరి వాక్యభాగం וַיָּבֹא הָעִיר లో కర్త
  choice: అతడు పట్టణంలోకి వెళ్లాడు
  alternative: ఆమె పట్టణంలోకి వెళ్లింది
  rationale: ఇది సిద్ధాంతపరమైన నిర్ణయం కాకపోయినా ముఖ్యమైన పాఠాంతర సమస్య. ఇవ్వబడిన మసొరెటిక్ పాఠంలో క్రియ పుంలింగంలో ఉన్నందున ప్రధాన అనువాదం దానినే అనుసరిస్తుంది. కథన ప్రవాహానికి అనుగుణంగా కొన్ని ప్రాచీన అనువాదాలు స్త్రీలింగ పాఠాన్ని ప్రతిబింబిస్తాయి కాబట్టి దానిని పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘యవధాన్యం’ సాధారణ పాఠకునికి అర్థమయ్యేలా ఉండి, ‘బార్లీ’ అనే ఆంగ్ల అరువు పదాన్ని నివారిస్తుంది. మూలంలోని అస్పష్టమైన కొలమానాన్ని నిర్దిష్టీకరించకుండా, చివరి క్రియలోని పాఠాంతరాన్ని పారదర్శకంగా పాదసూచికలో ఇచ్చాం.
