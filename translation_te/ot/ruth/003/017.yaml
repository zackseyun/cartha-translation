  text: וַ/תֹּ֕אמֶר שֵׁשׁ הַ/שְּׂעֹרִ֥ים הָ/אֵ֖לֶּה נָ֣תַן לִ֑/י כִּ֚י אָמַ֣ר אַל תָּב֥וֹאִי רֵיקָ֖ם אֶל חֲמוֹתֵֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/017.yaml
  text: She said[a], “He gave me these six measures of barley, for he said, ‘Do not go to your mother-in-law empty-handed.’”
translation:
  language: te
  text: 'ఆమె ఇలా అంది: “ఈ ఆరు కొలతల[a] యవలను అతడు నాకు ఇచ్చాడు. ఎందుకంటే, ‘నీ అత్త దగ్గరికి వట్టి చేతులతో వెళ్లవద్దు’ అని అతడు చెప్పాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఈ ఆరు యవలు.” నిర్దిష్ట కొలమానం చెప్పబడలేదు; స్పష్టత కోసం “కొలతల” అని చేర్చబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: ఆమె ఇలా అంది
  rationale: స్త్రీలింగ ఏకవచన క్రియను స్పష్టంగా చూపుతూ, రూతు చెప్పబోయే మాటను సహజమైన తెలుగు కథనశైలిలో పరిచయం చేస్తుంది.
- source_word: שֵׁשׁ הַשְּׂעֹרִים הָאֵלֶּה
  choice: ఈ ఆరు కొలతల యవలను
  rationale: మూలంలో ‘ఆరు’ అని ఉన్నా కొలమానం పేరు చెప్పబడలేదు. తెలుగులో భావం స్పష్టంగా ఉండేందుకు ‘కొలతల’ చేర్చబడింది; ఆ అనిశ్చితిని పాదసూచికలో నిలిపాం. הָאֵלֶּה లోని సూచనార్థాన్ని ‘ఈ’ కాపాడుతుంది.
- source_word: נָתַן לִי
  choice: అతడు నాకు ఇచ్చాడు
  rationale: పుంలింగ కర్తను, ప్రథమ పురుష గ్రహీతను, పూర్తయిన చర్యను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: బహుమతి ఇవ్వడానికి గల కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַל תָּבוֹאִי
  choice: వెళ్లవద్దు
  rationale: బోయజు రూతుతో, ఆమె తన అత్త దగ్గరికి తిరిగి వెళ్లడం గురించి మాట్లాడుతున్న సందర్భంలో తెలుగులో ‘వెళ్లవద్దు’ సహజంగా ఉంటుంది.
- source_word: רֵיקָם
  choice: వట్టి చేతులతో
  rationale: ఏమీ తీసుకెళ్లకుండా ఉండడాన్ని సూచించే హీబ్రూ క్రియావిశేషణ భావాన్ని సహజమైన తెలుగు నుడికారంతో అందిస్తుంది.
- source_word: אֶל חֲמוֹתֵךְ
  choice: నీ అత్త దగ్గరికి
  rationale: חֲמוֹתֵךְ ప్రత్యేకంగా ‘నీ అత్త/భర్త తల్లి’ అని సూచిస్తుంది; గమ్యాన్ని తెలుగులో సహజంగా ‘దగ్గరికి’తో వ్యక్తపరిచాం.
