translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘యవలు’ అనే సాంప్రదాయికమైనప్పటికీ అర్థమయ్యే ధాన్యపదాన్ని నిలిపి, కొలమానం విషయంలో మూలంలోని అనిర్దిష్టతను పాదసూచికలో వెల్లడించాం.
