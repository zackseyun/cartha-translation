  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֥אמֶר לָ֖/הּ נָעֳמִ֣י חֲמוֹתָ֑/הּ בִּתִּ֞/י הֲ/לֹ֧א אֲבַקֶּשׁ לָ֛/ךְ מָנ֖וֹחַ אֲשֶׁ֥ר יִֽיטַב לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/001.yaml
  text: Then Naomi her mother-in-law said to her[a], “My daughter, should I not seek a resting place for you, that it may go well with you?”
translation:
  language: te
  text: 'అప్పుడు ఆమె అత్త నయోమి ఆమెతో ఇలా అంది: “నా కుమారీ, నీకు మేలు కలిగేలా నీ కోసం ఒక విశ్రాంతి స్థలాన్ని[a] నేను వెదకాలి కదా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “విశ్రాంతి,” “భద్రత,” లేక “ఒక ఇల్లు.” ఈ సందర్భంలో నయోమి రూతుకు స్థిరమైన శ్రేయస్సును—బహుశా వివాహం ద్వారా—కోరుతోంది; అయితే హీబ్రూ పదం అక్షరార్థంగా “విశ్రాంతి స్థలం” అని చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అప్పుడు ... అంది
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: נָעֳמִי חֲמוֹתָהּ
  choice: ఆమె అత్త నయోమి
  rationale: మూడవ పురుష ఏకవచన స్త్రీలింగ ప్రత్యయం రూతుతో నయోమికి ఉన్న బంధాన్ని సూచిస్తుంది; తెలుగులో ‘అత్త’ అనేది సందర్భానుసారంగా భర్త తల్లిని సహజంగా తెలియజేస్తుంది.
- source_word: בִּתִּי
  choice: నా కుమారీ
  rationale: ఆప్యాయతతో కూడిన కుటుంబ సంబోధనను అదనపు భావాన్ని చేర్చకుండా గౌరవప్రదంగా నిలుపుతుంది.
- source_word: הֲלֹא אֲבַקֶּשׁ
  choice: నేను వెదకాలి కదా?
  rationale: הֲלֹא సమ్మతిని ఆశించే అలంకారిక ప్రశ్న. ‘కదా?’ దాని ప్రశ్నార్థక బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; בקש యొక్క ‘వెదుకు’ భావం కూడా ఉంచబడింది.
- source_word: מָנוֹחַ
  choice: ఒక విశ్రాంతి స్థలం
  rationale: ఈ నామవాచకం విశ్రాంతిని లేదా స్థిరమైన భద్రతనిచ్చే స్థలాన్ని సూచించగలదు. సందర్భంలో వివాహం ద్వారా స్థిరమైన జీవితం ఉద్దేశించబడి ఉండవచ్చు; అయినా మూలంలోని రూపకాన్ని పాఠ్యంలో నిలిపి, ఇతర భావసూచనలను పాదటిప్పణిలో ఇచ్చాం.
- source_word: אֲשֶׁר יִיטַב לָךְ
  choice: నీకు మేలు కలిగేలా
  rationale: కేవలం ‘మంచిది’ అనే సారాంశం కాకుండా, రూతుకు కలిగే శ్రేయస్సు అనే ఫలితార్థాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
