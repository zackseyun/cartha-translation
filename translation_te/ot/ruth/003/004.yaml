source:
  edition: WLC
  text: וִ/יהִ֣י בְ/שָׁכְב֗/וֹ וְ/יָדַ֨עַתְּ֙ אֶת הַ/מָּקוֹם֙ אֲשֶׁ֣ר יִשְׁכַּב שָׁ֔ם וּ/בָ֛את וְ/גִלִּ֥ית מַרְגְּלֹתָ֖י/ו ו/שכבתי וְ/הוּא֙ יַגִּ֣יד לָ֔/ךְ אֵ֖ת אֲשֶׁ֥ר תַּעַשִֽׂי/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/004.yaml
  text: Then[a], when he lies down, note the place where he lies. Then go, uncover his feet, and lie down[b], and he will tell you what you should do.
translation:
  language: te
  text: అతను పడుకున్నప్పుడు, అతను పడుకునే చోటును గమనించు. అప్పుడు నీవు వెళ్లి, అతని పాదాలవైపు కప్పి ఉన్నదాన్ని తొలగించి[a] పడుకో[b]. నీవు ఏమి చేయాలో అతడు నీకు చెబుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం ‘అతని పాదాలు’ అని కూడా అనువదించవచ్చు; అది పాదాల చుట్టూ ఉన్న స్థలాన్ని లేదా అతని శరీరపు దిగువ భాగాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: వ్రాయబడిన హీబ్రూ రూపం ‘నేను పడుకుంటాను’ అని ఉంది; అయితే సందర్భం మరియు సంప్రదాయ పఠనం దాన్ని ‘నీవు పడుకో’ అని అర్థం చేసుకుంటాయి.
    reason: textual_variant
lexical_decisions:
- source_word: וִיהִי בְשָׁכְבוֹ
  choice: అతడు పడుకున్నప్పుడు
  rationale: היה రూపం తరువాతి సూచనకు కాలసంబంధ ప్రవేశాన్ని ఇస్తుంది; בְ + క్రియానామం ‘అతడు పడుకున్నప్పుడు’ అనే భావాన్ని ఇస్తుంది. తెలుగులో సహజమైన క్రమాన్ని నిలుపుతుంది.
- source_word: וְיָדַעַתְּ אֶת־הַמָּקוֹם
  choice: చోటును గమనించు
  rationale: ידע యొక్క మూలభావం ‘తెలుసుకొను’; ఇక్కడ రూతు అతడు పడుకునే నిర్దిష్ట స్థలాన్ని జాగ్రత్తగా గుర్తించాలనే ఆచరణాత్మక భావం ఉంది. ‘గమనించు’ దానిని సహజంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר יִשְׁכַּב שָׁם
  choice: అతడు పడుకునే
  rationale: సంబంధ వాక్యం నిద్రించే స్థలాన్ని సూచిస్తుంది. שָׁם ను తెలుగులో విడిగా ‘అక్కడ’ అని అనువదిస్తే అనవసర పునరుక్తి అవుతుంది.
- source_word: וּבָאת
  choice: అప్పుడు నీవు వెళ్లి
  rationale: בוא దృష్టికోణానుసారం ‘రా’ లేదా ‘వెళ్లు’ కావచ్చు. నయోమి రూతుకు ఇస్తున్న సూచనలో గమ్యస్థానానికి వెళ్లడం ఉద్దేశం; క్రమసూచక వావ్‌ను ‘అప్పుడు’ చూపిస్తుంది.
- source_word: וְגִלִּית מַרְגְּלֹתָיו
  choice: అతని పాదాల దగ్గర కప్పును తొలగించి
  rationale: גלה అంటే ‘తెరచు/కప్పు తొలగించు.’ מַרְגְּלוֹתָיו కేవలం శరీరంలోని పాదాలకే కాక పాదాలవైపు ఉన్న స్థలాన్నీ సూచించవచ్చు. తెలుగులో ‘పాదాలను తొలగించు’ అనే అసహజ లేదా తప్పు భావం రాకుండా, సందర్భంలో అంతర్లీనంగా ఉన్న కప్పును స్పష్టపరుస్తూ స్థలసంబంధ భావాన్ని నిలుపుతుంది.
- source_word: וְשָׁכַבְתִּי (כתיב) / וְשָׁכַבְתְּ (קרי)
  choice: పడుకో
  rationale: వ్రాతరూపం మొదటి పురుష ఏకవచనంలా ఉన్నా, సంప్రదాయ పఠనం మరియు సందర్భం రూతును ఉద్దేశించిన రెండవ పురుష స్త్రీలింగ ఆజ్ఞార్థక భావాన్ని సమర్థిస్తాయి. పాఠ్య వివరాన్ని అడుగుసూచనలో నిలుపుతున్నాం.
- source_word: וְהוּא יַגִּיד לָךְ
  choice: అతడే నీకు చెబుతాడు
  rationale: నిర్దిష్ట సర్వనామం ఇచ్చే స్వల్ప ఉద్ఘాటనను ‘అతడే’ తెలియజేస్తుంది; נגד హిఫిల్‌కు ‘చెప్పు/తెలియజేయు’ సరైన భావం.
- source_word: אֵת אֲשֶׁר תַּעֲשִׂין
  choice: నీవు ఏమి చేయాలో
  rationale: ఈ సందర్భంలో వాక్యం భవిష్యత్తును మాత్రమే కాక బోయజు ఇవ్వబోయే నిర్దేశాన్ని సూచిస్తుంది. ‘ఏమి చేయాలో’ తెలుగులో ఆ నిర్దేశక భావాన్ని సహజంగా ఇస్తుంది.
theological_decisions:
- issue: బోయజు పాదాలవైపు కప్పు తొలగించి పడుకోవడంలోని సంభావ్య లైంగిక సందిగ్ధత
  choice: చర్యను లైంగికమైనదిగా గానీ పూర్తిగా నిరపరాధమైన ఆచరణగా గానీ నిర్ణయించకుండా, మూలంలోని కథన సందిగ్ధతను నిలుపడం.
  alternative: దీనిని లైంగిక సమీపానికి సౌమ్యోక్తిగా స్పష్టీకరించడం; లేదా బోయజును మేల్కొలిపే సాధారణ చర్యగా మాత్రమే వివరించడం.
  rationale: హీబ్రూ పదప్రయోగం కథన ఉద్వేగాన్నీ సందిగ్ధతనూ కలిగిస్తుంది. అనువాదం ఏ వ్యాఖ్యానాన్నీ ప్రధాన పాఠ్యంలో బలవంతంగా స్థిరపరచకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ఆదేశ శైలిని వాడాం. ‘పాదాల దగ్గర కప్పును తొలగించి’ అనే రూపం తెలుగులో చర్యను సహజంగా తెలియజేస్తూ, מַרְגְּלוֹתָיו యొక్క స్థలసంబంధ విస్తృతిని మరియు కథన సందిగ్ధతను కాపాడుతుంది.
