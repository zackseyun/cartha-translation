revisions:
- from: అతడు పడుకున్నప్పుడు, అతడు పడుకునే చోటును గమనించు. అప్పుడు నీవు వెళ్లి, అతని పాదాల దగ్గర కప్పును తొలగించి[a] పడుకో[b]. నీవు ఏమి చేయాలో అతడే నీకు చెబుతాడు.
