source:
  edition: WLC
  text: לִ֣ינִי הַ/לַּ֗יְלָה וְ/הָיָ֤ה בַ/בֹּ֨קֶר֙ אִם יִגְאָלֵ֥/ךְ טוֹב֙ יִגְאָ֔ל וְ/אִם לֹ֨א יַחְפֹּ֧ץ לְ/גָֽאֳלֵ֛/ךְ וּ/גְאַלְתִּ֥י/ךְ אָנֹ֖כִי חַי יְהוָ֑ה שִׁכְבִ֖י עַד הַ/בֹּֽקֶר׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/013.yaml
  text: Stay here tonight[a], and in the morning, if he will redeem you, good—let him redeem you. But if he does not desire to redeem you, then I myself will redeem you, as Yahweh lives. Lie down until the morning.
translation:
  language: te
  text: ఈ రాత్రి బసచేయి. ఉదయం అతడు నిన్ను విమోచిస్తే, మంచిదే—అతడినే నిన్ను విమోచించనివ్వు. అయితే నిన్ను విమోచించడానికి అతడు ఇష్టపడకపోతే, యహ్వే జీవముతోడు, నేనే నిన్ను విమోచిస్తాను. ఉదయం వరకు పడుకొని ఉండు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִינִי הַלַּיְלָה
  choice: ఈ రాత్రి ఇక్కడే ఉండు
  rationale: לון అంటే రాత్రి బసచేయడం లేదా రాత్రంతా ఉండడం. సందర్భంలో ఉన్న స్థల సూచనను సహజమైన ఆధునిక తెలుగులో ‘ఇక్కడే ఉండు’ తెలియజేస్తుంది.
- source_word: וְהָיָה בַבֹּקֶר
  choice: ఉదయం
  rationale: హీబ్రూ పదబంధం మరుసటి ఉదయం జరిగే విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో సంక్షిప్తంగా ‘ఉదయం’ సహజంగా ఉంటుంది.
- source_word: יִגְאָלֵךְ / לְגָאֳלֵךְ / וּגְאַלְתִּיךְ
  choice: నిన్ను విమోచిస్తే / నిన్ను విమోచించడానికి / నిన్ను విమోచిస్తాను
  rationale: גאל అనే మూలపదం రూతు గ్రంథంలో కుటుంబ-చట్టపరమైన విమోచకుని బాధ్యతను సూచిస్తుంది. ‘విమోచించు’ అనే ఒకే పదాన్ని పునరావృతం చేయడం మూలంలోని కీలక పదబంధాన్ని, దాని విస్తృత ధార్మిక ప్రతిధ్వనిని నిలుపుతుంది; ప్రత్యేక కుటుంబార్థాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: טוֹב
  choice: మంచిదే
  rationale: ఇక్కడ טוֹב ఆ ఫలితాన్ని అంగీకరించే సంక్షిప్త ఉద్గారంగా ఉంది. ‘మంచిదే’ దాని సంక్షిప్తతను, ఆమోద భావాన్ని కాపాడుతుంది.
- source_word: יִגְאָל
  choice: అతడే నిన్ను విమోచించనివ్వు
  rationale: ముందున్న ‘మంచిదే’ తరువాత ఈ రూపం అనుమతి లేదా ఆమోదాన్ని వ్యక్తం చేస్తుంది. ‘అతడే’ సమీప బంధువే ఆ బాధ్యత చేపట్టవచ్చనే భావాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: לֹא יַחְפֹּץ
  choice: ఇష్టపడకపోతే
  rationale: חפץ కోరిక లేదా సుముఖతను సూచిస్తుంది. ‘ఇష్టపడకపోతే’ ఆధునిక తెలుగులో సహజంగా ఉండి, అతని సంకల్పానికి సంబంధించిన భావాన్ని నిలుపుతుంది.
- source_word: וּגְאַלְתִּיךְ אָנֹכִי
  choice: నేనే నిన్ను విమోచిస్తాను
  rationale: אָנֹכִי బోయజు తనను తాను నొక్కిచెప్పడాన్ని సూచిస్తుంది; ‘నేనే’ ఆ వ్యక్తిగత నిబద్ధతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: חַי יְהוָה
  choice: యెహోవా జీవం తోడు
  rationale: ఇది ప్రమాణ సూత్రం. ‘యెహోవా జీవం తోడు’ దాని ప్రమాణ స్వభావాన్ని గంభీరమైన, అర్థమయ్యే తెలుగులో నిలుపుతుంది.
- source_word: שִׁכְבִי עַד הַבֹּקֶר
  choice: ఉదయం వరకు పడుకొని ఉండు
  rationale: שכב పడుకోవడాన్ని సూచిస్తుంది. ‘పడుకొని ఉండు’ ఉదయం వరకు అదే స్థితిలో ఉండాలనే సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: రూతు గ్రంథంలోని కుటుంబ-చట్టపరమైన సందర్భంలో גאל అనువాదం
  choice: ప్రధాన పాఠ్యంలో ‘విమోచించు’ అనే పదాన్ని నిలుపుతూ, కుటుంబ విమోచకుని భావాన్ని పాదటిప్పణిలో వివరించడం
  alternative: ‘సమీప బంధువుగా తన బాధ్యత నెరవేర్చు’ లేదా ‘కుటుంబ విమోచకునిగా వ్యవహరించు’
  rationale: గאל కుటుంబ ఆస్తి, వంశ పరిరక్షణకు సంబంధించిన బాధ్యతను సూచించినప్పటికీ, ‘విమోచించు’ అనే మూలభావాన్ని నిలుపడం గ్రంథంలోని పదసంబంధాన్ని కాపాడుతుంది. పాదటిప్పణి దానిని సాధారణ ఆధ్యాత్మిక విమోచనగా మాత్రమే అపార్థం చేసుకోకుండా సహాయపడుతుంది.
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామమైన יהוה ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా ‘యెహోవా’గా ఇవ్వడం మూలంలోని నామాన్ని ప్రత్యక్షంగా నిలుపుతుంది.
- issue: טוֹב యొక్క వాక్యనిర్మాణ పాత్ర
  choice: ‘మంచిదే’ అనే ఆమోద ఉద్గారం
  alternative: దానిని వ్యక్తినామం ‘టోబు’గా భావించడం లేదా తరువాతి క్రియావిశేషణంగా ‘బాగా’ అనువదించడం
  rationale: ఈ సందర్భంలో సమీప బంధువును ముందే ప్రస్తావించినందున, సాధారణ పఠనం ‘అతడు విమోచిస్తే, మంచిదే; అతడే విమోచించనివ్వు.’ హీబ్రూ సంక్షిప్తతను నిలుపుతూ అనవసరంగా వ్యక్తినామాన్ని ప్రవేశపెట్టలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి వాడబడింది. హీబ్రూ పాఠ్యంలోని పునరుక్తి, ప్రమాణ సూత్రం, బోయజు చెప్పిన ‘నేనే’ అనే నొక్కిచెప్పడం కాపాడబడ్డాయి.
