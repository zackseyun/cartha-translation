- from: ఈ రాత్రి ఇక్కడే ఉండు. ఉదయం అతడు నిన్ను విమోచిస్తే[a], మంచిదే—అతడే నిన్ను విమోచించనివ్వు. అయితే నిన్ను విమోచించడానికి అతడు ఇష్టపడకపోతే, యెహోవా జీవం తోడు, నేనే నిన్ను విమోచిస్తాను. ఉదయం వరకు పడుకొని ఉండు.
  to: ఈ రాత్రి బసచేయి. ఉదయం అతడు నిన్ను విమోచిస్తే, మంచిదే—అతడినే నిన్ను విమోచించనివ్వు. అయితే నిన్ను విమోచించడానికి అతడు ఇష్టపడకపోతే, యహ్వే జీవముతోడు, నేనే నిన్ను విమోచిస్తాను. ఉదయం వరకు పడుకొని ఉండు.
  rationale: The revision corrects the rendering of the Tetragrammaton to match the mandated ‘Yahweh’ policy, improves the clarity of the permissive redemption clause, and uses ‘బసచేయి’ for the overnight-lodging imperative. The repeated redemption terminology and its explanatory footnote are retained.
