  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֗ה בִּתִּ/י֙ אַל תִּ֣ירְאִ֔י כֹּ֥ל אֲשֶׁר תֹּאמְרִ֖י אֶֽעֱשֶׂה לָּ֑/ךְ כִּ֤י יוֹדֵ֨עַ֙ כָּל שַׁ֣עַר עַמִּ֔/י כִּ֛י אֵ֥שֶׁת חַ֖יִל אָֽתְּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/011.yaml
  text: And now[a], my daughter, do not fear. All that you say, I will do for you[b], for all the gate of my people knows that you are a woman of noble character.
translation:
  language: te
  text: ఇప్పుడు, నా కుమార్తె, భయపడకు. నీవు చెప్పేదంతా నీ కోసం చేస్తాను. ఎందుకంటే నీవు గుణవంతురాలైన స్త్రీవని నా ప్రజలందరికీ తెలుసు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నా ప్రజల ద్వారమంతటికీ తెలుసు.” పట్టణ ద్వారం ప్రజలు కూడే, న్యాయపరమైన వ్యవహారాలు జరిగే బహిరంగ స్థలం. “గుణవంతురాలైన స్త్రీ” అనే మాటను “యోగ్యురాలైన స్త్రీ,” “శ్రేష్ఠురాలైన స్త్రీ,” లేదా “ధైర్యవంతురాలైన స్త్రీ” అని కూడా అనువదించవచ్చు.
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: בִּתִּי
  choice: నా కుమార్తె
  rationale: ఇది బయాలజికల్ బంధాన్ని తప్పనిసరిగా సూచించకుండా, బోయజు రూతును ఆప్యాయంగా, సంరక్షణ భావంతో సంబోధించే పద్ధతిని నిలుపుతుంది.
- source_word: אַל תִּירְאִי
  choice: భయపడకు
  rationale: నిషేధార్థక ప్రోత్సాహాన్ని సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כֹּל אֲשֶׁר תֹּאמְרִי אֶעֱשֶׂה לָּךְ
  choice: నీవు చెప్పేదంతా నీ కోసం చేస్తాను
  rationale: ‘చెప్పు’ అనే మూల క్రియను ‘అడుగు’గా సంకుచితం చేయకుండా, సందర్భంలోని విజ్ఞప్తి భావాన్ని సహజంగా ఉంచుతుంది.
- source_word: כָּל שַׁעַר עַמִּי
  choice: నా ప్రజలందరికీ
  rationale: ‘నా ప్రజల ద్వారమంతా’ అనే హెబ్రీయ మేటోనిమీని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; పట్టణ ద్వారం ప్రజా గుర్తింపు, న్యాయ వ్యవహారాల స్థలమనే సాంస్కృతిక నేపథ్యాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: אֵשֶׁת חַיִל
  choice: సద్గుణశాలివైన స్త్రీ
  rationale: חַיִל లోని యోగ్యత, బలం, విలువ, శ్రేష్ఠతల విస్తృత భావాన్ని ఈ సందర్భంలో రూతు యొక్క మంచి నడవడి, సామర్థ్యం, గౌరవనీయతగా సహజంగా తెలియజేస్తుంది; ప్రత్యామ్నాయాలను పాదటిప్పణిలో భద్రపరుస్తుంది.
theological_decisions:
- issue: אֵשֶׁת חַיִל అనే ప్రశంసను అనువదించడం
  choice: సద్గుణశాలివైన స్త్రీ
  alternative: యోగ్యురాలైన స్త్రీ; శ్రేష్ఠురాలైన స్త్రీ; ధైర్యశాలివైన స్త్రీ
  rationale: ఈ పదబంధాన్ని కేవలం గృహ సంబంధమైన నీతికి పరిమితం చేయకుండా రూతు యొక్క బలం, సామర్థ్యం, యోగ్యత, ప్రజల మధ్య ఉన్న గౌరవాన్ని సూచించేలా అనువదించబడింది. యుద్ధసంబంధమైన భావాన్ని అనవసరంగా ప్రధానంచేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. బోయజు పలికే ఆప్యాయతను ‘నా కుమార్తె’ ద్వారా నిలిపి, హెబ్రీయ ద్వారం-మేటోనిమీని ప్రధాన వాక్యంలో సహజీకరించి దాని సాంస్కృతిక సమాచారాన్ని పాదటిప్పణిలో ఇచ్చాం.
