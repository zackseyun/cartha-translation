- from: ఇప్పుడు, నా కుమార్తె, భయపడకు. నీవు చెప్పేదంతా నీ కోసం చేస్తాను. ఎందుకంటే నీవు సద్గుణశాలివైన స్త్రీవని నా ప్రజలందరికీ తెలుసు.[a]
  to: ఇప్పుడు, నా కుమార్తె, భయపడకు. నీవు చెప్పేదంతా నీ కోసం చేస్తాను. ఎందుకంటే నీవు గుణవంతురాలైన స్త్రీవని నా ప్రజలందరికీ తెలుసు.[a]
