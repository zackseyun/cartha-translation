base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/014.yaml
  text: So she lay at his feet until morning[a], and she got up before one man could recognize another. And he said[b], “Do not let it be known that the woman came to the threshing floor.”
translation:
  language: te
  text: ఆమె ఉదయం వరకు అతని కాళ్ల దగ్గర పడుకొని ఉంది; ఒక మనిషి మరొక మనిషిని గుర్తుపట్టగలిగేలోపే ఆమె లేచింది.[a] అప్పుడు అతడు, “ఆ స్త్రీ కళ్లానికి వచ్చిందని తెలియకూడదు” అన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఒక పురుషుడు తన తోటి వాణ్ణి గుర్తుపట్టకముందే.” మసక వెలుతురులో ప్రజలు ఒకరినొకరు వేరుగా గుర్తించలేని తెల్లవారుజాము సమయాన్ని ఈ హీబ్రూ ప్రయోగం సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: సందర్భాన్ని బట్టి మాటలాడింది బోయజే కావడం అత్యంత సాధ్యం; అయితే హీబ్రూ పాఠ్యం కేవలం “అతడు అన్నాడు” అని మాత్రమే చెబుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: מרגלתיו
  choice: అతని కాళ్ల దగ్గర
  rationale: ఈ పదం కాళ్లు లేదా కాళ్లు ఉన్న ప్రదేశాన్ని సూచిస్తుంది. ‘అతని కాళ్ల దగ్గర’ అనేది సహజమైన తెలుగు; ఆమె భంగిమను గానీ, పరుపు స్వరూపాన్ని గానీ అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: בטרום
  choice: సమయం రాకముందే
  rationale: ఇది ఒక సమయానికి ముందున్న కాలాన్ని సూచిస్తుంది. తరువాతి గుర్తుపట్టగల స్థితితో కలిపి తెలుగులో సహజంగా ఉండేలా అనువదించబడింది.
- source_word: יכיר
  choice: గుర్తుపట్టగల
  rationale: ఇక్కడ క్రియ గుర్తించడం లేదా ఎవరో నిర్ధారించడం అనే భావాన్ని ఇస్తుంది. తెల్లవారకముందు అది సాధ్యం కాని స్థితిని ‘గల’ స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: איש את רעהו
  choice: ఒకరు మరొకరిని
  rationale: అక్షరార్థంగా ‘ఒక పురుషుడు తన తోటి వాణ్ణి’ అయినా, ఇది మసక వెలుతురులో మనుషులు ఒకరినొకరు గుర్తుపట్టే సాధారణ పరిస్థితిని తెలిపే హీబ్రూ ప్రయోగం. తెలుగు వాక్యంలో ‘ఒకరు మరొకరిని’ సహజంగా ఆ భావాన్ని అందిస్తుంది; అక్షరార్థ రూపం పాదసూచికలో ఇవ్వబడింది.
- source_word: אל יוודע
  choice: తెలియకూడదు
  rationale: ప్రతికూల జస్సివ్ క్రియారూపం విషయం వెల్లడికాకూడదనే ఆజ్ఞ లేదా సంకల్పాన్ని వ్యక్తపరుస్తుంది. ‘తెలియకూడదు’ దాని పరోక్ష/కర్మణి భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: האשה
  choice: ఆ స్త్రీ
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదం ఉంది. ‘ఆ స్త్రీ’ నిర్దిష్టంగా రూతును సూచిస్తుంది; కేవలం ఏదో ఒక స్త్రీ అనే భావాన్ని ఇవ్వదు.
- source_word: הגרן
  choice: కళ్లం
  rationale: ధాన్యాన్ని నూర్చే వ్యవసాయ ప్రదేశానికి ‘కళ్లం’ సహజమైన, ప్రామాణిక తెలుగు పదం.
- source_word: ויאמר
  choice: అతడు … అన్నాడు
  rationale: హీబ్రూ క్రియలో పురుష ఏకవచన కర్త అంతర్లీనంగా ఉన్నా పేరు చెప్పబడలేదు. సందర్భం బోయజును సూచించినప్పటికీ, మూలంలోని అనిర్దిష్టతను నిలుపుతూ పేరును చేర్చలేదు.
theological_decisions:
- issue: ויאמר లో మాటలాడిన వ్యక్తి గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో ‘అతడు … అన్నాడు’ అని ఉంచడం
  alternative: స్పష్టత కోసం ‘బోయజు అన్నాడు’ అని అనువదించడం
  rationale: సందర్భం ప్రకారం మాటలాడింది బోయజే కావడం అత్యంత సాధ్యం; అయితే హీబ్రూ పాఠ్యం అతని పేరును ఇక్కడ చెప్పదు. కాబట్టి మూలానికి మించిన నిర్దిష్టతను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- issue: రూతు బోయజు కాళ్ల దగ్గర పడుకోవడంలోని నైతిక లేదా లైంగిక సూచన
  choice: స్థలాన్ని మాత్రమే తెలిపే ‘అతని కాళ్ల దగ్గర పడుకొని’ అనే పదబంధాన్ని ఉపయోగించడం
  alternative: లైంగిక సంబంధాన్ని సూచించే వివరణను చేర్చడం, లేదా అలాంటి సూచన ఏదీ లేదని వివరణాత్మకంగా నిరాకరించడం
  rationale: ఈ వచనం స్థలం, సమయం మాత్రమే స్పష్టంగా చెబుతుంది; లైంగిక చర్యను చెప్పదు, అలాగే దాని గురించి ప్రత్యేక నిరాకరణనూ ఇవ్వదు. అందువల్ల కథనంలోని నిజమైన ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. వ్యవసాయ ప్రదేశానికి సహజమైన ‘కళ్లం’ పదం ఎంచుకోబడింది. మూలంలోని కర్త అనిర్దిష్టతను, కథనంలోని నైతిక ఉద్వేగాన్ని వ్యాఖ్యానంతో పరిష్కరించలేదు.
