language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הֲ/לֹ֥א בֹ֨עַז֙ מֹֽדַעְתָּ֔/נוּ אֲשֶׁ֥ר הָיִ֖ית אֶת נַעֲרוֹתָ֑י/ו הִנֵּה ה֗וּא זֹרֶ֛ה אֶת גֹּ֥רֶן הַ/שְּׂעֹרִ֖ים הַ/לָּֽיְלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/002.yaml
  text: And now[a], is not Boaz our relative, with whose young women you have been? Look[b], he is winnowing barley at the threshing floor tonight.
translation:
  language: te
  text: ఇప్పుడు, నువ్వు అతని పనివారైన యువతులతో కలిసి ఉన్న బోయజు మన బంధువు కదా? ఇదిగో, ఈ రాత్రి అతడు కళ్లంలో యవలను తూర్పారబెడుతున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: ముందటి మాటతో అనుసంధానిస్తూ నయోమి చెప్పబోయే తదుపరి విషయాన్ని పరిచయం చేసే సహజమైన తెలుగు సంభాషణా సూచకం.
- source_word: הֲלֹא
  choice: కదా?
  rationale: అంగీకారాన్ని ఆశించే హీబ్రూ అలంకారప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֹדַעְתָּנוּ
  choice: మన బంధువు
  rationale: ఇక్కడ ఈ పదం కేవలం పరిచయస్థుణ్ణి కాకుండా కుటుంబ లేదా వంశ సంబంధమున్న వ్యక్తిని సూచిస్తుంది.
- source_word: אֲשֶׁר הָיִית אֶת נַעֲרוֹתָיו
  choice: నువ్వు అతని పనివారైన యువతులతో కలిసి ఉన్నావు
  rationale: రూతు బోయజుకు చెందిన యువ మహిళా పనివారితో కలిసి పనిచేసిన సందర్భాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; దాస్య భావాన్ని అనవసరంగా బలపరచదు.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: వెంటనే గమనించాల్సిన పరిస్థితివైపు శ్రద్ధ మళ్లించే హీబ్రూ పదబలాన్ని నిలుపుతుంది.
- source_word: זֹרֶה
  choice: తూర్పారపడుతున్నాడు
  rationale: ధాన్యాన్ని గాలికి ఎగరవేసి పొట్టును వేరుచేసే కార్యాన్ని సూచించే సాధారణ తెలుగు వ్యవసాయ పదం; హీబ్రూ కృదంతంలోని జరుగుతున్న లేదా సమీప కార్య భావాన్ని నిలుపుతుంది.
- source_word: גֹּרֶן הַשְּׂעֹרִים
  choice: కళ్లంలో యవలను
  rationale: సందర్భం ప్రకారం బోయజు తూర్పారపడేది కళ్లం కాదు, యవధాన్యం. అందువల్ల హీబ్రూ నిర్మాణంలోని ఉద్దేశిత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַלָּיְלָה
  choice: ఈ రాత్రి
  rationale: ఆ రాత్రినే సూచించే కాలవాచక భావానికి సహజమైన ఆధునిక తెలుగు సమానార్థకం.
