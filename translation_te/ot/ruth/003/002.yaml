translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గ్రామీణ వ్యవసాయ నేపథ్యాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘కళ్లం’, ‘తూర్పారపడడం’, ‘యవలు’ వంటి సందర్భోచిత పదాలు ఉపయోగించబడ్డాయి.
