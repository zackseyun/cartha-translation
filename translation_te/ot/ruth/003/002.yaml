  to: ఇప్పుడు, నువ్వు అతని పనివారైన యువతులతో కలిసి ఉన్న బోయజు మన బంధువు కదా? ఇదిగో, ఈ రాత్రి అతడు కళ్లంలో యవలను తూర్పారబెడుతున్నాడు.
  rationale: 'The revision preserves the Hebrew rhetorical question by reconnecting Ruth’s prior association with the young women to Boaz, while retaining the draft’s clear modern Telugu vocabulary and correcting the winnowing verb to a natural transitive form. No footnote is required: the Telugu wording does not introduce an unresolved ambiguity needing explanation.'
