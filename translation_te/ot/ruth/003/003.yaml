translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞాశైలిని ఉపయోగించాం. ‘నూనె రాసుకొని’ ప్రాచీన ఆచారాన్ని వ్యాఖ్యానాత్మకంగా ‘సుగంధద్రవ్యం’గా మార్చదు. ‘కళ్లం’ ధాన్యాన్ని నూర్చి, తూర్పారబట్టే స్థలానికి వాడుకలో ఉన్న సంక్షిప్త పదం. అన్ని పాదటిప్పణి సూచికలు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠంలో ఉంచబడ్డాయి.
