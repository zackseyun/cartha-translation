base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/003.yaml
  text: Wash yourself[a], anoint yourself, and put your cloak on; then go down to the threshing floor[c][b]. Do not make yourself known to the man until he has finished eating and drinking.
translation:
  language: te
  text: నీవు స్నానం చేసి[a], నూనె రాసుకొని, నీ పైవస్త్రం ధరించి[b], కళ్లానికి దిగిపో[c]. అతడు తిని తాగడం ముగించే వరకు ఆ మనిషికి నీవు కనిపించవద్దు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఒళ్లు కడుక్కొని.’ హీబ్రూ క్రియ శరీరాన్ని కడుక్కోవడాన్ని లేదా స్నానం చేయడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నీ వస్త్రం ధరించి.’ హీబ్రూ పదం సాధారణంగా వస్త్రాన్ని లేదా పైవస్త్రాన్ని సూచిస్తుంది; కొన్ని అనువాదాలు దీన్ని మరింత ప్రత్యేకంగా పండుగ వస్త్రంగా లేదా శ్రేష్ఠమైన దుస్తులుగా అర్థం చేసుకుంటాయి.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ హీబ్రూ హల్లుల పాఠంలోని రూపం అసాధారణంగా ఉంది. సందర్భాన్ని బట్టి దీనిని సాధారణంగా రూతుకు నయోమి ఇస్తున్న ఆజ్ఞ కొనసాగింపుగా, ‘కళ్లానికి దిగిపో’ అని అర్థం చేసుకుంటారు.
    reason: textual_variant
lexical_decisions:
- source_word: וְרָחַצְתְּ
  choice: నీవు స్నానం చేసి
  rationale: רחץ శరీరాన్ని కడుక్కోవడం లేదా స్నానం చేయడాన్ని సూచిస్తుంది. సందర్భంలో సహజమైన ఆధునిక తెలుగు కోసం ‘స్నానం చేసి’ ఎంచుకున్నాం; విస్తృతార్థాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: וָסַכְתְּ
  choice: నూనె రాసుకొని
  rationale: סוך నూనె లేదా లేపనం రాసుకోవడాన్ని సూచిస్తుంది. ‘సుగంధద్రవ్యం పూసుకొని’ అని ప్రత్యేకంగా అర్థం చేర్చకుండా మూలానికి దగ్గరగా ఉంటుంది.
- source_word: וְשַׂמְתְּ שמלתך עָלַיִךְ
  choice: నీ పైవస్త్రం ధరించి
  rationale: שִׂמְלָה సాధారణంగా వస్త్రాన్ని, ముఖ్యంగా కప్పుకునే పైవస్త్రాన్ని సూచిస్తుంది. మూలంలో లేని ‘మంచి బట్టలు’ లేదా ‘పండుగ వస్త్రాలు’ అనే భావాన్ని చేర్చలేదు.
- source_word: וירדתי הַגֹּרֶן
  choice: కళ్లానికి దిగిపో
  rationale: హల్లుల పాఠంలోని రూపం అసాధారణమైనప్పటికీ, సందర్భం రూతుకు నయోమి ఇస్తున్న రెండవ పురుష ఏకవచన స్త్రీలింగ ఆజ్ఞగా అర్థం చేసుకోవాలని సూచిస్తుంది. גֹּרֶןకు సహజమైన తెలుగు వ్యవసాయ పదం ‘కళ్లం’.
- source_word: אַל תִּוָּדְעִי
  choice: నీవు కనిపించవద్దు
  rationale: ידע నిఫాల్ రూపం ఇక్కడ తన ఉనికిని తెలియనివ్వకపోవడం లేదా గుర్తింపబడకపోవడం అనే భావం ఇస్తుంది. ‘కనిపించవద్దు’ సందర్భానుకూలమైన సహజ తెలుగు; కేవలం పరిచయం చేసుకోవద్దనే సంకుచిత భావాన్ని నివారిస్తుంది.
- source_word: לָאִישׁ
  choice: ఆ మనిషికి
  rationale: మూలం బోయజు పేరును వాడకుండా నిర్దిష్టమైన ‘మనిషి’ అని చెబుతుంది. ‘ఆ మనిషి’ అదే నిర్దిష్టతను నిలుపుతుంది.
- source_word: עַד כַּלֹּתוֹ לֶאֱכֹל וְלִשְׁתּוֹת
  choice: అతడు తిని తాగడం ముగించే వరకు
  rationale: כלהతో కూడిన క్రియారూపాలు తినడం, తాగడం పూర్తయ్యే సమయాన్ని సూచిస్తాయి; ఈ తెలుగు నిర్మాణం ఆ కాలసంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
