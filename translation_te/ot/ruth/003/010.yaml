    rationale: ఇది దయను కేవలం గొప్పగా కనిపించేలా చేసిందనే అర్థం ఇవ్వవచ్చు. హీబ్రూ వాక్యం ఆమె తరువాతి దయ ముందరిదానికంటే గొప్పదైందని చెబుతుంది; ‘మరింత గొప్పదిగా చేశావు’ ఆ భావాన్ని నేరుగా ఇస్తుంది.
