  to: 'అప్పుడు అతడు ఇలా అన్నాడు: “నా కుమార్తె, యాహ్వే నిన్ను ఆశీర్వదించుగాక! పేదవారైనా ధనవంతులైనా యువకుల వెంట వెళ్లకుండా ఉండడం ద్వారా, నీ మొదటి దయకంటే నీ ఈ చివరి దయను[a] మరింత గొప్పదిగా చేశావు.”'
  rationale: దైవనామాన్ని POB యొక్క ‘Yahweh’ నిర్ణయానికి అనుగుణంగా ‘యాహ్వే’గా మార్చాం. అలాగే, ‘చూపించావు’ స్థానంలో ‘గొప్పదిగా చేశావు’ను ఉంచి, రూతు చేసిన తరువాతి దయ ముందరిదానికంటే శ్రేష్ఠమైనదని చెప్పే హీబ్రూ తులనాత్మక భావాన్ని కాపాడాం. పాదసూచిక గుర్తును సంబంధిత పదం వద్దకు తరలించాం.
