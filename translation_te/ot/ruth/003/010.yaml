id: RUT.3.10
reference: Ruth 3:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר בְּרוּכָ֨ה אַ֤תְּ לַֽ/יהוָה֙ בִּתִּ֔/י הֵיטַ֛בְתְּ חַסְדֵּ֥/ךְ הָ/אַחֲר֖וֹן מִן הָ/רִאשׁ֑וֹן לְ/בִלְתִּי לֶ֗כֶת אַחֲרֵי֙ הַ/בַּ֣חוּרִ֔ים אִם דַּ֖ל וְ/אִם עָשִֽׁיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/010.yaml
  text: And he said[a], “May you be blessed by Yahweh, my daughter. You have made this last kindness greater than the first by not going after the young men, whether poor or rich.”
translation:
  language: te
  text: 'అప్పుడు అతడు ఇలా అన్నాడు: “నా కుమార్తె, యాహ్వే నిన్ను ఆశీర్వదించుగాక! పేదవారైనా ధనవంతులైనా యువకుల వెంట వెళ్లకుండా ఉండడం ద్వారా, నీ మొదటి దయకంటే నీ ఈ చివరి దయను[a] మరింత గొప్పదిగా చేశావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దయ” అని అనువదించిన హీబ్రూ పదానికి “నిబద్ధ ప్రేమ,” “విశ్వసనీయత,” లేదా “ఒడంబడిక నిష్ఠ” అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוּכָה אַתְּ לַיהוָה
  choice: యెహోవా నిన్ను ఆశీర్వదించుగాక
  rationale: స్త్రీలింగ ఏకవచన విశేషణ రూపంలో ఉన్న ఆశీర్వాద సూత్రానికి సహజమైన తెలుగు ఆశీర్వచన రూపం; దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా ఉంచుతుంది.
- source_word: בִּתִּי
  choice: నా కుమార్తె
  rationale: బోయజు రూతును ప్రేమపూర్వకంగా, వయస్సులో లేదా సామాజిక స్థితిలో పెద్దవాడిగా సంబోధిస్తున్న కుటుంబ రూపకాన్ని కాపాడుతుంది.
- source_word: הֵיטַבְתְּ
  choice: మరింత గొప్పగా చూపించావు
  rationale: హిఫీల్ రూపంలోని తులనాత్మక భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; రూతు చేసిన తరువాతి కార్యం మొదటిదానిని మించిందని సూచిస్తుంది.
- source_word: חַסְדֵּךְ
  choice: నీ ... దయ
  rationale: ఈ కథన సందర్భంలో ఉదారతతో కూడిన నిబద్ధతను సహజంగా తెలియజేస్తుంది; పదంలోని విశ్వసనీయ ప్రేమ, నిష్ఠ వంటి విస్తృత భావాలను పాదసూచికలో ఉంచుతుంది.
- source_word: הָאַחֲרוֹן מִן הָרִאשׁוֹן
  choice: నీ మొదటి దయకంటే ఈ చివరి దయను
  rationale: రూతు ఇంతకుముందు చూపిన దయతో ప్రస్తుతం చేసిన కార్యాన్ని పోల్చే హీబ్రూ నిర్మాణాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: לְבִלְתִּי לֶכֶת אַחֲרֵי
  choice: వెంట వెళ్లకుండా ఉండడం ద్వారా
  rationale: ఆమె తరువాతి దయ ఏ విధంగా గొప్పదో వివరించే అవ్యయార్థక నిర్మాణాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: הַבַּחוּרִים
  choice: యువకులు
  rationale: వివాహానికి తగిన వయస్సులోని యువ పురుషులను సూచిస్తుంది; బోయజుతో పోల్చి ‘చిన్నవారు’ అని మూలంలో లేని అంశాన్ని అతిగా స్పష్టం చేయదు.
- source_word: אִם דַּל וְאִם עָשִׁיר
  choice: పేదవారైనా ధనవంతులైనా
  rationale: యువకుల ఆర్థిక స్థితిలోని రెండు అంచులను సూచించే సమగ్ర ప్రయోగాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని తెలుగు పాఠకులకు సుపరిచితమైన వ్యక్తినామ రూపంలో ఉంచి, ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయదు.
theological_decisions:
- issue: కథన ప్రశంసలో חֶסֶד పదం అనువాదం
  choice: దయ
  alternative: నిబద్ధ ప్రేమ; విశ్వసనీయత; ఒడంబడిక నిష్ఠ
  rationale: ఇక్కడ రూతు నయోమి కుటుంబం పట్ల చేసిన ఉదారమైన, నిబద్ధమైన కార్యాన్ని బోయజు ప్రశంసిస్తున్నాడు. ‘దయ’ కథనంలో సహజంగా ఉండగా, మూలపదంలోని నిష్ఠాపూర్వక ప్రేమ భావాన్ని పాదసూచిక కాపాడుతుంది.
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. తెలుగులో స్థిరంగా గుర్తించదగిన ‘యెహోవా’ రూపం దానిని బిరుదుగా మార్చకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. బోయజు పలికిన ఆశీర్వచనం సహజంగా ఉండేలా ‘ఆశీర్వదించుగాక’ వాడబడింది. חֶסֶד యొక్క భావవిస్తృతిని ప్రధాన పాఠంలో అతిగా వ్యాఖ్యానించకుండా పాదసూచికలో కాపాడాం.
