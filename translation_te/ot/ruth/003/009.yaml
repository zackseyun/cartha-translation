  yaml_path: translation/ot/ruth/003/009.yaml
  text: He said[a], “Who are you?” And she said, “I am Ruth, your servant. Spread your wing over your servant[b], for you are a redeemer.”
translation:
  language: te
  text: అతడు, “నీవెవరు?” అని అడిగాడు. ఆమె, “నేను రూతును, నీ దాసురాలిని. నీ రెక్కను నీ దాసురాలిపై విస్తరించు[a]; ఎందుకంటే నీవు విమోచకుడవు[b]” అని చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ వస్త్రపు అంచును నీ దాసురాలిపై విస్తరించు.” హీబ్రూ పదానికి “రెక్క” అనే అర్థమూ వస్త్రపు అంచు అనే అర్థమూ ఉండవచ్చు. ఇక్కడ అది రక్షణనూ వివాహ సంబంధ అభ్యర్థననూ ఉద్దేశపూర్వకంగా సూచించి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “బంధు విమోచకుడు.” అంటే, బంధువు తరఫున చర్య తీసుకునే కుటుంబ బాధ్యతగల బంధువు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי אָתּ
  choice: నీవెవరు?
  rationale: వ్యక్తిని గుర్తించేందుకు వేసిన నేర ప్రశ్నను సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా అందిస్తుంది.
- source_word: אָנֹכִי רוּת
  choice: నేను నీ దాసురాలైన రూతును
  rationale: హీబ్రూ నామవాచక వాక్యాన్ని సహజ తెలుగు గుర్తింపు వాక్యంగా మార్చి, వెంట వచ్చే వినయపూర్వక స్వపరిచయంతో అనుసంధానిస్తుంది.
- source_word: אֲמָתֶךָ / אֲמָתְךָ
  choice: నీ దాసురాలు / నీ దాసురాలి
  rationale: אמה స్త్రీ సేవకురాలిని సూచిస్తుంది. ‘దాసురాలు’ రూతు వినయపూర్వక స్వపరిచయాన్ని స్పష్టంగా ఉంచి, రెండు సందర్భాల్లోనూ ఒకే మూలపద సంబంధాన్ని కాపాడుతుంది.
- source_word: וּפָרַשְׂתָּ
  choice: పరచు
  rationale: ఒక వస్తువును మరొకరి మీద విస్తరింపజేయడం అనే క్రియార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘రెక్క’తోనూ వస్త్రపు అంచుతోనూ సరిపోతుంది.
- source_word: כְנָפֶךָ
  choice: నీ రెక్కను
  rationale: כנף యొక్క ప్రాథమిక ‘రెక్క’ చిత్రాన్ని నిలుపుతుంది. అదే పదానికి వస్త్రపు అంచు అనే భావమూ ఉండటంతో, ఆ ఉద్దేశపూర్వక ద్వంద్వార్థాన్ని పాదటీపులో కాపాడింది.
- source_word: עַל
  choice: మీద
  rationale: కప్పడం లేదా రక్షణగా విస్తరించడం అనే సందర్భానికి సహజమైన తెలుగు సంబంధబోధకం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: రూతు చేసిన అభ్యర్థనకు కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: גֹאֵל
  choice: విమోచకుడు
  rationale: גאל మూలంలోని విడిపించడం, తిరిగి స్వాధీనం చేయడం అనే ప్రధాన భావాన్ని కాపాడే కీలక పదం. రూతు గ్రంథంలో ఉన్న కుటుంబ-చట్టబద్ధ పాత్రను పాదటీపు వివరిస్తుంది.
theological_decisions:
- issue: ‘నీ రెక్క’ అనే రూపకం యొక్క ద్వంద్వ సూచన
  choice: ప్రధాన పాఠ్యంలో ‘నీ రెక్కను’ అని ఉంచడం
  alternative: ‘నీ వస్త్రపు అంచును’ అని అనువదించడం
  rationale: హీబ్రూ పదం రక్షణనిచ్చే రెక్కను, వస్త్రపు అంచును రెండింటినీ సూచించగలదు. ‘రెక్క’ను ప్రధాన పాఠ్యంలో ఉంచడం ద్వారా రక్షణ చిత్రణను కాపాడుతూ, వివాహ సంబంధ అభ్యర్థనను పాదటీపులో తెలియజేసి మూలంలోని సాహిత్యపరమైన ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
- issue: גֹאֵל యొక్క కుటుంబ-చట్టబద్ధ భావం
  choice: ప్రధాన పాఠ్యంలో ‘విమోచకుడు’
  alternative: ‘బంధు విమోచకుడు’ లేదా ‘కుటుంబ విమోచకుడు’
  rationale: ‘విమోచకుడు’ మూలపదంలోని కీలక పునరుద్ధరణ భావాన్ని సంక్షిప్తంగా కాపాడుతుంది. అయితే ఈ కథలో అది సమీప బంధువు నిర్వహించాల్సిన గుర్తింపు పొందిన కుటుంబ బాధ్యతను సూచిస్తుందని పాదటీపు స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. రూతు వినయపూర్వక స్వపరిచయానికి ‘దాసురాలు’ను ఎంచుకున్నారు. ‘రెక్క’ మరియు ‘విమోచకుడు’ వంటి కీలక పదాలను ప్రధాన పాఠ్యంలో నిలిపి, వాటి సందర్భానుగుణ ప్రత్యామ్నాయ భావాలను పాదటీపుల్లో వివరించారు.
