id: RUT.3.7
reference: Ruth 3:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אכַל בֹּ֤עַז וַ/יֵּשְׁתְּ֙ וַ/יִּיטַ֣ב לִבּ֔/וֹ וַ/יָּבֹ֕א לִ/שְׁכַּ֖ב בִּ/קְצֵ֣ה הָ/עֲרֵמָ֑ה וַ/תָּבֹ֣א בַ/לָּ֔ט וַ/תְּגַ֥ל מַרְגְּלֹתָ֖י/ו וַ/תִּשְׁכָּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/007.yaml
  text: And Boaz ate and drank[a], and his heart was merry, and he went to lie down at the end of the grain heap. Then she came quietly, uncovered his feet[b], and lay down.
translation:
  language: te
  text: బోయజు తిని తాగి, అతని మనస్సు ఉల్లాసపడింది. అతడు ధాన్యపు కుప్ప చివర పడుకోవడానికి వెళ్లాడు. అప్పుడు ఆమె నిశ్శబ్దంగా వచ్చి, అతని పాదాలను బయటపెట్టి[b], పడుకుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: అక్షరార్థంగా, “అతని పాదాలను బయటపెట్టింది.” కొందరు దీన్ని సాధారణమైన ప్రత్యక్ష చర్యగా అర్థం చేసుకుంటారు; మరికొందరు ఇందులో సూచనాత్మక అంతర్భావం ఉండవచ్చని భావిస్తారు. హీబ్రూ మాటలు సంయమనంతోనే ఉన్నాయి; లైంగిక చర్యను స్పష్టంగా వర్ణించవు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאכַל בֹּעַז וַיֵּשְׁתְּ
  choice: బోయజు తిని, తాగిన తరువాత
  rationale: హీబ్రూ వరుస కథన క్రియలను సహజమైన తెలుగు కథన ప్రవాహంలో కాలసంబంధంగా వ్యక్తం చేస్తుంది; తినడం, తాగడం రెండింటినీ స్పష్టంగా నిలుపుతుంది.
- source_word: וַיִּיטַב לִבּוֹ
  choice: అతని హృదయం ఉల్లాసంగా ఉంది
  rationale: ‘అతని హృదయం మంచిగా/హాయిగా అయింది’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు రూపం. ఇది సంతోషకరమైన మనస్థితిని సూచిస్తుంది గాని మత్తును తప్పనిసరిగా సూచించదు.
- source_word: וַיָּבֹא לִשְׁכַּב
  choice: పడుకోవడానికి వెళ్లాడు
  rationale: שׁכב యొక్క ‘పడుకోవడం’ అనే అర్థాన్ని కాపాడుతూ, నిద్రపోయాడని పాఠ్యంలో లేని విషయాన్ని చేర్చదు; కథకుని దృష్టిలో בוא యొక్క గమనాన్ని తెలుగులో సహజంగా ‘వెళ్లాడు’ అని అందిస్తుంది.
- source_word: בִּקְצֵה הָעֲרֵמָה
  choice: ధాన్యపు కుప్ప చివర
  rationale: קצה యొక్క చివర/అంచు భావాన్నీ, నూర్పిడి స్థల సందర్భంలో עֲרֵמָה సూచించే ధాన్యపు కుప్పనూ స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַלָּט
  choice: నిశ్శబ్దంగా
  rationale: ఆమె ఎవరికీ తెలియకుండా, శబ్దం చేయకుండా వచ్చిన భావాన్ని సహజంగా ఇస్తుంది; అనవసరమైన నైతిక తీర్పును చేర్చదు.
- source_word: וַתְּגַל מַרְגְּלֹתָיו
  choice: అతని పాదాల దగ్గర కప్పును తొలగించి
  rationale: హీబ్రూ పదబంధంలోని ‘అతని పాదాలను బయటపెట్టింది’ అనే దృశ్యాన్ని తెలుగులో అర్థమయ్యేలా వ్యక్తం చేస్తుంది. కప్పు అనే పదం సందర్భంలో అంతర్భూతమైన చర్యను స్పష్టం చేస్తుంది; సూచనాత్మక భావాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా నిర్ధారించదు.
- source_word: וַתִּשְׁכָּב
  choice: పడుకుంది
  rationale: ‘పడుకోవడం’ అనే సరళమైన అర్థాన్ని నిలుపుతుంది; లైంగిక చర్యను పాఠ్యంలో లేనివిధంగా చేర్చదు.
theological_decisions:
- issue: రూతు చేసిన పనుల్లో లైంగిక చర్యను సూచించాలా
  choice: ప్రధాన పాఠ్యంలో నియంత్రితమైన, ప్రత్యక్ష చర్యల వివరణనే ఉంచడం
  alternative: మోహపరచడం లేదా లైంగిక సంబంధాన్ని సూచించేలా వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: హీబ్రూ రూతు నిశ్శబ్దంగా రావడం, బోయజు పాదాల భాగాన్ని బయటపెట్టడం, పడుకోవడం మాత్రమే చెబుతుంది. లైంగిక చర్యను స్పష్టంగా చెప్పదు కాబట్టి అనువాదం ఆ ఉద్దేశపూర్వక సంయమనాన్నీ సాధ్యమైన అంతర్భావాన్నీ అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ నుడికారాన్ని సాధ్యమైనంత వరకు నిలుపుతూ, అస్పష్టతను పాదటిప్పణుల్లో వివరిస్తుంది. ప్రధాన పాఠ్యంలో అనవసరంగా మత్తు లేదా లైంగిక చర్యను చేర్చలేదు.
