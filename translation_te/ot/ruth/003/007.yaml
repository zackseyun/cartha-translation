- from: బోయజు తిని, తాగిన తరువాత[a], అతని హృదయం ఉల్లాసంగా ఉంది. అతడు ధాన్యపు కుప్ప చివర పడుకోవడానికి వెళ్లాడు. అప్పుడు ఆమె నిశ్శబ్దంగా వచ్చి, అతని పాదాల దగ్గర కప్పును తొలగించి[b], పడుకుంది.
  to: బోయజు తిని తాగి, అతని మనస్సు ఉల్లాసపడింది. అతడు ధాన్యపు కుప్ప చివర పడుకోవడానికి వెళ్లాడు. అప్పుడు ఆమె నిశ్శబ్దంగా వచ్చి, అతని పాదాలను బయటపెట్టి[b], పడుకుంది.
  rationale: 'The revision corrects the object of Ruth''s action: she uncovers Boaz''s feet rather than removing a covering near them. It also uses an idiomatic past Telugu expression for Boaz''s cheerful state. Footnote a is removed because its anchor in the draft followed “తరువాత,” while the revised text does not require a note there; the main text itself adequately conveys the Hebrew idiom without asserting drunkenness. Footnote b remains anchored to the directly rendered action and preserves the source''s interpretive ambiguity.'
