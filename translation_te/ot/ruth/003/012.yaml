id: RUT.3.12
reference: Ruth 3:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּה֙ כִּ֣י אָמְנָ֔ם כִּ֥י אם גֹאֵ֖ל אָנֹ֑כִי וְ/גַ֛ם יֵ֥שׁ גֹּאֵ֖ל קָר֥וֹב מִמֶּֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/012.yaml
  text: And now[a], it is true that I am a redeemer[b], yet there is also a redeemer closer than I.
translation:
  language: te
  text: ఇప్పుడు, నిజమే, నేను విమోచన హక్కుగల బంధువునే[a]; అయితే నాకంటే దగ్గరి బంధువు[b] మరొకడు ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం కుటుంబ విమోచనకు సంబంధించిన గుర్తింపుపొందిన బాధ్యతలు గల సమీప బంధువును సూచిస్తుంది. దీనిని ‘బంధు-విమోచకుడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘దగ్గరి’ అంటే భౌతికంగా దగ్గరగా ఉన్నాడని కాదు; కుటుంబ విమోచన హక్కుల క్రమంలో బోయజుకంటే మరింత సమీప బంధువు అని అర్థం.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: వావ్ సంధానార్థాన్ని తెలుగులో వాక్యప్రవాహం ద్వారా సహజంగా వ్యక్తం చేస్తూ, עַתָּה యొక్క కాలసూచక-ప్రసంగ మార్పు భావాన్ని ‘ఇప్పుడు’ నిలుపుతుంది.
- source_word: כִּי אָמְנָם כִּי אִם
  choice: …అన్నది నిజం
  rationale: ఈ కలయిక బోయజు ముందుగా ఒక విషయాన్ని నిజమని అంగీకరించి, వెంటనే దానికి పరిమితి విధించే నిర్మాణం. ‘అన్నది నిజం’ ఆధునిక తెలుగులో ఆ అంగీకార భావాన్ని సహజంగా అందిస్తుంది.
- source_word: גֹאֵל
  choice: విమోచించే హక్కుగల బంధువు
  rationale: గֹאֵל ఇక్కడ సాధారణ ఆధ్యాత్మిక ‘విమోచకుడు’ కాదు; కుటుంబ ఆస్తి, వంశ బాధ్యతలకు సంబంధించిన హక్కులు, కర్తవ్యాలు గల సమీప బంధువు. సందర్భార్థాన్ని స్పష్టంగా, అయినా అతిగా చట్టపరంగా కాకుండా ఈ పదబంధం తెలియజేస్తుంది.
- source_word: אָנֹכִי
  choice: నేను … నే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగులో ‘నేను’తో పాటు ‘-నే’ నిశ్చయార్థకం ద్వారా ప్రతిబింబిస్తుంది.
- source_word: וְגַם יֵשׁ
  choice: అయితే … మరొకడు ఉన్నాడు
  rationale: వావ్ మరియు גַּם కలిపి ముందటి అంగీకారానికి పరిమితి విధిస్తూ ఇంకొక వ్యక్తి ఉన్నాడని జోడిస్తాయి. ‘అయితే’ వ్యత్యాసాన్ని, ‘మరొకడు’ అదనపు వ్యక్తిని సహజంగా సూచిస్తాయి.
- source_word: קָרוֹב מִמֶּנִּי
  choice: నాకంటే దగ్గరి బంధువు
  rationale: קָרוֹב యొక్క మూల ‘దగ్గర’ భావాన్ని నిలుపుతూ, ఈ సందర్భంలో అది స్థలదూరం కాక బంధుత్వ సమీపతను సూచిస్తుందని ‘బంధువు’ స్పష్టం చేస్తుంది.
theological_decisions:
- issue: కుటుంబ-చట్ట సందర్భంలో גֹאֵל అనువాదం
  choice: విమోచించే హక్కుగల బంధువు
  alternative: విమోచకుడు; సమీప బంధువు; బంధు-విమోచకుడు
  rationale: రూతు కథలో ఈ పదం కుటుంబ ఆస్తి మరియు వంశ పరిరక్షణకు సంబంధించిన గుర్తింపు పొందిన బంధుత్వ పాత్రను సూచిస్తుంది. కేవలం ‘విమోచకుడు’ అంటే ఆధ్యాత్మిక అర్థం ప్రధానంగా వినిపించే అవకాశం ఉంది; ‘సమీప బంధువు’ అంటే విమోచన హక్కు, బాధ్యత కనిపించదు. ఎంచుకున్న పదబంధం రెండింటినీ కలిపి చెబుతుంది, కానీ ఆ వ్యక్తి తప్పక చర్య తీసుకోవాల్సిందేనని అతిగా నిర్ణయించదు.
- issue: קָרוֹב యొక్క సమీపత స్వభావం
  choice: బంధుత్వ క్రమంలో మరింత దగ్గరి వ్యక్తి
  alternative: భౌతికంగా దగ్గరలో ఉన్న వ్యక్తి
  rationale: కథా మరియు చట్టపర సందర్భం బంధుత్వ సమీపతను సూచిస్తుంది. అందువల్ల ప్రధాన పాఠ్యంలో ‘దగ్గరి బంధువు’ అని ఇచ్చి, కుటుంబ విమోచన హక్కుల క్రమాన్ని పాదటిప్పణిలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘విమోచకుడు’ అనే మతపరంగా విస్తృతమైన పదాన్ని ఒంటరిగా వాడకుండా, ప్రాచీన ఇశ్రాయేలు కుటుంబ-చట్ట సందర్భాన్ని ప్రధాన పాఠ్యంలోనే సంక్షిప్తంగా స్పష్టం చేశాం. రెండు పాదటిప్పణి గుర్తులు [a], [b] ప్రధాన పాఠ్యంలో ఉన్నాయి.
