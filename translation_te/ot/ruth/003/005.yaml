  text: And she said to her[a], “All that you say, I will do.”
translation:
  language: te
  text: అప్పుడు రూతు నయోమితో ఇలా అంది, “మీరు చెప్పేదంతా నేను చేస్తాను.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు చెప్పే ప్రతిదీ నేను చేస్తాను.”
    reason: ‘చెప్పేదంతా’కు సంపూర్ణతను వ్యక్తం చేసే సమానార్థక ప్రత్యామ్నాయం; ఆంగ్ల POB audit trail‌లోని lexical alternative‌ను ప్రతిబింబిస్తుంది.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అంది
  rationale: వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపే సాధారణ భూతకాల క్రియ; తెలుగు ప్రత్యక్ష సంభాషణలో వాక్యాంతంలోని ‘అంది’ సహజంగా ఉంటుంది.
- source_word: אֵלֶיהָ
  choice: ఆమెతో
  rationale: אֶל‌కు జతైన మూడవ పురుష ఏకవచన స్త్రీలింగ ప్రత్యయం సంభాషణ ఎవరిని ఉద్దేశించిందో చూపుతుంది; ‘ఆమెతో’ ఆధునిక తెలుగులో సహజమైన ప్రయోగం.
- source_word: כֹּל אֲשֶׁר
  choice: చెప్పేదంతా
  rationale: ఈ పదబంధం సంబంధ వాక్యంతో కూడిన సంపూర్ణతను వ్యక్తం చేస్తుంది; ‘అంతా’ మొత్తం సూచనలను సమగ్రంగా పాటిస్తాననే భావాన్ని నిలుపుతుంది.
- source_word: תֹּאמְרִי
  choice: నువ్వు చెప్పేది
  rationale: కాల్ ఇంపర్ఫెక్ట్ ద్వితీయ పురుష ఏకవచన స్త్రీలింగ రూపం నయోమి చెప్పే సూచనలను సూచిస్తుంది; తెలుగులో ‘చెప్పేది’ ఈ సందర్భంలో సహజంగా ఉంటుంది, మూలంలో లేని ‘నాకు’ అనే కర్మను చేర్చదు.
- source_word: אֶעֱשֶׂה
  choice: చేస్తాను
  rationale: కాల్ ఇంపర్ఫెక్ట్ ప్రథమ పురుష ఏకవచన రూపం రూతు సంకల్పాన్ని వ్యక్తం చేస్తుంది; ‘చేస్తాను’ ప్రత్యక్షమైన, సహజమైన అనువాదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ప్రత్యక్ష సంభాషణను ఉపయోగించాం. హెబ్రీ కథన సంధిని ప్రతిబింబించేందుకు ‘అందుకు’ను ఉంచి, స్త్రీ పాత్రలిద్దరినీ సూచించే సర్వనామాల వల్ల ఏర్పడే స్వల్ప పునరుక్తిని సందర్భానుగుణంగా నిలిపాం.
