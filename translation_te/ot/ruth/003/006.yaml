  text: So she went down to the threshing floor and did according to all that her mother-in-law had commanded her[a].
translation:
  language: te
  text: అప్పుడు ఆమె నూర్పిడి కళ్లానికి దిగిపోయి, తన అత్త తనకు ఆజ్ఞాపించినదంతా చేసింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అప్పుడు ఆమె నూర్పిడి కళ్లానికి దిగిపోయి, తన అత్త తనకు ఆదేశించినట్లుగా అంతా చేసింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶד
  choice: వెళ్లి
  rationale: ירד అనే క్రియలోని దిగువకు వెళ్లే భావం సందర్భంలో ఉన్నప్పటికీ, తెలుగు కథనంలో గమ్యస్థానానికి ‘వెళ్లి’ అనడం సహజం; ‘దిగి వెళ్లి’ అని అనవసరంగా భారంగా చేయలేదు.
- source_word: הַגֹּרֶן
  choice: నూర్పిడి కళ్లానికి
  rationale: גֹּרֶן ధాన్యాన్ని నూర్చే లేదా తొక్కించే ప్రదేశాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘నూర్పిడి కళ్లం’ వ్యవసాయ సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది; నిర్దిష్టతను సందర్భం, విభక్తి సహజంగా మోస్తాయి.
- source_word: וַתַּעַשׂ
  choice: చేసింది
  rationale: עשה యొక్క విస్తృతమైన ‘చేయు’ భావాన్ని, తరువాతి ‘ఆజ్ఞాపించినదంతా’ అనే నిర్మాణంతో సహజంగా కలిపే సరళ సమానార్థకం.
- source_word: כְּכֹל אֲשֶׁר
  choice: ఆజ్ఞాపించినదంతా
  rationale: ఈ నిర్మాణం ముందుగా ఇచ్చిన ఆదేశాలన్నిటికీ అనుగుణంగా చేయడాన్ని సూచిస్తుంది. తెలుగులో సంబంధవాచక నిర్మాణంతో ‘అంతా’ సంపూర్ణతను సహజంగా కాపాడుతుంది.
- source_word: צִוַּתָּה
  choice: ఆజ్ఞాపించిన
  rationale: צוה సాధారణంగా ఆజ్ఞాపించడం అనే బలమైన భావం కలిగి ఉంది. ‘చెప్పిన’ లేదా ‘సూచించిన’ కంటే మూలంలోని అధికారపూర్వకతను ఇది మెరుగ్గా కాపాడుతుంది.
- source_word: חֲמוֹתָהּ
  choice: తన అత్త
  rationale: ఈ బంధుత్వ పదం రూతు అత్తయైన నయోమిని సూచిస్తుంది. తెలుగు వాడుకలో కోడలి దృష్టితో ‘అత్త’ సహజం; ‘తన’ ప్రత్యావర్తక స్వామ్యాన్ని స్పష్టం చేస్తుంది.
- source_word: וַ
  choice: అప్పుడు
  rationale: ప్రారంభ వావ్ కథన పరంపరను కొనసాగిస్తుంది. ఆధునిక తెలుగులో ‘అప్పుడు’ వరుసగా జరిగిన చర్యను సహజంగా సూచిస్తుంది; కారణార్థాన్ని అనవసరంగా జోడించదు.
