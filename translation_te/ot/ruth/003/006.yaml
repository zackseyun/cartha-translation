translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని వరుస చర్యలు, ఆజ్ఞ యొక్క బలం, ‘అంతా’ అనే సమగ్రత కాపాడబడ్డాయి. అడుగుట దిశను తెలుగులో అసహజంగా బలపరచకుండా గమ్యచలనంగా అనువదించాం.
