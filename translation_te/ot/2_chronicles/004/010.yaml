  yaml_path: translation/ot/2_chronicles/004/010.yaml
  text: And he set the Sea at the southeast side[a], facing south.
translation:
  language: te
  text: అతడు సముద్రాన్ని ఆగ్నేయ వైపున[a], దక్షిణానికి ఎదురుగా ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, “కుడి వైపున తూర్పుగా, దక్షిణానికి ఎదురుగా” అని ఉంది. హీబ్రూ దిక్సూచనలో సాధారణంగా తూర్పుకు ముఖం చేసినట్లు భావిస్తారు; అందువల్ల కుడి వైపు దక్షిణాన్ని సూచిస్తుంది. దానితో “తూర్పుగా” అనే మాట కలసి ఆగ్నేయ వైపును సూచిస్తుంది.
    reason: మూలంలోని దిక్సూచన పదబంధానికి అక్షరార్థ రూపాన్ని, ‘ఆగ్నేయం’ అనే సందర్భోచిత అనువాదానికి కారణాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וְאֶת
  choice: అతడు …ని
  rationale: וְ వాక్యాన్ని ముందున్న సందర్భంతో అనుసంధానిస్తుంది; אֵת ప్రత్యక్ష కర్మను సూచిస్తుంది. తెలుగులో కర్మవిభక్తి ద్వారా దానిని వ్యక్తం చేశాం; సహజమైన వాక్యప్రవాహం కోసం సంధికార్థాన్ని ప్రత్యేకంగా అనువదించలేదు.
- source_word: הַיָּם
  choice: సముద్రం
  rationale: ఇది దేవాలయంలోని పెద్ద కంచు నీటితొట్టికి వాడిన స్థిరమైన హీబ్రూ పేరు. ‘నీటితొట్టి’ అని వివరణాత్మకంగా మార్చకుండా మూలంలోని రూపక నామాన్ని నిలిపాం.
- source_word: נָתַן
  choice: ఉంచాడు
  rationale: ఒక వస్తువును నిర్దిష్ట స్థలంలో అమర్చడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מִכֶּתֶף הַיְמָנִית קֵדְמָה
  choice: ఆగ్నేయ వైపున
  rationale: כָּתֵף స్థలవర్ణనలో ‘వైపు/పక్క’ అని అర్థం; తూర్పుకు ముఖం చేసి దిక్కులను చెప్పే హీబ్రూ పద్ధతిలో ‘కుడి’ దక్షిణాన్ని సూచిస్తుంది, కֵדְמָה తూర్పు దిశను జోడిస్తుంది. ఈ రెండింటి సంయుక్త స్థలార్థం ‘ఆగ్నేయం’.
- source_word: מִמּוּל נֶגְבָּה
  choice: దక్షిణానికి ఎదురుగా
  rationale: מִמּוּל లోని ఎదురుదిశ లేదా అభిముఖ సంబంధాన్ని, נֶגְבָּה లోని దక్షిణ దిశను సాధ్యమైనంత ప్రత్యక్షంగా నిలిపే అనువాదం.
