  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. దేవాలయ పాత్రకు మూలంలోని ప్రత్యేక నామాన్ని నిలిపేందుకు ‘సముద్రం’ అని అనువదించాం. సంక్లిష్టమైన హీబ్రూ దిక్సూచనను ప్రధాన వాక్యంలో స్పష్టంగా ఇచ్చి, దాని అక్షరార్థాన్ని పాదటిప్పణిలో సంరక్షించాం.
