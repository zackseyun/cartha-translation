id: 2CH.4.16
reference: 2 Chronicles 4:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת הַ֠/סִּירוֹת וְ/אֶת הַ/יָּעִ֤ים וְ/אֶת הַ/מִּזְלָגוֹת֙ וְ/אֶת כָּל כְּלֵי/הֶ֔ם עָשָׂ֞ה חוּרָ֥ם אָבִ֛יו לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה נְחֹ֖שֶׁת מָרֽוּק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/016.yaml
  text: And Huram-abi made the pots[a], the shovels, the forks, and all their utensils for King Solomon, for the house of Yahweh[c][b], of polished bronze.
translation:
  language: te
  text: హూరామ్-అబీ[a] రాజు సొలొమోను కోసం, యాహ్వే మందిరం కోసం కుండలను, పారలను, ముళ్లుగల కొంకులను, వాటి ఉపకరణాలన్నిటినీ మెరుగుపెట్టిన కంచుతో[b] చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీ: “హూరామ్-అబీ”; అక్షరార్థంగా “హూరాము, అతని తండ్రి” అని కూడా అనువదించవచ్చు. అయితే ఇక్కడ ఇది శిల్పి పేరు లేదా బిరుదు అయి ఉండవచ్చు.'
    reason: alternative_reading
  - marker: b
    text: లేదా “మెరుగు దిద్దిన కంచుతో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירוֹת
  choice: కుండలను
  rationale: సִירוֹת అనేది సాధారణంగా కుండలు లేదా వంట పాత్రలను సూచిస్తుంది; ఆలయ సామగ్రి జాబితాలో ‘కుండలు’ సహజమైన, స్పష్టమైన పదం.
- source_word: הַיָּעִים
  choice: పారలను
  rationale: יָעִים బూడిదను లేదా నిప్పులను తొలగించడానికి ఉపయోగించే పారలవంటి పనిముట్లను సూచిస్తుంది; మూలంలో లేని ‘బూడిద’ అనే వివరణను ప్రధాన పాఠ్యంలో చేర్చకుండా ‘పారలు’ అని అనువదించాం.
- source_word: הַמִּזְלָגוֹת
  choice: ముళ్ల కొంకులను
  rationale: מִזְלָגוֹת ముళ్లు లేదా పళ్లు గల కొంకులవంటి పనిముట్లను సూచిస్తుంది. సాధారణ భోజనపు ఫోర్కులు అనే అపార్థం రాకుండా ఈ సందర్భానికి తగిన పదబంధం ఎంచుకున్నాం.
- source_word: כָּל כְּלֵיהֶם
  choice: వాటి ఉపకరణాలన్నిటినీ
  rationale: כְּלִי పాత్రలు, పనిముట్లు, ఉపకరణాలు అనే విస్తృత అర్థం కలిగిన పదం. ‘వాటి’ అనే సర్వనామం హెబ్రీలోని ‘వాటి/వారి’ భావాన్ని నిలుపుతూ, ముందున్న ఆలయ సామగ్రికి సంబంధించిన ఉపకరణాలను సూచిస్తుంది.
- source_word: חוּרָם אָבִיו
  choice: హూరామ్-అబీ
  rationale: ఈ సందర్భంలో אָבִיוను అక్షరార్థంగా ‘అతని తండ్రి’ అని కాక, శిల్పి పేరు లేదా బిరుదులో భాగంగా తీసుకోవడం సందర్భోచితం. అయితే అక్షరార్థ పఠనాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: రాజైన సొలొమోను కోసం
  rationale: లామెద్ ఇక్కడ సొలొమోను ఆజ్ఞ లేదా సేవ నిమిత్తం చేసిన పనిని సూచిస్తుంది; ‘కోసం’ ఆ సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְבֵית יְהוָה
  choice: యెహోవా మందిరానికి
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఇక్కడ ఆలయాన్ని సూచిస్తుంది. ‘మందిరం’ ఆధునిక తెలుగు పాఠకులకు సహజంగా, సందర్భానికి స్పష్టంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హెబ్రీ దైవనామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో ప్రత్యక్షంగా ఇచ్చాం.
- source_word: נְחֹשֶׁת מָרוּק
  choice: మెరుగుపెట్టిన కంచుతో
  rationale: נְחֹשֶׁת ఈ ఆలయ లోహపని సందర్భంలో కంచును సూచిస్తుంది; מָרוּק మెరుగుపెట్టిన లేదా మెరుగు దిద్దిన స్థితిని సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠ్యంలో నాలుగు అక్షరాల దైవనామం ప్రత్యక్షంగా ఉన్నందున దానిని బిరుదుగా మార్చకుండా తెలుగు రూపమైన ‘యెహోవా’గా ఇచ్చాం.
- issue: חוּרָם אָבִיו యొక్క అర్థం
  choice: హూరామ్-అబీ అనే పేరు లేదా బిరుదు
  alternative: హూరాము, అతని తండ్రి
  rationale: దినవృత్తాంతాల సందర్భంలో ఇది శిల్పి designationగా పనిచేస్తుంది. అయినప్పటికీ హెబ్రీ పదాల అక్షరార్థంగా ‘హూరాము, అతని తండ్రి’ అనే పఠనం సాధ్యమే కాబట్టి పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని వాడాం. జాబితా స్వరూపాన్ని నిలిపి, సాంకేతిక ఆలయ పనిముట్లకు అతిగా పురాతనమైన పదాలను నివారించాం; మూలంలోని పేరు/బిరుదు సందిగ్ధతను పాదటిప్పణిలో భద్రపరిచాం.
