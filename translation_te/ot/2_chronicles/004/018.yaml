  to: సొలొమోను ఈ ఉపకరణాలన్నిటినీ ఎంతో ఎక్కువ పరిమాణంలో తయారుచేశాడు, ఎందుకంటే కంచు బరువును నిర్ధారించడం సాధ్యం కాలేదు.[a]
