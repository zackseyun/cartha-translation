translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ఆలయ సామగ్రి వైవిధ్యాన్ని దృష్టిలో ఉంచుకొని సంకుచితమైన ‘పాత్రలు’ కంటే విస్తృతమైన ‘వస్తువులు’ ఎంచుకోబడింది. మూలంలోని వివరణాత్మక సంబంధాన్ని అర్ధవిరామం ద్వారా నిలిపి, לֹא נֶחְקַר లోని నిజమైన సందిగ్ధతను పాదసూచికలో చూపించాం.
