id: 2CH.4.18
reference: 2 Chronicles 4:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ שְׁלֹמֹ֛ה כָּל הַ/כֵּלִ֥ים הָ/אֵ֖לֶּה לָ/רֹ֣ב מְאֹ֑ד כִּ֛י לֹ֥א נֶחְקַ֖ר מִשְׁקַ֥ל הַ/נְּחֹֽשֶׁת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/018.yaml
  text: Solomon made all these vessels in very great abundance[a], for the weight of the bronze could not be determined.
translation:
  language: te
  text: సొలొమోను ఈ ఉపకరణాలన్నిటినీ ఎంతో ఎక్కువ పరిమాణంలో తయారుచేశాడు, ఎందుకంటే కంచు బరువును నిర్ధారించడం సాధ్యం కాలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కంచు బరువు నిర్ధారించబడలేదు.” హీబ్రూ క్రియకు ‘పరిశోధించి తెలుసుకోవడం’ లేదా ‘నిర్ధారించడం’ అనే అర్థాలు ఉండవచ్చు; సందర్భంలో కంచు ఎంతో సమృద్ధిగా ఉండడం వల్ల దాని బరువు లెక్కించబడలేదనే భావం ఉంది.
    reason: לֹא נֶחְקַר యొక్క ‘నిర్ధారించబడలేదు’ అనే మరింత అక్షరార్థ ప్రత్యామ్నాయాన్ని, అలాగే సందర్భానుసారంగా ‘నిర్ధారించడం సాధ్యం కాలేదు’ అనే భావాన్ని స్పష్టపరచడానికి.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: తయారుచేశాడు
  rationale: עשה అనే సాధారణ క్రియ ఇక్కడ ఆలయ వస్తువులను చేయడం లేదా తయారుచేయడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘తయారుచేశాడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: ఈ వస్తువులన్నిటినీ
  rationale: כֵּלִים అనేది పాత్రలు, పనిముట్లు, ఇతర సామగ్రిని కలుపుకునే విస్తృత పదం. ముందున్న జాబితాలో రకరకాల ఆలయ సామగ్రి ఉన్నందున ‘వస్తువులు’ ఆ విస్తృతిని నిలుపుతుంది.
- source_word: לָרֹב מְאֹד
  choice: ఎంతో విస్తారంగా
  rationale: ఈ పదబంధం అత్యధిక పరిమాణాన్ని సూచిస్తుంది. ‘ఎంతో విస్తారంగా’ מְאֹד లోని తీవ్రతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: ;
  rationale: כִּי ముందటి వాక్యానికి వివరణను పరిచయం చేస్తుంది. తెలుగులో అర్ధవిరామంతో రెండవ వాక్యభాగాన్ని కలపడం ఆ వివరణాత్మక సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לֹא נֶחְקַר
  choice: నిర్ధారించడం సాధ్యం కాలేదు
  rationale: חקר నిఫాల్ రూపం ‘పరిశోధించి తెలుసుకోబడలేదు/నిర్ధారించబడలేదు’ అనే భావాన్ని ఇస్తుంది. సందర్భంలో కంచు అత్యధికంగా ఉండడం వల్ల దాని బరువును నిర్ధారించలేకపోయారనే భావాన్ని ఈ అనువాదం స్పష్టంగా ఇస్తుంది; మరింత అక్షరార్థమైన ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: מִשְׁקַל הַנְּחֹשֶׁת
  choice: కంచు బరువు
  rationale: מִשְׁקַל నిర్దిష్టంగా బరువును సూచిస్తుంది; נְחֹשֶׁת ఆలయ లోహ సామగ్రి సందర్భంలో సాధారణంగా కంచును సూచిస్తుంది.
