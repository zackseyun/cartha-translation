id: 2CH.4.5
reference: 2 Chronicles 4:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָבְי֣/וֹ טֶ֔פַח וּ/שְׂפָת/וֹ֙ כְּ/מַעֲשֵׂ֣ה שְׂפַת כּ֔וֹס פֶּ֖רַח שֽׁוֹשַׁנָּ֑ה מַחֲזִ֣יק בַּתִּ֔ים שְׁלֹ֥שֶׁת אֲלָפִ֖ים יָכִֽיל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/005.yaml
  text: Its thickness was a handbreadth[a], and its rim was like the work of the rim of a cup, like a lily blossom[b]. It could hold three thousand baths.
translation:
  language: te
  text: దాని మందం ఒక అరచేతి వెడల్పు[a]. దాని అంచు గిన్నె అంచు పనితనంలా, లిల్లీ పుష్పంలా ఉండేది. అది మూడు వేల బాత్‌లు[b] పట్టేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అరచేతి వెడల్పు’ అనేది నాలుగు వేళ్ల వెడల్పుకు సమానమైన పురాతన కొలత; సుమారు 7.5 సెంటీమీటర్లు.
    reason: cultural_note
  - marker: b
    text: ‘బాత్’ అనేది పురాతన హెబ్రీ ద్రవ కొలమానం. 1 రాజులు 7:26లో ఈ సముద్రం రెండు వేల బాత్‌లు పట్టేదని ఉంది; ఇక్కడ మూడు వేల బాత్‌లు అని ఉంది. ఇది మొత్తం సామర్థ్యానికి, సాధారణంగా నింపే పరిమాణానికి మధ్య తేడా కావచ్చు లేదా పాఠ/సంప్రదాయ భేదం కావచ్చు.
    reason: cross_reference
lexical_decisions:
- source_word: עָבְיוֹ
  choice: దాని మందం
  rationale: పోతపోసిన లోహపు సముద్రం గోడ మందాన్ని సూచించే సహజమైన వాస్తు పదప్రయోగం.
- source_word: טֶפַח
  choice: ఒక అరచేతి వెడల్పు
  rationale: చిన్న హెబ్రీ కొలతను ఆధునిక తెలుగు పాఠకుడు సులభంగా గ్రహించేలా, దాని శరీరాధారిత భావాన్ని నిలిపి అనువదించింది.
- source_word: שְׂפָתוֹ / שְׂפַת כּוֹס
  choice: దాని అంచు / గిన్నె అంచు
  rationale: పాత్రకు సంబంధించిన שָׂפָה అనే పదానికి ‘అంచు’ సహజమైన తెలుగు; మూలంలోని పదపునరుక్తినీ నిలిపింది.
- source_word: כְּמַעֲשֵׂה
  choice: పనితనంలా
  rationale: ఇది కేవలం పోలికనే కాక రూపొందించిన తీరు లేదా పనితనాన్ని సూచిస్తుంది; మూలంలోని సంక్షిప్త పోలికను అలాగే ఉంచింది.
- source_word: פֶּרַח שׁוֹשַׁנָּה
  choice: లిల్లీ పువ్వులా
  rationale: పుష్పాకార అంచును స్పష్టంగా చూపుతుంది; ‘కలువ’ అని అనువదించి వేరే పుష్పాన్ని నిర్దిష్టం చేయకుండా שׁוֹשַׁנָּהకు సాధారణంగా అంగీకరించిన ‘లిల్లీ’ని ఉపయోగించింది.
- source_word: מַחֲזִיק ... יָכִיל
  choice: పట్టేది
  rationale: మూలంలో సామర్థ్యాన్ని తెలియజేసే రెండు పదాల సమిష్టి భావాన్ని సహజమైన తెలుగు క్రియలో వ్యక్తం చేసింది; అనవసర పునరుక్తిని నివారించింది.
- source_word: בַּתִּים שְׁלֹשֶׁת אֲלָפִים
  choice: మూడు వేల బాతుల నీటిని
  rationale: హెబ్రీ ద్రవ కొలమానమైన ‘బాతు’ను మార్పిడి చేయకుండా నిలిపి, ఇది ద్రవ పరిమాణమని ‘నీటిని’ అనే సందర్భోచిత పదంతో స్పష్టం చేసింది.
theological_decisions:
- issue: 1 రాజులు 7:26లోని రెండు వేల బాతులు, ఇక్కడి మూడు వేల బాతులు అనే సంఖ్యాభేదం
  choice: ప్రధాన పాఠంలో మసొరెటిక్ హెబ్రీ పాఠమైన ‘మూడు వేల’ను యథాతథంగా ఉంచడం
  alternative: 1 రాజులు 7:26కు అనుగుణంగా ‘రెండు వేల’గా మార్చడం
  rationale: ఈ వచనానికి లభ్యమైన WLC పాఠం స్పష్టంగా ‘మూడు వేల’ అని చెబుతుంది. సమాంతర వచనంతో సంఖ్యను సమన్వయపరచకుండా, భేదాన్ని పాదసూచికలో పారదర్శకంగా తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. సాంకేతిక కొలమానాన్ని లిప్యంతరీకరించి పాదసూచికలో వివరించాం; మూలంలోని సంఖ్యాభేదాన్ని పరిష్కరించినట్లు చూపకుండా నిలిపాం.
