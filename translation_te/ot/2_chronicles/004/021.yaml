translation_notes:
  register: ఆలయ సామగ్రి జాబితాకు తగిన గంభీరమైన, ఆధునిక ప్రామాణిక తెలుగు వాడాం. అరుదైన హీబ్రూ పదబంధాన్ని ప్రధాన పాఠ్యంలో అర్థవంతంగా అనువదిస్తూ, దాని అసాధారణ రూపం మరియు భావ అనిశ్చితిని పాదసూచికలో నిలిపాం. అందించిన ఆంగ్ల పాఠ్యంలో పాదసూచిక గుర్తులు వాటి పదాలకు సరిపోని స్థానాల్లో ఉన్నందున, మూలార్థానికి అనుగుణంగా [a]ను ‘పట్టకార్లు’ వద్ద, [b]ను బంగారం నాణ్యతను తెలిపే వాక్యభాగం వద్ద ఉంచాం.
