source:
  edition: WLC
  text: וַ֠/יַּעַשׂ אֶת מְנֹר֧וֹת הַ/זָּהָ֛ב עֶ֖שֶׂר כְּ/מִשְׁפָּטָ֑/ם וַ/יִּתֵּן֙ בַּֽ/הֵיכָ֔ל חָמֵ֥שׁ מִ/יָּמִ֖ין וְ/חָמֵ֥שׁ מִ/שְּׂמֹֽאול־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/007.yaml
  text: He made ten gold lampstands according to their prescribed design[a], and he placed them in the temple[c][b], five on the right side and five on the left.
translation:
  language: te
  text: అతడు పది బంగారు దీపస్తంభాలను వాటికి నిర్దేశించిన విధానం ప్రకారం[a] చేసి, వాటిని ఆలయపు ప్రధాన మందిరంలో[b] ఉంచాడు—కుడివైపున ఐదు, ఎడమవైపున ఐదు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వాటి నియమం ప్రకారం,’ ‘వాటి నమూనా ప్రకారం.’ హీబ్రూ పదం నిర్ణయించిన నియమం, విధానం లేదా నమూనాను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆలయంలో,’ ‘పరిశుద్ధ మందిరంలో.’ హీబ్రూ పదం విస్తృత ఆలయ ప్రాంగణం కంటే ఆలయ భవనంలోని ప్రధాన భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో, ‘కుడివైపున ఐదు, ఎడమవైపున ఐదు.’ ఆలయపు దిశాభిముఖతను బట్టి ఇవి వరుసగా దక్షిణ, ఉత్తర వైపులను సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేసి
  rationale: עשה అనే సాధారణ కథన క్రియ ఇక్కడ ‘చేశాడు/తయారుచేశాడు’ అనే అర్థం ఇస్తుంది. తరువాతి క్రియతో సహజమైన తెలుగు వాక్యప్రవాహం కోసం ‘చేసి’ వాడబడింది.
- source_word: מְנֹרוֹת הַזָּהָב עֶשֶׂר
  choice: పది బంగారు దీపస్తంభాలను
  rationale: מְנוֹרָה కేవలం దీపాన్ని కాక దీపాన్ని నిలిపే నిర్మాణాన్ని సూచిస్తుంది; అందువల్ల ‘దీపస్తంభాలు’ స్పష్టమైన ఆధునిక తెలుగు రూపం. הַזָּהָב ను ‘బంగారు’గా, עֶשֶׂר ను ‘పది’గా అనువదించాం.
- source_word: כְּמִשְׁפָּטָם
  choice: నిర్దేశించిన నమూనా ప్రకారం
  rationale: מִשְׁפָּט ఇక్కడ నియమం, నిర్దేశం, విధానం లేదా నమూనా అనే భావాలను కలిగి ఉండవచ్చు. ఆలయ సామగ్రి సందర్భంలో ముందుగా నిర్ణయించిన ప్రమాణానికి అనుగుణంగా తయారు చేయడాన్ని ఈ పదబంధం సహజంగా తెలియజేస్తుంది; అసలు పదంలోని విస్తృతిని పాదటిప్పణిలో నిలిపాం.
- source_word: וַיִּתֵּן
  choice: ఉంచాడు
  rationale: נתן యొక్క ప్రాథమిక భావం ‘ఇవ్వడం/పెట్టడం’; వస్తువులను ఒక స్థలంలో అమర్చే ఈ సందర్భంలో ‘ఉంచాడు’ సహజంగా సరిపోతుంది.
- source_word: בַּהֵיכָל
  choice: ఆలయపు ప్రధాన మందిరంలో
  rationale: הֵיכָל ఇక్కడ విస్తృత ఆలయ ప్రాంగణం మొత్తాన్ని కాక ఆలయ భవనంలోని ప్రధాన మందిరాన్ని సూచిస్తుంది. ‘ఆలయపు ప్రధాన మందిరం’ ఈ ప్రత్యేకతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: חָמֵשׁ מִיָּמִין וְחָמֵשׁ מִשְּׂמֹאול
  choice: కుడివైపున ఐదు, ఎడమవైపున ఐదు
  rationale: హీబ్రూ నేరుగా ‘కుడి’ మరియు ‘ఎడమ’ అని చెబుతుంది. ఆలయ దిశను బట్టి ఇవి దక్షిణం, ఉత్తరం కావచ్చునన్న వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా మూలంలోని దిశాపదాలను నిలిపాం.
