translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వచనం. ‘దీపస్తంభాలు’ సాధారణ పాఠకునికి స్పష్టంగా ఉండే అనువాదం; ‘ఆలయపు ప్రధాన మందిరం’ הֵיכָל యొక్క స్థలపరమైన ప్రత్యేకతను కాపాడుతుంది. మూలంలోని ‘కుడి/ఎడమ’ పదాలను వ్యాఖ్యానాత్మకంగా ‘దక్షిణం/ఉత్తరం’గా మార్చలేదు.
