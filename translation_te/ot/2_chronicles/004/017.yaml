  yaml_path: translation/ot/2_chronicles/004/017.yaml
  text: In the plain of the Jordan the king cast them in the clay ground[a], between Sukkoth and Zeredah.
translation:
  language: te
  text: యొర్దాను మైదానంలో, సుక్కోతు, సెరేదాల మధ్యనున్న బంకమట్టి నేలలో రాజు వాటిని పోత పోశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 రాజులు 7:46లోని సమాంతర వాక్యం ఈ ప్రదేశాన్ని ‘సారెతాను’ అని పేర్కొంటుంది. ఇక్కడ దినవృత్తాంతాలు ‘సెరేదా’ అని చదువుతున్నాయి; ఇది బహుశా అదే స్థలపేరుకు మరో రూపం.
    reason: textual_variant
lexical_decisions:
- source_word: בְּכִכַּר הַיַּרְדֵּן
  choice: యొర్దాను మైదానంలో
  rationale: כִּכָּר ఇక్కడ యొర్దాను పరిసరాల్లోని మైదాన ప్రాంతాన్ని సూచిస్తుంది; ‘మైదానం’ భౌగోళిక భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: יְצָקָם
  choice: వాటిని పోత పోశాడు
  rationale: יצק లోహాన్ని కరిగించి పోతలో పోయడాన్ని సూచిస్తుంది. ఆలయపు కంచు సామగ్రి తయారీ సందర్భంలో ‘పోత పోశాడు’ లోహశిల్ప భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: సందర్భంలో సొలొమోనును సూచించే నిర్దిష్ట నామవాచకం; మూలంలోని సరళమైన ప్రస్తావనను అలాగే ఉంచుతుంది.
- source_word: בַּעֲבִי הָאֲדָמָה
  choice: బంకమట్టి నేలలో
  rationale: עֲבִי యొక్క ప్రాథమిక భావం మందం లేదా సాంద్రత. אֲדָמָהతో కలిసి ఇది లోహపు పోతలకు అనువైన దట్టమైన బంకమట్టి నేలను సూచిస్తుంది.
- source_word: בֵּין סֻכּוֹת וּבֵין צְרֵדָתָה
  choice: సుక్కోతుకు సెరేదాకు మధ్యనున్న
  rationale: రెండు స్థలాల మధ్య ఉన్న ప్రదేశమనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, దినవృత్తాంతాలలోని צְרֵדָתָה రూపాన్ని ‘సెరేదా’గా లిప్యంతరీకరించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. లోహశిల్ప సందర్భాన్ని తెలియజేయడానికి ‘పోత పోశాడు’ అనే సహజ పదబంధాన్ని ఎంచుకున్నాం; స్థలపేర్లను మూలంలోని రూపాలకు దగ్గరగా లిప్యంతరీకరించాం.
