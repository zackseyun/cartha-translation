translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆలయ సామగ్రి జాబితా శైలికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన వాక్యం. ఈ వచనం ముందటి క్రియపై ఆధారపడే జాబితా భాగమైనప్పటికీ, తెలుగులో స్వతంత్రంగా అర్థమయ్యేందుకు ‘చేశాడు’ను పూరించాం.
