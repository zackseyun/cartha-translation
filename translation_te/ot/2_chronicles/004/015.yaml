translation:
  language: te
  text: ‘సముద్రం’ అనే ఒక తొట్టెను[a], దాని కిందనున్న పన్నెండు ఎద్దులను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఒక సముద్రాన్ని”; ఇది ఆలయంలో ఉన్న పెద్ద పోతతో చేసిన తొట్టెకు పెట్టిన పేరు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּם
  choice: సముద్రపు తొట్టె
  rationale: יָם అనే పదానికి అక్షరార్థం ‘సముద్రం’; అయితే ఆలయ సామగ్రి సందర్భంలో అది ‘సముద్రం’ అని పిలిచే పెద్ద పోత తొట్టెను సూచిస్తుంది. ఆధునిక తెలుగు పాఠకునికి వస్తువు స్పష్టంగా ఉండేందుకు ‘సముద్రపు తొట్టె’ అని అనువదించాం; అక్షరార్థాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: אֶחָד
  choice: ఒక
  rationale: ఈ సంఖ్య ‘సముద్రపు తొట్టె’ను విశేషిస్తూ జాబితా శైలిలో దాని సంఖ్యను తెలియజేస్తుంది.
- source_word: הַבָּקָר
  choice: ఎద్దులు
  rationale: בָּקָר సమూహార్థంలో పశువులను సూచించగలదు; ఇక్కడ తొట్టెకు ఆధారంగా ఉన్న పన్నెండు గోవంశ ఆకృతులను సూచిస్తుంది. వాటి లింగాన్ని హెబ్రీ పదం ఖచ్చితంగా నిర్ణయించకపోయినా, తెలుగులో ‘ఎద్దులు’ సహజమైన సాంప్రదాయ పదం.
- source_word: שְׁנֵים עָשָׂר
  choice: పన్నెండు
  rationale: సంయుక్త సంఖ్యకు నేరమైన తెలుగు సమానార్థకం.
- source_word: תַּחְתָּיו
  choice: దాని కింద
  rationale: పుంలింగ ఏకవచన ప్రత్యయం ముందు చెప్పిన ‘సముద్రపు తొట్టె’ను సూచిస్తుంది; ‘దాని కింద’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: אֶת ... וְאֶת
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: ఇవి ప్రత్యక్ష కర్మ సూచకాలు; తెలుగు వాక్య నిర్మాణంలో వీటికి ప్రత్యేక పదం అవసరం లేదు.
