source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ חוּרָ֔ם אֶת הַ֨/סִּיר֔וֹת וְ/אֶת הַ/יָּעִ֖ים וְ/אֶת הַ/מִּזְרָק֑וֹת וַ/יְכַ֣ל חירם לַ/עֲשׂוֹת֙ אֶת הַ/מְּלָאכָ֔ה אֲשֶׁ֥ר עָשָׂ֛ה לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בְּ/בֵ֥ית הָ/אֱלֹהִֽים־־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/011.yaml
  text: 'Huram made the pots[a], the shovels, and the bowls. So Huram finished the work that he did for King Solomon in the house of God:'
translation:
  language: te
  text: 'హూరాము[a] కుండలను, పారలను, గిన్నెలను చేశాడు. అప్పుడు హూరాము దేవుని మందిరంలో రాజు సొలొమోను కోసం తాను చేసిన పనిని పూర్తి చేశాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో ఈ పేరుకు ‘హూరాము’, ‘హీరాము’ అనే రెండు అక్షరరూపాలు ఉన్నాయి; ఈ వచనంలో రెండూ కనిపిస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: חוּרָם / חירם
  choice: హూరాము
  rationale: ఈ వచనంలో పేరుకు రెండు హెబ్రీ అక్షరరూపాలు కనిపిస్తాయి. ప్రధాన పాఠ్యంలో మొదటి రూపాన్ని అనుసరించి ‘హూరాము’ అని ఏకరీతిగా ఉంచి, రూపాంతరాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: הַסִּירוֹת
  choice: కుండలు
  rationale: సాధారణంగా పాత్రలు లేదా కుండలను సూచించే పదం; వాటి ప్రత్యేక ఉపయోగాన్ని అనవసరంగా నిర్ధారించకుండా సహజమైన తెలుగు పదాన్ని ఎంచుకున్నాం.
- source_word: הַיָּעִים
  choice: పారలు
  rationale: బలిపీఠం దగ్గర బూడిద లేదా ఇతర పదార్థాన్ని తొలగించడానికి ఉపయోగించే పనిముట్లను సూచిస్తుంది; ‘పారలు’ సందర్భానికి తగిన సాధారణ తెలుగు.
- source_word: הַמִּזְרָקוֹת
  choice: గిన్నెలు
  rationale: ఆరాధనా సేవలో ఉపయోగించే పాత్రలను సూచిస్తుంది. ‘గిన్నెలు’ స్పష్టంగా ఉండి, వాటిని ‘చిలకరింపు పాత్రలు’ అని అతిగా వ్యాఖ్యానించదు.
- source_word: וַיְכַל
  choice: ముగించాడు
  rationale: పనిని పూర్తి చేయడం అనే కథనార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לַעֲשׂוֹת אֶת הַמְּלָאכָה אֲשֶׁר עָשָׂה
  choice: తాను చేసిన పనిని
  rationale: హెబ్రీలోని ‘చేయు’ అనే పదపునరుక్తిని తెలుగులో భారంగా కాకుండా, పూర్తి చేసిన పనిని స్పష్టంగా తెలిపేలా అందిస్తుంది.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: దేవుని మందిరంలో
  rationale: అక్షరార్థంగా ‘దేవుని ఇంటిలో’; ఆలయ సందర్భంలో ‘దేవుని మందిరంలో’ అనేది సహజమైన, గౌరవప్రదమైన తెలుగు రూపం. ‘లో’ అనే స్థానార్థాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. తరువాతి జాబితాకు ఈ వాక్యం దారితీస్తున్నందున చివర ద్విబిందువు నిలిపాం.
