    reason: lexical_alternative
  - marker: b
    text: లేదా, “శుద్ధి చేసిన బంగారంతో.” హీబ్రూ పదబంధం అత్యుత్తమ నాణ్యతగల శుద్ధ బంగారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
