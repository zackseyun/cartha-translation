revisions:
- from: విధి ప్రకారం అంతర్గర్భాలయం ముందు వెలిగించడానికి దీపస్తంభాలను, వాటి దీపాలను—ఇవన్నీ మేలిమి బంగారంతో చేసినవి;
  to: దీపస్తంభాలను, వాటి దీపాలను లోపలి పరిశుద్ధస్థలం ముందు విధి ప్రకారం మండేలా ఉంచడానికి—ఇవన్నీ మేలిమి బంగారంతో చేసినవి;
  rationale: The revision makes the Telugu more idiomatic, distinguishes the purpose of maintaining the lamps’ burning from merely lighting them, and supplies Telugu footnotes corresponding to the audit-trail alternatives for דְּבִיר and זָהָב סָגוּר. It preserves the verse’s list-continuation syntax and terminal semicolon.
