id: 2CH.4.20
reference: 2 Chronicles 4:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת הַ/מְּנֹר֞וֹת וְ/נֵרֹתֵי/הֶ֗ם לְ/בַעֲרָ֧/ם כַּ/מִּשְׁפָּ֛ט לִ/פְנֵ֥י הַ/דְּבִ֖יר זָהָ֥ב סָגֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/020.yaml
  text: the lampstands and their lamps[a], to burn according to the ordinance before the inner sanctuary, of pure gold[b];
translation:
  language: te
  text: దీపస్తంభాలను, వాటి దీపాలను లోపలి పరిశుద్ధస్థలం ముందు విధి ప్రకారం మండేలా ఉంచడానికి—ఇవన్నీ మేలిమి బంగారంతో చేసినవి;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְּנֹרוֹת
  choice: దీపస్తంభాలను
  rationale: మְנוֹרָה ఆలయ సందర్భంలో దీపాలను ఉంచే స్తంభాన్ని సూచిస్తుంది; ‘దీపస్తంభం’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: וְנֵרֹתֵיהֶם
  choice: వాటి దీపాలను
  rationale: נֵר ఇక్కడ దీపస్తంభాలపై ఉండే దీపాలను సూచిస్తుంది; సంబంధాన్ని తెలిపేందుకు ‘వాటి’ అని అనువదించాం.
- source_word: לְבַעֲרָם
  choice: వెలిగించడానికి
  rationale: ప్రత్యయంతో కూడిన ఈ క్రియారూపం దీపాలను మండేలా చేయడమనే ఉద్దేశాన్ని తెలియజేస్తుంది; తెలుగులో ‘వెలిగించడానికి’ సహజమైన ఆలయసందర్భ పదప్రయోగం.
- source_word: כַּמִּשְׁפָּט
  choice: విధి ప్రకారం
  rationale: מִשְׁפָּט ఇక్కడ ఆరాధనా కార్యానికి నిర్ణయించిన నియమాన్ని సూచిస్తుంది; ‘విధి ప్రకారం’ దాని అధికారిక భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לִפְנֵי הַדְּבִיר
  choice: అంతర్గర్భాలయం ముందు
  rationale: דְּבִיר ఆలయంలోని లోపలి పవిత్ర గదిని సూచిస్తుంది. ‘అంతర్గర్భాలయం’ స్థల స్వభావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తూ, ‘అతి పరిశుద్ధ స్థలం’ అనే వ్యాఖ్యాత్మక నిర్దిష్టతను ప్రధాన పాఠ్యంలో మోపదు.
- source_word: זָהָב סָגוּר
  choice: మేలిమి బంగారంతో చేసినవి
  rationale: సָגוּר యొక్క ఖచ్చిత ఛాయ కొంత అస్పష్టమైనా, ఈ పదబంధం అత్యున్నత నాణ్యతగల శుద్ధి చేసిన బంగారాన్ని సూచిస్తుంది; ‘మేలిమి బంగారం’ సహజమైన తెలుగు పదప్రయోగం.
- source_word: וְאֶת
  choice: —
  rationale: ఇది ముందరి వచనం నుంచి కొనసాగుతున్న వస్తువుల జాబితాలో సంయుక్త ప్రత్యక్ష కర్మ సూచకం. తెలుగులో ప్రత్యేక పదంగా అనువదించకుండా జాబితా నిర్మాణంలో ప్రతిబింబించాం.
theological_decisions:
- issue: הַדְּבִיר అనే ఆలయస్థల పదానికి అనువాదం
  choice: అంతర్గర్భాలయం
  alternative: అతి పరిశుద్ధ స్థలం
  rationale: మూలపదం ప్రధానంగా ఆలయపు లోపలి గదిని సూచిస్తుంది. సంప్రదాయపరమైన ‘అతి పరిశుద్ధ స్థలం’ సాధ్యమైనప్పటికీ, ప్రధాన పాఠ్యంలో స్థలార్థాన్ని నేరుగా ఉంచడం మూలంలోని పదవిస్తృతిని మెరుగ్గా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆలయ సామగ్రి జాబితాకు తగిన గంభీరమైన కాని సులభమైన శైలి. ఈ వచనం ముందరి జాబితాను కొనసాగిస్తున్నందున చివర సెమికోలన్ ఉంచబడింది. మూలంలోని సంబంధాలను సహజ తెలుగు పదక్రమంలో అమర్చాం.
