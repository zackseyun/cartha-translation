translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన నిర్మాణ వర్ణనను వాడాం. నాలుగు దిక్కుల సమాంతర నిర్మాణాన్ని నిలిపాం. ‘సముద్రం’ ఆలయపు పెద్ద కంచు తొట్టికి పేరుగా సందర్భం ద్వారా అర్థమయ్యేలా ఉంచాం. ఆంగ్ల సంప్రదింపు పాఠంలోని [b] సూచిక స్థానాన్ని అనుసరించకుండా, దాని పాదసూచిక నిజంగా వివరిస్తున్న ‘వెనుక భాగాలు’ అన్న పదబంధం దగ్గర ఉంచాం.
