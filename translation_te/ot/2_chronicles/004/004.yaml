id: 2CH.4.4
reference: 2 Chronicles 4:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עוֹמֵ֞ד עַל שְׁנֵ֧ים עָשָׂ֣ר בָּקָ֗ר שְׁלֹשָׁ֣ה פֹנִ֣ים צָפ֡וֹנָ/ה וּ/שְׁלוֹשָׁה֩ פֹנִ֨ים יָ֜מָּ/ה וּ/שְׁלֹשָׁ֣ה פֹּנִ֣ים נֶ֗גְבָּ/ה וּ/שְׁלֹשָׁה֙ פֹּנִ֣ים מִזְרָ֔חָ/ה וְ/הַ/יָּ֥ם עֲלֵי/הֶ֖ם מִ/לְ/מָ֑עְלָ/ה וְ/כָל אֲחֹרֵי/הֶ֖ם בָּֽיְתָ/ה־׀׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/004.yaml
  text: 'It stood on twelve oxen: three facing north[a], three facing west, three facing south, and three facing east. The Sea was above them[b], and all their rear parts were inward.'
translation:
  language: te
  text: 'అది పన్నెండు ఎద్దుల మీద నిలిచి ఉంది: వాటిలో మూడు ఉత్తరంవైపు తిరిగి ఉన్నాయి, మూడు పడమరవైపు[a], మూడు దక్షిణంవైపు, మూడు తూర్పువైపు తిరిగి ఉన్నాయి. సముద్రం వాటి మీద ఉంది; వాటి వెనుక భాగాలన్నీ[b] లోపలి వైపు ఉన్నాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “ఉత్తరంవైపు తిరిగిన మూడు ... సముద్రంవైపు తిరిగిన మూడు.” ఇక్కడ “సముద్రంవైపు” అనే దిశాసూచక ప్రయోగాన్ని “పడమరవైపు” అని అనువదించాం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వాటి పృష్ఠభాగాలన్నీ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹמֵד
  choice: నిలిచి ఉంది
  rationale: ఈ క్రియారూపం సముద్రం ఎద్దుల మీద ఉన్న స్థితిని వర్ణిస్తుంది; తెలుగులో సహజమైన స్థితిసూచక ప్రయోగాన్ని వాడాం.
- source_word: בָּקָר
  choice: ఎద్దులు
  rationale: సముద్రాన్ని మోస్తున్న పన్నెండు పశు ప్రతిమలను సూచిస్తుంది; లింగాన్ని అవసరానికి మించి నిర్దిష్టం చేయకుండా, ఆలయ నిర్మాణ వర్ణనలో సహజంగా అర్థమయ్యే పదం.
- source_word: פֹנִים
  choice: ముఖాలు పెట్టి ఉన్నాయి
  rationale: అక్షరార్థమైన ‘ముఖాలు’ అనే భావాన్ని నిలుపుతూ, అవి ఏ దిశకు తిరిగి ఉన్నాయో తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: צָפוֹנָה
  choice: ఉత్తరం వైపు
  rationale: దిశను సూచించే రూపాన్ని స్పష్టమైన ఆధునిక తెలుగు దిశాప్రయోగంతో తెలిపాం.
- source_word: יָמָּה
  choice: పడమర వైపు
  rationale: అక్షరార్థంగా ‘సముద్రం వైపు’ అయినా, హెబ్రీ దిశాసూచక వాడుకలో ఇది పడమరను సూచిస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: נֶגְבָּה
  choice: దక్షిణం వైపు
  rationale: నాలుగు దిక్కుల జాబితాలో ఇది నెగెవు ప్రాంతాన్ని ప్రత్యేకంగా కాక దక్షిణ దిశను సూచిస్తుంది.
- source_word: מִזְרָחָה
  choice: తూర్పు వైపు
  rationale: మూలంలోని సాధారణ దిశాసూచక అర్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: הַיָּם
  choice: సముద్రం
  rationale: ఇది భౌగోళిక సముద్రం కాదు; ఆలయంలోని పెద్ద కంచు తొట్టికి సందర్భంలో వాడిన పేరును యథాతథంగా నిలిపాం.
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: వాటి మీద ఉంది
  rationale: సముద్రం ఎద్దుల పైభాగంలో ఉన్న స్థానాన్ని సహజంగా తెలుపుతుంది; తెలుగులో అనవసరమైన పునరుక్తిని నివారిస్తుంది.
- source_word: אֲחֹרֵיהֶם
  choice: వాటి వెనుక భాగాలన్నీ
  rationale: పశు ప్రతిమల వెనుక లేదా పృష్ఠ భాగాలను సూచించే మూలపదాన్ని మర్యాదపూర్వకంగా, స్పష్టంగా అనువదించాం; మరింత శరీరనిర్దిష్టమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: בָּיְתָה
  choice: లోపలి వైపు
  rationale: ప్రతిమల వెనుక భాగాలు మధ్యభాగం వైపు తిరిగి ఉన్నాయనే అంతర్ముఖ దిశను సూచిస్తుంది.
