translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకునికి అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘సముద్రం’ అనే ప్రత్యేక నామాన్ని అలాగే ఉంచి ‘పెద్ద తొట్టి’ అని వివరణ ఇచ్చాం. ప్రాచీన కొలమానమైన ‘మూర’ను మార్చలేదు; కొలతతాడు అనే స్పష్టమైన పదంతో మూలంలోని concrete image‌ను నిలిపాం.
