  text: וַ/יַּ֥עַשׂ אֶת הַ/יָּ֖ם מוּצָ֑ק עֶ֣שֶׂר בָּֽ֠/אַמָּה מִ/שְּׂפָת֨/וֹ אֶל שְׂפָת֜/וֹ עָג֣וֹל סָבִ֗יב וְ/חָמֵ֤שׁ בָּֽ/אַמָּה֙ קֽוֹמָת֔/וֹ וְ/קָו֙ שְׁלֹשִׁ֣ים בָּֽ/אַמָּ֔ה יָסֹ֥ב אֹת֖/וֹ סָבִֽיב־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/002.yaml
  text: He made the Sea of cast metal[a], ten cubits from brim to brim, round all around; its height was five cubits[b], and a line of thirty cubits encircled it all around.
translation:
  language: te
  text: అతడు పోతపోసిన లోహంతో “సముద్రం” అనే పెద్ద తొట్టిని చేశాడు[a]. అది ఒక అంచు నుంచి ఎదుటి అంచు వరకు పది మూరలు; చుట్టూ గుండ్రంగా ఉండేది. దాని ఎత్తు ఐదు మూరలు. ముప్పై మూరల కొలతతాడు దానిని చుట్టి ఉండేది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పోతపోసిన సముద్రాన్ని.” హెబ్రీలో ‘సముద్రం’ అనేది ఆలయ సామగ్రిలోని ఈ పెద్ద తొట్టికి పెట్టిన పేరు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో, “ముప్పై మూరల తాడు.” ఇది తొట్టి చుట్టుకొలతను సూచిస్తుంది; పురాతన కాలంలో వాడిన సాధారణ వర్ణన పద్ధతిలో ఇలా చెప్పారు.
    reason: cultural_note
lexical_decisions:
- source_word: הַיָּם
  choice: “సముద్రం” అనే పెద్ద తొట్టి
  rationale: హెబ్రీ పదానికి అక్షరార్థం ‘సముద్రం’; ఆలయ సామగ్రి సందర్భంలో ఇది పెద్ద నీటి తొట్టికి పెట్టిన పేరు. పేరు యొక్క రూపకాన్ని నిలుపుతూ, ఆధునిక పాఠకునికి వస్తువు ఏమిటో స్పష్టం చేస్తుంది.
- source_word: מוּצָק
  choice: పోతపోసిన లోహంతో
  rationale: లోహాన్ని కరిగించి అచ్చులో పోసి తయారుచేసిన వస్తువని సూచించే కర్మణి రూప భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: పది మూరలు
  rationale: ప్రాచీన కొలమానాన్ని ఆధునిక ప్రమాణంలోకి మార్చకుండా నిలుపుతుంది.
- source_word: מִשְּׂפָתוֹ אֶל שְׂפָתוֹ
  choice: ఒక అంచు నుంచి ఎదుటి అంచు వరకు
  rationale: పాత్రకు సంబంధించిన שָׂפָה అనే ‘పెదవి/అంచు’ భావాన్ని తెలుగులో స్పష్టమైన వ్యాస కొలతగా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עָגוֹל סָבִיב
  choice: చుట్టూ గుండ్రంగా
  rationale: ఆకారాన్ని తెలిపే విశేషణాన్నీ, చుట్టూ అనే క్రియావిశేషణాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: וְחָמֵשׁ בָּאַמָּה קוֹמָתוֹ
  choice: దాని ఎత్తు ఐదు మూరలు
  rationale: హెబ్రీ నామవాచక వాక్యాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וְקָו
  choice: కొలతతాడు
  rationale: קַו ఇక్కడ చుట్టుకొలతను కొలిచే తాడు లేదా దారాన్ని సూచిస్తుంది; కేవలం ‘చుట్టుకొలత’ అని అమూర్తీకరించకుండా మూలంలోని దృశ్యరూపాన్ని నిలుపుతుంది.
- source_word: יָסֹב אֹתוֹ סָבִיב
  choice: దాని చుట్టూ చుట్టేది
  rationale: తాడు ఆ వస్తువును పూర్తిగా చుట్టినట్లు తెలిపే హెబ్రీ క్రియను సహజంగా, పునరుక్తి భావాన్ని కొంతవరకు నిలుపుతూ అనువదిస్తుంది.
