  text: וַ/יַּ֣עַשׂ כִּיּוֹרִים֮ עֲשָׂרָה֒ וַ֠/יִּתֵּן חֲמִשָּׁ֨ה מִ/יָּמִ֜ין וַ/חֲמִשָּׁ֤ה מִ/שְּׂמֹאול֙ לְ/רָחְצָ֣ה בָ/הֶ֔ם אֶת מַעֲשֵׂ֥ה הָ/עוֹלָ֖ה יָדִ֣יחוּ בָ֑/ם וְ/הַ/יָּ֕ם לְ/רָחְצָ֥ה לַ/כֹּהֲנִ֖ים בּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/006.yaml
  text: He made ten basins and set five on the right and five on the left[a], to wash in them; in them they would rinse the things used for the burnt offering[c][b]. But the sea was for the priests to wash in.
translation:
  language: te
  text: అతడు పది కడుగు తొట్టెలను చేసి, వాటిలో కడగడానికి ఐదింటిని కుడివైపున, ఐదింటిని ఎడమవైపున ఉంచాడు[a]. దహనబలికి సంబంధించిన వాటిని వాటిలో కడిగి శుభ్రపరచేవారు[b]. అయితే సముద్రం యాజకులు కడుక్కోవడానికి ఉండేది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కడుగు తొట్టెలు’ అనే పదానికి ‘పెద్ద కడుగు పాత్రలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘దహనబలి పని.’ ఈ పదబంధం దహనబలిని సిద్ధం చేయడానికి సంబంధించిన వస్తువులు లేదా పదార్థాలను సూచించే అవకాశముంది.
    reason: lexical_alternative
  - marker: c
    text: ‘సముద్రం’ అనేది యాజకులు కడుక్కోవడానికి ఉద్దేశించిన పెద్ద కంచు జలాశయానికి పెట్టిన పేరు.
    reason: cultural_note
lexical_decisions:
- source_word: כִּיּוֹרִים
  choice: కడుగుడు తొట్టెలు
  rationale: ఆలయ సేవలో వస్తువులను కడగడానికి ఉపయోగించే పెద్ద పాత్రలను సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు ‘కడుగుడు తొట్టెలు’ స్పష్టంగా ఉంటుంది.
- source_word: מִיָּמִין / מִשְּׂמֹאול
  choice: కుడివైపున / ఎడమవైపున
  rationale: అవి ఉంచబడిన ప్రదేశ దిశలను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְרָחְצָה
  choice: కడగడానికి / కడుక్కోవడానికి
  rationale: ప్రయోజనాన్ని తెలిపే మూలభాషా రూపాన్ని సందర్భానుసారమైన తెలుగు క్రియలతో వ్యక్తపరుస్తుంది; వస్తువులకు ‘కడగడానికి’, వ్యక్తులకు ‘కడుక్కోవడానికి’ వాడబడింది.
- source_word: מַעֲשֵׂה הָעוֹלָה
  choice: దహనబలికి సంబంధించిన వాటిని
  rationale: అక్షరార్థంగా ‘దహనబలి పని’ అయిన ఈ సంక్షిప్త పదబంధం, దహనబలి సిద్ధీకరణకు సంబంధించిన వస్తువులు లేదా పదార్థాలను సూచించే అవకాశముంది. అస్పష్టతను పూర్తిగా తొలగించకుండా సహజంగా అనువదించబడింది.
- source_word: יָדִיחוּ
  choice: కడిగి శుభ్రం చేసేవారు
  rationale: హిఫిల్ రూపం కడిగి మలినాన్ని తొలగించే భావాన్ని ఇస్తుంది. అసంపూర్ణ క్రియారూపంలోని అలవాటైన చర్య భావాన్ని ‘చేసేవారు’ తెలియజేస్తుంది.
- source_word: וְהַיָּם
  choice: సముద్రం అని పిలిచే పెద్ద తొట్టి
  rationale: ఇది పెద్ద కంచు జలాశయానికి ప్రత్యేక నామమైన ‘సముద్రం’. ప్రధాన పాఠ్యంలో పేరు మరియు దాని వస్తుసూచన రెండింటినీ ఇవ్వడం సాధారణ పాఠకునికి స్పష్టతనిస్తుంది.
- source_word: לַכֹּהֲנִים
  choice: యాజకులు
  rationale: యాజకుల ఉపయోగం కోసం అనే దత్తార్థాన్ని సహజమైన తెలుగు ప్రయోజన వాక్యంగా వ్యక్తపరుస్తుంది.
