    rationale: హీబ్రూ లְרָחְצָה בָהֶם తొట్టెలను ఎందుకు ఉంచారో స్పష్టంగా చెబుతుంది. తరువాతి వాక్యం దహనబలికి సంబంధించిన వాటిని కడగడాన్ని మాత్రమే చెబుతుంది; మొదటి సాధారణ ఉద్దేశాన్ని పూర్తిగా భర్తీ చేయదు.
