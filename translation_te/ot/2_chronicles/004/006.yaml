  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ఆలయ సంబంధ పదజాలంలో ‘దహనబలి’, ‘యాజకులు’ వంటి స్థిరమైన బైబిలు పదాలను ఉంచి, అరుదైన ‘గంగాళాలు’ వంటి పదాల బదులు ‘కడుగుడు తొట్టెలు’ వాడబడింది.
