- from: అతడు పది కడుగుడు తొట్టెలను చేయించి, ఐదింటిని కుడివైపున, ఐదింటిని ఎడమవైపున ఉంచాడు[a]. దహనబలికి సంబంధించిన వాటిని వాటిలో కడిగి శుభ్రం చేసేవారు[b]. అయితే యాజకులు కడుక్కోవడానికి సముద్రం అని పిలిచే పెద్ద తొట్టి ఉండేది[c].
  to: అతడు పది కడుగు తొట్టెలను చేసి, వాటిలో కడగడానికి ఐదింటిని కుడివైపున, ఐదింటిని ఎడమవైపున ఉంచాడు[a]. దహనబలికి సంబంధించిన వాటిని వాటిలో కడిగి శుభ్రపరచేవారు[b]. అయితే సముద్రం యాజకులు కడుక్కోవడానికి ఉండేది[c].
