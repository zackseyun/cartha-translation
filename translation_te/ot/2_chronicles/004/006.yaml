  source_fidelity: ముసాయిదా ప్రధానంగా హీబ్రూ భావాన్ని అనుసరిస్తుంది. అయితే మొదటి తొట్టెల ఉద్దేశాన్ని తెలిపే לְרָחְצָה (‘వాటిలో కడగడానికి’) ప్రధాన పాఠ్యంలో విడిచిపెట్టబడింది. అలాగే וְהַיָּם ను ‘సముద్రం అని పిలిచే పెద్ద తొట్టి’గా మార్చడం ప్రత్యేక నామాన్ని వివరణలో కలిపి, మూలంలోని నేరుగా ఉన్న ప్రతిపాదనను కొద్దిగా విస్తరిస్తోంది.
  naturalness: ‘కడుగు తొట్టెలు,’ ‘కుడివైపున,’ ‘ఎడమవైపున,’ ‘కడిగి శుభ్రపరచేవారు’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, సహజంగా ఉన్నాయి. ఉద్దేశ వాక్యాన్ని అదే వాక్యంలో చేర్చడం ప్రవాహాన్ని, మూలవాక్య నిర్మాణాన్ని మెరుగుపరుస్తుంది.
  terminology: ‘దహనబలి,’ ‘యాజకులు,’ ‘సముద్రం’ సముచితమైన బైబిలు పదజాలం. ‘సముద్రం’ను ప్రత్యేక ఆలయ-పాత్ర నామంగా ప్రధాన పాఠ్యంలో నిలిపి, దాని వివరణను పాదటిప్పణిలో ఉంచడం ఉత్తమం.
  issues:
