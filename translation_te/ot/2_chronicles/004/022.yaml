base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/022.yaml
  text: the snuffers[a], the basins, the bowls, and the firepans of pure gold; and the entrance of the house, its inner doors for the Most Holy Place, and the doors of the house for the nave[c][b], were of gold.
translation:
  language: te
  text: దీపవత్తులు కత్తిరించే పరికరాలు, పళ్లాలు, గిన్నెలు, నిప్పు పాత్రలు మేలిమి బంగారంతో చేయబడ్డాయి. ఆలయ ప్రవేశద్వారం, అంటే అతి పరిశుద్ధ స్థలానికి ఉన్న దాని లోపలి తలుపులు, అలాగే ప్రధాన మందిరానికి ఉన్న ఆలయ తలుపులు[a], బంగారంతో చేయబడ్డాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రధాన మందిరం’ అని అనువదించిన హీబ్రూ పదం హేఖాల్; ఇక్కడ అది అతి పరిశుద్ధ స్థలానికి భిన్నమైన ఆలయ ప్రధాన గదిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזַמְּרוֹת
  choice: దీపాల వత్తులు కత్తిరించే కత్తెరలు
  rationale: ఆలయ సామగ్రి సందర్భంలో దీపాల వత్తులను కత్తిరించడానికి లేదా ఆర్పడానికి ఉపయోగించే పరికరాలను సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు దాని ఉపయోగం స్పష్టంగా ఉండేలా కార్యవివరణాత్మకంగా అనువదించబడింది.
- source_word: מִּזְרָקוֹת
  choice: పళ్లాలు
  rationale: బలి సంబంధమైన ద్రవాలను స్వీకరించడానికి లేదా చిలకరించడానికి వాడే వెడల్పాటి పాత్రలను సూచించే పదం. తరువాతి כַּפּוֹתతో భేదం నిలిచేలా ‘పళ్లాలు’ ఎంచుకోబడింది.
- source_word: כַּפּוֹת
  choice: చెంచాలు
  rationale: כף అనే పదానికి అరచేయి, చెంచా లేదా చెంచా ఆకారపు చిన్న పాత్ర అనే అర్థాలు ఉన్నాయి. ఆలయ పాత్రల జాబితాలో ‘చెంచాలు’ అనే అర్థం సముచితమైనది; ముందున్న పళ్లాలతో దీనిని కలిపివేయదు.
- source_word: מַּחְתּוֹת
  choice: నిప్పు పాత్రలు
  rationale: నిప్పును లేదా నిప్పుకణికలను మోయడానికి ఉపయోగించే పాత్రలు. ‘ధూపార్తులు’ అని అనువదిస్తే ధూప వినియోగాన్ని అనవసరంగా నిర్దిష్టం చేసినట్టు అవుతుంది.
- source_word: זָהָב סָגוּר
  choice: మేలిమి బంగారం
  rationale: అత్యున్నత నాణ్యతతో శుద్ధి చేసిన బంగారాన్ని సూచించే స్థిర పదబంధం. ‘మేలిమి బంగారం’ సహజమైన, గౌరవప్రదమైన తెలుగు ప్రయోగం.
- source_word: פֶּתַח הַבַּיִת דַּלְתוֹתָיו
  choice: ఆలయ ప్రవేశద్వారంలోని తలుపులు
  rationale: హీబ్రూ నిర్మాణాన్ని పదప్రతిపదంగా అనుసరిస్తే తెలుగులో అసహజంగా ఉంటుంది. సందర్భంలోని ‘ఇల్లు’ దేవాలయాన్ని సూచిస్తుంది; ప్రవేశద్వారానికి చెందిన తలుపులనే భావం సహజంగా వ్యక్తమైంది.
- source_word: דַּלְתוֹתָיו הַפְּנִימִיּוֹת לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: అతి పరిశుద్ధ స్థలానికి చెందిన లోపలి తలుపులు
  rationale: קֹדֶשׁ הַקֳּדָשִׁיםలోని అత్యుత్తమత భావాన్ని ‘అతి పరిశుద్ధ స్థలం’ నిలుపుతుంది; ఇవి లోపలి తలుపులని కూడా స్పష్టంగా చూపుతుంది.
- source_word: וְדַלְתֵי הַבַּיִת לַהֵיכָל
  choice: ప్రధాన మందిరానికి చెందిన తలుపులు
  rationale: הֵיכָל ఇక్కడ అతి పరిశుద్ధ స్థలానికి వెలుపల ఉన్న ఆలయ ప్రధాన గదిని సూచిస్తుంది. ‘ప్రధాన మందిరం’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఆ భేదాన్ని నిలుపుతుంది.
- source_word: זָהָב
  choice: బంగారంతో చేయబడ్డాయి
  rationale: వాక్యాంతంలోని ‘బంగారం’ తలుపుల నిర్మాణ పదార్థాన్ని విధేయంగా తెలియజేస్తుంది. సహజ తెలుగు వాక్య నిర్మాణం కోసం క్రియ సరఫరా చేయబడింది.
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים అనే అత్యుత్తమత రూపం
  choice: అతి పరిశుద్ధ స్థలం
  alternative: పరిశుద్ధ స్థలాల్లోకెల్లా పరిశుద్ధ స్థలం
  rationale: సంక్షిప్తంగా ఉండి హీబ్రూ అత్యుత్తమత భావాన్ని నిలుపుతుంది; ఏ ప్రత్యేక సంఘపరమైన పదజాలాన్నీ దిగుమతి చేయదు.
- issue: הֵיכָל మరియు కֹדֶשׁ הַקֳּדָשִׁים మధ్య స్థల భేదం
  choice: ప్రధాన మందిరం / అతి పరిశుద్ధ స్థలం
  alternative: పరిశుద్ధ స్థలం / అతి పరిశుద్ధ స్థలం
  rationale: הֵיכָלను మొత్తం ఆలయంగా అపార్థం చేసుకోకుండా ప్రధాన గదిగా చూపుతూ, లోపలి అతి పరిశుద్ధ స్థలంతో ఉన్న భేదాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి ఉపయోగించబడింది. పాత్రల పేర్లలో అవసరానికి మించిన ఆచారపరమైన నిర్దిష్టతను నివారించి, ఆలయ అంతర్భాగాల మధ్య భేదాన్ని స్పష్టంగా ఉంచాం.
