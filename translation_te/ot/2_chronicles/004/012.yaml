  yaml_path: translation/ot/2_chronicles/004/012.yaml
  text: the two pillars[a], and the two bowls and the two capitals on top of the pillars, and the two latticeworks to cover the two bowls of the capitals that were on top of the pillars[b];
translation:
  language: te
  text: రెండు స్తంభాలు, స్తంభాల పైభాగాలపై ఉన్న రెండు గిన్నె ఆకారపు భాగాలు మరియు రెండు శీర్షభాగాలు, స్తంభాల పైభాగాలపై ఉన్న ఆ శీర్షభాగాలకు చెందిన రెండు గిన్నె ఆకారపు భాగాలను కప్పడానికి రెండు జాలికలు[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా “వల అల్లికలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדִים
  choice: స్తంభాలు
  rationale: ఆలయ నిర్మాణ సందర్భంలో ఉన్న రెండు నిలువు నిర్మాణాలను సహజమైన ఆధునిక తెలుగు వాస్తు పదంతో సూచిస్తుంది.
- source_word: גֻּלּוֹת
  choice: గిన్నె ఆకారపు భాగాలు
  rationale: ఈ పదం స్తంభాల పైభాగంతో సంబంధమున్న గుండ్రని లేదా గిన్నెలాంటి నిర్మాణ భాగాలను సూచిస్తుంది; ఖచ్చితమైన ఆకారం అనిశ్చితమైనందున వివరణాత్మక పదబంధాన్ని ఎంచుకుని ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఉంచాం.
- source_word: כֹּתָרוֹת
  choice: శీర్షభాగాలు
  rationale: స్తంభం పైన ఉండే అలంకార వాస్తు భాగాన్ని సూచిస్తుంది. సాధారణ పాఠకులకు అర్థమయ్యేలా, సాంకేతిక భావాన్ని నిలుపుకునే పదం.
- source_word: רֹאשׁ
  choice: పైభాగం
  rationale: అక్షరార్థంగా ‘తల’ అయినా, వాస్తు సందర్భంలో ‘పైభాగం’ సహజమైనది.
- source_word: שְּׂבָכוֹת
  choice: జాలికలు
  rationale: అల్లిక లేదా వల వంటి అలంకార నిర్మాణాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְכַסּוֹת
  choice: కప్పడానికి
  rationale: హీబ్రూ క్రియారూపంలోని ఉద్దేశార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֲשֶׁר
  choice: ఉన్న
  rationale: సంబంధవాచక ఉపవాక్యాన్ని తెలుగు వాక్యనిర్మాణానికి సహజంగా అనుసంధానిస్తుంది.
- source_word: שְׁנַיִם / שְׁתַּיִם / שְׁתֵּי
  choice: రెండు
  rationale: వస్తువులను ఒక్కొక్కటిగా లెక్కిస్తూ చెప్పే మూలపాఠంలోని పునరుక్త సంఖ్యలను నిలుపుతుంది.
