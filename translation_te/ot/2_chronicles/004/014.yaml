lexical_decisions:
- source_word: הַמְּכֹנוֹת
  choice: పీటలను
  rationale: ఈ సందర్భంలో ఈ పదం గంగాళాలను మోసేలా తయారుచేసిన ఆధార నిర్మాణాలను సూచిస్తుంది. ‘పీటలు’ ఆధునిక తెలుగులో వాటి పనిని సహజంగా తెలియజేస్తుంది.
- source_word: עָשָׂה
  choice: చేశాడు
  rationale: సాధారణమైన ‘చేయు’ అనే అర్థాన్ని సరళంగా నిలుపుతుంది; సందర్భంలో అవసరం లేని అదనపు శిల్పార్థాన్ని చేర్చదు.
- source_word: הַכִּיֹּרוֹת
  choice: గంగాళాలను
  rationale: ఆలయ సేవలో కడగడానికి ఉపయోగించే పెద్ద పాత్రలను సూచించే సహజమైన తెలుగు పదం.
- source_word: עַל
  choice: మీద
  rationale: గంగాళాలు పీటలపై ఉంచబడిన స్థాన సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְאֶת ... וְאֶת
  choice: …; …
  rationale: హీబ్రూ జాబితా నిర్మాణాన్ని తెలుగులో సహజమైన రెండు సమన్వయ వాక్యభాగాలుగా అందిస్తుంది.
