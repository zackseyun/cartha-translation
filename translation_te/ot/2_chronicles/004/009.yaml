  text: וַ/יַּ֨עַשׂ֙ חֲצַ֣ר הַ/כֹּהֲנִ֔ים וְ/הָ/עֲזָרָ֖ה הַ/גְּדוֹלָ֑ה וּ/דְלָת֧וֹת לָ/עֲזָרָ֛ה וְ/דַלְתוֹתֵי/הֶ֖ם צִפָּ֥ה נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/009.yaml
  text: And he made the court of the priests[a], and the great court, and doors for the court[c][b]; and he overlaid their doors with bronze.
translation:
  language: te
  text: అతడు యాజకుల ప్రాంగణాన్ని, పెద్ద ఆవరణాన్ని, ఆ ఆవరణానికి తలుపులను చేశాడు; వాటి తలుపులను కంచుతో పొదిగించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రాగి.’ נְחֹשֶׁת అనే హీబ్రూ పదం రాగిని లేదా కంచును సూచించవచ్చు; ఆలయ సామగ్రి సందర్భాన్ని బట్టి ప్రధాన పాఠంలో ‘కంచు’ అని ఇచ్చాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: עשה అనే విస్తృతార్థక క్రియను నిర్మాణ సందర్భంలో సహజంగా, మూలానికి దగ్గరగా ‘చేశాడు’ అని అనువదించాం.
- source_word: חֲצַר הַכֹּהֲנִים
  choice: యాజకుల ప్రాంగణం
  rationale: חָצֵר అనే పదంలోని ఆలయ ప్రాంగణ భావాన్ని, యాజకులతో ఉన్న సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְהָעֲזָרָה הַגְּדוֹלָה
  choice: పెద్ద ఆవరణ
  rationale: ఆలయ సందర్భంలో עֲזָרָה సూచించే చుట్టుముట్టిన ఆవరణను ‘ఆవరణ’గా, גְּדוֹלָהను నేరుగా ‘పెద్ద’గా వ్యక్తం చేశాం.
- source_word: וּדְלָתוֹת לָעֲזָרָה
  choice: ఆ ఆవరణకు తలుపులు
  rationale: דֶּלֶת సాధారణంగా ‘తలుపు’ అని అర్థమవుతుంది; ‘గుమ్మాలు’ అని ప్రత్యేకీకరించకుండా మూలపదాన్ని స్థిరంగా అనుసరించాం.
- source_word: וְדַלְתוֹתֵיהֶם
  choice: వాటి తలుపులు
  rationale: హీబ్రూ రూపంలోని తృతీయ పురుష బహువచన ప్రత్యయాన్ని నిలుపుతూ, ముందున్న నిర్మాణాలను సూచించేలా ‘వాటి’ అని అనువదించాం.
- source_word: צִפָּה
  choice: తొడిగించాడు
  rationale: లోహపు పొరతో కప్పడం అనే నిర్మాణార్థాన్ని సహజమైన తెలుగులో ‘తొడిగించాడు’ తెలియజేస్తుంది.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ఆలయ సామగ్రి సందర్భంలో נְחֹשֶׁתకు సంప్రదాయబద్ధమైన, సులభంగా అర్థమయ్యే తెలుగు పదం ‘కంచు’; అయితే ఇది రాగిని కూడా సూచించగలదు.
