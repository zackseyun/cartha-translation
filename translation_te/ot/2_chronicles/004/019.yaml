  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֔ה אֵ֚ת כָּל הַ/כֵּלִ֔ים אֲשֶׁ֖ר בֵּ֣ית הָ/אֱלֹהִ֑ים וְ/אֵת֙ מִזְבַּ֣ח הַ/זָּהָ֔ב וְ/אֶת הַ/שֻּׁלְחָנ֔וֹת וַ/עֲלֵי/הֶ֖ם לֶ֥חֶם הַ/פָּנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/019.yaml
  text: 'And Solomon made all the vessels that were for the house of God: the golden altar[a], the tables, and on them the bread of the Presence.'
translation:
  language: te
  text: 'సొలొమోను దేవుని మందిరానికి చెందిన ఉపకరణాలన్నిటినీ చేశాడు: బంగారు బలిపీఠం, బల్లలు, వాటిమీద సన్నిధి రొట్టెలు[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “సన్నిధి రొట్టె”; అంటే దేవుని సన్నిధిలో ఉంచబడే రొట్టెలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేశాడు
  rationale: עשה అనే సాధారణ క్రియకు నేరుగా సరిపోయే సహజమైన తెలుగు రూపం; సందర్భంలో తయారు చేయడం అనే భావం స్పష్టంగా ఉంటుంది.
- source_word: כָּל הַכֵּלִים
  choice: ఉపకరణాలన్నిటినీ
  rationale: כֵּלִים ఇక్కడ దేవాలయ ఆరాధనలో ఉపయోగించే సామగ్రి లేదా పాత్రలను సూచిస్తుంది. ‘ఉపకరణాలు’ అన్నది జాబితాలోని విభిన్న వస్తువులను సహజంగా ఇముడ్చుతుంది.
- source_word: בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరం
  rationale: అక్షరార్థం ‘దేవుని ఇల్లు’; ఆధునిక తెలుగులో ఈ సందర్భాన్ని స్పష్టంగా, గౌరవప్రదంగా తెలియజేయడానికి ‘దేవుని మందిరం’ సహజమైన రూపం.
- source_word: מִזְבַּח הַזָּהָב
  choice: బంగారు బలిపీఠం
  rationale: హెబ్రీ నిర్మాణాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: הַשֻּׁלְחָנוֹת
  choice: బల్లలు
  rationale: బహువచనాన్ని యథాతథంగా నిలుపుతూ, దేవాలయంలో రొట్టెలు ఉంచే బల్లలను స్పష్టంగా సూచిస్తుంది.
- source_word: וַעֲלֵיהֶם
  choice: వాటి మీద ఉంచే
  rationale: రొట్టెలకు బల్లలతో ఉన్న స్థాన సంబంధాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: לֶחֶם הַפָּנִים
  choice: సన్నిధి రొట్టెలు
  rationale: అక్షరార్థంగా ‘సన్నిధి/ముఖపు రొట్టె’ అనే ఆరాధనా పారిభాషిక పదం. ‘సన్నిధి రొట్టెలు’ మూల భావాన్ని నిలుపుతూ తెలుగులో సంక్షిప్తంగా, అర్థవంతంగా ఉంటుంది.
theological_decisions:
- issue: בֵּית הָאֱלֹהִים అనే దేవాలయ పదబంధం
  choice: దేవుని మందిరం
  alternative: దేవుని ఇల్లు
  rationale: ‘దేవుని ఇల్లు’ అక్షరార్థాన్ని మరింత దగ్గరగా అనుసరించినా, ఇక్కడ ఉద్దేశించిన దేవాలయాన్ని ‘దేవుని మందిరం’ ఆధునిక తెలుగు పాఠకులకు వెంటనే స్పష్టం చేస్తుంది; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: לֶחֶם הַפָּנִים అనువాదం
  choice: సన్నిధి రొట్టెలు
  alternative: దేవుని సన్నిధిలో ఉంచే రొట్టెలు
  rationale: సంక్షిప్తమైన ఆరాధనా పదబంధాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని భావాన్ని పాదసూచికలో వివరిస్తుంది. దేవుని సమక్షంలో ఉంచబడే రొట్టెలనే ఇది సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి ఉపయోగించబడింది. హెబ్రీ వాక్యంలోని జాబితా నిర్మాణాన్ని నిలుపుతూ, తెలుగులో స్పష్టత కోసం చివర ‘చేశాడు’ పునరుక్తి చేయబడింది. పాదసూచిక గుర్తు సంబంధిత ‘సన్నిధి రొట్టెలు’ పదబంధానికే జతచేయబడింది.
