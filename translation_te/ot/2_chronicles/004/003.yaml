source:
  edition: WLC
  text: וּ/דְמ֣וּת בְּקָרִים֩ תַּ֨חַת ל֜/וֹ סָבִ֤יב סָבִיב֙ סוֹבְבִ֣ים אֹת֔/וֹ עֶ֚שֶׂר בָּֽ/אַמָּ֔ה מַקִּיפִ֥ים אֶת הַ/יָּ֖ם סָבִ֑יב שְׁנַ֤יִם טוּרִים֙ הַ/בָּקָ֔ר יְצוּקִ֖ים בְּ/מֻֽצַקְתּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/003.yaml
  text: And beneath it were figures of oxen all around[a], encircling it, ten to the cubit, surrounding the Sea all around. The oxen were in two rows[c][b], cast as one piece with it.
translation:
  language: te
  text: దాని కింద ఎద్దుల ఆకారాలు[a] చుట్టూరా ఉండేవి; అవి మూరకు పది చొప్పున[b] సముద్రాన్ని చుట్టుముట్టి ఉండేవి. ఆ ఎద్దుల ఆకారాలు రెండు వరుసలుగా ఉండి, సముద్రంతో ఒకే పోతలో పోతపోయబడ్డాయి.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఎద్దుల ప్రతిరూపాలు’; హీబ్రూ పదం సజీవ జంతువులను కాక అలంకారంగా చేసిన వాటి రూపాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: ‘మూరకు పది’; చుట్టుకొలతలో ప్రతి మూర పొడవుకు పది ఆకారాలు ఉన్నాయని దీని భావం కావచ్చు.'
    reason: cultural_note
  - marker: c
    text: 'హీబ్రూ: ‘దాని పోతలో’; అంటే అవి సముద్రంతో ఒకే పోతలో రూపొందించబడ్డాయి.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת בְּקָרִים
  choice: ఎద్దుల ఆకారాలు
  rationale: דְּמוּת అనేది నిజమైన జంతువులను కాక వాటి రూపాలను లేదా ప్రతిరూపాలను సూచిస్తుంది; ఆలయపు అలంకార సందర్భంలో ‘ఎద్దుల ఆకారాలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: תַּחַת לוֹ
  choice: దాని కింద
  rationale: సముద్రం అనే పెద్ద పాత్ర కింది భాగంలో ఉన్న అలంకార రూపాల స్థానాన్ని సూటిగా తెలియజేస్తుంది.
- source_word: סָבִיב סָבִיב
  choice: చుట్టూరా
  rationale: హీబ్రూలోని పునరుక్తి నలువైపులా ఆవరించిన భావాన్ని బలపరుస్తుంది; ఆధునిక తెలుగులో ‘చుట్టూరా’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: మూరకు పది చొప్పున
  rationale: చుట్టుకొలత పొడవులో ప్రతి మూరకు పది రూపాలు ఉన్నాయనే కొలత సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘మూర’ బైబిలు కొలమానానికి తెలుగులో ప్రాచుర్యం పొందిన పదం.
- source_word: הַיָּם
  choice: సముద్రం
  rationale: ఇది ఆలయంలోని పెద్ద లోహపు జలపాత్రకు ప్రత్యేక నామం; సందర్భానుసారంగా ‘సముద్రం’గా అనువదించడం సంప్రదాయబద్ధంగా, గుర్తించదగిన విధంగా ఉంటుంది.
- source_word: שְׁנַיִם טוּרִים
  choice: రెండు వరుసలుగా
  rationale: అలంకార ఎద్దు రూపాల అమరికను సరళమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְצוּקִים בְּמֻצַקְתּוֹ
  choice: సముద్రాన్ని పోతపోసినప్పుడే దానితో కలిపి పోతపోయబడ్డాయి
  rationale: లోహపు ఎద్దు రూపాలు తరువాత అమర్చబడకుండా, పాత్రతో ఒకే పోతలో రూపొందించబడ్డాయనే లోహకర్మ భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. మూలంలోని వృత్తాకార పునరుక్తిని ‘చుట్టూరా’, ‘చుట్టుముట్టి’, ‘చుట్టూ’ అనే పదాలతో నిలిపాం. లోహకర్మ సందర్భంలో ‘పోతపోయడం’ అనే స్పష్టమైన పదాన్ని వాడాం.
