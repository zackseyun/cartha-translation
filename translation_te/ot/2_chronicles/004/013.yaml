source:
  edition: WLC
  text: וְ/אֶת הָֽ/רִמּוֹנִ֛ים אַרְבַּ֥ע מֵא֖וֹת לִ/שְׁתֵּ֣י הַ/שְּׂבָכ֑וֹת שְׁנַ֨יִם טוּרִ֤ים רִמּוֹנִים֙ לַ/שְּׂבָכָ֣ה הָ/אֶחָ֔ת לְ/כַסּ֗וֹת אֶת שְׁתֵּי֙ גֻּלּ֣וֹת הַ/כֹּֽתָר֔וֹת אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/עַמּוּדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/013.yaml
  text: and the four hundred pomegranates for the two latticeworks[a], two rows of pomegranates for each latticework[b], to cover the two bowl-shaped capitals that were on top of the pillars.
translation:
  language: te
  text: అలాగే, రెండు జాలకపు అలంకారాల[a] కోసం నాలుగు వందల దానిమ్మపండ్ల ఆకృతులను—ప్రతి జాలకపు అలంకారానికి రెండు వరుసల చొప్పున—స్తంభాల పైభాగాల్లో ఉన్న స్తంభశీర్షాల రెండు గిన్నెలవంటి గుండ్రని భాగాలను[b] కప్పడానికి చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వలలాంటి అలంకార పనులు.’ హీబ్రూ పదం స్తంభశీర్షాలపై ఉన్న జాలకంలాంటి అలంకార నిర్మాణాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘స్తంభశీర్షాల రెండు గిన్నెలు.’ హీబ్రూ పదప్రయోగం స్తంభశీర్షాల గుండ్రని పైభాగాలను గిన్నెలతో పోలుస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמּוֹנִים
  choice: దానిమ్మపండ్ల ఆకృతులు
  rationale: పదం అక్షరార్థంగా దానిమ్మపండ్లను సూచిస్తుంది; ఆలయ అలంకరణ సందర్భంలో ఇవి పండ్ల ఆకారంలో చేసిన అలంకార రూపాలని ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా తెలియజేయడానికి ‘ఆకృతులు’ చేర్చబడింది.
- source_word: אַרְבַּע מֵאוֹת
  choice: నాలుగు వందల
  rationale: హీబ్రూ సంఖ్యను నేరుగా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שְּׂבָכוֹת
  choice: జాలకపు అల్లికలు
  rationale: స్తంభశీర్షాలపై ఉన్న వల లేదా జాలకంలాంటి అలంకార పనిని సూచిస్తుంది; ‘జాలకపు అల్లికలు’ దాని నిర్మాణ స్వభావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: שְׁנַיִם טוּרִים
  choice: రెండు వరుసల చొప్పున
  rationale: టוּרִים అంటే అమర్చిన వరుసలు; రెండు అల్లికలలో ప్రతిదానికీ రెండు వరుసలు ఉన్న పంపిణీ భావాన్ని ‘చొప్పున’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לַשְּׂבָכָה הָאֶחָת
  choice: ఒక్కో జాలకపు అల్లికకు
  rationale: అక్షరార్థంగా ‘ఒక అల్లికకు’ అయినా, సందర్భంలో రెండు అల్లికలలో ప్రతిదానిని పంపిణీ భావంతో సూచిస్తుంది.
- source_word: לְכַסּוֹת
  choice: కప్పడానికి
  rationale: ప్రయోజనాన్ని తెలిపే హీబ్రూ క్రియారూపాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: גֻּלּוֹת
  choice: గిన్నెలవంటి భాగాలు
  rationale: గుండ్రని లేదా గిన్నె ఆకారపు పైభాగాల రూపకాన్ని నిలుపుతూ, అవి స్తంభశీర్షాలలోని భాగాలని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: כֹּתָרוֹת
  choice: స్తంభశీర్షాలు
  rationale: వాస్తుశిల్ప సందర్భంలో స్తంభాల పైభాగంలోని capitals‌ను సూచించే సహజమైన, ఖచ్చితమైన తెలుగు పదం.
- source_word: עַל פְּנֵי הָעַמּוּדִים
  choice: స్తంభాలపై ఉన్న
  rationale: అక్షరార్థంలోని ‘స్తంభాల ఉపరితలంపై’ అనే స్థల సంబంధాన్ని, స్తంభశీర్షాల సందర్భానికి తగిన సహజ తెలుగులో వ్యక్తం చేస్తుంది.
