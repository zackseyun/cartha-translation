source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ֙ מִזְבַּ֣ח נְחֹ֔שֶׁת עֶשְׂרִ֤ים אַמָּה֙ אָרְכּ֔/וֹ וְ/עֶשְׂרִ֥ים אַמָּ֖ה רָחְבּ֑/וֹ וְ/עֶ֥שֶׂר אַמּ֖וֹת קוֹמָתֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/001.yaml
  text: He made a bronze altar[a], twenty cubits its length and twenty cubits its width, and ten cubits its height.
translation:
  language: te
  text: అతడు కంచుతో బలిపీఠాన్ని[a] చేశాడు. దాని పొడవు ఇరవై మూరలు, వెడల్పు ఇరవై మూరలు, ఎత్తు పది మూరలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఇత్తడి బలిపీఠం’ లేదా ‘రాగి బలిపీఠం’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం נְחֹשֶׁת రాగిని లేదా రాగి మిశ్రలోహాన్ని సూచించవచ్చు; ఆలయ సామగ్రి సందర్భంలో సాధారణంగా ‘కంచు’ అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు చేశాడు
  rationale: వావ్-కన్వర్సివ్‌తో ఉన్న עשה కథనాన్ని ముందుకు నడిపే సాధారణ భూతకాల క్రియ; తెలుగులో సహజమైన వాక్యక్రమం కోసం కర్తను స్పష్టంగా ఉంచి అనువదించబడింది.
- source_word: מִזְבַּח
  choice: బలిపీఠం
  rationale: బలులు అర్పించే నిర్మాణాన్ని సూచించే ప్రామాణిక తెలుగు బైబిలు పదం.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ఆలయ సామగ్రి సందర్భంలో נחשת సాధారణంగా రాగి మిశ్రలోహమైన bronze‌ను సూచిస్తుంది; ఆధునిక తెలుగులో ‘కంచు’ సహజమైన ఎంపిక. పదార్థంపై ఉన్న కొంత అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
- source_word: עֶשְׂרִים אַמָּה
  choice: ఇరవై మూరలు
  rationale: ప్రాచీన కొలమానాన్ని ఆధునిక ప్రమాణాలకు మార్చకుండా నిలిపి, తెలుగులో cubit‌కు సంప్రదాయంగా వాడే ‘మూర’ను ఉపయోగించాం.
- source_word: אָרְכּוֹ
  choice: దాని పొడవు
  rationale: నామవాచకంతో కూడిన తృతీయ పురుష ఏకవచన ప్రత్యయాన్ని నిర్మాణ కొలతకు సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: רָחְבּוֹ
  choice: వెడల్పు
  rationale: బలిపీఠపు అడ్డ కొలతను ఆధునిక నిర్మాణ భాషలో సహజంగా తెలియజేస్తుంది; ముందున్న ‘దాని’ దీనికీ వర్తిస్తుంది.
- source_word: וְעֶשֶׂר אַמּוֹת
  choice: ఎత్తు పది మూరలు
  rationale: హీబ్రూ సంఖ్యా కొలతను అలాగే నిలిపి, తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా కొలత నామవాచకాన్ని ముందుంచాం.
- source_word: קוֹמָתוֹ
  choice: ఎత్తు
  rationale: నిర్మాణ సందర్భంలో קומה వస్తువు యొక్క నిలువు కొలతను సూచిస్తుంది; ‘ఎత్తు’ సహజమైన తెలుగు పదం.
