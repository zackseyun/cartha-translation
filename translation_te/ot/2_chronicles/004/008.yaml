source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שֻׁלְחָנוֹת֮ עֲשָׂרָה֒ וַ/יַּנַּח֙ בַּֽ/הֵיכָ֔ל חֲמִשָּׁ֥ה מִ/יָּמִ֖ין וַ/חֲמִשָּׁ֣ה מִ/שְּׂמֹ֑אול וַ/יַּ֛עַשׂ מִזְרְקֵ֥י זָהָ֖ב מֵאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/008.yaml
  text: He made ten tables and placed them in the temple[a], five on the right and five on the left; he also made one hundred bowls of gold.
translation:
  language: te
  text: అతడు పది బల్లలు చేసి, వాటిలో ఐదింటిని ఆలయంలో కుడివైపున, ఐదింటిని ఎడమవైపున ఉంచాడు. అలాగే వంద బంగారు గిన్నెలను[a] చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బంగారు పళ్లాలు,” లేదా “చిలకరించడానికి ఉపయోగించే బంగారు గిన్నెలు.” హీబ్రూ పదం ఆలయ సేవలో ఉపయోగించే ఆచార సంబంధమైన పాత్రలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחָנוֹת
  choice: బల్లలు
  rationale: ఈ నామవాచకానికి సాధారణ అర్థం ‘బల్లలు’. ఆలయ సామగ్రి సందర్భంలో వాటి ప్రత్యేక ఉపయోగాన్ని అనవసరంగా నిర్ధారించకుండా మూలార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיַּנַּח
  choice: ఉంచాడు
  rationale: వస్తువులను ఒక నిర్దిష్ట స్థానంలో పెట్టడాన్ని సూచించే ఈ క్రియకు ఆధునిక తెలుగులో ‘ఉంచాడు’ సహజమైన, స్పష్టమైన అనువాదం.
- source_word: בַּהֵיכָל
  choice: ఆలయంలో
  rationale: ఈ ఆరాధనా సందర్భంలో הֵיכָל రాజభవనాన్ని కాక ఆలయ భవనాన్ని సూచిస్తుంది; ‘ఆలయంలో’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: מִיָּמִין
  choice: కుడివైపున
  rationale: దిశను ఊహించి చేర్చకుండా, మూలంలోని స్థానసూచకమైన ‘కుడి’ అనే అర్థాన్ని నిలుపుతుంది.
- source_word: מִשְּׂמֹאול
  choice: ఎడమవైపున
  rationale: మూలంలోని ‘ఎడమ’ అనే స్థానసూచక అర్థాన్ని కుడివైపున అనే సమాంతర పదబంధంతో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מִזְרְקֵי זָהָב
  choice: బంగారు గిన్నెలు
  rationale: מִזְרָק ఆలయ సేవలో ఉపయోగించే గిన్నె లేదా పాత్రను సూచిస్తుంది. ‘బంగారు గిన్నెలు’ చదవడానికి సులభంగా ఉండి, మరింత నిర్దిష్టమైన కర్మకాండ సంబంధిత ఉపయోగాన్ని ప్రధాన వాక్యంలో రుద్దదు.
- source_word: מֵאָה
  choice: వంద
  rationale: సంఖ్యను తెలుగులో సూటిగా, సహజంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆలయ సామగ్రి జాబితాకు తగిన సరళమైన గౌరవప్రద శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని కుడి–ఎడమ అమరికను నిలిపి, దక్షిణం–ఉత్తరం అనే వ్యాఖ్యానాత్మక దిశలను చేర్చలేదు. ఆంగ్ల సంప్రదింపు పాఠంలో పాదటిప్పణి సూచిక ‘temple’ తర్వాత ఉన్నప్పటికీ, దాని విషయం מִזְרְקֵי זָהָב గురించినందున తెలుగులో సంబంధిత ‘గిన్నెలను’ తర్వాత ఉంచాం.
