translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘ఇదిగో’ మూలంలోని ఉద్ఘాటనను నిలుపుతుంది; గ్రంథశీర్షికను ఉద్ధరణ చిహ్నాల్లో చూపించాం. ‘మొదటి కార్యాలు, చివరి కార్యాలు’ అనే నిర్మాణం మూలంలోని సూత్రబద్ధమైన పూర్వాపర జంటను కాపాడుతుంది.
