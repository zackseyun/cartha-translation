  yaml_path: translation/ot/2_chronicles/035/027.yaml
  text: His acts[a], first and last, behold[c][b], they are written in the Book of the Kings of Israel and Judah.
translation:
  language: te
  text: అతని కార్యాలు, మొదటివి మొదలుకొని చివరివి వరకు—ఇదిగో[b], అవి ఇశ్రాయేలు మరియు యూదా రాజుల గ్రంథంలో[c] రాయబడి ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘ఇదిగో’ అనే పదం లిఖిత ఆధారంపై దృష్టి పెట్టమని ఉద్ఘాటిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా ‘ఇశ్రాయేలు మరియు యూదా రాజుల గ్రంథం మీద.’ హీబ్రూ విభక్తి ‘మీద’ అనే భావాన్ని ఇస్తుంది; అయితే లిఖిత నమోదు గురించి తెలుగులో ‘గ్రంథంలో’ అనడం సహజం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְבָרָיו
  choice: అతని … కార్యాలు
  rationale: דבר అనే పదానికి ‘మాటలు,’ ‘విషయాలు,’ ‘కార్యాలు’ అనే అర్థాలు రావచ్చు. రాజు జీవితాన్ని సంక్షిప్తంగా సూచించే ఈ సందర్భంలో అతని పరిపాలనకు సంబంధించిన పనులు, వ్యవహారాలు అన్న భావాన్ని ‘కార్యాలు’ సహజంగా తెలియజేస్తుంది.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרֹנִים
  choice: మొదటి కార్యాలు, చివరి కార్యాలు
  rationale: రాజు చరిత్రలోని పూర్వాపర కాలమంతటినీ సూచించే మూలభాషా జంటను స్పష్టంగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: הִנָּם
  choice: ఇదిగో
  rationale: వ్రాతపూర్వక ఆధారంపై పాఠకుని దృష్టిని మళ్లించే మూలంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: כְּתוּבִים
  choice: రాయబడి ఉన్నాయి
  rationale: כתב యొక్క నిష్క్రియార్థాన్ని నేరుగా, సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: עַל סֵפֶר
  choice: గ్రంథంలో
  rationale: עַל అక్షరార్థంగా ‘మీద’ అయినప్పటికీ, ఒక లిఖిత ఆధారంలో విషయం నమోదై ఉందని చెప్పేటప్పుడు ‘గ్రంథంలో’ అనడం సహజమైన తెలుగు ప్రయోగం.
- source_word: מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: ‘ఇశ్రాయేలు, యూదా రాజుల గ్రంథం’
  rationale: ఇది రచయిత ఉదహరిస్తున్న ఆధార గ్రంథపు పేరుగా గ్రహించి, రెండు రాజ్యాల పేర్లను ఒకే శీర్షికలో సహజంగా కలిపింది.
