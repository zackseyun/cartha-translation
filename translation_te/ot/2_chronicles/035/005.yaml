id: 2CH.35.5
reference: 2 Chronicles 35:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עִמְד֣וּ בַ/קֹּ֗דֶשׁ לִ/פְלֻגּוֹת֙ בֵּ֣ית הָֽ/אָב֔וֹת לַ/אֲחֵי/כֶ֖ם בְּנֵ֣י הָ/עָ֑ם וַ/חֲלֻקַּ֥ת בֵּֽית אָ֖ב לַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/005.yaml
  text: And stand in the holy place according to the divisions of the fathers’ houses of your brothers[a], the sons of the people, and according to the division of a father’s house for the Levites.
translation:
  language: te
  text: ప్రజల కుమారులైన మీ సహోదరుల పితృగృహాల విభాగాల ప్రకారం, లేవీయుల కోసం ఒక పితృగృహ విభాగం ప్రకారం పవిత్ర స్థలంలో నిలబడండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעִמְדוּ
  choice: నిలబడండి
  rationale: עמד అనే క్రియ యొక్క బహువచన ఆజ్ఞార్థాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తపరుస్తుంది. వాక్యారంభంలోని וְ ఇక్కడ ముందు ఆదేశాలతో అనుసంధానిస్తుంది; అయితే స్వతంత్ర వచనంగా తెలుగులో అదనపు ‘మరియు’ లేకుండానే ఆ అనుసంధానం సహజంగా గ్రహించబడుతుంది.
- source_word: בַקֹּדֶשׁ
  choice: పవిత్ర స్థలంలో
  rationale: నిర్దిష్ట ఉపపదంతో కూడిన ఈ పదబంధం పవిత్ర ప్రదేశాన్ని సూచిస్తుంది. ‘పవిత్ర స్థలం’ అనేది ‘ఆలయం’ లేదా ప్రత్యేక గది అని అతిగా నిర్దిష్టం చేయకుండా మూలంలోని స్థలార్థాన్ని నిలుపుతుంది.
- source_word: לִפְלֻגּוֹת
  choice: విభాగాల ప్రకారం
  rationale: פלגה పదం క్రమబద్ధమైన విభాగాలు లేదా గుంపులను సూచిస్తుంది; לְ ఉపసర్గంలోని అమరికకు అనుగుణమైన భావాన్ని ‘ప్రకారం’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: בֵּית הָאָבוֹת
  choice: పితృగృహ
  rationale: ఇది తండ్రి వంశం ఆధారంగా ఏర్పడిన కుటుంబ లేదా వంశగృహ సమూహాలకు వాడే స్థిరమైన వంశావళి పదబంధం. ‘పితృగృహ’ మూలరూపాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా కాపాడుతుంది.
- source_word: לַאֲחֵיכֶם
  choice: మీ సహోదరులైన
  rationale: లేవీయులతో ఒడంబడిక సంబంధం గల తోటి ఇశ్రాయేలీయులను సూచించే బంధుత్వ భాషను నిలుపుతుంది; తరువాతి ‘ప్రజల కుమారులు’ అనే పదబంధంతో సంబంధాన్ని తెలుగులో స్పష్టంగా కలుపుతుంది.
- source_word: בְּנֵי הָעָם
  choice: ప్రజల కుమారులు[a]
  rationale: హీబ్రూ పదబంధానికి సమీపమైన రూపాన్ని ఉంచి, లేవీయులు కాని ఇశ్రాయేలీయులను సూచించే సందర్భార్థాన్ని పాదసూచికలో వివరిస్తుంది. మూలంలోని పురుష బంధుత్వ/సామాజిక భాషను సమతలీకరించదు.
- source_word: וַחֲלֻקַּת בֵּית אָב לַלְוִיִּם
  choice: లేవీయుల పితృగృహ విభాగం ప్రకారం
  rationale: ప్రజల పితృగృహ విభాగాలకు సమాంతరంగా లేవీయుల పితృగృహ విభాగాన్ని ఉంచుతుంది. ఏకవచనాన్ని ప్రతినిధి విభాగంగా నిలిపి, వాక్యంలోని అమరిక భావాన్ని తెలుగులో సహజంగా చూపేందుకు ‘ప్రకారం’ను పునరుక్తం చేస్తుంది.
theological_decisions:
- issue: బంధుత్వం మరియు సామాజిక వర్గాన్ని సూచించే లింగభాష
  choice: ‘మీ సహోదరులైన ప్రజల కుమారులు’ అనే మూలానికి సమీపమైన పదబంధాన్ని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘మీ తోటి ఇశ్రాయేలీయులు’ లేదా ‘సామాన్య ప్రజలు’
  rationale: హీబ్రూ పురుష బంధుత్వ పదాలు ఇశ్రాయేలు పితృవంశ నిర్మాణంలో ప్రతినిధి అర్థంతో పనిచేస్తాయి. వాటిని పూర్తిగా లింగతటస్థంగా మార్చకుండా మూలంలోని కుటుంబ-వంశ నిర్మాణాన్ని కాపాడి, సందర్భార్థాన్ని పాదసూచికలో వివరిస్తుంది.
- issue: చివరి పదబంధంలోని వాక్యనిర్మాణ సంబంధం
  choice: ‘లేవీయుల పితృగృహ విభాగం ప్రకారం’ అని సమాంతర అమరికగా అనువదించడం
  alternative: ‘లేవీయుల కోసం ఒక్కో పితృగృహ విభాగంతో’
  rationale: మూలంలోని וַחֲלֻקַּת సమన్వయాన్ని మరియు ముందున్న విభాగాల ఆలోచనను కాపాడుతుంది. లేవీయుల విభాగం ప్రజల విభాగాలకు ఎలా జతచేయబడిందనే వివరాన్ని అవసరానికి మించి నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. ‘పితృగృహం,’ ‘పవిత్ర స్థలం’ వంటి పదాలు చారిత్రక-ఆరాధనా సందర్భాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి. మూలంలోని రెండు సమాంతర విభాగ నిర్మాణాలను తెలుగులో ‘ప్రకారం’ పునరుక్తితో స్పష్టం చేశాం.
