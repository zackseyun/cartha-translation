id: 2CH.35.22
reference: 2 Chronicles 35:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹֽא הֵסֵב֩ יֹאשִׁיָּ֨הוּ פָנָ֜י/ו מִמֶּ֗/נּוּ כִּ֤י לְ/הִלָּחֵֽם בּ/וֹ֙ הִתְחַפֵּ֔שׂ וְ/לֹ֥א שָׁמַ֛ע אֶל דִּבְרֵ֥י נְכ֖וֹ מִ/פִּ֣י אֱלֹהִ֑ים וַ/יָּבֹ֕א לְ/הִלָּחֵ֖ם בְּ/בִקְעַ֥ת מְגִדּֽוֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/022.yaml
  text: But Josiah did not turn his face away from him[a]; rather, he disguised himself to fight against him. He did not listen to the words of Neco from the mouth of God[c][b], and he came to fight in the Valley of Megiddo.
translation:
  language: te
  text: కాని యోషీయా అతని నుండి తన ముఖం తిప్పుకోలేదు[a]. బదులుగా, అతనికి వ్యతిరేకంగా యుద్ధం చేయడానికి మారువేషం వేసుకున్నాడు. దేవుని నోటి నుండి వచ్చిన నెకో మాటలను[b] అతడు వినలేదు. అతడు మెగిద్దో లోయలో[c] యుద్ధం చేయడానికి వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని నుండి వెనుదిరగలేదు.’
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: ‘దేవుని నోటి నుండి.’'
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘మెగిద్దో మైదానంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסֵב ... פָנָיו מִמֶּנּוּ
  choice: అతని నుండి తన ముఖం తిప్పుకోలేదు
  rationale: ముఖం తిప్పుకోవడం అనే హీబ్రూ రూపకాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా అర్థమయ్యేలా అనువదించబడింది.
- source_word: כִּי
  choice: దానికి బదులుగా
  rationale: ఇక్కడ ఈ పదం కచ్చితమైన కారణాన్ని కాకుండా, యోషీయా వెనుదిరగక చేసిన విరుద్ధ చర్యను పరిచయం చేస్తోంది.
- source_word: לְהִלָּחֵם בּוֹ
  choice: అతనితో యుద్ధం చేయడానికి
  rationale: లామెదు ఉద్దేశాన్ని తెలియజేస్తుంది; సందర్భంలో בּוֹ నెకోను ఎదిరించి యుద్ధం చేయడాన్ని సూచిస్తుంది. తెలుగులో ‘అతనితో యుద్ధం చేయడం’ సహజంగా ప్రతికూల సైనిక చర్యను వ్యక్తం చేస్తుంది.
- source_word: הִתְחַפֵּשׂ
  choice: మారువేషం వేసుకున్నాడు
  rationale: హిత్పయేల్ క్రియలోని స్వయంకర్తృక భావాన్ని సహజమైన ఆధునిక తెలుగు ప్రయోగం స్పష్టంగా తెలియజేస్తుంది.
- source_word: שָׁמַע אֶל
  choice: వినలేదు
  rationale: ఈ పదబంధం ‘పట్టించుకోలేదు’ లేదా ‘లోబడలేదు’ అనే భావాలను కలిగి ఉండగలదు; విస్తృతమైన మూలార్థాన్ని, దాని సందర్భগত తీవ్రతను అలాగే ఉంచడానికి ‘వినలేదు’ ఎంచుకోబడింది.
- source_word: דִּבְרֵי נְכוֹ
  choice: నెకో మాటలు
  rationale: ‘సందేశం’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా, మూలంలోని ‘మాటలు’ అనే సాధారణ పదాన్ని నేరుగా నిలుపుతుంది.
- source_word: מִפִּי אֱלֹהִים
  choice: దేవుని నోటి నుండి వచ్చిన
  rationale: నెకో మాటలకు దేవుడే మూలమని వచనం చెప్పే విషయాన్ని తగ్గించకుండా, హీబ్రూ ‘దేవుని నోటి నుండి’ అనే రూపకాన్ని కాపాడుతుంది.
- source_word: וַיָּבֹא
  choice: అతడు ... వచ్చాడు
  rationale: בוא అనే క్రియకు నేరమైన అర్థాన్ని నిలుపుతుంది; తరువాతి ఉద్దేశార్థక క్రియతో తెలుగులో సహజంగా ఉంటుంది.
- source_word: בְּבִקְעַת מְגִדּוֹ
  choice: మెగిద్దో లోయలో
  rationale: בִּקְעָה విశాలమైన లోయ లేదా మైదానాన్ని సూచించగలదు. ‘లోయ’ స్పష్టమైన భౌగోళిక పదం; ‘మైదానం’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
theological_decisions:
- issue: నెకో మాటలు నిజంగా దేవుని నుండి వచ్చినవిగా వృత్తాంతకర్త చూపిస్తున్నాడా?
  choice: ‘దేవుని నోటి నుండి వచ్చిన నెకో మాటలు’ అని ప్రధాన పాఠంలో ఉంచబడింది.
  alternative: ‘దేవుని నుండి వచ్చిన నెకో మాటలు’ అని రూపకాన్ని సరళీకరించవచ్చు; లేదా నెకో చేసిన వాదనగా మాత్రమే వ్యాఖ్యానించవచ్చు.
  rationale: వచనం నెకో మాటలను దేవుని నుండి వచ్చినవిగానే ప్రతిపాదిస్తోంది. వాటి దైవిక మూలాన్ని ప్రశ్నించే వ్యాఖ్యానాన్ని అనువాదంలో చొప్పించకుండా, మూలంలోని దైవశాస్త్ర ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ ముఖరూపకం మరియు ‘దేవుని నోటి నుండి’ అనే దైవశాస్త్రపరంగా ముఖ్యమైన ప్రయోగం నిలుపబడ్డాయి; ప్రతి ప్రత్యామ్నాయానికి సంబంధించిన సూచిక దాని సరైన పదబంధం దగ్గర ఉంచబడింది.
