  text: בִּ/שְׁמוֹנֶ֤ה עֶשְׂרֵה֙ שָׁנָ֔ה לְ/מַלְכ֖וּת יֹאשִׁיָּ֑הוּ נַעֲשָׂ֖ה הַ/פֶּ֥סַח הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/019.yaml
  text: In the eighteenth year of Josiah’s reign[a], this Passover was kept.
translation:
  language: te
  text: యోషీయా పరిపాలన పద్దెనిమిదవ సంవత్సరంలో ఈ పస్కా ఆచరించబడింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ పస్కా పాటించబడింది’; మరింత అక్షరార్థంగా, ‘ఈ పస్కా చేయబడింది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/שְׁמוֹנֶה עֶשְׂרֵה שָׁנָה
  choice: పదెనిమిదవ సంవత్సరంలో
  rationale: కాలాన్ని సూచించే בְּ ఉపసర్గతో కూడిన హెబ్రీ సంఖ్యా ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో క్రమసంఖ్యతో వ్యక్తం చేసింది.
- source_word: לְ/מַלְכוּת יֹאשִׁיָּהוּ
  choice: యోషీయా పరిపాలనలో
  rationale: מַלְכוּת ఇక్కడ రాజు పాలించిన కాలాన్ని సూచిస్తుంది. ‘పరిపాలనలో’ అనేది రాజ్యకాల నిర్దేశాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: נַעֲשָׂה
  choice: ఆచరించబడింది
  rationale: ఈ క్రియకు అక్షరార్థంగా ‘చేయబడింది’ అనే భావం ఉన్నా, פֶּסַח‌తో కలిసి వచ్చినప్పుడు పస్కాను విధిగా పాటించడాన్ని సూచిస్తుంది. ‘ఆచరించబడింది’ ఆ సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: הַ/פֶּסַח
  choice: పస్కా
  rationale: פֶּסַח‌కు తెలుగులో స్థిరపడిన బైబిలు సంబంధిత పదం ‘పస్కా’; మూలంలో లేని ‘పండుగ’ అనే విస్తరణను చేర్చలేదు.
- source_word: הַ/זֶּה
  choice: ఈ
  rationale: సందర్భంలో ఇంతకుముందు వివరించిన నిర్దిష్ట పస్కాను సూచించే నిర్దేశక సర్వనామాన్ని నేరుగా నిలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘ఆచరించబడింది’ అనే రూపం హెబ్రీ క్రియ యొక్క సందర్భార్థాన్ని అందిస్తూనే, అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరుస్తుంది.
