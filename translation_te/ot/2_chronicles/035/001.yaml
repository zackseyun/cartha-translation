  source_fidelity: 'హీబ్రూ మూలపాఠంలోని రెండు ప్రయోగాల మధ్య ఉన్న అర్థభేదాన్ని అనువాదం సముచితంగా ప్రతిబింబిస్తుంది: మొదటి פֶּסַח పస్కా ఆచరణను, రెండవ הַפֶּסַח వధించబడే పస్కా బలిపశువును సూచిస్తుంది. לַיהוָהను ‘యాహ్వేకు’గా, తేదీని ‘మొదటి నెల పద్నాలుగో రోజున’గా సరిగ్గా అందించారు. రెండవ వాక్యంలో ‘వారు’ అనేది హీబ్రూ బహువచన క్రియను నిలుపుతుంది.'
