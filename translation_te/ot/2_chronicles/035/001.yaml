id: 2CH.35.1
reference: 2 Chronicles 35:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ יֹאשִׁיָּ֧הוּ בִֽ/ירוּשָׁלִַ֛ם פֶּ֖סַח לַ/יהוָ֑ה וַ/יִּשְׁחֲט֣וּ הַ/פֶּ֔סַח בְּ/אַרְבָּעָ֥ה עָשָׂ֖ר לַ/חֹ֥דֶשׁ הָ/רִאשֽׁוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/001.yaml
  text: Josiah kept the Passover to Yahweh in Jerusalem[a], and they slaughtered the Passover on the fourteenth day of the first month.
translation:
  language: te
  text: యోషీయా యెరూషలేములో యాహ్వేకు పస్కాను ఆచరించాడు. మొదటి నెల పద్నాలుగో రోజున వారు పస్కా బలిపశువును[a] వధించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘పస్కా’; ఇక్కడ ఆ పదం వధించబడే పస్కా బలిపశువును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ఆచరించాడు
  rationale: ‘చేశాడు’ అనే మూలార్థం ఉన్నప్పటికీ, పֶסַח కర్మగా ఉన్నప్పుడు పండుగను నియమానుసారంగా జరపడం లేదా ఆచరించడం అనే నుడికారార్థం వస్తుంది.
- source_word: פֶּסַח
  choice: పస్కా
  rationale: మొదటి సందర్భంలో ఈ పదం పస్కా ఆచరణను సమగ్రంగా సూచిస్తుంది; ఆధునిక తెలుగు బైబిలు వాడుకలో ‘పస్కా’ సహజంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: ל అంకితం లేదా దిశను సూచిస్తుంది; దేవుని స్వనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: בִירוּשָׁלִַם
  choice: యెరూషలేములో
  rationale: స్థలార్థక ప్రయోగాన్ని సహజమైన తెలుగు విభక్తితో తెలిపాం.
- source_word: וַיִּשְׁחֲטוּ
  choice: వధించారు
  rationale: שׁחט బలికి సంబంధించిన పశువును గొంతుకోసి చంపడాన్ని సూచిస్తుంది; ‘వధించారు’ ఆ ఆచారసంబంధ భావాన్ని అతిగా విపులీకరించకుండా నిలుపుతుంది.
- source_word: הַפֶּסַח
  choice: పస్కా బలిపశువును
  rationale: రెండవ సందర్భంలో వధించబడే పస్కా బలిని సూచించే లక్షణార్థక ప్రయోగం ఉంది. ‘గొర్రెపిల్ల’ అని మూలంలో లేని జంతుజాతిని నిర్దిష్టం చేయకుండా ‘బలిపశువు’ అని స్పష్టం చేశాం.
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ הָרִאשׁוֹן
  choice: మొదటి నెల పద్నాలుగో రోజున
  rationale: హీబ్రూ తేదీ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు కాలప్రయోగంగా అందించాం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో దేవుని స్వనామం ప్రత్యక్షంగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా, సాధ్యమైన హీబ్రూ ఉచ్చారణకు సమీపంగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- issue: రెండవ הַפֶּסַח సూచించే అర్థం
  choice: పస్కా బలిపశువు
  alternative: పస్కా / పస్కా గొర్రెపిల్ల
  rationale: వధించడం అనే క్రియ వల్ల ఇక్కడ పండుగకన్నా బలిగా అర్పించే జంతువే ఉద్దేశమని సందర్భం సూచిస్తుంది. అయితే మూలపదం జంతుజాతిని పేర్కొనదు కాబట్టి ‘గొర్రెపిల్ల’ను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘ఆచరించాడు’, ‘వధించారు’ వంటి పదాలు ఆచార సందర్భాన్ని నిలుపుతూ సహజంగా ఉన్నాయి; రెండు హీబ్రూ వాక్యాలను తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా ఇచ్చాం.
