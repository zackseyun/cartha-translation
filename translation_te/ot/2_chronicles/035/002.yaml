source:
  edition: WLC
  text: וַ/יַּעֲמֵ֥ד הַ/כֹּהֲנִ֖ים עַל מִשְׁמְרוֹתָ֑/ם וַֽ/יְחַזְּקֵ֔/ם לַ/עֲבוֹדַ֖ת בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/002.yaml
  text: He appointed the priests to their duties and strengthened them for the service of the house of Yahweh[a][b].
translation:
  language: te
  text: అతడు యాజకులను వారి బాధ్యతల్లో నియమించి[a], యహ్వే మందిరంలోని సేవకు వారిని బలపరిచాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారి సేవా విభాగాలపై,” “వారి స్థానాల్లో,” లేదా మరింత అక్షరార్థంగా “వారి కాపలా వంతులపై.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “వారిని ప్రోత్సహించాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: నియమించి
  rationale: עמד యొక్క హిఫీల్ రూపం ఇక్కడ యాజకులను వారికి కేటాయించిన స్థానాల్లో లేదా బాధ్యతల్లో ఉంచడాన్ని సూచిస్తుంది. పరిపాలనా సందర్భంలో ‘నియమించి’ సహజంగా ఈ భావాన్ని తెలియజేస్తుంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులను
  rationale: כהנים అనే నిర్దిష్ట బహువచన నామానికి ఆధునిక ప్రామాణిక తెలుగు రూపం.
- source_word: עַל מִשְׁמְרוֹתָם
  choice: వారి విధుల్లో
  rationale: מִשְׁמָרוֹת సేవా వంతులు, కాపలా స్థానాలు, విభాగాలు లేదా కేటాయించిన బాధ్యతలను సూచించగలదు. ఆలయ సేవ సందర్భంలో ‘వారి విధుల్లో’ స్పష్టంగా, సహజంగా ఉంటుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
- source_word: וַיְחַזְּקֵם
  choice: వారిని బలపరిచాడు
  rationale: חזק పియేల్ రూపం బలపరచడం లేదా ప్రోత్సహించడం అనే భావాలను కలిగి ఉంటుంది. ‘బలపరిచాడు’ మూల పదార్థాన్ని నిలుపుతూ ఉద్దేశపూర్వకమైన సందిగ్ధతను కాపాడుతుంది.
- source_word: לַעֲבוֹדַת
  choice: సేవ కోసం
  rationale: עֲבוֹדָה ఇక్కడ ఆలయానికి సంబంధించిన పని లేదా సేవను సూచిస్తుంది. ‘సేవ’ విస్తృతమైనదీ సందర్భోచితమైనదీ.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిర
  rationale: בֵּית అనే ‘ఇల్లు’ పదం సందర్భంలో ఆలయాన్ని సూచిస్తుంది; సహజమైన ఆధునిక తెలుగులో ‘మందిరం’ ఆ ఉద్దేశ్యాన్ని స్పష్టంగా తెలియజేస్తుంది. יְהוָה అనే దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంతో వ్యక్తిగత నామంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘విధుల్లో నియమించి’ పరిపాలనా సందర్భాన్ని సహజంగా తెలియజేస్తుంది; ‘బలపరిచాడు’ హెబ్రీ పదంలోని బలపరచడం/ప్రోత్సహించడం అనే అర్థవిస్తృతిని పాదసూచికతో కాపాడుతుంది.
