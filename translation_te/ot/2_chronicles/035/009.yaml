  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ו/כונניהו וּ/שְׁמַֽעְיָ֨הוּ וּ/נְתַנְאֵ֜ל אֶחָ֗י/ו וַ/חֲשַׁבְיָ֧הוּ וִ/יעִיאֵ֛ל וְ/יוֹזָבָ֖ד שָׂרֵ֣י הַ/לְוִיִּ֑ם הֵרִ֨ימוּ לַ/לְוִיִּ֤ם לַ/פְּסָחִים֙ חֲמֵ֣שֶׁת אֲלָפִ֔ים וּ/בָקָ֖ר חֲמֵ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/009.yaml
  text: Conaniah[a], and Shemaiah and Nethanel his brothers, and Hashabiah and Jeiel and Jozabad, the chiefs of the Levites, contributed to the Levites for the Passover offerings five thousand and five hundred head of cattle.
translation:
  language: te
  text: లేవీయుల నాయకులైన కొనన్యా, అతని సోదరులైన షెమయా, నెతనేలు, అలాగే హషబ్యా, యెయీయేలు, యోజాబాదు—పస్కా బలుల కోసం లేవీయులకు ఐదువేల గొర్రెలను, మేకలను[a], ఐదువందల పశువులను సమకూర్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో ఇక్కడ ‘ఐదువేలు’ అని మాత్రమే ఉంది; జంతువుల పేరు చెప్పబడలేదు. ముందున్న సందర్భాన్ని బట్టి గొర్రెలు, మేకలు అని అర్థం చేసుకోవచ్చు. అక్షరార్థంగా: ‘పస్కా బలుల కోసం ఐదువేలు.’'
    reason: మూలంలోని వాక్యలోపాన్ని మరియు సందర్భాధారిత పూరణను తెలియజేయడం.
lexical_decisions:
- source_word: כונניהו
  choice: కొనన్యా
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: שְׁמַעְיָהוּ
  choice: షెమయా
  rationale: హీబ్రూ పేరుకు సహజమైన తెలుగు లిప్యంతరీకరణ.
- source_word: נְתַנְאֵל
  choice: నెతనేలు
  rationale: హీబ్రూ స్వరరూపాన్ని ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: אֶחָיו
  choice: అతని సోదరులైన
  rationale: పదశః కుటుంబ సంబంధాన్ని నిలిపి, కొనన్యాతో షెమయా మరియు నెతనేలుకు ఉన్న సంబంధాన్ని తెలుగులో స్పష్టంగా చూపిస్తుంది.
- source_word: חֲשַׁבְיָהוּ
  choice: హషబ్యా
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగులో సులభంగా పలికేలా లిప్యంతరీకరించాం.
- source_word: יעיאל
  choice: యెయీయేలు
  rationale: హీబ్రూ వ్యక్తిపేరుకు దగ్గరైన తెలుగు లిప్యంతరీకరణ.
- source_word: יוֹזָבָד
  choice: యోజాబాదు
  rationale: హీబ్రూ వ్యక్తిపేరుకు దగ్గరైన, సహజమైన తెలుగు రూపం.
- source_word: שָׂרֵי הַלְוִיִּם
  choice: లేవీయుల నాయకులు
  rationale: שָׂרִים సూచించే అధికారిక నాయకత్వ భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: הֵרִימוּ
  choice: సమకూర్చారు
  rationale: ఇక్కడి హిఫీల్ రూపం విరాళంగా ఇవ్వడం లేదా అవసరానికి అందించడం అనే భావంలో ఉంది; పండుగ ఏర్పాట్ల సందర్భంలో ‘సమకూర్చారు’ సహజంగా ఉంటుంది.
- source_word: לַלְוִיִּם
  choice: లేవీయులకు
  rationale: లేవీయులే ఈ సమకూర్పును స్వీకరించినవారని దాతివాచక రూపం స్పష్టపరుస్తుంది.
- source_word: לַפְּסָחִים
  choice: పస్కా బలుల కోసం
  rationale: హీబ్రూ బహువచనం అనేక పండుగలను కాకుండా పస్కా ఆచరణకు నియమించిన బలి జంతువులను సూచిస్తుంది.
- source_word: חֲמֵשֶׁת אֲלָפִים וּבָקָר חֲמֵשׁ מֵאוֹת
  choice: ఐదువేల గొర్రెలను, మేకలను; ఐదువందల పశువులను
  rationale: మూలంలో మొదటి సంఖ్యకు జంతువుల వర్గం విడిచిపెట్టబడినా, సమీప సందర్భం దాన్ని గొర్రెలు-మేకలుగా అర్థం చేసుకోవడానికి ఆధారం ఇస్తుంది; בָקָר మాత్రం రెండవ సంఖ్యను పెద్ద పశువులుగా స్పష్టంగా పేర్కొంటుంది. అందువల్ల 5,500 అన్నీ పశువులేనని కలిపివేయలేదు.
theological_decisions:
- issue: పస్కా బలుల జంతువుల సంఖ్యలు మరియు వర్గాలు
  choice: ఐదువేల గొర్రెలు-మేకలు, ఐదువందల పశువులు అని వేర్వేరుగా చూపించడం
  alternative: మొత్తం ఐదువేల ఐదువందల పశువులు అని కలిపి అనువదించడం
  rationale: హీబ్రూలో ‘ఐదువేలు’ తరువాత విడిచిపెట్టబడిన జంతు నామం సందర్భం ద్వారా పూరించబడుతుంది; ఆ తరువాత ‘పశువులు ఐదువందలు’ అని ప్రత్యేకంగా ఉంది. ఈ వ్యత్యాసం బలి ఏర్పాట్ల స్వరూపాన్ని ప్రభావితం చేయగలదు కాబట్టి మూల నిర్మాణాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల వాక్యనిర్మాణం వాడాం. పేర్ల జాబితాలో సంబంధాలను స్పష్టపరచడానికి విరామచిహ్నాలు ఉపయోగించాం. మూల హీబ్రూలోని రెండు జంతు వర్గాల సంఖ్యలను కలపకుండా నిలిపాం.
