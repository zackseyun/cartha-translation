source:
  edition: WLC
  text: וַ/יֹּרוּ֙ הַ/יֹּרִ֔ים לַ/מֶּ֖לֶךְ יֹאשִׁיָּ֑הוּ וַ/יֹּ֨אמֶר הַ/מֶּ֤לֶךְ לַ/עֲבָדָי/ו֙ הַעֲבִיר֔וּ/נִי כִּ֥י הָחֳלֵ֖יתִי מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/023.yaml
  text: And the archers shot King Josiah[a], and the king said to his servants, “Take me away, for I am severely wounded.”
translation:
  language: te
  text: విలుకాండ్రు రాజు యోషీయాపై బాణాలు వేశారు. అప్పుడు రాజు తన సేవకులతో ఇలా అన్నాడు, “నన్ను తీసుకువెళ్లండి, ఎందుకంటే నేను చాలా గాయపడ్డాను[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ క్రియకు “నేను చాలా బలహీనపడ్డాను” లేదా “నేను తీవ్రంగా అస్వస్థుడనయ్యాను” అనే విస్తృత అర్థం కూడా ఉండవచ్చు; అయితే ఇక్కడి యుద్ధసందర్భం “నేను చాలా గాయపడ్డాను” అనే అర్థానికి అనుకూలంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרוּ הַיֹּרִים
  choice: విలుకాండ్రు ... బాణాలతో కొట్టారు
  rationale: ירה అనే క్రియకు యుద్ధసందర్భంలో బాణాలు వేయడం అనే అర్థం ఉంది; దాని కర్తృవాచక రూపం הַיֹּרִים ఇక్కడ విల్లుతో బాణాలు వేసేవారిని సూచిస్తుంది. సహజమైన తెలుగులో క్రియ యొక్క సాధనాన్ని స్పష్టంచేయడానికి ‘బాణాలతో కొట్టారు’ అని అనువదించాం.
- source_word: לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: రాజైన యోషీయాను
  rationale: ל ఇక్కడ బాణప్రయోగ లక్ష్యాన్ని సూచిస్తుంది. తెలుగులో నేర కర్మగా ‘యోషీయాను’ అనడం సహజం.
- source_word: הַעֲבִירוּנִי
  choice: నన్ను ఇక్కడి నుండి తీసుకెళ్లండి
  rationale: עבר యొక్క హిఫీల్ రూపం ‘నన్ను దాటించండి/తరలించండి’ అనే భావాన్ని ఇస్తుంది. యుద్ధభూమి నుండి తనను తొలగించమనే సందర్భార్థాన్ని సహజంగా తెలియజేయడానికి ఈ రూపాన్ని ఎంచుకున్నాం; మోసుకెళ్లాలని మాత్రమే హీబ్రూ నిర్దిష్టంగా చెప్పదు.
- source_word: כִּי
  choice: ;
  rationale: ఆజ్ఞకు కారణాన్ని పరిచయం చేస్తుంది. తెలుగులో ప్రత్యక్ష సంభాషణలో ప్రత్యేక కారణసూచక పదం లేకుండానే అర్ధవిరామంతో ఈ సంబంధం సహజంగా వ్యక్తమవుతుంది.
- source_word: הָחֳלֵיתִי מְאֹד
  choice: నేను తీవ్రంగా గాయపడ్డాను
  rationale: חלה సాధారణంగా బలహీనపడడం లేదా జబ్బుపడడం అనే విస్తృత అర్థం కలిగి ఉన్నప్పటికీ, బాణప్రయోగం జరిగిన యుద్ధసందర్భంలో తీవ్రమైన గాయాన్ని సూచిస్తుంది. מְאֹד తీవ్రతను తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘విలుకాండ్రు’ అనే సుపరిచిత బైబిలు-సాహిత్య పదం సంక్షిప్తతను, యుద్ధసందర్భపు గంభీరతను నిలుపుతుంది.
