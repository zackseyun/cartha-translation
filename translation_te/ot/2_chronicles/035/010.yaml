id: 2CH.35.10
reference: 2 Chronicles 35:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּכּ֖וֹן הָ/עֲבוֹדָ֑ה וַ/יַּֽעַמְד֨וּ הַ/כֹּהֲנִ֧ים עַל עָמְדָ֛/ם וְ/הַ/לְוִיִּ֥ם עַל מַחְלְקוֹתָ֖/ם כְּ/מִצְוַ֥ת הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/010.yaml
  text: So the service was prepared[a], and the priests stood at their stations, and the Levites by their divisions[c][b], according to the command of the king.
translation:
  language: te
  text: ఆ విధంగా సేవ సిద్ధపరచబడింది[a]. యాజకులు తమ తమ స్థానాల్లో[b], లేవీయులు తమ తమ విభాగాల ప్రకారం[c] నిలబడ్డారు—రాజు ఆజ్ఞ ప్రకారం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘క్రమబద్ధం చేయబడింది’ లేదా ‘స్థాపించబడింది.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘తమ నిలబడే చోట’; అంటే తమకు నియమించిన స్థానాల్లో.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘తమ తమ విభాగాల్లో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכּוֹן
  choice: సిద్ధపరచబడింది
  rationale: כון రూపం ఇక్కడ సేవను సిద్ధంగా ఉంచడం, క్రమబద్ధం చేయడం లేదా స్థాపించడం అనే భావాన్ని ఇస్తుంది. పస్కా ఆచరణ సందర్భంలో ‘సిద్ధపరచబడింది’ సహజంగా ఉండి, మూలంలోని కర్మణి భావాన్ని నిలుపుతుంది.
- source_word: הָעֲבוֹדָה
  choice: సేవ
  rationale: ఆలయ సందర్భంలో עֲבוֹדָה ఆరాధనకు సంబంధించిన పవిత్ర సేవను సూచిస్తుంది. ‘సేవ’ ఆధునిక తెలుగులో సహజమైనదిగా ఉండి, కేవలం సాధారణ ‘పని’ అనే విస్తృత భావాన్ని నివారిస్తుంది.
- source_word: וַיַּעַמְדוּ
  choice: నిలబడ్డారు
  rationale: עמד యొక్క ప్రత్యక్ష అర్థం ‘నిలబడడం’; వెంట వచ్చే స్థాన, విభాగ సూచనలు వారు తమకు నియమించిన చోట్ల నిలిచారని స్పష్టం చేస్తాయి.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: ఆలయసేవ సందర్భంలో כֹּהֲנִיםకు ప్రామాణికమైన, సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: עַל עָמְדָם
  choice: తమ తమ స్థానాల్లో
  rationale: అక్షరార్థంగా ‘తమ నిలబడే చోట’ అనే భావం. ‘తమ తమ స్థానాల్లో’ అనేది వారికి నియమించబడిన సేవాస్థానాలను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి గోత్రానికి చెందిన ఆలయసేవకుల సమూహానికి ప్రామాణిక తెలుగు రూపం.
- source_word: עַל מַחְלְקוֹתָם
  choice: తమ తమ విభాగాల ప్రకారం
  rationale: מַחְלְקוֹתָם వ్యవస్థీకృత సేవా విభాగాలను సూచిస్తుంది. ‘ప్రకారం’ అనే రూపం עַל యొక్క అమరిక/కేటాయింపు భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: כְּמִצְוַת
  choice: ఆజ్ఞ ప్రకారం
  rationale: ఇక్కడ מִצְוָה ఒక నిర్దిష్ట రాజాజ్ఞను సూచిస్తుంది; అందువల్ల ‘ఆజ్ఞ’ సహజమైనది, సందర్భోచితమైనది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: సందర్భంలోని నిర్దిష్ట రాజును నేరుగా సూచించే సాధారణ తెలుగు పదం.
theological_decisions:
- issue: עֲבוֹדָהకు ఆరాధనా సందర్భంలోని పదప్రయోగం
  choice: సేవ
  alternative: ఆరాధనా సేవ; పని
  rationale: ఈ వచనం ఆలయ పస్కా విధులను వివరిస్తున్నందున పవిత్ర సేవ భావం నిలవాలి. ‘సేవ’ ఆ భావాన్ని కాపాడుతూ, తరువాతి కాలపు ప్రత్యేక మతాచార పదజాలాన్ని అనవసరంగా దిగుమతి చేయదు.
- issue: యాజకులు, లేవీయుల వ్యవస్థీకృత స్థానాల వర్ణన
  choice: తమ తమ స్థానాల్లో ... తమ తమ విభాగాల ప్రకారం
  alternative: తమ నిలబడే చోట ... తమ విభాగాల్లో
  rationale: ఎంచుకున్న రూపం మూలంలోని క్రమబద్ధమైన నియామకాన్ని స్పష్టంగా చూపుతుంది; అయితే వారి విధుల గురించి మూలంలో లేని వివరాలను జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘ఆ విధంగా’ ముందు సందర్భంతో అనుసంధానాన్ని చూపుతుంది. ప్రధాన వాక్యంలో మూలంలోని రెండు సమాంతర సమూహాలను స్పష్టంగా ఉంచి, చివరి ‘రాజు ఆజ్ఞ ప్రకారం’ రెండింటికీ వర్తించేలా డాష్‌తో అమర్చబడింది.
