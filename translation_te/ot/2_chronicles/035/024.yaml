base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/024.yaml
  text: So his servants removed him from the chariot and set him on the second chariot that belonged to him[a], and brought him to Jerusalem. And he died and was buried in the tombs of his fathers, and all Judah and Jerusalem mourned for Josiah.
translation:
  language: te
  text: అతని సేవకులు అతన్ని రథం నుంచి దించి, అతనికి చెందిన రెండో రథం[a] మీద ఎక్కించి, యెరూషలేముకు తీసుకువెళ్లారు. అతను చనిపోయాడు. అతని పూర్వికుల సమాధుల్లో అతన్ని పాతిపెట్టారు. యూదా అంతటివారూ యెరూషలేమువారూ యోషీయా కోసం దుఃఖించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “రెండవదానికి చెందిన రథం.” ఈ నిర్మాణంలోని “రెండవది” దేనిని సూచిస్తుందో స్పష్టంగా లేదు; ఇది బహుశా యోషీయాకు చెందిన రెండో లేదా అదనపు రథాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִירֻהוּ
  choice: అతన్ని ... నుంచి దించి
  rationale: హిఫీల్ రూపం ఒక చోటు నుంచి మరొక చోటుకు తరలించడాన్ని సూచిస్తుంది; గాయపడిన రాజును రథం నుంచి దించిన సందర్భంలో ఇది సహజమైన తెలుగు.
- source_word: עֲבָדָיו
  choice: అతని సేవకులు
  rationale: రాజుకు సేవచేస్తూ అతని వెంట ఉన్నవారిని సూచించే విస్తృతమైన, అతిగా నిర్దిష్టీకరించని పదం.
- source_word: הַמֶּרְכָּבָה
  choice: రథం
  rationale: మూలపదానికి నేరమైన అర్థం; సందర్భంలో అది యుద్ధరథమని స్పష్టమైనా, మూలంలో లేని విశేషణాన్ని చేర్చలేదు.
- source_word: וַיַּרְכִּיבֻהוּ
  choice: ఎక్కించి
  rationale: హిఫీల్ రూపంలోని ‘ఎక్కించడం/ప్రయాణింపజేయడం’ భావాన్ని గాయపడిన వ్యక్తికి సహాయం చేసి రథంపై ఉంచినట్లు సహజంగా తెలియజేస్తుంది.
- source_word: רֶכֶב הַמִּשְׁנֶה
  choice: రెండో రథం
  rationale: ‘రెండవదాని రథం’ అనే అస్పష్టమైన హెబ్రీ నిర్మాణానికి దగ్గరగా ఉంటుంది; అది అదనపు లేదా ప్రత్యామ్నాయ రథమై ఉండవచ్చనే వివరణను పాదటిప్పణిలో ఉంచాం.
- source_word: אֲשֶׁר לוֹ
  choice: అతనికి చెందిన
  rationale: ఆ రథం యోషీయాకు చెందినదని సంబంధవాక్యం స్పష్టం చేస్తుంది.
- source_word: וַיּוֹלִיכֻהוּ
  choice: తీసుకువెళ్లారు
  rationale: యెరూషలేము గమ్యస్థానంగా ఉన్నందున, రవాణా చేయబడుతున్న వ్యక్తిని అక్కడికి తీసుకువెళ్లారనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיָּמָת
  choice: అతను చనిపోయాడు
  rationale: సరళమైన కథన క్రియను ఆధునిక ప్రామాణిక తెలుగులో నేరుగా అనువదిస్తుంది.
- source_word: וַיִּקָּבֵר
  choice: అతన్ని పాతిపెట్టారు
  rationale: హెబ్రీ నిఫాల్‌లోని కర్మణి భావాన్ని తెలుగులో సహజమైన కర్తరిప్రయోగంతో వ్యక్తం చేసింది; అర్థంలో మార్పు లేదు.
- source_word: בְּקִבְרוֹת אֲבֹתָיו
  choice: అతని పూర్వికుల సమాధుల్లో
  rationale: ‘తండ్రులు’ అనే హెబ్రీ బంధుత్వ పదానికి ఇక్కడ వంశపూర్వికుల అర్థం ఉంది; ‘పూర్వికులు’ ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: וְכָל־יְהוּדָה וִירוּשָׁלַם
  choice: యూదా అంతటివారూ యెరూషలేమువారూ
  rationale: దేశం మరియు నగరాన్ని ప్రజాసమూహాలుగా ఉపయోగించిన మూలంలోని వ్యక్తీకరణను సాధారణ తెలుగు పాఠకునికి స్పష్టంగా చేసింది.
- source_word: מִתְאַבְּלִים
  choice: దుఃఖించారు
  rationale: భాగధాతు కొనసాగుతున్న శోకాన్ని సూచించగలిగినా, కథన సందర్భంలో తెలుగు సరళ భూతకాలం సహజంగా ఉండి సామూహిక సంతాపాన్ని సముచితంగా తెలియజేస్తుంది.
