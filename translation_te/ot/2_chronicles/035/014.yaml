source:
  edition: WLC
  text: וְ/אַחַ֗ר הֵכִ֤ינוּ לָ/הֶם֙ וְ/לַ/כֹּ֣הֲנִ֔ים כִּ֤י הַ/כֹּהֲנִים֙ בְּנֵ֣י אַהֲרֹ֔ן בְּ/הַֽעֲל֛וֹת הָ/עוֹלָ֥ה וְ/הַ/חֲלָבִ֖ים עַד לָ֑יְלָה וְ/הַ/לְוִיִּם֙ הֵכִ֣ינוּ לָ/הֶ֔ם וְ/לַ/כֹּהֲנִ֖ים בְּנֵ֥י אַהֲרֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/014.yaml
  text: Afterward they prepared for themselves and for the priests[a], because the priests, the sons of Aaron, were occupied in offering up the burnt offering and the fat portions until night. So the Levites prepared for themselves and for the priests, the sons of Aaron.
translation:
  language: te
  text: ఆ తర్వాత లేవీయులు తమ కోసం, యాజకుల కోసం సిద్ధం చేశారు[a]. ఎందుకంటే అహరోను కుమారులైన యాజకులు రాత్రి వరకు దహనబలిని, కొవ్వు భాగాలను అర్పించడంలో నిమగ్నమై ఉన్నారు. కాబట్టి లేవీయులు తమ కోసం, అహరోను కుమారులైన యాజకుల కోసం సిద్ధం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తమ కోసం’ అని ఉన్న రెండు చోట్లా ‘వారి కోసం’ అని కూడా అనువదించవచ్చు. హీబ్రూ సర్వనామం స్వయంగా స్వార్థక రూపం కాదు; అయితే లేవీయులు యాజకులతో పాటు తమకోసం కూడా సిద్ధం చేశారని సందర్భం బలంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: ఆ తర్వాత
  rationale: తదుపరి జరిగిన కార్యాన్ని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: הֵכִינוּ
  choice: సిద్ధం చేశారు
  rationale: హిఫీల్ రూపంలోని ‘సిద్ధపరచడం’ అనే విస్తృత అర్థాన్ని నిలుపుతుంది; మూలంలో స్పష్టంగా లేని ‘ఆహారం’ అనే పదాన్ని చేర్చదు.
- source_word: לָהֶם
  choice: తమ కోసం
  rationale: కర్త లేవీయులే కావడం, తరువాతి సమాంతర వాక్యంలో వారిని స్పష్టంగా పేర్కొనడం వల్ల స్వార్థక అర్థం సందర్భానికి అత్యంత సహజం; అయితే హీబ్రూ సర్వనామం స్వయంగా స్వార్థక రూపం కాదు కాబట్టి పాదసూచికలో ప్రత్యామ్నాయం ఇచ్చాం.
- source_word: וְלַכֹּהֲנִים
  choice: యాజకుల కోసం
  rationale: ఎవరి నిమిత్తం సిద్ధం చేశారో తెలిపే దత్తార్థక పదబంధానికి నేరమైన అనువాదం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: లేవీయులు యాజకుల కోసం సిద్ధం చేయడానికి గల కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: הַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: అహరోను కుమారులైన యాజకులు
  rationale: వంశసంబంధ గుర్తింపును సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בְּהַעֲלוֹת
  choice: అర్పించడంలో నిమగ్నమై ఉన్నారు
  rationale: బలి సందర్భంలో ‘పైకి ఎక్కించడం/అర్పించడం’ అనే అర్థంతో పాటు కొనసాగుతున్న పనిలో యాజకులు నిమగ్నులై ఉన్నారనే కారణభావాన్ని వ్యక్తపరుస్తుంది.
- source_word: הָעוֹלָה
  choice: దహనబలిని
  rationale: עֹלָה అనే బలి పదానికి స్థిరమైన, అర్థవంతమైన తెలుగు సమానం.
- source_word: וְהַחֲלָבִים
  choice: కొవ్వు భాగాలను
  rationale: సాధారణ కొవ్వును కాక బలిపీఠంపై అర్పించే నిర్దిష్ట కొవ్వు ముక్కలను సూచిస్తుంది.
- source_word: עַד לָיְלָה
  choice: రాత్రి వరకు
  rationale: సేవ రాత్రి వరకూ కొనసాగిందనే కాలవ్యాప్తిని నేరుగా నిలుపుతుంది.
- source_word: וְהַלְוִיִּם
  choice: కాబట్టి లేవీయులు
  rationale: కారణ వివరణ తరువాత ప్రధాన వాక్యాన్ని తిరిగి కొనసాగిస్తూ ఫలిత సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
