- from: యోషీయా ప్రజల కోసం[a] తన మందలోనుంచి గొర్రెపిల్లలను, మేకపిల్లలను ఇచ్చాడు. అక్కడ ఉన్న వారందరి పస్కా అర్పణల కోసం ఇచ్చిన అవన్నీ మొత్తం ముప్పై వేలుగా ఉన్నాయి; ఇంకా మూడు వేల పశువులను ఇచ్చాడు.[b] ఇవన్నీ రాజు ఆస్తిలోనివే.
