  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֣רֶם יֹאשִׁיָּ֣הוּ לִ/בְנֵ֪י הָ/עָ֟ם צֹ֞אן כְּבָשִׂ֣ים וּ/בְנֵֽי עִזִּים֮ הַ/כֹּ֣ל לַ/פְּסָחִים֒ לְ/כָל הַ/נִּמְצָ֗א לְ/מִסְפַּר֙ שְׁלֹשִׁ֣ים אֶ֔לֶף וּ/בָקָ֖ר שְׁלֹ֣שֶׁת אֲלָפִ֑ים אֵ֖לֶּה מֵ/רְכ֥וּשׁ הַ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/007.yaml
  text: Josiah contributed to the people from the flock[a], lambs and young goats, all of them for the Passover offerings, for all who were present, to the number of thirty thousand, and three thousand cattle[b]. These were from the king’s possessions.
translation:
  language: te
  text: యోషీయా ప్రజల కోసం[a] తన మందలోనుంచి గొర్రెపిల్లలను, మేకపిల్లలను ఇచ్చాడు. అవి అక్కడ ఉన్న వారందరికీ పస్కా అర్పణల[b] కోసం, మొత్తం ముప్పై వేలు; అతడు మూడు వేల పశువులను కూడా ఇచ్చాడు. ఇవన్నీ రాజు ఆస్తిలోనివే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ప్రజల కుమారులకు”; “సామాన్య ప్రజలకు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “అవన్నీ పస్కా బలుల కోసం” అని కూడా అనువదించవచ్చు. హీబ్రూలోని “పస్కాలు” అనే బహువచనం బహుశా పస్కా జంతువులను లేదా అర్పణలను సమూహంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶם
  choice: ఇచ్చాడు
  rationale: హిఫీల్ రూపం ఈ సందర్భంలో అక్షరార్థంగా ‘పైకెత్తాడు’ అని కాక, రాజు తన వనరుల నుంచి ప్రజల ఆరాధన కోసం సమకూర్చి ఇచ్చాడనే భావాన్ని సూచిస్తుంది.
- source_word: לִבְנֵי הָעָם
  choice: ప్రజల కోసం
  rationale: అక్షరార్థం ‘ప్రజల కుమారులకు’; ఇక్కడ లేవీయులు కాని సామాన్య ప్రజలను సూచించే సహజమైన సమగ్ర తెలుగు రూపంగా ‘ప్రజల కోసం’ వాడబడింది; ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: צֹאן כְּבָשִׂים וּבְנֵי עִזִּים
  choice: తన మందలోనుంచి గొర్రెపిల్లలను, మేకపిల్లలను
  rationale: צֹאן చిన్న పశువుల మందను సమూహార్థంలో సూచిస్తుంది; తరువాతి పదాలు వాటిని గొర్రెపిల్లలు, మేకపిల్లలుగా నిర్దిష్టం చేస్తున్నాయి.
- source_word: הַכֹּל לַפְּסָחִים
  choice: పస్కా అర్పణల కోసం ఇచ్చిన అవన్నీ
  rationale: פְּסָחִים అనే బహువచనం ఇక్కడ పస్కా కోసం ఉపయోగించే బలి జంతువులను సమూహంగా సూచిస్తుంది. ‘పస్కా అర్పణలు’ ఆ కార్యాన్ని స్పష్టంగా తెలియజేస్తూ పదంలోని విస్తృతిని కాపాడుతుంది.
- source_word: לְכָל הַנִּמְצָא
  choice: అక్కడ ఉన్న వారందరి
  rationale: నిఫాల్ కృదంతం ఉత్సవానికి హాజరై ఉన్న లేదా సమకూడిన వారిని సూచిస్తుంది.
- source_word: לְמִסְפַּר שְׁלֹשִׁים אֶלֶף
  choice: మొత్తం ముప్పై వేలుగా ఉన్నాయి
  rationale: ఈ సంఖ్య గొర్రెపిల్లలు, మేకపిల్లల మొత్తం సంఖ్యను తెలియజేస్తుంది; సహజ తెలుగు వాక్య నిర్మాణంలో పరిమాణాన్ని స్పష్టం చేస్తుంది.
- source_word: וּבָקָר שְׁלֹשֶׁת אֲלָפִים
  choice: ఇంకా మూడు వేల పశువులను
  rationale: בָּקָר మంద పశువులను సమూహార్థంలో సూచిస్తుంది; లింగం లేదా నిర్దిష్ట బలి వినియోగాన్ని అనవసరంగా నిర్ణయించకుండా ‘పశువులు’ అని అనువదించబడింది.
- source_word: אֵלֶּה מֵרְכוּשׁ הַמֶּלֶךְ
  choice: ఇవన్నీ రాజు ఆస్తిలోనివే
  rationale: רְכוּשׁ ఆస్తి, సంపద లేదా స్వాధీన వస్తువులను సూచిస్తుంది; జంతువులు రాజు సొంత వనరుల నుంచి వచ్చాయని ఈ రూపం సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: פְּסָחִים అనే బహువచనపు సూచన
  choice: పస్కా అర్పణలు
  alternative: పస్కా బలులు / పస్కాలు
  rationale: ఇది పండుగలను లెక్కించడం కంటే పస్కా కోసం ఇచ్చిన జంతువులను సమూహంగా సూచించే అవకాశం ఎక్కువ. ‘అర్పణలు’ అని అనువదించడం వాటిని యోషీయానే బలి అర్పించాడని చెప్పదు; పాదసూచికలో ‘బలులు’ అనే ప్రత్యామ్నాయం ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన వచనం. హీబ్రూ జాబితా నిర్మాణాన్ని తెలుగు సహజ ప్రవాహానికి అనుగుణంగా రెండు వాక్యాలుగా మలిచాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
