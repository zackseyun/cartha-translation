source:
  edition: WLC
  text: וְ/הַ/מְשֹֽׁרֲרִ֨ים בְּנֵי אָסָ֜ף עַל מַעֲמָדָ֗/ם כְּ/מִצְוַ֤ת דָּוִיד֙ וְ/אָסָ֞ף וְ/הֵימָ֤ן וִֽ/ידֻתוּן֙ חוֹזֵ֣ה הַ/מֶּ֔לֶךְ וְ/הַ/שֹּׁעֲרִ֖ים לְ/שַׁ֣עַר וָ/שָׁ֑עַר אֵ֣ין לָ/הֶ֗ם לָ/סוּר֙ מֵ/עַ֣ל עֲבֹֽדָתָ֔/ם כִּֽי אֲחֵי/הֶ֥ם הַ/לְוִיִּ֖ם הֵכִ֥ינוּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/015.yaml
  text: And the singers[a], the sons of Asaph, were at their stations according to the command of David, Asaph, Heman, and Jeduthun the king’s seer; and the gatekeepers were at each gate. They had no need to depart from their service[b], because their brothers the Levites prepared for them.
translation:
  language: te
  text: ఆసాపు కుమారులైన గాయకులు దావీదు, ఆసాపు, హేమాను, రాజునకు దర్శియైన యెదూతూను ఇచ్చిన ఆజ్ఞ ప్రకారం తమ తమ స్థానాల్లో ఉన్నారు. ద్వారపాలకులు ఒక్కో ద్వారం దగ్గర ఉన్నారు. తమ సేవను విడిచి వెళ్లవలసిన అవసరం వారికి లేదు[b]; ఎందుకంటే వారి సహోదరులైన లేవీయులు వారి కొరకు సిద్ధం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా, ‘వారు తమ సేవను విడిచి వెళ్లకూడదు.’ హీబ్రూ మాటలను ఇలా మరింత బలంగా కూడా అర్థం చేసుకోవచ్చు. అయితే లేవీయులు వారి కోసం సిద్ధం చేశారని చెప్పే తరువాతి వాక్యం, వారు వెళ్లవలసిన అవసరం లేదనే భావానికి అనుకూలంగా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְשֹׁרֲרִים
  choice: గాయకులు
  rationale: שׁיר ధాతువునుంచి వచ్చిన ఈ రూపం పాడే సేవలో ఉన్నవారిని సూచిస్తుంది. ఆలయ సేవ సందర్భంలో ‘గాయకులు’ నేరుగా, సహజంగా అర్థాన్ని అందిస్తుంది.
- source_word: בְּנֵי אָסָף
  choice: ఆసాపు కుమారులు
  rationale: మూలంలో అక్షరార్థంగా ‘ఆసాపు కుమారులు’ ఉంది; సందర్భంలో ఇది ఆసాపుతో సంబంధమున్న వంశం లేదా గాయక బృందాన్ని సూచించవచ్చు. చారిత్రకంగా గుర్తించదగిన మూలరూపాన్ని నిలిపాం.
- source_word: עַל מַעֲמָדָם
  choice: తమ తమ స్థానాల్లో ఉన్నారు
  rationale: מַעֲמָד నియమించబడిన స్థానం లేదా సేవాస్థానాన్ని సూచిస్తుంది. పంపిణీ భావాన్ని సహజమైన తెలుగులో ‘తమ తమ స్థానాల్లో’ అని వ్యక్తం చేశాం.
- source_word: כְּמִצְוַת
  choice: ఇచ్చిన ఆజ్ఞ ప్రకారం
  rationale: מִצְוָה అధికారపూర్వకమైన ఆదేశాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో వ్యక్తుల జాబితాతో సహజంగా కలవడానికి ‘ఇచ్చిన ఆజ్ఞ ప్రకారం’ అని అనువదించాం.
- source_word: חוֹזֵה הַמֶּלֶךְ
  choice: రాజు దర్శి
  rationale: חוֹזֶה ప్రవక్తతో సంబంధమున్నా ప్రత్యేకమైన ‘seer’ పదం. ‘దర్శి’ ఆ చారిత్రక పదభేదాన్ని నిలుపుతుంది; ఈ బిరుదును సమీపంలోని యెదూతూనుకు అన్వయించాం.
- source_word: הַשֹּׁעֲרִים
  choice: ద్వారపాలకులు
  rationale: ఆలయ సందర్భంలో ఈ పదం ద్వారాల వద్ద నియమించబడిన వారిని సూచిస్తుంది. ‘ద్వారపాలకులు’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: לְשַׁעַר וָשָׁעַר
  choice: ఒక్కో ద్వారం దగ్గర
  rationale: హీబ్రూ పంపిణీ ప్రయోగం ప్రతి ద్వారం వద్ద విడివిడిగా నియామకం ఉన్నదని తెలియజేస్తుంది. ‘ఒక్కో ద్వారం దగ్గర’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: אֵין לָהֶם לָסוּר
  choice: విడిచి వెళ్లవలసిన అవసరం వారికి లేదు
  rationale: אֵין + ל־ క్రియారూపం ఇక్కడ నిషేధం కంటే అవసరం లేకపోవడాన్ని సూచిస్తుంది. తరువాతి కారణవాక్యం—లేవీయులు వారి కోసం సిద్ధం చేయడం—ఈ భావానికి మద్దతిస్తుంది.
- source_word: מֵעַל עֲבֹדָתָם
  choice: తమ సేవను
  rationale: עֲבֹדָה ఆలయ సందర్భంలో సాధారణ పనికంటే నియమిత సేవను సూచిస్తుంది. అందువల్ల ‘సేవ’ను ఎంచుకున్నాం.
- source_word: אֲחֵיהֶם הַלְוִיִּם
  choice: వారి సహోదరులైన లేవీయులు
  rationale: హీబ్రూలో ‘వారి సహోదరులు’ అని స్పష్టంగా ఉండి, తరువాత ‘లేవీయులు’ వివరణగా వస్తుంది. ఆ బంధుత్వ భాషను నిలిపాం.
- source_word: הֵכִינוּ לָהֶם
  choice: వారి కోసం కావలసినవి సిద్ధం చేశారు
  rationale: הכין అంటే సిద్ధం చేయడం. మూలంలో సిద్ధం చేసిన వస్తువు పేర్కొనబడలేదు; తెలుగులో వాక్యం సహజంగా ఉండేందుకు ‘కావలసినవి’ అని సాధారణంగా వ్యక్తం చేసి, నిర్దిష్ట వస్తువును ఊహించి చేర్చలేదు.
theological_decisions:
- issue: ‘రాజు దర్శి’ అనే పదబంధం ఎవరిని విశేషిస్తుంది?
  choice: 'ఇది వెంటనే ముందున్న యెదూతూనును విశేషిస్తుంది: ‘రాజు దర్శియైన యెదూతూను.’'
  alternative: ఈ బిరుదును ముందున్న పేర్ల జాబితాతో మరింత సడలుగా అనుసంధానించవచ్చు.
  rationale: ఏకవచనంలోని חוֹזֵה הַמֶּלֶךְ అనే పదబంధం దానికి వెంటనే ముందున్న ఏకవచన వ్యక్తినామమైన యెదూతూనుతో సహజంగా కలుస్తుంది. ఇది వ్యాకరణ, చారిత్రక నిర్ణయం; సిద్ధాంతపరమైన ప్రత్యేక వ్యాఖ్యానం కాదు.
- issue: אֵין לָהֶם לָסוּר యొక్క భావబలం
  choice: వారు సేవను విడిచి వెళ్లవలసిన అవసరం లేదని తెలిపే వర్ణనాత్మక వాక్యంగా అనువదించాం.
  alternative: ‘వారు తమ సేవను విడిచి వెళ్లకూడదు’ అనే మరింత బలమైన నిషేధార్థంలో అనువదించవచ్చు.
  rationale: אֵין + ל־ క్రియారూపం అవసరం లేదా సందర్భం లేకపోవడాన్ని వ్యక్తం చేయగలదు. వారి సహోదరులైన లేవీయులు వారి కోసం సిద్ధం చేశారనే తరువాతి కారణవాక్యం, నిషేధం కంటే అవసరం లేకపోవడమే ఇక్కడ ఉద్దేశమని సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే శైలిని ఉపయోగించాం. ఆలయ సేవకు సంబంధించిన ‘గాయకులు,’ ‘ద్వారపాలకులు,’ ‘సేవ,’ ‘దర్శి’ వంటి పదాలను చారిత్రక సందర్భం నిలిచేలా ఎంచుకున్నాం. మూలంలోని అస్పష్టతలను [a], [b] పాదటిప్పణుల్లో నిలిపాం.
