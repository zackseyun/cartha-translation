id: 2CH.35.16
reference: 2 Chronicles 35:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֠/תִּכּוֹן כָּל עֲבוֹדַ֨ת יְהוָ֜ה בַּ/יּ֤וֹם הַ/הוּא֙ לַ/עֲשׂ֣וֹת הַ/פֶּ֔סַח וְ/הַעֲל֣וֹת עֹל֔וֹת עַ֖ל מִזְבַּ֣ח יְהוָ֑ה כְּ/מִצְוַ֖ת הַ/מֶּ֥לֶךְ יֹאשִׁיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/016.yaml
  text: So all the service of Yahweh was prepared on that day, to keep the Passover and to offer burnt offerings on the altar of Yahweh, according to the command of King Josiah.
translation:
  language: te
  text: ఆ రోజున యోషీయా రాజు ఆజ్ఞ ప్రకారం పస్కాను ఆచరించడానికి, యాహ్వే బలిపీఠం మీద దహనబలులు అర్పించడానికి యాహ్వేకు సంబంధించిన ఆరాధనా సేవ అంతా సన్నద్ధం చేయబడింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכּוֹן
  choice: సిద్ధం చేయబడింది
  rationale: כּון నిఫాల్ రూపంలోని కర్మణి/ఫలిత భావాన్ని నిలుపుతూ, ఆరాధనకు సంబంధించిన ఏర్పాట్లన్నీ సంసిద్ధం అయ్యాయని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כָּל עֲבוֹדַת יְהוָה
  choice: యాహ్వే సేవ అంతా
  rationale: ఆలయ ఆరాధన సందర్భంలో עֲבוֹדָה ఆరాధనా సేవను సూచిస్తుంది; ‘సేవ’ అనే పదం దాని విస్తృతమైన ఆరాధనా భావాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో స్పష్టమైన లిప్యంతరీకరణగా అందిస్తుంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: హీబ్రూ కాలసూచక పదబంధాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో యథార్థంగా వ్యక్తపరుస్తుంది.
- source_word: לַעֲשׂוֹת הַפֶּסַח
  choice: పస్కాను ఆచరించడానికి
  rationale: ‘పస్కాను చేయడం’ అనే హీబ్రూ నుడికారానికి ఉద్దేశించిన పండుగ/ఆచార నిర్వహణ భావాన్ని ‘ఆచరించడం’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְהַעֲלוֹת עֹלוֹת
  choice: దహనబలులు అర్పించడానికి
  rationale: עלה హిఫీల్‌తో עֹלוֹת కలిసిన ప్రామాణిక బలి సంబంధ నుడికారాన్ని సహజంగా అనువదిస్తుంది; బలి పూర్తిగా దహించబడే స్వభావాన్ని ‘దహనబలులు’ నిలుపుతుంది.
- source_word: עַל מִזְבַּח יְהוָה
  choice: యాహ్వే బలిపీఠం మీద
  rationale: బలులు అర్పించబడే స్థలాన్ని, అలాగే బలిపీఠం యాహ్వేతో ఉన్న సంబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: כְּמִצְוַת
  choice: ఆజ్ఞ ప్రకారం
  rationale: ఇక్కడ מִצְוָה రాజు ఇచ్చిన నిర్దిష్ట ఆదేశాన్ని సూచిస్తున్నందున ‘ఆజ్ఞ’ సందర్భోచితమైన సహజ తెలుగు సమానార్థకం.
- source_word: הַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: యోషీయా రాజు
  rationale: పేరు తరువాత రాజబిరుదు ఉంచడం సహజ తెలుగు ప్రయోగం; వ్యక్తి గుర్తింపును స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని నామాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళంగా, అయితే ఆలయ ఆరాధన సందర్భానికి తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. మూలంలోని కర్మణి భావం మరియు రెండు ఉద్దేశార్థక క్రియలు నిలుపబడ్డాయి.
