revisions:
- from: ఆ రోజున యాహ్వే సేవ అంతా సిద్ధం చేయబడింది—పస్కాను ఆచరించడానికి, యోషీయా రాజు ఆజ్ఞ ప్రకారం యాహ్వే బలిపీఠం మీద దహనబలులు అర్పించడానికి.
  to: ఆ రోజున యోషీయా రాజు ఆజ్ఞ ప్రకారం పస్కాను ఆచరించడానికి, యాహ్వే బలిపీఠం మీద దహనబలులు అర్పించడానికి యాహ్వేకు సంబంధించిన ఆరాధనా సేవ అంతా సన్నద్ధం చేయబడింది.
