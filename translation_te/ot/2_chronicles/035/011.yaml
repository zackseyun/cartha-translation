id: 2CH.35.11
reference: 2 Chronicles 35:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּשְׁחֲט֖וּ הַ/פָּ֑סַח וַ/יִּזְרְק֤וּ הַ/כֹּהֲנִים֙ מִ/יָּדָ֔/ם וְ/הַ/לְוִיִּ֖ם מַפְשִׁיטִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/011.yaml
  text: And they slaughtered the Passover lamb[a], and the priests splashed the blood from their hands[c][b], while the Levites were skinning them.
translation:
  language: te
  text: వారు పస్కా బలిని[a] వధించారు; యాజకులు వారి చేతులనుండి రక్తాన్ని చల్లారు[b], లేవీయులు వాటిని ఒలుస్తూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పస్కా బలిపశువును.” హీబ్రూ పదం ఇక్కడ వధించబడుతున్న పస్కా బలిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “చల్లారు” అనే హీబ్రూ క్రియ బలి సందర్భంలో రక్తాన్ని ఆచారబద్ధంగా ప్రయోగించడాన్ని సూచిస్తుంది; దీనిని “జల్లారు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: వధించారు
  rationale: שׁחט బలిపశువును ఆచారబద్ధంగా చంపడాన్ని సూచిస్తుంది; ‘వధించారు’ ఆ బలిసంబంధ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: הַפָּסַח
  choice: పస్కా బలిపశువులను
  rationale: ఇక్కడ פֶּסַח పండుగను కాక, వధించబడుతున్న పస్కా బలిపశువులను సూచిస్తుంది. సందర్భంలోని అనేక జంతువులు, తరువాతి బహువచన క్రియల దృష్ట్యా తెలుగులో బహువచనం సహజం.
- source_word: וַיִּזְרְקוּ
  choice: బలిపీఠం మీద చల్లారు
  rationale: זרק బలిసంబంధ సందర్భంలో రక్తాన్ని బలిపీఠానికి ప్రయోగించే సాంకేతిక క్రియ. హీబ్రూ వాక్యంలో బలిపీఠం స్పష్టంగా లేకపోయినా, క్రియలో అంతర్లీనమైన ఆచారార్థాన్ని సాధారణ పాఠకునికి తెలియజేయడానికి ‘బలిపీఠం మీద’ను స్పష్టం చేశాం.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: దేవాలయ సేవా సందర్భంలో כֹּהֲנִיםకు ప్రామాణికమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: מִיָּדָם
  choice: వారి చేతులనుండి రక్తాన్ని తీసుకొని
  rationale: అక్షరార్థంగా ‘వారి చేతినుండి.’ సందర్భంలో యాజకులు వధించినవారి చేతులనుండి రక్తాన్ని స్వీకరించి బలిపీఠానికి ప్రయోగించారని సూచిస్తుంది; ‘రక్తాన్ని తీసుకొని’ అనేది తెలుగులో అవసరమైన సందర్భస్పష్టత.
- source_word: וְהַלְוִיִּם מַפְשִׁיטִים
  choice: లేవీయులు వాటి చర్మాలు తీస్తూ ఉన్నారు
  rationale: పార్టిసిపిల్ సమకాలీనంగా కొనసాగుతున్న చర్యను సూచిస్తుంది. פשט ఇక్కడ వధించిన జంతువుల చర్మాన్ని తొలగించడమనే అర్థంలో ఉంది.
theological_decisions:
- issue: הַפָּסַח యొక్క పరిధి
  choice: పస్కా బలిపశువులను
  alternative: పస్కా గొర్రెపిల్లలను
  rationale: మూలపదం బలిపశువు జాతిని ఇక్కడ ప్రత్యేకంగా పరిమితం చేయదు; ధర్మశాస్త్ర నేపథ్యానుసారం గొర్రెలతో పాటు మేకలూ సాధ్యమైనందున విస్తృతమైన పదాన్ని ఎంచుకున్నాం.
- issue: మִיָּדָםలోని సర్వనామ సూచన
  choice: ‘వారి’ అనే మూలంలోని అస్పష్ట సూచనను ప్రధాన పాఠ్యంలో నిలిపాం
  alternative: లేవీయుల చేతులనుండి
  rationale: హీబ్రూ వాక్యం రక్తాన్ని ఎవరి చేతులనుండి తీసుకున్నారో పేరుపెట్టి చెప్పదు. సందర్భం లేవీయులను సూచించవచ్చుగాని, అనువాదంలో దానిని ఖచ్చితంగా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకునికి అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘పస్కా,’ ‘యాజకులు,’ ‘లేవీయులు,’ ‘బలిపీఠం’ వంటి స్థిర బైబిలు పదజాలాన్ని ఉపయోగించాం. మూలంలోని సర్వనామ అస్పష్టతను అనవసరంగా పరిష్కరించకుండా ఉంచాం.
