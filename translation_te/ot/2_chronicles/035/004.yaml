translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకునికి అర్థమయ్యే శైలి వాడబడింది. మూలంలోని రెండు సంస్థాగత పదబంధాలను వేర్వేరుగా ఉంచి, כְּתָב మరియు מִכְתָּב మధ్య స్వల్ప పదభేదాన్ని ‘రచన’ మరియు ‘లిఖిత పత్రం’ ద్వారా ప్రతిబింబించాం.
