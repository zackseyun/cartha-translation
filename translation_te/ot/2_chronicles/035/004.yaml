source:
  edition: WLC
  text: וְ/הָכִ֥ונוּ לְ/בֵית אֲבוֹתֵי/כֶ֖ם כְּ/מַחְלְקוֹתֵי/כֶ֑ם בִּ/כְתָ֗ב דָּוִיד֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וּ/בְ/מִכְתַּ֖ב שְׁלֹמֹ֥ה בְנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/004.yaml
  text: Prepare yourselves by your fathers’ houses according to your divisions[b][a], as prescribed in the writing of David king of Israel and in the writing of Solomon his son.
translation:
  language: te
  text: మీ పితరుల కుటుంబాల వారీగా[a], మీ విభాగాల ప్రకారం[b] మిమ్మల్ని మీరు సిద్ధం చేసుకోండి; ఇశ్రాయేలు రాజైన దావీదు లిఖితంలోను, అతని కుమారుడైన సొలొమోను లిఖితంలోను ఉన్నట్లు చేయండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పితరుల కుటుంబాలు’ అనేది ఇశ్రాయేలులో పితృపరంపర ఆధారంగా ఏర్పడిన కుటుంబ లేదా వంశ సమూహాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘విభాగాలు’ అనే పదాన్ని, ముఖ్యంగా యాజకులు లేదా లేవీయుల నిర్వహణ సందర్భంలో, ‘వంతులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָכִינוּ
  choice: సిద్ధపడండి
  rationale: כון ధాతువు హిఫిల్ బహువచన ఆజ్ఞారూపం ఇక్కడ క్రియాశీలంగా సిద్ధపడడం లేదా క్రమపరచుకోవడం అనే భావాన్ని ఇస్తుంది. ఆరాధనా-నిర్వహణ సందర్భంలో ‘సిద్ధపడండి’ సహజమైన ఆధునిక తెలుగు.
- source_word: לְבֵית אֲבוֹתֵיכֶם
  choice: మీ పితృకుటుంబాల ప్రకారం
  rationale: בֵית אָבוֹת అనేది ఇశ్రాయేలులో పితృపరంపర ఆధారంగా ఏర్పడిన కుటుంబ లేదా వంశ గృహ సమూహాన్ని సూచిస్తుంది. ‘పితృకుటుంబాలు’ చారిత్రక సామాజిక భావాన్ని సామాన్య పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: כְּמַחְלְקוֹתֵיכֶם
  choice: మీ విభాగాల ప్రకారం
  rationale: מַחְלְקוֹת యాజకులు లేదా లేవీయులుగా ఏర్పాటుచేసిన వంతులు/బృందాలను సూచించగలదు. ‘విభాగాలు’ మూలంలోని సంస్థాగత భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בִּכְתָב
  choice: రచనలో ... నిర్దేశించినట్లుగా
  rationale: כְּתָב అంటే రచన లేదా లిఖిత పత్రం. ఇక్కడ בְּ అనేది ఆ అధికారిక రచనకు అనుగుణంగా వ్యవహరించడాన్ని సూచిస్తుంది; అందువల్ల ‘రచనలో ... నిర్దేశించినట్లుగా’ అనే రూపం కార్యార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דָּוִיד מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజైన దావీదు
  rationale: రాజ బిరుదును సహజమైన తెలుగు విశేషణ నిర్మాణంలో నేరుగా అందిస్తుంది.
- source_word: וּבְמִכְתַּב
  choice: లిఖిత పత్రంలోనూ
  rationale: מִכְתָּב ఒక వ్రాతపూర్వక పత్రం లేదా రచనను సూచిస్తుంది. మొదటి כְּתָבతో ఉన్న స్వల్ప పదభేదాన్ని ‘లిఖిత పత్రం’ కొంతవరకు నిలుపుతుంది.
- source_word: שְׁלֹמֹה בְנוֹ
  choice: అతని కుమారుడు సొలొమోను
  rationale: ‘అతని’ అనే సర్వనామం దావీదును సూచిస్తుందని తెలుగులో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
