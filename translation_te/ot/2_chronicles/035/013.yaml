id: 2CH.35.13
reference: 2 Chronicles 35:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְבַשְּׁל֥וּ הַ/פֶּ֛סַח בָּ/אֵ֖שׁ כַּ/מִּשְׁפָּ֑ט וְ/הַ/קֳּדָשִׁ֣ים בִּשְּׁל֗וּ בַּ/סִּיר֤וֹת וּ/בַ/דְּוָדִים֙ וּ/בַ/צֵּ֣לָח֔וֹת וַ/יָּרִ֖יצוּ לְ/כָל בְּנֵ֥י הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/013.yaml
  text: They cooked the Passover lamb in the fire according to the rule[a], and they boiled the holy offerings in pots, kettles, and bowls, and quickly brought them to all the people.
translation:
  language: te
  text: వారు పస్కా బలిపశువును నియమం ప్రకారం అగ్నిపై వండారు[a]. పరిశుద్ధ అర్పణలను కుండల్లో, పెద్ద పాత్రల్లో, గిన్నెల్లో ఉడికించి, ప్రజలందరికీ త్వరగా అందించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత నిర్దిష్టంగా, ‘పస్కా బలిపశువును అగ్నిపై కాల్చారు’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియకు విస్తృతంగా ‘వండు’ అనే అర్థం ఉండగలదు; అయితే పస్కా నియమం దానిని ఉడికించకుండా కాల్చాలని ఆదేశించింది (నిర్గమకాండము 12:8–9 చూడండి).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַשְּׁלוּ
  choice: వండారు
  rationale: בשׁל అనే క్రియకు సాధారణంగా ‘వండు’ అనే విస్తృత అర్థం ఉంది. ఇక్కడ ‘నిప్పుతో’ మరియు ‘నియమం ప్రకారం’ అనే మాటలు పస్కా బలిపశువును కాల్చి సిద్ధం చేసిన విధానాన్ని సూచిస్తున్నాయి; అందువల్ల మూలంలోని విస్తృత క్రియార్థాన్ని నిలుపుతూ ‘వండారు’ అని అనువదించాం.
- source_word: הַפֶּסַח
  choice: పస్కా బలిపశువును
  rationale: ఈ ఆచార సందర్భంలో ‘పస్కా’ పండుగను కాక, వండబడుతున్న పస్కా బలిపశువును సూచిస్తుంది. ‘బలిపశువు’ అనడం జంతువు గొర్రెపిల్లేనని మూలం చెప్పినదానికంటే ఎక్కువగా నిర్దిష్టపరచకుండా సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: בָּאֵשׁ
  choice: నిప్పుతో
  rationale: అగ్నిని ఉపయోగించి సిద్ధం చేసిన విధానాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; క్రియను స్వయంగా ‘కాల్చారు’గా సంకుచితం చేయదు.
- source_word: כַּמִּשְׁפָּט
  choice: నియమం ప్రకారం
  rationale: ఇక్కడ מִשְׁפָּט నిర్దేశించబడిన ఆచార విధిని సూచిస్తుంది. ‘నియమం ప్రకారం’ ఆధునిక, స్పష్టమైన, గౌరవప్రదమైన తెలుగు.
- source_word: וְהַקֳּדָשִׁים
  choice: ప్రతిష్ఠిత అర్పణలను
  rationale: పస్కా బలిపశువుకు భిన్నమైన, దేవునికి ప్రతిష్ఠించబడిన ఇతర బలి అర్పణలను సూచిస్తుంది. ‘పరిశుద్ధ వస్తువులు’ కంటే ఇది ఆరాధనా సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בִּשְּׁלוּ
  choice: ఉడికించి
  rationale: వెంటనే పేర్కొన్న వంటపాత్రల సందర్భంలో ‘ఉడికించు’ అనే అర్థం సరిపోతుంది; నిప్పుతో సిద్ధం చేసిన పస్కాకు, పాత్రల్లో సిద్ధం చేసిన ఇతర అర్పణలకు మధ్య ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: בַּסִּירוֹת וּבַדְּוָדִים וּבַצֵּלָחוֹת
  choice: కుండల్లో, పెద్ద పాత్రల్లో, గిన్నెల్లో
  rationale: మూడు రకాల వంట లేదా వడ్డింపు పాత్రల మధ్య మూలంలో ఉన్న భేదాన్ని, వాటి ఖచ్చిత ఆకారాలపై అతిగా నిర్దిష్టత చూపకుండా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיָּרִיצוּ
  choice: త్వరగా తీసుకువెళ్లారు
  rationale: ఈ క్రియలో కదలికతో పాటు తొందర భావం ఉంది; ఈ తెలుగు పదబంధం రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: לְכָל בְּנֵי הָעָם
  choice: ప్రజలందరి దగ్గరికి
  rationale: అక్షరార్థంగా ‘ప్రజల కుమారులందరికి’ అయినప్పటికీ, ఇది సమస్త ప్రజలను సూచించే హీబ్రూ నుడికారం. గమ్యార్థక לְ భావాన్ని ‘దగ్గరికి’ స్పష్టంగా చూపుతుంది.
theological_decisions:
- issue: בשׁל అనే క్రియకు ‘వండు/ఉడికించు’ అర్థాలు ఉండగా, పస్కా నియమం కాల్చి సిద్ధం చేయాలని చెప్పడం
  choice: మొదటి క్రియను విస్తృతంగా ‘వండారు’ అని అనువదించి, ‘నిప్పుతో, నియమం ప్రకారం’ అనే మాటలు చట్టబద్ధమైన విధానాన్ని సూచించేలా ఉంచాం.
  alternative: పస్కా బలిపశువును ‘కాల్చారు’ అని నేరుగా అనువదించడం.
  rationale: వాక్యమే పస్కాను నిప్పుతో సిద్ధం చేయడానికీ, ఇతర అర్పణలను పాత్రల్లో ఉడికించడానికీ తేడా చూపుతుంది. ఈ అనువాదం మూల క్రియ యొక్క విస్తృతతను, పస్కా విధి యొక్క ప్రత్యేకతను రెండింటినీ నిలుపుతుంది.
- issue: הַקֳּדָשִׁים యొక్క పరిధి
  choice: పస్కా బలిపశువుకు భిన్నమైన ఇతర ప్రతిష్ఠిత అర్పణలుగా అనువదించాం.
  alternative: పస్కాతో సహా పవిత్ర ఆహారమంతటికీ సాధారణ సూచనగా గ్రహించడం.
  rationale: వాక్య నిర్మాణం ‘పస్కా’ను ‘ప్రతిష్ఠిత అర్పణల’తో వేరుగా ఉంచుతుంది; వేర్వేరు వంట విధానాలు కూడా ఈ భేదానికి మద్దతిస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ఆచార సంబంధ పదాలకు అవసరమైన స్పష్టతను ఇచ్చాం; అయితే మూలంలో లేని జంతువు రకం లేదా పాత్రల ఖచ్చిత ఆకారాన్ని చేర్చలేదు.
