translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. పురుష, స్త్రీ గాయకుల స్పష్టమైన ప్రస్తావనను నిలిపాం. ‘ఇదిగో’ ద్వారా మూలంలోని ఉద్ఘాటనను కాపాడాం.
