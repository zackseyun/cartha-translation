source:
  edition: WLC
  text: וַ/יְקוֹנֵ֣ן יִרְמְיָהוּ֮ עַל יֹאשִׁיָּהוּ֒ וַ/יֹּאמְר֣וּ כָֽל הַ/שָּׁרִ֣ים וְ֠/הַ/שָּׁרוֹת בְּ/קִינ֨וֹתֵי/הֶ֤ם עַל יֹאשִׁיָּ֨הוּ֙ עַד הַ/יּ֔וֹם וַ/יִּתְּנ֥וּ/ם לְ/חֹ֖ק עַל יִשְׂרָאֵ֑ל וְ/הִנָּ֥/ם כְּתוּבִ֖ים עַל הַ/קִּינֽוֹת־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/025.yaml
  text: And Jeremiah lamented for Josiah[a], and all the male singers and female singers speak of Josiah in their laments to this day. And they made them a statute in Israel; behold, they are written in the Laments.
translation:
  language: te
  text: యిర్మీయా యోషీయా కోసం విలపించాడు. గాయకులందరూ, గాయనులందరూ నేటివరకు తమ విలాపగీతాల్లో యోషీయా గురించి ప్రస్తావించేవారు. వారందరూ వాటిని ఇశ్రాయేలులో ఒక నియమంగా స్థిరపరిచారు. ఇదిగో, అవి విలాపగీతాల్లో[a] రాయబడి ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విలాపగీతాల గ్రంథంలో,” ఈ మాటలు ఒక నిర్దిష్ట విలాపగీతాల సంకలనాన్ని సూచిస్తే.
    reason: הַקִּינוֹת ఒక ప్రసిద్ధ సంకలనానికి శీర్షికవంటి సూచన కావచ్చు; అయితే సాధారణంగా విలాపగీతాలనే సూచించే అవకాశం కూడా ఉంది.
lexical_decisions:
- source_word: וַיְקוֹנֵן
  choice: విలపించాడు
  rationale: קונן అనే క్రియ మరణించినవారి కోసం విలాపం చేయడాన్ని లేదా విలాపగీతం ఆలపించడాన్ని సూచిస్తుంది. ‘విలపించాడు’ అనేది అతడు దానిని రచించాడా, ఆలపించాడా అనే విషయాన్ని అనవసరంగా నిర్ధారించకుండా మూలంలోని భావాన్ని నిలుపుతుంది.
- source_word: עַל יֹאשִׁיָּהוּ
  choice: యోషీయా కోసం
  rationale: విలాప సందర్భంలో עַל మరణించిన వ్యక్తిని ఉద్దేశించిన దుఃఖాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘కోసం విలపించాడు’ సహజంగా ఉంటుంది.
- source_word: הַשָּׁרִים וְהַשָּׁרוֹת
  choice: గాయకులందరూ, గాయనులందరూ
  rationale: హీబ్రూ పదాలు పురుష గాయకులను, స్త్రీ గాయకులను విడిగా పేర్కొంటాయి. ఆ లింగభేదాన్ని తెలుగులో స్పష్టంగా నిలిపాం.
- source_word: וַיֹּאמְרוּ ... בְּקִינוֹתֵיהֶם
  choice: తమ విలాపగీతాల్లో ... గురించి పాడుతూనే ఉన్నారు
  rationale: וַיֹּאמְרוּ అక్షరార్థంగా ‘చెప్పారు’ అయినప్పటికీ, గాయకులు మరియు విలాపగీతాల సందర్భంలో ఆలాపన లేదా పఠనాన్ని సూచిస్తుంది. עַד הַיּוֹםతో కలిసి ఉన్న కొనసాగుతున్న ఆచారాన్ని ‘పాడుతూనే ఉన్నారు’ తెలియజేస్తుంది.
- source_word: עַד הַיּוֹם
  choice: నేటివరకు
  rationale: రచయిత కాలంవరకు ఆ ఆచారం కొనసాగిందనే సాధారణ హీబ్రూ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיִּתְּנוּם לְחֹק עַל יִשְׂרָאֵל
  choice: వాటిని ఇశ్రాయేలులో ఒక నియమంగా స్థిరపరిచారు
  rationale: సర్వనామం విలాపగీతాలను సూచిస్తుంది. חֹק నియమం, విధి లేదా స్థిరమైన ఆచారం అనే పరిధిని కలిగి ఉంది; ‘నియమంగా స్థిరపరిచారు’ ఆ భావాన్ని అతిగా వివరించకుండా నిలుపుతుంది.
- source_word: וְהִנָּם
  choice: ఇదిగో, అవి
  rationale: הִנֵּה తరువాతి ప్రకటనపై దృష్టి పెట్టే సూచనాత్మక బలాన్ని ‘ఇదిగో’ కాపాడుతుంది.
- source_word: כְּתוּבִים עַל הַקִּינוֹת
  choice: విలాపగీతాల గ్రంథంలో రాయబడి ఉన్నాయి
  rationale: ఈ పదబంధం తెలిసిన విలాపగీతాల సంకలనాన్ని సూచించే అవకాశం ఉంది. అందువల్ల ప్రధాన పాఠంలో గ్రంథం లేదా సంకలనం అనే భావాన్ని చూపించాం; సాధారణ విలాపగీతాలనే సూచించే అవకాశాన్ని పాదసూచికలో ఉంచాం.
