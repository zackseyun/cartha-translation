id: 2CH.35.17
reference: 2 Chronicles 35:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֨וּ בְנֵֽי יִשְׂרָאֵ֧ל הַֽ/נִּמְצְאִ֛ים אֶת הַ/פֶּ֖סַח בָּ/עֵ֣ת הַ/הִ֑יא וְ/אֶת חַ֥ג הַ/מַּצּ֖וֹת שִׁבְעַ֥ת יָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/017.yaml
  text: And the Israelites who were present kept the Passover at that time, and the Feast of Unleavened Bread for seven days.
translation:
  language: te
  text: అక్కడ ఉన్న ఇశ్రాయేలీయులు ఆ సమయంలో పస్కాను ఆచరించి, ఏడు రోజులపాటు పులియని రొట్టెల పండుగను జరుపుకున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: ఆచరించి / జరుపుకున్నారు
  rationale: עשה అనే క్రియకు అక్షరార్థంగా ‘చేశారు’ అని అర్థమైనా, పస్కా మరియు పండుగ సందర్భంలో ‘ఆచరించారు/జరుపుకున్నారు’ అనేది సహజమైన తెలుగు. రెండు కర్మల స్వభావానికి తగినట్లుగా పస్కాకు ‘ఆచరించి,’ పండుగకు ‘జరుపుకున్నారు’ వాడాం.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: ఇది ఇశ్రాయేలు ప్రజలను సూచించే సామూహిక జాతినామం; ఆధునిక తెలుగులో ‘ఇశ్రాయేలీయులు’ సహజంగా, కచ్చితంగా ఉంటుంది.
- source_word: הַנִּמְצְאִים
  choice: అక్కడ ఉన్న
  rationale: מצא ధాతువు కృదంతం ఇక్కడ ఆ సందర్భంలో హాజరై ఉన్నవారిని సూచిస్తుంది. ‘కనబడిన’ అనే అక్షరార్థం కంటే ‘అక్కడ ఉన్న’ సాధారణ పాఠకులకు సహజం.
- source_word: הַפֶּסַח
  choice: పస్కాను
  rationale: ఇక్కడ పదం పస్కా ఆచరణను లేదా భోజనాన్ని సూచించగలదు; ‘పస్కా’ ఈ విస్తృత భావాన్ని సంకుచితం చేయకుండా నిలుపుతుంది.
- source_word: בָּעֵת הַהִיא
  choice: ఆ సమయంలో
  rationale: ఈ పదబంధం నేరుగా కాలాన్ని సూచిస్తుంది. మూలంలో స్పష్టంగా లేని ‘నియమిత సమయం’ అనే భావాన్ని చేర్చలేదు.
- source_word: חַג הַמַּצּוֹת
  choice: పులియని రొట్టెల పండుగ
  rationale: חַג అంటే పండుగ; מַצּוֹת అంటే పులియబెట్టని రొట్టెలు. ఆధునిక తెలుగులో గుర్తించదగిన, అర్థవంతమైన పండుగ పేరు ఇది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: పండుగ కొనసాగిన వ్యవధిని తెలుగులో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
