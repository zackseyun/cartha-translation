    issue: హెబ్రీ ఏకవచనమైన הַפָּסַחను ‘పస్కా బలి జంతువులను’ అని బహువచనంగా అనువదించారు.
    rationale: సందర్భంలో అనేక బలిపశువులు ఉండవచ్చునని తెలిసినా, ఈ వచనంలోని పదరూపం ఏకవచనం. అనవసర సంఖ్యా మార్పును నివారించాలి.
  - severity: high
