revisions:
- from: పస్కా బలి జంతువులను వధించండి[a]; మిమ్మల్ని మీరు ప్రతిష్ఠించుకొని, మీ సహోదరుల కోసం సిద్ధం చేయండి. మోషే ద్వారా వచ్చిన యెహోవా వాక్యం ప్రకారం ఆచరించండి.
  to: పస్కా బలిని వధించండి[a], మిమ్మల్ని మీరు ప్రతిష్ఠించుకోండి, మీ సహోదరులు మోషే ద్వారా ఇచ్చిన యాహ్వే వాక్యం ప్రకారం ఆచరించడానికి వారికోసం సిద్ధపరచండి[b].
  rationale: సంఖ్యను మూలానికి అనుగుణంగా ఏకవచనంలో ఉంచి, మూడు ఆజ్ఞల క్రమాన్ని నిలిపాం. చివరి infinitive యొక్క ఉద్దేశార్థక సంబంధాన్ని ‘మీ సహోదరులు ... ఆచరించడానికి’ ద్వారా వ్యక్తం చేశాం. పస్కా బలికి సంబంధించిన అంతర్లీన కర్మను తెలుగులో సహజంగా ఉండేందుకు ‘వారికోసం సిద్ధపరచండి’లో సూచించాం; కొత్త సిద్ధాంతపరమైన లేదా చారిత్రక వివరణను చేర్చలేదు. రెండు మూల/ఆడిట్-ట్రెయిల్ lexical anchors‌ను పాదటిప్పణుల్లో ఇచ్చాం.
