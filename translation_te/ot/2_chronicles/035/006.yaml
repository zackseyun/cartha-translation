    rationale: సిద్ధపరచడం సహోదరులు యాహ్వే వాక్యం ప్రకారం చేయడానికి ఉద్దేశించబడింది; అదే ఆజ్ఞను సేవకులకు నేరుగా మళ్లీ ఇవ్వడం కాదు.
