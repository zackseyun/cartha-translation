source:
  edition: WLC
  text: וְ/שַׁחֲט֖וּ הַ/פָּ֑סַח וְ/הִתְקַדְּשׁוּ֙ וְ/הָכִ֣ינוּ לַ/אֲחֵי/כֶ֔ם לַ/עֲשׂ֥וֹת כִּ/דְבַר יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/006.yaml
  text: Slaughter the Passover lamb[a], consecrate yourselves, and prepare for your brothers[b], to do according to the word of Yahweh by the hand of Moses.
translation:
  language: te
  text: పస్కా బలిని వధించండి[a], మిమ్మల్ని మీరు ప్రతిష్ఠించుకోండి, మీ సహోదరులు మోషే ద్వారా ఇచ్చిన యాహ్వే వాక్యం ప్రకారం ఆచరించడానికి వారికోసం సిద్ధపరచండి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పస్కాను”; ఇక్కడ హెబ్రీ పదం వధించబడే పస్కా బలిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మోషే చేతి ద్వారా.” హెబ్రీ నుడికారం మోషే ద్వారా వచ్చిన మధ్యవర్తిత్వాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁחֲטוּ
  choice: వధించండి
  rationale: שׁחט బలి సందర్భంలో జంతువును విధిపూర్వకంగా వధించడాన్ని సూచిస్తుంది; ‘వధించండి’ ఆ ఆచార సంబంధ భావాన్ని నిలుపుతుంది.
- source_word: הַפָּסַח
  choice: పస్కా బలి జంతువులను
  rationale: ఇక్కడ పండుగను కాక వధించబడే పస్కా బలి జంతువులను సూచిస్తుంది. సందర్భంలోని బహుళ ఏర్పాట్లకు సహజంగా సరిపోయేలా తెలుగులో బహువచనం వాడబడింది; హెబ్రీ పదం రూపరీత్యా ఏకవచనం.
- source_word: וְהִתְקַדְּשׁוּ
  choice: మిమ్మల్ని మీరు ప్రతిష్ఠించుకొని
  rationale: קדשׁ హిత్పయేల్ రూపం పవిత్ర సేవ కోసం తమను తాము ఆచారబద్ధంగా సిద్ధపరచుకోవడాన్ని సూచిస్తుంది.
- source_word: וְהָכִינוּ
  choice: సిద్ధం చేయండి
  rationale: כון హిఫీల్‌కు ‘సిద్ధపరచు’ అనే భావం ఉంది. మూలంలో కర్మ స్పష్టంగా చెప్పబడనందున తెలుగులోనూ దానిని నిర్దిష్టం చేయలేదు.
- source_word: לַאֲחֵיכֶם
  choice: మీ సహోదరుల కోసం
  rationale: అక్షరార్థంగా ‘మీ సోదరుల కోసం’; సందర్భంలో తోటి ఇశ్రాయేలీయులను సూచించే గౌరవప్రదమైన సాధారణ తెలుగు పదంగా ‘సహోదరులు’ ఎంచుకోబడింది.
- source_word: לַעֲשׂוֹת
  choice: ఆచరించండి
  rationale: עשה సాధారణంగా ‘చేయు’; ఇక్కడ యెహోవా ఆదేశించిన పస్కా విధిని నిర్వహించడాన్ని సూచించేందున ‘ఆచరించండి’ సహజంగా భావాన్ని అందిస్తుంది.
- source_word: כִּדְבַר יְהוָה
  choice: యెహోవా వాక్యం ప్రకారం
  rationale: דבר అనే పదంలోని ‘వాక్యం/ఆదేశం’ భావాన్ని విస్తరించకుండా ‘వాక్యం’గా నిలుపుకుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించింది.
- source_word: בְּיַד מֹשֶׁה
  choice: మోషే ద్వారా వచ్చిన
  rationale: అక్షరార్థంగా ‘మోషే చేతి ద్వారా’; మధ్యవర్తిత్వాన్ని సూచించే హెబ్రీ నుడికారాన్ని సహజ తెలుగులో ‘మోషే ద్వారా వచ్చిన’గా అందించింది.
theological_decisions:
- issue: לַאֲחֵיכֶם లోని లింగసూచక బంధుత్వ పదం
  choice: మీ సహోదరుల కోసం
  alternative: మీ తోటి ఇశ్రాయేలీయుల కోసం
  rationale: మూలంలోని పుంలింగ బహువచన బంధుత్వ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని విస్తృత సామూహిక సూచనను అనవసరంగా స్పష్టీకరించలేదు.
- issue: יהוה దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు వాడుకలో సాధారణంగా గుర్తించబడే రూపాన్ని ఎంచుకుంది.
- issue: בְּיַד מֹשֶׁה అనే మధ్యవర్తిత్వ నుడికారం
  choice: మోషే ద్వారా వచ్చిన
  alternative: మోషే చేతి ద్వారా
  rationale: దైవ వాక్యం మోషే మధ్యవర్తిత్వంలో అందిందనే భావాన్ని ఉంచుతూ, తెలుగు పాఠకునికి అపార్థం కలిగించగల అక్షరార్థ నుడికారాన్ని ప్రధాన పాఠ్యంలో నివారించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. వాక్యాన్ని సహజ తెలుగు ప్రవాహం కోసం రెండు వాక్యాలుగా విభజించినా, హెబ్రీ ఆజ్ఞల క్రమం మరియు మోషే మధ్యవర్తిత్వ భావం నిలుపబడ్డాయి.
