    issue: 'The final clause is rendered as an unconditional consequence: “లేకపోతే ఆయన నిన్ను నాశనం చేస్తాడు.”'
    rationale: The Hebrew וְאַל, following the imperative, is best retained as a preventive warning—“so that/lest he destroy you.” Telugu can express this naturally with “ఆయన నిన్ను నాశనం చేయకుండా ఉండేందుకు.”
