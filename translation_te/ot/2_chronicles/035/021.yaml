source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח אֵלָ֣י/ו מַלְאָכִ֣ים לֵ/אמֹר֩ מַה לִּ֨/י וָ/לָ֜/ךְ מֶ֣לֶךְ יְהוּדָ֗ה לֹא עָלֶ֨י/ךָ אַתָּ֤ה הַ/יּוֹם֙ כִּ֚י אֶל בֵּ֣ית מִלְחַמְתִּ֔/י וֵ/אלֹהִ֖ים אָמַ֣ר לְ/בַֽהֲלֵ֑/נִי חֲדַל לְ/ךָ֛ מֵ/אֱלֹהִ֥ים אֲשֶׁר עִמִּ֖/י וְ/אַל יַשְׁחִיתֶֽ/ךָ׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/021.yaml
  text: But he sent messengers to him[a], saying, “What have I to do with you, king of Judah? I am not coming against you today, but against the house with which I am at war; and God has told me to hurry. Stop opposing God, who is with me, so that he does not destroy you.”
translation:
  language: te
  text: 'అయితే అతడు యోషీయా దగ్గరికి దూతలను పంపించి ఇలా చెప్పాడు: “యూదా రాజా, నాతో నీకేమి పని? ఈ రోజు నేను నీ మీదికి రావడం లేదు; నేను యుద్ధం చేస్తున్న రాజ్యం మీదికే వస్తున్నాను.[a] త్వరపడమని దేవుడు నాకు చెప్పాడు. నాతో ఉన్న దేవుణ్ణి ఎదిరించడం మానుకో, ఆయన నిన్ను నాశనం చేయకుండా ఉండేందుకు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా యుద్ధ స్థలం మీదికి,” లేదా “నేను యుద్ధం చేస్తున్న రాజవంశం/రాజ్యం మీదికి.” హీబ్రూ పదబంధం అర్థం నిశ్చయంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
  choice: దూతలు
  rationale: ఈ యుద్ధకథన సందర్భంలో ఇది నెకో పంపిన మానవ ప్రతినిధులను సూచిస్తుంది; ఆధునిక తెలుగులో ‘దూతలు’ సహజమైన పదం.
- source_word: מַה לִּי וָלָךְ
  choice: నాతో నీకేమి పని?
  rationale: జోక్యం చేసుకోవద్దనే దూరీకరణ భావాన్ని తెలిపే హీబ్రూ నుడికారానికి ఇది సహజమైన తెలుగు సమానం.
- source_word: לֹא עָלֶיךָ אַתָּה הַיּוֹם
  choice: ఈ రోజు నేను నీ మీదికి రావడం లేదు
  rationale: హీబ్రూలో క్రియ అధ్యాహారంగా ఉంది; సందర్భంలో నెకో యోషీయాపై దాడికి రావడం లేదనే భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶל בֵּית מִלְחַמְתִּי
  choice: నేను యుద్ధం చేస్తున్న రాజ్యం మీదికే
  rationale: అస్పష్టమైన ‘బేత్’ ఇక్కడ వంశం, రాజ్యం లేదా రాజకీయ శక్తిని సూచించవచ్చు. ప్రధాన పాఠంలో అర్థమయ్యే రూపాన్ని ఎంచుకొని, మూలంలోని అనిశ్చితిని అధస్సూచికలో నిలిపాం.
- source_word: וֵאלֹהִים
  choice: దేవుడు
  rationale: దీనితో ఉన్న אָמַר అనే క్రియ ఏకవచనంలో ఉంది; తరువాతి వచనంలోని కథకుని వ్యాఖ్య కూడా ఏకవచన ‘దేవుడు’ అనే పఠనానికి మద్దతిస్తుంది.
- source_word: לְבַהֲלֵנִי
  choice: త్వరపడమని
  rationale: בהל మూలపదం ఇక్కడ అత్యవసరంగా త్వరపడేలా చేయడం లేదా తొందరపెట్టడం అనే భావం ఇస్తుంది.
- source_word: חֲדַל לְךָ מֵאֱלֹהִים
  choice: దేవుణ్ణి ఎదిరించడం మానుకో
  rationale: దేవుని కార్యానికి అడ్డుపడడం లేదా దానిని ప్రతిఘటించడం ఆపమనే హెచ్చరికను స్పష్టంగా అందిస్తుంది.
- source_word: אֲשֶׁר עִמִּי
  choice: నాతో ఉన్న
  rationale: దైవిక సహకార స్వభావాన్ని అతిగా వివరించకుండా మూలంలోని సూటి సంబంధవాచక భావాన్ని నిలుపుతుంది.
- source_word: וְאַל יַשְׁחִיתֶךָ
  choice: లేకపోతే ఆయన నిన్ను నాశనం చేస్తాడు
  rationale: హెచ్చరిక యొక్క తీవ్ర పరిణామాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘నాశనం’ השׁחית యొక్క బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: నెకో మాటల్లో אֱלֹהִים ఎవరిని సూచిస్తుంది?
  choice: ఏకవచనంగా ‘దేవుడు’
  alternative: ‘ఒక దేవుడు’ లేదా ‘దేవతలు’
  rationale: ఏకవచన క్రియ אָמַר వ్యాకరణపరంగా ఏకవచన సూచనను బలపరుస్తుంది. 22వ వచనంలో కథకుడు ఈ మాటలను దేవుని నోటి నుండి వచ్చినవిగా చూపుతాడు; అయినా పాఠంలో అవసరానికి మించి దేవుని గుర్తింపును విస్తరించలేదు.
- issue: בֵּית מִלְחַמְתִּי యొక్క అర్థం
  choice: ప్రధాన పాఠంలో ‘నేను యుద్ధం చేస్తున్న రాజ్యం’
  alternative: ‘నా యుద్ధ స్థలం’ లేదా పదశః ‘నా యుద్ధపు ఇల్లు’
  rationale: హీబ్రూ పదబంధం కఠినమైనది; בֵּית రాజకీయ గృహం, వంశం లేదా రాజ్యాన్ని సూచించవచ్చు. చదవడానికి సహజమైన పఠనాన్ని ప్రధాన పాఠంలో ఉంచి, నిజమైన అనిశ్చితిని అధస్సూచికలో తెలిపాం.
- issue: וְאַל יַשְׁחִיתֶךָ యొక్క సంబంధం
  choice: పరిణామ హెచ్చరికగా ‘లేకపోతే ఆయన నిన్ను నాశనం చేస్తాడు’
  alternative: ఉద్దేశ్య రూపంగా ‘ఆయన నిన్ను నాశనం చేయకుండా’
  rationale: రెండు నిర్మాణాలూ సందర్భానికి సాధ్యమే. ఆధునిక తెలుగులో హెచ్చరిక యొక్క తర్కాన్ని స్పష్టంగా చెప్పేందుకు పరిణామ రూపాన్ని ఎంచుకున్నాం; దేవుడే ‘ఆయన’ అనే సూచనను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి ఉపయోగించబడింది. రాజు సంభాషణలో సహజమైన ఏకవచన సంబోధనను ఉంచి, మూలంలోని కఠినమైన పదబంధాన్ని అధస్సూచికతో పారదర్శకంగా చూపించాం.
