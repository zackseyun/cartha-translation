revisions:
- from: 'అతడు ఇశ్రాయేలీయులందరికీ బోధించే లేవీయులతో[a]—యాహ్వేకు పవిత్రమైనవారితో—ఇలా అన్నాడు: “దావీదు కుమారుడూ ఇశ్రాయేలు రాజూ అయిన సొలొమోను కట్టించిన మందిరంలో[b] పవిత్ర మందసాన్ని ఉంచండి. ఇక దాన్ని మీ భుజాలపై మోయవలసిన అవసరం మీకు లేదు[c]. ఇప్పుడు మీ దేవుడైన యాహ్వేను, ఆయన ప్రజలైన ఇశ్రాయేలును సేవించండి.”'
  to: 'అతడు ఇశ్రాయేలీయులందరికీ బోధించే, యాహ్వేకు పవిత్రులైన లేవీయులతో[a] ఇలా అన్నాడు: “దావీదు కుమారుడూ ఇశ్రాయేలు రాజూ అయిన సొలొమోను కట్టించిన మందిరంలో[b] పవిత్ర మందసాన్ని ఉంచండి. ఇక దాన్ని మీ భుజాలపై మోయవలసిన అవసరం మీకు లేదు[c]. ఇప్పుడు మీ దేవుడైన యాహ్వేను, ఆయన ప్రజలైన ఇశ్రాయేలును సేవించండి.”'
  rationale: The revision corrects the footnote's misleading ‘among all Israel’ relation and improves the Telugu appositional construction. It retains the source's lexical uncertainty concerning הַמְּבִינִים, the divine name, and the contextual sense of no longer carrying the ark on the shoulder.
  reviewer_model: gpt-5.6-terra
