source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לַ֠/לְוִיִּם ה/מבונים לְ/כָל יִשְׂרָאֵ֜ל הַ/קְּדוֹשִׁ֣ים לַ/יהוָ֗ה תְּנ֤וּ אֶת אֲרוֹן הַ/קֹּ֨דֶשׁ֙ בַּ֠/בַּיִת אֲשֶׁ֨ר בָּנָ֜ה שְׁלֹמֹ֤ה בֶן דָּוִיד֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֵין לָ/כֶ֥ם מַשָּׂ֖א בַּ/כָּתֵ֑ף עַתָּ֗ה עִבְדוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/אֵ֖ת עַמּ֥/וֹ יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/003.yaml
  text: And he said to the Levites who taught all Israel[a], who were holy to Yahweh, “Put the holy ark in the house that Solomon son of David, king of Israel, built. You no longer have to carry it on your shoulders[c][b]. Now serve Yahweh your God and his people Israel.”
translation:
  language: te
  text: 'అతడు ఇశ్రాయేలీయులందరికీ బోధించే, యాహ్వేకు పవిత్రులైన లేవీయులతో[a] ఇలా అన్నాడు: “దావీదు కుమారుడూ ఇశ్రాయేలు రాజూ అయిన సొలొమోను కట్టించిన మందిరంలో[b] పవిత్ర మందసాన్ని ఉంచండి. ఇక దాన్ని మీ భుజాలపై మోయవలసిన అవసరం మీకు లేదు[c]. ఇప్పుడు మీ దేవుడైన యాహ్వేను, ఆయన ప్రజలైన ఇశ్రాయేలును సేవించండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలీయులందరికీ అవగాహన కలిగించే లేవీయులు’; లేదా ‘ఇశ్రాయేలీయులందరికోసం అవగాహన కలిగిన/శిక్షణ పొందిన లేవీయులు.’ హీబ్రూ రూపం బోధించే భావాన్నీ, అవగాహన కలిగిన లేదా శిక్షణ పొందిన భావాన్నీ ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థం ‘ఇంటిలో’; ఇక్కడ సొలొమోను కట్టించిన దేవాలయం ఉద్దేశం.
    reason: cultural_note
  - marker: c
    text: 'అక్షరార్థం: ‘భుజంపై భారం మీకు లేదు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ה/מבונים
  choice: ఇశ్రాయేలీయులందరికీ బోధించే
  rationale: בין ధాతువు నుంచి వచ్చిన ఈ రూపానికి ‘అవగాహన కలిగిన/బోధించబడిన’ లేదా ‘అవగాహన కలిగించే/బోధించే’ అనే భావాలు ఉండవచ్చు. లేవీయుల బోధనా పాత్రను దృష్టిలో ఉంచుకొని సందర్భానికి సహజంగా సరిపోయే క్రియాత్మక భావాన్ని ప్రధాన పాఠ్యంలో ఎంచుకొని, అస్పష్టతను పాదసూచికలో నిలిపాం.
- source_word: הַ/קְּדוֹשִׁים לַ/יהוָה
  choice: యాహ్వేకు పవిత్రమైనవారు
  rationale: ఈ మాటలు యాహ్వేకు ప్రత్యేకంగా చెందిన పవిత్ర స్థితిని సూచిస్తాయి. ‘ప్రతిష్ఠించబడినవారు’ కూడా సాధ్యమే గాని, ‘పవిత్రమైనవారు’ మూలంలోని קדושׁים పదాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సాధారణ ధ్వన్యంతరీకరణగా ఇచ్చాం.
- source_word: תְּנוּ אֶת אֲרוֹן הַקֹּדֶשׁ בַּבַּיִת
  choice: మందిరంలో పవిత్ర మందసాన్ని ఉంచండి
  rationale: נתן ఇక్కడ ‘ఉంచడం/స్థాపించడం’ అనే భావం ఇస్తుంది. בית అక్షరార్థంగా ‘ఇల్లు’ అయినా, సొలొమోను కట్టించిన దేవాలయమే ఉద్దేశం కాబట్టి సహజమైన తెలుగులో ‘మందిరం’ అని ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: אֵין לָכֶם מַשָּׂא בַּכָּתֵף
  choice: ఇక దాన్ని మీ భుజాలపై మోయవలసిన అవసరం మీకు లేదు
  rationale: అక్షరార్థం ‘భుజంపై భారం మీకు లేదు.’ సందర్భంలో మందసాన్ని భౌతికంగా మోయడాన్ని సూచిస్తున్నందున, రూపకచిత్రాన్ని నిలుపుతూ ఆధునిక తెలుగులో స్పష్టంగా తెలిపాం.
- source_word: עַתָּה עִבְדוּ
  choice: ఇప్పుడు ... సేవించండి
  rationale: עבד ఆరాధనా సందర్భంలో ‘సేవించు/పరిచర్య చేయు’ అనే భావం కలిగి ఉంటుంది. దేవునికీ ఆయన ప్రజలకీ వర్తించేలా విస్తృతమైన ‘సేవించండి’ను ఎంచుకున్నాం.
- source_word: וְאֵת עַמּוֹ יִשְׂרָאֵל
  choice: ఆయన ప్రజలైన ఇశ్రాయేలును
  rationale: ఇశ్రాయేలు యాహ్వే ప్రజలని గుర్తించే సంబంధాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో స్పష్టంగా నిలిపాం.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని ధ్వన్యంతరీకరించడం మూలంలోని నామాన్ని నిలుపుతుంది.
- issue: המבוניםలో లేవీయుల పాత్ర
  choice: ఇశ్రాయేలీయులందరికీ బోధించే లేవీయులు
  alternative: ఇశ్రాయేలీయులందరిలో అవగాహన కలిగిన/బోధించబడిన లేవీయులు
  rationale: ఈ హీబ్రూ రూపం బోధించడం లేదా అవగాహన కలిగి ఉండడం అనే రెండు దిశల భావాన్ని అనుమతిస్తుంది. దినవృత్తాంతాలలో లేవీయుల బోధనా పాత్ర సందర్భానికి బాగా సరిపోతుంది; అయినా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి అస్పష్టతను తొలగించలేదు.
- issue: యాహ్వేకే కాక ఆయన ప్రజలకు కూడా ‘సేవించండి’ అనే ఆజ్ఞ
  choice: రెండు కర్మలనూ ఒకే ‘సేవించండి’ క్రింద నిలిపాం
  alternative: యాహ్వేను ఆరాధించి, ఆయన ప్రజలకు పరిచర్య చేయండి
  rationale: మూలంలోని עבד క్రియ యాహ్వేను, ఆయన ప్రజలైన ఇశ్రాయేలును రెండింటినీ కర్మలుగా తీసుకుంటుంది. ఆ అసాధారణమైన నిర్మాణాన్ని వివరణాత్మకంగా విడదీయకుండా అలాగే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘పవిత్ర మందసం,’ ‘మందిరం,’ ‘సేవించండి’ వంటి పదాలు ఆరాధనా సందర్భాన్ని నిలుపుతాయి; అతిగా ప్రాచీనమైన వాక్యనిర్మాణాన్ని నివారించాం.
