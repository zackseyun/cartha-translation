source:
  edition: WLC
  text: וְ/לֹֽא נַעֲשָׂ֨ה פֶ֤סַח כָּמֹ֨/הוּ֙ בְּ/יִשְׂרָאֵ֔ל מִ/ימֵ֖י שְׁמוּאֵ֣ל הַ/נָּבִ֑יא וְ/כָל מַלְכֵ֣י יִשְׂרָאֵ֣ל לֹֽא עָשׂ֡וּ כַּ/פֶּ֣סַח אֲשֶׁר עָשָׂ֣ה יֹֽ֠אשִׁיָּהוּ וְ/הַ/כֹּהֲנִ֨ים וְ/הַ/לְוִיִּ֤ם וְ/כָל יְהוּדָה֙ וְ/יִשְׂרָאֵ֣ל הַ/נִּמְצָ֔א וְ/יוֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/018.yaml
  text: No Passover like it had been kept in Israel since the days of Samuel the prophet[a], and none of the kings of Israel had kept a Passover like the one that Josiah kept, with the priests, the Levites, all Judah, Israel that was present[b], and the inhabitants of Jerusalem.
translation:
  language: te
  text: ప్రవక్తయైన సమూయేలు కాలం నుండి ఇశ్రాయేలులో ఇలాంటి పస్కా పండుగను ఆచరించలేదు[a]. ఇశ్రాయేలు రాజులలో ఎవరూ యోషీయా ఆచరించినటువంటి పస్కా పండుగను ఆచరించలేదు. యోషీయాతో పాటు యాజకులు, లేవీయులు, యూదా వారందరూ, అక్కడ ఉన్న ఇశ్రాయేలీయులు[b], యెరూషలేము నివాసులు దాన్ని ఆచరించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రవక్తయైన సమూయేలు కాలం నుండి ఇశ్రాయేలులో దీనివంటి పస్కా పండుగను జరపలేదు.”
    reason: lexical_alternative
  - marker: b
    text: “అక్కడ ఉన్న ఇశ్రాయేలీయులు” అంటే పండుగ కోసం అక్కడ హాజరైన ఇశ్రాయేలు ప్రజలు. అక్షరార్థంగా, “అక్కడ ఉన్న ఇశ్రాయేలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲשָׂה / עָשׂוּ / עָשָׂה
  choice: ఆచరించలేదు / ఆచరించిన / ఆచరించారు
  rationale: עשה + פסח అనే హీబ్రూ ప్రయోగం పస్కాను తయారుచేయడం కాక దాన్ని పాటించడం లేదా ఆచరించడం అని అర్థం. ఆధునిక ప్రామాణిక తెలుగులో ‘పస్కా పండుగను ఆచరించడం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: פֶסַח
  choice: పస్కా పండుగ
  rationale: ఇక్కడ పదం కేవలం బలిపశువును కాక మొత్తం పస్కా ఆచరణను సూచిస్తుంది. ‘పండుగ’ను జోడించడం సాధారణ పాఠకునికి ఆ విస్తృత భావాన్ని స్పష్టం చేస్తుంది.
- source_word: כָּמֹהוּ
  choice: ఇలాంటి
  rationale: సర్వనామ ప్రత్యయం ముందున్న పస్కా ఆచరణను సూచిస్తుంది. ‘ఇలాంటి’ ప్రస్తుత సందర్భంలోని యోషీయా పస్కాతో పోలికను సహజంగా తెలియజేస్తుంది.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో
  rationale: ב ఇక్కడ స్థల లేదా జాతీయ సముదాయ పరిధిని సూచిస్తుంది; ‘ఇశ్రాయేలులో’ రెండింటినీ సహజంగా నిలుపుతుంది.
- source_word: מִימֵי שְׁמוּאֵל הַנָּבִיא
  choice: ప్రవక్తయైన సమూయేలు కాలం నుండి
  rationale: מן + ‘దినాలు’ పోలికకు ఆరంభ బిందువును సూచిస్తుంది. తెలుగులో ‘కాలం నుండి’ సహజమైన కాలవ్యవధి ప్రయోగం.
- source_word: וְכָל מַלְכֵי יִשְׂרָאֵל לֹא
  choice: ఇశ్రాయేలు రాజులలో ఎవరూ ... లేదు
  rationale: హీబ్రూలోని ‘అందరూ ... కాదు’ అనే విశ్వవ్యాప్త నిరాకరణను తెలుగులో సందిగ్ధత లేకుండా ‘ఎవరూ ... లేదు’గా వ్యక్తపరుస్తుంది.
- source_word: וְהַכֹּהֲנִים וְהַלְוִיִּם וְכָל יְהוּדָה
  choice: యోషీయాతో పాటు యాజకులు, లేవీయులు, యూదా వారందరూ
  rationale: ఈ వరుస పస్కాలో పాల్గొన్నవారిని పేర్కొంటుంది. ‘తో పాటు’ వారిని యోషీయాతో కలిసి ఆచరించిన భాగస్వాములుగా స్పష్టం చేస్తుంది.
- source_word: וְיִשְׂרָאֵל הַנִּמְצָא
  choice: అక్కడ ఉన్న ఇశ్రాయేలీయులు
  rationale: הנמצא ఆ సందర్భంలో అక్కడ కనబడిన లేదా హాజరైన ఇశ్రాయేలు ప్రజలను సూచిస్తుంది. సామూహిక ఏకవచనాన్ని తెలుగులో సహజమైన బహువచన ప్రజా సూచనగా ఇచ్చాం; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: וְיוֹשְׁבֵי יְרוּשָׁלִָם
  choice: యెరూషలేము నివాసులు
  rationale: నగరంలో నివసించేవారిని సూచించే భాగధాతు రూపానికి ఇది సంక్షిప్తమైన, గౌరవప్రదమైన తెలుగు రూపం.
theological_decisions:
- issue: మునుపటి పస్కాలతో చారిత్రక పోలిక
  choice: సమూయేలు కాలం నుండి యోషీయా పస్కా వంటిది జరగలేదనే గుణాత్మక లేదా ప్రత్యేకతను తెలిపే పోలికను వచనం చెప్పినట్టే ఉంచడం
  alternative: సమూయేలు తరువాత యోషీయా వరకు ఏ పస్కా కూడా ఏ విషయంలోనూ దీనితో పోల్చదగినది కాదనే సంపూర్ణ చారిత్రక వాదన
  rationale: హీబ్రూ పాఠం ఈ ఆచరణను పోల్చి, తరువాత ఇశ్రాయేలు రాజుల గురించి విశ్వవ్యాప్త నిరాకరణ చేస్తుంది. హిజ్కియా పస్కా వంటి ఇతర వృత్తాంతాలతో సమన్వయాన్ని అనువాదంలో బలవంతంగా చేర్చకుండా, పాఠంలోని భావ ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకునికి అర్థమయ్యేలా, అయితే గ్రంథపఠనానికి తగిన గౌరవప్రద శైలి. పొడవైన హీబ్రూ వాక్యాన్ని తెలుగులో మూడు వాక్యాలుగా విభజించి పోలికను, నిరాకరణను, పాల్గొన్నవారి జాబితాను స్పష్టంచేశాం.
