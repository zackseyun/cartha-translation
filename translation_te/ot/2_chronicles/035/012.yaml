revisions:
- from: వారు దహనబలులను వేరుచేసి, యాహ్వేకు అర్పించడానికి ప్రజలకు[a] వారి పితృగృహాల విభాగాల ప్రకారం ఇచ్చారు. మోషే గ్రంథంలో రాసి ఉన్నట్లే చేశారు. పశువుల విషయంలో కూడా అలాగే చేశారు.
  to: వారు దహనబలులను వేరుచేసి, ప్రజల కుమారులకు[a] వారి పితృకుటుంబాల విభాగాల ప్రకారం ఇచ్చారు, వారు మోషే గ్రంథంలో వ్రాయబడినట్లుగా యాహ్వేకు అర్పించడానికి; పశువుల విషయంలో కూడా అలాగే చేశారు.
  rationale: 'The revision restores the Hebrew sequence and syntactic linkage: the offerings are distributed to the family divisions of the “sons of the people” so that they may offer them to Yahweh in accordance with the written Mosaic instruction. It retains the source’s potentially technical expression without imposing a denominational or overly specific social interpretation. The final elliptical clause is rendered with an explicit Telugu verb for readability while preserving its reference to the same procedure.'
  reviewer_model: gpt-5.6-terra
