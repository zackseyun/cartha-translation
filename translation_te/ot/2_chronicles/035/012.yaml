  text: וַ/יָּסִ֨ירוּ הָ/עֹלָ֜ה לְ֠/תִתָּ/ם לְ/מִפְלַגּ֤וֹת לְ/בֵית אָבוֹת֙ לִ/בְנֵ֣י הָ/עָ֔ם לְ/הַקְרִיב֙ לַ/יהוָ֔ה כַּ/כָּת֖וּב בְּ/סֵ֣פֶר מֹשֶׁ֑ה וְ/כֵ֖ן לַ/בָּקָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/012.yaml
  text: They removed the burnt offerings[a], to give them by divisions of the fathers’ houses to the sons of the people, to present to Yahweh, as it is written in the Book of Moses; and so also with the cattle.
translation:
  language: te
  text: వారు దహనబలులను వేరుచేసి, ప్రజల కుమారులకు[a] వారి పితృకుటుంబాల విభాగాల ప్రకారం ఇచ్చారు, వారు మోషే గ్రంథంలో వ్రాయబడినట్లుగా యాహ్వేకు అర్పించడానికి; పశువుల విషయంలో కూడా అలాగే చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజలకు.” హీబ్రూలో, “ప్రజల కుమారులకు.” ఇది పితృకుటుంబాల ఆధారంగా ప్రజలను సూచించే వ్యక్తీకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: వేరుచేసి
  rationale: హిఫిల్ రూపం ఒక దానిని దాని స్థానం నుంచి తొలగించడం లేదా ప్రత్యేకంగా పక్కన పెట్టడం అనే భావాన్ని ఇస్తుంది. బలి ఏర్పాట్ల సందర్భంలో ‘వేరుచేసి’ సహజంగా ఉండి, ప్రక్రియను అవసరానికి మించి వివరించదు.
- source_word: הָעֹלָה
  choice: దహనబలులను
  rationale: హీబ్రూలో ఏకవచన రూపంలో ఉన్నప్పటికీ, ఇక్కడ సమూహార్థకంగా అనేక బలులను సూచిస్తుంది. సందర్భానికి అనుగుణంగా తెలుగులో బహువచనం వాడబడింది.
- source_word: לְתִתָּם
  choice: ఇచ్చారు
  rationale: 'ప్రత్యయంతో కూడిన క్రియావిశేష రూపం ఉద్దేశాన్ని తెలియజేస్తుంది: వేరుచేసిన వాటిని ఇవ్వడం. తెలుగు వాక్య నిర్మాణంలో ‘ఇచ్చారు’ స్పష్టంగా, సహజంగా ఉంది.'
- source_word: לְמִפְלַגּוֹת לְבֵית אָבוֹת
  choice: వారి పితృగృహాల విభాగాల ప్రకారం
  rationale: ఈ పదబంధం వంశాధారిత కుటుంబ గుంపుల ప్రకారం చేసిన విభజనను సూచిస్తుంది. ‘పితృగృహాలు’ ఆ కాలపు బంధుత్వ-పరిపాలనా నిర్మాణాన్ని నిలుపుతుంది.
- source_word: לִבְנֵי הָעָם
  choice: ప్రజలకు[a]
  rationale: అక్షరార్థంగా ‘ప్రజల కుమారులకు’ అయినా, ఇది యాజకులు మరియు లేవీయుల నుంచి సాధారణ ప్రజలను వేరు చేసే వంశాధారిత సమూహవ్యక్తీకరణ. ప్రధాన పాఠంలో సహజమైన ‘ప్రజలకు’ అని ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: לְהַקְרִיב לַיהוָה
  choice: యాహ్వేకు అర్పించడానికి
  rationale: బలి సందర్భంలో הקריב అంటే దేవుని సమక్షానికి తీసుకువచ్చి అర్పించడం. ‘అర్పించడానికి’ తెలుగులో సహజమైన బలి సంబంధ పదం; יהוה అనే దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: כַּכָּתוּב בְּסֵפֶר מֹשֶׁה
  choice: మోషే గ్రంథంలో రాసి ఉన్నట్లే
  rationale: ఇది లిఖిత మోషే ధర్మనిర్దేశాన్ని ఆధారంగా చూపే సూత్రవాక్యం. తెలుగు రూపం మూలార్థాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְכֵן לַבָּקָר
  choice: పశువుల విషయంలో కూడా అలాగే చేశారు
  rationale: ముందు చెప్పిన విధానాన్నే పశువులకు కూడా వర్తింపజేసినట్లు సంక్షిప్త హీబ్రూ సూచిస్తుంది. తెలుగులో అర్థం పూర్తి కావడానికి ‘చేశారు’ను స్పష్టపరిచాం; בקר సూచించే గోవర్గపు బలి పశువులను సందర్భానుకూలంగా ‘పశువులు’ అని అనువదించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ఒడంబడిక దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, సాధారణ పండిత లిప్యంతరీకరణకు దగ్గరగా ‘యాహ్వే’ అని ఇచ్చాం.
- issue: לִבְנֵי הָעָם లోని పుంలింగ సమూహవ్యక్తీకరణ
  choice: ప్రజలకు, అక్షరార్థం పాదసూచికలో
  alternative: ప్రజల కుమారులకు; సామాన్య ప్రజలకు
  rationale: ‘ప్రజల కుమారులు’ అనే అక్షరానువాదం ఆధునిక తెలుగులో తప్పుదారి పట్టించవచ్చు; ‘సామాన్య ప్రజలు’ అనేది సందర్భార్థాన్ని ప్రధాన పాఠంలోనే మరీ స్పష్టంగా నిర్ధారిస్తుంది. అందువల్ల సహజమైన సమూహార్థాన్ని ప్రధాన పాఠంలో ఉంచి, మూల రూపాన్నీ దాని సాధ్యమైన ప్రత్యేక భావాన్నీ పాదసూచికలో భద్రపరిచాం.
- issue: הָעֹלָה యొక్క ఏకవచన రూపం
  choice: సమూహార్థక బహువచనం ‘దహనబలులను’
  alternative: దహనబలిని
  rationale: పస్కా బలుల విస్తృత ఏర్పాట్ల సందర్భం దీనిని సమూహార్థక ఏకవచనంగా అర్థం చేసుకోవడానికి మద్దతిస్తుంది. తెలుగులో బహువచనం ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. మూలంలోని వరుస ఉద్దేశ-గ్రహీత నిర్మాణాన్ని తెలుగులో సహజమైన క్రమంలో అమర్చాం. చివరి హీబ్రూ ఉపవాక్యంలోని సంక్షిప్తతను నిలుపుతూ, తెలుగులో వాక్యం పూర్తి కావడానికి ‘చేశారు’ను సరఫరా చేశాం.
