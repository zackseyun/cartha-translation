source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יֹאשִׁיָּ֖הוּ וַ/חֲסָדָ֑י/ו כַּ/כָּת֖וּב בְּ/תוֹרַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/026.yaml
  text: 'The rest of the acts of Josiah[a], and his deeds of faithful love, as written in the Law of Yahweh:'
translation:
  language: te
  text: 'యోషీయా చేసిన మిగిలిన కార్యాలు, అతని నిబద్ధ ప్రేమతో కూడిన కార్యాలు[a]—యాహ్వే ధర్మశాస్త్రంలో రాసి ఉన్న ప్రకారం:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతని విశ్వసనీయ కార్యాలు,” “అతని నిబద్ధతగల కార్యాలు,” లేదా “అతని దయాపూర్వక కార్యాలు.” ఇక్కడి హీబ్రూ పదం దయను, నిబద్ధతను లేదా నిబంధన విశ్వసనీయతను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יֹאשִׁיָּהוּ
  choice: యోషీయా చేసిన మిగిలిన కార్యాలు
  rationale: రాజుల చరిత్రను సంక్షిప్తంగా తెలిపే సందర్భంలో דִּבְרֵי అనేది కేవలం ‘మాటలు’ కాకుండా రాజు చేసిన కార్యాలు, అతని పాలనలో జరిగిన విషయాలను సూచిస్తుంది.
- source_word: וַחֲסָדָיו
  choice: అతడు నిబద్ధ ప్రేమతో చేసిన పనులు[a]
  rationale: חֶסֶד పదంలోని ప్రేమ, నిబద్ధత, విశ్వసనీయత అనే భావాలను సాధ్యమైనంత సహజంగా కలిపి తెలియజేస్తుంది. పదానికి ఉన్న భావవిస్తృతిని పాదటిప్పణి సంరక్షిస్తుంది.
- source_word: כַּכָּתוּב
  choice: రాసి ఉన్న ప్రకారం
  rationale: כְּ ఉపసర్గతో కూడిన కర్మణి కృదంతం ‘రాసి ఉన్న ప్రకారం’ అనే భావాన్ని ఇస్తుంది; తరువాతి వచనంతో కొనసాగే మూలపాఠ్య నిర్మాణాన్ని కూడా ఇది నిలుపుతుంది.
- source_word: בְּתוֹרַת
  choice: ధర్మశాస్త్రంలో
  rationale: ఈ చారిత్రక సందర్భంలో תּוֹרָה యాహ్వేకు సంబంధించిన అధికారిక లిఖిత ధర్మశాస్త్రాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితపరమైన ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
theological_decisions:
- issue: యోషీయాను గురించి వాడిన חֶסֶד పదం
  choice: అతడు నిబద్ధ ప్రేమతో చేసిన పనులు
  alternative: అతని దయాపూర్వక పనులు; అతని విశ్వసనీయ కార్యాలు; అతని నిబంధన నిబద్ధతతో చేసిన కార్యాలు
  rationale: ఈ పదాన్ని కేవలం దయగా గానీ, కేవలం నిబంధన విశ్వసనీయతగా గానీ పరిమితం చేయకుండా, ప్రేమతో కూడిన నిబద్ధత అనే దాని ఉద్వేగాత్మక మరియు సంబంధపరమైన బరువును నిలుపుతుంది.
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా ప్రత్యక్షంగా లిప్యంతరీకరిస్తుంది.
translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా గంభీరమైన చారిత్రక శైలిని వాడింది. మూలవచనం తరువాతి వచనంలో కొనసాగే జాబితా నిర్మాణంలో ఉన్నందున చివర కోలన్‌ను నిలిపింది; భావాన్ని పూర్తి చేయడానికి మూలంలో లేని క్రియను చేర్చలేదు.
