source:
  edition: WLC
  text: וְ/שָׂרָ֞י/ו לִ/נְדָבָ֥ה לָ/עָ֛ם לַ/כֹּהֲנִ֥ים וְ/לַ/לְוִיִּ֖ם הֵרִ֑ימוּ חִלְקִיָּ֨ה וּ/זְכַרְיָ֜הוּ וִֽ/יחִיאֵ֗ל נְגִידֵי֙ בֵּ֣ית הָ/אֱלֹהִ֔ים לַ/כֹּהֲנִ֞ים נָתְנ֣וּ לַ/פְּסָחִ֗ים אַלְפַּ֨יִם֙ וְ/שֵׁ֣שׁ מֵא֔וֹת וּ/בָקָ֖ר שְׁלֹ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/008.yaml
  text: And his officials contributed a freewill offering for the people[a], for the priests, and for the Levites. Hilkiah, Zechariah, and Jehiel, the leaders of the house of God[b], gave to the priests 2,600 Passover offerings and 300 cattle.
translation:
  language: te
  text: అతని అధికారులు ప్రజల కోసం, యాజకుల కోసం, లేవీయుల కోసం స్వచ్ఛంద కానుకగా ఇచ్చారు. దేవుని మందిరపు నాయకులైన హిల్కీయా, జెకర్యా, యెహీయేలు యాజకులకు పస్కా బలుల కోసం 2,600 జంతువులను, 300 గొడ్లను ఇచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పస్కాల కోసం 2,600”; ఇవి పస్కా ఆచరణకు ఉద్దేశించిన జంతువులని సందర్భం సూచిస్తుంది. తరువాతి 300కు మూలభాషలో పశువుల మందకు చెందిన జంతువులు అని ప్రత్యేకంగా ఉంది.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְשָׂרָיו
  choice: అతని అధికారులు
  rationale: שָׂרִים అనే పదం పాలనా హోదాలో ఉన్న అధికారులను సూచిస్తుంది; ఆధునిక తెలుగులో ‘అధికారులు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: לִנְדָבָה ... הֵרִימוּ
  choice: స్వచ్ఛంద కానుకగా ఇచ్చారు
  rationale: נְדָבָה స్వచ్ఛందంగా ఇచ్చే కానుకను సూచిస్తుంది; רום హిఫిల్ రూపం ఇక్కడ కానుకగా సమర్పించడం లేదా ఇవ్వడం అనే భావంలో ఉంది.
- source_word: לָעָם לַכֹּהֲנִים וְלַלְוִיִּם
  choice: ప్రజల కోసం, యాజకుల కోసం, లేవీయుల కోసం
  rationale: పునరావృతమైన ל ఈ మూడు వర్గాలను కానుక లబ్ధిదారులుగా గుర్తిస్తుంది.
- source_word: נְגִידֵי בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరపు నాయకులు
  rationale: נְגִידֵי నాయకత్వ హోదాను సూచిస్తుంది; בֵּית הָאֱלֹהִים ఇక్కడ ఆలయాన్ని సూచిస్తున్నందున ‘దేవుని మందిరం’ సహజమైన తెలుగు రూపం.
- source_word: לַפְּסָחִים
  choice: పస్కా బలులుగా
  rationale: బహువచన రూపం పస్కా ఆచరణకు ఉపయోగించే బలి జంతువులను సూచిస్తుంది; ‘పస్కా బలులు’ ఆ ఆచార సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת וּבָקָר שְׁלֹשׁ מֵאוֹת
  choice: 2,600 పశువులను, ఇంకా 300 పశువులను
  rationale: మొదటి సంఖ్యకు మూలపాఠంలో జంతు జాతి ప్రత్యేకంగా చెప్పబడలేదు; సందర్భానుసారంగా సాధారణ ‘పశువులు’ వాడబడింది. בָּקָר కూడా గోవుల వర్గపు పశువులను సూచించినా, తెలుగులో అదే పదం రావడం వల్ల మూలంలోని వ్యత్యాసం స్పష్టంగా కనిపించదు; అందుకే పాదటిప్పణిలో వివరించబడింది.
theological_decisions:
- issue: 2,600 మరియు 300 అనే సంఖ్యలతో సూచించిన జంతువుల వర్గభేదం
  choice: ప్రధాన పాఠంలో రెండింటికీ సాధారణంగా ‘పశువులు’ అని ఉంచి, మూలంలోని భేదాన్ని పాదటిప్పణిలో తెలిపాం
  alternative: మొదటి వాటిని ‘పస్కా బలి జంతువులు’, రెండవ వాటిని ‘పశువులు’ అని అనువదించడం
  rationale: మూలపాఠం 2,600కు జంతు జాతిని పేర్కొనకుండా ‘పస్కాల కోసం’ అని మాత్రమే చెబుతుంది; 300కు మాత్రం בָּקָר అని స్పష్టంగా ఉంది. సాధారణ పాఠకునికి వాక్యం సహజంగా ఉండేలా చేస్తూనే మూలంలోని వివరాన్ని కోల్పోకుండా పాదటిప్పణి ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. వ్యక్తినామాలు సాధారణ తెలుగు బైబిలు రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి. మూలంలోని వాక్యనిర్మాణ అస్పష్టతను పూర్తిగా తొలగించకుండా పాదటిప్పణిలో నిలిపాం.
