  text: אַחֲרֵ֣י כָל זֹ֗את אֲשֶׁ֨ר הֵכִ֤ין יֹֽאשִׁיָּ֨הוּ֙ אֶת הַ/בַּ֔יִת עָלָ֞ה נְכ֧וֹ מֶֽלֶךְ מִצְרַ֛יִם לְ/הִלָּחֵ֥ם בְּ/כַרְכְּמִ֖ישׁ עַל פְּרָ֑ת וַ/יֵּצֵ֥א לִ/קְרָאת֖/וֹ יֹאשִׁיָּֽהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/020.yaml
  text: After all this[a], when Josiah had prepared the house, Neco king of Egypt went up to fight at Carchemish on the Euphrates[b], and Josiah went out to meet him.
translation:
  language: te
  text: యోషీయా మందిరాన్ని సిద్ధపరచిన ఈ సంగతులన్నిటి తరువాత, ఐగుప్తు రాజైన నెకో యూఫ్రటీసు నది తీరాన ఉన్న కర్కెమీషు వద్ద యుద్ధం చేయడానికి పైకి వెళ్లాడు; యోషీయా అతన్ని ఎదుర్కోవడానికి బయలుదేరాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతన్ని ఎదుర్కోవడానికి’ అనే మాటను ఈ సైనిక సందర్భంలో ‘అతనికి విరోధంగా వెళ్లడానికి’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵכִין
  choice: సిద్ధపరచినప్పుడు
  rationale: హిఫిల్ రూపంలోని כון సిద్ధం చేయడం, స్థిరపరచడం, సక్రమంగా అమర్చడం అనే భావాలను కలిగి ఉంటుంది. ఇక్కడ మందిర సంస్కరణలు, పస్కా నేపథ్యాన్ని బట్టి ‘సిద్ధపరచాడు’ మూలంలోని విస్తృత భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הַבַּיִת
  choice: మందిరాన్ని
  rationale: అక్షరార్థం ‘ఆ గృహం’; దినవృత్తాంతముల సందర్భంలో ఇది యెహోవా మందిరాన్ని సూచిస్తుంది. తెలుగులో కేవలం ‘ఇల్లు’ అనడం అస్పష్టంగా ఉండేందున సందర్భార్థమైన ‘మందిరం’ వాడబడింది.
- source_word: עָלָה
  choice: బయలుదేరాడు
  rationale: మూల క్రియ అక్షరార్థంగా ‘పైకి వెళ్లాడు’. ఇక్కడ సైనిక ప్రయాణాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘బయలుదేరాడు’ అని ఇచ్చాం; ‘దండెత్తాడు’ అని అనడం మూలం కంటే దాడి భావాన్ని అధికం చేస్తుంది.
- source_word: לְהִלָּחֵם
  choice: యుద్ధం చేయడానికి
  rationale: ఈ క్రియ యుద్ధంలో పాల్గొనడం లేదా పోరాడడం అనే అర్థాన్ని ఇస్తుంది. ‘యుద్ధం చేయడానికి’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: בְּכַרְכְּמִישׁ
  choice: కర్కెమీషులో
  rationale: ב ఇక్కడ స్థలాన్ని సూచిస్తుంది. అందువల్ల ‘కర్కెమీషుకు వ్యతిరేకంగా’ కాకుండా, యుద్ధ స్థలంగా ‘కర్కెమీషులో’ అని అనువదించాం.
- source_word: עַל פְּרָת
  choice: యూఫ్రటీసు నది ఒడ్డున ఉన్న
  rationale: ఈ పదబంధం యూఫ్రటీసుకు సమీపంలోని స్థానాన్ని సూచిస్తుంది. తెలుగు పాఠకునికి భౌగోళిక సంబంధం స్పష్టంగా ఉండేందుకు ‘నది ఒడ్డున ఉన్న’ అని సహజంగా విప్పి చెప్పాం.
- source_word: וַיֵּצֵא לִקְרָאתוֹ
  choice: అతన్ని ఎదుర్కోవడానికి బయలుదేరాడు
  rationale: לקראת కలవడానికి, ఎదుర్కోవడానికి, లేదా సందర్భానుసారం విరోధంగా వెళ్లడానికి అనే భావాలను ఇవ్వగలదు. సైనిక సందర్భాన్ని సూచిస్తూ కూడా ప్రత్యక్ష శత్రుత్వాన్ని అతిగా నిర్ధారించకుండా ‘ఎదుర్కోవడానికి’ ఎంచుకున్నాం.
