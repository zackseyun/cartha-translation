translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను కాపాడుతూ సాధారణ పాఠకునికి స్పష్టంగా ఉండే వాక్య నిర్మాణం. మూలంలోని సైనిక సందర్భం నిలిపి, נְכוֹ పేరును ‘నెకో’గా, Carchemish ను ‘కర్కెమీషు’గా లిప్యంతరీకరించాం.
