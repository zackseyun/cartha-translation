  text: וּ/מִלְחָמָ֖ה לֹ֣א הָיָ֑תָה עַ֛ד שְׁנַת שְׁלֹשִׁ֥ים וְ/חָמֵ֖שׁ לְ/מַלְכ֥וּת אָסָֽא־׃ס
