  text: And there was no war until the thirty-fifth year of Asa’s reign[a].
translation:
  language: te
  text: ఆసా పరిపాలనలో ముప్పై ఐదవ సంవత్సరం వరకు యుద్ధం జరగలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆసా పరిపాలనలోని ముప్పై ఐదవ సంవత్సరం వరకు.” సంబంధిత ఇతర వాక్యభాగాలతో సమన్వయపరచడానికి కొందరు వ్యాఖ్యాతలు ఈ సంఖ్యను ఆసా పరిపాలనా సంవత్సరాల లెక్కగా మాత్రమే కాక, మరింత విస్తృతమైన కాలగణన ప్రకారం అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִלְחָמָה לֹא הָיָתָה
  choice: యుద్ధం జరగలేదు
  rationale: מִלְחָמָה అంటే ‘యుద్ధం’; היה క్రియ ఇక్కడ ఉనికిని లేదా సంభవాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘యుద్ధం జరగలేదు’ సహజంగా ఉండి సంపూర్ణ నిరాకరణను నిలుపుతుంది. వచనం స్వతంత్రంగా ఇచ్చినప్పుడు ప్రారంభ וּ ను ప్రత్యేకంగా ‘మరియు’ అని అనువదించడం తెలుగులో అవసరం లేదు.
- source_word: עַד
  choice: వరకు
  rationale: యుద్ధం లేని కాలానికి ముగింపు హద్దును సూచించే సహజమైన తెలుగు కాలవాచక రూపం.
- source_word: שְׁנַת שְׁלֹשִׁים וְחָמֵשׁ
  choice: ముప్పై ఐదవ సంవత్సరం
  rationale: సంఖ్యతో కూడిన שְׁנַת రాజ్యపాలనా సంవత్సరాన్ని సూచిస్తుంది; తెలుగులో క్రమసంఖ్యా రూపం మూల భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְמַלְכוּת
  choice: పరిపాలనలో
  rationale: ఈ సందర్భంలో מַלְכוּת రాజు పాలించిన కాలాన్ని సూచిస్తుంది. ‘పరిపాలనలో’ అనేది ఆధునిక, సహజమైన రాజ్యకాల ప్రయోగం.
- source_word: אָסָא
  choice: ఆసా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రామాణికంగా లిప్యంతరీకరించిన రూపం.
theological_decisions:
- issue: ఆసా కథనంలోని ఇతర కాలసూచనలతో ఈ సంఖ్యకు కనిపించే ఉద్రిక్తత
  choice: హీబ్రూ పాఠంలోని రాజ్యపాలనా కాలసూత్రాన్ని నేరుగా ‘ఆసా పరిపాలనలో ముప్పై ఐదవ సంవత్సరం’ అని అనువదించడం
  alternative: విభజిత రాజ్యం ఆరంభం వంటి విస్తృత కాలగణన నుంచి ముప్పై ఐదవ సంవత్సరమని వ్యాఖ్యానించడం, లేదా రాజుల గ్రంథంతో సమన్వయపరచేందుకు సంఖ్యను సవరించడం
  rationale: హీబ్రూ పాఠం ఈ సంవత్సరాన్ని ఆసా పరిపాలనతో నేరుగా అనుసంధానిస్తుంది. అనువాదం దానిని సవరించకుండా నిలుపుతూ, కాలక్రమ ఉద్రిక్తతను వ్యాఖ్యానంతో నిశ్శబ్దంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన శైలి. మూలంలోని కాలక్రమ ఉద్రిక్తతను ప్రధాన పాఠంలో యథాతథంగా నిలిపి, ప్రత్యామ్నాయ వివరణను పాదసూచికలో ఉంచింది.
