id: 2CH.15.9
reference: 2 Chronicles 15:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְבֹּ֗ץ אֶת כָּל יְהוּדָה֙ וּ/בִנְיָמִ֔ן וְ/הַ/גָּרִים֙ עִמָּ/הֶ֔ם מֵ/אֶפְרַ֥יִם וּ/מְנַשֶּׁ֖ה וּ/מִ/שִּׁמְע֑וֹן כִּֽי נָפְל֨וּ עָלָ֤י/ו מִ/יִּשְׂרָאֵל֙ לָ/רֹ֔ב בִּ/רְאֹתָ֕/ם כִּֽי יְהוָ֥ה אֱלֹהָ֖י/ו עִמּֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/009.yaml
  text: And he gathered all Judah and Benjamin[a], and the sojourners with them from Ephraim, Manasseh, and Simeon, because many from Israel had fallen to him when they saw that Yahweh his God was with him.
translation:
  language: te
  text: అతడు యూదా, బెన్యామీను వారందరినీ, వారితో నివసిస్తున్న ఎఫ్రాయిము, మనష్షే, షిమ్యోను ప్రాంతాలవారినీ సమకూర్చాడు. అతని దేవుడైన యాహ్వే అతనితో ఉన్నాడని చూసి, ఇశ్రాయేలులోనుంచి చాలామంది అతని పక్షంలో చేరారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘అతని దగ్గరకు పడ్డారు.’ ఈ హీబ్రూ నుడికారం తమ విధేయతను మార్చుకొని ఆసా పక్షంలో చేరడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: సమకూర్చాడు
  rationale: קבץ అనే క్రియ ప్రజలను ఒకచోట చేర్చడాన్ని సూచిస్తుంది. ‘సమకూర్చాడు’ సహజమైన ఆధునిక తెలుగు వాడుకలో ఈ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּל יְהוּדָה וּבִנְיָמִן
  choice: యూదా, బెన్యామీను వారందరినీ
  rationale: గోత్ర లేదా ప్రాంత నామాలు అక్కడి ప్రజలకు సూచనగా వాడబడ్డాయి; తెలుగులో ‘వారు’ చేర్చడం ఆ ఉద్దేశాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: הַגָּרִים עִמָּהֶם
  choice: వారితో నివసిస్తున్న ... ప్రాంతాలవారినీ
  rationale: גרים ఇక్కడ తమ స్వస్థలాలను విడిచి యూదా, బెన్యామీను ప్రజల మధ్య నివసిస్తున్నవారిని సూచిస్తుంది. అసలు నివాసస్థితిని నిలుపుతూ, తెలుగులో అపార్థానికి దారితీయగల కఠినమైన సామాజిక-న్యాయ పదాన్ని నివారించింది.
- source_word: מֵאֶפְרַיִם וּמְנַשֶּׁה וּמִשִּׁמְעוֹן
  choice: ఎఫ్రాయిము, మనష్షే, షిమ్యోను ప్రాంతాలవారినీ
  rationale: מִן వారి మూలస్థానాన్ని సూచిస్తుంది. ప్రాంత నామాలకు ‘ప్రాంతాలవారు’ జోడించడం తెలుగులో సంబంధాన్ని స్పష్టంగా చేస్తుంది.
- source_word: נָפְלוּ עָלָיו
  choice: అతని పక్షంలో చేరారు
  rationale: అక్షరార్థంగా ‘అతనిపై/అతని దగ్గరకు పడ్డారు’ అనే ఈ హీబ్రూ నుడికారం రాజకీయ విధేయత మార్చుకొని అతని వైపు చేరడాన్ని సూచిస్తుంది. ‘అతని పక్షంలో చేరారు’ ఆ భావాన్ని సహజంగా తెలియజేస్తూ బలవంతపు పారిపోవడం అనే అదనపు భావాన్ని మోపదు.
- source_word: מִיִּשְׂרָאֵל לָרֹב
  choice: ఇశ్రాయేలులోనుంచి చాలామంది
  rationale: לָרֹב అధిక సంఖ్యను సూచించే క్రియావిశేషణ ప్రయోగం; ఈ రూపం సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: בִּרְאֹתָם
  choice: చూసి
  rationale: בְּ తో కూడిన క్రియానామం సందర్భం మరియు కారణం రెండింటినీ సూచించగలదు. ‘చూసి’ ఆ సన్నిహిత సంబంధాన్ని అతిగా నిర్ణయించకుండా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֱלֹהָיו עִמּוֹ
  choice: తన దేవుడైన యాహ్వే తనతో ఉన్నాడని
  rationale: దైవసన్నిధి లేదా సహాయాన్ని తెలిపే మూలవాక్యాన్ని నేరుగా ఉంచి, ‘అతని పక్షాన ఉన్నాడు’ వంటి వివరణాత్మక విస్తరణను నివారించింది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలరూపాన్ని నిలుపుతుంది.
- issue: ‘యాహ్వే అతనితో ఉన్నాడు’ అనే మాటలోని భావం
  choice: తనతో ఉన్నాడని
  alternative: తన పక్షాన ఉన్నాడని
  rationale: మూలంలో దైవసన్నిధి, అనుకూలత రెండూ సూచింపబడవచ్చు. నేరుగా ‘తనతో ఉన్నాడు’ అనడం ఆ భావవిస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. గోత్రనామాలు సాధారణ తెలుగు బైబిలు రూపాలకు దగ్గరగా ఉంచబడ్డాయి; దైవనామం మాత్రం మూల హీబ్రూ వ్యక్తినామాన్ని ప్రతిబింబించేలా ‘యాహ్వే’గా ఇవ్వబడింది.
