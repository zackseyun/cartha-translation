id: 2CH.15.14
reference: 2 Chronicles 15:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשָּֽׁבְעוּ֙ לַ/יהוָ֔ה בְּ/ק֥וֹל גָּד֖וֹל וּ/בִ/תְרוּעָ֑ה וּ/בַ/חֲצֹצְר֖וֹת וּ/בְ/שׁוֹפָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/014.yaml
  text: And they swore to Yahweh with a loud voice[a], with shouting, and with trumpets and horns.
translation:
  language: te
  text: వారు బిగ్గర స్వరంతో, కేకలతో, బాకాలతోను కొమ్ము బూరలతోను యహ్వేకు ప్రమాణం చేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: ‘షోఫార్లు’ లేదా ‘పొట్టేలు కొమ్ములు’; ఇవి ముందు చెప్పిన ‘బాకాలకు’ భిన్నమైన వాయిద్యాలు.'
    reason: శׁוֹפָרוֹתకు ఉన్న ప్రత్యామ్నాయ పదార్థాన్ని సూచిస్తూ, హֲצֹצְרוֹתతో ఉన్న వ్యత్యాసాన్ని స్పష్టం చేయడానికి.
lexical_decisions:
- source_word: וַיִּשָּׁבְעוּ
  choice: ప్రమాణం చేశారు
  rationale: שׁבע నిఫ్అల్ రూపం ఇక్కడ ప్రమాణం చేయడాన్ని సూచిస్తుంది. ‘ప్రమాణం చేశారు’ అనేది సహజమైన ఆధునిక తెలుగు; సందర్భంలోని నిబంధనాత్మక గంభీరతను కూడా నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యహ్వేకు
  rationale: לְ ఉపసర్గ ప్రమాణం ఎవరికి చేయబడిందో సూచిస్తుంది. יהוה అనే దేవుని ప్రత్యేక నామాన్ని ‘యహ్వే’గా లిప్యంతరీకరించాం.
- source_word: בְּקוֹל גָּדוֹל
  choice: పెద్ద స్వరంతో
  rationale: קוֹל גָּדוֹל బిగ్గరగా వినిపించే సామూహిక స్వరాన్ని సూచిస్తుంది. ‘పెద్ద స్వరంతో’ మూలంలోని నామవాచక నిర్మాణాన్నీ శ్రావ్యమైన బలాన్నీ నిలుపుతుంది.
- source_word: וּבִתְרוּעָה
  choice: కేకలతో
  rationale: תְּרוּעָה బిగ్గరగా చేసే కేక లేదా సామూహిక ధ్వనిని సూచించవచ్చు. ఇక్కడ ఆనందమా యుద్ధమా అని ప్రత్యేకంగా నిర్ణయించకుండా ‘కేకలతో’ అని అనువదించాం.
- source_word: וּבַחֲצֹצְרוֹת
  choice: బాకాలతో
  rationale: חֲצֹצְרוֹת ఇశ్రాయేలు ఆరాధన, సభలలో ఉపయోగించిన నేరుగా ఉండే లోహపు బాకాలను సూచిస్తుంది. ‘బాకాలు’ తరువాతి కొమ్ము వాయిద్యాల నుండి వీటిని వేరు చేస్తుంది.
- source_word: וּבְשׁוֹפָרוֹת
  choice: కొమ్ము బూరలతో
  rationale: שׁוֹפָרוֹת అనేవి חֲצֹצְרוֹתకు భిన్నమైన కొమ్ము వాయిద్యాలు. ‘కొమ్ము బూరలు’ సాధారణ పాఠకులకు అర్థమవుతూ ఆ వ్యత్యాసాన్ని కాపాడుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో దేవుని ప్రత్యేక నామమైన יהוה నేరుగా ఉంది. బిరుదుతో భర్తీ చేయకుండా నిబంధన నామాన్ని నిలుపుటకు ‘యహ్వే’ అని ఇచ్చాం.
- issue: תְּרוּעָה యొక్క సందర్భార్థం
  choice: కేకలు
  alternative: జయధ్వని; ఆనందధ్వని; యుద్ధకేక
  rationale: ఈ పదం ఉత్సవపూర్వక కేకను సూచించే అవకాశం ఉన్నప్పటికీ, మూలపాఠం ఆనందం లేదా యుద్ధం అని స్పష్టంగా నిర్దేశించదు. అందువల్ల తటస్థమైన ‘కేకలు’ను ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామూహిక ప్రమాణ స్వీకారంలోని గంభీరత మరియు శబ్ద వైభవం స్పష్టంగా వినిపించేలా రూపొందించాం. అరుదైన లిప్యంతరీకరణను ప్రధాన పాఠంలో తప్పించి, ‘షోఫార్లు’ అనే పదాన్ని పాదటిప్పణిలో వివరించాం.
