  text: So they gathered at Jerusalem in the third month, in the fifteenth year of Asa's reign.
translation:
  language: te
  text: ఆసా పరిపాలనలోని పదిహేనవ సంవత్సరపు మూడవ నెలలో వారు యెరూషలేములో కూడివచ్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: వారు సమావేశమయ్యారు
  rationale: קבץ ధాతువు నిఫ్అల్ రూపం సమూహంగా కూడడాన్ని సూచిస్తుంది. ‘సమావేశమయ్యారు’ ఆధునిక తెలుగులో సహజంగా ఉండి, సందర్భంలోని సమష్టి భావాన్ని నిలుపుతుంది; వావ్ వరుసక్రమ భావాన్ని తెలుగు వాక్యప్రవాహమే తెలియజేస్తుంది.
- source_word: יְרוּשָׁלִַם
  choice: యెరూషలేములో
  rationale: స్థలనామానికి ప్రాచుర్యంలో ఉన్న తెలుగు లిప్యంతరీకరణను వాడి, בְ ఉపసర్గను ‘లో’ ద్వారా వ్యక్తం చేశాం.
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי
  choice: మూడవ నెలలో
  rationale: నిర్దిష్టమైన కాలసూచనను తెలుగులో సహజమైన క్రమసంఖ్యా నిర్మాణంతో నేరుగా అనువదించాం.
- source_word: לִשְׁנַת חֲמֵשׁ עֶשְׂרֵה
  choice: పదిహేనవ సంవత్సరంలోని
  rationale: రాజ్యపాలన ఆధారంగా తేదీ తెలిపే సందర్భంలో לְను పదశః కాకుండా తెలుగులో సహజమైన కాలనిర్దేశక సంబంధంగా అందించాం.
- source_word: לְמַלְכוּת אָסָא
  choice: ఆసా పరిపాలనలో
  rationale: מַלְכוּת ఇక్కడ రాజ్యాధికారపు కాలాన్ని, అంటే ఆసా పాలించిన కాలాన్ని సూచిస్తుంది. ‘పరిపాలనలో’ కాలనిర్ణయ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని కాలక్రమ సమాచారాన్ని పూర్తిగా నిలుపుతూ తెలుగు పదక్రమాన్ని సహజంగా అమర్చాం.
