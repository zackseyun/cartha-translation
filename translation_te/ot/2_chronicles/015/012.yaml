  to: వారు తమ పితరుల దేవుడైన యాహ్వేను[a] తమ పూర్ణ హృదయంతోను తమ పూర్ణ ప్రాణంతోను వెదకడానికి ఆ నిబంధనలో ప్రవేశించారు.[b]
