id: 2CH.15.12
reference: 2 Chronicles 15:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ בַ/בְּרִ֔ית לִ/דְר֕וֹשׁ אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם בְּ/כָל לְבָבָ֖/ם וּ/בְ/כָל נַפְשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/012.yaml
  text: And they entered into the covenant to seek Yahweh[a], the God of their fathers[b], with all their heart and with all their soul.
translation:
  language: te
  text: వారు తమ పితరుల దేవుడైన యాహ్వేను[a] తమ పూర్ణ హృదయంతోను తమ పూర్ణ ప్రాణంతోను వెదకడానికి ఆ నిబంధనలో ప్రవేశించారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యాహ్వే—ఇది హీబ్రూ మూలంలో ఉన్న దేవుని వ్యక్తిగత నామం.
    reason: cultural_note
  - marker: b
    text: లేదా, “వారు నిబంధన ద్వారా తమను తాము బంధించుకున్నారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ בַבְּרִית
  choice: ఆ నిబంధనలో ప్రవేశించారు
  rationale: בוא + בַּבְּרִית అనే ప్రయోగం భౌతికంగా రావడాన్ని కాక, నిబంధనకు కట్టుబడే చర్యను సూచిస్తుంది. తెలుగు సహజత్వాన్ని కాపాడుతూ మూలంలోని రూపకాన్ని నిలుపుతుంది.
- source_word: לִדְרוֹשׁ
  choice: వెదకడానికి
  rationale: దేవునికి సంబంధించిన నిబంధనా సందర్భంలో דרש కేవలం విచారించడం కాక, ఆయనను ఆశ్రయించి అనుసరించడాన్ని సూచిస్తుంది; ‘వెదకడం’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: మూలంలోని దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించబడింది.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: తమ పూర్వికుల దేవుడు
  rationale: అ ancestral covenant సంబంధాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది. ఇక్కడ אבות సమూహపు పూర్వతరాలను సూచించేందున ‘పూర్వికులు’ సందర్భానుకూలం.
- source_word: בְּכָל לְבָבָם
  choice: తమ పూర్ణహృదయంతో
  rationale: లేబాబ్ సంకల్పం, ఉద్దేశం సహా అంతరంగ వ్యక్తిని సూచిస్తుంది; ‘పూర్ణహృదయంతో’ సంపూర్ణ అంకితభావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: וּבְכָל נַפְשָׁם
  choice: పూర్ణప్రాణంతో
  rationale: נפש ఇక్కడ జీవం, స్వయం, వ్యక్తి అంతటినీ సూచిస్తుంది. ‘పూర్ణప్రాణంతో’ మూలంలోని హృదయం–ప్రాణం జంటను నిలుపుతూ సంపూర్ణ సమర్పణను తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: వచనంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది; దాని నామస్వరూపాన్ని నిలుపడానికి ‘యాహ్వే’ వాడబడింది.
- issue: אֲבוֹתֵיהֶם లోని పూర్వతరాల సూచన
  choice: తమ పూర్వికులు
  alternative: తమ తండ్రులు
  rationale: హీబ్రూ పదం వ్యాకరణపరంగా పుంలింగ బహువచనమైనప్పటికీ, ఈ సందర్భంలో వారి పూర్వతరాల సమూహాన్ని సూచిస్తుంది. ‘పూర్వికులు’ ఆ చారిత్రక, నిబంధనా సంబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- issue: నిబంధనలో ప్రవేశించడం అనే భావం
  choice: ఆ నిబంధనలో ప్రవేశించారు
  alternative: నిబంధన ద్వారా తమను తాము బంధించుకున్నారు
  rationale: మూలంలోని בוא (‘ప్రవేశించు’) రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని కట్టుబాటు భావాన్ని పాదసూచికలో వెల్లడించడం ద్వారా నిజమైన భావవిస్తృతిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభగ్రాహ్యమైన శైలి. ‘ఆ నిబంధన’ నిర్దిష్ట నిబంధనను సూచిస్తుంది. ‘పూర్ణహృదయంతో, పూర్ణప్రాణంతో’ అనే సమాంతర నిర్మాణం హీబ్రూ వాక్యంలోని సంపూర్ణ అంకితభావాన్ని నిలుపుతుంది.
