id: 2CH.15.5
reference: 2 Chronicles 15:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בָ/עִתִּ֣ים הָ/הֵ֔ם אֵ֥ין שָׁל֖וֹם לַ/יּוֹצֵ֣א וְ/לַ/בָּ֑א כִּ֚י מְהוּמֹ֣ת רַבּ֔וֹת עַ֥ל כָּל יוֹשְׁבֵ֖י הָ/אֲרָצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/005.yaml
  text: And in those times there was no peace for the one going out or for the one coming in[b][a], because many disturbances were upon all the inhabitants of the lands.
translation:
  language: te
  text: ఆ కాలాల్లో బయటికి వెళ్లేవానికిగానీ వచ్చేవానికిగానీ[a] క్షేమం లేదు; ఎందుకంటే దేశాలన్నిటి నివాసులపై అనేక కల్లోలాలు[b] ఉండేవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బయటికి వెళ్లడం, రావడం’ అనేది దైనందిన రాకపోకలను, ముఖ్యంగా ప్రయాణాన్ని లేదా బహిరంగ కార్యకలాపాలను సూచించే హీబ్రూ నానుడి.
    reason: cultural_note
  - marker: b
    text: లేదా ‘తీవ్రమైన అల్లకల్లోలాలు’; హీబ్రూ పదం కల్లోలం, గందరగోళం లేదా భయాందోళనను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָעִתִּים הָהֵם
  choice: ఆ కాలాల్లో
  rationale: బహువచన కాలసూచక పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; వాక్యారంభంలోని וּ సందర్భానుసారంగా ప్రత్యేకంగా అనువదించాల్సిన అవసరం లేదు.
- source_word: אֵין שָׁלוֹם
  choice: క్షేమం ఉండేది కాదు
  rationale: שָׁלוֹם అనే పదంలోని శాంతి, భద్రత, సుఖక్షేమం అనే విస్తృత భావాన్ని, ప్రయాణం సురక్షితం కాని ఈ సందర్భంలో ‘క్షేమం’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לַיּוֹצֵא וְלַבָּא
  choice: బయటికి వెళ్లేవానికిగానీ లోపలికి వచ్చేవానికిగానీ
  rationale: ఏ వ్యక్తికైనా వర్తించే ఏకవచన క్రియావిశేషణ రూపాలను, అలాగే బయటికి వెళ్లడం–లోపలికి రావడం అనే హీబ్రూ జంటప్రయోగాన్ని నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి క్షేమలేమికి కారణాన్ని స్పష్టంగా పరిచయం చేసే సహజమైన ఆధునిక తెలుగు అనుసంధానం.
- source_word: מְהוּמֹת רַבּוֹת
  choice: అనేక కల్లోలాలు
  rationale: గందరగోళం, అల్లకల్లోలం లేదా భయాందోళనను సూచించగల పదానికి విస్తృతమైన, సందర్భోచితమైన ఎంపిక; బహువచనాన్ని కూడా నిలుపుతుంది.
- source_word: עַל כָּל יוֹשְׁבֵי הָאֲרָצוֹת
  choice: దేశాలన్నిటి నివాసుల మీద
  rationale: עַל యొక్క ‘మీద’ అనే రూపకాన్ని, הָאֲרָצוֹת యొక్క బహువచనాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని కాలసూచన, కారణ సంబంధం, దేశాల బహువచనం, రాకపోకల నానుడి నిలుపబడ్డాయి.
