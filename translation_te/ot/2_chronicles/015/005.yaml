- from: ఆ కాలాల్లో బయటికి వెళ్లేవానికిగానీ లోపలికి వచ్చేవానికిగానీ[a] క్షేమం ఉండేది కాదు; ఎందుకంటే దేశాలన్నిటి నివాసుల మీద అనేక కల్లోలాలు[b] ఉండేవి.
