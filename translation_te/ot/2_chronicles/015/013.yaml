id: 2CH.15.13
reference: 2 Chronicles 15:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כֹ֨ל אֲשֶׁ֧ר לֹֽא יִדְרֹ֛שׁ לַ/יהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל יוּמָ֑ת לְ/מִן קָטֹן֙ וְ/עַד גָּד֔וֹל לְ/מֵ/אִ֖ישׁ וְ/עַד אִשָּֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/013.yaml
  text: And everyone who would not seek Yahweh[a], the God of Israel, was to be put to death, from small to great[b], from man to woman.
translation:
  language: te
  text: ఇశ్రాయేలు దేవుడైన యెహోవాను వెదకని ప్రతివాడూ చంపబడాలి—చిన్నవాడి నుండి గొప్పవాడి వరకు[a], పురుషుని నుండి స్త్రీ వరకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అల్పుడి నుండి ఘనుడి వరకు.’ ఈ హెబ్రీయ నుడికారం వయస్సును మాత్రమే కాక, సమాజంలోని అన్ని స్థాయుల వారినీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  choice: ప్రతివాడూ
  rationale: సమగ్రతను తెలిపే כֹל אֲשֶׁר సంబంధవాక్యాన్ని సహజమైన ఆధునిక తెలుగులో సార్వత్రిక పరిధితో వ్యక్తం చేస్తుంది.
- source_word: לֹא יִדְרֹשׁ
  choice: వెదకని
  rationale: దినవృత్తాంతాల్లో דרשׁ దేవుని ఆశ్రయించి, ఆయనను వెదకడాన్ని సూచించే ముఖ్యమైన నిబంధనాపరమైన పదం. తెలుగు ‘వెదకు’ ఆ భావాన్ని సరళంగా నిలుపుతుంది; ప్రమాణ నిబంధన వల్ల కలిగే నియమార్థం ప్రధాన క్రియలో వ్యక్తమవుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాను
  rationale: దైవనామమైన יהוהను తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’గా లిప్యంతరీకరించడం మూలపాఠంలోని వ్యక్తిగత నామాన్ని నిలుపుతుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: నిర్మాణ సంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేసి, యెహోవాను ఇశ్రాయేలు దేవునిగా గుర్తిస్తుంది.
- source_word: יוּמָת
  choice: మరణశిక్ష పొందాలి
  rationale: מות హొఫాల్ రూపంలోని causative-passive భావాన్ని, అంటే కేవలం చనిపోవడం కాక చంపబడడం/మరణదండన విధించబడడం అనే న్యాయబద్ధ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְמִן קָטֹן וְעַד גָּדוֹל
  choice: చిన్నవాడి నుండి గొప్పవాడి వరకు
  rationale: వయస్సుకు మాత్రమే పరిమితం చేయకుండా హోదా, ప్రాముఖ్యత సహా సమాజమంతటి పరిధిని సూచించే హెబ్రీయ జంటను దగ్గరగా నిలుపుతుంది.
- source_word: לְמֵאִישׁ וְעַד אִשָּׁה
  choice: పురుషుడి నుండి స్త్రీ వరకు
  rationale: ఏకవచన పంపిణీ నిర్మాణాన్నీ, లింగ జంట ద్వారా వ్యక్తమయ్యే సంపూర్ణ పరిధినీ సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: తీవ్రమైన నిబంధనా శిక్షను మృదువుపరచకుండా అనువదించడం
  choice: ‘మరణశిక్ష పొందాలి’ అని స్పష్టంగా ఉంచడం
  alternative: ‘చనిపోవాలి’ అని సాధారణ మరణంగా చెప్పడం లేదా సంఘబహిష్కరణ/నిబంధనా శాపంగా వ్యాఖ్యానించడం
  rationale: יוּמָת అనేది מות యొక్క హొఫాల్ రూపం; అది కేవలం మరణాన్ని కాక, మరణానికి గురిచేయబడడాన్ని స్పష్టంగా సూచిస్తుంది. కాబట్టి వృత్తాంతంలోని తీవ్రతను తగ్గించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. మూలంలోని నిబంధనాపరమైన తీవ్రతను నిలుపుతూ, వయస్సు అని అతిగా నిర్దిష్టం చేయకుండా సామాజిక సమగ్రతను కాపాడింది.
