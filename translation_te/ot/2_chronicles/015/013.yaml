  to: ఇశ్రాయేలు దేవుడైన యెహోవాను వెదకని ప్రతివాడూ చంపబడాలి—చిన్నవాడి నుండి గొప్పవాడి వరకు[a], పురుషుని నుండి స్త్రీ వరకు.
