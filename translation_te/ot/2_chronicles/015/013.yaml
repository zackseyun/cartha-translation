review_pass:
  verdict: revise
  source_fidelity: ‘మరణశిక్ష పొందాలి’ generally conveys being sentenced to death, whereas יוּמָת explicitly states that the person is to be put to death. Revising to ‘చంపబడాలి’ retains the Hebrew Hophal passive/causative force without reducing the penalty to a judicial sentence.
  naturalness: The revised wording is clear, modern standard Telugu and suitably formal for a covenant-oath report. The distributive singular expressions remain natural in context.
  terminology: ‘యెహోవా,’ ‘ఇశ్రాయేలు దేవుడు,’ and ‘వెదకడం’ appropriately represent the divine name, construct phrase, and covenantal use of דרשׁ. ‘చంపబడాలి’ is more exact than ‘మరణశిక్ష పొందాలి’ for יוּמָת.
  issues:
  - severity: medium
    issue: ‘మరణశిక్ష పొందాలి’ can mean ‘must receive/be given a death sentence.’
    rationale: The Hebrew יוּמָת means ‘be put to death’; it reports the stipulated execution itself, not only the imposition of a sentence. ‘చంపబడాలి’ directly expresses the required passive/causative sense.
  revised_text: ఇశ్రాయేలు దేవుడైన యెహోవాను వెదకని ప్రతివాడూ చంపబడాలి—చిన్నవాడి నుండి గొప్పవాడి వరకు[a], పురుషుని నుండి స్త్రీ వరకు.
