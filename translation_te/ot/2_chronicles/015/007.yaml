id: 2CH.15.7
reference: 2 Chronicles 15:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתֶּ֣ם חִזְק֔וּ וְ/אַל יִרְפּ֖וּ יְדֵי/כֶ֑ם כִּ֛י יֵ֥שׁ שָׂכָ֖ר לִ/פְעֻלַּתְ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/007.yaml
  text: But as for you[a], be strong, and do not let your hands grow weak, for there is a reward for your work.
translation:
  language: te
  text: అయితే మీరు బలంగా ఉండండి; మీ చేతులు బలహీనపడనివ్వకండి[a]. ఎందుకంటే మీ పనికి ప్రతిఫలం ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ చేతులు సడలిపోనివ్వకండి.” ఈ హీబ్రూ నుడికారం బలం, సంకల్పం లేదా ధైర్యం కోల్పోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: అయితే మీరు
  rationale: సంయోజక అవ్యయంతో కూడిన స్వతంత్ర సర్వనామం ముందటి సందర్భానికి భిన్నంగా వీరిని ప్రత్యేకంగా ఉద్దేశించి ప్రోత్సహిస్తోంది; ‘అయితే మీరు’ ఆ వ్యత్యాసపూర్వక నొక్కును సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חִזְקוּ
  choice: బలంగా ఉండండి
  rationale: חזק బహువచన ఆజ్ఞ ఇక్కడ బలం, స్థిరత్వం, ధైర్యం కలిగి ఉండమనే ప్రోత్సాహం; ‘బలంగా ఉండండి’ నేరుగా, సహజంగా ఉంది.
- source_word: וְ/אַל יִרְפּוּ יְדֵי/כֶם
  choice: మీ చేతులు బలహీనపడనివ్వకండి
  rationale: רפה తో ‘చేతులు’ కర్తగా ఉండే హీబ్రూ నుడికారం బలం, ధైర్యం లేదా సంకల్పం సడలిపోవడాన్ని సూచిస్తుంది. మూల రూపకాన్ని నిలుపుతూ తెలుగులో అర్థమయ్యేలా అనువదించబడింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: తదుపరి మాట ప్రోత్సాహానికి కారణాన్ని తెలియజేస్తోంది; తెలుగులో ‘ఎందుకంటే’ ఈ కారణార్థ సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: יֵשׁ
  choice: ఉంది
  rationale: ఇది అస్తిత్వాన్ని తెలిపే పదం. భావంలో భవిష్యత్ ఫలితం సూచితమైనా, మూలంలో భవిష్యత్ కాలం స్పష్టంగా లేదు; అందుచేత వర్తమాన అస్తిత్వ రూపం నిలుపబడింది.
- source_word: שָׂכָר
  choice: ప్రతిఫలం
  rationale: ఈ నామవాచకం బహుమానం, వేతనం లేదా చేసినదానికి లభించే ఫలాన్ని సూచించగలదు. ‘ప్రతిఫలం’ సందర్భానికి సరిపోయి, కేవలం కూలి అనే సంకుచిత భావాన్ని రుద్దదు.
- source_word: לִ/פְעֻלַּתְ/כֶם
  choice: మీ పనికి
  rationale: פְעֻלָּה పని, క్రియ లేదా శ్రమను సూచిస్తుంది. ‘మీ పనికి’ చర్యకు లభించే ప్రతిఫల భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ప్రతిఫల భాష స్వభావం
  choice: మీ పనికి ప్రతిఫలం ఉంది
  alternative: మీ శ్రమకు ప్రతిఫలం లభిస్తుంది
  rationale: వచనం నిబంధన విశ్వాస్యతకు ప్రేరణగా ప్రతిఫలాన్ని వాగ్దానం చేస్తుంది; అయితే యోగ్యత, రక్షణ లేదా నీతిమంతులుగా తీర్చబడడం గురించి విస్తృత సిద్ధాంతాన్ని పేర్కొనదు. అస్తిత్వ వాక్యాన్ని అలాగే ఉంచడం మూలంలోని భావ ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. సాధారణ పాఠకులకు అర్థమయ్యే భాషను ఎంచుకుంటూనే ‘చేతులు’ అనే మూల హీబ్రూ రూపకాన్ని నిలుపుకున్నాం.
