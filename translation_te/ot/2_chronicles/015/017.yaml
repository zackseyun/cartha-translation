source:
  edition: WLC
  text: וְ/הַ֨/בָּמ֔וֹת לֹא סָ֖רוּ מִ/יִּשְׂרָאֵ֑ל רַ֧ק לְבַב אָסָ֛א הָיָ֥ה שָׁלֵ֖ם כָּל יָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/017.yaml
  text: But the high places were not removed from Israel; nevertheless, Asa’s heart was whole all his days.
translation:
  language: te
  text: అయితే ఉన్నత స్థలాలు ఇశ్రాయేలు నుండి తొలగించబడలేదు; అయినా ఆసా హృదయం అతని జీవితకాలమంతా సంపూర్ణమైనదిగా ఉండేది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: ఉన్నత స్థలాలు
  rationale: ఆరాధన కోసం ఉపయోగించిన ఎత్తైన ప్రదేశాలు లేదా వేదికలను సూచించే చారిత్రక-ఆరాధనా పదానికి సూటిగా సరిపడే రూపం; వాటి స్వభావాన్ని అదనంగా నిర్ధారించదు.
- source_word: לֵבַב אָסָא
  choice: ఆసా హృదయం
  rationale: హీబ్రూ రూపకాన్ని నిలుపుతూ ఆసా అంతరంగ సంకల్పం, నిబద్ధత అనే భావాలను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שָׁלֵם
  choice: సంపూర్ణంగా
  rationale: ‘పూర్ణమైన/అవిభక్తమైన’ అనే మూలార్థాన్ని నిలుపుతుంది; ‘పూర్తిగా అంకితమైంది’ అని విస్తరించి వ్యాఖ్యానించకుండా అసలు వాక్యంలోని భావసాంద్రతను కాపాడుతుంది.
- source_word: כָּל יָמָיו
  choice: అతని జీవితకాలమంతా
  rationale: అక్షరార్థమైన ‘అతని దినాలన్నీ’ అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఉన్నత స్థలాలు మిగిలి ఉండటం మరియు ఆసా హృదయం సంపూర్ణంగా ఉండటం మధ్య ఉద్రిక్తత
  choice: రెండు వాక్యాలనూ ‘అయినా’తో అనుసంధానించి యథాతథంగా ఉంచడం
  alternative: ఆసా వ్యక్తిగతంగా నిర్దోషి లేదా పూర్తిగా అంకితుడని వివరణాత్మకంగా చెప్పడం
  rationale: మూలపాఠం సామూహిక సంస్కరణలోని లోపాన్ని, ఆసా హృదయ స్థితిపై అనుకూల నిర్ధారణను పక్కపక్కనే ఉంచుతుంది; ఆ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘ఉన్నత స్థలాలు’ అనే బైబిలు-చారిత్రక పదబంధాన్ని నిలిపి, ‘హృదయం సంపూర్ణంగా ఉంది’ అనే మూల రూపకాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా అందించింది.
