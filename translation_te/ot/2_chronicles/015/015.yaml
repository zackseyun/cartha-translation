source:
  edition: WLC
  text: וַ/יִּשְׂמְח֨וּ כָל יְהוּדָ֜ה עַל הַ/שְּׁבוּעָ֗ה כִּ֤י בְ/כָל לְבָבָ/ם֙ נִשְׁבָּ֔עוּ וּ/בְ/כָל רְצוֹנָ֣/ם בִּקְשֻׁ֔/הוּ וַ/יִּמָּצֵ֖א לָ/הֶ֑ם וַ/יָּ֧נַח יְהוָ֛ה לָ/הֶ֖ם מִ/סָּבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/015.yaml
  text: And all Judah rejoiced over the oath[a], because they had sworn with all their heart and sought him with all their will, and he let himself be found by them, and Yahweh gave them rest all around.
translation:
  language: te
  text: యూదా ప్రజలందరూ ఆ ప్రమాణం కారణంగా సంతోషించారు. ఎందుకంటే వారు తమ పూర్ణ హృదయంతో ప్రమాణం చేసి, తమ పూర్ణ ఇష్టంతో ఆయనను వెదికారు. ఆయన వారికి దొరికాడు[a]. యెహోవా వారికి నలుదిక్కులా విశ్రాంతిని ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన తనను కనుగొననిచ్చాడు.”
    reason: హీబ్రూ నిఫ్అల్ రూపం ప్రత్యక్షంగా ‘ఆయన వారికి దొరికాడు’ అని ఉంటుంది; సందర్భంలో దేవుడు తనను వెదికిన వారికి తనను కనుగొననిచ్చాడనే భావం కూడా సాధ్యమే.
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ כָל־יְהוּדָה
  choice: యూదా ప్రజలందరూ ... సంతోషించారు
  rationale: సామూహికంగా యూదా ప్రజలను సూచించే సహజమైన ఆధునిక తెలుగు; שׂמח లోని ఆనందభావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל־הַשְּׁבוּעָה
  choice: ఆ ప్రమాణాన్ని బట్టి
  rationale: భావోద్వేగ క్రియతో వచ్చిన עַל ప్రమాణమే వారి సంతోషానికి కారణమని సూచిస్తుంది.
- source_word: בְכָל־לְבָבָם נִשְׁבָּעוּ
  choice: తమ పూర్ణహృదయంతో ప్రమాణం చేసి
  rationale: హృదయపూర్వకమైన సంపూర్ణ నిబద్ధతను నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: וּבְכָל־רְצוֹנָם בִּקְשֻׁהוּ
  choice: తమ పూర్ణసంకల్పంతో ఆయన్ని వెదికారు
  rationale: רָצוֹן ఇక్కడ ఇష్టం, చిత్తం, సంకల్పం అనే భావపరిధిని కలిగి ఉంది; 'పూర్ణసంకల్పంతో' వారి స్వచ్ఛందమైన సంపూర్ణ నిబద్ధతను వ్యక్తపరుస్తుంది.
- source_word: וַיִּמָּצֵא לָהֶם
  choice: ఆయన వారికి దొరికాడు
  rationale: నిఫ్అల్ రూపంలోని నిజమైన అస్పష్టతను నిలుపుతూ, దేవుడు తనను కనుగొననిచ్చాడనే భావాన్ని వ్యాఖ్యానంగా ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: וַיָּנַח יְהוָה לָהֶם
  choice: యెహోవా వారికి ... విశ్రాంతి అనుగ్రహించాడు
  rationale: హిఫ్ఇల్ రూపంలోని 'విశ్రాంతి కలిగించడం/ఇవ్వడం' భావాన్ని గౌరవప్రదమైన సహజ తెలుగులో అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: מִסָּבִיב
  choice: చుట్టూ
  rationale: అన్ని వైపుల నుండి కలిగిన ప్రశాంతత లేదా శత్రుబాధలేని స్థితిని సంక్షిప్తంగా తెలియజేస్తుంది.
theological_decisions:
- issue: וַיִּמָּצֵא לָהֶם యొక్క దైవకర్తృత్వ భావం
  choice: ఆయన వారికి దొరికాడు
  alternative: ఆయన తనను కనుగొననిచ్చాడు
  rationale: హీబ్రూ నిఫ్అల్‌ను మరింత ప్రత్యక్షంగా అనుసరించి, అనుమతిసూచక భావాన్ని ప్రధాన పాఠ్యంలో తప్పనిసరిగా నిర్ణయించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: יְהוָה దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామూహిక భావానికి ‘యూదా ప్రజలందరూ’, సంపూర్ణ నిబద్ధతకు ‘పూర్ణహృదయంతో/పూర్ణసంకల్పంతో’ వాడాం. వాక్యాన్ని చదవడానికి సులభంగా మూడు వాక్యాలుగా విభజించి, గౌరవార్థక దైవ సర్వనామాన్ని ఉపయోగించాం.
