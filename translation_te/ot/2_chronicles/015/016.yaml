revisions:
- from: రాజైన ఆసా తల్లి మయకాను కూడా రాజమాత స్థానంనుండి తొలగించాడు. ఎందుకంటే ఆమె అషేరా కోసం ఒక జుగుప్సాకరమైన విగ్రహాన్ని చేసింది. ఆసా ఆమె విగ్రహాన్ని నరికివేసి, దాన్ని ముక్కలుగా నలగగొట్టి, కిద్రోను లోయలో కాల్చివేశాడు.[a]
  to: రాజైన ఆసా తన తల్లి మయకాను సైతం రాజమాత స్థానం నుండి తొలగించాడు. ఎందుకంటే ఆమె అషేరా కోసం ఒక జుగుప్సాకరమైన విగ్రహాన్ని చేసింది. ఆసా ఆమె విగ్రహాన్ని నరికివేసి, దాన్ని పొడిచేసి, కిద్రోను లోయలో కాల్చివేశాడు.[a]
  rationale: పాఠ్యార్థాన్ని మార్చకుండా, ఉద్ఘాటనను మరింత స్పష్టం చేశాం; ప్రామాణిక లిఖితరూపాన్ని సరిచేశాం; మరియు వస్తువును పొడిచేయడాన్ని సూచించే హీబ్రూ క్రియకు సహజమైన, ఖచ్చితమైన తెలుగు క్రియను వాడాం. పాదటిప్పణి సూచిక మరియు పాదటిప్పణి సమితి పరస్పరం సరిపోతాయి.
