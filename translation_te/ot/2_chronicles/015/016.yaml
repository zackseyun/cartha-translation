id: 2CH.15.16
reference: 2 Chronicles 15:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/גַֽם מַעֲכָ֞ה אֵ֣ם אָסָ֣א הַ/מֶּ֗לֶךְ הֱסִירָ/הּ֙ מִ/גְּבִירָ֔ה אֲשֶׁר עָשְׂתָ֥ה לַ/אֲשֵׁרָ֖ה מִפְלָ֑צֶת וַ/יִּכְרֹ֤ת אָסָא֙ אֶת מִפְלַצְתָּ֔/הּ וַ/יָּ֕דֶק וַ/יִּשְׂרֹ֖ף בְּ/נַ֥חַל קִדְרֽוֹן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/016.yaml
  text: Even Maacah[a], the mother of King Asa, he removed from being queen mother, because she had made a dreadful image for Asherah; and Asa cut down her dreadful image, crushed it[c][b], and burned it in the Kidron Valley.
translation:
  language: te
  text: రాజైన ఆసా తన తల్లి మయకాను సైతం రాజమాత స్థానం నుండి తొలగించాడు. ఎందుకంటే ఆమె అషేరా కోసం ఒక జుగుప్సాకరమైన విగ్రహాన్ని చేసింది. ఆసా ఆమె విగ్రహాన్ని నరికివేసి, దాన్ని పొడిచేసి, కిద్రోను లోయలో కాల్చివేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అషేరా’ అనేది కనానీయ దేవతను గానీ, ఆమెతో సంబంధమున్న ఆరాధనా చిహ్నాన్ని గానీ సూచించవచ్చు. ‘జుగుప్సాకరమైన విగ్రహం’ అని అనువదించిన హీబ్రూ పదానికి ‘భయంకరమైన వస్తువు’ లేదా ‘అసహ్యకరమైన ప్రతిమ’ అనే అర్థాలు కూడా ఉండవచ్చు. ‘కిద్రోను లోయలో’ అనే మాటకు ‘కిద్రోను వాగులో’ లేదా ‘కిద్రోను వాడిలో’ అని కూడా అర్థం కావచ్చు.
    reason: అషేరా, మִפְלָצֶת, మరియు నహల్ పదాలకు సంబంధించిన పరస్పర సంబంధమున్న సందిగ్ధతలను సంక్షిప్తంగా తెలియజేయడం.
lexical_decisions:
- source_word: וְגַם
  choice: కూడా
  rationale: ఆసా సంస్కరణ తన సొంత రాజకుటుంబ సభ్యురాలికీ విస్తరించిందనే అదనపు ఉద్ఘాటనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מַעֲכָה
  choice: మయకా
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు లిపిలో ధ్వన్యనుకరణ చేశాం.
- source_word: אֵם אָסָא הַמֶּלֶךְ
  choice: రాజైన ఆసా తల్లి
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని అర్థవంతమైన, సహజ తెలుగు పదక్రమంలో నిలిపాం.
- source_word: הֱסִירָהּ מִגְּבִירָה
  choice: రాజమాత స్థానంనుండి తొలగించాడు
  rationale: రాజసభ సందర్భంలో గెవీరా అనేది గుర్తింపు పొందిన రాజమాత హోదాను సూచిస్తుంది; క్రియను అధికారికంగా పదవీచ్యుతురాలిని చేశాడని అతిగా నిర్దిష్టపరచకుండా అనువదించాం.
- source_word: לַאֲשֵׁרָה
  choice: అషేరా కోసం
  rationale: ఇది దేవతను గానీ ఆమెతో సంబంధమున్న ఆరాధనా చిహ్నాన్ని గానీ సూచించగలదు; ‘తోపు’ లేదా ‘స్తంభం’ అని అర్థాన్ని కుదించలేదు.
- source_word: מִפְלָצֶת
  choice: జుగుప్సాకరమైన విగ్రహం
  rationale: ఈ అరుదైన నామవాచకం భయంకరమైన లేదా అసహ్యకరమైన ఆరాధనా వస్తువును సూచిస్తుంది. తరువాత దాన్ని నరకడం, నలగగొట్టడం, కాల్చడం వల్ల ‘విగ్రహం’ సందర్భానుగుణంగా స్పష్టంగా ఉంటుంది.
- source_word: וַיִּכְרֹת
  choice: నరికివేసి
  rationale: చెక్కతో చేసిన ఆరాధనా వస్తువుకు ‘నరికివేయడం’ సహజమైన తెలుగు క్రియ.
- source_word: וַיָּדֶק
  choice: ముక్కలుగా నలగగొట్టి
  rationale: వస్తువును చిన్నచిన్న ముక్కలుగా లేదా పొడిగా చేయడమనే క్రియార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּשְׂרֹף
  choice: కాల్చివేశాడు
  rationale: హీబ్రూ క్రియకు ప్రత్యక్షమైన, సహజ తెలుగు అనువాదం.
- source_word: בְּנַחַל קִדְרוֹן
  choice: కిద్రోను లోయలో
  rationale: నహల్ అనే పదం వాగు, వాడి లేదా లోయను సూచించగలదు; భౌగోళిక సందర్భంలో ‘కిద్రోను లోయ’ ఆధునిక పాఠకులకు సహజంగా ఉంటుంది.
theological_decisions:
- issue: אֲשֵׁרָה యొక్క సూచన
  choice: అషేరా
  alternative: అషేరా స్తంభం; తోపు
  rationale: మూలపదం దేవతను లేదా ఆమెతో సంబంధమున్న ఆరాధనా వస్తువును సూచించగల సందిగ్ధతను కలిగి ఉంది. పేరును అలాగే ఉంచడం ద్వారా పురాతన మతపరమైన సందర్భం నిలుస్తుంది; వస్తువు ఖచ్చితమైన రూపాన్ని అనవసరంగా నిర్ణయించదు.
- issue: גְּבִירָה అనే రాజబిరుదు
  choice: రాజమాత స్థానం
  alternative: మహారాణి; రాజసభలోని ప్రధాన మహిళ
  rationale: యూదా రాజరిక సందర్భంలో ఇది రాజు తల్లి లేదా ఆ పాత్రను నిర్వహించిన అమ్మమ్మకు ఉన్న అధికారిక హోదాను సహజంగా సూచిస్తుంది.
- issue: אֵם אָסָא అనే బంధుత్వ పదం
  choice: ఆసా తల్లి
  alternative: ఆసా అమ్మమ్మ
  rationale: మూలంలోని ‘తల్లి’ అనే పదాన్ని యథాతథంగా నిలిపాం. వంశావళి ఆధారంగా ఆమె అమ్మమ్మ అయి ఉండవచ్చనే వివరణాత్మక నిర్ణయాన్ని ప్రధాన పాఠ్యంలోకి దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘రాజమాత స్థానం’ సంస్థాగత హోదాను స్పష్టం చేస్తుంది; ‘జుగుప్సాకరమైన’ మూలంలోని అసహ్యం/భయానకత భావాన్ని నిలుపుతుంది. ప్రధాన పాఠ్యంలోని [a] సూచిక సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
