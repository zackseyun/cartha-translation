source:
  edition: WLC
  text: וַ/יֵּצֵא֮ לִ/פְנֵ֣י אָסָא֒ וַ/יֹּ֣אמֶר ל֔/וֹ שְׁמָע֕וּ/נִי אָסָ֖א וְ/כָל יְהוּדָ֣ה וּ/בִנְיָמִ֑ן יְהוָ֤ה עִמָּ/כֶם֙ בִּֽ/הְיֽוֹתְ/כֶ֣ם עִמּ֔/וֹ וְ/אִֽם תִּדְרְשֻׁ֨/הוּ֙ יִמָּצֵ֣א לָ/כֶ֔ם וְ/אִם תַּעַזְבֻ֖/הוּ יַעֲזֹ֥ב אֶתְ/כֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/002.yaml
  text: 'He went out to meet Asa and said to him[a], “Hear me, Asa, and all Judah and Benjamin: Yahweh is with you while you are with him. If you seek him, he will be found by you; but if you forsake him, he will forsake you.”'
translation:
  language: te
  text: 'అతడు ఆసాను కలుసుకోవడానికి బయలుదేరి అతనితో ఇలా అన్నాడు: “ఆసా, యూదా మరియు బెన్యామీను ప్రజలందరా, నా మాట వినండి! మీరు యెహోవాతో ఉన్నంతకాలం ఆయన మీతో ఉంటాడు. మీరు ఆయనను వెదికితే ఆయన మీకు దొరుకుతాడు[a]; కానీ మీరు ఆయనను విడిచిపెడితే ఆయన మిమ్మల్ని విడిచిపెడతాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన తనను మీరు కనుగొననిస్తాడు.”
    reason: יִמָּצֵא అనే నిఫాల్ రూపాన్ని దైవ అనుమతిని ముందుకు తెచ్చే ప్రతిఫలార్థక భావంతో కూడా అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: וַיֵּצֵא לִפְנֵי אָסָא
  choice: అతడు ఆసాను కలుసుకోవడానికి బయలుదేరి
  rationale: చలనాన్ని సూచించే సందర్భంలో לִפְנֵי అనే పదబంధం ఆసా ఎదుటికి, అంటే అతణ్ణి కలుసుకోవడానికి వెళ్లడాన్ని సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో ‘కలుసుకోవడానికి బయలుదేరి’ సహజంగా ఉంటుంది.
- source_word: שְׁמָעוּנִי
  choice: నా మాట వినండి
  rationale: ఇది ప్రథమ పురుష ఏకవచన ప్రత్యయంతో కూడిన బహువచన ఆజ్ఞ. ‘నా మాట వినండి’ ప్రవచనాత్మక పిలుపు యొక్క సూటితనాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: עִמָּכֶם ... עִמּוֹ
  choice: ఆయన మీతో ఉంటాడు ... మీరు యెహోవాతో ఉన్నంతకాలం
  rationale: హీబ్రూలోని ‘తోడు ఉండడం’ అనే పరస్పర నిర్మాణాన్ని తెలుగులోనూ నిలిపి, దాని నిబంధనాత్మక భావాన్ని స్పష్టంగా వ్యక్తం చేశాం.
- source_word: תִּדְרְשֻׁהוּ
  choice: మీరు ఆయనను వెదికితే
  rationale: దేవుని విషయంలో דרש కేవలం విచారించడం కాక, ఆయనను ఆశ్రయిస్తూ వెదకడాన్ని సూచిస్తుంది. ‘వెదికితే’ ఈ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: יִמָּצֵא לָכֶם
  choice: ఆయన మీకు దొరుకుతాడు
  rationale: מצא యొక్క నిఫాల్ రూపం ‘కనబడతాడు/దొరుకుతాడు’ అనే భావాన్ని ఇస్తుంది. ‘మీకు దొరుకుతాడు’ హీబ్రూ రూపానికి దగ్గరగా ఉండి ఆధునిక తెలుగులో సహజంగా ఉంటుంది; దైవ అనుమతిని స్పష్టంగా చేర్చి మూలంలోని అస్పష్టతను తొలగించలేదు.
- source_word: תַּעַזְבֻהוּ ... יַעֲזֹב אֶתְכֶם
  choice: మీరు ఆయనను విడిచిపెడితే ఆయన మిమ్మల్ని విడిచిపెడతాడు
  rationale: హీబ్రూలో ఒకే క్రియను పునరావృతం చేయడం వల్ల ఏర్పడిన పరస్పరతను తెలుగులో ‘విడిచిపెట్టు’ అనే ఒకే క్రియతో నిలిపాం.
theological_decisions:
- issue: నిబంధనాత్మక పరస్పరత
  choice: యెహోవా ప్రజలతో ఉండడం, వారు ఆయనతో ఉండడంతో సంబంధం కలిగిన నిజమైన షరతుగా అనువదించాం; వెదకడం, విడిచిపెట్టడం వాటికి తగిన ఫలితాలతో చెప్పబడ్డాయి.
  alternative: ఈ మాటలను నిబంధనాత్మక షరతుగా కాక, కేవలం మానవ అనుభవాన్ని తెలిపే మాటలుగా మృదువుగా అనువదించడం.
  rationale: మూలంలోని స్పష్టమైన షరతు వాక్యాలు, పరస్పర పదప్రయోగం నిలుపబడ్డాయి. పట్టుదల లేదా విశ్వాసత్యాగం గురించి ఈ వాక్యానికి మించిన సిద్ధాంత నిర్ణయాన్ని అనువాదంలో చేర్చలేదు.
- issue: יִמָּצֵא לָכֶם లోని కర్తృత్వ సూక్ష్మత
  choice: ‘ఆయన మీకు దొరుకుతాడు’ అని నిష్క్రియాత్మక/స్థిత్యర్థ భావాన్ని సహజ తెలుగులో ఉంచాం.
  alternative: ‘ఆయన తనను మీరు కనుగొననిస్తాడు’ అని దైవ అనుమతిని స్పష్టీకరించడం.
  rationale: హీబ్రూ నిఫాల్ రూపం దైవ అనుమతిని సూచించవచ్చుగానీ దానిని తప్పనిసరిగా స్పష్టీకరించదు. అందువల్ల మూలంలోని భావ విస్తృతిని ప్రధాన పాఠంలో కాపాడి, విస్తరించిన అర్థాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే ప్రవచనాత్మక గంభీరతతో రూపొందించబడింది. సంబోధనలో బహువచనాన్ని స్పష్టంగా ఉంచి, ‘తో ఉండడం’ మరియు ‘విడిచిపెట్టడం’ అనే హీబ్రూ పరస్పర నిర్మాణాలను సాధ్యమైనంతవరకు నిలిపాం.
