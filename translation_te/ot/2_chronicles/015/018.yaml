id: 2CH.15.18
reference: 2 Chronicles 15:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֵ֞א אֶת קָדְשֵׁ֥י אָבִ֛י/ו וְ/קָֽדָשָׁ֖י/ו בֵּ֣ית הָ/אֱלֹהִ֑ים כֶּ֥סֶף וְ/זָהָ֖ב וְ/כֵלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/018.yaml
  text: 'He brought into the house of God his father''s holy gifts and his own holy gifts: silver, gold, and vessels.'
translation:
  language: te
  text: అతడు తన తండ్రి ప్రతిష్ఠించిన కానుకలను, తాను ప్రతిష్ఠించిన కానుకలను—వెండిని, బంగారాన్ని, పాత్రలను—దేవుని మందిరంలోకి తీసుకొచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָדְשֵׁי אָבִיו
  choice: తన తండ్రి ప్రతిష్ఠించిన కానుకలను
  rationale: קֹדֶשׁ యొక్క సమర్పించి పవిత్రపరచిన వస్తువులు అనే భావాన్ని సందర్భానుసారంగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ఇవి కేవలం సాధారణ ‘పవిత్ర వస్తువులు’ కావని తెలియజేస్తుంది.
- source_word: וְקָדָשָׁיו
  choice: తాను ప్రతిష్ఠించిన కానుకలను
  rationale: ముందటి పదబంధానికి సమాంతరతను నిలుపుతూ, అతడు స్వయంగా దేవునికి సమర్పించి ప్రత్యేకపరచిన వస్తువులను సూచిస్తుంది.
- source_word: כֶּסֶף וְזָהָב וְכֵלִים
  choice: వెండిని, బంగారాన్ని, పాత్రలను
  rationale: మూడు పదాల జాబితాను నేరుగా ప్రతిబింబిస్తుంది; כֵּלִים ఇక్కడ మందిరానికి సంబంధించిన పాత్రలు లేదా సామగ్రిని సూచించవచ్చు, కాగా ‘పాత్రలు’ సందర్భానికి సహజమైన సంక్షిప్త ఎంపిక.
- source_word: בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరంలోకి
  rationale: ‘దేవుని ఇల్లు’ అనే హీబ్రూ పదబంధానికి ఈ సందర్భంలో సహజమైన తెలుగు సమానార్థకం; ప్రవేశ దిశను בֵּית తో కూడిన క్రియ నిర్మాణం తెలియజేస్తుంది.
theological_decisions:
- issue: ప్రతిష్ఠిత వస్తువుల స్వరూపం
  choice: ప్రతిష్ఠించిన కానుకలు
  alternative: పవిత్ర వస్తువులు
  rationale: వస్తువులు దేవునికి అంకితం చేయబడినవనే భావాన్ని తెలియజేస్తుంది; వాటి నిర్దిష్ట ఆచారపరమైన స్థితి గురించి మూలపాఠం చెప్పనిదాన్ని అదనంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని సమాంతర నిర్మాణాన్ని నిలుపుతూ, చివరి జాబితా రెండు సమర్పణలలోని వస్తువులను వివరిస్తున్నట్లు డాష్‌లతో స్పష్టం చేయబడింది.
