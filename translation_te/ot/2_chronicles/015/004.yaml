id: 2CH.15.4
reference: 2 Chronicles 15:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֨שָׁב֙ בַּ/צַּר ל֔/וֹ עַל יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יְבַקְשֻׁ֖/הוּ וַ/יִּמָּצֵ֥א לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/004.yaml
  text: But in their distress they returned to Yahweh[a], the God of Israel, and sought him[b], and he was found by them.
translation:
  language: te
  text: అయితే తమ కష్టంలో[a] వారు ఇశ్రాయేలు దేవుడైన యహ్వే వైపు తిరిగి, ఆయనను వెదికారు; ఆయన వారికి దొరికాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో, “అతని కష్టంలో” అని ఏకవచనం ఉంది; అది ఇశ్రాయేలును సమష్టిగా సూచిస్తుంది.
    reason: collective_singular
  - marker: b
    text: లేదా, “ఆయన తన్ను వారికి కనుగొననిచ్చాడు” అని అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: తిరిగి
  rationale: שׁוּב ఇక్కడ దేవుని వైపు మళ్లీ తిరగడాన్ని సూచిస్తుంది. ‘తిరిగి’ అనేది పునరాగమన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בַּצַּר לוֹ
  choice: తమ కష్టంలో
  rationale: צַר అంటే ఇక్కడ ఇరుకు స్థలం కాదు, కష్టం లేదా ఆపద. హీబ్రూలో ఏకవచన ప్రత్యయం ఉన్నా, తరువాతి బహువచన రూపాల దృష్ట్యా అది ఇశ్రాయేలును సమష్టిగా సూచిస్తుంది; ఆ వ్యాకరణ ఉద్రిక్తతను పాదసూచికలో నిలిపాం.
- source_word: עַל יְהוָה
  choice: యహ్వే వైపు
  rationale: שׁוּב తో కూడిన עַל దేవుని వైపు తిరగడాన్ని సూచిస్తుంది. ‘వైపు’ దిశాత్మకమైనదీ, సంబంధపరమైనదీ అయిన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన יהוה ను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు లిపిలో వ్యక్తినామంగా లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని సహజమైన తెలుగులో నేరుగా నిలిపే రూపం.
- source_word: וַיְבַקְשֻׁהוּ
  choice: ఆయనను వెదికారు
  rationale: בקשׁ వ్యక్తిని కర్మగా తీసుకున్నప్పుడు ‘వెదకడం’ అని అర్థం; ఇక్కడ దేవుని ఆశ్రయించి ఆయనను కోరడమనే సందర్భార్థం ఉంది.
- source_word: וַיִּמָּצֵא לָהֶם
  choice: ఆయన వారికి దొరికాడు
  rationale: מצא నిఫాల్ రూపంలోని ప్రత్యక్ష నిష్క్రియార్థాన్ని ‘దొరికాడు’ సహజంగా అందిస్తుంది. దైవిక అనుమతిని స్పష్టంగా చేర్చకుండా మూలంలోని సంక్షిప్తతను కాపాడాం; సాధ్యమైన అనుమతిసూచక భావాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: ప్రారంభ వాక్యభాగంలోని ఏకవచన–బహువచన మార్పు
  choice: ప్రధాన పాఠ్యంలో ఇశ్రాయేలును సూచించే సహజ బహువచనంగా ‘తమ… వారు’
  alternative: ‘తన కష్టంలో అతడు తిరిగాడు’ అనే రూపనిష్ఠ ఏకవచనం
  rationale: హీబ్రూ ప్రారంభంలో ఏకవచనం వాడి, వెంటనే బహువచనానికి మారుతుంది. సందర్భంలో ఇశ్రాయేలు సమూహమే ఉద్దేశం; తెలుగులో ప్రధాన పాఠ్యాన్ని సహజంగా ఉంచి, మూలంలోని ఏకవచనాన్ని పాదసూచికలో తెలియజేశాం.
- issue: וַיִּמָּצֵא לָהֶם లో దేవుని స్పందన మరియు నిష్క్రియ రూపం
  choice: ‘ఆయన వారికి దొరికాడు’
  alternative: ‘ఆయన తన్ను వారికి కనుగొననిచ్చాడు’
  rationale: హీబ్రూ నిఫాల్ రూపం సాదా నిష్క్రియార్థాన్నీ, సందర్భానుసారంగా అనుమతిసూచక భావాన్నీ మోయగలదు. ప్రధాన పాఠ్యంలో అదనపు దైవిక కార్యసూచనను చేర్చకుండా నిజమైన అస్పష్టతను కాపాడి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. దైవనామాన్ని ‘యహ్వే’గా నిలిపాం. పొడవైన సంధి నిర్మాణాన్ని అర్ధవిరామంతో విభజించి హీబ్రూ వాక్యప్రవాహాన్ని చదవదగిన తెలుగులో అందించాం.
