id: 2CH.15.11
reference: 2 Chronicles 15:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּזְבְּח֤וּ לַ/יהוָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא מִן הַ/שָּׁלָ֖ל הֵבִ֑יאוּ בָּקָר֙ שְׁבַ֣ע מֵא֔וֹת וְ/צֹ֖אן שִׁבְעַ֥ת אֲלָפִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/011.yaml
  text: 'On that day they sacrificed to Yahweh from the spoil they had brought: seven hundred cattle and seven thousand sheep[a][b].'
translation:
  language: te
  text: 'ఆ రోజున వారు తాము తీసుకువచ్చిన యుద్ధ దోపిడిలోనుండి యాహ్వేకు బలులు అర్పించారు: ఏడు వందల పెద్ద పశువులను, ఏడు వేల గొర్రెలను[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “గొర్రెలు” అని అనువదించిన హీబ్రూ పదం గొర్రెలను, మేకలను వంటి చిన్న మందజంతువులను విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבְּחוּ
  choice: బలులు అర్పించారు
  rationale: זבח ఆరాధన సంబంధ సందర్భంలో జంతుబలులు అర్పించడాన్ని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం బలి క్రియను సహజంగా, గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: ל అనే ఉపసర్గ బలి ఎవరికి అర్పించబడిందో సూచిస్తుంది; יהוה అనే దైవనామాన్ని తెలుగులో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: హీబ్రూ కాలసూచక పదబంధానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: מִן הַשָּׁלָל
  choice: యుద్ధదోపిడిలోనుండి
  rationale: שָׁלָל యుద్ధంలో స్వాధీనం చేసుకున్న సొత్తును సూచిస్తుంది. ‘యుద్ధదోపిడి’ సందర్భాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: הֵבִיאוּ
  choice: తాము తీసుకొచ్చిన
  rationale: ఇప్పటికే తీసుకొచ్చిన దోపిడిని ఈ క్రియ సూచిస్తుంది; తెలుగు సంబంధవాచక నిర్మాణం సంఘటనల క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בָּקָר
  choice: పశువులను
  rationale: בָּקָר సమూహార్థకంగా గోవుల జాతి పశువులను సూచిస్తుంది. ‘పశువులు’ సాధారణ పాఠకులకు సహజమైన పదం; సంఖ్యతో కూడిన సందర్భం దాని జంతువుల అర్థాన్ని స్పష్టం చేస్తుంది.
- source_word: וְצֹאן
  choice: గొర్రెలను
  rationale: צֹאן చిన్న మందజంతువులను, గొర్రెలతో పాటు మేకలను కూడా సూచించగలదు. ప్రధాన పాఠ్యంలో సహజమైన ‘గొర్రెలు’ను వాడి, విస్తృత అర్థాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠ్యంలో ఒడంబడిక దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపమైన ‘యెహోవా’గా ఇచ్చాం; ‘యాహ్వే’ మూల ఉచ్చారణకు సమీపమైన ప్రత్యామ్నాయ లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ఆరాధన సందర్భానికి తగిన గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యక్రమాన్ని బలవంతంగా అనుసరించకుండా, తీసుకొచ్చిన యుద్ధదోపిడిలోనుండే జంతువులను బలిగా అర్పించారనే సంబంధాన్ని స్పష్టంగా ఉంచాం.
