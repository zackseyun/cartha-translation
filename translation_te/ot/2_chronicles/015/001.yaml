translation:
  language: te
  text: దేవుని ఆత్మ ఓదేదు కుమారుడైన అజర్యా మీదికి వచ్చింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని ఆత్మ ఓదేదు కుమారుడైన అజర్యాపై ఉండింది.”
    reason: הָיְתָה עָלָיו అనే హీబ్రూ పదబంధానికి సాధ్యమైన స్థితి-భావ అక్షరార్థ ప్రత్యామ్నాయాన్ని కాపాడటం.
lexical_decisions:
- source_word: וַ/עֲזַרְיָהוּ
  choice: అజర్యా
  rationale: వావ్ కథన ప్రవాహాన్ని కొనసాగిస్తుంది; తెలుగులో ప్రత్యేక సంధానపదం లేకుండానే సహజంగా వ్యక్తమవుతుంది. పేరును హీబ్రూ రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן עוֹדֵד
  choice: ఓదేదుకు కుమారుడైన
  rationale: ఇక్కడ בֶּן సాధారణంగా ప్రత్యక్ష పుత్ర సంబంధాన్నే సూచిస్తుంది; עוֹדֵד అనే పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: הָיְתָה עָלָיו
  choice: మీదికి వచ్చింది
  rationale: అక్షరార్థంగా ‘అతని మీద ఉంది/అయింది.’ ప్రవచన ప్రేరణను పరిచయం చేసే ఈ సందర్భంలో సంఘటనాత్మక భావాన్ని సహజ తెలుగులో ‘మీదికి వచ్చింది’ అని వ్యక్తం చేశాం; స్థితి భావం కూడా సాధ్యమని పాదటిప్పణిలో ఉంచాం.
- source_word: רוּחַ אֱלֹהִים
  choice: దేవుని ఆత్మ
  rationale: నిర్మాణబద్ధమైన హీబ్రూ పదబంధం ఈ ప్రవచన సందర్భంలో దేవునికి చెందిన ఆత్మను సూచిస్తుంది. తెలుగు బైబిలు శైలిలో సహజమైన, నిర్దిష్ట భావమున్న రూపం ‘దేవుని ఆత్మ.’
theological_decisions:
- issue: רוּחַ אֱלֹהִים ను వ్యక్తిగత/దైవ సంబంధ భావంతో అనువదించాలా, లేక ‘దేవుని నుండి వచ్చిన ఒక ఆత్మ’గా అనువదించాలా
  choice: దేవుని ఆత్మ
  alternative: దేవుని నుండి వచ్చిన ఒక ఆత్మ
  rationale: దినవృత్తాంతాల గ్రంథంలోని ఈ సూత్రవాక్యం ప్రవచన ప్రేరణను సూచిస్తుంది. ‘దేవుని ఆత్మ’ అనే అనువాదం హీబ్రూ సంబంధ నిర్మాణాన్ని, సందర్భంలోని నిర్దిష్ట భావాన్ని కాపాడుతుంది; పాఠ్యానికి మించిన సిద్ధాంత వివరణను జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘మీదికి వచ్చింది’ ప్రవచన సందర్భంలోని సంఘటనాత్మక భావాన్ని తెలియజేస్తుంది; ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోతుంది.
