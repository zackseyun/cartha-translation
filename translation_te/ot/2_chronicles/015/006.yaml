id: 2CH.15.6
reference: 2 Chronicles 15:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כֻתְּת֥וּ גוֹי בְּ/ג֖וֹי וְ/עִ֣יר בְּ/עִ֑יר כִּֽי אֱלֹהִ֥ים הֲמָמָ֖/ם בְּ/כָל צָרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/006.yaml
  text: Nation was crushed by nation[a], and city by city, for God troubled them with every kind of distress.
translation:
  language: te
  text: ఒక జనము మరొక జనముచేత నలిపివేయబడింది, ఒక పట్టణము మరొక పట్టణముచేత నలిపివేయబడింది; ఎందుకంటే దేవుడు అన్ని రకాల కష్టాలతో వారిని కలవరపరిచాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకంటే దేవుడు అన్ని రకాల కష్టాలతో వారిని గందరగోళంలో పడేశాడు.”
    reason: హֲמָמָם అనే పదం కలవరపరచడం మాత్రమే కాక, గందరగోళం లేదా భయాందోళనలో పడేయడం అనే భావాన్నీ ఇవ్వగలదు.
lexical_decisions:
- source_word: וְכֻתְּתוּ
  choice: నలగగొట్టబడింది
  rationale: כתת యొక్క పుయల్ రూపం బలంగా పగులగొట్టబడటం లేదా నలగగొట్టబడటం అనే భావాన్ని ఇస్తుంది. తరువాతి ఏకవచన సమూహపదాలకు అనుగుణంగా తెలుగులో ఏకవచన క్రియను వాడాం.
- source_word: גוֹי בְּגוֹי
  choice: జనము జనముచేత
  rationale: ב ఇక్కడ ఒక జనము మరొక జనముపై చేసిన శత్రుత్వ చర్యను సూచిస్తుంది. ‘చేత’ విధ్వంసానికి కర్తృసాధన సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְעִיר בְּעִיר
  choice: పట్టణము పట్టణముచేత
  rationale: ముందటి పదబంధానికి సమాంతరంగా, ఒక పట్టణం మరొక పట్టణం చేత నాశనం కావడాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందు చెప్పిన విధ్వంసానికి కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపం బహువచనంగా కనిపించినా, ఏకవచన క్రియతో ఈ సందర్భంలో ఏకైక దేవుణ్ణే సూచిస్తుంది.
- source_word: הֲמָמָם
  choice: వారిని కలవరపరిచాడు
  rationale: המם కల్లోలం, గందరగోళం లేదా భయాందోళన కలిగించడం అనే భావాన్ని కలిగి ఉంది. ‘కలవరపరిచాడు’ ఈ భావపరిధిని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది; కర్మ ప్రత్యయాన్ని ‘వారిని’గా నిలుపుతుంది.
- source_word: בְּכָל צָרָה
  choice: అన్ని విధాల కష్టాలతో
  rationale: ב సాధనార్థకంగా, כָּל సమగ్రతను సూచిస్తున్నాయి. ఈ పదబంధం అనేక రకాల బాధాకర పరిస్థితుల ద్వారా కలవరపరచడాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: విపత్తులకు దేవుని క్రియాశీల కర్తృత్వం
  choice: దేవుడు ... వారిని కలవరపరిచాడు
  alternative: దేవుడు వారు కష్టాల్లో పడడానికి అనుమతించాడు
  rationale: హీబ్రూలో దేవుడే సకర్మక ఏకవచన క్రియకు స్పష్టమైన కర్త. కాబట్టి దైవకార్యాన్ని కేవలం అనుమతిగా మృదువుపరచకుండా, అదనపు సిద్ధాంత వివరణను కూడా చేర్చకుండా మూలంలోని ఉత్కంఠను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘జనము’, ‘పట్టణము’ అనే సమూహ ఏకవచనాలను ఉంచి హీబ్రూ సమాంతర నిర్మాణాన్ని సాధ్యమైనంతవరకు కాపాడాం; హింసాత్మక భావాన్ని ‘నలగగొట్టబడింది’తో స్పష్టంగా నిలిపాం.
