id: 2CH.15.3
reference: 2 Chronicles 15:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יָמִ֥ים רַבִּ֖ים לְ/יִשְׂרָאֵ֑ל לְ/לֹ֣א אֱלֹהֵ֣י אֱמֶ֗ת וּ/לְ/לֹ֛א כֹּהֵ֥ן מוֹרֶ֖ה וּ/לְ/לֹ֥א תוֹרָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/003.yaml
  text: For many days Israel was without the true God[a], without a teaching priest[b], and without the law.
translation:
  language: te
  text: చాలా కాలం ఇశ్రాయేలు నిజమైన దేవుడు లేకుండా[a], బోధించే యాజకుడు లేకుండా, ఉపదేశం లేకుండా[b] ఉండింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సత్యపు దేవుడు’ లేదా ‘సత్యవంతుడైన దేవుడు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ధర్మశాస్త్రం’ లేదా ‘బోధ.’ హీబ్రూ తోరా అనే పదం సందర్భానుసారం ‘ఉపదేశం,’ ‘బోధ,’ లేదా ‘ధర్మశాస్త్రం’ అని అర్థమివ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָמִים רַבִּים
  choice: చాలా కాలం
  rationale: ‘అనేక దినాలు’ అనే హీబ్రూ కాలవ్యవధి భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ఆరంభ సంధికారకాన్ని తెలుగు వాక్యప్రవాహంలో ప్రత్యేకంగా అనువదించాల్సిన అవసరం లేదు.
- source_word: לְיִשְׂרָאֵל
  choice: ఇశ్రాయేలు ... ఉండింది
  rationale: לְ ఇక్కడ సంబంధం లేదా స్థితిని సూచిస్తుంది. ఇశ్రాయేలును సమష్టి ఏకవచనంగా తీసుకొని తెలుగులో అవసరమైన అస్తిత్వ క్రియను చేర్చాం.
- source_word: לְלֹא אֱלֹהֵי אֱמֶת
  choice: నిజమైన దేవుడు లేకుండా
  rationale: לְלֹא అంటే ‘లేకుండా’. אֱלֹהֵי אֱמֶת అక్షరార్థంగా ‘సత్యపు దేవుడు’; సందర్భంలో ‘నిజమైన దేవుడు’ సహజంగా ఉండి, అసత్య ఆరాధనతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: כֹּהֵן מוֹרֶה
  choice: బోధించే యాజకుడు
  rationale: מוֹרֶה అనేది ‘బోధించు/ఉపదేశించు’ అనే కొనసాగుతున్న విధిని తెలిపే కృదంతం. ‘బోధించే యాజకుడు’ తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: תּוֹרָה
  choice: ఉపదేశం
  rationale: תּוֹרָה అనే పదానికి ఉపదేశం, బోధ, ధర్మశాస్త్రం అనే అర్థపరిధి ఉంది. యాజకుని బోధనా పాత్రతో ఉన్న ఈ సందర్భంలో ‘ఉపదేశం’ దాని విస్తృత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: אֱלֹהֵי אֱמֶת యొక్క నిర్దిష్టత మరియు భావం
  choice: నిజమైన దేవుడు
  alternative: సత్యపు దేవుడు / సత్యవంతుడైన దేవుడు
  rationale: సందర్భం సాధారణంగా ఏదో ఒక దేవుని గురించి కాక, ఇశ్రాయేలు సంబంధంలో నిజమైన దేవుని గురించే మాట్లాడుతోంది. అయినప్పటికీ హీబ్రూ నిర్మాణంలోని ‘సత్యపు/సత్యవంతుడైన’ భావాన్ని పాదసూచికలో ఉంచాం.
- issue: תּוֹרָה అనువాదం
  choice: ఉపదేశం
  alternative: ధర్మశాస్త్రం / బోధ
  rationale: ఈ హీబ్రూ పదాన్ని కేవలం చట్టసంకేతానికి పరిమితం చేయకుండా దాని విస్తృత బోధనా భావాన్ని ప్రధాన పాఠ్యంలో నిలిపాం; సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘ఇశ్రాయేలు’ను హీబ్రూ వాక్యంలాగే సమష్టి ఏకవచనంగా ఉంచాం. పునరావృతమైన ‘లేకుండా’ నిర్మాణం మూలంలోని మూడు సమాంతర లోపస్థితులను స్పష్టంగా ప్రతిబింబిస్తుంది.
