  text: וְ/כִ/שְׁמֹ֨עַ אָסָ֜א הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה וְ/הַ/נְּבוּאָה֮ עֹדֵ֣ד הַ/נָּבִיא֒ הִתְחַזַּ֗ק וַ/יַּעֲבֵ֤ר הַ/שִּׁקּוּצִים֙ מִ/כָּל אֶ֤רֶץ יְהוּדָה֙ וּ/בִנְיָמִ֔ן וּ/מִן הֶ֣/עָרִ֔ים אֲשֶׁ֥ר לָכַ֖ד מֵ/הַ֣ר אֶפְרָ֑יִם וַ/יְחַדֵּשׁ֙ אֶת מִזְבַּ֣ח יְהוָ֔ה אֲשֶׁ֕ר לִ/פְנֵ֖י אוּלָ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/008.yaml
  text: And when Asa heard these words and the prophecy of Oded the prophet[a], he took courage and removed the detestable things from all the land of Judah and Benjamin, and from the cities that he had captured in the hill country of Ephraim; and he renewed the altar of Yahweh that was before the vestibule of Yahweh.
translation:
  language: te
  text: ఆసా ఈ మాటలను, ప్రవక్త ఓదేదు ప్రవచనాన్ని[a] విన్నప్పుడు ధైర్యం పొందాడు; యూదా, బెన్యామీను దేశమంతటినుండి, ఎఫ్రాయిము కొండప్రాంతంలో తాను స్వాధీనం చేసుకున్న పట్టణాలనుండి అసహ్యకరమైన వాటిని తొలగించాడు. యాహ్వే మంటపం ఎదుట ఉన్న యాహ్వే బలిపీఠాన్ని పునరుద్ధరించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ పాఠం: “ప్రవక్త ఓదేదు ప్రవచనం.” చుట్టుపక్కల సందర్భంలో ఓదేదు కుమారుడైన అజర్యా ప్రస్తావించబడినందున, కొందరు వ్యాఖ్యాతలు మరియు పాఠవిమర్శకులు ఈ మాటలను అతనితో అనుసంధానిస్తారు.'
    reason: textual_variant
lexical_decisions:
- source_word: וְכִשְׁמֹעַ
  choice: విన్నప్పుడు
  rationale: ఉపసర్గతో కూడిన infinitive construct కాలసంబంధ ఉపవాక్యాన్ని సూచిస్తుంది; ‘విన్నప్పుడు’ సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలను
  rationale: సందర్భంలో ఇది ఆసా విన్న ప్రవచన ప్రసంగాన్ని సూచిస్తుంది; అందువల్ల ‘మాటలు’ అనేది ‘విషయాలు’ కంటే తగినది.
- source_word: וְהַנְּבוּאָה
  choice: ప్రవచనాన్ని
  rationale: נְבוּאָה యొక్క ప్రత్యక్ష భావాన్ని నిలుపుతూ ప్రవక్త ద్వారా వచ్చిన సందేశాన్ని సూచిస్తుంది.
- source_word: עֹדֵד הַנָּבִיא
  choice: ప్రవక్తయైన ఓదేదు
  rationale: మసొరెటిక్ పాఠంలోని పేరును యథాతథంగా అనువదించాం; చుట్టుపక్కల సందర్భంతో ఉన్న ఉద్రిక్తతను పాదసూచికలో ఉంచాం.
- source_word: הִתְחַזַּק
  choice: ధైర్యం తెచ్చుకొని
  rationale: Hitpael రూపంలోని తనను తాను బలపరచుకోవడం లేదా ప్రోత్సాహం పొందడం అనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיַּעֲבֵר הַשִּׁקּוּצִים
  choice: అసహ్యమైన విగ్రహాలను తొలగించాడు
  rationale: שִׁקּוּצִים ఇక్కడ విగ్రహారాధనకు సంబంధించిన హేయ వస్తువులను సూచిస్తుంది. ‘విగ్రహాలు’ సందర్భార్థాన్ని స్పష్టం చేస్తుంది; ‘అసహ్యమైన’ మూలపదంలోని మూల్యాంకనాన్ని నిలుపుతుంది.
- source_word: מִכָּל אֶרֶץ יְהוּדָה וּבִנְיָמִן
  choice: యూదా, బెన్యామీను ప్రాంతాలన్నిటి నుండీ
  rationale: אֶרֶץ ఇక్కడ రాజకీయ-భౌగోళిక భూభాగాన్ని సూచిస్తుంది; ‘ప్రాంతాలు’ తెలుగులో సహజంగా ఉంది.
- source_word: וּמִן הֶעָרִים אֲשֶׁר לָכַד מֵהַר אֶפְרָיִם
  choice: ఎఫ్రాయిము కొండప్రాంతంలో తాను స్వాధీనం చేసుకున్న పట్టణాల నుండీ
  rationale: לכד కు ‘స్వాధీనం చేసుకున్న’ అని, מֵהַר אֶפְרָיִם కు సందర్భానుసారంగా భౌగోళిక స్థలార్థంలో ‘ఎఫ్రాయిము కొండప్రాంతంలో’ అని అనువదించాం.
- source_word: וַיְחַדֵּשׁ
  choice: పునరుద్ధరించాడు
  rationale: Piel రూపం కొత్తగా చేయడం లేదా తిరిగి సరిచేయడం అనే విస్తృత భావాన్ని ఇస్తుంది; ‘పునరుద్ధరించాడు’ కేవలం మరమ్మతుకే పరిమితం చేయదు.
- source_word: מִזְבַּח יְהוָה
  choice: యెహోవా బలిపీఠాన్ని
  rationale: Construct సంబంధాన్ని సహజ తెలుగులో నేరుగా వ్యక్తం చేసింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన వ్యక్తినామ రూపంగా ఇచ్చాం.
- source_word: אֲשֶׁר לִפְנֵי אוּלָם יְהוָה
  choice: యెహోవా ఆలయ మంటపం ఎదుట ఉన్న
  rationale: אוּלָם ఆలయ ప్రవేశ మంటపాన్ని సూచిస్తుంది. ‘ఆలయ మంటపం’ సాధారణ పాఠకునికి స్పష్టంగా ఉండగా, לִפְנֵי యొక్క స్థలసంబంధాన్ని ‘ఎదుట’ నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: హీబ్రూ మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో నిలిపాం.
- issue: ‘ఓదేదు ప్రవక్త’ అనే పాఠానికి చుట్టుపక్కల సందర్భంతో ఉన్న ఉద్రిక్తత
  choice: మసొరెటిక్ పాఠం ప్రకారం ‘ప్రవక్తయైన ఓదేదు’
  alternative: చుట్టుపక్కల సందర్భానికి అనుగుణంగా ‘ఓదేదు కుమారుడైన అజర్యా’ అని సమన్వయపరచడం
  rationale: అందించిన WLC పాఠం עֹדֵד הַנָּבִיא అని ఉంది. సందర్భాన్ని బట్టి మూలపాఠాన్ని మౌనంగా మార్చకుండా, ప్రత్యామ్నాయ అవగాహనను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘ఆలయ మంటపం,’ ‘పునరుద్ధరించాడు’ వంటి పదాలు నిర్మాణాత్మక, ఆరాధనా సందర్భాన్ని స్పష్టంగా ఉంచుతాయి. మూలపాఠంలోని క్రమాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగు వాక్యప్రవాహం కోసం రెండు వాక్యాలుగా విభజించాం.
