id: 2CH.16.14
reference: 2 Chronicles 16:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְבְּרֻ֣/הוּ בְ/קִבְרֹתָ֗י/ו אֲשֶׁ֣ר כָּֽרָה ל/וֹ֮ בְּ/עִ֣יר דָּוִיד֒ וַ/יַּשְׁכִּיבֻ֗/הוּ בַּ/מִּשְׁכָּב֙ אֲשֶׁ֤ר מִלֵּא֙ בְּשָׂמִ֣ים וּ/זְנִ֔ים מְרֻקָּחִ֖ים בְּ/מִרְקַ֣חַת מַעֲשֶׂ֑ה וַ/יִּשְׂרְפוּ ל֥/וֹ שְׂרֵפָ֖ה גְּדוֹלָ֥ה עַד לִ/מְאֹֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/014.yaml
  text: They buried him in his tomb[a], which he had cut out for himself in the City of David, and laid him on the bier that had been filled with spices and various blended ointments prepared by a perfumer’s craft[b]; and they made a very great burning for him.
translation:
  language: te
  text: దావీదు నగరంలో అతడు తనకోసం తవ్వించిన సమాధులలో[a] వారు అతణ్ణి పాతిపెట్టారు. సుగంధ ద్రవ్యాలతోను, పరిమళ ద్రవ్యాలను తయారుచేసేవారి నైపుణ్యంతో కలిపిన వివిధ సువాసన పదార్థాలతోను నింపిన శయ్యపై అతణ్ణి ఉంచారు. వారు అతని కోసం అతి గొప్ప దహనం చేశారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అతని సమాధులలో’ అని బహువచన రూపం ఉంది; ఇది ఒక రాజసమాధుల సముదాయాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘అతని కోసం గొప్ప దహనం చేశారు’ అనే హీబ్రూ మాట, అంత్యక్రియలలో అతని గౌరవార్థం సుగంధ ద్రవ్యాలు లేదా పరిమళ పదార్థాలను దహనం చేయడాన్ని సూచించవచ్చు; అతని శరీరాన్నే దహనం చేశారని ఇది తప్పనిసరిగా చెప్పదు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְבְּרֻהוּ
  choice: వారు అతణ్ణి పాతిపెట్టారు
  rationale: קבר అనే క్రియ యొక్క సాధారణ అంత్యక్రియల అర్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בְקִבְרֹתָיו
  choice: అతని సమాధిలో
  rationale: హీబ్రూలో రూపం బహువచనమైనప్పటికీ, సందర్భంలో రాజసమాధి లేదా సమాధుల సముదాయంలోని అతని సమాధిని సూచిస్తుంది; తెలుగు ప్రధాన పాఠ్యంలో ఏకవచనం సహజంగా ఉంటుంది, రూపభేదాన్ని పాదసూచికలో నిలిపాం.
- source_word: אֲשֶׁר כָּרָה לוֹ
  choice: అతడు తన కోసం తొలిపించుకున్న
  rationale: כּרה అంటే తవ్వడం లేదా తొలచడం; రాతి సమాధి సందర్భంలో ‘తొలిపించుకున్న’ సహజంగా ఉండి, అతడు స్వయంగా పని చేశాడని అవసరం లేకుండా అతని ఏర్పాటును తెలియజేస్తుంది.
- source_word: בְּעִיר דָּוִיד
  choice: దావీదు నగరంలో
  rationale: స్థిరమైన స్థలనామాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: וַיַּשְׁכִּיבֻהוּ
  choice: అతణ్ణి ఉంచారు
  rationale: హిఫిల్ రూపంలోని ‘పడుకోబెట్టారు’ అనే భావాన్ని అంత్యక్రియల సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: בַּמִּשְׁכָּב
  choice: శయ్యపై
  rationale: מִשְׁכָּב అనేది పడుకునే స్థలం, మంచం లేదా శయ్యను సూచిస్తుంది. అంత్యక్రియల సందర్భాన్ని గౌరవభరితంగా ఉంచుతూ, ‘పాడె’ అని అతిగా నిర్దిష్టం చేయకుండా ‘శయ్య’ మూలంలోని అస్పష్టతను కాపాడుతుంది.
- source_word: אֲשֶׁר מִלֵּא
  choice: నింపిన
  rationale: హీబ్రూ క్రియకు కర్త స్పష్టంగా లేకపోవడంతో, తెలుగు సంబంధక్రియ రూపం ఫలితస్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: בְּשָׂמִים
  choice: సుగంధ ద్రవ్యాలతో
  rationale: సువాసనగల మసాలాలు లేదా పరిమళ పదార్థాలను సూచించే విస్తృతమైన, పాఠకులకు అర్థమయ్యే పదబంధం.
- source_word: וּזְנִים
  choice: రకరకాల సుగంధ పదార్థాలతో
  rationale: అరుదైన పదం; రకాలు లేదా వివిధ పరిమళ మిశ్రమాలు అనే సంభావ్య భావాన్ని అతిగా నిర్దిష్టం చేయకుండా అందిస్తుంది.
- source_word: מְרֻקָּחִים בְּמִרְקַחַת מַעֲשֶׂה
  choice: పరిమళ ద్రవ్యాలను తయారుచేసేవారి నైపుణ్యంతో మిశ్రమం చేసిన
  rationale: רקח మూలంలోని పరిమళ ద్రవ్యాల సమ్మేళనం మరియు నిపుణుడి పనితనం రెండింటినీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּשְׂרְפוּ לוֹ שְׂרֵפָה גְּדוֹלָה עַד לִמְאֹד
  choice: అతని గౌరవార్థం వారు అతి గొప్ప దహనం చేశారు
  rationale: ‘అతని కోసం’ అనే గౌరవసూచక భావాన్ని తెలిపి, దహనానికి గురైన పదార్థం ఏమిటో ప్రధాన పాఠ్యంలో నిర్ణయించదు; מְאֹד యొక్క తీవ్రతను ‘అతి గొప్ప’గా నిలుపుతుంది.
theological_decisions:
- issue: అంత్యక్రియల దహనం యొక్క స్వరూపం
  choice: ఆసా గౌరవార్థం చేసిన గొప్ప దహనంగా అనువదించడం; శరీర దహనం అని నిర్ధారించకపోవడం
  alternative: ఆసా శరీరాన్ని దహనం చేశారని అనువదించడం
  rationale: వచనం ముందుగా అతణ్ణి పాతిపెట్టారని చెబుతుంది; తరువాత ‘అతని కోసం దహనం చేశారు’ అనే హీబ్రూ ప్రయోగం వస్తుంది. ఇది సుగంధ ద్రవ్యాలు లేదా ఇతర పదార్థాల గౌరవార్థ దహనాన్ని సూచించవచ్చు. కాబట్టి ప్రధాన పాఠ్యం దహనం అనే పదాన్ని నిలిపి, వస్తువును నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కథన శైలి. అరుదైన అంత్యక్రియల పదాలకు అతి సాంకేతిక భాషను నివారించి, ‘శయ్య’, ‘సుగంధ పదార్థాలు’, ‘దహనం’ వంటి స్పష్టమైన పదాలు వాడబడ్డాయి; మూలంలోని అస్పష్టత పాదసూచికలతో కాపాడబడింది.
