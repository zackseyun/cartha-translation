revisions:
- from: దావీదు నగరంలో అతడు తన కోసం తొలిపించుకున్న సమాధిలో[a] వారు అతణ్ణి పాతిపెట్టారు. సుగంధ ద్రవ్యాలతో, పరిమళ ద్రవ్యాలను తయారుచేసేవారి నైపుణ్యంతో మిశ్రమం చేసిన రకరకాల సుగంధ పదార్థాలతో నింపిన శయ్యపై అతణ్ణి ఉంచారు. అతని గౌరవార్థం వారు అతి గొప్ప దహనం చేశారు.[b]
