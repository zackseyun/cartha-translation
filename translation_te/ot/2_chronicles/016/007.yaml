source:
  edition: WLC
  text: וּ/בָ/עֵ֣ת הַ/הִ֗יא בָּ֚א חֲנָ֣נִי הָ/רֹאֶ֔ה אֶל אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יֹּ֣אמֶר אֵלָ֗י/ו בְּ/הִשָּׁ֨עֶנְ/ךָ֜ עַל מֶ֤לֶךְ אֲרָם֙ וְ/לֹ֤א נִשְׁעַ֨נְתָּ֙ עַל יְהוָ֣ה אֱלֹהֶ֔י/ךָ עַל כֵּ֗ן נִמְלַ֛ט חֵ֥יל מֶֽלֶךְ אֲרָ֖ם מִ/יָּדֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/007.yaml
  text: At that time Hanani the seer came to Asa king of Judah and said to him[a], “Because you relied on the king of Aram and did not rely on Yahweh your God, therefore the army of the king of Aram has escaped from your hand.”
translation:
  language: te
  text: 'ఆ సమయంలో దర్శి హనానీ యూదా రాజైన ఆసా దగ్గరికి వచ్చి అతనితో ఇలా అన్నాడు: “నీవు అరాము[a] రాజుపై ఆధారపడి, నీ దేవుడైన యాహ్వేపై ఆధారపడలేదు కాబట్టి, అరాము రాజు సైన్యం నీ చేతిలోనుండి తప్పించుకుంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సిరియా.” హెబ్రీ పాఠ్యంలో “అరాము” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָעֵת הַהִיא
  choice: ఆ సమయంలో
  rationale: సహజమైన ఆధునిక తెలుగు కాలసూచన; ఆరంభ సంధికారకాన్ని ప్రత్యేకంగా అనువదించకపోయినా కథన సంబంధం నిలుస్తుంది.
- source_word: חֲנָנִי הָרֹאֶה
  choice: దీర్ఘదర్శి హనానీ
  rationale: హనానీ అనే పేరును లిప్యంతరీకరించి, רֹאֶה అనే ప్రత్యేక ప్రవచన హోదాను సాధారణ ‘ప్రవక్త’గా కలిపివేయకుండా ‘దీర్ఘదర్శి’గా నిలిపింది.
- source_word: אָסָא מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన ఆసా
  rationale: పేరు, రాజహోదా రెండింటినీ సహజ తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: בְּהִשָּׁעֶנְךָ ... וְלֹא נִשְׁעַנְתָּ
  choice: ఆధారపడ్డావు ... ఆధారపడకుండా
  rationale: రాజకీయ, ఆధ్యాత్మిక నమ్మకాన్ని స్పష్టంగా తెలిపే ఒకే తెలుగు క్రియను రెండు చోట్ల వాడి హెబ్రీ పునరుక్తిని నిలిపింది.
- source_word: מֶלֶךְ אֲרָם
  choice: అరాము రాజు
  rationale: హెబ్రీలోని భౌగోళిక-జాతి పేరైన అరామును నేరుగా నిలిపింది; తరువాతి కాలపు ‘సిరియా’ను ప్రధాన పాఠ్యంలో పెట్టలేదు.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవా
  rationale: దైవనామం יהוהను వ్యక్తినామంగా ‘యెహోవా’ అని అందించి, ‘నీ దేవుడు’ అనే నిబంధనాత్మక సంబంధాన్ని నిలిపింది.
- source_word: עַל כֵּן
  choice: అందువల్ల
  rationale: ఆసా చేసిన నిర్ణయానికి వచ్చిన పరిణామాన్ని స్పష్టంగా సూచించే సహజ నిర్ధారణ పదం.
- source_word: נִמְלַט
  choice: తప్పించుకుంది
  rationale: పూర్తయినప్పటికీ ప్రస్తుతం ప్రాధాన్యం కలిగిన సైనిక తప్పించుకోవడాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: חֵיל מֶלֶךְ אֲרָם
  choice: అరాము రాజు సైన్యం
  rationale: חֵילకు ఈ సైనిక సందర్భంలో స్పష్టమైన ఆధునిక సమానార్థకం ‘సైన్యం’.
- source_word: מִיָּדֶךָ
  choice: నీ చేతిలోనుంచి
  rationale: అధికారం లేదా పట్టునుంచి తప్పించుకోవడం అనే హెబ్రీ రూపకాన్ని తెలుగులో అర్థమయ్యే విధంగా నిలిపింది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠ్యంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన లిప్యంతరీకరణను ఉపయోగించింది.
- issue: ఆసా వైఫల్యానికి ఫలితంగా అరాము సైన్యం తప్పించుకోవడం
  choice: కారణ-ఫలిత సంబంధాన్ని నేరుగా నిలిపింది
  alternative: దేవుడు సైన్యాన్ని తప్పించాడని స్పష్టీకరించడం
  rationale: మూలపాఠ్యం ‘అందువల్ల ... తప్పించుకుంది’ అని మాత్రమే చెబుతుంది; దైవక్రియను అదనంగా స్పష్టీకరించకుండా దాని వేదాంత ఉద్వేగాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన గ్రంథశైలిలో రూపొందించబడింది. ప్రవచన హోదా, దైవనామం, ‘చేతిలోనుంచి’ అనే మూలరూపకం సంరక్షించబడ్డాయి.
