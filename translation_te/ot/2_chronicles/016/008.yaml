id: 2CH.16.8
reference: 2 Chronicles 16:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ/לֹ֧א הַ/כּוּשִׁ֣ים וְ/הַ/לּוּבִ֗ים הָי֨וּ לְ/חַ֧יִל לָ/רֹ֛ב לְ/רֶ֥כֶב וּ/לְ/פָרָשִׁ֖ים לְ/הַרְבֵּ֣ה מְאֹ֑ד וּ/בְ/הִשָּֽׁעֶנְ/ךָ֥ עַל יְהוָ֖ה נְתָנָ֥/ם בְּ/יָדֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/008.yaml
  text: Were not the Cushites and the Lubites a very great army[a], with chariots and horsemen in great abundance? Yet when you relied on Yahweh, he gave them into your hand.
translation:
  language: te
  text: కూషీయులు, లూబీయులు అనేక రథాలూ గుర్రపు యోధులూ గల అత్యంత గొప్ప సైన్యంగా ఉండలేదా? అయినా నీవు యాహ్వే మీద ఆధారపడినప్పుడు, ఆయన వారిని నీ చేతికి అప్పగించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלֹא
  choice: ఉండలేదా?
  rationale: అవుననే జవాబును ఆశించే హీబ్రూ అలంకారప్రశ్నను సహజమైన తెలుగు ప్రశ్నారూపంలో నిలుపుతుంది.
- source_word: הַכּוּשִׁים וְהַלּוּבִים
  choice: కూషీయులు, లూబీయులు
  rationale: తర్వాతి కాలపు భౌగోళిక గుర్తింపులను నిశ్చయంగా రుద్దకుండా, మూలంలోని జాతినామాలను లిప్యంతరీకరించింది.
- source_word: הָיוּ לְחַיִל לָרֹב
  choice: మహా సైన్యంగా
  rationale: ఈ సందర్భంలో חַיִל సంపద లేదా శౌర్యం కంటే సైనిక బలగాన్ని సూచిస్తుంది; לָרֹב దాని గొప్ప పరిమాణాన్ని తెలియజేస్తుంది.
- source_word: לְרֶכֶב וּלְפָרָשִׁים לְהַרְבֵּה מְאֹד
  choice: రథాలతోను అత్యధిక సంఖ్యలో గుర్రపు దళంతోను కూడిన
  rationale: రథాలు, గుర్రపు యోధుల విస్తార సంఖ్య అనే సైనిక చిత్రాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּבְהִשָּׁעֶנְךָ עַל
  choice: అయినా నీవు ... మీద ఆధారపడినప్పుడు
  rationale: ‘ఆనుకోవడం’ అనే మూల రూపకంలోని నమ్మకం, ఆధారం భావాన్ని అందిస్తుంది; వాక్యంలోని వాదనాత్మక వ్యత్యాసాన్ని ‘అయినా’ సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన వ్యక్తినామ రూపంలో ఉంచింది.
- source_word: נְתָנָם בְּיָדֶךָ
  choice: వారిని నీ చేతికి అప్పగించాడు
  rationale: విరోధులపై విజయాన్ని ప్రసాదించడం అనే హీబ్రూ నుడికారాన్ని తెలుగులో అర్థమయ్యేలా, దాని ‘చేతి’ ప్రతిరూపాన్ని నిలుపుతూ అనువదించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. తెలుగులో సాధారణ పాఠకులకు పరిచితమైన ‘యెహోవా’ రూపాన్ని ప్రధాన పాఠంలో ఉంచి, పునర్నిర్మిత ఉచ్చారణ ‘యాహ్వే’ను పాదటిప్పణిలో తెలిపింది; ‘ప్రభువు’ అనే బిరుదుతో నామాన్ని భర్తీ చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. అలంకారప్రశ్న, వ్యత్యాసం, ‘నీ చేతికి’ అనే మూల నుడికారం నిలుపబడ్డాయి.
