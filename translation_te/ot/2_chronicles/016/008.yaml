revisions:
- from: కూషీయులు, లూబీయులు[a] రథాలతోను అత్యధిక సంఖ్యలో గుర్రపు దళంతోను కూడిన మహా సైన్యంగా ఉండలేదా? అయినా నీవు యెహోవా[b] మీద ఆధారపడినప్పుడు, ఆయన వారిని నీ చేతికి అప్పగించాడు.
