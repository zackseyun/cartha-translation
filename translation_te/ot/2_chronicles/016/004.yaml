translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని వరుస సైనిక చర్యను నిలుపుతూ, తెలుగులో సహజమైన పదక్రమాన్ని ఎంచుకున్నాం.
