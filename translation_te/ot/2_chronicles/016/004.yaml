id: 2CH.16.4
reference: 2 Chronicles 16:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֨ע בֶּן הֲדַ֜ד אֶל הַ/מֶּ֣לֶךְ אָסָ֗א וַ֠/יִּשְׁלַח אֶת שָׂרֵ֨י הַ/חֲיָלִ֤ים אֲשֶׁר ל/וֹ֙ אֶל עָרֵ֣י יִשְׂרָאֵ֔ל וַ/יַּכּוּ֙ אֶת עִיּ֣וֹן וְ/אֶת דָּ֔ן וְ/אֵ֖ת אָבֵ֣ל מָ֑יִם וְ/אֵ֥ת כָּֽל מִסְכְּנ֖וֹת עָרֵ֥י נַפְתָּלִֽי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/004.yaml
  text: Ben-hadad listened to King Asa and sent the commanders of his armies against the cities of Israel[a], and they struck Ijon, Dan, Abel-maim, and all the store-cities of Naphtali.
translation:
  language: te
  text: బెన్‌-హదదు ఆసా రాజు మాట విని, తన సైన్యాధిపతులను ఇశ్రాయేలు పట్టణాల మీదికి పంపాడు. వారు ఈయోను, దాను, ఆబేలు-మయీము[a], నఫ్తాలి ప్రాంతంలోని నిల్వ పట్టణాలన్నిటిపై దాడి చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ పాఠంలో ‘ఆబేలు-మయీము’ అని ఉంది; సమాంతర వాక్యాల్లో కనిపించే ‘ఆబేలు-బేత్‌-మయకా’తో కొందరు దీనిని గుర్తిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: మాట విని
  rationale: సందర్భంలో కేవలం వినడం మాత్రమే కాక ఆసా విన్నపాన్ని అంగీకరించి దానికి అనుగుణంగా చర్య తీసుకోవడం కూడా సూచితమవుతుంది. ‘మాట విని’ ఈ రెండు భావాలను సహజంగా కలిగి ఉంటుంది; ‘విధేయుడయ్యాడు’ అని అతిగా చెప్పదు.
- source_word: שָׂרֵי הַחֲיָלִים אֲשֶׁר לוֹ
  choice: తన సైన్యాధిపతులను
  rationale: שָׂרֵי అనేది అధిపతులను, הַחֲיָלִים అనేది సైనిక బలగాలను సూచిస్తుంది; אֲשֶׁר לוֹ తెలిపే స్వామ్యభావాన్ని తెలుగులో ‘తన’తో సహజంగా వ్యక్తం చేశాం.
- source_word: עָרֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పట్టణాల
  rationale: ఉత్తర రాజ్యానికి చెందిన పట్టణాలను సూచించే సూటి భౌగోళిక-రాజకీయ పదబంధం.
- source_word: וַיַּכּוּ
  choice: దాడి చేశారు
  rationale: సైనిక కథనంలో נכה దాడి చేయడం లేదా కొట్టడం అనే భావాన్ని ఇస్తుంది. పట్టణాలు కర్మగా ఉన్నందున ‘దాడి చేశారు’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: עִיּוֹן
  choice: ఈయోను
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగు ధ్వనులకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אָבֵל מָיִם
  choice: ఆబేలు-మయీము
  rationale: సమాంతర వాక్యాలతో సమన్వయం చేయకుండా, ఈ వాక్యంలోని హీబ్రూ పాఠాన్నే లిప్యంతరీకరించాం.
- source_word: מִסְכְּנוֹת עָרֵי נַפְתָּלִי
  choice: నఫ్తాలి ప్రాంతంలోని నిల్వ పట్టణాలు
  rationale: מִסְכְּנוֹת సరుకులు లేదా సరఫరాలు నిల్వచేసే కేంద్రాలను సూచిస్తుంది. ‘నిల్వ పట్టణాలు’ అర్థాన్ని స్పష్టంగా ఇస్తుంది; ‘నఫ్తాలి ప్రాంతంలోని’ అనే రూపం వాటి భౌగోళిక సంబంధాన్ని సహజ తెలుగులో తెలుపుతుంది.
