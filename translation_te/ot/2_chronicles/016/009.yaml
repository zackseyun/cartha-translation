  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י יְהוָ֗ה עֵינָ֞י/ו מְשֹׁטְט֤וֹת בְּ/כָל הָ/אָ֨רֶץ֙ לְ֠/הִתְחַזֵּק עִם לְבָבָ֥/ם שָׁלֵ֛ם אֵלָ֖י/ו נִסְכַּ֣לְתָּ עַל זֹ֑את כִּ֣י מֵ/עַ֔תָּה יֵ֥שׁ עִמְּ/ךָ֖ מִלְחָמֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/009.yaml
  text: For the eyes of Yahweh range throughout all the earth to strengthen those whose heart is wholly toward him[a]. You have acted foolishly in this; for from now on you will have wars.
translation:
  language: te
  text: యెహోవా కన్నులు వారి హృదయం ఆయనపట్ల సంపూర్ణంగా ఉన్నవారిని బలపరచడానికి భూమి అంతటా సంచరిస్తూ ఉంటాయి.[a] ఈ విషయంలో నీవు మూర్ఖంగా ప్రవర్తించావు. ఎందుకంటే ఇకనుంచి నీకు యుద్ధాలు ఉంటాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి హృదయం ఆయనపట్ల నిర్దోషంగా ఉన్నవారి పక్షాన తాను బలవంతుడని చూపించడానికి.”
    reason: לְהִתְחַזֵּק యొక్క ‘తాను బలవంతుడని చూపించు’ అనే ప్రత్యామ్నాయ భావాన్నీ, שָׁלֵם యొక్క ‘నిర్దోషమైన/దోషరహితమైన’ అనే సాధ్యమైన అనువాదాన్నీ నిలుపుతుంది.
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని తెలుగులో విస్తృతంగా పరిచితమైన లిప్యంతరీకరణతో నిలుపుతుంది.
- source_word: עֵינָיו מְשֹׁטְטוֹת
  choice: కన్నులు ... సంచరిస్తూ ఉంటాయి
  rationale: దేవుని దృష్టి, శ్రద్ధను సూచించే మానవరూపక చిత్రణతోపాటు క్రియాశీలంగా వెదకడం అనే వర్తమాన భావాన్ని నిలుపుతుంది.
- source_word: בְּכָל הָאָרֶץ
  choice: భూమి అంతటా
  rationale: ఈ సామెతసదృశ ప్రకటనలోని విశ్వవ్యాప్త పరిధిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְהִתְחַזֵּק עִם
  choice: బలపరచడానికి
  rationale: ఈ సందర్భంలో హితకరమైన సహాయం లేదా మద్దతు అనే భావాన్ని స్పష్టంగా అందిస్తుంది; ప్రతిబింబార్థకమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: לְבָבָם שָׁלֵם אֵלָיו
  choice: తనవైపు నిండు హృదయంతో ఉన్నవారిని
  rationale: పాపరహిత పరిపూర్ణతకన్నా విభజనలేని సంపూర్ణ నిబద్ధతను సూచిస్తూ, తెలుగులో సహజంగా ఉంది.
- source_word: נִסְכַּלְתָּ עַל זֹאת
  choice: ఈ విషయంలో నీవు మూర్ఖంగా ప్రవర్తించావు
  rationale: ప్రవక్త పలికిన గద్దింపును నేరుగా, ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: מֵעַתָּה יֵשׁ עִמְּךָ מִלְחָמוֹת
  choice: అందుచేత ఇప్పటినుంచి నీకు యుద్ధాలు ఉంటాయి
  rationale: కాలసూచననూ, రాబోయే నిరంతర సంఘర్షణ అనే తీర్పునూ స్పష్టంగా వ్యక్తం చేస్తుంది; כי యొక్క ఫలితార్థాన్ని ‘అందుచేత’తో తెలిపింది.
theological_decisions:
- issue: שָׁלֵם అనే పదం హృదయాన్ని వర్ణించేటప్పుడు దాని భావం
  choice: విభజనలేని, సంపూర్ణ హృదయ నిబద్ధత
  alternative: నిర్దోషమైన లేదా పరిపూర్ణమైన హృదయం
  rationale: సందర్భం నైతిక పాపరాహిత్యాన్ని కాక యెహోవాపై సంపూర్ణంగా ఆధారపడే ఒడంబడిక నిబద్ధతను ప్రాధాన్యపరుస్తుంది.
- issue: הָאָרֶץ యొక్క పరిధి
  choice: భూమి అంతా
  alternative: దేశమంతా
  rationale: ప్రకటన విశ్వవ్యాప్త, సామెతసదృశ స్వరాన్ని కలిగి ఉండి, యూదా భూభాగానికి మాత్రమే పరిమితం కాని యెహోవా పర్యవేక్షణను సూచిస్తుంది.
- issue: לְהִתְחַזֵּק యొక్క కర్తృ/హితకర భావం
  choice: వారిని బలపరచడం
  alternative: వారి పక్షాన తాను బలవంతుడని చూపించడం
  rationale: నిర్మాణం రెండవ భావానికి అవకాశం ఇచ్చినా, సందర్భంలో సంపూర్ణ హృదయంతో ఉన్నవారికి యెహోవా అందించే బలమైన సహాయమే ప్రధాన భావం; నిజమైన ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనా గౌరవప్రదమైన శైలి. ‘యెహోవా కన్నులు’ అనే హీబ్రూ మానవరూపకాన్ని నిలిపి, ‘నిండు హృదయం’ ద్వారా సంపూర్ణ నిబద్ధతను పాపరహిత పరిపూర్ణతగా అతిశయించకుండా తెలిపింది.
