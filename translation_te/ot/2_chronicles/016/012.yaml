id: 2CH.16.12
reference: 2 Chronicles 16:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֶּחֱלֶ֣א אָסָ֡א בִּ/שְׁנַת֩ שְׁלוֹשִׁ֨ים וָ/תֵ֤שַׁע לְ/מַלְכוּת/וֹ֙ בְּ/רַגְלָ֔י/ו עַד לְ/מַ֖עְלָ/ה חָלְי֑/וֹ וְ/גַם בְּ/חָלְי/וֹ֙ לֹא דָרַ֣שׁ אֶת יְהוָ֔ה כִּ֖י בָּ/רֹפְאִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/012.yaml
  text: In the thirty-ninth year of his reign[a], Asa became diseased in his feet; his disease became very severe. Yet even in his disease he did not seek Yahweh, but the physicians.
translation:
  language: te
  text: ఆసా పరిపాలన ముప్పై తొమ్మిదవ సంవత్సరంలో అతని పాదాలకు వ్యాధి వచ్చింది; అతని వ్యాధి చాలా తీవ్రమైంది. తన వ్యాధిలో కూడా అతడు యెహోవాను వెదకలేదు, కానీ వైద్యులను ఆశ్రయించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవాను సంప్రదించలేదు, కానీ వైద్యులను [సంప్రదించాడు].” హీబ్రూ చివరి వాక్యభాగం అర్థాధ్యాహారంతో ఉంది; యెహోవాను వెదకడానికీ వైద్యులవైపు తిరగడానికీ మధ్య వ్యత్యాసం చూపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱלֶא
  choice: వ్యాధి వచ్చింది
  rationale: חלה అంటే అనారోగ్యానికి గురికావడం. ఆధునిక తెలుగులో సందర్భానికి సహజంగా ఉండేలా ‘వ్యాధి వచ్చింది’ అని అనువదించాం.
- source_word: בְּרַגְלָיו
  choice: అతని పాదాలకు
  rationale: רֶגֶל అనే పదానికి ‘పాదం’ లేదా ‘కాలు’ అనే అర్థాలు ఉన్నాయి. మూలంలోని అవయవ సూచనను స్పష్టంగా ఉంచేందుకు ‘పాదాలకు’ ఎంచుకున్నాం.
- source_word: עַד לְמַעְלָה
  choice: చాలా తీవ్రమైంది
  rationale: ఇక్కడ ఈ పదబంధం పైదిశను కాక వ్యాధి తీవ్రతను సూచించే అతిశయార్థక ప్రయోగం.
- source_word: חָלְיוֹ / בְּחָלְיוֹ
  choice: అతని వ్యాధి / తన వ్యాధిలో
  rationale: మూలంలోని పునరుక్తిని సాధ్యమైనంతవరకు నిలుపుతూ ‘వ్యాధి’ అనే ఒకే పదాన్ని వాడాం.
- source_word: דָרַשׁ אֶת יְהוָה
  choice: యెహోవాను వెదకకుండా
  rationale: דרש ఇక్కడ దేవుని ఆశ్రయించడం లేదా ఆయనను సంప్రదించడం అనే విస్తృత అర్థాన్ని కలిగి ఉంది. ‘వెదకడం’ ఆ విస్తృతతను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’గా ఇచ్చాం.
- source_word: כִּי בָּרֹפְאִים
  choice: వైద్యులనే ఆశ్రయించాడు
  rationale: హీబ్రూ వాక్యభాగం సంక్షిప్తంగా, అర్థాధ్యాహారంతో ఉంది. యెహోవాను వెదకడానికి విరుద్ధంగా వైద్యులను ఆశ్రయించాడనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ఈ వచనం వైద్యచికిత్సనే ఖండిస్తుందా, లేక ఆసా దేవుణ్ణి వెదకకపోవడాన్ని ఖండిస్తుందా?
  choice: ఆసా యెహోవాను వెదకకుండా వైద్యులనే ఆశ్రయించాడనే వ్యత్యాసాన్ని నిలిపాం; వైద్యులు లేదా వైద్యం స్వతహాగా తప్పని చెప్పలేదు.
  alternative: వైద్యులను ఆశ్రయించడం ఏ సందర్భంలోనైనా తప్పని ఈ వచనం బోధిస్తుందని అనువదించడం.
  rationale: మూల వాక్యం ఆసా యెహోవాను వెదకకపోవడాన్ని వైద్యులవైపు తిరగడంతో వ్యత్యాసపరుస్తుంది. వైద్యంపై సాధారణ నిషేధాన్ని మూలపాఠం స్పష్టంగా ప్రకటించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘వెదకడం’ అనే బైబిలీయ పదప్రయోగాన్ని నిలుపుతూ, అర్థాధ్యాహారంతో ఉన్న చివరి భాగాన్ని సాధారణ పాఠకుడికి స్పష్టంగా చేశాం.
