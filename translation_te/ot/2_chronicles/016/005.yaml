  yaml_path: translation/ot/2_chronicles/016/005.yaml
  text: And when Baasha heard it[a], he stopped building Ramah and ceased his work.
translation:
  language: te
  text: బయెషా అది విన్నప్పుడు, రామాను కట్టడం[a] మానేశాడు; తన పనిని నిలిపివేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రామాను పటిష్ఠపరచడం.” ఇక్కడి హెబ్రీ పదప్రయోగం రామాలో నిర్మాణ పనిని లేదా దాని కోటను బలపరిచే పనిని ఆపివేయడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: అది విన్నప్పుడు
  rationale: ఈ హెబ్రీ నిర్మాణం కాలసంబంధ ఉపవాక్యాన్ని పరిచయం చేస్తుంది. ‘అది’ అనేది ముందున్న సంఘటనను సూచిస్తూ, తెలుగులో సహజంగా ఉండేందుకు సందర్భం నుంచి పూరించబడింది.
- source_word: בַּעְשָׁא
  choice: బయెషా
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
- source_word: וַיֶּחְדַּל מִבְּנוֹת
  choice: కట్టడం మానేశాడు
  rationale: חדל + מִן + క్రియానామం ఒక కార్యాన్ని చేయడం ఆపివేయడాన్ని సూచిస్తుంది; ‘కట్టడం మానేశాడు’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: אֶת הָרָמָה
  choice: రామాను
  rationale: ఇక్కడ הָרָמָה సాధారణ నామవాచకం కాదు, రామా అనే స్థలపేరు. నిర్మాణ కార్యానికి ప్రత్యక్ష కర్మగా ఉన్నందున ‘రామాను’ అని అనువదించాం.
- source_word: וַיַּשְׁבֵּת
  choice: నిలిపివేశాడు
  rationale: שבת హిఫిల్ రూపం ఏదైనా పనిని ఆపించడం లేదా అంతం చేయడం అనే భావాన్ని ఇస్తుంది. కర్మగా ‘తన పని’ ఉన్నందున ‘నిలిపివేశాడు’ సహజంగా కారణార్థ భావాన్ని కాపాడుతుంది.
- source_word: מְלַאכְתּוֹ
  choice: తన పనిని
  rationale: מְלָאכָה పని, శ్రమ లేదా కార్యాన్ని సూచిస్తుంది. కర్తనే స్వామిగా స్పష్టంగా చూపేందుకు తెలుగులో ‘తన పనిని’ అని ఇచ్చాం.
