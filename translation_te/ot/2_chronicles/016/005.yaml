  text: וַ/יְהִי֙ כִּ/שְׁמֹ֣עַ בַּעְשָׁ֔א וַ/יֶּחְדַּ֕ל מִ/בְּנ֖וֹת אֶת הָ/רָמָ֑ה וַ/יַּשְׁבֵּ֖ת אֶת מְלַאכְתּֽ/וֹ־־׃ס
base_translation:
