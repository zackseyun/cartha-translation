translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని వరుసగా రెండు కార్యాల భావాన్ని అర్ధవిరామంతో స్పష్టంగా ఉంచాం; ‘అది’ ముందున్న కథన విషయాన్ని సందర్భానుసారంగా సూచిస్తుంది.
