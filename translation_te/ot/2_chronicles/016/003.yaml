  text: בְּרִית֙ בֵּינִ֣/י וּ/בֵינֶ֔/ךָ וּ/בֵ֥ין אָבִ֖/י וּ/בֵ֣ין אָבִ֑י/ךָ הִנֵּ֨ה שָׁלַ֤חְתִּֽי לְ/ךָ֙ כֶּ֣סֶף וְ/זָהָ֔ב לֵ֞ךְ הָפֵ֣ר בְּרִֽיתְ/ךָ֗ אֶת בַּעְשָׁא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וְ/יַעֲלֶ֖ה מֵ/עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/003.yaml
  text: There is a treaty between me and you[a], and between my father and your father. Look, I have sent you silver and gold. Go, break your treaty with Baasha king of Israel[b], so that he may withdraw from me.
translation:
  language: te
  text: “నాకూ మీకూ మధ్య, నా తండ్రికీ మీ తండ్రికీ మధ్య ఒక సంధి ఉంది.[a] ఇదిగో, నేను మీకు వెండి, బంగారం పంపించాను. మీరు వెళ్లి ఇశ్రాయేలు రాజైన బయషాతో మీకున్న సంధిని రద్దు చేయండి. తద్వారా అతడు నా మీదనుండి వెనక్కి తగ్గుతాడు.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సంధి’కి హెబ్రీ పదం בְּרִית (బెరీత్); దీనిని ‘ఒడంబడిక’ లేదా ‘మైత్రి ఒప్పందం’ అని కూడా అనువదించవచ్చు. ఇక్కడ సందర్భం రాజుల మధ్య రాజకీయ ఒప్పందానిది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అతడు నా మీదనుండి పైకి వెళ్లిపోతాడు.” ఈ నుడికారం బయషా ఆసాపై చేస్తున్న సైనిక చర్యను లేదా ఒత్తిడిని విరమించి వెనక్కి తగ్గడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִית
  choice: సంధి
  rationale: రాజుల మధ్య రాజకీయ ఒప్పందాన్ని సూచించే ఈ సందర్భంలో ‘సంధి’ సహజంగా, సంక్షిప్తంగా ఆ భావాన్ని తెలియజేస్తుంది; హెబ్రీ పదం రెండుసార్లు రావడం వల్ల తెలుగులోనూ అదే పదాన్ని రెండుసార్లు ఉంచాం.
- source_word: בֵּינִי וּבֵינֶךָ וּבֵין אָבִי וּבֵין אָבִיךָ
  choice: నాకూ నీకూ మధ్య, నా తండ్రికీ నీ తండ్రికీ మధ్య
  rationale: హెబ్రీలోని సమాంతర దౌత్య సూత్రాన్ని కుదించకుండా, సహజమైన తెలుగు నిర్మాణంలో నిలిపాం.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: తాను పంపించిన కానుకపై అవధానం నిలిపే హెబ్రీ సూచనార్థక పదానికి ఆధునిక తెలుగులో సహజమైన సమానం.
- source_word: שָׁלַחְתִּי לְךָ כֶּסֶף וְזָהָב
  choice: నేను నీకు వెండిబంగారాలు పంపించాను
  rationale: పూర్తయినప్పటికీ ప్రస్తుత సందర్భానికి సంబంధించిన చర్యగా హెబ్రీ క్రియను సహజమైన తెలుగు భూతకాలంలో తెలిపాం.
- source_word: לֵךְ הָפֵר
  choice: నువ్వు వెళ్లి … రద్దు చెయ్యి
  rationale: రెండు ఆజ్ఞారూపాల బలాన్ని నిలిపి, ఒప్పందాన్ని చెల్లకుండా చేయడాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בְּרִיתְךָ אֶת־בַּעְשָׁא
  choice: బయషాతో నీకున్న సంధి
  rationale: బయషాతో ఉన్న రాజకీయ ఒప్పంద సంబంధాన్ని సహజమైన తెలుగు విభక్తి నిర్మాణంతో తెలిపాం.
- source_word: וְיַעֲלֶה מֵעָלַי
  choice: అప్పుడు అతడు నా మీద నుంచి వెనక్కి తగ్గుతాడు
  rationale: అక్షరార్థంగా ‘నా మీద నుంచి పైకి వెళ్లడం’ అనే నుడికారానికి, ఈ సైనిక-రాజకీయ సందర్భంలో ఒత్తిడి లేదా దాడిని విరమించి వెనుదిరగడం భావం ఉంది.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: ప్రామాణిక రాజబిరుదును నేరుగా నిలిపాం.
