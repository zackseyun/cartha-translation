  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజుల మధ్య దౌత్య సంభాషణకు తగిన గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలిని వాడాం. ప్రత్యక్ష సంభాషణలో ఏకవచన ‘నువ్వు’ను ఉపయోగించి హెబ్రీ రెండవ పురుష ఏకవచనాన్ని స్పష్టంగా నిలిపాం.
