  text: וְ/אָסָ֣א הַ/מֶּ֗לֶךְ לָקַח֙ אֶת כָּל יְהוּדָ֔ה וַ/יִּשְׂא֞וּ אֶת אַבְנֵ֤י הָֽ/רָמָה֙ וְ/אֶת עֵצֶ֔י/הָ אֲשֶׁ֥ר בָּנָ֖ה בַּעְשָׁ֑א וַ/יִּ֣בֶן בָּ/הֶ֔ם אֶת גֶּ֖בַע וְ/אֶת הַ/מִּצְפָּֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/006.yaml
  text: Then King Asa took all Judah[a], and they carried away the stones of Ramah and its timber, with which Baasha had built[b], and he built with them Geba and Mizpah.
translation:
  language: te
  text: అప్పుడు ఆసా రాజు యూదా ప్రజలందరినీ సమీకరించాడు[a]. వారు బయెషా నిర్మించిన రామాకు చెందిన రాళ్లను, దాని కలపను[b] మోసుకుపోయారు. ఆసా వాటితో గెబాను, మిస్పాను నిర్మించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘యూదా అంతటినీ తీసుకున్నాడు’; సందర్భంలో, పనికోసం యూదా ప్రజలందరినీ పిలిపించడం లేదా సమీకరించడం అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అంటే, బయెషా రామాను నిర్మించడానికి ఉపయోగించిన రాళ్లు, కలప.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַח אֶת כָּל יְהוּדָה
  choice: యూదా ప్రజలందరినీ సమీకరించాడు
  rationale: అక్షరార్థంగా ‘యూదా అంతటినీ తీసుకున్నాడు.’ ఈ సందర్భంలో రాజు పనికోసం యూదా ప్రజలను సమీకరించాడనే భావం ఉంది; ఆధునిక తెలుగులో ‘సమీకరించాడు’ సహజంగా, స్పష్టంగా ఉంది. అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַיִּשְׂאוּ
  choice: మోసుకుపోయారు
  rationale: నשׂא అనే క్రియ ఇక్కడ నిర్మాణ సామగ్రిని ఎత్తి మరొక చోటికి తరలించడాన్ని సూచిస్తుంది.
- source_word: אַבְנֵי הָרָמָה
  choice: రామా రాళ్లను
  rationale: స్థలనామంతో కూడిన హెబ్రీ నిర్మాణాన్ని సహజమైన తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది; ఇవి రామా నిర్మాణానికి చెందిన రాళ్లు.
- source_word: עֵצֶיהָ
  choice: దాని కలపను
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం రామాను సూచిస్తుంది. నిర్మాణానికి వాడిన చెక్క సామగ్రికి ‘కలప’ సహజమైన పదం.
- source_word: אֲשֶׁר בָּנָה בַּעְשָׁא
  choice: బయెషా రామాను కట్టడానికి ఉపయోగించిన
  rationale: సంబంధ వాక్యం రాళ్లు, కలప రెండింటినీ సూచిస్తుందని సందర్భం తెలియజేస్తుంది. మూలంలో ‘రామాను’ ప్రత్యక్షంగా లేకపోయినా, బయెషా ఆ సామగ్రితో రామాను కట్టాడనే సంబంధాన్ని తెలుగులో స్పష్టం చేశాం; దీనిని పాదసూచిక తెలియజేస్తుంది.
- source_word: וַיִּבֶן בָּהֶם
  choice: ఆసా వాటితో … నిర్మించాడు
  rationale: ఏకవచన క్రియకు ఆసా కర్త; బహువచన ప్రత్యయం తీసుకువచ్చిన రాళ్లు, కలపను సూచిస్తుంది. ‘కోటలుగా బలపరిచాడు’ అనే సందర్భార్థాన్ని అదనంగా చేర్చకుండా ‘నిర్మించాడు’ అని అనువదించాం.
- source_word: גֶּבַע
  choice: గెబ
  rationale: హెబ్రీ స్థలనామానికి సన్నిహితమైన తెలుగు లిప్యంతరీకరణ.
- source_word: הַמִּצְפָּה
  choice: మిస్పా
  rationale: హెబ్రీ స్థలనామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ; హెబ్రీ నిర్దిష్ట ఉపపదాన్ని తెలుగులో విడిగా చూపాల్సిన అవసరం లేదు.
