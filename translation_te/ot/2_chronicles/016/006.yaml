translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే చారిత్రక కథనానికి తగిన గౌరవప్రదమైన శైలిలో అనువదించాం. స్థలనామాలను గెబ, మిస్పా, రామా అని లిప్యంతరీకరించాం. ప్రధాన వాక్యంలో సహజత్వం కోసం ‘యూదా ప్రజలందరినీ సమీకరించాడు’ అని ఇచ్చి, హెబ్రీ అక్షరార్థాన్ని పాదసూచికలో భద్రపరిచాం.
