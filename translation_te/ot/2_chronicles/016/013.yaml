source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֥ב אָסָ֖א עִם אֲבֹתָ֑י/ו וַ/יָּ֕מָת בִּ/שְׁנַ֛ת אַרְבָּעִ֥ים וְ/אַחַ֖ת לְ/מָלְכֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/013.yaml
  text: And Asa slept with his fathers and died in the forty-first year of his reign[a].
translation:
  language: te
  text: ఆసా తన పితరులతో నిద్రించాడు[a]; అతడు తన రాజ్యపాలన యొక్క నలభై ఒకటవ సంవత్సరంలో మరణించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తన పితరులతో నిద్రించాడు’ అనేది మరణాన్నీ పితరుల మధ్య సమాధి చేయబడడాన్నీ సూచించే సంప్రదాయ హీబ్రూ ప్రయోగం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: నిద్రించాడు
  rationale: హీబ్రూ రాజవృత్తాంతాలలో మరణాన్ని సూచించే సంప్రదాయ రూపకాన్ని నిలుపుతుంది; వెంటనే వచ్చే ‘మరణించాడు’ అనే స్పష్టమైన క్రియతో దీనిని కలిపివేయదు.
- source_word: עִם אֲבֹתָיו
  choice: తన పితరులతో కూడ
  rationale: కుటుంబ, వంశపారంపర్య భావాన్ని నిలుపుతూ హీబ్రూ మరణసూత్రాన్ని సన్నిహితంగా ప్రతిబింబిస్తుంది.
- source_word: וַיָּמָת
  choice: మరణించాడు
  rationale: מות అనే క్రియను స్పష్టంగా అనువదిస్తుంది; ముందున్న రూపక ప్రయోగం పక్కనే మూలంలో ఉన్న పునరుక్తిని నిలుపుతుంది.
- source_word: בִּשְׁנַת אַרְבָּעִים וְאַחַת
  choice: నలభై ఒకటవ సంవత్సరంలో
  rationale: రాజ్యకాల గణనలో హీబ్రూ సంఖ్యకు సహజమైన తెలుగు క్రమసంఖ్యా రూపం.
- source_word: לְמָלְכוֹ
  choice: తన పరిపాలనలో
  rationale: ఆసా రాజుగా పాలించిన కాలాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: אָסָא
  choice: ఆసా
  rationale: హీబ్రూ వ్యక్తినామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
theological_decisions:
- issue: ‘పితరులతో కూడ నిద్రించాడు’ అనే మరణ రూపకం
  choice: రూపకాన్ని ప్రధాన పాఠ్యంలో యథాతథంగా నిలిపి, దాని అర్థాన్ని పాదసూచికలో వివరించడం
  alternative: ‘తన పూర్వీకులవలె మరణించాడు’ అని భావార్థం మాత్రమే ఇవ్వడం
  rationale: మూలంలోని రూపకాన్నీ, దాని తరువాత విడిగా ఉన్న ‘మరణించాడు’ అనే ప్రకటననూ నిలుపుతుంది; మరణానంతర స్థితిపై మూలం చెప్పనిదాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని మరణ రూపకాన్ని కాపాడేందుకు ‘పితరులతో కూడ నిద్రించాడు’ వాడబడింది; పాఠకులకు స్పష్టత కోసం పాదసూచిక జోడించబడింది.
