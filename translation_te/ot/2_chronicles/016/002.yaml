revisions:
- from: 'అప్పుడు ఆసా యెహోవా మందిరపు ఖజానాల్లోనుంచి, రాజభవనపు ఖజానాల్లోనుంచి వెండి బంగారాలను బయటకు తీసి, దమస్కులో నివసిస్తున్న అరాము రాజు బెన్హదదుకు[a] పంపిస్తూ ఇలా అన్నాడు:'
  to: 'అప్పుడు ఆసా యాహ్వే మందిరపు ఖజానాల నుండి, రాజభవనపు ఖజానాల నుండి వెండినీ బంగారాన్నీ బయటకు తీసి, దమస్కులో నివసిస్తున్న అరాము రాజు బెన్‌హదదుకు[a] పంపి ఇలా అన్నాడు:'
  rationale: The revision aligns the divine-name rendering with the POB Yahweh policy and replaces a potentially durative/concurrent Telugu construction with a sequential one that reflects the Hebrew narrative. It retains the explicit plural sense of the treasuries, the named metals, Aram, Damascus, and the speech-introduction formula.
