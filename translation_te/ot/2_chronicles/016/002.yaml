id: 2CH.16.2
reference: 2 Chronicles 16:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּצֵ֨א אָסָ֜א כֶּ֣סֶף וְ/זָהָ֗ב מֵ/אֹֽצְר֛וֹת בֵּ֥ית יְהוָ֖ה וּ/בֵ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֗ח אֶל בֶּן הֲדַד֙ מֶ֣לֶךְ אֲרָ֔ם הַ/יּוֹשֵׁ֥ב בְּ/דַרְמֶ֖שֶׂק לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/002.yaml
  text: Then Asa brought out silver and gold from the treasuries of the house of Yahweh and of the king’s house[a], and sent them to Ben-hadad king of Aram, who lived in Damascus, saying,
translation:
  language: te
  text: 'అప్పుడు ఆసా యాహ్వే మందిరపు ఖజానాల నుండి, రాజభవనపు ఖజానాల నుండి వెండినీ బంగారాన్నీ బయటకు తీసి, దమస్కులో నివసిస్తున్న అరాము రాజు బెన్‌హదదుకు[a] పంపి ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘అరాము రాజు’; సంప్రదాయ అనువాదం: ‘సిరియా రాజు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: బయటకు తీసి
  rationale: హిఫిల్ రూపం నిల్వలో ఉన్నవాటిని బయటకు తీయడాన్ని సూచిస్తుంది; ఈ సందర్భంలో ఇది సహజమైన, స్పష్టమైన తెలుగు ప్రయోగం.
- source_word: כֶּסֶף וְזָהָב
  choice: వెండి బంగారాలను
  rationale: మూలంలో పేర్కొన్న రెండు విలువైన లోహాలనూ సాధారణీకరించకుండా నేరుగా అనువదిస్తుంది.
- source_word: מֵאֹצְרוֹת
  choice: ఖజానాల్లోనుంచి
  rationale: హీబ్రూలోని బహువచనాన్ని నిలుపుతూ, మందిరం మరియు రాజభవనంలో నిల్వచేసిన సంపద సందర్భానికి సరిపోతుంది.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరపు
  rationale: అక్షరార్థం ‘యెహోవా ఇల్లు’; ఆధునిక తెలుగులో ఆ భవనాన్ని స్పష్టంగా సూచించడానికి ‘మందిరం’ సహజంగా ఉంటుంది.
- source_word: וּבֵית הַמֶּלֶךְ
  choice: రాజభవనపు
  rationale: అక్షరార్థం ‘రాజు ఇల్లు’; సందర్భంలో రాజనివాసం మరియు దాని ఖజానాను సహజంగా సూచించే పదం ‘రాజభవనం’.
- source_word: וַיִּשְׁלַח
  choice: పంపిస్తూ
  rationale: వెండి బంగారాలే పంపబడిన వస్తువులని తెలుగు వాక్య నిర్మాణంలో స్పష్టంగా అనుసంధానిస్తుంది; తరువాతి ప్రత్యక్ష ప్రసంగానికి కూడా దారి తీస్తుంది.
- source_word: אֶל בֶּן הֲדַד
  choice: బెన్హదదుకు
  rationale: వ్యక్తి పేరును మూల ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించింది.
- source_word: מֶלֶךְ אֲרָם
  choice: అరాము రాజు
  rationale: ఆధునిక భౌగోళిక సమానార్థాన్ని రుద్దకుండా హీబ్రూ ప్రదేశనామమైన ‘అరాము’ను నిలుపుతుంది.
- source_word: הַיּוֹשֵׁב בְּדַרְמֶשֶׂק
  choice: దమస్కులో నివసిస్తున్న
  rationale: కృదంత ప్రయోగంలోని కొనసాగుతున్న నివాస భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నాడు:'
  rationale: తదుపరి వచనంలోని ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేసే సహజమైన తెలుగు కథన ప్రయోగం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇల్లు’ అనే అక్షరార్థానికి బదులుగా సందర్భానుసారంగా ‘మందిరం’, ‘రాజభవనం’ వాడి సహజత్వాన్ని పెంచాం; ఖజానాల బహువచన భావాన్ని నిలిపాం. పాదసూచిక గుర్తును దాని విషయమైన ‘అరాము’కు సంబంధించిన పేరుపదబంధం వద్ద ఉంచాం.
