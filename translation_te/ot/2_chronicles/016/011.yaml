  text: וְ/הִנֵּה֙ דִּבְרֵ֣י אָסָ֔א הָ/רִאשׁוֹנִ֖ים וְ/הָ/אַחֲרוֹנִ֑ים הִנָּ֤/ם כְּתוּבִים֙ עַל סֵ֣פֶר הַ/מְּלָכִ֔ים לִ/יהוּדָ֖ה וְ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/011.yaml
  text: Behold[a], the acts of Asa, the first and the last, behold, they are written in the Book of the Kings of Judah and Israel.
translation:
  language: te
  text: ఇదిగో[a], ఆసా కార్యాలు, మొదటివి మొదలుకొని చివరివి వరకు—ఇదిగో, అవి యూదా, ఇశ్రాయేలు రాజుల గ్రంథంలో వ్రాయబడి ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “ఆసా సంగతులు—మొదటివి, చివరివి.” రాజుల చరిత్రను సంక్షిప్తంగా సూచించే ఈ హీబ్రూ ప్రయోగంలో “సంగతులు” అనేది అతని మాటలనే కాక, అతని కార్యాలు, వ్యవహారాలను కూడా సూచించగలదు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: ముగింపు సమాచారంపై దృష్టి నిలిపే హీబ్రూ సూచనాత్మక ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; మూలంలో స్పష్టమైన కాలార్థక ‘ఇప్పుడు’ లేదు.
- source_word: דִּבְרֵי
  choice: కార్యాలు
  rationale: రాజుల చరిత్రసార సూత్రాలలో ఈ పదం కేవలం మాటలను కాక, రాజుకు సంబంధించిన కార్యాలు, వ్యవహారాలు, సంఘటనలను విస్తృతంగా సూచిస్తుంది.
- source_word: הָרִאשׁוֹנִים וְהָאַחֲרוֹנִים
  choice: మొదటివి, చివరివి
  rationale: మూలంలోని జతపదాలను సన్నిహితంగా నిలుపుతూ ఆసా పరిపాలనలోని పూర్వాపర కార్యాల సమగ్ర పరిధిని సూచిస్తుంది.
- source_word: הִנָּם כְּתוּבִים
  choice: ఇదిగో, అవి ... రాయబడి ఉన్నాయి
  rationale: రెండవ హీబ్రూ הִנָּם యొక్క సూచనాత్మక బలాన్ని వదలకుండా, లిఖిత ఆధారంలో అవి ఉన్నాయని స్పష్టంగా చెబుతుంది.
- source_word: עַל סֵפֶר
  choice: గ్రంథంలో
  rationale: עַל అక్షరార్థంగా ‘మీద’ అయినప్పటికీ, లిఖిత ఆధారాన్ని ఉటంకించే ఈ సందర్భంలో తెలుగు వాడుకకు ‘గ్రంథంలో’ సహజం.
- source_word: הַמְּלָכִים לִיהוּדָה וְיִשְׂרָאֵל
  choice: యూదా, ఇశ్రాయేలు రాజుల
  rationale: సంబంధార్థక לִ־ను సహజమైన తెలుగు షష్ఠీ నిర్మాణంతో వ్యక్తం చేసి, ఈ గ్రంథం రెండు రాజ్యాల రాజులకు సంబంధించినదని తెలుపుతుంది.
