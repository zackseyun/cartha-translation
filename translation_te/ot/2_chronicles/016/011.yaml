translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన చరిత్రాత్మక ముగింపు శైలిని పాటించాం. మూలంలోని రెండు దృష్టి-ఆకర్షక సూచనలను ‘ఇదిగో’ అని రెండుసార్లు నిలిపాం; విరామచిహ్నాలు వాక్యాన్ని సాధారణ పాఠకులకు స్పష్టంగా చేస్తాయి.
