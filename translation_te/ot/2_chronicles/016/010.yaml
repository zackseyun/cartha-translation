source:
  edition: WLC
  text: וַ/יִּכְעַ֨ס אָסָ֜א אֶל הָ/רֹאֶ֗ה וַֽ/יִּתְּנֵ֨/הוּ֙ בֵּ֣ית הַ/מַּהְפֶּ֔כֶת כִּֽי בְ/זַ֥עַף עִמּ֖/וֹ עַל זֹ֑את וַ/יְרַצֵּ֥ץ אָסָ֛א מִן הָ/עָ֖ם בָּ/עֵ֥ת הַ/הִֽיא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/010.yaml
  text: Then Asa was angry with the seer and put him in the prison house[a], because he was in a rage with him over this[b]. And Asa brutally oppressed some of the people at that time.
translation:
  language: te
  text: అప్పుడు ఆసా ఆ ద్రష్టపై కోపపడి, అతన్ని బంధనశాలలో[a] ఉంచాడు; ఎందుకంటే ఈ విషయం వల్ల ఆసా అతనిపై తీవ్ర ఆగ్రహంతో ఉన్నాడు. ఆ సమయంలో ఆసా ప్రజల్లో కొందరిని క్రూరంగా అణచివేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కొయ్యబొండల గది’; హీబ్రూ పదబంధం కట్టివేసి నిర్బంధించే స్థలాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నలగగొట్టాడు’ లేదా ‘తీవ్రంగా వేధించాడు’; హీబ్రూ క్రియ అక్షరార్థంగా హింసాత్మకమైనది, కఠినమైన దౌర్జన్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְעַס
  choice: కోపపడి
  rationale: כעס కోపం లేదా ఆగ్రహాన్ని సూచిస్తుంది. కథన క్రమంలో సహజంగా వినిపించే క్రియారూపాన్ని ఎంచుకున్నాం.
- source_word: הָרֹאֶה
  choice: దీర్ఘదర్శి
  rationale: רֹאֶה అనేది ప్రవక్తకు వాడిన పాత బిరుదు; సాధారణమైన ‘ప్రవక్త’ అని విస్తరించకుండా మూలపదంలోని ‘seer’ భావాన్ని నిలుపుతుంది.
- source_word: וַיִּתְּנֵהוּ
  choice: అతన్ని … వేయించాడు
  rationale: נתן ఇక్కడ ఒక వ్యక్తిని నిర్దిష్ట స్థలంలో ఉంచడం లేదా నిర్బంధించడం అనే సందర్భార్థంలో ఉంది. రాజైన ఆసా ఆజ్ఞతో జరిగిన చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בֵּית הַמַּהְפֶּכֶת
  choice: బంధనశాల
  rationale: ఈ అరుదైన పదబంధం నిర్బంధంతోపాటు కట్టివేసే కొయ్యబొండ వంటి సాధనాన్ని కూడా సూచించవచ్చు. ప్రధాన పాఠ్యంలో సందర్భానికి సరిపోయే స్థలార్థాన్ని ఇచ్చి, నిర్దిష్ట ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: בְזַעַף עִמּוֹ
  choice: అతనిపై తీవ్ర ఆగ్రహంతో ఉన్నాడు
  rationale: זַעַף తీవ్రమైన ఆగ్రహం లేదా ఉగ్రకోపాన్ని సూచిస్తుంది. భావతీవ్రతను సహజమైన, గౌరవప్రదమైన తెలుగులో నిలిపాం.
- source_word: עַל זֹאת
  choice: ఈ విషయం వల్ల
  rationale: ఇది ముందు చెప్పిన ప్రవచన సందేశాన్ని ఆసా ఆగ్రహానికి కారణంగా సూచిస్తుంది.
- source_word: וַיְרַצֵּץ
  choice: క్రూరంగా అణచివేశాడు
  rationale: רצץ పియేల్ రూపం అక్షరార్థంగా నలగగొట్టడం లేదా చితకగొట్టడం వంటి హింసాత్మక భావాన్ని ఇస్తుంది. ప్రజల పట్ల చర్యగా ఇక్కడ తీవ్రమైన దౌర్జన్యాన్ని తెలిపేందుకు ఈ ప్రయోగం అనుకూలం.
- source_word: מִן הָעָם
  choice: ప్రజల్లో కొందరిని
  rationale: מן ఇక్కడ విభాగార్థకంగా ఉంది; ప్రజలందరినీ కాక వారిలో కొందరిని సూచిస్తుంది.
- source_word: בָּעֵת הַהִיא
  choice: ఆ సమయంలో
  rationale: హీబ్రూ కాలసూచక పదబంధానికి సహజమైన ఆధునిక తెలుగు రూపం.
