id: 2CH.16.1
reference: 2 Chronicles 16:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וָ/שֵׁשׁ֙ לְ/מַלְכ֣וּת אָסָ֔א עָלָ֞ה בַּעְשָׁ֤א מֶֽלֶךְ יִשְׂרָאֵל֙ עַל יְהוּדָ֔ה וַ/יִּ֖בֶן אֶת הָ/רָמָ֑ה לְ/בִלְתִּ֗י תֵּ֚ת יוֹצֵ֣א וָ/בָ֔א לְ/אָסָ֖א מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/001.yaml
  text: In the thirty-sixth year of Asa’s reign[a], Baasha king of Israel went up against Judah and built up Ramah, so as not to allow anyone to go out or come in to Asa king of Judah.
translation:
  language: te
  text: ఆసా పరిపాలనలో ముప్పై ఆరవ సంవత్సరంలో[a], ఇశ్రాయేలు రాజైన బయెషా యూదామీదికి దండెత్తి, యూదా రాజైన ఆసా దగ్గరకు ఎవరూ వెళ్లకుండా, అతని దగ్గరనుంచి ఎవరూ రాకుండా ఉండేందుకు రామాను నిర్మించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “ఆసా పరిపాలనలో ముప్పై ఆరవ సంవత్సరంలో.” ఇది బయెషా పరిపాలన గురించి 1 రాజులు తెలిపే కాలక్రమంతో ఉద్రిక్తతను కలిగిస్తుంది. కొందరు దీనిని రాజ్యం విడిపోయినప్పటి నుంచి లెక్కించిన సంవత్సరంగా అర్థం చేసుకుంటారు; మరికొందరు కాలక్రమాన్ని సమన్వయపరిచే పాఠ్య సవరణను ప్రతిపాదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁלֹשִׁים וָ/שֵׁשׁ
  choice: ముప్పై ఆరవ సంవత్సరంలో
  rationale: కాలాన్ని సూచించే ב మరియు సంఖ్యా నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో క్రమసంఖ్యగా అందిస్తుంది.
- source_word: לְ/מַלְכוּת אָסָא
  choice: ఆసా పరిపాలనలో
  rationale: מַלְכוּת ఇక్కడ రాజుగా పాలించిన కాలాన్ని సూచిస్తుంది; ‘పరిపాలనలో’ సహజంగా కాలసంబంధాన్ని తెలియజేస్తుంది.
- source_word: עָלָה ... עַל יְהוּדָה
  choice: యూదాపైకి వచ్చి
  rationale: సైనిక సందర్భంలోని ‘పైకి వెళ్లడం/దండెత్తడం’ భావాన్ని కాపాడుతూ, మూలంలో స్పష్టంగా లేని అదనపు యుద్ధవివరాన్ని చేర్చదు.
- source_word: וַ/יִּבֶן אֶת הָ/רָמָה
  choice: రామాను నిర్మించాడు
  rationale: בנה యొక్క ప్రాథమిక అర్థం ‘నిర్మించు’; సందర్భం కోటబలపరచడాన్ని సూచించవచ్చుగాని, దానిని ప్రధాన పాఠ్యంలో నిర్బంధంగా చేర్చలేదు.
- source_word: לְ/בִלְתִּי תֵּת
  choice: వెళ్లకుండా ... రాకుండా ఉండేందుకు
  rationale: నివారణను సూచించే ఉద్దేశ్య నిర్మాణాన్ని తెలుగులో సహజమైన ప్రయోజనార్థక వాక్యంగా వ్యక్తపరుస్తుంది.
- source_word: יוֹצֵא וָ/בָא
  choice: ఎవరూ వెళ్లకుండా, అక్కడి నుంచి ఎవరూ రాకుండా
  rationale: రాకపోకలను సూచించే హెబ్రీ జంటపద భావాన్ని కాపాడుతుంది; వ్యక్తి సూచన మూలంలో ప్రత్యక్షంగా లేకపోయినా తెలుగు వాక్య నిర్మాణానికి ‘ఎవరూ’ అవసరం.
- source_word: לְ/אָסָא מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన ఆసా దగ్గరికి ... అక్కడి నుంచి
  rationale: ל యొక్క సంబంధ/దిశ భావాన్ని, సందర్భంలో ఉద్దేశించిన ఆసా వద్దకు మరియు అతని వద్దనుంచి జరిగే రాకపోకల నిరోధంగా సహజ తెలుగులో వెల్లడిస్తుంది.
theological_decisions:
- issue: రాజుల గ్రంథంలోని బయెషా కాలక్రమంతో ఉన్న ఉద్రిక్తత
  choice: ప్రధాన పాఠ్యంలో మసొరెతిక్ పాఠంలోని ‘ఆసా పరిపాలనలో ముప్పై ఆరవ సంవత్సరం’ను యథాతథంగా ఉంచడం
  alternative: రాజ్యం విడిపోయినప్పటి నుంచి ముప్పై ఆరవ సంవత్సరం అని అర్థం చేసుకోవడం; లేదా ‘ఆసా పరిపాలనలో ఇరవై ఆరవ సంవత్సరం’గా పాఠ్య సవరణ ప్రతిపాదించడం
  rationale: హెబ్రీ పాఠం స్పష్టంగా ‘ఆసా పరిపాలనలో ముప్పై ఆరవ సంవత్సరం’ అని చదువుతుంది. కాలక్రమ సమస్యను అనువాదంలో మౌనంగా సమన్వయపరచకుండా, ప్రత్యామ్నాయ వివరణలను పాదసూచికలో పారదర్శకంగా ఉంచడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక వర్ణన. ‘దండెత్తాడు’ లేదా ‘కోటగా బలపరిచాడు’ వంటి సందర్భానుగుణమైన కానీ మూలపదం కంటే నిర్దిష్టమైన పదాలను నివారించి, మూలంలోని అర్థవిస్తృతిని కాపాడింది.
