source:
  edition: WLC
  text: וְ/עַתָּ֡ה אַל יַשִּׁיא֩ אֶתְ/כֶ֨ם חִזְקִיָּ֜הוּ וְ/אַל יַסִּ֨ית אֶתְ/כֶ֣ם כָּ/זֹאת֮ וְ/אַל תַּאֲמִ֣ינוּ ל/וֹ֒ כִּי לֹ֣א יוּכַ֗ל כָּל אֱל֨וֹהַ֙ כָּל גּ֣וֹי וּ/מַמְלָכָ֔ה לְ/הַצִּ֥יל עַמּ֛/וֹ מִ/יָּדִ֖/י וּ/מִ/יַּ֣ד אֲבוֹתָ֑/י אַ֚ף כִּ֣י אֱֽלֹהֵי/כֶ֔ם לֹא יַצִּ֥ילוּ אֶתְ/כֶ֖ם מִ/יָּדִֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/015.yaml
  text: So now[a], do not let Hezekiah deceive you, and do not let him persuade you like this, and do not believe him; for no god of any nation or kingdom has been able to deliver his people from my hand and from the hand of my fathers[c][b]. How much less will your God deliver you from my hand!
translation:
  language: te
  text: కాబట్టి ఇప్పుడు, హిజ్కియా మిమ్మల్ని మోసగించనివ్వకండి; ఈ విధంగా అతడు మిమ్మల్ని ఒప్పించనివ్వకండి[a]; అతణ్ణి నమ్మకండి. ఎందుకంటే ఏ జనానికైనా లేదా రాజ్యానికైనా చెందిన ఏ దేవుడూ తన ప్రజలను నా చేతినుండి, నా పూర్వికుల చేతినుండి[b] విడిపించలేకపోయాడు. అలాంటప్పుడు మీ దేవుడు మిమ్మల్ని నా చేతినుండి విడిపించడం ఇంకెంత తక్కువగా సాధ్యం![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఒప్పించు’కు ప్రత్యామ్నాయంగా ‘పురికొల్పు’ లేదా ‘ఆకర్షించు’ అని అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో అక్షరార్థంగా, ‘నా చేతినుండి, నా పూర్వికుల చేతినుండి.’ ఇక్కడ ‘చేతి’ అధికారం లేదా నియంత్రణను సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘మీ దేవుడు మిమ్మల్ని నా చేతినుండి ఎంతమాత్రమూ విడిపించడు.’ హెబ్రీ ప్రయోగం మరింత బలమైన ప్రతికూల ముగింపును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: వక్త మునుపటి వాదన ఆధారంగా తక్షణ హెచ్చరికకు మారుతున్న భావాన్ని సహజమైన తెలుగు సంధానంతో తెలియజేస్తుంది.
- source_word: יַשִּׁיא
  choice: మోసం చేయనివ్వకండి
  rationale: హిజ్కియా ప్రజలను తప్పుదారి పట్టిస్తున్నాడనే వక్త ఆరోపణను నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יַסִּית
  choice: ప్రేరేపించనివ్వకండి
  rationale: ఈ క్రియకు ప్రేరేపించడం, పురికొల్పడం, ఆకర్షించి ఒప్పించడం వంటి భావాలు ఉన్నాయి. ముందున్న 'మోసం'తో కలిసిపోకుండా మూలంలోని వేరొక క్రియను నిలుపుతుంది.
- source_word: כָּזֹאת
  choice: ఈ విధంగా
  rationale: హిజ్కియా మాటల ద్వారా ప్రభావితం చేస్తున్న విధానాన్ని సూచించే ప్రదర్శనార్థక భావాన్ని నిలుపుతుంది.
- source_word: תַּאֲמִינוּ לוֹ
  choice: అతణ్ణి నమ్మకండి
  rationale: ఇక్కడ హిజ్కియా చెప్పే మాటలను నిజమని అంగీకరించవద్దనే సందర్భార్థానికి సహజమైన అనువాదం.
- source_word: כָּל אֱלוֹהַ כָּל גּוֹי וּמַמְלָכָה
  choice: ఏ జనానికిగానీ రాజ్యానికిగానీ చెందిన ఏ దేవుడూ
  rationale: జనాలు, రాజ్యాలకు సంబంధించిన దేవతలందరి గురించి వక్త చేస్తున్న సార్వత్రిక వాదనను స్పష్టమైన తెలుగులో నిలుపుతుంది.
- source_word: לְהַצִּיל
  choice: విడిపించడం
  rationale: శత్రువు అధికారం నుండి రక్షించి బయటకు తేవడం అనే సైనిక సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: מִיַּדִי וּמִיַּד אֲבוֹתָי
  choice: నా చేతిలోనుండి, నా పూర్వికుల చేతిలోనుండి
  rationale: అధికారం లేదా నియంత్రణను సూచించే 'చెయ్యి' అనే హెబ్రీ రూపకాన్ని, దాని పునరుక్తితో సహా నిలుపుతుంది; 'పూర్వికులు' రాజవంశపు ముందువారిని సూచిస్తుంది.
- source_word: אַף כִּי
  choice: అలాంటప్పుడు ... ఎంత అసాధ్యం!
  rationale: మునుపటి వాదన నుండి మరింత బలమైన ప్రతికూల ముగింపుకు తీసుకెళ్లే హెబ్రీ ప్రయోగాన్ని సహజమైన తెలుగు వ్యంగ్య సవాలుగా వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుడు
  rationale: రూపపరంగా బహువచనాకృతి ఉన్నప్పటికీ, సందర్భంలో యూదా ప్రజల ఏకైక దేవుణ్ణే సూచిస్తుంది.
theological_decisions:
- issue: אֱלֹהֵיכֶם యొక్క సంఖ్య మరియు సూచన
  choice: యూదా/ఇశ్రాయేలు దేవుణ్ణి సూచించే ఏకవచనం ‘మీ దేవుడు’
  alternative: రూపపరమైన బహువచనం ‘మీ దేవుళ్లు’
  rationale: ఈ సందర్భంలో వక్త హిజ్కియా నమ్మమని చెప్పిన యెహోవాన్నే లక్ష్యంగా చేసుకుంటున్నాడు. బహువచనంగా అనువదిస్తే కథన సందర్భం తప్పుగా ప్రతిబింబిస్తుంది.
- issue: אַף כִּי లోని ప్రతికూల తీవ్రత
  choice: ‘అలాంటప్పుడు ... ఎంత అసాధ్యం!’ అనే వాదనాత్మక, తీవ్ర ప్రతికూల ముగింపు
  alternative: ‘మీ దేవుడు తప్పకుండా విడిపించడు’ అనే ప్రత్యక్ష ప్రకటన
  rationale: మూలంలోని పోలికాధారిత వ్యంగ్య వాదనను నిలుపుతూ, అది సన్హెరీబు ప్రతినిధి పలికిన దూషణాత్మక సవాలు అని స్పష్టంగా వినిపిస్తుంది; కథకుడి సమ్మతిగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి ఉపయోగించబడింది. వక్త పలికే గర్వపూరిత సవాలు కథకుడి స్వరంగా మారకుండా ఉంచబడింది. ‘చెయ్యి’ రూపకం మూలానికి సమీపంగా నిలుపబడి పాదటీపులో వివరణ ఇవ్వబడింది.
