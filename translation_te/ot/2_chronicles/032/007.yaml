source:
  edition: WLC
  text: חִזְק֣וּ וְ/אִמְצ֔וּ אַל תִּֽירְא֣וּ וְ/אַל תֵּחַ֗תּוּ מִ/פְּנֵי֙ מֶ֣לֶךְ אַשּׁ֔וּר וּ/מִ/לִּ/פְנֵ֖י כָּל הֶ/הָמ֣וֹן אֲשֶׁר עִמּ֑/וֹ כִּֽי עִמָּ֥/נוּ רַ֖ב מֵ/עִמּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/007.yaml
  text: Be strong and courageous[a]. Do not fear or be dismayed before the king of Assyria or before all the multitude that is with him[b], for there are more with us than with him.
translation:
  language: te
  text: “బలంగా, ధైర్యంగా ఉండండి. అష్షూరు రాజును గానీ, అతనితో ఉన్న ఆ జనసమూహమంతటిని గానీ[a] చూసి భయపడకండి, హడలిపోకండి. ఎందుకంటే అతనితో ఉన్నవారికంటే మనతో ఉన్నవారే ఎక్కువ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతనితో ఉన్న సైన్యమంతటిని.” ఇక్కడి హీబ్రూ పదం జనసమూహాన్ని లేదా సందర్భానుసారం విస్తారమైన సైనిక దండును సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “మనతో ఉన్నది అతనితో ఉన్నదానికంటే ఎక్కువ.” ఇది హీబ్రూలో సంక్షిప్తంగా ఉన్న తులన; దాని భావాన్ని తరువాతి వచనం మరింత స్పష్టం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ וְאִמְצוּ
  choice: బలంగా, ధైర్యంగా ఉండండి
  rationale: ఈ జంట ఆజ్ఞలు బలం, ధైర్యం కలిగి ఉండమనే సుపరిచిత ప్రోత్సాహక సూత్రాన్ని వ్యక్తం చేస్తాయి. తెలుగులో రెండు భావాలనూ సహజంగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: אַל תִּירְאוּ וְאַל תֵּחַתּוּ
  choice: భయపడకండి, హడలిపోకండి
  rationale: మొదటి క్రియ భయాన్ని, రెండవది ముప్పు ఎదుట మనోధైర్యం చెదిరిపోవడాన్ని సూచిస్తుంది. ‘హడలిపోకండి’ సైనిక ముప్పు సందర్భంలో సహజమైన ఆధునిక తెలుగు.
- source_word: מִפְּנֵי ... וּמִלִּפְנֵי
  choice: …ను గానీ …ను గానీ చూసి
  rationale: భయాన్ని కలిగించే వ్యక్తి లేదా సమూహం ఎదుట/వారి కారణంగా అనే హీబ్రూ ప్రయోగాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజు
  rationale: నిర్మాణ సంబంధాన్ని నేరుగా, తెలుగు పదక్రమానికి అనుగుణంగా అందిస్తుంది.
- source_word: כָּל הֶהָמוֹן אֲשֶׁר עִמּוֹ
  choice: అతనితో ఉన్న ఆ జనసమూహమంతటిని
  rationale: הָמוֹן అనే పదానికి జనసమూహం, విస్తారమైన గుంపు, సందర్భానుసారం సైనిక దండు అనే పరిధి ఉంది. ప్రధాన పాఠంలో విస్తృతార్థాన్ని ఉంచి, సైనిక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: כִּי עִמָּנוּ רַב מֵעִמּוֹ
  choice: ఎందుకంటే అతనితో ఉన్నవారికంటే మనతో ఉన్నవారే ఎక్కువ
  rationale: హీబ్రూలోని సంక్షిప్త తులనను సహజమైన తెలుగులో స్పష్టం చేస్తుంది; తరువాతి వచనంలోని వివరణను ముందుగానే ఈ వచనంలోకి దిగుమతి చేయదు.
theological_decisions:
- issue: చివరి భాగంలోని సంక్షిప్త తులన
  choice: అతనితో ఉన్నవారికంటే మనతో ఉన్నవారే ఎక్కువ
  alternative: అతనితో ఉన్నవానికంటే మనతో ఉన్నవాడు గొప్పవాడు
  rationale: హీబ్రూ వాక్యం అక్షరార్థంగా ‘మనతో [ఉన్నది/ఉన్నవారు] అతనితో [ఉన్నది/ఉన్నవారు] కంటే ఎక్కువ’ అనే అసంపూర్ణ తులనను ఇస్తుంది. ఈ సందర్భం రెండు వైపుల బలగాలు లేదా సహాయక శక్తులను పోలుస్తోంది; ఏకవచన వ్యక్తిగత రూపాన్ని ఎంచుకోవడం మూలంలో స్పష్టంగా లేని భావాన్ని నిర్ణయించినట్లవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ప్రోత్సాహక శైలి వాడబడింది. ‘హడలిపోకండి’ ముప్పు ఎదుట కలిగే తీవ్ర కలవరాన్ని సహజంగా తెలియజేస్తుంది; ‘జనసమూహం’ మూలపదంలోని విస్తృతార్థాన్ని కాపాడుతుంది.
