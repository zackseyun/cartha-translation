source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יְחִזְקִיָּ֖הוּ וַ/חֲסָדָ֑י/ו הִנָּ֣/ם כְּתוּבִ֗ים בַּ/חֲז֞וֹן יְשַֽׁעְיָ֤הוּ בֶן אָמוֹץ֙ הַ/נָּבִ֔יא עַל סֵ֥פֶר מַלְכֵי יְהוּדָ֖ה וְ/יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/032.yaml
  text: The rest of the acts of Hezekiah and his faithful deeds—behold[a], they are written in the vision of Isaiah son of Amoz, the prophet, in the Book of the Kings of Judah and Israel.
translation:
  language: te
  text: హిజ్కియాకు సంబంధించిన మిగిలిన కార్యాలు, అతని నిష్ఠగల కార్యాలు—ఇదిగో[a], అవి ఆమోజు కుమారుడైన యెషయా ప్రవక్త దర్శనంలోను, యూదా మరియు ఇశ్రాయేలు రాజుల గ్రంథంలోను రాయబడి ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని ఒడంబడిక పట్ల నమ్మకమైన కార్యాలు,’ లేదా ‘అతని విశ్వాసపాత్రమైన కార్యాలు.’ హీబ్రూ పదం నిష్ఠగల, విశ్వాసపాత్రమైన దయ అనే భావాన్ని కూడా కలిగి ఉండగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְחִזְקִיָּהוּ
  choice: హిజ్కియా చేసిన మిగిలిన కార్యాలు
  rationale: రాజుల చరిత్రసారాంశాల్లో דִּבְרֵי అనేది కేవలం మాటలను కాకుండా కార్యాలు లేదా వ్యవహారాలను సూచిస్తుంది. తెలుగు వాక్య సహజత్వం కోసం వ్యక్తి పేరుతో ‘చేసిన’ చేర్చబడింది.
- source_word: וַחֲסָדָיו
  choice: అతని విశ్వాసపాత్రమైన క్రియలు
  rationale: חֶסֶד లోని నమ్మకత్వం, విధేయత, విశ్వసనీయమైన దయ అనే భావపరిధిని ఇక్కడ రాజు ప్రవర్తనకు అన్వయిస్తూ, సాంకేతిక ఒడంబడిక భావాన్ని అతిగా నిర్ధారించకుండా వ్యక్తపరుస్తుంది.
- source_word: הִנָּם
  choice: ఇదిగో, అవి
  rationale: తరువాతి విషయంపై దృష్టి నిలిపే హీబ్రూ ప్రదర్శనార్థక నిపాతపు వాక్చాతుర్యాన్ని ‘ఇదిగో’ నిలుపుతుంది.
- source_word: כְּתוּבִים
  choice: రాయబడి ఉన్నాయి
  rationale: నిష్క్రియార్థక ‘written’ భావాన్ని నేరుగా, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בַּחֲזוֹן
  choice: దర్శనంలో
  rationale: חָזוֹן యొక్క ప్రాథమిక అర్థమైన ‘దర్శనం’ను నిలుపుతుంది; దానిని వ్యాఖ్యానాత్మకంగా ‘ప్రవచనం’ లేదా ‘వృత్తాంతం’గా మార్చదు.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: ఆమోజు కుమారుడైన యెషయా ప్రవక్త
  rationale: వంశసంబంధాన్నీ ప్రవక్తగా అతని పదవినీ సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: עַל סֵפֶר מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: యూదా మరియు ఇశ్రాయేలు రాజుల గ్రంథంలో
  rationale: ఈ గ్రంథసూచన సూత్రంలో עַל కలుపుతున్న లిఖిత ఆధార భావాన్ని తెలుగులో సహజంగా ‘గ్రంథంలో’ అని అందిస్తుంది; ‘మీద’ అనే పదశః రూపం అసహజంగా ఉంటుంది.
theological_decisions:
- issue: హిజ్కియా క్రియలకు వర్తించిన חֶסֶד యొక్క భావం
  choice: విశ్వాసపాత్రమైన క్రియలు
  alternative: ఒడంబడిక నమ్మకత్వపు క్రియలు; నిష్ఠగల కార్యాలు; మంచి కార్యాలు
  rationale: ఈ పదంలో సంబంధపరమైన నిష్ఠ, నమ్మకత్వం ఉన్నాయి. అయితే మానవ రాజు కార్యాల సందర్భంలో స్పష్టంగా లేని సాంకేతిక ఒడంబడిక భావాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చకుండా, అసలు భావపరిధిని నిలుపుతుంది.
- issue: חָזוֹן అనే రచనాసూచన యొక్క స్వరూపం
  choice: దర్శనం
  alternative: ప్రవచనం; వృత్తాంతం
  rationale: మూలపదం ప్రవచనాత్మక దర్శనాన్ని లేదా దానిని కలిగిన లిఖిత రచనను సూచించగలదు. ‘దర్శనం’ ఆ ఉద్దేశపూర్వక అస్పష్టతను వ్యాఖ్యానంతో పరిష్కరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; చరిత్రసారాంశానికి తగిన గౌరవప్రదమైన శైలి. ‘ఇదిగో’ మూలంలోని దృష్టి ఆకర్షించే నిపాతాన్ని నిలుపుతుంది. వ్యక్తి, ప్రదేశ పేర్లు సాధారణ తెలుగు బైబిలు రూపాలకు అనుగుణంగా ఇవ్వబడ్డాయి.
