id: 2CH.32.11
reference: 2 Chronicles 32:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ/לֹ֤א יְחִזְקִיָּ֨הוּ֙ מַסִּ֣ית אֶתְ/כֶ֔ם לָ/תֵ֣ת אֶתְ/כֶ֔ם לָ/מ֛וּת בְּ/רָעָ֥ב וּ/בְ/צָמָ֖א לֵ/אמֹ֑ר יְהוָ֣ה אֱלֹהֵ֔י/נוּ יַצִּילֵ֕/נוּ מִ/כַּ֖ף מֶ֥לֶךְ אַשּֽׁוּר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/011.yaml
  text: Is not Hezekiah misleading you[a], to give you over to die by famine and by thirst, saying, ‘Yahweh our God will deliver us from the hand of the king of Assyria’?”
translation:
  language: te
  text: “‘మన దేవుడైన యాహ్వే అష్షూరు రాజు చేతిలోనుండి మనల్ని విడిపిస్తాడు’ అని చెబుతూ, హిజ్కియా మిమ్మల్ని తప్పుదారి పట్టించి[a], కరవుతోనూ దాహంతోనూ చనిపోయేలా మిమ్మల్ని అప్పగిస్తున్నాడు కదా?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మోసగించి”; లేదా “ప్రలోభపెట్టి.” హీబ్రూ క్రియకు ఒకరిని దారితప్పించడం లేదా తప్పుగా ఒప్పించడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: కదా?
  rationale: సమ్మతిని ఆశించే ఆరోపణాత్మక అలంకార ప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מַסִּית
  choice: తప్పుదారి పట్టించి
  rationale: సూత్ ధాతువు హిఫీల్ రూపంలోని ‘దారితప్పేలా చేయడం/తప్పుగా ఒప్పించడం’ అనే విస్తృత భావాన్ని కాపాడుతుంది; ‘మోసగించడం’ అనే ఉద్దేశపూర్వక వంచన భావానికే పరిమితం చేయదు.
- source_word: לָתֵת אֶתְכֶם לָמוּת
  choice: చనిపోయేలా మిమ్మల్ని అప్పగిస్తున్నాడు
  rationale: ఒక దుర్గతికి వదిలివేయడం అనే נתן ప్రయోగ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, మరణం అనే ఫలితాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: בְּרָעָב וּבְצָמָא
  choice: ఆకలితోనూ దాహంతోనూ
  rationale: ముట్టడి సందర్భంలోని మరణ సాధనాలను తెలుగులో సహజంగా తెలుపుతుంది; రెండు హీబ్రూ ఉపసర్గల సమాంతరతను ‘తోనూ…తోనూ’ కాపాడుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి తెలుగు లిప్యంతరీకరణగా అందిస్తుంది.
- source_word: יַצִּילֵנוּ
  choice: మనల్ని విడిపిస్తాడు
  rationale: సైనిక ప్రమాదం లేదా అధికారం నుండి రక్షించి బయటకు తేవడం అనే హిఫీల్ భావానికి సందర్భోచితమైన తెలుగు పదప్రయోగం.
- source_word: מִכַּף מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజు చేతిలోనుండి
  rationale: ‘చేతి’ అనే హీబ్రూ అధికార/నియంత్రణ నుడికారాన్ని తెలుగులో కూడా అర్థమయ్యే విధంగా కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగు లిప్యంతరీకరణతో ఇవ్వడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: హిజ్కియా మాటలపై రబ్షాకే చేసిన ఆరోపణ
  choice: ఆరోపణాత్మక ప్రశ్నగానే ఉంచడం
  alternative: హిజ్కియా నిజంగానే మోసగిస్తున్నాడనే నిర్ధారక వాక్యంగా మార్చడం
  rationale: ఇది వక్త చేసిన ప్రచారాత్మక ఆరోపణ; కథకుని ధార్మిక తీర్పుగా మారకుండా హీబ్రూ అలంకార ప్రశ్నను కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా, ఆరోపణాత్మక స్వరం, పునరుక్త కర్మ, మరణానికి అప్పగించే భావం, దైవ నామం అన్నిటినీ నిలిపింది.
