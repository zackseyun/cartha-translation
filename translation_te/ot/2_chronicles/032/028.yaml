  source_fidelity: 'మూల హెబ్రీయులోని జాబితా నిర్మాణం విశ్వసనీయంగా ప్రతిఫలించింది: ధాన్యం, తీరోష్, నూనెల దిగుబడులకు గిడ్డంగులు; అన్ని రకాల పెంపుడు జంతువులకు కొట్టాలు; మందలకు దొడ్లు. לְכָל בְּהֵמָה וּבְהֵמָהలోని పంపిణీ/సమగ్ర భావాన్ని ‘అన్ని రకాల పశువులకు’ సహజంగా తెలియజేస్తుంది. עֲדָרִים לָאֲוֵרוֹתలోని ‘మందలు—వాటి ఆవరణలు’ సంబంధాన్ని తెలుగు పదక్రమంలో ‘మందలకు దొడ్లు’గా సరిగ్గా వ్యక్తం చేసింది.'
