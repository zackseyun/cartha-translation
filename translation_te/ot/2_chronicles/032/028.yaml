id: 2CH.32.28
reference: 2 Chronicles 32:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִ֨סְכְּנ֔וֹת לִ/תְבוּאַ֥ת דָּגָ֖ן וְ/תִיר֣וֹשׁ וְ/יִצְהָ֑ר וְ/אֻֽרָוֺת֙ לְ/כָל בְּהֵמָ֣ה וּ/בְהֵמָ֔ה וַ/עֲדָרִ֖ים לָ/אֲוֵרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/028.yaml
  text: storehouses for the produce of grain[a], new wine, and oil, and stalls for all kinds of animals[c][b], and folds for the flocks.
translation:
  language: te
  text: ధాన్యం, కొత్త ద్రాక్షారసం[b], నూనె వంటి పంట దిగుబడులను నిల్వచేయడానికి గిడ్డంగులు[a], అన్ని రకాల పశువులకు కొట్టాలు, మందలకు దొడ్లు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నిల్వ పట్టణాలు’; מִסְכְּנוֹת అనే పదం సాధారణ గిడ్డంగులకన్నా పెద్ద నిల్వ సముదాయాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘కొత్త ద్రాక్షారసం’ అని అనువదించిన תִירוֹשׁ అనే పదం వ్యవసాయ జాబితాల్లో సాధారణ ద్రాక్షారస పదాలనుంచి తరచుగా భేదింపబడుతుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘మందల ఆవరణలు’; אֲוֵרוֹת మందలను ఉంచే చుట్టుముట్టిన స్థలాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְכְּנוֹת
  choice: గిడ్డంగులు
  rationale: వ్యవసాయ దిగుబడులను నిల్వచేసే సదుపాయాలను ఈ సందర్భంలో సహజంగా సూచిస్తుంది; విస్తారమైన నిల్వ సముదాయాలు లేదా నిల్వ పట్టణాలు అనే భావం కూడా సాధ్యమే.
- source_word: תְבוּאַת דָּגָן
  choice: ధాన్యం వంటి పంట దిగుబడులు
  rationale: תְבוּאָה పంట దిగుబడిని, דָּגָן ధాన్యాన్ని సూచిస్తాయి. తరువాతి ద్రాక్షారసం, నూనెతో కలిసి వ్యవసాయ ఉత్పత్తుల జాబితాగా తెలుగులో సహజంగా అమర్చబడింది.
- source_word: תִירוֹשׁ
  choice: కొత్త ద్రాక్షారసం
  rationale: వ్యవసాయ జాబితాల్లో సాధారణ ద్రాక్షారస పదాలనుంచి భేదింపబడే, తాజాగా ఉత్పత్తైన ద్రాక్షారసాన్ని సూచించే సంప్రదాయ భావాన్ని నిలుపుతుంది.
- source_word: יִצְהָר
  choice: నూనె
  rationale: ఈ వ్యవసాయ త్రయంలో సాధారణంగా ఒలీవ నూనెను సూచించినా, మూలంలోని సంక్షిప్త సాధారణ పదాన్ని అనుసరించి ‘నూనె’ అని అనువదించబడింది.
- source_word: אֻרָוֹת
  choice: కొట్టాలు
  rationale: పశువులను ఉంచే లేదా మేతవేసే స్థలాలను సూచించే విస్తృత పదం; ‘కొట్టాలు’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: לְכָל בְּהֵמָה וּבְהֵמָה
  choice: అన్ని రకాల పశువులకు
  rationale: బెహేమా పద పునరుక్తి పంపిణీ భావాన్ని—ఒక్కో రకమైన పెంపుడు జంతువును—వ్యక్తం చేస్తుంది; దానిని సహజ తెలుగులో ‘అన్ని రకాల పశువులు’గా తెలిపింది.
- source_word: עֲדָרִים
  choice: మందలు
  rationale: ప్రత్యేకంగా గొర్రెలు, మేకలు వంటి చిన్న పశువుల గుంపులను సూచించగల విస్తృత తెలుగు సమానార్థకం.
- source_word: אֲוֵרוֹת
  choice: దొడ్లు
  rationale: మందలను ఉంచే చుట్టుముట్టిన స్థలాలను సూచిస్తుంది; ‘దొడ్లు’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంది.
