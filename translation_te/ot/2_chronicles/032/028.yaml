  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన వ్యవసాయ పదజాలం వాడబడింది. వచనం మునుపటి క్రియపై ఆధారపడిన జాబితా భాగం కావడంతో మూలంలోని నామవాచక శైలిని అలాగే ఉంచింది.
