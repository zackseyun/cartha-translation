  text: כֹּ֣ה אָמַ֔ר סַנְחֵרִ֖יב מֶ֣לֶךְ אַשּׁ֑וּר עַל מָה֙ אַתֶּ֣ם בֹּטְחִ֔ים וְ/יֹשְׁבִ֥ים בְּ/מָצ֖וֹר בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/010.yaml
  text: 'Thus says Sennacherib king of Assyria: On what are you trusting, that you remain under siege in Jerusalem?'
translation:
  language: te
  text: '“అష్షూరు రాజైన సన్హెరీబు ఇలా అంటున్నాడు: మీరు దేనిమీద నమ్మకం ఉంచి యెరూషలేములో ముట్టడిలో ఉండిపోతున్నారు?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל מָה אַתֶּם בֹּטְחִים
  choice: మీరు దేనిని నమ్ముకొని
  rationale: ‘దేనిమీద ఆధారపడుతున్నారు?’ అనే హీబ్రూ ప్రశ్నార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְיֹשְׁבִים
  choice: కూర్చున్నారు
  rationale: יֹשְׁבִים యొక్క ప్రాథమిక అర్థాన్ని నిలుపుతూ, ఇక్కడ ముట్టడిలోనే ఉండిపోవడాన్ని సూచిస్తుంది.
- source_word: בְּמָצוֹר
  choice: ముట్టడిలోనే
  rationale: מָצוֹר ఇక్కడ నగరం ఎదుర్కొంటున్న ముట్టడి స్థితిని సూచిస్తుంది; ‘నే’ ప్రశ్నలోని సవాలు, అపహాస్య ధోరణిని సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజదూత ప్రకటిస్తున్న ప్రత్యక్ష వాక్యానికి తగిన గంభీరతతో, సన్హెరీబు మాటలలోని సవాలు నిలుపబడింది.
