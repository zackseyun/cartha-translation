- from: ఆ రోజుల్లో హిజ్కియా మరణించేంతగా జబ్బుపడ్డాడు. అతడు యెహోవాకు ప్రార్థించాడు; యెహోవా అతనితో మాట్లాడి[a], అతనికి ఒక సూచక క్రియను[b] ఇచ్చాడు.
  to: ఆ రోజుల్లో హిజ్కియా మరణించేంతగా జబ్బుపడ్డాడు. అతడు యెహోవాకు ప్రార్థించాడు; యెహోవా అతనికి పలికి[a], అతనికి సూచకమైన ఒక అద్భుతాన్ని ఇచ్చాడు.[b]
