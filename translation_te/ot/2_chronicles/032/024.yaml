  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם חָלָ֥ה יְחִזְקִיָּ֖הוּ עַד לָ/מ֑וּת וַ/יִּתְפַּלֵּל֙ אֶל יְהוָ֔ה וַ/יֹּ֣אמֶר ל֔/וֹ וּ/מוֹפֵ֖ת נָ֥תַן לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/024.yaml
  text: In those days Hezekiah became sick to the point of death[a], and he prayed to Yahweh[b], and he answered him and gave him a sign.
translation:
  language: te
  text: ఆ రోజుల్లో హిజ్కియా మరణించేంతగా జబ్బుపడ్డాడు. అతడు యెహోవాకు ప్రార్థించాడు; యెహోవా అతనికి పలికి[a], అతనికి సూచకమైన ఒక అద్భుతాన్ని ఇచ్చాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “అతనికి చెప్పి.” సందర్భంలో ఇది హిజ్కియా ప్రార్థనకు యెహోవా ఇచ్చిన ప్రతిస్పందనను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “సూచన,” “అద్భుతం,” లేదా “శకునం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: ఆ రోజుల్లో
  rationale: హీబ్రూ కాలసూచక నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: חָלָה ... עַד לָמוּת
  choice: మరణించేంతగా జబ్బుపడ్డాడు
  rationale: వ్యాధి మరణానికి దారితీసేంత తీవ్రమైందనే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּתְפַּלֵּל אֶל יְהוָה
  choice: యెహోవాకు ప్రార్థించాడు
  rationale: ప్రార్థనను సూచించే సాధారణ క్రియను, దైవనామమైన యెహోవాను నేరుగా నిలుపుతూ అనువదిస్తుంది.
- source_word: וַיֹּאמֶר לוֹ
  choice: యెహోవా అతనితో మాట్లాడి
  rationale: మసొరెటిక్ పాఠంలోని ‘అతనితో చెప్పాడు’ అనే రూపాన్ని ‘జవాబిచ్చాడు’గా వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది; తెలుగులో ‘మాట్లాడి’ సహజంగా ఉంది.
- source_word: מוֹפֵת
  choice: సూచక క్రియ
  rationale: ఇక్కడ నిర్ధారణగా ఇవ్వబడిన అసాధారణ కార్యాన్ని సూచిస్తుంది; ‘సూచన’ మాత్రమే అనడం కంటే క్రియాత్మకతను, ‘అద్భుతం’ అనడం కంటే సంకేతార్థాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: נָתַן לוֹ
  choice: అతనికి ... ఇచ్చాడు
  rationale: נתן అనే సాధారణ ‘ఇచ్చు’ క్రియను ప్రత్యక్షంగా, సహజంగా అనువదిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలపాఠంలో ఉన్న ప్రత్యేక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో నిలుపుతుంది.
- issue: וַיֹּאמֶר לוֹలో కర్త మరియు భావం
  choice: యెహోవా అతనితో మాట్లాడి
  alternative: ఆయన అతనికి జవాబిచ్చి / ఆయన అతనితో చెప్పి
  rationale: హీబ్రూ క్రియ అక్షరార్థంగా ‘చెప్పాడు’; సందర్భం దాన్ని ప్రార్థనకు ప్రతిస్పందనగా చూపినా, ‘జవాబిచ్చాడు’ అని మాత్రమే చేసి మూలంలోని రూపాన్ని నిశ్శబ్దంగా పరిష్కరించలేదు. తెలుగు స్పష్టత కోసం కర్తను పునరుద్ఘాటించింది.
- issue: מוֹפֵת యొక్క భావపరిధి
  choice: సూచక క్రియ
  alternative: సూచన / అద్భుతం / శకునం
  rationale: ఈ సందర్భంలో హిజ్కియాకు ఇచ్చిన నిర్ధారకమైన అసాధారణ సంకేతాన్ని సూచిస్తుంది; పదంలోని ‘సంకేతం’ మరియు ‘అద్భుత కార్యం’ అనే రెండు ఛాయలను కలిపి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన వచనశైలి. మూలంలోని వరుస క్రియలను సహజ తెలుగు వాక్యనిర్మాణంతో అందించింది; నిజమైన పదార్థ భేదాలను పాదసూచికల్లో నిలిపింది.
