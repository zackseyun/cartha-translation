source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֨ב יְחִזְקִיָּ֜הוּ עִם אֲבֹתָ֗י/ו וַֽ/יִּקְבְּרֻ/הוּ֮ בְּֽ/מַעֲלֵה֮ קִבְרֵ֣י בְנֵי דָוִיד֒ וְ/כָבוֹד֙ עָֽשׂוּ ל֣/וֹ בְ/מוֹת֔/וֹ כָּל יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וַ/יִּמְלֹ֛ךְ מְנַשֶּׁ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/033.yaml
  text: And Hezekiah slept with his fathers[a], and they buried him in the upper part of the tombs of the sons of David. And all Judah and the inhabitants of Jerusalem honored him at his death, and Manasseh his son reigned in his place.
translation:
  language: te
  text: హిజ్కియా తన పితరులతో కూడ నిద్రించాడు. దావీదు కుమారుల సమాధుల ఎగువ భాగంలో అతణ్ణి పాతిపెట్టారు.[a] అతడు చనిపోయినప్పుడు యూదా వారందరూ, యెరూషలేము నివాసులూ అతణ్ణి ఘనపరిచారు. అతని స్థానంలో అతని కుమారుడు మనష్షే రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దావీదు వంశస్థుల సమాధుల ఎగువ భాగంలో.” ఇక్కడ “దావీదు కుమారులు” అనేది దావీదు రాజవంశాన్ని సూచిస్తుంది.
    reason: ‘కుమారులు’ అనే మూలపదానికి సందర్భానుసారంగా ఉన్న విస్తృత వంశపారంపర్య భావాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: తన పితరులతో కూడ నిద్రించాడు
  rationale: మరణాన్ని సూచించే సంప్రదాయ రాజవంశీయ హీబ్రూ నానుడిని తెలుగులోనూ నిలుపుతుంది; వెంటనే వచ్చే సమాధి ప్రస్తావన దాని అర్థాన్ని స్పష్టం చేస్తుంది.
- source_word: וַיִּקְבְּרֻהוּ
  choice: అతణ్ణి పాతిపెట్టారు
  rationale: హీబ్రూలోని క్రియ కర్తరి బహువచనంలో ఉంది; నిర్దిష్టంగా చెప్పని బహువచన కర్తను తెలుగు సహజంగా నిలుపుతుంది.
- source_word: בְּמַעֲלֵה
  choice: ఎగువ భాగంలో
  rationale: ఈ పదానికి ‘ఎక్కే దారి/ఎగువ ప్రదేశం’ అనే భావపరిధి ఉంది. సమాధుల సందర్భంలో ‘ఎగువ భాగంలో’ భౌగోళిక భావాన్ని నిలుపుతూ నిర్మాణ వివరాలను ఊహించదు.
- source_word: קִבְרֵי בְנֵי דָוִיד
  choice: దావీదు కుమారుల సమాధులు
  rationale: మూలంలోని ‘దావీదు కుమారులు’ అనే రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని విస్తృత రాజవంశీయ భావాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: וְכָבוֹד עָשׂוּ לוֹ
  choice: అతణ్ణి ఘనపరిచారు
  rationale: ‘అతనికి ఘనత చేశారు’ అనే హీబ్రూ నానుడి భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בְּמוֹתוֹ
  choice: అతడు చనిపోయినప్పుడు
  rationale: మరణ సమయంలో లేదా మరణానంతర సందర్భంలో చేసిన గౌరవాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּל יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: యూదా వారందరూ, యెరూషలేము నివాసులూ
  rationale: ప్రజల సమగ్ర పరిధిని, యెరూషలేములో నివసించేవారిని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: అతని స్థానంలో ... రాజయ్యాడు
  rationale: రాజవంశ వారసత్వాన్ని తెలిపే సూత్రప్రాయ వాక్యాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: రాజుల మరణవార్తలోని నిద్ర రూపకం
  choice: ‘తన పితరులతో కూడ నిద్రించాడు’ అనే నానుడిని నిలిపాం.
  alternative: ‘చనిపోయాడు’
  rationale: ఇది హీబ్రూ రాజవృత్తాంతాల్లోని సంప్రదాయ మరణసూచక నానుడి. దాన్ని సాధారణ ‘చనిపోయాడు’గా మార్చకుండా ఉంచడం మూలంలోని సాహిత్య, వంశపారంపర్య అనుసంధానాన్ని కాపాడుతుంది.
- issue: ‘దావీదు కుమారులు’ అనే పదబంధపు పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘దావీదు కుమారులు’ అని ఉంచి, రాజవంశీయ అర్థాన్ని పాదసూచికలో తెలిపాం.
  alternative: ‘దావీదు వంశస్థులు’
  rationale: హీబ్రూ పదబంధపు ప్రత్యక్ష రూపాన్ని కాపాడుతూ, సందర్భంలో అది దావీదు రాజవంశాన్ని విస్తృతంగా సూచించగలదని పారదర్శకంగా వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక, గౌరవప్రదమైన తెలుగు. ‘పితరులు’ అనే బైబిలీయ పదాన్ని మూలంలోని స్థిర నానుడిని కాపాడేందుకు ఉంచాం; మిగతా వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు సహజంగా తీర్చిదిద్దాం.
