source:
  edition: WLC
  text: וַ/יִּתְחַזַּ֡ק וַ/יִּבֶן֩ אֶת כָּל הַ/חוֹמָ֨ה הַ/פְּרוּצָ֜ה וַ/יַּ֣עַל עַל הַ/מִּגְדָּל֗וֹת וְ/לַ/ח֨וּצָ/ה֙ הַ/חוֹמָ֣ה אַחֶ֔רֶת וַ/יְחַזֵּ֥ק אֶת הַ/מִּלּ֖וֹא עִ֣יר דָּוִ֑יד וַ/יַּ֥עַשׂ שֶׁ֛לַח לָ/רֹ֖ב וּ/מָגִנִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/005.yaml
  text: And he strengthened himself[a], and built up all the wall that was broken down, and raised it up to the towers, and outside he built another wall, and he strengthened the Millo of the city of David[b], and made weapons and shields in abundance.
translation:
  language: te
  text: అతడు తనను తాను బలపరచుకొని, దెబ్బతిన్న ప్రాకారమంతటినీ తిరిగి కట్టాడు; దాన్ని బురుజుల ఎత్తువరకు పెంచాడు[a]. దాని వెలుపల మరొక ప్రాకారాన్ని కట్టాడు. దావీదు నగరంలోని మిల్లోను[b] పటిష్ఠపరిచాడు; ఆయుధాలనూ[c] డాళ్లనూ విస్తారంగా తయారు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యభాగం సంక్షిప్తంగా ఉంది. దీనిని ‘దానిపై బురుజులను ఎత్తుగా కట్టాడు’ అని కూడా అనువదించవచ్చు.
    reason: textual_ambiguity
  - marker: b
    text: ‘మిల్లో’ అంటే బహుశా మట్టితో నింపిన నిర్మాణం, ఎత్తైన వేదిక లేదా ఆధార నిర్మాణం కావచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘ఆయుధాలు’ అనే హీబ్రూ పదాన్ని ‘విసిరే ఆయుధాలు,’ ‘దండాయుధాలు,’ లేదా ‘ఈటెలు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזַּק
  choice: తనను తాను బలపరచుకొని
  rationale: హిత్పయేల్ రూపంలోని ఆత్మనేపద భావాన్ని నిలుపుతూ, హిజ్కియా రక్షణ ఏర్పాట్లకు దృఢంగా పూనుకున్నాడనే సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וַיִּבֶן ... כָּל הַחוֹמָה הַפְּרוּצָה
  choice: దెబ్బతిన్న ప్రాకారమంతటినీ తిరిగి కట్టాడు
  rationale: ప్రాకారంలోని కూలిన లేదా ఛేదించబడిన భాగాల మరమ్మతును స్పష్టంగా తెలియజేస్తుంది; ‘దెబ్బతిన్న’ అనే పదం అతి సాంకేతిక సైనిక పదజాలాన్ని నివారిస్తుంది.
- source_word: וַיַּעַל עַל הַמִּגְדָּלוֹת
  choice: దాన్ని బురుజుల వరకు ఎత్తుగా కట్టాడు
  rationale: హీబ్రూ వాక్యభాగం సంక్షిప్తంగా, వ్యాఖ్యానానికి వీలుగా ఉంది. ముందున్న ప్రాకారాన్నే కర్మగా కొనసాగించి, దానిని బురుజుల ఎత్తు వరకు కట్టాడనే పఠనాన్ని ప్రధాన పాఠ్యంలో ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపింది.
- source_word: וְלַחוּצָה הַחוֹמָה אַחֶרֶת
  choice: దాని వెలుపల మరొక ప్రాకారాన్ని కట్టాడు
  rationale: లַחוּצָה సూచించే వెలుపలి వైపును సహజంగా తెలియజేస్తూ, సందర్భం నుంచి అర్థమయ్యే ‘కట్టాడు’ అనే క్రియను తెలుగులో స్పష్టంగా పునరుక్తం చేసింది.
- source_word: הַמִּלּוֹא
  choice: మిల్లో
  rationale: ఇది యెరూషలేములోని ఒక ప్రత్యేక నిర్మాణం లేదా ప్రదేశానికి సంబంధించిన వివాదాస్పద సాంకేతిక పదం. ఖచ్చితంగా ‘మట్టి నింపు’ లేదా ‘మెట్ల కట్ట’ అని నిర్ణయించకుండా పేరును లిప్యంతరీకరించి, వివరణను పాదసూచికలో ఇచ్చింది.
- source_word: וַיְחַזֵּק
  choice: పటిష్ఠపరిచాడు
  rationale: కోట రక్షణ సందర్భంలో నిర్మాణాన్ని బలపరచడం అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: שֶׁלַח
  choice: ఆయుధాలు
  rationale: ఈ పదం విసిరే ఆయుధాలు, బాణాలు లేదా ఈటెల వంటి వాటిని సూచించగలదు. ఒక నిర్దిష్ట ఆయుధానికి పరిమితం చేయకుండా విస్తృతార్థాన్ని నిలుపుతుంది.
- source_word: לָרֹב וּמָגִנִּים
  choice: డాళ్లను విస్తారంగా
  rationale: లָרֹב తెలిపే అధిక పరిమాణాన్ని ‘విస్తారంగా’ సహజంగా వ్యక్తపరుస్తుంది; מָגֵןకు ఆధునిక ప్రామాణిక తెలుగు పదంగా ‘డాలు’ ఉపయోగించబడింది.
