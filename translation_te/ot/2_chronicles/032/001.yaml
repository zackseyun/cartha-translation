source:
  edition: WLC
  text: אַחֲרֵ֨י הַ/דְּבָרִ֤ים וְ/הָ/אֱמֶת֙ הָ/אֵ֔לֶּה בָּ֖א סַנְחֵרִ֣יב מֶֽלֶךְ אַשּׁ֑וּר וַ/יָּבֹ֣א בִֽ/יהוּדָ֗ה וַ/יִּ֨חַן֙ עַל הֶ/עָרִ֣ים הַ/בְּצֻר֔וֹת וַ/יֹּ֖אמֶר לְ/בִקְעָ֥/ם אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/001.yaml
  text: After these things and this faithfulness[a], Sennacherib king of Assyria came and entered Judah[c][b], and he encamped against the fortified cities and intended to break into them for himself.
translation:
  language: te
  text: ఈ సంగతులు, ఈ నమ్మకత్వం తర్వాత[a], అష్షూరు రాజైన సన్హెరీబు వచ్చి యూదా దేశంలోకి ప్రవేశించాడు. అతడు ప్రాకారాలుగల పట్టణాలకు ఎదురుగా మకాం వేసి, వాటిని బద్దలుకొట్టి తన వశం చేసుకోవాలని ఉద్దేశించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ సంగతులు, ఈ నమ్మకమైన కార్యాలు జరిగిన తర్వాత.” ఇక్కడి హీబ్రూ పదం אֱמֶת కు “సత్యం” లేదా “నమ్మకత్వం” అనే అర్థాలు రావచ్చు; ఈ సందర్భంలో అది ముందుగా చెప్పిన హిజ్కియా నమ్మకమైన ప్రవర్తనను, లేదా ఆ ప్రవర్తనకు సంబంధించిన కార్యాలను సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ చివరి మాటలను “వాటిలోకి చొచ్చుకుపోవాలని ఉద్దేశించాడు” అని కూడా అనువదించవచ్చు. హీబ్రూ ప్రయోగం ఆ పట్టణాలను బద్దలుకొట్టి తన కోసం స్వాధీనం చేసుకోవాలనే ఉద్దేశాన్ని తెలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי הַדְּבָרִים וְהָאֱמֶת הָאֵלֶּה
  choice: ఈ సంగతులు జరిగి, ఈ నమ్మకత్వం కనబడిన తర్వాత
  rationale: కాలక్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, אֱמֶת యొక్క ‘నమ్మకత్వం/విశ్వసనీయ ప్రవర్తన’ భావాన్ని నిలిపింది. హిజ్కియా పేరును మూలవాక్యంలో లేనందున ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజైన సన్హెరీబు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, రాజబిరుదును సహజమైన తెలుగు పదక్రమంలో ఇచ్చింది.
- source_word: וַיָּבֹא בִיהוּדָה
  choice: వచ్చి యూదా దేశంలోకి ప్రవేశించాడు
  rationale: בּוֹא తో కూడిన בְּ ఇక్కడ యూదాలోనికి కదలికను సూచిస్తుంది; ‘ప్రవేశించాడు’ ఆ భావాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: וַיִּחַן עַל הֶעָרִים הַבְּצֻרוֹת
  choice: ప్రాకారాలుగల పట్టణాలకు ఎదురుగా మకాం వేసి
  rationale: חנה על అనే సైనిక సందర్భపు ప్రయోగాన్ని ‘ఎదురుగా మకాం వేశాడు’గా ఇచ్చి, ‘ముట్టడించాడు’ అనే కొంత ఎక్కువ వ్యాఖ్యానాత్మక భావాన్ని ప్రధాన పాఠ్యంలోకి తేలేదు. בְּצֻרוֹת కు రక్షణ ప్రాకారాలున్న పట్టణాలు అనే భావం ఉంది.
- source_word: וַיֹּאמֶר לְבִקְעָם אֵלָיו
  choice: వాటిని బద్దలుకొట్టి తన వశం చేసుకోవాలని ఉద్దేశించాడు
  rationale: וַיֹּאמֶר ఇక్కడ మనసులో నిర్ణయించుకోవడం లేదా ఉద్దేశించడం అనే భావంలో ఉంది; בקע బద్దలుకొట్టడం/చీల్చడం సూచిస్తుంది. אֵלָיו ను తన ప్రయోజనం కోసం వాటిని స్వాధీనం చేసుకోవాలనే దిశార్థక భావంగా సహజీకరించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘ప్రాకారాలుగల పట్టణాలు,’ ‘మకాం వేసి,’ ‘తన వశం చేసుకోవాలని’ వంటి పదబంధాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, సైనిక సందర్భాన్ని స్పష్టంగా ఉంచుతాయి. మూలంలోని అర్థసందిగ్ధతలను పాదటిప్పణుల్లో నిలిపాం.
