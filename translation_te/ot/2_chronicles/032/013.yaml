revisions:
- from: “నేనూ నా పితరులూ వివిధ దేశాల ప్రజలందరికీ ఏమి చేశామో మీకు తెలియదా? ఆ దేశాల జనాల దేవుళ్లు తమ దేశాన్ని నా చేతిలోనుంచి విడిపించగలిగారా?”[a]
  to: “నేనూ నా పితరులూ దేశాల ప్రజలందరికీ ఏమి చేశామో మీకు తెలియదా? ఆ దేశాల ప్రజల దేవుళ్లు వారి దేశాన్ని నా చేతిలోనుండి ఎంతమాత్రమైనా విడిపించగలిగారా?”[a]
  rationale: 'The revision makes two small fidelity improvements without altering the sense: it removes the unneeded descriptive addition “వివిధ” and explicitly conveys the Hebrew emphatic rhetorical question with “ఎంతమాత్రమైనా.” “వారి దేశాన్ని” clarifies that the land belongs to the peoples/nations in view.'
