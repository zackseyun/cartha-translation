id: 2CH.32.13
reference: 2 Chronicles 32:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ/לֹ֣א תֵדְע֗וּ מֶ֤ה עָשִׂ֨יתִי֙ אֲנִ֣י וַ/אֲבוֹתַ֔/י לְ/כֹ֖ל עַמֵּ֣י הָ/אֲרָצ֑וֹת הֲ/יָכ֣וֹל יָֽכְל֗וּ אֱלֹהֵי֙ גּוֹיֵ֣ הָ/אֲרָצ֔וֹת לְ/הַצִּ֥יל אֶת אַרְצָ֖/ם מִ/יָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/013.yaml
  text: Do you not know what I and my fathers have done to all the peoples of the lands? Were the gods of the nations of the lands at all able to deliver their land from my hand?[a]
translation:
  language: te
  text: “నేనూ నా పితరులూ దేశాల ప్రజలందరికీ ఏమి చేశామో మీకు తెలియదా? ఆ దేశాల ప్రజల దేవుళ్లు వారి దేశాన్ని నా చేతిలోనుండి ఎంతమాత్రమైనా విడిపించగలిగారా?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నా పితరులు’ అనే మాటను ‘నా పూర్వీకులు’ అని కూడా అనువదించవచ్చు. హీబ్రూలో రాజవంశ సంబంధమైన కుటుంబ భాష వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא תֵדְעוּ
  choice: మీకు తెలియదా?
  rationale: అంగీకారాన్ని ఆశించే అలంకారిక ప్రశ్నను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מֶה עָשִׂיתִי
  choice: ఏమి చేశామో
  rationale: పూర్తయిన కార్యాలను సూచిస్తుంది; సంయుక్త కర్త ‘నేనూ నా పితరులూ’కు అనుగుణంగా తెలుగులో బహువచన క్రియ సహజం.
- source_word: אֲנִי וַאֲבוֹתַי
  choice: నేనూ నా పితరులూ
  rationale: హీబ్రూ కుటుంబ/వంశపారంపర్య భాషను నిలుపుతుంది; ఇక్కడ రాజవంశ పూర్వీకులు లేదా పూర్వాధికారులు ఉద్దేశించబడి ఉండవచ్చు.
- source_word: לְכֹל עַמֵּי הָאֲרָצוֹת
  choice: వివిధ దేశాల ప్రజలందరికీ
  rationale: ‘దేశాలు’ అనే బహువచన భావాన్ని స్పష్టంగా ఉంచుతూ తెలుగులో సహజంగా ఉంటుంది; సందర్భంలోని శత్రుత్వ భావం క్రియ మరియు ప్రసంగం ద్వారా తెలుస్తుంది.
- source_word: הֲיָכוֹל יָכְלוּ
  choice: విడిపించగలిగారా?
  rationale: హీబ్రూలోని బలమైన అలంకారిక ప్రశ్నను తెలుగు సామర్థ్య క్రియతో వ్యక్తం చేస్తుంది; ప్రశ్న స్వయంగా ‘ఎంతమాత్రమైనా చేయగలిగారా?’ అనే తీవ్రతను మోస్తుంది.
- source_word: אֱלֹהֵי גּוֹיֵ הָאֲרָצוֹת
  choice: ఆ దేశాల జనాల దేవుళ్లు
  rationale: ఆ ప్రాంతాల జనాలు పూజించిన దేవతలను సూచించే సంబంధపద శ్రేణిని తెలుగులో స్పష్టంగా, అతిగా భారంగా కాకుండా అందిస్తుంది.
- source_word: לְהַצִּיל
  choice: విడిపించగలిగారా
  rationale: సైనిక ముప్పు మరియు అధీనత నుంచి రక్షించడం అనే נצל భావాన్ని సందర్భానుకూలంగా వ్యక్తం చేస్తుంది.
- source_word: אֶת אַרְצָם
  choice: తమ దేశాన్ని
  rationale: ప్రతి జాతి తన భూభాగాన్ని సూచించే సమష్టి ఏకవచనాన్ని సహజమైన ప్రతిబింబ సర్వనామంతో తెలుపుతుంది.
- source_word: מִיָדִי
  choice: నా చేతిలోనుంచి
  rationale: శక్తి లేదా అధీనాన్ని సూచించే హీబ్రూ ‘చేతి’ రూపకాన్ని తెలుగులో పారదర్శకంగా నిలుపుతుంది.
theological_decisions:
- issue: అన్యజన రాజు ప్రగల్భంలో ‘దేవుళ్లు’ అనే పదం
  choice: ఎటువంటి అర్హతా పదం జోడించకుండా ‘దేవుళ్లు’ అని అనువదించడం
  alternative: ‘దేవుళ్లని పిలువబడేవారు’ లేదా ‘అని చెప్పుకునే దేవుళ్లు’
  rationale: మాట్లాడుతున్న సన్హెరీబు వాదనను అనువాదం నేరుగా ప్రతిబింబించాలి; అతని మాటల్లో లేని తాత్త్విక వ్యాఖ్యను మూలపాఠ్యంలోకి చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సన్హెరీబు పలికిన సవాలుతో కూడిన అలంకారిక ప్రశ్నల ధాటిని నిలిపి, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం.
