  text: וַ/יִּקְרְא֨וּ בְ/קוֹל גָּד֜וֹל יְהוּדִ֗ית עַל עַ֤ם יְרוּשָׁלִַ֨ם֙ אֲשֶׁ֣ר עַל הַֽ/חוֹמָ֔ה לְ/יָֽרְאָ֖/ם וּֽ/לְ/בַהֲלָ֑/ם לְמַ֖עַן יִלְכְּד֥וּ אֶת הָ/עִֽיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/018.yaml
  text: And they called out loudly in Judean to the people of Jerusalem who were on the wall, to frighten them and to terrify them, so that they might capture the city.
translation:
  language: te
  text: వారు గోడమీద ఉన్న యెరూషలేము ప్రజలకు యూదా భాషలో బిగ్గరగా అరిచారు; వారిని భయపెట్టి కలవరపరచి, నగరాన్ని స్వాధీనం చేసుకోవడానికి ఇలా చేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוּדִית
  choice: యూదుల భాషలో
  rationale: ఇది యూదా ప్రాంత ప్రజల భాషను సూచిస్తుంది; ఆధునిక పాఠకులకు సహజంగా, స్పష్టంగా ఉండే రూపం.
- source_word: בְקוֹל גָּדוֹל
  choice: బిగ్గరగా
  rationale: అక్షరార్థంగా ‘గొప్ప/పెద్ద స్వరంతో’; సందర్భంలో సహజమైన తెలుగు క్రియావిశేషణ రూపం.
- source_word: לְיָרְאָם וּלְבַהֲלָם
  choice: వారిని భయపెట్టి, కలవరపరచి
  rationale: మొదటి క్రియ భయపెట్టడాన్ని, రెండవది దిగ్భ్రాంతి లేదా మానసిక కలవరాన్ని సూచిస్తుంది; రెండింటి భేదాన్ని నిలుపుతుంది.
- source_word: יִלְכְּדוּ אֶת־הָעִיר
  choice: నగరాన్ని పట్టుకోవాలనే
  rationale: לכד అనే క్రియ సైనిక సందర్భంలో నగరాన్ని స్వాధీనం చేసుకోవడం/పట్టుకోవడం అనే భావం ఇస్తుంది; సంక్షిప్తంగా మూలార్థాన్ని నిలుపుతుంది.
theological_decisions: []
