  naturalness: The revised sentence is natural modern standard Telugu and retains the incomplete, forward-continuing syntax of the Hebrew verse. ‘యెరూషలేముపై’ is a more standard and compact expression here than ‘యెరూషలేము మీద.’
  terminology: The established Telugu biblical forms ‘సన్హెరీబు,’ ‘హిజ్కియా,’ and ‘యెరూషలేము’ are retained. The footnote preserves the literal ‘face’ imagery while explaining its idiomatic force without imposing an interpretation beyond resolve for war.
  issues:
