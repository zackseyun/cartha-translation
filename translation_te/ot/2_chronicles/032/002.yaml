translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని అనుసరించాం. వాక్యం తరువాతి వచనంతో కొనసాగుతున్నందున చివర కామా ఉంచాం; [a] గుర్తు ప్రధాన పాఠ్యంలో చేర్చాం.
