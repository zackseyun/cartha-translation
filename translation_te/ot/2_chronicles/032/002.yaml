    issue: The narrative verb is rendered ‘గ్రహించినప్పుడు’ rather than more directly as ‘చూసినప్పుడు.’
    rationale: ראה primarily means ‘saw.’ Although it can imply perception in context, ‘చూసినప్పుడు’ better reflects the source wording and remains idiomatic.
  - severity: low
