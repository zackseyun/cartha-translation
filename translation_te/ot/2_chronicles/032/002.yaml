source:
  edition: WLC
  text: וַ/יַּרְא֙ יְחִזְקִיָּ֔הוּ כִּי בָ֖א סַנְחֵרִ֑יב וּ/פָנָ֕י/ו לַ/מִּלְחָמָ֖ה עַל יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/002.yaml
  text: When Hezekiah saw that Sennacherib had come and that his purpose was to make war against Jerusalem,[a]
translation:
  language: te
  text: సన్హెరీబు వచ్చాడని, యెరూషలేముపై యుద్ధం చేయడమే అతని ఉద్దేశమని హిజ్కియా చూసినప్పుడు,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యెరూషలేముపై యుద్ధం కోసం అతని ముఖం ఉంది.” అంటే, యెరూషలేముపై యుద్ధం చేయాలని అతడు నిశ్చయించుకున్నాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: గ్రహించినప్పుడు
  rationale: ראה అనే క్రియకు ప్రాథమికంగా ‘చూశాడు’ అని అర్థం. అయితే ఇక్కడ హిజ్కియా పరిస్థితిని గుర్తించి దాని ఉద్దేశాన్ని గ్రహించాడనే భావం ఉన్నందున, ఆధునిక తెలుగులో సహజంగా ‘గ్రహించినప్పుడు’ అని అనువదించాం.
- source_word: כִּי
  choice: అనీ
  rationale: హిజ్కియా గ్రహించిన విషయాన్ని పరిచయం చేసే పదంగా ఉన్నందున, తెలుగు పరోక్ష వాక్య నిర్మాణానికి అనుగుణంగా ‘అనీ’ వాడాం.
- source_word: בָא
  choice: వచ్చాడు
  rationale: సన్హెరీబు రావడం హిజ్కియా గ్రహించిన సమయానికి ఉన్న వాస్తవ పరిస్థితిగా చెప్పబడింది. తెలుగు సందర్భంలో సాధారణ భూతకాల రూపం సహజంగా ఉంది.
- source_word: סַנְחֵרִיב
  choice: సన్హెరీబు
  rationale: హీబ్రూ వ్యక్తి పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణను వాడాం.
- source_word: וּפָנָיו
  choice: అతని ఉద్దేశం
  rationale: అక్షరార్థంగా ‘అతని ముఖం’ అయినా, ఇక్కడ ‘ముఖం యుద్ధం వైపు ఉండడం’ అనేది సంకల్పం లేదా నిశ్చిత ఉద్దేశాన్ని తెలిపే హీబ్రూ నుడికారం. ప్రధాన పాఠ్యంలో అర్థాన్ని సహజంగా ఇచ్చి, అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: לַמִּלְחָמָה
  choice: యుద్ధం చేయడమే
  rationale: ‘యుద్ధానికి’ అనే నామవాచక భావాన్ని, ఉద్దేశాన్ని తెలిపే నుడికారంతో కలిపి సహజమైన తెలుగు క్రియారూపంలో వ్యక్తం చేశాం.
- source_word: עַל
  choice: మీద
  rationale: యుద్ధం లక్ష్యంగా ఒక పట్టణం ఉన్న సందర్భంలో עַל శత్రుత్వ దిశను సూచిస్తుంది; తెలుగులో ‘మీద యుద్ధం చేయడం’ సహజమైన ప్రయోగం.
- source_word: יְרוּשָׁלִָם
  choice: యెరూషలేము
  rationale: ఈ స్థలపేరుకు తెలుగులో స్థిరపడిన బైబిలు లిప్యంతరీకరణను వాడాం.
