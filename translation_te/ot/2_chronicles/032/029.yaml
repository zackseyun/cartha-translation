  revision_rationale: సవరణలు అర్థాన్ని మార్చకుండా తెలుగు వాక్యప్రవాహాన్ని మెరుగుపరుస్తాయి. గొర్రెమేకలు మరియు పశువులు అనే రెండు వర్గాలు హెబ్రీయు צֹאן וּבָקָר కు సరిపోతాయి; “విస్తారంగా” లָרֹב యొక్క సమృద్ధి భావాన్ని నిలుపుతుంది. దేవుడు అతనికి గొప్ప సంపద ఇచ్చాడనే స్పష్టమైన దైవ కర్తృత్వాన్ని యథాతథంగా ఉంచాం.
