id: 2CH.32.29
reference: 2 Chronicles 32:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָרִים֙ עָ֣שָׂה ל֔/וֹ וּ/מִקְנֵה צֹ֥אן וּ/בָקָ֖ר לָ/רֹ֑ב כִּ֤י נָֽתַן ל/וֹ֙ אֱלֹהִ֔ים רְכ֖וּשׁ רַ֥ב מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/029.yaml
  text: He also made cities for himself[a], and acquired flocks and herds in abundance, for God had given him very great wealth.
translation:
  language: te
  text: అతడు తన కోసం పట్టణాలను కూడా ఏర్పరచుకున్నాడు. అతనికి గొర్రెమేకలూ పశువులూ విస్తారంగా ఉండేవి; ఎందుకంటే దేవుడు అతనికి ఎంతో గొప్ప సంపదను[a] ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆస్తిని’ లేదా ‘సొత్తును.’
    reason: రְכוּשׁ అనే పదానికి సందర్భంలో సాధ్యమైన సమీప తెలుగు ప్రత్యామ్నాయాలను తెలియజేయడం.
lexical_decisions:
- source_word: וְעָרִים עָשָׂה לוֹ
  choice: అతడు తన కోసం పట్టణాలను కూడా ఏర్పరచుకున్నాడు
  rationale: וְ పదం ముందటి సందర్భంతో అదనపు సంబంధాన్ని చూపుతుంది. עָשָׂה యొక్క విస్తృతమైన ‘చేశాడు/ఏర్పరచాడు’ భావాన్ని సందర్భానుకూలంగా ‘ఏర్పరచుకున్నాడు’ అని ఇచ్చి, לוֹ లోని తన ప్రయోజనార్థక భావాన్ని నిలిపాం; ‘నిర్మించాడు’ అని అనవసరంగా అర్థాన్ని కుదించలేదు.
- source_word: וּמִקְנֵה צֹאן וּבָקָר לָרֹב
  choice: అతనికి గొర్రెమేకల మందలు, పశువుల మందలు విస్తారంగా ఉండేవి
  rationale: מִקְנֵה పశుసంపదను సూచిస్తుంది; צֹאן చిన్న పశువులను, సాధారణంగా గొర్రెలు-మేకలను, בָקָר పెద్ద పశువులను సూచిస్తుంది. హెబ్రీయు నామవాచక నిర్మాణంలో లేని ‘సంపాదించాడు’ అనే క్రియను చేర్చకుండా, సహజమైన తెలుగులో సమృద్ధిని తెలిపాం.
- source_word: כִּי נָתַן לוֹ אֱלֹהִים
  choice: ఎందుకంటే దేవుడు అతనికి ... ఇచ్చాడు
  rationale: כִּי కారణాన్ని పరిచయం చేస్తుంది; నָתַן అనే పూర్తి క్రియను సహజమైన తెలుగు భూతకాలంతో ఇచ్చాం. సంపదకు దేవుడే మూలమని మూలపాఠం చెప్పినదానిని మాత్రమే నిలిపాం.
- source_word: רְכוּשׁ רַב מְאֹד
  choice: ఎంతో విస్తారమైన సంపద
  rationale: רְכוּשׁ ఆస్తి, సొత్తు లేదా భౌతిక సంపదను సూచిస్తుంది. ‘సంపద’ సందర్భానికి సహజంగా సరిపోతుంది; רַב מְאֹד లోని తీవ్రతను ‘ఎంతో విస్తారమైన’ అని వ్యక్తం చేశాం.
theological_decisions:
- issue: హిజ్కియా సమృద్ధికి కారణమైన కర్తృత్వం
  choice: అతని విస్తారమైన సంపదను దేవుడు ఇచ్చాడని స్పష్టంగా అనువదించాం.
  alternative: దేవుడు అతన్ని సంపన్నుణ్ణి చేశాడు.
  rationale: మూలపాఠం దేవుని కర్తృత్వాన్ని నేరుగా చెబుతుంది. అయితే అది చెప్పనంత విస్తృతమైన ‘సమృద్ధి సిద్ధాంతం’ వైపు భావాన్ని పెంచకుండా, ఇచ్చిన సంపదకే వాక్యాన్ని పరిమితం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘గొర్రెమేకలు’ ద్వారా צֹאן యొక్క సమూహార్థాన్ని అతిగా నిర్దిష్టం చేయకుండా స్పష్టం చేశాం; చిన్న పశువులు–పెద్ద పశువులు అనే భేదాన్ని ‘గొర్రెమేకల మందలు, పశువుల మందలు’గా నిలిపాం.
