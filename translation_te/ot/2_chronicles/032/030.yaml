  text: וְ/ה֣וּא יְחִזְקִיָּ֗הוּ סָתַם֙ אֶת מוֹצָ֞א מֵימֵ֤י גִיחוֹן֙ הָֽ/עֶלְי֔וֹן וַֽ/יַּישְּׁרֵ֥/ם לְ/מַֽטָּה מַּעְרָ֖בָ/ה לְ/עִ֣יר דָּוִ֑יד וַ/יַּצְלַ֥ח יְחִזְקִיָּ֖הוּ בְּ/כָֽל מַעֲשֵֽׂ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/030.yaml
  text: It was Hezekiah who stopped up the upper outlet of the waters of Gihon and directed them down to the west side of the city of David[b][a]. And Hezekiah prospered in all his work.
translation:
  language: te
  text: హిజ్కియాయే గీహోను జలాల ఎగువ ప్రవాహద్వారాన్ని[a] మూసివేసి, ఆ నీళ్లను కిందికి, పడమటి దిశగా దావీదు పట్టణానికి మళ్లించాడు[b]. హిజ్కియా తన అన్ని కార్యాలలో విజయవంతమయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గీహోను ఎగువ ఊటను.” హీబ్రూ పదం నీరు వెలువడే స్థలాన్ని లేదా విస్తృతంగా ఊటను, నీటి ప్రవాహాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “కాలువలో ప్రవహింపజేశాడు,” లేదా “నేరుగా ప్రవహించేలా చేశాడు.” హీబ్రూ క్రియ నీళ్లను నేరైన మార్గంలో ఒక దిశగా మళ్లించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא יְחִזְקִיָּהוּ
  choice: హిజ్కియా తానే
  rationale: సర్వనామంతో కూడిన వ్యక్తినామం కర్తకు ఇచ్చిన ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: סָתַם
  choice: మూసివేసి
  rationale: నీరు బయటికి వచ్చే మార్గాన్ని అడ్డగించడం లేదా మూయడం అనే భావాన్ని ఈ సందర్భంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: מוֹצָא מֵימֵי גִיחוֹן הָעֶלְיוֹן
  choice: గీహోను ఎగువ నీటి వెలుపలికి వచ్చే మార్గాన్ని
  rationale: מוֹצָא అనే పదంలోని నీరు బయటికి వచ్చే స్థానం/మార్గం భావాన్ని నిలుపుతూ, అది ఊటనే సూచించే అవకాశాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: וַיַּישְּׁרֵם
  choice: ఆ నీళ్లను … మళ్లించాడు
  rationale: హిఫిల్ రూపంలోని నీటిని నిర్దిష్ట దిశగా నడిపించడం అనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; కాలువలో ప్రవహింపజేశాడు అనే మరింత నిర్దిష్ట భావాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చదు.
- source_word: לְמַטָּה מַּעְרָבָה לְעִיר דָּוִיד
  choice: దావీదు పట్టణపు పడమటి వైపుకు దిగువగా
  rationale: దిగువ దిశనూ పడమటి దిశనూ రెండింటినీ నిలుపుతూ, దావీదు పట్టణంతో ఉన్న స్థాన సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיַּצְלַח
  choice: సఫలుడయ్యాడు
  rationale: చేసిన కార్యాల్లో విజయం పొందడం అనే సందర్భోచిత భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: בְּכָל מַעֲשֵׂהוּ
  choice: తన పనులన్నిటిలో
  rationale: ఏకవచన సమాహార నామమైన ‘అతని పని/కార్యం’ను తెలుగులో సహజమైన సమగ్ర భావంతో అందిస్తుంది.
