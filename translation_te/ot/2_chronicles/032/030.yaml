  to: హిజ్కియాయే గీహోను జలాల ఎగువ ప్రవాహద్వారాన్ని[a] మూసివేసి, ఆ నీళ్లను కిందికి, పడమటి దిశగా దావీదు పట్టణానికి మళ్లించాడు[b]. హిజ్కియా తన అన్ని కార్యాలలో విజయవంతమయ్యాడు.
