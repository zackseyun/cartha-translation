translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా చారిత్రక వర్ణనకు తగిన గౌరవప్రదమైన శైలి పాటించబడింది. హిజ్కియాపై ఉన్న ఉద్ఘాటనను ‘తానే’తో నిలిపి, జలవ్యవస్థకు సంబంధించిన ఖచ్చిత రూపంపై మూలంలోని అనిశ్చితిని పాదసూచికల్లో భద్రపరచాం.
