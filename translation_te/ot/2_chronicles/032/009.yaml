translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్య నిర్మాణాన్ని పూర్తిగా అనుకరించకుండా, మధ్యలోని పరిస్థితి వివరణను దీర్ఘవిరామాలతో ఉంచి ప్రధాన చర్యను స్పష్టంగా చేశాం. పేర్లకు తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపాలు ఉపయోగించాం.
