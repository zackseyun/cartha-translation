source:
  edition: WLC
  text: אַ֣חַר זֶ֗ה שָׁ֠לַח סַנְחֵרִ֨יב מֶֽלֶךְ אַשּׁ֤וּר עֲבָדָי/ו֙ יְר֣וּשָׁלַ֔יְמָ/ה וְ/הוּא֙ עַל לָכִ֔ישׁ וְ/כָל מֶמְשַׁלְתּ֖/וֹ עִמּ֑/וֹ עַל יְחִזְקִיָּ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה וְ/עַל כָּל יְהוּדָ֛ה אֲשֶׁ֥ר בִּ/ירוּשָׁלִַ֖ם לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/009.yaml
  text: After this[a], Sennacherib king of Assyria sent his servants to Jerusalem—while he was before Lachish with all his dominion with him—against Hezekiah king of Judah and against all Judah who were in Jerusalem, saying[b],
translation:
  language: te
  text: 'దీని తరువాత, అష్షూరు రాజైన సన్హెరీబు—తన సమస్త ఆధిపత్యం అతనితో ఉండగా లాకీషుకు వ్యతిరేకంగా ఉన్నప్పుడు[a]—యూదా రాజైన హిజ్కియాకు, యెరూషలేములో ఉన్న యూదావారందరికీ వ్యతిరేకంగా ఇలా చెప్పడానికి తన సేవకులను యెరూషలేముకు పంపాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘లాకీషుకు ఎదురుగా ఉన్నప్పుడు,’ ‘లాకీషును ముట్టడిస్తున్నప్పుడు.’ హీబ్రూలో అక్షరార్థంగా ‘లాకీషు మీద/ఎదురుగా’ అని ఉంది; ఇది సైనిక సందర్భంలోని ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר זֶה
  choice: దీని తరువాత
  rationale: సంఘటనల క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేసే సాధారణ కాలసూచక ప్రయోగం.
- source_word: שָׁלַח
  choice: పంపాడు
  rationale: మూల క్రియ యొక్క ప్రాథమిక అర్థాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: עֲבָדָיו
  choice: తన సేవకులను
  rationale: రాజసంబంధ సందర్భంలో ఇది రాజు సేవకులను లేదా అధికారులను సూచించవచ్చు. ‘సేవకులు’ మూలపదానికి దగ్గరగా ఉండి తెలుగులోనూ సహజంగా ఉంది.
- source_word: יְרוּשָׁלַיְמָה
  choice: యెరూషలేముకు
  rationale: స్థలంవైపు గమనాన్ని సూచించే దిశార్థక రూపాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהוּא עַל לָכִישׁ
  choice: లాకీషుకు ఎదురుగా ఉన్నప్పుడు[a]
  rationale: עַל అనే ఉపసర్గ ఇక్కడ సైనిక సందర్భంలో ఆ పట్టణానికి వ్యతిరేకంగా నిలిచిన స్థితిని సూచిస్తుంది. ‘ముట్టడిస్తున్నప్పుడు’ అని కార్యాన్ని మరీ నిర్దిష్టం చేయకుండా శత్రుత్వభరిత స్థానాన్ని నిలుపుతుంది.
- source_word: וְכָל מֶמְשַׁלְתּוֹ עִמּוֹ
  choice: తన ఆధీనంలోని సమస్త శక్తితో[b]
  rationale: מֶמְשָׁלָה యొక్క పాలన/అధికారం అనే మూలభావాన్నీ, ఈ సైనిక సందర్భంలో అతని ఆధీనంలోని సంపూర్ణ బలాన్నీ తెలుగులో సహజంగా కలిపి వ్యక్తం చేస్తుంది; భావంలోని సందిగ్ధతను పాదసూచికలో ఉంచింది.
- source_word: עַל יְחִזְקִיָּהוּ ... וְעַל כָּל יְהוּדָה
  choice: హిజ్కియాకు ... యూదావారందరికీ వ్యతిరేకంగా
  rationale: రెండుసార్లు వచ్చిన עַל ఈ సందర్భంలో సందేశం కేవలం వారికి ఉద్దేశించబడిందనే కాక శత్రుత్వంతో వారిమీదికి వచ్చిందనే భావాన్ని ఇస్తుంది.
- source_word: אֲשֶׁר בִּירוּשָׁלִַם
  choice: యెరూషలేములో ఉన్న
  rationale: ‘యూదావారందరు’లో యెరూషలేములో ఉన్నవారిని నిర్దిష్టంగా సూచిస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా చెప్పడానికి
  rationale: తదుపరి వచనంలో వచ్చే ప్రత్యక్ష ప్రసంగానికి సహజమైన తెలుగు పరిచయం.
