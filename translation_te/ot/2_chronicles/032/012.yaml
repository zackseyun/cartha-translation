source:
  edition: WLC
  text: הֲ/לֹא הוּא֙ יְחִזְקִיָּ֔הוּ הֵסִ֥יר אֶת בָּמֹתָ֖י/ו וְ/אֶת מִזְבְּחֹתָ֑י/ו וַ/יֹּ֨אמֶר לִֽ/יהוּדָ֤ה וְ/לִֽ/ירוּשָׁלִַ֨ם֙ לֵ/אמֹ֔ר לִ/פְנֵ֨י מִזְבֵּ֧חַ אֶחָ֛ד תִּֽשְׁתַּחֲו֖וּ וְ/עָלָ֥י/ו תַּקְטִֽירוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/012.yaml
  text: Was it not Hezekiah himself who removed his high places and his altars[a], and said to Judah and Jerusalem, saying, ‘Before one altar you shall bow down, and on it you shall burn incense’?”
translation:
  language: te
  text: “ఆయన ఉన్నత స్థలాలను, ఆయన బలిపీఠాలను తొలగించి, ‘మీరు ఒకే బలిపీఠం ఎదుట సాగిలపడాలి, దానిమీద ధూపం వేయాలి’[a] అని యూదా, యెరూషలేము ప్రజలతో చెప్పినవాడు ఈ హిజ్కియానే కాదా?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు ఒకే బలిపీఠం ఎదుట ఆరాధించాలి, దానిమీద అర్పణలను పొగగా పైకి లేపాలి.”
    reason: תִּשְׁתַּחֲווּ అనే పదానికి ‘ఆరాధించాలి’ అనే విస్తృత అర్థం కూడా ఉండవచ్చు; תַּקְטִירוּ ధూపం వేయడాన్ని లేదా అర్పణలను దహించి పొగగా పైకి లేపడాన్ని సూచించవచ్చు.
lexical_decisions:
- source_word: הֲלֹא
  choice: కాదా?
  rationale: గతంలో జరిగిన విషయాన్ని గుర్తుచేస్తూ, ఎదుటివారి సమ్మతిని ఆశించే అలంకార ప్రశ్నను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הוּא יְחִזְקִיָּהוּ
  choice: ఈ హిజ్కియానే
  rationale: సర్వనామంతో కూడిన పేరులోని ఉద్ఘాటనను ‘-ఏ’ ద్వారా నిలుపుతుంది.
- source_word: הֵסִיר
  choice: తొలగించి
  rationale: ఆరాధనా స్థలాలు, బలిపీఠాలను తీసివేసిన చర్యను నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: בָּמֹתָיו
  choice: ఆయన ఉన్నత స్థలాలను
  rationale: బహువచన ప్రత్యయార్థాన్ని నిలుపుతూ, స్థానిక ఆరాధనా ప్రదేశాలకు వాడే సంప్రదాయ పదబంధాన్ని ఉపయోగిస్తుంది. ‘ఆయన’ అనేది వక్త చేసిన చిత్రణను ప్రతిబింబిస్తుంది.
- source_word: מִזְבְּחֹתָיו
  choice: ఆయన బలిపీఠాలను
  rationale: హీబ్రూ పదంలోని తృతీయ పురుష ఏకవచన స్వామ్య ప్రత్యయాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וַיֹּאמֶר לִיהוּדָה וְלִירוּשָׁלִַם לֵאמֹר
  choice: అని యూదా, యెరూషలేము ప్రజలతో చెప్పింది
  rationale: ప్రదేశాల పేర్లు వాటి ప్రజలను సూచించే రూపకాన్ని ఆధునిక తెలుగులో స్పష్టంగా చేస్తుంది; לֵאמֹר భావం ప్రత్యక్ష ఉల్లేఖనంతో సహజంగా వ్యక్తమవుతుంది.
- source_word: לִפְנֵי מִזְבֵּחַ אֶחָד
  choice: ఒకే బలిపీఠం ఎదుట
  rationale: లִפְנֵי యొక్క స్థలార్థాన్ని ‘ఎదుట’తోను, אֶחָד లోని ఏకత్వ ఉద్ఘాటనను ‘ఒకే’తోను నిలుపుతుంది.
- source_word: תִּשְׁתַּחֲווּ
  choice: సాగిలపడి
  rationale: ఆరాధనలో శరీరాన్ని వంచి నమస్కరించే మూల క్రియార్థాన్ని, కేవలం సాధారణ ‘ఆరాధించండి’గా విస్తరించకుండా నిలుపుతుంది.
- source_word: וְעָלָיו תַּקְטִירוּ
  choice: దానిమీదే ధూపం వేయాలి
  rationale: קטר హిఫీల్ రూపానికి సాధారణ ఆరాధనా సందర్భంలో సహజమైన అర్థాన్ని ఇస్తుంది; ‘-ఏ’ ఆ ఒక్క బలిపీఠంపైనే చేయాలనే కేంద్రీకరణను తెలియజేస్తుంది.
theological_decisions:
- issue: ‘ఉన్నత స్థలాలు’, ‘బలిపీఠాలు’ అనే పదాలకు జోడించిన స్వామ్య ప్రత్యయాలు
  choice: ‘ఆయన ఉన్నత స్థలాలను, ఆయన బలిపీఠాలను’ అని అనువదించడం
  alternative: ‘ఉన్నత స్థలాలను, బలిపీఠాలను’ అని స్వామ్యాన్ని తొలగించడం
  rationale: హీబ్రూలోని ప్రత్యయాలు స్పష్టంగా ఉన్నాయి. వాటిని ఉంచడం ద్వారా ఆ స్థలాలు దేవునివేనని చిత్రించే అష్షూరు వక్త యొక్క వాదన నిలుస్తుంది; అనువాదం అతని అపార్థాన్ని సరిదిద్దదు.
- issue: ఒకే బలిపీఠం వద్ద ఆరాధనను కేంద్రీకరించడం
  choice: హిజ్కియా ఆజ్ఞను వివరణ లేకుండా ‘ఒకే బలిపీఠం’ అనే రూపంలో ఉంచడం
  alternative: దేవాలయ బలిపీఠం వద్ద మాత్రమే ధర్మబద్ధమైన ఆరాధన చేయాలని వివరణాత్మకంగా చెప్పడం
  rationale: వచనం అష్షూరు వక్త చేసిన ఆరోపణను నివేదిస్తుంది; హిజ్కియా సంస్కరణను సమర్థించే వ్యాఖ్యను మూలవాక్యంలో చేర్చకూడదు.
- issue: קטר క్రియలోని ఆరాధనా అర్థ పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘ధూపం వేయాలి’
  alternative: ‘అర్పణలను పొగగా పైకి లేపాలి’
  rationale: ఈ క్రియ ధూపం వేయడానికీ, అర్పణను పొగగా పైకి లేపడానికీ వాడబడగలదు. ప్రధాన పాఠ్యంలో సహజమైన భావాన్ని ఎంచుకుని, విస్తృత ఆరాధనా అర్థాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యక్రమం, అయితే ‘బలిపీఠం’, ‘ధూపం’, ‘సాగిలపడడం’ వంటి గౌరవప్రదమైన ఆరాధనా పదజాలం నిలుపబడింది. ‘యూదా, యెరూషలేము ప్రజలు’ అని చెప్పడం ద్వారా ప్రదేశనామాల రూపకార్థం స్పష్టమైంది.
