revisions:
- from: బబులోను అధిపతులు అతని దగ్గరికి పంపిన రాయబారులు దేశంలో జరిగిన సూచకకార్యం[a] గురించి విచారించడానికి వచ్చినప్పుడు కూడా, దేవుడు అతణ్ణి పరీక్షించడానికి[b], అతని హృదయంలో ఉన్నదంతా తెలుసుకోవడానికి అతణ్ణి విడిచిపెట్టాడు.
  to: అలాగే, దేశంలో జరిగిన సూచకము[a] గురించి విచారించడానికి అతని దగ్గరకు పంపిన బబులోను అధిపతుల రాయబారుల విషయంలో కూడా, దేవుడు అతణ్ణి విడిచిపెట్టాడు—అతణ్ణి పరీక్షించడానికి[b], అతని హృదయంలో ఉన్నదంతా తెలుసుకోవడానికి.
  rationale: The revision removes the unsupported “when they came,” restores the connective force of וְכֵן, and uses a more natural Telugu term for מוֹפֵת. “బబులోను అధిపతుల రాయబారులు” retains the source’s diplomatic relationship without making a further interpretive claim about the debated syntactic attachment of the active participle. The testing-and-knowing language and its explanatory footnote are retained.
  reviewer_model: gpt-5.6-terra
