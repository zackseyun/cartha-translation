  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כֵ֞ן בִּ/מְלִיצֵ֣י שָׂרֵ֣י בָּבֶ֗ל הַֽ/מְשַׁלְּחִ֤ים עָלָי/ו֙ לִ/דְרֹ֗שׁ הַ/מּוֹפֵת֙ אֲשֶׁ֣ר הָיָ֣ה בָ/אָ֔רֶץ עֲזָב֖/וֹ הָֽ/אֱלֹהִ֑ים לְ/נַ֨סּוֹת֔/וֹ לָ/דַ֖עַת כָּל בִּ/לְבָבֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/031.yaml
  text: And so[a], in the matter of the envoys of the princes of Babylon, who had been sent to him to inquire about the sign that had happened in the land, God left him, to test him[b], to know all that was in his heart.
translation:
  language: te
  text: అలాగే, దేశంలో జరిగిన సూచకము[a] గురించి విచారించడానికి అతని దగ్గరకు పంపిన బబులోను అధిపతుల రాయబారుల విషయంలో కూడా, దేవుడు అతణ్ణి విడిచిపెట్టాడు—అతణ్ణి పరీక్షించడానికి[b], అతని హృదయంలో ఉన్నదంతా తెలుసుకోవడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అద్భుతం,’ ‘శకునం.’
    reason: lexical_alternative
  - marker: b
    text: ‘అతని హృదయంలో ఉన్నదంతా తెలుసుకోవడానికి’ అనే మాటను మూలంలో ఉన్నట్లే ఉంచాం. కొందరు దీన్ని అతని హృదయంలో ఉన్నదాన్ని ‘బయల్పరచడానికి’ లేదా ‘వెలికితీయడానికి’ అని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֵן
  choice: వచ్చినప్పుడు కూడా
  rationale: ముందటి సందర్భానికి దీనిని అనుసంధానించే హెబ్రీ సంధాన భావాన్ని తెలుగులో సహజంగా సందర్భవాచకంగా వ్యక్తం చేస్తుంది.
- source_word: בִּמְלִיצֵי שָׂרֵי בָּבֶל
  choice: బబులోను అధిపతులు ... పంపిన రాయబారులు
  rationale: מְלִיצֵי ఇక్కడ మధ్యవర్తులు లేదా దౌత్య ప్రతినిధులను సూచిస్తుంది. שָׂרֵי అనే పదానికి రాజకీయ అధికార భావాన్ని నిలుపుతూ ‘అధిపతులు’ అని అనువదించబడింది.
- source_word: הַמְשַׁלְּחִים עָלָיו
  choice: అతని దగ్గరికి పంపిన
  rationale: హెబ్రీ వాక్యనిర్మాణంలోని పంపే/పంపబడే సంబంధాన్ని తెలుగు దౌత్య సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది; బబులోను అధిపతులే రాయబారులను పంపినవారనే భావం స్పష్టమవుతుంది.
- source_word: לִדְרֹשׁ
  choice: విచారించడానికి
  rationale: కేవలం అడగడం కాక, విషయం గురించి తెలుసుకోవడానికి దర్యాప్తు లేదా విచారణ చేయడం అనే דרש భావాన్ని ఇస్తుంది.
- source_word: הַמּוֹפֵת
  choice: సూచకకార్యం
  rationale: מוֹפֵת లోని ‘సూచన’ మరియు అసాధారణ కార్యం అనే రెండు భావాలను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: אֲשֶׁר הָיָה בָאָרֶץ
  choice: దేశంలో జరిగిన
  rationale: హెబ్రీ వాక్యభాగంలోని సంఘటనాత్మక భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עֲזָבוֹ
  choice: అతణ్ణి విడిచిపెట్టాడు
  rationale: עזב అనే పదానికి నేరమైన సమానార్థకం; దేవుడు పూర్తిగా త్యజించాడనే అదనపు సిద్ధాంతార్థాన్ని చేర్చకుండా మూలంలోని ఉద్వేగాన్ని నిలుపుతుంది.
- source_word: לְנַסּוֹתוֹ
  choice: అతణ్ణి పరీక్షించడానికి
  rationale: נסה యొక్క పరీక్షించడం లేదా శోధించడం అనే మూలభావాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לָדַעַת כָּל בִּלְבָבוֹ
  choice: అతని హృదయంలో ఉన్నదంతా తెలుసుకోవడానికి
  rationale: ‘తెలుసుకోవడానికి’ అనే ప్రత్యక్ష అర్థాన్ని, అలాగే హృదయం అంటే అంతరంగ ఉద్దేశాలు మరియు ఆలోచనలు అనే హెబ్రీ నుడికారాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దేవుని పరీక్ష మరియు జ్ఞానాన్ని తెలిపే భాష
  choice: దేవుడు అతణ్ణి పరీక్షించడానికి, అతని హృదయంలో ఉన్నదంతా తెలుసుకోవడానికి అతణ్ణి విడిచిపెట్టాడు
  alternative: దేవుడు అతని హృదయంలో ఉన్నదంతా బయల్పరచడానికి అతణ్ణి తన మానాన విడిచాడు
  rationale: మూల హెబ్రీ పాఠం ‘పరీక్షించడానికి’ మరియు ‘తెలుసుకోవడానికి’ అని నేరుగా చెబుతుంది. దైవ సర్వజ్ఞతకు సంబంధించిన ఉద్వేగాన్ని వివరణాత్మకంగా తొలగించకుండా పాఠంలో ఉన్నట్లే నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘రాయబారులు,’ ‘అధిపతులు,’ ‘సూచకకార్యం’ వంటి పదాలు చారిత్రక-దౌత్య సందర్భాన్ని నిలుపుతాయి.
