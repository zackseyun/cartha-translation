  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. పరిపాలనా భావానికి ‘అధికారులు,’ శౌర్య-సైనిక భావానికి ‘పరాక్రమశాలులు’ వాడబడ్డాయి. మూలంలోని ఉద్దేశం/విషయం మధ్య స్వల్ప వ్యాకరణ సందిగ్ధతను పాదసూచికలో నిలుపుకున్నాం.
