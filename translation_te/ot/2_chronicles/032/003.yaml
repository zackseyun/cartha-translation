source:
  edition: WLC
  text: וַ/יִּוָּעַ֗ץ עִם שָׂרָי/ו֙ וְ/גִבֹּרָ֔י/ו לִ/סְתּוֹם֙ אֶת מֵימֵ֣י הָ/עֲיָנ֔וֹת אֲשֶׁ֖ר מִ/ח֣וּץ לָ/עִ֑יר וַֽ/יַּעְזְרֽוּ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/003.yaml
  text: And he consulted with his officials and his mighty men about stopping up the waters of the springs that were outside the city[a], and they helped him.
translation:
  language: te
  text: అతడు పట్టణం వెలుపల ఉన్న ఊటల నీటిని మూసివేయడం గురించి తన అధికారులతో, పరాక్రమశాలులతో సంప్రదించాడు[a]. వారు అతనికి సహాయం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పట్టణం వెలుపల ఉన్న ఊటల నీటిని మూసివేయడానికి అతడు తన అధికారులతో, పరాక్రమశాలులతో ఆలోచన చేశాడు.’
    reason: לִסְתּוֹם అనే క్రియార్థక రూపం సంప్రదింపుల విషయం (‘గురించి’) లేదా ఉద్దేశం (‘చేయడానికి’)గా అర్థం కావచ్చు; וַיִּוָּעַץ ను ‘ఆలోచన చేశాడు’ అని కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: సంప్రదించాడు
  rationale: יעץ నిఫల్ రూపం ఇతరులతో ఆలోచన చేయడం లేదా సలహా తీసుకోవడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘సంప్రదించాడు’ సహజంగా ఉండి, సమష్టి ఆలోచన భావాన్ని నిలుపుతుంది.
- source_word: שָׂרָיו
  choice: తన అధికారులతో
  rationale: שַׂר అనే పదం సందర్భానుసారం అధికారి, నాయకుడు, సేనాధిపతి లేదా రాజకుమారుడు అని సూచించవచ్చు. ఇక్కడ పరిపాలనా-సైనిక సందర్భంలో ‘అధికారులు’ విస్తృతమైన భావాన్ని తటస్థంగా తెలియజేస్తుంది.
- source_word: גִבֹּרָיו
  choice: పరాక్రమశాలులతో
  rationale: גִּבּוֹר బలవంతుడు, పరాక్రమవంతుడు లేదా యోధుడు అనే భావాలను కలిగి ఉంది. ‘పరాక్రమశాలులు’ హెబ్రీ పదంలోని శౌర్య-సైనిక ఛాయను నిలుపుతూ గౌరవప్రదమైన ఆధునిక తెలుగు ప్రయోగంగా ఉంటుంది.
- source_word: לִסְתּוֹם
  choice: మూసివేయడం గురించి
  rationale: ఈ క్రియారూపం సంప్రదింపుల విషయాన్ని లేదా ఉద్దేశాన్ని సూచించగలదు. ‘సంప్రదించాడు’ తర్వాత ‘మూసివేయడం గురించి’ సహజంగా ఉండి, నీటి మూలాలను భౌతికంగా అడ్డగించే భావాన్ని తెలియజేస్తుంది.
- source_word: מֵימֵי הָעֲיָנוֹת
  choice: ఊటల నీటిని
  rationale: నిర్మాణబద్ధ పదబంధానికి నేరమైన అర్థం ‘ఊటల నీరు.’ భౌగోళిక సందర్భంలో עַיִן కు ‘ఊట’ సహజమైన తెలుగు సమానం.
- source_word: אֲשֶׁר מִחוּץ לָעִיר
  choice: పట్టణం వెలుపల ఉన్న
  rationale: ఈ సంబంధ వాక్యభాగం ఊటలు పట్టణ సరిహద్దుల బయట ఉన్నాయని తెలుపుతుంది. ‘పట్టణం వెలుపల ఉన్న’ స్పష్టమైన, సహజమైన తెలుగు.
- source_word: וַיַּעְזְרֻהוּ
  choice: వారు అతనికి సహాయం చేశారు
  rationale: עזר క్రియకు జోడించిన మూడవ పురుష ఏకవచన ప్రత్యయం ‘అతనికి సహాయం చేశారు’ అని నేరుగా సూచిస్తుంది. బహువచన కర్త ముందున్న అధికారులు, పరాక్రమశాలులు.
