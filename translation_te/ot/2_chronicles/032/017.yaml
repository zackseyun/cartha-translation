source:
  edition: WLC
  text: וּ/סְפָרִ֣ים כָּתַ֔ב לְ/חָרֵ֕ף לַ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/לֵֽ/אמֹ֨ר עָלָ֜י/ו לֵ/אמֹ֗ר כֵּֽ/אלֹהֵ֞י גּוֹיֵ֤ הָ/אֲרָצוֹת֙ אֲשֶׁ֨ר לֹא הִצִּ֤ילוּ עַמָּ/ם֙ מִ/יָּדִ֔/י כֵּ֣ן לֹֽא יַצִּ֞יל אֱלֹהֵ֧י יְחִזְקִיָּ֛הוּ עַמּ֖/וֹ מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/017.yaml
  text: He also wrote letters to mock Yahweh[a], the God of Israel, and to speak against him, saying, “Just as the gods of the nations of the lands have not delivered their people from my hand, so the God of Hezekiah will not deliver his people from my hand.”
translation:
  language: te
  text: 'అతడు ఇశ్రాయేలు దేవుడైన యహ్వేను దూషించడానికి[a], ఆయనకు వ్యతిరేకంగా ఇలా చెప్పడానికి ఉత్తరాలు కూడా రాశాడు: “ఆ దేశాల ప్రజల దేవుళ్లు తమ ప్రజలను నా చేతిలోనుండి విడిపించలేదో, అలాగే హిజ్కియా దేవుడు కూడా తన ప్రజలను నా చేతిలోనుండి విడిపించలేడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిందించడానికి,’ ‘ధిక్కరించడానికి’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియలో అవమానించడం, తిట్టడం అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּסְפָרִים כָּתַב
  choice: ఉత్తరాలు కూడా రాశాడు
  rationale: సְפָרִים ఈ కథన సందర్భంలో లిఖిత ఉత్తరాలను సూచిస్తుంది; וּ కథన కొనసాగింపును తెలియజేస్తున్నందున ‘కూడా’ సహజంగా ఉంది.
- source_word: לְחָרֵף
  choice: దూషించడానికి
  rationale: חרף అంటే అవమానకరంగా నిందించడం లేదా ధిక్కరించడం. ‘దూషించడం’ శత్రుత్వంతో కూడిన మాటల భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: לַיהוָה
  choice: యహ్వేను
  rationale: మూలంలోని దేవుని వ్యక్తిగత నామమైన יהוהను పేరుగానే లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: యహ్వేను ఇశ్రాయేలు దేవునిగా గుర్తించే సంబంధాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో తెలిపింది.
- source_word: וְלֵאמֹר עָלָיו לֵאמֹר
  choice: ఆయనకు వ్యతిరేకంగా ఇలా చెప్పడానికి
  rationale: עָלָיו ఇక్కడ సందర్భానుసారంగా ప్రతికూలంగా మాట్లాడడాన్ని సూచిస్తుంది; పునరుక్త לֵאמֹרను తెలుగులో సహజమైన ఉద్ధరణ పరిచయంగా కుదించింది.
- source_word: כֵּאלֹהֵי גּוֹיֵי הָאֲרָצוֹת
  choice: ఆయా దేశాల జనాల దేవుళ్లు ... పట్టే
  rationale: כֵּ తులనను పరిచయం చేస్తుంది. గּוֹיֵי הָאֲרָצוֹתలోని దేశాలు–జనాలు అనే బహువచన సంబంధాన్ని ‘ఆయా దేశాల జనాలు’ సహజంగా నిలుపుతుంది.
- source_word: אֲשֶׁר לֹא הִצִּילוּ עַמָּם
  choice: తమ ప్రజలను ... విడిపించలేకపోయిన
  rationale: נצל హిఫీల్ రూపం రక్షించి అధికార పరిధి నుంచి విడిపించడాన్ని సూచిస్తుంది. సందర్భంలో ఫలించని రక్షణ ప్రయత్నాన్ని ‘విడిపించలేకపోయిన’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִיָּדִי
  choice: నా చేతిలోనుండి
  rationale: అధికారం లేదా పట్టును సూచించే ‘చేతి’ రూపకాన్ని యథాతథంగా నిలిపింది.
- source_word: כֵּן לֹא יַצִּיל
  choice: అలాగే ... విడిపించలేడు
  rationale: כֵּן తులనకు అనుగుణమైన ఫలిత భాగాన్ని సూచిస్తుంది; రెండు భాగాల్లోనూ ‘విడిపించు’ అనే క్రియను ఉంచడం వాక్చాతుర్య సమాంతరతను కాపాడుతుంది.
- source_word: אֱלֹהֵי יְחִזְקִיָּהוּ
  choice: హిజ్కియా దేవుడు
  rationale: మూలంలోని నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతూ, వక్త యహ్వేను ఇతర జాతుల దేవుళ్లతో సమానంగా చూపే ఎగతాళి ధోరణిని పరిష్కరించకుండా ఉంచుతుంది.
- source_word: עַמּוֹ
  choice: తన ప్రజలను
  rationale: దేవునికి చెందిన ప్రజలను సూచించే ఏకవచన ప్రత్యయాన్ని తెలుగులో సహజంగా తెలిపింది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠం సాధారణ బిరుదుకు బదులు దేవుని ప్రత్యేక నామమైన יהוהను ఉపయోగిస్తుంది; అందువల్ల దానిని పేరుగా లిప్యంతరీకరించడం మూలంలోని గుర్తింపును నిలుపుతుంది.
- issue: ‘హిజ్కియా దేవుడు’ అనే శత్రువు వాడిన సంబోధన
  choice: హిజ్కియా దేవుడు
  alternative: హిజ్కియా ఆరాధించే దేవుడు
  rationale: మూలంలోని సంక్షిప్త నిర్మాణం యహ్వేను ప్రాంతీయ లేదా రాజుకు చెందిన దేవునిగా తగ్గించి చెప్పే వక్త ధోరణిని కలిగి ఉంది. వివరణ జోడించకుండా ఆ ఉద్రిక్తతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించింది. ఉద్ధరణలోని సైనిక బెదిరింపు, తులనాత్మక సమాంతరత, యహ్వేను ‘హిజ్కియా దేవుడు’గా తగ్గించి పలికే ఎగతాళి ధోరణి నిలుపబడ్డాయి.
