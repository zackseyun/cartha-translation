source:
  edition: WLC
  text: וַ/יִּתְפַּלֵּ֞ל יְחִזְקִיָּ֣הוּ הַ/מֶּ֗לֶךְ וִֽ/ישַֽׁעְיָ֧הוּ בֶן אָמ֛וֹץ הַ/נָּבִ֖יא עַל זֹ֑את וַֽ/יִּזְעֲק֖וּ הַ/שָּׁמָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/020.yaml
  text: Then Hezekiah the king and Isaiah son of Amoz[a], the prophet, prayed because of this and cried out to heaven.
translation:
  language: te
  text: అప్పుడు హిజ్కియా రాజు, ఆమోజు కుమారుడైన యెషయా ప్రవక్త ఈ విషయం గురించి ప్రార్థించి, ఆకాశానికి మొరపెట్టారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆకాశాలకు.” హీబ్రూ నామవాచకం రూపరీత్యా బహువచనంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: ప్రార్థించి
  rationale: פלל యొక్క హిత్పయేల్ రూపం సాధారణంగా ‘ప్రార్థించు’ అని అర్థం. మొదటి క్రియ ఏకవచనంలో ఉన్నప్పటికీ, సంయుక్త కర్తను తరువాతి బహువచన క్రియ స్పష్టం చేస్తుంది; తెలుగులో ఇద్దరికీ సహజంగా వర్తించేలా అనువదించబడింది.
- source_word: יְחִזְקִיָּהוּ הַמֶּלֶךְ
  choice: హిజ్కియా రాజు
  rationale: వ్యక్తి పేరుతో కూడిన రాజ బిరుదును మూలంలోని క్రమానికి దగ్గరగా, సహజమైన తెలుగులో నిలిపింది.
- source_word: וִישַׁעְיָהוּ בֶן־אָמוֹץ הַנָּבִיא
  choice: ఆమోజు కుమారుడైన యెషయా ప్రవక్త
  rationale: వంశసంబంధ గుర్తింపును, ప్రవక్త అనే బిరుదును రెండింటినీ స్పష్టంగా నిలిపింది.
- source_word: עַל־זֹאת
  choice: ఈ విషయం గురించి
  rationale: ప్రార్థనకు సంబంధించిన విషయాన్ని సూచించే עַל‌ను ‘గురించి’గా అనువదించడం మూలంలోని సంబంధాన్ని నిలిపి, కారణార్థాన్ని మాత్రమే బలవంతంగా విధించకుండా ఉంటుంది.
- source_word: וַיִּזְעֲקוּ
  choice: మొరపెట్టారు
  rationale: זעקలోని ఆపదతో కూడిన తీవ్ర విజ్ఞాపన భావాన్ని ‘మొరపెట్టు’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַשָּׁמָיִם
  choice: ఆకాశం వైపు
  rationale: హీబ్రూ పదం రూపరీత్యా బహువచనమైనా, దేవునివైపు చేసిన విజ్ఞాపన దిశను ఆధునిక తెలుగులో ‘ఆకాశం వైపు’ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ప్రార్థన సందర్భంలో הַשָּׁמָיִם అనువాదం
  choice: ఆకాశం వైపు
  alternative: ఆకాశాల వైపు
  rationale: ఇది ప్రార్థన పైలోక దిశగా సాగిందని సూచిస్తుంది; విశ్వనిర్మాణంపై అదనపు సిద్ధాంతార్థాన్ని చేర్చదు. రూపరీత్యా ఉన్న బహువచనాన్ని పాదటిప్పణిలో తెలియజేసి, ప్రధాన వాక్యంలో సహజ తెలుగు వాడబడింది.
- issue: עַל־זֹאת యొక్క సంబంధం
  choice: ఈ విషయం గురించి
  alternative: దీని కారణంగా
  rationale: హీబ్రూ ప్రయోగం విషయం లేదా ప్రేరక కారణం రెండింటినీ అనుమతించగలదు. ‘గురించి’ అనేది ప్రార్థన యొక్క విషయాన్ని నేరుగా చూపుతూ, కారణార్థాన్ని అనవసరంగా ఖరారు చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘మొరపెట్టారు’ అత్యవసర విజ్ఞాపన తీవ్రతను నిలుపుతుంది; పేర్లు తెలుగు బైబిలు వాడుకకు అనుగుణంగా ఇవ్వబడ్డాయి.
