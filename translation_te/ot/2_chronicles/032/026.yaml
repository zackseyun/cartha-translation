id: 2CH.32.26
reference: 2 Chronicles 32:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּכָּנַ֤ע יְחִזְקִיָּ֨הוּ֙ בְּ/גֹ֣בַהּ לִבּ֔/וֹ ה֖וּא וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וְ/לֹא בָ֤א עֲלֵי/הֶם֙ קֶ֣צֶף יְהוָ֔ה בִּ/ימֵ֖י יְחִזְקִיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/026.yaml
  text: But Hezekiah humbled himself for the pride of his heart[a], he and the inhabitants of Jerusalem, so the wrath of Yahweh did not come upon them in the days of Hezekiah.
translation:
  language: te
  text: అయితే హిజ్కియా తన హృదయ గర్వాన్ని బట్టి[a] తనను తాను వినయపరచుకున్నాడు; అతడూ యెరూషలేము నివాసులూ తమను తాము వినయపరచుకున్నారు. కాబట్టి హిజ్కియా దినాల్లో యాహ్వే ఉగ్రత వారిమీదికి రాలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన హృదయ గర్వం కారణంగా.” హీబ్రూ పదబంధానికి అక్షరార్థం “తన హృదయపు ఎత్తును బట్టి”; ఇది అంతర్గత గర్వం లేదా అహంకారాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכָּנַע
  choice: తనను తాను తగ్గించుకున్నాడు
  rationale: నిఫాల్ రూపం ఈ సందర్భంలో మధ్యమ/ఆత్మార్థక భావాన్ని కలిగి, హిజ్కియా స్వయంగా అణకువ చూపిన ప్రతిస్పందనను సూచిస్తుంది.
- source_word: בְּגֹבַהּ לִבּוֹ
  choice: తన హృదయ గర్వాన్ని బట్టి
  rationale: గֹבַהּ అక్షరార్థంగా ‘ఎత్తు’; ‘హృదయం’తో కలిసినప్పుడు అంతర్గత గర్వం లేదా అహంకారాన్ని సూచిస్తుంది. בְּ సంబంధాన్ని కారణార్థకంగా గ్రహించవచ్చు; దాని స్వల్ప అస్పష్టతను పాదసూచికలో నిలిపాం.
- source_word: הוּא וְיֹשְׁבֵי יְרוּשָׁלָם
  choice: అతడితో పాటు యెరూషలేము నివాసులు కూడా
  rationale: הוּא హిజ్కియాను ప్రత్యేకంగా ఉద్ఘాటిస్తూ, యెరూషలేము నివాసులను అతనితో కలుపుతుంది. తెలుగులో కర్తలిద్దరికీ క్రియ వర్తిస్తుందని స్పష్టంగా ఉండేందుకు రెండో క్రియను సహజంగా పునరుక్తం చేశాం.
- source_word: קֶצֶף יְהוָה
  choice: యెహోవా ఉగ్రత
  rationale: קֶצֶף తీర్పు సందర్భంలోని తీవ్రమైన దైవకోపాన్ని సూచిస్తుంది; ‘ఉగ్రత’ దాని గంభీరతను సహజ తెలుగులో నిలుపుతుంది. יְהוָהను ఒడంబడిక నామంగా ‘యెహోవా’ అని లిప్యంతరీకరించాం.
- source_word: וְלֹא בָא עֲלֵיהֶם
  choice: వారిమీదికి రాలేదు
  rationale: בוא על అనే ప్రయోగం తీర్పు వ్యక్తుల మీదికి రావడాన్ని సూచిస్తుంది; ఈ అనువాదం మూల రూపకాన్ని కాపాడుతుంది.
- source_word: בִּימֵי יְחִזְקִיָּהוּ
  choice: హిజ్కియా దినాల్లో
  rationale: ఇది హిజ్కియా జీవించిన లేదా పాలించిన కాలాన్ని సూచించే సంప్రదాయ కాలవాచక ప్రయోగం; మరింత నిర్దిష్టతను మూలంలో లేనందున చేర్చలేదు.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుతో మార్చకుండా, తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో నిలిపాం.
- issue: వినయానికి, ఉగ్రత రాకపోవడానికి మధ్య సంబంధం
  choice: అందుచేత
  alternative: మరియు ... రాలేదు
  rationale: వాక్యంలోని వరుస క్రమం హిజ్కియా మరియు ప్రజల అణకువకు తరువాతి ఫలితాన్ని సూచిస్తుంది. అయినా ఇది దైవతీర్పు పూర్తిగా రద్దయిందని కాక, హిజ్కియా దినాల్లో రాలేదని మాత్రమే పాఠం చెబుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. మూలంలోని ఒకే క్రియ ఇద్దరు కర్తలకు వర్తించడాన్ని తెలుగులో సందిగ్ధత లేకుండా చూపేందుకు ‘తమను తాము తగ్గించుకున్నారు’ అని సహజంగా పునరుక్తం చేయబడింది.
