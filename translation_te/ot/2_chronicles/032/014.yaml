id: 2CH.32.14
reference: 2 Chronicles 32:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִ֠י בְּֽ/כָל אֱלֹהֵ֞י הַ/גּוֹיִ֤ם הָ/אֵ֨לֶּה֙ אֲשֶׁ֣ר הֶחֱרִ֣ימוּ אֲבוֹתַ֔/י אֲשֶׁ֣ר יָכ֔וֹל לְ/הַצִּ֥יל אֶת עַמּ֖/וֹ מִ/יָּדִ֑/י כִּ֤י יוּכַל֙ אֱלֹ֣הֵי/כֶ֔ם לְ/הַצִּ֥יל אֶתְ/כֶ֖ם מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/014.yaml
  text: Who among all the gods of these nations that my fathers devoted to destruction was able to deliver his people from my hand[a], that your God should be able to deliver you from my hand?
translation:
  language: te
  text: నా పూర్వికులు నాశనానికి అప్పగించిన ఈ దేశాల దేవుళ్లందరిలో ఎవడు తన ప్రజలను నా చేతిలోనుండి విడిపించగలిగాడు?[a] అలాంటప్పుడు మీ దేవుడు మిమ్మల్ని నా చేతిలోనుండి విడిపించగలడా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా పూర్వికులు పూర్తిగా నాశనం చేయడానికి అర్పించిన.” హీబ్రూ క్రియ దేనినైనా నాశనానికి ప్రత్యేకంగా అప్పగించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הַגּוֹיִם הָאֵלֶּה
  choice: ఈ దేశాల దేవుళ్లందరిలో ఎవడు
  rationale: בְּכָל అనే పదబంధంలోని భాగార్థాన్ని ‘అందరిలో’ సహజంగా తెలియజేస్తుంది; వక్త ఉపయోగించిన ‘దేవుళ్లు’ అనే పదాన్ని వ్యాఖ్యానాత్మకంగా మార్చలేదు.
- source_word: אֲשֶׁר הֶחֱרִימוּ אֲבוֹתַי
  choice: నా పూర్వికులు నాశనానికి అంకితం చేసిన
  rationale: חרם అనే క్రియలో సాధారణంగా నాశనం చేయడం కంటే నాశనానికి ప్రత్యేకంగా అప్పగించడం లేదా అంకితం చేయడం అనే భావం ఉంది. ‘పూర్వికులు’ రాజవంశపు ముందువారిని సహజ ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: יָכוֹל לְהַצִּיל אֶת עַמּוֹ מִיָּדִי
  choice: తన ప్రజలను నా చేతిలోనుండి విడిపించగలిగాడు
  rationale: נצל యొక్క రక్షించి అధికారం నుండి బయటపడే భావాన్ని ‘విడిపించు’ తెలియజేస్తుంది; ‘నా చేతిలోనుండి’ అనే అధికారరూపకాన్ని నిలుపుతుంది.
- source_word: כִּי יוּכַל אֱלֹהֵיכֶם לְהַצִּיל אֶתְכֶם מִיָּדִי
  choice: అలాంటప్పుడు మీ దేవుడు మిమ్మల్ని నా చేతిలోనుండి విడిపించగలడా?
  rationale: כִּי ఇక్కడ ముందటి ప్రశ్ననుండి వచ్చే అవహేళనాత్మక నిర్ధారణను సూచిస్తుంది. తెలుగు ప్రశ్నారూపం వక్త అవిశ్వాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: חרם పదంలోని ప్రత్యేక నాశనార్థం
  choice: నాశనానికి అంకితం చేసిన
  alternative: నాశనం చేసిన; నిషేధానికి గురిచేసిన
  rationale: మూలంలోని ప్రత్యేకంగా నాశనానికి అప్పగించే భావాన్ని ఉంచుతూ, అస్పష్టమైన మతపర సాంకేతిక పదజాలాన్ని నివారిస్తుంది.
- issue: అన్యజనుల దేవతలకు వాడిన אֱלֹהֵי
  choice: దేవుళ్లు
  alternative: విగ్రహాలు; దేవుళ్లని పిలిచేవారు
  rationale: మూల వక్త నేరుగా ‘దేవుళ్లు’ అంటాడు; అనువాదం ‘విగ్రహాలు’ లేదా ‘అనబడేవారు’ అని సంపాదకీయ వ్యాఖ్యను చేర్చదు.
- issue: సన్హెరీబు మాటలోని అవహేళనాత్మక ప్రశ్న
  choice: విడిపించగలడా?
  alternative: విడిపించగలడని అనుకుంటున్నారా?
  rationale: మూలంలోని సామర్థ్యాన్ని ప్రశ్నించే వాక్యాన్ని నిలుపుతూ, మూలంలో లేని ‘అనుకుంటున్నారా’ అనే పదాలను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలి. రాజు పలికే అవహేళనాత్మక సవాలును రెండు సహజ ప్రశ్నలుగా ఉంచాం. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోతుంది.
