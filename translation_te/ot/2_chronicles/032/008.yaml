  text: עִמּ/וֹ֙ זְר֣וֹעַ בָּשָׂ֔ר וְ/עִמָּ֜/נוּ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ לְ/עָזְרֵ֔/נוּ וּ/לְ/הִלָּחֵ֖ם מִלְחֲמֹתֵ֑/נוּ וַ/יִּסָּמְכ֣וּ הָ/עָ֔ם עַל דִּבְרֵ֖י יְחִזְקִיָּ֥הוּ מֶֽלֶךְ יְהוּדָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/008.yaml
  text: With him is an arm of flesh[a], but with us is Yahweh our God, to help us and to fight our battles. And the people relied on the words of Hezekiah king of Judah.
translation:
  language: te
  text: “అతనితో మాంసపు బాహువు[a] ఉంది; కానీ మనకు సహాయం చేయడానికి, మన యుద్ధాలు చేయడానికి మన దేవుడైన యహ్వే మనతో ఉన్నాడు.” యూదా రాజైన హిజ్కియా మాటలపై ప్రజలు ఆధారపడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మానవ శక్తి.’ హీబ్రూలో ‘మాంసపు బాహువు’ అనేది యహ్వే సహాయానికి విరుద్ధంగా కేవలం మానవ బలాన్ని సూచించే రూపకం.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִמּוֹ
  choice: అతనితో ఉన్నది
  rationale: తదుపరి ‘మనతో’ అనే సమాంతర పదబంధాన్ని నిలుపుతూ, సహవాసం లేదా మద్దతును సూటిగా వ్యక్తం చేస్తుంది.
- source_word: זְרוֹעַ בָּשָׂר
  choice: మాంసపు బాహువు
  rationale: కేవలం మానవ శక్తిని దేవుని సహాయంతో వ్యతిరేకంగా చూపే హీబ్రూ రూపకాన్ని ప్రధాన పాఠంలో నిలుపుతుంది.
- source_word: וְעִמָּנוּ
  choice: కానీ మనతో
  rationale: హీబ్రూ సంధి ఈ సందర్భంలో చూపే బలమైన వ్యతిరేకతను సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: మన దేవుడైన యహ్వే
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా లిప్యంతరీకరిస్తూ, אֱלֹהֵינוּను సహజంగా ‘మన దేవుడు’ అని అందిస్తుంది.
- source_word: לְעָזְרֵנוּ
  choice: మనకు సహాయం చేయడానికి
  rationale: לְతో కూడిన క్రియార్థక రూపంలోని ఉద్దేశ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: וּלְהִלָּחֵם מִלְחֲמֹתֵינוּ
  choice: మన యుద్ధాలు చేయడానికి
  rationale: హీబ్రూలోని క్రియతో సమాన మూలం గల కర్మను తెలుగులో అర్థస్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది; ‘మన పక్షంగా’ వంటి అదనపు వివరణను చేర్చదు.
- source_word: וַיִּסָּמְכוּ הָעָם עַל דִּבְרֵי
  choice: మాటలపై ప్రజలు నమ్మకం ఉంచారు
  rationale: ఆధారపడటం అనే మూల రూపక భావాన్ని తెలుగులో సహజమైన నమ్మక వ్యక్తీకరణతో అందిస్తుంది.
- source_word: יְחִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన హిజ్కియా
  rationale: పేరు, పదవి, రాజ్యాన్ని తెలుగులో సహజమైన క్రమంలో పూర్తిగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూల పాఠంలో ఉన్న వ్యక్తిగత దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- issue: మానవ బలానికి, దైవ సహాయానికి మధ్య వ్యత్యాసం
  choice: ‘కానీ’ అనే వ్యతిరేక సంధిని స్పష్టంగా ఉపయోగించడం
  alternative: ‘మరియు’ అనే సముచ్చయ సంధి
  rationale: అష్షూరు రాజు వద్ద ఉన్న మానవ శక్తికి, యూదాకు లభించే యహ్వే సహాయానికి మధ్య వాక్యంలోని అలంకారిక వ్యత్యాసాన్ని స్పష్టంగా తెలియజేస్తుంది.
- issue: ‘మన యుద్ధాలు’ అనే పదబంధంలో దేవుని పాత్ర
  choice: మన యుద్ధాలు చేయడానికి
  alternative: మన పక్షంగా యుద్ధం చేయడానికి
  rationale: దేవుడు సహాయం చేసి యుద్ధం చేస్తాడనే పాఠ్య భావాన్ని నిలుపుతూ, హీబ్రూలో ప్రత్యక్షంగా లేని ‘మన పక్షంగా’ అనే వివరణను ప్రధాన పాఠంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి ఉపయోగించబడింది. ‘మాంసపు బాహువు’ అనే అసాధారణమైనా ముఖ్యమైన మూల రూపకం పాదసూచిక సహాయంతో నిలుపబడింది; మిగతా వాక్య నిర్మాణం సహజ తెలుగు ప్రవాహానికి అనుగుణంగా స్వల్పంగా పునర్వ్యవస్థీకరించబడింది.
