source:
  edition: WLC
  text: וְ/לֹא כִ/גְמֻ֤ל עָלָי/ו֙ הֵשִׁ֣יב יְחִזְקִיָּ֔הוּ כִּ֥י גָבַ֖הּ לִבּ֑/וֹ וַ/יְהִ֤י עָלָי/ו֙ קֶ֔צֶף וְ/עַל יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/025.yaml
  text: But Hezekiah did not repay according to the benefit done to him[a], because his heart was proud; therefore wrath came upon him and upon Judah and Jerusalem.
translation:
  language: te
  text: అయితే హిజ్కియా తనకు జరిగిన మేలుకు తగిన విధంగా ప్రతిస్పందించలేదు[a], ఎందుకంటే అతని హృదయం గర్వంతో ఉప్పొంగింది. అందువల్ల అతని మీద, యూదా మీద, యెరూషలేము మీద ఉగ్రత వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తనకు చూపబడిన దయకు తగిన ప్రతిఫలం చెల్లించలేదు.’ హీబ్రూ వ్యక్తీకరణ పొందిన మేలుకు తగిన తిరుగు స్పందన చేయడాన్ని విస్తృతంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִגְמֻל עָלָיו
  choice: తనకు జరిగిన మేలుకు తగిన
  rationale: גְּמוּל సందర్భానుసారంగా చేసిన మేలు, వ్యవహారం, లేదా ప్రతిఫలాన్ని సూచిస్తుంది. ముందరి సందర్భంలోని స్వస్థత మరియు విడుదల దృష్ట్యా, హిజ్కియాకు జరిగిన మేలు అనే భావం ఇక్కడ సహజం. כִ అనే తులనార్థక ప్రయోగాన్ని ‘తగిన’ అని వ్యక్తం చేశాం.
- source_word: הֵשִׁיב
  choice: ప్రతిఫలం చెల్లించలేదు
  rationale: שוב హిఫిల్ రూపం ‘తిరిగి ఇవ్వడం’ అనే భావాన్ని కలిగిస్తుంది; גמולతో కలిసి పొందిన మేలుకు తగిన విధంగా తిరిగి స్పందించడం లేదా ప్రతిఫలం ఇవ్వడం అనే అర్థం వస్తుంది. కేవలం కృతజ్ఞత చెప్పడానికే భావాన్ని పరిమితం చేయకుండా ఈ ఎంపిక విస్తృతతను నిలుపుతుంది.
- source_word: גָבַהּ לִבּוֹ
  choice: అతని హృదయం గర్వించింది
  rationale: అక్షరార్థంగా ‘అతని హృదయం ఎత్తబడింది/ఉన్నతమైంది’ అనే హీబ్రూ నుడికారం గర్వాన్ని సూచిస్తుంది. ‘హృదయం గర్వించింది’ అంతరంగ నైతిక స్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: קֶצֶף
  choice: ఉగ్రత
  rationale: קֶצֶף తీవ్రమైన కోపాన్ని, తరచుగా దేవుని తీర్పుతో కూడిన ఉగ్రతను సూచిస్తుంది. ‘ఉగ్రత’ తీర్పు సందర్భంలోని తీవ్రతను కాపాడుతుంది.
- source_word: וַיְהִי עָלָיו קֶצֶף
  choice: అతని మీదికి ... ఉగ్రత వచ్చింది
  rationale: హీబ్రూ నిర్మాణం ఉగ్రత అతనిపై ఏర్పడిన ఫలితస్థితిని తెలియజేస్తుంది. ‘మీదికి ... వచ్చింది’ తీర్పు సంభవాన్ని సహజంగా వ్యక్తం చేస్తూ కర్తను అదనంగా చేర్చదు.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: యూదా, యెరూషలేము
  rationale: స్థల నామాలకు ప్రామాణిక తెలుగు లిప్యంతరీకరణను ఉపయోగించాం.
theological_decisions:
- issue: దైవానుగ్రహానికి సంబంధించి హిజ్కియా వైఫల్య స్వభావం
  choice: హిజ్కియా తాను పొందిన మేలుకు తగిన ప్రతిఫలం ఇవ్వలేదు అని విస్తృతంగా అనువదించడం
  alternative: హిజ్కియా తనకు జరిగిన మేలుకు కృతజ్ఞత చెప్పలేదు
  rationale: హీబ్రూ వాక్యం కేవలం మాటలతో కృతజ్ఞత చెప్పకపోవడాన్ని మాత్రమే పేర్కొనదు; పొందిన మేలుకు తగిన ప్రతిస్పందన లేదా తిరిగి చెల్లింపు లేకపోవడాన్ని విస్తృతంగా సూచిస్తుంది.
- issue: ఉగ్రతకు మూలమైన కర్త
  choice: కర్తను స్పష్టంగా చేర్చకుండా ‘ఉగ్రత వచ్చింది’ అని ఉంచడం
  alternative: యెహోవా ఉగ్రత వచ్చింది / దేవుని ఉగ్రత వచ్చింది
  rationale: సందర్భంలో అది దేవుని ఉగ్రత అని సహజంగా అర్థమైనప్పటికీ, ఈ వాక్యంలోని హీబ్రూ ఉపవాక్యం కర్తగా యెహోవాను స్పష్టంగా పేర్కొనదు. అందువల్ల మూలంలోని అంతర్నిహితత్వాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘ప్రతిఫలం చెల్లించలేదు’ అనేది ఆర్థిక లావాదేవీకి మాత్రమే పరిమితం కాకుండా పొందిన మేలుకు తగిన తిరుగు స్పందన అనే సందర్భార్థంలో ఉంది; పాదసూచిక ఈ విస్తృత భావాన్ని స్పష్టం చేస్తుంది.
