id: 2CH.32.21
reference: 2 Chronicles 32:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יְהוָה֙ מַלְאָ֔ךְ וַ/יַּכְחֵ֞ד כָּל גִּבּ֥וֹר חַ֨יִל֙ וְ/נָגִ֣יד וְ/שָׂ֔ר בְּ/מַחֲנֵ֖ה מֶ֣לֶךְ אַשּׁ֑וּר וַ/יָּשָׁב֩ בְּ/בֹ֨שֶׁת פָּנִ֜ים לְ/אַרְצ֗/וֹ וַ/יָּבֹא֙ בֵּ֣ית אֱלֹהָ֔י/ו ו/מ/יציא/ו מֵעָ֔י/ו שָׁ֖ם הִפִּילֻ֥/הוּ בֶ/חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/021.yaml
  text: And the LORD sent an angel, who wiped out every mighty warrior, commander, and officer in the camp of the king of Assyria. So he returned to his own land with shame on his face. And when he entered the house of his god, some of those who came from his own body struck him down there with the sword.
translation:
  language: te
  text: యెహోవా ఒక దూతను పంపాడు. అతడు అష్షూరు రాజు శిబిరంలో ఉన్న పరాక్రమవంతులైన యోధులందరినీ, నాయకులను, అధికారులను నిర్మూలించాడు. దాంతో ఆ రాజు ముఖం చిన్నబుచ్చుకొని తన దేశానికి తిరిగిపోయాడు. అతడు తన దేవుని మందిరంలోకి వెళ్లినప్పుడు, అతని సొంత కడుపున పుట్టినవారిలో కొందరు అక్కడే అతణ్ణి కత్తితో చంపారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאָךְ
  choice: దూత
  rationale: సందర్భంలో యెహోవా పంపిన అతీంద్రియ సందేశవాహకుడు/కార్యనిర్వాహకుడిని సూచిస్తుంది; తెలుగులో సహజమైన బైబిలు పదం.
- source_word: וַיַּכְחֵד
  choice: నిర్మూలించాడు
  rationale: పూర్తిగా తొలగించడం లేదా నాశనం చేయడం అనే బలమైన భావాన్ని నిలుపుతుంది.
- source_word: גִּבּוֹר חַיִל
  choice: పరాక్రమవంతులైన యోధులు
  rationale: సైనిక సందర్భంలో సామర్థ్యమూ శౌర్యమూ గల యోధులను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: נָגִיד וְשָׂר
  choice: నాయకులు, అధికారులు
  rationale: రెండు వేరు నాయకత్వ హోదాలను సాధారణ ఆధునిక తెలుగులో వేరుగా ఉంచుతుంది; ఖచ్చిత సైనిక శ్రేణులు మూలంలో నిర్దిష్టంగా లేవు.
- source_word: בְּבֹשֶׁת פָּנִים
  choice: ముఖం చిన్నబుచ్చుకొని
  rationale: ముఖంపై అవమానం అనే హెబ్రీ జాతీయాన్ని సహజమైన తెలుగు నుడికారంతో అందిస్తుంది.
- source_word: מִיצִיאֵי מֵעָיו
  choice: అతని సొంత కడుపున పుట్టినవారిలో కొందరు
  rationale: అక్షరార్థ శరీర రూపకాన్ని నిలుపుతూ, వారు అతని సంతానమని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: הִפִּילֻהוּ בֶחָרֶב
  choice: అతణ్ణి కత్తితో చంపారు
  rationale: ‘కత్తిచేత పడగొట్టారు’ అనే హెబ్రీ మరణసూచక ప్రయోగాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని పేరుగానే ప్రతిబింబిస్తుంది; సాధారణ బిరుదుతో దానిని కలపదు.
- issue: అష్షూరు సైన్య నిర్మూలనలో కర్త
  choice: దూతనే వ్యాకరణ కర్తగా ఉంచడం
  alternative: యెహోవా నేరుగా వారిని నిర్మూలించాడని చెప్పడం
  rationale: మూల వాక్యంలో యెహోవా దూతను పంపగా, తదుపరి ఏకవచన క్రియకు సహజ పూర్వపదం దూత; దైవ కార్యసాధనలో మధ్యవర్తిత్వాన్ని నిలుపుతుంది.
- issue: రాజును చంపినవారి గుర్తింపు
  choice: అతని సొంత కడుపున పుట్టినవారిలో కొందరు
  alternative: అతని కుమారులు
  rationale: మూలం సంతాన సంబంధాన్ని రూపకంగా చెబుతుంది గాని ఇక్కడ ‘కుమారులు’ అనే నిర్దిష్ట నామాన్ని వాడదు; అందువల్ల మూల విస్తృతిని కాపాడుతుంది.
- issue: ‘తన దేవుని మందిరం’లోని దేవుని స్వరూపం
  choice: తన దేవుడు
  alternative: విగ్రహం లేదా అబద్ధ దేవుడు
  rationale: వివరణాత్మక తీర్పును చేర్చకుండా మూలంలోని సంబంధ సూచనను యథాతథంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. హెబ్రీ శరీర రూపకాన్ని అసహజత తగ్గేలా కొంత వివరణాత్మకంగా నిలిపాం.
