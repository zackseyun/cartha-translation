id: 2CH.32.27
reference: 2 Chronicles 32:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֧י לִֽ/יחִזְקִיָּ֛הוּ עֹ֥שֶׁר וְ/כָב֖וֹד הַרְבֵּ֣ה מְאֹ֑ד וְ/אֹֽצָר֣וֹת עָֽשָׂה ל֠/וֹ לְ/כֶ֨סֶף וּ/לְ/זָהָ֜ב וּ/לְ/אֶ֣בֶן יְקָרָ֗ה וְ/לִ/בְשָׂמִים֙ וּ/לְ/מָ֣גִנִּ֔ים וּ/לְ/כֹ֖ל כְּלֵ֥י חֶמְדָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/027.yaml
  text: And Hezekiah had very great wealth and honor[a], and he made storehouses for silver and gold, precious stones, spices, shields[b], and every desirable article.
translation:
  language: te
  text: హిజ్కియాకు అపారమైన సంపద, ఘనత కలిగాయి. వెండి, బంగారం, రత్నాలు, సుగంధ ద్రవ్యాలు, డాళ్లు, ప్రతి విలువైన వస్తువు కోసం అతడు నిల్వగదులు[a] ఏర్పాటు చేసుకున్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఖజానా గదులు.’ హీబ్రూ పదం సాధారణ నిల్వగదులను గానీ, ప్రత్యేకంగా రాజఖజానా గదులను గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఏర్పాటు చేశాడు’ లేదా ‘నిర్మించాడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִיחִזְקִיָּהוּ
  choice: హిజ్కియాకు ... కలిగాయి
  rationale: ‘ఒకరికి ఉండడం’ అనే హీబ్రూ స్వామ్య ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עֹשֶׁר וְכָבוֹד הַרְבֵּה מְאֹד
  choice: అపారమైన సంపద, ఘనత
  rationale: עֹשֶׁרను ‘సంపద’గా, రాజసంబంధమైన כָבוֹדను సామాజిక గౌరవం, వైభవం రెండింటినీ సూచించగల ‘ఘనత’గా అనువదించి, తీవ్రతను ‘అపారమైన’ ద్వారా సహజంగా తెలిపింది.
- source_word: וְאֹצָרוֹת עָשָׂה לוֹ
  choice: అతడు నిల్వగదులు ఏర్పాటు చేసుకున్నాడు
  rationale: אֹצָרוֹת సాధారణ నిల్వగదులను లేదా ఖజానా గదులను సూచించవచ్చు. עָשָׂהను తప్పనిసరిగా నిర్మాణ క్రియగా సంకుచితం చేయకుండా ‘ఏర్పాటు చేసుకున్నాడు’ అని ఇచ్చింది; לוֹలోని తనకోసం అనే భావమూ నిలిచింది.
- source_word: לְכֶסֶף וּלְזָהָב וּלְאֶבֶן יְקָרָה
  choice: వెండి, బంగారం, రత్నాలు
  rationale: ఏకవచన సమూహార్థక אֶבֶן יְקָרָהను సహజమైన తెలుగు బహువచనం ‘రత్నాలు’గా ఇచ్చింది.
- source_word: וְלִבְשָׂמִים
  choice: సుగంధ ద్రవ్యాలు
  rationale: ఈ పదం సుగంధభరితమైన మసాలాలు, పరిమళ పదార్థాలు వంటి విస్తృత వర్గాన్ని సూచిస్తుంది; ‘సుగంధ ద్రవ్యాలు’ ఆ పరిధిని కాపాడుతుంది.
- source_word: וּלְמָגִנִּים
  choice: డాళ్లు
  rationale: מָגִנִּים సాధారణ యుద్ధ సామగ్రిని కాక ప్రత్యేకంగా డాళ్లను సూచిస్తుంది.
- source_word: וּלְכֹל כְּלֵי חֶמְדָּה
  choice: ప్రతి విలువైన వస్తువు
  rationale: כְּלֵי అనే విస్తృత పదాన్ని పాత్రలకు మాత్రమే పరిమితం చేయకుండా ‘వస్తువు’గా, חֶמְדָּהలోని కోరదగిన/విలువైన భావాన్ని ‘విలువైన’గా తెలిపింది.
theological_decisions: []
translation_notes:
  register: సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యేలా, అయితే రాజవృత్తాంతానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించింది. హీబ్రూ జాబితాలో ప్రతి అంశానికి పునరావృతమయ్యే לְను తెలుగులో ప్రతిసారీ విడిగా పలకకుండా, చివర ‘కోసం’తో మొత్తం జాబితాకు అనుసంధానించింది.
