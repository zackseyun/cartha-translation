source:
  edition: WLC
  text: וַ/יִּקָּבְצ֣וּ עַם רָ֔ב וַֽ/יִּסְתְּמוּ֙ אֶת כָּל הַ/מַּעְיָנ֔וֹת וְ/אֶת הַ/נַּ֛חַל הַ/שּׁוֹטֵ֥ף בְּ/תוֹךְ הָ/אָ֖רֶץ לֵ/אמֹ֑ר לָ֤/מָּה יָב֨וֹאוּ֙ מַלְכֵ֣י אַשּׁ֔וּר וּ/מָצְא֖וּ מַ֥יִם רַבִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/004.yaml
  text: So many people gathered together[a], and they stopped up all the springs and the stream that flowed through the land, saying[b], “Why should the kings of Assyria come and find abundant water?”
translation:
  language: te
  text: 'చాలా మంది ప్రజలు సమకూడి, ఊటలన్నిటినీ, దేశం గుండా ప్రవహిస్తున్న వాగునూ[a] మూసివేశారు. వారు ఇలా అన్నారు: “అష్షూరు రాజులు[b] వచ్చి సమృద్ధిగా నీటిని ఎందుకు పొందాలి?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేశం గుండా ప్రవహిస్తున్న జలమార్గాన్ని.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “అష్షూరు రాజులు.” ఈ బహువచనం అష్షూరు రాజాధికారాన్ని లేదా రాజవంశాన్ని సూచిస్తుండవచ్చు; తక్షణ చారిత్రక సందర్భాన్ని బట్టి కొన్ని అనువాదాలు దీనిని “అష్షూరు రాజు” అని ఏకవచనంలో ఇస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ עַם רָב
  choice: చాలామంది ప్రజలు సమకూడి
  rationale: నిఫాల్ క్రియ సమకూడడాన్ని సూచిస్తుంది; עַם רָב ఇక్కడ ఒక జాతిని కాక పెద్ద సంఖ్యలోని ప్రజలను సూచిస్తుంది.
- source_word: וַיִּסְתְּמוּ
  choice: మూసివేశారు
  rationale: నీటి మూలాలను శత్రువుకు అందకుండా అడ్డుకోవడం లేదా మూయడం అనే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כָּל הַמַּעְיָנוֹת
  choice: ఊటలన్నిటినీ
  rationale: מַעְיָן సహజంగా ఉబికే నీటి ఊటను సూచిస్తుంది; ‘ఊటలు’ ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: הַנַּחַל הַשּׁוֹטֵף
  choice: ప్రవహిస్తున్న వాగు
  rationale: נַחַל వాగు, సెలయేరు లేదా కాలానుగుణ జలమార్గాన్ని సూచించవచ్చు; participle దాని ప్రవాహ స్థితిని తెలియజేస్తుంది. ప్రధాన పాఠంలో ‘వాగు’ సహజంగా ఉంటుంది, ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: בְּתוֹךְ הָאָרֶץ
  choice: దేశం గుండా
  rationale: ఆ జలమార్గం భూభాగం మధ్యగా సాగుతున్న భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לֵאמֹר
  choice: వారు … అన్నారు
  rationale: హీబ్రూ ఉక్తి-పరిచయ పదాన్ని తెలుగులో సహజమైన ప్రత్యక్ష వాక్య నిర్మాణంతో అందిస్తుంది.
- source_word: יָבֹאוּ מַלְכֵי אַשּׁוּר
  choice: అష్షూరు రాజులు వచ్చి
  rationale: మూలంలోని బహువచనాన్ని మార్చకుండా నిలుపుతుంది; ‘అష్షూరు’ మూల నామానికి దగ్గరైన తెలుగు రూపం.
- source_word: וּמָצְאוּ מַיִם רַבִּים
  choice: సమృద్ధిగా నీళ్లు కనుగొనాలి
  rationale: מַיִם רַבִּים విస్తారమైన నీటి సరఫరాను సూచిస్తుంది; వాక్యంలోని వ్యూహాత్మక ఆందోళనను స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: מַלְכֵי אַשּׁוּר అనే బహువచనం
  choice: అష్షూరు రాజులు
  alternative: అష్షూరు రాజు
  rationale: తక్షణ చారిత్రక సందర్భంలో ఒక రాజు ఉద్దేశించబడి ఉండవచ్చని కొందరు భావించినా, మూలపాఠం బహువచనంలో ఉంది. అది అష్షూరు రాజాధికారాన్ని లేదా రాజవంశాన్ని సూచించవచ్చు; అందువల్ల అసలు అస్పష్టతను నిలుపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన వచనశైలిలో అనువదించబడింది. హీబ్రూ బహువచనం మరియు נַחַל పదంలోని భావవిస్తృతిని పాదసూచికల ద్వారా నిలుపుకుంది.
