source:
  edition: WLC
  text: וְ֠/רַבִּים מְבִיאִ֨ים מִנְחָ֤ה לַ/יהוָה֙ לִ/יר֣וּשָׁלִַ֔ם וּ/מִ֨גְדָּנ֔וֹת לִֽ/יחִזְקִיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּנַּשֵּׂ֛א לְ/עֵינֵ֥י כָל הַ/גּוֹיִ֖ם מֵ/אַֽחֲרֵי כֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/023.yaml
  text: And many were bringing an offering to Yahweh in Jerusalem[a], and choice gifts to Hezekiah king of Judah[b], and after this he was exalted in the sight of all the nations.
translation:
  language: te
  text: చాలామంది యెరూషలేములో యాహ్వేకు అర్పణను తీసుకొస్తూ ఉన్నారు[a]. యూదా రాజైన హిజ్కియాకు విలువైన కానుకలను కూడా తీసుకొస్తూ ఉన్నారు[b]. దీని తరువాత అతడు అన్ని జనాంగాల దృష్టిలో గొప్ప గౌరవం పొందాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెరూషలేముకు.” ఈ సందర్భంలో హీబ్రూ విభక్త్యర్థం గమ్యాన్ని గానీ, స్థలాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “శ్రేష్ఠమైన కానుకలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: చాలామంది
  rationale: విశేషణం నామవాచకంగా వాడబడి అనేకమంది ప్రజలను సూచిస్తోంది; ఆధునిక తెలుగులో ‘చాలామంది’ సహజంగా ఉంది.
- source_word: מְבִיאִים
  choice: తీసుకొస్తూ ఉన్నారు
  rationale: హీబ్రూ వర్తమాన కృదంతం గత కథన సందర్భంలో కొనసాగుతున్న చర్యను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ కొనసాగింపు భావాన్ని నిలుపుతుంది.
- source_word: מִנְחָה
  choice: అర్పణ
  rationale: ఈ పదం కానుక లేదా కప్పం అనే అర్థాలను కూడా ఇవ్వగలదు; గ్రహీత యాహ్వే కాబట్టి, అర్పణ రకాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా ‘అర్పణ’ మతపరమైన సందర్భానికి సరిపోతుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం; לְ గ్రహీతను సూచిస్తుంది.
- source_word: לִירוּשָׁלִַם
  choice: యెరూషలేములో
  rationale: לְ సాధారణంగా గమ్యాన్ని సూచించినా, ఇక్కడ అర్పణ సమర్పించే స్థలాన్ని సూచిస్తుందని సందర్భం అనుమతిస్తుంది. గమ్యం అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: מִגְדָּנוֹת
  choice: విలువైన కానుకలు
  rationale: ఎంపికైన, అమూల్యమైన లేదా విలువైన వస్తువులను కానుకలుగా ఇచ్చే భావాన్ని ఇది తెలియజేస్తుంది; ఆహార పదార్థాలకే పరిమితం చేయలేదు.
- source_word: לִיחִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన హిజ్కియాకు
  rationale: హిజ్కియా కానుకల గ్రహీత అని, అతడు యూదా రాజని సహజమైన తెలుగు పదక్రమంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּנַּשֵּׂא
  choice: ఎంతో ఘనత పొందాడు
  rationale: నిఫాల్ రూపం అతని స్థానం లేదా కీర్తి పెంచబడిన ఫలితాన్ని సూచిస్తుంది. ‘ఘనత పొందాడు’ తెలుగులో సహజంగా ఉండి, కర్తను వచనంలో లేనప్పుడు చేర్చదు.
- source_word: לְעֵינֵי כָל הַגּוֹיִם
  choice: సమస్త జనాల దృష్టిలో
  rationale: ఇది ప్రజల ఎదుట కనిపించే స్థానం లేదా వారి అంచనాలోని గౌరవాన్ని సూచించే హీబ్రూ నుడికారం; తెలుగు రూపం రెండింటినీ అనుమతిస్తుంది.
- source_word: מֵאַחֲרֵי כֵן
  choice: దీని తరువాత
  rationale: ముందు చెప్పిన సంఘటనల తరువాతి కాలాన్ని సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించాం.
- issue: וַיִּנַּשֵּׂא లోని నిష్క్రియ/ఫలితార్థ భావం
  choice: ఎంతో ఘనత పొందాడు
  alternative: హెచ్చింపబడ్డాడు
  rationale: మూలంలోని ఉన్నత స్థితికి చేర్చబడిన భావాన్ని నిలుపుతూ, దానిని ఎవరు చేశారో వచనం చెప్పనందున దైవకర్తను లేదా మానవకర్తను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. కొనసాగుతున్న చర్యను ‘తీసుకొస్తూ ఉన్నారు’తో వ్యక్తం చేశాం. హీబ్రూ వాక్యంలోని రెండు సమాంతర కానుకల వాక్యభాగాలను తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించి, ‘కూడా’తో వాటి అనుసంధానాన్ని నిలిపాం.
