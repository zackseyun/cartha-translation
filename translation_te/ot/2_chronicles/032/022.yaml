source:
  edition: WLC
  text: וַ/יּוֹשַׁע֩ יְהוָ֨ה אֶת יְחִזְקִיָּ֜הוּ וְ/אֵ֣ת יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם מִ/יַּ֛ד סַנְחֵרִ֥יב מֶֽלֶךְ אַשּׁ֖וּר וּ/מִ/יַּד כֹּ֑ל וַֽ/יְנַהֲלֵ֖/ם מִ/סָּבִֽיב־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/022.yaml
  text: So Yahweh saved Hezekiah and the inhabitants of Jerusalem from the hand of Sennacherib king of Assyria and from the hand of all others[b][a], and he guided them on every side.
translation:
  language: te
  text: యాహ్వే హిజ్కియాను, యెరూషలేము నివాసులను అష్షూరు రాజైన సన్హెరీబు చేతినుండి, అందరి చేతినుండి[a] రక్షించాడు; వారిని అన్నివైపులా నడిపించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అందరి చేతినుండి.” హీబ్రూలో “అందరి” తరువాత విషయపదం లేదు; సందర్భంలో ఇతర శత్రువులు లేదా విరోధ శక్తులు ఉద్దేశించబడి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారిని చుట్టూ నడిపించాడు.” కొందరు ఈ మాటలను యాహ్వే వారికి అన్నివైపులా భద్రత లేదా విశ్రాంతి కలిగించాడనే విస్తృత భావంలో అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: రక్షించాడు
  rationale: ישׁע అనే మూలపదం ప్రమాదం లేదా శత్రు అధికారంనుండి విడిపించడాన్ని సూచిస్తుంది. ‘రక్షించాడు’ సహజమైన ఆధునిక తెలుగు పదం; కేవలం సైనిక విజయానికే భావాన్ని పరిమితం చేయదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ ధ్వన్యంతరీకరణను తెలుగులో ఇచ్చాం.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: యెరూషలేము నివాసులను
  rationale: హీబ్రూ భాగవాచక నిర్మాణం ‘యెరూషలేములో నివసించేవారు’ అని అర్థం. ‘నివాసులు’ సంక్షిప్తంగా, గౌరవప్రదంగా, సహజంగా ఉంది.
- source_word: מִיַּד
  choice: చేతినుండి
  rationale: హీబ్రూ ‘చేతినుండి’ అనే రూపకం ఒకరి అధికారం లేదా పట్టునుండి విడిపించడాన్ని సూచిస్తుంది. తెలుగులోనూ ఈ రూపకం అర్థమవుతుంది కాబట్టి నిలుపుకున్నాం.
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజైన సన్హెరీబు
  rationale: రాజు పేరు, అతని బిరుదు రెండింటినీ నిలుపుతూ సహజ తెలుగు పదక్రమంలో ఇచ్చాం.
- source_word: וּמִיַּד כֹּל
  choice: మిగిలిన వారందరి చేతినుండి
  rationale: כֹּל తరువాత దాని అవ్యక్త విషయపదం హీబ్రూలో లేదు. సందర్భంలో సన్హెరీబుతో పాటు ఇతర విరోధులు లేదా శత్రు శక్తులు ఉద్దేశించబడి ఉండవచ్చు. ‘మిగిలిన వారందరి’ అని ఇవ్వడం ఈ భావాన్ని పఠనయోగ్యంగా చేస్తుంది; అసలు అస్పష్టతను పాదసూచికలో తెలిపాం.
- source_word: וַיְנַהֲלֵם
  choice: వారిని ... నడిపించాడు
  rationale: נהל ప్రధానంగా నడిపించడం లేదా మార్గదర్శనం చేయడం అనే భావం ఇస్తుంది. ‘విశ్రాంతి ఇచ్చాడు’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా మూలపదానికి దగ్గరగా ఉంచాం.
- source_word: מִסָּבִיב
  choice: అన్నివైపులా
  rationale: చుట్టూ లేదా ప్రతి వైపున అనే విస్తృతిని సహజ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ధ్వన్యంతరీకరించడం మూలరూపాన్ని కాపాడుతుంది.
- issue: וַיְנַהֲלֵם מִסָּבִיב భావం
  choice: వారిని అన్నివైపులా నడిపించాడు
  alternative: వారికి అన్నివైపులా భద్రత/విశ్రాంతి కలిగించాడు
  rationale: נהלకు ప్రత్యక్షంగా ‘నడిపించు, మార్గదర్శనం చేయు’ అనే అర్థం ఉంది. సందర్భం భద్రతను సూచించవచ్చుగాని, దానినే ప్రధాన పాఠంలో నిర్దిష్టంగా చేర్చి మూలంలోని భావవిస్తృతిని తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘చేతినుండి’ అనే హీబ్రూ రూపకాన్ని తెలుగులో అర్థవంతంగా ఉండటంతో నిలిపాం. పేర్లను తెలుగు బైబిలు వాడుకకు సమీపమైన రూపాల్లో ఇచ్చి, יהוהను మాత్రం ‘యాహ్వే’గా ధ్వన్యంతరీకరించాం.
