revisions:
- from: కాబట్టి యాహ్వే హిజ్కియాను, యెరూషలేము నివాసులను అష్షూరు రాజైన సన్హెరీబు చేతినుండి, మిగిలిన వారందరి చేతినుండి[a] రక్షించాడు; వారిని అన్నివైపులా నడిపించాడు[b].
