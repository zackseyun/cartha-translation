source:
  edition: WLC
  text: וְ/עוֹד֙ דִּבְּר֣וּ עֲבָדָ֔י/ו עַל יְהוָ֖ה הָ/אֱלֹהִ֑ים וְ/עַ֖ל יְחִזְקִיָּ֥הוּ עַבְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/016.yaml
  text: And his servants spoke further against Yahweh God and against his servant Hezekiah[a].
translation:
  language: te
  text: అతని సేవకులు యహ్వే దేవునికి విరోధంగా, ఆయన సేవకుడైన హిజ్కియాకు విరోధంగా ఇంకా మాట్లాడారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యహ్వే దేవుని గురించి, ఆయన సేవకుడైన హిజ్కియా గురించి ఇంకా మాట్లాడారు.” హెబ్రీ పూర్వప్రత్యయం తటస్థంగా “గురించి” అనే అర్థాన్ని కూడా ఇవ్వగలదు; అయితే ఇక్కడి సందర్భం “విరోధంగా” అనే శత్రుభావ అర్థానికి మద్దతిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  choice: ఇంకా
  rationale: ముందు చెప్పిన మాటలకు మరిన్ని మాటలు తోడయ్యాయని, సందర్భంలో దూషణ మరింత కొనసాగిందని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: דִּבְּרוּ
  choice: మాట్లాడారు
  rationale: దבר పియేల్ రూపంలోని సాధారణ ‘మాట్లాడు’ అనే అర్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: עֲבָדָיו
  choice: అతని సేవకులు
  rationale: ఇక్కడ అష్షూరు రాజు తరఫున పనిచేసే మనుషులను సూచిస్తుంది. ‘సేవకులు’ అనే పదం మూలపదపు విస్తృతిని నిలుపుతుంది; ‘అధికారులు’ అని అనువదిస్తే భావం అనవసరంగా కుదించబడుతుంది.
- source_word: עַל
  choice: విరోధంగా
  rationale: דבר తో కలిసిన עַל కొన్ని సందర్భాల్లో తటస్థంగా ‘గురించి’ అని అర్థమివ్వగలిగినా, చుట్టుపక్కల సందర్భంలోని దూషణాత్మకమైన మాటల వల్ల ఇక్కడ ప్రతికూల భావమే ప్రధానంగా ఉంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని పేరును లిప్యంతరీకరించింది.
- source_word: הָאֱלֹהִים
  choice: దేవుడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న אלהיםను దైవనామానికి అనుబంధంగా ‘యహ్వే దేవుడు’ అనే సహజ తెలుగు రూపంలో అందిస్తుంది.
- source_word: יְחִזְקִיָּהוּ
  choice: హిజ్కియా
  rationale: వ్యక్తి పేరుకు తెలుగులో వాడుకలో ఉన్న లిప్యంతరీకరణ.
- source_word: עַבְדּוֹ
  choice: ఆయన సేవకుడు
  rationale: హిజ్కియా యహ్వేకు సేవచేసే రాజు అనే సంబంధాన్ని సూచిస్తుంది; ఈ సందర్భంలో ‘దాసుడు’ కంటే ‘సేవకుడు’ సామాజిక బానిసత్వ భావాన్ని అనవసరంగా బలపరచకుండా మూలంలోని రాజసంబంధమైన, దైవసంబంధమైన భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’ అని లిప్యంతరీకరించడం మూలరూపాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: హిజ్కియాను עַבְדּוֹ అని పేర్కొనడం
  choice: ఆయన సేవకుడు
  alternative: ఆయన దాసుడు
  rationale: עבד పదానికి ‘దాసుడు’ అనే అర్థం సాధ్యమైనా, ఇక్కడ యహ్వేతో హిజ్కియాకు ఉన్న రాజసంబంధమైన విధేయతను సూచించడం ప్రధానాంశం. ‘సేవకుడు’ ఆ భావాన్ని సామాజిక బానిసత్వాన్ని ముందుకు తేవకుండా వ్యక్తపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. రెండు సార్లు వచ్చిన עַל‌కు ‘విరోధంగా’ అనే పదాన్ని రెండుసార్లు ఉంచి మూలంలోని సమాంతర నిర్మాణాన్ని కాపాడాం. మొదటి ‘అతని’ అష్షూరు రాజును, తరువాతి గౌరవసూచక ‘ఆయన’ యహ్వేను సూచించేలా తెలుగు సర్వనామ భేదం ఉపయోగించబడింది.
