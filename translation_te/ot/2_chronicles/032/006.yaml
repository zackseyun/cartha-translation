translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘సైన్యాధికారులు,’ ‘విశాల ప్రదేశం’ వంటి సాధారణ పదాలతో సైనిక, పౌర సందర్భాలు స్పష్టంగా ఉంచబడ్డాయి; హీబ్రూ హృదయ నుడికారంలోని రూపకాన్ని పాదసూచికలో సంరక్షించాం.
