  edition: WLC
  text: וַ/יִּתֵּ֛ן שָׂרֵ֥י מִלְחָמ֖וֹת עַל הָ/עָ֑ם וַ/יִּקְבְּצֵ֣/ם אֵלָ֗י/ו אֶל רְחוֹב֙ שַׁ֣עַר הָ/עִ֔יר וַ/יְדַבֵּ֥ר עַל לְבָבָ֖/ם לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/006.yaml
  text: And he appointed military commanders over the people[a], gathered them to himself in the square at the city gate, and spoke to their hearts, saying,
translation:
  language: te
  text: 'అతడు ప్రజల మీద సైన్యాధికారులను నియమించి, పట్టణ ద్వారం దగ్గర ఉన్న విశాల ప్రదేశంలో వారిని తన దగ్గరికి సమకూర్చి, వారి హృదయాలను ధైర్యపరుస్తూ[a] ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, “వారి హృదయాలకు మాట్లాడాడు.” ఇది వారిని ప్రోత్సహించి, ధైర్యపరిచేలా మాట్లాడాడని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: నియమించి
  rationale: మూల క్రియ అక్షరార్థంగా ‘పెట్టాడు/ఉంచాడు’ అయినా, అధికారులను ప్రజల మీద ఉంచే ఈ నిర్మాణంలో పదవికి నియమించడాన్ని సూచిస్తుంది.
- source_word: שָׂרֵי מִלְחָמוֹת
  choice: సైన్యాధికారులను
  rationale: అక్షరార్థంగా ‘యుద్ధాల అధిపతులు’; సందర్భంలో సైనిక దళాలకు నాయకత్వం వహించే అధికారులను సూచిస్తుంది.
- source_word: עַל הָעָם
  choice: ప్రజల మీద
  rationale: నియామక సందర్భంలో עַל అధికారం లేదా పర్యవేక్షణ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: וַיִּקְבְּצֵם אֵלָיו
  choice: వారిని తన దగ్గరికి సమకూర్చి
  rationale: קבץ సమకూర్చడం లేదా సమావేశపరచడం; אֵלָיו హిజ్కియా స్వయంగా వారిని తన దగ్గరికి పిలిపించిన భావాన్ని నిలుపుతుంది.
- source_word: אֶל רְחוֹב שַׁעַר הָעִיר
  choice: పట్టణ ద్వారం దగ్గర ఉన్న విశాల ప్రదేశంలో
  rationale: רְחוֹב ద్వారం సమీపంలోని బహిరంగ విశాల స్థలాన్ని సూచిస్తుంది; ఈ రూపం ప్రజలకు సహజంగా అర్థమవుతూ పౌర సమావేశ స్థల భావాన్ని కాపాడుతుంది.
- source_word: וַיְדַבֵּר עַל לְבָבָם
  choice: వారి హృదయాలను ధైర్యపరుస్తూ
  rationale: అక్షరార్థంగా ‘వారి హృదయాలపై/వారి హృదయాలకు మాట్లాడాడు’; ఈ హీబ్రూ నుడికారం ఇక్కడ అంతరంగంగా ప్రోత్సహించి బలపరచడాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన అర్థాన్ని ఇచ్చి, మూల రూపకాన్ని పాదసూచికలో తెలిపాం.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నాడు:'
  rationale: తదుపరి ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేసే సాధారణ హీబ్రూ రూపం; తెలుగులో ‘ఇలా అన్నాడు’ సహజమైన అనుసంధానం.
