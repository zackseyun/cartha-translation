revisions:
- from: వారు భూమిపై ఉన్న ప్రజల దేవుళ్లకు విరోధంగా మాట్లాడినట్లే, యెరూషలేము దేవునికి విరోధంగా కూడా మాట్లాడారు[a]. ఆ దేవుళ్లు మానవ చేతుల పని[b].
  to: వారు భూమి ప్రజల దేవుళ్లకు వ్యతిరేకంగా మాట్లాడినట్లే, మానవ చేతిపనియైన ఆ దేవుళ్లకు చేసినట్లుగా యెరూషలేము దేవునికి వ్యతిరేకంగా మాట్లాడారు[a][b].
  rationale: 'The revision restores the Hebrew apposition by keeping “the work of human hands” with the gods of the peoples of the earth, while maintaining the source’s comparison: the speakers opposed the God of Jerusalem in the same way as those man-made gods. The footnote placement now anchors the hostile-speech alternative to the main verbal expression and the literal wording note to “మానవ చేతిపని.”'
  reviewer_model: gpt-5.6-terra
