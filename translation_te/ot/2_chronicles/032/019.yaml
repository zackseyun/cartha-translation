source:
  edition: WLC
  text: וַֽ/יְדַבְּר֔וּ אֶל אֱלֹהֵ֖י יְרוּשָׁלִָ֑ם כְּ/עַ֗ל אֱלֹהֵי֙ עַמֵּ֣י הָ/אָ֔רֶץ מַעֲשֵׂ֖ה יְדֵ֥י הָ/אָדָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/019.yaml
  text: And they spoke against the God of Jerusalem as against the gods of the peoples of the earth[b][a], the work of human hands.
translation:
  language: te
  text: వారు భూమి ప్రజల దేవుళ్లకు వ్యతిరేకంగా మాట్లాడినట్లే, మానవ చేతిపనియైన ఆ దేవుళ్లకు చేసినట్లుగా యెరూషలేము దేవునికి వ్యతిరేకంగా మాట్లాడారు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “వారు భూమి ప్రజల దేవుళ్లకు వ్యతిరేకంగా మాట్లాడినట్లే, యెరూషలేము దేవునితో మాట్లాడారు.” హీబ్రూ విభక్తి సాధారణంగా “కు” అనే భావాన్ని ఇస్తుంది; అయితే ఇక్కడి సందర్భం శత్రుత్వపూరితమైన మాటలను సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూలో అక్షరార్థంగా: “మనిషి చేతుల పని.” ఇక్కడ “మనిషి” మానవులను సాధారణంగా సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: మాట్లాడారు
  rationale: דבר పియేల్ రూపానికి సాధారణ అర్థమైన ‘మాట్లాడు’ను నిలిపి, మాటలలోని శత్రుత్వాన్ని సందర్భం మరియు తరువాతి విభక్తి ప్రయోగం ద్వారా వ్యక్తం చేశాం.
- source_word: אֶל
  choice: విరోధంగా
  rationale: אֶל సాధారణంగా ‘కు/వైపు’ అని అర్థమైనా, ఇక్కడ సందర్భం దూషణాత్మకమైనది కాబట్టి తెలుగులో సహజంగా ‘విరోధంగా’ అని అనువదించాం.
- source_word: אֱלֹהֵי יְרוּשָׁלִָם
  choice: యెరూషలేము దేవుడు
  rationale: אֱלֹהֵי రూపం ఆకృతిపరంగా బహువచనంలా ఉన్నా, ఇశ్రాయేలు దేవుణ్ణి సూచించినప్పుడు ఏకవచనార్థం కలిగి ఉంటుంది; సందర్భమూ అదే సూచిస్తుంది.
- source_word: כְּעַל
  choice: విరోధంగా మాట్లాడినట్లే
  rationale: ఈ సంయుక్త ప్రయోగం పోలికతో పాటు శత్రుత్వపూరిత మాటల భావాన్ని ఇస్తుంది; తెలుగు వాక్యక్రమంలో పోలికను ముందుకు తెచ్చి సహజంగా వ్యక్తం చేశాం.
- source_word: אֱלֹהֵי עַמֵּי הָאָרֶץ
  choice: భూమిపై ఉన్న ప్రజల దేవుళ్లు
  rationale: ఇక్కడ אֱלֹהֵי బహువచనార్థంలో ఉంది. עַמֵּי הָאָרֶץను ఒక ప్రాంతపు ప్రజలకే పరిమితం చేయకుండా విస్తృతార్థంలో అనువదించాం.
- source_word: מַעֲשֵׂה יְדֵי הָאָדָם
  choice: మానవ చేతుల పని
  rationale: ఈ పదబంధం దేవుళ్లు మనుషులు తయారుచేసిన విగ్రహాలేనని తెలియజేస్తుంది. ‘మానవ చేతుల పని’ మూలంలోని సాధారణ మానవార్థాన్ని, చేతితో చేసినదనే వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: הָאָדָם
  choice: మానవ
  rationale: ఇక్కడ పదం పురుషుణ్ణి ప్రత్యేకంగా కాక మానవజాతిని సాధారణంగా సూచిస్తుంది; అందుకే లింగనిరపేక్షమైన ‘మానవ’ను ఎంచుకున్నాం.
theological_decisions:
- issue: మాటలు యెరూషలేము దేవునికి చెప్పబడినవిగా అనువదించాలా, ఆయనకు విరోధంగా చెప్పబడినవిగా అనువదించాలా
  choice: దేవునికి విరోధంగా మాట్లాడారు
  alternative: దేవునితో/దేవునికి మాట్లాడారు
  rationale: సన్హెరీబు సేవకుల మాటలు అపహాస్యకరమైనవని సమీప సందర్భం స్పష్టం చేస్తుంది. కాబట్టి శత్రుత్వ భావాన్ని అదనపు సిద్ధాంతార్థం చేర్చకుండా ‘విరోధంగా’ సహజంగా తెలియజేస్తుంది.
- issue: אֱלֹהֵי יְרוּשָׁלִָםను ఏకవచనంగా తీసుకోవాలా, బహువచనంగా తీసుకోవాలా
  choice: యెరూషలేము దేవుడు
  alternative: యెరూషలేము దేవుళ్లు
  rationale: אֱלֹהִים సంబంధిత రూపం ఇశ్రాయేలు దేవుణ్ణి సూచించినప్పుడు ఏకవచనార్థంలో తరచుగా వాడబడుతుంది. మానవ చేతులతో చేసిన అన్యజన దేవుళ్లతో ఉన్న వ్యత్యాసం కూడా ఇక్కడ ఏకవచనాన్నే కోరుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలిని వాడాం. మూల వాక్యంలోని పోలికను తెలుగులో సహజంగా ఉండేందుకు ముందుకు మార్చాం. చివరి పదబంధం అన్యజన దేవుళ్లను సూచిస్తుందని స్పష్టత కోసం ‘ఆ దేవుళ్లు’ అని ప్రత్యేక వాక్యంగా ఇచ్చాం.
