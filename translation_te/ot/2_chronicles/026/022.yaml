- from: ఉజ్జీయా చేసిన మిగిలిన కార్యాలను[a]—మొదటివాటినీ చివరివాటినీ—ఆమోజు కుమారుడైన యెషయా ప్రవక్త రాశాడు.
  to: ఉజ్జీయా చేసిన మిగిలిన కార్యాలను[a]—మొదటివాటి నుండి చివరివాటి వరకు—ఆమోజు కుమారుడైన ప్రవక్త యెషయా రాశాడు.
  rationale: The revision makes only a stylistic and scope-clarifying adjustment to the Hebrew pair “the first and the last,” rendering it idiomatically as “మొదటివాటి నుండి చివరివాటి వరకు.” The footnote is adjusted to give a closer literal alternative for דִּבְרֵי while retaining its contextual annal-style sense.
