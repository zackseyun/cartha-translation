source:
  edition: WLC
  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י עֻזִּיָּ֔הוּ הָ/רִאשֹׁנִ֖ים וְ/הָ/אֲחֲרֹנִ֑ים כָּתַ֛ב יְשַֽׁעְיָ֥הוּ בֶן אָמ֖וֹץ הַ/נָּבִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/022.yaml
  text: The rest of the acts of Uzziah[a], first and last, Isaiah son of Amoz the prophet wrote.
translation:
  language: te
  text: ఉజ్జీయా చేసిన మిగిలిన కార్యాలను[a]—మొదటివాటి నుండి చివరివాటి వరకు—ఆమోజు కుమారుడైన ప్రవక్త యెషయా రాశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఉజ్జీయా సంగతులలో మిగిలినవి.” ఇక్కడ “సంగతులు” అనే హీబ్రూ రాజవృత్తాంత ప్రయోగం అతని పాలనలోని సంఘటనలు లేదా అతడు చేసిన కార్యాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  choice: మిగిలిన
  rationale: יֶתֶר అంటే మిగిలినది. తెలుగు వాక్యప్రవాహంలో ఆరంభ וְ ను ప్రత్యేకంగా ‘మరియు’ అని అనువదించకుండానే సందర్భంలోని అనుసంధానం నిలుస్తుంది.
- source_word: דִּבְרֵי
  choice: కార్యాలను
  rationale: అక్షరార్థంగా ‘మాటలు/విషయాలు’ అయినా, రాజుల పాలనను సంగ్రహించే ఈ చరిత్రగ్రంథ శైలిలో రాజు చేసిన కార్యాలు లేదా అతని పాలనలోని సంఘటనలను సూచిస్తుంది.
- source_word: עֻזִּיָּהוּ
  choice: ఉజ్జీయా
  rationale: ఈ వచనంలో ఉన్న పేరురూపానికి తగిన ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרֹנִים
  choice: మొదటివాటినీ చివరివాటినీ
  rationale: మూలంలోని ‘మొదటివి మరియు చివరివి’ అనే జోడిని దగ్గరగా నిలుపుతూ, అతని పాలన ఆరంభం నుంచి ముగింపు వరకున్న పరిధిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כָּתַב
  choice: రాశాడు
  rationale: క్రియ యొక్క సరళమైన అర్థాన్ని నేరుగా తెలియజేస్తుంది; ‘నమోదు చేశాడు’ అనే చరిత్రలేఖన భావాన్ని అనవసరంగా ముందుకు తేవదు.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: ఆమోజు కుమారుడైన యెషయా ప్రవక్త
  rationale: పేరు, తండ్రి పేరు, ప్రవక్త అనే నిర్దిష్ట బిరుదును సహజమైన తెలుగు క్రమంలో నిలుపుతుంది.
theological_decisions:
- issue: రాజవృత్తాంత సూత్రంలో דִּבְרֵי స్వభావం
  choice: కార్యాలు
  alternative: మాటలు; విషయాలు
  rationale: ఇక్కడ అది రాజు పలికిన మాటలను మాత్రమే కాక అతని పాలనకు సంబంధించిన కార్యాలు, సంఘటనలను సూచిస్తుంది. పాదటిప్పణి అక్షరార్థాన్ని కూడా కాపాడుతుంది.
- issue: הָרִאשֹׁנִים וְהָאֲחֲרֹנִים యొక్క పరిధి
  choice: మొదటివాటినీ చివరివాటినీ
  alternative: మొదటి నుంచి చివరి వరకు
  rationale: మూలంలోని జోడిని స్పష్టంగా నిలుపుతుంది; అదే సమయంలో మొత్తం పాలనాకాలపు పరిధిని సూచించే అవకాశం తెరిచి ఉంటుంది.
- issue: వచనారంభంలోని וְ
  choice: తెలుగులో ప్రత్యేక పదంగా వ్యక్తం చేయలేదు
  alternative: మరియు; ఇక
  rationale: ఇది కథన అనుసంధాన సూచకం. వచనం విడిగా చదివినా సహజంగా ఉండేందుకు తెలుగులో బలవంతంగా ‘మరియు’ లేదా మూలంలో లేని కాలసూచక ‘ఇక’ చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే చరిత్రవివరణ శైలి. మూలంలోని కర్త-కర్మ సంబంధాన్ని స్పష్టంచేయడానికి సహజ తెలుగు పదక్రమం వాడబడింది.
