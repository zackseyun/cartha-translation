  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י לְ/עֻזִּיָּ֡הוּ חַיִל֩ עֹשֵׂ֨ה מִלְחָמָ֜ה יוֹצְאֵ֧י צָבָ֣א לִ/גְד֗וּד בְּ/מִסְפַּר֙ פְּקֻדָּתָ֔/ם בְּ/יַד֙ יעואל הַ/סּוֹפֵ֔ר וּ/מַעֲשֵׂיָ֖הוּ הַ/שּׁוֹטֵ֑ר עַ֚ל יַד חֲנַנְיָ֔הוּ מִ/שָּׂרֵ֖י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/011.yaml
  text: And Uzziah had an army fit for war[a], going out to battle by divisions, according to the number of their enrollment, under the direction of Jeiel the scribe and Maaseiah the officer, under the authority of Hananiah[b], one of the king’s commanders.
translation:
  language: te
  text: ఉజ్జీయాకు యుద్ధం చేయగల సైన్యం ఉండేది. అందులోని వారు తమ సైనిక నమోదు సంఖ్య[a] ప్రకారం దళాలుగా యుద్ధ సేవకు బయలుదేరేవారు. వారు లేఖకుడైన యెయేలు[b] మరియు అధికారియైన మయశేయా ఆధ్వర్యంలో, రాజు సేనాధిపతుల్లో ఒకడైన హనన్యా పర్యవేక్షణలో ఉండేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ సైనిక సమీకరణ లెక్క ప్రకారం.” హెబ్రీ పదం సైనికులను అధికారికంగా లెక్కించడం లేదా నమోదు చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ హెబ్రీ పాఠంలో ఈ పేరు יעואל అని వ్రాయబడింది; దీనిని “యెయూయేలు” అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִל
  choice: సైన్యం
  rationale: ఈ యుద్ధ సందర్భంలో ఈ పదం సంపద లేదా పరాక్రమం అనే భావంలో కాకుండా సైనిక బలగాన్ని సూచిస్తుంది.
- source_word: עֹשֵׂה מִלְחָמָה
  choice: యుద్ధం చేయగల
  rationale: హెబ్రీ భాగం సైన్యం యుద్ధ సామర్థ్యం కలదని తెలియజేస్తుంది; తెలుగులో సహజంగా ఉండేలా ఈ రూపం ఎంచుకోబడింది.
- source_word: יוֹצְאֵי צָבָא
  choice: యుద్ధానికి బయలుదేరేవారు
  rationale: ఇది సైనిక విధి కోసం బయలుదేరే వారిని సూచించే సాధారణ హెబ్రీ సైనిక ప్రయోగం.
- source_word: לִגְדוּד
  choice: దళాలుగా
  rationale: సైనికులు విడివిడి వ్యవస్థీకృత విభాగాలుగా ఏర్పాటయ్యారనే భావాన్ని తెలియజేస్తుంది.
- source_word: בְּמִסְפַּר פְּקֻדָּתָם
  choice: తమ సైనిక నమోదు సంఖ్య ప్రకారం
  rationale: פְּקֻדָּה ఇక్కడ సైనికుల అధికారిక లెక్కింపు లేదా నమోదును సూచిస్తుంది.
- source_word: בְּיַד
  choice: నిర్వహణ బాధ్యత వహించారు
  rationale: పదశః ‘చేతిలో’ అనే జాతీయాన్ని తెలుగులో పరిపాలనా నిర్వహణ లేదా బాధ్యత అనే భావంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַסּוֹפֵר
  choice: లేఖకుడు
  rationale: ఇది వ్రాతపని, నమోదు నిర్వహించే అధికారిక లేఖకుడిని సూచిస్తుంది.
- source_word: הַשּׁוֹטֵר
  choice: అధికారి
  rationale: సైనిక-పరిపాలనా సందర్భంలోని కార్యనిర్వాహక అధికారిని సూచించే విస్తృతమైన పదం.
- source_word: עַל יַד
  choice: పర్యవేక్షణలో
  rationale: ముందటి నిర్వహణ స్థాయికి పైగా ఉన్న పర్యవేక్షణ సంబంధాన్ని ఈ జాతీయం సూచిస్తుంది.
- source_word: מִשָּׂרֵי הַמֶּלֶךְ
  choice: రాజు సేనాధిపతుల్లో ఒకడు
  rationale: שַׂר అనే పదానికి అధిపతి, అధికారి, సేనాధిపతి అనే అర్థాలు ఉన్నాయి; ఇక్కడ సైనిక సందర్భం ‘సేనాధిపతి’కి మద్దతిస్తుంది.
