translation_notes:
  register: సాధారణ ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన చారిత్రక వర్ణన శైలిని ఉపయోగించాం. పొడవైన హెబ్రీ వాక్యాన్ని స్పష్టత కోసం మూడు తెలుగు వాక్యాలుగా విభజించాం; సైనిక నిర్వహణలోని రెండు స్థాయులను—యెయీయేలు, మయశేయా నిర్వహణ మరియు హనన్యా పర్యవేక్షణ—వేరుగా నిలిపాం.
