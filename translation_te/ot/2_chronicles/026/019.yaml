    issue: “యాజకుల కళ్లముందే” adds an emphatic force.
    rationale: לִפְנֵי הַכֹּהֲנִים means ‘before/in the presence of the priests’; “యాజకుల సమక్షంలో” conveys this without adding the emphatic ‘-ే.’
