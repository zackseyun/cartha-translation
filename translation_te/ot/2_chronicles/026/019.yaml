  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּזְעַף֙ עֻזִּיָּ֔הוּ וּ/בְ/יָד֥/וֹ מִקְטֶ֖רֶת לְ/הַקְטִ֑יר וּ/בְ/זַעְפּ֣/וֹ עִם הַ/כֹּהֲנִ֗ים וְ֠/הַ/צָּרַעַת זָרְחָ֨ה בְ/מִצְח֜/וֹ לִ/פְנֵ֤י הַ/כֹּֽהֲנִים֙ בְּ/בֵ֣ית יְהוָ֔ה מֵ/עַ֖ל לְ/מִזְבַּ֥ח הַ/קְּטֹֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/019.yaml
  text: Then Uzziah became angry[a], with a censer in his hand to burn incense; and while he was angry with the priests, leprosy broke out on his forehead before the priests in the house of Yahweh, beside the altar of incense.
translation:
  language: te
  text: అప్పుడు ఉజ్జీయా కోపగించుకున్నాడు; ధూపం వేయడానికి అతని చేతిలో ధూపపాత్ర ఉంది. అతడు యాజకుల మీద కోపంతో ఉండగా, యాహ్వే మందిరంలో ధూపవేదిక పక్కన యాజకుల సమక్షంలో అతని నుదుటిపై కుష్ఠురోగం[a] ఒక్కసారిగా బయటపడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తీవ్రమైన చర్మవ్యాధి.” హీబ్రూ పదం צָרַעַת ఆధునిక కుష్ఠురోగాన్ని (హాన్సెన్ వ్యాధిని) మాత్రమే కాకుండా, మరింత విస్తృతంగా తీవ్రమైన లేదా ఆచారపరంగా అపవిత్రత కలిగించే చర్మస్థితిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְעַף
  choice: కోపగించుకున్నాడు
  rationale: క్రియలోని కోపం కలిగిన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; తీవ్రతను అనవసరంగా పెంచదు.
- source_word: עֻזִּיָּהוּ
  choice: ఉజ్జీయా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: מִקְטֶרֶת
  choice: ధూపపాత్ర
  rationale: ధూపం అర్పించడానికి ఉపయోగించే పాత్రను స్పష్టంగా, సంక్షిప్తంగా సూచిస్తుంది.
- source_word: לְהַקְטִיר
  choice: ధూపం వేయడానికి
  rationale: ఉద్దేశార్థక క్రియారూపాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וּבְזַעְפּוֹ עִם הַכֹּהֲנִים
  choice: అతడు యాజకుల మీద కోపంతో ఉండగా
  rationale: తదుపరి సంఘటన జరిగిన సందర్భాన్ని, యాజకుల పట్ల అతని కోపాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַצָּרַעַת
  choice: కుష్ఠురోగం
  rationale: సాంప్రదాయిక బైబిలు పదసంబంధాన్ని నిలుపుతూ, హీబ్రూ పదం ఆధునిక హాన్సెన్ వ్యాధికంటే విస్తృతార్థం కలిగి ఉండవచ్చని పాదటిప్పణిలో స్పష్టం చేస్తుంది.
- source_word: זָרְחָה
  choice: ఒక్కసారిగా బయటపడింది
  rationale: మూలంలోని ‘ప్రకాశించింది/వెలిసింది’ అనే చిత్రాత్మక భావాన్ని సందర్భానుసారంగా వ్యాధి అకస్మాత్తుగా కనిపించడంగా వ్యక్తపరుస్తుంది.
- source_word: בְמִצְחוֹ
  choice: అతని నుదుటిపై
  rationale: శరీర భాగం మరియు వ్యాధి కనిపించిన స్థానాన్ని నేరుగా తెలుపుతుంది.
- source_word: לִפְנֵי הַכֹּהֲנִים
  choice: యాజకుల కళ్లముందే
  rationale: యాజకుల సమక్షంలో, వారికి స్పష్టంగా కనిపించేలా సంఘటన జరిగిందనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בְּבֵית יְהוָה
  choice: యెహోవా మందిరంలో
  rationale: ఇక్కడ ‘ఇల్లు’ దేవాలయాన్ని సూచిస్తున్నందున ఆధునిక పాఠకునికి స్పష్టమైన ‘మందిరం’ ఉపయోగించబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో లిప్యంతరీకరిస్తుంది.
- source_word: מֵעַל לְמִזְבַּח הַקְּטֹרֶת
  choice: ధూపవేదిక పక్కన
  rationale: సంక్షిప్తమైన హీబ్రూ స్థానసంబంధ పదబంధాన్ని అతిగా నిర్దిష్టం చేయకుండా సహజమైన ప్రదేశ సూచనగా అందిస్తుంది.
theological_decisions:
- issue: צָרַעַת పదానికి అనువాదం
  choice: కుష్ఠురోగం[a]
  alternative: తీవ్రమైన చర్మవ్యాధి / అపవిత్రత కలిగించే చర్మస్థితి
  rationale: ప్రధాన పాఠ్యంలో సాంప్రదాయిక పదాన్ని ఉంచి, అది తప్పనిసరిగా ఆధునిక హాన్సెన్ వ్యాధినే సూచించదనే నిజమైన నిఘంటు విస్తృతిని పాదటిప్పణిలో సంరక్షిస్తుంది.
- issue: יְהוָה దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో మార్చకుండా, సాధారణ తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఉపయోగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. చిన్న వాక్య విభజన ద్వారా సంఘటనల క్రమం స్పష్టంగా ఉంచబడింది; ఆచార సంబంధ పదాలకు సాధారణ పాఠకునికి అర్థమయ్యే ‘ధూపపాత్ర,’ ‘ధూపవేదిక,’ ‘మందిరం’ రూపాలు వాడబడ్డాయి.
