source:
  edition: WLC
  text: וַ/יָּבֹ֥א אַחֲרָ֖י/ו עֲזַרְיָ֣הוּ הַ/כֹּהֵ֑ן וְ/עִמּ֞/וֹ כֹּהֲנִ֧ים לַ/יהוָ֛ה שְׁמוֹנִ֖ים בְּנֵי חָֽיִל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/017.yaml
  text: Azariah the priest went in after him[a], and with him were eighty priests of Yahweh, valiant men.
translation:
  language: te
  text: యాజకుడైన అజర్యా అతని తర్వాత లోపలికి ప్రవేశించాడు. అతనితో పాటు యాహ్వేకు చెందిన పరాక్రమశాలులైన ఎనభైమంది యాజకులు ఉన్నారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బలవంతులైన పురుషులు.” בְּנֵי חָיִל అనే హెబ్రీ నుడికారం బలం, ధైర్యం లేదా పరాక్రమం గల పురుషులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אַחֲרָיו
  choice: అతని వెనుక లోపలికి వెళ్లాడు
  rationale: בוא అనే క్రియకు రావడం, వెళ్లడం, ప్రవేశించడం అనే భావాలు ఉండవచ్చు. సందర్భంలో అజర్యా రాజును అనుసరించి లోపలికి ప్రవేశిస్తున్నాడు కాబట్టి ఈ అనువాదం కదలికను సహజంగా తెలుపుతూ, హెబ్రీలో లేని ప్రదేశాన్ని అదనంగా నిర్దేశించదు.
- source_word: עֲזַרְיָהוּ הַכֹּהֵן
  choice: యాజకుడైన అజర్యా
  rationale: పేరును తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించి, అతని పదవిని సహజమైన విశేషణ నిర్మాణంలో తెలిపింది.
- source_word: וְעִמּוֹ
  choice: అతనితో పాటు ... ఉన్నారు
  rationale: హెబ్రీలో ఇది క్రియలేని సహచర్య పదబంధం. తెలుగులో వాక్యం స్పష్టంగా, సహజంగా ఉండేందుకు ‘ఉన్నారు’ చేర్చబడింది.
- source_word: כֹּהֲנִים לַיהוָה
  choice: యాహ్వేకు చెందిన ... యాజకులు
  rationale: לְ ఇక్కడ సంబంధం లేదా సేవకు అంకితమైన స్థితిని సూచిస్తుంది. ‘చెందిన’ అనే పదం వారు యాహ్వే సేవలోని యాజకులని స్పష్టం చేస్తుంది.
- source_word: שְׁמוֹנִים
  choice: ఎనభైమంది
  rationale: వ్యక్తులను లెక్కించే సహజమైన తెలుగు సంఖ్యారూపం.
- source_word: בְּנֵי חָיִל
  choice: పరాక్రమవంతులైన పురుషులు
  rationale: ఈ హెబ్రీ నుడికారం బలం, ధైర్యం లేదా పరాక్రమంతో గుర్తింపు పొందిన పురుషులను సూచించగలదు. రాజును ఎదిరించిన సందర్భంలో ‘పరాక్రమవంతులు’ సహజంగా సరిపోతూ, పురుష లింగ సూచనను నిలుపుతుంది.
theological_decisions:
- issue: దైవనామమైన יהוה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో నాలుగు అక్షరాల దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, పేరుగా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను నిలుపుతుంది.
- issue: בְּנֵי חָיִל లోని పురుష లింగ వ్యక్తీకరణ
  choice: పరాక్రమవంతులైన పురుషులు
  alternative: పరాక్రమవంతులు
  rationale: ఈ సందర్భంలో పదబంధం పురుషులైన యాజకులను సూచిస్తుంది. అందువల్ల మూలంలోని లింగ సూచనను అస్పష్టం చేయకుండా ‘పురుషులు’ అని ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. హెబ్రీ వాక్యక్రమాన్ని బలవంతంగా అనుకరించకుండా, భావసంబంధాన్ని స్పష్టంగా ఉంచాం; అయితే మూలంలోని పదార్థ పరిధిని పాదసూచికలో నిలిపాం.
