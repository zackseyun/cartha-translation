source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אֲמַצְיָ֥הוּ אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/004.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that Amaziah his father had done.
translation:
  language: te
  text: అతడు తన తండ్రి అమజ్యా చేసినవాటన్నిటి ప్రకారం యాహ్వే దృష్టిలో[a] సరైనది చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యాహ్వే సన్నిధిలో.’
    reason: హీబ్రూ ‘దృష్టిలో’ నుడికారానికి సహజమైన ప్రత్యామ్నాయ వ్యక్తీకరణ.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: వావ్-వరుస కథన క్రియను తెలుగులో సహజమైన భూతకాల వాక్యంగా అందించాం; సందర్భంలోని కర్త ఉజ్జియా.
- source_word: הַיָּשָׁר
  choice: సరైనది
  rationale: עשה הישר అనే నైతిక మూల్యాంకన నుడికారానికి సహజమైన ఆధునిక తెలుగు రూపం; ‘యథార్థమైనది’ కంటే సాధారణ పాఠకులకు స్పష్టం.
- source_word: בְּעֵינֵי
  choice: దృష్టిలో
  rationale: అక్షరార్థంగా ‘కళ్లలో’ అయినా, ఒకరి మూల్యాంకనం లేదా అభిప్రాయాన్ని తెలిపే హీబ్రూ నుడికారాన్ని తెలుగులో ‘దృష్టిలో’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణతో వ్యక్తపరుస్తుంది.
- source_word: כְּכֹל אֲשֶׁר
  choice: చేసినదంతటి ప్రకారం
  rationale: כְּ యొక్క అనురూపత భావాన్నీ כֹל యొక్క సమగ్ర బలాన్నీ నిలుపుతుంది.
- source_word: עָשָׂה
  choice: చేసిన
  rationale: అమజ్యా చర్యలు ముందుగా జరిగినవని తెలుగు సంబంధ కృదంత నిర్మాణం సహజంగా తెలియజేస్తుంది.
- source_word: אֲמַצְיָהוּ
  choice: అమజ్యా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
- source_word: אָבִיו
  choice: తన తండ్రి
  rationale: ఈ సందర్భంలో అమజ్యా ఉజ్జియాకు ప్రత్యక్ష తండ్రి; ‘తన’ వాడకం సంబంధాన్ని అసందిగ్ధంగా, సహజంగా చూపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా నిలిపాం. ‘యెహోవా’ తెలుగు బైబిలు సంప్రదాయంలో విస్తృతంగా గుర్తించబడే రూపం; ప్రత్యామ్నాయ శాస్త్రీయ లిప్యంతరీకరణను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. హీబ్రూ నుడికారంలోని మూల్యాంకన భావాన్ని ‘దృష్టిలో’తో నిలిపి, అసహజమైన పదక్షర రూపాన్ని నివారించాం.
