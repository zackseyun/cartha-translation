  source_fidelity: 'హీబ్రూ రాజవంశీయ మరణ-వార్త సూత్రాన్ని విశ్వసనీయంగా ప్రతిబింబించింది: ఉజ్జియా పితరులతో ‘నిద్రించాడు,’ అతన్ని అనిర్దిష్ట కర్తలు పాతిపెట్టారు, రాజుల సమాధి-పొలంలో పితరులతో కూడ పాతిపెట్టడానికి కారణంగా అతడు מְצוֹרָע అని చెప్పబడింది, తరువాత యోతాము అతని స్థానంలో రాజయ్యాడు. కర్తరి బహువచనం (‘వారు ... పాతిపెట్టారు’) మరియు వారసత్వ భావం రెండూ నిలిచాయి.'
