source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֨ב עֻזִּיָּ֜הוּ עִם אֲבֹתָ֗י/ו וַ/יִּקְבְּר֨וּ אֹת֤/וֹ עִם אֲבֹתָי/ו֙ בִּ/שְׂדֵ֤ה הַ/קְּבוּרָה֙ אֲשֶׁ֣ר לַ/מְּלָכִ֔ים כִּ֥י אָמְר֖וּ מְצוֹרָ֣ע ה֑וּא וַ/יִּמְלֹ֛ךְ יוֹתָ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/023.yaml
  text: And Uzziah slept with his fathers[a], and they buried him with his fathers in the burial field that belonged to the kings, for they said, “He is a leper.” And Jotham his son reigned in his place.
translation:
  language: te
  text: ఉజ్జియా తన పితరులతో కూడ నిద్రించాడు. అతడు కుష్ఠరోగి[a] అని వారు చెప్పినందువల్ల, రాజులకు చెందిన సమాధుల పొలంలో అతని పితరులతో కూడ అతన్ని పాతిపెట్టారు. అతని స్థానంలో అతని కుమారుడు యోతాము రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చర్మవ్యాధిగ్రస్తుడు.” హీబ్రూ పదం צָרַעַת సోకిన వ్యక్తిని సూచిస్తుంది; అది ఆధునిక కుష్ఠువ్యాధికంటే విస్తృతమైన వ్యాధివర్గం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: నిద్రించాడు
  rationale: ‘తన పితరులతో కూడ’ అనే రాజవంశ మరణవార్త సూత్రంలో ఈ క్రియ మరణాన్ని సూచిస్తుంది. ‘చనిపోయాడు’ అని విప్పి చెప్పకుండా హీబ్రూ రూపకాన్ని నిలుపుతుంది.
- source_word: עִם אֲבֹתָיו
  choice: తన పితరులతో కూడ
  rationale: మరణం, సమాధి సందర్భాల్లో వచ్చే వంశపారంపర్య సూత్రభాషను సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: అతన్ని పాతిపెట్టారు
  rationale: హీబ్రూలో క్రియ కర్తరి బహువచనంలో ఉంది; కర్తలు ఎవరనేది పేర్కొనలేదు. తెలుగు అనిర్దిష్ట బహువచనం అదే లక్షణాన్ని కాపాడుతుంది.
- source_word: בִּשְׂדֵה הַקְּבוּרָה
  choice: సమాధుల పొలంలో
  rationale: שָׂדֶה అనే ‘పొలం’ భావాన్ని నిలుపుతూ, అంత్యక్రియల స్థలమని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר לַמְּלָכִים
  choice: రాజులకు చెందిన
  rationale: లామెదు సూచించే స్వామ్య లేదా అనుబంధ భావాన్ని అతిగా నిర్దిష్టం చేయకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מְצוֹרָע
  choice: కుష్ఠరోగి
  rationale: సాంప్రదాయకంగా తెలిసిన సంక్షిప్త పదాన్ని ప్రధాన పాఠ్యంలో ఉంచింది; అయితే హీబ్రూ צָרַעַת ఆధునిక హాన్సెన్ వ్యాధికంటే విస్తృతమైన చర్మవ్యాధి వర్గాన్ని సూచించవచ్చని పాదసూచిక తెలియజేస్తుంది.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: రాజ్య వారసత్వ సందర్భంలో ‘పాలించాడు’ కంటే సింహాసనాన్ని స్వీకరించిన భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: కాలక్రమాన్ని మాత్రమే కాకుండా రాజ్య వారసుడిగా అతని స్థానాన్ని చేపట్టిన భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: מְצוֹרָע అనే పదాన్ని ఆచార సంబంధమైన లేదా ఆధునిక వైద్య పరిభాషలో ఎలా అనువదించాలి
  choice: అతడు కుష్ఠరోగి
  alternative: అతడు చర్మవ్యాధిగ్రస్తుడు
  rationale: ఈ హీబ్రూ పదం צָרַעַת సోకిన వ్యక్తిని సూచిస్తుంది; అది ఆధునిక వైద్యశాస్త్రంలోని కుష్ఠువ్యాధికే పరిమితం కాకపోవచ్చు. పరిచితమైన సాంప్రదాయక పదాన్ని ప్రధాన పాఠ్యంలో ఉంచి, విస్తృతమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చి వైద్య నిర్ధారణను అనవసరంగా ఖరారు చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథనశైలిని ఉపయోగించాం. ‘పితరులతో కూడ నిద్రించాడు’ అనే సూత్రప్రాయ రూపకాన్ని నిలిపి, మిగతా వాక్యాన్ని సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా నిర్మించాం.
