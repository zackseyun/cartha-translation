id: 2CH.26.7
reference: 2 Chronicles 26:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעְזְרֵ֨/הוּ הָֽ/אֱלֹהִ֜ים עַל פְּלִשְׁתִּ֧ים וְ/עַל ה/ערביים הַ/יֹּשְׁבִ֥ים בְּ/גוּר בָּ֖עַל וְ/הַ/מְּעוּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/007.yaml
  text: God helped him against the Philistines[a], against the Arabians who lived in Gur-baal, and against the Meunites.
translation:
  language: te
  text: దేవుడు అతనికి ఫిలిష్తీయుల మీద, గూర్-బయలులో నివసించే అరబీయుల మీద, మెయూనీయుల[a] మీద సహాయం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మాయోనీయులు.” హీబ్రూ జననామం సంబంధితమైన లేదా రూపాంతరమైన మరో సమూహపేరును సూచిస్తూ ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְזְרֵהוּ
  choice: అతనికి సహాయం చేశాడు
  rationale: עזר అనే క్రియకు తృతీయ పురుష ఏకవచన కర్మప్రత్యయం జతై, కథన రూపంలో ‘అతనికి సహాయం చేశాడు’ అనే అర్థం వస్తుంది. ఇది దేవుణ్ణి క్రియాశీల కర్తగా నిలుపుతుంది.
- source_word: הָאֱלֹהִים
  choice: దేవుడు
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదం ఉన్నప్పటికీ, ఇక్కడ ఇది ఇశ్రాయేలు దేవునికి సాధారణ కథన నామంగా వాడబడింది; ఆధునిక తెలుగులో ‘దేవుడు’ సహజమైన రూపం.
- source_word: עַל
  choice: వ్యతిరేకంగా
  rationale: యుద్ధ సందర్భంలో ‘సహాయం చేయడం’ అనే క్రియతో వచ్చిన עַל శత్రుపక్షాలపై ప్రతిఘటనను సూచిస్తుంది.
- source_word: פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ఈ ప్రాచీన జనసమూహానికి తెలుగులో సుపరిచితమైన పేరును వాడాం.
- source_word: הערביים
  choice: అరబీయులు
  rationale: ఇది అరేబియా ప్రాంతానికి చెందిన ప్రాచీన జనసమూహాన్ని సూచిస్తుంది. ఆధునిక రాజకీయ భావసూచనలను తగ్గిస్తూ చారిత్రక సందర్భానికి సరిపోయే రూపం.
- source_word: הַיֹּשְׁבִים
  choice: నివసించే
  rationale: ישב ధాతువు ఇక్కడ ఒక ప్రాంతంలో స్థిరంగా ఉండడాన్ని సూచించే కృదంత రూపం; ‘నివసించే’ స్పష్టమైన ఆధునిక తెలుగు.
- source_word: בְּגוּר בָּעַל
  choice: గుర్-బయల్లో
  rationale: ఇది స్థలనామం కనుక లిప్యంతరీకరించాం; בְּ అనే ఉపసర్గను నివాసస్థల సందర్భంలో ‘లో’గా వ్యక్తపరిచాం.
- source_word: הַמְּעוּנִים
  choice: మెయూనీయులు
  rationale: మసొరేటిక్ పాఠంలోని מעונים అనే జననామాన్ని సమీపంగా లిప్యంతరీకరించాం. దాని ఖచ్చిత గుర్తింపు అనిశ్చితమైనందున ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions: []
translation_notes:
  register: సరళమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. హీబ్రూ వాక్యంలోని సైనిక సందర్భం, దేవుడు కర్తగా ఉండటం, జననామంలోని అనిశ్చితి నిలుపబడ్డాయి. పాదటిప్పణి సూచిక అది సంబంధించిన ‘మెయూనీయులు’ తర్వాత ఉంచబడింది.
