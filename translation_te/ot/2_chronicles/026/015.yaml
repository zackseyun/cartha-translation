source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ בִּ/ירוּשָׁלִַ֨ם חִשְּׁבֹנ֜וֹת מַחֲשֶׁ֣בֶת חוֹשֵׁ֗ב לִ/הְי֤וֹת עַל הַ/מִּגְדָּלִים֙ וְ/עַל הַ/פִּנּ֔וֹת לִ/ירוֹא֙ בַּֽ/חִצִּ֔ים וּ/בָ/אֲבָנִ֖ים גְּדֹל֑וֹת וַ/יֵּצֵ֤א שְׁמ/וֹ֙ עַד לְ/מֵ֣/רָח֔וֹק כִּֽי הִפְלִ֥יא לְ/הֵעָזֵ֖ר עַ֥ד כִּֽי חָזָֽק׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/015.yaml
  text: In Jerusalem he made devices[a], invented by skillful men, to be on the towers and on the corners, to shoot arrows and large stones. And his fame spread far abroad[c][b], for he was marvelously helped until he became strong.
translation:
  language: te
  text: యెరూషలేములో అతడు నైపుణ్యమున్న రూపకర్త ఆలోచించి రూపొందించిన యంత్రాలను[a] చేయించి, అవి బురుజుల మీదను మూలల మీదను ఉండి బాణాలను, పెద్ద రాళ్లను విసరడానికి ఉద్దేశింపబడ్డాయి. అతని పేరు ఎంతో దూరం వ్యాపించింది[b]. అతడు బలవంతుడయ్యే వరకు అద్భుతంగా సహాయం పొందాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరికరాలను,’ ‘యుద్ధ యంత్రాలను’—అంటే కోట బురుజులు, మూలలపై ఉపయోగించడానికి రూపొందించిన ఏర్పాట్లు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘అతని పేరు ఎంతో దూరం వెళ్లింది.’
    reason: lexical_alternative
  - marker: c
    text: అతనికి సహాయం చేసినవారు ఎవరో ఈ వాక్యం స్పష్టంగా చెప్పదు; అయితే సందర్భం అది దేవుని సహాయమని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: חִשְּׁבֹנוֹת
  choice: యంత్రాలు
  rationale: ఈ పదం ఆలోచించి రూపొందించిన పరికరాలు లేదా యాంత్రిక ఏర్పాట్లను సూచిస్తుంది. సైనిక సందర్భంలో ‘యంత్రాలు’ సహజంగా ఉండి, వాటి నిర్మాణాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: מַחֲשֶׁבֶת חוֹשֵׁב
  choice: నైపుణ్యంగల రూపకర్త రూపొందించిన
  rationale: మూలంలోని ఒకే ధాతువుకు చెందిన పదాల జత ఉద్దేశపూర్వక రూపకల్పనను, రూపకర్త నైపుణ్యాన్ని నొక్కిచెబుతుంది. ఏకవచన రూపాన్ని కూడా ఈ అనువాదం నిలుపుతుంది.
- source_word: עַל הַמִּגְדָּלִים וְעַל הַפִּנּוֹת
  choice: బురుజుల మీద, మూలల మీద
  rationale: מגדליםకు కోట సందర్భంలో ‘బురుజులు’ సహజమైన సమానార్థకం. פנותను వ్యాఖ్యానాత్మకంగా ‘ప్రాకారాలు’ అని మార్చకుండా ‘మూలలు’ అనే హీబ్రూ చిత్రాన్ని నిలిపాం.
- source_word: לִירוֹא בַּחִצִּים וּבָאֲבָנִים גְּדֹלוֹת
  choice: బాణాలను, పెద్ద రాళ్లను విసరడానికి
  rationale: ירה అనే ఒకే క్రియ బాణాలు, రాళ్లు రెండింటినీ నియంత్రిస్తుంది. తెలుగులో రెండింటికీ సరిపోయే ‘విసరడం’ను ఎంచుకొని మూలంలోని సంక్షిప్తతను నిలిపాం.
- source_word: וַיֵּצֵא שְׁמוֹ עַד לְמֵרָחוֹק
  choice: అతని పేరు ఎంతో దూరం వ్యాపించింది
  rationale: హీబ్రూ నుడికారాన్ని తెలుగులో అర్థమయ్యేలా ఉంచుతూ, ‘పేరు’ అనే మూల చిత్రాన్ని కూడా కాపాడుతుంది.
- source_word: הִפְלִיא לְהֵעָזֵר
  choice: అతనికి అద్భుతమైన సహాయం లభించింది
  rationale: పదబంధంలోని అసాధారణమైన లేదా ఆశ్చర్యకరమైన సహాయం భావాన్ని ‘అద్భుతమైన’ తెలియజేస్తుంది. సహాయకుడు ఎవరో చెప్పని హీబ్రూ నిర్మాణాన్ని అలాగే నిలిపాం.
- source_word: עַד כִּי חָזָק
  choice: అతడు బలవంతుడయ్యే వరకు
  rationale: సహాయం కొనసాగిన పరిమితిని లేదా ఫలితంగా చేరుకున్న స్థితిని ఈ రూపం సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: రాజుకు సహాయం చేసిన వ్యక్తి ఎవరు?
  choice: ప్రధాన పాఠ్యంలో సహాయకుణ్ణి పేర్కొనకుండా ‘అతనికి ... సహాయం లభించింది’ అని ఉంచడం
  alternative: ‘యెహోవా అతనికి అద్భుతంగా సహాయం చేశాడు’ అని దేవుణ్ణి స్పష్టంగా పేర్కొనడం
  rationale: సందర్భం దేవుని సహాయాన్ని సూచించినప్పటికీ, ఈ వాక్యంలోని హీబ్రూ పాఠ్యం సహాయకుణ్ణి స్పష్టంగా పేర్కొనదు. అందువల్ల మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను ప్రధాన పాఠ్యంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. కోట నిర్మాణ సందర్భానికి ‘బురుజులు’ వాడి, ‘మూలలు’ అనే మూలభాష చిత్రాన్ని నిలిపాం. ‘యంత్రాలు’ అనే పదానికి అడుగుసూచన ద్వారా విస్తృత అర్థపరిధిని ఇచ్చాం. సహాయకుడు ఎవరో ప్రధాన పాఠ్యంలో చేర్చకుండా వేదాంతపరమైన అస్పష్టతను కాపాడాం.
