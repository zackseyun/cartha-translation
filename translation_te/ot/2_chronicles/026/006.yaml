id: 2CH.26.6
reference: 2 Chronicles 26:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּצֵא֙ וַ/יִּלָּ֣חֶם בַּ/פְּלִשְׁתִּ֔ים וַ/יִּפְרֹ֞ץ אֶת ח֣וֹמַת גַּ֗ת וְ/אֵת֙ חוֹמַ֣ת יַבְנֵ֔ה וְ/אֵ֖ת חוֹמַ֣ת אַשְׁדּ֑וֹד וַ/יִּבְנֶ֣ה עָרִ֔ים בְּ/אַשְׁדּ֖וֹד וּ/בַ/פְּלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/006.yaml
  text: He went out and fought against the Philistines[a], and he broke down the wall of Gath, the wall of Jabneh, and the wall of Ashdod[b]; and he built cities in the territory of Ashdod and among the Philistines.
translation:
  language: te
  text: అతడు బయలుదేరి ఫిలిష్తీయులపై యుద్ధం చేశాడు; గాతు ప్రాకారాన్ని, యబ్నె ప్రాకారాన్ని, అష్డోదు ప్రాకారాన్ని పడగొట్టాడు[a]. అష్డోదు ప్రాంతంలోనూ, ఫిలిష్తీయుల మధ్యనూ పట్టణాలు కట్టాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రాకారాలకు గండ్లు కొట్టాడు.”
    reason: פרץ అనే క్రియ గోడను ఛేదించడం, దానిలో గండి కొట్టడం లేదా పడగొట్టడం అనే భావాలను ఇవ్వగలదు.
  - marker: b
    text: హీబ్రూ మూలంలో “అష్డోదులోనూ, ఫిలిష్తీయుల మధ్యనూ.” ఇక్కడ “అష్డోదు” నగరాన్నిగానీ దాని పరిసర ప్రాంతాన్నిగానీ సూచించవచ్చు.
    reason: స్థలనామ పరిధిలోని నిజమైన సందిగ్ధతను తెలియజేయడం.
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: బయలుదేరి
  rationale: יצא అనే క్రియలోని ‘వెళ్లడం/బయటకు వెళ్లడం’ అనే సాధారణ భావాన్ని సహజమైన తెలుగు కథన శైలిలో ఉంచుతుంది; ‘దండెత్తి’ వంటి అదనపు సైనిక భావాన్ని చేర్చదు.
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: ఫిలిష్తీయులతో యుద్ధం చేశాడు
  rationale: నిఫాల్ రూపంలోని לחם యుద్ధం చేయడాన్ని సూచిస్తుంది. తెలుగు వాడుకలో ‘వారితో యుద్ధం చేశాడు’ శత్రుత్వ సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּפְרֹץ אֶת חוֹמַת
  choice: ప్రాకారాన్ని పడగొట్టాడు
  rationale: గోడను వస్తువుగా తీసుకున్న פרץ దానిని ఛేదించడం లేదా కూల్చివేయడం అనే భావాన్ని ఇస్తుంది. ‘ప్రాకారాన్ని పడగొట్టాడు’ నగర రక్షణ గోడపై జరిగిన సైనిక చర్యను సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: חוֹמַת
  choice: ప్రాకారాన్ని
  rationale: ప్రతి నగరనామంతో ఏకవచనంలో వచ్చిన ‘గోడ’ను విడివిడిగా నిలుపుతుంది. నగర రక్షణ గోడకు ‘ప్రాకారం’ సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: גַּת / יַבְנֶה / אַשְׁדּוֹד
  choice: గాతు / యబ్నె / అష్డోదు
  rationale: హీబ్రూ స్థలనామాల ఆధారంగా తెలుగులో పలకడానికి అనువైన లిప్యంతరీకరణలు.
- source_word: וַיִּבְנֶה עָרִים
  choice: పట్టణాలు కట్టించాడు
  rationale: בנה యొక్క ‘కట్టు’ భావాన్ని నిలుపుతుంది. రాజు సందర్భంలో కార్యసాధక భావంతో ‘కట్టించాడు’ సహజంగా ఉన్నప్పటికీ ‘తిరిగి కట్టించాడు’ అనే మూలంలో లేని భావాన్ని చేర్చదు.
- source_word: בְּאַשְׁדּוֹד
  choice: అష్డోదు ప్రాంతంలో
  rationale: ఒక నగరం లోపల అనేక పట్టణాలు కట్టాడనే అసహజ అర్థాన్ని నివారిస్తూ, అష్డోదు నగరాన్నిగానీ దాని పరిసర ప్రాంతాన్నిగానీ సూచించగల మూలపాఠ్య సందిగ్ధతను పాదటిప్పణితో తెలియజేస్తుంది.
- source_word: וּבַפְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల మధ్యనూ
  rationale: హీబ్రూలో భూభాగనామం కాక ప్రజాసమూహ రూపమే ఉన్నందున దానిని నిలుపుతుంది; వారి అధీన ప్రాంతంలో అనే స్థానిక భావం సందర్భం ద్వారా తెలుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యక్రమంలోని చర్యల వరుసను చిన్న వాక్యాలుగా స్పష్టంగా అందించింది. స్థలనామాలకు సులభంగా పలికే తెలుగు రూపాలు వాడబడ్డాయి; మూలంలోని ముఖ్యమైన పదార్థ సందిగ్ధతలు పాదటిప్పణుల్లో నిలుపబడ్డాయి.
