source:
  edition: WLC
  text: וַ/יַּעַמְד֞וּ עַל עֻזִּיָּ֣הוּ הַ/מֶּ֗לֶךְ וַ/יֹּ֤אמְרוּ ל/וֹ֙ לֹא לְ/ךָ֣ עֻזִּיָּ֗הוּ לְ/הַקְטִיר֙ לַֽ/יהוָ֔ה כִּ֣י לַ/כֹּהֲנִ֧ים בְּנֵי אַהֲרֹ֛ן הַ/מְקֻדָּשִׁ֖ים לְ/הַקְטִ֑יר צֵ֤א מִן הַ/מִּקְדָּשׁ֙ כִּ֣י מָעַ֔לְתָּ וְ/לֹֽא לְ/ךָ֥ לְ/כָב֖וֹד מֵ/יְהוָ֥ה אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/018.yaml
  text: They stood against King Uzziah and said to him[a], “It is not for you, Uzziah, to burn incense to Yahweh, but for the priests, the sons of Aaron, who are consecrated to burn incense. Leave the sanctuary, for you have acted unfaithfully[c][b], and it will not be for your honor from Yahweh God.”
translation:
  language: te
  text: 'వారు రాజైన ఉజ్జియాను ఎదిరించి నిలబడి[a], అతనితో ఇలా అన్నారు: “ఉజ్జియా, యెహోవాకు ధూపం వేయడం నీకు తగిన పని కాదు. ధూపం వేయడానికి ప్రతిష్ఠించబడిన అహరోను కుమారులైన యాజకులకే అది తగిన పని. పరిశుద్ధస్థలం నుండి బయటికి వెళ్లు. నీవు విశ్వాసభంగం చేశావు[b]; దీనివల్ల యెహోవా దేవుని నుండి నీకు ఘనత కలగదు[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతన్ని అడ్డుకొని” లేదా “అతన్ని ఎదుర్కొని.”
    reason: హీబ్రూ ప్రయోగం ఉజ్జియాకు వ్యతిరేకంగా దృఢంగా నిలబడడాన్ని సూచిస్తుంది.
  - marker: b
    text: లేదా, “నీవు పవిత్రమైన విషయాన్ని అతిక్రమించావు.” ఈ హీబ్రూ క్రియ ముఖ్యంగా దేవునిపట్ల లేదా పవిత్ర విషయాల్లో విశ్వాసభంగం చేయడాన్ని సూచించగలదు.
    reason: మూలపదంలోని నమ్మకద్రోహం, పవిత్ర అతిక్రమణ అనే భావపరిధిని తెలియజేస్తుంది.
  - marker: c
    text: పదశః, “యెహోవా దేవుని నుండి నీకు ఘనత కోసం కాదు.” ఇది ఈ చర్య దేవుని నుండి ఘనతను తీసుకురాదని సూచించే సంక్షిప్త హీబ్రూ వ్యక్తీకరణ.
    reason: మూలంలోని అధ్యాహార నిర్మాణాన్ని, ప్రధాన పాఠ్యంలో చేసిన సహజీకరణను వివరిస్తుంది.
lexical_decisions:
- source_word: וַיַּעַמְדוּ עַל
  choice: ఎదిరించి నిలబడి
  rationale: ఈ సందర్భంలో ఈ హీబ్రూ ప్రయోగం కేవలం సమీపంలో నిలబడడాన్ని కాకుండా, ఒకరిని ప్రతిఘటిస్తూ నిలబడడాన్ని సూచిస్తుంది.
- source_word: לֹא לְךָ ... לְהַקְטִיר
  choice: ధూపం వేయడం నీకు తగిన పని కాదు
  rationale: ఈ నిర్మాణం ఆ కార్యం ఉజ్జియాకు చెందిన హక్కు లేదా బాధ్యత కాదని తెలియజేస్తుంది; ఆధునిక పరిపాలనా పదజాలాన్ని చేర్చకుండా సహజమైన తెలుగులో అందిస్తుంది.
- source_word: לְהַקְטִיר
  choice: ధూపం వేయడం
  rationale: ఈ ఆరాధనా సందర్భంలో కטר క్రియ ధూపార్పణను సూచిస్తుంది. సాధారణ పాఠకులకు 'ధూపం వేయడం' స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: హీబ్రూ దైవనామమైన יהוהను తెలుగులో విస్తృతంగా గుర్తించదగిన 'యెహోవా'గా లిప్యంతరీకరించి, మూలంలోని వ్యక్తిగత నామాన్ని నిలుపుతుంది.
- source_word: כִּי לַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: అహరోను కుమారులైన యాజకులకే
  rationale: ధూపం వేయడం ప్రతిష్ఠించబడిన అహరోనీయ యాజకులకు ప్రత్యేకించిన పని అనే వాక్య బలాన్ని 'కే' స్పష్టం చేస్తుంది.
- source_word: הַמְקֻדָּשִׁים
  choice: ప్రతిష్ఠించబడిన
  rationale: పరిశుద్ధ సేవ కోసం ప్రత్యేకంగా నియమించబడ్డ స్థితిని ఈ పదం సూచిస్తుంది; యాజక సంబంధ సందర్భానికి 'ప్రతిష్ఠించబడిన' సరిపోతుంది.
- source_word: צֵא מִן הַמִּקְדָּשׁ
  choice: పరిశుద్ధస్థలం నుండి బయటికి వెళ్లు
  rationale: מקדש అనే పదంలోని పవిత్ర ఆలయ ప్రదేశ భావాన్ని నిలుపుతూ, తెలుగులో నేరుగా వినిపించే ఆజ్ఞగా అనువదించబడింది.
- source_word: מָעַלְתָּ
  choice: విశ్వాసఘాతుకంగా ప్రవర్తించావు
  rationale: ఆరాధనా లేదా నిబంధన సందర్భంలో מעל దేవునిపట్ల తీవ్రమైన నమ్మకద్రోహం, పవిత్ర విషయ అతిక్రమణను సూచిస్తుంది; సాధారణ తప్పుగా పలుచన చేయకుండా ఈ గంభీరతను నిలుపుతుంది.
- source_word: וְלֹא לְךָ לְכָבוֹד מֵיְהוָה אֱלֹהִים
  choice: దీనివల్ల యెహోవా దేవుని నుండి నీకు ఘనత కలగదు
  rationale: హీబ్రూలోని సంక్షిప్త, అధ్యాహార వాక్యాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తూ, ఈ చర్య దేవుని నుండి ఘనతకు దారితీయదనే భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: ఆలయంలో ధూపం వేయడంలో యాజకుల ప్రత్యేక బాధ్యత
  choice: ధూపం వేయడం ప్రతిష్ఠించబడిన అహరోను కుమారులైన యాజకులకే తగిన పని అని స్పష్టంగా తెలిపింది.
  alternative: ఇది రాజరికం, యాజకత్వం లేదా ఆరాధనా నాయకత్వం గురించి సాధారణ సూత్రం మాత్రమే అని అనువదించడం.
  rationale: మూలవాక్యం సాధారణ నాయకత్వం గురించి కాకుండా, ధూపార్పణ అనే నిర్దిష్ట ఆలయ కార్యాన్ని అహరోనీయ యాజకులకు ప్రత్యేకిస్తుంది.
- issue: מָעַלְתָּ యొక్క నైతిక-ఆధ్యాత్మిక తీవ్రత
  choice: విశ్వాసఘాతుకంగా ప్రవర్తించావు
  alternative: కేవలం విధానపరమైన తప్పు చేశావు లేదా అతిక్రమించావు
  rationale: ఆరాధనా సందర్భంలో ఈ క్రియ పవిత్రమైన క్రమానికి వ్యతిరేకంగా చేసిన తీవ్రమైన ద్రోహాన్ని సూచిస్తుంది; అయితే తరువాతి సిద్ధాంతపరమైన వర్గీకరణలను అనువాదంలో చేర్చలేదు.
- issue: చివరి ఖండంలోని అధ్యాహారం
  choice: ఈ చర్య వల్ల యెహోవా దేవుని నుండి ఉజ్జియాకు ఘనత కలగదని తెలిపింది.
  alternative: పదశః 'నీకు ఘనత కోసం కాదు' అని అసహజంగా ఉంచడం లేదా అది తప్పనిసరిగా అవమానాన్ని తెస్తుందని విస్తరించడం.
  rationale: మూలంలోని సంక్షిప్త నిర్మాణం ఫలితాన్ని సూచిస్తుంది. తెలుగు పాఠకునికి అర్థమయ్యేలా అవసరమైనంత మాత్రమే స్పష్టం చేసి, 'అవమానం' అనే వ్యతిరేక ఫలితాన్ని అదనంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, నేరుగా అర్థమయ్యే శైలిని వాడాం. ఆలయ సందర్భానికి తగిన 'యాజకులు,' 'ప్రతిష్ఠించబడిన,' 'పరిశుద్ధస్థలం,' 'ధూపం' వంటి స్థిరమైన పదాలను ఉంచి, అతిగా ప్రాచీనమైన లేదా సంఘవర్గ-ప్రత్యేక పదజాలాన్ని నివారించాం.
