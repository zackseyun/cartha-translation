review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the opposition to Uzziah, the restriction of incense offering to consecrated Aaronic priests, the command to leave the sanctuary, and the elliptical denial of honor from YHWH God. The phrase “విశ్వాసఘాతుకంగా ప్రవర్తించావు,” however, is less idiomatic and can suggest interpersonal treachery more narrowly than the cultic/covenantal breach denoted by מָעַלְתָּ.
  naturalness: The Telugu is generally modern, clear, and appropriately formal. Moving footnote a to the phrase it annotates improves anchoring. Replacing “విశ్వాసఘాతుకంగా ప్రవర్తించావు” with “విశ్వాసభంగం చేశావు” is more natural and clearly communicates serious breach of faith in this sacred context.
  terminology: “యెహోవా,” “ధూపం వేయడం,” “అహరోను కుమారులైన యాజకులు,” “ప్రతిష్ఠించబడిన,” and “పరిశుద్ధస్థలం” are suitable. “విశ్వాసభంగం” preserves the gravity of מעל without importing a specific denominational interpretation.
  issues:
  - severity: low
