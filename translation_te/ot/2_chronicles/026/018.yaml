  revised_text: 'వారు రాజైన ఉజ్జియాను ఎదిరించి నిలబడి[a], అతనితో ఇలా అన్నారు: “ఉజ్జియా, యెహోవాకు ధూపం వేయడం నీకు తగిన పని కాదు. ధూపం వేయడానికి ప్రతిష్ఠించబడిన అహరోను కుమారులైన యాజకులకే అది తగిన పని. పరిశుద్ధస్థలం నుండి బయటికి వెళ్లు. నీవు విశ్వాసభంగం చేశావు[b]; దీనివల్ల యెహోవా దేవుని నుండి నీకు ఘనత కలగదు[c].”'
