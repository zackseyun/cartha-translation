source:
  edition: WLC
  text: וַ/יִּ֣פֶן אֵלָ֡י/ו עֲזַרְיָהוּ֩ כֹהֵ֨ן הָ/רֹ֜אשׁ וְ/כָל הַ/כֹּהֲנִ֗ים וְ/הִנֵּה ה֤וּא מְצֹרָע֙ בְּ/מִצְח֔/וֹ וַ/יַּבְהִל֖וּ/הוּ מִ/שָּׁ֑ם וְ/גַם הוּא֙ נִדְחַ֣ף לָ/צֵ֔את כִּ֥י נִגְּע֖/וֹ יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/020.yaml
  text: Azariah the chief priest turned toward him[a], and all the priests also, and behold, he was leprous on his forehead. So they hurried him out of there, and he himself also hastened to go out[c][b], because Yahweh had struck him.
translation:
  language: te
  text: ప్రధాన యాజకుడైన అజర్యా మరియు యాజకులందరూ అతని వైపు తిరిగారు. ఇదిగో, అతని నుదుటిపై చర్మవ్యాధి[a] ఉంది. కాబట్టి వారు అతన్ని అక్కడి నుంచి తొందరగా బయటికి పంపించారు[b]. యాహ్వే అతన్ని దెబ్బతీశాడు కాబట్టి, అతను కూడా బయటికి వెళ్లడానికి తొందరపడ్డాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ పదం యాజక అపవిత్రత నియమాల్లో చెప్పబడే చర్మసంబంధ వ్యాధిని సూచిస్తుంది; అది ఆధునిక వైద్యశాస్త్రంలోని కుష్ఠు లేదా హాన్సెన్ వ్యాధికే తప్పనిసరిగా పరిమితం కాదు.
    reason: cultural_note
  - marker: b
    text: లేదా, “వారు అతన్ని అక్కడి నుంచి తరిమివేశారు.” హీబ్రూ క్రియ బలవంతంగా తొలగించడాన్ని గానీ, ఆ క్షణంలోని అత్యవసర తొందరను గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “అతను బయటికి వెళ్లేలా నెట్టబడ్డాడు.” హీబ్రూ రూపం అతను బయటికి వెళ్లడానికి ప్రేరేపించబడ్డాడనే భావాన్ని ఉద్ఘాటించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן אֵלָיו ... וְכָל הַכֹּהֲנִים
  choice: అతని వైపు తిరిగి చూశారు
  rationale: פנה + אֵלָיו శారీరకంగా అతని వైపు తిరగడాన్ని సూచిస్తుంది. సమూహ కర్తతో సహజమైన ఆధునిక తెలుగులో బహువచన క్రియ వాడబడింది.
- source_word: עֲזַרְיָהוּ כֹהֵן הָרֹאשׁ
  choice: ప్రధాన యాజకుడైన అజర్యా
  rationale: כֹהֵן הָרֹאשׁ అక్షరార్థంగా ‘ముఖ్య/ప్రధాన యాజకుడు’; మూలంలో లేని మరింత సాంకేతిక పదవీభావాన్ని చేర్చకుండా ‘ప్రధాన యాజకుడు’గా అనువదించబడింది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: అకస్మాత్తుగా గమనించిన విషయాన్ని ముందుకు తెచ్చే హీబ్రూ కథన ఉద్ఘాటనను నిలుపుతుంది.
- source_word: מְצֹרָע בְּמִצְחוֹ
  choice: అతని నుదుటి మీద తీవ్రమైన చర్మవ్యాధి కనిపించింది
  rationale: מְצֹרָע యాజక ధర్మశాస్త్రంలోని అపవిత్రతకు సంబంధించిన విస్తృత చర్మరోగ పదం; దాన్ని ఆధునిక హాన్సెన్ వ్యాధితో తప్పనిసరిగా సమానం చేయకుండా, కనిపించే స్థితిగా సహజ తెలుగులో వ్యక్తం చేసింది.
- source_word: וַיַּבְהִלוּהוּ מִשָּׁם
  choice: వారు అతన్ని అక్కడి నుంచి హడావిడిగా బయటికి పంపించారు
  rationale: בהל హిఫిల్ రూపం తొందరపెట్టడం లేదా భయాందోళనతో త్వరగా తొలగించడం అనే భావం ఇస్తుంది. బలవంతంగా తరిమివేశారనే భావాన్ని ఖచ్చితంగా నిర్ణయించకుండా అత్యవసరతను నిలుపుతుంది.
- source_word: וְגַם הוּא נִדְחַף לָצֵאת
  choice: అతను కూడా త్వరగా బయటికి వెళ్లడానికి తొందరపడ్డాడు
  rationale: דחף నిఫల్ రూపంలో బయటికి నెట్టబడటం లేదా ప్రేరేపింపబడి త్వరపడటం రెండూ సాధ్యం. ప్రధాన పాఠంలో సందర్భోచిత స్వీయ తొందరను ఇచ్చి, కర్మణి భావాన్ని పాదసూచికలో నిలిపింది.
- source_word: כִּי נִגְּעוֹ יְהוָה
  choice: యెహోవా అతన్ని దెబ్బతీశాడు
  rationale: ఈ శిక్షాత్మక సందర్భంలో נגע సాధారణ ‘తాకడం’ కంటే దైవికంగా దెబ్బతీయడం లేదా వ్యాధితో బాధించడం అనే భావం ఇస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరంగా ప్రాచుర్యంలో ఉన్న ‘యెహోవా’ రూపంలో వ్యక్తం చేసింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చలేదు. ఆధునిక తెలుగు బైబిల్ పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకుంది; ఉచ్చారణ పునర్నిర్మాణమైన ‘యాహ్వే’ కూడా సాధ్యమే.
- issue: כֹהֵן הָרֹאשׁ సాంకేతిక పదవినా కాదా
  choice: ప్రధాన యాజకుడు
  alternative: ప్రధాన యాజకాధిపతి
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ముఖ్య యాజకుడు’ అని చెబుతుంది. మూలం స్పష్టంగా చెప్పని తరువాతి కాలపు సాంకేతిక పదవీభేదాన్ని దిగుమతి చేయలేదు.
- issue: చర్మవ్యాధి స్వరూపం
  choice: తీవ్రమైన చర్మవ్యాధి
  alternative: కుష్ఠరోగం
  rationale: מְצֹרָע యాజక అపవిత్రత నియమాల్లోని విస్తృత వర్గాన్ని సూచిస్తుంది; అది ఆధునిక వైద్యపరమైన కుష్ఠు/హాన్సెన్ వ్యాధికే పరిమితం కాదు.
- issue: נִדְחַף లో కర్త స్వయంగా త్వరపడటమా లేక నెట్టబడటమా
  choice: అతను కూడా ... తొందరపడ్డాడు
  alternative: అతను కూడా బయటికి వెళ్లేలా నెట్టబడ్డాడు
  rationale: రూపం కర్మణి లేదా ప్రేరేపిత భావాన్ని అనుమతించినా, వెంటనే వచ్చే కారణవాక్యం అతను స్వయంగా అత్యవసరంగా వెళ్లిన భావానికి అనుకూలంగా ఉంది. అస్పష్టతను పాదసూచికలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. కథనంలోని ఆకస్మికతకు ‘ఇదిగో’, అత్యవసరతకు ‘హడావిడిగా’ వాడబడ్డాయి. వైద్యపరంగా తప్పుదారి పట్టించే సంప్రదాయ పదాన్ని ప్రధాన పాఠంలో నివారించి, మూలపదపు సాంస్కృతిక పరిధిని పాదసూచికలో వివరించింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో వరుసగా ఉన్నాయి.
