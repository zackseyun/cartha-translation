translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. కోట నిర్మాణ సందర్భానికి ‘బురుజులు’, ‘గోడ మలుపు’ వంటి స్పష్టమైన పదాలు వాడబడ్డాయి; హీబ్రూలోని స్థలసంబంధ అనిశ్చితిని అతిగా నిర్ధారించలేదు.
