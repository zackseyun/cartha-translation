id: 2CH.26.9
reference: 2 Chronicles 26:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּ֨בֶן עֻזִּיָּ֤הוּ מִגְדָּלִים֙ בִּ/יר֣וּשָׁלִַ֔ם עַל שַׁ֧עַר הַ/פִּנָּ֛ה וְ/עַל שַׁ֥עַר הַ/גַּ֖יְא וְ/עַל הַ/מִּקְצ֑וֹעַ וַֽ/יְחַזְּקֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/009.yaml
  text: Uzziah built towers in Jerusalem at the Corner Gate[a], at the Valley Gate, and at the Angle, and he fortified them.
translation:
  language: te
  text: ఉజ్జియా యెరూషలేములో మూల ద్వారం దగ్గర, లోయ ద్వారం దగ్గర, మలుపు దగ్గర[a] బురుజులను నిర్మించి వాటిని బలపరిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మూల దగ్గర.” హీబ్రూ పదం కోణాన్ని, మూలను లేదా కోటగోడ తిరిగే చోటును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: కట్టించాడు
  rationale: బנה అంటే ‘కట్టు/నిర్మించు’. రాజు స్వయంగా నిర్మించాడనే భావం రాకుండా, రాజాజ్ఞతో జరిగిన నిర్మాణాన్ని సహజమైన తెలుగు ప్రయోగం తెలియజేస్తుంది.
- source_word: עֻזִּיָּהוּ
  choice: ఉజ్జియా
  rationale: హీబ్రూ వ్యక్తిపేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: מִגְדָּלִים
  choice: బురుజులు
  rationale: కోటగోడలు, పట్టణ రక్షణ నిర్మాణాల సందర్భంలో מִגְדָּלִים అనే పదానికి ‘బురుజులు’ సహజమైన, నిర్దిష్టమైన తెలుగు పదం.
- source_word: בִּירוּשָׁלִַם
  choice: యెరూషలేములో
  rationale: స్థలార్థక ב ఉపసర్గను తెలుగులో ‘-లో’తో సహజంగా వ్యక్తం చేసింది.
- source_word: עַל
  choice: దగ్గర
  rationale: ద్వారాలు, గోడ మలుపు వద్ద బురుజుల స్థానాన్ని సూచించే ఈ సందర్భంలో ‘దగ్గర’ సహజం; నిర్మాణాలు వాటి మీదనే ఉన్నాయని అనవసరంగా నిర్ధారించదు.
- source_word: שַׁעַר הַפִּנָּה
  choice: మూల ద్వారం
  rationale: ఇది నగర ద్వారం పేరు; ‘మూల’ అనే పదం పינה యొక్క మూల/కోణ భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: שַׁעַר הַגַּיְא
  choice: లోయ ద్వారం
  rationale: גיא అంటే ‘లోయ’; ద్వారం పేరుగా ‘లోయ ద్వారం’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: הַמִּקְצוֹעַ
  choice: గోడ మలుపు
  rationale: ఈ పదం నిర్మాణంలోని కోణం, మూల లేదా తిరిగే చోటును సూచిస్తుంది. ముందే వచ్చిన ‘మూల ద్వారం’తో గందరగోళం రాకుండా, సందర్భంలోని కోటగోడను స్పష్టం చేస్తూ ‘గోడ మలుపు’ ఎంచుకుంది.
- source_word: וַיְחַזְּקֵם
  choice: వాటిని బలపరిచాడు
  rationale: పియేల్ రూపంలోని חזק ఇక్కడ రక్షణ నిర్మాణాలను దృఢపరచడం అనే భావం ఇస్తుంది. బహువచన ప్రత్యయం సహజంగా ముందున్న బురుజులను సూచిస్తుంది.
