source:
  edition: WLC
  text: וַ/יִּתְּנ֧וּ הָֽ/עַמּוֹנִ֛ים מִנְחָ֖ה לְ/עֻזִּיָּ֑הוּ וַ/יֵּ֤לֶךְ שְׁמ/וֹ֙ עַד לְ/ב֣וֹא מִצְרַ֔יִם כִּ֥י הֶחֱזִ֖יק עַד לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/008.yaml
  text: The Ammonites gave tribute to Uzziah[a], and his fame spread as far as the entrance of Egypt[b], for he had become exceedingly strong.
translation:
  language: te
  text: అమ్మోనీయులు ఉజ్జియాకు కప్పం చెల్లించారు. అతని కీర్తి[a] ఐగుప్తు ప్రవేశద్వారం వరకు[b] వ్యాపించింది; ఎందుకంటే అతడు అత్యంత శక్తిమంతుడయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘అతని పేరు వ్యాపించింది.’ హీబ్రూలో ‘పేరు’ ఇక్కడ ఖ్యాతి లేదా కీర్తి అనే భావంలో వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: ‘ఐగుప్తు ప్రవేశద్వారం’ అనేది ఐగుప్తుకు వెళ్లే మార్గాన్ని లేదా దాని సరిహద్దు ప్రాంతాన్ని సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: הָעַמּוֹנִים
  choice: అమ్మోనీయులు
  rationale: ఇది అమ్మోను ప్రజలను సూచించే జాతి/దేశ నామం; ఆధునిక తెలుగు బైబిలు వాడుకలో స్పష్టంగా గుర్తించదగిన రూపం.
- source_word: מִנְחָה
  choice: కప్పం
  rationale: విదేశీ ప్రజలు ఒక రాజుకు ఇచ్చే రాజకీయ సందర్భంలో ఇది సాధారణ కానుక లేదా అర్పణకన్నా లోబడినవారు చెల్లించే కప్పాన్ని సూచిస్తుంది.
- source_word: וַיֵּלֶךְ שְׁמוֹ
  choice: అతని కీర్తి వ్యాపించింది
  rationale: అక్షరార్థంగా ‘అతని పేరు వెళ్లింది’; ఇక్కడ ‘పేరు’ అతని ఖ్యాతి లేదా కీర్తిని సూచిస్తుంది. తెలుగు సహజ వ్యక్తీకరణగా భావాన్ని అందిస్తూ వ్యాప్తి రూపకాన్ని నిలుపుతుంది.
- source_word: עַד לְבוֹא מִצְרַיִם
  choice: ఐగుప్తు ప్రవేశ ప్రాంతం వరకు
  rationale: ‘ఐగుప్తు ప్రవేశం వరకు’ అనే హీబ్రూ రూపాన్ని పూర్తిగా ‘ఐగుప్తు వరకు’గా సరళీకరించకుండా, ఐగుప్తుకు చేరే మార్గం లేదా సరిహద్దు ప్రాంతం అనే సాధ్యమైన భావాన్ని నిలుపుతుంది.
- source_word: הֶחֱזִיק
  choice: బలవంతుడయ్యాడు
  rationale: ఈ సందర్భంలో క్రియ బలాన్ని లేదా అధికారాన్ని అధికంగా సంపాదించడాన్ని సూచిస్తుంది; కారణాన్ని తెలిపే చివరి వాక్యభాగానికి ఈ రూపం సహజంగా సరిపోతుంది.
- source_word: עַד לְמָעְלָה
  choice: అత్యంత
  rationale: ముందున్న బలపడటాన్ని అత్యున్నత స్థాయిలో తీవ్రపరిచే హీబ్రూ నుడికారాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
