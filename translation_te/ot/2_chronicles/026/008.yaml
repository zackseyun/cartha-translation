translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘కప్పం’ రాజకీయ సందర్భాన్ని స్పష్టం చేస్తుంది; ‘ప్రవేశ ప్రాంతం’ మూలంలోని భౌగోళిక అనిశ్చితిని పాదటీకతో సహా నిలుపుతుంది.
