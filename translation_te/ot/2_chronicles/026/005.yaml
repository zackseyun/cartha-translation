source:
  edition: WLC
  text: וַ/יְהִי֙ לִ/דְרֹ֣שׁ אֱלֹהִ֔ים בִּ/ימֵ֣י זְכַרְיָ֔הוּ הַ/מֵּבִ֖ין בִּ/רְאֹ֣ת הָ/אֱלֹהִ֑ים וּ/בִ/ימֵי֙ דָּרְשׁ֣/וֹ אֶת יְהוָ֔ה הִצְלִיח֖/וֹ הָ/אֱלֹהִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/005.yaml
  text: He continued to seek God in the days of Zechariah[a], who had understanding in the visions of God; and as long as he sought Yahweh[b], God made him prosper.
translation:
  language: te
  text: దేవుని దర్శనాల పట్ల అవగాహనగల జెకర్యా దినాల్లో అతడు దేవుణ్ణి వెదకుతూ ఉన్నాడు. అతడు యెహోవాను వెదికినంతకాలం[b], దేవుడు అతనికి అభివృద్ధి కలిగించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా, ‘అతడు యెహోవాను వెదికిన రోజుల్లో.’
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְהִי לִדְרֹשׁ אֱלֹהִים
  choice: అతడు దేవుణ్ణి వెదకుతూ ఉన్నాడు
  rationale: היה + ל־ infinitive కొనసాగుతున్న అలవాటు లేదా ఆచరణను సూచిస్తుంది. దినవృత్తాంతాల్లో דרש దేవునిపై భక్తితో ఆధారపడుతూ ఆయనను ఆశ్రయించడాన్ని సూచిస్తుంది; అందువల్ల ‘వెదకుతూ ఉన్నాడు’ సహజంగా, మూలార్థానికి దగ్గరగా ఉంది.
- source_word: בִּימֵי זְכַרְיָהוּ
  choice: జెకర్యా దినాల్లో
  rationale: కాలాన్ని సూచించే హీబ్రూ పదబంధాన్ని సంక్షిప్తమైన, సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: הַמֵּבִין בִּרְאֹת הָאֱלֹהִים
  choice: దేవుని దర్శనాల విషయంలో అవగాహనగల
  rationale: మసొరెటిక్ పాఠంలోని בין ‘అవగాహన/వివేచన’ను, רְאֹת ‘చూడడం/దర్శనాలు’ అనే భావాన్ని ఇస్తాయి. కష్టమైన ఈ పదబంధాన్ని ‘ఉపదేశించినవాడు’ అని విస్తరించకుండా మూలానికి దగ్గరగా ఉంచింది.
- source_word: וּבִימֵי דָּרְשׁוֹ אֶת־יְהוָה
  choice: అతడు యెహోవాను వెదికినంతకాలం
  rationale: ఈ నిర్మాణం అతడు యెహోవాను వెదికిన కాలమంతటినీ సూచిస్తుంది. ‘వెదికినంతకాలం’ దాని కాలవ్యాప్తిని, తదనంతర ఫలితంతో ఉన్న సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణగా అందించింది.
- source_word: הִצְלִיחוֹ הָאֱלֹהִים
  choice: దేవుడు అతణ్ణి వర్ధిల్లజేశాడు
  rationale: צלח హిఫిల్ రూపం విజయాన్ని లేదా వర్ధిల్లడాన్ని కలిగించడం అనే కారణార్థాన్ని కలిగి ఉంది; ఈ ఎంపిక దేవుడే దానికి కారకుడని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: בִּרְאֹת הָאֱלֹהִים అనే కష్టమైన పదబంధం అర్థం
  choice: జెకర్యా దేవుని దర్శనాల విషయంలో అవగాహనగలవాడు
  alternative: జెకర్యా దేవుని భయభక్తుల విషయంలో ఉపదేశించినవాడు
  rationale: మసొరెటిక్ స్వరచిహ్నాలు ‘చూడడం/దర్శనాలు’కు సంబంధించిన పఠనానికే మద్దతిస్తాయి. ‘దేవుని భయం’ అనే పఠనం సందర్భానికి సులభంగా అనిపించినా, అది పాఠాన్ని సవరించి లేదా సులభతరం చేసి అర్థం చేసుకోవడం. అందువల్ల ప్రధాన పాఠంలో దర్శనాలకు సంబంధించిన భావాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: וּבִימֵי דָּרְשׁוֹ యొక్క కాలసంబంధ భావం
  choice: అతడు యెహోవాను వెదికినంతకాలం
  alternative: అతడు యెహోవాను వెదికిన రోజుల్లో
  rationale: ‘వెదికినంతకాలం’ అనే రూపం ఆ ఆచరణ కొనసాగిన కాలవ్యాప్తిని, దానితో అనుసంధానమైన వర్ధిల్లుదలను తెలుపుతుంది; అయితే దీనిని కఠినమైన షరతుగా అతిగా సిద్ధాంతీకరించకుండా కాలసంబంధంగానే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని అనుసరించాం. ‘దర్శనాలు,’ ‘అవగాహనగల,’ ‘వర్ధిల్లజేశాడు’ వంటి పదాలు గంభీరతను నిలుపుతూ అధిక ప్రాచీనతను నివారిస్తాయి. ప్రతి పాదసూచిక సూచిక ప్రధాన పాఠంలో పొందుపరచబడింది.
