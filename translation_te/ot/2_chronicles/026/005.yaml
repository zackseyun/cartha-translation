  to: దేవుని దర్శనాల పట్ల అవగాహనగల జెకర్యా దినాల్లో అతడు దేవుణ్ణి వెదకుతూ ఉన్నాడు. అతడు యెహోవాను వెదికినంతకాలం[b], దేవుడు అతనికి అభివృద్ధి కలిగించాడు.
