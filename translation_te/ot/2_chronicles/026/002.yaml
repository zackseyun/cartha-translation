  text: He built Eloth and restored it to Judah after the king slept with his fathers[a][b].
translation:
  language: te
  text: అతడే ఏలోతును నిర్మించి, రాజు తన పితరులతో కూడ నిద్రించిన తరువాత దాన్ని యూదాకు తిరిగి చేర్చాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దాన్ని యూదాకు తిరిగి తీసుకొచ్చాడు.’
    reason: lexical_alternative
  - marker: b
    text: ‘తన పితరులతో కూడ నిద్రించాడు’ అనేది మరణాన్ని సూచించే హెబ్రీ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: בָּנָה
  choice: నిర్మించి
  rationale: మూల క్రియకు సాధారణ అర్థం ‘నిర్మించు.’ ఆ స్థలం మునుపే ఉన్నందున ‘పునర్నిర్మించాడు’ అనే భావం సందర్భంలో సాధ్యమైనా, క్రియలో అది స్పష్టంగా లేదు.
- source_word: אֵילוֹת
  choice: ఏలోతు
  rationale: ఇది స్థలనామం; హెబ్రీ రూపాన్ని ఆధారంగా చేసుకొని తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: וַיְשִׁיבֶהָ
  choice: దాన్ని ... తిరిగి చేర్చాడు
  rationale: שׁוב హిఫీల్ రూపం ‘తిరిగి వచ్చేలా చేయడం’ అనే కారణార్థాన్ని ఇస్తుంది; స్త్రీలింగ ఏకవచన ప్రత్యయం ఏలోతును సూచిస్తుంది. ఇక్కడ యూదా అధీనంలోకి మళ్లీ చేర్చడం భావం.
- source_word: לִיהוּדָה
  choice: యూదాకు
  rationale: ל ఉపసర్గ పునఃచేర్పు యొక్క గమ్యాన్ని లేదా గ్రహీతను సూచిస్తుంది.
- source_word: אַחֲרֵי שְׁכַב
  choice: నిద్రించిన తరువాత
  rationale: రాజుల మరణవివరణలో ఇది మరణాన్ని సూచించే హెబ్రీ సౌమ్యోక్తి; దానిని వ్యాఖ్యానాత్మకంగా ‘చనిపోయిన తరువాత’ అని మార్చకుండా మూల రూపకం నిలుపబడింది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: మూలంలో వ్యక్తినామం కాక ‘రాజు’ అనే పదమే ఉంది; సందర్భం సూచించే పేరును పాఠ్యంలో చేర్చలేదు.
- source_word: עִם אֲבֹתָיו
  choice: తన పితరులతో కూడ
  rationale: మరణాన్ని సూచించే సంప్రదాయ హెబ్రీ నుడికారాన్ని దగ్గరగా నిలుపుతుంది; ‘పూర్వీకులతో’ అనేది సాధ్యమైన మరింత వివరణాత్మక ప్రత్యామ్నాయం.
