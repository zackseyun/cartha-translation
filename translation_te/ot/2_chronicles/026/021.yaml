  to: ఉజ్జియా రాజు తన మరణదినం వరకు చర్మవ్యాధిగ్రస్తుడిగా[a] ఉన్నాడు. అతడు చర్మవ్యాధిగ్రస్తుడై ప్రత్యేక గృహంలో[b] నివసించాడు; ఎందుకంటే అతడు యాహ్వే మందిరం నుండి వేరుచేయబడ్డాడు[c]. అతని కుమారుడైన యోతాము రాజభవన వ్యవహారాలను పర్యవేక్షిస్తూ దేశ ప్రజలకు న్యాయం తీర్చేవాడు.
