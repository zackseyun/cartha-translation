source:
  edition: WLC
  text: וַ/יְהִי֩ עֻזִּיָּ֨הוּ הַ/מֶּ֜לֶךְ מְצֹרָ֣ע עַד י֣וֹם מוֹת֗/וֹ וַ/יֵּ֜שֶׁב בֵּ֤ית ה/חפשות מְצֹרָ֔ע כִּ֥י נִגְזַ֖ר מִ/בֵּ֣ית יְהוָ֑ה וְ/יוֹתָ֤ם בְּנ/וֹ֙ עַל בֵּ֣ית הַ/מֶּ֔לֶךְ שׁוֹפֵ֖ט אֶת עַ֥ם הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/021.yaml
  text: And King Uzziah was leprous until the day of his death[a], and he lived in a separate house, leprous, because he was cut off from the house of Yahweh. And Jotham his son was over the king’s house[b], judging the people of the land.
translation:
  language: te
  text: ఉజ్జియా రాజు తన మరణదినం వరకు చర్మవ్యాధిగ్రస్తుడిగా[a] ఉన్నాడు. అతడు చర్మవ్యాధిగ్రస్తుడై ప్రత్యేక గృహంలో[b] నివసించాడు; ఎందుకంటే అతడు యాహ్వే మందిరం నుండి వేరుచేయబడ్డాడు[c]. అతని కుమారుడైన యోతాము రాజభవన వ్యవహారాలను పర్యవేక్షిస్తూ దేశ ప్రజలకు న్యాయం తీర్చేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం צרעת వివిధ రకాల చర్మవ్యాధులను సూచించవచ్చు; అది ఆధునిక వైద్యశాస్త్రంలో ‘కుష్ఠువ్యాధి’ అని పిలిచే వ్యాధికే పరిమితం కాదు.
    reason: lexical_scope
  - marker: b
    text: అక్షరార్థంగా, ‘విముక్తి గృహం’; ఈ క్లిష్టమైన హీబ్రూ పదబంధం ఉజ్జియా తన వ్యాధి కారణంగా వేరుగా నివసించిన గృహాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘యాహ్వే మందిరం నుండి వెలివేయబడ్డాడు.’
    reason: alternative_rendering
lexical_decisions:
- source_word: מְצֹרָע
  choice: చర్మవ్యాధిగ్రస్తుడు
  rationale: צרעת అనే బైబిలు పదం ఆధునిక వైద్యశాస్త్రంలోని కుష్ఠువ్యాధికే పరిమితం కాదు. అందువల్ల వ్యాధిని అతిగా నిర్దిష్టం చేయకుండా, ఆ వ్యక్తి పరిస్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేయడానికి ఈ పదాన్ని ఎంచుకున్నాం.
- source_word: בֵּית הַחפשות
  choice: ప్రత్యేక గృహం
  rationale: ఈ క్లిష్టమైన హీబ్రూ పదబంధం ఉజ్జియా తన వ్యాధి కారణంగా ఇతరుల నుండి వేరుగా నివసించిన గృహాన్ని సూచిస్తున్నట్లు సందర్భం తెలియజేస్తుంది. అక్షరార్థాన్ని పాదసూచికలో ఉంచి, ప్రధాన పాఠంలో సందర్భార్థాన్ని ఇచ్చాం.
- source_word: נִגְזַר מִבֵּית יְהוָה
  choice: యాహ్వే మందిరం నుండి వేరుచేయబడ్డాడు
  rationale: נִגְזַר అనే పదంలోని ‘తెగగొట్టడం/వేరుచేయడం’ అనే బలాన్ని నిలుపుతూ, ఆలయ ప్రవేశం నుండి అతడు తొలగించబడిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే మందిరం
  rationale: హీబ్రూలో అక్షరార్థం ‘యాహ్వే గృహం’; ఈ సందర్భంలో అది ఆలయాన్నే సూచిస్తున్నందున ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ‘మందిరం’ అని అనువదించాం.
- source_word: עַל בֵּית הַמֶּלֶךְ
  choice: రాజభవన బాధ్యత వహిస్తూ
  rationale: ఈ పదబంధం రాజగృహం లేదా రాజభవన పరిపాలనపై యోతాముకు ఉన్న పర్యవేక్షణను సూచిస్తుంది. హీబ్రూ పరిపాలనా భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: שׁוֹפֵט אֶת עַם הָאָרֶץ
  choice: దేశ ప్రజలకు న్యాయం తీర్చేవాడు
  rationale: שׁוֹפֵט న్యాయతీర్పుతో పాటు పరిపాలనా కార్యాన్ని కూడా సూచించగలదు. ‘న్యాయం తీర్చేవాడు’ మూలపదంతో ఉన్న సంబంధాన్ని కాపాడుతూ సందర్భానికి తగిన విస్తృత అధికారాన్ని అనుమతిస్తుంది.
- source_word: עַם הָאָרֶץ
  choice: దేశ ప్రజలు
  rationale: ఈ పదబంధానికి ఉండగల సాంఘిక-రాజకీయ ప్రత్యేకార్థాన్ని అనవసరంగా సంకుచితం చేయకుండా హీబ్రూకు దగ్గరగా అనువదించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ఒడంబడిక దైవనామమైన יהוה నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ ఉచ్చారణకు సమీపమైన ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: ఉజ్జియా ఆలయం నుండి వేరుచేయబడిన స్థితి
  choice: వేరుచేయబడ్డాడు
  alternative: వెలివేయబడ్డాడు; తెగగొట్టబడ్డాడు
  rationale: హీబ్రూ క్రియలోని బలాన్ని నిలుపుతూ, ఇది మరణశిక్ష లేదా దేవునితో శాశ్వత సంబంధవిచ్ఛేదమని అనవసరంగా నిర్ణయించకుండా ఆలయ ప్రవేశం నుండి అతని వేరుపాటును తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభంగా అర్థమయ్యే కథనశైలిని ఉపయోగించాం. వైద్యపరంగా అతిగా నిర్దిష్టమైన ‘కుష్ఠరోగి’ అనే పదాన్ని ప్రధాన పాఠంలో నివారించాం. ‘ప్రత్యేక గృహం’ అనే సహజమైన సందర్భార్థంతో పాటు మూలంలోని క్లిష్టమైన అక్షరార్థాన్ని పాదసూచికలో భద్రపరిచాం.
