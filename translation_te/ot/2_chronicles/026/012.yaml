  yaml_path: translation/ot/2_chronicles/026/012.yaml
  text: The total number of the heads of the fathers’ houses, for the mighty men of valor, was two thousand six hundred.
translation:
  language: te
  text: పరాక్రమవంతులైన యోధుల కోసం ఉన్న పితృకుటుంబాల అధిపతుల మొత్తం సంఖ్య రెండువేల ఆరువందలు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת
  choice: పితృవంశాల పెద్దలు
  rationale: ఈ సందర్భంలో కుటుంబ/వంశ విభాగాలకు నాయకత్వం వహించే పెద్దలను సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా, మూలంలోని వంశపరమైన భావాన్ని నిలుపుతుంది.
- source_word: לְגִבּוֹרֵי חָיִל
  choice: పరాక్రమవంతులైన యోధులకు నాయకులుగా ఉన్న
  rationale: לְ అనే సంబంధసూచక అవ్యయాన్ని ‘యోధులకు’ అని నిలిపి, ఈ పెద్దలు సైనిక బలగాలకు సంబంధించిన నాయకులని సందర్భానుసారంగా స్పష్టం చేస్తుంది; גִבּוֹרֵי חָיִל యొక్క శౌర్యవంతులైన యోధులు అనే భావాన్ని కాపాడుతుంది.
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת
  choice: రెండువేల ఆరువందలు
  rationale: హీబ్రూ సంఖ్యను నేరుగా, సహజమైన తెలుగు సంఖ్యారూపంలో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘పితృవంశాలు’ అనే పదం పరిపాలనా-వంశ విభాగాల భావాన్ని తెలియజేస్తుంది; మతశాఖాపరమైన ప్రత్యేక వ్యాఖ్యానాన్ని చేర్చలేదు.
