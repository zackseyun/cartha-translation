source:
  edition: WLC
  text: וְ/עַל יָדָ/ם֩ חֵ֨יל צָבָ֜א שְׁלֹ֧שׁ מֵא֣וֹת אֶ֗לֶף וְ/שִׁבְעַ֤ת אֲלָפִים֙ וַ/חֲמֵ֣שׁ מֵא֔וֹת עוֹשֵׂ֥י מִלְחָמָ֖ה בְּ/כֹ֣חַ חָ֑יִל לַ/עְזֹ֥ר לַ/מֶּ֖לֶךְ עַל הָ/אוֹיֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/013.yaml
  text: Under their command was an army of 307,500[a], making war with mighty power, to help the king against the enemy.
translation:
  language: te
  text: వారి ఆధ్వర్యంలో 3,07,500[a] మంది సైనికులు ఉండేవారు. వారు గొప్ప బలంతో యుద్ధం చేసే వారు, శత్రువుకు వ్యతిరేకంగా రాజుకు సహాయం చేయడానికి సిద్ధంగా ఉండేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “వారి చేతికింద 3,07,500 మందితో కూడిన సైన్యబలం ఉండేది; గొప్ప బలంతో యుద్ధం చేసే వారు, శత్రువుకు వ్యతిరేకంగా రాజుకు సహాయం చేయడానికి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: వారి ఆధ్వర్యంలో
  rationale: עַל־יָדָם అనే ప్రయోగం అక్షరార్థంగా ‘వారి చేతి కింద’ అని ఉన్నా, ఈ సైనిక పరిపాలనా సందర్భంలో పర్యవేక్షణ లేదా అధికారాన్ని సూచిస్తుంది.
- source_word: חֵיל צָבָא
  choice: సైనికులు
  rationale: ఈ పదబంధం సైన్యబలాన్ని సూచిస్తుంది; వెంట వచ్చే సంఖ్య వ్యక్తుల లెక్కగా సహజంగా అర్థమవుతుంది కాబట్టి తెలుగులో ‘మంది సైనికులు’ అని ఇచ్చాం.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וְשִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 3,07,500 మంది
  rationale: హీబ్రూ సంఖ్యల మొత్తం 307,500. తెలుగు పాఠకులకు సహజమైన భారతీయ అంకెల విభజనను ఉపయోగించాం.
- source_word: עוֹשֵׂי מִלְחָמָה
  choice: యుద్ధం చేసి
  rationale: అక్షరార్థంగా ‘యుద్ధం చేసేవారు.’ ఇది యుద్ధంలో పాల్గొనే సైనికులను సూచిస్తుంది; మూలంలోని క్రియాత్మక భావాన్ని నిలిపాం.
- source_word: בְּכֹחַ חָיִל
  choice: పరాక్రమంతో
  rationale: כֹּחַ మరియు חַיִל కలిపి బలం, శౌర్యం, సైనిక సామర్థ్యాన్ని తెలియజేస్తాయి; ‘పరాక్రమంతో’ ఈ భావాన్ని సహజంగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: לַעְזֹר לַמֶּלֶךְ
  choice: రాజుకు సహాయం చేసేవారు
  rationale: עזר యొక్క సాధారణ భావమైన ‘సహాయం చేయడం’ను నేరుగా నిలిపాం.
- source_word: עַל הָאוֹיֵב
  choice: శత్రువుకు విరోధంగా
  rationale: సైనిక సందర్భంలో עַל ప్రతిపక్ష సంబంధాన్ని సూచిస్తుంది; ‘శత్రువుకు విరోధంగా’ మూల నిర్మాణాన్ని స్పష్టంగా తెలియజేస్తుంది.
