revisions:
- from: వారి ఆధ్వర్యంలో 3,07,500 మంది సైనికులు ఉన్నారు. వారు పరాక్రమంతో యుద్ధం చేసి, శత్రువుకు విరోధంగా రాజుకు సహాయం చేసేవారు.[a]
  to: వారి ఆధ్వర్యంలో 3,07,500[a] మంది సైనికులు ఉండేవారు. వారు గొప్ప బలంతో యుద్ధం చేసే వారు, శత్రువుకు వ్యతిరేకంగా రాజుకు సహాయం చేయడానికి సిద్ధంగా ఉండేవారు.
  rationale: The revision preserves the administrative sense of “under their command,” explicitly renders the final infinitive as purpose (“సహాయం చేయడానికి”), uses idiomatic Telugu for opposition to the enemy, and broadens “parakrama” to “great strength” for the Hebrew martial-power expression. The wording “సిద్ధంగా ఉండేవారు” reflects the military-muster context, though it is an interpretive clarification of the Hebrew warrior designation.
