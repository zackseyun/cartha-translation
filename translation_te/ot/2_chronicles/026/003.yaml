  yaml_path: translation/ot/2_chronicles/026/003.yaml
  text: Uzziah was sixteen years old when he became king[a], and he reigned fifty-two years in Jerusalem. His mother’s name was Jecoliah[b], from Jerusalem.
translation:
  language: te
  text: ఉజ్జియా రాజైనప్పుడు[a] అతనికి పదహారు సంవత్సరాల వయస్సు. అతడు యెరూషలేములో యాభై రెండు సంవత్సరాలు పరిపాలించాడు. అతని తల్లి పేరు యెఖొల్యా[b]; ఆమె యెరూషలేముకు చెందినది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ మూలంలో, “అతడు పరిపాలించడం ప్రారంభించినప్పుడు” లేదా “అతడు రాజు అయినప్పుడు.”
    reason: lexical_alternative
  - marker: b
    text: ఈ పేరును “యెఖీల్యా” అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: అతనికి పదహారు సంవత్సరాలు
  rationale: వయస్సును తెలిపే హెబ్రీయ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְמָלְכוֹ
  choice: రాజైనప్పుడు
  rationale: రాజ్యాధికారాన్ని చేపట్టిన సమయాన్ని సూచించే మూలపద నిర్మాణాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מָלַךְ
  choice: పరిపాలించాడు
  rationale: నిర్దిష్ట కాలం రాజుగా పాలన సాగించాడనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: וַחֲמִשִּׁים וּשְׁתַּיִם שָׁנָה
  choice: యాభై రెండు సంవత్సరాలు
  rationale: హెబ్రీయ సంఖ్యా పదబంధానికి ప్రామాణిక తెలుగు రూపం.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: స్థలార్థక పూర్వప్రత్యయాన్ని తెలుగు విభక్తితో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: וְשֵׁם אִמּוֹ
  choice: అతని తల్లి పేరు
  rationale: మాతృనామాన్ని తెలిపే హెబ్రీయ సూత్రప్రాయ వాక్యాన్ని సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: יכיליה
  choice: యెకొల్యా
  rationale: హెబ్రీయ వ్యక్తినామానికి మూలధ్వనులకు దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణ; పాఠరూపం కారణంగా మరో లిప్యంతరీకరణ సాధ్యమని పాదటిప్పణి సూచిస్తుంది.
- source_word: מִן יְרוּשָׁלִָם
  choice: ఆమె యెరూషలేముకు చెందినది
  rationale: מִן సూచించే మూలస్థలం లేదా స్వస్థల భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
