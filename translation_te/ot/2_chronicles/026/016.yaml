source:
  edition: WLC
  text: וּ/כְ/חֶזְקָת֗/וֹ גָּבַ֤הּ לִבּ/וֹ֙ עַד לְ/הַשְׁחִ֔ית וַ/יִּמְעַ֖ל בַּ/יהוָ֣ה אֱלֹהָ֑י/ו וַ/יָּבֹא֙ אֶל הֵיכַ֣ל יְהוָ֔ה לְ/הַקְטִ֖יר עַל מִזְבַּ֥ח הַ/קְּטֹֽרֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/016.yaml
  text: But when he became strong, his heart was lifted up to his destruction, and he acted unfaithfully against Yahweh his God and entered the temple of Yahweh to burn incense on the altar of incense.
translation:
  language: te
  text: అయితే అతడు బలవంతుడైనప్పుడు, నాశనానికి దారితీసేంతగా అతని హృదయం గర్వంతో ఉప్పొంగింది.[a] అతడు తన దేవుడైన యహ్వేపట్ల నమ్మకద్రోహం చేసి, ధూపవేదికపై ధూపం అర్పించడానికి యహ్వే ఆలయంలోకి ప్రవేశించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “చెడిపోవడానికి దారితీసేంతగా అతని హృదయం గర్వంతో ఉప్పొంగింది.”'
    reason: עַד לְהַשְׁחִית ప్రధానంగా వినాశనకరమైన ఫలితాన్ని సూచిస్తుంది; సందర్భానుసారం అది చెడు ప్రవర్తనకు దారితీసిన భావాన్నీ సూచించవచ్చు.
lexical_decisions:
- source_word: וּכְחֶזְקָתוֹ
  choice: అయితే అతడు బలవంతుడైనప్పుడు
  rationale: כְּను కాలార్థంలో తీసుకొని, అతడు బలం పొందిన సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; וּ సందర్భంలోని వ్యత్యాసాన్ని ‘అయితే’ తెలియజేస్తుంది.
- source_word: גָּבַהּ לִבּוֹ
  choice: అతని హృదయం గర్వంతో ఉప్పొంగింది
  rationale: ‘అతని హృదయం ఎత్తబడింది’ అనే హీబ్రూ రూపకాన్ని తెలుగులో అర్థమయ్యేలా ఉంచుతూ, దానిలోని గర్వ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: עַד לְהַשְׁחִית
  choice: నాశనం కలిగేంతగా
  rationale: עַד־לְ నిర్మాణంలోని పరిమాణ/ఫలిత భావాన్ని నిలుపుతుంది. ఈ పదబంధానికి ‘చెడిపోయేంతగా’ అనే ప్రవర్తనా అర్థం కూడా సాధ్యమైనందున దాన్ని పాదసూచికలో సూచించాం.
- source_word: וַיִּמְעַל
  choice: ద్రోహంగా ప్రవర్తించి
  rationale: מעל సూచించే విశ్వాసభంగాన్ని, ముఖ్యంగా దేవునిపట్ల చేసిన ఒడంబడిక ద్రోహాన్ని, సాధారణ పాఠకుడికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַּיהוָה אֱלֹהָיו
  choice: తన దేవుడైన యహ్వేకు
  rationale: מעלతో వచ్చిన בְ ఇక్కడ ఎవరికెదురుగా విశ్వాసభంగం జరిగిందో సూచిస్తుంది; తెలుగులో ‘యహ్వేకు ద్రోహంగా’ సహజంగా ఉంది. יהוהను వ్యక్తిగత దైవనామంగా ‘యహ్వే’ అని లిప్యంతరీకరించాం.
- source_word: הֵיכַל יְהוָה
  choice: యహ్వే ఆలయంలోకి
  rationale: הֵיכָל ఇక్కడ దేవాలయ భవనాన్ని సూచిస్తుంది; ‘ఆలయం’ ఆధునిక తెలుగులో సహజమైన, గౌరవప్రదమైన పదం.
- source_word: לְהַקְטִיר
  choice: ధూపం వేయడానికి
  rationale: ఆరాధనా సందర్భంలో קטר హిఫీల్ రూపం ధూపాన్ని కాల్చి అర్పించడాన్ని సూచిస్తుంది; ‘ధూపం వేయడం’ తెలుగులో సహజమైన ఆరాధనా ప్రయోగం.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: ధూపవేదిక
  rationale: ధూపం అర్పించడానికి నియమించబడిన వేదికను సంక్షిప్తంగా, స్పష్టంగా సూచించే ప్రామాణిక తెలుగు సమాసం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణకు దగ్గరగా తెలుగులో అందించాం.
- issue: ఉజ్జియా చేసిన מעל స్వభావం
  choice: ద్రోహంగా ప్రవర్తించాడు
  alternative: అతిక్రమించాడు
  rationale: ఇది కేవలం నియమ ఉల్లంఘన మాత్రమే కాక దేవునిపట్ల విశ్వాసభంగాన్ని కూడా సూచిస్తుంది; అయితే దాని పూర్తి సిద్ధాంతార్థాన్ని విస్తరించి చెప్పకుండా మూలంలోని నైతిక-ఒడంబడిక బరువును నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. హీబ్రూ హృదయ-రూపకాన్ని పూర్తిగా తొలగించకుండా సహజీకరించాం; ఆరాధనా పదజాలాన్ని సంక్షిప్తంగా ఉంచాం.
