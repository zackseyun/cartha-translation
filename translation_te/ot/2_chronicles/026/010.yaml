id: 2CH.26.10
reference: 2 Chronicles 26:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּ֨בֶן מִגְדָּלִ֜ים בַּ/מִּדְבָּ֗ר וַ/יַּחְצֹב֙ בֹּר֣וֹת רַבִּ֔ים כִּ֤י מִקְנֶה רַּב֙ הָ֣יָה ל֔/וֹ וּ/בַ/שְּׁפֵלָ֖ה וּ/בַ/מִּישׁ֑וֹר אִכָּרִ֣ים וְ/כֹֽרְמִ֗ים בֶּ/הָרִים֙ וּ/בַ/כַּרְמֶ֔ל כִּֽי אֹהֵ֥ב אֲדָמָ֖ה הָיָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/010.yaml
  text: He built towers in the wilderness and cut out many cisterns[a], for he had much livestock; and in the lowland and in the plain he had farmers and vinedressers, in the hills and in the fertile land[c][b], for he loved the soil.
translation:
  language: te
  text: అతడు అరణ్యంలో గోపురాలు[a] కట్టాడు, అనేక నీటి నిల్వగుంటలను తొలిచాడు; ఎందుకంటే లోతట్టు ప్రాంతంలో[b], మైదానంలో అతనికి విస్తారమైన పశుసంపద ఉండేది. కొండల్లో, సారవంతమైన భూమిలో[c] అతనికి రైతులూ ద్రాక్షతోటల పెంపకదారులూ ఉండేవారు; ఎందుకంటే అతడు నేలను ప్రేమించేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కాపలా గోపురాలు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “షెఫేలా ప్రాంతంలో”; ఇది యూదా కొండ ప్రాంతానికీ తీర మైదానానికీ మధ్యనున్న పాదభూమి.
    reason: cultural_note
  - marker: c
    text: దీనిని స్థలనామంగా తీసుకుంటే, “కర్మెలు ప్రాంతంలో.”
    reason: alternative_reading
lexical_decisions:
- source_word: מִגְדָּלִים
  choice: గోపురాలు
  rationale: మూలపదం సాధారణంగా ఎత్తైన గోపురాలను సూచిస్తుంది; సందర్భంలో కాపలా గోపురాలు కావచ్చు గాని ఆ కార్యాన్ని మూలం స్పష్టంగా చెప్పదు.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: ఈ పదం జనావాసం లేని అడవి, బీడు లేదా మేత ప్రాంతాన్ని సూచించగలదు. పశువులు ఉన్న సందర్భానికి సరిపోతూ, అతిగా ఎడారిగా నిర్దిష్టం చేయకుండా ‘అరణ్యం’ విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: וַיַּחְצֹב בֹּרוֹת
  choice: నీటి తొట్టెలను రాతిలో తొలిపించాడు
  rationale: క్రియకు చెక్కడం లేదా రాతిని తొలచడం అనే భావం ఉంది; בֹּרוֹת ఇక్కడ పశువులకు నీరు నిల్వచేసే తొట్టెలను సూచించే అవకాశం ఎక్కువ. ‘రాతిలో’ అనేది క్రియలోని తొలచే భావాన్ని సహజంగా తెలుపుతుంది.
- source_word: מִקְנֶה רַב
  choice: పశుసంపద విస్తారంగా
  rationale: సమూహవాచకమైన מִקְנֶהను కేవలం పశువులలో ఒక జాతికి పరిమితం చేయకుండా విస్తృతంగా అనువదిస్తుంది.
- source_word: שְׁפֵלָה
  choice: లోతట్టు ప్రాంతం
  rationale: యూదా కొండల దిగువన ఉన్న ప్రత్యేక భౌగోళిక ప్రాంతాన్ని సాధారణ పాఠకునికి అర్థమయ్యే విధంగా అనువదిస్తుంది.
- source_word: מִישׁוֹר
  choice: మైదాన ప్రాంతం
  rationale: సమతల భూభాగం అనే ప్రధాన భావాన్ని సహజమైన ఆధునిక తెలుగులో ఇస్తుంది.
- source_word: אִכָּרִים
  choice: రైతులు
  rationale: భూమిని దున్ని సాగుచేసేవారిని సూచించే మూలపదానికి స్పష్టమైన ఆధునిక తెలుగు సమానం.
- source_word: כֹרְמִים
  choice: ద్రాక్షతోటల పనివారు
  rationale: ద్రాక్షతోటలను సాగుచేసి సంరక్షించేవారనే ప్రత్యేక భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: בֶּהָרִים
  choice: కొండల్లో
  rationale: వ్యవసాయ సందర్భంలో కొండ ప్రాంతాన్ని సహజంగా సూచిస్తుంది; ‘పర్వతాలు’ అనడం భూభాగాన్ని అతిగా నిర్దిష్టం చేయవచ్చు.
- source_word: בַּכַּרְמֶל
  choice: సారవంతమైన భూమిలో
  rationale: כַּרְמֶלను ఇక్కడ స్థలనామంగా కాక, పంటలు లేదా తోటలకు అనుకూలమైన సారవంతమైన భూభాగంగా గ్రహిస్తుంది; స్థలనామ పఠనాన్ని పాదసూచనలో నిలుపుతుంది.
- source_word: אֹהֵב אֲדָמָה
  choice: అతడు నేలను ప్రేమించేవాడు
  rationale: వ్యవసాయంతో అతనికున్న అనుబంధాన్ని విపులీకరించకుండా, ‘నేల’ అనే మూలంలోని సాక్షాత్కార చిత్రాన్ని నిలుపుతుంది.
