translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. భౌగోళిక పదాలను ప్రధాన వచనంలో అర్థానువాదంగా ఇచ్చి, స్థలనామ ప్రత్యామ్నాయాలను పాదసూచనల్లో ఉంచాం. హీబ్రూ వాక్యంలోని వ్యవసాయ జాబితా స్పష్టత కోసం తెలుగులో రెండు వాక్యాలుగా విభజించబడింది.
