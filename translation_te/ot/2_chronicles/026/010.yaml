  to: అతడు అరణ్యంలో గోపురాలు[a] కట్టాడు, అనేక నీటి నిల్వగుంటలను తొలిచాడు; ఎందుకంటే లోతట్టు ప్రాంతంలో[b], మైదానంలో అతనికి విస్తారమైన పశుసంపద ఉండేది. కొండల్లో, సారవంతమైన భూమిలో[c] అతనికి రైతులూ ద్రాక్షతోటల పెంపకదారులూ ఉండేవారు; ఎందుకంటే అతడు నేలను ప్రేమించేవాడు.
