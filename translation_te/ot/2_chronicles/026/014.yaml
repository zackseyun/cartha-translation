source:
  edition: WLC
  text: וַ/יָּכֶן֩ לָ/הֶ֨ם עֻזִּיָּ֜הוּ לְ/כָל הַ/צָּבָ֗א מָגִנִּ֤ים וּ/רְמָחִים֙ וְ/כ֣וֹבָעִ֔ים וְ/שִׁרְיֹנ֖וֹת וּ/קְשָׁת֑וֹת וּ/לְ/אַבְנֵ֖י קְלָעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/014.yaml
  text: And Uzziah prepared for them[a], for the whole army, shields and spears and helmets and coats of armor and bows and slingstones.
translation:
  language: te
  text: ఉజ్జియా వారికి, అంటే సైన్యమంతటికీ, డాళ్లను, ఈటెలను, తలకవచాలను, శరీర కవచాలను, విల్లులను, వడిసెల రాళ్లను[a] సిద్ధం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వడిసెల కోసం రాళ్లు.” హెబ్రీలో అక్షరార్థంగా “వడిసెల రాళ్లు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכֶן
  choice: సిద్ధం చేశాడు
  rationale: హిఫిల్ రూపం ఆయుధ సామగ్రిని సిద్ధంగా ఉంచడం లేదా అందుబాటులోకి తేవడం అనే భావాన్ని ఇస్తుంది; వాటిని స్వయంగా తయారు చేశాడని అనవసరంగా సూచించదు.
- source_word: לָהֶם לְכָל הַצָּבָא
  choice: వారికి, అంటే సైన్యమంతటికీ
  rationale: ‘వారికి’ అనే సర్వనామాన్ని నిలుపుతూ, వెంట వచ్చే పదబంధం దాని ఉద్దేశిత సమూహాన్ని వివరిస్తుందని సహజమైన తెలుగులో చూపుతుంది.
- source_word: מָגִנִּים
  choice: డాళ్లు
  rationale: యుద్ధంలో ఉపయోగించే రక్షణ సాధనానికి సాధారణమైన, స్పష్టమైన తెలుగు పదం.
- source_word: רְמָחִים
  choice: ఈటెలు
  rationale: ఈ సైనిక సందర్భంలో రֹמַחకు సహజమైన సాధారణ తెలుగు సమానార్థకం.
- source_word: כּוֹבָעִים
  choice: తలకవచాలు
  rationale: యుద్ధంలో తలను రక్షించే సామగ్రి అనే అర్థాన్ని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: שִׁרְיֹנוֹת
  choice: శరీర కవచాలు
  rationale: మొండెాన్ని రక్షించే కవచాలనే భావాన్ని వ్యక్తం చేస్తుంది; అవి తప్పనిసరిగా గొలుసు కవచాలేనని మరీ నిర్దిష్టం చేయదు.
- source_word: קְשָׁתוֹת
  choice: విల్లులు
  rationale: బహువచన నామవాచకానికి నేరమైన, సహజమైన అనువాదం.
- source_word: אַבְנֵי קְלָעִים
  choice: వడిసెల రాళ్లు
  rationale: ‘వడిసెల రాళ్లు’ అనే సంక్షిప్త పదబంధం ఆయుధ సంబంధాన్ని సహజంగా తెలుపుతుంది; హెబ్రీ నిర్మాణంలోని ప్రత్యామ్నాయ వ్యక్తీకరణను పాదసూచికలో నిలిపింది.
