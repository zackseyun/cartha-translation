id: 2CH.26.1
reference: 2 Chronicles 26:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְח֞וּ כָּל עַ֤ם יְהוּדָה֙ אֶת עֻזִּיָּ֔הוּ וְ/ה֕וּא בֶּן שֵׁ֥שׁ עֶשְׂרֵ֖ה שָׁנָ֑ה וַ/יַּמְלִ֣יכוּ אֹת֔/וֹ תַּ֖חַת אָבִ֥י/ו אֲמַצְיָֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/001.yaml
  text: Then all the people of Judah took Uzziah[a], who was sixteen years old[b], and made him king in place of his father Amaziah.
translation:
  language: te
  text: అప్పుడు యూదా ప్రజలందరూ ఉజ్జియాను తీసుకున్నారు[a]. అతనికి పదహారేళ్లు[b]. అతని తండ్రి అమజ్యాకు బదులుగా అతన్ని రాజుగా చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “ఉజ్జియాను ఎన్నుకున్నారు.” హెబ్రీ క్రియకు అక్షరార్థం “తీసుకున్నారు”; ఈ సందర్భంలో అతన్ని రాజుగా నిలబెట్టడానికి ప్రజలు చేపట్టిన చర్యను సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: 'హెబ్రీలో అక్షరార్థంగా: “అతడు పదహారు సంవత్సరాలవాడు.” ముందున్న సంధానం సాధారణంగా “మరియు” అనే భావాన్నివ్వగలదు; “పదహారేళ్లవాడైనా” అనే భావం తప్పనిసరి కాదు.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: తీసుకున్నారు
  rationale: לקח అనే క్రియకు అక్షరార్థం ‘తీసుకోవడం.’ ఇక్కడ ప్రజలు ఉజ్జియాను రాజుగా నిలబెట్టడానికి చేపట్టిన చర్యను సూచిస్తుంది; ‘ఎన్నుకున్నారు’ అనేది సందర్భార్థాన్ని మరింత స్పష్టపరిచే ప్రత్యామ్నాయం.
- source_word: כָּל עַם יְהוּדָה
  choice: యూదా ప్రజలందరూ
  rationale: ‘యూదా ప్రజలందరూ’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగు పదక్రమంలో తెలియజేస్తుంది; עַם లోని సమిష్టి ప్రజాభావాన్ని నిలుపుతుంది.
- source_word: עֻזִּיָּהוּ
  choice: ఉజ్జియా
  rationale: ఈ వచనంలోని హెబ్రీ పేరు עֻזִּיָּהוּకు ప్రామాణిక తెలుగు లిప్యంతరీకరణ; సంబంధిత వచనాల్లో కనిపించే ‘అజర్యా’ అనే ప్రత్యామ్నాయ పేరును ఇక్కడికి దిగుమతి చేయలేదు.
- source_word: וְהוּא בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: అతనికి పదహారేళ్లు
  rationale: ‘అతడు పదహారు సంవత్సరాల కుమారుడు’ అనే హెబ్రీ వయస్సు ప్రయోగాన్ని సహజమైన తెలుగులో అందిస్తుంది. వావ్‌ను ప్రధాన పాఠంలో తటస్థ సంధానంగా ఉంచి, అనవసరమైన concessive భావాన్ని రుద్దలేదు.
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: అతన్ని రాజుగా చేశారు
  rationale: מלך హిఫీల్ రూపంలోని ‘ఒకరిని రాజుగా చేయడం/పాలింపజేయడం’ అనే causative భావాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది; పాఠ్యంలో లేని పట్టాభిషేక కర్మను జోడించదు.
- source_word: תַּחַת
  choice: బదులుగా
  rationale: రాజ్య వారసత్వ సందర్భంలో ‘స్థానంలో’ లేదా ‘బదులుగా’ అనే అర్థం వస్తుంది; తెలుగులో ‘బదులుగా’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: אָבִיו אֲמַצְיָהוּ
  choice: అతని తండ్రి అమజ్యా
  rationale: తండ్రి-కొడుకు సంబంధాన్ని, వ్యక్తి పేరును నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: ఉజ్జియా చిన్న వయస్సును concessive భావంతో చూపాలా?
  choice: తటస్థంగా ‘అతనికి పదహారేళ్లు’ అని అనువదించడం
  alternative: ‘అతనికి పదహారేళ్లే అయినా’
  rationale: హెబ్రీ וְ సాధారణ సంధానార్థకంగా ఉండగలదు; ‘అయినా’ అని అనువదిస్తే మూలంలో తప్పనిసరిగా లేని విరుద్ధార్థ ఛాయ చేరుతుంది. అందువల్ల ప్రధాన పాఠం తటస్థంగా ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. చిన్న వాక్యాల ద్వారా హెబ్రీ వాక్యంలోని వరుస చర్యలను స్పష్టంగా ఉంచి, మూలంలో లేని విరుద్ధార్థాన్ని లేదా పట్టాభిషేక కర్మను జోడించలేదు.
