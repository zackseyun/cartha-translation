  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన చారిత్రక శైలి. మూలంలోని జాబితా నిర్మాణం, ‘ఇదిగో’ అనే ఉద్ఘాటన, లిఖిత ఆధారానికి ఇచ్చిన సూచన నిలుపబడ్డాయి.
