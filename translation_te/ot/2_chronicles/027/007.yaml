id: 2CH.27.7
reference: 2 Chronicles 27:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יֶתֶר֙ דִּבְרֵ֣י יוֹתָ֔ם וְ/כָל מִלְחֲמֹתָ֖י/ו וּ/דְרָכָ֑י/ו הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֥פֶר מַלְכֵֽי יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/007.yaml
  text: The rest of the acts of Jotham[a], and all his wars and his ways—behold[b], they are written in the Book of the Kings of Israel and Judah.
translation:
  language: te
  text: యోతాము చేసిన మిగిలిన కార్యాలు[a], అతని యుద్ధాలన్నీ, అతని నడవడి[b]—ఇదిగో, ఇవన్నీ ఇశ్రాయేలు, యూదా రాజుల గ్రంథంలో రాసి ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యోతాము గురించిన మిగిలిన విషయాలు’; ఇక్కడి హీబ్రూ చరిత్ర రచనా ప్రయోగం అతని కార్యాలు లేదా వ్యవహారాల నమోదును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘అతని మార్గాలు’; ఇది అతని ప్రవర్తన లేదా జీవన విధానాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹתָם
  choice: యోతాము చేసిన మిగిలిన కార్యాలు
  rationale: రాజుల చరిత్రను సంక్షిప్తంగా ముగించే ఈ సూత్రప్రాయ వాక్యంలో דִּבְרֵי అనే పదం అక్షరార్థంగా ‘మాటలు’ అయినా, రాజుకు సంబంధించిన కార్యాలు లేదా విషయాలను సూచిస్తుంది. ‘చేసిన మిగిలిన కార్యాలు’ ఆధునిక తెలుగులో సహజంగా ఆ చారిత్రక భావాన్ని తెలియజేస్తుంది.
- source_word: וְכָל מִלְחֲמֹתָיו
  choice: అతని యుద్ధాలన్నీ
  rationale: మూలంలోని బహువచనాన్ని, כָל ఇచ్చే సమగ్ర భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: וּדְרָכָיו
  choice: అతని నడవడి
  rationale: דֶּרֶךְ అక్షరార్థంగా ‘మార్గం’; వ్యక్తిని గురించి వాడినప్పుడు అతని ప్రవర్తన లేదా జీవన విధానాన్ని సూచించగలదు. ‘నడవడి’ ఈ రూపక భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: הִנָּם
  choice: ఇదిగో, ఇవన్నీ
  rationale: ఈ సూచనాత్మక, ఉద్ఘాటనాత్మక పదంలోని బలాన్ని ‘ఇదిగో’ నిలుపుతుంది; ముందున్న బహువచన అంశాలను ‘ఇవన్నీ’ స్పష్టంగా తిరిగి సూచిస్తుంది.
- source_word: כְּתוּבִים עַל סֵפֶר
  choice: గ్రంథంలో రాసి ఉన్నాయి
  rationale: అక్షరార్థంగా ‘గ్రంథం/చుట్టపై రాయబడి ఉన్నాయి’; లిఖిత ఆధారాన్ని ఉటంకించే సందర్భంలో ‘గ్రంథంలో రాసి ఉన్నాయి’ సహజమైన తెలుగు ప్రయోగం.
- source_word: מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: ఇశ్రాయేలు, యూదా రాజులు
  rationale: ఇది పేర్కొన్న ఆధార గ్రంథపు విషయాన్ని లేదా శీర్షికను సూచించే నిర్మాణం. రెండు రాజ్యాల పేర్లను సమానంగా, సంక్షిప్తంగా అందిస్తుంది.
