  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే రాజవంశ వృత్తాంత శైలి. మూలంలోని రెండు సమాంతర వాక్యభాగాలను రెండు సంక్షిప్త వాక్యాలుగా అందించి పఠనసౌలభ్యాన్ని పెంచాం.
