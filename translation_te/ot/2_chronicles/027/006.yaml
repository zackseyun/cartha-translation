  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתְחַזֵּ֖ק יוֹתָ֑ם כִּ֚י הֵכִ֣ין דְּרָכָ֔י/ו לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/006.yaml
  text: So Jotham became strong, because he ordered his ways before the LORD his God.
translation:
  language: te
  text: యోతాము తన దేవుడైన యెహోవా సన్నిధిలో తన మార్గాలను సిద్ధం చేసుకున్నందున బలవంతుడయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: బలవంతుడయ్యాడు
  rationale: హిత్‌పయేల్ రూపం సందర్భంలో యోతాము క్రమంగా బలపడటం లేదా స్థిరపడటాన్ని సూచిస్తుంది; సహజమైన తెలుగులో ‘బలవంతుడయ్యాడు’ దీనిని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: הֵכִין דְּרָכָיו
  choice: తన మార్గాలను సరిచేసుకున్నందువల్ల
  rationale: הכין అంటే సిద్ధపరచడం, స్థిరపరచడం, సరైన క్రమంలో ఉంచడం. ‘మార్గాలు’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ, దేవుని ఎదుట తన ప్రవర్తనను క్రమబద్ధం చేసుకున్న భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: లిఖిత దైవనామాన్ని ‘యెహోవా’గా చూపించి, לִפְנֵי యొక్క ప్రత్యక్షమైన ‘ఎదుట/సన్నిధిలో’ భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: యోతాము బలపడటానికి కారణం
  choice: ‘అందువల్ల’ ద్వారా తన మార్గాలను దేవుని సన్నిధిలో సరిచేసుకోవడమే కారణమని వాక్యంలోని సంబంధాన్ని నిలిపాం
  alternative: దేవుడు అతన్ని బలపరిచాడని స్పష్టంగా చేర్చడం
  rationale: మూలంలో దేవుని కార్యం ప్రత్యక్షంగా చెప్పబడలేదు; దానిని చేర్చకుండా కారణ సంబంధంలోని theological tension‌ను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో. మూలంలోని ‘మార్గాలు’ రూపకం మరియు దైవనామం నిలుపబడ్డాయి.
