id: 2CH.27.3
reference: 2 Chronicles 27:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ה֗וּא בָּנָ֛ה אֶת שַׁ֥עַר בֵּית יְהוָ֖ה הָ/עֶלְי֑וֹן וּ/בְ/חוֹמַ֥ת הָ/עֹ֛פֶל בָּנָ֖ה לָ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/003.yaml
  text: He built the upper gate of the house of Yahweh[a], and on the wall of the Ophel he built much.
translation:
  language: te
  text: అతడు యెహోవా మందిరపు ఎగువ ద్వారాన్ని కట్టాడు; ఓఫెలు గోడపై అతడు విస్తారంగా నిర్మాణం చేశాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చాలా నిర్మించాడు” లేదా “సమృద్ధిగా నిర్మించాడు.”
    reason: లָרֹב యొక్క పరిమాణ/విస్తృతి భావానికి సాధ్యమైన ప్రత్యామ్నాయ అనువాదాలను సూచిస్తుంది.
lexical_decisions:
- source_word: בָּנָה
  choice: కట్టించాడు / నిర్మాణ పనులు చేయించాడు
  rationale: రాజు స్వయంగా కట్టాడనే భావం కంటే, అతని ఆధ్వర్యంలో పని జరిగిందని సహజ తెలుగు తెలియజేస్తుంది; అయినా మూలంలోని సాధారణ ‘నిర్మించు’ భావం నిలిచింది.
- source_word: שַׁעַר
  choice: ద్వారం
  rationale: ఆలయ నిర్మాణ సందర్భంలో గేటు లేదా ప్రవేశద్వారాన్ని సూచించే సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: అక్షరార్థం ‘యెహోవా ఇల్లు’; సందర్భంలో అది ఆలయాన్ని సూచిస్తుంది. ఆధునిక పాఠకులకు ‘మందిరం’ స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన రూపంలో లిప్యంతరీకరించింది.
- source_word: הָעֶלְיוֹן
  choice: పై
  rationale: ద్వారం ఉన్న ఎత్తైన లేదా పై స్థానాన్ని సహజంగా సూచిస్తుంది.
- source_word: וּבְחוֹמַת
  choice: గోడ మీద కూడా
  rationale: בְּ ఇక్కడ నిర్మాణ పని గోడపై లేదా దానికి సంబంధించినదిగా జరిగినదని సూచిస్తుంది; ‘మీద’ తెలుగు నిర్మాణ సందర్భంలో సహజం.
- source_word: הָעֹפֶל
  choice: ఓఫెలు
  rationale: యెరూషలేములోని ఎత్తైన కోటప్రాంతానికి చెందిన స్థలనామంగా అనువదించకుండా లిప్యంతరీకరించింది.
- source_word: לָרֹב
  choice: విస్తారంగా
  rationale: నిర్మాణ పని అధిక పరిమాణంలో జరిగిందనే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ‘చాలా’ అనే మరింత అక్షరార్థ రూపం తెలుగులో ఇక్కడ అసంపూర్ణంగా వినిపిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; దాన్ని సాధారణ బిరుదుగా మార్చకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణను ఉపయోగించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; చారిత్రక వర్ణనకు తగిన గౌరవప్రదమైన, సులభమైన శైలి. హీబ్రూ వాక్యంలోని రెండుసార్ల בָּנָהను తెలుగు పునరుక్తి భారంగా కాకుండా ‘కట్టించాడు’ మరియు ‘నిర్మాణ పనులు చేయించాడు’గా వ్యక్తం చేసింది.
