source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ יוֹתָ֣ם בְּ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּֽ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יְרוּשָׁ֖ה בַּת צָדֽוֹק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/001.yaml
  text: Jotham was twenty-five years old when he began to reign, and he reigned sixteen years in Jerusalem. His mother’s name was Jerushah daughter of Zadok.
translation:
  language: te
  text: యోతాము రాజైనప్పుడు అతనికి ఇరవై ఐదు సంవత్సరాలు. అతడు యెరూషలేములో పదహారు సంవత్సరాలు పరిపాలించాడు. అతని తల్లి పేరు యెరూషా; ఆమె సాదోకు కుమార్తె.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: అతనికి ఇరవై ఐదు సంవత్సరాలు
  rationale: హెబ్రీ వయస్సు తెలిపే నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో అర్థస్పష్టంగా అందిస్తుంది.
- source_word: בְּמָלְכוֹ
  choice: రాజైనప్పుడు
  rationale: రాజ్యాధికారం చేపట్టిన సమయాన్ని సూచించే హెబ్రీ నిర్మాణాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מָלַךְ
  choice: పరిపాలించాడు
  rationale: రాజుగా పాలన సాగించడాన్ని సూచించే క్రియార్థాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: בִּירוּשָׁלָם
  choice: యెరూషలేములో
  rationale: స్థలార్థక ב ఉపసర్గను తెలుగు లోకేటివ్ రూపంతో నేరుగా అందిస్తుంది.
- source_word: וְשֵׁם אִמּוֹ
  choice: అతని తల్లి పేరు
  rationale: వంశవివర సూత్రాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: יְרוּשָׁה
  choice: యెరూషా
  rationale: హెబ్రీ వ్యక్తినామాన్ని తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: בַּת צָדוֹק
  choice: సాదోకు కుమార్తె
  rationale: మాతృవంశ గుర్తింపును తెలిపే హెబ్రీ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా, రాజవంశ చరిత్రకు తగిన గంభీరతతో రూపొందించబడింది. మూలంలోని మూడు సమాచార భాగాలు—అధికారారంభ వయస్సు, పాలనా కాలం మరియు స్థలం, తల్లి వంశవివరం—స్పష్టంగా నిలుపబడ్డాయి.
