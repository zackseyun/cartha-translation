source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב יוֹתָם֙ עִם אֲבֹתָ֔י/ו וַ/יִּקְבְּר֥וּ אֹת֖/וֹ בְּ/עִ֣יר דָּוִ֑יד וַ/יִּמְלֹ֛ךְ אָחָ֥ז בְּנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/009.yaml
  text: And Jotham slept with his fathers[a], and they buried him in the city of David. And Ahaz his son reigned in his place.
translation:
  language: te
  text: యోతాము తన పితరులతో కూడ నిద్రించాడు[a]. అతన్ని దావీదు నగరంలో పాతిపెట్టారు. అతని స్థానంలో అతని కుమారుడు ఆహాజు రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, భావాన్ని మరింత స్పష్టంగా చెప్పాలంటే, “మరణించాడు.” హీబ్రూలో “తన పితరులతో కూడ నిద్రించాడు” అని ఉంది; ఇది రాజుల మరణాన్ని తెలిపే సంప్రదాయ వాక్యప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: నిద్రించాడు
  rationale: రాజుల మరణవార్తల్లో ఈ క్రియ మరణాన్ని సూచించే సంప్రదాయ ప్రయోగం. ‘చనిపోయాడు’ అని భావాన్ని మాత్రమే చెప్పకుండా, హీబ్రూ రూపకాన్ని నిలుపుతుంది.
- source_word: עִם אֲבֹתָיו
  choice: తన పితరులతో కూడ
  rationale: వంశపారంపర్య మరణ సూత్రంలోని హీబ్రూ పదప్రయోగాన్ని గౌరవంగా నిలుపుతుంది; ‘పూర్వీకులతో’ అనేది మరింత వ్యాఖ్యానాత్మక ప్రత్యామ్నాయం.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: అతన్ని ... పాతిపెట్టారు
  rationale: హీబ్రూలోని క్రియ కర్తరి బహువచనంలో ఉంది. నిర్దిష్ట కర్తను చేర్చకుండా తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּעִיר דָּוִיד
  choice: దావీదు నగరంలో
  rationale: స్థలనామ నిర్మాణాన్ని స్పష్టంగా, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: ఈ వారసత్వ సందర్భంలో రాజ్యాధికారాన్ని స్వీకరించడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: రాజ్య వారసత్వంలో ఒకరి స్థానాన్ని మరొకరు చేపట్టే భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: יוֹתָם
  choice: యోతాము
  rationale: తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణమైన లిప్యంతరీకరణ.
- source_word: אָחָז
  choice: ఆహాజు
  rationale: తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణమైన లిప్యంతరీకరణ.
- source_word: בְּנוֹ
  choice: అతని కుమారుడు
  rationale: తండ్రి-కుమార సంబంధాన్ని, వారసత్వ సూత్రాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘తన పితరులతో కూడ నిద్రించాడు’ అనే మరణ సూత్రం
  choice: హీబ్రూ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘తన పితరులవలె చనిపోయాడు’ లేదా ‘తన పూర్వీకులతో చేరి చనిపోయాడు’
  rationale: ఈ వాక్యం మరణాన్ని సూచించినప్పటికీ, మరణానంతర స్థితిపై అదనపు సిద్ధాంతార్థాన్ని నిర్ణయించకుండా మూలంలోని సంప్రదాయ రాజవంశీయ సూత్రాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘పితరులు’ అనే పదం హీబ్రూ రాజవంశీయ సూత్రాన్ని నిలుపడానికి ఉద్దేశపూర్వకంగా వాడబడింది; పాదసూచిక దాని భావాన్ని సాధారణ పాఠకునికి వివరిస్తుంది.
