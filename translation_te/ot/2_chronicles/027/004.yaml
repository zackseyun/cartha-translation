  yaml_path: translation/ot/2_chronicles/027/004.yaml
  text: He built cities in the hill country of Judah[b][a], and in the forests he built fortresses and towers.
translation:
  language: te
  text: అతడు యూదా కొండ ప్రాంతంలో పట్టణాలను నిర్మించాడు; అడవుల్లో[a] కోటలను[b], గోపురాలను నిర్మించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అడవుల్లో’ అనే మాటకు ‘చెట్లతో నిండిన ప్రాంతాల్లో’ లేదా ‘పొదల ప్రాంతాల్లో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘కోటలు’ అనే మాటకు ‘దుర్గాలు’ లేదా ‘బలమైన స్థావరాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרִים
  choice: పట్టణాలు
  rationale: עִיר అనే పదం జనావాస కేంద్రాలను సూచిస్తుంది. ప్రాచీన యూదా సందర్భంలో ఆధునిక పాఠకులకు అతిశయార్థం కలిగించకుండా ‘పట్టణాలు’ సహజంగా ఉంటుంది.
- source_word: בָּנָה
  choice: నిర్మించాడు
  rationale: ‘కట్టాడు’ కూడా సాధ్యమే; అయితే పట్టణాలు, కోటలు, గోపురాలు అన్నిటికీ సరిపోయే గౌరవప్రదమైన ఆధునిక రూపంగా ‘నిర్మించాడు’ ఎంచుకున్నాం.
- source_word: בְּהַר יְהוּדָה
  choice: యూదా కొండప్రాంతంలో
  rationale: ఇక్కడ הַר ఒక్క కొండను కాక కొండలతో కూడిన భౌగోళిక ప్రాంతాన్ని సూచిస్తుంది; అందువల్ల ‘కొండప్రాంతం’ ప్రాంతీయ భావాన్ని నిలుపుతుంది.
- source_word: חֳרָשִׁים
  choice: అడవుల్లో
  rationale: ఈ పదం అడవులు, చెట్లతో నిండిన ప్రాంతాలు లేదా పొదల ప్రాంతాలను సూచించవచ్చు. ప్రధాన పాఠ్యంలో సంక్షిప్తమైన ‘అడవుల్లో’ వాడి, విస్తృత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: בִּירָנִיּוֹת
  choice: కోటలు
  rationale: ఈ అరుదైన పదం రక్షణార్థమైన దుర్గాలు లేదా బలమైన కోటలను సూచిస్తుంది. సాధారణ పాఠకులకు స్పష్టమైన ‘కోటలు’ సరైన సమానార్థకం.
- source_word: מִגְדָּלִים
  choice: గోపురాలు
  rationale: מִגְדָּלִים అంటే ఎత్తైన గోపురాలు, ఈ సందర్భంలో బహుశా రక్షణ గోపురాలు. మూలంలోని సాధారణ పదాన్ని మించకుండా ‘గోపురాలు’గా అనువదించాం.
