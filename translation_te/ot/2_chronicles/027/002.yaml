source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ הַ/יָּשָׁ֜ר בְּ/עֵינֵ֣י יְהוָ֗ה כְּ/כֹ֤ל אֲשֶׁר עָשָׂה֙ עֻזִּיָּ֣הוּ אָבִ֔י/ו רַ֕ק לֹא בָ֖א אֶל הֵיכַ֣ל יְהוָ֑ה וְ/ע֥וֹד הָ/עָ֖ם מַשְׁחִיתִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/002.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that his father Uzziah had done—except that he did not enter the temple of Yahweh[b]. But the people still acted corruptly.
translation:
  language: te
  text: అతడు తన తండ్రి ఉజ్జియా చేసినదంతా చేసినట్లే యహ్వే దృష్టికి సరైనది చేశాడు. కానీ అతడు యహ్వే ఆలయంలోకి ప్రవేశించలేదు.[a] అయినా ప్రజలు ఇంకా అవినీతిగా ప్రవర్తిస్తూనే ఉన్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యహ్వే ఆలయంలోకి వెళ్లలేదు.” ఈ మాట జోతామును, ఆలయంలోకి అనధికారంగా ప్రవేశించిన ఉజ్జియాకు భిన్నంగా చూపుతున్నట్లు కనిపిస్తుంది; 2 దినవృత్తాంతాలు 26:16–21 చూడండి.
    reason: cross_reference
  - marker: b
    text: లేదా, “ప్రజలు ఇంకా తమను తాము చెడగొట్టుకుంటూనే ఉన్నారు”; “ప్రజలు ఇంకా చెడుగా ప్రవర్తిస్తూనే ఉన్నారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: దృష్టికి సరైనది చేశాడు
  rationale: హీబ్రూ వాక్యంలోని నైతిక మూల్యాంకనాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, ‘సరైనది’ అనే భావాన్ని నిలుపుతుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యహ్వే దృష్టికి
  rationale: హీబ్రూ ‘కళ్లలో’ అనే మూలభాషా నుడికారాన్ని తెలుగులో సహజంగా వినిపించే ‘దృష్టికి’తో అందిస్తుంది.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה עֻזִּיָּהוּ אָבִיו
  choice: తన తండ్రి ఉజ్జియా చేసినదంతా అనుసరించి
  rationale: జోతాము తన తండ్రి ప్రవర్తనా నమూనాను అనుసరించాడనే పోలికను, ‘అంతా’ అనే సమగ్ర భావంతో వ్యక్తం చేస్తుంది.
- source_word: רַק
  choice: అయితే
  rationale: ముందటి సమగ్ర పోలికకు తరువాతి వాక్యం పరిమితి విధిస్తుందని స్పష్టపరుస్తుంది; తెలుగులో సహజమైన వ్యతిరేక సంధానాన్ని ఇస్తుంది.
- source_word: לֹא בָא אֶל הֵיכַל יְהוָה
  choice: అతడు యహ్వే ఆలయంలోకి ప్రవేశించలేదు
  rationale: בוא + אֶל ఇక్కడ లోపలికి వెళ్లడం లేదా ప్రవేశించడం సూచిస్తుంది; ‘ప్రవేశించలేదు’ సంక్షిప్తంగా, సందర్భోచితంగా ఉంది.
- source_word: וְעוֹד הָעָם מַשְׁחִיתִים
  choice: అయినా ప్రజలు ఇంకా అవినీతిగా ప్రవర్తిస్తూనే ఉన్నారు
  rationale: עוֹד సూచించే కొనసాగింపును ‘ఇంకా… ప్రవర్తిస్తూనే’ తెలియజేస్తుంది. שׁחת హిఫిల్ రూపంలోని అవినీతి లేదా చెడుగా ప్రవర్తించే భావాన్ని, కర్మను అనవసరంగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’గా లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: జోతాము ఆలయంలోకి ప్రవేశించకపోవడం ఉజ్జియాతో చేసే వ్యత్యాసమా?
  choice: ప్రధాన పాఠంలో కేవలం ‘ప్రవేశించలేదు’ అని ఉంచి, సందర్భసంబంధాన్ని పాదసూచికలో తెలియజేయడం
  alternative: ‘ఉజ్జియాలా ఆలయంలోకి అక్రమంగా ప్రవేశించలేదు’ అని పాఠంలోనే విపులీకరించడం
  rationale: మూలవాక్యం చర్యను మాత్రమే చెబుతుంది; దాని అక్రమ స్వభావం, ఉజ్జియాతో వ్యత్యాసం 2 దినవృత్తాంతాలు 26:16–21 సందర్భం వల్ల తెలుస్తాయి. వివరణను ప్రధాన పాఠంలో చేర్చకుండా ఉండటం మూలంలోని సంక్షిప్తతను కాపాడుతుంది.
- issue: מַשְׁחִיתִים యొక్క భావం
  choice: అవినీతిగా ప్రవర్తిస్తూనే ఉన్నారు
  alternative: తమను తాము చెడగొట్టుకుంటూనే ఉన్నారు / నాశనం కలిగిస్తూనే ఉన్నారు
  rationale: హిఫిల్ రూపం స్వీయభ్రష్టతను గానీ, చెడును కలిగించడాన్ని గానీ సూచించగలదు. సందర్భానికి సరిపోయే విస్తృత నైతిక భావాన్ని ఎంచుకుని, సాధ్యమైన కర్మ లేదా ప్రతిఫలార్థాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని నైతిక మూల్యాంకనం, పోలికకు విధించిన పరిమితి, ప్రజల చెడు ప్రవర్తన కొనసాగుతుండటం స్పష్టంగా నిలుపబడ్డాయి.
