id: 2CH.27.5
reference: 2 Chronicles 27:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֠/הוּא נִלְחַ֞ם עִם מֶ֣לֶךְ בְּנֵי עַמּוֹן֮ וַ/יֶּחֱזַ֣ק עֲלֵי/הֶם֒ וַ/יִּתְּנוּ ל֨/וֹ בְנֵֽי עַמּ֜וֹן בַּ/שָּׁנָ֣ה הַ/הִ֗יא מֵאָה֙ כִּכַּר כֶּ֔סֶף וַ/עֲשֶׂ֨רֶת אֲלָפִ֤ים כֹּרִים֙ חִטִּ֔ים וּ/שְׂעוֹרִ֖ים עֲשֶׂ֣רֶת אֲלָפִ֑ים זֹ֗את הֵשִׁ֤יבוּ ל/וֹ֙ בְּנֵ֣י עַמּ֔וֹן וּ/בַ/שָּׁנָ֥ה הַ/שֵּׁנִ֖ית וְ/הַ/שְּׁלִשִֽׁית־־־־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/005.yaml
  text: He fought with the king of the Ammonites and prevailed against them[a], and the Ammonites gave him that year one hundred talents of silver, ten thousand cors of wheat, and ten thousand of barley. This the Ammonites paid to him also in the second year and in the third.
translation:
  language: te
  text: అతడు అమ్మోనీయుల రాజుతో యుద్ధం చేసి వారిపై పైచేయి సాధించాడు. ఆ సంవత్సరం అమ్మోనీయులు అతనికి వంద తలాంతుల వెండిని, పదివేల కోరుల గోధుమలను, పదివేల కోరుల యవలను[a] ఇచ్చారు. అమ్మోనీయులు రెండో సంవత్సరంలోనూ మూడో సంవత్సరంలోనూ అతనికి ఇదే చెల్లించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, ‘పదివేల కోరుల గోధుమలు, పదివేల యవలు’; ‘కోరులు’ అనే కొలత యవలకు కూడా వర్తిస్తుందని అర్థం.
    reason: మూలపాఠ్యంలో ఉన్న అధ్యాహారాన్ని తెలియజేసి, అనువాదంలో పూరించిన కొలతపదాన్ని పారదర్శకంగా చూపడం.
lexical_decisions:
- source_word: נִלְחַם עִם
  choice: తో యుద్ధం చేసి
  rationale: నిఫాల్ రూపంలోని לחם, עִםతో కలిసి ఇక్కడ ఒకరితో యుద్ధంలో తలపడడాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘తో యుద్ధం చేసి’ ఆ భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: అమ్మోనీయుల రాజు
  rationale: בְּנֵי עַמּוֹן అనేది అమ్మోను ప్రజలను సూచించే సాధారణ జాతినామక ప్రయోగం; ‘అమ్మోనీయులు’ తెలుగులో సహజమైన రూపం.
- source_word: וַיֶּחֱזַק עֲלֵיהֶם
  choice: వారిపై పైచేయి సాధించాడు
  rationale: సైనిక సందర్భంలో חזק על కేవలం బలంగా ఉండడాన్ని కాక ప్రత్యర్థిని అధిగమించడాన్ని సూచిస్తుంది. ‘పైచేయి సాధించాడు’ విజయ ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּתְּנוּ לוֹ
  choice: అతనికి ... ఇచ్చారు
  rationale: נתן యొక్క ప్రాథమిక అర్థమైన ‘ఇచ్చారు’ను మొదటి సందర్భంలో నిలిపి ఉంచింది; సందర్భం అది కప్పమని సూచించినా ఆ భావాన్ని అనవసరంగా మూలపాఠ్యంలోకి చేర్చలేదు.
- source_word: מֵאָה כִּכַּר כֶּסֶף
  choice: వంద తలాంతుల వెండి
  rationale: כִּכָּר ఒక ప్రాచీన బరువు ప్రమాణం. బైబిలు సందర్భంలో గుర్తించదగిన సాంప్రదాయిక లిప్యంతరీకరణ ‘తలాంతు’ను ఉపయోగించింది.
- source_word: כֹּרִים
  choice: కోరులు
  rationale: כֹּר ధాన్యపు ఘనపరిమాణ ప్రమాణం. సాధారణమైన ‘కొలతలు’ కంటే నిర్దిష్టతను కాపాడేందుకు ‘కోరు’ అనే లిప్యంతరీకరణను వాడింది.
- source_word: חִטִּים
  choice: గోధుమలు
  rationale: ఇది పదానికి ప్రామాణికమైన తెలుగు సమానార్థకం.
- source_word: וּשְׂעוֹרִים עֲשֶׂרֶת אֲלָפִים
  choice: పదివేల కోరుల యవలు
  rationale: హీబ్రూలో యవల ముందు ‘కోరులు’ మళ్లీ చెప్పబడకపోయినా, ముందున్న కొలత ఇక్కడ కూడా వర్తిస్తుంది. తెలుగులో పరిమాణం స్పష్టంగా ఉండేందుకు దాన్ని పూరించింది; మూలంలోని అధ్యాహారాన్ని పాదసూచికలో తెలిపింది.
- source_word: זֹאת הֵשִׁיבוּ לוֹ
  choice: అతనికి ఇదే చెల్లించారు
  rationale: הֵשִׁיבוּ అక్షరార్థంగా ‘తిరిగి ఇచ్చారు’ అయినా, ఇక్కడ తరువాతి సంవత్సరాల్లో అదే కప్పాన్ని సమర్పించడాన్ని సూచిస్తుంది. ‘చెల్లించారు’ ఆ ఆర్థిక సందర్భాన్ని సహజంగా వ్యక్తం చేస్తుంది; זֹאתను ‘ఇదే’గా నిలిపింది.
- source_word: וּבַשָּׁנָה הַשֵּׁנִית וְהַשְּׁלִשִׁית
  choice: రెండో సంవత్సరంలోనూ మూడో సంవత్సరంలోనూ
  rationale: అదే చెల్లింపు తరువాతి రెండు సంవత్సరాల్లో ఒక్కొక్కసారి పునరావృతమైందనే భావాన్ని ‘నూ’ సహజంగా తెలియజేస్తుంది.
