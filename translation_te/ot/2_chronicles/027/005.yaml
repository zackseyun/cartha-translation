  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ప్రాచీన కొలతల నిర్దిష్టత కోసం ‘తలాంతు’, ‘కోరు’ రూపాలను నిలిపి, మూలంలోని సంక్షిప్తతను పాదసూచికలో వివరించింది.
