source:
  edition: WLC
  text: וַ/יָּסֹ֨בּוּ֙ בִּֽ/יהוּדָ֔ה וַ/יִּקְבְּצ֤וּ אֶת הַ/לְוִיִּם֙ מִ/כָּל עָרֵ֣י יְהוּדָ֔ה וְ/רָאשֵׁ֥י הָ/אָב֖וֹת לְ/יִשְׂרָאֵ֑ל וַ/יָּבֹ֖אוּ אֶל יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/002.yaml
  text: And they went throughout Judah and gathered the Levites from all the cities of Judah[a], and the heads of the fathers’ houses of Israel, and they came to Jerusalem.
translation:
  language: te
  text: వారు యూదా దేశమంతటా సంచరించి, యూదా పట్టణాలన్నిటి నుండి లేవీయులను, ఇశ్రాయేలు పితృవంశాల పెద్దలను[a] సమకూర్చారు. వారు యెరూషలేముకు వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పితృవంశాల పెద్దలు’ అనే మాటను ‘పూర్వికుల వంశాల పెద్దలు’ లేదా మరింత సరళంగా ‘కుటుంబ పెద్దలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסֹבּוּ בִּיהוּדָה
  choice: యూదా దేశమంతటా తిరిగి
  rationale: סבב ఇక్కడ ఒక ప్రాంతమంతటా సంచరించడాన్ని సూచిస్తుంది. ‘దేశమంతటా తిరిగి’ అనే రూపం కార్యనిమిత్తం యూదా అంతటా వెళ్లిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּקְבְּצוּ
  choice: సమకూర్చారు
  rationale: קבץ అంటే ఒకచోటికి కూడగట్టడం. వ్యక్తులను పిలిపించి సమీకరించిన ఈ సందర్భంలో ‘సమకూర్చారు’ సహజమైన గౌరవప్రదమైన పదం.
- source_word: אֶת־הַלְוִיִּם מִכָּל עָרֵי יְהוּדָה
  choice: యూదా పట్టణాలన్నిటి నుండి లేవీయులను
  rationale: మూలంలోని సమస్త పట్టణాల పరిధినీ, అక్కడి నుండి వారిని సమీకరించిన భావాన్నీ నేరుగా నిలుపుతుంది.
- source_word: וְרָאשֵׁי הָאָבוֹת
  choice: పితృవంశాల పెద్దలను
  rationale: ‘తండ్రుల ప్రధానులు’ అనే అక్షరార్థం కన్నా, దినవృత్తాంతాలలోని వంశపరమైన పరిపాలనా ప్రయోగాన్ని ‘పితృవంశాల పెద్దలు’ స్పష్టంగా, మూల నిర్మాణానికి దగ్గరగా తెలియజేస్తుంది.
- source_word: לְיִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: לְ ఇక్కడ సంబంధాన్ని సూచిస్తుంది. మూలంలో ఉన్న ‘ఇశ్రాయేలు’ అనే పేరును ‘యూదా’గా కుదించకుండా అలాగే ఉంచింది.
- source_word: וַיָּבֹאוּ אֶל־יְרוּשָׁלִָם
  choice: వారు యెరూషలేముకు వచ్చారు
  rationale: בוא + אֶל కు సహజమైన కథన అనువాదం; గమ్యస్థానానికి చేరిన భావాన్ని స్పష్టంగా ఇస్తుంది.
theological_decisions:
- issue: యూదా-కేంద్రీకృత సందర్భంలో ‘ఇశ్రాయేలు’ పరిధి
  choice: ఇశ్రాయేలు అనే పేరును యథాతథంగా ఉంచడం
  alternative: యూదా; ఇశ్రాయేలు ప్రజలు
  rationale: హీబ్రూ మూలం స్పష్టంగా ఇశ్రాయేలు అంటుంది. దాని పరిధిని అనువాదంలో ముందుగానే నిర్ణయించకుండా దినవృత్తాంతాల గ్రంథంలోని వేదాంతపరమైన పదప్రయోగాన్ని నిలుపుతుంది.
- issue: הָאָבוֹת లోని బంధుత్వ-వంశ ప్రయోగం
  choice: పితృవంశాలు
  alternative: పూర్వికుల వంశాలు; కుటుంబాలు
  rationale: వంశపరమైన, పరిపాలనా నిర్మాణాన్ని నిలుపుతూ ఆధునిక తెలుగు పాఠకునికి అర్థమయ్యే రూపం. మరింత సాధారణ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. పొడవైన హీబ్రూ సమన్వయ వాక్యాన్ని పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా ఇచ్చినా, సంఘటనల క్రమం మరియు సంబంధాలు నిలుపబడ్డాయి.
