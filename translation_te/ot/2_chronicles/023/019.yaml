revisions:
- from: ఏ విధంగానైనా అపవిత్రుడైనవాడు లోపలికి రాకుండా, అతడు యెహోవా మందిర ద్వారాల దగ్గర ద్వారపాలకులను నియమించాడు.[a]
  to: ఏ విధంగానైనా అపవిత్రుడైన ఎవరూ ప్రవేశించకుండా, అతడు యెహోవా మందిర ద్వారాల వద్ద ద్వారపాలకులను నిలబెట్టాడు.[a]
  rationale: The revision preserves the Hebrew purpose/result relationship and its broad statement concerning ritual uncleanness. It replaces a potentially appointment-oriented verb with one that explicitly conveys posting personnel at their assigned positions, and clarifies the literal footnote without adding a particular source of uncleanness.
