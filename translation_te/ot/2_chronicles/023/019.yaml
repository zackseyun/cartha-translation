  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יַּעֲמֵד֙ הַ/שּׁ֣וֹעֲרִ֔ים עַֽל שַׁעֲרֵ֖י בֵּ֣ית יְהוָ֑ה וְ/לֹֽא יָבֹ֥א טָמֵ֖א לְ/כָל דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/019.yaml
  text: He stationed the gatekeepers at the gates of the house of Yahweh[a], so that no one unclean in any respect might enter.
translation:
  language: te
  text: ఏ విధంగానైనా అపవిత్రుడైన ఎవరూ ప్రవేశించకుండా, అతడు యెహోవా మందిర ద్వారాల వద్ద ద్వారపాలకులను నిలబెట్టాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఏ విషయంవల్లనైనా అపవిత్రుడైనవాడూ ప్రవేశించకూడదు.” అంటే, ఏ రకమైన లేదా ఏ కారణంవల్లనైనా అపవిత్రత కలిగిన ఎవరూ ప్రవేశించకూడదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: నియమించాడు
  rationale: עמד హిఫిల్ రూపం ఇక్కడ ద్వారపాలకులను వారి విధిస్థానాల్లో నిలబెట్టడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘నియమించాడు’ సహజంగా ఆ బాధ్యతా నియోగాన్ని తెలియజేస్తుంది.
- source_word: הַשֹּׁעֲרִים
  choice: ద్వారపాలకులను
  rationale: ఈ నామవాచకం ప్రవేశ ద్వారాలను కాపాడే నియమిత వ్యక్తులను సూచిస్తుంది; ఆలయ సందర్భంలో ‘ద్వారపాలకులు’ ఖచ్చితమైన పదం.
- source_word: עַל שַׁעֲרֵי
  choice: ద్వారాల దగ్గర
  rationale: నియోగ సందర్భంలో עַל అనేది ద్వారాల వద్ద విధిస్థానాన్ని సూచిస్తుంది; ‘దగ్గర’ సహజమైన తెలుగు స్థానప్రయోగం.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: బైబిలు సందర్భంలో ‘యెహోవా ఇల్లు’ అనే మూలరూపానికి అర్థసమానంగా, సాధారణ పాఠకునికి స్పష్టంగా ‘యెహోవా మందిరం’ వాడబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హెబ్రీ దైవనామాన్ని తెలుగు బైబిలు సంప్రదాయంలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ప్రత్యక్షంగా ఉంచుతుంది.
- source_word: וְלֹא יָבֹא
  choice: లోపలికి రాకుండా
  rationale: సందర్భంలో వావ్‌తో కూడిన నిరాకరణాత్మక అసంపూర్ణ క్రియ, ద్వారపాలకుల నియామక ఉద్దేశం లేదా ఫలితాన్ని తెలియజేస్తుంది; ఈ తెలుగు నిర్మాణం దానిని స్పష్టంగా అందిస్తుంది.
- source_word: טָמֵא
  choice: అపవిత్రుడైనవాడు
  rationale: ఆలయ ప్రవేశ సందర్భంలో ఇది ఆచారపరమైన అపవిత్రతను సూచించే ప్రామాణిక పదం; కేవలం శారీరక మలినత అనే భావాన్ని నివారిస్తుంది.
- source_word: לְכָל דָּבָר
  choice: ఏ విధంగానైనా
  rationale: అక్షరార్థంగా ‘ఏ విషయానికైనా’ అనే విస్తృత పదబంధం ఇక్కడ ఏ కారణం లేదా ఏ రకమైన అపవిత్రతనైనా సూచిస్తుంది; ‘ఏ విధంగానైనా’ ఆ సమగ్రతను సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో టెట్రాగ్రామటన్ ప్రత్యక్షంగా ఉంది. దైవనామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణను ఉంచడం మూలంలోని వ్యక్తిగత నామాన్ని కాపాడుతుంది.
- issue: טָמֵא యొక్క పరిధి
  choice: ఆచారపరమైన అపవిత్రతను సూచించే ‘అపవిత్రుడు’
  alternative: మలినుడు
  rationale: మందిర ప్రవేశ సందర్భం ఆచారపరమైన శుద్ధి స్థితిని సూచిస్తుంది. అయినా అపవిత్రతకు ఖచ్చితమైన కారణాన్ని వాక్యం నిర్దేశించదు; అందువల్ల అదనపు నియమాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే మందిరం మరియు ఆచారపరమైన అపవిత్రతకు తగిన గంభీరతతో రూపొందించబడింది. మూలంలోని ఉద్దేశం/ఫలితం సంబంధాన్ని సహజ తెలుగు వాక్యక్రమంలో ముందుకు తెచ్చింది.
