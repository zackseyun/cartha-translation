  text: וַ/יָּבֹ֨אוּ כָל הָ/עָ֤ם בֵּית הַ/בַּ֨עַל֙ וַֽ/יִּתְּצֻ֔/הוּ וְ/אֶת מִזְבְּחֹתָ֥י/ו וְ/אֶת צְלָמָ֖י/ו שִׁבֵּ֑רוּ וְ/אֵ֗ת מַתָּן֙ כֹּהֵ֣ן הַ/בַּ֔עַל הָרְג֖וּ לִ/פְנֵ֥י הַֽ/מִּזְבְּחֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/017.yaml
  text: Then all the people went to the house of Baal and tore it down, and they smashed his altars and his images, and they killed Mattan the priest of Baal before the altars.
translation:
  language: te
  text: అప్పుడు ప్రజలందరూ బయలు దేవాలయానికి వెళ్లి దానిని కూల్చివేశారు. దాని బలిపీఠాలను, విగ్రహాలను పగులగొట్టి, బయలు యాజకుడైన మత్తానును ఆ బలిపీఠాల ఎదుట చంపారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית הַבַּעַל
  choice: బయలు దేవాలయం
  rationale: ఇక్కడ בֵּית అనేది నివాసగృహం కాక ఆరాధనా మందిరాన్ని సూచిస్తుంది; ఆధునిక తెలుగు పాఠకులకు ‘దేవాలయం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וַיִּתְּצֻהוּ
  choice: దానిని కూల్చివేశారు
  rationale: మూలంలోని క్రియ భవనాన్ని పడగొట్టడం లేదా ధ్వంసం చేయడం అనే భావాన్ని ఇస్తుంది; ‘కూల్చివేశారు’ దేవాలయానికి సహజమైన తెలుగు ప్రయోగం.
- source_word: צְלָמָיו
  choice: విగ్రహాలు
  rationale: ఈ ఆరాధనా సందర్భంలో చెక్కిన లేదా నిలబెట్టిన దేవతా ప్రతిమలను సూచించే సహజమైన తెలుగు పదం.
- source_word: שִׁבֵּרוּ
  choice: పగులగొట్టి
  rationale: పీఠాలు, ప్రతిమలను ముక్కలు చేసే బలమైన కార్యాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: לִפְנֵי הַמִּזְבְּחוֹת
  choice: ఆ బలిపీఠాల ఎదుట
  rationale: לִפְנֵי యొక్క స్థలార్థాన్ని నేరుగా నిలుపుతూ, ముందే ప్రస్తావించిన బయలు బలిపీఠాలనే సూచించేందుకు ‘ఆ’ వాడబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన చారిత్రక వర్ణన. హిబ్రూ వాక్యంలోని వరుస చర్యలను సహజ తెలుగు ప్రవాహంలో నిలిపి, ‘బయలు’ అనే పేరును దేవుని సాధారణ బిరుదుగా అపార్థం కాకుండా ‘బయలు దేవాలయం/యాజకుడు’ అనే సందర్భంలో ఉంచాం.
