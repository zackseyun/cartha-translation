source:
  edition: WLC
  text: וַ/יָּשֶׂם֩ יְהוֹיָדָ֨ע פְּקֻדֹּ֜ת בֵּ֣ית יְהוָ֗ה בְּ/יַ֨ד הַ/כֹּהֲנִ֣ים הַ/לְוִיִּם֮ אֲשֶׁ֣ר חָלַ֣ק דָּוִיד֮ עַל בֵּ֣ית יְהוָה֒ לְֽ/הַעֲל֞וֹת עֹל֣וֹת יְהוָ֗ה כַּ/כָּת֛וּב בְּ/תוֹרַ֥ת מֹשֶׁ֖ה בְּ/שִׂמְחָ֣ה וּ/בְ/שִׁ֑יר עַ֖ל יְדֵ֥י דָוִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/018.yaml
  text: And Jehoiada appointed the oversight of the house of Yahweh into the hand of the priests[a], the Levites, whom David had assigned over the house of Yahweh, to offer up burnt offerings to Yahweh, as it is written in the Law of Moses, with rejoicing and with song[c][b], according to the direction of David.
translation:
  language: te
  text: యెహోయాదా యెహోవా మందిరపు బాధ్యతలను యాజకులైన లేవీయుల[a] చేతికి అప్పగించాడు. దావీదు యెహోవా మందిరం కోసం నియమించిన వారే మోషే ధర్మశాస్త్రంలో వ్రాయబడిన ప్రకారం యెహోవాకు దహనబలులు అర్పిస్తూ, సంతోషంతోను గానంతోను సేవ చేయునట్లు దావీదు ఏర్పాటు ప్రకారం[b] యెహోయాదా వారిని నియమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘లేవీయ యాజకులు’; లేదా, ‘యాజకులు మరియు లేవీయులు.’ హీబ్రూ పదబంధాన్ని ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, ‘దావీదు చేతి ద్వారా’; అంటే దావీదు చేసిన ఏర్పాటు లేదా ఇచ్చిన నిర్దేశం ప్రకారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... פְּקֻדֹּת
  choice: పర్యవేక్షణను ... అప్పగించాడు
  rationale: שׂים మరియు פקדות కలయిక ఇక్కడ మందిర సేవకు సంబంధించిన పరిపాలనా బాధ్యతను నియమించి అప్పగించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘యెహోవా ఇల్లు’; సందర్భంలో అది దేవాలయాన్ని సూచిస్తున్నందున ‘మందిరం’ సాధారణ పాఠకులకు సహజమైన సమానార్థకం.
- source_word: בְּיַד
  choice: చేతికి అప్పగించాడు
  rationale: ‘చేతిలో/చేతికి’ అనే మూలభాషా రూపాన్ని నిలుపుతూ, బాధ్యత అప్పగించడం అనే పరిపాలనా భావాన్ని తెలుగులో తెలియజేస్తుంది.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: యాజకులైన లేవీయులు
  rationale: అసంధిగ్ధంగా నిర్ణయించలేని హీబ్రూ నిర్మాణానికి ఇది సాధ్యమైన సహజ తెలుగు పఠనం; ఇతర సాధ్యతలను పాదటిప్పణి సంరక్షిస్తుంది.
- source_word: אֲשֶׁר חָלַק דָּוִיד
  choice: దావీదు వారిని ... నియమించాడు
  rationale: חלק ప్రాథమికంగా విభజించడం లేదా పంచడం అయినా, ఇక్కడ సేవా విభాగాలుగా కేటాయించడం అనే కార్యార్థం ఉంది.
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: దహనబలులు అర్పించడానికి
  rationale: బలి సందర్భంలో עלה హిఫీల్ మరియు עלות కలయికకు స్థిరమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: כַּכָּתוּב בְּתוֹרַת מֹשֶׁה
  choice: మోషే ధర్మశాస్త్రంలో రాసి ఉన్న ప్రకారం
  rationale: లిఖితమైన మోషే తోరా నిర్దేశాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְּשִׂמְחָה וּבְשִׁיר
  choice: సంతోషంతో, పాటలతో
  rationale: ఆరాధనలోని ఆనందం మరియు గానాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַל יְדֵי דָוִיד
  choice: దావీదు ఏర్పాటు ప్రకారం
  rationale: ‘దావీదు చేతి ద్వారా’ అనే నుడికారం ఈ సందర్భంలో అతడు చేసిన ఆరాధనా ఏర్పాటును లేదా నిర్దేశాన్ని సూచించవచ్చు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో అందిస్తుంది.
theological_decisions:
- issue: הַכֹּהֲנִים הַלְוִיִּם లో యాజకులు-లేవీయుల సంబంధం
  choice: ప్రధాన పాఠ్యంలో ‘యాజకులైన లేవీయులు’; ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇవ్వడం
  alternative: ‘యాజకులు, లేవీయులు’ లేదా ‘లేవీయ యాజకులు’
  rationale: హీబ్రూ పదబంధం అన్వయార్థంగా గానీ, రెండు వర్గాలుగా గానీ అర్థమయ్యే అవకాశం ఉంది; పాదటిప్పణి ఈ నిజమైన అస్పష్టతను నిలుపుతుంది.
- issue: עַל יְדֵי דָוִיד యొక్క భావం
  choice: దావీదు ఏర్పాటు ప్రకారం
  alternative: దావీదు చేతి ద్వారా / దావీదు నిర్దేశం ప్రకారం
  rationale: దావీదు అప్పటికే మరణించిన ఈ సందర్భంలో ప్రత్యక్ష కార్యసాధకత్వం కంటే అతడు చేసిన పూర్వ ఏర్పాటే సందర్భోచితం; అయినా మూల నుడికారానికి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: దైవనామం יְהוָה
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: వ్యక్తిగత దైవనామాన్ని నిలుపుతూ, ఆధునిక తెలుగు బైబిల్ పాఠకులకు విస్తృతంగా పరిచయమైన రూపాన్ని ఉపయోగించాం.
translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. పొడవైన హీబ్రూ వాక్యాన్ని మూడు సహజ తెలుగు వాక్యాలుగా విభజించాం; మందిర పరిపాలన, బలులు, గానారాధన మధ్య సంబంధం నిలుపబడింది.
