  to: యెహోయాదా యెహోవా మందిరపు బాధ్యతలను యాజకులైన లేవీయుల[a] చేతికి అప్పగించాడు. దావీదు యెహోవా మందిరం కోసం నియమించిన వారే మోషే ధర్మశాస్త్రంలో వ్రాయబడిన ప్రకారం యెహోవాకు దహనబలులు అర్పిస్తూ, సంతోషంతోను గానంతోను సేవ చేయునట్లు దావీదు ఏర్పాటు ప్రకారం[b] యెహోయాదా వారిని నియమించాడు.
  rationale: The text is revised to remove the added modal force and to connect joyful song directly with the temple offering service. ‘బాధ్యతలను’ restores the plural administrative sense of פְּקֻדּוֹת. The relative reference to David’s prior assignment is retained, and the ambiguity of ‘the priests, the Levites’ remains documented in the anchored footnote.
