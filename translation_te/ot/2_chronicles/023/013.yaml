  text: וַ/תֵּ֡רֶא וְ/הִנֵּ֣ה הַ/מֶּלֶךְ֩ עוֹמֵ֨ד עַֽל עַמּוּד֜/וֹ בַּ/מָּב֗וֹא וְ/הַ/שָּׂרִ֣ים וְ/הַ/חֲצֹצְרוֹת֮ עַל הַ/מֶּלֶךְ֒ וְ/כָל עַ֨ם הָ/אָ֜רֶץ שָׂמֵ֗חַ וְ/תוֹקֵ֨עַ֙ בַּ/חֲצֹ֣צְר֔וֹת וְ/הַ/מְשֽׁוֹרֲרִים֙ בִּ/כְלֵ֣י הַ/שִּׁ֔יר וּ/מוֹדִיעִ֖ים לְ/הַלֵּ֑ל וַ/תִּקְרַ֤ע עֲתַלְיָ֨הוּ֙ אֶת בְּגָדֶ֔י/הָ וַ/תֹּ֖אמֶר קֶ֥שֶׁר קָֽשֶׁר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/013.yaml
  text: And she looked[a], and behold, the king was standing by his pillar at the entrance, and the officials and the trumpets were beside the king; and all the people of the land were rejoicing and blowing trumpets, and the singers with the instruments of song were leading the praise. Then Athaliah tore her clothes and said[b], “Conspiracy! Conspiracy!”
translation:
  language: te
  text: ఆమె చూసేసరికి, ఇదిగో, ప్రవేశద్వారం దగ్గర రాజు తన స్తంభం పక్కన నిలబడి ఉన్నాడు. రాజు పక్కన అధికారులు, బాకాలు[a] ఉన్నాయి. ఆ దేశ ప్రజలందరూ సంతోషిస్తూ బాకాలు ఊదుతున్నారు; గాయకులు సంగీత వాద్యాలతో స్తుతిని నడిపిస్తున్నారు[b]. అప్పుడు అతల్యా తన బట్టలు చింపుకొని, “కుట్ర! కుట్ర!” అని అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో అక్షరార్థంగా, “అధికారులు, బాకాలు రాజు పక్కన ఉన్నాయి.” కొన్ని అనువాదాలు వాయిద్యాలను వాటిని వాయించేవారికి సూచనగా తీసుకొని, “బాకాలు ఊదేవారు” అని అనువదిస్తాయి.
    reason: lexical_alternative
  - marker: b
    text: లేదా “స్తుతిని నిర్దేశిస్తున్నారు.” ఈ సంగీత సందర్భంలోని హీబ్రూ పదబంధం కొంత నుడికారంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא וְהִנֵּה
  choice: ఆమె చూసేసరికి, ఇదిగో
  rationale: కథనంలోని హఠాత్తయిన దృశ్యగ్రహణాన్ని ‘చూసేసరికి’ సహజంగా తెలియజేస్తుంది; ‘ఇదిగో’ హిన్నే అనే శ్రద్ధను ఆకర్షించే సూచకపద బలాన్ని నిలుపుతుంది.
- source_word: הַמֶּלֶךְ עוֹמֵד עַל עַמּוּדוֹ בַּמָּבוֹא
  choice: ప్రవేశద్వారం దగ్గర రాజు తన స్తంభం పక్కన నిలబడి ఉన్నాడు
  rationale: వర్తమాన కృదంతం తెలిపే కొనసాగుతున్న భంగిమను ‘నిలబడి ఉన్నాడు’ చూపుతుంది. ఈ రాజవిధి సందర్భంలో עַל అనేది స్తంభంతో స్థానసంబంధాన్ని సూచిస్తుంది కాబట్టి ‘పక్కన’ ఎంచుకున్నాం.
- source_word: וְהַשָּׂרִים וְהַחֲצֹצְרוֹת עַל הַמֶּלֶךְ
  choice: రాజు పక్కన అధికారులు, బాకాలు ఉన్నాయి
  rationale: మసొరేటిక్ పాఠంలో వాయించేవారు అని కాక నేరుగా ‘బాకాలు’ అని ఉంది. దానిని ప్రధాన పాఠంలో నిలుపుతూ, అది వాయిద్యకారులను సూచించే అలంకార ప్రయోగం కావచ్చని పాదటిప్పణిలో తెలిపాం.
- source_word: וְכָל עַם הָאָרֶץ שָׂמֵחַ וְתוֹקֵעַ בַּחֲצֹצְרוֹת
  choice: ఆ దేశ ప్రజలందరూ సంతోషిస్తూ బాకాలు ఊదుతున్నారు
  rationale: ప్రజల బహిరంగ ఉత్సవానందాన్నీ, బాకాలు ఊదుతున్న కొనసాగుతున్న చర్యనూ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְהַמְשׁוֹרֲרִים בִּכְלֵי הַשִּׁיר
  choice: గాయకులు సంగీత వాద్యాలతో
  rationale: מְשׁוֹרֲרִים ప్రత్యేకంగా గాయకులను సూచిస్తుంది; כְּלֵי הַשִּׁיר అనే పదబంధాన్ని అర్థస్పష్టంగా ‘సంగీత వాద్యాలు’గా ఇచ్చాం.
- source_word: וּמוֹדִיעִים לְהַלֵּל
  choice: స్తుతిని నడిపిస్తున్నారు
  rationale: సంగీత-ఆరాధనా సందర్భంలో హిఫిల్ రూపం స్తుతిని నడిపించడం లేదా నిర్దేశించడం అనే కార్యార్థాన్ని కలిగి ఉండవచ్చు. సహజమైన ప్రధాన పాఠంతో పాటు ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וַתִּקְרַע עֲתַלְיָהוּ אֶת בְּגָדֶיהָ
  choice: అతల్యా తన బట్టలు చింపుకొని
  rationale: దుఃఖం లేదా ఆగ్రహాన్ని బహిరంగంగా వ్యక్తం చేసే చర్యను మూలానికి దగ్గరగా, సహజంగా అందిస్తుంది.
- source_word: קֶשֶׁר קָשֶׁר
  choice: కుట్ర! కుట్ర!
  rationale: రాజకీయ తిరుగుబాటు లేదా కుట్ర అనే ఆరోపణను వ్యక్తం చేసే קשר పదాన్ని, దాని ఉద్దేశపూర్వక పునరుక్తితో సహా నిలిపాం.
