translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడాం. ‘ఇదిగో’ ద్వారా హీబ్రూ కథనంలోని సజీవ దృష్టి-సూచనను నిలిపాం. మూలంలోని ‘బాకాలు’ అనే అనూహ్య రూపాన్నీ, స్తుతి నిర్వహణకు సంబంధించిన నుడికారపు అనిశ్చితినీ పాదటిప్పణులతో సంరక్షించాం.
