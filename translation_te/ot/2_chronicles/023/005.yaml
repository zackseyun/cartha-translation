id: 2CH.23.5
reference: 2 Chronicles 23:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/שְּׁלִשִׁית֙ בְּ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/הַ/שְּׁלִשִׁ֖ית בְּ/שַׁ֣עַר הַ/יְס֑וֹד וְ/כָל הָ/עָ֔ם בְּ/חַצְר֖וֹת בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/005.yaml
  text: one third shall be at the king’s house[a], one third at the Foundation Gate, and all the people in the courts of the house of Yahweh.
translation:
  language: te
  text: మూడవ వంతు రాజభవనం వద్ద, మూడవ వంతు పునాది ద్వారం[a] వద్ద ఉండాలి. ప్రజలందరూ యహ్వే మందిర ప్రాంగణాల్లో ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పునాది ద్వారం’ అనేది హెబ్రూలో ఒక ప్రత్యేక ద్వారనామం కావచ్చు; ‘పునాది యొక్క ద్వారం’ అని కూడా అర్థం కావచ్చు. అది ఏ ద్వారాన్ని సూచిస్తుందో ఖచ్చితంగా తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁלִשִׁית
  choice: మూడవ వంతు
  rationale: స్త్రీలింగ క్రమసంఖ్య ఇక్కడ సమూహంలోని ఒక మూడవ భాగాన్ని సూచిస్తూ నామవాచకంగా వాడబడింది. ‘మూడవ వంతు’ ఆధునిక తెలుగులో సహజంగా ఉండి సంఖ్యాపరమైన విభజనను స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּבֵית הַמֶּלֶךְ
  choice: రాజభవనం దగ్గర
  rationale: בֵּית అనే పదానికి ప్రాథమికంగా ‘ఇల్లు’ అని అర్థం; రాజు విషయంలో అది రాజనివాసాన్ని సూచిస్తుంది. కాపలా స్థానాల నియామక సందర్భంలో בְּ ఉపసర్గను ‘దగ్గర’ అని అనువదించడం సహజం; ‘రాజభవనం’ ఉద్దేశించిన స్థలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּשַׁעַר הַיְסוֹד
  choice: పునాది ద్వారం దగ్గర
  rationale: שַׁעַר అంటే ‘ద్వారం’; יְסוֹד అంటే సాధారణంగా ‘పునాది’ లేదా ‘ఆధారం.’ ఇది ఒక ప్రత్యేక ద్వారనామంగా కనిపిస్తున్నందున ‘పునాది ద్వారం’ అని అనువదించబడింది; దాని ఖచ్చితమైన గుర్తింపు అనిశ్చితమని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: וְכָל הָעָם
  choice: ప్రజలందరూ
  rationale: עָם అనే సాధారణ పదానికి ‘ప్రజలు’ సహజమైన, సందర్భానికి తగిన అనువాదం. כָל భావాన్ని ‘అందరూ’ తెలియజేస్తుంది.
- source_word: בְּחַצְרוֹת
  choice: ప్రాంగణాల్లో
  rationale: חָצֵר బహువచనం చుట్టూ కట్టబడిన ఆవరణలను సూచిస్తుంది. దేవాలయ సందర్భంలో ‘ప్రాంగణాలు’ స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: పదశః ‘యెహోవా ఇల్లు’ అయినా, ఇక్కడ సూచించబడేది దేవాలయ సముదాయం. ‘యెహోవా మందిరం’ ఆధునిక తెలుగులో సహజంగా ఉండి సూచ్యార్థాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో నాలుగు అక్షరాల దైవనామం నేరుగా ఉంది. దాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచడం నామాన్ని ప్రత్యక్షంగా పరిరక్షిస్తుంది.
- issue: వాక్యంలో విడిచిపెట్టబడిన క్రియను పూరించడం
  choice: ఉండాలి
  alternative: క్రియను వ్యక్తపరచకుండా వాక్యఖండంగా ఉంచడం
  rationale: హెబ్రూ సందర్భానుసారంగా ‘ఉండాలి’ అనే క్రియను విడిచిపెడుతుంది. తెలుగులో పూర్తి, సహజమైన ఆదేశ వాక్యంగా ఉండేందుకు ఈ క్రియను సరఫరా చేశాము; ఇది కొత్త తాత్త్విక భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే చారిత్రక వర్ణనకు తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. కాపలా స్థానాల సందర్భంలో ‘దగ్గర’ వాడబడింది; ఆలయ ఆవరణలకు ‘ప్రాంగణాలు’ ఎంచుకోబడింది.
