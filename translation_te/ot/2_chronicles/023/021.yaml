source:
  edition: WLC
  text: וַ/יִּשְׂמְח֥וּ כָל עַם הָ/אָ֖רֶץ וְ/הָ/עִ֣יר שָׁקָ֑טָה וְ/אֶת עֲתַלְיָ֖הוּ הֵמִ֥יתוּ בֶ/חָֽרֶב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/021.yaml
  text: And all the people of the land rejoiced[a], and the city was quiet. And they put Athaliah to death with the sword.
translation:
  language: te
  text: దేశ ప్రజలందరూ సంతోషించారు; నగరం ప్రశాంతంగా ఉంది. అతల్యాను వారు ఖడ్గంతో చంపారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతల్యాను ఖడ్గంతో చంపినందువల్ల నగరం ప్రశాంతంగా ఉంది.” హీబ్రూలోని సంధిపదాన్ని సాధారణ సమన్వయంగా గానీ, సందర్భానుసారంగా వివరణాత్మక లేదా కారణసంబంధంగా గానీ అర్థం చేసుకోవచ్చు.
    reason: హీబ్రూ సంధిపదంలోని సంబంధార్థ అస్పష్టతను తెలియజేయడం.
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: సంతోషించారు
  rationale: שׂמח అనే క్రియ సంతోషించడం లేదా ఆనందించడం అనే భావాన్ని ఇస్తుంది. ప్రజల బహిరంగ ఆనందాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כָל עַם הָאָרֶץ
  choice: దేశ ప్రజలందరూ
  rationale: ఈ పదబంధం ఆ దేశంలోని సమస్త ప్రజలను సూచిస్తుంది. హీబ్రూ నుడికార భావాన్ని సహజమైన తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: וְהָעִיר
  choice: పట్టణం
  rationale: సందర్భంలో ఇది యెరూషలేమును సూచించినప్పటికీ, మూలపాఠం పేరు చెప్పకుండా ‘పట్టణం’ అని మాత్రమే అంటుంది; అందువల్ల అదే సాధారణ పదాన్ని నిలిపింది.
- source_word: שָׁקָטָה
  choice: ప్రశాంతంగా ఉంది
  rationale: ఈ క్రియ కల్లోలం తరువాత ఏర్పడిన నిశ్చలత, ప్రశాంతత లేదా విశ్రాంతిని సూచిస్తుంది. ‘ప్రశాంతంగా ఉంది’ సహజంగా ఉండి అర్థాన్ని అతిగా నిర్ధారించదు.
- source_word: וְאֶת עֲתַלְיָהוּ הֵמִיתוּ
  choice: అతల్యాను వారు చంపారు
  rationale: מות ధాతువు హిఫీల్ రూపం ‘చనిపోయేలా చేశారు,’ అంటే ‘చంపారు/మరణశిక్ష అమలు చేశారు’ అని అర్థం. ఇక్కడ ‘చంపారు’ మూలంలోని క్రియను నేరుగా, స్పష్టంగా అందిస్తుంది.
- source_word: בֶחָרֶב
  choice: కత్తితో
  rationale: ב ఉపసర్గ ఇక్కడ సాధనార్థకంగా ఉంది; మరణం కలిగించిన సాధనం కత్తి అని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: పట్టణం ప్రశాంతంగా ఉండటానికి అతల్యా మరణం కారణమని సంబంధాన్ని స్పష్టీకరించాలా?
  choice: ప్రధాన పాఠంలో వావ్‌ను సాధారణ సమన్వయంగా చూపించి వాక్యాలను వరుసగా ఉంచడం
  alternative: ‘అతల్యాను కత్తితో చంపినందువల్ల పట్టణం ప్రశాంతంగా ఉంది’ అని కారణార్థకంగా అనువదించడం
  rationale: హీబ్రూ וְ సాధారణంగా ‘మరియు’ అనే సమన్వయాన్ని సూచిస్తుంది; సందర్భం కారణ సంబంధాన్ని సూచించవచ్చుగాని, మూలపాఠం దాన్ని తప్పనిసరిగా స్పష్టం చేయదు. అందువల్ల ప్రధాన పాఠం అస్పష్టతను నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. సందర్భం యెరూషలేమును సూచించినా మూలపాఠంలోని సాధారణ ‘పట్టణం’ అనే పదమే నిలుపబడింది. వ్యక్తిపేరు ‘అతల్యా’గా లిప్యంతరీకరించబడింది.
