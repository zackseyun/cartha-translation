  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יּוֹצִ֣יאוּ אֶת בֶּן הַ/מֶּ֗לֶךְ וַ/יִּתְּנ֤וּ עָלָי/ו֙ אֶת הַ/נֵּ֨זֶר֙ וְ/אֶת הָ֣/עֵד֔וּת וַ/יַּמְלִ֖יכוּ אֹת֑/וֹ וַ/יִּמְשָׁחֻ֨/הוּ֙ יְהוֹיָדָ֣ע וּ/בָנָ֔י/ו וַ/יֹּאמְר֖וּ יְחִ֥י הַ/מֶּֽלֶךְ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/011.yaml
  text: Then they brought out the king’s son[a], put the crown and the testimony on him, made him king, and anointed him; and Jehoiada and his sons said, “Long live the king!”
translation:
  language: te
  text: అప్పుడు వారు రాజు కుమారుణ్ణి బయటికి తీసుకొచ్చి, అతనిపై కిరీటాన్ని, సాక్ష్యాన్ని[a] ఉంచి, అతణ్ణి రాజుగా నియమించారు. యెహోయాదా, అతని కుమారులు అతణ్ణి అభిషేకించి, “రాజు చిరకాలం జీవించాలి!” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ధర్మశాస్త్రాన్ని” లేదా “నిబంధన పత్రాన్ని.” హీబ్రూ పదం రాజు పాలనతో సంబంధమున్న లిఖిత నిబంధన సాక్ష్యాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאוּ
  choice: బయటికి తీసుకొచ్చి
  rationale: יצא హిఫీల్ రూపం ‘బయటికి తీసుకురావడం’ అనే భావాన్ని ఇస్తుంది; పట్టాభిషేకం కోసం రాజకుమారుణ్ణి ప్రజల ముందుకు తీసుకువచ్చిన సందర్భానికి ఇది సహజమైన తెలుగు.
- source_word: בֶּן הַמֶּלֶךְ
  choice: రాజకుమారుణ్ణి
  rationale: అక్షరార్థంగా ‘రాజు కుమారుణ్ణి’; ఈ రాజవంశ సందర్భంలో ‘రాజకుమారుడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הַנֵּזֶר
  choice: కిరీటాన్ని
  rationale: נֵזֶר ప్రతిష్ఠ లేదా రాజాధికారానికి గుర్తైన శిరోభూషణాన్ని సూచించగలదు; ఈ పట్టాభిషేక సందర్భంలో ‘కిరీటం’ సాధారణ పాఠకులకు స్పష్టమైన పదం.
- source_word: הָעֵדוּת
  choice: సాక్ష్యపత్రాన్ని
  rationale: עֵדוּת యొక్క ‘సాక్ష్యం’ అనే ప్రాథమిక భావాన్నీ, రాజపాలనకు సంబంధించిన లిఖిత నిబంధన లేదా ధర్మశాస్త్ర పత్రం కావచ్చనే సందర్భార్థాన్నీ ‘సాక్ష్యపత్రం’ నిలుపుతుంది; అర్థాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: అతణ్ణి రాజుగా నియమించారు
  rationale: מלך హిఫీల్ రూపం ‘రాజుగా చేయడం/పాలించేలా చేయడం’ అని అర్థం; కిరీటం ఉంచడమనే వేరే చర్యతో దీనిని కలపకుండా ‘రాజుగా నియమించారు’ అని అనువదించాం.
- source_word: וַיִּמְשָׁחֻהוּ
  choice: అతణ్ణి అభిషేకించి
  rationale: రాజును ప్రతిష్ఠించే సందర్భంలో משׁח కు సంప్రదాయపరంగానూ ఆధునిక తెలుగులోనూ ‘అభిషేకించడం’ సరైన పదం.
- source_word: יְהוֹיָדָע וּבָנָיו
  choice: యెహోయాదా, అతని కుమారులు
  rationale: హీబ్రూ వాక్యక్రమంలో వీరే అభిషేక క్రియకు సహజమైన బహువచన కర్తలు, అలాగే తరువాతి పలుకుకూ కర్తలు.
- source_word: יְחִי הַמֶּלֶךְ
  choice: రాజు చిరకాలం జీవించాలి!
  rationale: రాజును అభినందిస్తూ పలికే జస్సివ్ నినాద బలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పట్టాభిషేక ఆచారంలో הָעֵדוּת అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘సాక్ష్యపత్రం’
  alternative: ‘ధర్మశాస్త్రం’ లేదా ‘నిబంధన పత్రం’
  rationale: హీబ్రూ పదానికి ‘సాక్ష్యం’ అనే విస్తృత భావం, నిబంధన సంబంధమైన ప్రతిధ్వని ఉన్నాయి. ఇది రాజుకు సంబంధించిన లిఖిత ధర్మశాస్త్రం లేదా నిబంధన పత్రాన్ని సూచించే అవకాశం ఉన్నా, ప్రధాన పాఠ్యంలో ఒకే వివరణను ఖచ్చితంగా రుద్దకుండా ‘సాక్ష్యపత్రం’ అని ఉంచాం.
- issue: అభిషేకం చేసినవారి గుర్తింపు
  choice: యెహోయాదా, అతని కుమారులనే అభిషేక క్రియకు కర్తలుగా చూపడం
  alternative: అభిషేకం చేసినవారిని ముందు వచ్చిన అనిర్దిష్ట ‘వారు’గా భావించి, యెహోయాదా మరియు అతని కుమారులను కేవలం నినాదానికి కర్తలుగా చూపడం
  rationale: హీబ్రూలో וַיִּמְשָׁחֻהוּ తరువాత వెంటనే వచ్చిన יְהוֹיָדָע וּבָנָיו బహువచన కర్తగా సహజంగా అనుసంధానమవుతుంది; తరువాతి וַיֹּאמְרוּ కూడా అదే కర్తను కొనసాగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘రాజకుమారుడు,’ ‘కిరీటం,’ ‘అభిషేకం’ వంటి సులభంగా అర్థమయ్యే పదాలను ఎంచుకున్నాం. చివరి మాటలు ప్రజా రాజనినాదంగా వినిపించేందుకు ‘అని కేకలు వేశారు’ అని అనువదించాం.
