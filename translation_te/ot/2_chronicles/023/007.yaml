translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన ఆదేశ శైలిని ఉపయోగించాం. హెబ్రీ వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా, దాని ఆదేశ బలం, కర్మణి భావం, సమాంతర కదలిక పదబంధాన్ని నిలిపాం. పాదసూచిక గుర్తును దానికి సంబంధించిన “గృహం” పదం వద్ద ఉంచాం.
