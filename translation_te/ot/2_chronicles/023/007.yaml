source:
  edition: WLC
  text: וְ/הִקִּיפוּ֩ הַ/לְוִיִּ֨ם אֶת הַ/מֶּ֜לֶךְ סָבִ֗יב אִ֚ישׁ וְ/כֵלָ֣י/ו בְּ/יָד֔/וֹ וְ/הַ/בָּ֥א אֶל הַ/בַּ֖יִת יוּמָ֑ת וִֽ/הְי֥וּ אֶת הַ/מֶּ֖לֶךְ בְּ/בֹא֥/וֹ וּ/בְ/צֵאתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/007.yaml
  text: The Levites shall surround the king on every side[a], each man with his weapons in his hand; and whoever enters the house shall be put to death. Be with the king when he comes in and when he goes out.
translation:
  language: te
  text: లేవీయులు రాజును అన్నివైపులా చుట్టుముట్టాలి; ప్రతి ఒక్కరూ తమ ఆయుధాలను చేతిలో పట్టుకొని ఉండాలి. ఆ గృహంలోకి[a] ప్రవేశించే ఎవరైనా చంపబడాలి. రాజు లోపలికి వచ్చినప్పుడూ బయటికి వెళ్లినప్పుడూ అతనితో ఉండండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో “ఇల్లు”; దినవృత్తాంతముల గ్రంథంలో ఇది సాధారణంగా దేవాలయాన్ని సూచించే పేరు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקִּיפוּ הַלְוִיִּם אֶת הַמֶּלֶךְ סָבִיב
  choice: లేవీయులు రాజును అన్నివైపులా చుట్టుముట్టాలి
  rationale: హిఫిల్ క్రియ ఇక్కడ యెహోయాదా ఇచ్చిన ఆదేశాన్ని తెలియజేస్తుంది. “చుట్టుముట్టాలి” ఆదేశ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; “అన్నివైపులా” סָבִיב తెలిపే సంపూర్ణ పరివేష్టనను వ్యక్తం చేస్తుంది.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: ప్రతి ఒక్కరూ తమ ఆయుధాలను చేతిలో పట్టుకొని ఉండాలి
  rationale: אִישׁ పంపిణీ భావంలో “ప్రతి ఒక్కరూ” అని అర్థం. రక్షణ ఏర్పాట్ల సందర్భంలో כֵלָיו సాధారణ పరికరాలు కాక ఆయుధాలను సూచిస్తుంది. తెలుగు వచనంలో సహజంగా ఉండేందుకు ఏకవచన హెబ్రీ నిర్మాణాన్ని పంపిణీ బహువచనంగా వ్యక్తం చేశాం.
- source_word: וְהַבָּא אֶל הַבַּיִת
  choice: ఆ గృహంలోకి ప్రవేశించే ఎవరైనా
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న కృదంతం సాధారణ నియమాన్ని సూచిస్తున్నందున “ఎవరైనా” అనువైనది. בַּיִת యొక్క ప్రాథమిక అర్థమైన “గృహం”ను ప్రధాన పాఠ్యంలో నిలిపి, దాని సందర్భార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: יוּמָת
  choice: చంపబడాలి
  rationale: హోఫల్ రూపంలోని కర్మణి భావాన్ని నేరుగా నిలుపుతుంది. ఇది కేవలం సహజ మరణాన్ని కాక, ఇతరులచేత మరణింపజేయబడటాన్ని సూచిస్తుంది.
- source_word: וִהְיוּ אֶת הַמֶּלֶךְ
  choice: అతనితో ఉండండి
  rationale: היה + אֶת ఇక్కడ రాజుతో పాటు ఉండి అతనికి రక్షణగా నిలవాలనే ఆదేశాన్ని తెలియజేస్తుంది. “ఉండండి” మూలంలోని సాధారణ సహచర్య భావాన్ని అతిగా విస్తరించకుండా ఉంచుతుంది.
- source_word: בְּבֹאוֹ וּבְצֵאתוֹ
  choice: రాజు లోపలికి వచ్చినప్పుడూ బయటికి వెళ్లినప్పుడూ
  rationale: మూలంలోని సమాంతర జంటను స్పష్టమైన ఆధునిక తెలుగులో నిలిపింది. కర్తపై సందిగ్ధత రాకుండా “రాజు”ను పునరుక్తి చేశాం.
