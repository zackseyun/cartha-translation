  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని వాడాం. హీబ్రూ వాక్యంలోని వరుస సంఘటనలను చిన్న, స్పష్టమైన వాక్యాలుగా ఇచ్చాం; మొదటి పదబంధంలోని నిజమైన అర్థసందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
