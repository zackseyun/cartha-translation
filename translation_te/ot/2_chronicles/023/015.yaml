source:
  edition: WLC
  text: וַ/יָּשִׂ֤ימוּ לָ/הּ֙ יָדַ֔יִם וַ/תָּב֛וֹא אֶל מְב֥וֹא שַֽׁעַר הַ/סּוּסִ֖ים בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יְמִית֖וּ/הָ שָֽׁם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/015.yaml
  text: So they laid hands on her[a], and she went to the entrance of the Horse Gate at the king’s house[b], and they put her to death there.
translation:
  language: te
  text: కాబట్టి వారు ఆమెను పట్టుకున్నారు[a]; ఆమె రాజభవనం దగ్గర ఉన్న గుర్రాల ద్వారం ప్రవేశద్వారం వరకు వెళ్లింది[b], అక్కడ వారు ఆమెను చంపారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వారు ఆమెపై చేతులు ఉంచారు.” “ఆమెకు దారి కల్పించారు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “రాజు ఇంటి దగ్గర ఉన్న గుర్రాల ద్వారం ప్రవేశద్వారం వరకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהּ יָדַיִם
  choice: వారు ఆమెను పట్టుకున్నారు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఆమెపై/ఆమెకొరకు చేతులు ఉంచారు’ అని ఉంటుంది. అరెస్టు చేసి మరణశిక్ష అమలు చేసే ఈ సందర్భంలో ‘పట్టుకున్నారు’ అనేది సహజమైన భావం; అక్షరార్థం మరియు మరో సాధ్యమైన సందర్భార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: מְבוֹא
  choice: ప్రవేశం
  rationale: ద్వారంలోనికి వెళ్లే చోటును లేదా ప్రవేశమార్గాన్ని సూచిస్తుంది; ‘ప్రవేశం వద్దకు’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: שַׁעַר הַסּוּסִים
  choice: గుర్రాల ద్వారం
  rationale: ఇది ఒక నిర్దిష్ట ద్వారనామంగా కనిపిస్తుంది; మూలంలోని బహువచన రూపాన్ని సహజమైన తెలుగులో నిలిపాం.
- source_word: בֵּית הַמֶּלֶךְ
  choice: రాజభవనం దగ్గర ఉన్న
  rationale: అక్షరార్థం ‘రాజు ఇల్లు’; సందర్భంలో ఇది రాజభవనాన్ని సూచిస్తుంది. ద్వార ప్రవేశానికి దాని స్థానసంబంధాన్ని తెలుగులో స్పష్టంగా తెలిపాం.
- source_word: וַיְמִיתוּהָ
  choice: వారు ఆమెను చంపేశారు
  rationale: హిఫీల్ రూపం ‘ఆమె మరణించేలా చేశారు/ఆమెను చంపారు’ అనే భావం ఇస్తుంది. ‘మరణశిక్ష విధించారు’ అనడం న్యాయపరమైన ప్రక్రియను మూలం కంటే ఎక్కువగా నిర్దిష్టం చేస్తుంది.
- source_word: שָׁם
  choice: అక్కడ
  rationale: మూలంలోని సాధారణ స్థానవాచక క్రియావిశేషణానికి నేరమైన, సహజమైన అనువాదం.
