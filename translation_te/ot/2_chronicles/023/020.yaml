source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ/מֵּא֡וֹת וְ/אֶת הָֽ/אַדִּירִים֩ וְ/אֶת הַ/מּֽוֹשְׁלִ֨ים בָּ/עָ֜ם וְ/אֵ֣ת כָּל עַ֣ם הָ/אָ֗רֶץ וַ/יּ֤וֹרֶד אֶת הַ/מֶּ֨לֶךְ֙ מִ/בֵּ֣ית יְהוָ֔ה וַ/יָּבֹ֛אוּ בְּ/תֽוֹךְ שַׁ֥עַר הָֽ/עֶלְי֖וֹן בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יּוֹשִׁ֨יבוּ֙ אֶת הַ/מֶּ֔לֶךְ עַ֖ל כִּסֵּ֥א הַ/מַּמְלָכָֽה־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/020.yaml
  text: Then he took the commanders of hundreds[a], the nobles, the rulers of the people, and all the people of the land, and brought the king down from the house of Yahweh[c][b]. They entered through the upper gate of the king’s house and seated the king on the throne of the kingdom.
translation:
  language: te
  text: అప్పుడు అతడు వందమంది సైనికుల అధిపతులను, ప్రముఖులను[a], ప్రజల పాలకులను, దేశ ప్రజలందరినీ[b] వెంటబెట్టుకొని, రాజును యాహ్వే మందిరం నుండి కిందికి తీసుకొచ్చాడు. వారు రాజభవనంలోని[c] పై ద్వారం గుండా లోపలికి వచ్చి, రాజ్య సింహాసనం మీద రాజును కూర్చోబెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘శక్తిమంతులను.’ ఈ హెబ్రీ పదం గొప్ప హోదా లేదా శక్తి కలిగిన వ్యక్తులను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘దేశ ప్రజలు’ అనేది రాజుల గురించిన కథనాల్లో ప్రజలను ఒక సామాజిక-రాజకీయ సమూహంగా సూచించే సాధారణ హెబ్రీ ప్రయోగం.
    reason: cultural_note
  - marker: c
    text: అక్షరార్థంగా ‘రాజు ఇల్లు.’ అంటే రాజభవనం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: వెంటబెట్టుకొని
  rationale: לקח అనే క్రియకు ప్రాథమికంగా ‘తీసుకొను’ అనే అర్థం ఉన్నా, ఇక్కడ యెహోయాదా ఆయా వర్గాల వారిని తనతో నడిపించాడనే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: వందమంది సైనికుల అధిపతులు
  rationale: హెబ్రీ సైనిక బిరుదులోని ‘వంద’ అనే నిర్మాణాన్ని నిలుపుతూ, ఇది సైనిక నాయకత్వమని ఆధునిక పాఠకునికి స్పష్టం చేస్తుంది.
- source_word: הָאַדִּירִים
  choice: ప్రముఖులు
  rationale: ఈ పదం గొప్ప హోదా లేదా శక్తి కలిగిన వ్యక్తులను సూచించగలదు. రాజసభా-రాజకీయ సందర్భంలో ‘ప్రముఖులు’ సహజంగా ఉంటుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: הַמּוֹשְׁלִים בָּעָם
  choice: ప్రజల పాలకులు
  rationale: ప్రజల మధ్య అధికారాన్ని నిర్వహించేవారనే హెబ్రీ భావాన్ని నేరుగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּל עַם הָאָרֶץ
  choice: దేశ ప్రజలందరూ
  rationale: రాజకీయ కథనాల్లో కనిపించే ‘దేశ ప్రజలు’ అనే సామాజిక-రాజకీయ సమూహార్థాన్ని కాపాడుతుంది; దాన్ని కేవలం ‘సామాన్య ప్రజలు’గా పరిమితం చేయదు.
- source_word: וַיּוֹרֶד אֶת הַמֶּלֶךְ
  choice: రాజును ... కిందికి తీసుకొచ్చాడు
  rationale: ירד యొక్క హిఫీల్ రూపంలో ఉన్న ‘కిందికి వెళ్లేలా చేయడం’ అనే దిశాత్మక భావాన్ని నిలుపుతుంది.
- source_word: מִבֵּית יְהוָה
  choice: యెహోవా మందిరం నుండి
  rationale: בית అనే పదాన్ని ఈ సందర్భంలో సహజంగా ‘మందిరం’గా అనువదించాం; יהוה అనే దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: בְּתוֹךְ שַׁעַר הָעֶלְיוֹן
  choice: పై ద్వారం గుండా లోపలికి
  rationale: ప్రవేశద్వారం మధ్యగా సాగిన కదలికను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בֵּית הַמֶּלֶךְ
  choice: రాజభవనం
  rationale: అక్షరార్థమైన ‘రాజు ఇల్లు’ ఇక్కడ రాజ నివాసమైన రాజభవనాన్ని సూచిస్తుంది; పాదసూచికలో అక్షరార్థాన్ని తెలిపాం.
- source_word: וַיּוֹשִׁיבוּ
  choice: కూర్చోబెట్టారు
  rationale: కారణార్థక క్రియలోని ‘కూర్చునేలా చేశారు’ అనే భావాన్ని పట్టుకొని, పట్టాభిషేక సందర్భానికి సరిపోతుంది.
- source_word: כִּסֵּא הַמַּמְלָכָה
  choice: రాజ్య సింహాసనం
  rationale: ממלכה అనే ‘రాజ్యం/రాజరికం’ నామవాచకాన్ని నిలుపుతూ, తెలుగులో సహజమైన పదబంధంగా ఉంటుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో దైవనామం ప్రత్యక్షంగా ఉన్నందున దానిని సాధారణ బిరుదుతో మార్చకుండా, తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడాం. సైనిక బిరుదు, సామాజిక వర్గాలు, ఆలయం నుండి రాజభవనానికి దిగివెళ్లే దిశ, పట్టాభిషేక భావం స్పష్టంగా ఉండేలా మూలానికి దగ్గరగా సహజీకరించాం.
