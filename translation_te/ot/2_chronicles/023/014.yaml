source:
  edition: WLC
  text: וַ/יּוֹצֵא֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן אֶת שָׂרֵ֥י הַ/מֵּא֣וֹת פְּקוּדֵ֣י הַ/חַ֗יִל וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ הֽוֹצִיא֨וּ/הָ֙ אֶל מִ/בֵּ֣ית הַ/שְּׂדֵר֔וֹת וְ/הַ/בָּ֥א אַחֲרֶ֖י/הָ יוּמַ֣ת בֶּ/חָ֑רֶב כִּ֚י אָמַ֣ר הַ/כֹּהֵ֔ן לֹ֥א תְמִית֖וּ/הָ בֵּ֥ית יְהוָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/014.yaml
  text: Then Jehoiada the priest brought out the commanders of hundreds who were appointed over the army[a], and said to them, “Bring her out between the ranks, and whoever follows after her, let him be put to death with the sword.” For the priest had said, “Do not put her to death in the house of Yahweh.”
translation:
  language: te
  text: 'అప్పుడు యెహోయాదా యాజకుడు సైన్యానికి నియమించబడిన శతాధిపతులను బయటికి తీసుకొచ్చి వారితో ఇలా అన్నాడు: “ఆమెను సైనిక వరుసల మధ్యగా బయటికి తీసుకెళ్లండి[a]. ఆమె వెనుక వచ్చేవారు ఎవరైనా కత్తితో చంపబడాలి.” ఎందుకంటే ఆ యాజకుడు, “యాహ్వే మందిరంలో ఆమెను చంపవద్దు” అని చెప్పాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వరుసల బయటికి.” ఈ హీబ్రూ పదబంధం అర్థం కష్టమైనది; అథల్యాను అమర్చిన సైనిక వరుసల గుండా లేదా వాటి మధ్యగా బయటికి తీసుకెళ్లడాన్ని ఇది సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: బయటికి తీసుకొచ్చి
  rationale: יצא హిఫీల్ రూపంలోని ‘బయటికి వచ్చేలా చేయడం/తీసుకురావడం’ అనే కారణార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: శతాధిపతులను
  rationale: నూరుమందిపై అధికారమున్న సైనిక నాయకుల అధికారిక హోదాను సంక్షిప్తంగా తెలియజేస్తుంది; రోమా సైన్యానికి ప్రత్యేకమైన పదాన్ని దిగుమతి చేయదు.
- source_word: פְּקוּדֵי הַחַיִל
  choice: సైన్యానికి నియమించబడిన
  rationale: פקד పదంలోని నియామక భావాన్ని నిలుపుతుంది; ‘సైన్యంపై’ అని చెప్పి మూలంలో స్పష్టంగా లేని పరిపాలనా సంబంధాన్ని అతిగా నిర్దేశించదు.
- source_word: הוֹצִיאוּהָ
  choice: ఆమెను ... బయటికి తీసుకెళ్లండి
  rationale: స్త్రీలింగ ఏకవచన కర్మప్రత్యయంతో ఉన్న బహువచన ఆజ్ఞను నేరుగా, సహజంగా అందిస్తుంది.
- source_word: אֶל מִבֵּית הַשְּׂדֵרוֹת
  choice: సైనిక వరుసల మధ్యగా
  rationale: కష్టమైన హీబ్రూ పదబంధానికి సందర్భానుకూలమైన భావాన్ని ఇస్తుంది; השדרות ను అమర్చిన సైనిక వరుసలుగా గ్రహిస్తుంది, అయితే అనిశ్చితిని పాదసూచికలో తెలియజేస్తుంది.
- source_word: וְהַבָּא אַחֲרֶיהָ
  choice: ఆమె వెనుక వచ్చేవాడు ఎవడైనా
  rationale: ఆమెను అనుసరించే మద్దతుదారు లేదా వెంట వచ్చేవాడు అనే భాగధాతు భావాన్ని, లింగసూచనతో సహా, నిలుపుతుంది.
- source_word: יוּמַת בֶּחָרֶב
  choice: కత్తితో చంపబడాలి
  rationale: నిష్క్రియ, ఆజ్ఞాత్మక/విధ్యర్థక బలాన్ని స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לֹא תְמִיתוּהָ
  choice: ఆమెను చంపవద్దు
  rationale: מות హిఫీల్‌లోని మరణశిక్ష విధించే భావాన్ని సందర్భంలో సహజమైన, గంభీరమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే మందిరంలో
  rationale: בית ను ఈ సందర్భంలో ‘మందిరం’గా సహజంగా అందిస్తూ, יהוה అనే వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలోని ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- issue: మందిరంలో అథల్యాను చంపకూడదనే ఆజ్ఞ
  choice: ఆజ్ఞను కారణవాక్యంగా యథాతథంగా ఉంచడం
  alternative: మందిర పవిత్రతను కాపాడటానికే అని వివరణను పాఠ్యంలో చేర్చడం
  rationale: మూలపాఠం కారణాన్ని మరింతగా వివరించదు; కాబట్టి సాధ్యమైన పవిత్రస్థల సంబంధిత ఉద్దేశాన్ని పాఠ్యంలో దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన కథనశైలి ఉపయోగించబడింది. సైనిక హోదాకు ‘శతాధిపతులు,’ దేవాలయానికి ‘మందిరం,’ దైవనామానికి ‘యాహ్వే’ వాడబడ్డాయి. కష్టమైన స్థలసూచక పదబంధాన్ని ప్రధాన పాఠ్యంలో చదవదగిన రీతిగా ఇచ్చి, దాని నిజమైన అనిశ్చితిని పాదసూచికలో నిలుపుకున్నాం.
