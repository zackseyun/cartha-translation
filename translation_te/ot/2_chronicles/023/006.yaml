  terminology: ‘యహ్వే,’ ‘మందిరం,’ ‘యాజకులు,’ ‘లేవీయులు,’ ‘పవిత్రులు’ అనే పదాలు స్థిరంగా, సందర్భానుగుణంగా ఉన్నాయి. ‘పవిత్రులు’ను నైతిక పాపరాహిత్యంగా కాక ఆరాధనా సేవకోసం ప్రత్యేకించబడిన స్థితిగా పాదసూచిక వివరించడం సముచితం. మందిరం అనే సందర్భార్థానికి అక్షరార్థమైన ‘యహ్వే ఇల్లు’ను పాదసూచికలో ఉంచడం కూడా సరైనది.
