id: 2CH.23.6
reference: 2 Chronicles 23:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַל יָב֣וֹא בֵית יְהוָ֗ה כִּ֤י אִם הַ/כֹּֽהֲנִים֙ וְ/הַ/מְשָׁרְתִ֣ים לַ/לְוִיִּ֔ם הֵ֥מָּה יָבֹ֖אוּ כִּי קֹ֣דֶשׁ הֵ֑מָּה וְ/כָל הָ/עָ֔ם יִשְׁמְר֖וּ מִשְׁמֶ֥רֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/006.yaml
  text: And let no one enter the house of Yahweh except the priests and the ministering Levites[a]; they may enter, because they are holy[b]. And let all the people keep the charge of Yahweh.
translation:
  language: te
  text: యహ్వే మందిరంలోకి[a] యాజకులు, సేవచేసే లేవీయులు తప్ప మరెవరూ ప్రవేశించకూడదు. వారు పవిత్రులు[b] కాబట్టి ప్రవేశించవచ్చు. ప్రజలందరూ యహ్వే అప్పగించిన బాధ్యతను నిర్వర్తించాలి.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థం: ‘యహ్వే ఇంట్లోకి.’ ఇక్కడ అది యహ్వే మందిరాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘పవిత్రులు’ అంటే యహ్వే సేవకోసం ప్రత్యేకించబడినవారు లేదా ప్రతిష్ఠించబడినవారు.
    reason: contextual_clarification
  - marker: c
    text: దీనిని ‘యహ్వే కోసం కాపలా కాయాలి’ లేదా ‘యహ్వే ఆదేశించిన కర్తవ్యాన్ని పాటించాలి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל יָבוֹא
  choice: మరెవరూ ప్రవేశించకూడదు
  rationale: אַל‌తో కూడిన క్రియ నిషేధాన్ని వ్యక్తం చేస్తుంది. తెలుగులో ‘ప్రవేశించకూడదు’ ఆ నిర్దేశక బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בֵית יְהוָה
  choice: యహ్వే మందిరం
  rationale: హీబ్రూలో అక్షరార్థంగా ‘యహ్వే ఇల్లు.’ ఈ సందర్భంలో అది దేవాలయాన్ని సూచిస్తున్నందున ‘మందిరం’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన నాలుగు అక్షరాల పేరును బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యనుకరణగా ఇచ్చాం.
- source_word: כִּי אִם
  choice: తప్ప
  rationale: ముందున్న నిషేధానికి మినహాయింపును సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: ఆరాధనా సందర్భంలోని כהניםకు ప్రామాణికమైన తెలుగు పదం.
- source_word: וְהַמְשָׁרְתִים לַלְוִיִּם
  choice: సేవచేసే లేవీయులు
  rationale: మందిర సేవలో నిమగ్నమైన లేవీయులను సూచించే వర్తమాన కృదంత భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הֵמָּה יָבֹאוּ
  choice: వారు ... ప్రవేశించవచ్చు
  rationale: ముందటి మినహాయింపు తరువాత వారికి ఉన్న ప్రవేశ అనుమతిని సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: כִּי קֹדֶשׁ הֵמָּה
  choice: వారు పవిత్రులు కాబట్టి
  rationale: קדש అనే మూలపదంలోని పవిత్రత భావాన్ని నిలుపుతూ, ఇక్కడి ఆరాధనా సంబంధమైన ప్రత్యేక స్థితిని పాదసూచిక వివరిస్తుంది.
- source_word: וְכָל הָעָם
  choice: ప్రజలందరూ
  rationale: సమస్త ప్రజాసమూహాన్ని సూచించే సమష్టి భావాన్ని సహజమైన తెలుగులో ఇస్తుంది.
- source_word: יִשְׁמְרוּ מִשְׁמֶרֶת יְהוָה
  choice: యహ్వే అప్పగించిన బాధ్యతను నిర్వర్తించాలి
  rationale: שמר משמרת అనే సమానమూల నిర్మాణం అప్పగించిన కర్తవ్యాన్ని పాటించడం లేదా కాపలా బాధ్యతను నిర్వహించడం అనే భావాలను కలిగి ఉంది. ప్రధాన పాఠం విస్తృతమైన కర్తవ్య భావాన్ని ఇస్తూ, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
theological_decisions:
- issue: యాజకులు, లేవీయుల పవిత్ర స్థితి
  choice: ‘పవిత్రులు’ అని అనువదించి, ఇది దేవుని సేవకోసం ప్రత్యేకించబడిన ఆరాధనా స్థితిని సూచిస్తుందని పాదసూచికలో తెలిపాం.
  alternative: ‘ప్రతిష్ఠించబడినవారు’ లేదా ‘ప్రత్యేకించబడినవారు’
  rationale: మూలంలోని קדש అనే ప్రధాన బైబిలు భావాన్ని కాపాడుతూ, దాన్ని నైతిక పాపరాహిత్యంగా అపార్థం చేసుకోకుండా సందర్భాన్ని స్పష్టం చేస్తుంది.
- issue: దైవనామం
  choice: יְהוָהను ‘యహ్వే’గా ఇచ్చాం.
  alternative: ‘ప్రభువు’ లేదా ‘యెహోవా’
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధ్యమైన ఉచ్చారణకు దగ్గరైన తెలుగు రూపాన్ని ఉపయోగిస్తుంది.
- issue: מִשְׁמֶרֶת יְהוָהలో సంబంధ భావం
  choice: ‘యహ్వే అప్పగించిన బాధ్యత’
  alternative: ‘యహ్వే కోసం కాపలా’ లేదా ‘యహ్వే ఆజ్ఞను పాటించడం’
  rationale: హీబ్రూ పదబంధం కర్తవ్యం, కాపలా, ఆదేశపాలన అనే పరస్పర సంబంధిత భావాలకు అవకాశం ఇస్తుంది. ప్రధాన పాఠం ఒకే సంకుచిత అర్థానికి పరిమితం కాకుండా విస్తృత బాధ్యత భావాన్ని ఇస్తుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ఆరాధనా పదజాలానికి ‘మందిరం,’ ‘యాజకులు,’ ‘పవిత్రులు’ వంటి సాధారణంగా అర్థమయ్యే పదాలను ఎంచుకున్నాం. మూలంలోని కర్తవ్యం/కాపలా అనే అర్థసంభావ్యతను పాదసూచికలో కాపాడాం.
