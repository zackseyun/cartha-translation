  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתֵּן֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן לְ/שָׂרֵ֣י הַ/מֵּא֗וֹת אֶת הַֽ/חֲנִיתִים֙ וְ/אֶת הַ/מָּגִנּוֹת֙ וְ/אֶת הַ/שְּׁלָטִ֔ים אֲשֶׁ֖ר לַ/מֶּ֣לֶךְ דָּוִ֑יד אֲשֶׁ֖ר בֵּ֥ית הָ/אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/009.yaml
  text: Then Jehoiada the priest gave to the commanders of hundreds the spears[a], the shields, and the large shields that belonged to King David[c][b], which were in the house of God.
translation:
  language: te
  text: అప్పుడు యాజకుడైన యెహోయాదా, వందమంది సైనికుల దళాధిపతులకు[a] దేవుని మందిరంలో[c] ఉన్న రాజు దావీదుకు చెందిన ఈటెలను, డాళ్లను, పెద్ద డాళ్లను[b] ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘వందల అధిపతులు.’ వీరు వందమంది చొప్పున ఉన్న సైనిక దళాల మీద నియమించబడిన అధికారులు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ హీబ్రూ పాఠం ‘డాళ్లు’ అనే పదానికి భిన్నమైన మరో రక్షణ వస్తువును సూచిస్తుంది; దాన్ని ఇక్కడ ‘పెద్ద డాళ్లు’ అని అనువదించారు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘దేవుని ఇల్లు’; ఇది దేవాలయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ఇచ్చాడు
  rationale: נתן అనే సాధారణ క్రియలోని వస్తువులను అప్పగించే భావాన్ని సహజమైన తెలుగు కథన శైలిలో నేరుగా తెలియజేస్తుంది.
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: యాజకుడైన యెహోయాదా
  rationale: వ్యక్తినామాన్ని తెలుగు లిపిలో ధ్వన్యనువాదం చేసి, అతని బిరుదును సహజమైన అన్వయంతో అందిస్తుంది.
- source_word: לְשָׂרֵי הַמֵּאוֹת
  choice: వందమంది సైనికుల దళాధిపతులకు
  rationale: ‘వందల అధిపతులు’ అనే హీబ్రూ సైనిక పదబంధ భావాన్ని స్పష్టంగా తెలియజేస్తూ, రోమా సైన్యానికి ప్రత్యేకమైన పదాన్ని దిగుమతి చేయదు.
- source_word: הַחֲנִיתִים
  choice: ఈటెలను
  rationale: חניתים సూచించే పొడిచే ఆయుధాలకు ఆధునిక తెలుగులో స్పష్టమైన, సాధారణ పదం.
- source_word: הַמָּגִנּוֹת
  choice: డాళ్లను
  rationale: מגנים అనే సాధారణ రక్షణ ఆయుధ పదానికి సహజమైన తెలుగు సమానం.
- source_word: הַשְּׁלָטִים
  choice: పెద్ద డాళ్లను
  rationale: ముందున్న מגנים కంటే భిన్నమైన మరో రకపు రక్షణ వస్తువును సూచించే అవకాశాన్ని నిలుపుతూ, సందర్భానికి తగిన ప్రధాన అర్థాన్ని అందిస్తుంది.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִיד
  choice: రాజు దావీదుకు చెందిన
  rationale: హీబ్రూ సంబంధవాచక స్వామ్య నిర్మాణాన్ని అనవసరమైన పూర్వకాల భావం జోడించకుండా నేరుగా అందిస్తుంది.
- source_word: בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరం
  rationale: అక్షరార్థంగా ‘దేవుని ఇల్లు’ అయిన ఈ పదబంధం సందర్భంలో దేవాలయాన్ని సూచిస్తుంది; ‘మందిరం’ సాధారణ పాఠకునికి సహజంగా ఆ స్థలాన్ని తెలియజేస్తుంది, అక్షరార్థం పాదసూచికలో నిలుపబడింది.
