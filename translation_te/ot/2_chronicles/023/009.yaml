translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. సైనిక హోదాను సాధారణ పాఠకునికి స్పష్టంగా విప్పి చెప్పి, రెండు వేర్వేరు హీబ్రూ డాలు-పదాల మధ్య తేడాను ప్రధాన పాఠంలో నిలుపుకున్నాం.
