base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/010.yaml
  text: And he stationed all the people, each man with his weapon in his hand, from the south side of the house to the north side of the house, by the altar and by the house, around the king.
translation:
  language: te
  text: అతడు ప్రజలందరినీ, ప్రతి ఒక్కరూ తమ ఆయుధాన్ని చేతిలో పట్టుకొని, మందిరపు దక్షిణ వైపు నుండి మందిరపు ఉత్తర వైపు వరకు, బలిపీఠం దగ్గర, మందిరం దగ్గర, రాజు చుట్టూ నిలబెట్టాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: నిలబెట్టాడు
  rationale: హిఫిల్ రూపం ప్రజలను నిర్దిష్ట స్థానాల్లో మోహరింపజేయడం లేదా నిలబెట్టడం అనే కారణార్థాన్ని తెలియజేస్తుంది.
- source_word: שִׁלְחוֹ
  choice: వారి ఆయుధం
  rationale: ఈ సందర్భంలో שֶׁלַח అనేది చేతిలో పట్టుకునే ఆయుధాన్ని సూచిస్తుంది; తెలుగు వాక్యంలో సహజంగా ఉండేందుకు ‘ఆయుధం’ అని అనువదించబడింది.
- source_word: כֶּתֶף הַבַּיִת הַיְמָנִית ... כֶּתֶף הַבַּיִת הַשְּׂמָאלִית
  choice: మందిరపు దక్షిణ వైపు ... మందిరపు ఉత్తర వైపు
  rationale: అక్షరార్థంగా ‘కుడి వైపు ... ఎడమ వైపు’; తూర్పు ముఖంగా దిశలను చెప్పే హీబ్రూ పద్ధతిలో ఇవి దక్షిణం, ఉత్తరం సూచిస్తాయి. సందర్భానికి స్పష్టమైన దిశా పదాలు ఎంచుకోబడ్డాయి.
- source_word: הַבַּיִת
  choice: మందిరం
  rationale: ఇక్కడ ‘ఇల్లు’ అనేది యెహోవా మందిరాన్ని సూచిస్తున్నందున ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా ‘మందిరం’ అని ఇచ్చాం.
- source_word: עַל הַמֶּלֶךְ סָבִיב
  choice: రాజు చుట్టూ
  rationale: עַל మరియు סָבִיב కలయిక రాజును చుట్టుముట్టి కాపలా నిలిచిన స్థానాన్ని సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి పాటించబడింది. మూలంలోని స్థలవివరణ క్రమాన్ని సాధ్యమైనంతవరకు నిలిపి, ‘కుడి/ఎడమ’ అనే ప్రాచీన దిశా ప్రయోగాన్ని సందర్భానుసారంగా ‘దక్షిణ/ఉత్తర’గా స్పష్టం చేశాం.
