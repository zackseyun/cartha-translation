  text: When Athaliah heard the noise of the people running and praising the king, she came to the people at the house of the LORD.
translation:
  language: te
  text: అతల్యా, రాజును స్తుతిస్తూ పరుగెత్తుతున్న ప్రజల శబ్దం విని, యెహోవా మందిరంలో ఉన్న ప్రజల దగ్గరకు వచ్చింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קול
  choice: శబ్దం
  rationale: ఇక్కడ ప్రజలు పరుగెత్తుతూ స్తుతిస్తున్నప్పుడు వినిపించిన సమగ్ర ధ్వనిని సహజంగా సూచిస్తుంది.
- source_word: הרצים
  choice: పరుగెత్తుతున్న
  rationale: హీబ్రూ క్రియారూపంలోని ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది; ఈ చర్యకు వేరే వివరణను చేర్చదు.
- source_word: מהללים
  choice: స్తుతిస్తూ
  rationale: הלל పదానికి తగిన సాధారణ అర్థమైన స్తుతించడాన్ని తెలియజేస్తుంది.
- source_word: בית יהוה
  choice: యెహోవా మందిరంలో
  rationale: దైవనామాన్ని వ్యక్తినామంగా ఉంచి, సందర్భంలో ‘మందిరం’ అనే సహజ తెలుగు పదాన్ని వాడుతుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా స్పష్టంగా ప్రతిబింబిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. మూలంలోని చర్యల క్రమం మరియు ‘రాజును’ అనే కర్మసంబంధాన్ని నిలిపి ఉంచింది.
