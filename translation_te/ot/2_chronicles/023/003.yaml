id: 2CH.23.3
reference: 2 Chronicles 23:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּכְרֹ֨ת כָּל הַ/קָּהָ֥ל בְּרִ֛ית בְּ/בֵ֥ית הָ/אֱלֹהִ֖ים עִם הַ/מֶּ֑לֶךְ וַ/יֹּ֣אמֶר לָ/הֶ֗ם הִנֵּ֤ה בֶן הַ/מֶּ֨לֶךְ֙ יִמְלֹ֔ךְ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה עַל בְּנֵ֥י דָוִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/003.yaml
  text: And all the assembly made a covenant in the house of God with the king, and he said to them, “Look, the king’s son will reign, just as the LORD spoke concerning the sons of David.”
translation:
  language: te
  text: 'సమస్త సమాజం దేవుని మందిరంలో రాజుతో నిబంధన చేసుకుంది. యెహోయాదా వారితో ఇలా అన్నాడు: “ఇదిగో, రాజు కుమారుడు రాజ్యమేలుతాడు, దావీదు కుమారుల గురించి యెహోవా చెప్పినట్టే.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָל הַקָּהָל
  choice: సమాజమంతా
  rationale: సమకూడిన ప్రజల సమూహమంతటినీ సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: בְּרִית
  choice: నిబంధన
  rationale: పరస్పర బద్ధతగల covenant భావాన్ని నిలుపుతుంది; సాధారణ ఒప్పందం కంటే బైబిలు సందర్భానికి తగిన పదం.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే హీబ్రూ ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: בֶן הַמֶּלֶךְ
  choice: రాజ కుమారుడు
  rationale: రాజుకు చెందిన కుమారుడు అనే నిర్దిష్ట వంశపారంపర్య భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יִמְלֹךְ
  choice: రాజ్యమేలుతాడు
  rationale: రాజుగా పరిపాలించడం అనే క్రియార్థాన్ని గౌరవప్రదమైన ప్రామాణిక తెలుగులో అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామంలోని నాలుగు అక్షరాల ప్రత్యేక నామాన్ని బిరుదుగా మార్చకుండా తెలుగు బైబిలు వాడుకలో పరిచితమైన రూపంలో సూచిస్తుంది.
- source_word: עַל בְּנֵי דָוִיד
  choice: దావీదు కుమారుల గురించి
  rationale: עַל యొక్క సందర్భార్థాన్ని ‘గురించి’గా, బహువచనమైన ‘కుమారులు’ను అలాగే నిలుపుతుంది.
theological_decisions:
- issue: ‘రాజుతో’ అనే పదబంధంలో రాజు ఎవరు?
  choice: ప్రధాన పాఠంలో ‘రాజుతో’ అని యథాతథంగా ఉంచి, తరువాతి వక్తను సందర్భానుసారం ‘యెహోయాదా’గా పేర్కొనడం
  alternative: ‘యోవాషుతో’ అని రాజును నేరుగా గుర్తించడం లేదా ‘రాజు వారితో అన్నాడు’ అని అనువదించడం
  rationale: హీబ్రూ పాఠం నిబంధన రాజుతో జరిగిందని చెబుతుంది; అయితే וַיֹּאמֶר లోని కర్త సమీప సందర్భం ప్రకారం యెహోయాదా. వక్తను రాజుగా చూపితే సందర్భార్థం మారుతుంది.
- issue: దావీదు వంశానికి సంబంధించిన వాగ్దానం
  choice: ‘దావీదు కుమారుల గురించి యెహోవా చెప్పినట్టే’
  alternative: ‘దావీదు సంతానం గురించి యెహోవా వాగ్దానం చేసినట్టే’
  rationale: మూలంలోని ‘చెప్పాడు’ మరియు ‘కుమారులు’ అనే పదాలను నిలుపుతూ, దానిని మరింత నిర్దిష్టమైన సిద్ధాంతపరమైన ‘వాగ్దానం’గా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సామాన్య పాఠకులకు సులభంగా ఉండే వాక్య నిర్మాణం. మూలంలోని దీర్ఘ సంయుక్త వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం. ముందరి సందర్భం వక్తను యెహోయాదాగా గుర్తిస్తున్నందున అస్పష్ట సర్వనామం స్థానంలో అతని పేరును వాడాం.
