- from: '“మీరు చేయవలసింది ఇదే: విశ్రాంతిదినాన విధికి వచ్చే మీలో మూడవ వంతు మంది—యాజకులు, లేవీయులు—ద్వారాల గడపల దగ్గర కాపలా ఉండాలి.[a]”'
  to: '“మీరు చేయవలసింది ఇదే: విశ్రాంతిదినాన వచ్చే మీలో మూడవ వంతు మంది—యాజకులు, లేవీయులు—గడపల కాపలాదారులుగా ఉండాలి.[a]”'
  rationale: The revision retains the source's compact syntax and ambiguity regarding the relationship of the priests and Levites to the incoming group, while restoring the explicit gatekeeper role in the main text. It avoids making the contextual inference of Sabbath service-duty explicit. The footnote supplies the action-oriented alternative without displacing the lexical role designation from the translation.
