  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘విశ్రాంతిదినం,’ ‘యాజకులు,’ ‘లేవీయులు’ వంటి స్థిరమైన బైబిలు పదజాలం ఉంచబడింది.
