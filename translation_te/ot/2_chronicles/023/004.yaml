review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the directive, the one-third allocation, Sabbath entrants, and the priestly-Levitical group. However, the main rendering "ద్వారాల గడపల దగ్గర కాపలా ఉండాలి" turns the Hebrew noun "gatekeepers" into the more general verbal idea "keep guard," and "విధికి" adds an explicit duty/shift nuance that is contextually plausible but not stated in this verse.
  naturalness: The Telugu is generally clear and modern. "గడపల కాపలాదారులుగా" is both natural and more directly corresponds to the Hebrew role designation. Removing "విధికి" also yields a cleaner, less interpretive sentence.
  terminology: '"విశ్రాంతిదినం," "యాజకులు," and "లేవీయులు" are appropriate standard biblical terminology. Rendering שֹׁעֲרֵי as "కాపలాదారులు" preserves the occupational designation; "గడపలు" adequately renders הַסִּפִּים.'
  issues:
  - severity: medium
    issue: The main text does not explicitly render the Hebrew designation "gatekeepers."
    rationale: '"కాపలా ఉండాలి" describes an action, whereas שֹׁעֲרֵי identifies those assigned as gatekeepers/doorkeepers. The designation should be retained in the main translation.'
  - severity: low
    issue: '"విధికి" is an added contextual clarification.'
    rationale: Those entering on the Sabbath likely are arriving for assigned service, but the verse itself says only "those coming/entering on the Sabbath." Omitting the added word better preserves the source wording.
  revised_text: '“మీరు చేయవలసింది ఇదే: విశ్రాంతిదినాన వచ్చే మీలో మూడవ వంతు మంది—యాజకులు, లేవీయులు—గడపల కాపలాదారులుగా ఉండాలి.[a]”'
