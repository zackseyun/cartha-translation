id: 2CH.23.4
reference: 2 Chronicles 23:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: זֶ֥ה הַ/דָּבָ֖ר אֲשֶׁ֣ר תַּעֲשׂ֑וּ הַ/שְּׁלִשִׁ֨ית מִ/כֶּ֜ם בָּאֵ֣י הַ/שַּׁבָּ֗ת לַ/כֹּֽהֲנִים֙ וְ/לַ/לְוִיִּ֔ם לְ/שֹֽׁעֲרֵ֖י הַ/סִּפִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/004.yaml
  text: 'This is what you shall do: one third of you who come in on the Sabbath[a], of the priests and of the Levites, shall be gatekeepers of the thresholds.'
translation:
  language: te
  text: '“మీరు చేయవలసింది ఇదే: విశ్రాంతిదినాన వచ్చే మీలో మూడవ వంతు మంది—యాజకులు, లేవీయులు—గడపల కాపలాదారులుగా ఉండాలి.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరొక అనువాదం: “గడపల దగ్గర కాపలా ఉండాలి.” హీబ్రూ పదబంధంలో ‘ద్వారపాలకులు/కాపలాదారులు’ మరియు ‘గడపలు’ అనే భావాలు కలిసి, ప్రవేశస్థలాలను కాపాడే బాధ్యతను సూచిస్తాయి.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּ
  choice: మీరు చేయవలసింది ఇదే
  rationale: హీబ్రూ ఆదేశాత్మక పరిచయ సూత్రాన్ని ఆధునిక, సహజమైన తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: הַשְּׁלִשִׁית מִכֶּם
  choice: మీలో మూడవ వంతు మంది
  rationale: సంబోధించబడిన సమూహంలో ఒక మూడవ భాగాన్ని సూచించే విభాజక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בָּאֵי הַשַּׁבָּת
  choice: విశ్రాంతిదినాన విధికి వచ్చే
  rationale: పదశః ‘విశ్రాంతిదినాన వచ్చేవారు’; సందర్భంలో ఆలయ సేవా వంతుకు ప్రవేశించడాన్ని సూచిస్తుందని ‘విధికి’తో సంక్షిప్తంగా స్పష్టం చేయబడింది.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: యాజకులు, లేవీయులు
  rationale: విశ్రాంతిదినాన విధికి వచ్చే సమూహాన్ని ఈ రెండు వర్గాలు వివరిస్తున్న అన్వయాన్ని డాష్‌ల మధ్య ఉంచి, హీబ్రూ వాక్య నిర్మాణాన్ని అతిగా నిర్ణయించకుండా తెలుగులో చదవదగిన రీతిగా ఇచ్చింది.
- source_word: לְשֹׁעֲרֵי הַסִּפִּים
  choice: ద్వారాల గడపల దగ్గర కాపలా ఉండాలి
  rationale: שֹׁעֲרֵי లోని ద్వారపాలకత్వ భావాన్నీ, הַסִּפִּים లోని గడపలు/ద్వార ప్రవేశాల భావాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
