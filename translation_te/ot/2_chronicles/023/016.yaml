source:
  edition: WLC
  text: וַ/יִּכְרֹ֤ת יְהוֹיָדָע֙ בְּרִ֔ית בֵּינ֕/וֹ וּ/בֵ֥ין כָּל הָ/עָ֖ם וּ/בֵ֣ין הַ/מֶּ֑לֶךְ לִ/הְי֥וֹת לְ/עָ֖ם לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/016.yaml
  text: Then Jehoiada made a covenant between himself[a], all the people, and the king[c][b], that they should be Yahweh's people.
translation:
  language: te
  text: అప్పుడు యెహోయాదా తనకూ, ప్రజలందరికీ, రాజుకూ మధ్య ఒక నిబంధన చేశాడు[a]—వారు యహ్వే ప్రజలుగా ఉండాలని.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ నుడికారంలో అక్షరార్థంగా, “ఒక నిబంధన కోశాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: ఒక నిబంధన చేశాడు
  rationale: ‘నిబంధన కోశాడు’ అనే హీబ్రూ నుడికారానికి సహజమైన ఆధునిక తెలుగు సమానార్థక వ్యక్తీకరణ; వావ్-కన్సిక్యూటివ్ కథన క్రమాన్ని ‘అప్పుడు’ తెలియజేస్తుంది.
- source_word: בֵּינוֹ וּבֵין כָּל הָעָם וּבֵין הַמֶּלֶךְ
  choice: తనకూ, ప్రజలందరికీ, రాజుకూ మధ్య
  rationale: యెహోయాదా, ప్రజలందరూ, రాజు అనే మూడు పక్షాలనూ మూలపాఠంలో ఉన్నట్లే వేరువేరుగా ఉంచుతుంది; ‘దేశ ప్రజలందరూ’ అనే మూలంలో లేని విస్తరణను చేర్చదు.
- source_word: לִהְיוֹת לְעָם לַיהוָה
  choice: వారు యహ్వే ప్రజలుగా ఉండాలని
  rationale: నిబంధన ఉద్దేశాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, వారు యహ్వేకు చెందిన ప్రజలనే నిబంధనాత్మక భావాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ నాలుగు అక్షరాల నామానికి సాధారణ పండిత పునర్నిర్మాణాన్ని తెలుగులో లిప్యంతరీకరించింది.
theological_decisions:
- issue: నిబంధనలోని పక్షాలు
  choice: యెహోయాదా, ప్రజలందరూ, రాజు—ఈ ముగ్గురినీ నిబంధన పక్షాలుగా చూపించడం
  alternative: యహ్వే ఒక పక్షంగా, ప్రజలు మరియు రాజు మరో పక్షంగా చూపించడం
  rationale: హీబ్రూ వాక్యం ‘అతనికి మధ్య, ప్రజలందరికీ మధ్య, రాజుకు మధ్య’ అని మూడు మానవ పక్షాలను స్పష్టంగా పేర్కొంటుంది; యహ్వేను నిబంధన పక్షంగా కాక, వారు ఎవరి ప్రజలుగా ఉండాలో తెలిపే ఉద్దేశ వాక్యంలో పేర్కొంటుంది.
- issue: לְעָם לַיהוָה అనే నిబంధనాత్మక ప్రయోగం
  choice: వారు యహ్వే ప్రజలుగా ఉండాలని
  alternative: వారు యహ్వే కోసం ఒక ప్రజగా ఉండాలని
  rationale: ప్రధాన పాఠం చెందినతనం, విధేయత అనే నిబంధనాత్మక భావాన్ని సహజమైన తెలుగులో ఇస్తుంది; కృత్రిమంగా వినిపించే అక్షరానువాదాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు స్పష్టమైన శైలి. మూడు నిబంధన పక్షాల నిర్మాణాన్ని కొంత అధికారికంగా ఉంచి మూలపాఠపు సంబంధాన్ని కాపాడింది; ఉద్దేశ వాక్యాన్ని డాష్‌తో స్పష్టపరిచింది.
