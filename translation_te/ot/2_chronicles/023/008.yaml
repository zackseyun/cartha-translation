source:
  edition: WLC
  text: וַ/יַּעֲשׂ֨וּ הַ/לְוִיִּ֜ם וְ/כָל יְהוּדָ֗ה כְּ/כֹ֣ל אֲשֶׁר צִוָּה֮ יְהוֹיָדָ֣ע הַ/כֹּהֵן֒ וַ/יִּקְחוּ֙ אִ֣ישׁ אֶת אֲנָשָׁ֔י/ו בָּאֵ֣י הַ/שַּׁבָּ֔ת עִ֖ם יוֹצְאֵ֣י הַ/שַּׁבָּ֑ת כִּ֣י לֹ֥א פָטַ֛ר יְהוֹיָדָ֥ע הַ/כֹּהֵ֖ן אֶת הַֽ/מַּחְלְקֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/008.yaml
  text: So the Levites and all Judah did according to all that Jehoiada the priest had commanded[a], and each man took his men, those coming in on the Sabbath together with those going out on the Sabbath, for Jehoiada the priest had not dismissed the divisions.
translation:
  language: te
  text: లేవీయులూ, యూదావారందరూ యెహోయాదా యాజకుడు ఆజ్ఞాపించినదంతా చేశారు. ప్రతివాడూ సబ్బాతు దినాన వచ్చేవారినీ, సబ్బాతు దినాన వెళ్లేవారినీ కలిపి తన మనుష్యులను తీసుకున్నాడు; ఎందుకంటే యెహోయాదా యాజకుడు విభాగాలను[a] విడుదల చేయలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వంతులు” లేదా “పాళీలు.” నిర్ణీత క్రమం ప్రకారం మారే సేవా బృందాలను సూచిస్తుంది.
    reason: హెబ్రీ הַמַּחְלְקוֹת పదానికి ‘విభాగాలు’ ప్రధాన అనువాదం; సందర్భంలో నిర్ణీత క్రమంలో వచ్చే-వెళ్లే బృందాల భావాన్ని చూపడానికి ప్రత్యామ్నాయాలు ఇవ్వబడ్డాయి.
lexical_decisions:
- source_word: וַיַּעֲשׂוּ הַלְוִיִּם וְכָל יְהוּדָה
  choice: లేవీయులూ, యూదావారందరూ ... చేశారు
  rationale: עשה అనే సాధారణ క్రియను సహజమైన ‘చేశారు’గా అనువదించాం. ‘యూదా’ ఇక్కడ సమూహార్థకంగా ప్రజలను సూచిస్తున్నందున ఆధునిక తెలుగులో స్పష్టత కోసం ‘యూదావారందరూ’ అని ఇచ్చాం.
- source_word: כְּכֹל אֲשֶׁר צִוָּה יְהוֹיָדָע הַכֹּהֵן
  choice: యెహోయాదా యాజకుడు ఆజ్ఞాపించినదంతా
  rationale: כְּכֹל אֲשֶׁר సూచించే సంపూర్ణ విధేయతను ‘ఆజ్ఞాపించినదంతా’ నిలుపుతుంది; పేరు, బిరుదు మూలంలోని క్రమంలోనే ఉన్నాయి.
- source_word: וַיִּקְחוּ אִישׁ אֶת אֲנָשָׁיו
  choice: ప్రతి నాయకుడు తన మనుషులను ... తనతో ఉంచుకున్నాడు
  rationale: אִישׁ పంపిణీ అర్థంలో ‘ప్రతి వ్యక్తి’; సందర్భంలో తమ తమ మనుషులకు బాధ్యులైన నాయకులు ఉద్దేశించబడ్డారు. לקח యొక్క ప్రాథమిక ‘తీసుకున్నాడు’ ఈ తెలుగులో అసహజంగా ఉండటంతో, వారిని పంపకుండా తమతోనే ఉంచుకున్న భావాన్ని సహజంగా తెలిపాం.
- source_word: בָּאֵי הַשַּׁבָּת עִם יוֹצְאֵי הַשַּׁבָּת
  choice: విశ్రాంతి దినాన విధికి వచ్చేవారినీ, విశ్రాంతి దినాన విధి ముగించుకొని వెళ్లేవారినీ
  rationale: వచ్చే, వెళ్లే రెండు బృందాల సమాంతరతను నిలిపి, అవి వారపు సేవా విధులకు సంబంధించిన రాకపోకలని ‘విధికి’, ‘విధి ముగించుకొని’ ద్వారా స్పష్టం చేశాం.
- source_word: כִּי לֹא פָטַר
  choice: ఎందుకంటే ... వెళ్లనివ్వలేదు
  rationale: כִּי కారణాన్ని పరిచయం చేస్తుంది; פטר ఇక్కడ విధి ముగిసిన వారిని విడుదల చేసి పంపడం. ‘వెళ్లనివ్వలేదు’ సాధారణ పాఠకునికి సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: הַמַּחְלְקוֹת
  choice: సేవా విభాగాలను
  rationale: ఈ పదం క్రమబద్ధంగా ఏర్పాటైన యాజక, లేవీయ సేవా బృందాలను సూచిస్తుంది. ‘విభాగాలు’ మూలానికి దగ్గరగా ఉండగా, ‘సేవా’ సందర్భాన్ని స్పష్టం చేస్తుంది.
