translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘సబ్బాతు’ అనే లిప్యంతరీకరణకు బదులు సాధారణ అర్థాన్ని నేరుగా తెలిపే ‘విశ్రాంతి దినం’ వాడాం. మూలంలోని రెండు వాక్యభాగాల కారణ సంబంధాన్ని నిలిపాం.
