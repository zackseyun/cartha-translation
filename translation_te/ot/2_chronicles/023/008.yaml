  to: లేవీయులూ, యూదావారందరూ యెహోయాదా యాజకుడు ఆజ్ఞాపించినదంతా చేశారు. ప్రతివాడూ సబ్బాతు దినాన వచ్చేవారినీ, సబ్బాతు దినాన వెళ్లేవారినీ కలిపి తన మనుష్యులను తీసుకున్నాడు; ఎందుకంటే యెహోయాదా యాజకుడు విభాగాలను[a] విడుదల చేయలేదు.
