source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֨ה הַ/שְּׁבִעִ֜ית הִתְחַזַּ֣ק יְהוֹיָדָ֗ע וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ/מֵּא֡וֹת לַ/עֲזַרְיָ֣הוּ בֶן יְרֹחָ֡ם וּ/לְ/יִשְׁמָעֵ֣אל בֶּן יְ֠הוֹחָנָן וְ/לַֽ/עֲזַרְיָ֨הוּ בֶן עוֹבֵ֜ד וְ/אֶת מַעֲשֵׂיָ֧הוּ בֶן עֲדָיָ֛הוּ וְ/אֶת אֱלִישָׁפָ֥ט בֶּן זִכְרִ֖י עִמּ֥/וֹ בַ/בְּרִֽית־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/001.yaml
  text: 'In the seventh year Jehoiada strengthened himself and took the commanders of hundreds into covenant with him: Azariah son of Jeroham[a], Ishmael son of Jehohanan, Azariah son of Obed, Maaseiah son of Adaiah, and Elishaphat son of Zichri.'
translation:
  language: te
  text: ఏడవ సంవత్సరంలో యెహోయాదా ధైర్యం తెచ్చుకొని, నూరుమందికి అధిపతులైన యెరోహాము కుమారుడు అజర్యా, యెహోహానాను కుమారుడు ఇష్మాయేలు, ఓబేదు కుమారుడు అజర్యా, అదాయా కుమారుడు మయశేయా, జిక్రీ కుమారుడు ఎలీషాపాతు అనే వారిని తనతో నిబంధనలో చేర్చుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారితో నిబంధన చేసుకున్నాడు”; అక్షరార్థంగా, “వారిని తనతో నిబంధనలోకి తీసుకున్నాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִעִית
  choice: ఏడవ సంవత్సరంలో
  rationale: కాలాన్ని సూచించే పదబంధం. వాక్యారంభంలోని సంధికారకాన్ని తెలుగులో విడిగా అనువదించకపోవడం సహజంగా ఉంటుంది; అర్థనష్టం లేదు.
- source_word: הִתְחַזַּק
  choice: ధైర్యం తెచ్చుకొని
  rationale: חזק హిత్పయేల్ రూపంలోని ఆత్మార్థక భావాన్ని, ఈ సందర్భంలో నిర్ణయాత్మక చర్యకు సిద్ధపడిన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּקַּח ... עִמּוֹ בַבְּרִית
  choice: వారిని తనతో నిబంధనలో చేర్చుకున్నాడు
  rationale: అక్షరార్థంగా ‘తీసుకున్నాడు ... తనతో నిబంధనలో’ అనే హెబ్రీ నిర్మాణం, అధికారులను తనతో నిబంధనాత్మక ఒప్పందంలోకి తీసుకొచ్చిన చర్యను సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘చేర్చుకున్నాడు’ ఆ సంబంధాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: నూరుమందికి అధిపతులు
  rationale: నూరు మంది గల సైనిక దళాలపై ఉన్న అధికారులను సూచించే బిరుదు. రోమా సైన్యానికి ప్రత్యేకమైన పదాన్ని రుద్దకుండా మూలంలోని సంఖ్యాపరమైన భావాన్ని నిలుపుతుంది.
- source_word: לַעֲזַרְיָהוּ ... וּלְיִשְׁמָעֵאל ... וְלַעֲזַרְיָהוּ ... וְאֶת מַעֲשֵׂיָהוּ ... וְאֶת אֱלִישָׁפָט
  choice: అజర్యా ... ఇష్మాయేలు ... అజర్యా ... మయశేయా ... ఎలీషాపాతు
  rationale: వ్యక్తి పేర్లను అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించాం. మూలంలో రెండుసార్లు వచ్చే అజర్యా పేరును అలాగే నిలిపాం.
- source_word: בֶן
  choice: కుమారుడు
  rationale: తండ్రి పేరుతో వ్యక్తిని గుర్తించే సాధారణ వంశసంబంధ పదం.
theological_decisions:
- issue: עִמּוֹ בַבְּרִית లోని నిబంధన సంబంధం
  choice: తనతో నిబంధనలో చేర్చుకున్నాడు
  alternative: వారితో నిబంధన చేసుకున్నాడు
  rationale: హెబ్రీలో ‘తీసుకొను’ అనే క్రియతో ‘తనతో’ మరియు ‘నిబంధనలో’ అనే పదబంధాలు కలసి ఉన్నాయి. ప్రధాన పాఠం అధికారులను నిబంధనలోకి తీసుకున్న భావాన్ని నిలుపుతుంది; ప్రత్యామ్నాయం పరస్పరం నిబంధన చేసుకున్న భావాన్ని సహజంగా వ్యక్తం చేస్తుంది. పాదసూచికలో ఈ నిజమైన నిర్మాణాత్మక సందిగ్ధతను తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలిని వాడాం. సైనిక బిరుదును ‘నూరుమందికి అధిపతులు’గా పారదర్శకంగా అనువదించాం; పేర్లను తెలుగు బైబిలు వినియోగానికి అనుగుణంగా లిప్యంతరీకరించాం.
