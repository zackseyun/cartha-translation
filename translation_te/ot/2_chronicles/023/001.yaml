  terminology: ‘నిబంధన’ ఒడంబడిక/కోవెనంట్ భావానికి తగిన, విస్తృతంగా అర్థమయ్యే పదం. ‘నూరుమందికి అధిపతులు’ శָׂרֵי הַמֵּאוֹת అనే సైనిక బిరుదును రోమా-నిర్దిష్ట పదజాలం లేకుండా పారదర్శకంగా తెలియజేస్తుంది. వ్యక్తి పేర్ల లిప్యంతరీకరణలు స్థిరంగా ఉన్నాయి.
