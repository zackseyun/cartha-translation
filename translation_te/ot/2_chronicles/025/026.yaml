  register: ఆధునిక ప్రామాణిక తెలుగు; చారిత్రక ముగింపు సూత్రానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. అలంకారప్రశ్నను ప్రకటనగా మార్చకుండా నిలిపాం. ప్రతి పాదటిప్పణి సూచికను ప్రధాన పాఠ్యంలో చేర్చాం.
