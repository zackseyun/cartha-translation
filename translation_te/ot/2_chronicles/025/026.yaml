  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י אֲמַצְיָ֔הוּ הָ/רִאשֹׁנִ֖ים וְ/הָ/אַחֲרוֹנִ֑ים הֲ/לֹא֙ הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֥פֶר מַלְכֵי יְהוּדָ֖ה וְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/026.yaml
  text: The rest of the acts of Amaziah[a], from first to last[b], are they not written in the Book of the Kings of Judah and Israel?
translation:
  language: te
  text: అమజ్యాహు చేసిన మిగతా కార్యాలు[a], మొదటినుంచి చివరివరకు, యూదా, ఇశ్రాయేలు రాజుల గ్రంథములో రాయబడి ఉన్నాయి కదా?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “అమజ్యాహు కార్యాలలో మిగిలినవి—మొదటివి మరియు చివరివి.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “యూదా, ఇశ్రాయేలు రాజుల గ్రంథం మీద”; తెలుగు వాడుకలో “గ్రంథములో” అని చెప్పడం సహజం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֲמַצְיָהוּ
  choice: అమజ్యా చేసిన మిగతా కార్యాలు
  rationale: రాజుల పాలనను సంగ్రహించే ఈ సూత్రప్రాయ వాక్యంలో דִּבְרֵי అనేది మాటలకంటే కార్యాలు లేదా పాలనలో జరిగిన విషయాలను సూచిస్తుంది. సహజమైన తెలుగుకోసం సంబంధాన్ని ‘చేసిన’తో స్పష్టం చేశాం.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרוֹנִים
  choice: మొదటినుంచి చివరివరకు
  rationale: ఆ రాజు చరిత్ర లేదా కార్యాల సమగ్ర కాలవ్యాప్తిని తెలిపే జంటపదబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הֲלֹא הִנָּם כְּתוּבִים
  choice: రాయబడి ఉన్నాయి కదా?
  rationale: సానుకూల సమాధానాన్ని ఆశించే హీబ్రూ అలంకారప్రశ్న బలాన్ని ‘కదా?’ అనే సహజ తెలుగు రూపం నిలుపుతుంది.
- source_word: עַל סֵפֶר
  choice: గ్రంథంలో
  rationale: עַל అక్షరార్థంగా ‘మీద’ అయినా, లిఖిత ఆధారాన్ని సూచించే ఈ సందర్భంలో తెలుగు వాడుక ప్రకారం ‘గ్రంథంలో రాయబడి’ సహజంగా ఉంటుంది.
- source_word: מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: యూదా, ఇశ్రాయేలు రాజుల
  rationale: మూలంలోని పేర్ల క్రమాన్ని నిలిపి, సూచించబడిన చారిత్రక గ్రంథ శీర్షికను తెలుగులో సహజమైన షష్ఠీ నిర్మాణంతో అందిస్తుంది.
