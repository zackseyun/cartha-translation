  text: וַ/יְהִ֣י בְּ/דַבְּר֣/וֹ אֵלָ֗י/ו וַ/יֹּ֤אמֶר ל/וֹ֙ הַ/לְ/יוֹעֵ֤ץ לַ/מֶּ֨לֶךְ֙ נְתַנּ֔וּ/ךָ חֲדַל לְ/ךָ֖ לָ֣/מָּה יַכּ֑וּ/ךָ וַ/יֶּחְדַּ֣ל הַ/נָּבִ֗יא וַ/יֹּ֨אמֶר֙ יָדַ֗עְתִּי כִּֽי יָעַ֤ץ אֱלֹהִים֙ לְ/הַשְׁחִיתֶ֔/ךָ כִּֽי עָשִׂ֣יתָ זֹּ֔את וְ/לֹ֥א שָׁמַ֖עְתָּ לַ/עֲצָתִֽ/י׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/016.yaml
  text: And it happened[a], as he was speaking to him, that the king said to him, “Have we made you the king’s adviser? Stop! Why should they strike you down?” So the prophet stopped and said, “I know that God has determined to destroy you[c][b], because you have done this and have not listened to my counsel.”
translation:
  language: te
  text: అతడు రాజుతో మాట్లాడుతుండగా, రాజు అతనితో, “నిన్ను రాజుకు సలహాదారుగా మేము నియమించామా?[a] ఇక ఆపు! వారు నిన్నెందుకు కొట్టాలి?[b]” అన్నాడు. అప్పుడు ప్రవక్త మాట్లాడడం ఆపి, “నీవు ఇలా చేసి, నా సలహాను వినలేదు కాబట్టి, నిన్ను నాశనం చేయాలని దేవుడు నిర్ణయించుకున్నాడని[c] నాకు తెలుసు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిన్ను రాజుకు సలహాదారుగా మేము చేశామా?”
    reason: נתן అనే క్రియను ఇక్కడ ‘నియమించామా?’ లేదా ‘చేశామా?’ అని అనువదించవచ్చు.
  - marker: b
    text: 'హీబ్రూ: “వారు నిన్నెందుకు కొట్టాలి?” ఇక్కడ ‘వారు’ ఎవరో నిర్దిష్టంగా చెప్పలేదు; బహుశా రాజు ఆజ్ఞపై ప్రవక్తను శిక్షించేవారిని సూచిస్తుంది.'
    reason: హీబ్రూలో నిర్దిష్టంగా పేర్కొనని బహువచన కర్త ఉంది; దాన్ని అనువాదంలో తొలగించకుండా వివరిస్తుంది.
  - marker: c
    text: లేదా, “నిన్ను నాశనం చేయాలని దేవుడు యోచించాడు.” హీబ్రూ క్రియకు సలహా ఇవ్వడం, యోచించడం లేదా ఉద్దేశించడం అనే భావాలు ఉన్నాయి.
    reason: יעץ అనే క్రియలోని యోచన/సలహా భావాన్ని ప్రత్యామ్నాయంగా చూపిస్తుంది.
lexical_decisions:
- source_word: וַיְהִי בְּדַבְּרוֹ אֵלָיו
  choice: అతడు రాజుతో మాట్లాడుతుండగా
  rationale: హీబ్రూ వాక్యారంభ సూత్రాన్ని సహజమైన తెలుగు కాలసంబంధ ఉపవాక్యంగా ఇచ్చాం. సందర్భానుసారం సర్వనామాల సూచనను ‘అతడు రాజుతో’ అని స్పష్టం చేశాం.
- source_word: הַלְיוֹעֵץ לַמֶּלֶךְ נְתַנּוּךָ
  choice: నిన్ను రాజుకు సలహాదారుగా మేము నియమించామా?
  rationale: ప్రశ్నార్థక הֲ, לְ + יוֹעֵץ, మరియు נתן యొక్క నియామక భావాన్ని నిలిపి, రాజు వేసిన వ్యంగ్యార్థక ప్రశ్నగా సహజ తెలుగులో అనువదించాం.
- source_word: חֲדַל לְךָ
  choice: ఇక ఆపు!
  rationale: ప్రవక్తను మాట్లాడడం మానమని గట్టిగా ఆదేశించే సంక్షిప్త ఆజ్ఞను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לָמָּה יַכּוּךָ
  choice: వారు నిన్నెందుకు కొట్టాలి?
  rationale: హీబ్రూలోని నిర్దిష్టంగా పేర్కొనని బహువచన కర్తను ‘వారు’గా ఉంచాం; మరణం లేదా నిర్దిష్ట శిక్షను అనవసరంగా చేర్చలేదు.
- source_word: וַיֶּחְדַּל הַנָּבִיא
  choice: అప్పుడు ప్రవక్త మాట్లాడడం ఆపి
  rationale: ‘ప్రవక్త ఆపాడు’ అనే హీబ్రూ సంక్షిప్త ప్రయోగంలో సందర్భం సూచించే ‘మాట్లాడడం’ను తెలుగులో స్పష్టం చేశాం.
- source_word: יָעַץ אֱלֹהִים
  choice: దేవుడు నిర్ణయించుకున్నాడు
  rationale: יעץ యొక్క సలహా/యోచన/నిర్ణయ భావక్షేత్రంలో, తరువాతి నాశన క్రియతో కలిసినప్పుడు దేవుని స్థిర ఉద్దేశాన్ని ‘నిర్ణయించుకున్నాడు’ సహజంగా తెలియజేస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: לְהַשְׁחִיתֶךָ
  choice: నిన్ను నాశనం చేయాలని
  rationale: שׁחת హిఫిల్ రూపంలోని నాశనం కలిగించే భావాన్ని నేరుగా, బలంగా నిలిపింది.
- source_word: כִּי עָשִׂיתָ זֹּאת וְלֹא שָׁמַעְתָּ לַעֲצָתִי
  choice: నీవు ఇలా చేసి, నా సలహాను వినలేదు కాబట్టి
  rationale: כִּי యొక్క కారణార్థాన్ని, demonstrative ‘ఇలా’ను, שׁמע యొక్క వినడం/పాటించడం మధ్య ఉన్న భావవిస్తృతిని అనవసరంగా కుదించకుండా నిలిపాం.
theological_decisions:
- issue: יָעַץ אֱלֹהִים לְהַשְׁחִיתֶךָలో దేవుని ఉద్దేశం
  choice: నిన్ను నాశనం చేయాలని దేవుడు నిర్ణయించుకున్నాడు
  alternative: నిన్ను నాశనం చేయాలని దేవుడు యోచించాడు
  rationale: హీబ్రూ దేవుని న్యాయతీర్పును స్థిరమైన ఉద్దేశంగా చెబుతుంది. దానిని మృదువుపరచకుండా, విస్తృతమైన సిద్ధాంత వివరణను చేర్చకుండా నేరుగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. రాజు బెదిరింపులోని కఠినత్వాన్ని నిలిపి, హీబ్రూలో లేని మరణార్థాన్ని ప్రధాన వాక్యంలో చేర్చలేదు. ప్రధాన పాఠంలోని [a], [b], [c] గుర్తులు సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
