source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֛ר חָזְקָ֥ה הַ/מַּמְלָכָ֖ה עָלָ֑י/ו וַֽ/יַּהֲרֹג֙ אֶת עֲבָדָ֔י/ו הַ/מַּכִּ֖ים אֶת הַ/מֶּ֥לֶךְ אָבִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/003.yaml
  text: When the kingdom was firmly in his hand[a], he killed his servants who had struck down the king his father.
translation:
  language: te
  text: రాజ్యం అతని ఆధీనంలో స్థిరపడినప్పుడు[a], తన తండ్రియైన రాజును హతమార్చిన తన సేవకులను అతడు చంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజ్యాధికారం అతనికి సుస్థిరమైనప్పుడు.”
    reason: ממלכה అనే పదం ‘రాజ్యం’తో పాటు ‘రాజ్యాధికారం/రాజపాలన’ను కూడా సూచించగలదు; חזק ఇక్కడ పాలన బలపడి సుస్థిరమవడాన్ని తెలియజేస్తుంది.
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: స్థిరపడినప్పుడు
  rationale: హీబ్రూ కథన సూత్రంలోని కాలసంబంధ భావాన్ని సహజమైన తెలుగు ఉపవాక్యంతో వ్యక్తం చేస్తుంది; మూలంలో లేని ప్రత్యేక ‘ఇప్పుడు’ అనే సంధాన పదాన్ని చేర్చదు.
- source_word: חָזְקָה הַמַּמְלָכָה עָלָיו
  choice: రాజ్యం అతని ఆధీనంలో స్థిరపడినప్పుడు
  rationale: ఇక్కడ חזק శారీరక బలాన్ని కాక రాజపాలన సుస్థిరమవడాన్ని సూచిస్తుంది. עליו ను అక్షరార్థంగా ‘అతని మీద’ అని అనువదిస్తే తెలుగులో విరుద్ధార్థం కలగవచ్చు; ‘అతని ఆధీనంలో’ నియంత్రణ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וַיַּהֲרֹג
  choice: అతడు చంపాడు
  rationale: הרג కు నేరుగా, ఆధునికంగా, మూలంలో లేని ఆజ్ఞాపన లేదా న్యాయశిక్ష భావాన్ని చేర్చకుండా ఇచ్చిన అనువాదం.
- source_word: עֲבָדָיו
  choice: తన సేవకులను
  rationale: రాజసభ సందర్భంలో עבד రాజు సేవలో ఉన్నవారిని సూచిస్తుంది. ‘బానిసలు’ అనడం వారి చట్టపరమైన స్థితిని అవసరానికి మించి నిర్దిష్టం చేస్తుంది; ‘అధికారులు’ అనడం పరిధిని సంకుచితం చేస్తుంది.
- source_word: הַמַּכִּים
  choice: హతమార్చిన
  rationale: నామవాచక కృదంతం ఆ సేవకులనే హంతకులుగా గుర్తిస్తుంది. נכה లోని హింసాత్మక భావాన్ని వ్యక్తం చేస్తూ, వెంటనే వచ్చే ‘చంపాడు’తో పదపునరుక్తిని తగ్గిస్తుంది.
- source_word: אֶת־הַמֶּלֶךְ אָבִיו
  choice: తన తండ్రియైన రాజును
  rationale: ‘రాజు’ మరియు ‘అతని తండ్రి’ అనే హీబ్రూ సమానాధికార సంబంధాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
