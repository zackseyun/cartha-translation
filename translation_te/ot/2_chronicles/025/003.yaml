translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. రాజసభ సందర్భానికి తగిన ‘సేవకులు’, ‘హతమార్చిన’ వంటి పదాలను ఎంచుకున్నాం; మూలంలో స్పష్టంగా లేని న్యాయశిక్ష లేదా ఆజ్ఞాపన భావాన్ని చేర్చలేదు.
