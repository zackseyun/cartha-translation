  terminology: “సేవకులు” is suitably broad for royal servants/court personnel; “హతమార్చిన” appropriately renders the violent act without awkward repetition; and “తండ్రియైన రాజు” naturally preserves the appositional relationship. The footnote is correctly anchored and accurately explains the viable royal-rule sense.
