review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the military defeat of Edom, the proud self-exaltation, the command to remain at home, and the threatened shared downfall. However, אָמַרְתָּ explicitly means “you said,” not “you thought”; rendering it as అనుకున్నావు introduces an unsupported inward/private sense. The final Telugu syntax can also more directly connect provoking disaster with the consequent fall.
  naturalness: Most of the draft is fluent modern Telugu. Recasting the final rhetorical question as “విపత్తును ఎందుకు రెచ్చగొట్టి ... ఎందుకు పడిపోవాలి?” is more idiomatic and clearly expresses the warning’s consequence.
  terminology: ఎదోము, యూదా, హృదయం, విపత్తు, and the military sense of ఓడించావు are appropriate. The footnote’s “గర్విష్ఠిని చేసింది” is grammatically and semantically unsuitable here; a gender-neutral verbal expression for making oneself proud/self-exalting is preferable.
  issues:
  - severity: medium
    issue: אָמַרְתָּ is rendered as “అని నీవు అనుకున్నావు.”
    rationale: The Hebrew Qal perfect of אמר means “you said.” The source does not specify that this was merely an inward thought, so “చెప్పావు” should be used.
  - severity: low
    issue: The consequence clause is somewhat awkward in Telugu.
    rationale: “నీవూ ... పడిపోయేలా, విపత్తును ఎందుకు రెచ్చగొడతావు?” can be understood, but placing the result after the provocation more naturally reflects the Hebrew warning.
  - severity: low
    issue: The footnote says “నీ హృదయం నిన్ను గర్విష్ఠిని చేసింది.”
    rationale: గర్విష్ఠి is not appropriate in this construction and can create an unintended gender/form issue. “నిన్ను గర్వపడేలా చేసింది” is clear and idiomatic.
  revised_text: “ఇదిగో, నీవు ఎదోమును ఓడించావు; గొప్పలు చెప్పుకోవడానికి నీ హృదయం నిన్ను ఉప్పొంగజేసింది” అని నీవు చెప్పావు.[a] ఇప్పుడు నీ ఇంట్లోనే ఉండు. విపత్తును ఎందుకు రెచ్చగొట్టి, నీవూ నీతోపాటు యూదా కూడా ఎందుకు పడిపోవాలి?
