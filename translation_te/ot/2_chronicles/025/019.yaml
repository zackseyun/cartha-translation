revisions:
- from: “ఇదిగో, నీవు ఎదోమును ఓడించావు; గొప్పలు చెప్పుకునేలా నీ హృదయం నిన్ను ఉప్పొంగజేసింది” అని నీవు అనుకున్నావు.[a] ఇప్పుడు నీ ఇంట్లోనే ఉండు. నీవూ నీతోపాటు యూదా కూడా పడిపోయేలా, విపత్తును ఎందుకు రెచ్చగొడతావు?
  to: “ఇదిగో, నీవు ఎదోమును ఓడించావు; గొప్పలు చెప్పుకోవడానికి నీ హృదయం నిన్ను ఉప్పొంగజేసింది” అని నీవు చెప్పావు.[a] ఇప్పుడు నీ ఇంట్లోనే ఉండు. విపత్తును ఎందుకు రెచ్చగొట్టి, నీవూ నీతోపాటు యూదా కూడా ఎందుకు పడిపోవాలి?
  rationale: The revision restores the explicit sense of אָמַרְתָּ as “you said,” without adding an inference about an inward thought. It retains the Hebrew heart metaphor, the possible sense of self-glorification in the footnote, and the warning that the king’s provocation would bring both him and Judah to ruin. The final question is reordered solely for clear, natural modern Telugu.
