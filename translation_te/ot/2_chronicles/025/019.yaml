  variant: modern standard Telugu
source:
  edition: WLC
  text: אָמַ֗רְתָּ הִנֵּ֤ה הִכִּ֨יתָ֙ אֶת אֱד֔וֹם וּ/נְשָׂאֲ/ךָ֥ לִבְּ/ךָ֖ לְ/הַכְבִּ֑יד עַתָּה֙ שְׁבָ֣/ה בְּ/בֵיתֶ֔/ךָ לָ֤/מָּה תִתְגָּרֶה֙ בְּ/רָעָ֔ה וְ/נָ֣פַלְתָּ֔ אַתָּ֖ה וִ/יהוּדָ֥ה עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/019.yaml
  text: You said[a], ‘Look, you have struck Edom, and your heart has lifted you up to boast.’ Now stay at home. Why should you provoke disaster, so that you fall—you and Judah with you?
translation:
  language: te
  text: “ఇదిగో, నీవు ఎదోమును ఓడించావు; గొప్పలు చెప్పుకోవడానికి నీ హృదయం నిన్ను ఉప్పొంగజేసింది” అని నీవు చెప్పావు.[a] ఇప్పుడు నీ ఇంట్లోనే ఉండు. విపత్తును ఎందుకు రెచ్చగొట్టి, నీవూ నీతోపాటు యూదా కూడా ఎందుకు పడిపోవాలి?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఘనత కోసం నీ హృదయం నిన్ను హెచ్చించింది,” లేదా “గౌరవం పొందడానికి నీ హృదయం నిన్ను గర్వపడేలా చేసింది.” విజయానంతరం తనను తాను గొప్ప చేసుకోవడాన్ని సూచించే హీబ్రూ నుడికారమిది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתָּ
  choice: అని నీవు అనుకున్నావు
  rationale: Qal perfect second masculine singular. Although its basic sense is ‘you said,’ in this taunting message it introduces the king’s inward claim; ‘అనుకున్నావు’ is natural Telugu and does not require that the words were spoken publicly.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: Preserves the emphatic, attention-directing force of the Hebrew particle in dignified, current Telugu.
- source_word: הִכִּיתָ אֶת אֱדוֹם
  choice: నీవు ఎదోమును ఓడించావు
  rationale: In the military context, the Hiphil of נכה denotes striking and thereby defeating. ‘ఓడించావు’ communicates the contextual result naturally.
- source_word: וּנְשָׂאֲךָ לִבְּךָ
  choice: నీ హృదయం నిన్ను ఉప్పొంగజేసింది
  rationale: Retains the Hebrew heart metaphor and its sense of inward elevation leading to pride, while remaining intelligible in Telugu.
- source_word: לְהַכְבִּיד
  choice: గొప్పలు చెప్పుకునేలా
  rationale: The infinitive can convey seeking honor, self-glorification, or boasting. In this rebuke after military success, the chosen wording naturally expresses boastful self-exaltation; the ambiguity is noted in the footnote.
- source_word: עַתָּה שְׁבָה בְּבֵיתֶךָ
  choice: ఇప్పుడు నీ ఇంట్లోనే ఉండు
  rationale: Conveys the idiomatic command to stay home and refrain from going out to war; ‘నే’ preserves the warning’s emphatic force.
- source_word: לָמָּה תִתְגָּרֶה בְּרָעָה
  choice: విపత్తును ఎందుకు రెచ్చగొడతావు?
  rationale: The Hitpael verb describes stirring up or provoking conflict, while רָעָה here denotes disastrous harm rather than moral evil. This rendering gives the military warning clearly.
- source_word: וְנָפַלְתָּ אַתָּה וִיהוּדָה עִמָּךְ
  choice: నీవూ నీతోపాటు యూదా కూడా పడిపోయేలా
  rationale: Preserves both the consequence of the provocation and the emphasis that the king’s fall will bring Judah down with him.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజుకు పంపిన హెచ్చరికకు తగిన నేరుగా మాట్లాడే, గంభీరమైన శైలి. హృదయం ‘ఉప్పొంగడం’ అనే మూలభాష రూపకాన్ని ఉంచి, సైనిక సందర్భంలోని విపత్తు మరియు సామూహిక పతనాన్ని సహజంగా వ్యక్తం చేసింది.
