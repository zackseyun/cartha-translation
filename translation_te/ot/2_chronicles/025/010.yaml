source:
  edition: WLC
  text: וַ/יַּבְדִּילֵ֣/ם אֲמַצְיָ֗הוּ לְ/הַ/גְּדוּד֙ אֲשֶׁר בָּ֤א אֵלָי/ו֙ מֵֽ/אֶפְרַ֔יִם לָ/לֶ֖כֶת לִ/מְקוֹמָ֑/ם וַ/יִּ֨חַר אַפָּ֤/ם מְאֹד֙ בִּֽ/יהוּדָ֔ה וַ/יָּשׁ֥וּבוּ לִ/מְקוֹמָ֖/ם בָּ/חֳרִי אָֽף־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/010.yaml
  text: So Amaziah separated them[a], the troops that had come to him from Ephraim, to go to their place. And they became very angry with Judah and returned to their place in fierce anger.
translation:
  language: te
  text: కాబట్టి అమజ్యా ఎఫ్రాయిము నుండి తన దగ్గరకు వచ్చిన ఆ దళాన్ని తమ స్థలానికి వెళ్లిపోవడానికి వేరుచేశాడు[a]. అప్పుడు వారికి యూదా మీద చాలా కోపం రగిలింది; వారు తీవ్రమైన కోపంతో తమ స్థలానికి తిరిగివెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పంపివేశాడు.”
    reason: בדל అంటే ప్రాథమికంగా ‘వేరుచేయడం’; ఈ సైనిక సందర్భంలో దళాన్ని పంపివేయడం అనే భావం కూడా సాధ్యమే.
lexical_decisions:
- source_word: וַיַּבְדִּילֵם
  choice: వారిని … వేరుచేసి
  rationale: בדל యొక్క ప్రాథమిక భావం ‘వేరుచేయడం.’ ఈ సందర్భంలో సైనిక దళాన్ని సేవ నుండి పంపివేయడం భావమైనప్పటికీ, మూలపదానికి దగ్గరగా ఉండేందుకు ‘వేరుచేసి’ అని అనువదించి, సందర్భోచిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: לְהַגְּדוּד
  choice: దళాన్ని
  rationale: גְּדוּד ఇక్కడ ఎఫ్రాయిము నుండి వచ్చిన సైనిక బృందాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘దళం’ స్పష్టమైన సైనిక పదం.
- source_word: לָלֶכֶת לִמְקוֹמָם
  choice: తమ స్థలానికి వెళ్లిపొమ్మన్నాడు
  rationale: అక్షరార్థమైన ‘తమ స్థలానికి వెళ్లడానికి’ అనే ఉద్దేశ భావాన్ని సహజమైన తెలుగు ఆజ్ఞారూప నిర్మాణంలో వ్యక్తం చేస్తుంది; ‘ఇంటికి’ అని చెప్పడం కంటే ఇది మూలంలోని מקום భావాన్ని కాపాడుతుంది.
- source_word: וַיִּחַר אַפָּם מְאֹד בִּיהוּדָה
  choice: వారికి యూదా మీద చాలా కోపం రగిలింది
  rationale: חרה אף అనే మండే కోపాన్ని సూచించే హీబ్రూ నుడికారాన్ని సహజంగా ‘కోపం రగిలింది’ అని తెలిపాం; בִּיהוּדָה కోపం లక్ష్యం యూదా అని ‘యూదా మీద’ ద్వారా స్పష్టం అవుతుంది.
- source_word: וַיָּשׁוּבוּ לִמְקוֹמָם בָּחֳרִי אָף
  choice: వారు తీవ్రమైన కోపంతో తమ స్థలానికి తిరిగివెళ్లారు
  rationale: שׁוב యొక్క ‘తిరిగివెళ్లడం’ భావాన్నీ, חֳרִי אָף లోని ఉగ్రతనూ సహజమైన, గంభీరమైన తెలుగులో నిలుపుతుంది.
