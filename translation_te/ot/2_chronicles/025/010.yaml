  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే చారిత్రక కథనానికి తగిన గంభీరతతో రూపొందించబడింది. మూలంలోని ‘తమ స్థలం’ అనే పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం.
