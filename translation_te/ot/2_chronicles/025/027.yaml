id: 2CH.25.27
reference: 2 Chronicles 25:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מֵ/עֵ֗ת אֲשֶׁר סָ֤ר אֲמַצְיָ֨הוּ֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וַ/יִּקְשְׁר֨וּ עָלָ֥י/ו קֶ֛שֶׁר בִּ/ירוּשָׁלִַ֖ם וַ/יָּ֣נָס לָכִ֑ישָׁ/ה וַ/יִּשְׁלְח֤וּ אַחֲרָי/ו֙ לָכִ֔ישָׁ/ה וַ/יְמִיתֻ֖/הוּ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/027.yaml
  text: From the time that Amaziah turned away from following Yahweh[a], they conspired against him in Jerusalem, and he fled to Lachish; but they sent after him to Lachish and put him to death there.
translation:
  language: te
  text: అమజ్యా యాహ్వేను అనుసరించడం మానుకున్న కాలం నుంచి[a], యెరూషలేములో అతనికి వ్యతిరేకంగా కుట్ర పన్నారు. అతడు లాకీషుకు పారిపోయాడు; అయితే వారు అతని వెంట లాకీషుకు మనుష్యులను పంపించి, అక్కడ అతన్ని చంపారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ నుడికారానికి అక్షరార్థం: “యాహ్వే వెనుకనుండి తొలగిపోయాడు”; అంటే యాహ్వేను అనుసరించడం మానుకున్నాడు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵת אֲשֶׁר
  choice: కాలం నుంచి
  rationale: తర్వాత జరిగిన కుట్ర ఎప్పటి నుంచి మొదలైందో తెలిపే కాలసూచనను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; హీబ్రూ వావ్ కోసం అనవసరమైన ఆరంభ అనుసంధాన పదాన్ని చేర్చలేదు.
- source_word: סָר מֵאַחֲרֵי יְהוָה
  choice: యాహ్వేను అనుసరించడం మానుకున్న
  rationale: ఇది శారీరకంగా దూరం కావడం కాదు, యాహ్వేను అనుసరించకుండా తొలగిపోవడాన్ని సూచించే హీబ్రూ నుడికారం. ప్రధాన పాఠ్యంలో దాని భావాన్ని సహజంగా అందించి, అక్షర రూపాన్ని పాదటిప్పణిలో తెలిపింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: וַיִּקְשְׁרוּ עָלָיו קֶשֶׁר
  choice: అతనికి వ్యతిరేకంగా కుట్ర పన్నారు
  rationale: హీబ్రూలోని క్రియా-నామ పునరుక్తిని అసహజంగా ప్రతిబింబించకుండా, దాని బలమైన కుట్ర భావాన్ని ప్రస్తుత ప్రామాణిక తెలుగులో అందిస్తుంది.
- source_word: וַיָּנָס לָכִישָׁה
  choice: అతడు లాకీషుకు పారిపోయాడు
  rationale: ప్రమాదం నుంచి తప్పించుకోవడానికి పారిపోవడాన్ని, స్థల నామంలోని దిశార్థక రూపాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: וַיִּשְׁלְחוּ אַחֲרָיו לָכִישָׁה
  choice: వారు అతని వెంట లాకీషుకు మనుష్యులను పంపించి
  rationale: హీబ్రూ వాక్యంలో పంపబడిన వ్యక్తులు స్పష్టంగా చెప్పబడకపోయినా క్రియలో వారు సూచితులే; సహజమైన తెలుగులో వాక్యం సంపూర్ణంగా ఉండేందుకు ‘మనుష్యులను’ చేర్చింది, వారే వెంబడించి వెళ్లారనే భావాన్ని మార్చలేదు.
- source_word: וַיְמִיתֻהוּ שָׁם
  choice: అక్కడ అతన్ని చంపారు
  rationale: హిఫిల్ రూపంలోని ఉద్దేశపూర్వకంగా మరణానికి గురిచేసిన భావాన్ని నేరుగా, స్పష్టంగా అందిస్తుంది; న్యాయపరమైన మరణశిక్ష అనే అదనపు భావాన్ని చేర్చదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠ్యంలో ప్రత్యేక దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని వ్యక్తినామ స్వభావాన్ని కాపాడుతుంది.
- issue: సָר מֵאַחֲרֵי יְהוָה లోని మతపరమైన తొలగింపు
  choice: యాహ్వేను అనుసరించడం మానుకున్న
  alternative: యాహ్వే నుండి తొలగిపోయిన
  rationale: ‘వెనుక నడవడం’ అనే నుడికారం విధేయతతో అనుసరించడాన్ని సూచిస్తుంది. ఎంపిక చేసిన రూపం మతపరమైన విరమణను తెలియజేస్తుంది; అయితే దానికి కారణం లేదా సిద్ధాంతపరమైన స్థితిని అదనంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. స్థలనామాలకు తెలుగు బైబిలు వాడుకలో పరిచితమైన ‘యెరూషలేము’, ‘లాకీషు’ రూపాలు వాడబడ్డాయి. హీబ్రూ కథనంలోని వరుస వావ్‌లను ప్రతిచోటా ‘మరియు’గా యాంత్రికంగా అనువదించకుండా, వాక్య విభజనతో సహజ కథన ప్రవాహం కల్పించబడింది.
