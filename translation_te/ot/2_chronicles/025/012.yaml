translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథనశైలి వాడబడింది. ‘యూదా కుమారులు’ అనే అక్షరానువాదానికి బదులు సందర్భానుసారంగా ‘యూదా ప్రజలు’ అని ఇచ్చాం. హీబ్రూ వాక్యంలోని వరుస సమన్వయాన్ని నిలుపుతూ, ఉద్దేశం లేదా ఫలితం అనే అదనపు సంబంధాన్ని చేర్చలేదు.
