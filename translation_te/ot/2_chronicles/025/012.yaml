source:
  edition: WLC
  text: וַ/עֲשֶׂ֨רֶת אֲלָפִ֜ים חַיִּ֗ים שָׁבוּ֙ בְּנֵ֣י יְהוּדָ֔ה וַ/יְבִיא֖וּ/ם לְ/רֹ֣אשׁ הַ/סָּ֑לַע וַ/יַּשְׁלִיכ֛וּ/ם מֵֽ/רֹאשׁ הַ/סֶּ֖לַע וְ/כֻלָּ֥/ם נִבְקָֽעוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/012.yaml
  text: And the sons of Judah captured ten thousand alive[a], brought them to the top of the cliff, and threw them down from the top of the cliff[b], and all of them were dashed to pieces.
translation:
  language: te
  text: యూదా ప్రజలు పదివేల మందిని సజీవంగా పట్టుకొని, వారిని బండ శిఖరానికి[a] తీసుకువచ్చారు. బండ శిఖరం మీద నుంచి వారిని కిందికి విసిరివేశారు; వారందరూ చీలిపోయారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “కొండబండ శిఖరానికి” లేదా “నిటారైన బండ పైభాగానికి.” హీబ్రూ: సెలా.'
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “వారందరూ చీలిపోయారు” లేదా “పగిలిపోయారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁבוּ
  choice: పట్టుకొని
  rationale: חַיִּים అనే పదంతో కలిసి ఇది యుద్ధంలో వారిని చంపకుండా సజీవంగా బందీలుగా పట్టుకున్నారని సూచిస్తుంది.
- source_word: חַיִּים
  choice: సజీవంగా
  rationale: పదివేల మందిని చంపకుండా ప్రాణాలతో పట్టుకున్నారనే క్రియావిశేషణ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיְבִיאוּם
  choice: వారిని ... తీసుకువచ్చారు
  rationale: హిఫిల్ రూపంలోని בוא ఇక్కడ ‘తీసుకురావడం’ అనే సాధారణ అర్థాన్ని ఇస్తుంది.
- source_word: לְרֹאשׁ
  choice: శిఖరానికి
  rationale: భౌగోళిక ఆకృతితో వచ్చిన רֹאשׁ అక్షరార్థంగా ‘తల’ అయినా, ఇక్కడ దాని పైభాగం లేదా శిఖరాన్ని సూచిస్తుంది.
- source_word: הַסָּלַע / הַסֶּלַע
  choice: బండ
  rationale: סֶלַע పెద్ద రాతిబండను, కొండబండను లేదా నిటారైన రాతి ప్రదేశాన్ని సూచించగలదు. ‘బండ శిఖరం’ సందర్భంలోని ఎత్తైన రాతి ప్రదేశాన్ని సహజంగా తెలియజేస్తూ మూలపద విస్తృతిని అతిగా కుదించదు.
- source_word: וַיַּשְׁלִיכוּם
  choice: వారిని కిందికి విసిరివేశారు
  rationale: שלך అంటే ‘విసరడం’; శిఖరం మీద నుంచి అనే సందర్భం వల్ల కిందికి జరిగిన కదలికను తెలుగులో స్పష్టంగా చెప్పడం సహజం.
- source_word: וְכֻלָּם
  choice: వారందరూ
  rationale: హీబ్రూలోని సర్వసమగ్రతను, వ్యక్తులను సూచించే ప్రత్యయాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: נִבְקָעוּ
  choice: చీలిపోయారు
  rationale: בקע నిఫాల్ రూపం ‘చీలిపోవడం’ లేదా ‘పగిలిపోవడం’ అని అర్థం. ‘చీలిపోయారు’ హింసాత్మక ఫలితాన్ని సూటిగా చెబుతుంది; దానిని మెత్తబరచదు లేదా మూలంలో లేని అదనపు చిత్రణను చేర్చదు.
