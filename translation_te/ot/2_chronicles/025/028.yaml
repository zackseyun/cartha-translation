source:
  edition: WLC
  text: וַ/יִּשָּׂאֻ֖/הוּ עַל הַ/סּוּסִ֑ים וַֽ/יִּקְבְּר֥וּ אֹת֛/וֹ עִם אֲבֹתָ֖י/ו בְּ/עִ֥יר יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/028.yaml
  text: They carried him on horses and buried him with his fathers in the city of Judah[a].
translation:
  language: te
  text: వారు అతణ్ణి గుర్రాల మీద మోశారు; అతని పితరులతోపాటు యూదా నగరంలో అతణ్ణి పాతిపెట్టారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ఆ గుర్రాల మీద.” హీబ్రూ మూలంలో గుర్రాలు స్పష్టంగా బహువచనంలో ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂאֻהוּ
  choice: వారు అతణ్ణి ... మోసుకొచ్చి
  rationale: נשׂא క్రియ ఇక్కడ మృతదేహాన్ని ఒక స్థలానికి తీసుకెళ్లడాన్ని సూచిస్తుంది. సందర్భానికి తగిన సహజ తెలుగు కోసం ‘మోసుకొచ్చి’ అని అనువదించాం.
- source_word: עַל הַסּוּסִים
  choice: గుర్రాల మీద
  rationale: హీబ్రూ వాక్యం అక్షరార్థంగా ‘ఆ గుర్రాల మీద’ అని, గుర్రాలను బహువచనంలో స్పష్టంగా పేర్కొంటుంది. రథం లేదా పాడెను ఊహించి చేర్చకుండా ఆ రూపాన్ని నిలిపాం.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: అతణ్ణి ... పాతిపెట్టారు
  rationale: קבר క్రియకు సందర్భానుకూలమైన, సాధారణ ఆధునిక తెలుగు రూపం ‘పాతిపెట్టారు’.
- source_word: עִם אֲבֹתָיו
  choice: అతని పితరులతోపాటు
  rationale: ఇది వంశపారంపర్య సమాధిని సూచించే సంప్రదాయ హీబ్రూ ప్రయోగం. ‘పూర్వికులు’ అనే వివరణాత్మక పదం కంటే ‘పితరులు’ మూలంలోని కుటుంబ-వంశ భావాన్ని కాపాడుతుంది.
- source_word: בְּעִיר יְהוּדָה
  choice: యూదా నగరంలో
  rationale: మసొరెటిక్ పాఠంలో ఉన్న ‘యూదా నగరంలో’ అనే అసాధారణమైనప్పటికీ స్పష్టమైన పదబంధాన్ని అలాగే అనుసరించాం; సమాంతర వాక్యాల ఆధారంగా ‘దావీదు నగరం’గా మార్చలేదు.
theological_decisions:
- issue: సమాధి స్థలపు పేరు
  choice: యూదా నగరంలో
  alternative: దావీదు నగరంలో; లేదా యూదాలో
  rationale: ఇచ్చిన మసొరెటిక్ మూలపాఠం ‘యూదా నగరం’ అని చెబుతుంది. మరింత పరిచితమైన సమాధి సూత్రానికి అనుగుణంగా పాఠాన్ని సమన్వయపరచకుండా మూలపాఠంలోని ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించాం. ‘పితరులు’ అనే బైబిలు సందర్భానికి పరిచితమైన పదాన్ని ఉంచుతూ, మిగతా వాక్య నిర్మాణాన్ని సామాన్య పాఠకులకు సులభంగా చేశాం.
