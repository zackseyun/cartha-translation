    issue: మోసుకొచ్చి adds a directional/deictic implication.
    rationale: The Hebrew וַיִּשָּׂאֻהוּ means ‘they carried/bore him’ and does not itself specify ‘brought [him here].’ A non-deictic Telugu verb preserves the source more closely.
