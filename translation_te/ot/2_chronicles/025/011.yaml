translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్యంలోని వరుస చర్యలను తెలుగులో చదవడానికి సులభంగా ఉండేలా రెండు వాక్యాలుగా విభజించాం. ఇచ్చిన ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదసూచిక గుర్తు పొరపాటుగా ‘strengthened himself’ వద్ద ఉన్నప్పటికీ, దాని విషయం בְּנֵי שֵׂעִיר గురించినందున తెలుగు ప్రధాన పాఠ్యంలో గుర్తును ‘శేయీరు కుమారులు’ వద్ద ఉంచాం.
