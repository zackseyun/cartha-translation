source:
  edition: WLC
  text: וַ/אֲמַצְיָ֨הוּ֙ הִתְחַזַּ֔ק וַ/יִּנְהַג֙ אֶת עַמּ֔/וֹ וַ/יֵּ֖לֶךְ גֵּ֣יא הַמֶּ֑לַח וַ/יַּ֥ךְ אֶת בְּנֵי שֵׂעִ֖יר עֲשֶׂ֥רֶת אֲלָפִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/011.yaml
  text: Then Amaziah strengthened himself[a], led his people, and went to the Valley of Salt, where he struck down ten thousand of the sons of Seir.
translation:
  language: te
  text: అప్పుడు అమజ్యా తనను తాను బలపరచుకొని, తన ప్రజలను నడిపించాడు. అతడు ఉప్పు లోయకు వెళ్లి, అక్కడ శేయీరు కుమారుల్లో[a] పదివేల మందిని హతం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “శేయీరు ప్రజలు” లేదా “శేయీరు వంశస్థులు” అని కూడా అనువదించవచ్చు. హీబ్రూలో అక్షరార్థంగా “శేయీరు కుమారులు” అని ఉంది; ఇది జాతి-వంశ సంబంధాన్ని తెలిపే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְחַזַּק
  choice: తనను తాను బలపరచుకొని
  rationale: హిత్పయేల్ రూపంలోని ఆత్మార్థక భావాన్ని నిలుపుతూ, అమజ్యా తనను తాను దృఢపరచుకున్నాడనే అర్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּנְהַג אֶת עַמּוֹ
  choice: తన ప్రజలను నడిపించాడు
  rationale: נהג అనే పదానికి నడిపించడం, తోలడం వంటి అర్థాలు ఉన్నాయి. సైనిక సందర్భంలో వ్యూహాన్ని అదనంగా ఊహించకుండా ‘నడిపించాడు’ అనడం మూలంలోని విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: גֵּיא הַמֶּלַח
  choice: ఉప్పు లోయ
  rationale: స్థలనామంలోని పదాంశాలను నేరుగా, తెలుగులో సహజంగా అందించే రూపం.
- source_word: וַיַּךְ
  choice: హతం చేశాడు
  rationale: נכה అనే క్రియ కొట్టడం, ఓడించడం, హతం చేయడం వంటి విస్తృత అర్థాలను కలిగి ఉంటుంది. ఇక్కడ వెంటనే పదివేల మంది అనే యుద్ధ మృతుల సంఖ్య రావడం వల్ల ‘హతం చేశాడు’ సందర్భానికి స్పష్టంగా సరిపోతుంది.
- source_word: בְּנֵי שֵׂעִיר
  choice: శేయీరు కుమారులు
  rationale: మూలంలోని జాతి-వంశ సూచక ప్రయోగాన్ని యథాతథంగా నిలుపుతుంది; ఆధునిక పాఠకులకు అర్థం స్పష్టమయ్యేలా ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: עֲשֶׂרֶת אֲלָפִים
  choice: పదివేల మంది
  rationale: హీబ్రూ సంఖ్యాపదబంధానికి సహజమైన తెలుగు రూపం; వ్యక్తుల సంఖ్య అని తెలియజేయడానికి ‘మంది’ చేర్చబడింది.
- source_word: וַאֲמַצְיָהוּ
  choice: అప్పుడు అమజ్యా
  rationale: వావ్ ద్వారా కొనసాగే కథన క్రమాన్ని తెలుగులో సహజంగా ‘అప్పుడు’ అనే పదంతో వ్యక్తం చేసింది.
