  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన చారిత్రక కథన శైలిని ఉపయోగించాం. హీబ్రూ యుద్ధప్రయోగంలోని ‘ఎదుట’ అనే రూపాన్ని, అలాగే ‘తన గుడారానికి’ అనే మూల చిత్రాన్ని నిలిపి, నానుడి భావాన్ని పాదసూచికలో వివరించాం.
