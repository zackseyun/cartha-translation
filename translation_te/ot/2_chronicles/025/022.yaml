  yaml_path: translation/ot/2_chronicles/025/022.yaml
  text: And Judah was defeated before Israel[a], and each man fled to his tent.
translation:
  language: te
  text: యూదా ఇశ్రాయేలు ఎదుట ఓడిపోయింది. ప్రతి మనిషీ తన గుడారానికి పారిపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ప్రతి మనిషీ తన గుడారానికి.” ఇది చెదరిపోయి, వెనుదిరిగి, ఎవరి స్థలానికి వారు వెళ్లడాన్ని సూచించే నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגֶף
  choice: ఓడిపోయింది
  rationale: నָגַף అనే క్రియ యొక్క నిఫాల్ రూపం ఇక్కడ యుద్ధంలో పరాజయం పొందడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఓడిపోయింది’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: దక్షిణ రాజ్యానికి సంబంధించిన పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో ఇచ్చాం.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: యుద్ధ సందర్భంలో ప్రత్యర్థి సమక్షంలో అతని చేతిలో ఓడిపోవడాన్ని సూచించే హీబ్రూ ప్రయోగాన్ని ‘ఎదుట’ సహజంగా నిలుపుతుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: ఉత్తర రాజ్యానికి సంబంధించిన పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో ఇచ్చాం.
- source_word: וַיָּנֻסוּ
  choice: పారిపోయాడు
  rationale: נוּס అంటే ప్రమాదం లేదా పరాజయం కారణంగా పారిపోవడం. పంపిణీ భావమున్న ఏకవచన కర్త ‘ప్రతి మనిషీ’తో తెలుగులో ఏకవచన క్రియ సహజంగా సరిపోతుంది.
- source_word: אִישׁ
  choice: ప్రతి మనిషీ
  rationale: పంపిణీ భావంలో ఉన్న ఏకవచన אִישׁ ప్రతి వ్యక్తిని విడివిడిగా సూచిస్తుంది; మూలంలోని పురుష సూచనను కూడా ఈ రూపం నిలుపుతుంది.
- source_word: לְאֹהָלָיו
  choice: తన గుడారానికి
  rationale: అక్షరార్థ చిత్రాన్ని నిలుపుతూ, ప్రతి వ్యక్తి తన నివాసం లేదా శిబిరస్థలానికి వెనుదిరిగాడనే సందర్భోచిత భావాన్ని తెలియజేస్తుంది.
