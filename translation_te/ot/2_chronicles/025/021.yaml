  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే రాజబిరుదులు మరియు స్థలనామాలకు తగిన గంభీరతతో అనువదించబడింది. ‘ముఖాముఖిగా తలపడ్డారు’ మూల నుడికారంలోని ఎదురెదురు భావాన్ని కాపాడుతుంది.
