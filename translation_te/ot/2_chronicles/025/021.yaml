source:
  edition: WLC
  text: וַ/יַּ֨עַל יוֹאָ֤שׁ מֶֽלֶךְ יִשְׂרָאֵל֙ וַ/יִּתְרָא֣וּ פָנִ֔ים ה֖וּא וַ/אֲמַצְיָ֣הוּ מֶֽלֶךְ יְהוּדָ֑ה בְּ/בֵ֥ית שֶׁ֖מֶשׁ אֲשֶׁ֥ר לִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/021.yaml
  text: So Joash king of Israel went up[a], and he and Amaziah king of Judah faced one another at Beth-shemesh, which belongs to Judah.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు రాజైన యోవాషు పైకి వెళ్లాడు[a]; అతడూ యూదా రాజైన అమజ్యాయూ యూదాకు చెందిన బేత్షెమెషు వద్ద ముఖాముఖిగా కలుసుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వెళ్లాడు.” హీబ్రూలో అక్షరార్థంగా, “పైకి వెళ్లాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: యుద్ధానికి బయలుదేరి వచ్చాడు
  rationale: עלה అనే క్రియకు ప్రాథమికంగా ‘పైకి వెళ్లాడు/వచ్చాడు’ అనే అర్థం ఉన్నా, ఇక్కడి యుద్ధ సందర్భంలో సైనికంగా బయలుదేరి ఎదుర్కొనేందుకు రావడం సూచితం. తెలుగు సహజత్వం కోసం ‘యుద్ధానికి బయలుదేరి వచ్చాడు’ అని ఇచ్చి, మూలంలోని మరింత అక్షరార్థ రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וַיִּתְרָאוּ פָנִים
  choice: ముఖాముఖిగా తలపడ్డారు
  rationale: ‘ముఖాలు చూసుకున్నారు’ అనే హీబ్రూ నుడికారం ఈ యుద్ధ సందర్భంలో పరస్పరం ఎదురుపడటాన్ని సూచిస్తుంది. ‘ముఖాముఖిగా తలపడ్డారు’ సహజమైన ఆధునిక తెలుగు; ఘర్షణ భావాన్ని సందర్భానుసారంగా నిలుపుతుంది.
- source_word: הוּא וַאֲמַצְיָהוּ
  choice: అతడూ ... అమజ్యాయూ
  rationale: క్రియ తరువాత వచ్చిన స్పష్టమైన సర్వనామాన్ని నిలుపుతూ, ఇద్దరు పక్షాలను తెలుగు సహజమైన సముచ్చయ నిర్మాణంతో చూపిస్తుంది.
- source_word: בְּבֵית שֶׁמֶשׁ
  choice: బేత్షెమెషులో
  rationale: యుద్ధం జరిగిన స్థలాన్ని సూచించే ב ఉపసర్గను తెలుగులో స్థానార్థక ‘లో’తో సహజంగా అనువదించాం; స్థలనామాన్ని లిప్యంతరీకరించాం.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: యూదాకు చెందిన
  rationale: לִיהוּדָהలోని స్వామ్య/ప్రాదేశిక సంబంధాన్ని ‘యూదాకు చెందిన’ నేరుగా ప్రతిబింబిస్తుంది; కేవలం ‘యూదాలో ఉన్న’ అని భౌగోళిక స్థానానికే పరిమితం చేయదు.
- source_word: מֶלֶךְ יִשְׂרָאֵל / מֶלֶךְ יְהוּדָה
  choice: ఇశ్రాయేలు రాజు / యూదా రాజు
  rationale: రాజబిరుదులను మూలానికి నేరుగా, తెలుగులో సహజమైన సంబంధ నిర్మాణంతో అందించాం.
