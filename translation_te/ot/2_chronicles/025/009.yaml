  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲמַצְיָ֨הוּ֙ לְ/אִ֣ישׁ הָ/אֱלֹהִ֔ים וּ/מַֽה לַּ/עֲשׂוֹת֙ לִ/מְאַ֣ת הַ/כִּכָּ֔ר אֲשֶׁ֥ר נָתַ֖תִּי לִ/גְד֣וּד יִשְׂרָאֵ֑ל וַ/יֹּ֨אמֶר֙ אִ֣ישׁ הָֽ/אֱלֹהִ֔ים יֵ֚שׁ לַֽ/יהוָ֔ה לָ֥/תֶת לְ/ךָ֖ הַרְבֵּ֥ה מִ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/009.yaml
  text: Amaziah said to the man of God[a], “But what should be done about the hundred talents that I have given to the troops of Israel?” The man of God said[b], “Yahweh is able to give you much more than this.”
translation:
  language: te
  text: అమజ్యా దేవుని మనిషితో[a], “అయితే ఇశ్రాయేలు సైనిక దళానికి నేను ఇచ్చిన ఆ వంద తలాంతుల విషయంలో నేను ఏమి చేయాలి?” అని అడిగాడు. దేవుని మనిషి, “యాహ్వే నీకు దీనికంటే ఎంతో ఎక్కువ ఇవ్వగలడు[b]” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఇక్కడ ‘ఆ వంద తలాంతులు’ అని ఉంది; అవి వెండి తలాంతులని మునుపటి వచనం తెలియజేస్తుంది.
    reason: cross_reference
  - marker: b
    text: లేదా, “యాహ్వే నీకు దీనికంటే ఎంతో ఎక్కువ ఇవ్వడానికి సమృద్ధి కలిగియున్నాడు.” హీబ్రూ వ్యక్తీకరణ యాహ్వే సమృద్ధిగా అందించగల సామర్థ్యాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: దైవికంగా నియమించబడిన సందేశకునికి వాడే ప్రామాణిక హీబ్రూ బిరుదు. ‘ప్రవక్త’ అని పదవిని మరింత నిర్దిష్టం చేయకుండా మూలంలోని రూపాన్ని నిలుపుతుంది.
- source_word: וּמַה לַּעֲשׂוֹת
  choice: అయితే ... సంగతి ఏమిటి?
  rationale: మునుపటి ఆదేశానికి అమజ్యా లేవనెత్తిన అభ్యంతరాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఇచ్చిన ధనం విషయంలో ఇప్పుడు ఏమి చేయాలనే భావాన్ని సందర్భం స్పష్టం చేస్తుంది.
- source_word: מְאַת הַכִּכָּר
  choice: ఆ వంద తలాంతులు
  rationale: כִּכָּר బరువు ప్రమాణం; ‘తలాంతు’ దాని సాంప్రదాయిక బైబిలు ప్రతిరూపం. ‘వెండి’ మునుపటి వచనంలో ఉంది గాని ఈ వచనంలో ప్రత్యక్షంగా లేదు కాబట్టి ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: גְדוּד יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సైనిక దళం
  rationale: అద్దెకు తీసుకున్న యోధుల సందర్భంలో גְּדוּד అనే సైనిక బృంద భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: יֵשׁ לַיהוָה לָתֶת לְךָ
  choice: యెహోవా నీకు ... ఇవ్వగలడు
  rationale: హీబ్రూ అస్తిత్వ నిర్మాణం యెహోవాకు సమృద్ధిగా అందించే సామర్థ్యం లేదా వనరులు ఉన్నాయని సూచిస్తుంది. తెలుగులో ‘ఇవ్వగలడు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַרְבֵּה מִזֶּה
  choice: దీనికంటే ఎంతో ఎక్కువ
  rationale: తులనాత్మక సమృద్ధిని తెలిపే హీబ్రూ పదబంధాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలోని దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో ఉంచుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నప్పటికీ, ఉచ్చారణకు ‘యాహ్వే’ అనే ప్రత్యామ్నాయం ఉంది.
- issue: יֵשׁ לַיהוָה నిర్మాణంలోని భావం
  choice: యెహోవా ... ఇవ్వగలడు
  alternative: యెహోవా దగ్గర ... ఇవ్వడానికి ఉంది
  rationale: ఈ నిర్మాణం దేవుని సామర్థ్యాన్ని మాత్రమే కాక ఆయన వద్ద ఉన్న సమృద్ధి వనరులను కూడా సూచించగలదు. ప్రధాన పాఠ్యంలో సహజమైన సామర్థ్య భావాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘తలాంతు’ వంటి మూల సంస్కృతి సంబంధిత కొలమానాన్ని నిలిపి, దాని సందర్భ సమాచారాన్ని పాదసూచికలో ఇచ్చాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
