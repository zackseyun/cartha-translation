source:
  edition: WLC
  text: וְ/אִ֣ישׁ הָ/אֱלֹהִ֗ים בָּ֤א אֵלָי/ו֙ לֵ/אמֹ֔ר הַ/מֶּ֕לֶךְ אַל יָבֹ֥א עִמְּ/ךָ֖ צְבָ֣א יִשְׂרָאֵ֑ל כִּ֣י אֵ֤ין יְהוָה֙ עִם יִשְׂרָאֵ֔ל כֹּ֖ל בְּנֵ֥י אֶפְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/007.yaml
  text: But a man of God came to him[a], saying, “O king, do not let the army of Israel go with you, for Yahweh is not with Israel, with all the sons of Ephraim.”
translation:
  language: te
  text: 'కానీ దేవుని మనిషి అతని వద్దకు వచ్చి ఇలా అన్నాడు: “రాజా, ఇశ్రాయేలు సైన్యాన్ని నీతో తీసుకువెళ్లవద్దు; ఎందుకంటే యెహోవా ఇశ్రాయేలుతో—ఎఫ్రాయిము కుమారులందరితో—లేడు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఎఫ్రాయిమీయులందరితో.” హీబ్రూలో అక్షరార్థంగా “ఎఫ్రాయిము కుమారులందరితో” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి ఒకడు
  rationale: ఇది దేవునిచేత నియమించబడిన సందేశకునికి వాడే బిరుదు. సందర్భంలో అతడు మొదటిసారి పరిచయం అవుతున్నందున ‘ఒకడు’ అని అనిర్దిష్ట భావాన్ని నిలిపింది.
- source_word: בָּא אֵלָיו
  choice: అతని దగ్గరికి వచ్చి
  rationale: בוא తో אֶל ఒక వ్యక్తి వైపు రావడాన్ని సూచిస్తుంది; తెలుగులో ఇది సహజమైన వ్యక్తీకరణ.
- source_word: לֵאמֹר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ వాక్యారంభ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో ప్రత్యక్ష సంభాషణకు పరిచయంగా ఇచ్చింది.
- source_word: הַמֶּלֶךְ
  choice: రాజా
  rationale: ఇక్కడ పదం ప్రత్యక్ష సంబోధనలో ఉంది; తెలుగు సంబోధన రూపం మూల భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַל יָבֹא עִמְּךָ
  choice: నీతో కలిసి రాకూడదు
  rationale: אַל తో కూడిన క్రియ నిషేధాన్ని తెలియజేస్తుంది. సైన్యం రాజుతో యుద్ధయాత్రలో చేరకూడదనే భావాన్ని, ‘రా’ అనే మూల క్రియను నిలుపుతూ సహజంగా వ్యక్తం చేసింది.
- source_word: צְבָא יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సైన్యం
  rationale: צָבָא ఇక్కడ సైనిక బలగాన్ని సూచిస్తుంది; ఈ పదబంధం సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: כִּי אֵין יְהוָה עִם יִשְׂרָאֵל
  choice: ఎందుకంటే యెహోవా ఇశ్రాయేలుతో ... లేడు
  rationale: כִּי నిషేధానికి కారణాన్ని పరిచయం చేస్తుంది; אֵין ... עִם అనే నిర్మాణం దేవుని అనుకూల సన్నిధి వారితో లేదని, దాని వేదాంత బలాన్ని తగ్గించకుండా తెలుపుతుంది.
- source_word: כֹּל בְּנֵי אֶפְרָיִם
  choice: ఎఫ్రాయిము కుమారులందరితో
  rationale: ‘ఎఫ్రాయిము కుమారులు’ అనే మూలంలోని వంశపరమైన పదప్రయోగాన్ని నిలిపింది. ఇది ముందున్న ‘ఇశ్రాయేలు’ను ఉత్తర రాజ్య ప్రజలుగా మరింత నిర్దిష్టం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో నాలుగు అక్షరాల దైవనామం నేరుగా ఉంది. దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన నామరూపంగా ఇచ్చింది.
- issue: ‘యెహోవా ... తో లేడు’ అనే ప్రకటన స్వభావం
  choice: యెహోవా ఇశ్రాయేలుతో ... లేడు
  alternative: యెహోవా ఇశ్రాయేలుకు సహాయం చేయడు
  rationale: మూలంలోని ‘తో లేడు’ అనే ఉద్దేశపూర్వకంగా బలమైన, కొంత విస్తృతార్థమున్న మాటను నిర్దిష్టంగా కేవలం సైనిక సహాయానికి పరిమితం చేయలేదు.
- issue: ‘ఇశ్రాయేలు’ మరియు ‘ఎఫ్రాయిము కుమారులందరూ’ మధ్య సంబంధం
  choice: వివరణాత్మక సమానార్థ సంబంధాన్ని విరామచిహ్నాలతో చూపించడం
  alternative: ఇశ్రాయేలుతోను ఎఫ్రాయిము కుమారులందరితోను
  rationale: హీబ్రూలో రెండవ עִם లేదు; చివరి పదబంధం ముందున్న ‘ఇశ్రాయేలు’ను వివరిస్తున్న సమాసోక్తిగా సహజంగా చదవబడుతుంది. డాష్‌లు ఆ సంబంధాన్ని చూపుతూ, మూల వాక్యంలోని సాంద్రతను నిలుపుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే దైవసందేశానికి తగిన గంభీరతను నిలిపింది. సంబోధనలో ‘రాజా’ మరియు దైవనామంగా ‘యెహోవా’ వాడబడ్డాయి.
