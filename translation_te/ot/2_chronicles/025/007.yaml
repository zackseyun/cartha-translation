revisions:
- from: 'అయితే దేవుని మనిషి ఒకడు అతని దగ్గరికి వచ్చి ఇలా అన్నాడు: “రాజా, ఇశ్రాయేలు సైన్యం నీతో కలిసి రాకూడదు. ఎందుకంటే యెహోవా ఇశ్రాయేలుతో—ఎఫ్రాయిము కుమారులందరితో—లేడు.[a]”'
  to: 'కానీ దేవుని మనిషి అతని వద్దకు వచ్చి ఇలా అన్నాడు: “రాజా, ఇశ్రాయేలు సైన్యాన్ని నీతో తీసుకువెళ్లవద్దు; ఎందుకంటే యెహోవా ఇశ్రాయేలుతో—ఎఫ్రాయిము కుమారులందరితో—లేడు.[a]”'
