id: 2CH.25.15
reference: 2 Chronicles 25:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בַּ/אֲמַצְיָ֑הוּ וַ/יִּשְׁלַ֤ח אֵלָי/ו֙ נָבִ֔יא וַ/יֹּ֣אמֶר ל֗/וֹ לָ֤/מָּה דָרַ֨שְׁתָּ֙ אֶת אֱלֹהֵ֣י הָ/עָ֔ם אֲשֶׁ֛ר לֹא הִצִּ֥ילוּ אֶת עַמָּ֖/ם מִ/יָּדֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/015.yaml
  text: Then Yahweh’s anger burned against Amaziah[a], and he sent a prophet to him, who said to him, “Why have you sought the gods of the people who did not deliver their people from your hand?”
translation:
  language: te
  text: అప్పుడు అమజ్యా మీద యాహ్వే కోపం రగులుకుంది. ఆయన అతని దగ్గరకు ఒక ప్రవక్తను పంపాడు. ఆ ప్రవక్త అతనితో, “నీ చేతిలోనుండి తమ ప్రజలను విడిపించని ఆ ప్రజల దేవుళ్లను నీవెందుకు వెదికావు[a]?” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సంప్రదించావు” లేదా “వారి దగ్గర విచారించావు.”
    reason: דרש అనే హీబ్రూ క్రియకు ఈ సందర్భంలో వెదకడం, సంప్రదించడం, విచారించడం అనే సమీపార్థాలు ఉన్నాయి.
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: కోపం రగులుకుంది
  rationale: కోపం మండడం అనే హీబ్రూ నుడికారంలోని సజీవ చిత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ ఉచ్చారణను తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: בַּאֲמַצְיָהוּ
  choice: అమజ్యా మీద
  rationale: కోపం ఎవరిపై ఉందో సూచించే హీబ్రూ ఉపసర్గ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נָבִיא
  choice: ఒక ప్రవక్త
  rationale: దేవుని సందేశవాహకుణ్ణి సూచించే పదానికి ప్రామాణికమైన తెలుగు అనువాదం.
- source_word: דָרַשְׁתָּ
  choice: వెదికావు
  rationale: ఈ క్రియలోని వెదకడం, విచారించడం, సంప్రదించడం అనే విస్తృత మతపరమైన భావాన్ని ప్రధాన పాఠంలో అతిగా నిర్దిష్టం చేయకుండా ఉంచుతుంది.
- source_word: אֱלֹהֵי הָעָם
  choice: ఆ ప్రజల దేవుళ్లు
  rationale: సందర్భంలోని ఓడిపోయిన ప్రజల దేవతలను సూచించే నిర్మాణాన్ని స్పష్టంగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: אֲשֶׁר לֹא הִצִּילוּ
  choice: విడిపించని
  rationale: హీబ్రూ పాఠం వారి అసమర్థతను నేరుగా ప్రకటించకుండా, వారు తమ ప్రజలను రక్షించలేదనే వాస్తవాన్నే చెబుతుంది.
- source_word: עַמָּם
  choice: తమ ప్రజలను
  rationale: హీబ్రూ స్వామ్యసూచక భావాన్ని అదనపు వివరణ లేకుండా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִיָּדֶךָ
  choice: నీ చేతిలోనుండి
  rationale: అధికారం లేదా నియంత్రణను సూచించే హీబ్రూ రూపకాన్ని అర్థమయ్యే తెలుగులో అలాగే నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా, ‘Yahweh’ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- issue: דרש అనే క్రియలోని మతపరమైన చర్య
  choice: వెదికావు
  alternative: సంప్రదించావు; విచారించావు; ఆశ్రయించావు
  rationale: రాజు ఆ దేవుళ్లవైపు తిరిగిన చర్యను ఈ పదం విస్తృతంగా తెలియజేస్తుంది; అది కేవలం ఆరాధనో, సలహా కోరడమో అని పాఠం చెప్పనిదాన్ని నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. హీబ్రూ కోప నుడికారాన్ని ‘కోపం రగులుకుంది’గా, అధికారాన్ని సూచించే ‘చేతి’ రూపకాన్ని ‘నీ చేతిలోనుండి’గా నిలిపాం. పలుమార్లు వచ్చే సర్వనామాల వల్ల గందరగోళం రాకుండా రెండో వాక్యంలో ‘ఆ ప్రవక్త’ అని స్పష్టం చేశాం.
