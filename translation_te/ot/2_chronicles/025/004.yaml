  revised_text: 'అయితే అతడు వారి కుమారులను మరణశిక్షకు గురిచేయలేదు.[a] ఎందుకంటే ధర్మశాస్త్రంలో, అంటే మోషే గ్రంథంలో, యాహ్వే ఇలా ఆజ్ఞాపించినట్టు వ్రాయబడి ఉంది: “కుమారుల కారణంగా తండ్రులకు మరణశిక్ష విధించకూడదు; తండ్రుల కారణంగా కుమారులకు మరణశిక్ష విధించకూడదు; ప్రతి వ్యక్తికి తన సొంత పాపానికే మరణశిక్ష విధించాలి.”'
