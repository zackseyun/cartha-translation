revisions:
- from: 'అయితే అతడు వారి కుమారులను చంపించలేదు. ఎందుకంటే మోషే గ్రంథంలోని ధర్మశాస్త్రంలో యెహోవా ఇలా ఆజ్ఞాపించినట్టు రాసి ఉంది: “కుమారుల కారణంగా తండ్రులను చంపకూడదు; తండ్రుల కారణంగా కుమారులను చంపకూడదు. ప్రతి వ్యక్తి తన సొంత పాపం కారణంగానే చనిపోవాలి.”'
  to: 'అయితే అతడు వారి కుమారులను మరణశిక్షకు గురిచేయలేదు.[a] ఎందుకంటే ధర్మశాస్త్రంలో, అంటే మోషే గ్రంథంలో, యాహ్వే ఇలా ఆజ్ఞాపించినట్టు వ్రాయబడి ఉంది: “కుమారుల కారణంగా తండ్రులకు మరణశిక్ష విధించకూడదు; తండ్రుల కారణంగా కుమారులకు మరణశిక్ష విధించకూడదు; ప్రతి వ్యక్తికి తన సొంత పాపానికే మరణశిక్ష విధించాలి.”'
  rationale: సందర్భంలో రాజు హంతకులను శిక్షించిన తరువాత వారి కుమారులను శిక్షించకపోవడం చెప్పబడుతోంది. అందువల్ల ప్రధాన పాఠంలో న్యాయపరమైన మరణశిక్షను స్పష్టపరచి, మూలంలోని ‘చనిపోవడం’ అనే అక్షరార్థాన్ని పాదటిప్పణిలో నిలిపాం. మూడు న్యాయవాక్యాల్లో సమాంతరమైన పదప్రయోగం వాడాం. దైవనామాన్ని యాహ్వేగా సవరించాం; ధర్మశాస్త్రం మరియు మోషే గ్రంథం అనే ద్వంద్వ సూచనను సహజంగా స్పష్టం చేశాం.
