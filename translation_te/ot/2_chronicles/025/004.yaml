source:
  edition: WLC
  text: וְ/אֶת בְּנֵי/הֶ֖ם לֹ֣א הֵמִ֑ית כִּ֣י כַ/כָּת֣וּב בַּ/תּוֹרָ֡ה בְּ/סֵ֣פֶר מֹשֶׁה֩ אֲשֶׁר צִוָּ֨ה יְהוָ֜ה לֵ/אמֹ֗ר לֹא יָמ֨וּתוּ אָב֤וֹת עַל בָּנִים֙ וּ/בָנִים֙ לֹא יָמ֣וּתוּ עַל אָב֔וֹת כִּ֛י אִ֥ישׁ בְּ/חֶטְא֖/וֹ יָמֽוּתוּ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/004.yaml
  text: But he did not put their sons to death[a], because it is written in the Law, in the Book of Moses, where Yahweh commanded, saying, “Fathers shall not be put to death for sons, and sons shall not be put to death for fathers, but each man shall die for his own sin.”
translation:
  language: te
  text: 'అయితే అతడు వారి కుమారులను మరణశిక్షకు గురిచేయలేదు.[a] ఎందుకంటే ధర్మశాస్త్రంలో, అంటే మోషే గ్రంథంలో, యాహ్వే ఇలా ఆజ్ఞాపించినట్టు వ్రాయబడి ఉంది: “కుమారుల కారణంగా తండ్రులకు మరణశిక్ష విధించకూడదు; తండ్రుల కారణంగా కుమారులకు మరణశిక్ష విధించకూడదు; ప్రతి వ్యక్తికి తన సొంత పాపానికే మరణశిక్ష విధించాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తండ్రులు కుమారుల కారణంగా చనిపోకూడదు, కుమారులు తండ్రుల కారణంగా చనిపోకూడదు.” హెబ్రీ న్యాయప్రయోగం న్యాయపరమైన మరణశిక్షను సూచిస్తున్నందున ప్రధాన పాఠంలో ‘మరణశిక్ష’ అని స్పష్టం చేశాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת בְּנֵיהֶם לֹא הֵמִית
  choice: అయితే అతడు వారి కుమారులను చంపించలేదు
  rationale: సందర్భంలో ముందటి వచనంలోని హత్యకారుల మరణశిక్షకు వ్యతిరేకతను וְ సూచిస్తోంది; అందువల్ల ‘అయితే’ సహజం. מות హిఫీల్ రూపంలోని కారణార్థాన్ని ‘చంపించలేదు’ తెలియజేస్తుంది. בְּנֵיהֶם ను నిర్దిష్టంగా ‘వారి కుమారులు’గా ఉంచాం.
- source_word: כִּי כַכָּתוּב
  choice: ఎందుకంటే ... రాసి ఉంది
  rationale: כִּי యొక్క కారణార్థాన్నీ, כַכָּתוּב అనే లిఖిత ఆధార సూచననూ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בַּתּוֹרָה בְּסֵפֶר מֹשֶׁה
  choice: మోషే గ్రంథంలోని ధర్మశాస్త్రంలో
  rationale: రెండు పదబంధాల సంబంధాన్ని సహజ తెలుగులో చూపుతూ, תּוֹרָה యొక్క బోధన-న్యాయ భావాన్ని ‘ధర్మశాస్త్రం’గా అందిస్తుంది.
- source_word: אֲשֶׁר צִוָּה יְהוָה לֵאמֹר
  choice: యెహోవా ఇలా ఆజ్ఞాపించినట్టు
  rationale: దైవ ఆజ్ఞ మరియు తరువాత వచ్చే ప్రత్యక్ష ఉటంకింపును స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: לֹא יָמוּתוּ אָבוֹת עַל בָּנִים
  choice: కుమారుల కారణంగా తండ్రులను చంపకూడదు
  rationale: మూలంలో ‘చనిపోకూడదు’ అనే రూపం ఉన్నా, సందర్భం న్యాయపరమైన మరణశిక్ష గురించి కాబట్టి తెలుగులో ‘చంపకూడదు’ ఆ న్యాయ భావాన్ని స్పష్టం చేస్తుంది. עַל ను బాధ్యత/కారణ భావంలో అనువదించాం.
- source_word: וּבָנִים לֹא יָמוּתוּ עַל אָבוֹת
  choice: తండ్రుల కారణంగా కుమారులను చంపకూడదు
  rationale: మొదటి నిషేధానికి సమాంతర నిర్మాణాన్ని నిలుపుతూ కుటుంబ సభ్యుడి పాపానికి మరొకరిని మరణశిక్షకు గురిచేయరాదనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: כִּי אִישׁ בְּחֶטְאוֹ יָמוּתוּ
  choice: ప్రతి వ్యక్తి తన సొంత పాపం కారణంగానే చనిపోవాలి
  rationale: אִישׁ కు ఇక్కడ పంపిణీ భావం ఉంది; లింగాన్ని అనవసరంగా ముందుకు తేవకుండా ‘ప్రతి వ్యక్తి’ ఆ సాధారణ న్యాయసూత్రాన్ని తెలుపుతుంది. ‘తన సొంత పాపం’ వ్యక్తిగత బాధ్యతను కాపాడుతుంది. చివరి క్రియ బహువచన రూపంలో ఉన్నా భావం పంపిణీ ఏకవచనం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగానే ఉంచాం. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన సాధ్యమైన ప్రత్యామ్నాయం.
- issue: יָמוּתוּ అనే ‘చనిపోవాలి/చంపబడాలి’ ఉద్వేగం
  choice: మొదటి రెండు న్యాయ నిషేధాల్లో ‘చంపకూడదు’; చివరి వాక్యంలో ‘చనిపోవాలి’
  alternative: మూడు చోట్లా ‘చనిపోకూడదు/చనిపోవాలి’
  rationale: మూల క్రియ ‘చనిపోవడం’ అనే రూపాన్నే వాడుతుంది; అయితే ద్వితీయోపదేశకాండ న్యాయసూత్ర సందర్భంలో మొదటి రెండు వాక్యాలకు ‘చంపకూడదు’ న్యాయపరమైన భావాన్ని స్పష్టం చేస్తుంది. చివరి వాక్యంలో మూలంలోని విస్తృతమైన వ్యక్తిగత పాపబాధ్యత భావాన్ని సంకుచితం చేయకుండా ‘చనిపోవాలి’గా ఉంచాం.
translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు; చారిత్రక-న్యాయ సందర్భానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని తండ్రులు–కుమారులు అనే సమాంతర పదజాలాన్ని నిలిపి, చివరి పంపిణీ సూత్రాన్ని ‘ప్రతి వ్యక్తి’గా స్పష్టీకరించాం.
