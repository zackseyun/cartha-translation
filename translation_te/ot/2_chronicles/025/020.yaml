source:
  edition: WLC
  text: וְ/לֹא שָׁמַ֣ע אֲמַצְיָ֔הוּ כִּ֤י מֵ/הָֽ/אֱלֹהִים֙ הִ֔יא לְמַ֖עַן תִּתָּ֣/ם בְּ/יָ֑ד כִּ֣י דָֽרְשׁ֔וּ אֵ֖ת אֱלֹהֵ֥י אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/020.yaml
  text: But Amaziah would not listen[a], for it was from God, in order to give them into the hand of their enemies, because they had sought the gods of Edom.
translation:
  language: te
  text: కానీ అమజ్యా వినలేదు; వారు ఎదోము దేవుళ్లను ఆశ్రయించినందున, వారిని శత్రువుల చేతికి అప్పగించాలనే ఉద్దేశంతో అతడు వినకపోవడం దేవుని నుండే జరిగింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “చేతిలోకి అప్పగించడానికి.” “చేతిలోకి” అనేది మరొకరి అధికారానికి అప్పగించడాన్ని సూచించే హీబ్రూ నుడికారం. “శత్రువుల” అనే పదం సందర్భం నుండి చేర్చబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: వినలేదు
  rationale: ఈ సందర్భంలో హెచ్చరికను కేవలం వినడం కాక దానికి లోబడడం అనే భావం ఉంది. తెలుగులో ‘వినలేదు’ ఈ రెండింటినీ సహజంగా సూచిస్తుంది.
- source_word: מֵהָאֱלֹהִים הִיא
  choice: అది దేవుని నుంచే జరిగింది
  rationale: స్త్రీలింగ సర్వనామం ముందున్న పరిస్థితిని లేదా అమజ్యా వినకపోవడాన్ని సూచించవచ్చు. ‘అది’ ఈ సూచనలోని అస్పష్టతను నిలుపుతూ దేవుని కారణత్వాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְמַעַן
  choice: అప్పగించాలనే ఉద్దేశంతో
  rationale: ఈ పదంలోని ఉద్దేశార్థాన్ని స్పష్టంగా ఉంచుతుంది; కేవలం ఫలితంగా మాత్రమే మృదుపరచదు.
- source_word: תִּתָּם
  choice: వారిని ... అప్పగించడానికి
  rationale: נתן + בְּיַד అనే హీబ్రూ ప్రయోగం మరొకరి అధికారానికి లేదా ఓటమికి అప్పగించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘అప్పగించడం’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: בְּיָד
  choice: శత్రువుల చేతికి
  rationale: ‘చేతిలో/చేతికి’ అనేది అధికారానికి అప్పగించడాన్ని సూచించే హీబ్రూ నుడికారం. శత్రువులు మూలపాఠంలో ప్రత్యక్షంగా లేకపోయినా సందర్భం వారిని సూచిస్తుంది; ఈ సరఫరాను పాదటిప్పణిలో తెలియజేశాం.
- source_word: דָרְשׁוּ
  choice: ఆశ్రయించారు
  rationale: దేవతలను వెదకడం, సంప్రదించడం, ఆరాధనాపూర్వకంగా వాటిపై ఆధారపడడం అనే సందర్భార్థాన్ని ‘ఆశ్రయించారు’ సహజంగా తెలియజేస్తుంది; నిర్దిష్ట ఆరాధనా విధానాన్ని అనవసరంగా చేర్చదు.
- source_word: אֱלֹהֵי אֱדוֹם
  choice: ఎదోము దేవుళ్లు
  rationale: నిర్మాణ సంబంధాన్ని నేరుగా, స్పష్టంగా తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: అమజ్యా వినకపోవడంలోను రాబోయే ఓటమిలోను దేవుని కారణత్వం
  choice: అమజ్యా వినకపోవడం దేవుని నుంచే జరిగిందనీ, విగ్రహారాధన కారణంగా వారిని అప్పగించాలనే ఉద్దేశం అందులో ఉందనీ వాక్యం చెప్పినట్లే అనువదించడం
  alternative: దేవుడు దీనిని కేవలం అనుమతించాడని మృదువుగా అనువదించడం
  rationale: మూలపాఠం ‘దేవుని నుండి’ అని స్పష్టంగా చెప్పి לְמַעַן ద్వారా ఉద్దేశాన్ని సూచిస్తుంది. అందువల్ల దైవిక క్రియాశీలతను తగ్గించకుండా, దానిని మరింత సిద్ధాంతపరంగా వివరించకుండా ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘అది’ అనే పదం దేనిని సూచిస్తుందో మూలంలోని కొంత అస్పష్టతను నిలిపింది. కారణం–ఉద్దేశం సంబంధాన్ని స్పష్టంగా ఉంచేందుకు వాక్య క్రమాన్ని తెలుగుకు అనుగుణంగా అమర్చాం.
