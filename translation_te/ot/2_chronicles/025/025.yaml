source:
  edition: WLC
  text: וַ/יְחִ֨י אֲמַצְיָ֤הוּ בֶן יוֹאָשׁ֙ מֶ֣לֶךְ יְהוּדָ֔ה אַחֲרֵ֣י מ֔וֹת יוֹאָ֥שׁ בֶּן יְהוֹאָחָ֖ז מֶ֣לֶךְ יִשְׂרָאֵ֑ל חֲמֵ֥שׁ עֶשְׂרֵ֖ה שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/025.yaml
  text: Amaziah son of Joash[a], king of Judah, lived fifteen years after the death of Joash son of Jehoahaz, king of Israel.
translation:
  language: te
  text: యూదా రాజైన యోవాషు కుమారుడు అమజ్యా, ఇశ్రాయేలు రాజైన యెహోయాహాజు కుమారుడు యోవాషు చనిపోయిన తర్వాత పదిహేను సంవత్సరాలు జీవించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీయ మూలంలో అక్షరార్థంగా, “యోవాషు మరణించిన తర్వాత పదిహేను సంవత్సరాలు జీవించాడు.” భావం: అమజ్యా ఇశ్రాయేలు రాజైన యోవాషుకంటే పదిహేను సంవత్సరాలు ఎక్కువకాలం జీవించాడు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: జీవించాడు
  rationale: ఈ సందర్భంలో חיה క్రియ అమజ్యా మరొక రాజు మరణించిన తర్వాత కూడా నిర్దిష్ట కాలం జీవించి ఉన్నాడని తెలిపే కాలక్రమిక వాక్యం. ‘జీవించాడు’ మూలంలోని సాధారణ భావాన్ని కాపాడుతుంది; ‘బతికి ఉన్నాడు’ లేదా ‘అతనికంటే ఎక్కువకాలం జీవించాడు’ మరింత వ్యాఖ్యానాత్మకం.
- source_word: אֲמַצְיָהוּ
  choice: అమజ్యా
  rationale: తెలుగు బైబిలు నామరూపాలకు అనుగుణమైన లిప్యంతరీకరణ.
- source_word: בֶן יוֹאָשׁ
  choice: యోవాషు కుమారుడు
  rationale: వంశపరమైన గుర్తింపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన
  rationale: రాజ్యాధికార సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ హెబ్రీయ మూలార్థాన్ని నిలుపుతుంది.
- source_word: אַחֲרֵי מוֹת
  choice: చనిపోయిన తర్వాత
  rationale: హెబ్రీయ నామవాచక నిర్మాణమైన ‘మరణం తర్వాత’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగు క్రియారూపంలో స్పష్టంగా అందిస్తుంది.
- source_word: יְהוֹאָחָז
  choice: యెహోయాహాజు
  rationale: హెబ్రీయ దైవనామ మూలకాన్ని ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజైన
  rationale: మూలంలోని రాజ్యాధికార సంబంధాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంలో అందిస్తుంది.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: పదిహేను సంవత్సరాలు
  rationale: సంఖ్యా పదబంధానికి నేరమైన, సహజమైన తెలుగు అనువాదం.
