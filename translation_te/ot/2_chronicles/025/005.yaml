  to: అప్పుడు అమజ్యా యూదావారిని సమకూర్చి, యూదా బెన్యామీనులందరినీ వారి పితృగృహాల ప్రకారం వెయ్యిమందికి, వందమందికి అధిపతుల కింద ఏర్పాటు చేశాడు. ఇరవై సంవత్సరాల వయస్సు నుండి అంతకంటే పైబడిన వారిని అతడు సైనిక లెక్క తీసుకున్నాడు. వారిలో యుద్ధానికి బయలుదేరేవారైన[b] ఈటెను, డాలును[c] పట్టగల ఎంపికైన పురుషులు[a] మూడు లక్షల మంది ఉన్నట్లు అతనికి తెలిసింది.
