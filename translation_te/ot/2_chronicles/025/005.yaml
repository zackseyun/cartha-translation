source:
  edition: WLC
  text: וַ/יִּקְבֹּ֤ץ אֲמַצְיָ֨הוּ֙ אֶת יְהוּדָ֔ה וַ/יַּֽעֲמִידֵ֣/ם לְ/בֵית אָב֗וֹת לְ/שָׂרֵ֤י הָ/אֲלָפִים֙ וּ/לְ/שָׂרֵ֣י הַ/מֵּא֔וֹת לְ/כָל יְהוּדָ֖ה וּ/בִנְיָמִ֑ן וַֽ/יִּפְקְדֵ֗/ם לְ/מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה וַ/יִּמְצָאֵ֗/ם שְׁלֹשׁ מֵא֨וֹת אֶ֤לֶף בָּחוּר֙ יוֹצֵ֣א צָבָ֔א אֹחֵ֖ז רֹ֥מַח וְ/צִנָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/005.yaml
  text: Then Amaziah gathered Judah and appointed them by fathers’ houses under commanders of thousands and commanders of hundreds[a], for all Judah and Benjamin. He mustered them from twenty years old and upward, and found them to be three hundred thousand choice men, going out to war[c][b], able to handle spear and shield.
translation:
  language: te
  text: అప్పుడు అమజ్యా యూదావారిని సమకూర్చి, యూదా బెన్యామీనులందరినీ వారి పితృగృహాల ప్రకారం వెయ్యిమందికి, వందమందికి అధిపతుల కింద ఏర్పాటు చేశాడు. ఇరవై సంవత్సరాల వయస్సు నుండి అంతకంటే పైబడిన వారిని అతడు సైనిక లెక్క తీసుకున్నాడు. వారిలో యుద్ధానికి బయలుదేరేవారైన[b] ఈటెను, డాలును[c] పట్టగల ఎంపికైన పురుషులు[a] మూడు లక్షల మంది ఉన్నట్లు అతనికి తెలిసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఎంపికైన పురుషులు’ అనే చోట ‘యువకులు’ అని కూడా అనువదించవచ్చు. హీబ్రూ בָּחוּר అనే పదం యువకుణ్ణి సూచించగలదు; ఇక్కడ సైనిక లెక్క సందర్భంలో ఎంపికైన లేదా సమర్థుడైన యోధుడు అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘యుద్ధానికి బయలుదేరేవారు.’ ఇది సైనిక సేవకు వెళ్లేవారిని సూచించే హీబ్రూ ప్రయోగం.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ צִנָּה ప్రత్యేకంగా పెద్ద డాలును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: సమకూర్చి
  rationale: קבץ ప్రజలను ఒకచోట కూడగట్టడాన్ని సూచిస్తుంది; ‘సమకూర్చి’ ఆధునిక తెలుగులో సహజంగా ఉండి, సైనిక సందర్భాన్నీ మోయగలదు.
- source_word: וַיַּעֲמִידֵם
  choice: నిలబెట్టాడు
  rationale: హిఫిల్ రూపం ‘నిలబెట్టు/నియమించు/ఏర్పాటు చేయు’ అనే పరిధి కలది. ఇక్కడ అధిపతుల కింద విభాగాలుగా ఉంచిన భావాన్ని ‘నిలబెట్టాడు’ మూలానికి దగ్గరగా కాపాడుతుంది.
- source_word: לְבֵית אָבוֹת
  choice: వారి పితృవంశాల ప్రకారం
  rationale: ఈ పదబంధం తండ్రుల గృహాల ఆధారంగా ఏర్పడిన వంశ లేదా కుటుంబ విభాగాలను సూచిస్తుంది; ‘పితృవంశాలు’ ఆ సామాజిక నిర్మాణాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: לְשָׂרֵי הָאֲלָפִים וּלְשָׂרֵי הַמֵּאוֹת
  choice: వేలమందికి అధిపతుల కింద, వందమందికి అధిపతుల కింద
  rationale: శׂרים సైనిక-పరిపాలనా నాయకులు. సంఖ్యాపరమైన అధికార శ్రేణిని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: וַיִּפְקְדֵם
  choice: సైనిక లెక్కలో చేర్చాడు
  rationale: פקד ఇక్కడ కేవలం సంఖ్య లెక్కించడం కాక సైనిక జనగణన లేదా సమీక్ష చేయడం; ఈ అనువాదం ఆ సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְמִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ఇరవై ఏళ్లు మొదలుకొని అంతకంటే ఎక్కువ వయసున్న వారిని
  rationale: వయోపరిమితిని తెలిపే హీబ్రూ సూత్రాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיִּמְצָאֵם
  choice: ఉన్నట్లు తెలిసింది
  rationale: מצא ఇక్కడ లెక్కింపు ఫలితాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘ఉన్నట్లు తెలిసింది’ ఆ ఫలితార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: בָּחוּר
  choice: ఎంపికైన పురుషులు
  rationale: בחור ‘యువకులు’ అని కూడా అర్థమవుతుంది; ఈ సైనిక లెక్క సందర్భంలో ఎంపికైన లేదా సమర్థులైన పురుషులు అనే భావం సంభావ్యమైనది. ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: יוֹצֵא צָבָא
  choice: యుద్ధానికి బయలుదేరేవారు
  rationale: అక్షరార్థమైన ‘సైన్యానికి/యుద్ధానికి బయలుదేరు’ అనే రూపాన్ని కాపాడుతుంది; ‘యుద్ధానికి తగినవారు’ అని భావాన్ని ముందే నిర్ణయించదు.
- source_word: אֹחֵז רֹמַח וְצִנָּה
  choice: ఈటెను, డాలును పట్టగల
  rationale: אחז ఆయుధాన్ని పట్టడం లేదా ప్రయోగించడం సూచిస్తుంది. ‘పట్టగల’ సైనిక సామర్థ్యాన్ని సహజంగా తెలుపుతుంది; צנה యొక్క పెద్ద డాలు అనే ప్రత్యేకత పాదసూచికలో ఇవ్వబడింది.
