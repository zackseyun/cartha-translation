translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘పితృవంశాలు,’ ‘అధిపతులు,’ ‘సైనిక లెక్క’ వంటి పదాలు పరిపాలనా-సైనిక సందర్భాన్ని సాధారణ పాఠకునికి స్పష్టంగా ఉంచుతాయి. మూలంలోని పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, సమాచార సంబంధాలను తెలుగులో సహజంగా అమర్చాం; అయితే בָּחוּר మరియు יוֹצֵא צָבָאలోని అర్థసంభావ్యతలను పాదసూచికలతో కాపాడాం.
