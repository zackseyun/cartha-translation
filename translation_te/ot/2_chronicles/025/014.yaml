source:
  edition: WLC
  text: וַ/יְהִ֗י אַחֲרֵ֨י ב֤וֹא אֲמַצְיָ֨הוּ֙ מֵֽ/הַכּ֣וֹת אֶת אֲדוֹמִ֔ים וַ/יָּבֵ֗א אֶת אֱלֹהֵי֙ בְּנֵ֣י שֵׂעִ֔יר וַ/יַּֽעֲמִידֵ֥/ם ל֖/וֹ לֵ/אלֹהִ֑ים וְ/לִ/פְנֵי/הֶ֥ם יִֽשְׁתַּחֲוֶ֖ה וְ/לָ/הֶ֥ם יְקַטֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/014.yaml
  text: It happened[a], after Amaziah came from striking down the Edomites, that he brought the gods of the sons of Seir and set them up for himself as gods; and before them he bowed down[c][b], and to them he burned incense.
translation:
  language: te
  text: 'అమజ్యా ఎదోమీయులను కొట్టి తిరిగి వచ్చిన తరువాత ఇలా జరిగింది: అతడు శేయీరు ప్రజల దేవుళ్లను తీసుకొచ్చి, వాటిని తనకు దేవుళ్లుగా ప్రతిష్ఠించాడు. వాటి ముందు సాష్టాంగపడి[a], వాటికి ధూపం వేశాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటి ముందు సాగిలపడ్డాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי בּוֹא
  choice: తిరిగి వచ్చిన తరువాత
  rationale: ఈ కథన నిర్మాణం తరువాత జరిగిన సంఘటనను పరిచయం చేస్తుంది. בוא యొక్క మూలార్థం ‘రావడం’; ఇక్కడ యుద్ధం నుంచి రావడమనే సందర్భార్థాన్ని సహజమైన తెలుగులో ‘తిరిగి వచ్చిన తరువాత’ అని వ్యక్తం చేశాం.
- source_word: מֵהַכּוֹת אֶת אֲדוֹמִים
  choice: ఎదోమీయులను హతమార్చి
  rationale: נכה అనే క్రియలో కొట్టడం లేదా హతమార్చడం అనే స్పష్టమైన బలప్రయోగ భావం ఉంది. కేవలం ‘ఓడించి’ అనడం కంటే ‘హతమార్చి’ ఆ భావాన్ని కాపాడుతుంది; అయితే సంపూర్ణ నిర్మూలనను సూచించదు.
- source_word: אֱלֹהֵי בְּנֵי שֵׂעִיר
  choice: శేయీరు వంశస్థుల దేవుళ్లు
  rationale: ఇక్కడ אֱלֹהֵי బహువచనంలో అన్య దేవతలను సూచిస్తుంది. בְּנֵי అనే బంధుత్వ పదబంధాన్ని తెలుగులో సహజంగా, దాని వంశసంబంధ భావాన్ని నిలుపుతూ ‘వంశస్థులు’గా ఇచ్చాం.
- source_word: וַיַּעֲמִידֵם לוֹ לֵאלֹהִים
  choice: వాటిని తనకు దేవుళ్లుగా నిలబెట్టుకున్నాడు
  rationale: హిఫిల్ రూపంలోని עמד వాటిని ప్రతిష్ఠించడం లేదా నిలబెట్టడం అనే భావాన్ని ఇస్తుంది. ‘నిలబెట్టుకున్నాడు’ భౌతిక స్థాపనతోపాటు వాటిని తన దేవుళ్లుగా స్వీకరించిన భావాన్నీ నిలుపుతుంది.
- source_word: וְלִפְנֵיהֶם יִשְׁתַּחֲוֶה
  choice: వాటి ముందు సాష్టాంగపడ్డాడు
  rationale: השתחוה వంగి నేలకు సాగిలపడే ఆరాధనా క్రియను సూచిస్తుంది. ‘సాష్టాంగపడ్డాడు’ ఆ శారీరక క్రియను స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְלָהֶם יְקַטֵּר
  choice: వాటికి ధూపం వేశాడు
  rationale: క్రియారూపమైన קטר ఇక్కడ ధూపం కాల్చి అర్పించడాన్ని సూచిస్తుంది. ‘ధూపం వేశాడు’ ఆధునిక తెలుగులో సహజమైన ఆరాధనా ప్రయోగం.
theological_decisions:
- issue: అన్య దేవతలకు אֱלֹהִים/אֱלֹהֵי పదాన్ని అనువదించడం
  choice: దేవుళ్లు
  alternative: దైవిక శక్తులు
  rationale: ఈ సందర్భంలో శేయీరు ప్రజల ఆరాధ్య దేవతలే ఉద్దేశించబడ్డాయి. ‘దేవుళ్లు’ అనేది సహజమైన బహువచన అనువాదం; వాక్యంలోని విగ్రహారాధన భావాన్నీ వ్యంగ్య ఉద్రిక్తతనూ మసకబార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలి. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా సహజమైన కాలక్రమంతో వాక్యాన్ని నిర్మించాం; అన్య దేవతలను సూచించే నపుంసక బహువచన సర్వనామాలు తెలుగులో సహజంగా ఉపయోగించాం.
