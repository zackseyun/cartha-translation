  source_fidelity: ‘హతమార్చి’ నఖా (נכה) యొక్క ‘కొట్టడం/దెబ్బతీయడం’ భావాన్ని అన్ని ఎదోమీయుల మరణంగా నిర్దిష్టం చేసే ప్రమాదం ఉంది. అలాగే ‘నిలబెట్టుకున్నాడు’లోని ‘కున్నాడు’ మూలంలోని భౌతికంగా స్థాపించడం అనే ప్రధాన క్రియను కొంత అస్పష్టం చేస్తుంది. సవరించిన పాఠం వయ్యహీ కథనారంభాన్ని, శేయీరు ప్రజల దేవతలను తీసుకురావడం, వాటిని తన దేవుళ్లుగా స్థాపించడం, వాటి ముందు సాగిలపడడం, వాటికి ధూపం వేయడం అనే అన్ని అంశాలను నిలుపుతుంది.
  naturalness: ‘ఇలా జరిగింది’ ఆధునిక ప్రామాణిక తెలుగులో కథనారంభాన్ని సహజంగా వ్యక్తం చేస్తుంది. ‘ఎదోమీయులను కొట్టి తిరిగి వచ్చిన తరువాత’ యుద్ధసందర్భంలో సహజంగా ఉండి, మూలక్రియలోని బలప్రయోగ భావాన్ని కాపాడుతుంది. ‘తనకు దేవుళ్లుగా ప్రతిష్ఠించాడు’ స్పష్టమైన, గంభీరమైన కథనశైలి ప్రయోగం.
