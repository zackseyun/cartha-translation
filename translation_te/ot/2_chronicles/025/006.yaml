  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. సంఖ్యకు ‘లక్షమంది’ అనే సాధారణ తెలుగు రూపం తీసుకోబడింది; ప్రాచీన బరువు/ధన ప్రమాణమైన ‘తలాంతు’ మాత్రం సంరక్షించబడింది.
