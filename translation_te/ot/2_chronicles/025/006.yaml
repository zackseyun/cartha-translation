  text: And he hired from Israel one hundred thousand mighty men of valor for one hundred talents of silver[a].
translation:
  language: te
  text: అతడు ఇశ్రాయేలు నుండి లక్షమంది పరాక్రమవంతులైన యోధులను వంద తలాంతుల వెండి చెల్లించి నియమించుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరాక్రమశాలులైన పోరాట యోధులను” లేదా “సమర్థులైన సైనికులను.” హీబ్రూ పదబంధం యుద్ధానికి సమర్థులైన ధైర్యవంతులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂכֹּר
  choice: కూలికి తీసుకున్నాడు
  rationale: שׂכר అనే క్రియకు ఇక్కడ వేతనం చెల్లించి నియమించుకోవడం అనే అర్థం ఉంది. ‘కిరాయి సైనికులను’ అని అనడం సందర్భానికి సరిపోవచ్చుగాని, మూలంలో లేని నామవాచక భావాన్ని స్పష్టంగా జోడిస్తుంది.
- source_word: מִיִּשְׂרָאֵל
  choice: ఇశ్రాయేలు నుండి
  rationale: מן మూలం లేదా వచ్చిన స్థలాన్ని సూచిస్తుంది; ఇక్కడ సైనికులు ఉత్తర రాజ్యమైన ఇశ్రాయేలు నుండి తీసుకోబడ్డారని సహజంగా తెలియజేస్తుంది.
- source_word: מֵאָה אֶלֶף
  choice: లక్షమంది
  rationale: మూలంలోని ‘వంద వేల’ అనే సంఖ్యకు ఆధునిక తెలుగులో సహజమైన, ఖచ్చితమైన రూపం ‘లక్షమంది’.
- source_word: גִּבּוֹר חָיִל
  choice: పరాక్రమవంతులైన యోధులు
  rationale: ఈ హీబ్రూ పదబంధం బలసామర్థ్యమూ యుద్ధనైపుణ్యమూ గల ధైర్యవంతులైన పోరాట యోధులను సూచిస్తుంది. ఎంపిక చేసిన పదబంధం సైనిక సందర్భాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: בְּמֵאָה כִכַּר כָּסֶף
  choice: వంద తలాంతుల వెండికి
  rationale: בְּ ఇక్కడ ధర లేదా చెల్లింపును సూచిస్తుంది. ప్రాచీన కొలమానాన్ని మార్చకుండా ‘తలాంతులు’గా ఉంచి, తెలుగులో ధరను సహజంగా వ్యక్తం చేస్తుంది.
