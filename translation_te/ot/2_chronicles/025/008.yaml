source:
  edition: WLC
  text: כִּ֚י אִם בֹּ֣א אַתָּ֔ה עֲשֵׂ֖ה חֲזַ֣ק לַ/מִּלְחָמָ֑ה יַכְשִֽׁילְ/ךָ֤ הָֽ/אֱלֹהִים֙ לִ/פְנֵ֣י אוֹיֵ֔ב כִּ֥י יֶשׁ כֹּ֛חַ בֵּ/אלֹהִ֖ים לַ/עְז֥וֹר וּ/לְ/הַכְשִֽׁיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/008.yaml
  text: But if you do go[a], act resolutely in battle; God will make you stumble before the enemy[b], for there is power in God to help and to make stumble.
translation:
  language: te
  text: కాని నువ్వు వెళ్తే మాత్రం[a], యుద్ధానికి ధైర్యంగా సిద్ధపడు. దేవుడు నిన్ను శత్రువు ఎదుట తడబడేలా చేస్తాడు[b], ఎందుకంటే సహాయం చేయడానికీ తడబడేలా చేయడానికీ దేవునికి శక్తి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నువ్వు వెళ్తే, యుద్ధానికి బలంగా ఉండు’; లేదా ‘యుద్ధంలో నీ బలాన్ని చూపు.’
    reason: lexical_alternative
  - marker: b
    text: 'హెబ్రీలో ఇక్కడా, వాక్యాంతంలోనూ ఒకే క్రియ పునరావృతమవుతుంది: దేవునికి ‘సహాయం చేయడానికీ,’ ‘తడబడేలా చేయడానికీ’ శక్తి ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: కాని ... అనుకుంటే
  rationale: మునుపటి ఆదేశానికి భిన్నంగా ఒక షరతుతో కూడిన ప్రత్యామ్నాయాన్ని ప్రవేశపెడుతుంది; సందర్భంలోని వ్యతిరేక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בֹּא אַתָּה
  choice: నువ్వు వెళ్లాల్సిందేననుకుంటే
  rationale: క్రియతో పాటు ఉన్న స్పష్టమైన ద్వితీయ పురుష సర్వనామం నొక్కి చెప్పే భావాన్ని ఇస్తుంది. తెలుగులో ఈ రూపం ‘నువ్వు వెళ్లడానికే నిర్ణయించుకుంటే’ అనే ఉద్దేశాన్ని సహజంగా అందిస్తుంది.
- source_word: עֲשֵׂה חֲזַק לַמִּלְחָמָה
  choice: యుద్ధంలో ధైర్యంగా పోరాడు
  rationale: ‘బలంగా చేయి/నిన్ను బలవంతునిగా చూపించు’ అనే హెబ్రీ నుడికారంలోని ఆజ్ఞాత్మక, యుద్ధసందర్భ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: יַכְשִׁילְךָ
  choice: నిన్ను ... తడబడేలా చేస్తాడు
  rationale: כשל హిఫీల్ రూపంలోని కారణార్థక భావాన్ని, అలాగే వాక్యాంతంలో అదే ధాతువు పునరావృతమవడాన్ని నిలుపుతుంది.
- source_word: לִפְנֵי אוֹיֵב
  choice: శత్రువు ఎదుట
  rationale: శత్రువు సమక్షంలో లేదా అతని ముందు ఓటమిపాలవడం అనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יֶשׁ כֹּחַ בֵּאלֹהִים
  choice: దేవునికి శక్తి ఉంది
  rationale: హెబ్రీ అస్తిత్వ నిర్మాణాన్ని తెలుగులో సహజమైన స్వామ్య నిర్మాణంతో వ్యక్తం చేస్తూ, తరువాతి రెండు సమాంతర క్రియారూపాలకు ఆధారంగా నిలుస్తుంది.
- source_word: לַעְזֹר וּלְהַכְשִׁיל
  choice: సహాయం చేయడానికీ, తడబడేలా చేయడానికీ
  rationale: రెండు సమాంతర క్రియలను అలాగే ఉంచి, ముందున్న ‘తడబడేలా చేస్తాడు’ అనే పదబంధంతో ధాతుపరమైన పునరుక్తిని కనిపించేలా చేస్తుంది.
theological_decisions:
- issue: యుద్ధ ఓటమిలో దేవుని ప్రత్యక్ష కార్యసాధకత్వం
  choice: దేవుడు నిన్ను తడబడేలా చేస్తాడని నేరుగా అనువదించడం
  alternative: దేవుడు కేవలం ఓటమిని అనుమతిస్తాడని మెత్తబరచి చెప్పడం
  rationale: హెబ్రీ పాఠం దేవుడే తడబడేలా చేస్తాడనీ, సహాయం చేయడానికీ తడబడేలా చేయడానికీ ఆయనకు శక్తి ఉందనీ ప్రత్యక్షంగా చెబుతుంది. ఆ దైవశాస్త్ర ఉద్రిక్తతను పరిష్కరించకుండా అనువాదంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కాని అతిగా గ్రాంథికం కాని శైలి వాడబడింది. సందర్భం రాజును ఏకవచనంలో నేరుగా సంబోధిస్తున్నందున ‘నువ్వు’ రూపం ఎంచుకున్నాం. హెబ్రీలోని కారణార్థక క్రియ పునరుక్తిని ‘తడబడేలా’ అని రెండుసార్లు ఉంచి సంరక్షించాం.
