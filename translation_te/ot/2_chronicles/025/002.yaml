source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה רַ֕ק לֹ֖א בְּ/לֵבָ֥ב שָׁלֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/002.yaml
  text: He did what was right in the eyes of Yahweh[a], yet not with a whole heart.
translation:
  language: te
  text: అతడు యాహ్వే దృష్టిలో సరైనది చేశాడు; అయితే పూర్ణ హృదయంతో కాదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నిండు హృదయంతో కాదు” లేదా “హృదయపూర్వకంగా కాదు.” హీబ్రూలో అక్షరార్థంగా “సంపూర్ణమైన హృదయంతో కాదు”; ఇది అతని భక్తి సంపూర్ణంగా లేదని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు చేశాడు
  rationale: వావ్-కన్సెక్యూటివ్ గతకాల కథన చర్యను సూచిస్తుంది. తెలుగులో సందర్భానుసారంగా ప్రారంభ సంధాన పదం లేకుండానే సహజంగా వ్యక్తమవుతుంది.
- source_word: הַיָּשָׁר
  choice: సరైనది
  rationale: నిర్దేశక ఉపపదంతో ఉన్న విశేషణం నామవాచకార్థంలో ‘సరైనది/నీతియైనది’ అని పనిచేస్తుంది. ‘సరైనది’ మూలంలోని నైతిక మదింపును సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యాహ్వే దృష్టికి
  rationale: ఇది యాహ్వే చేసే మదింపును తెలిపే హీబ్రూ నుడికారం. ‘దృష్టికి’ అనే రూపం భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా లిప్యంతరీకరించబడింది.
- source_word: רַק
  choice: అయితే
  rationale: ముందున్న సానుకూల వాక్యానికి పరిమితి విధించే విరుద్ధ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא
  choice: కాదు
  rationale: సాధారణ నిరాకరణ; ముందున్న ‘నిండు హృదయంతో’ అనే పదబంధాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో నిరాకరిస్తుంది.
- source_word: בְּלֵבָב שָׁלֵם
  choice: నిండు హృదయంతో
  rationale: ‘సంపూర్ణమైన/నిండైన హృదయంతో’ అనే మూల రూపకాన్ని నిలుపుతూ, అతని భక్తి సంపూర్ణంగా లేదనే భావాన్ని సహజంగా తెలియజేస్తుంది; పాపరహిత పరిపూర్ణత అనే అదనపు భావాన్ని రుద్దదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని బిరుదుతో భర్తీ చేయకుండా నిలుపుతుంది.
- issue: అమజ్యా భక్తిలోని లోపం
  choice: నిండు హృదయంతో కాదు
  alternative: పూర్ణ హృదయంతో కాదు; హృదయపూర్వకంగా కాదు
  rationale: మూలం అతని బాహ్యంగా సరైన కార్యానికీ అంతరంగ భక్తి అసంపూర్ణతకీ మధ్యనున్న ఉద్వేగాన్ని నిలుపుతుంది. అది కపటత్వం లేదా సంపూర్ణ విశ్వాసఘాతం అని మరింత బలంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. హీబ్రూ హృదయ రూపకాన్ని ‘నిండు హృదయంతో’ అని నిలుపుతూ, వాక్యంలోని సానుకూల మదింపు మరియు అంతరంగ పరిమితి రెండూ స్పష్టంగా ఉంచబడ్డాయి.
