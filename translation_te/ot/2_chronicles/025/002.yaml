revisions:
- from: అతడు యాహ్వే దృష్టికి సరైనది చేశాడు; అయితే నిండు హృదయంతో కాదు.[a]
  to: అతడు యాహ్వే దృష్టిలో సరైనది చేశాడు; అయితే పూర్ణ హృదయంతో కాదు.[a]
  rationale: The revision improves the Telugu idiom for the Hebrew phrase ‘in the eyes of Yahweh’ and uses a more natural equivalent for ‘with a whole/complete heart.’ It preserves the source’s deliberate tension between outwardly right conduct and incomplete inward devotion, without strengthening this into an assertion of hypocrisy or apostasy.
