  to: 'ఇశ్రాయేలు రాజైన యోవాషు యూదా రాజైన అమజ్యాకు ఇలా కబురు పంపాడు: “లెబానోనులో ఉన్న ముళ్లపొద[a], లెబానోనులో ఉన్న దేవదారు చెట్టుకు, ‘నీ కుమార్తెను నా కుమారునికి భార్యగా ఇవ్వు’ అని కబురు పంపింది. అప్పుడు లెబానోనులో ఉన్న ఒక అడవి జంతువు అటుగా వెళ్లి ఆ ముళ్లపొదను తొక్కింది.”'
