source:
  edition: WLC
  text: וַ/יִּשְׁלַ֞ח יוֹאָ֣שׁ מֶֽלֶךְ יִשְׂרָאֵ֗ל אֶל אֲמַצְיָ֣הוּ מֶֽלֶךְ יְהוּדָה֮ לֵ/אמֹר֒ הַ/ח֜וֹחַ אֲשֶׁ֣ר בַּ/לְּבָנ֗וֹן שָׁ֠לַח אֶל הָ/אֶ֜רֶז אֲשֶׁ֤ר בַּ/לְּבָנוֹן֙ לֵ/אמֹ֔ר תְּנָֽ/ה אֶת בִּתְּ/ךָ֥ לִ/בְנִ֖/י לְ/אִשָּׁ֑ה וַֽ/תַּעֲבֹ֞ר חַיַּ֤ת הַ/שָּׂדֶה֙ אֲשֶׁ֣ר בַּ/לְּבָנ֔וֹן וַ/תִּרְמֹ֖ס אֶת הַ/חֽוֹחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/018.yaml
  text: Then Joash king of Israel sent to Amaziah king of Judah[a], saying, “The thornbush that was in Lebanon sent to the cedar that was in Lebanon, saying, ‘Give your daughter to my son as a wife.’ Then a wild beast of the field that was in Lebanon passed by and trampled the thornbush.”
translation:
  language: te
  text: 'ఇశ్రాయేలు రాజైన యోవాషు యూదా రాజైన అమజ్యాకు ఇలా కబురు పంపాడు: “లెబానోనులో ఉన్న ముళ్లపొద[a], లెబానోనులో ఉన్న దేవదారు చెట్టుకు, ‘నీ కుమార్తెను నా కుమారునికి భార్యగా ఇవ్వు’ అని కబురు పంపింది. అప్పుడు లెబానోనులో ఉన్న ఒక అడవి జంతువు అటుగా వెళ్లి ఆ ముళ్లపొదను తొక్కింది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ముళ్లమొక్క.” హీబ్రూ పదం ముళ్లు గల ఒక మొక్కను సూచిస్తుంది; దాని ఖచ్చితమైన జాతి తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחוֹחַ
  choice: ముళ్లపొద
  rationale: ఈ హీబ్రూ పదం నిర్దిష్ట జాతి తెలియని ముళ్ల మొక్కను సూచిస్తుంది. దేవదారు చెట్టుతో ఉన్న వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో ‘ముళ్లపొద’ స్పష్టంగా చూపిస్తుంది.
- source_word: הָאֶרֶז
  choice: దేవదారు చెట్టు
  rationale: ఎత్తు, బలం అనే భావచిత్రాన్ని కలిగించే దేవదారు చెట్టునే ఈ పదం సూటిగా సూచిస్తుంది.
- source_word: בַּלְּבָנוֹן
  choice: లెబానోనులో
  rationale: మొక్కలు, అడవి జంతువు ఉన్న ప్రాంతాన్ని సూచించే సహజమైన తెలుగు రూపం.
- source_word: שָׁלַח ... לֵאמֹר
  choice: ‘...’ అని కబురు పంపింది
  rationale: హీబ్రూ వాక్య నిర్మాణంలోని పంపడం, చెప్పడం అనే రెండు అంశాలను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: תְּנָה אֶת־בִּתְּךָ לִבְנִי לְאִשָּׁה
  choice: నీ కుమార్తెను నా కుమారునికి భార్యగా ఇవ్వు
  rationale: వివాహ సంబంధ ప్రతిపాదనను స్పష్టంగా, మూలానికి దగ్గరగా వ్యక్తపరుస్తుంది.
- source_word: חַיַּת הַשָּׂדֶה
  choice: ఒక అడవి జంతువు
  rationale: పొలప్రాంతంలో సంచరించే జంతువు అనే మూలభావాన్ని ప్రస్తుత తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וַתַּעֲבֹר
  choice: అటుగా వచ్చి
  rationale: ఆ జంతువు దారిన పోతూ పొదను తొక్కిన సందర్భోచిత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וַתִּרְמֹס
  choice: తొక్కివేసింది
  rationale: కాళ్లకింద తొక్కి అణచివేయడం అనే క్రియ యొక్క బలమైన దృశ్యాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וַיִּשְׁלַח ... אֶל ... לֵאמֹר
  choice: యోవాషు ... అమజ్యాకు ఇలా కబురు పంపాడు
  rationale: పంపబడినది సందేశమని తెలుగులో స్పష్టం చేస్తూనే హీబ్రూ పరిచయ సూత్రాన్ని సహజంగా అందిస్తుంది.
