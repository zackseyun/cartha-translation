translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ఉపమానంలోని ముళ్లపొద–దేవదారు వ్యత్యాసం, వరుస సంఘటనలను సూచించే సాధారణ సంధానం, మూలంలోని సందేశ నిర్మాణం నిలుపబడ్డాయి. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘ముళ్లపొద’ వద్ద ఉంచాం.
