source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ מָלַ֣ךְ אֲמַצְיָ֔הוּ וְ/עֶשְׂרִ֣ים וָ/תֵ֨שַׁע֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יְהוֹעַדָּ֖ן מִ/ירוּשָׁלָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/001.yaml
  text: Amaziah was twenty-five years old when he became king[a], and he reigned twenty-nine years in Jerusalem. His mother’s name was Jehoaddan[b], from Jerusalem.
translation:
  language: te
  text: అమజ్యా రాజైనప్పుడు అతనికి ఇరవై ఐదు సంవత్సరాల వయస్సు. అతడు యెరూషలేములో ఇరవై తొమ్మిది సంవత్సరాలు పరిపాలించాడు. అతని తల్లి పేరు యెహోయద్దాను; ఆమె యెరూషలేముకు చెందినది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: అతనికి ఇరవై ఐదు సంవత్సరాలు
  rationale: ఇది వయస్సును తెలిపే హీబ్రూ నుడికారం; అక్షరార్థంగా ‘ఇరవై ఐదు సంవత్సరాల కుమారుడు.’ ఆధునిక తెలుగులో సహజంగా వయస్సును తెలిపే విధంగా అనువదించబడింది.
- source_word: מָלַךְ (మొదటి ప్రయోగం)
  choice: రాజైనప్పుడు
  rationale: రాజ్యారోహణ సమయాన్ని తెలిపే కాలక్రమ సూత్రంలో ఈ క్రియను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה
  choice: ఇరవై తొమ్మిది సంవత్సరాలు
  rationale: పరిపాలనా కాలవ్యవధిని నేరుగా తెలియజేసే సంఖ్యా పదబంధం.
- source_word: מָלַךְ (రెండవ ప్రయోగం)
  choice: పరిపాలించాడు
  rationale: రాజుగా పాలించిన కాలవ్యవధిని సూచించే సందర్భానికి ఆధునిక తెలుగులో సహజమైన పదం.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: స్థలార్థక ఉపసర్గతో ఉన్న నగరనామానికి నేరమైన అనువాదం.
- source_word: וְשֵׁם אִמּוֹ
  choice: అతని తల్లి పేరు
  rationale: హీబ్రూ నిర్మాణంలోని భావాన్ని సహజమైన తెలుగు వాక్యక్రమంలో అందిస్తుంది.
- source_word: יְהוֹעַדָּן
  choice: యెహోయద్దాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యంతరీకరణ సంప్రదాయానికి అనుగుణంగా ఇచ్చింది.
- source_word: מִירוּשָׁלָיִם
  choice: ఆమె యెరూషలేముకు చెందినది
  rationale: מִן మూలం లేదా స్వస్థలాన్ని సూచిస్తుంది; ఈ వంశవివర సందర్భంలో ఆమె యెరూషలేము మూలస్థురాలని సహజ తెలుగులో తెలియజేస్తుంది.
