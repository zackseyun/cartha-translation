translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన చారిత్రక వచనశైలి. మూలంలోని రెండు מָלַךְ ప్రయోగాల సందర్భభేదాన్ని ‘రాజైనప్పుడు’ మరియు ‘పరిపాలించాడు’గా చూపించాం. వివరణ అవసరం లేని హీబ్రూ వయస్సు నుడికారానికి పాదటిప్పణి జోడించలేదు.
