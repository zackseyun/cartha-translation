  text: וְ/אֵת֩ אֲמַצְיָ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה בֶּן יוֹאָ֣שׁ בֶּן יְהוֹאָחָ֗ז תָּפַ֛שׂ יוֹאָ֥שׁ מֶֽלֶךְ יִשְׂרָאֵ֖ל בְּ/בֵ֣ית שָׁ֑מֶשׁ וַ/יְבִיאֵ֨/הוּ֙ יְר֣וּשָׁלִַ֔ם וַ/יִּפְרֹ֞ץ בְּ/חוֹמַ֣ת יְרוּשָׁלִַ֗ם מִ/שַּׁ֤עַר אֶפְרַ֨יִם֙ עַד שַׁ֣עַר הַ/פּוֹנֶ֔ה אַרְבַּ֥ע מֵא֖וֹת אַמָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/023.yaml
  text: And Joash king of Israel captured Amaziah king of Judah[a], the son of Joash, son of Jehoahaz, at Beth-shemesh, and brought him to Jerusalem. Then he broke down the wall of Jerusalem from the Ephraim Gate to the Corner Gate, four hundred cubits.
translation:
  language: te
  text: ఇశ్రాయేలు రాజైన యోవాషు, యోవాషు కుమారుడైన, యెహోయాహాజు మనుమడైన యూదా రాజు అమజ్యాను బేత్షెమెషులో పట్టుకొని యెరూషలేముకు తీసుకొచ్చాడు. తరువాత అతడు ఎఫ్రాయిము ద్వారం నుండి మూల ద్వారం[a] వరకు నాలుగు వందల మూరల మేరకు యెరూషలేము ప్రాకారంలో బీట కొట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “ఎదురుగా ఉన్న/తిరిగే ద్వారం.” “మూల ద్వారం” అనే అనువాదం 2 రాజులు 14:13లోని సమాంతర వృత్తాంతంలో ఉన్న సంభావ్య గుర్తింపును అనుసరిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּפַשׂ
  choice: పట్టుకొని
  rationale: ఈ సైనిక సందర్భంలో ఒకరిని స్వాధీనంలోకి తీసుకోవడం లేదా బందీగా పట్టుకోవడం అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּבֵית שָׁמֶשׁ
  choice: బేత్షెమెషులో
  rationale: בְ ఉపసర్గ ఇక్కడ సంఘటన జరిగిన స్థలాన్ని సూచిస్తుంది; స్థలపేరు లిప్యంతరీకరించబడింది.
- source_word: וַיְבִיאֵהוּ
  choice: తీసుకొచ్చాడు
  rationale: בוא ధాతువు హిఫీల్ రూపానికి ‘తీసుకురావడం’ అనే సాధారణ భావం ఉంది; ప్రయాణ విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: וַיִּפְרֹץ בְּחוֹמַת יְרוּשָׁלִַם
  choice: యెరూషలేము ప్రాకారాన్ని పడగొట్టాడు
  rationale: ప్రాకారంలో చీలిక చేయడం లేదా దాన్ని కూల్చడం అనే సైనిక చర్యను స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִשַּׁעַר אֶפְרַיִם עַד שַׁעַר הַפּוֹנֶה
  choice: ఎఫ్రాయిము ద్వారం మొదలుకొని మూల ద్వారం వరకు
  rationale: మొదటిది నగర ద్వారం పేరు. రెండవదానికి అక్షరార్థంగా ‘తిరిగే/ఎదురుగా ఉన్న ద్వారం’ అనే అస్పష్టత ఉన్నా, 2 రాజులు 14:13లోని సమాంతర వృత్తాంతం ఆధారంగా ‘మూల ద్వారం’ సంభావ్య గుర్తింపు; అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: אַרְבַּע מֵאוֹת אַמָּה
  choice: నాలుగు వందల మూరల పొడవున
  rationale: హీబ్రూ కొలతను నేరుగా నిలుపుతూ, తెలుగులో అది ప్రాకారపు కొలత అని సహజంగా స్పష్టం చేస్తుంది.
- source_word: בֶּן יוֹאָשׁ בֶּן יְהוֹאָחָז
  choice: యోవాషు కుమారుడూ యెహోయాహాజు మనుమడూ అయిన
  rationale: రెండు తరాల వంశవివరాన్ని కాపాడుతూ, ఒకే వాక్యంలో ఇద్దరు యోవాషులు ప్రస్తావించబడటం వల్ల కలిగే అయోమయాన్ని తగ్గిస్తుంది.
