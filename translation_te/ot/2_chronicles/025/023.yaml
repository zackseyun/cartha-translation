translation_notes:
  register: సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ప్రామాణిక తెలుగు వాడబడింది. వ్యక్తి, స్థల నామాలు తెలుగు బైబిలు సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించబడ్డాయి. మూలంలోని కొలత ‘మూర’గా నిలుపబడింది; ద్వారం పేరులోని నిజమైన భాషాత్మక అస్పష్టత పాదసూచికలో భద్రపరచబడింది.
