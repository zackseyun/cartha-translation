source:
  edition: WLC
  text: וַ/יִּוָּעַ֗ץ אֲמַצְיָ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה וַ֠/יִּשְׁלַח אֶל יוֹאָ֨שׁ בֶּן יְהוֹאָחָ֧ז בֶּן יֵה֛וּא מֶ֥לֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר לך נִתְרָאֶ֥ה פָנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/017.yaml
  text: Then Amaziah king of Judah took counsel and sent to Joash son of Jehoahaz[a], son of Jehu, king of Israel, saying, “Come, let us face one another.”
translation:
  language: te
  text: అప్పుడు యూదా రాజైన అమజ్యా ఆలోచించి, యెహూ కుమారుడైన యెహోయాహాజు కుమారుడైన, ఇశ్రాయేలు రాజు యోవాషుకు, “రా, మనం ముఖాముఖిగా ఎదుర్కొందాం[a]” అని వర్తమానం పంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనం ఒకరి ముఖాన్ని ఒకరం చూసుకుందాం.” హీబ్రూ నుడికారం అక్షరార్థంగా ఒకరి ముఖాన్ని ఒకరు చూడడం గురించి చెబుతుంది; ఇక్కడ అది ప్రత్యక్షంగా ఎదుర్కోవాలనే సవాలును సూచిస్తున్నట్లు ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: ఆలోచించి
  rationale: יעץ ధాతువు నిఫల్ రూపం ఇక్కడ చర్యకు ముందు జరిగిన ఆలోచన లేదా సంప్రదింపును సూచిస్తుంది. ఎవరితో సంప్రదించాడో మూలపాఠం చెప్పనందున దానిని జోడించకుండా ‘ఆలోచించి’ అని అనువదించాం.
- source_word: וַיִּשְׁלַח אֶל
  choice: వర్తమానం పంపాడు
  rationale: హీబ్రూ వాక్యం యోవాషు దగ్గరకు పంపినట్లు చెబుతుంది; పంపబడిన దూతలను స్పష్టంగా ప్రస్తావించదు. తెలుగులో సహజంగా ఉండేందుకు, ప్రత్యక్ష సందేశాన్ని పంపడమనే భావాన్ని ‘వర్తమానం పంపాడు’ అని వ్యక్తపరిచాం.
- source_word: יוֹאָשׁ בֶּן יְהוֹאָחָז בֶּן יֵהוּא מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజైన యెహూ కుమారుడు యెహోయాహాజు కుమారుడైన యోవాషు
  rationale: మూలంలోని పూర్తి వంశావళిని, రాజబిరుదును నిలిపి ఉంచుతూ తెలుగు వాక్యక్రమానికి అనుగుణంగా అమర్చాం.
- source_word: לְךָ
  choice: రా
  rationale: ఈ ఏకవచన ఆజ్ఞారూపం సందర్భంలో ప్రత్యక్ష సవాలుకు ఆహ్వానంగా పనిచేస్తుంది; ‘రా’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: נִתְרָאֶה פָנִים
  choice: మనం ముఖాముఖిగా తలపడదాం
  rationale: ఈ హీబ్రూ నుడికారం అక్షరార్థంగా ఒకరి ముఖం ఒకరు చూడడాన్ని సూచించినా, ఇక్కడి రాజకీయ-సైనిక సందర్భంలో ప్రత్యక్షంగా ఎదుర్కొనడం లేదా తలపడడం అనే సవాలును తెలియజేస్తుంది. ‘ముఖాముఖిగా’ మూలంలోని ముఖ సంబంధిత రూపకాన్ని కొంత నిలుపుతుంది.
