source:
  edition: WLC
  text: וְ/כָֽל הַ/זָּהָ֣ב וְ/הַ/כֶּ֡סֶף וְ/אֵ֣ת כָּל הַ֠/כֵּלִים הַ/נִּמְצְאִ֨ים בְּ/בֵית הָ/אֱלֹהִ֜ים עִם עֹבֵ֣ד אֱד֗וֹם וְ/אֶת אֹצְרוֹת֙ בֵּ֣ית הַ/מֶּ֔לֶךְ וְ/אֵ֖ת בְּנֵ֣י הַ/תַּֽעֲרֻב֑וֹת וַ/יָּ֖שָׁב שֹׁמְרֽוֹן־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/024.yaml
  text: And he took all the gold and the silver[a], and all the vessels found in the house of God with Obed-edom, and the treasures of the king’s house, and hostages[b], and returned to Samaria.
translation:
  language: te
  text: అతడు బంగారమంతటినీ వెండంతటినీ, దేవుని మందిరంలో ఓబేదెదోము దగ్గర[a] ఉన్న పాత్రలన్నిటినీ, రాజభవనంలోని సంపదలను, పూచీకత్తుగా ఉంచబడినవారిని[b] తీసుకొని సమరయకు తిరిగివెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఓబేదెదోము సంరక్షణలో.” హెబ్రీలో అక్షరార్థంగా “ఓబేదెదోముతో” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో అక్షరార్థంగా “పూచీకత్తుల కుమారులు”; హామీగా ఉంచబడిన వ్యక్తులు, అంటే బందీలు, అని భావం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַזָּהָב וְהַכֶּסֶף
  choice: బంగారమంతటినీ వెండంతటినీ
  rationale: כָּל తెలిపే సంపూర్ణతను నిలుపుతూ, బంగారం మరియు వెండి రెండింటినీ వేర్వేరుగా పేర్కొనే హెబ్రీ నిర్మాణాన్ని సహజమైన తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: כָּל הַכֵּלִים
  choice: పాత్రలన్నిటినీ
  rationale: כֵּלִים అనేది వస్తువులు, పనిముట్లు లేదా పాత్రలను సూచించే విస్తృత పదం; దేవాలయ సందర్భంలో ‘పాత్రలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הַנִּמְצְאִים
  choice: కనిపించిన
  rationale: ఈ కృదంతం అక్కడ కనుగొనబడిన లేదా ఉన్న వస్తువులను సూచిస్తుంది; ‘కనిపించిన’ మూలరూపానికి దగ్గరగా ఉండి తెలుగులో సహజంగా ఉంది.
- source_word: בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరం
  rationale: ‘దేవుని ఇల్లు’ అనే అక్షరార్థాన్ని సందర్భానుసారంగా, సాధారణ పాఠకులకు స్పష్టమైన ‘దేవుని మందిరం’గా వ్యక్తం చేస్తుంది.
- source_word: עִם עֹבֵד אֱדוֹם
  choice: ఓబేదెదోము దగ్గర
  rationale: עִם యొక్క ‘తో/దగ్గర’ భావాన్ని నిలుపుతూ, ఇది ఓబేదెదోము సంరక్షణలో ఉన్నదనే సాధ్యమైన భావాన్ని ప్రధాన పాఠ్యంలో పూర్తిగా నిర్ణయించకుండా ఉంచుతుంది.
- source_word: אֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: రాజభవనంలోని సంపదలు
  rationale: అక్కడి విలువైన నిల్వలను సూచించే సందర్భంలో אֹצְרוֹת ను ‘సంపదలు’గా, בֵּית הַמֶּלֶךְ ను సహజమైన తెలుగులో ‘రాజభవనం’గా అనువదిస్తుంది.
- source_word: בְּנֵי הַתַּעֲרֻבוֹת
  choice: పూచీకత్తుగా ఉంచబడినవారు
  rationale: అక్షరార్థంగా క్లిష్టమైన ఈ పదబంధం భద్రత లేదా హామీ కోసం ఉంచిన వ్యక్తులను, అంటే బందీలను, సూచించే అవకాశముంది; ఈ ఎంపిక ఆ కార్యార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיָּשָׁב שֹׁמְרוֹן
  choice: సమరయకు తిరిగివెళ్లాడు
  rationale: కథనాన్ని ముందుకు తీసుకెళ్లే క్రియను, సమరయ గమ్యస్థానమని స్పష్టంగా చూపే సహజ తెలుగు రూపంలో అందిస్తుంది.
