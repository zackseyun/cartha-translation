translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని వాడాం. మూలంలోని జాబితా నిర్మాణాన్ని నిలుపుతూ, తెలుగు వాక్యప్రవాహం కోసం కర్మవిభక్తి రూపాలను సమన్వయించాం. ఓబేదెదోము సంబంధమైన పదబంధం మరియు ‘పూచీకత్తుల కుమారులు’ అనే క్లిష్ట ప్రయోగంలోని అనిశ్చితిని పాదటిప్పణుల్లో భద్రపరిచాం.
