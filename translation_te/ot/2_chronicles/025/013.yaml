source:
  edition: WLC
  text: וּ/בְנֵ֣י הַ/גְּד֗וּד אֲשֶׁ֨ר הֵשִׁ֤יב אֲמַצְיָ֨הוּ֙ מִ/לֶּ֤כֶת עִמּ/וֹ֙ לַ/מִּלְחָמָ֔ה וַֽ/יִּפְשְׁטוּ֙ בְּ/עָרֵ֣י יְהוּדָ֔ה מִ/שֹּׁמְר֖וֹן וְ/עַד בֵּ֣ית חוֹר֑וֹן וַ/יַּכּ֤וּ מֵ/הֶם֙ שְׁלֹ֣שֶׁת אֲלָפִ֔ים וַ/יָּבֹ֖זּוּ בִּזָּ֥ה רַבָּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/013.yaml
  text: But the men of the troop whom Amaziah had sent back from going with him to battle raided the cities of Judah[a], from Samaria to Beth-horon[b], and struck down three thousand of them and took much plunder.
translation:
  language: te
  text: అయితే, తనతో కలిసి యుద్ధానికి వెళ్లకుండా అమజ్యా వెనక్కి పంపిన దళంలోని మనుషులు సమరయ నుండి బేత్-హోరోను వరకు ఉన్న యూదా పట్టణాలపై దాడి చేశారు.[a] వారిలో మూడు వేల మందిని హతమార్చి[b], విస్తారమైన దోపుడు సొమ్మును కొల్లగొట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో ‘సమరయ నుండి బేత్-హోరోను వరకు’ అనే పదబంధం దాడి జరిగిన ప్రాంతపు విస్తృతిని సూచిస్తుంది.
    reason: geographical_scope
  - marker: b
    text: లేదా, ‘కొట్టి పడేశారు.’ హెబ్రీ క్రియకు సాధారణంగా ‘కొట్టు’ అనే అర్థం ఉంది; ఈ యుద్ధ సందర్భంలో అది చంపడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי הַגְּדוּד
  choice: దళంలోని మనుషులు
  rationale: అక్షరార్థంగా ‘దళపు కుమారులు’; ఇది సైనిక దళంలోని సభ్యులను సూచించే హెబ్రీ జాతీయం. ఆధునిక తెలుగులో ‘దళంలోని మనుషులు’ సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: אֲשֶׁר הֵשִׁיב אֲמַצְיָהוּ
  choice: అమజ్యా వెనక్కి పంపిన
  rationale: שוב హిఫిల్ రూపం ‘తిరిగి వెళ్లేలా చేయడం’ అని అర్థం; కథా సందర్భంలో వారిని పంపివేయడాన్ని ‘వెనక్కి పంపిన’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִלֶּכֶת עִמּוֹ לַמִּלְחָמָה
  choice: తనతో కలిసి యుద్ధానికి వెళ్లకుండా
  rationale: అమజ్యాతో యుద్ధయాత్రలో పాల్గొనకుండా వారిని వెనక్కి పంపాడనే నిరోధక భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּפְשְׁטוּ
  choice: దాడి చేశారు
  rationale: సైనిక సందర్భంలో פשט ఆకస్మిక దాడి లేదా దోపుడు దాడిని సూచిస్తుంది. తరువాత దోపిడీని ప్రత్యేకంగా పేర్కొనడం వల్ల ఇక్కడ ‘దాడి చేశారు’ సరైన భేదాన్ని నిలుపుతుంది.
- source_word: בְּעָרֵי יְהוּדָה
  choice: యూదా పట్టణాలపై
  rationale: עָרִים పట్టణాలు లేదా నగరాలను సూచించగలదు; ఈ ప్రాంతీయ సందర్భంలో ‘పట్టణాలు’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: מִשֹּׁמְרוֹן וְעַד בֵּית חוֹרוֹן
  choice: సమరయ నుండి బేత్-హోరోను వరకు ఉన్న
  rationale: מִן ... וְעַד నిర్మాణం దాడి జరిగిన ప్రాంతపు రెండు సరిహద్దులను సూచిస్తుంది. స్థలనామాలను ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఉంచాం.
- source_word: וַיַּכּוּ מֵהֶם שְׁלֹשֶׁת אֲלָפִים
  choice: వారిలో మూడు వేల మందిని హతమార్చి
  rationale: נכה విస్తృతంగా ‘కొట్టు’ అని అర్థమిచ్చినా, సైనిక దాడిలో సంఖ్యతో కూడిన ఈ వాడుక మరణాన్ని బలంగా సూచిస్తుంది. ‘హతమార్చి’ సందర్భార్థాన్ని స్పష్టంగా ఇస్తుంది; మూలపదపు విస్తృతిని పాదటిప్పణిలో తెలియజేశాం.
- source_word: וַיָּבֹזּוּ בִּזָּה רַבָּה
  choice: విస్తారమైన దోపుడు సొమ్మును కొల్లగొట్టారు
  rationale: క్రియ, నామవాచకం ఒకే మూలం నుండి వచ్చిన హెబ్రీ సమానమూల నిర్మాణం దోపిడీ తీవ్రతను నొక్కిచెబుతుంది. తెలుగులో సహజమైన బలమైన వ్యక్తీకరణగా ‘విస్తారమైన దోపుడు సొమ్మును కొల్లగొట్టారు’ ఎంచుకున్నాం.
