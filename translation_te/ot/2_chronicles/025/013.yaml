translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. సైనిక పదజాలం సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచుతూ, హెబ్రీ మూలంలోని భౌగోళిక పరిధి మరియు נכה క్రియలోని స్వల్ప పదార్థ విస్తృతిని పాదటిప్పణుల్లో సంరక్షించాం.
