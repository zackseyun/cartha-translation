  source_fidelity: హెబ్రీ వాక్యంలోని సైనిక దళ సభ్యులు, అమజ్యా వారిని యుద్ధానికి తనతో వెళ్లకుండా వెనక్కి పంపడం, యూదా పట్టణాలపై దాడి, సమరయ నుండి బేత్-హోరోను వరకు భౌగోళిక విస్తృతి, మూడు వేల మందిపై ప్రాణాంతక దాడి, విస్తారమైన దోపుడు సొమ్ము తీసుకోవడం—అన్నీ నమ్మకంగా ప్రతిఫలించాయి. ‘హతమార్చి’ యుద్ధసందర్భంలో נכה యొక్క ప్రాణాంతక భావానికి తగినదే; పాదటిప్పణి మూలక్రియలోని విస్తృత ‘కొట్టడం’ భావాన్ని సంరక్షిస్తుంది.
