source:
  edition: WLC
  text: וַ/יָּ֨כֶן יְהוָ֤ה אֶת הַ/מַּמְלָכָה֙ בְּ/יָד֔/וֹ וַ/יִּתְּנ֧וּ כָל יְהוּדָ֛ה מִנְחָ֖ה לִ/יהוֹשָׁפָ֑ט וַֽ/יְהִי ל֥/וֹ עֹֽשֶׁר וְ/כָב֖וֹד לָ/רֹֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/005.yaml
  text: So Yahweh established the kingdom in his hand[a], and all Judah gave tribute to Jehoshaphat; and he had riches and honor in abundance.
translation:
  language: te
  text: అప్పుడు యాహ్వే రాజ్యాన్ని అతని చేతిలో స్థిరపరిచాడు. యూదా ప్రజలందరూ యెహోషాపాతుకు కప్పం[a] ఇచ్చారు; అతనికి సంపద, ఘనత సమృద్ధిగా కలిగాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కానుక,’ ‘బహుమతి,’ ‘అర్పణ.’ హీబ్రూ పదం మిన్హా; ఇక్కడి రాజసంబంధ సందర్భం ‘కప్పం’ అనే అర్థానికి అనుకూలంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכֶן
  choice: స్థిరపరిచాడు
  rationale: כון హిఫిల్ రూపం ‘స్థాపించు, దృఢపరచు, స్థిరపరచు’ అనే భావాన్ని ఇస్తుంది. రాజ్యపాలన భద్రంగా నిలిచిందనే రాజకీయ సందర్భానికి ‘స్థిరపరిచాడు’ సహజంగా సరిపోతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన నాలుగు హల్లుల పేరును బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు లిపిలో దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను ప్రతిబింబిస్తుంది.
- source_word: הַמַּמְלָכָה
  choice: రాజ్యాన్ని
  rationale: מַמְלָכָה రాజ్యాన్ని లేదా రాజాధికారాన్ని సూచించగలదు. ఇక్కడ ‘రాజ్యం’ రెండింటినీ సహజంగా ఇముడ్చగల విస్తృత పదం.
- source_word: בְּיָדוֹ
  choice: అతని చేతిలో
  rationale: అధీనాన్ని లేదా నియంత్రణను సూచించే హీబ్రూ రూపకాన్ని తెలుగులోనూ స్పష్టంగా నిలుపుతుంది.
- source_word: וַיִּתְּנוּ כָל־יְהוּדָה
  choice: యూదా వారందరూ … ఇచ్చారు
  rationale: ‘యూదా అంతా’ అనే సమూహవాచకాన్ని సహజమైన ఆధునిక తెలుగులో ప్రజలను సూచించేలా వ్యక్తం చేస్తుంది; נתן యొక్క ప్రాథమిక భావమైన ‘ఇచ్చు’ను నిలుపుతుంది.
- source_word: מִנְחָה
  choice: కప్పం
  rationale: ఈ పదానికి కానుక, అర్పణ, బహుమతి అనే అర్థాలు కూడా ఉన్నప్పటికీ, రాజుకు సమర్పించే రాజకీయ సందర్భంలో ‘కప్పం’ బాగా సరిపోతుంది.
- source_word: לִיהוֹשָׁפָט
  choice: యెహోషాపాతుకు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: וַיְהִי לוֹ
  choice: అతనికి … కలిగాయి
  rationale: అక్షరార్థంగా ‘అతనికి ఉండెను/కలిగెను’ అనే స్వాధీన భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది.
- source_word: עֹשֶׁר וְכָבוֹד
  choice: సంపద, ఘనత
  rationale: రాజసభ సందర్భంలో భౌతిక ఐశ్వర్యాన్ని, ప్రజల మధ్య లభించిన గౌరవస్థానాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לָרֹב
  choice: సమృద్ధిగా
  rationale: అత్యధిక పరిమాణాన్ని సహజంగా, గౌరవప్రదమైన శైలిలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా ఉంచుతుంది; ‘యాహ్వే’ దాని విస్తృతంగా అంగీకరించబడిన పునర్నిర్మిత ఉచ్చారణకు తెలుగు రూపం.
- issue: מַמְלָכָה యొక్క పరిధి
  choice: రాజ్యం
  alternative: రాజాధికారం
  rationale: ఈ సందర్భంలో భూభాగంతో కూడిన రాజ్యమా, రాజుగా పరిపాలించే అధికారమా అనే భావాలను పదం రెండింటినీ మోయగలదు. ‘రాజ్యం’ ఆ ఉద్దేశపూర్వక విస్తృతిని అనవసరంగా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. ‘అతని చేతిలో’ అనే మూలభాషా రూపకాన్ని ఉద్దేశపూర్వకంగా నిలిపి, [a] సూచికను అది వివరిస్తున్న ‘కప్పం’ పదం వెంట ఉంచాం.
