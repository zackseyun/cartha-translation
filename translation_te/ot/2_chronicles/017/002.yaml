id: 2CH.17.2
reference: 2 Chronicles 17:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּ֨תֶּן חַ֔יִל בְּ/כָל עָרֵ֥י יְהוּדָ֖ה הַ/בְּצֻר֑וֹת וַ/יִּתֵּ֤ן נְצִיבִים֙ בְּ/אֶ֣רֶץ יְהוּדָ֔ה וּ/בְ/עָרֵ֣י אֶפְרַ֔יִם אֲשֶׁ֥ר לָכַ֖ד אָסָ֥א אָבִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/002.yaml
  text: And he stationed forces in all the fortified cities of Judah[a], and he placed garrisons in the land of Judah and in the cities of Ephraim that Asa his father had captured.
translation:
  language: te
  text: అతడు యూదాలోని ప్రాకారాలుగల పట్టణాలన్నిటిలో సైనిక దళాలను నిలిపాడు. యూదా దేశంలోనూ, తన తండ్రి ఆసా స్వాధీనం చేసుకున్న ఎఫ్రాయిము పట్టణాల్లోనూ సైనిక స్థావరాలను[a] ఏర్పాటు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నియమిత అధికారులు,” “ప్రతినిధులు,” లేదా “అధికారులు.” హీబ్రూ נְצִיבִים అనే పదం నియమించబడిన అధికారులను లేదా సైనిక రక్షణ కేంద్రాలను సూచించవచ్చు; ఇక్కడి సైనిక సందర్భం “సైనిక స్థావరాలు” అనే అర్థానికి అనుకూలంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֶּן
  choice: నిలిపాడు / ఏర్పాటు చేశాడు
  rationale: נתן ప్రాథమికంగా ‘పెట్టడం’ అని అర్థమైనా, సైనికులను పట్టణాల్లో నియమించిన సందర్భంలో మొదటి చోట ‘నిలిపాడు,’ రెండవ చోట ‘ఏర్పాటు చేశాడు’ సహజమైన తెలుగు ప్రయోగాలు.
- source_word: חַיִל
  choice: సైనిక దళాలు
  rationale: ఈ పదానికి బలం, సంపద, సైనిక శక్తి అనే అర్థాలు ఉండగలవు; ప్రాకార పట్టణాల్లో ఉంచిన సందర్భం సైనిక భావాన్ని స్పష్టం చేస్తుంది.
- source_word: בְּכָל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: యూదాలోని ప్రాకారాలుగల పట్టణాలన్నిటిలో
  rationale: בצר యొక్క రక్షణాత్మక భావాన్ని స్పష్టంగా ఉంచుతూ, ఆధునిక తెలుగులో సహజంగా ఉండే రూపం.
- source_word: נְצִיבִים
  choice: సైనిక స్థావరాలు
  rationale: ఈ పదం నియమిత అధికారులు, ప్రతినిధులు లేదా సైనిక రక్షణ కేంద్రాలను సూచించగలదు. పరిసర సైనిక సందర్భం వల్ల ప్రధాన పాఠ్యంలో ‘సైనిక స్థావరాలు’ ఎంచుకోబడింది; పదంలోని పరిపాలనా సంభావ్యతను పాదసూచికలో నిలిపాం.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: యూదా దేశంలో
  rationale: పట్టణాలకు మించిన విస్తృత భూభాగాన్ని సూచించే אֶרֶץ భావాన్ని సూటిగా అందిస్తుంది.
- source_word: וּבְעָרֵי אֶפְרַיִם
  choice: ఎఫ్రాయిము పట్టణాల్లో
  rationale: గోత్ర-భౌగోళిక సూచనను సహజమైన తెలుగు నిర్మాణంలో నిలుపుతుంది.
- source_word: אֲשֶׁר לָכַד
  choice: స్వాధీనం చేసుకున్న
  rationale: לכד పట్టణాలను పట్టుకోవడం లేదా జయించడం అనే సైనిక భావాన్ని కలిగి ఉంది; ‘స్వాధీనం చేసుకున్న’ అనేది సందర్భానుకూలంగా, సహజంగా ఉంది.
- source_word: אָסָא אָבִיו
  choice: తన తండ్రి ఆసా
  rationale: సర్వనామ సంబంధాన్ని స్పష్టంగా తెలుపుతూ తెలుగులో సహజమైన పదక్రమాన్ని ఉపయోగిస్తుంది.
