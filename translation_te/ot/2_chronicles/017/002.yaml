translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని రెండు సమాంతర చర్యలను రెండు వాక్యాలుగా సహజంగా అందించాం; נְצִיבִים లోని నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
