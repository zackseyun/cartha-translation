translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. వ్యక్తుల పేర్లను హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘అధికారులు’ అనే పదం తర్వాత ఉంచడం తెలుగు పఠనానికి స్పష్టంగా ఉంటుంది.
