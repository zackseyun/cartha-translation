source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֨ת שָׁל֜וֹשׁ לְ/מָלְכ֗/וֹ שָׁלַ֤ח לְ/שָׂרָי/ו֙ לְ/בֶן חַ֨יִל֙ וּ/לְ/עֹבַדְיָ֣ה וְ/לִ/זְכַרְיָ֔ה וְ/לִ/נְתַנְאֵ֖ל וּ/לְ/מִיכָיָ֑הוּ לְ/לַמֵּ֖ד בְּ/עָרֵ֥י יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/007.yaml
  text: And in the third year of his reign[a], he sent his officials—Ben-hail, Obadiah, Zechariah, Nethanel, and Micaiah—to teach in the cities of Judah.
translation:
  language: te
  text: తన రాజ్యపాలన మూడవ సంవత్సరంలో, యూదా పట్టణాల్లో బోధించడానికి అతడు తన అధికారులైన[a] బెన్-హయీల్, ఓబద్యా, జెకర్యా, నెతనేలు, మీకాయాను పంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అధికారులు’ అనే పదానికి బదులుగా ‘అధిపతులు’ లేదా ‘నాయకులు’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం రాజసంబంధమైన లేదా పరిపాలనా అధికారులను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת שָׁלוֹשׁ לְמָלְכוֹ
  choice: అతని పాలనలో మూడో సంవత్సరంలో
  rationale: హీబ్రూ కాలసూచనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, రాజుగా అతడు పాలించిన కాలం అనే భావాన్ని నిలుపుతుంది.
- source_word: שָׁלַח
  choice: అతడు ... పంపాడు
  rationale: సాధారణ పంపే చర్యకు నేరుగా సరిపోయే సహజమైన తెలుగు రూపం.
- source_word: לְשָׂרָיו
  choice: తన అధికారులైన
  rationale: שַׂר అనే పదానికి అధిపతి, నాయకుడు, అధికారి వంటి అర్థాలు ఉన్నాయి. ఇక్కడ రాజు నియమించి పంపిన పరిపాలనా ప్రతినిధుల సందర్భంలో ‘అధికారులు’ సహజంగా సరిపోతుంది; రాజవంశీయులనే భావాన్ని అనవసరంగా సూచించదు.
- source_word: לְבֶן חַיִל וּלְעֹבַדְיָה וְלִזְכַרְיָה וְלִנְתַנְאֵל וּלְמִיכָיָהוּ
  choice: బేన్‌-హయీల్, ఓబద్యా, జెకర్యా, నెతన్యేలు, మీకాయాలు
  rationale: వ్యక్తుల పేర్లను అనువదించకుండా, హీబ్రూ రూపాలకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం; వాక్యంలోని కర్మవిభక్తికి అనుగుణంగా చివరి పేరుకు తెలుగు విభక్తి జోడించాం.
- source_word: לְלַמֵּד
  choice: బోధించడానికి
  rationale: పియేల్ రూపంలోని ‘బోధించు/నేర్పించు’ భావాన్ని గౌరవప్రదమైన, సాధారణ ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: בְּעָרֵי יְהוּדָה
  choice: యూదా పట్టణాల్లో
  rationale: בְּ యొక్క స్థానార్థాన్ని, עָרֵי యొక్క బహువచనాన్ని నేరుగా నిలుపుతుంది; మూలంలో స్పష్టంగా లేని ‘అంతటా’ అనే పంపిణీ భావాన్ని చేర్చదు.
