  yaml_path: translation/ot/2_chronicles/017/013.yaml
  text: And he had much work in the cities of Judah, and men of war, mighty men of valor, in Jerusalem.
translation:
  language: te
  text: యూదా పట్టణాల్లో అతనికి ఎంతో పని[a] ఉండేది. యెరూషలేములో యుద్ధవీరులు, పరాక్రమశాలులు ఉండేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: ఎంతో ఆస్తి. ఇక్కడి హీబ్రూ పదం పని, కార్యం, లేదా సందర్భానుసారంగా ఆస్తి అనే భావాలను ఇవ్వగలదు.'
    reason: מְלָאכָה పదంలోని నిఘంటుపరమైన మరియు సందర్భపరమైన అర్థసంభావ్యతను పాఠకునికి తెలియజేయడానికి.
lexical_decisions:
- source_word: מְלָאכָה רַבָּה
  choice: విస్తారమైన పని
  rationale: מְלָאכָה అనే పదానికి ప్రధానంగా ‘పని, కార్యం, వృత్తి’ అనే అర్థాలు ఉన్నాయి. ఏకవచన సమూహార్థాన్ని సహజమైన తెలుగులో ఉంచుతూ, పరిమాణాన్ని רַבָּה ప్రకారం ‘విస్తారమైన’ అని వ్యక్తం చేశాం.
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: యుద్ధవీరులు
  rationale: అక్షరార్థంగా ‘యుద్ధపు మనుషులు’; ఆధునిక తెలుగులో సైనిక సామర్థ్యమున్న యోధులను సహజంగా సూచిస్తుంది.
- source_word: גִּבּוֹרֵי חַיִל
  choice: పరాక్రమశాలులు
  rationale: బలం, సామర్థ్యం, శౌర్యం గల వీరులను సూచించే గౌరవప్రదమైన సహజ తెలుగు పదం.
theological_decisions:
- issue: మְלָאכָה యొక్క సందర్భార్థం
  choice: పని
  alternative: ఆస్తి / సంపద / సరఫరాలు
  rationale: హీబ్రూ పదం విస్తృతార్థకమైనదైనా, దాని ప్రాథమిక భావమైన ‘పని/కార్యం’ను ప్రధాన పాఠ్యంలో నిలిపి, సందర్భానుసార ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం; తద్వారా అసలు భాషలోని సందిగ్ధతను సిద్ధాంతపరంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. రెండో వాక్యంలో హీబ్రూ నామవాచక శ్రేణిని సహజ తెలుగు వాక్యంగా పూర్తి చేశాం; ‘యుద్ధవీరులు, పరాక్రమశాలులు’ అనే సమాంతర పదబంధం మూలంలోని బలవత్తర వర్ణనను నిలుపుతుంది.
