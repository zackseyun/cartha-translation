  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే సైనిక-పరిపాలనా పదజాలం వాడబడింది. ‘పితృకుటుంబాలు’ వంశాధారిత గృహ విభాగాలను సూచిస్తుంది; ‘వెయ్యిమంది సైనికుల విభాగాలు’ హోదా స్వభావాన్ని వివరిస్తుంది.
