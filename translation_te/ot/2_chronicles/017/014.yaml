source:
  edition: WLC
  text: וְ/אֵ֥לֶּה פְקֻדָּתָ֖/ם לְ/בֵ֣ית אֲבוֹתֵי/הֶ֑ם לִֽ/יהוּדָה֙ שָׂרֵ֣י אֲלָפִ֔ים עַדְנָ֣ה הַ/שָּׂ֔ר וְ/עִמּ/וֹ֙ גִּבּ֣וֹרֵי חַ֔יִל שְׁלֹ֥שׁ מֵא֖וֹת אָֽלֶף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/014.yaml
  text: 'And these were their mustered divisions by their fathers’ houses: for Judah[a], the commanders of thousands: Adnah the commander, and with him three hundred thousand mighty men of valor.'
translation:
  language: te
  text: 'వారి పితృకుటుంబాల ప్రకారమైన సైనిక సమీకరణ[a] ఇది: యూదా వారికి వెయ్యుల అధిపతులు ఇలా ఉన్నారు: ప్రధాన అధిపతి అద్నా; అతనితో పాటు పరాక్రమవంతులైన యోధులు మూడు లక్షల మంది ఉన్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారి సంఖ్య’ లేదా ‘వారి నమోదు.’ హెబ్రీ పదం లెక్కింపును, సైనిక సమీకరణను లేదా నమోదును, లేక దాని ఫలితంగా ఏర్పడిన సైనిక విభాగాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדָּתָם
  choice: వారి సైనిక నమోదు
  rationale: సైనిక సందర్భంలో ఈ పదం లెక్కింపు లేదా సమీకరణ, అందులో నమోదు, లేక దాని ఫలితంగా ఏర్పడిన సైనిక వ్యవస్థను సూచించవచ్చు. ప్రధాన పాఠంలో సహజమైన ‘సైనిక నమోదు’ను ఉంచి, విస్తృత భావపరిధిని పాదసూచికలో ఇచ్చాం.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: వారి పితృకుటుంబాల ప్రకారం
  rationale: వంశపరమైన, పరిపాలనాపరమైన కుటుంబ విభాగాల ఆధారంగా జరిగిన వ్యవస్థీకరణను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִיהוּדָה
  choice: యూదావారిలో
  rationale: తదుపరి జాబితా యూదా వర్గానికి చెందిన సైనిక నాయకులను పరిచయం చేస్తుంది; తెలుగులో శీర్షికాత్మక సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שָׂרֵי אֲלָפִים
  choice: వెయ్యిమంది సైనికుల విభాగాలకు అధిపతులు
  rationale: వేల చొప్పున లెక్కించిన సైనిక విభాగాలపై అధికారులనే పరిపాలనాపరమైన సైనిక హోదాను స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַדְנָה הַשָּׂר
  choice: అధిపతి అద్నా
  rationale: పేరుతో పాటు అతని నాయకత్వ హోదాను సంక్షిప్తంగా, మూలానికి సమీపంగా ఉంచుతుంది.
- source_word: גִּבּוֹרֵי חַיִל
  choice: పరాక్రమవంతులైన యోధులు
  rationale: యుద్ధసామర్థ్యం, శౌర్యం కలిగిన పోరాటవీరులనే హీబ్రూ నుడికార భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: שְׁלֹשׁ מֵאוֹת אָלֶף
  choice: మూడు లక్షల మంది
  rationale: హీబ్రూ సంఖ్యను నేరుగా, తెలుగులో సహజమైన సంఖ్యా రూపంలో అనువదిస్తుంది.
