source:
  edition: WLC
  text: וַ/יְהִ֥י יְהוָ֖ה עִם יְהוֹשָׁפָ֑ט כִּ֣י הָלַ֗ךְ בְּ/דַרְכֵ֞י דָּוִ֤יד אָבִי/ו֙ הָ/רִ֣אשֹׁנִ֔ים וְ/לֹ֥א דָרַ֖שׁ לַ/בְּעָלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/003.yaml
  text: And Yahweh was with Jehoshaphat[a], because he walked in the former ways of David his father and did not seek the Baals.
translation:
  language: te
  text: యెహోవా యెహోషాపాతుతో ఉన్నాడు, ఎందుకంటే అతడు తన పితరుడైన దావీదు పూర్వపు మార్గాలలో నడిచాడు[a], బయలులను వెదకలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన పితరుడైన దావీదు తొలి మార్గాలలో.” హెబ్రీ పదం దావీదు పూర్వపు నడవడిని సూచిస్తుంది; అది అతని తరువాతి వైఫల్యాల నుండి దానిని వేరు చేస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణగా నిలుపుతుంది.
- source_word: וַיְהִי ... עִם
  choice: తో ఉన్నాడు
  rationale: దేవుని సన్నిధి, ఆదరణ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇక్కడి కారణార్థక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָלַךְ בְּדַרְכֵי
  choice: నడిచిన మార్గాల్లో నడిచాడు
  rationale: నైతిక ప్రవర్తనను సూచించే హెబ్రీయ రూపకాన్ని తెలుగులోనూ నిలుపుతుంది.
- source_word: דָּוִיד אָבִיו
  choice: తన పితరుడైన దావీదు
  rationale: אָבִיו అనే వంశపారంపర్య ప్రయోగాన్ని ప్రత్యక్ష తండ్రి అనే అపార్థం రాకుండా, రాజవంశ పూర్వికుడనే భావంతో అందిస్తుంది.
- source_word: הָרִאשֹׁנִים
  choice: పూర్వకాలంలో
  rationale: దావీదు తొలి లేదా మునుపటి ప్రవర్తనను సూచిస్తుంది; తరువాతి వైఫల్యాలతో ఉండే వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: דָרַשׁ
  choice: ఆశ్రయించలేదు
  rationale: దేవతను వెదకడం, సంప్రదించడం, దాని సహాయం కోరడం వంటి మతపరమైన విస్తృత భావాన్ని సహజమైన తెలుగులో ఇస్తుంది; కేవలం ‘ఆరాధించలేదు’ అని సంకుచితం చేయదు.
- source_word: לַבְּעָלִים
  choice: బయలులను
  rationale: హెబ్రీయ మూలంలోని బహువచనాన్ని నిలుపుతూ, వివిధ బయలు దేవతారూపాలు లేదా ఆరాధనా సంప్రదాయాలను సూచిస్తుంది.
theological_decisions:
- issue: దావీదు తరువాతి వైఫల్యాలు ఉన్నప్పటికీ అతని ప్రవర్తన ఆదర్శంగా పేర్కొనబడటం
  choice: దావీదు పూర్వకాలంలో నడిచిన మార్గాలు
  alternative: దావీదు మొదటి మార్గాలు
  rationale: הָרִאשֹׁנִים దావీదు మునుపటి నడవడిని ప్రత్యేకంగా సూచిస్తుంది. ‘మొదటి మార్గాలు’ అనే పదశః రూపం తెలుగులో అసహజంగా ఉండటంతో, కాలసంబంధ భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టం చేసి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘నడిచిన మార్గాల్లో నడిచాడు’ అనే పునరుక్తి హెబ్రీయ నైతిక రూపకాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది; ‘బయలులు’ అనే బహువచనం మూలపాఠానికి అనుగుణంగా ఉంది.
