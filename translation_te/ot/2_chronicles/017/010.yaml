  text: וַ/יְהִ֣י פַּ֣חַד יְהוָ֗ה עַ֚ל כָּל מַמְלְכ֣וֹת הָֽ/אֲרָצ֔וֹת אֲשֶׁ֖ר סְבִיב֣וֹת יְהוּדָ֑ה וְ/לֹ֥א נִלְחֲמ֖וּ עִם יְהוֹשָׁפָֽט׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/010.yaml
  text: And the fear of Yahweh came upon all the kingdoms of the lands that were around Judah[a], and they did not make war against Jehoshaphat.
translation:
  language: te
  text: యూదా చుట్టూ ఉన్న దేశాల రాజ్యాలన్నిటి మీద యెహోవా భయం[a] కలిగింది; వారు యెహోషాపాతుతో యుద్ధం చేయలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెహోవా నుండి వచ్చిన భీతి,’ లేదా ‘యెహోవాతో ముడిపడిన తీవ్ర భయం.’ ఈ హీబ్రూ పదబంధం యెహోవాతో సంబంధం ఉన్న భయాన్ని సూచించగలదు; ఇక్కడ అది చుట్టుపక్కల రాజ్యాలపై యెహోవా కలిగించిన భీతిని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: కలిగింది
  rationale: అమూర్త నామవాచకంతో వచ్చిన ఈ హీబ్రూ కథన ప్రయోగం ఒక స్థితి ఆరంభమై వారిపై ప్రభావం చూపిందని సూచిస్తుంది; ఆధునిక తెలుగులో ‘కలిగింది’ సహజంగా ఉంది.
- source_word: פַּחַד יְהוָה
  choice: యెహోవా భయం
  rationale: פַּחַד అంటే భయం, భీతి లేదా తీవ్ర భయం. నిర్మాణ సంబంధం యెహోవాతో ముడిపడిన భయాన్నీ, యెహోవా కలిగించిన భయాన్నీ సూచించగలదు; ప్రధాన పాఠం ఈ సందిగ్ధతను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవిక వ్యక్తినామమైన చతురక్షర నామాన్ని తెలుగులో స్థిరపడిన లిప్యంతరీకరణ ‘యెహోవా’గా ఇచ్చాం; బిరుదుతో భర్తీ చేయలేదు.
- source_word: עַל
  choice: మీద
  rationale: ఈ సందర్భంలో భయం ప్రభావితం చేసిన సమూహాన్ని సూచిస్తుంది; ‘మీద ... కలిగింది’ సహజమైన తెలుగు నిర్మాణం.
- source_word: כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: దేశాల రాజ్యాలన్నిటి
  rationale: מַמְלְכוֹת మరియు הָאֲרָצוֹת అనే రెండు నామాలనూ నిలుపుతూ, తెలుగులో సహజమైన షష్ఠీ నిర్మాణాన్ని ఉపయోగించాం.
- source_word: אֲשֶׁר סְבִיבוֹת יְהוּדָה
  choice: యూదా చుట్టూ ఉన్న
  rationale: యూదాకు చుట్టుపక్కల ఉన్న భూభాగాలను గుర్తించే సంబంధవాచక ఉపవాక్యాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וְלֹא נִלְחֲמוּ עִם
  choice: అందువల్ల వారు ... తో యుద్ధం చేయలేదు
  rationale: נִלְחַם עִם సైనికంగా పోరాడటం లేదా యుద్ధం చేయటాన్ని సూచిస్తుంది. హీబ్రూలోని וְ సందర్భానుసార ఫలిత సంబంధాన్ని కలిగి ఉండటంతో ‘అందువల్ల’ వాక్య సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: יְהוֹשָׁפָט
  choice: యెహోషాపాతు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు లిప్యంతరీకరణను ఉపయోగించాం.
theological_decisions:
- issue: ‘యెహోవా భయం’ అనే పదబంధం యొక్క సందర్భార్థం
  choice: ప్రధాన పాఠంలో ‘యెహోవా భయం’ అని ఉంచి, సందర్భంలో అది చుట్టుపక్కల రాజ్యాలపై వచ్చిన దైవప్రేరిత భీతిని సూచించనివ్వడం
  alternative: ‘యెహోవా కలిగించిన భీతి’ అని అర్థాన్ని ప్రధాన పాఠంలోనే స్పష్టీకరించడం; లేదా యెహోవాపట్ల భక్తిపూర్వక భయంగా గ్రహించడం
  rationale: సైనిక-రాజకీయ సందర్భం శత్రుత్వ చర్యను అడ్డుకున్న భీతిని సూచిస్తుంది. అయినా హీబ్రూ నిర్మాణం కారణం, సంబంధం లేదా భయానికి గురియైన వ్యక్తి అనే భావాల మధ్య కొంత విస్తృతిని కలిగి ఉంది; కాబట్టి ప్రధాన పాఠం ఆ ఉద్రిక్తతను నిలుపుతూ పాదటిప్పణి ప్రత్యామ్నాయాలను వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘దేశాల రాజ్యాలు’ అనే హీబ్రూ ద్వినామ నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపాం. పాదటిప్పణి గుర్తు [a] ప్రధాన పాఠంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
