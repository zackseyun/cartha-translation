id: 2CH.17.16
reference: 2 Chronicles 17:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַל יָד/וֹ֙ עֲמַסְיָ֣ה בֶן זִכְרִ֔י הַ/מִּתְנַדֵּ֖ב לַ/יהוָ֑ה וְ/עִמּ֛/וֹ מָאתַ֥יִם אֶ֖לֶף גִּבּ֥וֹר חָֽיִל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/016.yaml
  text: And under his command was Amasiah son of Zichri[a], who volunteered himself to Yahweh, and with him were two hundred thousand mighty men of valor.
translation:
  language: te
  text: అతని ఆధీనంలో జిక్రీ కుమారుడైన అమస్యా ఉన్నాడు. అతడు యాహ్వేకు తనను తాను స్వచ్ఛందంగా అర్పించుకున్నాడు[a]. అతనితోపాటు రెండు లక్షల మంది పరాక్రమవంతులైన యోధులు ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే కోసం తనను తాను ఇష్టపూర్వకంగా సమర్పించుకున్నాడు.” హీబ్రూ కృదంతం స్వచ్ఛందమైన స్వీయసమర్పణను నొక్కిచెప్పగలదు; ఉపసర్గకు “కు” లేదా “కోసం” అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: అతని ఆధీనంలో
  rationale: సైనిక జాబితాలో ఈ జాతీయ ప్రయోగం ఒకరి అధికారానికి లోబడి ఉండడాన్ని సూచిస్తుంది; అక్షరార్థమైన ‘అతని చేతి దగ్గర’ కంటే ఇది సహజంగా, స్పష్టంగా ఉంది.
- source_word: עֲמַסְיָה בֶן זִכְרִי
  choice: జిక్రీ కుమారుడు అమస్యా
  rationale: వ్యక్తుల పేర్లను లిప్యంతరీకరించి, בֶן అనే వంశసంబంధ సూచనను సహజమైన తెలుగు క్రమంలో ‘కుమారుడు’గా ఇచ్చాం.
- source_word: הַמִּתְנַדֵּב
  choice: తనను తాను స్వచ్ఛందంగా అర్పించుకున్నాడు
  rationale: נדב హిత్పయేల్ కృదంతం స్వచ్ఛందమైన స్వీయ సమర్పణను సూచిస్తుంది. తెలుగు వాక్యంలో ఆ ప్రతిబింబక, స్వచ్ఛంద భావాలను రెండింటినీ స్పష్టంగా నిలిపాం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: ל ఉపసర్గ సమర్పణ యొక్క దిశను లేదా ఉద్దేశాన్ని సూచిస్తుంది. יהוה అనే దైవనామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: וְעִמּוֹ
  choice: అతనితోపాటు ... ఉన్నారు
  rationale: అమస్యాతో అనుబంధంగా ఉన్న సైనికులను సూచించే సహజమైన తెలుగు నిర్మాణం.
- source_word: מָאתַיִם אֶלֶף
  choice: రెండు లక్షల మంది
  rationale: హీబ్రూ సంఖ్యను తెలుగు సంఖ్యా వినియోగానికి సహజమైన ‘రెండు లక్షలు’గా ఇచ్చి, వ్యక్తులను సూచించేందుకు ‘మంది’ చేర్చాం.
- source_word: גִּבּוֹר חָיִל
  choice: పరాక్రమవంతులైన యోధులు
  rationale: ఈ సైనిక పదబంధం బలమైన, సమర్థులైన పోరాట వీరులను సూచిస్తుంది; ఈ ఎంపిక రెండు అంశాల భావాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా పేరుగానే ఉంచాం. ఆధునిక తెలుగు బైబిల్ పాఠకులకు విస్తృతంగా పరిచయమైన లిప్యంతరీకరణ ‘యెహోవా’; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
- issue: לַיהוָה లోని ל ఉపసర్గ భావం
  choice: యెహోవాకు తనను తాను ... అర్పించుకున్నాడు
  alternative: యెహోవా కోసం తనను తాను ... అర్పించుకున్నాడు
  rationale: ల ఉపసర్గ ‘కు’ లేదా ‘కోసం’ అనే రెండు సంబంధిత భావాలను అనుమతిస్తుంది. ప్రధాన పాఠం స్వీయ సమర్పణ దిశను ముందుకు తెస్తుంది; ప్రత్యామ్నాయ ఉద్దేశార్థాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సైనిక-చారిత్రక శైలి పాటించబడింది. దీర్ఘమైన హీబ్రూ సమన్వయ వాక్యాన్ని స్పష్టత కోసం మూడు తెలుగు వాక్యాలుగా విభజించాం; అర్థసంబంధం యథాతథంగా ఉంచాం.
