base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/004.yaml
  text: but he sought the God of his father and walked in his commandments[b][a], and not according to the deeds of Israel.
translation:
  language: te
  text: కాని అతడు తన తండ్రి దేవుణ్ణి వెదికి, ఆయన ఆజ్ఞల ప్రకారం నడుచుకున్నాడు[a]; ఇశ్రాయేలు క్రియల ప్రకారం నడుచుకోలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఎందుకంటే అతడు తన తండ్రి దేవుణ్ణి వెదికాడు’ అని కూడా అనువదించవచ్చు. హీబ్రూ సంధిపదానికి ‘ఎందుకంటే’ అనే భావం రావచ్చు; ముందటి వచనంతో వ్యత్యాసాన్ని స్పష్టం చేయడానికి ప్రధాన పాఠంలో ‘కాని’ అని అనువదించాం.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘ఇశ్రాయేలు’ అనేది యూదాకు భిన్నంగా ఉన్న ఉత్తర ఇశ్రాయేలు రాజ్యాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: కాని
  rationale: ముందటి వచనంతో ఉన్న వ్యత్యాసాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది. అయితే ఈ హీబ్రూ సంధిపదానికి ‘ఎందుకంటే’ అనే అర్థం కూడా సాధ్యమే; దానిని పాదసూచికలో ఉంచాం.
- source_word: לֵאלֹהֵי אָבִיו
  choice: తన తండ్రి దేవుణ్ణి
  rationale: ל ఉపసర్గ ఇక్కడ דרש క్రియకు కర్మను సూచిస్తుంది. ‘తన తండ్రి దేవుడు’ అనే రూపం אָבִיו లోని ఏకవచనాన్ని, దైవసంబంధ కొనసాగింపును నిలుపుతుంది.
- source_word: דָּרָשׁ
  choice: వెదికి
  rationale: ఇది కేవలం సమాచారం అడగడం కాక, దేవుని వైపు భక్తితో తిరిగి ఆయనను ఆశ్రయించడాన్ని సూచిస్తుంది. ‘వెదికి’ మూలార్థాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וּבְמִצְוֺתָיו הָלָךְ
  choice: ఆయన ఆజ్ఞల ప్రకారం నడుచుకున్నాడు
  rationale: הלך లోని జీవనప్రవర్తన రూపకాన్ని ‘నడుచుకున్నాడు’ నిలుపుతుంది; בְּ ను ‘ప్రకారం’గా అనువదించడం ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וְלֹא כְּמַעֲשֵׂה
  choice: క్రియల ప్రకారం నడుచుకోలేదు
  rationale: మునుపటి הָלָךְ క్రియను తెలుగులో పూరించి చెప్పడం సహజం. מַעֲשֶׂה ఇక్కడ ప్రవర్తన లేదా ఆచరణలను సూచిస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: మూలపాఠం చెప్పిన పేరునే నిలిపి, ‘ఉత్తర రాజ్యం’ అనే సందర్భానుసార వివరణను ప్రధాన వాక్యంలో చేర్చలేదు.
theological_decisions:
- issue: ‘ఇశ్రాయేలు’ అనే పదం ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో ‘ఇశ్రాయేలు’ అని యథాతథంగా ఉంచడం
  alternative: ‘ఉత్తర ఇశ్రాయేలు రాజ్యం’ లేదా ‘అహాబు వంశం’
  rationale: సందర్భంలో ఇది యూదాకు భిన్నమైన ఉత్తర రాజ్యాన్ని సూచించే అవకాశం ఎక్కువ. అయినా హీబ్రూ పాఠం కేవలం ‘ఇశ్రాయేలు’ అని మాత్రమే చెబుతుంది; కాబట్టి వ్యాఖ్యానాన్ని ప్రధాన పాఠంలో కలపకుండా పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘నడుచుకున్నాడు’ అనే పదం హీబ్రూ జీవనప్రవర్తన రూపకాన్ని సహజ తెలుగులో నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
