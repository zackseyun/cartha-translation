source:
  edition: WLC
  text: וּ/מִ֨ן בִּנְיָמִ֔ן גִּבּ֥וֹר חַ֖יִל אֶלְיָדָ֑ע וְ/עִמּ֛/וֹ נֹֽשְׁקֵי קֶ֥שֶׁת וּ/מָגֵ֖ן מָאתַ֥יִם אָֽלֶף־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/017.yaml
  text: 'And from Benjamin: Eliada[a], a mighty man of valor, and with him two hundred thousand armed with bow and shield.'
translation:
  language: te
  text: ఇంకా బెన్యామీను గోత్రం నుండి పరాక్రమశాలియైన ఎల్యాదా; అతనితో పాటు విల్లులు, డాళ్లు ధరించినవారు[a] రెండు లక్షల మంది ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విల్లులు, డాళ్లు మోసేవారు’; లేదా, ‘విల్లు, డాలుతో సన్నద్ధమైనవారు.’ హీబ్రూ కృదంతం ఈ ఆయుధాలతో సన్నద్ధమైన మనుషులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן בִּנְיָמִן
  choice: బెన్యామీను గోత్రం నుండి
  rationale: వావ్ ముందున్న జాబితాతో ఈ విభాగాన్ని కలుపుతుంది; తెలుగులో జాబితా కొనసాగింపు సహజంగా ఉండేలా గోత్రసూచనను స్పష్టం చేశాం.
- source_word: גִּבּוֹר חַיִל
  choice: పరాక్రమశాలి
  rationale: ఈ పదబంధం యుద్ధశౌర్యం, సామర్థ్యం గల వ్యక్తిని సూచిస్తుంది; సంక్షిప్తమైన, గౌరవప్రదమైన ఆధునిక తెలుగు రూపం.
- source_word: אֶלְיָדָע
  choice: ఎల్యాదా
  rationale: వ్యక్తి పేరును అనువదించకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: וְעִמּוֹ
  choice: అతనితో
  rationale: మొదట నాయకుని, తరువాత అతనితో ఉన్న సైనికులను పేర్కొనే జాబితా నిర్మాణాన్ని నిలుపుతుంది.
- source_word: נֹשְׁקֵי קֶשֶׁת וּמָגֵן
  choice: విల్లు, డాలు ధరించినవారు
  rationale: נֹשְׁקֵי అనే కృదంతం ఈ ఆయుధాలను ధరించిన లేదా వాటితో సన్నద్ధమైన సైనికులను సూచిస్తుంది; ఆయుధాల ఏకవచన రూపాలు సమూహార్థకంగా ఉన్నాయి.
- source_word: מָאתַיִם אָלֶף
  choice: రెండు లక్షల మంది
  rationale: సైనికుల సంఖ్యను సహజమైన తెలుగు సంఖ్యారూపంలో అందించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి-సైనిక జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి వాడబడింది. హీబ్రూలోని ఆయుధసన్నద్ధత భావాన్ని సహజంగా వ్యక్తం చేస్తూనే దాని సాధ్యమైన అర్థభేదాలను పాదసూచికలో నిలిపాం.
