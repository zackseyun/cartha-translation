translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సైనిక జాబితికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. మూలంలోని సహస్థానం/అధీనత సందిగ్ధతను ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా నిలిపాం.
