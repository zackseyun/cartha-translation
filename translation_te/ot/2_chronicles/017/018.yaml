  yaml_path: translation/ot/2_chronicles/017/018.yaml
  text: And at his side was Jehozabad[b][a], and with him were 180,000 armed for war.
translation:
  language: te
  text: అతని పక్కన యెహోజాబాదు[a] ఉన్నాడు; అతనితో యుద్ధానికి ఆయుధసన్నద్ధులైన 1,80,000 మంది సైనికులు ఉన్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతని పక్కన’—హీబ్రూలో అక్షరార్థంగా ‘అతని చేతి దగ్గర’; ఈ నానుడి అతని ఆధీనంలో ఉండడం లేదా అతని పక్కనే నియమించబడడం అనే భావాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘యుద్ధానికి సన్నద్ధమైన 1,80,000 మంది సైనికులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: అతని పక్కన
  rationale: ఈ హీబ్రూ నానుడి అక్షరార్థంగా ‘అతని చేతి దగ్గర’ అని ఉన్నా, ఇక్కడ సహస్థానం లేదా అనుబంధాన్ని సూచిస్తుంది. ‘అతని ఆధీనంలో’ అనడం సాధ్యమే కాని అధిక వ్యాఖ్యానం అవుతుంది.
- source_word: יְהוֹזָבָד
  choice: యెహోజాబాదు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా, తెలుగులో సహజమైన బైబిలు నామరూపంతో లిప్యంతరీకరించాం.
- source_word: וְעִמּוֹ
  choice: అతనితో ... ఉన్నారు
  rationale: עִם అనేది తోడు లేదా సహవాసాన్ని సూచిస్తుంది; తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా క్రియను చేర్చాం.
- source_word: מֵאָה וּשְׁמוֹנִים אֶלֶף
  choice: 1,80,000 మంది
  rationale: హీబ్రూ సంఖ్యను ఆధునిక తెలుగు పాఠకులకు సులభంగా అర్థమయ్యే భారతీయ అంకెల విభజనతో ఇచ్చాం.
- source_word: חֲלוּצֵי צָבָא
  choice: యుద్ధానికి సన్నద్ధులైన
  rationale: ఈ పదబంధం ఆయుధాలు ధరించి లేదా యుద్ధసేవకు సిద్ధంగా ఉన్నవారిని సూచిస్తుంది. ‘యుద్ధానికి సన్నద్ధులైన’ అనేది సిద్ధత అనే భావాన్ని సహజంగా నిలుపుతుంది.
