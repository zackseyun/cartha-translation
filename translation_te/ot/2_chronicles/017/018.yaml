  text: וְ/עַל יָד֖/וֹ יְהוֹזָבָ֑ד וְ/עִמּ֛/וֹ מֵאָֽה וּ/שְׁמוֹנִ֥ים אֶ֖לֶף חֲלוּצֵ֥י צָבָֽא־־׃ס
