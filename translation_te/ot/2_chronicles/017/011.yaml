source:
  edition: WLC
  text: וּ/מִן פְּלִשְׁתִּ֗ים מְבִיאִ֧ים לִֽ/יהוֹשָׁפָ֛ט מִנְחָ֖ה וְ/כֶ֣סֶף מַשָּׂ֑א גַּ֣ם הָֽ/עַרְבִיאִ֗ים מְבִיאִ֥ים ל/וֹ֙ צֹ֕אן אֵילִ֔ים שִׁבְעַ֤ת אֲלָפִים֙ וּ/שְׁבַ֣ע מֵא֔וֹת וּ/תְיָשִׁ֕ים שִׁבְעַ֥ת אֲלָפִ֖ים וּ/שְׁבַ֥ע מֵאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/011.yaml
  text: 'And some of the Philistines were bringing Jehoshaphat tribute and silver[a], a burden[b]; the Arabians also were bringing him flocks: 7,700 rams and 7,700 male goats.'
translation:
  language: te
  text: 'ఫిలిష్తీయులలో కొందరు యెహోషాపాతుకు కప్పంగా కానుకను, ఒక మోత వెండినీ[a] తీసుకొస్తూ ఉండేవారు. అరబీయులు కూడా అతనికి మందలను తీసుకొస్తూ ఉండేవారు: 7,700 పొట్టేళ్లు, 7,700 మగ మేకలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఫిలిష్తీయుల నుండి.” హీబ్రూ పదబంధం వారిలో కొందరిని సూచించవచ్చు; లేదా కానుకలు వచ్చిన మూలాన్ని నొక్కి చెప్పవచ్చు. “ఒక మోత వెండి” అనే మాటకు అక్షరార్థం “వెండి, ఒక మోత/బరువు”; అంటే కప్పంగా మోసుకొచ్చిన వెండి.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: וּ/מִן פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులలో కొందరు
  rationale: מִן ఒక జనసమూహ నామంతో వచ్చినప్పుడు మూలాన్ని (‘ఫిలిష్తీయుల నుండి’) లేదా సమూహంలోని కొంతమందిని సూచించవచ్చు. ప్రధాన పాఠంలో సహజమైన భాగార్థాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: מְבִיאִים
  choice: తీసుకొస్తూ ఉండేవారు
  rationale: వర్తమాన కృదంతం ఈ కథన సందర్భంలో కొనసాగుతున్న లేదా తరచుగా జరిగే చర్యను సూచిస్తుంది.
- source_word: מִנְחָה
  choice: కప్పముగా కానుకలు
  rationale: విదేశీ ప్రజలు రాజుకు ఇచ్చే రాజకీయ సందర్భంలో ఇది సాధారణ కానుకకన్నా కప్పం/రాజభేటి భావాన్ని కలిగి ఉంది; ‘కప్పముగా కానుకలు’ ఆ భావాన్ని సాధారణ పాఠకునికి స్పష్టం చేస్తుంది.
- source_word: וְ/כֶסֶף מַשָּׂא
  choice: మోయదగినంత వెండి
  rationale: అక్షరార్థంగా ‘వెండి, ఒక మోత/బరువు.’ వెండిని మోసుకొచ్చిన కప్పంగా సూచించే స్పష్టమైన తెలుగు రూపం; మూలంలోని దృశ్యరూపాన్ని నిలుపుతుంది.
- source_word: גַּם הָעַרְבִיאִים
  choice: అరబీయులు కూడా
  rationale: גַּם యొక్క కూడిక భావాన్నీ, చారిత్రక ప్రజాసమూహ సూచననూ నిలుపుతుంది.
- source_word: ל/וֹ צֹאן
  choice: అతనికి మందలు
  rationale: צֹאן గొర్రెలు, మేకలు వంటి చిన్న పశువులను సమష్టిగా సూచిస్తుంది; వెంటనే పొట్టేళ్లు, మగ మేకలు ప్రత్యేకంగా లెక్కించబడుతున్నాయి.
- source_word: אֵילִים
  choice: పొట్టేళ్లు
  rationale: పెరిగిన మగ గొర్రెలకు సహజమైన ఆధునిక తెలుగు పదం.
- source_word: שִׁבְעַת אֲלָפִים וּשְׁבַע מֵאוֹת
  choice: 7,700
  rationale: ఆధునిక పఠన సౌలభ్యం కోసం అంకెలను వాడినా పరిమాణంలో మార్పు లేదు.
- source_word: וּ/תְיָשִׁים
  choice: మగ మేకలు
  rationale: תְּיָשִׁים ప్రత్యేకంగా మగ మేకలను సూచిస్తుంది; లింగ విశిష్టతను స్పష్టంగా నిలుపుతుంది.
