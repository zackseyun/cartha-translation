translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి. కొనసాగుతున్న/అలవాటైన చర్యను ‘తీసుకొస్తూ ఉండేవారు’తో వ్యక్తం చేశాం. మూలంలోని ‘వెండి—మోత’ రూపకాన్ని సహజ తెలుగులో ఉంచి పాదటిప్పణిలో అక్షరార్థాన్ని తెలిపాం.
