  text: And under his command was Jehohanan the commander[a], and with him were two hundred and eighty thousand.
translation:
  language: te
  text: అతని ఆధీనంలో[a] సేనాధిపతి యెహోహానాను ఉన్నాడు; అతనితో 2,80,000 మంది ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని పక్కన” లేదా “అతని అధికారం కింద.” హీబ్రూ నుడికారం అక్షరార్థంగా “అతని చేతిమీద” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: అతని ఆధీనంలో
  rationale: ‘అతని చేతిమీద’ అని అక్షరార్థంగా ఉండే ఈ హీబ్రూ నుడికారం, ఈ సైనిక జాబితా సందర్భంలో ఒకరి అధికారానికి లేదా నాయకత్వానికి లోబడి ఉండడాన్ని సూచిస్తుంది. ‘అతని ఆధీనంలో’ సహజంగా ఉండి ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוֹחָנָן
  choice: యెహోహానాను
  rationale: హీబ్రూ వ్యక్తినామ ధ్వనిరూపాన్ని తెలుగులో సాధ్యమైనంత సమీపంగా లిప్యంతరీకరించింది.
- source_word: הַשַּׂר
  choice: సేనాధిపతి
  rationale: שַׂר అనే పదానికి అధిపతి, అధికారి, నాయకుడు వంటి విస్తృత అర్థాలున్నాయి; ఇక్కడ సైనిక బలగాల లెక్కింపు సందర్భం కావడంతో ‘సేనాధిపతి’ తగిన అర్థాన్ని ఇస్తుంది.
- source_word: וְעִמּוֹ
  choice: అతనితో ... ఉన్నారు
  rationale: యెహోహానానుతో ఉన్న సైనికుల సంఖ్యను పరిచయం చేస్తుంది. తెలుగులో సంపూర్ణమైన, సహజమైన వాక్యం కోసం ‘ఉన్నారు’ చేర్చబడింది.
- source_word: מָאתַיִם וּשְׁמוֹנִים אָלֶף
  choice: 2,80,000
  rationale: హీబ్రూ సంఖ్యను ఖచ్చితంగా భారతీయ అంకెల విభజన పద్ధతిలో అందిస్తుంది; లెక్కించబడినవారు సైనికులని సందర్భం సూచిస్తున్నందున ‘మంది’ చేర్చబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. సైనిక సందర్భాన్ని స్పష్టం చేయడానికి ‘సేనాధిపతి,’ వ్యక్తుల సంఖ్యకు ‘మంది’ వాడబడ్డాయి; హీబ్రూ నుడికారంలోని భావ వైవిధ్యం పాదసూచికలో నిలుపబడింది.
