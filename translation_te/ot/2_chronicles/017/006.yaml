  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּגְבַּ֥הּ לִבּ֖/וֹ בְּ/דַרְכֵ֣י יְהוָ֑ה וְ/ע֗וֹד הֵסִ֛יר אֶת הַ/בָּמ֥וֹת וְ/אֶת הָ/אֲשֵׁרִ֖ים מִ/יהוּדָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/006.yaml
  text: His heart was exalted in the ways of Yahweh[b][a], and furthermore he removed the high places and the Asherim from Judah.
translation:
  language: te
  text: యహ్వే మార్గాల్లో అతని హృదయం పైకెగసింది[a]. అంతేకాక, అతడు యూదాలోని ఉన్నత పూజాస్థలాలను, అషేరీంను[b] తొలగించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతని హృదయం ధైర్యం పొందింది’ లేదా ‘దృఢమైంది’ అని కూడా అర్థం కావచ్చు. హీబ్రూ నుడికారంలో హృదయం ఉన్నతమవడం అహంకారాన్ని లేదా ధైర్యాన్ని సూచించగలదు; ఇక్కడి సందర్భం అనుకూలమైన భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘అషేరా ఆరాధనా వస్తువులు’ లేదా ‘అషేరా స్తంభాలు’ అని కూడా అనువదించవచ్చు. ఈ హీబ్రూ పదం అషేరా ఆరాధనతో ముడిపడిన పవిత్ర చెట్లు, చెక్క స్తంభాలు లేదా ఇతర ఆచార వస్తువులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבַּהּ לִבּוֹ
  choice: అతని హృదయం పైకెగసింది
  rationale: గבהּ అనే క్రియలోని ‘ఎత్తుకెళ్లడం/ఉన్నతమవడం’ అనే రూపకాన్ని నిలుపుతుంది. సందర్భం దీన్ని అహంకారంగా కాక, యహ్వే మార్గాల పట్ల ధైర్యం లేదా దృఢనిశ్చయంగా సూచించినా, ప్రధాన పాఠం ఆ భావాన్ని పూర్తిగా నిర్దిష్టం చేయదు.
- source_word: בְּדַרְכֵי יְהוָה
  choice: యహ్వే మార్గాల్లో
  rationale: దేవుని చిత్తానుసారమైన జీవన విధానాన్ని సూచించే హీబ్రూ ‘మార్గాలు’ అనే రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది; יהוה అనే వ్యక్తిగత నామాన్ని ‘యహ్వే’గా లిప్యంతరీకరించింది.
- source_word: וְעוֹד
  choice: అంతేకాక
  rationale: ముందటి వాక్యానికి మరొక చర్యను జోడించే పదబంధంలోని భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הֵסִיר
  choice: తొలగించాడు
  rationale: హిఫిల్ రూపంలోని ‘తీసివేయడం/తొలగించడం’ అనే సూటి భావాన్ని అందిస్తుంది; సంస్కరణ చర్యను అతిశయింపజేయదు.
- source_word: הַבָּמוֹת
  choice: ఉన్నత పూజాస్థలాలు
  rationale: במות అనేవి ఆరాధనకు సంబంధించిన ఎత్తైన లేదా ప్రత్యేక స్థలాలు. ‘ఉన్నత స్థలాలు’ మాత్రమే అనడం ఆధునిక పాఠకులకు అస్పష్టంగా ఉండవచ్చు కాబట్టి ‘పూజా’ అనే వివరణాత్మక పదాన్ని చేర్చింది.
- source_word: הָאֲשֵׁרִים
  choice: అషేరీం
  rationale: ఈ పదం అషేరా ఆరాధనతో ముడిపడిన వస్తువులను సూచిస్తుంది; అవి ఖచ్చితంగా స్తంభాలా, చెట్లా, మరే చెక్క చిహ్నాలా అన్నది నిర్దిష్టం కానందున మూలపదాన్ని లిప్యంతరీకరించి, పాదసూచికలో వివరణ ఇచ్చింది.
- source_word: מִיהוּדָה
  choice: యూదాలోని
  rationale: తొలగించబడిన ఆరాధనా స్థలాలు, వస్తువులు యూదా ప్రాంతంలో ఉన్నాయని సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది.
theological_decisions:
- issue: וַיִּגְבַּהּ לִבּוֹ అహంకారాన్ని సూచిస్తుందా, లేక ధైర్యం/దృఢనిశ్చయాన్ని సూచిస్తుందా?
  choice: ‘అతని హృదయం పైకెగసింది’ అనే రూపకాన్ని నిలిపి, సందర్భంలోని అనుకూల భావాన్ని పాదసూచికలో వివరించడం
  alternative: ‘అతడు యహ్వే మార్గాల్లో ధైర్యంగా నడిచాడు’ లేదా ‘అతని హృదయం గర్వించింది’
  rationale: ‘యహ్వే మార్గాల్లో’ అనే పరిమితి, వెంటనే చెప్పబడిన విగ్రహారాధనా నిర్మూలన—ఇవి అనుకూలమైన ధైర్యం లేదా దృఢనిశ్చయాన్ని సూచిస్తాయి. అయితే హీబ్రూ రూపకం స్వయంగా కొంత భావవిస్తృతిని కలిగి ఉండటంతో దానిని ప్రధాన పాఠంలో పూర్తిగా పరిష్కరించలేదు.
- issue: אֲשֵׁרִים యొక్క ఖచ్చితమైన రూపం
  choice: అషేరీం అని లిప్యంతరీకరించి పాదసూచికలో అర్థం వివరించడం
  alternative: అషేరా స్తంభాలు లేదా పవిత్ర కర్రలు
  rationale: ఈ పదం అషేరా ఆరాధనతో సంబంధమున్న ఆచార వస్తువులను సూచిస్తుంది; వాటి భౌతిక రూపాన్ని ‘స్తంభాలు’ అని నిర్బంధించడం మూలంలోని అనిశ్చితిని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి ఉపయోగించబడింది. ‘హృదయం పైకెగసింది’ అనే కొద్దిగా కవితాత్మక రూపకం మూలంలోని భావసందిగ్ధతను నిలుపుతుంది; అపరిచితమైన ‘అషేరీం’కు పాదసూచిక వివరణ ఇస్తుంది.
