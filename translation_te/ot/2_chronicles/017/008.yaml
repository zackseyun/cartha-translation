source:
  edition: WLC
  text: וְ/עִמָּ/הֶ֣ם הַ/לְוִיִּ֗ם שְֽׁמַֽעְיָ֡הוּ וּ/נְתַנְיָ֡הוּ וּ/זְבַדְיָ֡הוּ וַ/עֲשָׂהאֵ֡ל ו/שמרימות וִֽ/יהוֹנָתָן֩ וַ/אֲדֹ֨נִיָּ֧הוּ וְ/טֽוֹבִיָּ֛הוּ וְ/ט֥וֹב אֲדוֹנִיָּ֖ה הַ/לְוִיִּ֑ם וְ/עִמָּ/הֶ֛ם אֱלִישָׁמָ֥ע וִֽ/יהוֹרָ֖ם הַ/כֹּהֲנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/008.yaml
  text: 'And with them were the Levites: Shemaiah[a], Nethaniah, Zebadiah, Asahel, Shemiramoth, Jehonathan, Adonijah, Tobijah, and Tob-adonijah; and with them were Elishama and Jehoram[c][b], the priests.'
translation:
  language: te
  text: వారితో పాటు లేవీయులైన షెమయా, నెతన్యా, జెబద్యా, అసాహేలు, షెమీరామోతు, యెహోనాతాను[a], అదోనీయా, టోబీయా[b], టోబ్-అదోనీయా[c] ఉన్నారు; వారితో పాటు యాజకులైన ఎలీషామా, యెహోరాము కూడా ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యెహోనాతాను’ అనేది ఇక్కడి పూర్తి హీబ్రూ నామరూపాన్ని ప్రతిబింబిస్తుంది; కొన్ని అనువాదాల్లో సంక్షిప్తంగా ‘యోనాతాను’ అని ఉంటుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ఈ పేరు ‘టోబియ్యాహు’ అనే పూర్తి రూపంలో ఉంది. ఇక్కడ సంప్రదాయ తెలుగు రూపమైన ‘టోబీయా’ను వాడాం; కొన్ని అనువాదాల్లో ‘టోబియా’ అని ఉంటుంది.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో ‘టోబ్ అదోనీయా’ అని రెండు భాగాలుగా వ్రాయబడింది; ఇది బహుశా ఒకే సంయుక్త వ్యక్తినామం. అందుకే ఇక్కడ హైఫన్‌తో ఇచ్చాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: వారితో పాటు ... ఉన్నారు
  rationale: ఈ పదబంధం జాబితాలోని వారు ముందుగా చెప్పబడిన వారితో కలిసి ఉన్నారని సూచిస్తుంది. సహవాస భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేయడానికి ‘వారితో పాటు’ అని, వాక్యపూర్ణత కోసం ‘ఉన్నారు’ అని ఇచ్చాం.
- source_word: הַלְוִיִּם
  choice: లేవీయులైన
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదం ఉంది; ఇది లేవీయుల వర్గానికి చెందినవారిని సూచిస్తుంది. పేర్ల జాబితాతో సహజంగా కలవడానికి ‘లేవీయులైన’ అని ఇచ్చాం.
- source_word: שְׁמַעְיָהוּ
  choice: షెమయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు పాఠకులకు సహజంగా ఉండే ధ్వన్యనుకరణలో ఇచ్చాం.
- source_word: נְתַנְיָהוּ
  choice: నెతన్యా
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన, తెలుగులో పలకడానికి సులభమైన రూపం.
- source_word: זְבַדְיָהוּ
  choice: జెబద్యా
  rationale: మూలంలోని వ్యక్తినామాన్ని అనువదించకుండా ధ్వన్యనుకరణ చేశాం.
- source_word: עֲשָׂהאֵל
  choice: అసాహేలు
  rationale: హీబ్రూ వ్యక్తినామానికి సంప్రదాయ తెలుగు ధ్వన్యనుకరణ.
- source_word: שמרימות
  choice: షెమీరామోతు
  rationale: వ్యంజన పాఠం సూచించే వ్యక్తినామాన్ని తెలుగులో స్పష్టంగా పలికేలా ధ్వన్యనుకరణ చేశాం.
- source_word: יְהוֹנָתָן
  choice: యెహోనాతాను
  rationale: ఇక్కడ ఉన్న పూర్తి హీబ్రూ రూపాన్ని సంక్షిప్త ‘యోనాతాను’ రూపంగా మార్చకుండా ప్రతిబింబించాం.
- source_word: אֲדֹנִיָּהוּ
  choice: అదోనీయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుకరణలో ఇచ్చాం.
- source_word: טוֹבִיָּהוּ
  choice: టోబీయా
  rationale: మూలంలోని -యాహు సంబంధిత పూర్తి నామరూపాన్ని తెలుగులో సహజంగా ప్రతిబింబించే రూపం.
- source_word: טוֹב אֲדוֹנִיָּה
  choice: టోబ్-అదోనీయా
  rationale: మసొరెటిక్ పాఠంలో రెండు భాగాలుగా కనిపించినా, వాక్యంలో ఒకే వ్యక్తినామంగా పనిచేసే అవకాశాన్ని హైఫన్‌తో పారదర్శకంగా నిలిపాం.
- source_word: הַכֹּהֲנִים
  choice: యాజకులైన
  rationale: చివరి ఇద్దరిని ముందటి లేవీయుల జాబితా నుంచి వేరుగా యాజకులుగా గుర్తించే హీబ్రూ నిర్మాణాన్ని స్పష్టంగా నిలిపాం.
theological_decisions:
- issue: లేవీయులు, యాజకుల మధ్య భేదం
  choice: మొదటి తొమ్మిది మందిని లేవీయులుగా, ఎలీషామా మరియు యెహోరామును యాజకులుగా వేరుగా గుర్తించడం
  alternative: పేర్లన్నింటినీ ఒకే లేవీయుల జాబితాగా చూపించడం
  rationale: హీబ్రూ వాక్యనిర్మాణం మొదట ‘లేవీయులు’ అని ఒక సమూహాన్ని, తరువాత మళ్లీ ‘వారితో పాటు’ అని ఎలీషామా, యెహోరాములను ‘యాజకులు’గా ప్రత్యేకంగా పరిచయం చేస్తుంది. ఈ సంస్థాగత భేదాన్ని సమతలీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడాం. పేర్లను అనువదించకుండా ధ్వన్యనుకరణ చేశాం. పునరుక్తమైన ‘వారితో పాటు’ నిర్మాణాన్ని నిలిపి, రెండు అధికారిక వర్గాల మధ్య మూలపాఠంలోని భేదాన్ని స్పష్టంగా ఉంచాం.
