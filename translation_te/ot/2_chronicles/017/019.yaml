  text: אֵ֖לֶּה הַ/מְשָׁרְתִ֣ים אֶת הַ/מֶּ֑לֶךְ מִ/לְּ/בַ֞ד אֲשֶׁר נָתַ֥ן הַ/מֶּ֛לֶךְ בְּ/עָרֵ֥י הַ/מִּבְצָ֖ר בְּ/כָל יְהוּדָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/019.yaml
  text: These were the ones serving the king[a], besides those whom the king had stationed in the fortified cities throughout all Judah.
translation:
  language: te
  text: వీరే రాజుకు సేవచేసేవారు; వీరితో పాటు, యూదా దేశమంతటా ఉన్న ప్రాకార పట్టణాల్లో రాజు ఉంచినవారు[a] కూడా ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నియమించినవారు.’
    reason: נתן అనే క్రియకు సందర్భానుసారంగా అధికారికంగా నియమించడం అనే అర్థం సాధ్యం; ప్రధాన పాఠంలోని ‘ఉంచినవారు’ మూలపదం యొక్క విస్తృత అర్థాన్ని కాపాడుతుంది.
lexical_decisions:
- source_word: אֵלֶּה הַמְשָׁרְתִים אֶת־הַמֶּלֶךְ
  choice: వీరే రాజుకు సేవచేస్తున్నవారు
  rationale: אֵלֶּה ముందుగా పేర్కొన్న సైనికాధికారులు, సైనికులను తిరిగి సూచిస్తుంది. שׁרת అనే కృదంతం అధికారిక సేవ లేదా పరిచర్యను సూచిస్తుంది; ఈ సైనిక-పరిపాలనా సందర్భంలో ‘సేవచేస్తున్నవారు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: מִלְּבַד
  choice: వీరు కాకుండా
  rationale: ముందు పేర్కొన్న వర్గానికి అదనంగా మరో వర్గం ఉందని ఈ పదం సూచిస్తుంది. తెలుగులో ‘వీరు కాకుండా’ ఆ భేదాన్నీ అదనపు భావాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר נָתַן הַמֶּלֶךְ
  choice: రాజు నియమించినవారు
  rationale: נתן ప్రాథమికంగా ‘ఇవ్వడం/ఉంచడం’ అని అర్థమైనా, ప్రాకార పట్టణాల్లో సైనికులను మోహరించే ఈ సందర్భంలో ‘నియమించినవారు’ దాని కార్యసంబంధ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּעָרֵי הַמִּבְצָר
  choice: ప్రాకార పట్టణాల్లో
  rationale: ఈ నిర్మాణం రక్షణ కోసం బలపరచబడిన పట్టణాలను సూచిస్తుంది. ‘ప్రాకార పట్టణాలు’ సంక్షిప్తమైన, గౌరవప్రదమైన, సందర్భోచిత తెలుగు ప్రయోగం.
- source_word: בְּכָל־יְהוּדָה
  choice: యూదా దేశమంతటా
  rationale: בְּతో కూడిన כָּל భూభాగమంతటా విస్తరించి ఉన్న పంపిణీ భావాన్ని ఇస్తుంది; ‘దేశమంతటా’ ఆ సమగ్రతను సహజంగా అందిస్తుంది.
