translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని రెండు సిబ్బంది వర్గాల మధ్య భేదాన్ని రెండు చిన్న వాక్యాలుగా సహజంగా వ్యక్తం చేశాం.
