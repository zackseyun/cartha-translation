  text: וַ/יְהִ֧י יְהוֹשָׁפָ֛ט הֹלֵ֥ךְ וְ/גָדֵ֖ל עַד לְ/מָ֑עְלָ/ה וַ/יִּ֧בֶן בִּֽ/יהוּדָ֛ה בִּירָנִיּ֖וֹת וְ/עָרֵ֥י מִסְכְּנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/012.yaml
  text: And Jehoshaphat became greater and greater[b][a], and he built fortresses and store cities in Judah.
translation:
  language: te
  text: యెహోషాపాతు అంతకంతకూ గొప్పవాడవుతూ, ఎంతో ఉన్నత స్థాయికి చేరాడు. అతడు యూదాలో కోటలను[a], నిల్వ పట్టణాలను[b] నిర్మించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దుర్గాలను.’ హీబ్రూ పదం బలపరచబడిన రక్షణ స్థావరాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘సరఫరా పట్టణాలను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֹלֵךְ וְגָדֵל עַד לְמָעְלָה
  choice: అంతకంతకు అత్యంత గొప్పవాడయ్యాడు
  rationale: హీబ్రూ క్రియారూపాల ప్రగతిశీల భావాన్ని ‘అంతకంతకు’ తెలియజేస్తుంది; עַד לְמָעְלָה ఇచ్చే తీవ్రతను ‘అత్యంత’ నిలుపుతుంది.
- source_word: וַיִּבֶן
  choice: కట్టించాడు
  rationale: రాజైన యెహోషాపాతు నిర్మాణాలు చేయించిన పరిపాలనా సందర్భంలో సహజమైన తెలుగు ప్రయోగం; నిర్మాణ కార్యానికి అతడే కర్తృత్వం వహించాడనే భావాన్ని నిలుపుతుంది.
- source_word: בִּירָנִיּוֹת
  choice: కోటలను
  rationale: బలపరచబడిన రక్షణ స్థావరాలను సూచించే పదానికి సాధారణ ఆధునిక తెలుగులో స్పష్టమైన సమానార్థకం.
- source_word: עָרֵי מִסְכְּנוֹת
  choice: నిల్వ పట్టణాలను
  rationale: సరకులు లేదా సరఫరాలు నిల్వచేయడానికి ఉపయోగించిన పట్టణాల పరిపాలనా విధిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בִּיהוּדָה
  choice: యూదాలో
  rationale: నిర్మాణాలు జరిగిన ప్రదేశాన్ని తెలిపే స్థానార్థక పదబంధానికి ప్రత్యక్ష అనువాదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ప్రగతిశీల వృద్ధి మరియు తీవ్రత రెండింటినీ ప్రధాన వాక్యంలో వ్యక్తం చేశాం.
