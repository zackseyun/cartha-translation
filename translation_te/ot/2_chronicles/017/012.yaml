- from: యెహోషాపాతు అంతకంతకు అత్యంత గొప్పవాడయ్యాడు. అతడు యూదాలో కోటలను[a], నిల్వ పట్టణాలను[b] కట్టించాడు.
  to: యెహోషాపాతు అంతకంతకూ గొప్పవాడవుతూ, ఎంతో ఉన్నత స్థాయికి చేరాడు. అతడు యూదాలో కోటలను[a], నిల్వ పట్టణాలను[b] నిర్మించాడు.
  rationale: The revision preserves the Hebrew progressive increase and its intensification in idiomatic Telugu, replaces an unwarranted causative construction with a direct equivalent of “he built,” and retains the lexical-alternative footnote anchors.
