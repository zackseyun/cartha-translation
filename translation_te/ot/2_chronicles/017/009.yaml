revisions:
- from: వారు యూదాలో బోధించారు. యహ్వే ధర్మశాస్త్ర గ్రంథం[a] వారితో ఉంది. వారు యూదా పట్టణాలన్నిటిలో తిరిగి, ప్రజల మధ్య బోధించారు.[b]
  to: వారు యూదాలో బోధించారు; యహ్వే ధర్మశాస్త్ర గ్రంథం[a] వారితో ఉంది. వారు యూదాలోని అన్ని పట్టణాల్లో సంచరిస్తూ ప్రజల మధ్య బోధించారు.[b]
  rationale: ఈ స్వల్ప సవరణ మూలపాఠంలోని అర్థాన్ని మార్చదు. ‘సంచరిస్తూ’ ద్వారా వַיָּסֹבּוּ యొక్క ప్రయాణించి చుట్టివెళ్లే భావాన్ని స్పష్టపరుస్తుంది; మొదటి రెండు భాగాలను సెమికోలన్‌తో కలపడం ద్వారా హీబ్రూ సమన్వయాన్ని మెరుగ్గా ప్రతిబింబిస్తుంది. పాదసూచికలో ‘చుట్టపత్రం’ అనే పదం ప్రత్యామ్నాయ పఠనాన్ని స్పష్టంగా తెలియజేస్తుంది.
