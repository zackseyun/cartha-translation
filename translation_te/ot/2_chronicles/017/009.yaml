id: 2CH.17.9
reference: 2 Chronicles 17:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְלַמְּדוּ֙ בִּֽ/יהוּדָ֔ה וְ/עִ֨מָּ/הֶ֔ם סֵ֖פֶר תּוֹרַ֣ת יְהוָ֑ה וַ/יָּסֹ֨בּוּ֙ בְּ/כָל עָרֵ֣י יְהוּדָ֔ה וַֽ/יְלַמְּד֖וּ בָּ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/009.yaml
  text: They taught in Judah[a], and the Book of the Law of Yahweh was with them[c][b]; they went around through all the cities of Judah and taught among the people.
translation:
  language: te
  text: వారు యూదాలో బోధించారు; యహ్వే ధర్మశాస్త్ర గ్రంథం[a] వారితో ఉంది. వారు యూదాలోని అన్ని పట్టణాల్లో సంచరిస్తూ ప్రజల మధ్య బోధించారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యహ్వే ధర్మశాస్త్రపు చుట్టపత్రం.” ఇక్కడి హీబ్రూ పదం చుట్ట రూపంలో ఉన్న లిఖిత పత్రాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ప్రజలకు బోధించారు.” హీబ్రూ వాక్యం మరింత అక్షరార్థంగా “ప్రజల మధ్య బోధించారు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְלַמְּדוּ
  choice: బోధించారు
  rationale: למד పియేల్ రూపం ‘బోధించడం, నేర్పించడం’ అనే అర్థం ఇస్తుంది. వచనంలో రెండుసార్లు వచ్చిన ఒకే క్రియకు ఒకే సహజమైన పదాన్ని ఉపయోగించాం.
- source_word: בִּיהוּדָה
  choice: యూదాలో
  rationale: ב ఇక్కడ స్థలాన్ని సూచిస్తుంది. తరువాత పట్టణాలన్నిటిలో తిరిగినట్లు స్పష్టంగా ఉన్నందున, మొదటి పదబంధాన్ని సరళంగా అనువదించాం.
- source_word: וְעִמָּהֶם
  choice: వారితో ఉంది
  rationale: ఇది క్రియలేని హీబ్రూ వాక్యభాగం; తెలుగులో సహజంగా ఉండేందుకు ‘ఉంది’ని పూరించాం. గ్రంథం వారి వెంట ఉన్నదనే సహచర్య భావం నిలిచింది.
- source_word: סֵפֶר תּוֹרַת יְהוָה
  choice: యహ్వే ధర్మశాస్త్ర గ్రంథం
  rationale: סֵפֶר లిఖిత పత్రం లేదా గ్రంథాన్ని సూచిస్తుంది; అది చుట్ట రూపంలో ఉండవచ్చని పాదసూచికలో తెలిపాం. ఈ సందర్భంలో תּוֹרָה దేవుని నిబంధన సంబంధమైన ధర్మశాస్త్రాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించాం.
- source_word: וַיָּסֹבּוּ
  choice: తిరిగి
  rationale: סבב ఇక్కడ ఒక చోటు నుంచి మరో చోటుకు సంచరిస్తూ వెళ్లడాన్ని సూచిస్తుంది. ‘పట్టణాలన్నిటిలో తిరిగి’ అనే ప్రయోగం తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: యూదా పట్టణాలన్నిటిలో
  rationale: చలనాన్ని సూచించే క్రియతో కలిసి, వారు యూదాలోని పట్టణాలన్నిటికీ వెళ్లిన విస్తృతిని ఈ రూపం సహజంగా తెలియజేస్తుంది.
- source_word: וַיְלַמְּדוּ בָּעָם
  choice: ప్రజల మధ్య బోధించారు
  rationale: עָם ముందు ఉన్న ב ఉపసర్గను గౌరవిస్తూ, బోధన ప్రజల మధ్య జరిగిందనే భావాన్ని నిలిపాం. ‘ప్రజలకు బోధించారు’ అనేది సాధ్యమైన సహజ ప్రత్యామ్నాయం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: תּוֹרַת అనే పదంలోని ‘ధర్మశాస్త్రం/ఉపదేశం’ భావం
  choice: ధర్మశాస్త్రం
  alternative: ఉపదేశం
  rationale: תּוֹרָה సాధారణంగా ‘ఉపదేశం’ అని అర్థమివ్వగలిగినా, ‘యహ్వే యొక్క గ్రంథం’ అనే ఈ సందర్భంలో అది నిబంధన సంబంధమైన ధర్మశాస్త్ర సంపుటిని సూచిస్తుంది. అయినా దాని బోధనా స్వభావాన్ని అనువాదం అతిగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. పొడవైన హీబ్రూ సమన్వయ వాక్యాన్ని తెలుగులో స్పష్టత కోసం మూడు వాక్యాలుగా విభజించాం. ‘బోధించారు’ అనే పదాన్ని రెండుచోట్లా నిలిపి మూలంలోని పునరుక్తిని కాపాడాం.
