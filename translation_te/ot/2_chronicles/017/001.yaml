  yaml_path: translation/ot/2_chronicles/017/001.yaml
  text: And Jehoshaphat his son became king in his place, and he strengthened himself against Israel.
translation:
  language: te
  text: అతని కుమారుడైన యెహోషాపాతు అతని స్థానంలో రాజయ్యాడు; అతడు ఇశ్రాయేలుకు వ్యతిరేకంగా తనను తాను బలపరచుకున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: హీబ్రూ క్రియలోని ‘రాజుగా పాలించడం ప్రారంభించాడు/రాజయ్యాడు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: పూర్వ రాజుకు వారసునిగా సింహాసనం అధిష్ఠించిన భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: וַיִּתְחַזֵּק
  choice: తన స్థానాన్ని బలపరచుకున్నాడు
  rationale: హిత్పయేల్ రూపంలోని తనను తాను బలపరచుకోవడం/తన అధికారాన్ని పటిష్ఠం చేసుకోవడం అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: עַל־יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు ఎదురుగా
  rationale: ఈ సందర్భంలో עַל విరోధ దిశను సూచిస్తుంది; యూదా రాజు ఉత్తర రాజ్యమైన ఇశ్రాయేలుకు వ్యతిరేకంగా తన రక్షణ స్థితిని బలపరచుకున్నాడనే భావాన్ని అతిగా వివరణ చేయకుండా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గౌరవప్రదమైన చారిత్రక వర్ణనా శైలి. ‘ఎదురుగా’ అనే పదం మూలంలోని విరోధ భావాన్ని నిలుపుతూ, యుద్ధం చేశాడని అదనపు భావాన్ని చేర్చదు.
