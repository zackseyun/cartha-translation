  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תְּהִ֥י שִׂמְחָֽה גְדוֹלָ֖ה בִּֽ/ירוּשָׁלִָ֑ם כִּ֠י מִ/ימֵ֞י שְׁלֹמֹ֤ה בֶן דָּוִיד֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל לֹ֥א כָ/זֹ֖את בִּ/ירוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/026.yaml
  text: So there was great joy in Jerusalem, for since the days of Solomon son of David, king of Israel, there had been nothing like this in Jerusalem.
translation:
  language: te
  text: అప్పుడు యెరూషలేములో గొప్ప ఆనందం కలిగింది; ఎందుకంటే దావీదు కుమారుడైన ఇశ్రాయేలు రాజు సొలొమోను కాలం నుండి యెరూషలేములో ఇలాంటిది జరగలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: కాబట్టి ... కలిగింది
  rationale: వావ్-క్రమ రూపం కథనాన్ని ముందుకు నడిపిస్తూ, ముందటి సంఘటనల ఫలితాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘కాబట్టి’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שִׂמְחָה גְדוֹלָה
  choice: ఎంతో ఆనందం
  rationale: నామవాచకం-విశేషణం కలయిక తీవ్రమైన, సామూహిక ఆనందాన్ని సూచిస్తుంది; ‘ఎంతో ఆనందం’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: בִּירוּשָׁלָם
  choice: యెరూషలేములో
  rationale: בְּ ఉపసర్గంలోని స్థలార్థాన్ని నేరుగా, సహజంగా వ్యక్తపరుస్తుంది; హెబ్రీ పాఠంలోని పునరుక్తిని రెండుసార్లూ నిలిపింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇక్కడ כִּי ముందటి వాక్యానికి కారణం లేదా వివరణను పరిచయం చేస్తుంది.
- source_word: מִימֵי
  choice: కాలం నుండి
  rationale: గతంలోని ఒక కాలాన్ని ఆరంభ బిందువుగా తీసుకొని ప్రస్తుత సంఘటన వరకు సాగే కాలపరమైన పోలికను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: שְׁלֹמֹה בֶן דָּוִיד
  choice: దావీదు కుమారుడు సొలొమోను
  rationale: హెబ్రీ నిర్మాణంలోని బంధుత్వ సంబంధాన్ని స్పష్టంగా ఉంచుతూ, తెలుగులో సహజమైన పదక్రమాన్ని అనుసరిస్తుంది.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజైన
  rationale: సొలొమోనును గుర్తించే సమానాధికార బిరుదును తెలుగులో సులభంగా అనుసంధానిస్తుంది; ఇది ‘దావీదు’కు కాక ‘సొలొమోను’కు వర్తిస్తుందని వాక్యనిర్మాణం స్పష్టం చేస్తుంది.
- source_word: לֹא כָזֹאת
  choice: ఇలాంటిది జరగలేదు
  rationale: అక్షరార్థంగా ‘ఇలాంటిది కాదు’; సందర్భంలో సూచిత సంఘటనను ‘జరగలేదు’తో సహజంగా పూరిస్తూ పోలిక భావాన్ని కాపాడుతుంది.
