translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే చారిత్రక కథనానికి తగిన గౌరవప్రదమైన శైలి. హెబ్రీలోని ‘యెరూషలేములో’ పునరుక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది.
