source:
  edition: WLC
  text: וַ/יַּֽעַמְד֤וּ עַל עָמְדָ/ם֙ כְּ/מִשְׁפָּטָ֔/ם כְּ/תוֹרַ֖ת מֹשֶׁ֣ה אִישׁ הָ/אֱלֹהִ֑ים הַ/כֹּֽהֲנִים֙ זֹרְקִ֣ים אֶת הַ/דָּ֔ם מִ/יַּ֖ד הַ/לְוִיִּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/016.yaml
  text: They stood in their place according to their custom[a], according to the law of Moses the man of God. The priests were sprinkling the blood received from the hand of the Levites.
translation:
  language: te
  text: 'వారు తమ తమ స్థానాల్లో, తమకు నిర్దేశించిన విధి ప్రకారం, దైవజనుడైన మోషే ధర్మశాస్త్రం ప్రకారం నిలబడ్డారు. లేవీయుల చేతుల నుండి అందుకున్న రక్తాన్ని యాజకులు చల్లుతూ ఉన్నారు.[a]


    [a] అక్షరార్థంగా, “లేవీయుల చేతుల నుండి రక్తాన్ని.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “లేవీయుల చేతుల నుండి రక్తాన్ని.”
    reason: מִיַּד הַלְוִיִּם అనే హీబ్రూ పదబంధంలో “అందుకున్న” అనే క్రియ ప్రత్యక్షంగా లేకపోవడాన్ని చూపే అక్షరార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: וַיַּעַמְדוּ עַל עָמְדָם
  choice: వారు తమ తమ స్థానాల్లో ... నిలబడ్డారు
  rationale: עמד అనే క్రియ యొక్క నిలబడడం అనే భావాన్నీ, עַל עָמְדָם సూచించే నియమిత స్థానాల భావాన్నీ సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: כְּמִשְׁפָּטָם
  choice: తమకు నిర్దేశించిన విధి ప్రకారం
  rationale: ఆలయ ఆచార సందర్భంలో מִשְׁפָּט సాధారణ అలవాటు కంటే నిర్దేశిత క్రమాన్ని లేదా విధిని సూచిస్తుంది; ఈ అనువాదం ఆ నియమబద్ధ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: כְּתוֹרַת מֹשֶׁה
  choice: మోషే ధర్మశాస్త్రం ప్రకారం
  rationale: తోరా ఇక్కడ పస్కా ఆచరణను నియంత్రించే మోషే ధర్మశాస్త్ర బోధను సూచిస్తుంది; “ధర్మశాస్త్రం” తెలుగు బైబిలు వాడుకలో స్థిరమైన, స్పష్టమైన పదం.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దైవజనుడైన
  rationale: “దేవుని మనిషి” అనే స్థిరమైన బైబిలు బిరుదును సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: הַכֹּהֲנִים זֹרְקִים אֶת הַדָּם
  choice: రక్తాన్ని యాజకులు చల్లుతూ ఉన్నారు
  rationale: బలి ఆచార సందర్భంలో זרק రక్తాన్ని ఆచారపూర్వకంగా చల్లడం లేదా విసరడం అనే క్రియను సూచిస్తుంది. “చల్లుతూ” అనేది కేవలం సున్నితంగా ప్రోక్షించడమేనని అతిగా నిర్దిష్టం చేయకుండా ఆ ఆచార చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: מִיַּד הַלְוִיִּם
  choice: లేవీయుల చేతుల నుండి అందుకున్న
  rationale: హీబ్రూ అక్షరార్థం “లేవీయుల చేతుల నుండి.” తెలుగులో సంబంధాన్ని స్పష్టంగా చేయడానికి “అందుకున్న” అని పూరించబడింది; అక్షరార్థ రూపం పాదసూచికలో ఉంచబడింది.
theological_decisions:
- issue: బలి రక్తాన్ని వర్తింపజేసే చర్యకు ఉపయోగించిన పదం
  choice: చల్లుతూ ఉన్నారు
  alternative: ప్రోక్షిస్తూ ఉన్నారు; విసురుతూ ఉన్నారు
  rationale: זרק యొక్క మూలభావం విసరడం/చల్లడం; బలి సందర్భంలో ఇది రక్తాన్ని ఆచారపూర్వకంగా వర్తింపజేయడాన్ని సూచిస్తుంది. “చల్లుతూ” మూల క్రియ విస్తృతిని నిలుపుతూ, “విసురుతూ” వల్ల కలిగే సాధారణ లేదా నిర్లక్ష్య చర్య భావాన్ని నివారిస్తుంది; “ప్రోక్షిస్తూ” కంటే సాధారణ పాఠకులకు సులభంగా ఉంటుంది.
- issue: מִיַּד הַלְוִיִּם లో అంతర్లీనంగా ఉన్న స్వీకరణ భావం
  choice: లేవీయుల చేతుల నుండి అందుకున్న
  alternative: లేవీయుల చేతుల నుండి
  rationale: యాజకులు రక్తాన్ని లేవీయుల నుండి తీసుకొని చల్లుతున్నారనే సంబంధం సందర్భంలో అంతర్లీనంగా ఉంది. “అందుకున్న” దానిని సహజమైన తెలుగులో స్పష్టం చేస్తుంది; అయితే అది హీబ్రూలో ప్రత్యక్ష క్రియ కాదని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. “తమ తమ స్థానాల్లో,” “నిర్దేశించిన విధి,” “దైవజనుడు,” “ధర్మశాస్త్రం” వంటి పదాలు ఆలయ ఆచార సందర్భంలోని గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి.
