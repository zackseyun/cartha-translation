  text: A great many people gathered in Jerusalem to keep the Festival of Unleavened Bread in the second month[b][a], a very great assembly.
translation:
  language: te
  text: రెండవ నెలలో పులియని రొట్టెల పండుగను[b] ఆచరించడానికి[a] ఎంతోమంది ప్రజలు యెరూషలేములో కూడారు; అది ఎంతో పెద్ద సమూహం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘జరుపుకోవడానికి,’ ‘పాటించడానికి’; అక్షరార్థంగా ‘చేయడానికి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పులియని రొట్టెల ఉత్సవం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: కూడారు
  rationale: నిఫాల్ రూపంలోని אסף ఇక్కడ ప్రజలు ఒకచోట సమకూడడాన్ని సూచిస్తుంది. ‘కూడారు’ ఆధునిక తెలుగులో సహజంగా ఉండి సంఘటన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְרוּשָׁלִַם
  choice: యెరూషలేము
  rationale: స్థలనామానికి తెలుగులో స్థిరపడిన బైబిలు లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: עַם רָב
  choice: ఎంతోమంది ప్రజలు
  rationale: అక్షరార్థంగా ‘సంఖ్యలో గొప్ప ప్రజలు.’ ‘ఎంతోమంది ప్రజలు’ సంఖ్యాపరమైన ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לַעֲשׂוֹת
  choice: ఆచరించడానికి
  rationale: అక్షరార్థంగా ‘చేయడానికి’; అయితే పండుగతో కలిసినప్పుడు దానిని విధిగా పాటించడం లేదా జరుపుకోవడం అనే భావం వస్తుంది. ‘ఆచరించడానికి’ ఆ భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: חַג הַמַּצּוֹת
  choice: పులియని రొట్టెల పండుగ
  rationale: חַג ఆరాధనాసంబంధ పండుగను సూచిస్తుంది; מַצּוֹת పులియబెట్టని రొట్టెలను సూచిస్తుంది. ఈ రూపం ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: రెండవ నెలలో
  rationale: కాలసూచన సందర్భంలోని ఆలస్యంగా జరిగిన పస్కా ఆచరణకు ముఖ్యమైనది కాబట్టి నేరుగా నిలుపబడింది.
- source_word: קָהָל
  choice: సమూహం
  rationale: కూడివచ్చిన ప్రజాసముదాయాన్ని సూచించే קָהָלకు ‘సమూహం’ సహజమైన, మతసంస్థ భావాన్ని అనవసరంగా మోపని తెలుగు పదం.
- source_word: לָרֹב מְאֹד
  choice: అతి పెద్ద
  rationale: సమూహం అత్యధిక సంఖ్యలో ఉందనే బలమైన ఉద్ఘాటనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
