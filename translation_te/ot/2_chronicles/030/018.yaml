source:
  edition: WLC
  text: כִּ֣י מַרְבִּ֣ית הָ/עָ֡ם רַ֠בַּת מֵֽ/אֶפְרַ֨יִם וּ/מְנַשֶּׁ֜ה יִשָּׂשכָ֤ר וּ/זְבֻלוּן֙ לֹ֣א הִטֶּהָ֔רוּ כִּֽי אָכְל֥וּ אֶת הַ/פֶּ֖סַח בְּ/לֹ֣א כַ/כָּת֑וּב כִּי֩ הִתְפַּלֵּ֨ל יְחִזְקִיָּ֤הוּ עֲלֵי/הֶם֙ לֵ/אמֹ֔ר יְהוָ֥ה הַ/טּ֖וֹב יְכַפֵּ֥ר בְּעַֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/018.yaml
  text: For a great many of the people[a], many from Ephraim and Manasseh, Issachar and Zebulun, had not purified themselves, yet they ate the Passover otherwise than as it is written. But Hezekiah prayed for them, saying, “May Yahweh, who is good[b], make atonement for them—”
translation:
  language: te
  text: 'ఎందుకంటే ప్రజలలో పెద్ద సంఖ్యలోని వారు, అంటే ఎఫ్రాయిము, మనష్షే, ఇశ్శాఖారు, జెబూలూను గోత్రాల నుండి వచ్చిన అనేకులు, తమను శుద్ధి చేసుకోకుండానే వ్రాయబడి ఉన్న ప్రకారం కాకుండా పస్కాను భుజించారు.[a] అయితే హిజ్కియా వారి కోసం ఇలా ప్రార్థించాడు: “మంచివాడైన యాహ్వే ప్రాయశ్చిత్తం చేయుగాక—”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, లిఖిత నియమానికి అనుగుణంగా కాకుండా.
    reason: lexical_clarification
  - marker: b
    text: ఈ ప్రార్థన 19వ వచనంలో కొనసాగుతుంది; హీబ్రూ వాక్యం ఈ వచనం చివర పూర్తికాదు.
    reason: cross_reference
lexical_decisions:
- source_word: מַרְבִּית הָעָם רַבַּת
  choice: ప్రజల్లో చాలామంది—… అనేకులు
  rationale: మొదటి పదబంధంలోని పెద్ద సంఖ్యను, తరువాతి రַבַּת ఇచ్చే ఉద్ఘాటనను సహజమైన తెలుగులో పునరుక్తి సహా నిలుపుతుంది; ‘అధికశాతం’ అని ఖచ్చితమైన మెజారిటీని సూచించదు.
- source_word: מֵאֶפְרַיִם וּמְנַשֶּׁה יִשָּׂשכָר וּזְבֻלוּן
  choice: ఎఫ్రాయిము, మనష్షే, ఇశ్శాఖారు, జెబూలూను గోత్రాలకు చెందిన
  rationale: ఇవి గోత్రనామాలని సాధారణ పాఠకుడికి స్పష్టంచేస్తూ, మూలంలోని జాబితాను కాపాడుతుంది.
- source_word: לֹא הִטֶּהָרוּ
  choice: తమను తాము శుద్ధి చేసుకోకుండానే
  rationale: హిత్పయేల్ రూపంలోని ఆత్మార్థక భావాన్ని, సందర్భంలోని ఆచారపరమైన శుద్ధిని నిలుపుతుంది.
- source_word: אָכְלוּ אֶת הַפֶּסַח
  choice: పస్కాను భుజించారు
  rationale: ‘పస్కా గొర్రెపిల్ల’ అని మూలంలో లేని పదాన్ని చేర్చకుండా, పస్కా భోజనం/బలి ఆచరణ అనే విస్తృత భావాన్ని ఉంచుతుంది.
- source_word: בְּלֹא כַכָּתוּב
  choice: వ్రాయబడి ఉన్న ప్రకారం కాకుండా
  rationale: లిఖిత నియమానికి అనుగుణంగా జరగలేదనే భావాన్ని సూటిగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הִתְפַּלֵּל ... עֲלֵיהֶם
  choice: వారి కోసం … ప్రార్థించాడు
  rationale: ఇతరుల పక్షంగా చేసిన ప్రార్థనను అతి వ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
- source_word: יְהוָה הַטּוֹב
  choice: మంచివాడైన యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరిస్తుంది; הַטּוֹב అనే విశేషణాన్ని సహజమైన తెలుగు సంబంధ విశేషణంగా అందిస్తుంది.
- source_word: יְכַפֵּר
  choice: ప్రాయశ్చిత్తం చేయుగాక
  rationale: పస్కా, శుద్ధి సందర్భంలోని ఆచారపరమైన పరిహార భావాన్ని ‘క్షమించుగాక’ అని కుదించకుండా నిలుపుతుంది.
- source_word: בְּעַד
  choice: తదుపరి వచనంతో కొనసాగుతున్న అసంపూర్ణ ప్రార్థన ద్వారా సూచించబడింది
  rationale: ఈ విభక్తిపూర్వక పదానికి సంబంధించిన అంశం 19వ వచనంలో వస్తుంది. అందువల్ల ఈ వచనంలో ‘వారి పక్షంగా’ అని ముందుగానే నింపకుండా డాష్‌తో వాక్యాన్ని తెరిచి ఉంచింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: హీబ్రూ పాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, ఆధునిక తెలుగులో సమీప లిప్యంతరీకరణగా ఉంచింది.
- issue: כפר అనే ఆచారపరమైన పదం
  choice: ప్రాయశ్చిత్తం చేయుగాక
  alternative: క్షమించుగాక
  rationale: క్షమాపణ భావం సందర్భంలో ఉండవచ్చునప్పటికీ, మూలంలోని ప్రాయశ్చిత్త/పరిహార సంబంధమైన ధార్మిక ఉద్వేగాన్ని మరింత ప్రత్యక్షంగా కాపాడుతుంది.
- issue: 18వ వచనం చివర ప్రార్థన అసంపూర్ణంగా ఉండడం
  choice: డాష్‌తో వాక్యాన్ని తెరిచి ఉంచడం
  alternative: ‘వారి కోసం’ అని వాక్యాన్ని పూర్తిచేయడం
  rationale: బְּעַד‌కు సంబంధించిన కొనసాగింపు 19వ వచనంలో వస్తుంది. మూలంలోని వాక్య నిర్మాణాన్ని, అర్థసంభావ్యతను ముందుగానే పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకుడికి అర్థమయ్యే శైలి. ఆచారపరమైన పదజాలాన్ని అవసరమైన చోట నిలుపుతూ, గోత్రాల గుర్తింపును స్పష్టంచేయడానికి ‘గోత్రాలకు చెందిన’ అని చేర్చబడింది. మూలంలోని అసంపూర్ణ వాక్య నిర్మాణాన్ని డాష్‌తో కాపాడింది.
