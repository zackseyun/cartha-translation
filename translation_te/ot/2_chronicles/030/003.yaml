revisions:
- from: ఎందుకంటే ఆ సమయంలో వారు దాన్ని ఆచరించలేకపోయారు; యాజకులు తగినంతగా తమను తాము ప్రతిష్ఠించుకోలేదు[a], ప్రజలు కూడా యెరూషలేముకు సమకూడలేదు.
  to: ఎందుకంటే ఆ సమయంలో వారు దాన్ని ఆచరించలేకపోయారు; యాజకులు తగినంతగా తమను తాము పవిత్రపరచుకోలేదు[a], ప్రజలు కూడా యెరూషలేముకు సమకూడలేదు.
  rationale: The revision replaces a potentially misleading term with the standard, clear Telugu expression for ritual self-sanctification. It preserves the source’s compact ambiguity concerning whether the deficiency was in the degree of consecration or the number of consecrated priests, while retaining the source-oriented directional wording “యెరూషలేముకు.”
