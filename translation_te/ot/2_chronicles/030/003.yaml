source:
  edition: WLC
  text: כִּ֣י לֹ֧א יָכְל֛וּ לַ/עֲשֹׂת֖/וֹ בָּ/עֵ֣ת הַ/הִ֑יא כִּ֤י הַ/כֹּהֲנִים֙ לֹֽא הִתְקַדְּשׁ֣וּ לְ/מַ דַּ֔י וְ/הָ/עָ֖ם לֹא נֶאֶסְפ֥וּ לִֽ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/003.yaml
  text: For they could not do it at that time[a], because the priests had not consecrated themselves sufficiently[b], and the people had not gathered to Jerusalem.
translation:
  language: te
  text: ఎందుకంటే ఆ సమయంలో వారు దాన్ని ఆచరించలేకపోయారు; యాజకులు తగినంతగా తమను తాము పవిత్రపరచుకోలేదు[a], ప్రజలు కూడా యెరూషలేముకు సమకూడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తగినంతమంది యాజకులు తమను తాము పవిత్రపరచుకోలేదు.” హీబ్రూ పదబంధం సంక్షిప్తంగా ఉంది; అది పవిత్రపరచుకోవడం తగిన స్థాయిలో లేకపోవడాన్నిగానీ, తమను తాము పవిత్రపరచుకున్న యాజకుల సంఖ్య తగినంత లేకపోవడాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: ఆచరించలేకపోయారు
  rationale: ఈ క్రియ సామర్థ్యాన్ని సూచిస్తుంది. సందర్భంలో పస్కాను ఆచరించలేకపోవడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לַעֲשֹׂתוֹ
  choice: దాన్ని ఆచరించలేకపోయారు
  rationale: సర్వనామ ప్రత్యయం ముందున్న పస్కా ఆచరణను సూచిస్తుంది. కేవలం ‘చేయలేకపోయారు’ కంటే ‘ఆచరించలేకపోయారు’ సందర్భాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: בָּעֵת הַהִיא
  choice: ఆ సమయంలో
  rationale: పస్కా జరపవలసిన నిర్దిష్ట సమయాన్ని సూచించే సరళమైన, మూలానికి సమీపమైన ప్రయోగం.
- source_word: הִתְקַדְּשׁוּ
  choice: తమను తాము ప్రతిష్ఠించుకోలేదు
  rationale: యాజక సంబంధమైన సందర్భంలో ఆచారపరమైన పవిత్ర సిద్ధపాటును సూచిస్తుంది. ‘ప్రతిష్ఠించుకోవడం’ ఈ భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: לְמַדַּי
  choice: తగినంతగా
  rationale: మూలంలోని సంక్షిప్త క్రియావిశేషణ భావాన్ని నిలుపుతుంది; ఇది ప్రతిష్ఠ యొక్క తగిన స్థాయిని గానీ, ప్రతిష్ఠించుకున్న యాజకుల తగిన సంఖ్యను గానీ సూచించే అవకాశం ఉంది.
- source_word: נֶאֶסְפוּ
  choice: సమకూడలేదు
  rationale: నిఫల్ రూపం ఇక్కడ ప్రజలు ఒకచోట సమావేశం కావడాన్ని సూచిస్తుంది. ‘సమకూడలేదు’ సహజమైన తెలుగు.
- source_word: לִירוּשָׁלִָם
  choice: యెరూషలేముకు
  rationale: దిశను సూచించే לְ ఉపసర్గను నేరుగా నిలుపుతూ, ప్రజలు యెరూషలేముకు వచ్చి సమకూడే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: לְמַדַּי పదబంధంలోని అస్పష్టత
  choice: యాజకులు తగినంతగా తమను తాము ప్రతిష్ఠించుకోలేదు
  alternative: తగినంతమంది యాజకులు తమను తాము ప్రతిష్ఠించుకోలేదు
  rationale: హీబ్రూ పదబంధం ప్రతిష్ఠ యొక్క తగిన స్థాయిని లేదా ప్రతిష్ఠించుకున్న యాజకుల తగిన సంఖ్యను సూచించవచ్చు. ప్రధాన పాఠ్యంలో మూల నిర్మాణానికి దగ్గరైన క్రియావిశేషణ రూపాన్ని ఉంచి, సంఖ్యాపరమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఆచరించలేకపోయారు’ సందర్భంలోని పస్కాను స్పష్టం చేస్తుంది; ‘ప్రతిష్ఠించుకోలేదు’ యాజకుల ఆచారపరమైన సిద్ధపాటును సూచిస్తుంది. మూలంలోని לְמַדַּי అస్పష్టతను పాదటిప్పణిలో సంరక్షించాం.
