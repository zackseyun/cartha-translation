source:
  edition: WLC
  text: וְ/אַל תִּֽהְי֗וּ כַּ/אֲבֽוֹתֵי/כֶם֙ וְ/כַ֣/אֲחֵי/כֶ֔ם אֲשֶׁ֣ר מָעֲל֔וּ בַּ/יהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם וַ/יִּתְּנֵ֣/ם לְ/שַׁמָּ֔ה כַּ/אֲשֶׁ֖ר אַתֶּ֥ם רֹאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/007.yaml
  text: Do not be like your fathers and like your brothers[a], who were unfaithful to Yahweh, the God of their fathers, and he made them a desolation, as you see.
translation:
  language: te
  text: మీ పితరులవలె, మీ సహోదరులవలె ఉండకండి. వారు తమ పితరుల దేవుడైన యాహ్వేకు నమ్మకద్రోహం చేశారు; మీరు చూస్తున్నట్లుగానే ఆయన వారిని శిథిలావస్థకు గురిచేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘భయానక దృశ్యంగా’ లేదా ‘విస్మయానికి కారణంగా.’ హీబ్రూ పదం వినాశాన్ని, దానిని చూసేవారిలో కలిగే దిగ్భ్రాంతిని—రెండింటినీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל תִּהְיוּ
  choice: ఉండకండి
  rationale: אַל తో కూడిన అసంపూర్ణ క్రియ నిషేధాన్ని సూచిస్తుంది. తరువాత వచ్చే పోలికకు తెలుగులో ‘ఉండకండి’ సహజంగా సరిపోతుంది.
- source_word: כַאֲבוֹתֵיכֶם
  choice: మీ పితరులవలె
  rationale: אָבוֹת ఇక్కడ గత తరాల పితరులను సూచిస్తుంది; ‘పితరులు’ చారిత్రక, ఒడంబడిక సంబంధ భావాన్ని నిలుపుతుంది.
- source_word: וְכַאֲחֵיכֶם
  choice: మీ సహోదరులవలె
  rationale: אָח సొంత సోదరులను లేదా విస్తృత బంధుత్వ సమూహాన్ని సూచించగలదు. ‘సహోదరులు’ ఉత్తర గోత్రాలతో ఉన్న కుటుంబ, ఒడంబడిక ఐక్యతను నిలుపుతుంది.
- source_word: מָעֲלוּ
  choice: నమ్మకద్రోహం చేశారు
  rationale: מעל దేవునితో ఉన్న ఒడంబడిక విశ్వాసాన్ని ఉల్లంఘించడాన్ని సూచిస్తుంది. ‘నమ్మకద్రోహం చేశారు’ ఆ తీవ్రతను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַּיהוָה
  choice: యాహ్వేకు
  rationale: מעל తో వచ్చిన בְ సంబంధాన్ని తెలుగులో ‘యాహ్వేకు నమ్మకద్రోహం’ అని సహజంగా వ్యక్తం చేయవచ్చు.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: తమ పితరుల దేవుడు
  rationale: మూలంలోని ఒడంబడిక సూత్రవాక్యాన్ని, ముందున్న ‘పితరులు’ అనే పదంతో సంబంధాన్ని నిలుపుతుంది.
- source_word: וַיִּתְּנֵם לְשַׁמָּה
  choice: ఆయన వారిని శిథిలావస్థకు గురిచేశాడు
  rationale: נתן తో לְשַׁמָּה కలిసిన నిర్మాణం వారిని వినాశకర స్థితిలో ఉంచిన ఫలితాన్ని సూచిస్తుంది. ‘శిథిలావస్థ’ ప్రధాన వినాశ భావాన్ని అందిస్తుండగా, పదంలోని భయానక దృశ్యార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: כַאֲשֶׁר אַתֶּם רֹאִים
  choice: మీరు చూస్తున్నట్లుగానే
  rationale: వర్తమానంలో వారికి ప్రత్యక్షంగా కనిపిస్తున్న చారిత్రక పరిణామాన్ని ఈ రూపం సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. ‘యాహ్వే’ దానిని బిరుదుతో భర్తీ చేయకుండా, సీనాయి ఒడంబడిక నామంగా ప్రతిబింబిస్తుంది.
- issue: పితరుల అవిశ్వాసానికి దేవుని చర్యకు ఉన్న సంబంధం
  choice: రెండు వాక్యాలను క్రమబద్ధంగా కలిపి, దేవుడే వారిని శిథిలావస్థకు గురిచేశాడని పేర్కొనడం
  alternative: దీనిని కేవలం సహజ పరిణామంగా లేదా ఉద్దేశార్థకంగా వివరించడం
  rationale: וַ వరుసగా జరిగిన దేవుని చర్యను తెలియజేస్తుంది; మూలంలో లేని ఉద్దేశార్థాన్ని చేర్చకుండా, ఏకవచన కర్త దేవుణ్ణే సూచించేలా అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘పితరులు,’ ‘సహోదరులు,’ ‘నమ్మకద్రోహం’ వంటి పదాలు మూలంలోని కుటుంబ, ఒడంబడిక సంబంధ వాక్చాతుర్యాన్ని నిలుపుతాయి. పాదసూచిక గుర్తును అది వివరిస్తున్న שַׁמָּה పదానికి సంబంధించిన వాక్యభాగం తరువాత ఉంచాం.
