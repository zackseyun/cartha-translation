id: 2CH.30.9
reference: 2 Chronicles 30:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י בְ/שׁוּבְ/כֶ֞ם עַל יְהוָ֗ה אֲחֵי/כֶ֨ם וּ/בְנֵי/כֶ֤ם לְ/רַחֲמִים֙ לִ/פְנֵ֣י שֽׁוֹבֵי/הֶ֔ם וְ/לָ/שׁ֖וּב לָ/אָ֣רֶץ הַ/זֹּ֑את כִּֽי חַנּ֤וּן וְ/רַחוּם֙ יְהוָ֣ה אֱלֹהֵי/כֶ֔ם וְ/לֹא יָסִ֤יר פָּנִים֙ מִ/כֶּ֔ם אִם תָּשׁ֖וּבוּ אֵלָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/009.yaml
  text: For when you return to Yahweh[a], your brothers and your sons will find compassion before their captors and return to this land. For Yahweh your God is gracious and compassionate[c][b], and he will not turn his face away from you if you return to him.
translation:
  language: te
  text: మీరు యాహ్వే వద్దకు తిరిగివస్తే, మీ సోదరులు, మీ కుమారులు తమను చెరపట్టినవారి దృష్టిలో కనికరం పొందుతారు, ఈ దేశానికి తిరిగి వస్తారు. ఎందుకంటే మీ దేవుడైన యాహ్వే కృపగలవాడు, కనికరముగలవాడు; మీరు ఆయనవద్దకు తిరిగివస్తే, ఆయన తన ముఖాన్ని మీ నుండి తిప్పుకోడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּשׁוּבְכֶם עַל יְהוָה
  choice: మీరు యాహ్వే వైపు తిరిగివస్తే
  rationale: שׁוּב అనే ధాతువు ఇక్కడ దేవునితో నిబంధన సంబంధానికి తిరిగి రావడాన్ని సూచిస్తుంది. ‘తిరిగివస్తే’ అనేది పశ్చాత్తాపం, పునరుద్ధరణ అనే రెండు భావాలను సహజమైన తెలుగులో నిలుపుతుంది; עַל యొక్క దిశాభావాన్ని ‘వైపు’ తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: אֲחֵיכֶם וּבְנֵיכֶם
  choice: మీ సహోదరులు, మీ కుమారులు
  rationale: మూలంలోని పుంలింగ బంధుత్వ పదాలను ‘సహోదరులు’, ‘కుమారులు’ అని యథార్థంగా ఉంచాం; విస్తృతార్థాన్ని ఊహించి ‘పిల్లలు’ అని మార్చలేదు.
- source_word: לְרַחֲמִים לִפְנֵי שׁוֹבֵיהֶם
  choice: తమను చెరపట్టినవారి దృష్టిలో కనికరం పొంది
  rationale: ఈ నిర్మాణం చెరపట్టినవారి సమక్షంలో లేదా దృష్టిలో కనికరానికి పాత్రులు కావడాన్ని సూచిస్తుంది. తెలుగు సహజత్వం కోసం ‘కనికరం పొంది’ అని, לִפְנֵי భావాన్ని ‘దృష్టిలో’ అని అందించాం.
- source_word: שׁוֹבֵיהֶם
  choice: తమను చెరపట్టినవారు
  rationale: שבה ధాతువు నుండి వచ్చిన ఈ కర్తృవాచక రూపం వారిని బందీలుగా తీసుకెళ్లినవారినే సూచిస్తుంది.
- source_word: וְלָשׁוּב לָאָרֶץ הַזֹּאת
  choice: ఈ దేశానికి తిరిగివస్తారు
  rationale: కనికరం ఫలితంగా వారు తిరిగి రావడాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది; వారిని ఎవరు తిరిగి తీసుకువస్తారో అనవసరంగా చేర్చలేదు.
- source_word: חַנּוּן וְרַחוּם
  choice: కృపగలవాడు, కనికరంగలవాడు
  rationale: మొదటి విశేషణం అనుగ్రహ స్వభావాన్ని, రెండవది లోతైన దయను సూచించేలా రెండు వేర్వేరు తెలుగు పదాలతో భావభేదాన్ని నిలిపాం.
- source_word: לֹא יָסִיר פָּנִים מִכֶּם
  choice: తన ముఖాన్ని మీ నుండి తిప్పుకోడు
  rationale: దేవుడు తన అనుగ్రహ సన్నిధిని ఉపసంహరించుకోడనే భావాన్ని తెలిపే హీబ్రూ ముఖరూపకాన్ని తెలుగులో కూడా నిలిపాం.
- source_word: אִם תָּשׁוּבוּ אֵלָיו
  choice: మీరు ఆయన వైపు తిరిగివస్తే
  rationale: వాక్యం ఆరంభంలోని שׁוּב ధాతువు పునరావృతిని ‘తిరిగివస్తే’ అని అలాగే ఉంచి, వాక్యంలోని పిలుపు మరియు వాగ్దానం మధ్య సంబంధాన్ని కాపాడాం.
theological_decisions:
- issue: שׁוּב లోని పశ్చాత్తాపం మరియు నిబంధనకు పునరాగమన భావం
  choice: తిరిగివస్తే
  alternative: తిరిగితే
  rationale: ‘తిరిగివస్తే’ దేవునితో ముందున్న సంబంధానికి మళ్లీ రావడాన్ని బలంగా తెలియజేస్తుంది; తరువాతి సిద్ధాంతపరమైన పదజాలాన్ని మూలంలోకి చేర్చదు.
- issue: లింగసూచక కుటుంబ పదాలు
  choice: మీ సహోదరులు, మీ కుమారులు
  alternative: మీ సహోదరులు, మీ పిల్లలు
  rationale: మూలపాఠం ప్రత్యేకంగా పుంలింగ పదాలను వాడుతుంది. అందువల్ల ప్రధాన పాఠంలో వాటిని తటస్థీకరించకుండా నిలిపాం.
- issue: దేవుని ముఖాన్ని తిప్పుకోవడం అనే రూపకం
  choice: ఆయన తన ముఖాన్ని మీ నుండి తిప్పుకోడు
  alternative: ఆయన మిమ్మల్ని విడిచిపెట్టడు
  rationale: ‘విడిచిపెట్టడు’ సాధారణ భావాన్ని మాత్రమే ఇస్తుంది. మూలంలోని ముఖరూపకం దేవుని సన్నిధి, అనుగ్రహం, సంబంధాన్ని కలిపి సూచిస్తున్నందున దానిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘యాహ్వే’, ‘కృపగలవాడు’, ‘కనికరంగలవాడు’ వంటి పదాలు గంభీరతను నిలుపుతాయి; వాక్య నిర్మాణం మాత్రం సాధారణ పాఠకునికి సహజంగా ఉండేలా చేశాం.
