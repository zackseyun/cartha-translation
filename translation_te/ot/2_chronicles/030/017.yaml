source:
  edition: WLC
  text: כִּי רַבַּ֥ת בַּ/קָּהָ֖ל אֲשֶׁ֣ר לֹא הִתְקַדָּ֑שׁוּ וְ/הַ/לְוִיִּ֞ם עַל שְׁחִיטַ֣ת הַ/פְּסָחִ֗ים לְ/כֹל֙ לֹ֣א טָה֔וֹר לְ/הַקְדִּ֖ישׁ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/017.yaml
  text: For many in the assembly had not sanctified themselves[a], and the Levites were over the slaughter of the Passover lambs for everyone who was not clean[c][b], to consecrate them to Yahweh.
translation:
  language: te
  text: సమాజంలో అనేకులు తమను తాము పవిత్రపరచుకోలేదు. కాబట్టి ఆచారపరంగా శుద్ధి లేని ప్రతి ఒక్కరి కోసం పస్కా బలి పశువులను[b] వధించే బాధ్యతను లేవీయులు చేపట్టారు, యాహ్వేకు ప్రతిష్ఠించడానికి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: అక్షరార్థంగా ‘పస్కాలు’; అంటే పస్కా బలిగా అర్పించే పశువులు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో ‘ప్రతిష్ఠించడానికి’ అనే క్రియకు కర్మ స్పష్టంగా లేదు. అది పస్కా బలి పశువులను సూచించవచ్చు; శుద్ధిగా లేని ప్రజలను సూచిస్తుందని కూడా అర్థం చేసుకోవచ్చు.
    reason: textual_ambiguity
lexical_decisions:
- source_word: רַבַּת בַּקָּהָל
  choice: సమాజంలో అనేకులు
  rationale: గుమికూడిన ఆరాధక సమాజంలోని పెద్ద సంఖ్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הִתְקַדָּשׁוּ
  choice: తమను తాము పవిత్రపరచుకోలేదు
  rationale: ఆరాధనకు సిద్ధపడే ప్రతిష్ఠీకరణ భావాన్ని నిలుపుతుంది; సందర్భంలో ఆచార శుద్ధి ఉన్నప్పటికీ దానికే అర్థాన్ని పరిమితం చేయదు.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: ఆ గోత్ర, ఆరాధనా సేవక వర్గానికి తెలుగులో స్థిరంగా వాడే పేరు.
- source_word: עַל שְׁחִיטַת
  choice: వధించే బాధ్యతను ... చేపట్టారు
  rationale: עַל ఇక్కడ పర్యవేక్షణ లేదా బాధ్యతను సూచిస్తుంది; తెలుగులో సహజంగా క్రియాత్మకంగా వ్యక్తపరచబడింది.
- source_word: הַפְּסָחִים
  choice: పస్కా బలి పశువులను
  rationale: అక్షరార్థంగా ‘పస్కాలు’ అనే బహువచనం పస్కా బలిగా అర్పించే పశువులను సూచిస్తుంది. ‘గొర్రెపిల్లలు’ అని మాత్రమే చెప్పకుండా మూలంలోని విస్తృత సూచనను కాపాడుతుంది.
- source_word: לְכֹל לֹא טָהוֹר
  choice: శుద్ధిగా లేని ప్రతి ఒక్కరి కోసం
  rationale: ఆచార సంబంధమైన శుద్ధిని సూచించే טָהוֹר భావాన్ని సరళంగా ఉంచుతుంది.
- source_word: לְהַקְדִּישׁ לַיהוָה
  choice: వాటిని యాహ్వేకు ప్రతిష్ఠించడానికి
  rationale: קדשׁ యొక్క ఆరాధనా ప్రతిష్ఠీకరణ భావాన్ని నిలుపుతుంది. ‘వాటిని’ సమీపంలోని పస్కా బలి పశువులను సూచించేలా పాఠ్యంలో సరఫరా చేయబడింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించింది.
theological_decisions:
- issue: పస్కా సందర్భంలో קדשׁ అనే పవిత్రత/ప్రతిష్ఠీకరణ భాష
  choice: ‘పవిత్రపరచుకోలేదు’, ‘ప్రతిష్ఠించడానికి’ అనే భాషను ఉపయోగించడం
  alternative: రెండు సందర్భాలనూ కేవలం ‘ఆచారపరంగా శుద్ధి చేసుకోవడం’గా అనువదించడం
  rationale: వచనం ఆచార అర్హతను గురించి మాట్లాడుతున్నప్పటికీ, קדשׁ పవిత్రత మరియు దేవునికి ప్రత్యేకపరచడం అనే విస్తృత భావాన్ని కలిగి ఉంది.
- issue: לְהַקְדִּישׁ వద్ద స్పష్టంగా చెప్పని కర్మ
  choice: ‘వాటిని’ పస్కా బలి పశువులను సూచిస్తుందని ప్రధాన పాఠ్యంలో గ్రహించడం
  alternative: అది శుద్ధిగా లేని ప్రజలను సూచిస్తుందని గ్రహించడం లేదా కర్మను పూర్తిగా అనిర్దిష్టంగా ఉంచడం
  rationale: సమీప వ్యాకరణ సంబంధం పస్కా బలి పశువులతో ఉంది; అయినా హీబ్రూలో కర్మ వ్యక్తంగా లేకపోవడం వల్ల ప్రత్యామ్నాయాన్ని పాదటీపులో నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆరాధనా శైలి వాడబడింది. ‘పస్కా బలి పశువులు’ అనే పదబంధం మూలంలోని బహువచనాన్ని, బలిపశువుల విస్తృత సూచనను కాపాడుతుంది. ప్రధాన పాఠ్యంలో కారణ సంబంధాన్ని తెలుగులో స్పష్టంగా చూపడానికి ‘కాబట్టి’ వాడబడింది.
