  to: సమాజంలో అనేకులు తమను తాము పవిత్రపరచుకోలేదు. కాబట్టి ఆచారపరంగా శుద్ధి లేని ప్రతి ఒక్కరి కోసం పస్కా బలి పశువులను[b] వధించే బాధ్యతను లేవీయులు చేపట్టారు, యాహ్వేకు ప్రతిష్ఠించడానికి[c].
