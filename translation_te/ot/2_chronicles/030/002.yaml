revisions:
- from: అప్పుడు రాజు, అతని అధికారులు, యెరూషలేములో ఉన్న సమాజమంతా కలిసి సంప్రదించి, రెండో నెలలో పస్కాను ఆచరించాలని[a] నిర్ణయించారు.
  to: అప్పుడు రాజు, అతని అధికారులు, యెరూషలేములోని సమాజమంతా సమాలోచించి, రెండో నెలలో పస్కాను ఆచరించాలని[a] నిర్ణయించారు.
