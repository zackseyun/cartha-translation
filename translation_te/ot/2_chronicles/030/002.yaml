source:
  edition: WLC
  text: וַ/יִּוָּעַ֨ץ הַ/מֶּ֧לֶךְ וְ/שָׂרָ֛י/ו וְ/כָל הַ/קָּהָ֖ל בִּ/ירוּשָׁלִָ֑ם לַ/עֲשׂ֥וֹת הַ/פֶּ֖סַח בַּ/חֹ֥דֶשׁ הַ/שֵּׁנִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/002.yaml
  text: Then the king and his officials and all the assembly in Jerusalem decided to keep the Passover in the second month[a].
translation:
  language: te
  text: అప్పుడు రాజు, అతని అధికారులు, యెరూషలేములోని సమాజమంతా సమాలోచించి, రెండో నెలలో పస్కాను ఆచరించాలని[a] నిర్ణయించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పస్కాను చేయాలని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: కలిసి సంప్రదించి… నిర్ణయించారు
  rationale: יעץ నిఫాల్ రూపం ఇక్కడ ఉమ్మడి సంప్రదింపుతో తీసుకున్న నిర్ణయాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో ‘కలిసి సంప్రదించి… నిర్ణయించారు’ అనడం ఆ ప్రక్రియను, దాని ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: నిర్దిష్ట నామవాచకానికి నేరమైన అనువాదం. సందర్భంలో హిజ్కియా ఉద్దేశించబడినా, మూలపాఠం వ్యక్తిపేరుకు బదులు బిరుదునే ఉపయోగిస్తుంది.
- source_word: וְשָׂרָיו
  choice: అతని అధికారులు
  rationale: שׂרים పాలనా బాధ్యతలున్న ఉన్నతాధికారులను సూచిస్తుంది. ‘అధికారులు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, రాజకుమారులనే అపార్థం కలిగించదు.
- source_word: וְכָל הַקָּהָל
  choice: సమాజమంతా
  rationale: קהל సమావేశమైన సముదాయాన్ని సూచిస్తుంది. ‘సమాజమంతా’ దాని సామూహిక భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో ఉన్న
  rationale: స్థలార్థాన్ని తెలుగులో సహజమైన సంబంధవాచక నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: לַעֲשׂוֹת הַפֶּסַח
  choice: పస్కాను ఆచరించాలని
  rationale: అక్షరార్థంగా ‘పస్కాను చేయడం’ అనే హీబ్రూ ప్రయోగం పస్కా ఆచరణను నిర్వహించడాన్ని సూచిస్తుంది. ‘ఆచరించడం’ భావాన్ని స్పష్టంగా, అతివ్యాఖ్యానం లేకుండా అందిస్తుంది.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: రెండో నెలలో
  rationale: కాలాన్ని సూచించే పదబంధానికి నేరమైన, సహజమైన తెలుగు అనువాదం.
theological_decisions:
- issue: పస్కా ఆచరణను తెలిపే హీబ్రూ నుడికారాన్ని అదనపు వ్యాఖ్యానం లేకుండా అనువదించడం
  choice: పస్కాను ఆచరించాలని
  alternative: పస్కాను చేయాలని; పస్కా పండుగను జరుపుకోవాలని
  rationale: మూలంలోని ప్రయోగం పస్కా విధిని నిర్వహించడాన్ని సూచిస్తుంది. ‘ఆచరించాలని’ అనేది నుడికార భావాన్ని సహజంగా అందిస్తూనే, కేవలం ఉత్సవ భావాన్ని మాత్రమే ముందుకు తేవదు; అక్షరార్థ రూపాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘పస్కా’ అనే స్థిరమైన బైబిలు పదాన్ని నిలిపి, పాలనా పదమైన שׂריםను అపార్థం రాకుండా ‘అధికారులు’గా అనువదించాం.
