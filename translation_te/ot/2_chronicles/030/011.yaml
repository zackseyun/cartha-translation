  yaml_path: translation/ot/2_chronicles/030/011.yaml
  text: Nevertheless, some men from Asher, Manasseh, and Zebulun humbled themselves and came to Jerusalem.
translation:
  language: te
  text: అయినప్పటికీ, ఆశేరు, మనష్షే, జెబూలూను గోత్రాలవారిలో కొందరు పురుషులు వినయపడి యెరూషలేముకు వచ్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: అయితే
  rationale: మునుపటి వచనంలో అనేకులు ఆహ్వానాన్ని తిరస్కరించిన దానికి విరుద్ధంగా, ఇక్కడ కొందరు స్పందించిన సంగతిని సహజమైన వ్యతిరేక సంధానంతో తెలియజేస్తుంది.
- source_word: אֲנָשִׁים
  choice: కొందరు పురుషులు
  rationale: పుంలింగ బహువచన రూపాన్నీ, పేర్కొన్న గోత్రాలవారిలోని ఒక అనిర్దిష్ట ఉపసమూహాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: מֵאָשֵׁר וּמְנַשֶּׁה וּמִזְּבֻלוּן
  choice: ఆషేరు, మనష్షే, జెబూలూను ప్రాంతాల నుండి
  rationale: మూలంలోని విభక్త్యర్థం ఆ గోత్రాలకు చెందిన ప్రాంతాల నుంచి వచ్చిన మూలస్థానాన్ని సూచిస్తుంది; ఆధునిక పాఠకునికి పేర్లు వ్యక్తులుగా కాక గోత్రప్రాంతాలుగా అర్థమయ్యేలా ‘ప్రాంతాల’ను స్పష్టీకరించాం.
- source_word: נִכְנְעוּ
  choice: తమను తాము తగ్గించుకొని
  rationale: כנע నిఫాల్ రూపంలోని స్వచ్ఛందంగా వినయపడే లేదా అణకువ చూపే భావాన్ని, తరువాతి రాకతో అనుసంధానించి సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיָּבֹאוּ
  choice: వచ్చారు
  rationale: కథన క్రమంలో యెరూషలేమును గమ్యస్థానంగా తీసుకొని జరిగిన రాకను సరళంగా తెలుపుతుంది.
- source_word: לִירוּשָׁלִָם
  choice: యెరూషలేముకు
  rationale: దిశను సూచించే לְ ఉపసర్గను తెలుగు దత్తివిభక్తి ‘కు’తో సహజంగా వ్యక్తపరుస్తుంది.
