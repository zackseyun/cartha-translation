translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరమైన గ్రంథశైలిని నిలుపుతూ అనువదించబడింది. మూలంలోని వ్యతిరేకత, పురుషులను సూచించే రూపం, స్వచ్ఛంద అణకువ భావం కాపాడబడ్డాయి.
