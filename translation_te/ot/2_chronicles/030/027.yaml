    issue: The main-text verb ‘ఆలకించబడింది’ is slightly marked and the accompanying footnote presents the more natural rendering as only an alternative.
    rationale: The Niphal of שמע here can be represented naturally by Telugu ‘వినబడింది.’ This preserves the passive syntax and does not make God an explicit grammatical subject.
