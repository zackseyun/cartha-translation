  text: וַ/יָּקֻ֜מוּ הַ/כֹּהֲנִ֤ים הַ/לְוִיִּם֙ וַ/יְבָרֲכ֣וּ אֶת הָ/עָ֔ם וַ/יִּשָּׁמַ֖ע בְּ/קוֹלָ֑/ם וַ/תָּב֧וֹא תְפִלָּתָ֛/ם לִ/מְע֥וֹן קָדְשׁ֖/וֹ לַ/שָּׁמָֽיִם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/027.yaml
  text: Then the priests[a], the Levites, stood up and blessed the people, and their voice was heard, and their prayer came to his holy dwelling[c][b], to heaven.
translation:
  language: te
  text: అప్పుడు లేవీయులైన యాజకులు[a] లేచి ప్రజలను ఆశీర్వదించారు. వారి స్వరం వినబడింది[b]. వారి ప్రార్థన ఆయన పవిత్ర నివాసానికి, ఆకాశానికి చేరింది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా ‘యాజకులు, లేవీయులు.’ ఈ పదబంధం యాజకులను లేవీయులుగా గుర్తిస్తున్నదని అర్థం చేసుకోవచ్చు; ‘లేవీయ యాజకులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘వారి స్వరం ఆలకించబడింది’ అని కూడా అనువదించవచ్చు. కర్మణి రూపం దేవుడు వారి స్వరాన్ని విన్నాడని సూచిస్తుంది, కానీ ఈ ఉపవాక్యంలో ఆయన పేరు స్పష్టంగా లేదు.
    reason: alternative_reading
  - marker: c
    text: ‘ఆయన పవిత్ర నివాసానికి, ఆకాశాలకు’ అని కూడా అనువదించవచ్చు. మూలభాషలో ‘ఆకాశం’ బహువచన రూపంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: లేచి
  rationale: קום అనే క్రియ ఇక్కడ లేవడం లేదా నిలబడడాన్ని సూచిస్తుంది. ఆశీర్వదించే ముందు జరిగిన స్పష్టమైన చర్యను ‘లేచి’ సహజంగా తెలియజేస్తుంది.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: లేవీయులైన యాజకులు
  rationale: ఈ పదబంధం రెండు వేర్వేరు సమూహాలను పేర్కొనడం కంటే, యాజకులను లేవీయులుగా మరింత స్పష్టంగా గుర్తించే సమానాధికార నిర్మాణంగా అర్థమవుతుంది.
- source_word: וַיְבָרֲכוּ
  choice: ఆశీర్వదించారు
  rationale: ברך ఇక్కడ ప్రజల మీద ఆశీర్వచనం పలకడాన్ని సూచిస్తుంది; ‘ఆశీర్వదించారు’ సంక్షిప్తంగా, ప్రమాణబద్ధంగా ఉంది.
- source_word: הָעָם
  choice: ప్రజలను
  rationale: עָם యొక్క సాధారణ అర్థం ‘ప్రజలు’; కూడివచ్చినవారనే సందర్భాన్ని అనవసరంగా విస్తరించకుండా మూలార్థాన్ని నిలుపుతుంది.
- source_word: וַיִּשָּׁמַע בְּקוֹלָם
  choice: వారి స్వరం ఆలకించబడింది
  rationale: שמע యొక్క నిఫాల్ రూపంలోని కర్మణి నిర్మాణాన్ని నిలుపుతూ, మూలంలో స్పష్టంగా లేని దైవిక కర్తను వాక్యంలో చేర్చలేదు.
- source_word: תְפִלָּתָם
  choice: వారి ప్రార్థన
  rationale: ఏకవచన నామవాచకాన్ని అనేకమంది చేసిన సమిష్టి ప్రార్థనగా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לִמְעוֹן קָדְשׁוֹ
  choice: ఆయన పవిత్ర నివాసానికి
  rationale: מָעוֹן నివాసస్థలాన్ని సూచిస్తుంది; ‘పవిత్ర నివాసం’ దాని స్థలసంబంధమైన పవిత్ర చిత్రణను నిలుపుతుంది.
- source_word: לַשָּׁמָיִם
  choice: ఆకాశానికి
  rationale: ఈ పదబంధం ‘ఆయన పవిత్ర నివాసం’ ఎక్కడ ఉందో సమానాధికారంగా వివరిస్తుంది. ఏకవచన ‘ఆకాశం’ ఆధునిక తెలుగులో సహజమైన బైబిలు వాడుక.
theological_decisions:
- issue: ‘ఆలకించబడింది’ అనే వాక్యంలో దేవుణ్ణి స్పష్టమైన కర్తగా పేర్కొనాలా?
  choice: మూలంలోని కర్మణి రూపాన్ని అనుసరించి ‘వారి స్వరం ఆలకించబడింది’ అని ఉంచడం.
  alternative: ‘దేవుడు వారి స్వరాన్ని ఆలకించాడు’ లేదా ‘యెహోవా వారి స్వరాన్ని ఆలకించాడు.’
  rationale: సందర్భం దేవుడే ఆలకించాడని సూచించినా, ఈ ఉపవాక్యంలో హెబ్రీ పాఠం ఆయనను కర్తగా స్పష్టంగా పేర్కొనదు. కర్మణి రూపం ఆ భావసూక్ష్మతను కాపాడుతుంది.
- issue: ‘యాజకులు’ మరియు ‘లేవీయులు’ మధ్య సంబంధం
  choice: ఒకే వర్గాన్ని మరింత స్పష్టంగా గుర్తించేలా ‘లేవీయులైన యాజకులు’ అని అనువదించడం.
  alternative: ‘యాజకులు, లేవీయులు’ అని రెండు వేర్వేరు వర్గాలుగా అర్థం చేసుకోవడం.
  rationale: హెబ్రీ నిర్మాణం సమానాధికారంగా చదవవచ్చు; దినవృత్తాంతముల గ్రంథంలోని వాడుకలో ఇది యాజకులను లేవీయులుగా గుర్తించడం సహజం. అయినా పాదసూచికలో పదనిర్మాణపు ప్రత్యామ్నాయం తెలియజేయబడింది.
- issue: ‘పవిత్ర నివాసం’ మరియు ‘ఆకాశం’ మధ్య సంబంధం
  choice: రెండు పదబంధాలనూ నిలుపుతూ ‘ఆయన పవిత్ర నివాసానికి, ఆకాశానికి’ అని ఇవ్వడం.
  alternative: ‘ఆకాశంలో ఉన్న ఆయన పవిత్ర నివాసానికి’ అని వివరణాత్మకంగా కలపడం.
  rationale: మూలంలో రెండు పదబంధాలకు దిశను సూచించే ל ఉంది; రెండవది మొదటిదాన్ని సమానాధికారంగా వివరిస్తుంది. వాటిని విడిగా నిలపడం మూలంలోని పునరుక్తి మరియు గంభీరతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ఆలకించబడింది’ అనే కర్మణి రూపం కొద్దిగా గంభీరమైనదైనా, మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను కాపాడుతుంది. చివరి వాక్యంలో రెండు దిశాసూచక పదబంధాలను విడిగా నిలిపి హెబ్రీ వాక్య నిర్మాణాన్ని ప్రతిబింబించాం.
