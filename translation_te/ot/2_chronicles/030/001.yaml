source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח יְחִזְקִיָּ֜הוּ עַל כָּל יִשְׂרָאֵ֣ל וִֽ/יהוּדָ֗ה וְ/גַֽם אִגְּרוֹת֙ כָּתַב֙ עַל אֶפְרַ֣יִם וּ/מְנַשֶּׁ֔ה לָ/ב֥וֹא לְ/בֵית יְהוָ֖ה בִּֽ/ירוּשָׁלִָ֑ם לַ/עֲשׂ֣וֹת פֶּ֔סַח לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/001.yaml
  text: Then Hezekiah sent word to all Israel and Judah[a], and also wrote letters to Ephraim and Manasseh, to come to the house of Yahweh in Jerusalem to keep the Passover to Yahweh[c][b], the God of Israel.
translation:
  language: te
  text: అప్పుడు హిజ్కియా ఇశ్రాయేలు, యూదా వారందరికీ[a] సందేశం పంపాడు; ఎఫ్రాయిము, మనష్షే వారికీ ఉత్తరాలు రాశాడు. వారు యెరూషలేములోని యాహ్వే మందిరానికి వచ్చి, ఇశ్రాయేలు దేవుడైన యాహ్వేకు[c] పస్కా పండుగను ఆచరించాలని[b] ఆయన ఇలా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలు, యూదా దేశమంతటా.’ ఇక్కడి హీబ్రూ విభక్తి సందేశం ప్రజలకు పంపబడిందనే భావాన్నీ, ఆ ప్రాంతమంతటా పంపబడిందనే భావాన్నీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘పస్కాను చేయాలని.’ ఇది పస్కా పండుగను పాటించడం లేదా ఆచరించడం అనే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘యాహ్వే కోసం’; పూర్వ అనువాద సంప్రదాయంలో ‘ప్రభువుకు’ అని కూడా ఉంటుంది.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּשְׁלַח ... עַל כָּל יִשְׂרָאֵל וִיהוּדָה
  choice: ఇశ్రాయేలు, యూదా అంతటివారికి కబురు పంపాడు
  rationale: שׁלח అనే క్రియకు ప్రాథమికంగా ‘పంపు’ అనే అర్థం ఉన్నా, ఇక్కడ ప్రజలను ఉద్దేశించి పంపిన సమాచారాన్ని సహజమైన తెలుగులో ‘కబురు పంపాడు’ అని వ్యక్తం చేశాం. עַל యొక్క దిశ లేదా విస్తృతి భావాన్ని ‘అంతటివారికి’ నిలుపుతుంది.
- source_word: אִגְּרוֹת כָּתַב עַל אֶפְרַיִם וּמְנַשֶּׁה
  choice: ఎఫ్రాయిము, మనష్షే వారికి కూడా ఉత్తరాలు రాశాడు
  rationale: אִגְּרוֹת ను ఆధునిక సాధారణ తెలుగులో ‘ఉత్తరాలు’గా, ఉత్తరాలు ఎవరికి ఉద్దేశించబడ్డాయో తెలిపే עַל ను ‘వారికి’గా అనువదించాం.
- source_word: לְבֵית יְהוָה בִּירוּשָׁלִָם
  choice: యెరూషలేములో ఉన్న యాహ్వే మందిరానికి
  rationale: ‘యాహ్వే గృహం’ అనే అక్షరార్థం కన్నా, సందర్భంలో సూచించబడుతున్న ఆరాధనా స్థలాన్ని ordinary Teluguలో స్పష్టంగా తెలిపేందుకు ‘యాహ్వే మందిరం’ ఎంచుకున్నాం.
- source_word: לָבוֹא
  choice: వచ్చి
  rationale: ఆహ్వానం అందుకున్న ప్రజల దృష్టికోణంలో యెరూషలేముకు రావడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לַעֲשׂוֹת פֶּסַח
  choice: పస్కా పండుగను ఆచరించాలని
  rationale: అక్షరార్థమైన ‘పస్కాను చేయు’ అనేది పండుగను పాటించడం లేదా ఆచరించడం అనే హీబ్రూ నుడికారం. ‘ఆచరించాలి’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוה ను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు తెలుగు లిప్యంతరీకరణను వాడాం.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని సహజమైన తెలుగులో నేరుగా అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: לַיהוָה లోని לְ సంబంధం
  choice: యాహ్వేకు
  alternative: యాహ్వే కోసం / యాహ్వే గౌరవార్థం
  rationale: ‘యాహ్వేకు’ అనేది హీబ్రూ దత్తివాచక సంబంధాన్ని నిలుపుతూ, పస్కా ఆచరణ ఆయనకు అంకితమైనదనే భావాన్ని అతిగా వివరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడాం. ‘కబురు పంపాడు,’ ‘ఉత్తరాలు రాశాడు,’ ‘ఆచరించాలని’ వంటి సహజ ప్రయోగాలను ఎంచుకున్నాం; ‘పస్కా,’ ‘యాహ్వే’ వంటి మూలపాఠానికి ప్రత్యేకమైన పదాలను నిలిపాం.
