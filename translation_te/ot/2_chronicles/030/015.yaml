source:
  edition: WLC
  text: וַ/יִּשְׁחֲט֣וּ הַ/פֶּ֔סַח בְּ/אַרְבָּעָ֥ה עָשָׂ֖ר לַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֑י וְ/הַ/כֹּהֲנִ֨ים וְ/הַ/לְוִיִּ֤ם נִכְלְמוּ֙ וַ/יִּֽתְקַדְּשׁ֔וּ וַ/יָּבִ֥יאוּ עֹל֖וֹת בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/015.yaml
  text: And they slaughtered the Passover lamb on the fourteenth day of the second month. Then the priests and the Levites were ashamed and consecrated themselves[a], and they brought burnt offerings to the house of Yahweh.
translation:
  language: te
  text: రెండవ నెల పద్నాలుగవ రోజున వారు పస్కా బలిపశువును[a] వధించారు. అప్పుడు యాజకులు, లేవీయులు సిగ్గుపడి, తమను తాము ప్రతిష్ఠించుకొని, యాహ్వే మందిరానికి దహనబలులు తీసుకొచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘పస్కా’; ఇక్కడ అది వధించబడే పస్కా బలిపశువును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: వధించారు
  rationale: שׁחט బలిసంబంధ సందర్భంలో జంతువును వధించడాన్ని సూచిస్తుంది; ‘వధించారు’ ఆ ఆచారపరమైన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הַפֶּסַח
  choice: పస్కా బలిపశువును
  rationale: ఇక్కడ ఈ పదం పండుగను కాక, వధించబడే పస్కా బలిపశువును సూచిస్తుంది. మూలంలో జంతువు రకం స్పష్టంగా చెప్పబడనందున ‘గొర్రెపిల్లను’ అని పరిమితం చేయలేదు.
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ הַשֵּׁנִי
  choice: రెండవ నెల పద్నాలుగవ రోజున
  rationale: హీబ్రూ కాలసూచనను సహజమైన ఆధునిక తెలుగు పదక్రమంలో వ్యక్తం చేస్తుంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: ఆలయ ఆరాధనా సందర్భంలో כֹּהֲנִיםకు ప్రామాణికమైన తెలుగు పదం.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: యాజకుల నుండి వేరుగా పేర్కొన్న లేవీ గోత్రపు ఆలయ సేవకులను సూచించే సుపరిచిత రూపం.
- source_word: נִכְלְמוּ
  choice: సిగ్గుపడి
  rationale: నిఫాల్ రూపం సిగ్గు లేదా అవమానభావాన్ని తెలియజేస్తుంది; ‘సిగ్గుపడి’ తరువాతి చర్యలతో సహజంగా అనుసంధానమవుతుంది.
- source_word: וַיִּתְקַדְּשׁוּ
  choice: తమను తాము ప్రతిష్ఠించుకొని
  rationale: קדשׁ యొక్క ప్రతిఫలిత రూపం ఆలయ సేవకోసం ఆచారపరంగా తమను సిద్ధపరచుకొని ప్రతిష్ఠించుకోవడాన్ని సూచిస్తుంది.
- source_word: וַיָּבִיאוּ עֹלוֹת
  choice: దహనబలులు తీసుకొచ్చారు
  rationale: עֹלוֹת పూర్తిగా దహించబడే బలులను సూచిస్తుంది; ‘దహనబలులు’ ఆ ప్రత్యేక బలిరకాన్ని కాపాడుతుంది.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరానికి
  rationale: ‘మందిరం’ సందర్భంలోని ఆలయాన్ని సహజంగా తెలియజేస్తుంది; לేని దిశార్థాన్ని ‘-కి’ ద్వారా వ్యక్తం చేసింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: హీబ్రూ పాఠంలోని ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగానే ఉంచుతుంది. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకుంది; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఆచారపరమైన ముఖ్య పదాలకు ‘ప్రతిష్ఠించుకొని’, ‘దహనబలులు’ వాడబడ్డాయి; మూలంలో లేని ‘గొర్రెపిల్ల’ అనే నిర్దిష్టతను ప్రధాన పాఠంలో చేర్చలేదు.
