source:
  edition: WLC
  text: וַֽ/יִּשְׂמְח֣וּ כָּל קְהַ֣ל יְהוּדָ֗ה וְ/הַ/כֹּהֲנִים֙ וְ/הַ/לְוִיִּ֔ם וְ/כָל הַ/קָּהָ֖ל הַ/בָּאִ֣ים מִ/יִּשְׂרָאֵ֑ל וְ/הַ/גֵּרִ֗ים הַ/בָּאִים֙ מֵ/אֶ֣רֶץ יִשְׂרָאֵ֔ל וְ/הַ/יּוֹשְׁבִ֖ים בִּ/יהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/025.yaml
  text: And all the assembly of Judah rejoiced[a], along with the priests and the Levites, and all the assembly who had come from Israel, and the sojourners who had come from the land of Israel, and those living in Judah.
translation:
  language: te
  text: యూదా సమాజమంతా, యాజకులు, లేవీయులు, ఇశ్రాయేలు నుండి వచ్చిన సమాజమంతా, ఇశ్రాయేలు దేశం నుండి వచ్చిన పరదేశ నివాసులు[a], యూదాలో నివసిస్తున్నవారు—అందరూ సంతోషించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వలసవాసులు.’ హెబ్రీ పదమైన גֵּרִים ఇశ్రాయేలు ప్రజల మధ్య నివసించే స్వదేశీయేతరులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: సంతోషించారు
  rationale: שׂמח ఆనందం లేదా సంతోషాన్ని సూచిస్తుంది. ‘సంతోషించారు’ అనేది ఉత్సవ విధానాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా సహజమైన ఆధునిక తెలుగులో క్రియార్థాన్ని అందిస్తుంది.
- source_word: כָּל קְהַל יְהוּדָה
  choice: యూదా సమాజమంతా
  rationale: קהל సమకూడిన ప్రజాసమూహాన్ని సూచిస్తుంది. ‘సమాజమంతా’ మూలంలోని సమష్టి భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: כֹּהֲנִיםకు ప్రామాణికమైన తెలుగు పదం; సందర్భంలో మార్చవలసిన కారణం లేదు.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: యాజకుల నుండి ప్రత్యేకంగా పేర్కొన్న లేవీ గోత్ర సేవకుల సమూహాన్ని సూచించే సంప్రదాయబద్ధమైన, స్పష్టమైన పదం.
- source_word: כָל הַקָּהָל הַבָּאִים מִיִּשְׂרָאֵל
  choice: ఇశ్రాయేలు నుండి వచ్చిన సమాజమంతా
  rationale: הַבָּאִים అనే కృదంతం ఇశ్రాయేలు నుండి వచ్చినవారిని గుర్తిస్తుంది; ‘వచ్చిన’ కథన సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: הַגֵּרִים
  choice: పరదేశ నివాసులు
  rationale: גֵּרִים స్వదేశీయులు కాకపోయినా ఇశ్రాయేలు ప్రజల మధ్య నివసించే వారిని సూచిస్తుంది. ‘పరదేశ నివాసులు’ వారి పరదేశీయ స్థితినీ, అక్కడ నివసించే స్వభావాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: הַבָּאִים מֵאֶרֶץ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేశం నుండి వచ్చిన
  rationale: אֶרֶץ יִשְׂרָאֵלను భౌగోళిక మూలాన్ని సూచించే ‘ఇశ్రాయేలు దేశం’గా అనువదించి, యూదాతో ఉన్న వ్యత్యాసాన్ని నిలిపింది.
- source_word: הַיּוֹשְׁבִים בִּיהוּדָה
  choice: యూదాలో నివసిస్తున్నవారు
  rationale: ישׁב నుండి వచ్చిన కృదంతం నివసించడం అనే కొనసాగుతున్న స్థితిని సూచిస్తుంది; ఈ రూపం ఆ కృదంత భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. హెబ్రీ వాక్యంలోని జాబితాను తెలుగులో స్పష్టంగా చూపేందుకు చివర ‘అందరూ’ ఉంచబడింది. పాదసూచిక గుర్తు దానికి సంబంధించిన ‘పరదేశ నివాసులు’ అన్న పదబంధం వద్దే ఉంచబడింది.
