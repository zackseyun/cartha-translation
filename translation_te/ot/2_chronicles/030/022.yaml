  text: וַ/יְדַבֵּ֣ר יְחִזְקִיָּ֗הוּ עַל לֵב֙ כָּל הַ/לְוִיִּ֔ם הַ/מַּשְׂכִּילִ֥ים שֵֽׂכֶל ט֖וֹב לַ/יהוָ֑ה וַ/יֹּאכְל֤וּ אֶת הַ/מּוֹעֵד֙ שִׁבְעַ֣ת הַ/יָּמִ֔ים מְזַבְּחִים֙ זִבְחֵ֣י שְׁלָמִ֔ים וּ/מִ֨תְוַדִּ֔ים לַ/יהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/022.yaml
  text: And Hezekiah spoke encouragingly to all the Levites who showed good understanding in the service of Yahweh[a]. And they ate the feast for seven days, sacrificing peace offerings and giving thanks to Yahweh[d][c][b], the God of their fathers.
translation:
  language: te
  text: హిజ్కియా, యాహ్వేకు సంబంధించిన విషయాల్లో మంచి అవగాహన కనబరచిన లేవీయులందరితో ప్రోత్సాహకరంగా మాట్లాడాడు.[a][b] వారు ఏడు రోజులపాటు పండుగ విందు ఆరగించారు; సమాధాన బలులు[c] అర్పిస్తూ, తమ పితరుల దేవుడైన యాహ్వేకు కృతజ్ఞతలు చెల్లించారు.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “లేవీయులందరి హృదయానికి మాట్లాడాడు” లేదా “వారి హృదయాలను తాకేలా మాట్లాడాడు.”
    reason: lexical_alternative
  - marker: b
    text: “యాహ్వే విషయంలో మంచి వివేకం కలిగిన” లేదా “యాహ్వేకు సంబంధించిన విషయాల్లో నైపుణ్యం చూపిన” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో “సమాధాన బలులు”; “సహవాస బలులు” లేదా “క్షేమ బలులు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: ఈ క్రియకు “ఒప్పుకోవడం” లేదా “స్తుతించడం” అనే అర్థాలు కూడా ఉండవచ్చు; ఇక్కడ ఆరాధనలో కృతజ్ఞతలు చెల్లించడం అనే భావం సందర్భానికి సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר עַל־לֵב
  choice: ప్రోత్సాహకరంగా మాట్లాడాడు
  rationale: ‘హృదయంతో/హృదయానికి మాట్లాడాడు’ అనే హీబ్రూ నుడికారానికి బలపరచేలా, ధైర్యం కలిగించేలా మాట్లాడటం అనే భావం ఉంది. ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి గోత్రానికి చెందిన ఆలయ పరిచారకుల ప్రామాణిక నామరూపాన్ని నిలుపుతుంది.
- source_word: הַמַּשְׂכִּילִים שֵׂכֶל טוֹב לַיהוָה
  choice: యాహ్వే విషయాల్లో మంచి అవగాహన కనబరచిన
  rationale: שׂכל ధాతువు, దానితో సంబంధమున్న నామవాచకం కలిసి అవగాహన, వివేకం లేదా నైపుణ్యాన్ని నొక్కిచెబుతున్నాయి. לַיהוָה అనే సంబంధాన్ని ‘యాహ్వే విషయాల్లో’ అని ఉంచడం ద్వారా ‘సేవలో’ అనే పదాన్ని మూలంలో లేకుండానే చేర్చకుండా ఆరాధనాపరమైన సందర్భాన్ని తెలియజేస్తుంది.
- source_word: וַיֹּאכְלוּ אֶת־הַמּוֹעֵד שִׁבְעַת הַיָּמִים
  choice: వారు ఏడు రోజులపాటు పండుగ విందు ఆరగిస్తూ
  rationale: మూలంలోని ‘పండుగను తిన్నారు’ అనే భావాన్ని తెలుగులో సహజంగా చెప్పేందుకు ‘పండుగ విందు ఆరగించారు’ అని konkretంగా అనువదించబడింది; ఏడు రోజుల కాలవ్యవధి నిలుపబడింది.
- source_word: מְזַבְּחִים זִבְחֵי שְׁלָמִים
  choice: సమాధాన బలులు అర్పిస్తూ
  rationale: זִבְחֵי שְׁלָמִים అనే నిర్దిష్ట బలి వర్గానికి తెలుగులో గుర్తించదగిన సంప్రదాయ పదబంధం; సహవాసం, క్షేమం వంటి విస్తృత భావాలను పాదసూచికలో సూచించాం.
- source_word: וּמִתְוַדִּים
  choice: కృతజ్ఞతలు చెల్లించారు
  rationale: ידה హిత్పయేల్ రూపం ఒప్పుకోవడం, స్తుతించడం లేదా కృతజ్ఞత చెప్పడం అనే భావాలను కలిగి ఉండవచ్చు. పండుగ, బలుల సందర్భంలో కృతజ్ఞతారాధన భావం సహజంగా సరిపోతుంది; అసలు సందిగ్ధతను పాదసూచికలో నిలిపాం.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: తమ పితరుల దేవుడు
  rationale: ఒడంబడికపరమైన పూర్వీకుల అనుబంధాన్ని తెలిపే మూలపదబంధాన్ని గౌరవంగా, సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా, ‘Yahweh’కు సమీపమైన తెలుగు లిప్యంతరీకరణతో ఉంచాం.
- issue: וּמִתְוַדִּים యొక్క ఆరాధనాపరమైన భావం
  choice: కృతజ్ఞతలు చెల్లించారు
  alternative: ఒప్పుకున్నారు; స్తుతించారు
  rationale: సందర్భం ఆనందభరితమైన పండుగ, సమాధాన బలుల ఆరాధన కావడంతో కృతజ్ఞత భావం ప్రధానంగా తీసుకున్నాం; అయితే పాపాన్ని ఒప్పుకోవడం లేదా స్తుతించడం అనే సాధ్యార్థాలను పాదసూచికలో తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘పండుగను తిన్నారు’ అనే అసహజ అక్షరానువాదానికి బదులు ‘పండుగ విందు ఆరగించారు’ అని ఇచ్చాం. మూలంలో స్పష్టంగా లేని ‘ఆలయ సేవలో’ అనే విస్తరణను ప్రధాన పాఠ్యంలో చేర్చలేదు; లేవీయుల అవగాహన యాహ్వేకు సంబంధించినదనే సంబంధాన్ని మాత్రమే నిలిపాం.
