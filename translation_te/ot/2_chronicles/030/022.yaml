- from: హిజ్కియా, యాహ్వే విషయాల్లో మంచి అవగాహన కనబరచిన లేవీయులందరితో ప్రోత్సాహకరంగా మాట్లాడాడు.[a][b] వారు ఏడు రోజులపాటు పండుగ విందు ఆరగిస్తూ, సమాధాన బలులు[c] అర్పిస్తూ, తమ పితరుల దేవుడైన యాహ్వేకు కృతజ్ఞతలు చెల్లించారు.[d]
  to: హిజ్కియా, యాహ్వేకు సంబంధించిన విషయాల్లో మంచి అవగాహన కనబరచిన లేవీయులందరితో ప్రోత్సాహకరంగా మాట్లాడాడు.[a][b] వారు ఏడు రోజులపాటు పండుగ విందు ఆరగించారు; సమాధాన బలులు[c] అర్పిస్తూ, తమ పితరుల దేవుడైన యాహ్వేకు కృతజ్ఞతలు చెల్లించారు.[d]
  rationale: అర్థాన్ని మార్చకుండా, మూలంలోని ప్రధాన క్రియకు తెలుగులో సరైన భూతకాల రూపాన్ని ఇచ్చాం. యాహ్వే-సంబంధిత అవగాహన అనే కొద్దిగా విస్తృతమైన మూలభావాన్ని నిలిపి, బలులూ కృతజ్ఞతలూ పండుగ ఆరాధనలో సమకాలీన చర్యలని చూపించాం. పాదసూచిక aలోని అక్షరార్థాన్ని కూడా మెరుగుపరిచాం.
