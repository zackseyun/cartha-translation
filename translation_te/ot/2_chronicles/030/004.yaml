  text: The matter seemed right in the eyes of the king and in the eyes of all the assembly[a].
translation:
  language: te
  text: ఆ విషయం రాజు దృష్టిలోను, సమస్త సమాజం దృష్టిలోను సరైనదిగా అనిపించింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ విషయం రాజు దృష్టిలోను, సమస్త సమాజం దృష్టిలోను సరైనదిగా ఉంది.”
    reason: యָשָׁר క్రియను ఇక్కడ మూల్యాంకన భావంతో ‘సరైనదిగా అనిపించింది’ అని, లేదా స్థితిని నేరుగా సూచిస్తూ ‘సరైనదిగా ఉంది’ అని అనువదించవచ్చు.
lexical_decisions:
- source_word: וַיִּישַׁר
  choice: సరైనదిగా అనిపించింది
  rationale: ישר అనే క్రియ ఇక్కడ ఒక విషయం సముచితమైనదిగా లేదా అనుకూలమైనదిగా పరిగణించబడిందని సూచిస్తుంది. ‘సరైనదిగా అనిపించింది’ మూలంలోని భావనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הַדָּבָר
  choice: ఆ విషయం
  rationale: דבר విస్తృతార్థక పదం; ఈ సందర్భంలో ముందు ప్రస్తావించిన కార్యాచరణను సూచిస్తుంది. ‘ఆ విషయం’ నేరుగా, సందర్భానుకూలంగా ఉంది; ‘ప్రతిపాదన’ అని అనువదిస్తే మూలంలో స్పష్టంగా లేని ప్రత్యేకత చేరవచ్చు.
- source_word: בְּעֵינֵי
  choice: దృష్టిలో
  rationale: అక్షరార్థంగా ‘కళ్లలో’ అనే హీబ్రూ ప్రయోగం ఒకరి అంచనా లేదా అభిప్రాయాన్ని సూచిస్తుంది. తెలుగులో ‘దృష్టిలో’ ఆ రూపకాన్ని, భావాన్ని సహజంగా కాపాడుతుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న నామవాచకానికి సూటి అనువాదం.
- source_word: וּבְעֵינֵי
  choice: దృష్టిలోనూ
  rationale: మూలంలోని పునరుక్త సమాంతర నిర్మాణాన్ని తెలుగులో ‘నూ’తో సహజంగా నిలిపింది.
- source_word: כָּל
  choice: మంతటి
  rationale: సమాజం మొత్తాన్ని సమగ్రంగా సూచిస్తుంది; ‘సమాజమంతటి’ ఆధునిక తెలుగులో సహజమైన సమాసరూపం.
- source_word: הַקָּהָל
  choice: సమాజం
  rationale: קהל ఇక్కడ కూడి ఉన్న ప్రజాసమూహాన్ని సూచిస్తుంది. ‘సమాజం’ గౌరవప్రదంగా, సాధారణ పాఠకులకు సులభంగా ఉండి, అనవసరమైన సంఘపరమైన అర్థాన్ని రుద్దదు.
