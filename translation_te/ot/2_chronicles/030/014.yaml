source:
  edition: WLC
  text: וַ/יָּקֻ֕מוּ וַ/יָּסִ֨ירוּ֙ אֶת הַֽ/מִּזְבְּח֔וֹת אֲשֶׁ֖ר בִּ/ירוּשָׁלִָ֑ם וְ/אֵ֤ת כָּל הַֽ/מְקַטְּרוֹת֙ הֵסִ֔ירוּ וַ/יַּשְׁלִ֖יכוּ לְ/נַ֥חַל קִדְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/014.yaml
  text: They arose and removed the altars that were in Jerusalem[b][a], and they removed all the incense altars and threw them into the Kidron Valley.
translation:
  language: te
  text: వారు లేచి, యెరూషలేములో ఉన్న బలిపీఠాలను తొలగించారు. ధూపపీఠాలన్నిటినీ[a] కూడా తొలగించి, కిద్రోను లోయలోకి[b] పడవేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ధూపం వేసే స్థలాలన్నిటినీ,’ లేదా ‘ధూపపు పీఠికలన్నిటినీ.’ హెబ్రీ పదం ధూపం వేయడానికి సంబంధించిన ఆరాధనా స్థాపనలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో, ‘కిద్రోను వాగు/వాగులోయ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: వారు లేచి
  rationale: קום అనే క్రియ ఇక్కడ నిర్ణయాత్మక చర్యకు శ్రీకారం చుట్టే కథన రూపంలో ఉంది. ‘లేచి’ అనేది హెబ్రీ కథన కదలికను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וַיָּסִירוּ / הֵסִירוּ
  choice: తొలగించారు / తొలగించి
  rationale: హిఫీల్ రూపంలోని סור ఇక్కడ ‘తీసివేయడం, తొలగించడం’ అనే అర్థాన్ని ఇస్తుంది. రెండు సందర్భాల్లోనూ ఒకే మూలార్థాన్ని నిలిపి, తెలుగు వాక్యప్రవాహానికి అనుగుణంగా రూపాలు మార్చబడ్డాయి.
- source_word: הַמִּזְבְּחוֹת
  choice: బలిపీఠాలను
  rationale: מזבח యొక్క సాధారణ బహువచనార్థం ‘బలిపీఠాలు.’ అవి అనధికార ఆరాధనా కట్టడాలని సందర్భం సూచిస్తున్నందున అనువాదంలో అదనపు విశేషణం చేర్చలేదు.
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: యెరూషలేములో ఉన్న
  rationale: హెబ్రీ సంబంధ వాక్యభాగాన్ని స్పష్టంగా నిలిపి, బలిపీఠాల స్థలాన్ని సూచిస్తుంది.
- source_word: הַמְקַטְּרוֹת
  choice: ధూపపీఠాలన్నిటినీ
  rationale: ఈ పదం ధూపం వేయడానికి సంబంధించిన ఆరాధనా కట్టడాలను సూచిస్తుంది. ‘ధూపపీఠాలు’ సంక్షిప్తంగా, సహజంగా ఉన్నప్పటికీ, అది ధూపం వేసే స్థలాలు లేదా ధూపపు పీఠికలను కూడా సూచించగలదనే అర్థవిస్తృతిని పాదసూచికలో నిలిపాం.
- source_word: וַיַּשְׁלִיכוּ
  choice: పడవేశారు
  rationale: שׁלך అంటే ‘విసరడం, పారవేయడం.’ ఇక్కడ తొలగించిన కట్టడాలను బలంగా పారవేసిన భావాన్ని ‘పడవేశారు’ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְנַחַל קִדְרוֹן
  choice: కిద్రోను లోయలో
  rationale: נחל అనేది వాగు, కాలానుగుణ జలప్రవాహం గల లోయ, లేదా వాగులోయను సూచించవచ్చు. సాధారణ పాఠకునికి భౌగోళికంగా స్పష్టంగా ఉండే ‘కిద్రోను లోయ’ను ప్రధాన పాఠంలో ఉంచి, ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథన శైలి ఉపయోగించబడింది. హెబ్రీ వాక్యంలోని వరుస చర్యలు స్పష్టంగా ఉండేలా రెండు వాక్యాలుగా అమర్చాం; ‘కూడా’ ద్వారా రెండవ తొలగింపు చర్యను మొదటిదానితో సహజంగా అనుసంధానించాం.
