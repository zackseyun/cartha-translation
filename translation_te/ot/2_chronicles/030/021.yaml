revisions:
- from: యెరూషలేములో ఉన్న ఇశ్రాయేలీయులు ఏడు రోజులు ఎంతో ఆనందంగా పులియని రొట్టెల పండుగను ఆచరించారు. లేవీయులు, యాజకులు శక్తిమంతంగా మోగే వాద్యాలతో యెహోవాను ప్రతిరోజూ స్తుతించారు.[a]
  to: యెరూషలేములో ఉన్న ఇశ్రాయేలీయులు పులియని రొట్టెల పండుగను ఏడు రోజులు ఎంతో ఆనందంతో ఆచరించారు. లేవీయులు, యాజకులు యెహోవాను ప్రతిరోజూ స్తుతిస్తూ, యెహోవా కొరకు శక్తి వాద్యాలతో వాయించారు.[a]
  rationale: The revision removes the unsupported specification that the instruments were necessarily sounding loudly, preserves the lexical strangeness of “instruments of strength,” and represents the final phrase “to/for Yahweh” without imposing a disputed interpretation. “వాయించారు” naturally supplies the action performed with instruments while “స్తుతిస్తూ” retains the participial, attendant action of praising.
