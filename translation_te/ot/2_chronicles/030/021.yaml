id: 2CH.30.21
reference: 2 Chronicles 30:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֣וּ בְנֵֽי יִ֠שְׂרָאֵל הַ/נִּמְצְאִ֨ים בִּ/ירוּשָׁלִַ֜ם אֶת חַ֧ג הַ/מַּצּ֛וֹת שִׁבְעַ֥ת יָמִ֖ים בְּ/שִׂמְחָ֣ה גְדוֹלָ֑ה וּֽ/מְהַלְלִ֣ים לַ֠/יהוָה י֣וֹם בְּ/י֞וֹם הַ/לְוִיִּ֧ם וְ/הַ/כֹּהֲנִ֛ים בִּ/כְלֵי עֹ֖ז לַ/יהוָֽה־־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/021.yaml
  text: And the sons of Israel who were found in Jerusalem kept the Feast of Unleavened Bread for seven days with great joy[b][a], and the Levites and the priests praised Yahweh day by day with mighty instruments to Yahweh.
translation:
  language: te
  text: యెరూషలేములో ఉన్న ఇశ్రాయేలీయులు పులియని రొట్టెల పండుగను ఏడు రోజులు ఎంతో ఆనందంతో ఆచరించారు. లేవీయులు, యాజకులు యెహోవాను ప్రతిరోజూ స్తుతిస్తూ, యెహోవా కొరకు శక్తి వాద్యాలతో వాయించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “శక్తి వాద్యాలతో, యెహోవా కొరకు” అనే హీబ్రూ పదబంధం అసాధారణమైనది. దీనిని “బలమైన వాద్యాలతో,” “గట్టిగా మోగే వాద్యాలతో,” లేదా “యెహోవాకు అర్పించిన శక్తి వాద్యాలతో” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: בִּכְלֵי־עֹז לַיהוָה అనే క్లిష్టమైన పదబంధంలోని పదార్థ, వాక్యనిర్మాణ అస్పష్టతను నిలుపుటకు.
lexical_decisions:
- source_word: וַיַּעֲשׂוּ ... אֶת חַג הַמַּצּוֹת
  choice: పులియని రొట్టెల పండుగను ఆచరించారు
  rationale: עשה అనే క్రియ חגతో కలిసి వచ్చినప్పుడు పండుగను జరపడం లేదా ఆచరించడం అనే నుడికారార్థం వస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘ఆచరించారు’ సహజంగానూ గౌరవప్రదంగానూ ఉంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; అయితే ఈ చారిత్రక సందర్భంలో ఇశ్రాయేలు ప్రజలను సూచిస్తుంది. ‘ఇశ్రాయేలీయులు’ తెలుగులో సహజంగా, సమగ్రంగా ఆ అర్థాన్ని అందిస్తుంది.
- source_word: הַנִּמְצְאִים בִּירוּשָׁלִַם
  choice: యెరూషలేములో ఉన్న
  rationale: מצא యొక్క అక్షరార్థం ‘కనబడిన’ అయినా, ఇక్కడ భావం అక్కడ హాజరై ఉన్నవారు. ‘ఉన్న’ అనేది సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שִׁבְעַת יָמִים בְּשִׂמְחָה גְדוֹלָה
  choice: ఏడు రోజులు ఎంతో ఆనందంగా
  rationale: కాలవ్యవధిని, గొప్ప సంతోషాన్ని స్పష్టమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: יוֹם בְּיוֹם
  choice: ప్రతిరోజూ
  rationale: హీబ్రూ పంపిణీ నుడికారం ‘రోజు రోజుకు/ప్రతి రోజు’ అనే అర్థం ఇస్తుంది; ‘ప్రతిరోజూ’ సహజమైన తెలుగు రూపం.
- source_word: בִּכְלֵי עֹז
  choice: శక్తిమంతంగా మోగే వాద్యాలతో
  rationale: అక్షరార్థంగా ‘బలం/శక్తి గల వాద్యాలతో’. వాద్యాల ధ్వని బలాన్ని సూచించే సాధ్యమైన భావాన్ని తెలుగులో పఠనీయంగా అందిస్తుంది; మూలంలోని అసాధారణ పదబంధం, ఇతర సాధ్యార్థాలు పాదసూచికలో ఉంచబడ్డాయి.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన నాలుగు హీబ్రూ అక్షరాల పేరును బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపం ‘యెహోవా’గా ఇచ్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాకుండా దేవుని వ్యక్తినామం నేరుగా ఉంది. అందువల్ల దాన్ని ‘ప్రభువు’గా మార్చకుండా పేరుగానే ఉంచాం.
- issue: בִּכְלֵי עֹז לַיהוָה అనే క్లిష్ట పదబంధం
  choice: శక్తిమంతంగా మోగే వాద్యాలతో యెహోవాను ... స్తుతించారు
  alternative: యెహోవా కోసం బలమైన వాద్యాలతో స్తుతించారు
  rationale: לַיהוָה ను ఉద్దేశ్యంగా లేదా ప్రయోజనార్థకంగా గ్రహించవచ్చు; ముందే యెహోవా స్తుతికి కర్మగా ఉన్నందున తెలుగులో దాన్ని మళ్లీ పునరావృతం చేయడం అసహజం. వాద్యాల స్వభావానికి సంబంధించిన అస్పష్టతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా చారిత్రక-ఆరాధనా గాంభీర్యాన్ని నిలిపాం. వాక్యాన్ని తెలుగులో సహజంగా రెండు వాక్యాలుగా విభజించాం; మూలంలోని వరుస చర్యల సంబంధం మారలేదు.
