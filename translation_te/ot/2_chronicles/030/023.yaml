translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. మూలంలో ‘పండుగ’ అనే పదం ప్రత్యక్షంగా లేకపోవడంతో దానిని ప్రధాన వచనంలో చేర్చలేదు; ‘ఆచరించడం’ ద్వారా సందర్భార్థాన్ని తెలిపింది.
