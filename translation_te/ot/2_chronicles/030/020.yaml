source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע יְהוָה֙ אֶל יְחִזְקִיָּ֔הוּ וַ/יִּרְפָּ֖א אֶת הָ/עָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/020.yaml
  text: And Yahweh listened to Hezekiah and healed the people[a][b].
translation:
  language: te
  text: యహ్వే హిజ్కియా మాట ఆలకించి, ప్రజలను స్వస్థపరిచాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హిజ్కియా మాట విన్నాడు.’ ఈ నిర్మాణంలో హీబ్రూ క్రియకు ‘వినడం’ లేదా ‘శ్రద్ధగా విని అనుకూలంగా స్పందించడం’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘స్వస్థపరిచాడు’ అనేది తప్పనిసరిగా శారీరక వ్యాధిని మాత్రమే సూచించకపోవచ్చు; ప్రజల ఆచారపరంగా అపవిత్రమైన స్థితితో ముడిపడిన బాధను లేదా తీర్పును యహ్వే తొలగించడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: మొరను ఆలకించి
  rationale: שׁמע అనే క్రియ אֶל తో వచ్చినప్పుడు కేవలం శబ్దం వినడమే కాక, ఒకరి విన్నపాన్ని శ్రద్ధగా విని అనుకూలంగా స్పందించడాన్ని కూడా సూచిస్తుంది. ముందరి వచనాల్లో హిజ్కియా ప్రజల కోసం ప్రార్థించిన సందర్భం ఉన్నందున ‘మొరను ఆలకించి’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దేవుని వ్యక్తిగత నామమైన יהוה ను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో సమీప లిప్యంతరీకరణగా ‘యహ్వే’ అని ఇచ్చాం.
- source_word: יְחִזְקִיָּהוּ
  choice: హిజ్కియా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న సహజ రూపాన్ని ఉపయోగించాం.
- source_word: וַיִּרְפָּא
  choice: స్వస్థపరిచాడు
  rationale: רפא యొక్క ప్రాథమిక ‘స్వస్థపరచు/నయం చేయు’ రూపకాన్ని నిలిపి ఉంచుతూ, ఇది కేవలం శారీరక వ్యాధినే సూచిస్తుందని పరిమితం చేయలేదు.
- source_word: הָעָם
  choice: ప్రజలను
  rationale: ఇక్కడ עם పస్కా ఆచరణ కోసం కూడిన ఇశ్రాయేలు సమాజాన్ని విస్తృతంగా సూచిస్తుంది; ‘ప్రజలు’ సహజమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: ‘ప్రజలను స్వస్థపరిచాడు’ అనే మాటలో స్వస్థత స్వభావం
  choice: హీబ్రూ వచనంలోని స్వస్థపరిచే భాషను యథాతథంగా నిలిపి, దానిని శారీరక స్వస్థతకు మాత్రమే పరిమితం చేయలేదు.
  alternative: ప్రజలను క్షమించాడు / శిక్ష నుండి కాపాడాడు / పునరుద్ధరించాడు
  rationale: సందర్భంలో ఆచారపరంగా శుద్ధి పొందకుండానే పస్కా భోజనం చేసినవారి కోసం హిజ్కియా క్షమాపణ కోరాడు. అయినప్పటికీ మూలపాఠం רפא (‘స్వస్థపరచు’) అనే క్రియనే ఉపయోగిస్తుంది. కాబట్టి వచనంలోని ఉద్దేశపూర్వక విస్తృతతను, ధార్మిక ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. ‘మొరను ఆలకించి’ ప్రార్థనా సందర్భాన్ని సహజంగా తెలియజేస్తుంది; ‘స్వస్థపరిచాడు’ మూలంలోని రూపకాన్నీ దాని అర్థవిస్తృతినీ కాపాడుతుంది.
