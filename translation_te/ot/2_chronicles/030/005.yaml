source:
  edition: WLC
  text: וַ/יַּֽעֲמִ֣ידוּ דָבָ֗ר לְ/הַעֲבִ֨יר ק֤וֹל בְּ/כָל יִשְׂרָאֵל֙ מִ/בְּאֵֽר שֶׁ֣בַע וְ/עַד דָּ֔ן לָ/ב֞וֹא לַ/עֲשׂ֥וֹת פֶּ֛סַח לַ/יהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בִּ/ירוּשָׁלִָ֑ם כִּ֣י לֹ֥א לָ/רֹ֛ב עָשׂ֖וּ כַּ/כָּתֽוּב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/005.yaml
  text: So they established a decree to send a proclamation throughout all Israel[a], from Beersheba to Dan, that they should come to keep the Passover to Yahweh, the God of Israel, at Jerusalem; for they had not kept it in great numbers as it is written.
translation:
  language: te
  text: 'కాబట్టి వారు బెయేర్షెబా నుండి దాను వరకు ఇశ్రాయేలు దేశమంతటా ప్రకటన చేయాలని నిర్ణయించారు: ప్రజలు యెరూషలేముకు వచ్చి ఇశ్రాయేలు దేవుడైన యాహ్వేకు పస్కా పండుగను ఆచరించాలి. ఎందుకంటే వారు వ్రాయబడి ఉన్న విధంగా దానిని పెద్ద సంఖ్యలో ఆచరించలేదు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యం సంక్షిప్తంగా ఉంది. దీనిని, “వ్రాయబడి ఉన్న విధంగా దానిని ఆచరించినవారు చాలామంది లేరు” అని కూడా అనువదించవచ్చు. ఇది పాల్గొన్నవారి సంఖ్య తక్కువగా ఉండడాన్నో, నిర్దేశించిన విధంగా ఆచరణ విస్తృతంగా జరగకపోవడాన్నో నొక్కిచెప్పవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמִידוּ דָבָר
  choice: నిర్ణయించారు
  rationale: ‘ఒక విషయాన్ని నిలబెట్టారు’ అనే అక్షరార్థం ఇక్కడ అధికారిక నిర్ణయం తీసుకోవడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘నిర్ణయించారు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: לְהַעֲבִיר קוֹל
  choice: ప్రకటన చేయాలని
  rationale: అక్షరార్థంగా ‘స్వరాన్ని వెళ్లేలా చేయడం’; ఈ పరిపాలనా సందర్భంలో దేశమంతటా బహిరంగ ప్రకటన వ్యాపింపజేయడమే భావం.
- source_word: בְּכָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేశమంతటా
  rationale: ప్రకటన మొత్తం భూభాగంలో వ్యాపించాలనే విస్తృతిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מִבְּאֵר שֶׁבַע וְעַד דָּן
  choice: బెయేర్షెబా మొదలుకొని దాను వరకు
  rationale: దక్షిణం నుంచి ఉత్తరం వరకు దేశమంతటినీ సూచించే స్థిరమైన భౌగోళిక ప్రయోగాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: לָבוֹא
  choice: ప్రజలు ... వచ్చి
  rationale: ప్రకటనలోని ఆహ్వానం లేదా ఉద్దేశాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేయడానికి కర్తను సందర్భానుసారంగా చేర్చింది.
- source_word: לַעֲשׂוֹת פֶּסַח
  choice: పస్కా పండుగను ఆచరించాలి
  rationale: అక్షరార్థం ‘పస్కాను చేయడం’; పండుగను విధిగా పాటించడాన్ని ‘ఆచరించడం’ సహజంగా తెలియజేస్తుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: సంబంధ నిర్మాణాన్ని సహజమైన తెలుగు విశేషణ రూపంలో అందిస్తుంది.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేముకు వచ్చి
  rationale: ఆరాధన కోసం చేరవలసిన గమ్యస్థానంగా యెరూషలేమును చూపిస్తుంది.
- source_word: כִּי לֹא לָרֹב עָשׂוּ
  choice: ఎందుకంటే ... వారు దానిని పెద్ద సంఖ్యలో ఆచరించలేదు
  rationale: לָרֹבకు ప్రధానంగా పరిమాణం లేదా విస్తృతి అనే భావం ఉంది. అందువల్ల కాలవ్యవధిని ప్రవేశపెట్టకుండా, విస్తృత ప్రజాపాల్గొనడం జరగలేదనే భావాన్ని నిలుపుతుంది.
- source_word: כַּכָּתוּב
  choice: లేఖనంలో ఉన్న ప్రకారం
  rationale: లిఖిత ధర్మశాస్త్ర నియమానికి అనుగుణతను సూచిస్తుంది; అయితే వాక్యంలో ఇది ఏ భాగంతో బలంగా అనుసంధానమవుతుందో కొంత సందిగ్ధత ఉంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో నేరుగా ఉన్న ఒడంబడిక నామాన్ని సాధ్యమైనంత స్పష్టంగా నిలుపుతూ, దానిని సాధారణ బిరుదుగా మార్చలేదు.
- issue: పస్కా ఆచరణలో లోపం స్వరూపం
  choice: పెద్ద సంఖ్యలో ఆచరించలేదు
  alternative: లేఖనంలో ఉన్న విధంగా ఆచరించలేదు
  rationale: לָרֹב పరిమాణాన్ని ప్రధానంగా సూచిస్తుంది; అయినా సంక్షిప్త హీబ్రూ వాక్యనిర్మాణం కారణంగా పాల్గొన్న వారి సంఖ్యకా, నిర్దేశిత విధానంలో విస్తృత ఆచరణకా ప్రాధాన్యం అన్నది పూర్తిగా తేలదు. ఆ సందిగ్ధతను పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. పరిపాలనా నిర్ణయం, దేశవ్యాప్త ప్రకటన, పండుగ ఆచరణ అనే మూడు భావాలు స్పష్టంగా విడదీయబడ్డాయి. మూలంలోని చివరి సంక్షిప్త వాక్యభాగపు సందిగ్ధతను ప్రధాన పాఠంలో బలవంతంగా పరిష్కరించకుండా పాదసూచికలో వివరించింది.
