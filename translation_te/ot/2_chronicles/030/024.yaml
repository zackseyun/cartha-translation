id: 2CH.30.24
reference: 2 Chronicles 30:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י חִזְקִיָּ֣הוּ מֶֽלֶךְ יְ֠הוּדָה הֵרִ֨ים לַ/קָּהָ֜ל אֶ֣לֶף פָּרִים֮ וְ/שִׁבְעַ֣ת אֲלָפִ֣ים צֹאן֒ וְ/הַ/שָּׂרִ֞ים הֵרִ֤ימוּ לַ/קָּהָל֙ פָּרִ֣ים אֶ֔לֶף וְ/צֹ֖אן עֲשֶׂ֣רֶת אֲלָפִ֑ים וַ/יִּֽתְקַדְּשׁ֥וּ כֹהֲנִ֖ים לָ/רֹֽב־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/024.yaml
  text: For Hezekiah king of Judah gave to the assembly one thousand bulls and seven thousand sheep[a], and the officials gave to the assembly one thousand bulls and ten thousand sheep[b]; and priests consecrated themselves in great numbers.
translation:
  language: te
  text: ఎందుకంటే యూదా రాజైన హిజ్కియా సమాజానికి వెయ్యి ఎద్దులను, ఏడు వేల చిన్న పశువులను[a] ఇచ్చాడు. అధికారులు కూడా సమాజానికి వెయ్యి ఎద్దులను, పదివేల చిన్న పశువులను ఇచ్చారు. అనేకమంది యాజకులు తమను తాము పవిత్రపరచుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “చిన్న పశువులు” అని అనువదించిన హీబ్రూ పదం ఇక్కడ రెండు చోట్ల ఉంది; అది గొర్రెలను, మేకలను కలిపి సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న వాక్యంలోని ఆనందోత్సాహానికి, విస్తారమైన భాగస్వామ్యానికి కారణాన్ని ఈ వాక్యం వివరిస్తోంది; అందువల్ల కారణార్థక సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: הֵרִים / הֵרִימוּ
  choice: ఇచ్చాడు / ఇచ్చారు
  rationale: ఇక్కడ హిఫీల్ రూపం సమాజ ఆరాధన కోసం జంతువులను సమకూర్చి ఇవ్వడాన్ని సూచిస్తుంది; అక్షరార్థమైన ‘పైకి ఎత్తడం’ను కాదు.
- source_word: לַקָּהָל
  choice: సమాజానికి
  rationale: קהל పండుగకు కూడిన ప్రజాసమూహాన్ని సూచిస్తుంది. לְ ఉపసర్గకు ఇక్కడ ‘సమాజానికి’ లేదా ‘సమాజం కోసం’ అనే రెండు భావాలూ సాధ్యమైనప్పటికీ, ప్రధాన పాఠ్యంలో దాత-గ్రహీత సంబంధాన్ని సహజంగా వ్యక్తం చేసింది.
- source_word: אֶלֶף פָּרִים
  choice: వెయ్యి ఎద్దులు
  rationale: פָּרִים బలి అర్పణకు ఉపయోగించే మగ పశువులను సూచిస్తుంది; ‘ఎద్దులు’ నేరుగా, సహజంగా అర్థాన్ని అందిస్తుంది.
- source_word: צֹאן
  choice: మంద జంతువులు
  rationale: צֹאן అనేది గొర్రెలతో పాటు మేకలనూ కలుపుకోగల సామూహిక పదం. ‘గొర్రెలు’ అని సంకుచితం చేయకుండా మూలంలోని విస్తృతార్థాన్ని నిలిపింది.
- source_word: הַשָּׂרִים
  choice: అధికారులు
  rationale: שׂרים ఉన్నత స్థాయి పాలనా నాయకులను సూచిస్తుంది; ‘అధికారులు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, వారసత్వ రాజకుమారులనే అనవసరంగా సూచించదు.
- source_word: וַיִּתְקַדְּשׁוּ כֹהֲנִים
  choice: యాజకులు తమను తాము ప్రతిష్ఠించుకున్నారు
  rationale: קדשׁ యొక్క హిత్పయేల్ రూపం యాజకులు సేవ కోసం తమను తాము ఆచారపూర్వకంగా సిద్ధపరచుకొని ప్రత్యేకించుకున్నారని సూచిస్తుంది; ప్రతిఫలార్థాన్ని నిలిపింది.
- source_word: לָרֹב
  choice: గొప్ప సంఖ్యలో
  rationale: అనేకమంది యాజకులు సిద్ధమైనారనే పరిమాణాత్మక ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యాజకుల ఆచారపూర్వక సిద్ధత
  choice: తమను తాము ప్రతిష్ఠించుకున్నారు
  alternative: తమను తాము శుద్ధి చేసుకున్నారు
  rationale: మూల క్రియ పవిత్ర సేవ కోసం ప్రత్యేకించుకోవడాన్ని ప్రధానంగా చెబుతుంది. శుద్ధీకరణ ఇందులో భాగమై ఉండవచ్చు గాని, దానికే అర్థాన్ని పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలిని ఉపయోగించాం. హీబ్రూ צֹאן యొక్క విస్తృతార్థాన్ని ప్రధాన పాఠ్యంలోనే నిలిపి, వివరణార్థం ఒక పాదటిప్పణి ఇచ్చాం. వాక్యంలోని కారణార్థక అనుసంధానాన్ని ‘ఎందుకంటే’తో, యాజకుల చర్యలోని ప్రతిఫల మరియు ఆచారపూర్వక భావాన్ని ‘తమను తాము ప్రతిష్ఠించుకున్నారు’తో పరిరక్షించాం.
