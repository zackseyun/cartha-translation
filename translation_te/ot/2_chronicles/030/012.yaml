language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: גַּ֣ם בִּ/יהוּדָ֗ה הָֽיְתָה֙ יַ֣ד הָ/אֱלֹהִ֔ים לָ/תֵ֥ת לָ/הֶ֖ם לֵ֣ב אֶחָ֑ד לַ/עֲשׂ֞וֹת מִצְוַ֥ת הַ/מֶּ֛לֶךְ וְ/הַ/שָּׂרִ֖ים בִּ/דְבַ֥ר יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/012.yaml
  text: Also in Judah the hand of God was on them to give them one heart to carry out the command of the king and the officials[a], according to the word of Yahweh.
translation:
  language: te
  text: యూదాలో కూడా దేవుని హస్తం వారిమీద ఉండి, యెహోవా మాట ప్రకారం రాజు, అధికారులు ఇచ్చిన ఆజ్ఞను నెరవేర్చడానికి వారికి ఏక హృదయాన్ని[a] ఇచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒకే హృదయాన్ని.’
    reason: לֵב אֶחָד అనే పదబంధానికి మరింత అక్షరార్థ ప్రత్యామ్నాయం; ప్రధాన పాఠంలోని ‘ఏక హృదయం’ దాని ఐక్య సంకల్ప భావాన్ని సహజంగా తెలియజేస్తుంది.
lexical_decisions:
- source_word: גַּם בִּיהוּדָה
  choice: యూదాలో కూడా
  rationale: גַּם యొక్క చేర్పు భావాన్ని, בְּ యొక్క స్థానార్థాన్ని సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: הָיְתָה יַד הָאֱלֹהִים
  choice: దేవుని హస్తం వారిమీద ఉండి
  rationale: దేవుని శక్తివంతమైన కార్యాన్ని సూచించే హీబ్రూ ‘హస్తం’ రూపకాన్ని నిలుపుతూ, తరువాతి ఉద్దేశ్య వాక్యంతో సహజంగా కలుపుతుంది.
- source_word: לָתֵת לָהֶם לֵב אֶחָד
  choice: వారికి ఏక హృదయాన్ని ఇచ్చింది
  rationale: ‘ఒక హృదయం’ అనే మూల రూపకాన్ని గౌరవిస్తూ, ఏకమైన సంకల్పం అనే సందర్భార్థాన్ని ఆధునిక గౌరవప్రద తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַעֲשׂוֹת מִצְוַת
  choice: ఆజ్ఞను నెరవేర్చడానికి
  rationale: ఆజ్ఞకు క్రియాత్మకంగా విధేయత చూపడాన్ని ‘నెరవేర్చడం’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמֶּלֶךְ וְהַשָּׂרִים
  choice: రాజు, అధికారులు ఇచ్చిన
  rationale: Construct సంబంధాన్ని తెలుగులో స్పష్టంగా చేయడానికి ‘ఇచ్చిన’ను పూరించింది; שָּׂרִים కు పరిపాలనా సందర్భంలో ‘అధికారులు’ సహజమైన సమానార్థకం.
- source_word: בִּדְבַר יְהוָה
  choice: యెహోవా మాట ప్రకారం
  rationale: రాజు, అధికారుల ఆజ్ఞ యెహోవా మాటకు అనుగుణంగా ఉందనే భావాన్ని వ్యక్తం చేస్తుంది; సాధనార్థం అని అతిగా నిర్ణయించదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో ప్రతిలిపి చేస్తుంది.
theological_decisions:
- issue: ‘దేవుని హస్తం వారిమీద ఉండడం’లో దైవ కార్య స్వభావం
  choice: ప్రజలకు ఏక హృదయాన్ని ఇచ్చిన దేవుని క్రియాశీల ప్రభావంగా అనువదించడం
  alternative: ‘దేవుడు వారికి సహాయం చేశాడు’ అని బలహీనపరచడం లేదా ‘దేవుడు వారిని ఎదిరించలేని విధంగా బలవంతం చేశాడు’ అని విస్తరించడం
  rationale: మూలపాఠం ప్రజల ఏకమైన స్పందనను దేవుని కార్యానికి ఆపాదిస్తుంది; అయితే ఆ కార్యం ఎలా పనిచేసిందో తరువాతి సిద్ధాంతపరమైన వర్గాలతో నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన బైబిలు శైలి. హీబ్రూ ‘హస్తం,’ ‘హృదయం’ రూపకాలు నిలుపబడ్డాయి; ‘ప్రకారం’ ద్వారా בִּדְבַר లోని అనుగుణత భావం సంరక్షించబడింది.
