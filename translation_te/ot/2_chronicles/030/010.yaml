translation_notes:
  register: సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ప్రామాణిక తెలుగు వాడబడింది. ‘వార్తాహరులు’ అధికారిక సందేశవాహక భావాన్ని ఇస్తుంది; రెండు అవహేళన క్రియలు మరియు వాటి కొనసాగుతున్న క్రియారూపం విడివిడిగా నిలుపబడ్డాయి.
