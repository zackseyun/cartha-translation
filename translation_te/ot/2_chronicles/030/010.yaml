source:
  edition: WLC
  text: וַ/יִּֽהְי֨וּ הָ/רָצִ֜ים עֹבְרִ֨ים מֵ/עִ֧יר לָ/עִ֛יר בְּ/אֶֽרֶץ אֶפְרַ֥יִם וּ/מְנַשֶּׁ֖ה וְ/עַד זְבֻל֑וּן וַ/יִּֽהְיוּ֙ מַשְׂחִיקִ֣ים עֲלֵי/הֶ֔ם וּ/מַלְעִגִ֖ים בָּֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/010.yaml
  text: So the couriers went from city to city in the land of Ephraim and Manasseh[a], as far as Zebulun[b]; but they were laughing at them and mocking them.
translation:
  language: te
  text: అప్పుడు వార్తాహరులు[a] ఎఫ్రాయిము, మనష్షే ప్రాంతాల్లో ఒక పట్టణం నుంచి మరొక పట్టణానికి, జెబూలూను వరకు వెళ్లారు. అయితే అక్కడివారు వారిని హేళనగా నవ్వుతూ, ఎగతాళి చేస్తూ ఉన్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘పరుగువారు’; అంటే సందేశాన్ని వేగంగా తీసుకెళ్లే అధికారిక సందేశకులు.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ పాఠం తృణీకారాన్ని తెలిపే రెండు క్రియలను కలిపి వాడుతుంది: వారు వార్తాహరులను హేళనగా నవ్వుతూ, ఎగతాళి చేస్తూ ఉన్నారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  choice: వార్తాహరులు
  rationale: రוץ (‘పరుగెత్తు’) ధాతువు నుంచి వచ్చిన ఈ పదం, వేగంగా అధికారిక సందేశాన్ని తీసుకెళ్లేవారిని సూచిస్తుంది. ‘వార్తాహరులు’ ఆధునిక తెలుగులో వారి సందేశవాహక పాత్రను సహజంగా తెలియజేస్తుంది; పరుగెత్తే భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: עֹבְרִים
  choice: వెళ్లారు
  rationale: అక్షరార్థంగా ‘దాటుతూ/ప్రయాణిస్తూ ఉన్నారు.’ పట్టణం నుంచి పట్టణానికి సాగిన ప్రయాణాన్ని ‘వెళ్లారు’ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵעִיר לָעִיר
  choice: ఒక పట్టణం నుంచి మరొక పట్టణానికి
  rationale: పునరావృతంగా పట్టణాల మధ్య ప్రయాణించిన పంపిణీ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְּאֶרֶץ אֶפְרַיִם וּמְנַשֶּׁה וְעַד זְבֻלוּן
  choice: ఎఫ్రాయిము, మనష్షే ప్రాంతాల్లో … జెబూలూను వరకూ
  rationale: వార్తాహరుల ప్రయాణ భౌగోళిక పరిధిని నిలుపుతూ, וְעַד లోని ‘వరకూ’ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מַשְׂחִיקִים עֲלֵיהֶם
  choice: వారిని చూసి నవ్వుతూ
  rationale: ఇక్కడ శׂחק సాధారణంగా నవ్వడం కాక, వారిని హేళనగా చూసి నవ్వడాన్ని సూచిస్తుంది. సందర్భంలో అవహేళన భావం సహజంగా స్పష్టమవుతుంది.
- source_word: וּמַלְעִגִים בָּם
  choice: వారిని ఎగతాళి చేస్తూ
  rationale: לעג సూచించే తృణీకారపూర్వక అపహాస్యాన్ని ‘ఎగతాళి’ స్పష్టంగా తెలియజేస్తుంది; ముందున్న నవ్వడం అనే క్రియతో కలసి అవమాన తీవ్రతను నిలుపుతుంది.
- source_word: וַיִּהְיוּ ... וַיִּהְיוּ
  choice: కాబట్టి … అయితే … చేస్తూ ఉన్నారు
  rationale: మొదటి కథన అనుసంధానాన్ని ‘కాబట్టి,’ ప్రతికూల ప్రతిస్పందనను ‘అయితే’ తెలియజేస్తాయి. היה తో కూడిన కృదంత నిర్మాణంలోని కొనసాగుతున్న చర్య భావాన్ని ‘చేస్తూ ఉన్నారు’ నిలుపుతుంది.
