source:
  edition: WLC
  text: כָּל לְבָב֣/וֹ הֵכִ֔ין לִ/דְר֛וֹשׁ הָ/אֱלֹהִ֥ים יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתָ֑י/ו וְ/לֹ֖א כְּ/טָהֳרַ֥ת הַ/קֹּֽדֶשׁ־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/019.yaml
  text: everyone whose heart was set to seek God[a], Yahweh, the God of his fathers, though not according to the purification required for the holy place.
translation:
  language: te
  text: తన హృదయాన్ని తన పితరుల దేవుడైన యెహోవా దేవుణ్ణి వెదకడానికి సిద్ధపరచుకున్న ప్రతి ఒక్కరూ, పవిత్రస్థలానికి అవసరమైన శుద్ధీకరణ నిబంధనకు అనుగుణంగా లేకపోయినా,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పవిత్రమైన దానికి అవసరమైన శుద్ధీకరణ నిబంధనకు అనుగుణంగా.” హీబ్రూ పదం ఇక్కడ ఆరాధనాపరమైన అర్థంలో పవిత్రస్థలాన్ని లేదా దేవాలయాన్ని సూచించవచ్చు.
    reason: కֹדֶשׁ అనే పదానికి సందర్భంలో ‘పవిత్రస్థలం/దేవాలయం’ అనే ఆరాధనాపరమైన అర్థంతో పాటు ‘పవిత్రమైనది’ అనే విస్తృత అర్థం కూడా సాధ్యమే.
lexical_decisions:
- source_word: כָּל לְבָבוֹ
  choice: తన హృదయాన్ని … ప్రతి ఒక్కరూ
  rationale: ఏకవచన నామవాచకం, ప్రత్యయం కలిసిన כָּל ఇక్కడ విభజనార్థకంగా ‘తన హృదయాన్ని … ప్రతి ఒక్కరూ’ అనే భావాన్ని ఇస్తుంది.
- source_word: הֵכִין
  choice: సిద్ధపరచుకున్న
  rationale: כון యొక్క హిఫిల్ రూపం సిద్ధం చేయడం, స్థిరంగా దిశానిర్దేశం చేయడం అనే భావాలను కలిగి ఉంది. దేవుణ్ణి వెదకడానికి ఉద్దేశపూర్వకంగా హృదయాన్ని సిద్ధం చేసుకోవడాన్ని ఈ ఎంపిక సహజంగా తెలియజేస్తుంది.
- source_word: לִדְרוֹשׁ
  choice: వెదకడానికి
  rationale: దేవుడు కర్మగా ఉన్నప్పుడు דרש భక్తితో ఆయనను ఆశ్రయించడం, వెదకడం లేదా ఆయన చిత్తాన్ని తెలుసుకోవడం అనే విస్తృత భావాన్ని కలిగి ఉంది.
- source_word: הָאֱלֹהִים יְהוָה
  choice: దేవుణ్ణి … యెహోవాను
  rationale: యెహోవా అనే నామం వెదకబడుతున్న దేవుడు ఎవరో నిర్దిష్టంగా గుర్తిస్తుంది; రెండు హీబ్రూ అంశాలనూ అనువాదంలో నిలుపుకుంది.
- source_word: אֱלֹהֵי אֲבוֹתָיו
  choice: తన పితరుల దేవుడైన
  rationale: ఏకవచన ప్రత్యయం విభజనార్థక ‘ప్రతి ఒక్కరూ’తో సరిపోతుంది; ‘పితరులు’ పూర్వీకులతోనున్న నిబంధనాత్మక సంబంధాన్ని నిలుపుతుంది.
- source_word: וְלֹא
  choice: …కపోయినా
  rationale: ముందున్న హృదయపూర్వక దేవాన్వేషణకు, తరువాత చెప్పిన ఆచారపరమైన లోపానికి మధ్యనున్న concessive సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כְּטָהֳרַת
  choice: అవసరమైన శుద్ధీకరణ ప్రకారం
  rationale: כְּ అనుగుణతను, טָהֳרָה ఆచారపరమైన శుద్ధీకరణను సూచిస్తాయి. సందర్భంలోని నియమ ప్రమాణాన్ని ‘అవసరమైన’ స్పష్టం చేస్తుంది.
- source_word: הַקֹּדֶשׁ
  choice: పవిత్రస్థలానికి
  rationale: ఆరాధనా సందర్భంలో קֹדֶשׁ పవిత్రస్థలాన్ని లేదా దేవాలయ పవిత్ర పరిధిని సూచించే అవకాశం ఎక్కువ; పదంలోని ‘పవిత్ర’ భావాన్ని కూడా ఈ రూపం నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో నిబంధన దైవనామం ప్రత్యక్షంగా ఉంది; దానిని సాధారణ బిరుదుగా మార్చకుండా తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచింది.
- issue: హృదయపూర్వక దేవాన్వేషణ మరియు ఆచారపరమైన అశుద్ధత మధ్య ఉద్రిక్తత
  choice: హృదయాన్ని సిద్ధపరచుకున్నప్పటికీ అవసరమైన శుద్ధీకరణ పొందలేదనే రెండు అంశాలనూ నిలుపడం
  alternative: ఆచారపరమైన లోపాన్ని తగ్గించడం లేదా హృదయ సిద్ధతను పక్కనపెట్టడం
  rationale: హీబ్రూ వాక్యం నిజమైన దేవాన్వేషణను, శుద్ధీకరణ ప్రమాణానికి అనుగుణంగా లేకపోవడాన్ని పక్కపక్కనే ఉంచుతుంది; అనువాదం ఈ ఉద్రిక్తతను పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఇది ముందరి వచనంలోని ప్రార్థనకు కొనసాగింపు కావడంతో వాక్యం చివర కామాను ఉంచి అసంపూర్ణ వాక్యభాగ స్వభావాన్ని నిలుపుకుంది. పునరుక్తి కొంత ఉన్నప్పటికీ ‘దేవుడు—యెహోవా’ అనే మూలంలోని అన్వయాన్ని స్పష్టంగా ఉంచేందుకు వివరణాత్మక నిర్మాణం వాడబడింది.
