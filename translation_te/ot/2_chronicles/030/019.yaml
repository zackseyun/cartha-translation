  to: తన హృదయాన్ని తన పితరుల దేవుడైన యెహోవా దేవుణ్ణి వెదకడానికి సిద్ధపరచుకున్న ప్రతి ఒక్కరూ, పవిత్రస్థలానికి అవసరమైన శుద్ధీకరణ నిబంధనకు అనుగుణంగా లేకపోయినా,[a]
  rationale: 'The revision removes an interpretive and repetitive explanatory construction, retaining the Hebrew apposition in one Telugu phrase: ‘తన పితరుల దేవుడైన యెహోవా దేవుడు.’ It also replaces ‘శుద్ధి పొందకపోయినా’ with language of nonconformity to the required ritual-purification norm, preserving the wording and the unresolved tension of the source. The trailing comma is retained because this verse continues Hezekiah’s prayer from the preceding verse.'
