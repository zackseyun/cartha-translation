source:
  edition: WLC
  text: וַ/יֵּלְכוּ֩ הָ/רָצִ֨ים בָּֽ/אִגְּר֜וֹת מִ/יַּ֧ד הַ/מֶּ֣לֶךְ וְ/שָׂרָ֗י/ו בְּ/כָל יִשְׂרָאֵל֙ וִֽ/יהוּדָ֔ה וּ/כְ/מִצְוַ֥ת הַ/מֶּ֖לֶךְ לֵ/אמֹ֑ר בְּנֵ֣י יִשְׂרָאֵ֗ל שׁ֚וּבוּ אֶל יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָם֙ יִצְחָ֣ק וְ/יִשְׂרָאֵ֔ל וְ/יָשֹׁב֙ אֶל הַ/פְּלֵיטָ֔ה הַ/נִּשְׁאֶ֣רֶת לָ/כֶ֔ם מִ/כַּ֖ף מַלְכֵ֥י אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/006.yaml
  text: So the couriers went with the letters from the hand of the king and his officials throughout all Israel and Judah[a], according to the command of the king, saying, “Sons of Israel, return to Yahweh, the God of Abraham, Isaac, and Israel[b], that he may return to the remnant that has escaped and remains to you from the hand of the kings of Assyria.”
translation:
  language: te
  text: 'రాజు మరియు అతని అధికారుల నుండి వచ్చిన ఉత్తరాలతో దూతలు ఇశ్రాయేలు, యూదా అంతటా వెళ్లారు. రాజు ఆజ్ఞ ప్రకారం వారు ఇలా చెప్పారు: “ఇశ్రాయేలు కుమారులారా, అబ్రాహాము, ఇస్సాకు, ఇశ్రాయేలు[a] దేవుడైన యాహ్వే వైపు తిరిగి రండి. అప్పుడు ఆయన అష్షూరు రాజుల చేతిలోనుండి తప్పించుకుని మీకు మిగిలి ఉన్న శేషం[b] వైపు తిరుగుతాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో సుపరిచితమైన ‘యాకోబు’కు బదులు ‘ఇశ్రాయేలు’ అని ఉంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, “మీ కోసం మిగిలిన తప్పించుకున్న శేషం.”
    reason: alternative_rendering
lexical_decisions:
- source_word: הָרָצִים
  choice: దూతలు
  rationale: పదశః ‘పరుగెత్తేవారు’; రాజ ఉత్తరాలను తీసుకెళ్లే పరిపాలనా సందర్భంలో సహజమైన ఆధునిక తెలుగు పదం ‘దూతలు’.
- source_word: בָּאִגְּרוֹת
  choice: ఉత్తరాలను తీసుకొని
  rationale: אִגְּרוֹת అంటే రాతపూర్వక ఉత్తరాలు లేదా రాజప్రకటనలు. ב అనే ఉపసర్గ ఇక్కడ వాటిని వెంట తీసుకెళ్లడాన్ని సూచిస్తుంది.
- source_word: מִיַּד הַמֶּלֶךְ וְשָׂרָיו
  choice: రాజు, అతని అధికారుల చేతినుండి వచ్చిన
  rationale: ‘చేతినుండి’ అనే హీబ్రూ నుడికారాన్ని నిలుపుతూ ప్రత్యక్ష రాజాధికారాన్ని వ్యక్తం చేస్తుంది; שָׂרָיוకు ఈ పరిపాలనా సందర్భంలో ‘అతని అధికారులు’ సరిపోతుంది.
- source_word: בְּכָל יִשְׂרָאֵל וִיהוּדָה
  choice: ఇశ్రాయేలు, యూదా దేశాలన్నిటా
  rationale: దూతలు రెండు ప్రాంతాలన్నిటిలో సంచరించారని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וּכְמִצְוַת הַמֶּלֶךְ
  choice: రాజు ఆజ్ఞ ప్రకారం
  rationale: ఇక్కడ מִצְוָה దైవిక ఆజ్ఞ కాక రాజు జారీ చేసిన ఆదేశం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులారా
  rationale: హీబ్రూలోని పుంలింగ బహువచన రూపాన్ని ప్రత్యక్షంగా నిలుపుతుంది; సమాజమంతటినీ ఉద్దేశించిన సంప్రదాయ సంబోధనగా కూడా అర్థమవుతుంది.
- source_word: שׁוּבוּ אֶל יְהוָה
  choice: యాహ్వే వైపు తిరిగి రండి
  rationale: שׁוּבలో పశ్చాత్తాపంతో తిరగడం, సంబంధంలోకి తిరిగి రావడం అనే రెండు భావాలూ ఉన్నాయి; ‘వైపు తిరిగి రండి’ వాటిని సహజంగా మోస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל
  choice: అబ్రాహాము, ఇస్సాకు, ఇశ్రాయేలు దేవుడు
  rationale: మూలపాఠంలో సుపరిచితమైన ‘యాకోబు’ కాక ‘ఇశ్రాయేలు’ ఉంది; దానిని యథాతథంగా నిలిపింది.
- source_word: וְיָשֹׁב
  choice: అప్పుడు … ఆయన తిరుగుతాడు
  rationale: ఆజ్ఞ తరువాత వచ్చే క్రియను దానికి అనుసరించే ఫలితంగా వ్యక్తం చేస్తూ, ముందున్న మానవ ‘తిరుగుదల’కు దేవుని ‘తిరుగుదల’ ప్రతిస్పందనగా ఉన్న పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: הַפְּלֵיטָה הַנִּשְׁאֶרֶת לָכֶם
  choice: తప్పించుకొని మీకు మిగిలి ఉన్న శేషం
  rationale: פלטలోని తప్పించుకొని బతికిన భావాన్నీ, שׁארలోని మిగిలి ఉన్న భావాన్నీ ఒకే సహజమైన పదబంధంలో నిలుపుతుంది.
- source_word: מִכַּף מַלְכֵי אַשּׁוּר
  choice: అష్షూరు రాజుల చేతినుండి
  rationale: כף అనే ‘చేతి/అధికారం’ నుడికారాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో వ్యక్తిగత నామం ప్రత్యక్షంగా ఉంది; దానిని సాధారణ బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలభాషకు దగ్గరగా ఉంటుంది.
- issue: పితృపురుషుల వరుసలో ‘ఇశ్రాయేలు’ను ‘యాకోబు’గా సమన్వయపరచాలా
  choice: అబ్రాహాము, ఇస్సాకు, ఇశ్రాయేలు దేవుడు
  alternative: అబ్రాహాము, ఇస్సాకు, యాకోబు దేవుడు
  rationale: ఈ వచనంలోని హీబ్రూ పాఠం స్పష్టంగా יִשְׂרָאֵל (‘ఇశ్రాయేలు’) అని చదువుతుంది; సుపరిచిత సూత్రానికి అనుగుణంగా దానిని మార్చలేదు.
- issue: וְיָשֹׁבలోని దేవుని ప్రతిస్పందనను ఎలా వ్యక్తం చేయాలి
  choice: అప్పుడు … ఆయన తిరుగుతాడు
  alternative: ఆయన తిరిగేలా / ఆయన తిరిగి రావచ్చు
  rationale: ఆజ్ఞకు అనుసరించే ఫలిత/ఉద్దేశ భావాన్ని తెలుగులో సహజంగా చూపుతూ, ‘మీరు తిరగండి—ఆయన తిరుగుతాడు’ అనే మూలంలోని పరస్పర పదప్రయోగాన్ని నిలుపుతుంది; ‘రావచ్చు’ అనేది అనిశ్చితి లేదా అనుమతి భావాన్ని అనవసరంగా కలిగించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, బహిరంగ రాజప్రకటనకు తగిన శైలి ఉపయోగించబడింది. ‘ఇశ్రాయేలు కుమారులారా’ మూలంలోని రూపాన్ని నిలుపుతుంది; మిగతా వాక్య నిర్మాణం సాధారణ పాఠకులకు సులభంగా ఉండేలా విభజించబడింది.
