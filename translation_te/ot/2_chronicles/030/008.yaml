  terminology: “యెహోవా,” “పరిశుద్ధ స్థలం,” “ప్రతిష్ఠించిన,” “సేవించండి,” and “మండే కోపం” are consistent, appropriate renderings. The footnotes are correctly anchored and accurately state the lexical and grammatical alternatives. The Hebrew source explicitly contains עַתָּה, so retaining “ఇప్పుడు” is correct notwithstanding the conflicting English audit-trail cleanup note.
