  variant: modern standard Telugu
source:
  edition: WLC
  text: עַתָּ֕ה אַל תַּקְשׁ֥וּ עָרְפְּ/כֶ֖ם כַּ/אֲבוֹתֵי/כֶ֑ם תְּנוּ יָ֣ד לַ/יהוָ֗ה וּ/בֹ֤אוּ לְ/מִקְדָּשׁ/וֹ֙ אֲשֶׁ֣ר הִקְדִּ֣ישׁ לְ/עוֹלָ֔ם וְ/עִבְדוּ֙ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֔ם וְ/יָשֹׁ֥ב מִ/כֶּ֖ם חֲר֥וֹן אַפּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/008.yaml
  text: Do not stiffen your neck as your fathers did[a]. Give your hand to Yahweh, and come to his sanctuary, which he has consecrated forever, and serve Yahweh your God[b], so that his burning anger may turn away from you.
translation:
  language: te
  text: ఇప్పుడు మీ పితరులవలె మీ మెడను బిగించుకోకండి. యెహోవాకు మీ చెయ్యి ఇవ్వండి[a]. ఆయన శాశ్వతంగా ప్రతిష్ఠించిన పరిశుద్ధ స్థలానికి వచ్చి, మీ దేవుడైన యెహోవాను సేవించండి. అప్పుడు ఆయన మండే కోపం మీ మీదనుండి తొలగిపోవచ్చు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యెహోవాకు లోబడండి,” “యెహోవాకు మిమ్మల్ని మీరు అప్పగించుకోండి.” హీబ్రూలో అక్షరార్థంగా “యెహోవాకు చెయ్యి ఇవ్వండి” అని ఉంది; ఇది లొంగుబాటు లేదా విధేయతకు ప్రతిజ్ఞను సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అప్పుడు ఆయన మండే కోపం మీ మీదనుండి తొలగిపోతుంది.”
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: మూల హీబ్రూలో స్పష్టమైన కాలసూచక పదం ఉంది; అందువల్ల దానిని ప్రధాన పాఠ్యంలో నిలుపుకున్నాం.
- source_word: תַּקְשׁוּ עָרְפְּכֶם
  choice: మీ మెడను బిగించుకోకండి
  rationale: మొండిగా ఎదిరించడాన్ని సూచించే హీబ్రూ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: כַּאֲבוֹתֵיכֶם
  choice: మీ పితరులవలె
  rationale: మునుపటి తరాల ప్రవర్తనతో ఉన్న పోలికను నేరుగా వ్యక్తం చేస్తుంది.
- source_word: תְּנוּ יָד לַיהוָה
  choice: యెహోవాకు మీ చెయ్యి ఇవ్వండి
  rationale: లొంగుబాటు లేదా విధేయతకు ప్రతిజ్ఞ చేయడాన్ని సూచించే మూలభాషా నుడికారంలోని స్పష్టమైన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, భావాన్ని పాదసూచికలో వివరించాం.
- source_word: מִקְדָּשׁוֹ
  choice: ఆయన పరిశుద్ధ స్థలం
  rationale: ఈ పదం పరిశుద్ధ స్థలం లేదా పవిత్రాలయాన్ని సూచిస్తుంది; ‘పరిశుద్ధ స్థలం’ మూలపదం పరిధిని అనవసరంగా కుదించదు.
- source_word: הִקְדִּישׁ לְעוֹלָם
  choice: శాశ్వతంగా ప్రతిష్ఠించిన
  rationale: దేవుని సేవ కోసం పవిత్రంగా ప్రత్యేకపరచడమనే ఆరాధన సంబంధ భావాన్ని ‘ప్రతిష్ఠించిన’ తెలియజేస్తుంది; לְעוֹלָם ను ‘శాశ్వతంగా’ అని అనువదించాం.
- source_word: וְעִבְדוּ
  choice: సేవించండి
  rationale: దేవుని పట్ల ఆరాధనతో కూడిన సేవను సూచించే עבד అనే క్రియకు ఇది నేరమైన, విస్తృతార్థాన్ని నిలిపే అనువాదం.
- source_word: וְיָשֹׁב מִכֶּם
  choice: అప్పుడు ... మీ మీదనుండి తొలగిపోవచ్చు
  rationale: ఆజ్ఞల తరువాత వచ్చే ఈ క్రియ ఆశించబడిన ఫలితాన్ని సూచించగలదు; ‘తొలగిపోవచ్చు’ ఆ భావాన్ని కఠినమైన హామీగా మార్చకుండా ఉంచుతుంది.
- source_word: חֲרוֹן אַפּוֹ
  choice: ఆయన మండే కోపం
  rationale: తీవ్రమైన కోపాన్ని వేడితో చిత్రించే హీబ్రూ నుడికారాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: תְּנוּ יָד לַיהוָה అనే నుడికారం
  choice: యెహోవాకు మీ చెయ్యి ఇవ్వండి
  alternative: యెహోవాకు లోబడండి; యెహోవాకు మిమ్మల్ని మీరు అప్పగించుకోండి
  rationale: ఈ మాట లొంగుబాటు లేదా విధేయతకు ప్రతిజ్ఞను సూచించినా, మూలంలోని ముఖ్యమైన దృశ్యరూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి దాని భావాన్ని పాదసూచికలో ఇచ్చాం.
- issue: וְיָשֹׁב క్రియ యొక్క భావబలం
  choice: అప్పుడు ఆయన మండే కోపం మీ మీదనుండి తొలగిపోవచ్చు
  alternative: అప్పుడు ఆయన మండే కోపం మీ మీదనుండి తొలగిపోతుంది
  rationale: ఆజ్ఞల వరుస తరువాత ఇది ఉద్దేశించిన లేదా ఆశించబడిన ఫలితాన్ని సూచించవచ్చు. సంభావన రూపం మూలంలోని భావ ఉద్రిక్తతను యాంత్రికమైన హామీగా పరిష్కరించకుండా కాపాడుతుంది.
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగు పాఠకులకు సుపరిచితమైన పేరురూపంలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలిని వాడాం. హీబ్రూ మెడ-రూపకాన్ని, చెయ్యి ఇవ్వడం అనే నుడికారాన్ని నిలిపాం; రెండవదాని భావాన్ని పాదసూచికలో స్పష్టం చేశాం. మూలంలోని עַתָּה కారణంగా ‘ఇప్పుడు’ను ఉంచాం.
