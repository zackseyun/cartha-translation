id: 2CH.36.16
reference: 2 Chronicles 36:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּֽהְי֤וּ מַלְעִבִים֙ בְּ/מַלְאֲכֵ֣י הָ/אֱלֹהִ֔ים וּ/בוֹזִ֣ים דְּבָרָ֔י/ו וּ/מִֽתַּעְתְּעִ֖ים בִּ/נְבִאָ֑י/ו עַ֠ד עֲל֧וֹת חֲמַת יְהוָ֛ה בְּ/עַמּ֖/וֹ עַד לְ/אֵ֥ין מַרְפֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/016.yaml
  text: But they kept mocking the messengers of God[a], despising his words, and scoffing at his prophets, until the wrath of Yahweh rose against his people[b], until there was no remedy.
translation:
  language: te
  text: అయితే వారు దేవుని దూతలను[a] ఎగతాళి చేస్తూ, ఆయన మాటలను తృణీకరిస్తూ, ఆయన ప్రవక్తలను అపహసిస్తూ వచ్చారు. చివరకు యాహ్వే ఉగ్రకోపం ఆయన ప్రజలపైకి రేగింది; ఇక స్వస్థతకు అవకాశం లేకపోయింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని దేవదూతలను.” అయితే తరువాత “ఆయన ప్రవక్తలు” అని రావడం వల్ల, ఇక్కడ దేవుడు పంపిన మానవ దూతలే ఉద్దేశించబడ్డారని సందర్భం బలంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “స్వస్థత లేదు”; లేదా, “నివారణ లేదు,” “నయం చేయలేని స్థితి వచ్చింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: చేస్తూ వచ్చారు
  rationale: తరువాత వచ్చే వర్తమాన కృదంతాలతో కలిసి గతంలో కొనసాగిన లేదా పదేపదే జరిగిన ప్రవర్తనను సూచిస్తుంది.
- source_word: מַלְעִבִים
  choice: ఎగతాళి చేస్తూ
  rationale: అవమానంతో హేళన చేయడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּמַלְאֲכֵי הָאֱלֹהִים
  choice: దేవుని దూతలను
  rationale: מַלְאָךְ అనే పదానికి దూత లేదా దేవదూత అనే అర్థాలు ఉండవచ్చు; సమాంతరంగా ప్రవక్తలు ప్రస్తావించబడడం వల్ల ఇక్కడ మానవ సందేశవాహకులు ఉద్దేశించబడ్డారు.
- source_word: וּבוֹזִים דְּבָרָיו
  choice: ఆయన మాటలను తృణీకరిస్తూ
  rationale: దేవుని పలుకులను అవహేళనతో తిరస్కరించే భావాన్ని నిలుపుతుంది.
- source_word: וּמִתַּעְתְּעִים בִּנְבִיאָיו
  choice: ఆయన ప్రవక్తలను అపహసిస్తూ
  rationale: మొదటి క్రియతో భావసామ్యం ఉన్నప్పటికీ పదవైవిధ్యంతో తీవ్రమవుతున్న హేళనను చూపుతుంది.
- source_word: עַד עֲלוֹת חֲמַת יְהוָה
  choice: చివరకు యెహోవా ఉగ్రకోపం ... వచ్చింది
  rationale: עַד עֲלוֹת సూచించే పరాకాష్ఠను సహజ తెలుగులో ‘చివరకు ... వచ్చింది’గా వ్యక్తం చేసింది; חֵמָה యొక్క తీవ్రమైన కోపభావాన్ని ‘ఉగ్రకోపం’ నిలుపుతుంది.
- source_word: בְּעַמּוֹ
  choice: ఆయన ప్రజలమీదికి
  rationale: ఈ సందర్భంలో కోపం తీర్పుగా ప్రజలపైకి రావడాన్ని సూచిస్తుంది.
- source_word: עַד לְאֵין מַרְפֵּא
  choice: ఇక పరిహారమే లేకపోయింది
  rationale: మర్పే అనే పదంలోని చికిత్స లేదా నివారణ భావాన్ని తీర్పు సందర్భంలో సహజంగా వ్యక్తం చేస్తూ అంతిమతను నిలుపుతుంది.
theological_decisions:
- issue: ‘దేవుని దూతలు’ ఎవరిని సూచిస్తుంది?
  choice: దేవుని మానవ సందేశవాహకులు, ముఖ్యంగా ప్రవక్తలు
  alternative: దేవదూతలు
  rationale: వెంటనే ‘ఆయన ప్రవక్తలు’ అని సమాంతరంగా రావడం వల్ల చారిత్రక సందర్భంలో దేవుని సందేశాన్ని తెచ్చిన మానవ దూతలే ఉద్దేశించబడ్డారు; అయినా మూలపదంలోని నిఘంటు ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో ఉంచింది.
- issue: עַד לְאֵין מַרְפֵּא యొక్క రూపకం
  choice: ఇక పరిహారమే లేకపోయింది
  alternative: స్వస్థత లేకపోయింది / నయం చేయలేని స్థితి వచ్చింది
  rationale: తీర్పు తిరుగులేని స్థితికి చేరిందనే భావాన్ని నిలుపుతూ, ‘స్వస్థత’ అనే మూలరూపకానికి ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలిని వాడాం. వరుసగా ఉన్న మూడు కృదంతాల కొనసాగింపు భావాన్ని ‘ఎగతాళి చేస్తూ, తృణీకరిస్తూ, అపహసిస్తూ వచ్చారు’ అనే సమాంతర నిర్మాణంతో నిలిపాం; చివరి రెండు עַד ప్రయోగాల పరాకాష్ఠను రెండు స్వతంత్ర వాక్యభాగాలతో స్పష్టంగా వ్యక్తం చేశాం.
