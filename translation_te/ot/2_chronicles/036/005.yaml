id: 2CH.36.5
reference: 2 Chronicles 36:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ יְהוֹיָקִ֣ים בְּ/מָלְכ֔/וֹ וְ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וַ/יַּ֣עַשׂ הָ/רַ֔ע בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/005.yaml
  text: Jehoiakim was twenty-five years old when he became king, and he reigned eleven years in Jerusalem. He did what was evil in the eyes of Yahweh his God.
translation:
  language: te
  text: యెహోయాకీము రాజైనప్పుడు అతనికి ఇరవై ఐదు సంవత్సరాలు. అతడు యెరూషలేములో పదకొండు సంవత్సరాలు పరిపాలించాడు. అతడు తన దేవుడైన యాహ్వే దృష్టిలో చెడును చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: అతనికి ఇరవై ఐదు సంవత్సరాలు
  rationale: హీబ్రూ వయస్సు తెలిపే నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יְהוֹיָקִים
  choice: యెహోయాకీము
  rationale: తెలుగు బైబిల్ వాడుకకు అనుగుణంగా వ్యక్తి పేరును లిప్యంతరీకరించింది.
- source_word: בְּמָלְכוֹ
  choice: రాజైనప్పుడు
  rationale: ב ఉపసర్గతో కూడిన రూపం అతడు రాజ్యాధికారంలోకి వచ్చిన సమయాన్ని సూచిస్తుంది; ఈ భావాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְאַחַת עֶשְׂרֵה שָׁנָה מָלַךְ
  choice: పదకొండు సంవత్సరాలు పరిపాలించాడు
  rationale: מָלַךְ అంటే రాజుగా ఉండడం లేదా పరిపాలించడం; సందర్భంలో ‘పరిపాలించాడు’ స్పష్టంగా ఉంటుంది.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: పరిపాలన జరిగిన స్థలాన్ని సూచించే సరళమైన స్థానవాచక పదబంధం.
- source_word: וַיַּעַשׂ הָרַע
  choice: చెడైనది చేశాడు
  rationale: మూలంలోని క్రియాత్మక భావాన్నీ నైతిక మూల్యాంకనాన్నీ కాపాడుతుంది.
- source_word: בְּעֵינֵי
  choice: దృష్టిలో
  rationale: ఎవరి మూల్యాంకనం ప్రకారం అనే హీబ్రూ నుడికార భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన రూపంలో లిప్యంతరీకరిస్తుంది.
- source_word: אֱלֹהָיו
  choice: తన దేవుడైన
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయాన్ని యెహోయాకీముతో అనుసంధానించి, యెహోవా అతని దేవుడనే సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో ఉంచడం పాఠకులకు సహజంగా ఉండి మూలంలోని నామాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన చారిత్రక వచనశైలి. మూలంలోని మూడు వాక్యాంశాల క్రమం, రాజ్యకాల సమాచారం, దైవిక మూల్యాంకనం నిలుపబడ్డాయి.
