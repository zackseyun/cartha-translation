source:
  edition: WLC
  text: גַּ֠ם כָּל שָׂרֵ֨י הַ/כֹּהֲנִ֤ים וְ/הָ/עָם֙ הִרְבּ֣וּ לִ/מְעָול מַ֔עַל כְּ/כֹ֖ל תֹּעֲב֣וֹת הַ/גּוֹיִ֑ם וַֽ/יְטַמְּאוּ֙ אֶת בֵּ֣ית יְהוָ֔ה אֲשֶׁ֥ר הִקְדִּ֖ישׁ בִּ/ירוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/014.yaml
  text: Also all the leaders of the priests and the people increased in unfaithfulness[a], according to all the abominations of the nations, and they defiled the house of Yahweh[b], which he had consecrated in Jerusalem.
translation:
  language: te
  text: యాజకులకూ ప్రజలకూ నాయకులైన వారందరూ కూడా ఇతర జనాంగాల హేయకార్యాలన్నిటిని అనుసరిస్తూ నమ్మకద్రోహం చేయడంలో మరింత ఎక్కువయ్యారు[a]. వారు యెరూషలేములో ఆయన ప్రతిష్ఠించిన యెహోవా మందిరాన్ని అపవిత్రం చేశారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇతర జనాంగాల హేయకార్యాలన్నిటికి అనుగుణంగా నమ్మకద్రోహాన్ని విస్తారంగా చేశారు.”
    reason: הִרְבּוּ לִמְעָול מַעַל లోని క్రియాతీవ్రతను, అలాగే כְּכֹל లోని పోలిక లేదా అనుగుణతను మరో విధంగా వ్యక్తపరుస్తుంది.
  - marker: b
    text: “యెహోవా” అనేది יהוה (YHWH) అనే దైవనామానికి తెలుగు రూపం.
    reason: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించిన విధానాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: גַּם
  choice: కూడా
  rationale: ముందటి సందర్భానికి కొనసాగింపును, అదనపు తీవ్రతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כָּל שָׂרֵי הַכֹּהֲנִים וְהָעָם
  choice: యాజకుల నాయకులందరూ, ప్రజలూ
  rationale: שָׂרֵי అనే పదాన్ని యాజకుల వర్గమంతటిగా కాక వారి నాయకులుగా చూపుతూ హీబ్రూ నిర్మాణాన్ని నిలుపుతుంది.
- source_word: הִרְבּוּ לִמְעָול מַעַל
  choice: మరింత ద్రోహంగా ప్రవర్తించారు
  rationale: హిఫీల్ క్రియతో సమానమూల నామవాచకం కలిగించే తీవ్రతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; దేవునిపట్ల విశ్వాసభంగం అనే భావాన్ని కూడా నిలుపుతుంది.
- source_word: כְּכֹל תֹּעֲבוֹת הַגּוֹיִם
  choice: జనాల అసహ్యకార్యాలన్నిటికి అనుగుణంగా
  rationale: כְּ పోలిక లేదా అనుగుణత అనే రెండు దగ్గరి భావాలను కలిగిస్తుంది; ఇక్కడ వారి ప్రవర్తన ఇతర జనాల హేయ ఆచారాలకు సరిపోయిందనే భావం వస్తుంది.
- source_word: וַיְטַמְּאוּ
  choice: అపవిత్రం చేశారు
  rationale: మందిర సందర్భంలో ఆచారపరమైన, నైతికమైన కలుషితాన్ని తెలియజేసే సహజమైన పదబంధం.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: బֵּית అక్షరార్థంగా ‘ఇల్లు’ అయినప్పటికీ ఈ సందర్భంలో ‘మందిరం’ సాధారణ పాఠకునికి స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: אֲשֶׁר הִקְדִּישׁ בִּירוּשָׁלִָם
  choice: యెరూషలేములో యెహోవా ప్రతిష్ఠించిన
  rationale: మందిరాన్ని దేవుడు పవిత్ర ఉపయోగం కోసం ప్రత్యేకపరిచాడనే ఆరాధనా సంబంధ భావాన్ని ‘ప్రతిష్ఠించిన’ స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: מָעַל సూచించే నిబంధనాత్మక, ఆరాధనాపరమైన విశ్వాసభంగం
  choice: ద్రోహంగా ప్రవర్తించారు
  alternative: విశ్వాసఘాతుకాన్ని విస్తరించారు; అపరాధం చేశారు
  rationale: ‘ద్రోహం’ దేవునిపట్ల నమ్మకభంగాన్ని బలంగా తెలియజేస్తుంది; దాన్ని కేవలం న్యాయపరమైన అపరాధంగా పరిమితం చేయదు.
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉన్నందున దానిని బిరుదుగా మార్చకుండా, తెలుగు పాఠకులకు సుపరిచితమైన రూపంలో ఉంచాం.
- issue: అపవిత్రం చేయబడిన స్థలానికి సంబంధించిన సర్వనామ సంబంధం
  choice: ఆయన మందిరాన్ని
  alternative: మందిరాన్ని
  rationale: హీబ్రూలో ‘యెహోవా మందిరం’ స్పష్టంగా ఉంది. తెలుగులో పునరుక్తిని తగ్గిస్తూ యాజమాన్య సంబంధాన్ని నిలుపడానికి ‘ఆయన’ చేర్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘అసహ్యకార్యాలు,’ ‘అపవిత్రం,’ ‘ప్రతిష్ఠించిన’ అనే పదాలు మూలంలోని నైతిక-ఆరాధనాపరమైన బరువును నిలుపుతాయి; అతి ప్రాచీన లేదా మతశాఖాపరమైన పదజాలాన్ని నివారించాం.
