revisions:
- from: యాజకుల నాయకులందరూ, ప్రజలూ కూడా జనాల అసహ్యకార్యాలన్నిటికి అనుగుణంగా మరింత ద్రోహంగా ప్రవర్తించారు[a]. యెరూషలేములో యెహోవా[b] ప్రతిష్ఠించిన ఆయన మందిరాన్ని అపవిత్రం చేశారు.
  to: యాజకులకూ ప్రజలకూ నాయకులైన వారందరూ కూడా ఇతర జనాంగాల హేయకార్యాలన్నిటిని అనుసరిస్తూ నమ్మకద్రోహం చేయడంలో మరింత ఎక్కువయ్యారు[a]. వారు యెరూషలేములో ఆయన ప్రతిష్ఠించిన యెహోవా మందిరాన్ని అపవిత్రం చేశారు[b].
  rationale: The revision corrects the syntactic scope of the opening Hebrew noun phrase, more fully represents the intensified covenantal unfaithfulness, and uses more precise modern Telugu for the nations’ detestable practices. It preserves the verse’s sequence, temple-defilement language, divine name, and the relative clause identifying the temple as the one Yahweh consecrated in Jerusalem.
