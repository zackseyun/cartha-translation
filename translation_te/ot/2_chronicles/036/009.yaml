  text: בֶּן שְׁמוֹנֶ֤ה שָׁנִים֙ יְהוֹיָכִ֣ין בְּ/מָלְכ֔/וֹ וּ/שְׁלֹשָׁ֤ה חֳדָשִׁים֙ וַ/עֲשֶׂ֣רֶת יָמִ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/009.yaml
  text: Jehoiachin was eight years old when he began to reign[a], and he reigned three months and ten days in Jerusalem. He did what was evil in the sight of Yahweh.
translation:
  language: te
  text: యెహోయాకీను రాజైనప్పుడు ఎనిమిదేళ్లవాడు[a]. అతడు యెరూషలేములో మూడు నెలలు పది రోజులు పరిపాలించాడు. అతడు యెహ్వే దృష్టిలో చెడును చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2 రాజులు 24:8లో ‘ఎనిమిదేళ్లు’కు బదులుగా ‘పద్దెనిమిదేళ్లు’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן שְׁמוֹנֶה שָׁנִים
  choice: ఎనిమిదేళ్లవాడు
  rationale: హీబ్రూ వయస్సు సూచించే నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוֹיָכִין
  choice: యెహోయాకీను
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: בְּמָלְכוֹ
  choice: రాజైనప్పుడు
  rationale: సింహాసనారోహణ సమయాన్ని సూచించే హీబ్రూ నిర్మాణాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים וַעֲשֶׂרֶת יָמִים
  choice: మూడు నెలల పది రోజులు
  rationale: పరిపాలన కాలవ్యవధిని నేరుగా, సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: מָלַךְ
  choice: పరిపాలించాడు
  rationale: రాజుగా పాలించడాన్ని తెలిపే מלך క్రియకు సందర్భోచితమైన తెలుగు రూపం.
- source_word: בִּירוּשָׁלָם
  choice: యెరూషలేములో
  rationale: స్థలార్థక విభక్తిని సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּעַשׂ הָרַע
  choice: చెడ్డదైనది చేశాడు
  rationale: దైవిక నైతిక మూల్యాంకనాన్ని సూచించే హీబ్రూ నుడికారాన్ని దాని బలాన్ని తగ్గించకుండా అందిస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహ్వే దృష్టికి
  rationale: అక్షరార్థంలోని ‘కళ్లలో’ అనే రూపాన్ని కృత్రిమంగా చేయకుండా, దేవుని మూల్యాంకనం అనే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరిస్తుంది.
