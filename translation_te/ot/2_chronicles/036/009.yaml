  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన రాజవృత్తాంత శైలి వాడబడింది. హీబ్రూ వాక్యక్రమాన్ని బలవంతంగా అనుకరించకుండా భావం, కాలవ్యవధి, దైవిక మూల్యాంకనం స్పష్టంగా నిలుపబడ్డాయి.
