source:
  edition: WLC
  text: וַֽ/יִּשְׂרְפוּ֙ אֶת בֵּ֣ית הָ/אֱלֹהִ֔ים וַֽ/יְנַתְּצ֔וּ אֵ֖ת חוֹמַ֣ת יְרוּשָׁלִָ֑ם וְ/כָל אַרְמְנוֹתֶ֨י/הָ֙ שָׂרְפ֣וּ בָ/אֵ֔שׁ וְ/כָל כְּלֵ֥י מַחֲמַדֶּ֖י/הָ לְ/הַשְׁחִֽית־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/019.yaml
  text: They burned the house of God[a], tore down the wall of Jerusalem, burned all its palaces with fire[b], and destroyed all its precious vessels.
translation:
  language: te
  text: వారు దేవుని మందిరాన్ని[a] తగులబెట్టి, యెరూషలేము ప్రాకారాన్ని పడగొట్టారు. దాని రాజభవనాలన్నిటినీ అగ్నితో కాల్చివేసి, దాని విలువైన వస్తువులన్నిటినీ[b] నాశనం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘దేవుని ఇల్లు’; ఇది దేవాలయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘విలువైన సామగ్రినంతటినీ’ లేదా ‘అమూల్యమైన పాత్రలన్నిటినీ’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרְפוּ
  choice: వారు ... తగులబెట్టి
  rationale: שׂרף అనే క్రియకు ‘కాల్చు/తగులబెట్టు’ అనే ప్రత్యక్ష అర్థం ఉంది. 3వ పురుష బహువచన కర్తను తెలుగులో ‘వారు’గా స్పష్టపరిచాం; వరుసగా జరిగిన చర్యలను సహజంగా కలపడానికి అసమాపక క్రియను వాడాం.
- source_word: בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరం
  rationale: హీబ్రూలో అక్షరార్థంగా ‘దేవుని ఇల్లు.’ సందర్భంలో ఇది దేవాలయాన్ని సూచిస్తుంది. ‘మందిరం’ మూలంలోని ‘ఇల్లు/నివాసం’ భావాన్ని కొంత నిలుపుతూ ఆధునిక తెలుగులో పవిత్ర కట్టడాన్ని సహజంగా సూచిస్తుంది.
- source_word: וַיְנַתְּצוּ
  choice: పడగొట్టారు
  rationale: נתץ అనేది కట్టడాన్ని కూల్చడం లేదా పడగొట్టడం. ప్రాకారానికి ‘పడగొట్టారు’ సహజమైన, స్పష్టమైన తెలుగు.
- source_word: חוֹמַת יְרוּשָׁלִָם
  choice: యెరూషలేము ప్రాకారం
  rationale: హీబ్రూ ఏకవచన నిర్మాణాన్ని నిలుపుతూ, నగరాన్ని చుట్టిన రక్షణ గోడను ‘ప్రాకారం’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַרְמְנוֹתֶיהָ
  choice: దాని రాజభవనాలు
  rationale: אַרְמוֹן రాజభవనం లేదా కోటలాంటి గొప్ప భవనాన్ని సూచించగలదు. ఈ నగర విధ్వంస సందర్భంలో ‘రాజభవనాలు’ సాధారణంగా సరిపడే అర్థం. ‘దాని’ యెరూషలేమును సూచిస్తుంది.
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: అగ్నితో కాల్చివేసి
  rationale: మూలంలో ‘అగ్నితో’ అని స్పష్టంగా ఉన్నందున దాన్ని నిలిపాం. ‘కాల్చివేసి’ సంపూర్ణ విధ్వంసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כְּלֵי מַחֲמַדֶּיהָ
  choice: దాని విలువైన వస్తువులన్నీ
  rationale: כְּלִי పాత్రలు, పరికరాలు, సామగ్రి లేదా వస్తువులు అనే విస్తృతార్థ పదం; מַחֲמַד విలువైనది లేదా కోరదగినది. సందర్భాన్ని అనవసరంగా దేవాలయ పాత్రలకే పరిమితం చేయకుండా ‘విలువైన వస్తువులు’ అనే విస్తృత పదబంధాన్ని ఎంచుకున్నాం.
- source_word: לְהַשְׁחִית
  choice: నాశనం చేశారు
  rationale: ఈ హిఫీల్ క్రియారూపం నాశనం చేయడం లేదా పాడుచేయడం అనే భావం ఇస్తుంది. హీబ్రూ ఉద్దేశ్య/ఫలిత infinitive నిర్మాణాన్ని సహజమైన తెలుగు సమాపక క్రియగా వ్యక్తం చేశాం.
