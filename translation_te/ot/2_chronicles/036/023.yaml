revisions:
- from: '“పారసీక రాజు కోరెషు ఇలా ప్రకటిస్తున్నాడు: ‘పరలోక దేవుడైన యాహ్వే భూమిమీద ఉన్న రాజ్యాలన్నిటినీ నాకు ఇచ్చాడు. యూదాలోని యెరూషలేములో తన కోసం ఒక మందిరాన్ని నిర్మించమని ఆయన నాకు బాధ్యత అప్పగించాడు. మీలో ఆయన ప్రజలకు చెందినవాడు ఎవరైనా ఉంటే[a], అతని దేవుడైన యాహ్వే అతనికి తోడుగా ఉండుగాక[b]. అతడు యెరూషలేముకు ఎక్కి వెళ్లుగాక[c].’”'
  to: '“పారసీక రాజు కోరెషు ఇలా ప్రకటిస్తున్నాడు: పరలోక దేవుడైన యాహ్వే భూమిమీద ఉన్న రాజ్యాలన్నిటినీ నాకు ఇచ్చాడు. యూదాలోని యెరూషలేములో తన కోసం ఒక గృహాన్ని నిర్మించమని ఆయన నాకు బాధ్యత అప్పగించాడు. మీలో ఆయన ప్రజలకు చెందినవాడు ఎవరైనా ఉంటే[a], అతని దేవుడైన యాహ్వే అతనికి తోడుగా ఉండుగాక[b]. అతడు ఎక్కి వెళ్లుగాక[c].”'
