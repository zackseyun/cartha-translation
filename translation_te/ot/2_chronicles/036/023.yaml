source:
  edition: WLC
  text: כֹּה אָמַ֞ר כּ֣וֹרֶשׁ מֶ֣לֶךְ פָּרַ֗ס כָּל מַמְלְכ֤וֹת הָ/אָ֨רֶץ֙ נָ֣תַן לִ֗/י יְהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם וְ/הֽוּא פָקַ֤ד עָלַ/י֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת בִּ/ירוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּֽ/יהוּדָ֑ה מִֽי בָ/כֶ֣ם מִ/כָּל עַמּ֗/וֹ יְהוָ֧ה אֱלֹהָ֛י/ו עִמּ֖/וֹ וְ/יָֽעַל־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/023.yaml
  text: 'Thus says Cyrus king of Persia: Yahweh[a], the God of heaven, has given me all the kingdoms of the earth, and he has charged me to build for him a house in Jerusalem, which is in Judah. Whoever is among you of all his people, may Yahweh his God be with him[d][c][b], and let him go up.'
translation:
  language: te
  text: '“పారసీక రాజు కోరెషు ఇలా ప్రకటిస్తున్నాడు: పరలోక దేవుడైన యాహ్వే భూమిమీద ఉన్న రాజ్యాలన్నిటినీ నాకు ఇచ్చాడు. యూదాలోని యెరూషలేములో తన కోసం ఒక గృహాన్ని నిర్మించమని ఆయన నాకు బాధ్యత అప్పగించాడు. మీలో ఆయన ప్రజలకు చెందినవాడు ఎవరైనా ఉంటే[a], అతని దేవుడైన యాహ్వే అతనికి తోడుగా ఉండుగాక[b]. అతడు ఎక్కి వెళ్లుగాక[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూ వాక్యం సంక్షిప్తంగా ఉంది. దీనిని, “మీలో ఆయన ప్రజలలో ఎవడైనా” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అతని దేవుడైన యాహ్వే అతనికి తోడుగా ఉన్నాడు.” హీబ్రూలో క్రియ లేకపోవడం వల్ల ఇది ఒక ప్రకటనగా కూడా చదవవచ్చు; సందర్భం మాత్రం ఆశీర్వాదార్థాన్ని బలపరుస్తుంది.
    reason: alternative_reading
  - marker: c
    text: అంటే, యెరూషలేముకు ఎక్కి వెళ్లడం. పరిశుద్ధ నగరమైన యెరూషలేముకు వెళ్లడాన్ని బైబిలు సంప్రదాయంలో “ఎక్కి వెళ్లడం” అంటారు.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: ఇలా ప్రకటిస్తున్నాడు
  rationale: ఇది రాజాజ్ఞను పరిచయం చేసే సూత్రప్రాయమైన పలుకుబడి. తెలుగులో ‘ఇలా ప్రకటిస్తున్నాడు’ అనేది సందర్భంలోని అధికారిక స్వరాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: పారసీక రాజు కోరెషు
  rationale: పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా ‘కోరెషు’గా, రాజ్యనామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న ‘పారసీక’గా ఇచ్చాం.
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: భూమిమీద ఉన్న రాజ్యాలన్నిటినీ
  rationale: ఇక్కడ אֶרֶץ విస్తృత భౌగోళిక భావంలో ఉంది; కేవలం యూదా దేశాన్ని సూచించదు.
- source_word: נָתַן לִי
  choice: నాకు ఇచ్చాడు
  rationale: దేవుడు ఇచ్చిన అధికారమే ఇప్పుడు కోరెషు అధీనంలో ఉందనే ఫలితభావం సందర్భం ద్వారా స్పష్టమవుతుంది; సరళమైన తెలుగు భూతకాలం సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగానే లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: పరలోక దేవుడు
  rationale: హీబ్రూ బహువచన రూపమైన ‘ఆకాశాలు’ ఈ స్థిరపదబంధంలో దేవుని పరలోకాధిపత్యాన్ని సూచిస్తుంది; ‘పరలోక దేవుడు’ సహజమైన ఆధునిక తెలుగు.
- source_word: וְהוּא פָקַד עָלַי
  choice: ఆయన నాకు బాధ్యత అప్పగించాడు
  rationale: פָקַד ఇక్కడ ఒక అధికారిక కార్యాన్ని నియమించి అప్పగించడాన్ని సూచిస్తుంది; ‘బాధ్యత అప్పగించాడు’ ఆజ్ఞనూ కార్యనియోగాన్నీ కలిపి తెలియజేస్తుంది.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: తన కోసం ఒక మందిరాన్ని నిర్మించమని
  rationale: בַיִת అక్షరార్థంగా ‘ఇల్లు/గృహం’; అయితే దేవుని కోసం యెరూషలేములో నిర్మించేది ఆలయమని సందర్భం స్పష్టం చేస్తుంది. ‘మందిరం’ మూలంలోని ‘దేవుని గృహం’ భావాన్ని నిలుపుతూ తెలుగులో అపార్థాన్ని నివారిస్తుంది.
- source_word: בִּירוּשָׁלִַם אֲשֶׁר בִּיהוּדָה
  choice: యూదాలోని యెరూషలేములో
  rationale: మూలంలోని సంబంధవాక్యాన్ని తెలుగులో సహజమైన విశేషణ నిర్మాణంగా కుదించాం; సమాచారమంతా నిలిచింది.
- source_word: מִי בָכֶם מִכָּל עַמּוֹ
  choice: మీలో ఆయన ప్రజలకు చెందినవాడు ఎవరైనా ఉంటే
  rationale: మూల వాక్యం సంక్షిప్తంగా, కొంత అస్పష్టంగా ఉంది. ఇక్కడ מִן‌ను సమూహంలోని సభ్యత్వాన్ని తెలిపే భాగార్థక ప్రయోగంగా తీసుకుని సహజమైన తెలుగులో ఇచ్చాం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: יְהוָה אֱלֹהָיו עִמּוֹ
  choice: అతని దేవుడైన యాహ్వే అతనికి తోడుగా ఉండుగాక
  rationale: సందర్భంలో ఇది తిరిగి వెళ్లేవారికి ఇచ్చే ఆశీర్వాదంగా సహజంగా పనిచేస్తుంది. అయినా హీబ్రూలో స్పష్టమైన క్రియ లేకపోవడం వల్ల సూచనార్థక పఠనం కూడా సాధ్యమని పాదసూచికలో తెలిపాం.
- source_word: וְיָעַל
  choice: అతడు యెరూషలేముకు ఎక్కి వెళ్లుగాక
  rationale: עלה యెరూషలేముకు వెళ్లడాన్ని సంప్రదాయంగా ‘ఎక్కి వెళ్లడం’గా వ్యక్తం చేస్తుంది. ‘వెళ్లుగాక’ సందర్భంలోని అనుమతి/ప్రోత్సాహక ఆజ్ఞభావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో దేవుని ప్రత్యేక నామం ప్రత్యక్షంగా ఉంది. దానిని సాధారణ బిరుదుగా మార్చకుండా, ఆధునిక పరిశోధనలో విస్తృతంగా అంగీకరించిన ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- issue: בַיִת ను ‘గృహం’గా లేదా ‘మందిరం’గా ఇవ్వడం
  choice: మందిరం
  alternative: గృహం
  rationale: అక్షరార్థమైన ‘గృహం’ తెలుగులో సాధారణ నివాసాన్ని సూచించే అవకాశం ఉంది. యెరూషలేములో దేవుని కోసం నిర్మించే కట్టడం ఆలయమని సందర్భం నిర్దిష్టం చేస్తుండటంతో ‘మందిరం’ స్పష్టమైన సమానార్థక పదం.
- issue: יְהוָה אֱלֹהָיו עִמּוֹ యొక్క వాక్యబలం
  choice: ఆశీర్వాదార్థకం—‘తోడుగా ఉండుగాక’
  alternative: సూచనార్థకం—‘తోడుగా ఉన్నాడు’
  rationale: తిరిగి వెళ్లమనే రాజప్రకటన చివర ఈ మాట ఆశీర్వాదం లేదా శుభాకాంక్షగా సహజంగా సరిపోతుంది. అయితే మూలంలో క్రియ లేకపోవడం వల్ల సూచనార్థక పఠనాన్ని పూర్తిగా తొలగించలేం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజప్రకటనకు తగిన గంభీరతతోనూ సాధారణ పాఠకుడికి అర్థమయ్యే సహజ వాక్యనిర్మాణంతోనూ రూపొందించాం. ‘ఉండుగాక’, ‘వెళ్లుగాక’ వంటి రూపాలు గౌరవప్రదమైన ప్రకటన స్వరాన్ని నిలుపుతాయి; అరుదైన లేదా మతశాఖాపరమైన పరిభాషను నివారించాం.
