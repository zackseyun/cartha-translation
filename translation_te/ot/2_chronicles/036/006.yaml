translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. సైనిక సందర్భాన్ని ‘దండెత్తి వచ్చి’ ద్వారా తెలియజేశాం; ‘సంకెళ్లు’ అనే సాధారణ పదాన్ని ప్రధాన పాఠ్యంలో ఉంచి, హీబ్రూ పదంలోని విస్తృతార్థాన్ని పాదసూచికలో భద్రపరిచాం.
