  variant: modern standard Telugu
source:
  edition: WLC
  text: עָלָ֣י/ו עָלָ֔ה נְבוּכַדְנֶאצַּ֖ר מֶ֣לֶךְ בָּבֶ֑ל וַ/יַּֽאַסְרֵ֨/הוּ֙ בַּֽ/נְחֻשְׁתַּ֔יִם לְ/הֹלִיכ֖/וֹ בָּבֶֽלָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/006.yaml
  text: Nebuchadnezzar king of Babylon came up against him and bound him with bronze chains to take him to Babylon[a].
translation:
  language: te
  text: బబులోను రాజైన నెబుకద్నెజరు అతనికి విరోధంగా దండెత్తి వచ్చి, అతన్ని బబులోనుకు తీసుకెళ్లడానికి కంచు సంకెళ్లతో[a] బంధించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కంచు బేడీలతో’ లేదా ‘కంచు కడియాలతో.’ హీబ్రూ పదం అతనికి వేసిన కంచు నిర్బంధ సాధనాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו עָלָה
  choice: అతనికి విరోధంగా దండెత్తి వచ్చి
  rationale: సైనిక సందర్భంలో עָלָה עַל ఒకరికి విరోధంగా ముందుకు రావడాన్ని సూచిస్తుంది. ఈ అనువాదం శత్రుత్వభావాన్ని స్పష్టం చేస్తూనే, వాస్తవంగా దాడి జరిగిందని మూలానికి మించి చెప్పదు.
- source_word: נְבוּכַדְנֶאצַּר
  choice: నెబుకద్నెజరు
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన పేరురూపాన్ని ఉపయోగించాం.
- source_word: מֶלֶךְ בָּבֶל
  choice: బబులోను రాజైన
  rationale: హీబ్రూ నిర్మాణం నెబుకద్నెజరు రాజపదవిని గుర్తిస్తుంది; తెలుగులో పేరుకు ముందు ఈ విశేషణ నిర్మాణం సహజంగా ఉంటుంది.
- source_word: וַיַּאַסְרֵהוּ
  choice: బంధించాడు
  rationale: אָסַר అంటే కట్టడం లేదా బంధించడం. తరువాత వచ్చే లోహపు నిర్బంధ సాధనానికి ఇది నేరుగా సరిపోతుంది.
- source_word: בַּנְחֻשְׁתַּיִם
  choice: కంచు సంకెళ్లతో
  rationale: ఈ ద్వివచన/బహువచన రూపం కంచుతో చేసిన నిర్బంధ సాధనాలను సూచిస్తుంది. ‘సంకెళ్లు’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది; సాధనార్థాన్ని ‘తో’ తెలియజేస్తుంది.
- source_word: לְהֹלִיכוֹ
  choice: అతన్ని … తీసుకెళ్లడానికి
  rationale: הלך యొక్క హిఫీల్ రూపం ఒకరిని వెళ్లేలా చేయడం లేదా తీసుకెళ్లడం అనే భావాన్ని ఇస్తుంది; ఇక్కడ బందీని తరలించే సందర్భానికి ‘తీసుకెళ్లడానికి’ సహజంగా సరిపోతుంది.
- source_word: בָּבֶלָה
  choice: బబులోనుకు
  rationale: దిశను సూచించే చివరి ה గమ్యస్థానాన్ని తెలియజేస్తుంది; తెలుగులో ‘బబులోనుకు’ సంక్షిప్తమైన సహజ రూపం.
