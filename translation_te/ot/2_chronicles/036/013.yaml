  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֠/גַם בַּ/מֶּ֤לֶךְ נְבֽוּכַדְנֶאצַּר֙ מָרָ֔ד אֲשֶׁ֥ר הִשְׁבִּיע֖/וֹ בֵּֽ/אלֹהִ֑ים וַ/יֶּ֤קֶשׁ אֶת עָרְפּ/וֹ֙ וַ/יְאַמֵּ֣ץ אֶת לְבָב֔/וֹ מִ/שּׁ֕וּב אֶל יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/013.yaml
  text: He also rebelled against King Nebuchadnezzar[a], who had made him swear by God; he stiffened his neck and hardened his heart from turning to Yahweh[b], the God of Israel.
translation:
  language: te
  text: దేవుని పేరట అతనితో ప్రమాణం చేయించిన నెబుకద్నెజరు రాజుకు వ్యతిరేకంగా అతడు కూడా తిరుగుబాటు చేశాడు.[a] అతడు ఇశ్రాయేలు దేవుడైన యెహోవా వైపు తిరగకుండా తన మెడను బిగించుకొని, తన హృదయాన్ని కఠినపరచుకున్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని సాక్షిగా ప్రమాణం చేయించి అతణ్ణి బంధించిన.” హీబ్రూ మాటలు అతనితో ప్రమాణం చేయించిన చర్యను గానీ, దేవుని సమక్షంలో జరిగిన ఆ ప్రమాణపు గంభీరతను గానీ నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “మెడను బిగించుకోవడం” అనేది మొండిగా ఎదిరించడాన్ని సూచించే హీబ్రూ రూపకం.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם
  choice: కూడా
  rationale: ముందటి కథనంతో అనుబంధాన్ని, అదనపు అపరాధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בַּמֶּלֶךְ נְבוּכַדְנֶאצַּר מָרָד
  choice: నెబుకద్నెజరు రాజు మీద ... తిరుగుబాటు చేశాడు
  rationale: మָרַד తో వచ్చిన בְּ తిరుగుబాటు ఎవరికి వ్యతిరేకంగా జరిగిందో సూచిస్తుంది; ఈ రూపం రాజకీయ తిరుగుబాటు భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: אֲשֶׁר הִשְׁבִּיעוֹ בֵּאלֹהִים
  choice: దేవుని పేరట తనతో ప్రమాణం చేయించిన
  rationale: హిఫీల్ రూపం మరొకరితో ప్రమాణం చేయించడాన్ని సూచిస్తుంది. సంబంధవాక్యంలోని కర్త నెబుకద్నెజరు అని తెలుగులో ‘తనతో’ ద్వారా స్పష్టం చేశాం; בֵּאלֹהִים ను ‘దేవుని పేరట’గా సహజంగా వ్యక్తం చేశాం.
- source_word: וַיֶּקֶשׁ אֶת עָרְפּוֹ
  choice: తన మెడను బిగించి
  rationale: మొండిగా ఎదిరించడాన్ని సూచించే హీబ్రూ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; దాని భావాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: וַיְאַמֵּץ אֶת לְבָבוֹ
  choice: తన హృదయాన్ని కఠినం చేసుకున్నాడు
  rationale: ఈ సందర్భంలో אָמֵץ సాధారణ బలపరచడం కాక, పశ్చాత్తాపానికి లొంగని అంతరంగ మొండితనాన్ని సూచిస్తుంది.
- source_word: מִשּׁוּב אֶל
  choice: వైపు తిరగకుండా
  rationale: מִן తో కూడిన క్రియానామం ఇక్కడ తిరిగి రావడాన్ని నిరోధించడం లేదా నిరాకరించడం సూచిస్తుంది; సహజ తెలుగులో ఉద్దేశ్యాన్ని అతిగా విప్పకుండా భావాన్ని అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే సాంప్రదాయ లిప్యంతరీకరణతో వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: హీబ్రూ సమాసంలోని ఒడంబడిక సంబంధ గుర్తింపును నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠ్యంలో ఉన్న ప్రత్యేక దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించేందుకు ఉపయోగించే ప్రత్యామ్నాయ రూపం.
- issue: హృదయాన్ని కఠినం చేసుకున్నది ఎవరు
  choice: అతడే తన హృదయాన్ని కఠినం చేసుకున్నాడు
  alternative: దేవుడు అతని హృదయాన్ని కఠినం చేశాడు
  rationale: హీబ్రూ క్రియకు వాక్యకర్త సిద్కియా; ఈ వచనం అతని స్వీయ మొండితనాన్నే నేరుగా పేర్కొంటుంది. దైవ కార్యసాధకత్వాన్ని పాఠ్యంలో చేర్చడం మూలంలో లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. హీబ్రూ శరీరరూపకాలైన ‘మెడను బిగించడం,’ ‘హృదయాన్ని కఠినం చేసుకోవడం’ నిలుపుతూ, మొదటి రూపకానికి పాదటిప్పణిలో వివరణ ఇచ్చాం. వాక్య నిర్మాణాన్ని తెలుగు పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించాం.
