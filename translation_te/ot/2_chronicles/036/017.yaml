id: 2CH.36.17
reference: 2 Chronicles 36:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֨עַל עֲלֵי/הֶ֜ם אֶת מֶ֣לֶךְ כשדיים וַ/יַּהֲרֹ֨ג בַּחוּרֵי/הֶ֤ם בַּ/חֶ֨רֶב֙ בְּ/בֵ֣ית מִקְדָּשָׁ֔/ם וְ/לֹ֥א חָמַ֛ל עַל בָּח֥וּר וּ/בְתוּלָ֖ה זָקֵ֣ן וְ/יָשֵׁ֑שׁ הַ/כֹּ֖ל נָתַ֥ן בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/017.yaml
  text: So he brought up against them the king of the Chaldeans[a], who killed their young men with the sword in the house of their sanctuary, and had no compassion on young man or virgin, old man or aged man[c][b]. He gave all into his hand.
translation:
  language: te
  text: కాబట్టి ఆయన కల్దీయుల రాజును[a] వారిమీదికి రప్పించాడు. అతడు వారి పరిశుద్ధస్థలపు మందిరంలో వారి యువకులను కత్తితో చంపాడు. యువకుని మీదగానీ, కన్య[c] మీదగానీ, వృద్ధుని మీదగానీ, ముదుసలివాని మీదగానీ అతడు కనికరం చూపలేదు[b]. వారందరినీ దేవుడు అతని చేతికి అప్పగించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బబులోనీయుల రాజు’; హీబ్రూలో ‘కల్దీయులు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఎవరినీ విడిచిపెట్టలేదు.’
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ పదం ప్రత్యేకంగా పెళ్లికాని యువతిని, అంటే కన్యను, సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל עֲלֵיהֶם
  choice: ఆయన ... వారిమీదికి రప్పించాడు
  rationale: హిఫిల్ క్రియలోని కారణార్థాన్ని నిలుపుతూ, సైనిక సందర్భంలో సహజమైన ఆధునిక తెలుగు ప్రయోగాన్ని ఎంచుకున్నాం. ‘ఆయన’ మునుపటి వచనంలోని దేవుణ్ణి సూచిస్తుంది.
- source_word: מֶלֶךְ כשדיים
  choice: కల్దీయుల రాజు
  rationale: హీబ్రూ జాతినామాన్ని నేరుగా అనువదించాం; పాఠకులకు సుపరిచితమైన ‘బబులోనీయులు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וַיַּהֲרֹג
  choice: అతడు ... చంపాడు
  rationale: కర్త కల్దీయుల రాజు అని తెలుగులో స్పష్టంగా ఉండేలా స్వతంత్ర వాక్యంగా ఇచ్చాం; మూల క్రియ యొక్క సాధారణ హత్యార్థాన్ని నిలిపాం.
- source_word: בַּחוּרֵיהֶם
  choice: వారి యువకులు
  rationale: యౌవనప్రాయంలోని పురుషులను సూచించే సాధారణ, సహజమైన తెలుగు పదం.
- source_word: בַּחֶרֶב
  choice: కత్తితో
  rationale: హీబ్రూ సాధనార్థక పదబంధాన్ని సూటిగా, సహజంగా అనువదిస్తుంది.
- source_word: בְּבֵית מִקְדָּשָׁם
  choice: వారి పరిశుద్ధస్థలపు మందిరంలోనే
  rationale: ‘వారి పరిశుద్ధస్థలపు గృహంలో’ అనే మూల నిర్మాణాన్ని అర్థవంతంగా నిలిపి, హత్య అక్కడే జరిగిందనే అపవిత్రీకరణ తీవ్రతను ‘లోనే’తో సహజంగా వ్యక్తం చేశాం.
- source_word: וְלֹא חָמַל
  choice: కనికరం చూపలేదు
  rationale: חמל లోని జాలి వల్ల విడిచిపెట్టడం అనే భావంలో కనికరాంశాన్ని ముందుకు తెస్తుంది; ‘విడిచిపెట్టలేదు’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: בָּחוּר וּבְתוּלָה
  choice: యువకుడు ... కన్య
  rationale: రెండు లింగ, వయో వర్గాలను వేరుగా ఉంచి, בתולה యొక్క నిర్దిష్ట అర్థాన్ని ‘కన్య’గా నిలిపాం.
- source_word: זָקֵן וְיָשֵׁשׁ
  choice: వృద్ధుడు ... ముదుసలివాడు
  rationale: వృద్ధాప్యంలోని రెండు దశలు లేదా బలవర్ధక జంటగా ఉన్న మూల పదాలను ఒక్కటిగా కలపకుండా వేర్వేరుగా నిలిపాం.
- source_word: הַכֹּל נָתַן בְּיָדוֹ
  choice: వారందరినీ దేవుడు అతని చేతికి అప్పగించాడు
  rationale: సందర్భంలోని వ్యక్తులనే ‘అందరూ’ సూచిస్తున్నారని తెలుగులో సహజంగా తెలియజేస్తూ, ‘చేతికి అప్పగించడం’ అనే అధీనంలో పెట్టే హీబ్రూ నుడికారాన్ని నిలిపాం. కర్తను ‘దేవుడు’గా స్పష్టం చేయడం మునుపటి సందర్భానికి అనుగుణం.
theological_decisions:
- issue: ప్రారంభ క్రియకూ చివరి వాక్యానికీ కర్త ఎవరు?
  choice: రెండింటికీ దేవుడే కర్త; ప్రారంభంలో ‘ఆయన’, చివరలో ‘దేవుడు’ అని వ్యక్తం చేశాం.
  alternative: కర్తను కేవలం సర్వనామంతో ఉంచడం లేదా తెలుగులో అవ్యక్తంగా వదలడం.
  rationale: హీబ్రూ మూడవ పురుష ఏకవచన క్రియల కర్తను 36:16లోని యెహోవా చర్య అందిస్తుంది. చివరి వాక్యంలో ‘దేవుడు’ అని చెప్పడం రాజే తనకు తాను ప్రజలను అప్పగించుకున్నాడనే అపార్థాన్ని నివారిస్తుంది; కొత్త సిద్ధాంతాన్ని చేర్చదు.
- issue: దేవుని తీర్పులో మానవ హింసను వర్ణించడం
  choice: దేవుడు రాజును రప్పించి ప్రజలను అతని చేతికి అప్పగించాడనీ, రాజు చంపి కనికరం చూపలేదనీ కర్తల భేదాన్ని నిలిపాం.
  alternative: హత్యను నేరుగా దేవుడే చేసినట్లు చెప్పడం లేదా దేవుని పాత్రను పూర్తిగా అస్పష్టం చేయడం.
  rationale: మూలపాఠం దేవుని సార్వభౌమ తీర్పునూ కల్దీయ రాజు చేసిన హింసనూ ఒకే సందర్భంలో ఉంచుతుంది. ఆ ఉద్రిక్తతను పరిష్కరించకుండా, వ్యాకరణ కర్తలను స్పష్టంగా ప్రతిబింబించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలిని అనుసరించాం. పొడవైన హీబ్రూ వాక్యాన్ని మూడు సహజ తెలుగు వాక్యాలుగా విభజించాం. ‘పరిశుద్ధస్థలపు మందిరం’ మూలంలోని ‘పరిశుద్ధస్థలపు గృహం’ భావాన్ని ‘దేవాలయం’గా మాత్రమే సరళీకరించకుండా నిలుపుతుంది. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
