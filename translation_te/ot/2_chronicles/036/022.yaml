- from: 'పారసీక రాజైన కోరెషు పాలన మొదటి సంవత్సరంలో, యిర్మీయా నోటి ద్వారా యెహోవా పలికిన మాట నెరవేరేలా, యెహోవా పారసీక రాజైన కోరెషు మనసును ప్రేరేపించాడు. అప్పుడు అతడు తన రాజ్యమంతటా ఒక ప్రకటన చేయించి, దానిని రాతపూర్వకంగా కూడా ఇలా తెలియజేశాడు:'
  to: 'పారసీక రాజైన కోరెషు పాలన మొదటి సంవత్సరంలో, యిర్మీయా నోటి ద్వారా యాహ్వే పలికిన మాట నెరవేరేలా, యాహ్వే పారసీక రాజైన కోరెషు మనస్సును ప్రేరేపించాడు. అతడు తన రాజ్యమంతటా ఒక ప్రకటన జారీ చేసి, దానిని రాతపూర్వకంగా కూడా ఇలా తెలియజేశాడు:'
  rationale: సవరణ మూలార్థాన్ని మార్చకుండా ప్రాజెక్టు దైవనామ విధానాన్ని పాటిస్తుంది, మూలంలో లేని స్పష్టమైన కాలసూచకాన్ని తొలగిస్తుంది, మరియు రాజాజ్ఞను ప్రకటించిన క్రియను ఆధునిక తెలుగులో మరింత నేరుగా వ్యక్తం చేస్తుంది. ‘యిర్మీయా నోటి ద్వారా’ ఇప్పటికే హీబ్రూ జాతీయాన్ని స్పష్టంగా ప్రతిబింబిస్తున్నందున అదనపు పాదటిప్పణి అవసరం లేదు.
