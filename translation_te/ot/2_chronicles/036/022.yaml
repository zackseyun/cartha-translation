id: 2CH.36.22
reference: 2 Chronicles 36:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֣ת אַחַ֗ת לְ/כ֨וֹרֶשׁ֙ מֶ֣לֶךְ פָּרַ֔ס לִ/כְל֥וֹת דְּבַר יְהוָ֖ה בְּ/פִ֣י יִרְמְיָ֑הוּ הֵעִ֣יר יְהוָ֗ה אֶת ר֨וּחַ֙ כּ֣וֹרֶשׁ מֶֽלֶךְ פָּרַ֔ס וַ/יַּֽעֲבֶר קוֹל֙ בְּ/כָל מַלְכוּת֔/וֹ וְ/גַם בְּ/מִכְתָּ֖ב לֵ/אמֹֽר־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/022.yaml
  text: 'In the first year of Cyrus king of Persia[a], so that the word of Yahweh by the mouth of Jeremiah might be fulfilled, Yahweh stirred up the spirit of Cyrus king of Persia, and he made a proclamation throughout all his kingdom, and also in writing, saying:'
translation:
  language: te
  text: 'పారసీక రాజైన కోరెషు పాలన మొదటి సంవత్సరంలో, యిర్మీయా నోటి ద్వారా యాహ్వే పలికిన మాట నెరవేరేలా, యాహ్వే పారసీక రాజైన కోరెషు మనస్సును ప్రేరేపించాడు. అతడు తన రాజ్యమంతటా ఒక ప్రకటన జారీ చేసి, దానిని రాతపూర్వకంగా కూడా ఇలా తెలియజేశాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִשְׁנַת אַחַת
  choice: పాలన మొదటి సంవత్సరంలో
  rationale: రాజుల కాలగణనను తెలుగులో సహజంగా తెలియజేయడానికి ‘పాలన’ను స్పష్టీకరణగా చేర్చాం; వావ్‌ను ప్రత్యేకంగా అనువదించకుండా వాక్యప్రవాహంలో ఉంచాం.
- source_word: לְכוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: పారసీక రాజైన కోరెషు
  rationale: రాజు పేరు, రాజబిరుదు రెండింటినీ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సమాసబంధంతో ఇచ్చాం.
- source_word: לִכְלוֹת דְּבַר יְהוָה
  choice: యెహోవా పలికిన మాట నెరవేరేలా
  rationale: לִכְלוֹת ఇక్కడ ప్రవచన వాక్యం సంపూర్ణంగా కార్యరూపం దాల్చడాన్ని సూచిస్తుంది; ‘నెరవేరేలా’ ప్రయోజన/ఫల భావాన్ని నిలుపుతుంది.
- source_word: בְּפִי יִרְמְיָהוּ
  choice: యిర్మీయా నోటి ద్వారా
  rationale: ‘నోటి ద్వారా’ అనే హీబ్రూ రూపకాన్ని తెలుగులో అర్థమయ్యే విధంగా నిలిపి, ప్రవక్త ద్వారా దేవుని వాక్యం పలకబడిన భావాన్ని కాపాడాం.
- source_word: הֵעִיר יְהוָה אֶת־רוּחַ כֹּרֶשׁ
  choice: యెహోవా ... కోరెషు మనసును ప్రేరేపించాడు
  rationale: רוּחַ ఇక్కడ కోరెషు అంతరంగ ప్రవృత్తి లేదా సంకల్పాన్ని సూచిస్తుంది. తెలుగులో ‘మనసును ప్రేరేపించాడు’ సహజంగా ఉండి, దైవిక ప్రేరణ భావాన్ని తెలియజేస్తుంది.
- source_word: וַיַּעֲבֶר־קוֹל
  choice: ఒక ప్రకటన చేయించాడు
  rationale: అక్షరార్థంగా ‘స్వరాన్ని వెళ్లేలా చేశాడు’ అనే జాతీయాన్ని ప్రజలకు అధికారిక ప్రకటన చాటింపజేయడంగా సహజీకరించాం.
- source_word: בְּכָל־מַלְכוּתוֹ
  choice: తన రాజ్యమంతటా
  rationale: ప్రకటన రాజ్యమంతటా వ్యాపించిన పంపిణీ భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: וְגַם־בְּמִכְתָּב
  choice: దానిని రాతపూర్వకంగా కూడా
  rationale: మౌఖిక చాటింపుతో పాటు లిఖిత రూపం కూడా ఉన్నదనే అదనపు భావాన్ని స్పష్టంగా కాపాడాం.
- source_word: לֵאמֹר
  choice: 'ఇలా తెలియజేశాడు:'
  rationale: తదుపరి వచనంలోని ప్రత్యక్ష ప్రకటనకు సహజమైన తెలుగు పరిచయంగా కొలన్‌తో ఇచ్చాం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా వ్యక్తినామ రూపంలో ఉంచాం; తెలుగు బైబిల్ పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: רוּחַ כֹּרֶשׁ యొక్క భావం
  choice: కోరెషు మనసు
  alternative: కోరెషు ఆత్మ
  rationale: ఇక్కడ భావం కోరెషు అంతరంగ సంకల్పం లేదా ప్రేరణకు సంబంధించినది. ‘ఆత్మ’ అని ఇస్తే వేరొక స్వతంత్ర ఆధ్యాత్మిక సత్తా అనే అపార్థం కలగవచ్చు; ‘మనసు’ సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- issue: לִכְלוֹת లో ఉద్దేశం/ఫలితం సంబంధం
  choice: నెరవేరేలా
  alternative: నెరవేర్చడానికి
  rationale: హీబ్రూ infinitive వాక్య నెరవేర్పుకు దారితీసిన ఉద్దేశం లేదా ఫలితం రెండింటికీ అవకాశం ఇస్తుంది. ‘నెరవేరేలా’ దేవుడు కోరెషును ప్రేరేపించిన చర్యతో సంబంధాన్ని చూపుతూ కారణకర్తను అవసరానికి మించి నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. మూలంలోని ప్రవచన నెరవేర్పు, దైవిక ప్రేరణ, మౌఖిక మరియు లిఖిత ప్రకటన అనే క్రమాన్ని నిలిపాం. ఈ వచనానికి పాఠక గమనిక అవసరం లేదని నిర్ణయించాం.
