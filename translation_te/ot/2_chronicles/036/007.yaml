id: 2CH.36.7
reference: 2 Chronicles 36:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִ/כְּלֵי֙ בֵּ֣ית יְהוָ֔ה הֵבִ֥יא נְבוּכַדְנֶאצַּ֖ר לְ/בָבֶ֑ל וַ/יִּתְּנֵ֥/ם בְּ/הֵיכָל֖/וֹ בְּ/בָבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/007.yaml
  text: Nebuchadnezzar also brought some of the vessels of the house of Yahweh to Babylon[a], and put them in his temple in Babylon.
translation:
  language: te
  text: నెబుకద్నెజరు యెహోవా మందిరంలోని కొన్ని పాత్రలను కూడా బబులోనుకు తీసుకువెళ్లి, బబులోనులో తన దేవాలయంలో[a] వాటిని ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన రాజభవనంలో.” హీబ్రూ పదం సందర్భానుసారం దేవాలయాన్ని లేదా రాజభవనాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/כְּלֵי
  choice: కొన్ని పాత్రలను కూడా
  rationale: וּ అనుసంధానాన్ని, מִן యొక్క భాగార్థాన్ని సహజమైన తెలుగులో ‘కొన్ని ... కూడా’ అని వ్యక్తం చేశాం. כְּלֵי ఇక్కడ మందిర సేవకు సంబంధించిన వస్తువులు కాబట్టి ‘పాత్రలు’ సరిపోతుంది.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: అక్షరార్థంగా ‘యెహోవా ఇల్లు’; ఆధునిక తెలుగులో సందర్భార్థాన్ని స్పష్టంగా తెలియజేయడానికి ‘మందిరం’ వాడాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో మార్చకుండా, తెలుగులో స్థిరపడిన రూపమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: הֵבִיא
  choice: తీసుకువెళ్లాడు
  rationale: వస్తువులను యూదా నుండి బబులోనుకు తరలించిన గమనం తెలుగులో సహజంగా వ్యక్తమవుతుంది.
- source_word: נְבוּכַדְנֶאצַּר
  choice: నెబుకద్నెజరు
  rationale: వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: לְ/בָבֶל
  choice: బబులోనుకు
  rationale: లְ సూచించే గమ్యాన్ని ‘-కు’ విభక్తితో తెలిపాం.
- source_word: וַ/יִּתְּנֵם
  choice: వాటిని ఉంచాడు
  rationale: נתן ఇక్కడ ఒక చోట పెట్టడం లేదా నిల్వచేయడం అనే అర్థంలో ఉంది; ‘ఉంచాడు’ సహజమైన, గౌరవప్రదమైన తెలుగు.
- source_word: בְּ/הֵיכָל/וֹ
  choice: తన దేవాలయంలో
  rationale: הֵיכָל దేవాలయం లేదా రాజభవనం అనే రెండు అర్థాలు ఇవ్వగలదు. పవిత్ర పాత్రల సందర్భంలో ‘దేవాలయం’ను ప్రధాన పాఠంగా ఎంచుకున్నాం; ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: בְּ/בָבֶל
  choice: బబులోనులోని
  rationale: స్థానార్థక בְּ ను సహజమైన తెలుగు విశేషణ నిర్మాణంతో వ్యక్తం చేశాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: హెబ్రీ పాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో గుర్తించదగిన లిప్యంతరీకరణను ఉంచాం.
- issue: నెబుకద్నెజరుకు సంబంధించిన הֵיכָל అర్థం
  choice: దేవాలయం
  alternative: రాజభవనం
  rationale: యెహోవా మందిరపు పాత్రలను ఉంచిన స్థలమనే తక్షణ సందర్భం ఆరాధనా భవనాన్ని సూచించే అవకాశాన్ని బలపరుస్తుంది. అయినా పదంలోని నిజమైన ద్వంద్వార్థాన్ని పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే చారిత్రక-ఆధ్యాత్మిక సందర్భానికి తగిన గౌరవప్రదమైన శైలిని పాటించాం. మూలంలోని భాగార్థాన్ని ‘కొన్ని’తో, הֵיכָל యొక్క సందిగ్ధతను పాదసూచికతో నిలిపాం.
