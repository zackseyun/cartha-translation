- from: ఈజిప్టు రాజు యెహోయాహాజు సోదరుడైన ఎల్యాకీమును యూదా మీద, యెరూషలేము మీద రాజుగా నియమించి, అతని పేరును యెహోయాకీము అని మార్చాడు. నెకో[a] అతని సోదరుడైన యెహోయాహాజును పట్టుకొని ఈజిప్టుకు తీసుకువెళ్లాడు.
  to: ఈజిప్టు రాజు యెహోయాహాజు సోదరుడైన ఎల్యాకీమును యూదా, యెరూషలేముల మీద రాజుగా నియమించి, అతని పేరును యెహోయాకీము అని మార్చాడు. నెకో[a] ఎల్యాకీము సోదరుడైన యెహోయాహాజును తీసుకొని ఈజిప్టుకు తీసుకువెళ్లాడు.
  rationale: The revision removes the unwarranted arrest/seizure nuance from ‘పట్టుకొని’ and makes Eliakim the explicit antecedent of ‘his brother.’ It otherwise retains the source order, causative royal appointment, imposed name change, and movement to Egypt.
  reviewer_model: gpt-5.6-terra
