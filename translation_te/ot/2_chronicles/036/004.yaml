id: 2CH.36.4
reference: 2 Chronicles 36:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּמְלֵ֨ךְ מֶֽלֶךְ מִצְרַ֜יִם אֶת אֶלְיָקִ֣ים אָחִ֗י/ו עַל יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם וַ/יַּסֵּ֥ב אֶת שְׁמ֖/וֹ יְהוֹיָקִ֑ים וְ/אֶת יוֹאָחָ֤ז אָחִי/ו֙ לָקַ֣ח נְכ֔וֹ וַ/יְבִיאֵ֖/הוּ מִצְרָֽיְמָ/ה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/004.yaml
  text: And the king of Egypt made Eliakim his brother king over Judah and Jerusalem[a], and changed his name to Jehoiakim. And Neco took his brother Jehoahaz and brought him to Egypt.
translation:
  language: te
  text: ఈజిప్టు రాజు యెహోయాహాజు సోదరుడైన ఎల్యాకీమును యూదా, యెరూషలేముల మీద రాజుగా నియమించి, అతని పేరును యెహోయాకీము అని మార్చాడు. నెకో[a] ఎల్యాకీము సోదరుడైన యెహోయాహాజును తీసుకొని ఈజిప్టుకు తీసుకువెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “నెకో”; కొన్ని అనువాదాల్లో “నెఖో” అనే రూపం కనిపిస్తుంది.'
    reason: పేరు లిప్యంతరీకరణలో ప్రాచుర్యంలో ఉన్న ప్రత్యామ్నాయ రూపాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: రాజుగా నియమించి
  rationale: מלך హిఫీల్ రూపం ఇక్కడ ఎల్యాకీమును రాజుగా ప్రతిష్ఠించడం లేదా నియమించడం అనే కారణార్థాన్ని తెలియజేస్తుంది.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: ఈజిప్టు రాజు
  rationale: నిర్దిష్టమైన ఈజిప్టు పాలకుణ్ణి సూచించే సహజమైన తెలుగు నిర్మాణం.
- source_word: אֶלְיָקִים אָחִיו
  choice: యెహోయాహాజు సోదరుడైన ఎల్యాకీమును
  rationale: హీబ్రూలోని 'అతని సోదరుడు' అనే సర్వనామ సూచన సందర్భానుసారం యెహోయాహాజును సూచిస్తుంది; తెలుగులో అపార్థం రాకుండా పూర్వపదాన్ని స్పష్టం చేశాం.
- source_word: עַל יְהוּדָה וִירוּשָׁלַם
  choice: యూదా మీద, యెరూషలేము మీద
  rationale: עַל రాజ్యాధికార పరిధిని సూచిస్తుంది; రాజ్యాన్నీ రాజధానినీ విడిగా పేర్కొన్న మూల నిర్మాణాన్ని నిలిపాం.
- source_word: וַיַּסֵּב אֶת שְׁמוֹ יְהוֹיָקִים
  choice: అతని పేరును యెహోయాకీము అని మార్చాడు
  rationale: పేరును మార్చే చర్యను సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: וְאֶת יוֹאָחָז אָחִיו לָקַח נְכוֹ
  choice: నెకో అతని సోదరుడైన యెహోయాహాజును పట్టుకొని
  rationale: לקח యొక్క సాధారణ అర్థం 'తీసుకున్నాడు'; ఈ సందర్భంలో బలవంతంగా అదుపులోకి తీసుకొని ఈజిప్టుకు తరలించడాన్ని 'పట్టుకొని' సహజంగా తెలియజేస్తుంది. וְ ను ప్రత్యేక విరోధార్థక పదంతో అనువదించకుండా వాక్యక్రమంలో ప్రతిఫలింపజేశాం.
- source_word: וַיְבִיאֵהוּ מִצְרָיְמָה
  choice: ఈజిప్టుకు తీసుకువెళ్లాడు
  rationale: దిశాసూచక ה Egypt వైపు గమనాన్ని తెలియజేస్తుంది; తెలుగు దృష్టికోణంలో 'తీసుకువెళ్లాడు' సహజంగా ఉంది.
- source_word: נְכוֹ
  choice: నెకో
  rationale: హీబ్రూ స్వరరూపాన్ని సమీపంగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. బంధుత్వ సూచనలో కలిగే సందిగ్ధతను సందర్భానికి అనుగుణంగా స్పష్టం చేశాం; రాజ్య నియామకం, పేరు మార్పు, యెహోయాహాజు తరలింపు అనే చర్యలను మూల క్రమంలో ఉంచాం.
