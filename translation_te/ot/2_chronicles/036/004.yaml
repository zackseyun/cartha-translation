  revision_rationale: The revision removes the unwarranted arrest/seizure nuance from ‘పట్టుకొని’ and makes Eliakim the explicit antecedent of ‘his brother.’ It otherwise retains the source order, causative royal appointment, imposed name change, and movement to Egypt.
