source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֧ים וְ/אַחַ֛ת שָׁנָ֖ה צִדְקִיָּ֣הוּ בְ/מָלְכ֑/וֹ וְ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/011.yaml
  text: Zedekiah was twenty-one years old when he became king, and he reigned eleven years in Jerusalem.
translation:
  language: te
  text: సిద్కియా రాజైనప్పుడు అతనికి ఇరవై ఒక్క సంవత్సరాల వయసు. అతడు యెరూషలేములో పదకొండు సంవత్సరాలు రాజుగా పరిపాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: అతనికి ఇరవై ఒక్క సంవత్సరాలు
  rationale: హీబ్రూ వయస్సు సూత్రంలోని ‘బెన్ + సంఖ్య’ను అక్షరార్థంగా ‘కుమారుడు’ అని కాకుండా, సహజమైన ఆధునిక తెలుగు వయస్సు వ్యక్తీకరణగా అనువదించాం.
- source_word: צִדְקִיָּהוּ
  choice: సిద్కియా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בְמָלְכוֹ
  choice: రాజైనప్పుడు
  rationale: ఈ నిర్మాణం అతడు రాజ్యాధికారం చేపట్టిన సమయాన్ని సూచిస్తుంది; ‘రాజైనప్పుడు’ సంక్షిప్తంగా, సహజంగా ఆ కాలసంబంధ భావాన్ని తెలియజేస్తుంది.
- source_word: וְאַחַת עֶשְׂרֵה שָׁנָה
  choice: పదకొండు సంవత్సరాలు
  rationale: ఇది అతని పరిపాలన కాలవ్యవధిని నేరుగా సూచించే సంఖ్యా వ్యక్తీకరణ.
- source_word: מָלַךְ
  choice: పరిపాలించాడు
  rationale: రాజుగా పాలించిన భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: స్థలార్థక ఉపసర్గతో ఉన్న పట్టణనామాన్ని తెలుగులో సహజమైన స్థానవిభక్తితో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: సాధారణ ఆధునిక పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన ప్రామాణిక తెలుగు. మూలంలోని రెండు రాజ్యకాల సూత్రాలను రెండు సంక్షిప్త వాక్యాలుగా అందించి సహజ పఠనాన్ని నిలిపాం.
