- from: సిద్కియా రాజైనప్పుడు అతనికి ఇరవై ఒక్క సంవత్సరాలు. అతడు యెరూషలేములో పదకొండు సంవత్సరాలు పరిపాలించాడు.
  to: సిద్కియా రాజైనప్పుడు అతనికి ఇరవై ఒక్క సంవత్సరాల వయసు. అతడు యెరూషలేములో పదకొండు సంవత్సరాలు రాజుగా పరిపాలించాడు.
