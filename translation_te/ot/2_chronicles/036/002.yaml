  text: Jehoahaz was twenty-three years old when he became king[a], and he reigned three months in Jerusalem.
translation:
  language: te
  text: యెహోయాహాజు ఇరవైమూడు సంవత్సరాల వయసులో రాజయ్యాడు[a]. అతడు యెరూషలేములో మూడు నెలలు పరిపాలించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఇరవైమూడు సంవత్సరాల కుమారుడు’—వయస్సును తెలిపే సాధారణ హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שָׁלֹשׁ וְעֶשְׂרִים שָׁנָה
  choice: అతనికి ఇరవైమూడు సంవత్సరాలు
  rationale: ‘ఇన్ని సంవత్సరాల కుమారుడు’ అనే హీబ్రూ వయస్సు నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా, అర్థం యథాతథంగా ఉండేలా అనువదించాం.
- source_word: יוֹאָחָז
  choice: యెహోయాహాజు
  rationale: హీబ్రూ వ్యక్తినామంలోని ధ్వనిరూపాన్ని అనుసరించి, తెలుగులో గుర్తించదగిన బైబిలు నామరూపాన్ని వాడాం.
- source_word: בְּמָלְכוֹ
  choice: రాజైనప్పుడు
  rationale: ఈ నిర్మాణం అతడు రాజ్యాధికారం చేపట్టిన సమయాన్ని సూచిస్తుంది; ‘రాజైనప్పుడు’ సంక్షిప్తమైన సహజ తెలుగు ప్రయోగం.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים
  choice: మూడు నెలలు
  rationale: సంఖ్యను, కాలపరిమాణాన్ని నేరుగా తెలిపే సహజ తెలుగు రూపం.
- source_word: מָלַךְ
  choice: పరిపాలించాడు
  rationale: రాజుల పాలనకాల ప్రకటనలో రాజుగా పాలించడాన్ని స్పష్టంగా, సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: స్థలాన్ని సూచించే בְּ ఉపసర్గను తెలుగు స్థానవాచక ప్రత్యయం ‘లో’తో నేరుగా అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజుల పాలనకాల వివరాలకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలిని వాడాం. హీబ్రూ వయస్సు నుడికారాన్ని ప్రధాన పాఠ్యంలో సహజీకరించి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
