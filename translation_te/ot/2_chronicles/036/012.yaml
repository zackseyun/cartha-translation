  source_fidelity: 'హీబ్రూ వాక్యంలోని రెండు ప్రధాన ప్రకటనలను విశ్వసనీయంగా నిలిపింది: అతడు తన దేవుడైన యాహ్వే దృష్టిలో చెడ్డది చేశాడు; యాహ్వే నోటినుండి పలికిన యిర్మీయా ప్రవక్త ఎదుట తనను తాను తగ్గించుకోలేదు. נִכְנַע యొక్క ఆత్మవాచక/మధ్యమ భావం, అలాగే מִפִּי יְהוָה యొక్క ప్రవచన-మధ్యవర్తిత్వ ప్రయోగం సముచితంగా ప్రతిఫలించాయి.'
