source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ הָ/רַ֔ע בְּ/עֵינֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו לֹ֣א נִכְנַ֗ע מִ/לִּ/פְנֵ֛י יִרְמְיָ֥הוּ הַ/נָּבִ֖יא מִ/פִּ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/012.yaml
  text: He did what was evil in the eyes of Yahweh his God[a], and he did not humble himself before Jeremiah the prophet, who spoke from the mouth of Yahweh.
translation:
  language: te
  text: అతడు తన దేవుడైన యాహ్వే దృష్టిలో చెడ్డది చేశాడు. యాహ్వే నోటినుండి పలికిన[a] యిర్మీయా ప్రవక్త ఎదుట అతడు తనను తాను తగ్గించుకోలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యాహ్వే నోటినుండి”; భావం, యాహ్వే తరఫున లేదా ఆయన ఆజ్ఞ ప్రకారం.
    reason: హీబ్రూ ప్రవచన మధ్యవర్తిత్వ నుడికారంలోని అక్షరార్థ రూపకాన్నీ దాని భావాన్నీ చూపించడానికి.
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: చెడ్డది చేశాడు
  rationale: హీబ్రూ మూలంలోని సాధారణ నైతిక మూల్యాంకన సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּעֵינֵי יְהוָה אֱלֹהָיו
  choice: తన దేవుడైన యాహ్వే దృష్టిలో
  rationale: ‘కళ్లలో’ అనే హీబ్రూ నుడికారానికి తెలుగులో సహజమైన ‘దృష్టిలో’ను వాడి, ‘తన దేవుడు’ అనే ఒడంబడిక సంబంధ సూచనను నిలిపింది; יְהוָה అనే దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- source_word: לֹא נִכְנַע
  choice: తనను తాను తగ్గించుకోలేదు
  rationale: నిఫాల్ రూపానికి ఈ సందర్భంలో ఉన్న ఆత్మవాచక/మధ్యమ భావాన్ని నిలిపి, అతడు వినయంతో లోబడటానికి నిరాకరించాడనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִלִּפְנֵי יִרְמְיָהוּ הַנָּבִיא
  choice: యిర్మీయా ప్రవక్త ఎదుట
  rationale: మూలంలోని సంబంధాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది; ప్రవక్త అనే అధికారపూర్వక బిరుదును స్పష్టంగా ఉంచుతుంది.
- source_word: מִפִּי יְהוָה
  choice: యాహ్వే నోటినుండి పలికిన
  rationale: ‘యాహ్వే నోటినుండి’ అనే సజీవమైన ప్రవచన మధ్యవర్తిత్వ రూపకాన్ని నిలిపి, తెలుగులో వాక్యసంబంధం స్పష్టమయ్యేందుకు ‘పలికిన’ను పూరించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాకుండా చతురక్షర దైవనామమే ఉంది; అందువల్ల వ్యక్తిగత ఒడంబడిక నామాన్ని లిప్యంతరీకరించి నిలిపింది.
- issue: נִכְנַע యొక్క క్రియాభావం
  choice: తనను తాను తగ్గించుకోలేదు
  alternative: తగ్గించబడలేదు / లోబడలేదు
  rationale: సందర్భం సిద్కియా స్వచ్ఛంద వినయలేమిని నైతికంగా పేర్కొంటుంది. ఆత్మవాచక రూపం ఈ బాధ్యతను నిలుపుతుంది; ‘లోబడలేదు’ అనే భావం కూడా పదంలో అంతర్లీనంగా ఉంది.
- issue: מִפִּי יְהוָה మరియు యిర్మీయా మధ్య సంబంధం
  choice: యాహ్వే నోటినుండి పలికిన యిర్మీయా
  alternative: యాహ్వే ఆజ్ఞ ప్రకారం పలికిన యిర్మీయా
  rationale: మూలంలోని ‘నోరు’ రూపకాన్ని తొలగించకుండా, యిర్మీయా యాహ్వే సందేశాన్ని పలికిన ప్రవక్త అని వాక్యనిర్మాణంలో స్పష్టం చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం వాడుతూ, చరిత్రగ్రంథానికి తగిన గంభీరతను మరియు మూలపాఠంలోని దైవనామం, నైతిక మూల్యాంకనం, ప్రవచనాధికారాన్ని నిలిపింది.
