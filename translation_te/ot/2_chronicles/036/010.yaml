revisions:
- from: సంవత్సరం మళ్లినప్పుడు[a], నెబుకద్నెజరు రాజు మనుషులను పంపి, అతణ్ణి యెహోవా మందిరంలోని అమూల్యమైన పాత్రలతోపాటు[b] బబులోనుకు రప్పించాడు. అతని సహోదరుడైన[c] సిద్కియాను యూదా, యెరూషలేముల మీద రాజుగా నియమించాడు.
