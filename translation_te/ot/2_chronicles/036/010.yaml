source:
  edition: WLC
  text: וְ/לִ/תְשׁוּבַ֣ת הַ/שָּׁנָ֗ה שָׁלַח֙ הַ/מֶּ֣לֶךְ נְבֽוּכַדְנֶאצַּ֔ר וַ/יְבִאֵ֣/הוּ בָבֶ֔לָ/ה עִם כְּלֵ֖י חֶמְדַּ֣ת בֵּית יְהוָ֑ה וַ/יַּמְלֵךְ֙ אֶת צִדְקִיָּ֣הוּ אָחִ֔י/ו עַל יְהוּדָ֖ה וִֽ/ירוּשָׁלִָֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/010.yaml
  text: At the turn of the year[a], King Nebuchadnezzar sent and brought him to Babylon, along with the precious vessels of the house of Yahweh[c][b], and made his brother Zedekiah king over Judah and Jerusalem.
translation:
  language: te
  text: సంవత్సరం మళ్లినప్పుడు[a], నెబుకద్నెజరు రాజు పంపించి, అతణ్ణి యెహోవా మందిరంలోని విలువైన పాత్రలతోపాటు[b] బబులోనుకు తీసుకువెళ్లాడు. అతని సహోదరుడైన[c] సిద్కియాను యూదా, యెరూషలేములపై రాజుగా నియమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘సంవత్సరం తిరిగి వచ్చినప్పుడు’; అంటే సంవత్సరం మళ్లీ ఆ సమయానికి వచ్చినప్పుడు అనే కాలసూచక నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘యెహోవా మందిరంలోని ప్రియమైన/కోరదగిన ఉపకరణాలతోపాటు.’
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ పాఠ్యంలో ‘అతని సహోదరుడు’ అని ఉంది. సిద్కియా యెహోయాకీనుకు సన్నిహిత రాజవంశీయ బంధువు; మరింత నిర్దిష్టంగా చెప్పాలంటే అతని తండ్రి సోదరుడు.
    reason: cultural_note
lexical_decisions:
- source_word: וְלִתְשׁוּבַת הַשָּׁנָה
  choice: సంవత్సరం మళ్లినప్పుడు
  rationale: ‘సంవత్సరం తిరిగి రావడం/మళ్లడం’ అనే హీబ్రూ కాలసూచక నుడికారాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ‘వసంతకాలంలో’ అని మూలంలో స్పష్టంగా లేని ఋతువును నిర్దిష్టం చేయదు.
- source_word: שָׁלַח ... וַיְבִאֵהוּ
  choice: మనుషులను పంపి, అతణ్ణి ... రప్పించాడు
  rationale: ‘పంపాడు, అతణ్ణి తీసుకొచ్చాడు’ అనే వరుస చర్యలను తెలుగులో సహజమైన కార్యసాధక భావంతో వ్యక్తం చేస్తుంది. ‘మనుషులను’ అనేది పంపబడిన ప్రతినిధులను సూచించే సందర్భానుగుణ పూరకం.
- source_word: בָבֶלָה
  choice: బబులోనుకు
  rationale: దిశను సూచించే హీబ్రూ ప్రత్యయాన్ని తెలుగులో గమ్యార్థక విభక్తితో స్పష్టంగా తెలియజేస్తుంది.
- source_word: כְּלֵי חֶמְדַּת
  choice: అమూల్యమైన పాత్రలు
  rationale: כְּלֵי అనే ‘పాత్రలు/ఉపకరణాలు’ భావాన్నీ, חֶמְדַּת అనే విలువైన లేదా ప్రీతికరమైన భావాన్నీ ఆలయ సామగ్రికి తగిన గౌరవప్రదమైన భాషలో అందిస్తుంది.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: ‘యెహోవా గృహం’ అనే మూలభావాన్ని ఆధునిక తెలుగు పాఠకులకు సహజంగా అర్థమయ్యే ‘మందిరం’తో వ్యక్తం చేస్తూ, దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరిస్తుంది.
- source_word: וַיַּמְלֵךְ
  choice: రాజుగా నియమించాడు
  rationale: హిఫిల్ రూపంలోని ‘రాజుగా చేశాడు/పాలింపజేశాడు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אָחִיו
  choice: అతని సహోదరుడైన
  rationale: మూలంలోని ‘అతని సోదరుడు’ అనే బంధుత్వ పదాన్ని ప్రధాన పాఠ్యంలో అలాగే నిలుపుతుంది; వంశావళి పరంగా సిద్కియా యెహోయాకీను మామ అని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: עַל יְהוּדָה וִירוּשָׁלָם
  choice: యూదా, యెరూషలేముల మీద
  rationale: עַל సూచించే పాలనా పరిధిని ‘మీద’తో తెలిపి, రాజ్యాన్నీ దాని రాజధానినీ కలిపి మూలానుసారంగా ఉంచుతుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠ్యంలో ఉన్న వ్యక్తిగత ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో అందిస్తుంది.
- issue: אָחִיו అనే బంధుత్వ పదం మరియు వంశావళి సంబంధం
  choice: ప్రధాన పాఠ్యంలో ‘సహోదరుడు’; పాదటిప్పణిలో ‘మామ/సన్నిహిత రాజవంశీయ బంధువు’ అని వివరణ
  alternative: ప్రధాన పాఠ్యంలోనే ‘మామ’ లేదా ‘బంధువు’
  rationale: హీబ్రూ పదరూపాన్ని సవరించకుండా కాపాడుతూ, చారిత్రక వంశావళి వివరంతో కనిపించే ఉద్రిక్తతను దాచకుండా వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. హీబ్రూ నుడికారాన్ని పూర్తిగా చెరపకుండా సహజీకరించబడింది. ‘అమూల్యమైన పాత్రలు,’ ‘సహోదరుడు’ వంటి పదాలు మూలంలోని భావవ్యాప్తి మరియు చారిత్రక ఉద్రిక్తతను కాపాడుతాయి.
