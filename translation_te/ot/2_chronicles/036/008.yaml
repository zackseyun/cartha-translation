source:
  edition: WLC
  text: וְ/יֶתֶר֩ דִּבְרֵ֨י יְהֽוֹיָקִ֜ים וְ/תֹֽעֲבֹתָ֤י/ו אֲשֶׁר עָשָׂה֙ וְ/הַ/נִּמְצָ֣א עָלָ֔י/ו הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר מַלְכֵ֥י יִשְׂרָאֵ֖ל וִֽ/יהוּדָ֑ה וַ/יִּמְלֹ֛ךְ יְהוֹיָכִ֥ין בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/008.yaml
  text: The rest of the acts of Jehoiakim[a], and the abominations that he did, and what was found against him—behold, they are written in the Book of the Kings of Israel and Judah. And Jehoiachin his son reigned in his place.
translation:
  language: te
  text: యెహోయాకీము చేసిన మిగిలిన కార్యాలు, అతడు చేసిన హేయకార్యాలు, అతనికి వ్యతిరేకంగా బయటపడిన సంగతులు[a]—ఇవన్నీ ఇశ్రాయేలు, యూదా రాజుల గ్రంథంలో రాయబడి ఉన్నాయి. అతని కుమారుడైన యెహోయాకీను అతని స్థానంలో రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని గురించి బయటపడిన సంగతులు.” హీబ్రూ పదబంధం యెహోయాకీమును గురించి తెలిసిన విషయాలను సాధారణంగా సూచించవచ్చు; అయితే ప్రతికూల సందర్భానికి “అతనికి వ్యతిరేకంగా” అనే అనువాదం బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹיָקִים
  choice: యెహోయాకీము చేసిన మిగిలిన కార్యాలు
  rationale: రాజుల పాలనను సంగ్రహించే సూత్రప్రయోగంలో דִּבְרֵי అనేది మాటలకంటే కార్యాలు లేదా పాలనకు సంబంధించిన సంగతులను సూచిస్తుంది. సహజమైన తెలుగుకోసం వ్యక్తి పేరుతో ‘చేసిన’ను జోడించాం.
- source_word: וְתֹעֲבֹתָיו אֲשֶׁר עָשָׂה
  choice: అతడు చేసిన హేయకార్యాలు
  rationale: תֹּעֵבָה యొక్క బలమైన నైతిక లేదా ఆరాధనాపరమైన అసహ్య భావాన్ని ‘హేయకార్యాలు’ స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְהַנִּמְצָא עָלָיו
  choice: అతనికి వ్యతిరేకంగా బయటపడిన సంగతులు[a]
  rationale: נמצא యొక్క కనుగొనబడిన లేదా బయటపడిన భావాన్ని, עָלָיוకు సందర్భంలో సాధ్యమైన ప్రతికూల భావాన్ని నిలుపుతుంది; అయితే ‘అతని గురించి’ అనే సాధారణ అర్థసంభావ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: הִנָּם כְּתוּבִים
  choice: ఇవన్నీ ... రాయబడి ఉన్నాయి
  rationale: హీబ్రూ దృష్టి ఆకర్షించే הִנָּםను తెలుగులో అసహజమైన ‘ఇదిగో’తో కాకుండా ‘ఇవన్నీ’ అనే సూచనాత్మక బలంతో సహజంగా వ్యక్తం చేశాం.
- source_word: סֵפֶר מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: ఇశ్రాయేలు, యూదా రాజుల గ్రంథం
  rationale: ఇది సూచించబడిన రాజవృత్తాంత గ్రంథానికి శీర్షికవంటి ప్రస్తావన; మూలంలోని రెండు రాజ్యాల పేర్లను యథాతథంగా ఉంచుతుంది.
- source_word: וַיִּמְלֹךְ יְהוֹיָכִין בְּנוֹ תַּחְתָּיו
  choice: అతని కుమారుడైన యెహోయాకీను అతని స్థానంలో రాజయ్యాడు
  rationale: וַיִּמְלֹךְ ఇక్కడ సింహాసనారోహణాన్ని ముందుకు నడిపే కథన రూపం; ‘రాజయ్యాడు’ ఆధునిక తెలుగులో ‘అతని స్థానంలో’ అనే వారసత్వ భావంతో సహజంగా సరిపోతుంది.
theological_decisions:
- issue: וְהַנִּמְצָא עָלָיו యొక్క ప్రతికూల లేదా సాధారణ సంబంధార్థం
  choice: అతనికి వ్యతిరేకంగా బయటపడిన సంగతులు
  alternative: అతని గురించి బయటపడిన సంగతులు
  rationale: ముందున్న హేయకార్యాల ప్రతికూల సందర్భం ‘వ్యతిరేకంగా’ అనే అర్థానికి మద్దతిస్తుంది; అయినా హీబ్రూ నిర్మాణం సాధారణంగా ‘అతని గురించి’ అని కూడా అర్థమయ్యే అవకాశం ఉన్నందున ఆ అస్పష్టతను పాదటిప్పణిలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక కథన శైలి. ‘హేయకార్యాలు’ మూలంలోని బలమైన నైతిక మూల్యాంకనాన్ని నిలుపుతుంది; ‘ఇవన్నీ ... రాయబడి ఉన్నాయి’ హీబ్రూ సూచనాత్మక బలాన్ని తెలుగులో సహజంగా అందిస్తుంది.
