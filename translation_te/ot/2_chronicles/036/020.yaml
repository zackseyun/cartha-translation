source:
  edition: WLC
  text: וַ/יֶּ֛גֶל הַ/שְּׁאֵרִ֥ית מִן הַ/חֶ֖רֶב אֶל בָּבֶ֑ל וַֽ/יִּהְיוּ ל֤/וֹ וּ/לְ/בָנָי/ו֙ לַ/עֲבָדִ֔ים עַד מְלֹ֖ךְ מַלְכ֥וּת פָּרָֽס־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/020.yaml
  text: He carried into exile to Babylon the remnant who had escaped the sword[a], and they became servants to him and to his sons until the reign of the kingdom of Persia.
translation:
  language: te
  text: ఖడ్గం నుండి తప్పించుకుని మిగిలినవారిని అతడు బబులోనుకు చెరగా తీసుకెళ్లాడు. వారు అతనికీ అతని కుమారులకూ బానిసలయ్యారు; పారసీక రాజ్యం పాలన ప్రారంభమయ్యే వరకు అలాగే ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: చెరగా తీసుకెళ్లాడు
  rationale: గלה హిఫీల్ రూపం బలవంతంగా దేశం నుంచి తరలించి ప్రవాసంలో ఉంచడాన్ని సూచిస్తుంది. ‘చెరగా తీసుకెళ్లాడు’ ఆధునిక తెలుగులో ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַשְּׁאֵרִית מִן הַחֶרֶב
  choice: ఖడ్గం నుంచి తప్పించుకుని మిగిలినవారిని
  rationale: అక్షరార్థంగా ‘ఖడ్గం నుంచి మిగిలినవారు.’ యుద్ధహత్య నుంచి బతికిన శేషాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֶל בָּבֶל
  choice: బబులోనుకు
  rationale: దిశను సూచించే సరళమైన భౌగోళిక పదబంధం.
- source_word: וַיִּהְיוּ לוֹ וּלְבָנָיו לַעֲבָדִים
  choice: వారు అతనికీ అతని కుమారులకూ బానిసలుగా ఉండి ... వారికి లోబడి ఉన్నారు
  rationale: עֲבָדִים అనే పదానికి ‘సేవకులు’ లేదా ‘బానిసలు’ అనే రెండు అర్థాలు సాధ్యమే. జయాపజయం, బలవంతపు చెర, సామ్రాజ్యాధీనత అనే సందర్భం వల్ల ‘బానిసలు’ ప్రధాన పాఠంగా ఎంచుకోబడింది; లోబడిన స్థితిని తెలుగు వాక్యం స్పష్టం చేస్తుంది.
- source_word: עַד מְלֹךְ מַלְכוּת פָּרָס
  choice: పారసీక రాజ్యం అధికారంలోకి వచ్చే వరకు
  rationale: మְלֹךְ ఇక్కడ పారసీక పరిపాలన ప్రారంభమవడాన్ని లేదా స్థాపితమవడాన్ని సూచిస్తుంది. ఈ తెలుగు రూపం కాలపరిమితిని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: జయించి చెరపట్టిన ప్రజల עֲבָדִים స్థితి
  choice: బానిసలు
  alternative: సేవకులు
  rationale: హీబ్రూ పదం రెండు అర్థాలను అనుమతించినా, యుద్ధంలో బతికినవారిని బలవంతంగా బబులోనుకు తరలించి రాజవంశానికి లోబరచిన సందర్భం బానిసత్వ భావానికే ఎక్కువ బలం ఇస్తుంది. ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపి అసలు పదంలోని భావవిస్తృతిని సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘ఖడ్గం’ బైబిలీయ గంభీరతను నిలుపుతుంది; ‘చెరగా తీసుకెళ్లాడు’ బలవంతపు ప్రవాసాన్ని సహజంగా తెలియజేస్తుంది. పాదసూచిక గుర్తు సంబంధిత ‘బానిసలుగా’ అన్న పదం వెంట ఉంచబడింది.
