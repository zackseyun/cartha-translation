id: 2CH.36.18
reference: 2 Chronicles 36:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֠/כֹל כְּלֵ֞י בֵּ֤ית הָ/אֱלֹהִים֙ הַ/גְּדֹלִ֣ים וְ/הַ/קְּטַנִּ֔ים וְ/אֹֽצְרוֹת֙ בֵּ֣ית יְהוָ֔ה וְ/אֹצְר֥וֹת הַ/מֶּ֖לֶךְ וְ/שָׂרָ֑י/ו הַ/כֹּ֖ל הֵבִ֥יא בָבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/018.yaml
  text: And all the vessels of the house of God[a], great and small, and the treasures of the house of Yahweh[b], and the treasures of the king and of his officials—all this he brought to Babylon.
translation:
  language: te
  text: దేవుని మందిరంలోని పెద్దవీ చిన్నవీ అయిన పాత్రలన్నిటినీ, యహ్వే మందిరపు నిధులనూ[a], రాజు నిధులనూ అతని అధికారుల నిధులనూ[b]—వీటన్నిటినీ అతడు బబులోనుకు తీసుకెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిధులు’ అని అనువదించిన హీబ్రూ పదానికి ‘నిధిగదులు’ లేదా ‘గిడ్డంగులు’ అనే అర్థం కూడా రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘అధికారులు’ అని అనువదించిన హీబ్రూ పదాన్ని ‘రాజకుమారులు’ లేదా ‘పాలకులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל כְּלֵי בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరంలోని ... పాత్రలన్నిటినీ
  rationale: כְּלֵי అనేది ఆలయానికి సంబంధించిన పాత్రలు, ఉపకరణాలు, ఇతర వస్తువులను సూచించగల విస్తృత పదం. ఈ సందర్భంలో ‘పాత్రలు’ సహజంగా ఉండి ఆలయ దోపిడీ భావాన్ని స్పష్టంగా తెలియజేస్తుంది; בֵּית అనే హీబ్రూ నుడికారాన్ని తెలుగులో స్పష్టత కోసం ‘మందిరం’గా ఇచ్చాం.
- source_word: הַגְּדֹלִים וְהַקְּטַנִּים
  choice: పెద్దవీ చిన్నవీ అయిన
  rationale: పరిమాణం లేదా ప్రాముఖ్యతలోని సమస్త వస్తువులను కలుపుకునే హీబ్రూ జంటపదాన్ని సహజమైన తెలుగు రూపంలో నిలిపింది.
- source_word: וְאֹצְרוֹת בֵּית יְהוָה
  choice: యహ్వే మందిరపు నిధులనూ
  rationale: אֹצְרוֹת అనేది నిధులను లేదా నిధిగదులను సూచించవచ్చు. అవి బబులోనుకు తరలించబడినందున ఇక్కడ ‘నిధులు’ సందర్భోచితం. יהוה అనే వ్యక్తిగత దైవనామాన్ని ‘యహ్వే’గా లిప్యంతరీకరించాం.
- source_word: וְאֹצְרוֹת הַמֶּלֶךְ וְשָׂרָיו
  choice: రాజు నిధులనూ అతని అధికారుల నిధులనూ
  rationale: שָׂרָיו అనే పదం రాజకుమారులు, పాలకులు, ఉన్నతాధికారులు అనే విస్తృత అర్థాలను కలిగి ఉంది. ఆధునిక పాఠకులకు స్పష్టంగా ఉండే విస్తృత పదంగా ‘అధికారులు’ను ఎంచుకున్నాం.
- source_word: הַכֹּל
  choice: వీటన్నిటినీ
  rationale: ముందు పేర్కొన్న మొత్తం జాబితాను తిరిగి సమగ్రంగా సూచించే హీబ్రూ పదబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הֵבִיא בָבֶל
  choice: బబులోనుకు తీసుకెళ్లాడు
  rationale: హీబ్రూ క్రియ ప్రాథమికంగా ‘తెచ్చాడు/తీసుకొచ్చాడు’ అని అర్థమివ్వగలిగినా, యూదా నుండి బబులోనుకు తరలింపును తెలుగు కథన దృష్టికోణంలో ‘తీసుకెళ్లాడు’ అని చెప్పడం సహజం; గమ్యస్థానం యథాతథంగా నిలిచింది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- issue: הֵבִיא అనే ఏకవచన క్రియకు కర్త
  choice: అతడు
  alternative: బబులోను రాజు / నెబుకద్నెజరు
  rationale: ఈ వచనంలో కర్త పేరు ప్రత్యక్షంగా లేదు; సందర్భం ద్వారా తెలిసే వ్యక్తిని పేరుతో నింపకుండా మూలంలోని అంతర్నిహిత కర్తను ‘అతడు’గా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. జాబితా లయను నిలుపుతూ, చివరి సమగ్ర పదబంధాన్ని దీర్ఘ విరామంతో ప్రత్యేకంగా చూపించాం.
