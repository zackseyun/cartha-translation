  text: וַ/יִּקְחוּ֙ עַם הָ/אָ֔רֶץ אֶת יְהוֹאָחָ֖ז בֶּן יֹאשִׁיָּ֑הוּ וַ/יַּמְלִיכֻ֥/הוּ תַֽחַת אָבִ֖י/ו בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/001.yaml
  text: Then the people of the land took Jehoahaz son of Josiah and made him king in Jerusalem in place of his father[a].
translation:
  language: te
  text: అప్పుడు దేశ ప్రజలు యోషీయా కుమారుడైన యెహోయాహాజును తీసుకొని, అతని తండ్రి స్థానంలో యెరూషలేములో రాజుగా నియమించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేశంలోని సామాన్య ప్రజలు.” “దేశ ప్రజలు” అనే హీబ్రూ పదబంధం దేశంలోని జనసమూహాన్ని సూచించవచ్చు; కొన్ని సందర్భాల్లో వారిలోని ఒక ప్రత్యేక సామాజిక వర్గాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: తీసుకొని
  rationale: לקח అనే క్రియను ఇక్కడ ఒక కార్యం కోసం వ్యక్తిని తీసుకోవడం లేదా ఎంపిక చేయడం అనే సహజ అర్థంలో అనువదించాం. బలవంతంగా పట్టుకున్నారని వచనం స్పష్టంగా చెప్పనందున ‘పట్టుకొని’ అనే బలమైన భావాన్ని నివారించాం.
- source_word: עַם הָאָרֶץ
  choice: దేశ ప్రజలు
  rationale: హీబ్రూ పదబంధంలోని విస్తృత భావాన్ని నిలుపుతూ, దానిని ముందుగానే ఒక నిర్దిష్ట సామాజిక వర్గానికి పరిమితం చేయకుండా ఆధునిక తెలుగులో సహజంగా ఇచ్చాం.
- source_word: יְהוֹאָחָז
  choice: యెహోయాహాజు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: యోషీయా కుమారుడైన
  rationale: వంశసంబంధాన్ని తెలుగులో సహజమైన విశేషణ నిర్మాణంతో నేరుగా తెలిపాం.
- source_word: וַיַּמְלִיכֻהוּ
  choice: రాజుగా నియమించారు
  rationale: מלך క్రియ యొక్క హిఫీల్ రూపం ‘ఒకరిని రాజుగా చేయడం’ అనే కారణార్థాన్ని ఇస్తుంది. ‘పట్టాభిషేకం చేశారు’ అంటే మూలంలో లేని ఆచార వివరాన్ని చేర్చే అవకాశం ఉన్నందున దాన్ని ఉపయోగించలేదు.
- source_word: תַּחַת אָבִיו
  choice: అతని తండ్రి స్థానంలో
  rationale: תחת ఇక్కడ ప్రాదేశికంగా ‘కింద’ అని కాకుండా రాజ్య వారసత్వంలో స్థానాన్ని భర్తీ చేయడాన్ని సూచిస్తుంది.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: స్థల నామంతో కూడిన ב ఉపసర్గను తెలుగులో సహజంగా ‘లో’ విభక్తితో అనువదించాం.
