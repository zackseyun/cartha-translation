translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా తెలుగు వాక్యప్రవాహానికి అనుగుణంగా అమర్చాం; అయితే మూలంలోని భావపరమైన విస్తృతిని నిలిపాం.
