translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; చారిత్రక వర్ణనకు తగిన గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. రాజకీయ చర్యను సహజంగా తెలిపేందుకు ‘పదవి నుండి తొలగించి’ వాడి, హీబ్రూ క్రియలోని ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో సంరక్షించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
