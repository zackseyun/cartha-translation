  text: וַ/יְסִירֵ֥/הוּ מֶֽלֶךְ מִצְרַ֖יִם בִּֽ/ירוּשָׁלִָ֑ם וַֽ/יַּעֲנֹשׁ֙ אֶת הָ/אָ֔רֶץ מֵאָ֥ה כִכַּר כֶּ֖סֶף וְ/כִכַּ֥ר זָהָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/003.yaml
  text: And the king of Egypt deposed him in Jerusalem and imposed on the land a tribute of a hundred talents of silver and a talent of gold[a][b][c].
translation:
  language: te
  text: ఈజిప్టు రాజు యెరూషలేములో అతన్ని పదవి నుండి తొలగించి,[a] దేశంపై వంద తలాంతుల వెండి, ఒక తలాంతు బంగారం జరిమానా విధించాడు.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతన్ని తీసివేశాడు’; హీబ్రూ క్రియ ఒకరిని పదవి నుండి తొలగించడాన్నీ, అతన్ని తీసుకుపోవడాన్నీ సూచించగలదు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘దేశం మీద కప్పం విధించాడు’; ఇక్కడి క్రియ ధనపరమైన దండాన్ని విధించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: తలాంతు ఒక పెద్ద ప్రాచీన బరువు ప్రమాణం; దాన్ని ఆధునిక కొలతలోకి మార్చకుండా మూలంలోని ప్రమాణాన్నే ఉంచాం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְסִירֵהוּ
  choice: అతన్ని పదవి నుండి తొలగించి
  rationale: సూర్ అనే క్రియకు హిఫీల్ రూపంలో ‘తొలగించు’ లేదా ‘తీసివేయు’ అనే అర్థం ఉంది. రాజసంబంధ సందర్భంలో యెహోయాహాజును అధికార స్థానం నుండి తొలగించడం ప్రధాన భావం; ‘పదవి నుండి’ అనేది సహజమైన తెలుగులో సందర్భాన్ని స్పష్టం చేస్తుంది, కాగా పాఠంలోని విస్తృత భావసాధ్యతను పాదసూచికలో ఉంచుతుంది.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: ఈజిప్టు రాజు
  rationale: హీబ్రూ సమాస నిర్మాణానికి సహజమైన తెలుగు రూపం. ఈ వచనంలో పేరు లేకుండా బిరుదే ఉన్నందున ఫరో నెకో పేరును చేర్చలేదు.
- source_word: בִּירוּשָׁלָם
  choice: యెరూషలేములో
  rationale: ב ఇక్కడ స్థలాన్ని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘యెరూషలేములో’ సహజమైన రూపం.
- source_word: וַיַּעֲנֹשׁ
  choice: జరిమానాగా విధించాడు
  rationale: ענשׁ ఇక్కడ పేర్కొన్న మొత్తాన్ని ఆర్థిక దండంగా విధించడాన్ని సూచిస్తుంది. ‘జరిమానాగా విధించాడు’ అనే రూపం ‘శిక్షించాడు’ కంటే నిర్దిష్టంగా, ‘కప్పం విధించాడు’ కంటే మూలక్రియలోని దండన భావానికి దగ్గరగా ఉంది.
- source_word: הָאָרֶץ
  choice: దేశం మీద
  rationale: ఇక్కడ אָרֶץ సాధారణంగా భూమిని కాదు, యూదా దేశాన్ని లేదా రాజ్యప్రాంతాన్ని సూచిస్తుంది. ‘దేశం’ ఆధునిక పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: מֵאָה כִכַּר כֶּסֶף
  choice: వంద తలాంతుల వెండిని
  rationale: כִּכָּר అనే ప్రాచీన బరువు ప్రమాణాన్ని అంచనా ఆధునిక మార్పిడితో భర్తీ చేయకుండా సంప్రదాయ తెలుగు రూపమైన ‘తలాంతు’తో నిలిపింది.
- source_word: וְכִכַּר זָהָב
  choice: ఒక తలాంతు బంగారాన్ని
  rationale: మూలంలోని ఏకవచన ప్రమాణాన్ని స్పష్టంగా నిలిపింది; ముందటి వెండి మొత్తంతో సమాంతరంగా సహజమైన తెలుగు వాక్యనిర్మాణం వాడింది.
