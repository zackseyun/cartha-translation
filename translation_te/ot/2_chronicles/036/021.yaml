source:
  edition: WLC
  text: לְ/מַלֹּ֤אות דְּבַר יְהוָה֙ בְּ/פִ֣י יִרְמְיָ֔הוּ עַד רָצְתָ֥ה הָ/אָ֖רֶץ אֶת שַׁבְּתוֹתֶ֑י/הָ כָּל יְמֵ֤י הָשַּׁמָּ/ה֙ שָׁבָ֔תָה לְ/מַלֹּ֖אות שִׁבְעִ֥ים שָׁנָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/021.yaml
  text: to fulfill the word of Yahweh by the mouth of Yirmeyahu[a], until the land had enjoyed its Sabbaths. All the days of its desolation it kept Sabbath[d][c][b], to fulfill seventy years.
translation:
  language: te
  text: యిర్మీయా నోటి ద్వారా[a] పలికిన యాహ్వే వాక్యం నెరవేరడానికి, దేశం తన సబ్బాతులను అనుభవించే వరకు, అది పాడుగా ఉన్న రోజులన్నిటిలో సబ్బాతు ఆచరించింది[b][c][d]—డెబ్బై సంవత్సరాలు పూర్తికావడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యిర్మీయా ద్వారా.’ అక్షరార్థంగా, ‘యిర్మీయా నోటి ద్వారా.’
    reason: lexical_alternative
  - marker: b
    text: ‘అనుభవించింది’ అనే భావానికి ‘స్వీకరించింది’ లేదా ‘తనకు లోటైన సబ్బాతులను పూరించుకుంది’ అనే భావాలు కూడా ఉండవచ్చు. దేశానికి దక్కకుండా పోయిన సబ్బాతు విశ్రాంతి ఇప్పుడు దానికి దక్కిందని సందర్భం సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: దేశనిర్వాస సమయంలో దేశం తన సబ్బాతులను అనుభవిస్తుందనే నిబంధన హెచ్చరికను ఈ మాటలు ప్రతిధ్వనింపజేస్తాయి; లేవీయకాండము 26:34–35 చూడండి.
    reason: cross_reference
  - marker: d
    text: లేదా, ‘అది విశ్రాంతి తీసుకుంది.’ హీబ్రూలో ‘దాని సబ్బాతులు … అది సబ్బాతు ఆచరించింది/విశ్రాంతి తీసుకుంది’ అనే పదప్రయోగం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַלֹּאות
  choice: నెరవేరడానికి
  rationale: מלא అనే క్రియ యొక్క ఉద్దేశం లేదా ఫలితాన్ని తెలిపే రూపం ఇది. ప్రవచన వాక్యం కార్యరూపం దాల్చడాన్ని సహజమైన తెలుగులో ‘నెరవేరడానికి’ అని వ్యక్తపరుస్తుంది.
- source_word: דְּבַר יְהוָה
  choice: యాహ్వే వాక్యం
  rationale: ప్రవచనం నెరవేరే సందర్భంలో דָּבָר‌కు ‘వాక్యం’ సరైన భావాన్ని ఇస్తుంది; יהוה అనే వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: בְּפִי יִרְמְיָהוּ
  choice: యిర్మీయా నోటి ద్వారా
  rationale: ‘యిర్మీయా నోటితో/నోటి ద్వారా’ అనే మూలభాషా చిత్రాన్ని నిలుపుతూ, సహజమైన ఆధునిక తెలుగులో ‘నోటి ద్వారా’ అని ఇచ్చాం.
- source_word: רָצְתָה
  choice: అనుభవించే
  rationale: ఈ సందర్భంలో దేశం తనకు దక్కకుండా పోయిన సబ్బాతు విశ్రాంతిని పొందడం లేదా అనుభవించడం భావం. ప్రధాన పాఠ్యంలో సహజమైన ‘అనుభవించే’ను ఉంచి, ఇతర సాధ్య భావాలను పాదసూచికలో తెలిపాం.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ఇక్కడ సమస్త భూమి కాక, యూదా దేశమే ఉద్దేశం. ‘దేశం’ ఈ సందర్భాన్ని సాధారణ తెలుగు పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶת שַׁבְּתוֹתֶיהָ
  choice: తన సబ్బాతు విశ్రాంతులను
  rationale: దేశానికి సంబంధించిన బహువచన సబ్బాతులను సూచించే మూలరూపాన్ని, వాటి విశ్రాంతి భావంతో కలిపి నిలిపాం.
- source_word: כָּל יְמֵי הָשַּׁמָּה
  choice: అది పాడుగా ఉన్న రోజులన్నిటిలో
  rationale: దేశం నిర్జనంగా ఉన్న మొత్తం కాలాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో స్పష్టపరుస్తుంది.
- source_word: שָׁבָתָה
  choice: సబ్బాతు విశ్రాంతి పొందింది
  rationale: ‘విశ్రాంతి తీసుకుంది’ అనే సాధారణ అర్థంతోపాటు, ముందున్న ‘సబ్బాతులు’తో మూలంలోని పదబంధ సంబంధం కనిపించేలా ‘సబ్బాతు విశ్రాంతి’ను నిలిపాం.
- source_word: לְמַלֹּאות שִׁבְעִים שָׁנָה
  choice: ఆ విధంగా డెబ్బై సంవత్సరాలు నిండాయి
  rationale: డెబ్బై సంవత్సరాల కాలం పూర్తయిందనే భావాన్ని సహజమైన తెలుగులో ఇస్తుంది. ‘ఆ విధంగా’ అనేది దేశం పాడుగా ఉండి విశ్రాంతి పొందడం వల్ల ఆ కాలం నిండిందనే ఫలిత సంబంధాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: హీబ్రూ పాఠ్యంలో ఉన్న వ్యక్తిగత నామాన్ని బిరుదుగా మార్చకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించాం.
- issue: שַׁבְּתוֹתֶיהָ / שָׁבָתָהలోని సబ్బాతు భావం మరియు పదప్రయోగాన్ని ఎంత స్పష్టంగా నిలపాలి
  choice: తన సబ్బాతు విశ్రాంతులను … సబ్బాతు విశ్రాంతి పొందింది
  alternative: తన విశ్రాంతులను … విశ్రాంతి తీసుకుంది
  rationale: దేశనిర్వాస సమయంలో దేశం తన సబ్బాతులను అనుభవిస్తుందనే నిబంధన హెచ్చరికతో ఉన్న సంబంధాన్ని, అలాగే నామవాచకం–క్రియ మధ్య హీబ్రూ పదప్రయోగాన్ని కనిపించేలా ఉంచాం; దీనిని కేవలం సాధారణ విశ్రాంతిగా చదివేలా చేయలేదు.
- issue: רָצְתָה యొక్క భావపరిధి
  choice: అనుభవించే
  alternative: స్వీకరించే / తనకు లోటైన వాటిని పూరించుకునే
  rationale: ఈ క్రియకు ఈ సందర్భంలో ‘ఆనందించడం, స్వీకరించడం, లోటును పూరించుకోవడం’ వంటి భావసాధ్యతలు ఉన్నాయి. ప్రధాన పాఠ్యంలో ఒకే సిద్ధాంతార్థాన్ని బలవంతంగా నిర్ణయించకుండా సహజమైన పదాన్ని ఎంచుకుని, ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఈ వచనం మునుపటి వాక్యానికి వ్యాకరణపరంగా కొనసాగింపుగా ఉన్న మూల నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపి, తెలుగులో చదవడానికి అవసరమైనంత మాత్రమే వాక్యసంబంధాన్ని స్పష్టపరచాం. ‘సబ్బాతు విశ్రాంతి’ అనే పదబంధం కొంత ప్రత్యేకంగా వినిపించినా, మూలంలోని సబ్బాతు/విశ్రాంతి పదప్రయోగం మరియు నిబంధన నేపథ్యాన్ని కాపాడటానికి ఉద్దేశపూర్వకంగా వాడాం.
