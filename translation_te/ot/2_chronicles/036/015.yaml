- from: వారి పూర్వికుల దేవుడైన యెహోవా తన ప్రజలపట్ల, తన నివాసస్థలంపట్ల కనికరం చూపాడు. అందువల్ల ఆయన తన సందేశకుల ద్వారా వారికి పదేపదే, ఎంతో శ్రద్ధగా సందేశం పంపించాడు.[a]
