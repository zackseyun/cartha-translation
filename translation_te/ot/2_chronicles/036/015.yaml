id: 2CH.36.15
reference: 2 Chronicles 36:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֡ח יְהוָה֩ אֱלֹהֵ֨י אֲבוֹתֵי/הֶ֧ם עֲלֵי/הֶ֛ם בְּ/יַ֥ד מַלְאָכָ֖י/ו הַשְׁכֵּ֣ם וְ/שָׁל֑וֹחַ כִּֽי חָמַ֥ל עַל עַמּ֖/וֹ וְ/עַל מְעוֹנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/015.yaml
  text: And Yahweh[a], the God of their fathers, sent word to them by the hand of his messengers, rising early and sending[c][b], because he had compassion on his people and on his dwelling place.
translation:
  language: te
  text: వారి పూర్వికుల దేవుడైన యహ్వే తన సందేశకుల ద్వారా వారికి పదేపదే ఎంతో ఆసక్తితో సందేశం పంపించాడు.[a] ఎందుకంటే ఆయన తన ప్రజలపట్ల, తన నివాసస్థలంపట్ల కనికరం చూపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఉదయాన్నే లేచి పంపిస్తూ.” ఇది ఎంతో ఆసక్తితో, పట్టుదలగా మళ్లీ మళ్లీ పంపడాన్ని సూచించే హీబ్రూ జాతీయం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన YHWHను బిరుదుగా కాక పేరుగా నిలుపుతూ, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపాన్ని వాడింది.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: వారి పూర్వికుల దేవుడు
  rationale: పూర్వ తరాలతో ఉన్న చారిత్రక, నిబంధనాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וַיִּשְׁלַח ... עֲלֵיהֶם
  choice: వారికి సందేశం పంపించాడు
  rationale: మూలంలో పంపబడిన కర్మ ప్రత్యక్షంగా లేకపోయినా, సందేశకుల ప్రస్తావన వల్ల సమాచారాన్ని పంపడం ఉద్దేశమని సందర్భం సూచిస్తుంది.
- source_word: בְּיַד מַלְאָכָיו
  choice: తన సందేశకుల ద్వారా
  rationale: ‘చేతి ద్వారా’ అనే హీబ్రూ ప్రయోగం సాధనాన్ని లేదా ప్రతినిధిత్వాన్ని సూచిస్తుంది; తెలుగులో ‘ద్వారా’ సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: מַלְאָכָיו
  choice: తన సందేశకులు
  rationale: ఈ సందర్భంలో ప్రజలను హెచ్చరించడానికి పంపబడిన మానవ ప్రవక్తలే ఉద్దేశం; ‘దూతలు’ అనడం పరలోక దూతలని అపార్థం కలిగించవచ్చు.
- source_word: הַשְׁכֵּם וְשָׁלוֹחַ
  choice: పదేపదే, ఎంతో శ్రద్ధగా సందేశం పంపించాడు
  rationale: అక్షరార్థంగా ‘తెల్లవారగానే లేచి పంపడం’ అనే హీబ్రూ జాతీయం ఆసక్తితో, పట్టుదలతో మళ్లీ మళ్లీ చేయడాన్ని సూచిస్తుంది. తెలుగులో భావాన్ని సహజంగా వ్యక్తం చేసింది; అక్షరరూపాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: כִּי חָמַל
  choice: కనికరం చూపాడు; అందువల్ల
  rationale: חמל జాలి వల్ల కాపాడాలనే కరుణను సూచిస్తుంది. హీబ్రూలోని కారణ సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేయడానికి వాక్య క్రమాన్ని మార్చింది.
- source_word: עַל עַמּוֹ
  choice: తన ప్రజలపట్ల
  rationale: కనికరానికి లక్ష్యమైన వారిని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: מְעוֹנוֹ
  choice: తన నివాసస్థలం
  rationale: పదం నివాసాన్ని సూచిస్తుంది; సందర్భంలో దేవాలయం ఉద్దేశమైనప్పటికీ, మూలంలోని దైవసన్నిధి భావాన్ని ‘దేవాలయం’గా కుదించకుండా నిలుపుతుంది.
theological_decisions:
- issue: ‘తన సందేశకులు’ ఎవరనే ప్రశ్న
  choice: మానవ ప్రవక్తలను సూచించే ‘సందేశకులు’
  alternative: పరలోక దూతలు
  rationale: చుట్టుపక్కల సందర్భం యెహోవా ప్రవక్తల ద్వారా చేసిన పునరావృత హెచ్చరికలను వివరిస్తుంది; మూలపదం మాత్రం సాధారణంగా ‘పంపబడినవాడు/సందేశకుడు’ అని అర్థం.
- issue: దేవుని ‘నివాసస్థలం’ యొక్క సూచన
  choice: మూలంలోని ‘తన నివాసస్థలం’ అనే వ్యక్తీకరణను నిలుపడం
  alternative: ‘తన దేవాలయం’ అని స్పష్టీకరించడం
  rationale: సందర్భంలో యెరూషలేము దేవాలయం ఉద్దేశమైనా, ఈ పదప్రయోగం దేవుడు తన ప్రజల మధ్య నివసించడమనే ధార్మిక భావాన్ని కూడా మోస్తుంది.
- issue: దైవ కనికరం మరియు సందేశాల పునరావృతం మధ్య సంబంధం
  choice: కనికరమే పదేపదే పంపడానికి కారణమని స్పష్టంగా చూపడం
  alternative: హీబ్రూ పదక్రమాన్ని యథాతథంగా ఉంచడం
  rationale: כִּי కారణాన్ని తెలియజేస్తుంది. తెలుగు సహజ శైలిలో కారణాన్ని ముందుంచడం భావాన్ని మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. హీబ్రూ జాతీయాన్ని ప్రధాన పాఠ్యంలో భావానువాదంగా ఇచ్చి, దాని అక్షరరూపాన్ని పాదటిప్పణిలో నిలిపింది. మూలంలోని దీర్ఘ వాక్యాన్ని కారణం-ఫలితం స్పష్టంగా ఉండే రెండు తెలుగు వాక్యాలుగా అమర్చింది.
