  rationale: The revision aligns the divine name with the project’s Yahweh policy, keeps the Hebrew clause sequence, positions the footnote anchor at the idiom it explains, and revises the note so that it does not add an explicit object to the Hebrew participial expression. It retains the draft’s sound choices for “messengers” and “dwelling place.”
