translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. హీబ్రూ వాక్యప్రవాహాన్ని తెలుగులో రెండు వాక్యాలుగా అమర్చి స్పష్టత పెంచాం. కూవే/సేకరణ స్థలం అనే పాఠ్య-నిఘంటు సందిగ్ధతను ప్రధాన పాఠంలో ఒక నిర్ణయంతో, పాదసూచనల్లో ప్రత్యామ్నాయంతో సంరక్షించాం.
