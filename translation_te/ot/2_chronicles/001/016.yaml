id: 2CH.1.16
reference: 2 Chronicles 1:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מוֹצָ֧א הַ/סּוּסִ֛ים אֲשֶׁ֥ר לִ/שְׁלֹמֹ֖ה מִ/מִּצְרָ֑יִם וּ/מִ/קְוֵ֕א סֹחֲרֵ֣י הַ/מֶּ֔לֶךְ מִ/קְוֵ֥א יִקְח֖וּ בִּ/מְחִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/016.yaml
  text: And the source of Solomon’s horses was Egypt and Kue[b][a], and the king’s merchants would obtain them from Kue for a price.
translation:
  language: te
  text: సొలొమోనుకు చెందిన గుర్రాల మూలం ఐగుప్తు, కూవే[a]; రాజు వర్తకులు వాటిని కూవే నుండి ధర చెల్లించి కొనుగోలు చేసేవారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సేకరణ కేంద్రం నుండి.” ఇక్కడి హీబ్రూ పదం מִקְוֵא అర్థం నిశ్చితంగా లేదు; దాన్ని ‘కూవే’ అనే స్థలనామంగా గానీ, సేకరణ స్థలాన్ని సూచించే సామాన్య నామవాచకంగా గానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ప్రత్యామ్నాయంగా, “రాజు వర్తకులు వాటిని సేకరణ కేంద్రం నుండి ధర చెల్లించి కొనుగోలు చేసేవారు.” ఇది מִקְוֵאను భౌగోళిక నామంగా కాకుండా సేకరణ కేంద్రంగా అర్థం చేసుకునే పఠనం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמוֹצָא
  choice: వచ్చేవి
  rationale: מוֹצָא మూలం లేదా బయలుదేరే స్థలాన్ని సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు, గుర్రాలు ఆయా ప్రాంతాల నుండి వచ్చేవని తెలిపే క్రియారూపంలో భావాన్ని వ్యక్తం చేశాం.
- source_word: הַסּוּסִים אֲשֶׁר לִשְׁלֹמֹה
  choice: సొలొమోనుకు చెందిన గుర్రాలు
  rationale: לִשְׁלֹמֹה ఇక్కడ స్వామ్యాన్ని లేదా అనుబంధాన్ని సూచిస్తుంది; ఈ తెలుగు రూపం దానిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מִמִּצְרָיִם
  choice: ఐగుప్తు నుండి
  rationale: సాంప్రదాయక తెలుగు బైబిలు భౌగోళిక నామాన్ని ఉంచి, מן ఉపసర్గ సూచించే మూలస్థానాన్ని ‘నుండి’తో వ్యక్తం చేశాం.
- source_word: וּמִקְוֵא / מִקְוֵא
  choice: కూవే నుండి
  rationale: సందిగ్ధమైన מִקְוֵאను ఈ వాణిజ్య సందర్భంలో, 1 రాజులు 10:28లోని సమాంతర వాక్యానికి అనుగుణంగా, స్థలనామంగా తీసుకున్నాం; ప్రత్యామ్నాయ సామాన్యనామ భావాన్ని పాదసూచనలో ఉంచాం.
- source_word: סֹחֲרֵי הַמֶּלֶךְ
  choice: రాజు వర్తకులు
  rationale: వాణిజ్యం చేసే వ్యక్తులను సూచించే substantival participleకు ఆధునిక ప్రామాణిక తెలుగులో ‘వర్తకులు’ సరిపోతుంది.
- source_word: יִקְחוּ
  choice: తీసుకొచ్చేవారు
  rationale: לקח ప్రాథమికంగా ‘తీసుకొను’ అని అర్థం. మూలస్థానం నుండి గుర్రాలను సంపాదించి తీసుకురావడాన్ని ఈ సందర్భోచిత తెలుగు రూపం తెలియజేస్తుంది; కొనుగోలు భావం בִּמְחִיר ద్వారా వ్యక్తమవుతుంది.
- source_word: בִּמְחִיר
  choice: వెల చెల్లించి
  rationale: ధర లేదా చెల్లింపుతో జరిగిన లావాదేవీని సహజమైన తెలుగులో తెలియజేస్తుంది.
