  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הַֽ/חָכְמָ֥ה וְ/הַ/מַּדָּ֖ע נָת֣וּן לָ֑/ךְ וְ/עֹ֨שֶׁר וּ/נְכָסִ֤ים וְ/כָבוֹד֙ אֶתֶּן לָ֔/ךְ אֲשֶׁ֣ר לֹא הָ֣יָה כֵ֗ן לַ/מְּלָכִים֙ אֲשֶׁ֣ר לְ/פָנֶ֔י/ךָ וְ/אַחֲרֶ֖י/ךָ לֹ֥א יִֽהְיֶה כֵּֽן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/012.yaml
  text: Wisdom and knowledge are given to you[a], and I will give you riches and possessions and honor such as no kings before you have had, and none after you will have the like.
translation:
  language: te
  text: జ్ఞానమూ పరిజ్ఞానమూ నీకు అనుగ్రహించబడ్డాయి. అంతేకాక, నీకు ముందున్న రాజులకు లేనంతగా, నీ తర్వాతి రాజులకు కూడా ఉండనంతగా[a] ఐశ్వర్యాన్నీ ఆస్తులనూ ఘనతనూ నీకు ఇస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: “నీకు ముందున్న రాజులకు ఇలా లేదు; నీ తర్వాత కూడా రాజులకు ఇలా ఉండదు.”'
    reason: హెబ్రీలోని పోలిక ‘ఇలా లేదు/ఉండదు’ అనే నిర్మాణంలో ఉంది; ప్రధాన పాఠ్యం దానిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
lexical_decisions:
- source_word: הַחָכְמָה
  choice: జ్ఞానం
  rationale: חָכְמָהకు సాధారణమైన అర్థం ‘జ్ఞానం’; తెలుగు వాక్యరీతికి అనుగుణంగా నిర్దేశక భావాన్ని ప్రత్యేకంగా వ్యక్తం చేయలేదు.
- source_word: הַמַּדָּע
  choice: పరిజ్ఞానం
  rationale: מַדָּע జ్ఞానం లేదా అవగాహనను సూచిస్తుంది. ముందున్న ‘జ్ఞానం’తో తేడా నిలిపి, అనవసరంగా ‘వివేకం’ అనే వ్యాఖ్యానాత్మక భావాన్ని చేర్చకుండా ‘పరిజ్ఞానం’ ఎంచుకున్నాం.
- source_word: נָתוּן לָךְ
  choice: నీకు అనుగ్రహించబడ్డాయి
  rationale: נתן యొక్క నిష్క్రియాత్మక కృదంత రూపం ఇప్పటికే ప్రసాదించబడిన స్థితిని తెలియజేస్తుంది; దైవ వరం సందర్భంలో ‘అనుగ్రహించబడ్డాయి’ సహజంగా ఉంది.
- source_word: עֹשֶׁר
  choice: ఐశ్వర్యం
  rationale: עֹשֶׁר ధనసమృద్ధిని సూచిస్తుంది; తరువాతి נְכָסִיםతో పదభేదాన్ని నిలుపుతుంది.
- source_word: נְכָסִים
  choice: ఆస్తులు
  rationale: נְכָסִים అంటే స్వాధీన వస్తువులు లేదా ఆస్తి; ఆధునిక తెలుగులో ‘ఆస్తులు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: כָבוֹד
  choice: ఘనత
  rationale: రాజుకు లభించే గౌరవస్థితిని సూచించే సందర్భంలో כָבוֹדకు ‘ఘనత’ సరిపోతుంది; దైవ మహిమ అనే భావాన్ని అనవసరంగా సూచించదు.
- source_word: אֶתֶּן לָךְ
  choice: నీకు ఇస్తాను
  rationale: అసంపూర్ణ క్రియారూపం ఈ వాగ్దాన సందర్భంలో భవిష్యదర్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר לֹא הָיָה כֵן לַמְּלָכִים אֲשֶׁר לְפָנֶיךָ וְאַחֲרֶיךָ לֹא יִהְיֶה כֵן
  choice: నీకు ముందున్న రాజులకు లేనంతగా, నీ తర్వాతి రాజులకు కూడా ఉండనంతగా
  rationale: హెబ్రీ పోలికను సహజమైన తెలుగులో వ్యక్తం చేస్తూ, పోలిక రాజులతోనే ఉందని సందర్భానుసారంగా స్పష్టం చేస్తుంది. మరింత పదశః రూపాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: రాజులతో పోలిక యొక్క పరిధి
  choice: ఈ వాక్యంలో దేవుడు ఇచ్చే వరాల సందర్భానికే సొలొమోను యొక్క అసమానతను పరిమితం చేశాం.
  alternative: సొలొమోను వ్యక్తిత్వం లేదా పాలన ప్రతి విషయంలోనూ ఇతర రాజులందరికంటే అసమానమని విస్తరించి చెప్పడం.
  rationale: హెబ్రీ వాక్యంలో పోలిక ముందుగా పేర్కొన్న దైవ వరాలకు అనుసంధానమై ఉంది. అందువల్ల వాక్యం చెప్పిన పరిధిని మించి సంపూర్ణమైన వ్యక్తిగత శ్రేష్ఠతను అనువాదం ప్రకటించదు.
- issue: אֲשֶׁר అనే సంబంధసూచక పదం దేనిని సూచిస్తుందన్న స్వల్ప అస్పష్టత
  choice: ప్రధాన పాఠ్యంలో ఐశ్వర్యం, ఆస్తులు, ఘనత అనే సమీప జాబితాతో పోలికను సహజంగా అనుసంధానించాం; మొత్తం దైవ అనుగ్రహ స్థితిని సూచించే అవకాశం పాదసూచికలో పదశః రూపం ద్వారా తెరిచి ఉంచాం.
  alternative: పోలికను జ్ఞానం, పరిజ్ఞానం సహా పేర్కొన్న వరాలన్నిటికీ స్పష్టంగా వర్తింపజేయడం.
  rationale: హెబ్రీ సంబంధ వాక్యానికి వ్యాకరణపరంగా కొంత విస్తృత సూచన ఉండవచ్చు; అనువాదంలో దానిని సిద్ధాంతపరంగా ఖచ్చితీకరించకుండా అస్పష్టతను కాపాడటం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడాం. ‘జ్ఞానమూ పరిజ్ఞానమూ’, ‘ఐశ్వర్యాన్నీ ఆస్తులనూ ఘనతనూ’ అనే సముచ్చయాలు హెబ్రీ జాబితా లయను నిలుపుతాయి; అతిగా ప్రాచీనమైన రూపాలను నివారించాం.
