source:
  edition: WLC
  text: וַ/יֶּאֱסֹ֣ף שְׁלֹמֹה֮ רֶ֣כֶב וּ/פָרָשִׁים֒ וַֽ/יְהִי ל֗/וֹ אֶ֤לֶף וְ/אַרְבַּע מֵאוֹת֙ רֶ֔כֶב וּ/שְׁנֵים עָשָׂ֥ר אֶ֖לֶף פָּרָשִׁ֑ים וַ/יַּנִּיחֵ/ם֙ בְּ/עָרֵ֣י הָ/רֶ֔כֶב וְ/עִם הַ/מֶּ֖לֶךְ בִּ/ירֽוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/014.yaml
  text: And Solomon gathered chariots and horsemen[a], and he had 1,400 chariots and 12,000 horsemen[b]; and he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: te
  text: సొలొమోను రథాలనూ గుర్రపు రౌతులనూ[a] సమకూర్చాడు. అతనికి 1,400 రథాలు, 12,000 మంది గుర్రపు రౌతులు ఉన్నారు. అతడు వారినీ రథాలనూ రథాల పట్టణాల్లో[b], యెరూషలేములో తనతోపాటు ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అశ్వదళం.’ హెబ్రీ పదం గుర్రాలపై స్వారీ చేసే వారిని సూచిస్తుంది; ‘గుర్రపు రౌతులు’ మూలానికి మరింత దగ్గరైన అనువాదం.
    reason: lexical_alternative
  - marker: b
    text: అంటే, రథాలను ఉంచడానికి లేదా వాటికి స్థావరాలుగా నియమించిన పట్టణాలు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: సమకూర్చాడు
  rationale: אסף అంటే కూడగట్టడం లేదా సేకరించడం. సైనిక వనరులను తన అధీనంలో సమకూర్చుకున్న భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: רֶכֶב
  choice: రథాలు
  rationale: ఈ పదం సమష్టిగా రథదళాన్ని సూచించగలిగినా, వెంటనే 1,400 అనే సంఖ్య ఇవ్వబడింది కాబట్టి లెక్కించదగిన ‘రథాలు’ స్పష్టంగా ఉంది.
- source_word: פָּרָשִׁים
  choice: గుర్రపు రౌతులు
  rationale: ఈ నామవాచకం సాధారణంగా గుర్రాలపై స్వారీ చేసే యోధులను సూచిస్తుంది; గుర్రాలను మాత్రమే కాదు. ‘గుర్రపు రౌతులు’ మూలార్థానికి దగ్గరగా, సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది.
- source_word: וַיְהִי לוֹ
  choice: అతనికి ... ఉన్నారు/ఉన్నాయి
  rationale: ‘అతనికి ఉండెను’ అనే హెబ్రీ స్వామ్యసూచక నిర్మాణాన్ని సహజమైన తెలుగు స్వామ్య నిర్మాణంతో తెలిపింది.
- source_word: אֶלֶף וְאַרְבַּע מֵאוֹת רֶכֶב
  choice: 1,400 రథాలు
  rationale: మూలంలోని ఖచ్చితమైన సంఖ్యను ఆధునిక సంఖ్యా రూపంలో నిలిపింది.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף פָּרָשִׁים
  choice: 12,000 మంది గుర్రపు రౌతులు
  rationale: మూలంలోని ఖచ్చితమైన సంఖ్యను నిలిపి, వ్యక్తులను లెక్కించే ‘మంది’ని సహజ తెలుగు కోసం చేర్చింది.
- source_word: וַיַּנִּיחֵם
  choice: ఉంచాడు
  rationale: కారణార్థక క్రియ ఇక్కడ సైనిక వనరులను నిర్దిష్ట ప్రదేశాల్లో ఉంచడాన్ని సూచిస్తుంది. రథాలకూ రౌతులకూ వర్తించే సహజమైన విస్తృత పదంగా ‘ఉంచాడు’ ఎంచుకోబడింది.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: రథాల పట్టణాల్లో
  rationale: రథాలను ఉంచే లేదా వాటికి స్థావరాలుగా ఉన్న ప్రత్యేక పట్టణాలను సూచించే సంక్షిప్త, మూలానికి దగ్గరైన అనువాదం.
- source_word: וְעִם הַמֶּלֶךְ
  choice: రాజు దగ్గర
  rationale: హెబ్రీ పాఠంలోని ‘రాజుతో/రాజు దగ్గర’ అనే సరళ నిర్మాణాన్ని కాపాడుతూ, ‘కొందరిని’ వంటి స్పష్టీకరణను ప్రధాన పాఠంలో చేర్చలేదు.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: స్థిరమైన తెలుగు బైబిలు స్థలనామ రూపాన్ని, తగిన విభక్తితో ఉపయోగించింది.
