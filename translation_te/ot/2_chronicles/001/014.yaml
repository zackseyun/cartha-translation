- from: సొలొమోను రథాలనూ గుర్రపు రౌతులనూ[a] సమకూర్చాడు. అతనికి 1,400 రథాలు, 12,000 మంది గుర్రపు రౌతులు ఉన్నారు. అతడు వారిని, రథాలను రథాల పట్టణాల్లో[b], యెరూషలేములో రాజు దగ్గర ఉంచాడు.
