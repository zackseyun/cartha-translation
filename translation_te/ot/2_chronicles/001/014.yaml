translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. చివరి వాక్యంలో హెబ్రీ బహువచన సర్వనామం రథాలనూ రౌతులనూ కలిపి సూచిస్తున్నందున, తెలుగులో అస్పష్టత రాకుండా ‘వారిని, రథాలను’ అని విప్పి చెప్పబడింది; అయితే వారు ఎలా విభజించబడ్డారో మూలం చెప్పనందున అది చేర్చలేదు.
