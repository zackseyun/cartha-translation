id: 2CH.1.6
reference: 2 Chronicles 1:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעַל֩ שְׁלֹמֹ֨ה שָׁ֜ם עַל מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר לְ/אֹ֣הֶל מוֹעֵ֑ד וַ/יַּ֧עַל עָלָ֛י/ו עֹל֖וֹת אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/006.yaml
  text: And Solomon went up there to the bronze altar before Yahweh[a], which was at the tent of meeting, and offered on it a thousand burnt offerings.
translation:
  language: te
  text: సొలొమోను అక్కడ సమావేశపు గుడారం వద్ద ఉన్న, యహ్వే[a] సన్నిధిలోని కంచు బలిపీఠం దగ్గరకు వెళ్లి, దానిమీద వెయ్యి దహనబలులు అర్పించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో దేవుని వ్యక్తిగత నామం יהוה (YHWH) ఉంది; ప్రధాన పాఠంలో దీనిని ‘యహ్వే’గా అనువదించాం.
    reason: దైవనామపు హీబ్రూ రూపాన్ని మరియు ప్రధాన పాఠంలోని అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיַּעַל ... שָׁם
  choice: అక్కడ ... వద్దకు ఎక్కి వెళ్లి
  rationale: మొదటి עלה సొలొమోను బలిపీఠం వద్దకు పైకి వెళ్లడాన్ని సూచిస్తుంది; ‘ఎక్కి వెళ్లి’ దిశాభావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: కంచు బలిపీఠం
  rationale: נְחֹשֶׁת రాగి లేదా రాగి మిశ్రమ లోహాన్ని సూచించగలదు; ఈ ఆరాధనా సందర్భంలో ‘కంచు’ సాధారణంగా అర్థమయ్యే సంప్రదాయ పదం.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: לִפְנֵי ఇక్కడ దేవుని సమక్షాన్ని సూచిస్తుంది; ‘సన్నిధిలో’ గౌరవప్రదంగాను సహజంగాను ఉంది.
- source_word: אֲשֶׁר לְאֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం దగ్గర ఉన్న
  rationale: לְ అనే సంబంధాన్ని సందర్భానుసారం స్థానార్థకంగా తీసుకున్నాం. అది గుడారానికి చెందినదనే భావమూ సాధ్యమే, అయితే ‘దగ్గర ఉన్న’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: וַיַּעַל עָלָיו עֹלוֹת
  choice: దానిమీద ... దహనబలులు అర్పించాడు
  rationale: రెండవ עלה బలిని బలిపీఠం మీద అర్పించే ఆరాధనా వాడుక; పదశః ‘పైకి వెళ్లేలా చేశాడు’ అనడం కన్నా ‘అర్పించాడు’ తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: עֹלוֹת
  choice: దహనబలులు
  rationale: పూర్తిగా దహింపబడే עֹלָה బలికి స్థిరమైన, సంక్షిప్త తెలుగు పదప్రయోగం.
- source_word: אָלֶף
  choice: వెయ్యి
  rationale: సాధారణ సంఖ్యార్థాన్ని నేరుగా అనువదిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యహ్వే
  rationale: హీబ్రూ పాఠంలో బిరుదు కాక వ్యక్తిగత దైవనామమే ఉంది. ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ప్రధాన పాఠంలో ఉంచి, మూలనామానికి సాధ్యమైన ‘యహ్వే’ ఉచ్చారణను పాదటిప్పణిలో తెలిపాం.
- issue: אֲשֶׁר לְאֹהֶל מוֹעֵד లో לְ సంబంధం
  choice: ప్రత్యక్ష గుడారం దగ్గర ఉన్న
  alternative: ప్రత్యక్ష గుడారానికి చెందిన
  rationale: ఈ నిర్మాణం స్థానం లేదా అనుబంధాన్ని సూచించగలదు. సందర్భంలో బలిపీఠం ఉన్న ప్రదేశాన్ని తెలియజేసే స్థానార్థక పఠనాన్ని ఎంచుకున్నాం; అనుబంధ భావాన్ని పూర్తిగా నిరాకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘ప్రత్యక్ష గుడారం,’ ‘బలిపీఠం,’ ‘దహనబలులు’ వంటి స్థిరమైన బైబిలు పదాలను నిలిపాం.
