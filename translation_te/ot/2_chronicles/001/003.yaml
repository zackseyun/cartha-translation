id: 2CH.1.3
reference: 2 Chronicles 1:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּלְכ֗וּ שְׁלֹמֹה֙ וְ/כָל הַ/קָּהָ֣ל עִמּ֔/וֹ לַ/בָּמָ֖ה אֲשֶׁ֣ר בְּ/גִבְע֑וֹן כִּי שָׁ֣ם הָיָ֗ה אֹ֤הֶל מוֹעֵד֙ הָֽ/אֱלֹהִ֔ים אֲשֶׁ֥ר עָשָׂ֛ה מֹשֶׁ֥ה עֶֽבֶד יְהוָ֖ה בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/003.yaml
  text: So Solomon and all the assembly with him went to the high place that was at Gibeon[a], because the tent of meeting of God was there, which Moses the servant of Yahweh had made in the wilderness.
translation:
  language: te
  text: అప్పుడు సొలొమోను, అతనితో ఉన్న సమాజమంతా, గిబియోనులో ఉన్న ఉన్నత స్థలానికి వెళ్లారు. ఎందుకంటే యాహ్వే సేవకుడైన మోషే అరణ్యంలో చేసిన దేవుని ప్రత్యక్షపు గుడారం అక్కడే ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: వెళ్లారు
  rationale: הלך క్రియ కథనంలోని ప్రధాన చర్యను సూచిస్తుంది; మూలంలో లేని దిశాభావాన్ని చేర్చకుండా సాధారణ భూతకాల రూపం వాడబడింది.
- source_word: הַקָּהָל
  choice: సమాజమంతా
  rationale: קהל సమావేశమైన సమూహాన్ని సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు సహజంగా ఉండేలా, సమగ్రతను తెలియజేయడానికి כלతో కలిపి ‘సమాజమంతా’ అని అనువదించబడింది.
- source_word: לַבָּמָה
  choice: ఉన్నత స్థలానికి
  rationale: במה ఆరాధన కోసం ఉపయోగించిన ఎత్తైన స్థలాన్ని సూచిస్తుంది. ఈ సందర్భంలో ప్రతికూల తీర్పును చేర్చకుండా పదార్థాన్ని నిలిపింది.
- source_word: בְּגִבְעוֹן
  choice: గిబియోనులోని
  rationale: స్థలనామాన్ని తెలుగు లిపిలో లిప్యంతరీకరించి, ఉన్నత స్థలంతో సహజమైన సంబంధం చూపే రూపం వాడబడింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: సొలొమోను అక్కడికి వెళ్లడానికి గల కారణాన్ని పరిచయం చేసే కారణార్థక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్షపు గుడారం
  rationale: దేవుడు తన ప్రజలను కలుసుకునే నియమిత గుడారాన్ని సూచించే స్థిరమైన తెలుగు బైబిలు పదబంధాన్ని ఉపయోగించింది; కేవలం ‘గుడారం’గా సంక్షిప్తం చేయలేదు.
- source_word: הָאֱלֹהִים
  choice: దేవుని
  rationale: సంబంధవాచక నిర్మాణాన్ని సహజమైన తెలుగు షష్ఠీ రూపంలో నిలిపింది.
- source_word: אֲשֶׁר עָשָׂה
  choice: చేసిన
  rationale: ప్రధాన కథనానికి ముందే జరిగిన కార్యాన్ని తెలుగు సంబంధకృదంతం సహజంగా తెలియజేస్తుంది.
- source_word: עֶבֶד יְהוָה
  choice: యెహోవా సేవకుడైన
  rationale: మోషేకు గౌరవపూర్వక బిరుదుగా ఉన్న עבדను ‘సేవకుడు’గా అనువదించింది; ఈ సందర్భంలో ‘బానిస’ భావం ప్రధానంగా లేదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించింది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: ఇశ్రాయేలీయుల అరణ్యకాల సందర్భానికి సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
theological_decisions:
- issue: దేవాలయం నిర్మించకముందు సముచిత ఆరాధన జరిగిన సందర్భంలో במה అనువాదం
  choice: ఉన్నత స్థలం
  alternative: ఆరాధనా స్థలం
  rationale: మూలపదంలోని భౌగోళిక-ఆరాధనా భావాన్ని నిలిపి, ఈ సందర్భంలో అనవసరమైన ప్రతికూల తీర్పును చేర్చలేదు.
- issue: దైవనామమైన יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. తెలుగు సాధారణ బైబిలు వాడుకలో సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకుంది.
- issue: ‘ప్రత్యక్షపు గుడారం’తో దేవుని సంబంధం
  choice: దేవుని ప్రత్యక్షపు గుడారం
  alternative: దేవుడు ప్రత్యక్షమయ్యే గుడారం
  rationale: హీబ్రూ నామవాచక సంబంధాన్ని నేరుగా నిలిపి, దేవుని ప్రత్యక్షత విధానంపై మూలంలో లేని వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘ఉన్నత స్థలం’ అనే పదబంధం మూలంలోని ఆరాధనా-భౌగోళిక ఉద్రిక్తతను వ్యాఖ్యానంతో పరిష్కరించకుండా నిలుపుతుంది. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో చేర్చబడింది.
