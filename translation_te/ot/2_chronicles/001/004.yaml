source:
  edition: WLC
  text: אֲבָ֗ל אֲר֤וֹן הָ/אֱלֹהִים֙ הֶעֱלָ֤ה דָוִיד֙ מִ/קִּרְיַ֣ת יְעָרִ֔ים בַּֽ/הֵכִ֥ין ל֖/וֹ דָּוִ֑יד כִּ֧י נָֽטָה ל֛/וֹ אֹ֖הֶל בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/004.yaml
  text: But David had brought up the ark of God from Kiriath-jearim to the place David had prepared for it[a], for he had pitched a tent for it in Jerusalem.
translation:
  language: te
  text: అయితే దేవుని మందసాన్ని దావీదు కిర్యత్‌-యెయారీము నుండి తాను దాని కోసం సిద్ధం చేసిన చోటికి[a] పైకి తీసుకువచ్చాడు; ఎందుకంటే అతడు యెరూషలేములో దాని కోసం ఒక గుడారం వేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “దావీదు దాని కోసం సిద్ధం చేసినదానికి.” హీబ్రూ వ్యక్తీకరణ సంక్షిప్తంగా ఉంది; దావీదు మందసం కోసం సిద్ధం చేసిన చోటికి దాన్ని తీసుకొచ్చాడనేది భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: అయితే
  rationale: మునుపటి వచనంలో గిబియోనులో ఉన్న ఇత్తడి బలిపీఠానికి, ఇక్కడ వేరే చోట ఉన్న మందసానికి మధ్య వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసం
  rationale: నిర్మాణ సంబంధ పదబంధానికి సరళమైన, తెలుగు బైబిలు వాడుకలో సహజమైన అనువాదం.
- source_word: הֶעֱלָה
  choice: తీసుకొచ్చాడు
  rationale: హిఫిల్ రూపం మందసాన్ని ఒక చోటికి తీసుకురావడాన్ని సూచిస్తుంది; తెలుగు కథనంలో ‘తీసుకొచ్చాడు’ సహజంగా ఉంటుంది.
- source_word: מִקִּרְיַת יְעָרִים
  choice: కిర్యత్‌-యెయారీము నుండి
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగు ధ్వన్యనుకరణలో నిలుపుతూ, מִן మూలస్థానాన్ని సూచించే ‘నుండి’గా అనువదించబడింది.
- source_word: בַּהֵכִין לוֹ דָוִיד
  choice: తాను దాని కోసం సిద్ధం చేసిన చోటికి
  rationale: హీబ్రూ వ్యక్తీకరణ సంక్షిప్తంగా ఉంది; గమ్యస్థాన భావాన్ని తెలుగులో స్పష్టంచేయడానికి ‘చోటికి’ సరఫరా చేయబడింది, పాదసూచికలో అక్షరార్థ ప్రత్యామ్నాయం ఇవ్వబడింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు కారణాన్ని వివరించే సంధాన పదంగా సహజమైన తెలుగు రూపం.
- source_word: נָטָה לוֹ אֹהֶל
  choice: దాని కోసం ఒక గుడారం వేశాడు
  rationale: נטה + אֹהֶל అంటే గుడారాన్ని వేయడం లేదా నిలపడం; ‘గుడారం వేశాడు’ ప్రస్తుత ప్రామాణిక తెలుగులో సహజం.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: స్థానార్థక בְను ‘లో’తో వ్యక్తపరుస్తూ సంప్రదాయ తెలుగు స్థలనామ రూపాన్ని ఉపయోగించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన కథన శైలి పాటించబడింది. హీబ్రూ వాక్యంలోని సంక్షిప్తతను ప్రధాన పాఠంలో సహజంగా స్పష్టంచేసి, అక్షరార్థ రూపాన్ని పాదసూచికలో నిలిపాం.
