id: 2CH.1.11
reference: 2 Chronicles 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֣ים לִ/שְׁלֹמֹ֡ה יַ֣עַן אֲשֶׁר֩ הָיְתָ֨ה זֹ֜את עִם לְבָבֶ֗/ךָ וְ/לֹֽא שָׁ֠אַלְתָּ עֹ֣שֶׁר נְכָסִ֤ים וְ/כָבוֹד֙ וְ/אֵת֙ נֶ֣פֶשׁ שֹׂנְאֶ֔י/ךָ וְ/גַם יָמִ֥ים רַבִּ֖ים לֹ֣א שָׁאָ֑לְתָּ וַ/תִּֽשְׁאַל לְ/ךָ֙ חָכְמָ֣ה וּ/מַדָּ֔ע אֲשֶׁ֤ר תִּשְׁפּוֹט֙ אֶת עַמִּ֔/י אֲשֶׁ֥ר הִמְלַכְתִּ֖י/ךָ עָלָֽי/ו־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/011.yaml
  text: And God said to Solomon[a], “Because this was in your heart, and you did not ask for wealth, possessions, or honor, or for the life of those who hate you, nor did you ask for many days, but asked for wisdom and knowledge for yourself[b], that you might judge my people over whom I have made you king,”
translation:
  language: te
  text: 'దేవుడు సొలొమోనుతో ఇలా అన్నాడు: “ఇది నీ హృదయంలో ఉన్నందున, నీవు సంపదనుగానీ, ఆస్తులనుగానీ, ఘనతనుగానీ, నిన్ను ద్వేషించేవారి ప్రాణాన్నిగానీ[a] అడగలేదు; అనేక దినాలను కూడా అడగలేదు[b]; అయితే, నేను నిన్ను వారి మీద రాజుగా నియమించిన నా ప్రజలకు న్యాయం తీర్చడానికి నీ కోసం వివేకాన్నీ జ్ఞానాన్నీ అడిగావు,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ శత్రువుల ప్రాణాలను”; అక్షరార్థంగా, “నిన్ను ద్వేషించేవారి ప్రాణాన్ని.”
    reason: lexical_alternative
  - marker: b
    text: అంటే, “దీర్ఘాయుష్షు”; అక్షరార్థంగా, “అనేక దినాలను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: ఇది నీ హృదయంలో ఉంది; నీవు... అడగలేదు
  rationale: హేతువును తెలుగులో సహజంగా తెలియజేయడానికి వాక్య నిర్మాణంలో కారణార్థక సంబంధాన్ని నిలిపి ఉంచింది; హెబ్రీయ హృదయ రూపకాన్ని కూడా కాపాడింది.
- source_word: הָיְתָה זֹאת עִם לְבָבֶךָ
  choice: ఇది నీ హృదయంలో ఉంది
  rationale: అంతరంగ ఉద్దేశం లేదా మనోభావాన్ని సూచించే హెబ్రీయ నుడికారాన్ని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా నిలుపుతుంది.
- source_word: עֹשֶׁר נְכָסִים וְכָבוֹד
  choice: సంపద, ఆస్తులు, ఘనత
  rationale: 'మూడు వేర్వేరు భావాలను ఆధునిక తెలుగులో స్పష్టంగా వేరు చేస్తుంది: ధనం, కలిగిన వస్తుసంపత్తి, సామాజిక గౌరవస్థానం.'
- source_word: נֶפֶשׁ שֹׂנְאֶיךָ
  choice: నిన్ను ద్వేషించేవారి ప్రాణం
  rationale: నֶפֶשׁ యొక్క ఏకవచన రూపాన్నీ, שֹׂנְאֶיךָ యొక్క ‘నిన్ను ద్వేషించేవారు’ అనే దగ్గరి భావాన్నీ కాపాడుతుంది.
- source_word: יָמִים רַבִּים
  choice: దీర్ఘాయుష్షు
  rationale: అక్షరార్థంగా ‘అనేక దినాలు’; సందర్భంలో ఎక్కువ కాలం జీవించడాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది. అక్షరార్థ ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంది.
- source_word: חָכְמָה וּמַדָּע
  choice: జ్ఞానం, పరిజ్ఞానం
  rationale: రెండు సమీపమైనా వేర్వేరు పదాలను ఒకే తెలుగు పదంలో కలపకుండా భేదాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר תִּשְׁפּוֹט אֶת עַמִּי
  choice: నా ప్రజలకు న్యాయం తీర్చడానికి
  rationale: שׁפט అనే న్యాయనిర్ణయ భావాన్ని ‘పరిపాలించడానికి’గా సాధారణీకరించకుండా, రాజు న్యాయం తీర్చే బాధ్యతను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר הִמְלַכְתִּיךָ עָלָיו
  choice: నేను నిన్ను ఏ ప్రజల మీద రాజుగా నియమించానో
  rationale: దేవుడే సొలొమోనును రాజుగా చేసినట్లు క్రియ యొక్క కర్తృత్వాన్ని, ప్రజల మీద అతని రాజాధికారాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవ వక్త אֱלֹהִים యొక్క అనువాదం
  choice: దేవుడు
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో אֱלֹהִים ఉంది; దైవనామమైన יהוה లేదు. కాబట్టి ‘దేవుడు’ అనేదే మూలానికి అనుగుణం.
- issue: שׁפט యొక్క రాజసంబంధ భావం
  choice: న్యాయం తీర్చడానికి
  alternative: పరిపాలించడానికి
  rationale: రాజ్యపాలన భావం సందర్భంలో ఉన్నప్పటికీ, మూలక్రియలోని న్యాయనిర్ణయ అర్థాన్ని ప్రధాన పాఠంలో కాపాడడం అవసరం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. హెబ్రీయ ‘హృదయం’ రూపకాన్ని నిలిపి, జాబితాను సహజ తెలుగు విభక్తులతో అందించింది. వాక్యం తదుపరి వచనంలో కొనసాగే నిర్మాణం కలిగినప్పటికీ, ఈ వచనాన్ని తెలుగు ఉద్ధరణలో సంపూర్ణంగా చదవగలిగేలా ముగించింది.
