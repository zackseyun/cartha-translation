- from: 'దేవుడు సొలొమోనుతో ఇలా అన్నాడు: “ఇది నీ హృదయంలో ఉంది; నీవు సంపదనుగానీ, ఆస్తులనుగానీ, ఘనతనుగానీ, నిన్ను ద్వేషించేవారి ప్రాణాన్నిగానీ[a] అడగలేదు. దీర్ఘాయుష్షునూ[b] అడగలేదు. అయితే నేను నిన్ను ఏ ప్రజల మీద రాజుగా నియమించానో, ఆ నా ప్రజలకు న్యాయం తీర్చడానికి నీ కోసం జ్ఞానాన్నీ పరిజ్ఞానాన్నీ అడిగావు.”'
  to: 'దేవుడు సొలొమోనుతో ఇలా అన్నాడు: “ఇది నీ హృదయంలో ఉన్నందున, నీవు సంపదనుగానీ, ఆస్తులనుగానీ, ఘనతనుగానీ, నిన్ను ద్వేషించేవారి ప్రాణాన్నిగానీ[a] అడగలేదు; అనేక దినాలను కూడా అడగలేదు[b]; అయితే, నేను నిన్ను వారి మీద రాజుగా నియమించిన నా ప్రజలకు న్యాయం తీర్చడానికి నీ కోసం వివేకాన్నీ జ్ఞానాన్నీ అడిగావు,”'
  rationale: The revision explicitly translates the Hebrew causal introduction, removes the misleading subject sequence in the purpose clause, and preserves the source order and open-ended quotation. It retains the source’s singular “life” in the main text, while giving the pluralized contextual alternative in the footnote. The footnote for “many days” identifies the natural contextual sense, “long life,” while retaining the literal wording.
