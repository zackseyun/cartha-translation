id: 2CH.1.9
reference: 2 Chronicles 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַתָּה֙ יְהוָ֣ה אֱלֹהִ֔ים יֵֽאָמֵן֙ דְּבָ֣רְ/ךָ֔ עִ֖ם דָּוִ֣יד אָבִ֑/י כִּ֤י אַתָּה֙ הִמְלַכְתַּ֔/נִי עַל עַ֕ם רַ֖ב כַּ/עֲפַ֥ר הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/009.yaml
  text: Now[a], Yahweh God, let your word to David my father be confirmed, for you have made me king over a people as numerous as the dust of the earth.
translation:
  language: te
  text: ఇప్పుడు యాహ్వే దేవా, నా తండ్రి దావీదుకు నీవు పలికిన మాట స్థిరపడుగాక[a]. ఎందుకంటే భూమి ధూళివలె అసంఖ్యాకమైన ప్రజల మీద నీవు నన్ను రాజుగా చేశావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా తండ్రి దావీదుకు నీవిచ్చిన వాగ్దానం స్థాపించబడుగాక.”
    reason: דְּבָרְךָకు అక్షరార్థంగా ‘నీ మాట’ అని అర్థం; సందర్భంలో దావీదుకు ఇచ్చిన వాగ్దానం అనే భావం కూడా ఉంది. יֵאָמֵןకు ‘స్థాపించబడుగాక’ ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: సొలొమోను విన్నపాన్ని ప్రారంభించే కాలసూచకమైన సంభాషణ పదాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా అనువదిస్తుంది.
- source_word: יְהוָה אֱלֹהִים
  choice: యెహోవా దేవా
  rationale: దైవనామాన్ని యెహోవా అని లిప్యంతరీకరించి, ప్రార్థనలోని సంబోధనను తెలుగులో సహజంగా చూపడానికి ‘దేవా’ వాడబడింది.
- source_word: יֵאָמֵן
  choice: స్థిరపడుగాక
  rationale: אמן నిఫల్ రూపంలోని స్థిరపరచబడడం, నిజమని రుజువవడం అనే భావాలను ప్రార్థనాత్మక కోరికగా వ్యక్తం చేస్తుంది; కర్తను అదనంగా చేర్చదు.
- source_word: דְּבָרְךָ
  choice: నీవు చెప్పిన మాట
  rationale: అక్షరార్థమైన ‘నీ మాట’ భావాన్ని నిలుపుతూ, దావీదుకు పలికిన మాట అనే సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది; ‘వాగ్దానం’ అనే సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో నిర్బంధించదు.
- source_word: עִם דָּוִיד אָבִי
  choice: నా తండ్రి దావీదుకు
  rationale: דבר עם అనే సందర్భోచిత ప్రయోగం దావీదుకు చెప్పిన మాటను సూచిస్తుంది; ‘తో’ అనే యాంత్రిక అనువాదం కంటే ఈ రూపం తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: సొలొమోను విన్నపానికి ఆధారాన్ని పరిచయం చేసే కారణార్థక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הִמְלַכְתַּנִי
  choice: నీవు నన్ను రాజుగా నియమించావు
  rationale: מלך హిఫిల్ రూపంలోని ‘రాజుగా చేయడం’ అనే కారణార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַל עַם רַב
  choice: విస్తారమైన ప్రజలపై
  rationale: తరువాతి ధూళి ఉపమానం సంఖ్యాబాహుళ్యాన్ని సూచిస్తున్నందున רַב పదంలోని ‘అనేకమైన/విస్తారమైన’ భావాన్ని ఎంచుకుంది.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: భూమి ధూళివలె
  rationale: లెక్కించలేనంత విస్తారాన్ని తెలిపే హీబ్రూ ఉపమానాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠ్యంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణతో నిలుపుతుంది.
- issue: דְּבָרְךָ ను ‘మాట’గా లేదా ‘వాగ్దానం’గా వ్యక్తం చేయడం
  choice: నీవు చెప్పిన మాట
  alternative: నీ వాగ్దానం
  rationale: సందర్భంలో ఇది దావీదుకు ఇచ్చిన వాగ్దానమే అయినప్పటికీ, హీబ్రూ పదం విస్తృతమైన ‘మాట’ అనే అర్థాన్ని కలిగి ఉంది. ప్రధాన పాఠ్యం ఆ విస్తృతిని నిలుపుతుంది; వాగ్దానార్థాన్ని పాదటిప్పణి తెలియజేస్తుంది.
- issue: יֵאָמֵן లోని భావ ఛాయ
  choice: స్థిరపడుగాక
  alternative: నిజమని రుజువగుగాక
  rationale: ఈ రూపం దేవుని మాట నెరవేరి దృఢంగా స్థాపించబడాలనే విన్నపాన్ని తెలియజేస్తూ, అది ఇంతవరకు అసత్యమైందన్న భావాన్ని కలిగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ప్రార్థనకు తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. అతిగా ప్రాచీనమైన పదక్రమాన్ని నివారిస్తూ, ‘స్థిరపడుగాక’ వంటి ప్రార్థనాత్మక రూపంతో మూలంలోని కోరిక భావాన్ని నిలిపాం.
