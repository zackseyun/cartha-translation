  to: ఇప్పుడు యాహ్వే దేవా, నా తండ్రి దావీదుకు నీవు పలికిన మాట స్థిరపడుగాక[a]. ఎందుకంటే భూమి ధూళివలె అసంఖ్యాకమైన ప్రజల మీద నీవు నన్ను రాజుగా చేశావు.
