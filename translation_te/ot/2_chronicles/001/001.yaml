id: 2CH.1.1
reference: 2 Chronicles 1:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתְחַזֵּ֛ק שְׁלֹמֹ֥ה בֶן דָּוִ֖יד עַל מַלְכוּת֑/וֹ וַ/יהוָ֤ה אֱלֹהָי/ו֙ עִמּ֔/וֹ וַֽ/יְגַדְּלֵ֖/הוּ לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/001.yaml
  text: And Solomon son of David strengthened himself over his kingdom[b][a], and Yahweh his God was with him and made him exceedingly great.
translation:
  language: te
  text: దావీదు కుమారుడైన సొలొమోను తన రాజ్యాధికారంలో బలపడ్డాడు[a]; అతని దేవుడైన యాహ్వే[b] అతనితో ఉండి, అతన్ని అత్యంత గొప్పవాడిగా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన రాజ్యాధికారంలో తనను తాను బలపరచుకున్నాడు’; లేదా, ‘తన రాజ్యాధికారంలో స్థిరపడ్డాడు.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో יהוה (YHWH) అనే దైవనామం.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: బలపడ్డాడు
  rationale: חזק హిత్పయేల్ రూపం స్వప్రయత్నంతో బలపడడం లేదా స్థిరపడడం అనే భావాలను కలిగి ఉంది. ‘బలపడ్డాడు’ అనే రూపం కర్తృత్వాన్ని అతిగా నిర్దిష్టం చేయకుండా మూలంలోని ప్రతిఫలాత్మక/అకర్మక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עַל מַלְכוּתוֹ
  choice: తన రాజ్యంపై
  rationale: עַל అధికారాన్ని లేదా ఆధిపత్య స్థానాన్ని సూచించగలదు; ‘తన రాజ్యంపై’ అనేది ‘రాజ్యంలో’ లేదా ‘రాజ్యాధికారంలో’ అని ముందే వివరణాత్మకంగా నిర్ణయించకుండా మూలంలోని రూపక భావాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణకు అనుగుణంగా తెలుగులో ‘యాహ్వే’ అని ఇచ్చాం.
- source_word: אֱלֹהָיו
  choice: అతని దేవుడు
  rationale: మూలంలోని స్వామ్య సంబంధాన్ని నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עִמּוֹ
  choice: అతనికి తోడుగా ఉండి
  rationale: దేవుని సన్నిధి మరియు అనుగ్రహాన్ని సూచించే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וַיְגַדְּלֵהוּ
  choice: అతన్ని ... గొప్పవాడిగా చేశాడు
  rationale: גדל పీయేల్ రూపంలోని కారణార్థక భావాన్ని స్పష్టంగా నిలుపుతుంది; సొలొమోనును గొప్పవాడిగా చేసిన కర్త యాహ్వే అని చూపుతుంది.
- source_word: לְמָעְלָה
  choice: అత్యంత
  rationale: ఇక్కడ ఈ పదం క్రియావిశేషణాత్మకంగా తీవ్రతను సూచిస్తుంది; ‘అత్యంత’ అనేది ఆ బలమైన పరిమాణ భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: בֶן דָּוִיד
  choice: దావీదు కుమారుడైన
  rationale: వంశ సంబంధాన్ని నేరుగా నిలుపుతూ, తెలుగులో సహజమైన విశేషణ నిర్మాణాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని నామాన్ని నిలుపుతుంది.
- issue: సొలొమోను ఎదుగుదలలో కర్తృత్వం
  choice: సొలొమోను బలపడటాన్నీ, యాహ్వే అతన్ని గొప్పవాడిగా చేయటాన్నీ రెండింటినీ నిలుపడం
  alternative: మొదటి క్రియను పూర్తిగా కర్మణిగా ‘బలపరచబడ్డాడు’ అని ఇవ్వడం; లేదా ‘రాజ్యంలో స్థిరపరచబడ్డాడు’ అని వివరణాత్మకంగా ఇవ్వడం
  rationale: హీబ్రూ వాక్యం సొలొమోను బలపడటాన్ని, దేవుని సన్నిధిని, దేవుడు అతన్ని గొప్పవాడిగా చేయటాన్ని కలిపి ఉంచుతుంది. అనువాదం మానవ మరియు దైవ కర్తృత్వాల మధ్య ఉన్న ఈ ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘బలపడ్డాడు’ అనే సంక్షిప్త రూపం మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది; దాని ప్రధాన ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
