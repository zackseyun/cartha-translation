  source_fidelity: మొదటి క్రియకు ‘బలపడ్డాడు’ సరైన అకర్మక/ప్రతిఫలాత్మక పరిధిని ఇస్తుంది. అయితే ‘తన రాజ్యంపై బలపడ్డాడు’ ఆధునిక తెలుగులో అసహజంగా ఉండి, రాజ్యంతో సంబంధాన్ని స్పష్టంగా తెలియజేయదు. ‘తన రాజ్యాధికారంలో బలపడ్డాడు’ అనేది עַל־מַלְכוּתוֹ యొక్క రాజాధికార/పాలన సందర్భాన్ని సహజంగా వ్యక్తం చేస్తుంది; దాన్ని దేవుని చేత స్థిరపరచబడినట్లు అనవసరంగా నిర్దిష్టం చేయదు. యాహ్వే అతనితో ఉండడం, అతన్ని గొప్పవాడిగా చేయడం రెండూ మూలానికి నమ్మకంగా ఉన్నాయి.
