  yaml_path: translation/ot/2_chronicles/001/007.yaml
  text: That night God appeared to Solomon and said to him[a], “Ask what I should give you.”
translation:
  language: te
  text: 'ఆ రాత్రి దేవుడు సొలొమోనుకు ప్రత్యక్షమై, అతనితో ఇలా అన్నాడు: “అడుగు, నేను నీకు ఏమి ఇవ్వాలో[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “నేను నీకు ఏమి ఇస్తానో అడుగు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּיְלָה הַהוּא
  choice: ఆ రాత్రి
  rationale: హీబ్రూ పదబంధంలోని నిర్దిష్ట కాలసూచనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נִרְאָה
  choice: ప్రత్యక్షమై
  rationale: నిఫాల్ రూపం ఈ దైవదర్శన సందర్భంలో ‘ప్రత్యక్షమగు’ అనే అర్థాన్ని ఇస్తుంది; ‘కనిపించబడి’ అనేది తెలుగులో కృత్రిమంగా ఉంటుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: పదరూపం బహువచనంలా ఉన్నప్పటికీ ఏకవచన క్రియతో వచ్చి ఇశ్రాయేలు దేవుణ్ణి సూచిస్తోంది.
- source_word: לִשְׁלֹמֹה
  choice: సొలొమోనుకు
  rationale: ל ఉపసర్గ ప్రత్యక్షమైన వ్యక్తిని సూచిస్తోంది; తెలుగులో చతుర్థీ విభక్తి సహజంగా ఉంటుంది.
- source_word: וַיֹּאמֶר לוֹ
  choice: అని అతనితో చెప్పాడు
  rationale: אמר మరియు לוֹ భావాన్ని సహజమైన తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో నిలుపుతుంది.
- source_word: שְׁאַל
  choice: అడుగు
  rationale: సూటిగా ఉన్న ఏకవచన ఆజ్ఞార్థకాన్ని సరళంగా, బహిరంగ ఆహ్వానంగా వ్యక్తం చేస్తుంది.
- source_word: מָה אֶתֶּן לָךְ
  choice: నేను నీకు ఏమి ఇవ్వాలో
  rationale: మూలంలోని ‘నేను నీకు ఏమి ఇస్తాను?’ అనే నిర్మాణాన్ని ‘అడుగు’కు అనుసంధానించిన సహజ తెలుగు పరోక్ష ప్రశ్నగా అందిస్తుంది.
theological_decisions:
- issue: దైవ ప్రత్యక్షత సందర్భంలో אֱלֹהִים అనువాదం
  choice: దేవుడు
  alternative: దేవతలు
  rationale: ఏకవచన క్రియా సమన్వయం మరియు కథన సందర్భం ఒకే దేవుణ్ణి సూచిస్తాయి; అదనపు సిద్ధాంతార్థాన్ని చేర్చకుండా ఏకవచనాన్ని నిలుపుతుంది.
- issue: מָה אֶתֶּן לָךְ లోని భవిష్యత్/సంకల్ప భావం
  choice: నేను నీకు ఏమి ఇవ్వాలో
  alternative: నేను నీకు ఏమి ఇస్తానో
  rationale: ‘అడుగు’ తరువాత వచ్చే పరోక్ష ప్రశ్నను సహజ తెలుగులో వ్యక్తం చేస్తూ, దేవుడు ఏమి ఇవ్వనున్నాడనే మూల భావాన్ని నిలుపుతుంది; ప్రత్యామ్నాయం భవిష్యత్ భావాన్ని మరింత ప్రత్యక్షంగా చూపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళమైనప్పటికీ గౌరవప్రదమైన బైబిలు కథన శైలి. ‘ప్రత్యక్షమై’ దైవదర్శన సందర్భానికి సహజంగా సరిపోతుంది.
