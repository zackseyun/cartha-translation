  text: בַּ/לַּ֣יְלָה הַ/ה֔וּא נִרְאָ֥ה אֱלֹהִ֖ים לִ/שְׁלֹמֹ֑ה וַ/יֹּ֣אמֶר ל֔/וֹ שְׁאַ֖ל מָ֥ה אֶתֶּן לָֽ/ךְ־׃
