translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. రెండు సమాంతర హీబ్రూ పోలికలను తెలుగులోనూ నిలిపి, נתן యొక్క సందర్భానుగుణ ఫలితార్థాన్ని ‘విస్తారంగా చేశాడు’గా వ్యక్తం చేశాం. ప్రధాన పాఠ్యంలో సాంకేతిక భౌగోళిక పేరు వాడకుండా, పాదసూచికలో ‘షెఫేలా’ను వివరించాం.
