  edition: WLC
  text: וַ/יִּתֵּ֨ן הַ/מֶּ֜לֶךְ אֶת הַ/כֶּ֧סֶף וְ/אֶת הַ/זָּהָ֛ב בִּ/ירוּשָׁלִַ֖ם כָּ/אֲבָנִ֑ים וְ/אֵ֣ת הָ/אֲרָזִ֗ים נָתַ֛ן כַּ/שִּׁקְמִ֥ים אֲשֶׁר בַּ/שְּׁפֵלָ֖ה לָ/רֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/015.yaml
  text: The king made the silver and the gold in Jerusalem as plentiful as stones[b][a], and he made the cedars as plentiful as the sycamore trees that are in the lowland.
translation:
  language: te
  text: రాజు యెరూషలేములో వెండినీ బంగారాన్నీ రాళ్లంత సమృద్ధిగా ఉండేలా చేశాడు[a]. లోతట్టు ప్రాంతంలోని మేడిచెట్లంత సమృద్ధిగా దేవదారు చెట్లు ఉండేలా చేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాళ్లవలె చేశాడు.” హీబ్రూ అసాధారణమైన సమృద్ధిని పోలిక ద్వారా వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “లోతట్టు ప్రాంతం” అంటే కొండ ప్రాంతానికీ తీర మైదానానికీ మధ్యనున్న యూదా పాదప్రాంతమైన షెఫేలాను సూచిస్తుంది. ఇక్కడి “మేడిచెట్లు” సికమోర్-ఫిగ్ జాతి చెట్లు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: విస్తారంగా చేశాడు
  rationale: נתן సాధారణంగా ‘ఇచ్చాడు’ లేదా ‘ఉంచాడు’ అని అర్థమిచ్చినా, ఇక్కడ పోలికతో కలిసి రాజు వాటిని అత్యంత సమృద్ధిగా ఉండేలా చేశాడనే ఫలితార్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: వెండిని, బంగారాన్ని
  rationale: విలువైన లోహాలను వస్తు పదార్థాలుగా సూచించే సహజమైన తెలుగు రూపం; హీబ్రూలోని రెండు ప్రత్యక్ష కర్మలను నిలుపుతుంది.
- source_word: בִּירוּשָׁלִַם
  choice: యెరూషలేములో
  rationale: స్థలాన్ని సూచించే సరళమైన రూపం.
- source_word: כָּאֲבָנִים
  choice: రాళ్లంత విస్తారంగా
  rationale: అక్షరార్థంగా ‘రాళ్లవలె’; సందర్భంలో పదార్థ సారూప్యం కాక అసాధారణ సమృద్ధినే పోలిక సూచిస్తుంది.
- source_word: הָאֲרָזִים
  choice: దేవదారు మ్రాను
  rationale: నిర్మాణ సంపద సందర్భంలో దేవదారు చెట్లకన్నా వాటి కలప సరఫరా ఉద్దేశించబడే అవకాశం ఉంది; ‘మ్రాను’ సహజమైన తెలుగు పదం, అయితే ఇది సందర్భానుగుణ వివరణాత్మక ఎంపిక.
- source_word: כַּשִּׁקְמִים
  choice: మేడిచెట్లంత
  rationale: שׁקמה ప్రాంతీయ సికమోర్-ఫిగ్ చెట్టును సూచిస్తుంది. సాధారణ తెలుగు పాఠకుడికి సుపరిచితమైన సంప్రదాయ వృక్షనామంగా ‘మేడిచెట్లు’ ఎంచుకోబడింది; ఖచ్చిత జాతి గురించి పాదసూచిక వివరిస్తుంది.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: లోతట్టు ప్రాంతంలోని
  rationale: שְׁפֵלָה యూదా కొండప్రాంతానికీ తీర మైదానానికీ మధ్యనున్న తక్కువ ఎత్తుగల పాదప్రాంతాన్ని సూచిస్తుంది; ప్రధాన పాఠ్యంలో సహజమైన సాధారణ పదబంధం వాడబడింది.
- source_word: לָרֹב
  choice: విస్తారంగా
  rationale: ‘సమృద్ధిగా’ అనే భావాన్ని పోలికలో సహజంగా కలిపి, దేవదారు మ్రాను అత్యధికంగా లభించిందనే అర్థాన్ని అందిస్తుంది.
