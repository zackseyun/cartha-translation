translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాణిజ్య భాషను వాడింది. మూలంలోని వర్తక సందర్భాన్ని ‘తెప్పించేవారు/ఎగుమతి చేసేవారు’ అనే జోడీతో తెలిపింది; అరాము అనే ప్రాచీన నామాన్ని నిలిపింది.
