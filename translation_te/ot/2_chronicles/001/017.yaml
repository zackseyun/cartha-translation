source:
  edition: WLC
  text: וַֽ֠/יַּעֲלוּ וַ/יּוֹצִ֨יאוּ מִ/מִּצְרַ֤יִם מֶרְכָּבָה֙ בְּ/שֵׁ֣שׁ מֵא֣וֹת כֶּ֔סֶף וְ/ס֖וּס בַּ/חֲמִשִּׁ֣ים וּ/מֵאָ֑ה וְ֠/כֵן לְ/כָל מַלְכֵ֧י הַֽ/חִתִּ֛ים וּ/מַלְכֵ֥י אֲרָ֖ם בְּ/יָדָ֥/ם יוֹצִֽיאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/017.yaml
  text: They imported from Egypt a chariot for six hundred shekels of silver[a], and a horse for one hundred fifty[c][b]; and so they exported them to all the kings of the Hittites and the kings of Aram.
translation:
  language: te
  text: వారు ఈజిప్టు నుండి ఒక రథాన్ని ఆరు వందల షెకెల్ల వెండికి[a], ఒక గుర్రాన్ని నూట యాభై షెకెల్ల వెండికి తెప్పించారు. అలాగే హిత్తీయుల రాజులందరికీ, అరాము రాజులకు వారి ద్వారా వాటిని ఎగుమతి చేశారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘షెకెల్లు’ అనే ప్రమాణం స్పష్టంగా లేదు; ధరల సందర్భాన్ని బట్టి వెండి తూకపు ప్రమాణంగా చేర్చబడింది.
    reason: supplied_measure
  - marker: b
    text: హీబ్రూ నుడికారం అక్షరార్థంగా ‘వారి చేతి ద్వారా’; అంటే ‘వారి ద్వారా’ లేదా ‘వారి ప్రతినిధుల ద్వారా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ וַיּוֹצִיאוּ מִמִּצְרַיִם
  choice: ఈజిప్టు నుండి ... తెప్పించేవారు
  rationale: రెండు చలన క్రియలు అక్షరార్థంగా ‘పైకి తీసుకువచ్చి, బయటికి తీసుకొచ్చారు’ అని ఉన్నా, ధరలతో కూడిన ఈ వాణిజ్య సందర్భంలో ఈజిప్టు నుండి సరుకులను తెప్పించడం అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מֶרְכָּבָה
  choice: ఒక రథాన్ని
  rationale: ప్రతి వస్తువుకు నిర్ణయించిన ధరను తెలిపే సందర్భం కాబట్టి ఏకవచనాన్ని వ్యక్తిగత యూనిట్‌గా నిలిపింది.
- source_word: בְּשֵׁשׁ מֵאוֹת כֶּסֶף
  choice: ఆరు వందల తులాల వెండికి
  rationale: హీబ్రూలో వెండి పరిమాణం మాత్రమే ఉంది; సందర్భంలో సూచితమైన తూకపు ప్రమాణాన్ని ఆధునిక పాఠకునికి స్పష్టం చేయడానికి ‘తులాలు’ అని సరఫరా చేసింది.
- source_word: וְסוּס בַּחֲמִשִּׁים וּמֵאָה
  choice: ఒక గుర్రాన్ని నూట యాభై తులాల వెండికి
  rationale: సוּס సాధారణంగా ‘గుర్రం’; ముందు ధరలో సూచించిన వెండి తూకపు ప్రమాణాన్ని రెండవ ధరలోనూ స్పష్టత కోసం పునరుద్ఘాటించింది.
- source_word: לְכָל מַלְכֵי הַחִתִּים וּמַלְכֵי אֲרָם
  choice: హిత్తీయుల రాజులందరికీ, అరాము రాజులకు
  rationale: జనసమూహపు పేరును ‘హిత్తీయులు’గా, אֲרָם అనే ప్రాచీన ప్రాంతనామాన్ని ‘సిరియా’గా మార్చకుండా ‘అరాము’గా లిప్యంతరీకరించింది.
- source_word: בְּיָדָם יוֹצִיאוּ
  choice: వారి ద్వారానే వాటిని ఎగుమతి చేసేవారు
  rationale: ‘వారి చేతి ద్వారా’ అనే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో మధ్యవర్తిత్వం/ప్రతినిధిత్వాన్ని సూచించే ‘వారి ద్వారానే’గా నిలిపి, יוֹצִיאוּ యొక్క వాణిజ్య భావాన్ని ‘ఎగుమతి చేసేవారు’గా తెలిపింది.
