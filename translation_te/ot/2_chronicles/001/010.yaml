id: 2CH.1.10
reference: 2 Chronicles 1:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַתָּ֗ה חָכְמָ֤ה וּ/מַדָּע֙ תֶּן לִ֔/י וְ/אֵֽצְאָ֛ה לִ/פְנֵ֥י הָֽ/עָם הַ/זֶּ֖ה וְ/אָב֑וֹאָה כִּֽי מִ֣י יִשְׁפֹּ֔ט אֶת עַמְּ/ךָ֥ הַ/זֶּ֖ה הַ/גָּדֽוֹל־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/010.yaml
  text: Now give me wisdom and knowledge[a], so that I may go out and come in before this people[b], for who can judge this great people of yours?
translation:
  language: te
  text: ఇప్పుడు నాకు వివేకాన్నీ జ్ఞానాన్నీ ఇవ్వు, నేను ఈ ప్రజల ముందు బయటికి వెళ్లి లోపలికి రాగలిగేలా[a]. నీ ఈ గొప్ప ప్రజలకు న్యాయం తీర్చగలిగేది ఎవరు?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఈ ప్రజల ముందు బయటికి వెళ్లి లోపలికి రావడం.” ఇది ప్రజలకు నాయకత్వం వహించడాన్ని సూచించే నుడికారం.
    reason: cultural_note
  - marker: b
    text: లేదా, “నీ ఈ విస్తారమైన ప్రజలకు.” ‘గొప్ప’ అనే పదం పరిమాణాన్నీ ప్రాముఖ్యాన్నీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: సొలొమోను అభ్యర్థనను ప్రారంభించే కాలసూచక పదాన్ని సహజంగా, నేరుగా వ్యక్తపరుస్తుంది.
- source_word: חָכְמָה וּמַדָּע
  choice: జ్ఞానాన్నీ వివేకాన్నీ
  rationale: חָכְמָהకు ‘జ్ఞానం’ సరిపోతుంది; מַדָּע ఇక్కడ పరిపాలనకు అవసరమైన గ్రహింపు లేదా వివేకాన్ని సూచించగలదు. రెండు భావాలను కలిపివేయకుండా జోడీని నిలుపుతుంది.
- source_word: תֶּן לִי
  choice: నాకు ... ఇవ్వు
  rationale: ఆజ్ఞార్థక క్రియను సరళంగా, ప్రత్యక్షంగా అనువదిస్తుంది.
- source_word: וְאֵצְאָה ... וְאָבוֹאָה
  choice: అప్పుడు నేను ... బయలుదేరి, తిరిగి వస్తాను
  rationale: హీబ్రూ నాయకత్వ నుడికారంలోని ‘బయటికి వెళ్లడం, లోపలికి రావడం’ అనే చిత్రాన్ని తెలుగు పాఠకునికి సహజంగా ఉండే రీతిలో సాధ్యమైనంతవరకు నిలుపుతుంది; దాని కార్యార్థాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: לִפְנֵי הָעָם הַזֶּה
  choice: ఈ ప్రజల ముందు
  rationale: לִפְנֵי యొక్క ‘ముందు/ఎదుట’ అనే స్థానిక చిత్రాన్నీ, ప్రజలకు నాయకత్వం వహించే సందర్భాన్నీ కాపాడుతుంది.
- source_word: מִי יִשְׁפֹּט
  choice: న్యాయం తీర్చగలవాడు ఎవడు?
  rationale: יִשְׁפֹּט యొక్క న్యాయనిర్ణయ భావాన్ని నిలుపుతూ, ప్రశ్నలో అంతర్లీనంగా ఉన్న సామర్థ్య భావాన్ని ‘తీర్చగలవాడు’ ద్వారా వ్యక్తపరుస్తుంది.
- source_word: עַמְּךָ הַזֶּה הַגָּדוֹל
  choice: ఇంత గొప్పదైన నీ ప్రజ
  rationale: ‘నీ ప్రజ’ అనే దేవునితో ప్రత్యక్ష సంబంధాన్ని నిలుపుతుంది. הַגָּדוֹל పరిమాణాన్నీ ప్రాముఖ్యాన్నీ సూచించగలందున విస్తృతార్థకమైన ‘గొప్పదైన’ ఎంచుకుంది.
theological_decisions:
- issue: సొలొమోను అభ్యర్థనలోని నాయకత్వ నుడికారం
  choice: ‘ఈ ప్రజల ముందు బయలుదేరి, తిరిగి వస్తాను’ అనే మూలపాఠ చిత్రాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘ఈ ప్రజలకు నాయకత్వం వహిస్తాను’ లేదా ‘ఈ ప్రజలను పరిపాలిస్తాను’
  rationale: స్పష్టమైన కార్యార్థాన్ని ప్రధాన పాఠ్యంలో పెట్టడం సులభమైనా, అది హీబ్రూ నుడికారాన్ని పూర్తిగా వివరణగా మార్చుతుంది. మూలంలోని చిత్రాన్ని నిలిపి, అర్థాన్ని పాదటిప్పణిలో తెలియజేయడం భావసమతుల్యతను కాపాడుతుంది.
- issue: הַגָּדוֹל పదం యొక్క పరిధి
  choice: గొప్పదైన
  alternative: విస్తారమైన లేదా ఎంతో పెద్దదైన
  rationale: ఈ విశేషణం జనసంఖ్య పరిమాణంతో పాటు ప్రజల ప్రాముఖ్యాన్నీ సూచించవచ్చు. ‘గొప్పదైన’ ఆ ద్వంద్వసాధ్యతను అనవసరంగా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. దేవునితో ఏకవచన ప్రత్యక్ష సంభాషణకు సహజమైన ‘ఇవ్వు’ వాడబడింది. హీబ్రూ నాయకత్వ నుడికారాన్ని ప్రధాన పాఠ్యంలో ఉంచి, దాని అర్థాన్ని పాదటిప్పణిలో వివరించాం.
