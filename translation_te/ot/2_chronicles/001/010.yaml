  to: ఇప్పుడు నాకు వివేకాన్నీ జ్ఞానాన్నీ ఇవ్వు, నేను ఈ ప్రజల ముందు బయటికి వెళ్లి లోపలికి రాగలిగేలా[a]. నీ ఈ గొప్ప ప్రజలకు న్యాయం తీర్చగలిగేది ఎవరు?[b]
