id: 2CH.1.8
reference: 2 Chronicles 1:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁלֹמֹה֙ לֵֽ/אלֹהִ֔ים אַתָּ֗ה עָשִׂ֛יתָ עִם דָּוִ֥יד אָבִ֖/י חֶ֣סֶד גָּד֑וֹל וְ/הִמְלַכְתַּ֖/נִי תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/008.yaml
  text: And Solomon said to God[a], “You have shown great covenant faithfulness to David my father, and you have made me king in his place.”
translation:
  language: te
  text: 'సొలొమోను దేవునితో ఇలా అన్నాడు: “నీవు నా తండ్రి దావీదు పట్ల నిబద్ధమైన గొప్ప ప్రేమను చూపించావు[a]; అతని స్థానంలో నన్ను రాజుగా చేశావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా తండ్రి దావీదు పట్ల గొప్ప దయను చూపించావు”; లేదా “స్థిరమైన గొప్ప ప్రేమను చూపించావు.” హీబ్రూ חֶסֶד అనే పదం తరచుగా విశ్వసనీయమైన, నిబంధనబద్ధమైన ప్రేమ లేదా నిబద్ధత అనే భావాన్ని కలిగి ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగు కథన శైలిలో ‘ఇలా అన్నాడు’ సహజంగా ఉండి, తరువాత వచ్చే ప్రత్యక్ష సంభాషణను స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: לֵאלֹהִים
  choice: దేవునితో
  rationale: ఇక్కడ אֱלֹהִים సొలొమోను సంబోధిస్తున్న ఏకైక దేవుణ్ణి సూచిస్తుంది. ‘దేవునితో’ అనేది తెలుగు వాక్య నిర్మాణంలో సహజమైన అనువాదం.
- source_word: עָשִׂיתָ עִם ... חֶסֶד גָּדוֹל
  choice: పట్ల నిబంధనకు కట్టుబడిన గొప్ప ప్రేమను చూపించావు
  rationale: עשה עם + חֶסֶד అనే ప్రయోగం ఒకరి పట్ల విశ్వసనీయమైన, నిబంధన సంబంధమైన ప్రేమతో వ్యవహరించడాన్ని సూచిస్తుంది. ‘నిబంధనకు కట్టుబడిన గొప్ప ప్రేమ’ అనే రూపం חֶסֶדలోని ప్రేమ, విశ్వసనీయత, నిబంధనబద్ధతలను సాధ్యమైనంత సహజమైన తెలుగులో కలిపి వ్యక్తం చేస్తుంది; גָּדוֹלను ‘గొప్ప’గా నేరుగా అనువదించింది.
- source_word: דָּוִיד אָבִי
  choice: నా తండ్రి దావీదు
  rationale: తెలుగులో ‘నా తండ్రి దావీదు’ సహజమైన పదక్రమం; మూలంలోని బంధ సంబంధాన్ని, వ్యక్తి పేరును స్పష్టంగా నిలుపుతుంది.
- source_word: וְהִמְלַכְתַּנִי
  choice: నన్ను రాజుగా చేశావు
  rationale: מלך హిఫీల్ రూపం ‘రాజుగా చేయడం’ లేదా ‘పాలించేలా చేయడం’ అనే కారక భావాన్ని ఇస్తుంది. ఈ ఎంపిక దేవుని కార్యాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: రాజ వారసత్వ సందర్భంలో תחת అంటే మరొకరి స్థానాన్ని స్వీకరించడం. ‘అతని స్థానంలో’ బలవంతపు తొలగింపును సూచించకుండా వారసత్వ భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: దావీదుతో సంబంధమైన సందర్భంలో חֶסֶד అనువాదం
  choice: నిబంధనకు కట్టుబడిన గొప్ప ప్రేమ
  alternative: గొప్ప దయ; స్థిరమైన గొప్ప ప్రేమ; గొప్ప నిబంధన విశ్వసనీయత
  rationale: ఈ సందర్భం దేవుడు దావీదు పట్ల చూపిన నిబద్ధమైన సంబంధాన్ని జ్ఞాపకం చేస్తుంది. కేవలం ‘దయ’ అని అనడం భావాన్ని కుదించవచ్చు; కేవలం ‘విశ్వసనీయత’ అని అనడం ప్రేమాంశాన్ని తగ్గించవచ్చు. ఎంచుకున్న పదబంధం חֶסֶדలోని ప్రేమను, స్థిరత్వాన్ని, నిబంధన సంబంధిత నిబద్ధతను కలిపి ఉంచుతుంది.
- issue: రాజ్య వారసత్వంలో దేవుని కార్యం
  choice: అతని స్థానంలో నన్ను రాజుగా చేశావు
  alternative: అతని తరువాత నన్ను పాలించేలా చేశావు
  rationale: ఈ రూపం సొలొమోను రాజుగా కావడంలో దేవుని కారక కార్యాన్ని నిలుపుతూ, תַּחְתָּיוలోని ‘స్థానంలో’ అనే వారసత్వ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘నిబంధనకు కట్టుబడిన గొప్ప ప్రేమ’ కొంత వివరణాత్మకమైనప్పటికీ, חֶסֶדలోని బహుళ భావాలను అతిగా సిద్ధాంతీకరించకుండా సంరక్షిస్తుంది.
