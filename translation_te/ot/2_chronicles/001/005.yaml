id: 2CH.1.5
reference: 2 Chronicles 1:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִזְבַּ֣ח הַ/נְּחֹ֗שֶׁת אֲשֶׁ֤ר עָשָׂה֙ בְּצַלְאֵל֙ בֶּן אוּרִ֣י בֶן ח֔וּר שָׂ֕ם לִ/פְנֵ֖י מִשְׁכַּ֣ן יְהוָ֑ה וַ/יִּדְרְשֵׁ֥/הוּ שְׁלֹמֹ֖ה וְ/הַ/קָּהָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/005.yaml
  text: And the bronze altar that Bezalel son of Uri[a], son of Hur, had made was there before the tabernacle of Yahweh, and Solomon and the assembly sought it there.
translation:
  language: te
  text: హూరు కుమారుడైన ఊరీ కుమారుడు బెసలేలు చేసిన కంచు బలిపీఠం యెహోవా నివాసపు గుడారం ఎదుట ఉంచబడి ఉంది; సొలొమోను మరియు సమాజం దానిని వెదికారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సొలొమోను మరియు సమాజం ఆయనను వెదికారు.” హీబ్రూ ప్రత్యయం వ్యాకరణపరంగా కంచు బలిపీఠాన్నీ యెహోవాన్నీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִזְבַּח הַנְּחֹשֶׁת
  choice: కంచు బలిపీఠం
  rationale: మִזְבֵּחַ అంటే బలిపీఠం; ఈ ఆరాధనా సామగ్రి సందర్భంలో נְחֹשֶׁתను ఆధునిక తెలుగులో సహజంగా ‘కంచు’ అని అనువదించాం.
- source_word: אֲשֶׁר עָשָׂה
  choice: చేసిన
  rationale: బెసలేలు ముందుగా తయారుచేసిన బలిపీఠాన్ని గుర్తించే సంబంధవాచక ఉపవాక్యంగా సహజ తెలుగులో ఇచ్చాం.
- source_word: בְּצַלְאֵל בֶּן אוּרִי בֶן חוּר
  choice: హూరు కుమారుడైన ఊరీ కుమారుడు బెసలేలు
  rationale: హీబ్రూ వంశపరంపర క్రమాన్ని కాపాడుతూ తెలుగులో సంబంధాలు స్పష్టంగా ఉండే నిర్మాణాన్ని వాడాం.
- source_word: שָׂם
  choice: అక్కడే ఉంది
  rationale: పదం ప్రాథమికంగా ‘ఉంచాడు/పెట్టాడు’ అనే భావం ఇవ్వగలిగినా, ఇక్కడ కర్త స్పష్టంగా లేక బలిపీఠం ఉన్న స్థితినే సహజంగా వ్యక్తపరిచాం.
- source_word: לִפְנֵי מִשְׁכַּן יְהוָה
  choice: యెహోవా నివాసమందిరం ఎదుట
  rationale: לִפְנֵי స్థలార్థంగా ‘ఎదుట’; מִשְׁכָּן దేవుని నివాసస్థలమైన గుడారాన్ని సూచిస్తుంది. ‘నివాసమందిరం’ మూలభావాన్ని కాపాడుతుంది.
- source_word: וַיִּדְרְשֵׁהוּ
  choice: ఆయనను అక్కడ వెదికారు
  rationale: דרשׁ దేవుణ్ణి కర్మగా తీసుకున్నప్పుడు ‘వెదుకు/ఆశ్రయించు’ అనే సుపరిచిత బైబిలు భావం కలిగి ఉంటుంది. పురుష ఏకవచన ప్రత్యయం యెహోవాను సూచించవచ్చు; అయితే దాని పూర్వపదం విషయంలో అస్పష్టతను పాదసూచికలో నిలిపాం.
- source_word: שְׁלֹמֹה וְהַקָּהָל
  choice: సొలొమోను, సమాజం
  rationale: קָהָל ఇక్కడ ఆరాధనకై కూడిన ప్రజాసమూహాన్ని సూచిస్తుంది; ‘సమాజం’ ఆధునిక, గౌరవప్రదమైన పదం.
theological_decisions:
- issue: וַיִּדְרְשֵׁהוּలోని పురుష ఏకవచన ప్రత్యయం ఎవరిని సూచిస్తుంది?
  choice: యెహోవాను సూచిస్తున్నదిగా తీసుకొని ‘ఆయనను అక్కడ వెదికారు’ అని అనువదించాం.
  alternative: ప్రత్యయం కంచు బలిపీఠాన్ని సూచిస్తున్నదిగా తీసుకొని ‘దానిని అక్కడ వెదికారు’ అని అనువదించవచ్చు; లేదా ‘అక్కడ విచారించారు’ అనే అకర్మక ఆరాధనా భావం సాధ్యమే.
  rationale: דרשׁకు దేవుడు కర్మగా రావడం హీబ్రూ బైబిలులో సాధారణం; వెంటనే ముందు ‘యెహోవా నివాసమందిరం’ ప్రస్తావన కూడా దీనికి మద్దతిస్తుంది. అయితే సమీప నామవాచకం బలిపీఠమే కాబట్టి అస్పష్టతను పాదసూచికలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. యెహోవా అనే దైవనామాన్ని ప్రత్యక్షంగా నిలిపాం; హీబ్రూ ప్రత్యయంలోని నిజమైన అస్పష్టతను ప్రధాన పఠనం మరియు పాదసూచిక ద్వారా సంరక్షించాం.
