source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֗ה לִ/בְנ֥וֹת בַּ֨יִת֙ לְ/שֵׁ֣ם יְהוָ֔ה וּ/בַ֖יִת לְ/מַלְכוּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/018.yaml
  text: And Solomon said to build a house for the name of Yahweh[b][a], and a house for his kingdom.
translation:
  language: te
  text: సొలొమోను యెహోవా నామం కోసం ఒక గృహాన్ని, తన రాజ్యం కోసం ఒక గృహాన్ని కట్టాలని నిశ్చయించుకున్నాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “చెప్పాడు.” ఈ హీబ్రూ నిర్మాణాన్ని “కట్టాలని నిర్ణయించుకున్నాడు” లేదా “కట్టించమని ఆజ్ఞాపించాడు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'ఇక్కడ హీబ్రూ రెండు చోట్లా “గృహం” అనే ఒకే పదాన్ని వాడుతుంది. భావం: యెహోవా నామం కోసం ఒక మందిరం, తన రాజ్యం కోసం ఒక రాజభవనం.'
    reason: clarification
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: నిశ్చయించుకున్నాడు
  rationale: సాధారణంగా ఈ క్రియ ‘చెప్పాడు’ అని అర్థమిస్తుంది; అయితే తరువాత לִבְנוֹת అనే క్రియార్థక రూపం రావడం వల్ల ఇక్కడ నిర్మించాలని ఉద్దేశించడం లేదా నిర్ణయించడం అనే సందర్భార్థం సహజంగా వస్తుంది. ప్రధాన పాఠంలో సహజమైన తెలుగు కోసం ‘నిశ్చయించుకున్నాడు’ వాడి, మూలంలోని అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: לִבְנוֹת
  choice: కట్టాలని
  rationale: בנה క్రియ యొక్క infinitive construct రూపానికి సహజమైన తెలుగు సమానార్థం; నిర్మాణ కార్యాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: בַּיִת … וּבַיִת
  choice: ఒక గృహాన్ని … ఒక గృహాన్ని
  rationale: మూలంలో ఒకే నామవాచకం రెండుసార్లు రావడాన్ని నిలుపుతుంది. మొదటిది దేవాలయాన్ని, రెండవది రాజభవనాన్ని సూచించినా, వివరణాత్మక పదాలను ప్రధాన పాఠంలో చేర్చి మూలంలోని పదపునరుక్తిని చెరపలేదు.
- source_word: לְשֵׁם יְהוָה
  choice: యెహోవా నామం కోసం
  rationale: దేవాలయం యెహోవా నామంతో సంబంధమున్నదని తెలిపే హీబ్రూ ధార్మిక నుడికారాన్ని నిలుపుతుంది; దేవుడు ఆ భవనంలో పరిమితుడని సూచించదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో వ్యక్తిగత నామంగా అందిస్తుంది.
- source_word: לְמַלְכוּתוֹ
  choice: తన రాజ్యం కోసం
  rationale: సొలొమోను రాజ్యపాలనకు సంబంధించిన రెండవ గృహాన్ని సూచిస్తుంది; ‘తన’ అనే రూపం హీబ్రూలోని మూడవ పురుష ఏకవచన ప్రత్యయాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దేవాలయ సూత్రవాక్యంలో దైవ నామం
  choice: యెహోవా నామం కోసం
  alternative: ప్రభువు నామం కోసం
  rationale: మూలపాఠంలో יהוה అనే వ్యక్తిగత దైవ నామం ఉంది. దాన్ని ‘యెహోవా’గా ఉంచడం నిబంధన నామాన్ని ప్రత్యక్షంగా సంరక్షిస్తుంది.
- issue: בַּיִת పదాన్ని రెండు ఉపవాక్యాల్లో అనువదించడం
  choice: గృహం … గృహం
  alternative: మందిరం … రాజభవనం
  rationale: మూలంలోని ఉద్దేశపూర్వక పదపునరుక్తిని నిలిపి, రెండు నిర్మాణాల స్వరూపాన్ని వాటి అనుబంధ పదబంధాల ద్వారా పాఠకుడు గ్రహించేలా చేస్తుంది.
- issue: וַיֹּאמֶר తరువాత infinitive యొక్క భావం
  choice: నిశ్చయించుకున్నాడు
  alternative: చెప్పాడు / ఆజ్ఞాపించాడు
  rationale: ఈ నిర్మాణం నిర్ణయం, ఉద్దేశం లేదా ఆజ్ఞ అనే భావాలను అనుమతిస్తుంది. సందర్భంలో ‘నిశ్చయించుకున్నాడు’ సహజమైనదైనా, మూల క్రియలోని అస్పష్టతను పాదసూచికలో చూపించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘గృహం’ కొంత సాహిత్యభాషా పదమైనప్పటికీ, దేవాలయం–రాజభవనం రెండింటికీ వర్తించే మూలపద పునరుక్తిని నిలపడానికి అనుకూలం. వాక్యాంతంలో పాదసూచిక సూచికలు రెండూ ప్రధాన పాఠంలో చేర్చబడ్డాయి.
