source:
  edition: WLC
  text: וַ/יָּבֹ֨א שְׁלֹמֹ֜ה לַ/בָּמָ֤ה אֲשֶׁר בְּ/גִבְעוֹן֙ יְר֣וּשָׁלִַ֔ם מִ/לִּ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וַ/יִּמְלֹ֖ךְ עַל יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/013.yaml
  text: Then Solomon came to Jerusalem from the high place that was at Gibeon[a], from before the tent of meeting[c][b], and he reigned over Israel.
translation:
  language: te
  text: అప్పుడు సొలొమోను గిబియోనులో ఉన్న ఉన్నత స్థలం[c] నుండి, సమావేశపు గుడారం ఎదుట నుండి[b], యెరూషలేముకు వచ్చాడు[a]; అతడు ఇశ్రాయేలుపై రాజ్యమేలాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వెళ్లాడు’; హీబ్రూ క్రియను వర్ణకుడి దృష్టికోణాన్ని బట్టి ఈ రెండు విధాలుగా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘సమావేశపు గుడారం ఎదుట నుండి’; ఇది పరిశుద్ధ గుడారం ఉన్న ప్రదేశం నుండి బయలుదేరడాన్ని తెలిపే స్థలసంబంధ అభివ్యక్తి.
    reason: cultural_note
  - marker: c
    text: అంటే, సమావేశపు గుడారం ఉన్న గిబియోనులోని ఆరాధనకు ఉపయోగించిన ఉన్నత స్థలం.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చాడు
  rationale: בוא అనే క్రియ దృష్టికోణాన్ని బట్టి ‘వచ్చాడు’ లేదా ‘వెళ్లాడు’ అని అర్థమవుతుంది. ఇక్కడ గిబియోను నుండి యెరూషలేముకు చేరడాన్ని సహజమైన తెలుగులో ‘వచ్చాడు’ అని అనువదించాం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: לַבָּמָה
  choice: ఉన్నత స్థలం
  rationale: במה అనేది ఆరాధనకు సంబంధించిన ఎత్తైన స్థలాన్ని సూచిస్తుంది. ఈ సందర్భంలో దానిని ప్రతికూలంగా వ్యాఖ్యానించకుండా, మూలపదాన్ని పారదర్శకంగా ప్రతిబింబించే ‘ఉన్నత స్థలం’ అని ఇచ్చాం.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: గిబియోనులో ఉన్న
  rationale: ఉన్నత స్థలం ఎక్కడ ఉందో తెలిపే హీబ్రూ సంబంధవాక్యాన్ని సహజమైన తెలుగు పదక్రమంలో ఉంచాం.
- source_word: יְרוּשָׁלִַם
  choice: యెరూషలేముకు
  rationale: హీబ్రూ పదక్రమం సంక్షిప్తంగా ఉన్నా, సందర్భం సొలొమోను గిబియోను నుండి యెరూషలేముకు తిరిగి చేరాడని చూపుతుంది. గమ్యాన్ని తెలుగులో విభక్తితో స్పష్టం చేశాం.
- source_word: מִלִּפְנֵי
  choice: ఎదుట నుండి
  rationale: ‘ముందు/ఎదుట నుండి’ అనే స్థలసంబంధ అర్థాన్ని నిలుపుతూ, పరిశుద్ధ స్థల పరిసరాల నుండి బయలుదేరడాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: సమావేశపు గుడారం
  rationale: ‘కలుసుకోవడానికి నియమించబడిన గుడారం’ అనే హీబ్రూ అభివ్యక్తిని పారదర్శకంగా నిలుపుతుంది; ‘మందిరం’ వంటి మరింత వ్యాఖ్యానాత్మక పదాన్ని నివారిస్తుంది.
- source_word: וַיִּמְלֹךְ
  choice: పాలించాడు
  rationale: מלך ఇక్కడ రాజుగా పరిపాలించడాన్ని సూచిస్తుంది. సొలొమోను అప్పటికే రాజు కాబట్టి ‘రాజయ్యాడు’ కంటే ‘పాలించాడు’ సందర్భానికి సరిపోతుంది.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలును
  rationale: ‘ఇశ్రాయేలు మీద రాజ్యపాలన చేశాడు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో కర్మరూపంతో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: సంక్షిప్తమైన హీబ్రూ పదక్రమంలో ‘యెరూషలేము’ పదానికి ఉన్న వాక్యనిర్మాణ సంబంధం
  choice: సొలొమోను గిబియోనులోని ఉన్నత స్థలం దగ్గర నుండి యెరూషలేముకు వచ్చాడు
  alternative: హీబ్రూ పదక్రమాన్ని యథాతథంగా ఉంచి, గిబియోను మరియు యెరూషలేము మధ్య సంబంధాన్ని అస్పష్టంగా వదలడం
  rationale: ముందటి సందర్భంలో సొలొమోను గిబియోనుకు వెళ్లాడు; ఈ వచనంలో అతడు అక్కడి సమావేశపు గుడారం ఎదుట నుండి యెరూషలేముకు చేరాడు. తెలుగు వాక్యక్రమం ఈ సందర్భోచిత గమనాన్ని స్పష్టంగా తెలియజేస్తుంది; మూలంలో లేని కొత్త సంఘటనను చేర్చదు.
- issue: సమావేశపు గుడారంతో సంబంధమున్న గిబియోను ఉన్నత స్థల స్వభావం
  choice: ఉన్నత స్థలం
  alternative: ఉన్నత స్థలంలోని పూజామందిరం
  rationale: ఈ వచనం ఆ స్థలాన్ని ఖండించదు; సమావేశపు గుడారం ఉన్న ఆరాధనా స్థలంగా గుర్తిస్తుంది. కాబట్టి పదాన్ని సిద్ధాంతపరంగా ప్రతికూలంగా లేదా అనుకూలంగా విస్తరించకుండా మూలార్థానికే పరిమితం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. ‘ఉన్నత స్థలం,’ ‘సమావేశపు గుడారం’ వంటి మూలపాఠానికి దగ్గరైన పదాలను నిలిపి, అవసరమైన సాంస్కృతిక వివరణను పాదసూచికల్లో ఇచ్చాం. హీబ్రూ వాక్యంలోని గమనదిశను తెలుగు పాఠకుడికి సహజంగా అర్థమయ్యే క్రమంలో అమర్చాం.
