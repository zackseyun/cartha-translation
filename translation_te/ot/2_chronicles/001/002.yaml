source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֣ה לְ/כָל יִשְׂרָאֵ֡ל לְ/שָׂרֵי֩ הָ/אֲלָפִ֨ים וְ/הַ/מֵּא֜וֹת וְ/לַ/שֹּֽׁפְטִ֗ים וּ/לְ/כֹ֛ל נָשִׂ֥יא לְ/כָל יִשְׂרָאֵ֖ל רָאשֵׁ֥י הָ/אָבֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/002.yaml
  text: And Solomon spoke to all Israel—to the commanders of thousands and of hundreds[a], to the judges, and to every leader in all Israel[b], the heads of the fathers’ houses.
translation:
  language: te
  text: సొలొమోను ఇశ్రాయేలీయులందరితో—వేలమంది, వందమంది చొప్పున ఉన్న సమూహాల అధిపతులతో, న్యాయాధిపతులతో, ఇశ్రాయేలు అంతటిలోని ప్రతి నాయకునితో, అంటే పితృకుటుంబాల పెద్దలతో[b]—మాట్లాడాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులందరితో అన్నాడు.”
    reason: lexical_alternative
  - marker: b
    text: “పితృకుటుంబాల పెద్దలు” అంటే వంశాల లేదా పితృసంబంధ కుటుంబ గృహాల నాయకులు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: మాట్లాడాడు
  rationale: క్రియకు ప్రాథమికంగా ‘అన్నాడు’ అనే అర్థమున్నా, అనేక వర్గాలవారిని ఉద్దేశించి చేసిన బహిరంగ ప్రసంగాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘మాట్లాడాడు’ అని అనువదించాం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: לְכָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరితో
  rationale: జాతి మొత్తాన్ని సమష్టిగా సూచించే హీబ్రూ పదబంధాన్ని సాధారణ ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: వేలమందికి, వందలమందికి అధిపతులైన వారు
  rationale: שָׂרִים అనే పదంలోని అధికార లేదా సైనిక నాయకత్వ భావాన్ని ‘అధిపతులు’ నిలుపుతుంది; సంఖ్యాపదాలు సూచించే విభాగాల స్వరూపాన్ని అనవసరంగా నిర్ధారించకుండా మూలంలోని నిర్మాణాన్ని సాధ్యమైనంతగా కాపాడుతుంది.
- source_word: וְלַשֹּׁפְטִים
  choice: న్యాయాధిపతులు
  rationale: ఇశ్రాయేలు పరిపాలనా వ్యవస్థలో తీర్పు చెప్పే స్థిరమైన బాధ్యతను స్పష్టంగా సూచిస్తుంది.
- source_word: וּלְכֹל נָשִׂיא
  choice: ప్రతి నాయకుడు
  rationale: נָשִׂיאకు నాయకుడు, అధిపతి, ప్రధానుడు వంటి అర్థాలున్నాయి; ఆధునిక తెలుగులో రాజకుమారుడు అనే తప్పుదోవ పట్టించే భావం రాకుండా విస్తృతమైన ‘నాయకుడు’ ఎంచుకున్నాం.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: పితృవంశ గృహాల పెద్దలు
  rationale: పితృపరంపర ఆధారంగా ఏర్పడిన వంశ లేదా కుటుంబ గృహాల నాయకులను సూచించే చారిత్రక సామాజిక భావాన్ని నిలుపుతూ, తెలుగులో అర్థమయ్యే రూపాన్ని ఉపయోగించాం.
theological_decisions:
- issue: הָאָבוֹת అనే బంధుత్వ-పరిపాలనా పదబంధం
  choice: పితృవంశ గృహాలు
  alternative: పూర్వీకుల వంశాలు; కుటుంబాలు
  rationale: ఇది సిద్ధాంతపరమైన వివాదాంశం కాదు. అయినా మూలంలోని పురుషవంశాధారిత సామాజిక నిర్మాణాన్ని తటస్థీకరించకుండా చారిత్రక భావాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. జాబితా ‘ఇశ్రాయేలీయులందరూ’ అనే సమష్టి పదాన్ని వివరించేదిగా దీర్ఘ విరామచిహ్నాల మధ్య ఇచ్చాం; చివరి పదబంధంలోని వివరణాత్మక సంబంధాన్ని ‘అంటే’ ద్వారా స్పష్టం చేశాం.
