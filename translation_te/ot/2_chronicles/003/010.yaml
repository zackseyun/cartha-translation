revisions:
- from: అతి పరిశుద్ధ స్థలంలో అతడు చెక్కిన పనిగా రెండు కెరూబులను[a] చేయించి, వాటికి బంగారు పూత పూయించాడు.
  to: అతి పరిశుద్ధ స్థలంలో ఆయన రెండు కెరూబులను శిల్పకృతులుగా[a] చేశాడు; వాటికి బంగారు తాపడం చేశారు.
  rationale: The revision removes unsupported causative force, renders the overlaying as metal plating, and uses a more contextually fitting main-text rendering for the rare term while preserving the debated lexical alternatives in the anchored footnote.
