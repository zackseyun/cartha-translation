translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. అరుదైన హీబ్రూ పదానికి ప్రధాన పాఠ్యంలో సందర్భోచిత అర్థాన్ని ఇచ్చి, నిజమైన పదార్థ అనిశ్చితిని పాదసూచికలో ఉంచాం.
