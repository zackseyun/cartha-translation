source:
  edition: WLC
  text: וַ/יַּ֜עַשׂ בְּ/בֵֽית קֹ֤דֶשׁ הַ/קֳּדָשִׁים֙ כְּרוּבִ֣ים שְׁנַ֔יִם מַעֲשֵׂ֖ה צַעֲצֻעִ֑ים וַ/יְצַפּ֥וּ אֹתָ֖/ם זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/010.yaml
  text: In the Most Holy Place he made two cherubim[a], the work of an image-maker[b], and overlaid them with gold.
translation:
  language: te
  text: అతి పరిశుద్ధ స్థలంలో ఆయన రెండు కెరూబులను శిల్పకృతులుగా[a] చేశాడు; వాటికి బంగారు తాపడం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “శిల్పకృతులుగా” అనే మాటకు “చెక్కిన పనిగా,” “శిల్పకళా పనిగా,” లేదా “ప్రతిమలు చేసే నిపుణుని పనిగా” అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ పదం అరుదైనది; దాని అర్థం అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבֵית קֹדֶשׁ הַקֳּדָשִׁים
  choice: అతి పరిశుద్ధ స్థలంలో
  rationale: హీబ్రూ అతిశయార్థక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు ఆలయ పదజాలంలో వ్యక్తం చేస్తుంది.
- source_word: כְּרוּבִים שְׁנַיִם
  choice: రెండు కెరూబులను
  rationale: హీబ్రూ כְּרוּבִים అనే బహువచన రూపానికి తెలుగు బహువచన ప్రత్యయాన్ని జోడించకుండా, స్థిరపడిన పవిత్ర నిర్మాణ సంబంధిత పదాన్ని నిలుపుతుంది.
- source_word: מַעֲשֵׂה צַעֲצֻעִים
  choice: చెక్కిన పనిగా
  rationale: అత్యంత అరుదైన צַעֲצֻעִים పదం శిల్పి అనే వ్యక్తిని సూచిస్తుందని ఖచ్చితంగా చెప్పకుండా, సందర్భంలో శిల్పం లేదా చెక్కుడు పనిని సూచించే భావాన్ని అందిస్తుంది; అనిశ్చితిని పాదసూచికలో నిలుపుతుంది.
- source_word: וַיְצַפּוּ אֹתָם זָהָב
  choice: వాటికి బంగారు పూత పూయించాడు
  rationale: צפה యొక్క లోహంతో కప్పడం లేదా పూత వేయడం అనే వాస్తు సంబంధిత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; హీబ్రూలోని బహువచన క్రియను నిర్మాణ పనిని చేయించిన రాజును కర్తగా తీసుకుని తెలుగు causative రూపంలో సహజీకరించింది.
