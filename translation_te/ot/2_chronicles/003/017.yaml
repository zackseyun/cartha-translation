source:
  edition: WLC
  text: וַ/יָּ֤קֶם אֶת הָֽ/עַמּוּדִים֙ עַל פְּנֵ֣י הַ/הֵיכָ֔ל אֶחָ֥ד מִ/יָּמִ֖ין וְ/אֶחָ֣ד מֵֽ/הַ/שְּׂמֹ֑אול וַ/יִּקְרָ֤א שֵׁם ה/ימיני יָכִ֔ין וְ/שֵׁ֥ם הַ/שְּׂמָאלִ֖י בֹּֽעַז־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/017.yaml
  text: He set up the pillars in front of the nave[a], one on the right and one on the left; and he called the name of the one on the right Jachin, and the name of the one on the left Boaz.
translation:
  language: te
  text: అతడు ఆలయ ప్రధాన మందిరం[a] ముందు ఆ స్తంభాలను నిలబెట్టాడు—ఒకదాన్ని కుడివైపున, మరొకదాన్ని ఎడమవైపున. కుడివైపు స్తంభానికి యాకీను అని, ఎడమవైపు స్తంభానికి బోయజు అని పేరు పెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆలయ మందిరం.’ ఇక్కడ హీబ్రూ హేఖాల్ అనే పదం మొత్తం ఆలయ ప్రాంగణాన్ని కాకుండా ఆలయ భవనంలోని ప్రధాన మందిరాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: నిలబెట్టాడు
  rationale: קום హిఫిల్ రూపం ఇక్కడ స్తంభాలను వాటి స్థానాల్లో నిలిచేలా ఏర్పాటు చేయడాన్ని సూచిస్తుంది; ‘నిలబెట్టాడు’ సహజమైన ఆధునిక తెలుగు.
- source_word: הָעַמּוּדִים
  choice: ఆ స్తంభాలను
  rationale: עַמּוּדִים నిర్మాణ సంబంధమైన స్తంభాలను సూచిస్తుంది; పూర్వ సందర్భంలో పేర్కొన్న నిర్దిష్ట స్తంభాలని సూచించడానికి ‘ఆ’ వాడబడింది.
- source_word: עַל־פְּנֵי הַהֵיכָל
  choice: ఆలయ ప్రధాన మందిరం ముందు
  rationale: הֵיכָל ఇక్కడ మొత్తం ఆలయ ప్రాంగణం కాకుండా ఆలయ భవనంలోని ప్రధాన మందిరాన్ని సూచిస్తుంది; עַל־פְּנֵי యొక్క స్థలార్థాన్ని ‘ముందు’ నేరుగా తెలియజేస్తుంది.
- source_word: אֶחָד מִיָּמִין וְאֶחָד מֵהַשְּׂמֹאול
  choice: ఒకదాన్ని కుడివైపున, మరొకదాన్ని ఎడమవైపున
  rationale: మూలంలోని సాధారణ కుడి–ఎడమ దిశా భాషను అలాగే ఉంచి, దానిని దక్షిణం–ఉత్తరం అని వ్యాఖ్యానించకుండా అనువదిస్తుంది.
- source_word: וַיִּקְרָא שֵׁם
  choice: పేరు పెట్టాడు
  rationale: హీబ్రూ నామకరణ నుడికారానికి సహజమైన తెలుగు సమానార్థక ప్రయోగం.
- source_word: הַיְמִינִי
  choice: కుడివైపు స్తంభానికి
  rationale: ‘కుడివైపున ఉన్నది’ అనే భావాన్ని పాఠకునికి స్పష్టంగా తెలియజేయడానికి సూచించబడిన నామవాచకమైన ‘స్తంభం’ను పునరుక్తి చేసింది.
- source_word: יָכִין
  choice: యాకీను
  rationale: హీబ్రూ పేరును తెలుగు ధ్వని పద్ధతికి అనుగుణంగా లిప్యంతరీకరించింది; చివరి వ్యంజనాన్ని పలుకదగిన రూపంలో చూపడానికి ‘ను’ వాడింది.
- source_word: הַשְּׂמָאלִי
  choice: ఎడమవైపు స్తంభానికి
  rationale: ముందటి భాగానికి సమాంతరంగా, ‘ఎడమవైపున ఉన్నది’ అనే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בֹּעַז
  choice: బోయజు
  rationale: హీబ్రూ పేరును తెలుగు ధ్వని పద్ధతికి అనుగుణంగా లిప్యంతరీకరించింది; ע ధ్వనికి ప్రత్యేక తెలుగు సమానం లేకపోవడంతో సహజమైన ‘య’ సంధి ధ్వనిని ఉపయోగించింది.
