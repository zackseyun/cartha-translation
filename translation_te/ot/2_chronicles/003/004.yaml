  text: וְ/הָ/אוּלָ֡ם אֲשֶׁר֩ עַל פְּנֵ֨י הָ/אֹ֜רֶךְ עַל פְּנֵ֤י רֹֽחַב הַ/בַּ֨יִת֙ אַמּ֣וֹת עֶשְׂרִ֔ים וְ/הַ/גֹּ֖בַהּ מֵאָ֣ה וְ/עֶשְׂרִ֑ים וַ/יְצַפֵּ֥/הוּ מִ/פְּנִ֖ימָה זָהָ֥ב טָהֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/004.yaml
  text: The portico that was in front of the house was twenty cubits long[a], corresponding to the width of the house, and its height was one hundred and twenty cubits; and he overlaid its interior with pure gold.
translation:
  language: te
  text: మందిరం ఎదుట ఉన్న ప్రవేశ మండపం, మందిరం వెడల్పుకు సరిపడేలా, ఇరవై మూరల పొడవు కలిగి ఉంది; దాని ఎత్తు నూట ఇరవై మూరలు[a]. అతడు దాని లోపలి భాగానికి స్వచ్ఛమైన బంగారంతో తాపడం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠం ప్రవేశ మండపపు ఎత్తు ‘నూట ఇరవై’ మూరలు అని చెబుతుంది. సమాంతర వర్ణనైన 1 రాజులు 6:3లో మండపపు పొడవు, వెడల్పు ఉన్నాయి గాని ఈ ఎత్తు లేదు. అందువల్ల కొందరు పండితులు ఇక్కడ పాఠసమస్య ఉండవచ్చని భావిస్తారు; ఈ అనువాదం భద్రపరచబడిన మసొరెటిక్ పాఠాన్నే అనుసరిస్తుంది.
    reason: textual_variant
lexical_decisions:
- source_word: הָאוּלָם
  choice: ప్రవేశ మండపం
  rationale: ఇది ప్రధాన భవనం ముందు ఉండే ప్రవేశ హాలు లేదా మండపాన్ని సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు సహజంగా, నిర్మాణపరమైన భావం స్పష్టంగా ఉండేందుకు ఈ పదబంధాన్ని ఎంచుకున్నాం.
- source_word: אֲשֶׁר עַל־פְּנֵי
  choice: ఎదుట ఉన్న
  rationale: ఈ పదబంధం స్థలపరంగా ముందున్నదనే భావాన్ని తెలియజేస్తుంది; దిశ లేదా ముఖద్వార నిర్మాణం గురించి అదనపు ఊహను చేర్చదు.
- source_word: הָאֹרֶךְ עַל־פְּנֵי רֹחַב הַבַּיִת
  choice: పొడవు, మందిరం వెడల్పుకు సరిపడేలా
  rationale: హీబ్రూ వాక్య నిర్మాణం సంక్షిప్తంగా ఉండి, మండపపు పొడవును మందిరపు వెడల్పుతో అనుసంధానిస్తుంది. ఈ అనువాదం ఆ సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אַמּוֹת עֶשְׂרִים
  choice: ఇరవై మూరలు
  rationale: אַמָּה అనే ప్రాచీన కొలమానానికి తెలుగు బైబిలు వాడుకలో స్థిరపడిన ‘మూరు’ అనే పదాన్ని ఉంచి, ఆధునిక కొలమానంగా మార్చలేదు.
- source_word: וְהַגֹּבַהּ מֵאָה וְעֶשְׂרִים
  choice: దాని ఎత్తు నూట ఇరవై మూరలు
  rationale: మసొరెటిక్ పాఠంలో ఉన్న సంఖ్యను యథాతథంగా అనుసరించాం. సందర్భంలో అర్థమయ్యే కొలమానాన్ని స్పష్టత కోసం తెలుగులో మళ్లీ పేర్కొన్నాం.
- source_word: וַיְצַפֵּהוּ מִפְּנִימָה
  choice: అతడు దాని లోపలి భాగాన్ని ... పొదిగించాడు
  rationale: צפה క్రియ ఇక్కడ ఒక పదార్థంతో ఉపరితలాన్ని కప్పడం లేదా పూత వేయడాన్ని సూచిస్తుంది. ‘పొదిగించాడు’ నిర్మాణ అలంకరణ సందర్భానికి సహజంగా సరిపోతుంది; מִפְּנִימָה అంతర్భాగాన్ని సూచిస్తుంది.
- source_word: זָהָב טָהוֹר
  choice: స్వచ్ఛమైన బంగారం
  rationale: మూలంలోని పదార్థం మరియు దాని శుద్ధతను నేరుగా, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
