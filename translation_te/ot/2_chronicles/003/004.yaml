  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ప్రాచీన కొలమానాన్ని ‘మూరలు’గా నిలుపుకున్నాం; హీబ్రూ పాఠంలోని అసాధారణ ఎత్తును సవరించకుండా, పాదసూచికలో పాఠసంబంధమైన అంశాన్ని వివరించాం.
