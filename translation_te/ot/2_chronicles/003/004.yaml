- from: మందిరం ఎదుట ఉన్న ప్రవేశ మండపం పొడవు, మందిరం వెడల్పుకు సరిపడేలా, ఇరవై మూరలు; దాని ఎత్తు నూట ఇరవై మూరలు[a]. అతడు దాని లోపలి భాగాన్ని స్వచ్ఛమైన బంగారంతో పొదిగించాడు.
