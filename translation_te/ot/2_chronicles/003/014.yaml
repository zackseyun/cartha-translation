  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే వాక్య నిర్మాణం వాడాం. ఆలయ వస్త్రాలకు సంబంధించిన సాంకేతిక భావాన్ని సాధారణ పాఠకుడికి అర్థమయ్యేలా తెలిపాం; అయితే హీబ్రూ క్రియలోని చిత్రాత్మక అక్షరార్థాన్ని పాదసూచికలో భద్రపరిచాం.
