  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ֙ אֶת הַ/פָּרֹ֔כֶת תְּכֵ֥לֶת וְ/אַרְגָּמָ֖ן וְ/כַרְמִ֣יל וּ/ב֑וּץ וַ/יַּ֥עַל עָלָ֖י/ו כְּרוּבִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/014.yaml
  text: He made the curtain of blue[a], purple, crimson, and fine linen[c][b], and worked cherubim on it.
translation:
  language: te
  text: అతడు నీలం, ఊదా, ముదురు ఎరుపు రంగుల నూలుతోను, సన్నని నారతోను తెరను[a] తయారుచేసి, దానిపై కెరూబుల ఆకృతులను రూపొందించాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అడ్డతెరను.’
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘కెరూబులను దానిమీదికి ఎక్కించాడు’; అంటే, కెరూబుల ఆకృతులతో దాన్ని అలంకరించాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּרֹכֶת
  choice: తెరను
  rationale: ఈ పదం పరిశుద్ధ స్థలంలోని భాగాలను వేరుచేసే లోపలి తెరను సూచిస్తుంది. ఆధునిక తెలుగులో ‘తెర’ సహజంగా, స్పష్టంగా ఉంటుంది; విభజన భావాన్ని తెలిపే ‘అడ్డతెర’ను పాదసూచికలో ఉంచాం.
- source_word: תְּכֵלֶת
  choice: నీలం రంగుల నూలు
  rationale: ఇది ఆలయ వస్త్రాలలో వాడే నీలం లేదా నీలి-ఊదా రంగు వేసిన పదార్థాన్ని సూచిస్తుంది. వస్త్ర తయారీ సందర్భంలో ‘నీలం రంగు నూలు’ సహజమైన అనువాదం.
- source_word: אַרְגָּמָן
  choice: ఊదా రంగుల నూలు
  rationale: ప్రతిష్ఠాత్మకమైన ఊదా రంగు వేసిన వస్త్ర పదార్థానికి ఇది సాధారణమైన, స్పష్టమైన అనువాదం.
- source_word: כַרְמִיל
  choice: ముదురు ఎరుపు రంగుల నూలు
  rationale: ఈ పదం ఎరుపు రంగు వేసిన పదార్థాన్ని సూచిస్తుంది. ‘ముదురు ఎరుపు’ దాని ప్రత్యేక ఛాయను తెలియజేస్తుంది; ‘కాషాయ ఎరుపు’ అనే సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: בּוּץ
  choice: సన్నని నార
  rationale: ఇది సాధారణ నారను కాక, నాణ్యమైన సన్నని నారను సూచిస్తుంది. అందువల్ల వస్త్రపు నాణ్యతను అనువాదంలో నిలిపాం.
- source_word: וַיַּעַל עָלָיו כְּרוּבִים
  choice: దానిమీద కెరూబుల ఆకృతులు వేయించాడు
  rationale: హీబ్రూ ప్రయోగం అక్షరార్థంగా ‘కెరూబులను దానిమీదికి ఎక్కించాడు’ అని ఉంటుంది. సందర్భంలో అది తెరను కెరూబుల ఆకృతులతో అలంకరించడాన్ని సూచిస్తుంది. ‘ఆకృతులు వేయించాడు’ అనే పదబంధం నిర్దిష్టమైన కుట్టు లేదా నేత పద్ధతిని అనవసరంగా నిర్ణయించకుండా భావాన్ని సహజంగా అందిస్తుంది.
- source_word: כְּרוּבִים
  choice: కెరూబులు
  rationale: ఆలయ సంబంధమైన బైబిలు చిత్రణలో వాడే సంప్రదాయ పదాన్ని నిలిపి, ఆధునిక తెలుగు బహువచన రూపంలో ఇచ్చాం.
