source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ֙ אֶת בֵּֽית קֹ֣דֶשׁ הַ/קֳּדָשִׁ֔ים אָרְכּ֞/וֹ עַל פְּנֵ֤י רֹֽחַב הַ/בַּ֨יִת֙ אַמּ֣וֹת עֶשְׂרִ֔ים וְ/רָחְבּ֖/וֹ אַמּ֣וֹת עֶשְׂרִ֑ים וַ/יְחַפֵּ֨/הוּ֙ זָהָ֣ב ט֔וֹב לְ/כִכָּרִ֖ים שֵׁ֥שׁ מֵאֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/008.yaml
  text: He made the Most Holy Place[a], its length corresponding to the width of the house, twenty cubits, and its width twenty cubits; and he overlaid it with fine gold[b], six hundred talents.
translation:
  language: te
  text: అతడు అతి పరిశుద్ధ స్థలాన్ని[a] నిర్మించాడు. దాని పొడవు మందిరపు వెడల్పుకు సమానంగా ఇరవై మూరలు; దాని వెడల్పు కూడా ఇరవై మూరలు. ఆరు వందల తలాంతుల మేలిమి బంగారంతో దానిని తాపడం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిశుద్ధ పరిశుద్ధ స్థలం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית קֹדֶשׁ הַקֳּדָשִׁים
  choice: అతి పరిశుద్ధ స్థలం
  rationale: హీబ్రూ నిర్మాణం అత్యున్నత పరిశుద్ధతను తెలిపే నుడికారం; ఆలయంలోని అంతర్గర్భ పవిత్ర స్థలాన్ని ఆధునిక తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: אָרְכּוֹ עַל־פְּנֵי רֹחַב הַבַּיִת
  choice: దాని పొడవు మందిరపు వెడల్పుకు సమానంగా
  rationale: ఈ ప్రాదేశిక నుడికారం ఆ గది పొడవు మందిరపు వెడల్పుకు సరిపోవడాన్ని తెలియజేస్తుంది; అస్పష్టమైన పదానువాదం కాకుండా నిర్మాణ సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: אַמּוֹת עֶשְׂרִים
  choice: ఇరవై మూరలు
  rationale: అమ్మా అనే ప్రాచీన రేఖీయ కొలతకు తెలుగులో సంప్రదాయంగా అర్థమయ్యే 'మూర'ను వాడి, ఆధునిక ప్రమాణానికి మార్చలేదు.
- source_word: וַיְחַפֵּהוּ
  choice: దానికి … తాపడం చేశాడు
  rationale: ఆలయ నిర్మాణ సందర్భంలో ఈ క్రియ ఉపరితలంపై బంగారపు పొరను కప్పడాన్ని సూచిస్తుంది; 'తాపడం' శిల్పసంబంధంగా సహజమైన తెలుగు.
- source_word: זָהָב טוֹב
  choice: మేలిమి బంగారం
  rationale: טוֹב ఇక్కడ బంగారం నాణ్యతను సూచిస్తుంది; 'మేలిమి' స్వచ్ఛతను అతిగా నిర్దిష్టం చేయకుండా ఉన్నత నాణ్యతను తెలుపుతుంది.
- source_word: לְכִכָּרִים שֵׁשׁ מֵאוֹת
  choice: ఆరు వందల తలాంతుల
  rationale: לְ ఇక్కడ ఉపయోగించిన బంగారం మొత్తం బరువును సూచిస్తుంది. మూలంలోని ప్రాచీన బరువు ప్రమాణాన్ని అలాగే నిలిపింది.
theological_decisions:
- issue: అంతర్గర్భ పవిత్ర స్థలానికి పేరు
  choice: అతి పరిశుద్ధ స్థలం
  alternative: పరిశుద్ధ స్థలాల పరిశుద్ధ స్థలం
  rationale: హీబ్రూ అధికతా నుడికారాన్ని సహజ తెలుగులో తెలిపింది; ప్రత్యేక మతపరంపర పదజాలాన్ని రుద్దకుండా స్థల స్వభావాన్ని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి. ఆలయానికి 'మందిరం', cubitకు సంప్రదాయ 'మూర', talentకు 'తలాంతు' వాడబడ్డాయి. మూలంలో లేని వివరణాత్మక ఆధునిక కొలతలను చేర్చలేదు.
