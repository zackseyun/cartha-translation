source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ שַׁרְשְׁרוֹת֙ בַּ/דְּבִ֔יר וַ/יִּתֵּ֖ן עַל רֹ֣אשׁ הָ/עַמֻּדִ֑ים וַ/יַּ֤עַשׂ רִמּוֹנִים֙ מֵאָ֔ה וַ/יִּתֵּ֖ן בַּֽ/שַּׁרְשְׁרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/016.yaml
  text: He made chains in the inner sanctuary and put them on the tops of the pillars[b][a]; he also made one hundred pomegranates and put them on the chains.
translation:
  language: te
  text: అతడు లోపలి పరిశుద్ధస్థలంలో[a] అలంకార గొలుసులను[b] చేసి, వాటిని స్తంభాల పైభాగాల మీద ఉంచాడు. ఇంకా అతడు వంద దానిమ్మపండు ఆకారపు అలంకారాలను చేసి, వాటిని ఆ గొలుసులపై ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘లోపలి గదిలో’; సంప్రదాయంగా, ‘అతి పరిశుద్ధస్థలంలో.’ హీబ్రూ పదం దేవాలయపు లోపలి పరిశుద్ధస్థలాన్ని సూచిస్తుంది; అయితే ఇక్కడ అలంకరణ పనికి సంబంధించి ఈ మాటను కొందరు మరింత విస్తృతంగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘గొలుసుల పని’ లేదా ‘దండలలాంటి అలంకారాలు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁרְשְׁרוֹת
  choice: గొలుసులలాంటి అలంకారాలు
  rationale: ఈ పదం గొలుసు రూపంలో ఉన్న అలంకార పనిని సూచిస్తుంది. తెలుగులో కేవలం ‘గొలుసులు’ అంటే ఉపయోగకరమైన గొలుసులనే భావించే అవకాశం ఉండటంతో, నిర్మాణ అలంకరణ సందర్భాన్ని స్పష్టం చేస్తూ మూలంలోని స్పష్టమైన రూపకల్పనను నిలుపుతుంది.
- source_word: בַּדְּבִיר
  choice: లోపలి పరిశుద్ధస్థలంలో
  rationale: דְּבִיר దేవాలయపు అంతర్గత పరిశుద్ధ భాగాన్ని సూచిస్తుంది. ఈ అనువాదం స్థల స్వభావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సంప్రదాయపరమైన మరింత నిర్దిష్ట పదాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా మోపదు.
- source_word: רֹאשׁ הָעַמֻּדִים
  choice: స్తంభాల పైభాగాల మీద
  rationale: నిర్మాణ వస్తువుల విషయంలో רֹאשׁ అనే ‘తల’ భావాన్ని తెలుగులో సహజంగా ‘పైభాగం’ అని వ్యక్తం చేయడం స్థానార్థాన్ని సరిగ్గా అందిస్తుంది.
- source_word: רִמּוֹנִים
  choice: దానిమ్మపండు ఆకారపు అలంకారాలు
  rationale: సందర్భంలో ఇవి నిజమైన పండ్లు కాకుండా దానిమ్మపండు ఆకారంలో చేసిన దేవాలయ అలంకారాలు. అందువల్ల రూపాన్ని, అలంకార స్వభావాన్ని రెండింటినీ స్పష్టం చేసింది.
- source_word: מֵאָה
  choice: వంద
  rationale: హీబ్రూ సంఖ్యకు నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: וַיִּתֵּן בַּשַּׁרְשְׁרוֹת
  choice: వాటిని ఆ గొలుసులపై ఉంచాడు
  rationale: בְּ ఉపసర్గ ఇక్కడ అలంకారాలను గొలుసులకు అమర్చడాన్ని సూచించగలదు. ‘గొలుసులపై’ అనేది నేరమైన పఠనం; వాటి మధ్య అమర్చాడనే సాధ్యతను పూర్తిగా పరిష్కరించకుండా ఉంచుతుంది.
