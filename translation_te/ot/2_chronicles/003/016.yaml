translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన నిర్మాణ-వివరణ శైలి వాడబడింది. ‘పరిశుద్ధస్థలం’ అనే పదం సందర్భంలోని పవిత్ర స్థల భావాన్ని తెలియజేస్తూ, ‘అతి పరిశుద్ధస్థలం’ అనే సంప్రదాయ గుర్తింపును పాదటిప్పణిలో ఉంచింది. రెండు పాదటిప్పణి గుర్తులూ సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉన్నాయి.
