  text: כַּנְפֵי֙ הַ/כְּרוּבִ֣ים הָ/אֵ֔לֶּה פֹּֽרְשִׂ֖ים אַמּ֣וֹת עֶשְׂרִ֑ים וְ/הֵ֛ם עֹמְדִ֥ים עַל רַגְלֵי/הֶ֖ם וּ/פְנֵי/הֶ֥ם לַ/בָּֽיִת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/013.yaml
  text: The wings of these cherubim spread twenty cubits[a], and they stood on their feet, with their faces toward the house.
translation:
  language: te
  text: ఈ కెరూబుల రెక్కలు ఇరవై మూరల మేర విస్తరించి ఉన్నాయి. ఆ కెరూబులు తమ కాళ్లపై నిలబడి ఉన్నారు; వారి ముఖాలు మందిరం వైపు ఉన్నాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “ఇంటి వైపు”; ఇక్కడ అది మందిర భవనాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּנְפֵי הַכְּרוּבִים הָאֵלֶּה
  choice: ఈ కెరూబుల రెక్కలు
  rationale: నిర్దేశక పదంలోని ‘ఈ’ అనే భావాన్ని, అలాగే తెలుగు బైబిలు వాడుకలో స్థిరపడిన ‘కెరూబులు’ అనే పదాన్ని నిలుపుతుంది.
- source_word: פֹּרְשִׂים אַמּוֹת עֶשְׂרִים
  choice: ఇరవై మూరల మేరకు విస్తరించి ఉన్నాయి
  rationale: వర్తమాన కృదంతం రెక్కల స్థితిని వర్ణిస్తుంది. కొలతకు తెలుగు పాఠకులకు పరిచితమైన ‘మూర’ను వాడి, హెబ్రీలోని విస్తీర్ణ భావాన్ని సహజంగా తెలియజేయడానికి ‘మేరకు’ చేర్చబడింది.
- source_word: וְהֵם עֹמְדִים עַל רַגְלֵיהֶם
  choice: అవి తమ కాళ్ల మీద నిలబడి ఉన్నాయి
  rationale: రెక్కల నుంచి కెరూబులకే విషయమార్పు జరుగుతున్నదని సర్వనామంతో సూచిస్తూ, వాటి నిటారైన భంగిమను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּפְנֵיהֶם לַבָּיִת
  choice: వాటి ముఖాలు మందిరం వైపు ఉన్నాయి
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినప్పటికీ, ఈ మందిర నిర్మాణ సందర్భంలో అది దేవాలయ భవనాన్ని సూచిస్తుంది; ‘మందిరం’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
theological_decisions:
- issue: మందిర నిర్మాణ సందర్భంలో בַּיִת అనువాదం
  choice: మందిరం
  alternative: ఇల్లు
  rationale: మూలపదం సాధారణంగా ‘ఇల్లు’ అని అర్థమైనా, దినవృత్తాంతాలలో ఈ సందర్భంలో అది దేవుని మందిర భవనానికి సాధారణ నామం. ప్రధాన పాఠంలో ‘మందిరం’ భావాన్ని స్పష్టపరుస్తుంది; అక్షరార్థాన్ని పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వర్ణన. కొలతకు సంప్రదాయ బైబిలు పదమైన ‘మూర’ను ఉంచి, వాక్య ప్రవాహం కోసం మూలంలోని భాగాలను రెండు వాక్యాలుగా విభజించాం.
