source:
  edition: WLC
  text: וּ/מִשְׁקָ֛ל לְ/מִסְמְר֥וֹת לִ/שְׁקָלִ֖ים חֲמִשִּׁ֣ים זָהָ֑ב וְ/הָ/עֲלִיּ֖וֹת חִפָּ֥ה זָהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/009.yaml
  text: And the weight of the nails was fifty shekels of gold[a], and he overlaid the upper rooms with gold.
translation:
  language: te
  text: మేకుల బరువు యాభై షెకెలుల బంగారం ఉండేది; అతడు పైగదులను[a] బంగారంతో తాపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పై నిర్మాణ భాగాలను.” ఇక్కడి హీబ్రూ పదం ఆలయంలోని పైగదులను గానీ, మరింత సాధారణంగా పైభాగంలోని నిర్మాణాలను గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁקָל לְמִסְמְרוֹת
  choice: బంగారు మేకుల బరువు
  rationale: מִשְׁקָל అంటే ‘బరువు’; מִסְמְרוֹת అంటే నిర్మాణంలో వాడే ‘మేకులు’. లְ సంబంధాన్ని తెలుగులో సహజమైన షష్ఠీ నిర్మాణంతో వ్యక్తం చేశాం. తరువాతి זָהָב‌ను మేకుల పదార్థంగా స్పష్టంగా కలిపాం.
- source_word: לִשְׁקָלִים חֲמִשִּׁים זָהָב
  choice: యాభై షెకెలులు
  rationale: ఈ పదబంధం బంగారం బరువు పరిమాణాన్ని తెలియజేస్తుంది. ప్రాచీన తూకపు ప్రమాణమైన ‘షెకెలు’ను అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: וְהָעֲלִיּוֹת
  choice: పైగదులకు
  rationale: עֲלִיּוֹת సాధారణంగా పై అంతస్తులోని గదులు లేదా పై నిర్మాణ భాగాలను సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన ‘పైగదులు’ను వాడి, విస్తృత అర్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: חִפָּה זָהָב
  choice: బంగారం తాపించాడు
  rationale: חפה ఇక్కడ ఒక ఉపరితలాన్ని బంగారంతో కప్పడం లేదా పొదగడం అనే నిర్మాణార్థంలో ఉంది. ఆలయ నిర్మాణ సందర్భంలో ‘బంగారం తాపించాడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన నిర్మాణ శైలిని వాడాం. ప్రాచీన తూకపు ప్రమాణాన్ని ‘షెకెలు’గా ఉంచాం. ఆంగ్ల సంప్రదింపుపాఠంలో పాదసూచిక గుర్తు బంగారం తరువాత ఉన్నప్పటికీ, దాని విషయం עֲלִיּוֹת అనే పదానికి సంబంధించినందున తెలుగులో ‘పైగదులకు’ తరువాత గుర్తు పెట్టాం.
