source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ הוּסַ֣ד שְׁלֹמֹ֔ה לִ/בְנ֖וֹת אֶת בֵּ֣ית הָ/אֱלֹהִ֑ים הָ/אֹ֡רֶךְ אַמּ֞וֹת בַּ/מִּדָּ֤ה הָ/רִֽאשׁוֹנָה֙ אַמּ֣וֹת שִׁשִּׁ֔ים וְ/רֹ֖חַב אַמּ֥וֹת עֶשְׂרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/003.yaml
  text: 'These are the foundations Solomon laid for building the house of God: the length in cubits[a], according to the former measure, was sixty cubits[c][b], and the width twenty cubits.'
translation:
  language: te
  text: 'దేవుని మందిరాన్ని కట్టడానికి సొలొమోను వేసిన పునాదులు[a] ఇవి: పూర్వపు కొలమానం[b] ప్రకారం దాని పొడవు అరవై మూరలు, వెడల్పు ఇరవై మూరలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పునాదులు” అని అనువదించిన హెబ్రీ క్రియారూపం ఇక్కడ కొంత కఠినమైనది. ఈ మాటను “దేవుని మందిరాన్ని కట్టడానికి సొలొమోను నిర్దేశించిన ప్రాథమిక కొలతలు ఇవి” అనే భావంలో కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “పూర్వపు కొలమానం” అనేది పాత మూర ప్రమాణాన్ని సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: הוּסַד
  choice: వేసిన పునాదులు
  rationale: יסד ధాతువు ఇక్కడ సందర్భపరంగా కొంత కఠినమైనదైనా, నిర్మాణానికి పునాది వేయడాన్ని సూచించే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది. వెంట వచ్చే కొలతలు నిర్మాణపు పునాది లేదా ప్రాథమిక నిర్దేశాలను తెలియజేస్తాయి.
- source_word: לִבְנוֹת
  choice: కట్టించడానికి
  rationale: ל ఉపసర్గతో కూడిన infinitive construct ఉద్దేశాన్ని సూచిస్తుంది. రాజైన సొలొమోను నిర్మాణాన్ని నిర్వహింపజేసిన భావానికి ‘కట్టించడానికి’ సహజంగా సరిపోతుంది; అయితే హెబ్రీలోని సాధారణ ‘కట్టడానికి’ భావాన్ని మించిపోయే ప్రత్యేక సిద్ధాంతార్థం ఉద్దేశించబడలేదు.
- source_word: בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరం
  rationale: అక్షరార్థం ‘దేవుని ఇల్లు’. ఈ నిర్మాణ సందర్భంలో ఆధునిక తెలుగు పాఠకులకు ‘దేవుని మందిరం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הָאֹרֶךְ
  choice: పొడవు
  rationale: నిర్మాణ కొలతను సూచించే సాధారణ తెలుగు పదం.
- source_word: אַמּוֹת
  choice: మూరలు
  rationale: ప్రాచీన cubit కొలమానానికి తెలుగు బైబిలు వాడుకలో పరిచితమైన సమానపదం; ఆధునిక ప్రమాణంలోకి మార్చకుండా మూలంలోని పురాతన కొలతను నిలుపుతుంది.
- source_word: בַּמִּדָּה הָרִאשׁוֹנָה
  choice: పూర్వపు కొలమానం ప్రకారం
  rationale: పాత లేదా అంతకుముందటి కొలత ప్రమాణాన్ని సూచించే అవకాశాన్ని నిలుపుతూ, దాని ఖచ్చిత చారిత్రక అర్థాన్ని నిర్ధారించదు.
- source_word: שִׁשִּׁים
  choice: అరవై
  rationale: పొడవును తెలిపే సంఖ్య.
- source_word: וְרֹחַב
  choice: వెడల్పు
  rationale: పొడవుతో సమాంతరంగా నిలిచే సహజ నిర్మాణ పదం; తెలుగు వాక్యంలో సంబంధం స్పష్టంగా ఉండటంతో అదనపు సర్వనామం అవసరం లేదు.
- source_word: עֶשְׂרִים
  choice: ఇరవై
  rationale: వెడల్పును తెలిపే సంఖ్య.
theological_decisions:
- issue: הוּסַד అనే కఠిన రూపం పునాది వేయడాన్నా, ప్రణాళిక/ప్రాథమిక నిర్దేశాన్నా సూచిస్తుంది?
  choice: వేసిన పునాదులు
  alternative: నిర్మాణానికి నిర్దేశించిన కొలతలు / పునాది ప్రణాళిక
  rationale: మూల ధాతువు యొక్క పునాది వేయు భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, దాని సందర్భపరమైన అనిశ్చితిని పాదసూచికలో వెల్లడించడం ద్వారా భావాన్ని మౌనంగా పరిష్కరించకుండా నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘దేవుని మందిరం’, ‘మూరలు’ వంటి సాధారణ తెలుగు బైబిలు పదజాలాన్ని వాడుతూ, הוּסַד మరియు ‘పూర్వపు కొలమానం’లోని నిజమైన అనిశ్చితిని పాదసూచికల్లో నిలిపాం. మూలంలోని కొలత పద పునరుక్తిని తెలుగులో కృత్రిమంగా పునరావృతం చేయలేదు.
