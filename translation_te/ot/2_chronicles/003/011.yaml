    rationale: The Hebrew uses אַחֵר, ‘other,’ not an ordinal ‘second.’ The revised text uses “ఇతర కెరూబు.”
  - severity: low
    issue: Missing temple-building cultural footnote
    rationale: The English audit trail includes a cultural note explaining that ‘house’ denotes the temple building. A corresponding Telugu note and anchor have been supplied.
