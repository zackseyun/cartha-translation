id: 2CH.3.11
reference: 2 Chronicles 3:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כַנְפֵי֙ הַ/כְּרוּבִ֔ים אָרְכָּ֖/ם אַמּ֣וֹת עֶשְׂרִ֑ים כְּנַ֨ף הָ/אֶחָ֜ד לְ/אַמּ֣וֹת חָמֵ֗שׁ מַגַּ֨עַת֙ לְ/קִ֣יר הַ/בַּ֔יִת וְ/הַ/כָּנָ֤ף הָ/אַחֶ֨רֶת֙ אַמּ֣וֹת חָמֵ֔שׁ מַגִּ֕יעַ לִ/כְנַ֖ף הַ/כְּר֥וּב הָ/אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/011.yaml
  text: 'The wings of the cherubim were twenty cubits long: one wing was five cubits[a], reaching to the wall of the house, and the other wing was five cubits[b], reaching to the wing of the other cherub.'
translation:
  language: te
  text: కెరూబుల రెక్కల పొడవు ఇరవై మూరలు. ఒక రెక్క ఐదు మూరల పొడవు ఉండి మందిరపు[b] గోడ వరకు చేరింది[a]; మరో రెక్క ఐదు మూరల పొడవు ఉండి ఇతర కెరూబు రెక్క వరకు చేరింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మందిరపు గోడను తాకింది ... ఇతర కెరూబు రెక్కను తాకింది.’ హీబ్రూ క్రియారూపాలు ఒక చోటు వరకు విస్తరించడాన్ని, నిజంగా తాకడాన్ని కూడా సూచించగలవు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘మందిరం’ అంటే దేవాలయ భవనం.
    reason: cultural_note
lexical_decisions:
- source_word: וְכַנְפֵי הַכְּרוּבִים
  choice: కెరూబుల రెక్కలు
  rationale: ‘కెరూబులు’ అనే సంప్రదాయ లిప్యంతరీకరణను ఉంచి, సమాస బహువచనాన్ని సహజమైన తెలుగులో ఇచ్చాం. వాక్యారంభంలోని సంధాయకాన్ని తెలుగు ప్రవాహం కోసం ప్రత్యేకంగా అనువదించలేదు.
- source_word: אָרְכָּם אַמּוֹת עֶשְׂרִים
  choice: మొత్తం పొడవు ఇరవై మూరలు
  rationale: తరువాత ప్రతి రెక్క ఐదు మూరలని చెప్పడం వల్ల, ఇక్కడ రెండు కెరూబుల రెక్కల విస్తీర్ణపు మొత్తం కొలత ఉద్దేశించబడింది. ‘మూర’ ప్రాచీన కొలమానాన్ని నిలుపుతుంది.
- source_word: כְּנַף הָאֶחָד לְאַמּוֹת חָמֵשׁ
  choice: ఒక రెక్క ఐదు మూరల పొడవుండి
  rationale: హీబ్రూలో సంక్షిప్తంగా ఉన్న కొలత సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేశాం.
- source_word: מַגַּעַת / מַגִּיעַ
  choice: వరకు చేరింది
  rationale: נגע పదం ఇక్కడ ఒక హద్దు వరకు విస్తరించడం లేదా దానిని తాకడం అనే భావాలను ఇవ్వగలదు. ప్రధాన పాఠంలో సహజమైన ‘చేరింది’ను వాడి, నిజమైన స్పర్శ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: לְקִיר הַבַּיִת
  choice: మందిరపు గోడ వరకు
  rationale: ఈ నిర్మాణ సందర్భంలో הַבַּיִת దేవాలయ భవనాన్ని సూచిస్తుంది; ‘మందిరం’ ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: וְהַכָּנָף הָאַחֶרֶת
  choice: మరో రెక్క
  rationale: אַחֶרֶת యొక్క ‘ఇతర/మరో’ భావాన్ని సహజమైన తెలుగులో నిలిపాం.
- source_word: לִכְנַף הַכְּרוּב הָאַחֵר
  choice: రెండవ కెరూబు రెక్క వరకు
  rationale: ఒక కెరూబు రెక్కకు ఎదురుగా ఉన్న మరొక కెరూబు రెక్కను సూచించడాన్ని తెలుగులో అస్పష్టత లేకుండా తెలియజేయడానికి ‘రెండవ’ అని ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకునికి అర్థమయ్యే నిర్మాణ వర్ణనగా రూపొందించాం. ప్రాచీన కొలమానానికి ‘మూర’ను, כְּרוּבִיםకు సంప్రదాయ రూపమైన ‘కెరూబులు’ను వాడాం.
