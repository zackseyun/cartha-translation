id: 2CH.3.7
reference: 2 Chronicles 3:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְחַ֨ף אֶת הַ/בַּ֜יִת הַ/קֹּר֧וֹת הַ/סִּפִּ֛ים וְ/קִֽירוֹתָ֥י/ו וְ/דַלְתוֹתָ֖י/ו זָהָ֑ב וּ/פִתַּ֥ח כְּרוּבִ֖ים עַל הַ/קִּירֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/007.yaml
  text: He overlaid the house with gold—the beams[a], the thresholds, its walls[d][c][b], and its doors—and he engraved cherubim on the walls.
translation:
  language: te
  text: ఆ మందిరాన్ని[a]—దాని దూలాలను[b], గడపలను[c], గోడలను, తలుపులను—బంగారంతో పొదిగించాడు; గోడలపై కెరూబులను చెక్కించాడు[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ఇల్లు’; ఇక్కడ ఇది మందిర భవనాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘దూలాలు’ అనే హీబ్రూ పదాన్ని ‘కప్పు కర్రలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ఈ హీబ్రూ పదం ద్వారబంధాలను లేదా ద్వారపు దిగువ అంచులను కూడా సూచించవచ్చు.
    reason: lexical_ambiguity
  - marker: d
    text: లేదా ‘చెక్కి చిత్రించాడు’; ఈ క్రియ చెక్కడం లేదా రేఖలు కోసి రూపం వేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַף
  choice: పొదిగించాడు
  rationale: నిర్మాణంపై బంగారపు పొర వేయించడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; రాజు స్వయంగా పని చేశాడని కాక, తన ఆధ్వర్యంలో చేయించాడనే సందర్భానుకూల భావాన్నీ ఇస్తుంది.
- source_word: הַבַּיִת
  choice: మందిరం
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఈ సందర్భంలో అది యెహోవా మందిర భవనాన్ని సూచిస్తుంది. సాధారణ పాఠకునికి ‘మందిరం’ స్పష్టంగా ఉంటుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: הַקֹּרוֹת
  choice: దూలాలు
  rationale: నిర్మాణంలో ఉపయోగించే అడ్డమైన ప్రధాన కలప భాగాలకు తెలుగులో సహజమైన పదం; హీబ్రూ పదం సూచించే నిర్మాణ కలపల సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: הַסִּפִּים
  choice: గడపలు
  rationale: ద్వార నిర్మాణంలోని దిగువ భాగం లేదా ప్రవేశ అంచు అనే సంభావ్య అర్థాన్ని తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది; ద్వారబంధాలు లేదా నిలువు కమ్ములు అనే అర్థమూ సాధ్యమే.
- source_word: קִירוֹתָיו
  choice: దాని గోడలు
  rationale: ఏకవచన పురుషలింగ ప్రత్యయం మందిరానికే తిరిగి సూచిస్తున్నందున ‘దాని’ అనే సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: דַלְתוֹתָיו
  choice: దాని తలుపులు
  rationale: తలుపులు లేదా తలుపు పలకలు అనే అర్థంలో సాధారణ పాఠకునికి స్పష్టమైన పదం.
- source_word: זָהָב
  choice: బంగారంతో
  rationale: హీబ్రూ వాక్యంలో జాబితా తరువాత వచ్చే పదార్థాన్ని తెలుగులో సాధనార్థక విభక్తితో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּפִתַּח
  choice: చెక్కించాడు
  rationale: గోడలపై అలంకార రూపాలను కోయడం లేదా చెక్కడం అనే భావాన్ని ఇస్తుంది. సందర్భంలో రాజు పనిని చేయించినవాడిగా చెప్పబడటం వల్ల తెలుగు ప్రయోజక రూపం సహజంగా ఉంది.
- source_word: כְּרוּבִים
  choice: కెరూబులు
  rationale: మందిర సంబంధమైన ప్రత్యేక బైబిలు పదాన్ని లిప్యంతరీకరించి, ఇతర సాధారణ దేవదూతల పదాలతో కలపకుండా ఉంచుతుంది.
- source_word: עַל הַקִּירוֹת
  choice: గోడలపై
  rationale: చెక్కిన రూపాల స్థలాన్ని సూచించే హీబ్రూ ఉపసర్గకు నేరమైన, సహజమైన తెలుగు అనువాదం.
