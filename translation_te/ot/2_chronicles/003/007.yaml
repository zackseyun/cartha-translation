  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల నిర్మాణం వాడబడింది. హీబ్రూ జాబితా సంబంధాన్ని దీర్ఘవిరామ చిహ్నాలతో స్పష్టంచేశాం. ‘మందిరం’ సందర్భాన్ని స్పష్టం చేస్తుండగా, ‘ఇల్లు’ అనే మూలపదపు అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
