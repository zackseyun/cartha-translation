  yaml_path: translation/ot/2_chronicles/003/002.yaml
  text: He began to build in the second month[a], on the second day, in the fourth year of his reign.
translation:
  language: te
  text: అతడు తన పరిపాలన యొక్క నాలుగో సంవత్సరంలో, రెండో నెల రెండో రోజున[a] కట్టడం ప్రారంభించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘రెండో నెలలో, రెండో దానిలో’; చివరి మాటను సాధారణంగా ‘రెండో రోజున’ అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחֶל
  choice: ప్రారంభించాడు
  rationale: హిఫీల్ రూపంలో ఉన్న ఈ క్రియ కార్యం మొదలుపెట్టడాన్ని సూచిస్తుంది. వావ్ కథన అనుసంధానాన్ని తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని అనువదించకుండా సహజ వాక్యప్రవాహంలో వ్యక్తం చేశాం.
- source_word: לִבְנוֹת
  choice: కట్టడం
  rationale: בנה క్రియకు నేరమైన, సాధారణ ఆధునిక తెలుగు సమానార్థకం. మూలంలో కర్మ స్పష్టంగా లేకపోవడంతో ‘మందిరాన్ని’ వంటి పదాన్ని చేర్చలేదు.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: రెండో నెల
  rationale: పని ప్రారంభమైన నెలను తెలిపే కాలసూచక పదబంధాన్ని సహజమైన తెలుగులో నేరుగా అందిస్తుంది.
- source_word: בַּשֵּׁנִי
  choice: రెండో రోజున
  rationale: హీబ్రూలో పునరుక్తమైన క్రమసంఖ్య మాత్రమే ఉంది; సందర్భానుసారం లోపించిన ‘రోజు’ అనే భావాన్ని స్పష్టత కోసం ప్రధాన పాఠ్యంలో చేర్చాం, అయితే మూలంలోని సంక్షిప్తతను పాదసూచికలో తెలిపాం.
- source_word: בִּשְׁנַת אַרְבַּע
  choice: నాలుగో సంవత్సరం
  rationale: రాజ్యపాలన సంవత్సరాన్ని సూచించే సాధారణ కాలనిర్ణయ పదబంధానికి సహజమైన తెలుగు రూపం.
- source_word: לְמַלְכוּתוֹ
  choice: తన పాలనలో
  rationale: సొలొమోను రాజుగా పరిపాలించిన కాలాన్ని కాలగణనకు ఆధారంగా చూపుతుంది; ‘తన పాలనలో’ తెలుగు వాక్యంలో సహజంగా సరిపోతుంది.
