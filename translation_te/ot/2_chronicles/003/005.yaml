translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ వర్ణనకు తగిన గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలిని వాడాం. మూలంలోని చెట్టు జాతి అనిశ్చితిని పాదటిప్పణిలో నిలిపాం; అలంకార సందర్భాన్ని ప్రధాన పాఠంలో సహజంగా స్పష్టం చేశాం.
