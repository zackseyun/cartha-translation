- from: అతడు పెద్ద మందిరాన్ని దేవదారు జాతి కలపతో[a] తాపడం చేసి, దానిపై మేలిమి బంగారాన్ని పొదిగించాడు. దానిమీద ఖర్జూర చెట్ల ఆకృతులను, గొలుసులను[b] అమర్చాడు.
  to: అతడు పెద్ద మందిరాన్ని సైప్రస్ కలపతో[a] కప్పి, దానిని మేలిమి బంగారంతో కప్పాడు. దానిమీద ఖర్జూర చెట్ల ఆకృతులను, గొలుసులను[b] అమర్చాడు.
