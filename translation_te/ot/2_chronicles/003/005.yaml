  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֣ת הַ/בַּ֣יִת הַ/גָּד֗וֹל חִפָּה֙ עֵ֣ץ בְּרוֹשִׁ֔ים וַ/יְחַפֵּ֖/הוּ זָהָ֣ב ט֑וֹב וַ/יַּ֧עַל עָלָ֛י/ו תִּמֹרִ֖ים וְ/שַׁרְשְׁרֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/005.yaml
  text: He paneled the great house with cypress wood[a], overlaid it with fine gold[b], and put palm trees and chains on it.
translation:
  language: te
  text: అతడు పెద్ద మందిరాన్ని సైప్రస్ కలపతో[a] కప్పి, దానిని మేలిమి బంగారంతో కప్పాడు. దానిమీద ఖర్జూర చెట్ల ఆకృతులను, గొలుసులను[b] అమర్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ చెట్టు పేరు בְּרוֹשׁ యొక్క ఖచ్చితమైన గుర్తింపు వివాదాస్పదం; దీనిని ‘సైప్రస్,’ ‘ఫర్,’ లేదా ‘జూనిపర్’ కలప అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థంగా ‘ఖర్జూర చెట్లు, గొలుసులు’ అని ఉంది; ఇవి మందిరంపై అమర్చిన అలంకార ఆకృతులు లేదా నగిషీ పనిని సూచించే అవకాశం ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: הַבַּיִת הַגָּדוֹל
  choice: పెద్ద మందిరం
  rationale: ఇక్కడ בַּיִת ఆలయ నిర్మాణంలోని ప్రధాన గదిని లేదా భవన భాగాన్ని సూచిస్తుంది. తెలుగు పాఠకులకు సందర్భం స్పష్టంగా ఉండేలా ‘మందిరం’ అని, הַגָּדוֹלను ‘పెద్ద’ అని అనువదించాం.
- source_word: חִפָּה
  choice: తాపడం చేసి
  rationale: ఈ క్రియకు కప్పడం లేదా పైపూత వేయడం అనే అర్థం ఉంది. కలపతో అంతర్భాగాన్ని కప్పిన నిర్మాణక్రమాన్ని ‘తాపడం చేసి’ సహజంగా తెలియజేస్తుంది.
- source_word: עֵץ בְּרוֹשִׁים
  choice: దేవదారు జాతి కలప
  rationale: בְּרוֹשׁ సూచించే చెట్టు జాతి ఖచ్చితంగా తెలియదు; సైప్రస్, ఫర్, జూనిపర్ వంటి గుర్తింపులు ప్రతిపాదించబడ్డాయి. ప్రధాన పాఠంలో విస్తృతంగా అర్థమయ్యే ‘దేవదారు జాతి’ని ఉంచి, అనిశ్చితిని పాదటిప్పణిలో తెలిపాం.
- source_word: וַיְחַפֵּהוּ זָהָב טוֹב
  choice: దానిపై మేలిమి బంగారాన్ని పొదిగించాడు
  rationale: חפה ఇక్కడ ఉపరితలంపై బంగారాన్ని కప్పడం లేదా పొదగడం సూచిస్తుంది. זָהָב טוֹב అక్షరార్థంగా ‘మంచి బంగారం’; నాణ్యమైన బంగారాన్ని సహజ తెలుగులో ‘మేలిమి బంగారం’గా ఇచ్చాం.
- source_word: וַיַּעַל עָלָיו
  choice: దానిమీద ... అమర్చాడు
  rationale: హిఫిల్ రూపం ఇక్కడ అలంకార అంశాలను ఉపరితలంపై ఉంచడం లేదా అమర్చడం సూచిస్తుంది.
- source_word: תִּמֹרִים
  choice: ఖర్జూర చెట్ల ఆకృతులు
  rationale: పదం ఖర్జూర చెట్లను సూచించినా, నిర్మాణ అలంకరణ సందర్భంలో వాటి రూపాలు లేదా నమూనాలు ఉద్దేశించబడ్డాయని తెలుగులో స్పష్టంగా తెలిపాం.
- source_word: שַׁרְשְׁרוֹת
  choice: గొలుసులు
  rationale: ఈ నామవాచకం గొలుసులను లేదా గొలుసులవంటి అలంకరణను సూచిస్తుంది. ప్రత్యక్షమైన ‘గొలుసులు’ను ప్రధాన పాఠంలో ఉంచాం.
