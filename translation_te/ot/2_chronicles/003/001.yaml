id: 2CH.3.1
reference: 2 Chronicles 3:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֣חֶל שְׁלֹמֹ֗ה לִ/בְנ֤וֹת אֶת בֵּית יְהוָה֙ בִּ/יר֣וּשָׁלִַ֔ם בְּ/הַר֙ הַ/מּ֣וֹרִיָּ֔ה אֲשֶׁ֥ר נִרְאָ֖ה לְ/דָוִ֣יד אָבִ֑י/הוּ אֲשֶׁ֤ר הֵכִין֙ בִּ/מְק֣וֹם דָּוִ֔יד בְּ/גֹ֖רֶן אָרְנָ֥ן הַ/יְבוּסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/001.yaml
  text: Then Solomon began to build the house of Yahweh in Jerusalem on Mount Moriah[a], where Yahweh had appeared to David his father, at the place that David had prepared[b], on the threshing floor of Ornan the Jebusite.
translation:
  language: te
  text: అప్పుడు సొలొమోను యెరూషలేములోని మోరియా కొండపై యెహోవా మందిరాన్ని కట్టడం మొదలుపెట్టాడు. అక్కడ యెహోవా అతని తండ్రియైన దావీదుకు ప్రత్యక్షమయ్యాడు; అది యెబూసీయుడైన ఒర్నాను కళ్లం వద్ద దావీదు సిద్ధం చేసిన స్థలం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: దినవృత్తాంతాల్లో ఈ పేరు “ఒర్నాను”గా ఉంది; 2 సమూయేలు 24:16, 18లో ఇతని పేరు “అరౌనా”గా ఉంది.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּחֶל ... לִבְנוֹת
  choice: కట్టడం మొదలుపెట్టాడు
  rationale: ప్రధాన క్రియతో పాటు לִבְנוֹת అనే ఉద్దేశార్థక క్రియారూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; וַ యొక్క కథన క్రమాన్ని ‘అప్పుడు’ తెలియజేస్తుంది.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: ‘మందిరం’ ఆరాధన కోసం నిర్మించే దేవుని గృహం అనే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; יְהוָה అనే దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: בְּהַר הַמּוֹרִיָּה
  choice: మోరియా కొండ మీద
  rationale: నిర్దిష్టమైన పర్వతస్థలాన్ని సూచించే హీబ్రూ పదబంధానికి సహజమైన స్థానార్థక అనువాదం.
- source_word: אֲשֶׁר נִרְאָה לְדָוִיד אָבִיהוּ
  choice: అక్కడే యెహోవా అతని తండ్రియైన దావీదుకు ప్రత్యక్షమయ్యాడు
  rationale: נִרְאָה యొక్క సాధారణ దైవప్రత్యక్షత భావాన్ని అనుసరిస్తుంది. హీబ్రూలో కర్త వ్యక్తంగా లేకపోయినా సందర్భంలో యెహోవానే కర్తగా గ్రహించబడతాడు.
- source_word: אֲשֶׁר הֵכִין בִּמְקוֹם דָּוִיד
  choice: ఆ స్థలాన్ని దావీదు సిద్ధం చేశాడు
  rationale: కుదించిన హీబ్రూ నిర్మాణాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తూ, הֵכִין యొక్క ‘సిద్ధం చేయు/ఏర్పాటు చేయు’ భావాన్ని నిలుపుతుంది.
- source_word: בְּגֹרֶן
  choice: కళ్లం ఉన్న
  rationale: గింజలను నూర్చి వేరుచేసే బహిరంగ ప్రదేశమైన threshing floor‌కు సాధారణ తెలుగు పదం ‘కళ్లం’; ఇది ఆ స్థలాన్ని మరింత నిర్దిష్టంగా గుర్తిస్తుంది.
- source_word: אָרְנָן הַיְבוּסִי
  choice: యెబూసీయుడైన ఒర్నాను
  rationale: దినవృత్తాంతాల్లో ఉన్న אָרְנָן నామరూపాన్ని అనుసరించి, అతని జాతిగుర్తింపును కూడా నిలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ప్రత్యేక దైవనామాన్ని బిరుదుగా మార్చకుండా తెలుగులో సుపరిచితమైన రూపంలో లిప్యంతరీకరించాం.
- issue: נִרְאָה అనే క్రియకు అంతర్లీన కర్త
  choice: యెహోవా దావీదుకు ప్రత్యక్షమయ్యాడు
  alternative: ఆ స్థలం దావీదుకు చూపబడింది
  rationale: దైవప్రత్యక్షత సందర్భంలో నిఫ్అల్ రూపానికి ‘ప్రత్యక్షమయ్యాడు’ అనేది అత్యంత సహజమైన అర్థం. అయితే వ్యాకరణపరంగా సాధ్యమైన క్రియారహిత ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- issue: ఆ స్థలాన్ని సిద్ధం చేసిన వ్యక్తి
  choice: దావీదు సిద్ధం చేశాడు
  alternative: సొలొమోను దావీదు నిర్ణయించిన స్థలంలో సిద్ధం చేశాడు
  rationale: సమీపంలోని דָוִיד ను הֵכִין క్రియకు కర్తగా గ్రహించడం సందర్భానికి, ప్రాచీన అనువాద సాక్ష్యానికి సరిపోతుంది; అయినా హీబ్రూ వాక్యనిర్మాణం కుదించబడి ఉండటంతో కొంత సందిగ్ధత ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలిని వాడాం. పొడవైన హీబ్రూ వాక్యాన్ని అర్థస్పష్టత కోసం మూడు వాక్యాలుగా విభజించాం; స్థలం, దైవప్రత్యక్షత, దావీదు సిద్ధం చేసిన ప్రదేశం అనే సంబంధాలను నిలిపాం.
