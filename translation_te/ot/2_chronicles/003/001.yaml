- from: అప్పుడు సొలొమోను యెరూషలేములోని మోరియా కొండ మీద యెహోవా మందిరాన్ని కట్టడం మొదలుపెట్టాడు. అక్కడే యెహోవా అతని తండ్రియైన దావీదుకు ప్రత్యక్షమయ్యాడు.[a] యెబూసీయుడైన ఒర్నాను[b] కళ్లం ఉన్న ఆ స్థలాన్ని దావీదు సిద్ధం చేశాడు.
  to: అప్పుడు సొలొమోను యెరూషలేములోని మోరియా కొండపై యెహోవా మందిరాన్ని కట్టడం మొదలుపెట్టాడు. అక్కడ యెహోవా అతని తండ్రియైన దావీదుకు ప్రత్యక్షమయ్యాడు; అది యెబూసీయుడైన ఒర్నాను కళ్లం వద్ద దావీదు సిద్ధం చేసిన స్థలం.[a]
  rationale: మూలంలోని దైవప్రత్యక్షతను స్పష్టంగా ఉంచి, దావీదు సిద్ధం చేసిన స్థలాన్ని సొలొమోను నిర్మాణస్థలంతో అనుసంధానించాం. ఒర్నాను కళ్లం ఆ స్థలానికి గుర్తింపుగా ఉండేలా వాక్యాన్ని క్రమబద్ధం చేశాం. ప్రధాన పాఠాన్ని పునరావృతం చేసే, తక్కువ సంభావ్యమైన పాదసూచిక ప్రత్యామ్నాయాన్ని తొలగించాం; పేరు-భేదానికి సంబంధించిన అవసరమైన పాదసూచికను నిలిపాం.
