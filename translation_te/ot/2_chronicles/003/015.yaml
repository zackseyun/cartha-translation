translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే శైలిని అనుసరించాం. మూలంలోని אֹרֶךְను ‘ఎత్తు’గా వ్యాఖ్యానించకుండా ‘పొడవు’గా నిలిపి, సమాంతర వాక్యంలోని కొలత సమస్యను పాదసూచికలో తెలిపాం.
