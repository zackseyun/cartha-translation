  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֜עַשׂ לִ/פְנֵ֤י הַ/בַּ֨יִת֙ עַמּוּדִ֣ים שְׁנַ֔יִם אַמּ֕וֹת שְׁלֹשִׁ֥ים וְ/חָמֵ֖שׁ אֹ֑רֶךְ וְ/הַ/צֶּ֥פֶת אֲשֶׁר עַל רֹאשׁ֖/וֹ אַמּ֥וֹת חָמֵֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/015.yaml
  text: In front of the house he made two pillars[a], thirty-five cubits high[b], and the capital that was on the top of each was five cubits.
translation:
  language: te
  text: అతడు మందిరం ఎదుట రెండు స్తంభాలను చేశాడు. వాటి పొడవు ముప్పై ఐదు మూరలు[a]. ప్రతి స్తంభం పైభాగంలో ఉన్న శిఖరభాగం ఐదు మూరలు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలపాఠంలో ‘పొడవు ముప్పై ఐదు మూరలు’ అని ఉంది. 1 రాజులు 7:15లో ప్రతి స్తంభం ఎత్తు పద్దెనిమిది మూరలు అని ఉంది. అందువల్ల కొందరు ఇక్కడ రెండు స్తంభాల కలిపిన కొలత ఇవ్వబడిందని భావిస్తారు; మరికొందరు దీనిని పాఠసంబంధమైన క్లిష్టతగా చూస్తారు.
    reason: cross_reference
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘దాని పైభాగంలో’ అని ఏకవచనంలో ఉంది; అది ఒక్కొక్క స్తంభాన్ని విడివిడిగా సూచిస్తున్నట్లు భావించి ప్రధాన పాఠంలో ‘ప్రతి స్తంభం’ అని ఇచ్చాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי הַבַּיִת
  choice: మందిరం ఎదుట
  rationale: לִפְנֵי అనేది ‘ఎదుట’ అనే స్థానార్థాన్ని ఇస్తుంది. ఈ సందర్భంలో הַבַּיִת దేవాలయాన్ని సూచిస్తున్నందున ఆధునిక తెలుగు పాఠకునికి సహజంగా ‘మందిరం’ అని అనువదించాం.
- source_word: עַמּוּדִים שְׁנַיִם
  choice: రెండు స్తంభాలు
  rationale: నిర్మాణ సందర్భంలో עַמּוּדִיםకు సహజమైన, ప్రామాణిక తెలుగు సమానార్థకం ‘స్తంభాలు’.
- source_word: אַמּוֹת שְׁלֹשִׁים וְחָמֵשׁ אֹרֶךְ
  choice: పొడవు ముప్పై ఐదు మూరలు
  rationale: אֹרֶךְను మూలపాఠానికి దగ్గరగా ‘పొడవు’గా ఉంచాం; సందర్భం వల్ల ఇది నిలువెత్తు కొలతగా భావించవచ్చుగానీ, ‘ఎత్తు’ అని మార్చి పాఠంలోని ఉద్రిక్తతను తొలగించలేదు. ప్రాచీన కొలమానమైన cubitకు తెలుగు బైబిలు వాడుకలోని ‘మూర’ను వాడాం.
- source_word: הַצֶּפֶת
  choice: శిఖరభాగం
  rationale: స్తంభం పైన ఉండే అలంకార నిర్మాణ భాగాన్ని సూచించే పదం. సాధారణ పాఠకునికి అర్థమయ్యేలా, నిర్మాణార్థాన్ని నిలుపుతూ ‘శిఖరభాగం’ను ఎంచుకున్నాం.
- source_word: אֲשֶׁר עַל רֹאשׁוֹ
  choice: ప్రతి స్తంభం పైభాగంలో ఉన్న
  rationale: హీబ్రూలో ఏకవచన ప్రత్యయం ‘దాని పైభాగంలో’ అని ఉంది. రెండు స్తంభాల సందర్భంలో అది విభజనార్థకంగా ఒక్కొక్క స్తంభాన్ని సూచించే అవకాశాన్ని సహజ తెలుగులో ‘ప్రతి స్తంభం’గా వ్యక్తం చేశాం.
- source_word: אַמּוֹת חָמֵשׁ
  choice: ఐదు మూరలు
  rationale: మూలంలోని సంఖ్యను, ప్రాచీన కొలమానాన్ని యథాతథంగా నిలిపాం.
