  yaml_path: translation/ot/2_chronicles/003/006.yaml
  text: He overlaid the house with precious stones for beauty[b][a], and the gold was gold from Parvaim.
translation:
  language: te
  text: అతడు ఆ మందిరాన్ని[a] శోభ కోసం విలువైన రాళ్లతో పొదిగించాడు; వాడిన బంగారం పర్వయీము బంగారం.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘ఆ గృహాన్ని.’ దినవృత్తాంతముల గ్రంథంలో ‘గృహం’ అనేది మందిరానికి సాధారణంగా వాడే పేరు.
    reason: lexical_alternative
  - marker: b
    text: పర్వయీము ఎక్కడ ఉండేదో ఖచ్చితంగా తెలియదు. ఈ మాటకు ‘పర్వయీము బంగారం’ లేదా ‘పర్వయీమునుండి వచ్చిన బంగారం’ అని అర్థం కావచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַף
  choice: పొదిగించాడు
  rationale: צפה అనే క్రియ ఇక్కడ నిర్మాణ ఉపరితలాన్ని అలంకార పదార్థంతో కప్పడాన్ని సూచిస్తుంది. విలువైన రాళ్ల సందర్భంలో ‘పొదిగించాడు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: הַבַּיִת
  choice: ఆ మందిరాన్ని
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఆ గృహాన్ని’ ఉన్నా, దినవృత్తాంతముల సందర్భంలో ఇది దేవాలయానికి సాధారణ సూచన. తెలుగులో ‘మందిరం’ సందర్భార్థాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: אֶבֶן יְקָרָה
  choice: విలువైన రాళ్లతో
  rationale: ఏకవచన రూపం ఇక్కడ సమూహార్థకంగా వాడబడింది. ‘విలువైన రాళ్లు’ మూలంలోని భావాన్ని అతిశయింపకుండా సహజంగా తెలియజేస్తుంది.
- source_word: לְתִפְאָרֶת
  choice: అందంగా ఉండేలా
  rationale: ఈ పదబంధం అలంకార సౌందర్యం అనే ఉద్దేశాన్ని లేదా ఫలితాన్ని సూచిస్తుంది. ‘అందంగా ఉండేలా’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: וְהַזָּהָב
  choice: ఆ బంగారం
  rationale: ఈ వాక్యభాగం ఉపయోగించిన బంగారం రకాన్ని ప్రత్యేకంగా తెలియజేస్తుంది. తెలుగు వాక్యనిర్మాణంలో కొత్త వాక్యంగా చెప్పడం సహజంగా ఉంటుంది.
- source_word: זְהַב פַּרְוָיִם
  choice: పర్వయీము బంగారం
  rationale: ఈ సమాసం పర్వయీముతో మూలస్థాన లేదా సంబంధ భావాన్ని సూచించవచ్చు. స్థలాన్ని ఖచ్చితంగా గుర్తించలేనందున ‘పర్వయీము బంగారం’ మూలంలోని సంక్షిప్తతను, అనిశ్చితిని నిలుపుతుంది.
