translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘మందిరం’ సందర్భాన్ని స్పష్టం చేస్తుండగా పాదటిప్పణి మూలంలోని ‘గృహం’ అనే పదాన్ని నమోదు చేస్తుంది. పర్వయీము విషయంలో ఉన్న భౌగోళిక, వ్యాకరణ అనిశ్చితి పాదటిప్పణిలో నిలుపబడింది.
