  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ వివరణకు తగిన సరళమైన గంభీర శైలి వాడబడింది. ప్రాచీన కొలమానమైన ‘మూర’ నిలుపబడింది; సందర్భ స్పష్టత కోసం ‘ఇల్లు’కు బదులుగా ‘మందిరం’ వాడబడింది.
