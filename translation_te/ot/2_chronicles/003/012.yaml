  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/כְנַ֨ף הַ/כְּר֤וּב הָ/אֶחָד֙ אַמּ֣וֹת חָמֵ֔שׁ מַגִּ֖יעַ לְ/קִ֣יר הַ/בָּ֑יִת וְ/הַ/כָּנָ֤ף הָ/אַחֶ֨רֶת֙ אַמּ֣וֹת חָמֵ֔שׁ דְּבֵקָ֕ה לִ/כְנַ֖ף הַ/כְּר֥וּב הָ/אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/012.yaml
  text: The wing of the one cherub was five cubits[a], reaching to the wall of the house; and the other wing was five cubits[b], touching the wing of the other cherub.
translation:
  language: te
  text: ఒక కెరూబు యొక్క రెక్క ఐదు మూరల పొడవు ఉండి మందిరపు గోడను చేరింది; దాని మరొక రెక్క ఐదు మూరల పొడవు ఉండి మరొక కెరూబు రెక్కను తాకి ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరొక కెరూబు రెక్కకు అంటుకొని ఉంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְנַף
  choice: రెక్క
  rationale: మందిరంలోని కెరూబుల సందర్భంలో ఇది శరీరభాగమైన ‘రెక్క’నే సూచిస్తుంది.
- source_word: כְּרוּב
  choice: కెరూబు
  rationale: హీబ్రూ పదం ఇక్కడ ఏకవచనంలో ఉంది; అందువల్ల ఒక్క రూపాన్ని సూచించే ‘కెరూబు’ వాడబడింది.
- source_word: אַמּוֹת חָמֵשׁ
  choice: ఐదు మూరలు
  rationale: నిర్మాణ కొలతలోని ప్రాచీన ‘మూర’ ప్రమాణాన్ని నిలుపుతుంది; ఆధునిక కొలతగా మార్చడం వల్ల అనవసరమైన అంచనా చేరుతుంది.
- source_word: מַגִּיעַ
  choice: వరకు చేరింది
  rationale: రెక్క గోడ దాకా విస్తరించి చేరిన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: קִיר הַבָּיִת
  choice: మందిరపు గోడ
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినప్పటికీ, ఈ సందర్భంలో అది యెహోవా మందిర భవనాన్ని సూచిస్తుంది; ఆధునిక పాఠకునికి స్పష్టత కోసం ‘మందిరం’ వాడబడింది.
- source_word: הַכָּנָף הָאַחֶרֶת
  choice: దాని మరొక రెక్క
  rationale: అదే కెరూబుకు చెందిన రెండవ రెక్కను స్పష్టంగా, సహజంగా సూచిస్తుంది.
- source_word: דְּבֵקָה
  choice: తాకుతూ ఉంది
  rationale: రెండు కెరూబుల రెక్కలు ఒకదానితో ఒకటి సన్నిహితంగా కలిసిన స్థితిని తెలియజేస్తుంది; మూలపదంలో బిగించి కట్టారనే భావం తప్పనిసరిగా లేదు.
- source_word: הַכְּרוּב הָאַחֵר
  choice: అవతలి కెరూబు
  rationale: పక్కనున్న రెండవ కెరూబును సూచించే జత సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
