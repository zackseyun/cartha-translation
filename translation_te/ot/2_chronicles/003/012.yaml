- from: ఆ కెరూబు యొక్క ఒక రెక్క ఐదు మూరల పొడవుండి మందిరపు గోడ వరకు చేరింది; దాని మరొక రెక్క ఐదు మూరల పొడవుండి అవతలి కెరూబు రెక్కను తాకుతూ ఉంది.[a]
  to: ఒక కెరూబు యొక్క రెక్క ఐదు మూరల పొడవు ఉండి మందిరపు గోడను చేరింది; దాని మరొక రెక్క ఐదు మూరల పొడవు ఉండి మరొక కెరూబు రెక్కను తాకి ఉంది.[a]
