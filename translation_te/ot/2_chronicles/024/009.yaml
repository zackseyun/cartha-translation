  text: וַ/יִּתְּנוּ ק֞וֹל בִּֽ/יהוּדָ֣ה וּ/בִֽ/ירוּשָׁלִַ֗ם לְ/הָבִ֤יא לַֽ/יהוָה֙ מַשְׂאַ֞ת מֹשֶׁ֧ה עֶֽבֶד הָ/אֱלֹהִ֛ים עַל יִשְׂרָאֵ֖ל בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/009.yaml
  text: And they made a proclamation in Judah and Jerusalem to bring to Yahweh the levy of Moses the servant of God for Israel in the wilderness[a].
translation:
  language: te
  text: 'అప్పుడు యూదాలోను యెరూషలేములోను వారు ఒక ప్రకటన చేశారు: అరణ్యంలో దేవుని సేవకుడైన మోషే ఇశ్రాయేలీయులపై విధించిన చందాను యెహోవాకు తీసుకురావాలని.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చందా’కు బదులుగా ‘నిర్ణయించబడిన కానుక’ లేదా ‘పన్ను’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం విధించబడిన సమర్పణను లేదా వసూలును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ קוֹל
  choice: వారు ఒక ప్రకటన చేయించారు
  rationale: అక్షరార్థంగా ‘స్వరం ఇచ్చారు’ అనే ఈ హీబ్రూ నుడికారం సందర్భంలో ప్రజలకు అధికారికంగా ప్రకటన చేయడాన్ని సూచిస్తుంది.
- source_word: בִּיהוּדָה וּבִירוּשָׁלַם
  choice: యూదాలోను యెరూషలేములోను
  rationale: ప్రకటన జరిగిన రెండు భౌగోళిక ప్రాంతాలనూ నేరుగా, సహజమైన తెలుగు రూపంలో ఉంచుతుంది.
- source_word: לְהָבִיא לַיהוָה
  choice: యెహోవాకు తీసుకురావాలని
  rationale: ప్రకటన ఉద్దేశాన్ని తెలిపే לְהָבִיאను ‘తీసుకురావాలని’ అని, దేవుని నామమైన יהוהను ‘యెహోవా’ అని ప్రతిబింబిస్తుంది.
- source_word: מַשְׂאַת
  choice: చందా
  rationale: ఇది స్వచ్ఛంద కానుక మాత్రమే కాక నిర్ణయించబడిన ఆర్థిక సమర్పణను సూచిస్తుంది. ‘చందా’ సాధారణ పాఠకులకు సహజంగా ఉండగా, దాని విధించబడిన స్వభావాన్ని క్రియాపదం స్పష్టం చేస్తుంది.
- source_word: מֹשֶׁה עֶבֶד הָאֱלֹהִים
  choice: దేవుని సేవకుడైన మోషే
  rationale: మోషేకు ఇచ్చిన ‘దేవుని సేవకుడు’ అనే బిరుదును యథాతథంగా, సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులపై విధించిన
  rationale: עַל (‘పై’) మరియు מַשְׂאַת యొక్క సందర్భార్థం కలిసి, ఈ చందా ఇశ్రాయేలుపై ఉంచబడిన బాధ్యత అని సూచిస్తాయి. తెలుగులో ‘విధించిన’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: మోషే కాలంలో ఇశ్రాయేలు ఉన్న ప్రదేశాన్ని సూచించే ప్రామాణికమైన, గౌరవప్రదమైన తెలుగు పదం.
theological_decisions:
- issue: יהוה అనే దేవుని నామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఒడంబడిక నామం ప్రత్యక్షంగా ఉంది; దానిని సాధారణ బిరుదుతో మార్చకుండా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచాం.
- issue: עַל יִשְׂרָאֵל యొక్క సంబంధం
  choice: ఇశ్రాయేలీయులపై విధించిన
  alternative: ఇశ్రాయేలీయుల కోసం
  rationale: עַל యొక్క సాధారణ అర్థం ‘పై’; సందర్భంలోని నిర్దేశిత చందాతో కలిపి ఇది ఇశ్రాయేలుపై ఉంచిన బాధ్యతగా అర్థమవుతుంది. ‘కోసం’ అనే పఠనం సాధ్యమైన విస్తృత సంబంధాన్ని చూపినా, విధింపబడిన అర్థాన్ని బలహీనపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. అధికారిక బహిరంగ ప్రకటన భావాన్ని, చందా విధించబడిన స్వభావాన్ని సహజంగా వ్యక్తం చేశాం.
