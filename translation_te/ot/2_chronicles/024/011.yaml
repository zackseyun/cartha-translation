source:
  edition: WLC
  text: וַ/יְהִ֡י בְּ/עֵת֩ יָבִ֨יא אֶת הָֽ/אָר֜וֹן אֶל פְּקֻדַּ֣ת הַ/מֶּלֶךְ֮ בְּ/יַ֣ד הַ/לְוִיִּם֒ וְ/כִ/רְאוֹתָ֞/ם כִּי רַ֣ב הַ/כֶּ֗סֶף וּ/בָ֨א סוֹפֵ֤ר הַ/מֶּ֨לֶךְ֙ וּ/פְקִיד֙ כֹּהֵ֣ן הָ/רֹ֔אשׁ וִ/יעָ֨רוּ֙ אֶת הָ֣/אָר֔וֹן וְ/יִשָּׂאֻ֖/הוּ וִֽ/ישִׁיבֻ֣/הוּ אֶל מְקֹמ֑/וֹ כֹּ֤ה עָשׂוּ֙ לְ/י֣וֹם בְּ/י֔וֹם וַ/יַּֽאַסְפוּ כֶ֖סֶף לָ/רֹֽב־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/011.yaml
  text: And whenever the chest was brought by the Levites to the king’s oversight[a], and when they saw that the money was abundant, the king’s scribe and the chief priest’s officer would come and empty the chest, then carry it and return it to its place. Thus they did day by day[b], and they gathered money in abundance.
translation:
  language: te
  text: లేవీయులు ఆ పెట్టెను[a] రాజు పర్యవేక్షణకు[c] తీసుకువచ్చినప్పుడల్లా, అందులో డబ్బు[b] చాలా ఉందని వారు చూసినప్పుడు, రాజు లేఖకుడు, ప్రధాన యాజకుని అధికారి వచ్చి పెట్టెను ఖాళీ చేసేవారు; ఆ తర్వాత దాన్ని తీసుకెళ్లి తిరిగి దాని స్థానంలో ఉంచేవారు. వారు ప్రతిరోజూ ఈ విధంగా చేసి, విస్తారంగా డబ్బు పోగుచేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘మందసం’ అని కూడా అనువదించగల పదం ఉంది. ఇక్కడ అది నిబంధన మందసాన్ని కాక, కానుకలు సేకరించే పెట్టెను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదానికి ‘వెండి’ అని కూడా అర్థం. ఈ సేకరణ సందర్భంలో అది డబ్బును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘రాజు కార్యాలయానికి’ లేదా ‘రాజు అధికారిక పర్యవేక్షణకు’ అని కూడా అనువదించవచ్చు.
    reason: source_ambiguity
lexical_decisions:
- source_word: הָאָרוֹן
  choice: పెట్టె
  rationale: ఈ సందర్భంలో ఇది కానుకలను సేకరించే పెట్టె; నిబంధన మందసాన్ని సూచించదు. ఆధునిక తెలుగులో ‘పెట్టె’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: פְּקֻדַּת הַמֶּלֶךְ
  choice: రాజు పర్యవేక్షణ
  rationale: ఈ పదబంధం రాజుకు సంబంధించిన అధికారిక పర్యవేక్షణ లేదా పరిపాలనా బాధ్యతను సూచిస్తుంది. మూలంలోని స్వల్ప అస్పష్టతను నిలుపుతూ ‘పర్యవేక్షణ’ సందర్భానికి సరిపోతుంది.
- source_word: בְּיַד הַלְוִיִּם
  choice: లేవీయులు ... తీసుకువచ్చిన
  rationale: ‘చేతి ద్వారా’ అనే హీబ్రూ ప్రయోగం ఇక్కడ కర్తృత్వాన్ని సూచిస్తుంది; తెలుగులో క్రియాశీల నిర్మాణం సహజంగా ఉంటుంది.
- source_word: הַכֶּסֶף / כֶסֶף
  choice: డబ్బు
  rationale: మూలపదానికి ‘వెండి’ లేదా ‘డబ్బు’ అనే అర్థాలు ఉన్నాయి. కానుకల సేకరణ అనే పరిపాలనా సందర్భంలో ‘డబ్బు’ ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: סוֹפֵר הַמֶּלֶךְ
  choice: రాజు లేఖకుడు
  rationale: చారిత్రక పరిపాలనా హోదాను అనవసరంగా ఆధునికీకరించకుండా ‘లేఖకుడు’ వ్యక్తపరుస్తుంది.
- source_word: פְקִיד כֹּהֵן הָרֹאשׁ
  choice: ప్రధాన యాజకుని అధికారి
  rationale: ఇది ప్రధాన యాజకునికి సంబంధించిన పరిపాలనా అధికారిని సూచిస్తుంది; అతని నిర్దిష్ట హోదాను మూలం చెప్పనందున ‘అధికారి’ తగిన విస్తృత పదం.
- source_word: וִיעָרוּ אֶת הָאָרוֹן
  choice: పెట్టెను ఖాళీ చేసేవారు
  rationale: సేకరించిన సొమ్మును పెట్టెలో నుంచి బయటకు తీయడాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וְיִשָּׂאֻהוּ וִישִׁיבֻהוּ אֶל מְקֹמוֹ
  choice: దాన్ని తీసుకెళ్లి తిరిగి దాని స్థానంలో ఉంచేవారు
  rationale: పెట్టెను ఎత్తడం లేదా మోసుకెళ్లడం, ఆపై దాని స్థానానికి తిరిగి చేర్చడం అనే చర్యల క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כֹּה עָשׂוּ לְיוֹם בְּיוֹם
  choice: వారు ప్రతిరోజూ ఈ విధంగా చేసి
  rationale: హీబ్రూ ప్రయోగంలోని పునరావృత దైనందిన చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וַיַּאַסְפוּ כֶסֶף לָרֹב
  choice: విస్తారంగా డబ్బు పోగుచేశారు
  rationale: పునరావృత సేకరణ ఫలితంగా పెద్ద మొత్తంలో ధనం చేరిందనే భావాన్ని ప్రతిబింబిస్తుంది.
