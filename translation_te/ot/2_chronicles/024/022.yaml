revisions:
- from: అయితే యెహోయాదా తనకు చూపిన దయను రాజైన యోవాషు జ్ఞాపకం చేసుకోలేదు[a]—యెహోయాదా అతనికి తండ్రివంటివాడు[b]—పైగా అతని కుమారుణ్ణి చంపించాడు. అతడు చనిపోతూ, “యెహోవా దీన్ని చూసి లెక్క అడుగుగాక[c]” అన్నాడు.
  to: అయితే రాజైన యోవాషు, తనకు తండ్రివంటి యెహోయాదా తనకు చూపిన దయను జ్ఞాపకం చేసుకోలేదు[a]; అతడు యెహోయాదా కుమారుణ్ణి చంపాడు. యెహోయాదా కుమారుడు చనిపోతూ, “యాహ్వే చూచి లెక్క అడుగుగాక[c]” అన్నాడు.
  rationale: The revision restores the active force of ‘he killed,’ clarifies that Jehoiada’s son is both the victim and the dying speaker, and uses ‘యాహ్వే’ in line with the POB audit trail. ‘తనకు తండ్రివంటి యెహోయాదా’ retains the source’s father designation while avoiding an assertion of biological paternity. Footnote b is retained as the support for this clarification, although its anchor is not displayed in the running text because the supplied source text’s own marker placement is not structurally represented in the Telugu draft.
