source:
  edition: WLC
  text: וְ/לֹא זָכַ֞ר יוֹאָ֣שׁ הַ/מֶּ֗לֶךְ הַ/חֶ֨סֶד֙ אֲשֶׁ֨ר עָשָׂ֜ה יְהוֹיָדָ֤ע אָבִי/ו֙ עִמּ֔/וֹ וַֽ/יַּהֲרֹ֖ג אֶת בְּנ֑/וֹ וּ/כְ/מוֹת֣/וֹ אָמַ֔ר יֵ֥רֶא יְהוָ֖ה וְ/יִדְרֹֽשׁ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/022.yaml
  text: But King Joash did not remember the kindness that Jehoiada his father had shown him[a], and he killed his son. As he was dying, he said[c][b], “May Yahweh see and require it.”
translation:
  language: te
  text: అయితే రాజైన యోవాషు, తనకు తండ్రివంటి యెహోయాదా తనకు చూపిన దయను జ్ఞాపకం చేసుకోలేదు[a]; అతడు యెహోయాదా కుమారుణ్ణి చంపాడు. యెహోయాదా కుమారుడు చనిపోతూ, “యాహ్వే చూచి లెక్క అడుగుగాక[c]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దయ’కు బదులుగా ‘నిబద్ధత’ లేదా ‘విశ్వసనీయ ప్రేమ’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘లెక్క అడుగుగాక’ అంటే జరిగిన అన్యాయాన్ని విచారించి దానికి జవాబుదారీ చేయుగాక అనే భావం. ‘విచారించుగాక’ లేదా ‘జవాబుదారీ చేయుగాక’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֶסֶד
  choice: దయను
  rationale: חֶסֶד అనేది దయ, నిబద్ధత, విశ్వసనీయ ప్రేమ అనే భావాలను సూచించగలదు. ఇక్కడ యెహోయాదా యోవాషుకు చేసిన మేలును సహజమైన ఆధునిక తెలుగులో తెలియజేయడానికి ‘దయ’ సరిపోతుంది; ఇతర భావసాధ్యతలను పాదసూచికలో ఉంచాం.
- source_word: זָכַר
  choice: జ్ఞాపకం చేసుకోలేదు
  rationale: మూలంలోని ‘జ్ఞాపకం చేసుకొను’ అనే ప్రత్యక్ష భావాన్ని నిలుపుతుంది; కృతజ్ఞతతో తగినట్లు ప్రవర్తించలేదనే సందర్భార్థాన్ని అనువాదంలో అతిగా విప్పదు.
- source_word: אָבִיו
  choice: అతనికి తండ్రివంటివాడు
  rationale: యెహోయాదా యోవాషు జీవసంబంధమైన తండ్రి కాదు. אָב గౌరవనీయమైన తండ్రి పాత్రను లేదా సంరక్షకుని సూచించగలదు. తెలుగులో ‘అతని తండ్రి’ అనడం వాస్తవ సంబంధంపై అపార్థం కలిగించవచ్చు కాబట్టి, భావాన్ని స్పష్టంగా తెలిపే రూపాన్ని ఎంచుకున్నాం.
- source_word: וַיַּהֲרֹג אֶת־בְּנוֹ
  choice: అతని కుమారుణ్ణి చంపించాడు
  rationale: క్రియకు ప్రత్యక్షంగా ‘చంపాడు’ అనే అర్థం ఉన్నా, 24:21 ప్రకారం యోవాషు ఆజ్ఞతో ప్రజలు జెకర్యాను చంపారు. రాజు కారకత్వాన్ని సహజమైన తెలుగులో ‘చంపించాడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּכְמוֹתוֹ
  choice: అతడు చనిపోతూ
  rationale: כְּמוֹתוֹ ఇక్కడ అతడు మరణిస్తున్న సమయంలో పలికిన మాటలను సూచిస్తుంది; ‘చనిపోతూ’ సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: יֵרֶא יְהוָה
  choice: యెహోవా దీన్ని చూసి
  rationale: జుస్సివ్ భావాన్ని తరువాతి క్రియతో కలిసి ‘చూసి … అడుగుగాక’ అనే ఆశీర్వాదార్థక/విన్నప రూపంలో వ్యక్తం చేశాం. יהוה అనే వ్యక్తిగత నామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: וְיִדְרֹשׁ
  choice: లెక్క అడుగుగాక
  rationale: דרש నేరం లేదా రక్తాపరాధ సందర్భంలో వెదకడం, విచారించడం, జవాబుదారీ చేయడం అనే న్యాయపరమైన భావాన్ని కలిగిస్తుంది. ‘లెక్క అడుగు’ ఆధునిక తెలుగులో బాధ్యత వహింపజేయడాన్ని సహజంగా తెలియజేస్తుంది; ప్రత్యక్ష ప్రతీకారం అనే అర్థానికి మాత్రమే పరిమితం చేయదు.
theological_decisions:
- issue: జెకర్యా మరణవాక్యంలో ఉన్న దైవ న్యాయవిన్నపం
  choice: యెహోవా అన్యాయాన్ని చూసి దానికి లెక్క అడగాలనే విన్నపం
  alternative: యెహోవా నేరుగా ప్రతీకారం తీర్చుకోవాలనే శాపవాక్యం; లేదా యెహోవా చూస్తున్నాడనే సాధారణ ప్రకటన
  rationale: రెండు క్రియల జుస్సివ్ రూపాలు విన్నపాన్ని సూచిస్తాయి. דרש లోని న్యాయపరమైన జవాబుదారీ భావాన్ని నిలుపుతూ, దానిని కేవలం ప్రతీకారంగా సంకుచితం చేయలేదు.
- issue: యెహోయాదాను యోవాషు తండ్రిగా పేర్కొనడం
  choice: తండ్రివంటి పాత్రగా ప్రధాన పాఠ్యంలో స్పష్టీకరించడం
  alternative: ‘అతని తండ్రి’ అని అక్షరార్థంగా అనువదించడం
  rationale: వంశావళి పరంగా యెహోయాదా యోవాషు తండ్రి కాదు; అయితే మూలంలోని אָבִיו అతని సంరక్షక, తండ్రితుల్య పాత్రను గౌరవపూర్వకంగా సూచిస్తుంది. ఈ రూపం సంబంధ స్వభావాన్ని కాపాడుతూ జీవసంబంధ అపార్థాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘పైగా’ యోవాషు కృతఘ్నతకూ హత్యకూ మధ్య ఉన్న తీవ్ర వ్యతిరేకతను సహజంగా చూపుతుంది. దైవనామం יהוה ను తెలుగు బైబిలు వాడుకకు అనుగుణంగా ‘యెహోవా’గా ఇచ్చాం.
