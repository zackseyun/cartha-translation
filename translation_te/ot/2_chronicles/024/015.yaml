  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. హీబ్రూ నుడికారంలోని ‘దినాలు’ అనే చిత్రాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
