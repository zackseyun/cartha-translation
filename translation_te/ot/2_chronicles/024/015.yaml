  yaml_path: translation/ot/2_chronicles/024/015.yaml
  text: And Jehoiada grew old and was full of days[a], and he died. He was one hundred and thirty years old at his death.
translation:
  language: te
  text: యెహోయాదా వృద్ధుడై, నిండు దినాలు జీవించి[a] చనిపోయాడు. అతడు చనిపోయినప్పుడు అతని వయస్సు నూట ముప్పై సంవత్సరాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “దినాలతో తృప్తి పొంది.” ఇది సంపూర్ణమైన జీవితకాలం జీవించాడనే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְקַן
  choice: వృద్ధుడై
  rationale: זקן అనే క్రియ వయస్సు మళ్లిన స్థితికి చేరడాన్ని సూచిస్తుంది. కథన ప్రవాహంలో సహజమైన ఆధునిక తెలుగు కోసం ‘వృద్ధుడై’ అని అనువదించాం.
- source_word: יְהוֹיָדָע
  choice: యెహోయాదా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు లిప్యంతరీకరణ ప్రకారం ఇచ్చాం.
- source_word: וַיִּשְׂבַּע יָמִים
  choice: నిండు దినాలు జీవించి
  rationale: అక్షరార్థంగా ‘దినాలతో నిండిపోయాడు/తృప్తి పొందాడు’ అనే హీబ్రూ నుడికారాన్ని, దాని సంపూర్ణ జీవితకాల భావచిత్రం నిలిచేలా సహజ తెలుగులో ఇచ్చాం.
- source_word: וַיָּמֹת
  choice: చనిపోయాడు
  rationale: מות అనే సాధారణ కథన క్రియకు స్పష్టమైన, సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: בֶּן מֵאָה וּשְׁלֹשִׁים שָׁנָה
  choice: అతని వయస్సు నూట ముప్పై సంవత్సరాలు
  rationale: హీబ్రూలోని ‘నూట ముప్పై సంవత్సరాల కుమారుడు’ అనే వయస్సు సూత్రాన్ని తెలుగులో సహజంగా వ్యక్తపరిచాం.
- source_word: בְּמוֹתוֹ
  choice: అతడు చనిపోయినప్పుడు
  rationale: בְּ ఉపసర్గతో కూడిన ‘అతని మరణం’ అనే రూపం ఇక్కడ కాలాన్ని సూచిస్తుంది; తెలుగులో ‘చనిపోయినప్పుడు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
