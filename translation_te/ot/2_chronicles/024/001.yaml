source:
  edition: WLC
  text: בֶּן שֶׁ֤בַע שָׁנִים֙ יֹאָ֣שׁ בְּ/מָלְכ֔/וֹ וְ/אַרְבָּעִ֣ים שָׁנָ֔ה מָלַ֖ךְ בִּֽ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ צִבְיָ֖ה מִ/בְּאֵ֥ר שָֽׁבַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/001.yaml
  text: Joash was seven years old when he began to reign, and he reigned forty years in Jerusalem. His mother’s name was Zibiah from Beer-sheba.
translation:
  language: te
  text: యోవాషు రాజైనప్పుడు అతనికి ఏడు సంవత్సరాల వయస్సు ఉంది. అతడు యెరూషలేములో నలభై సంవత్సరాలు రాజ్యమేలాడు. అతని తల్లి పేరు జిబ్యా; ఆమె బెయెర్షెబాకు చెందినది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שֶׁבַע שָׁנִים
  choice: అతనికి ఏడు సంవత్సరాలు
  rationale: హీబ్రూ వయస్సు ప్రయోగం అక్షరార్థంగా ‘ఏడు సంవత్సరాల కుమారుడు’; ఆధునిక తెలుగులో వయస్సును సహజంగా తెలిపే ఈ రూపం మూల భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: בְּמָלְכוֹ
  choice: రాజైనప్పుడు
  rationale: בְּ ఉపసర్గతో ఉన్న రూపం రాజ్యారంభ సమయాన్ని సూచిస్తుంది; ‘రాజైనప్పుడు’ సహజమైన, సంక్షిప్తమైన తెలుగు ప్రయోగం.
- source_word: מָלַךְ
  choice: పరిపాలించాడు
  rationale: ఈ క్రియకు ‘రాజుగా ఏలాడు/పరిపాలించాడు’ అనే భావం ఉంది. రాజ్యపాలన కాలాన్ని తెలిపే సందర్భంలో ‘పరిపాలించాడు’ స్పష్టంగా ఉంటుంది.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: בְּ ఇక్కడ స్థలార్థకంగా ఉంది; స్థలనామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וְשֵׁם אִמּוֹ
  choice: అతని తల్లి పేరు
  rationale: వంశావళి/రాజవృత్తాంత సూత్రాన్ని సహజమైన ఆధునిక తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: צִבְיָה
  choice: సిబ్యా
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: מִבְּאֵר שָׁבַע
  choice: బెయేర్షెబాకు చెందినది
  rationale: מִן ఉపసర్గ మూలస్థానం లేదా Herkunftను సూచిస్తుంది. వ్యక్తి పరిచయంలో ‘కు చెందినది’ అనేది సహజమైన తెలుగు రూపం.
