translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజవృత్తాంతానికి తగిన గౌరవప్రదమైన, సరళమైన శైలి. మూలంలోని మూడు సమాచార భాగాలు—రాజ్యారంభ వయస్సు, పాలనాకాలం/స్థలం, తల్లి పేరు/స్వస్థలం—యథాక్రమంగా నిలుపబడ్డాయి.
