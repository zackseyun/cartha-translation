  text: וְ/ר֣וּחַ אֱלֹהִ֗ים לָֽבְשָׁה֙ אֶת זְכַרְיָה֙ בֶּן יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן וַֽ/יַּעֲמֹ֖ד מֵ/עַ֣ל לָ/עָ֑ם וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּ֣ה אָמַ֣ר הָ/אֱלֹהִ֗ים לָ/מָה֩ אַתֶּ֨ם עֹבְרִ֜ים אֶת מִצְוֺ֤ת יְהוָה֙ וְ/לֹ֣א תַצְלִ֔יחוּ כִּֽי עֲזַבְתֶּ֥ם אֶת יְהוָ֖ה וַ/יַּֽעֲזֹ֥ב אֶתְ/כֶֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/020.yaml
  text: 'And the Spirit of God clothed Zechariah son of Jehoiada the priest[a], and he stood above the people and said to them, “Thus says God: Why are you transgressing the commandments of Yahweh, so that you do not prosper? Because you have forsaken Yahweh[b], he has also forsaken you.”'
translation:
  language: te
  text: 'అప్పుడు దేవుని ఆత్మ యాజకుడైన యెహోయాదా కుమారుడు జెకర్యాను వస్త్రంవలె కప్పింది[a]. అతడు ప్రజలకంటే ఎత్తైన చోట నిలబడి వారితో ఇలా అన్నాడు: “దేవుడు ఇలా అంటున్నాడు: ‘మీరు యెహోవా ఆజ్ఞలను ఎందుకు అతిక్రమిస్తున్నారు? దానివల్ల మీరు వర్ధిల్లరు[b]. మీరు యెహోవాను విడిచిపెట్టారు కాబట్టి ఆయన కూడా మిమ్మల్ని విడిచిపెట్టాడు.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జెకర్యా మీదికి వచ్చింది”; అక్షరార్థంగా, “జెకర్యాను వస్త్రంవలె కప్పింది.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మరియు మీరు వర్ధిల్లరు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ אֱלֹהִים
  choice: దేవుని ఆత్మ
  rationale: ప్రవచన సేవకు దేవుడు శక్తినిచ్చే ఈ సందర్భంలో ఇది దేవుని ఆత్మనే సహజంగా సూచిస్తుంది; కేవలం భావోద్వేగం లేదా ప్రేరణగా కుదించలేదు.
- source_word: לָבְשָׁה אֶת
  choice: వస్త్రంలా ఆవరించింది
  rationale: లבשׁ అనే క్రియలోని ‘వస్త్రం ధరింపజేయడం/కప్పడం’ అనే సజీవ రూపకాన్ని సహజమైన తెలుగులో నిలిపింది; ‘మీదికి వచ్చింది’ అనే భావాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: זְכַרְיָה בֶּן יְהוֹיָדָע הַכֹּהֵן
  choice: యాజకుడైన యెహోయాదా కుమారుడు జెకర్యా
  rationale: హీబ్రూ సంబంధాన్ని సహజ తెలుగు క్రమంలో వ్యక్తం చేసి, ‘యాజకుడు’ అనే విశేషణాన్ని యెహోయాదాకు అన్వయించింది.
- source_word: וַיַּעֲמֹד מֵעַל לָעָם
  choice: ప్రజలకంటే ఎత్తైన చోట నిలబడి
  rationale: מֵעַל లోని నిలువు స్థాన భావాన్ని ‘ప్రజల ముందు’ అని చదును చేయకుండా, తెలుగులో స్పష్టంగా తెలిపింది.
- source_word: כֹּה אָמַר הָאֱלֹהִים
  choice: దేవుడు ఇలా అంటున్నాడు
  rationale: ప్రవక్త సందేశ సూత్రంలోని గంభీరతను ఆధునిక, సహజ తెలుగులో నిలిపింది.
- source_word: עֹבְרִים אֶת מִצְוֺת
  choice: ఆజ్ఞలను అతిక్రమిస్తున్నారు
  rationale: ఆజ్ఞల హద్దును దాటడం అనే నిబంధనాత్మక, నైతిక భావాన్ని ‘అతిక్రమించడం’ సముచితంగా తెలియజేస్తుంది.
- source_word: וְלֹא תַצְלִיחוּ
  choice: దానివల్ల మీరు వర్ధిల్లరు
  rationale: సందర్భంలోని పర్యవసాన భావాన్ని సహజంగా తెలిపింది; హీబ్రూ వావ్‌ను సాధారణ సముచ్చయంగా చదివే అవకాశాన్ని పాదసూచికలో ఉంచింది.
- source_word: עֲזַבְתֶּם ... וַיַּעֲזֹב
  choice: విడిచిపెట్టారు ... విడిచిపెట్టాడు
  rationale: రెండు భాగాల్లోనూ ఒకే హీబ్రూ మూలక్రియ పునరావృతమై చూపే పరస్పర ప్రతిస్పందనను అదే తెలుగు క్రియతో నిలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న దేవుని ప్రత్యేక నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణతో ఇచ్చింది.
- issue: רוּחַ אֱלֹהִים యొక్క వ్యక్తిత్వ సూచన
  choice: దేవుని ఆత్మ
  alternative: దేవుని నుండి వచ్చిన ఆత్మ
  rationale: ప్రవచన శక్తినిచ్చే దైవిక కార్యశక్తిని మూలంలోని సహజ భావానుసారం తెలిపింది; ‘ఒక ఆత్మ’ అని అనిశ్చితార్థం చేర్చలేదు.
- issue: దేవునిని విడిచిపెట్టడం మరియు ఆయన విడిచిపెట్టడం
  choice: ఒకే ‘విడిచిపెట్టు’ క్రియను రెండుసార్లు వాడడం
  alternative: మొదట ‘త్యజించడం’, తరువాత ‘సహాయం చేయకపోవడం’
  rationale: మూలంలోని ఉద్దేశపూర్వక ప్రతిస్పందనాత్మక పదపునరావృతాన్ని, దానిలోని ధార్మిక ఉద్రిక్తతను వివరణతో మృదువుపరచకుండా కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన ప్రవచన శైలిని వాడాం. ‘వర్ధిల్లరు’, ‘అతిక్రమిస్తున్నారు’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని నిబంధనాత్మక స్వరాన్ని నిలుపుతాయి. వస్త్ర రూపకాన్ని ప్రధాన పాఠంలో కాపాడి, మరింత సాధారణ ప్రయోగాన్ని పాదసూచికలో ఇచ్చాం.
