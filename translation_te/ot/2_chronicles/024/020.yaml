  to: 'అప్పుడు దేవుని ఆత్మ యాజకుడైన యెహోయాదా కుమారుడు జెకర్యాను వస్త్రంవలె కప్పింది[a]. అతడు ప్రజలకంటే ఎత్తైన చోట నిలబడి వారితో ఇలా అన్నాడు: “దేవుడు ఇలా అంటున్నాడు: ‘మీరు యెహోవా ఆజ్ఞలను ఎందుకు అతిక్రమిస్తున్నారు? దానివల్ల మీరు వర్ధిల్లరు[b]. మీరు యెహోవాను విడిచిపెట్టారు కాబట్టి ఆయన కూడా మిమ్మల్ని విడిచిపెట్టాడు.’”'
