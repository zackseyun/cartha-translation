id: 2CH.24.19
reference: 2 Chronicles 24:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח בָּ/הֶם֙ נְבִאִ֔ים לַ/הֲשִׁיבָ֖/ם אֶל יְהוָ֑ה וַ/יָּעִ֥ידוּ בָ֖/ם וְ/לֹ֥א הֶאֱזִֽינוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/019.yaml
  text: Yet he sent prophets among them to bring them back to Yahweh[a], and they testified against them, but they would not listen.
translation:
  language: te
  text: అయినా, వారిని యాహ్వే వైపు తిరిగి తీసుకురావడానికి ఆయన వారి మధ్యకు ప్రవక్తలను పంపాడు. ఆ ప్రవక్తలు వారికి వ్యతిరేకంగా సాక్ష్యమిచ్చారు[a]; కానీ వారు చెవియొగ్గలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని హెచ్చరించారు.” హీబ్రూ క్రియ గంభీరంగా హెచ్చరించడం అనే భావాన్ని ఇవ్వగలదు; ఇక్కడ వారికి వ్యతిరేకంగా సాక్ష్యమివ్వడం అనే ఛాయ కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపాడు
  rationale: కథన సందర్భంలో שלח క్రియకు సహజమైన, నేరమైన తెలుగు అనువాదం.
- source_word: בָּהֶם
  choice: వారి మధ్యకు
  rationale: ప్రవక్తలను ఆ ప్రజల మధ్యకు పంపించాడనే గమనార్థాన్ని ב ఇక్కడ సూచిస్తుంది.
- source_word: נְבִאִים
  choice: ప్రవక్తలను
  rationale: נביאים పదానికి ప్రామాణికమైన తెలుగు సమానార్థకం.
- source_word: לַהֲשִׁיבָם
  choice: వారిని ... తిరిగి తీసుకురావడానికి
  rationale: שוב హిఫీల్ రూపంలోని కారణార్థాన్ని, అలాగే దేవుని వైపు తిరిగి రావడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶל יְהוָה
  choice: యాహ్వే వైపు
  rationale: దైవనామాన్ని పేరుగా నిలుపుతూ, אֶל సూచించే దిశాత్మక మరియు సంబంధాత్మక తిరుగుదలను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיָּעִידוּ בָם
  choice: వారికి వ్యతిరేకంగా సాక్ష్యమిచ్చారు
  rationale: עוד హిఫీల్ క్రియలోని గంభీర హెచ్చరిక భావంతో పాటు న్యాయపరమైన సాక్ష్య భావాన్ని కూడా నిలుపుతుంది.
- source_word: וְלֹא הֶאֱזִינוּ
  choice: కానీ వారు చెవియొగ్గలేదు
  rationale: శ్రద్ధగా వినకపోవడం మరియు స్పందించడానికి నిరాకరించడం అనే సందర్భోచిత భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: హీబ్రూ మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా పేరుగానే నిలుపుతుంది.
- issue: וַיָּעִידוּ בָם క్రియాపదబంధపు భావం
  choice: వారికి వ్యతిరేకంగా సాక్ష్యమిచ్చారు
  alternative: వారిని హెచ్చరించారు
  rationale: ప్రవక్తల గంభీర హెచ్చరికను మాత్రమే కాక, ప్రజల అవిశ్వాసానికి వ్యతిరేకంగా సాక్ష్యం పలికే న్యాయపరమైన ఛాయను కూడా కాపాడుతుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘చెవియొగ్గలేదు’ అనే ప్రయోగం సాధారణ పాఠకులకు అర్థమయ్యే విధంగా మూలంలోని శ్రద్ధగా వినకపోవడం అనే భావాన్ని నిలుపుతుంది. పాదసూచిక గుర్తును అది వివరించే ప్రవచన క్రియ తర్వాత ఉంచాం.
