id: 2CH.24.12
reference: 2 Chronicles 24:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתְּנֵ֨/הוּ הַ/מֶּ֜לֶךְ וִֽ/יהוֹיָדָ֗ע אֶל עוֹשֵׂה֙ מְלֶ֨אכֶת֙ עֲבוֹדַ֣ת בֵּית יְהוָ֔ה וַ/יִּֽהְי֤וּ שֹׂכְרִים֙ חֹצְבִ֣ים וְ/חָרָשִׁ֔ים לְ/חַדֵּ֖שׁ בֵּ֣ית יְהוָ֑ה וְ֠/גַם לְ/חָרָשֵׁ֤י בַרְזֶל֙ וּ/נְחֹ֔שֶׁת לְ/חַזֵּ֖ק אֶת בֵּ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/012.yaml
  text: And the king and Jehoiada gave it to those doing the work of the service of the house of Yahweh[a], and they hired stonecutters and craftsmen to restore the house of Yahweh[c][b], and also craftsmen in iron and bronze to strengthen the house of Yahweh.
translation:
  language: te
  text: రాజు, యెహోయాదా దానిని[a] యహ్వే మందిర సేవా పనులు చేసేవారికి అప్పగించారు. వారు యహ్వే మందిరాన్ని[b] పునరుద్ధరించడానికి రాళ్లు చెక్కేవారిని, నైపుణ్యంగల పనివారిని, అలాగే దానిని బలపరచడానికి ఇనుము, కంచు పనిలో నిపుణులైనవారిని[c] కూలికి నియమించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థం, ‘దానిని ఇచ్చారు.’ ఇక్కడ ‘దానిని’ అనేది ముందటి సందర్భంలో సేకరించిన డబ్బును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, ‘యహ్వే గృహం’; అంటే మందిరం.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ఇనుము, కంచు కమ్మరులను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ
  choice: దానిని అప్పగించారు
  rationale: נתן అనే క్రియకు ఉన్న తృతీయ పురుష ఏకవచన కర్మప్రత్యయం ముందటి సందర్భంలోని సేకరించిన డబ్బును సూచిస్తుంది. ప్రధాన పాఠంలో కర్మను అతిగా నిర్దిష్టం చేయకుండా ‘దానిని’ అని ఉంచి, సహజమైన సందర్భార్థం కోసం ‘అప్పగించారు’ అని అనువదించాం.
- source_word: אֶל עוֹשֵׂה מְלֶאכֶת עֲבוֹדַת בֵּית יְהוָה
  choice: యహ్వే మందిర సేవకు సంబంధించిన పని చేస్తున్నవారికి
  rationale: హీబ్రూ పదబంధంలోని ‘పని—సేవ—మందిరం’ అనే పొరల నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, మూలంలో స్పష్టంగా లేని ‘పర్యవేక్షకులు’ అనే భావాన్ని చేర్చలేదు.
- source_word: בֵּית יְהוָה
  choice: యహ్వే మందిరం
  rationale: అక్షరార్థం ‘యహ్వే గృహం.’ ఆధునిక తెలుగులో ఆ భవనం ఆలయమని స్పష్టంగా, సహజంగా తెలియజేయడానికి ‘మందిరం’ ఎంచుకున్నాం; అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וַיִּהְיוּ שֹׂכְרִים
  choice: కూలికి పెట్టుకున్నారు
  rationale: היה + కృదంత నిర్మాణం పనివారిని వేతనానికి నియమించే కొనసాగుతున్న లేదా ఏర్పడిన చర్యను సూచిస్తుంది. తెలుగులో ‘కూలికి పెట్టుకున్నారు’ సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: חֹצְבִים
  choice: రాళ్లు చెక్కేవారు
  rationale: మందిర మరమ్మతుల సందర్భంలో రాతిని కోసి, చెక్కే పనివారిని సూచిస్తుంది; సాధారణ పాఠకులకు స్పష్టమైన ఆధునిక ప్రయోగం.
- source_word: חָרָשִׁים
  choice: శిల్పులు
  rationale: ఈ పదం కేవలం వడ్రంగులను కాక నైపుణ్యంగల పనివారిని విస్తృతంగా సూచించగలదు. అందువల్ల విస్తృతార్థం నిలిచేలా ‘శిల్పులు’ అని అనువదించాం.
- source_word: לְחַדֵּשׁ
  choice: పునరుద్ధరించడానికి
  rationale: పియేల్ రూపం ‘మళ్లీ కొత్తగా చేయడం’ అనే భావాన్ని ఇస్తుంది. నిర్మాణ సందర్భంలో మరమ్మతు మరియు నవీకరణ రెండింటినీ కలిపి తెలిపే ‘పునరుద్ధరించడానికి’ సరిపోతుంది.
- source_word: לְחָרָשֵׁי בַרְזֶל וּנְחֹשֶׁת
  choice: ఇనుము, కంచుతో పనిచేసే శిల్పులు
  rationale: లోహాలతో పనిచేసే నైపుణ్యంగల పనివారనే విస్తృత భావాన్ని నిలుపుతుంది. మరింత నిర్దిష్టమైన ‘కమ్మరులు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ప్రాచీన నిర్మాణ సామగ్రి సందర్భంలో ఈ పదం సాధారణంగా కంచును సూచిస్తుంది; ‘రాగి’ కూడా సాధ్యమైనప్పటికీ ఇక్కడ కంచు సందర్భోచితం.
- source_word: לְחַזֵּק
  choice: బలపరచడానికి
  rationale: חזק యొక్క ప్రత్యక్ష భావం ‘బలంగా చేయడం.’ నిర్మాణాన్ని దృఢపరచడాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాక చతురక్షర దైవనామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’ ఉచ్చారణకు దగ్గరైన తెలుగు రూపం ‘యహ్వే’గా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. పొడవైన హీబ్రూ వాక్యాన్ని తెలుగులో సహజ పఠనార్థం మూడు వాక్యాలుగా విభజించాం; భావక్రమాన్ని మార్చలేదు. ‘యహ్వే’ అనే వ్యక్తినామాన్ని అన్ని సందర్భాల్లో ఏకరీతిగా ఉంచాం.
