  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֖לֶּה הַ/מִּתְקַשְּׁרִ֣ים עָלָ֑י/ו זָבָ֗ד בֶּן שִׁמְעָת֙ הָֽ/עַמּוֹנִ֔ית וִ/יה֣וֹזָבָ֔ד בֶּן שִׁמְרִ֖ית הַ/מּוֹאָבִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/026.yaml
  text: 'And these were the men who conspired against him: Zabad son of Shimeath the Ammonite woman[a], and Jehozabad son of Shimrith the Moabite woman.'
translation:
  language: te
  text: 'అతనికి వ్యతిరేకంగా కుట్ర చేసినవారు వీరే: అమ్మోనీయురాలైన షిమాతు కుమారుడు జాబాదు, మోయాబీయురాలైన షిమ్రీతు కుమారుడు యెహోజాబాదు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: వీరే
  rationale: కుట్ర చేసినవారిని గుర్తించి పరిచయం చేసే హెబ్రీయ నిర్మాణాన్ని తెలుగు కథనానికి సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַמִּתְקַשְּׁרִים
  choice: కుట్ర చేసినవారు
  rationale: קשר హిత్పయేల్ కృదంతం కలిసి పన్నాగం చేయడం లేదా కుట్రలో చేరడం అనే భావాన్ని ఇస్తుంది; ఈ రూపం కృదంత భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: עָלָיו
  choice: అతనికి వ్యతిరేకంగా
  rationale: ఈ సందర్భంలో על కుట్ర లక్ష్యాన్ని సూచిస్తుంది.
- source_word: זָבָד
  choice: జాబాదు
  rationale: హెబ్రీయ వ్యక్తిపేరుకు తెలుగు లిప్యంతరీకరణ.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశసంబంధాన్ని తెలిపే సాధారణ, సహజ తెలుగు పదం.
- source_word: שִׁמְעָת
  choice: షిమాతు
  rationale: హెబ్రీయ వ్యక్తిపేరుకు తెలుగు లిప్యంతరీకరణ.
- source_word: הָעַמּוֹנִית
  choice: అమ్మోనీయురాలైన
  rationale: హెబ్రీయ స్త్రీలింగ ఏకవచన రూపాన్ని స్పష్టంగా నిలుపుతూ, ఆ తల్లి అమ్మోను జాతికి చెందినదని తెలియజేస్తుంది.
- source_word: וִיהוֹזָבָד
  choice: యెహోజాబాదు
  rationale: హెబ్రీయ వ్యక్తిపేరుకు తెలుగు లిప్యంతరీకరణ; జాబితాలో రెండవ వ్యక్తిని కలిపే భావం తెలుగు విరామ నిర్మాణంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: שִׁמְרִית
  choice: షిమ్రీతు
  rationale: హెబ్రీయ వ్యక్తిపేరుకు తెలుగు లిప్యంతరీకరణ.
- source_word: הַמּוֹאָבִית
  choice: మోయాబీయురాలైన
  rationale: హెబ్రీయ స్త్రీలింగ ఏకవచన రూపాన్ని నిలుపుతూ, ఆ తల్లి మోయాబు జాతికి చెందినదని స్పష్టం చేస్తుంది.
