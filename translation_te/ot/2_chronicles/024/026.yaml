translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని స్త్రీలింగ జాతి గుర్తింపులను ‘అమ్మోనీయురాలు’, ‘మోయాబీయురాలు’ రూపాల్లో స్పష్టంగా నిలిపాం. అవసరం లేని పాదసూచికను చేర్చలేదు; అందువల్ల ప్రధాన పాఠ్యంలో పాదసూచిక గుర్తులు లేవు.
