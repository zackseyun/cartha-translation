id: 2CH.24.8
reference: 2 Chronicles 24:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ וַֽ/יַּעֲשׂ֖וּ אֲר֣וֹן אֶחָ֑ד וַֽ/יִּתְּנֻ֛/הוּ בְּ/שַׁ֥עַר בֵּית יְהוָ֖ה חֽוּצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/008.yaml
  text: Then the king commanded[a], and they made one chest and placed it outside at the gate of the house of Yahweh.
translation:
  language: te
  text: అప్పుడు రాజు ఆజ్ఞాపించాడు. వారు ఒక పెట్టెను[a] తయారుచేసి, దాన్ని యహ్వే మందిర ద్వారం వెలుపల ఉంచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా “ఒక పెట్టె.” ఇది కానుకల సేకరణ కోసం నియమించిన ఒకే పెట్టెను నొక్కిచెప్పి ఉండవచ్చు.
    reason: ‘ఒక’ అనే సంఖ్యాపదం సాధారణ అనిర్దిష్ట వాడుకలోనిదా, లేక ఒకే నిర్దిష్ట సేకరణ పెట్టెను నొక్కిచెప్పేదా అనే భావసూక్ష్మతను తెలియజేయడానికి.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఆజ్ఞాపించాడు
  rationale: మూలపదానికి అక్షరార్థంగా ‘చెప్పాడు’ అని అర్థమైనా, రాజు పలికిన మాటను వెంటనే అమలు చేసిన పరిపాలనా సందర్భంలో అది ఆజ్ఞ భావాన్ని ఇస్తుంది.
- source_word: וַיַּעֲשׂוּ
  choice: వారు తయారుచేసి
  rationale: భౌతిక వస్తువును చేసినట్లు తెలిపే సాధారణ క్రియార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; కర్తలు ఎవరన్నది మూలంలాగే పేర్కొనబడలేదు.
- source_word: אֲרוֹן אֶחָד
  choice: ఒక పెట్టెను
  rationale: אֲרוֹן ఇక్కడ నిబంధన మందసాన్ని కాక, సేకరణ కోసం ఉపయోగించే పెట్టెను సూచిస్తుంది. אֶחָד అనే సంఖ్యాపదాన్ని ‘ఒక’గా నిలిపి ఉంచడం ఒక నిర్దిష్టమైన ఏకైక పెట్టె భావాన్ని సంరక్షిస్తుంది.
- source_word: וַיִּתְּנֻהוּ
  choice: దాన్ని … ఉంచారు
  rationale: పెట్టెను ఒక నిర్దిష్ట స్థలంలో పెట్టడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּשַׁעַר בֵּית יְהוָה
  choice: యహ్వే మందిర ద్వారం దగ్గర
  rationale: ‘యహ్వే గృహ ద్వారం వద్ద’ అనే మూల నిర్మాణాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, ఇక్కడ ‘గృహం’ దేవాలయాన్ని సూచిస్తుందని స్పష్టం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: మూలంలోని దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ప్రతిలిపి చేస్తుంది.
- source_word: חוּצָה
  choice: బయట
  rationale: పెట్టె ద్వారం వెలుపలి వైపున ఉంచబడిందనే స్థల భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: వచనంలో వ్యక్తిగత దైవనామమే ప్రత్యక్షంగా ఉంది; దానిని బిరుదుగా మార్చకుండా ప్రతిలిపి చేయడం మూలపాఠాన్ని పారదర్శకంగా ప్రతిబింబిస్తుంది.
- issue: אֲרוֹן అనే పదం నిబంధన మందసాన్ని సూచిస్తుందా
  choice: పెట్టె
  alternative: మందసం
  rationale: ఈ సందర్భంలో ఇది కానుకల సేకరణకు ఉద్దేశించిన సాధారణ పెట్టె. ‘మందసం’ అంటే నిబంధన మందసం అనే ప్రత్యేక ధార్మిక సంబంధం అనవసరంగా కలగవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి వాడబడింది. పొడవైన సంయుక్త వాక్యాన్ని రెండు వాక్యాలుగా విభజించి పఠన సౌలభ్యాన్ని పెంచినా, సంఘటనల క్రమం అలాగే ఉంచబడింది. ‘ఆజ్ఞాపించాడు’ సందర్భార్థాన్ని, ‘ఒక పెట్టె’ మూలంలోని సంఖ్యాపదాన్ని, ‘యహ్వే’ దైవనామాన్ని సంరక్షిస్తాయి.
