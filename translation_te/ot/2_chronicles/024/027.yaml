  text: וּ/בָנָ֞י/ו ו/רב הַ/מַּשָּׂ֣א עָלָ֗י/ו וִ/יסוֹד֙ בֵּ֣ית הָ/אֱלֹהִ֔ים הִנָּ֣/ם כְּתוּבִ֔ים עַל מִדְרַ֖שׁ סֵ֣פֶר הַ/מְּלָכִ֑ים וַ/יִּמְלֹ֛ךְ אֲמַצְיָ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/027.yaml
  text: His sons[a], the many oracles against him, and the founding of the house of God—behold, they are written in the Midrash of the Book of the Kings[b]. And Amaziah his son reigned in his place.
translation:
  language: te
  text: అతని కుమారులు, అతనికి వ్యతిరేకంగా అనేక ప్రకటనలు[a], దేవుని మందిరపు పునాది వేయడం—ఇవన్నీ రాజుల గ్రంథపు మిద్రాష్‌లో[b] వ్రాయబడి ఉన్నాయి. అతని కుమారుడైన అమజ్యా అతని స్థానంలో రాజుగా పరిపాలించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ భాగంలోని హీబ్రూ పదబంధం క్లిష్టమైనది. దీనిని ‘అతని మీదున్న గొప్ప భారం,’ ‘అతనికి వ్యతిరేకంగా అనేక ప్రకటనలు,’ లేదా ‘అతనిపై విధించిన భారీ కప్పం’ అని కూడా అర్థం చేసుకోవచ్చు. מַשָּׂא అనే పదానికి ‘భారం,’ ‘ఉక్తి/ప్రకటన,’ కొన్ని సందర్భాల్లో ‘మోపబడిన భారం’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘మిద్రాష్’ అంటే రాజుల గ్రంథంతో సంబంధమున్న వివరణగ్రంథం, వ్యాఖ్యానం, లేదా విశదీకరణ కావచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָנָיו
  choice: అతని కుమారులు
  rationale: బహువచన నామవాచకాన్నీ, మూడవ పురుష ఏకవచన ప్రత్యయాన్నీ నేరుగా ప్రతిబింబిస్తుంది; వావ్ యొక్క అనుసంధాన భావం జాబితా నిర్మాణంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: וְרֹב הַמַּשָּׂא עָלָיו
  choice: అతనికి వ్యతిరేకంగా పలికిన అనేక దైవోక్తులు
  rationale: מַשָּׂא ప్రవచన సందర్భాల్లో తీర్పుతో కూడిన దైవోక్తిని సూచించగలదు; עָלָיו ఇక్కడ ప్రతికూల భావంలో ‘అతనికి వ్యతిరేకంగా’ అని సహజంగా వస్తుంది. హీబ్రూ పదబంధం క్లిష్టమైనందున ఇతర అర్థాలను పాదసూచికలో ఉంచాం.
- source_word: וִיסוֹד
  choice: పునాది వేయడం
  rationale: יסד మూలంలోని ‘పునాది వేయు/స్థాపించు’ అనే భావాన్ని కాపాడుతుంది; సందర్భం మరమ్మతులను సూచించినా మూలపదంలో లేని ‘పునర్నిర్మాణం’ అనే భావాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరం
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘దేవుని ఇల్లు’; ఈ సందర్భంలో సాధారణ తెలుగు పాఠకునికి ‘మందిరం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הִנָּם כְּתוּבִים
  choice: ఇవన్నీ ... రాయబడి ఉన్నాయి
  rationale: הִנָּם లోని సూచనాత్మక ఉద్ఘాటనను ‘ఇవన్నీ’ వ్యక్తం చేస్తుంది; కృదంత నిష్క్రియ రూపాన్ని ‘రాయబడి ఉన్నాయి’గా నిలుపుతుంది.
- source_word: עַל מִדְרַשׁ סֵפֶר הַמְּלָכִים
  choice: రాజుల గ్రంథపు మిద్రాషులో
  rationale: מִדְרַשׁ యొక్క గ్రంథప్రక్రియను అతిగా నిర్దిష్టం చేయకుండా లిప్యంతరీకరించాం; వివరణను పాదసూచికలో ఇచ్చాం.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: అతని స్థానంలో రాజయ్యాడు
  rationale: రాజవంశ వారసత్వాన్ని తెలిపే సాధారణ హీబ్రూ సూత్రానికి సహజమైన ఆధునిక తెలుగు రూపం.
