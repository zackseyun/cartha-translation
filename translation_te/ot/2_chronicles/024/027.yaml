  source_fidelity: ముఖ్య పాఠ్యం హీబ్రూ వాక్యంలోని జాబితా నిర్మాణాన్ని, ‘వ్రాయబడి ఉన్నాయి’ అనే నిష్క్రియ భావాన్ని, అలాగే అమజ్యా వారసత్వ సూత్రాన్ని సరిగ్గా ప్రతిబింబిస్తుంది. అయితే מַשָּׂא క్లిష్టమైన, వివాదాస్పద పదం; ‘దైవోక్తులు’ అనేది మూలంలో స్పష్టంగా లేని దైవిక మూలాన్ని ప్రధాన పాఠ్యంలో నిర్దిష్టపరుస్తుంది. మరింత తటస్థమైన ‘ప్రకటనలు’ సరైనది; ‘అతనికి వ్యతిరేకంగా’ అనే సందర్భానుగుణ భావాన్ని నిలుపుతుంది.
  naturalness: సవరించిన పాఠ్యంలో ‘మిద్రాష్‌లో’ అనేది హీబ్రూ పదానికి మరింత ఖచ్చితమైన లిప్యంతరీకరణ. ‘రాజుగా పరిపాలించాడు’ అనేది ఆధునిక ప్రామాణిక తెలుగులో వారసత్వ రాజ్యపాలనను సహజంగా తెలియజేస్తుంది. దీర్ఘ జాబితాకు డ్యాష్ వినియోగం స్పష్టంగా ఉంది.
