source:
  edition: WLC
  text: וַ/יִּקְשְׁר֣וּ עָלָ֔י/ו וַ/יִּרְגְּמֻ֥/הוּ אֶ֖בֶן בְּ/מִצְוַ֣ת הַ/מֶּ֑לֶךְ בַּ/חֲצַ֖ר בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/021.yaml
  text: So they conspired against him and stoned him at the command of the king[c][b][a], in the court of the house of Yahweh.
translation:
  language: te
  text: వారు అతనికి వ్యతిరేకంగా కుట్ర పన్ని[a], రాజు ఆజ్ఞ మేరకు యాహ్వే మందిర ప్రాంగణంలో[c] అతణ్ణి రాళ్లతో కొట్టారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనికి వ్యతిరేకంగా పన్నాగం పన్ని.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “అతణ్ణి రాయితో కొట్టారు”; ఈ ప్రయోగం రాళ్లతో కొట్టడాన్ని, తరచుగా రాళ్లతో కొట్టి మరణశిక్ష అమలు చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “యాహ్వే ఇంటి ప్రాంగణంలో,” అంటే యాహ్వే మందిర ప్రాంగణంలో.
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו
  choice: అతనికి వ్యతిరేకంగా కుట్ర పన్ని
  rationale: קשר + עַל ఇక్కడ ఒక వ్యక్తికి వ్యతిరేకంగా కలసి కుట్ర చేయడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘కుట్ర పన్ని’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: וַיִּרְגְּמֻהוּ אֶבֶן
  choice: అతణ్ణి రాళ్లతో కొట్టి చంపారు
  rationale: רגם రాళ్లతో కొట్టి శిక్ష అమలు చేయడాన్ని సూచిస్తుంది; אֶבֶן ఏకవచన రూపంలో ఉన్నప్పటికీ సాధనార్థక సమూహ భావంతో ‘రాళ్లతో’ అని తెలుగులో సహజంగా అనువదించబడింది. సందర్భంలోని మరణశిక్ష భావాన్ని ‘కొట్టి చంపారు’ స్పష్టపరుస్తుంది.
- source_word: בְּמִצְוַת הַמֶּלֶךְ
  choice: రాజు ఆజ్ఞ మేరకు
  rationale: מִצְוָה ఇక్కడ అధికారిక ఆజ్ఞను సూచిస్తుంది. ఈ పదబంధం రాజు ప్రత్యక్ష బాధ్యతను సహజ తెలుగులో నిలుపుతుంది.
- source_word: בַּחֲצַר בֵּית יְהוָה
  choice: యాహ్వే మందిర ప్రాంగణంలో
  rationale: חָצֵר అనేది ప్రాంగణం; בֵּית־יְהוָה ఆలయ సందర్భంలో ‘యాహ్వే మందిరం’ అని అర్థమవుతుంది. ఈ రూపం అక్షరార్థంలోని ‘ఇల్లు’ భావాన్ని సందర్భానుకూలంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: హీబ్రూ పాఠంలో దైవనామం ప్రత్యక్షంగా ఉంది. బిరుదుతో భర్తీ చేయకుండా ఒడంబడిక నామాన్ని తెలుగులో ధ్వన్యనుకరణగా నిలిపాం.
- issue: רגם లో మరణశిక్ష భావాన్ని వ్యక్తీకరించడం
  choice: రాళ్లతో కొట్టి చంపారు
  alternative: రాళ్లతో కొట్టారు
  rationale: ఈ సందర్భంలో చర్య రాళ్లతో కొట్టి మరణశిక్ష అమలు చేయడం; అయినప్పటికీ హీబ్రూ నిర్మాణంలోని ‘రాయి’ ప్రత్యేకతను పాదసూచికలో చూపించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘కుట్ర పన్ని,’ ‘ఆజ్ఞ మేరకు,’ ‘మందిర ప్రాంగణం’ వంటి పదబంధాలు సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ఎంచుకోబడ్డాయి; హీబ్రూ అక్షరార్థ వివరాలు పాదసూచికల్లో నిలుపబడ్డాయి.
