  text: וַ/יְהִ֣י לִ/תְקוּפַ֣ת הַ/שָּׁנָ֗ה עָלָ֣ה עָלָי/ו֮ חֵ֣יל אֲרָם֒ וַ/יָּבֹ֗אוּ אֶל יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם וַ/יַּשְׁחִ֛יתוּ אֶת כָּל שָׂרֵ֥י הָ/עָ֖ם מֵ/עָ֑ם וְ/כָל שְׁלָלָ֥/ם שִׁלְּח֖וּ לְ/מֶ֥לֶךְ דַּרְמָֽשֶׂק׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/023.yaml
  text: At the turn of the year[a], the army of Aram came up against him. They came to Judah and Jerusalem, and destroyed all the leaders of the people from among the people[c][b], and sent all their spoil to the king of Damascus.
translation:
  language: te
  text: సంవత్సరం తిరిగే వేళ[a], అరాము[b] సైన్యం అతనిపైకి దండెత్తి వచ్చింది. వారు యూదా దేశానికీ యెరూషలేముకూ వచ్చి, ప్రజలలోని నాయకులందరినీ నాశనం చేశారు. వారి దోపిడిసొత్తంతటినీ[c] దమస్కు రాజుకు పంపించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సంవత్సరం ముగిసే సమయానికి.” హీబ్రూ నుడికారం సంవత్సరం తిరగడాన్ని లేదా ఋతుచక్రంలోని మార్పును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “అరాము” అనే హీబ్రూ పేరు కొన్ని అనువాదాల్లో “సిరియా” అని ఉంటుంది.
    reason: cultural_note
  - marker: c
    text: లేదా, “వారి కొల్లసొత్తంతటినీ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְקוּפַת הַשָּׁנָה
  choice: సంవత్సరం మలుపు తిరిగే సమయానికి
  rationale: תְּקוּפָה సంవత్సరపు చక్రం లేదా కాలమార్పును సూచిస్తుంది. తెలుగు పాఠకులకు సహజంగా ఉండేలా, కేవలం అస్పష్టమైన ‘కొంతకాలానికి’ అనే భావం రాకుండా ఈ రూపం ఎంచుకోబడింది.
- source_word: עָלָה עָלָיו
  choice: అతనిపైకి దండెత్తి వచ్చింది
  rationale: సైనిక సందర్భంలో עלה על అంటే ఒకరిపైకి యుద్ధానికి రావడం. ‘దండెత్తి వచ్చింది’ ఆ సైనిక భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టం చేస్తుంది.
- source_word: חֵיל אֲרָם
  choice: అరాము సైన్యం
  rationale: חֵיל ఇక్కడ సైనిక దళాన్ని సూచిస్తుంది. ప్రాచీన స్థలనామాన్ని నిలుపుకోవడానికి ‘సిరియా’కు బదులు ‘అరాము’ వాడబడింది.
- source_word: וַיָּבֹאוּ אֶל יְהוּדָה וִירוּשָׁלַם
  choice: వారు యూదా దేశానికీ యెరూషలేముకూ వచ్చి
  rationale: בוא యొక్క సాధారణ ‘రావడం/ప్రవేశించడం’ అనే అర్థాన్ని నిలిపి, సందర్భంలో ఇప్పటికే స్పష్టమైన దండయాత్ర భావాన్ని ఈ క్రియలో అదనంగా చేర్చలేదు.
- source_word: וַיַּשְׁחִיתוּ
  choice: నాశనం చేశారు
  rationale: హిఫీల్ రూపంలోని שׁחת ఇక్కడ వ్యక్తులను ధ్వంసం చేయడం లేదా చంపివేయడం అనే తీవ్రమైన భావం కలిగిస్తుంది. ‘నాశనం చేశారు’ ఆ తీవ్రతను గౌరవప్రదమైన కథన శైలిలో నిలుపుతుంది.
- source_word: כָּל שָׂרֵי הָעָם מֵעָם
  choice: ప్రజలలోని నాయకులందరినీ
  rationale: שָׂרִים అనేది నాయకులు, పాలకులు లేదా అధికారులు అనే విస్తృత అర్థం కలిగిన పదం. ‘నాయకులు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది; ‘ప్రజలలోని’ అనే రూపం מֵעָם సూచించే ప్రజల మధ్యనుండి వేరుచేయబడిన భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וְכָל שְׁלָלָם
  choice: తాము కొల్లగొట్టిన సొత్తంతటినీ
  rationale: שָׁלָל యుద్ధంలో స్వాధీనం చేసుకున్న కొల్లసొత్తును సూచిస్తుంది. సందర్భానుసారం బహువచన ప్రత్యయం అరాము సైన్యం తీసుకున్న సొత్తును సూచిస్తున్నందున, తెలుగులో సహజంగా ‘తాము కొల్లగొట్టిన’ అని వ్యక్తం చేయబడింది.
- source_word: שִׁלְּחוּ לְמֶלֶךְ דַּרְמָשֶׂק
  choice: దమస్కు రాజుకు పంపించారు
  rationale: ఈ పదబంధం దమస్కు కేంద్రంగా పాలించిన రాజుకు ఆ కొల్లసొత్తు పంపబడిందని సహజంగా సూచిస్తుంది. ‘దమస్కు రాజు’ మూలంలోని నిర్మాణాన్ని సంక్షిప్తంగా నిలుపుతుంది.
