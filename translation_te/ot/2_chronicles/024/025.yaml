  naturalness: మొత్తంగా ఆధునిక ప్రామాణిక తెలుగు సహజంగా ఉంది. అయితే “కుట్రపన్ని” కంటే “కుట్ర పన్ని” అనేది స్పష్టమైన, సాధారణ వ్రాత. అలాగే “మంచం మీదనే”లోని ‘నే’ మూలంలో లేని ఉద్ఘాటనను కలుపుతుంది; దాన్ని తొలగించడం మరింత ఖచ్చితమైనది.
  terminology: “యెహోయాదా,” “యాజకుడు,” “రక్తం,” “సేవకులు,” “సమాధులు” తగిన పదాలు. “కుమారుల” అనే బహువచనాన్ని ప్రధాన పాఠంలో ఉంచడం అవసరం; పాదసూచికలో జెకర్యాకు సంబంధించిన సందర్భసూచన సముచితం.
