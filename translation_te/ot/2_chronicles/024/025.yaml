id: 2CH.24.25
reference: 2 Chronicles 24:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְ/לֶכְתָּ֣/ם מִמֶּ֗/נּוּ כִּֽי עָזְב֣וּ אֹת/וֹ֮ ב/מחליים רַבִּים֒ הִתְקַשְּׁר֨וּ עָלָ֜י/ו עֲבָדָ֗י/ו בִּ/דְמֵי֙ בְּנֵי֙ יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן וַ/יַּֽהַרְגֻ֥/הוּ עַל מִטָּת֖/וֹ וַ/יָּמֹ֑ת וַֽ/יִּקְבְּרֻ֨/הוּ֙ בְּ/עִ֣יר דָּוִ֔יד וְ/לֹ֥א קְבָרֻ֖/הוּ בְּ/קִבְר֥וֹת הַ/מְּלָכִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/025.yaml
  text: When they departed from him—for they left him with many diseases—his servants conspired against him because of the blood of the sons of Jehoiada the priest[a], and they killed him on his bed, and he died. They buried him in the city of David, but they did not bury him in the tombs of the kings.
translation:
  language: te
  text: వారు అతని దగ్గరనుంచి వెళ్లిపోయినప్పుడు—వారు అతన్ని అనేక రోగాలతో విడిచిపెట్టారు—యెహోయాదా యాజకుని కుమారుల రక్తం కారణంగా[a] అతని సేవకులు అతనికి వ్యతిరేకంగా కుట్ర పన్ని, అతని మంచం మీద అతన్ని చంపారు; అతడు చనిపోయాడు. వారు అతన్ని దావీదు పట్టణంలో పాతిపెట్టారు, కాని రాజుల సమాధుల్లో పాతిపెట్టలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “యెహోయాదా యాజకుని కుమారుల రక్తం.” సందర్భాన్ని బట్టి ఇది ప్రత్యేకంగా “యెహోయాదా కుమారుని,” అంటే జెకర్యాను (24:20–22) సూచిస్తూ ఉండవచ్చు.'
    reason: మూలపాఠంలోని బహువచనానికి, సమీప సందర్భం సూచించే ఏకవచనానికి మధ్యనున్న భేదాన్ని సంరక్షించడం.
lexical_decisions:
- source_word: וּבְלֶכְתָּם מִמֶּנּוּ
  choice: వారు అతని దగ్గరనుంచి వెళ్లిపోయినప్పుడు
  rationale: בְּ + క్రియానామ రూపం కాలార్థాన్ని ఇస్తుంది; מִמֶּנּוּ యోవాషు దగ్గరనుంచి వారు తొలగిపోయారని సూచిస్తుంది.
- source_word: כִּי עָזְבוּ אֹתוֹ בְּמַחֳלָיִם רַבִּים
  choice: వారు అతన్ని అనేక రోగాలతో విడిచిపెట్టారు
  rationale: כִּי ఇక్కడ వివరణాత్మక/కారణ భావాన్ని ఇస్తుంది. מַחֳלָיִם బహువచనాన్ని ‘అనేక రోగాలు’గా నిలుపుతూ మూలపాఠంలోని భావాన్ని అనవసరంగా ‘గాయాలు’గా మార్చలేదు.
- source_word: הִתְקַשְּׁרוּ עָלָיו עֲבָדָיו
  choice: అతని సేవకులు అతనికి వ్యతిరేకంగా కుట్రపన్ని
  rationale: קשר హిత్పయేల్ రాజదర్బారు సందర్భంలో కలిసి కుట్ర చేయడాన్ని సూచిస్తుంది; עֲבָדָיו యొక్క ప్రత్యక్ష అర్థాన్ని ‘అతని సేవకులు’గా ఉంచాం.
- source_word: בִּדְמֵי בְּנֵי יְהוֹיָדָע הַכֹּהֵן
  choice: యెహోయాదా యాజకుని కుమారుల రక్తం కారణంగా
  rationale: בְּ కారణార్థకంగా ఉంది; דְּמֵי ‘రక్తం/రక్తపాతం’ భావాన్ని కలిగి ఉంది. బహువచనమైన בְּנֵי ని ప్రధాన పాఠంలో యథాతథంగా నిలిపాం.
- source_word: וַיַּהַרְגֻהוּ עַל מִטָּתוֹ וַיָּמֹת
  choice: అతని మంచం మీదనే అతన్ని చంపారు; అతడు చనిపోయాడు
  rationale: הרג యొక్క సాధారణ అర్థం ‘చంపు’; עַל־מִטָּתוֹ ను సహజమైన తెలుగులో స్పష్టంగా ఇచ్చాం. וַיָּמֹת అనే ప్రత్యేక కథన వాక్యాన్ని కూడా నిలిపాం.
- source_word: וַיִּקְבְּרֻהוּ בְּעִיר דָּוִיד וְלֹא קְבָרֻהוּ בְּקִבְרוֹת הַמְּלָכִים
  choice: వారు అతన్ని దావీదు పట్టణంలో పాతిపెట్టారు, కాని రాజుల సమాధుల్లో పాతిపెట్టలేదు
  rationale: దావీదు పట్టణంలో అంత్యక్రియ జరిగినా రాజుల సమాధుల్లో స్థానం ఇవ్వలేదనే వ్యత్యాసం ‘కాని’ ద్వారా సహజంగా వ్యక్తమవుతుంది.
theological_decisions:
- issue: మసొరెటిక్ పాఠంలోని ‘యెహోయాదా కుమారులు’ అనే బహువచనం, 24:20–22 సందర్భంలోని ‘యెహోయాదా కుమారుడు జెకర్యా’ అనే ఏకవచన నిరీక్షణకు భిన్నంగా ఉండటం
  choice: ప్రధాన పాఠంలో ‘యెహోయాదా యాజకుని కుమారుల రక్తం’ అనే మూలపాఠ బహువచనాన్ని నిలిపాం.
  alternative: ‘యెహోయాదా యాజకుని కుమారుని రక్తం,’ అంటే జెకర్యా రక్తం
  rationale: అందించిన హీబ్రూ మూలపాఠం స్పష్టంగా బహువచనాన్ని కలిగి ఉంది. సందర్భం ఏకవచనాన్ని సూచించే అవకాశం ఉన్నప్పటికీ, ఆ ఉద్రిక్తతను మౌనంగా సమన్వయపరచకుండా పాదసూచికలో వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘రోగాలు,’ ‘కుట్రపన్ని,’ ‘సమాధులు’ వంటి సాధారణంగా అర్థమయ్యే పదాలను ఎంచుకున్నాం; మూలపాఠంలోని పునరుక్తి మరియు బహువచన ఉద్రిక్తతను సాధ్యమైనంతవరకు నిలిపాం.
