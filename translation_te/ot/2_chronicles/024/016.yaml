source:
  edition: WLC
  text: וַ/יִּקְבְּרֻ֥/הוּ בְ/עִיר דָּוִ֖יד עִם הַ/מְּלָכִ֑ים כִּֽי עָשָׂ֤ה טוֹבָה֙ בְּ/יִשְׂרָאֵ֔ל וְ/עִ֥ם הָ/אֱלֹהִ֖ים וּ/בֵיתֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/016.yaml
  text: And they buried him in the city of David among the kings[a], because he had done good in Israel[b], and toward God and his house.
translation:
  language: te
  text: అతడు ఇశ్రాయేలులోను[b] దేవుని పట్లను ఆయన మందిరం పట్లను మేలు చేశాడు కాబట్టి, వారు అతణ్ణి దావీదు నగరంలో రాజుల మధ్య[a] పాతిపెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజులతో పాటు.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘ఆయన మందిరం’ అంటే దేవుని మందిరమైన ఆలయం.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקְבְּרֻהוּ
  choice: వారు అతణ్ణి పాతిపెట్టారు
  rationale: క్రియ బహువచన కర్తతో, మూడవ పురుష ఏకవచన పుంలింగ కర్మ ప్రత్యయంతో ఉంది; అందువల్ల హెబ్రీలో పేర్కొనని బహువచన కర్తను అలాగే ఉంచే క్రియాశీల రూపం సరైనది.
- source_word: בְעִיר דָּוִיד
  choice: దావీదు నగరంలో
  rationale: ఇది స్థిరమైన స్థలనామ వ్యక్తీకరణ; ఆధునిక తెలుగులో సహజంగానూ మూలానికి దగ్గరగానూ ఉంటుంది.
- source_word: עִם הַמְּלָכִים
  choice: రాజుల మధ్య
  rationale: עִם అక్షరార్థంగా ‘తో’ అయినా, సమాధి సందర్భంలో రాజుల సమాధుల మధ్య లేదా వారి సరసన గౌరవప్రదంగా పాతిపెట్టారనే భావాన్ని ‘మధ్య’ సహజంగా తెలియజేస్తుంది.
- source_word: כִּי
  choice: కాబట్టి
  rationale: ఈ సంధిపదం అతనికి లభించిన గౌరవప్రదమైన సమాధికి కారణాన్ని తెలియజేస్తుంది; తెలుగు వాక్యక్రమంలో కారణాన్ని ముందుంచి ‘కాబట్టి’ అనడం సహజం.
- source_word: עָשָׂה טוֹבָה
  choice: మేలు చేశాడు
  rationale: ఈ పదబంధం మంచి లేదా ప్రయోజనకరమైన కార్యాలు చేయడాన్ని సూచిస్తుంది; ‘మేలు చేశాడు’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో
  rationale: 'בְ ను ప్రధానంగా స్థల లేదా పరిధి సూచకంగా నిలుపుతుంది: అతడు చేసిన మేలు ఇశ్రాయేలు పరిధిలో జరిగింది.'
- source_word: וְעִם הָאֱלֹהִים
  choice: దేవుని విషయంలో
  rationale: అక్షరార్థమైన ‘దేవునితో’ తెలుగులో సహచర్యాన్ని సూచించే అవకాశం ఉంది. సందర్భంలో దేవునికి సంబంధించిన అతని మంచి సేవను సూచించేందుకు ‘దేవుని విషయంలో’ అనేది దిశాత్మక భావాన్ని అతిగా వ్యాఖ్యానించకుండా ఇస్తుంది.
- source_word: וּבֵיתוֹ
  choice: ఆయన మందిరం విషయంలో
  rationale: ప్రత్యయం సమీపంలోని ‘దేవుడు’ను సూచిస్తుంది; సందర్భం దేవుని గృహమైన ఆలయాన్ని గురించినది. తెలుగులో ‘ఆయన మందిరం’ సర్వనామ సంబంధాన్ని ఉంచుతూ ఉద్దేశాన్ని స్పష్టపరుస్తుంది.
theological_decisions:
- issue: וּבֵיתוֹ లోని ‘అతని/ఆయన’ అనే ప్రత్యయం ఎవరిని సూచిస్తుంది?
  choice: దేవుని మందిరాన్ని సూచిస్తుంది
  alternative: యెహోయాదా సొంత ఇంటివారిని లేదా గృహాన్ని సూచిస్తుంది
  rationale: తక్షణ పూర్వపదం ‘దేవుడు’; అంతేకాక, విస్తృత సందర్భం యెహోయాదా దేవాలయానికి చేసిన సేవపై కేంద్రీకృతమై ఉంది. కాబట్టి దేవుని మందిరం అనే పఠనం వ్యాకరణానికీ కథన సందర్భానికీ బాగా సరిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి. హెబ్రీ కారణ వాక్యాన్ని తెలుగులో సహజంగా ఉండేందుకు ప్రధాన వాక్యానికి ముందు ఉంచాం. ‘పాతిపెట్టారు’ సాధారణ ఆధునిక పదం; ‘సమాధి చేశారు’ కంటే మూల క్రియకు నేరుగా సరిపోతుంది.
