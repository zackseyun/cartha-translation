id: 2CH.24.10
reference: 2 Chronicles 24:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׂמְח֥וּ כָל הַ/שָּׂרִ֖ים וְ/כָל הָ/עָ֑ם וַ/יָּבִ֛יאוּ וַ/יַּשְׁלִ֥יכוּ לָ/אָר֖וֹן עַד לְ/כַלֵּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/010.yaml
  text: Then all the officials and all the people rejoiced[a], and they brought their contributions and threw them into the chest until it was full.
translation:
  language: te
  text: అప్పుడు అధికారులందరూ, ప్రజలందరూ సంతోషించారు. వారు తమ కానుకలను తీసుకొచ్చి, ముగిసేవరకు పెట్టెలో వేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పూర్తయ్యేవరకు.’ హెబ్రీ పదబంధం సాధారణంగా ముగింపు లేదా పూర్తి కావడాన్ని సూచిస్తుంది. సందర్భాన్ని బట్టి ‘పెట్టె నిండేవరకు’ అనే భావమని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: సంతోషించారు
  rationale: שׂמח వ్యక్తపరిచే సంతోషం లేదా ఆనందాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כָל הַשָּׂרִים
  choice: అధికారులందరూ
  rationale: שׂרים ఇక్కడ రాజకుమారులను తప్పనిసరిగా సూచించదు; పాలనా బాధ్యతగల అధికారులను సూచించే సందర్భోచిత పదం.
- source_word: וְכָל הָעָם
  choice: ప్రజలందరూ
  rationale: హెబ్రీ సమూహవాచక భావాన్నీ, כָל ఇచ్చే సంపూర్ణ పరిధినీ కాపాడుతుంది.
- source_word: וַיָּבִיאוּ
  choice: వారు తమ కానుకలను తీసుకొచ్చి
  rationale: మూలంలో కర్మ ప్రత్యక్షంగా లేకపోయినా, ఆలయ మరమ్మతుల కోసం జరుగుతున్న సేకరణ సందర్భం దానిని స్పష్టం చేస్తుంది; తెలుగులో వాక్యం సహజంగా ఉండేందుకు ‘తమ కానుకలను’ సందర్భానుసారంగా పూరించబడింది.
- source_word: וַיַּשְׁלִיכוּ
  choice: వేశారు
  rationale: שׁלך కు ‘విసిరారు’ అనే బలమైన అర్థం ఉన్నప్పటికీ, డబ్బును సేకరణ పెట్టెలో జమచేసే సందర్భంలో ‘పెట్టెలో వేశారు’ సహజంగా ఉండి మూల చర్యను సరిగ్గా తెలియజేస్తుంది.
- source_word: לָאָרוֹן
  choice: పెట్టెలో
  rationale: אָרוֹן సందర్భాన్ని బట్టి పెట్టె, మందసం లేదా నిబంధన మందసం కావచ్చు; ఇక్కడ కానుకల సేకరణ పాత్ర కాబట్టి ‘పెట్టె’ స్పష్టమైన ఎంపిక.
- source_word: עַד לְכַלֵּה
  choice: అంతా పూర్తయ్యేవరకు
  rationale: כלה రూపం ముగింపు లేదా పూర్తి కావడాన్ని సూచిస్తుంది; వ్యాకరణపరంగా పెట్టె నిండిందని స్పష్టంగా చెప్పదు. ‘అంతా పూర్తయ్యేవరకు’ మూలంలోని కొంత అస్పష్టతను నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలో ప్రత్యక్ష కర్మ లేకపోవడాన్ని సందర్భానుసారంగా ‘తమ కానుకలను’ అని పూరించగా, చివరి పదబంధంలోని అస్పష్టతను ప్రధాన పాఠ్యం మరియు పాదసూచిక ద్వారా నిలిపాం.
