base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/006.yaml
  text: Then the king called Jehoiada the chief and said to him, “Why have you not required the Levites to bring from Judah and from Jerusalem the tax of Moses the servant of the LORD and of the assembly of Israel for the tent of the testimony?”
translation:
  language: te
  text: 'అప్పుడు రాజు ప్రధానుడైన యెహోయాదాను పిలిపించి, అతనితో ఇలా అన్నాడు: “యెహోవా సేవకుడైన మోషే ఇశ్రాయేలు సమాజంపై సాక్ష్యపు గుడారం కోసం విధించిన పన్నును యూదా నుండీ యెరూషలేము నుండీ తీసుకురావాలని నీవు లేవీయులను ఎందుకు ఆదేశించలేదు?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: ప్రధానుడైన
  rationale: The Hebrew says “the chief/head” without explicitly adding “priest”; this preserves the source wording and avoids supplying an implied office.
- source_word: דָרַשְׁתָּ עַל הַלְוִיִּם
  choice: లేవీయులను ... ఆదేశించలేదు
  rationale: In this construction the verb means to require or demand something of the Levites; “ఆదేశించలేదు” expresses that naturally in modern Telugu.
- source_word: מַשְׂאַת
  choice: పన్నును
  rationale: Here the noun denotes the required contribution or levy associated with Moses and the assembly; “పన్ను” matches the audited consultation rendering and fits the collection context.
- source_word: אֹהֶל הָעֵדוּת
  choice: సాక్ష్యపు గుడారం
  rationale: A direct, established rendering of “tent of the testimony,” retaining the Hebrew cultic terminology.
- source_word: יהוה
  choice: యెహోవా
  rationale: The source contains the divine personal name YHWH; “యెహోవా” transparently represents it in familiar Telugu biblical usage rather than replacing it with a title.
theological_decisions:
- issue: Jehoiada’s title
  choice: ప్రధానుడైన యెహోయాదా
  alternative: ప్రధాన యాజకుడైన యెహోయాదా
  rationale: Although context may identify Jehoiada as the chief priest, the verse itself has only “the chief/head.” The translation does not add “priest.”
- issue: Relation of Moses and the assembly to the tax
  choice: మోషేకు, ఇశ్రాయేలు సమాజానికి సంబంధించిన పన్ను
  alternative: మోషే, ఇశ్రాయేలు సమాజం విధించిన పన్ను
  rationale: The Hebrew genitive relationship is compact and does not explicitly say “imposed.” Rendering it as “associated with/belonging to” preserves that ambiguity rather than defining the precise agency.
translation_notes:
  register: Modern standard Telugu with dignified but accessible syntax. The question is recast naturally in Telugu while retaining the source locations, agents, purpose, and unresolved genitive relationship.
