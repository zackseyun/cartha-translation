  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֖י אַחֲרֵי כֵ֑ן הָיָה֙ עִם לֵ֣ב יוֹאָ֔שׁ לְ/חַדֵּ֖שׁ אֶת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/004.yaml
  text: After this[b][a], it was in the heart of Joash to restore the house of Yahweh.
translation:
  language: te
  text: ఆ తర్వాత యోవాషు హృదయంలో యాహ్వే మందిరాన్ని పునరుద్ధరించాలనే ఆలోచన కలిగింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యాహ్వే ఇంటిని కొత్తగా చేయాలని”; “పునర్నవీకరించాలని” లేదా “మరమ్మతు చేయాలని” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: ఆ తర్వాత
  rationale: కథనంలో తదుపరి దశను సూచించే కాలక్రమ సంధిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; హీబ్రూ ప్రారంభ క్రియను పదక్షరంగా అనువదించడం తెలుగు వాక్యానికి కృత్రిమతను కలిగిస్తుంది.
- source_word: הָיָה עִם לֵב יוֹאָשׁ
  choice: యోవాషు హృదయంలో అనుకున్నాడు
  rationale: యోవాషు అంతరంగ ఉద్దేశాన్ని తెలిపే హీబ్రూ హృదయ రూపకాన్ని నిలుపుతూ, అతడు అప్పటికే దృఢనిశ్చయం చేసుకున్నాడనే అధిక భావాన్ని చేర్చకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לְחַדֵּשׁ
  choice: పునరుద్ధరించాలని
  rationale: ఉన్న కట్టడాన్ని మళ్లీ మంచి స్థితికి తీసుకురావడం అనే ‘కొత్తగా చేయు/నవీకరించు’ భావాన్ని సందర్భానుగుణంగా అందిస్తుంది; కేవలం చిన్న మరమ్మతులకే పరిమితం చేయదు.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరాన్ని
  rationale: అక్షరార్థం ‘యెహోవా ఇల్లు’ అయినా, ఈ సందర్భంలో దేవాలయాన్నే సూచిస్తుంది. సాధారణ తెలుగు పాఠకునికి ‘మందిరం’ స్పష్టంగా, సహజంగా ఉంటుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన లిప్యంతరీకరణతో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో బిరుదు కాకుండా చతురక్షర దైవనామమే ఉంది. కాబట్టి వ్యక్తిగత నామాన్ని తెలుగు లిప్యంతరీకరణలో నిలిపాం.
- issue: యోవాషు అంతరంగ ఉద్దేశం యొక్క బలం
  choice: హృదయంలో అనుకున్నాడు
  alternative: దృఢంగా నిశ్చయించుకున్నాడు
  rationale: హీబ్రూ అంతరంగ సంకల్పం లేదా ఉద్దేశాన్ని సూచిస్తుంది గాని, తప్పనిసరిగా అత్యంత బలమైన ప్రతిజ్ఞను సూచించదు; అందువల్ల ఆ ఉద్వేగాన్ని అదనంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకునికి సహజంగా ఉండే గౌరవప్రదమైన కథన శైలి. ‘హృదయం’ అనే మూల రూపకాన్ని నిలిపి, ‘ఇల్లు’ అనే పదాన్ని సందర్భస్పష్టత కోసం ‘మందిరం’గా అనువదించాం.
