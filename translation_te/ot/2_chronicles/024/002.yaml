source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ יוֹאָ֛שׁ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כָּל יְמֵ֖י יְהוֹיָדָ֥ע הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/002.yaml
  text: Joash did what was right in the eyes of Yahweh all the days of Jehoiada the priest.
translation:
  language: te
  text: యాజకుడైన యెహోయాదా కాలమంతా యోవాషు యాహ్వే దృష్టిలో సరైనది చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేశాడు
  rationale: עשה అనే క్రియకు ‘చేయు’ అనే సాధారణ అర్థం ఉంది; הַיָּשָׁרతో కలిసి వచ్చినప్పుడు ‘సరైనదే చేశాడు’ అనేది సహజమైన తెలుగు ప్రయోగం.
- source_word: הַיָּשָׁר
  choice: సరైనదే
  rationale: יָשָׁרకు ‘నేరుగా ఉన్నది, సరైనది, యథార్థమైనది’ అనే అర్థాలు ఉన్నాయి. రాజును నైతికంగా అంచనా వేసే ఈ సూత్రవాక్యంలో ‘సరైనది’ స్పష్టంగా, సహజంగా ఉంటుంది; ‘ఏ’ నిశ్చయార్థకం మూలంలోని నిర్దిష్ట భావాన్ని తెలుపుతుంది.
- source_word: בְּעֵינֵי
  choice: దృష్టిలో
  rationale: అక్షరార్థంగా ‘కళ్లలో’ అయిన ఈ హీబ్రూ నానుడి, ఒకరి అంచనా లేదా దృక్కోణాన్ని సూచిస్తుంది. ‘దృష్టిలో’ రూపక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: ఇది ఇశ్రాయేలు దేవుని వ్యక్తిగత నామమైన చతురక్షర నామం; బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ‘యాహ్వే’గా లిప్యంతరీకరించబడింది.
- source_word: כָּל יְמֵי
  choice: కాలమంతా
  rationale: అక్షరార్థంగా ‘రోజులన్నీ’ అనే ఈ కాలవ్యాప్తి ప్రయోగాన్ని ఆధునిక తెలుగులో సహజంగా ‘కాలమంతా’ అని తెలిపాం.
- source_word: יְהוֹיָדָע
  choice: యెహోయాదా
  rationale: హీబ్రూ వ్యక్తినామాన్ని ప్రామాణిక తెలుగు బైబిలు నామరూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: הַכֹּהֵן
  choice: యాజకుడైన
  rationale: ఈ పదం యెహోయాదా పదవిని అనుబంధంగా గుర్తిస్తుంది; తెలుగులో పేరుకు ముందు ‘యాజకుడైన’ అని ఉంచడం సహజం.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాకుండా చతురక్షర దైవనామమే ఉంది. అందువల్ల దాన్ని ‘ప్రభువు’గా మార్చకుండా, హీబ్రూ నామోచ్చారణకు దగ్గరైన ‘యాహ్వే’గా ఇచ్చాం.
- issue: యోవాషు సరిగ్గా ప్రవర్తించిన కాలపరిమితి
  choice: యాజకుడైన యెహోయాదా కాలమంతా
  alternative: యెహోయాదా జీవించినంతకాలం
  rationale: మూలంలోని כָּל־יְמֵי יְהוֹיָדָע కాలవ్యాప్తిని మాత్రమే నేరుగా చెబుతుంది. ‘జీవించినంతకాలం’ సందర్భానుకూలమైన భావమైనా, మూలంలో లేని ‘జీవించడం’ అనే క్రియను చేర్చకుండా కాలసూచనను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, గంభీరంగా ఉండే వాక్యనిర్మాణం వాడబడింది. హీబ్రూ రాజమూల్యాంకన సూత్రంలోని ‘యాహ్వే దృష్టిలో సరైనది చేయడం’ అనే భావం అలాగే నిలుపబడింది.
