source:
  edition: WLC
  text: כִּ֤י עֲתַלְיָ֨הוּ֙ הַ/מִּרְשַׁ֔עַת בָּנֶ֥י/הָ פָרְצ֖וּ אֶת בֵּ֣ית הָ/אֱלֹהִ֑ים וְ/גַם֙ כָּל קָדְשֵׁ֣י בֵית יְהוָ֔ה עָשׂ֖וּ לַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/007.yaml
  text: For Athaliah[a], that wicked woman, and her sons had broken into the house of God and had also made all the holy things of the house of Yahweh for the Baals.
translation:
  language: te
  text: ఎందుకంటే ఆ దుష్టురాలైన అతల్యా కుమారులు దేవుని మందిరాన్ని పగులగొట్టి లోపలికి చొరబడ్డారు; యెహోవా మందిరంలోని పవిత్ర వస్తువులన్నిటినీ బయలుల కోసం ఉపయోగించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “బయలుల కోసం చేశారు.” ఇక్కడి హీబ్రూ క్రియను “చేశారు” అని కూడా అనువదించవచ్చు; సందర్భంలో, యెహోవా మందిరంలోని పవిత్ర వస్తువులను బయలు ఆరాధన కోసం మళ్లించి ఉపయోగించారని భావం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి సందర్భంలో చెప్పిన చర్యకు కారణాన్ని పరిచయం చేసే వివరణాత్మక సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עֲתַלְיָהוּ הַמִּרְשַׁעַת
  choice: ఆ దుష్టురాలైన అతల్యా
  rationale: స్త్రీలింగ దుష్టత్వ సూచనను స్పష్టంగా ఉంచుతూ, పేరుతో ఉన్న apposition‌ను సహజమైన తెలుగు విశేషణ నిర్మాణంగా అందిస్తుంది.
- source_word: בָּנֶיהָ
  choice: కుమారులు
  rationale: హీబ్రూ పదంలోని పుంలింగ బహువచన అర్థాన్ని ఖచ్చితంగా కాపాడుతుంది.
- source_word: פָרְצוּ אֶת־בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరాన్ని ధ్వంసం చేశారు
  rationale: פרץ ఇక్కడ మందిరంపై హింసాత్మక దాడి చేసి దానిని పాడుచేయడం/కొల్లగొట్టడం అనే సందర్భార్థాన్ని ఇస్తుంది; కేవలం లోపలికి చొరబడడమే అని సంకుచితం చేయదు.
- source_word: כָּל־קָדְשֵׁי בֵית יְהוָה
  choice: యెహోవా మందిరంలోని ప్రతిష్ఠిత వస్తువులన్నిటినీ
  rationale: קָדְשֵׁי అనేది మందిర సేవకు ప్రత్యేకంగా ప్రతిష్ఠించిన పవిత్ర వస్తువులను సూచిస్తుంది; 'ప్రతిష్ఠిత వస్తువులు' ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో ఉంచుతుంది.
- source_word: עָשׂוּ לַבְּעָלִים
  choice: బయలుల కోసం ఉపయోగించారు
  rationale: עָשׂוּ యొక్క మౌలిక అర్థం 'చేశారు/తయారు చేశారు' అయినా, ఇప్పటికే యెహోవా మందిరానికి చెందిన ప్రతిష్ఠిత వస్తువుల సందర్భంలో వాటిని బయలు ఆరాధనకు మళ్లించి ఉపయోగించారనే భావం సహజంగా సరిపోతుంది; పాదటిప్పణి అక్షరార్థ ప్రత్యామ్నాయాన్ని కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగా నిలుపుతుంది.
- issue: בְּעָלִים యొక్క బహువచనం
  choice: బయలులు
  alternative: బయలు
  rationale: మూల హీబ్రూలోని బహువచనాన్ని కాపాడి, అనేక బయలు రూపాలు, విగ్రహాలు లేదా ఆరాధనా సంప్రదాయాలను సూచించే అవకాశాన్ని తెరిచి ఉంచుతుంది.
- issue: עָשׂוּ לַבְּעָלִים యొక్క సందర్భార్థం
  choice: బయలుల కోసం ఉపయోగించారు
  alternative: బయలుల కోసం చేశారు
  rationale: దేవాలయపు ప్రతిష్ఠిత వస్తువులు ముందే ఉనికిలో ఉన్నందున వాటిని విగ్రహారాధనకు వినియోగించారనే సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో ఇస్తుంది; అయితే క్రియలోని నిజమైన పదార్థ అస్పష్టతను పాదటిప్పణిలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. 'దేవుని మందిరం' అనే సహజ ప్రయోగాన్ని వాడుతూ, 'యెహోవా' దైవనామాన్ని మరియు 'బయలులు' అనే మూల బహువచనాన్ని కాపాడింది.
