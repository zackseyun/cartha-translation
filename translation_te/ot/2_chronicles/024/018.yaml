id: 2CH.24.18
reference: 2 Chronicles 24:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּֽעַזְב֗וּ אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֔ם וַ/יַּֽעַבְד֥וּ אֶת הָ/אֲשֵׁרִ֖ים וְ/אֶת הָֽ/עֲצַבִּ֑ים וַֽ/יְהִי קֶ֗צֶף עַל יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם בְּ/אַשְׁמָתָ֖/ם זֹֽאת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/018.yaml
  text: And they abandoned the house of Yahweh[a], the God of their fathers, and served the Asherim and the idols. So wrath came upon Judah and Jerusalem because of this guilt of theirs.
translation:
  language: te
  text: వారు తమ పితరుల దేవుడైన యహ్వే మందిరాన్ని విడిచిపెట్టి, అషేరీమ్‌కూ[a] విగ్రహాలకూ సేవ చేశారు. వారి ఈ అపరాధం కారణంగా యూదా మీదా యెరూషలేము మీదా ఆగ్రహం వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అషేరా స్తంభాలు.’ ఈ హెబ్రీ పదం అషేరాకు సంబంధించిన ఆరాధనా వస్తువులను సూచిస్తుంది; అషేరా దేవతతో సంబంధాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: విడిచిపెట్టి
  rationale: עזב అంటే విడిచిపెట్టడం లేదా త్యజించడం. ‘విడిచిపెట్టి’ అనేది సహజమైన ఆధునిక తెలుగు; సందర్భంలో నిబంధనపరమైన అవిశ్వాస భావాన్ని కూడా తెలియజేస్తుంది.
- source_word: בֵּית יְהוָה
  choice: యహ్వే మందిరం
  rationale: హెబ్రీలో అక్షరార్థంగా ‘యహ్వే ఇల్లు.’ ఇక్కడ దేవాలయమే ఉద్దేశం కాబట్టి ‘మందిరం’ సాధారణ పాఠకునికి సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామంలోని హెబ్రీ వ్యంజనాలకు సాధారణంగా పునర్నిర్మించే ఉచ్చారణను తెలుగులో నేరుగా సూచిస్తుంది.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: తమ పితరుల దేవుడు
  rationale: కుటుంబపరమైన, నిబంధనపరమైన భావాలను నిలుపుతూ హెబ్రీ పదబంధాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וַיַּעַבְדוּ
  choice: సేవించారు
  rationale: עבד అనే పదానికి ‘సేవ చేయడం’ అనే ప్రాథమిక భావం ఉంది; ఇక్కడ పేర్కొన్న ఆరాధనా వస్తువుల వల్ల దాని మతపరమైన భావం స్పష్టమవుతుంది.
- source_word: הָאֲשֵׁרִים
  choice: అషేరీమ్
  rationale: ఈ బహువచన పదం అషేరాకు సంబంధించిన ఆరాధనా వస్తువులను సూచించవచ్చు; దేవతతో ఉన్న సంబంధాన్ని కూడా ధ్వనింపజేయవచ్చు. లిప్యంతరీకరణ ఈ సందిగ్ధతను నిలుపుతుంది.
- source_word: הָעֲצַבִּים
  choice: విగ్రహాలు
  rationale: ఈ పదం ఆరాధనా ప్రతిమలను ప్రతికూల భావంతో సూచిస్తుంది; ‘విగ్రహాలు’ దాని మతపరమైన, విమర్శాత్మక బలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיְהִי קֶצֶף
  choice: ఆగ్రహం వచ్చింది
  rationale: హెబ్రీలోని సంక్షిప్త ఫలిత వాక్యాన్ని సహజమైన తెలుగులో ఉంచుతూ ఆగ్రహానికి మూలం ఎవరో వచనంలో లేనందున ప్రత్యేకంగా చేర్చదు.
- source_word: עַל יְהוּדָה וִירוּשָׁלִַם
  choice: యూదా మీద, యెరూషలేము మీద
  rationale: తీర్పురూపమైన ఆగ్రహం వారిపైకి వచ్చిందనే עַל భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בְּאַשְׁמָתָם זֹאת
  choice: వారి ఈ అపరాధం కారణంగా
  rationale: אַשְׁמָהలోని దోషం లేదా అపరాధ భావాన్ని, בְּ యొక్క కారణార్థాన్ని, זֹאת యొక్క సూచనను స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘ఆగ్రహం’ ఎవరిది?
  choice: దైవిక ఆగ్రహంగా సందర్భం ద్వారా అర్థమయ్యేలా ఉంచి, ప్రధాన పాఠ్యంలో ‘దేవుని’ లేదా ‘యహ్వే ఆగ్రహం’ అని చేర్చలేదు.
  alternative: ‘దేవుని ఆగ్రహం వచ్చింది’ లేదా ‘యహ్వే ఆగ్రహం వచ్చింది.’
  rationale: సందర్భంలో ఇది యహ్వే తీర్పని స్పష్టమే అయినా, హెబ్రీ పాఠ్యం కేవలం ‘ఆగ్రహం వచ్చింది’ అంటుంది. మూలంలో లేని పదాన్ని చేర్చకుండా ఆ అంతర్నిహిత భావాన్ని నిలిపాం.
- issue: אֲשֵׁרִים పదానికి సూచన
  choice: ప్రధాన పాఠ్యంలో హెబ్రీ ఆధారిత ‘అషేరీమ్’ అనే రూపాన్ని ఉంచాం.
  alternative: ‘అషేరా స్తంభాలు’ లేదా ‘అషేరా ప్రతిమలు.’
  rationale: ఈ పదం అషేరా దేవతకు సంబంధించిన ఆరాధనా వస్తువులను సూచిస్తుంది; అవి ప్రత్యేకంగా స్తంభాలేనా అనే విషయాన్ని ప్రధాన పాఠ్యంలో నిర్ణయించకుండా, సాధారణ వివరణను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలిని ఉపయోగించాం. ‘అషేరీమ్’ అనే అపరిచిత సాంస్కృతిక పదాన్ని సందిగ్ధత కోసం నిలిపి, పాదసూచికలో సంక్షిప్తంగా వివరించాం.
