source:
  edition: WLC
  text: וְ/אַֽחֲרֵ֥י מוֹת֙ יְה֣וֹיָדָ֔ע בָּ֚אוּ שָׂרֵ֣י יְהוּדָ֔ה וַ/יִּֽשְׁתַּחֲו֖וּ לַ/מֶּ֑לֶךְ אָ֛ז שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֲלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/017.yaml
  text: After the death of Jehoiada[a], the officials of Judah came and bowed down to the king[b]. Then the king listened to them.
translation:
  language: te
  text: యెహోయాదా మరణించిన తరువాత, యూదా అధికారులు[a] వచ్చి రాజు ఎదుట సాగిలపడ్డారు. అప్పుడు రాజు వారి మాట విన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యూదా అధిపతులు,” “యూదా నాయకులు,” లేదా “యూదా రాజకుమారులు.”
    reason: lexical_alternative
  - marker: b
    text: “వారి మాట విన్నాడు” అనే మాటకు “వారి మాటకు చెవియొగ్గాడు” లేదా “వారి మాటకు సమ్మతించాడు” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי מוֹת יְהוֹיָדָע
  choice: యెహోయాదా మరణించిన తరువాత
  rationale: కాలక్రమాన్ని సహజమైన ఆధునిక తెలుగు వాక్యరూపంలో తెలియజేస్తుంది; ఆరంభ సంధికారకమైన וְ ను విడిగా అనువదించకపోయినా భావం నిలుస్తుంది.
- source_word: שָׂרֵי יְהוּדָה
  choice: యూదా అధికారులు
  rationale: שָׂרִים పాలనా హోదా గల ప్రముఖులను సూచిస్తుంది. ‘అధికారులు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి, ‘రాజకుమారులు’ అనే వంశపారంపర్య భావాన్ని అనవసరంగా నిర్దేశించదు.
- source_word: בָּאוּ
  choice: వచ్చి
  rationale: సాధారణ గమన క్రియను తెలుగులో తరువాతి క్రియతో సహజంగా అనుసంధానిస్తుంది.
- source_word: וַיִּשְׁתַּחֲווּ לַמֶּלֶךְ
  choice: రాజు ఎదుట సాగిలపడ్డారు
  rationale: రాజు ముందు శరీరాన్ని వంచి గౌరవం చూపిన చర్యను వ్యక్తం చేస్తుంది; దానిని ఆరాధనగా లేదా రాజకీయ కపటంగా ముందే వ్యాఖ్యానించదు.
- source_word: אָז
  choice: అప్పుడు
  rationale: తదుపరి పరిణామాన్ని సూచించే సహజమైన కాలసూచకం.
- source_word: שָׁמַע הַמֶּלֶךְ אֲלֵיהֶם
  choice: రాజు వారి మాట విన్నాడు
  rationale: שׁמע אל అనే ప్రయోగంలోని ‘వినడం/చెవియొగ్గడం’ భావాన్ని నిలుపుతుంది. సందర్భంలో అంగీకరించడం అనే బలమైన భావం ఉండవచ్చని పాదసూచికలో సూచించబడింది.
theological_decisions:
- issue: అధికారులు రాజు ఎదుట చేసిన చర్య స్వభావం
  choice: సాగిలపడ్డారు
  alternative: నమస్కరించారు; సాష్టాంగపడ్డారు; గౌరవం అర్పించారు
  rationale: హీబ్రూ క్రియ శారీరకంగా వంగడం లేదా నేలవాలడం నుండి ఆరాధన వరకు సందర్భానుసారం విస్తరించగలదు. ఇక్కడ కర్మ మానవ రాజు కావడంతో ‘ఆరాధించారు’ అని అనువదించడం అతివ్యాఖ్యానం అవుతుంది; ‘సాగిలపడ్డారు’ చర్యను చూపుతూ ఉద్దేశాన్ని తెరిచి ఉంచుతుంది.
- issue: రాజు వారి మాట వినడంలోని బలం
  choice: వారి మాట విన్నాడు
  alternative: వారి మాటకు చెవియొగ్గాడు; వారి మాట ప్రకారం చేశాడు
  rationale: ఈ హీబ్రూ ప్రయోగం కేవలం వినడమే కాక సమ్మతించడం లేదా అనుసరించడం అనే భావాన్ని కలిగి ఉండవచ్చు. ప్రధాన పాఠం ఆ ద్వంద్వార్థాన్ని అతిగా పరిష్కరించకుండా ఉంచి, పాదసూచిక దాని బలమైన సాధ్యతను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘సాగిలపడ్డారు’ శారీరక చర్యను స్పష్టంగా చూపుతూ ఆరాధన అనే ప్రత్యేక మతపరమైన అర్థాన్ని రుద్దదు. పాదసూచిక గుర్తులను అవి వివరించే పదబంధాల వెంట ఉంచాం.
