source:
  edition: WLC
  text: וַֽ/יַּעֲשׂוּ֙ עֹשֵׂ֣י הַ/מְּלָאכָ֔ה וַ/תַּ֧עַל אֲרוּכָ֛ה לַ/מְּלָאכָ֖ה בְּ/יָדָ֑/ם וַֽ/יַּעֲמִ֜ידוּ אֶת בֵּ֧ית הָֽ/אֱלֹהִ֛ים עַל מַתְכֻּנְתּ֖/וֹ וַֽ/יְאַמְּצֻֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/013.yaml
  text: So the workmen labored[a], and the repair work progressed by their hand[b]; they restored the house of God to its proper condition and strengthened it.
translation:
  language: te
  text: పనివారు పని చేశారు; వారి చేతులవల్ల మరమ్మతు పని పురోగమించింది[a]. వారు దేవుని మందిరాన్ని దాని తగిన స్థితికి పునరుద్ధరించి[b], దాన్ని బలపరిచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థానికి దగ్గరగా, ‘వారి చేతులవల్ల పనికి పునరుద్ధరణ కలిగింది.’ ఇక్కడి హెబ్రీయ పదం స్వస్థత లేదా పునరుద్ధరణను సూచిస్తుంది; ఈ సందర్భంలో అది భవన మరమ్మతుకు వర్తిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దాని మునుపటి రూపానికి తీసుకొచ్చి,’ లేక ‘దాని తగిన అమరికలో నిలబెట్టి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ עֹשֵׂי הַמְּלָאכָה
  choice: పనివారు పనిలో నిమగ్నమయ్యారు
  rationale: అక్షరార్థంగా ‘పని చేసేవారు పని చేశారు’ అనడం తెలుగులో అనవసర పునరుక్తిగా ఉంటుంది. పనివారు తమకు అప్పగించిన పనిని క్రియాశీలంగా కొనసాగించారనే భావాన్ని ఈ రూపం సహజంగా తెలియజేస్తుంది.
- source_word: וַתַּעַל אֲרוּכָה לַמְּלָאכָה
  choice: మరమ్మతు పని ముందుకు సాగింది
  rationale: אֲרוּכָה అనే పదానికి స్వస్థత, పునరుద్ధరణ, మరమ్మతు అనే భావాలు ఉన్నాయి. మందిర పునరుద్ధరణ సందర్భంలో ‘మరమ్మతు’ స్పష్టంగా సరిపోతుంది; עלה ఇక్కడ పైకి వెళ్లడం కంటే పని పురోగమించడాన్ని సూచిస్తుంది.
- source_word: בְּיָדָם
  choice: వారి చేతుల ద్వారా
  rationale: ఈ హెబ్రీయ నుడికారం పనివారి క్రియాశీల పాత్రను, సాధనత్వాన్ని సూచిస్తుంది. ‘వారి చేతుల ద్వారా’ మూలంలోని చేతి రూపకాన్ని నిలుపుతూ తెలుగులో అర్థవంతంగా ఉంటుంది.
- source_word: וַיַּעֲמִידוּ
  choice: తిరిగి నిలబెట్టి
  rationale: עמד యొక్క హిఫీల్ రూపం అక్షరార్థంగా ‘నిలబడేలా చేశారు’ అని అర్థం. భవన మరమ్మతు సందర్భంలో దానిని పునఃస్థాపించడం లేదా తిరిగి నిలబెట్టడం అనే భావం వస్తుంది.
- source_word: בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరం
  rationale: అక్షరార్థం ‘దేవుని ఇల్లు.’ ఈ సందర్భంలో అది ఆలయాన్ని సూచిస్తుంది; ఆధునిక తెలుగు పాఠకులకు ‘దేవుని మందిరం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: עַל מַתְכֻּנְתּוֹ
  choice: దాని నిర్దిష్ట రూపంలో
  rationale: מַתְכֹּנֶת స్థిరపరచిన అమరిక, కొలత, రూపం లేదా తగిన స్థితిని సూచించగలదు. ‘నిర్దిష్ట రూపం’ ఈ అర్థపరిధిని అతిగా కుదించకుండా నిర్మాణ సందర్భానికి సరిపోతుంది.
- source_word: וַיְאַמְּצֻהוּ
  choice: దాన్ని బలపరిచారు
  rationale: אמץ యొక్క పియేల్ రూపం బలపరచడం లేదా దృఢం చేయడం అని అర్థం. భవన సందర్భంలో ‘బలపరిచారు’ నేరుగా, సహజంగా ఉంటుంది.
