id: 2CH.24.24
reference: 2 Chronicles 24:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּי֩ בְ/מִצְעַ֨ר אֲנָשִׁ֜ים בָּ֣אוּ חֵ֣יל אֲרָ֗ם וַֽ/יהוָה֙ נָתַ֨ן בְּ/יָדָ֥/ם חַ֨יִל֙ לָ/רֹ֣ב מְאֹ֔ד כִּ֣י עָֽזְב֔וּ אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם וְ/אֶת יוֹאָ֖שׁ עָשׂ֥וּ שְׁפָטִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/024.yaml
  text: For the army of Aram came with few men[a], but Yahweh gave a very great army into their hand, because they had forsaken Yahweh, the God of their fathers[c][b]. Thus they executed judgment on Joash.
translation:
  language: te
  text: అరాము సైన్యం కొద్దిమందితో[a] వచ్చినప్పటికీ, యహ్వే అతి గొప్ప సైన్యాన్ని వారి చేతికి[b] అప్పగించాడు; ఎందుకంటే యూదావారు తమ పితరుల దేవుడైన యహ్వేను విడిచిపెట్టారు. వారు యోవాషుపై న్యాయతీర్పులను అమలు చేశారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కొద్దిమంది మనుషులతో.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘వారి చేతిలోకి’; అంటే, వారి అధికారానికి అప్పగించాడు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘వారు యోవాషును శిక్షాత్మక తీర్పులకు గురిచేశారు.’
    reason: alternative_reading
lexical_decisions:
- source_word: בְּמִצְעַר אֲנָשִׁים
  choice: కొద్దిమందితో
  rationale: ఈ పదబంధం సంఖ్యాపరమైన అల్పత్వాన్ని సూచిస్తుంది. తరువాత ప్రస్తావించే అతి పెద్ద సైన్యంతో ఉన్న వ్యత్యాసాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: חֵיל אֲרָם
  choice: అరాము సైన్యం
  rationale: ఈ సందర్భంలో חֵיל సైనిక బలగాన్ని సూచిస్తుంది. మూలంలోని స్థలనామాన్ని అనుసరించి ‘అరాము’ అని ఇచ్చాం.
- source_word: נָתַן בְּיָדָם
  choice: వారి చేతికి అప్పగించాడు
  rationale: ఇది ఒకరిని మరొకరి అధికారానికి లోబరచడాన్ని సూచించే హీబ్రూ నుడికారం. తెలుగులోనూ అర్థమయ్యే ‘చేతికి అప్పగించాడు’ అనే రూపం దాని చిత్రణను నిలుపుతుంది.
- source_word: חַיִל לָרֹב מְאֹד
  choice: అతి పెద్ద సైన్యాన్ని
  rationale: ఇక్కడ חַיִל సైన్యాన్ని, לָרֹב מְאֹד దాని అత్యధిక పరిమాణాన్ని సూచిస్తున్నాయి.
- source_word: עָזְבוּ
  choice: విడిచిపెట్టినందున
  rationale: సాధారణంగా దూరమవడం మాత్రమే కాక, దేవునిపట్ల అవిశ్వాసంతో ఆయనను త్యజించిన భావాన్ని ఈ పదప్రయోగం తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: మూలపాఠంలోని దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: తమ పితరుల దేవుడు
  rationale: మూలంలోని వంశపారంపర్య, నిబంధనాపరమైన భాషను నిలుపుతూ సహజమైన తెలుగు రూపాన్ని వాడాం.
- source_word: עָשׂוּ שְׁפָטִים
  choice: తీర్పులు అమలు చేశారు
  rationale: שְׁפָטִים బహువచనాన్ని నిలుపుతూ, కేవలం న్యాయస్థానపు ప్రకటనగా కాక శిక్షాత్మక న్యాయచర్యలుగా అర్థమయ్యే రూపాన్ని ఎంచుకున్నాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలంలో బిరుదు కాక దేవుని నామమే ఉంది; అందువల్ల దానిని లిప్యంతరీకరించడం మూలానికి నిష్ఠగా ఉంటుంది.
- issue: అరామీయుల చర్యను దైవతీర్పుగా చూపడం
  choice: వారు యోవాషు మీద తీర్పులు అమలు చేశారు
  alternative: వారు యోవాషును శిక్షించారు
  rationale: మూలంలోని బహువచన שְׁפָטִים ను, అలాగే అరామీయుల చర్యలు యోవాషుపై జరిగిన న్యాయదండనలనే భావాన్ని నిలుపుతుంది; ఆ చర్యల స్వరూపాన్ని అవసరానికి మించి వివరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడాం. ‘పితరులు,’ ‘తీర్పులు అమలు చేశారు’ వంటి పదాలు మూలంలోని నిబంధనాపరమైన, న్యాయపరమైన గంభీరతను నిలుపుతాయి.
