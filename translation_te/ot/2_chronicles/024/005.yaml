  text: וַ/יִּקְבֹּץ֮ אֶת הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּם֒ וַ/יֹּ֣אמֶר לָ/הֶ֡ם צְא֣וּ לְ/עָרֵ֪י יְהוּדָ֟ה וְ/קִבְצוּ֩ מִ/כָּל יִשְׂרָאֵ֨ל כֶּ֜סֶף לְ/חַזֵּ֣ק אֶת בֵּ֣ית אֱלֹֽהֵי/כֶ֗ם מִ/דֵּ֤י שָׁנָה֙ בְּ/שָׁנָ֔ה וְ/אַתֶּ֖ם תְּמַהֲר֣וּ לַ/דָּבָ֑ר וְ/לֹ֥א מִֽהֲר֖וּ הַֽ/לְוִיִּֽם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/005.yaml
  text: So he gathered the priests and the Levites and said to them[a], “Go out to the cities of Judah and collect silver from all Israel to repair the house of your God year by year[b], and you must act quickly in this matter.” But the Levites did not act quickly.
translation:
  language: te
  text: 'అతడు యాజకులను, లేవీయులను సమకూర్చి, వారితో ఇలా అన్నాడు: “యూదా పట్టణాలకు వెళ్లి, మీ దేవుని మందిరాన్ని మరమ్మతు చేయడానికి[b] ఇశ్రాయేలు అంతటినుండి ఏటేటా వెండి[a] సేకరించండి. ఈ విషయంలో మీరు త్వరపడండి.” కానీ లేవీయులు త్వరపడలేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “డబ్బు.” హీబ్రూ పాఠంలో ధనసేకరణకు నిర్దిష్ట పదంగా “వెండి” ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “బలపరచడానికి”; ఇక్కడ దేవుని మందిర నిర్మాణాన్ని మరమ్మతు చేసి పటిష్ఠం చేయడం అనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: సమకూర్చి
  rationale: קבץ అనే క్రియ ఇక్కడ ప్రజలను ఒకచోట చేర్చడాన్ని సూచిస్తుంది; ‘సమకూర్చి’ సహజమైన, గౌరవప్రదమైన తెలుగు ప్రయోగం.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: యాజకులను, లేవీయులను
  rationale: ఆలయసేవలోని రెండు వేర్వేరు వర్గాలను మూలపాఠం ప్రకారం స్పష్టంగా ఉంచుతుంది.
- source_word: צְאוּ לְעָרֵי יְהוּדָה
  choice: యూదా పట్టణాలకు వెళ్లి
  rationale: יצא ఆజ్ఞారూపంలోని ప్రయాణ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְקִבְצוּ
  choice: సేకరించండి
  rationale: ధనాన్ని కూడబెట్టే సందర్భంలో ‘సేకరించండి’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలంతటి నుండి
  rationale: ‘ఇశ్రాయేలు’ అనే పదం యొక్క విస్తృత చారిత్రక-ఒడంబడిక పరిధిని కుదించకుండా మూలంలోని భావాన్ని నిలుపుతుంది.
- source_word: כֶּסֶף
  choice: వెండి
  rationale: మూలంలోని నిర్దిష్ట పదార్థపదాన్ని నిలుపుతుంది; సందర్భంలో అది ధనంగా ఉపయోగించే వెండిని సూచించవచ్చు.
- source_word: לְחַזֵּק
  choice: బాగుచేయడానికి
  rationale: חזק అక్షరార్థంగా ‘బలపరచడం’; భవన సందర్భంలో నిర్మాణాన్ని మరమ్మతు చేసి పటిష్ఠం చేయడం అనే ప్రయోజనాన్ని ‘బాగుచేయడం’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: בֵּית אֱלֹהֵיכֶם
  choice: మీ దేవుని మందిరాన్ని
  rationale: హీబ్రూలో అక్షరార్థం ‘మీ దేవుని ఇల్లు’; ఈ సందర్భంలో ఆలయమే ఉద్దేశం కావడంతో సాధారణ పాఠకునికి ‘మందిరం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: מִדֵּי שָׁנָה בְּשָׁנָה
  choice: ప్రతి సంవత్సరం
  rationale: క్రమంగా ఏటేట జరిగే పునరావృతిని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְאַתֶּם תְּמַהֲרוּ לַדָּבָר
  choice: ఈ పనిని త్వరగా చేయండి
  rationale: ఆజ్ఞలోని అత్యవసరతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְלֹא מִהֲרוּ הַלְוִיִּם
  choice: అయితే లేవీయులు త్వరగా చేయలేదు
  rationale: ముందటి ఆజ్ఞలోని מהר పదాన్ని ప్రతిధ్వనింపజేసి కథనంలోని వ్యత్యాసాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ‘ఇశ్రాయేలంతటి నుండి’ అనే పదబంధపు పరిధి
  choice: ఇశ్రాయేలంతటి నుండి
  alternative: యూదా ప్రజలందరి నుండి / ఇశ్రాయేలీయులందరి నుండి
  rationale: దినవృత్తాంతాల రచయిత ‘ఇశ్రాయేలు’ను విస్తృత ఒడంబడిక ప్రజల భావంలో వాడగలడు. దానిని యూదాకు మాత్రమే పరిమితం చేయకుండా మూలపాఠంలోని చారిత్రక-దైవశాస్త్రీయ విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. మూలంలోని ఆజ్ఞాత్మక అత్యవసరతను, ‘త్వరగా’ అనే పద పునరుక్తిని నిలిపాం. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదాల వెంట ఉంచాం.
