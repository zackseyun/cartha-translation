source:
  edition: WLC
  text: וּֽ/כְ/כַלּוֹתָ֡/ם הֵבִ֣יאוּ לִ/פְנֵי֩ הַ/מֶּ֨לֶךְ וִֽ/יהוֹיָדָ֜ע אֶת שְׁאָ֣ר הַ/כֶּ֗סֶף וַ/יַּעֲשֵׂ֨/הוּ כֵלִ֤ים לְ/בֵית יְהוָה֙ כְּלֵ֣י שָׁרֵ֔ת וְ/הַעֲל֣וֹת וְ/כַפּ֔וֹת וּ/כְלֵ֥י זָהָ֖ב וָ/כָ֑סֶף וַ֠/יִּֽהְיוּ מַעֲלִ֨ים עֹל֤וֹת בְּ/בֵית יְהוָה֙ תָּמִ֔יד כֹּ֖ל יְמֵ֥י יְהוֹיָדָֽע־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/014.yaml
  text: When they had finished[a], they brought the rest of the silver before the king and Jehoiada, and with it he made articles for the house of Yahweh, articles for ministry and for offering up, and bowls, and articles of gold and silver[c][b]. And they were offering burnt offerings in the house of Yahweh continually all the days of Jehoiada.
translation:
  language: te
  text: వారు పని ముగించినప్పుడు, మిగిలిన వెండిని రాజు, యెహోయాదాల ఎదుటకు తీసుకొచ్చారు. దానితో అతడు[a] యాహ్వే మందిరం కోసం సేవకు ఉపయోగించే సామగ్రిని[b], అర్పించడానికి ఉపయోగించే సామగ్రిని[c], గిన్నెలను, బంగారం, వెండితో చేసిన వస్తువులను తయారు చేశాడు. యెహోయాదా జీవించిన రోజులన్నిటిలోనూ వారు యాహ్వే మందిరంలో దహనబలులను నిత్యం అర్పిస్తూ వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దానిని పాత్రలుగా చేశాడు’ అని కూడా అనువదించవచ్చు. హెబ్రీలో క్రియ, మిగిలిన వెండిని సూచించే కర్మప్రత్యయం రెండూ ఏకవచనంలో ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పరిచర్యకు ఉపయోగించే సామగ్రి.’
    reason: lexical_alternative
  - marker: c
    text: హెబ్రీలో అక్షరార్థంగా ‘పైకి అర్పించడానికి’ అని ఉంది; ఏమి అర్పించాలో ఇక్కడ చెప్పలేదు. అయితే వాక్యం చివర దహనబలులు స్పష్టంగా ప్రస్తావించబడ్డాయి.
    reason: source_ambiguity
lexical_decisions:
- source_word: וּכְכַלּוֹתָם
  choice: వారు పని ముగించినప్పుడు
  rationale: కాలసూచక infinitive construct; క్రియకు స్పష్టమైన కర్మ లేకపోయినా, సందర్భంలోని మరమ్మతు పనిని సహజమైన తెలుగులో ‘పని’ అని సూచించాం.
- source_word: שְׁאָר הַכֶּסֶף
  choice: మిగిలిన వెండి
  rationale: כֶּסֶף అంటే ‘వెండి’ లేదా ‘డబ్బు’; దానితో లోహపు ఆలయ వస్తువులు చేసిన సందర్భంలో పదార్థార్థమైన ‘వెండి’ తగినది.
- source_word: וַיַּעֲשֵׂהוּ
  choice: దానితో అతడు … తయారు చేశాడు
  rationale: ఏకవచన క్రియను, మిగిలిన వెండిని సూచించే ఏకవచన కర్మప్రత్యయాన్ని నిలిపి ఉంచుతుంది; కర్తను మూలం పేరుతో మళ్లీ స్పష్టీకరించదు.
- source_word: כֵלִים / כְּלֵי שָׁרֵת
  choice: సామగ్రి / సేవకు ఉపయోగించే సామగ్రి
  rationale: כֵלִים విస్తృతార్థంలో పాత్రలు, పనిముట్లు, ఇతర ఉపకరణాలను సూచిస్తుంది; ఆలయ సేవ సందర్భంలో ‘సామగ్రి’ సహజంగా, సమగ్రంగా ఉంటుంది.
- source_word: וְהַעֲלוֹת
  choice: అర్పించడానికి ఉపయోగించే సామగ్రి
  rationale: עלה హిఫిల్ infinitive యొక్క ‘పైకి తీసుకురావడం/అర్పించడం’ అనే క్రియార్థాన్ని ఇస్తుంది; మూలంలో అర్పించబడే వస్తువు చెప్పబడనందున దాన్ని ప్రధాన పాఠ్యంలో నిర్దిష్టం చేయలేదు.
- source_word: וְכַפּוֹת
  choice: గిన్నెలు
  rationale: ఇది ఆలయ ఆరాధనలో ఉపయోగించే ఒక రకమైన పాత్ర; ఖచ్చితమైన ఆకారం అనిశ్చితమైనందున విస్తృతమైన ‘గిన్నెలు’ ఎంచుకున్నాం.
- source_word: וּכְלֵי זָהָב וָכָסֶף
  choice: బంగారు వెండి వస్తువులు
  rationale: బంగారం, వెండితో చేసిన ఆలయ వస్తువుల పదార్థాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וַיִּהְיוּ מַעֲלִים עֹלוֹת … תָּמִיד
  choice: దహనబలులను క్రమం తప్పకుండా అర్పిస్తూ వచ్చారు
  rationale: participial construction మరియు תָּמִיד కలిసి కొనసాగిన, నియమిత ఆచరణను సూచిస్తున్నాయి; తెలుగు కొనసాగింపు రూపం ఆ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: హెబ్రీ మూలంలోని వ్యక్తిగత నిబంధన నామాన్ని బిరుదుగా మార్చకుండా ఆధునిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- issue: చివరి వాక్యంలో బలుల అర్పణ స్వభావం
  choice: యెహోయాదా జీవితకాలమంతా కొనసాగిన నియమిత ఆచరణ
  alternative: ఒక సాధారణ భూతకాల సంఘటనగా ‘అర్పించారు’
  rationale: מַעֲלִים అనే participle, תָּמִיד అనే క్రియావిశేషణం కలసి పునరావృతమైన లేదా నిరంతర ఆచరణను సూచిస్తాయి.
- issue: וְהַעֲלוֹת వద్ద అర్పణ కర్మ
  choice: కర్మను నిర్దిష్టం చేయకుండా ‘అర్పించడానికి’
  alternative: ‘దహనబలులు అర్పించడానికి’
  rationale: ఈ పదబంధంలో అర్పించబడే కర్మ మూలంలో లేదు; వాక్యం చివర עֹלוֹת స్పష్టంగా ఉన్నప్పటికీ దాన్ని ముందరి పదబంధంలోకి తీసుకురాలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మందిరం’, ‘దహనబలులు’, ‘సేవ’ వంటి సుపరిచిత బైబిలు పదాలను ఉంచుతూ, అతిగా ప్రాచీనమైన క్రియారూపాలను నివారించాం. మూలంలోని ఏకవచన క్రియను, అర్పణ కర్మలోని అస్పష్టతను పాదసూచికలతో నిలిపాం.
