id: 2CH.24.3
reference: 2 Chronicles 24:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשָּׂא ל֥/וֹ יְהוֹיָדָ֖ע נָשִׁ֣ים שְׁתָּ֑יִם וַ/יּ֖וֹלֶד בָּנִ֥ים וּ/בָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/003.yaml
  text: Jehoiada took for him two wives[a], and he fathered sons and daughters.
translation:
  language: te
  text: యెహోయాదా అతనికి ఇద్దరు భార్యలను సమకూర్చాడు[a]. అతడు కుమారులకూ కుమార్తెలకూ తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, తక్కువ సంభావ్యతతో: “యెహోయాదా ఇద్దరు భార్యలను చేసుకున్నాడు; అతడు కుమారులకూ కుమార్తెలకూ తండ్రి అయ్యాడు.” వాక్యమంతటా యెహోయాదానే కర్తగా తీసుకుంటే ఈ అర్థం వస్తుంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא לֹו
  choice: అతనికి ... వివాహం చేశాడు
  rationale: נשׂא అనే క్రియ భార్యను తీసుకోవడం అనే వివాహార్థంలో వాడబడింది. לֹו (‘అతనికి’) వల్ల ఇక్కడ యెహోయాదా యోవాషుకు భార్యలను ఏర్పాటు చేశాడనే భావం వస్తుంది; ఆధునిక తెలుగులో ‘అతనికి ... వివాహం చేశాడు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: יְהוֹיָדָע
  choice: యెహోయాదా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: נָשִׁים שְׁתָּיִם
  choice: ఇద్దరు భార్యలను
  rationale: వివాహ సందర్భంలో נָשִׁים అంటే ‘స్త్రీలు’ కంటే ‘భార్యలు’ సరైనది; ఇద్దరు అనే సంఖ్యను స్పష్టంగా నిలిపాం.
- source_word: וַיּוֹלֶד
  choice: అతనికి ... పుట్టారు
  rationale: హిఫిల్ రూపం పురుషుడు సంతానానికి తండ్రి కావడాన్ని సూచిస్తుంది. తెలుగులో ‘కుమారులు, కుమార్తెలు పుట్టారు’ అనేది సహజమైన వ్యక్తీకరణ; సందర్భానుసారం ‘అతనికి’ యోవాషును సూచిస్తుంది.
- source_word: בָּנִים וּבָנוֹת
  choice: కుమారులు, కుమార్తెలు
  rationale: మూలంలో మగ, ఆడ సంతానం విడిగా పేర్కొనబడినందున సాధారణమైన ‘పిల్లలు’ అని కుదించలేదు.
theological_decisions:
- issue: ఈ వాక్యంలోని సర్వనామం, చివరి క్రియ సూచించే వ్యక్తి
  choice: యెహోయాదా రాజైన యోవాషుకు ఇద్దరు భార్యలను వివాహం చేశాడు; యోవాషుకు కుమారులు, కుమార్తెలు పుట్టారు.
  alternative: యెహోయాదానే ఇద్దరు భార్యలను చేసుకొని కుమారులు, కుమార్తెలకు తండ్రి అయ్యాడు.
  rationale: విస్తృత సందర్భం యోవాషును గురించి చెబుతోంది; לֹו (‘అతనికి’) అనేది యెహోయాదా యోవాషు తరఫున వ్యవహరించాడని బలంగా సూచిస్తుంది. అయితే చివరి క్రియకు సమీపంలోని స్పష్టమైన కర్త యెహోయాదా కావడంతో వ్యాకరణపరమైన ప్రత్యామ్నాయం సాధ్యమే; అందువల్ల దాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని సూచనాత్మక అస్పష్టతను ప్రధాన పఠనం మరియు పాదసూచిక ద్వారా కాపాడాం.
