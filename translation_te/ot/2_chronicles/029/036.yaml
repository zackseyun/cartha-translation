  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׂמַ֤ח יְחִזְקִיָּ֨הוּ֙ וְ/כָל הָ/עָ֔ם עַ֛ל הַ/הֵכִ֥ין הָ/אֱלֹהִ֖ים לָ/עָ֑ם כִּ֥י בְּ/פִתְאֹ֖ם הָיָ֥ה הַ/דָּבָֽר־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/036.yaml
  text: And Hezekiah rejoiced[a], and all the people, because God had prepared for the people, for the matter had happened suddenly.
translation:
  language: te
  text: దేవుడు ప్రజల కోసం ఏర్పాట్లు చేసినందువల్ల హిజ్కియా మరియు ప్రజలందరూ సంతోషించారు; ఎందుకంటే ఈ సంగతంతా అకస్మాత్తుగా జరిగింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు ప్రజలను సిద్ధపరచినందువల్ల”; లేదా, “దేవుడు ప్రజల కోసం దీనిని స్థిరపరచినందువల్ల.”
    reason: హీబ్రూ הֵכִין ... לָעָם పదబంధం ప్రజల కోసం దేవుడు ఏర్పాట్లు చేశాడనే భావాన్ని సూచించవచ్చు; ప్రజలనే సిద్ధపరచాడనే లేదా ఈ సంగతిని స్థిరపరచాడనే అర్థాలూ సాధ్యమే.
lexical_decisions:
- source_word: וַיִּשְׂמַח
  choice: సంతోషించారు
  rationale: שׂמח ఆనందించడం లేదా సంతోషించడం అనే భావాన్ని ఇస్తుంది. హిజ్కియా మరియు ప్రజలందరూ కలిపి కర్తలుగా ఉన్నందున తెలుగులో గౌరవబహువచన క్రియ సహజంగా ఉంటుంది.
- source_word: יְחִזְקִיָּהוּ
  choice: హిజ్కియా
  rationale: తెలుగు బైబిలు వాడుకలో పరిచితమైన నామరూపాన్ని ఉపయోగించాం.
- source_word: וְכָל הָעָם
  choice: ప్రజలందరూ
  rationale: సమకూడిన సమాజమంతటినీ సూచించే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: עַל
  choice: దానినిబట్టి
  rationale: ఆనందానికి కారణం లేదా సందర్భాన్ని పరిచయం చేసే עַל భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הֵכִין
  choice: సిద్ధం చేసిన
  rationale: כון హిఫిల్ రూపానికి ‘సిద్ధం చేయడం,’ ‘ఏర్పాటు చేయడం,’ ‘స్థిరపరచడం’ అనే భావపరిధి ఉంది. ఆరాధన పునరుద్ధరణకు దేవుడు కలిగించిన సిద్ధతను ‘సిద్ధం చేసిన’ సహజంగా తెలియజేస్తుంది.
- source_word: הָאֱלֹהִים
  choice: దేవుడు
  rationale: ఈ సందర్భంలో ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది.
- source_word: לָעָם
  choice: ప్రజల కోసం
  rationale: ל ఇక్కడ ప్రయోజనం లేదా లబ్ధిని సూచించే అవకాశాన్ని నేరుగా కాపాడుతుంది; ప్రజలనే ప్రత్యక్ష కర్మగా మార్చదు.
- source_word: בְּפִתְאֹם
  choice: అకస్మాత్తుగా
  rationale: ఊహించని వేగంతో జరిగినదనే భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הָיָה הַדָּבָר
  choice: ఆ కార్యం జరిగింది
  rationale: דָּבָר ఇక్కడ సంస్కరణ మరియు ఆరాధన పునరుద్ధరణకు సంబంధించిన మొత్తం పరిణామాన్ని సూచిస్తుంది; ‘కార్యం’ దాని విస్తృతతను నిలుపుతుంది.
theological_decisions:
- issue: ప్రజల సిద్ధతలో దేవుని కార్యం
  choice: దేవుడు ప్రజల కోసం సిద్ధం చేసినది
  alternative: దేవుడు ప్రజలను సిద్ధపరచడం; లేదా దేవుడు ప్రజల కోసం దీనిని స్థిరపరచడం
  rationale: הֵכִין ... לָעָם నిర్మాణం దేవుడు ప్రజల ప్రయోజనార్థం పరిస్థితులను సిద్ధం చేశాడనే అర్థాన్ని బలంగా అనుమతిస్తుంది; ప్రజలనే సిద్ధపరిచాడనే అర్థమూ సందర్భపరంగా సాధ్యమే. ప్రధాన పాఠం ל యొక్క ప్రయోజనార్థక భావాన్ని నిలుపుతుంది; ఇతర అవకాశాలను పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. హీబ్రూ వాక్యంలోని కారణసంబంధాన్ని ‘దానినిబట్టి’ మరియు ‘ఎందుకంటే’ ద్వారా స్పష్టంగా ఉంచి, הֵכִין ... לָעָם లోని నిజమైన అనిశ్చితిని పాదసూచికలో సంరక్షించాం.
