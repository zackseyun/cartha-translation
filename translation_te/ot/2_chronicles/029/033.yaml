lexical_decisions:
- source_word: וְהַקֳּדָשִׁים
  choice: ప్రతిష్ఠిత అర్పణలు
  rationale: קדשׁ బహువచనం ఇక్కడ అమూర్తమైన పవిత్రతను కాకుండా దేవుని సేవ కోసం ప్రత్యేకంగా ఉంచబడిన వాటిని సూచిస్తుంది; తరువాత జంతువుల లెక్క రావడం వల్ల ‘ప్రతిష్ఠిత అర్పణలు’ సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בָּקָר
  choice: పశువులు
  rationale: ఇది గోవుల జాతికి చెందిన జంతువులను సమష్టిగా సూచించే పదం; లింగం లేదా పనికి ఉపయోగించే ఎద్దులు అనే పరిమితి మూలంలో లేదు.
- source_word: שֵׁשׁ מֵאוֹת
  choice: ఆరు వందలు
  rationale: సాధారణ సంఖ్యా నిర్మాణం.
- source_word: וְצֹאן
  choice: మందజంతువులు
  rationale: צֹאן గొర్రెలతోపాటు మేకలను కూడా సూచించగల సమష్టి పదం. ‘మందజంతువులు’ అనే ఎంపిక మూలంలోని విస్తృతార్థాన్ని కాపాడుతుంది.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: మూడు వేలు
  rationale: సాధారణ సంఖ్యా నిర్మాణం.
