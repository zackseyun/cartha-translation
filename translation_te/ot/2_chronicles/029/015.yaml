  to: వారు తమ సహోదరులను సమకూర్చి, తమను తాము పవిత్రపరచుకొని, యాహ్వే మాటలకు అనుగుణంగా రాజు ఇచ్చిన ఆజ్ఞ ప్రకారం యాహ్వే మందిరాన్ని శుద్ధి చేయడానికి వచ్చారు.[a][b]
