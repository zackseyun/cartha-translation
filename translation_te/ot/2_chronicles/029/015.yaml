reference: 2 Chronicles 29:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּֽאַסְפ֤וּ אֶת אֲחֵי/הֶם֙ וַ/יִּֽתְקַדְּשׁ֔וּ וַ/יָּבֹ֥אוּ כְ/מִצְוַת הַ/מֶּ֖לֶךְ בְּ/דִבְרֵ֣י יְהוָ֑ה לְ/טַהֵ֖ר בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/015.yaml
  text: They gathered their brothers[a], consecrated themselves, and came, according to the command of the king by the words of Yahweh[c][b], to cleanse the house of Yahweh.
translation:
  language: te
  text: వారు తమ సహోదరులను సమకూర్చి, తమను తాము పవిత్రపరచుకొని, యాహ్వే మాటలకు అనుగుణంగా రాజు ఇచ్చిన ఆజ్ఞ ప్రకారం యాహ్వే మందిరాన్ని శుద్ధి చేయడానికి వచ్చారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “రాజు ఆజ్ఞ ప్రకారం, యాహ్వే మాటలలో/ద్వారా.” యాహ్వే మాటలతో రాజాజ్ఞకు ఉన్న సంబంధాన్ని ఈ హీబ్రూ పదబంధం సంక్షిప్తంగా తెలియజేస్తుంది.
    reason: בְּדִבְרֵי יְהוָה యొక్క అర్థసంబంధాన్ని ప్రధాన పాఠంలో సహజంగా తెలిపినా, ఉపసర్గకు సాధ్యమైన విస్తృత భావాన్ని నిలుపుతుంది.
  - marker: b
    text: హీబ్రూలో “యాహ్వే ఇంటిని”; అంటే, ఆలయాన్ని.
    reason: בֵּית יְהוָה యొక్క అక్షరార్థాన్ని తెలియజేస్తుంది; ప్రధాన పాఠంలోని “మందిరం” సందర్భానుకూలమైన సహజ తెలుగు రూపం.
lexical_decisions:
- source_word: וַיַּאַסְפוּ אֶת־אֲחֵיהֶם
  choice: వారు తమ సహోదరులను సమకూర్చి
  rationale: אסף అంటే సమకూర్చడం లేదా ఒకచోట చేర్చడం. אֲחֵיהֶם అక్షరార్థంగా ‘వారి సహోదరులు’; సందర్భంలో తోటి లేవీయులే అయినా, మూలంలోని బంధుత్వ పదాన్ని నిలిపాం.
- source_word: וַיִּתְקַדְּשׁוּ
  choice: తమను తాము ప్రతిష్ఠించుకొని
  rationale: קדשׁ యొక్క హిత్పయేల్ రూపం పవిత్ర సేవ కోసం తమను తాము సిద్ధపరచుకొని ప్రతిష్ఠించుకోవడాన్ని సూచిస్తుంది.
- source_word: וַיָּבֹאוּ
  choice: వచ్చారు
  rationale: בוא యొక్క సాధారణ అర్థం ‘రావడం’. మూలంలో ప్రవేశించిన స్థలం ఈ క్రియకు ప్రత్యక్ష కర్మగా లేదు.
- source_word: כְמִצְוַת הַמֶּלֶךְ
  choice: రాజాజ్ఞ ప్రకారం
  rationale: రాజు ఆదేశానికి అనుగుణంగా వారు చేసిన కార్యాన్ని సహజమైన, సంక్షిప్త తెలుగు రూపంలో తెలియజేస్తుంది.
- source_word: בְּדִבְרֵי יְהוָה
  choice: యాహ్వే మాటల ద్వారా వచ్చిన
  rationale: בְּ ఉపసర్గను, דִּבְרֵי అనే బహువచనాన్ని నిలుపుతూ రాజాజ్ఞకు దైవిక వాక్యాలతో ఉన్న సంబంధాన్ని తెలుపుతుంది; ఆ సంబంధం యొక్క ఖచ్చిత స్వభావం సందిగ్ధమైనందున పాదసూచికలో ప్రత్యామ్నాయం ఇచ్చాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: לְטַהֵר
  choice: శుద్ధి చేయడానికి
  rationale: ఆలయ సందర్భంలో טהר యొక్క పియేల్ రూపం ఆచారపరంగా శుభ్రపరచడం లేదా పవిత్ర వినియోగానికి తగినదిగా చేయడాన్ని సూచిస్తుంది.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే మందిరాన్ని
  rationale: అక్షరార్థం ‘యాహ్వే ఇల్లు’; సందర్భంలో ఆలయం ఉద్దేశించబడినందున సాధారణ పాఠకులకు సహజమైన ‘మందిరం’ వాడి, అక్షరార్థాన్ని పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత దైవనామమే ఉంది; దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
- issue: בְּדִבְרֵי יְהוָה మరియు రాజాజ్ఞ మధ్య సంబంధం
  choice: యాహ్వే మాటల ద్వారా వచ్చిన రాజాజ్ఞ
  alternative: యాహ్వే మాటలకు అనుగుణమైన రాజాజ్ఞ
  rationale: హీబ్రూ בְּ అనేది సాధనం, ఆధారం, లేదా ప్రమాణాన్ని సూచించవచ్చు. ప్రధాన పాఠం ‘ద్వారా’ అనే భావాన్ని ఉంచుతుంది; రాజాజ్ఞ యాహ్వే మాటలకు అనుగుణంగా ఉందనే సాధ్యమైన భావాన్ని పాదసూచికలో నిలిపాం.
- issue: אֲחֵיהֶם లోని లింగసూచక బంధుత్వ పదం
  choice: తమ సహోదరులను
  alternative: తమ తోటి లేవీయులను
  rationale: సందర్భం లేవీయులను సూచించినా, మూలపాఠం స్పష్టంగా ‘సహోదరులు’ అనే పుంలింగ బంధుత్వ పదాన్ని వాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ప్రతిష్ఠించుకొని’, ‘శుద్ధి’ వంటి పదాలు ఆలయసేవ సందర్భంలోని ఆచారపరమైన భావాన్ని మోస్తాయి. వాక్యక్రమాన్ని సహజమైన తెలుగుకు అనుగుణంగా మార్చినా, హీబ్రూ క్రియల వరుసను మరియు ఉద్దేశ్యాన్ని నిలిపాం.
