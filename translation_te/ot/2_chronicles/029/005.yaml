id: 2CH.29.5
reference: 2 Chronicles 29:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר לָ/הֶ֖ם שְׁמָע֣וּ/נִי הַ/לְוִיִּ֑ם עַתָּ֣ה הִֽתְקַדְּשׁ֗וּ וְ/קַדְּשׁוּ֙ אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י אֲבֹתֵי/כֶ֔ם וְ/הוֹצִ֥יאוּ אֶת הַ/נִּדָּ֖ה מִן הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/005.yaml
  text: And he said to them[a], “Listen to me, Levites. Now consecrate yourselves, and consecrate the house of Yahweh, the God of your fathers[b], and remove the uncleanness from the holy place.”
translation:
  language: te
  text: 'అతడు వారితో ఇలా అన్నాడు: “లేవీయులారా, నా మాట వినండి. ఇప్పుడు మిమ్మల్ని మీరు పవిత్రపరచుకోండి; మీ పితరుల దేవుడైన యహ్వే మందిరాన్ని పవిత్రపరచండి. పరిశుద్ధ స్థలం[b] నుండి అపవిత్రతను[a] తొలగించండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అపవిత్రమైన దానిని” లేదా “మలినాన్ని”; ఈ హీబ్రూ పదం పరిశుద్ధ స్థలాన్ని కలుషితం చేసేదాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “పవిత్రస్థలం నుండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָעוּנִי
  choice: నా మాట వినండి
  rationale: שׁמע క్రియ యొక్క ఆజ్ఞార్థక రూపాన్నీ, మొదటి పురుష ఏకవచన ప్రత్యయాన్నీ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַלְוִיִּם
  choice: లేవీయులారా
  rationale: ఇది లేవీ గోత్ర సేవకులను నేరుగా సంబోధించే రూపం; తెలుగులో సంబోధన విభక్తి వాక్య బలాన్ని స్పష్టంగా చూపిస్తుంది.
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: తక్షణ చర్యకు పిలుపునిచ్చే కాల సూచనను అతిశయింపకుండా నిలుపుతుంది.
- source_word: הִתְקַדְּשׁוּ
  choice: మిమ్మల్ని మీరు ప్రతిష్ఠించుకోండి
  rationale: קדשׁ హిత్పయేల్ ఆజ్ఞార్థకంలోని ఆత్మనేపద భావాన్ని, ఆరాధనా సేవకు తన్నుతాను సిద్ధపరచుకొనే సందర్భాన్ని తెలియజేస్తుంది.
- source_word: וְקַדְּשׁוּ
  choice: ప్రతిష్ఠించండి
  rationale: ముందటి קדשׁ రూపంతో ఒకే తెలుగు మూలపదాన్ని వాడి హీబ్రూ పదపునరుక్తిని నిలుపుతుంది; ఇక్కడ కర్మ యహ్వే మందిరం.
- source_word: בֵּית יְהוָה
  choice: యహ్వే మందిరాన్ని
  rationale: బַּיִת పదం అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఈ సందర్భంలో దేవాలయాన్ని సూచిస్తుంది; ‘మందిరం’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరిస్తుంది.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: మీ పితరుల దేవుడు
  rationale: నిబంధనాత్మకమైన మూలభాషా వ్యక్తీకరణను గౌరవిస్తూ, ‘పితరులు’ అనే నిర్దిష్ట పదాన్ని నిలుపుతుంది.
- source_word: וְהוֹצִיאוּ
  choice: తొలగించండి
  rationale: יצא హిఫీల్ రూపంలోని బయటకు తీసివేయడం అనే కారణార్థక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַנִּדָּה
  choice: అపవిత్రతను
  rationale: ఆలయాన్ని కలుషితం చేసేదాన్ని సూచించే నִדָּה పదంలోని ఆచారపరమైన అపవిత్రత భావాన్ని నిలుపుతుంది; అది మలిన వస్తువులకూ విస్తరించగల అస్పష్టతను పాదసూచిక తెలియజేస్తుంది.
- source_word: מִן הַקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలం నుండి
  rationale: קֹדֶשׁ ఇక్కడ పవిత్ర ప్రదేశాన్ని సూచిస్తుంది. ‘పరిశుద్ధ స్థలం’ మూలపద రూపాన్ని నిలుపుతుంది; విస్తృతమైన ‘పవిత్రస్థలం/ఆలయ ప్రాంగణం’ భావం పాదసూచికలో సూచించబడింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని నామాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: קדשׁ క్రియను వ్యక్తులకూ మందిరానికీ ఒకే విధంగా చూపించడం
  choice: ప్రతిష్ఠించుకోండి / ప్రతిష్ఠించండి
  alternative: పవిత్రపరచుకోండి / పవిత్రపరచండి
  rationale: ఒకే హీబ్రూ మూలపదం వరుసగా రావడాన్ని తెలుగులోనూ నిలుపుతూ, ఆరాధనా సేవకు ప్రత్యేకపరచడం అనే సందర్భార్థాన్ని తెలియజేస్తుంది; వ్యక్తుల అంతర్గత నైతిక పరిపూర్ణతగా మాత్రమే దాన్ని సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, బహిరంగ పఠనానికి అనువైన శైలి వాడబడింది. ‘ప్రతిష్ఠించు’ ఆరాధనా సందర్భాన్ని స్పష్టంగా ఉంచుతుంది; ‘యహ్వే’ దైవనామాన్ని నిలుపుతుంది. పాదసూచిక గుర్తులు అవి వివరిస్తున్న పదాలకే నేరుగా జతచేయబడ్డాయి.
