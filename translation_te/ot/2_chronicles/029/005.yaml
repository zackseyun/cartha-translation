revisions:
- from: 'అతడు వారితో ఇలా అన్నాడు: “లేవీయులారా, నా మాట వినండి. ఇప్పుడు మిమ్మల్ని మీరు ప్రతిష్ఠించుకోండి; మీ పితరుల దేవుడైన యహ్వే మందిరాన్ని ప్రతిష్ఠించండి. పరిశుద్ధ స్థలం[b] నుండి అపవిత్రతను[a] తొలగించండి.”'
  to: 'అతడు వారితో ఇలా అన్నాడు: “లేవీయులారా, నా మాట వినండి. ఇప్పుడు మిమ్మల్ని మీరు పవిత్రపరచుకోండి; మీ పితరుల దేవుడైన యహ్వే మందిరాన్ని పవిత్రపరచండి. పరిశుద్ధ స్థలం[b] నుండి అపవిత్రతను[a] తొలగించండి.”'
  rationale: ఆచారపరమైన శుద్ధీకరణ సందర్భంలో קדשׁ యొక్క రెండు వరుస రూపాలకు ‘పవిత్రపరచుకోండి / పవిత్రపరచండి’ అని సవరించబడింది. దీనివల్ల మూలంలోని ఒకే క్రియా మూలం ప్రతిఫలిస్తూనే, వ్యక్తులనూ మందిరాన్నీ ‘ప్రతిష్ఠించడం’ అనే సంభావ్య వేరే భావం నివారించబడింది. మిగిలిన పదజాలం, పాదసూచికల అస్పష్టత, మరియు వాటి నేర అనుసంధానాలు నిలుపబడ్డాయి.
