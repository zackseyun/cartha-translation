revisions:
- from: యెహోవా మందిరాన్ని శుద్ధి చేయడానికి యాజకులు దాని లోపలి భాగంలోకి వెళ్లారు. యెహోవా ఆలయంలో తమకు కనిపించిన అపవిత్రమైన వాటన్నిటినీ వారు యెహోవా మందిర ప్రాంగణంలోకి బయటకు తెచ్చారు. లేవీయులు వాటిని తీసుకొని కిద్రోను వాగు దగ్గరికి, బయటకు మోసుకెళ్లారు.
