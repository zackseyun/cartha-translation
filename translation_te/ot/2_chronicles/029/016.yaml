id: 2CH.29.16
reference: 2 Chronicles 29:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ הַ֠/כֹּהֲנִים לִ/פְנִ֣ימָה בֵית יְהוָה֮ לְ/טַהֵר֒ וַ/יּוֹצִ֗יאוּ אֵ֤ת כָּל הַ/טֻּמְאָה֙ אֲשֶׁ֤ר מָֽצְאוּ֙ בְּ/הֵיכַ֣ל יְהוָ֔ה לַ/חֲצַ֖ר בֵּ֣ית יְהוָ֑ה וַֽ/יְקַבְּלוּ֙ הַ/לְוִיִּ֔ם לְ/הוֹצִ֥יא לְ/נַֽחַל קִדְר֖וֹן חֽוּצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/016.yaml
  text: Then the priests went into the inner part of the house of the LORD to cleanse it, and they brought out to the court of the house of the LORD all the uncleanness that they found in the temple of the LORD. Then the Levites received it to carry it outside to the Kidron Valley.
translation:
  language: te
  text: యెహోవా మందిరాన్ని శుద్ధి చేయడానికి యాజకులు యెహోవా మందిరపు లోపలి భాగంలోకి వెళ్లారు. యెహోవా ఆలయంలో వారికి కనిపించిన సమస్త అపవిత్రతను వారు యెహోవా మందిర ప్రాంగణానికి బయటకు తెచ్చారు. లేవీయులు దానిని తీసుకొని బయటకు కిద్రోను లోయకు మోసుకెళ్లారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנִימָה בֵית יְהוָה
  choice: యెహోవా మందిరపు లోపలి భాగంలోకి
  rationale: לִפְנִימָה సూచించే అంతర్భాగపు దిశను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לְטַהֵר
  choice: శుద్ధి చేయడానికి
  rationale: ఆరాధనా స్థలాన్ని అపవిత్రత నుండి శుభ్రపరచే ఆచారపరమైన భావాన్ని ‘శుద్ధి’ నిలుపుతుంది.
- source_word: כָּל הַטֻּמְאָה
  choice: అపవిత్రమైన వాటన్నిటినీ
  rationale: సందర్భంలో మందిరం నుంచి తొలగించగల అపవిత్ర వస్తువులు లేదా మలిన పదార్థాలు ఉద్దేశించబడ్డాయి; మూలంలోని సమష్టి భావాన్ని నిలుపుతుంది.
- source_word: בְּהֵיכַל יְהוָה
  choice: యెహోవా ఆలయంలో
  rationale: הֵיכָל కు ‘ఆలయం’ సహజమైన సమానార్థకం; అదే వాక్యంలో בֵּית ను ‘మందిరం’గా ఇవ్వడం ద్వారా మూలంలోని పదభేదాన్ని సాధ్యమైనంతవరకు చూపుతుంది.
- source_word: לְנַחַל קִדְרוֹן חוּצָה
  choice: కిద్రోను వాగు దగ్గరికి, బయటకు
  rationale: נַחַל కాలానుగుణ ప్రవాహం/లోయను సూచించగలదు; ‘వాగు’ సాధారణ తెలుగు పాఠకునికి సహజం. חוּצָה అనే ‘బయటకు’ భావాన్ని విడిచిపెట్టకుండా ప్రత్యేకంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో నిలుపుతుంది; సాధారణ బిరుదుతో దానిని భర్తీ చేయదు.
- issue: טֻמְאָה యొక్క ఆచారపరమైన భావం
  choice: అపవిత్రమైనవి
  alternative: మలినమైనవి
  rationale: ఇది కేవలం భౌతిక మురికిని మాత్రమే కాక ఆరాధనా సంబంధమైన అపవిత్రతను కూడా సూచించగలదు; ‘అపవిత్రమైనవి’ ఆ విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు సులభంగా ఉండే వాక్య నిర్మాణం. మూలంలోని ‘మందిరం/ఆలయం’ పదభేదాన్ని స్వల్పంగా నిలిపి, అనవసరమైన వ్యాఖ్యానాన్ని చేర్చలేదు.
