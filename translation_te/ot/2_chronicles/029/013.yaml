  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త జాబితా శైలిని నిలిపింది. వచనం ముందటి జాబితాకు కొనసాగింపుగా ఉండటంతో తెలుగులో అనవసరంగా ‘మరియు’ పునరావృతం చేయకుండా సమాంతర నిర్మాణాన్ని ఉపయోగించింది. రెండో పాదటిప్పణి గుర్తును సంబంధిత నామమైన ‘యెయూయేలు’ తరువాత ఉంచింది.
