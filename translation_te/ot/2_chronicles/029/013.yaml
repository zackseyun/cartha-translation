  text: וּ/מִן בְּנֵי֙ אֱלִ֣יצָפָ֔ן שִׁמְרִ֖י ו/יעואל וּ/מִן בְּנֵ֣י אָסָ֔ף זְכַרְיָ֖הוּ וּ/מַתַּנְיָֽהוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/013.yaml
  text: and from the sons of Elizaphan[a], Shimri and Jeiel; and from the sons of Asaph[b], Zechariah and Mattaniah.
translation:
  language: te
  text: ఎలీచాఫాను కుమారులలోనుండి[a] షిమ్రీ, యెయూయేలు[b]; మరియు ఆసాఫు కుమారులలోనుండి జెకర్యా, మత్తన్యా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘కుమారులు’ అనే మాట సొంత కుమారులను మాత్రమే కాకుండా, విస్తృత వంశానికి లేదా వంశవర్గానికి చెందినవారిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఈ పేరుకు ఇక్కడ ఉన్న హీబ్రూ రూపం ‘యెయూయేలు’ అనే పఠనానికి మద్దతిస్తుంది; ఇతర చోట్ల కనిపించే ‘యెయీయేలు’ వంటి సమాన నామరూపాలతో దీన్ని కలపకూడదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִן בְּנֵי
  choice: కుమారులలో
  rationale: ఇది ముందటి వచనంలో మొదలైన జాబితాకు కొనసాగింపు. ‘కుమారులు’ అనే మూలరూపాన్ని నిలుపుతూ, מן భావాన్ని సహజమైన తెలుగు ‘లో’ ద్వారా వ్యక్తం చేసింది.
- source_word: אֱלִיצָפָן
  choice: ఎలీచాఫాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు లిపిలో ధ్వన్యనుసారంగా ఇచ్చింది.
- source_word: שִׁמְרִי
  choice: షిమ్రీ
  rationale: హీబ్రూ వ్యక్తినామానికి ధ్వన్యనుసార లిప్యంతరీకరణ.
- source_word: ו/יעואל
  choice: యెయూయేలు
  rationale: ఈ వచనంలోని హీబ్రూ వ్యంజనరూపం יעואל ను అనుసరించింది; దాన్ని సమానంగా కనిపించే ‘యెయీయేలు’ అనే వేరొక నామరూపంతో కలపలేదు.
- source_word: בְּנֵי אָסָף
  choice: ఆసాఫు కుమారులలో
  rationale: వంశీయులు లేదా గాయకవర్గ సభ్యులు అనే విస్తృత భావానికి అవకాశం ఉంచుతూ, హీబ్రూలోని వంశసంబంధ పదబంధాన్ని ప్రత్యక్షంగా నిలిపింది.
- source_word: זְכַרְיָהוּ
  choice: జెకర్యా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో సుపరిచితమైన రూపం.
- source_word: וּ/מַתַּנְיָהוּ
  choice: మత్తన్యా
  rationale: హీబ్రూ వ్యక్తినామాన్ని సంక్షిప్తం చేయకుండా, తెలుగులో సహజమైన లిప్యంతరీకరణగా ఇచ్చింది.
