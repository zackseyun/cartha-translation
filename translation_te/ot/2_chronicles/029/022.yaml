id: 2CH.29.22
reference: 2 Chronicles 29:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּשְׁחֲטוּ֙ הַ/בָּקָ֔ר וַ/יְקַבְּל֤וּ הַ/כֹּֽהֲנִים֙ אֶת הַ/דָּ֔ם וַֽ/יִּזְרְק֖וּ הַ/מִּזְבֵּ֑חָ/ה וַ/יִּשְׁחֲט֣וּ הָ/אֵלִ֗ים וַ/יִּזְרְק֤וּ הַ/דָּם֙ הַ/מִּזְבֵּ֔חָ/ה וַֽ/יִּשְׁחֲטוּ֙ הַ/כְּבָשִׂ֔ים וַ/יִּזְרְק֥וּ הַ/דָּ֖ם הַ/מִּזְבֵּֽחָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/022.yaml
  text: Then they slaughtered the cattle[a], and the priests received the blood and splashed it against the altar. They slaughtered the rams and splashed the blood against the altar[b]. They slaughtered the lambs and splashed the blood against the altar.
translation:
  language: te
  text: అప్పుడు వారు గొడ్డు పశువులను[a] వధించారు. యాజకులు రక్తాన్ని తీసుకొని బలిపీఠంపై చిమ్మారు[b]. వారు పొట్టేళ్లను వధించి, వాటి రక్తాన్ని బలిపీఠంపై చిమ్మారు. అలాగే గొర్రెపిల్లలను వధించి, వాటి రక్తాన్ని బలిపీఠంపై చిమ్మారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ పదం గోవుల జాతికి చెందిన పశువులను సమష్టిగా సూచిస్తుంది; కొందరు దీనిని ‘ఎద్దులు’ అని అనువదిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ క్రియ బలి ఆచారంలో రక్తాన్ని బలిపీఠం వైపు బలంగా విసిరి దానిపై పడేలా చేయడాన్ని సూచిస్తుంది; ఇది తేలికగా చిలకరించడం కాదు. ‘బలిపీఠం మీద చిమ్మారు’ లేదా ‘బలిపీఠానికి తగిలేలా విసిరారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: వధించారు
  rationale: బలి సందర్భంలో שׁחט సాధారణంగా చంపడాన్ని కాక, ఆచారబద్ధంగా జంతువును వధించడాన్ని సూచిస్తుంది. ‘వధించారు’ ఆధునిక, గౌరవప్రదమైన తెలుగులో ఈ భావాన్ని నిలుపుతుంది.
- source_word: הַבָּקָר
  choice: పశువులను
  rationale: בקר గోవుల జాతికి చెందిన పశువులను సమష్టిగా సూచిస్తుంది; మూలంలో లింగం నిర్దిష్టంగా లేదు. ‘పశువులు’ సహజంగా ఉన్నప్పటికీ విస్తృతార్థం కలిగినందున పాదసూచికలో పరిధిని స్పష్టం చేశాం.
- source_word: וַיְקַבְּלוּ
  choice: తీసుకొని
  rationale: קבל అంటే ‘స్వీకరించు/తీసుకొను.’ బలి ప్రక్రియలో యాజకులు రక్తాన్ని ఆచార వినియోగం కోసం తీసుకున్నారని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: כהנים కు ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకలో స్పష్టమైన సమానార్థకం.
- source_word: הַדָּם
  choice: రక్తం
  rationale: మూలపదానికి నేరమైన, సహజమైన అనువాదం.
- source_word: וַיִּזְרְקוּ
  choice: తగిలేలా ... చిమ్మారు
  rationale: זרק ఇక్కడ రక్తాన్ని తేలికగా చిలకరించడం కాక, బలిపీఠం వైపు విసిరి దానికి అంటించే బలి ఆచారాన్ని సూచిస్తుంది. ఈ పదబంధం చర్యలోని దిశను, బలాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַמִּזְבֵּחָה
  choice: బలిపీఠానికి
  rationale: దిశను సూచించే హీబ్రూ రూపం బలిపీఠం వైపు కదలికను తెలియజేస్తుంది; ‘తగిలేలా’తో కలిపి రక్తం బలిపీఠానికి అన్వయించబడిన భావాన్ని ఇస్తుంది.
- source_word: הָאֵלִים
  choice: పొట్టేళ్లను
  rationale: אילים మగ గొర్రెలను, అంటే పొట్టేళ్లను, నిర్దిష్టంగా సూచిస్తుంది.
- source_word: הַכְּבָשִׂים
  choice: గొర్రెపిల్లలను
  rationale: כבשים బలి జాబితాలో సాధారణంగా చిన్న గొర్రెలను సూచిస్తుంది; ‘గొర్రెపిల్లలు’ ఈ సందర్భానికి సహజమైన పదం.
