translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ కథనంలోని వరుస చర్యలను స్పష్టంగా చూపేందుకు చిన్న వాక్యాలు వాడాం. పునరావృతమైన బలి విధానాన్ని ఉద్దేశపూర్వకంగా నిలిపి ఉంచాం; ‘ప్రోక్షించారు’ వంటి ప్రాచీన లేదా సాంకేతిక పదాన్ని నివారించాం.
