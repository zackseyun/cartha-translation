id: 2CH.29.31
reference: 2 Chronicles 29:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֨עַן יְחִזְקִיָּ֜הוּ וַ/יֹּ֗אמֶר עַתָּ֨ה מִלֵּאתֶ֤ם יֶדְ/כֶם֙ לַ/יהוָ֔ה גֹּ֧שׁוּ וְ/הָבִ֛יאוּ זְבָחִ֥ים וְ/תוֹד֖וֹת לְ/בֵ֣ית יְהוָ֑ה וַ/יָּבִ֤יאוּ הַ/קָּהָל֙ זְבָחִ֣ים וְ/תוֹד֔וֹת וְ/כָל נְדִ֥יב לֵ֖ב עֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/031.yaml
  text: Then Hezekiah answered and said[a], “Now you have filled your hand for Yahweh. Come near and bring sacrifices and thank offerings to the house of Yahweh.” And the assembly brought sacrifices and thank offerings, and all who were willing of heart brought burnt offerings.
translation:
  language: te
  text: 'అప్పుడు హిజ్కియా ఇలా అన్నాడు: “ఇప్పుడు మీరు యాహ్వే సేవకు మిమ్మల్ని ప్రతిష్ఠించుకున్నారు[a]. దగ్గరకు వచ్చి, యాహ్వే మందిరానికి బలులను, కృతజ్ఞతాబలులను తీసుకురండి.” అప్పుడు సమాజం బలులను, కృతజ్ఞతాబలులను తీసుకువచ్చింది; స్వచ్ఛంద హృదయం గల వారందరూ దహనబలులను తీసుకువచ్చారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “మీ చేతులను యాహ్వే కోసం నింపుకున్నారు.” ఇది పవిత్ర సేవకు తమను ప్రతిష్ఠించుకోవడాన్ని లేదా నియమించబడడాన్ని సూచించే నుడికారం.
    reason: ప్రధాన పాఠ్యంలో నుడికార భావాన్ని స్పష్టంగా ఇవ్వడంతోపాటు, హెబ్రీయ అక్షరార్థ రూపాన్ని మరియు ప్రతిష్ఠాపన భావాన్ని పాఠకునికి తెలియజేయడం.
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: అప్పుడు హిజ్కియా ఇలా అన్నాడు
  rationale: ‘జవాబిచ్చి అన్నాడు’ అనే హీబ్రూ కథన సూత్రాన్ని తెలుగులో యాంత్రికంగా ఉంచకుండా, సందర్భానికి సహజమైన కథన రూపంలో అందించింది.
- source_word: מִלֵּאתֶם יֶדְכֶם לַיהוָה
  choice: మీరు యాహ్వే సేవకు మిమ్మల్ని ప్రతిష్ఠించుకున్నారు[a]
  rationale: అక్షరార్థంగా ‘యాహ్వే కోసం మీ చేతిని నింపుకున్నారు’ అనే ఈ ఆచార సంబంధమైన నుడికారం పవిత్ర సేవకు ప్రతిష్ఠించుకోవడాన్ని సూచిస్తుంది. భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా ఇచ్చి, మూలరూపాన్ని పాదసూచికలో నిలిపింది.
- source_word: גֹּשׁוּ
  choice: దగ్గరకు వచ్చి
  rationale: ఆరాధన కోసం సమీపించడమనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: זְבָחִים
  choice: బలులు
  rationale: వధించి అర్పించే బలులకు వాడిన విస్తృత పదాన్ని సాధారణమైన తెలుగు ఆరాధనా పదంతో అనువదించింది.
- source_word: תוֹדוֹת
  choice: కృతజ్ఞతా బలులు
  rationale: కృతజ్ఞత తెలియజేసే ప్రత్యేక బలి రకాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: לְבֵית יְהוָה
  choice: యాహ్వే మందిరానికి
  rationale: హీబ్రూ ‘యాహ్వే గృహానికి’ అనే భావాన్ని ఆధునిక పాఠకులకు సహజంగా, ఆరాధనా సందర్భానికి తగినట్లుగా అందిస్తుంది.
- source_word: הַקָּהָל
  choice: సమాజం
  rationale: ఆరాధన కోసం కూడిన ప్రజాసమూహాన్ని సూచించే సంక్షిప్తమైన, సహజమైన పదం.
- source_word: כָל נְדִיב לֵב
  choice: హృదయపూర్వకంగా ముందుకు వచ్చిన వారందరూ
  rationale: బలవంతం లేకుండా హృదయంలో కలిగిన స్వచ్ఛంద సిద్ధతను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: עֹלוֹת
  choice: దహనబలులు
  rationale: పూర్తిగా దహనం చేసే బలి రకానికి స్థిరమైన, స్పష్టమైన తెలుగు పదం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- issue: מִלֵּאתֶם יֶדְכֶם అనే ప్రతిష్ఠాపన నుడికారం
  choice: యాహ్వే సేవకు మిమ్మల్ని ప్రతిష్ఠించుకున్నారు
  alternative: యాహ్వే కోసం మీ చేతిని నింపుకున్నారు
  rationale: అక్షరార్థ రూపం తెలుగులో అర్థం కాని చర్యలా కనిపించే అవకాశం ఉంది. సందర్భంలోని పవిత్ర సేవకు సిద్ధపరచుకోవడం/ప్రతిష్ఠించుకోవడం అనే భావాన్ని స్పష్టంగా ఇచ్చి, నుడికారంలోని రూపాన్ని పాదసూచికలో సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన శైలి. బలి రకాల మధ్య ఉన్న భేదాన్ని నిలిపి, అస్పష్టమైన హీబ్రూ నుడికారాన్ని పాదసూచికతో వివరించింది.
