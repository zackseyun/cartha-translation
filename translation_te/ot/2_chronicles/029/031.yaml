  source_fidelity: 'ప్రధాన అనువాదం హెబ్రీయ మూలార్థాన్ని సరిగా ప్రతిబింబిస్తుంది: ప్రతిష్ఠాపన నుడికారాన్ని ప్రధాన పాఠ్యంలో స్పష్టం చేసి, అక్షరార్థాన్ని పాదసూచికలో ఇచ్చింది; బలులు, కృతజ్ఞతాబలులు, దహనబలులు అనే విభాగాలూ నిలిచాయి. అయితే כָל נְדִיב לֵבలో లేని ‘ముందుకు వచ్చిన’ అనే చర్యను చేర్చడం మూలార్థానికి మించినది.'
