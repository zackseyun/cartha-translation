  terminology: ‘యాహ్వే,’ ‘ప్రతిష్ఠించుకున్నారు,’ ‘కృతజ్ఞతాబలులు,’ ‘దహనబలులు’ సందర్భోచితమైన పదాలు. పాదసూచికలోని నుడికారం వివరణ తగినదే; దానిని మరింత నిర్దిష్టంగా, స్వీయ-ప్రతిష్ఠ భావానికి సరిపోయేలా సవరించాం.
