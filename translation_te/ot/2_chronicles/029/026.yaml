reference: 2 Chronicles 29:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּֽעַמְד֤וּ הַ/לְוִיִּם֙ בִּ/כְלֵ֣י דָוִ֔יד וְ/הַ/כֹּהֲנִ֖ים בַּ/חֲצֹצְרֽוֹת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/026.yaml
  text: Then the Levites stood with the instruments of David[b][a], and the priests with the trumpets.
translation:
  language: te
  text: అప్పుడు లేవీయులు దావీదు వాద్యాలతో[a] నిలబడ్డారు; యాజకులు బూరలతో[b] నిలబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దావీదుకు చెందిన వాద్యాలతో.” హీబ్రూ పదబంధం దావీదుకు చెందిన, ఆయన ఏర్పాటు చేసిన, లేదా ఆయనతో అనుబంధమున్న వాద్యాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, యాజకులు ఆరాధనలో ఉపయోగించే బూరలు. కొన్ని సందర్భాల్లో అవి వెండి బూరలని స్పష్టంగా చెప్పబడుతుంది; కానీ ఇక్కడ ఆ వివరము లేదు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: అప్పుడు ... నిలబడ్డారు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; עמד యొక్క ప్రాథమిక భావమైన ‘నిలబడు/స్థానం తీసుకో’ను సహజమైన తెలుగు కథనశైలిలో వ్యక్తం చేస్తుంది.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి గోత్రానికి చెందిన ఆలయసేవకుల సమూహానికి ఆధునిక ప్రామాణిక తెలుగు రూపం.
- source_word: בִּכְלֵי דָוִיד
  choice: దావీదు వాద్యాలతో
  rationale: כְּלִי అనే పదం విస్తృతార్థంలో పాత్ర, పరికరం లేదా సాధనం కావచ్చు; ఈ ఆలయ సంగీత సందర్భంలో ‘వాద్యాలు’ సహజమైన అర్థం. దావీదుతో ఉన్న సంబంధం యాజమాన్యం, ఏర్పాటు లేదా అనుబంధాన్ని సూచించవచ్చు.
- source_word: וְהַכֹּהֲנִים
  choice: యాజకులు
  rationale: సమన్వయించబడిన రెండవ సమూహాన్ని స్పష్టంగా తెలుపుతుంది; తెలుగు వాక్య నిర్మాణంలో అర్ధవిరామం సమాంతర సంబంధాన్ని సహజంగా చూపుతుంది.
- source_word: בַּחֲצֹצְרוֹת
  choice: బూరలతో
  rationale: חֲצֹצְרוֹת యాజకులు ఉపయోగించే ఆరాధనా బూరలను సూచిస్తుంది. ఈ వచనంలో ‘వెండి’ అని లేకపోవడంతో ఆ వివరాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. హీబ్రూ వాక్యంలో ‘నిలబడ్డారు’ అనే క్రియ రెండు సమూహాలకు వర్తిస్తుంది; తెలుగులో స్పష్టత కోసం రెండవ భాగంలోనూ దానిని పునరుక్తి చేశాం. ‘దావీదు వాద్యాలు’ అనే సంబంధంలోని నిజమైన అస్పష్టతను పాదటీకలో నిలిపాం.
