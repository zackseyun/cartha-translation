id: 2CH.29.11
reference: 2 Chronicles 29:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בָּנַ֕/י עַתָּ֖ה אַל תִּשָּׁל֑וּ כִּֽי בָ/כֶ֞ם בָּחַ֣ר יְהוָ֗ה לַ/עֲמֹ֤ד לְ/פָנָי/ו֙ לְ/שָׁ֣רְת֔/וֹ וְ/לִ/הְי֥וֹת ל֖/וֹ מְשָׁרְתִ֥ים וּ/מַקְטִרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/011.yaml
  text: My sons[a], do not be negligent now, for Yahweh has chosen you to stand before him, to minister to him[d][c][b], and to be his ministers and burners of incense.
translation:
  language: te
  text: నా కుమారులారా, ఇప్పుడు నిర్లక్ష్యంగా ఉండకండి; ఎందుకంటే యెహోవా మిమ్మల్ని తన సన్నిధిలో నిలబడడానికి[a], తనకు పరిచర్య చేయడానికి, తన పరిచారకులుగా ఉండడానికి, ధూపం వేయడానికి ఎంచుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తన సన్నిధిలో నిలబడడం” అనేది దేవుని సమక్షంలో యాజక సేవ చేయడాన్ని సూచించే ప్రయోగం.
    reason: cultural_note
lexical_decisions:
- source_word: בָּנַי
  choice: నా కుమారులారా
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న పుంలింగ సంబోధనను యాజకులు/లేవీయులకు తగిన విధంగా నేరుగా నిలుపుతుంది.
- source_word: אַל תִּשָּׁלוּ
  choice: నిర్లక్ష్యంగా ఉండకండి
  rationale: ఈ సందర్భంలో క్రియ అలసత్వం, అశ్రద్ధ లేదా విధినిర్వహణలో నిర్లక్ష్యాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఈ ఎంపిక సహజంగా, స్పష్టంగా ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: לַעֲמֹד לְפָנָיו
  choice: తన సన్నిధిలో నిలబడడానికి
  rationale: దేవుని సమక్షంలో యాజక సేవకు హాజరై ఉండడాన్ని సూచించే ఆరాధనా ప్రయోగంలోని ‘నిలబడడం’ అనే రూపకాన్ని నిలుపుతుంది.
- source_word: לְשָׁרְתוֹ
  choice: తనకు పరిచర్య చేయడానికి
  rationale: שרת అనే పదానికి ఈ ఆలయ సందర్భంలో ఉన్న ప్రత్యేక ఆరాధనా సేవ భావాన్ని ‘సేవ’ కంటే స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְלִהְיוֹת לוֹ מְשָׁרְתִים
  choice: తన పరిచారకులుగా ఉండడానికి
  rationale: నియమిత హోదా మరియు విధి రెండింటినీ తెలిపే హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וּמַקְטִרִים
  choice: ధూపం వేయడానికి
  rationale: ఆలయ సందర్భంలో קטר హిఫిల్ రూపం ధూపాన్ని పొగగా పైకి ఎగసేలా అర్పించడాన్ని సూచిస్తుంది; తెలుగులో ‘ధూపం వేయడం’ సహజమైన ఆరాధనా ప్రయోగం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపం దానిని బిరుదుగా మార్చకుండా నిలుపుతుంది.
- issue: לַעֲמֹד לְפָנָיו అనే యాజక ప్రయోగం
  choice: తన సన్నిధిలో నిలబడడానికి
  alternative: తన ఎదుట సేవ చేయడానికి
  rationale: ‘నిలబడడం’ మరియు ‘పరిచర్య చేయడం’ మూలంలో వేర్వేరు, వరుస భావాలు; వాటిని కలపకుండా ఉంచడం యాజక సేవ చిత్రణను, వాక్య నిర్మాణాన్ని కాపాడుతుంది.
- issue: ముగింపు భాగంలోని రెండు కర్తవ్యాల సంబంధం
  choice: తన పరిచారకులుగా ఉండడానికి, ధూపం వేయడానికి
  alternative: తన పరిచారకులుగాను ధూపం వేసేవారుగాను ఉండడానికి
  rationale: రెండు హీబ్రూ కృదంతాల సమాంతర పాత్రాభివ్యక్తిని తెలుగు సహజత్వం కోసం కర్తవ్యాలుగా వ్యక్తం చేసింది; ప్రత్యామ్నాయం పదరూప సమాంతరతను మరింత ప్రత్యక్షంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. యాజక సందర్భానికి తగిన ‘పరిచర్య’, ‘పరిచారకులు’, ‘ధూపం వేయడం’ అనే పదాలను ఉపయోగించాం; అనవసరంగా ప్రాచీన లేదా మతశాఖాపరమైన పదజాలాన్ని చేర్చలేదు.
