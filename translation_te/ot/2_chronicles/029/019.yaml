source:
  edition: WLC
  text: וְ/אֵ֣ת כָּל הַ/כֵּלִ֗ים אֲשֶׁ֣ר הִזְנִיחַ֩ הַ/מֶּ֨לֶךְ אָחָ֧ז בְּ/מַלְכוּת֛/וֹ בְּ/מַעֲל֖/וֹ הֵכַ֣נּוּ וְ/הִקְדָּ֑שְׁנוּ וְ/הִנָּ֕/ם לִ/פְנֵ֖י מִזְבַּ֥ח יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/019.yaml
  text: And all the vessels that King Ahaz cast aside during his reign in his unfaithfulness[a], we have prepared and consecrated; and behold[b], they are before the altar of Yahweh.
translation:
  language: te
  text: “అహాజు రాజు తన పాలనలో తన విశ్వాసద్రోహంలో[b] పక్కన పెట్టివేసిన[a] ఉపకరణాలన్నిటినీ మేము సిద్ధం చేసి పవిత్రపరిచాము; ఇదిగో, అవి యహ్వే బలిపీఠం ఎదుట ఉన్నాయి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిర్లక్ష్యం చేసిన” లేదా “విసర్జించిన.”
    reason: lexical_alternative
  - marker: b
    text: “తన విశ్వాసద్రోహంలో” అనే మాటకు “తన అపరాధంలో” లేదా “తన అవిశ్వాసంలో” అని కూడా అనువదించవచ్చు. హీబ్రూ పదం దేవునిపట్ల విశ్వాసాన్ని ఉల్లంఘించడాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּלִים
  choice: ఉపకరణాలు
  rationale: ఈ పదం సాధనాలు, పాత్రలు, సామగ్రి అనే విస్తృత అర్థం కలిగి ఉంది. ఆలయ సందర్భంలో ‘ఉపకరణాలు’ సహజంగా ఉండి, పాత్రలకు మాత్రమే అర్థాన్ని పరిమితం చేయదు.
- source_word: הִזְנִיחַ
  choice: పక్కన పడేసిన
  rationale: ఉద్దేశపూర్వకంగా విసర్జించడం లేదా వాడకుండా పక్కన పెట్టడం అనే బలాన్ని ఇది తెలియజేస్తుంది; కేవలం ‘నిర్లక్ష్యం చేసిన’ కంటే మూలంలోని క్రియాశీల భావాన్ని బాగా నిలుపుతుంది.
- source_word: בְּמַלְכוּתוֹ
  choice: తన పాలనలో
  rationale: ఇక్కడ రాజరికాన్ని సూచించే పదబంధం కాలార్థకంగా ఉంది; ‘తన పాలనలో’ ఆధునిక తెలుగులో సహజమైన సంక్షిప్త రూపం.
- source_word: בְּמַעֲלוֹ
  choice: విశ్వాసద్రోహం చేస్తూ
  rationale: מַעַל దేవునిపట్ల విధేయతను ఉల్లంఘించడం, నమ్మకద్రోహం చేయడం అనే మతపరమైన-నైతిక భావాన్ని కలిగి ఉంది. క్రియారూపం తెలుగులో సందర్భాన్ని సహజంగా కలుపుతుంది.
- source_word: הֵכַנּוּ
  choice: మేము సిద్ధం చేసి
  rationale: ఆలయ సేవకు వాటిని తిరిగి సిద్ధం చేయడం లేదా సక్రమంగా అమర్చడం అనే భావాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: וְהִקְדָּשְׁנוּ
  choice: పవిత్రపరిచాము
  rationale: పవిత్రమైన ఉపయోగం కోసం ప్రత్యేకపరచడం అనే హిఫిల్ భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: וְהִנָּם
  choice: ఇదిగో, అవి
  rationale: ప్రస్తుతం వారి ఎదుట ఉన్న ఉపకరణాలపై దృష్టి మళ్లించే హీబ్రూ సూచనాత్మక బలాన్ని నిలుపుతుంది.
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: యహ్వే బలిపీఠం ఎదుట
  rationale: לִפְנֵי కి ‘ఎదుట’ సహజ సమానం; యహ్వే అనే రూపం మూలంలోని దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: מַעַל లోని నిబంధనాత్మక విశ్వాసభంగ భావం
  choice: విశ్వాసద్రోహం
  alternative: అపరాధం / అవిశ్వాసం
  rationale: ‘విశ్వాసద్రోహం’ సాధారణ తప్పు కంటే దేవునిపట్ల నమ్మకాన్ని ఉల్లంఘించిన భావాన్ని స్పష్టంగా నిలుపుతుంది; అయితే మూలపదం అపరాధం లేదా అవిశ్వాసం అనే ఛాయలనూ కలిగి ఉంది.
- issue: יהוה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. ‘యహ్వే’ దానిని బిరుదుగా మార్చకుండా, విస్తృతంగా అంగీకరించిన పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘ఉపకరణాలు’ అనే విస్తృత పదం ఆలయ పాత్రలు మరియు ఇతర సామగ్రి రెండింటినీ చేర్చుతుంది. మూలంలోని ప్రత్యక్ష వాక్యభావం, ‘ఇదిగో’ అనే దృష్ట్యాకర్షణ, దైవనామం నిలుపబడ్డాయి.
