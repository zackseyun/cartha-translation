revisions:
- from: “అహాజు రాజు తన పాలనలో విశ్వాసద్రోహం చేస్తూ పక్కన పడేసిన[a] ఉపకరణాలన్నిటినీ మేము సిద్ధం చేసి పవిత్రపరిచాము. ఇదిగో, అవి యహ్వే బలిపీఠం ఎదుట ఉన్నాయి.”[b]
  to: “అహాజు రాజు తన పాలనలో తన విశ్వాసద్రోహంలో[b] పక్కన పెట్టివేసిన[a] ఉపకరణాలన్నిటినీ మేము సిద్ధం చేసి పవిత్రపరిచాము; ఇదిగో, అవి యహ్వే బలిపీఠం ఎదుట ఉన్నాయి.”
