id: 2CH.29.6
reference: 2 Chronicles 29:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי מָעֲל֣וּ אֲבֹתֵ֗י/נוּ וְ/עָשׂ֥וּ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֵ֖י/נוּ וַ/יַּֽעַזְבֻ֑/הוּ וַ/יַּסֵּ֧בּוּ פְנֵי/הֶ֛ם מִ/מִּשְׁכַּ֥ן יְהוָ֖ה וַ/יִּתְּנוּ עֹֽרֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/006.yaml
  text: For our fathers acted unfaithfully and did what was evil in the eyes of Yahweh our God[a]. They abandoned him, turned their faces away from the dwelling place of Yahweh[c][b], and turned their backs.
translation:
  language: te
  text: ఎందుకంటే మన పితరులు నమ్మకద్రోహం చేసి, మన దేవుడైన యాహ్వే దృష్టిలో చెడ్డది చేశారు.[a] వారు ఆయన్ని విడిచిపెట్టి, యాహ్వే నివాసస్థలం నుండి తమ ముఖాలను తిప్పుకొని,[b] వీపు చూపారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘విశ్వాసఘాతుకంగా ప్రవర్తించారు’ / ‘ద్రోహం చేశారు’; హీబ్రూ క్రియ, ముఖ్యంగా నిబంధన సంబంధ విషయాల్లో, నమ్మకాన్ని భంగపరచే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: ‘యాహ్వే నివాసస్థలం నుండి.’ מִשְׁכָּן అనే పదానికి ‘గుడారం’ లేదా ‘నివాస గుడారం’ అనే అర్థం కూడా ఉండవచ్చు; అయితే ఇక్కడ అది యాహ్వే నివాసమైన ఆలయాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా ‘మెడను ఇచ్చారు.’ ఈ నుడికారం తిరస్కారంతో లేదా తిరుగుబాటుతో వెనుదిరగడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעֲלוּ
  choice: నమ్మకద్రోహంగా ప్రవర్తించి
  rationale: ఈ క్రియ విశ్వాసాన్ని భంగపరచడం లేదా ద్రోహంగా ప్రవర్తించడం అనే భావాన్ని, ముఖ్యంగా నిబంధన సంబంధ సందర్భాల్లో, తెలియజేస్తుంది. ఈ తెలుగు పదబంధం ఆ నైతిక-మతపరమైన బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: הָרַע
  choice: చెడ్డది
  rationale: עָשׂוּ הָרַע అనే హీబ్రూ ప్రయోగానికి ‘చెడ్డది చేశారు’ అనేది సహజమైన, అర్థవంతమైన తెలుగు రూపం.
- source_word: בְּעֵינֵי יְהוָה
  choice: యాహ్వే దృష్టిలో
  rationale: హీబ్రూలో అక్షరార్థంగా ‘యాహ్వే కళ్లలో’ ఉన్న రూపకాన్ని తెలుగులో సహజంగా వ్యక్తపరచే సాధారణ ప్రయోగం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవిక నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: וַיַּעַזְבֻהוּ
  choice: వారు ఆయన్ని విడిచిపెట్టి
  rationale: עזב ఇక్కడ దేవునితో ఉన్న సంబంధాన్ని, నిబంధన విశ్వాసాన్ని వదిలివేయడాన్ని సూచిస్తుంది; ‘విడిచిపెట్టి’ స్పష్టమైన ఆధునిక తెలుగు.
- source_word: וַיַּסֵּבּוּ פְנֵיהֶם
  choice: తమ ముఖాలను తిప్పుకొని
  rationale: ఉద్దేశపూర్వకంగా దూరమవుతున్న దృశ్యరూపాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: מִמִּשְׁכַּן יְהוָה
  choice: యాహ్వే నివాసస్థలం నుండి
  rationale: מִשְׁכָּן యొక్క మూలార్థం ‘నివాసస్థలం.’ ఈ సందర్భంలో అది అరణ్యకాలపు ప్రత్యక్ష గుడారమే అని తప్పుగా సూచించకుండా, ఆలయాన్ని యాహ్వే నివాసంగా పేర్కొనే భావాన్ని నిలుపుతుంది.
- source_word: וַיִּתְּנוּ עֹרֶף
  choice: వీపు చూపారు
  rationale: అక్షరార్థంగా ‘మెడను ఇచ్చారు’ అనే హీబ్రూ నుడికారం తిరస్కారంతో వెనుదిరగడాన్ని సూచిస్తుంది. ‘వీపు చూపారు’ అదే చిత్రాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవిక నామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవిక నామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని బిరుదుతో భర్తీ చేయకుండా నిలుపుతుంది.
- issue: ఆలయ సందర్భంలో מִשְׁכָּן అర్థం
  choice: నివాసస్థలం
  alternative: ప్రత్యక్ష గుడారం / పరిశుద్ధ స్థలం
  rationale: ఈ వాక్య సందర్భం ఆలయానికి సంబంధించినది. ‘నివాసస్థలం’ మూలపదార్థాన్ని కాపాడుతూ, అది తప్పనిసరిగా మోషే కాలపు ప్రత్యక్ష గుడారమే అన్న అపార్థాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి వాడబడింది. ‘ఆయన్ని’ అనేది దేవుని సూచించే గౌరవ ఏకవచన రూపం. హీబ్రూ దృశ్యరూపాలైన ముఖం తిప్పుకోవడం, వీపు చూపడం నిలుపబడ్డాయి.
