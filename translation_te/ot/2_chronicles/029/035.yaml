id: 2CH.29.35
reference: 2 Chronicles 29:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/גַם עֹלָ֨ה לָ/רֹ֜ב בְּ/חֶלְבֵ֧י הַ/שְּׁלָמִ֛ים וּ/בַ/נְּסָכִ֖ים לָ/עֹלָ֑ה וַ/תִּכּ֖וֹן עֲבוֹדַ֥ת בֵּית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/035.yaml
  text: And the burnt offerings were also in abundance[a], with the fat of the peace offerings and the drink offerings for the burnt offerings. So the service of the house of Yahweh was established.
translation:
  language: te
  text: దహనబలులు కూడా విస్తారంగా అర్పించబడ్డాయి. వాటితో పాటు సమాధాన బలుల[a] కొవ్వు భాగాలు, దహనబలులకు సంబంధించిన పానార్పణలు కూడా అర్పించబడ్డాయి. ఈ విధంగా యెహోవా మందిర సేవ క్రమబద్ధమైంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సహవాస బలులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: కూడా
  rationale: ముందటి సందర్భానికి ఈ వాక్యాన్ని జోడించే భావాన్ని సహజమైన తెలుగు పదక్రమంలో తెలియజేస్తుంది.
- source_word: עֹלָה
  choice: దహనబలులు
  rationale: రూపరీత్యా ఏకవచనమైనా, לָרֹבతో కలిసి ఇక్కడ సమూహార్థంలో అనేక బలులను సూచిస్తుంది.
- source_word: לָרֹב
  choice: విస్తారంగా
  rationale: పెద్ద పరిమాణం లేదా అధిక సంఖ్యను సూచించే హెబ్రీయ ప్రయోగానికి సహజమైన తెలుగు రూపం.
- source_word: בְּחֶלְבֵי
  choice: వాటితో పాటు ... కొవ్వు భాగాలు
  rationale: బలి సందర్భంలో חלב సాధారణ కొవ్వును కాక, దేవునికి అర్పించే నిర్దిష్ట కొవ్వు భాగాలను సూచిస్తుంది; בְּ అనుబంధ భావాన్ని ఇస్తుంది.
- source_word: הַשְּׁלָמִים
  choice: సమాధాన బలులు
  rationale: హెబ్రీయ బలి విధానంలోని ప్రత్యేక వర్గాన్ని తెలిపే సుపరిచితమైన పదబంధం; ‘సహవాస బలులు’ అనే అర్థసాధ్యతను పాదసూచికలో ఉంచింది.
- source_word: וּבַנְּסָכִים
  choice: పానార్పణలు కూడా
  rationale: నైవేద్యంగా పోసే ద్రవ అర్పణలను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לָעֹלָה
  choice: దహనబలులకు సంబంధించిన
  rationale: ఈ పానార్పణలు దహనబలులతో అనుబంధంగా ఉన్నాయని తెలిపే לְ భావాన్ని ప్రతిబింబిస్తుంది.
- source_word: וַתִּכּוֹן
  choice: క్రమబద్ధమైంది
  rationale: כון నిఫాల్ రూపంలోని ‘సరిగా ఏర్పాటు చేయబడింది/స్థాపించబడింది’ అనే ఫలితార్థాన్ని మందిర సేవ సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: עֲבוֹדַת בֵּית יְהוָה
  choice: యెహోవా మందిర సేవ
  rationale: హెబ్రీయ సమాసంలోని ఆరాధనా-సేవ భావాన్ని సంక్షిప్తంగా, పారదర్శకంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హెబ్రీయ మూలంలోని దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచిత రూపంలో ఇస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా ప్రత్యక్షంగా ప్రతిబింబిస్తుంది.
- issue: שְׁלָמִים అనే బలి పదం
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు
  rationale: హెబ్రీయ బలి వర్గాన్ని సంప్రదాయబద్ధంగా గుర్తింపజేస్తూ, దానిని కేవలం సామూహిక సహవాసం అనే ఒకే వ్యాఖ్యానానికి పరిమితం చేయదు; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే బలి ఆచారానికి తగిన గంభీరతతో రూపొందించబడింది. హెబ్రీయ వాక్యంలో స్పష్టంగా లేని క్రియను తెలుగులో సహజత కోసం ‘అర్పించబడ్డాయి’గా పూరించి, భావాన్ని మార్చకుండా ఉంచింది.
