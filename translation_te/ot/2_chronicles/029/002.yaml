source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה דָּוִ֥יד אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/002.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that David his father had done.
translation:
  language: te
  text: తన తండ్రియైన దావీదు చేసినదంతటికీ అనుగుణంగా అతడు యాహ్వే దృష్టిలో సరైనది చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: עשה క్రియ యొక్క కథనరూపం. ఆధునిక తెలుగు వాక్యప్రవాహంలో ఆరంభ సంధికార్థాన్ని విడిగా చూపకుండా సహజంగా అనువదించబడింది.
- source_word: הַיָּשָׁר
  choice: సరైనది
  rationale: నిర్దిష్ట విశేషణం ఇక్కడ నామవాచకార్థంలో ‘సరైనది/నీతియైనది’ అని పనిచేస్తుంది; ‘సరైనది’ సాధారణ పాఠకులకు సహజంగా ఉండి రాజులపై చేసే నైతిక మూల్యాంకనాన్ని నిలుపుతుంది.
- source_word: בְּעֵינֵי
  choice: దృష్టిలో
  rationale: అక్షరార్థంగా ‘కళ్లలో’ అనే హీబ్రూ నుడికారానికి తెలుగు సహజ సమానార్థకం; యాహ్వే మూల్యాంకన దృష్టికోణాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ శాస్త్రీయ ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణను ఉపయోగించింది.
- source_word: כְּכֹל אֲשֶׁר
  choice: చేసినదంతటి ప్రకారం
  rationale: כְּ యొక్క అనురూపత భావాన్నీ כֹל యొక్క సంపూర్ణత భావాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: דָּוִיד
  choice: దావీదు
  rationale: తెలుగులో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: אָבִיו
  choice: తన తండ్రి
  rationale: హీబ్రూ బంధుత్వ పదాన్ని ప్రధాన పాఠ్యంలో నేరుగా నిలిపింది; ఇక్కడ అది తక్షణ జనకునికన్నా వంశపూర్వికుడిని సూచించే అవకాశాన్ని పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలరూపాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: ‘తన తండ్రి దావీదు’ అనే రాజవంశీయ ప్రయోగం
  choice: ప్రధాన పాఠ్యంలో ‘తన తండ్రి దావీదు’ అని ఉంచి పాదసూచికలో వంశపూర్విక అర్థాన్ని తెలపడం
  alternative: తన పూర్వికుడు దావీదు
  rationale: אָבִיו అనే మూలపదం ‘తండ్రి’ మరియు విస్తృతంగా ‘పూర్వికుడు’ అనే అర్థాలను కలిగి ఉంది. హిజ్కియా సందర్భంలో దావీదు తక్షణ తండ్రి కాదు; అయినా రాజవంశీయ కుటుంబ భాషను ప్రధాన పాఠ్యంలో నిలపడం మూలంలోని భావతీవ్రతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం వాడబడింది. హీబ్రూ మూలంలోని మూల్యాంకన సూత్రం మరియు రాజవంశీయ బంధుత్వ భాష నిలుపబడ్డాయి.
