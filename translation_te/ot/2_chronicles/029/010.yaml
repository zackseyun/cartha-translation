id: 2CH.29.10
reference: 2 Chronicles 29:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַתָּה֙ עִם לְבָבִ֔/י לִ/כְר֣וֹת בְּרִ֔ית לַ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/יָשֹׁ֥ב מִמֶּ֖/נּוּ חֲר֥וֹן אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/010.yaml
  text: Now it is in my heart to make a covenant with Yahweh[a], the God of Israel, so that his burning anger may turn away from us.
translation:
  language: te
  text: ఇప్పుడు ఇశ్రాయేలు దేవుడైన యాహ్వేతో నిబంధన చేయాలనే సంకల్పం నా హృదయంలో ఉంది[a], తద్వారా ఆయన మండే కోపం మననుండి తొలగిపోవునట్లు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నిబంధనను కోయడం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: హిజ్కియా సంకల్పంలోని తక్షణతను సహజంగా తెలియజేస్తుంది.
- source_word: עִם לְבָבִי
  choice: నా హృదయంలో ఉంది
  rationale: అంతరంగ ఉద్దేశాన్ని తెలిపే హీబ్రూ రూపకాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: לִכְרֹת בְּרִית
  choice: నిబంధన చేయాలని
  rationale: హీబ్రూలో అక్షరార్థంగా ‘నిబంధనను కోయడం’; తెలుగులో ‘నిబంధన చేయడం’ సహజమైన ప్రయోగం. అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: לַיהוָה
  choice: యెహోవాతో
  rationale: నిబంధనలో భాగస్వామిని తెలుగులో సహజంగా సూచిస్తూ, יהוה అనే దైవనామాన్ని యెహోవా అని లిప్యంతరీకరిస్తుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: దైవనామానికి ముందు సహజమైన తెలుగు విశేషణ నిర్మాణంలో ఇశ్రాయేలుతో దేవుని సంబంధాన్ని తెలియజేస్తుంది.
- source_word: וְיָשֹׁב
  choice: అప్పుడు ... తొలగిపోవచ్చు
  rationale: వావ్‌తో కూడిన క్రియలో సందర్భానుసారంగా ఉన్న ఆశించిన ఫలిత భావాన్ని తెలియజేస్తుంది; ఫలితం నిశ్చయమేనని బలవంతంగా చెప్పదు.
- source_word: מִמֶּנּוּ
  choice: మనమీద నుంచి
  rationale: మొదటి పురుష బహువచనాన్ని, కోపం ఎవరి మీద నుంచి తొలగాలో తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: חֲרוֹן אַפּוֹ
  choice: ఆయన మండే కోపం
  rationale: దైవకోపంలోని వేడి, తీవ్రత అనే హీబ్రూ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా తెలుగులో విస్తృతంగా గుర్తింపున్న ‘యెహోవా’ రూపంలో అందించాం; ఉచ్చారణ పునర్నిర్మాణాన్ని నిర్బంధంగా నిర్ణయించలేదు.
- issue: וְיָשֹׁב యొక్క భావం
  choice: ఆశించిన ఫలితంగా ‘తొలగిపోవచ్చు’
  alternative: ‘తొలగిపోతుంది’ లేదా ‘తొలగిపోయేలా’
  rationale: హిజ్కియా నిబంధన చేయాలనే సంకల్పానికి అనుసరించే ఉద్దేశం/ఆశించిన ఫలితాన్ని చూపిస్తూ, హీబ్రూ రూపంలో ఉన్న భావసూక్ష్మతను అతిగా నిశ్చయార్థకంగా చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. హీబ్రూ హృదయ రూపకాన్ని నిలిపి, నిబంధనకు సంబంధించిన అసహజమైన అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
