  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֞י מִסְפַּ֣ר הָ/עֹלָה֮ אֲשֶׁ֣ר הֵבִ֣יאוּ הַ/קָּהָל֒ בָּקָ֣ר שִׁבְעִ֔ים אֵילִ֥ים מֵאָ֖ה כְּבָשִׂ֣ים מָאתָ֑יִם לְ/עֹלָ֥ה לַ/יהוָ֖ה כָּל אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/032.yaml
  text: And the number of the burnt offerings that the assembly brought was seventy cattle, one hundred rams, and two hundred lambs; all these were for a burnt offering to the LORD.
translation:
  language: te
  text: 'సమాజం తీసుకొచ్చిన దహనబలుల సంఖ్య: డెబ్బై పశువులు, వంద పొట్టేళ్లు, రెండువందల గొర్రెపిల్లలు; ఇవన్నీ యెహోవాకు దహనబలుల కోసం.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֹלָה / לְעֹלָה
  choice: దహనబలులు / దహనబలులుగా
  rationale: మూలపదం పూర్తిగా దహించబడే బలిని సూచిస్తుంది; తెలుగులో స్థిరమైన, స్పష్టమైన బైబిలు పరిభాషను ఉపయోగించాం.
- source_word: הַקָּהָל
  choice: సమాజం
  rationale: ఆరాధన కోసం కూడిన ప్రజాసమూహాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: בָּקָר
  choice: పశువులు
  rationale: ఈ సామూహిక నామవాచకం ఆవు జాతి పశువులను సూచిస్తుంది; లింగాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా మూలంలోని విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: אֵילִים
  choice: పొట్టేళ్లు
  rationale: బలికి తెచ్చిన మగ గొర్రెలను ఖచ్చితంగా సూచిస్తుంది.
- source_word: כְּבָשִׂים
  choice: గొర్రెపిల్లలు
  rationale: చిన్న గొర్రెలను సూచించే సహజమైన తెలుగు పదం.
- source_word: יהוה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని తెలుగులో సుపరిచితమైన రూపంలో వ్యక్తపరుస్తుంది; సాధారణ బిరుదుగా మార్చకుండా వ్యక్తిగత నామ స్వభావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో సాధారణ బిరుదు కాకుండా ప్రత్యేక దైవనామం ఉంది; దానిని తెలుగులో గుర్తించదగిన నామరూపంతో నిలుపుట మూలానికి దగ్గరగా ఉంటుంది.
- issue: בקר అనే సామూహిక పదానికి లింగ నిర్దిష్టత
  choice: పశువులు
  alternative: ఎద్దులు
  rationale: ఈ వచనంలోని పదం స్వయంగా మగ పశువులనే తప్పనిసరిగా నిర్దిష్టం చేయదు; కాబట్టి మూలంలోని విస్తృతతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభమైన శైలి. హీబ్రూ వాక్యంలోని సంఖ్యల జాబితాను స్పష్టంగా ఉంచి, చివరి ఉద్దేశ్య వాక్యాన్ని సహజ తెలుగు వాక్య నిర్మాణంలో ఇచ్చాం.
