source:
  edition: WLC
  text: וַ֠/יֹּאמֶר יְחִזְקִיָּ֨הוּ הַ/מֶּ֤לֶךְ וְ/הַ/שָּׂרִים֙ לַ/לְוִיִּ֔ם לְ/הַלֵּל֙ לַֽ/יהוָ֔ה בְּ/דִבְרֵ֥י דָוִ֖יד וְ/אָסָ֣ף הַ/חֹזֶ֑ה וַֽ/יְהַלְלוּ֙ עַד לְ/שִׂמְחָ֔ה וַֽ/יִּקְּד֖וּ וַ/יִּֽשְׁתַּחֲוֽוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/030.yaml
  text: Then Hezekiah the king and the officials told the Levites to praise Yahweh with the words of David and of Asaph the seer[a]. So they praised with gladness[b], and they bowed down and worshiped.
translation:
  language: te
  text: అప్పుడు రాజైన హిజ్కియా మరియు అధికారులు లేవీయులకు దావీదు మరియు దర్శి ఆసాపు మాటలతో యహ్వేను స్తుతించాలని చెప్పారు.[a] వారు ఆనందంతో స్తుతించి,[b] వంగి ఆరాధించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దావీదు మరియు దర్శి ఆసాపు మాటల ప్రకారం యహ్వేను స్తుతించాలని.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “ఆనందం వరకు” లేదా “ఆనందానికి”; వారి స్తుతి ఆనందంతో నిండిందనేది భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: చెప్పారు
  rationale: మూల క్రియ అక్షరార్థంగా ‘చెప్పాడు’ అయినా, ‘స్తుతించాలని లేవీయులకు చెప్పారు’ అనే నిర్మాణం ఆదేశాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘ఆజ్ఞాపించారు’ అనడం మూలంలో లేని తీవ్రతను చేర్చవచ్చు.
- source_word: הַמֶּלֶךְ וְהַשָּׂרִים
  choice: రాజైన హిజ్కియా, అధికారులు
  rationale: שׂרים ఇక్కడ పాలనా నాయకులు లేదా అధికారులను సూచిస్తుంది. ‘అధికారులు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: לְהַלֵּל
  choice: స్తుతించాలని
  rationale: ఆరాధనా సందర్భంలో הלל అంటే స్తుతించడం. పాట పాడారనే భావం సందర్భంలో ఉండవచ్చుగానీ క్రియలో తప్పనిసరిగా లేదు.
- source_word: לַיהוָה
  choice: యహ్వేను
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ‘యహ్వే’గా లిప్యంతరీకరించాం.
- source_word: בְּדִבְרֵי דָוִיד וְאָסָף הַחֹזֶה
  choice: దావీదు మాటలతో, దర్శియైన ఆసాపు మాటలతో
  rationale: בְּ అనే ఉపసర్గను ప్రధానార్థంగా ‘తో’ అని, דִּבְרֵיను ‘మాటలు’ అని అనువదించడం మూలానికి దగ్గరగా ఉండి తెలుగులో సహజంగా ఉంది. ‘పాటలు’ అనడం మూలపదం కంటే సంకుచితమైన వ్యాఖ్యానం.
- source_word: הַחֹזֶה
  choice: దర్శియైన
  rationale: חֹזֶה ప్రవచన సంబంధమైన చారిత్రక బిరుదు; ‘దర్శి’ దాని ప్రత్యేక భావాన్ని నిలుపుతుంది.
- source_word: עַד לְשִׂמְחָה
  choice: ఆనందంతో
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఆనందం వరకు/ఆనందానికి’ అన్నట్లున్నా, సందర్భంలో ఆనందంతో కూడిన స్తుతిని సూచిస్తుంది. సహజమైన తెలుగులో ‘ఆనందంతో’ ఆ భావాన్ని ఇస్తుంది; మూలంలోని అసాధారణ నిర్మాణాన్ని పాదసూచికలో నిలిపాం.
- source_word: וַיִּקְּדוּ וַיִּשְׁתַּחֲווּ
  choice: వంగి ఆరాధించారు
  rationale: మొదటి క్రియ శరీరంతో వంగడాన్ని, రెండవది ఆరాధనను సూచిస్తుంది. తెలుగులో రెండు చర్యలనూ సంక్షిప్తంగా, వేరువేరుగా నిలిపాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం దైవనామాన్ని ప్రత్యక్షంగా ఉపయోగిస్తుంది. ‘యహ్వే’ దానిని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించిన ఉచ్చారణకు దగ్గరగా నిలుపుతుంది.
- issue: చివరి భాగంలోని శరీర భంగిమ, ఆరాధన మధ్య సంబంధం
  choice: వంగి ఆరాధించారు అనే రెండు సంబంధిత చర్యలు
  alternative: ఆరాధిస్తూ సాష్టాంగపడ్డారు అనే ఒక సంయుక్త భావం
  rationale: హీబ్రూలో రెండు వేరు క్రియలు ఉన్నాయి. వాటిని ఒకే చర్యగా కలపకుండా శరీరంతో వంగడం, ఆరాధించడం రెండింటినీ అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘దర్శి’ వంటి చారిత్రక-ప్రవచన బిరుదును నిలిపి, మిగతా వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు సులభంగా ఉంచాం.
