revisions:
- from: అప్పుడు రాజైన హిజ్కియా, అధికారులు దావీదు మాటలతో, దర్శియైన ఆసాపు మాటలతో యహ్వేను స్తుతించాలని లేవీయులకు చెప్పారు.[a] వారు ఆనందంతో స్తుతించి,[b] వంగి ఆరాధించారు.
