id: 2CH.29.27
reference: 2 Chronicles 29:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ חִזְקִיָּ֔הוּ לְ/הַעֲל֥וֹת הָ/עֹלָ֖ה לְ/הַ/מִּזְבֵּ֑חַ וּ/בְ/עֵ֞ת הֵחֵ֣ל הָֽ/עוֹלָ֗ה הֵחֵ֤ל שִׁיר יְהוָה֙ וְ/הַ/חֲצֹ֣צְר֔וֹת וְ/עַ֨ל יְדֵ֔י כְּלֵ֖י דָּוִ֥יד מֶֽלֶךְ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/027.yaml
  text: Then Hezekiah commanded to offer up the burnt offering on the altar[a]. And at the time the burnt offering began, the song of Yahweh began also[b], with the trumpets and by means of the instruments of David king of Israel.
translation:
  language: te
  text: అప్పుడు హిజ్కియా బలిపీఠం మీద దహనబలిని అర్పించాలని ఆజ్ఞాపించాడు.[b] దహనబలి ప్రారంభమైన వేళ, యాహ్వే గీతం కూడా బాకాలతోను, ఇశ్రాయేలు రాజైన దావీదు సంగీత వాద్యాలతోను ప్రారంభమైంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వేకు గీతం.” హెబ్రీలో అక్షరార్థంగా “యాహ్వే గీతం” అని ఉంది.
    reason: alternative_reading
  - marker: b
    text: మరింత అక్షరార్థంగా, “అర్పించమని చెప్పాడు.”
    reason: previous_rendering
lexical_decisions:
- source_word: וַיֹּאמֶר ... לְהַעֲלוֹת
  choice: అర్పించాలని ఆజ్ఞాపించాడు
  rationale: אמר అనే క్రియ సాధారణంగా ‘చెప్పాడు’ అని అర్థమైనా, లామెద్‌తో కూడిన క్రియార్థక రూపం ఇక్కడ రాజాజ్ఞను సూచిస్తుంది. తెలుగులో సహజంగా ఆ నిర్దేశక భావాన్ని తెలియజేయడానికి ఈ రూపం ఎంచుకున్నాం.
- source_word: הָעֹלָה
  choice: దహనబలి
  rationale: పూర్తిగా దహనం చేసే బలిని సూచించే ప్రామాణిక ఆరాధనా పదానికి స్పష్టమైన, స్థిరమైన తెలుగు సమానం.
- source_word: לְהַמִּזְבֵּחַ
  choice: బలిపీఠం మీద
  rationale: బలి అర్పించబడే స్థలాన్ని నేరుగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הֵחֵל ... הֵחֵל
  choice: మొదలైన ... మొదలైంది
  rationale: దహనబలి ప్రారంభం, గీతం ప్రారంభం ఒకేసారి జరిగినట్లు చూపే హెబ్రీ పునరుక్తిని తెలుగులోనూ నిలిపింది.
- source_word: שִׁיר יְהוָה
  choice: యాహ్వే గీతం
  rationale: ‘యాహ్వేకు చెందిన గీతం’ లేదా ‘యాహ్వేకు పాడిన గీతం’ అనే రెండింటికీ వీలున్న హెబ్రీ సంబంధపదబంధంలోని అస్పష్టతను పరిష్కరించకుండా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: הַחֲצֹצְרוֹת
  choice: బాకాలు
  rationale: ఆరాధనలో ఉపయోగించే లోహపు ఊదువాద్యాలను సూచించే సహజమైన తెలుగు పదం; మూలంలో లేని ‘వెండి’ అనే వివరాన్ని చేర్చలేదు.
- source_word: וְעַל יְדֵי כְּלֵי דָּוִיד
  choice: దావీదు వాద్యపరికరాల ద్వారా
  rationale: ఈ ఆరాధనా సందర్భంలో כְּלֵי అనేది సంగీత వాద్యాలను, עַל־יְדֵי అనేది సాధనాన్ని సూచిస్తాయి.
theological_decisions:
- issue: יהוה అనే దైవ నామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామం నేరుగా ఉంది; దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
- issue: שִׁיר יְהוָה యొక్క సంబంధార్థం
  choice: యాహ్వే గీతం
  alternative: యాహ్వేకు గీతం
  rationale: హెబ్రీ నిర్మాణం స్వామ్యాన్ని, అనుబంధాన్ని లేదా గీతం ఎవరికి ఉద్దేశించబడిందో సూచించవచ్చు. ప్రధాన పాఠం ఆ ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది; దిశార్థక పఠనాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: וַיֹּאמֶר ... לְהַעֲלוֹת యొక్క నిర్దేశక బలం
  choice: అర్పించాలని ఆజ్ఞాపించాడు
  alternative: అర్పించమని చెప్పాడు
  rationale: אמר ఒక్కటే ‘చెప్పాడు’ అయినప్పటికీ, ఈ వాక్యనిర్మాణం సందర్భంలో రాజు ఇచ్చిన నిర్దేశాన్ని సూచిస్తుంది. ‘ఆజ్ఞాపించాడు’ తెలుగులో ఆ సమగ్ర భావాన్ని సహజంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘దహనబలి,’ ‘బలిపీఠం’ వంటి పరిచిత బైబిలు పదజాలాన్ని నిలిపి, అసహజమైన పదానువాదాన్ని నివారించాం. మూలంలోని రెండు ‘మొదలు’ క్రియల సమాంతరతను కాపాడాం.
