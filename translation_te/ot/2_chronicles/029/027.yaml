    reason: previous_rendering
  revision_rationale: The revision retains the directive force of וַיֹּאמֶר לְהַעֲלוֹת, the cultic sense of עֹלָה, the deliberate paired “began” wording, and the ambiguity of שִׁיר יְהוָה. It improves Telugu fluency by simplifying the temporal clause and making the two instrumental accompaniments parallel. Footnote anchors remain attached to the words they explain.
