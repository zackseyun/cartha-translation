  text: וַ/יְהִי֙ קֶ֣צֶף יְהוָ֔ה עַל יְהוּדָ֖ה וִ/ירוּשָׁלִָ֑ם וַ/יִּתְּנֵ֤/ם ל/זועה לְ/שַׁמָּ֣ה וְ/לִ/שְׁרֵקָ֔ה כַּ/אֲשֶׁ֛ר אַתֶּ֥ם רֹאִ֖ים בְּ/עֵינֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/008.yaml
  text: So the wrath of Yahweh came upon Judah and Jerusalem[a], and he made them a horror, a desolation, and an object of hissing[b], as you see with your own eyes.
translation:
  language: te
  text: కాబట్టి యెహోవా ఆగ్రహం యూదా మరియు యెరూషలేము మీదికి వచ్చింది; ఆయన వారిని భయకంపం పుట్టించే దృశ్యంగా[a], పాడుబాటుగా, అపహాస్యపు ఈలలకు గురిగా[b] చేశాడు—మీరు మీ కళ్లతో చూస్తున్నట్టే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘భయానక దృశ్యంగా.’ హెబ్రీ పదం చూసేవారికి భయం లేదా వణుకు పుట్టించే దానిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వెక్కిరింపు ఈలలకు గురిగా.’ ఇది నాశనాన్ని చూసినవారు అవహేళనగా లేదా తిరస్కారంతో వేసే ఈలలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶצֶף
  choice: ఆగ్రహం
  rationale: తీర్పులో వ్యక్తమయ్యే తీవ్రమైన దైవిక కోపాన్ని సహజమైన, గంభీరమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని సాధారణ బిరుదైన ‘ప్రభువు’గా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో ఉంచుతుంది.
- source_word: וַיְהִי ... עַל
  choice: మీదికి వచ్చింది
  rationale: ఆగ్రహం యూదా, యెరూషలేములపైకి రావడం అనే హెబ్రీ నుడికారంలోని ప్రారంభం మరియు తీర్పు భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּתְּנֵם
  choice: వారిని ... చేశాడు
  rationale: ל ఉపసర్గతో వచ్చే ఫలిత స్థితులను తెలుగులో స్పష్టంగా, సహజంగా చూపిస్తుంది; దేవుడే ఆ తీర్పుకు కర్త అన్న భావాన్ని నిలుపుతుంది.
- source_word: לְזוֹעָה
  choice: భయకంపం పుట్టించే దృశ్యంగా
  rationale: ఇతరులు చూసి వణికిపోయేంత భయానక స్థితిని సూచించే పదబలాన్ని నిలుపుతుంది.
- source_word: לְשַׁמָּה
  choice: నిర్జనంగా
  rationale: తీర్పువల్ల కలిగిన పాడుదల, వెలితి అనే భావాన్ని సంక్షిప్తంగా మరియు సులభంగా తెలియజేస్తుంది.
- source_word: וְלִשְׁרֵקָה
  choice: అపహాస్యపు ఈలలకు గురిగా
  rationale: నాశనాన్ని చూసేవారు అవహేళనగా ఈల వేయడం అనే స్పష్టమైన దృశ్యాన్ని, దాని తిరస్కార భావంతో సహా తెలియజేస్తుంది.
- source_word: כַּאֲשֶׁר אַתֶּם רֹאִים בְּעֵינֵיכֶם
  choice: మీరు మీ కళ్లతో చూస్తున్నట్టే
  rationale: ప్రత్యక్షంగా కనబడుతున్న సాక్ష్యాన్ని ఉద్ఘాటించే మూలభాషా పదబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: దైవిక తీర్పు భాషను మృదువుపరచకుండా అనువదించడం
  choice: యెహోవా ఆగ్రహం ... వచ్చింది; ఆయన వారిని ... చేశాడు
  alternative: యెహోవా వారికి కోపించి, వారిని కష్టాలకు అప్పగించాడు
  rationale: హెబ్రీ వాక్యం తీర్పును తీవ్రంగా వర్ణిస్తూ, యెహోవాను దాని ప్రత్యక్ష కర్తగా చూపుతుంది. అనువాదం ఆ ఉద్రిక్తతను తగ్గించకుండా, అదనపు సిద్ధాంత వివరణను చేర్చకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘అపహాస్యపు ఈలలు’ అనే రూపం మూలంలోని స్పష్టమైన దృశ్యాన్ని వివరణాత్మకంగా నిలుపుతుంది.
