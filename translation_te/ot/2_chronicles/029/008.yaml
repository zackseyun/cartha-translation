    issue: The evidential clause is placed before the result clauses.
    rationale: Hebrew places ‘as you see with your own eyes’ after the threefold description of Judah and Jerusalem’s condition. Its final placement gives it the intended concluding force.
  - severity: low
    issue: ‘నిర్జనంగా’ is somewhat narrower than the source term.
    rationale: שַׁמָּה denotes devastation/desolation, not only absence of inhabitants. ‘పాడుబాటుగా’ more naturally includes ruin and wasteland.
