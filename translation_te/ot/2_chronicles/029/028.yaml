translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హెబ్రీ వాక్యంలోని కొనసాగుతున్న సమకాలిక చర్యలను ‘ఉండగా/సాగుతూ/మోగుతూ’ అనే రూపాలతో నిలిపాం.
