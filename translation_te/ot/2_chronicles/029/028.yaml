revisions:
- from: సమాజమంతా సాష్టాంగపడుతూ ఉండగా, గానం సాగుతూ, బూరలు మోగుతూ ఉన్నాయి. దహనబలి ముగిసేంతవరకు ఇదంతా కొనసాగింది.[a]
  to: సమాజమంతా వంగి నమస్కరిస్తూ ఉంది; గానం సాగుతోంది, బూరలు మోగుతున్నాయి—దహనబలి ముగిసేవరకు ఇదంతా కొనసాగింది.[a]
  rationale: The revision avoids over-translating the bodily posture while preserving its concrete sense, retains the ongoing and simultaneous character of the worship actions, and keeps the established sacrificial term. The footnote remains correctly anchored to the summarizing expression and has been made more explicit.
