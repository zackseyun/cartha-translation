id: 2CH.29.28
reference: 2 Chronicles 29:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל הַ/קָּהָל֙ מִֽשְׁתַּחֲוִ֔ים וְ/הַ/שִּׁ֣יר מְשׁוֹרֵ֔ר וְ/הַ/חֲצֹצְר֖וֹת מחצצרים הַ/כֹּ֕ל עַ֖ד לִ/כְל֥וֹת הָ/עֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/028.yaml
  text: And all the assembly was bowing down[a], while the song was being sung and the trumpets were sounding—all this continued until the burnt offering was finished.
translation:
  language: te
  text: సమాజమంతా వంగి నమస్కరిస్తూ ఉంది; గానం సాగుతోంది, బూరలు మోగుతున్నాయి—దహనబలి ముగిసేవరకు ఇదంతా కొనసాగింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ పాఠంలో ‘ఇదంతా’ అనే మాట ముందున్న నమస్కారం, గానం, బూరల మోత అనే చర్యలన్నిటినీ సమిష్టిగా సూచిస్తుంది.
    reason: discourse_clarification
lexical_decisions:
- source_word: קָּהָל
  choice: సమాజం
  rationale: ఆరాధన కోసం కూడిన సమూహాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండి సామూహిక భావాన్ని నిలుపుతుంది.
- source_word: מִשְׁתַּחֲוִים
  choice: సాష్టాంగపడుతూ
  rationale: ఈ క్రియ శరీరంతో వంగి ప్రణమిల్లడాన్ని సూచిస్తుంది; కేవలం సాధారణ ‘ఆరాధన’ అని చెప్పకుండా భౌతిక చర్యను నిలుపుతుంది.
- source_word: הַשִּׁיר מְשׁוֹרֵר
  choice: గానం సాగుతూ
  rationale: అక్షరార్థంగా ‘పాట పాడుతూ/ధ్వనిస్తూ’ అనే హెబ్రీయ భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; ఎవరు పాడారో వచనంలో లేని సమాచారాన్ని చేర్చదు.
- source_word: חֲצֹצְרוֹת מחצצרים
  choice: బూరలు మోగుతూ
  rationale: ఆరాధనలో ఉపయోగించే నేరుగా ఉండే లోహ వాయిద్యాలను సూచిస్తుంది; ‘మోగుతూ’ అనే రూపం కొనసాగుతున్న చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: הַכֹּל
  choice: ఇదంతా
  rationale: ఇంతకు ముందు చెప్పిన ప్రణామం, గానం, బూరల మోత అనే సమిష్టి చర్యలను సంక్షిప్తంగా సూచిస్తుంది.
- source_word: עַד לִכְלוֹת
  choice: ముగిసేంతవరకు
  rationale: చర్య కొనసాగిన చివరి పరిమితిని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הָעֹלָה
  choice: దహనబలి
  rationale: పూర్తిగా దహనం చేసే עֹלָה బలికి ప్రామాణికమైన, సంక్షిప్త తెలుగు పదం.
