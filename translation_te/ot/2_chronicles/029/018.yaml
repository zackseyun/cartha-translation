source:
  edition: WLC
  text: וַ/יָּב֤וֹאוּ פְנִ֨ימָה֙ אֶל חִזְקִיָּ֣הוּ הַ/מֶּ֔לֶךְ וַ/יֹּ֣אמְר֔וּ טִהַ֖רְנוּ אֶת כָּל בֵּ֣ית יְהוָ֑ה אֶת מִזְבַּ֤ח הָ/עוֹלָה֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/אֶת שֻׁלְחַ֥ן הַֽ/מַּעֲרֶ֖כֶת וְ/אֶת כָּל כֵּלָֽי/ו־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/018.yaml
  text: Then they went in to King Hezekiah and said[a], “We have cleansed all the house of Yahweh, the altar of burnt offering and all its utensils, and the table of the rows and all its utensils.”
translation:
  language: te
  text: 'తర్వాత వారు లోపలికి వెళ్లి హిజ్కియా రాజుతో ఇలా అన్నారు: “మేము యాహ్వే మందిరమంతటినీ, దహనబలి పీఠాన్నీ దాని సామగ్రి అంతటినీ, వరుసల బల్లను[a] దాని సామగ్రి అంతటినీ శుద్ధి చేశాము.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా “అమరిక బల్ల” లేదా “వరుసల బల్ల”; అంటే యాహ్వే సన్నిధిలో వరుసలుగా అమర్చే రొట్టెలకు సంబంధించిన బల్ల.
    reason: שֻׁלְחַן הַמַּעֲרֶכֶת యొక్క అక్షరార్థాన్ని చూపిస్తూ, ఆలయ సందర్భంలో వరుసలుగా అమర్చే రొట్టెలతో దాని సంబంధాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: פְנִימָה אֶל־חִזְקִיָּהוּ הַמֶּלֶךְ
  choice: లోపలికి వెళ్లి హిజ్కియా రాజుతో
  rationale: פְנִימָה లోపలివైపు కదలికను సూచిస్తుంది. రాజు దగ్గరకు వెళ్లి నివేదించిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: טִהַרְנוּ
  choice: శుద్ధి చేశాము
  rationale: ఆలయ సందర్భంలో ఇది ఆచారపరమైన అపవిత్రతను తొలగించి పరిశుద్ధ సేవకు సిద్ధం చేయడాన్ని సూచిస్తుంది; ‘శుద్ధి చేశాము’ ఆ భావాన్ని నిలుపుతుంది.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే మందిరం
  rationale: అక్షరార్థం ‘యాహ్వే ఇల్లు’; సందర్భంలో దేవాలయాన్ని సూచిస్తున్నందున ‘మందిరం’ సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: מִזְבַּח הָעוֹלָה
  choice: దహనబలి పీఠం
  rationale: పూర్తిగా దహనం చేసే బలికి సంబంధించిన పీఠమనే ఆరాధనా సందర్భంలోని నిర్దిష్ట అర్థాన్ని తెలుగులో సంక్షిప్తంగా అందిస్తుంది.
- source_word: כֵּלָיו
  choice: దాని సామగ్రి అంతటినీ
  rationale: ఆలయ సేవలో ఉపయోగించే పాత్రలు, పరికరాలు మొదలైన వాటన్నిటినీ כֵּלִים సూచించగలదు; ‘సామగ్రి’ ఆ విస్తృతిని నిలుపుతుంది.
- source_word: שֻׁלְחַן הַמַּעֲרֶכֶת
  choice: వరుసగా అమర్చిన రొట్టెల బల్ల
  rationale: מַעֲרֶכֶת యొక్క ‘అమరిక/వరుస’ భావాన్ని నిలుపుతూ, ఆలయంలో యాహ్వే సన్నిధిలో అమర్చే రొట్టెల బల్ల అని సందర్భానుసారంగా స్పష్టం చేస్తుంది; అక్షర రూపాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హెబ్రీ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో గుర్తించదగిన లిప్యంతరీకరణగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలరూపాన్ని కాపాడుతుంది.
- issue: שֻׁלְחַן הַמַּעֲרֶכֶת లో రొట్టెల సూచన
  choice: ప్రధాన పాఠంలో ‘వరుసగా అమర్చిన రొట్టెల బల్ల’; పాదసూచికలో అక్షర రూపం
  alternative: అమరిక బల్ల; సన్నిధి రొట్టెల బల్ల
  rationale: హెబ్రీ పదబంధంలో ‘రొట్టె’ ప్రత్యక్షంగా లేకపోయినా, ఆలయ సందర్భంలో అది వరుసగా అమర్చే సన్నిధి రొట్టెల బల్లను సూచిస్తుంది. ప్రధాన పాఠం పాఠకునికి అర్థాన్ని స్పష్టం చేస్తూ, పాదసూచిక మూలంలోని సంక్షిప్తతను వెల్లడిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన శైలి. పొడవైన జాబితిలో ‘అంతటినీ’ పునరావృతం చేసి హెబ్రీ వాక్య నిర్మాణంలోని సమగ్రతను నిలిపాం. అపరిచితమైన అక్షరానువాదాన్ని ప్రధాన పాఠంలో బలవంతంగా పెట్టకుండా పాదసూచికలో సంరక్షించాం.
