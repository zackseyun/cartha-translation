source:
  edition: WLC
  text: וַ/יִּשְׁחָטוּ/ם֙ הַ/כֹּ֣הֲנִ֔ים וַֽ/יְחַטְּא֤וּ אֶת דָּמָ/ם֙ הַ/מִּזְבֵּ֔חָ/ה לְ/כַפֵּ֖ר עַל כָּל יִשְׂרָאֵ֑ל כִּ֤י לְ/כָל יִשְׂרָאֵל֙ אָמַ֣ר הַ/מֶּ֔לֶךְ הָ/עוֹלָ֖ה וְ/הַ/חַטָּֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/024.yaml
  text: The priests slaughtered them and applied their blood to the altar to make atonement for all Israel[b][a], because the king had said that the burnt offering and the sin offering were for all Israel.
translation:
  language: te
  text: యాజకులు వాటిని వధించి, ఇశ్రాయేలీయులందరి కోసం ప్రాయశ్చిత్తం చేయడానికి బలిపీఠంపై వాటి రక్తాన్ని పూశారు.[a] ఎందుకంటే దహనబలి, పాపపరిహార బలి[b] ఇశ్రాయేలీయులందరి కొరకే అని రాజు చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటి రక్తంతో బలిపీఠాన్ని శుద్ధి చేశారు”; హీబ్రూ క్రియ శుద్ధీకరణ లేదా పాపపరిహార బలి విధిని నిర్వహించే భావాన్ని కూడా ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “శుద్ధీకరణ బలి.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁחָטוּם
  choice: వాటిని వధించి
  rationale: బలుల సందర్భంలో שׁחט జంతువులను బలిగా వధించడాన్ని సూచిస్తుంది; కర్మ ప్రత్యయం మునుపటి వచనంలోని మేకలను సూచిస్తుంది.
- source_word: וַיְחַטְּאוּ אֶת־דָּמָם הַמִּזְבֵּחָה
  choice: వాటి రక్తాన్ని బలిపీఠానికి పూశారు
  rationale: హిఫిల్ రూపంలోని חטא ఇక్కడ పాపపరిహార/శుద్ధీకరణ బలి క్రియను సూచించగలదు. ప్రధాన పాఠం రక్తాన్ని బలిపీఠంపై ప్రయోగించిన స్పష్టమైన కార్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ఆచారపరమైన ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: לְכַפֵּר
  choice: ప్రాయశ్చిత్తం చేయడానికి
  rationale: బలుల సందర్భంలో כפרకు ప్రాయశ్చిత్తం చేయడం అనే ఆచారపరమైన, ధార్మిక భావం ఉంది.
- source_word: עַל כָּל־יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరి కోసం
  rationale: עַל ఇక్కడ ప్రాయశ్చిత్త క్రియ వల్ల ప్రయోజనం పొందే సమస్త ఇశ్రాయేలును సూచిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: బలులు సమస్త ఇశ్రాయేలుకు సంబంధించినవిగా ఉండటానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: לְכָל־יִשְׂרָאֵל אָמַר הַמֶּלֶךְ
  choice: ఇశ్రాయేలీయులందరి కోసం అర్పించాలని రాజు చెప్పాడు
  rationale: హీబ్రూ పదక్రమాన్ని సహజమైన తెలుగులో మార్చి, బలుల గురించి రాజు తెలిపిన ఉద్దేశాన్ని వ్యక్తం చేస్తుంది. 'అర్పించాలని' అనేది సందర్భం నుంచి స్పష్టమయ్యే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: הָעוֹלָה
  choice: దహనబలి
  rationale: עוֹלָהకు తెలుగులో స్థిరంగా, పారదర్శకంగా అర్థమయ్యే బలిపదం.
- source_word: וְהַחַטָּאת
  choice: పాపపరిహార బలి
  rationale: బలుల సందర్భంలో חַטָּאתను సంప్రదాయంగా పాపానికి సంబంధించిన బలిగా అర్థం చేసుకుంటారు; శుద్ధీకరణ భావాన్ని పాదసూచికలో భద్రపరిచింది.
theological_decisions:
- issue: חטא/חטאתకు సంబంధించిన బలి పరిభాష
  choice: ప్రధాన పాఠంలో ‘పాపపరిహార బలి’; ప్రత్యామ్నాయంగా ‘శుద్ధీకరణ బలి’ని పాదసూచికలో ఇవ్వడం
  alternative: శుద్ధీకరణ బలి
  rationale: ఈ సందర్భం దేవాలయ బలి విధానానికి సంబంధించినది. ‘పాపపరిహార బలి’ సాధారణ పాఠకులకు స్పష్టమైన సంప్రదాయ పదం; అయితే హీబ్రూ మూలం శుద్ధీకరణను కూడా నొక్కిచెప్పగలదు కాబట్టి ఆ భావాన్ని విస్మరించలేదు.
- issue: וַיְחַטְּאוּ అనే క్రియ యొక్క ఆచారపరమైన భావం
  choice: ప్రధాన పాఠంలో రక్తాన్ని బలిపీఠానికి పూసిన కార్యాన్ని చెప్పి, శుద్ధీకరణ భావాన్ని పాదసూచికలో ఉంచడం
  alternative: వాటి రక్తంతో బలిపీఠాన్ని శుద్ధి చేశారు
  rationale: హీబ్రూ వాక్యం రక్తం, బలిపీఠం, חטא హిఫిల్ క్రియను కలిపి చెబుతుంది. అది రక్త ప్రయోగాన్నీ శుద్ధీకరణ/పాపపరిహార ఆచారాన్నీ సూచించగలదు; ఒకే భావాన్ని ఖచ్చితంగా నిర్బంధించకుండా అస్పష్టతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ప్రాయశ్చిత్తం,’ ‘దహనబలి,’ ‘పాపపరిహార బలి’ వంటి స్థిరమైన ధార్మిక పదాలను వాడుతూ, అరుదైన ఆచారపరమైన ద్వంద్వార్థాలను పాదసూచికల్లో వివరించింది.
