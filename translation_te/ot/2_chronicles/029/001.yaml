id: 2CH.29.1
reference: 2 Chronicles 29:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יְחִזְקִיָּ֣הוּ מָלַ֗ךְ בֶּן עֶשְׂרִ֤ים וְ/חָמֵשׁ֙ שָׁנָ֔ה וְ/עֶשְׂרִ֤ים וָ/תֵ֨שַׁע֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ אֲבִיָּ֖ה בַּת זְכַרְיָֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/001.yaml
  text: Hezekiah became king when he was twenty-five years old, and he reigned twenty-nine years in Jerusalem. His mother’s name was Abijah daughter of Zechariah.
translation:
  language: te
  text: హిజ్కియా రాజైనప్పుడు అతనికి ఇరవై ఐదు సంవత్సరాల వయస్సు. అతడు యెరూషలేములో ఇరవై తొమ్మిది సంవత్సరాలు రాజ్యమేలాడు. అతని తల్లి పేరు అబీయా; ఆమె జెకర్యా కుమార్తె.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְחִזְקִיָּהוּ
  choice: హిజ్కియా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు బైబిలు వాడుకలో సుపరిచితమైన లిప్యంతరీకరణ.
- source_word: מָלַךְ (మొదటి ప్రయోగం)
  choice: రాజైనప్పుడు
  rationale: ఇక్కడ క్రియ సింహాసనారోహణను పరిచయం చేస్తోంది; వయస్సుతో కలిపి సహజమైన తెలుగులో ఈ భావం స్పష్టమవుతుంది.
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: అతనికి ఇరవై ఐదు సంవత్సరాలు
  rationale: హీబ్రూ వయస్సు సూచించే నుడికారాన్ని సహజమైన తెలుగు రూపంలో అందిస్తుంది.
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ
  choice: ఇరవై తొమ్మిది సంవత్సరాలు పరిపాలించాడు
  rationale: రెండవ מָלַךְ పాలన కొనసాగిన కాలాన్ని సూచిస్తుంది; ‘పరిపాలించాడు’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: స్థానార్థక ఉపసర్గను తెలుగు విభక్తితో తెలిపి, ప్రదేశనామానికి సుపరిచిత రూపాన్ని ఉపయోగించింది.
- source_word: וְשֵׁם אִמּוֹ
  choice: అతని తల్లి పేరు
  rationale: హీబ్రూ జీవితచరిత్ర సూత్రాన్ని అర్థం మారకుండా సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: אֲבִיָּה
  choice: అబీయా
  rationale: హీబ్రూ వ్యక్తినామానికి దగ్గరగా ఉండే, తెలుగులో పఠనసౌలభ్యం గల లిప్యంతరీకరణ.
- source_word: בַּת
  choice: కుమార్తె
  rationale: వంశసంబంధాన్ని సూచించే సాధారణ అర్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: זְכַרְיָהוּ
  choice: జెకర్యా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ.
