id: 2CH.29.17
reference: 2 Chronicles 29:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֠/יָּחֵלּוּ בְּ/אֶחָ֞ד לַ/חֹ֣דֶשׁ הָ/רִאשׁוֹן֮ לְ/קַדֵּשׁ֒ וּ/בְ/י֧וֹם שְׁמוֹנָ֣ה לַ/חֹ֗דֶשׁ בָּ֚אוּ לְ/אוּלָ֣ם יְהוָ֔ה וַ/יְקַדְּשׁ֥וּ אֶת בֵּית יְהוָ֖ה לְ/יָמִ֣ים שְׁמוֹנָ֑ה וּ/בְ/י֨וֹם שִׁשָּׁ֥ה עָשָׂ֛ר לַ/חֹ֥דֶשׁ הָ/רִאשׁ֖וֹן כִּלּֽוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/017.yaml
  text: They began to consecrate on the first day of the first month[a], and on the eighth day of the month they came to the vestibule of Yahweh. Then they consecrated the house of Yahweh in eight days, and on the sixteenth day of the first month they finished.
translation:
  language: te
  text: మొదటి నెల మొదటి రోజున వారు పవిత్రపరచడం మొదలుపెట్టారు. ఆ నెల ఎనిమిదో రోజున వారు యహ్వే ముఖమంటపం[a] వరకు చేరుకున్నారు. ఎనిమిది రోజులపాటు వారు యహ్వే మందిరాన్ని పవిత్రపరిచారు; మొదటి నెల పదహారో రోజున ఆ పని ముగించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ముందరి మంటపం’ లేదా ‘వసారా’.
    reason: אוּלָם అనే నిర్మాణపదానికి సందర్భానుసారం ఈ సమీప తెలుగు ప్రత్యామ్నాయాలు సాధ్యమైనవి.
lexical_decisions:
- source_word: וַיָּחֵלּוּ
  choice: మొదలుపెట్టారు
  rationale: హిఫీల్ రూపంలోని ‘ప్రారంభించు’ అనే అర్థాన్ని సహజమైన తెలుగు కథనశైలిలో వ్యక్తం చేస్తుంది.
- source_word: לְקַדֵּשׁ / וַיְקַדְּשׁוּ
  choice: పవిత్రపరచడం / పవిత్రపరిచారు
  rationale: ఆలయాన్ని పవిత్రమైన వినియోగానికి సిద్ధం చేయడం, శుద్ధి చేయడం అనే సందర్భార్థాన్ని నిలుపుతూ, ఒకే హీబ్రూ మూలానికి తెలుగు పదబంధంలో ఏకరూపతను కాపాడుతుంది.
- source_word: בְּאֶחָד לַחֹדֶשׁ הָרִאשׁוֹן
  choice: మొదటి నెల మొదటి రోజున
  rationale: హీబ్రూ తేదీ ప్రయోగాన్ని స్పష్టమైన, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בָּאוּ לְאוּלָם יְהוָה
  choice: యహ్వే ముఖమంటపం వరకు చేరుకున్నారు
  rationale: אוּלָם ఆలయ ముందుభాగంలోని మంటపాన్ని సూచిస్తుంది. לְ లోని దిశార్థాన్ని ‘వరకు’ నిలుపుతుంది; వారు అంతర్భాగంలోకి పూర్తిగా ప్రవేశించారని అదనంగా నిర్ధారించదు.
- source_word: בֵּית יְהוָה
  choice: యహ్వే మందిరం
  rationale: ‘యహ్వే గృహం’ అనే మూలరూపానికి ఆలయ సందర్భంలో సహజమైన తెలుగు సమానార్థకం.
- source_word: לְיָמִים שְׁמוֹנָה
  choice: ఎనిమిది రోజులపాటు
  rationale: పవిత్రపరిచే కార్యానికి పట్టిన కాలవ్యవధిని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: כִּלּוּ
  choice: ఆ పని ముగించారు
  rationale: ‘పూర్తిచేశారు/ముగించారు’ అనే పియేల్ అర్థాన్ని వ్యక్తం చేస్తుంది; తెలుగులో అవసరమైన కర్మను సందర్భం నుంచి ‘ఆ పని’గా స్పష్టపరుస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: హీబ్రూ పాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- issue: קדשׁ యొక్క ఆలయసందర్భ అర్థం
  choice: పవిత్రపరచడం
  alternative: ప్రతిష్ఠించడం; శుద్ధిచేయడం
  rationale: ఈ సందర్భంలో పవిత్ర వినియోగానికి సిద్ధం చేయడం మరియు అపవిత్రతను తొలగించడం రెండూ అంతర్లీనంగా ఉన్నాయి. ఒక్క ‘శుద్ధి’ లేదా ‘ప్రతిష్ఠ’ వైపుకు అర్థాన్ని పరిమితం చేయకుండా విస్తృతమైన పదాన్ని ఎంచుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. హీబ్రూ వాక్యంలోని కాలక్రమం, ఎనిమిది రోజుల వ్యవధి, అలాగే ముఖమంటపం ‘వరకు’ చేరుకున్నారనే దిశార్థం నిలుపబడ్డాయి. మూలంలో మొదటి ‘పవిత్రపరచడం’కు కర్మ స్పష్టంగా లేకపోవడంతో తెలుగులోనూ మందిరాన్ని ముందుగానే చేర్చలేదు.
