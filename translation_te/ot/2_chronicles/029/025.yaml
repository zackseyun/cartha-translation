id: 2CH.29.25
reference: 2 Chronicles 29:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּֽעֲמֵ֨ד אֶת הַ/לְוִיִּ֜ם בֵּ֣ית יְהוָ֗ה בִּ/מְצִלְתַּ֨יִם֙ בִּ/נְבָלִ֣ים וּ/בְ/כִנֹּר֔וֹת בְּ/מִצְוַ֥ת דָּוִ֛יד וְ/גָ֥ד חֹזֵֽה הַ/מֶּ֖לֶךְ וְ/נָתָ֣ן הַ/נָּבִ֑יא כִּ֧י בְ/יַד יְהוָ֛ה הַ/מִּצְוָ֖ה בְּ/יַד נְבִיאָֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/025.yaml
  text: He stationed the Levites in the house of Yahweh with cymbals[a], harps, and lyres, according to the command of David and of Gad the king’s seer and Nathan the prophet[b], for the command was from Yahweh through his prophets.
translation:
  language: te
  text: అతడు యెహోవా మందిరంలో లేవీయులను తాళాలు, స్వరమండలాలు, సితారాలతో నిలబెట్టాడు. ఇది దావీదు, రాజు దర్శి గాదు, ప్రవక్త నాతాను ఆజ్ఞ ప్రకారం జరిగింది; ఎందుకంటే ఆ ఆజ్ఞ యెహోవా నుండి ఆయన తన ప్రవక్తల ద్వారా వచ్చింది.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దర్శి’ అనేది హీబ్రూ חֹזֶה అనే బిరుదుకు అనువాదం. దీని పని ‘ప్రవక్త’ పనికి దగ్గరగా ఉన్నప్పటికీ, మూలపాఠం ఇక్కడ వేరే పదాన్ని వాడుతుంది.
    reason: lexical_alternative
  - marker: b
    text: 'మరింత అక్షరార్థంగా: “ఆ ఆజ్ఞ యెహోవా చేతి ద్వారా, ఆయన ప్రవక్తల చేతి ద్వారా వచ్చింది.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: వారి స్థానాల్లో నిలబెట్టాడు
  rationale: עמד ధాతువు హిఫిల్ రూపంలో ‘నిలిచేలా చేశాడు/స్థానంలో ఉంచాడు’ అనే భావం ఇస్తుంది. ఇక్కడ ఆరాధనా సేవ కోసం లేవీయులను నియమిత స్థానాల్లో ఉంచడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַלְוִיִּם
  choice: లేవీయులను
  rationale: లేవి గోత్రానికి చెందిన ఆరాధనా సేవకుల కోసం వాడే స్థిరమైన తెలుగు రూపం.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరంలో
  rationale: హీబ్రూలో అక్షరార్థంగా ‘యెహోవా గృహం.’ సందర్భంలో ఇది దేవాలయాన్ని సూచిస్తుంది; ‘మందిరం’ ఆధునిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో నిలుపుతుంది.
- source_word: בִּמְצִלְתַּיִם
  choice: తాళాలు
  rationale: ఒకదానితో ఒకటి తాకించి మోగించే లోహ వాద్యాలను సూచించే సహజమైన తెలుగు పదం.
- source_word: בִּנְבָלִים
  choice: స్వరమండలాలు
  rationale: נבל ఒక తంతివాద్యం; దాని ఖచ్చితమైన ఆధునిక సమానం అనిశ్చితం. כּנור నుండి భేదాన్ని నిలుపుతూ తెలుగు బైబిలు వాడుకలో అర్థమయ్యే పదాన్ని ఎంచుకున్నాం.
- source_word: וּבְכִנֹּרוֹת
  choice: సితారాలు
  rationale: כִּנּוֹר ఒక తంతివాద్యం, సాధారణంగా lyreగా గుర్తిస్తారు. ‘సితారాలు’ נבלకు వాడిన పదం నుండి దీనిని వేరుగా ఉంచుతుంది; ఇది ఖచ్చితమైన వాద్య నిర్మాణ సమానత్వాన్ని ప్రకటించదు.
- source_word: בְּמִצְוַת
  choice: ఇచ్చిన ఆజ్ఞ ప్రకారం
  rationale: ఏర్పాటు దావీదు, గాదు, నాతానులకు సంబంధించిన ఆజ్ఞకు అనుగుణంగా జరిగిందనే అధికార భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: גָד חֹזֵה הַמֶּלֶךְ
  choice: రాజు దర్శి అయిన గాదు
  rationale: חֹזֶהకు ‘దర్శి’ అని అనువదించడం ద్వారా తరువాతి נָבִיא (‘ప్రవక్త’) పదంతో ఉన్న పదభేదాన్ని కాపాడుతుంది. సంబంధాన్ని సహజ తెలుగులో ‘రాజు దర్శి’గా తెలిపింది.
- source_word: נָתָן הַנָּבִיא
  choice: ప్రవక్త నాతాను
  rationale: పేరు, బిరుదును నేరుగా మరియు సహజంగా అందిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందు చెప్పిన ఆజ్ఞకు అంతిమ మూలం యెహోవాయేనని వివరిస్తున్న కారణార్థక సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: בְיַד יְהוָה ... בְיַד נְבִיאָיו
  choice: యెహోవా నుండి ఆయన ప్రవక్తల ద్వారా
  rationale: ‘చేతి ద్వారా’ అనే హీబ్రూ నుడికారాన్ని యాంత్రికంగా పునరావృతం చేయకుండా, యెహోవా మూలాధికారాన్నీ ప్రవక్తల మధ్యవర్తిత్వాన్నీ స్పష్టంగా నిలుపుతుంది; అక్షరార్థ రూపం పాదసూచికలో ఇచ్చింది.
theological_decisions:
- issue: దావీదు ఏర్పాటు మరియు దైవాధికారం మధ్య సంబంధం
  choice: సంగీత సేవకు సంబంధించిన ఆజ్ఞ యెహోవా నుండి వచ్చి, ఆయన ప్రవక్తల ద్వారా తెలియజేయబడిందని అనువదించబడింది.
  alternative: ఇది కేవలం దావీదు చేసిన రాజాజ్ఞ లేదా వ్యక్తిగత ఆరాధనా ఏర్పాటు అని చదవడం.
  rationale: כִּי בְיַד יְהוָה הַמִּצְוָה בְּיַד נְבִיאָיו అనే చివరి వాక్యభాగం ఆజ్ఞ యొక్క అంతిమ మూలం యెహోవా అని, అది ప్రవక్తల ద్వారా అందిందని స్పష్టంగా చెబుతుంది. అనువాదం మానవ ప్రతినిధులనూ దైవ మూలాన్నీ రెండింటినీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని అనుసరించాం. ‘సేవచేయడానికి వారి స్థానాల్లో’ అనే మాటలు וַיַּעֲמֵד లోని అధికారిక స్థాననిర్ణయ భావాన్ని తెలుగులో స్పష్టం చేస్తాయి. వాద్యాల ఖచ్చిత ఆధునిక సమానాలు అనిశ్చితమైనందున, వాటి మధ్య భేదాన్ని కాపాడే సుపరిచిత తెలుగు పదాలను వాడాం.
