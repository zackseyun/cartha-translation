- from: అతడు యెహోవా మందిరంలో లేవీయులను తాళాలు, స్వరమండలాలు, సితారాలు పట్టుకొని సేవచేయడానికి వారి స్థానాల్లో నిలబెట్టాడు. ఇది దావీదు, రాజు దర్శి అయిన గాదు[a], ప్రవక్త నాతాను ఇచ్చిన ఆజ్ఞ ప్రకారం జరిగింది; ఎందుకంటే ఆ ఆజ్ఞ యెహోవా నుండి ఆయన ప్రవక్తల ద్వారా వచ్చింది.[b]
  to: అతడు యెహోవా మందిరంలో లేవీయులను తాళాలు, స్వరమండలాలు, సితారాలతో నిలబెట్టాడు. ఇది దావీదు, రాజు దర్శి గాదు, ప్రవక్త నాతాను ఆజ్ఞ ప్రకారం జరిగింది; ఎందుకంటే ఆ ఆజ్ఞ యెహోవా నుండి ఆయన తన ప్రవక్తల ద్వారా వచ్చింది.[a][b]
  rationale: మూలంలో లేని ‘పట్టుకొని సేవచేయడానికి’ అనే విస్తరణను తొలగించాం. గాదు బిరుదును సహజంగా సంక్షిప్తీకరించాం. యెహోవా మూలాధికారాన్నీ ఆయన ప్రవక్తల మధ్యవర్తిత్వాన్నీ స్పష్టంగా ఉంచేందుకు చివరి ఉపవాక్యాన్ని స్వల్పంగా సవరించాం. పాదసూచికలలో దర్శి/ప్రవక్త పదభేదం, అలాగే ‘చేతి ద్వారా’ అనే నుడికారపు అక్షరార్థం రెండూ నిలిపాం.
