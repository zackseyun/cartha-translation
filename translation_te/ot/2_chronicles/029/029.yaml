id: 2CH.29.29
reference: 2 Chronicles 29:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/כְ/כַלּ֖וֹת לְ/הַעֲל֑וֹת כָּרְע֗וּ הַ/מֶּ֛לֶךְ וְ/כָֽל הַ/נִּמְצְאִ֥ים אִתּ֖/וֹ וַ/יִּֽשְׁתַּחֲוֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/029.yaml
  text: And when they had finished offering[b][a], the king and all who were present with him knelt down and worshiped.
translation:
  language: te
  text: అర్పించడం ముగిసినప్పుడు[a], రాజు, అతనితో ఉన్న వారందరూ మోకాళ్లూని ఆరాధించారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘పైకి ఎక్కించడం ముగిసినప్పుడు.’ బలి సందర్భంలో ఇది బలిని అర్పించడం ముగిసినదాన్ని సూచిస్తుంది; ఈ వచనంలో ‘దహనబలి’ అనే కర్మను స్పష్టంగా మళ్లీ చెప్పలేదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘సాష్టాంగపడ్డారు,’ ‘వంగి నమస్కరించారు.’ హీబ్రూ క్రియ భక్తితో వంగే శరీర చర్యను, ఆరాధనను రెండింటినీ సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/כְ/כַלּוֹת
  choice: ముగిసినప్పుడు
  rationale: כְּతో కూడిన כלה క్రియానామ రూపం తరువాతి సంఘటనకు కాలసంబంధాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘ముగిసినప్పుడు’ సహజంగా ఈ క్రమాన్ని తెలియజేస్తుంది.
- source_word: לְ/הַעֲל֑וֹת
  choice: అర్పించడం
  rationale: עלה హిఫీల్ రూపానికి అక్షరార్థంగా ‘పైకి ఎక్కించడం’ అనే భావం ఉన్నా, ఇక్కడ బలి సందర్భంలో అది బలిని అర్పించడాన్ని సూచిస్తుంది. ఈ వచనంలో కర్మ స్పష్టంగా మళ్లీ చెప్పబడలేదు కాబట్టి ‘దహనబలిని’ అని ప్రధాన పాఠంలో చేర్చకుండా ‘అర్పించడం’ అని ఉంచాం.
- source_word: כָּרְעוּ
  choice: మోకాళ్లూని
  rationale: כרע మోకాళ్లు వంచడం లేదా మోకరించడాన్ని సూచిస్తుంది. తరువాతి שחה క్రియతో దీనికి ఉన్న భేదాన్ని ‘మోకాళ్లూని’ నిలుపుతుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: నిర్దిష్ట నామవాచకానికి నేరమైన, సహజమైన తెలుగు అనువాదం.
- source_word: וְכָל הַנִּמְצְאִים אִתּוֹ
  choice: అతనితో ఉన్న వారందరూ
  rationale: מצא నిఫాల్ కృదంతం ఇక్కడ అక్కడ హాజరై ఉన్నవారిని సూచిస్తుంది. ‘అతనితో ఉన్న వారందరూ’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: ఆరాధించారు
  rationale: שחה రూపం భక్తితో వంగడం, సాష్టాంగపడడం లేదా ఆరాధించడాన్ని సూచించగలదు. దేవాలయ బలి సందర్భంలో ‘ఆరాధించారు’ మతపరమైన ఉద్దేశాన్ని స్పష్టం చేస్తుంది; ముందున్న ‘మోకాళ్లూని’ శరీర భంగిమను ఇప్పటికే తెలియజేస్తుంది.
theological_decisions:
- issue: దేవాలయ ఆరాధన సందర్భంలో שחה అనువాదం
  choice: ఆరాధించారు
  alternative: సాష్టాంగపడ్డారు / వంగి నమస్కరించారు
  rationale: బలి అర్పణ ముగిసిన తరువాత రాజు, సమూహం చేసిన చర్యకు ఆరాధనా భావం ఉంది. ‘ఆరాధించారు’ ఆ సందర్భార్థాన్ని అందిస్తుంది; అయితే హీబ్రూ క్రియ శరీరంతో వంగి నమస్కరించడాన్ని కూడా సూచించగలదనే నిజమైన భావవ్యాప్తిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి వాడబడింది. మూలంలో స్పష్టంగా లేని ‘దహనబలి’ని ప్రధాన పాఠంలో చేర్చలేదు; సందర్భార్థం పాదసూచికలో వివరించబడింది. ‘మోకాళ్లూని’ మరియు ‘ఆరాధించారు’ అనే రెండు పదాలతో హీబ్రూలోని వరుస క్రియల మధ్య భేదం నిలుపబడింది.
