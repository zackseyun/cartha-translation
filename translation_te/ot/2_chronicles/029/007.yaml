id: 2CH.29.7
reference: 2 Chronicles 29:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: גַּ֣ם סָֽגְר֞וּ דַּלְת֣וֹת הָ/אוּלָ֗ם וַ/יְכַבּוּ֙ אֶת הַ/נֵּר֔וֹת וּ/קְטֹ֖רֶת לֹ֣א הִקְטִ֑ירוּ וְ/עֹלָה֙ לֹא הֶעֱל֣וּ בַ/קֹּ֔דֶשׁ לֵ/אלֹהֵ֖י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/007.yaml
  text: They also shut the doors of the vestibule[a], put out the lamps, did not burn incense[b], and did not offer up burnt offerings in the sanctuary to the God of Israel.
translation:
  language: te
  text: వారు ఆలయ ప్రవేశమండపపు[a] తలుపులను కూడా మూసివేశారు, దీపాలను ఆర్పివేశారు, ధూపాన్ని అర్పించలేదు, పరిశుద్ధ స్థలంలో[b] ఇశ్రాయేలు దేవునికి దహనబలులు అర్పించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ముఖమండపపు తలుపులు’; హీబ్రూ పదం ఆలయ ప్రవేశ భాగంలోని మండపాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పవిత్రస్థలంలో’; హీబ్రూ పదం ఆలయంలోని పవిత్ర ప్రదేశాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: కూడా
  rationale: ముందటి వచనంలోని ఆరోపణలకు ఈ చర్యలను జోడించే సంచయ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: סָגְרוּ
  choice: మూసివేశారు
  rationale: తలుపులను మూయడాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: דַּלְתוֹת הָאוּלָם
  choice: ఆలయ ప్రవేశ మండపపు తలుపులు
  rationale: אוּלָם ఆలయ ప్రధాన ప్రవేశభాగంలోని మండపాన్ని సూచిస్తుంది; ‘ప్రవేశ మండపం’ దాని నిర్మాణ సంబంధ అర్థాన్ని సాధారణ పాఠకులకు స్పష్టం చేస్తుంది.
- source_word: וַיְכַבּוּ אֶת הַנֵּרוֹת
  choice: దీపాలను ఆర్పివేశారు
  rationale: ఆలయ సేవలోని దీపాలను ఆర్పిన నిర్దిష్ట చర్యను స్పష్టంగా నిలుపుతుంది.
- source_word: וּקְטֹרֶת לֹא הִקְטִירוּ
  choice: ధూపం వేయలేదు
  rationale: కטר హిఫీల్ రూపం ధూపాన్ని కాల్చి అర్పించే ఆచారాన్ని సూచిస్తుంది; ‘ధూపం వేయడం’ సహజమైన తెలుగు ఆరాధనా ప్రయోగం.
- source_word: וְעֹלָה לֹא הֶעֱלוּ
  choice: దహనబలులు అర్పించలేదు
  rationale: עֹלָה పూర్తిగా దహనం చేసే బలికి సాంకేతిక పదం. ఏకవచన రూపం ఇక్కడ బలి విధానాన్ని సమష్టిగా సూచించగలదని భావించి తెలుగులో సహజమైన బహువచనం వాడబడింది.
- source_word: בַקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలంలో
  rationale: ఈ పదం ఆలయంలోని పవిత్ర ప్రదేశాన్ని సూచిస్తుంది; ‘పరిశుద్ధ స్థలం’ మూలంలోని పవిత్రత భావాన్ని నిలుపుతూ నిర్దిష్ట నిర్మాణ విభాగాన్ని అతిగా నిర్ణయించదు.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవునికి
  rationale: లామెద్ బలుల గమ్యాన్ని లేదా అంకితాన్ని సూచిస్తుంది; తెలుగు సంప్రదాన విభక్తి ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఆలయ ఆరాధనా పరిభాష
  choice: ‘ధూపం,’ ‘దహనబలులు,’ ‘పరిశుద్ధ స్థలం’ అనే నిర్దిష్ట ఆరాధనా పదాలను నిలుపడం
  alternative: వీటిని సాధారణీకరించి ‘ఆరాధించలేదు’ లేదా ‘అర్పణలు చేయలేదు’ అని అనువదించడం
  rationale: ఈ వచనం సాధారణ భక్తిహీనతను కాక ఆలయ సేవలో జరిగిన నిర్దిష్ట నిర్లక్ష్యాలను వరుసగా పేర్కొంటుంది. కాబట్టి మూలంలోని ఆచారపరమైన, చారిత్రక ప్రత్యేకతను నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా ‘ఆలయ ప్రవేశ మండపం’ అని స్పష్టం చేస్తూనే, ఆలయ ఆరాధనకు సంబంధించిన గంభీరమైన పరిభాషను నిలుపబడింది. వాక్యంలోని వరుస నిరాకరణలు మరియు సంచయ నిర్మాణం సంరక్షించబడ్డాయి.
