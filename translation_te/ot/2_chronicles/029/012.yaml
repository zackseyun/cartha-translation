source:
  edition: WLC
  text: וַ/יָּקֻ֣מוּ הַ֠/לְוִיִּם מַ֣חַת בֶּן עֲמָשַׂ֞י וְ/יוֹאֵ֣ל בֶּן עֲזַרְיָהוּ֮ מִן בְּנֵ֣י הַ/קְּהָתִי֒ וּ/מִן בְּנֵ֣י מְרָרִ֔י קִ֚ישׁ בֶּן עַבְדִּ֔י וַ/עֲזַרְיָ֖הוּ בֶּן יְהַלֶּלְאֵ֑ל וּ/מִן הַ/גֵּ֣רְשֻׁנִּ֔י יוֹאָח֙ בֶּן זִמָּ֔ה וְ/עֵ֖דֶן בֶּן יוֹאָֽח־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/012.yaml
  text: 'Then the Levites arose: Mahath son of Amasai and Joel son of Azariah[a], from the sons of the Kohathites; and from the sons of Merari, Kish son of Abdi and Azariah son of Jehallelel; and from the Gershonites[b], Joah son of Zimmah and Eden son of Joah.'
translation:
  language: te
  text: 'అప్పుడు లేవీయులు లేచారు: కహాతీయుల వంశానికి చెందిన అమాసై కుమారుడు మహతు, అజర్యా కుమారుడు యోవేలు; మెరారి వంశానికి చెందిన అబ్దీ కుమారుడు కీషు, యెహల్లెలేలు కుమారుడు అజర్యా; గెర్షోనీయుల వంశానికి చెందిన జిమ్మా కుమారుడు యోవాహు, యోవాహు కుమారుడు ఏదెను.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో కహాతు, మెరారి సంబంధంగా అక్షరార్థంగా ‘కుమారులలోనుండి’ అని ఉంది; గెర్షోను సంబంధంగా వంశనామం సమూహార్థంలో వాడబడింది. ఇక్కడ పేర్కొన్నవారు ఆయా లేవీయ వంశాలకు చెందినవారని ఈ పదప్రయోగాలు తెలియజేస్తాయి.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: లేచి నిలబడ్డారు
  rationale: קום క్రియ ఇక్కడ రాజు ఆజ్ఞకు ప్రతిస్పందనగా చర్యకు సిద్ధపడడాన్ని సూచిస్తుంది. తెలుగు సహజ ప్రయోగమైన ‘లేచి నిలబడ్డారు’ మూలార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి గోత్రానికి చెందినవారిని సూచించే ప్రామాణిక తెలుగు బైబిలు పదం.
- source_word: מִן בְּנֵי הַקְּהָתִי
  choice: కహాతీయుల వంశానికి చెందిన
  rationale: అక్షరార్థంగా ‘కహాతీయుని కుమారులలోనుండి.’ ఆధునిక తెలుగులో వంశ సంబంధాన్ని సహజంగా తెలిపేలా, ప్రతినిధుల భావాన్ని నిలుపుతూ అనువదించబడింది.
- source_word: וּמִן בְּנֵי מְרָרִי
  choice: మెరారి వంశానికి చెందిన
  rationale: అక్షరార్థ వంశావళి ప్రయోగాన్ని సహజమైన తెలుగులో వ్యక్తం చేసి, పేరుపొందినవారి మెరారి వంశ సంబంధాన్ని నిలుపుతుంది.
- source_word: וּמִן הַגֵּרְשֻׁנִּי
  choice: గెర్షోనీయుల వంశానికి చెందిన
  rationale: మూలంలోని ఏకవచన జాతి/వంశ విశేషణం సమూహార్థంలో ఉంది; తెలుగు రూపం ఆ వంశ సూచనను స్పష్టంగా ఉంచుతుంది.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: ఈ వంశావళి జాబితాలో ప్రత్యక్ష పితృసంబంధాన్ని తెలిపే సాధారణ, పారదర్శక పదం.
- source_word: מַחַת; עֲמָשַׂי; יוֹאֵל; עֲזַרְיָהוּ; קִישׁ; עַבְדִּי; יְהַלֶּלְאֵל; יוֹאָח; זִמָּה; עֵדֶן
  choice: మహతు; అమాశై; యోవేలు; అజర్యా; కీషు; అబ్దీ; యెహల్లెలేలు; యోవాహు; జిమ్మా; ఏదెను
  rationale: వ్యక్తి పేర్లు అనువదించకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగు లిప్యంతరీకరణ చేయబడ్డాయి.
