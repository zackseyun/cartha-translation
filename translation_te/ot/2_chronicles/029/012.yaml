translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. వరుస పేర్ల మధ్య వంశ విభాగాలు స్పష్టంగా కనిపించేందుకు అర్ధవిరామాలు వాడబడ్డాయి.
