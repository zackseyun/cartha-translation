id: 2CH.29.3
reference: 2 Chronicles 29:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ה֣וּא בַ/שָּׁנָה֩ הָ/רִאשׁוֹנָ֨ה לְ/מָלְכ֜/וֹ בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן פָּתַ֛ח אֶת דַּלְת֥וֹת בֵּית יְהוָ֖ה וַֽ/יְחַזְּקֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/003.yaml
  text: In the first year of his reign[a], in the first month, he opened the doors of the house of Yahweh and repaired them.
translation:
  language: te
  text: అతడు తన రాజ్యపాలన మొదటి సంవత్సరంలో, మొదటి నెలలో, యాహ్వే మందిరపు తలుపులను తెరిచి వాటిని మరమ్మతు చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటిని బలపరిచాడు”; అంటే తలుపులను మళ్లీ దృఢంగా, సురక్షితంగా చేశాడు.
    reason: חזק పియేల్ రూపం యొక్క అక్షరార్థమైన ‘బలపరచడం’ను చూపడానికి; సందర్భంలో ప్రధాన పాఠంలోని ‘మరమ్మతు చేశాడు’ ఆ భావాన్ని ఆచరణాత్మకంగా వ్యక్తం చేస్తుంది.
lexical_decisions:
- source_word: הוּא
  choice: అతడు
  rationale: స్వతంత్ర సర్వనామం కథనంలోని కర్తను స్పష్టంగా తిరిగి సూచిస్తుంది; తెలుగులో ‘అతడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בַשָּׁנָה הָרִאשׁוֹנָה לְמָלְכוֹ
  choice: తన పాలన మొదటి సంవత్సరంలో
  rationale: ఇది అతని రాజ్యపాలనలోని మొదటి సంవత్సరాన్ని సూచించే కాలవాచక నిర్మాణం; ఈ అనువాదం ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: మొదటి నెలలో
  rationale: חֹדֶשׁ అనే పదానికి ఈ సందర్భంలో నేరమైన అర్థం ‘నెల’; హెబ్రీ వాక్యంలోని కాలసూచనను యథాతథంగా ఉంచుతుంది.
- source_word: פָּתַח
  choice: తెరిచి
  rationale: మందిరపు తలుపుల సందర్భంలో క్రియకు నేరమైన అర్థం ‘తెరవడం’; తరువాతి క్రియతో సహజంగా కలపడానికి తెలుగులో అసమాపక రూపం వాడబడింది.
- source_word: דַּלְתוֹת
  choice: తలుపులు
  rationale: ఈ పదం ద్వారపు పలకలు లేదా తలుపులను సూచిస్తుంది; ‘తలుపులు’ సాధారణ పాఠకులకు సహజమైన, ఖచ్చితమైన పదం.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: అక్షరార్థంగా ‘యెహోవా గృహం’; ఈ సందర్భంలో అది దేవాలయాన్ని సూచిస్తున్నందున ‘మందిరం’ ఆధునిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హెబ్రీ దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచుతుంది.
- source_word: וַיְחַזְּקֵם
  choice: వాటిని బాగుచేశాడు
  rationale: పియేల్ రూపానికి మూలభావం ‘బలపరచడం’; పాడైన లేదా నిర్లక్ష్యానికి గురైన మందిరపు తలుపుల సందర్భంలో వాటిని తిరిగి దృఢంగా, ఉపయోగయోగ్యంగా చేయడం ఉద్దేశం. ‘బాగుచేశాడు’ ఆ సందర్భార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది; మరింత అక్షరార్థమైన ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాకుండా టెట్రాగ్రామటన్ అనే ప్రత్యేక దైవనామం ఉంది. అందువల్ల పేరును పేరుగానే ఉంచడం మూలంలోని భేదాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘యెహోవా మందిరం’ సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా בֵּית అనే ‘గృహం’ రూపకాన్ని సందర్భానుసారంగా వ్యక్తం చేస్తుంది.
