id: 2CH.29.21
reference: 2 Chronicles 29:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבִ֣יאוּ פָרִים שִׁבְעָה֩ וְ/אֵילִ֨ים שִׁבְעָ֜ה וּ/כְבָשִׂ֣ים שִׁבְעָ֗ה וּ/צְפִירֵ֨י עִזִּ֤ים שִׁבְעָה֙ לְ/חַטָּ֔את עַל הַ/מַּמְלָכָ֥ה וְ/עַל הַ/מִּקְדָּ֖שׁ וְ/עַל יְהוּדָ֑ה וַ/יֹּ֗אמֶר לִ/בְנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים לְ/הַעֲל֖וֹת עַל מִזְבַּ֥ח יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/021.yaml
  text: They brought seven bulls, seven rams, seven lambs, and seven male goats as a sin offering for the kingdom, for the sanctuary, and for Judah. And he told the sons of Aaron, the priests, to offer them on the altar of Yahweh.
translation:
  language: te
  text: వారు ఏడు ఎద్దులను, ఏడు పొట్టేళ్లను, ఏడు గొర్రెపిల్లలను, ఏడు మగ మేకలను రాజ్యం కోసం, పరిశుద్ధస్థలం కోసం, యూదా కోసం పాపపరిహార బలిగా తీసుకొచ్చారు. వాటిని యాహ్వే బలిపీఠం మీద అర్పించమని అతడు యాజకులైన అహరోను కుమారులకు చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: తీసుకొచ్చారు
  rationale: బలి జంతువులను తీసుకురావడాన్ని తెలిపే సరళమైన కథన రూపం; ‘సమర్పించారు’ అనడం సందర్భార్థాన్ని ముందుగానే జోడిస్తుంది.
- source_word: פָרִים
  choice: ఎద్దులను
  rationale: బలి సందర్భంలోని పశువులను సూచించే సహజమైన తెలుగు పదం; ఈ వచనంలో వయస్సు స్పష్టంగా చెప్పబడలేదు.
- source_word: אֵילִים
  choice: పొట్టేళ్లను
  rationale: మగ గొర్రెలకు ఆధునిక ప్రామాణిక తెలుగులో సహజమైన పదం.
- source_word: כְבָשִׂים
  choice: గొర్రెపిల్లలను
  rationale: బలుల సందర్భంలో ఈ పదానికి సాధారణమైన అర్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: צְפִירֵי עִזִּים
  choice: మగ మేకలను
  rationale: హీబ్రూ పదబంధంలో లింగం స్పష్టంగా ఉన్నందున దాన్ని తెలుగులో నిలుపుతుంది.
- source_word: לְחַטָּאת
  choice: పాపపరిహార బలిగా
  rationale: ఆరాధనా సందర్భంలో חַטָּאת ఒక నిర్దిష్ట బలి రకాన్ని సూచిస్తుంది; తెలుగులో స్థిరమైన, అర్థవంతమైన సమానార్థకం.
- source_word: עַל הַמַּמְלָכָה
  choice: రాజ్యం కోసం
  rationale: עַל ఇక్కడ ‘తరఫున/కోసం’ అనే ప్రతినిధిత్వ భావాన్ని కలిగి ఉంది; సరళమైన తెలుగులో ‘కోసం’ దాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַמִּקְדָּשׁ
  choice: పవిత్రస్థలం
  rationale: ఆలయమంతటినీ సాధారణంగా సూచించకుండా, మִקְדָּשׁ లోని పవిత్ర ఆరాధనా స్థల భావాన్ని నిలుపుతుంది.
- source_word: לִבְנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: యాజకులైన అహరోను కుమారులకు
  rationale: కుటుంబ సంబంధాన్నీ యాజక హోదాన్నీ సహజమైన తెలుగు విశేషణ నిర్మాణంలో నిలుపుతుంది.
- source_word: לְהַעֲלוֹת
  choice: అర్పించమని
  rationale: బలిపీఠ సందర్భంలో עלה యొక్క బలి సంబంధిత అర్థాన్ని సహజంగా అందిస్తుంది; ‘పైకి ఎక్కించు’ అనే శబ్దార్థాన్ని అనవసరంగా రుద్దదు.
- source_word: מִזְבַּח יְהוָה
  choice: యెహోవా బలిపీఠం
  rationale: హీబ్రూ సమాసాన్ని సహజమైన తెలుగులో అందిస్తూ దైవనామాన్ని వ్యక్తినామంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న ప్రత్యేక దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో వ్యక్తినామంగా ఉంచింది.
- issue: חַטָּאת యొక్క బలి సంబంధిత అర్థం
  choice: పాపపరిహార బలి
  alternative: పాప బలి
  rationale: ఇక్కడ అది అమూర్తమైన ‘పాపం’ను కాక నిర్దిష్ట బలి రకాన్ని సూచిస్తుంది. ‘పాపపరిహార బలి’ ఆ ఆరాధనా వర్గాన్ని స్పష్టంగా తెలియజేస్తుంది; దాని కార్యవిధానంపై అదనపు సిద్ధాంత వివరణను చేర్చదు.
- issue: עַל తో సూచించిన బలి పరిధి
  choice: రాజ్యం కోసం, పవిత్రస్థలం కోసం, యూదా కోసం
  alternative: రాజ్యం తరఫున, పవిత్రస్థలం తరఫున, యూదా తరఫున
  rationale: ‘కోసం’ హీబ్రూ సంబంధంలోని ప్రతినిధిత్వం లేదా ప్రయోజన భావాన్ని సహజంగా ఉంచుతుంది; దానిని మరీ నిర్దిష్టంగా తీర్మానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. జాబితా పునరుక్తిని మూలానికి అనుగుణంగా నిలిపి, రెండవ వాక్యంలో తెలుగు సహజ పదక్రమాన్ని ఉపయోగించాం.
