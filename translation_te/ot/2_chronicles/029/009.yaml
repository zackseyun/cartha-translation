id: 2CH.29.9
reference: 2 Chronicles 29:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִנֵּ֛ה נָפְל֥וּ אֲבוֹתֵ֖י/נוּ בֶּ/חָ֑רֶב וּ/בָנֵ֨י/נוּ וּ/בְנוֹתֵ֧י/נוּ וְ/נָשֵׁ֛י/נוּ בַּ/שְּׁבִ֖י עַל זֹֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/009.yaml
  text: And behold[a], our fathers have fallen by the sword[b], and our sons and our daughters and our wives are in captivity because of this.
translation:
  language: te
  text: ఇదిగో[a], మన తండ్రులు ఖడ్గానికి బలయ్యారు; మన కుమారులు, కుమార్తెలు, భార్యలు ఈ కారణంగా చెరలో ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చూడండి.” ఈ హీబ్రూ సంభాషణా సూచకం తరువాత చెప్పే విషయంపై బలంగా దృష్టి నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: తరువాతి ప్రకటనపై బలంగా దృష్టి నిలిపే హీబ్రూ సంభాషణా సూచకాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: נָפְלוּ
  choice: బలయ్యారు
  rationale: యుద్ధంలో మరణించడాన్ని సూచించే ‘పడిపోయారు’ అనే హీబ్రూ నుడికారానికి తెలుగులో సహజమైన సమానార్థకం; ఖడ్గం వల్ల మరణించారనే సందర్భార్థాన్ని అతిగా విస్తరించకుండా తెలియజేస్తుంది.
- source_word: אֲבוֹתֵינוּ
  choice: మన తండ్రులు
  rationale: మూలంలోని పురుషలింగ బంధుత్వ పదాన్ని, మునుపటి తరాన్ని సూచించే సందర్భాన్ని యథాతథంగా కాపాడుతుంది.
- source_word: בֶּחָרֶב
  choice: ఖడ్గానికి
  rationale: హింసాత్మక యుద్ధ మరణాన్ని సూచించే హీబ్రూ ప్రయోగాన్ని సహజమైన తెలుగు నుడికారమైన ‘ఖడ్గానికి బలయ్యారు’లో కలుపుతుంది.
- source_word: וּבָנֵינוּ
  choice: మన కుమారులు
  rationale: తర్వాత ప్రత్యేకంగా కుమార్తెలు ప్రస్తావించబడినందున మూలంలోని లింగభేదాన్ని కాపాడుతుంది.
- source_word: וּבְנוֹתֵינוּ
  choice: కుమార్తెలు
  rationale: హీబ్రూ పదానికి నేరమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: וְנָשֵׁינוּ
  choice: భార్యలు
  rationale: స్వామ్య ప్రత్యయంతో ఉన్న కుటుంబ సభ్యుల జాబితాలో ‘స్త్రీలు’ కంటే ‘భార్యలు’ సందర్భానికి మరింత ఖచ్చితంగా సరిపోతుంది.
- source_word: בַּשְּׁבִי
  choice: చెరలో ఉన్నారు
  rationale: అక్షరార్థంగా ‘చెరలో’ అనే స్థితిని సహజమైన తెలుగులో కాపాడుతుంది; ‘చెరపట్టబడ్డారు’ అనే సంఘటనాత్మక రూపంగా మార్చదు.
- source_word: עַל זֹאת
  choice: దీనివల్ల
  rationale: మునుపటి అవిశ్వాసం మరియు దాని ఫలితమైన తీర్పును వెనుకకు సూచించే కారణార్థాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: తీర్పు సందర్భంలోని లింగసూచక బంధుత్వ పదాలు
  choice: మన తండ్రులు ... మన కుమారులు, కుమార్తెలు, భార్యలు
  alternative: మన పూర్వీకులు ... మన పిల్లలు, మన స్త్రీలు
  rationale: హీబ్రూ నిర్దిష్ట కుటుంబ వర్గాలను ఉద్దేశపూర్వకంగా వేర్వేరుగా పేర్కొంటుంది. వాటిని లింగతటస్థ సమూహపదాలుగా కలపకుండా మూలంలోని భేదాలను నిలుపుతుంది.
- issue: నָפְלוּ అనే యుద్ధమరణ నుడికారం
  choice: ఖడ్గానికి బలయ్యారు
  alternative: ఖడ్గం చేత పడిపోయారు
  rationale: మూలంలోని గంభీరమైన యుద్ధమరణ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; మరణాన్ని సూచించే సందర్భార్థాన్ని నిలుపుతూ అదనపు ధార్మిక వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గంభీరతను నిలుపుతూ రూపొందించబడింది. హీబ్రూ కుటుంబ జాబితాలోని నిర్దిష్ట లింగభేదాలు మరియు ‘చెరలో’ అనే స్థితి యథాతథంగా కాపాడబడ్డాయి.
