  terminology: హేమాను, యెహూయేలు, షిమీ, యెదూతూను, షెమయా, ఉజ్జీయేలు అనే లిప్యంతరీకరణలు స్థిరంగా, సందర్భోచితంగా ఉన్నాయి. పాదసూచికలోని ‘యహీయేలు’ రూపం ఆంగ్ల సంప్రదాయంలోని ‘Jahiel’ ప్రత్యామ్నాయానికి తగిన తెలుగు రూపాంతరం; గుర్తు [a] సరైన పేరుకే జతచేయబడింది.
