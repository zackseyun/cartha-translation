  source_fidelity: 'హీబ్రూ జాబితా నిర్మాణాన్ని నమ్మకంగా ప్రతిబింబించింది: హేమాను కుమారులలో ఇద్దరు, యెదూతూను కుమారులలో ఇద్దరు అని స్పష్టంగా వేరు చేసింది. వ్యక్తినామాలు మూలానికి, అలాగే ఆంగ్ల POB నిర్ణయాలకు అనుగుణంగా ఉన్నాయి. చివరలోని “ఉన్నారు” హీబ్రూలో సూచ్యంగా ఉన్న జాబితా-వాక్య సంబంధాన్ని తెలుగులో సహజంగా పూర్తి చేస్తుంది; అర్థాన్ని మార్చదు.'
