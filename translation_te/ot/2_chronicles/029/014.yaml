  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִן בְּנֵ֥י הֵימָ֖ן יחואל וְ/שִׁמְעִ֑י וּ/מִן בְּנֵ֣י יְדוּת֔וּן שְׁמַֽעְיָ֖ה וְ/עֻזִּיאֵֽל־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/014.yaml
  text: 'And from the sons of Heman: Jehuel and Shimei[a]; and from the sons of Jeduthun: Shemaiah and Uzziel.'
translation:
  language: te
  text: హేమాను కుమారులలో యెహూయేలు[a], షిమీ; యెదూతూను కుమారులలో షెమయా, ఉజ్జీయేలు ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని అనువాద సంప్రదాయాల్లో ఈ పేరును ‘యహీయేలు’ అని కూడా రాస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: …కుమారులలో
  rationale: מן సూచించే ‘నుండి/లోనుండి’ భావాన్ని తెలుగు వంశావళి జాబితాలో సహజంగా ‘కుమారులలో’ అని వ్యక్తం చేశాం. ప్రారంభ וְ ముందటి జాబితాతో అనుసంధానిస్తుంది; తెలుగు జాబితా ప్రవాహంలో అది విడిగా అనువదించకపోయినా అనుసంధానం నిలుస్తుంది.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: కుటుంబ లేదా వంశ సమూహానికి చెందినవారిని సూచించే ప్రత్యక్ష పదం; ఈ జాబితా సందర్భంలో సహజంగానూ పారదర్శకంగానూ ఉంది.
- source_word: הֵימָן
  choice: హేమాను
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: יחואל
  choice: యెహూయేలు
  rationale: WLCలోని హీబ్రూ వ్యంజన రూపాన్ని అనుసరించిన తెలుగు లిప్యంతరీకరణ; ఇతర సంప్రదాయ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וְשִׁמְעִי
  choice: షిమీ
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ; జాబితాలో సంధిని తెలుగు విరామచిహ్నంతో సహజంగా వ్యక్తం చేశాం.
- source_word: יְדוּתוּן
  choice: యెదూతూను
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: שְׁמַעְיָה
  choice: షెమయా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: וְעֻזִּיאֵל
  choice: ఉజ్జీయేలు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ; అంత్య సంధి జాబితా నిర్మాణంలో సహజంగా అంతర్భవించింది.
