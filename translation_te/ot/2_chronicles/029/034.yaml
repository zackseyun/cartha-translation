source:
  edition: WLC
  text: רַ֤ק הַ/כֹּֽהֲנִים֙ הָי֣וּ לִ/מְעָ֔ט וְ/לֹ֣א יָֽכְל֔וּ לְ/הַפְשִׁ֖יט אֶת כָּל הָ/עֹל֑וֹת וַֽ/יְּחַזְּק֞וּ/ם אֲחֵי/הֶ֣ם הַ/לְוִיִּ֗ם עַד כְּל֤וֹת הַ/מְּלָאכָה֙ וְ/עַ֣ד יִתְקַדְּשׁ֣וּ הַ/כֹּֽהֲנִ֔ים כִּ֤י הַ/לְוִיִּם֙ יִשְׁרֵ֣י לֵבָ֔ב לְ/הִתְקַדֵּ֖שׁ מֵֽ/הַ/כֹּהֲנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/034.yaml
  text: Only the priests were too few[a], and they were not able to skin all the burnt offerings, so their brothers the Levites supported them until the work was finished and until the priests had consecrated themselves[b]. For the Levites were more upright in heart to consecrate themselves than the priests.
translation:
  language: te
  text: అయితే యాజకుల సంఖ్య మాత్రం చాలా తక్కువగా ఉండడంతో, వారు దహనబలులన్నిటి తోలు తీయలేకపోయారు. కాబట్టి పని పూర్తయ్యేంతవరకు, యాజకులు తమను తాము ప్రతిష్ఠించుకునేంతవరకు, వారి సహోదరులైన లేవీయులు వారికి తోడ్పడ్డారు[a]. ఎందుకంటే, తమను తాము ప్రతిష్ఠించుకోవడంలో లేవీయులు యాజకులకంటే మరింత యథార్థమైన హృదయం కలిగినవారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మూలభాషలో అక్షరార్థం: ‘వారిని బలపరిచారు.’ సందర్భంలో ఇది ‘వారికి సహాయం చేశారు’ లేదా ‘తోడ్పడ్డారు’ అనే భావాన్ని ఇస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: ‘హృదయపూర్వకంగా’ లేదా ‘నిష్కపట హృదయంతో’ అని కూడా అనువదించవచ్చు; మూలభాష అంతరంగ యథార్థతను నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: అయితే
  rationale: ఇక్కడ ఈ పదం ముందున్న సందర్భానికి వ్యతిరేకతను సూచిస్తూ, యాజకుల కొరత అనే పరిమితిని ముందుకు తెస్తుంది. సహజమైన తెలుగు వాక్యప్రవాహంలో ‘అయితే’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לִמְעָט
  choice: తక్కువమంది ఉండడంతో
  rationale: యాజకుల సంఖ్య కేవలం తక్కువగా ఉందని కాక, పని చేయడానికి సరిపోలేదని సందర్భం సూచిస్తుంది; కారణార్థక నిర్మాణం ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְהַפְשִׁיט
  choice: తోలు తీయడం
  rationale: బలిపశువుల చర్మాన్ని తొలగించడాన్ని సూచించే స్పష్టమైన, సామాన్యులకు అర్థమయ్యే తెలుగు ప్రయోగం.
- source_word: הָעֹלוֹת
  choice: దహనబలులు
  rationale: పూర్తిగా అర్పించి దహనం చేసే బలికి తెలుగు బైబిలు పరిభాషలో స్థిరమైన, సంక్షిప్తమైన పదం.
- source_word: וַיְחַזְּקוּם
  choice: వారికి తోడ్పడ్డారు
  rationale: మూల క్రియ అక్షరార్థంగా ‘వారిని బలపరిచారు’ అని ఉన్నా, ఈ సందర్భంలో పని పూర్తిచేయడానికి ఆచరణాత్మక సహాయం అందించారనే భావం. ‘తోడ్పడ్డారు’ సహజంగా ఆ కార్యార్థాన్ని ఇస్తుంది; అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: אֲחֵיהֶם
  choice: వారి సహోదరులైన
  rationale: మూలంలోని కుటుంబసంబంధ పదాన్ని కాపాడుతూ, లేవీయులు వారి తోటి ఇశ్రాయేలీయులు/ఆలయ సేవకులు అనే సంబంధాన్ని గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: עַד כְּלוֹת הַמְּלָאכָה
  choice: పని పూర్తయ్యేంతవరకు
  rationale: కార్యం ముగిసే దాకా కొనసాగిన సహాయాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יִתְקַדְּשׁוּ
  choice: తమను తాము ప్రతిష్ఠించుకోవడం
  rationale: పవిత్ర సేవకు అవసరమైన ఆచారపరమైన స్వీయ సిద్ధీకరణను సూచిస్తుంది; కేవలం నైతిక పవిత్రతగా మార్చకుండా యాజకసేవా సందర్భాన్ని నిలుపుతుంది.
- source_word: יִשְׁרֵי לֵבָב
  choice: హృదయంలో మరింత యథార్థంగా
  rationale: అంతరంగ నిష్కపటత లేదా సూటితనాన్ని వ్యక్తం చేస్తూ, తరువాతి מִן వల్ల వచ్చే తులనాత్మక భావాన్ని ‘మరింత’ ద్వారా నిలుపుతుంది.
- source_word: לְהִתְקַדֵּשׁ מֵהַכֹּהֲנִים
  choice: తమను తాము ప్రతిష్ఠించుకోవడంలో ... యాజకులకంటే
  rationale: מִן సూచించే పోలికను స్పష్టంగా ఉంచి, లేవీయుల అంతరంగ వైఖరిని ఈ ప్రత్యేక ప్రతిష్ఠీకరణ సందర్భానికే పరిమితం చేస్తుంది.
theological_decisions:
- issue: లేవీయులు మరియు యాజకుల మధ్య పోలిక స్వభావం
  choice: తమను తాము ప్రతిష్ఠించుకోవడంలో లేవీయులు యాజకులకంటే హృదయంలో మరింత యథార్థంగా ఉన్నారని అనువదించాం.
  alternative: లేవీయులు యాజకులకంటే త్వరగా లేదా మరింత సిద్ధంగా తమను తాము ప్రతిష్ఠించుకున్నారు.
  rationale: יִשְׁרֵי לֵבָב కేవలం వేగాన్ని లేదా పరిపాలనా సిద్ధతను కాక అంతరంగ యథార్థతను సూచిస్తుంది. అదే సమయంలో, ఈ పోలికను యాజకవర్గమంతటిపై సాధారణ తీర్పుగా విస్తరించకుండా ఈ సంఘటనలోని ప్రతిష్ఠీకరణకే పరిమితం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ఆలయసేవకు సంబంధించిన ‘దహనబలులు’, ‘ప్రతిష్ఠించుకోవడం’ వంటి గౌరవప్రదమైన బైబిలు పరిభాషను నిలుపుకుంది. మూలంలోని పోలికను మృదువుచేయకుండా, దానిని అనవసరమైన విస్తృత యాజకవ్యతిరేక వ్యాఖ్యగా మార్చకుండా అనువదించబడింది.
