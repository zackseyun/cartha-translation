revisions:
- from: అయితే యాజకులు తక్కువమంది ఉండడంతో దహనబలులన్నిటి తోలు తీయలేకపోయారు. కాబట్టి పని పూర్తయ్యేంతవరకు, యాజకులు తమను తాము ప్రతిష్ఠించుకునేంతవరకు, వారి సహోదరులైన లేవీయులు వారికి తోడ్పడ్డారు[a]. ఎందుకంటే, తమను తాము ప్రతిష్ఠించుకోవడంలో లేవీయులు యాజకులకంటే హృదయంలో మరింత యథార్థంగా ఉన్నారు[b].
  to: అయితే యాజకుల సంఖ్య మాత్రం చాలా తక్కువగా ఉండడంతో, వారు దహనబలులన్నిటి తోలు తీయలేకపోయారు. కాబట్టి పని పూర్తయ్యేంతవరకు, యాజకులు తమను తాము ప్రతిష్ఠించుకునేంతవరకు, వారి సహోదరులైన లేవీయులు వారికి తోడ్పడ్డారు[a]. ఎందుకంటే, తమను తాము ప్రతిష్ఠించుకోవడంలో లేవీయులు యాజకులకంటే మరింత యథార్థమైన హృదయం కలిగినవారు[b].
  rationale: The revision retains the source’s sequence and all its cultic and comparative elements, while making the restrictive force of רַק and the idiomatic force of ישרי לבב clearer in modern standard Telugu. It does not turn the comparison into a general judgment against the priesthood or merely a claim about speed of preparation.
