id: 2CH.29.20
reference: 2 Chronicles 29:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּשְׁכֵּם֙ יְחִזְקִיָּ֣הוּ הַ/מֶּ֔לֶךְ וַ/יֶּאֱסֹ֕ף אֵ֖ת שָׂרֵ֣י הָ/עִ֑יר וַ/יַּ֖עַל בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/020.yaml
  text: Then King Hezekiah rose early[a], gathered the officials of the city, and went up to the house of Yahweh.
translation:
  language: te
  text: అప్పుడు హిజ్కియా రాజు తెల్లవారగానే లేచి, పట్టణ అధికారులను సమకూర్చి, యాహ్వే[a] మందిరానికి ఎక్కి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో יהוה (YHWH) అనే దేవుని వ్యక్తిగత నామం ఉంది; దానిని ఇక్కడ “యాహ్వే”గా లిప్యంతరీకరించాం.
    reason: దైవనామపు మూలరూపాన్ని తెలియజేసి, ‘ప్రభువు’ లేదా సంప్రదాయ ‘యెహోవా’ అనే ప్రత్యామ్నాయాలతో ఉన్న భేదాన్ని స్పష్టం చేయడం.
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: తెల్లవారగానే లేచి
  rationale: שׁכם హిఫిల్ రూపం ఉదయాన్నే లేవడం లేదా పని త్వరగా ప్రారంభించడం అనే భావాన్ని ఇస్తుంది. ‘తెల్లవారగానే లేచి’ ఆ కాలసూచనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְחִזְקִיָּהוּ הַמֶּלֶךְ
  choice: హిజ్కియా రాజు
  rationale: హీబ్రూ పదక్రమంలో ‘హిజ్కియా, ఆ రాజు’ అని ఉన్నా, ‘హిజ్కియా రాజు’ అనేది తెలుగులో సహజంగా ఉండి అతని బిరుదును స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיֶּאֱסֹף
  choice: సమకూర్చి
  rationale: אָסַף ఇక్కడ వ్యక్తులను ఒకచోట చేర్చడాన్ని సూచిస్తుంది. ‘సమకూర్చి’ పరిపాలనా సందర్భానికి తగిన గౌరవప్రదమైన పదం.
- source_word: אֵת שָׂרֵי הָעִיר
  choice: పట్టణ అధికారులను
  rationale: שָׂרֵי అనే పదం పాలకులు, నాయకులు లేదా అధికారులు అనే అర్థాలను కలిగి ఉంది. ఈ పౌరపాలనా సందర్భంలో ‘అధికారులు’ వంశపారంపర్య రాజకుమారులు అనే అనవసర భావాన్ని కలిగించదు.
- source_word: וַיַּעַל
  choice: ఎక్కి వెళ్లాడు
  rationale: עָלָה యొక్క ‘పైకి వెళ్లడం’ అనే దిశాభావాన్ని నిలుపుతూ, మందిరానికి వెళ్లడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే మందిరానికి
  rationale: בֵּית అనే పదానికి అక్షరార్థం ‘ఇల్లు’ అయినా, ఈ సందర్భంలో అది దేవాలయాన్ని సూచిస్తుంది; అందువల్ల ‘మందిరం’ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది. יהוה అనే దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాకుండా నాలుగు హీబ్రూ అక్షరాలతో ఉన్న దైవనామమే ప్రత్యక్షంగా ఉంది. దానిని ‘యాహ్వే’గా ఇవ్వడం ఆ వ్యక్తిగత నామాన్ని నిలుపుతుంది; ఉచ్చారణ పునర్నిర్మాణంలో కొంత అనిశ్చితి ఉన్నందున పాదసూచికలో మూలరూపాన్ని పేర్కొన్నాం.
- issue: בֵּית יְהוָה యొక్క రూపకం
  choice: యాహ్వే మందిరం
  alternative: యాహ్వే ఇల్లు
  rationale: ‘ఇల్లు’ మూలరూపానికి దగ్గరగా ఉన్నా, ఇక్కడ సూచించబడినది యెరూషలేము దేవాలయం. ‘మందిరం’ తెలుగులో సహజంగా, సందిగ్ధత లేకుండా అదే సూచనను అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. హీబ్రూ కథన క్రమాన్ని నిలుపుతూ వరుస క్రియలను తెలుగు సహజత్వానికి అనుగుణంగా అసమాపక క్రియలతో అనుసంధానించాం.
