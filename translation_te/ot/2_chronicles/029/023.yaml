id: 2CH.29.23
reference: 2 Chronicles 29:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּגִּ֨ישׁוּ֙ אֶת שְׂעִירֵ֣י הַֽ/חַטָּ֔את לִ/פְנֵ֥י הַ/מֶּ֖לֶךְ וְ/הַ/קָּהָ֑ל וַ/יִּסְמְכ֥וּ יְדֵי/הֶ֖ם עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/023.yaml
  text: Then they brought near the goats for the sin offering before the king and the assembly[b][a], and they laid their hands on them.
translation:
  language: te
  text: అప్పుడు వారు పాపపరిహార బలికి మేకపోతులను రాజు, సమాజం ఎదుటకు తీసుకువచ్చారు[a]. వారు వాటిమీద తమ చేతులు ఉంచారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పాపపరిహార బలి మేకపోతులను రాజు, సమాజం ఎదుట సమర్పించారు.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠంలో ‘వారు వాటిమీద తమ చేతులు ఉంచారు’ అని ఉంది. ‘వారు’ అనేది సహజంగా రాజు, సమాజాన్ని సూచించవచ్చు; బహుశా వారు ప్రతినిధుల ద్వారా ఈ క్రియ చేసి ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגִּישׁוּ
  choice: ఎదుటికి తీసుకొచ్చారు
  rationale: నגשׁ హిఫీల్ రూపం ‘దగ్గరకు తీసుకురావడం’ లేదా ‘సమర్పించడం’ అనే అర్థం ఇస్తుంది. ఇక్కడ బలిపశువులను రాజు, సమాజం సమక్షానికి తీసుకురావడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שְׂעִירֵי הַחַטָּאת
  choice: పాపపరిహార బలికోసం మేకపోతులను
  rationale: שְׂעִירֵי మగ మేకలను సూచిస్తుంది; ఈ బలి సందర్భంలో חַטָּאת అమూర్తమైన ‘పాపం’ను కాక పాపానికి సంబంధించిన బలిని సూచిస్తుంది.
- source_word: לִפְנֵי
  choice: ఎదుటికి
  rationale: ఈ ఆచార సందర్భంలో రాజు, సమాజం సమక్షంలో బలిపశువులను ప్రవేశపెట్టడాన్ని సూచిస్తుంది.
- source_word: הַמֶּלֶךְ וְהַקָּהָל
  choice: రాజు, సమాజం
  rationale: קָהָל కూడివచ్చిన ప్రజాసమూహాన్ని సూచిస్తుంది. ‘సమాజం’ ఆధునిక తెలుగులో సహజంగా ఉండి, అనవసరమైన సంఘపరమైన ప్రత్యేకార్థాన్ని మోపదు.
- source_word: וַיִּסְמְכוּ יְדֵיהֶם
  choice: వారు తమ చేతులు ఉంచారు
  rationale: బలి సందర్భంలో סמך + ‘చేతులు’ అనేది బలిపశువుపై చేతులు ఉంచే ఆచారక్రియను సూచిస్తుంది. మూలంలోని బహువచన కర్తను అస్పష్టంగానే ఉంచుతుంది.
- source_word: עֲלֵיהֶם
  choice: వాటిమీద
  rationale: ఈ బహువచన సర్వనామం ముందున్న మేకపోతులను సూచిస్తుంది; తెలుగులో ‘వాటిమీద’ సహజం.
theological_decisions:
- issue: బలి సందర్భంలో חַטָּאת అర్థం
  choice: పాపపరిహార బలి
  alternative: పాపం
  rationale: మేకపోతులను తీసుకురావడం, వాటిమీద చేతులు ఉంచడం అనే తక్షణ సందర్భం חַטָּאת ఇక్కడ పాపం కోసం అర్పించే బలిని సూచిస్తుందని తెలియజేస్తుంది.
- issue: ‘వారు తమ చేతులు ఉంచారు’ అనే వాక్యంలో కర్త ఎవరు?
  choice: హీబ్రూ వాక్యంలోని ‘వారు’ అనే అస్పష్టతను ప్రధాన పాఠ్యంలో నిలుపుకోవడం
  alternative: యాజకులే చేతులు ఉంచారని స్పష్టీకరించడం
  rationale: దగ్గరలోని పూర్వపదాలు రాజు, సమాజం; కాబట్టి కర్త సహజంగా వారినే—బహుశా ప్రతినిధుల ద్వారా—సూచించవచ్చు. అయితే ఆచరణ విధానాన్ని మూలపాఠ్యం వివరించదు; అందువల్ల అనవసరంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. బలి సంబంధ పదజాలాన్ని స్పష్టంగా ఉంచుతూ, కర్తకు సంబంధించిన హీబ్రూ అస్పష్టతను కాపాడింది.
