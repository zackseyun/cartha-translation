  yaml_path: translation/ot/2_chronicles/010/003.yaml
  text: So they sent and called for him[a], and Jeroboam and all Israel came and spoke to Rehoboam, saying,
translation:
  language: te
  text: 'వారు అతని కోసం పంపి అతణ్ణి పిలిచారు[a]. అప్పుడు యరొబాము, ఇశ్రాయేలు అంతటివారూ వచ్చి రెహబాముతో ఇలా అన్నారు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు కబురు పంపి అతణ్ణి పిలిచారు.” హెబ్రీలో “పంపి” అనే క్రియకు కర్మ స్పష్టంగా చెప్పబడలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: వారు మనుషులను పంపి
  rationale: שׁלח క్రియకు కర్మ హెబ్రీ పాఠ్యంలో అంతర్లీనంగా ఉంది. తెలుగులో సహజమైన భావవ్యక్తీకరణ కోసం ‘మనుషులను’ చేర్చినా, మూలంలోని సంక్షిప్తతను పాదసూచికలో తెలియజేశాం.
- source_word: וַיִּקְרְאוּ לוֹ
  choice: అతణ్ణి పిలిపించారు
  rationale: קרא + ל ఇక్కడ యరొబామును తమ వద్దకు రప్పించుకోవడానికి పిలవడం అనే భావాన్ని ఇస్తుంది; ‘పిలిపించారు’ ఆధునిక తెలుగులో సహజంగా ఆ అర్థాన్ని తెలియజేస్తుంది.
- source_word: וַיָּבֹא
  choice: వచ్చి
  rationale: ఏకవచన క్రియ యరొబామును ప్రధాన కర్తగా చూపుతుంది; తరువాత ‘ఇశ్రాయేలీయులందరూ’ అతనితో కూడిన సమూహంగా వస్తారు. తెలుగులో సంయుక్త కర్తతో బహువచన భావం సహజంగా వ్యక్తమవుతుంది.
- source_word: יָרָבְעָם וְכָל יִשְׂרָאֵל
  choice: యరొబాము, ఇశ్రాయేలీయులందరూ
  rationale: ‘ఇశ్రాయేలు అంతా’ అనే జాతీయ సమష్టి భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేయడానికి ‘ఇశ్రాయేలీయులందరూ’ ఎంచుకున్నాం.
- source_word: וַיְדַבְּרוּ אֶל
  choice: రెహబాముతో … అన్నారు
  rationale: דבר אל యొక్క ‘మాట్లాడారు’ భావాన్ని, వెంటనే వచ్చే ప్రత్యక్ష ప్రసంగ పరిచయంతో కలిపి తెలుగులో సహజమైన ‘ఇలా అన్నారు’గా వ్యక్తం చేశాం.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నారు:'
  rationale: తదుపరి వచనంలోని ప్రత్యక్ష ప్రసంగాన్ని పరిచయం చేసే హెబ్రీ అనంతరూపాన్ని తెలుగులో సహజంగా కోలన్‌తో కూడిన ‘ఇలా అన్నారు’గా ఇచ్చాం.
