  issues:
  - severity: medium
    issue: The text adds “మనుషులను” (“men”).
    rationale: The Hebrew verb “they sent” is elliptical; it does not identify what or whom they sent. Adding messengers over-specifies the source.
  - severity: low
    issue: “ఇశ్రాయేలీయులందరూ” narrows “all Israel.”
    rationale: The Hebrew uses the conventional collective/national designation כָל־יִשְׂרָאֵל. A collective Telugu expression better preserves that scope.
