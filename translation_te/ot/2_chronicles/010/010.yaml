source:
  edition: WLC
  text: וַ/יְדַבְּר֣וּ אִתּ֗/וֹ הַ/יְלָדִים֙ אֲשֶׁ֨ר גָּדְל֣וּ אִתּ/וֹ֮ לֵ/אמֹר֒ כֹּֽה תֹאמַ֡ר לָ/עָם֩ אֲשֶׁר דִּבְּר֨וּ אֵלֶ֜י/ךָ לֵ/אמֹ֗ר אָבִ֨י/ךָ֙ הִכְבִּ֣יד אֶת עֻלֵּ֔/נוּ וְ/אַתָּ֖ה הָקֵ֣ל מֵ/עָלֵ֑י/נוּ כֹּ֚ה תֹּאמַ֣ר אֲלֵ/הֶ֔ם קָֽטָנִּ֥/י עָבָ֖ה מִ/מָּתְנֵ֥י אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/010.yaml
  text: The young men who had grown up with him spoke to him[a], saying, “This is what you shall say to the people who spoke to you, saying, ‘Your father made our yoke heavy, but you make it lighter for us.’ Thus you shall say to them[b], ‘My little finger is thicker than my father’s waist.’”
translation:
  language: te
  text: 'అతనితో పాటు పెరిగిన యువకులు అతనితో ఇలా అన్నారు: “నీ తండ్రి మా కాడిని బరువుగా చేశాడు; కాని నువ్వు మా మీదున్న కాడి బరువును తగ్గించు అని నీతో చెప్పిన ప్రజలకు నువ్వు ఇలా చెప్పాలి: ‘నా చిటికెన వేలు[a] నా తండ్రి నడుముకంటే[b] మందంగా ఉంది.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో పదశః, “నా చిన్నది” లేదా “నా చిన్నతనం”; ఈ మాటను సాధారణంగా “నా చిటికెన వేలు” అనే నానుడిగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నా తండ్రి నడుము దిగువ భాగంకంటే.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְלָדִים
  choice: యువకులు
  rationale: ఈ రాజసభ సందర్భంలో, ‘అతనితో పాటు పెరిగిన’ అనే వివరణతో కలిపి చూస్తే ఇది చిన్న పిల్లలను కాకుండా రెహబాము వయసువారైన యువ సలహాదారులను సూచిస్తుంది.
- source_word: גָּדְלוּ אִתּוֹ
  choice: అతనితో పాటు పెరిగిన
  rationale: రెహబాముతో కలిసి పెరిగి పెద్దవారైన సమవయస్కులను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כֹּה תֹאמַר
  choice: నువ్వు ఇలా చెప్పాలి
  rationale: హీబ్రూ ఆదేశాత్మక మాట-పరిచయ సూత్రాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: אָבִיךָ הִכְבִּיד אֶת עֻלֵּנוּ
  choice: నీ తండ్రి మా కాడిని బరువుగా చేశాడు
  rationale: עֹל అనే స్పష్టమైన ‘కాడి’ రూపకాన్ని ‘భారం’గా సడలించకుండా నిలుపుతూ, הכביד యొక్క బరువుగా చేయడం అనే భావాన్ని వ్యక్తపరుస్తుంది.
- source_word: הָקֵל מֵעָלֵינוּ
  choice: మా మీదున్న కాడి బరువును తగ్గించు
  rationale: ముందున్న ‘కాడి’నే అంతర్లీన కర్మగా తీసుకొని, מֵעָלֵינוּలోని ‘మా మీద నుంచి/మా మీదున్న’ భావాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: קָטָנִּי
  choice: నా చిటికెన వేలు
  rationale: పదశః ‘నా చిన్నది/నా చిన్నతనం’ అనే అస్పష్ట రూపానికి బదులు, సందర్భంలో సాధారణంగా గ్రహించే శరీరభాగ సంబంధమైన నానుడి భావాన్ని ఇస్తుంది; పదశః రూపాన్ని పాదసూచికలో ఉంచింది.
- source_word: עָבָה
  choice: లావుగా ఉంది
  rationale: వేలు మరియు నడుము మధ్య అతిశయోక్తితో చేసిన మందం/లావు పోలికను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מִמָּתְנֵי אָבִי
  choice: నా తండ్రి నడుముకంటే
  rationale: מָתְנַיִם సూచించే నడుము లేదా నడుము దిగువ భాగాన్ని ఆధునిక పాఠకులకు స్పష్టంగా అందిస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని వాడింది. రాజుతో యువకులు మాట్లాడుతున్నప్పటికీ, హీబ్రూ ద్వితీయ పురుష ఏకవచనంలోని సన్నిహిత సమవయస్కుల ధోరణిని నిలుపుతూ ‘నువ్వు/నీ’ రూపాలను ఉంచింది. ‘కాడి’ అనే మూల రూపకాన్ని కాపాడింది.
