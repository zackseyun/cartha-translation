  to: 'అతనితో పాటు పెరిగిన యువకులు అతనితో ఇలా అన్నారు: “నీ తండ్రి మా కాడిని బరువుగా చేశాడు; కాని నువ్వు మా మీదున్న కాడి బరువును తగ్గించు అని నీతో చెప్పిన ప్రజలకు నువ్వు ఇలా చెప్పాలి: ‘నా చిటికెన వేలు[a] నా తండ్రి నడుముకంటే[b] మందంగా ఉంది.’”'
  rationale: ఉద్ధరించిన ప్రజల విజ్ఞప్తిని తెలుగులో విడి ఉద్ధరణగా కాకుండా సంబంధవాక్యంలో సహజంగా కలిపి, “నీతో చెప్పిన ప్రజలకు” అనే మూల సంబంధాన్ని స్పష్టం చేశాను. ‘లావుగా’ స్థానంలో ‘మందంగా’ ఉంచి మూలంలోని మందం పోలికను మరింత నేరుగా ప్రతిబింబించాను. పాదసూచికల అంకర్లు, వాటి సమాచారం, మరియు వచనార్థం మార్చలేదు.
