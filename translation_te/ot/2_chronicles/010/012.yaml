translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. మూలంలోని పునరుక్తిని పూర్తిగా తొలగించకుండా, తెలుగు వాక్యనిర్మాణంలో స్పష్టత కోసం రెండు వాక్యాలుగా అమర్చాం. అయితే ‘చెప్పినట్లే ... అన్న మాట ప్రకారం’ కొంత పునరుక్తిగా వినిపించవచ్చు; ఇది మూలంలోని రాజు మాట–దాని నెరవేర్పు సంబంధాన్ని నిలుపుతుంది.
