source:
  edition: WLC
  text: וַ/יָּבֹ֨א יָרָבְעָ֧ם וְ/כָל הָ/עָ֛ם אֶל רְחַבְעָ֖ם בַּ/יּ֣וֹם הַ/שְּׁלִשִׁ֑י כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר הַ/מֶּ֨לֶךְ֙ לֵ/אמֹ֔ר שׁ֥וּבוּ אֵלַ֖/י בַּ/יּ֥וֹם הַ/שְּׁלִשִֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/012.yaml
  text: So Jeroboam and all the people came to Rehoboam on the third day[a], just as the king had said, saying, “Return to me on the third day.”
translation:
  language: te
  text: రాజు, “మూడవ రోజున నా దగ్గరకు తిరిగి రండి” అని చెప్పినట్లుగా, యెరోబాము, ప్రజలందరూ మూడవ రోజున రెహబాము వద్దకు వచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా దగ్గరకు మళ్లీ రండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చారు
  rationale: בוא సందర్భాన్ని బట్టి ‘వచ్చు/వెళ్లు/చేరుకొను’ అనే భావాలు ఇవ్వగలదు. రెహబాము దగ్గరకు రావడాన్ని తెలుగులో సహజంగా ‘వచ్చారు’ అని బహువచన కర్తకు అనుగుణంగా అనువదించాం.
- source_word: יָרָבְעָם
  choice: యెరోబాము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: וְכָל הָעָם
  choice: ప్రజలందరూ
  rationale: עָם ఇక్కడ అధికారిక సభను కాక యెరోబాముతో ఉన్న ప్రజలను సూచిస్తుంది; ‘ప్రజలందరూ’ సహజమైన, స్పష్టమైన రూపం.
- source_word: אֶל רְחַבְעָם
  choice: రెహబాము దగ్గరకు
  rationale: אֶל వ్యక్తివైపు గమనాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘దగ్గరకు’ సహజంగా ఆ దిశాభావాన్ని తెలియజేస్తుంది.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: మూడవ రోజున
  rationale: కాలాన్ని సూచించే హీబ్రూ పదబంధానికి నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: כַּאֲשֶׁר דִּבֶּר הַמֶּלֶךְ
  choice: రాజు వారికి చెప్పినట్లే
  rationale: כַּאֲשֶׁר ముందటి రాజాజ్ఞతో జరిగిన చర్యకు ఉన్న ఖచ్చితమైన అనుగుణతను సూచిస్తుంది. ‘చెప్పినట్లే’ ఆ భావాన్ని సహజంగా ఇస్తుంది; సందర్భం వల్ల ‘వారికి’ని స్పష్టత కోసం చేర్చాం.
- source_word: לֵאמֹר
  choice: అన్న మాట ప్రకారం
  rationale: ఈ అవ్యయ క్రియారూపం ముందుగా పలికిన మాటల విషయాన్ని పరిచయం చేస్తుంది. హీబ్రూ వాక్య క్రమాన్ని యాంత్రికంగా అనుసరించకుండా, తెలుగులో ఉల్లేఖనాన్ని స్పష్టంగా అనుసంధానించేందుకు ఈ రూపాన్ని వాడాం.
- source_word: שׁוּבוּ אֵלַי
  choice: నా దగ్గరకు తిరిగి రండి
  rationale: שׁוב తిరిగి రావడం/వెళ్లడం అనే భావాన్ని ఇస్తుంది. మాట్లాడుతున్న రాజు దృష్టికోణానికి ‘నా దగ్గరకు తిరిగి రండి’ సహజంగా సరిపోతుంది.
