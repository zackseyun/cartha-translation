language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֣י יִשְׂרָאֵ֔ל הַ/יֹּֽשְׁבִ֖ים בְּ/עָרֵ֣י יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ עֲלֵי/הֶ֖ם רְחַבְעָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/017.yaml
  text: But Rehoboam reigned over the children of Israel who lived in the cities of Judah[a].
translation:
  language: te
  text: అయితే యూదా పట్టణాల్లో నివసిస్తున్న ఇశ్రాయేలు ప్రజలపై రెహబాము రాజుగా పరిపాలించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: ‘యూదా పట్టణాల్లో నివసిస్తున్న ఇశ్రాయేలు కుమారులు.’'
    reason: ‘ఇశ్రాయేలు ప్రజలు’గా అనువదించిన హీబ్రూ జాతివాచక పదబంధం యొక్క అక్షరార్థాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  choice: అయితే ఇశ్రాయేలు ప్రజలు
  rationale: בְּנֵי יִשְׂרָאֵל ఇక్కడ జాతిని సూచించే స్థిరమైన పదబంధం; ఆధునిక తెలుగులో ‘ఇశ్రాయేలు ప్రజలు’ సహజంగా అర్థమవుతుంది. వావ్‌ను ముందరి వచనంలోని తిరుగుబాటుతో ఉన్న వ్యత్యాసాన్ని చూపేందుకు ‘అయితే’గా అనువదించాం.
- source_word: הַיֹּשְׁבִים
  choice: నివసిస్తున్న
  rationale: ישב కృదంతం ఇక్కడ ఒక ప్రదేశంలో నివసించడాన్ని సూచిస్తుంది; ‘నివసిస్తున్న’ దాని కొనసాగుతున్న భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: בְּעָרֵי יְהוּדָה
  choice: యూదా పట్టణాల్లో
  rationale: ఈ స్థలవాచక పదబంధాన్ని సహజమైన ఆధునిక తెలుగు రూపంలో ఇచ్చాం; ఇది యూదా ప్రాంతంలోని పట్టణాలను సూచిస్తుంది.
- source_word: וַיִּמְלֹךְ
  choice: రాజుగా పరిపాలించాడు
  rationale: מלך ఇక్కడ రెహబాము వారిపై రాజ్యాధికారం చలాయించడాన్ని సూచిస్తుంది; ‘రాజుగా పరిపాలించాడు’ అర్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: עֲלֵיהֶם
  choice: వారిపై
  rationale: על మరియు బహువచన సర్వనామ ప్రత్యయం ప్రజలపై పాలనను సూచిస్తాయి; తెలుగులో ‘వారిపై’ దీనిని నేరుగా నిలుపుతుంది.
- source_word: רְחַבְעָם
  choice: రెహబాము
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని పదక్రమాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా కర్తను క్రియకు ముందు ఉంచాం.
