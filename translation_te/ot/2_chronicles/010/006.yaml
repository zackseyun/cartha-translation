base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/006.yaml
  text: Then King Rehoboam consulted the elders who had stood before Solomon his father while he was still alive[a], saying[b], “How do you advise me to answer this people?”
translation:
  language: te
  text: అప్పుడు రాజైన రెహబాము, తన తండ్రియైన సొలొమోను జీవించి ఉన్నప్పుడు అతని సమక్షంలో నిలిచిన[a] పెద్దలను సంప్రదించి, “ఈ ప్రజలకు ఏమని జవాబివ్వాలని మీరు నాకు సలహా ఇస్తారు[b]?” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సమక్షంలో నిలిచిన” అనే మాటకు అధికారికంగా అతని వద్ద హాజరై సేవచేసిన అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఈ ప్రజలకు ఒక మాటను తిరిగి ఇవ్వడానికి మీరు ఎలా సలహా ఇస్తున్నారు?” ఇది జవాబు ఇవ్వడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: సంప్రదిస్తూ
  rationale: יעץ నిఫాల్ రూపం ఇక్కడ ఇతరుల నుంచి సలహా కోరడాన్ని సూచిస్తుంది. ‘సంప్రదిస్తూ’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ భావాన్ని నిలుపుతుంది.
- source_word: הַזְּקֵנִים
  choice: పెద్దలను
  rationale: ఈ సందర్భంలో זקנים కేవలం వృద్ధులను కాక, అనుభవజ్ఞులైన సీనియర్ సలహాదారులను సూచిస్తుంది. ‘పెద్దలు’ ఆ సామాజిక, అధికారిక భావాలను సహజంగా మోస్తుంది.
- source_word: אֲשֶׁר הָיוּ עֹמְדִים לִפְנֵי
  choice: అతని సన్నిధిలో నిలిచిన
  rationale: హీబ్రూ రూపకాన్ని నిలుపుతూ, రాజు సమక్షంలో అధికారికంగా సేవచేయడం లేదా హాజరై ఉండడం అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో స్పష్టం చేస్తుంది.
- source_word: שְׁלֹמֹה אָבִיו
  choice: తన తండ్రి సొలొమోను
  rationale: తెలుగులో సహజమైన పదక్రమంతో సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בִּהְיוֹתוֹ חַי
  choice: జీవించి ఉన్నప్పుడు
  rationale: సొలొమోను జీవించి ఉన్న కాలాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది; మూలంలో లేని అదనపు భావాన్ని చేర్చదు.
- source_word: אֵיךְ אַתֶּם נוֹעָצִים
  choice: ఏమని ... సలహా ఇస్తారు
  rationale: ప్రశ్న కోరుతున్నది సమాధానపు విషయమేమిటో కాబట్టి తెలుగులో ‘ఏమని ... సలహా ఇస్తారు’ సహజంగా ఉంటుంది; సలహా స్వీకర్తను ‘నాకు’ అని సందర్భానుసారంగా వ్యక్తం చేసింది.
- source_word: לְהָשִׁיב ... דָּבָר
  choice: జవాబివ్వాలని
  rationale: అక్షరార్థంగా ‘ఒక మాటను తిరిగి ఇవ్వడం’ అయిన హీబ్రూ నుడికారానికి తెలుగులో సహజ సమానార్థకం ‘జవాబివ్వడం’.
- source_word: לָעָם הַזֶּה
  choice: ఈ ప్రజలకు
  rationale: עם యొక్క సమూహార్థాన్ని ‘ప్రజలు’ ద్వారా కాపాడి, దత్తివ విభక్తితో జవాబు అందుకునే వారిని స్పష్టంగా చూపుతుంది.
