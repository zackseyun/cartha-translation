translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ ‘సన్నిధిలో నిలుచుట’ అనే రూపకాన్ని ప్రధాన పాఠ్యంలో ఉంచి, దాని అధికారిక సేవార్థాన్ని పాదటిప్పణిలో తెలిపాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
