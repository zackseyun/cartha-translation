revisions:
- from: కాబట్టి రాజు ప్రజల మాట వినలేదు. ఎందుకంటే ఈ పరిణామం[a] దేవుని నుండి కలిగింది; నెబాతు కుమారుడైన యరొబాముతో షిలోనీయుడైన అహీయా ద్వారా తాను పలికిన మాటను యాహ్వే స్థిరపరచడానికి ఇలా జరిగింది.
  to: కాబట్టి రాజు ప్రజల మాట వినలేదు. ఎందుకంటే ఇది దేవుని నుండి వచ్చిన పరిణామం; షిలోనీయుడైన అహీయా ద్వారా యరొబాము నెబాతు కుమారునితో తాను పలికిన తన మాటను యాహ్వే స్థిరపరచాలనే ఉద్దేశంతో ఇది జరిగింది.
  rationale: The revision more idiomatically expresses the Hebrew assertion that the development was from God, while preserving the text’s tension between the king’s action and divine purpose. It retains ‘స్థిరపరచు’ for הָקִים, preserves Yahweh’s name, and keeps the lexical ambiguity of נְסִבָּה in the footnote. The sentence order makes clear that Yahweh is the one who spoke the word through Ahijah.
  reviewer_model: gpt-5.6-terra
