id: 2CH.10.15
reference: 2 Chronicles 10:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹֽא שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֶל הָ/עָ֑ם כִּֽי הָיְתָ֤ה נְסִבָּה֙ מֵ/עִ֣ם הָֽ/אֱלֹהִ֔ים לְמַעַן֩ הָקִ֨ים יְהוָ֜ה אֶת דְּבָר֗/וֹ אֲשֶׁ֤ר דִּבֶּר֙ בְּ/יַד֙ אֲחִיָּ֣הוּ הַ/שִּֽׁלוֹנִ֔י אֶל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/015.yaml
  text: So the king did not listen to the people[a], for this turn of events was from God, so that Yahweh might establish his word that he had spoken through Ahijah the Shilonite to Jeroboam son of Nebat.
translation:
  language: te
  text: కాబట్టి రాజు ప్రజల మాట వినలేదు. ఎందుకంటే ఇది దేవుని నుండి వచ్చిన పరిణామం; షిలోనీయుడైన అహీయా ద్వారా యరొబాము నెబాతు కుమారునితో తాను పలికిన తన మాటను యాహ్వే స్థిరపరచాలనే ఉద్దేశంతో ఇది జరిగింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַע אֶל־הָעָם
  choice: ప్రజల మాట వినలేదు
  rationale: ఇక్కడ క్రియ కేవలం శబ్దం వినడాన్ని కాక, ప్రజల అభ్యర్థనకు చెవియొగ్గడాన్ని సూచిస్తుంది. ‘ప్రజల మాట వినలేదు’ అనేది సహజమైన తెలుగు; ‘లోబడలేదు’ అని అర్థాన్ని మరీ సంకుచితం చేయదు.
- source_word: נְסִבָּה
  choice: పరిణామం
  rationale: ఈ నామవాచకం మలుపు, పరిస్థితి, లేదా కారణంగా ఏర్పడిన పరిణామాన్ని సూచించగలదు. ‘పరిణామం’ కథనంలోని సంఘటనల దైవిక మలుపును సహజంగా తెలియజేస్తూ పదంలోని విస్తృతిని నిలుపుతుంది.
- source_word: מֵעִם הָאֱלֹהִים
  choice: దేవుని నుండి కలిగింది
  rationale: ఈ పదబంధం దైవిక మూలాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘దేవుని నుండి కలిగింది’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: לְמַעַן
  choice: స్థిరపరచడానికి
  rationale: లక్ష్యం లేదా ఉద్దేశాన్ని తెలిపే ఈ అవ్యయానికి తెలుగు క్రియార్థక రూపం సహజంగా సరిపోతుంది.
- source_word: הָקִים
  choice: స్థిరపరచడానికి
  rationale: קום ధాతువు హిఫీల్ రూపంలో ‘నిలిచేలా చేయడం, స్థాపించడం, ధృవపరచడం’ అనే భావం కలిగిస్తుంది. ‘స్థిరపరచడం’ మూలంలోని రూపకాన్ని కాపాడుతుంది; ‘నెరవేర్చడం’ కంటే తక్కువ వ్యాఖ్యాత్మకం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవిక వ్యక్తినామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: דְּבָרוֹ
  choice: తాను పలికిన మాటను
  rationale: ‘మాట’ ప్రవచన ప్రకటన అనే విస్తృత భావాన్ని నిలుపుతుంది. ‘వాగ్దానం’ అని అనువదిస్తే అర్థం అనవసరంగా సంకుచితమవుతుంది.
- source_word: בְּיַד
  choice: ద్వారా
  rationale: ప్రవచన వాక్యాన్ని అందించిన మధ్యవర్తిని సూచించే హీబ్రూ నుడికారానికి ‘ద్వారా’ సహజమైన తెలుగు సమానార్థకం.
- source_word: הַשִּׁלוֹנִי
  choice: షిలోనీయుడు
  rationale: ఈ సంబంధవాచక విశేషణం అహీయాకు షిలోతో ఉన్న సంబంధాన్ని అధికారికంగా నిలుపుతుంది.
- source_word: בֶּן נְבָט
  choice: నెబాతు కుమారుడు
  rationale: హీబ్రూ పితృనామ నిర్మాణానికి ప్రామాణికమైన తెలుగు రూపం.
theological_decisions:
- issue: దైవిక కారణత్వం మరియు మానవ చర్య
  choice: రాజు ప్రజల మాట వినలేదు; ఈ పరిణామం దేవుని నుండి కలిగింది
  alternative: రాజు వినకపోవడాన్ని దేవుడు నేరుగా చేయించాడని విపులీకరించడం
  rationale: హీబ్రూ పాఠం రాజు నిరాకరణను నిజమైన మానవ చర్యగా చెబుతూనే సంఘటనల పరిణామానికి దేవుడే మూలమని పేర్కొంటుంది. అనువాదం ఈ ఉద్రిక్తతను తగ్గించకుండా, మూలపాఠానికి మించిన ప్రత్యక్ష కారణత్వాన్ని కూడా చేర్చదు.
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించడం పాఠంలోని నామాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలిని ఉపయోగించాం. పొడవైన హీబ్రూ వాక్యాన్ని స్పష్టత కోసం రెండు వాక్యాలుగా విభజించినా, కారణం మరియు ఉద్దేశం మధ్య సంబంధాన్ని నిలిపాం. వ్యక్తినామాలను తెలుగు బైబిలు వాడుకకు దగ్గరగా లిప్యంతరీకరించాం.
