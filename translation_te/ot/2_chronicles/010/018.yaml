  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֞ח הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם אֶת הֲדֹרָם֙ אֲשֶׁ֣ר עַל הַ/מַּ֔ס וַ/יִּרְגְּמוּ ב֧/וֹ בְנֵֽי יִשְׂרָאֵ֛ל אֶ֖בֶן וַ/יָּמֹ֑ת וְ/הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם הִתְאַמֵּץ֙ לַֽ/עֲל֣וֹת בַּ/מֶּרְכָּבָ֔ה לָ/נ֖וּס יְרוּשָׁלִָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/018.yaml
  text: Then King Rehoboam sent Hadoram[a], who was over the forced labor, but the sons of Israel stoned him with stones, and he died[d][c][b]. And King Rehoboam strengthened himself to get up into the chariot to flee to Jerusalem.
translation:
  language: te
  text: అప్పుడు రాజు రెహబాము బలవంతపు శ్రమకు బాధ్యుడైన హదోరామును[a] పంపాడు. అయితే ఇశ్రాయేలు ప్రజలు అతనిని రాళ్లతో కొట్టగా, అతడు చనిపోయాడు.[b] రాజు రెహబాము యెరూషలేముకు పారిపోవడానికి రథం ఎక్కడానికి తనను తాను బలపరచుకున్నాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘హదోరాము’; సమాంతర వృత్తాంతమైన 1 రాజులు 12:18లో ‘అదోరాము’ అని ఉంది.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూలో రాళ్లతో కొట్టడాన్ని సూచించే క్రియతో పాటు ‘రాయి’ అనే పదం కూడా ఉంది; అక్షరార్థానికి దగ్గరగా, ‘వారు అతనిని రాయితో కొట్టారు; అతడు చనిపోయాడు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘రథం ఎక్కడానికి తనను తాను కూడదీసుకున్నాడు.’ కొందరు సందర్భంలోని అత్యవసరతను బట్టి ‘రథం ఎక్కడడానికి త్వరపడ్డాడు’ అని అనువదిస్తారు; అయితే హీబ్రూ క్రియ ప్రాథమికంగా తనను తాను బలపరచుకోవడం అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపాడు
  rationale: కథన సందర్భంలో שלח క్రియకు సహజమైన, నేరమైన తెలుగు రూపం.
- source_word: הֲדֹרָם
  choice: హదోరాము
  rationale: దినవృత్తాంతముల గ్రంథంలోని హీబ్రూ నామరూపం הֲדֹרָםను నేరుగా ప్రతిబింబిస్తుంది.
- source_word: אֲשֶׁר עַל הַמַּס
  choice: వెట్టిచాకిరికి అధికారిగా ఉన్న
  rationale: מַס ఇక్కడ కేవలం పన్నును కాకుండా బలవంతంగా విధించిన శ్రమసేవను సూచిస్తుంది; ‘వెట్టిచాకిరి’ ఈ భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּרְגְּמוּ בוֹ ... אֶבֶן
  choice: అతని మీద రాళ్లు రువ్వి చంపేశారు
  rationale: హీబ్రూలోని రాళ్లతో కొట్టడం మరియు దాని ఫలితమైన మరణాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; ‘రాళ్లు’ అనే నామవాచకాన్ని నిలుపుతుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: ‘ఇశ్రాయేలు కుమారులు’ అనేది జాతిని సూచించే హీబ్రూ నుడికారం; తెలుగులో ‘ఇశ్రాయేలు ప్రజలు’ సహజంగా అదే సమూహార్థాన్ని ఇస్తుంది.
- source_word: הִתְאַמֵּץ
  choice: తనను తాను కూడదీసుకున్నాడు
  rationale: Hitpael రూపంలోని స్వీయ-ప్రయత్నం లేదా తనను తాను బలపరచుకోవడం అనే భావాన్ని కేవలం ‘త్వరపడ్డాడు’గా మార్చకుండా, సందర్భానుకూలమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: לַעֲלוֹת בַּמֶּרְכָּבָה
  choice: రథం ఎక్కడానికి
  rationale: עלה యొక్క పైకి ఎక్కే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: לָנוּס יְרוּשָׁלָם
  choice: యెరూషలేముకు పారిపోవడానికి
  rationale: נוס యొక్క ‘పారిపోవు’ భావాన్ని నేరుగా కాపాడుతుంది.
