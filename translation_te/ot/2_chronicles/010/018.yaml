- from: అప్పుడు రాజైన రెహబాము వెట్టిచాకిరికి అధికారిగా ఉన్న హదోరామును[a] పంపాడు. అయితే ఇశ్రాయేలు ప్రజలు అతని మీద రాళ్లు రువ్వి చంపేశారు.[b] రాజైన రెహబాము యెరూషలేముకు పారిపోవడానికి రథం ఎక్కడానికి తనను తాను కూడదీసుకున్నాడు.[c]
  to: అప్పుడు రాజు రెహబాము బలవంతపు శ్రమకు బాధ్యుడైన హదోరామును[a] పంపాడు. అయితే ఇశ్రాయేలు ప్రజలు అతనిని రాళ్లతో కొట్టగా, అతడు చనిపోయాడు.[b] రాజు రెహబాము యెరూషలేముకు పారిపోవడానికి రథం ఎక్కడానికి తనను తాను బలపరచుకున్నాడు.[c]
  rationale: The revision preserves the source’s explicit distinction between the stoning and Hadoram’s death, improves the modern clarity of the forced-labor designation, and uses a more direct Telugu equivalent for Rehoboam’s self-strengthening. Footnote b has been rewritten to explain the Hebrew wording without presenting an unnatural Telugu phrase as a literal translation.
