id: 2CH.10.7
reference: 2 Chronicles 10:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבְּר֨וּ אֵלָ֜י/ו לֵ/אמֹ֗ר אִם תִּֽהְיֶ֨ה לְ/ט֜וֹב לְ/הָ/עָ֤ם הַ/זֶּה֙ וּ/רְצִיתָ֔/ם וְ/דִבַּרְתָּ֥ אֲלֵ/הֶ֖ם דְּבָרִ֣ים טוֹבִ֑ים וְ/הָי֥וּ לְ/ךָ֛ עֲבָדִ֖ים כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/007.yaml
  text: They spoke to him[a], saying, “If you will be good to this people, and if you please them and speak good words to them[b], then they will be your servants all your days.”
translation:
  language: te
  text: 'వారు అతనితో ఇలా అన్నారు: “నీవు ఈ ప్రజలకు మేలు చేసి, వారిని సంతోషపరచి[a], వారితో మంచి మాటలు మాట్లాడితే, వారు ఎల్లకాలం నీ సేవకులుగా ఉంటారు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారిపట్ల అనుకూలత చూపి.” హీబ్రూ క్రియకు వారిని సంతోషపరచడం లేదా వారిపట్ల అనుకూలంగా వ్యవహరించడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “వారు నిరంతరం నీకు సేవ చేస్తారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּהְיֶה לְטוֹב
  choice: మేలు చేసి
  rationale: హయా + లె + టోవ్ అనే హీబ్రూ ప్రయోగం ప్రజలకు మేలు కలిగేలా ఉండడం లేదా వారి మేలు కోసం వ్యవహరించడం అనే విస్తృత భావాన్ని ఇస్తుంది. ‘మేలు చేసి’ అనేది దయను మాత్రమే కాక హితకరమైన పరిపాలనను కూడా సూచిస్తుంది.
- source_word: לְהָעָם הַזֶּה
  choice: ఈ ప్రజలకు
  rationale: עָם ఇక్కడ రాజు పాలనలోని ప్రజాసమూహాన్ని సూచిస్తుంది; ‘ఈ ప్రజలకు’ అనేది నిర్దేశక పదాన్నీ, రాజకీయ సందర్భాన్నీ సహజంగా నిలుపుతుంది.
- source_word: וּרְצִיתָם
  choice: వారిని ప్రసన్నం చేసుకొని
  rationale: רצה ఇక్కడ ప్రజలను సంతోషపరచడం లేదా వారిపట్ల అనుకూలత చూపడం అనే భావాలు కలిగి ఉండవచ్చు. ప్రధాన పాఠంలోని ఎంపిక సందర్భానుసారంగా వారి సమ్మతిని పొందే భావాన్ని సహజంగా తెలియజేస్తుంది; ప్రత్యామ్నాయ భావం పాదటిప్పణిలో నిలుపబడింది.
- source_word: וְדִבַּרְתָּ אֲלֵהֶם דְּבָרִים טוֹבִים
  choice: వారితో మంచి మాటలు మాట్లాడితే
  rationale: דבר / דברים పదపునరుక్తిని సాధ్యమైనంతవరకు నిలుపుతూ, ‘మంచి మాటలు’ అనే మూలపాఠపు స్పష్టమైన వ్యక్తీకరణను సహజ తెలుగు వాక్యంగా అందిస్తుంది.
- source_word: וְהָיוּ לְךָ עֲבָדִים
  choice: వారు ... నీ సేవకులుగా ఉంటారు
  rationale: עֲבָדִים ఇక్కడ బానిసత్వం కంటే రాజుకు విధేయులైన ప్రజల రాజకీయ సేవను సూచిస్తుంది. నామవాచక నిర్మాణాన్ని నిలుపుతూ ‘సేవకులు’ అని అనువదించబడింది.
- source_word: כָּל הַיָּמִים
  choice: ఎల్లకాలం
  rationale: అక్షరార్థంగా ‘అన్ని దినాలు’ అనే ఈ హీబ్రూ ప్రయోగం నిరంతర విధేయతను సూచిస్తుంది. ‘ఎల్లకాలం’ ఆధునిక తెలుగులో సహజంగా ఉండి కాలవ్యాప్తిని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి ఉపయోగించబడింది. హీబ్రూ వాక్యంలోని షరతు–ఫలితం నిర్మాణం, ‘మంచి మాటలు’ అనే వ్యక్తీకరణ, సేవకులుగా ఉండే నామవాచక నిర్మాణం సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
