revisions:
- from: 'వారు అతనితో ఇలా అన్నారు: “నీవు ఈ ప్రజలకు మేలు చేసి, వారిని ప్రసన్నం చేసుకొని[a], వారితో మంచి మాటలు మాట్లాడితే, వారు ఎల్లకాలం నీ సేవకులుగా ఉంటారు[b].”'
  to: 'వారు అతనితో ఇలా అన్నారు: “నీవు ఈ ప్రజలకు మేలు చేసి, వారిని సంతోషపరచి[a], వారితో మంచి మాటలు మాట్లాడితే, వారు ఎల్లకాలం నీ సేవకులుగా ఉంటారు[b].”'
  rationale: The revision makes the rendering of וּרְצִיתָם direct and idiomatic while retaining the lexical alternative in the footnote. Footnote b now gives a genuinely useful structural alternative for וְהָיוּ לְךָ עֲבָדִים כָּל הַיָּמִים and avoids overstating the temporal expression.
