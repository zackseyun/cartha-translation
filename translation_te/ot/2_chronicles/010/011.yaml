source:
  edition: WLC
  text: וְ/עַתָּ֗ה אָבִ/י֙ הֶעְמִ֤יס עֲלֵי/כֶם֙ עֹ֣ל כָּבֵ֔ד וַ/אֲנִ֖י אֹסִ֣יף עַֽל עֻלְּ/כֶ֑ם אָבִ֗/י יִסַּ֤ר אֶתְ/כֶם֙ בַּ/שּׁוֹטִ֔ים וַ/אֲנִ֖י בָּֽ/עֲקְרַבִּֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/011.yaml
  text: And now[a], my father made your yoke heavy, but I will add to your yoke. My father disciplined you with whips, but I with scorpions.
translation:
  language: te
  text: ఇప్పుడు, నా తండ్రి మీ మీద బరువైన కాడిని మోపాడు; నేనైతే మీ కాడికి ఇంకా ఎక్కువ బరువు చేర్చుతాను. నా తండ్రి మిమ్మల్ని కొరడాలతో శిక్షించాడు; నేనైతే తేళ్లతో[a] శిక్షిస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తేలు-కొరడాలతో’ అని అర్థం కావచ్చు; అంటే పదునైన ముళ్లు లేదా కొక్కాలు అమర్చిన కొరడాలు. హెబ్రీలో అక్షరార్థంగా ‘తేళ్లతో’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעְמִיס עֲלֵיכֶם עֹל כָּבֵד
  choice: మీ మీద బరువైన కాడిని మోపాడు
  rationale: హిఫిల్ క్రియ ఇతరులపై భారాన్ని మోపే భావాన్ని ఇస్తుంది. ‘కాడి’ అనే మూల రూపకాన్ని నిలుపుతూ తెలుగులో సహజంగా అనువదించబడింది.
- source_word: אֹסִיף עַל עֻלְּכֶם
  choice: మీ కాడికి ఇంకా ఎక్కువ బరువు చేర్చుతాను
  rationale: ‘మీ కాడికి చేర్చుతాను’ అనే హెబ్రీ నిర్మాణాన్ని నిలుపుతూ, తెలుగులో ఏమి చేర్చబడుతుందో స్పష్టంగా ఉండేందుకు ‘బరువు’ చేర్చబడింది.
- source_word: יִסַּר
  choice: శిక్షించాడు / శిక్షిస్తాను
  rationale: ఈ సందర్భంలో క్రమశిక్షణ కలిగించే దండన భావం ఉంది. ‘శిక్షించాడు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, కొరడాలతో చేసే దండనకు సరిపోతుంది; రెండవ భాగంలో హెబ్రీలో విడిచిపెట్టిన క్రియను తెలుగులో సహజత కోసం పునరుద్ధరించాం.
- source_word: בַּשּׁוֹטִים
  choice: కొరడాలతో
  rationale: שׁוֹט అనే పదానికి స్పష్టమైన, సాధారణ ఆధునిక తెలుగు సమానం.
- source_word: בָּעֲקְרַבִּים
  choice: తేళ్లతో
  rationale: హెబ్రీ పదం అక్షరార్థంగా ‘తేళ్లు’ అని ఉంది. ప్రత్యేకమైన ముళ్ల కొరడాలను సూచించే అవకాశం ఉన్నప్పటికీ, ప్రధాన పాఠంలో మూలపదంలోని రూపకాన్ని నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘కాడి’ అనే రాజకీయ, శ్రమభార రూపకాన్ని అలాగే నిలిపాం; రెండు విరుద్ధ వాక్యభాగాల సమాంతరతను కాపాడాం.
