  text: וְ/כָל יִשְׂרָאֵ֗ל כִּ֠י לֹא שָׁמַ֣ע הַ/מֶּלֶךְ֮ לָ/הֶם֒ וַ/יָּשִׁ֣יבוּ הָ/עָ֣ם אֶת הַ/מֶּ֣לֶךְ לֵ/אמֹ֡ר מַה לָּ/נוּ֩ חֵ֨לֶק בְּ/דָוִ֜יד וְ/לֹֽא נַחֲלָ֣ה בְּ/בֶן יִשַׁ֗י אִ֤ישׁ לְ/אֹהָלֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל עַתָּ֕ה רְאֵ֥ה בֵיתְ/ךָ֖ דָּוִ֑יד וַ/יֵּ֥לֶךְ כָּל יִשְׂרָאֵ֖ל לְ/אֹהָלָֽי/ו־־־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/016.yaml
  text: And all Israel[a], because the king did not listen to them, answered the king, saying, “What share do we have in David? We have no inheritance in the son of Jesse. Each man to your tents, O Israel! Now see to your own house[b], David.” So all Israel went to their tents.
translation:
  language: te
  text: 'రాజు వారి మాట వినకపోవడంతో ఇశ్రాయేలీయులందరూ రాజుకు ఇలా జవాబిచ్చారు: “దావీదులో మనకు భాగమేముంది? యెష్షయి కుమారునిలో మనకు స్వాస్థ్యమేమీ లేదు. ఇశ్రాయేలూ, మీ గుడారాలకు వెళ్లిపోండి![a] దావీదూ, ఇప్పుడు నీ ఇంటి సంగతి నువ్వే చూసుకో!”[b] అప్పుడు ఇశ్రాయేలీయులందరూ తమ గుడారాలకు వెళ్లిపోయారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా “ప్రతి మనిషి, నీ గుడారాలకు, ఇశ్రాయేలూ!” ఇది ప్రతి ఒక్కరూ తమ తమ నివాసాలకు చెదరిపోవాలనే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: “ఇల్లు” అనే మాట ఇక్కడ దావీదు కుటుంబాన్ని లేదా రాజవంశాన్ని కూడా సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַע
  choice: మాట విను
  rationale: ఈ సందర్భంలో కేవలం శబ్దం వినడం కాక, ప్రజల విన్నపాన్ని ఆలకించి అంగీకరించడం అనే భావం ఉంది.
- source_word: וַיָּשִׁיבוּ
  choice: జవాబిచ్చారు
  rationale: שוב మూలం నుంచి వచ్చిన ఈ రూపం ఇక్కడ సహజంగా ‘జవాబివ్వడం’ అనే నుడికారార్థాన్ని కలిగిస్తుంది.
- source_word: חֵלֶק
  choice: భాగం
  rationale: దావీదుతో తమకు రాజకీయ లేదా వంశపారంపర్య సంబంధం లేదని ప్రకటించే రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: נַחֲלָה
  choice: స్వాస్థ్యం
  rationale: వారసత్వంగా లభించే వాటా, వంశ సంబంధం అనే భావాలను ‘స్వాస్థ్యం’ కాపాడుతుంది.
- source_word: בְּבֶן יִשַׁי
  choice: యెష్షయి కుమారునిలో
  rationale: హీబ్రూ ఉపసర్గను ప్రతిబింబిస్తూ, దావీదు వంశంలో తమకు వాటా లేదనే సమాంతర రూపకాన్ని నిలుపుతుంది.
- source_word: אִישׁ
  choice: ప్రతి ఒక్కరూ
  rationale: ఏకవచన పురుషలింగ నామవాచకం ఇక్కడ పంపిణీయార్థంలో ఉంది; ఆధునిక తెలుగులో ‘ప్రతి ఒక్కరూ’ ఆ ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְאֹהָלֶיךָ
  choice: తమ తమ గుడారాలకు వెళ్లండి
  rationale: ‘గుడారాలు’ అనే మూల చిత్రాన్ని ఉంచి, ఎవరి స్థలానికి వారు చెదరిపోవాలనే నుడికార భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: רְאֵה בֵיתְךָ
  choice: నీ సొంత ఇంటి సంగతి నువ్వే చూసుకో
  rationale: దావీదు తన వంశ వ్యవహారాన్ని తానే చూసుకోవాలనే తిరస్కార ధోరణిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לְאֹהָלָיו
  choice: తమ తమ గుడారాలకు
  rationale: ‘ఇశ్రాయేలీయులందరూ’ అనే సమూహ కర్త తర్వాత హీబ్రూలోని ఏకవచన స్వామ్యరూపానికి ఉన్న పంపిణీయార్థాన్ని తెలుగులో సహజమైన బహువచనంగా అందిస్తుంది.
theological_decisions:
- issue: אִישׁ అనే పంపిణీయ ఏకవచన పురుషలింగ నామవాచకం
  choice: ప్రతి ఒక్కరూ
  alternative: ప్రతి పురుషుడూ
  rationale: ఇక్కడ పదం సమాజంలోని ఒక్కొక్క వ్యక్తి తన స్థలానికి తిరిగిపోవాలనే పంపిణీయ పిలుపుగా పనిచేస్తుంది. ‘ప్రతి ఒక్కరూ’ ఆ అర్థాన్ని సహజంగా అందిస్తుంది; పాదటిప్పణిలో మూలరూపం తెలియజేయబడింది.
- issue: దావీదును రాజకీయంగా తిరస్కరించే నుడికారం
  choice: దావీదులో మనకు భాగమేముంది? యెష్షయి కుమారునిలో మనకు స్వాస్థ్యమేమీ లేదు.
  alternative: దావీదుతో మనకు సంబంధమేముంది? యెష్షయి కుమారునితో మనకు పనిలేదు.
  rationale: మూలంలోని ‘భాగం,’ ‘స్వాస్థ్యం’ అనే రాజకీయ, వంశపారంపర్య రూపకాలను ఆధునిక నినాదంగా సరళీకరించకుండా నిలుపుతుంది.
- issue: בֵיתְךָ లోని ‘ఇల్లు’ భావం
  choice: నీ సొంత ఇంటి సంగతి నువ్వే చూసుకో
  alternative: నీ వంశాన్ని నువ్వే చూసుకో
  rationale: ‘ఇల్లు’ అనేది గృహాన్నీ రాజవంశాన్నీ సూచించగల మూలభాషా ఉద్రిక్తతను ప్రధాన పాఠంలో పూర్తిగా విప్పకుండా ఉంచి, పాదటిప్పణిలో వంశార్థాన్ని సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ప్రజల మాటల్లోని పదునైన రాజకీయ తిరస్కారాన్ని నిలుపుతూ, ‘భాగం,’ ‘స్వాస్థ్యం,’ ‘గుడారాలు,’ ‘ఇల్లు’ అనే మూల రూపకాలను సాధ్యమైనంతవరకు కాపాడాం.
