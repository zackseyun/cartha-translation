  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సంక్షిప్త ఆజ్ఞను కాపాడుతూ కాలవ్యవధి భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలిపింది.
