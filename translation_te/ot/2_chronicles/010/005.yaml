  text: And he said to them[a], “Come back to me in three days.” So the people went away.
translation:
  language: te
  text: అతడు వారితో, “ఇంకా మూడు రోజులు[a] ఆగి, నా దగ్గరికి తిరిగి రండి” అన్నాడు. అప్పుడు ప్రజలు వెళ్లిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: “ఇంకా మూడు రోజులు, నా దగ్గరికి తిరిగి రండి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: అతడు వారితో … అన్నాడు
  rationale: హీబ్రూ కథనంలోని సాధారణ wayyiqtol రూపాన్ని సహజమైన తెలుగు ప్రత్యక్ష సంభాషణ నిర్మాణంలో అందిస్తుంది.
- source_word: עוֹד שְׁלֹשֶׁת יָמִים
  choice: ఇంకా మూడు రోజులు ఆగి
  rationale: అక్షరార్థంగా ‘ఇంకా మూడు రోజులు’ అని ఉన్నప్పటికీ, సందర్భంలో మూడు రోజులు వేచి ఉండాలనే భావం ఉంది; ‘ఆగి’ దానిని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: וְשׁוּבוּ אֵלָי
  choice: నా దగ్గరికి తిరిగి రండి
  rationale: బహువచన ఆజ్ఞారూపాన్ని, తిరిగి రావలసిన గమ్యమైన వక్తవైపు దిశను సహజంగా నిలుపుతుంది.
- source_word: וַיֵּלֶךְ הָעָם
  choice: అప్పుడు ప్రజలు వెళ్లిపోయారు
  rationale: సమూహవాచక ఏకవచనమైన హీబ్రూ కర్తను తెలుగు వాడుకకు తగిన బహువచన క్రియతో అందిస్తూ, కథన క్రమాన్ని ‘అప్పుడు’ ద్వారా సూచిస్తుంది.
