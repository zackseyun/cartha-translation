  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/שְׁמֹ֨עַ יָרָבְעָ֤ם בֶּן נְבָט֙ וְ/ה֣וּא בְ/מִצְרַ֔יִם אֲשֶׁ֣ר בָּרַ֔ח מִ/פְּנֵ֖י שְׁלֹמֹ֣ה הַ/מֶּ֑לֶךְ וַ/יָּ֥שָׁב יָרָבְעָ֖ם מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/002.yaml
  text: And when Jeroboam son of Nebat heard it (for he was in Egypt[a], where he had fled from before King Solomon)[b], Jeroboam returned from Egypt.
translation:
  language: te
  text: నెబాతు కుమారుడైన యెరోబాము ఆ సంగతి విన్నప్పుడు[a] (అతడు సొలొమోను రాజు సన్నిధి నుండి పారిపోయి ఐగుప్తులో ఉన్నాడు[b]), యెరోబాము ఐగుప్తు నుండి తిరిగి వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని గురించి విన్నప్పుడు.” హీబ్రూ మూలంలో అతడు ఏమి విన్నాడో స్పష్టంగా చెప్పలేదు; సందర్భమే దాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “సొలొమోను రాజు సన్నిధి నుండి అతడు పారిపోయిన చోట.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: విన్నప్పుడు
  rationale: היה తో కూడిన infinitive construct ఇక్కడ కాలసూచక ఉపవాక్యాన్ని ప్రవేశపెడుతుంది. ఆధునిక తెలుగులో ‘విన్నప్పుడు’ కథన ప్రవాహాన్ని సహజంగా తెలియజేస్తుంది; ‘అది సంభవించింది’ అనే శబ్దానువాదం అవసరం లేదు.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: నెబాతు కుమారుడు యెరోబాము
  rationale: హీబ్రూ construct patronymicను తెలుగులో సహజమైన గుర్తింపు క్రమంలో అనువదించి, పేర్లను ప్రామాణిక తెలుగు బైబిలు రూపాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וְהוּא בְמִצְרַיִם
  choice: అతడు ఐగుప్తులో ఉన్నాడు
  rationale: ఈ pronoun clause నేపథ్య సమాచారాన్ని ఇస్తుంది. తెలుగులో స్పష్టమైన వాక్యంగా ఉంచడం సహజంగా ఉండి, మూలంలోని parenthetical స్వభావాన్ని semicolon ద్వారా నిలుపుతుంది.
- source_word: אֲשֶׁר בָּרַח מִפְּנֵי שְׁלֹמֹה הַמֶּלֶךְ
  choice: సొలొమోను రాజు సన్నిధి నుండి అతడు అక్కడికి పారిపోయి ఉన్నాడు
  rationale: אֲשֶׁר ఐగుప్తును సూచిస్తూ ‘అక్కడికి’ అనే భావాన్ని ఇస్తుంది. מִפְּנֵי యొక్క ‘సన్నిధి నుండి/ఎదుటి నుండి’ అనే రూపకాన్ని నిలుపుతూ, సందర్భంలోని పారిపోవడాన్ని సహజ తెలుగులో వ్యక్తపరచాం.
- source_word: וַיָּשָׁב
  choice: తిరిగి వచ్చాడు
  rationale: ఈ కథన సందర్భంలో שוב ఒక ప్రదేశం నుండి తిరిగి రావడాన్ని సూచిస్తుంది; పశ్చాత్తాపం వంటి ధార్మిక అర్థం కాదు.
- source_word: מִמִּצְרָיִם
  choice: ఐగుప్తు నుండి
  rationale: מן తిరుగు ప్రయాణపు మూలస్థానాన్ని సూచిస్తుంది.
- source_word: שְׁמֹעַ
  choice: ఆ సంగతి విన్నప్పుడు
  rationale: మూల హీబ్రూలో వినబడిన విషయానికి ప్రత్యక్ష కర్మ లేదు. తెలుగు వాక్యానికి సహజత్వం కోసం సందర్భం సూచించే అనిశ్చిత విషయాన్ని ‘ఆ సంగతి’గా ఇచ్చి, మూలంలోని లోపాన్ని పాదసూచికలో తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు, గౌరవప్రదమైన కథన శైలి. ‘సన్నిధి నుండి’ అనే పదబంధం హీబ్రూ מִפְּנֵי రూపాన్ని నిలుపుతుంది; పాదసూచికలు మూలంలోని కర్మ-అస్పష్టతను, అక్షరార్థ నిర్మాణాన్ని తెలియజేస్తాయి.
