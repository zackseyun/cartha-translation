id: 2CH.10.9
reference: 2 Chronicles 10:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם מָ֚ה אַתֶּ֣ם נֽוֹעָצִ֔ים וְ/נָשִׁ֥יב דָּבָ֖ר אֶת הָ/עָ֣ם הַ/זֶּ֑ה אֲשֶׁ֨ר דִּבְּר֤וּ אֵלַ/י֙ לֵ/אמֹ֔ר הָקֵל֙ מִן הָ/עֹ֔ל אֲשֶׁר נָתַ֥ן אָבִ֖י/ךָ עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/009.yaml
  text: And he said to them[a], “What do you advise, so that we may answer this people who have spoken to me, saying, ‘Lighten the yoke that your father put on us’?”
translation:
  language: te
  text: అతడు వారితో, “నీ తండ్రి మాపై మోపిన కాడి భారాన్ని తగ్గించు అని నాతో చెప్పిన ఈ ప్రజలకు మనం ఏమని జవాబివ్వాలో మీరు ఏ సలహా ఇస్తారు?” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: అతడు వారితో ... అన్నాడు
  rationale: హీబ్రూ కథన సూత్రాన్ని సహజమైన ఆధునిక తెలుగు ప్రత్యక్ష సంభాషణ నిర్మాణంలో అందిస్తుంది.
- source_word: מָה אַתֶּם נוֹעָצִים
  choice: మీరు ఏ సలహా ఇస్తారు?
  rationale: יעץ అనే క్రియలోని సంప్రదించడం, సలహా కోరడం అనే భావాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: וְנָשִׁיב דָּבָר
  choice: మనం ఏమని జవాబివ్వాలి?
  rationale: ‘మాటను తిరిగి పంపడం’ అనే హీబ్రూ నుడికారానికి ‘జవాబివ్వడం’ సహజమైన తెలుగు సమానం; మొదటి పురుష బహువచనాన్ని ‘మనం’గా నిలుపుతుంది.
- source_word: הָעָם הַזֶּה
  choice: ఈ ప్రజలకు
  rationale: హీబ్రూ ఏకవచన సమూహార్థక పదాన్ని తెలుగు సమూహవాచకమైన ‘ప్రజలు’తో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דִּבְּרוּ אֵלַי לֵאמֹר
  choice: అని నాతో చెప్పిన
  rationale: ఉద్ధరణను పరిచయం చేసే לֵאמֹר భావాన్ని తెలుగు వాక్య నిర్మాణంలో ‘అని’తో, మునుపటి మాటను ‘చెప్పిన’తో సంక్షిప్తంగా అందిస్తుంది.
- source_word: הָקֵל מִן הָעֹל
  choice: కాడిని తేలిక చేయి
  rationale: ఆజ్ఞార్థక భావాన్నీ, עֹל లోని కాడి రూపకాన్నీ నిలుపుతూ తెలుగులో అర్థవంతంగా ఉంటుంది.
- source_word: אֲשֶׁר נָתַן אָבִיךָ עָלֵינוּ
  choice: నీ తండ్రి మాపై ఉంచిన
  rationale: రెహబామును ఉద్దేశించిన ఏకవచన సంబోధనను ‘నీ’తో, మోపబడిన భార భావాన్ని ‘మాపై ఉంచిన’తో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ప్రత్యక్ష సంభాషణను ఉపయోగించాం. ‘కాడి’ అనే మూల రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని భావార్థమైన ‘భారం’ను పాదసూచికలో ఇచ్చాం. గౌరవార్థక బహువచనమైన ‘మీరు’ సలహాదారుల సమూహాన్ని ఉద్దేశిస్తుంది; ఉద్ధరణలోని ‘నీ’ రెహబామును ఉద్దేశించిన హీబ్రూ ఏకవచనాన్ని ప్రతిబింబిస్తుంది.
