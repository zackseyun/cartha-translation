- from: అతడు వారితో, “నీ తండ్రి మాపై ఉంచిన కాడిని తేలిక చేయి[a] అని నాతో చెప్పిన ఈ ప్రజలకు మనం ఏమని జవాబివ్వాలి? మీరు ఏ సలహా ఇస్తారు?” అన్నాడు.
  to: అతడు వారితో, “నీ తండ్రి మాపై మోపిన కాడి భారాన్ని తగ్గించు అని నాతో చెప్పిన ఈ ప్రజలకు మనం ఏమని జవాబివ్వాలో మీరు ఏ సలహా ఇస్తారు?” అన్నాడు.
  rationale: The revision restores the Hebrew's consultative structure, improves the naturalness of the yoke expression in modern Telugu, and retains the source's metaphor and all participants without adding interpretive content.
