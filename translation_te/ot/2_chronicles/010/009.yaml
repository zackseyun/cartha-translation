review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the principal sense accurately, including the yoke metaphor, Rehoboam''s father, and the people''s prior request. However, its two questions are reversed: the Hebrew asks the advisers what counsel they give concerning how “we may answer” the people. Recasting this as one Telugu question better reflects the source syntax and relationship between counsel and reply.'
  naturalness: ‘కాడిని తేలిక చేయి’ is understandable but not idiomatic modern standard Telugu. ‘కాడి భారాన్ని తగ్గించు’ naturally expresses the imperative while retaining the yoke image. A single integrated question is also smoother Telugu direct speech.
  terminology: ‘కాడి’ appropriately preserves עֹל, and ‘జవాబివ్వాలో’ accurately renders the idiom וְנָשִׁיב דָּבָר. ‘మోపిన’ naturally conveys an imposed burden. No theological terminology is at issue.
  issues:
  - severity: low
    issue: The order and syntactic linkage of the two questions is reversed.
    rationale: The Hebrew asks, literally in sense, “What do you advise, that we may answer this people...?” The revision makes the advisers' counsel explicitly govern the proposed answer.
  - severity: low
    issue: ‘కాడిని తేలిక చేయి’ is slightly unnatural Telugu.
    rationale: ‘కాడి భారాన్ని తగ్గించు’ is idiomatic while retaining the literal yoke metaphor present in the Hebrew.
  revised_text: అతడు వారితో, “నీ తండ్రి మాపై మోపిన కాడి భారాన్ని తగ్గించు అని నాతో చెప్పిన ఈ ప్రజలకు మనం ఏమని జవాబివ్వాలో మీరు ఏ సలహా ఇస్తారు?” అన్నాడు.
  revised_footnotes:
  - marker: a
    text: లేదా, “నీ తండ్రి మాపై మోపిన భారాన్ని తగ్గించు.” హీబ్రూలో ‘కాడి’ అనే పదం ఉంది; అది బలవంతపు శ్రమకు లేదా అణచివేసే పాలనకు రూపకం.
    reason: lexical_alternative
