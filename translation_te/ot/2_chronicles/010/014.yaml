id: 2CH.10.14
reference: 2 Chronicles 10:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר אֲלֵ/הֶ֗ם כַּ/עֲצַ֤ת הַ/יְלָדִים֙ לֵ/אמֹ֔ר אַכְבִּיד֙ אֶֽת עֻלְּ/כֶ֔ם וַ/אֲנִ֖י אֹסִ֣יף עָלָ֑י/ו אָבִ֗/י יִסַּ֤ר אֶתְ/כֶם֙ בַּ/שּׁוֹטִ֔ים וַ/אֲנִ֖י בָּ/עֲקְרַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/014.yaml
  text: He spoke to them according to the advice of the young men[a], saying, “I will make your yoke heavier, and I will add to it. My father disciplined you with whips, but I with scorpions.”
translation:
  language: te
  text: 'అతడు యువకుల సలహా ప్రకారం వారితో ఇలా అన్నాడు: “నేను మీ కాడిని మరింత బరువుగా చేస్తాను; దానికి ఇంకా బరువు చేర్చుతాను. నా తండ్రి మిమ్మల్ని కొరడాలతో శిక్షించాడు; నేనైతే తేళ్లతో[a] శిక్షిస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తేలు-కొరడాలతో”; అంటే పదునైన మొనలు లేదా కొక్కాలు అమర్చిన కొరడాలతో అని భావం కావచ్చు. హీబ్రూ మూలంలో అక్షరార్థంగా “తేళ్లతో” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: వారితో ... అన్నాడు
  rationale: דבר యొక్క సాధారణ అర్థం ‘మాట్లాడు’. ఈ సందర్భంలో రాజు ఇచ్చిన ప్రతిస్పందనను సహజమైన తెలుగులో తెలియజేయడానికి ‘వారితో ఇలా అన్నాడు’ అని అనువదించాం.
- source_word: כַּעֲצַת הַיְלָדִים
  choice: యువకుల సలహా ప్రకారం
  rationale: עֵצָה అంటే సలహా; כ ఇక్కడ దాని ప్రకారం నడుచుకోవడాన్ని సూచిస్తుంది. הַיְלָדִים ఈ కథనంలో చిన్నపిల్లలను కాక రెహబాము సమవయస్కులైన యువ సలహాదారులను సూచిస్తుంది.
- source_word: אַכְבִּיד אֶת־עֻלְּכֶם
  choice: నేను మీ కాడిని మరింత బరువుగా చేస్తాను
  rationale: כבד హిఫీల్ రూపం ‘బరువుగా చేయడం’ అనే కారణార్థాన్ని ఇస్తుంది. עֹל అనే కాడి రూపకాన్ని నిలిపి, ఇప్పటికే ఉన్న భారాన్ని పెంచుతాననే భావాన్ని ‘మరింత’ ద్వారా స్పష్టం చేశాం.
- source_word: וַאֲנִי אֹסִיף עָלָיו
  choice: దానికి ఇంకా బరువు చేర్చుతాను
  rationale: יסף על అంటే దానిపై మరింత చేర్చడం. ‘దానికి’ అనేది ముందున్న కాడిని సూచిస్తుంది; సహజమైన తెలుగుకోసం చేర్చబడేది బరువని వ్యక్తం చేశాం.
- source_word: יִסַּר אֶתְכֶם
  choice: మిమ్మల్ని ... శిక్షించాడు / శిక్షిస్తాను
  rationale: יסר కు క్రమశిక్షణ పెట్టడం, దండించడం అనే పరిధి ఉంది. ఇక్కడ బలవంతపు రాజశిక్ష సందర్భం కావడంతో ‘శిక్షించాడు’ సహజంగా, స్పష్టంగా ఉంటుంది. రెండో ఉపవాక్యంలో హీబ్రూలో క్రియ లుప్తమైనప్పటికీ తెలుగులో భావపూర్ణత కోసం ‘శిక్షిస్తాను’ పునరుక్తం చేశాం.
- source_word: בַּשּׁוֹטִים
  choice: కొరడాలతో
  rationale: שׁוֹט అంటే కొరడా లేదా దెబ్బలు కొట్టే చర్మపు సాధనం. ఆధునిక తెలుగులో ‘కొరడా’ స్పష్టమైన సమానార్థకం.
- source_word: בָּעֲקְרַבִּים
  choice: తేళ్లతో
  rationale: עַקְרַבִּים అక్షరార్థంగా ‘తేళ్లు’. ఇది ముళ్లు లేదా కొక్కాలు అమర్చిన తీవ్రమైన కొరడాలను సూచించే అవకాశం ఉన్నా, మూలంలోని సజీవమైన రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని వాడాం. ‘కాడి’ అనే మూల రూపకాన్ని, ‘తేళ్లు’ అనే ఉద్దేశపూర్వకంగా కఠినమైన చిత్రణను నిలిపాం.
