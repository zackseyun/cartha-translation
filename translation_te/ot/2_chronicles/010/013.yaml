  yaml_path: translation/ot/2_chronicles/010/013.yaml
  text: And the king answered them harshly[b][a], and King Rehoboam forsook the counsel of the elders.
translation:
  language: te
  text: రాజు వారికి కఠినంగా జవాబిచ్చాడు; రాజైన రెహబాము పెద్దల సలహాను విడిచిపెట్టాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנֵם
  choice: వారికి జవాబిచ్చాడు
  rationale: ענה ఇక్కడ ‘జవాబివ్వడం’ అనే అర్థంలో ఉంది; 3వ పురుష బహువచన కర్మప్రత్యయం ఉన్నందున ‘వారికి’ అని స్పష్టంగా అనువదించాం.
- source_word: קָשָׁה
  choice: కఠినంగా
  rationale: మూలంలో విశేషణ రూపంలో ఉన్నా, సందర్భంలో రాజు జవాబిచ్చిన తీరును తెలుపుతుంది. ‘కఠినంగా’ దాని తీవ్రతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: రాజైన రెహబాము
  rationale: ఈ సమానాధికార నిర్మాణం రాజును పేరుతో గుర్తిస్తుంది; తెలుగు వాక్యనిర్మాణంలో ‘రాజైన రెహబాము’ సహజంగా ఉంటుంది.
- source_word: וַיַּעֲזֹב
  choice: విడిచిపెట్టాడు
  rationale: עזב అనే పదానికి ‘వదలడం, విడిచిపెట్టడం, త్యజించడం’ అనే పరిధి ఉంది. ‘విడిచిపెట్టాడు’ ఉద్దేశపూర్వకంగా సలహాను అనుసరించకపోవడాన్ని సూచిస్తూ, ‘తిరస్కరించాడు’ అనే మరింత వ్యాఖ్యానాత్మక అర్థాన్ని నేరుగా రుద్దదు.
- source_word: עֲצַת הַזְּקֵנִים
  choice: పెద్దల సలహా
  rationale: עצה ఇక్కడ రాజుకు ఇచ్చిన సలహాను సూచిస్తుంది; זקנים కేవలం వృద్ధులను కాక, గుర్తింపు పొందిన పెద్దలను లేదా సలహాదారులను సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హెబ్రీ వాక్యంలోని రెండు సమాంతర క్రియలను అర్ధవిరామంతో కలిపి, అనవసరమైన వ్యాఖ్యానాన్ని నివారించాం.
