  yaml_path: translation/ot/2_chronicles/010/019.yaml
  text: So Israel has been in rebellion against the house of David to this day[a].
translation:
  language: te
  text: అలా ఇశ్రాయేలు ఈ రోజు వరకు దావీదు వంశానికి వ్యతిరేకంగా తిరుగుబాటులోనే ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలు ఈ రోజు వరకు దావీదు వంశానికి వ్యతిరేకంగా తిరుగుబాటు చేసింది.” హీబ్రూ క్రియను సాధారణ భూతకాల చర్యగా గానీ, కొనసాగుతున్న స్థితిని నొక్కిచెప్పే విధంగా గానీ అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשְׁעוּ
  choice: తిరుగుబాటులోనే ఉంది
  rationale: פשע అధికారానికి వ్యతిరేకంగా తిరుగుబాటు చేయడాన్ని సూచిస్తుంది. ‘ఈ రోజు వరకు’ అనే కాలవ్యాప్తితో కలిసి, ప్రారంభమైన తిరుగుబాటు కొనసాగుతున్న స్థితిని ఈ రూపం సహజంగా తెలియజేస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: ఇక్కడ ఇది దావీదు వంశానికి భిన్నంగా ఉన్న ఉత్తర గోత్రాల సమూహాన్ని సూచించే పేరు; ప్రధాన పాఠ్యంలో వివరణాత్మక విస్తరణ లేకుండా పేరుగానే ఉంచబడింది.
- source_word: בְּבֵית דָּוִיד
  choice: దావీదు వంశానికి వ్యతిరేకంగా
  rationale: פשע తో వచ్చిన ב తిరుగుబాటు ఎవరికి వ్యతిరేకమో సూచిస్తుంది. בית ఇక్కడ భవనాన్ని కాక దావీదు రాజవంశాన్ని సూచిస్తున్నందున ‘వంశం’ సహజమైన తెలుగు పదం.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ఈ రోజు వరకు
  rationale: రచయిత దృష్టికోణంలోని వర్తమాన కాలం వరకు పరిస్థితి కొనసాగిందని తెలిపే ప్రామాణిక కాలపదబంధం.
