translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన చారిత్రక వచనం. ‘దావీదు ఇల్లు’ అనే పదక్షర రూపం కంటే రాజవంశ భావాన్ని స్పష్టంగా తెలిపే ‘దావీదు వంశం’ వాడబడింది; హీబ్రూ క్రియలోని కాలార్థ అనిశ్చితి పాదసూచికలో నిలుపబడింది.
