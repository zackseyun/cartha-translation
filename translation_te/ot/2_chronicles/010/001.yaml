  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. వ్యక్తి మరియు స్థల నామాలకు సాధారణ తెలుగు బైబిలు రూపాలైన ‘రెహబాము’, ‘షెకెము’ వాడబడ్డాయి; విభక్తి సంధిలో ‘షెకెముకు’గా ఇచ్చాం.
