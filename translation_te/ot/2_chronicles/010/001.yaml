  text: Rehoboam went to Shechem, because all Israel had come to Shechem to make him king.
translation:
  language: te
  text: రెహబాము షెకెముకు వెళ్లాడు. ఎందుకంటే అతన్ని రాజుగా చేయడానికి ఇశ్రాయేలీయులందరూ షెకెముకు వచ్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరూ
  rationale: సమూహాన్ని సూచించే ‘ఇశ్రాయేలు అంతా’ అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לְהַמְלִיךְ אֹתוֹ
  choice: అతన్ని రాజుగా చేయడానికి
  rationale: హిఫీల్ క్రియలోని ‘ఒకరిని రాజుగా నియమించడం/చేయడం’ అనే కారణార్థక భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: రెహబాము షెకెముకు వెళ్లడానికి తరువాతి వాక్యం కారణాన్ని తెలియజేస్తున్నందున కారణార్థక అనుసంధానాన్ని స్పష్టంగా ఉంచుతుంది.
