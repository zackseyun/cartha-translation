    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘సేవ’ అంటే రాజపాలన కింద విధించబడిన శ్రమ లేదా బాధ్యత; ‘కఠినమైన శ్రమ’ అని కూడా అనువదించవచ్చు.
