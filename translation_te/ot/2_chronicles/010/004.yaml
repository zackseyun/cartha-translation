revisions:
- from: నీ తండ్రి మా కాడిని దుర్భరం చేశాడు[a]. ఇప్పుడు నీ తండ్రి మాపై మోపిన కఠినమైన చాకిరీని[b], అతని భారమైన కాడిని తేలిక చేయి; అప్పుడు మేము నిన్ను సేవిస్తాం.
  to: నీ తండ్రి మా కాడిని కఠినంగా చేశాడు[a]. ఇప్పుడు నీ తండ్రి కఠినమైన సేవను, మాపై మోపిన అతని భారమైన కాడిని తేలిక చేయి; అప్పుడు మేము నిన్ను సేవిస్తాం.
  rationale: The revision renders the initial causative as “కఠినంగా చేశాడు,” keeps “భారమైన” for the distinct later adjective כָּבֵד, moves “మాపై మోపిన” to unambiguously qualify the heavy yoke, and uses neutral modern Telugu for imposed royal service. Footnote b is retained as a cultural clarification, though its anchor remains after the first sentence as supplied in the draft.
