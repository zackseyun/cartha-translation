translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘కాడి’ అనే స్పష్టమైన మూల రూపకం రెండు చోట్లా నిలుపబడింది. ‘చాకిరీ’ని సామాన్య ఉద్యోగం అనే భావంలో కాక, పాలకుడు విధించిన శ్రమ లేదా బాధ్యత అనే సందర్భార్థంలో వాడి, పాదసూచికలో వివరించబడింది.
