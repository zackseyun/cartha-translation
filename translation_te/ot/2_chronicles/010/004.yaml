review_pass:
  verdict: revise
  source_fidelity: The draft retains the repeated yoke metaphor and the burden-relief request. However, “దుర్భరం చేశాడు” can imply that the yoke was made unbearable, a stronger claim than the causative “made hard/harsh” in הִקְשָׁה. Also, the Telugu placement of “మాపై మోపిన” most naturally modifies the hard service, whereas the Hebrew relative clause is singular and most directly modifies the heavy yoke.
  naturalness: The revised wording is natural modern standard Telugu, preserves the parallelism of service and yoke, and makes the scope of “laid on us” clear.
  terminology: “కాడి” consistently preserves עֹל. “కఠినమైన సేవ” is suitably broad for imposed royal labor/obligation without the potentially more socially loaded connotations of “చాకిరీ.” “సేవిస్తాం” appropriately renders the pledged service to the king.
  issues:
  - severity: medium
    issue: “దుర్భరం చేశాడు” overstates הִקְשָׁה.
    rationale: “దుర్భరం” commonly conveys unbearable or exceedingly burdensome, while the Hebrew says that Solomon made the yoke hard/harsh. “కఠినంగా చేశాడు” more closely retains the causative wording without intensifying it.
  - severity: medium
    issue: The relative phrase “మాపై మోపిన” has unclear attachment in the draft.
    rationale: In Hebrew, אֲשֶׁר נָתַן עָלֵינוּ is singular and directly follows “his heavy yoke,” so the Telugu should place the phrase with “భారమైన కాడిని.”
  - severity: low
    issue: “చాకిరీ” is less suitable for the intended broad royal-obligation sense.
    rationale: Although it can convey forced service, it may carry overly colloquial or socially marked associations. “కఠినమైన సేవ” is more neutral and is explained by the footnote.
  revised_text: నీ తండ్రి మా కాడిని కఠినంగా చేశాడు[a]. ఇప్పుడు నీ తండ్రి కఠినమైన సేవను, మాపై మోపిన అతని భారమైన కాడిని తేలిక చేయి; అప్పుడు మేము నిన్ను సేవిస్తాం.
