id: 2CH.10.4
reference: 2 Chronicles 10:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָבִ֖י/ךָ הִקְשָׁ֣ה אֶת עֻלֵּ֑/נוּ וְ/עַתָּ֡ה הָקֵל֩ מֵ/עֲבֹדַ֨ת אָבִ֜י/ךָ הַ/קָּשָׁ֗ה וּ/מֵ/עֻלּ֧/וֹ הַ/כָּבֵ֛ד אֲשֶׁר נָתַ֥ן עָלֵ֖י/נוּ וְ/נַֽעַבְדֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/004.yaml
  text: Your father made our yoke heavy[a]. So now lighten the hard service of your father and his heavy yoke that he put on us[b], and we will serve you.
translation:
  language: te
  text: నీ తండ్రి మా కాడిని కఠినంగా చేశాడు[a]. ఇప్పుడు నీ తండ్రి కఠినమైన సేవను, మాపై మోపిన అతని భారమైన కాడిని తేలిక చేయి; అప్పుడు మేము నిన్ను సేవిస్తాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మా కాడిని దుర్భరం చేశాడు’ లేదా ‘మా కాడిని భారంగా చేశాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשָׁה אֶת עֻלֵּנוּ
  choice: మా కాడిని దుర్భరం చేశాడు
  rationale: హిఫిల్ క్రియలోని కారణార్థాన్ని ‘చేశాడు’ నిలుపుతుంది. ‘దుర్భరం’ అనేది కాడి కింద జీవితం కఠినంగా, భరించలేనంత భారంగా మారిందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘కాడి’ మూలంలోని రూపకాన్ని కాపాడుతుంది.
- source_word: עֻלֵּנוּ / עֻלּוֹ הַכָּבֵד
  choice: మా కాడి / అతని భారమైన కాడి
  rationale: עֹל యొక్క ప్రత్యక్ష అర్థమైన ‘కాడి’నే ఉంచి, రాజపాలన విధించిన భారాన్ని సూచించే రూపకాన్ని రెండు చోట్లా ఏకరీతిగా నిలిపింది. כָּבֵד ను ‘భారమైన’గా అనువదించింది.
- source_word: הָקֵל
  choice: తేలిక చేయి
  rationale: భారాన్ని తగ్గించమనే ఆజ్ఞను తెలియజేస్తూ, కాడి రూపకానికి సంబంధించిన ‘భారం–తేలిక’ చిత్రణను నిలుపుతుంది.
- source_word: מֵעֲבֹדַת אָבִיךָ הַקָּשָׁה
  choice: నీ తండ్రి ... కఠినమైన చాకిరీని
  rationale: עֲבֹדָה ఇక్కడ రాజు కింద విధించబడిన పని లేదా సేవను సూచిస్తుంది. ‘చాకిరీ’ ఆ నిర్బంధ బాధ్యత భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; הַקָּשָׁה ను ‘కఠినమైన’గా ప్రతిబింబిస్తుంది.
- source_word: אֲשֶׁר נָתַן עָלֵינוּ
  choice: మాపై మోపిన
  rationale: నాతన్ అల్ అనే నిర్మాణంలోని ‘మీద ఉంచడం’ భావాన్ని, భారాన్ని విధించే సందర్భానికి సహజమైన తెలుగు ప్రయోగంతో వ్యక్తం చేస్తుంది.
- source_word: וְנַעַבְדֶךָ
  choice: అప్పుడు మేము నిన్ను సేవిస్తాం
  rationale: రాజు భారాన్ని తగ్గిస్తే తాము అతనికి లోబడి సేవ చేస్తామనే ప్రజల ప్రతిస్పందనను ‘అప్పుడు’ ద్వారా సహజంగా స్పష్టం చేస్తుంది; షరతును అతిగా విస్తరించదు.
