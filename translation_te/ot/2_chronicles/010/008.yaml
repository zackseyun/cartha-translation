source:
  edition: WLC
  text: וַֽ/יַּעֲזֹ֛ב אֶת עֲצַ֥ת הַ/זְּקֵנִ֖ים אֲשֶׁ֣ר יְעָצֻ֑/הוּ וַ/יִּוָּעַ֗ץ אֶת הַ/יְלָדִים֙ אֲשֶׁ֣ר גָּדְל֣וּ אִתּ֔/וֹ הָ/עֹמְדִ֖ים לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/008.yaml
  text: But he abandoned the advice of the elders that they had given him[a], and consulted with the young men who had grown up with him, who stood before him.
translation:
  language: te
  text: అయితే అతడు పెద్దలు తనకు ఇచ్చిన సలహాను వదిలిపెట్టి, తనతోపాటు పెరిగి తన ఎదుట నిలిచే[a] యువకులతో సంప్రదించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతనికి పరిచర్య చేసే” లేదా “అతనికి సేవ చేసే.” “తన ఎదుట నిలిచే” అనేది ఆస్థాన సేవను సూచించే ప్రయోగం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: తిరస్కరించి
  rationale: עָזַב అంటే విడిచిపెట్టడం లేదా వదలడం; ఇక్కడ రెహబాము ఆ సలహాను పక్కన పెట్టి వేరొక వర్గాన్ని సంప్రదించినందున ‘తిరస్కరించి’ సందర్భబలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עֲצַת
  choice: సలహాను
  rationale: עֵצָה సూచించే ఉపదేశం లేదా ఆలోచనను ఆధునిక సాధారణ తెలుగులో ‘సలహా’ స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: הַזְּקֵנִים
  choice: పెద్దలు
  rationale: ఈ పదం వయోవృద్ధులనే కాక రాజుకు సలహా ఇచ్చే సీనియర్ వ్యక్తులను సూచిస్తుంది; ‘పెద్దలు’ రెండు భావాలనూ నిలుపుతుంది.
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: తనకు ఇచ్చిన
  rationale: ‘సలహాను’ అనే నామవాచకంతో కలిపి ‘తనకు ఇచ్చిన’ అనడం హెబ్రీ భావాన్ని పునరుక్తి లేకుండా సహజ తెలుగులో అందిస్తుంది.
- source_word: וַיִּוָּעַץ
  choice: సంప్రదించాడు
  rationale: నిఫాల్ రూపం పరస్పరంగా ఆలోచన కోరడం లేదా సంప్రదింపులోకి వెళ్లడాన్ని సూచిస్తుంది; ‘సంప్రదించాడు’ సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: הַיְלָדִים
  choice: యువకులతో
  rationale: పదం పిల్లలను కూడా సూచించగలిగినా, సందర్భంలో రాజుతో పెరిగి ఆస్థానంలో ఉన్న అతని సమవయస్కులు ఉద్దేశించబడ్డారు; కాబట్టి ‘యువకులు’ అపార్థాన్ని నివారిస్తుంది.
- source_word: גָּדְלוּ אִתּוֹ
  choice: తనతోపాటు పెరిగి
  rationale: వారు అతనితో కలిసి పెరిగారనే భాగస్వామ్య బాల్యాన్ని ఈ ప్రయోగం సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הָעֹמְדִים לְפָנָיו
  choice: తన ఎదుట నిలిచే
  rationale: హెబ్రీలోని ‘అతని ఎదుట నిలిచేవారు’ అనే దృశ్యరూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, దాని ఆస్థాన సేవార్థాన్ని పాదసూచికలో తెలియజేస్తుంది.
