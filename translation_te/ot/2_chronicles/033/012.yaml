id: 2CH.33.12
reference: 2 Chronicles 33:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/כְ/הָצֵ֣ר ל֔/וֹ חִלָּ֕ה אֶת פְּנֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו וַ/יִּכָּנַ֣ע מְאֹ֔ד מִ/לִּ/פְנֵ֖י אֱלֹהֵ֥י אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/012.yaml
  text: And when he was in distress[b][a], he sought the favor of Yahweh his God and humbled himself greatly before the God of his fathers.
translation:
  language: te
  text: అతడు కష్టంలో ఉన్నప్పుడు, తన దేవుడైన యాహ్వే అనుగ్రహాన్ని వేడుకొని[a], తన పితరుల దేవుని సన్నిధిలో తనను తాను ఎంతో తగ్గించుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన దేవుడైన యాహ్వేను బతిమాలుకున్నాడు.” హెబ్రీ ఇడియమ్ అక్షరార్థంగా ‘ముఖాన్ని ప్రసన్నం చేశాడు’ అనే భావాన్ని కలిగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְהָצֵר לוֹ
  choice: అతడు కష్టంలో ఉన్నప్పుడు
  rationale: ఈ నిర్మాణం కాలసంబంధ పరిస్థితిని సూచిస్తూ, అతడు బాధాకరమైన ఇబ్బందిలో ఉన్నాడనే భావాన్ని ఇస్తుంది. ‘కష్టంలో’ అనేది సహజమైన ఆధునిక తెలుగు.
- source_word: חִלָּה אֶת־פְּנֵי
  choice: అనుగ్రహాన్ని వేడుకొని
  rationale: ఈ హెబ్రీయ ఇడియమ్ ఒకరి ముఖాన్ని ప్రసన్నం చేయమని వేడుకోవడం, అంటే వారి అనుగ్రహాన్ని కోరడం అనే భావం కలిగిస్తుంది. ఈ అనువాదం ప్రార్థనాత్మక విన్నపాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: మూలంలో ఉన్న దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించింది.
- source_word: אֱלֹהָיו
  choice: తన దేవుడైన
  rationale: ప్రత్యయములోని స్వామ్య భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וַיִּכָּנַע
  choice: తనను తాను తగ్గించుకున్నాడు
  rationale: నిఫాల్ రూపం ఈ సందర్భంలో మనష్షే స్వయంగా వినయపడిన ప్రతిస్పందనను సూచిస్తుంది; తెలుగు వాడుకలో ‘తగ్గించుకున్నాడు’ ఆ భావాన్ని సహజంగా ఇస్తుంది.
- source_word: מְאֹד
  choice: ఎంతో
  rationale: క్రియలోని తీవ్రతను సహజమైన తెలుగు తీవ్రతాసూచక పదంతో నిలుపుతుంది.
- source_word: מִלִּפְנֵי
  choice: సన్నిధిలో
  rationale: అక్షరార్థంగా ‘ముఖం ఎదుట’ అయినా, ఇక్కడ ‘సన్నిధిలో’ అనేది స్పష్టమైన, గౌరవప్రదమైన తెలుగు ప్రయోగం.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: తన పితరుల దేవుని
  rationale: మూలంలోని పురుషలింగ పూర్వికుల సూచనను, దాని నిబంధన-చారిత్రక ప్రతిధ్వనితో సహా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: వచనంలో వ్యక్తిగత దైవనామమే నేరుగా ఉంది; కాబట్టి దానిని బిరుదుతో మార్చకుండా ‘యాహ్వే’గా అందించింది.
- issue: אֱלֹהֵי אֲבֹתָיו లోని లింగసూచక పూర్విక భాష
  choice: తన పితరుల దేవుడు
  alternative: తన పూర్వికుల దేవుడు
  rationale: హెబ్రీ పాఠంలోని ‘తన పితరులు’ అనే పురుషలింగ రూపాన్ని ప్రధాన పాఠంలో నిలుపుతూ, దాని నిబంధన-చారిత్రక భావాన్ని కాపాడింది.
- issue: וַיִּכָּנַע యొక్క కర్తృత్వ ఛాయ
  choice: తనను తాను తగ్గించుకున్నాడు
  alternative: అతడు తగ్గించబడ్డాడు
  rationale: నిఫాల్ రూపానికి వ్యాకరణపరంగా కర్మణి ఛాయ సాధ్యమైనా, ఈ పశ్చాత్తాప సందర్భంలో స్వప్రేరిత వినయాన్ని సూచించే ప్రతిబింబార్థక తెలుగు సహజంగా సరిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడింది. ‘యాహ్వే’ అనే వ్యక్తిగత నామం, ‘పితరులు’ అనే మూలంలోని లింగసూచక పదం నిలుపబడ్డాయి. ప్రధాన వాక్యం సరళంగా ఉండేలా హెబ్రీ ఇడియమ్‌కు వివరణను పాదటిప్పణిలో ఇచ్చింది.
