revisions:
- from: అయితే[a] ప్రజలు ఇంకా ఉన్నత స్థలాల్లో బలులు అర్పిస్తూ ఉన్నారు; కానీ తమ దేవుడైన యెహోవాకు మాత్రమే అర్పించారు.
  to: అయినప్పటికీ, ప్రజలు ఇంకా ఉన్నత స్థలాల్లో బలులు అర్పించేవారు; అయితే తమ దేవుడైన యెహోవాకే అర్పించేవారు.
  rationale: The revision preserves the concessive force of אֲבָל, the continuing/habitual force conveyed by עוֹד with the participle זֹבְחִים, and the restriction of רַק to Yahweh as the recipient of sacrifice. It also removes the internal aspectual inconsistency in the draft.
