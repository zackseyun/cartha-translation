id: 2CH.33.17
reference: 2 Chronicles 33:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֲבָל֙ ע֣וֹד הָ/עָ֔ם זֹבְחִ֖ים בַּ/בָּמ֑וֹת רַ֖ק לַ/יהוָ֥ה אֱלֹהֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/017.yaml
  text: Nevertheless[a], the people still sacrificed at the high places, but only to Yahweh their God.
translation:
  language: te
  text: అయినప్పటికీ, ప్రజలు ఇంకా ఉన్నత స్థలాల్లో బలులు అర్పించేవారు; అయితే తమ దేవుడైన యెహోవాకే అర్పించేవారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבָל
  choice: అయితే
  rationale: మునుపటి సంస్కరణలకు విరుద్ధంగా కొనసాగిన పరిస్థితిని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: עוֹד
  choice: ఇంకా
  rationale: ఆ ఆచారం అప్పటికీ కొనసాగుతూనే ఉందనే భావాన్ని తెలియజేస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: సమూహంగా దేశ ప్రజలను సూచించే సహజమైన కథన ప్రయోగం.
- source_word: זֹבְחִים
  choice: బలులు అర్పిస్తూ ఉన్నారు
  rationale: హీబ్రూ కృదంత రూపంలోని కొనసాగుతున్న క్రియాభావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בַּבָּמוֹת
  choice: ఉన్నత స్థలాల్లో
  rationale: స్థానిక ఆరాధనా ప్రదేశాలను సూచించే בָּמוֹת పదానికి స్థిరమైన, అర్థవంతమైన తెలుగు సమానం.
- source_word: רַק
  choice: కానీ ... మాత్రమే
  rationale: బలులు అర్పించిన స్థలాన్ని కాకుండా అవి ఎవరికి అర్పించబడ్డాయో పరిమితం చేసే భావాన్ని నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామాన్ని పేరుగా ఉంచి, ל ఉపసర్గ సూచించే గ్రహీతను తెలుగు చతుర్థీ విభక్తితో వ్యక్తపరుస్తుంది.
- source_word: אֱלֹהֵיהֶם
  choice: తమ దేవుడైన
  rationale: కర్త అయిన ప్రజలతో గల సంబంధాన్ని సహజమైన ప్రతిబింబ సర్వనామంతో తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ప్రత్యక్షంగా ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపంలో ఉంచుతుంది.
- issue: ఉన్నత స్థలాల్లో ఆరాధన గురించిన వాక్యభావం
  choice: ప్రజలు ఉన్నత స్థలాల్లో బలులు అర్పించడం కొనసాగించారు; అయితే అవి తమ దేవుడైన యెహోవాకు మాత్రమే అర్పించారు.
  alternative: యెహోవాకు అంకితమైన ఉన్నత స్థలాల్లో మాత్రమే ప్రజలు బలులు అర్పించారు.
  rationale: హీబ్రూ వాక్యనిర్మాణంలో רַק לַיהוָה అనే పరిమితి బలుల గ్రహీతకు వర్తిస్తుంది, స్థలానికి కాదు. అందువల్ల విదేశీ దేవతలకు అర్పించకపోయినా ఉన్నత స్థలాల వాడకం కొనసాగిందనే ఉద్రిక్తత నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. కొనసాగుతున్న ఆచారాన్ని చూపడానికి ‘అర్పిస్తూ ఉన్నారు’ వాడబడింది; ‘కానీ ... మాత్రమే’ ద్వారా మూలంలోని పరిమితి మరియు సంస్కరణ అసంపూర్ణత రెండూ నిలుపబడ్డాయి.
