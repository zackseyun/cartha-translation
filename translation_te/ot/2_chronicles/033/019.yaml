  text: וּ/תְפִלָּת֣/וֹ וְ/הֵֽעָתֶר ל/וֹ֮ וְ/כָל חַטָּאת֣/וֹ וּ/מַעְל/וֹ֒ וְ/הַ/מְּקֹמ֗וֹת אֲשֶׁר֩ בָּנָ֨ה בָ/הֶ֤ם בָּמוֹת֙ וְ/הֶעֱמִיד֙ הָ/אֲשֵׁרִ֣ים וְ/הַ/פְּסִלִ֔ים לִ/פְנֵ֖י הִכָּנְע֑/וֹ הִנָּ֣/ם כְּתוּבִ֔ים עַ֖ל דִּבְרֵ֥י חוֹזָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/019.yaml
  text: And his prayer[a], and how he was entreated, and all his sin and his unfaithfulness, and the places where he built high places and set up the Asherim and the carved images before he humbled himself—behold[b], they are written in the records of the seers.
translation:
  language: te
  text: అతని ప్రార్థన, అతని విన్నపం అనుకూలంగా ఆలకించబడిన విధానం, అతని పాపమంతా, అతని విశ్వాసభంగం, అలాగే అతడు తనను తాను తగ్గించుకోకముందు ఉన్నత పూజాస్థలాలను కట్టి, అషేరీం[a]ను, చెక్కిన విగ్రహాలను నిలబెట్టిన ప్రదేశాలు—ఇదిగో, ఇవన్నీ దర్శకుల వృత్తాంతాల్లో[b] రాయబడి ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అషేరా స్తంభాలు” అని కూడా అనువదించవచ్చు. హీబ్రూ పదం అషేరాతో సంబంధమున్న ఆరాధనా వస్తువులను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “హోజై వృత్తాంతంలో.” చివరి హీబ్రూ పదబంధం ‘దర్శకులు’ అని కాకుండా హోజై అనే వ్యక్తి పేరును సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: תְפִלָּתוֹ
  choice: అతని ప్రార్థన
  rationale: תְּפִלָּהకు సహజమైన, విస్తృతార్థాన్ని నిలిపే ప్రామాణిక తెలుగు పదం.
- source_word: הֵעָתֶר לוֹ
  choice: అతని విన్నపం ఆలకించబడిన విధానం
  rationale: ప్రార్థనకు అనుకూల స్పందన లభించిందనే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; హీబ్రూ ఈ ఉపవాక్యంలో స్పష్టంగా చెప్పని కర్తగా దేవుణ్ణి నేరుగా చేర్చదు.
- source_word: כָל חַטָּאתוֹ
  choice: అతని పాపమంతా
  rationale: హీబ్రూ ఏకవచనంలోని సమష్టి భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: מַעְלוֹ
  choice: అతని విశ్వాసఘాతుకత్వం
  rationale: מעלలోని విశ్వాసభంగం, మతనైతిక ద్రోహం అనే బలమైన భావాన్ని కేవలం ‘అపరాధం’ కంటే స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בָּמוֹת
  choice: ఉన్నత పూజాస్థలాలు
  rationale: ‘ఉన్నత స్థలాలు’ అనే అక్షరార్థానికి వాటి ఆరాధనా స్వభావాన్ని జోడించి, ఆధునిక పాఠకునికి అర్థమయ్యేలా చేస్తుంది.
- source_word: הָאֲשֵׁרִים
  choice: అషేరీం
  rationale: వాటి ఖచ్చితమైన భౌతిక రూపాన్ని నిర్ణయించకుండా, అషేరాతో సంబంధమున్న ఆరాధనా వస్తువులను సూచించే హీబ్రూ బహువచన పదాన్ని లిప్యంతరీకరిస్తుంది; వివరణను పాదసూచికలో ఇస్తుంది.
- source_word: הַפְּסִלִים
  choice: చెక్కిన విగ్రహాలు
  rationale: פסילים యొక్క శిల్పిత రూపాన్నీ ఆరాధనా వస్తువుల స్వభావాన్నీ రెండింటినీ తెలియజేస్తుంది.
- source_word: לִפְנֵי הִכָּנְעוֹ
  choice: తనను తాను తగ్గించుకోకముందు
  rationale: కాలసంబంధమైన ‘ముందు’ భావంతో పాటు హీబ్రూ రూపంలోని ఆత్మనిగ్రహ/తన్నుతాను తగ్గించుకునే భావాన్ని నిలుపుతుంది.
- source_word: הִנָּם
  choice: ఇదిగో, ఇవన్నీ
  rationale: హీబ్రూ సూచనాత్మక-ప్రదర్శక పదం ఇచ్చే సాహిత్య ఉద్ఘాటనను సహజమైన గౌరవప్రద తెలుగులో నిలుపుతుంది.
- source_word: כְּתוּבִים
  choice: రాయబడి ఉన్నాయి
  rationale: ‘వ్రాయబడినవి’ అనే ప్రాథమిక అర్థాన్ని నేరుగా నిలుపుతూ, సందర్భంలో లిఖిత వృత్తాంతాన్ని సూచిస్తుంది.
- source_word: דִּבְרֵי חוֹזָי
  choice: దర్శకుల వృత్తాంతాల్లో
  rationale: חוֹזָיను దర్శకులను సూచించే రూపంగా గ్రహించి, דִּבְרֵיను సందర్భానుసారంగా ‘వృత్తాంతాలు’ అని అనువదిస్తుంది; వ్యక్తినామ పఠనాన్ని పాదసూచికలో భద్రపరుస్తుంది.
theological_decisions:
- issue: הִכָּנְעוֹలో మనష్షే తగ్గించుకొనడం యొక్క స్వభావం
  choice: తనను తాను తగ్గించుకోకముందు
  alternative: అతడు తగ్గించబడకముందు
  rationale: హీబ్రూ రూపం సహజంగా ఆత్మనిగ్రహాత్మక/అకర్మక భావాన్ని అనుమతిస్తుంది. ఇది పశ్చాత్తాపాన్ని సూచించినా, వాక్యం చెప్పినదానికంటే విస్తృతమైన మార్పిడి సిద్ధాంతాన్ని చేర్చదు.
- issue: ప్రార్థనకు స్పందించిన కర్త
  choice: అతని విన్నపం ఆలకించబడిన విధానం
  alternative: దేవుడు అతనికి జవాబిచ్చిన విధానం
  rationale: సందర్భంలో దేవుడే స్పందించినవాడని స్పష్టమైనప్పటికీ, ఈ ఉపవాక్యంలో హీబ్రూ కర్తను పేరుపెట్టి చెప్పదు; కాబట్టి తెలుగు అనువాదం ఆ సంక్షిప్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘అషేరీం’ అనే అపరిచిత పదాన్ని అతిగా నిర్దిష్టీకరించకుండా ఉంచి పాదసూచికలో వివరించాం. దీర్ఘమైన హీబ్రూ జాబితా నిర్మాణాన్ని డ్యాష్‌తో విభజించి చదవడానికి సులభం చేశాం; ‘ఇదిగో’ ద్వారా మూలంలోని ఉద్ఘాటన నిలిచింది.
