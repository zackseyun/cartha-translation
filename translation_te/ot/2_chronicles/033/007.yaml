id: 2CH.33.7
reference: 2 Chronicles 33:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֕שֶׂם אֶת פֶּ֥סֶל הַ/סֶּ֖מֶל אֲשֶׁ֣ר עָשָׂ֑ה בְּ/בֵ֣ית הָ/אֱלֹהִ֗ים אֲשֶׁ֨ר אָמַ֤ר אֱלֹהִים֙ אֶל דָּוִיד֙ וְ/אֶל שְׁלֹמֹ֣ה בְנ֔/וֹ בַּ/בַּ֨יִת הַ/זֶּ֜ה וּ/בִֽ/ירוּשָׁלִַ֗ם אֲשֶׁ֤ר בָּחַ֨רְתִּי֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אָשִׂ֥ים אֶת שְׁמִ֖/י לְ/עֵילֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/007.yaml
  text: He put the carved image[a], the idol that he had made, in the house of God, of which God had said to David and to Solomon his son, “In this house and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name forever.”
translation:
  language: te
  text: 'అతడు తాను చేసిన చెక్కిన ప్రతిమను, ఆ విగ్రహాన్ని[a], దేవుని మందిరంలో ఉంచాడు. ఆ మందిరం గురించి దేవుడు దావీదుతో, అతని కుమారుడైన సొలొమోనుతో ఇలా చెప్పాడు: “ఈ మందిరంలోను, ఇశ్రాయేలు గోత్రాలన్నిటిలోనుండి నేను ఎంచుకున్న యెరూషలేములోను నా నామాన్ని శాశ్వతంగా ఉంచుతాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విగ్రహానికి చెందిన చెక్కిన ప్రతిమను”; హీబ్రూ మూలంలో విగ్రహ ప్రతిమను సూచించే దగ్గరి అర్థాలుగల రెండు పదాలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: ఉంచాడు
  rationale: సాధారణ కథనశైలిలో שׂים అనే క్రియకు సహజమైన ఆధునిక తెలుగు రూపం; ‘నిలిపాడు’ కంటే విస్తృతమైన అర్థాన్ని నిలుపుతుంది.
- source_word: פֶּסֶל הַסֶּמֶל
  choice: చెక్కిన ప్రతిమను, ఆ విగ్రహాన్ని
  rationale: సమీపార్థకమైన రెండు హీబ్రూ నామవాచకాలను ఒకే పదంగా కుదించకుండా, విగ్రహారాధనకు సంబంధించిన ప్రతిమ అనే భావాన్ని అన్వయ సంబంధంతో నిలిపింది.
- source_word: אֲשֶׁר עָשָׂה
  choice: తాను చేయించిన
  rationale: మునుపటి వచన సందర్భంలో మనష్షే విగ్రహాన్ని ఏర్పరచిన బాధ్యతను సహజ తెలుగులో తెలియజేస్తుంది; హీబ్రూ సాధారణంగా ‘చేసిన’ అని ఉన్నప్పటికీ రాజు స్వయంగా చెక్కాడనే అనవసర సూచనను నివారిస్తుంది.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: దేవుని మందిరంలో
  rationale: בית అనే పదానికి అక్షరార్థంగా ‘ఇల్లు’ సాధ్యమైనా, ఇక్కడ దేవాలయ భవనాన్ని సూచిస్తున్నందున ఆధునిక తెలుగులో ‘మందిరం’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: אֲשֶׁר אָמַר אֱלֹהִים
  choice: ఆ మందిరం గురించి దేవుడు ... ఇలా చెప్పాడు
  rationale: సంబంధవాచక నిర్మాణంలోని సూచన దేవుని మందిరానికేనని స్పష్టంగా ఉంచుతూ తెలుగు వాక్యప్రవాహాన్ని సహజం చేస్తుంది.
- source_word: אֶל דָּוִיד וְאֶל שְׁלֹמֹה בְנוֹ
  choice: దావీదుతో, అతని కుమారుడైన సొలొమోనుతో
  rationale: ఇద్దరితోనూ చెప్పినట్లు పునరుక్త విభక్తి భావాన్ని, సొలొమోను దావీదు కుమారుడనే గుర్తింపును నిలుపుతుంది.
- source_word: בַּבַּיִת הַזֶּה וּבִירוּשָׁלַם
  choice: యెరూషలేములో, ఈ మందిరంలో
  rationale: రెండు స్థల సూచనలూ నిలిచాయి. తరువాతి సంబంధవాక్యం యెరూషలేమును విశేషిస్తున్న హీబ్రూ నిర్మాణం తెలుగులో స్పష్టంగా వినిపించేందుకు పదక్రమాన్ని మార్చింది.
- source_word: אֲשֶׁר בָּחַרְתִּי מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాలన్నిటిలోనుండి నేను ఎంచుకున్న
  rationale: מן యొక్క ఎంపిక/విభజన భావాన్ని ‘లోనుండి’ సహజంగా తెలియజేస్తుంది; దేవుని ఎంపికను వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: אָשִׂים אֶת שְׁמִי
  choice: నా నామాన్ని ... ఉంచుతాను
  rationale: దేవుడు తన నామాన్ని ఉంచుతాననే నిబంధనాత్మక రూపకాన్ని ‘నివసింపజేస్తాను’ వంటి వివరణాత్మక విస్తరణ లేకుండా కాపాడుతుంది.
- source_word: לְעֵילֹום
  choice: శాశ్వతంగా
  rationale: לעולם కు ఈ నిబంధనాత్మక ప్రకటనలో గౌరవప్రదమైన, సహజమైన ఆధునిక తెలుగు సమానం.
theological_decisions:
- issue: దైవ నామం/బిరుదు
  choice: దేవుడు
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో אֱלֹהִים ఉంది, יהוה లేదు; అందువల్ల నిబంధన నామాన్ని దిగుమతి చేయకుండా ‘దేవుడు’ అని అనువదించబడింది.
- issue: దేవాలయ దైవనామ సిద్ధాంత రూపకం
  choice: నా నామాన్ని శాశ్వతంగా ఉంచుతాను
  alternative: నా నామం శాశ్వతంగా నివసించేలా చేస్తాను
  rationale: దేవుడు తన నామాన్ని ఉంచడం అనే హీబ్రూ రూపకాన్ని సిద్ధాంతపరమైన వివరణతో పరిష్కరించకుండా యథాతథ భావంలో నిలిపింది.
- issue: ఎంచుకున్నది నగరమా లేక మందిరం-నగరం జంటనా
  choice: ఎంచుకున్న అనే సంబంధవాక్యాన్ని యెరూషలేముతో అనుసంధానించడం
  alternative: ఈ మందిరాన్ని, యెరూషలేమును నేను ఎంచుకున్నాను
  rationale: హీబ్రూలో אֲשֶׁר బִּירוּשָׁלִַם తరువాత వచ్చి వ్యాకరణపరంగా యెరూషలేమును సమీపంగా విశేషిస్తుంది; మందిరం మరియు నగరం రెండింటిలో నామాన్ని ఉంచే ప్రకటన మాత్రం పూర్తిగా నిలిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘దేవుని మందిరం,’ ‘నామం,’ ‘శాశ్వతంగా’ వంటి పదాలు బైబిలు సందర్భానికి తగిన గంభీరతను ఉంచుతాయి; హీబ్రూ వాక్యనిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా దాని భావ సంబంధాలు కాపాడబడ్డాయి.
