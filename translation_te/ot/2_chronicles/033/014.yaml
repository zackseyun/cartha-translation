source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵ֡ן בָּנָ֣ה חוֹמָ֣ה חִֽיצוֹנָ֣ה לְ/עִיר דָּוִ֡יד מַעְרָבָ/ה֩ לְ/גִיח֨וֹן בַּ/נַּ֜חַל וְ/לָ/ב֨וֹא בְ/שַׁ֤עַר הַ/דָּגִים֙ וְ/סָבַ֣ב לָ/עֹ֔פֶל וַ/יַּגְבִּיהֶ֖/הָ מְאֹ֑ד וַ/יָּ֧שֶׂם שָֽׂרֵי חַ֛יִל בְּ/כָל הֶ/עָרִ֥ים הַ/בְּצֻר֖וֹת בִּ/יהוּדָֽה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/014.yaml
  text: After this he built an outer wall for the city of David[a], west of Gihon in the valley, as far as the entrance of the Fish Gate; it went around Ophel, and he made it very high[c][b]. He also placed military commanders in all the fortified cities in Judah.
translation:
  language: te
  text: దీని తరువాత అతడు దావీదు పట్టణానికి వెలుపలి ప్రాకారాన్ని కట్టాడు. అది లోయలోని గీహోనుకు పడమరగా, చేపల ద్వారం ప్రవేశం వరకు[a] సాగింది. అతడు ఓఫెల్‌ను[b] చుట్టుముట్టి[c], ఆ ప్రాకారాన్ని చాలా ఎత్తుగా చేశాడు. యూదాలోని ప్రాకార పట్టణాలన్నిటిలో సైన్యాధిపతులను నియమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చేపల ద్వారం ప్రవేశం వైపుగా.” హీబ్రూ పదబంధం ఆ ద్వారం దిశగా ప్రాకారం విస్తరించిందని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ఓఫెల్” యెరూషలేములోని ఒక స్థలనామం; బహుశా దేవాలయ కొండకు దక్షిణంగా ఉన్న ఎత్తైన ప్రాంతం.
    reason: cultural_note
  - marker: c
    text: లేదా, “ప్రాకారం ఓఫెల్ చుట్టూ సాగింది.” హీబ్రూ క్రియకు “చుట్టూ వెళ్లు,” “చుట్టుముట్టు” అనే భావాలు ఉన్నాయి; వ్యాకరణపరంగా కర్త రాజే అయినప్పటికీ, సందర్భంలో ప్రాకారం సాగిన విధానం ఉద్దేశింపబడి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: దీని తరువాత
  rationale: కథనంలోని కాలక్రమాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: בָּנָה
  choice: కట్టాడు
  rationale: మూల క్రియ యొక్క సాధారణ అర్థం ‘కట్టు’; సందర్భం పునర్నిర్మాణాన్ని సూచించే అవకాశం ఉన్నా, మూలపదం దానిని నిర్బంధించదు.
- source_word: חוֹמָה חִיצוֹנָה
  choice: వెలుపలి ప్రాకారం
  rationale: పట్టణ రక్షణ గోడ అనే భావాన్ని ‘ప్రాకారం’ స్పష్టంగా ఇస్తుంది; חִיצוֹנָה తెలిపే బాహ్య స్థానాన్ని ‘వెలుపలి’ నిలుపుతుంది.
- source_word: לְעִיר דָּוִיד
  choice: దావీదు పట్టణానికి
  rationale: לְ ఉపసర్గ ఇక్కడ ప్రాకారం ఏ పట్టణం కోసం కట్టబడిందో సూచిస్తుంది.
- source_word: מַעְרָבָה לְגִיחוֹן בַּנַּחַל
  choice: లోయలోని గీహోనుకు పడమరగా
  rationale: దిశ, స్థలనామం, భౌగోళిక సందర్భం మూడింటినీ సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: וְלָבוֹא בְשַׁעַר הַדָּגִים
  choice: చేపల ద్వారం ప్రవేశం వరకు
  rationale: ఈ నిర్మాణం ప్రాకారం విస్తరించిన హద్దు లేదా చేరువను సూచిస్తున్నట్లు పాఠ్యంలో సహజంగా వ్యక్తపరుస్తుంది; ప్రత్యామ్నాయ పఠనాన్ని పాదసూచికలో ఉంచింది.
- source_word: וְסָבַב לָעֹפֶל
  choice: అతడు ఓఫెల్‌ను చుట్టుముట్టి
  rationale: హీబ్రూ క్రియ పురుష ఏకవచనంలో ఉండి రాజునే వ్యాకరణ కర్తగా కొనసాగిస్తుంది; ప్రాకారం చుట్టూ సాగిందనే భావసంభావ్యతను పాదసూచికలో నిలిపింది.
- source_word: הָעֹפֶל
  choice: ఓఫెల్
  rationale: యెరూషలేములోని స్థలనామం కాబట్టి లిప్యంతరీకరించబడింది; సంక్షిప్త భౌగోళిక వివరణ పాదసూచికలో ఉంది.
- source_word: וַיַּגְבִּיהֶהָ מְאֹד
  choice: ఆ ప్రాకారాన్ని చాలా ఎత్తుగా చేశాడు
  rationale: స్త్రీలింగ ప్రత్యయం ప్రాకారాన్ని సూచిస్తుందని తెలుగులో స్పష్టం చేస్తూ, מְאֹד యొక్క తీవ్రతను ‘చాలా’తో నిలుపుతుంది.
- source_word: שָׂרֵי חַיִל
  choice: సైన్యాధిపతులు
  rationale: సైనిక అధికారులను సూచించే ఈ పదబంధానికి ఆధునిక, గౌరవప్రదమైన, సులభంగా అర్థమయ్యే సమానార్థకం.
- source_word: בְּכָל הֶעָרִים הַבְּצֻרוֹת
  choice: ప్రాకార పట్టణాలన్నిటిలో
  rationale: రక్షణ ప్రాకారాలు గల పట్టణాలన్నిటిలో అనే పంపిణీ భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
