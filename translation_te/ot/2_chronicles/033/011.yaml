id: 2CH.33.11
reference: 2 Chronicles 33:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֵ֨א יְהוָ֜ה עֲלֵי/הֶ֗ם אֶת שָׂרֵ֤י הַ/צָּבָא֙ אֲשֶׁר֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר וַ/יִּלְכְּד֥וּ אֶת מְנַשֶּׁ֖ה בַּ/חֹחִ֑ים וַ/יַּֽאַסְרֻ֨/הוּ֙ בַּֽ/נְחֻשְׁתַּ֔יִם וַ/יּוֹלִיכֻ֖/הוּ בָּבֶֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/011.yaml
  text: So Yahweh brought against them the commanders of the army of the king of Assyria[a], and they captured Manasseh with hooks, bound him with bronze chains, and took him to Babylon.
translation:
  language: te
  text: అప్పుడు యాహ్వే అష్షూరు రాజు సైన్యాధిపతులను వారి మీదికి రప్పించాడు. వారు మనష్షేను కొక్కేలతో[a] పట్టుకొని, కంచు సంకెళ్లతో బంధించి, బబులోనుకు తీసుకువెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక కొక్కెంతో”; హీబ్రూ పదం కొక్కేలను లేదా ముళ్లను సూచించగలదు. కొందరు దీన్ని బందీకి వేసిన నిరోధక సాధనంగా మరింత సాధారణ అర్థంలో గ్రహిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిప్యంతరీకరణలో నిలిపింది.
- source_word: וַיָּבֵא ... עֲלֵיהֶם
  choice: వారి మీదికి రప్పించాడు
  rationale: హిఫీల్ రూపంలోని ప్రత్యక్ష కారణార్థాన్ని, సైనిక విరోధ సందర్భాన్ని సహజమైన తెలుగులో నిలిపింది.
- source_word: שָׂרֵי הַצָּבָא אֲשֶׁר לְמֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజు సైన్యాధిపతులను
  rationale: సైనిక నాయకత్వాన్ని, అష్షూరు రాజుతో వారి అనుబంధాన్ని సంక్షిప్తంగా స్పష్టం చేస్తుంది.
- source_word: וַיִּלְכְּדוּ
  choice: పట్టుకొని
  rationale: సైనికులు రాజును చెరపట్టిన సందర్భంలో לכד యొక్క అర్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בַּחֹחִים
  choice: కొక్కేలతో
  rationale: ఈ పదానికి ఉన్న కొక్కేలు/ముళ్లు అనే స్పష్టమైన రూపచిత్రంలో, బందీల నియంత్రణ సందర్భానికి సరిపోయే ‘కొక్కేలు’ను ఎంచుకుంది; అనిశ్చితిని పాదటీపులో ఉంచింది.
- source_word: בַּנְחֻשְׁתַּיִם
  choice: కంచు సంకెళ్లతో
  rationale: లోహపు బంధనాలనూ వాటి పదార్థాన్నీ సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיּוֹלִיכֻהוּ בָּבֶלָה
  choice: బబులోనుకు తీసుకువెళ్లారు
  rationale: హిఫీల్ క్రియలోని నడిపించడం/తీసుకుపోవడం భావాన్ని, దిశాసూచక రూపాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: అష్షూరు దండయాత్రలో దైవ కార్యసాధకత్వం
  choice: యాహ్వే సైన్యాధిపతులను వారి మీదికి రప్పించాడు
  alternative: యాహ్వే వారిని రావడానికి అనుమతించాడు
  rationale: మూలంలోని హిఫీల్ క్రియ చర్యను నేరుగా యాహ్వేకే ఆపాదిస్తుంది. దాన్ని కేవలం అనుమతిగా మృదువుచేయకుండా దైవ తీర్పు, సార్వభౌమత్వం రెండింటినీ నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలి. ‘కొక్కేలు’ అనే స్పష్టమైన పురాతన బందీచిత్రాన్ని నిలిపి, దాని లెక్సికల్ అనిశ్చితిని పాదటీపులో తెలిపింది.
