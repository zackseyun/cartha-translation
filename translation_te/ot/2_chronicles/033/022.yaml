source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה מְנַשֶּׁ֣ה אָבִ֑י/ו וּֽ/לְ/כָל הַ/פְּסִילִ֗ים אֲשֶׁ֤ר עָשָׂה֙ מְנַשֶּׁ֣ה אָבִ֔י/ו זִבַּ֥ח אָמ֖וֹן וַ/יַּֽעַבְדֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/022.yaml
  text: He did what was evil in the sight of Yahweh[a], just as Manasseh his father had done[b]. Amon sacrificed to all the carved images that Manasseh his father had made and served them.
translation:
  language: te
  text: అతడు తన తండ్రి మనష్షే చేసినట్లే యహ్వే దృష్టిలో చెడ్డది చేశాడు. తన తండ్రి మనష్షే చేసిన చెక్కిన ప్రతిమలన్నిటికీ[a] ఆమోను బలులు అర్పించి, వాటిని సేవించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చెక్కిన విగ్రహాలన్నిటికీ.’ హీబ్రూ పదం చెక్కిన లేదా తొలచిన రూపాలను ప్రత్యేకంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వాటిని ఆరాధించాడు.’ హీబ్రూ క్రియ అక్షరార్థంగా ‘సేవించాడు’ అని అర్థమిస్తుంది; మతపరమైన సందర్భంలో అది ఆరాధనను కూడా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: చెడ్డది చేశాడు
  rationale: ‘చెడు చేయడం’ అనే హీబ్రూ నుడికారంలోని నైతిక మూల్యాంకనాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యహ్వే దృష్టిలో
  rationale: దేవుని మూల్యాంకనాన్ని సూచించే హీబ్రూ నుడికారాన్ని తెలుగులో సహజంగా అందిస్తుంది; యహ్వే అనే వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయదు.
- source_word: כַּאֲשֶׁר עָשָׂה מְנַשֶּׁה אָבִיו
  choice: తన తండ్రి మనష్షే చేసినట్లే
  rationale: ఆమోను తన తండ్రి ప్రవర్తనను అనుకరించాడనే పోలికను, వారి సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: הַפְּסִילִים
  choice: చెక్కిన ప్రతిమలు
  rationale: సాధారణంగా ‘విగ్రహాలు’ అని మాత్రమే చెప్పకుండా, చెక్కడం లేదా తొలచడం ద్వారా తయారైన రూపాలనే మూలపదంలోని నిర్దిష్ట భావాన్ని నిలుపుతుంది.
- source_word: זִבַּח
  choice: బలులు అర్పించి
  rationale: ఆరాధనా సందర్భంలో బలి అర్పించడాన్ని సూచించే క్రియార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיַּעַבְדֵם
  choice: వాటిని సేవించాడు
  rationale: మూలక్రియలోని ‘సేవచేయు’ అనే విస్తృత భావాన్ని నిలుపుతుంది; విగ్రహాల సందర్భం దాని ఆరాధనా భావాన్ని తెలియజేస్తుంది.
- source_word: אָמֹון
  choice: ఆమోను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో స్థిరపడిన బైబిలు రూపానికి దగ్గరగా లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో ఉన్న దేవుని వ్యక్తిగత నామాన్ని బిరుదుగా మార్చకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణకు దగ్గరైన తెలుగు రూపాన్ని వాడింది.
- issue: విగ్రహారాధనా సందర్భంలో עבד ను ‘సేవించాడు’గా లేదా ‘ఆరాధించాడు’గా ఇవ్వడం
  choice: సేవించాడు
  alternative: ఆరాధించాడు
  rationale: మూలక్రియకు ప్రాథమికమైన ‘సేవచేయు’ భావాన్ని నిలిపి, మతపరమైన ఆరాధనా భావాన్ని సందర్భమే తెలియజేయనిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి. మూలంలోని రెండు సమాంతర క్రియలను—బలులు అర్పించడం, సేవించడం—వేర్వేరుగా నిలిపింది.
