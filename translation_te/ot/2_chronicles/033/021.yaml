  text: בֶּן עֶשְׂרִ֧ים וּ/שְׁתַּ֛יִם שָׁנָ֖ה אָמ֣וֹן בְּ/מָלְכ֑/וֹ וּ/שְׁתַּ֣יִם שָׁנִ֔ים מָלַ֖ךְ בִּֽ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/021.yaml
  text: Amon was twenty-two years old when he became king, and he reigned two years in Jerusalem.
translation:
  language: te
  text: ఆమోను రాజైనప్పుడు అతనికి ఇరవై రెండు సంవత్సరాలు. అతడు యెరూషలేములో రెండు సంవత్సరాలు పరిపాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: అతనికి ఇరవై రెండు సంవత్సరాలు
  rationale: హెబ్రీ వయస్సు నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా, అర్థం మారకుండా వ్యక్తం చేస్తుంది.
- source_word: אָמֹון
  choice: ఆమోను
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בְּמָלְכוֹ
  choice: రాజైనప్పుడు
  rationale: בְּ తో కూడిన מלך క్రియార్థక నామరూపం రాజ్యాధికారం చేపట్టిన సమయాన్ని సూచిస్తుంది; తెలుగులో ఈ రూపం సహజంగా ఉంటుంది.
- source_word: וּשְׁתַּיִם שָׁנִים
  choice: రెండు సంవత్సరాలు
  rationale: పరిపాలనా కాలవ్యవధిని నేరుగా తెలియజేస్తుంది.
- source_word: מָלַךְ
  choice: పరిపాలించాడు
  rationale: ఈ సందర్భంలో రాజుగా అధికారాన్ని నిర్వహించడాన్ని సూచిస్తుంది; ఆధునిక సాధారణ తెలుగులో స్పష్టమైన పదం.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: స్థలార్థక בְּ ను తెలుగు విభక్తి ‘లో’తో సహజంగా వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. మూలంలోని రెండు సమాంతర వాక్యభాగాలను తెలుగులో సహజమైన రెండు వాక్యాలుగా ఇచ్చాం.
