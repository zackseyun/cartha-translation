source:
  edition: WLC
  text: וַ/יַּכּוּ֙ עַם הָ/אָ֔רֶץ אֵ֥ת כָּל הַ/קֹּֽשְׁרִ֖ים עַל הַ/מֶּ֣לֶךְ אָמ֑וֹן וַ/יַּמְלִ֧יכוּ עַם הָ/אָ֛רֶץ אֶת יֹאשִׁיָּ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/025.yaml
  text: But the people of the land struck down all those who had conspired against King Amon[b][a], and the people of the land made Josiah his son king in his place.
translation:
  language: te
  text: అయితే దేశ ప్రజలు రాజైన ఆమోనుకు వ్యతిరేకంగా కుట్ర చేసిన వారందరినీ[a] హతముచేశారు. దేశ ప్రజలు అతని కుమారుడైన యోషీయాను అతని స్థానంలో రాజుగా నియమించారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కుట్రదారులందరినీ.’
    reason: lexical_alternative
  - marker: b
    text: ‘దేశ ప్రజలు’ అనేది హీబ్రూలోని ఒక ప్రత్యేక వ్యక్తీకరణ. ఇది దేశ జనాభాను సూచించవచ్చు; దీనికి సామాజిక-రాజకీయ భావ ఛాయలు కూడా ఉండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: చంపివేశారు
  rationale: נכה అనే క్రియ ఇక్కడ కుట్రదారులపై దేశ ప్రజలు చేసిన ప్రాణాంతక ప్రతీకార చర్యను సూచిస్తుంది; సందర్భంలో మరణం స్పష్టంగా ఉన్నందున ‘చంపివేశారు’ సహజమైన, నిర్దిష్టమైన తెలుగు.
- source_word: עַם הָאָרֶץ
  choice: దేశ ప్రజలు
  rationale: హీబ్రూ పదబంధంలోని ‘దేశం’ మరియు ‘ప్రజలు’ అనే మూలభావాలను నిలుపుతూ, దాని ఖచ్చితమైన సామాజిక-రాజకీయ పరిధిని నిర్ణయించకుండా ఉంచుతుంది.
- source_word: כָּל הַקֹּשְׁרִים
  choice: కుట్ర చేసిన వారందరినీ
  rationale: קשר కర్తృవాచక రూపం కలిసి కుట్రలో పాల్గొన్నవారిని సూచిస్తుంది; ఈ రూపం ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: עַל הַמֶּלֶךְ אָמוֹן
  choice: అమోను రాజుకు వ్యతిరేకంగా
  rationale: קשר తో వచ్చిన עַל ఇక్కడ రాజుకు వ్యతిరేకంగా కుట్ర చేయడాన్ని సూచిస్తుంది.
- source_word: וַיַּמְלִיכוּ
  choice: రాజుగా నియమించారు
  rationale: מלך హిఫీల్ రూపం ఒకరిని రాజుగా చేయడం లేదా పరిపాలనలో నిలపడం అనే అర్థాన్నిస్తుంది; పట్టాభిషేక కర్మను అనవసరంగా చేర్చదు.
- source_word: יֹאשִׁיָּהוּ בְנוֹ
  choice: అతని కుమారుడైన యోషీయాను
  rationale: యోషీయా అమోను కుమారుడని స్పష్టంగా, సహజమైన తెలుగు సంబంధ నిర్మాణంతో తెలియజేస్తుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: అమోను తరువాత జరిగిన రాజ్య వారసత్వాన్ని సూచించే సహజమైన తెలుగు వ్యక్తీకరణ.
- source_word: וַ
  choice: అయితే
  rationale: మునుపటి వచనంలో అమోనును అతని సేవకులు చంపిన చర్యకు, ఇక్కడ దేశ ప్రజలు చేసిన ప్రతిచర్యకు మధ్య ఉన్న వ్యత్యాసాన్ని తెలియజేస్తుంది.
