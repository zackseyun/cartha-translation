  to: అయితే దేశ ప్రజలు రాజైన ఆమోనుకు వ్యతిరేకంగా కుట్ర చేసిన వారందరినీ[a] హతముచేశారు. దేశ ప్రజలు అతని కుమారుడైన యోషీయాను అతని స్థానంలో రాజుగా నియమించారు.[b]
