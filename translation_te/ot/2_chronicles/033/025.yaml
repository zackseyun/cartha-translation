translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘దేశ ప్రజలు’ అనే పదబంధం మూలంలోని సాధ్యమైన సామాజిక-రాజకీయ అస్పష్టతను నిలుపుతుంది. రెండు పాదాల్లో ఒకే సమూహం చర్యను బలపరచడానికి రెండోసారి ‘ఆ దేశ ప్రజలే’ అని ఇచ్చాం; [a], [b] గుర్తులు సంబంధిత పదబంధాల వెంట ఉంచాం.
