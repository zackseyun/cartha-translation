  text: וַ/יִּשְׁכַּ֤ב מְנַשֶּׁה֙ עִם אֲבֹתָ֔י/ו וַֽ/יִּקְבְּרֻ֖/הוּ בֵּית֑/וֹ וַ/יִּמְלֹ֛ךְ אָמ֥וֹן בְּנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/020.yaml
  text: And Manasseh slept with his fathers[a], and they buried him in his house. And Amon his son reigned in his place.
translation:
  language: te
  text: మనష్షే తన పితరులతో కూడ నిద్రించాడు; వారు అతణ్ణి అతని ఇంట్లో[a] పాతిపెట్టారు. అతని కుమారుడు ఆమోను అతని స్థానంలో రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని రాజభవనంలో.’ హెబ్రీయ మూలంలో ‘అతని ఇంట్లో’ అని ఉంది; రాజసందర్భంలో ఇది రాజభవన సముదాయాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: నిద్రించాడు
  rationale: మరణాన్ని సూచించే హెబ్రీయ సంప్రదాయ రూపకాన్ని ‘చనిపోయాడు’ అని సాదాసీదాగా మార్చకుండా నిలుపుతుంది.
- source_word: עִם אֲבֹתָיו
  choice: తన పితరులతో కూడ
  rationale: రాజుల మరణవివరణల్లో కనిపించే సంప్రదాయ హెబ్రీయ పదబంధాన్ని గౌరవప్రదంగా, మూలానికి దగ్గరగా అందిస్తుంది.
- source_word: וַיִּקְבְּרֻהוּ
  choice: వారు అతణ్ణి ... పాతిపెట్టారు
  rationale: మూలంలోని క్రియ బహువచన కర్తతో, ఏకవచన కర్మప్రత్యయంతో ఉన్నందున కర్తృవాచ్య రూపాన్ని నిలిపింది.
- source_word: בֵּיתוֹ
  choice: అతని ఇంట్లో
  rationale: בַּיִת అనే పదానికి ప్రాథమిక అర్థం ‘ఇల్లు’; రాజసందర్భంలో అది రాజభవన సముదాయాన్ని కూడా సూచించవచ్చనే అవకాశాన్ని పాదసూచికలో ఉంచింది.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: వారసత్వ సందర్భంలో రాజ్యాధికారం చేపట్టడాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: రాజవారసత్వ సూత్రంలో ‘అతనికి బదులుగా/అతని స్థానంలో’ అనే అర్థాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మరణానికి సంబంధించిన హెబ్రీయ రూపకాన్ని నిలుపుతూ, అస్పష్టతను పాదసూచికలో భద్రపరిచింది.
