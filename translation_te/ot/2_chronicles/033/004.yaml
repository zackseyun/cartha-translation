id: 2CH.33.4
reference: 2 Chronicles 33:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בָנָ֥ה מִזְבְּח֖וֹת בְּ/בֵ֣ית יְהוָ֑ה אֲשֶׁר֙ אָמַ֣ר יְהוָ֔ה בִּ/ירוּשָׁלִַ֥ם יִֽהְיֶה שְּׁמִ֖/י לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/004.yaml
  text: He built altars in the house of Yahweh[a], of which Yahweh had said[b], “In Jerusalem my name will be forever.”
translation:
  language: te
  text: అతడు యెహోవా మందిరంలో[a] బలిపీఠాలు కట్టాడు. ఆ మందిరాన్ని గూర్చి యెహోవా, “యెరూషలేములో నా నామం శాశ్వతంగా ఉంటుంది”[b] అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యెహోవా గృహంలో”; ఇక్కడ అది దేవాలయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠ్యం అక్షరార్థంగా, “నా నామం శాశ్వతంగా ఉంటుంది.” ఇతర చోట్ల కనిపించే “నా నామం అక్కడ శాశ్వతంగా ఉంటుంది” అనే సాధారణ బైబిలు ప్రయోగంతో పోల్చండి; ఈ వచనంలో “అక్కడ” అనే పదం లేదు.
    reason: cross_reference
lexical_decisions:
- source_word: וּבָנָה
  choice: అతడు … కట్టించాడు
  rationale: בנה అనే క్రియకు ‘కట్టు/నిర్మించు’ అని అర్థం. సందర్భంలోని రాజు స్వయంగా కాక తన ఆజ్ఞతో నిర్మింపజేసి ఉండవచ్చనే సహజ తెలుగు వాడుకను ‘కట్టించాడు’ తెలియజేస్తుంది; వావ్ సంధిని తెలుగు కథనంలో ప్రత్యేకంగా ‘మరియు’ అని అనువదించాల్సిన అవసరం లేదు.
- source_word: מִזְבְּחוֹת
  choice: బలిపీఠాలు
  rationale: מִזְבֵּחַ యొక్క బహువచనం; బలులు అర్పించే పీఠాలను సూచించే ప్రామాణికమైన, స్పష్టమైన తెలుగు పదం.
- source_word: בְּבֵית יְהוָה
  choice: యెహోవా మందిరంలో
  rationale: బַּיִת అక్షరార్థంగా ‘ఇల్లు/గృహం’; ఇక్కడ యెరూషలేము దేవాలయాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘మందిరం’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా అందించాం.
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: ఆ మందిరాన్ని గూర్చి యెహోవా … అని చెప్పాడు
  rationale: సంబంధవాచకమైన אֲשֶׁר ముందున్న ‘యెహోవా మందిరం’తో వాక్యాన్ని కలుపుతుంది. ‘ఆ మందిరాన్ని గూర్చి’ అనే రూపం ఆ సంబంధాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది. హీబ్రూ సాధారణ భూతరూపాన్ని ‘చెప్పాడు’గా అనువదించాం.
- source_word: בִּירוּשָׁלִַם
  choice: యెరూషలేములో
  rationale: స్థలనామంతో కూడిన בְּ ఉపసర్గను నేరుగా ‘లో’గా అందించి, మూలంలోని ముందుస్థానాన్ని నిలిపాం.
- source_word: יִהְיֶה שְּׁמִי
  choice: నా నామం … ఉంటుంది
  rationale: అక్షరార్థమైన ‘నా నామం ఉంటుంది’ను నిలిపాం. మూలంలో లేని ‘అక్కడ’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: לְעוֹלָם
  choice: శాశ్వతంగా
  rationale: దీర్ఘకాలిక, అంతంలేని నిలకడను తెలియజేసే לְעוֹלָםకు గౌరవప్రదమైన ఆధునిక తెలుగు సమానార్థకం.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం ఉంది. దానిని కేవలం బిరుదుగా మార్చకుండా తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఉపయోగించాం; ఇది ఏ ప్రత్యేక వ్యాఖ్యాన సిద్ధాంతాన్నీ చేర్చదు.
- issue: ‘నా నామం ఉంటుంది’ అనే వాక్యంలో ‘అక్కడ’ను చేర్చాలా
  choice: ‘అక్కడ’ను చేర్చకుండా ‘నా నామం శాశ్వతంగా ఉంటుంది’
  alternative: నా నామం అక్కడ శాశ్వతంగా ఉంటుంది
  rationale: ఈ మసొరేటిక్ పాఠ్యంలో שָׁם (‘అక్కడ’) లేదు. సమాంతర బైబిలు ప్రయోగం భావాన్ని వివరించగలిగినా, మూలపాఠ్యానికి మించి ప్రధాన వాక్యాన్ని విస్తరించకుండా దాని సంక్షిప్తతను, అంతర్లీన ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. ‘మందిరం,’ ‘బలిపీఠాలు,’ ‘నామం,’ ‘శాశ్వతంగా’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యే బైబిలు గాంభీర్యాన్ని నిలుపుతాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
