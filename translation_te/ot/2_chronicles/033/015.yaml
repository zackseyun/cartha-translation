- from: అతడు అన్య దేవుళ్లను, విగ్రహాన్ని[a] యెహోవా మందిరంలోనుండి తొలగించాడు. అలాగే యెహోవా మందిరపు కొండపై[b], యెరూషలేములో తాను కట్టించిన బలిపీఠాలన్నిటినీ తొలగించి, వాటిని నగరం వెలుపల పారవేశాడు.
