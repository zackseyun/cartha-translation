id: 2CH.33.15
reference: 2 Chronicles 33:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֠/יָּסַר אֶת אֱלֹהֵ֨י הַ/נֵּכָ֤ר וְ/אֶת הַ/סֶּ֨מֶל֙ מִ/בֵּ֣ית יְהוָ֔ה וְ/כָל הַֽ/מִּזְבְּח֗וֹת אֲשֶׁ֥ר בָּנָ֛ה בְּ/הַ֥ר בֵּית יְהוָ֖ה וּ/בִ/ירוּשָׁלִָ֑ם וַ/יַּשְׁלֵ֖ךְ ח֥וּצָ/ה לָ/עִֽיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/015.yaml
  text: He removed the foreign gods and the idol from the house of Yahweh[a], and all the altars that he had built on the mountain of the house of Yahweh and in Jerusalem[b], and he threw them outside the city.
translation:
  language: te
  text: అతడు అన్య దేవుళ్లను, విగ్రహాన్ని[a] యాహ్వే మందిరం నుండి తొలగించాడు. అలాగే యాహ్వే మందిరపు పర్వతంపై[b], యెరూషలేములో తాను కట్టిన బలిపీఠాలన్నిటినీ తొలగించి, వాటిని నగరం వెలుపల పారవేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రతిమ.” హీబ్రూ పదం ఆరాధనకు సంబంధించిన విగ్రహాన్ని లేదా ప్రతిమను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “యాహ్వే మందిరం ఉన్న పర్వతంపై”; అంటే ఆలయ పర్వతంపై.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: తొలగించాడు
  rationale: హిఫిల్ రూపం ఏదైనా అక్కడి నుంచి తీసివేయడం లేదా తొలగించడం అనే భావాన్ని ఇస్తుంది; సంస్కరణ సందర్భంలో ఇది సహజమైన ఆధునిక తెలుగు.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: అన్య దేవుళ్లు
  rationale: యెహోవా ఆరాధనకు చెందని ఇతర దేవతలను సూచించే ఈ పదబంధానికి ‘అన్య దేవుళ్లు’ స్పష్టమైన, సహజమైన అనువాదం.
- source_word: הַסֶּמֶל
  choice: విగ్రహం
  rationale: ఆరాధనకు సంబంధించిన ప్రతిమ లేదా విగ్రహాన్ని ఈ పదం సూచిస్తుంది. సందర్భంలోని ప్రతికూల మతపరమైన భావాన్ని ‘విగ్రహం’ స్పష్టంగా తెలియజేస్తుంది; ‘ప్రతిమ’ అనే విస్తృత అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: מִבֵּית יְהוָה
  choice: యెహోవా మందిరంలోనుండి
  rationale: ‘యెహోవా గృహం’ అనే హీబ్రూ నుడికారం ఇక్కడ ఆలయాన్ని సూచిస్తుంది; సాధారణ పాఠకునికి ‘మందిరం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וְכָל הַמִּזְבְּחוֹת
  choice: బలిపీఠాలన్నిటినీ
  rationale: బహువచన నామవాచకంతో కూడిన ‘అన్నీ’ అనే భావాన్ని సంక్షిప్తంగా, యథార్థంగా అందిస్తుంది.
- source_word: אֲשֶׁר בָּנָה
  choice: తాను కట్టించిన
  rationale: ఆ బలిపీఠాలను ముందుగా మనష్షే నిర్మింపజేశాడనే సందర్భాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; క్రియ కర్తకు తిరిగి సంబంధించేందుకు ‘తాను’ వాడబడింది.
- source_word: בְּהַר בֵּית יְהוָה
  choice: యెహోవా మందిరపు కొండపై
  rationale: הַר అనే పదంలోని కొండ/పర్వత భావాన్ని, ‘యెహోవా మందిరం’తో ఉన్న నిర్మాణ సంబంధాన్ని సాధ్యమైనంత పారదర్శకంగా నిలుపుతుంది.
- source_word: וּבִירוּשָׁלָם
  choice: యెరూషలేములో
  rationale: ఆలయ కొండతోపాటు నగరంలోని మరిన్ని ప్రాంతాలను సూచించే స్థానవాచకాన్ని నేరుగా అనువదిస్తుంది.
- source_word: וַיַּשְׁלֵךְ
  choice: పారవేశాడు
  rationale: బయటకు బలంగా విసిరివేయడం లేదా పారవేయడం అనే క్రియ యొక్క సజీవ భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: חוּצָה לָעִיר
  choice: నగరం వెలుపల
  rationale: నగర సరిహద్దులకు బయటికి తీసివేయబడిన గమ్యస్థానాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో దైవనామమైన చతురక్షరి నేరుగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగా ఉంచడం మూలపాఠానికి పారదర్శకంగా ఉంటుంది.
- issue: הַסֶּמֶל యొక్క మతపరమైన స్వభావం
  choice: విగ్రహం
  alternative: ప్రతిమ
  rationale: సందర్భం మనష్షే తొలగించిన అన్య ఆరాధనా వస్తువును సూచిస్తుంది. ‘విగ్రహం’ ఆ భావాన్ని తెలియజేస్తుంది; అయితే మూలపదం సాధారణంగా ‘ప్రతిమ’ను కూడా సూచించగలదని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘యెహోవా మందిరం’ సాధారణ పాఠకునికి స్పష్టతనిస్తే, ‘మందిరపు కొండ’ మూలంలోని నిర్మాణాన్ని మరియు భౌగోళిక భావాన్ని నిలుపుతుంది. పొడవైన హీబ్రూ వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి పఠన సౌలభ్యం పెంచినా, చర్యల క్రమం మరియు అంశాలన్నీ భద్రపరచబడ్డాయి.
