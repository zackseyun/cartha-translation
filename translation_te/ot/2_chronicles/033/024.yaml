translation:
  language: te
  text: అతని సేవకులు అతనికి వ్యతిరేకంగా కుట్ర చేసి, అతని సొంత ఇంట్లోనే అతన్ని చంపారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו
  choice: అతనికి వ్యతిరేకంగా కుట్ర చేసి
  rationale: קשר על అనే హీబ్రూ ప్రయోగం ఒకరికి వ్యతిరేకంగా, ముఖ్యంగా రాజహత్య సందర్భంలో, కుట్ర చేయడాన్ని సూచిస్తుంది. ఈ తెలుగు రూపం రాజకీయ శత్రుత్వ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: עֲבָדָיו
  choice: అతని సేవకులు
  rationale: రాజసభ సందర్భంలో עבד రాజు సేవకులను లేదా అధికారులను సూచించవచ్చు. మూలపాఠం వారి హోదాను నిర్దిష్టంగా చెప్పనందున, ‘సేవకులు’ నేరుగా ఉండి అతిగా వ్యాఖ్యానించదు.
- source_word: וַיְמִיתֻהוּ
  choice: అతన్ని చంపారు
  rationale: מות యొక్క హిఫీల్ రూపం అతని మరణాన్ని వారు కలిగించారని స్పష్టంగా చెబుతుంది. ఆధునిక తెలుగులో ‘చంపారు’ ఈ భావాన్ని సహజంగా, గంభీరంగా వ్యక్తపరుస్తుంది.
- source_word: בְּבֵיתוֹ
  choice: అతని సొంత ఇంట్లోనే
  rationale: בְּ స్థలాన్ని, స్వామ్య ప్రత్యయం ‘అతని ఇంటిని’ సూచిస్తాయి. ‘సొంత’ మరియు ‘లోనే’ అనేవి సంఘటన అతని ఇంటి లోపలే జరిగిందనే సన్నిహిత, దిగ్భ్రాంతికర స్థలభావాన్ని తెలుగులో సహజంగా తెలియజేస్తాయి.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. రాజసభలోని వ్యక్తుల ఖచ్చిత హోదాను మూలపాఠం కంటే ఎక్కువగా నిర్ధారించకుండా ‘సేవకులు’ అని ఉంచబడింది.
