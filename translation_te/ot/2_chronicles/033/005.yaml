source:
  edition: WLC
  text: וַ/יִּ֥בֶן מִזְבְּח֖וֹת לְ/כָל צְבָ֣א הַ/שָּׁמָ֑יִם בִּ/שְׁתֵּ֖י חַצְר֥וֹת בֵּית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/005.yaml
  text: He built altars for all the host of heaven in the two courts of the house of Yahweh[a].
translation:
  language: te
  text: అతడు యాహ్వే మందిరపు రెండు ప్రాంగణాలలో ఆకాశ సైన్యమంతటికీ బలిపీఠాలు కట్టాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరలోక సైన్యమంతటికీ.” ఈ హీబ్రూ నుడికారం ఖగోళ ఆరాధనలో పూజించబడిన ఆకాశ సంబంధిత శక్తులు లేదా ఖగోళ వస్తువులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: అతడు ... కట్టించాడు
  rationale: בנה యొక్క కథనాత్మక గతకాల క్రియ. సందర్భంలోని రాజైన మనష్షే నిర్మాణం చేయించిన భావాన్ని సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది; ప్రారంభ wawను ప్రత్యేకంగా ‘మరియు’ అని అనువదించాల్సిన అవసరం లేదు.
- source_word: מִזְבְּחוֹת
  choice: బలిపీఠాలు
  rationale: బలులు లేదా ధూపార్పణలు సమర్పించే పీఠాలకు వాడే ప్రామాణిక పదానికి నేరమైన, సాధారణ తెలుగు సమానం.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: ఆకాశ సైన్యమంతటికోసం
  rationale: మూలంలోని צבא השמים అనే ‘ఆకాశ సైన్యం’ నుడికారాన్ని నిలుపుతూ, לְ ను ఆ సైన్యాన్ని గౌరవిస్తూ నిర్మించిన బలిపీఠాల భావంలో ‘కోసం’గా అందిస్తుంది. ఇది నక్షత్రారాధనకు సంబంధించిన ఖగోళ సమూహాన్ని సూచించవచ్చు; ఆ వివరణను పాదటిప్పణిలో ఉంచాం.
- source_word: בִּשְׁתֵּי חַצְרוֹת
  choice: రెండు ప్రాంగణాల్లో
  rationale: ప్రత్యేకంగా రెండు ఆలయ ఆవరణలను సూచిస్తుంది. ఆధునిక తెలుగులో ‘ప్రాంగణాలు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: בית యొక్క అక్షరార్థం ‘ఇల్లు’ అయినప్పటికీ, ఇక్కడ ఆలయ నిర్మాణాన్ని సూచిస్తున్నందున ‘మందిరం’ సహజమైన సందర్భార్థాన్ని ఇస్తుంది; יהוה అనే దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంతో ప్రత్యక్షంగా సూచిస్తుంది.
- issue: צבא השמים యొక్క గుర్తింపు
  choice: ఆకాశ సైన్యం
  alternative: ఆకాశ నక్షత్ర సమూహం
  rationale: మూలంలోని సమూహార్థక, కొంత విస్తృతమైన నుడికారాన్ని ప్రధాన పాఠంలో నిలుపుతుంది. అది ఖగోళ వస్తువులనో పరలోక శక్తులనో సూచించగల భావపరిధిని ముందుగానే ఒకదానికే పరిమితం చేయదు; ఆరాధనా సందర్భాన్ని పాదటిప్పణి వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘ఆకాశ సైన్యం’ అనే బైబిలీయ నుడికారాన్ని నిలుపుతూ దాని ఆరాధనా భావాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
