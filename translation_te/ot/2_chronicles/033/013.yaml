id: 2CH.33.13
reference: 2 Chronicles 33:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתְפַּלֵּ֣ל אֵלָ֗י/ו וַ/יֵּעָ֤תֶר ל/וֹ֙ וַ/יִּשְׁמַ֣ע תְּחִנָּת֔/וֹ וַ/יְשִׁיבֵ֥/הוּ יְרוּשָׁלִַ֖ם לְ/מַלְכוּת֑/וֹ וַ/יֵּ֣דַע מְנַשֶּׁ֔ה כִּ֥י יְהוָ֖ה ה֥וּא הָֽ/אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/013.yaml
  text: He prayed to him[a], and he was moved by his entreaty, heard his supplication, and brought him back to Jerusalem to his kingdom[c][b]. Then Manasseh knew that Yahweh is God.
translation:
  language: te
  text: అతడు ఆయనకు ప్రార్థించాడు. ఆయన అతని మనవికి అనుకూలంగా స్పందించి[a], అతని విన్నపాన్ని విని, అతణ్ణి యెరూషలేములో తన రాజ్యాధికారానికి తిరిగి చేర్చాడు[b]. అప్పుడు యెహోవాయే దేవుడని మనష్షే తెలుసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన అతని మనవిని అంగీకరించాడు”; అంటే, అతని మనవికి అనుగ్రహంతో స్పందించాడు.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: “అతని రాజ్యానికి”; ఇక్కడ అతని రాజరిక పరిపాలన లేదా రాజ్యాధికారం అని భావం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל אֵלָיו
  choice: అతడు ఆయనకు ప్రార్థించాడు
  rationale: హిత్పయేల్ రూపంలోని התפלל సాధారణంగా ‘ప్రార్థించు’ అని అర్థం. אֵלָיו లోని వ్యక్తిగత దిశను ‘ఆయనకు’ అని నిలిపి ఉంచాం.
- source_word: וַיֵּעָתֶר לוֹ
  choice: ఆయన అతని మనవికి అనుకూలంగా స్పందించి
  rationale: నిఫాల్ రూపంలోని עתרకు ‘మనవి చేయబడుట’ లేదా ‘మనవికి అనుకూలంగా స్పందించుట’ అనే భావాలు ఉన్నాయి. తెలుగులో సహజంగా ఉండటంతో పాటు దేవుని అనుకూల స్పందనను వ్యక్తం చేసే రెండవ భావాన్ని ప్రధాన పాఠ్యంలో తీసుకున్నాం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וַיִּשְׁמַע תְּחִנָּתוֹ
  choice: అతని కరుణావిన్నపాన్ని విని
  rationale: תְּחִנָּה అనేది కరుణ లేదా అనుగ్రహం కోసం చేసే గంభీరమైన విన్నపం. ‘కరుణావిన్నపం’ ప్రార్థనా సందర్భాన్నీ పదంలోని కరుణాభ్యర్థన భావాన్నీ తెలియజేస్తుంది.
- source_word: וַיְשִׁיבֵהוּ יְרוּשָׁלַםִ לְמַלְכוּתוֹ
  choice: అతణ్ణి యెరూషలేముకు—అతని రాజ్యాధికారానికి—తిరిగి తీసుకొచ్చాడు
  rationale: హిఫిల్ రూపంలోని שוב ‘తిరిగి తీసుకురావడం’ అనే కారణార్థాన్ని ఇస్తుంది. מַלְכוּת ఇక్కడ భూభాగం కంటే రాజరిక పరిపాలన లేదా రాజ్యాధికారాన్ని సూచించే అవకాశం ఉన్నందున దానిని స్పష్టమైన కాని మూలానికి దగ్గరైన రూపంలో ఇచ్చాం.
- source_word: וַיֵּדַע מְנַשֶּׁה
  choice: అప్పుడు ... మనష్షే తెలుసుకున్నాడు
  rationale: ידע ను నేరుగా ‘తెలుసుకున్నాడు’గా అనువదించాం. కథనంలోని పరిణామ సంబంధాన్ని సహజ తెలుగులో ‘అప్పుడు’ తెలియజేస్తుంది.
- source_word: כִּי יְהוָה הוּא הָאֱלֹהִים
  choice: యెహోవా ఆయనే దేవుడని
  rationale: הוּא ఇచ్చే ఉద్ఘాటనను ‘ఆయనే’ ద్వారా నిలిపాం. మూలంలో ప్రత్యక్షంగా లేని ‘ఒక్కడే’ అనే పదాన్ని చేర్చకుండా ఒప్పుకోలులోని బలాన్ని కాపాడాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠ్యంలో ఒడంబడిక దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుతో మార్చకుండా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- issue: כִּי יְהוָה הוּא הָאֱלֹהִים అనే ఒప్పుకోలు ఎంతవరకు ప్రత్యేకత్వాన్ని ప్రకటిస్తుంది
  choice: యెహోవా ఆయనే దేవుడు
  alternative: యెహోవా ఒక్కడే దేవుడు
  rationale: హీబ్రూ సర్వనామం הוּא ఉద్ఘాటన ఇస్తుంది; అయితే ‘ఒక్కడే’ అనే ప్రత్యేక పదం లేదు. అందువల్ల ఉద్ఘాటనను నిలిపి, ఏకైకత్వాన్ని పాఠ్యంలో అదనంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. దేవునికి గౌరవసూచకంగా ‘ఆయన’ వాడాం. సమాంతర హీబ్రూ క్రియల ప్రవాహాన్ని ‘స్పందించి, విని, ... తీసుకొచ్చాడు’ అనే వరుసలో నిలిపాం; అతిగా ప్రాచీనమైన పదజాలాన్ని నివారించాం.
