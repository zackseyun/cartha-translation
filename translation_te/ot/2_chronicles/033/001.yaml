  yaml_path: translation/ot/2_chronicles/033/001.yaml
  text: Manasseh was twelve years old when he began to reign, and he reigned fifty-five years in Jerusalem.
translation:
  language: te
  text: మనష్షే రాజు కావడం ప్రారంభించినప్పుడు అతనికి పన్నెండేళ్ల వయస్సు. అతడు యెరూషలేములో యాభై ఐదు సంవత్సరాలు పరిపాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: అతనికి పన్నెండేళ్లు
  rationale: ఇది వయస్సును తెలిపే ప్రామాణిక హీబ్రూ నుడికారం. పదశః ‘పన్నెండు సంవత్సరాల కుమారుడు’ అనడం తెలుగులో అసహజం; ఎంచుకున్న రూపం అర్థాన్ని సహజంగా, ఖచ్చితంగా అందిస్తుంది.
- source_word: מְנַשֶּׁה
  choice: మనష్షే
  rationale: హీబ్రూ పేరులోని ధ్వనులకు దగ్గరగా, తెలుగులో స్థిరపడిన బైబిలు నామరూపాన్ని ఉపయోగించాం.
- source_word: בְמָלְכוֹ
  choice: రాజైనప్పుడు
  rationale: ఈ రాజవంశీయ సూత్రవాక్యంలో ఈ నిర్మాణం అతడు రాజ్యాధికారాన్ని చేపట్టిన సమయాన్ని సూచిస్తుంది. ‘రాజైనప్పుడు’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: וַחֲמִשִּׁים וְחָמֵשׁ שָׁנָה
  choice: యాభై ఐదు సంవత్సరాలు
  rationale: హీబ్రూలోని ‘యాభై మరియు ఐదు’ అనే సమన్వయ సంఖ్యను ఆధునిక తెలుగు సంఖ్యా ప్రయోగంలో సహజంగా ఇచ్చాం.
- source_word: מָלַךְ
  choice: రాజ్యపాలన చేశాడు
  rationale: ఈ సందర్భంలో מלך రాజుగా పరిపాలించడాన్ని సూచిస్తుంది. ‘రాజ్యపాలన చేశాడు’ సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన తెలుగు.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: ב అనే ఉపసర్గ స్థలాన్ని సూచిస్తుంది; అందువల్ల ‘యెరూషలేములో’ నేరమైన సమానార్థకం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన రాజవంశీయ వాక్యనిర్మాణం వాడబడింది. మూలంలోని రెండు వాక్యభాగాల సమాంతర సమాచారాన్ని కాపాడుతూ, భారమైన పదశః నిర్మాణాన్ని నివారించాం.
