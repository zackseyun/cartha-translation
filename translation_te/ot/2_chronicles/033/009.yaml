source:
  edition: WLC
  text: וַ/יֶּ֣תַע מְנַשֶּׁ֔ה אֶת יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם לַ/עֲשׂ֣וֹת רָ֔ע מִן הַ֨/גּוֹיִ֔ם אֲשֶׁר֙ הִשְׁמִ֣יד יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/009.yaml
  text: So Manasseh led Judah and the inhabitants of Jerusalem astray[a], to do more evil than the nations whom Yahweh had destroyed before the sons of Israel.
translation:
  language: te
  text: మనష్షే యూదా ప్రజలను, యెరూషలేము నివాసులను తప్పుదారి పట్టించాడు; దాంతో వారు ఇశ్రాయేలు కుమారుల[a] ఎదుటనుండి యాహ్వే నిర్మూలించిన జనాంగాలకంటే ఎక్కువగా చెడు చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలీయులు’ లేదా ‘ఇశ్రాయేలు ప్రజలు.’ హెబ్రీలో అక్షరార్థంగా, ‘ఇశ్రాయేలు కుమారులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּתַע
  choice: తప్పుదారి పట్టించి ... వారిని నడిపించాడు
  rationale: תעה హిఫీల్ రూపంలోని కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. వాక్యాంతంలోని ఉద్దేశార్థక క్రియతో కలిపి, మనష్షే వారిని చెడు చేయించే దిశగా నడిపించాడనే భావాన్ని నిలుపుతుంది.
- source_word: יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: యూదావారిని, యెరూషలేము నివాసులను
  rationale: యూదా అనే సమష్టి ప్రజాసమూహాన్నీ, ప్రత్యేకంగా యెరూషలేములో నివసించేవారినీ రెండు కర్మలుగా స్పష్టంగా ఉంచుతుంది.
- source_word: לַעֲשׂוֹת רָע
  choice: మరింత చెడు చేయడానికి
  rationale: ‘చెడు చేయడం’ అనే హెబ్రీ సరళ నిర్మాణాన్ని దగ్గరగా నిలుపుతూ, తరువాతి పోలికను తెలుగులో సహజంగా కలుపుతుంది.
- source_word: מִן הַגּוֹיִם
  choice: జనాలకంటే
  rationale: מִן ఇక్కడ పోలికను సూచిస్తుంది; అందువల్ల ‘కంటే’ అనే విభక్తి పోలికను స్పష్టంగా వ్యక్తం చేస్తుంది. הַגּוֹיִםను తరువాతి కాలపు మతపరమైన ప్రత్యేకార్థం గల పదంతో కాకుండా ‘జనాలు’గా అనువదించాం.
- source_word: אֲשֶׁר הִשְׁמִיד יְהוָה
  choice: యాహ్వే నిర్మూలించిన
  rationale: השמיד యొక్క బలమైన నాశనార్థాన్ని ‘నిర్మూలించిన’ స్పష్టంగా తెలియజేస్తుంది; దేవుని వ్యక్తిగత నామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: מִפְּנֵי
  choice: ఎదుట నుంచి
  rationale: విజయసాధన సందర్భంలోని ‘వారి ఎదుట నుంచి తొలగించడం/నాశనం చేయడం’ అనే స్థానిక భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హెబ్రీలోని అక్షరార్థ పురుషలింగ సమష్టి వ్యక్తీకరణను నిలుపుతుంది; ఆధునిక సమష్టి ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: హెబ్రీ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- issue: בְּנֵי יִשְׂרָאֵל అనే సమష్టి పురుషలింగ వ్యక్తీకరణ
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలు ప్రజలు / ఇశ్రాయేలీయులు
  rationale: మూలంలోని రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, అది సమస్త ఇశ్రాయేలు ప్రజలను సూచించగలదనే భావాన్ని పాదసూచికలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘తప్పుదారి పట్టించి ... నడిపించాడు’ అనే నిర్మాణం హెబ్రీ కారణార్థాన్ని, ‘జనాలకంటే మరింత చెడు’ అనే నిర్మాణం పోలికను స్పష్టంగా ఉంచుతుంది.
