source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מְנַשֶּׁ֥ה וְ/אֶל עַמּ֖/וֹ וְ/לֹ֥א הִקְשִֽׁיבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/010.yaml
  text: And Yahweh spoke to Manasseh and to his people[a], but they did not listen.
translation:
  language: te
  text: యెహోవా మనష్షేతో, అతని ప్రజలతో మాట్లాడాడు; కానీ వారు శ్రద్ధగా వినలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పట్టించుకోలేదు,” “లక్ష్యపెట్టలేదు.” హీబ్రూ క్రియ స్పందనకు దారితీసే శ్రద్ధపూర్వక వినికిడి భావాన్ని కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: మాట్లాడాడు
  rationale: דבר పియేల్ రూపం אֶל తో కలిసి ‘ఒకరితో మాట్లాడడం’ అనే అర్థం ఇస్తుంది; ఆధునిక తెలుగులో ‘మాట్లాడాడు’ సహజంగా, కచ్చితంగా ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: מְנַשֶּׁה
  choice: మనష్షే
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: עַמּוֹ
  choice: అతని ప్రజలు
  rationale: עַם పై మూడవ పురుష ఏకవచన ప్రత్యయం ఉండడం వల్ల ఇది మనష్షేకు చెందిన లేదా అతని పాలనలోని ప్రజలను సూచిస్తుంది.
- source_word: וְלֹא
  choice: కానీ ... లేదు
  rationale: వావ్ సంధి ఇక్కడ యెహోవా మాట్లాడటానికి వారి స్పందనకు మధ్య వ్యతిరేకతను చూపుతుంది; ‘కానీ’ ఆ ప్రవాహాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הִקְשִׁיבוּ
  choice: శ్రద్ధగా వినలేదు
  rationale: קשב హిఫీల్ రూపంలో కేవలం శబ్దం వినడం కాక శ్రద్ధ పెట్టి వినడం, పట్టించుకోవడం అనే భావం ఉంది. ‘శ్రద్ధగా వినలేదు’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘వారు వినలేదు’ అనే బహువచన కర్త ఎవరిని సూచిస్తుంది?
  choice: మనష్షేను, అతని ప్రజలను కలిపి సూచించే ‘వారు’ అని ఉంచడం
  alternative: ఈ బహువచనం ప్రజలను మాత్రమే సూచిస్తుందని స్పష్టీకరించడం
  rationale: హీబ్రూలో మనష్షే, అతని ప్రజలు అనే ఇద్దరు సంబోధితుల తరువాత బహువచన క్రియ వచ్చింది. ఇద్దరినీ కలిపి సూచించడం అత్యంత సహజమైన పఠనం; ‘వారు’ అనడం మూలంలోని నిర్మాణాన్ని అతివ్యాఖ్యానం లేకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సంక్షిప్తతను కాపాడుతూ, הִקְשִׁיבוּ లోని శ్రద్ధతో వినే భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టం చేశాం.
