source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/תֽוֹעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/002.yaml
  text: He did what was evil in the sight of Yahweh[a], according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: te
  text: అతడు యాహ్వే దృష్టిలో చెడ్డది చేశాడు; ఇశ్రాయేలు కుమారుల ముందు నుండి యాహ్వే వెళ్లగొట్టిన జనముల హేయకార్యాలకు అనుగుణంగా చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఇశ్రాయేలు కుమారులు” అనే మాటను మరింత సహజంగా “ఇశ్రాయేలీయులు” అని కూడా అనువదించవచ్చు. హీబ్రూ మూలంలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: అతడు ... చెడ్డదాన్ని చేశాడు
  rationale: వ్యవహార క్రమాన్ని తెలిపే וַיַּעַשׂకు సహజమైన తెలుగు భూతకాల రూపం వాడి, substantival הָרַעను ‘చెడ్డదాన్ని’గా అందించాం.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో
  rationale: ‘యెహోవా కళ్లలో’ అనే హీబ్రూ రూపకానికి అర్థాన్ని నిలిపే సహజమైన ఆధునిక తెలుగు నుడికారం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన tetragrammatonను బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరంగా పరిచితమైన లిప్యంతరీకరణతో అందించాం.
- source_word: כְּתוֹעֲבוֹת הַגּוֹיִם
  choice: జనాల హేయమైన ఆచారాలను అనుసరించాడు
  rationale: כְּ సూచించే అనురూపతను ‘అనుసరించాడు’తో సహజంగా వ్యక్తం చేశాం; תּוֹעֲבוֹתలోని బలమైన ఆరాధనా-నైతిక విరక్తిని ‘హేయమైన ఆచారాలు’ నిలుపుతుంది.
- source_word: הוֹרִישׁ
  choice: వెళ్లగొట్టిన
  rationale: ఈ సందర్భంలో హిఫిల్ ירשׁ భూమి నుండి నివాసులను తొలగించడం లేదా వెళ్లగొట్టడం అనే భావం ఇస్తుంది.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల ఎదుటనుండి
  rationale: מִפְּנֵי యొక్క స్థలసంబంధ భావాన్ని, בְּנֵי יִשְׂרָאֵלలోని పురుష-కుటుంబ రూపాన్ని దగ్గరగా నిలిపాం.
theological_decisions:
- issue: יְהוָה దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఖచ్చిత ఉచ్చారణపై అనిశ్చితి ఉన్నప్పటికీ తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ను ప్రధాన పాఠ్యంలో ఎంచుకున్నాం.
- issue: בְּנֵי יִשְׂרָאֵלలోని లింగ-కుటుంబ భాష
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని అక్షరార్థ పురుష-కుటుంబ వ్యక్తీకరణను నిలిపి, సహజమైన సామూహిక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: תּוֹעֲבוֹת యొక్క ఆరాధనా-నైతిక తీవ్రత
  choice: హేయమైన ఆచారాలు
  alternative: హేయకార్యాలు
  rationale: ఇక్కడ జనాల ప్రవర్తనా విధానాలను అనుసరించడం ఉద్దేశించబడినందున ‘ఆచారాలు’ సందర్భానికి సరిపోతుంది; ‘హేయమైన’ అనే పదం మూలంలోని తీవ్రమైన ప్రతికూల తీర్పును కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు స్పష్టమైన శైలి. మొదటి వాక్య భాగంలో హీబ్రూ మూలానికి దగ్గరైన నిర్మాణాన్ని, రెండవ భాగంలో సహజ తెలుగు కోసం క్రియాత్మక రూపాన్ని ఉపయోగించాం.
