  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ו/יכן אֶת מִזְבַּ֣ח יְהוָ֔ה וַ/יִּזְבַּ֣ח עָלָ֔י/ו זִבְחֵ֥י שְׁלָמִ֖ים וְ/תוֹדָ֑ה וַ/יֹּ֨אמֶר֙ לִֽ/יהוּדָ֔ה לַ/עֲב֕וֹד אֶת יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/016.yaml
  text: Then he restored the altar of Yahweh and sacrificed on it sacrifices of peace offerings and thanksgiving[a], and he told Judah to serve Yahweh[b], the God of Israel.
translation:
  language: te
  text: అప్పుడు అతడు యాహ్వే బలిపీఠాన్ని పునరుద్ధరించి, దానిమీద సమాధాన బలులను, కృతజ్ఞతా బలులను[a] అర్పించాడు. ఇశ్రాయేలు దేవుడైన యాహ్వేను సేవించమని యూదా ప్రజలకు చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కృతజ్ఞతను”; ఈ బలి సందర్భంలో “కృతజ్ఞతా బలులు” అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ו/יכן
  choice: పునరుద్ధరించి
  rationale: כון హిఫిల్ రూపం సాధారణంగా సిద్ధపరచడం లేదా స్థిరపరచడం అని అర్థమివ్వగలదు; అయితే ముందరి సందర్భంలో అపవిత్రమైన యెహోవా బలిపీఠాన్ని తిరిగి సక్రమ స్థితికి తెచ్చిన భావం ఉన్నందున ‘పునరుద్ధరించి’ సహజంగా, సందర్భోచితంగా ఉంది.
- source_word: מִזְבַּח יְהוָה
  choice: యెహోవా బలిపీఠాన్ని
  rationale: హీబ్రూ సమాస నిర్మాణాన్ని తెలుగులో సహజంగా ప్రతిబింబిస్తుంది; దేవుని నామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: וַ/יִּזְבַּח עָלָיו
  choice: దానిమీద ... అర్పించాడు
  rationale: זבח బలి అర్పించడాన్ని సూచిస్తుంది; ‘దానిమీద’ అన్నది ముందున్న బలిపీఠాన్నే స్పష్టంగా సూచిస్తుంది.
- source_word: זִבְחֵי שְׁלָמִים
  choice: సమాధాన బలులను
  rationale: שְׁלָמִים అనే నిర్దిష్ట బలి వర్గాన్ని సంప్రదాయబద్ధంగా, అర్థవంతంగా తెలియజేస్తుంది. హీబ్రూలోని זִבְחֵי భావం తెలుగులో ‘బలులు’ అనే పదంలోనే సహజంగా ఇమిడింది.
- source_word: וְ/תוֹדָה
  choice: కృతజ్ఞతార్పణలను
  rationale: תוֹדָהకు కృతజ్ఞత లేదా కృతజ్ఞతా బలి అనే అర్థాలు ఉన్నాయి. ఇక్కడ బలిపీఠం, బలి అర్పణ సందర్భం ఉన్నందున అర్పణాత్మక భావాన్ని స్పష్టంచేసే పదం ఎంచుకోబడింది; మూలంలోని సంక్షిప్తత వల్ల ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
- source_word: וַ/יֹּאמֶר לִ/יהוּדָה
  choice: యూదావారికి చెప్పాడు
  rationale: అక్షరార్థంగా ‘యూదాతో అన్నాడు’; ఇక్కడ ‘యూదా’ దేశ ప్రజలను సూచిస్తుంది కాబట్టి తెలుగులో ‘యూదావారికి చెప్పాడు’ సహజంగా ఉంది. ‘ఆజ్ఞాపించాడు’ అని అనువదించడం మూల క్రియకంటే బలమైన భావాన్ని చేర్చవచ్చు.
- source_word: לַ/עֲבוֹד
  choice: సేవించాలని
  rationale: עבד దేవునికి సంబంధించి సేవ, ఆరాధన రెండింటినీ కలిగి ఉండగలదు. ‘సేవించు’ విస్తృతమైన మూలార్థాన్ని నిలుపుతుంది; దాన్ని కేవలం ఆరాధనకే పరిమితం చేయదు.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల దేవుడు
  rationale: ‘ఇశ్రాయేలు దేవుడు’ అనే హీబ్రూ సమాస భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ఇక్కడ ఇశ్రాయేలు ప్రజాసమూహాన్ని సూచిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ప్రత్యేక ఒడంబడిక నామాన్ని సాధారణ బిరుదుగా మార్చకుండా తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంతో నిలిపింది. ‘యాహ్వే’ మూల ఉచ్చారణను సూచించే సాధారణ ప్రత్యామ్నాయం.
- issue: עבד యొక్క దైవసంబంధ భావపరిధి
  choice: సేవించు
  alternative: ఆరాధించు
  rationale: ఈ క్రియలో ఆరాధన అంతర్భాగమైనప్పటికీ, అది విధేయతతో కూడిన విస్తృత సేవను కూడా సూచించగలదు. అందువల్ల మూలంలోని భావపరిధిని కుదించకుండా ‘సేవించు’ ఎంచుకోబడింది.
- issue: שְׁלָמִים బలుల స్వభావం
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు
  rationale: హీబ్రూ పదం సంపూర్ణత, శాంతి, శ్రేయస్సు, సహవాసం వంటి అనుబంధాలను కలిగి ఉంది. ‘సమాధాన బలులు’ స్థిరమైన ప్రత్యక్ష సమానార్థకంగా ఉపయోగించబడింది; ఒకే సిద్ధాంతపరమైన వివరణను బలవంతంగా రుద్దలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే బైబిలు వచనానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని వరుస క్రియలను తెలుగులో రెండు వాక్యాలుగా విభజించి సహజ పఠనాన్ని సాధించాం. ‘యూదా’ను ప్రాంతం కంటే ప్రజలుగా స్పష్టంచేయడానికి ‘యూదావారు’ వాడాం.
