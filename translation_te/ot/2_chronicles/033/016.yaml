  terminology: Use ‘యాహ్వే’ consistently for יהוה, following the POB audit trail. Retain ‘సమాధాన బలులు’ for זִבְחֵי שְׁלָמִים and ‘సేవించమని’ for עבד. Render אֱלֹהֵי יִשְׂרָאֵל as ‘ఇశ్రాయేలు దేవుడు,’ not ‘ఇశ్రాయేలీయుల దేవుడు.’
