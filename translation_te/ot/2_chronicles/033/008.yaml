source:
  edition: WLC
  text: וְ/לֹ֣א אוֹסִ֗יף לְ/הָסִיר֙ אֶת רֶ֣גֶל יִשְׂרָאֵ֔ל מֵ/עַל֙ הָֽ/אֲדָמָ֔ה אֲשֶׁ֥ר הֶֽעֱמַ֖דְתִּי לַ/אֲבֹֽתֵי/כֶ֑ם רַ֣ק אִם יִשְׁמְר֣וּ לַ/עֲשׂ֗וֹת אֵ֚ת כָּל אֲשֶׁ֣ר צִוִּיתִ֔י/ם לְ/כָל הַ/תּוֹרָ֛ה וְ/הַֽ/חֻקִּ֥ים וְ/הַ/מִּשְׁפָּטִ֖ים בְּ/יַד מֹשֶֽׁה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/008.yaml
  text: And I will no longer remove the foot of Israel from upon the land that I appointed for your fathers[a], if only they are careful to do all that I commanded them[b], according to all the law and the statutes and the judgments given through Moses.
translation:
  language: te
  text: నేను మీ పితరుల కొరకు స్థిరపరచిన దేశం మీద నుండి ఇశ్రాయేలు పాదాన్ని ఇక తొలగించను[a]—వారు నేను వారికి ఆజ్ఞాపించినవన్నీ, మోషే ద్వారా ఇచ్చిన[b] ధర్మశాస్త్రమంతటినీ, కట్టడలనూ, న్యాయవిధులనూ జాగ్రత్తగా పాటిస్తేనే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఇశ్రాయేలు పాదాన్ని”; ఇది దేశంలో ఇశ్రాయేలు ఉనికిని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “మోషే చేతి ద్వారా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹסִיף לְהָסִיר
  choice: ఇక తొలగించను
  rationale: నిషేధార్థక יסף + הסיר నిర్మాణం ‘మళ్లీ/ఇక తొలగించను’ అనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘ఇక తొలగించను’ సహజంగా ఉంది.
- source_word: רֶגֶל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పాదాన్ని
  rationale: మూలంలోని స్పష్టమైన ‘ఇశ్రాయేలు పాదం’ అనే రూపకాన్ని నిలుపుతూ, అది దేశంలో ఇశ్రాయేలు ఉనికిని సూచిస్తుందని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: מֵעַל הָאֲדָמָה
  choice: దేశం మీద నుండి
  rationale: מֵעַל లోని ‘మీద నుండి’ భావాన్ని కాపాడుతూ, నిబంధనాపరమైన భూభాగ సందర్భంలో אֲדָמָהకు ‘దేశం’ అనేది సహజమైన ఎంపిక.
- source_word: אֲשֶׁר הֶעֱמַדְתִּי
  choice: స్థిరపరచిన
  rationale: עמד హిఫీల్ రూపంలోని ‘నిలబెట్టడం/స్థాపించడం’ భావాన్ని ‘స్థిరపరచిన’ ప్రతిబింబిస్తుంది; ఇది దేవుడు పితరుల కొరకు ఆ దేశాన్ని నిర్ణయించి నిలిపిన భావాన్ని అతిగా విపులీకరించదు.
- source_word: לַאֲבֹתֵיכֶם
  choice: మీ పితరుల కోసం
  rationale: ‘పితరులు’ నిబంధనాపరమైన కుటుంబ-చారిత్రక పదప్రయోగాన్ని నిలుపుతుంది; ל ఉపసర్గను సందర్భానుసారంగా ‘కోసం’గా వ్యక్తం చేసింది.
- source_word: רַק אִם
  choice: పాటిస్తేనే
  rationale: రַק אִם యొక్క బలమైన నియమార్థాన్ని తెలుగులో షరతు క్రియకు జోడించిన ‘-తేనే’ సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: יִשְׁמְרוּ לַעֲשׂוֹת
  choice: జాగ్రత్తగా పాటిస్తేనే
  rationale: ఈ నిర్మాణం కేవలం వినడం కాక శ్రద్ధతో ఆచరించడాన్ని సూచిస్తుంది; ‘జాగ్రత్తగా పాటించడం’ ఆ భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: כָּל אֲשֶׁר צִוִּיתִים
  choice: నేను తమకు ఆజ్ఞాపించినదంతా
  rationale: మూలంలోని సంపూర్ణతనూ, మూడవ పురుష బహువచన ప్రత్యయాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: לְכָל הַתּוֹרָה
  choice: ధర్మశాస్త్రమంతటినీ
  rationale: కట్టడలు, న్యాయవిధులతో కూడిన న్యాయ-నిబంధన సందర్భంలో תּוֹרָהకు ‘ధర్మశాస్త్రం’ స్పష్టమైన, ప్రాచుర్యంలో ఉన్న తెలుగు సమానార్థకం.
- source_word: הַחֻקִּים
  choice: కట్టడలను
  rationale: చట్టపరమైన חֻקִּיםను సమీపంలోని ఇతర న్యాయపదాలనుండి వేరుగా ఉంచే స్థిరమైన బైబిలు తెలుగు పదం.
- source_word: הַמִּשְׁפָּטִים
  choice: న్యాయవిధులను
  rationale: מִשְׁפָּטִיםలోని న్యాయపరమైన భావాన్ని ఆధునిక పాఠకునికి అర్థమయ్యేలా కాపాడుతుంది.
- source_word: בְּיַד מֹשֶׁה
  choice: మోషే ద్వారా ఇచ్చిన
  rationale: ‘మోషే చేతి ద్వారా’ అనే హీబ్రూ నుడికారంలోని మధ్యవర్తిత్వం/కర్తృత్వ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేశంలో ఇశ్రాయేలు కొనసాగి నివసించడానికి విధించబడిన షరతు
  choice: విధేయతను నిజమైన షరతుగా ‘పాటిస్తేనే’ అని అనువదించడం
  alternative: దేశాధికారాన్ని షరతులేని శాశ్వత హామీగా లేదా కేవలం అలంకారిక షరతుగా చూపడం
  rationale: רַק אִם మరియు יִשְׁמְרוּ לַעֲשׂוֹת దేశంలో కొనసాగడాన్ని విధేయతతో స్పష్టంగా ముడిపెడతాయి. ఈ వాక్యానికి మించిన విస్తృత నిబంధన సిద్ధాంతాన్ని అనువాదం నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని ‘ఇశ్రాయేలు పాదం’ రూపకాన్ని ప్రధాన పాఠ్యంలో ఉంచి పాదటిప్పణితో వివరణ ఇచ్చాం. బలమైన షరతును వాక్యాంతంలోని ‘పాటిస్తేనే’ ద్వారా సహజంగా ప్రతిబింబించాం.
