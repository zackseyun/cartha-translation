  text: וַ/יָּ֗שָׁב וַ/יִּ֨בֶן֙ אֶת הַ/בָּמ֔וֹת אֲשֶׁ֥ר נִתַּ֖ץ יְחִזְקִיָּ֣הוּ אָבִ֑י/ו וַ/יָּ֨קֶם מִזְבְּח֤וֹת לַ/בְּעָלִים֙ וַ/יַּ֣עַשׂ אֲשֵׁר֔וֹת וַ/יִּשְׁתַּ֨חוּ֙ לְ/כָל צְבָ֣א הַ/שָּׁמַ֔יִם וַֽ/יַּעֲבֹ֖ד אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/003.yaml
  text: For he rebuilt the high places that Hezekiah his father had torn down[a], and he set up altars to the Baals, and made Asherah poles[d][c][b], and bowed down to all the host of heaven and served them.
translation:
  language: te
  text: అతడు తన తండ్రియైన హిజ్కియా పడగొట్టిన ఉన్నత స్థలాలను మళ్లీ నిర్మించాడు[a]. బయలు దేవతలకు బలిపీఠాలను ఏర్పాటు చేశాడు[b]; అషేరా స్తంభాలను చేశాడు[c]. ఆకాశ సైన్యమంతటికీ వంగి నమస్కరించి, వాటిని సేవించాడు[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో అక్షరార్థంగా ‘తిరిగి నిర్మించాడు’ అనే రెండు క్రియలు ఉన్నాయి; ఇక్కడ ముందుగా తొలగించబడిన వాటిని పునర్నిర్మించాడనే భావం.
    reason: lexical_alternative
  - marker: b
    text: ‘బయలు దేవతలు’ అనే అనువాదం హీబ్రూలోని బహువచనాన్ని నిలుపుతుంది. ఇది బయలు దేవుని వివిధ స్థానిక రూపాలను లేదా ప్రతిమలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘అషేరాలు.’ ఈ హీబ్రూ పదం అషేరా దేవతతో సంబంధమున్న ఆరాధనా స్తంభాలను లేదా చిహ్నాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: ఇక్కడ ‘ఆకాశ సైన్యం’ అంటే ఆరాధనకు గురైన సూర్యచంద్ర నక్షత్రాలు వంటి ఖగోళ వస్తువులు; 2 రాజులు 21:3 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּבֶן
  choice: మళ్లీ నిర్మించాడు
  rationale: ‘తిరిగి నిర్మించాడు’ అనే రెండు క్రియల హీబ్రూ నిర్మాణం, తొలగించబడిన వాటిని పునర్నిర్మించాడనే భావాన్ని ఇస్తుంది. ‘మళ్లీ నిర్మించాడు’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: הַבָּמוֹת
  choice: ఉన్నత స్థలాలు
  rationale: במות అనేది ఎత్తైన ప్రదేశాల్లోని ఆరాధనా క్షేత్రాలకు వాడే నిర్దిష్ట మతపరమైన పదం. ‘ఉన్నత స్థలాలు’ దాని చారిత్రక-ఆరాధనా ప్రత్యేకతను నిలుపుతుంది.
- source_word: נִתַּץ
  choice: పడగొట్టిన
  rationale: ఈ క్రియ నిర్మాణాలను కూల్చడం లేదా ధ్వంసం చేయడాన్ని సూచిస్తుంది; సందర్భంలో ‘పడగొట్టిన’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: וַיָּקֶם מִזְבְּחוֹת לַבְּעָלִים
  choice: బయలులకు బలిపీఠాలను నిలబెట్టాడు
  rationale: הקים యొక్క ‘నిలబెట్టు/ఏర్పాటు చేయు’ భావాన్ని, అలాగే הבעלים లోని బహువచనాన్ని తెలుగులో నిలుపుతుంది.
- source_word: אֲשֵׁרוֹת
  choice: అషేరా స్తంభాలు
  rationale: ఈ పదం అషేరాతో సంబంధమున్న ఆరాధనా వస్తువులను సూచించగలదు. ‘స్తంభాలు’ సాధ్యమైన భౌతిక రూపాన్ని సామాన్య పాఠకునికి తెలియజేస్తుంది; అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: וַיִּשְׁתַּחוּ
  choice: సాష్టాంగ నమస్కారం చేసి
  rationale: మూల క్రియలోని వంగి లేదా నేలపై పడి నమస్కరించే భౌతిక చర్యను తెలియజేస్తుంది; తరువాతి ‘సేవించాడు’తో ఉన్న పదభేదాన్ని కూడా కాపాడుతుంది.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: ఆకాశ సైన్యమంతటికీ
  rationale: మూలంలోని సమష్టి రూపకాన్ని దగ్గరగా నిలుపుతుంది. ఈ సందర్భంలో అది ఆరాధించబడిన ఖగోళ వస్తువులను సూచిస్తుందని పాదసూచిక స్పష్టం చేస్తుంది.
- source_word: וַיַּעֲבֹד אֹתָם
  choice: వాటిని సేవించాడు
  rationale: ఆరాధనా సందర్భంలో עבד సేవ చేయడం ద్వారా ఆరాధించడాన్ని సూచిస్తుంది. ‘సేవించాడు’ ముందు క్రియతో ఉన్న మూలపద భేదాన్ని కాపాడుతుంది.
theological_decisions:
- issue: అన్య ఆరాధనకు సంబంధించిన నిర్దిష్ట పదాల అనువాదం
  choice: ‘ఉన్నత స్థలాలు,’ ‘బయలులు,’ ‘అషేరా స్తంభాలు’ అనే నిర్దిష్ట పదాలను నిలుపడం
  alternative: విగ్రహాలు లేదా అబద్ధ దేవుళ్లు వంటి సాధారణీకరించిన పదాలు
  rationale: వచనం అపనమ్మకాన్ని సాధారణంగా మాత్రమే చెప్పకుండా, నిర్దిష్ట ఆరాధనా రూపాలను జాబితా చేస్తుంది. అందువల్ల మూలంలోని చారిత్రక, మతపరమైన వివరాలను నిలిపాం.
- issue: ‘ఆకాశ సైన్యం’ ఎవరిని లేదా దేనిని సూచిస్తుంది
  choice: ఈ సందర్భంలో ఆరాధనకు గురైన ఖగోళ వస్తువుల సమూహంగా గ్రహించడం
  alternative: దేవదూతల సమూహంగా గ్రహించడం
  rationale: బయలులు, అషేరా వస్తువులతో కూడిన నిషిద్ధ ఆరాధన జాబితాలో ఈ పదబంధం సూర్యచంద్ర నక్షత్రాదులను సూచించడం సందర్భానికి సరిపోతుంది; అయినప్పటికీ ప్రధాన పాఠ్యంలో మూల రూపకాన్ని నిలిపి, వివరణను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ఉన్నత స్థలాలు,’ ‘బయలులు,’ ‘అషేరా’ వంటి చారిత్రక ఆరాధనా పదాలను సాధారణీకరించకుండా నిలిపాం. హీబ్రూ మూలంలో స్పష్టమైన కారణసూచక అవ్యయం లేనందున ఆంగ్లంలోని ‘For’ ను ప్రధాన పాఠ్యంలో చేర్చలేదు.
