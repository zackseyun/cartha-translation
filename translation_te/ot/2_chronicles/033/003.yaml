  to: అతడు తన తండ్రియైన హిజ్కియా పడగొట్టిన ఉన్నత స్థలాలను మళ్లీ నిర్మించాడు[a]. బయలు దేవతలకు బలిపీఠాలను ఏర్పాటు చేశాడు[b]; అషేరా స్తంభాలను చేశాడు[c]. ఆకాశ సైన్యమంతటికీ వంగి నమస్కరించి, వాటిని సేవించాడు[d].
