id: 2CH.33.23
reference: 2 Chronicles 33:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹ֤א נִכְנַע֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה כְּ/הִכָּנַ֖ע מְנַשֶּׁ֣ה אָבִ֑י/ו כִּ֛י ה֥וּא אָמ֖וֹן הִרְבָּ֥ה אַשְׁמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/023.yaml
  text: But he did not humble himself before Yahweh as his father Manasseh humbled himself[a], for he, Amon, increased guilt.
translation:
  language: te
  text: అతడు తన తండ్రి మనష్షే తనను తాను తగ్గించుకున్నట్లుగా యాహ్వే సన్నిధిలో తనను తాను తగ్గించుకోలేదు; ఎందుకంటే అతడైన ఆమోను తన అపరాధాన్ని మరింత పెంచుకున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִכְנַע / כְּהִכָּנַע
  choice: తనను తాను తగ్గించుకోలేదు / తనను తాను తగ్గించుకున్నట్లు
  rationale: כנע యొక్క నిఫాల్ రూపం ఈ పశ్చాత్తాప సందర్భంలో దేవుని ఎదుట తనను తాను తగ్గించుకోవడం లేదా లోబడడం అనే భావాన్ని ఇస్తుంది. రెండు చోట్ల ఒకే పదబంధాన్ని వాడడం ఆమోను–మనష్షే మధ్య ఉన్న ఉద్దేశపూర్వక వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: מִלִּפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: లִפְנֵי అనే నుడికారం ‘ఎదుట/సన్నిధిలో’ అనే భావాన్ని ఇస్తుంది; ‘సన్నిధిలో’ ఆధునిక తెలుగులో సహజంగా ఉండి దేవుని సమక్షాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מְנַשֶּׁה אָבִיו
  choice: తన తండ్రి మనష్షే
  rationale: సంబంధాన్ని స్పష్టంగా, సహజమైన తెలుగు పదక్రమంలో తెలియజేస్తుంది.
- source_word: כִּי הוּא אָמוֹן
  choice: పైగా, ఆమోను అయిన అతడు
  rationale: כִּי ఇక్కడ ముందటి వాక్యానికి కేవలం కారణం చెప్పడం కంటే ఆమోను ప్రవర్తనను బలంగా కొనసాగించి వివరించగలదు. హీబ్రూలోని సర్వనామం–పేరు ఉద్ఘాటనను ‘ఆమోను అయిన అతడు’ నిలుపుతుంది.
- source_word: הִרְבָּה אַשְׁמָה
  choice: తన అపరాధాన్ని మరింత పెంచుకున్నాడు
  rationale: הִרְבָּה పరిమాణం పెరగడాన్ని సూచిస్తుంది; אַשְׁמָה ఇక్కడ బలి కాదు, నైతిక దోషం లేదా అపరాధం. తెలుగు వాక్యంలో కర్తకు సంబంధించిన అపరాధమని సహజంగా చెప్పడానికి ‘తన’ చేర్చబడింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- issue: ఆమోను అపరాధం ‘పెంచడం’ అనే భావం
  choice: తన అపరాధాన్ని మరింత పెంచుకున్నాడు
  alternative: మరింత అపరాధం చేశాడు
  rationale: మూలంలోని הִרְבָּה אַשְׁמָה అనే అసాధారణమైన కానీ బలమైన పదబంధాన్ని పూర్తిగా సాఫీ చేసి దాని నైతిక తీవ్రతను తగ్గించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే రాజుల గ్రంథవివరణకు తగిన గంభీరతతో రూపొందించబడింది. ‘తనను తాను తగ్గించుకోవడం’ పశ్చాత్తాపం మరియు దేవునికి లోబడడం రెండింటినీ అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
