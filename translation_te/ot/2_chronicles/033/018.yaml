source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֣י מְנַשֶּׁה֮ וּ/תְפִלָּת֣/וֹ אֶל אֱלֹהָי/ו֒ וְ/דִבְרֵי֙ הַֽ/חֹזִ֔ים הַֽ/מְדַבְּרִ֣ים אֵלָ֔י/ו בְּ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל הִנָּ֕/ם עַל דִּבְרֵ֖י מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/018.yaml
  text: The rest of the acts of Manasseh[a], and his prayer to his God, and the words of the seers who spoke to him in the name of Yahweh, the God of Israel—behold, they are written among the records of the kings of Israel.
translation:
  language: te
  text: మనష్షే యొక్క మిగిలిన కార్యాలు, అతడు తన దేవునికి చేసిన ప్రార్థన, ఇశ్రాయేలు దేవుడైన యాహ్వే నామంలో అతనితో మాట్లాడిన దర్శకుల మాటలు—ఇవన్నీ ఇశ్రాయేలు రాజుల వృత్తాంతాలలో రాసి ఉన్నాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలు రాజుల గ్రంథంలో” లేదా “ఇశ్రాయేలు రాజుల వార్షిక వృత్తాంతాలలో.” హీబ్రూ భాషలోని ఈ సూచన సూత్రం లిఖిత రాజవృత్తాంత మూలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי מְנַשֶּׁה
  choice: మనష్షే చేసిన మిగతా కార్యాలు
  rationale: రాజవంశ చరిత్రల ముగింపు సూత్రంలో דִּבְרֵי అనేది కేవలం పలికిన మాటలను కాక, రాజు చేసిన పనులు మరియు అతని పాలనలోని సంఘటనలను సూచిస్తుంది.
- source_word: תְפִלָּתוֹ אֶל אֱלֹהָיו
  choice: అతడు తన దేవునికి చేసిన ప్రార్థన
  rationale: ప్రార్థన మరియు దేవుడు రెండింటికీ సంబంధించిన వ్యక్తిగత సూచనను నిలుపుతూ, אֶל యొక్క దిశార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַחֹזִים
  choice: దీర్ఘదర్శులు
  rationale: ఇది సాధారణంగా ప్రవక్తలు అనే విస్తృత పదం కాక, దర్శనం పొందేవారిని సూచించే ప్రత్యేక ప్రవచన బిరుదు; అందువల్ల మూలంలోని ప్రత్యేకతను నిలుపుతుంది.
- source_word: בְּשֵׁם יְהוָה
  choice: యెహోవా పేరట
  rationale: దైవనామాన్ని వ్యక్తినామంగా నిలుపుతూ, ఆయన అధికారంతో మాట్లాడారనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הִנָּם עַל דִּבְרֵי מַלְכֵי יִשְׂרָאֵל
  choice: ఇవన్నీ ఇశ్రాయేలు రాజుల వృత్తాంతాలలో రాసి ఉన్నాయి
  rationale: హీబ్రూ సూచన సూత్రం లిఖిత రాజవృత్తాంత మూలాన్ని సూచిస్తుంది. הִנָּם యొక్క దృష్టి ఆకర్షణను 'ఇవన్నీ' ద్వారా సహజంగా ప్రతిబింబించి, తెలుగులో అవసరమైన 'రాసి ఉన్నాయి'ను స్పష్టం చేసింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా నిలుపుతుంది; తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపం 'యెహోవా'.
- issue: మూలగ్రంథ సూచనలోని 'ఇశ్రాయేలు రాజులు'
  choice: ఇశ్రాయేలు రాజులు
  alternative: యూదా రాజులు
  rationale: మనష్షే యూదా రాజు అయినప్పటికీ మసొరేటిక్ పాఠం 'ఇశ్రాయేలు' అని చెబుతుంది; ఊహాత్మక సమన్వయం చేయకుండా మూలపాఠాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక శైలి. వరుసగా ఉన్న అంశాలను స్పష్టంగా కూర్చి, మూలంలోని ప్రత్యేక ప్రవచన బిరుదు మరియు దైవనామాన్ని నిలిపాం.
