- from: అతడు హిన్నోము కుమారుని లోయలో తన కుమారులను అగ్నిగుండా దాటించాడు[a]. శకునాలు చూశాడు, జోస్యం చెప్పాడు, మంత్రవిద్య ఆచరించాడు; మృతుల ఆత్మలను సంప్రదించేవారితోనూ, ఆత్మలతో సంభాషించేవారితోనూ వ్యవహరించాడు[b]. అతడు యాహ్వే దృష్టిలో చెడ్డది చేయడాన్ని మరింతగా పెంచి, ఆయనకు కోపం పుట్టించాడు.
  to: అతడు హిన్నోము కుమారుని లోయలో తన కుమారులను అగ్ని గుండా దాటించాడు[a]. శకునాలు చూశాడు, జోస్యం చెప్పాడు, మంత్రవిద్య ఆచరించాడు; మృతాత్మలను సంప్రదించే వారితోను, ఆత్మవాదులతోను వ్యవహరించాడు[b]. అతడు యాహ్వే దృష్టిలో చెడును చేయడంలో మరింతగా మితిమీరిపోయి, ఆయనకు కోపం పుట్టించాడు.
  rationale: 'The revision makes two limited improvements: it replaces an unnatural literal calque in the final clause with idiomatic Telugu that still communicates excessive, intensified evil-doing, and it streamlines the difficult terms אוֹב and יִדְּעוֹנִי without forcing a narrower interpretation than the Hebrew permits. Footnote markers and their referents are retained.'
