  text: וְ/הוּא֩ הֶעֱבִ֨יר אֶת בָּנָ֤י/ו בָּ/אֵשׁ֙ בְּ/גֵ֣י בֶן הִנֹּ֔ם וְ/עוֹנֵ֤ן וְ/נִחֵשׁ֙ וְֽ/כִשֵּׁ֔ף וְ/עָ֥שָׂה א֖וֹב וְ/יִדְּעוֹנִ֑י הִרְבָּ֗ה לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/006.yaml
  text: He made his sons pass through the fire in the Valley of the Son of Hinnom[a], practiced soothsaying and divination and sorcery, and dealt with mediums and spiritists. He multiplied doing what was evil in the eyes of Yahweh[b], provoking him to anger.
translation:
  language: te
  text: అతడు హిన్నోము కుమారుని లోయలో తన కుమారులను అగ్ని గుండా దాటించాడు[a]. శకునాలు చూశాడు, జోస్యం చెప్పాడు, మంత్రవిద్య ఆచరించాడు; మృతాత్మలను సంప్రదించే వారితోను, ఆత్మవాదులతోను వ్యవహరించాడు[b]. అతడు యాహ్వే దృష్టిలో చెడును చేయడంలో మరింతగా మితిమీరిపోయి, ఆయనకు కోపం పుట్టించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత స్పష్టంగా, ‘తన కుమారులను అగ్నిలో బలిగా అర్పించాడు.’ హెబ్రీయ ప్రయోగానికి అక్షరార్థం, ‘తన కుమారులను అగ్ని గుండా దాటించాడు.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ వాడిన హెబ్రీయ పదాలు మృతులను లేదా ఆత్మలను సంప్రదించే ఆచారాలతో సంబంధమున్న వ్యక్తులను సూచిస్తాయి.
    reason: cultural_note
lexical_decisions:
- source_word: הֶעֱבִיר אֶת־בָּנָיו בָּאֵשׁ
  choice: తన కుమారులను అగ్నిగుండా దాటించాడు
  rationale: హిఫీల్ రూపంలోని హెబ్రీయ ప్రయోగాన్ని ప్రధాన పాఠ్యంలో నిలిపి ఉంచుతుంది. సందర్భంలో ఇది కుమారులను అగ్నిలో బలిగా అర్పించే ఆచారాన్ని సూచించినా, దానిని పాఠ్యంలోనే మరీ స్పష్టీకరించకుండా నిజమైన ప్రయోగాన్ని కాపాడుతుంది.
- source_word: בְּגֵי בֶן־הִנֹּם
  choice: హిన్నోము కుమారుని లోయలో
  rationale: స్థలనామంలోని హెబ్రీయ అర్థాన్ని పారదర్శకంగా అందిస్తూ ‘హిన్నోము’ అనే పేరును లిప్యంతరీకరిస్తుంది.
- source_word: וְעוֹנֵן
  choice: శకునాలు చూశాడు
  rationale: శకునాలు లేదా సూచనల ఆధారంగా ఫలితాలు చెప్పే ఆచారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; తరువాతి నחשׁ పదంతో కొంత భేదాన్ని నిలుపుతుంది.
- source_word: וְנִחֵשׁ
  choice: జోస్యం చెప్పాడు
  rationale: దివ్యజ్ఞానం లేదా సూచనల ద్వారా గూఢవిషయాలను తెలుసుకొనే ఆచారాన్ని సాధారణ పాఠకులకు అర్థమయ్యే రీతిలో తెలియజేస్తుంది.
- source_word: וְכִשֵּׁף
  choice: మంత్రవిద్య ఆచరించాడు
  rationale: మంత్రాలు, మాయాచర్యాలు చేసే భావాన్ని గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וְעָשָׂה אוֹב וְיִדְּעוֹנִי
  choice: మృతుల ఆత్మలను సంప్రదించేవారితోనూ, ఆత్మలతో సంభాషించేవారితోనూ వ్యవహరించాడు
  rationale: ‘చేశాడు’ అనే హెబ్రీయ నిర్మాణం ఇక్కడ అస్పష్టంగా ఉంది. వ్యక్తులను నియమించాడా, సంప్రదించాడా, తానే ఆచరించాడా అని అతిగా నిర్ధారించకుండా ‘వ్యవహరించాడు’ అనే విస్తృత పదాన్ని ఉపయోగించి, రెండు పదాల ఆత్మసంబంధ నేపథ్యాన్ని స్పష్టం చేస్తుంది.
- source_word: הִרְבָּה לַעֲשׂוֹת
  choice: చేయడాన్ని మరింతగా పెంచి
  rationale: רבה హిఫీల్ రూపం మరియు క్రియానామ నిర్మాణంలో ఉన్న అధికతను నిలుపుతుంది; కేవలం ‘చాలా చెడు చేశాడు’ అని సున్నితపరచదు.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: యాహ్వే దృష్టిలో చెడ్డది
  rationale: హెబ్రీయ మూల్యాంకన ప్రయోగాన్ని సహజమైన తెలుగులో దగ్గరగా ప్రతిబింబిస్తూ, దైవనామాన్ని ‘యాహ్వే’గా అందిస్తుంది.
- source_word: לְהַכְעִיסוֹ
  choice: ఆయనకు కోపం పుట్టించాడు
  rationale: కారణార్థక భావాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; ఉద్దేశం లేదా ఫలితం రెండింటిలో ఏదో ఒకదానిని అనవసరంగా ఖరారు చేయదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠ్యంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో మార్చకుండా తెలుగులో లిప్యంతరీకరించింది.
- issue: కుమారులను అగ్నిగుండా దాటించడం బలియర్పణ అని ప్రధాన పాఠ్యంలో స్పష్టీకరించాలా
  choice: హెబ్రీయ ప్రయోగాన్ని ‘అగ్నిగుండా దాటించాడు’గా నిలుపడం
  alternative: తన కుమారులను అగ్నిలో బలిగా అర్పించాడు
  rationale: సందర్భం బాలబలిని బలంగా సూచించినా, మూలంలోని రూపక ప్రయోగాన్ని ప్రధాన పాఠ్యంలో ఉంచి, స్పష్టమైన వ్యాఖ్యానాన్ని పాదటిప్పణికి పరిమితం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గూఢాచారాలకు సంబంధించిన పదాలను అతిగా ప్రాచీనమైన లేదా నిర్దిష్ట మతశాఖకు చెందిన పదజాలంతో కాకుండా సాధారణ పాఠకులకు అర్థమయ్యేలా అనువదించాం. మూలంలోని అస్పష్టతను అవసరమైన చోట పాదటిప్పణులతో కాపాడాం.
