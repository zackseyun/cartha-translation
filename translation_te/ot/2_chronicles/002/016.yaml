source:
  edition: WLC
  text: וַ/יִּסְפֹּ֣ר שְׁלֹמֹ֗ה כָּל הָ/אֲנָשִׁ֤ים הַ/גֵּירִים֙ אֲשֶׁר֙ בְּ/אֶ֣רֶץ יִשְׂרָאֵ֔ל אַחֲרֵ֣י הַ/סְּפָ֔ר אֲשֶׁ֥ר סְפָרָ֖/ם דָּוִ֣יד אָבִ֑י/ו וַ/יִּמָּצְא֗וּ מֵאָ֤ה וַ/חֲמִשִּׁים֙ אֶ֔לֶף וּ/שְׁלֹ֥שֶׁת אֲלָפִ֖ים וְ/שֵׁ֥שׁ מֵאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/016.yaml
  text: Then Solomon counted all the resident foreigners who were in the land of Israel[a], after the census that David his father had taken of them, and they were found to be one hundred fifty-three thousand six hundred.
translation:
  language: te
  text: అప్పుడు సొలొమోను ఇశ్రాయేలు దేశంలో నివసిస్తున్న పరదేశులందరినీ[a] లెక్కించాడు. తన తండ్రి దావీదు వారిని లెక్కించిన తర్వాత, వారి సంఖ్య లక్షా యాభైమూడు వేల ఆరువందల మంది అని తేలింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తాత్కాలిక నివాసులు’ లేదా ‘నివాస పరదేశులు.’ ఈ హీబ్రూ పదం ఇశ్రాయేలీయుల ప్రాంతంలో నివసిస్తున్న ఇశ్రాయేలీయేతరులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְפֹּר
  choice: లెక్కించాడు
  rationale: ఇక్కడ ספר అనే క్రియ వ్యక్తులను లెక్కించడాన్ని సూచిస్తుంది. ‘లెక్కించాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, తరువాత ప్రస్తావించబడే మునుపటి లెక్కతో అనుసంధానమవుతుంది.
- source_word: הָאֲנָשִׁים הַגֵּירִים
  choice: నివసిస్తున్న పరదేశులందరినీ
  rationale: גֵּרִים అనేది కేవలం ప్రయాణికులను కాక, ఇశ్రాయేలు ప్రాంతంలో స్థిరంగా నివసించే ఇశ్రాయేలీయేతరులను సూచిస్తుంది. ‘నివసిస్తున్న పరదేశులు’ ఆ సామాజిక స్థితిని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּאֶרֶץ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేశంలో
  rationale: אֶרֶץ లోని ప్రాదేశిక భావాన్ని నిలుపుతూ, తెలుగులో సహజమైన పదబంధాన్ని ఉపయోగిస్తుంది.
- source_word: אַחֲרֵי הַסְּפָר
  choice: అంతకుముందు ... లెక్కించిన ప్రకారం
  rationale: హీబ్రూ పదబంధం పూర్వపు లెక్కింపు తరువాత అని గానీ, ఆ లెక్క ప్రకారం అని గానీ అర్థమయ్యే స్వల్ప సందిగ్ధతను కలిగి ఉంది. సందర్భంలో పూర్వపు లెక్కను ఆధారంగా చేసుకున్న భావం సహజంగా ఉండడంతో ‘లెక్కించిన ప్రకారం’ అని ఇచ్చి, కాలపూర్వత్వాన్ని ‘అంతకుముందు’తో తెలిపాం.
- source_word: אֲשֶׁר סְפָרָם דָּוִיד אָבִיו
  choice: అతని తండ్రి దావీదు అంతకుముందు వారిని లెక్కించిన
  rationale: దావీదు సొలొమోను తండ్రి అని స్పష్టంగా తెలియజేస్తూ, క్రియను పునరుక్తి సహజంగా ఉండే విధంగా ‘లెక్కించిన’ అని అనువదించాం.
- source_word: וַיִּמָּצְאוּ
  choice: అని తేలింది
  rationale: నిఫాల్ రూపంలోని ఫలితాత్మక, కర్మణి భావాన్ని తెలుగులో సహజమైన ‘అని తేలింది’ ద్వారా వ్యక్తం చేస్తుంది.
- source_word: מֵאָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: లక్షా యాభైమూడు వేల ఆరువందల మంది
  rationale: 153,600 అనే ఖచ్చితమైన మొత్తాన్ని తెలుగు సంఖ్యా పద్ధతిలో చదవడానికి సహజంగా పదాలతో ఇచ్చాం; వ్యక్తుల సంఖ్య కాబట్టి ‘మంది’ చేర్చాం.
