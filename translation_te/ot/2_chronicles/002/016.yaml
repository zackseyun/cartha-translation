translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలిని అనుసరించాం. మూలంలోని రెండు ప్రధాన వాక్యభాగాలను తెలుగులో సహజంగా చదవడానికి రెండు వాక్యాలుగా విభజించాం; సంఖ్యను తెలుగు సంఖ్యా వ్యవహారానికి అనుగుణంగా ఇచ్చాం.
