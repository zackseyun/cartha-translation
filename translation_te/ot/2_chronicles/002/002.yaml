source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח שְׁלֹמֹ֔ה אֶל חוּרָ֥ם מֶֽלֶךְ צֹ֖ר לֵ/אמֹ֑ר כַּ/אֲשֶׁ֤ר עָשִׂ֨יתָ֙ עִם דָּוִ֣יד אָבִ֔/י וַ/תִּֽשְׁלַֽח ל֣/וֹ אֲרָזִ֔ים לִ/בְנֽוֹת ל֥/וֹ בַ֖יִת לָ/שֶׁ֥בֶת בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/002.yaml
  text: Then Solomon sent to Huram king of Tyre[a], saying, “As you dealt with David my father and sent him cedars to build himself a house to dwell in, so do with me.”
translation:
  language: te
  text: 'అప్పుడు సొలొమోను తూరు రాజైన హూరాముకు[a] ఇలా కబురు పంపించాడు: “నా తండ్రి దావీదుతో నీవు వ్యవహరించి, అతడు నివసించడానికి ఒక ఇల్లు కట్టుకునేలా అతనికి దేవదారు కలపను పంపించినట్లుగా—[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ హెబ్రీలో పేరు ‘హూరాము’ రూపంలో ఉంది; రాజుల గ్రంథంలోని సమాంతర వృత్తాంతంలో సాధారణంగా ‘హీరాము’ రూపం కనిపిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: ఈ వాక్యం హెబ్రీ పాఠ్యంలో ఇక్కడ పూర్తికాకుండా తదుపరి వచనంలో కొనసాగుతుంది.
    reason: source_syntax
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: అప్పుడు ... కబురు పంపించాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగులో ‘అప్పుడు’ ఆ క్రమభావాన్ని సహజంగా తెలియజేస్తుంది; రాజుకు పంపినది సందేశమని సందర్భం స్పష్టం చేస్తుంది.
- source_word: חוּרָם
  choice: హూరాము
  rationale: దినవృత్తాంతాల గ్రంథంలోని హెబ్రీ నామరూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; రాజుల గ్రంథంలో కనిపించే ‘హీరాము’ రూపాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: מֶלֶךְ צֹר
  choice: తూరు రాజు
  rationale: హెబ్రీ సమాస నిర్మాణాన్ని సహజమైన తెలుగు బిరుదు-ప్రదేశ నామ క్రమంలో అందిస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేయడానికి ‘ఇలా’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: עָשִׂיתָ עִם דָּוִיד אָבִי
  choice: నా తండ్రి దావీదుతో నీవు వ్యవహరించి
  rationale: עשה עם అనే విస్తృత ప్రయోగాన్ని ఒక నిర్దిష్ట సహాయార్థానికి పరిమితం చేయకుండా ‘వ్యవహరించి’గా నిలుపుతుంది; తరువాతి ఉపవాక్యం ఆ వ్యవహారాన్ని వివరిస్తుంది.
- source_word: וַתִּשְׁלַח לוֹ אֲרָזִים
  choice: అతనికి దేవదారు కలపను పంపించి
  rationale: నిర్మాణ సందర్భంలో אֲרָזִים దేవదారు నిర్మాణ సామగ్రిని సూచిస్తుంది. ‘దేవదారు చెట్లు’ అని జీవ చెట్ల భావం కలిగించకుండా, ‘కలప’ సహజమైన తెలుగు పదప్రయోగం.
- source_word: לִבְנוֹת לוֹ בַיִת לָשֶׁבֶת בּוֹ
  choice: అతడు నివసించడానికి ఒక ఇల్లు కట్టుకునేలా
  rationale: నిర్మాణ ఉద్దేశాన్నీ, ఆ ఇల్లు దావీదు స్వయంగా నివసించడానికి అన్న లబ్ధిదారు భావాన్నీ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: כַּאֲשֶׁר ... לָשֶׁבֶת בּוֹ
  choice: '... పంపించినట్లుగా—'
  rationale: כַּאֲשֶׁר ప్రారంభించిన పోలిక ఈ వచనాంతంలో పూర్తి కాకుండా తదుపరి వచనంలో కొనసాగుతుంది. మూలంలో లేని ‘నాకూ అలాగే చేయి’ అనే వాక్యాన్ని చేర్చకుండా దీర్ఘ విరామచిహ్నంతో అసంపూర్ణ నిర్మాణాన్ని నిలుపుతుంది.
theological_decisions:
- issue: వచనాంతంలోని అసంపూర్ణ పోలిక
  choice: మూలంలోని ఆధార వాక్యం తదుపరి వచనానికి కొనసాగుతున్నట్లు దీర్ఘ విరామచిహ్నంతో ఉంచడం
  alternative: ‘నాకూ అలాగే చేయి’ అని అంతర్నిహిత భావాన్ని ప్రధాన పాఠ్యంలో చేర్చడం
  rationale: హెబ్రీ పాఠ్యంలో ఆ అదనపు ఆజ్ఞ లేదు. వచన విభజన వల్ల కలిగే అసౌకర్యాన్ని తొలగించేందుకు మూలంలో లేని మాటలను చేర్చడం కంటే, దాని వాక్య నిర్మాణాన్ని నిజాయితీగా నిలపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘కబురు పంపించాడు’ సాధారణ పాఠకులకు సహజంగా ఉండగా, ‘వ్యవహరించి’ మూలంలోని విస్తృత భావాన్ని కాపాడుతుంది. వచనాంతపు దీర్ఘ విరామచిహ్నం మూల వాక్యపు కొనసాగింపును సూచిస్తుంది.
