translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మందిరం’ సందర్భార్థాన్ని స్పష్టం చేస్తుండగా, హీబ్రూ అక్షరార్థమైన ‘ఇల్లు’ పాదసూచికలో భద్రపరచబడింది. చివరి రెండు హీబ్రూ పదాలు పరిమాణం, వైభవం, అసాధారణత అనే పరస్పర మిళిత భావాలను కలిగినందున ప్రత్యామ్నాయ పఠనాన్ని కూడా సూచించాం.
