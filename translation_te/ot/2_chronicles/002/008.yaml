source:
  edition: WLC
  text: וּ/לְ/הָכִ֥ין לִ֛/י עֵצִ֖ים לָ/רֹ֑ב כִּ֥י הַ/בַּ֛יִת אֲשֶׁר אֲנִ֥י בוֹנֶ֖ה גָּד֥וֹל וְ/הַפְלֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/008.yaml
  text: and to prepare for me timber in abundance[b][a], for the house that I am building will be great and wonderful.
translation:
  language: te
  text: నా కోసం సమృద్ధిగా కలపను సిద్ధం చేయడానికి, ఎందుకంటే నేను కడుతున్న మందిరం[a] గొప్పదిగాను అద్భుతమైనదిగాను ఉంటుంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఇల్లు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘గొప్పదిగాను ఆశ్చర్యకరమైనదిగాను ఉంటుంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהָכִין
  choice: సిద్ధం చేయడానికి
  rationale: సంయోజక అవ్యయంతో కూడిన క్రియార్థక రూపం ముందటి వాక్యంలోని అభ్యర్థనను కొనసాగిస్తూ ఉద్దేశాన్ని తెలియజేస్తుంది.
- source_word: לִי
  choice: నాకోసం
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయం ప్రయోజనార్థాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘నాకోసం’ సహజంగా ఉంది.
- source_word: עֵצִים
  choice: కలపను
  rationale: నిర్మాణ సందర్భంలో సాధారణ ‘చెక్క’ కంటే భవన నిర్మాణానికి ఉపయోగించే దారువును ‘కలప’ స్పష్టంగా సూచిస్తుంది.
- source_word: לָרֹב
  choice: సమృద్ధిగా
  rationale: అధిక పరిమాణాన్ని సహజమైన, సంక్షిప్త తెలుగు రూపంలో వ్యక్తపరుస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: అభ్యర్థనకు కారణాన్ని పరిచయం చేసే హేత్వర్థక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הַבַּיִת
  choice: మందిరం
  rationale: హీబ్రూ పదానికి అక్షరార్థం ‘ఇల్లు’ అయినా, ఈ సందర్భంలో దేవాలయమే ఉద్దేశితం; సాధారణ తెలుగు పాఠకునికి ‘మందిరం’ సహజంగా, స్పష్టంగా ఉంటుంది. అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֲשֶׁר אֲנִי בוֹנֶה
  choice: నేను కడుతున్న
  rationale: కృదంత రూపంలోని కొనసాగుతున్న లేదా సమీప భవిష్యత్తు నిర్మాణ భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: גָּדוֹל
  choice: గొప్పదిగా
  rationale: పరిమాణంతో పాటు వైభవాన్నీ సూచించే మూలపద విస్తృతిని నిలుపుతుంది.
- source_word: וְהַפְלֵא
  choice: అద్భుతమైనదిగా
  rationale: פלא మూలంలోని అసాధారణత, ఆశ్చర్యకరమైన వైభవం అనే భావాలను ప్రతిబింబిస్తుంది.
