source:
  edition: WLC
  text: וְ/הִנֵּ֣ה לַֽ/חֹטְבִ֣ים לְֽ/כֹרְתֵ֣י הָ/עֵצִ֡ים נָתַתִּי֩ חִטִּ֨ים מַכּ֜וֹת לַ/עֲבָדֶ֗י/ךָ כֹּרִים֙ עֶשְׂרִ֣ים אֶ֔לֶף וּ/שְׂעֹרִ֕ים כֹּרִ֖ים עֶשְׂרִ֣ים אָ֑לֶף וְ/יַ֗יִן בַּתִּים֙ עֶשְׂרִ֣ים אֶ֔לֶף וְ/שֶׁ֕מֶן בַּתִּ֖ים עֶשְׂרִ֥ים אָֽלֶף׀׀׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/009.yaml
  text: And behold[a], for the woodcutters, the cutters of the trees, I have given to your servants twenty thousand kors of crushed wheat, and twenty thousand kors of barley, and twenty thousand baths of wine[c][b], and twenty thousand baths of oil.
translation:
  language: te
  text: ఇదిగో, చెట్లను నరికే కలప నరికేవారైన మీ సేవకులకు నేను ఇరవై వేల కోర్ల దంచిన గోధుమలు[a][b], ఇరవై వేల కోర్ల యవలు, ఇరవై వేల బాత్‌ల ద్రాక్షామద్యం[c], ఇరవై వేల బాత్‌ల నూనె ఇచ్చాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దంచిన గోధుమలు” అనే హీబ్రూ పదబంధం అసాధారణమైనది; దీనిని “ఆహారంగా గోధుమలు” లేదా “కొట్టిన గోధుమలు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: కోరు అనేది ప్రాచీన కాలపు ఘన పదార్థాల కొలమానం.
    reason: cultural_note
  - marker: c
    text: బాత్ అనేది ప్రాచీన కాలపు ద్రవ పదార్థాల కొలమానం.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హీబ్రూ పదంలోని శ్రద్ధ ఆకర్షించే, వాక్యాన్ని ముందుకు నడిపించే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לַחֹטְבִים לְכֹרְתֵי הָעֵצִים
  choice: చెట్లు నరికే మీ సేవకులైన కలప నరికేవారికి
  rationale: మూలంలోని రెండు సమీపార్థక కృదంత పదబంధాల భావాన్ని పూర్తిగా కాపాడుతూ, తెలుగులో అసహజమైన పునరుక్తి రాకుండా వాటి అన్వయాన్ని స్పష్టం చేస్తుంది.
- source_word: נָתַתִּי
  choice: నేను ... ఇస్తాను
  rationale: పత్రంలోని వాగ్దానం లేదా కేటాయింపు సందర్భంలో హీబ్రూ పరిపూర్ణ క్రియ భవిష్యత్తులో అమలయ్యే స్థిర నిబద్ధతను సూచిస్తుంది; తెలుగులో 'ఇస్తాను' సహజంగా ఆ భావాన్ని వ్యక్తపరుస్తుంది.
- source_word: חִטִּים מַכּוֹת
  choice: గోధుమలు
  rationale: మַכּוֹת అనే అసాధారణ రూపానికి అర్థం అనిశ్చితం. ప్రధాన పాఠంలో నిర్ధారించలేని ప్రాసెసింగ్ విధానాన్ని చేర్చకుండా, ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచుతుంది.
- source_word: לַעֲבָדֶיךָ
  choice: మీ సేవకులైన
  rationale: עֲבָדִים యొక్క సాధారణ అర్థమైన 'సేవకులు'ను నిలుపుతూ, వారు ఈ సందర్భంలో కలప నరికే పనివారనే సంబంధాన్ని తెలుగులో సహజంగా చూపుతుంది.
- source_word: כֹּרִים
  choice: కోర్లు
  rationale: ప్రాచీన ఘన పరిమాణాన్ని ఊహాత్మక ఆధునిక ప్రమాణంగా మార్చకుండా లిప్యంతరీకరిస్తుంది.
- source_word: בַּתִּים
  choice: బాతులు
  rationale: ప్రాచీన ద్రవ పరిమాణాన్ని మూల సంస్కృతి ప్రమాణంగానే లిప్యంతరీకరిస్తుంది.
- source_word: יַיִן
  choice: ద్రాక్షారసం
  rationale: יַיִן యొక్క మత్తు కలిగించే ద్రాక్ష పానీయ భావాన్ని ఆధునిక తెలుగు బైబిలు శైలిలో సహజంగా తెలియజేస్తుంది.
- source_word: שֶׁמֶן
  choice: నూనె
  rationale: మూలంలో ఆలివ్ నూనె అని ప్రత్యేకంగా లేకపోవడంతో సాధారణ పదాన్నే ఉపయోగిస్తుంది.
- source_word: עֶשְׂרִים אֶלֶף
  choice: ఇరవై వేలు
  rationale: ప్రతి సరుకుకు ఇచ్చిన సంఖ్యను యథాతథంగా అనువదిస్తుంది.
