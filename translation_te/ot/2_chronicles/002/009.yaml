  terminology: కోరు మరియు బాత్ ప్రాచీన కొలమానాలుగా లిప్యంతరీకరించబడ్డాయి. עֲבָדֶיךָను “మీ సేవకులు”గా, వారి పనిని “చెట్లను నరికే కలప నరికేవారు”గా ఉంచాం. שֶׁמֶןకు మూలంలో లేని ‘ఆలివ్’ విశేషణాన్ని చేర్చకుండా “నూనె”గా అనువదించాం.
