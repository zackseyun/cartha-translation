translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. కొలమానాలను లిప్యంతరీకరించి పాదసూచికల్లో వివరించాం. అయితే మసొరెటిక్ హీబ్రూ పాఠంలో గోధుమల సంఖ్య 'ఇరవై వేల కోర్లు'; ప్రచురణ పాఠ్యంలో పొరపాటున 'నలభై వేల కోర్లు' వచ్చింది—దాన్ని 'ఇరవై వేల కోర్లు'గా సరిచేయాలి.
