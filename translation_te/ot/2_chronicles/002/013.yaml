source:
  edition: WLC
  text: בֶּן אִשָּׁ֞ה מִן בְּנ֣וֹת דָּ֗ן וְ/אָבִ֣י/ו אִישׁ צֹרִ֡י יוֹדֵ֡עַ לַ/עֲשׂ֣וֹת בַּ/זָּֽהָב וּ֠/בַ/כֶּסֶף בַּ/נְּחֹ֨שֶׁת בַּ/בַּרְזֶ֜ל בָּ/אֲבָנִ֣ים וּ/בָ/עֵצִ֗ים בָּ/אַרְגָּמָ֤ן בַּ/תְּכֵ֨לֶת֙ וּ/בַ/בּ֣וּץ וּ/בַ/כַּרְמִ֔יל וּ/לְ/פַתֵּ֨חַ֙ כָּל פִּתּ֔וּחַ וְ/לַ/חְשֹׁ֖ב כָּל מַחֲשָׁ֑בֶת אֲשֶׁ֤ר יִנָּֽתֶן ל/וֹ֙ עִם חֲכָמֶ֔י/ךָ וְֽ/חַכְמֵ֔י אֲדֹנִ֖/י דָּוִ֥יד אָבִֽי/ךָ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/013.yaml
  text: the son of a woman from the daughters of Dan[a], and his father was a man of Tyre, skilled to work in gold and silver, bronze and iron, stone and wood, purple, blue, fine linen, and crimson, and to engrave every kind of engraving and to devise every kind of design that may be assigned to him[b], with your skilled men and the skilled men of my lord David your father.
translation:
  language: te
  text: అతడు దాను కుమార్తెలలోనుండి వచ్చిన ఒక స్త్రీ కుమారుడు[a]; అతని తండ్రి తూరు పట్టణస్థుడు. అతడు బంగారం, వెండి, కంచు, ఇనుము, రాయి, చెక్కల పనిలోను, ఊదారంగు, నీలిరంగు, సన్నని నార, ముదురు ఎరుపు రంగు వస్త్రాల పనిలోను, ప్రతి రకమైన చెక్కుడు పనిని చేయడంలోను, నీ నిపుణులతోను నా ప్రభువైన నీ తండ్రి దావీదు నిపుణులతోను కలిసి అతనికి అప్పగించబడే ప్రతి రూపకల్పనను రూపొందించడంలోను నైపుణ్యం గలవాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దాను కుమార్తెలలోనుండి” అనే మాట అతని తల్లి దాను గోత్రానికి చెందినదని సూచించే అవకాశం ఉంది.
    reason: cultural_note
  - marker: b
    text: “ముదురు ఎరుపు రంగు”కు “స్కార్లెట్” అనేది మరో సాధ్యమైన అనువాదం. చివరి “నీ నిపుణులతోను ... దావీదు నిపుణులతోను” అనే పదబంధం, అతనికి అప్పగించబడే రూపకల్పనలతో లేదా అతని నైపుణ్యవివరణతో అనుసంధానమై ఉండవచ్చు.
    reason: lexical_alternative_and_source_ambiguity
lexical_decisions:
- source_word: בֶּן אִשָּׁה מִן בְּנוֹת דָּן
  choice: దాను కుమార్తెలలో ఒకరైన స్త్రీ కుమారుడు
  rationale: ‘దాను కుమార్తెలలో’ అనే హీబ్రూ వంశవివరణను నిలుపుతూ, ఆధునిక తెలుగులో సంబంధం స్పష్టంగా వినిపించేలా ‘ఒకరైన స్త్రీ’ అని మృదువుగా అమర్చాం.
- source_word: וְאָבִיו אִישׁ צֹרִי
  choice: అతని తండ్రి తూరు పట్టణస్థుడు
  rationale: צֹרִי అంటే తూరు ప్రాంతానికి చెందిన వ్యక్తి; ‘తూరు పట్టణస్థుడు’ సహజమైన భౌగోళిక గుర్తింపు.
- source_word: יוֹדֵעַ לַעֲשׂוֹת
  choice: పనిచేయడంలో ... నైపుణ్యం గలవాడు
  rationale: ఇది కేవలం తెలిసినవాడు అనే భావం కాక, చేతివృత్తిలో ప్రాయోగిక నైపుణ్యాన్ని సూచిస్తుంది.
- source_word: בַּזָּהָב וּבַכֶּסֶף בַּנְּחֹשֶׁת בַּבַּרְזֶל בָּאֲבָנִים וּבָעֵצִים
  choice: బంగారం, వెండి, కంచు, ఇనుము, రాయి, చెక్కలతో
  rationale: בְּ ఉపసర్గ ఇక్కడ పనికి ఉపయోగించే మాధ్యమాలను సూచిస్తుంది; తెలుగులో ‘తో’ సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: בָּאַרְגָּמָן בַּתְּכֵלֶת וּבַבּוּץ וּבַכַּרְמִיל
  choice: ఊదా, నీలి, సన్నని నార, ముదురు ఎరుపు రంగుల వస్త్రాలతో
  rationale: రంగుపేర్లు మాత్రమే వస్తే పదార్థాల జాబితాలో సందిగ్ధత కలగవచ్చు; సందర్భానుసారం ఇవి రంగు వేసిన వస్త్రాలు లేదా దారాలనే సూచిస్తున్నందున ‘వస్త్రాలతో’ అని స్పష్టం చేశాం. כַּרְמִילకు ముదురు ఎరుపు ప్రధాన పాఠ్యం; ‘సింధూరవర్ణం’ ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: וּלְפַתֵּחַ כָּל פִּתּוּחַ
  choice: అన్ని రకాల చెక్కడపు పనులు చేయడంలో
  rationale: సజాతి క్రియా-నామ పదబంధంలోని ఉద్ఘాటనను సహజమైన తెలుగు వృత్తిపదజాలంతో అందిస్తుంది.
- source_word: וְלַחְשֹׁב כָּל מַחֲשָׁבֶת אֲשֶׁר יִנָּתֶן לוֹ
  choice: తనకు అప్పగించే ఏ నమూనానైనా రూపొందించడంలో
  rationale: శిల్పకళా సందర్భంలో חשׁב రూపకల్పన లేదా నమూనా సిద్ధం చేయడాన్ని సూచిస్తుంది; ‘అప్పగించే’ అనేది నిష్క్రియార్థాన్ని నిలుపుతుంది.
- source_word: עִם חֲכָמֶיךָ וְחַכְמֵי אֲדֹנִי דָּוִיד אָבִיךָ
  choice: నీ నిపుణులతోను, నీ తండ్రి, నా ప్రభువైన దావీదు నిపుణులతోను కలిసి
  rationale: חכמים ఇక్కడ జ్ఞానులకన్నా నైపుణ్యవంతులైన పనివారిని సూచిస్తుంది. אֲדֹנִי మానవునికి ఇచ్చే గౌరవ సంబోధన కాబట్టి ‘నా ప్రభువు’ అని అనువదించాం.
theological_decisions:
- issue: నిపుణులను సూచించే పుంలింగ బహువచనం
  choice: నీ నిపుణులు ... దావీదు నిపుణులు
  alternative: నీ నైపుణ్యంగల పనివారు
  rationale: హీబ్రూ పుంలింగ బహువచనాన్ని లింగనిరపేక్షంగా మార్చకుండా ఉంచాం; తెలుగులో ‘నిపుణులు’ సందర్భానికి తగిన గౌరవప్రదమైన సాధారణ పుంలింగ రూపం.
- issue: אֲדֹנִי అనే రాజసభ గౌరవపదం
  choice: నా ప్రభువైన దావీదు
  alternative: నా యజమానియైన దావీదు
  rationale: ఇక్కడ పదం దేవుని బిరుదు కాదు; దావీదుకు ఇచ్చిన మానవ గౌరవ సంబోధన. ‘ప్రభువు’ రాజసభా మర్యాదను సహజంగా తెలియజేస్తుంది.
- issue: చివరి עִם పదబంధపు వాక్య సంబంధం
  choice: అతడు ... కలిసి పనిచేస్తాడు
  alternative: నీ నిపుణులతోను ... నిపుణులతోను ఉండి, తనకు అప్పగించబడేదాన్ని రూపొందించగలవాడు
  rationale: హీబ్రూలో చివరి ‘తో’ పదబంధం ముందు నైపుణ్యవివరణతో వ్యాకరణపరంగా సడలుగా అనుసంధానమై ఉంది. తెలుగులో అర్థస్పష్టత కోసం సహకార భావాన్ని ప్రత్యేక వాక్యంగా చెప్పాం; ఇది సందర్భంలో సహజమైన అర్థం అయినా వాక్యనిర్మాణంలోని స్వల్ప అస్పష్టతను పాదసూచికలో గుర్తించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రచించబడింది. శిల్పకళా పదజాలం సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచబడింది; మూలంలోని వంశవివరణ, రంగులు, మాధ్యమాలు, రాజసభా గౌరవ సంబోధన నిలుపబడ్డాయి.
