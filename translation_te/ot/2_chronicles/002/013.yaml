  to: అతడు దాను కుమార్తెలలోనుండి వచ్చిన ఒక స్త్రీ కుమారుడు[a]; అతని తండ్రి తూరు పట్టణస్థుడు. అతడు బంగారం, వెండి, కంచు, ఇనుము, రాయి, చెక్కల పనిలోను, ఊదారంగు, నీలిరంగు, సన్నని నార, ముదురు ఎరుపు రంగు వస్త్రాల పనిలోను, ప్రతి రకమైన చెక్కుడు పనిని చేయడంలోను, నీ నిపుణులతోను నా ప్రభువైన నీ తండ్రి దావీదు నిపుణులతోను కలిసి అతనికి అప్పగించబడే ప్రతి రూపకల్పనను రూపొందించడంలోను నైపుణ్యం గలవాడు[b].
  rationale: సవరణ మూలంలో లేని స్వతంత్ర భవిష్యత్ కార్యాన్ని తొలగిస్తుంది. చివరి సహకార పదబంధాన్ని ‘అతనికి అప్పగించబడే ప్రతి రూపకల్పన’తో అనుసంధానించడం ద్వారా హీబ్రూ వాక్యనిర్మాణానికి దగ్గరగా ఉంటుంది; అయినప్పటికీ ఆ పదబంధపు ఖచ్చిత సంబంధంపై ఉన్న స్వల్ప అస్పష్టతను పాదసూచికలో భద్రపరుస్తుంది. రంగు పదానికి అవసరమైన లెక్సికల్ ప్రత్యామ్నాయ పాదసూచికను కూడా చేర్చాం.
