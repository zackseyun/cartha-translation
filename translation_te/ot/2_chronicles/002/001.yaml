language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּסְפֹּ֨ר שְׁלֹמֹ֜ה שִׁבְעִ֥ים אֶ֨לֶף֙ אִ֣ישׁ סַבָּ֔ל וּ/שְׁמוֹנִ֥ים אֶ֛לֶף אִ֖ישׁ חֹצֵ֣ב בָּ/הָ֑ר וּ/מְנַצְּחִ֣ים עֲלֵי/הֶ֔ם שְׁלֹ֥שֶׁת אֲלָפִ֖ים וְ/שֵׁ֥שׁ מֵאֽוֹת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/001.yaml
  text: Solomon counted seventy thousand men as burden-bearers[a], and eighty thousand men as stonecutters in the hill country, and over them three thousand six hundred overseers.
translation:
  language: te
  text: సొలొమోను బరువులు మోసే డెబ్బై వేల మంది పురుషులను, కొండ ప్రాంతంలో రాళ్లు చెక్కే ఎనభై వేల మంది పురుషులను[a], వారిని పర్యవేక్షించే మూడు వేల ఆరు వందల మందిని లెక్కించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొండ ప్రాంతంలో చెక్కేవారు.” హీబ్రూలో అక్షరార్థంగా, “కొండలో చెక్కేవారు” అని ఉంది; చెక్కబడేది రాయి అని సందర్భం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְפֹּר
  choice: లెక్కించాడు
  rationale: ספר అనే క్రియకు ఇక్కడ ‘లెక్కించాడు/సంఖ్య నిర్ణయించాడు’ అనే సహజ అర్థం ఉంది. రాజ పనిదళంలోని వర్గాలను సంఖ్యాపూర్వకంగా పేర్కొనే సందర్భానికి ‘లెక్కించాడు’ సరిపోతుంది.
- source_word: אִישׁ ... סַבָּל
  choice: బరువులు మోసే ... మంది పురుషులను
  rationale: סַבָּל అంటే బరువులు మోసేవాడు. ఆధునిక తెలుగులో సహజంగా ఉండే క్రియాత్మక పదబంధం వాడుతూ, אִישׁ సూచించే పురుషులను స్పష్టంగా నిలిపాం.
- source_word: חֹצֵב בָּהָר
  choice: కొండ ప్రాంతంలో రాళ్లు చెక్కే
  rationale: חצב అంటే చెక్కడం లేదా తొలచడం; నిర్మాణ పనుల సందర్భంలో చెక్కబడేది రాయి అని భావం. בָּהָר‌ను సహజ తెలుగులో ‘కొండ ప్రాంతంలో’ అని ఇచ్చాం; మూలంలోని సంక్షిప్తతను పాదసూచికలో తెలిపాం.
- source_word: וּמְנַצְּחִים עֲלֵיהֶם
  choice: వారికి పర్యవేక్షకులుగా
  rationale: ఈ పరిపాలనా సందర్భంలో מְנַצְּחִים పని నడిపించే లేదా పర్యవేక్షించే అధికారులను సూచిస్తుంది. עֲלֵיהֶם‌లోని వారి మీద అధికార భావాన్ని తెలుగులో ‘వారికి పర్యవేక్షకులుగా’ సహజంగా వ్యక్తం చేశాం.
- source_word: שְׁלֹשֶׁת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: మూడు వేల ఆరు వందల
  rationale: హీబ్రూ సంఖ్యను తెలుగులో సాధారణంగా పలికే రూపంలో నేరుగా అనువదించాం.
- source_word: אִישׁ
  choice: మంది పురుషులను
  rationale: ఇక్కడ రాజ పనిదళంలోని పురుష కార్మికులనే సూచిస్తున్నందున మూలంలోని లింగ సూచనను నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. వృత్తి వర్గాలను నామవాచకాల కంటే సహజమైన క్రియాత్మక పదబంధాలతో తెలిపాం; సంఖ్యలు మరియు పురుషుల సూచనను మూలానికి అనుగుణంగా నిలిపాం.
