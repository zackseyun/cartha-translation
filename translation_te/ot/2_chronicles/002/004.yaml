  text: וְ/הַ/בַּ֛יִת אֲשֶׁר אֲנִ֥י בוֹנֶ֖ה גָּד֑וֹל כִּֽי גָד֥וֹל אֱלֹהֵ֖י/נוּ מִ/כָּל הָ/אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/004.yaml
  text: And the house that I am building will be great[b][a], for our God is greater than all gods.
translation:
  language: te
  text: నేను కడుతున్న ఆలయం[a] గొప్పదిగా ఉంటుంది; ఎందుకంటే మన దేవుడు దేవుళ్లందరికంటే గొప్పవాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఇల్లు.” ఈ సందర్భంలో దేవుని ఆలయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మన దేవుడు దేవుళ్లందరిపై గొప్పవాడు.” హీబ్రూలో ‘గొప్ప’ అనే పదంతో ‘దేవుళ్లందరికంటే/పైగా’ అనే నిర్మాణం పోలికను వ్యక్తం చేస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/הַ/בַּיִת
  choice: ఆలయం
  rationale: בַּיִת అనే పదానికి అక్షరార్థం ‘ఇల్లు’; ఈ సందర్భంలో అది దేవుని ఆరాధన కోసం కడుతున్న ఆలయాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఆలయం’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది; అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אֲשֶׁר אֲנִי בוֹנֶה
  choice: నేను కడుతున్న
  rationale: హీబ్రూ కృదంతం కొనసాగుతున్న లేదా చేపట్టిన నిర్మాణ కార్యాన్ని సూచిస్తుంది. ‘నేను కడుతున్న’ అనేది దాని కాలభావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: גָּדוֹל
  choice: గొప్పదిగా
  rationale: ఈ విశేషణం పరిమాణంతోపాటు ప్రాముఖ్యతను కూడా సూచించగలదు. ‘గొప్పదిగా’ ఈ రెండు భావాలకు తగిన విస్తృతిని కలిగి ఉంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు కారణాన్ని పరిచయం చేస్తున్నందున ‘ఎందుకంటే’ స్పష్టమైన, సహజమైన తెలుగు అనుసంధానం.
- source_word: גָדוֹל אֱלֹהֵינוּ
  choice: మన దేవుడు ... గొప్పవాడు
  rationale: אֱלֹהֵינוּకు ‘మన దేవుడు’ సరళమైన సమానార్థకం. తరువాతి מִן నిర్మాణంతో కలిసి גָדוֹל తులనాత్మక భావాన్ని పొందుతుంది.
- source_word: מִכָּל הָאֱלֹהִים
  choice: దేవుళ్లందరికంటే
  rationale: మִן + כָּל నిర్మాణం స్పష్టమైన పోలికను వ్యక్తం చేస్తుంది. ‘దేవుళ్లందరికంటే’ తెలుగులో నేరుగా, సహజంగా ఆ పోలికను తెలియజేస్తుంది.
theological_decisions:
- issue: ఇతర దేవుళ్లతో పోలికను ఎలా వ్యక్తం చేయాలి
  choice: మన దేవుడు దేవుళ్లందరికంటే గొప్పవాడు
  alternative: మన దేవుడు దేవుళ్లందరిపై గొప్పవాడు
  rationale: హీబ్రూ వాక్యం ఇతర దేవుళ్లందరితో స్పష్టమైన పోలిక చేస్తుంది. వారు విగ్రహాలా, అబద్ధ దేవుళ్లా, దివ్య జీవులా అన్న విషయాన్ని వాక్యం ఇక్కడ తేల్చదు; అందువల్ల ‘దేవుళ్లు’ అనే పదాన్ని ఉంచి ఆ ధార్మిక ఉద్వేగాన్ని పరిష్కరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘ఆలయం’ సాధారణ పాఠకునికి సందర్భాన్ని వెంటనే స్పష్టం చేస్తుంది; హీబ్రూ అక్షరార్థమైన ‘ఇల్లు’ పాదటిప్పణిలో భద్రపరచబడింది. ఇతర దేవుళ్ల స్వరూపాన్ని వ్యాఖ్యానాత్మకంగా నిర్ధారించలేదు.
