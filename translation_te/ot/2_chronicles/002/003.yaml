- from: ఇదిగో, నా దేవుడైన యాహ్వే నామం కోసం ఒక ఆలయాన్ని[a] నిర్మిస్తున్నాను. దాన్ని ఆయనకు ప్రతిష్ఠించి, ఆయన సన్నిధిలో సుగంధ ధూపం వేయడానికి, నిత్యం అమర్చే రొట్టెలను[b] ఉంచడానికి, ప్రతి ఉదయం, సాయంత్రం, విశ్రాంతి దినాల్లో, అమావాస్యల్లో, మన దేవుడైన యాహ్వే నియమించిన పండుగల్లో దహనబలులు అర్పించడానికి దాన్ని నిర్మిస్తున్నాను. ఇది ఇశ్రాయేలుకు శాశ్వతమైన విధి[c].
  to: ఇదిగో, నా దేవుడైన యాహ్వే నామం కోసం ఒక గృహాన్ని[a] నిర్మిస్తున్నాను—దాన్ని ఆయనకు ప్రతిష్ఠించడానికి, ఆయన సన్నిధిలో సుగంధ ధూపం వేయడానికి, నిత్యపు రొట్టెల అమరికను ఏర్పాటు చేయడానికి, ప్రతి ఉదయం, సాయంత్రం, విశ్రాంతి దినాల్లో, కొత్త నెలల దినాల్లో[b], మన దేవుడైన యాహ్వే నియమిత పండుగల్లో దహనబలులు అర్పించడానికి. ఇది ఇశ్రాయేలుకు ఎప్పటికీ విధిగా ఉంది[c].
