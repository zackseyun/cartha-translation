source:
  edition: WLC
  text: הִנֵּה֩ אֲנִ֨י בֽוֹנֶה בַּ֜יִת לְ/שֵׁ֣ם יְהוָ֣ה אֱלֹהָ֗/י לְ/הַקְדִּ֣ישׁ ל֡/וֹ לְ/הַקְטִ֣יר לְ/פָנָ֣י/ו קְטֹֽרֶת סַמִּים֩ וּ/מַעֲרֶ֨כֶת תָּמִ֤יד וְ/עֹלוֹת֙ לַ/בֹּ֣קֶר וְ/לָ/עֶ֔רֶב לַ/שַּׁבָּתוֹת֙ וְ/לֶ֣/חֳדָשִׁ֔ים וּֽ/לְ/מוֹעֲדֵ֖י יְהוָ֣ה אֱלֹהֵ֑י/נוּ לְ/עוֹלָ֖ם זֹ֥את עַל יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/003.yaml
  text: Behold[a], I am building a house for the name of Yahweh my God, to consecrate it to him, to burn fragrant incense before him, and to set out the regular arrangement of bread, and burnt offerings morning and evening, on the Sabbaths, at the new moons[b], and at the appointed feasts of Yahweh our God[c]. This is forever for Israel.
translation:
  language: te
  text: ఇదిగో, నా దేవుడైన యాహ్వే నామం కోసం ఒక గృహాన్ని[a] నిర్మిస్తున్నాను—దాన్ని ఆయనకు ప్రతిష్ఠించడానికి, ఆయన సన్నిధిలో సుగంధ ధూపం వేయడానికి, నిత్యపు రొట్టెల అమరికను ఏర్పాటు చేయడానికి, ప్రతి ఉదయం, సాయంత్రం, విశ్రాంతి దినాల్లో, కొత్త నెలల దినాల్లో[b], మన దేవుడైన యాహ్వే నియమిత పండుగల్లో దహనబలులు అర్పించడానికి. ఇది ఇశ్రాయేలుకు ఎప్పటికీ విధిగా ఉంది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “యాహ్వే నామం కోసం ఒక ఇల్లు.” ఇక్కడ అది దేవాలయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీ పదం కొత్త నెల ప్రారంభ సందర్భాలను సూచిస్తుంది; దీనిని సంప్రదాయంగా “అమావాస్యలు” అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
  - marker: c
    text: హెబ్రీలో అక్షరార్థంగా, “ఇది ఇశ్రాయేలుపై ఎప్పటికీ.” అంటే ఈ ఆరాధనా క్రమం ఇశ్రాయేలుకు శాశ్వత విధిగా ఉంది.
    reason: clarification
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: ప్రకటనపై శ్రద్ధ నిలిపే హెబ్రీ సంభాషణ సూచకానికి సహజమైన, గంభీరమైన తెలుగు సమానం.
- source_word: בּוֹנֶה
  choice: నిర్మిస్తున్నాను
  rationale: హెబ్రీ కృదంతంలోని కొనసాగుతున్న లేదా సమీపంలో జరగబోయే కార్యభావాన్ని వర్తమాన ప్రగతిశీల రూపంలో వ్యక్తం చేస్తుంది.
- source_word: בַּיִת לְשֵׁם יְהוָה
  choice: యాహ్వే నామం కోసం ఒక ఆలయాన్ని
  rationale: బַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా ఇక్కడ దేవాలయాన్ని సూచిస్తుంది; ‘ఆలయం’ ఆధునిక తెలుగులో సహజంగా అర్థమవుతుంది, ‘నామం కోసం’ అనే మూలంలోని ముఖ్యమైన భావాన్ని నిలుపుతుంది. అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా హెబ్రీ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- source_word: לְהַקְדִּישׁ לוֹ
  choice: దాన్ని ఆయనకు ప్రతిష్ఠించి
  rationale: קדשׁ హిఫీల్ రూపంలోని పవిత్ర ప్రయోజనం కోసం ప్రత్యేకపరచే ఆరాధనా భావాన్ని ‘ప్రతిష్ఠించు’ తెలియజేస్తుంది.
- source_word: קְטֹרֶת סַמִּים
  choice: సుగంధ ధూపం
  rationale: సుగంధ ద్రవ్యాలతో తయారుచేసిన ఆరాధనా ధూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מַעֲרֶכֶת תָּמִיד
  choice: నిత్యం అమర్చే రొట్టెలను
  rationale: మూలంలో ‘రొట్టెలు’ ప్రత్యక్షంగా లేకపోయినా, ఆలయంలో యాహ్వే సన్నిధిలో నిరంతరం అమర్చే రొట్టెల వరుసనే ఈ సంక్షిప్త ఆరాధనా పదబంధం సూచిస్తుంది; పాదసూచిక దాని అక్షరరూపాన్ని భద్రపరుస్తుంది.
- source_word: עֹלוֹת
  choice: దహనబలులు
  rationale: పూర్తిగా దహనం చేసే బలి రకానికి స్థిరమైన, స్పష్టమైన తెలుగు ఆరాధనా పదం.
- source_word: לְעוֹלָם זֹאת עַל יִשְׂרָאֵל
  choice: ఇది ఇశ్రాయేలుకు శాశ్వతమైన విధి
  rationale: అక్షరార్థంగా అసహజమైన ‘ఇది ఇశ్రాయేలుపై ఎప్పటికీ’ అనే నిర్మాణంలోని శాశ్వత బాధ్యత భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామాన్ని ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలోని ఒడంబడిక వ్యక్తినామాన్ని బిరుదుగా మార్చకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణకు సమీపంగా ఉంచుతుంది.
- issue: בַּיִת ను ‘ఇల్లు’గా లేదా ‘ఆలయం’గా ఇవ్వడం
  choice: ఆలయం
  alternative: ఇల్లు / గృహం
  rationale: సందర్భంలో సొలొమోను నిర్మించేది దేవాలయం; ‘ఆలయం’ సాధారణ పాఠకునికి సహజంగా ఉంటుంది. అయితే ‘యాహ్వే నామం కోసం’ అనే మూల వేదాంతపరమైన నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అక్షరార్థమైన ‘ఇల్లు’ను పాదసూచికలో తెలిపాం.
- issue: מַעֲרֶכֶת תָּמִיד లో సూచితమైన వస్తువును స్పష్టం చేయడం
  choice: నిత్యం అమర్చే రొట్టెలను
  alternative: నిత్యపు అమరికను / సన్నిధి రొట్టెలను
  rationale: హెబ్రీ పదబంధం ‘నిత్య అమరిక’ అని మాత్రమే ఉన్నప్పటికీ ఆలయ ఆచార సందర్భంలో రొట్టెల అమరికను సూచిస్తుంది. అస్పష్టమైన తెలుగు పదబంధం బదులు సూచిత వస్తువును ప్రధాన పాఠ్యంలో స్పష్టం చేసి, మూల సంక్షిప్తతను పాదసూచికలో నమోదు చేశాం.
- issue: לְעוֹלָם זֹאת עַל יִשְׂרָאֵל యొక్క శాశ్వతత మరియు బాధ్యత
  choice: ఇది ఇశ్రాయేలుకు శాశ్వతమైన విధి
  alternative: ఇది ఇశ్రాయేలుపై ఎప్పటికీ ఉంటుంది
  rationale: ‘על’ లోని బాధ్యత లేదా విధింపు భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; దాని పరిధి లేదా తరువాతి వేదాంతపరమైన అమలుపై అదనపు నిర్ణయం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ఆరాధనా శైలిని ఉపయోగించాం. పొడవైన హెబ్రీ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించినా, ఉద్దేశ్యక్రియల పరస్పర సంబంధాన్ని నిలిపాం. ‘ప్రతిష్ఠించు,’ ‘ధూపం,’ ‘దహనబలి,’ ‘విశ్రాంతి దినం,’ ‘అమావాస్య’ వంటి సాధారణంగా అర్థమయ్యే ఆరాధనా పదాలను ఎంచుకున్నాం.
