source:
  edition: WLC
  text: וְ֠/עַתָּה הַ/חִטִּ֨ים וְ/הַ/שְּׂעֹרִ֜ים הַ/שֶּׁ֤מֶן וְ/הַ/יַּ֨יִן֙ אֲשֶׁ֣ר אָמַ֣ר אֲדֹנִ֔/י יִשְׁלַ֖ח לַ/עֲבָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/014.yaml
  text: And now[a], let my lord send to his servants the wheat and the barley, the oil and the wine[b], of which he has spoken.
translation:
  language: te
  text: ఇప్పుడు నా ప్రభువు తాను చెప్పిన[b] గోధుమలను, యవలను, నూనెను[a], ద్రాక్షారసాన్ని తన సేవకులకు పంపాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఒలీవ నూనెను’; ఈ సరఫరా సందర్భంలో ‘నూనె’ అనేది ప్రత్యేకంగా ఒలీవ నూనెను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తాను ప్రస్తావించిన’; హీబ్రూ పదానికి ‘తాను వాగ్దానం చేసిన’ అనే బలమైన భావం తప్పనిసరి కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: తదుపరి ఆచరణాత్మక విజ్ఞప్తిని పరిచయం చేసే సంభాషణా సూచకం. తెలుగులో ‘ఇప్పుడు’ సహజంగా ఉండి సందర్భంలోని అనుసంధాన భావాన్ని కూడా తెలియజేస్తుంది.
- source_word: הַחִטִּים
  choice: గోధుమలను
  rationale: అభ్యర్థించిన నిర్దిష్ట ఆహార ధాన్యాన్ని సూచించే బహువచన రూపం; తెలుగులో వస్తు పరిమాణాన్ని సూచించేందుకు ఈ రూపం సహజం.
- source_word: וְהַשְּׂעֹרִים
  choice: యవలను
  rationale: గోధుమలకు సమాంతరంగా ఉన్న ధాన్యపదం. ‘యవలు’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన పదం.
- source_word: הַשֶּׁמֶן
  choice: నూనెను
  rationale: హీబ్రూ పదం సాధారణంగా ‘నూనె’ అని మాత్రమే చెబుతుంది. సందర్భంలో ఒలీవ నూనె కావచ్చునైనా ప్రధాన పాఠ్యంలో ఆ ప్రత్యేకతను చేర్చలేదు.
- source_word: וְהַיַּיִן
  choice: ద్రాక్షారసాన్ని
  rationale: జాబితాలోని పానీయ వస్తువును ఆధునిక తెలుగు బైబిలు శైలిలో స్పష్టంగా సూచిస్తుంది.
- source_word: אֲשֶׁר אָמַר
  choice: తాను చెప్పిన
  rationale: ఇంతకు ముందు పేర్కొన్న సరుకులను సూచిస్తుంది. ‘వాగ్దానం చేసిన’ అనే మరింత బలమైన భావాన్ని హీబ్రూ אָמַר తప్పనిసరిగా ఇవ్వదు కాబట్టి దాన్ని చేర్చలేదు.
- source_word: אֲדֹנִי
  choice: నా ప్రభువు
  rationale: హూరాము సొలొమోనును గౌరవంగా సంబోధించే రాజసభా ప్రయోగం; ఇక్కడ ఇది దేవుని బిరుదు కాదు.
- source_word: יִשְׁלַח
  choice: పంపాలి
  rationale: సందర్భంలో ఈ yiqtol విజ్ఞప్తి లేదా ఆదేశార్థక బలాన్ని కలిగి ఉంది. ‘పంపుతాడు’ అనే సాధారణ భవిష్యత్తు కంటే ‘పంపాలి’ ఆ భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לַעֲבָדָיו
  choice: తన సేవకులకు
  rationale: ל ఉపసర్గతో కూడిన עבד పదానికి సూటి అనువాదం. ‘పనివారికి’ సందర్భానుకూలమైన ప్రత్యామ్నాయం అయినా, ‘సేవకులకు’ మూలపదానికి మరింత పారదర్శకంగా ఉంది.
