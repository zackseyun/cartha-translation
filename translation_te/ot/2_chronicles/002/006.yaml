source:
  edition: WLC
  text: וְ/עַתָּ֡ה שְֽׁלַֽח לִ֣/י אִישׁ חָכָ֡ם לַ/עֲשׂוֹת֩ בַּ/זָּהָ֨ב וּ/בַ/כֶּ֜סֶף וּ/בַ/נְּחֹ֣שֶׁת וּ/בַ/בַּרְזֶ֗ל וּ/בָֽ/אַרְגְּוָן֙ וְ/כַרְמִ֣יל וּ/תְכֵ֔לֶת וְ/יֹדֵ֖עַ לְ/פַתֵּ֣חַ פִּתּוּחִ֑ים עִם הַֽ/חֲכָמִ֗ים אֲשֶׁ֤ר עִמִּ/י֙ בִּֽ/יהוּדָ֣ה וּ/בִֽ/ירוּשָׁלִַ֔ם אֲשֶׁ֥ר הֵכִ֖ין דָּוִ֥יד אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/006.yaml
  text: Send me a skilled man to work in gold[a], silver, bronze, iron, purple, crimson, and blue, and who knows how to engrave engravings, to be with the skilled men who are with me in Judah and Jerusalem[c][b], whom my father David prepared.
translation:
  language: te
  text: ఇప్పుడు బంగారం, వెండి, కంచు, ఇనుము, ఊదా, ముదురు ఎరుపు[a], నీలం రంగులతో పని చేయగల, చెక్కుళ్లు చెక్కడంలో నైపుణ్యం గల[b] ఒక నిపుణుడిని నాకు పంపించు; అతడు యూదాలోను యెరూషలేములోను నాతో ఉన్న, నా తండ్రి దావీదు సిద్ధపరచిన[c] నిపుణులతో కలిసి ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ముదురు ఎరుపు’కు బదులుగా ‘స్కార్లెట్ ఎరుపు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘చెక్కుళ్లు చెక్కడానికి తెలిసినవాడు’; ఒకే మూలపదంతో ఏర్పడిన క్రియ-నామ ప్రయోగం నైపుణ్యమైన చెక్కడపు పనిని నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘సిద్ధపరచిన’ అనే హీబ్రూ క్రియను సందర్భానుసారంగా ‘నియమించిన’ లేదా ‘సన్నద్ధం చేసిన’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה שְׁלַח
  choice: ఇప్పుడు ... పంపించు
  rationale: וְעַתָּהలో స్పష్టమైన కాలసూచకమైన ‘ఇప్పుడు’ ఉంది. ఆజ్ఞార్థక שְׁלַחను సహజమైన ఆధునిక తెలుగులో ‘పంపించు’గా అనువదించాం.
- source_word: אִישׁ חָכָם
  choice: ఒక నిపుణుణ్ణి
  rationale: ఈ చేతివృత్తి సందర్భంలో חָכָם సాధారణ జ్ఞానం కంటే వృత్తి నైపుణ్యాన్ని సూచిస్తుంది. హీబ్రూ ఏకవచన పురుషరూపం తెలుగులో నిలిచింది.
- source_word: לַעֲשׂוֹת בַּזָּהָב וּבַכֶּסֶף וּבַנְּחֹשֶׁת וּבַבַּרְזֶל
  choice: బంగారం, వెండి, కంచు, ఇనుము ... పదార్థాలతో పని చేయగల
  rationale: בְּ ఇక్కడ పనికి ఉపయోగించే మాధ్యమాలను సూచిస్తుంది. נְחֹשֶׁתను ఈ చారిత్రక సందర్భంలో ‘కంచు’గా ఇచ్చాం.
- source_word: אַרְגְּוָן וְכַרְמִיל וּתְכֵלֶת
  choice: ఊదారంగు, ముదురు ఎరుపు, నీలిరంగు పదార్థాలు
  rationale: ఇవి ఖరీదైన రంగులు లేదా ఆ రంగులు అద్దిన పదార్థాలను సూచిస్తాయి. మూలంలో ప్రత్యేకంగా ‘నూలు’ లేదా ‘వస్త్రం’ లేకపోవడంతో విస్తృతమైన ‘పదార్థాలు’ అనే మాటను సమూహపదంగా వాడాం.
- source_word: יֹדֵעַ לְפַתֵּחַ פִּתּוּחִים
  choice: చెక్కుళ్లు చెక్కడంలో నైపుణ్యం గల
  rationale: మూలంలోని ఒకే ధాతువుతో ఏర్పడిన క్రియ-నామ cognate construction భావాన్ని ‘చెక్కుళ్లు చెక్కడం’ ద్వారా సాధ్యమైనంతవరకు నిలిపాం.
- source_word: עִם הַחֲכָמִים אֲשֶׁר עִמִּי
  choice: నాతో ఉన్న ... నిపుణులతో కలిసి
  rationale: עִם సహకారాన్ని సూచిస్తుంది; חֲכָמִיםను మొదటి חָכָםతో ఉన్న పదసంబంధం నిలిచేలా ‘నిపుణులు’గా అనువదించాం.
- source_word: אֲשֶׁר הֵכִין דָּוִיד אָבִי
  choice: నా తండ్రి దావీదు సిద్ధపరచిన
  rationale: הֵכִיןకు ‘సిద్ధపరచడం’ అనే విస్తృత అర్థాన్ని ఉంచి, అధికారికంగా నియమించాడని పాఠ్యంలోనే నిర్ధారించలేదు.
theological_decisions:
- issue: אֲשֶׁר הֵכִין అనే సంబంధవాక్యం ఎవరిని సూచిస్తుంది
  choice: దానిని సమీపంలోని ‘నిపుణులు’కు అనుసంధానించాం
  alternative: పనికి కావలసిన ఏర్పాట్లను లేదా సామగ్రిని దావీదు సిద్ధం చేశాడనే విస్తృత అన్వయం
  rationale: వ్యాకరణపరంగా సమీప బహువచన వ్యక్తివాచకమైన הַחֲכָמִים సహజ antecedent. అయినప్పటికీ הֵכִין అర్థవ్యాప్తిని పాదటిప్పణిలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. పొడవైన హీబ్రూ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; సహకారం, స్థలం, దావీదు చేసిన సిద్ధపరచడం అనే సంబంధాలన్నీ నిలిపాం.
