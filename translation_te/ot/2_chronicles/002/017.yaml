source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ מֵ/הֶ֜ם שִׁבְעִ֥ים אֶ֨לֶף֙ סַבָּ֔ל וּ/שְׁמֹנִ֥ים אֶ֖לֶף חֹצֵ֣ב בָּ/הָ֑ר וּ/שְׁלֹ֤שֶׁת אֲלָפִים֙ וְ/שֵׁ֣שׁ מֵא֔וֹת מְנַצְּחִ֖ים לְ/הַעֲבִ֥יד אֶת הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/017.yaml
  text: From them he made seventy thousand burden-bearers[a], and eighty thousand stonecutters in the hill country, and three thousand six hundred overseers to make the people work.
translation:
  language: te
  text: వారిలో డెబ్బై వేల మందిని బరువులు మోసేవారిగా, ఎనభై వేల మందిని కొండ ప్రాంతంలో రాళ్లు చెక్కేవారిగా[a], మూడు వేల ఆరు వందల మందిని ప్రజల చేత పని చేయించే పర్యవేక్షకులుగా నియమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘కొండలో చెక్కేవారు.’ చెక్కిన వస్తువు ఏమిటో హీబ్రూ పాఠంలో స్పష్టంగా చెప్పలేదు; నిర్మాణ సందర్భాన్ని బట్టి ఇక్కడ ‘రాళ్లు’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ מֵהֶם
  choice: వారిలో ... నియమించాడు
  rationale: ఈ సందర్భంలో ఈ హీబ్రూ ప్రయోగం ఒక సమూహంలోని వారిని నిర్దిష్ట పనులకు నియమించడాన్ని సూచిస్తుంది. ‘నియమించాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: סַבָּל
  choice: బరువులు మోసేవారు
  rationale: ఈ నామవాచకం బరువులు మోసే వ్యక్తులను సూచిస్తుంది. సాధారణమైన ‘కూలీలు’ కంటే ఈ అనువాదం మూలపద భావాన్ని మరింత కచ్చితంగా ఇస్తుంది.
- source_word: חֹצֵב בָּהָר
  choice: కొండ ప్రాంతంలో రాళ్లు చెక్కేవారు
  rationale: חצב అంటే చెక్కడం లేదా తొలచడం; ఆలయ నిర్మాణ సందర్భం వల్ల సూచిత కర్మ ‘రాళ్లు’ అని అనువదించబడింది. בָּהָר ను సహజమైన తెలుగులో ‘కొండ ప్రాంతంలో’ అని ఇచ్చాం.
- source_word: מְנַצְּחִים
  choice: పర్యవేక్షకులు
  rationale: ఈ పరిపాలనా సందర్భంలో ఈ పదం పనిని నడిపించే లేదా పర్యవేక్షించే వారిని సూచిస్తుంది.
- source_word: לְהַעֲבִיד אֶת הָעָם
  choice: ప్రజల చేత పని చేయించే
  rationale: עבד పదం హిఫీల్ రూపంలో ‘పని చేయించడం’ అనే కారణార్థక భావాన్ని ఇస్తుంది; తెలుగు ప్రయోగం ఆ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: హీబ్రూ మూలంలో విస్తృతార్థకమైన ‘ప్రజలు’ అనే పదమే ఉంది. సందర్భం వారు పనివారని చూపుతున్నప్పటికీ, అనువాదంలో దాన్ని సంకుచితం చేయలేదు.
