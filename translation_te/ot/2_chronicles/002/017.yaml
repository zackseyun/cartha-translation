translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. సంఖ్యల అమరికను, మూడు వృత్తివర్గాల సమాంతర నిర్మాణాన్ని నిలిపాం. మూలంలోని సూచిత కర్మను ప్రధాన పాఠంలో సందర్భానుసారంగా స్పష్టం చేసి, దాని అక్షరార్థ అనిశ్చితిని పాదసూచికలో భద్రపరిచాం.
