id: 2CH.2.10
reference: 2 Chronicles 2:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר חוּרָ֤ם מֶֽלֶךְ צֹר֙ בִּ/כְתָ֔ב וַ/יִּשְׁלַ֖ח אֶל שְׁלֹמֹ֑ה בְּ/אַהֲבַ֤ת יְהוָה֙ אֶת עַמּ֔/וֹ נְתָנְ/ךָ֥ עֲלֵי/הֶ֖ם מֶֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/010.yaml
  text: 'Then Huram king of Tyre answered in a letter that he sent to Solomon: “Because Yahweh loves his people[c][b][a], he has made you king over them.”'
translation:
  language: te
  text: 'అప్పుడు తూరు రాజైన హూరాము[a], తాను సొలొమోనుకు పంపిన ఉత్తరంలో[c] ఇలా జవాబిచ్చాడు: “యాహ్వే తన ప్రజలను ప్రేమిస్తున్నందువల్ల[b], ఆయన నిన్ను వారిమీద రాజుగా నియమించాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: హూరాము; సంప్రదాయ రూపం: హీరాము.'
    reason: alternative_reading
  - marker: b
    text: లేదా, “యాహ్వేకు తన ప్రజలపట్ల ఉన్న ప్రేమవల్ల.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఉత్తరంలో ఇలా చెప్పి, దాన్ని సొలొమోనుకు పంపించాడు.”
    reason: previous_rendering
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా జవాబిచ్చాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది. ముందున్న సొలొమోను సందేశానికి ఇది ప్రతిస్పందన కాబట్టి, సందర్భానుసారంగా ‘జవాబిచ్చాడు’ సహజంగా ఉంది.
- source_word: חוּרָם
  choice: హూరాము
  rationale: ఈ వచనంలోని హీబ్రూ రూపం חוּרָם ను నేరుగా ప్రతిబింబిస్తుంది; సంప్రదాయ ‘హీరాము’ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: מֶלֶךְ צֹר
  choice: తూరు రాజైన
  rationale: హూరాము యొక్క రాజపదవిని, రాజ్యాన్ని తెలిపే నిర్మాణాన్ని సహజమైన తెలుగు పదబంధంగా అనువదించాం.
- source_word: בִּכְתָב וַיִּשְׁלַח אֶל שְׁלֹמֹה
  choice: తాను సొలొమోనుకు పంపిన ఉత్తరంలో
  rationale: ‘రాతలో’ అనే మూలభావాన్ని ‘ఉత్తరంలో’గా స్పష్టపరుస్తూ, పంపిన చర్యను ఉపవాక్యంగా చేర్చడం తెలుగులోని అనవసర పునరుక్తిని నివారిస్తుంది. సమన్వయ వాక్య నిర్మాణాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְּאַהֲבַת
  choice: ప్రేమిస్తున్నందువల్ల
  rationale: בְּ + భావవాచక నామం ఇక్కడ కారణాన్ని సూచిస్తుంది; యాహ్వే ప్రేమ సొలొమోను రాజుగా నియమింపబడటానికి కారణంగా చెప్పబడింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: עַמּוֹ
  choice: తన ప్రజలను
  rationale: ప్రత్యయం యాహ్వేను సూచిస్తుంది; ‘తన ప్రజలు’ అనే రూపం ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: נְתָנְךָ
  choice: నిన్ను ... నియమించాడు
  rationale: נתן అక్షరార్థంగా ‘ఇచ్చాడు’; అయితే వ్యక్తి మరియు రాజపదవితో వచ్చినప్పుడు రాజుగా ఉంచడం లేదా నియమించడం అనే సందర్భార్థం కలుగుతుంది.
- source_word: עֲלֵיהֶם מֶלֶךְ
  choice: వారిమీద రాజుగా
  rationale: על తో కూడిన מלך ప్రజలపై పరిపాలనను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: సొలొమోనును రాజుగా చేసిన చర్యకు కర్త
  choice: ఆయన (యాహ్వే)
  alternative: కర్తను పునరుక్తి చేయకుండా అస్పష్టంగా ఉంచడం
  rationale: హీబ్రూలో נְתָנְךָ క్రియకు స్పష్ట నామకర్త లేకపోయినా, వెంటనే ముందు ఉన్న యాహ్వే సహజ కర్త. తెలుగులో ‘ఆయన’ అని చూపడం సంబంధాన్ని స్పష్టం చేస్తుంది; కొత్త ధార్మిక భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘జవాబిచ్చాడు’ సందర్భాన్ని స్పష్టం చేస్తుంది; ఉత్తరం పంపిన క్రియను ఉపవాక్యంగా ఉంచాం. ప్రత్యామ్నాయ సమన్వయ నిర్మాణం, నామవాచక కారణవాక్యం, పేరుకు సంప్రదాయ రూపం పాదసూచికల్లో నిలుపబడ్డాయి.
