translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని అనుసరించాం. వృక్షజాతులకు సంబంధించిన మూలభాషా అనిశ్చితిని పాదటిప్పణుల్లో నిలిపాం; ‘ఇదిగో’ ద్వారా הִנֵּה యొక్క దృష్టి-ఆకర్షణ బలాన్ని కాపాడాం.
