id: 2CH.2.7
reference: 2 Chronicles 2:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּֽ/שְׁלַֽח לִ/י֩ עֲצֵ֨י אֲרָזִ֜ים בְּרוֹשִׁ֣ים וְ/אַלְגּוּמִּים֮ מֵֽ/הַ/לְּבָנוֹן֒ כִּ֚י אֲנִ֣י יָדַ֔עְתִּי אֲשֶׁ֤ר עֲבָדֶ֨י/ךָ֙ יֽוֹדְעִ֔ים לִ/כְר֖וֹת עֲצֵ֣י לְבָנ֑וֹן וְ/הִנֵּ֥ה עֲבָדַ֖/י עִם עֲבָדֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/007.yaml
  text: Send me cedar[a], cypress, and algum timber from Lebanon, for I know that your servants know how to cut timber in Lebanon. And behold[b], my servants will be with your servants.
translation:
  language: te
  text: లెబానోను నుండి దేవదారు కలపను, సరళవృక్షాల[a] కలపను, అల్‌గూము కలపను[b] నాకు పంపించు. ఎందుకంటే లెబానోనులోని చెట్లను నరకడంలో నీ సేవకులు నిపుణులని నాకు తెలుసు. ఇదిగో, నా సేవకులు నీ సేవకులతో కలిసి ఉంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సరళవృక్షాలు’ అని అనువదించిన హీబ్రూ పదం బహుశా సైప్రస్, జూనిపర్ లేదా ఫర్ వృక్షాలను సూచించవచ్చు; ఖచ్చితమైన జాతి తెలియదు.
    reason: lexical_alternative
  - marker: b
    text: ‘అల్‌గూము’ను ‘అల్‌మగ్’ అని కూడా పలుకుతారు. కొందరు దీనిని చందనపు కలపగా గుర్తిస్తారు; అయితే ఖచ్చితమైన వృక్షజాతి తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁלַח לִי
  choice: నాకు పంపించు
  rationale: שׁלח ఆజ్ఞార్థక క్రియను సహజమైన ఆధునిక తెలుగులో ఇచ్చాం. ముందున్న וְ సందర్భానుసంధానాన్ని సూచిస్తుంది; తెలుగులో విడిగా ‘మరియు’ చేర్చడం అవసరం లేదు.
- source_word: עֲצֵי אֲרָזִים
  choice: దేవదారు కలపను
  rationale: నిర్మాణ సామగ్రి సందర్భంలో ‘దేవదారు చెట్లు’ కంటే ‘దేవదారు కలప’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בְּרוֹשִׁים
  choice: సరళవృక్షాల కలపను
  rationale: ఈ హీబ్రూ పదం సూచించే ఖచ్చితమైన వృక్షజాతి అనిశ్చితం. ప్రధాన పాఠంలో తెలుగు బైబిలు శైలిలో పరిచితమైన పదాన్ని ఉంచి, ప్రత్యామ్నాయాలను పాదటిప్పణిలో తెలిపాం.
- source_word: אַלְגּוּמִּים
  choice: అల్‌గూము కలపను
  rationale: వృక్షజాతి నిర్ధారణ కాలేదు కాబట్టి ఊహాత్మకమైన ‘చందనం’ వంటి గుర్తింపును ప్రధాన పాఠంలో బలవంతంగా పెట్టకుండా హీబ్రూ పేరును లిప్యంతరీకరించాం.
- source_word: מֵהַלְּבָנוֹן
  choice: లెబానోను నుండి
  rationale: భౌగోళిక మూలాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּי אֲנִי יָדַעְתִּי
  choice: ఎందుకంటే ... నాకు తెలుసు
  rationale: హీబ్రూ సంపూర్ణ క్రియ ఇక్కడ ప్రస్తుతం కలిగిన జ్ఞానాన్ని తెలియజేస్తుంది.
- source_word: אֲשֶׁר עֲבָדֶיךָ יֹדְעִים לִכְרוֹת
  choice: నరకడంలో నీ సేవకులు నిపుణులని
  rationale: ‘నరకడం ఎలాగో తెలుసు’ అనే భావాన్ని సహజమైన తెలుగులో ‘నిపుణులు’ అని వ్యక్తం చేశాం; ఇది వారి నైపుణ్యాన్ని సూచిస్తుంది.
- source_word: עֲצֵי לְבָנוֹן
  choice: లెబానోనులోని చెట్లను
  rationale: ఇక్కడ לְבָנוֹן సంబంధిత ప్రాంతాన్ని సూచిస్తుంది; నరకడం అనే క్రియతో ‘చెట్లు’ అనడం ‘కలప’ కంటే సహజం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: తదుపరి ఏర్పాటుపై శ్రద్ధను ఆకర్షించే హీబ్రూ అవ్యయ బలాన్ని గౌరవప్రదమైన, సుపరిచితమైన తెలుగులో నిలుపుతుంది.
- source_word: עֲבָדַי עִם עֲבָדֶיךָ
  choice: నా సేవకులు నీ సేవకులతో కలిసి ఉంటారు
  rationale: హీబ్రూలో స్పష్టమైన సమాపక క్రియ లేకపోయినా, అభ్యర్థన సందర్భంలో ముందస్తు ఏర్పాటును తెలుగులో భవిష్యత్ రూపంతో సహజంగా వ్యక్తం చేశాం.
