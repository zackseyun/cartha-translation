source:
  edition: WLC
  text: וּ/מִ֤י יַעֲצָר כֹּ֨חַ֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת כִּ֧י הַ/שָּׁמַ֛יִם וּ/שְׁמֵ֥י הַ/שָּׁמַ֖יִם לֹ֣א יְכַלְכְּלֻ֑/הוּ וּ/מִ֤י אֲנִי֙ אֲשֶׁ֣ר אֶבְנֶה לּ֣/וֹ בַ֔יִת כִּ֖י אִם לְ/הַקְטִ֥יר לְ/פָנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/005.yaml
  text: But who has the strength to build a house for him[a], since the heavens, even the highest heavens, cannot contain him? And who am I, that I should build a house for him[b], except to burn incense before him?
translation:
  language: te
  text: అయితే ఆయన కొరకు ఒక గృహం కట్టగల శక్తి ఎవరికి ఉంది? ఆకాశాలు, అత్యున్నత ఆకాశాలు సైతం[a] ఆయనను తమలో ఇముడ్చుకోలేవు. అలాంటప్పుడు, ఆయన కొరకు ఒక గృహం కట్టడానికి నేనెంతటి వాణ్ణి? ఆయన సన్నిధిలో ధూపం వేయడానికే తప్ప[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఆకాశాలు, ఆకాశాల ఆకాశాలు’; ఇది అత్యున్నత ఆకాశాలను సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆయన సన్నిధిలో ధూపం అర్పించడానికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲצָר כֹּחַ
  choice: కట్టగల శక్తి ఎవరికి ఉంది
  rationale: ఈ హీబ్రూ నుడికారం ఒక పని చేయడానికి తగిన శక్తి లేదా సామర్థ్యం ఉండడాన్ని సూచిస్తుంది. తెలుగు అలంకార ప్రశ్నలో ఈ రూపం సహజంగా ఉండి, మానవ అసమర్థతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: ఆయన కోసం ఒక మందిరం కట్టడానికి
  rationale: בַיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఈ సందర్భంలో దేవుని ఆరాధన కోసం కట్టే భవనాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘మందిరం’ సందర్భార్థాన్ని సహజంగా అందిస్తుంది; దేవుడు అందులో పరిమితమై నివసిస్తాడనే భావాన్ని తరువాతి వాక్యం నిరాకరిస్తుంది.
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: ఆకాశాలు, అత్యున్నత ఆకాశాలు సైతం
  rationale: ‘ఆకాశాల ఆకాశాలు’ అనే హీబ్రూ ఉద్ఘాటనాత్మక నుడికారాన్ని సహజ తెలుగులో ‘అత్యున్నత ఆకాశాలు’గా ఇచ్చి, రెండు భాగాల నిర్మాణాన్ని నిలిపాము.
- source_word: לֹא יְכַלְכְּלֻהוּ
  choice: ఆయనను తమలో ఇముడ్చుకోలేవు
  rationale: ఇక్కడ క్రియ దేవుణ్ణి ఆకాశాలు కూడా తమ పరిధిలో ఉంచలేవనే భావాన్ని ఇస్తుంది. ‘తమలో ఇముడ్చుకోలేవు’ దేవుని అపరిమితత్వాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וּמִי אֲנִי
  choice: నేనెవరిని?
  rationale: ఈ ప్రశ్న దేవుని మహత్వం ఎదుట వక్త వినయాన్ని వ్యక్తం చేస్తుంది. సంక్షిప్త తెలుగు రూపం అలంకార ప్రశ్న బలాన్ని కాపాడుతుంది.
- source_word: כִּי אִם
  choice: తప్ప
  rationale: మందిరం దేవుణ్ణి ఇముడ్చుకోవడానికి కాదని, ఆయన సన్నిధిలో ఆరాధన చేయడానికి మాత్రమేనని పరిమితం చేసే భావాన్ని ‘తప్ప’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְהַקְטִיר לְפָנָיו
  choice: ఆయన సన్నిధిలో ధూపం కాల్చడానికి
  rationale: הקטיר అర్పణను పొగగా పైకి లేవనివ్వడాన్ని సూచించగలదు; ఆలయ సందర్భంలో ధూపం కాల్చడం సహజమైన అర్థం. ‘ఆయన సన్నిధిలో’ לפניו యొక్క సంబంధాత్మక, స్థలసూచక భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దేవుని అపరిమితత్వం మరియు మందిరంతో ఆయన సంబంధం
  choice: మందిరం దేవుణ్ణి తనలో ఇముడ్చుకోదు; అది ఆయన సన్నిధిలో ఆరాధన జరిగే స్థలం.
  alternative: మందిరం దేవుణ్ణి పరిమిత స్థలంలో నివసింపజేసే గృహమని అర్థం చేసుకోవడం.
  rationale: ‘ఆకాశాలు, అత్యున్నత ఆకాశాలు సైతం ఆయనను తమలో ఇముడ్చుకోలేవు’ అనే వాక్యం మందిర భాషకు పరిమితిని విధిస్తుంది. చివరి భాగం దేవుడు మందిరంలో బంధింపబడకుండానే అక్కడ ఆయన సన్నిధిలో ఆరాధన జరుగుతుందనే ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. అలంకార ప్రశ్నల బలం, వక్త వినయం, దేవుని అపరిమితత్వం మరియు మందిర ఆరాధన మధ్య ఉన్న మూలపాఠంలోని ఉద్వేగం నిలుపబడ్డాయి.
