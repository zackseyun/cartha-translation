id: 2CH.2.12
reference: 2 Chronicles 2:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֗ה שָׁלַ֧חְתִּי אִישׁ חָכָ֛ם יוֹדֵ֥עַ בִּינָ֖ה לְ/חוּרָ֥ם אָבִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/012.yaml
  text: And now I have sent a wise man[a], skilled in understanding, Huram-abi.
translation:
  language: te
  text: ఇప్పుడు నేను జ్ఞానవంతుడూ వివేకం గలవాడూ అయిన హూరామ్‌-అబీని[a] పంపించాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘హూరామ్‌-అబీ.’ చివరి పదానికి అక్షరార్థం ‘నా తండ్రి’; అయితే ఇక్కడ అది గౌరవబిరుదు లేదా ఈ శిల్పి పేరులో భాగం కావచ్చు. 2 దినవృత్తాంతాలు 4:16లోని ‘హూరామ్‌, అతని తండ్రి’ అనే ప్రయోగాన్ని కూడా పోల్చండి.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: సందర్భంలో రాజు తన ప్రతిస్పందనలో తదుపరి చర్యను పరిచయం చేస్తున్నాడు. తెలుగులో ‘ఇప్పుడు’ సహజంగా ప్రవాహాన్ని తెలియజేస్తుంది; హీబ్రూ సంధాయక ‘మరియు’ను విడిగా అనువదించడం అవసరం లేదు.
- source_word: שָׁלַחְתִּי
  choice: పంపించాను
  rationale: హీబ్రూ సంపూర్ణ క్రియ ఇప్పటికే జరిగిన, ప్రస్తుతం ప్రాసంగికమైన చర్యను సూచిస్తుంది. ఆధునిక తెలుగులో ‘పంపించాను’ దీనిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אִישׁ
  choice: ప్రత్యేక పదంగా అనువదించకుండా వ్యక్తిని సూచించే పురుషరూప విశేషణాల్లో వ్యక్తీకరించబడింది
  rationale: తెలుగులో ‘ఒక మనిషిని’ అని చేర్చడం కంటే, ‘జ్ఞానవంతుడూ ... అయిన హూరామ్‌-అబీని’ అనే నిర్మాణం సహజంగా ఉండి నిర్దిష్ట పురుష వ్యక్తినే సూచిస్తుంది.
- source_word: חָכָם
  choice: జ్ఞానవంతుడు
  rationale: మూలపదపు ప్రత్యక్ష భావమైన ‘wise’ను నిలుపుతుంది. సందర్భంలో నైపుణ్య భావం ఉన్నప్పటికీ, తరువాతి పదబంధం అతని సామర్థ్యాన్ని మరింత వివరిస్తుంది.
- source_word: יוֹדֵעַ בִּינָה
  choice: వివేకం గలవాడు
  rationale: అక్షరార్థంగా ‘వివేకాన్ని తెలిసినవాడు’ అనే భావం. ‘వివేకం గలవాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి జ్ఞానగ్రహణం, కార్యనైపుణ్యం రెండింటికీ చోటిస్తుంది.
- source_word: לְחוּרָם אָבִי
  choice: హూరామ్‌-అబీని
  rationale: హీబ్రూ పదబంధం క్లిష్టమైనది. ‘అబీ’ అక్షరార్థంగా ‘నా తండ్రి’ అయినా, ఇక్కడ గౌరవబిరుదుగా లేదా శిల్పి పేరులో భాగంగా ఉండవచ్చు. లిప్యంతరీకరణ భావాన్ని బలవంతంగా నిర్ణయించకుండా అస్పష్టతను కాపాడుతుంది.
theological_decisions:
- issue: לְחוּרָם אָבִי లోని אָבִי అర్థం
  choice: శిల్పి పేరు లేదా బిరుదులో భాగంగా ‘హూరామ్‌-అబీ’ అని లిప్యంతరీకరించడం
  alternative: ‘హూరామ్‌, నా తండ్రి’ లేదా ‘హూరామ్‌, నా ప్రధాన శిల్పి’
  rationale: ‘తండ్రి’ అనే పదం జీవసంబంధాన్ని మాత్రమే కాకుండా గురువు, సలహాదారు లేదా గౌరవనీయ అధికారి అనే బిరుదు భావాన్నీ కలిగి ఉండవచ్చు. ఈ సందర్భంలో ఒక నిర్దిష్ట వివరణను ప్రధాన పాఠ్యంలో రుద్దకుండా లిప్యంతరీకరణ మూలంలోని సందిగ్ధతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే వాక్యనిర్మాణం. పేరును లిప్యంతరీకరించి మూలంలోని అర్థసందిగ్ధతను పాదటిప్పణిలో వివరించాం.
