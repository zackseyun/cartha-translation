language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ חוּרָם֒ בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר עָשָׂ֔ה אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָ֑רֶץ אֲשֶׁ֣ר נָתַן֩ לְ/דָוִ֨יד הַ/מֶּ֜לֶךְ בֵּ֣ן חָכָ֗ם יוֹדֵ֨עַ֙ שֵׂ֣כֶל וּ/בִינָ֔ה אֲשֶׁ֤ר יִבְנֶה בַּ֨יִת֙ לַ/יהוָ֔ה וּ/בַ֖יִת לְ/מַלְכוּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/011.yaml
  text: Then Huram said[a], “Blessed be Yahweh, the God of Israel, who made the heavens and the earth, who has given King David a wise son, who knows discretion and understanding[c][b], who will build a house for Yahweh and a house for his kingdom.”
translation:
  language: te
  text: 'అప్పుడు హూరాము[a] ఇలా అన్నాడు: “ఆకాశాలనూ భూమినీ సృష్టించిన ఇశ్రాయేలు దేవుడైన యెహోవా స్తుతింపబడుగాక! వివేకమూ అవగాహనయూ గల జ్ఞానవంతుడైన కుమారుణ్ణి ఆయన దావీదు రాజుకు అనుగ్రహించాడు. అతడు యెహోవా కోసం ఒక మందిరాన్నీ, తన రాజ్యం కోసం ఒక భవనాన్నీ[c] నిర్మిస్తాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సమాంతర వృత్తాంతమైన 1 రాజుల గ్రంథంలో ఈ పేరు ‘హీరాము’ అని ఉంటుంది; ఇక్కడ దినవృత్తాంతముల హీబ్రూ పాఠంలో ‘హూరాము’ అనే రూపం ఉంది.
    reason: alternative_reading
  - marker: c
    text: అంటే, అతని రాజపాలనకు సంబంధించిన భవనం; ఇది రాజభవన సముదాయాన్ని సూచిస్తుండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: חוּרָם
  choice: హూరాము
  rationale: దినవృత్తాంతములలో ఉన్న హీబ్రూ రూపం חוּרָם ను రాజుల గ్రంథంలోని ‘హీరాము’తో సమన్వయం చేయకుండా అనుసరించాం.
- source_word: בָּרוּךְ יְהוָה
  choice: యెహోవా స్తుతింపబడుగాక
  rationale: దేవునికి సంబంధించిన ఆశీర్వాద సూత్రాన్ని తెలుగులో సహజమైన, గౌరవప్రదమైన స్తుతి రూపంలో అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణగా ఉంచాం.
- source_word: עָשָׂה אֶת־הַשָּׁמַיִם וְאֶת־הָאָרֶץ
  choice: ఆకాశాన్నీ భూమినీ సృష్టించిన
  rationale: హీబ్రూ సృష్టి భాషను స్పష్టంగా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: נָתַן
  choice: అనుగ్రహించాడు
  rationale: ‘ఇచ్చాడు’ అనే మూలార్థాన్ని నిలుపుతూ, దేవుడు దావీదుకు కుమారుణ్ణి ఇచ్చిన సందర్భంలో గౌరవప్రదమైన సహజ తెలుగు ప్రయోగం.
- source_word: בֵּן חָכָם
  choice: జ్ఞానవంతుడైన కుమారుణ్ణి
  rationale: חָכָם లోని జ్ఞానం మరియు ఆచరణాత్మక సామర్థ్యం రెండింటినీ సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: יוֹדֵעַ שֵׂכֶל וּבִינָה
  choice: వివేకమూ అవగాహనా గల
  rationale: పదక్షరంగా ‘తెలిసిన’ అని అనడం తెలుగులో అసహజం; ‘గల’ అనేది participial వర్ణనను సహజంగా అందిస్తూ రెండు గుణాల భేదాన్ని నిలుపుతుంది.
- source_word: בַּיִת לַיהוָה
  choice: యెహోవా కోసం ఒక మందిరాన్ని
  rationale: ఇక్కడ ‘ఇల్లు’ దేవాలయాన్ని సూచిస్తుంది; ‘మందిరం’ సందర్భార్థాన్ని సాధారణ పాఠకునికి వెంటనే స్పష్టం చేస్తుంది.
- source_word: בַּיִת לְמַלְכוּתוֹ
  choice: తన రాజ్యం కోసం ఒక భవనాన్ని
  rationale: ‘భవనం’ మూలంలోని בַּיִת ను ప్రతిబింబిస్తుంది; ‘తన రాజ్యం కోసం’ అనే రూపం రాజపాలన లేదా రాజభవన సముదాయం అనే సాధ్యార్థాన్ని పూర్తిగా మూసివేయదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది; దానిని బిరుదుతో మార్చకుండా తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- issue: לְמַלְכוּתוֹ యొక్క సూచన
  choice: తన రాజ్యం కోసం ఒక భవనం
  alternative: తన రాజభవనం
  rationale: మూలపాఠం ‘రాజ్యం/రాజపాలన’ అని చెబుతుంది; అది రాజభవన సముదాయాన్ని సూచించే అవకాశం ఉన్నా, అనువాదంలో ఆ వ్యాఖ్యానాన్ని ఖచ్చితార్థంగా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు, గౌరవప్రదమైన గ్రంథశైలి. పొడవైన హీబ్రూ సంబంధవాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం. ‘మందిరం’ మరియు ‘భవనం’ ద్వారా యెహోవా ఆలయం, రాజ్యానికి సంబంధించిన నిర్మాణం మధ్య తేడా స్పష్టంగా ఉంచాం.
