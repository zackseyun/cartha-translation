source:
  edition: WLC
  text: וַ֠/אֲנַחְנוּ נִכְרֹ֨ת עֵצִ֤ים מִן הַ/לְּבָנוֹן֙ כְּ/כָל צָרְכֶּ֔/ךָ וּ/נְבִיאֵ֥/ם לְ/ךָ֛ רַפְסֹד֖וֹת עַל יָ֣ם יָפ֑וֹ וְ/אַתָּ֛ה תַּעֲלֶ֥ה אֹתָ֖/ם יְרוּשָׁלִָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/015.yaml
  text: And we will cut timber from Lebanon[a], as much as you need, and bring it to you as rafts by sea to Joppa[c][b]; and you will take it up to Jerusalem.
translation:
  language: te
  text: 'మేము లెబానోను నుండి నీకు అవసరమైనంత కలపను నరికి, దానిని తెప్పలుగా కట్టి సముద్రమార్గంలో యొప్పేకు నీ దగ్గరకు తెస్తాము.[a] నీవు దానిని యెరూషలేముకు పైకి తీసుకెళ్తావు.[b]


    [a] యొప్పే అనే ఓడరేవు తరువాత కాలంలో యాఫా అని ప్రసిద్ధి చెందింది.


    [b] “పైకి తీసుకెళ్తావు” అని హెబ్రీలో ఉంది; యెరూషలేము ఎత్తైన ప్రదేశంలో ఉండడాన్ని ఇది సూచిస్తుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యొప్పే అనే ఓడరేవు తరువాత కాలంలో యాఫా అని ప్రసిద్ధి చెందింది.
    reason: cultural_note
  - marker: b
    text: “పైకి తీసుకెళ్తావు” అని హెబ్రీలో ఉంది; యెరూషలేము ఎత్తైన ప్రదేశంలో ఉండడాన్ని ఇది సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְרֹת עֵצִים
  choice: కలపను ... నరికి
  rationale: నిర్మాణ సామగ్రి సందర్భంలో עֵצִים చెట్లకంటే ఉపయోగానికి సిద్ధం చేసే కలపను సూచిస్తుంది; כרת చెట్లను నరకడం అనే ప్రత్యక్ష చర్యను తెలియజేస్తుంది.
- source_word: מִן הַלְּבָנוֹן
  choice: లెబానోనులో
  rationale: కలపను నరికే మూలప్రాంతాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; హెబ్రీ מן ఇక్కడ మూలం/ప్రాంతం భావాన్ని ఇస్తుంది.
- source_word: כְּכָל צָרְכֶּךָ
  choice: నీకు అవసరమైనంత
  rationale: సొలొమోను అవసరానికి తగిన పరిమాణమంత అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: רַפְסֹדוֹת
  choice: తెప్పలుగా కట్టి
  rationale: ఈ పదం నీటిమీద తేల్చి తరలించడానికి కలపను కలిపి కట్టిన తెప్పలను సూచిస్తుంది; 'కట్టి' అనేది తెలుగులో రవాణా విధానాన్ని స్పష్టం చేస్తుంది.
- source_word: עַל יָם יָפוֹ
  choice: సముద్రమార్గంలో యొప్పేకు
  rationale: సముద్ర రవాణాను, యొప్పే గమ్యస్థానమని సహజంగా తెలియజేస్తుంది.
- source_word: תַּעֲלֶה אֹתָם
  choice: దానిని ... పైకి తీసుకెళ్తావు
  rationale: עלה లోని పైదిశ భావాన్ని నిలుపుతుంది; 'కలప' తెలుగులో సమూహార్థక ఏకవచనంగా సహజంగా వాడబడుతుంది.
- source_word: יְרוּשָׁלִָם
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన పేరురూపం.
