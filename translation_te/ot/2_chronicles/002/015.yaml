translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ఒప్పందంలోని భవిష్యత్ చర్యలను సరళ భవిష్యత్ రూపాలతో వ్యక్తం చేసి, భౌగోళికమైన 'పైకి' అనే మూలభాషా సూక్ష్మార్థాన్ని నిలిపాం.
