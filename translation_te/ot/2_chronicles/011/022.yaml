- from: రెహబాము మయకా కుమారుడైన అబీయాను అతని సోదరులలో[a] ప్రధాన నాయకుడిగా నియమించాడు; ఎందుకంటే అబీయాను రాజుగా చేయాలని అతడు ఉద్దేశించాడు.
  to: రెహబాము మయకా కుమారుడైన అబీయాను అబీయా సోదరులలో[a] ప్రధానునిగా, నాయకునిగా నియమించాడు; ఎందుకంటే అతనిని రాజుగా చేయాలని రెహబాము ఉద్దేశించాడు.
