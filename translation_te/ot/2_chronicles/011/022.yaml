id: 2CH.11.22
reference: 2 Chronicles 11:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּֽעֲמֵ֨ד לָ/רֹ֧אשׁ רְחַבְעָ֛ם אֶת אֲבִיָּ֥ה בֶֽן מַעֲכָ֖ה לְ/נָגִ֣יד בְּ/אֶחָ֑י/ו כִּ֖י לְ/הַמְלִיכֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/022.yaml
  text: And Rehoboam appointed Abijah son of Maacah as chief among his brothers[a], for he intended to make him king.
translation:
  language: te
  text: రెహబాము మయకా కుమారుడైన అబీయాను అబీయా సోదరులలో[a] ప్రధానునిగా, నాయకునిగా నియమించాడు; ఎందుకంటే అతనిని రాజుగా చేయాలని రెహబాము ఉద్దేశించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అబీయా సోదరులపై”; హీబ్రూ ఉపసర్గ అతని సోదరులతో పోలిస్తే అతనికి ఇచ్చిన ప్రథమ స్థానాన్ని, లేదా వారిపై అతని అధికారాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: నియమించాడు
  rationale: עמד ధాతువు హిఫిల్ రూపంలో ఇక్కడ ఒకరిని అధికార స్థానంలో ఉంచడం లేదా నియమించడం అనే భావం ఇస్తుంది. ఆధునిక తెలుగులో ‘నియమించాడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: לָרֹאשׁ ... לְנָגִיד
  choice: ప్రధాన నాయకుడిగా
  rationale: רֹאשׁ సూచించే ప్రథమ స్థానం, נָגִיד సూచించే నాయకత్వ అధికారాన్ని ఒక సహజమైన తెలుగు పదబంధంలో కలిపి తెలియజేస్తుంది; మూలంలోని రెండు భావాంశాలనూ నిలుపుతుంది.
- source_word: אֶת אֲבִיָּה בֶן מַעֲכָה
  choice: మయకా కుమారుడైన అబీయాను
  rationale: హీబ్రూ పుత్రసంబంధ నిర్మాణాన్ని సహజమైన తెలుగులో నిలిపి, వ్యక్తిపేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: בְּאֶחָיו
  choice: అతని సోదరులలో[a]
  rationale: בְּ ఉపసర్గను సమూహం మధ్య ఉన్న స్థానంగా అర్థం చేసుకొని అనువదించింది. అది వారిపై అతనికి ఉన్న ప్రాధాన్యాన్ని సూచించే అవకాశాన్ని పాదసూచికలో నిలిపింది.
- source_word: כִּי לְהַמְלִיכוֹ
  choice: ఎందుకంటే అబీయాను రాజుగా చేయాలని అతడు ఉద్దేశించాడు
  rationale: כִּי ముందటి చర్యకు కారణాన్ని పరిచయం చేస్తుంది; לְ కలిగిన హిఫిల్ క్రియారూపం రాజుగా చేయాలనే ఉద్దేశాన్ని సూచిస్తుంది. పేరును మళ్లీ ఉపయోగించడం ద్వారా తెలుగు వాక్యంలో కర్మను స్పష్టం చేసింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ప్రధాన నాయకుడు’ అనే పదబంధం మూలంలోని רֹאשׁ మరియు נָגִיד అనే పరస్పర సంబంధిత నాయకత్వ పదాలను అనవసర పునరుక్తి లేకుండా వ్యక్తం చేస్తుంది.
