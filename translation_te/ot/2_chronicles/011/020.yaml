id: 2CH.11.20
reference: 2 Chronicles 11:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַחֲרֶ֣י/הָ לָקַ֔ח אֶֽת מַעֲכָ֖ה בַּת אַבְשָׁל֑וֹם וַ/תֵּ֣לֶד ל֗/וֹ אֶת אֲבִיָּה֙ וְ/אֶת עַתַּ֔י וְ/אֶת זִיזָ֖א וְ/אֶת שְׁלֹמִֽית־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/020.yaml
  text: After her[a], he took Maacah the daughter of Absalom, and she bore him Abijah, Attai, Ziza, and Shelomith.
translation:
  language: te
  text: ఆమె తరువాత అతడు అబ్షాలోము కుమార్తె[a] మయకాను పెండ్లి చేసుకున్నాడు. ఆమె అతనికి అబీయా, అత్తయి, జీజా, షెలోమీతులను కనింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అబ్షాలోము కుమార్తె.’ ‘కుమార్తె’ అనే పదం కొన్నిసార్లు తరువాతి తరానికి చెందిన స్త్రీ సంతతిని కూడా సూచించవచ్చు; అందువల్ల కొందరు దీనిని ‘అబ్షాలోము మనుమరాలు’ అని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחֲרֶיהָ
  choice: ఆమె తరువాత
  rationale: ‘తరువాత’ అనే భావంతో పాటు మూడవ పురుష ఏకవచన స్త్రీలింగ ప్రత్యయం కూడా ఉన్నందున, ముందు పేర్కొన్న భార్యను సూచించేలా నేరుగా అనువదించబడింది.
- source_word: לָקַח
  choice: పెండ్లి చేసుకున్నాడు
  rationale: మూలార్థం ‘తీసుకున్నాడు’; అయితే ఈ సందర్భంలో స్త్రీని భార్యగా స్వీకరించడాన్ని సూచిస్తున్నందున ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ‘పెండ్లి చేసుకున్నాడు’ అని అనువదించబడింది.
- source_word: מַעֲכָה
  choice: మయకా
  rationale: వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בַּת אַבְשָׁלוֹם
  choice: అబ్షాలోము కుమార్తె
  rationale: హీబ్రూ నిర్మాణాన్ని నేరుగా నిలుపుతూ ‘కుమార్తె’ అని అనువదించాం; ఇది కొన్నిసార్లు మరింత దూరపు స్త్రీ సంతతిని కూడా సూచించగలదనే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַתֵּלֶד לוֹ
  choice: ఆమె అతనికి … కనింది
  rationale: అతని పిల్లలకు ఆమె జన్మనిచ్చిందనే హీబ్రూ భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: אֶת אֲבִיָּה וְאֶת עַתַּי וְאֶת זִיזָא וְאֶת שְׁלֹמִית
  choice: అబీయా, అత్తయి, జీజా, షెలోమీతులను
  rationale: వ్యక్తి పేర్లను లిప్యంతరీకరించి, హీబ్రూలో పునరావృతమైన కర్మసూచక అవ్యయాన్ని తెలుగులో విభక్తి ప్రత్యయంతో సహజంగా తెలిపాం.
theological_decisions:
- issue: మయకాను ‘అబ్షాలోము కుమార్తె’గా పేర్కొనడం
  choice: ప్రధాన పాఠ్యంలో మూలంలోని ‘కుమార్తె’ అనే పదాన్నే నిలుపడం
  alternative: అబ్షాలోము మనుమరాలు లేదా స్త్రీ సంతతి
  rationale: హీబ్రూ పాఠ్యం స్పష్టంగా ‘కుమార్తె’ అనే పదాన్ని వాడుతుంది. వంశావళి సందర్భాల్లో అది విస్తృత సంతతి సంబంధాన్ని సూచించే అవకాశం ఉన్నా, ప్రధాన పాఠ్యంలో దానిని నిర్ణయాత్మకంగా మార్చకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. వ్యక్తి పేర్లకు తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపాలను అనుసరించాం; మూలంలోని వంశసంబంధ అస్పష్టతను పాదసూచికలో భద్రపరిచాం.
