base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/016.yaml
  text: And after them[a], from all the tribes of Israel, those who set their hearts to seek Yahweh, the God of Israel, came to Jerusalem to sacrifice to Yahweh[b], the God of their fathers.
translation:
  language: te
  text: వారి తరువాత, ఇశ్రాయేలు గోత్రాలన్నిటి నుండి, ఇశ్రాయేలు దేవుడైన యాహ్వేను వెదకడానికి తమ హృదయాలను అంకితం చేసినవారు[a] తమ పితరుల దేవుడైన యాహ్వేకు బలి అర్పించడానికి యెరూషలేముకు వచ్చారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: ‘తమ హృదయాన్ని ఇచ్చేవారు.’ ఈ నుడికారం యాహ్వేను వెదకడానికి తమ అంతరంగ సంకల్పాన్ని దృఢంగా అంకితం చేయడాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: ‘యెరూషలేముకు వెళ్లారు’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ సందర్భాన్ని, కథన దృష్టికోణాన్ని బట్టి ‘వచ్చారు’ లేదా ‘వెళ్లారు’ అనే భావాల్లో వాడబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵיהֶם
  choice: వారి తరువాత
  rationale: మునుపటి వచనంలో చెప్పబడిన యాజకులు, లేవీయుల తరువాత జరిగిన క్రమాన్ని సూచిస్తుంది; וְ అనే అనుసంధాన భావం తెలుగు వాక్యప్రవాహంలో సహజంగా అంతర్లీనమైంది.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాలన్నిటి నుండి
  rationale: מִן మూలం లేదా బయలుదేరిన సమూహాన్ని సూచిస్తుంది; כֹּל వలన కలిగే సమగ్ర భావాన్ని ‘అన్నిటి’ నిలుపుతుంది.
- source_word: הַנֹּתְנִים אֶת לְבָבָם
  choice: తమ హృదయాన్ని నిలిపినవారు
  rationale: అక్షరార్థంగా ‘తమ హృదయాన్ని ఇచ్చేవారు.’ దేవుణ్ణి వెదకడానికి అంతరంగ సంకల్పాన్ని దృఢంగా మళ్లించడమనే హీబ్రూ నుడికార భావాన్ని ‘హృదయాన్ని నిలిపినవారు’ సహజంగా, గంభీరంగా తెలియజేస్తుంది.
- source_word: לְבַקֵּשׁ
  choice: వెదకాలని
  rationale: ఈ ఆధ్యాత్మిక సందర్భంలో בקש దేవుని వైపు తిరిగి, ఆయనను ఆశ్రయించి వెదకడాన్ని సూచిస్తుంది; ఉద్దేశార్థక לְ ను తెలుగు క్రియారూపం తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన יהוה ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన తెలుగు రూపంలో ఉంచి, యెహోవాను ఇశ్రాయేలు దేవునిగా గుర్తిస్తుంది.
- source_word: בָּאוּ יְרוּשָׁלִַם
  choice: యెరూషలేముకు వచ్చారు
  rationale: בוא సందర్భానుసారం ‘వచ్చారు’ లేదా ‘వెళ్లారు’ కావచ్చు. కథన దృష్టికోణం యూదా–యెరూషలేము వైపు ఉండటంతో ‘వచ్చారు’ ఎంచుకుంది; ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: לִזְבּוֹחַ
  choice: బలి అర్పించడానికి
  rationale: ఉద్దేశాన్ని సూచించే infinitive ను స్పష్టంగా తెలుపుతుంది; זבח లోని బలి కార్యార్థాన్ని సహజమైన తెలుగు ఆరాధనా పదబంధంతో అందిస్తుంది.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: తమ పితరుల దేవుడు
  rationale: ‘తండ్రులు/పితరులు’ అనే హీబ్రూ పుంలింగ బహువచన covenantal సూత్రాన్ని లింగతటస్థంగా మార్చకుండా ‘పితరులు’గా నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణను ఉపయోగించడం మూలంలోని ప్రత్యేక నామాన్ని కాపాడుతుంది.
- issue: אֱלֹהֵי אֲבוֹתֵיהֶם లోని పితృసంబంధ covenantal సూత్రం
  choice: తమ పితరుల దేవుడు
  alternative: తమ పూర్వీకుల దేవుడు
  rationale: ‘పూర్వీకులు’ సహజ ప్రత్యామ్నాయమైనప్పటికీ, మూలంలోని אָבוֹת (‘తండ్రులు/పితరులు’) అనే పుంలింగ రూపాన్ని మరియు దాని ఒడంబడిక సంబంధ ప్రతిధ్వనిని ‘పితరులు’ మరింత దగ్గరగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన వాక్యనిర్మాణం వాడబడింది. ‘హృదయాన్ని నిలిపినవారు,’ ‘పితరులు,’ ‘బలి అర్పించడం’ వంటి పదబంధాలు మూలంలోని ఆధ్యాత్మిక, ఒడంబడిక సంబంధ స్వరాన్ని కాపాడుతాయి. పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంటనే ఉంచబడ్డాయి.
