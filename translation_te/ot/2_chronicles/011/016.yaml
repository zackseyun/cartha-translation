    rationale: The Hebrew idiom means devoting/directing one’s inner resolve toward seeking God. In Telugu, ‘హృదయాన్ని నిలిపిన’ can suggest stopping or fixing the heart in a less clear way; ‘హృదయాలను అంకితం చేసిన’ conveys the intended commitment naturally.
