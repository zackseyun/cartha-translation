language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֱמֹ֕ר אֶל רְחַבְעָ֥ם בֶּן שְׁלֹמֹ֖ה מֶ֣לֶךְ יְהוּדָ֑ה וְ/אֶל֙ כָּל יִשְׂרָאֵ֔ל בִּ/יהוּדָ֥ה וּ/בִנְיָמִ֖ן לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/003.yaml
  text: Speak to Rehoboam son of Solomon[a], king of Judah, and to all Israel in Judah and Benjamin, saying,
translation:
  language: te
  text: 'సొలొమోను కుమారుడైన, యూదా రాజైన రెహబాముతోను, యూదాలోను బెన్యామీనులోను ఉన్న ఇశ్రాయేలీయులందరితోను ఇలా చెప్పు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱמֹר
  choice: చెప్పు
  rationale: אמר క్రియ యొక్క ఆజ్ఞార్థక రూపం. దేవుని సందేశాన్ని నిర్దిష్ట వ్యక్తులతో చెప్పమనే ప్రత్యక్ష ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אֶל
  choice: తో
  rationale: మాట వినవలసిన సంబోధ్యులను సూచించే ఉపసర్గ. తెలుగులో ‘వారితో చెప్పు’ అనే నిర్మాణం సహజంగా ఉంటుంది.
- source_word: רְחַבְעָם
  choice: రెహబాము
  rationale: హీబ్రూ వ్యక్తి పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: בֶּן שְׁלֹמֹה
  choice: సొలొమోను కుమారుడు
  rationale: రెహబాము వంశ సంబంధాన్ని తెలిపే హీబ్రూ సమాస నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מֶלֶךְ יְהוּדָה
  choice: యూదా రాజు
  rationale: యూదాపై రెహబాము రాజపదవిని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְאֶל כָּל יִשְׂרָאֵל
  choice: అలాగే … ఇశ్రాయేలీయులందరితో
  rationale: ఇక్కడ ‘ఇశ్రాయేలు’ ఆ ప్రాంతాల్లో ఉన్న సమస్త ప్రజలను సూచిస్తుంది. తెలుగులో వ్యక్తుల సమూహాన్ని సంబోధిస్తున్న భావాన్ని ‘ఇశ్రాయేలీయులు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: בִּיהוּדָה וּבִנְיָמִן
  choice: యూదా, బెన్యామీను ప్రాంతాల్లో ఉన్న
  rationale: ב ఉపసర్గ తెలిపే స్థానార్థాన్ని నిలుపుతుంది; ఇది కేవలం గోత్ర సంబంధం అని కాక, ఆ ప్రాంతాల్లో ఉన్న ప్రజలు అని స్పష్టం చేస్తుంది.
- source_word: לֵאמֹר
  choice: 'ఇలా చెప్పు:'
  rationale: తదుపరి వచనంలో వచ్చే సందేశాన్ని పరిచయం చేసే హీబ్రూ సూత్రాన్ని సహజమైన తెలుగు ప్రత్యక్ష వాక్య పరిచయంగా అందిస్తుంది.
theological_decisions:
- issue: כָּל יִשְׂרָאֵל అనే పదబంధపు పరిధి
  choice: యూదా, బెన్యామీను ప్రాంతాల్లో ఉన్న ఇశ్రాయేలీయులందరూ
  alternative: యూదా, బెన్యామీనుకు చెందిన ఇశ్రాయేలీయులందరూ
  rationale: హీబ్రూ ב స్థానాన్ని సూచిస్తుంది. అందువల్ల వారి గోత్ర గుర్తింపును మాత్రమే నిర్ధారించకుండా, ఆ రెండు ప్రాంతాల్లో ఉన్న ఇశ్రాయేలు ప్రజలనే సూచించేలా అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. హీబ్రూ వాక్యం తదుపరి సందేశానికి దారితీస్తున్నందున చివర ద్విబిందువు ఉంచబడింది.
