lexical_decisions:
- source_word: וְ/אֶת
  choice: -ను (ద్వితీయావిభక్తి ప్రత్యయం), జాబితాలో సమన్వయం
  rationale: וְאֶת అనే రూపం ముందరి వచనంలో ఉన్న క్రియకు కర్మలుగా ఈ స్థలాల పేర్లను కొనసాగిస్తుంది. తెలుగులో ప్రతి పేరుకు ‘-ను’ చేర్చడం ద్వారా కర్మసూచకమైన אֶת భావం సహజంగా వ్యక్తమవుతుంది; జాబితా నిర్మాణమే וְ సమన్వయాన్ని తెలియజేస్తుంది.
- source_word: בֵּית צוּר
  choice: బేత్-సూరు
  rationale: ఇది స్థలనామం. దాని పదార్థాన్ని అనువదించకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: שׂוֹכוֹ
  choice: శోకో
  rationale: ఇది స్థలనామం. హీబ్రూ రూపాన్ని ఆధారంగా చేసుకొని తెలుగులో సహజంగా పలికే లిప్యంతరీకరణను వాడాం.
- source_word: עֲדֻלָּם
  choice: అదుల్లాము
  rationale: ఇది యూదా ప్రాంతంలోని ప్రసిద్ధ స్థలనామం; పేరును అనువదించకుండా తెలుగులో సుపరిచితమైన రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
