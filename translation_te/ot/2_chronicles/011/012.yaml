base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/012.yaml
  text: And in every city he put shields and spears[a], and he strengthened them very greatly; and Judah and Benjamin belonged to him.
translation:
  language: te
  text: అతడు ప్రతి పట్టణంలోనూ[a] డాళ్లను, ఈటెలను ఉంచి, ఆ పట్టణాలను ఎంతో బలపరిచాడు. యూదా, బెన్యామీను అతని అధీనంలో ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘ప్రతి పట్టణం మరియు పట్టణంలో’ అని పునరుక్తి ఉంది; ఇది ఒక్కొక్క పట్టణాన్ని ప్రత్యేకంగా నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/כָל עִיר וָ/עִיר
  choice: ప్రతి పట్టణంలోనూ
  rationale: హీబ్రూలో ‘పట్టణం పట్టణంలో’ అనే పంపిణీ భావాన్ని తెలిపే పునరుక్తి ఉంది. ఆధునిక తెలుగులో ‘ప్రతి పట్టణంలోనూ’ ఆ భావాన్నీ, ఒక్కొక్క పట్టణంపై ఉన్న నొక్కునూ సహజంగా తెలియజేస్తుంది; మూలంలోని రూపాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: צִנּוֹת
  choice: డాళ్లను
  rationale: ఇది యుద్ధంలో ఉపయోగించే రక్షణ కవచాలను సూచిస్తుంది. సందర్భం పెద్ద శరీర-డాళ్లను అనుమతించినా, పరిమాణాన్ని మూలం ఇక్కడ స్పష్టంగా నొక్కి చెప్పనందున సాధారణమైన ‘డాళ్లు’ ఎంచుకోబడింది.
- source_word: וּ/רְמָחִים
  choice: ఈటెలను
  rationale: రֹמַח్‌కు ఆధునిక తెలుగులో సహజమైన సైనిక పదం ‘ఈటె’; ‘బల్లెములు’ కంటే ఇది సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది.
- source_word: וַֽ/יְחַזְּקֵם
  choice: వాటిని ఎంతో బలపరిచాడు
  rationale: బహువచన ప్రత్యయం ముందున్న పట్టణాలను సూచిస్తుంది. ‘కోటలుగా పటిష్ఠపరిచాడు’ అని విస్తరించకుండా, חזק యొక్క విస్తృతమైన ‘బలపరచు’ భావాన్ని నిలిపింది.
- source_word: לְ/הַרְבֵּה מְאֹד
  choice: ఎంతో
  rationale: ఈ పదసముదాయం క్రియ తీవ్రతను బలంగా పెంచుతుంది. ‘ఎంతో బలపరిచాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ గాఢతను తెలియజేస్తుంది.
- source_word: וַ/יְהִי ל֖/וֹ יְהוּדָה וּ/בִנְיָמִן
  choice: యూదా, బెన్యామీను అతని అధీనంలో ఉన్నాయి
  rationale: היה לו అనే నిర్మాణం స్వాధీనం, పాలనా నియంత్రణ లేదా విధేయతను సూచించగలదు. ఇక్కడ ‘అతని అధీనంలో’ అనేది రాజ్యసంబంధ సందర్భాన్ని సహజంగా తెలియజేస్తూ, కేవలం వ్యక్తిగత ఆస్తి అనే అపార్థాన్ని నివారిస్తుంది.
theological_decisions:
- issue: యూదా, బెన్యామీను రాజుకు సంబంధించినవిగా ఉండడం
  choice: అతని అధీనంలో ఉన్నాయి
  alternative: అతనికి చెందినవిగా ఉన్నాయి
  rationale: మూలంలోని היה לו స్వాధీనం లేదా విధేయత రెండింటినీ సూచించవచ్చు. తెగలను వ్యక్తిగత ఆస్తిగా చూపకుండా రాజపాలన కింద ఉన్నాయనే సందర్భార్థాన్ని వ్యక్తం చేశాము; ప్రత్యేకమైన మతపరమైన వ్యాఖ్యానాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే చారిత్రక వర్ణనకు తగిన గౌరవప్రదమైన శైలి. హీబ్రూ సముచ్చయ శైలిని తెలుగులో అతిగా పునరావృతం చేయకుండా భావసంబంధం నిలిపింది.
