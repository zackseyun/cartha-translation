source:
  edition: WLC
  text: וַ/יִּֽקַּֽח ל֤/וֹ רְחַבְעָם֙ אִשָּׁ֔ה אֶת מָ֣חֲלַ֔ת בן יְרִימ֖וֹת בֶּן דָּוִ֑יד אֲבִיהַ֕יִל בַּת אֱלִיאָ֖ב בֶּן יִשָֽׁי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/018.yaml
  text: Rehoboam took as wife Mahalath the daughter of Jerimoth son of David[a], and Abihail the daughter of Eliab son of Jesse.
translation:
  language: te
  text: రెహబాము దావీదు కుమారుడైన యెరీమోతుకూ, యెష్షయి కుమారుడైన ఎలీయాబు కుమార్తె అబీహయిలుకూ పుట్టిన కుమార్తె మహలతును భార్యగా చేసుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ వంశవివరణ సంక్షిప్తంగా, వ్యాకరణపరంగా అసాధారణంగా ఉంది. అక్షరార్థ పదక్రమం ఇలా ఉంది: “మహలతు, దావీదు కుమారుడైన యెరీమోతు కుమారుడు, యెష్షయి కుమారుడైన ఎలీయాబు కుమార్తె అబీహయిలు.” సందర్భానుసారం మహలతు యెరీమోతుకూ అబీహయిలుకూ కుమార్తె అని అర్థం చేసుకోవచ్చు. కొందరు అబీహయిలును ఈ వంశవివరంలో మరొక వ్యక్తిగా, లేదా తక్కువ సంభావ్యతతో రెహబాము రెండో భార్యగా గ్రహిస్తారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח לוֹ ... אִשָּׁה
  choice: భార్యగా చేసుకున్నాడు
  rationale: ‘తన కోసం ఒక స్త్రీని తీసుకున్నాడు’ అనే హీబ్రూ వివాహ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘పెళ్లి చేసుకున్నాడు’ కంటే మూలంలోని ‘భార్యగా తీసుకోవడం’ భావానికి దగ్గరగా ఉంటుంది.
- source_word: מָחֲלַת
  choice: మహలతు
  rationale: వ్యక్తి పేరును అనువదించకుండా తెలుగు ధ్వన్యనుకరణలో ఇచ్చాం.
- source_word: בן יְרִימוֹת בֶּן דָּוִיד
  choice: దావీదు కుమారుడైన యెరీమోతుకు ... పుట్టిన
  rationale: మసొరేటిక్ పాఠంలో మహలతు ముందు పురుషలింగ ‘కుమారుడు’ (בן) ఉన్నప్పటికీ, వాక్యసందర్భం మహలతును యెరీమోతు సంతానంగా గుర్తిస్తుంది. తెలుగులో వంశసంబంధం స్పష్టంగా ఉండేలా ఇచ్చి, పాఠంలోని అసాధారణతను పాదసూచికలో తెలిపాం.
- source_word: אֲבִיהַיִל בַּת אֱלִיאָב בֶּן יִשָׁי
  choice: యెష్షయి కుమారుడైన ఎలీయాబు కుమార్తె అబీహయిలు
  rationale: అబీహయిలును మహలతు తల్లిగా సూచించే వంశవివరంగా గ్రహించాం; పేర్లను మూలానికి అనుగుణంగా ధ్వన్యనుకరించాం.
theological_decisions:
- issue: వంశావళిలో పేర్ల మధ్య వాక్యనిర్మాణ సంబంధం
  choice: మహలతు యెరీమోతు మరియు అబీహయిలుకు పుట్టిన కుమార్తె; రెహబాము ఇక్కడ ఒక్క భార్యనే చేసుకున్నాడు.
  alternative: అబీహయిలు రెండో భార్య కావచ్చు; లేదా అదే కుటుంబవివరంలో మరో పేరుగా ఉండవచ్చు.
  rationale: మూలంలో ‘భార్య’ ఏకవచనంలో ఉంది; దినవృత్తాంతాలలో కనిపించే సంక్షిప్త వంశావళి శైలికి అనుగుణంగా మహలతు తండ్రి, తల్లి వంశాలను ఇక్కడ కలిపి చెప్పినట్లు గ్రహించడం సందర్భానికి అత్యంత సహజం. అయితే హీబ్రూ నిర్మాణం అసాధారణమైనందున ఇతర అర్థసాధ్యతలను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. సంక్లిష్టమైన మూల వంశావళిని ప్రధాన పాఠంలో చదవడానికి సులభంగా చేసి, నిజమైన పాఠ్య సందిగ్ధతను పాదసూచికలో స్పష్టంగా నిలిపాం.
