id: 2CH.11.14
reference: 2 Chronicles 11:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי עָזְב֣וּ הַ/לְוִיִּ֗ם אֶת מִגְרְשֵׁי/הֶם֙ וַ/אֲחֻזָּתָ֔/ם וַ/יֵּלְכ֥וּ לִ/יהוּדָ֖ה וְ/לִֽ/ירוּשָׁלִָ֑ם כִּֽי הִזְנִיחָ֤/ם יָֽרָבְעָם֙ וּ/בָנָ֔י/ו מִ/כַּהֵ֖ן לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/014.yaml
  text: For the Levites left their pasturelands and their possessions and went to Judah and Jerusalem[b][a], because Jeroboam and his sons had rejected them from serving as priests to Yahweh.
translation:
  language: te
  text: లేవీయులు తమ మేతభూములను[a], తమ ఆస్తులను విడిచిపెట్టి యూదాకు, యెరూషలేముకు వెళ్లిపోయారు; ఎందుకంటే యెరోబాము, అతని కుమారులు వారిని యాహ్వేకు యాజకులుగా సేవ చేయకుండా తొలగించారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వారి పట్టణాలకు అనుబంధంగా ఉన్న బహిరంగ భూములు’ లేదా ‘పశువులు మేపే భూములు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘యాహ్వేకు యాజకులుగా సేవ చేయకుండా వారిని తిరస్కరించారు’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: מִגְרְשֵׁיהֶם
  choice: తమ మేతభూములను
  rationale: מִגְרָשׁ లేవీయుల పట్టణాలకు అనుబంధంగా ఉన్న బహిరంగ లేదా పశువులు మేపే భూమిని సూచిస్తుంది. ‘మేతభూములు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, భూమి వినియోగ భావాన్ని నిలుపుతుంది.
- source_word: אֲחֻזָּתָם
  choice: తమ భూస్వాస్థ్యాలను
  rationale: אֲחֻזָּה సొంతంగా కలిగిన భూమి లేదా స్థిరాస్తిని సూచిస్తుంది. ‘భూస్వాస్థ్యాలు’ భూమికి సంబంధించిన వారి హక్కుగల ఆస్తులను తెలియజేస్తుంది; ‘వారసత్వం’ అనే అదనపు నిబంధనాత్మక భావాన్ని చేర్చదు.
- source_word: וַיֵּלְכוּ לִיהוּדָה וְלִירוּשָׁלִָם
  choice: యూదాకు, యెరూషలేముకు వెళ్లిపోయారు
  rationale: הלך తో ל గమ్యస్థానం వైపు కదలికను సూచిస్తుంది. తమ భూములను వదిలిన సందర్భంలో ‘వెళ్లిపోయారు’ సహజమైన కథన భాష.
- source_word: הִזְנִיחָם
  choice: వారిని తొలగించారు
  rationale: זנח హిఫీల్ రూపం తిరస్కరించడం, వెలివేయడం లేదా ఒక సేవ నుంచి తప్పించడం అనే భావాలను కలిగి ఉంది. ఇక్కడ తరువాతి పదబంధం యాజక సేవ నుంచి వారిని తప్పించిన సంస్థాగత చర్యను స్పష్టం చేస్తుంది.
- source_word: מִכַּהֵן
  choice: యాజకులుగా సేవచేయకుండా
  rationale: מן తో కూడిన כהן క్రియారూపం యాజక సేవను చేయనివ్వకపోవడం లేదా దాని నుంచి తొలగించడం అనే భావాన్ని ఇస్తుంది. ఈ తెలుగు రూపం ఆ నిరోధక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: లామెడ్‌ను ‘కు’గా చూపుతూ, దేవుని వ్యక్తిగత నామమైన יהוהను ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: כִּי ... כִּי
  choice: ఎందుకంటే ... అందువల్ల
  rationale: మొదటి כִּי ముందరి వచనానికి వివరణను ప్రారంభిస్తుంది; రెండవది లేవీయులు వెళ్లడానికి కారణాన్ని తెలుపుతుంది. తెలుగులో సహజమైన కారణ-ఫలిత క్రమం కోసం ఉపవాక్యాలను పునఃక్రమీకరించి ‘ఎందుకంటే ... అందువల్ల’గా ఇచ్చాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో చతురక్షర దైవనామం నేరుగా ఉంది. దాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా ‘యాహ్వే’ అని ఇచ్చాం.
- issue: లేవీయులను యాజక సేవ నుంచి తొలగించిన చర్య స్వభావం
  choice: యాజకులుగా సేవచేయకుండా తొలగించారు
  alternative: వారిని తిరస్కరించారు
  rationale: הִזְנִיחָם వ్యక్తిగత తిరస్కరణను, అధికారికంగా సేవ నుంచి తప్పించడాన్ని రెండింటినీ సూచించగలదు. సందర్భంలోని מִכַּהֵן కారణంగా ప్రధాన పాఠంలో సేవ నుంచి తొలగింపు భావాన్ని ఇచ్చి, విస్తృతమైన ‘తిరస్కరించారు’ భావాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలిని వాడాం. కారణాన్ని తెలిపే హీబ్రూ ఉపవాక్యాన్ని తెలుగులో సహజంగా ఉండేందుకు ముందుకు తెచ్చాం. ‘మేతభూములు’, ‘భూస్వాస్థ్యాలు’ అనే పదాలు లేవీయుల పట్టణాలకు సంబంధించిన భూముల రెండు కోణాలను వేరుగా నిలుపుతాయి.
