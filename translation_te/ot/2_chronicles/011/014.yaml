revisions:
- from: ఎందుకంటే, యెరోబాము, అతని కుమారులు లేవీయులను యాహ్వేకు యాజకులుగా సేవచేయకుండా తొలగించారు[b]. అందువల్ల లేవీయులు తమ మేతభూములను[a], తమ భూస్వాస్థ్యాలను విడిచిపెట్టి యూదాకు, యెరూషలేముకు వెళ్లిపోయారు.
  to: లేవీయులు తమ మేతభూములను[a], తమ ఆస్తులను విడిచిపెట్టి యూదాకు, యెరూషలేముకు వెళ్లిపోయారు; ఎందుకంటే యెరోబాము, అతని కుమారులు వారిని యాహ్వేకు యాజకులుగా సేవ చేయకుండా తొలగించారు[b].
  rationale: The revision restores the source’s narrative-then-cause sequence, smooths the Telugu syntax, and replaces an awkward compound with the idiomatic ‘ఆస్తులు’ without losing the contextual sense of landed holdings. Both footnote anchors are retained and correctly attached to the terms or clause they elucidate.
