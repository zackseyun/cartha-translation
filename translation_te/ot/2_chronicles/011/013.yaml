- from: ఇశ్రాయేలు దేశమంతటా ఉన్న యాజకులు, లేవీయులు తమ ప్రాంతాలన్నిటి నుండి వచ్చి అతని పక్షాన నిలిచారు.[a]
  to: ఇశ్రాయేలు దేశమంతటా ఉన్న యాజకులూ లేవీయులూ తమ ప్రాంతాలన్నిటి నుండీ అతని పక్షాన నిలబడ్డారు.[a]
