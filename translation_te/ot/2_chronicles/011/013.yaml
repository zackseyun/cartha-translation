  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/כֹּהֲנִים֙ וְ/הַ/לְוִיִּ֔ם אֲשֶׁ֖ר בְּ/כָל יִשְׂרָאֵ֑ל הִֽתְיַצְּב֥וּ עָלָ֖י/ו מִ/כָּל גְּבוּלָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/013.yaml
  text: And the priests and the Levites who were in all Israel took their stand with him from all their territories[a].
translation:
  language: te
  text: ఇశ్రాయేలు దేశమంతటా ఉన్న యాజకులూ లేవీయులూ తమ ప్రాంతాలన్నిటి నుండీ అతని పక్షాన నిలబడ్డారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతని ఎదుట హాజరయ్యారు,” లేదా “అతని వద్ద నిలబడ్డారు.” హీబ్రూ ప్రయోగం రెహబాము ఎదుట ప్రత్యక్షంగా హాజరుకావడాన్ని గానీ, అతని పక్షం వహించడాన్ని గానీ సూచించవచ్చు; సందర్భం అతనికి విధేయంగా మద్దతు ఇవ్వడానికే మొగ్గుచూపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַכֹּהֲנִים
  choice: యాజకులు
  rationale: నిర్దిష్ట బహువచన నామవాచకాన్ని ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకలో సహజమైన ‘యాజకులు’గా అనువదించాం; వాక్యారంభంలోని וְ భావాన్ని తెలుగు కథన ప్రవాహంలో ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండా సంయోజనతో వ్యక్తం చేశాం.
- source_word: וְהַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి గోత్రానికి చెందిన మతసేవక వర్గానికి తెలుగులో స్థిరపడిన పేరును వాడాం.
- source_word: אֲשֶׁר בְּכָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేశమంతటా ఉన్న
  rationale: వారు కేవలం యూదాలో కాక ఇశ్రాయేలు అంతటా నివసించారని తెలిపే సంబంధవాచక భావాన్ని సహజమైన తెలుగులో నిలిపాం.
- source_word: הִתְיַצְּבוּ עָלָיו
  choice: అతని పక్షాన నిలిచారు
  rationale: హిత్పయేల్ క్రియలోని ఉద్దేశపూర్వకంగా నిలబడే భావాన్నీ, సందర్భంలో రెహబాముకు మద్దతుగా చేరిన భావాన్నీ వ్యక్తం చేస్తుంది; మూలంలోని భౌతికంగా అతని ఎదుట హాజరయ్యారనే సాధ్యార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: מִכָּל גְּבוּלָם
  choice: తమ ప్రాంతాలన్నిటి నుండి
  rationale: גְּבוּל ఇక్కడ సరిహద్దు రేఖలకన్నా వారు నివసించిన భూభాగాలు లేదా ప్రాంతాలను సూచిస్తుంది; బహువచన ప్రత్యయ భావాన్ని ‘తమ ప్రాంతాలన్నిటి’గా తెలిపాం.
theological_decisions:
- issue: הִתְיַצְּבוּ עָלָיו అనే పదబంధం విధేయతను సూచిస్తుందా లేక కేవలం హాజరుకావడాన్ని సూచిస్తుందా
  choice: అతని పక్షాన నిలిచారు
  alternative: అతని ఎదుట హాజరయ్యారు; అతని దగ్గర నిలిచారు
  rationale: తదుపరి సందర్భంలో యాజకులు, లేవీయులు రెహబామును ఆశ్రయించడం కనిపిస్తుంది కాబట్టి విధేయత లేదా మద్దతు ప్రధాన భావంగా ఉంది. అయినా హీబ్రూ ప్రయోగంలోని స్థలసంబంధమైన సాధ్యార్థాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదమైన కథన శైలిలో రూపొందించాం. ‘పక్షాన నిలిచారు’ అనే సహజ ప్రయోగంతో సందర్భార్థాన్ని తెలిపి, మూలంలోని నిజమైన ద్వంద్వార్థాన్ని పాదసూచికలో నిలిపాం.
