  text: וַ/יָּבֶן֩ וַ/יִּפְרֹ֨ץ מִ/כָּל בָּנָ֜י/ו לְֽ/כָל אַרְצ֧וֹת יְהוּדָ֣ה וּ/בִנְיָמִ֗ן לְ/כֹל֙ עָרֵ֣י הַ/מְּצֻר֔וֹת וַ/יִּתֵּ֥ן לָ/הֶ֛ם הַ/מָּז֖וֹן לָ/רֹ֑ב וַ/יִּשְׁאַ֖ל הֲמ֥וֹן נָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/023.yaml
  text: And he acted wisely and distributed some of all his sons throughout all the lands of Judah and Benjamin[a], to all the fortified cities[c][b]; and he gave them abundant provisions and sought many wives for them.
translation:
  language: te
  text: అతడు వివేకంతో వ్యవహరించి[a], తన కుమారులలో కొందరిని యూదా, బెన్యామీను ప్రాంతాలన్నిటిలోని ప్రాకార పట్టణాలన్నిటిలో విస్తరించి ఉంచాడు[b]. వారికి సమృద్ధిగా ఆహార సామగ్రి ఇచ్చి, వారికోసం అనేక భార్యలను వెదికాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అవగాహన చూపించి’ లేదా ‘వివేచనతో వ్యవహరించి.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ వాక్యం అతడు తన కుమారులలో కొందరిని వివిధ ప్రాకార పట్టణాల్లో విస్తరించి ఉంచాడని సూచించే అవకాశం ఎక్కువ; కుమారులందరినీ ప్రతి ప్రాంతానికీ పంపాడని కాదు.
    reason: lexical_alternative
  - marker: c
    text: అంటే, అతడు తన కుమారులకు వివాహాలు ఏర్పాటు చేశాడు. హీబ్రూలో అక్షరార్థంగా, ‘అనేక భార్యలను వెదికాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֶן
  choice: వివేకంతో వ్యవహరించి
  rationale: בין అనే ధాతువు ఇక్కడ అవగాహన లేదా వివేచనను ప్రదర్శిస్తూ వ్యవహరించడాన్ని సూచిస్తుంది. రాజ్య పరిపాలన సందర్భంలో ‘వివేకంతో వ్యవహరించి’ అనేది సహజంగా ఉండి, కేవలం ‘అర్థం చేసుకొని’ అనే పరిమిత భావాన్ని నివారిస్తుంది.
- source_word: וַיִּפְרֹץ מִכָּל בָּנָיו
  choice: తన కుమారులలో కొందరిని ... అక్కడక్కడ నియమించాడు
  rationale: פרץ ఇక్కడ కుమారులను వివిధ ప్రాంతాలకు విస్తరింపజేయడం లేదా పంపిణీ చేయడం అనే భౌగోళిక భావాన్ని ఇస్తుంది. מן యొక్క భాగసూచక భావాన్ని ‘కుమారులలో కొందరిని’ తెలియజేస్తుంది; సందర్భం ఉద్దేశపూర్వకంగా ప్రాకార పట్టణాల్లో ఉంచడాన్ని సూచిస్తున్నందున ‘నియమించాడు’ వాడబడింది.
- source_word: לְכָל אַרְצוֹת יְהוּדָה וּבִנְיָמִן
  choice: యూదా, బెన్యామీను ప్రాంతాలన్నిటిలోని
  rationale: אֲרָצוֹת ఇక్కడ వేర్వేరు దేశాలకన్నా యూదా, బెన్యామీనుల భూభాగాలు లేదా పరిపాలనా ప్రాంతాలను సూచిస్తుంది. ఆధునిక తెలుగులో ‘ప్రాంతాలు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: לְכֹל עָרֵי הַמְּצֻרוֹת
  choice: ప్రాకార పట్టణాలన్నిటిలో
  rationale: מְצֻרוֹת రక్షణార్థం కోటగోడలు లేదా ప్రాకారాలు గల బలమైన పట్టణాలను సూచిస్తుంది. ‘ప్రాకార పట్టణాలు’ మూలార్థాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וַיִּתֵּן לָהֶם הַמָּזוֹן לָרֹב
  choice: వారికి సమృద్ధిగా ఆహార సామగ్రి ఇచ్చి
  rationale: מָזוֹן అంటే ఆహారం లేదా జీవనోపాధికి కావలసిన సరఫరా; לָרֹב సమృద్ధిని సూచిస్తుంది. ‘ఆహార సామగ్రి’ concrete provision భావాన్ని అందిస్తుంది.
- source_word: וַיִּשְׁאַל הֲמוֹן נָשִׁים
  choice: వారికోసం అనేకమంది భార్యలను వెదికాడు
  rationale: שׁאל సాధారణంగా అడగడం, కోరడం లేదా వెదకడాన్ని సూచిస్తుంది. వివాహ సందర్భంలో కుమారుల కోసం భార్యలను వెదికి వివాహాలు ఏర్పాటు చేయడం భావ్యం; ‘వారికోసం’ సందర్భం నుంచి పూరించబడింది.
