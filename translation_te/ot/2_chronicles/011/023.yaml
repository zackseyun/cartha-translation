translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి వాడబడింది. పరిపాలనా సందర్భాన్ని సహజంగా వ్యక్తం చేస్తూనే, కుమారుల పంపిణీ మరియు భార్యలను వెదకడం గురించిన హీబ్రూ పదబంధాల అనిశ్చితిని పాదసూచికల్లో నిలుపుకున్నాం.
