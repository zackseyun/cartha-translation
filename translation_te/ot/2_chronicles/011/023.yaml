  to: అతడు వివేకంతో వ్యవహరించి[a], తన కుమారులలో కొందరిని యూదా, బెన్యామీను ప్రాంతాలన్నిటిలోని ప్రాకార పట్టణాలన్నిటిలో విస్తరించి ఉంచాడు[b]. వారికి సమృద్ధిగా ఆహార సామగ్రి ఇచ్చి, వారికోసం అనేక భార్యలను వెదికాడు[c].
  rationale: 'సవరింపు రెండు పరిమిత మార్పులకే పరిమితం చేయబడింది: ‘నియమించాడు’ స్థానంలో మూలంలోని విస్తరింపు భావాన్ని కాపాడే ‘విస్తరించి ఉంచాడు’ వాడబడింది; అలాగే భార్యల సంఖ్యను తెలిపే పదబంధాన్ని సహజమైన తెలుగు రూపానికి మార్చాం. కుమారుల కోసం భార్యలను వెదకడం అనే సందర్భానుగత భావం మరియు దానిపై ఉన్న వివరణాత్మక పాదసూచిక యథాతథంగా నిలుపబడ్డాయి.'
