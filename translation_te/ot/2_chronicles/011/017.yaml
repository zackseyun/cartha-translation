id: 2CH.11.17
reference: 2 Chronicles 11:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְחַזְּקוּ֙ אֶת מַלְכ֣וּת יְהוּדָ֔ה וַֽ/יְאַמְּצ֛וּ אֶת רְחַבְעָ֥ם בֶּן שְׁלֹמֹ֖ה לְ/שָׁנִ֣ים שָׁל֑וֹשׁ כִּ֣י הָֽלְכ֗וּ בְּ/דֶ֧רֶךְ דָּוִ֛יד וּ/שְׁלֹמֹ֖ה לְ/שָׁנִ֥ים שָׁלֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/017.yaml
  text: So they strengthened the kingdom of Judah and strengthened Rehoboam son of Solomon for three years[a], because for three years they walked in the way of David and Solomon.
translation:
  language: te
  text: ఈ విధంగా వారు యూదా రాజ్యాన్ని బలపరిచారు; సొలొమోను కుమారుడైన రెహబామును మూడు సంవత్సరాలపాటు బలపరిచారు.[a] ఎందుకంటే మూడు సంవత్సరాలపాటు వారు దావీదు, సొలొమోనుల మార్గంలో నడిచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రెహబామును దృఢపరిచారు.”
    reason: אמץ అనే క్రియకు ‘దృఢపరచడం’ అనే సమీపార్థక అనువాదం కూడా సాధ్యమే. ప్రధాన పాఠంలోని ‘బలపరిచారు’ ఈ సందర్భంలో వ్యక్తిని బలంగా చేయడం అనే భావానికి మరింత సహజమైన ఆధునిక తెలుగు ప్రయోగం.
lexical_decisions:
- source_word: וַיְחַזְּקוּ
  choice: బలపరిచారు
  rationale: חזק పియేల్ రూపంలోని ‘బలంగా చేయడం, స్థిరపరచడం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సైనిక కోటబందీ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: מַלְכוּת יְהוּדָה
  choice: యూదా రాజ్యాన్ని
  rationale: సందర్భంలో రాజకీయ రాజ్యం ఉద్దేశించబడింది; ‘రాజ్యాధికారం’ అనే సాధ్యమైన భావం కంటే ‘యూదా రాజ్యం’ సందర్భానికి తగినది.
- source_word: וַיְאַמְּצוּ
  choice: దృఢపరిచారు
  rationale: אמץ పియేల్ రూపంలోని బలపరచడం లేదా స్థిరపరచడం అనే భావాన్ని నిలుపుతూ, ముందున్న חזקకు భిన్నమైన తెలుగు పదాన్ని ఉపయోగిస్తుంది. ప్రత్యక్ష కర్మ రెహబాము కాబట్టి కేవలం ‘ప్రోత్సహించారు’ కంటే ఇది తగినది.
- source_word: רְחַבְעָם בֶּן שְׁלֹמֹה
  choice: సొలొమోను కుమారుడైన రెహబామును
  rationale: తెలుగు వాక్యనిర్మాణానికి సహజంగా పుత్రసంబంధాన్ని పేరుకు ముందు ఉంచి, హీబ్రూ ప్రత్యక్ష కర్మను స్పష్టంగా నిలుపుతుంది.
- source_word: לְשָׁנִים שָׁלוֹשׁ
  choice: మూడు సంవత్సరాలపాటు
  rationale: కాలవ్యవధిని సూచించే לְను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; హీబ్రూలో రెండుసార్లు వచ్చిన కాలవ్యవధిని అనువాదంలోనూ రెండుసార్లు నిలిపింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందు చెప్పిన బలపరచడానికి కారణాన్ని పరిచయం చేసే స్పష్టమైన కారణార్థక అనుసంధానం.
- source_word: הָלְכוּ
  choice: నడిచారు
  rationale: జీవన ప్రవర్తనను సూచించే హీబ్రూ రూపకాన్ని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా నిలుపుతుంది.
- source_word: בְּדֶרֶךְ דָּוִיד וּשְׁלֹמֹה
  choice: దావీదు, సొలొమోనుల మార్గంలో
  rationale: ఇద్దరూ చూపిన ఒకే జీవన పద్ధతిని సూచించే ఏకవచన ‘మార్గం’ను నిలుపుతుంది.
theological_decisions:
- issue: ‘దావీదు, సొలొమోనుల మార్గం’ అనే మాటకు ఇచ్చే విలువనిర్ణయం
  choice: మూలంలోని రూపకాన్ని అలాగే ఉంచి, అది ఆ మూడు సంవత్సరాలకు సంబంధించిన సానుకూల చారిత్రక అంచనా అని మాత్రమే తెలియజేయడం
  alternative: ‘దావీదు, సొలొమోనులవలె యెహోవాకు నమ్మకంగా ఉన్నారు’ అని విస్తరించడం
  rationale: వచనం వారి ప్రవర్తనను మూడు సంవత్సరాలకు పరిమితం చేస్తుంది. జీవితాంత విశ్వాసం లేదా సంపూర్ణ నీతిని అనువాదంలో చేర్చడానికి మూలపాఠం ఆధారం ఇవ్వదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూలోని పునరుక్త కాలవ్యవధి మరియు ‘మార్గంలో నడవడం’ అనే రూపకం ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి.
