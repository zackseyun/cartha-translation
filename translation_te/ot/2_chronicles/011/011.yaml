source:
  edition: WLC
  text: וַ/יְחַזֵּ֖ק אֶת הַ/מְּצֻר֑וֹת וַ/יִּתֵּ֤ן בָּ/הֶם֙ נְגִידִ֔ים וְ/אֹצְר֥וֹת מַאֲכָ֖ל וְ/שֶׁ֥מֶן וָ/יָֽיִן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/011.yaml
  text: He strengthened the fortified places and put commanders in them[a], along with stores of food, oil[c][b], and wine.
translation:
  language: te
  text: అతడు దుర్గాలను బలపరచి, వాటిలో అధిపతులను[a] నియమించాడు. ఆహారం, నూనె, ద్రాక్షామద్యం నిల్వలను[b] కూడా వాటిలో ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నాయకులను,” “పాలకులను,” “అధికారులను,” లేదా “సేనాధిపతులను.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదం “నిల్వగదులు” అని లేదా నిల్వచేసిన సరఫరాలు అని అర్థమివ్వగలదు; ఇక్కడ సందర్భం నిల్వ ఉంచిన ఆహార పదార్థాలను సూచిస్తోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: మరింత బలపరిచి
  rationale: పియేల్ రూపంలోని חזק ఏదైనా బలంగా లేదా సురక్షితంగా చేయడాన్ని సూచిస్తుంది. తరువాత వచ్చే నామవాచకంలోని కోట భావాన్ని అనవసరంగా పునరుక్తి చేయకుండా చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמְּצֻרוֹת
  choice: ప్రాకారాలతో బలపరచబడిన స్థలాలను
  rationale: ఈ పదం కోటలు, దుర్గాలు లేదా రక్షణ ఏర్పాట్లు గల స్థలాలను సూచించగలదు. విస్తృతార్థాన్ని నిలుపుతూ ఆధునిక తెలుగు పాఠకునికి అర్థమయ్యే విధంగా అనువదించబడింది.
- source_word: וַיִּתֵּן בָּהֶם
  choice: వాటిలో ... నియమించాడు
  rationale: נתן + ב నిర్మాణం ఆ స్థలాల్లో వ్యక్తులను ఉంచడం లేదా బాధ్యతతో నియమించడం అనే భావాన్ని ఇస్తుంది. అధికార పదవి సందర్భంలో ‘నియమించాడు’ సహజంగా ఉంది; ‘వాటిలో’ మూలంలోని స్థానార్థాన్ని నిలుపుతుంది.
- source_word: נְגִידִים
  choice: అధికారులను
  rationale: נָגִיד నాయకుడు, పాలకుడు, అధికారి లేదా సేనాధిపతిని సూచించవచ్చు. సందర్భం సైనికమైనదైనా మూలపదం తప్పనిసరిగా నిర్దిష్ట సైనిక హోదాను పేర్కొనదు; అందువల్ల ‘అధికారులు’ విస్తృతార్థాన్ని కాపాడుతుంది.
- source_word: וְאֹצְרוֹת
  choice: నిల్వలను
  rationale: אֹצָרוֹת నిల్వగదులను లేదా నిల్వచేసిన సరఫరాలను సూచించగలదు. తరువాత ఆహారం, నూనె, ద్రాక్షారసం రావడం వల్ల ఇక్కడ నిల్వ ఉంచిన సరఫరాలు అనే భావం సహజంగా సరిపోతుంది; అస్పష్టతను పాదసూచికలో తెలిపాం.
- source_word: מַאֲכָל
  choice: ఆహారం
  rationale: సాధారణంగా తినే పదార్థం లేదా ఆహార సరఫరాలను సూచించే స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: שֶׁמֶן
  choice: నూనె
  rationale: שֶׁמֶן‌కు ప్రామాణిక సమానార్థకం. సందర్భంలో ఇది బహుశా ఒలీవ నూనె అయినప్పటికీ మూలంలో ఆ ప్రత్యేకత లేదు.
- source_word: יָיִן
  choice: ద్రాక్షారసం
  rationale: יין ద్రాక్షతో చేసిన మద్యపానీయాన్ని సూచిస్తుంది. ఆధునిక తెలుగు బైబిలు శైలిలో ‘ద్రాక్షారసం’ సహజమైన, గౌరవప్రదమైన ఎంపిక.
