translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక వర్ణన. మూలంలోని రెండు వరుస క్రియలను తెలుగులో సులభంగా చదవడానికి రెండు వాక్యాలుగా అమర్చాం. ‘ప్రాకారాలతో బలపరచబడిన స్థలాలు’ అనే విస్తృత పదబంధం కోటలు/దుర్గాలు అనే ప్రత్యామ్నాయాలను అతిగా నిర్దిష్టం చేయకుండా సూచిస్తుంది.
