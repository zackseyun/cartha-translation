id: 2CH.11.21
reference: 2 Chronicles 11:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֶּאֱהַ֨ב רְחַבְעָ֜ם אֶת מַעֲכָ֣ה בַת אַבְשָׁל֗וֹם מִ/כָּל נָשָׁי/ו֙ וּ/פִ֣ילַגְשָׁ֔י/ו כִּ֠י נָשִׁ֤ים שְׁמוֹנֶֽה עֶשְׂרֵה֙ נָשָׂ֔א וּ/פִֽילַגְשִׁ֖ים שִׁשִּׁ֑ים וַ/יּ֗וֹלֶד עֶשְׂרִ֧ים וּ/שְׁמוֹנָ֛ה בָּנִ֖ים וְ/שִׁשִּׁ֥ים בָּנֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/021.yaml
  text: Rehoboam loved Maacah the daughter of Absalom more than all his wives and his concubines[a], for he had taken eighteen wives and sixty concubines, and he fathered twenty-eight sons and sixty daughters.
translation:
  language: te
  text: రెహబాము అబ్షాలోము కుమార్తె మయకాను తన భార్యలందరిలోను, ఉపపత్నులందరిలోను ఎక్కువగా ప్రేమించాడు[a]; ఎందుకంటే అతడు పద్దెనిమిది మంది భార్యలను, అరవై మంది ఉపపత్నులను చేసుకున్నాడు, అలాగే ఇరవై ఎనిమిది మంది కుమారులకు, అరవై మంది కుమార్తెలకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అబ్షాలోము వంశస్థురాలు’ కావచ్చు; హెబ్రీలో ‘కుమార్తె’ అనే పదం వంశావళి సందర్భాల్లో కొన్నిసార్లు విస్తృత అర్థంలో వాడబడుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: ప్రేమించాడు
  rationale: אהב ప్రేమ లేదా అనురాగాన్ని నేరుగా సూచిస్తుంది; పోలిక భావం తరువాతి מִכָּל పదబంధం ద్వారా వస్తుంది.
- source_word: בַת אַבְשָׁלוֹם
  choice: అబ్షాలోము కుమార్తె
  rationale: בַּת యొక్క సహజమైన అర్థం ‘కుమార్తె’. వంశావళి సందర్భంలో విస్తృతమైన సంతతి సంబంధాన్ని సూచించే అవకాశం ఉన్నందున దానిని పాదసూచికలో ఉంచాం.
- source_word: מִכָּל נָשָׁיו וּפִילַגְשָׁיו
  choice: తన భార్యలందరికంటే, ఉపపత్నులందరికంటే ఎక్కువగా
  rationale: מִכָּל పోలికను సూచిస్తుంది. భార్యలు, ఉపపత్నులు అనే రెండు వేర్వేరు సామాజిక వర్గాలను మూలపాఠం ప్రకారం నిలిపాం.
- source_word: כִּי
  choice: తదుపరి వాక్యంగా సహజమైన వివరణ
  rationale: כִּי ముందున్న ప్రకటనకు నేపథ్య వివరణను ప్రవేశపెడుతుంది. తెలుగులో ‘ఎందుకంటే’ అనడం ప్రేమకు సంఖ్యనే కారణమన్న అపార్థం కలిగించవచ్చు; అందువల్ల వాక్య విభజన ద్వారా వివరణాత్మక సంబంధాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: נָשִׁים ... נָשָׂא
  choice: పద్దెనిమిది మంది భార్యలను ... చేసుకున్నాడు
  rationale: נשא נשים అనేది భార్యలను చేసుకోవడం లేదా వివాహం చేసుకోవడం అనే నుడికారం; ఆధునిక తెలుగులో ‘భార్యలను చేసుకున్నాడు’ సహజంగా ఉంది.
- source_word: פִּילַגְשִׁים
  choice: ఉపపత్నులు
  rationale: ఈ పదం ప్రధాన భార్యలకంటే వేరైన ద్వితీయ వైవాహిక స్థితిగల స్త్రీలను సూచిస్తుంది; ‘ఉపపత్నులు’ ఆ భేదాన్ని కాపాడుతుంది.
- source_word: וַיּוֹלֶד
  choice: అతనికి ... పుట్టారు
  rationale: పురుష కర్తతో ילד సంతానాన్ని కనడం/కలగడం సూచిస్తుంది. తెలుగులో ‘అతనికి ... పుట్టారు’ సహజమైన, స్పష్టమైన వ్యక్తీకరణ.
- source_word: עֶשְׂרִים וּשְׁמוֹנָה בָּנִים
  choice: ఇరవై ఎనిమిది మంది కుమారులు
  rationale: సంఖ్యను, ‘కుమారులు’ అనే అర్థాన్ని నేరుగా మరియు సహజంగా అందిస్తుంది.
- source_word: וְשִׁשִּׁים בָּנוֹת
  choice: అరవై మంది కుమార్తెలు
  rationale: సంఖ్యను, ‘కుమార్తెలు’ అనే అర్థాన్ని నేరుగా మరియు సహజంగా అందిస్తుంది.
theological_decisions:
- issue: మయకాను ‘అబ్షాలోము కుమార్తె’గా పేర్కొనడం
  choice: ప్రధాన పాఠంలో హెబ్రీ పదబంధాన్ని ‘అబ్షాలోము కుమార్తె’గా నిలిపాం
  alternative: ‘అబ్షాలోము వంశస్థురాలు’ లేదా సందర్భానుసారంగా ‘మనవరాలు’
  rationale: మూలంలోని בַּת సాధారణంగా ‘కుమార్తె’ అని అర్థం. వంశావళి సందర్భాల్లో అది మరింత విస్తృత బంధాన్ని సూచించవచ్చు; ఆ అవకాశాన్ని ప్రధాన పాఠంలో పరిష్కరించకుండా పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. వ్యక్తులను లెక్కించేటప్పుడు ‘మంది’ వాడాం. ‘ఉపపత్నులు’ ద్వారా మూలపాఠంలోని సామాజిక భేదాన్ని నిలిపాం; [a] సూచిక ప్రధాన పాఠంలో స్పష్టంగా చేర్చబడింది.
