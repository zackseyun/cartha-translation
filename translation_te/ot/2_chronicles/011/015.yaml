id: 2CH.11.15
reference: 2 Chronicles 11:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּֽעֲמֶד ל/וֹ֙ כֹּֽהֲנִ֔ים לַ/בָּמ֖וֹת וְ/לַ/שְּׂעִירִ֑ים וְ/לָ/עֲגָלִ֖ים אֲשֶׁ֥ר עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/015.yaml
  text: And he appointed for himself priests for the high places[a], for the goat-demons, and for the calves that he had made.
translation:
  language: te
  text: అతడు ఉన్నత స్థలాల కోసం, మేకరూప దయ్యాల[a] కోసం, తాను చేసిన దూడల కోసం తనకంటూ యాజకులను నియమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మేకలు”; లేదా “సటైర్లు.” హీబ్రూ పదం అక్రమ ఆరాధనతో సంబంధం ఉన్న మేకవంటి జీవులను లేదా విగ్రహాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֶד
  choice: నియమించాడు
  rationale: యాజకులను ఆ పదవిలో ఉంచడం లేదా ప్రతిష్ఠించడం అనే స్థాపనార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לּוֹ
  choice: తనకంటూ
  rationale: యెరోబాము తన స్వప్రయోజనం కోసం, తన ఆరాధనా వ్యవస్థకు యాజకులను ఏర్పాటు చేసుకున్నాడనే దత్తార్థక-ప్రతిబింబక భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: כֹּהֲנִים
  choice: యాజకులను
  rationale: ఆరాధనా పరిచర్యలోని పదవికి ప్రామాణికమైన తెలుగు పదం.
- source_word: לַבָּמוֹת
  choice: ఉన్నత స్థలాల కోసం
  rationale: ఎత్తైన ప్రదేశాల్లోని ఆరాధనా కేంద్రాలను సూచించే బామోత్ అనే పదానికి స్థిరమైన బైబిలు సంబంధిత భావాన్ని నిలుపుతుంది.
- source_word: לַשְּׂעִירִים
  choice: మేకరూప దయ్యాల కోసం
  rationale: ఈ అక్రమ ఆరాధనా సందర్భంలో ఈ పదం సాధారణ మేకలను కాక మేకవంటి రూపంతో ఊహించిన దయ్యసంబంధ జీవులను లేదా విగ్రహాలను సూచించే అవకాశం ఎక్కువ; మేక రూపకాన్ని కూడా నిలుపుతుంది.
- source_word: וְלָעֲגָלִים
  choice: దూడల కోసం
  rationale: మూలంలోని సాధారణ నామవాచకాన్ని నిలుపుతూ, అవి ఆరాధనా ప్రతిమలనే భావాన్ని సందర్భానికే వదిలివేస్తుంది.
- source_word: אֲשֶׁר עָשָׂה
  choice: తాను చేయించిన
  rationale: రాజు స్వయంగా చేతితో తయారుచేశాడని కాక, తన అధికారంతో వాటిని తయారు చేయించాడనే సహజమైన సందర్భార్థాన్ని తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: అక్రమ ఆరాధనా సందర్భంలో שְׂעִירִים పదం భావం
  choice: మేకరూప దయ్యాలు
  alternative: మేకలు; మేకవంటి పౌరాణిక జీవులు
  rationale: ఆరాధనా స్థలాలు, దూడ విగ్రహాలతో కూడిన జాబితాలో ఇది కేవలం జంతువులను సూచించడం కంటే దయ్యసంబంధ లేదా విగ్రహారాధనా సంబంధ జీవులను సూచించే అవకాశం ఎక్కువ. అయినా మూలంలోని మేక రూపాన్ని అనువాదంలోనూ, ప్రత్యామ్నాయాలను పాదటిప్పణిలోనూ నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని వరుస దత్తార్థక నిర్మాణాన్ని ‘కోసం’ అనే పదంతో నిలిపి, అస్పష్టమైన שְׂעִירִים పదానికి ప్రధాన పాఠ్యంలో సంభావ్య సందర్భార్థాన్ని, పాదటిప్పణిలో ప్రత్యామ్నాయాలను ఇచ్చాం.
