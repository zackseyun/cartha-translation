id: 2CH.11.10
reference: 2 Chronicles 11:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת צָרְעָה֙ וְ/אֶת אַיָּל֔וֹן וְ/אֶת חֶבְר֔וֹן אֲשֶׁ֥ר בִּ/יהוּדָ֖ה וּ/בְ/בִנְיָמִ֑ן עָרֵ֖י מְצֻרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/010.yaml
  text: and Zorah[a], Aijalon, and Hebron, which are in Judah and in Benjamin[b], fortified cities.
translation:
  language: te
  text: యూదా మరియు బెన్యామీను ప్రాంతాల్లో ఉన్న కోట పట్టణాలైన సొరయా, అయ్యాలోను, హెబ్రోనులను నిర్మించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָרְעָה
  choice: సొరా
  rationale: హీబ్రూ స్థలపేరును దాని మూల ఉచ్చారణకు దగ్గరగా ఆధునిక తెలుగు లిపిలో ఇచ్చాం.
- source_word: אַיָּלוֹן
  choice: అయ్యాలోను
  rationale: ఇది స్థలపేరు కాబట్టి అనువదించకుండా హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: חֶבְרוֹן
  choice: హెబ్రోను
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన, మూలరూపానికి దగ్గరైన స్థలపేరు రూపాన్ని ఎంచుకున్నాం.
- source_word: אֲשֶׁר בִּיהוּדָה וּבְבִנְיָמִן
  choice: యూదా, బెన్యామీను ప్రాంతాల్లో ఉన్న
  rationale: జాబితాలోని పట్టణాలు రెండు ప్రాంతాల్లో విస్తరించి ఉన్నాయనే సమష్టి భావం తెలుగులో స్పష్టంగా ఉండేలా ‘ప్రాంతాల్లో’ అని ఇచ్చాం; ఒక్కో పట్టణం రెండు ప్రాంతాల్లోనూ ఉందనే అపార్థాన్ని నివారించాం.
- source_word: עָרֵי מְצֻרוֹת
  choice: కోట పట్టణాలు
  rationale: రక్షణ ఏర్పాట్లతో బలపరచబడిన పట్టణాలు అనే అర్థాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וְאֶת ... וְאֶת ... וְאֶת
  choice: '...లను కూడా'
  rationale: ఈ వచనం ముందటి వచనాల పట్టణాల జాబితాను కొనసాగిస్తున్నందున, పునరుక్త కర్మసూచకాలను తెలుగులో సహజమైన సముచ్చయ జాబితాగా మార్చి ‘కూడా’తో కొనసాగింపు భావాన్ని నిలిపాం.
- source_word: '[ellipsis carried from וַיִּבֶן in 2 Chronicles 11:5]'
  choice: నిర్మించాడు
  rationale: హీబ్రూలో ఈ వచనం ముందున్న ‘నిర్మించాడు’ అనే క్రియపై ఆధారపడిన జాబితా భాగం. వచనాన్ని తెలుగులో స్వతంత్రంగా చదవగలిగేలా ఆ గుప్త క్రియను స్పష్టంగా పునరుద్ధరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకుడికి సులభంగా ఉండే శైలిని వాడాం. మూలంలోని జాబితా-ఆధారిత వాక్య నిర్మాణాన్ని తెలుగులో సంపూర్ణ వాక్యంగా మార్చాం; సమాచారం ఏదీ చేర్చకుండా సందర్భంలో గుప్తంగా ఉన్న క్రియను మాత్రమే పునరుద్ధరించాం.
