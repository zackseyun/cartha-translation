id: 2CH.11.19
reference: 2 Chronicles 11:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֵּ֥לֶד ל֖/וֹ בָּנִ֑ים אֶת יְע֥וּשׁ וְ/אֶת שְׁמַרְיָ֖ה וְ/אֶת זָֽהַם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/019.yaml
  text: 'And she bore him sons: Jeush, Shemariah, and Zaham.'
translation:
  language: te
  text: 'ఆమె అతనికి కుమారులను కన్నది: యెయూషు, షెమర్యా, జాహము.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: ఆమె ... కన్నది
  rationale: ילד క్రియ యొక్క స్త్రీలింగ ఏకవచన రూపం కథనంలోని తదుపరి సంఘటనను తెలియజేస్తుంది. వంశావళి సందర్భంలో ‘కన్నది’ సహజంగా, సంక్షిప్తంగా ఉండి తల్లి కర్తృత్వాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: לוֹ
  choice: అతనికి
  rationale: ל ఉపసర్గతో కూడిన సర్వనామ ప్రత్యయం జనన సూత్రంలో తండ్రిని సూచిస్తుంది; తెలుగులో ‘అతనికి ... కన్నది’ మూల నిర్మాణాన్ని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: בָּנִים
  choice: కుమారులను
  rationale: హీబ్రూ పదం ప్రత్యేకంగా మగ సంతానాన్ని సూచిస్తుంది; తరువాత మూడు పురుష నామాలు ఇవ్వబడ్డాయి కాబట్టి ‘పిల్లలు’ అని సాధారణీకరించలేదు.
- source_word: יְעוּשׁ
  choice: యెయూషు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వని సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: שְׁמַרְיָה
  choice: షెమర్యా
  rationale: హీబ్రూ వ్యక్తినామంలోని שְׁמַרְיָה రూపాన్ని సంక్షిప్త ముగింపుతో తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: זָהַם
  choice: జాహము
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని వ్యంజన, అచ్చు ధ్వనులకు సమీపంగా మరియు తెలుగు బైబిల్ నామశైలికి అనుగుణంగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన వంశావళి శైలి. మూలంలోని స్త్రీ కర్త, తండ్రిని సూచించే పరోక్ష కర్మ, ‘కుమారులు’ అనే లింగ-నిర్దిష్ట పదం అన్నీ నిలుపబడ్డాయి.
