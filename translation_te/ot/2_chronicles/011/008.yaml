lexical_decisions:
- source_word: וְאֶת
  choice: -ను; జాబితాలో సముచ్చయం
  rationale: אֵת నిర్దిష్ట ప్రత్యక్ష కర్మను సూచిస్తుంది; తెలుగులో ప్రతి స్థలనామానికి ‘ను’ విభక్తి జోడించి దాని పని తెలియజేశాం. וְ అనే సముచ్చయ భావాన్ని చివరి అంశానికి ముందు ప్రత్యేకంగా ‘మరియు’ పెట్టకుండా, సహజమైన తెలుగు జాబితా నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: גַּת
  choice: గాతు
  rationale: యూదా ప్రాంతంలోని స్థలనామాన్ని మూల హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో రూపాంతరీకరించాం.
- source_word: מָרֵשָׁה
  choice: మారేషా
  rationale: ఈ స్థలనామాన్ని మూలంలోని హల్లులు, అచ్చుల రూపానికి దగ్గరగా తెలుగు లిపిలో రూపాంతరీకరించాం.
- source_word: זִיף
  choice: జీఫు
  rationale: హీబ్రూ ז ధ్వనిని తెలుగులో సాధారణంగా ‘జ’తో సూచిస్తూ, దీర్ఘ ī అచ్చును నిలుపుకొని స్థలనామాన్ని రూపాంతరీకరించాం.
