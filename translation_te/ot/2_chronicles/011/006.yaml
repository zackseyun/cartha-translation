translation:
  language: te
  text: అతడు బేత్లెహేమును, ఏతామును, తెకోవాను నిర్మించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: కట్టించాడు
  rationale: בנה అనే క్రియకు ప్రాథమిక అర్థం ‘కట్టు/నిర్మించు.’ రాజు పట్టణాల నిర్మాణ పనిని చేయించిన సందర్భానికి తెలుగులో సహజంగా ‘కట్టించాడు’ అని ఇచ్చాం; ‘కోటలుగా బలపరిచాడు’ అనే సందర్భార్థాన్ని ఈ వచనంలోకి అదనంగా చేర్చలేదు.
- source_word: אֶת
  choice: '[అనువదించలేదు]'
  rationale: ఇది హెబ్రీలో ప్రత్యక్ష కర్మను సూచించే వ్యాకరణ చిహ్నం; తెలుగులో దీనికి ప్రత్యేక పదం అవసరం లేదు.
- source_word: בֵּית לֶחֶם
  choice: బేత్లెహేము
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన స్థలనామ రూపం.
- source_word: עֵיטָם
  choice: ఏతాము
  rationale: హెబ్రీ స్థలనామాన్ని తెలుగు ధ్వని, లిపి సంప్రదాయాలకు తగినట్లు లిప్యంతరీకరించాం.
- source_word: תְּקוֹעַ
  choice: తెకోవ
  rationale: హెబ్రీ ఉచ్చారణలోని చివరి గొంతు ధ్వనిని కృత్రిమంగా ‘హ్’గా చేర్చకుండా, తెలుగులో సహజమైన లిప్యంతరీకరణను వాడాం.
- source_word: וְ...וְ...וְ
  choice: కామాలతో కూడిన జాబితా
  rationale: హెబ్రీలో ప్రతి అంశాన్ని వావ్ కలుపుతుంది. ఆధునిక తెలుగులో సహజంగా చదవడానికి స్థలనామాలను కామాలతో వరుసగా ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, గౌరవప్రదంగా రూపొందించాం. ఇవి పట్టణాలని సందర్భం స్పష్టం చేస్తున్నందున ‘పట్టణాలను’ చేర్చాం; అయితే నిర్మాణమా, పునర్నిర్మాణమా, కోటబలపరచడమా అనే విషయాన్ని క్రియలో అతిగా నిర్దిష్టం చేయలేదు.
