revisions:
- from: 'యెహోవా ఇలా అంటున్నాడు: ‘మీరు వెళ్లి మీ సహోదరులతో యుద్ధం చేయవద్దు. మీలో ప్రతి ఒక్కరూ తమ తమ ఇంటికి తిరిగి వెళ్లండి; ఎందుకంటే ఈ విషయం నా నుంచే జరిగింది.’ అప్పుడు వారు యెహోవా మాటలు విని, యరొబాము మీదికి వెళ్లకుండా వెనుదిరిగారు.[a]'
  to: 'యెహోవా ఇలా అంటున్నాడు: ‘మీరు వెళ్లవద్దు; మీ సహోదరులతో యుద్ధం చేయవద్దు. మీలో ప్రతి ఒక్కరూ తమ తమ ఇంటికి తిరిగి వెళ్లండి; ఎందుకంటే నా నుంచే ఈ విషయం జరిగింది.’ అప్పుడు వారు యెహోవా మాటలు విని, యరొబాముకు వ్యతిరేకంగా వెళ్లకుండా వెనుదిరిగారు.[a]'
  rationale: మొదటి నిషేధమైన ‘వెళ్లవద్దు’ను, రెండవ నిషేధమైన ‘యుద్ధం చేయవద్దు’ను వేరుచేసి హెబ్రీ వాక్య నిర్మాణం మరియు అర్థబలాన్ని పునరుద్ధరించాం. చివరి మాటలో సైనిక సందర్భాన్ని ప్రధాన పాఠంలో సహజంగా తెలిపి, אֶל యొక్క దిశార్థాన్ని పాదటిప్పణిలో భద్రపరిచాం. ఇతర అంశాలు మూలానికి, ఆధునిక తెలుగు వాడుకకు అనుకూలంగా ఉన్నాయి.
