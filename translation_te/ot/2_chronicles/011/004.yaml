id: 2CH.11.4
reference: 2 Chronicles 11:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֡ה לֹא תַעֲלוּ֩ וְ/לֹא תִלָּ֨חֲמ֜וּ עִם אֲחֵי/כֶ֗ם שׁ֚וּבוּ אִ֣ישׁ לְ/בֵית֔/וֹ כִּ֧י מֵֽ/אִתִּ֛/י נִהְיָ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַֽ/יִּשְׁמְעוּ֙ אֶת דִּבְרֵ֣י יְהוָ֔ה וַ/יָּשֻׁ֖בוּ מִ/לֶּ֥כֶת אֶל יָרָבְעָֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/004.yaml
  text: 'Thus says Yahweh: You must not go up or fight against your brothers[a]. Return, each man to his house, for this thing has come from me[c][b]. So they listened to the words of Yahweh and turned back from going against Jeroboam.'
translation:
  language: te
  text: 'యెహోవా ఇలా అంటున్నాడు: ‘మీరు వెళ్లవద్దు; మీ సహోదరులతో యుద్ధం చేయవద్దు. మీలో ప్రతి ఒక్కరూ తమ తమ ఇంటికి తిరిగి వెళ్లండి; ఎందుకంటే నా నుంచే ఈ విషయం జరిగింది.’ అప్పుడు వారు యెహోవా మాటలు విని, యరొబాముకు వ్యతిరేకంగా వెళ్లకుండా వెనుదిరిగారు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యరొబాము దగ్గరకు వెళ్లకుండా వెనుదిరిగారు.” సందర్భంలో ఇది అతనిపై యుద్ధానికి వెళ్లడాన్ని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: యెహోవా ఇలా అంటున్నాడు
  rationale: ప్రవచన సందేశ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; יהוה అనే వ్యక్తిగత దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: לֹא תַעֲלוּ וְלֹא תִלָּחֲמוּ
  choice: మీరు వెళ్లి ... యుద్ధం చేయవద్దు
  rationale: עלה ఇక్కడ సైనికంగా ముందుకు వెళ్లడాన్ని సూచిస్తుంది. తెలుగులో అసహజమైన ‘పైకి వెళ్లవద్దు’కు బదులు, యుద్ధ సందర్భాన్ని స్పష్టంగా ఉంచుతూ రెండు క్రియల భావాన్ని కలిపి సహజంగా అందించింది.
- source_word: עִם אֲחֵיכֶם
  choice: మీ సహోదరులతో
  rationale: עם యొక్క ప్రాథమిక భావమైన ‘తో’ను నిలిపి, యుద్ధం చేయడం అనే క్రియ ద్వారానే ప్రతికూల సంబంధం స్పష్టమవుతుంది. ‘సహోదరులు’ వారు తోటి ఇశ్రాయేలీయులనే కుటుంబ సంబంధ ఉద్ఘాటనను కాపాడుతుంది.
- source_word: שׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: మీలో ప్రతి ఒక్కరూ తమ తమ ఇంటికి తిరిగి వెళ్లండి
  rationale: איש యొక్క పంపిణీ భావాన్ని సహజమైన, సమూహాన్ని ఉద్దేశించిన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: כִּי מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: ఎందుకంటే ఈ విషయం నా నుంచే జరిగింది
  rationale: రాజకీయ పరిణామం దేవుని నుండి సంభవించిందనే మూలపాఠ భావాన్ని నిలుపుతూ, దాని తాత్త్విక పరిధిని మరింత విస్తరించదు.
- source_word: וַיִּשְׁמְעוּ אֶת דִּבְרֵי יְהוָה
  choice: అప్పుడు వారు యెహోవా మాటలు విని
  rationale: שמע లోని వినడం—పాటించడం అనే భావ ఉద్వేగాన్ని ‘విని’తో ఉంచుతుంది; తరువాతి చర్య వారి విధేయతను చూపుతుంది.
- source_word: וַיָּשֻׁבוּ מִלֶּכֶת אֶל יָרָבְעָם
  choice: యరొబాము మీదికి వెళ్లకుండా వెనుదిరిగారు
  rationale: אל అక్షరార్థంగా ‘వైపు/దగ్గరకు’ అయినా, సైనిక సందర్భంలో యరొబాముపై దండెత్తడమే ఉద్దేశం. ‘మీదికి’ ఆ సందర్భాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన వ్యక్తిగత నామరూపాన్ని వాడి, సాధారణ బిరుదుతో దైవనామాన్ని మరుగుపరచలేదు.
- issue: מֵאִתִּי נִהְיָה లో దైవ కారణత్వం
  choice: ఈ విషయం నా నుంచే జరిగింది
  alternative: ఈ విషయం నా వల్ల జరిగింది
  rationale: ‘నా నుంచే’ దేవుని మూలకర్తృత్వాన్ని స్పష్టంగా నిలుపుతుంది; ‘నా వల్ల’ కలిగించగల మరింత ప్రత్యక్ష కారణత్వ వివరణను బలవంతంగా రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభమైన శైలి. సైనిక సందర్భాన్ని సహజంగా తెలియజేస్తూ, ‘సహోదరులు’ అనే మూలపాఠ కుటుంబ సంబంధాన్ని మరియు దైవ కారణత్వంలోని ఉద్వేగాన్ని నిలిపింది.
