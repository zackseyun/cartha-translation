  source_fidelity: 'The Hebrew prophetic formula is represented accurately in substance: the word of YHWH comes to Shemaiah, who is identified as the man of God, introducing direct speech. However, the rendering of the divine name should follow the supplied POB audit trail''s chosen form, “Yahweh,” rather than the alternative “Jehovah.”'
