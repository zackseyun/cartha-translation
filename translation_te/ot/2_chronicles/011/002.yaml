id: 2CH.11.2
reference: 2 Chronicles 11:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל שְׁמַֽעְיָ֥הוּ אִישׁ הָ/אֱלֹהִ֖ים לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/002.yaml
  text: And the word of Yahweh came to Shemaiah the man of God, saying,
translation:
  language: te
  text: 'అప్పుడు యాహ్వే వాక్కు దేవుని మనిషియైన షెమయాకు వచ్చి ఇలా చెప్పింది:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: అప్పుడు ... వచ్చింది
  rationale: ఈ రూపం కథనంలోని తదుపరి సంఘటనను పరిచయం చేస్తుంది. తెలుగులో ‘అప్పుడు’ సహజమైన కథన సంధానాన్ని ఇస్తుంది; మూలంలో స్పష్టంగా లేని విరోధార్థాన్ని చేర్చదు.
- source_word: דְּבַר יְהוָה
  choice: యెహోవా వాక్కు
  rationale: ప్రవచన సంబంధమైన స్థిర పదబంధాన్ని, నిర్మాణ సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలోని దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: אֶל שְׁמַעְיָהוּ
  choice: షెమయాకు
  rationale: אֶל సూచించే గ్రహీతను తెలుగు సంప్రదాన విభక్తితో సహజంగా వ్యక్తం చేస్తుంది; వ్యక్తినామాన్ని లిప్యంతరీకరిస్తుంది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: ప్రవక్తగా గుర్తించే స్థిర బిరుదును మూలానికి సమీపంగా, అర్థమయ్యే తెలుగులో నిలుపుతుంది.
- source_word: לֵאמֹר
  choice: 'ఇలా చెప్పింది:'
  rationale: తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని సహజమైన తెలుగులో పరిచయం చేస్తుంది. కర్త ‘వాక్కు’ కావడంతో స్త్రీలింగ క్రియారూపం వాడబడింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: ఇక్కడ మూలపాఠం చతురక్షర దైవనామాన్ని నేరుగా వాడుతుంది. దానిని బిరుదుగా మార్చకుండా తెలుగులో సుపరిచితమైన దైవనామ రూపంతో నిలిపాం; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన కథన శైలి. మూలంలోని క్రమసూచక వావ్‌కు విరోధార్థం చేర్చకుండా ‘అప్పుడు’ వాడబడింది.
