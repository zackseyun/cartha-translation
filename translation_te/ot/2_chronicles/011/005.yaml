  yaml_path: translation/ot/2_chronicles/011/005.yaml
  text: Rehoboam lived in Jerusalem[a], and he built fortified cities in Judah.
translation:
  language: te
  text: రెహబాము యెరూషలేములో నివసించాడు. అతడు యూదాలో రక్షణ కోసం పట్టణాలను[a] నిర్మించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కోట పట్టణాలను,” లేదా “కోటలుగా ఉండే పట్టణాలను”; హెబ్రీలో అక్షరార్థంగా “రక్షణ/కోటబందీ కోసం పట్టణాలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: నివసించాడు
  rationale: ישב అనే క్రియకు ఈ కథన సందర్భంలో ‘నివసించు’ అనే సహజమైన అర్థం సరిపోతుంది. ‘స్థిరపడ్డాడు’ అంటే మూలంలో స్పష్టంగా లేని స్థలమార్పు భావం రావచ్చు.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: ఇది స్థలాన్ని సూచించే సరళమైన పదబంధం; పేరును ప్రాచుర్యంలో ఉన్న తెలుగు బైబిలు రూపంలో ఇచ్చాం.
- source_word: וַיִּבֶן
  choice: నిర్మించాడు
  rationale: בנה యొక్క ప్రాథమిక అర్థం ‘కట్టు/నిర్మించు.’ తరువాతి పదబంధం రక్షణ ఉద్దేశాన్ని తెలుపుతుంది కాబట్టి క్రియలోనే ‘కోటగా బలపరిచాడు’ అనే భావాన్ని చేర్చలేదు.
- source_word: עָרִים
  choice: పట్టణాలను
  rationale: עִיר బహువచనాన్ని ఆధునిక తెలుగులో సహజంగా ‘పట్టణాలు’ అని అనువదించాం; సందర్భం పరిపాలనా, సైనిక కేంద్రాలకు సంబంధించినది.
- source_word: לְמָצוֹר
  choice: రక్షణ కోసం
  rationale: מָצוֹר ఇక్కడ కోటబందీ, దుర్గం లేదా ముట్టడికి సంబంధించిన రక్షణను సూచించవచ్చు. ‘రక్షణ కోసం’ అనేది ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తూ, ఏ ఒక్క నిర్దిష్ట సైనిక భావానికీ పరిమితం చేయదు.
- source_word: בִּיהוּדָה
  choice: యూదాలో
  rationale: పట్టణాలు నిర్మించబడిన ప్రాంతాన్ని సూచించే సరళమైన స్థానవాచక పదబంధం.
