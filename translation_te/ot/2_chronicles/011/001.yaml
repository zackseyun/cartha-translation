  text: וַ/יָּבֹ֣א רְחַבְעָם֮ יְרוּשָׁלִַם֒ וַ/יַּקְהֵל֩ אֶת בֵּ֨ית יְהוּדָ֜ה וּ/בִנְיָמִ֗ן מֵאָ֨ה וּ/שְׁמוֹנִ֥ים אֶ֛לֶף בָּח֖וּר עֹשֵׂ֣ה מִלְחָמָ֑ה לְ/הִלָּחֵם֙ עִם יִשְׂרָאֵ֔ל לְ/הָשִׁ֥יב אֶת הַ/מַּמְלָכָ֖ה לִ/רְחַבְעָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/001.yaml
  text: When Rehoboam came to Jerusalem[a], he assembled the house of Judah and Benjamin, one hundred eighty thousand chosen warriors[b], to fight against Israel in order to restore the kingdom to Rehoboam.
translation:
  language: te
  text: రెహబాము యెరూషలేముకు వచ్చి, యూదా, బెన్యామీను వంశాలవారైన యుద్ధానికి ఎంపికైన లక్షా ఎనభై వేల మందిని సమకూర్చాడు[a]—ఇశ్రాయేలుతో యుద్ధం చేసి రాజ్యాన్ని తిరిగి రెహబాముకు ఇవ్వడానికి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘యూదా మరియు బెన్యామీను ఇల్లు’; ఇది ఆ రెండు గోత్రాలతో ఏర్పడిన సమష్టిని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఇశ్రాయేలుకు వ్యతిరేకంగా యుద్ధం చేయడానికి, రాజ్యాన్ని రెహబాముకు తిరిగి ఇవ్వడానికి.’ ‘యుద్ధానికి ఎంపికైన’ అనే మాటకు అక్షరార్థంగా, ‘యుద్ధం చేసేవారైన ఎంపికైన పురుషులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చి
  rationale: בוא అనే క్రియ గమ్యస్థానమైన యెరూషలేముకు రావడం లేదా చేరడం సూచిస్తుంది; తెలుగు కథనశైలిలో ‘వచ్చి’ సహజంగా ఉంది.
- source_word: וַיַּקְהֵל
  choice: సమకూర్చాడు
  rationale: קהל హిఫీల్ రూపం ప్రజలను, ముఖ్యంగా సైన్యాన్ని, ఒకచోట చేర్చడాన్ని సూచిస్తుంది; ‘సమకూర్చాడు’ సైనిక సందర్భానికి తగినది.
- source_word: בֵּית יְהוּדָה וּבִנְיָמִן
  choice: యూదా, బెన్యామీను వంశాలవారిని
  rationale: ‘ఇల్లు’ అనే హీబ్రూ నుడికారాన్ని తెలుగులో యథాతథంగా ఉంచితే అసహజంగా ఉంటుంది. ‘వంశాలవారు’ అనే పదం గోత్ర సంబంధమైన, సమష్టి రాజకీయ భావాన్ని నిలుపుతుంది.
- source_word: מֵאָה וּשְׁמוֹנִים אֶלֶף
  choice: లక్షా ఎనభై వేల మంది
  rationale: హీబ్రూ సంఖ్యను ఆధునిక తెలుగు సంఖ్యా ప్రయోగంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בָּחוּר
  choice: ఎంపికైన
  rationale: సైనిక సందర్భంలో ఈ పదం ఎంపికచేసిన లేదా శ్రేష్ఠమైన వారిని సూచించవచ్చు; కేవలం వయస్సును సూచించే ‘యువకులు’ కన్నా ‘ఎంపికైన’ సందర్భోచితం.
- source_word: עֹשֵׂה מִלְחָמָה
  choice: యోధులు
  rationale: అక్షరార్థంగా ‘యుద్ధం చేసేవారు’; ‘యోధులు’ దాని సైనిక భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: לְהִלָּחֵם עִם יִשְׂרָאֵל
  choice: ఇశ్రాయేలుతో యుద్ధం చేసి
  rationale: עִם అక్షరార్థంగా ‘తో’ అయినప్పటికీ, యుద్ధ సందర్భంలో ప్రతిపక్ష సంబంధాన్ని తెలుగులో ‘ఇశ్రాయేలుతో యుద్ధం’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְהָשִׁיב אֶת־הַמַּמְלָכָה לִרְחַבְעָם
  choice: రాజ్యాన్ని తిరిగి రెహబాము వశం చేయడానికి
  rationale: שוב హిఫీల్ రూపం రాజ్యాన్ని మళ్లీ అతని నియంత్రణలోకి తీసుకురావడాన్ని సూచిస్తుంది. ‘వశం చేయడానికి’ రాజకీయ ఆధిపత్య భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: రాజ్య విభజన తర్వాత ‘ఇశ్రాయేలు’ అనే పేరుకు సూచన
  choice: మూలంలోని ‘ఇశ్రాయేలు’ అనే పేరునే ఉంచడం
  alternative: ఉత్తర గోత్రాలు / ఉత్తర రాజ్యం
  rationale: హీబ్రూ పాఠం ప్రత్యర్థి రాజకీయ సమూహాన్ని ‘ఇశ్రాయేలు’ అని పిలుస్తుంది. వివరణాత్మక పేరును చేర్చకుండా అదే పదాన్ని నిలుపడం మూలంలోని చారిత్రక, వేదాంతపరమైన ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. మొదటి ‘సమకూర్చాడు’ తర్వాత గీత ఉంచి సైనికుల సంఖ్యను వివరణాత్మకంగా అనుసంధానించాం; వాక్యాంతంలో క్రియను పునరుక్తి చేయడం దీర్ఘ వాక్యాన్ని స్పష్టంగా ఉంచుతుంది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
