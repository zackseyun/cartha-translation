revisions:
- from: యెరూషలేములో నివసించే ప్రజలు యాజకులకు, లేవీయులకు రావలసిన భాగాన్ని ఇవ్వాలని అతడు ఆజ్ఞాపించాడు. వారు యహ్వే ధర్మశాస్త్రానికి తమను తాము అంకితం చేసుకోవడానికి అలా ఆజ్ఞాపించాడు.[a]
