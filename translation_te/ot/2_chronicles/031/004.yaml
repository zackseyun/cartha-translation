  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/עָם֙ לְ/יוֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם לָ/תֵ֕ת מְנָ֥ת הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְמַ֥עַן יֶחֶזְק֖וּ בְּ/תוֹרַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/004.yaml
  text: He also commanded the people[a], the inhabitants of Jerusalem, to give the portion due to the priests and the Levites, so that they might devote themselves to the law of Yahweh.
translation:
  language: te
  text: అతడు ప్రజలకు, అంటే యెరూషలేము నివాసులకు, యాజకులకు, లేవీయులకు రావలసిన భాగాన్ని ఇవ్వాలని ఆజ్ఞాపించాడు; వారు యహ్వే ధర్మశాస్త్రానికి తమను తాము అంకితం చేసుకునేలా అలా చేశాడు కాదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అతడు ఆజ్ఞాపించాడు
  rationale: אמר అనే క్రియకు ప్రాథమికంగా ‘చెప్పాడు’ అనే అర్థం ఉన్నా, ఇక్కడ రాజు ప్రజలకు చేయవలసిన పనిని నిర్దేశిస్తున్నందున ‘ఆజ్ఞాపించాడు’ సందర్భబలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לָעָם לְיוֹשְׁבֵי יְרוּשָׁלַם
  choice: యెరూషలేములో నివసించే ప్రజలు
  rationale: రెండు పదబంధాలు ఒకే సమూహాన్ని సూచించే వివరణాత్మక నిర్మాణంగా ఉన్నాయి; ఆధునిక తెలుగులో పునరుక్తి లేకుండా అర్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: מְנָת הַכֹּהֲנִים וְהַלְוִיִּם
  choice: యాజకులకు, లేవీయులకు రావలసిన భాగం
  rationale: מְנָה నియమించబడిన వాటా లేదా భాగాన్ని సూచిస్తుంది. ‘రావలసిన’ అనేది సందర్భంలోని హక్కుగా కేటాయించబడిన భాగాన్ని తెలియజేస్తుంది.
- source_word: יֶחֶזְקוּ
  choice: తమను తాము అంకితం చేసుకోవడానికి
  rationale: חזק కు ‘బలపడు,’ ‘గట్టిగా పట్టుకో’ అనే భావాలు ఉన్నాయి. భౌతిక పోషణ వల్ల యాజకులు, లేవీయులు ధర్మశాస్త్ర సంబంధమైన సేవలో నిలకడగా నిమగ్నమవగలరనే సందర్భార్థాన్ని ఈ ఎంపిక సహజంగా తెలియజేస్తుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
- source_word: בְּתוֹרַת יְהוָה
  choice: యహ్వే ధర్మశాస్త్రానికి
  rationale: תורה ఇక్కడ దేవుని నిబంధనాత్మక ధర్మశాస్త్రం/ఉపదేశాన్ని సూచిస్తుంది. יְהוָה ను బిరుదుతో భర్తీ చేయకుండా దైవనామంగా ‘యహ్వే’ అని లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో దైవనామమే ఉంది. అందువల్ల బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా, హీబ్రూ నామానికి సమీపమైన ‘యహ్వే’ను వాడాం.
- issue: יֶחֶזְקוּ בְּתוֹרַת יְהוָה యొక్క భావం
  choice: యహ్వే ధర్మశాస్త్రానికి తమను తాము అంకితం చేసుకోవడం
  alternative: యహ్వే ధర్మశాస్త్రంలో బలపడడం; యహ్వే ధర్మశాస్త్రాన్ని గట్టిగా పట్టుకోవడం
  rationale: వారి పోషణకు కావలసిన భాగం ఇవ్వడం ద్వారా ధర్మశాస్త్ర సంబంధమైన బాధ్యతలలో నిలకడగా నిమగ్నమయ్యేలా చేయడమే సందర్భోచిత ఉద్దేశం. అయితే హీబ్రూ క్రియలోని నిజమైన భావవిస్తృతిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. పొడవైన హీబ్రూ వాక్యాన్ని స్పష్టత కోసం రెండు తెలుగు వాక్యాలుగా విభజించాం; రెండో వాక్యంలోని ‘వారు’ యాజకులు, లేవీయులను సూచిస్తుంది.
