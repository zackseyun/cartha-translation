source:
  edition: WLC
  text: וּ/כְ/כַלּ֣וֹת כָּל זֹ֗את יָצְא֨וּ כָּל יִשְׂרָאֵ֥ל הַֽ/נִּמְצְאִים֮ לְ/עָרֵ֣י יְהוּדָה֒ וַ/יְשַׁבְּר֣וּ הַ/מַּצֵּב֣וֹת וַ/יְגַדְּע֣וּ הָ/אֲשֵׁרִ֡ים וַ/יְנַתְּצ֣וּ אֶת הַ֠/בָּמוֹת וְ/אֶת הַֽ/מִּזְבְּחֹ֞ת מִ/כָּל יְהוּדָ֧ה וּ/בִנְיָמִ֛ן וּ/בְ/אֶפְרַ֥יִם וּ/מְנַשֶּׁ֖ה עַד לְ/כַלֵּ֑ה וַ/יָּשׁ֜וּבוּ כָּל בְּנֵ֧י יִשְׂרָאֵ֛ל אִ֥ישׁ לַ/אֲחֻזָּת֖/וֹ לְ/עָרֵי/הֶֽם־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/001.yaml
  text: And when all this was finished[a], all Israel who were present went out to the cities of Judah and shattered the pillars, cut down the Asherim, and tore down the high places and the altars throughout all Judah and Benjamin, and in Ephraim and Manasseh, until they had completely destroyed them. Then all the sons of Israel returned, each man to his possession, to their cities.
translation:
  language: te
  text: ఈ సంగతులన్నీ ముగిసినప్పుడు, అక్కడ ఉన్న ఇశ్రాయేలీయులందరూ యూదా పట్టణాలకు వెళ్లి, నిలువురాళ్లను పగులగొట్టి, అషేరీమ్‌ను[a] నరికివేసి, యూదా, బెన్యామీను అంతటా, అలాగే ఎఫ్రాయిము, మనష్షేలలో ఉన్న ఉన్నత పూజాస్థలాలను, బలిపీఠాలను కూల్చివేసి, వాటన్నిటినీ పూర్తిగా నిర్మూలించే వరకు కొనసాగించారు. తరువాత ఇశ్రాయేలు కుమారులందరూ ఒక్కొక్కరు తమ స్వాస్థ్యానికి, తమ తమ పట్టణాలకు తిరిగి వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అషేరా స్తంభాలను.” హీబ్రూ అషేరీమ్ అనే పదం అషేరాతో సంబంధమున్న పూజావస్తువులను సూచిస్తుంది; అవి చెక్క స్తంభాలు లేదా చెట్లుగా ఉండి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכַלּוֹת כָּל זֹאת
  choice: ఈ సంగతులన్నీ ముగిసినప్పుడు
  rationale: כְּతో కూడిన క్రియానామ రూపం కాలసూచక ఉపవాక్యాన్ని ఏర్పరుస్తుంది. హీబ్రూలో కర్త స్పష్టంగా చెప్పబడనందున తెలుగులో సహజమైన అకర్మక రూపాన్ని వాడాం.
- source_word: כָּל יִשְׂרָאֵל הַנִּמְצְאִים
  choice: అక్కడ ఉన్న ఇశ్రాయేలీయులందరూ
  rationale: הַנִּמְצְאִים అక్షరార్థంగా ‘కనబడినవారు/ఉన్నవారు’; సందర్భంలో పండుగకు హాజరైనవారిని సూచిస్తుంది.
- source_word: וַיְשַׁבְּרוּ הַמַּצֵּבוֹת
  choice: పూజా స్తంభాలను పగులగొట్టారు
  rationale: מַצֵּבוֹת పూజకు సంబంధించిన నిలువురాళ్లు లేదా స్తంభాలు. సందర్భార్థాన్ని స్పష్టం చేస్తూనే వాటి ఖచ్చిత రూపాన్ని అతిగా నిర్దేశించకుండా ‘పూజా స్తంభాలు’ అని అనువదించాం.
- source_word: וַיְגַדְּעוּ הָאֲשֵׁרִים
  choice: అషేరా చిహ్నాలను నరికివేశారు
  rationale: אֲשֵׁרִים అషేరాతో సంబంధమున్న పూజావస్తువులను సూచించవచ్చు; అవి స్తంభాలు లేదా చెట్ల రూపంలో ఉండి ఉండవచ్చు. ‘చిహ్నాలు’ ఈ అనిశ్చితిని కాపాడుతుంది; ‘నరికివేశారు’ גדע యొక్క బలమైన చర్యను తెలియజేస్తుంది.
- source_word: הַבָּמוֹת
  choice: ఉన్నత పూజాస్థలాలు
  rationale: בָּמוֹת ఎత్తైన ప్రదేశాల్లోని లేదా సంప్రదాయంగా ‘ఉన్నత స్థలాలు’గా పిలువబడే పూజాకేంద్రాలు. సాధారణ తెలుగు పాఠకునికి అర్థమయ్యేలా ‘పూజా’ను చేర్చాం.
- source_word: מִכָּל יְהוּדָה וּבִנְיָמִן וּבְאֶפְרַיִם וּמְנַשֶּׁה
  choice: యూదా, బెన్యామీను ప్రాంతాలన్నిటిలోనూ, ఎఫ్రాయిము, మనష్షే ప్రాంతాల్లోనూ ఉన్న
  rationale: ఈ పదబంధం పూజాస్థలాల తొలగింపు జరిగిన భౌగోళిక పరిధిని సూచిస్తుంది. హీబ్రూ విభక్తుల స్వల్ప మార్పును తెలుగులో సహజంగా పరిధి భావంతో తెలిపాం.
- source_word: עַד לְכַלֵּה
  choice: పూర్తిగా నిర్మూలించే వరకు
  rationale: ఈ క్రియానామ ప్రయోగం పని సంపూర్ణంగా ముగిసే వరకు కొనసాగిందనే భావాన్ని ఇస్తుంది.
- source_word: אִישׁ לַאֲחֻזָּתוֹ לְעָרֵיהֶם
  choice: ఒక్కొక్కరు తమ స్వాస్థ్యానికి, తమ తమ పట్టణాలకు
  rationale: אִישׁ ఇక్కడ పంపిణీ భావంలో ‘ఒక్కొక్కరు’; אֲחֻזָּה భూసంబంధమైన స్వాధీన భాగం లేదా వంశపారంపర్య ఆస్తిని సూచిస్తుంది. తెలుగు వాక్యసామరస్యానికి ‘తమ తమ’ వాడాం.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక సమూహనామం
  choice: ఇశ్రాయేలు కుమారులందరూ
  alternative: ఇశ్రాయేలీయులందరూ / ఇశ్రాయేలు ప్రజలందరూ
  rationale: మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే రూపాన్ని నిలుపుకున్నాం. ఇది సమాజానికి వాడే సంప్రదాయ సమూహనామం; స్త్రీలు సమాజం నుంచి వెలివేయబడ్డారని అదనంగా సూచించదు.
- issue: అషేరీమ్ యొక్క ఖచ్చిత రూపం
  choice: అషేరా చిహ్నాలు
  alternative: అషేరా స్తంభాలు / అషేరా చెట్లు
  rationale: మూలపదం అషేరాతో సంబంధమున్న పూజావస్తువులను సూచించినా వాటి భౌతిక రూపాన్ని ప్రతిసారి ఖచ్చితంగా నిర్ణయించదు. అందువల్ల ప్రధాన పాఠంలో విస్తృత పదాన్ని, పాదసూచికలో సాధ్యమైన నిర్దిష్ట అర్థాన్ని ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. వరుస విధ్వంసక క్రియల తీవ్రతను నిలుపుతూ, భౌగోళిక పరిధిని సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలిపాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘అషేరా చిహ్నాలు’ వద్దే ఉంచాం.
