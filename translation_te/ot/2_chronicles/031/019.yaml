  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని వంశపారంపర్య, పరిపాలనా పదజాలాన్ని నిలుపుతూ, అస్పష్టత ఉన్న చోట పాదసూచికల్లో ప్రత్యామ్నాయాలను ఇచ్చాం.
