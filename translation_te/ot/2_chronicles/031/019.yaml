  yaml_path: translation/ot/2_chronicles/031/019.yaml
  text: And for the sons of Aaron[a], the priests, in the pasture lands of their cities, in every city[e][d][c][b], there were men designated by name to give portions to every male among the priests and to everyone enrolled by genealogy among the Levites.
translation:
  language: te
  text: అహరోను కుమారులైన యాజకుల కొరకు, వారి పట్టణాల చుట్టూ ఉన్న పచ్చిక భూముల్లో[b], ప్రతి పట్టణంలోనూ[c], యాజకులలోని ప్రతి పురుషునికి, లేవీయులలో వంశావళి ప్రకారం నమోదైన ప్రతి ఒక్కరికీ[e] వాటాలు పంచడానికి పేర్లతో ప్రత్యేకంగా పేర్కొనబడిన[d] మనుషులు ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా, ‘వారి పట్టణాల చుట్టూ ఉన్న సామూహిక బహిరంగ భూముల్లో.’ ఈ పదం పట్టణాల చుట్టూ ఉండి సాధారణంగా పశువులను మేపడానికి ఉపయోగించే భూమిని సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: హెబ్రీయ మూలంలో ‘ప్రతి పట్టణం పట్టణంలో’ అని ఉంది; ఇది ‘ప్రతి ఒక్క పట్టణంలోనూ’ అనే భావాన్నిచ్చే నుడికారం.
    reason: lexical_alternative
  - marker: d
    text: లేదా, ‘పేరుపేరున గుర్తించబడిన’ లేదా ‘పేర్లతో నమోదుచేయబడిన.’ వీరు అధికారికంగా పేర్ల ద్వారా ప్రత్యేకంగా నిర్దేశించబడ్డారని హెబ్రీయ పదబంధం సూచిస్తుంది.
    reason: lexical_alternative
  - marker: e
    text: అంటే, లేవీయుల వంశావళి పట్టికల్లో నమోదు చేయబడినవారు.
    reason: cultural_note
lexical_decisions:
- source_word: וְלִבְנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: యాజకులైన అహరోను కుమారుల కోసం కూడా
  rationale: ‘అహరోను కుమారులు’ అనే హెబ్రీయ వంశపారంపర్య వ్యక్తీకరణను నిలుపుతూ, వారు యాజకులని సహజమైన తెలుగు అన్వయంతో స్పష్టం చేస్తుంది.
- source_word: בִּשְׂדֵי מִגְרַשׁ עָרֵיהֶם
  choice: వారి పట్టణాల చుట్టూ ఉన్న పచ్చికబయళ్లలో
  rationale: מִגְרָשׁ లేవీయుల పట్టణాల చుట్టూ పశువులను మేపడానికి లేదా సామూహిక అవసరాలకు ఉపయోగించే బహిరంగ భూమిని సూచిస్తుంది; ‘పచ్చికబయళ్లు’ సందర్భానుకూలమైన సహజ తెలుగు.
- source_word: בְּכָל עִיר וָעִיר
  choice: ప్రతి పట్టణంలోనూ
  rationale: ‘పట్టణం పట్టణంలో’ అనే హెబ్రీయ పంపిణీ పునరుక్తి ప్రతి పట్టణాన్నీ సూచిస్తుంది; ‘ప్రతి పట్టణంలోనూ’ ఆ సమగ్ర భావాన్ని సహజంగా అందిస్తుంది.
- source_word: אֲנָשִׁים אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: పేరుపేరున నియమించబడిన మనుషులు
  rationale: పేర్ల ద్వారా అధికారికంగా గుర్తించబడిన లేదా నియమించబడిన భావాన్ని తెలియజేస్తుంది; ‘నియమించబడిన’ పరిపాలనా సందర్భానికి సరిపోతుంది, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: לָתֵת מָנוֹת
  choice: వాటాలు పంచడానికి
  rationale: מָנוֹת సరఫరాల నుంచి కేటాయించి ఇచ్చే భాగాలను సూచిస్తుంది; తెలుగులో ‘వాటాలు పంచడం’ సహజంగా పంపిణీ భావాన్ని అందిస్తుంది.
- source_word: לְכָל זָכָר בַּכֹּהֲנִים
  choice: యాజకులలోని ప్రతి పురుషునికి
  rationale: זָכָר లోని లింగనిర్దిష్టమైన ‘పురుషుడు’ భావాన్ని, సమూహంలో ప్రతి ఒక్కరనే విభజనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: וּלְכָל הִתְיַחֵשׂ בַּלְוִיִּם
  choice: లేవీయులలో వంశావళి ప్రకారం నమోదైన ప్రతి ఒక్కరికీ
  rationale: התיחש వంశావళి రికార్డుల్లో నమోదు చేయబడటాన్ని సూచిస్తుంది; ఈ అనువాదం పరిపాలనా-వంశావళి భావాన్ని స్పష్టంగా అందిస్తుంది.
