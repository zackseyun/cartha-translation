revisions:
- from: అతని పర్యవేక్షణలో[a] ఏదెను, మిన్యామీను, యేషూవ, షెమయా, అమర్యా, షెకన్యా అనేవారు యాజకుల పట్టణాల్లో ఉండి, తమ సోదరులకు[b] వారి వారి విభాగాల ప్రకారం నమ్మకంగా పంచిపెట్టారు—పెద్దవారికీ చిన్నవారికీ ఒకే విధంగా.
