  text: וְ/עַל יָד֡/וֹ עֵ֣דֶן וּ֠/מִנְיָמִן וְ/יֵשׁ֨וּעַ וּֽ/שְׁמַֽעְיָ֜הוּ אֲמַרְיָ֧הוּ וּ/שְׁכַנְיָ֛הוּ בְּ/עָרֵ֥י הַ/כֹּהֲנִ֖ים בֶּ/אֱמוּנָ֑ה לָ/תֵ֤ת לַ/אֲחֵי/הֶם֙ בְּ/מַחְלְק֔וֹת כַּ/גָּד֖וֹל כַּ/קָּטָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/015.yaml
  text: Under his authority were Eden[a], Miniamin, Jeshua, Shemaiah, Amariah, and Shecaniah, in the cities of the priests, faithfully to distribute to their brothers by divisions[c][b], to great and small alike.
translation:
  language: te
  text: అతని పర్యవేక్షణలో[a] ఏదెన్, మిన్యామీన్, యేషూవా, షెమయాహు, అమర్యాహు, షెకన్యాహు అనేవారు యాజకుల పట్టణాల్లో ఉండేవారు; వారు తమ సోదరులకు[b] విభాగాల వారీగా, పెద్దవారికీ చిన్నవారికీ సమానంగా, నమ్మకంగా పంచిపెట్టేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని పక్కన’ లేదా ‘అతని బాధ్యత కింద.’ హెబ్రీ నుడికారం సమీపం, బాధ్యత, లేదా అధికార పర్యవేక్షణను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘తమ సోదరులు’ అంటే తోటి యాజక సమాజ సభ్యులు.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַל־יָדוֹ
  choice: అతని పర్యవేక్షణలో
  rationale: ఈ పరిపాలనా సందర్భంలో హెబ్రీ నుడికారం సహకారం, బాధ్యత లేదా అధికార పర్యవేక్షణను సూచించగలదు; తెలుగులో సహజంగా ఉండేలా ‘పర్యవేక్షణలో’ అని ఇచ్చాం.
- source_word: עֵדֶן וּמִנְיָמִן וְיֵשׁוּעַ וּשְׁמַעְיָהוּ אֲמַרְיָהוּ וּשְׁכַנְיָהוּ
  choice: ఏదెను, మిన్యామీను, యేషూవ, షెమయా, అమర్యా, షెకన్యా
  rationale: వ్యక్తుల పేర్లను అనువదించకుండా, హెబ్రీ రూపాలకు దగ్గరగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: בְּעָרֵי הַכֹּהֲנִים
  choice: యాజకుల పట్టణాల్లో
  rationale: హెబ్రీ సంబంధార్థక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపే రూపం.
- source_word: בֶּאֱמוּנָה
  choice: నమ్మకంగా
  rationale: ఇక్కడ ఈ పదం అప్పగించిన పంపిణీ బాధ్యతను విశ్వసనీయంగా నిర్వర్తించడాన్ని సూచిస్తుంది.
- source_word: לָתֵת
  choice: పంచిపెట్టారు
  rationale: మూల క్రియ అక్షరార్థంగా ‘ఇవ్వడం’; సందర్భం క్రమబద్ధమైన వాటాల పంపిణీ కావడంతో ‘పంచిపెట్టారు’ అని స్పష్టం చేశాం.
- source_word: לַאֲחֵיהֶם
  choice: తమ సోదరులకు
  rationale: హెబ్రీలోని ‘వారి సోదరులు’ అనే బంధుత్వ పదాన్ని నిలిపి, సందర్భార్థాన్ని పాదసూచికలో వివరించాం.
- source_word: בְּמַחְלְקוֹת
  choice: వారి వారి విభాగాల ప్రకారం
  rationale: ఈ పదం క్రమబద్ధంగా ఏర్పాటు చేసిన యాజక వర్గాలు లేదా విధి విభాగాలను సూచిస్తుంది.
- source_word: כַּגָּדוֹל כַּקָּטָן
  choice: పెద్దవారికీ చిన్నవారికీ ఒకే విధంగా
  rationale: హోదా లేదా వయస్సుతో సంబంధం లేకుండా అందరికీ పంపిణీ జరిగిందనే సమగ్ర, నిష్పాక్షిక భావాన్ని సహజమైన తెలుగులో తెలిపాం.
theological_decisions:
- issue: כַּגָּדוֹל כַּקָּטָן అనే పదబంధంలో వయస్సు లేదా హోదా
  choice: పెద్దవారికీ చిన్నవారికీ ఒకే విధంగా
  alternative: గొప్పవారికీ అల్పులకీ సమానంగా / పెద్దవయసువారికీ చిన్నవయసువారికీ
  rationale: మూలపాఠం వయస్సా హోదానా అని ఖచ్చితంగా నిర్ణయించదు. అందువల్ల తెలుగులో కూడా రెండింటికీ వీలున్న సాధారణ పదజాలాన్ని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. పరిపాలనా సందర్భం స్పష్టంగా ఉండేలా వాక్యక్రమాన్ని సవరించాం; అయితే మూలంలోని ‘పెద్ద—చిన్న’ అనే ఉద్దేశపూర్వక విస్తృతతను సంకుచితం చేయలేదు.
