  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בַּ/חֹ֨דֶשׁ֙ הַ/שְּׁלִשִׁ֔י הֵחֵ֥לּוּ הָ/עֲרֵמ֖וֹת לְ/יִסּ֑וֹד וּ/בַ/חֹ֥דֶשׁ הַ/שְּׁבִיעִ֖י כִּלּֽוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/007.yaml
  text: In the third month they began to lay the foundation of the heaps[b][a], and in the seventh month they finished them.
translation:
  language: te
  text: మూడవ నెలలో వారు కుప్పలను అడుగునుండి వేయడం ప్రారంభించారు[b][a], ఏడవ నెలలో వాటిని పూర్తి చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పోగులు.’ హెబ్రీ నామవాచకం సమర్పణగా ఇచ్చిన పంట ఉత్పత్తులను పోగుచేసిన కుప్పలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘వారు కుప్పలను పునాదిగా వేయడం ప్రారంభించారు’; అంటే కుప్పలను వాటి అడుగు భాగం నుంచి వేయడం మొదలుపెట్టారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁלִשִׁי
  choice: మూడవ నెలలో
  rationale: కాలసూచనలో חֹדֶשׁ అంటే సహజంగా ‘నెల’; ב ఉపసర్గను తెలుగులో ‘లో’తో వ్యక్తం చేశాం.
- source_word: הֵחֵלּוּ
  choice: ప్రారంభించారు
  rationale: ఈ నిర్మాణంలో క్రియకు ‘మొదలుపెట్టారు/ప్రారంభించారు’ అనే సాధారణ అర్థం ఉంది.
- source_word: הָעֲרֵמוֹת
  choice: ఆ కుప్పలు
  rationale: עֲרֵמוֹת సమర్పించిన పంట ఉత్పత్తులను పోగుచేసిన కుప్పలను సూచిస్తుంది; ‘కుప్పలు’ మూలంలోని స్పష్టమైన భౌతిక చిత్రాన్ని నిలుపుతుంది.
- source_word: לְיִסּוֹד
  choice: పునాది వేయడం
  rationale: יסד యొక్క infinitive construct ఇక్కడ కుప్పలను అడుగు భాగం నుంచి ఏర్పరచడం మొదలుపెట్టిన భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וּבַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ఏడవ నెలలో
  rationale: ו తో వచ్చే తదుపరి కాలసూచనను తెలుగు వాక్య విరామంతో సహజంగా కొనసాగించాం.
- source_word: כִּלּוּ
  choice: వాటిని పూర్తి చేశారు
  rationale: ‘ముగించారు/పూర్తి చేశారు’ అనే అర్థం; హెబ్రీలో కర్మ స్పష్టంగా లేకపోయినా, ముందున్న కుప్పలను సూచిస్తూ తెలుగులో ‘వాటిని’ చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. మూలంలోని ‘కుప్పలు’ అనే స్పష్టమైన చిత్రాన్ని నిలిపి, לְיִסּוֹד భావాన్ని సహజమైన ‘పునాది వేయడం’తో వ్యక్తం చేశాం. ప్రధాన పాఠ్యంలో ప్రతి పాదసూచిక గుర్తు చేర్చబడింది.
