revisions:
- from: మూడవ నెలలో వారు ఆ కుప్పలకు పునాది వేయడం ప్రారంభించారు[b][a]; ఏడవ నెలలో వాటిని పూర్తి చేశారు.
  to: మూడవ నెలలో వారు కుప్పలను అడుగునుండి వేయడం ప్రారంభించారు[b][a], ఏడవ నెలలో వాటిని పూర్తి చేశారు.
