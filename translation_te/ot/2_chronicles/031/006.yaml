id: 2CH.31.6
reference: 2 Chronicles 31:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֧י יִשְׂרָאֵ֣ל וִֽ/יהוּדָ֗ה הַ/יּֽוֹשְׁבִים֮ בְּ/עָרֵ֣י יְהוּדָה֒ גַּם הֵ֗ם מַעְשַׂ֤ר בָּקָר֙ וָ/צֹ֔אן וּ/מַעְשַׂ֣ר קָֽדָשִׁ֔ים הַ/מְקֻדָּשִׁ֖ים לַ/יהוָ֣ה אֱלֹהֵי/הֶ֑ם הֵבִ֕יאוּ וַֽ/יִּתְּנ֖וּ עֲרֵמ֥וֹת עֲרֵמֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/006.yaml
  text: And the people of Israel and Judah who lived in the cities of Judah also brought the tithe of cattle and sheep[a], and the tithe of the holy things consecrated to Yahweh their God, and they laid them in heaps[b], heap upon heap.
translation:
  language: te
  text: యూదా పట్టణాల్లో నివసిస్తున్న ఇశ్రాయేలు, యూదా ప్రజలు కూడా పశువులు, గొర్రెమేకల పదోవంతును, తమ దేవుడైన యాహ్వేకు ప్రతిష్ఠించిన పవిత్ర వస్తువుల పదోవంతును తీసుకొచ్చి, వాటిని కుప్పలు కుప్పలుగా పేర్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל וִיהוּדָה
  choice: ఇశ్రాయేలు, యూదా ప్రజలు
  rationale: בני అనే పదానికి అక్షరార్థంగా ‘కుమారులు/పిల్లలు’ అని ఉన్నా, ఇక్కడ అది సమాజ సభ్యులను సమష్టిగా సూచిస్తుంది; లింగ పరిమితి కలిగించకుండా సహజమైన ఆధునిక తెలుగు వాడబడింది.
- source_word: הַיֹּשְׁבִים בְּעָרֵי יְהוּדָה
  choice: యూదా పట్టణాల్లో నివసిస్తున్న
  rationale: ישב కృదంతం స్థిరంగా నివసించడాన్ని సూచిస్తుంది; עָרֵי కి సందర్భానుకూలంగా ‘పట్టణాలు’ సహజమైన ఎంపిక.
- source_word: גַּם הֵם
  choice: కూడా
  rationale: వీరు సైతం ఆ సమర్పణలో పాల్గొన్నారనే ఉద్ఘాటనను సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: מַעְשַׂר
  choice: పదోవంతు
  rationale: ఆరాధన సంబంధమైన పదో భాగాన్ని సాధారణ పాఠకులకు నేరుగా అర్థమయ్యేలా తెలుపుతుంది.
- source_word: בָּקָר וָצֹאן
  choice: పశువులు, గొర్రెమేకలు
  rationale: בקר పెద్ద పశువులను, צאן గొర్రెలు-మేకలతో కూడిన చిన్న పశువుల మందను సూచించగలదు; ‘గొర్రెమేకలు’ మూలంలోని విస్తృతిని ‘గొర్రెలు’ కంటే మెరుగుగా కాపాడుతుంది.
- source_word: וּמַעְשַׂר קָדָשִׁים הַמְקֻדָּשִׁים
  choice: ప్రతిష్ఠించిన పవిత్ర వస్తువుల పదోవంతు
  rationale: קָדָשִׁים పవిత్రంగా ప్రత్యేకించిన వస్తువులను, הַמְקֻדָּשִׁים అవి దేవునికి ప్రతిష్ఠించబడ్డాయని సూచిస్తాయి; ఖచ్చితమైన కానుకల వర్గాన్ని అనవసరంగా నిర్ణయించలేదు.
- source_word: לַיהוָה אֱלֹהֵיהֶם
  choice: తమ దేవుడైన యెహోవాకు
  rationale: లామెడ్ దిశ/గ్రహీత భావాన్ని ‘కు’తో తెలిపి, יהוה అనే వ్యక్తిగత దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: הֵבִיאוּ
  choice: తీసుకొచ్చి
  rationale: హిఫిల్ రూపంలోని ‘తీసుకురావడం’ అనే సాధారణ అర్థాన్ని సహజమైన తెలుగు క్రియతో వ్యక్తం చేస్తుంది.
- source_word: וַיִּתְּנוּ עֲרֵמוֹת עֲרֵמוֹת
  choice: వాటిని కుప్పలు కుప్పలుగా పేర్చారు
  rationale: נתן ఇక్కడ వస్తువులను ఉంచడాన్ని సూచిస్తుంది; పునరుక్తమైన עֲרֵמוֹת అనేక కుప్పలుగా అమర్చిన భావాన్ని ఇస్తుంది. ‘పేర్చారు’ భౌతిక చర్యను సహజంగా తెలుపుతుంది.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా వ్యక్తిగత నామంగా ఉంచాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: קָדָשִׁים యొక్క నిర్దిష్ట స్వరూపం
  choice: పవిత్ర వస్తువులు
  alternative: పవిత్ర కానుకలు
  rationale: ఈ పదం దేవునికి ప్రత్యేకించబడిన వస్తువులను సూచిస్తున్నప్పటికీ అవన్నీ ఏ నిర్దిష్ట కానుకల వర్గానికి చెందినవో వాక్యం చెప్పదు; అందువల్ల మూలంలోని విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, చారిత్రక-ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని సమష్టి భావం, పదోవంతు భావం, పవిత్ర వస్తువుల విషయంలోని సాధారణత్వం, ‘కుప్పలు కుప్పలుగా’ అనే పునరుక్తి ఉద్ఘాటన కాపాడబడ్డాయి.
