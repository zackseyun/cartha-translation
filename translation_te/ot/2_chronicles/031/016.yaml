revisions:
- from: వంశావళి ప్రకారం నమోదైన, మూడు సంవత్సరాల వయసు మొదలుకొని అంతకంటే ఎక్కువ వయసున్న మగవారితోపాటు[a], యెహోవా మందిరంలోకి వచ్చిన వారందరూ ప్రతిరోజు అవసరమైన దాని ప్రకారం[b], తమ తమ విభాగాలకు అనుగుణంగా తమ విధి పాళ్లలో[c] సేవ చేశారు.
  to: వంశావళి ప్రకారం నమోదైన, మూడు సంవత్సరాల వయసు మొదలుకొని అంతకంటే ఎక్కువ వయసున్న మగవారిని మినహాయించి[a], యాహ్వే మందిరంలోకి వచ్చిన వారందరికీ ప్రతిరోజూ అవసరమైనది[b] వారి సేవకోసం, వారి విధి పాళ్లలో[c], వారి విభాగాల ప్రకారం ఇవ్వబడింది.
  rationale: The revision corrects the erroneous assertion that all temple entrants performed service. It makes explicit in Telugu the provision/distribution action carried over from the preceding context, while retaining the source’s purpose phrase and the distinctions between service, duty-shifts, and divisions. It restores the separative force of מִלְּבַד and aligns the divine name with the project rendering.
  reviewer_model: gpt-5.6-terra
