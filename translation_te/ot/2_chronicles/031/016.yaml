  yaml_path: translation/ot/2_chronicles/031/016.yaml
  text: apart from those enrolled by genealogy among the males from three years old and upward[a], all who entered the house of Yahweh, as the daily matter required[c][b], for their service in their duties according to their divisions.
translation:
  language: te
  text: వంశావళి ప్రకారం నమోదైన, మూడు సంవత్సరాల వయసు మొదలుకొని అంతకంటే ఎక్కువ వయసున్న మగవారిని మినహాయించి[a], యాహ్వే మందిరంలోకి వచ్చిన వారందరికీ ప్రతిరోజూ అవసరమైనది[b] వారి సేవకోసం, వారి విధి పాళ్లలో[c], వారి విభాగాల ప్రకారం ఇవ్వబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వంశావళి ప్రకారం నమోదైన మగవారి నమోదును తప్పించి.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదశః, “ఒక దినపు విషయం దాని దినాన”; అంటే, ప్రతి రోజుకు అవసరమైనది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “వారి కాపు పాళ్లలో” లేదా “వారి నియమిత పని పాళ్లలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: తోపాటు
  rationale: ఈ సందర్భంలో ముందుగా పేర్కొన్నవారికి అదనంగా మరొక వర్గాన్ని సూచిస్తుంది. సహజమైన తెలుగులో ‘తోపాటు’ ఆ భావాన్ని తెలియజేస్తుంది; ‘మినహా’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: הִתְיַחְשָׂם לִזְכָרִים
  choice: వంశావళి ప్రకారం నమోదైన ... మగవారు
  rationale: יחש హిత్పయేల్ రూపం వంశావళి రికార్డులో నమోదు కావడాన్ని సూచిస్తుంది; זְכָרִים పురుషులను స్పష్టంగా పేర్కొంటుంది.
- source_word: מִבֶּן שָׁלֹשׁ שָׁנִים וּלְמַעְלָה
  choice: మూడు సంవత్సరాల వయసు మొదలుకొని అంతకంటే ఎక్కువ వయసున్న
  rationale: హీబ్రూ వయోపరిమితి వ్యక్తీకరణను స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: לְכָל הַבָּא
  choice: వచ్చిన వారందరూ
  rationale: ఏకవచన కృదంతం ఇక్కడ సమూహార్థకంగా పనిచేస్తుంది; ‘వారందరూ’ ఆ సమగ్ర భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְבֵית יְהוָה
  choice: యెహోవా మందిరంలోకి
  rationale: ‘యెహోవా గృహం’ అనే పదశః రూపానికి బదులుగా ఆలయ సందర్భాన్ని సామాన్య పాఠకునికి స్పష్టంగా తెలియజేసే ‘మందిరం’ వాడబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: ప్రతిరోజు అవసరమైన దాని ప్రకారం
  rationale: ‘ఒక దినపు విషయం దాని దినాన’ అనే హీబ్రూ నుడికారంలోని రోజువారీ అవసరం లేదా కేటాయింపు భావాన్ని సహజంగా అందిస్తుంది.
- source_word: לַעֲבוֹדָתָם
  choice: సేవ చేశారు
  rationale: ఆలయ సందర్భంలో עֲבוֹדָה నియమిత సేవను సూచిస్తుంది. వాక్యం తెలుగులో సంపూర్ణంగా ఉండేందుకు సందర్భానుసారంగా క్రియారూపంలో ఇచ్చాం.
- source_word: בְּמִשְׁמְרוֹתָם
  choice: తమ విధి పాళ్లలో
  rationale: מִשְׁמָרוֹת నియమిత కాపులు, బాధ్యతలు లేదా పని పాళ్లను సూచించగలదు; ‘విధి పాళ్లు’ ఈ పరిపాలనా భావాన్ని నిలుపుతుంది.
- source_word: כְּמַחְלְקוֹתֵיהֶם
  choice: తమ తమ విభాగాలకు అనుగుణంగా
  rationale: యాజకులు లేదా లేవీయుల క్రమబద్ధమైన విభాగాలను సూచించే పదాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ఆలయ సేవకుల లింగ-నిర్దిష్ట ప్రస్తావన
  choice: మగవారు
  alternative: వారు / ప్రజలు
  rationale: హీబ్రూ זְכָרִים పురుషులను స్పష్టంగా పేర్కొంటుంది; లింగాన్ని తటస్థీకరించకుండా మూలంలోని నిర్దిష్టతను నిలిపాం.
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు; సాధారణ తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన శైలి. మూలవాక్యం ముందరి వచనంపై ఆధారపడే నిర్మాణం కావడంతో, తెలుగులో సంపూర్ణ వాక్యంగా చదవడానికి ‘సేవ చేశారు’ అని సందర్భానుసారంగా రూపొందించాం. పరిపాలనా పదాలైన వంశావళి నమోదు, విధి పాళ్లు, విభాగాలు అనే భేదాలను నిలిపాం.
