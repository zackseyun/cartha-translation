id: 2CH.31.11
reference: 2 Chronicles 31:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְחִזְקִיָּ֗הוּ לְ/הָכִ֧ין לְשָׁכ֛וֹת בְּ/בֵ֥ית יְהוָ֖ה וַ/יָּכִֽינוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/011.yaml
  text: Then Hezekiah commanded them to prepare chambers in the house of Yahweh[b][a], and they prepared them.
translation:
  language: te
  text: అప్పుడు హిజ్కియా యాహ్వే మందిరంలో గదులను[a] సిద్ధం చేయమని ఆజ్ఞాపించాడు[b]; వారు వాటిని సిద్ధం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మందిరపు గదులు’ లేదా ‘నిల్వగదులు.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘సిద్ధం చేయమని చెప్పాడు.’ ఇక్కడ ఇది రాజు ఇచ్చిన ఆదేశాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఆజ్ఞాపించాడు
  rationale: మూల క్రియ అక్షరార్థంగా ‘చెప్పాడు’ అయినా, తరువాతి לְהָכִין అనే క్రియారూపంతో కలిసి ఇక్కడ రాజు ఇచ్చిన ఆదేశాన్ని సూచిస్తుంది. ‘ఆజ్ఞాపించాడు’ సందర్భానుగుణ బలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: יְחִזְקִיָּהוּ
  choice: హిజ్కియా
  rationale: ఈ వ్యక్తి పేరుకు ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణమైన లిప్యంతరీకరణ.
- source_word: לְהָכִין
  choice: సిద్ధం చేయాలని
  rationale: כון ధాతువు హిఫీల్ రూపం ఇక్కడ ‘సిద్ధపరచడం’ లేదా ‘ఉపయోగానికి తయారుచేయడం’ అనే భావాన్ని ఇస్తుంది.
- source_word: לְשָׁכוֹת
  choice: గదులు
  rationale: ఈ నామవాచకం మందిర సముదాయంలోని గదులను సూచిస్తుంది. తరువాతి సందర్భంలో వాటి నిల్వ ప్రయోజనం స్పష్టమైనా, ఆ ప్రయోజనం ఈ పదంలోనే ప్రత్యక్షంగా లేదు; కాబట్టి ‘గదులు’ మూలంలోని విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: בְּבֵית יְהוָה
  choice: యెహోవా మందిరంలో
  rationale: ‘యెహోవా ఇంటిలో’ అనేది మరింత రూపానుసారమైన అనువాదం; అయితే ఇక్కడ בֵּית అనే పదం దేవాలయాన్ని సూచిస్తున్నందున ‘మందిరంలో’ సాధారణ తెలుగు పాఠకునికి స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో అందించాం.
- source_word: וַיָּכִינוּ
  choice: వారు వాటిని సిద్ధం చేశారు
  rationale: బహువచన కర్తను ‘వారు’గా, ముందున్న గదులను సూచించే అంతర్భూత కర్మను ‘వాటిని’గా తెలుగులో స్పష్టంగా వ్యక్తం చేశాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా, సాధారణ తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’ను వాడాం. ‘యాహ్వే’ అనేది మరొక సమర్థనీయ లిప్యంతరీకరణ.
- issue: וַיֹּאמֶר యొక్క ఆదేశార్థక బలం
  choice: ఆజ్ఞాపించాడు
  alternative: చెప్పాడు
  rationale: అక్షరార్థం ‘చెప్పాడు’ అయినా, రాజైన హిజ్కియా గదులు సిద్ధం చేయించడానికి ఇచ్చిన సూచనను సందర్భం అధికారిక ఆదేశంగా చూపుతుంది. మూలంలోని పదబంధ అస్పష్టతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మందిరం,’ ‘గదులు,’ ‘సిద్ధం చేశారు’ వంటి సాధారణ పదాలను ఎంచుకున్నాం. ప్రతి పాదసూచిక సూచిక ప్రధాన పాఠ్యంలో ఉంచబడింది.
