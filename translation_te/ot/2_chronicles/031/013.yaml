id: 2CH.31.13
reference: 2 Chronicles 31:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וִֽ/יחִיאֵ֡ל וַ֠/עֲזַזְיָהוּ וְ/נַ֨חַת וַ/עֲשָׂהאֵ֜ל וִֽ/ירִימ֤וֹת וְ/יוֹזָבָד֙ וֶ/אֱלִיאֵ֣ל וְ/יִסְמַכְיָ֔הוּ וּ/מַ֖חַת וּ/בְנָיָ֑הוּ פְּקִידִ֗ים מִ/יַּ֤ד כונניהו וְ/שִׁמְעִ֣י אָחִ֔י/ו בְּ/מִפְקַד֙ יְחִזְקִיָּ֣הוּ הַ/מֶּ֔לֶךְ וַ/עֲזַרְיָ֖הוּ נְגִ֥יד בֵּית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/013.yaml
  text: Jehiel[a], Azaziah, Nahath, Asahel, Jerimoth, Jozabad, Eliel, Ismakiah[b], Mahath, and Benaiah were officers under the authority of Conaniah and Shimei his brother, by the appointment of King Hezekiah and Azariah, the chief officer of the house of God.
translation:
  language: te
  text: యెహీయేలు, అజజ్యా, నహతు, అశాహేలు, యెరీమోతు, యోజాబాదు, ఎలీయేలు, ఇస్మక్యా, మహతు, బెనాయా—వీరు కొనన్యా, అతని సహోదరుడైన షిమీ అధికారానికి లోబడి[a], రాజైన హిజ్కియా మరియు దేవుని మందిరపు ప్రధాన అధికారి అజర్యా చేసిన నియామకం ప్రకారం[b] నియమించబడిన అధికారులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘కొనన్యా, అతని సహోదరుడైన షిమీ చేతి కింద.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆదేశం ప్రకారం’; లేదా ‘పర్యవేక్షణలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקִידִים
  choice: అధికారులు
  rationale: నియమించబడిన పరిపాలనా బాధ్యతగల వ్యక్తులను సూచిస్తుంది. ఆలయ నిర్వహణ సందర్భంలో ‘అధికారులు’ సహజంగా ఉండి, వారి హోదాను అతిశయింపజేయదు.
- source_word: מִיַּד
  choice: అధికారానికి లోబడి
  rationale: అక్షరార్థంగా ‘చేతి నుండి/చేతి కింద’ అనే ఈ హీబ్రూ నుడికారం ఇక్కడ అధికారం లేదా పర్యవేక్షణ కింద ఉండడాన్ని సూచిస్తుంది.
- source_word: אָחִיו
  choice: అతని సహోదరుడైన
  rationale: షిమీ, కొనన్యాకు సహోదరుడని నేరుగా తెలిపే కుటుంబ సంబంధ పదం.
- source_word: בְּמִפְקַד
  choice: చేసిన నియామకం ప్రకారం
  rationale: ఈ పదం నియామకం, ఆదేశం లేదా పర్యవేక్షణను సూచించగలదు. ఇక్కడ అధికారుల పరిపాలనా నియామక సందర్భానికి ‘నియామకం ప్రకారం’ సరిపోతుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: נְגִיד
  choice: ప్రధాన అధికారి
  rationale: నాయకుడు లేదా ముఖ్య అధికారిని సూచిస్తుంది. ఆలయ పరిపాలనా సందర్భంలో ‘ప్రధాన అధికారి’ స్పష్టంగా ఉండి, మూలంలో లేని రాజవంశీయ హోదాను సూచించదు.
- source_word: בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరం
  rationale: అక్షరార్థం ‘దేవుని ఇల్లు’; ఈ సందర్భంలో ఆలయాన్ని సూచించే సహజమైన ఆధునిక తెలుగు రూపం ‘దేవుని మందిరం’.
- source_word: יְחִיאֵל, עֲזַזְיָהוּ, נַחַת, עֲשָׂהאֵל, יְרִימוֹת, יוֹזָבָד, אֱלִיאֵל, יִסְמַכְיָהוּ, מַחַת, בְּנָיָהוּ, כּוֹנַנְיָהוּ, שִׁמְעִי, יְחִזְקִיָּהוּ, עֲזַרְיָהוּ
  choice: యెహీయేలు, అజజ్యా, నహతు, అశాహేలు, యెరీమోతు, యోజాబాదు, ఎలీయేలు, ఇస్మక్యా, మహతు, బెనాయా, కొనన్యా, షిమీ, హిజ్కియా, అజర్యా
  rationale: హీబ్రూ వ్యక్తినామాలను ఆధునిక తెలుగు బైబిలు పఠనానికి అనుకూలంగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: ఆలయ పరిపాలనా హోదాల స్వభావం
  choice: పరిపాలనా పదాలను సాధారణ సంస్థాగత భాషలో ‘అధికారులు’, ‘ప్రధాన అధికారి’ అని అనువదించడం
  alternative: ‘పాలకులు’, ‘అధిపతులు’ వంటి మరింత ఉన్నత హోదాను సూచించే పదాలు వాడడం
  rationale: ఈ వచనం ప్రధానంగా అధికారుల జాబితాను, వారి బాధ్యతా క్రమాన్ని వివరిస్తుంది. హీబ్రూ పాఠం అవసరపరచని యాజక లేదా రాజ హోదాను అనువాదం చేర్చకూడదు.
- issue: בְּמִפְקַד పదంలోని భావ వైవిధ్యం
  choice: ప్రధాన పాఠంలో ‘నియామకం ప్రకారం’
  alternative: ‘ఆదేశం ప్రకారం’ లేదా ‘పర్యవేక్షణలో’
  rationale: సందర్భం అధికారుల నియామకాన్ని సూచించినప్పటికీ, మూలపదానికి ఆదేశం లేదా పర్యవేక్షణ అనే భావాలు కూడా సాధ్యమే; అందువల్ల వాటిని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా, అయితే చారిత్రక-ఆలయ పరిపాలనా సందర్భానికి తగిన గంభీరతతో రూపొందించబడింది. పొడవైన హీబ్రూ వాక్యాన్ని స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; అధికార క్రమం మరియు నియామక సంబంధం యథాతథంగా నిలిపాం.
