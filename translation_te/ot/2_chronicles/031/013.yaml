  source_fidelity: పేర్ల జాబితా, కొనన్యా మరియు అతని సహోదరుడు షిమీ కిందనున్న పరిపాలనా సంబంధం, అలాగే హిజ్కియా రాజు మరియు దేవుని మందిరపు ప్రధాన అధికారి అజర్యా పాత్రను ముసాయిదా సరిగ్గా ప్రతిబింబిస్తుంది. అయితే చివరి క్రియ ‘వారు సేవచేశారు’ హీబ్రూ పాఠంలో లేని సేవచేయుట అనే భావాన్ని చేర్చుతుంది. మూలం వారిని అధికారులుగా పేర్కొని, వారి నియామకం/ఆదేశ సంబంధాన్ని మాత్రమే తెలియజేస్తుంది.
