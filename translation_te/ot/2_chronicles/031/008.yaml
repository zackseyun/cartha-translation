source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ יְחִזְקִיָּ֣הוּ וְ/הַ/שָּׂרִ֔ים וַ/יִּרְא֖וּ אֶת הָ/עֲרֵמ֑וֹת וַֽ/יְבָרֲכוּ֙ אֶת יְהוָ֔ה וְ/אֵ֖ת עַמּ֥/וֹ יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/008.yaml
  text: When Hezekiah and the officials came and saw the heaps[b][a], they blessed Yahweh and his people Israel.
translation:
  language: te
  text: హిజ్కియా, అధికారులు వచ్చి ఆ కుప్పలను చూసినప్పుడు, వారు యెహోవాను, ఆయన ప్రజలైన ఇశ్రాయేలును ప్రశంసించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘ఆయన’ అనేది యెహోవాను సూచిస్తుందని ప్రధాన పాఠం తీసుకుంది. హీబ్రూ వ్యాకరణం ప్రకారం అది హిజ్కియాను సూచించే అవకాశమూ ఉంది: ‘అతని ప్రజలైన ఇశ్రాయేలును.’'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: వచ్చి
  rationale: בוא అనే క్రియను కథన క్రమంలో సహజమైన ఆధునిక తెలుగు రూపమైన ‘వచ్చి’ అని అనువదించాం.
- source_word: יְחִזְקִיָּהוּ
  choice: హిజ్కియా
  rationale: వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంతో లిప్యంతరీకరించాం.
- source_word: וְהַשָּׂרִים
  choice: అధికారులు
  rationale: שׂרים ఇక్కడ పాలనా నాయకులను సూచిస్తుంది; ‘అధికారులు’ ఆధునికంగా, సందర్భోచితంగా ఉంది.
- source_word: וַיִּרְאוּ
  choice: చూసినప్పుడు
  rationale: ראה యొక్క ప్రత్యక్ష దృశ్యగ్రహణ భావాన్ని నిలుపుతూ తెలుగు వాక్యనిర్మాణంలో సహజంగా కాలసంబంధ ఉపవాక్యంగా ఇచ్చాం.
- source_word: הָעֲרֵמוֹת
  choice: ఆ కుప్పలను
  rationale: ఈ నామవాచకం పోగుచేసిన ధాన్యాదుల కుప్పలను సూచిస్తుంది; ‘కుప్పలు’ స్పష్టమైన భౌతిక చిత్రాన్ని నిలుపుతుంది.
- source_word: וַיְבָרֲכוּ
  choice: ఆశీర్వదించారు
  rationale: ברך కు దేవుడు కర్మగా ఉన్నప్పుడు స్తుతించడం అనే భావం ఉన్నప్పటికీ, అదే క్రియ యెహోవాకు మరియు ప్రజలకు వర్తిస్తున్నందున మూలంలోని పదబంధ ఉద్రిక్తతను నిలుపేందుకు ‘ఆశీర్వదించారు’ ఎంచుకున్నాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוה ను తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఇచ్చాం.
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: ఆయన ప్రజలైన ఇశ్రాయేలును
  rationale: ‘ఆయన’ సహజంగా యెహోవాను సూచించేలా ప్రధాన పాఠం రూపొందించాం; ఇశ్రాయేలు ఆ ప్రజల గుర్తింపని ‘ప్రజలైన’ స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ‘ఆయన ప్రజలు’లో సర్వనామ ప్రత్యయం ఎవరిని సూచిస్తుంది?
  choice: 'యెహోవాను సూచిస్తుంది: ‘ఆయన ప్రజలైన ఇశ్రాయేలు.’'
  alternative: 'హిజ్కియాను సూచించవచ్చు: ‘అతని ప్రజలైన ఇశ్రాయేలు.’'
  rationale: సమీపంలోని యెహోవా అనే పూర్వపదం, ఇశ్రాయేలు యెహోవా ప్రజలు అనే సాధారణ బైబిలు వాడుక ప్రధాన పఠనానికి బలం ఇస్తాయి. అయినా హీబ్రూ పురుష ఏకవచన ప్రత్యయం వ్యాకరణపరంగా హిజ్కియాను కూడా సూచించగలదు; అందువల్ల ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం. మూలంలోని ఒకే ברך క్రియ యెహోవా మరియు ఇశ్రాయేలు రెండింటినీ కర్మలుగా తీసుకునే నిర్మాణాన్ని విడదీయకుండా నిలిపాం.
