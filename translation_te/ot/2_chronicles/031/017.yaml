source:
  edition: WLC
  text: וְ/אֵ֨ת הִתְיַחֵ֤שׂ הַ/כֹּהֲנִים֙ לְ/בֵ֣ית אֲבוֹתֵי/הֶ֔ם וְ/הַ֨/לְוִיִּ֔ם מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וּ/לְ/מָ֑עְלָ/ה בְּ/מִשְׁמְרוֹתֵי/הֶ֖ם בְּ/מַחְלְקוֹתֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/017.yaml
  text: The genealogical registration of the priests was by their fathers’ houses[a], and that of the Levites from twenty years old and upward[b], in their duties by their divisions.
translation:
  language: te
  text: యాజకుల వంశావళి నమోదు వారి పితృకుటుంబాల[b] ప్రకారం జరిగింది; లేవీయుల వంశావళి నమోదు ఇరవై సంవత్సరాల వయసు నుండి పైవయసువారివరకు, వారి సేవా బాధ్యతలు మరియు విభాగాల ప్రకారం జరిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘పితృకుటుంబాలు’ అనగా అధికారిక నమోదు, సేవా వ్యవస్థీకరణ కోసం ఉపయోగించిన పూర్వీకుల కుటుంబ సమూహాలు.
    reason: cultural_note
lexical_decisions:
- source_word: הִתְיַחֵשׂ
  choice: వంశావళి నమోదు
  rationale: ఈ క్రియ వంశపారంపర్య వివరాల ఆధారంగా అధికారిక జాబితాలో నమోదు చేయడాన్ని సూచిస్తుంది. హీబ్రూ వాక్యం సంక్షిప్తంగా, క్రియను స్పష్టంగా పునరుక్తి చేయకుండా ఉన్నందున, తెలుగులో పరిపాలనా భావాన్ని సహజంగా తెలిపేందుకు నామవాచక పదబంధాన్ని వాడాం.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: యాజక వర్గానికి ఆధునిక ప్రామాణిక తెలుగులో సహజమైన పదం.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: వారి పితృకుటుంబాల ప్రకారం
  rationale: అధికారిక నమోదు, సేవా వ్యవస్థీకరణకు ఆధారమైన తండ్రి వంశపు కుటుంబ సమూహాలను సూచిస్తుంది; ‘పితృకుటుంబాలు’ మూలంలోని వంశాధారిత భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וְהַלְוִיִּם
  choice: లేవీయుల నమోదు
  rationale: హీబ్రూలో ముందున్న వంశావళి నమోదు భావమే ఇక్కడ కూడా కొనసాగుతుంది. తెలుగులో సమాంతర నిర్మాణం స్పష్టంగా ఉండేందుకు ‘నమోదు’ను సరఫరా చేశాం.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וּלְמָעְלָה
  choice: ఇరవై ఏళ్ల వయసు మొదలుకొని అంతకంటే ఎక్కువ వయసుగలవారికి
  rationale: ఇరవై ఏళ్లు కనిష్ఠ వయోపరిమితి అని స్పష్టంగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְּמִשְׁמְרוֹתֵיהֶם
  choice: వారి విధుల ప్రకారం
  rationale: ఇక్కడ పదం కాపలా పహారాలను మాత్రమే కాక అప్పగించబడిన సేవా బాధ్యతలను సూచించగలదు; ‘విధులు’ ఆ విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: בְּמַחְלְקוֹתֵיהֶם
  choice: వారి విభాగాల ప్రకారం
  rationale: సేవ కోసం ఏర్పాటు చేసిన క్రమబద్ధమైన గుంపులు లేదా వంతులను సూచిస్తుంది. ‘విభాగాలు’ పరిపాలనా సందర్భానికి సహజంగా సరిపోతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే పరిపాలనా శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని సంక్షిప్తతను పాదటిప్పణిలో సూచిస్తూ, ప్రధాన వాక్యంలో అవసరమైనంత మాత్రమె క్రియను సరఫరా చేశాం. రెండు בְּ పదబంధాలను సమానంగా ‘ప్రకారం’ అని అనువదించి వాటి సమాంతర నిర్మాణాన్ని నిలిపాం.
