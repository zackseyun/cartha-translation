  terminology: హిజ్కియా అనే పేరు ఆమోదయోగ్యమైన తెలుగు రూపం. యాహ్వే వ్యక్తినామాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది. «యథార్థమైనదానిని» ישר యొక్క నైతిక నిటారుదనం/సరైనతనాన్ని, «సత్యమైనదానిని» אמת యొక్క ప్రధాన భావాన్ని వ్యక్తం చేస్తాయి; నమ్మకత్వం లేదా విశ్వసనీయత అనే భావపరిధి పాదటిప్పణిలో భద్రంగా ఉంది.
