source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ כָּ/זֹ֛את יְחִזְקִיָּ֖הוּ בְּ/כָל יְהוּדָ֑ה וַ/יַּ֨עַשׂ הַ/טּ֤וֹב וְ/הַ/יָּשָׁר֙ וְ/הָ֣/אֱמֶ֔ת לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/020.yaml
  text: Hezekiah did this throughout all Judah[a], and he did what was good and right and true before Yahweh his God.
translation:
  language: te
  text: హిజ్కియా యూదా దేశమంతటా ఈ విధంగా చేశాడు. తన దేవుడైన యాహ్వే సమక్షంలో మంచిదానిని, యథార్థమైనదానిని, సత్యమైనదానిని చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నమ్మకమైనదానిని” లేదా “విశ్వసనీయమైనదానిని.” హీబ్రూ పదం సత్యం, విశ్వసనీయత లేదా నమ్మకత్వాన్ని సూచించగలదు; ఇక్కడ అది నమ్మకమైన, యథార్థమైన ప్రవర్తనను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ כָּזֹאת
  choice: ఈ విధంగా చేశాడు
  rationale: ముందు వివరించిన సంస్కరణలు, ఏర్పాట్లను సంగ్రహంగా సూచించే హీబ్రూ ప్రయోగాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְּכָל יְהוּדָה
  choice: యూదా దేశమంతటా
  rationale: యూదా భూభాగమంతటినీ ఆవరించిన కార్యపరిధిని స్పష్టంగా తెలుపుతుంది.
- source_word: הַטּוֹב
  choice: మంచిదానిని
  rationale: నామవాచకంగా వాడిన విశేషణాన్ని, అతడు చేసినది ఏమిటో తెలిపే విధంగా తెలుగులో నిలుపుతుంది.
- source_word: הַיָּשָׁר
  choice: న్యాయమైనదానిని
  rationale: నైతికంగా సరైనది, యథార్థమైనది అనే భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָאֱמֶת
  choice: నమ్మకమైనదానిని
  rationale: אֱמֶת ఇక్కడ సత్యం మాత్రమే కాక విశ్వసనీయత, నమ్మకత్వం లేదా యథార్థ ప్రవర్తనను సూచించగలదు; నైతిక త్రయంలో ఆ ప్రవర్తనా భావాన్ని ఈ పదం తెలియజేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా సమక్షంలో
  rationale: దేవుని సన్నిధిలోను ఆయన పరిశీలనకు లోబడియు చేసిన కార్యమనే సంబంధాత్మక, మూల్యాంకన భావాలను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని తెలుగులో సుపరిచితమైన ప్రత్యక్ష నామరూపంతో అందిస్తుంది; బిరుదుతో భర్తీ చేయదు.
- source_word: אֱלֹהָיו
  choice: తన దేవుడైన
  rationale: హిజ్కియాతో దేవునికి ఉన్న వ్యక్తిగత సంబంధాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. తెలుగులో విస్తృతంగా గుర్తించబడే నామరూపాన్ని ఉపయోగించడం ద్వారా దానిని బిరుదుగా మార్చకుండా నిలుపుతున్నాం.
- issue: הָאֱמֶת యొక్క నైతిక భావం
  choice: నమ్మకమైనదానిని
  alternative: సత్యమైనదానిని / యథార్థమైనదానిని
  rationale: ఈ పదానికి సత్యం, విశ్వసనీయత, నమ్మకత్వం అనే అర్థ పరిధి ఉంది. ఇక్కడ ‘మంచిది, న్యాయమైనది’ అనే ప్రవర్తనా త్రయంలో ఉండటంతో ‘నమ్మకమైనది’ అనేది సందర్భోచితం; అయితే ‘సత్యమైనది’ కూడా సాధ్యమేనని పాదటిప్పణి ద్వారా అస్పష్టతను నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని నైతిక త్రయాన్ని స్పష్టంగా నిలిపి, אֱמֶת పదంలోని భావవిస్తృతిని పాదటిప్పణిలో సంరక్షించాం.
