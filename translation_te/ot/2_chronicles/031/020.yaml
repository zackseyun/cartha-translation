  source_fidelity: హీబ్రూ వచనంలోని పునరుక్తి, యూదా అంతటా అన్న కార్యపరిధి, అలాగే మంచి–యథార్థమైనది–సత్యమైనది అనే నైతిక త్రయం నిలిచాయి. అయితే יְהוָהను ప్రాజెక్టు నిర్ణయానికి, మూలనామానికి అనుగుణంగా «యాహ్వే»గా ఇవ్వాలి; «యెహోవా» అనేది సంప్రదాయ రూపం అయినా ఇక్కడ అనుసరించాల్సిన పేరురూపం కాదు. הַיָּשָׁרకు «న్యాయమైనది» కొంతవరకు న్యాయ/న్యాయశాస్త్ర భావాన్ని కలిగిస్తుంది; «యథార్థమైనది» నైతిక ‘నేరుగా/సరైనది’ అనే భావాన్ని మెరుగుగా అందిస్తుంది. הָאֱמֶתకు ప్రాథమికమైన «సత్యమైనది»ను పాఠ్యంలో ఉంచి, ‘నమ్మకమైనది’ అనే సందర్భోచిత ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలుపుతున్నాం.
