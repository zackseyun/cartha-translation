id: 2CH.31.3
reference: 2 Chronicles 31:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מְנָת֩ הַ/מֶּ֨לֶךְ מִן רְכוּשׁ֜/וֹ לָ/עֹל֗וֹת לְ/עֹלוֹת֙ הַ/בֹּ֣קֶר וְ/הָ/עֶ֔רֶב וְ/הָ֣/עֹל֔וֹת לַ/שַּׁבָּת֖וֹת וְ/לֶ/חֳדָשִׁ֣ים וְ/לַ/מֹּעֲדִ֑ים כַּ/כָּת֖וּב בְּ/תוֹרַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/003.yaml
  text: 'The king’s portion from his own possessions was for the burnt offerings: the burnt offerings of the morning and the evening[a], and the burnt offerings for the Sabbaths, the new moons, and the appointed feasts[e][d][c][b], as it is written in the Law of Yahweh.'
translation:
  language: te
  text: 'రాజు తన సొంత ఆస్తినుండి ఇచ్చే వాటా[a] దహనబలుల కోసం ఉండేది[b]: ఉదయపు, సాయంకాలపు దహనబలుల కోసం, అలాగే విశ్రాంతి దినాల్లో, అమావాస్యల్లో[c], నియమిత పండుగల్లో[d] అర్పించే దహనబలుల కోసం—యాహ్వే ధర్మశాస్త్రంలో[e] వ్రాయబడిన ప్రకారం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “రాజు వాటా,” “రాజుకు నిర్ణయించిన భాగం.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ వాక్యనిర్మాణాన్ని మరింత అక్షరార్థంగా అనువదిస్తే, “దహనబలుల కోసం—దహనబలుల కోసం” అని ఉంటుంది.
    reason: source_form
  - marker: c
    text: “అమావాస్యలు” అనేది ఇశ్రాయేలు ఆరాధనా పంచాంగంలోని నెలవారీ అమావాస్య ఆచారాలను సూచిస్తుంది.
    reason: cultural_note
  - marker: d
    text: లేదా “నియమిత కాలాల్లో,” “నియమిత ఉత్సవాల్లో.”
    reason: lexical_alternative
  - marker: e
    text: “యాహ్వే తోరాలో” అనేది మరింత అక్షరార్థమైన ప్రత్యామ్నాయం; תּוֹרָה అనే పదానికి “ఉపదేశం” అనే విస్తృత భావం కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְנָת הַמֶּלֶךְ
  choice: రాజు ... కేటాయించిన భాగం
  rationale: מְנָה అనేది నిర్ణయించి కేటాయించిన భాగాన్ని సూచిస్తుంది. ఈ అనువాదం రాజుకు సంబంధించిన కేటాయింపనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מִן רְכוּשׁוֹ
  choice: తన సొంత ఆస్తిలోనుండి
  rationale: רְכוּשׁוֹ రాజు వ్యక్తిగత ఆస్తి లేదా సంపదను సూచిస్తుంది; ప్రజల విరాళాల నుంచి కాకుండా అతని స్వంత వనరుల నుంచి ఈ భాగం వచ్చిందనే భావం స్పష్టమవుతుంది.
- source_word: לָעֹלוֹת
  choice: దహనబలుల కోసం
  rationale: עֹלָה పూర్తిగా దహనం చేసే బలికి వాడే ప్రామాణిక ఆరాధనా పదం; 'దహనబలి' తెలుగు బైబిలు భాషలో స్పష్టమైన, స్థిరమైన పదం.
- source_word: לְעֹלוֹת הַבֹּקֶר וְהָעֶרֶב
  choice: ఉదయం, సాయంత్రం అర్పించే దహనబలుల కోసం
  rationale: హీబ్రూ వాక్యనిర్మాణంలోని ఉదయం-సాయంత్రం సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, ఇవి క్రమంగా అర్పించే బలులని సూచిస్తుంది.
- source_word: וְהָעֹלוֹת לַשַּׁבָּתוֹת וְלֶחֳדָשִׁים וְלַמֹּעֲדִים
  choice: విశ్రాంతి దినాల్లో, అమావాస్యల్లో, నియమిత పండుగల్లో అర్పించే దహనబలుల కోసం
  rationale: שַׁבָּתוֹת వారపు విశ్రాంతి దినాలను, חֳדָשִׁים ఈ ఆరాధనా సందర్భంలో నెలవారీ అమావాస్య ఆచారాలను, מוֹעֲדִים దేవుడు నియమించిన పండుగ సమయాలను సూచిస్తాయి.
- source_word: כַּכָּתוּב
  choice: వ్రాయబడిన ప్రకారం
  rationale: లిఖితపూర్వక ఆజ్ఞకు అనుగుణంగా జరిగినదనే సూత్రప్రాయ భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְּתוֹרַת יְהוָה
  choice: యాహ్వే ధర్మశాస్త్రంలో
  rationale: ఈ ఆరాధనా-నియమ సందర్భంలో תּוֹרָה లిఖిత ధర్మశాస్త్రాన్ని సూచిస్తుంది; יְהוָה అనే దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా 'యాహ్వే'గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణకు దగ్గరగా తెలుగులో ప్రతిఫలిస్తుంది.
- issue: תּוֹרָה యొక్క సందర్భానుసార భావం
  choice: ధర్మశాస్త్రం
  alternative: ఉపదేశం; తోరా
  rationale: బలులు, విశ్రాంతి దినాలు, అమావాస్యలు, పండుగలకు సంబంధించిన లిఖిత నియమాలను ఈ సందర్భం ప్రస్తావిస్తుంది. అందువల్ల 'ధర్మశాస్త్రం' సరిపోతుంది; అయితే పదానికి విస్తృతంగా 'ఉపదేశం' అనే భావమూ ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని నామవాచక వాక్యాన్ని తెలుగులో సహజంగా చేయడానికి “ఉండేది”ని పూరించాం. ఆరాధనా పదజాలంలో స్థిరత్వం కోసం “దహనబలి,” “విశ్రాంతి దినం,” “అమావాస్య,” “ధర్మశాస్త్రం” అనే రూపాలను ఎంచుకున్నాం.
