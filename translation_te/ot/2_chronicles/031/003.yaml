  to: 'రాజు తన సొంత ఆస్తినుండి ఇచ్చే వాటా[a] దహనబలుల కోసం ఉండేది[b]: ఉదయపు, సాయంకాలపు దహనబలుల కోసం, అలాగే విశ్రాంతి దినాల్లో, అమావాస్యల్లో[c], నియమిత పండుగల్లో[d] అర్పించే దహనబలుల కోసం—యాహ్వే ధర్మశాస్త్రంలో[e] వ్రాయబడిన ప్రకారం.'
