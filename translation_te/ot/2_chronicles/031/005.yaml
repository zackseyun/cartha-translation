id: 2CH.31.5
reference: 2 Chronicles 31:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כִ/פְרֹ֣ץ הַ/דָּבָ֗ר הִרְבּ֤וּ בְנֵֽי יִשְׂרָאֵל֙ רֵאשִׁ֣ית דָּגָ֗ן תִּיר֤וֹשׁ וְ/יִצְהָר֙ וּ/דְבַ֔שׁ וְ/כֹ֖ל תְּבוּאַ֣ת שָׂדֶ֑ה וּ/מַעְשַׂ֥ר הַ/כֹּ֛ל לָ/רֹ֖ב הֵבִֽיאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/005.yaml
  text: And when the matter spread[a], the sons of Israel brought in abundance the firstfruits of grain, new wine, oil, honey, and all the produce of the field[b]; they brought in abundantly the tithe of everything.
translation:
  language: te
  text: ఆ విషయం వ్యాపించగానే, ఇశ్రాయేలీయులు[a] ధాన్యం, కొత్త ద్రాక్షారసం, నూనె, తేనె[b], పొలంలోని సమస్త దిగుబడుల ప్రథమఫలాలను విస్తారంగా తీసుకొచ్చారు. వారు అన్నిటిలోని దశమభాగాన్ని సమృద్ధిగా తీసుకొచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు”; ఇది ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచించే సాధారణ ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: “తేనె” అనే హీబ్రూ పదం కొన్ని సందర్భాల్లో తేనెటీగల తేనెనే కాక ఖర్జూరపు పాకం వంటి తీపి పాకాన్ని కూడా సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִ/פְרֹץ הַ/דָּבָר
  choice: ఆ విషయం వ్యాపించగానే
  rationale: כי తో కూడిన פרץ క్రియారూపం కాలసంబంధమైన ‘వ్యాపించగానే’ అనే భావాన్ని ఇస్తుంది; הַדָּבָר ను ‘ఆ విషయం’గా ఉంచడం వల్ల అది ఆజ్ఞనా, దాని గురించిన సమాచారమా అన్నది అతిగా నిర్దిష్టం చేయబడదు.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు[a]
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; అయితే ఇక్కడ అది మొత్తం ఇశ్రాయేలు ప్రజలను సూచించే స్థిరమైన సామూహిక ప్రయోగం. ఆధునిక తెలుగులో సహజమైన ‘ఇశ్రాయేలీయులు’ను ప్రధాన పాఠ్యంలో ఉంచి, మూలరూపాన్ని పాదసూచికలో తెలిపాం.
- source_word: רֵאשִׁית
  choice: ప్రథమఫలాలు
  rationale: అర్పణల సందర్భంలో ఇది పంటలో దేవునికి ప్రత్యేకంగా సమర్పించే మొదటి భాగాన్ని సూచించే సాంకేతిక పదం.
- source_word: דָּגָן תִּירוֹשׁ וְיִצְהָר
  choice: ధాన్యం, కొత్త ద్రాక్షారసం, నూనె
  rationale: דגן సాధారణ ధాన్యాన్ని, תירוש తాజా లేదా కొత్త ద్రాక్షారసాన్ని, יצהר ప్రధానంగా తాజా నూనెను సూచిస్తాయి. నూనెను ‘ఒలీవ నూనె’గా పరిమితం చేయకుండా మూలంలోని సాధారణతను నిలిపాం.
- source_word: דְבַשׁ
  choice: తేనె[b]
  rationale: సాధారణ అర్థమైన ‘తేనె’ను ప్రధాన పాఠ్యంలో ఉంచాం; కొన్ని సందర్భాల్లో ఇది ఖర్జూరపు తీపి పాకాన్ని కూడా సూచించగలదని పాదసూచికలో తెలిపాం.
- source_word: וְכֹל תְּבוּאַת שָׂדֶה
  choice: పొలంలోని సమస్త పంటలు
  rationale: תבואה అంటే పొలం ఇచ్చే దిగుబడి లేదా పంట. ‘పొలంలోని సమస్త పంటలు’ ఆధునిక తెలుగులో సహజంగా వ్యవసాయ భావాన్ని తెలియజేస్తుంది.
- source_word: וּמַעְשַׂר הַכֹּל
  choice: అన్నిటిలోని దశమభాగం
  rationale: מעשר అర్పణగా ఇచ్చే పదో వంతుకు వాడే సాంకేతిక పదం; ‘దశమభాగం’ ఆ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לָרֹב
  choice: సమృద్ధిగా
  rationale: తీసుకొచ్చిన దశమభాగం గొప్ప పరిమాణంలో ఉందనే వాక్యాంత నొక్కింపును సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל అనే లింగసూచక సామూహిక ప్రయోగం
  choice: ఇశ్రాయేలీయులు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: ఈ చారిత్రక సందర్భంలో హీబ్రూ పురుష బహువచన రూపం కేవలం మగవారిని కాక ఇశ్రాయేలు సమాజాన్ని సమష్టిగా సూచిస్తుంది. తెలుగులో ‘ఇశ్రాయేలు కుమారులు’ అనడం అనవసరంగా పరిధిని మగవారికే పరిమితం చేసినట్లు వినిపించవచ్చు; అందువల్ల సామూహిక అర్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, అక్షరార్థ రూపాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే వాక్యనిర్మాణం వాడబడింది. వ్యవసాయ అర్పణలకు సంబంధించిన ‘ప్రథమఫలాలు’, ‘దశమభాగం’ అనే స్థిర పదాలను నిలిపి, అస్పష్టత ఉన్న చోట పాదసూచికలతో వివరణ ఇచ్చాం.
