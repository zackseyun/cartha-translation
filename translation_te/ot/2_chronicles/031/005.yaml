- from: ఆ విషయం వ్యాపించగానే, ఇశ్రాయేలీయులు[a] ధాన్యం, కొత్త ద్రాక్షారసం, నూనె, తేనె[b], పొలంలోని సమస్త పంటల ప్రథమఫలాలను విస్తారంగా తీసుకొచ్చారు. అలాగే అన్నిటిలోని దశమభాగాన్ని కూడా సమృద్ధిగా తీసుకొచ్చారు.
  to: ఆ విషయం వ్యాపించగానే, ఇశ్రాయేలీయులు[a] ధాన్యం, కొత్త ద్రాక్షారసం, నూనె, తేనె[b], పొలంలోని సమస్త దిగుబడుల ప్రథమఫలాలను విస్తారంగా తీసుకొచ్చారు. వారు అన్నిటిలోని దశమభాగాన్ని సమృద్ధిగా తీసుకొచ్చారు.
  rationale: సవరణలు అర్థాన్ని మార్చవు. మొదటి వాక్యంలో ప్రథమఫలాలు జాబితాలోని అన్ని వ్యవసాయ ఉత్పత్తులకు సంబంధించినవని స్పష్టపరిచాయి; రెండవ వాక్యంలో మూలంలో లేని స్వల్ప అనుసంధాన నొక్కింపులను తొలగించాయి. పాదసూచికల గుర్తులు మరియు వాటి విషయాలు యథాతథంగా సరైనవి.
