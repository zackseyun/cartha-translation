  yaml_path: translation/ot/2_chronicles/031/012.yaml
  text: They brought in the contribution[a], the tithe, and the holy things faithfully, and Conaniah the Levite was chief over them[b], with his brother Shimei second.
translation:
  language: te
  text: వారు కానుకను, దశమభాగాన్ని, పవిత్రమైన వస్తువులను[a] నమ్మకంగా తీసుకొచ్చారు. వాటిపై లేవీయుడైన కొనన్యా ప్రధాన అధికారిగా ఉన్నాడు; అతని సోదరుడు షిమీ రెండవ స్థానంలో ఉన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రతిష్ఠితమైన వస్తువులను.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతని సోదరుడు షిమీ ఉపాధికారిగా ఉన్నాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: తీసుకొచ్చారు
  rationale: בוא యొక్క హిఫీల్ రూపం ‘తీసుకురావడం’ అని అర్థం. ఆలయపు గిడ్డంగుల సందర్భం ఉన్నప్పటికీ, మూల క్రియ చెప్పినదానికంటే ఎక్కువగా ‘నిల్వలో ఉంచారు’ అని నిర్దిష్టం చేయకుండా సహజమైన తెలుగు వాడబడింది.
- source_word: הַתְּרוּמָה
  choice: ప్రతిష్ఠిత అర్పణ
  rationale: תְּרוּמָה దేవుని సేవ కోసం ప్రత్యేకంగా వేరుచేసిన అర్పణను సూచిస్తుంది. ‘ప్రతిష్ఠిత అర్పణ’ పవిత్ర ప్రయోజనం కోసం వేరుచేయబడిన భావాన్ని తెలియజేస్తూ, అతిగా సాంకేతికమైన పదజాలాన్ని నివారిస్తుంది.
- source_word: הַמַּעֲשֵׂר
  choice: దశమభాగం
  rationale: מַעֲשֵׂר దేవునికి ఇచ్చే పదవ వంతుకు సాధారణ హీబ్రూ పదం; ‘దశమభాగం’ ఆధునిక తెలుగులో స్పష్టమైన, స్థిరమైన సమానార్థకం.
- source_word: הַקֳּדָשִׁים
  choice: పరిశుద్ధ వస్తువులు
  rationale: קֹדֶשׁ యొక్క బహువచనం ఇక్కడ పవిత్ర సేవ కోసం ప్రత్యేకించబడిన వస్తువులు లేదా కానుకలను సూచిస్తుంది. ‘పరిశుద్ధ వస్తువులు’ మూలానికి దగ్గరగా ఉండి అర్థమయ్యేలా ఉంది; ‘ప్రతిష్ఠిత వస్తువులు’ కూడా సాధ్యమే కాబట్టి పాదసూచికలో ఇచ్చాం.
- source_word: בֶּאֱמוּנָה
  choice: నమ్మకంగా
  rationale: అధికార నిర్వహణ సందర్భంలో אֱמוּנָה నమ్మకత్వం, విశ్వసనీయత, నిజాయితీ అనే భావాలను కలిగి ఉంటుంది. ‘నమ్మకంగా’ ఈ భావాన్ని సహజమైన క్రియావిశేషణంగా వ్యక్తపరుస్తుంది.
- source_word: וַעֲלֵיהֶם
  choice: వాటి బాధ్యతలో
  rationale: עַל తో కూడిన సర్వనామ ప్రత్యయం ముందుగా చెప్పిన అర్పణలు, దశమభాగం, పరిశుద్ధ వస్తువులపై పర్యవేక్షణను సూచిస్తుంది. తెలుగులో ‘వాటి బాధ్యతలో’ పరిపాలనా సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: נָגִיד
  choice: ప్రధాన అధికారి
  rationale: נָגִיד నియమించబడిన నాయకుడు లేదా బాధ్యతగల అధికారిని సూచిస్తుంది. ఆలయ నిర్వహణ సందర్భంలో ‘ప్రధాన అధికారి’ రాజాధికార భావాన్ని చేర్చకుండా పర్యవేక్షణ స్థానాన్ని స్పష్టం చేస్తుంది.
- source_word: כונניהו
  choice: కొనన్యా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో పలకడానికి అనువుగా లిప్యంతరీకరించాం.
- source_word: הַלֵּוִי
  choice: లేవీయుడైన
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదం ఉంది; ఇది కొనన్యాను తెలిసిన లేవీయ అధికారిగా గుర్తిస్తుంది. తెలుగులో విశేషణ రూపం సహజంగా ఉంటుంది.
- source_word: אָחִיהוּ
  choice: అతని సోదరుడు
  rationale: אָח సాధారణంగా నిజమైన సోదరుడనే అర్థం ఇస్తుంది; దీన్ని విస్తృత బంధుత్వంగా తీసుకోవాల్సిన సందర్భసూచన ఇక్కడ లేదు.
- source_word: מִשְׁנֶה
  choice: రెండవ స్థానంలో
  rationale: מִשְׁנֶה ప్రధాన అధికారి తర్వాతి హోదా లేదా ఉపాధికారిని సూచిస్తుంది. ‘రెండవ స్థానంలో’ మూలంలోని సంక్షిప్తతను, హోదా క్రమాన్ని నిలుపుతుంది; ‘ఉపాధికారిగా’ అనే స్పష్టీకరణ పాదసూచికలో ఇచ్చాం.
