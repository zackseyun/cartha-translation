  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. పరిపాలనా సందర్భాన్ని స్పష్టం చేయడానికి ‘వాటి బాధ్యతలో,’ ‘ప్రధాన అధికారి’ అనే సహజ పదబంధాలు ఎంచుకున్నాం; హీబ్రూ వాక్యంలోని హోదా క్రమాన్ని మాత్రం మార్చలేదు.
