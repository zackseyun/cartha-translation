revisions:
- from: సమాజమంతటిలోని వారి చిన్నపిల్లలందరినీ, వారి భార్యలను, కుమారులను, కుమార్తెలను వంశావళి పట్టికల్లో నమోదు చేశారు[a]. ఎందుకంటే వారు తమ నమ్మకత్వంతో[b] తమను తాము పరిశుద్ధులుగా ప్రతిష్ఠించుకున్నారు[c].
  to: సమస్త సమాజమంతటిలో వారి చిన్నపిల్లలందరినీ, వారి భార్యలను, కుమారులను, కుమార్తెలను వంశావళి ప్రకారం నమోదు చేయుటకై[a]; ఎందుకంటే వారు తమ విశ్వసనీయతతో[b] పరిశుద్ధత కొరకు తమను తాము ప్రతిష్ఠించుకున్నారు[c].
  rationale: The revision corrects the syntactic handling of the genealogical-registration infinitive and restores the separate assembly-wide scope of לְכָל קָהָל. It otherwise retains the draft’s sound lexical and theological decisions, with a slightly more idiomatic Telugu expression for the administrative sense of אֱמוּנָה.
