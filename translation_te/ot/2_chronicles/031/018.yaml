  text: וּ/לְ/הִתְיַחֵ֗שׂ בְּ/כָל טַפָּ֧/ם נְשֵׁי/הֶ֛ם וּ/בְנֵי/הֶ֥ם וּ/בְנוֹתֵי/הֶ֖ם לְ/כָל קָהָ֑ל כִּ֥י בֶ/אֱמוּנָתָ֖/ם יִתְקַדְּשׁוּ קֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/018.yaml
  text: and for the enrollment of all their little ones[a], their wives, their sons, and their daughters, for all the assembly[c][b]; for in their faithfulness they consecrated themselves as holy.
translation:
  language: te
  text: సమస్త సమాజమంతటిలో వారి చిన్నపిల్లలందరినీ, వారి భార్యలను, కుమారులను, కుమార్తెలను వంశావళి ప్రకారం నమోదు చేయుటకై[a]; ఎందుకంటే వారు తమ విశ్వసనీయతతో[b] పరిశుద్ధత కొరకు తమను తాము ప్రతిష్ఠించుకున్నారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారి చిన్నపిల్లలందరి, వారి భార్యల, కుమారుల, కుమార్తెల వంశావళి నమోదు కొరకు.’ హీబ్రూ క్రియ కుటుంబ లేదా వంశావళి రికార్డుల్లో పేర్లు నమోదు చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘విశ్వసనీయత’ అంటే ప్రధానంగా అంతరంగ విశ్వాసం కాదు; పరిశుద్ధ విధులను నిర్వహించడంలో నమ్మదగినతనం లేదా నిబద్ధత అని భావం.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘వారు పరిశుద్ధతలో తమను తాము ప్రతిష్ఠించుకున్నారు,’ లేదా ‘తమను తాము పరిశుద్ధంగా ఉంచుకున్నారు.’ హీబ్రూలో క్రియ, నామవాచకం రెండూ పరిశుద్ధత భావాన్ని వ్యక్తం చేసి దానిని నొక్కిచెబుతున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהִתְיַחֵשׂ
  choice: వంశావళి పట్టికల్లో నమోదు చేశారు
  rationale: దినవృత్తాంతముల గ్రంథాల్లో יחס అనే క్రియ కుటుంబ లేదా వంశావళి రికార్డుల్లో పేర్లు నమోదు చేయడాన్ని సూచిస్తుంది. తెలుగు పాఠకులకు సహజంగా ఉండేలా ముందటి వాక్యం నుంచి కొనసాగే క్రియాభావాన్ని పూర్తి వాక్యంగా వ్యక్తం చేశాం.
- source_word: בְּכָל טַפָּם
  choice: వారి చిన్నపిల్లలందరినీ
  rationale: טַף సాధారణంగా చిన్నపిల్లలను సూచిస్తుంది; విస్తృతమైన ‘పిల్లలు’ లేదా ‘ఆధారితులు’ కంటే ఈ పదం మూలంలోని నిర్దిష్టతను కాపాడుతుంది.
- source_word: נְשֵׁיהֶם
  choice: వారి భార్యలను
  rationale: కుటుంబ సభ్యుల జాబితా సందర్భంలో ‘భార్యలు’ అనేది సహజమైన, సందర్భోచితమైన అర్థం.
- source_word: וּבְנֵיהֶם וּבְנוֹתֵיהֶם
  choice: కుమారులను, కుమార్తెలను
  rationale: హీబ్రూ మూలం మగ, ఆడ సంతానాన్ని విడివిడిగా పేర్కొంటుంది; అందువల్ల రెండింటినీ స్పష్టంగా నిలిపాం.
- source_word: לְכָל קָהָל
  choice: సమాజమంతటిలోని
  rationale: קָהָל ఇక్కడ యాజక-లేవీయ కుటుంబాలకు సంబంధించిన సమాజ సమూహాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో నమోదు పరిధిని సహజంగా తెలియజేయడానికి ‘సమాజమంతటిలోని’ అని అనుసంధానించాం.
- source_word: בֶאֱמוּנָתָם
  choice: తమ నమ్మకత్వంతో
  rationale: ఈ ఆరాధనా-పరిపాలనా సందర్భంలో אֱמוּנָה అంతరంగ విశ్వాసం కంటే విధుల నిర్వహణలో విశ్వసనీయత లేదా నిబద్ధతను ప్రధానంగా సూచిస్తుంది.
- source_word: יִתְקַדְּשׁוּ קֹדֶשׁ
  choice: తమను తాము పరిశుద్ధులుగా ప్రతిష్ఠించుకున్నారు
  rationale: קדש హిత్పయేల్ రూపం తమను తాము ప్రతిష్ఠించుకోవడం లేదా పరిశుద్ధపరచుకోవడం అనే భావాన్ని ఇస్తుంది; తరువాతి קֹדֶשׁ పరిశుద్ధత భావాన్ని బలపరుస్తుంది. ఈ అనువాదం క్రియతో పాటు పరిశుద్ధ స్థితినీ నిలుపుతుంది.
theological_decisions:
- issue: ఆరాధనా-పరిపాలనా సందర్భంలో אֱמוּנָה అర్థం
  choice: పరిశుద్ధ విధులను నిర్వహించడంలో నమ్మకత్వం లేదా నిబద్ధత
  alternative: ప్రధానంగా అంతరంగ విశ్వాసం
  rationale: సందర్భం యాజకులు, లేవీయుల నమోదు, పంపిణీ, పరిశుద్ధ స్థితి గురించి ఉంది. కాబట్టి తరువాతి కాలపు సిద్ధాంతార్థాన్ని రుద్దకుండా, విధుల విషయంలో విశ్వసనీయత అనే సందర్భోచిత అర్థాన్ని ఎంచుకున్నాం.
- issue: יִתְקַדְּשׁוּ קֹדֶשׁ లో పునరుక్త పరిశుద్ధత భావం
  choice: తమను తాము పరిశుద్ధులుగా ప్రతిష్ఠించుకున్నారు
  alternative: తమను తాము పరిశుద్ధపరచుకున్నారు; పరిశుద్ధతలో తమను ప్రతిష్ఠించుకున్నారు; పరిశుద్ధంగా ఉంచుకున్నారు
  rationale: హీబ్రూలో క్రియ, నామవాచకం రెండూ పరిశుద్ధత భావాన్ని వ్యక్తం చేస్తున్నాయి. తెలుగు ప్రధాన పాఠంలో సహజత్వాన్ని కాపాడుతూ ఆ ఉద్ఘాటనను ‘పరిశుద్ధులుగా ప్రతిష్ఠించుకున్నారు’ ద్వారా నిలిపాం; ఇతర సాధ్యమైన నిర్మాణాలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. ‘వంశావళి పట్టికలు,’ ‘నమ్మకత్వం,’ ‘పరిశుద్ధులుగా ప్రతిష్ఠించుకున్నారు’ అనే పదబంధాలు పరిపాలనా, ఆరాధనా నేపథ్యాలను రెండింటినీ నిలుపుతాయి. మూలంలోని అర్థసందిగ్ధతలను ప్రధాన పాఠంలో ఏకపక్షంగా పరిష్కరించకుండా పాదసూచికల్లో ప్రత్యామ్నాయాలుగా ఉంచాం.
