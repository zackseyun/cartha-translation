source:
  edition: WLC
  text: וְ/קוֹרֵ֨א בֶן יִמְנָ֤ה הַ/לֵּוִי֙ הַ/שּׁוֹעֵ֣ר לַ/מִּזְרָ֔חָ/ה עַ֖ל נִדְב֣וֹת הָ/אֱלֹהִ֑ים לָ/תֵת֙ תְּרוּמַ֣ת יְהוָ֔ה וְ/קָדְשֵׁ֖י הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/014.yaml
  text: Kore son of Imnah[a], the Levite, the gatekeeper on the east, was in charge of the freewill offerings of God[b], to distribute the contribution of Yahweh and the most holy things.
translation:
  language: te
  text: ఇమ్నా కుమారుడైన లేవీయుడు కోరే, తూర్పు వైపు ద్వారపాలకుడు, దేవునికి సమర్పించిన స్వచ్ఛంద అర్పణల బాధ్యత వహించాడు; యాహ్వేకు అర్పించిన కానుకను, అత్యంత పరిశుద్ధమైన వాటిని[b] పంచిపెట్టడానికి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇవ్వడానికి.’ హెబ్రీయ క్రియారూపం పదశః ‘ఇవ్వడానికి’ అని అర్థం; ఇక్కడ సమర్పించబడిన వాటిని పంచిపెట్టడం అనే భావంలో ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అత్యంత పరిశుద్ధమైన అర్పణలను.’ ఈ హెబ్రీయ పదబంధం ప్రత్యేక పరిశుద్ధతగల వాటిని సూచిస్తుంది; తప్పనిసరిగా ఆలయంలోని ‘అతి పరిశుద్ధ స్థలాన్ని’ సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקוֹרֵא בֶן יִמְנָה
  choice: ఇమ్నా కుమారుడైన కోరే
  rationale: వ్యక్తిపేర్లను ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించి, పుత్ర సంబంధాన్ని సహజంగా వ్యక్తం చేసింది. ఆరంభ సంధికారకాన్ని తెలుగు వాక్యప్రవాహంలో విడిగా అనువదించాల్సిన అవసరం లేదు.
- source_word: הַלֵּוִי הַשּׁוֹעֵר לַמִּזְרָחָה
  choice: లేవీయుడు తూర్పు వైపు ద్వారపాలకుడిగా ఉండి
  rationale: వ్యక్తి లేవీయుడని, తూర్పు వైపు ద్వారపాలకుడని స్పష్టంగా చెబుతుంది; మూలంలో లేని ‘తూర్పు ద్వారం’ అనే పదాన్ని చేర్చలేదు.
- source_word: עַל נִדְבוֹת הָאֱלֹהִים
  choice: దేవుని స్వచ్ఛంద అర్పణల బాధ్యత వహించాడు
  rationale: עַל పరిపాలనా బాధ్యతను సూచిస్తుంది; נִדְבוֹת బలవంతం లేకుండా స్వచ్ఛందంగా సమర్పించిన అర్పణలను సూచిస్తుంది.
- source_word: לָתֵת
  choice: పంచిపెట్టడానికి
  rationale: పదశః ‘ఇవ్వడానికి’; ఈ పరిపాలనా సందర్భంలో అర్పణలను అర్హులకు పంపిణీ చేయడం ఉద్దేశం. పాదసూచికలో పదశః ప్రత్యామ్నాయం నిలిపింది.
- source_word: תְּרוּמַת יְהוָה
  choice: యాహ్వే అర్పణను
  rationale: ప్రత్యేకంగా సమర్పించిన భాగం లేదా అర్పణ అనే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది; construct సంబంధాన్ని ‘యాహ్వే అర్పణ’గా ఉద్దేశపూర్వకంగా విప్పకుండా ఉంచింది.
- source_word: וְקָדְשֵׁי הַקֳּדָשִׁים
  choice: అత్యంత పరిశుద్ధమైన వాటిని
  rationale: హెబ్రీయ సూపర్లేటివ్ భావాన్ని వ్యక్తం చేస్తూ, ఇది ఆలయంలోని ‘అతి పరిశుద్ధ స్థలం’ అని తప్పుగా అర్థం కాకుండా వస్తువులు లేదా అర్పణలను సూచిస్తుంది.
theological_decisions:
- issue: యְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’ ఉచ్చారణకు సరిపోయే ఆధునిక తెలుగు లిప్యంతరీకరణను ఉపయోగించింది.
- issue: కָדְשֵׁי הַקֳּדָשִׁים సూచించేది
  choice: అత్యంత పరిశుద్ధమైన వాటిని
  alternative: అత్యంత పరిశుద్ధమైన అర్పణలను
  rationale: సందర్భం అర్పణలను సూచించినా, మూలంలోని విస్తృత ‘వాటిని/వస్తువులను’ అనే భావాన్ని నిలిపి, పాదసూచికలో మరింత నిర్దిష్ట ప్రత్యామ్నాయాన్ని ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ఆలయ పరిపాలనా సందర్భాన్ని స్పష్టంచేస్తూనే, మూలపాఠంలోని construct సంబంధం మరియు ‘అత్యంత పరిశుద్ధమైనవి’ అనే విస్తృత సూచనను అతిగా పరిష్కరించలేదు.
