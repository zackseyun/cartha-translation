  source_fidelity: మూలంలోని వ్యక్తిపేరు, వంశసంబంధం, లేవీయుని హోదా, తూర్పు వైపు ద్వారపాలకుని పాత్ర, అర్పణల నిర్వహణ, మరియు పంపిణీ ఉద్దేశం అన్నీ నిలవాలి. ముసాయిదాలోని రెండవ వాక్యం మొదటి వాక్యంలోని ‘బాధ్యత వహించాడు’ అనే భావాన్ని అనవసరంగా పునరావృతం చేస్తోంది. תְּרוּמַת יְהוָה సందర్భంలో యాహ్వేకు అర్పించిన/కేటాయించిన కానుక అనే భావం సహజంగా, మూలానికి అనుగుణంగా వ్యక్తమవుతుంది.
