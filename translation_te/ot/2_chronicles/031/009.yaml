  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּדְרֹשׁ
  choice: అడిగాడు
  rationale: דרשׁ ఇక్కడ సమాచారాన్ని విచారించి తెలుసుకోవడం అనే అర్థంలో ఉంది; సందర్భానికి సహజమైన ఆధునిక తెలుగు రూపం ‘అడిగాడు’.
- source_word: עַל הָעֲרֵמוֹת
  choice: ఆ కుప్పల గురించి
  rationale: עַל ఇక్కడ విషయసూచకంగా ‘గురించి’; నిర్దిష్ట ఉపపదంతో ఉన్న עֲרֵמוֹתను మునుపు పేర్కొన్న ధాన్యాదుల కుప్పలను సూచించేలా ‘ఆ కుప్పలు’గా ఇచ్చాం.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: యాజకులను, లేవీయులను
  rationale: రెండు నిర్దిష్ట సమూహాలను తెలుగులో సహజమైన కర్మవిభక్తితో వ్యక్తం చేస్తుంది.
