revisions:
- from: 'సాదోకు వంశానికి చెందిన ప్రధాన యాజకుడు అజర్యా అతనితో ఇలా అన్నాడు: “ప్రజలు యాహ్వే మందిరంలోకి ప్రతిష్ఠిత కానుకను[a] తీసుకురావడం మొదలుపెట్టినప్పటి నుండి మేము తిని తృప్తిపడ్డాము; ఇంకా ఎంతో మిగిలింది. ఎందుకంటే యాహ్వే తన ప్రజలను ఆశీర్వదించాడు. మిగిలినదే ఈ గొప్ప రాశి.”'
  to: 'సాదోకు వంశానికి చెందిన ముఖ్య యాజకుడు అజర్యా అతనితో ఇలా అన్నాడు: “ప్రజలు యాహ్వే మందిరంలోకి ప్రత్యేక కానుకను[a] తీసుకురావడం మొదలుపెట్టినప్పటి నుండి మేము తిని తృప్తిపడ్డాము; ఇంకా ఎంతో మిగిలింది. ఎందుకంటే యాహ్వే తన ప్రజలను ఆశీర్వదించాడు. మిగిలినది ఈ గొప్ప సమృద్ధి.”'
  rationale: నాయకత్వ యాజక భావాన్ని తరువాతి సాంకేతిక బిరుదుతో కలపకుండా ‘ముఖ్య యాజకుడు’గా సవరించాం. תרומה యొక్క పవిత్రంగా వేరుచేసిన కానుక భావాన్ని ప్రధాన పాఠంలో ‘ప్రత్యేక కానుక’గా స్పష్టపరిచి, ప్రత్యామ్నాయాన్ని అడిక్కురిలో నిలిపాం. చివరి హెబ్రీ నామవాక్యాన్ని దాని సందర్భానుగుణమైన సమృద్ధి భావాన్ని కోల్పోకుండా సహజమైన తెలుగులో సవరించాం.
