source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו עֲזַרְיָ֧הוּ הַ/כֹּהֵ֛ן הָ/רֹ֖אשׁ לְ/בֵ֣ית צָד֑וֹק וַ֠/יֹּאמֶר מֵ/הָחֵ֨ל הַ/תְּרוּמָ֜ה לָ/בִ֣יא בֵית יְהוָ֗ה אָכ֨וֹל וְ/שָׂב֤וֹעַ וְ/הוֹתֵר֙ עַד לָ/ר֔וֹב כִּ֤י יְהוָה֙ בֵּרַ֣ךְ אֶת עַמּ֔/וֹ וְ/הַ/נּוֹתָ֖ר אֶת הֶ/הָמ֥וֹן הַ/זֶּֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/010.yaml
  text: Azariah the chief priest[a], of the house of Zadok, said to him, “Since they began bringing the contribution into the house of Yahweh, we have eaten and been satisfied and have had plenty left over, for Yahweh has blessed his people; and what is left is this great abundance.”
translation:
  language: te
  text: 'సాదోకు వంశానికి చెందిన ముఖ్య యాజకుడు అజర్యా అతనితో ఇలా అన్నాడు: “ప్రజలు యాహ్వే మందిరంలోకి ప్రత్యేక కానుకను[a] తీసుకురావడం మొదలుపెట్టినప్పటి నుండి మేము తిని తృప్తిపడ్డాము; ఇంకా ఎంతో మిగిలింది. ఎందుకంటే యాహ్వే తన ప్రజలను ఆశీర్వదించాడు. మిగిలినది ఈ గొప్ప సమృద్ధి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రతిష్ఠిత అర్పణను”; ఇక్కడి హెబ్రీ పదం పవిత్ర వినియోగం కోసం ప్రత్యేకంగా ఉంచిన సమర్పణను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הָרֹאשׁ
  choice: ప్రధాన యాజకుడు
  rationale: అజర్యా నాయకత్వ యాజక పాత్రను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; హెబ్రీలో స్పష్టంగా లేని తరువాతి సాంకేతిక బిరుదును చేర్చదు.
- source_word: לְבֵית צָדוֹק
  choice: సాదోకు వంశానికి చెందిన
  rationale: ‘ఇల్లు’ అనే హెబ్రీ ప్రయోగంలోని కుటుంబ లేదా వంశ అనుబంధాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֵהָחֵל
  choice: మొదలుపెట్టినప్పటి నుండి
  rationale: ఈ నిర్మాణం చర్య ప్రారంభమైన కాలబిందువు నుండి కొనసాగుతున్న ఫలితాన్ని సూచిస్తుంది.
- source_word: הַתְּרוּמָה
  choice: ప్రతిష్ఠిత కానుక
  rationale: పవిత్ర వినియోగం కోసం ప్రత్యేకంగా సమర్పించిన దానిని సూచిస్తుంది; సాధారణ కానుకకన్నా మూలపద భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: לָבִיא בֵית יְהוָה
  choice: యాహ్వే మందిరంలోకి ... తీసుకురావడం
  rationale: בוא యొక్క దిశాసూచక భావాన్ని ‘మందిరంలోకి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אָכוֹל וְשָׂבוֹעַ
  choice: మేము తిని తృప్తిపడ్డాము
  rationale: తినడం మరియు సమృద్ధిగా తృప్తి చెందడం అనే జంట భావాలను, మాట్లాడుతున్న సమూహ దృష్టితో సహజంగా అందిస్తుంది.
- source_word: וְהוֹתֵר עַד לָרֹב
  choice: ఇంకా ఎంతో మిగిలింది
  rationale: అవసరానికి మించి విస్తారంగా మిగిలినదనే భావాన్ని సరళంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: בֵּרַךְ אֶת עַמּוֹ
  choice: తన ప్రజలను ఆశీర్వదించాడు
  rationale: సమృద్ధికి కారణంగా దేవుని పూర్తయిన ఆశీర్వాద కార్యాన్ని సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: וְהַנּוֹתָר אֶת הֶהָמוֹן הַזֶּה
  choice: మిగిలినదే ఈ గొప్ప రాశి
  rationale: הנותר ను ‘మిగిలినది’గా, המון ను సందర్భంలోని ధాన్యాదుల పెద్ద నిల్వ లేదా రాశిగా అనువదిస్తుంది; జనసమూహం అనే అసందర్భ అర్థాన్ని నివారిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవ నామాన్ని నేరుగా వాడుతుంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. దీర్ఘమైన హెబ్రీ వాక్యాన్ని భావసంబంధం చెడకుండా చిన్న వాక్యాలుగా విభజించాం. అడిక్కురి సూచికను దానికి సంబంధించిన ‘ప్రతిష్ఠిత కానుక’ వద్దే ఉంచాం.
