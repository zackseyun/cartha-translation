source:
  edition: WLC
  text: וַ/יַּעֲמֵ֣ד יְחִזְקִיָּ֡הוּ אֶת מַחְלְק֣וֹת הַ/כֹּהֲנִ֣ים וְ֠/הַ/לְוִיִּם עַֽל מַחְלְקוֹתָ֞/ם אִ֣ישׁ כְּ/פִ֣י עֲבֹדָת֗/וֹ לַ/כֹּהֲנִים֙ וְ/לַ/לְוִיִּ֔ם לְ/עֹלָ֖ה וְ/לִ/שְׁלָמִ֑ים לְ/שָׁרֵת֙ וּ/לְ/הֹד֣וֹת וּ/לְ/הַלֵּ֔ל בְּ/שַׁעֲרֵ֖י מַחֲנ֥וֹת יְהוָֽה־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/002.yaml
  text: And Hezekiah appointed the divisions of the priests and the Levites according to their divisions[a], each man according to his service, both the priests and the Levites, for burnt offerings and peace offerings[c][b], to minister and to give thanks and to praise at the gates of the camps of Yahweh.
translation:
  language: te
  text: 'హిజ్కియా యాజకుల, లేవీయుల విభాగాలను[a] వారి వారి విభాగాల ప్రకారం నియమించాడు; ప్రతి వ్యక్తిని అతని సేవకు తగినట్లుగా—యాజకులనూ లేవీయులనూ దహనబలులు, సమాధాన బలులు[b] అర్పించడానికి, సేవ చేయడానికి, కృతజ్ఞతలు చెల్లించడానికి, యహ్వే శిబిరాల[c] ద్వారాల వద్ద స్తుతించడానికి నియమించాడు.


    [a] లేదా “వంతులను”; యాజకులు, లేవీయులు క్రమపద్ధతిలో సేవ చేయడానికి ఏర్పడిన బృందాలు.


    [b] లేదా “సహవాస బలులు.”


    [c] హెబ్రీలో అక్షరార్థంగా “యహ్వే శిబిరాలు.” కొందరు దీన్ని భావానువాదంగా “యహ్వే ఆలయ ప్రాంగణాలు” అని అర్థం చేసుకుంటారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వంతులను”; యాజకులు, లేవీయులు క్రమపద్ధతిలో సేవ చేయడానికి ఏర్పడిన బృందాలు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “సహవాస బలులు.”
    reason: lexical_alternative
  - marker: c
    text: హెబ్రీలో అక్షరార్థంగా “యహ్వే శిబిరాలు.” కొందరు దీన్ని భావానువాదంగా “యహ్వే ఆలయ ప్రాంగణాలు” అని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: ఏర్పాటు చేశాడు… నియమించాడు
  rationale: ఈ పరిపాలనా, ఆలయసేవా సందర్భంలో వ్యక్తులను కేవలం నిలబెట్టడం కాకుండా క్రమబద్ధమైన సేవా బాధ్యతల్లో ఉంచడం భావం. తెలుగు వాక్య నిర్మాణంలో విభాగాలకు ‘ఏర్పాటు చేశాడు,’ వ్యక్తులకు ‘నియమించాడు’ సహజంగా ఉంటుంది.
- source_word: מַחְלְקוֹת
  choice: విభాగాలు
  rationale: యాజకులు, లేవీయులు క్రమంగా సేవ చేసే వ్యవస్థీకృత బృందాలను సూచిస్తుంది. ‘వంతులు’ సాధ్యమైన ప్రత్యామ్నాయం కనుక పాదసూచికలో ఇచ్చాం.
- source_word: אִישׁ כְּפִי עֲבֹדָתוֹ
  choice: ప్రతి ఒక్కరిని అతని సేవకు తగినట్లుగా
  rationale: హెబ్రీలోని పంపిణీయ ఏకవచన భావాన్నీ, పురుషలింగ సూచననూ నిలుపుతూ ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לְעֹלָה
  choice: దహనబలులు
  rationale: పూర్తిగా దహనం చేసే బలి వర్గాన్ని సూచించే స్థిరమైన, స్పష్టమైన తెలుగు పదం; ఇక్కడ పునరావృత సేవల సారాంశం కావడంతో బహువచనం సహజం.
- source_word: וְלִשְׁלָמִים
  choice: సమాధాన బలులు
  rationale: హెబ్రీ బలి వర్గాన్ని నేరుగా ప్రతిబింబించే సాంప్రదాయ పదం. ‘సహవాస బలులు’ మరింత వ్యాఖ్యానాత్మకం కావడంతో ప్రత్యామ్నాయంగా పాదసూచికలో ఉంచాం.
- source_word: לְשָׁרֵת
  choice: సేవ చేయడానికి
  rationale: ఆలయ సంబంధమైన పవిత్ర సేవను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וּלְהוֹדוֹת וּלְהַלֵּל
  choice: కృతజ్ఞతలు చెల్లించి స్తుతించడానికి
  rationale: స్తుతి సందర్భంలో ידה కృతజ్ఞత తెలపడం అనే భావం ఇస్తుంది; దానికి సమీపంలోని הלל స్తుతించడాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: בְּשַׁעֲרֵי מַחֲנוֹת יְהוָה
  choice: యహ్వే శిబిరాల ద్వారాల దగ్గర
  rationale: מַחֲנוֹת స్పష్టంగా బహువచనం. ఆలయ ప్రాంగణాలుగా సాధారణీకరించకుండా మూలంలోని అసాధారణ ‘శిబిరాలు’ అనే రూపకాన్ని నిలిపి, בְ స్థలార్థాన్ని తెలుగులో సహజమైన ‘దగ్గర’తో తెలిపాం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హెబ్రీ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణను ఉపయోగించాం.
theological_decisions:
- issue: אִישׁ అనే పురుషలింగ పంపిణీయ ఏకవచనం
  choice: ప్రతి ఒక్కరిని అతని సేవకు తగినట్లుగా
  alternative: ప్రతి ఒక్కరిని వారి సేవకు తగినట్లుగా
  rationale: ఈ సందర్భంలోని యాజక, లేవీయ సేవకులు చారిత్రకంగా పురుషులే; అందువల్ల మూలంలోని పురుషలింగాన్ని అస్పష్టంచేయలేదు.
- issue: שְׁלָמִים అనే బలి వర్గం
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు
  rationale: మరింత వ్యాఖ్యానాత్మకమైన ‘సహవాస’ భావాన్ని ప్రధాన పాఠ్యంలోకి దిగుమతి చేయకుండా, హెబ్రీ వర్గనామానికి దగ్గరైన రూపాన్ని ఎంచుకున్నాం.
- issue: מַחֲנוֹת יְהוָה అనే అసాధారణ ఆలయసందర్భ పదబంధం
  choice: యహ్వే శిబిరాలు
  alternative: యహ్వే ఆలయ ప్రాంగణాలు
  rationale: ‘శిబిరాలు’ అనే బహువచన మూలరూపాన్నీ దాని అసాధారణ చిత్రాన్నీ నిలిపాం; ‘ఆలయ ప్రాంగణాలు’ అనే సందర్భోచిత వ్యాఖ్యానాన్ని పాదసూచికకే పరిమితం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హెబ్రీ వాక్యంలోని పునరుక్తిని తెలుగులో భారంగా కాకుండా ఉండేందుకు విభాగాల ఏర్పాటు, వ్యక్తుల నియామకం అనే రెండు సమన్విత భాగాలుగా తీర్చిదిద్దాం; మూలంలోని సేవా క్రమం, బలి వర్గాలు, కృతజ్ఞత-స్తుతి కార్యాలు అన్నీ నిలిపాం.
