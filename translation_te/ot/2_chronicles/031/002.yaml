    rationale: וַיַּעֲמֵד ఒకే పరిపాలనా నియామక/స్థాపన క్రియ. రెండు తెలుగు క్రియలు వాడటం కొత్త రెండు చర్యలు ఉన్నట్టుగా చూపుతుంది.
  - severity: low
