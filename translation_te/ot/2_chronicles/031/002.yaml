    rationale: וּלְהוֹדוֹת וּלְהַלֵּל రెండు సమాంతర infinitives. తెలుగులో రెండింటినీ “-డానికి”తో సమన్వయంగా ఇవ్వడం మూల నిర్మాణాన్ని మెరుగుగా ప్రతిబింబిస్తుంది.
  revised_text: 'హిజ్కియా యాజకుల, లేవీయుల విభాగాలను[a] వారి వారి విభాగాల ప్రకారం నియమించాడు; ప్రతి వ్యక్తిని అతని సేవకు తగినట్లుగా—యాజకులనూ లేవీయులనూ దహనబలులు, సమాధాన బలులు[b] అర్పించడానికి, సేవ చేయడానికి, కృతజ్ఞతలు చెల్లించడానికి, యహ్వే శిబిరాల[c] ద్వారాల వద్ద స్తుతించడానికి నియమించాడు.


    [a] లేదా “వంతులను”; యాజకులు, లేవీయులు క్రమపద్ధతిలో సేవ చేయడానికి ఏర్పడిన బృందాలు.


    [b] లేదా “సహవాస బలులు.”


    [c] హెబ్రీలో అక్షరార్థంగా “యహ్వే శిబిరాలు.” కొందరు దీన్ని భావానువాదంగా “యహ్వే ఆలయ ప్రాంగణాలు” అని అర్థం చేసుకుంటారు.'
