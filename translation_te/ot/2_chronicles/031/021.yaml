revisions:
- from: అతడు దేవుని మందిర సేవలో, ధర్మశాస్త్రంలో, ఆజ్ఞలో ఏ పని మొదలుపెట్టినా, తన దేవుణ్ణి పూర్ణహృదయంతో వెదకడానికి[a][b] దాన్ని చేశాడు; సఫలమయ్యాడు.[c]
  to: అతడు దేవుని మందిర సేవలోను, ధర్మశాస్త్రంలోను[a], ఆజ్ఞలోను తన దేవుణ్ణి వెదకడానికి[b] ప్రారంభించిన ప్రతి పనిని తన హృదయమంతటితో చేశాడు; సఫలమయ్యాడు.[c]
  rationale: 'The revision more closely follows the Hebrew structure: every work he began in temple service, law, and commandment was undertaken to seek his God; he did it wholeheartedly and prospered. It restores the torah lexical-alternative note, places each note at its relevant expression, and removes a syntactical footnote made unnecessary by the clearer Telugu word order.'
