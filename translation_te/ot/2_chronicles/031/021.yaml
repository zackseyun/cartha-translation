  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְ/כָֽל מַעֲשֶׂ֞ה אֲשֶׁר הֵחֵ֣ל בַּ/עֲבוֹדַ֣ת בֵּית הָ/אֱלֹהִ֗ים וּ/בַ/תּוֹרָה֙ וּ/בַ/מִּצְוָ֔ה לִ/דְרֹ֖שׁ לֵֽ/אלֹהָ֑י/ו בְּ/כָל לְבָב֥/וֹ עָשָׂ֖ה וְ/הִצְלִֽיחַ־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/021.yaml
  text: And in every work that he began in the service of the house of God[a], and in the law and the commandment, seeking his God with all his heart[c][b], he did and prospered.
translation:
  language: te
  text: అతడు దేవుని మందిర సేవలోను, ధర్మశాస్త్రంలోను[a], ఆజ్ఞలోను తన దేవుణ్ణి వెదకడానికి[b] ప్రారంభించిన ప్రతి పనిని తన హృదయమంతటితో చేశాడు; సఫలమయ్యాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బోధ’ లేదా ‘ఉపదేశం.’ హెబ్రీ పదం తోరా.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తన దేవుని దగ్గర విచారించడానికి.’ హెబ్రీ క్రియకు వెదకడం, విచారించడం అనే రెండు భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘వర్ధిల్లాడు’ లేదా ‘విజయవంతమయ్యాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל מַעֲשֶׂה אֲשֶׁר הֵחֵל
  choice: ఏ పని మొదలుపెట్టినా
  rationale: מַעֲשֶׂה అంటే పని, కార్యం లేదా క్రియ. ఈ సందర్భంలో సహజమైన ఆధునిక తెలుగు కోసం హెబ్రీ సంబంధవాక్యాన్ని షరతార్థక నిర్మాణంగా మార్చినా, ‘ప్రతి పని’ అనే సమగ్ర భావం నిలిచింది.
- source_word: בַּעֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: దేవుని మందిర సేవలో
  rationale: עֲבוֹדָה శ్రమను లేదా సేవను, ముఖ్యంగా ఆరాధనా సంబంధ సేవను సూచించగలదు. ‘మందిర సేవ’ అనే పదబంధం దీనిని యాజక కర్మకాండకే పరిమితం చేయకుండా సందర్భానికి తగిన అర్థాన్ని ఇస్తుంది.
- source_word: וּבַתּוֹרָה
  choice: ధర్మశాస్త్రంలో
  rationale: תּוֹרָה బోధ లేదా ధర్మశాస్త్రం అని అర్థమవుతుంది. హిజ్కియా సంస్కరణల సందర్భంలో మోషే ధర్మశాస్త్రానికి సూచన ప్రధానంగా ఉండటంతో ‘ధర్మశాస్త్రం’ ఎంచుకోబడింది.
- source_word: וּבַמִּצְוָה
  choice: ఆజ్ఞలో
  rationale: మూలంలోని מִצְוָה ఏకవచన రూపాన్ని నిలుపుతూ ‘ఆజ్ఞ’గా అనువదించబడింది; ఇది సమష్టి భావంలోనూ ఉండవచ్చు.
- source_word: לִדְרֹשׁ לֵאלֹהָיו
  choice: తన దేవుణ్ణి వెదకడానికి
  rationale: דרשׁ దేవునితో వాడినప్పుడు వెదకడం, ఆశ్రయించడం లేదా విచారించడం అనే భావాలు కలిగి ఉంటుంది. దినవృత్తాంతాలలోని హృదయపూర్వక దేవాన్వేషణ అనే ప్రధాన భావాన్ని ‘వెదకడం’ సహజంగా తెలియజేస్తుంది.
- source_word: בְּכָל לְבָבוֹ
  choice: పూర్ణహృదయంతో
  rationale: ఈ హెబ్రీ నుడికారం సంపూర్ణమైన, విభజనలేని నిబద్ధతను తెలియజేస్తుంది. ‘పూర్ణహృదయంతో’ గౌరవప్రదమైన, సహజమైన తెలుగు రూపం.
- source_word: עָשָׂה
  choice: దాన్ని చేశాడు
  rationale: עָשָׂה సాధారణంగా ‘చేశాడు’ అని అర్థం. తెలుగులో కర్మ లేకుండా వాక్యం అసహజంగా ఉండే అవకాశమున్నందున, ముందున్న ‘పని’ని సూచించే ‘దాన్ని’ చేర్చబడింది.
- source_word: וְהִצְלִיחַ
  choice: సఫలమయ్యాడు
  rationale: Hiphil రూపమైన הצליח ఈ సందర్భంలో విజయం పొందడం లేదా వర్ధిల్లడం అనే అకర్మక భావం ఇస్తుంది. ‘సఫలమయ్యాడు’ కార్యఫలాన్ని స్పష్టంగా, అతిశయార్థం లేకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: תּוֹרָה అనే పదానికి సంస్కరణల సందర్భంలో ఉన్న అర్థం
  choice: ధర్మశాస్త్రం
  alternative: బోధ
  rationale: ఈ వాక్య పరిసరాల్లో నిబంధనానుసార విధేయత, మందిర క్రమం ప్రధానమైనందున ‘ధర్మశాస్త్రం’ సరిపోతుంది. అయినప్పటికీ మూలపదానికి ‘బోధ’ అనే విస్తృత భావం కూడా ఉంది; ప్రధాన పాఠం దానిని పూర్తిగా నిరాకరించదు.
- issue: לִדְרֹשׁ לֵאלֹהָיו యొక్క భావం
  choice: తన దేవుణ్ణి వెదకడానికి
  alternative: తన దేవుని దగ్గర విచారించడానికి
  rationale: దినవృత్తాంతాలలో ఇది కేవలం సమాచారం అడగడంకంటే దేవుని వైపు హృదయపూర్వకంగా తిరగడం అనే భావాన్ని తరచుగా మోస్తుంది. అయితే ‘విచారించడం/సంప్రదించడం’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో నిలిపాం.
- issue: בְּכָל לְבָבוֹ ఏ క్రియతో అనుసంధానమవుతుంది
  choice: దేవుణ్ణి వెదకడంతో అనుసంధానించబడింది
  alternative: అతడు పని చేయడంతో అనుసంధానించవచ్చు
  rationale: హెబ్రీ పదక్రమంలో ఈ పదబంధం ‘తన దేవుణ్ణి వెదకడానికి’ అన్నదానికి వెంటనే వస్తుంది; అందువల్ల ప్రధాన పాఠంలో దానితో అనుసంధానించడం సహజం. వాక్య నిర్మాణం వల్ల అతని కార్యమంతా పూర్ణహృదయంతో జరిగిందనే విస్తృత భావం కూడా పూర్తిగా తొలగిపోదు.
- issue: וְהִצְלִיחַ ఫలితార్థం
  choice: సఫలమయ్యాడు
  alternative: వర్ధిల్లాడు
  rationale: ‘సఫలమయ్యాడు’ అతని ప్రయత్నాలు విజయవంతమయ్యాయని చెబుతుంది; ‘వర్ధిల్లాడు’ అనే అనువాదం భౌతిక సంపద భావాన్ని అవసరానికి మించి ముందుకు తేవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘దేవుని మందిరం,’ ‘ధర్మశాస్త్రం,’ ‘పూర్ణహృదయం’ వంటి సాధారణ బైబిలు పదజాలాన్ని నిలిపి, మూలంలోని పదార్థ మరియు వాక్యనిర్మాణ సందిగ్ధతలను పాదటిప్పణుల్లో సూచించాం.
