  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ‘సేవకులు’ అనే పదాన్ని రెండుచోట్లా ఉంచి మూలంలోని עֲבָדִים పదాన్ని ప్రతిబింబించింది; ‘సముద్రయానంలో అనుభవమున్న’ అనేది ‘సముద్రాన్ని తెలిసిన’ అనే హీబ్రూ ప్రయోగానికి సహజ తెలుగు రూపం.
