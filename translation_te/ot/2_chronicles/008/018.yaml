  text: וַ/יִּֽשְׁלַֽח ל/וֹ֩ חוּרָ֨ם בְּ/יַד עֲבָדָ֜י/ו אוניות וַ/עֲבָדִים֮ י֣וֹדְעֵי יָם֒ וַ/יָּבֹ֜אוּ עִם עַבְדֵ֤י שְׁלֹמֹה֙ אוֹפִ֔ירָ/ה וַ/יִּקְח֣וּ מִ/שָּׁ֔ם אַרְבַּע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים כִּכַּ֣ר זָהָ֑ב וַ/יָּבִ֖יאוּ אֶל הַ/מֶּ֥לֶךְ שְׁלֹמֹֽה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/018.yaml
  text: And Huram sent him[a], by the hand of his servants, ships and servants who knew the sea. They went with Solomon’s servants to Ophir, took from there four hundred and fifty talents of gold[c][b], and brought them to King Solomon.
translation:
  language: te
  text: హూరాము తన సేవకుల ద్వారా అతనికి ఓడలను, సముద్రయానంలో అనుభవమున్న సేవకులను పంపించాడు.[a] వారు సొలొమోను సేవకులతో కలిసి ఓఫీరుకు వెళ్లి, అక్కడి నుండి నాలుగువందల యాభై తలాంతుల బంగారాన్ని తీసుకొని రాజైన సొలొమోను దగ్గరికి తెచ్చారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “తన సేవకుల చేతి ద్వారా.” అంటే, హూరాము తన సేవకుల ద్వారా వాటిని పంపించాడు.
    reason: cultural_note
  - marker: b
    text: “తలాంతు” ప్రాచీన బరువు కొలమానం. దాని ఖచ్చితమైన బరువు కాలం, ప్రాంతాన్ని బట్టి మారేది.
    reason: historical_measure
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపించాడు
  rationale: హీబ్రూ కథనంలోని causative కాని సాధారణ ‘పంపు’ భావాన్ని సహజమైన తెలుగు భూతకాల క్రియతో తెలిపింది.
- source_word: חוּרָם
  choice: హూరాము
  rationale: ఇక్కడి హీబ్రూ రూపం חוּרָם ను అనుసరించిన లిప్యంతరీకరణ.
- source_word: בְּיַד עֲבָדָיו
  choice: తన సేవకుల ద్వారా
  rationale: అక్షరార్థంగా ‘తన సేవకుల చేతి ద్వారా’; తెలుగులో కర్తృత్వ మధ్యవర్తిత్వాన్ని సహజంగా తెలిపే విధంగా అనువదించబడింది.
- source_word: אוניות
  choice: ఓడలను
  rationale: ఓఫీరుకు చేసిన సముద్రయాన సందర్భానికి ‘ఓడలు’ సరిపోతుంది.
- source_word: וַעֲבָדִים יֹדְעֵי יָם
  choice: సముద్రయానంలో అనుభవమున్న సేవకులను
  rationale: అక్షరార్థమైన ‘సముద్రాన్ని తెలిసిన సేవకులు’ అనే మాటలో సేవకుల హోదాను, వారి నౌకాయాన నైపుణ్యాన్ని రెండింటినీ నిలిపింది.
- source_word: אוֹפִירָה
  choice: ఓఫీరుకు
  rationale: దిశను సూచించే -ה ప్రత్యయాన్ని తెలుగు గమ్య విభక్తితో తెలిపింది.
- source_word: וַיִּקְחוּ מִשָּׁם
  choice: అక్కడి నుండి ... తీసుకొని
  rationale: לקח అనే సాధారణ ‘తీసుకొను’ భావాన్ని ఉంచి, బంగారం ఎలా సంపాదించారో అదనంగా నిర్ధారించలేదు.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים כִּכַּר זָהָב
  choice: నాలుగువందల యాభై తలాంతుల బంగారాన్ని
  rationale: చారిత్రక కొలమానాన్ని ఆధునిక బరువుగా ఊహాత్మకంగా మార్చకుండా ‘తలాంతు’గా ఉంచింది.
- source_word: וַיָּבִיאוּ אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: రాజైన సొలొమోను దగ్గరికి తెచ్చారు
  rationale: గమ్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపి, తెచ్చిన వస్తువుగా ముందున్న బంగారాన్ని సందర్భానుసారంగా కొనసాగించింది.
