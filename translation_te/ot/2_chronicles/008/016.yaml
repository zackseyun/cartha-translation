id: 2CH.8.16
reference: 2 Chronicles 8:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּכֹּן֙ כָּל מְלֶ֣אכֶת שְׁלֹמֹ֔ה עַד הַ/יּ֛וֹם מוּסַ֥ד בֵּית יְהוָ֖ה וְ/עַד כְּלֹת֑/וֹ שָׁלֵ֖ם בֵּ֥ית יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/016.yaml
  text: Thus all the work of Solomon was prepared from the day the house of Yahweh was founded until it was finished[b][a]. So the house of Yahweh was completed.
translation:
  language: te
  text: ఈ విధంగా, యాహ్వే మందిరానికి పునాది వేయబడిన రోజు నుండి అది పూర్తయ్యే వరకు సొలొమోను చేసిన పనంతా స్థిరపరచబడింది[a][b]. అలా యాహ్వే మందిరం పూర్తయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సొలొమోను చేసిన పనంతా సిద్ధపరచబడింది,” లేదా “సక్రమంగా అమర్చబడింది.” హీబ్రూ క్రియకు స్థిరపరచడం, సిద్ధం చేయడం, లేదా సక్రమంగా అమర్చడం అనే భావాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, “యాహ్వే మందిరానికి పునాది వేయబడిన రోజు వరకు, దాని పూర్తికావడం వరకు.” సందర్భంలో ఈ కాలనిర్మాణం “పునాది వేయబడిన రోజు నుండి అది పూర్తయ్యే వరకు” అనే అర్థంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכֹּן
  choice: సిద్ధపరచబడింది
  rationale: כון అనే క్రియ యొక్క నిఫాల్ రూపం ఇక్కడ సిద్ధం చేయబడడం, స్థిరపరచబడడం, లేదా సక్రమంగా అమర్చబడడం అనే ఫలితార్థాన్ని ఇస్తుంది. సందర్భంలో నిర్మాణకార్యం సమగ్రంగా సిద్ధపరచబడి పూర్తయిందనే భావానికి ఈ పదబంధం సహజంగా సరిపోతుంది; ప్రత్యామ్నాయ భావాలను [a]లో ఉంచాం.
- source_word: כָּל מְלֶאכֶת שְׁלֹמֹה
  choice: సొలొమోను చేసిన పనంతా
  rationale: מְלָאכָה అంటే పని, శ్రమ, లేదా కార్యం. తెలుగు వాక్యనిర్మాణంలో యజమాన్య సంబంధాన్ని సహజంగా వ్యక్తం చేస్తూ, మొత్తం నిర్మాణ కార్యక్రమాన్ని సూచించడానికి ఈ రూపం ఎంచుకున్నాం.
- source_word: עַד הַיּוֹם מוּסַד בֵּית יְהוָה וְעַד כְּלֹתוֹ
  choice: యాహ్వే మందిరానికి పునాది వేసిన రోజు మొదలుకొని అది పూర్తయ్యే వరకు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘పునాది వేయబడిన రోజు వరకు ... దాని పూర్తి వరకు’ అని ఉన్నా, సందర్భం ఆరంభం నుండి ముగింపు వరకు ఉన్న కాలవ్యాప్తిని సూచిస్తుంది. సహజమైన తెలుగులో ‘మొదలుకొని ... వరకు’ అని ఇచ్చి, అక్షర నిర్మాణాన్ని [b]లో తెలిపాం.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే మందిరం
  rationale: అక్షరార్థం ‘యాహ్వే గృహం.’ ఇక్కడ సూచించేది దేవాలయమే కాబట్టి ఆధునిక తెలుగులో స్పష్టమైన ‘మందిరం’ వాడాం; దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: שָׁלֵם
  choice: సంపూర్ణమైంది
  rationale: ఈ విశేషణం ఇక్కడ విధేయంగా ఉండి మందిరం పూర్తయిన, సంపూర్ణమైన స్థితిని ప్రకటిస్తుంది. ‘సంపూర్ణమైంది’ పూర్తి కావడాన్ని, సంపూర్ణ స్థితిని రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాకుండా నాలుగు హీబ్రూ అక్షరాలతో ఉన్న వ్యక్తిగత దైవనామం ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా, సాధారణ పాండిత్య లిప్యంతరీకరణకు అనుగుణంగా తెలుగులో ‘యాహ్వే’గా ఇచ్చాం.
- issue: మందిర నిర్మాణం పూర్తికావడాన్ని తెలిపే ముగింపు వాక్యం
  choice: అలా యాహ్వే మందిరం సంపూర్ణమైంది
  alternative: యాహ్వే మందిరం పూర్తయింది
  rationale: שָׁלֵם కేవలం పని ముగిసిందనే భావంతో పాటు సంపూర్ణ స్థితిని కూడా సూచించగలదు. అందువల్ల ఆ భావవిస్తృతిని నిలుపుతూ ‘సంపూర్ణమైంది’ అని ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘గృహం’ అనే అక్షర రూపానికి బదులు సందర్భస్పష్టత కోసం ‘మందిరం’ ఎంచుకున్నాం. మూలంలోని సంక్షిప్త, కొంత అసాధారణమైన కాల నిర్మాణాన్ని ప్రధాన పాఠంలో స్పష్టంగా చెప్పి, దాని అక్షర రూపాన్ని పాదసూచికలో నిలిపాం.
