revisions:
- from: సొలొమోను యెహోవా మందిరాన్ని, తన సొంత భవనాన్ని[a] నిర్మించిన ఇరవై సంవత్సరాల కాలం ముగిసిన తరువాత,
  to: సొలొమోను యెహోవా మందిరాన్నీ తన ఇంటినీ నిర్మించిన ఇరవై సంవత్సరాలు ముగిసిన తరువాత,
