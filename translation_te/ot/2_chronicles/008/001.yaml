id: 2CH.8.1
reference: 2 Chronicles 8:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֞י מִ/קֵּ֣ץ עֶשְׂרִ֣ים שָׁנָ֗ה אֲשֶׁ֨ר בָּנָ֧ה שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה וְ/אֶת בֵּיתֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/001.yaml
  text: And it happened at the end of twenty years[a], during which Solomon had built the house of Yahweh and his own house,
translation:
  language: te
  text: సొలొమోను యెహోవా మందిరాన్నీ తన ఇంటినీ నిర్మించిన ఇరవై సంవత్సరాలు ముగిసిన తరువాత,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: …ముగిసిన తరువాత
  rationale: హీబ్రూ కథన సంధిని తెలుగులో సహజమైన కాలవాచక ఉపవాక్యంగా వ్యక్తం చేశాం; వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున ప్రత్యేకంగా ‘జరిగింది’ అని చేర్చలేదు.
- source_word: מִקֵּץ עֶשְׂרִים שָׁנָה
  choice: ఇరవై సంవత్సరాల కాలం ముగిసిన తరువాత
  rationale: ఇరవై సంవత్సరాల వ్యవధి పూర్తయిన సమయాన్ని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֲשֶׁר בָּנָה שְׁלֹמֹה
  choice: సొలొమోను … నిర్మించిన
  rationale: సంబంధవాచక నిర్మాణాన్ని అలాగే ఉంచుతూ, నిర్మాణకార్యాన్ని సూచించడానికి గౌరవప్రదమైన సాధారణ తెలుగు పదాన్ని వాడాం.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరాన్ని
  rationale: దేవునికి సంబంధించిన בַּיִת‌ను సందర్భానుసారంగా ‘మందిరం’ అని అనువదించాం; ఇది తెలుగులో ప్రార్థనా ఆలయాన్ని సహజంగా సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: בֵּיתוֹ
  choice: తన సొంత భవనాన్ని
  rationale: ప్రత్యయం సొలొమోను స్వామ్యాన్ని సూచిస్తుంది; యెహోవా మందిరంతో ఉన్న వ్యత్యాసాన్ని ‘తన సొంత’ స్పష్టం చేస్తుంది. ‘రాజభవనం’ సందర్భోచితమైనదే అయినా మూలపదం అంత నిర్దిష్టంగా లేదు.
theological_decisions:
- issue: యెహోవా అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలవచనంలో יהוה అనే ప్రత్యేక నామం ప్రత్యక్షంగా ఉంది కాబట్టి దానిని సాధారణ బిరుదుగా మార్చకుండా నామరూపంలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలవచనం తదుపరి వచనంలో కొనసాగుతుంది కాబట్టి చివర కామా ఉంచాం.
