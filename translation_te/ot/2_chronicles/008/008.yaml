source:
  edition: WLC
  text: מִן בְּנֵי/הֶ֗ם אֲשֶׁ֨ר נוֹתְר֤וּ אַחֲרֵי/הֶם֙ בָּ/אָ֔רֶץ אֲשֶׁ֥ר לֹֽא כִלּ֖וּ/ם בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יַּעֲלֵ֤/ם שְׁלֹמֹה֙ לְ/מַ֔ס עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/008.yaml
  text: From their descendants who were left after them in the land—those whom the sons of Israel had not destroyed—Solomon conscripted them for forced labor[b][a], to this day.
translation:
  language: te
  text: వారి సంతతివారిలో, వారి తరువాత దేశంలో మిగిలిపోయినవారిని—అంటే ఇశ్రాయేలు ప్రజలు పూర్తిగా నాశనం చేయనివారిని[a]—సొలొమోను నేటివరకు నిర్బంధ శ్రమకు నియమించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులు పూర్తిగా తుడిచిపెట్టనివారిని.” హీబ్రూలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు” అని ఉంది; అది ఇశ్రాయేలు ప్రజలకు సాధారణ జాతీయ సంజ్ఞ.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “శ్రమపన్నుకు.” ఇక్కడి హీబ్రూ పదం ప్రభుత్వం విధించే తప్పనిసరి శ్రమను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן בְּנֵיהֶם
  choice: వారి సంతతివారిని
  rationale: בְּנֵי అనే పదానికి అక్షరార్థంగా ‘కుమారులు’ అని అర్థమైనా, ఇక్కడ వంశపరమైన విస్తృత భావంలో ‘సంతతివారు’ సహజంగా సరిపోతుంది.
- source_word: אֲשֶׁר נוֹתְרוּ אַחֲרֵיהֶם
  choice: వారి తరువాత ... మిగిలిపోయిన
  rationale: נוֹתְרוּ లోని మిగిలి ఉండడం అనే ఫలితార్థాన్ని, אַחֲרֵיהֶם లోని కాలసంబంధాన్ని నిలుపుతుంది.
- source_word: בָּאָרֶץ
  choice: దేశంలో
  rationale: సందర్భంలోని నిర్దిష్ట భూభాగాన్ని ఆధునిక తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: אֲשֶׁר לֹא כִלּוּם בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు పూర్తిగా నాశనం చేయనివారిని
  rationale: Piel రూపంలోని כלה ఇక్కడ పూర్తిగా అంతం చేయడం లేదా నాశనం చేయడం అనే భావాన్ని ఇస్తుంది; בְּנֵי יִשְׂרָאֵל అనే జాతీయ సంజ్ఞను సహజ తెలుగులో ‘ఇశ్రాయేలు ప్రజలు’గా ఇచ్చాం.
- source_word: וַיַּעֲלֵם ... לְמַס
  choice: నిర్బంధ శ్రమ కోసం నియమించాడు
  rationale: עלה యొక్క causative రూపం మరియు לְמַס కలసి రాజ్యాధికారంతో తప్పనిసరి శ్రమను విధించడాన్ని సూచిస్తాయి.
- source_word: לְמַס
  choice: నిర్బంధ శ్రమ
  rationale: מַס సూచించే బలవంతపు ప్రభుత్వ శ్రమ లేదా శ్రమపన్నును సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటివరకు
  rationale: రచయిత కాలం వరకు కొనసాగిన స్థితిని తెలిపే హీబ్రూ నానుడికి సహజమైన తెలుగు సమానం.
