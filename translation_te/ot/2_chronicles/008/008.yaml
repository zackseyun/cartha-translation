translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని సంబంధ వాక్యాల క్రమాన్ని సాధ్యమైనంతవరకు నిలిపి, తెలుగులో స్పష్టత కోసం ‘అంటే’ ఉపయోగించాం. చివరి పదబంధంలోని కొనసాగింపు భావాన్ని స్పష్టపరచడానికి ‘వారు అలాగే ఉన్నారు’ అని పూరించాం.
