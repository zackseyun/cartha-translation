id: 2CH.8.15
reference: 2 Chronicles 8:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹ֣א סָרוּ֩ מִצְוַ֨ת הַ/מֶּ֜לֶךְ עַל הַ/כֹּהֲנִ֧ים וְ/הַ/לְוִיִּ֛ם לְ/כָל דָּבָ֖ר וְ/לָ/אֹצָרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/015.yaml
  text: And they did not turn aside from the king’s command concerning the priests and the Levites in any matter[a], or concerning the treasuries.
translation:
  language: te
  text: యాజకులు, లేవీయుల గురించి రాజు ఇచ్చిన ఆజ్ఞ నుండి వారు ఏ విషయంలోనూ, భాండాగారాల విషయములోనూ[a] తొలగిపోలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిల్వగదుల విషయములోనూ.” హీబ్రూ పదం ధనభాండాగారాలను లేదా నిల్వగదులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרוּ
  choice: విడిచిపెట్టలేదు
  rationale: సוּר అనే క్రియకు ‘పక్కకు తొలగడం, విడిచిపోవడం, తప్పడం’ అనే అర్థాలున్నాయి. ఆజ్ఞకు విధేయతను సూచించే ఈ సందర్భంలో ‘ఆజ్ఞను విడిచిపెట్టలేదు’ అనేది సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: రాజు ఇచ్చిన ఆజ్ఞను
  rationale: מִצְוָה అంటే ‘ఆజ్ఞ’. తెలుగు వాక్యనిర్మాణంలో కర్తృసంబంధాన్ని స్పష్టంగా, సహజంగా తెలిపేందుకు ‘రాజు ఇచ్చిన ఆజ్ఞ’ అని అనువదించబడింది.
- source_word: עַל הַכֹּהֲנִים וְהַלְוִיִּם
  choice: యాజకులు, లేవీయుల విషయంగా
  rationale: ఇక్కడ עַל అధికారాన్ని కాకుండా ఆజ్ఞకు సంబంధించిన పరిధిని సూచిస్తుంది. అందువల్ల ‘విషయంగా’ సరైన భావాన్ని ఇస్తుంది; రెండు సేవక వర్గాల ప్రత్యేకతను పేర్ల ద్వారా నిలిపింది.
- source_word: לְכָל דָּבָר
  choice: ఏ విషయంలోనూ
  rationale: నిషేధ వాక్యంలో ఈ పదబంధం ‘ఏ విషయంలోనూ’ అని సహజంగా వస్తూ, వారు ఏమాత్రం తప్పలేదనే సంపూర్ణ భావాన్ని తెలియజేస్తుంది.
- source_word: וְלָאֹצָרוֹת
  choice: భాండాగారాల విషయంలోనూ
  rationale: אֹצָרוֹת అనే పదం ధనం లేదా విలువైన వస్తువులు నిల్వచేసే ఖజానాలను, సాధారణ నిల్వగదులను సూచించగలదు. ఆలయ పరిపాలనా సందర్భంలో రెండింటినీ కొంతవరకు ఆవరించే ‘భాండాగారాలు’ను ప్రధాన పాఠంలో ఎంచుకున్నాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని విధేయత భావాన్ని సహజమైన తెలుగు వాక్యక్రమంలో అందించింది; וְ సంధిని ‘విషయంలోనూ’ ద్వారా సమన్వయార్థంగా నిలిపింది.
