revisions:
- from: వారు యాజకులు, లేవీయుల విషయంగా ఏ విషయంలోనూ, భాండాగారాల విషయంలోనూ[a] రాజు ఇచ్చిన ఆజ్ఞను విడిచిపెట్టలేదు.
  to: యాజకులు, లేవీయుల గురించి రాజు ఇచ్చిన ఆజ్ఞ నుండి వారు ఏ విషయంలోనూ, భాండాగారాల విషయములోనూ[a] తొలగిపోలేదు.
  rationale: 'The revision preserves the Hebrew sequence and scope: the king’s command concerned the priests and Levites; they did not turn aside from it in any matter, including matters of the treasuries. It uses idiomatic modern standard Telugu while retaining the lexical ambiguity of אֹצָרוֹת in a concise footnote.'
  reviewer_model: gpt-5.6-terra
