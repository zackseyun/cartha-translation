translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; చారిత్రక జాతినామాలకు సాంప్రదాయిక తెలుగు లిప్యంతరీకరణలు వాడబడ్డాయి. తరువాతి వచనంలో కొనసాగే హీబ్రూ వాక్యనిర్మాణాన్ని సూచించేందుకు చివర దీర్ఘవిరామ చిహ్నం ఉంచబడింది.
