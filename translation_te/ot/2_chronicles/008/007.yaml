  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּל הָ֠/עָם הַ/נּוֹתָ֨ר מִן הַ/חִתִּ֜י וְ/הָ/אֱמֹרִ֤י וְ/הַ/פְּרִזִּי֙ וְ/הַ/חִוִּ֣י וְ/הַ/יְבוּסִ֔י אֲשֶׁ֛ר לֹ֥א מִ/יִּשְׂרָאֵ֖ל הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/007.yaml
  text: As for all the people who were left from the Hittites[a], the Amorites, the Perizzites, the Hivites, and the Jebusites, who were not from Israel—
translation:
  language: te
  text: హిత్తీయులు, అమోరీయులు, పెరిజ్జీయులు, హివ్వీయులు, యెబూసీయులు అనే ప్రజలలో మిగిలిన వారందరూ—వారు ఇశ్రాయేలుకు చెందినవారు కారు[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులు కాని.” హీబ్రూలో అక్షరార్థంగా, “ఇశ్రాయేలు నుండి కానివారు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעָם
  choice: ప్రజలందరూ
  rationale: כָּל הָעָם ఇక్కడ ప్రస్తావించిన మిగిలిన అన్యజాతి జనసమూహం మొత్తాన్ని సూచిస్తుంది; ‘ప్రజలందరూ’ సహజమైన సమష్టి ప్రయోగం.
- source_word: הַנּוֹתָר
  choice: మిగిలిన
  rationale: יתר/נותר ధాతువు నిఫాల్ కృదంత రూపం మిగిలి ఉన్నవారిని సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో ‘మిగిలిన’ సహజంగా సరిపోతుంది.
- source_word: מִן
  choice: లో
  rationale: జాబితాలోని ఆయా జనసమూహాల నుండి మిగిలిన వారనే భావాన్ని తెలుగులో ‘...యులలో మిగిలిన’ అనే నిర్మాణం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַחִתִּי וְהָאֱמֹרִי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי
  choice: హిత్తీయులు, అమోరీయులు, పెరిజ్జీయులు, హివ్వీయులు, యెబూసీయులు
  rationale: హీబ్రూ ఏకవచన జాతినామాలు సమష్టిగా వాడబడ్డాయి; తెలుగులో ఆయా ప్రజలను సూచించడానికి బహువచన రూపాలు సహజమైనవి.
- source_word: אֲשֶׁר לֹא מִיִּשְׂרָאֵל הֵמָּה
  choice: వారు ఇశ్రాయేలులోనివారు కారు
  rationale: మూలంలోని מִן‌ను ప్రతిబింబిస్తూ ఈ ప్రజలు ఇశ్రాయేలు సమూహానికి చెందినవారు కాదనే భావాన్ని, వారిని నేరుగా ‘ఇశ్రాయేలీయులు కారు’ అని మాత్రమే నిర్ధారించకుండా, సహజమైన తెలుగులో నిలుపుతుంది.
