id: 2CH.8.13
reference: 2 Chronicles 8:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בִ/דְבַר י֣וֹם בְּ/י֗וֹם לְ/הַעֲלוֹת֙ כְּ/מִצְוַ֣ת מֹשֶׁ֔ה לַ/שַּׁבָּתוֹת֙ וְ/לֶ֣/חֳדָשִׁ֔ים וְ/לַ/מּ֣וֹעֲד֔וֹת שָׁל֥וֹשׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה בְּ/חַ֧ג הַ/מַּצּ֛וֹת וּ/בְ/חַ֥ג הַ/שָּׁבֻע֖וֹת וּ/בְ/חַ֥ג הַ/סֻּכּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/013.yaml
  text: 'according to the daily requirement for offering up sacrifices[a], as Moses commanded, for the Sabbaths, the new moons, and the appointed feasts three times in the year: at the Feast of Unleavened Bread, at the Feast of Weeks[c][b], and at the Feast of Booths.'
translation:
  language: te
  text: 'ప్రతి రోజుకు నిర్దేశించబడిన విధంగా బలులను అర్పించడానికి,[a] మోషే ఆజ్ఞ ప్రకారం—విశ్రాంతి దినాలలో, నెలారంభాలలో, నియమిత పండుగలలో, సంవత్సరానికి మూడుసార్లు: పులియని రొట్టెల పండుగలో, వారాల పండుగలో,[b] గుడిసెల పండుగలో.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతి రోజుకు ఉన్న నియమం ప్రకారం.” అక్షరార్థంగా, “ఒక రోజు విషయం ఆ రోజున.”
    reason: lexical_alternative
  - marker: b
    text: “వారాల పండుగ”ను తరువాతి గ్రీకు వాడుకలో “పెంతెకొస్తు” అని పిలిచారు.
    reason: cross_reference
  - marker: c
    text: లేదా, “పర్ణశాలల పండుగ” లేదా “గుడారాల పండుగ”; హీబ్రూ పదానికి “గుడిసెలు” అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִדְבַר יוֹם בְּיוֹם
  choice: ప్రతి రోజుకు నిర్దేశించిన
  rationale: ‘ఒక రోజు విషయం ఆ రోజున’ అనే హీబ్రూ నుడికారానికి బలుల సందర్భంలో ‘ఆయా రోజుకు నిర్దేశించినది’ అనే భావం ఉంది. సహజమైన ఆధునిక తెలుగులో దాని నియమిత దినసరి భావాన్ని ఇది తెలియజేస్తుంది.
- source_word: לְהַעֲלוֹת
  choice: బలులను అర్పించాలి
  rationale: עלה అనే క్రియ యొక్క హిఫీల్ రూపం ఆరాధనా సందర్భంలో బలిని అర్పించడాన్ని సూచిస్తుంది. హీబ్రూలో కర్మ ప్రత్యక్షంగా లేకపోయినా సందర్భార్థాన్ని తెలుగులో స్పష్టం చేయడానికి ‘బలులను’ చేర్చబడింది.
- source_word: כְּמִצְוַת מֹשֶׁה
  choice: మోషే ఆజ్ఞాపించిన ప్రకారం
  rationale: మోషే ద్వారా ఇవ్వబడిన నియమాన్ని సహజంగా, దాని అధికార భావాన్ని నిలుపుతూ వ్యక్తపరుస్తుంది.
- source_word: לַשַּׁבָּתוֹת
  choice: విశ్రాంతి దినాల్లో
  rationale: ఇక్కడ ఉపసర్గ బలులు అర్పించవలసిన సందర్భాలను సూచిస్తుంది. ‘విశ్రాంతి దినాలు’ సబ్బాతు అనే హీబ్రూ భావాన్ని పారదర్శకంగా అందిస్తుంది.
- source_word: וְלֶחֳדָשִׁים
  choice: అమావాస్య రోజుల్లో
  rationale: ఆరాధనా పంచాంగ సందర్భంలో חֳדָשִׁים సాధారణ నెలలను కాక, నెలారంభంలోని అమావాస్య ఆచరణలను సూచిస్తుంది.
- source_word: וְלַמּוֹעֲדוֹת
  choice: నియమిత పండుగల్లో
  rationale: מוֹעֲדִים అనేది నియమించబడిన కాలాలను సూచించగలిగినా, వెంటనే మూడు యాత్రా పండుగలు పేర్కొనబడుతున్నందున ‘నియమిత పండుగలు’ రెండు భావాలనూ నిలుపుతుంది.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: సంవత్సరానికి మూడుసార్లు
  rationale: హీబ్రూ కాలవ్యక్తీకరణను సహజమైన ఆధునిక తెలుగులో నేరుగా అందిస్తుంది.
- source_word: בְּחַג הַמַּצּוֹת
  choice: పొంగని రొట్టెల పండుగలో
  rationale: మత్సోత్ అనే పేరులోని పులియబెట్టని రొట్టెల భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּבְחַג הַשָּׁבֻעוֹת
  choice: వారాల పండుగలో
  rationale: హీబ్రూ పేరు ‘వారాలు’ అనే అర్థాన్నే ఇస్తుంది. తరువాతి గ్రీకు వాడుకలోని ‘పెంతెకొస్తు’ను ప్రధాన పాఠ్యంలోకి వెనక్కి తీసుకురాలేదు.
- source_word: וּבְחַג הַסֻּכּוֹת
  choice: పర్ణశాలల పండుగలో
  rationale: סֻכּוֹת సూచించే తాత్కాలిక నివాసాల స్పష్టమైన దృశ్యాన్ని, తెలుగులో స్థిరపడిన మరియు గౌరవప్రదమైన పేరుతో అందిస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు యాత్రా పండుగల పేర్లను తరువాతి మతపరమైన పేర్లతో ఇవ్వాలా, హీబ్రూ పేర్ల అర్థాన్ని పారదర్శకంగా ఇవ్వాలా
  choice: పొంగని రొట్టెల పండుగ / వారాల పండుగ / పర్ణశాలల పండుగ
  alternative: పస్కా కాలం / పెంతెకొస్తు / గుడారాల పండుగ
  rationale: హీబ్రూ పాఠ్యం పండుగలను వాటి స్వంత పేర్లతో పేర్కొంటుంది. అందువల్ల తరువాతి గ్రీకు లేదా సంఘపరమైన పేర్లను ప్రధాన పాఠ్యంలో పెట్టకుండా, మూలంలోని పేర్ల అర్థాన్ని తెలుగులో పారదర్శకంగా అందించాం; ఉపయోగకరమైన సంప్రదాయ పేర్లను పాదసూచికల్లో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. హీబ్రూ వాక్యభాగం ముందరి వచనంపై ఆధారపడుతున్నప్పటికీ, తెలుగులో అర్థవంతంగా ఉండేందుకు విధ్యర్థకమైన ‘అర్పించాలి’ వాడబడింది. పండుగల పేర్లలో మూలభాష దృశ్యార్థానికి ప్రాధాన్యం ఇచ్చి, తరువాతి పేర్లను పాదసూచికలకు పరిమితం చేశాం.
