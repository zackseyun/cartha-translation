revisions:
- from: 'మోషే ఆజ్ఞాపించిన ప్రకారం, ప్రతి రోజుకు నిర్దేశించిన బలులను[a] అర్పించాలి—విశ్రాంతి దినాల్లో, అమావాస్య రోజుల్లో, నియమిత పండుగల్లో; అంటే సంవత్సరానికి మూడుసార్లు: పొంగని రొట్టెల పండుగలో, వారాల పండుగలో[b], పర్ణశాలల పండుగలో[c].'
  to: 'ప్రతి రోజుకు నిర్దేశించబడిన విధంగా బలులను అర్పించడానికి,[a] మోషే ఆజ్ఞ ప్రకారం—విశ్రాంతి దినాలలో, నెలారంభాలలో, నియమిత పండుగలలో, సంవత్సరానికి మూడుసార్లు: పులియని రొట్టెల పండుగలో, వారాల పండుగలో,[b] గుడిసెల పండుగలో.[c]'
  rationale: వచనాన్ని ఆజ్ఞారూపం నుండి మూలానికి సరిపోయే అనుబంధ infinitive నిర్మాణానికి మార్చాం. కొత్తచంద్ర/నెలారంభ పంచాంగార్థాన్ని స్పష్టీకరించాం. పండుగపేర్లలో హీబ్రూ దృశ్యార్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సంప్రదాయ పేర్లను పాదసూచికలకు పరిమితం చేశాం. పాదసూచిక గుర్తులు సంబంధిత పదాలకే సరిగ్గా అమర్చబడ్డాయి.
