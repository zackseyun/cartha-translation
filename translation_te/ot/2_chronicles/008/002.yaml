language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הֶ/עָרִ֗ים אֲשֶׁ֨ר נָתַ֤ן חוּרָם֙ לִ/שְׁלֹמֹ֔ה בָּנָ֥ה שְׁלֹמֹ֖ה אֹתָ֑/ם וַ/יּ֥וֹשֶׁב שָׁ֖ם אֶת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/002.yaml
  text: As for the cities that Huram had given to Solomon[c][b][a], Solomon rebuilt them and settled the people of Israel there.
translation:
  language: te
  text: హూరాము[a] సొలొమోనుకు ఇచ్చిన పట్టణాలను సొలొమోను నిర్మించి[b], అక్కడ ఇశ్రాయేలు ప్రజలను[c] నివసింపజేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘హూరాము’; సంప్రదాయంగా ‘హీరాము.’
    reason: alternative_reading
  - marker: b
    text: లేదా ‘కట్టాడు.’ సందర్భానుసారం ‘మళ్లీ నిర్మించాడు’ లేదా ‘పునరుద్ధరించాడు’ అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: 'అక్షరార్థం: ‘ఇశ్రాయేలు కుమారులను.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעָרִים
  choice: పట్టణాలను
  rationale: హీబ్రూ సంధానపదం కథనంలోని తదుపరి కార్యాన్ని కలుపుతుంది; తెలుగులో వాక్యప్రవాహం సహజంగా ఉండేందుకు ప్రత్యేకంగా ‘మరి’ అని అనువదించకుండా కర్మరూపంతో ప్రారంభించాం.
- source_word: אֲשֶׁר נָתַן חוּרָם לִשְׁלֹמֹה
  choice: హూరాము సొలొమోనుకు ఇచ్చిన
  rationale: సంబంధ ఉపవాక్యాన్ని సహజమైన తెలుగు కృదంత నిర్మాణంలో ఇచ్చాం. సందర్భం ముందుగా జరిగిన దానిని సూచిస్తుంది; తెలుగులో ‘ఇచ్చిన’ దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חוּרָם
  choice: హూరాము
  rationale: మూలంలోని חוּרָם (హూరామ్) రూపాన్ని అనుసరించిన లిప్యంతరీకరణ; సంప్రదాయ ప్రత్యామ్నాయమైన ‘హీరాము’ను పాదటిప్పణిలో ఇచ్చాం.
- source_word: בָּנָה
  choice: కట్టించి
  rationale: ప్రాథమిక అర్థం ‘కట్టాడు.’ అప్పటికే ఉన్న పట్టణాలు సొలొమోనుకు ఇవ్వబడిన సందర్భంలో మరమ్మతు చేయించడం లేదా పునర్నిర్మించడం భావంలో ఉండవచ్చు; అందువల్ల అస్పష్టతను పాదటిప్పణిలో నిలిపాం. రాజు స్వయంగా కట్టాడనే అసహజ భావం రాకుండా తెలుగు సహజ ప్రయోగమైన ‘కట్టించి’ వాడాం.
- source_word: וַיּוֹשֶׁב
  choice: నివసింపజేశాడు
  rationale: 'ישׁב ధాతువు హిఫీల్ రూపంలోని కారణార్థాన్ని నేరుగా నిలుపుతుంది: సొలొమోను వారిని అక్కడ నివసించేలా చేశాడు.'
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలను
  rationale: అక్షరార్థం ‘ఇశ్రాయేలు కుమారులను’; ఇక్కడ అది పురుషులను మాత్రమే కాక ఇశ్రాయేలు జనసమూహాన్ని సూచిస్తుంది. ‘ప్రజలు’ ఆ సామూహిక భావాన్ని సహజంగా తెలియజేస్తుంది.
