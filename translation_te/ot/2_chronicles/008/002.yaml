translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. మూలంలోని సంక్షిప్తతను కాపాడుతూ, בנה క్రియలోని ‘కట్టడం/పునర్నిర్మించడం’ అస్పష్టతను పాదటిప్పణిలో నిలిపాం.
