  text: And he built Upper Beth-horon and Lower Beth-horon[a], fortified cities with walls, doors[c][b], and bars.
translation:
  language: te
  text: అతడు ఎగువ బేత్-హోరోనును, దిగువ బేత్-హోరోనును ప్రాకారాలు, తలుపులు[a], అడ్డకడ్డీలు[b] గల ప్రాకారబద్ధ పట్టణాలుగా నిర్మించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, కోట ద్వారాలకు అమర్చిన తలుపులు కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘గడియలు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: నిర్మించాడు
  rationale: בנה అనే క్రియ ప్రధానంగా ‘కట్టాడు/నిర్మించాడు’ అని అర్థమిస్తుంది. ఈ సందర్భంలో ‘తిరిగి నిర్మించాడు’ అనే భావం సాధ్యమైనా, క్రియ స్వయంగా దానిని నిర్బంధించదు.
- source_word: בֵּית חוֹרוֹן הָעֶלְיוֹן
  choice: ఎగువ బేత్-హోరోను
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, ఎత్తులో ఉన్న జంట పట్టణాన్ని సూచించే הָעֶלְיוֹן‌ను సహజమైన తెలుగులో ‘ఎగువ’గా ఇచ్చాం.
- source_word: בֵּית חוֹרוֹן הַתַּחְתּוֹן
  choice: దిగువ బేత్-హోరోను
  rationale: జంట స్థలనామాల్లో తక్కువ ఎత్తులో ఉన్న పట్టణాన్ని సూచించే הַתַּחְתּוֹן‌కు ‘దిగువ’ సహజమైన సమానార్థకం.
- source_word: עָרֵי מָצוֹר
  choice: కోట పట్టణాలుగా
  rationale: ఈ సంయుక్త పదబంధం రక్షణ ఏర్పాట్లు గల బలమైన పట్టణాలను సూచిస్తుంది. ‘కోట పట్టణాలు’ ఆధునిక తెలుగులో స్పష్టంగా, సంక్షిప్తంగా ఉంది.
- source_word: חוֹמוֹת
  choice: ప్రాకారాలు
  rationale: కోట పట్టణాల రక్షణ గోడలను సూచించేందుకు ‘ప్రాకారాలు’ ఖచ్చితమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: דְּלָתַיִם
  choice: తలుపులు
  rationale: మూలపదం సాధారణంగా ‘తలుపులు’ లేదా ‘జంట తలుపులు’ అని అర్థమిస్తుంది; ఇది సాధారణ ‘పట్టణ ద్వారం’ అనే పదం కాదు. ఇక్కడ కోట ద్వారాలకు అమర్చిన తలుపులు ఉద్దేశమై ఉండవచ్చు.
- source_word: וּבְרִיחַ
  choice: అడ్డగడియలు
  rationale: తలుపులను భద్రపరచే అడ్డంగా వేసే కడ్డీలు లేదా గడియలను సూచిస్తుంది. కోట రక్షణ సందర్భంలో ‘అడ్డగడియలు’ సహజంగా అర్థాన్ని తెలియజేస్తుంది.
