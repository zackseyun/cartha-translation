id: 2CH.8.12
reference: 2 Chronicles 8:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָ֣ז הֶעֱלָ֧ה שְׁלֹמֹ֛ה עֹל֖וֹת לַ/יהוָ֑ה עַ֚ל מִזְבַּ֣ח יְהוָ֔ה אֲשֶׁ֥ר בָּנָ֖ה לִ/פְנֵ֥י הָ/אוּלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/012.yaml
  text: Then Solomon offered up burnt offerings to Yahweh on the altar of Yahweh that he had built before the vestibule[a].
translation:
  language: te
  text: అప్పుడు సొలొమోను, మండపం ఎదుట తాను కట్టిన యెహోవా బలిపీఠం మీద యెహోవాకు దహనబలులను అర్పించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: తరువాత జరిగిన కార్యాన్ని పరిచయం చేసే కాలసూచక పదంగా సహజమైన తెలుగు రూపం.
- source_word: הֶעֱלָה
  choice: అర్పించాడు
  rationale: దహనబలుల సందర్భంలో హిఫిల్ రూపం బలిని బలిపీఠంపై అర్పించడాన్ని సూచిస్తుంది; తెలుగులో ‘అర్పించాడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: שְׁלֹמֹה
  choice: సొలొమోను
  rationale: వ్యక్తి పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
- source_word: עֹלוֹת
  choice: దహనబలులను
  rationale: బలిపీఠంపై పూర్తిగా దహనం చేసే బలులను సూచించే స్థిరమైన, అర్థవంతమైన తెలుగు పదం.
- source_word: לַיהוָה
  choice: యెహోవా కోసం
  rationale: ל ఉపసర్గ ఇక్కడ బలి ఎవరికి సమర్పితమైందో సూచిస్తుంది; ‘కోసం’ అంకిత భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: עַל מִזְבַּח יְהוָה
  choice: యెహోవా బలిపీఠం మీద
  rationale: స్థల సంబంధాన్ని, నామవాచక సంబంధాన్ని సహజ తెలుగు క్రమంలో నిలుపుతుంది.
- source_word: אֲשֶׁר בָּנָה
  choice: తాను కట్టించిన
  rationale: కర్త సొలొమోనే అని స్పష్టం చేస్తూ, రాజు నిర్మాణాన్ని చేపట్టించిన భావానికి సహజమైన తెలుగు రూపం; హెబ్రీ వాక్యంలోని పూర్వ నిర్మాణ చర్యను సందర్భం తెలియజేస్తుంది.
- source_word: לִפְנֵי הָאוּלָם
  choice: మండపం ఎదుట
  rationale: ఆలయ ప్రవేశ భాగమైన אוּלָםను ‘మండపం’గా, దాని ముందున్న స్థానాన్ని ‘ఎదుట’గా సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని ప్రత్యేక దైవనామాన్ని బిరుదుగా మార్చకుండా పేరుగానే ఉంచుతుంది; ఆధునిక తెలుగు బైబిలు పాఠకులకు ‘యెహోవా’ విస్తృతంగా గుర్తుపట్టదగిన రూపం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. బలి సంబంధ పదజాలాన్ని స్పష్టంగా ఉంచి, ఆలయ నిర్మాణ పదానికి పాఠ్యంలో సులభమైన ‘మండపం’ను వాడి ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
