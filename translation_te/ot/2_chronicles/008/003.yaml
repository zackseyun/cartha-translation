  yaml_path: translation/ot/2_chronicles/008/003.yaml
  text: Then Solomon went to Hamath-zobah and prevailed against it[a].
translation:
  language: te
  text: అప్పుడు సొలొమోను హమాత్-సోబాకు వెళ్లి, దానిపై పైచేయి సాధించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దానిని జయించాడు” లేదా “దానిపై అధికారం సాధించాడు.” హీబ్రూ ప్రయోగం అక్షరార్థంగా “దానిపై బలవంతుడయ్యాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: వెళ్లి
  rationale: הלך అనే క్రియ ఇక్కడ ప్రాథమికంగా ‘వెళ్లాడు’ అని అర్థమిస్తుంది. సైనిక చర్య సందర్భంలో ఉన్నప్పటికీ, ఈ క్రియలోనే దాడి భావాన్ని చేర్చకుండా తరువాతి క్రియ ఆ భావాన్ని తెలియజేసేలా అనువదించాం.
- source_word: חֲמָת צוֹבָה
  choice: హమాత్-సోబా
  rationale: ఈ రెండు పేర్లు ఇక్కడ ఒక సంయుక్త స్థలనామంగా పనిచేస్తున్నాయి; అందువల్ల హీబ్రూ నామరూపాన్ని స్పష్టంగా నిలుపుతూ ‘హమాత్-సోబా’ అని లిప్యంతరీకరించాం.
- source_word: וַיֶּחֱזַק עָלֶיהָ
  choice: దానిపై పైచేయి సాధించాడు
  rationale: חזק על అనే హీబ్రూ ప్రయోగం అక్షరార్థంగా ‘దానిపై బలవంతుడయ్యాడు’ అనే భావాన్ని ఇస్తూ, సందర్భంలో జయించడం లేదా ఆధిపత్యం సాధించడం సూచిస్తుంది. ‘పైచేయి సాధించాడు’ మూలంలోని భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; పూర్తిగా ‘లోబరచుకున్నాడు’ అని చెప్పడం ఫలితాన్ని మరింత నిర్దిష్టం చేయవచ్చు.
