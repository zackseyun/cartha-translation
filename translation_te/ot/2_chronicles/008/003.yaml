  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. స్థలనామం సంయుక్త రూపంలో నిలుపబడింది; హీబ్రూ నుడికారంలోని అర్థ విస్తృతిని పాదటిప్పణిలో భద్రపరచాం.
