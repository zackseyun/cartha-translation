  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. స్థలనామాలు మూలానికి దగ్గరగా లిప్యంతరీకరించబడ్డాయి.
