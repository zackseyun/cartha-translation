  yaml_path: translation/ot/2_chronicles/008/004.yaml
  text: He built Tadmor in the wilderness[a], and all the storage cities that he built in Hamath.
translation:
  language: te
  text: అతడు అరణ్యంలో తద్మోరును[a], హమాతులో నిర్మించిన నిల్వ పట్టణాలన్నిటినీ నిర్మించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: తద్మోరు సాంప్రదాయికంగా పల్మైరాతో గుర్తించబడుతుంది.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּבֶן
  choice: నిర్మించాడు
  rationale: בנה క్రియ యొక్క వయ్యిక్తోల్ రూపం కథన క్రమంలో జరిగిన గత చర్యను సూచిస్తుంది. తెలుగులో సహజమైన భూతకాల రూపం దీనిని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: תַּדְמֹר
  choice: తద్మోరు
  rationale: ఇది స్థలనామం కాబట్టి అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించబడింది; తరువాతి కాలపు ‘పల్మైరా’ అనే పేరును ప్రధాన వచనంలో ప్రతిస్థాపించలేదు.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: מִדְבָּר జనావాసం తక్కువగా ఉన్న అరణ్య లేదా ఎడారి ప్రాంతాన్ని సూచించగలదు. ‘అరణ్యం’ అనే పదం కేవలం ఇసుక ఎడారి అనే భావానికి పరిమితం కాకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: כָּל עָרֵי הַמִּסְכְּנוֹת
  choice: నిల్వ పట్టణాలన్నిటినీ
  rationale: ఈ నిర్మాణబంధం సామగ్రి లేదా సరఫరాలు నిల్వచేసే పట్టణాలను సూచిస్తుంది. ‘నిల్వ పట్టణాలు’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: אֲשֶׁר בָּנָה
  choice: తాను కట్టించిన
  rationale: ఇది నిల్వ పట్టణాలను విశేషించే సంబంధ వాక్యం. రాజు స్వయంగా కట్టాడనే కాక తన ఆధ్వర్యంలో కట్టించాడనే సహజ రాజకథన భావాన్ని తెలుగులో తెలియజేస్తుంది.
- source_word: בַּחֲמָת
  choice: హమాతులో
  rationale: ב ఉపసర్గ ఇక్కడ స్థలార్థకంగా ఉంది. ‘హమాతులో’ అనే రూపం నగరమా ప్రాంతమా అనే ఖచ్చిత పరిధిని అనవసరంగా నిర్ణయించకుండా మూలంలోని స్థల సూచనను నిలుపుతుంది.
