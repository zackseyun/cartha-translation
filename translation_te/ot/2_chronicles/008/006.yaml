source:
  edition: WLC
  text: וְ/אֶֽת בַּעֲלָ֗ת וְ/אֵ֨ת כָּל עָרֵ֤י הַֽ/מִּסְכְּנוֹת֙ אֲשֶׁ֣ר הָי֣וּ לִ/שְׁלֹמֹ֔ה וְ/אֵת֙ כָּל עָרֵ֣י הָ/רֶ֔כֶב וְ/אֵ֖ת עָרֵ֣י הַ/פָּרָשִׁ֑ים וְ/אֵ֣ת כָּל חֵ֣שֶׁק שְׁלֹמֹ֗ה אֲשֶׁ֤ר חָשַׁק֙ לִ/בְנ֤וֹת בִּ/ירֽוּשָׁלִַ֨ם֙ וּ/בַ/לְּבָנ֔וֹן וּ/בְ/כֹ֖ל אֶ֥רֶץ מֶמְשַׁלְתּֽ/וֹ־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/006.yaml
  text: and Baalath[a], and all the storage cities that belonged to Solomon, and all the chariot cities, and the cities of the horsemen[c][b], and all that Solomon desired to build in Jerusalem and in Lebanon and throughout all the land of his dominion.
translation:
  language: te
  text: బయలాతును, సొలొమోనుకు చెందిన గిడ్డంగి పట్టణాలన్నిటిని[a], రథాల పట్టణాలన్నిటిని, గుర్రపు రౌతుల పట్టణాలను[c], అలాగే యెరూషలేములోను, లెబానోనులోను, తన పరిపాలనలోని దేశమంతటా సొలొమోను నిర్మించాలని కోరుకున్నవన్నిటిని[b] అతడు నిర్మించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిల్వ పట్టణాలు,’ ‘సరఫరా పట్టణాలు’ లేదా బహుశా ‘ధనాగార పట్టణాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో అక్షరార్థంగా, ‘సొలొమోను నిర్మించాలని కోరుకున్న అతని కోరిక అంతటిని.’ ఒకే మూలపదంతో ఏర్పడిన నామవాచకం, క్రియ కలిసి సొలొమోను కోరికను లేదా అభిరుచిని నొక్కిచెబుతున్నాయి.
    reason: lexical_alternative
  - marker: c
    text: ‘గుర్రాల కోసం పట్టణాలు’ అని కూడా అనువదించవచ్చు; అయితే ఇక్కడి హెబ్రీ పదం సాధారణంగా గుర్రపు రౌతులను లేదా అశ్విక దళాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלָת
  choice: బయలాతు
  rationale: ఇది స్థలనామం కాబట్టి అనువదించకుండా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: עָרֵי הַמִּסְכְּנוֹת
  choice: గిడ్డంగి పట్టణాలు
  rationale: సరుకులు లేదా ఆహార సామగ్రి నిల్వచేసే పట్టణాల భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ‘ధనాగార పట్టణాలు’ అనే సంకుచిత అర్థాన్ని బలవంతంగా మోపదు.
- source_word: אֲשֶׁר הָיוּ לִשְׁלֹמֹה
  choice: సొలొమోనుకు చెందిన
  rationale: హెబ్రీ భాషలోని స్వామ్య భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עָרֵי הָרֶכֶב
  choice: రథాల పట్టణాలు
  rationale: రథాలకు, వాటి దళాలకు లేదా నిర్వహణకు సంబంధించిన పట్టణాలు అనే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: עָרֵי הַפָּרָשִׁים
  choice: గుర్రపు రౌతుల పట్టణాలు
  rationale: פָּרָשִׁים సాధారణంగా గుర్రపు స్వారులను లేదా అశ్విక దళాన్ని సూచిస్తుంది; కేవలం గుర్రాలను అని అనువదించకుండా మానవ సూచనను నిలుపుతుంది.
- source_word: כָּל חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָשַׁק
  choice: సొలొమోను నిర్మించాలని కోరుకున్నవన్నీ
  rationale: మూలంలోని ఒకే ధాతువుతో ఏర్పడిన నామవాచక–క్రియ పునరుక్తిని అసహజంగా అనుకరించకుండా, అతని కోరిక లేదా అభిరుచికి ఉన్న ఉద్ఘాటనను సహజ తెలుగులో అందిస్తుంది.
- source_word: לִבְנוֹת
  choice: నిర్మించాలని
  rationale: మూలంలోని ‘కట్టుట/నిర్మించుట’ అనే సాధారణ భావాన్నే ఇస్తుంది; ‘పునర్నిర్మించుట’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: בִּירוּשָׁלִַם
  choice: యెరూషలేములో
  rationale: ప్రచలిత తెలుగు బైబిలు స్థలనామ రూపాన్ని ఉపయోగిస్తుంది.
- source_word: וּבַלְּבָנוֹן
  choice: లెబానోనులోను
  rationale: భౌగోళిక నామాన్ని ఆధునిక తెలుగు రూపంలో లిప్యంతరీకరిస్తుంది.
- source_word: בְכֹל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: తన పరిపాలనలోని దేశమంతటా
  rationale: భూభాగం మరియు దానిపై అతని పాలన అనే రెండు భావాలను సహజ తెలుగులో నిలుపుతుంది.
