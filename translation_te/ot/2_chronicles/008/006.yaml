translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టమైన శైలి. ఈ వాక్యం మునుపటి వచనం నుండి కొనసాగే జాబితా అయినా, తెలుగులో సంపూర్ణ వాక్యంగా చదవడానికి సందర్భం సూచించే ‘అతడు నిర్మించాడు’ చివర చేర్చబడింది. పాదసూచిక [a]ను ఇంగ్లీషు పాఠ్యంలో కనిపించినట్లుగా ‘బయలాతు’ వద్ద కాకుండా, దాని విషయానికి సరిపోయే ‘గిడ్డంగి పట్టణాలు’ వద్ద ఉంచబడింది; [b], [c] కూడా వాటి సంబంధిత పదబంధాల వద్ద ఉంచబడ్డాయి.
