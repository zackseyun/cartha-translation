id: 2CH.8.9
reference: 2 Chronicles 8:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִן בְּנֵי֙ יִשְׂרָאֵ֔ל אֲ֠שֶׁר לֹא נָתַ֧ן שְׁלֹמֹ֛ה לַ/עֲבָדִ֖ים לִ/מְלַאכְתּ֑/וֹ כִּי הֵ֜מָּה אַנְשֵׁ֤י מִלְחָמָה֙ וְ/שָׂרֵ֣י שָׁלִישָׁ֔י/ו וְ/שָׂרֵ֥י רִכְבּ֖/וֹ וּ/פָרָשָֽׁי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/009.yaml
  text: But from the sons of Israel Solomon did not make servants for his work[a], for they were men of war, and his officers[c][b], and the commanders of his chariots and his horsemen.
translation:
  language: te
  text: అయితే ఇశ్రాయేలు కుమారుల్లో[a] ఎవ్వరినీ సొలొమోను తన పని కోసం బానిసలుగా నియమించలేదు[b]. ఎందుకంటే వారు యోధులుగాను, అతని సైనిక అధికారులుగాను[c], అతని రథాల అధిపతులుగాను, అతని గుర్రపు దళంవారుగాను ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయుల్లో.” హెబ్రీలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారుల్లో” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “వారిలో ఎవ్వరినీ తన శ్రమ కోసం బానిసలుగా పెట్టలేదు.” ఈ హెబ్రీ వ్యక్తీకరణ బానిస శ్రమకు నియమించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడి హెబ్రీ పదం బహుశా ఉన్నత స్థాయి సైనిక అధికారులను లేదా సైనిక సహాయకులను సూచిస్తుంది; “సైన్యాధిపతులు” వంటి మరింత నిర్దిష్ట అనువాదాలు కూడా సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִן בְּנֵי יִשְׂרָאֵל
  choice: అయితే ఇశ్రాయేలు కుమారుల్లో
  rationale: మునుపటి వచనంతో ఉన్న వ్యత్యాసాన్ని ‘అయితే’ చూపిస్తుంది; ‘ఇశ్రాయేలు కుమారులు’ అనే రూపం హెబ్రీయ వ్యక్తీకరణను నిలుపుతుంది.
- source_word: לֹא נָתַן ... לַעֲבָדִים לִמְלַאכְתּוֹ
  choice: ఎవ్వరినీ ... తన పని కోసం బానిసలుగా నియమించలేదు
  rationale: ఈ నిర్మాణం వారిని సాధారణ సేవకులుగా కాక బానిస శ్రమకు నియమించడాన్ని సూచిస్తుంది. తెలుగులో వాక్యం సహజంగా ఉండేందుకు మూలంలో అంతర్లీనంగా ఉన్న ‘వారిలో ఎవ్వరినీ’ స్పష్టం చేయబడింది.
- source_word: כִּי הֵמָּה
  choice: ఎందుకంటే వారు ... ఉన్నారు
  rationale: ఇశ్రాయేలీయులను బానిసలుగా నియమించకపోవడానికి ఇచ్చిన కారణాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: యోధులు
  rationale: ‘యుద్ధపు మనుషులు’ అనే హెబ్రీయ నుడికారానికి సహజమైన ఆధునిక తెలుగు సైనిక సమానార్థకం.
- source_word: שָׂרֵי שָׁלִישָׁיו
  choice: అతని సైనిక అధికారులు
  rationale: שָׁלִישׁ అనే పదం ఖచ్చితమైన హోదా వివాదాస్పదమైన ఉన్నత సైనిక అధికారి లేదా సహాయకుడిని సూచిస్తుంది; ‘సైనిక అధికారులు’ అనవసరమైన నిర్దిష్టతను నివారిస్తుంది.
- source_word: שָׂרֵי רִכְבּוֹ
  choice: అతని రథాల అధిపతులు
  rationale: రథదళంపై బాధ్యతగల అధికారులను స్పష్టంగా సూచిస్తుంది.
- source_word: וּפָרָשָׁיו
  choice: అతని గుర్రపు దళంవారు
  rationale: పదం గుర్రాలపై యుద్ధం చేసే సైనికులను సూచిస్తుంది; ఆధునిక పాఠకులకు సహజంగా అర్థమయ్యే రూపం.
theological_decisions:
- issue: ఇశ్రాయేలీయుల శ్రమ స్థితి
  choice: వారిని ‘బానిసలుగా నియమించలేదు’ అని అనువదించడం
  alternative: ‘సేవకులుగా చేయలేదు’
  rationale: עֲבָדִים మరియు సందర్భంలోని బలవంతపు శ్రమ బానిస స్థితిని సూచిస్తాయి; మృదువైన ‘సేవకులు’ మూలంలోని సామాజిక తీవ్రతను తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక వర్ణన. హెబ్రీ ‘ఇశ్రాయేలు కుమారులు’ అనే మూలరూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సాధారణ రూపాన్ని పాదసూచికలో ఇచ్చాం. క్లిష్టమైన సైనిక హోదాకు తప్పుడు నిర్దిష్టత ఇవ్వలేదు.
