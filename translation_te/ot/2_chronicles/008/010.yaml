  text: 'These were the chiefs of King Solomon’s deputies: two hundred and fifty[b][a], who ruled over the people.'
translation:
  language: te
  text: వీరు రాజైన సొలొమోనుకు చెందిన నియమిత అధికారుల ప్రధానులు[a]—ప్రజలపై అధికారం చెలాయించినవారు[b] మొత్తం రెండువందల యాభై మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పర్యవేక్షకుల ప్రధానులు.” ఇక్కడి హీబ్రూ పదం రాజు అధికారంలో నియమించబడిన అధికారులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ప్రజలను పర్యవేక్షించినవారు,” “ప్రజల బాధ్యత వహించినవారు.” ఈ క్రియ పరిపాలనా అధికారాన్ని వినియోగించడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: వీరు
  rationale: చారిత్రక వర్ణనలో ముందుగా చెప్పిన వారి గుర్తింపును సహజమైన తెలుగులో పరిచయం చేస్తుంది; హీబ్రూ సంధానాన్ని సందర్భానుసారంగా వ్యక్తం చేస్తుంది.
- source_word: שָׂרֵי הַנְּצִיבִים
  choice: నియమిత అధికారుల ప్రధానులు
  rationale: שָׂרֵי అనే పదంలోని ఉన్నత హోదాను ‘ప్రధానులు’ తెలియజేస్తుంది; נְצִיבִים రాజాధికారంతో నియమించబడిన అధికారులను సూచిస్తుంది. ఈ పదబంధం సైనిక అర్థాన్ని అనవసరంగా రుద్దదు.
- source_word: אֲשֶׁר לַמֶּלֶךְ שְׁלֹמֹה
  choice: రాజైన సొలొమోనుకు చెందిన
  rationale: లమెద్ సూచించే రాజుతో అనుబంధం లేదా ఆయన అధికార పరిధిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: రెండువందల యాభై మంది
  rationale: హీబ్రూ సంఖ్యను ప్రామాణిక తెలుగులో ఇస్తూ, వ్యక్తుల సంఖ్య కాబట్టి ‘మంది’ ఉపయోగించబడింది.
- source_word: הָרֹדִים
  choice: అధికారం చెలాయించినవారు
  rationale: רדה లోని పాలించడం లేదా అధికారం వినియోగించడం అనే భావాన్ని పరిపాలనా సందర్భానికి తగినట్లు వ్యక్తం చేస్తుంది; క్రూరమైన అణచివేత భావాన్ని అనవసరంగా చేర్చదు.
- source_word: בָּעָם
  choice: ప్రజలపై
  rationale: רדה తో వచ్చిన ב అధికారం అమలయ్యే వ్యక్తులను సూచిస్తుంది. ‘పనివారిపై’ అనే సందర్భోచిత అర్థం సాధ్యమైనా, ఈ వచనంలో עָם స్పష్టంగా ‘ప్రజలు’ అని ఉంది.
