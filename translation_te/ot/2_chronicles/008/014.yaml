    rationale: హీబ్రూ లְהַלֵּל וּלְשָׁרֵת అనేది లేవీయులను ఏ పనుల కొరకు నియమించాడో తెలిపే ఉద్దేశ్యార్థక ప్రయోగం. ‘చేయాలి’ కొత్త నియమాజ్ఞ స్వరాన్ని కలిగిస్తుంది.
