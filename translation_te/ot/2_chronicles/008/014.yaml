id: 2CH.8.14
reference: 2 Chronicles 8:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעֲמֵ֣ד כְּ/מִשְׁפַּ֣ט דָּֽוִיד אָ֠בִי/ו אֶת מַחְלְק֨וֹת הַ/כֹּהֲנִ֜ים עַל עֲבֹדָתָ֗/ם וְ/הַ/לְוִיִּ֣ם עַל מִ֠שְׁמְרוֹתָ/ם לְ/הַלֵּ֨ל וּ/לְ/שָׁרֵ֜ת נֶ֤גֶד הַ/כֹּֽהֲנִים֙ לִ/דְבַר י֣וֹם בְּ/יוֹמ֔/וֹ וְ/הַ/שּׁוֹעֲרִ֥ים בְּ/מַחְלְקוֹתָ֖/ם לְ/שַׁ֣עַר וָ/שָׁ֑עַר כִּ֣י כֵ֔ן מִצְוַ֖ת דָּוִ֥יד אִישׁ הָ/אֱלֹהִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/014.yaml
  text: And according to the ordinance of David his father[a], he appointed the divisions of the priests for their service, and the Levites for their duties, to praise and to minister before the priests, as each day required, and the gatekeepers in their divisions for each gate; for so was the commandment of David[b], the man of God.
translation:
  language: te
  text: అతడు తన తండ్రి దావీదు[a] నియమం ప్రకారం యాజకుల విభాగాలను వారి సేవకు, లేవీయులను వారి బాధ్యతలకు నియమించాడు—యాజకుల ఎదుట స్తుతించడానికి, పరిచర్య చేయడానికి, ప్రతి రోజుకు నిర్దేశించిన ప్రకారం[b]. అలాగే ద్వారపాలకులను ఒక్కో ద్వారం కోసం వారి విభాగాల ప్రకారం నియమించాడు. ఎందుకంటే దేవుని మనుష్యుడైన దావీదు ఆజ్ఞ ఇదే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తండ్రి’ అని ఉన్న హీబ్రూ పదం కొన్ని సందర్భాల్లో ‘పూర్వికుడు’ అని కూడా అర్థం ఇవ్వగలదు; ఇక్కడ దావీదు సొలొమోను తండ్రే.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఒక రోజు విషయాన్ని దాని రోజున’; అంటే ప్రతి రోజుకు నిర్దేశించిన సేవాక్రమం ప్రకారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: నియమించాడు
  rationale: עמד హిఫీల్ రూపం ఇక్కడ ఆలయ సేవకులను నిర్దిష్ట బాధ్యతల్లో ఉంచడం లేదా నియమించడం అనే పరిపాలనా భావాన్ని ఇస్తుంది.
- source_word: כְּמִשְׁפַּט
  choice: ఏర్పాటు చేసిన నియమం ప్రకారం
  rationale: מִשְׁפָּט ఇక్కడ తీర్పు కంటే దావీదు స్థాపించిన నిర్దేశిత ఆలయ క్రమాన్ని సూచిస్తుంది; సహజమైన తెలుగులో ఆ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: דָּוִיד אָבִיו
  choice: తన తండ్రి దావీదు
  rationale: మూలంలోని బంధుత్వ పదాన్ని నేరుగా నిలుపుతుంది. אָב విస్తృత వంశపూర్విక అర్థంలోనూ వాడవచ్చు, అయితే ఈ సందర్భంలో దావీదు నిజంగా సొలొమోను తండ్రి.
- source_word: מַחְלְקוֹת
  choice: విభాగాలు
  rationale: యాజకులు, ద్వారపాలకులు క్రమబద్ధంగా పంచబడిన సేవా బృందాలను సూచించే స్పష్టమైన ఆధునిక పదం.
- source_word: עַל עֲבֹדָתָם
  choice: వారి సేవకు
  rationale: వారికి అప్పగించిన ఆలయ సేవా పరిధిని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: מִשְׁמְרוֹתָם
  choice: వారి బాధ్యతలు
  rationale: ఈ నామవాచకం కాపలా వంతులు, అప్పగించిన పనులు లేదా బాధ్యతలను సూచించగలదు; ఇక్కడ లేవీయుల నియమిత విధులకు ‘బాధ్యతలు’ సహజంగా సరిపోతుంది.
- source_word: לְהַלֵּל וּלְשָׁרֵת
  choice: స్తుతిస్తూ పరిచర్య చేయాలి
  rationale: הלל యొక్క స్తుతి భావాన్నీ, שרת యొక్క పవిత్ర సేవ లేదా పరిచర్య భావాన్నీ నిలుపుతుంది.
- source_word: נֶגֶד הַכֹּהֲנִים
  choice: యాజకుల ఎదుట
  rationale: נֶגֶד యొక్క ‘ఎదుట/సమక్షంలో’ అనే స్థలసంబంధ భావాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా కాపాడుతుంది.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: ప్రతి రోజూ ఆ రోజుకు నిర్దేశించిన ప్రకారం
  rationale: ‘ఒక రోజు విషయం దాని రోజున’ అనే హీబ్రూ నుడికారాన్ని సహజంగా తెలుపుతూ, రోజువారీ నిర్దేశిత క్రమాన్ని వ్యక్తపరుస్తుంది.
- source_word: הַשּׁוֹעֲרִים
  choice: ద్వారపాలకులు
  rationale: ఆలయ ద్వారాలను పర్యవేక్షించే వారి పాత్రకు స్పష్టమైన, ప్రస్తుత తెలుగు సమానార్థకం.
- source_word: לְשַׁעַר וָשָׁעַר
  choice: ఒక్కో ద్వారం కోసం
  rationale: హీబ్రూ పంపిణీ ప్రయోగంలోని ‘ప్రతి ద్వారానికి’ అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: מִצְוַת
  choice: ఆజ్ఞ
  rationale: అధికారపూర్వకమైన నిర్దేశాన్ని తెలియజేసే సరళమైన, గౌరవప్రదమైన పదం.
theological_decisions:
- issue: దావీదును ‘తండ్రి’ అని పిలిచే రాజవంశ సంబంధ భాష
  choice: తన తండ్రి దావీదు
  alternative: తన పూర్వికుడైన దావీదు
  rationale: మూలంలోని אָב పదాన్ని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా నిలుపుతుంది. హీబ్రూలో అది పూర్వికుడిని సూచించగలిగినా, ఈ సందర్భంలో దావీదు సొలొమోను తండ్రి కావడం వల్ల ప్రత్యక్ష అనువాదం సహజంగానూ చారిత్రకంగానూ సరిపోతుంది.
- issue: లేవీయుల సేవ యాజకులతో ఉన్న సంబంధం
  choice: యాజకుల ఎదుట
  alternative: యాజకులతో పాటు లేదా యాజకుల ఆధ్వర్యంలో
  rationale: נֶגֶד వారి సేవ యాజకుల సమక్షంలో లేదా ఎదురుగా జరిగిందని చెబుతుంది; ‘తో పాటు’ లేదా ‘ఆధ్వర్యంలో’ అని అనువదిస్తే మూలం స్పష్టంగా చెప్పని సంస్థాగత సంబంధాన్ని జోడించే ప్రమాదం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. పొడవైన హీబ్రూ వాక్యాన్ని పఠన సౌలభ్యం కోసం చిన్న వాక్యాలుగా విభజించినా, యాజకులు, లేవీయులు, ద్వారపాలకుల నియామక క్రమం మరియు కారణ వాక్యం యథాతథంగా నిలుపబడ్డాయి.
