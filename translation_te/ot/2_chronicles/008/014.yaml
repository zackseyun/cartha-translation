  revised_text: అతడు తన తండ్రి దావీదు[a] నియమం ప్రకారం యాజకుల విభాగాలను వారి సేవకు, లేవీయులను వారి బాధ్యతలకు నియమించాడు—యాజకుల ఎదుట స్తుతించడానికి, పరిచర్య చేయడానికి, ప్రతి రోజుకు నిర్దేశించిన ప్రకారం[b]. అలాగే ద్వారపాలకులను ఒక్కో ద్వారం కోసం వారి విభాగాల ప్రకారం నియమించాడు. ఎందుకంటే దేవుని మనుష్యుడైన దావీదు ఆజ్ఞ ఇదే.
