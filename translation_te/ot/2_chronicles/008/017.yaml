  edition: WLC
  text: אָז֩ הָלַ֨ךְ שְׁלֹמֹ֜ה לְ/עֶצְיֽוֹן גֶּ֧בֶר וְ/אֶל אֵיל֛וֹת עַל שְׂפַ֥ת הַ/יָּ֖ם בְּ/אֶ֥רֶץ אֱדֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/017.yaml
  text: Then Solomon went to Ezion-geber and to Eloth[a], on the shore of the sea in the land of Edom.
translation:
  language: te
  text: అప్పుడు సొలొమోను ఎస్యోను-గెబెరుకూ, ఎదోము దేశంలోని సముద్రతీరాన ఉన్న ఏలోతుకూ[a] వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఏలోతు అనే స్థలనామాన్ని ఏలాతు లేదా ఏలతు అని కూడా రాస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: తరువాత జరిగిన సంఘటనను పరిచయం చేసే కాలసూచక పదంగా సహజమైన కథన ప్రవాహాన్ని నిలుపుతుంది.
- source_word: הָלַךְ
  choice: వెళ్లాడు
  rationale: ఇక్కడ הלך సాధారణంగా ఒక ప్రదేశానికి వెళ్లడాన్ని సూచిస్తుంది; ‘నడిచాడు’ అనడం అనవసరంగా ప్రయాణ విధానాన్ని నిర్దిష్టం చేస్తుంది.
- source_word: לְעֶצְיוֹן גֶּבֶר
  choice: ఎస్యం-గెబెరుకు
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగు ధ్వన్యనుకరణలో అందించి, సంయుక్త స్థలనామ స్వరూపాన్ని హైఫన్‌తో నిలిపింది.
- source_word: וְאֶל אֵילוֹת
  choice: ఏలోతుకు
  rationale: సంయోజకాన్ని తెలుగు జాబితా నిర్మాణంలో సహజంగా వ్యక్తం చేస్తూ, אֵילוֹת రూపానికి దగ్గరైన ధ్వన్యనుకరణను ఉపయోగించింది.
- source_word: עַל שְׂפַת הַיָּם
  choice: సముద్రతీరాన ఉన్న
  rationale: שְׂפַת అనే ‘అంచు/తీరం’ భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: ఎదోము దేశంలో
  rationale: మూలంలోని ‘దేశం’ అనే పదాన్ని విడిచిపెట్టకుండా, స్థల సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని స్థల సంబంధాలను సహజ తెలుగు పదక్రమంలో అమర్చింది; మూలార్థంలోని అంశాలన్నీ నిలిపింది.
