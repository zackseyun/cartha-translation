  terminology: ‘దావీదు నగరం,’ ‘ఇశ్రాయేలు రాజైన దావీదు ఇల్లు,’ ‘యెహోవా,’ ‘మందసం,’ మరియు ‘పవిత్రమైనవి’ స్థిరమైన, అర్థవంతమైన పదప్రయోగాలు. ‘స్థలాలు’ అనేది మూలంలోని అనిర్దిష్ట బహువచనాన్ని వివరణాత్మకంగా మాత్రమే వ్యక్తం చేస్తుంది; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
