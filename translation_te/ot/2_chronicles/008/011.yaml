source:
  edition: WLC
  text: וְ/אֶת בַּת פַּרְעֹ֗ה הֶעֱלָ֤ה שְׁלֹמֹה֙ מֵ/עִ֣יר דָּוִ֔יד לַ/בַּ֖יִת אֲשֶׁ֣ר בָּֽנָה לָ֑/הּ כִּ֣י אָמַ֗ר לֹא תֵשֵׁ֨ב אִשָּׁ֥ה לִ/י֙ בְּ/בֵית֙ דָּוִ֣יד מֶֽלֶךְ יִשְׂרָאֵ֔ל כִּי קֹ֣דֶשׁ הֵ֔מָּה אֲשֶׁר בָּֽאָ֥ה אֲלֵי/הֶ֖ם אֲר֥וֹן יְהוָֽה־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/011.yaml
  text: And Solomon brought Pharaoh’s daughter up from the city of David to the house that he had built for her[a], for he said, “My wife shall not live in the house of David king of Israel, because the places to which the ark of Yahweh has come are holy.”
translation:
  language: te
  text: సొలొమోను ఫరో కుమార్తెను దావీదు నగరం నుండి ఆమె కోసం తాను కట్టిన ఇంటికి పైకి తీసుకువెళ్లాడు. ఎందుకంటే అతడు, “నా భార్య ఇశ్రాయేలు రాజైన దావీదు ఇంట్లో నివసించకూడదు; యెహోవా మందసం వచ్చిన స్థలాలు పవిత్రమైనవి[a]” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యం అక్షరార్థంగా, “యెహోవా మందసం వేటిలోనికి వచ్చిందో అవి పవిత్రమైనవి” అని ఉంది. బహువచన సూచ్యాన్ని స్పష్టం చేయడానికి “స్థలాలు” అని చేర్చబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעֱלָה
  choice: తీసుకువచ్చాడు
  rationale: హిఫిల్ రూపం ‘పైకి తీసుకురావడం’ అనే దిశాభావాన్ని కలిగి ఉన్నా, సహజమైన ఆధునిక తెలుగులో స్థలమార్పును ‘తీసుకువచ్చాడు’ అని వ్యక్తం చేశాం; భౌగోళిక ఎత్తును అనవసరంగా ముందుకు తేలేదు.
- source_word: מֵעִיר דָּוִיד
  choice: దావీదు నగరం నుండి
  rationale: భౌగోళిక నామాన్ని సూటిగా, తెలుగులో స్థిరపడిన రూపంలో అనువదించాం.
- source_word: לַבַּיִת אֲשֶׁר בָּנָה לָהּ
  choice: ఆమె కోసం తాను కట్టించిన ఇంటికి
  rationale: בַּיִת యొక్క సాధారణ అర్థమైన ‘ఇల్లు’ను నిలిపి, రాజభవనం అని ప్రత్యేకీకరించలేదు. సందర్భంలో సొలొమోనే నిర్మాణానికి బాధ్యుడని సహజంగా తెలిపేందుకు ‘కట్టించిన’ వాడాం.
- source_word: לֹא תֵשֵׁב אִשָּׁה לִי
  choice: నా భార్య ... నివసించకూడదు
  rationale: אִשָּׁה ఇక్కడ ఫరో కుమార్తెను, సొలొమోను వైవాహిక సంబంధాన్ని సూచిస్తున్నందున ‘స్త్రీ’ కంటే ‘భార్య’ సందర్భోచితం. ישׁב యొక్క నివాసార్థాన్ని ‘నివసించు’గా ఇచ్చాం.
- source_word: בְּבֵית דָּוִיד מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజైన దావీదు ఇంట్లో
  rationale: సంబంధాన్ని తెలుగులో సహజ క్రమంలో ఉంచి, בַּיִת ను ‘ఇల్లు’గానే నిలిపాం; ‘రాజభవనం’ అని వివరణాత్మకంగా మార్చలేదు.
- source_word: קֹדֶשׁ הֵמָּה
  choice: పవిత్రమైనవి
  rationale: హీబ్రూ బహువచన విధేయతను నిలిపి, పరిశుద్ధత భావాన్ని సాధారణ ఆధునిక తెలుగు పదంతో తెలిపాం.
- source_word: אֲשֶׁר בָּאָה אֲלֵיהֶם אֲרוֹן יְהוָה
  choice: యెహోవా మందసం వచ్చిన స్థలాలు
  rationale: హీబ్రూలోని బహువచన సర్వనామానికి స్పష్టమైన నామవాచకం లేకపోవడంతో, వ్యాకరణం మరియు సందర్భానికి అనుగుణంగా ‘స్థలాలు’ను పూరించాం. אָרוֹן ను సందర్భానుసారంగా ‘మందసం’గా ఇచ్చాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’గా ఉంచాం; బిరుదుతో భర్తీ చేయలేదు.
theological_decisions:
- issue: పవిత్రతకు సంబంధించిన వాక్యంలో అంతర్లీనంగా ఉన్న బహువచన సూచ్యం
  choice: మందసం వచ్చిన ‘స్థలాలు’ పవిత్రమైనవి
  alternative: దావీదు ఇల్లు మొత్తాన్ని సాధారణంగా పవిత్రమని చెప్పడం; లేదా నామవాచకం పూరించకుండా అసహజమైన బహువచనాన్ని ఉంచడం
  rationale: הֵמָּה మరియు אֲלֵיהֶם రెండూ బహువచనాలు. తెలుగు వాక్యం అర్థవంతంగా ఉండేందుకు ‘స్థలాలు’ను పూరించాం; ఇది పాఠ్యంలో లేని అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: אִשָּׁה యొక్క సందర్భార్థం
  choice: భార్య
  alternative: స్త్రీ
  rationale: సొలొమోను ఫరో కుమార్తె గురించే మాట్లాడుతున్నందున వైవాహిక అర్థం సందర్భానికి సరిపోతుంది; స్త్రీలందరిపై సాధారణ నిషేధం ఉన్నట్లు సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మందసం,’ ‘పవిత్రమైనవి,’ ‘నివసించకూడదు’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండగా మూలంలోని ఆధ్యాత్మిక గంభీరతను నిలుపుతాయి.
