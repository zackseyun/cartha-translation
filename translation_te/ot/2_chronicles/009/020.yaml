translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. రాజభవనానికి చెందిన ప్రత్యేక నామాన్ని నిలిపి, అస్పష్టంగా ఉండే హీబ్రూ నుడికారాలకు పాదటిప్పణుల్లో అక్షరార్థం లేదా ప్రత్యామ్నాయ భావం ఇవ్వబడింది.
