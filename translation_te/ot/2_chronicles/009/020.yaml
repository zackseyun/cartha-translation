source:
  edition: WLC
  text: וְ֠/כֹל כְּלֵ֞י מַשְׁקֵ֨ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ זָהָ֔ב וְ/כֹ֗ל כְּלֵ֛י בֵּֽית יַ֥עַר הַ/לְּבָנ֖וֹן זָהָ֣ב סָג֑וּר אֵ֣ין כֶּ֗סֶף נֶחְשָׁ֛ב בִּ/ימֵ֥י שְׁלֹמֹ֖ה לִ/מְאֽוּמָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/020.yaml
  text: All King Solomon’s drinking vessels were gold[a], and all the vessels of the House of the Forest of Lebanon were pure gold[c][b]. Silver was not considered anything in the days of Solomon.
translation:
  language: te
  text: సొలొమోను రాజు పానపాత్రలన్నీ బంగారంవే. లెబానోను అరణ్య గృహం[a]లోని పాత్రలన్నీ మేలిమి బంగారంవే.[b] సొలొమోను కాలంలో వెండిని ఏమాత్రమూ విలువైనదిగా ఎంచేవారు కాదు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘లెబానోను అరణ్య రాజభవనం’; ఇది ఒక నిర్దిష్ట రాజసంబంధ భవనం పేరు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘మూసివేసిన బంగారం’; ఈ నుడికారాన్ని సాధారణంగా ‘మేలిమి బంగారం’ లేదా ‘శుద్ధి చేసిన బంగారం’ అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా ‘వెండి ఏమీగా ఎంచబడలేదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי מַשְׁקֵה
  choice: పానపాత్రలు
  rationale: כְּלֵי అనే విస్తృత పదానికి מַשְׁקֵה తాగే సందర్భాన్ని నిర్దేశిస్తుంది. ‘పానపాత్రలు’ అనేది కేవలం గిన్నెలు లేదా కప్పులకే పరిమితం చేయకుండా సహజంగా అర్థాన్ని అందిస్తుంది.
- source_word: זָהָב
  choice: బంగారం
  rationale: మూలంలోని సాధారణ పదార్థనామాన్ని నేరుగా అనువదించి, వచనంలో దాని పునరుక్తిని నిలిపింది.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: లెబానోను అరణ్య గృహం
  rationale: ఇది ఒక నిర్దిష్ట రాజభవన భవనానికి పేరు. בֵּית ను ‘గృహం’గా నేరుగా ప్రతిబింబిస్తూ దాని పేరుస్వరూపాన్ని నిలిపింది; ‘అరణ్య రాజభవనం’ అనేది వివరణాత్మక ప్రత్యామ్నాయం.
- source_word: זָהָב סָגוּר
  choice: మేలిమి బంగారం
  rationale: బంగారంతో కలిసిన סָגוּר అత్యున్నత నాణ్యతగల లేదా శుద్ధి చేసిన బంగారాన్ని సూచించే నుడికారం. ‘మేలిమి బంగారం’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: אֵין כֶּסֶף נֶחְשָׁב ... לִמְאוּמָה
  choice: వెండిని ఏమాత్రమూ విలువైనదిగా ఎంచేవారు కాదు
  rationale: ఈ వాక్యం సొలొమోను కాలంలో వెండికి ఉన్న అల్పప్రాధాన్యాన్ని సూచిస్తుంది. తెలుగు వాక్యం మూలభావాన్ని సహజంగా వ్యక్తం చేస్తుంది; అక్షరార్థమైన ‘వెండి ఏమీగా ఎంచబడలేదు’ అనే రూపం అసహజంగా ఉంటుంది.
- source_word: בִּימֵי שְׁלֹמֹה
  choice: సొలొమోను కాలంలో
  rationale: ‘సొలొమోను దినాల్లో’ అనే హీబ్రూ చారిత్రక నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; ‘పాలనలో’ అని రాజకీయ భావాన్ని అదనంగా నిర్దిష్టం చేయదు.
