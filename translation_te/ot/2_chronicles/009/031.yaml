source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב שְׁלֹמֹה֙ עִם אֲבֹתָ֔י/ו וַֽ/יִּקְבְּרֻ֔/הוּ בְּ/עִ֖יר דָּוִ֣יד אָבִ֑י/ו וַ/יִּמְלֹ֛ךְ רְחַבְעָ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/031.yaml
  text: And Solomon slept with his fathers[a], and they buried him in the city of David his father. And Rehoboam his son reigned in his place.
translation:
  language: te
  text: సొలొమోను తన పితరులతో కలిసి నిద్రించాడు[a]. వారు అతనిని తన తండ్రియైన దావీదు పట్టణంలో సమాధి చేశారు. అతని స్థానంలో అతని కుమారుడు రెహబాము రాజుగా పరిపాలించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘తన పితరులతో కలిసి నిద్రించాడు’; ఇది మరణాన్ని, తన పూర్వీకులతో సమాధి కావడాన్ని సూచించే సంప్రదాయోక్తి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: నిద్రించాడు
  rationale: మరణాన్ని సూచించే హీబ్రూ సంప్రదాయోక్తిని, అలాగే రాజుల మరణవార్తల్లో దాని అంతర్గ్రంథ సంబంధాన్ని నిలుపుతుంది.
- source_word: עִם אֲבֹתָיו
  choice: తన పితరులతో కూడ
  rationale: వంశపారంపర్య సందర్భంలోని ప్రామాణిక హీబ్రూ సూత్రాన్ని గౌరవంగా, సంక్షిప్తంగా ప్రతిబింబిస్తుంది; ఇక్కడ ‘పితరులు’ పూర్వీకులను సూచిస్తుంది.
- source_word: וַיִּקְבְּרֻהוּ
  choice: అతన్ని సమాధి చేశారు
  rationale: హీబ్రూలోని క్రియాశీల బహువచన రూపాన్నీ, సమాధి చేసినవారు ఎవరో పేర్కొనని స్వభావాన్నీ నిలుపుతుంది.
- source_word: בְּעִיר דָּוִיד
  choice: దావీదు పట్టణంలో
  rationale: గుర్తించదగిన బైబిలీయ స్థలనామాన్ని సహజమైన తెలుగు రూపంలో అందిస్తుంది.
- source_word: אָבִיו
  choice: అతని తండ్రి
  rationale: దావీదుకు సొలొమోనుతో ఉన్న ప్రత్యక్ష సంబంధాన్ని మూలంలోని సాధారణ అర్థానుసారం తెలుపుతుంది.
- source_word: וַיִּמְלֹךְ
  choice: రాజ్యపాలన చేశాడు
  rationale: రాజుగా పరిపాలించడాన్ని సూచించే హీబ్రూ రాజ్యసూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: రాజ్య వారసత్వం మరియు ప్రత్యామ్నాయ స్థానాన్ని మూలానికి దగ్గరగా తెలియజేస్తుంది.
