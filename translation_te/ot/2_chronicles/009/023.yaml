id: 2CH.9.23
reference: 2 Chronicles 9:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כֹל֙ מַלְכֵ֣י הָ/אָ֔רֶץ מְבַקְשִׁ֖ים אֶת פְּנֵ֣י שְׁלֹמֹ֑ה לִ/שְׁמֹ֨עַ֙ אֶת חָכְמָת֔/וֹ אֲשֶׁר נָתַ֥ן הָ/אֱלֹהִ֖ים בְּ/לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/023.yaml
  text: And all the kings of the earth sought the presence of Solomon[a], to hear his wisdom that God had put in his heart.
translation:
  language: te
  text: భూమి అంతటా ఉన్న రాజులందరూ దేవుడు సొలొమోను హృదయంలో ఉంచిన జ్ఞానాన్ని వినడానికి సొలొమోను సమక్షాన్ని కోరేవారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “సొలొమోను ముఖాన్ని వెదకేవారు”; అంటే అతని సమక్షంలోకి రావడానికి, అతనితో భేటీ కావడానికి ప్రయత్నించేవారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל מַלְכֵי הָאָרֶץ
  choice: భూమి మీద ఉన్న రాజులందరూ
  rationale: וְכֹל అనే సమగ్ర భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలిపి, הָאָרֶץ యొక్క ‘భూమి/దేశం’ అనే అర్థసాధ్యతలలో అంతర్జాతీయ రాజసందర్భానికి తగిన ‘భూమి’ భావాన్ని నిలుపుతుంది.
- source_word: מְבַקְשִׁים אֶת־פְּנֵי שְׁלֹמֹה
  choice: సొలొమోనును కలుసుకోవాలని కోరేవారు
  rationale: అక్షరార్థంగా ‘సొలొమోను ముఖాన్ని వెదకడం’ అనే హీబ్రూ నుడికారం అతని సమక్షంలోకి వచ్చి దర్శనం లేదా భేటీ కోరడాన్ని సూచిస్తుంది. ‘కలుసుకోవాలని కోరేవారు’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది; కొనసాగుతున్న లేదా అలవాటైన చర్యను ‘కోరేవారు’ తెలియజేస్తుంది.
- source_word: לִשְׁמֹעַ אֶת חָכְמָתוֹ
  choice: అతని జ్ఞానాన్ని వినడానికి
  rationale: ప్రయోజనార్థక infinitive భావాన్ని ‘వినడానికి’గా నేరుగా తెలిపి, ‘అతని జ్ఞానం’ అనే మూలపాఠ రూపకాన్ని విస్తరించకుండా నిలుపుతుంది.
- source_word: אֲשֶׁר נָתַן הָאֱלֹהִים בְּלִבּוֹ
  choice: దేవుడు సొలొమోను హృదయంలో ఉంచిన
  rationale: נתן యొక్క ప్రాథమిక ‘ఇవ్వు/ఉంచు’ భావాన్ని בְּלִבּוֹతో కలిసి సహజంగా ‘హృదయంలో ఉంచిన’గా అందిస్తుంది. తెలుగు వాక్యంలో సర్వనామ సూచన అస్పష్టంగా కాకుండా ఉండేందుకు ‘సొలొమోను’ పేరును పునరుక్తి చేసింది.
theological_decisions:
- issue: సొలొమోను జ్ఞానానికి దైవిక మూలం
  choice: దేవుడు సొలొమోను హృదయంలో ఉంచిన జ్ఞానం
  alternative: దేవుడు అతనికి ఇచ్చిన జ్ఞానం
  rationale: మూలపాఠం జ్ఞానాన్ని దేవుని కార్యానికి స్పష్టంగా ఆపాదించడమే కాక, అది సొలొమోను ‘హృదయంలో’ ఉంచబడిందని చెబుతుంది. ‘హృదయం’ అనే బైబిలు మానవ అంతరంగ చిత్రణను తొలగించకుండా నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన కథనశైలిని వాడాం. హీబ్రూ నుడికారాన్ని ప్రధాన వాక్యంలో సహజంగా అనువదించి, దాని అక్షరరూపాన్ని పాదటిప్పణిలో భద్రపరిచాం.
