source:
  edition: WLC
  text: וּ/שְׁלֹשׁ מֵא֤וֹת מָֽגִנִּים֙ זָהָ֣ב שָׁח֔וּט שְׁלֹ֤שׁ מֵאוֹת֙ זָהָ֔ב יַעֲלֶ֖ה עַל הַ/מָּגֵ֣ן הָ/אֶחָ֑ת וַ/יִּתְּנֵ֣/ם הַ/מֶּ֔לֶךְ בְּ/בֵ֖ית יַ֥עַר הַ/לְּבָנֽוֹן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/016.yaml
  text: and three hundred shields of beaten gold[a]; three hundred shekels of gold went onto each shield[c][b]. And the king put them in the House of the Forest of Lebanon.
translation:
  language: te
  text: అలాగే, సుత్తితో కొట్టిన బంగారంతో మూడువందల డాళ్లు చేయించాడు. ఒక్కొక్క డాలుకు మూడువందల షెకెల్ల బంగారం పట్టింది[a]. రాజు వాటిని లెబానోను అరణ్యపు భవనంలో[b] ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా ‘మూడువందల బంగారం’ అని ఉంది; కొలమానపు పేరు పేర్కొనబడలేదు. 1 రాజులు 10:17లోని సమాంతర వాక్యం ఆధారంగా ‘షెకెల్లు’ అని స్పష్టత కోసం చేర్చబడింది.
    reason: lexical_alternative
  - marker: b
    text: ‘లెబానోను అరణ్యపు భవనం’ అనేది ఒక పేరుగల రాజభవనం; ‘లెబానోను అరణ్యపు రాజభవనం’ అని కూడా అనువదించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: מָגִנִּים
  choice: డాళ్లు
  rationale: మָגֵן సాధారణంగా రక్షణకు వాడే డాలును సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘డాలు’ స్పష్టమైన, సహజమైన పదం.
- source_word: זָהָב שָׁחוּט
  choice: కొట్టి పలుచగా చేసిన బంగారం
  rationale: שָׁחוּט ఇక్కడ బంగారాన్ని కొట్టి లేదా సుత్తితో సాగదీసి పలుచని రేకులుగా చేసిన పనితీరును సూచిస్తుంది. ఈ అనువాదం తయారీ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: שְׁלֹשׁ מֵאוֹת זָהָב
  choice: మూడువందల షెకెలుల బంగారం
  rationale: హెబ్రీ పాఠంలో ‘మూడువందల బంగారం’ అని మాత్రమే ఉండి కొలమానపు పేరు లేదు. 1 రాజులు 10:17లోని సమాంతర వాక్యం మరియు ప్రాచీన బరువు ప్రయోగం ఆధారంగా ‘షెకెలులు’ను స్పష్టత కోసం చేర్చి, దానిని పాదసూచికలో తెలిపాం.
- source_word: יַעֲלֶה עַל
  choice: పట్టింది
  rationale: అక్షరార్థంగా బంగారం ఒక్కో డాలుమీదికి ‘ఎక్కింది’ లేదా ‘వచ్చింది’ అనే భావం. బంగారపు పరిమాణం ఒక్కో డాలుకు వినియోగించబడిందనే అర్థాన్ని తెలుగులో ‘పట్టింది’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַמָּגֵן הָאֶחָת
  choice: ఒక్కొక్క డాలుకు
  rationale: రూపంలో ఏకవచనమైనా, మూడువందల డాళ్లలో ప్రతి ఒక్కదానికీ అంత బంగారం పట్టిందనే విభజనార్థం సందర్భంలో స్పష్టంగా ఉంది.
- source_word: וַיִּתְּנֵם
  choice: వాటిని ... ఉంచాడు
  rationale: נתן స్థలాన్ని సూచించే పదబంధంతో వచ్చినప్పుడు ‘పెట్టాడు’ లేదా ‘ఉంచాడు’ అనే అర్థం ఇస్తుంది. ఇక్కడ ‘ఉంచాడు’ సహజంగా ఉంది.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: లెబానోను అరణ్య భవనం
  rationale: ఇది ఒక ప్రత్యేక రాజభవనానికి ఉన్న పేరు. ‘భవనం’ మూలంలోని בֵּית పదాన్ని కాపాడుతూ, ఇది సాధారణ అడవి ప్రదేశం కాదని స్పష్టం చేస్తుంది.
