translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలి వాడబడింది. ముందరి వచనంలోని క్రియ ఈ వాక్యంలో కొనసాగుతున్నందున సహజమైన తెలుగుకోసం ‘చేయించాడు’ను స్పష్టంగా పునరుద్ధరించాం. ‘కొట్టి పలుచగా చేసిన’ అనే పదబంధం పురాతన లోహపని భావాన్ని సులభంగా తెలియజేస్తుంది.
