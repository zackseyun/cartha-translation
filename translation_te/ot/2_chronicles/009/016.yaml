- from: అలాగే, కొట్టి పలుచగా చేసిన బంగారంతో మూడువందల డాళ్లు చేయించాడు. ఒక్కొక్క డాలుకు మూడువందల షెకెలుల బంగారం పట్టింది[a]. రాజు వాటిని లెబానోను అరణ్య భవనంలో[b] ఉంచాడు.
  to: అలాగే, సుత్తితో కొట్టిన బంగారంతో మూడువందల డాళ్లు చేయించాడు. ఒక్కొక్క డాలుకు మూడువందల షెకెల్ల బంగారం పట్టింది[a]. రాజు వాటిని లెబానోను అరణ్యపు భవనంలో[b] ఉంచాడు.
