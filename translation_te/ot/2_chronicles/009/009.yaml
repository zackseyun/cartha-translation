  text: וַ/תִּתֵּ֨ן לַ/מֶּ֜לֶךְ מֵאָ֥ה וְ/עֶשְׂרִ֣ים כִּכַּ֣ר זָהָ֗ב וּ/בְשָׂמִ֛ים לָ/רֹ֥ב מְאֹ֖ד וְ/אֶ֣בֶן יְקָרָ֑ה וְ/לֹ֤א הָיָה֙ כַּ/בֹּ֣שֶׂם הַ/ה֔וּא אֲשֶׁר נָתְנָ֥ה מַֽלְכַּת שְׁבָ֖א לַ/מֶּ֥לֶךְ שְׁלֹמֹֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/009.yaml
  text: And she gave the king one hundred twenty talents of gold[a], and spices in great abundance, and precious stones. There had never been spices like those that the queen of Sheba gave to King Solomon.
translation:
  language: te
  text: ఆమె రాజుకు నూట ఇరవై తలాంతుల బంగారాన్ని, ఎంతో సమృద్ధిగా సుగంధ ద్రవ్యాలను, విలువైన రాళ్లను ఇచ్చింది. షెబా రాణి రాజైన సొలొమోనుకు ఇచ్చిన ఆ సుగంధ ద్రవ్యాల వంటి సుగంధ ద్రవ్యాలు అప్పటివరకు ఎన్నడూ లేవు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “షెబా రాణి రాజైన సొలొమోనుకు ఇచ్చిన ఆ సుగంధ ద్రవ్యాల వంటి సుగంధ ద్రవ్యాలు మరెన్నడూ లేవు.” హీబ్రూ మాటలను అప్పటివరకు వాటికి సాటి లేదనే భావంగానో, మరింత విస్తృతంగా అవి తరువాత కూడా అసమానమైనవనే భావంగానో అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: ఆమె ... ఇచ్చింది
  rationale: נתן క్రియ యొక్క wayyiqtol రూపం కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగులో సహజమైన వాక్యక్రమం కోసం కర్తను మొదట ఉంచి, క్రియను చివర ఉంచాం.
- source_word: לַמֶּלֶךְ
  choice: రాజుకు
  rationale: ల ఉపసర్గ సూచించే గ్రహీతను తెలుగు సంప్రదాన విభక్తితో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מֵאָה וְעֶשְׂרִים כִּכַּר זָהָב
  choice: నూట ఇరవై తలాంతుల బంగారాన్ని
  rationale: כִּכָּר ఒక ప్రాచీన బరువు ప్రమాణం; బైబిలు తెలుగు వాడుకలో గుర్తించదగిన ‘తలాంతు’ అనే రూపాన్ని నిలిపాం.
- source_word: וּבְשָׂמִים
  choice: సుగంధ ద్రవ్యాలను
  rationale: בְּשָׂמִים సువాసనగల మసాలాలు లేదా ఇతర సుగంధ పదార్థాలను విస్తృతంగా సూచిస్తుంది; ‘సుగంధ ద్రవ్యాలు’ సహజంగా ఉండి ఆ విస్తృత అర్థాన్ని కాపాడుతుంది.
- source_word: לָרֹב מְאֹד
  choice: అత్యధిక పరిమాణంలో
  rationale: ఈ పదబంధం పరిమాణాన్ని బలంగా నొక్కి చెబుతుంది; తెలుగు అనువాదం ఆ తీవ్రతను సహజంగా తెలియజేస్తుంది.
- source_word: וְאֶבֶן יְקָרָה
  choice: విలువైన రాళ్లను
  rationale: హీబ్రూలో אֶבֶן ఏకవచనంలో ఉన్నా ఇక్కడ సమూహార్థకంగా వాడబడింది; బహుమతుల జాబితాలో తెలుగు బహువచనం సహజం.
- source_word: וְלֹא הָיָה כַּבֹּשֶׂם הַהוּא
  choice: అటువంటి సుగంధ ద్రవ్యాలు అప్పటివరకు ఎన్నడూ లేవు
  rationale: כְּ పోలికను సూచిస్తుంది; בֹּשֶׂם ఇక్కడ సమూహార్థకం. కథనంలోని గతకాల దృష్టికోణాన్ని ‘అప్పటివరకు’ స్పష్టం చేస్తుంది, కాగా వాక్యానికి ఉండగల విస్తృత భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אֲשֶׁר נָתְנָה מַלְכַּת שְׁבָא לַמֶּלֶךְ שְׁלֹמֹה
  choice: షెబా రాణి సొలొమోను రాజుకు ఇచ్చినవాటి వంటి
  rationale: సంబంధ వాక్యాన్ని తెలుగులో సహజమైన కృదంత నిర్మాణంగా మార్చి, ‘రాజు సొలొమోను’ అనే బిరుదు-పేరు సంబంధాన్ని ‘సొలొమోను రాజు’గా వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. ప్రాచీన బరువు ప్రమాణానికి ‘తలాంతు’ను నిలిపి, విలాసవస్తువుల జాబితాను సహజ తెలుగు వాక్యక్రమంలో అమర్చాం. హీబ్రూ పోలికలోని కాలసంబంధ అనిశ్చితిని ప్రధాన పాఠ్యం మరియు పాదటిప్పణి ద్వారా కాపాడాం.
