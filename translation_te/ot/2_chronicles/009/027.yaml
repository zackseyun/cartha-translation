id: 2CH.9.27
reference: 2 Chronicles 9:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן הַ/מֶּ֧לֶךְ אֶת הַ/כֶּ֛סֶף בִּ/ירוּשָׁלִַ֖ם כָּ/אֲבָנִ֑ים וְ/אֵ֣ת הָ/אֲרָזִ֗ים נָתַ֛ן כַּ/שִּׁקְמִ֥ים אֲשֶׁר בַּ/שְּׁפֵלָ֖ה לָ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/027.yaml
  text: The king made silver as common as stones in Jerusalem[a], and he made cedars as plentiful as sycamore trees in the lowland.
translation:
  language: te
  text: రాజు యెరూషలేములో వెండిని రాళ్లంత విరివిగా ఉండేలా చేశాడు; దేవదారు చెట్లను కొండపాద ప్రాంతంలో[a] ఉన్న మేడి చెట్లంత విస్తారంగా ఉండేలా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “షెఫేలా.” ఇది యూదా మధ్య పర్వతప్రాంతానికి పశ్చిమాన ఉన్న కొండపాద ప్రాంతం.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: విరివిగా / విస్తారంగా ఉండేలా చేశాడు
  rationale: క్రియకు అక్షరార్థంగా ‘ఇచ్చాడు/ఉంచాడు’ అనే భావం ఉన్నా, ఈ పోలికలలో రాజు వాటిని అత్యంత సమృద్ధిగా చేశాడనే ఫలితార్థం ఉద్దేశించబడింది. తెలుగు సహజత్వం కోసం ఆ భావాన్ని స్పష్టంగా వ్యక్తం చేశాం.
- source_word: הַכֶּסֶף
  choice: వెండి
  rationale: ఇక్కడ నాణేలను ప్రత్యేకంగా కాక, విలువైన లోహమైన వెండిని సూచిస్తుంది.
- source_word: כָּאֲבָנִים
  choice: రాళ్లంత విరివిగా
  rationale: ఈ పోలిక రూపాన్ని మాత్రమే కాక, రాళ్లవలె సాధారణంగా లభించేంత సమృద్ధిని సూచిస్తుంది.
- source_word: בִּירוּשָׁלִַם
  choice: యెరూషలేములో
  rationale: స్థలాన్ని సూచించే సరళమైన అనువాదం.
- source_word: הָאֲרָזִים
  choice: దేవదారు మానులను
  rationale: బహువచన నామవాచకం దేవదారు చెట్లను లేదా నిర్మాణానికి ఉపయోగించే వాటి మానులను సూచించవచ్చు. ‘మానులు’ వస్తుసామగ్రి భావాన్ని సహజంగా తెలియజేస్తూనే చెట్టు బింబాన్ని నిలుపుతుంది.
- source_word: כַּשִּׁקְמִים
  choice: మేడి చెట్లంత
  rationale: శిక్మీమ్ అనే చెట్లకు తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘మేడి చెట్లు’ను ఎంచుకున్నాం; పోలికలోని సమృద్ధి భావం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: లోతట్టు ప్రాంతంలో ఉన్న
  rationale: שְׁפֵלָה యూదా మధ్య పర్వతప్రాంతానికి పశ్చిమాన ఉన్న దిగువ కొండపాద ప్రాంతాన్ని సూచిస్తుంది. సాధారణ పాఠకునికి అర్థమయ్యే భౌగోళిక వర్ణనను ప్రధాన పాఠ్యంలో ఉంచి, ప్రాంతీయ పేరును పాదటిప్పణిలో ఇచ్చాం.
- source_word: לָרֹב
  choice: విస్తారంగా
  rationale: ఈ పదబంధం దేవదారు మానుల అత్యధిక సమృద్ధిని నొక్కిచెబుతుంది; తెలుగులో పోలికతో సహజంగా కలిసేలా అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకునికి స్పష్టంగా ఉండే గంభీరమైన శైలిని అనుసరించాం. రెండు సమాంతర పోలికలను నిలుపుతూ, హీబ్రూ క్రియలో సందర్భానుసారంగా ఉన్న సమృద్ధి కలిగించే భావాన్ని సహజంగా వ్యక్తం చేశాం.
