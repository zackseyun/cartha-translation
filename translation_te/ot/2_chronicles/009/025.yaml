  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֨י לִ/שְׁלֹמֹ֜ה אַרְבַּעַת֩ אֲלָפִ֨ים אֻֽרְי֤וֹת סוּסִים֙ וּ/מַרְכָּב֔וֹת וּ/שְׁנֵים עָשָׂ֥ר אֶ֖לֶף פָּרָשִׁ֑ים וַ/יַּנִּיחֵ/ם֙ בְּ/עָרֵ֣י הָ/רֶ֔כֶב וְ/עִם הַ/מֶּ֖לֶךְ בִּ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/025.yaml
  text: Solomon had four thousand stalls for horses and chariots[a], and twelve thousand horsemen[b]; he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: te
  text: సొలొమోనుకు గుర్రాలు, రథాల కోసం నాలుగు వేల[b] కొట్టాలు[a], పన్నెండు వేల మంది గుర్రపు రౌతులు ఉండేవారు. అతడు వారిని రథాల పట్టణాల్లోనూ, రాజుతోపాటు యెరూషలేములోనూ ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘శాలలు’; אֻרְיוֹת అనే హెబ్రీ పదం గుర్రాలను ఉంచే స్థలాలను లేదా శాల విభాగాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 1 రాజులు 4:26లోని సమాంతర వచనం ‘నలభై వేల కొట్టాలు’ అని చెబుతుంది; ఇక్కడ దినవృత్తాంతాలు ‘నాలుగు వేల’ అని చెబుతోంది.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: సొలొమోనుకు ... ఉండేవారు
  rationale: היה + ל అనే హెబ్రీ స్వామ్య/ఉనికి నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אַרְבַּעַת אֲלָפִים
  choice: నాలుగు వేల
  rationale: మూలంలోని సంఖ్యను నేరుగా అనువదిస్తుంది.
- source_word: אֻרְיוֹת
  choice: కొట్టాలు
  rationale: గుర్రాలను ఉంచే విడివిడి స్థలాలు లేదా శాల విభాగాలను సూచించే మూలపదానికి స్పష్టమైన తెలుగు సమానం; ‘శాలలు’ అనే విస్తృత భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: סוּסִים וּמַרְכָּבוֹת
  choice: గుర్రాలు, రథాల కోసం
  rationale: మూలంలోని రెండు నామవాచకాలనూ నిలుపుతూ, ఆ కొట్టాల ఉపయోగాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף פָּרָשִׁים
  choice: పన్నెండు వేల మంది గుర్రపు రౌతులు
  rationale: పָּרָשִׁים అంటే గుర్రాలపై స్వారీ చేసే యోధులు; ‘గుర్రపు రౌతులు’ ప్రత్యక్షమైన, సందర్భోచితమైన తెలుగు పదబంధం.
- source_word: וַיַּנִּיחֵם
  choice: అతడు వారిని ... ఉంచాడు
  rationale: సైనిక బలగాలను నిర్ణీత ప్రదేశాల్లో నియమించి ఉంచడాన్ని సహజంగా వ్యక్తం చేస్తుంది; సందర్భం వల్ల గుర్రపు రౌతులనే సూచించే వ్యక్తివాచక రూపం వాడబడింది.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: రథాల పట్టణాల్లో
  rationale: రథ దళాలకు కేటాయించబడిన పట్టణాలనే హెబ్రీ సమాసార్థాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וְעִם הַמֶּלֶךְ בִּירוּשָׁלִָם
  choice: రాజుతోపాటు యెరూషలేములోనూ
  rationale: ‘రాజుతో’ అనే మూలంలోని మూడవ పురుష ప్రస్తావనను వ్యాఖ్యానించకుండా యథాతథంగా నిలుపుతుంది.
