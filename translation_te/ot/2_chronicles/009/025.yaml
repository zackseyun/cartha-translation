translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘రథాల పట్టణాలు’ వంటి చారిత్రక పదబంధాన్ని సరళీకరించకుండా నిలిపాం. సంఖ్య విషయంలో మసొరేటిక్ పాఠాన్ని అనుసరించి, సమాంతర వచనంలోని భేదాన్ని పాదసూచికలో తెలిపాం.
