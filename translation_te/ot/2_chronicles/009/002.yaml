translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. సందర్భార్థం కోసం ‘ప్రశ్నలు,’ ‘జవాబు చెప్పాడు,’ ‘వివరించని’ అని అనువదించి, హీబ్రూ పదాల మరింత అక్షరార్థమైన ప్రత్యామ్నాయాలను పాదసూచికల్లో నిలిపాం.
