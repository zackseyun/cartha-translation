id: 2CH.9.2
reference: 2 Chronicles 9:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּגֶּד לָ֥/הּ שְׁלֹמֹ֖ה אֶת כָּל דְּבָרֶ֑י/הָ וְ/לֹֽא נֶעְלַ֤ם דָּבָר֙ מִ/שְּׁלֹמֹ֔ה אֲשֶׁ֧ר לֹ֦א הִגִּ֖יד לָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/002.yaml
  text: And Solomon answered all her questions[b][a]; nothing was hidden from Solomon that he did not explain to her.
translation:
  language: te
  text: సొలొమోను ఆమె ప్రశ్నలన్నిటికీ జవాబు చెప్పాడు[a]; అతడు ఆమెకు వివరించని విషయం ఏదీ సొలొమోనుకు మరుగుగా లేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సొలొమోను ఆమె విషయాలన్నిటినీ ఆమెకు చెప్పాడు”; హీబ్రూ అక్షరార్థంగా, “ఆమె మాటలన్నిటినీ.”
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, “సొలొమోను ఆమెకు చెప్పని విషయం ఏదీ అతనికి మరుగుగా లేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: జవాబు చెప్పాడు
  rationale: נגד అనే క్రియకు ప్రాథమికంగా ‘చెప్పు/తెలియజేయు’ అనే అర్థం ఉంది. అయితే ముందటి వచనంలో రాణి కఠినమైన ప్రశ్నలతో సొలొమోనును పరీక్షించిన సందర్భం ఉన్నందున, ఇక్కడ ‘జవాబు చెప్పాడు’ అనేది సహజమైన సందర్భార్థాన్ని అందిస్తుంది.
- source_word: אֶת כָּל דְּבָרֶיהָ
  choice: ఆమె ప్రశ్నలన్నిటికీ
  rationale: דבר అనే పదం ‘మాట,’ ‘విషయం,’ ‘సంగతి’ అని అర్థమివ్వగలదు. సందర్భంలో రాణి ముందుంచిన కఠిన ప్రశ్నలు ఉద్దేశించబడ్డాయి; మూలంలోని విస్తృత అర్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: נֶעְלַם
  choice: మరుగుగా లేదు
  rationale: עלם యొక్క నిఫాల్ రూపం ‘మరుగై ఉండడం’ లేదా ‘దాచబడి ఉండడం’ను సూచిస్తుంది. ‘మరుగుగా లేదు’ అనే పదబంధం ఆ రూపకాన్ని తెలుగులో నిలుపుతుంది.
- source_word: דָּבָר
  choice: విషయం ఏదీ
  rationale: నిరాకరణతో వచ్చిన ఏకవచన నామవాచకం ‘ఏ విషయమూ లేదు’ అనే సమగ్ర అర్థాన్ని ఇస్తుంది.
- source_word: אֲשֶׁר לֹא הִגִּיד לָהּ
  choice: అతడు ఆమెకు వివరించని
  rationale: మూలంలో మళ్లీ נגד క్రియే ఉన్నప్పటికీ, కఠిన ప్రశ్నలకు సమాధానమిచ్చే సందర్భంలో ‘వివరించు’ సహజంగా ఉంటుంది. మరింత అక్షరార్థమైన ‘ఆమెకు చెప్పని’ రూపం పాదసూచికలో ఇవ్వబడింది.
