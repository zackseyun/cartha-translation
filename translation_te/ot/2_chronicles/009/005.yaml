id: 2CH.9.5
reference: 2 Chronicles 9:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל הַ/מֶּ֔לֶךְ אֱמֶת֙ הַ/דָּבָ֔ר אֲשֶׁ֥ר שָׁמַ֖עְתִּי בְּ/אַרְצִ֑/י עַל דְּבָרֶ֖י/ךָ וְ/עַל חָכְמָתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/005.yaml
  text: Then she said to the king[a], “The report that I heard in my own land about your words and your wisdom was true.”
translation:
  language: te
  text: 'అప్పుడు ఆమె రాజుతో ఇలా అంది: “నీ విషయాల[a] గురించీ, నీ జ్ఞానం గురించీ నా దేశంలో నేను విన్న వార్త నిజమే.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ మాటలు/వ్యవహారాలు మరియు నీ జ్ఞానం గురించి నా దేశంలో నేను విన్న విషయం నిజమే.”
    reason: దְּבָרֶיךָకు ‘మాటలు,’ ‘విషయాలు,’ లేదా ‘వ్యవహారాలు’ అనే అర్థసంభావ్యత ఉంది; సందర్భానికి తగిన విస్తృతిని పాదటిప్పణి ద్వారా కాపాడుతుంది.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అప్పుడు ఆమె ... అంది
  rationale: వయ్యిక్తోల్ కథనంలోని తదుపరి సంఘటనను సూచిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా వరుస భావాన్ని తెలియజేస్తుంది.
- source_word: אֶל־הַמֶּלֶךְ
  choice: రాజుతో
  rationale: మాట ఎవరిని ఉద్దేశించి చెప్పబడిందో సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֱמֶת הַדָּבָר
  choice: విన్న వార్త నిజమే
  rationale: హీబ్రూ పదబంధం విన్న సమాచారం నిజమని ధృవీకరిస్తుంది. సందర్భంలో דָּבָר‌కు ‘వార్త’ సహజమైన అర్థం; ‘నిజమే’ మూలంలోని బలమైన ధృవీకరణను నిలుపుతుంది.
- source_word: אֲשֶׁר שָׁמַעְתִּי
  choice: నేను విన్న
  rationale: సంబంధ వాక్యాన్ని సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בְּאַרְצִי
  choice: నా దేశంలో
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయాన్ని ‘నా’గా నిలుపుతూ, אֶרֶץ‌ను ఈ సందర్భంలో సాధారణ పాఠకునికి సహజమైన ‘దేశం’గా అనువదిస్తుంది.
- source_word: עַל־דְּבָרֶיךָ
  choice: నీ మాటల గురించి
  rationale: דְּבָרֶיךָలోని ‘మాటలు/విషయాలు/వ్యవహారాలు’ అనే అర్థ విస్తృతిలో నేరమైన ‘నీ మాటలు’ను ఎంచుకుని మూలంలోని పదసంబంధాన్ని కాపాడుతుంది; సందర్భంలో రాజు పలుకులు, విషయాలు అనే విస్తృత భావం ఉండవచ్చు.
- source_word: וְעַל־חָכְמָתֶךָ
  choice: నీ జ్ఞానం గురించి
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో కూడిన ‘జ్ఞానం’ అనే కేంద్ర భావాన్ని నేరుగా నిలుపుతుంది.
