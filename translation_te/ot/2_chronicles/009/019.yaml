  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన వర్ణనా శైలి వాడబడింది. మూలంలోని స్థల అమరికకు సంబంధించిన స్వల్ప అస్పష్టతను పాదసూచికలో నిలిపాం.
