  text: וּ/שְׁנֵ֧ים עָשָׂ֣ר אֲרָי֗וֹת עֹמְדִ֥ים שָׁ֛ם עַל שֵׁ֥שׁ הַֽ/מַּעֲל֖וֹת מִ/זֶּ֣ה וּ/מִ/זֶּ֑ה לֹא נַעֲשָׂ֥ה כֵ֖ן לְ/כָל מַמְלָכָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/019.yaml
  text: And twelve lions were standing there on the six steps[a], on this side and on that side. Nothing like it had been made for any kingdom.
translation:
  language: te
  text: ఆరు మెట్లపై ఇటువైపునా అటువైపునా పన్నెండు సింహాలు నిలిచి ఉన్నాయి.[a] ఏ రాజ్యానికీ ఇలాంటిది చేయబడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆరు మెట్లపై, ఒక్కో మెట్టుకు ఇరువైపులా ఒక్కోటి చొప్పున, పన్నెండు సింహాలు నిలిచి ఉన్నాయి.”
    reason: మూలంలోని మొత్తం సంఖ్యతో పాటు రెండు వైపుల అమరికను స్పష్టంగా చూపించే ప్రత్యామ్నాయ పదక్రమం.
lexical_decisions:
- source_word: וּשְׁנֵים עָשָׂר אֲרָיוֹת
  choice: పన్నెండు సింహాలు
  rationale: సింహాల ప్రతిమలను సూచించే సరళమైన బహువచన పదబంధం; తెలుగు వాక్య నిర్మాణంలో సంధానార్థం విడిగా అనువదించాల్సిన అవసరం లేదు.
- source_word: עֹמְדִים שָׁם
  choice: నిలిచి ఉన్నాయి
  rationale: హీబ్రూ కృదంతంలోని దృశ్యాత్మక, స్థితి వర్ణనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ‘అక్కడ’ అనేది సందర్భంలో అంతర్లీనంగా ఉండటంతో అనవసర పునరుక్తిని నివారించింది.
- source_word: עַל שֵׁשׁ הַמַּעֲלוֹת
  choice: ఆరు మెట్ల మీద
  rationale: సింహాలు సింహాసనానికి దారితీసే ఆరు మెట్లపై అమర్చబడి ఉన్నాయనే ప్రత్యక్ష స్థలార్థాన్ని అనుసరిస్తుంది.
- source_word: מִזֶּה וּמִזֶּה
  choice: ఇటువైపున అటువైపున
  rationale: మెట్లకు రెండు వైపులా ఉన్న సమమితి అమరికను సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא נַעֲשָׂה כֵן
  choice: ఇలాంటిది చేయబడలేదు
  rationale: నిష్క్రియ నిర్మాణాన్నీ, పోల్చలేని ప్రత్యేకతను తెలిపే כֵן భావాన్నీ నిలుపుతుంది.
- source_word: לְכָל מַמְלָכָה
  choice: ఏ రాజ్యం కోసమూ
  rationale: ఏ రాజ్యానికీ ఇలాంటి నిర్మాణం చేయబడలేదనే విస్తృత పోలికను వ్యక్తం చేస్తుంది.
