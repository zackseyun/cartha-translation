id: 2CH.9.6
reference: 2 Chronicles 9:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹֽא הֶאֱמַ֣נְתִּי לְ/דִבְרֵי/הֶ֗ם עַ֤ד אֲשֶׁר בָּ֨אתִי֙ וַ/תִּרְאֶ֣ינָה עֵינַ֔/י וְ/הִנֵּה֙ לֹ֣א הֻגַּד לִ֔/י חֲצִ֖י מַרְבִּ֣ית חָכְמָתֶ֑/ךָ יָסַ֕פְתָּ עַל הַ/שְּׁמוּעָ֖ה אֲשֶׁ֥ר שָׁמָֽעְתִּי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/006.yaml
  text: But I did not believe their words until I came and my own eyes saw it[a]; and behold, not even half of the greatness of your wisdom had been told to me[b]. You have surpassed the report that I heard.
translation:
  language: te
  text: కానీ నేను వచ్చి నా కళ్లతో చూసే వరకు వారి మాటలను నమ్మలేదు. ఇదిగో, నీ జ్ఞాన సమృద్ధిలో సగం కూడా నాకు తెలియజేయబడలేదు[a]. నేను విన్న నివేదికకన్నా నీవు ఎంతో మిన్నగా ఉన్నావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ జ్ఞాన గొప్పతనంలో సగం కూడా.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నేను విన్న నివేదికను నీవు మించిపోయావు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: నమ్మలేదు
  rationale: ఇక్కడ אמן హిఫీల్ రూపం విన్న మాటలను నిజమైనవిగా అంగీకరించడాన్ని సూచిస్తుంది; వ్యక్తిగతంగా ఆధారపడటం అనే భావం కంటే ‘నమ్మడం’ సందర్భానికి సరిపోతుంది.
- source_word: לְדִבְרֵיהֶם
  choice: వారి మాటలను
  rationale: דבר యొక్క ప్రాథమిక అర్థాన్ని నిలుపుతూ, ఇతరులు చెప్పిన సమాచారాన్ని సహజంగా సూచిస్తుంది.
- source_word: וַתִּרְאֶינָה עֵינַי
  choice: నా కళ్లతో చూసే వరకు
  rationale: హీబ్రూ వాక్యం అక్షరార్థంగా ‘నా కళ్లే చూశాయి’ అని ఉంది; తెలుగు నుడికారంలో ‘నా కళ్లతో చూశాను’ ప్రత్యక్షంగా నిర్ధారించుకున్న భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: הִנֵּה వ్యక్తపరచే ఆకస్మిక గమనికను, ఆశ్చర్యాన్ని ‘ఇదిగో’ నిలుపుతుంది.
- source_word: מַרְבִּית חָכְמָתֶךָ
  choice: నీ జ్ఞాన సమృద్ధి
  rationale: מַרְבִּית పరిమాణం లేదా విస్తారాన్ని సూచిస్తుంది. ‘జ్ఞాన సమృద్ధి’ ఆ భావాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో అందిస్తుంది; ‘జ్ఞాన గొప్పతనం’ కూడా సాధ్యమే.
- source_word: הֻגַּד לִי
  choice: నాకు తెలియజేయబడలేదు
  rationale: נגד యొక్క హొఫాల్ రూపంలోని కర్మణి భావాన్ని నిలుపుతుంది; ఆమెకు ముందుగా చెప్పబడిన సమాచారాన్ని సూచిస్తుంది.
- source_word: יָסַפְתָּ עַל
  choice: నీవు మించిపోయావు
  rationale: ఈ సందర్భంలో יסף + על ముందుగా విన్న నివేదికకంటే అధికంగా ఉండటాన్ని సూచిస్తుంది; ‘మించిపోయావు’ పోలికను స్పష్టంగా ఉంచుతుంది.
- source_word: הַשְּׁמוּעָה
  choice: నివేదిక
  rationale: שְׁמוּעָה విన్న సమాచారం లేదా వార్తను సూచిస్తుంది. ‘నివేదిక’ తటస్థంగా ఉంది; ‘వదంతి’లో హీబ్రూలో అవసరం లేని అనిశ్చిత భావం ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి ఉపయోగించబడింది. రాజును ఉద్దేశించిన ఏకవచన ‘నీ/నీవు’ హీబ్రూ మూలంలోని ఏకవచన సంబోధనను నిలుపుతుంది. మూలంలోని vivid attention marker కోసం ‘ఇదిగో’ ఉంచబడింది.
