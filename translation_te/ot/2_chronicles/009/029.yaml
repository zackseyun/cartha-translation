id: 2CH.9.29
reference: 2 Chronicles 9:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/שְׁאָר֙ דִּבְרֵ֣י שְׁלֹמֹ֔ה הָ/רִאשֹׁנִ֖ים וְ/הָ/אֲחֲרוֹנִ֑ים הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל דִּבְרֵי֙ נָתָ֣ן הַ/נָּבִ֔יא וְ/עַל נְבוּאַ֞ת אֲחִיָּ֣ה הַ/שִּֽׁילוֹנִ֗י וּ/בַ/חֲזוֹת֙ יעדי הַ/חֹזֶ֔ה עַל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/029.yaml
  text: The rest of the acts of Solomon[a], from first to last, are they not written in the records of Nathan the prophet, and in the prophecy of Ahijah the Shilonite[b], and in the visions of Iddo the seer concerning Jeroboam son of Nebat?
translation:
  language: te
  text: సొలొమోను మిగిలిన కార్యాలు, మొదటి నుండి చివరి వరకు, నాతాను ప్రవక్త వృత్తాంతంలో[a], షిలోనీయుడైన అహీయా ప్రవచనంలో, నెబాతు కుమారుడైన యెరోబాము గురించి[b] దీర్ఘదర్శి ఇద్దోకు కలిగిన దర్శనాల్లో రాయబడి ఉన్నాయి కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాతాను ప్రవక్త మాటల్లో.’ ఇక్కడి హీబ్రూ పదం మాటలను గానీ, లిఖిత వృత్తాంతాన్ని గానీ సూచించవచ్చు; ఈ సందర్భంలో అది ఒక లిఖిత మూలాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: b
    text: ‘యెరోబాము గురించి’ అనే మాటకు ‘యెరోబామును గూర్చి’ లేదా, సందర్భాన్ని బట్టి, ‘యెరోబాముకు వ్యతిరేకంగా’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר דִּבְרֵי שְׁלֹמֹה
  choice: సొలొమోను చేసిన మిగిలిన కార్యాలు
  rationale: రాజుల పాలనకు సంబంధించిన ముగింపు సూత్రంలో דִּבְרֵי అనేది మాటలకన్నా విస్తృతంగా కార్యాలు లేదా పాలనావృత్తాంతాలను సూచిస్తుంది; సహజమైన తెలుగులో వ్యక్తిగత కార్యాల భావాన్ని స్పష్టం చేయడానికి ‘చేసిన’ చేర్చబడింది.
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרוֹנִים
  choice: మొదటినుండి చివరివరకు
  rationale: సొలొమోను చరిత్ర మొత్తాన్ని సూచించే హీబ్రూ సమగ్రతా నుడికారాన్ని సహజంగా నిలుపుతుంది.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: రాయబడి ఉన్నాయి కదా?
  rationale: మూలంలోని ప్రతికూల అలంకారప్రశ్నను తెలుగులో సహజమైన ధృవీకరణాత్మక అలంకారప్రశ్నగా నిలుపుతుంది.
- source_word: עַל דִּבְרֵי נָתָן הַנָּבִיא
  choice: నాతాను ప్రవక్త వృత్తాంతంలో
  rationale: ఈ మూలగ్రంథాల జాబితాలో דִּבְרֵי అనేది లిఖిత వృత్తాంతాన్ని సూచించే అవకాశం ఎక్కువ; כתב మరియు עַל కలయికను తెలుగులో ‘వృత్తాంతంలో రాయబడి’ అని సహజంగా వ్యక్తం చేసింది.
- source_word: נְבוּאַת אֲחִיָּה הַשִּׁילוֹנִי
  choice: షిలోనీయుడైన అహీయా ప్రవచనంలో
  rationale: נְבוּאָה యొక్క ప్రత్యక్ష అర్థమైన ‘ప్రవచనం’ను, వ్యక్తి ప్రాంతీయ గుర్తింపును నిలుపుతుంది.
- source_word: וּבַחֲזוֹת יעדי הַחֹזֶה
  choice: దీర్ఘదర్శి ఇద్దోకు కలిగిన దర్శనాల్లో
  rationale: חֹזֶה అనే బిరుదును נָבִיא ‘ప్రవక్త’తో కలపకుండా ‘దీర్ఘదర్శి’గా వేరుచేసింది; חֲזוֹת యొక్క బహువచన/సామూహిక భావాన్ని ‘దర్శనాలు’గా అందించింది. WLC వ్యంజనరూపాన్ని సంప్రదాయ మసొరేటిక్ పఠనం ఇద్దోతో అనుసంధానించి లిప్యంతరీకరించింది.
- source_word: עַל יָרָבְעָם בֶּן נְבָט
  choice: నెబాతు కుమారుడైన యెరోబాము గురించి
  rationale: మూలాధారాల సూచన సందర్భంలో עַל ప్రధానంగా ‘గురించి’ అనే విషయార్థాన్ని ఇస్తుంది; ప్రతికూలమైన ‘వ్యతిరేకంగా’ అనే సాధ్యార్థాన్ని పాదటిప్పణిలో నిలిపింది.
theological_decisions:
- issue: ఇద్దో దర్శనాలు యెరోబామును కేవలం విషయంగా తీసుకున్నవా, లేక అతనికి వ్యతిరేకంగా పలికినవా?
  choice: యెరోబాము గురించి
  alternative: యెరోబాముకు వ్యతిరేకంగా
  rationale: עַל రెండూ అనుమతించినప్పటికీ, ఇక్కడ గ్రంథమూలాల జాబితా దర్శనాల విషయాన్ని గుర్తిస్తున్నందున ‘గురించి’ సందర్భానికి బాగా సరిపోతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచడం ద్వారా అస్పష్టతను పూర్తిగా తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన చారిత్రక-గ్రంథసూచిక శైలిని వాడింది. ‘ప్రవక్త’ మరియు ‘దీర్ఘదర్శి’ అనే వేర్వేరు హీబ్రూ బిరుదుల భేదాన్ని కాపాడింది. ప్రతి పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
