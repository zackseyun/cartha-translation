  source_fidelity: మూల హీబ్రూ వాక్యంలోని ప్రధాన అంశాలు—షెబా రాణి విన్న వార్త/కీర్తి, చిక్కు ప్రశ్నలతో సొలొమోనును పరీక్షించాలనే ఉద్దేశం, యెరూషలేముకు రాక, గొప్ప పరివారం, సుగంధ ద్రవ్యాలు, పుష్కలమైన బంగారం, విలువైన రాళ్లు, మరియు ఆమె హృదయంలో ఉన్నదంతా అతనితో చర్చించడం—అన్నీ ప్రతిబింబించబడ్డాయి. అయితే ఒంటెలకు ‘మోసుకొచ్చే’ అనడం మూలంలోని ‘మోస్తున్న’ వర్ణన కంటే కొంత అదనపు దిశాభావాన్ని ఇస్తుంది.
