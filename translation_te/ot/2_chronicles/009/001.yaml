translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలో లేని ప్రారంభ కాలసూచక పదాన్ని చేర్చలేదు. పొడవైన హీబ్రూ వాక్యాన్ని తెలుగు పఠనసౌలభ్యం కోసం మూడు వాక్యాలుగా విభజించినా సమాచార క్రమాన్ని కాపాడాం.
