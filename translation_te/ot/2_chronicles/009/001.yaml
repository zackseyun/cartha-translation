id: 2CH.9.1
reference: 2 Chronicles 9:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מַֽלְכַּת שְׁבָ֗א שָֽׁמְעָה֮ אֶת שֵׁ֣מַע שְׁלֹמֹה֒ וַ/תָּב֣וֹא לְ/נַסּוֹת֩ אֶת שְׁלֹמֹ֨ה בְ/חִיד֜וֹת בִּ/ירֽוּשָׁלִַ֗ם בְּ/חַ֣יִל כָּבֵ֣ד מְאֹ֡ד וּ֠/גְמַלִּים נֹשְׂאִ֨ים בְּשָׂמִ֧ים וְ/זָהָ֛ב לָ/רֹ֖ב וְ/אֶ֣בֶן יְקָרָ֑ה וַ/תָּבוֹא֙ אֶל שְׁלֹמֹ֔ה וַ/תְּדַבֵּ֣ר עִמּ֔/וֹ אֵ֛ת כָּל אֲשֶׁ֥ר הָיָ֖ה עִם לְבָבָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/001.yaml
  text: The queen of Sheba heard of Solomon’s fame[a], and she came to Jerusalem to test Solomon with riddles, with a very great retinue and camels carrying spices, gold in abundance, and precious stones. When she came to Solomon[c][b], she spoke with him about all that was in her heart.
translation:
  language: te
  text: షెబా దేశపు రాణి సొలొమోను కీర్తి[a] గురించి విని, చిక్కు ప్రశ్నలతో[b] అతణ్ణి పరీక్షించడానికి యెరూషలేముకు వచ్చింది. ఆమె వెంట చాలా పెద్ద పరివారం ఉంది; సుగంధ ద్రవ్యాలు, పుష్కలంగా బంగారం, విలువైన రాళ్లు మోస్తున్న ఒంటెలు కూడా ఉన్నాయి. ఆమె సొలొమోను దగ్గరికి వచ్చి, తన హృదయంలో ఉన్నదంతా[c] అతనితో గురించి మాట్లాడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సొలొమోను గురించిన వార్తను.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పొడుపుకథలతో.”
    reason: lexical_alternative
  - marker: c
    text: “తన హృదయంలో ఉన్నదంతా” అనేది ఆమె మనసులోని ఆలోచనలు, ప్రశ్నలు, ఆందోళనలన్నిటినీ సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: שֵׁמַע
  choice: కీర్తి
  rationale: సొలొమోను గురించి వ్యాపించిన వార్త లేదా పేరు అనే భావాన్ని సందర్భంలో సహజంగా వ్యక్తపరుస్తుంది; ‘వార్త’ కూడా సాధ్యమైన అర్థం.
- source_word: לְנַסּוֹת
  choice: పరీక్షించడానికి
  rationale: సొలొమోను జ్ఞానాన్ని ప్రశ్నల ద్వారా పరీక్షించడం అనే ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְחִידוֹת
  choice: చిక్కు ప్రశ్నలతో
  rationale: חידות అనే పదం పొడుపుకథలు, నిగూఢ ప్రశ్నలు, చిక్కు సమస్యలను సూచించగలదు. ఆధునిక తెలుగు సందర్భంలో ‘చిక్కు ప్రశ్నలు’ సహజంగా ఉండి మూలంలోని విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: בִּירוּשָׁלִַם
  choice: యెరూషలేముకు
  rationale: బְ అనే విభక్తి అక్షరార్థంగా ‘లో’ అయినా, ‘వచ్చింది’ అనే గమన క్రియతో గమ్యస్థానాన్ని తెలుగులో ‘యెరూషలేముకు’ అని సహజంగా వ్యక్తపరుస్తారు.
- source_word: בְּחַיִל כָּבֵד מְאֹד
  choice: చాలా పెద్ద పరివారం
  rationale: חיל బలం, సైన్యం, సంపద లేదా బృందం అని అర్థమివ్వగలదు. ఒంటెలు, కానుకలతో కూడిన రాజయాత్ర సందర్భంలో పెద్ద పరివారం అత్యంత సహజం; సైనిక దళమని అనవసరంగా నిర్ధారించదు.
- source_word: בְּשָׂמִים
  choice: సుగంధ ద్రవ్యాలు
  rationale: రాజ కానుకల సందర్భంలోని పరిమళభరిత ద్రవ్యాలు లేదా సుగంధ పదార్థాలను సులభంగా అర్థమయ్యే తెలుగులో తెలియజేస్తుంది.
- source_word: לָרֹב
  choice: విస్తారమైన
  rationale: బంగారం అత్యధిక పరిమాణంలో ఉందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֶבֶן יְקָרָה
  choice: విలువైన రాళ్లు
  rationale: హీబ్రూలో ఏకవచన రూపం ఉన్నా ఇది సమూహార్థకంగా వాడబడింది; తెలుగులో బహువచనం సహజం.
- source_word: וַתְּדַבֵּר עִמּוֹ
  choice: అతనితో మాట్లాడింది
  rationale: עִם తో కూడిన דבר పరస్పర సంభాషణ భావాన్ని కలిగిస్తుంది; ‘అతనితో మాట్లాడింది’ ఆ సూక్ష్మతను నిలుపుతుంది.
- source_word: אֵת כָּל אֲשֶׁר הָיָה עִם לְבָבָהּ
  choice: తన హృదయంలో ఉన్నదంతా
  rationale: ఆమె ఆలోచనలు, ప్రశ్నలు, ఆందోళనలన్నిటినీ సూచించే హీబ్రూ హృదయ-నుడికారాన్ని యథాతథ భావంతో నిలుపుతుంది.
