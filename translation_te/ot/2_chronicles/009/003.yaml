translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున చివర కామా ఉంచబడింది. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
