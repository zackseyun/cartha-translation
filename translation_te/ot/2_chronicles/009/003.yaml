source:
  edition: WLC
  text: וַ/תֵּ֨רֶא֙ מַֽלְכַּת שְׁבָ֔א אֵ֖ת חָכְמַ֣ת שְׁלֹמֹ֑ה וְ/הַ/בַּ֖יִת אֲשֶׁ֥ר בָּנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/003.yaml
  text: When the queen of Sheba saw Solomon’s wisdom and the house that he had built,[a]
translation:
  language: te
  text: షెబా రాణి సొలొమోను జ్ఞానాన్ని, అతడు నిర్మించిన భవనాన్ని[a] చూసినప్పుడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు నిర్మించిన రాజభవనాన్ని.” హీబ్రూలో “ఇల్లు” అని ఉంది; ఈ రాజసందర్భంలో అది ప్రత్యేకంగా సొలొమోను రాజభవన సముదాయాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: చూసినప్పుడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; తరువాతి వచనంలో కొనసాగే వాక్యానికి అనుగుణంగా సందర్భంలోని కాలసంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מַלְכַּת שְׁבָא
  choice: షెబా రాణి
  rationale: ఇది రాజ్యస్థలాన్ని సూచించే నిర్మాణ సంబంధ పదబంధం; ఆధునిక తెలుగులో సహజంగా 'షెబా రాణి' అని అనువదించబడుతుంది.
- source_word: אֵת
  choice: '[విడిగా అనువదించలేదు]'
  rationale: ఇది ప్రత్యక్ష కర్మ సూచిక; తెలుగులో దీనికి విడిగా సమాన పదం అవసరం లేదు, కర్మరూపమైన '-ని/-ాన్ని' ద్వారా దాని వ్యాకరణ విధి వ్యక్తమవుతుంది.
- source_word: חָכְמַת שְׁלֹמֹה
  choice: సొలొమోను జ్ఞానాన్ని
  rationale: నిర్మాణ సంబంధాన్ని తెలుగులో సహజమైన స్వామ్యరూపంతో అందించాం; 'జ్ఞానం' ఇక్కడ కేవలం సమాచారాన్ని కాక వివేకం, అంతర్దృష్టిని కూడా సూచిస్తుంది.
- source_word: וְהַבַּיִת
  choice: మందిరాన్ని
  rationale: בַּיִת యొక్క ప్రాథమిక అర్థం 'ఇల్లు/గృహం'. రాజసందర్భంలో ఇది సొలొమోను రాజభవన సముదాయాన్ని సూచించవచ్చు. తెలుగులో గౌరవప్రదమైన భవనాన్ని సూచించేందుకు 'మందిరం' వాడి, నిర్దిష్టమైన 'రాజభవనం' అనే అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֲשֶׁר בָּנָה
  choice: అతడు కట్టించిన
  rationale: ఈ సంబంధ ఉపవాక్యం ముందున్న భవనాన్ని విశేషిస్తుంది. రాజు స్వయంగా కట్టడం కంటే తన ఆధ్వర్యంలో నిర్మింపజేయడం అనే సహజ భావాన్ని 'కట్టించిన' తెలియజేస్తుంది; చర్య ఆమె చూడటానికి ముందే పూర్తయింది.
