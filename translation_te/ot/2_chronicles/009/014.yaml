  language: en
  yaml_path: translation/ot/2_chronicles/009/014.yaml
  text: Besides what the traders and merchants brought, all the kings of Arabia and the governors of the land were bringing gold and silver to Solomon.
translation:
  language: te
  text: వర్తకులు, వ్యాపారులు తీసుకువచ్చిన వాటికి అదనంగా, అరేబియా రాజులందరూ, దేశంలోని పరిపాలకులూ సొలొమోనుకు బంగారాన్నీ వెండినీ తీసుకువచ్చేవారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי הַתָּרִים
  choice: వర్తకులు
  rationale: ఈ పదబంధం వ్యాపార నిమిత్తం సంచరించే వర్తకులను సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా, తదుపరి పదానికి భిన్నంగా వినిపించే రూపం.
- source_word: הַסֹּחֲרִים
  choice: వ్యాపారులు
  rationale: వాణిజ్యం చేసే వారిని సూచించే సాధారణ ఆధునిక తెలుగు పదం; సమీపార్థకమైనప్పటికీ మూలంలోని రెండవ వర్గాన్ని నిలుపుతుంది.
- source_word: מַלְכֵי עֲרַב
  choice: అరేబియా రాజులు
  rationale: עֲרַבను ఇక్కడ భౌగోళిక/జనసమూహ నామంగా తీసుకుని, పాఠకులకు స్పష్టమైన ప్రాచుర్య రూపం వాడబడింది.
- source_word: פַּחוֹת הָאָרֶץ
  choice: దేశంలోని అధిపతులు
  rationale: פַּחוֹת పరిపాలనా అధికారులను సూచిస్తుంది; ఖచ్చితమైన అధికార హోదా సందర్భంలో నిర్ధారించలేనందున విస్తృతమైన ‘అధిపతులు’ ఎంచుకోబడింది.
- source_word: מְבִיאִים
  choice: తీసుకొస్తూ ఉండేవారు
  rationale: రాజులు, అధిపతులకు సంబంధించిన హిబ్రూ కృదంతం పునరావృతంగా లేదా కొనసాగుతూ జరిగిన సమర్పణను సూచించగలదు; తెలుగు అలవాటు క్రియారూపం దాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక వర్ణన. మూలంలోని వర్తకుల రెండు సమీపార్థక వర్గాలనూ విడిగా నిలిపి, అనవసర వ్యాఖ్యానాన్ని జోడించలేదు.
