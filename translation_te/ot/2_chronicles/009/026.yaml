source:
  edition: WLC
  text: וַ/יְהִ֥י מוֹשֵׁ֖ל בְּ/כָל הַ/מְּלָכִ֑ים מִן הַ/נָּהָר֙ וְ/עַד אֶ֣רֶץ פְּלִשְׁתִּ֔ים וְ/עַ֖ד גְּב֥וּל מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/026.yaml
  text: And he ruled over all the kings from the River to the land of the Philistines and to the border of Egypt[a].
translation:
  language: te
  text: అతడు ఆ నది మొదలుకొని ఫిలిష్తీయుల దేశం వరకు, ఐగుప్తు సరిహద్దు వరకు ఉన్న రాజులందరి మీద పరిపాలించాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఆ నది” అనేది బహుశా యూఫ్రటీసు నదిని సూచిస్తుంది; హీబ్రూ బైబిల్లో ఇది సాధారణంగా కనిపించే భౌగోళిక నామప్రయోగం.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי מוֹשֵׁל
  choice: పరిపాలించాడు
  rationale: היה తో కూడిన משל కృదంతం గతకాలంలో కొనసాగిన పాలనాస్థితిని సూచిస్తుంది. తెలుగులో ‘పరిపాలించాడు’ సహజంగా ఉండి, రాజకీయ ఆధిపత్య భావాన్ని నిలుపుతుంది.
- source_word: בְּכָל הַמְּלָכִים
  choice: రాజులందరి మీద
  rationale: משל తో వచ్చిన ב ఇక్కడ పాలనకు లోబడినవారిని సూచిస్తుంది. ‘మీద’ అనే ప్రయోగం ఇతర రాజులపై ఉన్న ఆధిపత్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִן הַנָּהָר
  choice: ఆ నది మొదలుకొని
  rationale: మూలంలోని నిర్దిష్ట రూపమైన ‘నది’ని ప్రధాన వాక్యంలో అలాగే ఉంచి, అది యూఫ్రటీసును సూచించే అవకాశం ఉందని పాదసూచికలో వివరిస్తుంది.
- source_word: וְעַד אֶרֶץ פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల దేశం వరకు
  rationale: ఇది భౌగోళిక విస్తృతి యొక్క ఒక హద్దును సూచిస్తుంది. ‘ఫిలిష్తీయుల దేశం’ మూలపదబంధానికి సమీపంగా, ఆధునిక పాఠకులకు స్పష్టంగా ఉంది.
- source_word: וְעַד גְּבוּל מִצְרָיִם
  choice: ఐగుప్తు సరిహద్దు వరకు
  rationale: גְּבוּל అనే పదంలోని సరిహద్దు లేదా హద్దు భావాన్ని నేరుగా నిలుపుతూ, దక్షిణపడమర వైపు విస్తృతిని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని భౌగోళిక క్రమం, రాజకీయ ఆధిపత్య భావం నిలుపబడ్డాయి; ‘ఆ నది’ అనే మూలంలోని కొంత అస్పష్టమైన సూచనను ప్రధాన వాక్యంలో ఉంచి పాదసూచికలో మాత్రమే వివరణ ఇచ్చాం.
