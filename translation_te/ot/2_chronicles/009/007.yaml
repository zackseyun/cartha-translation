translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రశంసా శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని రెండు సమాంతర ధన్యవచనాలను ఆశ్చర్యార్థకాలతో స్పష్టంగా నిలిపాం; రాజును సంబోధించే మూలంలోని ఏకవచన ద్వితీయ పురుష రూపాన్ని ‘నీ’గా సంరక్షించాం.
