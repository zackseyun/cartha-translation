source:
  edition: WLC
  text: אַשְׁרֵ֣י אֲנָשֶׁ֔י/ךָ וְ/אַשְׁרֵ֖י עֲבָדֶ֣י/ךָ אֵ֑לֶּה הָ/עֹמְדִ֤ים לְ/פָנֶ֨י/ךָ֙ תָּמִ֔יד וְ/שֹׁמְעִ֖ים אֶת חָכְמָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/007.yaml
  text: Blessed are your men[b][a], and blessed are these your servants who stand before you continually and hear your wisdom.
translation:
  language: te
  text: నీ మనుషులు ధన్యులు[a]! నీ సమక్షంలో ఎల్లప్పుడూ నిలిచి[b], నీ జ్ఞానాన్ని వినే ఈ నీ సేవకులు ధన్యులు!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ మనుషులు సంతోషవంతులు’ లేదా ‘భాగ్యవంతులు.’ హీబ్రూ పదం ధన్యమైన స్థితితో పాటు సంతోషకరమైన లేదా భాగ్యవంతమైన స్థితినీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘నీ సమక్షంలో నిలిచి’ అనేది రాజు సన్నిధిలో హాజరై అతనికి సేవ చేయడాన్ని సూచించే రాజసభ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: ధన్యులు
  rationale: ఈ పదం ధన్యమైన, సంతోషకరమైన లేదా భాగ్యవంతమైన స్థితిని సూచిస్తుంది. రాజసంబంధమైన ప్రశంసలోని గంభీరతను నిలుపుతూ తెలుగులో సహజంగా ఉండేందుకు ‘ధన్యులు’ అని అనువదించాం.
- source_word: אֲנָשֶׁיךָ
  choice: నీ మనుషులు
  rationale: אֲנָשִׁים సాధారణంగా ‘మనుషులు’ లేదా ‘పురుషులు’ అని అర్థం. రాజసభ సందర్భంలో వీరు సొలొమోను పరివారంలోని పురుషులు లేదా అధికారులు కావచ్చు; అయితే మూలంలోని సాధారణ పదాన్ని విస్తరించకుండా ‘నీ మనుషులు’ అని ఉంచాం.
- source_word: עֲבָדֶיךָ
  choice: నీ సేవకులు
  rationale: עֶבֶד అనే పదం దాసుడిని లేదా సేవకుడిని సూచించగలదు. ఇక్కడ బానిసత్వ స్థితికన్నా రాజసభ సేవ ప్రధానంగా ఉన్నందున ‘సేవకులు’ సందర్భోచితం.
- source_word: אֵלֶּה
  choice: ఈ
  rationale: మాట్లాడుతున్న వ్యక్తి ఎదుట ఉన్న నిర్దిష్ట సేవకులను సూచించే హీబ్రూ నిర్దేశక సర్వనామ బలాన్ని ‘ఈ’ నిలుపుతుంది.
- source_word: הָעֹמְדִים לְפָנֶיךָ
  choice: నీ సమక్షంలో ... నిలిచి
  rationale: అక్షరార్థంగా ‘నీ ఎదుట నిలిచేవారు.’ ఇది రాజు సమక్షంలో హాజరై సేవ చేయడాన్ని సూచించే రాజసభ నుడికారం. మూలంలోని దృశ్యరూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని సందర్భార్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: תָּמִיד
  choice: ఎల్లప్పుడూ
  rationale: క్రమంగా కొనసాగుతున్న రాజసభ హాజరును సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఎల్లప్పుడూ’ సహజంగా, గంభీరంగా ఉంది.
- source_word: וְשֹׁמְעִים
  choice: వినే
  rationale: שׁמע వినడం లేదా శ్రద్ధగా ఆలకించడం అనే అర్థాలను ఇస్తుంది. ‘వినే’ మూలానికి సన్నిహితంగా ఉండి సందర్భంలో శ్రద్ధతో వినడాన్ని సహజంగా సూచిస్తుంది.
- source_word: חָכְמָתֶךָ
  choice: నీ జ్ఞానాన్ని
  rationale: ఈ నామవాచకం రాజుకు చెందినదిగా, అతని మాటల్లో వ్యక్తమయ్యేదిగా ఉన్న జ్ఞానాన్ని నేరుగా సూచిస్తుంది; అందువల్ల అదనపు వివరణను చేర్చకుండా ‘నీ జ్ఞానాన్ని’ అని అనువదించాం.
