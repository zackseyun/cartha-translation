  source_fidelity: హీబ్రూ వాక్యంలోని రెండు సమాంతరమైన אַשְׁרֵי ధన్యవచనాలు, ‘నీ మనుషులు’ మరియు ‘ఈ నీ సేవకులు’ అనే భేదం, రాజసభకు సంబంధించిన ‘నీ సమక్షంలో ... నిలిచి,’ תָּמִיד యొక్క ‘ఎల్లప్పుడూ,’ అలాగే ‘నీ జ్ఞానాన్ని వినే’ అన్న భావం నమ్మకంగా ప్రతిఫలించాయి. ‘ఈ’ అనే నిర్దేశకం సేవకులతో సహజంగా అనుసంధానించబడింది.
