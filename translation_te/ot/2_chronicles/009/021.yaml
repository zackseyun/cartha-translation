  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי אֳנִיּ֤וֹת לַ/מֶּ֨לֶךְ֙ הֹלְכ֣וֹת תַּרְשִׁ֔ישׁ עִ֖ם עַבְדֵ֣י חוּרָ֑ם אַחַת֩ לְ/שָׁל֨וֹשׁ שָׁנִ֜ים תָּב֣וֹאנָה אֳנִיּ֣וֹת תַּרְשִׁ֗ישׁ נֹֽשְׂאוֹת֙ זָהָ֣ב וָ/כֶ֔סֶף שֶׁנְהַבִּ֥ים וְ/קוֹפִ֖ים וְ/תוּכִּיִּֽים־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/021.yaml
  text: For the king had ships going to Tarshish with Huram’s servants; once every three years the ships of Tarshish would come[a], carrying gold and silver, ivory, monkeys, and peacocks.
translation:
  language: te
  text: ఎందుకంటే రాజుకు హూరాము సేవకులతో కలిసి తర్షీషుకు వెళ్లే ఓడలు ఉండేవి. ప్రతి మూడు సంవత్సరాలకు ఒకసారి తర్షీషు ఓడలు బంగారం, వెండి, ఏనుగుదంతం, కోతులు, నెమళ్లను[a] తీసుకొని వచ్చేవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చిలుకలు’; ఈ హీబ్రూ జంతుపదం యొక్క అర్థం అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి సందర్భంలో సొలొమోను సంపదకు వివరణను పరిచయం చేసే కారణార్థక సంధానంగా సహజంగా ఉంది.
- source_word: אֳנִיּוֹת לַמֶּלֶךְ
  choice: రాజుకు ... ఓడలు ఉండేవి
  rationale: హీబ్రూ దత్తివ సంబంధాన్ని తెలుగులో సహజమైన స్వామ్య నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: הֹלְכוֹת תַּרְשִׁישׁ
  choice: తర్షీషుకు వెళ్లే
  rationale: క్రియాత్మక రూపాన్ని నిలుపుతూ తర్షీషును గమ్యస్థానంగా చూపిస్తుంది.
- source_word: עִם עַבְדֵי חוּרָם
  choice: హూరాము సేవకులతో కలిసి
  rationale: రాజసేవలోని సిబ్బందిని నేరుగా సూచిస్తుంది; బానిసత్వ భావాన్ని అనవసరంగా ముందుకు తేవదు.
- source_word: אַחַת לְשָׁלֹשׁ שָׁנִים
  choice: ప్రతి మూడు సంవత్సరాలకు ఒకసారి
  rationale: పునరావృత కాలవ్యవధిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: תָּבֹאנָה
  choice: వచ్చేవి
  rationale: గతంలో అలవాటుగా పునరావృతమైన చర్యను సూచించే హీబ్రూ అసంపూర్ణ క్రియ భావాన్ని నిలుపుతుంది.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: తర్షీషు ఓడలు
  rationale: నామవాచక సమాసాన్ని సంక్షిప్తంగా నిలుపుతుంది; ఇది తర్షీషు వ్యాపార మార్గానికి సంబంధించిన ఓడలను కూడా సూచించవచ్చు.
- source_word: נֹשְׂאוֹת
  choice: తీసుకొని
  rationale: ఓడలు సరుకును మోసుకొని రావడాన్ని సహజమైన తెలుగు ప్రయోగంలో వ్యక్తం చేస్తుంది.
- source_word: זָהָב וָכֶסֶף
  choice: బంగారం, వెండి
  rationale: సరుకుల పేర్లకు నేరమైన సాధారణ తెలుగు సమానార్థాలు.
- source_word: שֶׁנְהַבִּים
  choice: దంతం
  rationale: వ్యాపార సరుకుగా ఉన్న ఏనుగు దంతానికి ప్రామాణికమైన తెలుగు పదం.
- source_word: וְקוֹפִים
  choice: కోతులు
  rationale: హీబ్రూ జంతుపదానికి సాధారణంగా అంగీకరించబడిన, ఆధునిక పాఠకులకు స్పష్టమైన సమానం.
- source_word: וְתוּכִּיִּים
  choice: నెమళ్లు
  rationale: సాంప్రదాయకంగా స్వీకరించిన అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచుతూ, పదం యొక్క అనిశ్చితిని పాదసూచికలో తెలియజేస్తుంది.
