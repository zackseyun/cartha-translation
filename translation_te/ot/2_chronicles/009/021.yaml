  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి వాడబడింది. మూలంలోని మొదటి ‘తర్షీషు’ ప్రయోగం గమ్యస్థానంగా, రెండవది ఓడల వర్గం లేదా వ్యాపార సంబంధాన్ని సూచించే నామరూపంగా వేరు చేసి అనువదించబడింది.
