base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/028.yaml
  text: And they were importing horses for Solomon from Egypt and from all the lands[a].
translation:
  language: te
  text: వారు సొలొమోను కోసం ఐగుప్తు నుండీ, అన్ని దేశాల నుండీ గుర్రాలను దిగుమతి చేసేవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “వారు సొలొమోను కోసం ఐగుప్తు నుండి, అన్ని దేశాల నుండి గుర్రాలను బయటికి తీసుకువచ్చేవారు.” హీబ్రూ క్రియకు అక్షరార్థంగా “బయటికి రప్పించడం/తీసుకురావడం” అని అర్థం; ఈ సందర్భంలో అది వాణిజ్య సరఫరాను సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מוֹצִיאִים
  choice: దిగుమతి చేసేవారు
  rationale: יצא హిఫిల్ రూపానికి అక్షరార్థంగా ‘బయటికి తీసుకువచ్చేవారు’ అనే భావం ఉంది. అయితే ఐగుప్తు మొదలైన ప్రాంతాల నుండి సొలొమోనుకు గుర్రాలను సరఫరా చేసే వాణిజ్య సందర్భంలో ‘దిగుమతి చేసేవారు’ సహజమైన ఆధునిక తెలుగు. బహువచన కర్త అనిర్దిష్టంగానే ఉంచబడింది.
- source_word: סוּסִים
  choice: గుర్రాలను
  rationale: సాధారణ బహువచన నామవాచకం; క్రియకు కర్మగా తెలుగులో ద్వితీయావిభక్తితో అనువదించబడింది.
- source_word: מִ/מִּצְרַיִם
  choice: ఐగుప్తు నుండి
  rationale: מן మూలస్థానాన్ని సూచిస్తుంది; సంప్రదాయ బైబిల్ స్థలనామమైన ‘ఐగుప్తు’ ఉపయోగించబడింది.
- source_word: לִ/שְׁלֹמֹה
  choice: సొలొమోను కోసం
  rationale: ל ఇక్కడ గమ్యాన్ని లేదా లబ్ధిదారుణ్ని సూచించవచ్చు. వాణిజ్య సరఫరా సందర్భంలో ‘కోసం’ సహజంగా ఉండి, గుర్రాలు సొలొమోనుకు సమకూర్చబడిన భావాన్ని తెలియజేస్తుంది.
- source_word: וּ/מִ/כָּל הָ/אֲרָצוֹת
  choice: అన్ని దేశాల నుండీ
  rationale: כָּל తో కూడిన אֶרֶץ బహువచనం విస్తృతమైన ప్రాంతాలు లేదా దేశాలను సూచిస్తుంది. ఆధునిక తెలుగులో ‘అన్ని దేశాలు’ స్పష్టంగా, సహజంగా ఉంది.
