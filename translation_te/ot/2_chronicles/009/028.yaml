translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని అనిర్దిష్ట బహువచన కర్తను ‘వారు’గా నిలిపి, ‘కోసం’ ద్వారా ל లోని లబ్ధిదారు భావాన్ని వ్యక్తం చేసింది.
