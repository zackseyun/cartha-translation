base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/012.yaml
  text: And King Solomon gave the queen of Sheba all that she desired[a], whatever she asked, besides what she had brought to the king. Then she turned and went to her own land[b], she and her servants.
translation:
  language: te
  text: సొలొమోను రాజు షెబా రాణి కోరుకున్నదంతా, ఆమె అడిగినదేదైనా, ఆమె రాజు వద్దకు తీసుకొచ్చినదానికి అదనంగా ఆమెకు ఇచ్చాడు.[a] తరువాత ఆమె తన సేవకులతో కలిసి వెనుదిరిగి తన దేశానికి వెళ్లింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమె రాజు వద్దకు తీసుకొచ్చినది కాకుండా.” ఈ హీబ్రూ పదబంధం, రాణి రాజు వద్దకు తీసుకొచ్చిన దాని నుండి సొలొమోను ఇచ్చిన దానిని వేరుచేస్తున్నట్లు అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆమె తిరిగి తన దేశానికి వెళ్లింది.” హీబ్రూలో అక్షరార్థంగా, “ఆమె తిరిగి వెళ్లింది” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  choice: ఇచ్చాడు
  rationale: బహుమతులు ఇవ్వడాన్ని సూచించే ఈ సందర్భంలో సాధారణమైన, నేరుగా అర్థమయ్యే తెలుగు పదం.
- source_word: מַלְכַּת שְׁבָא
  choice: షెబా రాణి
  rationale: రాజబిరుదును సహజమైన తెలుగులో ఇచ్చి, స్థలనామాన్ని లిప్యంతరీకరించింది.
- source_word: כָּל חֶפְצָהּ
  choice: కోరుకున్నదంతా
  rationale: חֵפֶץ ఇక్కడ కోరికను లేదా కోరుకున్న వస్తువును సూచిస్తుంది; ఈ ఎంపిక రెండవ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר שָׁאָלָה
  choice: ఆమె అడిగినదేదైనా
  rationale: రాణి కోరిన వాటిని మరింత స్పష్టపరిచే హీబ్రూ సంబంధవాక్యాన్ని పునరుక్తి భారంగా లేకుండా నిలుపుతుంది.
- source_word: מִלְּבַד אֲשֶׁר הֵבִיאָה אֶל הַמֶּלֶךְ
  choice: ఆమె రాజు దగ్గరకు తీసుకొచ్చినదానికి అదనంగా
  rationale: מִלְּבַד లోని మినహాయింపు లేదా అదనపు భావాన్ని నిలుపుతూ, హీబ్రూ వాక్యంలోని అసాధారణ సంబంధాన్ని అతిగా వివరణ చేయకుండా ఉంచుతుంది.
- source_word: וַתַּהֲפֹךְ
  choice: వెనుదిరిగి
  rationale: ‘తిరిగింది’ అనే మూలభావాన్ని, తన దేశానికి బయలుదేరిన సందర్భంలో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַתֵּלֶךְ לְאַרְצָהּ
  choice: తన దేశానికి వెళ్లింది
  rationale: దిశను, ఆమె స్వదేశమనే స్వామ్యభావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הִיא וַעֲבָדֶיהָ
  choice: ఆమె తన సేవకులతో కలిసి
  rationale: రాణితో ప్రయాణించే పరివారాన్ని ఈ సందర్భంలో ‘సేవకులు’ అని అనువదించడం సహజం; ‘కలిసి’ హీబ్రూలోని సమన్వయాన్ని తెలుగులో సులభంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘వెనుదిరిగి తన దేశానికి వెళ్లింది’ అనే రూపం హీబ్రూలోని రెండు వరుస క్రియలను సహజంగా నిలుపుతుంది.
