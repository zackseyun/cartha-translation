  yaml_path: translation/ot/2_chronicles/009/013.yaml
  text: The weight of the gold that came to Solomon in one year was six hundred sixty-six talents of gold,[a]
translation:
  language: te
  text: ఒక సంవత్సరంలో సొలొమోనుకు వచ్చిన బంగారం యొక్క బరువు ఆరు వందల అరవై ఆరు బంగారు తలాంతులు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సొలొమోనుకు తీసుకురాబడిన బంగారం’; హీబ్రూ మూలపాఠం అక్షరార్థంగా ‘సొలొమోనుకు వచ్చిన బంగారం’ అని చెబుతుంది; దానిని ఎవరు తీసుకొచ్చారో పేర్కొనదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ఉంది (తెలుగు వాక్య నిర్మాణంలో అంతర్లీనంగా)
  rationale: ఈ కథన రూపం వాక్యాన్ని ముందటి సందర్భంతో అనుసంధానిస్తుంది. మూలంలో స్పష్టమైన ‘ఇప్పుడు’ అనే కాలసూచక పదం లేనందున తెలుగులో అదనపు అవ్యయాన్ని చేర్చలేదు.
- source_word: מִשְׁקַל הַזָּהָב
  choice: బంగారం బరువు
  rationale: מִשְׁקַל పరిమాణం లేదా విలువను మాత్రమే కాక ప్రత్యేకంగా బరువును సూచిస్తుంది; తెలుగు పదబంధం సహజంగా ఉండేలా నిర్దిష్ట భావాన్ని సందర్భం ద్వారా వ్యక్తం చేశాం.
- source_word: אֲשֶׁר בָּא
  choice: వచ్చిన
  rationale: హీబ్రూ క్రియ ‘వచ్చింది’ అని మాత్రమే చెబుతుంది; ఎవరు తీసుకొచ్చారో పేర్కొనదు. కాబట్టి కర్తృత్వాన్ని చేర్చకుండా మూలంలోని అస్పష్టతను నిలిపాం.
- source_word: לִשְׁלֹמֹה
  choice: సొలొమోనుకు
  rationale: ל ఇక్కడ దిశను లేదా స్వీకర్తను సూచిస్తుంది; ‘సొలొమోనుకు’ దాని సహజమైన తెలుగు రూపం.
- source_word: בְּשָׁנָה אֶחָת
  choice: ఒక సంవత్సరంలో
  rationale: ఒక సంవత్సరకాలంలో అందిన మొత్తాన్ని నేరుగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: שֵׁשׁ מֵאוֹת וְשִׁשִּׁים וָשֵׁשׁ
  choice: ఆరువందల అరవై ఆరు
  rationale: మూలంలోని సంఖ్యను వ్యాఖ్యానం లేకుండా యథాతథంగా ఇచ్చాం.
- source_word: כִּכְּרֵי זָהָב
  choice: బంగారం ... తలాంతులు
  rationale: כִּכָּר ప్రాచీన పెద్ద బరువు ప్రమాణం. స్థిరమైన బైబిలు పరిభాషగా ‘తలాంతు’ను ఉంచి, వాక్యంలో సహజమైన తెలుగు పదక్రమాన్ని వాడాం.
theological_decisions:
- issue: 666 అనే సంఖ్యకు ఉండవచ్చని భావించే ప్రతీకాత్మక ప్రాముఖ్యత
  choice: దీనిని చారిత్రక బరువు పరిమాణంగా సూటిగా అనువదించడం
  alternative: ఇతర బైబిలు సందర్భాల్లోని 666 సంఖ్యతో ఉండవచ్చని భావించే తరువాతి ప్రతీకాత్మక సంబంధాన్ని సూచించడం
  rationale: ఈ హీబ్రూ వాక్యం సొలొమోనుకు ఒక సంవత్సరంలో వచ్చిన బంగారం బరువును మాత్రమే తెలియజేస్తుంది; సంఖ్యకు ప్రతీకాత్మక అర్థాన్ని ఇవ్వదు. అందువల్ల అనువాదం ఆ అర్థాన్ని దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ప్రాచీన బరువు ప్రమాణానికి స్థిరమైన బైబిలు పదమైన ‘తలాంతు’ వాడబడింది; కర్తృత్వంపై మూలంలోని అస్పష్టతను పాదటిప్పణితో సంరక్షించాం.
