  text: וַ/יְהִי֙ מִשְׁקַ֣ל הַ/זָּהָ֔ב אֲשֶׁר בָּ֥א לִ/שְׁלֹמֹ֖ה בְּ/שָׁנָ֣ה אֶחָ֑ת שֵׁ֥שׁ מֵא֛וֹת וְ/שִׁשִּׁ֥ים וָ/שֵׁ֖שׁ כִּכְּרֵ֥י זָהָֽב־׃
base_translation:
