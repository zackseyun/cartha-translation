  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ הַ/מֶּ֧לֶךְ שְׁלֹמֹ֛ה מָאתַ֥יִם צִנָּ֖ה זָהָ֣ב שָׁח֑וּט שֵׁ֤שׁ מֵאוֹת֙ זָהָ֣ב שָׁח֔וּט יַעֲלֶ֖ה עַל הַ/צִּנָּ֥ה הָ/אֶחָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/015.yaml
  text: King Solomon made two hundred large shields of beaten gold[a]; six hundred shekels of beaten gold went onto each shield.
translation:
  language: te
  text: సొలొమోను రాజు కొట్టి పలుచగా చేసిన బంగారంతో రెండువందల పెద్ద డాళ్లను తయారు చేశాడు; ఒక్కో డాలుపై కొట్టి పలుచగా చేసిన బంగారం ఆరువందల షెకెలులు[a] ఉపయోగించబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో అక్షరార్థంగా, “ఆ ఒక్క డాలుపై కొట్టి పలుచగా చేసిన బంగారం ఆరువందలు ఎక్కింది” అని ఉంది. బరువు ప్రమాణం పేరు మూలంలో చెప్పబడలేదు; సందర్భాన్ని బట్టి అది సూచితమై ఉంది. స్పష్టత కోసం “షెకెలులు” అని చేర్చబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: తయారు చేశాడు
  rationale: עשה అనే సాధారణ ‘చేయు/తయారు చేయు’ క్రియను ఈ వస్తువుల తయారీ సందర్భంలో సహజంగా వ్యక్తపరుస్తుంది; రాజే స్వయంగా చేశాడా, చేయించాడా అని మూలంలో లేని భేదాన్ని చేర్చదు.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: రాజైన సొలొమోను
  rationale: హీబ్రూ పదక్రమంలోని రాజపదవినీ వ్యక్తి పేరునీ సహజమైన ఆధునిక తెలుగు శైలిలో నిలుపుతుంది.
- source_word: מָאתַיִם צִנָּה
  choice: రెండువందల పెద్ద డాళ్లు
  rationale: צִנָּה సాధారణంగా శరీరాన్ని ఎక్కువగా కప్పే పెద్ద డాలును సూచిస్తుంది; ‘పెద్ద’ అనే విశేషణం ఇతర చిన్న డాలు పదాలతో ఉండే భావభేదాన్ని కాపాడుతుంది.
- source_word: זָהָב שָׁחוּט
  choice: కొట్టి పలుచగా చేసిన బంగారం
  rationale: שָׁחוּט ఇక్కడ బంగారాన్ని కొట్టి లేదా సాగదీసి పలుచగా పని చేసిన భావాన్ని ఇస్తుంది. ఈ రూపం సాంకేతికతను అతిగా నిర్ధారించకుండా సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: יַעֲלֶה עַל
  choice: పట్టింది
  rationale: ఒక్కో డాలుపై అంత పరిమాణం బంగారం వెళ్లింది లేదా ఉపయోగించబడింది అనే హీబ్రూ భావాన్ని సహజ తెలుగు పరిమాణ ప్రయోగంతో తెలియజేస్తుంది; డాలు పూర్తిగా కప్పబడిందని అదనంగా నిర్ధారించదు.
- source_word: הַצִּנָּה הָאֶחָת
  choice: ఒక్కో డాలుకు
  rationale: అక్షరార్థంగా ‘ఆ ఒక్క డాలుపై’ ఉన్న పంపిణీ భావాన్ని తెలుగులో సహజంగా ‘ఒక్కో డాలుకు’ అని వ్యక్తపరుస్తుంది.
- source_word: '[שֵׁשׁ מֵאוֹת తరువాత సూచితమైన కొలమానం]'
  choice: షెకెలులు
  rationale: హీబ్రూలో బరువు ప్రమాణం పేరు ప్రత్యక్షంగా లేదు; సందర్భం సూచించే సంప్రదాయ బరువు ప్రమాణాన్ని పాఠకుని స్పష్టత కోసం పాఠ్యంలో చేర్చి, పాదసూచికలో తెలియజేశాం.
