revisions:
- from: రాజైన సొలొమోను కొట్టి పలుచగా చేసిన బంగారంతో రెండువందల పెద్ద డాళ్లను తయారు చేశాడు; ఒక్కో డాలుకు కొట్టి పలుచగా చేసిన బంగారం ఆరువందల షెకెలులు[a] పట్టింది.
  to: సొలొమోను రాజు కొట్టి పలుచగా చేసిన బంగారంతో రెండువందల పెద్ద డాళ్లను తయారు చేశాడు; ఒక్కో డాలుపై కొట్టి పలుచగా చేసిన బంగారం ఆరువందల షెకెలులు[a] ఉపయోగించబడింది.
