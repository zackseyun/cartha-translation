translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవభరితమైనప్పటికీ సాధారణ పాఠకునికి సులభంగా ఉండే వాక్యనిర్మాణం వాడబడింది. ‘డాలు’ అనే స్థిరమైన ఆయుధపదాన్ని ఉపయోగించి, צִנָּה సూచించే పరిమాణభేదం కోసం ‘పెద్ద’ అని చేర్చబడింది.
