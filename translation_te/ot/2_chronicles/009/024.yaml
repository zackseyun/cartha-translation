id: 2CH.9.24
reference: 2 Chronicles 9:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הֵ֣ם מְבִיאִ֣ים אִ֣ישׁ מִנְחָת֡/וֹ כְּלֵ֣י כֶסֶף֩ וּ/כְלֵ֨י זָהָ֤ב וּ/שְׂלָמוֹת֙ נֵ֣שֶׁק וּ/בְשָׂמִ֔ים סוּסִ֖ים וּ/פְרָדִ֑ים דְּבַר שָׁנָ֖ה בְּ/שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/024.yaml
  text: 'And they were bringing[a], each man his tribute: articles of silver and articles of gold, garments, weapons, spices, horses, and mules[c][b], year by year.'
translation:
  language: te
  text: వారు ఒక్కొక్కరూ తమ కప్పాన్ని[a]—వెండి వస్తువులు, బంగారు వస్తువులు, వస్త్రాలు[b], ఆయుధాలు[c], సుగంధ ద్రవ్యాలు, గుర్రాలు, కంచర గాడిదలు—ఏటేటా తీసుకొచ్చేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తమ కానుకను’ లేదా ‘తమ బహుమానాన్ని’; מִנְחָה అనే హీబ్రూ పదం కానుక లేదా అర్పణను సూచించగలదు. అయితే ఈ రాజసందర్భంలో ‘కప్పం’ అనే భావం ఉండే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పైవస్త్రాలు’.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘కవచాలు’ లేదా ‘యుద్ధ సామగ్రి’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבִיאִים
  choice: తీసుకొచ్చేవారు
  rationale: హీబ్రూ కృదంతం సందర్భంలో అలవాటుగా, పదేపదే జరిగే చర్యను సూచిస్తుంది; తెలుగు అసమాపక భూతకాల రూపం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אִישׁ מִנְחָתוֹ
  choice: ఒక్కొక్కరూ తమ కప్పాన్ని
  rationale: אִישׁ ఇక్కడ విభాజకార్థంలో ‘ఒక్కొక్కరూ’ అని అర్థం. రాజసందర్భంలో מִנְחָה సాధారణ కానుకకన్నా రాజుకు క్రమంగా సమర్పించే కప్పాన్ని సూచించే అవకాశం ఎక్కువ.
- source_word: כְּלֵי כֶסֶף
  choice: వెండి వస్తువులు
  rationale: כְּלִי పాత్ర, పరికరం లేదా ఇతర వస్తువును సూచించగల విస్తృత పదం; ‘వస్తువులు’ దాని సాధారణతను నిలుపుతుంది.
- source_word: וּכְלֵי זָהָב
  choice: బంగారు వస్తువులు
  rationale: వెండి వస్తువులతో సమాంతరంగా ఉండే విస్తృత పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: וּשְׂלָמוֹת
  choice: వస్త్రాలు
  rationale: ఈ పదం దుస్తులను, బహుశా విలువైన పైవస్త్రాలను సూచిస్తుంది; ‘వస్త్రాలు’ అనవసరంగా నిర్దిష్టం చేయని సహజమైన పదం.
- source_word: נֵשֶׁק
  choice: ఆయుధాలు
  rationale: ఈ పదం ఆయుధ సామగ్రిని లేదా యుద్ధ సామగ్రిని సూచించగలదు; ఆధునిక తెలుగులో ‘ఆయుధాలు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וּבְשָׂמִים
  choice: సుగంధ ద్రవ్యాలు
  rationale: రాజులకు ఇచ్చే కానుకల సందర్భంలో పరిమళభరితమైన మసాలాలు లేదా సుగంధ పదార్థాలను సూచించే విస్తృతమైన, సహజ తెలుగు పదబంధం.
- source_word: סוּסִים
  choice: గుర్రాలు
  rationale: నేరుగా సరిపోలే తెలుగు పదం.
- source_word: וּפְרָדִים
  choice: కంచర గాడిదలు
  rationale: మ్యూల్ జంతువుకు సాధారణ తెలుగు సమానార్థకం.
- source_word: דְּבַר שָׁנָה בְּשָׁנָה
  choice: ఏటేటా
  rationale: ఈ హీబ్రూ నుడికారం ప్రతి సంవత్సరం పునరావృతమయ్యే చర్యను సూచిస్తుంది; ‘ఏటేటా’ సంక్షిప్తంగా, సహజంగా అదే భావాన్ని ఇస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. జాబితా స్పష్టత కోసం దీర్ఘ విరామ చిహ్నాలు వాడబడ్డాయి. మూలంలోని పునరావృత చర్యను ‘తీసుకొచ్చేవారు’, వార్షిక క్రమాన్ని ‘ఏటేటా’ ద్వారా నిలిపాం.
