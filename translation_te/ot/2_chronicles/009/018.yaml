base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/018.yaml
  text: There were six steps to the throne[a], and a gold footstool attached to the throne, and armrests on this side and on that beside the seat, and two lions standing beside the armrests.
translation:
  language: te
  text: ఆ సింహాసనానికి ఆరు మెట్లు ఉన్నాయి. సింహాసనానికి బంగారు పాదపీఠం అమర్చబడి ఉంది.[a] ఆసనం ఇరువైపులా చేతులు ఆనించే పక్కదండలు ఉన్నాయి; ఆ దండల పక్కన రెండు సింహాలు నిలబడి ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సింహాసనానికి బంగారు వాలుమార్గం లేదా మెట్లదారి అమర్చబడి ఉంది.” כבשׁ అనే హీబ్రూ పదానికి భిన్న అర్థాలు సాధ్యమే; సింహాసన సందర్భంలో “పాదపీఠం” సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלוֹת
  choice: మెట్లు
  rationale: సింహాసనాన్ని ఎక్కడానికి ఏర్పాటు చేసిన మెట్లను సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన, స్పష్టమైన పదం.
- source_word: כֶבֶשׁ
  choice: పాదపీఠం
  rationale: సింహాసన సందర్భంలో పాదాలు ఆనించే పీఠం అనే అర్థం సముచితం; అయితే ‘వాలు మార్గం/మెట్లదారి’ అనే అర్థసాధ్యతను పాదసూచికలో నిలిపాం.
- source_word: מָאֳחָזִים
  choice: అమర్చబడి ఉంది
  rationale: ఆ వస్తువు సింహాసనానికి బిగించబడి లేదా జతచేయబడి ఉందనే నిష్క్రియ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יָדוֹת
  choice: చేతులు ఆనించే దండలు
  rationale: అక్షరార్థంగా ‘చేతులు’; ఆసన సామగ్రి సందర్భంలో చేతులు ఆనించే పక్క దండలను సూచిస్తుంది. సాధారణ పాఠకునికి వెంటనే అర్థమయ్యే వివరణాత్మక రూపం.
- source_word: מִזֶּה וּמִזֶּה
  choice: ఇరువైపులా
  rationale: ఒక వైపు, మరొక వైపు అనే ద్విపార్శ్వ అమరికను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מְקוֹם הַשָּׁבֶת
  choice: కూర్చునే చోటికి
  rationale: అక్షరార్థంలోని ‘కూర్చునే స్థలం’ భావాన్ని నిలిపి, దండల స్థానాన్ని తెలుగులో సహజంగా వివరిస్తుంది.
- source_word: אֲרָיוֹת
  choice: సింహాలు
  rationale: మూలంలోని సాధారణ బహువచనాన్ని అలాగే ఉంచాం; అవి శిల్పాలనే సందర్భం సూచించినా అనువాదంలో అదనంగా నిర్దేశించలేదు.
- source_word: עֹמְדִים
  choice: నిలబడి ఉన్నాయి
  rationale: సింహాలు నిటారుగా ఉంచబడిన స్థితిని ప్రత్యక్షంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אֵצֶל
  choice: పక్కన
  rationale: అతి సమీప స్థానాన్ని తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
