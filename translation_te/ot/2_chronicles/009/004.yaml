  text: וּ/מַאֲכַ֣ל שֻׁלְחָנ֡/וֹ וּ/מוֹשַׁ֣ב עֲבָדָי/ו֩ וּ/מַעֲמַ֨ד מְשָׁרְתָ֜י/ו וּ/מַלְבּֽוּשֵׁי/הֶ֗ם וּ/מַשְׁקָי/ו֙ וּ/מַלְבּ֣וּשֵׁי/הֶ֔ם וַ/עֲלִיָּת֔/וֹ אֲשֶׁ֥ר יַעֲלֶ֖ה בֵּ֣ית יְהוָ֑ה וְ/לֹא הָ֥יָה ע֛וֹד בָּ֖/הּ רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/004.yaml
  text: the food of his table[a], the seating of his servants, the attendance of his ministers and their clothing, his cupbearers and their clothing, and the stairway by which he went up to the house of Yahweh[b], there was no more breath in her.
translation:
  language: te
  text: అతని బల్లమీది ఆహారాన్ని, అతని సేవకుల కూర్చునే ఏర్పాటును, అతని పరిచారకులు నిలబడి సేవచేసే తీరును, వారి వస్త్రాలను, అతని పానపాత్రలు అందించేవారిని, వారి వస్త్రాలను, అతడు యహ్వే మందిరానికి ఎక్కి వెళ్లే మెట్ల మార్గాన్ని[a] చూసినప్పుడు, ఆమెకు ఊపిరే లేకపోయింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, 1 రాజులు 10:5లోని సమాంతర వాక్యాన్ని అనుసరించి, “యహ్వే మందిరంలో అతడు అర్పించిన దహనబలిని.” అయితే ఇక్కడి హెబ్రీయ పాఠం సహజంగా “అతడు ఎక్కి వెళ్లే మెట్ల మార్గం” అని అర్థమిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “ఆమెలో ఇక ఊపిరి లేదు”; ఇది ఆమె తీవ్రమైన ఆశ్చర్యానికి లోనైందని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲכַל שֻׁלְחָנוֹ
  choice: అతని బల్లమీది ఆహారం
  rationale: מַאֲכַל అనే పదంలోని స్పష్టమైన ‘ఆహారం’ భావాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉండే రూపాన్ని ఎంచుకున్నాం.
- source_word: מוֹשַׁב עֲבָדָיו
  choice: అతని సేవకుల కూర్చునే ఏర్పాటు
  rationale: מוֹשָׁב ఇక్కడ కూర్చోవడం మాత్రమే కాక రాజసభలోని ఆసన క్రమాన్ని కూడా సూచించగలదు; ‘కూర్చునే ఏర్పాటు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מַעֲמַד מְשָׁרְתָיו
  choice: అతని పరిచారకులు నిలబడి సేవచేసే తీరు
  rationale: מַעֲמַד లోని నిలబడడం లేదా నిర్దిష్ట స్థానంలో ఉండడం అనే దృశ్య భావాన్నీ, מְשָׁרְתָיו లోని సేవా భావాన్నీ రెండింటినీ నిలిపాం.
- source_word: מַלְבּוּשֵׁיהֶם
  choice: వారి వస్త్రాలు
  rationale: ఇది దుస్తులు లేదా వస్త్రాలను సూచించే సాధారణ పదం; ‘వస్త్రాలు’ గౌరవప్రదమైన, సులభమైన ఆధునిక తెలుగు.
- source_word: מַשְׁקָיו
  choice: అతని పానపాత్రలు అందించేవారు
  rationale: రాజుకు పానీయం అందించే ప్రత్యేక సేవకులను సూచిస్తుంది. ‘పానపాత్రలు అందించేవారు’ అనే వివరణాత్మక రూపం ‘cupbearers’ భావాన్ని తెలుగు పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: עֲלִיָּתוֹ אֲשֶׁר יַעֲלֶה בֵּית יְהוָה
  choice: అతడు యహ్వే మందిరానికి ఎక్కి వెళ్లే మెట్ల మార్గం
  rationale: మసోరా పాఠంలోని עֲלִיָּה ను ‘ఎక్కే దారి/మెట్ల మార్గం’గా తీసుకున్నాం. ‘మందిరం’ అనేది దేవుని ఆలయాన్ని ఆధునిక తెలుగులో సహజంగా సూచిస్తుంది; ‘ఎక్కి వెళ్లే’ అనే పదబంధం హెబ్రీయ మూలంలోని పదపునరుక్తి భావాన్ని కొంత నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హెబ్రీయ దైవనామాన్ని బిరుదుగా మార్చకుండా, పేరుగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וְלֹא הָיָה עוֹד בָּהּ רוּחַ
  choice: ఆమెకు ఊపిరే లేకపోయింది
  rationale: רוּחַ యొక్క ‘ఊపిరి’ భావాన్ని, తీవ్ర ఆశ్చర్యాన్ని తెలిపే హెబ్రీయ నుడికారంలోని సజీవ చిత్రాన్ని నిలిపే సహజ తెలుగు రూపం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉన్నందున దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ‘యహ్వే’ హెబ్రీయ నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ.
- issue: עֲלִיָּתוֹ యొక్క పాఠార్థం
  choice: మందిరానికి ఎక్కి వెళ్లే మెట్ల మార్గం
  alternative: యహ్వే మందిరంలో అతడు అర్పించిన దహనబలి
  rationale: ఇక్కడ ఇచ్చిన WLC మసోరా పాఠం సహజంగా ‘ఎక్కే మార్గం/మెట్లు’ అనే అర్థాన్నిస్తుంది. 1 రాజులు 10:5లోని సమాంతర పాఠం ఆధారంగా ‘దహనబలి’ అనే పఠనం సాధ్యమైనా, దాన్ని ప్రధాన పాఠంలోకి తీసుకురాక పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలిని ఉపయోగించాం. రాజసభలోని రెండు సేవక వర్గాల మధ్య తేడాను ‘సేవకులు’ మరియు ‘పరిచారకులు’తో నిలిపాం. ఈ వచనం ముందరి వచనంలోని ‘చూసింది’ అనే క్రియకు వ్యాకరణపరంగా కొనసాగింపు; తెలుగులో స్వతంత్రంగా చదివినప్పటికీ స్పష్టంగా ఉండేందుకు ‘చూసినప్పుడు’ను చేర్చాం. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల వెంట ఉంచాం.
