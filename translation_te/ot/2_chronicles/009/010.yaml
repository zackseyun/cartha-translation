id: 2CH.9.10
reference: 2 Chronicles 9:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/גַם עַבְדֵ֤י חירם וְ/עַבְדֵ֣י שְׁלֹמֹ֔ה אֲשֶׁר הֵבִ֥יאוּ זָהָ֖ב מֵ/אוֹפִ֑יר הֵבִ֛יאוּ עֲצֵ֥י אַלְגּוּמִּ֖ים וְ/אֶ֥בֶן יְקָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/010.yaml
  text: And also the servants of Hiram and the servants of Solomon[a], who brought gold from Ophir[c][b], brought algum wood and precious stones.
translation:
  language: te
  text: ఓఫీరు నుండి బంగారం తీసుకువచ్చిన హీరాము[c] సేవకులు, సొలొమోను సేవకులు కూడా అల్గుమ్ కలపను[a], విలువైన రాళ్లను[b] తీసుకువచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అల్ముగ్ కలప’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం సూచించే చెట్టు జాతి ఖచ్చితంగా తెలియదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘విలువైన రాయి’ అని ఏకవచన రూపంలో ఉంది; అది బహుశా సమూహార్థంలో విలువైన రాళ్లను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: దినవృత్తాంతములలోని ఈ పేరును కొన్ని అనువాద సంప్రదాయాలు ‘హూరాము’ అని రాస్తాయి; ఇక్కడి హీబ్రూ రూపాన్ని ‘హీరాము’గా సూచించాం.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: కూడా
  rationale: కథనానికి కొనసాగింపును, అదనపు భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עַבְדֵי
  choice: సేవకులు
  rationale: రాజసేవలో ఉన్న పరివారాన్ని లేదా అధికార సేవకులను సూచించే ఈ సందర్భంలో ‘సేవకులు’ సహజమైనది; బానిసత్వాన్ని అనవసరంగా ప్రధానంగా చూపదు.
- source_word: חירם
  choice: హీరాము
  rationale: ఈ వచనంలోని హీబ్రూ నామరూపాన్ని తెలుగులో సాధారణంగా గుర్తించదగిన విధంగా లిప్యంతరీకరించింది.
- source_word: אֲשֶׁר הֵבִיאוּ זָהָב מֵאוֹפִיר
  choice: ఓఫీరు నుండి బంగారం తీసుకువచ్చిన
  rationale: సంబంధ వాక్యాన్ని తెలుగులో సహజంగా నామవాచకానికి ముందు ఉంచి, సేవకులనే సూచించే మూలభాష నిర్మాణాన్ని నిలుపుతుంది.
- source_word: הֵבִיאוּ
  choice: తీసుకువచ్చారు
  rationale: హిఫిల్ రూపంలోని ‘తెచ్చు’ అనే సాధారణ భావాన్ని కాపాడుతుంది; వాణిజ్య దిగుమతి అనే అదనపు భావాన్ని చేర్చదు.
- source_word: עֲצֵי אַלְגּוּמִּים
  choice: అల్గుమ్ కలప
  rationale: చెట్టు జాతి ఖచ్చితంగా తెలియనందున ఊహాత్మక వృక్షశాస్త్రీయ గుర్తింపుకు బదులు హీబ్రూ పదాన్ని లిప్యంతరీకరించింది.
- source_word: וְאֶבֶן יְקָרָה
  choice: విలువైన రాళ్లను
  rationale: హీబ్రూలో ఏకవచన రూపం సమూహార్థకంగా వాడబడినట్లు గ్రహించి, సరుకు జాబితాకు సహజమైన తెలుగు బహువచనాన్ని ఉపయోగించింది.
