translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని సంబంధ వాక్యం తెలుగులో సులభంగా అర్థమయ్యేలా సేవకుల ముందు ఉంచబడింది; అరుదైన కలప పేరులోని అనిశ్చితి పాదసూచికలో నిలుపబడింది.
