translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించబడింది. రాజరిక సందర్భాన్ని తెలియజేయడానికి ‘సింహాసనం’, వైభవం మరియు పరిమాణం రెండింటినీ సూచించడానికి ‘గొప్ప’ వాడబడ్డాయి.
