source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ הַ/מֶּ֛לֶךְ כִּסֵּא שֵׁ֖ן גָּד֑וֹל וַ/יְצַפֵּ֖/הוּ זָהָ֥ב טָהֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/017.yaml
  text: The king made a great ivory throne and overlaid it with pure gold[a].
translation:
  language: te
  text: రాజు ఏనుగుదంతంతో చేసిన గొప్ప సింహాసనాన్ని తయారుచేసి, దానిని మేలిమి బంగారంతో కప్పాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘దంతపు సింహాసనం’; ఇక్కడ ‘దంతం’ అంటే ఏనుగుదంతం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేయించాడు
  rationale: రాజు స్వయంగా నిర్మించాడనే భావం కాకుండా, రాజాజ్ఞతో అది తయారైందనే సహజ తెలుగు భావాన్ని ఇస్తుంది; హీబ్రూ עשה యొక్క విస్తృత అర్థపరిధికి సందర్భోచితంగా సరిపోతుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: హీబ్రూలో వ్యక్తిపేరు కాకుండా నిర్దిష్టమైన బిరుదే ఉంది; అందువల్ల ‘సొలొమోను’ అని స్పష్టీకరించకుండా బిరుదును నిలిపింది.
- source_word: כִּסֵּא
  choice: సింహాసనం
  rationale: రాజుకు సంబంధించిన ఆసనం కావడంతో సాధారణ ‘ఆసనం’ కంటే రాజరిక భావాన్ని తెలిపే ‘సింహాసనం’ సరైనది.
- source_word: שֵׁן
  choice: దంతం
  rationale: ఈ పదానికి మూలార్థం ‘పంటి/దంతం’; వస్తువుల సందర్భంలో ఇది ఏనుగు దంతాన్ని, అంటే ivoryని సూచిస్తుంది. తెలుగు ప్రధాన పాఠంలో సహజమైన పదార్థార్థం ఇవ్వబడింది.
- source_word: גָּדוֹל
  choice: గొప్ప
  rationale: పరిమాణంతో పాటు వైభవం, ప్రాముఖ్యత అనే భావాలను కూడా నిలుపుతుంది; కేవలం ‘పెద్ద’ అన్నదానికంటే హీబ్రూ పదంలోని విస్తృతిని మెరుగ్గా అందిస్తుంది.
- source_word: וַיְצַפֵּהוּ
  choice: దానికి ... పొదిగించాడు
  rationale: పీయేల్ రూపం ఒక వస్తువును మరొక పదార్థంతో కప్పడం లేదా తాపడం సూచిస్తుంది. ‘పొదిగించాడు’ రాజరిక అలంకరణ సందర్భంలో సహజంగా ఉంది.
- source_word: זָהָב טָהוֹר
  choice: మేలిమి బంగారం
  rationale: ‘శుద్ధమైన బంగారం’ అనే అర్థాన్ని సహజమైన ఆధునిక తెలుగు ప్రయోగంతో వ్యక్తం చేస్తుంది.
