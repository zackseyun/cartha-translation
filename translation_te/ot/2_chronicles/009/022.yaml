source:
  edition: WLC
  text: וַ/יִּגְדַּל֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה מִ/כֹּ֖ל מַלְכֵ֣י הָ/אָ֑רֶץ לְ/עֹ֖שֶׁר וְ/חָכְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/022.yaml
  text: King Solomon surpassed all the kings of the earth in wealth and wisdom.
translation:
  language: te
  text: సంపదలోను జ్ఞానంలోను రాజైన సొలొమోను భూమిపై ఉన్న రాజులందరినీ మించిపోయాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: మించిపోయాడు
  rationale: גדל అనే క్రియ מן‌తో కూడిన తులనాత్మక నిర్మాణంలో ఇతరులకంటే గొప్పగా ఉండడం లేదా వారిని అధిగమించడం అనే భావాన్ని ఇస్తుంది. ‘మించిపోయాడు’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: రాజైన సొలొమోను
  rationale: మూలంలోని బిరుదు, పేరు రెండింటినీ నిలుపుతూ, తెలుగులో సహజమైన విశేషణ నిర్మాణాన్ని ఉపయోగిస్తుంది.
- source_word: מִכֹּל מַלְכֵי הָאָרֶץ
  choice: భూమిపై ఉన్న రాజులందరినీ
  rationale: אָרֶץ అనే పదానికి ‘దేశం’ లేదా ‘భూమి’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ అంతర్జాతీయ రాజుల విస్తృత పోలికను సూచిస్తున్నందున ‘భూమిపై ఉన్న’ అనేది సందర్భానికి తగినది.
- source_word: לְעֹשֶׁר
  choice: సంపదలోను
  rationale: לְ ఇక్కడ పోలిక జరిగే రంగాన్ని సూచిస్తుంది. עֹשֶׁרను ‘సంపద’గా అనువదించడం ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וְחָכְמָה
  choice: జ్ఞానంలోను
  rationale: חָכְמָהకు ‘జ్ఞానం’ అనే అర్థం. జతగా ఉన్న రెండు రంగాలనూ తెలుగులో సమాంతరంగా చూపడానికి ‘లోను’ను పునరుక్తి చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు వచన శైలిని నిలుపుతూ రూపొందించబడింది. మూలంలోని తులనాత్మక భావం మరియు సంపద–జ్ఞానం అనే రెండు అంశాల సమాంతరత్వం కాపాడబడ్డాయి.
