id: 2CH.9.8
reference: 2 Chronicles 9:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּר֔וּךְ אֲשֶׁ֣ר חָפֵ֣ץ בְּ/ךָ֗ לְ/תִתְּ/ךָ֤ עַל כִּסְא/וֹ֙ לְ/מֶ֔לֶךְ לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ בְּ/אַהֲבַ֨ת אֱלֹהֶ֤י/ךָ אֶת יִשְׂרָאֵל֙ לְ/הַעֲמִיד֣/וֹ לְ/עוֹלָ֔ם וַ/יִּתֶּנְ/ךָ֤ עֲלֵי/הֶם֙ לְ/מֶ֔לֶךְ לַ/עֲשׂ֖וֹת מִשְׁפָּ֥ט וּ/צְדָקָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/008.yaml
  text: Blessed be Yahweh your God[a], who delighted in you and set you on his throne as king for Yahweh your God. Because your God loved Israel, to establish them forever[c][b], he made you king over them to administer justice and righteousness.
translation:
  language: te
  text: నీ దేవుడైన యెహోవా స్తుతింపబడుగాక[a]! ఆయన నీయందు సంతోషించి, నీ దేవుడైన యెహోవా తరఫున రాజుగా ఉండడానికి నిన్ను తన సింహాసనం మీద కూర్చోబెట్టాడు. నీ దేవుడు ఇశ్రాయేలును ప్రేమించినందువల్ల, వారిని శాశ్వతంగా స్థిరపరచడానికి[b], న్యాయాన్నీ నీతినీ అమలు చేయడానికి నిన్ను వారిమీద రాజుగా నియమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ దేవుడైన యెహోవా ధన్యుడు.”
    reason: ఆశీర్వచన రూపాన్ని ప్రకటనగా కూడా సహజంగా అర్థం చేసుకోవచ్చు.
  - marker: b
    text: అక్షరార్థంగా, “దాన్ని శాశ్వతంగా స్థిరపరచడానికి”; ఇక్కడ “దాన్ని” అనేది సమష్టి ప్రజగా ఇశ్రాయేలును సూచిస్తుంది.
    reason: హెబ్రీలో సర్వనామ ప్రత్యయం ఏకవచనంలో ఉంది.
lexical_decisions:
- source_word: יְהִי ... בָּרוּךְ
  choice: స్తుతింపబడుగాక
  rationale: జస్సివ్ ఆశీర్వచన సూత్రాన్ని సహజమైన, గౌరవప్రదమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో ఉంచుతుంది.
- source_word: חָפֵץ בְּךָ
  choice: నిన్ను చూసి ఆనందించి
  rationale: ఈ క్రియలోని ఇష్టపడటం, సంతోషించడం అనే సానుకూల భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְתִתְּךָ עַל כִּסְאוֹ
  choice: నిన్ను తన సింహాసనం మీద కూర్చోబెట్టాడు
  rationale: రాజుగా ప్రతిష్ఠించడాన్ని సూచిస్తూ, అది దేవుని సింహాసనం అనే గమనార్హమైన భావాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: לְמֶלֶךְ לַיהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవా తరఫున రాజుగా
  rationale: రాజు యెహోవా అధికారానికి లోబడి, ఆయన ప్రతినిధిగా పరిపాలిస్తున్న సంబంధాన్ని అతిగా విస్తరించకుండా తెలుపుతుంది.
- source_word: בְּאַהֲבַת אֱלֹהֶיךָ אֶת יִשְׂרָאֵל
  choice: నీ దేవుడు ఇశ్రాయేలును ప్రేమించినందువల్ల
  rationale: בְּ యొక్క సందర్భానుగుణ కారణార్థాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: לְהַעֲמִידוֹ לְעוֹלָם
  choice: వారిని శాశ్వతంగా స్థిరపరచడానికి
  rationale: ఏకవచన ప్రత్యయం సమష్టిగా భావించిన ఇశ్రాయేలును సూచిస్తుంది; వ్యక్తుల సమూహాన్ని సూచించే ‘వారిని’ తెలుగులో సహజంగా ఉంటుంది. ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: וַיִּתֶּנְךָ עֲלֵיהֶם לְמֶלֶךְ
  choice: నిన్ను వారిమీద రాజుగా నియమించాడు
  rationale: అక్షరార్థంగా ‘ఇచ్చాడు’ అయినా, రాజ్యాభిషేక సందర్భంలో నియామకం అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לַעֲשׂוֹת מִשְׁפָּט וּצְדָקָה
  choice: న్యాయాన్నీ నీతినీ జరిగించేలా
  rationale: రాజపాలనకు సంబంధించిన స్థిరమైన హెబ్రీ జంటలోని రెండు వేర్వేరు భావాలను నిలుపుతుంది.
theological_decisions:
- issue: כִּסְאוֹ (‘తన సింహాసనం’) ఎవరిది?
  choice: యెహోవా సింహాసనంగా సూచించే ‘తన సింహాసనం’
  alternative: కేవలం సొలొమోను లేదా దావీదు వంశపు రాజసింహాసనం
  rationale: వాక్యంలోని సమీప పూర్వపదం యెహోవా; దినవృత్తాంతాల గ్రంథంలో రాజు దేవుని అధికారంలో పరిపాలిస్తాడనే భావాన్ని ఈ సర్వనామం ఉద్దేశపూర్వకంగా నిలుపుతుంది.
- issue: לְהַעֲמִידוֹలోని ఏకవచన ప్రత్యయం
  choice: ఇశ్రాయేలును సమష్టి ప్రజలుగా తీసుకొని ప్రధాన పాఠ్యంలో ‘వారిని’
  alternative: దేశం లేదా సమష్టి ఏకవచనంగా ‘దాన్ని’
  rationale: హెబ్రీ రూపం ఏకవచనమైనప్పటికీ దాని సూచ్యం సమష్టిగా ఉన్న ఇశ్రాయేలు. తెలుగు సహజత్వం కోసం బహువచనం వాడి, రూప సంబంధ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో భద్రపరిచాం.
- issue: מִשְׁפָּט וּצְדָקָה అనే రాజపాలనా జంట
  choice: ‘న్యాయం, నీతి’ అనే రెండు పదాలనూ వేర్వేరుగా నిలుపడం
  alternative: రెండింటినీ కలిపి ‘న్యాయమైన పరిపాలన’ అని అనువదించడం
  rationale: మూలంలోని న్యాయ తీర్పు మరియు సదాచార సరియైనతనం మధ్య ఉన్న భావ వైవిధ్యాన్ని కుదించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, బహిరంగ పఠనానికి అనువైన శైలి. అరుదైన సంస్కృతభారిత నిర్మాణాలను తగ్గిస్తూ ‘సింహాసనం’, ‘న్యాయం’, ‘నీతి’ వంటి స్థిరమైన బైబిలు పదాలను నిలుపుకున్నాం.
