id: 2CH.9.11
reference: 2 Chronicles 9:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ הַ֠/מֶּלֶךְ אֶת עֲצֵ֨י הָֽ/אַלְגּוּמִּ֜ים מְסִלּ֤וֹת לְ/בֵית יְהוָה֙ וּ/לְ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/כִנֹּר֥וֹת וּ/נְבָלִ֖ים לַ/שָּׁרִ֑ים וְ/לֹא נִרְא֥וּ כָ/הֵ֛ם לְ/פָנִ֖ים בְּ/אֶ֥רֶץ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/011.yaml
  text: And the king made from the algum wood stairways for the house of Yahweh and for the king’s house[a], and lyres and harps for the singers[b]. Nothing like them had been seen before in the land of Judah.
translation:
  language: te
  text: రాజు అల్‌గుమ్ చెక్కతో[b] యాహ్వే మందిరానికీ రాజభవనానికీ మెట్లదారులు[a] చేయించాడు; గాయకుల కోసం కిన్నెరలు, స్వరమండలాలు కూడా చేయించాడు. అంతకుముందు యూదా దేశంలో అలాంటివి ఎన్నడూ కనిపించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఎత్తైన నడకదారులు’; ఇక్కడి హీబ్రూ పదం భవనాలకు చేరే నిర్మిత మార్గాలను లేదా మెట్లదారులను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: ‘అల్‌గుమ్.’ దీనికి సమాంతరమైన 1 రాజులు 10:12లో ‘అల్‌ముగ్’ అని ఉంది. ఈ చెట్టు జాతి ఖచ్చితంగా తెలియదు.'
    reason: cross_reference
lexical_decisions:
- source_word: עֲצֵי הָאַלְגּוּמִּים
  choice: అల్‌గుమ్ చెక్క
  rationale: ఇది విలువైన దిగుమతి కలపకు వాడిన అరుదైన పేరు; చెట్టు జాతి ఖచ్చితంగా తెలియనందున ఊహాత్మక వృక్షనామం బదులు హీబ్రూ రూపాన్ని లిప్యంతరీకరించాం.
- source_word: מְסִלּוֹת
  choice: మెట్లదారులు
  rationale: సాధారణంగా ఎత్తైన దారి లేదా నిర్మిత మార్గం అనే అర్థమున్నా, ఇక్కడ మందిరం మరియు రాజభవనం సంబంధమైన నిర్మాణ సందర్భంలో వాటికి చేరే మెట్లదారులు అనే భావం సహజంగా సరిపోతుంది; విస్తృత అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: לְבֵית יְהוָה וּלְבֵית הַמֶּלֶךְ
  choice: యాహ్వే మందిరానికీ రాజభవనానికీ
  rationale: హీబ్రూలో రెండింటికీ ‘ఇల్లు’ అనే పదమే ఉన్నప్పటికీ, ఆధునిక తెలుగులో సందర్భార్థాన్ని స్పష్టంగా, సహజంగా తెలియజేయడానికి ‘మందిరం’, ‘రాజభవనం’ అని అనువదించాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: כִנֹּרוֹת
  choice: కిన్నెరలు
  rationale: ఇది తంతివాద్యమైన lyre‌ను సూచిస్తుంది; తెలుగులో పరిచితమైన, గౌరవప్రదమైన ‘కిన్నెర’ పదం దానికి సమీపంగా ఉంటుంది.
- source_word: נְבָלִים
  choice: స్వరమండలాలు
  rationale: ఇది కిన్నెరతో భిన్నమైన మరో తంతివాద్యం. ఖచ్చితమైన ఆధునిక వాద్య సమానత్వాన్ని ప్రకటించకుండా, సంప్రదాయ తెలుగు బైబిలు వాడుకలోని స్పష్టమైన వేరుపదాన్ని ఎంచుకున్నాం.
- source_word: לַשָּׁרִים
  choice: గాయకుల కోసం
  rationale: שׁיר ధాతువు నుంచి వచ్చిన ఈ రూపం నేరుగా ‘పాడేవారు’ లేదా ‘గాయకులు’ అని సూచిస్తుంది.
- source_word: וְלֹא נִרְאוּ כָהֵם לְפָנִים
  choice: అలాంటివి ఎన్నడూ కనిపించలేదు
  rationale: ఇంతకుముందు వాటివంటివి చూడబడలేదనే హీబ్రూ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపాం.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: యూదా దేశంలో
  rationale: హీబ్రూలో స్పష్టంగా ఉన్న ‘దేశం/భూమి’ అనే భౌగోళిక పదాన్ని నిలిపాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణకు అనుగుణంగా ‘యాహ్వే’ అని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. ‘చేయించాడు’ అనే ప్రయోజక రూపం రాజు తన ఆధ్వర్యంలో పనిని చేయించాడనే సహజ రాజసభా సందర్భాన్ని వ్యక్తం చేస్తుంది. అరుదైన కలప పేరు మరియు నిర్మాణపదంలోని అనిశ్చితిని పాదసూచికల్లో పారదర్శకంగా నిలిపాం.
