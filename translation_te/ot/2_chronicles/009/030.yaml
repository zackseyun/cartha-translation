  yaml_path: translation/ot/2_chronicles/009/030.yaml
  text: And Solomon reigned in Jerusalem over all Israel forty years.
translation:
  language: te
  text: సొలొమోను యెరూషలేములో ఇశ్రాయేలంతటిమీద నలభై సంవత్సరాలు రాజుగా పరిపాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: రాజుగా పరిపాలించాడు
  rationale: מלך అనే క్రియ రాజుగా పాలించడాన్ని సూచిస్తుంది. తెలుగు పాఠకులకు సహజంగా, రాజరిక భావం స్పష్టంగా ఉండేందుకు ‘రాజుగా పరిపాలించాడు’ అని అనువదించాం.
- source_word: שְׁלֹמֹה
  choice: సొలొమోను
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: בִירוּשָׁלִַם
  choice: యెరూషలేములో
  rationale: בְ ఉపసర్గ ఇక్కడ స్థలాన్ని సూచిస్తుంది; అందువల్ల సహజమైన తెలుగు స్థానవిభక్తితో అనువదించాం.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలంతటిమీద
  rationale: מלךతో వచ్చిన עַל అధికార పరిధిని సూచిస్తుంది. ‘ఇశ్రాయేలంతటిమీద’ అనే రూపం ప్రజ/దేశ సమష్టి భావాన్నీ, ‘అంతటి’ అనే సంపూర్ణతనూ నిలుపుతుంది.
- source_word: אַרְבָּעִים שָׁנָה
  choice: నలభై సంవత్సరాలు
  rationale: హీబ్రూలో సంఖ్య తర్వాత ఏకవచన నామవాచకం ఉన్నప్పటికీ, తెలుగులో కాలవ్యవధిని సహజంగా బహువచనంతో వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన చారిత్రక వర్ణన. మూలంలోని పదక్రమాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగులో సహజంగా వినిపించే క్రియారూపాన్ని ఉపయోగించాం.
