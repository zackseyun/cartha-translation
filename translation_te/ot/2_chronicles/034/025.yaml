source:
  edition: WLC
  text: תַּ֣חַת אֲשֶׁ֣ר עֲזָב֗וּ/נִי ו/יקטירו לֵֽ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֨עַן֙ הַכְעִיסֵ֔/נִי בְּ/כֹ֖ל מַעֲשֵׂ֣י יְדֵי/הֶ֑ם וְ/תִתַּ֧ךְ חֲמָתִ֛/י בַּ/מָּק֥וֹם הַ/זֶּ֖ה וְ/לֹ֥א תִכְבֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/025.yaml
  text: Because they have forsaken me and burned incense to other gods[a], so as to provoke me to anger by all the works of their hands[b], my wrath will be poured out on this place and will not be quenched.
translation:
  language: te
  text: వారు నన్ను విడిచిపెట్టి, ఇతర దేవుళ్లకు[a] ధూపం వేసి, తమ చేతుల పనులన్నిటి ద్వారా[b] నాకు కోపం పుట్టేలా చేశారు కాబట్టి, నా కోపం ఈ స్థలంపై కుమ్మరించబడుతుంది; అది ఆరిపోదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అన్య దేవుళ్లకు.’ హీబ్రూలో అక్షరార్థంగా ‘ఇతర దేవుళ్లకు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘తమ చేతుల పనులు’ అనే మాట వారు తయారుచేసిన లేదా చేసిన వాటిని విస్తృతంగా సూచించవచ్చు; ముఖ్యంగా మనుషులు చేసిన విగ్రహాలు, వాటికి సంబంధించిన కార్యాలు ఇందులో ఉండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: అందువల్ల
  rationale: ఈ పదబంధం తీర్పుకు కారణాన్ని తెలియజేస్తుంది. తెలుగు వాక్యక్రమంలో కారణాన్ని ముందుగా చెప్పి, తీర్పుకు ముందు ‘అందువల్ల’ ఉంచడం సహజంగా ఉంటుంది.
- source_word: עֲזָבוּנִי
  choice: నన్ను విడిచిపెట్టి
  rationale: עזב అంటే విడిచిపెట్టు లేదా త్యజించు. ‘విడిచిపెట్టి’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, దేవునిపట్ల వారి అవిశ్వాసపు తీవ్రతను నిలుపుతుంది.
- source_word: וַיַּקְטִירוּ
  choice: ధూపం వేసి
  rationale: קטר హిఫీల్ రూపం ఇక్కడ దేవతారాధనలో ధూపం లేదా పొగ అర్పణను కాల్చడాన్ని సూచిస్తుంది. ‘ధూపం వేసి’ సాధారణ పాఠకులకు స్పష్టమైన ఆరాధనా పదప్రయోగం.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లకు
  rationale: אֲחֵרִים యొక్క ప్రత్యక్ష అర్థం ‘ఇతర’. మూలంలోని ఒడంబడిక సంబంధ విగ్రహారాధనా భాషను ఇది యథాతథంగా ఉంచుతుంది.
- source_word: לְמַעַן הַכְעִיסֵנִי
  choice: నాకు కోపం పుట్టించారు
  rationale: ఈ నిర్మాణం ఉద్దేశం లేదా ఫలితాన్ని సూచించగలదు. సందర్భంలో వారి క్రియల ఫలితంగా దేవునికి కోపం పుట్టించారని సహజ తెలుగులో తెలియజేస్తూ, ఆ రెండు సాధ్యతలను అతిగా నిర్ధారించదు.
- source_word: בְּכֹל מַעֲשֵׂי יְדֵיהֶם
  choice: తమ చేతుల పనులన్నిటితో
  rationale: హీబ్రూ నుడికారాన్ని కనిపించేలా ఉంచుతుంది; ఇది వారు చేసిన వస్తువులను, ముఖ్యంగా విగ్రహాలను, అలాగే వాటికి సంబంధించిన కార్యాలను విస్తృతంగా సూచించగలదు.
- source_word: וְתִתַּךְ חֲמָתִי
  choice: నా ఉగ్రత ... కుమ్మరించబడుతుంది
  rationale: נתך లోని ‘కుమ్మరించు’ రూపకాన్ని నిలుపుతూ, חֵמָה యొక్క తీవ్రమైన న్యాయతీర్పు భావాన్ని ‘ఉగ్రత’ తెలియజేస్తుంది.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: ఈ స్థలం మీద
  rationale: కుమ్మరించబడే ఉగ్రత ఏ లక్ష్యం మీద పడుతుందో ‘మీద’ సహజంగా తెలియజేస్తుంది.
- source_word: וְלֹא תִכְבֶּה
  choice: అది ఆరిపోదు
  rationale: כבה లోని అగ్ని ఆరిపోవడం అనే రూపకాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవిక తీర్పు భాషను మృదువుచేయకుండా, అతిగా సిద్ధాంతీకరించకుండా అనువదించడం
  choice: నా ఉగ్రత ఈ స్థలం మీద కుమ్మరించబడుతుంది; అది ఆరిపోదు
  alternative: నా రౌద్రం ఈ స్థలం మీద కుమ్మరించబడుతుంది; అది చల్లారదు
  rationale: ఎంచుకున్న పఠనం దేవుని న్యాయతీర్పు తీవ్రతను, కుమ్మరింపు మరియు ఆరని అగ్ని రూపకాలను నిలుపుతుంది; తరువాతి సిద్ధాంత వర్గాలను ఇందులో చేర్చదు.
- issue: ప్రథమ పురుష దైవిక సంభాషణ
  choice: నన్ను / నాకు / నా
  alternative: యెహోవాను / యెహోవాకు / యెహోవా యొక్క
  rationale: హీబ్రూ పాఠంలో ప్రథమ పురుష ప్రత్యయాలున్నందున వాటిని నేరుగా నిలుపడం సముచితం; దైవనామాన్ని ప్రత్యామ్నాయంగా చేర్చాల్సిన అవసరం లేదు.
- issue: לְמַעַן యొక్క ఉద్దేశం-ఫలితం ఉద్వేగం
  choice: నాకు కోపం పుట్టించారు
  alternative: నాకు కోపం పుట్టించాలనే ఉద్దేశంతో
  rationale: לְמַעַן ఉద్దేశం లేదా ఫలితాన్ని సూచించగలదు. ప్రధాన పాఠంలో కఠినమైన ఉద్దేశపూర్వకతను బలవంతంగా నిర్ణయించకుండా, క్రియల వల్ల కలిగిన దైవిక కోపాన్ని తెలియజేయడం మూలంలోని ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి వాడబడింది. ‘ధూపం వేసి’ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ఆరాధనా పదప్రయోగం. కారణాన్ని మొదటి వాక్యంలో ఉంచి, ‘అందువల్ల’ ద్వారా తీర్పుతో అనుసంధానించడం తెలుగు ప్రవాహానికి అనుకూలం; మూలార్థంలోని కారణ సంబంధం నిలిచింది.
