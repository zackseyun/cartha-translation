revisions:
- from: వారు నన్ను విడిచిపెట్టి, ఇతర దేవుళ్లకు[a] ధూపం వేసి, తమ చేతుల పనులన్నిటితో[b] నాకు కోపం పుట్టించారు. అందువల్ల నా ఉగ్రత ఈ స్థలం మీద కుమ్మరించబడుతుంది; అది ఆరిపోదు.
  to: వారు నన్ను విడిచిపెట్టి, ఇతర దేవుళ్లకు[a] ధూపం వేసి, తమ చేతుల పనులన్నిటి ద్వారా[b] నాకు కోపం పుట్టేలా చేశారు కాబట్టి, నా కోపం ఈ స్థలంపై కుమ్మరించబడుతుంది; అది ఆరిపోదు.
  rationale: The revision restores the Hebrew causal construction with ‘చేశారు కాబట్టి,’ represents the purpose/result force of לְמַעַן with ‘కోపం పుట్టేలా,’ and uses natural modern Telugu while preserving the source’s judgment and fire imagery. Both footnote anchors remain attached to their corresponding terms.
