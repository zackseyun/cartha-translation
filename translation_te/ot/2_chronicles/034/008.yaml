    rationale: לְחַזֵּק క్రియ భవనాన్ని బాగుచేయడం/బలపరచడం సూచిస్తుంది; పంపబడినవారి పర్యవేక్షణను ఊహించి ‘చేయించడానికి’ అని చెప్పడం మూలపాఠం స్పష్టంగా చెప్పని భావాన్ని జోడిస్తుంది.
