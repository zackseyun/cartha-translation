source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֨ת שְׁמוֹנֶ֤ה עֶשְׂרֵה֙ לְ/מָלְכ֔/וֹ לְ/טַהֵ֥ר הָ/אָ֖רֶץ וְ/הַ/בָּ֑יִת שָׁ֠לַח אֶת שָׁפָ֨ן בֶּן אֲצַלְיָ֜הוּ וְ/אֶת מַעֲשֵׂיָ֣הוּ שַׂר הָ/עִ֗יר וְ֠/אֵת יוֹאָ֤ח בֶּן יֽוֹאָחָז֙ הַ/מַּזְכִּ֔יר לְ/חַזֵּ֕ק אֶת בֵּ֖ית יְהוָ֥ה אֱלֹהָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/008.yaml
  text: In the eighteenth year of his reign[a], when he had cleansed the land and the house, he sent Shaphan son of Azaliah, Maaseiah the governor of the city, and Joah son of Joahaz, the recorder[b], to repair the house of Yahweh his God.
translation:
  language: te
  text: అతని పాలనలోని పద్దెనిమిదవ సంవత్సరంలో, దేశాన్ని, మందిరాన్ని శుద్ధి చేసిన తరువాత, తన దేవుడైన యెహోవా మందిరాన్ని మరమ్మతు చేయడానికి అతడు అజల్యా కుమారుడు షాఫానును, పట్టణ అధికారి మయశేయాను, రాజరికార్డుల అధికారి యోవాహాజు కుమారుడు యోవాహును పంపాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మరమ్మతు చేయడానికి” అని అనువదించిన హీబ్రూ మాటకు అక్షరార్థం “బలపరచడానికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת שְׁמוֹנֶה עֶשְׂרֵה לְמָלְכוֹ
  choice: అతని పరిపాలనలో పద్దెనిమిదవ సంవత్సరంలో
  rationale: రాజ్యపాలన సంవత్సరాన్ని తెలిపే హీబ్రూ కాలసూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; వాక్యారంభ וּ־కు ప్రత్యేకంగా ‘అప్పుడు’ వంటి పదాన్ని చేర్చలేదు.
- source_word: לְטַהֵר הָאָרֶץ וְהַבָּיִת
  choice: దేశాన్ని, మందిరాన్ని శుద్ధి చేసిన తరువాత
  rationale: לְטַהֵר రూపానికి ఉద్దేశార్థం సాధ్యమైనప్పటికీ, ముందరి కథనంలో శుద్ధీకరణ జరిగినదనే సందర్భం ఇక్కడ కాలసంబంధ పఠనాన్ని బలపరుస్తుంది. הַבַּיִת అక్షరార్థంగా ‘ఇల్లు’; సందర్భంలో దేవాలయం కాబట్టి ‘మందిరం’ సహజంగా ఉంది.
- source_word: שַׂר הָעִיר
  choice: పట్టణ అధికారి
  rationale: שַׂר పౌర పరిపాలనా హోదాను సూచిస్తుంది; ‘అధికారి’ అనవసరంగా ఖచ్చితమైన ఆధునిక హోదాను రుద్దకుండా అర్థాన్ని అందిస్తుంది.
- source_word: הַמַּזְכִּיר
  choice: దస్తావేజుల అధికారి
  rationale: రాజసభలో జ్ఞాపికలు లేదా అధికారిక నమోదులకు సంబంధించిన హోదాను సాధారణ పాఠకునికి స్పష్టంగా తెలుపుతుంది; ‘లేఖకుడు’తో కలిగే గందరగోళాన్ని నివారిస్తుంది.
- source_word: לְחַזֵּק אֶת בֵּית
  choice: మందిరానికి మరమ్మతులు చేయించడానికి
  rationale: חזק మూలార్థం ‘బలపరచడం’; భవన సందర్భంలో దాన్ని బాగుచేయడం లేదా పునరుద్ధరించడం అనే భావం. పంపబడిన అధికారుల పర్యవేక్షక పాత్రను బట్టి causative nuance‌ను ‘చేయించడానికి’ అందిస్తుంది.
- source_word: בֵּית יְהוָה אֱלֹהָיו
  choice: తన దేవుడైన యెహోవా మందిరం
  rationale: స్వామ్యసంబంధాలను సహజ తెలుగు క్రమంలో ఉంచి, יְהוָה అనే వ్యక్తిగత దైవనామాన్ని లిప్యంతరీకరించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: హీబ్రూ పాఠంలో ఉన్న నాలుగు అక్షరాల వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో ఉంచింది.
- issue: לְטַהֵר యొక్క సంబంధం
  choice: శుద్ధి చేసిన తరువాత
  alternative: శుద్ధి చేయడానికి
  rationale: హీబ్రూ infinitive‌కు ఉద్దేశార్థ పఠనం వ్యాకరణపరంగా సాధ్యమే; అయితే 34:3–7లో ఇప్పటికే జరిగిన శుద్ధీకరణను అనుసరించే కథనక్రమం కాలసంబంధ అర్థాన్ని బలపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం. వ్యక్తి పేర్లు తెలుగు బైబిలు సంప్రదాయానికి దగ్గరగా లిప్యంతరీకరించబడ్డాయి. ‘దేశం, మందిరం’ మధ్య హీబ్రూలోని సాధారణ సంధిని సహజ తెలుగు జాబితాగా చూపించాం.
