- from: అతని పరిపాలనలో పద్దెనిమిదవ సంవత్సరంలో, దేశాన్ని, మందిరాన్ని శుద్ధి చేసిన తరువాత, తన దేవుడైన యెహోవా మందిరానికి మరమ్మతులు చేయించడానికి అతడు అజల్యా కుమారుడు షాఫానును, పట్టణ అధికారి మయశేయాను, దస్తావేజుల అధికారి అయిన యెహోయాహాజు కుమారుడు యోవాహును పంపాడు.[a]
  to: అతని పాలనలోని పద్దెనిమిదవ సంవత్సరంలో, దేశాన్ని, మందిరాన్ని శుద్ధి చేసిన తరువాత, తన దేవుడైన యెహోవా మందిరాన్ని మరమ్మతు చేయడానికి అతడు అజల్యా కుమారుడు షాఫానును, పట్టణ అధికారి మయశేయాను, రాజరికార్డుల అధికారి యోవాహాజు కుమారుడు యోవాహును పంపాడు.[a]
  rationale: యోవాహు తండ్రి పేరును హీబ్రూ పాఠానికి అనుగుణంగా ‘యోవాహాజు’గా సరిచేశాం. మూలంలో లేని కారణార్థకాన్ని తొలగించి, భవన సందర్భంలో חזק యొక్క సహజ అర్థమైన ‘మరమ్మతు చేయడానికి’ను వాడాం. వాక్యారంభాన్ని ఆధునిక ప్రామాణిక తెలుగు నుడికారానికి అనుగుణంగా మృదువుగా మార్చాం; దైవనామం, పరిపాలనా హోదా, మరియు సందర్భానుగుణ కాలసంబంధ అర్థాన్ని కాపాడాం.
