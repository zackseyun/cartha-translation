source:
  edition: WLC
  text: וַ/יַּ֣עַל הַ/מֶּ֣לֶךְ בֵּית יְ֠הוָה וְ/כָל אִ֨ישׁ יְהוּדָ֜ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם וְ/הַ/כֹּֽהֲנִים֙ וְ/הַ/לְוִיִּ֔ם וְ/כָל הָ/עָ֖ם מִ/גָּד֣וֹל וְ/עַד קָטָ֑ן וַ/יִּקְרָ֣א בְ/אָזְנֵי/הֶ֗ם אֶת כָּל דִּבְרֵי֙ סֵ֣פֶר הַ/בְּרִ֔ית הַ/נִּמְצָ֖א בֵּ֥ית יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/030.yaml
  text: Then the king went up to the house of Yahweh[a], and every man of Judah, and the inhabitants of Jerusalem, and the priests and the Levites, and all the people, from great to small[b]; and he read in their hearing all the words of the book of the covenant that had been found in the house of Yahweh.
translation:
  language: te
  text: అప్పుడు రాజు యహ్వే[a] మందిరానికి ఎక్కి వెళ్లాడు. అతనితోపాటు యూదా పురుషులందరూ[b], యెరూషలేము నివాసులు, యాజకులు, లేవీయులు, గొప్పవారి నుంచి చిన్నవారి వరకు ప్రజలందరూ వెళ్లారు. యహ్వే మందిరంలో దొరికిన నిబంధన గ్రంథంలోని మాటలన్నిటినీ రాజు వారికి వినిపించేలా చదివాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యహ్వే’ అనేది హీబ్రూ దైవనామమైన יהוה (YHWH)కు లిప్యంతరీకరణ. కొన్ని అనువాదాలు దీనిని ‘ప్రభువు’ లేదా ‘యెహోవా’ అని ఇస్తాయి.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘యూదాకు చెందిన ప్రతి పురుషుడు.’ ఇక్కడ హీబ్రూ ఏకవచన రూపాన్ని విభాజకార్థంలో వాడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: ఎక్కి వెళ్లాడు
  rationale: עלה అనే క్రియలోని ‘పైకి వెళ్లడం’ అనే దిశాభావాన్ని నిలుపుతూ, మందిరానికి వెళ్లిన సందర్భంలో సహజమైన తెలుగును వాడింది.
- source_word: בֵּית יְהוָה
  choice: యహ్వే మందిరం
  rationale: అక్షరార్థంగా ‘యహ్వే గృహం.’ ఆధునిక తెలుగు పాఠకులకు ఇది దేవాలయాన్ని సూచిస్తుందని స్పష్టంగా ఉండేందుకు ‘మందిరం’ అని అనువదించింది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మితమైన ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: כָל אִישׁ יְהוּדָה
  choice: యూదా పురుషులందరూ
  rationale: אִישׁ అనే పుంలింగ ఏకవచనం כָלతో విభాజకార్థంలో వాడబడింది; సహజమైన తెలుగులో దాని అర్థం ‘పురుషులందరూ.’
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: యెరూషలేము నివాసులు
  rationale: ‘యెరూషలేములో నివసించేవారు’ అనే సమూహార్థాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: ఆరాధనా సందర్భంలోని כֹּהֲנִיםకు ప్రామాణిక తెలుగు పదం.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి గోత్రానికి, ఆరాధనా సేవకుల సమూహానికి సాధారణ తెలుగు రూపం.
- source_word: מִגָּדוֹל וְעַד קָטָן
  choice: గొప్పవారి నుంచి చిన్నవారి వరకు
  rationale: హీబ్రూ ‘గొప్పవాడు/చిన్నవాడు’ అనే విస్తృత పదజంటను సామాజిక స్థాయి లేదా వయస్సుగా అతిగా నిర్ధారించకుండా నిలుపుతుంది.
- source_word: וַיִּקְרָא בְאָזְנֵיהֶם
  choice: వారికి వినిపించేలా చదివాడు
  rationale: గ్రంథంలోని మాటలను ప్రజల సమక్షంలో బిగ్గరగా చదివాడనే సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָּל דִּבְרֵי סֵפֶר הַבְּרִית
  choice: నిబంధన గ్రంథంలోని మాటలన్నిటినీ
  rationale: דִּבְרֵיలోని ‘మాటలు’ అనే పాఠ్య ప్రాధాన్యాన్ని, ‘నిబంధన గ్రంథం’ అనే సంబంధాన్ని రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: హీబ్రూ పాఠ్యంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా చూపుతుంది; ‘యహ్వే’ రూపం సాధారణ పునర్నిర్మిత ఉచ్చారణను అనుసరిస్తుంది.
- issue: כָל אִישׁ יְהוּדָהలో పుంలింగ ప్రయోగం
  choice: యూదా పురుషులందరూ
  alternative: యూదా వారందరూ
  rationale: మూలంలోని אִישׁ (‘పురుషుడు’)ను లింగతటస్థంగా మార్చకుండా అనువదించింది. తరువాత వచ్చే ‘ప్రజలందరూ’ అనే విస్తృత సమూహప్రస్తావనను కూడా యథాతథంగా ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలిని అనుసరించింది. హీబ్రూ వాక్యంలోని సమూహాల దీర్ఘ జాబితిని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించింది; ‘అతనితోపాటు’ అనే పదం రాజుతో కలిసి వారందరూ మందిరానికి వెళ్లారనే మూల వాక్య సంబంధాన్ని నిలుపుతుంది.
