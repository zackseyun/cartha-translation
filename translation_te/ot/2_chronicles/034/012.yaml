source:
  edition: WLC
  text: וְ/הָ/אֲנָשִׁים֩ עֹשִׂ֨ים בֶּ/אֱמוּנָ֜ה בַּ/מְּלָאכָ֗ה וַ/עֲלֵי/הֶ֣ם מֻ֠פְקָדִים יַ֣חַת וְ/עֹבַדְיָ֤הוּ הַ/לְוִיִּם֙ מִן בְּנֵ֣י מְרָרִ֔י וּ/זְכַרְיָ֧ה וּ/מְשֻׁלָּ֛ם מִן בְּנֵ֥י הַ/קְּהָתִ֖ים לְ/נַצֵּ֑חַ וְ/הַ֨/לְוִיִּ֔ם כָּל מֵבִ֖ין בִּ/כְלֵי שִֽׁיר׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/012.yaml
  text: And the men were working faithfully in the work[a], and over them were appointed Jahath and Obadiah the Levites, from the sons of Merari, and Zechariah and Meshullam, from the sons of the Kohathites, to oversee; and the Levites[b], all who were skilled with musical instruments.
translation:
  language: te
  text: ఆ మనుషులు పనిలో నమ్మకంగా పనిచేశారు. వారిని పర్యవేక్షించడానికి[a] మెరారి కుమారుల్లోని లేవీయులైన యహతు, ఓబద్యా, కహాతీయుల కుమారుల్లోని జెకర్యా, మెషుల్లాము నియమించబడ్డారు. అలాగే సంగీత వాయిద్యాలలో నైపుణ్యమున్న లేవీయులందరూ[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నడిపించడానికి’; హీబ్రూ క్రియ పర్యవేక్షణతో కూడిన నాయకత్వాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘సంగీత వాయిద్యాలలో అవగాహనగల వారందరూ’; అంటే సంగీత వాయిద్యాలను వాయించడంలో నైపుణ్యమున్న వారందరూ.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּאֱמוּנָה
  choice: నమ్మకంగా
  rationale: ఈ నామవాచకం ఇక్కడ క్రియావిశేషణ భావంతో పనివారి విశ్వసనీయతను, నిజాయితీని సూచిస్తుంది; వ్యక్తిగత విశ్వాసాన్ని కాదు.
- source_word: בַּמְּלָאכָה
  choice: తమ పనిని
  rationale: ఇది ఆలయ మరమ్మతు కార్యాన్ని సూచిస్తుంది. తెలుగులో సహజమైన కర్మ నిర్మాణం కోసం ‘తమ పనిని’ అని అనువదించబడింది.
- source_word: מֻפְקָדִים
  choice: నియమించబడ్డారు
  rationale: హొఫాల్ రూపంలోని కర్మణి భావాన్ని నిలుపుతూ, బాధ్యతకు నియమించబడినట్లు తెలియజేస్తుంది.
- source_word: לְנַצֵּחַ
  choice: పర్యవేక్షించడానికి
  rationale: ఆలయ మరమ్మతు పరిపాలనా సందర్భంలో పనిని పర్యవేక్షించి నడిపించే బాధ్యతను సూచిస్తుంది.
- source_word: מִן בְּנֵי מְרָרִי
  choice: మెరారి కుమారుల్లోని
  rationale: వంశ/గోత్ర సంబంధాన్ని సూచించే హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מִן בְּנֵי הַקְּהָתִים
  choice: కహాతీయుల కుమారుల్లోని
  rationale: קְהָתִים అనే వంశనామాన్నీ, ‘కుమారులు’ అనే వంశావళి నిర్మాణాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: כָּל מֵבִין בִּכְלֵי שִׁיר
  choice: సంగీత వాయిద్యాలలో నైపుణ్యమున్న ... అందరూ
  rationale: ‘పాటకు సంబంధించిన పరికరాలలో అవగాహనగల ప్రతి ఒక్కరూ’ అనే అక్షరార్థాన్ని, ఆచరణాత్మక సంగీత నైపుణ్యంగా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יַחַת / עֹבַדְיָהוּ / זְכַרְיָה / מְשֻׁלָּם
  choice: యహతు / ఓబద్యా / జెకర్యా / మెషుల్లాము
  rationale: వ్యక్తుల పేర్లను ఆధునిక ప్రామాణిక తెలుగు బైబిలు శైలికి అనుగుణంగా లిప్యంతరీకరించింది.
theological_decisions:
- issue: చివరి లేవీయుల పదబంధానికి క్రియ లేకపోవడం
  choice: వాక్యం కొనసాగుతున్న భావాన్ని దీర్ఘ విరామచిహ్నంతో నిలుపడం
  alternative: ముందున్న ‘నియమించబడ్డారు’ అనే క్రియను పునరుక్తి చేసి పూర్తి వాక్యంగా మార్చడం
  rationale: మసొరెటిక్ పాఠ్యంలో చివరి పదబంధం క్రియలేకుండా ఉండి తదుపరి వచనంతో భావసంబంధం కలిగి ఉంది. స్పష్టత కోసం లేని క్రియను చేర్చి భావాన్ని నిర్ణయించకుండా మూలంలోని అసంపూర్ణతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. వంశపరమైన పదజాలం మూలానికి దగ్గరగా ఉంచబడింది. చివరి క్రియారహిత పదబంధం మూలపాఠ్యంలోని నిర్మాణాత్మక అనిశ్చితిని నిలుపేలా ఇవ్వబడింది.
