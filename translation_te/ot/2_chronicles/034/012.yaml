  source_fidelity: మొదటి వాక్యంలోని ‘తమ పనిని’ హీబ్రూ బַּמְּלָאכָה (‘పనిలో/కార్యంలో’) కంటే స్వల్పంగా ఎక్కువ నిర్దిష్టతను ఇస్తుంది; ‘తమ’ అనే స్వామ్యభావం మూలంలో లేదు. ‘పనిలో నమ్మకంగా పనిచేశారు’ మూలార్థాన్నీ, ఆధునిక తెలుగు ప్రయోగాన్నీ మరింత నేరుగా ప్రతిబింబిస్తుంది. నియమింపబడినవారి జాబితా, వారి పర్యవేక్షక పాత్ర, చివరి క్రియారహిత లేవీయుల పదబంధం మూలపాఠ్యానికి అనుగుణంగా ఉన్నాయి.
