translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. పొడవైన వంశావళి సంబంధాన్ని సులభంగా గ్రహించేందుకు రెండు వాక్యాలుగా విభజించాం. మూలంలోని స్త్రీలింగ ప్రవక్త పదాన్ని ‘ప్రవక్త్రి’గా నిలిపాం; మిష్నే అనే ప్రాంతనామ స్వభావంలోని అనిశ్చితిని పాదసూచికలో సంరక్షించాం.
