revisions:
- from: 'అప్పుడు హిల్కీయా, రాజు పంపినవారు కలిసి ప్రవక్త్రి హుల్దా దగ్గరికి వెళ్లారు. ఆమె వస్త్రాల సంరక్షకుడైన[a] షల్లూము భార్య; షల్లూము తోకాతు కుమారుడు, తోకాతు హస్రా కుమారుడు. ఆమె యెరూషలేములోని రెండవ పట్టణ భాగంలో[b] నివసించేది. వారు ఆమెతో ఇలా మాట్లాడారు:'
  to: 'అప్పుడు హిల్కీయా మరియు రాజు పంపినవారు ప్రవక్తురాలైన హుల్దా దగ్గరికి వెళ్లారు. ఆమె వస్త్రాల సంరక్షకుడైన హస్రా కుమారుడు తోకహతు కుమారుడైన షల్లూము భార్య.[a] ఆమె యెరూషలేములోని రెండవ ప్రాంతంలో[b] నివసించేది. వారు ఆమెతో ఇలా మాట్లాడారు:'
  rationale: సురక్షితమైన భాషా, లిప్యంతరీకరణ సవరణలు మాత్రమే చేశాం. షల్లూమే ‘వస్త్రాల సంరక్షకుడు’ అని మూలవాక్యంలోని సంబంధం స్పష్టంగా ఉండేలా వంశావళి పదక్రమాన్ని సవరించాం. మిష్నే యొక్క నిర్దిష్ట స్థలార్థాన్ని ప్రధాన పాఠ్యంలో ‘రెండవ ప్రాంతం’గా మితంగా ఇచ్చి, పాదసూచికలో హీబ్రూ రూపం మరియు సంప్రదాయ అనువాదాన్ని నిలిపాం.
