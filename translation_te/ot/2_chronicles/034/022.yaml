source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ חִלְקִיָּ֜הוּ וַ/אֲשֶׁ֣ר הַ/מֶּ֗לֶךְ אֶל חֻלְדָּ֨ה הַ/נְּבִיאָ֜ה אֵ֣שֶׁת שַׁלֻּ֣ם בֶּן תוקהת בֶּן חַסְרָה֙ שׁוֹמֵ֣ר הַ/בְּגָדִ֔ים וְ/הִ֛יא יוֹשֶׁ֥בֶת בִּ/ירוּשָׁלִַ֖ם בַּ/מִּשְׁנֶ֑ה וַ/יְדַבְּר֥וּ אֵלֶ֖י/הָ כָּ/זֹֽאת־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/022.yaml
  text: 'Then Hilkiah and those whom the king had sent went to Huldah the prophetess[a], the wife of Shallum son of Tokhath, son of Hasrah, keeper of the garments. She lived in Jerusalem in the Second Quarter[b], and they spoke to her thus:'
translation:
  language: te
  text: 'అప్పుడు హిల్కీయా మరియు రాజు పంపినవారు ప్రవక్తురాలైన హుల్దా దగ్గరికి వెళ్లారు. ఆమె వస్త్రాల సంరక్షకుడైన హస్రా కుమారుడు తోకహతు కుమారుడైన షల్లూము భార్య.[a] ఆమె యెరూషలేములోని రెండవ ప్రాంతంలో[b] నివసించేది. వారు ఆమెతో ఇలా మాట్లాడారు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వస్త్రాగార సంరక్షకుడు.” హీబ్రూలో పదశః “వస్త్రాల సంరక్షకుడు.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “మిష్నే.” ఇది బహుశా యెరూషలేములోని ఒక ప్రాంతం పేరు; సాంప్రదాయంగా “రెండవ భాగం” అని అనువదిస్తారు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: వెళ్లారు
  rationale: హీబ్రూ కథన క్రియను సహజమైన తెలుగు భూతకాలంలో ఇచ్చాం; హిల్కీయాతో పాటు ప్రతినిధి బృందం వెళ్లినందున బహువచనం వాడాం.
- source_word: וַאֲשֶׁר הַמֶּלֶךְ
  choice: రాజు పంపినవారు
  rationale: మూలంలోని వాక్యభాగం సంక్షిప్తంగా, అసంపూర్ణంగా ఉంది; ముందరి వచనంలోని రాజు పంపిన ప్రతినిధులను సూచించే భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేశాం.
- source_word: חֻלְדָּה הַנְּבִיאָה
  choice: ప్రవక్త్రి హుల్దా
  rationale: נְבִיאָה అనే స్త్రీలింగ రూపాన్ని నిలుపుతూ, పేరును తెలుగు లిపిలో ధ్వన్యనువాదం చేశాం.
- source_word: שׁוֹמֵר הַבְּגָדִים
  choice: వస్త్రాల సంరక్షకుడు
  rationale: పదశః భావాన్ని నిలుపుతూ, ఇది అధికారిక వస్త్రాగార బాధ్యతను సూచించవచ్చనే అవకాశాన్ని పాదసూచికలో తెలిపాం.
- source_word: וְהִיא יוֹשֶׁבֶת
  choice: ఆమె ... నివసించేది
  rationale: కొనసాగుతున్న నివాసాన్ని తెలిపే హీబ్రూ కృదంత నిర్మాణాన్ని సహజమైన తెలుగు నేపథ్య వాక్యంగా అనువదించాం.
- source_word: בַּמִּשְׁנֶה
  choice: రెండవ పట్టణ భాగంలో
  rationale: ఇది యెరూషలేములోని ఒక నిర్దిష్ట ప్రాంతం కావచ్చని సూచిస్తూ అర్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, హీబ్రూ పేరును పాదసూచికలో నిలిపాం.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ כָּזֹאת
  choice: 'వారు ఆమెతో ఇలా మాట్లాడారు:'
  rationale: తరువాత వచ్చే మాటలను పరిచయం చేసే మూలంలోని నిర్దేశక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలిపాం.
