source:
  edition: WLC
  text: וַ/יַּעֲמֹ֨ד הַ/מֶּ֜לֶךְ עַל עָמְד֗/וֹ וַ/יִּכְרֹ֣ת אֶֽת הַ/בְּרִית֮ לִ/פְנֵ֣י יְהוָה֒ לָ/לֶ֜כֶת אַחֲרֵ֣י יְהוָ֗ה וְ/לִ/שְׁמ֤וֹר אֶת מִצְוֺתָי/ו֙ וְ/עֵֽדְוֺתָ֣י/ו וְ/חֻקָּ֔י/ו בְּ/כָל לְבָב֖/וֹ וּ/בְ/כָל נַפְשׁ֑/וֹ לַ/עֲשׂוֹת֙ אֶת דִּבְרֵ֣י הַ/בְּרִ֔ית הַ/כְּתוּבִ֖ים עַל הַ/סֵּ֥פֶר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/031.yaml
  text: Then the king stood in his place and made the covenant before Yahweh[a], to walk after Yahweh and to keep his commandments and his testimonies and his statutes with all his heart and with all his soul, to carry out the words of the covenant that were written in this book.
translation:
  language: te
  text: 'అప్పుడు రాజు తన స్థానంలో నిలబడి, యాహ్వే సన్నిధిలో నిబంధన చేసుకున్నాడు: యాహ్వే వెంబడి నడుచుకోవాలని, తన పూర్ణ హృదయంతోను పూర్ణ ప్రాణంతోను ఆయన ఆజ్ఞలను, సాక్ష్యవాక్యాలను, శాసనాలను పాటించాలని, ఈ గ్రంథంలో[a] రాసి ఉన్న నిబంధన వాక్యాలను అమలు చేయాలని.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, చారిత్రకంగా మరింత స్పష్టంగా, ‘ఈ చుట్టలో.’ హీబ్రూ పదం చుట్ట రూపంలో ఉన్న లిఖిత పత్రాన్నీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד הַמֶּלֶךְ עַל־עָמְדוֹ
  choice: రాజు తన స్థానంలో నిలబడి
  rationale: עמד అనే క్రియ యొక్క సాధారణ అర్థమైన ‘నిలబడడం’ను, עַל־עָמְדוֹ అనే పదబంధంలోని నియమిత స్థానం లేదా చోటు భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וַיִּכְרֹת אֶת־הַבְּרִית
  choice: నిబంధన చేసుకున్నాడు
  rationale: כרת ברית అనే హీబ్రూ నుడికారం అక్షరార్థంగా ‘నిబంధనను కోయడం’; తెలుగులో దాని సహజ నిబంధనాత్మక అర్థాన్ని ‘నిబంధన చేసుకోవడం’ తెలియజేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: లిఖిత పాఠంలోని దైవనామాన్ని ‘యాహ్వే’గా ఉంచి, לפני యొక్క సమక్షత భావాన్ని ‘సన్నిధిలో’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לָלֶכֶת אַחֲרֵי יְהוָה
  choice: యాహ్వే వెంబడి నడుచుకోవాలని
  rationale: అనుసరణను సూచించే నిబంధనాత్మక ‘వెంబడి నడవడం’ రూపకాన్ని సులభంగా అర్థమయ్యే తెలుగులో నిలుపుతుంది.
- source_word: מִצְוֺתָיו וְעֵדְוֺתָיו וְחֻקָּיו
  choice: ఆయన ఆజ్ఞలను, సాక్ష్యవాక్యాలను, శాసనాలను
  rationale: మూడు వేర్వేరు న్యాయ-నిబంధన పదాలను ఒకే సాధారణ పదంగా కలపకుండా వాటి పదభేదాన్ని కాపాడుతుంది; עֵדוֹתకు ‘సాక్ష్యవాక్యాలు’ అనడం తెలుగులో ‘సాక్ష్యాలు’కన్నా న్యాయబోధల భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: בְּכָל־לְבָבוֹ וּבְכָל־נַפְשׁוֹ
  choice: తన పూర్ణ హృదయంతో, పూర్ణ ప్రాణంతో
  rationale: ద్వితీయోపదేశకాండ సంబంధిత నిబంధన సూత్రంలోని ‘హృదయం’, ‘ప్రాణం’ పదాలను భావానువాదంలో కలిపివేయకుండా నిలుపుతుంది.
- source_word: לַעֲשׂוֹת אֶת־דִּבְרֵי הַבְּרִית
  choice: నిబంధన మాటలను అమలు చేయాలని
  rationale: ‘నిబంధన మాటలు’ అనే మూలపాఠ రూపాన్ని కాపాడుతూ, వాటిని చేయడం/ఆచరించడం అనే עשה భావాన్ని సహజమైన ‘అమలు చేయడం’తో అందిస్తుంది.
- source_word: הַכְּתוּבִים עַל־הַסֵּפֶר הַזֶּה
  choice: ఈ గ్రంథంలో రాసి ఉన్న
  rationale: సెఫెర్ అనేది లిఖిత పత్రం లేదా చుట్టను సూచించగలదు; ప్రధాన పాఠంలో సాధారణంగా అర్థమయ్యే ‘గ్రంథం’ను వాడి చారిత్రక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ఉన్న నాలుగు అక్షరాల వ్యక్తిగత నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- issue: לָלֶכֶת אַחֲרֵי יְהוָה లోని నడక రూపకం
  choice: యాహ్వే వెంబడి నడుచుకోవాలని
  alternative: యాహ్వేను అనుసరించాలని
  rationale: సాధారణ విధేయత భావంతో మాత్రమే పరిమితం చేయకుండా, హీబ్రూ నిబంధన భాషలోని నడక రూపకాన్ని మరియు దాని అంతర్గ్రంథ ప్రతిధ్వనిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. న్యాయ-నిబంధన పదాల మధ్య తేడా, ‘వెంబడి నడుచుకోవడం’ అనే రూపకం, ‘హృదయం–ప్రాణం’ అనే సూత్రభాష నిలుపబడ్డాయి. పాదటిప్పణి గుర్తు అది వివరించే ‘గ్రంథం’ పదానికే జోడించబడింది.
