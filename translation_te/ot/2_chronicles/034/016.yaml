translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. హెబ్రీ నుడికారాన్ని యాంత్రికంగా ‘చేతిలో పెట్టినది’ అని కాకుండా సహజమైన ‘అప్పగించినదంతా’గా అనువదించాం; దీనివల్ల అర్థం స్పష్టమవుతుంది, ప్రత్యేక మతపర వ్యాఖ్యానం చేరదు.
