source:
  edition: WLC
  text: וַ/יָּבֵ֨א שָׁפָ֤ן אֶת הַ/סֵּ֨פֶר֙ אֶל הַ/מֶּ֔לֶךְ וַ/יָּ֨שֶׁב ע֧וֹד אֶת הַ/מֶּ֛לֶךְ דָּבָ֖ר לֵ/אמֹ֑ר כֹּ֛ל אֲשֶׁר נִתַּ֥ן בְּ/יַד עֲבָדֶ֖י/ךָ הֵ֥ם עֹשִֽׂים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/016.yaml
  text: Then Shaphan brought the book to the king and also brought back word to the king[a], saying, “All that was committed into the hand of your servants, they are doing.”
translation:
  language: te
  text: 'అప్పుడు షాపాను ఆ గ్రంథాన్ని రాజు దగ్గరకు తీసుకువచ్చాడు. అదనంగా రాజుకు ఇలా నివేదించాడు: “మీ సేవకులకు అప్పగించినదంతా వారు చేస్తున్నారు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֵא
  choice: తీసుకొచ్చి
  rationale: בוא హిఫీల్ రూపం షాఫాను గ్రంథాన్ని రాజు దగ్గరికి తీసుకొచ్చాడనే కారణార్థక భావాన్ని తెలియజేస్తుంది.
- source_word: הַסֵּפֶר
  choice: ఆ గ్రంథాన్ని
  rationale: సֵפֶר అంటే గ్రంథం, చుట్ట లేదా పత్రం కావచ్చు. సందర్భంలో ముందుగా కనుగొనబడిన ధర్మగ్రంథాన్ని సూచిస్తున్నందున, దాని భౌతిక రూపాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా ‘గ్రంథం’ సహజంగా ఉంది.
- source_word: וַיָּשֶׁב עוֹד אֶת־הַמֶּלֶךְ דָּבָר
  choice: రాజుకు ఇంకా ఈ సమాచారం తెలియజేశాడు
  rationale: שוב + דבר అనే ప్రయోగం తిరిగి నివేదించడం లేదా సమాచారం అందించడం అనే భావాన్ని ఇస్తుంది; עוֹד ఇక్కడ ‘ఇంకా/అదనంగా’ అనే భావాన్ని జతచేస్తుంది.
- source_word: לֵאמֹר
  choice: 'ఈ సమాచారం తెలియజేశాడు:'
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హెబ్రీ ఉక్తి సూచకాన్ని తెలుగులో సహజమైన నివేదిక నిర్మాణం మరియు ద్విబిందువుతో వ్యక్తం చేశాం.
- source_word: כֹּל אֲשֶׁר נִתַּן בְּיַד עֲבָדֶיךָ
  choice: మీ సేవకులకు అప్పగించినదంతా
  rationale: נִתַּן בְּיַד అక్షరార్థంగా ‘చేతిలో ఉంచబడింది’ అయినా, ఇది బాధ్యతగా అప్పగించడాన్ని సూచించే హెబ్రీ నుడికారం. తెలుగులో ‘అప్పగించినదంతా’ అదే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: עֲבָדֶיךָ
  choice: మీ సేవకులు
  rationale: రాజసభ సందర్భంలో עבד రాజు సేవకులు లేదా అధికారులు అనే అర్థం ఇస్తుంది. ‘సేవకులు’ మూలపద విస్తృతిని కాపాడుతూ, ‘బానిసలు’ అనే అతివ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: הֵם עֹשִׂים
  choice: వారు చేస్తున్నారు
  rationale: స్పష్ట సర్వనామం మరియు వర్తమాన క్రియారూపం కొనసాగుతున్న కార్యాన్ని, స్వల్ప ఉద్ఘాటనను తెలియజేస్తాయి; మూలంలో లేని కర్మను చేర్చలేదు.
