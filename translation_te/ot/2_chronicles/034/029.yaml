source:
  edition: WLC
  text: וַ/יִּשְׁלַ֖ח הַ/מֶּ֑לֶךְ וַ/יֶּאֱסֹ֕ף אֶת כָּל זִקְנֵ֥י יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/029.yaml
  text: Then the king sent and gathered all the elders of Judah and Jerusalem[a].
translation:
  language: te
  text: అప్పుడు రాజు పంపించి, యూదా యెరూషలేముల పెద్దలందరినీ సమకూర్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పిలుపు పంపి
  rationale: మూల క్రియకు అక్షరార్థంగా ‘పంపాడు’ అని అర్థం. తరువాత పెద్దలను సమకూర్చడం ప్రస్తావించబడినందున, ఆధునిక తెలుగులో సందర్భానికి సహజంగా ఉండేలా ‘పిలుపు పంపి’ అని అనువదించబడింది; ‘పిలుపు’ మూలంలో స్పష్టంగా లేదని అధస్సూచన తెలియజేస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: నిర్దిష్ట నామవాచకానికి సరళమైన అనువాదం. సందర్భంలో ఇతడు యోషీయా అయినప్పటికీ, మూలంలో వ్యక్తిపేరు కాక బిరుదే ఉంది.
- source_word: וַיֶּאֱסֹף
  choice: సమకూర్చాడు
  rationale: ఆసఫ్ అనే క్రియకు ‘పోగుచేయడం, సమకూర్చడం’ అనే అర్థాలు ఉన్నాయి. అధికారిక సమావేశం కోసం పెద్దలను ఒకచోట చేర్చిన భావాన్ని ‘సమకూర్చాడు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶת כָּל
  choice: అందరినీ
  rationale: אֶת కర్మ సూచిక తెలుగులో విడిగా అనువదించబడదు; כָּל తెలిపే సమగ్రతను ‘అందరినీ’ నిలుపుతుంది.
- source_word: זִקְנֵי
  choice: పెద్దలు
  rationale: ఇక్కడ ఈ పదం కేవలం వృద్ధ పురుషులను కాక, సమాజంలో గుర్తింపు పొందిన నాయకత్వస్థానంలోని పెద్దలను సూచిస్తుంది. తెలుగు బైబిలు వాడుకలోనూ సాధారణ భాషలోనూ ‘పెద్దలు’ తగిన పదం.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: యూదా, యెరూషలేముల
  rationale: ఈ నిర్మాణం యూదా ప్రాంతానికీ యెరూషలేము నగరానికీ చెందిన పెద్దలను సూచిస్తుంది. తెలుగులో సంయుక్త సంబంధార్థాన్ని సహజంగా తెలియజేయడానికి ఈ రూపం ఉపయోగించబడింది.
