translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి. మూలంలోని వరుస చర్యలు నిలుపబడ్డాయి; తెలుగులో ఒంటరిగా ‘పంపి’ అనడం అసంపూర్ణంగా వినిపించే కారణంగా ప్రధాన పాఠ్యంలో సందర్భసూచకంగా ‘పిలుపు’ చేర్చబడింది, అక్షరార్థ రూపం అధస్సూచనలో ఇవ్వబడింది.
