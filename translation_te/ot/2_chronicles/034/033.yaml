id: 2CH.34.33
reference: 2 Chronicles 34:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֨סַר יֹֽאשִׁיָּ֜הוּ אֶת כָּל הַ/תּוֹעֵב֗וֹת מִֽ/כָּל הָ/אֲרָצוֹת֮ אֲשֶׁ֣ר לִ/בְנֵ֣י יִשְׂרָאֵל֒ וַֽ/יַּעֲבֵ֗ד אֵ֤ת כָּל הַ/נִּמְצָא֙ בְּ/יִשְׂרָאֵ֔ל לַ/עֲב֖וֹד אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם כָּל יָמָ֕י/ו לֹ֣א סָ֔רוּ מֵֽ/אַחֲרֵ֕י יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/033.yaml
  text: And Josiah removed all the abominations from all the lands that belonged to the sons of Israel[a], and he made all who were found in Israel serve Yahweh their God. All his days they did not turn away from following Yahweh[d][c][b], the God of their fathers.
translation:
  language: te
  text: యోషీయా ఇశ్రాయేలు ప్రజలకు చెందిన ప్రాంతాలన్నిటి నుంచి[a] హేయమైన వాటన్నిటినీ తొలగించాడు. ఇశ్రాయేలులో ఉన్న వారందరినీ తమ దేవుడైన యాహ్వేను సేవించేలా చేశాడు. అతని జీవితకాలమంతా వారు తమ పితరుల దేవుడైన యాహ్వేను అనుసరించడం నుంచి తొలగిపోలేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, “ఇశ్రాయేలు కుమారులకు చెందిన దేశాలన్నిటి నుంచి.”
    reason: lexical_alternative
  - marker: b
    text: “అతని జీవితకాలమంతా” అనేది యోషీయా కాలాన్ని సూచిస్తుంది; “వారు” అనేది ఇశ్రాయేలులో ఉన్న వారందరిని సూచిస్తుంది.
    reason: referent_clarification
lexical_decisions:
- source_word: וַיָּסַר
  choice: తొలగించాడు
  rationale: హిఫీల్ రూపంలోని ‘తీసివేయడం/తొలగించడం’ అనే క్రియాశీల భావాన్ని సంస్కరణ సందర్భంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַתּוֹעֵבוֹת
  choice: హేయమైన వాటన్నిటినీ
  rationale: విగ్రహారాధనకు సంబంధించిన అసహ్యకరమైన ఆచారాలు లేదా వస్తువులు రెండింటినీ సూచించగల మూలపద విస్తృతిని నిలుపుతుంది.
- source_word: מִכָּל הָאֲרָצוֹת אֲשֶׁר לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలకు చెందిన ప్రాంతాలన్నిటి నుంచి
  rationale: బహువచన אֲרָצוֹת ను ‘ప్రాంతాలు’గా సహజంగా అనువదిస్తూ, ఇశ్రాయేలు సంతతివారికి చెందిన భూభాగాలనే సంబంధాన్ని స్పష్టం చేస్తుంది; అక్షరార్థ కుటుంబ పదబంధం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: וַיַּעֲבֵד
  choice: సేవించేలా చేశాడు
  rationale: עבד యొక్క హిఫీల్ కారణార్థక బలాన్ని నిలుపుతుంది; ‘ప్రోత్సహించాడు’ అని మృదువుపరచకుండా, ప్రత్యక్ష బలవంతం అని అతిగా చెప్పదు.
- source_word: כָּל הַנִּמְצָא בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో ఉన్న వారందరినీ
  rationale: నిఫాల్ కృదంతం యొక్క సందర్భార్థం ‘అక్కడ ఉన్నవారు’; తెలుగులో ‘కనబడినవారు’ అనడం వెదికి పట్టుకున్నారనే అనవసర భావం కలిగించవచ్చు.
- source_word: לַעֲבֹד
  choice: సేవించేలా
  rationale: దేవునికి చేసే ఆరాధనతో కూడిన నిబంధనా సేవ అనే విస్తృత భావాన్ని ‘ఆరాధించు’ కంటే బాగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హెబ్రీ నాలుగు అక్షరాల నామానికి సాధారణ శాస్త్రీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: כָּל יָמָיו
  choice: అతని జీవితకాలమంతా
  rationale: అక్షరార్థంగా ‘అతని దినాలన్నీ’; సందర్భంలో యోషీయా జీవించిన లేదా పాలించిన కాలమంతటినీ సహజ తెలుగులో సూచిస్తుంది.
- source_word: לֹא סָרוּ מֵאַחֲרֵי יְהוָה
  choice: యాహ్వేను అనుసరించడం నుంచి తొలగిపోలేదు
  rationale: ‘వెనుకనుండి తొలగిపోవడం’ అనే హెబ్రీ రూపకాన్ని తెలుగులో అర్థవంతంగా ఉంచి, నిబంధనా విశ్వాస్యత భావాన్ని కాపాడుతుంది.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: తమ పితరుల దేవుడు
  rationale: ‘వారి తండ్రుల దేవుడు’ అనే నిబంధనా సూత్రంలోని తరతరాల సంబంధాన్ని గౌరవప్రదమైన, స్థిరమైన తెలుగు పదబంధంతో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అందించాలి
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత నిబంధనా నామమే ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించబడింది.
- issue: וַיַּעֲבֵד లో యోషీయా చర్య యొక్క కారణార్థక బలం
  choice: వారందరినీ ... సేవించేలా చేశాడు
  alternative: వారందరిని సేవించమని ప్రోత్సహించాడు / సేవ చేయించాడు
  rationale: హిఫీల్ రూపం యోషీయా చురుకుగా ఆ సేవను అమలు చేయించినట్లు సూచిస్తుంది. ఎంపిక చేసిన రూపం ఆ అధికారబలాన్ని తగ్గించదు, అలాగే భౌతిక బలవంతాన్ని పాఠ్యంలోకి చేర్చదు.
- issue: כָּל יָמָיו తరువాతి బహువచన కర్త మధ్య సంబంధం
  choice: అతని జీవితకాలమంతా వారు ... తొలగిపోలేదు
  alternative: వారి దినాలన్నిటిలో వారు ... తొలగిపోలేదు
  rationale: ఏకవచన ప్రత్యయం యోషీయాను సూచిస్తుండగా, ‘వారు’ ఇశ్రాయేలులో ఉన్న ప్రజలను సూచిస్తుంది. మూలంలోని ఈ వ్యాకరణ మార్పును అలాగే ఉంచి, పాదటిప్పణిలో స్పష్టం చేయబడింది.
- issue: לִבְנֵי יִשְׂרָאֵל కుటుంబపరమైన అక్షరార్థం
  choice: ఇశ్రాయేలు ప్రజలు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: ఇక్కడ సమూహజాతిని సూచించే స్థిర హెబ్రీ పదబంధం. ఆధునిక తెలుగులో ‘ప్రజలు’ సహజంగా మొత్తం సమాజాన్ని సూచిస్తుంది; అక్షరార్థాన్ని పాదటిప్పణి సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి ఉపయోగించబడింది. ‘హేయమైనవి’ బలమైన ఆరాధనా-నిబంధనా నిరసనను నిలుపుతుంది; ‘సేవించేలా చేశాడు’ కారణార్థకతను సహజంగా వ్యక్తపరుస్తుంది. దైవనామం అంతటా ‘యాహ్వే’గా ఏకరీతిగా ఇవ్వబడింది.
