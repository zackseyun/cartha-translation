  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని రెండు నిర్మాణ సాంకేతిక పదాల అనిశ్చితిని పాదటిప్పణుల్లో నిలిపాం. అయితే [a] గుర్తు దాని సంబంధిత ‘చెక్కిన రాళ్లు’ వెంట ఉండడం పఠనానికి మెరుగైనందున ప్రచురణ పాఠ్యంలో గుర్తుల క్రమాన్ని సవరించాలి.
