source:
  edition: WLC
  text: וַֽ/יִּתְּנ֗וּ לֶ/חָֽרָשִׁים֙ וְ/לַ/בֹּנִ֔ים לִ/קְנוֹת֙ אַבְנֵ֣י מַחְצֵ֔ב וְ/עֵצִ֖ים לַֽ/מְחַבְּר֑וֹת וּ/לְ/קָרוֹת֙ אֶת הַ/בָּ֣תִּ֔ים אֲשֶׁ֥ר הִשְׁחִ֖יתוּ מַלְכֵ֥י יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/011.yaml
  text: And they gave it to the craftsmen and to the builders to buy quarried stone and timber for the supports and for roofing the buildings that the kings of Judah had ruined[a][b][c].
translation:
  language: te
  text: వారు నైపుణ్యంగల పనివారికీ నిర్మాణకారులకీ, గనిలో తవ్విన రాళ్లను[a], అనుసంధాన పనులకూ[b], యూదా రాజులు పాడుచేసిన భవనాలకు పైకప్పులు వేయడానికీ[c] అవసరమైన కలపను కొనడానికి ఆ సొమ్మును ఇచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చెక్కిన రాళ్లు.’ హీబ్రూ పదబంధం నిర్మాణం కోసం గని నుంచి తీసిన రాళ్లను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి హీబ్రూ పదం అర్థం అనిశ్చితం. ఇది కలిపే పని, బిగింపు భాగాలు, లేదా నిర్మాణ చట్రంలోని భాగాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘దూలాల కోసం’ లేదా ‘కప్పడం కోసం.’ హీబ్రూ క్రియ దూలాలతో ఒక కట్టడానికి పైకప్పు వేయడాన్ని లేదా దాన్ని కప్పడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: వారు ఆ సొమ్మును ... ఇచ్చారు
  rationale: క్రియకు కర్మ హీబ్రూలో అంతర్లీనంగా ఉంది; ముందరి సందర్భంలోని ధనాన్ని సూచించేందుకు తెలుగులో సహజంగా ‘ఆ సొమ్మును’ చేర్చాం.
- source_word: חָרָשִׁים
  choice: నైపుణ్యంగల పనివారు
  rationale: ఒకే వృత్తికి పరిమితం చేయకుండా నైపుణ్యంతో పనిచేసే శిల్పులు లేదా పనివారనే విస్తృత భావాన్ని ఇస్తుంది.
- source_word: בֹּנִים
  choice: కట్టడపు పనివారు
  rationale: నిర్మాణ పనిలో నిమగ్నమైనవారిని సూచించే ప్రత్యక్షమైన, సాధారణ తెలుగు రూపం.
- source_word: לִקְנוֹת
  choice: కొనేందుకు
  rationale: קנה అనే క్రియ యొక్క ఉద్దేశార్థక క్రియారూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אַבְנֵי מַחְצֵב
  choice: చెక్కిన రాళ్లు
  rationale: గనిలో నుంచి తీసి నిర్మాణానికి తగినట్లు కోసిన లేదా చెక్కిన రాళ్లను సూచిస్తుంది; ఖచ్చిత స్వరూపంపై ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: עֵצִים
  choice: నిర్మాణానికి కావలసిన కలప
  rationale: సాధారణ ‘కలప’ కన్నా ఈ సందర్భంలో అది నిర్మాణ సామగ్రి అని స్పష్టం చేస్తుంది.
- source_word: לַמְחַבְּרוֹת
  choice: కలిపే నిర్మాణ భాగాల కోసం
  rationale: పదం అనిశ్చితమైనది; అతిగా నిర్దిష్టం చేయకుండా కలపడం, బిగించడం లేదా నిర్మాణ చట్రంలోని అనుసంధాన భాగాల భావాన్ని నిలుపుతుంది.
- source_word: וּלְקָרוֹת
  choice: పైకప్పులు వేయడం కోసం
  rationale: నిర్మాణ సందర్భంలో కర్రలతో కప్పడం లేదా పైకప్పు వేయడం అనే క్రియాత్మక భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַבָּתִּים
  choice: భవనాలు
  rationale: దేవాలయ మరమ్మతుల సందర్భంలో సాధారణ నివాస గృహాలకన్నా ఆలయ సముదాయంలోని కట్టడాలను సూచించేందుకు అనుకూలం.
- source_word: הִשְׁחִיתוּ
  choice: పాడుచేసిన
  rationale: పూర్తిగా నాశనం చేశారని అతిశయింపకుండా, చెడగొట్టడం లేదా శిథిలావస్థకు చేర్చడం అనే భావాన్ని ఇస్తుంది.
- source_word: מַלְכֵי יְהוּדָה
  choice: యూదా రాజులు
  rationale: హీబ్రూ సమాస పదబంధానికి ప్రత్యక్షమైన తెలుగు అనువాదం.
