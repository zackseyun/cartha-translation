source:
  edition: WLC
  text: וּ/בְ/עָרֵ֨י מְנַשֶּׁ֧ה וְ/אֶפְרַ֛יִם וְ/שִׁמְע֖וֹן וְ/עַד נַפְתָּלִ֑י ב/הר בתי/הם סָבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/006.yaml
  text: and in the cities of Manasseh and Ephraim and Simeon[a], even as far as Naphtali[b], in their surrounding ruins.
translation:
  language: te
  text: మనష్షే, ఎఫ్రాయిము, షిమ్యోను పట్టణాల్లోనూ, నఫ్తాలి వరకు కూడా, వాటి చుట్టుపక్కల శిథిల ప్రాంతాల్లోనూ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: చివరి హీబ్రూ పదబంధం క్లిష్టంగా ఉంది; అక్షరార్థంగా చదివితే దాని భావం స్పష్టంగా లేదు. అనేక అనువాదాలు దీనిని ‘వాటి చుట్టుపక్కల శిథిల ప్రాంతాల్లో’ అనే అర్థంలో గ్రహిస్తాయి.
    reason: textual_variant
  - marker: b
    text: లేదా ‘వాటి చుట్టుపక్కల నిర్జన ప్రదేశాల్లో.’ హీబ్రూ వ్యంజన పాఠాన్ని మరింత అక్షరార్థంగా ‘వాటి ఇళ్లలో’ అని చదవవచ్చు; అయితే ఈ సందర్భం శిథిలమైన లేదా పాడైన ప్రదేశాలను సూచించే అర్థానికే బలంగా మద్దతిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/עָרֵי
  choice: పట్టణాల్లోనూ
  rationale: సంయోజక అవ్యయం, స్థలార్థక ఉపసర్గ రెండింటినీ ‘-లోనూ’ తెలియజేస్తుంది. עָרִים అనే పదానికి చారిత్రక కథనంలో సహజమైన ఆధునిక తెలుగు రూపం ‘పట్టణాలు’.
- source_word: מְנַשֶּׁה וְ/אֶפְרַיִם וְ/שִׁמְעוֹן
  choice: మనష్షే, ఎఫ్రాయిము, షిమ్యోను
  rationale: గోత్ర/ప్రాంత నామాలను తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపాలకు దగ్గరగా లిప్యంతరీకరించాం; సంయోజన భావం జాబితా నిర్మాణం మరియు చివరి ‘-నూ’ ద్వారా వ్యక్తమవుతుంది.
- source_word: וְ/עַד נַפְתָּלִי
  choice: నఫ్తాలి వరకు కూడా
  rationale: עַד సూచించే భౌగోళిక హద్దును ‘వరకు’ స్పష్టంగా తెలియజేస్తుంది; וְ యొక్క విస్తరణ/సంయోజన భావాన్ని ‘కూడా’ సహజంగా మోస్తుంది.
- source_word: ב/הר בתי/הם סָבִיב
  choice: వాటి చుట్టుపక్కల ఉన్న శిథిల ప్రాంతాల్లోనూ
  rationale: చివరి హీబ్రూ పదబంధం పాఠ్యపరంగా క్లిష్టమైనది. సందర్భం యోషీయా ధ్వంసకార్యాన్ని వివరిస్తున్నందున శిథిలమైన లేదా నిర్జన ప్రదేశాలనే సూచిస్తుందని ప్రధాన పాఠ్యంలో భావానుసారంగా ఇచ్చాం; సందిగ్ధతను పాదసూచికల్లో నిలిపాం. סָבִיב భావాన్ని ‘చుట్టుపక్కల ఉన్న’ తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, చారిత్రక కథనానికి తగిన గౌరవప్రదమైన శైలిని వాడాం. వాక్యం ముందటి వచనంలోని క్రియకు కొనసాగింపుగా ఉన్నందున మూలంలోని ఖండవాక్య నిర్మాణాన్ని అలాగే ఉంచాం. క్లిష్టమైన చివరి పదబంధానికి సందర్భోచితమైన ప్రధాన పాఠ్యాన్ని ఇచ్చి, పాఠ్య మరియు పదార్థ సందిగ్ధతలను పాదసూచికల్లో వెల్లడించాం.
