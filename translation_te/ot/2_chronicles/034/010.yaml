id: 2CH.34.10
reference: 2 Chronicles 34:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּתְּנ֗וּ עַל יַד֙ עֹשֵׂ֣ה הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים בְּ/בֵ֣ית יְהוָ֑ה וַ/יִּתְּנ֨וּ אֹת֜/וֹ עוֹשֵׂ֣י הַ/מְּלָאכָ֗ה אֲשֶׁ֤ר עֹשִׂים֙ בְּ/בֵ֣ית יְהוָ֔ה לִ/בְדּ֥וֹק וּ/לְ/חַזֵּ֖ק הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/010.yaml
  text: They put it into the hand of the workmen who were appointed over the house of Yahweh[b][a], and the workmen who were working in the house of Yahweh gave it for repairing and strengthening the house.
translation:
  language: te
  text: వారు దానిని యెహోవా మందిర పర్యవేక్షణకు నియమించబడిన పనివారి చేతికి అప్పగించారు; వారు దానిని యెహోవా మందిరంలో పని చేస్తున్న పనివారికి, మందిరాన్ని మరమ్మతు చేసి పటిష్ఠపరచడానికి ఇచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మందిరాన్ని పునరుద్ధరించి బలపరచడానికి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: అప్పగించారు / ఇచ్చారు
  rationale: נתן అంటే ‘ఇవ్వడం, ఉంచడం, అప్పగించడం.’ మొదటి వాక్యంలో బాధ్యతకు అప్పగించే భావం ఉంది; రెండవ వాక్యంలో తదుపరి వినియోగానికి ఇవ్వడం ఉంది. సందర్భానుసారంగా రెండు సహజ తెలుగు రూపాలు వాడబడ్డాయి.
- source_word: עַל יַד
  choice: చేతికి
  rationale: ఈ హీబ్రూ నుడికారం ఒకరి ఆధీనానికి లేదా బాధ్యతకు అప్పగించడాన్ని సూచిస్తుంది. ‘చేతికి అప్పగించారు’ తెలుగు భాషలో సహజంగా ఉండి మూలంలోని రూపకాన్ని నిలుపుతుంది.
- source_word: עֹשֵׂה הַמְּלָאכָה
  choice: పనివారు
  rationale: ఏకవచన రూపంలో ఉన్నా సందర్భంలో ఇది సమూహార్థకంగా పని చేసేవారిని సూచిస్తుంది. ‘పనివారు’ ఆధునిక తెలుగులో సహజమైన, లింగపరంగా పరిమితం కాని పదం.
- source_word: הַמֻּפְקָדִים
  choice: పనిమీద నియమించబడిన
  rationale: פקד ధాతువు యొక్క కర్మణి కృదంతం ఇక్కడ పర్యవేక్షణ బాధ్యతకు నియమించబడినవారిని సూచిస్తుంది. ఈ అనువాదం నియామకాన్ని, బాధ్యతను రెండింటినీ తెలియజేస్తుంది.
- source_word: בְּבֵית יְהוָה
  choice: యెహోవా మందిరపు / యెహోవా మందిరంలో
  rationale: అక్షరార్థం ‘యెహోవా గృహం.’ సందర్భంలో అది దేవాలయాన్ని సూచిస్తున్నందున ఆధునిక తెలుగు పాఠకులకు స్పష్టమైన ‘మందిరం’ వాడబడింది; విభక్తి సంబంధం ప్రతి వాక్యంలోని పాత్రకు అనుగుణంగా ఇవ్వబడింది.
- source_word: אֹתוֹ
  choice: దానిని
  rationale: ఈ సర్వనామం ముందటి సందర్భంలోని ధనాన్ని సూచిస్తుంది. మూలంలో లేని ‘ధనం’ అనే నామవాచకాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా సర్వనామమే నిలుపబడింది.
- source_word: עוֹשֵׂי הַמְּלָאכָה אֲשֶׁר עֹשִׂים
  choice: పనిచేస్తున్న పనివారు
  rationale: మూలంలో עשה పదానికి సంబంధించిన పునరుక్తి ఉంది. ‘పనిచేస్తున్న పనివారు’ ఆ పునరుక్తిని అసహజంగా కాకుండా కొంతవరకు నిలుపుతుంది.
- source_word: לִבְדּוֹק
  choice: మరమ్మతులు చేయడానికి
  rationale: בדק కొన్ని సందర్భాల్లో ‘పరిశీలించడం’ అనే భావం కలిగినా, మందిర పునరుద్ధరణ సందర్భాల్లో దెబ్బతిన్న భాగాలను బాగుచేయడం అనే స్థిరమైన భావాన్ని కలిగి ఉంది.
- source_word: וּלְחַזֵּק
  choice: పటిష్ఠపరచడానికి
  rationale: חזק ఇక్కడ కట్టడాన్ని బలంగా, స్థిరంగా చేయడాన్ని సూచిస్తుంది. ‘పటిష్ఠపరచడం’ నిర్మాణ సందర్భానికి సహజమైన తెలుగు.
- source_word: הַבָּיִת
  choice: మందిరం
  rationale: అక్షరార్థం ‘గృహం’; ఇక్కడ యెహోవా దేవాలయమే ఉద్దేశ్యం. తెలుగులో ‘మందిరం’ స్పష్టతను ఇస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామాటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా తెలుగులో పరిచితమైన లిప్యంతరీకరణతో నిలుపడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: בַּיִת‌ను ‘గృహం’గా లేదా ‘మందిరం’గా ఇవ్వడం
  choice: మందిరం
  alternative: గృహం
  rationale: ఇక్కడ పదం యెహోవా దేవాలయాన్ని స్పష్టంగా సూచిస్తుంది. ‘మందిరం’ భావాన్ని అనవసరమైన మతపరమైన వివరణతో విస్తరించకుండా సాధారణ పాఠకునికి వెంటనే అర్థమయ్యేలా చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని సర్వనామ సూచనను నిలుపుతూ, నిర్మాణ సందర్భానికి సహజమైన పదజాలం వాడబడింది. ప్రధాన పాఠ్యంలోని [a] గుర్తు సంబంధిత ప్రత్యామ్నాయ పదప్రయోగాన్ని సూచిస్తుంది.
