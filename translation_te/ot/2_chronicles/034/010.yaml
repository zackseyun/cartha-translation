revisions:
- from: వారు దానిని యెహోవా మందిరపు పనిమీద నియమించబడిన పనివారి చేతికి అప్పగించారు. యెహోవా మందిరంలో పనిచేస్తున్న పనివారు మందిరానికి మరమ్మతులు చేసి, దానిని పటిష్ఠపరచడానికి దానిని ఇచ్చారు.[a]
  to: వారు దానిని యెహోవా మందిర పర్యవేక్షణకు నియమించబడిన పనివారి చేతికి అప్పగించారు; వారు దానిని యెహోవా మందిరంలో పని చేస్తున్న పనివారికి, మందిరాన్ని మరమ్మతు చేసి పటిష్ఠపరచడానికి ఇచ్చారు.[a]
  rationale: The revision corrects the clause-level participant relationship required by the Hebrew while retaining the antecedent of “దానిని” as unspecified. It also makes the first group’s assigned responsibility explicit and supplies a genuine, source-supported alternative for the repair-and-strengthen expression.
