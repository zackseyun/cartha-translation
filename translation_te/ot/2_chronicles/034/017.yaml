source:
  edition: WLC
  text: וַ/יַּתִּ֕יכוּ אֶת הַ/כֶּ֖סֶף הַ/נִּמְצָ֣א בְּ/בֵית יְהוָ֑ה וַֽ/יִּתְּנ֗וּ/הוּ עַל יַד֙ הַ/מֻּפְקָדִ֔ים וְ/עַל יַ֖ד עוֹשֵׂ֥י הַ/מְּלָאכָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/017.yaml
  text: They have poured out the silver that was found in the house of Yahweh and have put it into the hands of the overseers and into the hands of those doing the work[a][b].
translation:
  language: te
  text: వారు యాహ్వే మందిరంలో[b] దొరికిన వెండిని బయటకు తీశారు[a]; దానిని పర్యవేక్షకుల చేతికీ, పని చేసేవారి చేతికీ అప్పగించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “బయటకు తీశారు” అనే చోట “ఖాళీ చేశారు” లేదా “విడుదల చేశారు” అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ క్రియకు ఇతర సందర్భాల్లో “కరిగించారు” అనే అర్థం రావచ్చు; అయితే ఇక్కడ వెండిని బాధ్యులకు అప్పగించడం గురించి ఉన్నందున ఆ అర్థం తక్కువ సంభావ్యం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “యాహ్వే గృహం”; అంటే మందిరం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּתִּיכוּ
  choice: బయటకు తీసి
  rationale: ఈ సందర్భంలో క్రియకు వెండిని కరిగించడం కంటే, సేకరించిన ధనాన్ని పాత్రల నుంచి ఖాళీ చేసి బయటకు తీయడం లేదా చెల్లింపుకు విడుదల చేయడం అనే భావం సరిపోతుంది. సహజమైన తెలుగులో ‘బయటకు తీసి’ ఆ సందర్భార్థాన్ని తెలియజేస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: הַכֶּסֶף
  choice: వెండిని
  rationale: כֶּסֶף యొక్క ప్రాథమిక అర్థం ‘వెండి’; సందర్భంలో అది ధనంగా వాడబడుతున్నప్పటికీ మూలపద రూపాన్ని నిలుపుతుంది.
- source_word: הַנִּמְצָא
  choice: దొరికిన
  rationale: నిఫాల్ కృదంతానికి సహజమైన తెలుగు సంబంధవాచక రూపం.
- source_word: בְּבֵית יְהוָה
  choice: యెహోవా మందిరంలో
  rationale: ‘యెహోవా గృహంలో’ అనే రూపక అర్థాన్ని ఆలయ సందర్భంలో సాధారణ పాఠకులకు స్పష్టంగా, సహజంగా తెలిపే రూపం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: וַיִּתְּנֻהוּ
  choice: అప్పగించారు
  rationale: ‘ఇచ్చారు’ అనే ప్రాథమిక భావం ఇక్కడ బాధ్యతగలవారి చేతికి ధనాన్ని అందజేయడాన్ని సూచిస్తుంది; ‘అప్పగించారు’ పరిపాలనా సందర్భాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַל יַד
  choice: చేతికి
  rationale: హీబ్రూ ‘చేతిమీద/చేతికి’ అనే నుడికారాన్ని తెలుగులో అర్థవంతంగా నిలుపుతూ, వారి బాధ్యతకు అప్పగించారనే భావాన్ని ఇస్తుంది.
- source_word: הַמֻּפְקָדִים
  choice: పర్యవేక్షకుల
  rationale: నియమించబడిన బాధ్యుల పర్యవేక్షణ పాత్రను సందర్భానుగుణంగా తెలియజేస్తుంది.
- source_word: עוֹשֵׂי הַמְּלָאכָה
  choice: పని చేస్తున్నవారి
  rationale: నిర్దిష్ట వృత్తిని అనవసరంగా పరిమితం చేయకుండా, పనిలో నిమగ్నులైన వారందరినీ సూచిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన లిప్యంతరీకరణ; ‘యాహ్వే’ కూడా సాధ్యమైన పునర్నిర్మిత ఉచ్చారణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకులకు సులభమైన వాక్యనిర్మాణం. ఆలయ సందర్భంలో ‘గృహం’ బదులు సహజమైన ‘మందిరం’ వాడబడింది. మూలంలోని రెండు עַל־יַד పదబంధాలకు అనుగుణంగా ‘చేతికి’ రెండుసార్లు ఉంచబడింది.
