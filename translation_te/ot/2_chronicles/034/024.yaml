id: 2CH.34.24
reference: 2 Chronicles 34:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י מֵבִ֥יא רָעָ֛ה עַל הַ/מָּק֥וֹם הַ/זֶּ֖ה וְ/עַל יוֹשְׁבָ֑י/ו אֵ֤ת כָּל הָ/אָלוֹת֙ הַ/כְּתוּב֣וֹת עַל הַ/סֵּ֔פֶר אֲשֶׁ֣ר קָֽרְא֔וּ לִ/פְנֵ֖י מֶ֥לֶךְ יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/024.yaml
  text: 'Thus says Yahweh: Behold[b][a], I am bringing disaster on this place and on its inhabitants—all the curses written in the book that they have read before the king of Judah.'
translation:
  language: te
  text: 'యెహోవా ఇలా చెబుతున్నాడు: “ఇదిగో, నేను ఈ స్థలం మీదికీ, దాని నివాసుల మీదికీ విపత్తు రప్పించబోతున్నాను—అంటే, యూదా రాజు సమక్షంలో వారు చదివిన గ్రంథంలో[a] రాసి ఉన్న శాపాలన్నిటినీ[b] రప్పించబోతున్నాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చుట్టగ్రంథంలో.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “ప్రమాణ-శాపాలన్నిటినీ”; అంటే నిబంధనను ఉల్లంఘించినప్పుడు అమలయ్యే శాపాలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని సాధారణ తెలుగు బైబిలు సంప్రదాయంలో గుర్తించదగిన రూపంలో, బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా ఉంచుతుంది.
- source_word: כֹּה אָמַר
  choice: ఇలా చెబుతున్నాడు
  rationale: ప్రవక్త సందేశ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో, దాని అధికారపూర్వక ధోరణిని నిలుపుతూ తెలియజేస్తుంది.
- source_word: הִנְנִי
  choice: ఇదిగో, నేను
  rationale: హెబ్రీ ప్రకటనలోని దృష్టిని ఆకర్షించే గంభీర భావాన్ని నిలుపుతుంది.
- source_word: מֵבִיא רָעָה
  choice: విపత్తు రప్పించబోతున్నాను
  rationale: ఇక్కడ רָעָה నైతిక చెడును కాక తీర్పుగా వచ్చే ఆపదను సూచిస్తుంది; ‘విపత్తు’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: הַמָּקוֹם הַזֶּה
  choice: ఈ స్థలం
  rationale: సందర్భాన్ని మించి యెరూషలేము లేదా యూదా అని ప్రత్యేకంగా చేర్చకుండా మూలంలోని సూచనను నిలుపుతుంది.
- source_word: יוֹשְׁבָיו
  choice: దాని నివాసులు
  rationale: స్థలంలో నివసించేవారిని సూచించే హెబ్రీ భాగాన్ని సహజంగా అనువదిస్తుంది.
- source_word: אֵת כָּל הָאָלוֹת
  choice: శాపాలన్నిటినీ
  rationale: నిబంధన ఉల్లంఘనకు సంబంధించిన శిక్షాత్మక శాపాలను సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; ప్రమాణ సంబంధిత నుడికారాన్ని పాదసూచికలో ఉంచింది.
- source_word: הַכְּתוּבוֹת עַל הַסֵּפֶר
  choice: గ్రంథంలో రాసి ఉన్న
  rationale: వ్రాతపూర్వక నిబంధన పత్రంలోని విషయాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది; భౌతిక రూపం చుట్టగ్రంథం కావచ్చనే అవకాశాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: אֲשֶׁר קָרְאוּ לִפְנֵי
  choice: సమక్షంలో వారు చదివిన
  rationale: మూలంలోని క్రియాశీల బహువచన కర్తను అస్పష్టంగానే ఉంచి, לִפְנֵי యొక్క ‘సమక్షంలో’ భావాన్ని కాపాడుతుంది.
- source_word: מֶלֶךְ יְהוּדָה
  choice: యూదా రాజు
  rationale: హెబ్రీ నిర్మాణానికి నేరుగా సరిపోయే సహజ తెలుగు రూపం.
theological_decisions:
- issue: దైవ తీర్పులో רָעָה స్వభావం
  choice: విపత్తు
  alternative: కీడు / ఆపద
  rationale: సందర్భం నిబంధన శాపాల రూపంలో వచ్చే దైవ తీర్పును సూచిస్తుంది. ‘విపత్తు’ తీర్పు తీవ్రతను నిలుపుతూ దేవుడు నైతిక చెడును చేస్తున్నాడనే అనవసర భావాన్ని కలిగించదు.
- issue: אָלָה యొక్క నిబంధన సంబంధిత భావం
  choice: శాపాలు
  alternative: ప్రమాణ-శాపాలు
  rationale: ప్రధాన పాఠ్యంలో సులభంగా అర్థమయ్యే పదాన్ని వాడి, నిబంధన ప్రమాణంతో ముడిపడిన సాంకేతిక భావాన్ని పాదసూచికలో సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రవక్తీయ స్వరాన్ని ఉంచింది. ‘ఇదిగో’ ప్రకటన బలాన్ని నిలుపుతుంది. మూలంలోని ‘విపత్తు’కు వివరణగా వచ్చే ‘శాపాలన్నిటినీ’ అనే సమానాధికార నిర్మాణాన్ని డాష్ మరియు ‘అంటే’ ద్వారా స్పష్టంచేసింది.
