revisions:
- from: “నీ హృదయం మెత్తబడింది[a]. ఈ స్థలానికీ దాని నివాసులకూ విరోధంగా దేవుడు పలికిన మాటలను నీవు విన్నప్పుడు, ఆయన ఎదుట నిన్ను నీవు తగ్గించుకున్నావు. నా ఎదుట నిన్ను నీవు తగ్గించుకొని, నీ వస్త్రాలు చింపుకొని, నా ఎదుట ఏడ్చావు. అందుచేత నేను కూడా నీ మొర విన్నాను” అని యెహోవా ప్రకటిస్తున్నాడు.
  to: “నీ హృదయం మృదువుగా ఉన్నందున, ఈ స్థలానికీ దాని నివాసులకూ విరోధంగా దేవుడు పలికిన తన మాటలను నీవు విన్నప్పుడు దేవుని ఎదుట నిన్ను నీవు వినయపరచుకున్నందున, నా ఎదుట నిన్ను నీవు వినయపరచుకొని నీ వస్త్రాలు చింపుకొని నా ఎదుట ఏడ్చినందున, నేను కూడా విన్నాను,” అని యెహోవా ప్రకటిస్తున్నాడు.
  rationale: The revision restores the Hebrew's repeated causal framing, uses an adjectival Telugu expression for the tender heart, retains the repeated “before me,” and removes the unsupported specification “your plea.” The Hebrew's unexpressed object after “I also have heard” is left unexpressed in Telugu. A footnote marker is retained on “మృదువుగా” to preserve the documented lexical alternative.
