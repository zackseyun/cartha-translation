source:
  edition: WLC
  text: יַ֠עַן רַךְ לְבָ֨בְ/ךָ֜ וַ/תִּכָּנַ֣ע מִ/לִּ/פְנֵ֣י אֱלֹהִ֗ים בְּ/שָׁמְעֲ/ךָ֤ אֶת דְּבָרָי/ו֙ עַל הַ/מָּק֤וֹם הַ/זֶּה֙ וְ/עַל יֹ֣שְׁבָ֔י/ו וַ/תִּכָּנַ֣ע לְ/פָנַ֔/י וַ/תִּקְרַ֥ע אֶת בְּגָדֶ֖י/ךָ וַ/תֵּ֣בְךְּ לְ/פָנָ֑/י וְ/גַם אֲנִ֥י שָׁמַ֖עְתִּי נְאֻם יְהוָֽה־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/027.yaml
  text: Because your heart was tender[a], and you humbled yourself before God when you heard his words against this place and against its inhabitants, and because you humbled yourself before me and tore your clothes and wept before me, I also have heard you, declares Yahweh.
translation:
  language: te
  text: “నీ హృదయం మృదువుగా ఉన్నందున, ఈ స్థలానికీ దాని నివాసులకూ విరోధంగా దేవుడు పలికిన తన మాటలను నీవు విన్నప్పుడు దేవుని ఎదుట నిన్ను నీవు వినయపరచుకున్నందున, నా ఎదుట నిన్ను నీవు వినయపరచుకొని నీ వస్త్రాలు చింపుకొని నా ఎదుట ఏడ్చినందున, నేను కూడా విన్నాను,” అని యెహోవా ప్రకటిస్తున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעַן
  choice: అందుచేత
  rationale: ఈ పదం దేవుని అనుకూల ప్రతిస్పందనకు ముందు చెప్పిన చర్యలే కారణమని సూచిస్తుంది. దీర్ఘమైన హీబ్రూ కారణ వాక్య నిర్మాణాన్ని తెలుగులో సహజంగా ముగించేందుకు చివరి ఉపవాక్యంలో ఉంచాం.
- source_word: רַךְ לְבָבְךָ
  choice: నీ హృదయం మెత్తబడింది
  rationale: רַךְ యొక్క ‘మెత్తని/మృదువైన’ భావాన్ని నిలుపుతూ, ఇక్కడ బలహీనతను కాక దేవుని మాటకు స్పందించే వినయపూర్వక అంతరంగ స్థితిని సూచిస్తుంది.
- source_word: וַתִּכָּנַע
  choice: నిన్ను నీవు తగ్గించుకున్నావు
  rationale: כנע నిఫాల్ రూపంలోని స్వయంగా వినయపడే భావాన్ని రెండు సందర్భాల్లోనూ ఒకే విధంగా నిలుపుతుంది.
- source_word: מִלִּפְנֵי אֱלֹהִים
  choice: ఆయన ఎదుట
  rationale: ‘దేవుని ఎదుట’ అనే సన్నిధి భావాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది; వెంటనే ముందు వచ్చిన ‘దేవుడు’నే సర్వనామం సూచిస్తుంది.
- source_word: בְּשָׁמְעֲךָ
  choice: నీవు విన్నప్పుడు
  rationale: ב + infinitive construct యొక్క కాలసంబంధ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: דְּבָרָיו
  choice: దేవుడు పలికిన మాటలను
  rationale: సందర్భంలో ప్రత్యయం దేవునినే సూచిస్తుంది. ‘పలికిన మాటలు’ మూలంలోని ‘మాటలు’ అనే పదార్థాన్ని ఉంచి తెలుగులో సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: ఈ స్థలానికీ దాని నివాసులకూ విరోధంగా
  rationale: తీర్పు సందర్భంలో עַל కు ఉన్న ప్రతికూల దిశను ‘విరోధంగా’ తెలియజేస్తుంది; రెండు లక్ష్యాలనూ స్పష్టంగా ఉంచుతుంది.
- source_word: לְפָנַי
  choice: నా ఎదుట
  rationale: దేవుని ప్రత్యక్ష వాక్యంలో వ్యక్తిగత సన్నిధి భావాన్ని, మూలంలోని పునరుక్తితో సహా నిలుపుతుంది.
- source_word: וַתִּקְרַע אֶת בְּגָדֶיךָ
  choice: నీ వస్త్రాలు చింపుకొని
  rationale: శోకం, పశ్చాత్తాపం సూచించే కార్యాన్ని గంభీరమైనప్పటికీ సాధారణంగా అర్థమయ్యే తెలుగులో అందిస్తుంది.
- source_word: וַתֵּבְךְּ
  choice: ఏడ్చావు
  rationale: సందర్భంలోని గాఢమైన శోకాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְגַם אֲנִי שָׁמַעְתִּי
  choice: నేను కూడా నీ మొర విన్నాను
  rationale: మూలంలో ప్రత్యక్ష కర్మ లేకున్నా, సందర్భం దేవుడు యోషీయా ప్రార్థనాత్మక రోదనను ఆలకించాడని సూచిస్తుంది. ‘నీ మొర’ తెలుగు వాక్యాన్ని సహజం చేస్తుంది; ఇది వ్యాఖ్యాత్మక స్పష్టీకరణ.
- source_word: נְאֻם יְהוָה
  choice: అని యెహోవా ప్రకటిస్తున్నాడు
  rationale: ప్రవచన అధికారాన్ని తెలిపే సూత్రవాక్యాన్ని నిలుపుతూ, יהוה అనే ఒడంబడిక నామాన్ని ‘యెహోవా’గా లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో సాధారణ బిరుదు కాక టెట్రాగ్రామటన్ నేరుగా ఉంది. తెలుగు బైబిల్ పాఠకులకు విస్తృతంగా పరిచితమైన నామరూపం ‘యెహోవా’; దానిని బిరుదుతో భర్తీ చేయలేదు.
- issue: ‘విన్నాను’ అనే మాటకు కర్మను తెలుగులో స్పష్టం చేయడం
  choice: నీ మొర విన్నాను
  alternative: నేను కూడా విన్నాను; నీ మాట విన్నాను
  rationale: హీబ్రూలో కర్మ వ్యక్తంగా లేదు. సందర్భంలోని ఏడుపు, వినయం దేవుని ఆలకింపుకు నేపథ్యం; ‘నీ మొర’ సహజ తెలుగు అయినప్పటికీ మూలంలోని అనిర్దిష్టతను కొంత తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభగ్రాహ్యమైన శైలి. హీబ్రూ వాక్యంలోని పునరుక్తిని సాధ్యమైనంతవరకు ఉంచుతూ, తెలుగులో భారంగా కాకుండా కారణ నిర్మాణాన్ని పునర్వ్యవస్థీకరించాం.
