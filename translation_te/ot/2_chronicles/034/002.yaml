reference: 2 Chronicles 34:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/דַרְכֵי֙ דָּוִ֣יד אָבִ֔י/ו וְ/לֹא סָ֖ר יָמִ֥ין וּ/שְׂמֹֽאול־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/002.yaml
  text: He did what was right in the eyes of Yahweh[a], and walked in the ways of David his father[b]; he did not turn aside to the right or to the left.
translation:
  language: te
  text: అతడు యాహ్వే[a] దృష్టిలో సరైనది చేశాడు; తన పూర్వికుడైన[b] దావీదు మార్గాల్లో నడిచాడు. కుడివైపుకైనా ఎడమవైపుకైనా మళ్లలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యాహ్వే దృష్టిలో.’
    reason: lexical_alternative
  - marker: b
    text: మూలంలో ‘తండ్రి’; ఇక్కడ దావీదు ప్రత్యక్ష తండ్రి కాదు, రాజవంశ పూర్వికుడు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: సరైనది చేశాడు
  rationale: రాజును నైతికంగా అంచనా వేసే ఈ సూత్రప్రాయ వాక్యంలో עשה ‘చేయు,’ הַיָּשָׁר ‘సరైనది’ అనే భావాలను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టికి
  rationale: అక్షరార్థంలోని ‘కళ్లలో’ అనే హీబ్రూ రూపకాన్ని తెలుగులో సహజంగా వినిపించే ‘దృష్టికి’ అనే దైవిక అంచనా నుడికారంతో అందించింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని సాధారణ తెలుగు బైబిలు వాడుకలో గుర్తించదగిన వ్యక్తినామ రూపంగా లిప్యంతరీకరించింది.
- source_word: וַיֵּלֶךְ בְּדַרְכֵי
  choice: మార్గాల్లో నడిచాడు
  rationale: నడక/మార్గం అనే హీబ్రూ నైతిక జీవన రూపకాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: דָּוִיד אָבִיו
  choice: తన పితరుడైన దావీదు
  rationale: אָב ఇక్కడ ప్రత్యక్ష తండ్రిని కాక రాజవంశ పూర్వికుణ్ణి సూచిస్తుంది; ‘పితరుడు’ ఆ వంశపారంపర్య భావాన్ని ప్రధాన పాఠ్యంలోనే సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וְלֹא סָר יָמִין וּשְׂמֹאול
  choice: కుడికిగాని ఎడమకిగాని తొలగలేదు
  rationale: నిర్దేశిత మార్గం నుంచి ఏ వైపుకూ మళ్లకపోవడాన్ని తెలిపే మూలభాషా నుడికారాన్నీ, మార్గ రూపకాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠ్యంలో సాధారణ బిరుదు కాక దేవుని ప్రత్యేక నామం ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా, తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన వ్యక్తినామ రూపంలో ఇచ్చింది.
- issue: דָּוִיד אָבִיו లో אָב యొక్క సంబంధార్థం
  choice: పితరుడు
  alternative: తండ్రి; పూర్వికుడు
  rationale: యోషీయాకు దావీదు ప్రత్యక్ష తండ్రి కాదు. రాజవంశ సంబంధాన్ని కాపాడుతూ అపార్థాన్ని నివారించడానికి ‘పితరుడు’ ఎంచుకుంది; వంశపూర్విక భావాన్ని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ‘మార్గాల్లో నడిచాడు,’ ‘కుడికిగాని ఎడమకిగాని తొలగలేదు’ అనే పరస్పర సంబంధిత రూపకాలు ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి.
