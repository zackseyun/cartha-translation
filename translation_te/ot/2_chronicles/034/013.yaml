review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the burden-bearers, the supervisory function, the partitive reference to Levites, and the three Levite offices. However, “బరువులు మోసేవారికి పైవారిగా” is an unnatural and imprecise way to express administrative authority over the carriers. The repeated Hebrew עֲבוֹדָה is better represented as distributive work/task language rather than as “సేవ,” which can suggest religious service more narrowly than the source requires.
  naturalness: “పైవారిగా” is not idiomatic modern standard Telugu in this administrative sense. “బరువులు మోసేవారిపై అధికారులుగా” is clear and natural. The revised wording also makes the relationship between the workers and their various tasks more readable.
  terminology: “లేవీయులు,” “లేఖకులు,” “అధికారులు,” and “ద్వారపాలకులు” are appropriate. “పని” is preferable to “సేవ” here for עֲבוֹדָה, while “ఒక్కో పనికోసం” retains the likely distributive force of the Hebrew repetition without artificially reproducing it.
  issues:
  - severity: medium
    issue: Unidiomatic rendering of administrative oversight
    rationale: “బరువులు మోసేవారికి పైవారిగా” literally suggests being superior persons ‘to’ the carriers and is not natural Telugu. The Hebrew עַל indicates authority over them.
  - severity: low
    issue: “సేవ” may over-narrow the repeated עֲבוֹדָה
    rationale: In this construction, עֲבוֹדָה denotes work or task broadly. “ఒక్కో పనికోసం” expresses the distributive sense while avoiding an unwarranted restriction to religious service.
  revised_text: వారు బరువులు మోసేవారిపై అధికారులుగా ఉండి, ఒక్కో పనికోసం పని చేసేవారందరినీ పర్యవేక్షించారు; లేవీయుల్లో కొందరు లేఖకులు, అధికారులు, ద్వారపాలకులు.
  revised_footnotes: []
  revision_rationale: The revision replaces the unnatural expression for being over the burden-bearers with an idiomatic administrative expression and renders the repeated Hebrew phrase as distributive “ఒక్కో పనికోసం.” It retains the source’s partitive sense that some Levites held the listed offices.
