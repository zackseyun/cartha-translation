language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַ֣ל הַ/סַּבָּלִ֗ים וּֽ/מְנַצְּחִים֙ לְ/כֹל֙ עֹשֵׂ֣ה מְלָאכָ֔ה לַ/עֲבוֹדָ֖ה וַ/עֲבוֹדָ֑ה וּ/מֵֽ/הַ/לְוִיִּ֔ם סוֹפְרִ֥ים וְ/שֹׁטְרִ֖ים וְ/שׁוֹעֲרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/013.yaml
  text: They were over the burden-bearers and supervised everyone doing work for service after service; and some of the Levites were scribes[a], officers, and gatekeepers.
translation:
  language: te
  text: వారు బరువులు మోసేవారిపై అధికారులుగా ఉండి, ఒక్కో పనికోసం పని చేసేవారందరినీ పర్యవేక్షించారు; లేవీయుల్లో కొందరు లేఖకులు, అధికారులు, ద్వారపాలకులు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל הַסַּבָּלִים
  choice: బరువులు మోసేవారికి పైవారిగా ఉండి
  rationale: సַבָּלִים అనేది ప్రత్యేకంగా బరువులు మోసేవారిని సూచిస్తుంది; עַל ఈ పరిపాలనా సందర్భంలో వారిపై పర్యవేక్షణాధికారం ఉన్నదనే భావాన్ని ఇస్తుంది.
- source_word: וּמְנַצְּחִים
  choice: పర్యవేక్షించారు
  rationale: נצח ధాతువు యొక్క ఈ రూపం పని నిర్వహణను పర్యవేక్షించడం లేదా నడిపించడం అనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో క్రియారూపం సహజంగా ఉంది.
- source_word: לְכֹל עֹשֵׂה מְלָאכָה
  choice: పని చేసేవారందరినీ
  rationale: మూలంలోని సమగ్ర, వర్తమాన క్రియార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לַעֲבוֹדָה וַעֲבוֹדָה
  choice: ఒక్కొక్క సేవలో
  rationale: ‘సేవ మరియు సేవ’ అనే హీబ్రూ పునరుక్తికి ఇక్కడ విభజనాత్మక భావం ఉంది—వివిధ సేవా పనుల్లో ఒక్కొక్కదానిని సూచిస్తుంది. పదానుపద పునరుక్తి తెలుగులో అసహజంగా ఉండేందున దాని భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וּמֵהַלְוִיִּם
  choice: లేవీయుల్లో కొందరు
  rationale: מִן ఇక్కడ భాగార్థకం; తరువాత పేర్కొన్న బాధ్యతలను లేవీయులలో కొందరు నిర్వహించారని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: סוֹפְרִים
  choice: లేఖకులు
  rationale: లిఖితపని లేదా నమోదుల బాధ్యత వహించే వారిని సూచించే స్థిరమైన తెలుగు సమానార్థకం.
- source_word: שֹׁטְרִים
  choice: అధికారులు
  rationale: పరిపాలనా లేదా పర్యవేక్షణ బాధ్యతగల అధికారులను సూచిస్తుంది; ‘అధికారులు’ సందర్భానికి విస్తృతంగానూ సహజంగానూ సరిపోతుంది.
- source_word: שׁוֹעֲרִים
  choice: ద్వారపాలకులు
  rationale: ఆలయ ద్వారాల వద్ద నియమించబడిన కాపలాదారులను సూచించే స్థిరమైన, గౌరవప్రదమైన తెలుగు పదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని పరిపాలనా భావాన్ని నిలిపి, לַעֲבוֹדָה וַעֲבוֹדָה పునరుక్తి సూచించే విభజనాత్మక భావాన్ని ‘ఒక్కొక్క సేవలో’ అని అందించాం.
