revisions:
- from: వారు బరువులు మోసేవారికి పైవారిగా ఉండి, పని చేసేవారందరినీ ఒక్కొక్క సేవలో పర్యవేక్షించారు; లేవీయుల్లో కొందరు లేఖకులుగా, అధికారులుగా, ద్వారపాలకులుగా పనిచేశారు.
  to: వారు బరువులు మోసేవారిపై అధికారులుగా ఉండి, ఒక్కో పనికోసం పని చేసేవారందరినీ పర్యవేక్షించారు; లేవీయుల్లో కొందరు లేఖకులు, అధికారులు, ద్వారపాలకులు.
  rationale: The revision replaces the unnatural expression for being over the burden-bearers with an idiomatic administrative expression and renders the repeated Hebrew phrase as distributive “ఒక్కో పనికోసం.” It retains the source’s partitive sense that some Levites held the listed offices.
