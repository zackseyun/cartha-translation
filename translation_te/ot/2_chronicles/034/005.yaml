source:
  edition: WLC
  text: וְ/עַצְמוֹת֙ כֹּֽהֲנִ֔ים שָׂרַ֖ף עַל מזבחותים וַ/יְטַהֵ֥ר אֶת יְהוּדָ֖ה וְ/אֶת יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/005.yaml
  text: He burned the bones of the priests on their altars[a], and he cleansed Judah and Jerusalem.
translation:
  language: te
  text: అతడు యాజకుల ఎముకలను వారి బలిపీఠాల మీద కాల్చి[a], యూదాను, యెరూషలేమును శుద్ధిచేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆ బలిపీఠాల మీద.’ ఇక్కడి హీబ్రూ రూపం అసాధారణంగా ఉంది; యోషీయా ఆ యాజకులతో సంబంధమున్న బలిపీఠాల మీద వారి ఎముకలను కాల్చాడనేది భావం.
    reason: textual_variant
lexical_decisions:
- source_word: וְ/עַצְמוֹת כֹּהֲנִים
  choice: యాజకుల ఎముకలను
  rationale: עַצְמוֹת అనేది עֶצֶם పదానికి బహువచన construct రూపం; ఇక్కడ నిజమైన ఎముకలను సూచిస్తుంది. כֹּהֲנִיםను మూలంలో ఉన్నట్లే ‘యాజకులు’గా ఉంచి, ‘విగ్రహారాధక’ అనే వివరణను చేర్చలేదు.
- source_word: שָׂרַף
  choice: కాల్చి
  rationale: Qal perfect 3ms రూపం; ‘కాల్చాడు’ అనే భావాన్ని సహజమైన తెలుగు సంయుక్త వాక్యంలో ‘కాల్చి’గా వ్యక్తం చేశాం.
- source_word: עַל מזבחותים
  choice: వారి బలిపీఠాల మీద
  rationale: עַלకు సహజ సమానం ‘మీద’. అసాధారణమైన מזבחותים రూపాన్ని సందర్భానుసారం సర్వనామార్థంతో ‘వారి బలిపీఠాలు’గా ప్రధాన పాఠంలో ఇచ్చాం; రూపంలోని అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
- source_word: וַ/יְטַהֵר
  choice: శుద్ధిచేశాడు
  rationale: Piel wayyiqtol రూపమైన טהר ఇక్కడ అక్రమ ఆరాధనవల్ల కలిగిన అపవిత్రతను తొలగించడాన్ని సూచిస్తుంది. ‘శుద్ధిచేశాడు’ ఆచార సంబంధమైన భావాన్ని, విస్తృత నైతిక భావాన్ని రెండింటినీ అతిశయింపకుండా అందిస్తుంది.
- source_word: אֶת יְהוּדָה וְ/אֶת יְרוּשָׁלִָם
  choice: యూదాను, యెరూషలేమును
  rationale: אֶת గుర్తించిన ప్రత్యక్ష కర్మలను తెలుగులో ద్వితీయా విభక్తితో వ్యక్తం చేశాం. స్థిరపడిన తెలుగు బైబిలు నామరూపాలను వాడాం.
theological_decisions:
- issue: శుద్ధీకరణ స్వభావం
  choice: విగ్రహారాధన సంబంధమైన అపవిత్రత నుండి దేశాన్ని, నగరాన్ని శుద్ధిచేయడం
  alternative: కేవలం ఆచారపరమైన పవిత్రీకరణ; లేదా భౌతికంగా తొలగించడం మాత్రమే
  rationale: సంస్కరణ సందర్భంలో טהר అక్రమ ఆరాధనకు సంబంధించిన అపవిత్రతను తొలగించడాన్ని సూచిస్తుంది. ‘శుద్ధిచేశాడు’ అనే పదం ఆచార-నైతిక ఉద్వేగాన్ని నిలుపుతూ, తరువాతి సిద్ధాంత భావాన్ని పాఠంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. వాక్య క్రమాన్ని తెలుగు ప్రవాహానికి అనుగుణంగా ఉంచుతూ, హీబ్రూ పాఠంలోని కార్యాల వరుసను కాపాడాం.
