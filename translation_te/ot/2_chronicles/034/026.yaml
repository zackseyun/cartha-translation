- from: 'అయితే, యహ్వేను విచారించడానికి[a] మిమ్మల్ని పంపిన యూదా రాజుతో మీరు ఇలా చెప్పాలి: “ఇశ్రాయేలు దేవుడైన యహ్వే ఇలా అంటున్నాడు: నీవు విన్న మాటల విషయమైతే—”'
  to: 'అయితే, యహ్వేను అడిగి తెలుసుకోవడానికి[a] మిమ్మల్ని పంపిన యూదా రాజుకు మీరు ఇలా చెప్పాలి: “ఇశ్రాయేలు దేవుడైన యహ్వే ఇలా అంటున్నాడు: నీవు విన్న మాటల విషయానికి వస్తే—”'
