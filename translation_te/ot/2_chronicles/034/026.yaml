id: 2CH.34.26
reference: 2 Chronicles 34:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶל מֶ֣לֶךְ יְהוּדָ֗ה הַ/שֹּׁלֵ֤חַ אֶתְ/כֶם֙ לִ/דְר֣וֹשׁ בַּֽ/יהוָ֔ה כֹּ֥ה תֹאמְר֖וּ אֵלָ֑י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/דְּבָרִ֖ים אֲשֶׁ֥ר שָׁמָֽעְתָּ־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/026.yaml
  text: 'But to the king of Judah[a], who sent you to inquire of Yahweh, thus you shall say to him: ‘Thus says Yahweh, the God of Israel: As for the words that you have heard—’'
translation:
  language: te
  text: 'అయితే, యహ్వేను అడిగి తెలుసుకోవడానికి[a] మిమ్మల్ని పంపిన యూదా రాజుకు మీరు ఇలా చెప్పాలి: “ఇశ్రాయేలు దేవుడైన యహ్వే ఇలా అంటున్నాడు: నీవు విన్న మాటల విషయానికి వస్తే—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యహ్వేను వెదకడానికి,” లేదా “యహ్వేను సంప్రదించడానికి.” హీబ్రూ క్రియకు వెదకడం అనే భావంతోపాటు, ప్రవచన సందర్భంలో దేవునిని అడిగి తెలుసుకోవడం అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל
  choice: అయితే, ... రాజుతో
  rationale: וְ ఇక్కడ ముందటి సందేశం నుంచి యూదా రాజుకు ఉద్దేశించిన ప్రత్యేక సందేశానికి మార్పును సూచిస్తుంది. ‘అయితే’ ఆ సందర్భానుసార వ్యత్యాసాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; אֶל యొక్క దిశార్థాన్ని ‘రాజుతో ... చెప్పాలి’ అనే నిర్మాణం వ్యక్తం చేస్తుంది.
- source_word: מֶלֶךְ יְהוּדָה
  choice: యూదా రాజు
  rationale: హీబ్రూ సమాస నిర్మాణానికి సహజమైన, స్పష్టమైన తెలుగు రూపం.
- source_word: הַשֹּׁלֵחַ אֶתְכֶם
  choice: మిమ్మల్ని పంపిన
  rationale: నిర్దిష్ట ఆర్టికల్‌తో ఉన్న కృదంతం రాజును గుర్తించే విశేషణ ఉపవాక్యంగా పనిచేస్తుంది. אֶתְכֶם బహువచనాన్ని ‘మిమ్మల్ని’గా నిలిపింది.
- source_word: לִדְרוֹשׁ בַּיהוָה
  choice: యహ్వేను విచారించడానికి
  rationale: דרשׁ + ב ఇక్కడ ప్రవక్త ద్వారా దేవుని సమాధానం కోరే సందర్భంలో ‘విచారించు/అడిగి తెలుసుకో’ అనే అర్థాన్ని ఇస్తుంది. ‘విచారించడానికి’ ఆ ప్రత్యేక సందర్భాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది; విస్తృతమైన ‘వెదకడం’ భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు లిపిలో దగ్గరి ధ్వన్యంతరీకరణగా ఇచ్చాం.
- source_word: כֹּה תֹאמְרוּ אֵלָיו
  choice: మీరు ఇలా చెప్పాలి
  rationale: כֹּה యొక్క సందేశ-సూత్రాన్ని ‘ఇలా’గా, ఆదేశ బలాన్ని ‘చెప్పాలి’గా సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేసింది.
- source_word: כֹּה אָמַר יְהוָה
  choice: యహ్వే ఇలా అంటున్నాడు
  rationale: ప్రవచన సందేశాన్ని పరిచయం చేసే స్థిర సూత్రాన్ని వర్తమాన తెలుగు రూపంలో నిలిపింది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: మూలంలోని సంబంధ సమాసాన్ని నేరుగా, సహజంగా వ్యక్తం చేసింది.
- source_word: הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ
  choice: నీవు విన్న మాటల విషయమైతే—
  rationale: ఈ పదబంధం వాక్యారంభంలో అంశంగా నిలబడి, భావపూర్తి తరువాతి వచనంలో వస్తుంది. ‘విషయమైతే—’ మరియు దీర్ఘరేఖ ఆ అసంపూర్ణతను బలవంతంగా పరిష్కరించకుండా నిలుపుతాయి; שָׁמָעְתָּ ఏకవచనాన్ని ‘నీవు’గా కాపాడింది.
theological_decisions:
- issue: יְהוָה దైవనామాన్ని ఎలా అందించాలి
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని సాధారణ బిరుదైన ‘ప్రభువు’గా మార్చకుండా ఉంచడం మూలానికి దగ్గరగా ఉంటుంది; ‘యహ్వే’ సాధారణంగా అంగీకరించబడిన పునర్నిర్మిత ఉచ్చారణకు దగ్గరి తెలుగు రూపం.
- issue: הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ అనే ముందుంచిన అంశం
  choice: నీవు విన్న మాటల విషయమైతే—
  alternative: నీవు విన్న మాటల గురించి
  rationale: హీబ్రూలో ఈ భాగం ముందుంచిన అంశంగా ఉండి, వాక్యం తరువాతి వచనంలో కొనసాగుతుంది. అసంపూర్ణతను అలాగే ఉంచడం మూలంలోని వాక్య నిర్మాణాన్ని, దాని ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ప్రతినిధుల బహువచనం (‘మిమ్మల్ని’, ‘మీరు’) మరియు రాజును ఉద్దేశించిన ఏకవచనం (‘నీవు’) వేరు చేసి నిలిపాం. పాదటిప్పణి గుర్తును అది వివరిస్తున్న ‘విచారించడానికి’ పదబంధం వెంట ఉంచాం.
