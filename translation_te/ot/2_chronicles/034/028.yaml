revisions:
- from: ‘ఇదిగో, నేను నిన్ను నీ పితరుల దగ్గరకు చేర్చబోతున్నాను[a]. నీవు సమాధానంతో నీ సమాధుల దగ్గరకు చేర్చబడతావు[b][c]. నేను ఈ స్థలం మీదికి, దాని నివాసుల మీదికి రప్పిస్తున్న విపత్తంతటినీ నీ కళ్లు చూడవు.’ అప్పుడు వారు రాజుకు ఆ మాటను తిరిగి తెలియజేశారు.
  to: ‘ఇదిగో, నేను నిన్ను నీ పితరుల దగ్గరకు చేర్చబోతున్నాను[a]. నీవు శాంతితో నీ సమాధులలో చేర్చబడతావు[b][c]. నేను ఈ స్థలంపైకి, దాని నివాసులపైకి రప్పిస్తున్న విపత్తంతటినీ నీ కళ్లు చూడవు.’ అప్పుడు వారు రాజుకు ఆ మాటను తిరిగి తెలియజేశారు.
  rationale: The revision makes the burial idiom precise in natural Telugu, replaces a potentially misleading modern expression with the standard broad equivalent ‘శాంతితో,’ and changes ‘మీదికి’ to the smoother judgment-target construction ‘పైకి.’ It retains the Hebrew plural ‘సమాధులు,’ the ancestral idiom, and the textual ambiguity concerning ‘in peace.’
