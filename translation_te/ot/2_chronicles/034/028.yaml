review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the two linked Hebrew gathering expressions, the explicit ‘your eyes’ subject, the scope of the coming calamity, and the concluding report to the king. However, ‘నీ సమాధుల దగ్గరకు’ means ‘near your graves’ rather than being gathered into burial, and thus weakens the funerary sense of אֶל קִבְרֹתֶיךָ.
  naturalness: ‘శాంతితో’ is the natural modern-standard Telugu equivalent for בְּשָׁלוֹם in this elevated narrative register. ‘నీ సమాధులలో చేర్చబడతావు’ naturally conveys burial while retaining the source plural, which is explained in the footnote.
  terminology: ‘పితరులు’ suitably retains the Hebrew ancestral-death idiom, with a helpful explanatory note. ‘విపత్తు’ appropriately renders רָעָה in this judgment context. The footnote on ‘శాంతితో’ properly avoids claiming that Josiah’s death must have been nonviolent.
  issues:
  - severity: medium
    issue: ‘నీ సమాధుల దగ్గరకు చేర్చబడతావు’ is spatially imprecise.
    rationale: దగ్గరకు means ‘to/near the vicinity of’; the Hebrew burial idiom states that he will be gathered to his burial place(s). ‘నీ సమాధులలో చేర్చబడతావు’ conveys the intended funerary destination naturally.
  - severity: low
    issue: ‘సమాధానంతో’ is less idiomatic here than ‘శాంతితో.’
    rationale: While semantically related, ‘సమాధానంతో’ can suggest reconciliation or agreement in contemporary Telugu. ‘శాంతితో’ is the established, broad equivalent of בְּשָׁלוֹם and retains the verse’s deliberate ambiguity.
  revised_text: ‘ఇదిగో, నేను నిన్ను నీ పితరుల దగ్గరకు చేర్చబోతున్నాను[a]. నీవు శాంతితో నీ సమాధులలో చేర్చబడతావు[b][c]. నేను ఈ స్థలంపైకి, దాని నివాసులపైకి రప్పిస్తున్న విపత్తంతటినీ నీ కళ్లు చూడవు.’ అప్పుడు వారు రాజుకు ఆ మాటను తిరిగి తెలియజేశారు.
