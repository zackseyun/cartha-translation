  text: הִנְ/נִ֨י אֹֽסִפְ/ךָ֜ אֶל אֲבֹתֶ֗י/ךָ וְ/נֶאֱסַפְתָּ֣ אֶל קִבְרֹתֶי/ךָ֮ בְּ/שָׁלוֹם֒ וְ/לֹא תִרְאֶ֣ינָה עֵינֶ֔י/ךָ בְּ/כֹל֙ הָֽ/רָעָ֔ה אֲשֶׁ֨ר אֲנִ֥י מֵבִ֛יא עַל הַ/מָּק֥וֹם הַ/זֶּ֖ה וְ/עַל יֹשְׁבָ֑י/ו וַ/יָּשִׁ֥יבוּ אֶת הַ/מֶּ֖לֶךְ דָּבָֽר־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/028.yaml
  text: Behold[a], I am about to gather you to your fathers, and you will be gathered to your graves in peace[c][b], and your eyes will not see all the disaster that I am bringing on this place and on its inhabitants.’ And they brought back word to the king.
translation:
  language: te
  text: ‘ఇదిగో, నేను నిన్ను నీ పితరుల దగ్గరకు చేర్చబోతున్నాను[a]. నీవు శాంతితో నీ సమాధులలో చేర్చబడతావు[b][c]. నేను ఈ స్థలంపైకి, దాని నివాసులపైకి రప్పిస్తున్న విపత్తంతటినీ నీ కళ్లు చూడవు.’ అప్పుడు వారు రాజుకు ఆ మాటను తిరిగి తెలియజేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పితరులు’ అంటే ఇక్కడ పూర్వీకులు. ఇది మరణంలో తన పూర్వీకులతో చేరడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: ‘శాంతితో’ అంటే యోషీయా రాబోయే విపత్తును చూడకముందే మరణిస్తాడనే భావం కావచ్చు, అని తరువాతి వాక్యభాగం సూచిస్తుంది; అతని మరణం హింసారహితంగా ఉంటుందని ఇది తప్పనిసరిగా సూచించదు.
    reason: cross_reference
  - marker: c
    text: ‘నీ సమాధులు’ అని హీబ్రూ మూలంలో బహువచనం ఉంది; ఇది పితరుల సమాధుల ప్రదేశాన్ని లేదా కుటుంబ సమాధి సముదాయాన్ని సూచించవచ్చు.
    reason: source_form
lexical_decisions:
- source_word: הִנְנִי
  choice: ఇదిగో, నేను ... చేర్చబోతున్నాను
  rationale: ‘ఇదిగో’ అనే సంభాషణ సూచకం ప్రకటనలోని తక్షణత్వాన్ని నిలుపుతుంది; కృదంత నిర్మాణంలోని సమీప భవిష్యత్తు భావాన్ని ‘బోతున్నాను’ తెలియజేస్తుంది.
- source_word: אֹסִפְךָ אֶל אֲבֹתֶיךָ
  choice: నిన్ను నీ పితరుల దగ్గరకు చేర్చబోతున్నాను
  rationale: మరణంలో పూర్వీకులతో కలవడాన్ని సూచించే హీబ్రూ రూపకాన్ని సాధ్యమైనంతగా నిలుపుతూ, ఆధునిక తెలుగులో అర్థమయ్యేలా ఉంది.
- source_word: וְנֶאֱסַפְתָּ אֶל קִבְרֹתֶיךָ
  choice: నీవు ... నీ సమాధుల దగ్గరకు చేర్చబడతావు
  rationale: మునుపటి אָסַף క్రియతో ఉన్న పదబంధ సంబంధాన్ని, అలాగే קִבְרֹתֶיךָ అనే బహువచన రూపాన్ని నిలుపుతుంది.
- source_word: בְּשָׁלוֹם
  choice: సమాధానంతో
  rationale: శ్రేయస్సు, క్షేమం, విపత్తును చూడకముందే మరణించడం వంటి విస్తృత భావానికి చోటిస్తూ, మరణం తప్పనిసరిగా హింసారహితమని నిర్ధారించదు.
- source_word: וְלֹא תִרְאֶינָה עֵינֶיךָ
  choice: నీ కళ్లు చూడవు
  rationale: మూలంలోని శరీరాంగ ప్రస్తావనను, దాని సజీవమైన ఉద్ఘాటనను నిలుపుతుంది.
- source_word: בְּכֹל הָרָעָה
  choice: విపత్తంతటినీ
  rationale: తీర్పు సందర్భంలో רָעָה నైతిక చెడుకన్నా రాబోయే కీడు లేదా విపత్తును సూచిస్తుంది.
- source_word: אֲנִי מֵבִיא
  choice: నేను ... రప్పిస్తున్న
  rationale: కృదంతం సూచించే నిర్ణయించబడిన, సమీపిస్తున్న కార్యభావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: ఈ స్థలం మీదికి, దాని నివాసుల మీదికి
  rationale: తీర్పు లక్ష్యమైన స్థలాన్నీ అక్కడి ప్రజలనూ మూలానికి సన్నిహితంగా, స్పష్టంగా తెలుపుతుంది.
- source_word: וַיָּשִׁיבוּ אֶת הַמֶּלֶךְ דָּבָר
  choice: వారు రాజుకు ఆ మాటను తిరిగి తెలియజేశారు
  rationale: విచారణకు సమాధానంగా సందేశాన్ని తీసుకువచ్చి రాజుకు నివేదించారనే హీబ్రూ నుడికార భావాన్ని సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: యోషీయా తరువాత యుద్ధంలో మరణించిన నేపథ్యంలో ‘సమాధానంతో’ అనే వాగ్దానం అర్థం
  choice: రాబోయే విపత్తును చూడకముందే యోషీయా తన పితరులతో చేరతాడనే భావాన్ని ప్రధానంగా నిలుపడం
  alternative: అతని మరణం బాహ్యంగా పూర్తిగా శాంతియుతంగా ఉంటుందని చదవడం; లేదా ఇది కేవలం గౌరవప్రదమైన సమాధిని సూచిస్తుందని చదవడం
  rationale: తరువాతి వాక్యభాగమే అతని కళ్లు విపత్తును చూడవని వివరిస్తుంది. అయితే ‘సమాధానంతో’ అనే పదాన్ని ఆ వివరణకే పూర్తిగా పరిమితం చేయకుండా, వచనంలోని ఉద్రిక్తతను నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘పితరులు,’ ‘సమాధానంతో’ వంటి బైబిలీయ పదాలను సందర్భాన్ని స్పష్టం చేసే పాదటిప్పణులతో నిలుపుకున్నాం; హీబ్రూ బహువచనమైన ‘సమాధులు’ను కావాలనే సంరక్షించాం.
