source:
  edition: WLC
  text: וּ/בְ/הוֹצִיאָ֣/ם אֶת הַ/כֶּ֔סֶף הַ/מּוּבָ֖א בֵּ֣ית יְהוָ֑ה מָצָא֙ חִלְקִיָּ֣הוּ הַ/כֹּהֵ֔ן אֶת סֵ֥פֶר תּֽוֹרַת יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/014.yaml
  text: And when they brought out the silver that had been brought into the house of Yahweh[a], Hilkiah the priest found the Book of the Law of Yahweh by the hand of Moses.
translation:
  language: te
  text: యెహోవా మందిరంలోకి తీసుకొచ్చిన వెండిని వారు బయటికి తీస్తున్నప్పుడు, యాజకుడైన హిల్కీయా మోషే ద్వారా ఇవ్వబడిన[a] యెహోవా ధర్మశాస్త్ర గ్రంథాన్ని కనుగొన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థంగా: ‘మోషే చేతి ద్వారా.’ ఇది మోషే ద్వారా అందజేయబడినదనే భావాన్ని సూచించే హీబ్రూ నుడికారం; మోషే పాత్రను మధ్యవర్తిత్వంగా లేదా కర్తృత్వంగా సూచించవచ్చు.'
    reason: హీబ్రూ నుడికారం యొక్క అక్షరరూపాన్ని మరియు దాని భావపరిధిని తెలియజేయడానికి.
lexical_decisions:
- source_word: וּבְהוֹצִיאָם
  choice: వారు బయటికి తీస్తున్నప్పుడు
  rationale: בְּ + infinitive construct కాలసంబంధ ఉపవాక్యాన్ని సూచిస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో కొనసాగుతున్న చర్యను ‘తీస్తున్నప్పుడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַכֶּסֶף
  choice: వెండిని
  rationale: כֶּסֶףకు ‘వెండి’ లేదా ‘డబ్బు’ అనే అర్థాలు ఉండవచ్చు. ఆలయ మరమ్మతుల కోసం సమకూర్చిన నిధుల సందర్భమైనప్పటికీ, మూలంలోని లోహపదాన్ని ‘వెండి’గా నిలిపాం.
- source_word: הַמּוּבָא בֵּית יְהוָה
  choice: యెహోవా మందిరంలోకి తీసుకొచ్చిన
  rationale: Hophal participle యొక్క కర్మణి భావాన్ని ‘తీసుకొచ్చిన’గా ఇచ్చాం. בֵּית యొక్క అక్షరార్థం ‘ఇల్లు’ అయినా, ఈ సందర్భంలో దేవాలయాన్ని సూచిస్తున్నందున ఆధునిక తెలుగులో సహజమైన ‘మందిరం’ వాడాం.
- source_word: מָצָא
  choice: కనుగొన్నాడు
  rationale: Qal perfect యొక్క సూటి భావం ‘కనుగొన్నాడు’; అనవసరమైన వివరణను జోడించదు.
- source_word: חִלְקִיָּהוּ הַכֹּהֵן
  choice: యాజకుడైన హిల్కీయా
  rationale: హీబ్రూ appositionను తెలుగులో సహజంగా, వ్యక్తి పేరు మరియు బాధ్యత రెండూ స్పష్టమయ్యేలా ఇచ్చాం.
- source_word: סֵפֶר תּוֹרַת יְהוָה
  choice: యెహోవా ధర్మశాస్త్ర గ్రంథం
  rationale: סֵפֶרను ‘గ్రంథం’గా, תּוֹרָהను ఈ నిబంధనాత్మక సందర్భంలో స్థిరపడిన ‘ధర్మశాస్త్రం’గా అనువదించాం; construct సంబంధాన్ని సహజ తెలుగు పదక్రమంలో ఉంచాం.
- source_word: בְּיַד מֹשֶׁה
  choice: మోషే ద్వారా వచ్చిన
  rationale: ‘చేతి ద్వారా’ అనే హీబ్రూ నుడికారాన్ని తెలుగులో సహజమైన మధ్యవర్తిత్వ భావంతో ఇచ్చాం. ‘రాయబడిన’ లేదా ‘ఇవ్వబడిన’ అని చెప్పకుండా, మూలంలోని రచన/ప్రసారం సంబంధిత స్వల్ప అస్పష్టతను నిలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో నిబంధన దైవనామం ప్రత్యక్షంగా ఉంది. కాబట్టి దానిని సాధారణ బిరుదుగా మార్చకుండా తెలుగులో పరిచితమైన లిప్యంతరీకరణతో ఇచ్చాం.
- issue: בְּיַד מֹשֶׁה సూచించే మోషే పాత్ర
  choice: మోషే ద్వారా వచ్చిన
  alternative: మోషే చేత రాయబడిన / మోషేకు ఇవ్వబడిన
  rationale: హీబ్రూ నుడికారం మధ్యవర్తిత్వం లేదా కర్తృత్వాన్ని సూచించగలదు. నిర్దిష్ట రచయితత్వం లేదా స్వీకర్తత్వాన్ని వచనం కంటే ఎక్కువగా నిర్ణయించకుండా ‘ద్వారా వచ్చిన’ అని ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలిని అనుసరించాం. ‘మందిరం,’ ‘యాజకుడు,’ ‘ధర్మశాస్త్ర గ్రంథం’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని సహజ వాక్యనిర్మాణంతో కలిపాం.
