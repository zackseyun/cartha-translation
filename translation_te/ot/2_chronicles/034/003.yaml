  yaml_path: translation/ot/2_chronicles/034/003.yaml
  text: In the eighth year of his reign[a], while he was still a youth, he began to seek the God of David his father; and in the twelfth year he began to cleanse Judah and Jerusalem from the high places, the Asherim, the carved images[c][b], and the metal images.
translation:
  language: te
  text: అతని పాలనలో ఎనిమిదవ సంవత్సరంలో, అతడు ఇంకా యువకుడిగా ఉన్నప్పుడే, తన పితరుడైన దావీదు యొక్క దేవుణ్ణి వెదకడం ప్రారంభించాడు.[a] పన్నెండవ సంవత్సరంలో యూదా దేశాన్నీ యెరూషలేమునూ ఉన్నత స్థలాల నుంచి, అషేరా చిహ్నాల నుంచి,[b] చెక్కిన విగ్రహాల నుంచి, పోతపోసిన లోహ విగ్రహాల నుంచి శుద్ధిచేయడం ప్రారంభించాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తన తండ్రియైన దావీదు యొక్క దేవుణ్ణి.” ఇక్కడ “తండ్రి” అనేది రాజవంశపు పూర్వికుణ్ణి సూచించే సాధారణ బైబిలు వాడుక.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అషేరా కర్రల నుంచి.” హీబ్రూ పదం అషేరాతో సంబంధమున్న ఆరాధనా చిహ్నాలను—తరచుగా చెక్క కర్రలను లేదా చెట్లను—సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “పోతపోసిన లోహ విగ్రహాలు” అంటే కరిగించిన లోహాన్ని అచ్చులో పోసి చేసిన విగ్రహాలు.
    reason: lexical_clarification
lexical_decisions:
- source_word: וּבִשְׁמוֹנֶה שָׁנִים לְמָלְכוֹ
  choice: అతని పాలనలో ఎనిమిదవ సంవత్సరంలో
  rationale: కాలార్థక ב మరియు రాజ్యపాలనను సూచించే לְמָלְכוֹ రెండింటినీ సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: וְהוּא עוֹדֶנּוּ נַעַר
  choice: అతడు ఇంకా యువకుడిగా ఉన్నప్పుడే
  rationale: נַעַר లోని బాలుడు/యువకుడు అనే విస్తృత అర్థాన్ని సందర్భానుగుణంగా ‘యువకుడు’గా, עוֹדֶנּוּ లోని ‘ఇంకా’ భావంతో సహా నిలుపుతుంది.
- source_word: הֵחֵל לִדְרֹשׁ
  choice: వెదకడం ప్రారంభించాడు
  rationale: దేవుని విషయంలో דרשׁ కేవలం విచారించడం కాక భక్తితో ఆయనను ఆశ్రయించి వెదకడాన్ని సూచిస్తుంది.
- source_word: לֵאלֹהֵי דָּוִיד אָבִיו
  choice: తన పితరుడైన దావీదు దేవుణ్ణి
  rationale: אָבִיו యొక్క వంశపారంపర్య రాజభాషను ‘పితరుడు’ సహజంగా తెలియజేస్తూ, దావీదు తక్షణ తండ్రి అనే అపార్థాన్ని నివారిస్తుంది; అక్షరార్థమైన ‘తండ్రి’ని పాదసూచికలో ఇస్తుంది.
- source_word: וּבִשְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: పన్నెండవ సంవత్సరంలో
  rationale: ముందటి రాజ్యపాలనా సంవత్సరాల చట్రం కొనసాగుతుందని సందర్భం స్పష్టం చేస్తుంది.
- source_word: הֵחֵל לְטַהֵר
  choice: శుద్ధిచేయడం ప్రారంభించాడు
  rationale: טהר లోని ఆరాధనాపరమైన అపవిత్రతను తొలగించే భావాన్ని ‘శుద్ధిచేయడం’ నిలుపుతుంది.
- source_word: מִן הַבָּמוֹת
  choice: ఉన్నత స్థలాల నుంచి
  rationale: במות అనే స్థానిక ఆరాధనా స్థలాలకు స్థిరమైన, మూలరూపానికి దగ్గరైన పదబంధం.
- source_word: וְהָאֲשֵׁרִים
  choice: అషేరా చిహ్నాల నుంచి
  rationale: ఈ బహువచనం అషేరాతో సంబంధమున్న కర్రలు, చెట్లు లేదా ఇతర ఆరాధనా చిహ్నాలను సూచించవచ్చు; ‘చిహ్నాలు’ భౌతిక రూపాన్ని అనవసరంగా ఖరారు చేయదు.
- source_word: וְהַפְּסִלִים
  choice: చెక్కిన విగ్రహాల నుంచి
  rationale: פסילים యొక్క చెక్కి రూపొందించిన ప్రతిమలనే నిర్దిష్ట భావాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: וְהַמַּסֵּכוֹת
  choice: పోతపోసిన లోహ విగ్రహాల నుంచి
  rationale: מסכות లోని కరిగిన లోహాన్ని అచ్చులో పోసి చేసిన ప్రతిమల భావాన్ని ఆధునిక పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘దావీదు అతని తండ్రి’ అనే పూర్విక భాష
  choice: ప్రధాన పాఠ్యంలో ‘తన పితరుడైన దావీదు’
  alternative: ‘తన తండ్రి దావీదు’
  rationale: హీబ్రూ אָבִיו అక్షరార్థంగా ‘అతని తండ్రి’ అయినా ఇక్కడ దావీదు వంశపితరుడని సూచిస్తుంది. ‘పితరుడు’ దావీదు వంశ సంబంధాన్ని నిలిపి, ఆధునిక తెలుగులో తక్షణ పితృత్వ అపార్థాన్ని తగ్గిస్తుంది; అక్షర రూపం పాదసూచికలో భద్రపరచబడింది.
- issue: అషేరీమ్ యొక్క ఖచ్చిత భౌతిక రూపం
  choice: అషేరా చిహ్నాలు
  alternative: అషేరా కర్రలు
  rationale: ఈ పదం ఆరాధనా కర్రలు లేదా చెట్లను సూచించవచ్చు గాని ప్రతి సందర్భంలో రూపం నిశ్చితం కాదు; అందువల్ల ప్రధాన పాఠ్యం నిజమైన అనిశ్చితిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ జాబితా నిర్మాణాన్ని సహజమైన తెలుగు విభక్తులతో నిలిపింది. ‘అషేరా చిహ్నాలు’ ద్వారా మూలంలోని సూచ్యార్థ అనిశ్చితి కాపాడబడింది.
