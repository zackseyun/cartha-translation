  terminology: ‘శుద్ధిచేయడం,’ ‘ఉన్నత స్థలాలు,’ ‘అషేరా చిహ్నాలు,’ ‘చెక్కిన విగ్రహాలు,’ and ‘పోతపోసిన లోహ విగ్రహాలు’ are appropriate. ‘అషేరా చిహ్నాలు’ suitably preserves the uncertainty of אֲשֵׁרִים. The footnote correctly explains the dynastic sense of אָבִיו.
