source:
  edition: WLC
  text: וַ/יְנַתֵּ֣ץ אֶת הַֽ/מִּזְבְּח֗וֹת וְ/אֶת הָ/אֲשֵׁרִ֤ים וְ/הַ/פְּסִלִים֙ כִּתַּ֣ת לְ/הֵדַ֔ק וְ/כָל הַֽ/חַמָּנִ֥ים גִּדַּ֖ע בְּ/כָל אֶ֣רֶץ יִשְׂרָאֵ֑ל וַ/יָּ֖שָׁב לִ/ירוּשָׁלִָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/007.yaml
  text: He tore down the altars and the Asherim[a], and he crushed the carved images to powder; he cut down all the incense altars throughout all the land of Israel[b]. Then he returned to Jerusalem.
translation:
  language: te
  text: అతడు బలిపీఠాలను, అషేరా పూజా వస్తువులను[a] పడగొట్టాడు; చెక్కిన విగ్రహాలను పొడిపొడిగా నలిపేశాడు; ఇశ్రాయేలు దేశమంతటా ఉన్న సూర్యస్తంభాలన్నిటిని[b] నరికివేశాడు. తరువాత అతడు యెరూషలేముకు తిరిగి వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అషేరా స్తంభాలను.’ హీబ్రూ పదం అషేరాతో సంబంధమున్న పూజా వస్తువులను సూచిస్తుంది; వాటి ఖచ్చిత రూపం సందర్భానుసారం మారవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదం ఒక రకమైన పూజా వస్తువును సూచిస్తుంది; ‘ధూపపీఠాలు’ అని కూడా అనువదిస్తారు. దాని ఖచ్చిత స్వరూపంపై భిన్నాభిప్రాయాలున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַתֵּץ
  choice: పడగొట్టాడు
  rationale: נתץ అనేది నిర్మాణాలను కూల్చడం లేదా పడగొట్టడాన్ని సూచిస్తుంది; బలిపీఠాల విషయంలో ‘పడగొట్టాడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: הַמִּזְבְּחוֹת
  choice: బలిపీఠాలను
  rationale: מִזְבְּחוֹתకు ప్రామాణికమైన, సందర్భోచితమైన తెలుగు పదం.
- source_word: הָאֲשֵׁרִים
  choice: అషేరా పూజా వస్తువులను
  rationale: ఈ పదం అషేరాతో సంబంధమున్న పూజా వస్తువులను సూచిస్తుంది; వాటి ఆకారం ప్రతి సందర్భంలోనూ స్తంభాలేనని నిర్ధారించకుండా నిర్దిష్ట సంబంధాన్ని నిలుపుతుంది.
- source_word: הַפְּסִלִים
  choice: చెక్కిన విగ్రహాలను
  rationale: פסילים చెక్కి చేసిన ఆరాధనా ప్రతిమలు; ‘విగ్రహాలు’ మాత్రమే అనడం కంటే మూలంలోని తయారీ భావాన్ని కూడా తెలియజేస్తుంది.
- source_word: כִּתַּת לְהֵדַק
  choice: పొడిపొడిగా నలిపేశాడు
  rationale: ఈ పదబంధం అత్యంత సూక్ష్మ కణాలుగా నలిపివేయడాన్ని తెలియజేస్తుంది; ఆధునిక తెలుగులో ఫలితాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: הַחַמָּנִים
  choice: సూర్యస్తంభాలను
  rationale: חַמָּנִים యొక్క ఖచ్చిత స్వరూపం వివాదాస్పదమైనా, సూర్యారాధనతో సంబంధమున్న నిలువైన పూజా వస్తువులనే సూచించే అవకాశం బలంగా ఉంది; అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: גִּדַּע
  choice: నరికివేశాడు
  rationale: גדע నిలువుగా ఉన్న వస్తువులను నరికి పడవేయడం లేదా తెగగొట్టడం అనే భావం ఇస్తుంది.
- source_word: בְּכָל אֶרֶץ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేశమంతటా
  rationale: చర్య జరిగిన విస్తృతిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיָּשָׁב לִירוּשָׁלִָם
  choice: తరువాత అతడు యెరూషలేముకు తిరిగి వచ్చాడు
  rationale: హీబ్రూ కథన క్రమాన్ని ‘తరువాత’ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: విగ్రహారాధనకు సంబంధించిన ప్రత్యేక పూజా వస్తువుల పేర్లు
  choice: ‘అషేరా పూజా వస్తువులు,’ ‘చెక్కిన విగ్రహాలు,’ ‘సూర్యస్తంభాలు’ అని విడివిడిగా పేర్కొనడం
  alternative: అన్నిటినీ సాధారణంగా ‘విగ్రహాలు’ లేదా ‘విగ్రహారాధనా వస్తువులు’ అని అనువదించడం
  rationale: మూలపాఠంలో వేర్వేరు పూజా వస్తువులు స్పష్టంగా పేర్కొనబడ్డాయి. వాటిని ఒకే సాధారణ పదంగా మార్చకుండా యోషీయా సంస్కరణ చర్యల స్పష్టతను నిలుపుతుంది.
- issue: הַחַמָּנִים యొక్క వివాదాస్పద గుర్తింపు
  choice: ప్రధాన పాఠంలో ‘సూర్యస్తంభాలు,’ పాదసూచికలో ప్రత్యామ్నాయాన్ని ఇవ్వడం
  alternative: ‘ధూపపీఠాలు’ లేదా ‘ధూపపు పీఠికలు’
  rationale: పదం సూర్యారాధనకు సంబంధించిన పూజా వస్తువులను సూచించే అవకాశం ఉంది, కాని ఖచ్చిత గుర్తింపు నిర్ధారితం కాదు; అందువల్ల అనిశ్చితిని దాచకుండా ప్రత్యామ్నాయాన్ని నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. అరుదైన పూజా పదాలను వివరణాత్మకంగా అనువదించి, నిజమైన పదార్థ అనిశ్చితిని పాదసూచికల్లో నిలిపాం.
