  text: בֶּן שְׁמוֹנֶ֥ה שָׁנִ֖ים יֹאשִׁיָּ֣הוּ בְ/מָלְכ֑/וֹ וּ/שְׁלֹשִׁ֤ים וְ/אַחַת֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/001.yaml
  text: Josiah was eight years old when he became king, and he reigned thirty-one years in Jerusalem.
translation:
  language: te
  text: యోషీయా రాజైనప్పుడు అతనికి ఎనిమిది సంవత్సరాల వయస్సు. అతడు యెరూషలేములో ముప్పై ఒక్క సంవత్సరాలు రాజ్యమేలాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁמוֹנֶה שָׁנִים
  choice: అతనికి ఎనిమిది సంవత్సరాలు
  rationale: ‘ఎనిమిది సంవత్సరాల కుమారుడు’ అనే హీబ్రూ వయస్సు నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా, అర్థం మారకుండా వ్యక్తం చేస్తుంది.
- source_word: יֹאשִׁיָּהוּ
  choice: యోషీయా
  rationale: హీబ్రూ వ్యక్తి పేరుకు తెలుగులో స్థిరపడిన లిప్యంతరీకరణను ఉపయోగించింది.
- source_word: בְמָלְכוֹ
  choice: రాజైనప్పుడు
  rationale: ఈ నిర్మాణం అతడు రాజ్యాధికారం చేపట్టిన సమయాన్ని సూచిస్తుంది; ‘రాజైనప్పుడు’ సంక్షిప్తమైన, సహజమైన తెలుగు వ్యక్తీకరణ.
- source_word: וּשְׁלֹשִׁים וְאַחַת שָׁנָה
  choice: ముప్పై ఒక్క సంవత్సరాలు
  rationale: పరిపాలన కాలాన్ని ఆధునిక తెలుగు సంఖ్యా క్రమంలో స్పష్టంగా తెలిపింది.
- source_word: מָלַךְ
  choice: పరిపాలించాడు
  rationale: రాజుగా పాలించడాన్ని సూచించే హీబ్రూ క్రియ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: స్థలార్థక ఉపసర్గను ‘లో’తో నేరుగా అందిస్తూ, స్థిరపడిన తెలుగు స్థలనామ రూపాన్ని ఉపయోగించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన చారిత్రక వచనశైలి. మూలంలోని రెండు కాలసూచనలను రెండు సహజ వాక్యాలుగా అందించింది; భావపరమైన చేర్పులు లేవు.
