  terminology: ‘బయలుల బలిపీఠాలు,’ ‘ధూపపీఠాలు,’ ‘చెక్కిన విగ్రహాలు,’ ‘పోతపోసిన లోహ విగ్రహాలు’ సరైన, పాఠకసులభమైన పదాలు. అషేరీమ్‌కు ‘అషేరీమ్’ అనే లిప్యంతరీకరణ ప్రధాన పాఠంలో ఉంచి, ‘అషేరా స్తంభాలు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం మూలపదంలోని వస్తు-స్వరూప అనిశ్చితిని బాగా కాపాడుతుంది.
