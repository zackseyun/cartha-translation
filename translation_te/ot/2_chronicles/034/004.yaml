source:
  edition: WLC
  text: וַ/יְנַתְּצ֣וּ לְ/פָנָ֗י/ו אֵ֚ת מִזְבְּח֣וֹת הַ/בְּעָלִ֔ים וְ/הַֽ/חַמָּנִ֛ים אֲשֶׁר לְ/מַ֥עְלָ/ה מֵ/עֲלֵי/הֶ֖ם גִּדֵּ֑עַ וְ֠/הָ/אֲשֵׁרִים וְ/הַ/פְּסִלִ֤ים וְ/הַ/מַּסֵּכוֹת֙ שִׁבַּ֣ר וְ/הֵדַ֔ק וַ/יִּזְרֹק֙ עַל פְּנֵ֣י הַ/קְּבָרִ֔ים הַ/זֹּבְחִ֖ים לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/004.yaml
  text: They tore down before him the altars of the Baals[a], and he cut down the incense altars that were above them. He shattered and crushed the Asherim, the carved images, and the metal images[b], and scattered them over the graves of those who had sacrificed to them.
translation:
  language: te
  text: వారు అతని సమక్షంలో బయలుల బలిపీఠాలను పడగొట్టారు. వాటి పైన ఉన్న ధూపపీఠాలను[a] అతడు నరికివేశాడు. అషేరీమ్‌ను[b], చెక్కిన విగ్రహాలను, పోతపోసిన లోహ విగ్రహాలను అతడు పగులగొట్టి పొడిచేశాడు. వాటిని వాటికి బలులు అర్పించినవారి సమాధుల మీద చల్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సూర్యారాధనా స్తంభాలను.” ఇక్కడి హీబ్రూ పదానికి ఖచ్చితమైన అర్థం తెలియదు; అది సూర్యారాధనతో ముడిపడిన ఆరాధనా స్తంభాలను సూచించవచ్చు.
    reason: హమ్మానీమ్ అనే పదానికి ఉన్న వాస్తవ పదార్థ అనిశ్చితిని, ముఖ్యమైన ప్రత్యామ్నాయ అర్థాన్ని తెలియజేయడానికి.
  - marker: b
    text: లేదా, “అషేరా స్తంభాలను.” హీబ్రూ పదం అషేరాతో సంబంధమున్న ఆరాధనా వస్తువులను సూచించవచ్చు.
    reason: అషేరీమ్ పదం స్తంభాలను మాత్రమే సూచిస్తుందా లేక ఇతర అషేరా సంబంధిత ఆరాధనా వస్తువులను కూడా సూచిస్తుందా అనే అస్పష్టతను నిలుపడానికి.
lexical_decisions:
- source_word: וַיְנַתְּצוּ
  choice: వారు ... పడగొట్టారు
  rationale: హీబ్రూ బహువచన క్రియను నిలుపుతూ, నిర్మాణాలను కూల్చివేయడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְפָנָיו
  choice: అతని సమక్షంలో
  rationale: యోషీయా ఎదుట, అతని సన్నిధిలో ఈ పని జరిగిందనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִזְבְּחוֹת הַבְּעָלִים
  choice: బయలుల బలిపీఠాలను
  rationale: హీబ్రూలోని బహువచనాన్ని నిలుపుతూ, బయలు దేవతకు సంబంధించిన వివిధ స్థానిక ఆరాధనా రూపాలను సూచిస్తుంది.
- source_word: הַחַמָּנִים
  choice: ధూపపీఠాలను
  rationale: సందర్భానికి సరిపడే సాధ్యమైన అర్థం; పదార్థం అనిశ్చితమైనందున ‘సూర్యారాధనా స్తంభాలు’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: אֲשֶׁר לְמַעְלָה מֵעֲלֵיהֶם
  choice: వాటి పైనున్న
  rationale: ఈ సంబంధవాక్యం ధూపపీఠాల స్థానాన్ని బయలు బలిపీఠాల పైనగా వర్ణిస్తుందని గ్రహించబడింది.
- source_word: גִּדֵּעַ
  choice: నరికివేశాడు
  rationale: ఎత్తుగా ఉన్న ఆరాధనా వస్తువులను నరికివేయడం అనే బలమైన క్రియాభావాన్ని ఇస్తుంది.
- source_word: הָאֲשֵׁרִים
  choice: అషేరా ఆరాధనా చిహ్నాలను
  rationale: అషేరాతో సంబంధమున్న ఆరాధనా వస్తువులను సూచిస్తూ, అవి తప్పనిసరిగా కేవలం స్తంభాలేనని నిర్ణయించకుండా పదంలోని అస్పష్టతను కాపాడుతుంది.
- source_word: הַפְּסִלִים
  choice: చెక్కిన విగ్రహాలను
  rationale: చెక్కి రూపొందించిన ఆరాధనా ప్రతిమలనే నిర్దిష్టంగా సూచిస్తుంది.
- source_word: הַמַּסֵּכוֹת
  choice: పోతపోసిన లోహ విగ్రహాలను
  rationale: కరిగించిన లోహాన్ని అచ్చులో పోసి చేసిన ప్రతిమల భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: שִׁבַּר וְהֵדַק
  choice: పగులగొట్టి, పొడిచేసి
  rationale: వస్తువులను విరగగొట్టి అతి చిన్న ముక్కలుగా లేదా పొడిగా చేసిన విధ్వంస తీవ్రతను నిలుపుతుంది.
- source_word: וַיִּזְרֹק
  choice: చల్లాడు
  rationale: పొడిచేసిన అవశేషాలను సమాధుల మీద వెదజల్లిన చర్యను సందర్భానుకూలంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: הָאֲשֵׁרִים పదానికి అనువాదం
  choice: అషేరా ఆరాధనా చిహ్నాలు
  alternative: అషేరా స్తంభాలు
  rationale: ఈ పదం అషేరా దేవతతో సంబంధమున్న స్తంభాలను గానీ ఇతర ఆరాధనా వస్తువులను గానీ సూచించవచ్చు. ప్రధాన పాఠం ఆ విస్తృతిని నిలుపుతుంది; స్తంభాలు అనే సాధ్యమైన అర్థాన్ని పాదసూచిక తెలియజేస్తుంది.
- issue: הַחַמָּנִים పదానికి అనువాదం
  choice: ధూపపీఠాలు
  alternative: సూర్యారాధనా స్తంభాలు
  rationale: హీబ్రూ పదానికి ఖచ్చితమైన అర్థం వివాదాస్పదం. సందర్భానికి సరిపడే ‘ధూపపీఠాలు’ ప్రధాన పాఠంలో ఉండగా, సూర్యారాధనతో ముడిపడిన స్తంభాలు అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. హీబ్రూ బహువచన కర్తను ‘వారు’గా నిలిపి, తరువాతి ఏకవచన క్రియలను యోషీయాను సూచించే ‘అతడు’తో అందించాం. సాంకేతికంగా అనిశ్చితమైన ఆరాధనా పదాలకు పాదసూచికలు జోడించాం.
