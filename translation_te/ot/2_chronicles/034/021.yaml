  to: “మీరు వెళ్లి, దొరికిన గ్రంథం[a]లోని మాటల గురించి నా పక్షాన, ఇశ్రాయేలులోనూ యూదాలోనూ మిగిలి ఉన్నవారి పక్షాన యెహోవాను విచారించండి. ఎందుకంటే, ఈ గ్రంథంలో[c] రాసి ఉన్నదంతా చేయడంలో మన పితరులు[b] యెహోవా వాక్యాన్ని పాటించలేదు కాబట్టి, మనపై కుమ్మరించబడిన యెహోవా ఉగ్రత ఎంతో గొప్పది.”
