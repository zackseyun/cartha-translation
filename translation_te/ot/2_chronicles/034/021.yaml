  text: לְכוּ֩ דִרְשׁ֨וּ אֶת יְהוָ֜ה בַּעֲדִ֗/י וּ/בְעַד֙ הַ/נִּשְׁאָר֙ בְּ/יִשְׂרָאֵ֣ל וּ/בִֽ/יהוּדָ֔ה עַל דִּבְרֵ֥י הַ/סֵּ֖פֶר אֲשֶׁ֣ר נִמְצָ֑א כִּֽי גְדוֹלָ֤ה חֲמַת יְהוָה֙ אֲשֶׁ֣ר נִתְּכָ֣ה בָ֔/נוּ עַל֩ אֲשֶׁ֨ר לֹא שָׁמְר֤וּ אֲבוֹתֵ֨י/נוּ֙ אֶת דְּבַ֣ר יְהוָ֔ה לַ/עֲשׂ֕וֹת כְּ/כָל הַ/כָּת֖וּב עַל הַ/סֵּ֥פֶר הַ/זֶּֽה־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/021.yaml
  text: Go[a], inquire of Yahweh for me and for the remnant in Israel and in Judah concerning the words of the book that has been found, for great is the wrath of Yahweh that has been poured out on us, because our fathers have not kept the word of Yahweh[c][b], to do according to all that is written in this book.
translation:
  language: te
  text: “మీరు వెళ్లి, దొరికిన గ్రంథం[a]లోని మాటల గురించి నా పక్షాన, ఇశ్రాయేలులోనూ యూదాలోనూ మిగిలి ఉన్నవారి పక్షాన యెహోవాను విచారించండి. ఎందుకంటే, ఈ గ్రంథంలో[c] రాసి ఉన్నదంతా చేయడంలో మన పితరులు[b] యెహోవా వాక్యాన్ని పాటించలేదు కాబట్టి, మనపై కుమ్మరించబడిన యెహోవా ఉగ్రత ఎంతో గొప్పది.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దొరికిన చుట్టగ్రంథం.’ హీబ్రూ పదం పుస్తకాన్నీ చుట్టగ్రంథాన్నీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘మన పూర్వీకులు.’ హీబ్రూలో అక్షరార్థం ‘మన తండ్రులు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘ఈ చుట్టగ్రంథంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: דִרְשׁוּ אֶת־יְהוָה
  choice: యెహోవాను విచారించండి
  rationale: ఈ రాజాజ్ఞ సందర్భంలో క్రియకు భక్తిపూర్వకంగా వెదకడం కంటే దేవుని జవాబు లేదా మార్గదర్శకత్వం కోరడం అనే భావం ఉంది. ‘విచారించండి’ ఆ అధికారిక భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచింది.
- source_word: בַּעֲדִי ... וּבְעַד הַנִּשְׁאָר
  choice: నా పక్షాన ... మిగిలి ఉన్నవారి పక్షాన
  rationale: בְּעַד ఇక్కడ ప్రతినిధిత్వం లేదా ఒకరి తరఫున చేయడాన్ని సూచిస్తుంది. ‘పక్షాన’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַנִּשְׁאָר בְּיִשְׂרָאֵל וּבִיהוּדָה
  choice: ఇశ్రాయేలులోనూ యూదాలోనూ మిగిలి ఉన్నవారు
  rationale: ‘శేషం’ అనే సాంకేతిక పదం కంటే మూలంలోని participial భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది; అయినా చారిత్రకంగా మిగిలిన సమూహం అనే భావం నిలుస్తుంది.
- source_word: עַל דִּבְרֵי הַסֵּפֶר
  choice: గ్రంథంలోని మాటల గురించి
  rationale: עַל విషయాన్ని సూచిస్తుంది; דִּבְרֵי ను ‘మాటలు’గా ఉంచడం మూలానికి దగ్గరగా ఉండి తెలుగులో సహజంగా ఉంది.
- source_word: הַסֵּפֶר אֲשֶׁר נִמְצָא
  choice: దొరికిన గ్రంథం
  rationale: סֵפֶר పుస్తకం లేదా చుట్టగ్రంథాన్ని సూచించగలదు. ప్రధాన పాఠ్యంలో సహజమైన ‘గ్రంథం’ వాడి, భౌతిక రూపానికి సంబంధించిన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
- source_word: גְדוֹלָה חֲמַת יְהוָה
  choice: యెహోవా ఉగ్రత ఎంతో గొప్పది
  rationale: חֵמָה తీవ్రమైన, మండే కోపాన్ని సూచిస్తుంది. ‘ఉగ్రత’ ఆ బలాన్ని నిలుపుతుంది; ‘ఎంతో గొప్పది’ ముందుంచిన గుణవాచకంలోని తీవ్రతను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נִתְּכָה בָנוּ
  choice: మన మీద కుమ్మరించబడిన
  rationale: Niphal రూపం ఉగ్రత కుమ్మరించబడినదనే రూపకాన్ని ఇస్తుంది. తెలుగు ప్రయోగం ఆ రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: אֲבוֹתֵינוּ
  choice: మన పితరులు
  rationale: మూలంలోని పురుషలింగ బహువచనాన్ని, పూర్వీక పురుషులను సూచించే భావాన్ని ‘పితరులు’ నిలుపుతుంది; విస్తృత ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: שָׁמְרוּ אֶת־דְּבַר יְהוָה
  choice: యెహోవా వాక్యాన్ని పాటించలేదు
  rationale: שׁמר ఇక్కడ చెప్పబడిన ఆజ్ఞను కాపాడటం లేదా ఆచరించడం అనే భావంలో ఉంది. తెలుగులో ‘వాక్యాన్ని పాటించడం’ సహజంగా విధేయతను తెలియజేస్తుంది.
- source_word: לַעֲשׂוֹת כְּכָל הַכָּתוּב
  choice: రాసి ఉన్నదంతా చేయడం
  rationale: అనంతక్రియ వాక్యాన్ని పాటించడంలోని కార్యరూపాన్ని వివరిస్తుంది. ‘రాసి ఉన్నదంతా’ כְּכָל యొక్క సంపూర్ణ పరిధిని నిలుపుతుంది.
- source_word: עַל־הַסֵּפֶר הַזֶּה
  choice: ఈ గ్రంథంలో
  rationale: అక్షరార్థంగా ‘ఈ గ్రంథంపై’ అయినా, వ్రాతలోని విషయాన్ని తెలుగులో సహజంగా ‘గ్రంథంలో’ అంటారు.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం బిరుదు కాకుండా చతురక్షర దైవనామాన్ని నేరుగా వాడుతుంది. అందువల్ల దైవనామాన్ని తెలుగులో పరిచితమైన లిప్యంతరీకరణతో నిలిపింది.
- issue: אֲבוֹתֵינוּ ను లింగతటస్థంగా చేయాలా
  choice: మన పితరులు
  alternative: మన పూర్వీకులు
  rationale: మూలంలోని పదం వ్యాకరణపరంగా పురుషలింగంలో ఉండి పూర్వపు తండ్రులను సూచిస్తుంది. ఆ ప్రత్యేకతను ప్రధాన పాఠ్యంలో నిలిపి, విస్తృతార్థాన్ని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన రాజాజ్ఞ శైలిని వాడింది. ‘విచారించండి,’ ‘పితరులు,’ ‘ఉగ్రత’ వంటి పదాలు గంభీరతను నిలుపుతాయి; వాక్యనిర్మాణం మాత్రం సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా చేసింది. హీబ్రూ కారణసంబంధాన్ని ‘ఎందుకంటే… అందువల్ల’తో బహిర్గతం చేసింది.
