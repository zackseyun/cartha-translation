  text: וַ/יַּ֣עַן חִלְקִיָּ֗הוּ וַ/יֹּ֨אמֶר֙ אֶל שָׁפָ֣ן הַ/סּוֹפֵ֔ר סֵ֧פֶר הַ/תּוֹרָ֛ה מָצָ֖אתִי בְּ/בֵ֣ית יְהוָ֑ה וַ/יִּתֵּ֧ן חִלְקִיָּ֛הוּ אֶת הַ/סֵּ֖פֶר אֶל שָׁפָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/015.yaml
  text: Then Hilkiah answered and said to Shaphan the scribe[a], “I have found the Book of the Law in the house of Yahweh.” And Hilkiah gave the book to Shaphan.
translation:
  language: te
  text: 'అప్పుడు హిల్కీయా జవాబిచ్చి లేఖకుడైన షాఫానుకు ఇలా అన్నాడు: “యాహ్వే మందిరంలో ధర్మశాస్త్ర గ్రంథం[a] నేను కనుగొన్నాను.” హిల్కీయా ఆ గ్రంథాన్ని షాఫానుకు ఇచ్చాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ధర్మశాస్త్రపు చుట్టిన పత్రం.” హీబ్రూ సెఫెర్ అనే పదం గ్రంథం, పత్రం లేదా చుట్టిన పత్రాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: జవాబిస్తూ ... అని అన్నాడు
  rationale: హీబ్రూ కథనంలోని రెండు వాక్కు క్రియలనూ నిలుపుతూ, వెంటనే ముందు ప్రశ్న లేకపోయినా సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణాన్ని ఉపయోగిస్తుంది.
- source_word: הַסּוֹפֵר
  choice: లేఖకుడు
  rationale: ఈ పదం రాజాస్థాన కార్యదర్శి లేదా లేఖకుణ్ణి సూచించవచ్చు. ‘లేఖకుడు’ మూలపద విస్తృతిని అనవసరంగా కుదించకుండా అధికారిక పాత్రను తెలియజేస్తుంది.
- source_word: סֵפֶר הַתּוֹרָה
  choice: ధర్మశాస్త్ర గ్రంథం
  rationale: סֵפֶר గ్రంథం, పత్రం లేదా గ్రంథపు చుట్టను సూచించగలదు; תּוֹרָה ఇక్కడ నిబంధనకు సంబంధించిన ధర్మశాస్త్ర బోధను సూచిస్తుంది. స్థిరమైన తెలుగు బైబిలు ప్రయోగానికి అనుగుణంగా ఈ పదబంధం ఎంచుకోబడింది.
- source_word: מָצָאתִי
  choice: నాకు దొరికింది
  rationale: పూర్తయిన కనుగొనుటను, దాని ప్రస్తుత ప్రాముఖ్యతను సహజమైన తెలుగు ప్రకటనగా వ్యక్తం చేస్తుంది.
- source_word: בְּבֵית יְהוָה
  choice: యాహ్వే మందిరంలో
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఈ సందర్భంలో దేవాలయాన్ని సూచిస్తుంది; తెలుగులో ‘మందిరం’ సందర్భార్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּתֵּן ... אֶת־הַסֵּפֶר אֶל שָׁפָן
  choice: ఆ గ్రంథాన్ని షాఫానుకు ఇచ్చాడు
  rationale: נתן అనే సాధారణ ‘ఇచ్చు’ క్రియను సూటిగా అనువదించి, ముందే ప్రస్తావించిన గ్రంథాన్ని ‘ఆ గ్రంథం’ అని సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ప్రత్యేక నిబంధన నామాన్ని సాధారణ బిరుదుగా మార్చకుండా, తెలుగులో దాని సాధారణ ధ్వన్యనుకరణతో అందిస్తుంది.
- issue: תּוֹרָה భావవ్యాప్తి
  choice: ధర్మశాస్త్రం
  alternative: ఉపదేశం
  rationale: ‘ఉపదేశం’ అనే విస్తృత అర్థం సాధ్యమైనప్పటికీ, ఈ సందర్భంలో మందిరంలో కనుగొనబడిన నిబంధన సంబంధిత శాసన గ్రంథాన్ని ‘ధర్మశాస్త్రం’ స్పష్టంగా సూచిస్తుంది; గ్రంథం యొక్క ఖచ్చిత పరిధిని మాత్రం వాక్యం నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. వ్యక్తుల పేర్లు హిల్కీయా, షాఫాను అని ధ్వన్యనుకరించబడ్డాయి. మూలంలోని ‘యాహ్వే ఇల్లు’ అనే భావాన్ని సందర్భానుసారంగా ‘యాహ్వే మందిరం’ అని ఇచ్చాం.
