source:
  edition: WLC
  text: וַ/יַּגֵּ֞ד שָׁפָ֤ן הַ/סּוֹפֵר֙ לַ/מֶּ֣לֶךְ לֵ/אמֹ֔ר סֵ֚פֶר נָ֣תַן לִ֔/י חִלְקִיָּ֖הוּ הַ/כֹּהֵ֑ן וַ/יִּקְרָא ב֥/וֹ שָׁפָ֖ן לִ/פְנֵ֥י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/018.yaml
  text: Then Shaphan the scribe told the king[a], saying, “Hilkiah the priest has given me a book,” and Shaphan read from it before the king.
translation:
  language: te
  text: 'అప్పుడు లేఖకుడైన షాఫాను రాజుకు ఇలా తెలియజేశాడు: “యాజకుడైన హిల్కీయా నాకు ఒక గ్రంథం[a] ఇచ్చాడు.” తరువాత షాఫాను రాజు సమక్షంలో దానిలోనుంచి చదివాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక గ్రంథపు చుట్ట.” హెబ్రీ పదం సాధారణంగా ఒక లిఖిత పత్రాన్ని లేదా గ్రంథాన్ని సూచించగలదు; ఆ కాలంలో అది తరచుగా చుట్ట రూపంలో ఉండేది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: తెలియజేశాడు
  rationale: נגד హిఫిల్ రూపం ‘తెలియజేయడం, నివేదించడం’ అనే అర్థాన్ని ఇస్తుంది. రాజుకు అధికారికంగా సమాచారం అందించే సందర్భానికి ‘తెలియజేశాడు’ సహజంగా సరిపోతుంది.
- source_word: הַסּוֹפֵר
  choice: లేఖకుడైన
  rationale: סֹפֵר రాజసభ కార్యదర్శిని లేదా అధికారిక లేఖకుణ్ణి సూచించవచ్చు. ‘లేఖకుడు’ మూలపదానికి దగ్గరగా ఉండి చారిత్రక సందర్భాన్ని నిలుపుతుంది.
- source_word: סֵפֶר
  choice: ఒక గ్రంథం
  rationale: סֵפֶר అనేది పుస్తకం, లిఖిత పత్రం లేదా గ్రంథపు చుట్టను విస్తృతంగా సూచించగల పదం. ‘గ్రంథం’ ఇక్కడ లిఖిత రచన అనే విస్తృత భావాన్ని సహజంగా తెలియజేస్తుంది; దాని భౌతిక రూపాన్ని అనవసరంగా నిర్దేశించదు.
- source_word: נָתַן לִי
  choice: నాకు ... ఇచ్చాడు
  rationale: పూర్తయిన చర్యను తెలుగు సాధారణ భూతకాలంతో సహజంగా వ్యక్తం చేస్తుంది; ఆ గ్రంథం ఇప్పుడు షాఫాను వద్ద ఉందనే తక్షణ సందర్భం వాక్యంతోనే స్పష్టమవుతుంది.
- source_word: חִלְקִיָּהוּ הַכֹּהֵן
  choice: యాజకుడైన హిల్కీయా
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించి, అతని హోదాను తెలుగులో అనువదించింది.
- source_word: וַיִּקְרָא בוֹ
  choice: దానిలోనుంచి చదివాడు
  rationale: בּוֹ లోని ב ప్రాతిపదికను నిలుపుతూ, లిఖిత గ్రంథం నుంచి చదివాడనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: రాజు సమక్షంలో
  rationale: ఈ పదబంధం రాజు ఎదుట లేదా అతని సన్నిధిలో జరిగిన చర్యను సూచిస్తుంది. ‘రాజు సమక్షంలో’ సంక్షిప్తంగా, గౌరవప్రదంగా, స్పష్టంగా ఉంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలో రెండుసార్లు ఉన్న షాఫాను పేరును నిలిపి, మాట చెప్పడం నుంచి చదవడం వైపు మార్పును స్పష్టంచేయడానికి ‘తరువాత’ ఉపయోగించాం.
