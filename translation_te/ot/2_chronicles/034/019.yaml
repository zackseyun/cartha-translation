id: 2CH.34.19
reference: 2 Chronicles 34:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִי֙ כִּ/שְׁמֹ֣עַ הַ/מֶּ֔לֶךְ אֵ֖ת דִּבְרֵ֣י הַ/תּוֹרָ֑ה וַ/יִּקְרַ֖ע אֶת בְּגָדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/019.yaml
  text: And when the king heard the words of the law[a], he tore his clothes.
translation:
  language: te
  text: రాజు ధర్మశాస్త్రపు మాటలు[a] విన్నప్పుడు, తన బట్టలు చింపుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బోధనకు సంబంధించిన మాటలు”; హీబ్రూ ‘తోరా’ అనే పదం విస్తృతంగా బోధన లేదా ఉపదేశాన్ని సూచించగలదు. అయితే ఇక్కడ అది రాజు ఎదుట చదివిన నిబంధనాత్మక ధర్మశాస్త్రాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: విన్నప్పుడు
  rationale: היה తో కూడిన వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; כ + שמע క్రియావాచక రూపం కాలసంబంధ పరిస్థితిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘విన్నప్పుడు’ సహజంగా ఈ భావాన్ని అందిస్తుంది; ప్రత్యేకంగా ‘అప్పుడు జరిగింది’ అని చేర్చడం అవసరం లేదు.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: మూలంలో వ్యక్తిపేరు కాక బిరుదే ఉంది. సందర్భంలో యోషీయా సూచింపబడినా, మూలరూపాన్ని అనుసరించి ‘రాజు’ అని ఉంచబడింది.
- source_word: דִּבְרֵי
  choice: మాటలు
  rationale: ఇక్కడ דבר బహువచన నిర్మాణరూపం చదివి వినిపించిన విషయవస్తువును సూచిస్తుంది. ‘మాటలు’ ప్రత్యక్షమైన, సహజమైన తెలుగు పదం.
- source_word: הַתּוֹרָה
  choice: ధర్మశాస్త్రం
  rationale: תורה సాధారణంగా బోధ లేదా ఉపదేశం అని కూడా అర్థమివ్వగలదు; ఈ సందర్భంలో రాజు ఎదుట చదివిన నిబంధనాత్మక శాసనగ్రంథాన్ని సూచిస్తుంది. తెలుగు బైబిలు వాడుకలో ‘ధర్మశాస్త్రం’ ఈ భావాన్ని స్పష్టంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: וַיִּקְרַע
  choice: చింపుకున్నాడు
  rationale: קרע వస్త్రాలను చింపడాన్ని సూచిస్తుంది. తెలుగు ఆత్మనేపద ప్రయోగం రాజు తన సొంత బట్టలను చింపుకున్నాడనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּגָדָיו
  choice: తన బట్టలు
  rationale: בגד సాధారణ వస్త్రాలను సూచిస్తుంది; రాజవస్త్రాలు లేదా అంగీలు అని మరింత నిర్దిష్టం చేయడానికి మూలంలో ఆధారం లేదు. ‘తన’ కర్తతో సంబంధాన్ని సహజంగా చూపిస్తుంది.
theological_decisions:
- issue: యోషీయా సంస్కరణ సందర్భంలో תורה అనువాదం
  choice: ధర్మశాస్త్రం
  alternative: బోధ; ఉపదేశం; తోరా
  rationale: ఈ వచనంలో కనుగొనబడి రాజు ఎదుట చదివిన గ్రంథంలోని నిబంధనాత్మక, శాసన సంబంధ విషయమే ప్రధానంగా ఉంది. అయితే תורה పదానికి విస్తృతంగా ‘బోధ/ఉపదేశం’ అనే అర్థం ఉండగలదని పాదటిప్పణిలో నిలుపబడింది; పదాన్ని ఏదైనా సన్నని సిద్ధాంతార్థానికి పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే చారిత్రక కథనానికి తగిన గౌరవప్రద శైలి. మూలంలోని ‘రాజు’ అనే బిరుదును నిలిపి, సందర్భం నుండి యోషీయా పేరును చేర్చలేదు.
