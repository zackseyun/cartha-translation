id: 2CH.34.23
reference: 2 Chronicles 34:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר לָ/הֶ֔ם כֹּה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אִמְר֣וּ לָ/אִ֔ישׁ אֲשֶׁר שָׁלַ֥ח אֶתְ/כֶ֖ם אֵלָֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/023.yaml
  text: 'And she said to them[a], “Thus says Yahweh, the God of Israel: Say to the man who sent you to me,”'
translation:
  language: te
  text: 'ఆమె వారితో ఇలా చెప్పింది: “ఇశ్రాయేలు దేవుడైన యాహ్వే[a] ఇలా అంటున్నాడు: ‘మిమ్మల్ని నా దగ్గరికి పంపిన మనిషికి ఇలా చెప్పండి—’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఇక్కడ దేవుని వ్యక్తిగత నామమైన יהוה (YHWH) ఉంది; దీనిని సంప్రదాయంగా “ప్రభువు” అని కూడా అనువదిస్తారు.
    reason: దేవుని నామానికి సంబంధించిన మూలపాఠ రూపాన్ని మరియు సంప్రదాయ ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: וַתֹּאמֶר לָהֶם
  choice: ఆమె వారితో ఇలా చెప్పింది
  rationale: స్త్రీలింగ ఏకవచన క్రియారూపాన్ని ‘ఆమె’తో స్పష్టంగా చూపిస్తూ, לָהֶםను సహజమైన తెలుగులో ‘వారితో’గా అనువదించాం. וַ యొక్క కథన కొనసాగింపును ప్రత్యేకంగా ‘అప్పుడు’ అని బలవంతంగా నిర్దేశించకుండా వాక్యప్రవాహంలో ఉంచాం.
- source_word: כֹּה אָמַר
  choice: ఇలా అంటున్నాడు
  rationale: ఇది ప్రవక్తల సందేశ సూత్రవాక్యం. హెబ్రీ పరిపూర్ణ క్రియారూపాన్ని యాంత్రికంగా భూతకాలంలో కాకుండా, దేవుని ప్రస్తుత ప్రకటనగా సహజ తెలుగులో అందించాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హెబ్రీలోని YHWH అనే దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: నిర్మాణ సంబంధాన్ని తెలుగులో సహజంగా, యాహ్వేను ఇశ్రాయేలు దేవునిగా గుర్తించే విధంగా వ్యక్తం చేస్తుంది.
- source_word: אִמְרוּ לָאִישׁ
  choice: వ్యక్తితో ఇలా చెప్పండి
  rationale: బహువచన ఆజ్ఞను ‘చెప్పండి’గా నిలిపాం. אִישׁ ఇక్కడ నిర్దిష్టంగా పంపిన పురుషుణ్ణి సూచించినప్పటికీ, తెలుగులో ‘వ్యక్తి’ అనే పదం సందర్భంలో సహజంగా ఉంటుంది; తరువాతి పురుష ఏకవచన సంబంధ వాక్యమే అతణ్ణి నిర్దిష్టంగా గుర్తిస్తుంది.
- source_word: אֲשֶׁר שָׁלַח אֶתְכֶם אֵלָי
  choice: మిమ్మల్ని నా దగ్గరికి పంపిన
  rationale: సంబంధ వాక్యాన్ని, పంపిన దిశతో సహా, మూలార్థానికి దగ్గరగా మరియు సహజమైన తెలుగు పదక్రమంలో ఉంచాం.
theological_decisions:
- issue: יְהוָה అనే దేవుని నామాన్ని ఎలా చూపాలి
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాకుండా నాలుగు హల్లులతో కూడిన వ్యక్తిగత నామం ఉంది. అందువల్ల ప్రధాన పాఠంలో దానిని లిప్యంతరీకరించి, సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలిని వాడాం. వచనం తరువాతి వచనంలో కొనసాగే ప్రత్యక్ష సందేశానికి పరిచయం కావడంతో, చివరలో దీర్ఘగీతను ఉంచి ఆ కొనసాగింపును సూచించాం.
