revisions:
- from: 'ఆమె వారితో ఇలా చెప్పింది: “ఇశ్రాయేలు దేవుడైన యాహ్వే[a] ఇలా అంటున్నాడు: ‘మిమ్మల్ని నా దగ్గరికి పంపిన వ్యక్తితో ఇలా చెప్పండి—’”'
  to: 'ఆమె వారితో ఇలా చెప్పింది: “ఇశ్రాయేలు దేవుడైన యాహ్వే[a] ఇలా అంటున్నాడు: ‘మిమ్మల్ని నా దగ్గరికి పంపిన మనిషికి ఇలా చెప్పండి—’”'
  rationale: The sole revision changes the postposition governing the recipient of the message from “తో” (“with”) to “కి” (“to”) and uses “మనిషి” to reflect the Hebrew masculine singular noun אִישׁ. All other wording is retained because it faithfully and naturally conveys the Hebrew text and preserves the verse’s unfinished quotation.
