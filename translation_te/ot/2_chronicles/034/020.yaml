translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. పేర్ల జాబితాలో తెలుగు విభక్తులను స్పష్టంగా జోడించి, వాక్యాంతంలోని לֵאמֹר తరువాతి వచనానికి దారితీసేలా ద్విబిందువుతో అనువదించబడింది. పాఠాంతర పాదటిప్పణి దానికి సంబంధించిన ‘అబ్దోను’ పేరు వద్దనే ఉంచబడింది.
