  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּ֡הוּ וְ/אֶת אֲחִיקָ֣ם בֶּן שָׁ֠פָן וְ/אֶת עַבְדּ֨וֹן בֶּן מִיכָ֜ה וְ/אֵ֣ת שָׁפָ֣ן הַ/סּוֹפֵ֗ר וְ/אֵ֛ת עֲשָׂיָ֥ה עֶֽבֶד הַ/מֶּ֖לֶךְ לֵ/אמֹֽר־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/020.yaml
  text: Then the king commanded Hilkiah[a], Ahikam son of Shaphan, Abdon son of Micah, Shaphan the scribe, and Asaiah the king’s servant, saying[b],
translation:
  language: te
  text: 'అప్పుడు రాజు హిల్కీయాకు, షాఫాను కుమారుడు అహీకాముకు, మీకా కుమారుడు అబ్దోనుకు[a], లేఖికుడైన షాఫానుకు, రాజు సేవకుడైన అసాయాకు[b] ఇలా ఆజ్ఞాపించాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మసొరెటిక్ పాఠంలో ‘మీకా కుమారుడు అబ్దోను’ అని ఉంది. సమాంతర వచనమైన 2 రాజులు 22:12లో ‘మీకాయా కుమారుడు అక్బోరు’ అని ఉంది.
    reason: textual_variant
  - marker: b
    text: లేదా, ‘రాజు అధికారి అయిన అసాయా.’ హీబ్రూ మూలంలో అక్షరార్థంగా ‘రాజు సేవకుడు’ అని ఉంది; ఈ మాట రాజసభ అధికారిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ఆజ్ఞాపించాడు
  rationale: צוה అనే క్రియ రాజు అధికారపూర్వకంగా ఇచ్చిన ఆదేశాన్ని సూచిస్తుంది; ‘ఆజ్ఞాపించాడు’ ఆ బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: సందర్భంలో యోషీయాను సూచించే నిర్దిష్ట నామవాచకం; తెలుగులో ‘రాజు’ సహజమైన రూపం.
- source_word: חִלְקִיָּהוּ
  choice: హిల్కీయా
  rationale: హీబ్రూ వ్యక్తినామానికి దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణ.
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: షాఫాను కుమారుడు అహీకాము
  rationale: בן ద్వారా వ్యక్తమయ్యే తండ్రి-కొడుకు సంబంధాన్ని తెలుగులో సహజమైన పరిచయ క్రమంలో అందించింది.
- source_word: עַבְדּוֹן בֶּן מִיכָה
  choice: మీకా కుమారుడు అబ్దోను
  rationale: వృత్తాంత గ్రంథంలోని మసొరెటిక్ పాఠాన్ని అనుసరించి పేర్లను లిప్యంతరీకరించి, వంశపరిచయాన్ని సహజమైన తెలుగులో తెలిపింది.
- source_word: שָׁפָן הַסּוֹפֵר
  choice: లేఖికుడైన షాఫాను
  rationale: סֹפֵר రాజసభ కార్యదర్శిని లేదా లేఖికుణ్ణి సూచించవచ్చు; ‘లేఖికుడు’ మూలపద భావాన్ని పారదర్శకంగా ఉంచుతుంది.
- source_word: עֲשָׂיָה עֶבֶד הַמֶּלֶךְ
  choice: రాజు సేవకుడైన అసాయా
  rationale: עֶבֶד యొక్క ప్రాథమిక అర్థమైన ‘సేవకుడు’ను నిలిపింది; రాజసభ సందర్భంలో ఇది అధికారిని కూడా సూచించవచ్చని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: לֵאמֹר
  choice: 'ఇలా ఆజ్ఞాపించాడు:'
  rationale: తరువాతి వచనంలో వచ్చే ప్రత్యక్ష ఆజ్ఞను పరిచయం చేసే హీబ్రూ సూత్రప్రయోగాన్ని తెలుగులో సహజంగా సూచించడానికి ‘ఇలా’తో పాటు ద్విబిందువు వాడింది.
