  text: וַ/יַּעֲמֵ֕ד אֵ֛ת כָּל הַ/נִּמְצָ֥א בִ/ירוּשָׁלִַ֖ם וּ/בִנְיָמִ֑ן וַֽ/יַּעֲשׂוּ֙ יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם כִּ/בְרִ֥ית אֱלֹהִ֖ים אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/032.yaml
  text: Then he made everyone who was found in Jerusalem and Benjamin stand to it[a], and the inhabitants of Jerusalem acted according to the covenant of God[b], the God of their fathers.
translation:
  language: te
  text: 'అప్పుడు అతడు యెరూషలేములోనూ బెన్యామీనులోనూ ఉన్న వారందరినీ నిలబడేలా చేశాడు[a]. యెరూషలేము నివాసులు దేవుని—తమ పూర్వికుల దేవుని—నిబంధన ప్రకారం నడుచుకున్నారు.


    [a] ఇక్కడ “నిలబడేలా చేశాడు” అంటే వారిని కేవలం నిలబెట్టాడని కూడా అర్థం కావచ్చు; సందర్భాన్ని బట్టి, నిబంధనకు కట్టుబడి నిలిచేలా చేశాడనే భావం కూడా ఉండవచ్చు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “నిలబడేలా చేశాడు” అంటే వారిని కేవలం నిలబెట్టాడని కూడా అర్థం కావచ్చు; సందర్భాన్ని బట్టి, నిబంధనకు కట్టుబడి నిలిచేలా చేశాడనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: నిలబడేలా చేశాడు
  rationale: עמד ధాతువు హిఫీల్ రూపంలో ప్రాథమికంగా ‘నిలబడేలా చేయడం’ అని అర్థం. మూలంలో నిబంధనను సూచించే ప్రత్యక్ష పూరకం లేదు; కాబట్టి అనువాదంలో దానిని ప్రధాన వాక్యానికి చేర్చకుండా, సందర్భసూచిత నిబద్ధత భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אֵת כָּל־הַנִּמְצָא
  choice: ఉన్న వారందరినీ
  rationale: అక్షరార్థమైన ‘కనబడిన ప్రతివారినీ’ కంటే, ఈ సందర్భంలో అక్కడ హాజరై ఉన్న మొత్తం ప్రజలను సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: בִירוּשָׁלַם וּבִנְיָמִן
  choice: యెరూషలేములోనూ బెన్యామీనులోనూ
  rationale: మూలంలోని రెండు స్థలనామాలను యథాతథంగా ఉంచాం. ‘బెన్యామీను’ గోత్రప్రాంతాన్ని సూచించే అవకాశం ఉన్నా, మూలంలో ‘ప్రాంతం’ అనే పదం లేదు.
- source_word: וַיַּעֲשׂוּ ... כִּבְרִית
  choice: నిబంధన ప్రకారం నడుచుకున్నారు
  rationale: עשה + כ నిర్మాణం నిబంధనకు అనుగుణంగా ప్రవర్తించడాన్ని సూచిస్తుంది. ‘నడుచుకున్నారు’ సహజమైన తెలుగులో ఆచరణాత్మక విధేయతను తెలియజేస్తుంది.
- source_word: אֱלֹהִים אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: దేవుని—తమ పూర్వికుల దేవుని—
  rationale: మూలంలోని పునరుక్తితో కూడిన సమానాధికార నిర్మాణాన్ని నిలిపి, రెండవ పదబంధం మొదటి ‘దేవుని’ని గుర్తింపజేస్తున్నట్లు స్పష్టంగా చూపాం.
theological_decisions:
- issue: యోషీయా ప్రజలను ‘నిలబడేలా చేయడం’ యొక్క నిబంధనాత్మక భావం
  choice: ప్రధాన వాక్యంలో మూలంలోని నిలబడేలా చేయడం అనే రూపకాన్ని మాత్రమే ఉంచి, నిబంధనకు కట్టుబడేలా చేశాడనే సందర్భసూచిత భావాన్ని పాదటిప్పణిలో తెలిపాం.
  alternative: అతడు వారిని నిబంధనకు కట్టుబడి నిలిచేలా చేశాడు.
  rationale: సందర్భం నిబంధన పునరుద్ధరణకు సంబంధించినదైనా, וַיַּעֲמֵד అనే క్రియకు మూలవాక్యంలో ‘నిబంధనకు’ అనే పూరకం లేదు. అందువల్ల సాధ్యమైన నిబంధనాత్మక భావాన్ని బలవంతంగా ప్రధాన పాఠ్యంలో చేర్చకుండా నిజమైన సందిగ్ధతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించాం. ‘పితరులు’ కంటే సాధారణ పాఠకులకు స్పష్టమైన ‘పూర్వికులు’ వాడాం. మూలంలోని దేవుని పేరుపదబంధ పునరుక్తిని డాష్‌లతో చదవడానికి సులభంగా ఉంచాం.
