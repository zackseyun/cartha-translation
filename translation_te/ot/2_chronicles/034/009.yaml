revisions:
- from: అప్పుడు వారు ప్రధాన యాజకుడైన హిల్కీయా దగ్గరకు వచ్చి, దేవుని మందిరంలోకి తీసుకురాబడిన డబ్బును అతనికి అప్పగించారు. గడప కాపలాదారులైన[a] లేవీయులు మనష్షే, ఎఫ్రాయిము వారినుంచి, ఇశ్రాయేలులో మిగిలిన వారందరినుంచి, యూదా, బెన్యామీను వారందరినుంచి, యెరూషలేము నివాసులనుంచి ఆ డబ్బును సేకరించారు.
