id: 2CH.34.9
reference: 2 Chronicles 34:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ אֶל חִלְקִיָּ֣הוּ הַ/כֹּהֵ֣ן הַ/גָּד֗וֹל וַֽ/יִּתְּנוּ֮ אֶת הַ/כֶּסֶף֮ הַ/מּוּבָ֣א בֵית אֱלֹהִים֒ אֲשֶׁ֣ר אָסְפֽוּ הַ/לְוִיִּם֩ שֹׁמְרֵ֨י הַ/סַּ֜ף מִ/יַּ֧ד מְנַשֶּׁ֣ה וְ/אֶפְרַ֗יִם וּ/מִ/כֹּל֙ שְׁאֵרִ֣ית יִשְׂרָאֵ֔ל וּ/מִ/כָּל יְהוּדָ֖ה וּ/בִנְיָמִ֑ן ו/ישבי יְרֽוּשָׁלִָֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/009.yaml
  text: Then they came to Hilkiah the high priest and gave the money that had been brought into the house of God[a], which the Levites, the keepers of the threshold, had collected from Manasseh and Ephraim and from all the remnant of Israel, and from all Judah and Benjamin and the inhabitants of Jerusalem.
translation:
  language: te
  text: అప్పుడు వారు ప్రధాన యాజకుడైన హిల్కీయా దగ్గరకు వచ్చి, దేవుని మందిరంలోకి తీసుకురాబడిన డబ్బును అతనికి అప్పగించారు. గడప కాపలాదారులైన[a] లేవీయులు మనష్షే, ఎఫ్రాయిముల నుండీ, ఇశ్రాయేలు మిగిలిన వారందరి నుండీ, యూదా, బెన్యామీనులందరి నుండీ, యెరూషలేము నివాసుల నుండీ ఆ డబ్బును సేకరించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “గడపను కాపాడేవారు”; లేదా “ద్వారపాలకులు,” “గేటు కాపలాదారులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: అప్పుడు వారు ... వచ్చి
  rationale: వయ్యిక్తోల్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ వరుస క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: ప్రధాన యాజకుడు
  rationale: ఇది ప్రధాన యాజక పదవికి తెలుగులో స్థిరమైన, సందర్భోచితమైన ప్రయోగం.
- source_word: וַיִּתְּנוּ
  choice: అతనికి అప్పగించారు
  rationale: నిధులను హిల్కీయాకు అందజేయడమే సందర్భార్థం; ‘అప్పగించారు’ స్వీకర్తను స్పష్టంచేస్తూ సహజంగా ఉంది.
- source_word: הַכֶּסֶף
  choice: డబ్బు
  rationale: పదానికి అక్షరార్థం ‘వెండి’ అయినా, ఇక్కడ ఆలయ నిధిని సూచిస్తుంది; ‘డబ్బు’ ఆధునిక పాఠకునికి ఉద్దేశిత అర్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: הַמּוּבָא בֵית אֱלֹהִים
  choice: దేవుని మందిరంలోకి తీసుకురాబడిన
  rationale: నిష్క్రియ కృదంత భావాన్ని నిలుపుతూ, בֵית אֱלֹהִים అనే దేవుని ఆలయాన్ని సూచించే పదబంధాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: שֹׁמְרֵי הַסַּף
  choice: గడప కాపలాదారులు
  rationale: హీబ్రూ రూపకాన్ని నేరుగా నిలుపుతుంది; వారి కార్యాన్ని తెలిపే ‘ద్వారపాలకులు’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: מִיַּד
  choice: వారినుంచి
  rationale: ‘చేతినుంచి’ అనే హీబ్రూ నుడికారానికి ఈ సేకరణ సందర్భంలో ‘వారినుంచి’ సహజ తెలుగు సమానార్థకం.
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: ఇశ్రాయేలులో మిగిలిన వారు
  rationale: ఉత్తర గోత్రాలలో మిగిలిన ప్రజలను సూచించే సరళ అర్థాన్ని ఇస్తూనే ‘మిగిలినవారు’ అనే మూలపద భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: שְׁאֵרִית (‘శేషం/మిగిలినవారు’) లోని సంభావ్య నిబంధనాత్మక భావం
  choice: ఇశ్రాయేలులో మిగిలిన వారందరు
  alternative: ఇశ్రాయేలు శేషమంతా
  rationale: ఎంచుకున్న రూపం సందర్భంలోని ప్రజలను సహజంగా సూచిస్తూ, వారు ఇశ్రాయేలులో మిగిలినవారనే భావాన్ని నిలుపుతుంది. ‘శేషం’ అనే పదంతో అధిక సాంకేతిక లేదా సిద్ధాంతపరమైన అర్థాన్ని బలవంతంగా రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. పొడవైన హీబ్రూ వాక్యాన్ని స్పష్టత కోసం రెండు తెలుగు వాక్యాలుగా విభజించాం. పాదసూచిక గుర్తును దాని సంబంధిత పదబంధమైన ‘గడప కాపలాదారులు’ దగ్గర ఉంచాం.
