  text: At that time King Ahaz sent to the kings of Assyria for help[a].
translation:
  language: te
  text: ఆ సమయంలో రాజైన అహాజు తనకు సహాయం చేయమని అష్షూరు రాజులకు పంపాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అష్షూరు రాజులు’ అని బహువచనం ఉంది; చారిత్రక పరిస్థితికి సరిపోల్చుతూ కొన్ని అనువాదాలు ‘అష్షూరు రాజు’ అని ఏకవచనంలో ఇస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: ఆ సమయంలో
  rationale: కథనంలోని కాలసందర్భాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేసే ప్రామాణిక ప్రయోగం.
- source_word: שָׁלַח
  choice: పంపాడు
  rationale: హీబ్రూ క్రియలో దూతలను లేదా సందేశాన్ని అనే కర్మ స్పష్టంగా లేదు; కాబట్టి వాటిని పాఠ్యంలో చేర్చకుండా క్రియను మాత్రమే నిలిపాం.
- source_word: הַמֶּלֶךְ אָחָז
  choice: అహాజు రాజు
  rationale: బిరుదు, వ్యక్తిపేరు రెండింటినీ సహజమైన తెలుగు పదక్రమంలో ఉంచుతుంది.
- source_word: עַל
  choice: దగ్గరికి
  rationale: ఈ సందర్భంలో సహాయం కోరుతూ ఒక అధికారి వద్దకు పంపడమనే దిశను సూచిస్తుంది; ‘వ్యతిరేకంగా’ అనే అర్థం ఇక్కడ సరిపోదు.
- source_word: מַלְכֵי אַשּׁוּר
  choice: అష్షూరు రాజులు
  rationale: మసొరెటిక్ హీబ్రూ పాఠంలోని బహువచనాన్ని చారిత్రక అంచనాతో ఏకవచనంగా మార్చకుండా నిలిపాం.
- source_word: לַעְזֹר לוֹ
  choice: తనకు సహాయం చేయమని
  rationale: ఉద్దేశాన్ని తెలిపే infinitive నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, సహాయం అహాజుకే కావాలని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: చారిత్రకంగా ఊహించబడే ఏకవచనం బదులు హీబ్రూ పాఠంలోని ‘అష్షూరు రాజులు’ అనే బహువచనాన్ని ఉంచాలా?
  choice: ప్రధాన పాఠ్యంలో ‘అష్షూరు రాజులు’ అనే మసొరెటిక్ బహువచనాన్ని నిలిపాం.
  alternative: ‘అష్షూరు రాజు’
  rationale: ఇది సిద్ధాంతపరంగా కీలకమైన అంశం కాకపోయినా మూలపాఠానికి సంబంధించిన గమనించదగిన భేదం. చారిత్రక పరిస్థితికి సరిపోల్చేందుకు పాఠాన్ని నిశ్శబ్దంగా మార్చకుండా, మూలంలోని నిజమైన రూపాన్ని నిలిపి ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి. మూలంలో చెప్పని ‘దూతలను’ వంటి కర్మను చేర్చలేదు; హీబ్రూ బహువచనాన్ని ప్రధాన పాఠ్యంలో యథాతథంగా నిలిపాం.
