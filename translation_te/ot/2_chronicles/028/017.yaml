translation:
  language: te
  text: ఎదోమీయులు కూడా వచ్చి యూదాపై దాడిచేసి, బందీలను పట్టుకొని వెళ్లారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వచ్చి యూదాలో దాడి చేసి, బందీలను పట్టుకున్నారు.” హీబ్రూలో సాధారణ సైనిక క్రియ అయిన “కొట్టు” అనే పదంతో పాటు, బందీలుగా పట్టుకోవడాన్ని సూచించే సమానమూల క్రియ, నామవాచకం ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  choice: కూడా
  rationale: యూదాపై జరిగిన విరోధ చర్యల వరుసలో ఇది మరొక సంఘటన అని సూచిస్తుంది.
- source_word: אֲדוֹמִים
  choice: ఎదోమీయులు
  rationale: ఈ బహువచన జాతివాచకం ఎదోము ప్రాంతాన్ని కాక, ఎదోము ప్రజలను సూచిస్తుంది.
- source_word: בָּאוּ
  choice: వచ్చి
  rationale: పూర్తయిన చర్యను సహజమైన తెలుగు కథన క్రమంలో తదుపరి క్రియతో అనుసంధానిస్తుంది.
- source_word: וַיַּכּוּ בִיהוּדָה
  choice: యూదాపై దాడిచేసి
  rationale: נכה అనే సాధారణ సైనిక క్రియకు సందర్భానుగుణంగా ‘దాడిచేయు’ స్పష్టంగా ఉంటుంది; సంపూర్ణ ఓటమిని అనవసరంగా సూచించదు. ב ఉపసర్గను ‘పై’గా ఇవ్వడం సహజమైన తెలుగు ప్రయోగం.
- source_word: וַיִּשְׁבּוּ שֶׁבִי
  choice: బందీలను పట్టుకొని వెళ్లారు
  rationale: క్రియ, దానికి సమానమూలమైన నామవాచకం కలసి ప్రజలను బందీలుగా తీసుకెళ్లడాన్ని సూచిస్తాయి; తెలుగు భాషలోని అసహజ మూలపద పునరుక్తిని నివారిస్తూ భావాన్ని నిలుపుతుంది.
