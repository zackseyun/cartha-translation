revisions:
- from: పేరుపేరునా నియమించబడిన ఆ మనుషులు లేచి, బందీల బాధ్యత తీసుకున్నారు. దోపుడు సొమ్ములోని బట్టలతో వారిలో బట్టలు లేని వారందరినీ కప్పారు. వారికి బట్టలు తొడిగారు, చెప్పులు వేశారు, ఆహారం పెట్టారు, తాగడానికి ఇచ్చారు, నూనె రాశారు. నడవలేక తడబడుతున్న వారందరినీ గాడిదలపై ఎక్కించి నడిపించారు. వారిని ఖర్జూర చెట్ల నగరమైన యెరికోకు, వారి సోదరుల[a] దగ్గరకు తీసుకువచ్చారు. ఆ తర్వాత వారు సమరయకు తిరిగి వెళ్లారు.
  to: పేరుపేరునా నియమించబడిన ఆ మనుషులు లేచి, బందీల బాధ్యత తీసుకున్నారు. దోపుడు సొమ్ముతో వారిలో బట్టలు లేని వారందరికీ బట్టలు తొడిగారు. వారికి చెప్పులు వేశారు, ఆహారం పెట్టారు, పానీయం ఇచ్చారు, నూనె పూశారు. వారిలో బలహీనంగా ఉన్న వారందరినీ గాడిదలపై ఎక్కించి నడిపించారు. వారిని ఖర్జూర చెట్ల నగరమైన యెరికోకు, వారి సోదరుల[a] దగ్గరకు తీసుకువచ్చారు. ఆ తర్వాత వారు సమరయకు తిరిగి వెళ్లారు.
  rationale: The revision retains every clause and the Hebrew’s repeated actions of care, while avoiding an added specification that the spoil itself is explicitly described as clothing. It also renders the weak/faltering persons without asserting that they were unable to walk, makes the provision of drink explicit, and uses more natural modern Telugu for applying oil. The footnote anchor remains attached to “సోదరుల,” and its alternatives preserve the contextual breadth of the source term.
  reviewer_model: gpt-5.6-terra
