  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּקֻ֣מוּ הָ/אֲנָשִׁים֩ אֲשֶׁר נִקְּב֨וּ בְ/שֵׁמ֜וֹת וַ/יַּחֲזִ֣יקוּ בַ/שִּׁבְיָ֗ה וְ/כָֽל מַעֲרֻמֵּי/הֶם֮ הִלְבִּ֣ישׁוּ מִן הַ/שָּׁלָל֒ וַ/יַּלְבִּשׁ֣וּ/ם וַ֠/יַּנְעִלוּ/ם וַ/יַּאֲכִל֨וּ/ם וַ/יַּשְׁק֜וּ/ם וַ/יְסֻכ֗וּ/ם וַ/יְנַהֲל֤וּ/ם בַּ/חֲמֹרִים֙ לְ/כָל כּוֹשֵׁ֔ל וַ/יְבִיא֛וּ/ם יְרֵח֥וֹ עִיר הַ/תְּמָרִ֖ים אֵ֣צֶל אֲחֵי/הֶ֑ם וַ/יָּשׁ֖וּבוּ שֹׁמְרֽוֹן־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/015.yaml
  text: Then the men who had been designated by name stood up and took charge of the captives[a], and from the spoil they clothed all who were naked among them. They clothed them, put sandals on them, fed them, gave them drink, anointed them, and led all the feeble among them on donkeys. They brought them to Jericho, the city of palm trees, to their brothers; then they returned to Samaria.
translation:
  language: te
  text: పేరుపేరునా నియమించబడిన ఆ మనుషులు లేచి, బందీల బాధ్యత తీసుకున్నారు. దోపుడు సొమ్ముతో వారిలో బట్టలు లేని వారందరికీ బట్టలు తొడిగారు. వారికి చెప్పులు వేశారు, ఆహారం పెట్టారు, పానీయం ఇచ్చారు, నూనె పూశారు. వారిలో బలహీనంగా ఉన్న వారందరినీ గాడిదలపై ఎక్కించి నడిపించారు. వారిని ఖర్జూర చెట్ల నగరమైన యెరికోకు, వారి సోదరుల[a] దగ్గరకు తీసుకువచ్చారు. ఆ తర్వాత వారు సమరయకు తిరిగి వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారి బంధువుల”; లేదా “తోటి ఇశ్రాయేలీయుల.”
    reason: אֲחֵיהֶם అనే పదం అక్షరార్థంగా “వారి సోదరులు” అయినా, ఇక్కడ విస్తృత బంధుత్వాన్ని లేదా తోటి నిబంధన ప్రజలను సూచించవచ్చు.
lexical_decisions:
- source_word: נִקְּבוּ בְשֵׁמוֹת
  choice: పేరుపేరునా నియమించబడిన
  rationale: నిఫాల్ రూపం వీరు ప్రత్యేకంగా పేర్లతో గుర్తించి ఈ బాధ్యతకు నియమించబడినవారని సూచిస్తుంది; ఈ తెలుగు రూపం గుర్తింపునూ నియామక భావాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּחֲזִיקוּ בַשִּׁבְיָה
  choice: బందీల బాధ్యత తీసుకున్నారు
  rationale: ఈ దయాపూర్వక సందర్భంలో క్రియ శత్రుత్వంగా పట్టుకోవడం కంటే బందీల సంరక్షణ బాధ్యత చేపట్టడాన్ని సూచిస్తుంది.
- source_word: מַעֲרֻמֵּיהֶם
  choice: వారిలో బట్టలు లేని వారందరినీ
  rationale: బందీలలో వస్త్రాలు లేకుండా చేయబడినవారిని సూచించే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: הִלְבִּישׁוּ מִן הַשָּׁלָל
  choice: దోపుడు సొమ్ములోని బట్టలతో ... కప్పారు
  rationale: వస్త్రాలు దోపుడు సొమ్ము నుంచే తీసుకున్నారనే మూలపాఠ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וַיַּלְבִּשׁוּם
  choice: వారికి బట్టలు తొడిగారు
  rationale: హీబ్రూ పునరుక్తిని తొలగించకుండా, వారికి స్వయంగా వస్త్రాలు తొడిగారనే శ్రద్ధను తెలియజేస్తుంది.
- source_word: וַיַּנְעִלוּם
  choice: చెప్పులు వేశారు
  rationale: పాదరక్షలు తొడిగించడాన్ని పురాతన సందర్భానికి తగిన, అందరికీ అర్థమయ్యే భాషలో చెబుతుంది.
- source_word: וַיַּאֲכִלוּם וַיַּשְׁקוּם
  choice: ఆహారం పెట్టారు, తాగడానికి ఇచ్చారు
  rationale: తినిపించడం, పానీయం ఇవ్వడం అనే రెండు క్రియలను, పానీయం నీరేనని అనవసరంగా నిర్దిష్టం చేయకుండా అనువదిస్తుంది.
- source_word: וַיְסֻכוּם
  choice: నూనె రాశారు
  rationale: ఈ సందర్భంలో ఆచారపూర్వక అభిషేకం కంటే శరీర సంరక్షణకై నూనె పూయడం ఉద్దేశం; అందుకే సందర్భానుగుణమైన ప్రత్యక్ష రూపం ఎంచుకున్నారు.
- source_word: לְכָל כּוֹשֵׁל
  choice: నడవలేక తడబడుతున్న వారందరినీ
  rationale: כושל యొక్క తడబడే లేదా బలహీనపడిన వ్యక్తి అనే సజీవ భావాన్ని నిలుపుతుంది.
- source_word: וַיְנַהֲלוּם בַּחֲמֹרִים
  choice: గాడిదలపై ఎక్కించి నడిపించారు
  rationale: బలహీనులను గాడిదలపై తీసుకెళ్లిన సున్నితమైన నడిపింపు భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְרֵחוֹ עִיר הַתְּמָרִים
  choice: ఖర్జూర చెట్ల నగరమైన యెరికో
  rationale: యెరికోకు ఉన్న హీబ్రూ విశేషణాన్ని పారదర్శకంగా అనువదిస్తుంది.
theological_decisions:
- issue: אֲחֵיהֶם అనే బంధుత్వ పదం
  choice: వారి సోదరులు
  alternative: వారి బంధువులు; తోటి ఇశ్రాయేలీయులు
  rationale: మూలంలోని పురుష బహువచన బంధుత్వ పదాన్ని ప్రధాన పాఠంలో సూటిగా నిలుపుతూ, సందర్భంలో దానికి విస్తృతమైన జాతి లేదా నిబంధన సమాజ బంధుత్వ భావం ఉండవచ్చని పాదటిప్పణిలో తెలియజేశారు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సరళమైన శైలి. హీబ్రూ వరుస క్రియల వేగాన్ని చిన్న వాక్యాలతో నిలిపి, వస్త్రధారణకు సంబంధించిన ఉద్దేశపూర్వక పునరుక్తిని కాపాడాం.
