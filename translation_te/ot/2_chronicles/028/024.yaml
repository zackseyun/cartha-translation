  text: וַ/יֶּאֱסֹ֨ף אָחָ֜ז אֶת כְּלֵ֣י בֵית הָֽ/אֱלֹהִ֗ים וַ/יְקַצֵּץ֙ אֶת כְּלֵ֣י בֵית הָֽ/אֱלֹהִ֔ים וַ/יִּסְגֹּ֖ר אֶת דַּלְת֣וֹת בֵּית יְהוָ֑ה וַ/יַּ֨עַשׂ ל֧/וֹ מִזְבְּח֛וֹת בְּ/כָל פִּנָּ֖ה בִּ/ירוּשָׁלִָֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/024.yaml
  text: Ahaz gathered the vessels of the house of God and cut up the vessels of the house of God, and he shut the doors of the house of the LORD and made for himself altars in every corner of Jerusalem.
translation:
  language: te
  text: ఆహాజు దేవుని మందిరపు ఉపకరణాలను సేకరించి, దేవుని మందిరపు ఉపకరణాలను ముక్కలుగా నరికివేశాడు. యెహోవా మందిరపు తలుపులను మూసివేసి, యెరూషలేములోని ప్రతి మూలలో తనకోసం బలిపీఠాలను నిర్మించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּלֵי
  choice: సామగ్రి
  rationale: పాత్రలు లేదా ఉపకరణాలు అనే ఒక్క వర్గానికి పరిమితం చేయకుండా, మందిర సేవలోని వస్తువులన్నిటినీ సూచించగల సహజమైన సమగ్ర పదం.
- source_word: וַיְקַצֵּץ
  choice: ముక్కలుగా నరికించాడు
  rationale: హీబ్రూ క్రియలో ఉన్న కోసి ముక్కలు చేయడం అనే బలమైన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בְּכָל־פִּנָּה
  choice: ప్రతి మూలలో
  rationale: మూలపాఠంలోని స్థలసూచక రూపాన్ని నేరుగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా వ్యక్తినామంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: దేవుని మందిరం మరియు యెహోవా మందిరం అనే సమాంతర నామాలు
  choice: రెండు రూపాలనూ మూలపాఠం ప్రకారం వేర్వేరుగా నిలుపుట
  alternative: అన్నిచోట్లా ఒకే రూపంగా ‘యెహోవా మందిరం’ లేదా ‘ప్రభువు మందిరం’ అని ఏకరీకరించడం
  rationale: మూలపాఠంలోని בֵּית הָאֱלֹהִים మరియు בֵּית יְהוָה మధ్య ఉన్న పదభేదాన్ని సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ కథనంలోని వరుస చర్యలను సహజమైన తెలుగు వాక్యాలుగా అందించాం.
