source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ לָ/הֶ֗ם לֹא תָבִ֤יאוּ אֶת הַ/שִּׁבְיָה֙ הֵ֔נָּה כִּי֩ לְ/אַשְׁמַ֨ת יְהוָ֤ה עָלֵ֨י/נוּ֙ אַתֶּ֣ם אֹמְרִ֔ים לְ/הֹסִ֥יף עַל חַטֹּאתֵ֖י/נוּ וְ/עַל אַשְׁמָתֵ֑י/נוּ כִּֽי רַבָּ֤ה אַשְׁמָה֙ לָ֔/נוּ וַ/חֲר֥וֹן אָ֖ף עַל יִשְׂרָאֵֽל־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/013.yaml
  text: And they said to them[a], “Do not bring the captives here, for you are proposing to add to our sins and to our guilt, bringing guilt from Yahweh upon us, because our guilt is already great[b], and there is fierce anger against Israel.”
translation:
  language: te
  text: 'వారు వారితో ఇలా అన్నారు: “బందీలను ఇక్కడికి తీసుకురావద్దు. ఎందుకంటే మీరు మన పాపాలకూ మన దోషానికీ మరింత జోడించి, యాహ్వే నుండి మన మీదికి అపరాధభారాన్ని[a] తెచ్చాలని అనుకుంటున్నారు. మన దోషభారం ఇప్పటికే ఎంతో గొప్పది; ఇశ్రాయేలు మీద తీవ్రమైన కోపం ఉంది[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వేకు విరోధంగా చేసిన అపరాధం మనపై ఉంది.” హీబ్రూ పదబంధం సంక్షిప్తంగా ఉంది; అది యాహ్వే తీర్పువల్ల మనపైకి వచ్చే అపరాధభారాన్ని గానీ, యాహ్వేకు విరోధంగా చేసిన అపరాధాన్ని గానీ నొక్కిచెప్పవచ్చు.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “కోపం మండడం”; ఇది అత్యంత తీవ్రమైన ఆగ్రహాన్ని సూచించే నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשִּׁבְיָה
  choice: బందీలను
  rationale: ఈ నామవాచకం బందీ స్థితిని లేదా బందీల సమూహాన్ని సూచించగలదు; ‘ఇక్కడికి తీసుకురావద్దు’ అనే సందర్భంలో వ్యక్తులైన బందీలే ఉద్దేశం.
- source_word: הֵנָּה
  choice: ఇక్కడికి
  rationale: మాట్లాడుతున్నవారి స్థలంవైపు కదలికను సూచించే దిశార్థక క్రియావిశేషణం.
- source_word: לְאַשְׁמַת יְהוָה עָלֵינוּ
  choice: యాహ్వే నుండి మనపై అపరాధభారం తెచ్చి
  rationale: మూలంలోని సంక్షిప్తమైన, క్లిష్టమైన పదబంధాన్ని పూర్తిగా ఒకే అర్థానికి పరిమితం చేయకుండా, యాహ్వే తీర్పు మూలంగా తమపై పడే అపరాధభావాన్ని ప్రధాన పాఠంలో వ్యక్తం చేసింది; ప్రత్యామ్నాయ సంబంధాన్ని పాదసూచికలో ఉంచింది.
- source_word: אַתֶּם אֹמְרִים
  choice: మీరు … అనుకుంటున్నారు
  rationale: అక్షరార్థంగా ‘మీరు అంటున్నారు’; ఇక్కడ మాటకన్నా ఉద్దేశించిన చర్యను సూచిస్తున్నందున సహజమైన తెలుగు ప్రయోగం ఎంచుకుంది.
- source_word: לְהֹסִיף עַל
  choice: … ఇంకా చేర్చి
  rationale: ఇప్పటికే ఉన్న పాపం, అపరాధం మీద మరింత కూడబెట్టే భావాన్ని నిలుపుతుంది.
- source_word: חַטֹּאתֵינוּ
  choice: మన పాపాలకు
  rationale: పాపకార్యాలు లేదా అతిక్రమణలను సూచించే సాధారణ పదం; తరువాతి ‘అపరాధం’ నుండి భేదం నిలుపబడింది.
- source_word: אַשְׁמָתֵינוּ / אַשְׁמָה
  choice: మన అపరాధానికి / మన అపరాధం
  rationale: పాపకార్యాలకన్నా వాటివల్ల కలిగే దోషస్థితి లేదా బాధ్యతను సూచించేందుకు ‘అపరాధం’ వాడింది.
- source_word: רַבָּה
  choice: ఇప్పటికే చాలా గొప్పది
  rationale: ప్రధాన అర్థం ‘గొప్పది’; మరింత అపరాధం చేర్చబడబోతోందనే సందర్భబద్ధ వాదనను ‘ఇప్పటికే’ స్పష్టం చేస్తుంది.
- source_word: וַחֲרוֹן אָף
  choice: తీవ్రమైన కోపం
  rationale: అక్షరార్థంగా ‘కోపం మండడం’; ఆధునిక తెలుగులో సహజంగా తీవ్రతను తెలియజేసే రూపం.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు మీద
  rationale: దైవిక కోపం ఎవరికి విరోధంగా ఉందో తెలిపే సహజ తెలుగు నిర్మాణం; మూలంలోని ‘ఇశ్రాయేలు’ పేరును యథాతథంగా నిలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’ ఉచ్చారణకు సమీపమైన తెలుగు రూపంలో ఇచ్చింది.
- issue: ఉత్తర రాజ్య సందర్భంలో ‘ఇశ్రాయేలు’ గుర్తింపు
  choice: ఇశ్రాయేలు
  alternative: ఎఫ్రాయిము / ఉత్తర రాజ్యం
  rationale: మూలపాఠం చెప్పిన పేరునే నిలిపి, చారిత్రక సూచనను అనువాదంలో మరీ సంకుచితం చేయలేదు.
- issue: לְאַשְׁמַת יְהוָה עָלֵינוּ అనే క్లిష్ట పదబంధం
  choice: యాహ్వే నుండి మనపై అపరాధభారం
  alternative: యాహ్వేకు విరోధంగా మనపై ఉన్న అపరాధం
  rationale: పదబంధం యాహ్వే తీర్పు మూలంగా కలిగే దోషబాధ్యతను లేదా యాహ్వేకు సంబంధించి చేసిన అపరాధాన్ని నొక్కిచెప్పవచ్చు. ప్రధాన పాఠంలో మొదటి అవకాశాన్ని ఉంచి, నిజమైన సందిగ్ధతను పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని ‘పాపాలు/అపరాధం’ భేదం, దైవనామం, క్లిష్టమైన అపరాధ పదబంధంలోని సందిగ్ధత నిలుపబడ్డాయి. పాదసూచిక గుర్తులు అవి వివరిస్తున్న సంబంధిత పదబంధాల దగ్గర ఉంచబడ్డాయి.
