revisions:
- from: 'వారు వారితో ఇలా అన్నారు: “బందీలను ఇక్కడికి తీసుకురావద్దు. ఎందుకంటే మీరు మన పాపాలకు, మన అపరాధానికి ఇంకా చేర్చి, యాహ్వే నుండి మనపై అపరాధభారం తెచ్చాలని అనుకుంటున్నారు[a]. మన అపరాధం ఇప్పటికే చాలా గొప్పది; ఇశ్రాయేలు మీద తీవ్రమైన కోపం ఉంది[b].”'
  to: 'వారు వారితో ఇలా అన్నారు: “బందీలను ఇక్కడికి తీసుకురావద్దు. ఎందుకంటే మీరు మన పాపాలకూ మన దోషానికీ మరింత జోడించి, యాహ్వే నుండి మన మీదికి అపరాధభారాన్ని[a] తెచ్చాలని అనుకుంటున్నారు. మన దోషభారం ఇప్పటికే ఎంతో గొప్పది; ఇశ్రాయేలు మీద తీవ్రమైన కోపం ఉంది[b].”'
  rationale: The revision makes the cumulative ‘add to our sins and to our guilt’ construction idiomatic in modern Telugu, distinguishes sins from guilt more consistently, and places footnote a directly on the disputed Hebrew phrase. It preserves the source’s ambiguity and does not add an interpretive resolution.
