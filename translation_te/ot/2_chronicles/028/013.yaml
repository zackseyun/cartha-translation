review_pass:
  verdict: revise
  source_fidelity: The draft preserves the concrete sense of הַשִּׁבְיָה (‘captives’), the intended-action force of אַתֶּם אֹמְרִים, the distinction between ‘sins’ and ‘guilt,’ Yahweh’s name, and ‘Israel.’ The difficult phrase לְאַשְׁמַת יְהוָה עָלֵינוּ is reasonably represented in the main text while retaining its alternate construal in a footnote.
  naturalness: 'The current middle clause is understandable but somewhat awkward: ‘మన పాపాలకు, మన అపరాధానికి ఇంకా చేర్చి’ lacks the idiomatic Telugu correlative construction for adding something to both items. ‘దోషభారం’ is also more natural and semantically precise than repeating ‘అపరాధం’ for the resulting state of guilt.'
  terminology: Use పాపాలు for חַטֹּאת and దోషం/దోషభారం for אַשְׁמָה to retain the Hebrew distinction between wrongful acts and accrued culpability. ‘తీవ్రమైన కోపం’ and ‘యాహ్వే’ are suitable modern-standard Telugu renderings.
  issues:
  - severity: medium
    issue: The expression ‘మన పాపాలకు, మన అపరాధానికి ఇంకా చేర్చి’ is syntactically and idiomatically weak.
    rationale: The Hebrew means adding further guilt/offence to both existing sins and guilt. Telugu naturally expresses this with ‘మన పాపాలకూ మన దోషానికీ మరింత జోడించి.’
  - severity: low
    issue: Footnote a is placed after ‘అనుకుంటున్నారు’ rather than immediately after the difficult phrase it explains.
    rationale: Moving the anchor to ‘అపరాధభారాన్ని[a]’ makes the footnote reference clear without affecting meaning.
