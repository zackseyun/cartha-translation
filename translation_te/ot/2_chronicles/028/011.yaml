  text: וְ/עַתָּ֣ה שְׁמָע֔וּ/נִי וְ/הָשִׁ֨יבוּ֙ הַ/שִּׁבְיָ֔ה אֲשֶׁ֥ר שְׁבִיתֶ֖ם מֵ/אֲחֵי/כֶ֑ם כִּ֛י חֲר֥וֹן אַף יְהוָ֖ה עֲלֵי/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/011.yaml
  text: Now listen to me[a], and return the captives whom you have taken from your brothers, for the burning anger of Yahweh is upon you.
translation:
  language: te
  text: ఇప్పుడు నా మాట వినండి. మీ సహోదరుల నుండి మీరు చెరపట్టిన బందీలను తిరిగి పంపించండి[a]. ఎందుకంటే యెహోవా యొక్క రగులుతున్న కోపం మీ మీద ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మీ తోటి ఇశ్రాయేలీయుల నుండి’ అని కూడా అర్థం చేసుకోవచ్చు. హీబ్రూ పాఠం ‘మీ సహోదరుల నుండి’ అని బంధుత్వ భాషను ఉపయోగిస్తుంది; ఇక్కడ అది అదే నిబంధన ప్రజలకు చెందినవారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: ప్రత్యక్ష ప్రసంగంలో అత్యవసరమైన మార్పును సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఇప్పుడు’ సహజంగా ఉంది.
- source_word: שְׁמָעוּנִי
  choice: నా మాట వినండి
  rationale: శ్రద్ధగా విని లోబడాలనే ఆజ్ఞార్థక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְהָשִׁיבוּ
  choice: తిరిగి పంపించండి
  rationale: שׁוב హిఫీల్ రూపం ‘తిరిగి వెళ్లేలా చేయండి’ అని సూచిస్తుంది; బందీల విషయంలో ‘తిరిగి పంపించండి’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: הַשִּׁבְיָה אֲשֶׁר שְׁבִיתֶם
  choice: మీరు చెరపట్టినవారిని
  rationale: సమూహవాచక నామాన్ని సందర్భానుసారంగా వ్యక్తులైన బందీలుగా వ్యక్తం చేస్తూ, మూలంలోని పట్టుకోవడం అనే భావాన్ని నిలుపుతుంది.
- source_word: מֵאֲחֵיכֶם
  choice: మీ సహోదరులలో నుండి
  rationale: మూలంలోని బంధుత్వ భాషను నిలుపుతుంది; ఇక్కడ అది అదే నిబంధన ప్రజలకు చెందిన తోటి ఇశ్రాయేలీయులను సూచిస్తుంది.
- source_word: כִּי חֲרוֹן אַף יְהוָה עֲלֵיכֶם
  choice: ఎందుకంటే యెహోవా రగులుతున్న కోపం మీ మీద ఉంది
  rationale: כִּי యొక్క కారణార్థాన్ని, חֲרוֹן אַף లోని వేడి/రగులుతున్న కోపం రూపకాన్ని, עַל లోని ‘మీ మీద’ చిత్రణను కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామాటన్‌ను తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపమైన ‘యెహోవా’గా లిప్యంతరీకరించింది; దానిని బిరుదుతో భర్తీ చేయలేదు.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. తెలుగులో స్థిరంగా, విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఉపయోగించి పేరును పేరుగానే నిలిపాము; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
- issue: ‘సహోదరులు’ అనే నిబంధన-బంధుత్వ భాష
  choice: సహోదరులు
  alternative: తోటి ఇశ్రాయేలీయులు
  rationale: మూలంలోని אָח (‘సోదరుడు/సహోదరుడు’) అనే బంధుత్వ పదాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది జాతీయ-నిబంధన సమాజంలోని తోటి సభ్యులను సూచిస్తుందనే విస్తృత భావాన్ని పాదటిప్పణిలో తెలిపాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలను వాడాము. వాక్యాన్ని సహజమైన తెలుగు ప్రవాహం కోసం రెండు వాక్యాలుగా ఉంచి, మూలంలోని అత్యవసరత, బంధుత్వ భాష, కోపం యొక్క వేడి రూపకం నిలిపాము.
