revisions:
- from: ఇప్పుడు నా మాట వినండి. మీ సహోదరులలో నుండి మీరు చెరపట్టినవారిని తిరిగి పంపించండి[a]. ఎందుకంటే యెహోవా రగులుతున్న కోపం మీ మీద ఉంది.
  to: ఇప్పుడు నా మాట వినండి. మీ సహోదరుల నుండి మీరు చెరపట్టిన బందీలను తిరిగి పంపించండి[a]. ఎందుకంటే యెహోవా యొక్క రగులుతున్న కోపం మీ మీద ఉంది.
  rationale: The revision changes ‘సహోదరులలో నుండి’ to ‘సహోదరుల నుండి’ to reflect the Hebrew preposition more precisely, adds ‘బందీలను’ for a clear concrete rendering of the collective noun הַשִּׁבְיָה, and supplies ‘యొక్క’ to express the Hebrew construct relationship, ‘Yahweh’s burning anger.’ The source’s kinship terminology, urgency, and burning-anger imagery are retained.
