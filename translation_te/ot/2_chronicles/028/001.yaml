source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֤ים שָׁנָה֙ אָחָ֣ז בְּ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/לֹא עָשָׂ֧ה הַ/יָּשָׁ֛ר בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/דָוִ֥יד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/001.yaml
  text: Ahaz was twenty years old when he became king[a], and he reigned sixteen years in Jerusalem. He did not do what was right in the eyes of Yahweh, as David his father had done.
translation:
  language: te
  text: ఆహాజు రాజైనప్పుడు అతనికి ఇరవై సంవత్సరాల వయస్సు. అతడు యెరూషలేములో పదహారు సంవత్సరాలు పరిపాలించాడు. అతడు తన తండ్రియైన దావీదు[a] వలె యాహ్వే దృష్టిలో సరైనది చేయలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “తండ్రి” అంటే ఆహాజు తక్షణ జనకుడు కాదు; అతని రాజవంశ పూర్వికుడైన దావీదు.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים שָׁנָה
  choice: అతనికి ఇరవై ఏళ్లు
  rationale: హీబ్రూ వయస్సు తెలిపే సాధారణ నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּמָלְכוֹ
  choice: రాజైనప్పుడు
  rationale: ఆహాజు సింహాసనాన్ని అధిష్ఠించిన సమయాన్ని సూచించే హీబ్రూ కాలప్రయోగాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: מָלַךְ
  choice: రాజ్యపాలన చేశాడు
  rationale: కేవలం రాజు అనే హోదాను కాకుండా రాజుగా పరిపాలించడాన్ని సూచిస్తుంది.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: పరిపాలన జరిగిన స్థలాన్ని నేరుగా తెలుపుతుంది.
- source_word: לֹא עָשָׂה הַיָּשָׁר
  choice: సరైనది చేయలేదు
  rationale: దినవృత్తాంతాలు, రాజులు గ్రంథాలలో కనిపించే నైతిక మూల్యాంకన సూత్రాన్ని సాధారణ ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యాహ్వే దృష్టిలో
  rationale: అక్షరార్థమైన ‘కళ్లలో’ అనే హీబ్రూ నుడికార భావాన్ని, అంటే దేవుని మూల్యాంకనాన్ని, సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరిస్తుంది.
- source_word: כְּדָוִיד אָבִיו
  choice: తన తండ్రి దావీదు చేసినట్లుగా
  rationale: హీబ్రూలోని ‘తండ్రి’ అనే వంశపరమైన పదాన్ని నిలుపుతూ, ముందున్న ‘చేయడం’ అనే క్రియను తెలుగులో స్పష్టంగా పునరుద్ధరిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాకుండా చతురక్షర దైవనామమే ఉంది; అందువల్ల వ్యక్తిగత నామాన్ని లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: దావీదును ఆహాజు ‘తండ్రి’గా పేర్కొనడం
  choice: మూలంలోని ‘తండ్రి’ పదాన్ని పాఠ్యంలో ఉంచి పాదసూచికలో వంశపరమైన భావాన్ని వివరించడం
  alternative: పూర్వికుడు దావీదు
  rationale: אָבִיו అనే మూలపదాన్ని నిలుపుతుంది; అయితే ఇది ఆహాజు తక్షణ జనకుడిని సూచించదనే చారిత్రక భావాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
- issue: దావీదుతో పోలికలో నిషేధ వాక్యపు పరిధి
  choice: ‘చేసినట్లుగా మాత్రం ... చేయలేదు’
  alternative: ‘దావీదులా ... చేయలేదు’
  rationale: ప్రత్యామ్నాయ రూపం దావీదు కూడా సరైనది చేయలేదనే అపార్థానికి దారితీయవచ్చు. ఎంచుకున్న రూపం ఆహాజు దావీదు మాదిరిగా ప్రవర్తించలేదనే హీబ్రూ భావాన్ని సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్య నిర్మాణం, అయితే రాజవృత్తాంతానికి తగిన గౌరవప్రదమైన శైలి. దైవనామం ‘యాహ్వే’గా లిప్యంతరీకరించబడింది.
