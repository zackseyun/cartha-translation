source:
  edition: WLC
  text: וַֽ/יִּתְּנֵ֜/הוּ יְהוָ֣ה אֱלֹהָי/ו֮ בְּ/יַ֣ד מֶ֣לֶךְ אֲרָם֒ וַ/יַּ֨כּוּ ב֔/וֹ וַ/יִּשְׁבּ֤וּ מִמֶּ֨/נּוּ֙ שִׁבְיָ֣ה גְדוֹלָ֔ה וַ/יָּבִ֖יאוּ דַּרְמָ֑שֶׂק וְ֠/גַם בְּ/יַד מֶ֤לֶךְ יִשְׂרָאֵל֙ נִתָּ֔ן וַ/יַּךְ בּ֖/וֹ מַכָּ֥ה גְדוֹלָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/005.yaml
  text: Therefore Yahweh his God gave him into the hand of the king of Aram[a], and they struck him and took from him a great number of captives and brought them to Damascus. He was also given into the hand of the king of Israel[c][b], who struck him with a great blow.
translation:
  language: te
  text: 'కాబట్టి అతని దేవుడైన యాహ్వే అతన్ని అరాము[a] రాజు చేతికి అప్పగించాడు. వారు అతనిని కొట్టి, అతని దగ్గరనుండి ఎంతోమంది బందీలను పట్టుకొని దమస్కుకు తీసుకెళ్లారు.[b] అతను ఇశ్రాయేలు రాజు చేతికి కూడా అప్పగించబడ్డాడు; ఆ రాజు అతనికి గొప్ప దెబ్బ తీశాడు.[c]


    [a] అరామును “సిరియా” అని కూడా పిలుస్తారు. హీబ్రూ మూలంలో “అరాము” అని ఉంది.


    [b] అక్షరార్థంగా, “అతని దగ్గరనుంచి గొప్ప బందీ సమూహాన్ని పట్టుకున్నారు.”


    [c] లేదా, “అతనికి ఘోరమైన ఓటమి కలిగించాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అరామును “సిరియా” అని కూడా పిలుస్తారు. హీబ్రూ మూలంలో “అరాము” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అతని దగ్గరనుంచి గొప్ప బందీ సమూహాన్ని పట్టుకున్నారు.”
    reason: lexical_ambiguity
  - marker: c
    text: లేదా, “అతనికి ఘోరమైన ఓటమి కలిగించాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ ... בְּיַד
  choice: అతన్ని ... చేతికి అప్పగించాడు
  rationale: נתן + בְּיַד అనే హీబ్రూ నుడికారం మరొకరి అధికారానికి అప్పగించడాన్ని సూచిస్తుంది. తెలుగు సహజత్వాన్ని కాపాడుతూ ‘చేతికి’ అనే మూలభాష చిత్రాన్ని నిలిపింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా లిప్యంతరీకరించింది.
- source_word: אֱלֹהָיו
  choice: అతని దేవుడు
  rationale: తీర్పు సందర్భంలోనూ హీబ్రూలోని స్వామ్య సంబంధాన్ని యథాతథంగా ఉంచింది.
- source_word: מֶלֶךְ אֲרָם
  choice: అరాము రాజు
  rationale: తరువాతి భౌగోళిక పేరైన ‘సిరియా’కు బదులు హీబ్రూ స్వనామమైన ‘అరాము’ను ప్రధాన పాఠ్యంలో ఉంచింది.
- source_word: וַיַּכּוּ בוֹ
  choice: అరామీయులు అతనిపై దాడి చేసి
  rationale: బహువచన క్రియకు సహజమైన కర్తను సందర్భం నుంచి స్పష్టం చేసింది; యుద్ధ సందర్భంలో נכה యొక్క విస్తృత భావాన్ని సహజ తెలుగులో తెలిపింది.
- source_word: וַיִּשְׁבּוּ מִמֶּנּוּ שִׁבְיָה גְדוֹלָה
  choice: అతని ప్రజల్లో అనేకమందిని బందీలుగా పట్టుకొని
  rationale: שִׁבְיָה concrete captives లేదా captivity అనే భావాలను కలిగి ఉంటుంది. సందర్భానుసారంగా ప్రజలను సూచిస్తూ, మూలంలోని సామూహిక భావాన్ని పాదటిప్పణిలో నిలిపింది.
- source_word: וַיָּבִיאוּ דַּרְמָשֶׂק
  choice: దమస్కుకు తీసుకెళ్లారు
  rationale: మునుపటి పదబంధంలోని బందీలే అంతర్భావిత కర్మ; తెలుగులో క్రియ సహజంగా ఆ సంబంధాన్ని కొనసాగిస్తుంది.
- source_word: נִתָּן
  choice: అప్పగించబడ్డాడు
  rationale: ముందటి נתן క్రియతో ఉన్న ప్రతిధ్వనిని, దైవ తీర్పు వల్ల జరిగిన అప్పగింపును నిలిపింది.
- source_word: וַיַּךְ בּוֹ מַכָּה גְדוֹלָה
  choice: అతన్ని ఘోరంగా దెబ్బతీశాడు
  rationale: ‘గొప్ప దెబ్బ’ అనే హీబ్రూ రూపకాన్ని సహజ తెలుగులో ఉంచింది; సైనిక ఓటమి అనే సందర్భార్థాన్ని పాదటిప్పణిలో ఇచ్చింది.
theological_decisions:
- issue: యూదా ఓటమిలో దైవ కార్యసాధకత్వం
  choice: యాహ్వే అహాజును విదేశీ రాజుల చేతికి అప్పగించాడని పాఠ్యం ప్రత్యక్షంగా చెబుతుంది.
  alternative: ఓటమిని కేవలం రాజకీయ లేదా సైనిక పరిణామంగా ముందుకు తేవడం.
  rationale: హీబ్రూ పాఠ్యం נתן క్రియను క్రియాశీల, కర్మణి రూపాల్లో రెండుసార్లు ఉపయోగించి ఈ పరాజయాలను దైవ తీర్పుగా చట్రబద్ధం చేస్తుంది; అనువాదం ఆ కారణత్వాన్ని తగ్గించదు.
- issue: దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు లేదా యెహోవా
  rationale: మూలంలో יְהוָה అనే వ్యక్తినామం ఉంది. దానిని బిరుదుగా మార్చకుండా ఆధునిక తెలుగు లిపిలో ధ్వన్యనుసారంగా ఇచ్చింది.
- issue: ఏకవచన రాజు మరియు సమూహ రాజ్యం మధ్య సూచన
  choice: అహాజును సూచించే ఏకవచన సర్వనామాన్ని ఉంచి, బహువచన క్రియకు ‘అరామీయులు’ అని స్పష్టం చేసింది.
  alternative: ప్రతి ఏకవచన సూచనను ‘యూదా’ లేదా ‘అతని సైన్యం’గా మార్చడం.
  rationale: మూలంలోని రాజు-రాజ్యం ప్రాతినిధ్య ఉద్వేగాన్ని పూర్తిగా పరిష్కరించకుండా, తెలుగులో వాక్య కర్తను మాత్రం స్పష్టంచేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన చారిత్రక వచనశైలి ఉపయోగించబడింది. ‘చేతికి అప్పగించాడు’ వంటి పరిచిత నుడికారంతో హీబ్రూ చిత్రాన్ని నిలిపి, అసహజమైన అక్షరానువాదాన్ని నివారించింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
