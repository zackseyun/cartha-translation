    rationale: וַיַּכּוּ בוֹ అక్షరంగా ‘వారు అతనిని కొట్టారు/దెబ్బతీశారు.’ ‘దాడి చేశారు’ సాధ్యమైన సందర్భార్థమే అయినా, మూలంలోని ఉద్దేశపూర్వకంగా విస్తృతమైన క్రియను మరింత నిర్దిష్టమైన సైనిక చర్యగా చేస్తుంది.
