source:
  edition: WLC
  text: וְ֠/שָׁם הָיָ֨ה נָבִ֥יא לַֽ/יהוָה֮ עֹדֵ֣ד שְׁמ/וֹ֒ וַ/יֵּצֵ֗א לִ/פְנֵ֤י הַ/צָּבָא֙ הַ/בָּ֣א לְ/שֹׁמְר֔וֹן וַ/יֹּ֣אמֶר לָ/הֶ֗ם הִ֠נֵּה בַּ/חֲמַ֨ת יְהוָ֧ה אֱלֹהֵֽי אֲבוֹתֵי/כֶ֛ם עַל יְהוּדָ֖ה נְתָנָ֣/ם בְּ/יֶדְ/כֶ֑ם וַ/תַּֽהַרְגוּ בָ֣/ם בְ/זַ֔עַף עַ֥ד לַ/שָּׁמַ֖יִם הִגִּֽיעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/009.yaml
  text: There was a prophet of the LORD there, whose name was Oded; and he went out before the army that came to Samaria and said to them, “Look, because the LORD, the God of your fathers, was angry with Judah, he gave them into your hand, but you have killed them in a rage that has reached up to heaven.”
translation:
  language: te
  text: 'అక్కడ యెహోవా ప్రవక్త ఒకడు ఉన్నాడు; అతని పేరు ఓదేదు. అతడు సమరయకు వస్తున్న సైన్యాన్ని ఎదుర్కొని వెళ్లి వారితో ఇలా అన్నాడు: “చూడండి! మీ పూర్వికుల దేవుడైన యెహోవా యూదా ప్రజలపై కోపగించినందువల్ల వారిని మీ చేతికి అప్పగించాడు. అయితే మీరు ఆకాశాన్ని అంటేటంత ఉగ్రకోపంతో వారిని చంపారు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָבִיא לַיהוָה
  choice: యెహోవా ప్రవక్త
  rationale: దైవనామాన్ని స్పష్టంగా ఉంచుతూ, ‘యెహోవాకు చెందిన/యెహోవా తరఫున మాట్లాడే ప్రవక్త’ అనే సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הִנֵּה
  choice: చూడండి!
  rationale: శ్రోతల దృష్టిని బలంగా ఆకర్షించే హీబ్రూ ఉద్ఘాటనను ఆధునిక సహజ తెలుగులో నిలుపుతుంది.
- source_word: נְתָנָם בְּיֶדְכֶם
  choice: వారిని మీ చేతికి అప్పగించాడు
  rationale: ‘చేతిలో ఇవ్వడం’ అనే హీబ్రూ విజయసూచక నుడికారాన్ని తెలుగులో సుపరిచితమైన బైబిలీయ రూపంలో ఉంచుతుంది.
- source_word: בְזַעַף
  choice: ఉగ్రకోపంతో
  rationale: తీవ్రమైన ఆగ్రహం లేదా ఉగ్రతను సూచించే పదబలాన్ని వ్యక్తపరుస్తుంది.
- source_word: עַד לַשָּׁמַיִם הִגִּיעַ
  choice: ఆకాశాన్ని అంటేటంత
  rationale: వారి ఉగ్రకోపం పరలోకం వరకు చేరిందనే అతిశయోక్తి చిత్రాన్ని సహజమైన తెలుగు రూపంలో కాపాడుతుంది.
theological_decisions:
- issue: యూదా ఓటమిలో దేవుని క్రియాశీల పాత్ర
  choice: వారిని మీ చేతికి అప్పగించాడు
  alternative: వారు మీ చేతిలో పడేలా చేశాడు
  rationale: నְתָנָם అనే క్రియ దేవుడే వారిని అప్పగించాడని నేరుగా చెబుతుంది; ఈ దైవిక క్రియాశీలతను సున్నితపరచలేదు.
- issue: దేవుని తీర్పు మరియు ఇశ్రాయేలు సైన్యపు దోషం మధ్య ఉద్రిక్తత
  choice: అయితే మీరు ... వారిని చంపారు
  alternative: మరియు మీరు ... వారిని చంపారు
  rationale: హీబ్రూలో וַ వరుస సంబంధాన్ని మాత్రమే చూపినా, సందర్భంలో దేవుడు అప్పగించడం వారి హద్దుమీరిన హత్యను సమర్థించదనే వ్యత్యాసం స్పష్టంగా ఉంది. ‘అయితే’ ఆ నైతిక ఉద్రిక్తతను తెలుగులో సహజంగా తెలియజేస్తుంది.
- issue: ‘ఆకాశానికి చేరినది’ దేనిని సూచిస్తుంది
  choice: ఉగ్రకోపంతో ... ఆకాశాన్ని అంటేటంత
  alternative: మీ హత్యాకాండ ఆకాశం వరకు చేరింది
  rationale: హీబ్రూ వాక్యనిర్మాణంలో ఏకవచన క్రియకు సమీపమైన ‘ఉగ్రకోపం’ భావకర్తగా గ్రహించడం సముచితం; హత్యల ఘోరతను సూచించే విస్తృత భావం కూడా సందర్భంలో నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. ‘యెహోవా’ అనే దైవనామం మూలంలోని יהוהను ప్రత్యక్షంగా ప్రతిబింబిస్తుంది. ‘సమరయకు వస్తున్న సైన్యం’ అన్నది సైన్యం సమరయ వైపు వస్తున్న దిశను స్పష్టంగా, సహజంగా తెలుపుతుంది.
