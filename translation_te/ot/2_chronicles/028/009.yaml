  source_fidelity: 'హీబ్రూ వాక్యంలోని ప్రధాన అంశాలు నమ్మకంగా ప్రతిబింబించబడ్డాయి: అక్కడ యెహోవా ప్రవక్త ఓదేదు ఉండడం, సమరయకు వచ్చిన సైన్యాన్ని అతడు ఎదుర్కొనడం, యెహోవా యూదాను వారి చేతికి అప్పగించడం, అలాగే వారి ఉగ్రకోపం ఆకాశం వరకు చేరడం. בְזַעַף యొక్క భావం ‘ఉగ్రకోపంతో’ ద్వారా, עַד לַשָּׁמַיִם הִגִּיעַ యొక్క అతిశయోక్తి ‘ఆకాశాన్ని అంటేటంత’ ద్వారా సహజంగా నిలిచింది.'
