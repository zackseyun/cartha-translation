  text: וְ/יֶ֤תֶר דְּבָרָי/ו֙ וְ/כָל דְּרָכָ֔י/ו הָ/רִאשֹׁנִ֖ים וְ/הָ/אַחֲרוֹנִ֑ים הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֥פֶר מַלְכֵֽי יְהוּדָ֖ה וְ/יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/026.yaml
  text: The rest of his acts and all his ways, the first and the last, behold, they are written in the Book of the Kings of Judah and Israel.
translation:
  language: te
  text: అతని మిగిలిన కార్యాలు, అతని నడతలన్నీ—మొదటివీ చివరివీ—ఇదిగో, యూదా, ఇశ్రాయేలు రాజుల గ్రంథంలో రాసి ఉన్నాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֶתֶר דְּבָרָיו
  choice: అతని మిగిలిన కార్యాలు
  rationale: రాజుల పాలనను సంగ్రహించే సందర్భంలో דְּבָרִים అనేది మాటలను కాకుండా రాజుకు సంబంధించిన కార్యాలను, వ్యవహారాలను సూచిస్తుంది. ‘మిగిలిన కార్యాలు’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: וְכָל דְּרָכָיו
  choice: అతని నడవడి అంతా
  rationale: דֶּרֶךְ అనే ‘మార్గం’ రూపకాన్ని నేరుగా ‘మార్గాలు’ అని అనడం కంటే, ఇక్కడ రాజు ప్రవర్తన లేదా జీవిత విధానాన్ని సూచించే ‘నడవడి’ సందర్భానికి స్పష్టంగా, సహజంగా సరిపోతుంది.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרוֹנִים
  choice: మొదటివి, చివరివి
  rationale: హీబ్రూ పదజోడు యొక్క కాలక్రమ విస్తృతిని, దాని సంక్షిప్త రూపాన్ని అలాగే ఉంచుతుంది; ‘మొదటి నుండి చివరి వరకు’ అని వివరణాత్మకంగా మార్చలేదు.
- source_word: הִנָּם
  choice: ఇదిగో
  rationale: హీబ్రూలోని సూచనాత్మక ఉద్ఘాటనను నిలుపుతుంది. ఇది కొంత గంభీరమైనదైనా గ్రంథసూచన సూత్రంలో సహజంగా ఉంటుంది.
- source_word: כְּתוּבִים עַל סֵפֶר
  choice: గ్రంథంలో రాసి ఉన్నాయి
  rationale: עַל‌ను తెలుగు గ్రంథసూచన వాడుకకు అనుగుణంగా ‘లో’ అని ఇచ్చి, כְּתוּבִים యొక్క లిఖితార్థాన్ని ‘రాసి ఉన్నాయి’గా సహజంగా వ్యక్తం చేసింది.
- source_word: מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: యూదా, ఇశ్రాయేలు రాజుల
  rationale: మూలంలోని రెండు రాజ్యాల పేర్లను, రాజుల గ్రంథానికి సంబంధించిన షష్ఠీ నిర్మాణాన్ని నిలుపుతుంది.
