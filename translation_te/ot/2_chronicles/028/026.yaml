  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ చారిత్రక గ్రంథసూచనకు తగిన గౌరవప్రదమైన శైలి. ‘ఇదిగో’ ద్వారా మూలంలోని ఉద్ఘాటనను నిలిపి, ‘నడవడి’ ద్వారా రూపకార్థాన్ని సాధారణ పాఠకుడికి స్పష్టంగా తెలిపింది.
