id: 2CH.28.10
reference: 2 Chronicles 28:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֠/עַתָּה בְּנֵֽי יְהוּדָ֤ה וִֽ/ירוּשָׁלִַ֨ם֙ אַתֶּ֣ם אֹמְרִ֔ים לִ/כְבֹּ֛שׁ לַ/עֲבָדִ֥ים וְ/לִ/שְׁפָח֖וֹת לָ/כֶ֑ם הֲ/לֹ֤א רַק אַתֶּם֙ עִמָּ/כֶ֣ם אֲשָׁמ֔וֹת לַ/יהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/010.yaml
  text: And now[a], you are saying that you will subdue the people of Judah and Jerusalem as male and female servants for yourselves[c][b]. But do not you yourselves also have guilt before Yahweh your God?
translation:
  language: te
  text: ఇప్పుడు మీరు యూదా, యెరూషలేము ప్రజలను[a] మీకు దాసులుగానూ దాసీలుగానూ లోబరచుకుంటామని చెబుతున్నారు. అయితే మీ దేవుడైన యాహ్వే ఎదుట మీకూ అపరాధాలు లేవా?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యూదా, యెరూషలేము కుమారులను.” హెబ్రీలోని పుంలింగ బహువచన ప్రయోగం ఇక్కడ ఆ ప్రజలను సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: చివరి ప్రశ్న హెబ్రీలో చాలా సంక్షిప్తంగా ఉంది; అక్షరార్థానికి దగ్గరగా, “మీ దేవుడైన యాహ్వేకు సంబంధించి మీతో అపరాధాలు లేవా?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: ముందటి మాటకు అనుసంధానంగా ప్రస్తుత గద్దింపును ప్రవేశపెట్టే సంభాషణ సూచకం; తెలుగులో ‘ఇప్పుడు’ సహజంగా ఆ పని చేస్తుంది.
- source_word: בְּנֵי יְהוּדָה וִירוּשָׁלַם
  choice: యూదా, యెరూషలేము ప్రజలను
  rationale: అక్షరార్థంగా ‘యూదా, యెరూషలేము కుమారులను’ అయినా, ఇక్కడ ఆ ప్రాంతాల ప్రజలను సమష్టిగా సూచిస్తుంది; ‘ప్రజలను’ ఆధునిక తెలుగులో అర్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: אַתֶּם אֹמְרִים
  choice: మీరు … అనుకుంటున్నారు
  rationale: సర్వనామంతో కూడిన కృదంత రూపం ప్రస్తుత సంకల్పాన్ని లేదా ఉద్దేశాన్ని తెలియజేస్తుంది; సందర్భంలో కేవలం పలుకును కాక ఉద్దేశాన్ని సూచించడం సహజం.
- source_word: לִכְבֹּשׁ
  choice: లోబరచుకోవాలని
  rationale: כָּבַשׁ బలవంతంగా అధీనంలోకి తెచ్చుకోవడం లేదా లోబరచడం అనే భావాన్ని ఇస్తుంది; దాసత్వ సందర్భంలోని బలవంతపు స్వభావాన్ని ఈ ఎంపిక నిలుపుతుంది.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: దాసులుగానూ దాసీలుగానూ
  rationale: యుద్ధబందీలను బలవంతపు దాసత్వంలో పెట్టడం సందర్భం; పురుష, స్త్రీ వర్గాలను హెబ్రీ పాఠం విడిగా పేర్కొనడాన్ని నిలుపుతుంది.
- source_word: לָכֶם
  choice: మీకు
  rationale: లాభం లేదా స్వాధీనతను సూచించే దత్తి విభక్తిని తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הֲלֹא רַק אַתֶּם עִמָּכֶם אֲשָׁמוֹת
  choice: అయితే … మీకూ అపరాధాలు లేవా?
  rationale: హెబ్రీ వాక్యం సంక్షిప్తమైన అలంకార ప్రశ్న. ఎదుటివారి సొంత దోషాన్ని నొక్కిచెప్పే భావాన్ని ‘మీకూ … లేవా?’ సహజంగా నిలుపుతుంది; రַק యొక్క ఉద్ఘాటనను ప్రశ్న నిర్మాణం మోస్తుంది.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: మీ దేవుడైన యెహోవా ఎదుట
  rationale: దేవుని దృష్టిలో లేదా ఆయనకు సంబంధించిన అపరాధ బాధ్యతను ‘ఎదుట’ వ్యక్తం చేస్తుంది; יְהוָה అనే వ్యక్తిగత దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించింది.
theological_decisions:
- issue: יְהוָה దైవనామ అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో నిలుపుతుంది.
- issue: עֲבָדִים / שְׁפָחוֹת స్థితి సూచన
  choice: దాసులు, దాసీలు
  alternative: సేవకులు, సేవికలు
  rationale: యుద్ధవిజయం తరువాత బలవంతంగా అధీనపరచే సందర్భం కావున సాధారణ సేవకత్వం కంటే దాసత్వ భావమే ప్రధానమైనది.
- issue: చివరి అలంకార ప్రశ్నలో అపరాధం
  choice: మీ దేవుడైన యెహోవా ఎదుట మీకూ అపరాధాలు లేవా?
  alternative: మీ దేవుడైన యెహోవాకు విరోధంగా అపరాధాలు మీతో లేవా?
  rationale: మూలంలోని బహువచన אֲשָׁמוֹתను ‘అపరాధాలు’గా నిలుపుతూ, దేవుని ఎదుట వారి బాధ్యతను తెలియజేస్తుంది; వాక్యంలోని సంక్షిప్తతను సిద్ధాంతపరంగా విప్పి చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. బలవంతపు దాసత్వాన్ని స్పష్టంగా చూపించడానికి ‘దాసులు, దాసీలు’ వాడబడింది. ప్రధాన పాఠంలోని ప్రతి పాదసూచిక గుర్తు సంబంధిత స్థానంలో ఉంచబడింది.
