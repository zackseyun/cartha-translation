id: 2CH.28.12
reference: 2 Chronicles 28:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּקֻ֨מוּ אֲנָשִׁ֜ים מֵ/רָאשֵׁ֣י בְנֵֽי אֶפְרַ֗יִם עֲזַרְיָ֤הוּ בֶן יְהֽוֹחָנָן֙ בֶּרֶכְיָ֣הוּ בֶן מְשִׁלֵּמ֔וֹת וִֽ/יחִזְקִיָּ֨הוּ֙ בֶּן שַׁלֻּ֔ם וַ/עֲמָשָׂ֖א בֶּן חַדְלָ֑י עַל הַ/בָּאִ֖ים מִן הַ/צָּבָֽא־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/012.yaml
  text: 'Then some men from the heads of the sons of Ephraim stood up against those coming from the army: Azariah son of Jehohanan[a], Berechiah son of Meshillemoth, Hezekiah son of Shallum, and Amasa son of Hadlai.'
translation:
  language: te
  text: 'అప్పుడు ఎఫ్రాయిమీయుల నాయకుల్లో[a] కొందరు సైన్యం నుండి వస్తున్నవారిని ఎదిరించి నిలబడ్డారు: యెహోహానాను కుమారుడు అజర్యా, మెషిల్లేమోతు కుమారుడు బెరెక్యా, షల్లూము కుమారుడు యెహిజ్కియా, హద్లయి కుమారుడు అమాశా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎఫ్రాయిమీయుల ప్రధానుల్లో.” హెబ్రీలో అక్షరార్థంగా, “ఎఫ్రాయిము కుమారుల తలల నుండి” అని ఉంది.
    reason: ‘నాయకులు’ అనే సహజ తెలుగు పదానికి ప్రత్యామ్నాయంగా, హెబ్రీలోని రָאשֵׁי (‘తలలు/ప్రధానులు’) అనే నాయకత్వ పదాన్ని పారదర్శకంగా తెలియజేయడం.
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: లేచి నిలబడ్డారు
  rationale: קום అనే క్రియ ఇక్కడ కథనంలో నిర్ణయాత్మక చర్యను, ఎదుర్కొనే ఉద్దేశాన్ని సూచిస్తుంది. ‘లేచి నిలబడ్డారు’ దాని భౌతిక భావాన్నీ సందర్భంలోని ప్రతిఘటన భావాన్నీ సహజంగా నిలుపుతుంది.
- source_word: אֲנָשִׁים מֵרָאשֵׁי בְנֵי אֶפְרַיִם
  choice: ఎఫ్రాయిమీయుల నాయకుల్లో కొందరు
  rationale: అక్షరార్థంగా ‘ఎఫ్రాయిము కుమారుల ప్రధానుల్లో కొందరు.’ ఆధునిక తెలుగులో జాతి/గోత్ర సమూహాన్ని సహజంగా సూచించేందుకు ‘ఎఫ్రాయిమీయులు,’ గుర్తింపు పొందిన ముఖ్యులను సూచించేందుకు ‘నాయకులు’ వాడాం.
- source_word: עַל
  choice: ఎదుర్కొనేందుకు
  rationale: קום తో కలిసి עַל ఇక్కడ సైన్యం నుంచి వస్తున్నవారిని అడ్డుకొని ప్రతిఘటించడాన్ని సూచిస్తుంది. ‘ఎదుర్కొనేందుకు’ సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది; శత్రుత్వాన్ని అవసరానికి మించి తీవ్రం చేయదు.
- source_word: הַבָּאִים מִן הַצָּבָא
  choice: సైన్యం నుంచి తిరిగి వస్తున్నవారు
  rationale: ‘సైన్యం నుంచి వస్తున్నవారు’ అనేది మూలానికి సమీపం; కథా సందర్భంలో వారు యుద్ధయాత్ర నుంచి తిరిగి వస్తున్నందున ‘తిరిగి’ తెలుగులో గమనదిశను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: עֲזַרְיָהוּ ... בֶּרֶכְיָהוּ ... יְחִזְקִיָּהוּ ... עֲמָשָׂא
  choice: అజర్యా ... బెరెక్యా ... యెహిజ్కియా ... అమాశా
  rationale: వ్యక్తి పేర్లను హెబ్రీ రూపాలకు అనుగుణంగా తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: בֶן
  choice: కుమారుడు
  rationale: వంశనామ సంబంధాన్ని తెలిపే ప్రామాణిక తెలుగు రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన కథన శైలి. పేర్లతో పొడవైన జాబితా ప్రధాన చర్యను విభజించకుండా ఉండేందుకు తెలుగు వాక్యక్రమాన్ని సహజంగా మార్చాం; ఆ మార్పును పాదసూచికలో తెలిపాం.
