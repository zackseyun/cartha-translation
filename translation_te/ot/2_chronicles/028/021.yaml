revisions:
- from: ఎందుకంటే, అహాజు యాహ్వే మందిరంలో, రాజభవనంలో, అధిపతుల దగ్గర ఉన్న సంపదను దోచుకొని[a], అష్షూరు రాజుకు ఇచ్చాడు. అయినా అది అతనికి సహాయం చేయలేదు.[b]
  to: ఎందుకంటే అహాజు యాహ్వే మందిరంలోని, రాజభవనంలోని, అధిపతుల వద్దనున్న సంపదను తీసుకొని[a] అష్షూరు రాజుకు ఇచ్చాడు; కానీ అది అతనికి సహాయం చేయలేదు.[b]
