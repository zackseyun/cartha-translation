source:
  edition: WLC
  text: כִּֽי חָלַ֤ק אָחָז֙ אֶת בֵּ֣ית יְהוָ֔ה וְ/אֶת בֵּ֥ית הַ/מֶּ֖לֶךְ וְ/הַ/שָּׂרִ֑ים וַ/יִּתֵּן֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר וְ/לֹ֥א לְ/עֶזְרָ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/021.yaml
  text: For Ahaz plundered the house of Yahweh[a], and the house of the king and the princes, and gave it to the king of Assyria[c][b], but it did not help him.
translation:
  language: te
  text: ఎందుకంటే అహాజు యాహ్వే మందిరంలోని, రాజభవనంలోని, అధిపతుల వద్దనున్న సంపదను తీసుకొని[a] అష్షూరు రాజుకు ఇచ్చాడు; కానీ అది అతనికి సహాయం చేయలేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తీసుకొని’ అని అనువదించిన హీబ్రూ పదానికి ‘విభజించి’ లేదా ‘వాటాలుగా పంచి’ అనే అర్థాలు కూడా రావచ్చు. ఇక్కడ యాహ్వే మందిరం, రాజభవనం, అధిపతుల వద్దనున్న విలువైన వస్తువులను తీసుకొని అష్షూరు రాజుకు ఇచ్చిన భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: చివరి మాటలను ‘కానీ అతనికి సహాయం లభించలేదు’ అని కూడా అనువదించవచ్చు.
    reason: translation_ambiguity
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలో చెప్పిన విషయానికి కారణాన్ని లేదా వివరణను పరిచయం చేసే హీబ్రూ ప్రయోగాన్ని నిలుపుతుంది.
- source_word: חָלַק
  choice: సంపదను దోచుకొని
  rationale: మూల క్రియకు ‘విభజించు/వాటా తీసుకో’ అనే ప్రాథమిక భావం ఉన్నా, ఈ సందర్భంలో మందిరం, రాజభవనం, అధిపతుల వద్ద నుంచి విలువైనవాటిని తీసి అష్షూరు రాజుకు ఇవ్వడం ఉద్దేశం. ‘దోచుకొని’ సందర్భబలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే మందిరంలో
  rationale: ‘యాహ్వే ఇల్లు’ అనే మూలరూపానికి సందర్భానుగుణమైన సహజ తెలుగు ‘యాహ్వే మందిరం’. సంపద అక్కడి నుంచి తీసుకున్నదని తెలుగులో స్పష్టంగా వ్యక్తం చేయడానికి స్థానవిభక్తి వాడాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: మూలంలోని దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ప్రతిలిపి చేస్తుంది.
- source_word: בֵּית הַמֶּלֶךְ
  choice: రాజభవనంలో
  rationale: అక్షరార్థంగా ‘రాజు ఇల్లు’; చారిత్రక రాజసందర్భంలో ‘రాజభవనం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הַשָּׂרִים
  choice: అధిపతులు
  rationale: రాజ్యంలోని ప్రముఖులు, అధికారులు లేదా నాయకులను సూచించే విస్తృత పదం. ‘అధికారులు’ కూడా సాధ్యమని పాదసూచికలో తెలిపాం.
- source_word: וַיִּתֵּן
  choice: ఇచ్చాడు
  rationale: సరళమైన గతకాల కథనక్రియగా అనువదించాం.
- source_word: לְמֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజుకు
  rationale: హీబ్రూ పరోక్ష కర్మను, దేశనామాన్ని నేరుగా ప్రతిబింబించే సహజ తెలుగు రూపం.
- source_word: וְלֹא לְעֶזְרָה לוֹ
  choice: అయినా అది అతనికి సహాయం చేయలేదు
  rationale: ఇచ్చిన సంపద లేదా ఆ చర్య అహాజుకు ఆశించిన సహాయాన్ని అందించలేదనే ఫలితాన్ని సహజంగా తెలియజేస్తుంది; ‘అది’ సమష్టిగా ఇచ్చిన సంపద/కానుకను సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: వచనంలో బిరుదు కాకుండా చతురక్షర దైవనామమే ఉంది; అందువల్ల దాని వ్యక్తిగత నామరూపాన్ని నిలుపుకున్నాం.
- issue: అష్షూరు రాజుకు ఇచ్చినది సహాయం చేసిందా అనే చివరి వాక్యభాగం
  choice: అది అతనికి సహాయం చేయలేదు
  alternative: అష్షూరు రాజు అతనికి సహాయం చేయలేదు
  rationale: హీబ్రూ వ్యాకరణం సహాయం లభించలేదని చెబుతుంది గాని, కర్తను స్పష్టంగా పేర్కొనదు. అందువల్ల అష్షూరు రాజునే కర్తగా చేర్చి భావాన్ని నిర్ణయించకుండా మూలంలోని కొంత అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడాం. ‘యాహ్వే ఇల్లు’ అనే అక్షరానువాదం కంటే సాధారణ పాఠకులకు స్పష్టమైన ‘యాహ్వే మందిరం’ను ఎంచుకున్నాం. మూడు మూలాల నుంచి తీసుకున్నది సంపదేనని సందర్భం సూచిస్తున్నందున తెలుగులో దాన్ని స్పష్టీకరించాం; అయితే חָלַק లోని పదార్థ వైవిధ్యాన్ని పాదసూచికలో నిలిపాం.
