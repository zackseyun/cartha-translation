source:
  edition: WLC
  text: וַ/יַּעֲזֹ֣ב הֶֽ/חָל֗וּץ אֶת הַ/שִּׁבְיָה֙ וְ/אֶת הַ/בִּזָּ֔ה לִ/פְנֵ֥י הַ/שָּׂרִ֖ים וְ/כָל הַ/קָּהָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/014.yaml
  text: So the armed men left the captives and the plunder before the officials and all the assembly[a][b].
translation:
  language: te
  text: అప్పుడు ఆయుధాలు ధరించినవారు బందీలను, దోపుడు సొమ్మును అధికారుల, సమస్త సమాజం ఎదుట విడిచిపెట్టారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: విడిచిపెట్టారు
  rationale: עזב ఇక్కడ బందీలపై, దోపుడు సొమ్ముపై తమ అధీనాన్ని వదులుకోవడాన్ని సూచిస్తుంది. సందర్భానికి సహజంగా ఉండే ‘విడిచిపెట్టారు’ అనే పదం, పూర్తిగా పరిత్యజించారనే అనవసర భావాన్ని కలిగించదు.
- source_word: הֶחָלוּץ
  choice: ఆయుధాలు ధరించినవారు
  rationale: ఈ పదం యుద్ధానికి సన్నద్ధమై ఆయుధాలు ధరించినవారిని సూచిస్తుంది. ‘ఆయుధాలు ధరించినవారు’ మూలంలోని విశేషణాత్మక నామవాచక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הַשִּׁבְיָה
  choice: బందీలను
  rationale: ఈ సందర్భంలో నామవాచకం ‘చెర’ అనే అమూర్త భావం కాకుండా యుద్ధంలో చెరపట్టబడిన వ్యక్తులను సూచిస్తుంది.
- source_word: הַבִּזָּה
  choice: దోపుడు సొమ్మును
  rationale: యుద్ధంలో స్వాధీనం చేసుకున్న వస్తువులను సూచించే పదం. ఆధునిక తెలుగులో ‘దోపుడు సొమ్ము’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: ఈ విభక్త్యర్థం వారి సమక్షంలో లేదా వారి ముందర ఉంచడాన్ని సూచిస్తుంది. ‘ఎదుట’ స్థలార్థాన్నీ బహిరంగ సమక్ష భావాన్నీ నిలుపుతుంది.
- source_word: הַשָּׂרִים
  choice: అధికారులు
  rationale: שׂרים సందర్భానుసారం అధిపతులు, నాయకులు లేదా అధికారులు కావచ్చు. ఇక్కడ చర్యను పర్యవేక్షించే గుర్తింపు పొందిన పాలనా వ్యక్తులకు ‘అధికారులు’ తటస్థమైన సరైన పదం.
- source_word: כָל הַקָּהָל
  choice: సమాజమంతటి
  rationale: קהל కూడివచ్చిన సమాజాన్ని సూచిస్తుంది. ‘సమాజమంతటి’ మొత్తం సమూహాన్ని తెలియజేస్తూ, అనవసరంగా కేవలం ఆరాధనా సమావేశానికే పరిమితం చేయదు.
