translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ ఏకవచన సమూహనామమైన הֶחָלוּץ ను తెలుగులో సహజమైన బహువచన కర్తగా ఇచ్చి, క్రియను బహువచనంలో సరిపోల్చాం.
