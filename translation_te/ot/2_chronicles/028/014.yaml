revisions:
- from: అప్పుడు ఆయుధాలు ధరించినవారు బందీలను, దోపుడు సొమ్మును అధికారుల ఎదుట, సమాజమంతటి ఎదుట విడిచిపెట్టారు.
  to: అప్పుడు ఆయుధాలు ధరించినవారు బందీలను, దోపుడు సొమ్మును అధికారుల, సమస్త సమాజం ఎదుట విడిచిపెట్టారు.
  rationale: 'The revision makes only a syntactic and stylistic correction: it uses one shared ‘ఎదుట’ phrase for ‘the officials and all the assembly,’ as in the Hebrew, and replaces the less natural ‘సమాజమంతటి’ with ‘సమస్త సమాజం.’ The meaning remains unchanged.'
