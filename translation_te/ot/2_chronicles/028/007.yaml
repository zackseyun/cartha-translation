source:
  edition: WLC
  text: וַֽ/יַּהֲרֹ֞ג זִכְרִ֣י גִּבּ֣וֹר אֶפְרַ֗יִם אֶת מַעֲשֵׂיָ֨הוּ֙ בֶּן הַ/מֶּ֔לֶךְ וְ/אֶת עַזְרִיקָ֖ם נְגִ֣יד הַ/בָּ֑יִת וְ/אֶת אֶלְקָנָ֖ה מִשְׁנֵ֥ה הַ/מֶּֽלֶךְ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/007.yaml
  text: And Zikri[a], a mighty man of Ephraim, killed Maaseiah the king’s son, Azrikam the overseer of the house, and Elkanah[c][b], second to the king.
translation:
  language: te
  text: ఎఫ్రాయిముకు చెందిన పరాక్రమశాలి[a] జిక్రీ, రాజు కుమారుడైన మయశేయాను, రాజభవన వ్యవహారాల అధికారి[b] అజ్రీకామును, రాజుకు రెండవవాడైన[c] ఎల్కానాను చంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎఫ్రాయిము యోధుడు,” లేదా “ఎఫ్రాయిమీయ వీరుడు.”
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: “ఇంటి అధికారి”; ఇక్కడ “ఇల్లు” అనేది రాజభవనాన్ని లేదా రాజగృహ వ్యవస్థను సూచించే అవకాశం ఉంది.'
    reason: lexical_alternative
  - marker: c
    text: లేదా, “రాజుకు రెండవ అధికారిగా ఉన్న.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: చంపాడు
  rationale: הרג అనే క్రియ నేరుగా చంపడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘చంపాడు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: זִכְרִי
  choice: జిక్రీ
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: גִּבּוֹר אֶפְרַיִם
  choice: ఎఫ్రాయిముకు చెందిన పరాక్రమశాలి
  rationale: גִּבּוֹרకు పరాక్రమశాలి, యోధుడు, వీరుడు అనే అర్థాలు సాధ్యం. ప్రధాన పాఠం పదంలోని విస్తృత భావాన్ని నిలుపుతుంది; ఎఫ్రాయిముతో అతని అనుబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מַעֲשֵׂיָהוּ
  choice: మయశేయా
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: בֶּן הַמֶּלֶךְ
  choice: రాజు కుమారుడైన
  rationale: నిర్దిష్ట రాజుతో ఉన్న సంబంధాన్ని తెలుగులో సహజమైన విశేషణ నిర్మాణంతో తెలిపాం; హీబ్రూ వాక్యంలోని నిర్దిష్ట కుమారుని భావాన్ని నిలిపాం.
- source_word: עַזְרִיקָם
  choice: అజ్రీకాము
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: נְגִיד הַבָּיִת
  choice: రాజభవన వ్యవహారాల అధికారి
  rationale: נְגִיד నాయకుడు లేదా అధికారి; הַבָּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా రాజసందర్భంలో రాజభవనం లేదా రాజగృహ వ్యవస్థను సూచించవచ్చు. పదవిని అతిగా నిర్దిష్టం చేయకుండా సహజంగా అనువదించాం; మూలంలోని పరిధిని పాదటిప్పణిలో ఉంచాం.
- source_word: אֶלְקָנָה
  choice: ఎల్కానా
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: מִשְׁנֵה הַמֶּלֶךְ
  choice: రాజు తరువాత రెండవ స్థానంలో ఉన్న
  rationale: מִשְׁנֶה రెండవ హోదా లేదా స్థానాన్ని సూచిస్తుంది. తరువాతి కాలానికి చెందిన నిర్దిష్ట అధికార బిరుదును చేర్చకుండా శ్రేణి భావాన్ని నిలిపాం.
