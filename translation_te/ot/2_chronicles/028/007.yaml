translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలిని అనుసరించాం. వ్యక్తి పేర్లను హీబ్రూ రూపాలకు సమీపంగా లిప్యంతరీకరించాం. రాజదర్బారు పదవుల విషయంలో మూలంలోని అర్థపరిధిని ప్రధాన పాఠం మరియు పాదటిప్పణుల ద్వారా కాపాడాం.
