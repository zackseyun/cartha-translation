source:
  edition: WLC
  text: וּ/בְ/כָל עִ֨יר וָ/עִ֤יר לִֽ/יהוּדָה֙ עָשָׂ֣ה בָמ֔וֹת לְ/קַטֵּ֖ר לֵֽ/אלֹהִ֣ים אֲחֵרִ֑ים וַ/יַּכְעֵ֕ס אֶת יְהוָ֖ה אֱלֹהֵ֥י אֲבֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/025.yaml
  text: And in every city of Judah he made high places to burn incense to other gods[a], and he provoked Yahweh, the God of his fathers.
translation:
  language: te
  text: యూదాలోని ప్రతి పట్టణంలో[a] అతడు ఇతర దేవుళ్లకు ధూపం వేయడానికి ఉన్నత స్థలాలను ఏర్పాటు చేశాడు; తన పితరుల దేవుడైన యాహ్వేను కోపగింపజేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘పట్టణం మరియు పట్టణం’ అనే పునరుక్తి ఉంది; ఇది యూదాలోని ప్రతి పట్టణాన్ని సూచించే పంపిణీ ప్రయోగం.
    reason: హెబ్రీ పునరుక్తిలోని పంపిణీ భావాన్ని స్పష్టంగా వివరించడం.
lexical_decisions:
- source_word: וּבְכָל עִיר וָעִיר לִיהוּדָה
  choice: యూదాలోని ప్రతి పట్టణంలో
  rationale: עִיר וָעִיר అనే పునరుక్తి పంపిణీ భావాన్ని, అంటే యూదా అంతటా ప్రతి పట్టణాన్ని సూచిస్తుంది. తెలుగులో సహజంగా ‘ప్రతి పట్టణంలో’ అని అనువదించాం.
- source_word: עָשָׂה בָמוֹת
  choice: ఉన్నత స్థలాలను ఏర్పాటు చేశాడు
  rationale: עָשָׂה సాధారణంగా ‘చేశాడు’ అయినా, ఆరాధనా స్థలాల సందర్భంలో ‘ఏర్పాటు చేశాడు’ సహజంగా ఉంటుంది; בָמוֹת యొక్క సాంప్రదాయిక ఆరాధనా భావాన్ని ‘ఉన్నత స్థలాలు’ నిలుపుతుంది.
- source_word: לְקַטֵּר
  choice: ధూపం వేయడానికి
  rationale: קטר పియేల్ రూపం ధూపాన్ని లేదా అర్పణను పొగగా పైకెళ్లేలా కాల్చడాన్ని సూచిస్తుంది; ఈ సందర్భంలో ‘ధూపం వేయడం’ స్పష్టమైన, సహజమైన తెలుగు.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లకు
  rationale: ‘ఇతర’ అనే మూల భావాన్ని నేరుగా నిలుపుతూ, ‘విదేశీ’ అనే అదనపు భావాన్ని చేర్చలేదు.
- source_word: וַיַּכְעֵס אֶת
  choice: కోపం పుట్టించాడు
  rationale: హిఫీల్ రూపం ఎవరినైనా కోపానికి ప్రేరేపించడం అనే కారణార్థక భావాన్ని కలిగి ఉంది; తెలుగులో ‘కోపం పుట్టించాడు’ సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: తన పితరుల దేవుడు
  rationale: ఒడంబడిక సంబంధిత ‘తండ్రులు/పితరులు’ అనే మూల పదబంధాన్ని ‘పితరులు’గా నిలిపాం; ఇది ‘పూర్వీకులు’ కంటే మూలరూపానికి దగ్గరగా ఉండి తెలుగు బైబిలు శైలిలోనూ సహజం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా అందించడం మూలభాషా సాక్ష్యాన్ని స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘ఉన్నత స్థలాలు’ అనే స్థిరమైన ఆరాధనా పదాన్ని నిలిపి, వాక్య నిర్మాణాన్ని సహజ తెలుగుకు అనుగుణంగా మార్చాం.
