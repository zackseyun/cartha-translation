base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/022.yaml
  text: In the time of his distress[a], he continued to act unfaithfully against Yahweh—he, King Ahaz.
translation:
  language: te
  text: అతడు బాధలో ఉన్న సమయంలో, యాహ్వే పట్ల మరింత నమ్మకద్రోహం చేశాడు[a]—అతడే రాజు ఆహాజు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “యాహ్వే పట్ల నమ్మకద్రోహం చేయడాన్ని మరింతగా చేశాడు”; ఇది అతడు నమ్మకద్రోహాన్ని కొనసాగించాడని లేదా దానిలో మరింత ముందుకు వెళ్లాడని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעֵת הָצֵר לוֹ
  choice: అతడు కష్టాల్లో ఉన్న సమయంలో
  rationale: ఈ పదబంధం అతడు ఒత్తిడికి, ఇబ్బందికి లోనైన కాలాన్ని సూచిస్తుంది. తెలుగు సహజత్వం కోసం భావాన్ని కాలవాచక ఉపవాక్యంగా వ్యక్తం చేశాం.
- source_word: וַיּוֹסֶף לִמְעוֹל
  choice: నమ్మకద్రోహం చేయడంలో ఇంకా ముందుకు వెళ్లాడు
  rationale: יסף + క్రియార్థక రూపం ‘మరింత చేయడం/కొనసాగించడం’ అనే భావం ఇస్తుంది; מעל విశ్వాసబంధాన్ని ఉల్లంఘించే నమ్మకద్రోహాన్ని సూచిస్తుంది. ఈ అనువాదం హెబ్రీయ భావతీవ్రతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בַּיהוָה
  choice: యెహోవాకు
  rationale: מעל తో వచ్చిన ב־, నమ్మకద్రోహం ఎవరిపట్ల జరిగిందో సూచిస్తుంది. దైవనామాన్ని తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: הוּא הַמֶּלֶךְ אָחָז
  choice: అతడే రాజైన ఆహాజు
  rationale: స్వతంత్ర సర్వనామం הוּא ఇచ్చే ఉద్ఘాటనను ‘అతడే’ ద్వారా నిలిపి, ఆ వ్యక్తి రాజైన ఆహాజేనని బలంగా గుర్తించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో సాధారణ బిరుదు కాకుండా చతురక్షర దైవనామమే ఉంది. దాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగా ఉంచుతూ, ఆధునిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: מעל యొక్క మత-నైతిక భావం
  choice: నమ్మకద్రోహం చేయడం
  alternative: అపరాధం చేయడం
  rationale: ఈ పదం కేవలం సాధారణ తప్పును కాకుండా దేవునిపట్ల విశ్వాసబంధ ఉల్లంఘనను సూచిస్తుంది. అందువల్ల ‘నమ్మకద్రోహం’ ఆ సంబంధపరమైన తీవ్రతను మెరుగుగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్య నిర్మాణం వాడబడింది. మూలంలోని ఉద్ఘాటనను దీర్ఘవిరామం మరియు ‘అతడే’ ద్వారా నిలిపాం; [a] సూచిక ప్రధాన పాఠ్యంలో ఉంది.
