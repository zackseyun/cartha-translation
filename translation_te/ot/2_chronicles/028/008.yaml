revisions:
- from: ఇశ్రాయేలు కుమారులు తమ సహోదరులలోనుండి స్త్రీలను, కుమారులను, కుమార్తెలను—మొత్తం రెండు లక్షల మందిని—చెరపట్టారు.[a] వారి దగ్గరున్న విస్తారమైన దోపుడు సొమ్మును కూడా కొల్లగొట్టి, ఆ దోపుడు సొమ్మును సమరయకు తీసుకువచ్చారు.
  to: ఇశ్రాయేలీయులు తమ సహోదరుల నుండి[a] స్త్రీలను, కుమారులను, కుమార్తెలను కలిపి రెండు లక్షల మందిని చెరపట్టారు. వారు వారి నుండి విస్తారమైన దోపుడు సొమ్మును కూడా కొల్లగొట్టి, ఆ దోపుడు సొమ్మును సమరయకు తీసుకువచ్చారు.
  rationale: The revision improves modern Telugu idiom and clarifies the scope of the total number. It preserves the source’s military-captivity sense, its explicit women/sons/daughters enumeration, its emphasis on fellow kin, the repeated spoil term, and the destination Samaria. No disputed reading or theological interpretation has been introduced.
