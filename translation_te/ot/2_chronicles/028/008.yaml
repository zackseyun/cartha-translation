id: 2CH.28.8
reference: 2 Chronicles 28:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁבּוּ֩ בְנֵֽי יִשְׂרָאֵ֨ל מֵֽ/אֲחֵי/הֶ֜ם מָאתַ֣יִם אֶ֗לֶף נָשִׁים֙ בָּנִ֣ים וּ/בָנ֔וֹת וְ/גַם שָׁלָ֥ל רָ֖ב בָּזְז֣וּ מֵ/הֶ֑ם וַ/יָּבִ֥יאוּ אֶת הַ/שָּׁלָ֖ל לְ/שֹׁמְרֽוֹן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/008.yaml
  text: And the sons of Israel took captive from their brothers two hundred thousand women[a], sons, and daughters. They also took much spoil from them and brought the spoil to Samaria.
translation:
  language: te
  text: ఇశ్రాయేలీయులు తమ సహోదరుల నుండి[a] స్త్రీలను, కుమారులను, కుమార్తెలను కలిపి రెండు లక్షల మందిని చెరపట్టారు. వారు వారి నుండి విస్తారమైన దోపుడు సొమ్మును కూడా కొల్లగొట్టి, ఆ దోపుడు సొమ్మును సమరయకు తీసుకువచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తమ బంధువుల నుండి” లేదా “తోటి ఇశ్రాయేలీయుల నుండి.” హీబ్రూ మూలంలో “తమ సహోదరుల నుండి” అని ఉంది; ఇది వారిమధ్య ఉన్న ఉమ్మడి బంధుత్వాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: చెరపట్టారు
  rationale: యుద్ధంలో మనుషులను బందీలుగా పట్టుకొని తీసుకుపోవడాన్ని సూచించే שבה అనే క్రియ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: తరువాత వచ్చే ‘తమ సహోదరులు’ అనే బంధుత్వ భాషతో ఉన్న ఉద్దేశపూర్వక అనుసంధానాన్ని కాపాడేందుకు మూలంలోని రూపాన్ని నిలిపింది.
- source_word: מֵאֲחֵיהֶם
  choice: తమ సహోదరులలోనుండి
  rationale: ఇక్కడ אָח రక్తసంబంధీకులు లేదా తోటి ఇశ్రాయేలీయులు అనే విస్తృత భావాన్ని కలిగి ఉండవచ్చు; ‘సహోదరులు’ మూలంలోని కుటుంబసంబంధ, నైతిక తీవ్రతను కాపాడుతుంది.
- source_word: מָאתַיִם אֶלֶף
  choice: రెండు లక్షల మందిని
  rationale: సంఖ్యను నేరుగా తెలుగులో అందించి, జాబితాలోని వ్యక్తుల మొత్తం సంఖ్య అని స్పష్టం చేయడానికి ‘మందిని’ వాడింది.
- source_word: נָשִׁים בָּנִים וּבָנוֹת
  choice: స్త్రీలను, కుమారులను, కుమార్తెలను
  rationale: మూలపాఠంలో పేర్కొన్న మూడు వర్గాలను ‘పిల్లలు’ అని కలిపివేయకుండా యథాతథంగా నిలిపింది.
- source_word: שָׁלָל רָב
  choice: విస్తారమైన దోపుడు సొమ్ము
  rationale: యుద్ధంలో స్వాధీనం చేసుకున్న వస్తుసంపద అనే שָׁלָל భావాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: בָּזְזוּ
  choice: కొల్లగొట్టి
  rationale: వారి నుండి వస్తువులను యుద్ధ దోపిడీగా తీసుకున్న క్రియను సహజంగా, కానీ తీవ్రత తగ్గకుండా వ్యక్తం చేస్తుంది.
- source_word: וַיָּבִיאוּ אֶת־הַשָּׁלָל לְשֹׁמְרוֹן
  choice: ఆ దోపుడు సొమ్మును సమరయకు తీసుకువచ్చారు
  rationale: שָׁלָל పద పునరుక్తిని నిలిపి, స్థలనామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న ‘సమరయ’గా ఇచ్చింది.
theological_decisions:
- issue: ఇశ్రాయేలీయుల అంతర్గత యుద్ధంలో బంధుత్వ భాష
  choice: తమ సహోదరులలోనుండి
  alternative: తమ బంధువులలోనుండి / తోటి ఇశ్రాయేలీయులలోనుండి
  rationale: బందీలు విదేశీయులు కాక ఒకే నిబంధన సమాజానికి చెందినవారనే నైతిక, వేదాంతపరమైన ఉద్రిక్తతను ‘సహోదరులు’ నిలుపుతుంది; అదే సమయంలో విస్తృత భావాన్ని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. మూలంలోని బంధుత్వ పదజాలం, మూడు వర్గాల జాబితా, ‘దోపుడు సొమ్ము’ పద పునరుక్తి కాపాడబడ్డాయి. సంఖ్యను చదవడానికి సహజంగా ఉండేలా మధ్యలో వివరణాత్మక విరామంతో అమర్చాం.
