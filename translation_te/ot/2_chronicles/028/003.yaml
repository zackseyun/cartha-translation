source:
  edition: WLC
  text: וְ/ה֥וּא הִקְטִ֖יר בְּ/גֵ֣יא בֶן הִנֹּ֑ם וַ/יַּבְעֵ֤ר אֶת בָּנָי/ו֙ בָּ/אֵ֔שׁ כְּ/תֹֽעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/003.yaml
  text: He also burned incense in the Valley of Ben-hinnom[a], and he burned his sons in the fire, according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: te
  text: అతడు కూడా బెన్-హిన్నోము లోయలో ధూపం వేశాడు; యెహోవా ఇశ్రాయేలీయుల ఎదుటనుండి వెళ్లగొట్టిన జనాంగాల హేయక్రియలను అనుసరించి తన కుమారులను అగ్నిలో కాల్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన కుమారులను అగ్ని గుండా దాటించాడు.” అయితే ఇక్కడి హీబ్రూ మరింత నేరుగా, “తన కుమారులను అగ్నిలో కాల్చాడు” అని చెబుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: הִקְטִיר
  choice: ధూపం వేశాడు
  rationale: హిఫీల్ రూపంలోని קטר బలిగా పొగను పైకి లేపడాన్ని, తరచుగా ధూపం వేయడాన్ని సూచిస్తుంది. సందర్భానికి సరిపోయే సహజమైన తెలుగు ప్రయోగంగా దీనిని ఎంచుకున్నాం.
- source_word: בְּגֵיא בֶן־הִנֹּם
  choice: బెన్-హిన్నోము లోయలో
  rationale: ఇది స్థలనామం. తరువాతి కాలపు భావసంబంధాలను తెచ్చే ‘గెహెన్నా’కు బదులు హీబ్రూ పేరును లిప్యంతరీకరించాం.
- source_word: וַיַּבְעֵר אֶת־בָּנָיו בָּאֵשׁ
  choice: తన కుమారులను అగ్నిలో కాల్చాడు
  rationale: בער హిఫీల్ రూపం, ‘అగ్నిలో’ అనే పదబంధంతో కలిసి, నేరుగా కాల్చడాన్ని బలంగా సూచిస్తుంది. ‘కుమారులు’ అనేది בָּנָיו యొక్క పుంలింగ బహువచనాన్ని నిలుపుతుంది.
- source_word: כְּתוֹעֲבוֹת
  choice: హేయాచారాల ప్రకారం
  rationale: תועבות లోని నైతిక తీవ్రతను ‘హేయాచారాలు’ నిలుపుతుంది; כְּ ను ‘ప్రకారం’గా అనువదించడం అనుకరణ/అనుసరణ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַגּוֹיִם
  choice: జనాలు
  rationale: ఈ చారిత్రక సందర్భంలో ఇది దేశంలోని పూర్వ నివాస ప్రజలను సూచిస్తుంది; మతపరంగా భారితమైన పదాన్ని నివారిస్తూ సాధారణ తెలుగు వాడాం.
- source_word: הֹרִישׁ
  choice: వెళ్లగొట్టిన
  rationale: ירש హిఫీల్ ఇక్కడ భూమి నుండి స్వాధీనహీనులను చేసి తొలగించిన భావాన్ని సూచిస్తుంది; ‘వెళ్లగొట్టిన’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామాటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగు బైబిల్ వాడుకలో స్థిరపడిన వ్యక్తినామ రూపంతో అందించాం.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజల ఎదుట నుండి
  rationale: מִפְּנֵי లోని ‘వారి సన్నిధి/ముందు నుండి తొలగించడం’ అనే భావాన్ని నిలుపుతూ, ‘ఇశ్రాయేలు కుమారులు’ అనే అసహజ పదబంధానికి బదులు ఆధునిక తెలుగులో స్పష్టమైన సమూహార్థాన్ని ఇచ్చాం.
theological_decisions:
- issue: బాలబలి వర్ణనను తక్కువ తీవ్రతగల ప్రయోగంగా మార్చాలా?
  choice: ప్రధాన పాఠంలో ‘తన కుమారులను అగ్నిలో కాల్చాడు’ అని ఉంచడం
  alternative: ‘తన కుమారులను అగ్ని గుండా దాటించాడు’
  rationale: ఇక్కడ హీబ్రూ పాఠం ‘అగ్ని గుండా దాటించడం’ అనే సాధారణ సూత్రప్రయోగానికి బదులు בער అనే బలమైన క్రియను వాడుతుంది. అందువల్ల పాఠంలోని తీవ్రతను తగ్గించకుండా నేరుగా అనువదించి, విస్తృతంగా తెలిసిన ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలిని అనుసరించాం. స్థలనామాన్ని లిప్యంతరీకరించాం; దైవనామాన్ని వ్యక్తినామంగా నిలిపాం; మూలంలోని కఠినమైన బాలబలి వర్ణనను మృదువుపరచలేదు. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో ఉంది.
