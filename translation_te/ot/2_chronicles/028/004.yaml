id: 2CH.28.4
reference: 2 Chronicles 28:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְזַבֵּ֧חַ וַ/יְקַטֵּ֛ר בַּ/בָּמ֖וֹת וְ/עַל הַ/גְּבָע֑וֹת וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/004.yaml
  text: He sacrificed and burned incense on the high places[a], on the hills, and under every green tree.
translation:
  language: te
  text: అతడు ఉన్నత స్థలాల్లో[a], కొండల మీద, పచ్చగా ఉన్న ప్రతి చెట్టు కింద బలులు అర్పించి ధూపం వేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతడు ఉన్నత స్థలాల్లో, కొండల మీద, ఆకులతో నిండిన ప్రతి చెట్టు కింద బలులు అర్పించి, అర్పణలను పొగగా పైకి లేపాడు.’
    reason: కטר అనే క్రియ ధూపం వేయడాన్నే కాక అర్పణలను కాల్చి వాటి పొగను పైకి లేపడాన్నీ సూచించగలదు; רענןకు ‘పచ్చగా ఉన్న’ లేదా ‘ఆకులతో నిండిన’ అనే భావాలు సాధ్యమే.
lexical_decisions:
- source_word: וַיְזַבֵּחַ
  choice: బలులు అర్పించి
  rationale: זבח పీయేల్ రూపం బలి అర్పించే క్రియను సూచిస్తుంది. తెలుగులో ‘బలులు అర్పించాడు’ సహజంగా, స్పష్టంగా ఉంటుంది; తరువాతి సమాన క్రియతో అనుసంధానించేందుకు ‘అర్పించి’ అని ఇచ్చాం.
- source_word: וַיְקַטֵּר
  choice: ధూపం వేశాడు
  rationale: קטר పీయేల్ రూపం ధూపం వేయడం లేదా బలి అర్పణలను పొగగా పైకి లేపడం అనే భావాలను కలిగి ఉండవచ్చు. ఈ ఆరాధనా సందర్భంలో ‘ధూపం వేశాడు’ సహజమైన ప్రధాన అనువాదం; విస్తృత భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: בַּבָּמוֹת
  choice: ఉన్నత స్థలాల్లో
  rationale: במות స్థానిక ఆరాధనా కేంద్రాలకు వాడే సాంకేతిక పదం. ‘ఉన్నత స్థలాలు’ అనే సంప్రదాయ పదబంధం భౌగోళిక భావంతో పాటు ఆరాధనా స్థలాల భావాన్నీ నిలుపుతుంది.
- source_word: וְעַל הַגְּבָעוֹת
  choice: కొండల మీద
  rationale: גבעות సాధారణంగా కొండలు లేదా గుట్టలను సూచిస్తుంది. ‘కొండల మీద’ మూలంలోని స్థానార్థక భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: పచ్చగా ఉన్న ప్రతి చెట్టు కింద
  rationale: רענן తాజాదనం, పచ్చదనం, ఆకులతో వర్ధిల్లడాన్ని సూచిస్తుంది. ‘పచ్చగా ఉన్న ప్రతి చెట్టు’ మూలంలోని స్థిర రూపకాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: అనధికారిక లేదా విగ్రహారాధనా స్థలాలను సూచించే ఆరాధనా పదబంధాల అనువాదం
  choice: ‘ఉన్నత స్థలాల్లో’ మరియు ‘పచ్చగా ఉన్న ప్రతి చెట్టు కింద’ అనే పదబంధాలను నిలుపడం
  alternative: ‘అన్యదేవతల పూజాస్థలాల్లో’ లేదా ‘ఆకులతో నిండిన ప్రతి చెట్టు కింద’ అని వివరణాత్మకంగా అనువదించడం
  rationale: హీబ్రూ పాఠం ఆరాధనా స్థలాలకు సంబంధించిన స్థిర పదజాలాన్ని వాడుతుంది; దానిని నేరుగా నిలిపితే పాత నిబంధనలోని అంతర్గ్రంథ సంబంధం కాపాడబడుతుంది, అలాగే పాఠంలో ప్రత్యక్షంగా లేని వివరణను చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ఆరాధనా సాంకేతిక పదమైన ‘ఉన్నత స్థలాలు’ను నిలుపుతూ, సాధారణ పాఠకుడికి అర్థమయ్యే క్రియారూపాలను ఎంచుకున్నాం.
