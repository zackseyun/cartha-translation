  terminology: “యాహ్వే” consistently represents יְהוָה in accordance with the supplied POB audit trail. “పరాక్రమవంతులైన యోధులు” is a natural contextual rendering of בני חיל; its lexical sense is preserved in the footnote.
  issues:
