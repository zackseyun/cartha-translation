    issue: The text uses “యెహోవా” for the Tetragrammaton.
    rationale: The project’s English audit trail explicitly requires “Yahweh,” not “Jehovah.” Telugu “యాహ్వే” is the corresponding transliteration and preserves the project’s divine-name policy.
  - severity: low
    issue: “ఇది జరిగింది” is an added explanatory clause.
    rationale: The Hebrew ends with a causal/circumstantial infinitive clause, not an independent statement that explicitly says “this happened.” Retaining the causal clause directly is closer and more concise.
