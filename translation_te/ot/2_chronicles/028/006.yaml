id: 2CH.28.6
reference: 2 Chronicles 28:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּהֲרֹג֩ פֶּ֨קַח בֶּן רְמַלְיָ֜הוּ בִּֽ/יהוּדָ֗ה מֵאָ֨ה וְ/עֶשְׂרִ֥ים אֶ֛לֶף בְּ/י֥וֹם אֶחָ֖ד הַ/כֹּ֣ל בְּנֵי חָ֑יִל בְּ/עָזְבָ֕/ם אֶת יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/006.yaml
  text: And Pekah son of Remaliah killed in Judah one hundred twenty thousand in a single day[a], all of them valiant men, because they had forsaken Yahweh[c][b], the God of their fathers.
translation:
  language: te
  text: రెమల్యా కుమారుడైన పెకహు యూదాలో ఒకే రోజున లక్షా ఇరవై వేల మందిని చంపాడు[a]. వారందరూ పరాక్రమవంతులైన యోధులు[b], ఎందుకంటే వారు తమ పూర్వికుల దేవుడైన యాహ్వేను విడిచిపెట్టారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక రోజులో.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “పరాక్రమపు కుమారులు”; అంటే పరాక్రమవంతులైన పోరాట యోధులు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “వారు తమ పూర్వికుల దేవుడైన యాహ్వేను విడిచిపెట్టినప్పుడు.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: చంపాడు
  rationale: הרג అనే క్రియ నేరుగా చంపడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో స్పష్టమైన సహజ పదం.
- source_word: בִּיהוּדָה
  choice: యూదాలో
  rationale: ב ఇక్కడ స్థలాన్ని సూచిస్తుంది; చారిత్రక రాజ్యం లేదా ప్రాంతానికి ‘యూదా’ సరైన పేరు.
- source_word: מֵאָה וְעֶשְׂרִים אֶלֶף
  choice: లక్షా ఇరవై వేల మందిని
  rationale: హీబ్రూ సంఖ్యను తెలుగులో సహజంగా, వ్యక్తులను సూచించే ‘మందిని’తో వ్యక్తపరుస్తుంది.
- source_word: בְּיוֹם אֶחָד
  choice: ఒక్క రోజులోనే
  rationale: అక్షరార్థంగా ‘ఒక రోజులో’; ‘ఒక్క...లోనే’ ఆ విపరీత సంఖ్య ఒకే రోజులో మరణించిందనే బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: הַכֹּל
  choice: వారందరూ
  rationale: ముందు పేర్కొన్న మృతుల మొత్తం గురించే ఈ పదం చెబుతుంది.
- source_word: בְּנֵי חָיִל
  choice: పరాక్రమవంతులైన యోధులు
  rationale: అక్షరార్థంగా ‘పరాక్రమపు కుమారులు’; సందర్భంలో యుద్ధసామర్థ్యం గల ధైర్యవంతులైన పురుషులను సూచిస్తుంది.
- source_word: בְּעָזְבָם
  choice: వారు ... విడిచిపెట్టినందువల్ల
  rationale: ב తో కూడిన infinitive construct సందర్భం లేదా కారణాన్ని సూచించగలదు; ఇక్కడ పరాజయానికి కారణాన్ని తెలిపే భావం సందర్భానికి బాగా సరిపోతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను తెలుగులో సుపరిచితమైన వ్యక్తినామ రూపంలో ఇస్తుంది; బిరుదుతో భర్తీ చేయదు.
- source_word: אֱלֹהֵי אֲבוֹתָם
  choice: తమ పూర్వికుల దేవుడు
  rationale: ఒడంబడిక చరిత్రలో వారి పూర్వతరాల దేవుణ్ణి సూచించే నిర్మాణాన్ని సహజ ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: בְּעָזְבָם వధతో కలిగిన సంబంధం
  choice: 'కారణార్థకం: ‘విడిచిపెట్టినందువల్ల’'
  alternative: 'కాలార్థకం: ‘విడిచిపెట్టినప్పుడు’'
  rationale: హీబ్రూ నిర్మాణం కారణం లేదా సమకాలిక పరిస్థితి రెండింటినీ అనుమతిస్తుంది. దినవృత్తాంతాల సందర్భంలో సైనిక విపత్తును నిబంధన అవిశ్వాసపు పరిణామంగా చూపడం వల్ల కారణార్థక పఠనం ప్రధాన పాఠ్యంలో ఉంచబడింది; ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; చారిత్రక వర్ణనకు తగిన గంభీరతతో, సాధారణ పాఠకులకు స్పష్టంగా. మూలంలోని కారణార్థక/కాలార్థక సందిగ్ధతను పాదసూచికలో నిలిపింది.
