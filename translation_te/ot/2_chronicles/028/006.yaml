  source_fidelity: 'The principal sense is retained: Pekah kills 120,000 in Judah in one day, the victims are described as בני חיל, and their forsaking of Yahweh is presented causally. However, the added independent statement “ఇది జరిగింది” is not present in the Hebrew and recasts the final causal clause more explicitly than necessary. The divine name should also follow the project’s stated Yahweh policy rather than use the distinct traditional form “యెహోవా.”'
