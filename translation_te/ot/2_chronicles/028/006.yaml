- from: రెమల్యా కుమారుడు పెకహు యూదాలో ఒక్క రోజులోనే లక్షా ఇరవై వేల మందిని చంపాడు[a]. వారందరూ పరాక్రమవంతులైన యోధులు[b]. వారు తమ పూర్వికుల దేవుడైన యెహోవాను విడిచిపెట్టినందువల్ల[c] ఇది జరిగింది.
