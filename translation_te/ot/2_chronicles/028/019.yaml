id: 2CH.28.19
reference: 2 Chronicles 28:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי הִכְנִ֤יעַ יְהוָה֙ אֶת יְהוּדָ֔ה בַּ/עֲב֖וּר אָחָ֣ז מֶֽלֶךְ יִשְׂרָאֵ֑ל כִּ֤י הִפְרִ֨יעַ֙ בִּֽ/יהוּדָ֔ה וּ/מָע֥וֹל מַ֖עַל בַּ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/019.yaml
  text: For Yahweh humbled Judah because of Ahaz king of Israel[b][a], for he had cast off restraint in Judah and had acted very unfaithfully against Yahweh.
translation:
  language: te
  text: ఎందుకంటే ఇశ్రాయేలు రాజైన ఆహాజు[a] కారణంగా యెహోవా యూదాను దీనస్థితికి తెచ్చాడు. ఆహాజు యూదాలో కట్టడిని తొలగించాడు[b]; యెహోవాకు ఘోరంగా ద్రోహం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: “ఇశ్రాయేలు రాజైన ఆహాజు.” ఆహాజు యూదా రాజు; అయినా మూలపాఠంలోని మాటను “యూదా రాజు” అని మార్చకుండా ఇక్కడ నిలిపాం.'
    reason: alternative_reading
  - marker: b
    text: లేదా “యూదాలో విచ్చలవిడిగా ప్రవర్తించాడు,” లేదా “యూదాలో అదుపు తప్పేలా చేశాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכְנִיעַ
  choice: దీనస్థితికి తెచ్చాడు
  rationale: హిఫీల్ రూపంలోని కారణార్థాన్ని, యూదా స్థితి దిగజార్చబడిందనే భావాన్ని తెలియజేస్తుంది; కేవలం సైనికంగా ‘లోబరచాడు’ అనే అర్థానికి పరిమితం చేయదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా నిలుపుతుంది.
- source_word: בַּעֲבוּר
  choice: కారణంగా
  rationale: ఈ సందర్భంలో ప్రయోజనాన్ని కాక కారణాన్ని సూచిస్తుంది.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజైన
  rationale: ఆహాజు చారిత్రకంగా యూదా రాజైనా, మసొరా పాఠంలోని ‘ఇశ్రాయేలు రాజు’ అనే మాటను సమన్వయపరచకుండా యథాతథంగా నిలుపుతుంది.
- source_word: הִפְרִיעַ
  choice: కట్టడి లేకుండా చేశాడు
  rationale: కారణార్థక రూపంలోని అదుపును తొలగించడం, విచ్చలవిడితనానికి దారితీయడం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, కర్త చర్య యొక్క ఖచ్చిత స్వరూపంపై ఉన్న కొంత అస్పష్టతను నిలుపుతుంది.
- source_word: בִּיהוּדָה
  choice: యూదాలో
  rationale: ఆహాజు చర్య జరిగిన పరిధిని సహజంగా సూచిస్తుంది.
- source_word: וּמָעוֹל מַעַל
  choice: ఘోరంగా ద్రోహం చేశాడు
  rationale: ఒకే మూలానికి చెందిన క్రియారూపాల పునరుక్తి ఇచ్చే తీవ్రతను ‘ఘోరంగా’ ద్వారా తెలియజేస్తూ, מעל లోని నిబంధనాపరమైన అవిశ్వాసం లేదా ద్రోహ భావాన్ని నిలుపుతుంది.
- source_word: בַּיהוָה
  choice: యెహోవాకు
  rationale: ద్రోహం ఎవరికి వ్యతిరేకంగా జరిగిందో తెలుగులో సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: ఆహాజును ‘ఇశ్రాయేలు రాజు’ అని పేర్కొనడం
  choice: ప్రధాన పాఠంలో ‘ఇశ్రాయేలు రాజైన ఆహాజు’ అని నిలుపడం
  alternative: చారిత్రక వివరానికి అనుగుణంగా ‘యూదా రాజైన ఆహాజు’ అని మార్చడం
  rationale: హీబ్రూ పాఠం స్పష్టంగా ‘ఇశ్రాయేలు రాజు’ అని చెబుతుంది. దినవృత్తాంతాల గ్రంథంలోని ఈ మాటకు వాగ్వైఖరిపరమైన లేదా వేదాంతపరమైన ఉద్దేశం ఉండవచ్చు; కాబట్టి పాఠంలోని ఉద్రిక్తతను తొలగించకుండా చారిత్రక వివరణను పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. మొదటి כִּי వాక్యానికి వివరణాత్మక కారణసూచక ‘ఎందుకంటే’ను, రెండవ כִּי యొక్క వివరణాత్మక బలాన్ని కొత్త వాక్యంతో సహజంగా వ్యక్తం చేశాం. అసలు పాఠంలోని ‘ఇశ్రాయేలు రాజు’ అనే ఉద్రిక్తతను ప్రధాన పాఠంలోనే నిలిపాం.
