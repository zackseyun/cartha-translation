source:
  edition: WLC
  text: וּ/פְלִשְׁתִּ֣ים פָּשְׁט֗וּ בְּ/עָרֵ֨י הַ/שְּׁפֵלָ֣ה וְ/הַ/נֶּגֶב֮ לִֽ/יהוּדָה֒ וַֽ֠/יִּלְכְּדוּ אֶת בֵּֽית שֶׁ֨מֶשׁ וְ/אֶת אַיָּל֜וֹן וְ/אֶת הַ/גְּדֵר֗וֹת וְ/אֶת שׂוֹכ֤וֹ וּ/בְנוֹתֶ֨י/הָ֙ וְ/אֶת תִּמְנָ֣ה וּ/בְנוֹתֶ֔י/הָ וְ/אֶת גִּמְז֖וֹ וְ/אֶת בְּנֹתֶ֑י/הָ וַ/יֵּשְׁב֖וּ שָֽׁם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/018.yaml
  text: And the Philistines had raided the cities of the lowland and the Negeb of Judah[a], and they captured Beth-shemesh, Aijalon, Gederoth, Soko and its villages, Timnah and its villages, and Gimzo and its villages; and they settled there.
translation:
  language: te
  text: ఫిలిష్తీయులు యూదాలోని లోతట్టు ప్రాంతం మరియు నెగెవులోని పట్టణాలపై దాడి చేశారు. వారు బేత్షెమెషు, అయ్యాలోను, గెదెరోతు, శోకోను దాని అనుబంధ గ్రామాలతో[a], తిమ్నాను దాని అనుబంధ గ్రామాలతో, గిమ్జోను దాని అనుబంధ గ్రామాలతో స్వాధీనం చేసుకొని అక్కడ నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “దాని కుమార్తెలతో”; అంటే ప్రధాన పట్టణానికి అనుబంధంగా ఉన్న చిన్న నివాసాలతో.
    reason: హీబ్రూ בנותיה అనే నుడికారపు అక్షరార్థాన్ని, సందర్భంలో దాని అర్థమైన అనుబంధ నివాసాలను రెండింటినీ సూచించడానికి.
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ప్రజాసమూహాన్ని సూచించే పేరును తెలుగులో సుపరిచితమైన బైబిలు రూపంలో ఇచ్చాం; ఆరంభంలోని వావ్‌ను తెలుగు కథన ప్రవాహంలో ప్రత్యేకంగా ‘మరియు’ అని అనువదించలేదు.
- source_word: פָּשְׁטוּ
  choice: దాడి చేశారు
  rationale: సైనిక సందర్భంలో ఈ క్రియ దండెత్తడం లేదా దోపిడి దాడి చేయడం అనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘దాడి చేశారు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: בְּעָרֵי הַשְּׁפֵלָה וְהַנֶּגֶב לִיהוּדָה
  choice: యూదాకు చెందిన లోతట్టు ప్రాంతంలోని, నెగెవులోని పట్టణాలు
  rationale: షెఫేలా అనే భౌగోళిక ప్రాంత స్వభావాన్ని ‘లోతట్టు ప్రాంతం’గా తెలిపి, నెగెవును ప్రత్యేక ప్రాంతనామంగా లిప్యంతరీకరించాం. לִיהוּדָה రెండింటినీ యూదాతో సంబంధపరుస్తుంది.
- source_word: וַיִּלְכְּדוּ
  choice: స్వాధీనం చేసుకొని
  rationale: పట్టణాలను సైనికంగా పట్టుకొని తమ ఆధీనంలోకి తెచ్చుకున్న భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בֵּית שֶׁמֶשׁ
  choice: బేత్‌షెమెషు
  rationale: స్థలనామాన్ని తెలుగు ధ్వని, బైబిలు నామరూప సంప్రదాయాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אַיָּלוֹן
  choice: అయ్యాలోను
  rationale: హీబ్రూ స్థలనామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: הַגְּדֵרוֹת
  choice: గెదెరోతు
  rationale: స్థలనామాన్ని అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: שׂוֹכוֹ
  choice: శోకో
  rationale: హీబ్రూ שׂ ధ్వనిని ‘శ’తో సూచిస్తూ స్థలనామాన్ని లిప్యంతరీకరించాం; ఇతర తెలుగు రూపాలు సాధ్యమని పాదసూచికలో తెలిపాం.
- source_word: וּבְנוֹתֶיהָ / בְּנֹתֶיהָ
  choice: దాని చుట్టుపక్కల గ్రామాలు
  rationale: అక్షరార్థంగా ‘దాని కుమార్తెలు’; ప్రధాన పట్టణానికి అనుబంధమైన చిన్న నివాసాలను సూచించే హీబ్రూ నుడికారాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలిపాం.
- source_word: תִּמְנָה
  choice: తిమ్నా
  rationale: స్థలనామాన్ని హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: גִּמְזוֹ
  choice: గిమ్జో
  rationale: స్థలనామాన్ని హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: అక్కడ నివసించారు
  rationale: ఆక్రమణ తరువాత అక్కడే ఉండిపోయిన భావం సందర్భం ద్వారా స్పష్టమవుతుంది; ‘నివసించారు’ మూలంలోని ישׁבకు సరళమైన, గౌరవప్రదమైన తెలుగు రూపం.
