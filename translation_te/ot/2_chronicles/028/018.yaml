    rationale: בנותיה అనేది ప్రధాన పట్టణానికి ఆధారితమైన లేదా అనుబంధ నివాసాలను సూచించే నుడికారం. అవి తప్పనిసరిగా కేవలం ‘చుట్టుపక్కల’ ఉన్నవే అని మూలం చెప్పదు.
