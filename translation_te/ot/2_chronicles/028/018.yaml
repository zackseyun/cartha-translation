translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. స్థలనామాలను అనువదించకుండా లిప్యంతరీకరించాం; షెఫేలా స్వభావాన్ని మాత్రం పాఠకునికి అర్థమయ్యేలా ‘లోతట్టు ప్రాంతం’గా ఇచ్చాం. మూలంలో ‘దాని గ్రామాలు’ అనే నుడికారం మూడుసార్లు వస్తుంది; తెలుగు వాక్యంలోనూ ప్రతి పట్టణంతో దాని సంబంధాన్ని స్పష్టంగా నిలిపాం.
