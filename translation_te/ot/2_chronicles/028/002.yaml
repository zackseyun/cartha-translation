source:
  edition: WLC
  text: וַ/יֵּ֕לֶךְ בְּ/דַרְכֵ֖י מַלְכֵ֣י יִשְׂרָאֵ֑ל וְ/גַ֧ם מַסֵּכ֛וֹת עָשָׂ֖ה לַ/בְּעָלִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/002.yaml
  text: He walked in the ways of the kings of Israel[b][a], and he also made cast images for the Baals.
translation:
  language: te
  text: అతడు ఇశ్రాయేలు రాజుల మార్గాల్లో నడిచాడు. అంతేకాక, బయలుల కోసం పోతపోసిన విగ్రహాలను[a] తయారుచేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కరిగించి పోతపోసిన విగ్రహాలను.’ హీబ్రూ పదం ప్రత్యేకంగా పోతపోసి తయారుచేసిన ప్రతిమలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘బయలుల కోసం’ అని బహువచనం ఉంది. ఇది బయలు ఆరాధనకు సంబంధించిన అనేక స్థానిక రూపాలను లేదా ప్రతినిధి రూపాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: నడిచాడు
  rationale: ‘మార్గాల్లో నడవడం’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ, అతని ప్రవర్తనను మరియు జీవన విధానాన్ని సూచిస్తుంది.
- source_word: בְּדַרְכֵי
  choice: మార్గాల్లో
  rationale: హీబ్రూలోని బహువచనాన్ని, ప్రవర్తనా విధానాలను సూచించే రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజులు
  rationale: మూలంలోని చారిత్రక సూచనను నేరుగా, స్పష్టంగా అందిస్తుంది.
- source_word: וְגַם
  choice: అంతేకాక
  rationale: మొదటి ఆరోపణకు మరొక అపరాధాన్ని జోడిస్తున్న భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מַסֵּכוֹת
  choice: పోతపోసిన విగ్రహాలు
  rationale: కరిగించిన పదార్థాన్ని అచ్చులో పోసి తయారుచేసిన ప్రతిమలు అనే మూలపదంలోని నిర్దిష్ట తయారీ భావాన్ని నిలుపుతుంది.
- source_word: עָשָׂה
  choice: తయారుచేశాడు
  rationale: విగ్రహాల తయారీని ఆధునిక, సహజ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לַבְּעָלִים
  choice: బయలుల కోసం
  rationale: హీబ్రూ పదంలోని బహువచనాన్ని సమతలీకరించకుండా అలాగే నిలుపుతుంది.
theological_decisions:
- issue: בְּעָלִים అనే పదంలోని బహువచనం
  choice: బయలులు
  alternative: బయలు; బయలు విగ్రహాలు
  rationale: మూలంలో బహువచనం స్పష్టంగా ఉంది. ఇది బయలు ఆరాధనకు సంబంధించిన అనేక స్థానిక రూపాలను లేదా ప్రతినిధి రూపాలను సూచించవచ్చు; అందువల్ల ఏకవచనంగా మార్చలేదు.
- issue: ప్రవర్తనను సూచించే ‘నడవడం’ రూపకం
  choice: ఇశ్రాయేలు రాజుల మార్గాల్లో నడిచాడు
  alternative: ఇశ్రాయేలు రాజుల ఆచారాలను అనుసరించాడు
  rationale: మూలంలోని నైతిక రూపకం తెలుగులో అర్థమయ్యేలా ఉండటంతో దాన్ని నిలిపి, వ్యాఖ్యానాత్మకంగా విప్పి చెప్పలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. హీబ్రూ ‘మార్గాల్లో నడవడం’ రూపకాన్ని, ‘బయలులు’ అనే బహువచనాన్ని నిలిపాం; ‘పోతపోసిన’ అనే పదంతో విగ్రహాల తయారీ విధానాన్ని స్పష్టపరిచాం.
