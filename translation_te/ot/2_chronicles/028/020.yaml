id: 2CH.28.20
reference: 2 Chronicles 28:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֣א עָלָ֔י/ו תִּלְּגַ֥ת פִּלְנְאֶ֖סֶר מֶ֣לֶךְ אַשּׁ֑וּר וַ/יָּ֥צַר ל֖/וֹ וְ/לֹ֥א חֲזָקֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/020.yaml
  text: Then Tiglath-pileser king of Assyria came against him and distressed him[a], but did not strengthen him.
translation:
  language: te
  text: అప్పుడు అష్షూరు రాజైన తిగ్లత్‌-పిల్నెసెరు అతనికి విరోధంగా వచ్చి, అతన్ని వేధించాడు[a], కానీ అతన్ని బలపరచలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతన్ని శ్రమపెట్టాడు.” ఇక్కడి హీబ్రూ క్రియ ఒత్తిడి చేయడం, బాధ కలిగించడం లేదా వేధించడం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא עָלָיו
  choice: అతనికి విరోధంగా వచ్చి
  rationale: సైనిక-రాజకీయ సందర్భంలో בוא על అనే పదబంధం సాధారణంగా శత్రుభావంతో రావడాన్ని సూచిస్తుంది; తటస్థమైన ‘అతని దగ్గరకు వచ్చి’ కంటే ఈ అనువాదం సందర్భంలోని విరోధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: תִּלְּגַת פִּלְנְאֶסֶר
  choice: తిగ్లత్‌-పిల్నెసెరు
  rationale: హీబ్రూ రూపానికి సమీపంగా ఉండే, తెలుగులో చదవడానికి అనువైన లిప్యంతరీకరణ.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: అష్షూరు రాజు
  rationale: భౌగోళిక-రాజకీయ సందర్భంలో אַשּׁוּרకు సాంప్రదాయక తెలుగు బైబిలు రూపమైన ‘అష్షూరు’ను ఉపయోగించి, హీబ్రూ సమాసాన్ని సహజ తెలుగులో అందించింది.
- source_word: וַיָּצַר לוֹ
  choice: అతన్ని ఇబ్బందిపెట్టాడు
  rationale: צרר ఇక్కడ ఒత్తిడి చేయడం, వేధించడం, బాధ కలిగించడం అనే విస్తృత భావాన్ని కలిగి ఉంది. ‘ముట్టడించాడు’ అనేది అవసరానికి మించిన సైనిక నిర్దిష్టతను చేర్చుతుంది; ‘ఇబ్బందిపెట్టాడు’ మూలంలోని విస్తృత భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְלֹא חֲזָקוֹ
  choice: అతన్ని బలపరచలేదు
  rationale: חזק యొక్క ప్రాథమిక భావమైన బలపరచడం లేదా బలం చేకూర్చడాన్ని నేరుగా నిలుపుతూ, అహాజు ఆశించిన సహాయం అందలేదనే సందర్భార్థాన్ని కూడా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని అనుసరించాం. హీబ్రూ వాక్యంలోని రెండు సమాంతర క్రియలను వేర్వేరుగా నిలిపి, ‘బదులుగా’ వంటి అదనపు వ్యాఖ్యాత్మక అనుసంధానాన్ని చేర్చలేదు.
