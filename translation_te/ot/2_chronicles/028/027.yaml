id: 2CH.28.27
reference: 2 Chronicles 28:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֨ב אָחָ֜ז עִם אֲבֹתָ֗י/ו וַֽ/יִּקְבְּרֻ֤/הוּ בָ/עִיר֙ בִּ/יר֣וּשָׁלִַ֔ם כִּ֚י לֹ֣א הֱבִיאֻ֔/הוּ לְ/קִבְרֵ֖י מַלְכֵ֣י יִשְׂרָאֵ֑ל וַ/יִּמְלֹ֛ךְ יְחִזְקִיָּ֥הֽוּ בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/027.yaml
  text: And Ahaz lay down with his fathers[a], and they buried him in the city, in Jerusalem, for they did not bring him into the tombs of the kings of Israel. And Hezekiah his son reigned in his place.
translation:
  language: te
  text: అహాజు తన పూర్వీకులతో నిద్రించాడు. అతణ్ణి నగరంలో, అంటే యెరూషలేములో పాతిపెట్టారు; ఎందుకంటే అతణ్ణి ఇశ్రాయేలు రాజుల[a] సమాధుల్లోకి తీసుకురాలేదు. అతని కుమారుడైన హిజ్కియా అతని స్థానంలో రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “ఇశ్రాయేలు రాజులు.” అహాజు యూదా రాజు కాబట్టి, కొందరు దీన్ని దావీదు వంశపు రాజుల సమాధులను సూచించేదిగా అర్థం చేసుకుంటారు; లేదా ఇక్కడ “యూదా రాజులు” అని ఉండాలని భావిస్తారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: తన పూర్వీకులతో నిద్రించాడు
  rationale: రాజుల మరణవార్తల్లో వచ్చే హీబ్రూ సంప్రదాయ నుడికారాన్ని నిలుపుతూ, ‘పితరులు’ కంటే ఆధునిక పాఠకులకు స్పష్టమైన ‘పూర్వీకులు’ను వాడింది; నేరుగా ‘చనిపోయాడు’ అని భావాన్ని పూర్తిగా విప్పలేదు.
- source_word: וַיִּקְבְּרֻהוּ
  choice: అతణ్ణి ... పాతిపెట్టారు
  rationale: హీబ్రూలోని కర్తృవాచక బహువచన క్రియను అలాగే ప్రతిబింబిస్తుంది.
- source_word: בָעִיר בִּירוּשָׁלִַם
  choice: నగరంలో, యెరూషలేములో
  rationale: ‘నగరంలో’ మరియు ‘యెరూషలేములో’ అనే రెండు స్థాన సూచనలనూ కుదించకుండా నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందు చెప్పిన పాతిపెట్టిన స్థలానికి కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: לֹא הֱבִיאֻהוּ
  choice: అతణ్ణి ... తీసుకురాలేదు
  rationale: హిఫీల్ రూపంలోని ‘తీసుకురావడం’ అనే కదలిక భావాన్ని ‘పాతిపెట్టలేదు’గా మార్చకుండా నిలుపుతుంది.
- source_word: לְקִבְרֵי
  choice: సమాధుల్లోకి
  rationale: రాజవంశీయుల అధికారిక ఖనన స్థలాల సందర్భంలో ‘సమాధులు’ సహజమైన, గౌరవప్రదమైన పదం.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజుల
  rationale: సందర్భాన్ని బట్టి ‘యూదా’ అని సవరించకుండా మసొరెటిక్ హీబ్రూ పాఠంలోని ‘ఇశ్రాయేలు’నే నిలుపుతుంది.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: అతని స్థానంలో రాజయ్యాడు
  rationale: రాజ్య వారసత్వాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తూ, תַּחְתָּיו లోని స్థానభర్తీ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: చారిత్రక సందర్భం కోసం ‘ఇశ్రాయేలు రాజులు’ను ‘యూదా రాజులు’గా సాధారణీకరించాలా?
  choice: ప్రధాన పాఠంలో ‘ఇశ్రాయేలు రాజులు’నే ఉంచడం
  alternative: ‘యూదా రాజులు’ లేదా ‘దావీదు వంశపు రాజులు’
  rationale: మసొరెటిక్ పాఠం స్పష్టంగా ‘ఇశ్రాయేలు’ అని చెబుతుంది. అహాజు యూదా రాజైనందున మరో పదం ఆశించవచ్చుగానీ, మూలపాఠంలోని ఉద్రిక్తతను అనుమానిత చారిత్రక సమన్వయంతో తొలగించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మరణానికి సంబంధించిన హీబ్రూ నుడికారాన్ని ‘పూర్వీకులతో నిద్రించాడు’గా నిలిపి, అస్పష్టతను తొలగించలేదు. పాదసూచిక గుర్తు సంబంధిత ‘ఇశ్రాయేలు రాజుల’ పదబంధం తరువాత ఉంచబడింది.
