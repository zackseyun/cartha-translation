  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּזְבַּ֗ח לֵֽ/אלֹהֵ֣י דַרְמֶשֶׂק֮ הַ/מַּכִּ֣ים בּ/וֹ֒ וַ/יֹּ֗אמֶר כִּ֠י אֱלֹהֵ֤י מַלְכֵֽי אֲרָם֙ הֵ֚ם מַעְזְרִ֣ים אוֹתָ֔/ם לָ/הֶ֥ם אֲזַבֵּ֖חַ וְ/יַעְזְר֑וּ/נִי וְ/הֵ֛ם הָֽיוּ ל֥/וֹ לְ/הַכְשִׁיל֖/וֹ וּ/לְ/כָל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/023.yaml
  text: And he sacrificed to the gods of Damascus that had struck him[a], and he said, “Because the gods of the kings of Aram help them, I will sacrifice to them[c][b], so that they may help me.” But they became the downfall of him and of all Israel.
translation:
  language: te
  text: తనను దెబ్బతీసిన దమస్కు దేవుళ్లకు అతడు బలులు అర్పించాడు[a]. అతడు, “అరాము రాజుల దేవుళ్లు వారికి సహాయం చేస్తున్నారు. కాబట్టి, వారు నాకు సహాయం చేయాలనే ఉద్దేశంతో నేను వారికి బలులు అర్పిస్తాను[b]” అన్నాడు. అయితే ఆ దేవుళ్లే అతనికీ, ఇశ్రాయేలు అంతటికీ పతనానికి కారణమయ్యారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తనను ఓడిస్తున్న” అని కూడా అనువదించవచ్చు. హీబ్రూ కృదంతం కొనసాగుతున్న లేదా లక్షణాత్మక చర్యను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నేను వారికి బలులు అర్పిస్తాను; వారు నాకు సహాయం చేస్తారు.”
    reason: grammatical_alternative
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా, “వారు అతనిని తొట్రిల్లజేయడానికి అతనికి, అలాగే ఇశ్రాయేలు అంతటికీ అయ్యారు” అని ఉంది. రెండవ భాగంలో క్రియాభావం ఎల్లిప్టికల్‌గా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: బలులు అర్పించాడు
  rationale: זבח అనే క్రియ బలి అర్పించడాన్ని సూచిస్తుంది. తెలుగు వాడుకలో “బలులు అర్పించాడు” సహజంగా ఉండి ఆరాధనా చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: לֵאלֹהֵי דַרְמֶשֶׂק
  choice: దమస్కు దేవుళ్లకు
  rationale: אֱלֹהֵי ఇక్కడ బహువచన నిర్మాణరూపం; విగ్రహారాధనా సందర్భం కూడా “దేవుళ్లు” అనే బహువచనాన్ని సమర్థిస్తుంది.
- source_word: הַמַּכִּים בּוֹ
  choice: తనను దెబ్బతీసిన
  rationale: נכה క్రియ దెబ్బకొట్టడం లేదా యుద్ధంలో ఓడించడం అనే భావాలను కలిగి ఉంది. “దెబ్బతీసిన” మూల రూపకాన్ని నిలుపుతూ, ఆహాజుకు జరిగిన పరాజయాన్ని కూడా సహజంగా సూచిస్తుంది; కృదంతంలోని కాల/కొనసాగింపు అస్పష్టతను పాదటీకలో ఉంచాం.
- source_word: אֱלֹהֵי מַלְכֵי אֲרָם
  choice: అరాము రాజుల దేవుళ్లు
  rationale: మూలంలోని מַלְכֵי పదం బహువచనం కాబట్టి “రాజుల” అని యథాతథంగా నిలిపాం.
- source_word: מַעְזְרִים אוֹתָם
  choice: వారికి సహాయం చేస్తున్నారు
  rationale: కృదంతం కొనసాగుతున్న లేదా లక్షణాత్మక చర్యను సూచించగలదు. “సహాయం చేస్తున్నారు” ఆహాజు ఆ సమయంలో చేసుకున్న తర్కాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לָהֶם אֲזַבֵּחַ
  choice: నేను వారికి బలులు అర్పిస్తాను
  rationale: అసంపూర్ణ క్రియారూపంలోని సంకల్పం/భవిష్యత్ భావాన్ని నిలిపి, దత్తార్థక సర్వనామాన్ని స్పష్టంగా అనువదించాం.
- source_word: וְיַעְזְרוּנִי
  choice: వారు నాకు సహాయం చేయాలని
  rationale: ఆహాజు బలి అర్పించడానికి ఉద్దేశించిన ఫలితాన్ని తెలుగు సహజ వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది. దీనిని “అప్పుడు వారు నాకు సహాయం చేస్తారు” అనే అంచనాగా కూడా గ్రహించవచ్చని పాదటీక తెలియజేస్తుంది.
- source_word: וְהֵם הָיוּ לוֹ לְהַכְשִׁילוֹ וּלְכָל יִשְׂרָאֵל
  choice: అయితే ఆ దేవుళ్లే అతనికీ ఇశ్రాయేలు అంతటికీ పతనానికి కారణమయ్యారు
  rationale: כשׁל హిఫీల్ రూపం తొట్రిల్లజేయడం నుంచి నాశనం లేదా పతనానికి దారితీయడం వరకు భావాన్ని కలిగి ఉంది. సందర్భంలోని వ్యంగ్యాత్మక విరుద్ధతను “అయితే” తెలియజేస్తుంది; “ఆ దేవుళ్లే” అనే పదప్రయోగం బహువచన సర్వనామపు సూచ్యాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: దమస్కు దేవుళ్లు ఆహాజును దెబ్బతీశారనే వాక్యపు దృక్కోణం
  choice: ఆహాజు చేసుకున్న అన్యదేవతారాధనా వివరణను కథనం నివేదిస్తున్నట్లే అనువదించడం
  alternative: ఆ దేవుళ్లు నిజమైన దైవిక కార్యకర్తలని కథకుడు సమర్థిస్తున్నట్లు స్పష్టీకరించడం
  rationale: మూలపాఠం ఆహాజు తర్కాన్ని ఎలాంటి సిద్ధాంతపరమైన వివరణను చేర్చకుండా అందిస్తుంది. చివరి వాక్యం అతడు ఆశించిన సహాయానికి బదులు పతనం కలిగిందనే వ్యంగ్యాత్మక తీర్పును తెలియజేస్తుంది.
- issue: וְיַעְזְרוּנִי లో ఉద్దేశం లేదా అంచనా
  choice: “వారు నాకు సహాయం చేయాలని” అనే ఉద్దేశార్థాన్ని ప్రధాన పాఠంలో ఉంచడం
  alternative: “వారు నాకు సహాయం చేస్తారు” అనే భవిష్యత్ అంచనాగా అనువదించడం
  rationale: బలి అర్పించాలనే సంకల్పం తరువాత వచ్చే క్రియ సందర్భానుసారంగా ఉద్దేశాన్ని సూచిస్తుంది; అయినా సరళ భవిష్యత్ భావం సాధ్యమే కాబట్టి దానిని పాదటీకలో నిలిపాం.
- issue: చివరి వాక్యంలో దేవుళ్ల పాత్ర
  choice: వారు అతనికీ ఇశ్రాయేలు అంతటికీ పతనానికి కారణమయ్యారని అనువదించడం
  alternative: “వారు అతనిని, ఇశ్రాయేలు అంతటినీ తొట్రిల్లజేయడానికి అతనికి అయ్యారు” అని పదక్షరార్థంగా అనువదించడం
  rationale: మూలంలోని కారణార్థక “తొట్రిల్లజేయు” భావాన్ని చారిత్రక తీర్పు సందర్భంలో “పతనానికి కారణమయ్యారు” అని సహజంగా వ్యక్తం చేశాం; మూల రూపకాన్ని పాదటీకలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. “దమస్కు,” “అరాము,” “ఇశ్రాయేలు” అనే స్థిరమైన బైబిలు స్థలనామ రూపాలను ఉంచాం. మూలంలోని బహువచనాలు, వ్యంగ్యాత్మక విరుద్ధత, అలాగే కృదంతం మరియు అసంపూర్ణ క్రియారూపాల అస్పష్టతలను ప్రధాన పాఠం మరియు పాదటీకల ద్వారా సంరక్షించాం.
