  text: וּ/בְ/י֨וֹם עֶשְׂרִ֤ים וּ/שְׁלֹשָׁה֙ לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י שִׁלַּ֥ח אֶת הָ/עָ֖ם לְ/אָהֳלֵי/הֶ֑ם שְׂמֵחִים֙ וְ/ט֣וֹבֵי לֵ֔ב עַל הַ/טּוֹבָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/דָוִ֣יד וְ/לִ/שְׁלֹמֹ֔ה וּ/לְ/יִשְׂרָאֵ֖ל עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/010.yaml
  text: And on the twenty-third day of the seventh month he sent the people to their tents[b][a], rejoicing and glad of heart because of the goodness that Yahweh had shown to David and to Solomon and to Israel his people.
translation:
  language: te
  text: ఏడవ నెల ఇరవైమూడవ రోజున అతడు ప్రజలను వారి గుడారాలకు[a] పంపించాడు. యాహ్వే దావీదుకు, సొలొమోనుకు, తన ప్రజలైన ఇశ్రాయేలుకు చేసిన మేలును బట్టి వారు సంతోషిస్తూ, హృదయానందంతో వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారి ఇళ్లకు’; అక్షరార్థంగా ‘వారి గుడారాలకు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וּשְׁלֹשָׁה לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ఏడవ నెల ఇరవై మూడవ రోజున
  rationale: హీబ్రూ తేదీ వ్యక్తీకరణను సహజమైన ఆధునిక తెలుగు క్రమంలో అందించింది; వాక్యారంభంలోని וּ కథన కొనసాగింపును సూచించినా తెలుగులో ప్రత్యేకంగా ‘మరియు’ అనడం అవసరం లేదు.
- source_word: שִׁלַּח
  choice: పంపించాడు
  rationale: పియేల్ రూపం సమకూడిన ప్రజలను తిరిగి వెళ్లనివ్వడం లేదా పంపివేయడం అనే భావాన్ని ఇస్తుంది; గమ్యపదబంధంతో ‘పంపించాడు’ సహజంగా ఉంది.
- source_word: לְאָהֳלֵיהֶם
  choice: వారి గుడారాలకు
  rationale: మూలంలోని స్పష్టమైన ‘గుడారాలు’ అనే రూపకల్పనను ప్రధాన పాఠ్యంలో నిలిపింది; సందర్భానుసారంగా ‘ఇళ్లకు’ అనే అర్థం రావచ్చని పాదసూచికలో తెలిపింది.
- source_word: שְׂמֵחִים וְטוֹבֵי לֵב
  choice: సంతోషిస్తూ, హృదయానందంతో
  rationale: ప్రజల బాహ్య ఆనందాన్నీ అంతరంగ హర్షాన్నీ తెలిపే జతపద భావాన్ని సహజమైన తెలుగులో, హృదయ పదచిత్రాన్ని నిలుపుతూ అందించింది.
- source_word: עַל הַטּוֹבָה אֲשֶׁר עָשָׂה
  choice: చేసిన మేలును బట్టి
  rationale: עָשָׂה యొక్క సాధారణ అర్థమైన ‘చేశాడు’ను, הַטּוֹבָה యొక్క శ్రేయస్కర కార్య భావంతో నేరుగా కలిపింది; ‘మేలు చూపాడు’ కంటే మూల నిర్మాణానికి దగ్గరగా ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు పఠనంలో విస్తృతంగా గుర్తించబడే దైవనామ రూపాన్ని ఉపయోగించి, మూలంలోని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయలేదు.
- source_word: לְדָוִיד וְלִשְׁלֹמֹה וּלְיִשְׂרָאֵל עַמּוֹ
  choice: దావీదుకు, సొలొమోనుకు, తన ప్రజలైన ఇశ్రాయేలుకు
  rationale: పునరుక్త לְ సూచించే లబ్ధిదారులను తెలుగు విభక్తులతో స్పష్టంగా తెలిపి, עַמּוֹ లోని ‘తన ప్రజలు’ అనే సంబంధాన్ని నిలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని నామాన్ని ‘ప్రభువు’ వంటి బిరుదుగా మార్చకుండా వ్యక్తిగత దైవనామంగానే ఉంచింది. తెలుగు సాధారణ పాఠకులకు ‘యెహోవా’ సుపరిచితమైన రూపం; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
- issue: దావీదు, సొలొమోను, ఇశ్రాయేలు పట్ల చేసిన మేలు
  choice: చేసిన మేలు
  alternative: చూపిన మేలు
  rationale: עָשָׂה לְ నిర్మాణాన్ని ‘వారికి చేసిన మేలు’గా నేరుగా నిలిపి, మేలు ఏ ప్రత్యేక రూపంలో జరిగిందో పాఠ్యంలో అదనంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని ‘గుడారాలు,’ ‘హృదయం,’ ‘చేసిన మేలు’ అనే ప్రధాన చిత్రాలు సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
