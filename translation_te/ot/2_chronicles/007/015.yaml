source:
  edition: WLC
  text: עַתָּ֗ה עֵינַ/י֙ יִהְי֣וּ פְתֻח֔וֹת וְ/אָזְנַ֖/י קַשֻּׁב֑וֹת לִ/תְפִלַּ֖ת הַ/מָּק֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/015.yaml
  text: Now my eyes will be open and my ears attentive to the prayer offered in this place[a].
translation:
  language: te
  text: ఇప్పుడు నా కళ్ళు తెరిచి ఉంటాయి; నా చెవులు ఈ స్థలపు ప్రార్థనను[a] శ్రద్ధగా ఆలకిస్తాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఈ స్థలంలో చేసే ప్రార్థనను’; లేదా ‘ఈ స్థలం నుండి చేసే ప్రార్థనను.’ హీబ్రూలో అక్షరార్థంగా ‘ఈ స్థలపు ప్రార్థనను’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: ముందటి ప్రతిష్ఠాపన సందర్భానికి ప్రస్తుత ఫలితాన్ని సూచించే కాలవాచక క్రియావిశేషణం; ‘ఇప్పటినుండి’ అనేది సాధ్యమైనా కొంత వివరణాత్మకం.
- source_word: עֵינַי
  choice: నా కళ్ళు
  rationale: దేవుని శ్రద్ధను తెలిపే మానవరూప వర్ణనను భావానువాదం చేయకుండా స్పష్టంగా నిలుపుతుంది.
- source_word: יִהְיוּ פְתֻחוֹת
  choice: తెరిచి ఉంటాయి
  rationale: היה క్రియతో కూడిన ‘తెరవబడిన’ స్థితిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְאָזְנַי קַשֻּׁבוֹת
  choice: నా చెవులు … శ్రద్ధగా ఆలకిస్తాయి
  rationale: తెలుగులో సహజంగా ఉండే విధంగా, చెవులు శ్రద్ధగా వినడం అనే మానవరూప చిత్రణనూ మూలంలోని సమాంతర భావాన్నీ నిలుపుతుంది.
- source_word: לִתְפִלַּת
  choice: ప్రార్థనను
  rationale: ల ఉపసర్గ దేవుని శ్రద్ధ ప్రార్థనవైపు మళ్లి ఉందని సూచిస్తుంది; తెలుగులో ‘ఆలకించు’తో ద్వితీయా విభక్తి సహజం.
- source_word: הַמָּקוֹם הַזֶּה
  choice: ఈ స్థలపు
  rationale: ‘ఈ స్థలపు ప్రార్థన’ అనే మూలంలోని సంబంధ నిర్మాణాన్ని నిలుపుతుంది; ‘ఈ స్థలంలో చేసే’ లేదా ‘ఈ స్థలం నుండి చేసే’ అనేవి సందర్భానుసార వివరణలు.
theological_decisions:
- issue: దేవుని గ్రహణశక్తిని తెలిపే మానవరూప భాష
  choice: ‘నా కళ్ళు’, ‘నా చెవులు’ అనే చిత్రణను నిలుపడం
  alternative: ‘నేను గమనించి వింటాను’ అని భావానువాదం చేయడం
  rationale: హీబ్రూ పాఠం దేవుని శ్రద్ధను శరీర అవయవాల చిత్రణతో తెలియజేస్తుంది; దాన్ని నిలపడం మూలంలోని సంబంధపూర్వక, నిబంధనాత్మక బలాన్ని కాపాడుతుంది.
- issue: ‘ఈ స్థలపు ప్రార్థన’ అనే సంబంధ నిర్మాణంలోని సందిగ్ధత
  choice: మూలానికి సమీపంగా ‘ఈ స్థలపు ప్రార్థన’ అని ప్రధాన పాఠంలో ఉంచడం
  alternative: ‘ఈ స్థలంలో చేసే ప్రార్థన’ లేదా ‘ఈ స్థలం నుండి చేసే ప్రార్థన’
  rationale: హీబ్రూ నిర్మాణం ప్రార్థనకు ఈ స్థలంతో ఉన్న సంబంధాన్ని మాత్రమే స్పష్టంగా చెబుతుంది; ప్రార్థన ఖచ్చితంగా ఎక్కడ చేయబడుతుందో ప్రధాన పాఠంలో నిర్ణయించకుండా ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని మానవరూప చిత్రణను, స్థలంతో ప్రార్థనకు ఉన్న సంబంధంలోని నిజమైన సందిగ్ధతను నిలుపుతూ సహజమైన తెలుగు వాక్యనిర్మాణం వాడబడింది.
