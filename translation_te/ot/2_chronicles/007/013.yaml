    issue: “అంటువ్యాధి” renders דֶּבֶר too specifically.
    rationale: דֶּבֶר refers to pestilence or plague generally; contagiousness is not encoded by the Hebrew term.
  - severity: low
    issue: The locust clause has awkward Telugu word order.
    rationale: Recasting it as “మిడతలు దేశాన్ని తినివేయమని నేను ఆజ్ఞాపించినప్పుడు” directly expresses the Hebrew command and reads naturally.
