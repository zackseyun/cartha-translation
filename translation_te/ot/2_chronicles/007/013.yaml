source:
  edition: WLC
  text: הֵ֣ן אֶֽעֱצֹ֤ר הַ/שָּׁמַ֨יִם֙ וְ/לֹֽא יִהְיֶ֣ה מָטָ֔ר וְ/הֵן אֲצַוֶּ֥ה עַל חָגָ֖ב לֶ/אֱכ֣וֹל הָ/אָ֑רֶץ וְ/אִם אֲשַׁלַּ֥ח דֶּ֖בֶר בְּ/עַמִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/013.yaml
  text: When I shut up the heavens so that there is no rain[a], or command the locust to devour the land, or send pestilence among my people[b],
translation:
  language: te
  text: నేను ఆకాశాన్ని మూసివేసి వర్షం కురవకుండా చేసినప్పుడు[a], లేదా మిడతలు దేశాన్ని తినివేయమని నేను ఆజ్ఞాపించినప్పుడు, లేదా నా ప్రజల మధ్య తెగులును పంపినప్పుడు[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒకవేళ నేను ఆకాశాన్ని మూసివేసి వర్షం కురవకుండా చేస్తే.” హీబ్రూ ప్రారంభ కణాన్ని మరింత అక్షరార్థంగా “నిశ్చయంగా ఒకవేళ” లేదా “ఇదిగో, ఒకవేళ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “తెగులు”కు బదులుగా “మహమ్మారి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: చేసినప్పుడు
  rationale: ఈ సందర్భంలో הֵן ఒక షరతుతో కూడిన సంభావ్య పరిస్థితిని పరిచయం చేస్తుంది. తరువాతి వచనంతో అనుసంధానమయ్యేలా సహజమైన తెలుగులో ‘చేసినప్పుడు’ అని అనువదించాం; ‘ఒకవేళ’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אֶעֱצֹר הַשָּׁמַיִם
  choice: నేను ఆకాశాన్ని మూసివేసి
  rationale: עצר క్రియతో ‘ఆకాశం’ కలిసినప్పుడు వర్షాన్ని నిలిపివేయడాన్ని సూచించే దృశ్యరూపకం ఏర్పడుతుంది. దానిని స్పష్టతతో పాటు మూలంలోని రూపకాన్ని నిలుపుతూ అనువదించాం.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: వర్షం లేకుండా చేసినప్పుడు
  rationale: ఆకాశాన్ని మూసివేయడం వల్ల కలిగే ఫలితాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲצַוֶּה עַל חָגָב
  choice: మిడతలు ... వాటికి ఆజ్ఞాపించినప్పుడు
  rationale: חָגָב ఏకవచనంలో ఉన్నా సమూహార్థకంగా వాడబడింది. తెలుగులో ప్రకృతి విపత్తు భావానికి సహజంగా ‘మిడతలు’ అనే బహువచనం వాడి, దైవ ఆజ్ఞను స్పష్టంగా ఉంచాం.
- source_word: לֶאֱכֹל הָאָרֶץ
  choice: దేశాన్ని ... మింగివేయాలని
  rationale: లక్ష్యభూమిని సూచించే הָאָרֶץ కు సందర్భానుసారంగా ‘దేశం’ సరిపోతుంది. మిడతల విధ్వంసక చర్యను לֶאֱכֹל యొక్క సందర్భార్థంతో ‘మింగివేయడం’గా వ్యక్తం చేశాం.
- source_word: אֲשַׁלַּח דֶּבֶר
  choice: అంటువ్యాధిని పంపినప్పుడు
  rationale: דֶּבֶר విస్తృతంగా వ్యాపించే ప్రాణాంతక వ్యాధిని, ముఖ్యంగా తీర్పు సందర్భంలో, సూచిస్తుంది. ఆధునిక పాఠకులకు స్పష్టంగా ఉండే ‘అంటువ్యాధి’ని ఎంచుకున్నాం.
- source_word: בְּעַמִּי
  choice: నా ప్రజల మధ్య
  rationale: ఇక్కడ ב ప్రజలలో వ్యాధి వ్యాపించడాన్ని సూచిస్తుంది; ‘మధ్య’ అనేది సహజమైన, ఖచ్చితమైన తెలుగు ప్రయోగం.
theological_decisions:
- issue: దైవ తీర్పులను షరతుతో కూడిన పరిస్థితులుగా వ్యక్తీకరించడం
  choice: మొదటి వాక్యంలో ‘చేసినప్పుడు’, తరువాతి ప్రత్యామ్నాయాల్లో ‘లేదా ... చేసినప్పుడు’ వాడటం
  alternative: ‘ఒకవేళ నేను ... చేస్తే’ లేదా ‘ఇదిగో, ఒకవేళ ...’
  rationale: హీబ్రూ కణాలు సంభవించగల దైవ చర్యల వరుసను పరిచయం చేస్తాయి. ప్రధాన పాఠంలో సహజమైన తెలుగు ప్రవాహాన్ని కాపాడుతూ దేవుని ప్రత్యక్ష కర్తృత్వాన్ని తగ్గించలేదు; షరతార్థక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘ఆకాశాన్ని మూసివేయడం’ అనే మూల దృశ్యరూపాన్ని నిలిపి, సమాంతర పరిస్థితులకు పునరుక్తి ద్వారా స్పష్టత ఇచ్చాం.
