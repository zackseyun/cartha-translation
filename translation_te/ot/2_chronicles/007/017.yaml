id: 2CH.7.17
reference: 2 Chronicles 7:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתָּ֞ה אִם תֵּלֵ֣ךְ לְ/פָנַ֗/י כַּ/אֲשֶׁ֤ר הָלַךְ֙ דָּוִ֣יד אָבִ֔י/ךָ וְ/לַ/עֲשׂ֕וֹת כְּ/כֹ֖ל אֲשֶׁ֣ר צִוִּיתִ֑י/ךָ וְ/חֻקַּ֥/י וּ/מִשְׁפָּטַ֖/י תִּשְׁמֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/017.yaml
  text: And as for you[a], if you walk before me as your father David walked, doing all that I have commanded you, and if you keep my statutes and my judgments,
translation:
  language: te
  text: ఇక నీవైతే, నీ తండ్రి దావీదు నా సన్నిధిలో నడుచుకున్నట్లుగా నీవు నడుచుకుంటూ, నేను నీకు ఆజ్ఞాపించినదంతా చేస్తూ, నా శాసనాలను, నా న్యాయవిధులను[a] పాటిస్తే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా తీర్పులను.”
    reason: מִשְׁפָּטַי అనే పదం న్యాయపరమైన విధులు, అధికారిక నియమాలు, లేదా తీర్పులు అనే భావాలను సందర్భానుసారం సూచించవచ్చు.
lexical_decisions:
- source_word: וְאַתָּה
  choice: ఇక నీవైతే
  rationale: ముందుంచిన సర్వనామంలోని ప్రత్యక్ష సంబోధనను, నొక్కిచెప్పే భావాన్ని, సంభాషణలోని మలుపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אִם
  choice: పాటిస్తే
  rationale: హీబ్రూ షరతును తెలుగులో సహజంగా వాక్యాంత క్రియారూపంలో వ్యక్తం చేస్తుంది; ముందున్న క్రియలన్నీ ఈ ఒక్క షరతు పరిధిలోనే ఉంటాయి.
- source_word: תֵּלֵךְ לְפָנַי
  choice: నా సన్నిధిలో నడుచుకుంటూ
  rationale: దేవుని సమక్షంలో జీవన ప్రవర్తనను సూచించే నిబంధనాత్మక నడక రూపకాన్ని నిలుపుతూ, తెలుగులో సహజంగా ఉంటుంది.
- source_word: כַּאֲשֶׁר הָלַךְ דָּוִיד אָבִיךָ
  choice: నీ తండ్రి దావీదు నా సన్నిధిలో నడుచుకున్నట్లుగా
  rationale: దావీదుతో పోలికను స్పష్టంగా ఉంచి, అదే నడక రూపకాన్ని కొనసాగిస్తుంది.
- source_word: וְלַעֲשׂוֹת כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: నేను నీకు ఆజ్ఞాపించినదంతా చేస్తూ
  rationale: హీబ్రూ క్రియార్థక నామరూపాన్ని సమాంతర తెలుగు అసమాపక క్రియతో చూపుతూ, ‘అంతా’ అనే సమగ్ర భావాన్ని కాపాడుతుంది.
- source_word: חֻקַּי
  choice: నా శాసనాలను
  rationale: నిబంధనాత్మక-న్యాయ సందర్భంలోని స్థిరమైన ఆదేశాల భావాన్ని తెలియజేసి, తరువాతి מִשְׁפָּטַי పదం నుంచి వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: וּמִשְׁפָּטַי
  choice: నా తీర్పులను
  rationale: న్యాయ నిర్ణయాలు లేదా అధికారిక విధుల భావాన్ని ప్రతిబింబిస్తుంది; ‘శాసనాలు’ అనే ముందరి పదంతో పదభేదాన్ని కాపాడుతుంది.
- source_word: תִּשְׁמֹר
  choice: పాటిస్తే
  rationale: కేవలం కాపాడటం కాక, విధేయతతో ఆచరించడం అనే నిబంధనాత్మక భావాన్ని సహజమైన తెలుగులో ఇస్తుంది.
theological_decisions:
- issue: నిబంధన విధేయతను ప్రతిఫలార్జన సిద్ధాంతంగా మార్చకుండా అనువదించడం
  choice: నడుచుకోవడం, ఆజ్ఞాపించినదంతా చేయడం, శాసనాలు మరియు తీర్పులు పాటించడం అనే నిజమైన షరతును యథాతథంగా ఉంచడం
  alternative: షరతును సాధారణ ‘నమ్మకంగా ఉండడం’గా విపులీకరించడం లేదా క్రియల ప్రాధాన్యాన్ని తగ్గించడం
  rationale: ఈ వాక్యం సొలొమోనుకు స్పష్టమైన నిబంధనాత్మక షరతును ఉంచుతుంది. పాఠంలోని విధేయత భాషను మెత్తబరచకుండా, దానిలో లేని ప్రతిఫలార్జన సిద్ధాంతాన్నీ చేర్చకుండా అనువదించాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘నా సన్నిధిలో నడుచుకోవడం’ అనే బైబిలీయ రూపకాన్ని నిలిపి, తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా షరతు సూచక క్రియను చివర ఉంచాం.
