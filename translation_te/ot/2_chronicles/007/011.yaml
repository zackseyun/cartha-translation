base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/011.yaml
  text: So Solomon finished the house of Yahweh and the house of the king[c][b][a], and everything that came upon Solomon’s heart to do in the house of Yahweh and in his own house he successfully accomplished.
translation:
  language: te
  text: ఈ విధంగా సొలొమోను యాహ్వే మందిరాన్నీ రాజభవనాన్నీ పూర్తి చేశాడు. యాహ్వే మందిరంలోను తన భవనంలోను చేయాలని సొలొమోను తన హృదయంలో ఉద్దేశించినదంతా అతడు సఫలంగా నెరవేర్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు సఫలమయ్యాడు” లేదా “వాటిని సఫలం చేశాడు.” హీబ్రూ క్రియకు ఈ రెండు భావ ఛాయలూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: పూర్తి చేశాడు
  rationale: כלה అనే క్రియ ఇక్కడ నిర్మాణ పనులను ముగింపుకు తీసుకురావడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘పూర్తి చేశాడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: అక్షరార్థం ‘యెహోవా ఇల్లు’; ఈ సందర్భంలో అది దేవాలయాన్ని సూచిస్తున్నందున ‘మందిరం’ సాధారణ పాఠకుడికి సహజమైన సందర్భోచిత అనువాదం. దేవుని వ్యక్తిగత నామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: בֵּית הַמֶּלֶךְ
  choice: రాజభవనం
  rationale: అక్షరార్థంగా ‘రాజు ఇల్లు’; ఇక్కడ సొలొమోను రాజప్రాసాద సముదాయాన్ని సూచిస్తుంది. ‘రాజభవనం’ సహజమైన ఆధునిక తెలుగు.
- source_word: כָּל הַבָּא עַל לֵב שְׁלֹמֹה
  choice: సొలొమోను తన హృదయంలో ఉద్దేశించినదంతా
  rationale: హీబ్రూ నుడికారం అక్షరార్థంగా ‘సొలొమోను హృదయంపై వచ్చినదంతా’; ఇది అతడు సంకల్పించిన లేదా చేయాలని కోరుకున్న వాటిని సూచిస్తుంది. భావాన్ని సహజంగా తెలుపుతూ ‘హృదయం’ అనే మూల రూపకాన్ని నిలిపాం.
- source_word: וּבְבֵיתוֹ
  choice: తన రాజభవనంలో
  rationale: ప్రత్యయం సొలొమోనును సూచిస్తుంది. ముందున్న ‘రాజభవనం’తో అనుసంధానం స్పష్టంగా ఉండేందుకు అదే పదాన్ని వాడాం.
- source_word: הִצְלִיחַ
  choice: విజయవంతంగా నెరవేర్చాడు
  rationale: హిఫీల్ రూపం ‘విజయం పొందడం’ లేదా ‘విజయవంతం చేయడం’ అనే పరిధిని కలిగి ఉంది. ఇక్కడ ఉద్దేశించిన నిర్మాణ కార్యాలను సఫలంగా అమలు చేసిన భావాన్ని ఈ పదబంధం స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా నిలిపాం. తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణకు సమీపమైన ప్రత్యామ్నాయం.
- issue: הִצְלִיחַ క్రియలో కర్తృక/కారణార్థక సూక్ష్మత
  choice: విజయవంతంగా నెరవేర్చాడు
  alternative: అతడు సఫలమయ్యాడు / వాటిని సఫలం చేశాడు
  rationale: హీబ్రూ రూపం విజయాన్ని పొందడం లేదా కార్యాన్ని విజయవంతం చేయడం రెండింటినీ సూచించగలదు. సందర్భంలో సొలొమోను సంకల్పించిన పనుల సఫల అమలు ప్రధానంగా కనిపించినా, ప్రత్యామ్నాయాన్ని పాదటీకలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. హీబ్రూ ‘ఇల్లు’ అనే పునరుక్తిని యాంత్రికంగా నిలపకుండా, సందర్భానుసారం ‘మందిరం’, ‘రాజభవనం’ అని అనువదించాం. ‘హృదయం’ అనే మూల రూపకాన్ని మాత్రం ఉద్దేశం అనే భావంతో సహజంగా కలిపి ఉంచాం.
