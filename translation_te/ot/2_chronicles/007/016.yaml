revisions:
- from: ఇప్పుడు నేను ఈ మందిరాన్ని[a] ఎన్నుకొని, ప్రతిష్ఠించాను; నా నామం అక్కడ ఎప్పటికీ ఉండేలా చేశాను. నా కన్నులూ నా హృదయమూ సదాకాలం అక్కడే ఉంటాయి.
  to: ఇప్పుడు నేను ఈ మందిరాన్ని[a] ఎన్నుకొని పవిత్రపరచాను, నా నామం అక్కడ ఎప్పటికీ ఉండుటకు; నా కన్నులూ నా హృదయమూ అన్ని దినములూ అక్కడే ఉంటాయి.
  rationale: The revision restores the Hebrew purpose construction, renders consecration with an explicit Telugu equivalent, and retains the distinction between ‘ఎప్పటికీ’ (עַד עוֹלָם) and ‘అన్ని దినములూ’ (כָּל הַיָּמִים).
