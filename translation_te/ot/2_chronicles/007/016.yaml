source:
  edition: WLC
  text: וְ/עַתָּ֗ה בָּחַ֤רְתִּי וְ/הִקְדַּ֨שְׁתִּי֙ אֶת הַ/בַּ֣יִת הַ/זֶּ֔ה לִ/הְיוֹת שְׁמִ֥/י שָׁ֖ם עַד עוֹלָ֑ם וְ/הָי֨וּ עֵינַ֧/י וְ/לִבִּ֛/י שָׁ֖ם כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/016.yaml
  text: And now I have chosen and consecrated this house[a], that my name may be there forever[b], and my eyes and my heart will be there all the days.
translation:
  language: te
  text: ఇప్పుడు నేను ఈ మందిరాన్ని[a] ఎన్నుకొని పవిత్రపరచాను, నా నామం అక్కడ ఎప్పటికీ ఉండుటకు; నా కన్నులూ నా హృదయమూ అన్ని దినములూ అక్కడే ఉంటాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో అక్షరార్థం ‘ఈ ఇంటిని.’ ఇక్కడ అది దేవాలయాన్ని సూచిస్తుంది. ‘పవిత్రపరచాను’ అంటే పవిత్రమైనదిగా ప్రత్యేకపరచాను.
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: సంధానంతో కూడిన కాలసూచక పదం దైవిక ప్రసంగంలో మార్పును సూచిస్తుంది; తెలుగులో ‘ఇప్పుడు’ సహజంగా ఆ ప్రవాహాన్ని తెలియజేస్తుంది.
- source_word: בָּחַרְתִּי
  choice: ఎన్నుకొని
  rationale: పూర్తయిన దైవిక ఎంపికను తదుపరి క్రియతో సహజంగా అనుసంధానిస్తుంది.
- source_word: וְהִקְדַּשְׁתִּי
  choice: ప్రతిష్ఠించాను
  rationale: హిఫీల్ రూపం ‘పవిత్రమైనదిగా ప్రత్యేకపరచడం’ అనే భావాన్ని ఇస్తుంది; మందిర సందర్భంలో ‘ప్రతిష్ఠించాను’ ఆధునిక తెలుగులో సహజమైనది. మూలభావాన్ని పాదటిప్పణి స్పష్టం చేస్తుంది.
- source_word: הַבַּיִת הַזֶּה
  choice: ఈ మందిరాన్ని
  rationale: మూలంలో అక్షరార్థంగా ‘ఈ ఇల్లు’ ఉన్నప్పటికీ, సందర్భం సొలొమోను కట్టించిన దేవాలయాన్ని స్పష్టంగా సూచిస్తుంది; తెలుగులో ‘మందిరం’ అపార్థాన్ని నివారిస్తుంది.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: నా నామం అక్కడ ఎప్పటికీ ఉండేలా చేశాను
  rationale: లక్ష్యార్థక అనంతక్రియ నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, దేవుని ‘నామం’ అనే ఆలయ-వేదాంత పదచిత్రాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: עַד עוֹלָם
  choice: ఎప్పటికీ
  rationale: దీర్ఘమైన, నిరంతర కాలాన్ని సంక్షిప్తంగా మరియు సహజంగా తెలియజేస్తుంది.
- source_word: וְהָיוּ עֵינַי וְלִבִּי שָׁם
  choice: నా కన్నులూ నా హృదయమూ అక్కడే ఉంటాయి
  rationale: దేవుని శ్రద్ధ, నిబద్ధతలను తెలిపే మానవరూపక చిత్రణను వ్యాఖ్యానించి కుదించకుండా నిలుపుతుంది.
- source_word: כָּל הַיָּמִים
  choice: సదాకాలం
  rationale: అక్షరార్థం ‘అన్ని దినాలు’; ‘సదాకాలం’ తెలుగులో సహజంగా నిరంతరత్వాన్ని తెలుపుతూ ఉన్నతమైన బైబిలు శైలిని నిలుపుతుంది.
theological_decisions:
- issue: దేవుని గురించి ‘నా కన్నులు, నా హృదయం’ అనే మానవరూపక భాష
  choice: ‘నా కన్నులూ నా హృదయమూ’ అనే చిత్రణను నిలుపడం
  alternative: ‘నా దృష్టీ నా శ్రద్ధా’ అని భావానువాదం చేయడం
  rationale: మూలంలోని శరీర సంబంధ చిత్రణ దేవుని అప్రమత్తమైన శ్రద్ధను, నిబంధనాత్మక నిబద్ధతను వ్యక్తం చేస్తుంది; దానిని తొలగించడం వచనపు వేదాంత సాంద్రతను తగ్గిస్తుంది.
- issue: ‘నా నామం అక్కడ ఉండడం’ అనే మందిర వేదాంతం
  choice: ‘నా నామం అక్కడ ... ఉండేలా’ అని ఉంచడం
  alternative: ‘నేను అక్కడ ఉంటాను’ లేదా ‘నా సన్నిధి అక్కడ ఉంటుంది’
  rationale: ‘నామం’ అనే పదం దేవుని స్వీయప్రకటనను, నిబంధనాత్మక సన్నిధిని సూచించినా, మూలం చెప్పినదానికంటే ఎక్కువగా దాన్ని విశదీకరించకూడదు.
- issue: עַד עוֹלָם మరియు כָּל הַיָּמִים మధ్య కాలవ్యక్తీకరణ
  choice: మొదటిదాన్ని ‘ఎప్పటికీ’, రెండవదాన్ని ‘సదాకాలం’గా వేరు చేయడం
  alternative: రెండింటినీ ఒకే తెలుగు పదంతో అనువదించడం
  rationale: రెండు పదబంధాలూ నిరంతరత్వాన్ని సూచిస్తాయి, కానీ మూలంలోని భిన్న వ్యక్తీకరణను తెలుగు శైలికి అనుగుణంగా స్వల్పంగా ప్రతిబింబించడం మంచిది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే దైవిక ప్రసంగానికి తగిన గంభీరతతో. ‘నామం,’ ‘కన్నులు,’ ‘హృదయం’ అనే మూల చిత్రణలు వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపబడ్డాయి.
