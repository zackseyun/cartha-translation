source:
  edition: WLC
  text: וְ/הַ/כֹּהֲנִ֞ים עַל מִשְׁמְרוֹתָ֣/ם עֹמְדִ֗ים וְ/הַ/לְוִיִּ֞ם בִּ/כְלֵי שִׁ֤יר יְהוָה֙ אֲשֶׁ֨ר עָשָׂ֜ה דָּוִ֣יד הַ/מֶּ֗לֶךְ לְ/הֹד֤וֹת לַ/יהוָה֙ כִּֽי לְ/עוֹלָ֣ם חַסְדּ֔/וֹ בְּ/הַלֵּ֥ל דָּוִ֖יד בְּ/יָדָ֑/ם וְ/הַ/כֹּהֲנִים֙ מחצצרים נֶגְדָּ֔/ם וְ/כָל יִשְׂרָאֵ֖ל עֹמְדִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/006.yaml
  text: And the priests were standing at their posts[a], and the Levites with the instruments for the song of Yahweh, which David the king had made to give thanks to Yahweh, for his steadfast love endures forever, when David offered praise by their hand; and the priests were blowing trumpets opposite them[c][b], while all Israel was standing.
translation:
  language: te
  text: యాజకులు తమ నియమిత స్థానాల్లో నిలబడి ఉన్నారు; లేవీయులు రాజైన దావీదు యాహ్వేకు కృతజ్ఞతలు చెల్లించడానికి చేసిన యాహ్వే గీత వాద్యాలతో[a] నిలబడి ఉన్నారు—“ఎందుకంటే ఆయన స్థిరమైన ప్రేమ శాశ్వతంగా నిలిచి ఉంటుంది”[b] అని దావీదు వారి ద్వారా స్తుతి అర్పించినప్పుడు[c]. యాజకులు వారికి ఎదురుగా బూరలు ఊదుతున్నారు; ఇశ్రాయేలీయులందరూ నిలబడి ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వేకు చెందిన సంగీత వాద్యాలతో.” హీబ్రూ పదబంధం యాహ్వేకు అంకితమైన వాద్యాలను గానీ, యాహ్వే గీతానికి ఉపయోగించిన వాద్యాలను గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఎందుకంటే ఆయన స్థిరమైన ప్రేమ శాశ్వతం.” తెలుగులో భావం సహజంగా ఉండేందుకు “నిలిచి ఉంటుంది” అని చేర్చబడింది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “దావీదు వారి చేత స్తుతించినప్పుడు.” హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా ఉంది; లేవీయులు దావీదు స్తుతిని అతని ప్రతినిధులుగా వినిపించారని ఇది సూచించే అవకాశం ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: מִשְׁמְרוֹתָם
  choice: తమ తమ నియమిత స్థానాల్లో
  rationale: ఈ పదం క్రమబద్ధంగా కేటాయించిన సేవాస్థానాలు లేదా పహారా వంతులను సూచిస్తుంది. ఆలయ సేవ సందర్భంలో ‘నియమిత స్థానాలు’ అనే పదబంధం స్థానం, బాధ్యత రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: בִּכְלֵי שִׁיר יְהוָה
  choice: యాహ్వే గీతానికి ఉపయోగించే వాద్యాలతో
  rationale: כְּלֵי అంటే పరికరాలు/వాద్యాలు, שִׁיר అంటే గీతం లేదా సంగీతం. ఈ అనువాదం వాద్యాలకు యాహ్వే గీతంతో ఉన్న సంబంధాన్ని నిలుపుతూ, ఆ సంబంధంలోని స్వల్ప అస్పష్టతను పాదసూచికలో తెలియజేస్తుంది.
- source_word: לְהוֹדוֹת לַיהוָה
  choice: యాహ్వేకు కృతజ్ఞతలు చెల్లించడానికి
  rationale: ידה హిఫిల్ రూపం కృతజ్ఞతలు చెల్లించడం లేదా స్తుతించడం అనే అర్థాలను ఇస్తుంది. వెంటనే వచ్చే కృతజ్ఞతా సూత్రవాక్యం కారణంగా ఇక్కడ ‘కృతజ్ఞతలు చెల్లించడం’ సముచితం.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: ఎందుకంటే ఆయన స్థిరమైన ప్రేమ శాశ్వతంగా నిలిచి ఉంటుంది
  rationale: חֶסֶד లో ప్రేమ, దయ, విశ్వసనీయ నిబద్ధత అనే భావాలు ఉన్నాయి. ‘స్థిరమైన ప్రేమ’ ఈ విస్తృత భావాన్ని ఒకే సిద్ధాంతపరమైన అర్థానికి కుదించదు; ‘నిలిచి ఉంటుంది’ తెలుగులో వాక్యాన్ని సహజంగా పూర్తిచేస్తుంది.
- source_word: בְּהַלֵּל דָּוִיד בְּיָדָם
  choice: దావీదు వారి ద్వారా స్తుతి అర్పిస్తున్నప్పుడు
  rationale: హీబ్రూ నిర్మాణం సంక్షిప్తంగా ఉండి, దావీదు స్తుతి లేవీయుల ద్వారా వినిపించబడిందనే సాధనార్థక భావాన్ని సూచిస్తుంది. ‘వారి ద్వారా’ ఆ భావాన్ని సహజ తెలుగులో ఉంచుతుంది.
- source_word: מחצצרים
  choice: బూరలు ఊదుతున్నారు
  rationale: ఈ క్రియ ప్రత్యేకంగా బూరలు లేదా తూర్యాలు మోగించడాన్ని సూచిస్తుంది. ‘బూరలు ఊదడం’ సాధారణ పాఠకులకు స్పష్టమైన, సహజమైన తెలుగు.
- source_word: נֶגְדָּם
  choice: వారికి ఎదురుగా
  rationale: ఈ అవ్యయం ఎదుట లేదా ఎదురుగా ఉన్న స్థల సంబంధాన్ని సూచిస్తుంది; అదనపు ఆచారార్థాన్ని చేర్చకుండా మూల భావాన్ని నిలుపుతుంది.
- source_word: עֹמְדִים
  choice: నిలబడి ఉన్నారు
  rationale: హీబ్రూ కృదంతం కొనసాగుతున్న దృశ్యాన్ని చిత్రిస్తుంది. తెలుగు కొనసాగింపు రూపం ఆ దృశ్యాత్మక భావాన్ని ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో నాలుగు అక్షరాల దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో మూల ఉచ్చారణకు దగ్గరైన ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: חֶסֶד యొక్క భావవ్యాప్తి
  choice: స్థిరమైన ప్రేమ
  alternative: కృప; దయ; నిబంధన విశ్వసనీయత
  rationale: ఈ పదంలో ప్రేమ, దయ, నిలకడైన విశ్వసనీయత కలిసి ఉన్నాయి. ఒకే సిద్ధాంతపరమైన వివరణను బలవంతంగా రుద్దకుండా విస్తృత భావాన్ని కాపాడే ఎంపిక ఇది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన ఆరాధనా శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని దీర్ఘ నిర్మాణాన్ని స్పష్టత కోసం రెండు ప్రధాన వాక్యాలుగా విభజించాం; అయితే కొనసాగుతున్న వేడుక దృశ్యాన్ని కృదంతసదృశ రూపాలతో నిలిపాం. ‘బూరలు’ వంటి సాధారణ పదాన్ని ఎంచుకుని, అతిగా ప్రాచీనమైన లేదా సంఘశాఖకు ప్రత్యేకమైన పదజాలాన్ని నివారించాం.
