id: 2CH.7.14
reference: 2 Chronicles 7:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יִכָּנְע֨וּ עַמִּ֜/י אֲשֶׁ֧ר נִֽקְרָא שְׁמִ֣/י עֲלֵי/הֶ֗ם וְ/יִֽתְפַּֽלְלוּ֙ וִֽ/יבַקְשׁ֣וּ פָנַ֔/י וְ/יָשֻׁ֖בוּ מִ/דַּרְכֵי/הֶ֣ם הָ/רָעִ֑ים וַ/אֲנִי֙ אֶשְׁמַ֣ע מִן הַ/שָּׁמַ֔יִם וְ/אֶסְלַח֙ לְ/חַטָּאתָ֔/ם וְ/אֶרְפָּ֖א אֶת אַרְצָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/014.yaml
  text: if my people[a], who are called by my name, humble themselves, and pray and seek my face, and turn from their evil ways, then I will hear from heaven, and I will forgive their sin and heal their land.
translation:
  language: te
  text: నా పేరుతో పిలువబడే నా ప్రజలు[a] తమను తాము వినయపరచుకొని, ప్రార్థించి, నా ముఖాన్ని వెదకి, తమ చెడు మార్గాలనుండి తిరిగితే, అప్పుడు నేను ఆకాశమునుండి విని, వారి పాపాన్ని క్షమించి, వారి భూమిని స్వస్థపరుస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వారిపై నా పేరు పిలువబడిన.” ఇది దేవునికి చెందినవారిగా ఉండడం లేదా ఆయన పేరును ధరించడం సూచించే హెబ్రీయ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִכָּנְעוּ
  choice: తమను తాము తగ్గించుకొని
  rationale: נכנע అనే నిఫ్అల్ రూపం ఇక్కడ స్వచ్ఛందంగా తమను తగ్గించుకోవడం లేదా అణకువ చూపడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా, కర్తల స్వీయ స్పందనను స్పష్టంగా నిలుపుతుంది.
- source_word: עַמִּי
  choice: నా ప్రజలు
  rationale: దేవునితో నిబంధన సంబంధంలో ఉన్న సమూహాన్ని సూచించే సరళమైన సమూహవాచక ప్రయోగం.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עֲלֵיהֶם
  choice: నా పేరు పెట్టబడిన
  rationale: అక్షరార్థంగా ‘నా పేరు వారిమీద పిలువబడిన’ అనే హెబ్రీయ నుడికారం దేవునికి చెందినవారిగా గుర్తించబడటాన్ని సూచిస్తుంది. ‘నా పేరు పెట్టబడిన’ అనేది మూలంలోని పేరు-రూపకాన్ని నిలుపుతూ తెలుగులో అర్థమయ్యే రూపం.
- source_word: וְיִתְפַּלְלוּ
  choice: ప్రార్థించి
  rationale: פלל హిత్పఅేల్ రూపానికి సాధారణ అర్థం ‘ప్రార్థించు’. ఎవరికి ప్రార్థిస్తారో సందర్భంలో స్పష్టంగా ఉన్నందున అదనపు కర్మను చేర్చలేదు.
- source_word: וִיבַקְשׁוּ פָנַי
  choice: నా ముఖాన్ని వెదకి
  rationale: దేవుని సన్నిధిని లేదా అనుగ్రహాన్ని కోరడాన్ని తెలిపే ‘నా ముఖాన్ని వెదకడం’ అనే మూల రూపకాన్ని వ్యాఖ్యానాత్మకంగా సరళీకరించకుండా నిలిపింది.
- source_word: וְיָשֻׁבוּ מִדַּרְכֵיהֶם הָרָעִים
  choice: తమ చెడు మార్గాలను విడిచిపెడితే
  rationale: שׁוב ఇక్కడ నైతికంగా వెనుదిరగడం అనే భావాన్ని ఇస్తుంది. ‘విడిచిపెట్టు’ తెలుగులో చెడు ప్రవర్తన నుంచి మళ్లడాన్ని సహజంగా వ్యక్తపరుస్తుంది; ‘మార్గాలు’ అనే రూపకం నిలిచింది.
- source_word: וַאֲנִי אֶשְׁמַע מִן הַשָּׁמַיִם
  choice: అప్పుడు నేను పరలోకం నుండి విని
  rationale: షరతుల వరుసకు వచ్చే ఫలితాన్ని తెలుగులో స్పష్టంచేయడానికి ‘అప్పుడు’ వాడబడింది. מן הַשָּׁמַיִם ను ‘పరలోకం నుండి’గా అనువదించడం మూలంలోని దిశ/స్థాన భావాన్ని నిలుపుతుంది.
- source_word: וְאֶסְלַח לְחַטָּאתָם
  choice: వారి పాపాన్ని క్షమించి
  rationale: హెబ్రీలోని ఏకవచన సమూహార్థక ‘పాపం’ను తెలుగులోనూ ఏకవచనంగా నిలిపింది.
- source_word: וְאֶרְפָּא אֶת אַרְצָם
  choice: వారి దేశాన్ని స్వస్థపరుస్తాను
  rationale: רפא యొక్క ‘స్వస్థపరచు’ అనే రూపకార్థాన్ని నిలిపి, దానిని కేవలం ‘పునరుద్ధరించు’గా వివరణాత్మకంగా మార్చలేదు. אֶרֶץ ఇక్కడ ప్రజలకు చెందిన భూభాగాన్ని సూచించేందున ‘దేశం’ సహజమైన ఎంపిక.
theological_decisions:
- issue: దైవిక ప్రతిస్పందనలో షరతు–ఫలిత నిర్మాణం
  choice: ప్రజల చర్యలను ‘...విడిచిపెడితే’ అనే షరతుగా, దేవుని ప్రతిస్పందనను ‘అప్పుడు’తో ప్రారంభమయ్యే ఫలితంగా అనువదించడం.
  alternative: అన్ని ఉపవాక్యాలను వరుసగా ‘మరియు’తో మాత్రమే కలపడం.
  rationale: హెబ్రీలో వరుసగా వావ్ సంధులు ఉన్నప్పటికీ, సందర్భంలోని వాక్యనిర్మాణం షరతు–ఫలిత సంబంధాన్ని సూచిస్తుంది. తెలుగు పాఠకునికి దీనిని స్పష్టంగా, సహజంగా తెలియజేయడానికి ‘అయితే/అప్పుడు’ నిర్మాణం అవసరం.
- issue: దైవనామానికి సంబంధించిన నిబంధనాత్మక నుడికారం
  choice: ‘నా పేరు పెట్టబడిన నా ప్రజలు’ అని అనువదించడం.
  alternative: ‘నా పేరు వారిమీద పిలువబడిన నా ప్రజలు’ అనే మరింత అక్షరార్థ రూపం.
  rationale: ఈ నుడికారం కేవలం పేరును ఉచ్చరించడాన్ని కాక, దేవునికి చెందినవారిగా గుర్తింపు పొందడాన్ని సూచిస్తుంది. ప్రధాన పాఠం సహజంగా ఉండేలా చేసి, అక్షరార్థాన్ని పాదసూచికలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘నా ముఖాన్ని వెదకి,’ ‘దేశాన్ని స్వస్థపరుస్తాను’ వంటి మూల రూపకాలను నిలిపి, షరతు–ఫలిత వాక్యనిర్మాణాన్ని తెలుగులో సహజంగా తీర్చిదిద్దింది.
