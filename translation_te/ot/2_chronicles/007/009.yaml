translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని రెండు ఏడు రోజుల కాలవ్యవధులను విడివిడిగా నిలిపి, ఎనిమిదవ రోజుకు ‘పండుగ యొక్క’ వంటి మూలంలో లేని పదాలను చేర్చలేదు.
