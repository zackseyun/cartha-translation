source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֛וּ בַּ/יּ֥וֹם הַ/שְּׁמִינִ֖י עֲצָ֑רֶת כִּ֣י חֲנֻכַּ֣ת הַ/מִּזְבֵּ֗חַ עָשׂוּ֙ שִׁבְעַ֣ת יָמִ֔ים וְ/הֶ/חָ֖ג שִׁבְעַ֥ת יָמִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/009.yaml
  text: On the eighth day they held a solemn assembly[b][a], for they observed the dedication of the altar for seven days and the feast for seven days.
translation:
  language: te
  text: ఎనిమిదవ రోజున వారు గంభీరమైన ముగింపు సభను నిర్వహించారు[a], ఎందుకంటే వారు బలిపీఠ ప్రతిష్ఠను ఏడు రోజులపాటు, పండుగను ఏడు రోజులపాటు జరిపారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సభ’ లేదా ‘ముగింపు సభ.’ హీబ్రూ పదం עֲצָרֶת పండుగ సందర్భంలో జరిగే ప్రత్యేకమైన, ముగింపు సమావేశాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘జరిపారు’కు అక్షరార్థంగా ‘చేశారు’; సందర్భానుసారంగా ‘నిర్వహించారు’ లేదా ‘ఆచరించారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָרֶת
  choice: పవిత్ర సమాప్త సభ
  rationale: పండుగ సందర్భంలో జరిగే ప్రత్యేక ముగింపు సమావేశాన్ని సూచించే పదం. ‘సమాప్త సభ’ దాని ముగింపు స్వభావాన్ని, ‘పవిత్ర’ దాని ఆరాధనా సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తాయి.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఎనిమిదవ రోజు సభకు కారణాన్ని వివరించే సంధానార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: బలిపీఠ ప్రతిష్ఠ
  rationale: బలిపీఠాన్ని ఆరాధనా వినియోగానికి అంకితం చేసే ప్రారంభ క్రియను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָשׂוּ
  choice: జరిపారు
  rationale: మూల క్రియ అక్షరార్థంగా ‘చేశారు’; ఇక్కడ ప్రతిష్ఠాచరణను, పండుగను నిర్వహించడం లేదా ఆచరించడం అనే సందర్భార్థాన్ని ‘జరిపారు’ సహజంగా అందిస్తుంది.
- source_word: וְהֶחָג
  choice: పండుగను
  rationale: నిర్దిష్టమైన పండుగను సూచించే హీబ్రూ పదబంధాన్ని సందర్భానికి మించి దాని పేరును చేర్చకుండా అనువదిస్తుంది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: కాలవ్యవధిని ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: ఎనిమిదవ రోజున
  rationale: మూలంలోని కాలసూచనను అదనపు సందర్భ సమాచారాన్ని చేర్చకుండా నేరుగా అందిస్తుంది.
