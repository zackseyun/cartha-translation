source:
  edition: WLC
  text: וְ/לֹ֤א יָֽכְלוּ֙ הַ/כֹּ֣הֲנִ֔ים לָ/ב֖וֹא אֶל בֵּ֣ית יְהוָ֑ה כִּֽי מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/002.yaml
  text: And the priests were not able to enter the house of Yahweh[a], because the glory of Yahweh filled the house of Yahweh.
translation:
  language: te
  text: యాజకులు యాహ్వే[a] మందిరంలోకి ప్రవేశించలేకపోయారు; ఎందుకంటే యాహ్వే మహిమ యాహ్వే మందిరాన్ని నింపింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: ‘యాహ్వే ఇల్లు’; అంటే మందిరం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָכְלוּ
  choice: ప్రవేశించలేకపోయారు
  rationale: וְ narrative sequenceను కొనసాగిస్తుంది; לא + יכל అసమర్థతను తెలియజేస్తాయి. తెలుగులో సహజంగా క్రియతో కలిపి ‘లేకపోయారు’ అని అనువదించబడింది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: ఆలయ సందర్భంలో כהניםకు ప్రామాణికమైన, సాధారణ ఆధునిక తెలుగు పదం.
- source_word: לָבוֹא אֶל
  choice: మందిరంలోకి ప్రవేశించ
  rationale: בוא + אל ఇక్కడ ఒక స్థలంలోకి వెళ్లడాన్ని సూచిస్తుంది; ‘ప్రవేశించు’ సంక్షిప్తంగా, గౌరవప్రదంగా ఉంది.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: బֵּית అక్షరార్థంగా ‘ఇల్లు’; అయితే ఈ సందర్భంలో దేవాలయాన్ని సూచిస్తుంది. ప్రధాన వాక్యంలో సహజమైన తెలుగుకోసం ‘మందిరం’ వాడి, అక్షరార్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరంగా వినియోగంలో ఉన్న ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: యాజకులు ప్రవేశించలేకపోవడానికి కారణాన్ని స్పష్టంగా పరిచయం చేసే ఆధునిక తెలుగు కారణసూచక పదం.
- source_word: מָלֵא
  choice: నింపింది
  rationale: క్రియను సాధారణ భూతకాలంలో ఉంచి, యెహోవా మహిమ మందిరాన్ని నింపినదని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כְבוֹד יְהוָה
  choice: యెహోవా మహిమ
  rationale: హీబ్రూ construct సంబంధాన్ని సహజమైన తెలుగు షష్ఠీ భావంతో తెలియజేస్తుంది.
- source_word: אֶת בֵּית יְהוָה
  choice: యెహోవా మందిరాన్ని
  rationale: מלא క్రియ యొక్క ప్రత్యక్ష కర్మగా అనువదించబడింది; మూలంలోని పునరుక్తిని అలాగే నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా నిలిపాం; ఆధునిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: בֵּית יְהוָה యొక్క రూపాంతరం
  choice: యెహోవా మందిరం
  alternative: యెహోవా ఇల్లు
  rationale: అక్షరార్థం ‘యెహోవా ఇల్లు’ అయినప్పటికీ సందర్భార్థం దేవాలయం. సాధారణ పాఠకుడికి అపార్థం రాకుండా ప్రధాన వాక్యంలో ‘మందిరం’ వాడి, మూలంలోని రూపకాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని కారణ సంబంధాన్ని, ‘యెహోవా మందిరం’ అనే పునరుక్తిని నిలిపాం; యాజకులు ఎందుకు లేదా ఏ విధంగా అడ్డుకోబడ్డారో మూలం చెప్పనందున అదనపు వివరణ చేర్చలేదు.
