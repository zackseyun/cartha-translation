source:
  edition: WLC
  text: וְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל רֹאִים֙ בְּ/רֶ֣דֶת הָ/אֵ֔שׁ וּ/כְב֥וֹד יְהוָ֖ה עַל הַ/בָּ֑יִת וַ/יִּכְרְעוּ֩ אַפַּ֨יִם אַ֤רְצָ/ה עַל הָ/רִֽצְפָה֙ וַ/יִּֽשְׁתַּֽחֲו֔וּ וְ/הוֹד֤וֹת לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/003.yaml
  text: 'And all the sons of Israel[a], seeing the fire come down and the glory of Yahweh upon the house, bowed down with their faces to the ground on the pavement, and they worshiped and gave thanks to Yahweh: “For he is good[c][b], for his steadfast love endures forever.”'
translation:
  language: te
  text: 'ఇశ్రాయేలీయులందరూ[a] అగ్ని దిగడాన్ని, మందిరం[b] మీద ఉన్న యాహ్వే మహిమను చూసి, రాళ్లు పరచిన నేలపై ముఖాలు నేలకు ఆనించి మోకరిల్లారు. వారు ఆరాధించి యాహ్వేకు కృతజ్ఞతలు చెల్లించారు: “ఎందుకంటే ఆయన మంచివాడు; ఆయన అచంచల ప్రేమ[c] శాశ్వతంగా నిలిచి ఉంటుంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులందరూ’; ఇది ఇశ్రాయేలు ప్రజలందరినీ సూచించే సాధారణ సామూహిక ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘మందిరం’ అని అనువదించిన హీబ్రూ పదానికి అక్షరార్థం ‘ఇల్లు’; ఈ సందర్భంలో అది యాహ్వే ఆలయాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: ‘అచంచల ప్రేమ’ అని అనువదించిన హీబ్రూ పదం חֶסֶד; దీనిని సందర్భానుసారం ‘కనికరం’, ‘నిలకడైన ప్రేమ’ లేదా ‘నిబంధన విశ్వసనీయత’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరూ
  rationale: ‘ఇశ్రాయేలు కుమారులందరూ’ అనేది హీబ్రూలో జాతి మొత్తాన్ని సూచించే సామూహిక ప్రయోగం. తెలుగులో లింగపరంగా అనవసరంగా పరిమితం చేయకుండా దాని సహజ అర్థాన్ని అందిస్తుంది.
- source_word: רֹאִים בְּרֶדֶת הָאֵשׁ
  choice: అగ్ని దిగిరావడాన్ని ... చూశారు
  rationale: అగ్ని దిగుతున్న సమయంలో వారు దానిని ప్రత్యక్షంగా చూశారనే సమకాలీన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וּכְבוֹד יְהוָה עַל הַבָּיִת
  choice: యాహ్వే మహిమ మందిరం మీదికి రావడాన్ని
  rationale: כָּבוֹד దేవుని ప్రత్యక్ష మహిమను సూచిస్తుంది. సందర్భంలో הַבַּיִת ఆలయాన్ని సూచిస్తుంది; עַל‌తో కూడిన దృశ్యాన్ని ‘మీదికి రావడం’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיִּכְרְעוּ אַפַּיִם אַרְצָה עַל הָרִצְפָה
  choice: రాతిపరచిన నేలపై ముఖాలు నేలకు ఆనించి వంగి
  rationale: వారు ముఖం కిందికి పెట్టి పూర్తిగా వంగిన శారీరక భంగిమను తెలియజేస్తుంది. ‘సాష్టాంగం’ వంటి స్థానిక మతసంబంధ సాంకేతిక పదాన్ని ఉపయోగించకుండా మూల దృశ్యాన్ని కాపాడుతుంది.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: ఆరాధిస్తూ
  rationale: ముందే శరీర భంగిమ వివరించబడినందున, ఈ క్రియలోని భక్తి మరియు ఆరాధన భావాన్ని పునరుక్తి లేకుండా తెలియజేస్తుంది.
- source_word: וְהוֹדוֹת לַיהוָה
  choice: యాహ్వేకు కృతజ్ఞతలు చెల్లించారు
  rationale: ఈ ఆరాధనా ప్రకటన సందర్భంలో ידה కృతజ్ఞతలు చెప్పడం లేదా స్తుతించడం అనే భావం కలిగి ఉంది; ఇక్కడ ‘కృతజ్ఞతలు చెల్లించారు’ ఉత్తమంగా సరిపోతుంది.
- source_word: כִּי טוֹב
  choice: ఆయన మంచివాడు
  rationale: దేవుని మంచితనాన్ని ప్రకటించే ప్రామాణిక ఆరాధనా వాక్యాన్ని సరళంగా, నేరుగా అందిస్తుంది.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: ఆయన అచంచల ప్రేమ శాశ్వతంగా నిలిచి ఉంటుంది
  rationale: חֶסֶד‌లోని ప్రేమ, విశ్వసనీయత, నిబంధనపట్ల నిబద్ధత అనే విస్తృత భావాలను ‘అచంచల ప్రేమ’ సహజంగా సూచిస్తుంది; ‘నిలిచి ఉంటుంది’ అనేది హీబ్రూలో అంతర్లీనంగా ఉన్న కొనసాగింపు భావాన్ని తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: యెహోవా అనే దైవనామం יְהוָה యొక్క అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న దేవుని ప్రత్యేక నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితపరమైన ఉచ్చారణను తెలుగులో అందిస్తుంది.
- issue: חַסְדּוֹ అనే పదంలోని నిబంధనాత్మక భావం
  choice: ఆయన అచంచల ప్రేమ
  alternative: ఆయన కృప / ఆయన కనికరం / ఆయన నిబంధన విశ్వసనీయత
  rationale: ఈ పదాన్ని కేవలం కనికరానికి లేదా భావోద్వేగ ప్రేమకు పరిమితం చేయకుండా, నిలకడైన ప్రేమ మరియు విశ్వసనీయత రెండింటినీ కాపాడుతుంది. ఇతర భావ ఛాయలను పాదటిప్పణి తెలియజేస్తుంది.
- issue: ఆలయంపై మహిమ స్థానం లేదా కదలిక
  choice: మందిరం మీదికి రావడాన్ని
  alternative: మందిరం మీద ఉండడాన్ని
  rationale: రֹאִים‌కు బְּרֶדֶת ‘అగ్ని దిగిరావడం’ ప్రత్యక్ష కర్మగా ఉంది; ‘మహిమ’ కూడా వారు చూసిన దృశ్యంలో భాగం. ‘మీదికి రావడం’ సందర్భంలోని దివ్య అవతరణను సహజంగా అనుసంధానిస్తుంది, అయితే హీబ్రూ עַל స్వయంగా స్థానం ‘మీద’ అని మాత్రమే చెప్పగలదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన ఆరాధనా శైలి పాటించబడింది. ‘రాతిపరచిన నేల’, ‘ముఖాలు నేలకు ఆనించి’ వంటి స్పష్టమైన పదబంధాలతో పురాతన ఆలయ ప్రాంగణ దృశ్యాన్ని సహజంగా చూపించబడింది.
