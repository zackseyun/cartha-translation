revisions:
- from: ఆ సమయంలో సొలొమోను ఏడు రోజులపాటు పండుగను ఆచరించాడు. అతనితోపాటు ఇశ్రాయేలీయులందరూ—లెబో-హమాతు[a] మొదలుకొని ఐగుప్తు వాగు[b] వరకు వచ్చిన అతి పెద్ద సమాజం—ఆ పండుగను ఆచరించారు.
  to: ఆ సమయంలో సొలొమోను ఏడు రోజులపాటు పండుగను ఆచరించాడు; అతనితోపాటు లెబో-హమాతు[a] నుండి ఐగుప్తు వాగు[b] వరకు ఉన్న ఇశ్రాయేలు అంతా, ఎంతో పెద్ద సమాజం, ఉంది.
