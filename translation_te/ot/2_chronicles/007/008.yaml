translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. హీబ్రూలో ‘సొలొమోను పండుగను ఆచరించాడు, ఇశ్రాయేలంతా అతనితో ఉన్నారు’ అనే సంక్షిప్త సమన్వయ నిర్మాణం తెలుగులో అసంపూర్ణంగా వినిపించకుండా రెండవ క్రియను పునరుక్తం చేశాం. భౌగోళిక పదాలలోని నిజమైన సందిగ్ధతలను పాదసూచికల్లో నిలిపాం.
