id: 2CH.7.8
reference: 2 Chronicles 7:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֣ה אֶת הֶ֠/חָג בָּ/עֵ֨ת הַ/הִ֜יא שִׁבְעַ֤ת יָמִים֙ וְ/כָל יִשְׂרָאֵ֣ל עִמּ֔/וֹ קָהָ֖ל גָּד֣וֹל מְאֹ֑ד מִ/לְּב֥וֹא חֲמָ֖ת עַד נַ֥חַל מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/008.yaml
  text: At that time Solomon kept the feast for seven days[a], and all Israel with him, a very great assembly[b], from Lebo-hamath to the Brook of Egypt.
translation:
  language: te
  text: ఆ సమయంలో సొలొమోను ఏడు రోజులపాటు పండుగను ఆచరించాడు; అతనితోపాటు లెబో-హమాతు[a] నుండి ఐగుప్తు వాగు[b] వరకు ఉన్న ఇశ్రాయేలు అంతా, ఎంతో పెద్ద సమాజం, ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హమాతు ప్రవేశమార్గం.’ హీబ్రూ పదబంధాన్ని ‘లెబో-హమాతు’ అనే స్థలనామంగా గానీ, హమాతుకు వెళ్లే ప్రవేశప్రాంతాన్ని సూచించే సరిహద్దు పదబంధంగా గానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘ఐగుప్తు వాడి.’ హీబ్రూ పదం పెద్ద నదిని కాకుండా కాలానుగుణంగా నీరు ప్రవహించే వాగు లేదా ప్రవాహపాత్రను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... אֶת הֶחָג
  choice: పండుగను ఆచరించాడు / ఆచరించారు
  rationale: ‘చేశాడు’ అనే అక్షరార్థం కన్నా, חָגతో కలిసినప్పుడు పండుగను జరపడం లేదా ఆచరించడం అనే సందర్భోచిత భావం వస్తుంది. ‘ఆచరించాడు’ గౌరవప్రదంగా, సహజంగా ఉంది.
- source_word: בָּעֵת הַהִיא
  choice: ఆ సమయంలో
  rationale: హీబ్రూ కాలసూచక పదబంధానికి సరళమైన ఆధునిక తెలుగు సమానం.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: కాలవ్యవధిని తెలుగులో సహజంగా స్పష్టం చేస్తుంది.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: అతనితోపాటు ఇశ్రాయేలీయులందరూ
  rationale: సమస్త ఇశ్రాయేలు ప్రజల సమూహార్థాన్నీ, సొలొమోనుతో వారి సహభాగితనూ నిలుపుతుంది.
- source_word: קָהָל גָּדוֹל מְאֹד
  choice: అతి పెద్ద సమాజం
  rationale: קָהָל ఇక్కడ కూడివచ్చిన ప్రజాసమూహాన్ని సూచిస్తుంది; ‘సమాజం’ అనవసరమైన సంఘపరమైన ప్రత్యేకార్థాన్ని రుద్దకుండా సందర్భానికి సరిపోతుంది.
- source_word: מִלְּבוֹא חֲמָת
  choice: లెబో-హమాతు
  rationale: ఇది స్థలనామం లేదా స్థిరమైన భౌగోళిక సరిహద్దు సూచనగా గ్రహించవచ్చు. ప్రధాన పాఠ్యంలో స్థలనామ రూపాన్ని నిలిపి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: עַד נַחַל מִצְרָיִם
  choice: ఐగుప్తు వాగు
  rationale: נַחַל సాధారణంగా పెద్ద నది కన్నా వాగు, కాలానుగుణ జలమార్గం లేదా ప్రవాహపాత్రను సూచిస్తుంది; ‘వాగు’ సాధారణ తెలుగు పాఠకుడికి సహజం.
