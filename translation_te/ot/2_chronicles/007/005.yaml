revisions:
- from: సొలొమోను రాజు ఇరవై రెండు వేల పశువులను, లక్షా ఇరవై వేల గొర్రెలను[a] బలిగా అర్పించాడు. రాజు, ప్రజలందరూ దేవుని మందిరాన్ని ప్రతిష్ఠించారు.
  to: రాజైన సొలొమోను ఇరవై రెండు వేల పశువులను, లక్షా ఇరవై వేల గొర్రెలను[a] బలిగా అర్పించాడు; మరియు రాజు, ప్రజలందరూ దేవుని మందిరాన్ని అంకితం చేశారు.
  rationale: The revision preserves the Hebrew narrative coordination, uses a more idiomatic Telugu introduction for Solomon's royal title, and renders חנך as formal dedication rather than possible installation. The revised footnote accurately retains the broader collective sense of צֹאן.
