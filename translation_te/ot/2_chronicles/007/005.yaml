  edition: WLC
  text: וַ/יִּזְבַּ֞ח הַ/מֶּ֣לֶךְ שְׁלֹמֹה֮ אֶת זֶ֣בַח הַ/בָּקָ֗ר עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ אֶ֔לֶף וְ/צֹ֕אן מֵאָ֥ה וְ/עֶשְׂרִ֖ים אָ֑לֶף וַֽ/יַּחְנְכוּ֙ אֶת בֵּ֣ית הָֽ/אֱלֹהִ֔ים הַ/מֶּ֖לֶךְ וְ/כָל הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/005.yaml
  text: And King Solomon sacrificed twenty-two thousand cattle and one hundred twenty thousand sheep[a], and the king and all the people dedicated the house of God.
translation:
  language: te
  text: రాజైన సొలొమోను ఇరవై రెండు వేల పశువులను, లక్షా ఇరవై వేల గొర్రెలను[a] బలిగా అర్పించాడు; మరియు రాజు, ప్రజలందరూ దేవుని మందిరాన్ని అంకితం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చిన్న పశువులు’; హీబ్రూ పదం గొర్రెలు, మేకలతో సహా చిన్న పశువులను సమష్టిగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: బలిగా అర్పించాడు
  rationale: זבח బలిసంబంధ సందర్భంలో జంతువును వధించి బలిగా అర్పించడాన్ని సూచిస్తుంది. ‘బలిగా అర్పించాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ ఆరాధనా భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: זֶבַח הַבָּקָר
  choice: పశువులను
  rationale: בקר మందలోని పెద్ద పశువులను, ముఖ్యంగా గోవర్గ పశువులను సూచిస్తుంది. భారీ సంఖ్యతో కూడిన ఈ సందర్భంలో ‘పశువులు’ సహజమైన సమూహపదం.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף
  choice: ఇరవై రెండు వేల
  rationale: హీబ్రూ సంఖ్యకు ప్రామాణిక ఆధునిక తెలుగు రూపం.
- source_word: וְצֹאן
  choice: గొర్రెలను
  rationale: צאן సాధారణంగా మందలోని చిన్న పశువులను సమష్టిగా సూచించి గొర్రెలతో పాటు మేకలనూ కలిగి ఉండవచ్చు. ప్రధాన వచనంలో సహజమైన ‘గొర్రెలు’ వాడి, విస్తృత అర్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: מֵאָה וְעֶשְׂרִים אָלֶף
  choice: లక్షా ఇరవై వేల
  rationale: 120,000కు సహజమైన ఆధునిక తెలుగు సంఖ్యారూపం.
- source_word: וַיַּחְנְכוּ
  choice: ప్రతిష్ఠించారు
  rationale: חנך ఇక్కడ దేవాలయాన్ని అధికారికంగా అంకితం చేసి ఆరంభించడాన్ని సూచిస్తుంది. ‘ప్రతిష్ఠించారు’ తెలుగు ఆరాధనా సందర్భంలో సహజంగా ఈ భావాన్ని తెలియజేస్తుంది.
- source_word: בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరాన్ని
  rationale: అక్షరార్థం ‘దేవుని ఇల్లు’; సందర్భంలో అది ఆలయాన్ని సూచిస్తుంది. ‘దేవుని మందిరం’ ఆధునిక పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: הַמֶּלֶךְ וְכָל הָעָם
  choice: రాజు, ప్రజలందరూ
  rationale: సొలొమోను ఇప్పటికే పేరుతో పేర్కొనబడిన తరువాత మూలం మళ్లీ ‘రాజు’ అని అంటుంది; ఈ సంభాషణ క్రమాన్ని అనువాదంలో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని రెండు సమన్వయ క్రియలను తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా ఇచ్చినా, వాటి వరుసను మరియు సమాన ప్రాధాన్యాన్ని నిలిపాం. పాదసూచిక సూచిక [a] ప్రధాన వచనంలో చేర్చబడింది.
