id: 2CH.7.18
reference: 2 Chronicles 7:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/הֲקִ֣ימוֹתִ֔י אֵ֖ת כִּסֵּ֣א מַלְכוּתֶ֑/ךָ כַּ/אֲשֶׁ֣ר כָּרַ֗תִּי לְ/דָוִ֤יד אָבִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹֽא יִכָּרֵ֤ת לְ/ךָ֙ אִ֔ישׁ מוֹשֵׁ֖ל בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/018.yaml
  text: then I will establish the throne of your kingdom[a], as I covenanted with David your father, saying, ‘A man to rule over Israel will not be cut off from you.’
translation:
  language: te
  text: అప్పుడు నీ రాజ్యపు సింహాసనాన్ని స్థిరపరుస్తాను; నీ తండ్రి దావీదుతో నేను చేసిన నిబంధన ప్రకారం, ‘ఇశ్రాయేలును పరిపాలించే పురుషుడు నీకు లేకుండా పోడు’[a] అని చెప్పాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత నుడికారంగా: “ఇశ్రాయేలును పరిపాలించే పురుషుడు నీకు కొదవకాడు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִימוֹתִי
  choice: అప్పుడు ... స్థిరపరుస్తాను
  rationale: קום హిఫీల్ రూపం ‘నిలిచేలా చేయడం, స్థిరపరచడం’ అనే భావాన్ని ఇస్తుంది; ముందు వచనంలోని షరతుకు అనుసరించే ఫలితాన్ని వావ్ సూచిస్తున్నందున ‘అప్పుడు’ సహజం.
- source_word: כִּסֵּא מַלְכוּתֶךָ
  choice: నీ రాజ్య సింహాసనాన్ని
  rationale: ‘సింహాసనం’ మరియు ‘రాజ్యం/రాజరికం’ అనే రెండు నామాలనూ నిలుపుతూ హెబ్రీ నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָּרַתִּי לְדָוִיד אָבִיךָ
  choice: నీ తండ్రి దావీదుతో నేను నిబంధన చేసినప్పుడు
  rationale: כרת అనే క్రియ నిబంధన సందర్భంలో ‘నిబంధన చేయడం’ అనే స్థిరమైన అర్థం కలిగి ఉంది; לְ భావాన్ని తెలుగులో ‘తో’ సహజంగా తెలియజేస్తుంది. כַּאֲשֶׁר ఇక్కడ గతంలో చేసిన నిబంధనను సూచించే కాలసంబంధ భావంతో అనువదించబడింది.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  choice: పురుషుడు నీకు లేకుండా పోడు
  rationale: అక్షరార్థంలోని ‘నరికివేయబడడు’ అనే రూపకం తెలుగులో ఈ వాక్య నిర్మాణంలో అసహజంగా, వ్యక్తి హింసకు గురికాడనే అపార్థంతో వినిపించవచ్చు. ‘నీకు లేకుండా పోడు’ వంశపారంపర్య కొనసాగింపు భావాన్ని వెల్లడిస్తూ ప్రతికూల నిర్మాణాన్ని నిలుపుతుంది.
- source_word: מוֹשֵׁל בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలును పరిపాలించే
  rationale: משל కృదంతపు విశేషణాత్మక బలాన్ని ‘పరిపాలించే’ నిలుపుతుంది; ఈ క్రియతో בְּ పాలనకు లోబడిన ప్రజలను సూచిస్తున్నందున ‘ఇశ్రాయేలును’ సహజమైన తెలుగు.
theological_decisions:
- issue: దావీదు వంశానికి సంబంధించిన వాగ్దానపు పదప్రయోగం
  choice: ‘ఇశ్రాయేలును పరిపాలించే పురుషుడు నీకు లేకుండా పోడు’
  alternative: ‘ఇశ్రాయేలును పరిపాలించడానికి నీకు ఒక పురుషుడు ఎప్పుడూ ఉంటాడు’
  rationale: ప్రధాన పాఠం వంశపారంపర్య కొనసాగింపును సహజంగా తెలియజేస్తూనే మూలంలోని ప్రతికూల వాక్య నిర్మాణాన్ని కాపాడుతుంది. ప్రత్యామ్నాయం భావాన్ని మరింత స్పష్టంగా చెప్పినా ‘ఎప్పుడూ’ అనే పదాన్ని ప్రత్యక్షంగా చేర్చుతుంది; అందువల్ల దాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘రాజ్య సింహాసనం,’ ‘నిబంధన’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని నిలుపుతూ, హెబ్రీ నుడికారాన్ని అపార్థం కలగని సహజ తెలుగులో అందించాం.
