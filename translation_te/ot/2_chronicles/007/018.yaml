revisions:
- from: అప్పుడు నీ రాజ్య సింహాసనాన్ని స్థిరపరుస్తాను. నీ తండ్రి దావీదుతో నేను నిబంధన చేసినప్పుడు, ‘ఇశ్రాయేలును పరిపాలించే పురుషుడు నీకు లేకుండా పోడు’[a] అని చెప్పాను.
  to: అప్పుడు నీ రాజ్యపు సింహాసనాన్ని స్థిరపరుస్తాను; నీ తండ్రి దావీదుతో నేను చేసిన నిబంధన ప్రకారం, ‘ఇశ్రాయేలును పరిపాలించే పురుషుడు నీకు లేకుండా పోడు’[a] అని చెప్పాను.
  rationale: The revision restores the comparative/covenantal force of כַּאֲשֶׁר with “నిబంధన ప్రకారం,” while preserving the Hebrew sequence and the idiomatic Telugu rendering of “will not be cut off from you.” The footnote now offers a natural Telugu equivalent for the dynastic idiom without introducing the additional word “ఎప్పుడూ.”
  reviewer_model: gpt-5.6-terra
