id: 2CH.7.19
reference: 2 Chronicles 7:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִם תְּשׁוּב֣וּ/ן אַתֶּ֔ם וַ/עֲזַבְתֶּם֙ חֻקּוֹתַ֣/י וּ/מִצְוֺתַ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/כֶ֑ם וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/019.yaml
  text: But if you turn away and abandon my statutes and my commandments that I have set before you, and go and serve other gods and bow down to them,
translation:
  language: te
  text: కాని మీరు వెనుదిరిగి, నేను మీ ముందు ఉంచిన నా విధులను, నా ఆజ్ఞలను విడిచిపెట్టి, వెళ్లి ఇతర దేవుళ్లను సేవించి వారికి నమస్కరిస్తే,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּשׁוּבוּן
  choice: వెనుదిరిగి
  rationale: సందర్భంలో యెహోవా నుండి తొలగిపోవడం అనే భావాన్ని సహజంగా తెలియజేస్తుంది; మూలంలోని ‘తిరగడం’ రూపకాన్ని నిలుపుతుంది.
- source_word: וַעֲזַבְתֶּם
  choice: విడిచిపెట్టి
  rationale: కట్టడలను, ఆజ్ఞలను వదిలేయడం అనే మూలార్థాన్ని స్పష్టంగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חֻקּוֹתַי
  choice: నా కట్టడలను
  rationale: స్థిరంగా విధించబడిన నియమాలు అనే భావాన్ని ‘ఆజ్ఞలు’తో ఉన్న పదభేదాన్ని కాపాడుతూ తెలియజేస్తుంది.
- source_word: מִצְוֺתַי
  choice: నా ఆజ్ఞలను
  rationale: దేవుడు ఆదేశించిన విషయాలు అనే సాధారణ బైబిలు భావాన్ని నేరుగా అందిస్తుంది.
- source_word: נָתַתִּי לִפְנֵיכֶם
  choice: నేను మీ ముందు ఉంచిన
  rationale: హీబ్రూ వాక్యరూపాన్ని, ప్రజల ఎదుట నియమాలను ప్రతిపాదించిన భావాన్ని కాపాడుతుంది.
- source_word: וַעֲבַדְתֶּם
  choice: సేవించి
  rationale: ఇతర దేవుళ్లకు ఆరాధనాత్మక సేవ చేయడం అనే సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: וְהִשְׁתַּחֲוִיתֶם
  choice: నమస్కరిస్తే
  rationale: వంగి ఆరాధించడం అనే చర్యను సహజ తెలుగులో తెలియజేస్తుంది; ‘సేవించడం’తో చర్యల భేదాన్ని ఉంచుతుంది.
theological_decisions:
- issue: ‘వెనుదిరగడం’ యొక్క దిశ
  choice: వెనుదిరిగి
  alternative: నన్ను విడిచి తొలగిపోయి
  rationale: మూలంలో ప్రత్యక్ష కర్మ లేదు. ‘నన్ను విడిచి’ అని చేర్చి అస్పష్టతను తొలగించకుండా, సందర్భంలో అర్థమయ్యే మూల రూపకాన్నే నిలుపుకున్నాం.
- issue: ఇతర దేవుళ్ల అస్తిత్వానికి సంబంధించిన భాష
  choice: ఇతర దేవుళ్లను
  alternative: అన్య దేవతలను
  rationale: మూలంలోని אֱלֹהִים אֲחֵרִיםను నేరుగా ప్రతిబింబిస్తుంది; వారి నిజమైన అస్తిత్వంపై వాక్యం చెప్పని నిర్ణయాన్ని అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ఇది తరువాతి వచనంలో పూర్తయ్యే షరతు వాక్యం కాబట్టి చివర కామా ఉంచబడింది.
