  source_fidelity: 'ప్రధాన భావం సరిగానే ఉంది: ప్రాంగణం మధ్యభాగాన్ని పవిత్ర ప్రయోజనం కోసం ప్రత్యేకపరచడం, అక్కడ బలులు అర్పించడం, కంచు బలిపీఠం సామర్థ్యం సరిపోకపోవడం అన్నీ మూలానికి అనుగుణంగా ఉన్నాయి. అయితే עָשָׂה שְׁלֹמֹהకు “సొలొమోను చేయించిన” అనడం ‘చేయించాడు’ అనే causative భావాన్ని చేర్చుతుంది; మూలం “సొలొమోను చేసిన” అని చెబుతుంది. దైవనామానికి ఆడిట్ నిర్ణయమైన “యాహ్వే”ను అనుసరించాలి.'
