  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְקַדֵּ֣שׁ שְׁלֹמֹ֗ה אֶת תּ֤וֹךְ הֶֽ/חָצֵר֙ אֲשֶׁר֙ לִ/פְנֵ֣י בֵית יְהוָ֔ה כִּֽי עָ֤שָׂה שָׁם֙ הָֽ/עֹל֔וֹת וְ/אֵ֖ת חֶלְבֵ֣י הַ/שְּׁלָמִ֑ים כִּֽי מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁ֣ר עָשָׂ֣ה שְׁלֹמֹ֔ה לֹ֣א יָכ֗וֹל לְ/הָכִ֛יל אֶת הָ/עֹלָ֥ה וְ/אֶת הַ/מִּנְחָ֖ה וְ/אֶת הַ/חֲלָבִֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/007.yaml
  text: Then Solomon consecrated the middle of the court that was before the house of Yahweh[a], because there he offered the burnt offerings and the fat portions of the peace offerings, because the bronze altar that Solomon had made could not hold the burnt offering, the grain offering[c][b], and the fat portions.
translation:
  language: te
  text: అప్పుడు సొలొమోను యాహ్వే మందిరం ఎదుట ఉన్న ప్రాంగణం మధ్యభాగాన్ని పవిత్ర సేవకోసం ప్రత్యేకపరిచాడు.[a] ఎందుకంటే అక్కడ అతడు దహనబలులను, సమాధాన బలుల[b] కొవ్వు భాగాలను అర్పించాడు.[c] సొలొమోను చేసిన కంచు బలిపీఠం దహనబలిని, ధాన్యార్పణను, కొవ్వు భాగాలను పట్టలేకపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రాంగణం అంతర్భాగాన్ని.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “సహవాస బలులు.”
    reason: lexical_alternative
  - marker: c
    text: హెబ్రీలో అక్షరార్థంగా “చేశాడు”; బలుల సందర్భంలో “అర్పించాడు” అనే అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַדֵּשׁ
  choice: పవిత్ర వినియోగానికి ప్రతిష్ఠించాడు
  rationale: హిఫిల్ రూపం ఒక స్థలాన్ని పవిత్ర కార్యం కోసం ప్రత్యేకపరచడాన్ని సూచిస్తుంది; ఈ పదబంధం ఆధునిక తెలుగులో ఆ ఆరాధనాసంబంధ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: תּוֹךְ הֶחָצֵר
  choice: ప్రాంగణం మధ్యభాగాన్ని
  rationale: תּוֹךְ ఇక్కడ ప్రాంగణం మొత్తాన్ని కాక దాని మధ్య లేదా అంతర్భాగాన్ని సూచిస్తుంది.
- source_word: לִפְנֵי בֵית יְהוָה
  choice: యెహోవా మందిరం ఎదుట ఉన్న
  rationale: לִפְנֵי స్థలసంబంధంగా ‘ఎదుట’ అని అర్థం; בֵית יְהוָהను సహజమైన తెలుగులో ‘యెహోవా మందిరం’గా ఇచ్చాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: עָשָׂה שָׁם
  choice: అక్కడ అతడు ... అర్పించాడు
  rationale: עָשָׂה అక్షరార్థంగా ‘చేశాడు’ అయినా, బలుల సందర్భంలో అది అర్పణ క్రియను సూచిస్తుంది.
- source_word: הָעֹלוֹת / הָעֹלָה
  choice: దహనబలులను / దహనబలిని
  rationale: మొదటి రూపంలోని బహువచనాన్ని, రెండవ రూపంలోని ఏకవచన సమూహార్థాన్ని తెలుగులో సాధ్యమైనంతగా నిలిపాం.
- source_word: חֶלְבֵי הַשְּׁלָמִים
  choice: సమాధాన బలుల కొవ్వు భాగాలను
  rationale: חֶלְבֵי బలిలో అర్పించే నిర్దిష్ట కొవ్వు భాగాలను సూచిస్తుంది; שְׁלָמִיםకు స్థిరమైన ఆరాధనాసంబంధ పదంగా ‘సమాధాన బలులు’ వాడాం.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: కంచు బలిపీఠం
  rationale: దేవాలయ సామగ్రి సందర్భంలో נְחֹשֶׁתకు సహజమైన ఆధునిక తెలుగు పదం ‘కంచు’.
- source_word: לֹא יָכוֹל לְהָכִיל
  choice: ఇముడ్చుకోలేకపోయింది
  rationale: బలిపీఠానికి తగిన సామర్థ్యం లేకపోవడాన్ని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: הַמִּנְחָה
  choice: ధాన్యార్పణను
  rationale: బలుల సందర్భంలో מִנְחָה ధాన్యంతో చేసే అర్పణకు సాంకేతిక పదం.
- source_word: הַחֲלָבִים
  choice: కొవ్వు భాగాలను
  rationale: బలిగా అర్పించే కొవ్వు ముక్కలను సూచించేందుకు ‘కొవ్వులు’ కంటే ఇది సహజంగా, కచ్చితంగా ఉంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా ఉంచాం. తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించే ప్రత్యామ్నాయం.
- issue: שְׁלָמִים బలి పేరు
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు
  rationale: పదంలో సమాధానం, సంపూర్ణత, సహవాసం వంటి భావవ్యాప్తి ఉంది. పాఠ్యంలో స్థిరమైన ఆరాధనాసంబంధ పదాన్ని వాడి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. బలుల సాంకేతిక పదాలకు స్థిరమైన తెలుగు రూపాలు వాడబడ్డాయి; మూలంలోని కారణసంబంధ పునరుక్తిని సహజ తెలుగు వాక్యనిర్మాణంలో నిలిపాం.
