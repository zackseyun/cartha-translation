  text: וּ/כְ/כַלּ֤וֹת שְׁלֹמֹה֙ לְ/הִתְפַּלֵּ֔ל וְ/הָ/אֵ֗שׁ יָֽרְדָה֙ מֵֽ/הַ/שָּׁמַ֔יִם וַ/תֹּ֥אכַל הָ/עֹלָ֖ה וְ/הַ/זְּבָחִ֑ים וּ/כְב֥וֹד יְהוָ֖ה מָלֵ֥א אֶת הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/001.yaml
  text: And when Solomon finished praying[a], the fire came down from heaven and consumed the burnt offering and the sacrifices[b], and the glory of Yahweh filled the house.
translation:
  language: te
  text: సొలొమోను ప్రార్థించడం ముగించినప్పుడు, ఆకాశం నుండి అగ్ని దిగివచ్చి దహనబలినీ బలులనూ దహించివేసింది; యాహ్వే మహిమ మందిరాన్ని నింపింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో ‘ఆ ఇల్లు’; ఇక్కడ అది మందిరాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וּכְכַלּוֹת שְׁלֹמֹה לְהִתְפַּלֵּל
  choice: సొలొమోను ప్రార్థించడం ముగించినప్పుడు
  rationale: כְּతో కూడిన כלה క్రియానామ రూపం కాలసూచక ఉపవాక్యాన్ని ఏర్పరుస్తుంది. ఈ తెలుగు రూపం సంఘటనల క్రమాన్ని సహజంగా తెలియజేస్తూ, ‘వెంటనే’ అనే మూలంలో లేని భావాన్ని చేర్చదు.
- source_word: וְהָאֵשׁ יָרְדָה מֵהַשָּׁמַיִם
  choice: ఆకాశం నుండి అగ్ని దిగివచ్చి
  rationale: ירד యొక్క కిందికి కదలికను ‘దిగివచ్చి’ సహజంగా వ్యక్తం చేస్తుంది; שׁמים ఈ ప్రయోగంలో తెలుగులో సహజమైన ఏకవచన ‘ఆకాశం’గా అనువదించబడింది.
- source_word: וַתֹּאכַל
  choice: దహించివేసింది
  rationale: ఈ క్రియ అక్షరార్థంగా ‘తినివేసింది’ అయినా, అగ్ని కర్తగా ఉన్నప్పుడు ‘దహించివేసింది’ ఆధునిక తెలుగులో సహజంగా ఉండి పూర్తిగా కాల్చివేసిన భావాన్ని ఇస్తుంది.
- source_word: הָעֹלָה
  choice: దహనబలిని
  rationale: עלה బలుల సందర్భంలో పూర్తిగా దహనం చేసే ప్రత్యేక బలిని సూచిస్తుంది; ‘దహనబలి’ దానికి స్థిరమైన, స్పష్టమైన తెలుగు పదం.
- source_word: וְהַזְּבָחִים
  choice: ఇతర బలులను
  rationale: זבחים బహువచనంలో సాధారణ బలులను సూచిస్తుంది. ముందు పేర్కొన్న దహనబలితో వ్యత్యాసం స్పష్టంగా ఉండేందుకు ‘ఇతర’ సందర్భానుసారంగా జోడించబడింది.
- source_word: וּכְבוֹד יְהוָה
  choice: యెహోవా మహిమ
  rationale: כבוד ఇక్కడ ప్రత్యక్షమయ్యే దైవ మహిమను సూచిస్తుంది. יהוה అనే వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: מָלֵא אֶת־הַבָּיִת
  choice: మందిరమంతా నిండింది
  rationale: בית అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఇక్కడ సందర్భం స్పష్టంగా దేవాలయాన్ని సూచిస్తుంది. సాధారణ తెలుగు పాఠకునికి వెంటనే అర్థమయ్యేలా ‘మందిరం’ ఎంచుకొని, నిండుదల భావాన్ని ‘మంతా’తో సహజంగా వ్యక్తం చేశాం.
theological_decisions:
- issue: יהוה దైవనామ అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాకుండా చతురక్షర దైవనామం నేరుగా ఉంది. దానిని వ్యక్తిగత నామంగా నిలుపుతూ, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపం ఉపయోగించాం.
- issue: הַבָּיִת యొక్క సూచన
  choice: మందిరం
  alternative: ఇల్లు
  rationale: అక్షరార్థం ‘ఇల్లు’ అయినప్పటికీ, 2 దినవృత్తాంతములు 7 సందర్భంలో ఇది సొలొమోను నిర్మించిన దేవాలయాన్నే సూచిస్తుంది. అస్పష్టత లేనందున సహజమైన సందర్భార్థాన్ని ప్రధాన పాఠంలో ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. వాక్యప్రవాహం కోసం అనుసంధాన క్రియారూపాలు వాడబడ్డాయి; బలుల సంబంధిత ప్రత్యేక పదజాలంలో ‘దహనబలి’ నిలుపబడింది.
