  - severity: low
    issue: “ఉన్నతంగా ఉన్న” is awkward in this attributive context, and “అడుగుతాడు” narrows ‘say’ to ‘ask.’
    rationale: “ఉన్నతమైన” is idiomatic and preserves the high/exalted ambiguity; “అంటాడు” directly represents the Hebrew verb while retaining the quoted question.
