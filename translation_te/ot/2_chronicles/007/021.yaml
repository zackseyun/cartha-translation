base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/021.yaml
  text: And this house[a], which was exalted, will become a horror to everyone passing by it, and they will say[b], 'Why has Yahweh done thus to this land and to this house?'
translation:
  language: te
  text: ఈ ఉన్నతమైన మందిరం పక్కగా వెళ్లే ప్రతివాడూ దిగ్భ్రాంతి చెందుతాడు[a] మరియు, “యాహ్వే ఈ దేశానికీ ఈ మందిరానికీ ఇలా ఎందుకు చేశాడు?” అని అంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిర్జనమై భయానక దృశ్యంగా ఉంటుంది.” హీబ్రూ క్రియ నాశనాన్ని, లేదా దాన్ని చూసి కలిగే దిగ్భ్రాంతిని సూచించవచ్చు.
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: וְהַבַּיִת הַזֶּה
  choice: ఈ మందిరాన్ని
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’; సందర్భంలో ఇది యెహోవా మందిరాన్ని సూచిస్తుంది. ఆధునిక తెలుగు పాఠకునికి ఉద్దేశ్యం స్పష్టంగా ఉండేందుకు ‘మందిరం’ వాడి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֲשֶׁר הָיָה עֶלְיוֹן
  choice: ఉన్నతంగా ఉన్న
  rationale: עֶלְיוֹן ఇక్కడ మందిరపు పూర్వ వైభవాన్ని, ప్రాముఖ్యతను సూచిస్తుంది. ‘ఉన్నతంగా’ అనే పదం కేవలం భౌతిక ఎత్తుకే పరిమితం కాకుండా ఆ గౌరవాన్నీ నిలుపుతుంది.
- source_word: לְכָל עֹבֵר עָלָיו
  choice: దాని పక్కగా వెళ్లే ప్రతివాడూ
  rationale: ఈ పదబంధం శిథిలమైన స్థలాన్ని దాటి వెళ్లే ప్రతి బాటసారిని సూచిస్తుంది. తెలుగు సహజ ప్రయోగానికి అనుగుణంగా ‘పక్కగా వెళ్లే’ అని అనువదించాం.
- source_word: יִשֹּׁם
  choice: దిగ్భ్రాంతి చెందుతాడు
  rationale: שׁמם రూపం నాశనాన్ని చూసి విస్తుపోవడం లేదా భయభ్రాంతికి గురికావడం అనే భావాన్ని ఇస్తుంది. సమీపంలోని ఏకవచన ‘వెళ్లే ప్రతివాడు’నే కర్తగా తీసుకోవడం హీబ్రూ వాక్యనిర్మాణానికి సహజం; ఇతర భావసాధ్యతను పాదసూచికలో నిలిపాం.
- source_word: וְאָמַר
  choice: అతడు … అని అడుగుతాడు
  rationale: హీబ్రూలో క్రియ ఏకవచనంలో ఉండి, ‘వెళ్లే ప్రతివాడు’ అనే పంపిణీ ఏకవచనాన్ని కొనసాగిస్తుంది. ప్రశ్నను పలకడం తెలుగులో సహజంగా ‘అడుగుతాడు’ అవుతుంది.
- source_word: בַּמֶּה
  choice: ఎందుకు
  rationale: అక్షరార్థం ‘దేని కారణంగా?’; ఈ ప్రశ్నలో సహజమైన ఆధునిక తెలుగు రూపం ‘ఎందుకు’.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన వ్యక్తినామ రూపం ‘యెహోవా’గా ఇచ్చాం.
- source_word: כָּכָה
  choice: ఇలా
  rationale: ‘ఈ విధంగా’ అనే భావాన్ని సహజమైన, గంభీరమైన తెలుగులో ‘ఇలా’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: לָאָרֶץ הַזֹּאת וְלַבַּיִת הַזֶּה
  choice: ఈ దేశానికీ ఈ మందిరానికీ
  rationale: אֶרֶץ సందర్భానుసారం ఇశ్రాయేలు దేశాన్ని సూచిస్తుంది; రెండు లక్ష్యాల సమాంతర నిర్మాణాన్ని ‘దేశానికీ … మందిరానికీ’గా నిలిపాం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగు బైబిలు వాడుకలో విస్తృతంగా తెలిసిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: יִשֹּׁם యొక్క కర్త మరియు భావం
  choice: దాని పక్కగా వెళ్లే ప్రతివాడూ దిగ్భ్రాంతి చెందుతాడు
  alternative: ఈ మందిరం భయంకరమైన దృశ్యంగా/నిర్జనంగా మారుతుంది
  rationale: హీబ్రూ ఏకవచన క్రియకు సమీప కర్త ‘వెళ్లే ప్రతివాడు’; తరువాతి ఏకవచన וְאָמַר కూడా అదే వ్యక్తిని కొనసాగిస్తుంది. అయినా שׁמם పదం నాశనం, నిర్జనత్వం, దాని వల్ల కలిగే దిగ్భ్రాంతి అనే పరస్పర సంబంధిత భావాలను కలిగి ఉండటంతో ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని పాటించాం. హీబ్రూ పంపిణీ ఏకవచనాన్ని ‘ప్రతివాడూ … అతడు’గా నిలిపాం; మందిరం యొక్క పూర్వ వైభవం మరియు తీర్పు కలిగించే దిగ్భ్రాంతి రెండూ స్పష్టంగా వినిపించేలా రూపొందించాం.
