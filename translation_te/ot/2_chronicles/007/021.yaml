  source_fidelity: 'The draft correctly understands יִשֹּׁם and the following singular וְאָמַר as referring distributively to each passerby: the passerby is appalled and speaks. However, its opening accusative construction (“ఈ మందిరాన్ని చూసి”) recasts the Hebrew’s nominative topical phrase, and “ఉన్నతంగా ఉన్న” is less idiomatic than a direct attributive rendering. The divine name should correspond to the project’s Yahweh policy.'
