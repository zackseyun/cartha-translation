id: 2CH.7.4
reference: 2 Chronicles 7:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/מֶּ֖לֶךְ וְ/כָל הָ/עָ֑ם זֹבְחִ֥ים זֶ֖בַח לִ/פְנֵ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/004.yaml
  text: Then the king and all the people offered sacrifices before Yahweh[a].
translation:
  language: te
  text: తరువాత రాజు, ప్రజలందరూ యాహ్వే సన్నిధిలో బలులు[a] అర్పిస్తూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “బలిని అర్పిస్తూ ఉన్నారు”; క్రియ, నామవాచకం ఒకే ధాతువుకు చెందినవి. ఈ సమానధాతు ప్రయోగం బలులు అర్పించే కార్యాన్ని బలపరుస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: తరువాత రాజూ
  rationale: వావ్ కథనాన్ని ముందుకు కొనసాగిస్తుంది; తెలుగులో క్రమానుసరణను సహజంగా తెలియజేయడానికి ‘తరువాత’ అనుకూలం. తరువాతి సంయుక్త కర్తతో ‘రాజూ ... ప్రజలందరూ’ సహజంగా ఉంటుంది.
- source_word: וְכָל הָעָם
  choice: ప్రజలందరూ
  rationale: עָם సాధారణంగా ‘ప్రజలు’ అని అర్థం; ఇక్కడ సమకూడిన జనులందరినీ సూచిస్తుంది.
- source_word: זֹבְחִים זֶבַח
  choice: బలులు అర్పిస్తూ ఉన్నారు
  rationale: క్రియావిశేషణాత్మక పార్టిసిపిల్ కొనసాగుతున్న కార్యాన్ని సూచిస్తుంది. మూలంలోని సమానధాతు నిర్మాణాన్ని తెలుగులో యథాతథంగా ఉంచితే అసహజంగా ఉంటుంది కాబట్టి అర్థాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: לִפְנֵי
  choice: సన్నిధిలో
  rationale: దేవుని సమక్షంలో జరిగే ఆరాధనా కార్యం అనే భావాన్ని తెలుగులో ‘సన్నిధిలో’ సహజంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగు పాఠకులకు సుపరిచితమైన రూపంలో వ్యక్తినామంగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: యְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా పేరు రూపంలో ఉంచాం; ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా సుపరిచితం.
- issue: బలి అర్పణ క్రియ యొక్క కాలదృష్టి
  choice: అర్పిస్తూ ఉన్నారు
  alternative: అర్పించారు
  rationale: హీబ్రూ పార్టిసిపిల్ కార్యం కొనసాగుతున్నట్లు చిత్రిస్తుంది; అందువల్ల సాధారణ భూతకాలంతో దాన్ని ముగిసిన ఏకక్రియగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ పార్టిసిపిల్‌లోని కొనసాగుతున్న కార్యభావాన్ని నిలిపి, సమానధాతు ప్రయోగాన్ని ప్రధాన పాఠంలో సహజీకరించి పాదటిప్పణిలో వివరించాం.
