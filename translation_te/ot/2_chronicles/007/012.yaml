id: 2CH.7.12
reference: 2 Chronicles 7:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּרָ֧א יְהוָ֛ה אֶל שְׁלֹמֹ֖ה בַּ/לָּ֑יְלָה וַ/יֹּ֣אמֶר ל֗/וֹ שָׁמַ֨עְתִּי֙ אֶת תְּפִלָּתֶ֔/ךָ וּ/בָחַ֜רְתִּי בַּ/מָּק֥וֹם הַ/זֶּ֛ה לִ֖/י לְ/בֵ֥ית זָֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/012.yaml
  text: Then Yahweh appeared to Solomon by night and said to him[b][a], “I have heard your prayer and have chosen this place for myself as a house of sacrifice.”
translation:
  language: te
  text: అప్పుడు యాహ్వే రాత్రివేళ[a] సొలొమోనుకు ప్రత్యక్షమై అతనితో, “నేను నీ ప్రార్థన విన్నాను; ఈ స్థలాన్ని నా కోసం బలులు అర్పించే గృహంగా[b] ఎన్నుకున్నాను” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాత్రిలో.”
    reason: lexical_alternative
  - marker: b
    text: పదశః, “బలి గృహంగా”; అంటే, బలులు అర్పించే ఆరాధన కోసం ప్రత్యేకించిన స్థలంగా.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: ప్రత్యక్షమై
  rationale: నిఫాల్ రూపం ఇక్కడ సొలొమోనుకు యాహ్వే ప్రత్యక్షమైన దృశ్య అనుభవాన్ని సూచిస్తుంది. ప్రత్యక్షమై అనే పదం ఆ భావాన్ని సహజంగా తెలియజేస్తూ, ప్రత్యక్షత జరిగిన విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో సులభంగా పలికే లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: בַּלָּיְלָה
  choice: రాత్రివేళ
  rationale: రాత్రిలో లేదా రాత్రిపూట అనే కాలార్థాన్ని సహజమైన ఆధునిక తెలుగు కథన శైలిలో వ్యక్తపరుస్తుంది.
- source_word: שָׁמַעְתִּי
  choice: విన్నాను
  rationale: పూర్తయిన క్రియను, ఇప్పుడు దేవుడు స్పందిస్తున్న సందర్భంలో దాని కొనసాగుతున్న ప్రాసంగికతను సహజంగా తెలియజేస్తుంది.
- source_word: תְּפִלָּתֶךָ
  choice: నీ ప్రార్థన
  rationale: మూలంలోని సాధారణ ప్రార్థనార్థక నామవాచకానికి నేరమైన, స్పష్టమైన సమానం.
- source_word: וּבָחַרְתִּי
  choice: ఎన్నుకున్నాను
  rationale: దేవుడు చేసిన పూర్తయిన ఎంపికను, దాని కొనసాగుతున్న ప్రాముఖ్యతతో సహా తెలియజేస్తుంది.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: ఈ స్థలాన్ని
  rationale: కొద్దిసేపటి క్రితం ప్రతిష్ఠించబడిన ఆలయ స్థలాన్ని సహజంగా సూచిస్తుంది.
- source_word: לִי
  choice: నా కోసం
  rationale: దైవ సంబంధిత స్వాధీనత లేదా ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְבֵית זָבַח
  choice: బలులు అర్పించే గృహంగా
  rationale: పదశః ఉన్న బలి గృహం అనే నిర్మాణాన్ని సాధారణ తెలుగు పాఠకునికి స్పష్టంగా చేస్తూ, ఆ స్థలం బలియారాధన కోసం ప్రత్యేకించబడిందనే మూల భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దాన్ని ప్రభువు వంటి బిరుదుతో మార్చకుండా యాహ్వే అని లిప్యంతరీకరించడం మూలంలోని నామాన్ని నిలుపుతుంది.
- issue: לְבֵית זָבַח యొక్క ఉద్దేశార్థక నిర్మాణం
  choice: బలులు అర్పించే గృహంగా
  alternative: బలి గృహం కోసం
  rationale: లְ ఉపసర్గ ఇక్కడ నియామకం లేదా ఉద్దేశాన్ని సూచించగలదు. ప్రధాన పాఠం సహజ తెలుగులో స్థలపు నియమిత పాత్రను తెలియజేస్తుంది; పదశః ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. దైవనామాన్ని యాహ్వే అని నిలిపి, ఆలయాన్ని సూచించే గృహం అనే మూల రూపకాన్ని కాపాడుతూ దాని కార్యాన్ని స్పష్టంచేశాం.
