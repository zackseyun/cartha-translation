id: 2CH.7.20
reference: 2 Chronicles 7:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/נְתַשְׁתִּ֗י/ם מֵ/עַ֤ל אַדְמָתִ/י֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם וְ/אֶת הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר הִקְדַּ֣שְׁתִּי לִ/שְׁמִ֔/י אַשְׁלִ֖יךְ מֵ/עַ֣ל פָּנָ֑/י וְ/אֶתְּנֶ֛/נּוּ לְ/מָשָׁ֥ל וְ/לִ/שְׁנִינָ֖ה בְּ/כָל הָ/עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/020.yaml
  text: then I will uproot them from my land that I have given them[a], and this house that I have consecrated for my name I will cast out of my sight[c][b], and I will make it a proverb and a byword among all peoples.
translation:
  language: te
  text: అప్పుడు నేను వారికి ఇచ్చిన నా భూమి నుండి వారిని పెరికివేస్తాను. నా పేరు కోసం నేను ప్రతిష్ఠించిన ఈ మందిరాన్ని[a] నా ఎదుటనుండి విసిరివేస్తాను[b]. దానిని ప్రజలందరి మధ్య సామెతగా, అపహాస్యపు నానుడిగా చేస్తాను[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఈ గృహాన్ని.’ ఇక్కడ దేవాలయం ఉద్దేశించబడింది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నా ముఖం ఎదుటనుండి.’
    reason: lexical_alternative
  - marker: c
    text: ‘ఎగతాళి మాటగా, అపహాస్య వస్తువుగా’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַשְׁתִּים
  choice: అప్పుడు ... వారిని పెకలించి వేస్తాను
  rationale: נתשׁలోని మొక్కను వేళ్లతో సహా పీకివేసే భావాన్ని ‘పెకలించి వేస్తాను’ సహజమైన తెలుగులో నిలుపుతుంది. ముందరి వచనంలోని షరతు–ఫలిత క్రమానికి అనుగుణంగా וּ־ను ‘అప్పుడు’గా ఇచ్చాం.
- source_word: מֵעַל אַדְמָתִי
  choice: నా దేశంలోనుంచి
  rationale: אֲדָמָהకు నేల, భూమి, దేశం అనే అర్థాలున్నాయి. ఇక్కడ దేవుడు ఇశ్రాయేలీయులకు ఇచ్చిన భూభాగం ఉద్దేశం కాబట్టి ‘దేశం’ సందర్భోచితం; ‘నా’ అనేది దేవుని యాజమాన్యాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר נָתַתִּי לָהֶם
  choice: వారికి ఇచ్చిన
  rationale: మూలంలోని సంబంధ వాక్యాన్ని సంక్షిప్తమైన, సహజమైన తెలుగు రూపంలో నేరుగా అనువదిస్తుంది.
- source_word: הַבַּיִת הַזֶּה
  choice: ఈ మందిరాన్ని
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు/గృహం’; ఈ సందర్భంలో అది యెరూషలేము దేవాలయాన్ని సూచిస్తుంది. సాధారణ పాఠకునికి ఉద్దేశం వెంటనే స్పష్టమయ్యేలా ‘మందిరం’ను ప్రధాన పాఠ్యంలో ఉంచి, అక్షరార్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: הִקְדַּשְׁתִּי לִשְׁמִי
  choice: నా పేరు కోసం నేను ప్రతిష్ఠించిన
  rationale: קדשׁ హిఫిల్ రూపం పవిత్ర ప్రయోజనం కోసం ప్రత్యేకపరచడాన్ని సూచిస్తుంది. ‘ప్రతిష్ఠించిన’ ఆ ఆరాధనా భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; לִשְׁמִיలోని ‘నా పేరు కోసం’ అనే దైవనామ భావనను పరామర్శగా మార్చకుండా నిలిపాం.
- source_word: אַשְׁלִיךְ מֵעַל פָּנַי
  choice: నా సన్నిధి నుండి విసిరివేస్తాను
  rationale: ‘నా ముఖం ఎదుటనుండి’ అనే హీబ్రూ నుడికారానికి ‘నా సన్నిధి నుండి’ సహజమైన సమానం; ‘విసిరివేస్తాను’ అనే పదం אַשְׁלִיךְలోని తీవ్ర తిరస్కార భావాన్ని నిలుపుతుంది.
- source_word: וְאֶתְּנֶנּוּ
  choice: దానిని ... చేస్తాను
  rationale: נתןతో కూడిన ఈ నిర్మాణం ఒక దానిని నిర్దిష్ట స్థితికి లేదా పాత్రకు చేయడాన్ని సూచిస్తుంది. తెలుగులో ‘చేస్తాను’ స్పష్టమైన సమానం.
- source_word: לְמָשָׁל
  choice: సామెతగా
  rationale: מָשָׁלకు సామెత, నానుడి, ఎగతాళి మాట వంటి అర్థాలు ఉండవచ్చు. జతగా ఉన్న שְׁנִינָה అవమాన భావాన్ని మోస్తుండగా, మొదటి పదానికి ‘సామెత’ మూలంలోని విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: לִשְׁנִינָה
  choice: అపహాస్యపు నానుడిగా
  rationale: שְׁנִינָה ఎగతాళిగా పదేపదే పలికే మాటను లేదా అపహాస్యానికి గురైన దానిని సూచిస్తుంది. ‘అపహాస్యపు నానుడి’ ప్రజల మధ్య కలిగే బహిరంగ అవమానాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּכָל הָעַמִּים
  choice: ప్రజలందరి మధ్య
  rationale: עַמִּים అనేది ‘ప్రజలు/జనాలు’ అనే బహువచనం. ‘ప్రజలందరి మధ్య’ రాజకీయ ‘దేశాలు’ అనే అర్థాన్ని అనవసరంగా చేర్చకుండా విస్తృత ప్రజాసమూహాలను సూచిస్తుంది.
theological_decisions:
- issue: దేవాలయాన్ని సూచించే בַּיִת పదం
  choice: ఈ మందిరాన్ని
  alternative: ఈ గృహాన్ని
  rationale: మూలపదం ‘గృహం’ అయినప్పటికీ సందర్భంలో అది దేవాలయాన్నే సూచిస్తుంది. ఆధునిక తెలుగు పాఠకునికి స్పష్టత కోసం ‘మందిరం’ను ఎంచుకుని, మూలరూపాన్ని పాదసూచికలో భద్రపరిచాం; దీని ద్వారా అదనపు మతశాఖాపరమైన భావన ఏదీ చేర్చబడదు.
- issue: దేవుని ముఖం/సన్నిధి నుండి విసరడం అనే నుడికారం
  choice: నా సన్నిధి నుండి విసిరివేస్తాను
  alternative: నా ముఖం ఎదుటనుండి విసిరివేస్తాను
  rationale: మూలంలోని ‘ముఖం’ అనే రూపకాన్ని తెలుగు నుడికారంలో ‘సన్నిధి’గా వ్యక్తపరచడం ద్వారా దైవ తిరస్కార భావం స్పష్టమవుతుంది; దేవుని స్వరూపం గురించి మూలం చెప్పనిదేదీ నిర్ణయించదు.
- issue: מָשָׁל మరియు שְׁנִינָה జతలోని భావ పరిధి
  choice: సామెతగా, అపహాస్యపు నానుడిగా
  alternative: ఎగతాళి మాటగా, అపహాస్య వస్తువుగా
  rationale: ఈ పదజత జ్ఞాపకార్థ నానుడి మరియు బహిరంగ అవమానం రెండింటినీ మోయగలదు. ప్రధాన పాఠ్యం రెండు కోణాలనూ నిలుపుతూ, ప్రత్యామ్నాయ భావాలను పాదసూచికలో సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. ‘పెకలించి వేస్తాను,’ ‘ప్రతిష్ఠించిన,’ ‘సన్నిధి’ వంటి పదాలు మూలంలోని భూసంబంధ, ఆరాధనా, దైవ తిరస్కార భావాలను సాధారణ పాఠకునికి అర్థమయ్యే విధంగా నిలుపుతాయి. పొడవైన హీబ్రూ వాక్యాన్ని తెలుగు పఠనసౌలభ్యం కోసం మూడు వాక్యాలుగా విభజించాం.
