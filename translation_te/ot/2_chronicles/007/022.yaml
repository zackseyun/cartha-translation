  revision_rationale: సవరణ మూలంలోని అర్థాన్ని మార్చకుండా, యెహోవాను కర్మగా స్పష్టంగా చేసి, నిర్గమణ సంబంధ ఉపవాక్యాన్ని దానితో సజావుగా కలిపింది. కారణం (‘విడిచిపెట్టి... సేవించారు’) మరియు ఫలితం (‘అందుకే... రప్పించాడు’) స్పష్టంగా నిలిచాయి. హత్తుకోవడం అనే రూపకం, నమస్కరించడం మరియు సేవించడం మధ్య క్రియాభేదం, అలాగే విపత్తు యొక్క తీర్పు-సందర్భార్థం కాపాడబడ్డాయి.
