- from: 'అప్పుడు వారు ఇలా అంటారు: “వారి పూర్వీకుల దేవుడైన యెహోవా—ఐగుప్తు దేశం నుండి వారిని బయటకు తీసుకొచ్చిన దేవుణ్ణి—వారు విడిచిపెట్టి, ఇతర దేవుళ్లను హత్తుకొని[a], వాటికి సాగిలపడి వాటిని సేవించారు. అందుకే ఆయన ఈ విపత్తంతటినీ[b] వారిమీదికి రప్పించాడు.”'
  to: 'అప్పుడు వారు ఇలా అంటారు: “వారి పూర్వీకుల దేవుడైన, ఐగుప్తు దేశం నుండి వారిని బయటకు తీసుకొచ్చిన యెహోవాను వారు విడిచిపెట్టి, ఇతర దేవుళ్లను హత్తుకొని[a], వారికి సాగిలపడి వారిని సేవించారు. అందుకే ఆయన ఈ విపత్తంతటినీ[b] వారిమీదికి రప్పించాడు.”'
  rationale: సవరణ మూలంలోని అర్థాన్ని మార్చకుండా, యెహోవాను కర్మగా స్పష్టంగా చేసి, నిర్గమణ సంబంధ ఉపవాక్యాన్ని దానితో సజావుగా కలిపింది. కారణం (‘విడిచిపెట్టి... సేవించారు’) మరియు ఫలితం (‘అందుకే... రప్పించాడు’) స్పష్టంగా నిలిచాయి. హత్తుకోవడం అనే రూపకం, నమస్కరించడం మరియు సేవించడం మధ్య క్రియాభేదం, అలాగే విపత్తు యొక్క తీర్పు-సందర్భార్థం కాపాడబడ్డాయి.
