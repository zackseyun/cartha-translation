source:
  edition: WLC
  text: וְ/אָמְר֗וּ עַל֩ אֲשֶׁ֨ר עָֽזְב֜וּ אֶת יְהוָ֣ה אֱלֹהֵ֣י אֲבֹתֵי/הֶ֗ם אֲשֶׁ֣ר הוֹצִיאָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יַּחֲזִ֨יקוּ֙ בֵּ/אלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּשְׁתַּחֲו֥וּ לָ/הֶ֖ם וַ/יַּֽעַבְד֑וּ/ם עַל כֵּן֙ הֵבִ֣יא עֲלֵי/הֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/022.yaml
  text: And they will say[a], ‘Because they forsook Yahweh, the God of their fathers, who brought them out of the land of Egypt, and embraced other gods, and bowed down to them and served them[b], therefore he has brought all this disaster on them.’
translation:
  language: te
  text: 'అప్పుడు వారు ఇలా అంటారు: “వారి పూర్వీకుల దేవుడైన, ఐగుప్తు దేశం నుండి వారిని బయటకు తీసుకొచ్చిన యెహోవాను వారు విడిచిపెట్టి, ఇతర దేవుళ్లను హత్తుకొని[a], వారికి సాగిలపడి వారిని సేవించారు. అందుకే ఆయన ఈ విపత్తంతటినీ[b] వారిమీదికి రప్పించాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇతర దేవుళ్లను గట్టిగా పట్టుకొని” లేదా “వాటికి అంటిపెట్టుకొని.” హీబ్రూ క్రియ అక్షరార్థంగా “పట్టుకోవడం” అని అర్థం; ఇక్కడ అది అన్య దేవుళ్లతో ఉద్దేశపూర్వకంగా బలమైన అనుబంధం ఏర్పరచుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “ఈ విపత్తంతా” అంటే నైతికమైన చెడు కాదు; తీర్పుగా వచ్చిన ఆపద లేదా వినాశనం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: అప్పుడు వారు ఇలా అంటారు
  rationale: మునుపటి వచనంలోని భవిష్యద్వాణిని కొనసాగిస్తూ, కారణాన్ని తెలిపే సమాధానాన్ని సహజమైన ఆధునిక తెలుగులో పరిచయం చేస్తుంది.
- source_word: עַל אֲשֶׁר
  choice: వారు ... అందుకే
  rationale: హీబ్రూ కారణార్థక నిర్మాణాన్ని తెలుగులో సహజమైన కారణ–ఫలిత వాక్య నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: עָזְבוּ
  choice: విడిచిపెట్టి
  rationale: దేవునితో ఉన్న నిబంధన సంబంధాన్ని ఉద్దేశపూర్వకంగా త్యజించడంలోని తీవ్రతను సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన నాలుగు హీబ్రూ అక్షరాల పేరును బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన రూపంలో అందిస్తుంది.
- source_word: אֱלֹהֵי אֲבֹתֵיהֶם
  choice: వారి పూర్వీకుల దేవుడు
  rationale: నిబంధన కొనసాగింపును కాపాడుతూ, ఆధునిక పాఠకులకు ‘పితరులు’ కంటే స్పష్టమైన సహజ తెలుగు వాడుకను ఎంచుకుంది.
- source_word: אֲשֶׁר הוֹצִיאָם מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుండి వారిని బయటకు తీసుకొచ్చిన
  rationale: నిర్గమణాన్ని సూచించే స్థిరమైన హీబ్రూ ప్రయోగాన్ని స్పష్టంగా, నేరుగా అనువదిస్తుంది.
- source_word: וַיַּחֲזִיקוּ בֵּאלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లను హత్తుకొని
  rationale: חזק ב యొక్క ‘గట్టిగా పట్టుకోవడం/అంటిపెట్టుకోవడం’ అనే రూపకాన్ని, ఆ దేవుళ్లతో ఉద్దేశపూర్వక అనుబంధాన్ని సూచించే సహజ తెలుగులో నిలుపుతుంది.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: వాటికి సాగిలపడి
  rationale: శారీరకంగా వంగి నమస్కరించే మూల భావాన్ని నిలుపుతూ, తరువాతి ‘సేవించారు’ అనే వేరైన క్రియతో కలపకుండా ఉంచుతుంది.
- source_word: וַיַּעַבְדוּם
  choice: వాటిని సేవించారు
  rationale: దేవతలకు చేసే ఆరాధనాత్మక సేవను సూచిస్తూ, ముందున్న సాగిలపడటంతో ఉన్న పదభేదాన్ని కాపాడుతుంది.
- source_word: עַל כֵּן
  choice: అందుకే
  rationale: ఇశ్రాయేలీయుల క్రియలకు వచ్చిన తీర్పును సహజమైన తెలుగు కారణ–ఫలిత సంధితో తెలియజేస్తుంది.
- source_word: הֵבִיא עֲלֵיהֶם
  choice: వారిమీదికి రప్పించాడు
  rationale: విపత్తును వారిమీదికి తెచ్చాడు అనే హిఫీల్ క్రియ యొక్క కారణార్థక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כָּל הָרָעָה הַזֹּאת
  choice: ఈ విపత్తంతటినీ
  rationale: רָעָה ఇక్కడ నైతిక చెడును కాక, తీర్పుగా వచ్చిన అపాయాన్ని సూచిస్తుంది; ‘విపత్తు’ ఆ సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: దైవ నామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవ నామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నిలుపుతుంది. తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపాన్ని ఎంచుకుంది; ఖచ్చితమైన ప్రాచీన ఉచ్చారణపై ఉన్న అనిశ్చితి కారణంగా ‘యాహ్వే’ కూడా సాధ్యమైన లిప్యంతరీకరణ.
- issue: חזק ב రూపకార్థం
  choice: హత్తుకొని
  alternative: గట్టిగా పట్టుకొని / అంటిపెట్టుకొని
  rationale: ఇతర దేవుళ్ల పట్ల ఉద్దేశపూర్వకమైన బలమైన అనుబంధాన్ని తెలిపే రూపకాన్ని నిలుపుతూ సహజమైన తెలుగు ఇస్తుంది; దీన్ని కేవలం సాధారణ ‘ఆరాధించారు’గా మార్చి మూలంలోని రూపకాన్ని చెరపలేదు.
- issue: רָעָה యొక్క తీర్పు సందర్భార్థం
  choice: విపత్తు
  alternative: కీడు / ఆపద
  rationale: ఇక్కడ పదం నైతిక దుష్టత్వాన్ని కాక దేవుని తీర్పుగా వచ్చిన నాశనకర పరిస్థితిని సూచిస్తుంది; అందువల్ల ‘విపత్తు’ సందర్భానికి తగినది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. మూలంలోని కారణ–ఫలిత సంబంధం, సాగిలపడటం మరియు సేవించడం మధ్యనున్న క్రియాభేదం, ఇతర దేవుళ్లను ‘పట్టుకోవడం’ అనే రూపకం నిలుపబడ్డాయి. సర్వనామ గందరగోళాన్ని తగ్గించడానికి మొదటి సూచనలో ‘దేవుణ్ణి’ అని స్పష్టం చేశాం.
