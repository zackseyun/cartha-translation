    rationale: ‘ఇతర దేవుళ్లు’ అనే వ్యక్తివాచక నామవాచకానికి ‘వారికి సాగిలపడి, వారిని సేవించి’ అనడం వాక్యంలోని అన్వయాన్ని స్పష్టం చేస్తుంది; మూలంలోని వారికి నమస్కరించడం, వారిని సేవించడం అనే వేర్వేరు క్రియలూ నిలుస్తాయి.
  revised_text: 'అప్పుడు వారు ఇలా అంటారు: “వారి పూర్వీకుల దేవుడైన, ఐగుప్తు దేశం నుండి వారిని బయటకు తీసుకొచ్చిన యెహోవాను వారు విడిచిపెట్టి, ఇతర దేవుళ్లను హత్తుకొని[a], వారికి సాగిలపడి వారిని సేవించారు. అందుకే ఆయన ఈ విపత్తంతటినీ[b] వారిమీదికి రప్పించాడు.”'
