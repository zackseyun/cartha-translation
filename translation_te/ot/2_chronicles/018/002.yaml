translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. కర్తను సందర్భం నుండి గుర్తించగలిగే చోట హెబ్రీలోని సర్వనామాన్ని ‘అతడు’గా నిలిపి, వివరణాత్మకంగా యెహోషాపాతు పేరును చేర్చలేదు. స్థలనామం మూలరూపానికి దగ్గరగా ‘రామోత్-గిలాదు’గా లిప్యంతరీకరించబడింది.
