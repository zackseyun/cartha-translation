id: 2CH.18.2
reference: 2 Chronicles 18:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּרֶד֩ לְ/קֵ֨ץ שָׁנִ֤ים אֶל אַחְאָב֙ לְ/שֹׁ֣מְר֔וֹן וַ/יִּֽזְבַּֽח ל֨/וֹ אַחְאָ֜ב צֹ֤אן וּ/בָקָר֙ לָ/רֹ֔ב וְ/לָ/עָ֖ם אֲשֶׁ֣ר עִמּ֑/וֹ וַ/יְסִיתֵ֕/הוּ לַ/עֲל֖וֹת אֶל רָמ֥וֹת גִּלְעָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/002.yaml
  text: After some years[a], he went down to Ahab in Samaria, and Ahab slaughtered sheep and cattle in abundance for him and for the people who were with him[b], and urged him to go up against Ramoth-gilead.
translation:
  language: te
  text: కొన్ని సంవత్సరాల తర్వాత అతడు సమరయలో ఉన్న అహాబు దగ్గరికి దిగివెళ్లాడు. అహాబు అతని కోసం, అతనితో ఉన్న ప్రజల కోసం విస్తారంగా గొర్రెలను, పశువులను వధించి, రామోత్-గిలాదు మీదికి వెళ్లేలా అతన్ని పురికొల్పాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అతన్ని ప్రలోభపెట్టాడు” లేదా “అతన్ని రెచ్చగొట్టాడు” అని కూడా అనువదించవచ్చు.
    reason: וַיְסִיתֵהוּ అనే క్రియలో ప్రేరేపించడం, ప్రలోభపెట్టడం లేదా రెచ్చగొట్టడం అనే బలమైన అర్థఛాయలు ఉన్నాయి.
  - marker: b
    text: అక్షరార్థంగా, “రామోత్-గిలాదుకు వెళ్లేలా”; సందర్భంలో ఇది ఆ పట్టణం మీదికి సైనికంగా వెళ్లడాన్ని సూచిస్తుంది.
    reason: אֶל అనే పదానికి అక్షరార్థం ‘వైపుకు/దగ్గరికి’; యుద్ధ సందర్భం వల్ల ‘మీదికి’ అనే భావం వస్తుంది.
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: దిగివెళ్లాడు
  rationale: యూదా నుండి సమరయకు ప్రయాణంలోని దిశను, భౌగోళిక దిగువకు వెళ్లడాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לְקֵץ שָׁנִים
  choice: కొన్ని సంవత్సరాల తర్వాత
  rationale: అక్షరార్థమైన ‘సంవత్సరాల ముగింపులో’ అనే హెబ్రీ నుడికారానికి సహజమైన కాలార్థాన్ని ఇస్తుంది; సంవత్సరాల సంఖ్యను అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: אֶל אַחְאָב לְשֹׁמְרוֹן
  choice: సమరయలో ఉన్న అహాబు దగ్గరికి
  rationale: ప్రయాణ గమ్యమైన అహాబును, అతని స్థలమైన సమరయను స్పష్టంగా అనుసంధానిస్తుంది.
- source_word: וַיִּזְבַּח לוֹ אַחְאָב
  choice: అహాబు అతని కోసం ... వధించి
  rationale: ఇక్కడ రాజసత్కారం, విందు సందర్భం కనిపిస్తుంది; స్పష్టమైన ఆరాధనా బలి భావాన్ని చేర్చకుండా జంతువులను చంపిన క్రియను నిలుపుతుంది.
- source_word: צֹאן וּבָקָר
  choice: గొర్రెలను, పశువులను
  rationale: రెండు పశువర్గాలను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לָרֹב
  choice: విస్తారంగా
  rationale: వధించిన జంతువుల సమృద్ధిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְלָעָם אֲשֶׁר עִמּוֹ
  choice: అతనితో ఉన్న ప్రజల కోసం
  rationale: עָם అనే విస్తృత పదాన్ని సైనికులు లేదా పరివారం అని అనవసరంగా కుదించకుండా నిలుపుతుంది.
- source_word: וַיְסִיתֵהוּ
  choice: అతన్ని పురికొల్పాడు
  rationale: సాధారణ ఒప్పించడం కంటే బలమైన ప్రేరణ లేదా ప్రలోభపెట్టే ఛాయను సూచిస్తుంది; అయితే పదంలోని సంభావ్య ప్రతికూలతను పూర్తిగా ఒకే అర్థానికి పరిమితం చేయదు.
- source_word: לַעֲלוֹת אֶל רָמוֹת גִּלְעָד
  choice: రామోత్-గిలాదు మీదికి వెళ్లేలా
  rationale: ‘వెళ్లడం/ఎక్కివెళ్లడం’ అనే మూలచలనాన్ని ఉంచుతూ, ‘మీదికి’ ద్వారా సందర్భంలోని సైనిక లక్ష్యాన్ని సహజంగా సూచిస్తుంది; అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
