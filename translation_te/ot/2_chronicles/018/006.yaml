id: 2CH.18.6
reference: 2 Chronicles 18:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט הַ/אֵ֨ין פֹּ֥ה נָבִ֛יא לַ/יהוָ֖ה ע֑וֹד וְ/נִדְרְשָׁ֖ה מֵ/אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/006.yaml
  text: But Jehoshaphat said[a], “Is there not still here a prophet of Yahweh[b], that we may inquire of him?”
translation:
  language: te
  text: అయితే యెహోషాపాతు, “ఇక్కడ యాహ్వే ప్రవక్త ఇంకా ఉన్నాడా? మనం అతని వద్ద విచారిద్దాం” అని అడిగాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అయితే ... అడిగాడు
  rationale: వావ్-క్రమ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ముందున్న ప్రవక్తల ఏకాభిప్రాయానికి యెహోషాపాతు స్పందిస్తున్న వ్యత్యాసాన్ని ‘అయితే’ సహజంగా తెలియజేస్తుంది. వాక్యం ప్రశ్న కావడంతో తెలుగులో ‘అడిగాడు’ సహజం.
- source_word: יְהוֹשָׁפָט
  choice: యెహోషాపాతు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపానికి సమీపంగా లిప్యంతరీకరించింది.
- source_word: הַאֵין
  choice: లేడా?
  rationale: ప్రతికూల ప్రశ్న యొక్క నిర్ధారణ కోరే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: פֹּה
  choice: ఇక్కడ
  rationale: స్థలాన్ని సూచించే సాధారణ క్రియావిశేషణానికి నేరమైన తెలుగు సమానం.
- source_word: נָבִיא לַיהוָה
  choice: యెహోవా ప్రవక్త
  rationale: లామెద్ సూచించే సంబంధం లేదా ప్రతినిధిత్వాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עוֹד
  choice: మరొకడు
  rationale: ఇప్పటికే సంప్రదించిన ప్రవక్తలకు అదనంగా ఇంకొక ప్రవక్త ఉన్నాడా అనే సందర్భార్థాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ‘ఇంకా’ అనే రూపం కూడా సాధ్యం.
- source_word: וְנִדְרְשָׁה
  choice: మనం విచారిద్దాం
  rationale: మొదటి పురుష బహువచన కోహోర్టేటివ్ ప్రతిపాదన భావాన్ని నిలుపుతుంది; ఇక్కడ దేవుని చిత్తాన్ని ప్రవక్త ద్వారా తెలుసుకోవడం ఉద్దేశం.
- source_word: מֵאֹתוֹ
  choice: అతని ద్వారా
  rationale: ప్రవక్త మధ్యవర్తిత్వం ద్వారా యెహోవా సమాధానాన్ని కోరే సందర్భార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది; అక్షరార్థంగా ‘అతని వద్ద’ కూడా సాధ్యం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ పాఠంలో చతురక్షర దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగు పాఠకులకు సుపరిచితమైన వ్యక్తినామ రూపం ‘యెహోవా’గా అందించింది; మూల ఉచ్చారణను ప్రతిబింబించడానికి ‘యాహ్వే’ ప్రత్యామ్నాయం.
- issue: ప్రవక్తతో విచారణ స్వరూపం
  choice: అతని ద్వారా మనం విచారిద్దాం
  alternative: అతని వద్ద మనం విచారిద్దాం
  rationale: విచారణ అంతిమంగా యెహోవాను ఉద్దేశించినదైనా, వాక్యంలో מֵאֹתוֹ ప్రవక్తను సూచిస్తుంది. ‘ద్వారా’ మధ్యవర్తిత్వ సందర్భాన్ని స్పష్టం చేస్తుంది; ‘వద్ద’ మూల విభక్తిని మరింత నేరుగా ప్రతిబింబిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే కథన శైలి. మూలంలోని సంక్షిప్త ప్రశ్న-ప్రతిపాదన నిర్మాణాన్ని సహజ తెలుగు క్రమంలో ఉంచింది.
