source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר רָאִ֤יתִי אֶת כָּל יִשְׂרָאֵל֙ נְפוֹצִ֣ים עַל הֶֽ/הָרִ֔ים כַּ/צֹּ֕אן אֲשֶׁ֥ר אֵין לָ/הֶ֖ן רֹעֶ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ לֹֽא אֲדֹנִ֣ים לָ/אֵ֔לֶּה יָשׁ֥וּבוּ אִישׁ לְ/בֵית֖/וֹ בְּ/שָׁלֽוֹם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/016.yaml
  text: And he said[a], “I saw all Israel scattered on the mountains, like sheep that have no shepherd. And Yahweh said, ‘These have no master[b]; let each man return to his house in peace.’”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “కాపరి లేని గొర్రెల్లా[a] పర్వతాల మీద చెల్లాచెదురుగా ఉన్న ఇశ్రాయేలు ప్రజలందరినీ నేను చూశాను. యహ్వే, ‘వీరికి అధిపతులు లేరు[b]; ప్రతి ఒక్కరూ తమ తమ ఇంటికి క్షేమంగా తిరిగి వెళ్లాలి’ అని చెప్పాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కాపరి లేని గొర్రెలవలె.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “వీరికి అధిపతులు లేరు” అని బహువచనం ఉంది. సందర్భార్థాన్ని బట్టి కొందరు దీనిని “వీరికి అధిపతి లేడు” అని ఏకవచనంలో అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְפוֹצִים
  choice: చెల్లాచెదురై
  rationale: పరాజయం తరువాత ప్రజలు విడిపోయి వివిధ చోట్లకు చెదరిపోయిన దృశ్యాన్ని ఈ నిష్క్రియార్థక రూపం సూచిస్తుంది; ‘చెల్లాచెదురై’ ఆ సైనిక-కాపరి దృశ్యాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עַל הֶהָרִים
  choice: పర్వతాల మీద
  rationale: ఇది స్థలాన్ని నేరుగా సూచించే పదబంధం; הָרִיםకు ‘పర్వతాలు’ సమీపమైన తెలుగు సమానం.
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶן רֹעֶה
  choice: కాపరి లేని గొర్రెల్లా
  rationale: హీబ్రూ ఉపమానాన్ని పూర్తిగా ఉంచుతూ, ఆధునిక తెలుగులో సహజంగా వినిపించే సంక్షిప్త నిర్మాణాన్ని ఎంచుకున్నాం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, వ్యక్తిగత నామంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: לֹא אֲדֹנִים לָאֵלֶּה
  choice: వీరికి యజమానులు లేరు
  rationale: אֲדֹנִים వ్యాకరణపరంగా బహువచనం; ప్రజలు పాలక నాయకత్వం లేకుండా మిగిలారని తెలిపే రాజకీయ-సైనిక భావాన్ని ‘యజమానులు’ నిలుపుతుంది.
- source_word: יָשׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: ప్రతి ఒక్కడూ తన ఇంటికి ... తిరిగి వెళ్లాలి
  rationale: అసంపూర్ణ క్రియకు ఇక్కడ ఆజ్ఞార్థక/అనుమతార్థక బలం ఉంది; ఈ తెలుగు నిర్మాణం దానిని సహజంగా వ్యక్తం చేస్తూ אִישׁలోని వ్యక్తివ్యాప్తిని నిలుపుతుంది.
- source_word: בְּשָׁלוֹם
  choice: క్షేమంగా
  rationale: ఇంటికి అపాయం లేకుండా సురక్షితంగా చేరే సందర్భంలో בְּשָׁלוֹם యొక్క సామెతాత్మక భావాన్ని ‘క్షేమంగా’ సహజంగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా వాడుతుంది. కాబట్టి దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని వ్యక్తిగత నామాన్ని నిలుపుతుంది.
- issue: אֲדֹנִים యొక్క వచనం మరియు భావం
  choice: యజమానులు
  alternative: యజమాని / ప్రభువు
  rationale: మూలంలో పదం బహువచనంలో ఉంది. దాన్ని నిలుపుకోవడం ఇశ్రాయేలు పాలక నాయకత్వం లేని స్థితిని తెలియజేస్తుంది; ఇక్కడ అది దేవునికి సంబంధించిన బిరుదు కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. ప్రవచన దృశ్యంలోని కాపరి ఉపమానాన్ని సహజమైన తెలుగు పదక్రమంలో ఉంచి, దైవనామాన్ని వ్యక్తిగత నామంగా, אֲדֹנִים బహువచనాన్ని స్పష్టంగా నిలిపాం.
