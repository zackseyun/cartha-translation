revisions:
- from: 'అతడు ఇలా అన్నాడు: “కాపరి లేని గొర్రెల్లా[a] ఇశ్రాయేలీయులందరూ పర్వతాల మీద చెల్లాచెదురై ఉండడం నేను చూశాను. అప్పుడు యహ్వే, ‘వీరికి యజమానులు లేరు[b]; ప్రతి ఒక్కడూ తన ఇంటికి క్షేమంగా తిరిగి వెళ్లాలి’ అని చెప్పాడు.”'
  to: 'అతడు ఇలా అన్నాడు: “కాపరి లేని గొర్రెల్లా[a] పర్వతాల మీద చెల్లాచెదురుగా ఉన్న ఇశ్రాయేలు ప్రజలందరినీ నేను చూశాను. యహ్వే, ‘వీరికి అధిపతులు లేరు[b]; ప్రతి ఒక్కరూ తమ తమ ఇంటికి క్షేమంగా తిరిగి వెళ్లాలి’ అని చెప్పాడు.”'
  rationale: The revision improves modern Telugu flow, makes the ruling/leadership nuance of plural אֲדֹנִים clear, and corrects the explanatory wording of footnote a. It retains the source’s imagery, plural ambiguity, divine name, distributive return, and ‘in peace/safely’ sense.
