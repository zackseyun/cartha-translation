source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מִיכָ֔יְהוּ הִנְּ/ךָ֥ רֹאֶ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא אֲשֶׁ֥ר תָּב֛וֹא חֶ֥דֶר בְּ/חֶ֖דֶר לְ/הֵחָבֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/024.yaml
  text: Micaiah said[a], “Behold, you will see on that day when you go into an inner room to hide yourself.”
translation:
  language: te
  text: మీకాయా, “ఇదిగో, నీవు దాక్కోవడానికి లోపలి గదిలోకి వెళ్లే ఆ రోజున చూస్తావు” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: మీకాయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక ప్రామాణిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הִנְּךָ
  choice: ఇదిగో
  rationale: తరువాత చెప్పబోయే నిశ్చితమైన విషయంపై శ్రద్ధ నిలిపే హీబ్రూ సూచనాత్మక పదం యొక్క బలాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: רֹאֶה
  choice: నీకే తెలుస్తుంది
  rationale: రూపపరంగా ‘చూస్తున్నావు’ అనే participle అయినా, הִנְּךָ తరువాత సందర్భంలో ఇది భవిష్యత్తులో జెదెకీయా స్వయంగా నిజాన్ని గ్రహించే అనుభవాన్ని సూచిస్తుంది. తెలుగులో ‘నీకే తెలుస్తుంది’ ఆ సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజున
  rationale: హీబ్రూ కాలసూచక నుడికారానికి దగ్గరగా ఉండే సహజమైన తెలుగు రూపం.
- source_word: אֲשֶׁר תָּבוֹא
  choice: వెళ్లే
  rationale: దాక్కోవడానికి గదిలోకి కదలడాన్ని సందర్భానుసారంగా సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: חֶדֶר בְּחֶדֶר
  choice: గది లోపలి గదిలోకి
  rationale: పునరుక్త హీబ్రూ నిర్మాణం లోపలి రహస్య గదిలోకి వెళ్లడాన్ని సూచించవచ్చు. ఈ భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, ‘ఒక గది నుంచి మరో గదికి’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: לְהֵחָבֵא
  choice: దాక్కోవడానికి
  rationale: నిఫాల్ క్రియారూపంలోని ఆత్మనిర్దేశక భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
