  terminology: ‘ఇశ్రాయేలు రాజు,’ ‘యెహోషాపాతు,’ ‘మారువేషం,’ మరియు ‘రాజవస్త్రాలు’ స్థిరంగా, సందర్భానుకూలంగా ఉన్నాయి. ‘రాజవస్త్రాలు’ అనేది בגדים యొక్క సందర్భాధారిత నిర్దిష్టీకరణ; ఇద్దరు రాజుల యుద్ధసందర్భంలో ఇది సమర్థనీయమైనది.
