source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ מֶ֨לֶךְ יִשְׂרָאֵ֜ל אֶל יְהוֹשָׁפָ֗ט הִתְחַפֵּשׂ֙ וָ/ב֣וֹא בַ/מִּלְחָמָ֔ה וְ/אַתָּ֖ה לְבַ֣שׁ בְּגָדֶ֑י/ךָ וַ/יִּתְחַפֵּשׂ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יָּבֹ֖אוּ בַּ/מִּלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/029.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Disguise yourself and go into the battle, but you, put on your robes.” So the king of Israel disguised himself, and they went into the battle.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు రాజు యెహోషాపాతుతో, “నేను మారువేషం వేసుకొని యుద్ధంలోకి వెళ్తాను; అయితే నువ్వు నీ రాజవస్త్రాలు ధరించు” అన్నాడు.[a] ఇశ్రాయేలు రాజు మారువేషం వేసుకున్నాడు; వారిద్దరూ యుద్ధంలోకి వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మాటలు చాలా సంక్షిప్తంగా ఉండి, అక్షరార్థంగా “మారువేషం వేసుకొని యుద్ధంలోకి వెళ్లు” అని కూడా అర్థం చేసుకోవచ్చు. అయితే తరువాతి మాటలూ, ఇశ్రాయేలు రాజే మారువేషం వేసుకున్నాడనే కథనమూ ఇక్కడ “నేను మారువేషం వేసుకొని వెళ్తాను” అనే భావాన్ని సూచిస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְחַפֵּשׂ
  choice: నేను మారువేషం వేసుకొని
  rationale: రూపం సందర్భరహితంగా చూస్తే సంక్షిప్తమై సందిగ్ధంగా ఉంది; అయితే తరువాతి విరుద్ధ వాక్యం, కథనంలోని וַיִּתְחַפֵּשׂ מֶלֶךְ יִשְׂרָאֵל ఆధారంగా ఇశ్రాయేలు రాజే తనను ఉద్దేశించి మాట్లాడుతున్న భావాన్ని ప్రధాన పాఠ్యంలో సహజంగా వ్యక్తం చేశాం.
- source_word: וָבוֹא
  choice: యుద్ధంలోకి వెళ్తాను
  rationale: בוא యొక్క ప్రవేశ భావాన్ని, బేత్ ఉపసర్గతో ఉన్న בַמִּלְחָמָהతో కలిపి సహజ తెలుగు గమనార్థకంగా అందిస్తుంది.
- source_word: לְבַשׁ בְּגָדֶיךָ
  choice: నీ రాజవస్త్రాలు ధరించు
  rationale: בגדים సాధారణంగా వస్త్రాలు; రాజుల యుద్ధ సందర్భంలో గుర్తించదగిన అధికారిక వస్త్రాలు ఉద్దేశించబడినందున ‘రాజవస్త్రాలు’ సందర్భానుకూలం.
- source_word: וְאַתָּה
  choice: అయితే నువ్వు
  rationale: ఇశ్రాయేలు రాజు మారువేషానికి, యెహోషాపాతు తన వస్త్రాలు ధరించడానికి మధ్య ఉన్న వ్యత్యాసాన్ని తెలియజేస్తుంది.
- source_word: וַיָּבֹאוּ
  choice: వారిద్దరూ ... వెళ్లారు
  rationale: బహువచన క్రియ ఇద్దరు రాజులను సూచిస్తుంది; తెలుగులో సూచ్యం స్పష్టంగా ఉండేందుకు ‘వారిద్దరూ’ వాడాం.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: బిరుదుకు నేరమైన, సహజ తెలుగు అనువాదం.
- source_word: יְהוֹשָׁפָט
  choice: యెహోషాపాతు
  rationale: తెలుగు బైబిలు వినియోగంలో సుపరిచితమైన పేరురూపం.
theological_decisions:
- issue: మాట్లాడుతున్న రాజు మారువేషం వేసుకుంటాడా, లేక యెహోషాపాతుకు ఆజ్ఞ ఇస్తున్నాడా?
  choice: ప్రధాన పాఠ్యంలో ‘నేను మారువేషం వేసుకొని ... వెళ్తాను’
  alternative: ‘నువ్వు మారువేషం వేసుకొని ... వెళ్లు’
  rationale: మసొరా స్వరచిహ్నాలతో రూపం infinitive absolute గా పఠించబడుతుంది; వెంటనే వచ్చే ‘అయితే నువ్వు నీ వస్త్రాలు ధరించు’ అనే వ్యత్యాసం, తరువాత ఇశ్రాయేలు రాజే మారువేషం వేసుకున్నాడనే కథనం మొదటి వ్యక్తి భావానికి బలమైన సందర్భ ఆధారం. రూపంలోని సంక్షిప్తతను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ప్రత్యక్ష సంభాషణలో ‘నువ్వు’ వాడటం రాజుల మధ్య ఏకవచన సంబోధనను స్పష్టంగా ఉంచుతుంది. ప్రధాన పాఠ్యంలో సందర్భబద్ధమైన మొదటి వ్యక్తి పఠనాన్ని తీసుకుని, నిజమైన హీబ్రూ సంక్షిప్తత/ప్రత్యామ్నాయ పఠనాన్ని [a] పాదటిప్పణిలో సంరక్షించాం.
