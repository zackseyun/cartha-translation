  source_fidelity: ప్రధాన పాఠ్యం హీబ్రూ యొక్క సందర్భబద్ధమైన భావాన్ని సరిగ్గా అందిస్తుంది. הִתְחַפֵּשׂ అనే సంక్షిప్త రూపాన్ని తరువాతి వ్యత్యాస వాక్యం (‘అయితే నువ్వు...’) మరియు ఇశ్రాయేలు రాజే మారువేషం వేసుకున్నాడని చెప్పే కథనం వెలుగులో మొదటి వ్యక్తిగా అనువదించడం సముచితం. וַיָּבֹאוּ యొక్క బహువచనాన్ని ‘వారిద్దరూ’తో స్పష్టం చేయడం కూడా సరైనది.
