source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מִיכָ֔יְהוּ אִם שׁ֤וֹב תָּשׁוּב֙ בְּ/שָׁל֔וֹם לֹא דִבֶּ֥ר יְהוָ֖ה בִּ֑/י וַ/יֹּ֕אמֶר שִׁמְע֖וּ עַמִּ֥ים כֻּלָּֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/027.yaml
  text: And Micaiah said[a], “If you indeed return in peace, Yahweh has not spoken by me.” Then he said, “Hear[b], all you peoples!”
translation:
  language: te
  text: 'మీకాయా ఇలా అన్నాడు: “నీవు నిజంగా క్షేమంగా తిరిగి వస్తే, యాహ్వే నా ద్వారా[a] మాట్లాడలేదు.” అప్పుడు అతడు ఇలా అన్నాడు: “ప్రజలారా,[b] మీరందరూ వినండి!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నాలో”; సందర్భానుసారంగా, “నా ద్వారా” లేదా “నన్ను సాధనంగా చేసుకొని.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “ప్రజలు” బహువచనంలో ఉంది; ఇది అక్కడున్న ఒకే సమూహాన్ని మించిన విస్తృత ప్రవచన సంబోధన కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: మీకాయా
  rationale: హీబ్రూ వ్యక్తినామానికి ఆధునిక తెలుగు లిప్యంతరీకరణ.
- source_word: אִם שׁוֹב תָּשׁוּב
  choice: నువ్వు నిజంగా ... తిరిగి వస్తే
  rationale: క్రియతో కూడిన infinitive absolute ఇచ్చే షరతుతో కూడిన ఉద్ఘాటనను సహజమైన తెలుగులో ‘నిజంగా’ ద్వారా నిలిపింది.
- source_word: בְּשָׁלוֹם
  choice: క్షేమంగా
  rationale: ఈ సందర్భంలో రాజు యుద్ధం నుండి హాని లేకుండా తిరిగి రావడాన్ని సూచిస్తుంది; ‘క్షేమంగా’ అర్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לֹא דִבֶּר יְהוָה בִּי
  choice: యాహ్వే నా ద్వారా మాట్లాడలేదు
  rationale: בִּי యొక్క సాధనార్థక భావాన్ని తెలుగులో స్పష్టంగా చూపుతూ, ప్రవచనం మీకాయా ద్వారా పలికించబడిందనే భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యనుసారంగా అందిస్తుంది.
- source_word: שִׁמְעוּ
  choice: వినండి
  rationale: బహువచన ఆజ్ఞారూపాన్ని గంభీరమైన, సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: עַמִּים כֻּלָּם
  choice: ప్రజలారా, మీరందరూ
  rationale: עַמִּים అనే బహువచనాన్ని విస్తృత ప్రవచన పిలుపుగా ఉంచి, כֻּלָּם లోని ‘అందరూ’ భావాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది; అందువల్ల బిరుదైన ‘ప్రభువు’కు బదులుగా దానిని లిప్యంతరీకరించడం సముచితం. ‘యాహ్వే’ హీబ్రూ నామానికి దగ్గరైన రూపం.
- issue: చివరి వాక్యంలోని వక్త
  choice: మీకాయానే మాట్లాడటం కొనసాగించాడు
  alternative: కొత్త వక్తను ఊహించడం
  rationale: హీబ్రూ కేవలం ‘అతడు అన్నాడు’ అని చెబుతుంది; సమీపంలో స్పష్టంగా పేర్కొన్న వక్త మీకాయా. కాబట్టి వక్తను మార్చకుండా ఉంచింది.
- issue: עַמִּים అనే బహువచన సంబోధన
  choice: ప్రజలారా
  alternative: ప్రజా; అక్కడున్న వారందరూ
  rationale: మూలంలోని బహువచనం విస్తృతమైన ప్రవచన పిలుపును సూచించగలదు. దాన్ని కేవలం సభలోని ఒక్క సమూహానికి పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ప్రవచన సందర్భానికి తగిన గంభీరతను ఉంచింది. రాజును ఉద్దేశించిన ఏకవచనానికి ‘నువ్వు’ వాడింది; చివరి పిలుపులో బహువచన సంబోధనను స్పష్టంగా నిలిపింది.
