  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה מִ֤י יְפַתֶּה֙ אֶת אַחְאָ֣ב מֶֽלֶךְ יִשְׂרָאֵ֔ל וְ/יַ֕עַל וְ/יִפֹּ֖ל בְּ/רָמ֣וֹת גִּלְעָ֑ד וַ/יֹּ֕אמֶר זֶ֚ה אֹמֵ֣ר כָּ֔כָה וְ/זֶ֖ה אֹמֵ֥ר כָּֽכָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/019.yaml
  text: And Yahweh said[a], ‘Who will entice Ahab king of Israel, so that he may go up and fall at Ramoth-gilead?’ And one said this, and another said that.
translation:
  language: te
  text: 'అప్పుడు యాహ్వే ఇలా అన్నాడు: “ఇశ్రాయేలు రాజైన అహాబును రామోత్-గిలాదుకు వెళ్లి అక్కడ పడిపోయేలా ఎవరు ప్రలోభపెడతారు[a]?” అప్పుడు ఒకరు ఒక విధంగా చెప్పారు, మరొకరు మరొక విధంగా చెప్పారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఒప్పిస్తారు”; లేదా “మోసగిస్తారు.”
    reason: פתה అనే హెబ్రీ క్రియకు సందర్భానుసారం ఈ అర్థాలు కూడా ఉండవచ్చు.
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: יְפַתֶּה
  choice: ప్రలోభపెడతారు
  rationale: పియేల్ రూపంలోని ఈ క్రియకు ప్రలోభపెట్టు, ఒప్పించు, మోసగించు అనే భావాలు ఉండవచ్చు. అహాబును వినాశనకరమైన చర్యకు పురికొల్పే భావాన్ని ఉంచుతూ, ‘మోసగించు’ అనే అర్థానికే పరిమితం కాకుండా ఈ పదాన్ని ఎంచుకున్నాం.
- source_word: וְיַעַל וְיִפֹּל
  choice: వెళ్లి అక్కడ పతనమయ్యేలా
  rationale: రామోత్-గిలాదు ఎత్తైన ప్రాంతమైనప్పటికీ, సహజమైన ఆధునిక తెలుగులో ప్రయాణాన్ని ‘వెళ్లి’ అని చెప్పాం; נפל యొక్క ‘పడిపోవు/పతనమవు’ యుద్ధసందర్భ భావాన్ని ‘పతనమవు’గా నిలిపాం.
- source_word: בְּרָמוֹת גִּלְעָד
  choice: రామోత్-గిలాదుకు … అక్కడ
  rationale: గమ్యాన్ని తెలుగులో సహజంగా ‘-కు’తో, సంఘటన స్థలాన్ని ‘అక్కడ’తో వ్యక్తం చేశాం; స్థలనామాన్ని లిప్యంతరీకరించాం.
- source_word: זֶה אֹמֵר כָּכָה וְזֶה אֹמֵר כָּכָה
  choice: ఒకరు ఒక విధంగా చెప్పారు, మరొకరు మరొక విధంగా చెప్పారు
  rationale: వేర్వేరు ప్రతిపాదనలు వినిపించాయనే హెబ్రీ సమాంతర నిర్మాణాన్ని సహజమైన తెలుగులో పునరావృతితో నిలిపాం.
theological_decisions:
- issue: అహాబు పతనంలో యెహోవా ప్రమేయం
  choice: అహాబును ప్రలోభపెట్టడానికి ఎవరు ముందుకు వస్తారని యెహోవా నేరుగా అడిగినట్లే అనువదించాం.
  alternative: దేవుడు కేవలం అనుమతించినట్లు లేదా పరోక్షంగా ప్రభావితం చేసినట్లు మృదువుగా చెప్పడం.
  rationale: మూలపాఠం దైవిక చొరవను నేరుగా చూపుతుంది. దానిలోని నైతిక-దైవశాస్త్రీయ ఉద్రిక్తతను అనువాదంలో తగ్గించలేదు.
- issue: פתה క్రియలోని నైతిక భావఛాయ
  choice: ప్రధాన పాఠంలో ‘ప్రలోభపెట్టు’ వాడి, ప్రత్యామ్నాయ అర్థాలను పాదటిప్పణిలో ఇచ్చాం.
  alternative: ‘ఒప్పించు’ లేదా ‘మోసగించు’ అని ఏకార్థంగా ఇవ్వడం.
  rationale: సందర్భంలో తప్పుదారి పట్టించే యోచన ఉన్నా, ఈ క్రియ స్వయంగా ఒక్క ‘మోసం’ భావానికే పరిమితం కాదు. అందువల్ల అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. దైవనామాన్ని ‘యెహోవా’గా ఉంచి, పరలోక సభలోని భిన్న ప్రతిపాదనలను సహజమైన సమాంతర వాక్యంతో వ్యక్తం చేశాం.
