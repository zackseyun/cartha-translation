  naturalness: The revised wording is fluent modern standard Telugu. ‘పడిపోయేలా’ naturally conveys the purposive/result sense without unnecessarily explaining ‘fall’ as death or defeat. The final parallel sentence retains the deliberate repetition of the Hebrew while reading naturally.
