  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֨ה נָתַ֤ן יְהוָה֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י נְבִיאֶ֣י/ךָ אֵ֑לֶּה וַֽ/יהוָ֔ה דִּבֶּ֥ר עָלֶ֖י/ךָ רָעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/022.yaml
  text: And now, look, the LORD has put a lying spirit in the mouth of these prophets of yours, and the LORD has spoken disaster against you.
translation:
  language: te
  text: ఇప్పుడు, చూడు, యెహోవా ఈ నీ ప్రవక్తల నోటిలో అబద్ధపు ఆత్మను ఉంచాడు; యెహోవా నీ మీద విపత్తును ప్రకటించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה הִנֵּה
  choice: ఇప్పుడు ఇదిగో
  rationale: కాలసూచనతో పాటు శ్రద్ధ ఆకర్షించే హీబ్రూ ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలోని దైవనామాన్ని బిరుదుగా మార్చకుండా తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో ప్రతిబింబిస్తుంది.
- source_word: רוּחַ שֶׁקֶר
  choice: అబద్ధపు ఆత్మ
  rationale: רוּחַ అనే పదంలోని 'ఆత్మ' భావాన్ని, שֶׁקֶר లోని మోసకరమైన అబద్ధ స్వభావాన్ని నేరుగా కాపాడుతుంది.
- source_word: בְּפִי נְבִיאֶיךָ אֵלֶּה
  choice: నీ ఈ ప్రవక్తల నోట
  rationale: ఏకవచన 'నోట' అనే హీబ్రూ సమూహప్రయోగాన్ని, రాజుతో నేరుగా మాట్లాడే 'నీ' భావాన్ని నిలుపుతుంది.
- source_word: דִּבֶּר עָלֶיךָ רָעָה
  choice: నీకు విపత్తు కలుగుతుందని ప్రకటించాడు
  rationale: ఇక్కడ רָעָה నైతిక చెడుకన్నా రాజుపై రానున్న దుర్ఘటనను సూచిస్తుంది; דִּבֶּר עָלֶיךָ ను సందర్భానుసారంగా తీర్పు ప్రకటనగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుడు అబద్ధపు ఆత్మను ఉంచాడనే కఠిన వాక్యం
  choice: మూలంలోని ప్రత్యక్ష కారణప్రయోగాన్ని యథాతథంగా ఉంచడం
  alternative: దేవుడు కేవలం అబద్ధపు ఆత్మను అనుమతించాడని సున్నితీకరించడం
  rationale: נָתַן అనే క్రియ 'ఉంచాడు/ఇచ్చాడు' అని స్పష్టంగా చెబుతుంది. దేవుని సార్వభౌమత్వం, మోసకర ఆత్మ యొక్క పాత్ర మధ్య ఉన్న వేదాంత ఉద్రిక్తతను అనువాదం స్వయంగా పరిష్కరించకూడదు.
- issue: רָעָה యొక్క అర్థం
  choice: విపత్తు
  alternative: చెడు
  rationale: ఈ తీర్పు సందర్భంలో రాజుపై ప్రకటించబడిన అపాయం లేదా దుర్ఘటన ఉద్దేశ్యం; దేవుడు నైతిక దుష్టత్వాన్ని ప్రకటించాడనే అపార్థాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకుడికి స్పష్టంగా ఉండే వాక్యనిర్మాణం. మూలంలోని 'ఇదిగో' ఉద్ఘాటనను, దైవనామాన్ని, కఠిన కారణప్రయోగాన్ని నిలిపింది.
