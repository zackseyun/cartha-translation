id: 2CH.18.25
reference: 2 Chronicles 18:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל קְחוּ֙ אֶת מִיכָ֔יְהוּ וַ/הֲשִׁיבֻ֖/הוּ אֶל אָמ֣וֹן שַׂר הָ/עִ֑יר וְ/אֶל יוֹאָ֖שׁ בֶּן הַ/מֶּֽלֶךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/025.yaml
  text: Then the king of Israel said[a], “Take Micaiah and return him to Amon, the governor of the city[b], and to Joash the king’s son.”
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు రాజు, “మీకాయాను తీసుకొని, పట్టణ అధికారి[a] ఆమోను దగ్గరికీ, రాజు కుమారుడు[b] యోవాషు దగ్గరికీ తిరిగి తీసుకెళ్లండి” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పట్టణ సేనాధిపతి.” హీబ్రూ పదం పౌర లేదా సైనిక అధికారిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “రాజు కొడుకు.” దీన్ని “యువరాజు” అని అనువదించడం సాధ్యమే అయినా, మూలంలో నిర్దిష్టమైన అధికార హోదా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... చెప్పాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: మూలంలోని బిరుదును అలాగే ఉంచింది; సందర్భంలోని వ్యక్తి పేరు ‘అహాబు’ను పాఠ్యంలో చేర్చలేదు.
- source_word: קְחוּ אֶת־מִיכָיְהוּ
  choice: మీకాయాను తీసుకొని
  rationale: לקח అనే క్రియకు సాధారణ అర్థమైన ‘తీసుకొను’ను వాడింది; ‘పట్టుకోండి’ లేదా ‘బంధించండి’ అని అనవసరంగా బలమైన భావాన్ని చేర్చలేదు.
- source_word: וַהֲשִׁיבֻהוּ
  choice: తిరిగి తీసుకెళ్లండి
  rationale: שׁוב హిఫీల్ రూపం ‘తిరిగి వెళ్లేలా చేయడం’ అనే భావాన్ని ఇస్తుంది; తెలుగులో సహజంగా ఉండేలా వ్యక్తిని వెనక్కి తీసుకెళ్లడంగా అనువదించింది.
- source_word: שַׂר הָעִיר
  choice: పట్టణ అధికారి
  rationale: שַׂר పౌర పరిపాలకుడినీ సైనిక అధికారినీ సూచించగలదు. ‘అధికారి’ మూలంలోని విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: וְאֶל יוֹאָשׁ
  choice: యోవాషు దగ్గరికీ
  rationale: పునరుక్తమైన אֶל ను రెండవ గమ్యస్థాన సూచనగా తెలుగులో ‘దగ్గరికీ’తో వ్యక్తం చేసింది.
- source_word: בֶּן הַמֶּלֶךְ
  choice: రాజు కుమారుడు
  rationale: హీబ్రూ సంబంధపదబంధాన్ని నేరుగా, సహజమైన తెలుగులో అందించింది; ‘యువరాజు’ అని నిర్దిష్ట అధికార హోదాను చేర్చలేదు.
