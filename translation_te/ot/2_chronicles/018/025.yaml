translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి వాడబడింది. ఆజ్ఞకు బహువచన గౌరవ/సామూహిక రూపమైన ‘తీసుకెళ్లండి’ ఉపయోగించబడింది; వ్యక్తుల పేర్లు సాధారణ తెలుగు బైబిలు రూపాలకు అనుగుణంగా లిప్యంతరీకరించబడ్డాయి.
