source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לָ/כֵ֖ן שִׁמְע֣וּ דְבַר יְהוָ֑ה רָאִ֤יתִי אֶת יְהוָה֙ יוֹשֵׁ֣ב עַל כִּסְא֔/וֹ וְ/כָל צְבָ֤א הַ/שָּׁמַ֨יִם֙ עֹֽמְדִ֔ים עַל יְמִינ֖/וֹ וּ/שְׂמֹאלֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/018.yaml
  text: 'And he said[a], “Therefore hear the word of Yahweh: I saw Yahweh sitting on his throne, and all the host of heaven standing at his right hand and at his left.”'
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “అందుచేత యాహ్వే వాక్యాన్ని వినండి: యాహ్వే తన సింహాసనంపై కూర్చొని ఉండడాన్ని, ఆకాశ సైన్యమంతా[a] ఆయన కుడివైపునా ఎడమవైపునా నిలబడి ఉండడాన్ని నేను చూశాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “ఆకాశ సైన్యమంతా”; “పరలోక సమూహమంతా” లేదా “ఆకాశ దండంతా” అని కూడా అనువదించవచ్చు.'
    reason: צָבָא పదానికి సైన్యం, దండు, సమీకృత సమూహం అనే అర్థపరిధి ఉన్నందున పదార్థ ప్రత్యామ్నాయాలను సూచించడానికి.
lexical_decisions:
- source_word: לָכֵן
  choice: అందుచేత
  rationale: ముందటి సంభాషణ నుంచి వచ్చే నిర్ధారణాత్మక మార్పును, ప్రవచన ప్రకటనలోని గంభీరతను నిలుపుతుంది.
- source_word: שִׁמְעוּ
  choice: వినండి
  rationale: ఇది బహువచన ఆజ్ఞారూపం; ప్రవచన సందేశంపై శ్రద్ధ పెట్టమనే పిలుపును సహజంగా తెలియజేస్తుంది.
- source_word: דְבַר יְהוָה
  choice: యాహ్వే వాక్యం
  rationale: ప్రవచన ప్రకటనకు సాధారణమైన సూత్రప్రయోగాన్ని, దేవుని పలుకుతో దాని ప్రత్యక్ష సంబంధాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ మూలంలో ఉన్న దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించి అందిస్తుంది.
- source_word: רָאִיתִי
  choice: నేను చూశాను
  rationale: మీకాయా దర్శనానుభవాన్ని నివేదించే సహజమైన భూతకాల రూపం.
- source_word: יוֹשֵׁב
  choice: కూర్చుని ఉండగా
  rationale: సింహాసనంపై ఉన్న నిరంతర భంగిమను తెలిపే హీబ్రూ కృదంత భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּסְאוֹ
  choice: తన సింహాసనం
  rationale: దర్శనంలోని రాజాధికార దృశ్యాన్ని నేరుగా తెలియజేస్తుంది; కర్త యాహ్వే కావడంతో తెలుగు ప్రతిబింబ సర్వనామం సహజంగా ఉంటుంది.
- source_word: כָל צְבָא הַשָּׁמַיִם
  choice: ఆకాశ సైన్యమంతా
  rationale: צָבָא అనే పదంలోని సమీకృత సమూహం లేదా సైన్యం భావాన్ని కాపాడుతూ, పరలోక సభ దృశ్యానికి సరిపోయే సహజ తెలుగు ప్రయోగం.
- source_word: עֹמְדִים
  choice: నిలబడి ఉండడం
  rationale: పరలోక సభలో వారి భంగిమను తెలిపే కృదంతాన్ని సూటిగా ప్రతిబింబిస్తుంది.
- source_word: עַל יְמִינוֹ וּשְׂמֹאלוֹ
  choice: ఆయన కుడివైపున, ఎడమవైపున
  rationale: రెండు వైపులా ఉన్న స్థానాన్ని స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ప్రవక్త దర్శనంలో తాను యెహోవాను చూశానని చెప్పే చోట יְהוָה దైవనామాన్ని ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం చతురక్షర దైవనామాన్ని నేరుగా వాడుతుంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగా నిలుపుతుంది; దర్శన స్వభావం గురించి పాఠ్యంలో లేని వివరణను జోడించదు.
- issue: כָל צְבָא הַשָּׁמַיִם అనే సమూహపు స్వరూపం
  choice: ఆకాశ సైన్యమంతా
  alternative: పరలోక సమూహమంతా; ఆకాశ దండంతా
  rationale: ‘సైన్యం/సమీకృత సమూహం’ అనే పదార్థ పరిధిని నిలుపుతూ, వీరు దేవదూతలేనా లేక మరొక పరలోక సభా సమూహమా అన్న విషయాన్ని అనవసరంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రవచన శైలిని ఉపయోగించాం. దీర్ఘమైన దర్శన వాక్యం సులభంగా అర్థమయ్యేలా తెలుగు వాక్యక్రమాన్ని అనుసరించాం; మూలంలోని రాజసభా దృశ్యం, రెండు వైపుల స్థానవివరణ, దైవనామం యథాతథంగా నిలిపాం.
