id: 2CH.18.8
reference: 2 Chronicles 18:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֶל סָרִ֖יס אֶחָ֑ד וַ/יֹּ֕אמֶר מַהֵ֖ר מיכהו בֶן יִמְלָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/008.yaml
  text: Then the king of Israel called one officer and said[a], “Quickly bring Micaiah son of Imla.”
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు రాజు ఒక రాజోద్యోగిని[a] పిలిచి, “యిమ్లా కుమారుడైన మీకాయాను త్వరగా తీసుకురా” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఒక నపుంసకుడిని,” లేదా “ఒక రాజసభ అధికారిని.” హీబ్రూ పదం శారీరకంగా నపుంసకుడైన వ్యక్తిని గానీ, సాధారణంగా రాజోద్యోగిని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పిలిచి
  rationale: కרא క్రియ ఇక్కడ రాజు తన పరిచారకుడిని పిలిచి నేరుగా ఆజ్ఞ ఇవ్వడాన్ని సూచిస్తుంది; తెలుగు కథన శైలిలో ‘పిలిచి’ సహజంగా ఉంటుంది.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: ఇది మాట్లాడుతున్న వ్యక్తిని గుర్తించే సరళమైన సమాస పదబంధం; సందర్భం వల్ల నిర్దిష్టత స్పష్టంగా ఉంది.
- source_word: אֶל סָרִיס אֶחָד
  choice: ఒక రాజోద్యోగిని
  rationale: סָרִיס అనే పదం నపుంసకుడిని లేదా రాజసభలోని అధికారిని సూచించగలదు. ఇక్కడ రాజాజ్ఞను అమలు చేసే వ్యక్తి పాత్ర ప్రధానమైనందున ‘రాజోద్యోగి’ అనేది సహజమైన సందర్భోచిత అనువాదం; పదంలోని సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
- source_word: וַיֹּאמֶר
  choice: అని చెప్పాడు
  rationale: ఇది సాధారణ కథన వాక్కు క్రియ; ప్రత్యక్ష ఉక్తి తరువాత ‘అని చెప్పాడు’ ఆధునిక తెలుగులో సహజం.
- source_word: מַהֵר
  choice: త్వరగా తీసుకురా
  rationale: מהר ఆజ్ఞారూపం అత్యవసరతను తెలియజేస్తుంది. హీబ్రూ వాక్యంలో తీసుకురావడం సందర్భం ద్వారా గ్రహించబడుతుంది; తెలుగులో ‘త్వరగా తీసుకురా’ ఆజ్ఞను స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: מיכהו
  choice: మీకాయా
  rationale: హీబ్రూ పేరుకు దగ్గరగా ఉండే, తెలుగులో సులభంగా చదవగల లిప్యంతరీకరణ.
- source_word: בֶן יִמְלָא
  choice: యిమ్లా కుమారుడైన
  rationale: హీబ్రూ తండ్రి-పుత్ర సంబంధ పదబంధాన్ని తెలుగులో సహజమైన విశేషణ నిర్మాణంగా అనువదించాం.
