translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘సారీస్’ పదంలోని నిజమైన అర్థసందిగ్ధతను ప్రధాన పాఠ్యంలో సందర్భోచిత పదంతో, పాదటిప్పణిలో ప్రత్యామ్నాయాలతో సంరక్షించాం.
