  edition: WLC
  text: וּ/מֶ֣לֶךְ אֲרָ֡ם צִוָּה֩ אֶת שָׂרֵ֨י הָ/רֶ֤כֶב אֲשֶׁר ל/וֹ֙ לֵ/אמֹ֔ר לֹ֚א תִּלָּ֣חֲמ֔וּ אֶת הַ/קָּטֹ֖ן אֶת הַ/גָּד֑וֹל כִּ֛י אִֽם אֶת מֶ֥לֶךְ יִשְׂרָאֵ֖ל לְ/בַדּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/030.yaml
  text: The king of Aram had commanded the commanders of the chariots that were his[a], saying, “Do not fight with either small or great, but only with the king of Israel alone.”
translation:
  language: te
  text: 'అరాము రాజు తన రథదళాధిపతులకు ఇలా ఆజ్ఞాపించాడు: “అల్పుడితో గానీ గొప్పవాడితో గానీ[a] యుద్ధం చేయకండి; ఇశ్రాయేలు రాజు ఒక్కడితోనే యుద్ధం చేయండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, “ఎవరితోనూ—అల్పుడితో గానీ గొప్పవాడితో గానీ—యుద్ధం చేయకండి.”
    reason: ‘అల్పుడు, గొప్పవాడు’ అనే హెబ్రీయ జాతీయం హోదాతో సంబంధం లేకుండా ఎవరినైనా సూచిస్తుంది.
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: అరాము రాజు
  rationale: וְ కథన అనుసంధానాన్ని సూచిస్తుంది; ఈ వాక్యంలో ప్రత్యేక కాలసూచక పదాన్ని చేర్చకుండా సహజమైన తెలుగు కథనశైలిలో వ్యక్తపరిచాం. אֲרָם అనే స్థలనామాన్ని ‘అరాము’గా లిప్యంతరీకరించాం.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించాడు
  rationale: క్రియకు ‘ఆజ్ఞాపించు, ఉత్తరువు ఇవ్వు’ అనే అర్థం. సందర్భంలోని పూర్వకాల సంబంధాన్ని తెలుగు కథనక్రమమే స్పష్టం చేస్తుంది; మూలంలో లేని ‘ముందుగానే’ వంటి పదాన్ని చేర్చలేదు.
- source_word: שָׂרֵי הָרֶכֶב אֲשֶׁר לוֹ
  choice: తన రథదళాధిపతులకు
  rationale: שָׂרֵי అంటే సైనిక అధిపతులు; הָרֶכֶב ఇక్కడ రథాలను సమష్టిగా, అంటే రథదళాన్ని సూచిస్తుంది. אֲשֶׁר לוֹ తెలిపే అతనికి చెందిన లేదా అతని ఆధీనంలోని భావాన్ని సహజంగా ‘తన’లో పొందుపరిచాం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హెబ్రీయ infinitive‌ను తెలుగులో సహజంగా ‘ఇలా’తో వ్యక్తపరిచాం.
- source_word: לֹא תִּלָּחֲמוּ
  choice: యుద్ధం చేయకండి
  rationale: ఇది బహువచన నిషేధాజ్ఞ. గౌరవభావం కంటే బహువచన ఆజ్ఞ స్పష్టమయ్యే సహజ ఆధునిక రూపాన్ని వాడాం.
- source_word: אֶת הַקָּטֹן אֶת הַגָּדוֹל
  choice: అల్పుడితో గానీ గొప్పవాడితో గానీ
  rationale: చిన్న స్థాయి నుంచి గొప్ప స్థాయి వరకు ఎవరినీ లక్ష్యంగా చేసుకోవద్దనే జాతీయాన్ని దగ్గరగా నిలుపుతూ, వ్యక్తులను సూచించే తెలుగు రూపాలు వాడాం.
- source_word: כִּי אִם אֶת מֶלֶךְ יִשְׂרָאֵל לְבַדּוֹ
  choice: ఇశ్రాయేలు రాజు ఒక్కడితోనే
  rationale: כִּי אִם యొక్క మినహాయింపు/నిర్బంధ భావాన్నీ, לְבַדּוֹ యొక్క ‘ఒక్కడే’ భావాన్నీ ‘ఒక్కడితోనే’ సంక్షిప్తంగా సంరక్షిస్తుంది.
