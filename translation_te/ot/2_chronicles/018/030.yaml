translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని అనుసరించాం. సైనిక సందర్భానికి ‘రథదళాధిపతులు’ను ఎంచుకుని, మూలంలోని ‘అల్పుడు/గొప్పవాడు’ జాతీయాన్ని ప్రధాన పాఠ్యంలో నిలిపి దాని భావాన్ని పాదసూచికలో వివరించాం.
