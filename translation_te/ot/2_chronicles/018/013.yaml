id: 2CH.18.13
reference: 2 Chronicles 18:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מִיכָ֑יְהוּ חַי יְהוָ֕ה כִּ֛י אֶת אֲשֶׁר יֹאמַ֥ר אֱלֹהַ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/013.yaml
  text: But Micaiah said[a], “As Yahweh lives, whatever my God says, that I will speak.”
translation:
  language: te
  text: 'కాని మీకాయా ఇలా అన్నాడు: “యాహ్వే జీవముతోడు,[a] నా దేవుడు ఏది చెబితే దానినే నేను పలుకుతాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే సజీవుడు; నా దేవుడు ఏది చెబితే దానినే నేను పలుకుతాను.”
    reason: חַי יְהוָה అనే హీబ్రూ పదబంధం ఇక్కడ ప్రమాణ సూత్రంగా ఉంది; పదబద్ధంగా అది ‘యాహ్వే సజీవుడు’ అనే ప్రకటనగా కూడా చదవబడవచ్చు.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: కాని ... ఇలా అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపించినా, 12వ వచనంలోని దూత ఒత్తిడికి మీకాయా విరుద్ధంగా స్పందిస్తున్నందున ‘కాని’ సందర్భంలోని వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִיכָיְהוּ
  choice: మీకాయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో లిప్యంతరీకరించాం.
- source_word: חַי יְהוָה
  choice: యాహ్వే జీవం తోడు
  rationale: ఇది హీబ్రూలోని ప్రమాణ సూత్రం. తెలుగు నుడికారంలో ప్రమాణ బలాన్ని సహజంగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో మార్చకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: אֵת אֲשֶׁר
  choice: ఏది ... దానినే
  rationale: సంబంధార్థక నిర్మాణాన్నీ, తరువాతి పునరుక్త కర్మ సర్వనామాన్నీ తెలుగులో సహజమైన అనుసంధాన నిర్మాణంతో నిలిపాం.
- source_word: יֹאמַר
  choice: చెబితే
  rationale: ఇక్కడ అసంపూర్ణ క్రియ దేవుడు ఈ సందర్భంలో ఏది చెప్పినా అనే అనిశ్చిత-సంబంధ భావాన్ని ఇస్తుంది; తెలుగులో షరతార్థక రూపం దాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהַי
  choice: నా దేవుడు
  rationale: మొదటి పురుష ఏకవచన స్వామ్య ప్రత్యయాన్ని స్పష్టంగా నిలిపాం.
- source_word: אֹתוֹ
  choice: దానినే
  rationale: దేవుడు చెప్పే విషయాన్నే తిరిగి సూచించే కర్మ సర్వనామాన్ని ‘దానినే’గా ఇచ్చి, వేరేదీ పలకననే ఉద్ఘాటనను నిలిపాం.
- source_word: אֲדַבֵּר
  choice: నేను పలుకుతాను
  rationale: దైవిక సందేశాన్ని ప్రకటించే గంభీర సందర్భానికి ‘పలుకు’ సహజంగా సరిపోతూ, భవిష్యదర్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ప్రమాణ సూత్రంలో יְהוָה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. కాబట్టి దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: חַי יְהוָה అనే సూత్రం ప్రమాణమా లేక ప్రకటనమా
  choice: యాహ్వే జీవం తోడు
  alternative: యాహ్వే సజీవుడు
  rationale: సందర్భంలో ఇది ప్రధానంగా ప్రమాణ సూత్రంగా పనిచేస్తుంది; అయితే పదబద్ధంగా ప్రకటనగా కూడా అర్థం చేసుకునే అవకాశాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరమైన ప్రవక్తీయ ప్రమాణ స్వరాన్ని నిలిపాం. ‘జీవం తోడు’ అనే నుడికారం ప్రమాణార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘పలుకుతాను’ ప్రకటన గాంభీర్యాన్ని కాపాడుతుంది.
