translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘కూర్చున్నారు ... కూర్చుండగా’ అనే పునరుక్తి మూలంలోని దృశ్యవర్ణనను నిలుపుతుంది. ‘ప్రవచిస్తున్నారు’ కొనసాగుతున్న కార్యాన్ని సూచిస్తుంది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
