reference: 2 Chronicles 18:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מֶ֣לֶךְ יִשְׂרָאֵ֡ל וִֽ/יהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֡ה יוֹשְׁבִים֩ אִ֨ישׁ עַל כִּסְא֜/וֹ מְלֻבָּשִׁ֤ים בְּגָדִים֙ וְ/יֹשְׁבִ֣ים בְּ/גֹ֔רֶן פֶּ֖תַח שַׁ֣עַר שֹׁמְר֑וֹן וְ/כָל הַ֨/נְּבִיאִ֔ים מִֽתְנַבְּאִ֖ים לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/009.yaml
  text: The king of Israel and Jehoshaphat king of Judah were sitting[a], each on his throne, clothed in garments, and sitting at the threshing floor at the entrance of the gate of Samaria[b], and all the prophets were prophesying before them.
translation:
  language: te
  text: ఇశ్రాయేలు రాజు[a], యూదా రాజైన యెహోషాపాతు తమ తమ సింహాసనాలపై కూర్చొని, వస్త్రాలు[b] ధరించి, సమరయ ద్వారపు ప్రవేశం వద్దనున్న నూర్పిడి కళ్లంలో కూర్చున్నారు; ప్రవక్తలందరూ వారి ఎదుట ప్రవచిస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు ఇశ్రాయేలు రాజు.” హీబ్రూ అనుసంధాన పదాన్ని సందర్భానుసారం “మరియు” లేదా “మరి” అని అనువదించవచ్చు; తెలుగులో దానిని పలకకుండా కూడా కథన అనుసంధానం సహజంగా వ్యక్తమవుతుంది.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “వస్త్రాలు ధరించి.” సందర్భం రాజసభకు సంబంధించినదైనా, అవి ప్రత్యేకంగా రాజవస్త్రాలని మూలపాఠం చెప్పదు.
    reason: lexical_clarification
lexical_decisions:
- source_word: וּמֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: ప్రారంభంలోని ו־ అనుసంధానార్థకమైనది. తెలుగు కథనంలో ముందు సందర్భంతో అనుసంధానం సహజంగానే స్పష్టమవుతుంది కాబట్టి ప్రధాన పాఠంలో అదనంగా ‘మరి’ లేదా ‘అప్పుడు’ చేర్చలేదు; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: וִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన యెహోషాపాతు
  rationale: వ్యక్తి పేరుతో రాజబిరుదును ఆధునిక తెలుగులో సహజమైన విశేషణ నిర్మాణంతో తెలిపింది.
- source_word: יוֹשְׁבִים ... וְיֹשְׁבִים
  choice: కూర్చున్నారు ... కూర్చుండగా
  rationale: మూలంలోని ישׁב క్రియ పునరుక్తిని నిలిపి, మొదట సింహాసనాలపై వారి భంగిమను, తరువాత వారు ఉన్న ప్రదేశాన్ని తెలుగులో స్పష్టంగా తెలిపింది.
- source_word: אִישׁ עַל כִּסְאוֹ
  choice: తమ తమ సింహాసనాల మీద
  rationale: אִישׁ ఇక్కడ విభజనార్థంగా ‘ఒక్కొక్కరు’ అనే భావాన్ని ఇస్తుంది. రాజసందర్భంలో כִּסֵּאకు ‘సింహాసనం’ సరైన పదం; ‘తమ తమ’ ప్రతి రాజుకు తన సొంత సింహాసనం ఉందని సహజంగా తెలియజేస్తుంది.
- source_word: מְלֻבָּשִׁים בְּגָדִים
  choice: వస్త్రాలు ధరించి
  rationale: అక్షరార్థాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో అందిస్తుంది. మూలంలో ‘రాజవస్త్రాలు’ అని స్పష్టంగా లేనందున దానిని ప్రధాన పాఠంలో చేర్చలేదు.
- source_word: בְּגֹרֶן
  choice: నూర్పిడి కళ్లంలో
  rationale: גֹּרֶן ధాన్యాన్ని నూర్చే సమతల ప్రదేశాన్ని సూచిస్తుంది; ‘నూర్పిడి కళ్లం’ ఆధునిక ప్రామాణిక తెలుగులో అర్థవంతమైన సమానార్థకం.
- source_word: פֶּתַח שַׁעַר שֹׁמְרוֹן
  choice: సమరయ ద్వార ప్రవేశం దగ్గర ఉన్న
  rationale: మూలంలోని స్థల సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, నూర్పిడి కళ్లం పట్టణ ద్వార ప్రవేశం దగ్గర ఉందని స్పష్టం చేస్తుంది.
- source_word: מִתְנַבְּאִים לִפְנֵיהֶם
  choice: వారి ఎదుట ప్రవచిస్తున్నారు
  rationale: హిత్పయేల్ రూపం ఇక్కడ ప్రవక్తలుగా ప్రవచించే కార్యాన్ని సూచిస్తుంది. לִפְנֵיהֶםను ‘వారి ఎదుట’ అని దగ్గరగా అనువదించింది.
