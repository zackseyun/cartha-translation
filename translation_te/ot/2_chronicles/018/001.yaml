  edition: WLC
  text: וַ/יְהִ֧י לִֽ/יהוֹשָׁפָ֛ט עֹ֥שֶׁר וְ/כָב֖וֹד לָ/רֹ֑ב וַ/יִּתְחַתֵּ֖ן לְ/אַחְאָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/001.yaml
  text: Jehoshaphat had great wealth and honor[a], and he allied himself by marriage with Ahab.
translation:
  language: te
  text: యెహోషాపాతుకు ఎంతో సంపద, ఘనత ఉన్నాయి; అతడు అహాబుతో వివాహం ద్వారా బంధుత్వం ఏర్పరచుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అహాబుతో వివాహం ద్వారా బంధువయ్యాడు”; లేదా, “అహాబుతో వివాహ సంబంధమైన కూటమి కుదుర్చుకున్నాడు.”
    reason: వివాహ సంబంధాన్ని సూచించే హీబ్రూ క్రియకు సాధ్యమైన భావ ఛాయలను చూపిస్తుంది.
lexical_decisions:
- source_word: וַיְהִי
  choice: ఉన్నాయి
  rationale: హీబ్రూ కథనంలో కొత్త పరిణామాన్ని పరిచయం చేసే రూపం; తెలుగు సహజ కథనశైలిలో ప్రత్యేకంగా ‘అప్పుడు’ అని చేర్చకుండా అస్తిత్వాన్ని తెలిపే క్రియతో అనువదించాం.
- source_word: לִיהוֹשָׁפָט
  choice: యెహోషాపాతుకు
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు లిప్యంతరీకరణకు దగ్గరగా ఇచ్చి, హీబ్రూ స్వామ్య నిర్మాణాన్ని ‘-కు’తో వ్యక్తపరిచాం.
- source_word: עֹשֶׁר וְכָבוֹד לָרֹב
  choice: అపారమైన సంపద, ఘనత
  rationale: עֹשֶׁר భౌతిక సంపదను, כָבוֹד రాజసామాజిక గౌరవం లేదా ప్రతిష్ఠను సూచిస్తాయి; לָרֹב రెండింటి సమృద్ధిని తెలియజేస్తుంది.
- source_word: וַיִּתְחַתֵּן
  choice: వివాహ బంధం ఏర్పరచుకున్నాడు
  rationale: హిత్పయేల్ రూపం అతడే వ్యక్తిగతంగా వివాహం చేసుకున్నాడని తప్పనిసరిగా చెప్పకుండా, వివాహం ద్వారా కుటుంబ లేదా రాజవంశ సంబంధం ఏర్పడిన భావాన్ని ఇస్తుంది.
- source_word: לְאַחְאָב
  choice: అహాబుతో
  rationale: సంబంధం ఏర్పరచుకోవడాన్ని ఆధునిక తెలుగులో సహజంగా తెలిపేందుకు సహార్థకమైన ‘తో’ విభక్తిని వాడాం.
theological_decisions:
- issue: וַיִּתְחַתֵּן לְאַחְאָבలో యెహోషాపాతు–అహాబు సంబంధ స్వభావం
  choice: అతడు అహాబుతో వివాహ బంధం ఏర్పరచుకున్నాడు
  alternative: అతడు అహాబుకు వివాహం ద్వారా బంధువయ్యాడు; అతడు అహాబుతో వివాహ సంబంధమైన కూటమి కుదుర్చుకున్నాడు
  rationale: వాక్యం రాజవంశాల మధ్య వివాహ సంబంధాన్ని తెలియజేస్తుంది; యెహోషాపాతే స్వయంగా వివాహం చేసుకున్నాడని లేదా ఖచ్చితమైన కుటుంబ ఏర్పాటేమిటో ప్రధాన పాఠంలో అధికంగా నిర్దేశించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి. ‘ఘనత’ను రాజసామాజిక ప్రతిష్ఠ భావంలో, ‘వివాహ బంధం’ను వ్యక్తిగత వివాహంగా అతిగా నిర్దేశించకుండా ఉపయోగించాం.
