source:
  edition: WLC
  text: וַ/יִּגַּשׁ֙ צִדְקִיָּ֣הוּ בֶֽן כְּנַעֲנָ֔ה וַ/יַּ֥ךְ אֶת מִיכָ֖יְהוּ עַל הַ/לֶּ֑חִי וַ/יֹּ֗אמֶר אֵ֣י זֶ֤ה הַ/דֶּ֨רֶךְ֙ עָבַ֧ר רֽוּחַ יְהוָ֛ה מֵ/אִתִּ֖/י לְ/דַבֵּ֥ר אֹתָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/023.yaml
  text: Then Zedekiah son of Chenaanah came near and struck Micaiah on the cheek[a], and said, “Which way did the Spirit of Yahweh pass from me to speak to you?”
translation:
  language: te
  text: అప్పుడు కనానా కుమారుడైన సిద్కియా మీకాయా దగ్గరకు వచ్చి అతని చెంపమీద కొట్టాడు. అతడు, “యాహ్వే ఆత్మ నన్నుంచి నిన్ను ఉద్దేశించి మాట్లాడటానికి ఏ దారిన వెళ్లింది?” అని అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే ఆత్మ నన్నుంచి నిన్ను ఉద్దేశించి మాట్లాడటానికి ఏ మార్గం గుండా వెళ్లింది?”
    reason: אֵי זֶה הַדֶּרֶךְ మరియు עָבַרలోని మార్గం మరియు గమనం అనే రూపకాన్ని మరింత రూపపరంగా వ్యక్తపరుస్తుంది.
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: దగ్గరికి వచ్చి
  rationale: నגשׁ సూచించే సమీపించడాన్ని ఘర్షణ సందర్భానికి సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: צִדְקִיָּהוּ בֶן־כְּנַעֲנָה
  choice: కెనయనా కుమారుడైన సిద్కియా
  rationale: వ్యక్తుల పేర్లను తెలుగు లిపిలో ధ్వన్యంతరీకరించి, తండ్రి-కుమార సంబంధాన్ని స్పష్టంగా నిలిపింది.
- source_word: וַיַּךְ אֶת־מִיכָיְהוּ עַל־הַלֶּחִי
  choice: మీకాయా చెంపపై కొట్టి
  rationale: נכה అనే విస్తృతార్థక క్రియకు ‘కొట్టి’ తటస్థమైన సమానార్థకం; לֶחִי ఇక్కడ చెంప/దవడ ప్రాంతాన్ని సూచిస్తుండగా, సందర్భంలో ‘చెంప’ సహజంగా సరిపోతుంది.
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: ఏ దారిన
  rationale: మూలంలోని దారి లేదా మార్గం అనే రూపకాన్ని ఉంచుతూ, సవాలు చేసే ప్రశ్నను సహజమైన తెలుగులో అందిస్తుంది.
- source_word: עָבַר
  choice: వెళ్లాడు
  rationale: ఒకరి దగ్గరనుంచి మరొకరి దగ్గరికి ఆత్మ వెళ్లినట్లు సిద్కియా వ్యంగ్యంగా చిత్రించే చలన భావాన్ని తెలుగులో సహజంగా నిలిపింది.
- source_word: רוּחַ יְהוָה
  choice: యెహోవా ఆత్మ
  rationale: ప్రవచన సందర్భంలో רוּחַ దైవిక ఆత్మను సూచిస్తుంది; יהוה అనే ఒడంబడిక నామాన్ని ‘యెహోవా’గా ధ్వన్యంతరీకరించింది.
- source_word: מֵאִתִּי
  choice: నన్నుంచి
  rationale: మాట్లాడే వ్యక్తినుంచి ఆత్మ వెళ్లిందనే మూలం/ప్రస్థాన భావాన్ని నేరుగా వ్యక్తపరుస్తుంది.
- source_word: לְדַבֵּר אֹתָךְ
  choice: నీతో మాట్లాడడానికి
  rationale: దీని సందర్భార్థం మీకాయాను ఉద్దేశించి మాట్లాడడమే; ‘నీతో మాట్లాడడానికి’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న దేవుని ప్రత్యేక ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగు పాఠకులకు సుపరిచితమైన ధ్వన్యంతరీకరణలో ఉంచింది.
- issue: רוּחַ యొక్క సూచన
  choice: ఆత్మ
  alternative: ఆత్మ/గాలి అనే అస్పష్టతను అలాగే ఉంచడం
  rationale: ప్రవక్తల ద్వారా మాట్లాడే సందర్భం ఇక్కడ యెహోవా దైవిక ఆత్మనే స్పష్టంగా సూచిస్తుంది; అయినా సిద్కియా వాదన నిజమని అనువాదం సమర్థించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన కథన శైలి వాడబడింది. సిద్కియా మాటలోని వ్యంగ్య సవాలు, ఆత్మ ఒకరి దగ్గరనుంచి మరొకరి దగ్గరికి వెళ్లినట్లు చెప్పే చలన రూపకం రెండూ నిలిపివేయబడ్డాయి.
