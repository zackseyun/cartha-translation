id: 2CH.18.4
reference: 2 Chronicles 18:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹשָׁפָ֖ט אֶל מֶ֣לֶךְ יִשְׂרָאֵ֑ל דְּרָשׁ נָ֥א כַ/יּ֖וֹם אֶת דְּבַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/004.yaml
  text: And Jehoshaphat said to the king of Israel[a], “Please inquire today for the word of Yahweh.”
translation:
  language: te
  text: 'యెహోషాపాతు ఇశ్రాయేలు రాజుతో ఇలా అన్నాడు: “దయచేసి, ఈ రోజే యాహ్వే వాక్యం ఏమిటో విచారించండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహంలోని వావ్-కన్సెక్యూటివ్‌ను తెలుగులో సహజమైన భూతకాల కథన క్రియతో వ్యక్తపరుస్తుంది; ప్రత్యేకమైన కాలక్రమ భావాన్ని అనవసరంగా జోడించదు.
- source_word: יְהוֹשָׁפָט
  choice: యెహోషాపాతు
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు నామరూపానికి అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజుతో
  rationale: హీబ్రూ సంబోధన సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ రాజపదవిని నిలుపుతుంది.
- source_word: דְּרָשׁ נָא
  choice: దయచేసి ... విచారించండి
  rationale: దైవసందేశం కోసం ప్రవక్తలను సంప్రదించి తెలుసుకోవడం అనే సందర్భార్థాన్ని ‘విచారించండి’ తెలియజేస్తుంది; נָא లోని మర్యాదపూర్వక అభ్యర్థనను ‘దయచేసి’ నిలుపుతుంది.
- source_word: כַיּוֹם
  choice: ఈ రోజే
  rationale: విచారణ తక్షణమే జరగాలనే సందర్భోచిత నొక్కును సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֶת דְּבַר יְהוָה
  choice: యెహోవా వాక్యం కోసం
  rationale: דְּרָשׁ క్రియతో sought object భావాన్ని ‘కోసం’ స్పష్టం చేస్తుంది; అదే సమయంలో ‘యెహోవా వాక్యం’ అనే ప్రవచన సూత్రాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన వ్యక్తినామ రూపంతో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా ఉంచుతూ, సాధారణ తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకుంది; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
- issue: דְּבַר יְהוָה యొక్క నిర్దిష్టత
  choice: యెహోవా వాక్యం
  alternative: యెహోవా నుండి ఒక సందేశం
  rationale: హీబ్రూ నిర్మాణంలోని ‘యెహోవా వాక్యం’ అనే స్థిర ప్రవచన వ్యక్తీకరణను ప్రధాన పాఠంలో నిలిపింది. సందర్భంలో కోరబడేది ఒక నిర్దిష్ట దైవసందేశమనే భావన సాధ్యమైనప్పటికీ దాన్ని ప్రధాన పాఠంలో అనవసరంగా నిర్దిష్టీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. రాజుతో చేసే అభ్యర్థనకు బహువచన మర్యాదారూపం వాడబడింది. ప్రధాన పాఠం మూలంలోని ప్రవచన పదబంధాన్ని నిలుపుతూ, సాధ్యమైన అర్థభేదాన్ని పాదసూచికలో ఇచ్చింది.
