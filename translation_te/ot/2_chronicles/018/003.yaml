source:
  edition: WLC
  text: וַ/יֹּ֜אמֶר אַחְאָ֣ב מֶֽלֶךְ יִשְׂרָאֵ֗ל אֶל יְהֽוֹשָׁפָט֙ מֶ֣לֶךְ יְהוּדָ֔ה הֲ/תֵלֵ֥ךְ עִמִּ֖/י רָמֹ֣ת גִּלְעָ֑ד וַ/יֹּ֣אמֶר ל֗/וֹ כָּמ֤וֹ/נִי כָמ֨וֹ/ךָ֙ וּ/כְ/עַמְּ/ךָ֣ עַמִּ֔/י וְ/עִמְּ/ךָ֖ בַּ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/003.yaml
  text: And Ahab king of Israel said to Jehoshaphat king of Judah[a], “Will you go with me to Ramoth-gilead?” And he said to him, “I am as you are, and my people as your people[b], and I am with you in the battle.”
translation:
  language: te
  text: ఇశ్రాయేలు రాజైన అహాబు యూదా రాజైన యెహోషాపాతుతో, “నాతో కలిసి రామోత్-గిలాదుకు వెళ్తారా?” అని అడిగాడు. అందుకు యెహోషాపాతు అతనితో, “నేను మీవంటివాడినే; నా ప్రజలు మీ ప్రజలవంటివారే[a]. యుద్ధంలో నేను మీతో ఉంటాను[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హెబ్రీలో పదక్రమం సంక్షిప్తంగా, “మీ ప్రజలవలె నా ప్రజలు” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: మూల హెబ్రీలో ఈ చివరి మాట క్రియ లేకుండా, అక్షరార్థంగా “యుద్ధంలో మీతో” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵלֵךְ עִמִּי
  choice: నాతో కలిసి ... వెళ్తారా?
  rationale: ప్రశ్నార్థక הֲ, הלך అనే గమన క్రియ, עִם అనే సహవాస సూచనను నేరుగా తెలియజేస్తుంది. రాజుల మధ్య సంభాషణకు తగిన గౌరవ బహువచనాన్ని తెలుగులో ఉపయోగించాం.
- source_word: רָמֹת גִּלְעָד
  choice: గిలాదులోని రామోతు
  rationale: స్థలనామాన్ని తెలుగు బైబిల్ పాఠకులకు పరిచితమైన రూపంలో లిప్యంతరీకరించాం; తెలుగు సహజత్వం కోసం గిలాదు ప్రాంతంలోని రామోతు అనే సంబంధాన్ని ‘గిలాదులోని’తో వ్యక్తం చేశాం.
- source_word: כָּמוֹנִי כָמוֹךָ
  choice: నేను మీవంటివాడినే
  rationale: మూలంలోని సంక్షిప్త తులనాత్మక నిర్మాణాన్ని సహజమైన తెలుగులో ఉంచి, ఐక్యత లేదా సమాన భాగస్వామ్య భావాన్ని అతిగా వివరణ చేయకుండా కాపాడుతుంది.
- source_word: וּכְעַמְּךָ עַמִּי
  choice: నా ప్రజలు మీ ప్రజలవంటివారే
  rationale: క్రియలేని హెబ్రీ సమాంతర వాక్యాన్ని తెలుగులో పూర్తి వాక్యంగా చేశాం. పోలికను గుర్తింపుగా మార్చకుండా כְ యొక్క తులనాత్మక బలాన్ని నిలిపాం.
- source_word: וְעִמְּךָ בַּמִּלְחָמָה
  choice: యుద్ధంలో నేను మీతో ఉంటాను
  rationale: మూలంలో క్రియ లేని సంక్షిప్త పదబంధం ఉంది. సందర్భంలోని యుద్ధ సహకార వాగ్దానాన్ని సహజ తెలుగులో స్పష్టంచేయడానికి ‘నేను ... ఉంటాను’ చేర్చాం; ఈ పూరణను పాదసూచికలో తెలిపాం.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: అని అడిగాడు ... అన్నాడు
  rationale: రెండు చోట్లా మూలంలో సాధారణ ‘చెప్పు’ క్రియే ఉన్నా, మొదటి మాట ప్రశ్నగా ఉన్నందున తెలుగులో ‘అడిగాడు’ సహజం; రెండవదాన్ని ‘అన్నాడు’గా ఉంచడం సంభాషణ ప్రవాహాన్ని స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన రాజసంభాషణను ఉపయోగించాం. సంబోధనలో ఏకవచనానికి బదులుగా తెలుగు మర్యాదా బహువచనం వాడినా, వ్యక్తుల సంఖ్య మారలేదు. మూలంలోని తులనాత్మకతను మరియు చివరి పదబంధంలోని సంక్షిప్తతను పాదసూచికలతో కాపాడాం.
