id: 2CH.18.11
reference: 2 Chronicles 18:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל הַ֨/נְּבִאִ֔ים נִבְּאִ֥ים כֵּ֖ן לֵ/אמֹ֑ר עֲלֵ֞ה רָמֹ֤ת גִּלְעָד֙ וְ/הַצְלַ֔ח וְ/נָתַ֥ן יְהוָ֖ה בְּ/יַ֥ד הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/011.yaml
  text: And all the prophets were prophesying thus[a], saying, “Go up to Ramoth-gilead and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: te
  text: ప్రవక్తలందరూ ఈ విధంగా ప్రవచిస్తూ, “రామోత్-గిలాదుకు వెళ్లి విజయం సాధించండి, మరియు యాహ్వే దానిని రాజు చేతికి అప్పగిస్తాడు[a]” అని చెప్పారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే దానిని రాజు చేతికి అప్పగించాడు.” ఈ ప్రవచన సందర్భంలో హీబ్రూ క్రియారూపం జరగబోయే కార్యాన్ని నిశ్చయంగా జరిగినదానిలా చెప్పవచ్చు.
    reason: హీబ్రూ సంపూర్ణ క్రియారూపం భవిష్యదర్థాన్నీ, ప్రవచన నిశ్చయతనూ వ్యక్తపరచగల ప్రత్యామ్నాయ పఠనం.
lexical_decisions:
- source_word: וְכָל הַנְּבִאִים
  choice: ప్రవక్తలందరూ
  rationale: సమూహాన్నంతటినీ సూచించే సహజమైన ఆధునిక తెలుగు రూపం; ఆరంభంలోని וְను ప్రత్యేకంగా ‘మరియు’ అని అనువదించకుండా తెలుగు కథన ప్రవాహంలో సహజంగా వ్యక్తపరచింది.
- source_word: נִבְּאִים כֵּן
  choice: అలాగే ప్రవచిస్తూ
  rationale: కృదంత రూపంలోని కొనసాగుతున్న చర్యను ‘ప్రవచిస్తూ’ వ్యక్తపరుస్తుంది; כֵּן వారు ఒకే విధంగా పలుకుతున్నారని ‘అలాగే’ ద్వారా తెలియజేస్తుంది.
- source_word: עֲלֵה רָמֹת גִּלְעָד
  choice: రామోత్-గిలాదుకు వెళ్లి
  rationale: עלה యొక్క ‘పైకి వెళ్లు’ అనే ప్రాథమిక భావాన్ని సందర్భానుకూలమైన ‘వెళ్లి’గా సహజీకరించింది; రాజును ఉద్దేశించిన ఏకవచన గౌరవార్థక ఆజ్ఞగా ‘వెళ్లండి’ భావం కొనసాగుతుంది.
- source_word: וְהַצְלַח
  choice: విజయం సాధించండి
  rationale: సైనిక సందర్భంలో ‘సఫలమవండి/జయప్రదంగా ఉండండి’ కంటే సహజంగా ఉండి, విజయాన్ని సూచించే క్రియార్థాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణతో ఇచ్చింది.
- source_word: וְנָתַן יְהוָה בְּיַד הַמֶּלֶךְ
  choice: యెహోవా దానిని రాజు చేతికి అప్పగిస్తాడు
  rationale: ביד అనే ఆధీనంలోకి అప్పగించే హీబ్రూ నుడికారాన్ని ‘చేతికి అప్పగిస్తాడు’గా నిలుపుతుంది; సందర్భం ద్వారా తెలిసే రామోత్-గిలాదును ‘దానిని’గా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: וְנָתַן క్రియారూపంలోని కాలం మరియు ప్రవచన నిశ్చయత
  choice: అప్పగిస్తాడు
  alternative: అప్పగించాడు
  rationale: ఆజ్ఞల తరువాత వచ్చే హీబ్రూ సంపూర్ణ క్రియారూపం ఈ సందర్భంలో నిశ్చయంగా జరగబోయే ఫలితాన్ని సూచించగలదు. ప్రధాన పాఠంలో సహజమైన భవిష్యదర్థాన్ని ఇచ్చి, ఇప్పటికే జరిగినట్లుగా చెప్పే ప్రవచన నిశ్చయతను పాదసూచికలో ఉంచడం ద్వారా అస్పష్టతను కాపాడింది.
- issue: יהוה దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉన్నందున దాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన కథన శైలి. రాజును ఉద్దేశించిన ఏకవచన ఆజ్ఞలకు తెలుగు గౌరవ బహువచన రూపాలు వాడబడ్డాయి; దైవనామం ‘యెహోవా’గా నిలుపబడింది.
