translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ఇద్దరు రాజులు కర్తలుగా ఉన్నందున బహువచన గౌరవ క్రియారూపం వాడబడింది. మూలంలో లేని సైనిక భావాన్ని చేర్చలేదు.
