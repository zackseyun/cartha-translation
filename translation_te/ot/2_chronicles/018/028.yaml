source:
  edition: WLC
  text: וַ/יַּ֧עַל מֶֽלֶךְ יִשְׂרָאֵ֛ל וִֽ/יהוֹשָׁפָ֥ט מֶֽלֶךְ יְהוּדָ֖ה אֶל רָמֹ֥ת גִּלְעָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/028.yaml
  text: So the king of Israel and Jehoshaphat king of Judah went up to Ramoth-gilead.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు రాజు మరియు యూదా రాజైన యెహోషాపాతు రామోతు-గిలాదుకు పైకి వెళ్లారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: వెళ్లారు
  rationale: עלה అనే క్రియకు అక్షరార్థంగా ‘ఎక్కడం/పైకి వెళ్లడం’ అనే భావం ఉన్నా, ఇక్కడ ఒక స్థలానికి ప్రయాణించడాన్ని సూచిస్తుంది. తెలుగులో ‘పైకి వెళ్లారు’ భౌగోళిక ఎత్తును అనవసరంగా ముందుకు తెచ్చే అవకాశం ఉన్నందున సహజమైన కథన రూపమైన ‘వెళ్లారు’ ఎంచుకోబడింది; సైనిక దండయాత్ర భావాన్ని అదనంగా చేర్చలేదు.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: తెలుగులో సహజమైన సంబంధ నిర్మాణంతో తెలిసిన రాజును సూచించే రాజబిరుదును స్పష్టంగా అందిస్తుంది.
- source_word: וִיהוֹשָׁפָט
  choice: యెహోషాపాతు
  rationale: వ్యక్తి పేరును ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడింది; ముందు ఉన్న సంధికారక భావం తెలుగులో జాబితా నిర్మాణం ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన
  rationale: యెహోషాపాతును వివరిస్తున్న సమానాధికార బిరుదును తెలుగులో సహజంగా ‘రాజైన’ రూపంలో ఇచ్చింది.
- source_word: אֶל
  choice: -కు
  rationale: గమ్యస్థానం వైపు కదలికను సూచించే హీబ్రూ ఉపసర్గకు సహజమైన తెలుగు విభక్తి.
- source_word: רָמֹת גִּלְעָד
  choice: గిలాదులోని రామోతు
  rationale: సంయుక్త స్థలనామంలోని సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది; ‘గిలాదు రామోతు’ కంటే సాధారణ పాఠకుడికి సులభంగా అర్థమవుతుంది.
