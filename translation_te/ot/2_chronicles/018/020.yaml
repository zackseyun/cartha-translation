  edition: WLC
  text: וַ/יֵּצֵ֣א הָ/ר֗וּחַ וַֽ/יַּעֲמֹד֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יֹּ֖אמֶר אֲנִ֣י אֲפַתֶּ֑/נּוּ וַ/יֹּ֧אמֶר יְהוָ֛ה אֵלָ֖י/ו בַּ/מָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/020.yaml
  text: Then the spirit came forward and stood before Yahweh and said[a], ‘I will entice him.’ And Yahweh said to him, ‘By what means?’
translation:
  language: te
  text: అప్పుడు ఆ ఆత్మ ముందుకు వచ్చి, యెహోవా సన్నిధిలో నిలబడి, “నేను అతన్ని ప్రలోభపెడతాను[a]” అని చెప్పింది. యెహోవా అతనితో, “ఏ విధంగా?” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతన్ని మోసగిస్తాను,” లేదా “అతన్ని ఒప్పిస్తాను.” హీబ్రూ క్రియ సందర్భానుసారం ప్రలోభపెట్టడం, ఒప్పించడం లేదా మోసగించడం అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרוּחַ
  choice: ఆ ఆత్మ
  rationale: ఈ పరలోక సభా సందర్భంలో ముందుకు రావడం, నిలబడడం, మాట్లాడడం వంటి వ్యక్తిగత క్రియలు ఉన్నందున ‘గాలి’ లేదా ‘శ్వాస’ కంటే ‘ఆత్మ’ సందర్భానికి సరిపోతుంది. హీబ్రూలో ఉన్న నిర్దిష్ట ఉపపదాన్ని ‘ఆ’ ద్వారా సూచించాం.
- source_word: וַיֵּצֵא
  choice: ముందుకు వచ్చి
  rationale: יצא యొక్క మౌలిక అర్థం ‘బయటికి వెళ్లడం/రావడం’; సభలో తనను తాను సమర్పించుకోవడానికి ముందుకు వచ్చిన భావాన్ని సహజమైన తెలుగులో ఇది తెలియజేస్తుంది.
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: సన్నిధిలో నిలబడి
  rationale: עמד לפני అనే ప్రయోగం ఒకరి ఎదుట లేదా సమక్షంలో నిలబడటాన్ని సూచిస్తుంది. పరలోక రాజసభ సందర్భానికి ‘సన్నిధిలో నిలబడి’ సహజంగా, గౌరవప్రదంగా సరిపోతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో అందించాం.
- source_word: אֲפַתֶּנּוּ
  choice: నేను అతన్ని ప్రలోభపెడతాను
  rationale: פתה పియేల్ రూపం సందర్భానుసారం ప్రలోభపెట్టడం, ఒప్పించడం లేదా మోసగించడం అనే భావాలను కలిగి ఉంటుంది. తదుపరి వచనంలో విధానం స్పష్టమవుతుంది కాబట్టి, ఇక్కడ భావాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘ప్రలోభపెడతాను’ అని ఇచ్చి ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
- source_word: בַּמָּה
  choice: ఏ విధంగా?
  rationale: ఇది కార్యం జరిగే పద్ధతి లేదా సాధనాన్ని ప్రశ్నిస్తుంది. ‘ఏ విధంగా?’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని సంక్షిప్తతను నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా ఉంచాం. తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణగా ‘యెహోవా’ను ఎంచుకున్నాం.
- issue: దైవసభ సందర్భంలో פתה యొక్క నైతిక, వేదాంతపరమైన భావఛాయ
  choice: ప్రలోభపెడతాను
  alternative: మోసగిస్తాను / ఒప్పిస్తాను
  rationale: ఈ వచనం ఆ ఆత్మ చేసిన ప్రతిపాదనను మాత్రమే చెబుతుంది; దాని విధానాన్ని తదుపరి వచనం వివరిస్తుంది. అందువల్ల ఇక్కడే ‘మోసం’ అని పూర్తిగా నిర్ధారించకుండా, మూలంలోని అర్థవిస్తృతిని మరియు వేదాంతపరమైన ఉద్రిక్తతను పాదసూచికతో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. పరలోక రాజసభ దృశ్యపు గంభీరతను నిలుపుతూ, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదాలను ఎంచుకున్నాం.
