source:
  edition: WLC
  text: וְ/הַ/מַּלְאָ֞ךְ אֲשֶׁר הָלַ֣ךְ לִ/קְרֹ֣א לְ/מִיכָ֗יְהוּ דִּבֶּ֤ר אֵלָי/ו֙ לֵ/אמֹ֔ר הִנֵּ֞ה דִּבְרֵ֧י הַ/נְּבִאִ֛ים פֶּֽה אֶחָ֥ד ט֖וֹב אֶל הַ/מֶּ֑לֶךְ וִֽ/יהִי נָ֧א דְבָרְ/ךָ֛ כְּ/אַחַ֥ד מֵ/הֶ֖ם וְ/דִבַּ֥רְתָּ טּֽוֹב־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/012.yaml
  text: The messenger who had gone to summon Micaiah spoke to him[a], saying, “Look, the words of the prophets are unanimously favorable to the king. Please let your word be like one of theirs, and speak favorably.”
translation:
  language: te
  text: 'మీకాయాను పిలుచుకొని రావడానికి వెళ్లిన దూత అతనితో ఇలా అన్నాడు: “ఇదిగో, ప్రవక్తల మాటలు ఏకకంఠంగా[a] రాజుకు అనుకూలంగా ఉన్నాయి. దయచేసి నీ మాట కూడా వారిలో ఒకరి మాటవలె ఉండనివ్వు; అనుకూలంగా మాట్లాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఒకే నోటితో”; అంటే పూర్తి ఏకాభిప్రాయంతో లేదా ఒకే స్వరంతో.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: దూత
  rationale: ఈ సందర్భంలో మీకాయాను పిలవడానికి పంపబడిన మానవ ప్రతినిధిని సూచిస్తుంది; అందువల్ల ‘దేవదూత’ కంటే ‘దూత’ సముచితం.
- source_word: לִקְרֹא
  choice: పిలుచుకొని రావడానికి
  rationale: రాజు సమక్షానికి హాజరయ్యేలా అధికారికంగా పిలిపించడం అనే సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְמִיכָיְהוּ
  choice: మీకాయా
  rationale: హీబ్రూ వ్యక్తినామానికి ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: דִּבֶּר אֵלָיו לֵאמֹר
  choice: అతనితో ఇలా అన్నాడు
  rationale: హీబ్రూ కథన సూత్రాన్ని తెలుగులో సహజంగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే హీబ్రూ సూచనాత్మక పదం బలాన్ని నిలుపుతుంది.
- source_word: דִּבְרֵי הַנְּבִאִים
  choice: ప్రవక్తల మాటలు
  rationale: మూలంలోని బహువచన నిర్మాణాన్ని నేరుగా నిలుపుతుంది.
- source_word: פֶּה אֶחָד
  choice: ఏకకంఠంగా
  rationale: అక్షరార్థంగా ‘ఒకే నోటితో’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థకం; అక్షరార్థ రూపాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: טוֹב אֶל הַמֶּלֶךְ
  choice: రాజుకు అనుకూలంగా
  rationale: ఇక్కడ ‘మంచి’ అనేది రాజుకు మద్దతుగా లేదా అనుకూలంగా ఉన్న ప్రవచనాన్ని సూచిస్తుంది.
- source_word: וִיהִי נָא
  choice: దయచేసి ... ఉండనివ్వు
  rationale: జస్సివ్ రూపం మరియు נָא తెలిపే మర్యాదపూర్వక విజ్ఞప్తిని నిలుపుతుంది.
- source_word: דְבָרְךָ
  choice: నీ మాట
  rationale: మీకాయా పలకబోయే ప్రవచనాన్ని ఒక సమగ్ర సందేశంగా సూచించే మూలంలోని ఏకవచనాన్ని నిలుపుతుంది.
- source_word: כְּאַחַד מֵהֶם
  choice: వారిలో ఒకరి మాటవలె
  rationale: ముందు ప్రస్తావించిన ప్రవక్తల మాటతో మీకాయా మాటను పోల్చుతున్న భావాన్ని తెలుగులో స్పష్టంగా చేస్తుంది.
- source_word: וְדִבַּרְתָּ טּוֹב
  choice: అనుకూలంగా మాట్లాడు
  rationale: రాజుకు అనుకూలమైన ప్రవచనం పలకమనే ఒత్తిడిని సహజంగా వ్యక్తం చేస్తుంది; ముందున్న טוב భావాన్ని పునరావృతం చేస్తుంది.
