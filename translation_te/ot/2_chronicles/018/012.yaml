translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో ‘ఏకకంఠంగా’ అని స్పష్టంగా అనువదించి, దాని మూలచిత్రాన్ని పాదసూచికలో నిలిపాం. మూలంలో స్పష్టమైన కాలసూచక ‘ఇప్పుడు’ లేకపోవడంతో దానిని చేర్చలేదు.
