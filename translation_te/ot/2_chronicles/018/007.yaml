  to: అప్పుడు ఇశ్రాయేలు రాజు యెహోషాపాతుతో, “యాహ్వేను అతని ద్వారా విచారించడానికి ఇంకా ఒక వ్యక్తి ఉన్నాడు. అయితే నేను అతన్ని ద్వేషిస్తున్నాను; ఎందుకంటే అతడు నా గురించి మేలు ప్రవచించడు, ఎప్పుడూ కీడునే ప్రవచిస్తాడు. అతడు ఇమ్లా కుమారుడు మీకాయా” అన్నాడు. అందుకు యెహోషాపాతు, “రాజు అలా అనకూడదు” అన్నాడు.
  rationale: మధ్యవర్తిత్వాన్ని సూచించే מֵאֹתוֹను ప్రధాన పాఠ్యంలో ‘అతని ద్వారా’గా చేర్చాం; కాబట్టి ఆ సమాచారం కోసం పాదటిప్పణి అవసరం లేదు. ‘ఎప్పుడూ’ ద్వారా כָּל־יָמָיו యొక్క నానుడి-స్వరూపమైన నిరంతరతను సహజంగా వ్యక్తం చేశాం. దైవనామాన్ని POBలోని ‘Yahweh’ నిర్ణయానికి అనుగుణంగా ‘యాహ్వే’గా మార్చాం. మిగిలిన వాక్యనిర్మాణం, వ్యక్తినామాలు, రాజుతో యెహోషాపాతు మాట్లాడే మర్యాదపూర్వక స్వరం నిలిపాం.
