source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֶֽלֶךְ יִשְׂרָאֵ֣ל אֶֽל יְהוֹשָׁפָ֡ט ע֣וֹד אִישׁ אֶחָ֡ד לִ/דְרוֹשׁ֩ אֶת יְהוָ֨ה מֵֽ/אֹת֜/וֹ וַ/אֲנִ֣י שְׂנֵאתִ֗י/הוּ כִּֽי אֵ֠ינֶ/נּוּ מִתְנַבֵּ֨א עָלַ֤/י לְ/טוֹבָה֙ כִּ֣י כָל יָמָ֣י/ו לְ/רָעָ֔ה ה֖וּא מִיכָ֣יְהוּ בֶן יִמְלָ֑א וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט אַל יֹאמַ֥ר הַ/מֶּ֖לֶךְ כֵּֽן־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/007.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “There is still one man by whom we may inquire of Yahweh, but I hate him, because he never prophesies good concerning me, but always evil. He is Micaiah son of Imla.” Jehoshaphat said, “Let not the king say so.”
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు రాజు యెహోషాపాతుతో, “యాహ్వేను అతని ద్వారా విచారించడానికి ఇంకా ఒక వ్యక్తి ఉన్నాడు. అయితే నేను అతన్ని ద్వేషిస్తున్నాను; ఎందుకంటే అతడు నా గురించి మేలు ప్రవచించడు, ఎప్పుడూ కీడునే ప్రవచిస్తాడు. అతడు ఇమ్లా కుమారుడు మీకాయా” అన్నాడు. అందుకు యెహోషాపాతు, “రాజు అలా అనకూడదు” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ע֣וֹד אִישׁ אֶחָד
  choice: ఇంకా ఒక మనిషి ఉన్నాడు
  rationale: עֹוד ఇక్కడ మిగిలి ఉన్న మరొక వ్యక్తిని సూచిస్తుంది. ‘ఇంకా ఒక మనిషి ఉన్నాడు’ సహజమైన ఆధునిక తెలుగులో ఆ భావాన్ని నిలుపుతుంది.
- source_word: לִדְרוֹשׁ אֶת־יְהוָה מֵאֹתוֹ
  choice: యెహోవాను సంప్రదించడానికి[a]
  rationale: דרשׁ אֶת־יְהוָה ప్రవక్త ద్వారా యెహోవా మాటను అడిగి తెలుసుకోవడాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన సంక్షిప్త రూపాన్ని ఉంచి, מֵאֹתוֹ తెలిపే మధ్యవర్తిత్వ భావాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
- source_word: וַאֲנִי שְׂנֵאתִיהוּ
  choice: అయితే అతనంటే నాకు ద్వేషం
  rationale: పూర్తయిన క్రియ ఇక్కడ రాజుకు నిలకడగా ఉన్న వైఖరిని తెలియజేస్తుంది. వర్తమాన స్థితిని తెలిపే తెలుగు రూపం తగినది.
- source_word: כִּי אֵינֶנּוּ מִתְנַבֵּא עָלַי לְטוֹבָה
  choice: ఎందుకంటే అతడు నా గురించి మేలు ప్రవచించడు
  rationale: నిషేధంతో కూడిన participle అలవాటైన లేదా లక్షణాత్మక చర్యను సూచిస్తుంది. ‘ప్రవచించడు’ ఆ నిరంతర ధోరణిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי כָל־יָמָיו לְרָעָה
  choice: తన రోజులన్నిటిలో కీడునే ప్రవచిస్తాడు
  rationale: అక్షరార్థంగా ‘తన రోజులన్నిటిలో కీడు కోసం’ అనే ఈ సంక్షిప్త వాక్యంలో ‘ప్రవచించడం’ ముందటి ఉపవాక్యం నుంచి అర్థమవుతుంది. ‘కీడునే ప్రవచిస్తాడు’ ప్రతికూల సందేశం అనే భావాన్ని, ‘తన రోజులన్నిటిలో’ మూలంలోని కాలవ్యాప్తిని నిలుపుతుంది.
- source_word: מִיכָיְהוּ בֶן־יִמְלָא
  choice: ఇమ్లా కుమారుడు మీకాయా
  rationale: హీబ్రూ పేర్లను తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించి, పితృనామ సంబంధాన్ని స్పష్టంగా ఉంచాం.
- source_word: אַל יֹאמַר הַמֶּלֶךְ כֵּן
  choice: రాజు అలా అనకూడదు
  rationale: אַל + imperfect తెలిపే మర్యాదపూర్వక నిషేధాన్ని, రాజును పరోక్షంగా సంబోధించే మూల స్వరాన్ని ఈ రూపం సహజ తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో దైవనామం ప్రత్యక్షంగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా వ్యక్తినామంగానే ఉంచాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: לְרָעָה లోని ‘కీడు’ భావం
  choice: కీడునే ప్రవచిస్తాడు
  alternative: అనర్థాన్నే ప్రవచిస్తాడు
  rationale: רָעָה నైతిక చెడును గానీ, విపత్తు లేదా ప్రతికూల ఫలితాన్ని గానీ సూచించగలదు. ‘కీడు’ ఆ విస్తృతిని పూర్తిగా నిర్ణయించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కథన శైలిని వాడాం. సంభాషణ సహజంగా ఉండేలా చూసి, మూలంలోని రాజసంబంధ మర్యాదను మరియు ప్రవచన భాషలోని ఉద్రిక్తతను నిలిపాం.
