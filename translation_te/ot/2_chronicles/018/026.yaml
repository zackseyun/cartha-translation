translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. రాజాజ్ఞలోని అధికారిక స్వరాన్ని నిలుపుతూ, హెబ్రీ జాతీయ పదబంధాన్ని ప్రధాన పాఠంలో కొంతవరకు సంరక్షించి దాని సాధ్యమైన సందర్భార్థాన్ని పాదటిప్పణిలో వివరించాం.
