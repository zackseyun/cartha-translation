- from: 'మరియు ఇలా చెప్పండి: “రాజు చెప్పేది ఇదే: ‘ఈ మనిషిని చెరసాలలో వేయండి. నేను క్షేమంగా తిరిగి వచ్చేవరకు అతనికి కష్టపు ఆహారమూ కష్టపు నీళ్లూ ఇవ్వండి[a].’”'
  to: 'మరియు ఇలా చెప్పండి: “రాజు చెప్పేది ఇదే: ‘ఈ మనిషిని చెరసాలలో వేయండి. నేను క్షేమంగా తిరిగి వచ్చేవరకు అతనికి కష్టాల రొట్టెను, కష్టాల నీటిని ఇవ్వండి[a].’”'
