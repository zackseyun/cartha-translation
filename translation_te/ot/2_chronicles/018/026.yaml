  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֗ם כֹּ֚ה אָמַ֣ר הַ/מֶּ֔לֶךְ שִׂ֥ימוּ זֶ֖ה בֵּ֣ית הַ/כֶּ֑לֶא וְ/הַאֲכִלֻ֜/הוּ לֶ֤חֶם לַ֨חַץ֙ וּ/מַ֣יִם לַ֔חַץ עַ֖ד שׁוּבִ֥/י בְ/שָׁלֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/026.yaml
  text: 'and say[a], ‘Thus says the king: Put this man in the prison, and feed him with bread of affliction and water of affliction until I return in peace.’'
translation:
  language: te
  text: 'మరియు ఇలా చెప్పండి: “రాజు చెప్పేది ఇదే: ‘ఈ మనిషిని చెరసాలలో వేయండి. నేను క్షేమంగా తిరిగి వచ్చేవరకు అతనికి కష్టాల రొట్టెను, కష్టాల నీటిని ఇవ్వండి[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బాధల రొట్టెను, బాధల నీటిని.” ఇవి చెరసాలలో కష్టాలు, కొరతల మధ్య ఇచ్చే పరిమిత రేషన్‌లను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: మరియు ఇలా చెప్పండి
  rationale: రాజు ఇస్తున్న ఆజ్ఞకు కొనసాగింపుగా ఉన్న ద్వితీయ పురుష బహువచన రూపాన్ని సహజమైన తెలుగు ఆజ్ఞార్థక వాక్యంగా అందిస్తుంది.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: రాజు చెప్పేది ఇదే
  rationale: అధికారిక వర్తమాన ప్రకటనను సూచించే ప్రామాణిక దూతసూత్రానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: שִׂימוּ זֶה
  choice: ఈ మనిషిని ... వేయండి
  rationale: ‘ఈ వ్యక్తి’ అని సూచిస్తున్న నిర్దేశక సర్వనామం మీకాయాను ఉద్దేశిస్తుంది; మూలంలో లేనంత అవమానార్థాన్ని చేర్చకుండా సూచనను స్పష్టం చేస్తుంది.
- source_word: בֵּית הַכֶּלֶא
  choice: చెరసాలలో
  rationale: అక్షరార్థంగా ‘నిర్బంధ గృహం’; తెలుగులో స్పష్టమైన, సహజమైన సమానార్థకం.
- source_word: וְהַאֲכִלֻהוּ
  choice: అతనికి ... ఆహారం ... ఇవ్వండి
  rationale: హిఫీల్ ఆజ్ఞార్థక రూపంలోని ‘అతనికి తినిపించండి’ అనే భావాన్ని సందర్భానుకూలంగా సహజీకరిస్తుంది.
- source_word: לֶחֶם לַחַץ
  choice: కష్టపు ఆహారం
  rationale: ‘లెహెమ్’ సాధారణంగా రొట్టె అయినా విస్తృతంగా ఆహారాన్ని కూడా సూచించగలదు; ‘కష్టపు’ అనే రూపం నిర్బంధంతో ముడిపడిన బాధ, కొరత అనే మూలభావాన్ని నిలుపుతుంది.
- source_word: וּמַיִם לַחַץ
  choice: కష్టపు నీళ్లు
  rationale: ముందరి పదబంధంతో ఉన్న హెబ్రీ సమాంతరతను కాపాడుతూ బాధాకరమైన, కొరతగల నిర్బంధ రేషన్ భావాన్ని నిలుపుతుంది.
- source_word: עַד שׁוּבִי בְשָׁלוֹם
  choice: నేను క్షేమంగా తిరిగి వచ్చేవరకు
  rationale: యుద్ధం నుంచి సురక్షితంగా తిరిగి రావడం అనే בְשָׁלוֹם భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ సందర్భంలోని వ్యంగ్య ఉద్రిక్తతను నిలుపుతుంది.
