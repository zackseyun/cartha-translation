base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/014.yaml
  text: So he came to the king[a], and the king said to him, “Micaiah, should we go to Ramoth-gilead for battle, or should I refrain?” And he said, “Go up and prosper, and they will be given into your hand.”
translation:
  language: te
  text: అతడు రాజు వద్దకు వచ్చాడు. రాజు అతనితో, “మీకాయా, మేము యుద్ధానికి రామోత్-గిలాదుకు వెళ్లాలా, లేక నేను మానుకోవాలా?” అని అడిగాడు. అతడు, “వెళ్లండి, విజయం సాధించండి; వారు మీ చేతికి అప్పగించబడతారు” అని జవాబిచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: చుట్టూ ఉన్న కథనాన్ని బట్టి మీకాయా సమాధానం వ్యంగ్యంగా లేదా ఎగతాళిగా చెప్పబడినదై ఉండవచ్చు; అయితే హీబ్రూ పాఠ్యం ఆ వ్యంగ్యాన్ని ప్రత్యక్షంగా సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֶל־הַמֶּלֶךְ
  choice: అతడు రాజు దగ్గరికి వచ్చాడు
  rationale: క్రమంగా జరిగిన తదుపరి సంఘటనను సహజమైన తెలుగు కథనశైలిలో వ్యక్తం చేస్తుంది.
- source_word: מִיכָה
  choice: మీకాయా
  rationale: ఈ కథనంలోని ప్రవక్త పేరుకు సాధారణ తెలుగు లిప్యంతరీకరణ; సంబోధన రూపాన్ని చూపుతుంది.
- source_word: הֲנֵלֵךְ
  choice: మేము ... వెళ్లాలా
  rationale: మొదటి పురుష బహువచనంలోని ఆలోచనాత్మక ప్రశ్నను స్పష్టంగా నిలుపుతుంది.
- source_word: רָמֹת גִּלְעָד
  choice: రామోత్-గిలాదు
  rationale: స్థలనామాన్ని మూలానికి దగ్గరగా లిప్యంతరీకరిస్తుంది; వాక్యంలో గమ్యార్థం కోసం ‘రామోత్-గిలాదుకు’గా విభక్తి జోడించబడింది.
- source_word: לַמִּלְחָמָה
  choice: యుద్ధానికి
  rationale: ל ఉపసర్గలోని ప్రయోజనార్థాన్ని సహజంగా, సంక్షిప్తంగా తెలుపుతుంది.
- source_word: אִם־אֶחְדָּל
  choice: లేక నేను మానుకోవాలా
  rationale: ‘మేము వెళ్లాలా’ అన్న బహువచనం నుంచి ‘నేను మానుకోవాలా’ అన్న ఏకవచనానికి మూలంలో ఉన్న మార్పును సరిచేయకుండా నిలుపుతుంది.
- source_word: עֲלוּ
  choice: వెళ్లండి
  rationale: עלה ఇక్కడ సైనికంగా గమ్యస్థానానికి వెళ్లడాన్ని సూచిస్తుంది; ‘పైకి వెళ్లండి’ అనే అసహజ భౌగోళిక అర్థాన్ని రుద్దకుండా ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: וְהַצְלִיחוּ
  choice: విజయం సాధించండి
  rationale: ఈ సైనిక సందర్భంలో צלח యొక్క సఫలత భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְיִנָּתְנוּ בְּיֶדְכֶם
  choice: వారు మీ చేతికి అప్పగించబడతారు
  rationale: మూలంలోని బహువచన నిష్క్రియ రూపాన్నీ, ‘చేతికి అప్పగించడం’ అనే అధికారంలోకి ఇవ్వబడే హీబ్రూ నుడికారాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: మీకాయా సమాధానం వ్యంగ్యమా లేదా నేరుగా చెప్పినదా
  choice: ప్రధాన పాఠ్యంలో సానుకూలంగా వినిపించే మూలపదాలనే ఉంచి, వ్యంగ్యాన్ని స్పష్టంగా చేర్చలేదు
  alternative: ‘వ్యంగ్యంగా’ అని చేర్చడం లేదా ఎగతాళిని సూచించే పదప్రయోగం చేయడం
  rationale: చుట్టూ ఉన్న కథనం ఈ సమాధానం వ్యంగ్యంగా ఉండవచ్చని బలంగా సూచించినా, హీబ్రూ వాక్యం స్వయంగా వ్యంగ్య సూచికను ఇవ్వదు. అందువల్ల ఆ ఉద్వేగాన్ని ప్రధాన పాఠ్యంలో పరిష్కరించకుండా పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని ‘మేము’ నుంచి ‘నేను’కి మార్పు, చివరి క్రియలోని అస్పష్ట బహువచనం, సమాధానంలోని సంభావ్య వ్యంగ్యం అన్నీ సరిచేయకుండా నిలుపబడ్డాయి.
