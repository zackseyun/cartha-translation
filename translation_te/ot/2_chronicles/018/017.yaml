id: 2CH.18.17
reference: 2 Chronicles 18:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֶֽלֶךְ יִשְׂרָאֵ֖ל אֶל יְהוֹשָׁפָ֑ט הֲ/לֹא֙ אָמַ֣רְתִּי אֵלֶ֔י/ךָ לֹא יִתְנַבֵּ֥א עָלַ֛/י ט֖וֹב כִּ֥י אִם לְ/רָֽע־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/017.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Did I not tell you that he would not prophesy good concerning me, but only evil?”
translation:
  language: te
  text: 'అప్పుడు ఇశ్రాయేలు రాజు యెహోషాపాతుతో ఇలా అన్నాడు: “ఇతడు నా గురించి మేలును ప్రవచించడు, కీడునే ప్రవచిస్తాడని నేను నీతో చెప్పలేదా?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇతడు నా గురించి మంచిదేదీ ప్రవచించడు, విపత్తునే ప్రవచిస్తాడని నేను నీతో చెప్పలేదా?”
    reason: ‘మేలు/కీడు’ అనే పదజంట ఇక్కడ అనుకూల సందేశం మరియు విపత్తు గురించిన సందేశాన్ని కూడా సూచించగలదనే భావ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: హీబ్రూ నిర్మాణాన్ని స్పష్టంగా, సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: אֶל יְהוֹשָׁפָט
  choice: యెహోషాపాతుతో
  rationale: మాట ఎవరిని ఉద్దేశించి చెప్పబడిందో తెలుగులో సహజంగా తెలియజేస్తుంది; మూలంలో లేని ‘రాజు’ అనే బిరుదును చేర్చదు.
- source_word: הֲלֹא אָמַרְתִּי אֵלֶיךָ
  choice: నేను నీతో చెప్పలేదా?
  rationale: అంగీకారాన్ని ఆశించే హీబ్రూ అలంకారప్రశ్నను, గతంలో చెప్పిన మాటను సూచించే విధంగా సహజ తెలుగులో నిలుపుతుంది.
- source_word: לֹא יִתְנַבֵּא
  choice: ప్రవచించడు
  rationale: గతంలో చెప్పినప్పటికీ, మీకాయా అలవాటుగా లేదా ఊహించదగిన విధంగా చేసే ప్రవచనాన్ని రాజు పేర్కొంటున్నాడు; తెలుగు వర్తమాన-భవిష్యత్ రూపం ఈ భావాన్ని సహజంగా మోస్తుంది.
- source_word: עָלַי
  choice: నా గురించి
  rationale: ప్రవచనానికి రాజే విషయమని స్పష్టపరుస్తుంది; ‘నాకు అనుకూలంగా’ అని భావాన్ని ముందే నిర్ణయించదు.
- source_word: טוֹב
  choice: మేలు
  rationale: నామవాచకంగా వాడిన ‘మంచి/మేలు’ భావాన్ని సంక్షిప్తంగా అందిస్తూ, ‘కీడు’తోని మూల విరుద్ధతను నిలుపుతుంది.
- source_word: כִּי אִם לְרָע
  choice: కీడే ప్రవచిస్తాడు
  rationale: כִּי אִם యొక్క బలమైన మినహాయింపు భావాన్ని ‘-ఏ’ ద్వారా వ్యక్తం చేస్తుంది; לְרָעను ప్రతికూలమైన లేదా విపత్తుకరమైన సందేశంగా అర్థం చేసుకునే అవకాశాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ప్రవచించబడిన సందేశ స్వభావం
  choice: మేలు ... కీడే
  alternative: మంచి ... విపత్తే; అనుకూలమైనది ... హానికరమైనదే
  rationale: ఇక్కడ నైతిక దుష్టత్వంపై సిద్ధాంత ప్రకటన చేయడం లేదు; తన గురించి మీకాయా ఎప్పుడూ ప్రతికూల ఫలితమే చెబుతాడని రాజు ఫిర్యాదు చేస్తున్నాడు. అయినా హీబ్రూలోని טוב/רע స్పష్టమైన విరుద్ధతను ‘మేలు/కీడు’గా ఉంచడం మూలంలోని ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ‘ప్రవచించు’, ‘మేలు’, ‘కీడు’ వంటి గౌరవప్రదమైన బైబిలు పదజాలం నిలుపబడింది. అలంకారప్రశ్న మరియు మూలంలోని మేలు–కీడు విరుద్ధత భద్రపరచబడ్డాయి.
