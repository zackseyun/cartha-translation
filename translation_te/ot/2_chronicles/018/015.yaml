source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ הַ/מֶּ֔לֶךְ עַד כַּ/מֶּ֥ה פְעָמִ֖ים אֲנִ֣י מַשְׁבִּיעֶ֑/ךָ אֲ֠שֶׁר לֹֽא תְדַבֵּ֥ר אֵלַ֛/י רַק אֱמֶ֖ת בְּ/שֵׁ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/015.yaml
  text: Then the king said to him, “How many times must I make you swear that you tell me nothing but the truth in the name of Yahweh?”
translation:
  language: te
  text: అప్పుడు రాజు అతనితో, “యెహోవా పేరున నాతో సత్యం తప్ప మరేదీ చెప్పవద్దని నేను నిన్ను ఎన్నిసార్లు ప్రమాణం చేయించాలి?” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: హీబ్రూలో వ్యక్తిపేరు కాక బిరుదే ఉంది; తెలుగులో నిర్దిష్టత సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: עַד כַּמֶּה פְעָמִים
  choice: ఎన్నిసార్లు
  rationale: పునరావృతంపై విసుగును తెలిపే ప్రశ్నకు ఇది సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: מַשְׁבִּיעֶךָ
  choice: నేను నీతో ... ప్రమాణం చేయించాలి
  rationale: שבע హిఫిల్ రూపం మరొకరిని ప్రమాణం చేయించడాన్ని సూచిస్తుంది; ప్రశ్నలోని విసుగు ‘చేయించాలి’ ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: אֲשֶׁר לֹא תְדַבֵּר אֵלַי רַק אֱמֶת
  choice: నాతో నిజం తప్ప మరేమీ చెప్పవద్దని
  rationale: నిషేధం మరియు רַק యొక్క ప్రత్యేకార్థాన్ని కలిపి, ‘నిజం తప్ప మరేమీ’ అనే సహజమైన తెలుగు ప్రమాణ వాక్యంగా అనువదించబడింది.
- source_word: בְּשֵׁם יְהוָה
  choice: యెహోవా పేరట
  rationale: దైవనామపు అధికారంతో లేదా దానిని సాక్షిగా ఉంచి పలకడాన్ని ‘పేరట’ సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపం పేరును పేరుగానే ఉంచుతుంది; ‘ప్రభువు’ అని బిరుదుతో మార్చదు. ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం అయినా, ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిర్ధారితం కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే రాజు విధించే ప్రమాణపు గంభీరతను నిలుపుకుంది. మూలంలోని అలంకారిక విసుగు ప్రశ్న రూపంలోనే ఉంచబడింది.
