id: 2CH.18.5
reference: 2 Chronicles 18:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְבֹּ֨ץ מֶֽלֶךְ יִשְׂרָאֵ֥ל אֶֽת הַ/נְּבִאִים֮ אַרְבַּ֣ע מֵא֣וֹת אִישׁ֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם הֲ/נֵלֵ֞ךְ אֶל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם אֶחְדָּ֑ל וַ/יֹּאמְר֣וּ עֲלֵ֔ה וְ/יִתֵּ֥ן הָ/אֱלֹהִ֖ים בְּ/יַ֥ד הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/005.yaml
  text: So the king of Israel gathered the prophets[a], four hundred men, and said to them, “Should we go to Ramoth-gilead for battle, or should I refrain?” And they said, “Go up[b], and God will give it into the hand of the king.”
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు రాజు ప్రవక్తలైన నాలుగు వందల మంది పురుషులను సమకూర్చి, వారితో, “మనం యుద్ధానికి రామోత్-గిలాదుకు వెళ్లాలా? లేక నేను మానుకోవాలా?” అని అడిగాడు. వారు, “వెళ్లండి; దేవుడు దానిని రాజు చేతికి అప్పగిస్తాడు[a]” అని చెప్పారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘రాజు చేతికి’ అని ఉంది; ఏ రాజు అనేది ఇక్కడ మరింత స్పష్టంగా చెప్పబడలేదు. ‘చేతికి అప్పగించడం’ అంటే అతని అధికారం లేదా వశంలోకి ఇవ్వడం.
    reason: హీబ్రూ నుడికారాన్ని మరియు ‘రాజు’ అనే పదంలోని నిర్దిష్టీకరించని సూచనను వివరించడం.
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: సమకూర్చి
  rationale: కבץ అంటే సమకూర్చడం లేదా సమావేశపరచడం. రాజు ప్రవక్తలను ఒకచోట చేర్చిన చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַנְּבִאִים
  choice: ప్రవక్తలను
  rationale: נביאים కు ప్రామాణికమైన, సూటియైన తెలుగు పదం ‘ప్రవక్తలు’; సందర్భం వేరే వివరణాత్మక పదాన్ని కోరదు.
- source_word: אַרְבַּע מֵאוֹת אִישׁ
  choice: నాలుగు వందల మందిని
  rationale: హీబ్రూలో సంఖ్య తరువాత אִישׁ ఉంది. తెలుగులో ‘మందిని’ అనడం వ్యక్తుల సంఖ్యను సహజంగా, స్పష్టంగా సూచిస్తుంది.
- source_word: הֲנֵלֵךְ
  choice: మనం ... వెళ్లాలా?
  rationale: క్రియ ప్రథమ పురుష బహువచన ప్రశ్న. ‘మనం’ ఆ బహువచనాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: רָמֹת גִּלְעָד
  choice: రామోత్-గిలాదు
  rationale: ఇది స్థలనామం; అర్థానువాదం చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించబడింది.
- source_word: לַמִּלְחָמָה
  choice: యుద్ధం చేయడానికి
  rationale: ల ఉపసర్గ ఉద్దేశాన్ని సూచిస్తుంది. యుద్ధ ప్రయోజనంతో వెళ్లడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אִם אֶחְדָּל
  choice: లేక నేను మానుకోవాలా?
  rationale: ఈ క్రియ ప్రథమ పురుష ఏకవచనంలో ఉంది. ముందున్న ‘మనం’ నుండి ‘నేను’కు మార్పును సమన్వయం చేయకుండా మూలపాఠంలాగే నిలుపుతుంది.
- source_word: עֲלֵה
  choice: వెళ్లండి
  rationale: עלה ఇక్కడ ప్రయాణం లేదా సైనిక కదలికలో ‘పైకి వెళ్లడం/వెళ్లడం’ అనే భావం ఇస్తుంది. తెలుగులో ‘వెళ్లండి’ సహజంగా ఉండి, యుద్ధార్థాన్ని సందర్భానికే వదిలేస్తుంది.
- source_word: וְיִתֵּן
  choice: అప్పగిస్తాడు
  rationale: נתן సాధారణంగా ‘ఇవ్వు’; ‘చేతికి ఇవ్వడం’ అనే హీబ్రూ నుడికారంలో ‘అప్పగిస్తాడు’ అధికారం లేదా వశంలోకి ఇవ్వడాన్ని సహజంగా తెలియజేస్తుంది. హీబ్రూలో ప్రత్యక్ష కర్మ ఉక్తం కాకపోయినా, తెలుగులో ‘దానిని’ సందర్భసూచకంగా చేర్చబడింది.
- source_word: הָאֱלֹהִים
  choice: దేవుడు
  rationale: రూపం బహువచనాకారంగా ఉన్నా, יִתֵּן అనే క్రియ ఏకవచనంలో ఉంది; ఈ సందర్భంలో ఏకవచన దేవునినే సూచిస్తుంది.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: రాజు చేతికి
  rationale: ‘చేతిలో/చేతికి ఇవ్వడం’ అధికారం లేదా వశాన్ని సూచించే హీబ్రూ నుడికారం. తెలుగు రూపం నుడికారాన్ని నిలుపుతూ అర్థమయ్యేలా ఉంది.
theological_decisions:
- issue: ప్రవక్తల జవాబులో ‘రాజు’ ఎవరిని సూచిస్తున్నాడు?
  choice: మూలపాఠంలోని నిర్దిష్టీకరించని ‘రాజు’ అనే పదాన్నే నిలుపడం
  alternative: ‘నీ చేతికి’ అని అహాబును ప్రత్యక్షంగా సూచించడం, లేదా ‘ఇశ్రాయేలు రాజు చేతికి’ అని స్పష్టీకరించడం
  rationale: హీబ్రూ పాఠం ‘నీ చేతికి’ అనకుండా ‘రాజు చేతికి’ అని మాత్రమే చెబుతుంది. అందువల్ల అనిశ్చితిని అనువాదంలో పరిష్కరించకుండా నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘మనం’ నుండి ‘నేను’కు మూలపాఠంలో ఉన్న సంఖ్యామార్పు నిలుపబడింది. స్థలనామం లిప్యంతరీకరించబడింది; హీబ్రూ నుడికారాన్ని తెలుగు పాఠ్యంలో సాధ్యమైనంతవరకు కాపాడి, పాదటిప్పణిలో వివరించబడింది.
