source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/רְאוֹת֙ שָׂרֵ֣י הָ/רֶ֔כֶב כִּ֥י לֹא הָיָ֖ה מֶ֣לֶךְ יִשְׂרָאֵ֑ל וַ/יָּשֻׁ֖בוּ מֵ/אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/032.yaml
  text: And when the commanders of the chariots saw that he was not the king of Israel[a], they turned back from following him.
translation:
  language: te
  text: రథదళాధిపతులు అతడు ఇశ్రాయేలు రాజు కాదని చూసినప్పుడు, వారు అతణ్ణి వెంబడించడం మాని వెనుదిరిగారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ అక్షరార్థంగా, “వారు అతని వెనుకనుండి వెనుదిరిగారు”; అంటే వారు అతణ్ణి అనుసరించడం లేదా వెంబడించడం ఆపేశారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: గ్రహించినప్పుడు
  rationale: ఈ కథన సందర్భంలో וַיְהִי తదుపరి సంఘటనను పరిచయం చేస్తుంది; כִּרְאוֹת కాలార్థకంగా ‘చూసినప్పుడు’ అని అర్థమిస్తుంది. వారు వ్యక్తిని గుర్తించారనే భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘గ్రహించినప్పుడు’ తెలియజేస్తుంది.
- source_word: שָׂרֵי הָרֶכֶב
  choice: రథదళాధిపతులు
  rationale: שָׂרֵי అంటే సైనిక అధిపతులు; הָרֶכֶב ఇక్కడ విడివిడిగా ఉన్న రథాలకన్నా రథదళాన్ని సూచిస్తుంది. ‘రథదళాధిపతులు’ సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: כִּי לֹא הָיָה מֶלֶךְ יִשְׂרָאֵל
  choice: అతడు ఇశ్రాయేలు రాజు కాదని
  rationale: హీబ్రూలో కర్త ప్రత్యక్షంగా లేకపోయినా, తరువాతి מֵאַחֲרָיו లోని ఏకవచన పురుష ప్రత్యయం వారు వెంబడించిన వ్యక్తినే సూచిస్తుంది. తెలుగులో సహజత్వం కోసం ‘అతడు’ చేర్చబడింది.
- source_word: וַיָּשֻׁבוּ מֵאַחֲרָיו
  choice: వారు అతణ్ణి వెంబడించడం మాని వెనుదిరిగారు
  rationale: שׁוב అంటే ‘వెనుదిరుగు’; מֵאַחֲרָיו అక్షరార్థంగా ‘అతని వెనుకనుండి’ అయినా, ఈ సందర్భంలో అతణ్ణి అనుసరించడం లేదా తరుమడం ఆపారని తెలిపే నుడికారం. ‘వెంబడించడం మాని వెనుదిరిగారు’ సందర్భార్థాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘రథదళాధిపతులు’ సైనిక సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘వెంబడించడం మాని వెనుదిరిగారు’ హీబ్రూ నుడికారపు సందర్భార్థాన్ని పాఠకులకు సులభంగా అందిస్తుంది.
