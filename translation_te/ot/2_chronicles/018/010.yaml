revisions:
- from: 'అప్పుడు కనయనా కుమారుడైన సిద్కియా తనకోసం ఇనుప కొమ్ములు తయారుచేసుకొని ఇలా అన్నాడు: “యెహోవా ఇలా అంటున్నాడు: ‘వీటితో నీవు అరామును వారు పూర్తిగా నాశనమయ్యేంతవరకు కుమ్ముతావు[a].’”[b]'
  to: 'అప్పుడు కనానా కుమారుడైన సిద్కియా తనకోసం ఇనుప కొమ్ములు తయారుచేసి ఇలా అన్నాడు: “యహ్వే ఇలా అంటున్నాడు: ‘వీటితో నీవు అరామును అరామీయులు పూర్తిగా నాశనమయ్యేంతవరకు కుమ్ముతావు[a].’”[b]'
