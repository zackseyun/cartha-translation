    rationale: మూలంలో יְהוָה ఉంది; అందించిన ఆంగ్ల POB audit trail మరియు ప్రాజెక్టు నిర్ణయం దానిని ‘Yahweh’గా ఇస్తున్నాయి. తెలుగు లిప్యంతరీకరణ ‘యహ్వే’ ఆ నిర్ణయానికి సమీపంగా ఉంటుంది.
