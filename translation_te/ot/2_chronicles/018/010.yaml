id: 2CH.18.10
reference: 2 Chronicles 18:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ ל֛/וֹ צִדְקִיָּ֥הוּ בֶֽן כְּנַעֲנָ֖ה קַרְנֵ֣י בַרְזֶ֑ל וַ/יֹּ֨אמֶר֙ כֹּֽה אָמַ֣ר יְהוָ֔ה בְּ/אֵ֛לֶּה תְּנַגַּ֥ח אֶת אֲרָ֖ם עַד כַּלּוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/010.yaml
  text: 'Then Zedekiah son of Chenaanah made horns of iron for himself and said[b][a], “Thus says Yahweh: With these you will gore Aram until they are finished off.”'
translation:
  language: te
  text: 'అప్పుడు కనానా కుమారుడైన సిద్కియా తనకోసం ఇనుప కొమ్ములు తయారుచేసి ఇలా అన్నాడు: “యహ్వే ఇలా అంటున్నాడు: ‘వీటితో నీవు అరామును అరామీయులు పూర్తిగా నాశనమయ్యేంతవరకు కుమ్ముతావు[a].’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అరామును తోస్తావు’; హీబ్రూ క్రియ కొమ్ములున్న జంతువు కొమ్ములతో కుమ్మే లేదా తోసే చర్యను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘అరాము’ అనేది దేశాన్ని సూచించవచ్చు; సందర్భానుసారం ‘అరామీయులు’ అని కూడా అనువదించవచ్చు. తక్కువ ఖచ్చితంగా, తరువాతి కాలపు పేరైన ‘సిరియా’ అని కూడా అనవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: తనకోసం తయారుచేసుకొని
  rationale: לּוֹ ఇక్కడ కర్తయైన సిద్కియానే సూచించే సహజమైన ప్రతిబింబార్థాన్ని ఇస్తుంది; ప్రవచనాత్మక సూచనక్రియలో అతడే వాటిని ఉపయోగిస్తున్న సందర్భానికి ఇది సరిపోతుంది.
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: కనయనా కుమారుడైన సిద్కియా
  rationale: హీబ్రూ వ్యక్తినామాలను తెలుగు ధ్వన్యనుసారం లిప్యంతరీకరించి, పితృనామ సంబంధాన్ని సహజమైన తెలుగులో నిలిపింది.
- source_word: קַרְנֵי בַרְזֶל
  choice: ఇనుప కొమ్ములు
  rationale: నిర్మాణ పదబంధంలోని లోహాన్ని, కొమ్ముల స్పష్టమైన ప్రతీకాత్మక చిత్రాన్ని సంక్షిప్తమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: כֹּה אָמַר יְהוָה
  choice: యెహోవా ఇలా అంటున్నాడు
  rationale: ప్రవక్తీయ దూత సూత్రాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో లిప్యంతరీకరించింది.
- source_word: בְּאֵלֶּה
  choice: వీటితో
  rationale: బహువచన సూచన ఇనుప కొమ్ములను సాధనాలుగా సూచిస్తోంది; ‘వీటితో’ ఆ సాధనార్థాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: תְּנַגַּח
  choice: కుమ్ముతావు
  rationale: కొమ్ములున్న జంతువు కొమ్ములతో కుమ్మే చర్యను సూచించే נגח యొక్క సజీవ చిత్రాన్ని తెలుగులో నిలుపుతుంది.
- source_word: אֶת אֲרָם
  choice: అరామును
  rationale: తరువాతి కాలపు ‘సిరియా’ అనే పేరును రుద్దకుండా మూలంలోని చారిత్రక నామమైన అరామును నిలుపుతుంది.
- source_word: עַד כַּלּוֹתָם
  choice: వారు పూర్తిగా నాశనమయ్యేంతవరకు
  rationale: כלה పదంలోని పూర్తవడం/అంతమవడం అనే భావాన్ని ఈ యుద్ధ సందర్భంలో సహజంగా తెలియజేస్తూ, హీబ్రూలోని మూడవ పురుష బహువచన సూచనను స్పష్టం చేస్తుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో నిలిపింది.
- issue: సిద్కియా పలికిన మాటల ప్రవచన హోదా
  choice: ‘యెహోవా ఇలా అంటున్నాడు’ అనే అతని ప్రకటనను యథాతథంగా ఉంచడం
  alternative: అతడు అబద్ధంగా ప్రవచించాడని వాక్యంలోనే వివరించడం
  rationale: ఈ వచనం సిద్కియా చేసిన ప్రకటనను నివేదిస్తుంది; దాని సత్యాసత్యాలపై కథనం తరువాత కలిగించే ఉద్రిక్తతను అనువాదం ముందుగానే పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. కొమ్ములతో కుమ్మడం అనే మూల రూపకాన్ని నిలిపి, చారిత్రక నామం ‘అరాము’ను సంరక్షించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
