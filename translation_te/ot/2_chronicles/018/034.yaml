id: 2CH.18.34
reference: 2 Chronicles 18:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תַּ֤עַל הַ/מִּלְחָמָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא וּ/מֶ֣לֶךְ יִשְׂרָאֵ֗ל הָיָ֨ה מַעֲמִ֧יד בַּ/מֶּרְכָּבָ֛ה נֹ֥כַח אֲרָ֖ם עַד הָ/עָ֑רֶב וַ/יָּ֕מָת לְ/עֵ֖ת בּ֥וֹא הַ/שָּֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/034.yaml
  text: And the battle intensified on that day[a], and the king of Israel remained standing in the chariot facing Aram until the evening; and he died at the time of the sun’s going down.
translation:
  language: te
  text: ఆ రోజున యుద్ధం తీవ్రమైంది. ఇశ్రాయేలు రాజు సాయంత్రం వరకు అరాముకు ఎదురుగా రథంలో నిలబడి ఉన్నాడు. సూర్యుడు అస్తమించే సమయానికి[a] అతడు చనిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సూర్యాస్తమయ సమయంలో” లేదా “సూర్యుడు అస్తమించినప్పుడు.”
    reason: కాలసూచక హీబ్రూ పదబంధానికి సాధ్యమైన సంక్షిప్త అనువాదాలను చూపిస్తుంది.
lexical_decisions:
- source_word: וַתַּעַל הַמִּלְחָמָה
  choice: యుద్ధం తీవ్రమైంది
  rationale: עלה అనే క్రియకు అక్షరార్థంగా ‘పైకి వెళ్లింది’ అనే భావం ఉన్నా, ‘యుద్ధం’ కర్తగా ఉన్న ఈ సందర్భంలో పోరు ఉధృతమైందనే అర్థం. ‘తీవ్రమైంది’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజు
  rationale: సాధారణ కాలసూచక పదబంధాన్ని సహజమైన ఆధునిక తెలుగు రూపంలో ఇచ్చాం.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: మూలంలోని సంబంధ నిర్మాణాన్ని స్పష్టంగా, సహజంగా అనువదిస్తుంది.
- source_word: הָיָה מַעֲמִיד
  choice: నిలబడే ఉన్నాడు
  rationale: היה + కృదంత నిర్మాణంలోని కొనసాగుతున్న స్థితిని ‘నిలబడే ఉన్నాడు’ తెలియజేస్తుంది. హిఫీల్ రూపంలో ‘నిలబెట్టబడ్డాడు/తనను నిలబెట్టుకున్నాడు’ అనే ఛాయ సాధ్యమైనా, దానిని ప్రధాన పాఠ్యంలో అనవసరంగా నిర్ధారించలేదు.
- source_word: בַּמֶּרְכָּבָה
  choice: రథంలో
  rationale: నిర్దిష్ట రథాన్ని సూచించే మూలపదానికి తెలుగులో సహజమైన సందర్భోచిత రూపం.
- source_word: נֹכַח אֲרָם
  choice: అరాముకు ఎదురుగా
  rationale: נֹכַח లోని ‘ఎదురుగా/అభిముఖంగా’ అనే స్థలార్థాన్ని కాపాడుతూ, אֲרָם అనే పేరును ‘అరాము’గా ఉంచాం; ‘అరామీయులు’ అని విస్తరించలేదు.
- source_word: עַד הָעָרֶב
  choice: సాయంత్రం వరకు
  rationale: కాలపరిమితిని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיָּמָת
  choice: అతడు చనిపోయాడు
  rationale: కథనంలోని తదుపరి సంఘటనను సూటిగా తెలియజేస్తుంది; తెలుగులో వాక్యస్పష్టత కోసం కర్తను వ్యక్తం చేశాం.
- source_word: לְעֵת בּוֹא הַשָּׁמֶשׁ
  choice: సూర్యుడు అస్తమించే సమయానికి
  rationale: ‘సూర్యుడు రావడం/దిగిపోవడం యొక్క సమయానికి’ అనే హీబ్రూ భావాన్ని తెలుగులో సహజమైన, గౌరవప్రదమైన రీతిలో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలిని అనుసరించాం. మూలంలోని క్రమం, కొనసాగుతున్న చర్య, ‘అరాము’ అనే స్థలనామం నిలుపుకున్నాం. కాలపదబంధానికి సంబంధించిన [a] సూచికను దానికి తగిన చివరి వాక్యంలో ఉంచాం.
