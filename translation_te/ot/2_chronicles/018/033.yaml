source:
  edition: WLC
  text: וְ/אִ֗ישׁ מָשַׁ֤ךְ בַּ/קֶּ֨שֶׁת֙ לְ/תֻמּ֔/וֹ וַ/יַּךְ֙ אֶת מֶ֣לֶךְ יִשְׂרָאֵ֔ל בֵּ֥ין הַ/דְּבָקִ֖ים וּ/בֵ֣ין הַ/שִּׁרְיָ֑ן וַ/יֹּ֣אמֶר לָֽ/רַכָּ֗ב הֲפֹ֧ךְ ידי/ך וְ/הוֹצֵאתַ֥/נִי מִן הַֽ/מַּחֲנֶ֖ה כִּ֥י הָחֳלֵֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/033.yaml
  text: But a man drew his bow at random and struck the king of Israel between the scale armor and the breastplate[a]. So he said to the charioteer, “Turn your hand and take me out of the camp[c][b], for I am wounded.”
translation:
  language: te
  text: 'అయితే ఒకడు గురి చూడకుండా[a] విల్లు ఎక్కుపెట్టి, ఇశ్రాయేలు రాజును కవచపు పలకల అతుకులకూ ఛాతికవచానికీ మధ్య[b] కొట్టాడు. అప్పుడు రాజు తన రథసారథితో ఇలా అన్నాడు: “రథాన్ని తిప్పి[c], నన్ను యుద్ధరంగం నుంచి[d] బయటకు తీసుకెళ్లు; నేను గాయపడ్డాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యాదృచ్ఛికంగా.’ హీబ్రూ పదబంధానికి ‘తన అమాయకత్వంతో’ లేదా ‘నిష్కపటంగా’ అనే భావం కూడా ఉండవచ్చు; ఇక్కడ అతడు ఎవరినీ ప్రత్యేకంగా గురి చేయలేదనే భావం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: కవచానికి సంబంధించిన ఈ రెండు హీబ్రూ పదాల ఖచ్చితమైన అర్థం అనిశ్చితం. ‘కవచపు అతుకులకూ శరీరకవచానికీ మధ్య’ అని కూడా అనువదించవచ్చు. బాణం కవచంలోని ఖాళీ గుండా తగిలిందనేది ప్రధాన భావం.
    reason: cultural_note
  - marker: c
    text: అక్షరార్థంగా ‘నీ చెయ్యి తిప్పు.’ అంటే రథాన్ని తిప్పి లేదా పోరాటం నుంచి పక్కకు మళ్లించు అని భావం.
    reason: lexical_alternative
  - marker: d
    text: హీబ్రూ పదం ‘శిబిరం,’ ‘సైన్యం’ లేదా ‘యుద్ధదళం’ అని కూడా అర్థమివ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: అయితే ఒకడు
  rationale: וְ కథనాన్ని కొనసాగిస్తూనే ఇక్కడి అనూహ్య మలుపును సూచిస్తుంది; אִישׁ గుర్తింపులేని ఒక వ్యక్తిని సూచిస్తుంది.
- source_word: מָשַׁךְ בַּקֶּשֶׁת
  choice: విల్లు ఎక్కుపెట్టి
  rationale: ఇది విల్లును లాగి బాణం విడిచే చర్యను తెలిపే హీబ్రూ ప్రయోగం; ఆధునిక తెలుగులో ‘విల్లు ఎక్కుపెట్టి’ సహజంగా ఉంటుంది.
- source_word: לְתֻמּוֹ
  choice: గురి చూడకుండా
  rationale: పదానికి ‘నిష్కపటంగా/అమాయకంగా’ అనే భావం కూడా ఉండవచ్చు; యుద్ధ సందర్భంలో నిర్దిష్ట వ్యక్తిని గురి చేయకుండా బాణం వదిలాడనే భావం ఎక్కువగా సరిపోతుంది.
- source_word: וַיַּךְ
  choice: కొట్టాడు
  rationale: נכה యొక్క ప్రాథమిక ‘కొట్టు/తాకి దెబ్బతీయు’ భావాన్ని ఉంచుతుంది; గాయం కలిగిన ఫలితం వాక్యాంతంలో వేరుగా చెప్పబడింది.
- source_word: בֵּין הַדְּבָקִים וּבֵין הַשִּׁרְיָן
  choice: కవచపు పలకల అతుకులకు, ఛాతికవచానికి మధ్య
  rationale: దెబ్బ తగిలింది కవచ భాగాల మధ్యనున్న బలహీనమైన ఖాళీలో అని సందర్భం సూచిస్తుంది. דְּבָקִים అనేది కలిపిన పలకలు లేదా వాటి అతుకులను, שִׁרְיָן శరీరాన్ని కప్పే కవచాన్ని సూచించవచ్చు.
- source_word: לָרַכָּב
  choice: తన రథసారథితో
  rationale: ఇక్కడ నామవాచకం రథాన్ని నడిపే వ్యక్తిని సూచిస్తుంది; ‘రథసారథి’ స్పష్టమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: הֲפֹךְ יָדֶיךָ
  choice: రథాన్ని తిప్పి
  rationale: అక్షరార్థంగా ‘నీ చెయ్యి తిప్పు’; సందర్భంలో రథాన్ని మళ్లించమనే ఆజ్ఞ. ప్రధాన పాఠంలో సహజమైన భావానువాదం ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְהוֹצֵאתַנִי מִן הַמַּחֲנֶה
  choice: నన్ను యుద్ధరంగం నుంచి బయటకు తీసుకెళ్లు
  rationale: מַחֲנֶה శిబిరం, సైన్యం లేదా యుద్ధదళాన్ని సూచించగలదు. ఇక్కడ పోరు జరుగుతున్న చోటు నుంచి రాజును తొలగించడమే ఉద్దేశం కాబట్టి ‘యుద్ధరంగం’ సహజంగా భావాన్ని అందిస్తుంది.
- source_word: כִּי הָחֳלֵיתִי
  choice: నాకు గాయమైంది
  rationale: ఈ క్రియ బలహీనపడటం లేదా జబ్బుపడటం అని కూడా అర్థమవుతుంది; బాణం తగిలిన తక్షణ సందర్భంలో గాయపడటాన్ని సూచిస్తుంది. మూలంలో లేని తీవ్రతను అదనంగా చేర్చలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ప్రాచీన యుద్ధసామగ్రిని అర్థమయ్యేలా చెప్పడంలో మూలంలోని అనిశ్చితిని పాదసూచికలో నిలిపి ఉంచాం; మతశాఖాపరమైన వ్యాఖ్యానాన్ని చేర్చలేదు.
