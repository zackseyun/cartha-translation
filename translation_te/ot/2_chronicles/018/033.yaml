  to: 'అయితే ఒకడు గురి చూడకుండా[a] విల్లు ఎక్కుపెట్టి, ఇశ్రాయేలు రాజును కవచపు పలకల అతుకులకూ ఛాతికవచానికీ మధ్య[b] కొట్టాడు. అప్పుడు రాజు తన రథసారథితో ఇలా అన్నాడు: “రథాన్ని తిప్పి[c], నన్ను యుద్ధరంగం నుంచి[d] బయటకు తీసుకెళ్లు; నేను గాయపడ్డాను.”'
  rationale: సవరణలు మూలార్థాన్ని మార్చవు. అవి ప్రధానంగా కవచ భాగాల మధ్యనున్న ఖాళీని సూచించే తెలుగువాక్య నిర్మాణాన్ని వ్యాకరణపరంగా స్పష్టం చేస్తాయి; అలాగే ఉద్ధరణను సహజంగా చేసి గాయం విషయాన్ని ప్రత్యక్షంగా వ్యక్తం చేస్తాయి. పాదసూచికలు לְתֻמּוֹ, కవచ పరిభాష, మరియు מַחֲנֶהలోని అనిశ్చితిని నిలిపి ఉంచాయి.
