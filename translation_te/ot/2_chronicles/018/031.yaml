id: 2CH.18.31
reference: 2 Chronicles 18:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֡י כִּ/רְאוֹת֩ שָׂרֵ֨י הָ/רֶ֜כֶב אֶת יְהוֹשָׁפָ֗ט וְ/הֵ֤מָּה אָֽמְרוּ֙ מֶ֣לֶךְ יִשְׂרָאֵ֣ל ה֔וּא וַ/יָּסֹ֥בּוּ עָלָ֖י/ו לְ/הִלָּחֵ֑ם וַ/יִּזְעַ֤ק יְהֽוֹשָׁפָט֙ וַֽ/יהוָ֣ה עֲזָר֔/וֹ וַ/יְסִיתֵ֥/ם אֱלֹהִ֖ים מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/031.yaml
  text: And it happened that when the commanders of the chariots saw Jehoshaphat[a], they said, “It is the king of Israel.” So they turned against him to fight, but Jehoshaphat cried out, and Yahweh helped him[b], and God drew them away from him.
translation:
  language: te
  text: రథదళాధిపతులు యెహోషాపాతును చూసినప్పుడు, “ఇతడే ఇశ్రాయేలు రాజు”[a] అని అన్నారు. అప్పుడు వారు అతనితో యుద్ధం చేయడానికి అతని వైపు తిరిగారు. యెహోషాపాతు కేక వేశాడు; యెహోవా అతనికి సహాయం చేశాడు. దేవుడు వారిని అతని నుండి దూరంగా మళ్లించాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడే ఇశ్రాయేలు రాజు.”
    reason: lexical_alternative
  - marker: b
    text: ‘మళ్లించాడు’ అని అనువదించిన హీబ్రూ క్రియకు, ఒక లక్ష్యం నుండి ఎవరినైనా తిప్పడం లేదా దూరంగా కదిలించడం అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הָרֶכֶב
  choice: రథదళాధిపతులు
  rationale: שָׂרֵי సైనిక నాయకులను, הָרֶכֶב రథదళాన్ని సూచిస్తాయి. ‘రథదళాధిపతులు’ సంక్షిప్తంగా, సహజంగా సైనిక భావాన్ని తెలియజేస్తుంది.
- source_word: מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: ఇతడే ఇశ్రాయేలు రాజు
  rationale: ఈ నామవాచక వాక్యం యెహోషాపాతును తాము వెదుకుతున్న రాజుగా వారు గుర్తించారని తెలుపుతుంది. తెలుగు ప్రత్యక్ష సంభాషణలో ‘ఇతడే’ సహజంగా ఉండి గుర్తింపు భావాన్ని ఇస్తుంది.
- source_word: וַיָּסֹבּוּ עָלָיו
  choice: అతని మీదికి తిరిగారు
  rationale: סבב ఇక్కడ అతన్ని లక్ష్యంగా చేసుకొని రథాలను అతని వైపు మళ్లించడాన్ని సూచిస్తుంది. చుట్టుముట్టారని ఖచ్చితంగా చెప్పకుండా కదలికతో పాటు శత్రుభావాన్ని నిలుపుతుంది.
- source_word: לְהִלָּחֵם
  choice: యుద్ధం చేయడానికి
  rationale: ఈ క్రియారూపం వారి కదలిక ఉద్దేశాన్ని తెలియజేస్తుంది; ‘యుద్ధం చేయడానికి’ మూలంలోని విస్తృత పోరాట భావాన్ని సహజ తెలుగులో కాపాడుతుంది.
- source_word: וַיִּזְעַק
  choice: కేక వేశాడు
  rationale: זעק ఆపదలో చేసే బలమైన కేకను సూచిస్తుంది. ఎవరిని ఉద్దేశించి కేక వేశాడో మూలపాఠం చెప్పనందున దానిని చేర్చలేదు.
- source_word: וַיהוָה עֲזָרוֹ
  choice: యెహోవా అతనికి సహాయం చేశాడు
  rationale: עזר అనే సాధారణ ‘సహాయం చేయు’ భావాన్ని నేరుగా అనువదించి, יְהוָה అనే దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: וַיְסִיתֵם אֱלֹהִים מִמֶּנּוּ
  choice: దేవుడు వారిని అతని దగ్గర నుండి మళ్లించాడు
  rationale: ఈ సందర్భంలో סות హిఫీల్ రూపం ఒక లక్ష్యం నుండి దూరంగా తిప్పడం లేదా మళ్లించడం అనే భావం ఇస్తుంది. ‘మళ్లించాడు’ దైవ క్రియాశీలతను ఉంచుతూ నైతికంగా ప్రేరేపించాడనే అదనపు భావాన్ని నివారిస్తుంది.
- source_word: וַיְהִי כִּרְאוֹת
  choice: చూసినప్పుడు
  rationale: ఇది సాధారణ హీబ్రూ కథన సంధి. తెలుగులో పదేపదే ‘అలా జరిగింది’ అని ఉంచడం కృత్రిమంగా ఉండేందున కాలసంబంధ భావాన్ని సహజమైన ‘చూసినప్పుడు’ ద్వారా అందించాం.
theological_decisions:
- issue: ఒకే వచనంలో יְהוָה మరియు אֱלֹהִים అనే దైవసూచక పదాల అనువాదం
  choice: యెహోవా ... దేవుడు
  alternative: ప్రభువు ... దేవుడు
  rationale: మూలపాఠం రెండు వేర్వేరు పదాలను వాడుతుంది. దైవనామాన్ని ‘యెహోవా’గా, సాధారణ దైవపదాన్ని ‘దేవుడు’గా ఇచ్చి ఆ వ్యత్యాసాన్ని నిలిపాం.
- issue: యెహోషాపాతు కేకను స్పష్టమైన ప్రార్థనగా చూపాలా
  choice: యెహోషాపాతు కేక వేశాడు
  alternative: యెహోషాపాతు యెహోవాకు మొరపెట్టుకున్నాడు
  rationale: తర్వాతి వాక్యం యెహోవా సహాయం చేశాడని చెప్పినా, ఈ క్రియకు మూలపాఠంలో సంబోధితుడు లేదా ప్రత్యక్ష కర్మ లేదు. అందువల్ల ప్రార్థన అనే సాధ్యమైన భావాన్ని వచనంలో అదనంగా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘రథదళాధిపతులు’ సైనిక సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది. హీబ్రూ కథన సూత్రాన్ని పదశః పునరుత్పత్తి చేయకుండా తెలుగు ప్రవాహానికి అనుగుణంగా తీర్చిదిద్దాం; అయితే సంఘటనల క్రమం, దైవనామాల వ్యత్యాసం, కేకకు సంబోధితుడు చెప్పబడకపోవడం అన్నీ నిలుపుకున్నాం.
