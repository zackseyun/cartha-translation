  to: రథదళాధిపతులు యెహోషాపాతును చూసినప్పుడు, “ఇతడే ఇశ్రాయేలు రాజు”[a] అని అన్నారు. అప్పుడు వారు అతనితో యుద్ధం చేయడానికి అతని వైపు తిరిగారు. యెహోషాపాతు కేక వేశాడు; యెహోవా అతనికి సహాయం చేశాడు. దేవుడు వారిని అతని నుండి దూరంగా మళ్లించాడు.[b]
  rationale: 'సురక్షితమైన రెండు సవరణలు మాత్రమే చేశాం: ప్రత్యక్ష ప్రసంగాన్ని మూలంలోని సాధారణ ‘వారు అన్నారు’ భావంతో ఇచ్చాం; దేవుడు రథదళాధిపతులను యెహోషాపాతు నుండి దూరం చేసిన ఫలితాన్ని స్పష్టం చేశాం. యెహోషాపాతు కేక ఎవరిని ఉద్దేశించిందో జోడించలేదు; పూర్తి దైవనామాల వ్యత్యాసం, సైనిక సందర్భం, మరియు పాదసూచిక గుర్తులు భద్రంగా ఉంచబడ్డాయి.'
