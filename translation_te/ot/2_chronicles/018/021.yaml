id: 2CH.18.21
reference: 2 Chronicles 18:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אֵצֵא֙ וְ/הָיִ֨יתִי֙ לְ/ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאָ֑י/ו וַ/יֹּ֗אמֶר תְּפַתֶּה֙ וְ/גַם תּוּכָ֔ל צֵ֖א וַ/עֲשֵׂה כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/021.yaml
  text: And he said[a], ‘I will go out and become a lying spirit in the mouth of all his prophets.’ And he said, ‘You will entice him, and you will also succeed[b]. Go out and do so.’
translation:
  language: te
  text: అప్పుడు ఆ ఆత్మ, “నేను బయలుదేరి వెళ్లి, అతని ప్రవక్తలందరి నోటిలో అబద్ధమాడే ఆత్మగా ఉంటాను[a]” అని చెప్పింది. అప్పుడు యెహోవా, “నీవు అతన్ని ప్రలోభపెడతావు; నీవు విజయం కూడా సాధిస్తావు[b]. బయలుదేరి వెళ్లి అలాగే చేయి” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అసత్యపు ఆత్మగా ఉంటాను.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీవు అతన్ని మోసగిస్తావు; నీవు కూడా సఫలమవుతావు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: నేను బయలుదేరి వెళ్తాను
  rationale: יצא అనే క్రియలోని బయటికి వెళ్లే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְהָיִיתִי לְרוּחַ שֶׁקֶר
  choice: అబద్ధమాడే ఆత్మగా ఉంటాను
  rationale: היה యొక్క ‘ఉంటాను’ అనే రూపాన్ని నేరుగా నిలుపుతూ, רוּחַ שֶׁקֶר‌ను మోసపూరితంగా మాట్లాడే ఆత్మగా సహజంగా వ్యక్తం చేస్తుంది; పాత్రలోకి ప్రవేశించే సందర్భార్థం వాక్యప్రవాహంలో స్పష్టమవుతుంది.
- source_word: בְּפִי כָּל נְבִיאָיו
  choice: అతని ప్రవక్తలందరి నోటిలో
  rationale: ‘నోటిలో’ అనే మూలభాషా చిత్రాన్ని కాపాడుతుంది; ‘అతని’ అనేది సందర్భంలో అహాబును సూచిస్తుంది.
- source_word: תְּפַתֶּה
  choice: నీవు అతన్ని ప్రలోభపెడతావు
  rationale: פִּתָּה లోని ఆకర్షించి తప్పుదారి పట్టించే భావాన్ని నిలుపుతుంది; తెలుగులో అవసరమైన కర్మను సందర్భం ఆధారంగా స్పష్టంగా చేర్చింది.
- source_word: וְגַם תּוּכָל
  choice: నీవు విజయం కూడా సాధిస్తావు
  rationale: יכל ఇక్కడ కేవలం సామర్థ్యాన్ని కాక, ప్రయత్నం ఫలించే భావాన్ని సూచిస్తుంది; וגם లోని ‘కూడా’ను కాపాడుతుంది.
- source_word: צֵא וַעֲשֵׂה כֵן
  choice: బయలుదేరి వెళ్లి అలాగే చేయి
  rationale: ముందటి יצא పదప్రతిధ్వనిని నిలుపుతూ, ఆజ్ఞను సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: మోసంతో కూడిన దర్శనంలో దేవుని అనుమతి లేదా ఆజ్ఞను ఎలా వ్యక్తం చేయాలి
  choice: ఆ ఆత్మ ప్రతిపాదించిన మోసపూరిత కార్యాన్ని యెహోవా ఆమోదించి పంపిస్తున్నట్లు వచనం చెప్పే ఉద్రిక్తతను యథాతథంగా ఉంచడం
  alternative: దేవునికి మోసంతో సంబంధం ఉన్నట్లు కనిపించకుండా మాటలను మృదువుగా మార్చడం
  rationale: హీబ్రూ పాఠం ఆత్మ యొక్క యోచనను, దానికి వచ్చిన అధికారపూర్వక సమ్మతిని నేరుగా చిత్రిస్తుంది. అనువాదం ఈ ధార్మిక ఉద్రిక్తతను పరిష్కరించకుండా కాపాడాలి.
- issue: మాట్లాడేవారి గుర్తింపును తెలుగులో స్పష్టం చేయడం
  choice: మొదటి వక్తను ‘ఆ ఆత్మ’గా, రెండవ వక్తను ‘యెహోవా’గా సందర్భానుసారంగా పేర్కొనడం
  alternative: రెండు చోట్లా కేవలం ‘అతడు’ అని ఉంచడం
  rationale: హీబ్రూలో సర్వనామ సూచనలు ముందరి వచనాల ద్వారా తెలుస్తాయి; ఒంటరి తెలుగు వచనంలో సహజమైన అవగాహన కోసం సందర్భంలో స్పష్టమైన గుర్తింపులను ఉపయోగించడం అర్థాన్ని మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ‘నోటిలో’ అనే హీబ్రూ రూపకాన్ని కాపాడి, సాధారణ పాఠకునికి స్పష్టత కోసం సందర్భంలోని వక్తలను పేర్లతో తెలిపింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
