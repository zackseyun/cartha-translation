- from: యెహోవా మందిరం కోసం సొలొమోను చేసిన పని అంతా పూర్తయింది. అప్పుడు సొలొమోను తన తండ్రి దావీదు ప్రతిష్ఠించిన వస్తువులను[a], వెండిని, బంగారాన్ని, సామగ్రినంతటినీ లోపలికి తెచ్చి, దేవుని మందిరపు ఖజానా గదుల్లో ఉంచాడు.
  to: యెహోవా మందిరం కోసం సొలొమోను చేసిన పని అంతా పూర్తయింది. అప్పుడు సొలొమోను తన తండ్రియైన దావీదు అంకితం చేసిన వస్తువులను[a], వెండిని, బంగారాన్ని, పాత్రలన్నిటినీ లోపలికి తీసుకువచ్చి దేవుని మందిరపు ఖజానా గదుల్లో ఉంచాడు.
  rationale: సవరణలు కేవలం పదస్పష్టత మరియు మూలపాఠానికి సన్నిహితత కోసం చేయబడ్డాయి. దావీదు అంకితం చేసిన వస్తువుల సందర్భార్థాన్ని ప్రధాన పాఠంలో వ్యక్తపరుస్తూ, ‘పవిత్ర వస్తువులు’ అనే అక్షరార్థ అవకాశాన్ని పాదసూచికలో నిలిపాం. యెహోవా మందిరం/దేవుని మందిరం అనే మూలపాఠ వైవిధ్యాన్ని మార్చలేదు.
