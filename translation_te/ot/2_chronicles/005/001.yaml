  terminology: యెహోవా మరియు దేవుడు అనే మూలంలోని వేర్వేరు దైవసంబోధనలు నిలుపబడ్డాయి. ‘అంకితం చేసిన వస్తువులు’ కָדְשֵׁיకి తగిన సందర్భార్థం; పాదసూచికలో మరింత అక్షరార్థమైన ప్రత్యామ్నాయం ఇవ్వబడింది.
