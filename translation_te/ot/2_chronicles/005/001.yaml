    rationale: కָדְשֵׁי ఇక్కడ దావీదు పవిత్ర ప్రయోజనం కోసం ప్రత్యేకపరచిన/అంకితం చేసిన సంపదలను సూచిస్తుంది. ‘ప్రతిష్ఠించడం’ సాధారణంగా విగ్రహం, ఆలయం లేదా పదవికి సంబంధించిన భావాన్ని కలిగించగలదు; ‘అంకితం చేసిన’ ఇక్కడ మరింత నిర్దిష్టం.
