id: 2CH.5.1
reference: 2 Chronicles 5:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּשְׁלַם֙ כָּל הַ/מְּלָאכָ֔ה אֲשֶׁר עָשָׂ֥ה שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה וַ/יָּבֵ֨א שְׁלֹמֹ֜ה אֶת קָדְשֵׁ֣י דָּוִ֣יד אָבִ֗י/ו וְ/אֶת הַ/כֶּ֤סֶף וְ/אֶת הַ/זָּהָב֙ וְ/אֶת כָּל הַ/כֵּלִ֔ים נָתַ֕ן בְּ/אֹצְר֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־־ס־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/001.yaml
  text: Thus all the work that Solomon had done for the house of Yahweh was finished. Then Solomon brought in the holy things of David his father[a], and the silver, the gold, and all the vessels; he put them into the treasuries of the house of God.
translation:
  language: te
  text: యెహోవా మందిరం కోసం సొలొమోను చేసిన పని అంతా పూర్తయింది. అప్పుడు సొలొమోను తన తండ్రియైన దావీదు అంకితం చేసిన వస్తువులను[a], వెండిని, బంగారాన్ని, పాత్రలన్నిటినీ లోపలికి తీసుకువచ్చి దేవుని మందిరపు ఖజానా గదుల్లో ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన తండ్రియైన దావీదుకు చెందిన పవిత్ర వస్తువులను”; లేదా, “తన తండ్రియైన దావీదు పవిత్రపరచిన వస్తువులను.”
    reason: קָדְשֵׁי అనే పదం పవిత్రమైన వస్తువులు లేదా పవిత్ర ప్రయోజనం కోసం అంకితం చేసిన వస్తువులు అనే సన్నిహిత భావాలను అనుమతిస్తుంది.
lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: పూర్తయింది
  rationale: ఈ సందర్భంలో שלם నిర్మాణపని సంపూర్ణంగా ముగిసిన ఫలితస్థితిని సూచిస్తుంది; ‘పూర్తయింది’ సహజమైన ఆధునిక తెలుగు.
- source_word: כָּל הַמְּלָאכָה
  choice: చేసిన పని అంతా
  rationale: מְלָאכָה మందిర నిర్మాణం, దాని అమరికలకు సంబంధించిన మొత్తం పనిని సూచిస్తుంది.
- source_word: לְבֵית יְהוָה
  choice: యెహోవా మందిరం కోసం
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఈ సందర్భంలో దేవాలయాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మందిరం’ అర్థాన్ని స్పష్టంగా, గౌరవప్రదంగా తెలియజేస్తుంది. לְ ఉద్దేశాన్ని ‘కోసం’గా తెలియజేస్తుంది.
- source_word: וַיָּבֵא
  choice: లోపలికి తెచ్చి
  rationale: בוא హిఫిల్ రూపం ఇక్కడ వస్తువులను లోనికి తీసుకురావడాన్ని సూచిస్తుంది.
- source_word: קָדְשֵׁי דָּוִיד אָבִיו
  choice: తన తండ్రి దావీదు ప్రతిష్ఠించిన వస్తువులను
  rationale: קָדְשֵׁי పవిత్ర ప్రయోజనం కోసం ప్రత్యేకపరచిన లేదా అంకితం చేసిన వస్తువులను సూచిస్తుంది; తెలుగులో ‘ప్రతిష్ఠించిన వస్తువులు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: వెండిని, బంగారాన్ని
  rationale: మూలంలోని జాబితా ధోరణిని, ప్రతి అంశంపై ఉన్న నిర్దిష్టతను తెలుగు విభక్తులతో నిలుపుతుంది.
- source_word: כָּל הַכֵּלִים
  choice: సామగ్రినంతటినీ
  rationale: כֵּלִים అనేది పాత్రలు, పనిముట్లు, ఇతర వస్తువులను కలుపుకునే విస్తృత పదం; ‘సామగ్రి’ ఆ విస్తృతిని తెలుగులో నిలుపుతుంది.
- source_word: נָתַן
  choice: ఉంచాడు
  rationale: נתן ఇక్కడ విలువైన వస్తువులను ఖజానా గదుల్లో పెట్టడం లేదా నిల్వచేయడం అనే సందర్భార్థం కలిగి ఉంది.
- source_word: בְּאֹצְרוֹת
  choice: ఖజానా గదుల్లో
  rationale: אֹצָר ధనం లేదా విలువైన సామగ్రిని భద్రపరిచే నిల్వస్థలాన్ని సూచిస్తుంది; బహువచనాన్ని ‘గదుల్లో’ నిలుపుతుంది.
- source_word: בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరపు
  rationale: మూలంలోని אֱלֹהִיםను ‘దేవుడు’గా అనువదించి, ఇది అదే దేవాలయ సముదాయాన్ని సూచిస్తుందని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: యెహోవా అనే దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఒడంబడిక నామం ప్రత్యక్షంగా ఉంది; సాధారణ బిరుదుతో మార్చకుండా వ్యక్తినామాన్ని నిలిపాం.
- issue: בֵּית יְהוָה మరియు בֵּית הָאֱלֹהִים మధ్య దైవసంబోధన వైవిధ్యం
  choice: ‘యెహోవా మందిరం’ మరియు ‘దేవుని మందిరం’గా వైవిధ్యాన్ని నిలుపడం
  alternative: రెండింటినీ ఒకే విధంగా ‘దేవుని మందిరం’గా చేయడం
  rationale: మూలపాఠం ఒకచోట దైవనామాన్ని, మరొకచోట సాధారణ దైవపదాన్ని వాడుతుంది; ఈ వ్యత్యాసాన్ని సమతలీకరించలేదు.
- issue: קָדְשֵׁי యొక్క సంబంధం—స్వభావతః పవిత్రమైన వస్తువులా, అంకితం చేసిన వస్తువులా
  choice: దావీదు ప్రతిష్ఠించిన వస్తువులు
  alternative: దావీదుకు చెందిన పవిత్ర వస్తువులు
  rationale: సందర్భంలో దేవాలయ వినియోగం కోసం దావీదు ప్రత్యేకపరచిన సంపదలు ఉద్దేశించబడ్డాయి; అయినా పదంలోని ‘పవిత్ర వస్తువులు’ అనే మరింత అక్షరార్థ అవకాశాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే చారిత్రక-ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన శైలి. ‘మందిరం’, ‘ఖజానా గదులు’, ‘ప్రతిష్ఠించిన’ వంటి పదాలు సహజతను మరియు మూలార్థాన్ని సమతుల్యం చేస్తాయి.
