id: 2CH.5.5
reference: 2 Chronicles 5:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעֲל֤וּ אֶת הָ/אָרוֹן֙ וְ/אֶת אֹ֣הֶל מוֹעֵ֔ד וְ/אֶת כָּל כְּלֵ֥י הַ/קֹּ֖דֶשׁ אֲשֶׁ֣ר בָּ/אֹ֑הֶל הֶעֱל֣וּ אֹתָ֔/ם הַ/כֹּהֲנִ֖ים הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/005.yaml
  text: And they brought up the ark[a], the tent of meeting, and all the holy vessels that were in the tent; the Levitical priests brought them up.
translation:
  language: te
  text: వారు మందసాన్ని, సమావేశ గుడారాన్ని, గుడారంలో ఉన్న పవిత్ర వస్తువులన్నిటినీ పైకి తీసుకువచ్చారు; లేవీయులైన యాజకులు[a] వాటిని పైకి తీసుకువచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “యాజకులు, లేవీయులు.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ / הֶעֱלוּ
  choice: పైకి తీసుకువచ్చారు
  rationale: హిఫిల్ రూపంలోని ‘పైకి ఎక్కించడం/తీసుకురావడం’ అనే దిశాభావాన్ని సహజమైన తెలుగులో చూపుతుంది; హెబ్రీలోని పునరుక్తిని రెండు చోట్లా ఒకే విధంగా నిలుపుతుంది.
- source_word: הָאָרוֹן
  choice: మందసం
  rationale: మూలంలో ‘నిబంధన మందసం’ అనే పూర్తి పదబంధం కాకుండా ‘మందసం’ మాత్రమే ఉంది; సందర్భంలో అది స్పష్టంగా ఉంది.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం
  rationale: దేవుడు తన ప్రజలను కలుసుకునే నియమిత గుడారం అనే పదబంధ భావాన్ని, తెలుగు బైబిలు వాడుకలో పరిచయమైన గౌరవప్రదమైన రూపంలో తెలియజేస్తుంది.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: పవిత్ర వస్తువులన్నిటినీ
  rationale: כְּלִים అనేది పాత్రలు, పరికరాలు, ఉపకరణాలు మొదలైన వాటిని కలుపుకొనే విస్తృత పదం; ‘వస్తువులు’ అనవసరమైన ప్రత్యేకీకరణను నివారిస్తుంది.
- source_word: אֲשֶׁר בָּאֹהֶל
  choice: గుడారంలో ఉన్న
  rationale: సంబంధవాక్యం పవిత్ర వస్తువులు ఎక్కడ ఉన్నాయో నేరుగా తెలియజేస్తుంది; ముందున్న ‘ప్రత్యక్ష గుడారం’తో పదసంబంధాన్ని నిలుపుతుంది.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: యాజకులైన లేవీయులు
  rationale: హెబ్రీలోని సమానాధికార పదబంధాన్ని సహజమైన తెలుగులో ప్రతిబింబిస్తూ, వీరు లేవీయులైన యాజకులని తెలియజేస్తుంది; అన్ని లేవీయులూ యాజకులని చెప్పదు.
theological_decisions:
- issue: הַכֹּהֲנִים הַלְוִיִּם పదబంధపు సంబంధం
  choice: యాజకులైన లేవీయులు
  alternative: యాజకులు, లేవీయులు
  rationale: హెబ్రీ పదబంధం వ్యాకరణపరంగా సమానాధికారంగా చదవవచ్చు. ప్రధాన పాఠం యాజకులను లేవీయులుగా గుర్తిస్తుంది; పాదసూచిక మరింత అక్షరార్థమైన, రెండు వర్గాలుగా కూడా అర్థమయ్యే రూపాన్ని సంరక్షిస్తుంది. దీనివల్ల యాజకులు-లేవీయుల మధ్య తేడాను నిశ్శబ్దంగా చెరపకుండా మూలంలోని ఉద్వేగం నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే పవిత్ర గ్రంథ పఠనానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని క్రియ పునరుక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది.
