- from: వారు మందసాన్ని, ప్రత్యక్ష గుడారాన్ని, గుడారంలో ఉన్న పవిత్ర వస్తువులన్నిటినీ పైకి తీసుకువచ్చారు; యాజకులైన లేవీయులు[a] వాటిని పైకి తీసుకువచ్చారు.
  to: వారు మందసాన్ని, సమావేశ గుడారాన్ని, గుడారంలో ఉన్న పవిత్ర వస్తువులన్నిటినీ పైకి తీసుకువచ్చారు; లేవీయులైన యాజకులు[a] వాటిని పైకి తీసుకువచ్చారు.
