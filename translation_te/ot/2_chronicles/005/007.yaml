language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבִ֣יאוּ הַ֠/כֹּהֲנִים אֶת אֲר֨וֹן בְּרִית יְהוָ֧ה אֶל מְקוֹמ֛/וֹ אֶל דְּבִ֥יר הַ/בַּ֖יִת אֶל קֹ֣דֶשׁ הַ/קְּדָשִׁ֑ים אֶל תַּ֖חַת כַּנְפֵ֥י הַ/כְּרוּבִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/007.yaml
  text: Then the priests brought the ark of the covenant of Yahweh to its place[a], into the inner sanctuary of the house, into the Most Holy Place, under the wings of the cherubim.
translation:
  language: te
  text: అప్పుడు యాజకులు యాహ్వే నిబంధన మందసాన్ని దాని స్థానానికి, మందిరపు అంతరాలయంలోని అతి పరిశుద్ధ స్థలానికి[a], కెరూబుల రెక్కల కిందకు తీసుకువచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిశుద్ధ పరిశుద్ధ స్థలం.”
    reason: కֹדֶשׁ הַקְּדָשִׁיםకు సంప్రదాయంగా వాడే ‘Holy of Holies’ అనే ప్రత్యామ్నాయ రూపాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: తీసుకొచ్చారు
  rationale: בוא ధాతువు హిఫీల్ రూపానికి ‘తీసుకురావడం’ అనే సహజమైన అర్థం ఉంది; మూలంలో లేని అదనపు మోసే విధానాన్ని ఇది చేర్చదు.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: నిర్దిష్ట బహువచన నామవాచకాన్ని సహజమైన ప్రామాణిక తెలుగు పదంతో అనువదించింది.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: యాహ్వే నిబంధన మందసం
  rationale: హీబ్రూ సంబంధ పదబంధాన్ని సహజమైన తెలుగులో ఉంచుతూ, మందసం నిబంధనకు సంబంధించినదని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מְקוֹמוֹ
  choice: దాని స్థానం
  rationale: ఏకవచన ప్రత్యయం మందసాన్ని సూచిస్తుంది; నియమిత స్థలమనే భావాన్ని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా నిలుపుతుంది.
- source_word: דְּבִיר הַבַּיִת
  choice: మందిరపు అంతరాలయం
  rationale: דְּבִיר మందిరంలోని అత్యంత లోపలి గదిని సూచిస్తుంది. సందర్భంలో בַּיִת దేవాలయ భవనాన్ని సూచిస్తున్నందున ‘మందిరం’ సహజంగా ఉంది.
- source_word: קֹדֶשׁ הַקְּדָשִׁים
  choice: మహా పరిశుద్ధ స్థలం
  rationale: హీబ్రూ తీవ్రతను తెలిపే సంబంధ నిర్మాణాన్ని ఆధునిక పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా అందిస్తుంది; మరింత పదశః రూపాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: תַּחַת כַּנְפֵי הַכְּרוּבִים
  choice: కెరూబుల రెక్కల కిందికి
  rationale: గమ్యాన్ని సూచించే אֶל‌తో కూడిన תַּחַת భావాన్ని ‘కిందికి’ అని చూపి, כְּרוּבִיםను సంప్రదాయ లిప్యంతరీకరణతో అందించింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణను ఉపయోగించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. వరుసగా వచ్చిన హీబ్రూ אֶל పదబంధాల అనుబంధ సంబంధాన్ని డాష్‌లతో స్పష్టంచేసి, అంతరాలయం మరియు మహా పరిశుద్ధ స్థలం ‘దాని స్థానం’ను వివరించే విధంగా ఉంచాం. పాదటిప్పణి గుర్తును అది వివరించే ‘మహా పరిశుద్ధ స్థలం’ వెంట ఉంచాం.
