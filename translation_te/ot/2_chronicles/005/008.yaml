source:
  edition: WLC
  text: וַ/יִּהְי֤וּ הַ/כְּרוּבִים֙ פֹּרְשִׂ֣ים כְּנָפַ֔יִם עַל מְק֖וֹם הָ/אָר֑וֹן וַ/יְכַסּ֧וּ הַ/כְּרוּבִ֛ים עַל הָ/אָר֥וֹן וְ/עַל בַּדָּ֖י/ו מִ/לְ/מָֽעְלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/008.yaml
  text: And the cherubim were spreading out their wings over the place of the ark[a], and the cherubim covered the ark and its poles from above.
translation:
  language: te
  text: కెరూబులు మందసం ఉంచిన స్థలంపై తమ రెక్కలను చాపి ఉన్నాయి[a]. అవి పైనుంచి మందసాన్ని, దాని మోతకర్రలను కప్పాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మందసపు స్థలంపై తమ రెక్కలను చాపి ఉన్నాయి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ ... פֹּרְשִׂים
  choice: చాపి ఉన్నాయి
  rationale: היהతో కూడిన కృదంత ప్రయోగం కొనసాగుతున్న స్థితిని సూచిస్తుంది; అందువల్ల సాధారణ అస్తిత్వార్థం కాకుండా రెక్కలు చాపి ఉన్న భంగిమను వ్యక్తం చేశాం.
- source_word: הַכְּרוּבִים
  choice: కెరూబులు
  rationale: ఆలయ సందర్భంలోని ఈ సింహాసన-రక్షక జీవులకు వాడుకలో ఉన్న లిప్యంతరీకృత బైబిలు పదాన్ని నిలిపాం.
- source_word: עַל מְקוֹם הָאָרוֹן
  choice: మందసం ఉంచిన స్థలంపై
  rationale: మָקוֹם అనే ‘స్థలం’ భావాన్ని నిలుపుతూ, తరువాతి ఉపవాక్యంలో మందసాన్నే ప్రత్యేకంగా ప్రస్తావించిన తేడాను కాపాడాం.
- source_word: וַיְכַסּוּ
  choice: కప్పాయి
  rationale: כסה యొక్క సాధారణ, ప్రత్యక్ష అర్థమైన ‘కప్పు’ను తీసుకున్నాం; ‘నీడ కమ్మాయి’ వంటి వ్యాఖ్యానాత్మక పదాన్ని నివారించాం.
- source_word: בַּדָּיו
  choice: దాని మోతకర్రలను
  rationale: ఇవి మందసాన్ని మోయడానికి ఉపయోగించే కర్రలు; ఆధునిక తెలుగులో వాటి పనిని స్పష్టంగా తెలిపే ‘మోతకర్రలు’ సహజంగా ఉంటుంది.
- source_word: מִלְמָעְלָה
  choice: పైనుంచి
  rationale: కప్పడం జరిగిన దిశను/స్థానాన్ని సూచించే హీబ్రూ క్రియావిశేషణాన్ని సంక్షిప్తంగా, సహజంగా అనువదించాం.
