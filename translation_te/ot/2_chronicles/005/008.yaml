translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలిని వాడాం. ‘మందసం’ మరియు ‘కెరూబులు’ అనే స్థిర బైబిలు పదజాలాన్ని నిలిపి, వాక్య నిర్మాణాన్ని సహజ తెలుగు క్రమంలో అమర్చాం.
