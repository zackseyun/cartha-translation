revisions:
- from: అప్పుడు సొలొమోను ఇశ్రాయేలు పెద్దలను, గోత్రాల అధిపతులందరిని, ఇశ్రాయేలు కుమారుల పితృగృహాల నాయకులను యెరూషలేముకు సమావేశపరిచాడు. దావీదు పట్టణం నుండి—అంటే సీయోను నుండి—యెహోవా నిబంధన మందసాన్ని పైకి తీసుకురావడానికి వారిని సమావేశపరిచాడు.
  to: అప్పుడు సొలొమోను ఇశ్రాయేలు పెద్దలను, గోత్రాల అధిపతులందరినీ, ఇశ్రాయేలు కుమారుల[a] పితృగృహాల నాయకులను యెరూషలేములో సమకూర్చాడు; దావీదు పట్టణమైన సీయోను[b] నుండి యాహ్వే నిబంధన మందసాన్ని పైకి తీసుకురావడానికే ఇలా చేశాడు.
  rationale: దావీదు పట్టణం = సీయోను అనే హీబ్రూ సమాన-గుర్తింపును ‘దావీదు పట్టణమైన సీయోను’గా సరిచేశాం; పునరుక్త సమావేశ క్రియను తొలగించి, ఉద్దేశ్యాన్ని ఒకే వాక్యంలో అనుసంధానించాం. యాహ్వే రూపం మరియు audit-trail ప్రత్యామ్నాయాలకు అనుగుణమైన అంకర్లను కూడా చేర్చాం.
