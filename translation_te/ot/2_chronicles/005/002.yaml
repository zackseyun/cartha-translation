id: 2CH.5.2
reference: 2 Chronicles 5:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָז֩ יַקְהֵ֨יל שְׁלֹמֹ֜ה אֶת זִקְנֵ֣י יִשְׂרָאֵ֗ל וְ/אֶת כָּל רָאשֵׁ֨י הַ/מַּטּ֜וֹת נְשִׂיאֵ֧י הָ/אָב֛וֹת לִ/בְנֵ֥י יִשְׂרָאֵ֖ל אֶל יְרוּשָׁלִָ֑ם לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מֵ/עִ֥יר דָּוִ֖יד הִ֥יא צִיּֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/002.yaml
  text: Then Solomon assembled the elders of Israel and all the heads of the tribes[a], the leaders of the fathers’ houses of the sons of Israel, at Jerusalem, to bring up the ark of the covenant of Yahweh from the city of David[b], that is Zion.
translation:
  language: te
  text: అప్పుడు సొలొమోను ఇశ్రాయేలు పెద్దలను, గోత్రాల అధిపతులందరినీ, ఇశ్రాయేలు కుమారుల[a] పితృగృహాల నాయకులను యెరూషలేములో సమకూర్చాడు; దావీదు పట్టణమైన సీయోను[b] నుండి యాహ్వే నిబంధన మందసాన్ని పైకి తీసుకురావడానికే ఇలా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలీయుల.’ హీబ్రూలో ‘ఇశ్రాయేలు కుమారులు’ అని ఉంది; ఇది వారి వంశపరమైన, నిబంధన-సంబంధ గుర్తింపును నిలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అది సీయోను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: తదుపరి సంఘటనను సూచించే సహజమైన తెలుగు కాలసూచక పదం.
- source_word: יַקְהֵיל
  choice: సమావేశపరిచాడు
  rationale: హిఫీల్ రూపంలోని ‘సమకూర్చడం/సభగా కూడబెట్టడం’ అనే కారణార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పెద్దలను
  rationale: గుర్తింపు పొందిన నాయకవర్గాన్ని తెలిపే సహజమైన, సంప్రదాయబద్ధమైన తెలుగు ప్రయోగం.
- source_word: כָּל רָאשֵׁי הַמַּטּוֹת
  choice: గోత్రాల అధిపతులందరిని
  rationale: מַטּוֹת ఇక్కడ ఇశ్రాయేలు గోత్ర విభాగాలను సూచిస్తుంది; רָאשֵׁי నాయకత్వ భావాన్ని కలిగి ఉంది.
- source_word: נְשִׂיאֵי הָאָבוֹת לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల పితృగృహాల నాయకులను
  rationale: మూలంలోని వంశసంబంధమైన, పితృకుటుంబ నిర్మాణాన్ని సమతలీకరించకుండా నిలుపుతుంది.
- source_word: אֶל יְרוּשָׁלִָם
  choice: యెరూషలేముకు
  rationale: సమావేశం జరిగే గమ్యస్థానాన్ని సూచించే אֶל యొక్క దిశార్థాన్ని కాపాడుతుంది.
- source_word: לְהַעֲלוֹת
  choice: పైకి తీసుకురావడానికి
  rationale: మందసాన్ని సీయోను నుండి పైభాగానికి తరలించడంలోని దిశార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: యెహోవా నిబంధన మందసాన్ని
  rationale: హెబ్రీయుల నిర్మాణాన్ని తెలుగులో సహజమైన స్వామ్యసంబంధ పదక్రమంతో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో లిప్యంతరీకరించింది.
- source_word: מֵעִיר דָּוִיד הִיא צִיּוֹן
  choice: దావీదు పట్టణం నుండి—అంటే సీయోను నుండి—
  rationale: సీయోను అనేది దావీదు పట్టణానికి ఇక్కడ ఇచ్చిన వివరణాత్మక గుర్తింపు అని స్పష్టపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుగా మార్చలేదు. తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకుంది; ఉచ్చారణ పునర్నిర్మాణంగా ‘యాహ్వే’ కూడా సాధ్యమే.
- issue: בְנֵי יִשְׂרָאֵל మరియు הָאָבוֹת లోని వంశ-పితృ నిర్మాణం
  choice: ఇశ్రాయేలు కుమారుల పితృగృహాలు
  alternative: ఇశ్రాయేలీయుల పూర్వీకుల కుటుంబాలు
  rationale: ఈ సందర్భం అధికారిక గోత్ర, పితృగృహ నాయకత్వాన్ని పేర్కొంటుంది కాబట్టి మూలంలోని వంశసంబంధ నిర్మాణాన్ని ప్రధాన పాఠంలో నిలిపింది.
- issue: הִיא צִיּוֹן యొక్క సంబంధం
  choice: దావీదు పట్టణం అంటే సీయోను
  alternative: దావీదు పట్టణం, అది సీయోను
  rationale: హెబ్రీయులోని గుర్తింపును వివరణాత్మక సమానత్వంగా సహజ తెలుగులో వ్యక్తం చేసింది; వేరే ప్రదేశంగా అర్థం వచ్చేలా చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలిని అనుసరించాం. దీర్ఘమైన హెబ్రీయు వాక్యాన్ని పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించాం; రెండవ వాక్యంలో ‘వారిని సమావేశపరిచాడు’ అని పునరుక్తి చేసి ఉద్దేశ్య సంబంధాన్ని స్పష్టంగా ఉంచాం. ‘మందసం’, ‘పితృగృహాలు’ వంటి బైబిలు సందర్భానికి తగిన పదాలను నిలిపాం.
