  rationale: The revision removes the unsupported specification that the acclamation was sung, makes the praise-and-thanksgiving purpose clauses parallel, and narrows footnote a to alternatives supported by the Hebrew phrase and its immediate musical setting. It otherwise preserves the draft’s accurate terminology, register, appositional structure, and footnote anchors.
