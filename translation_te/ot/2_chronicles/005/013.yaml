base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/013.yaml
  text: And it came about[a], as the trumpeters and the singers were as one, to make one sound in praising and giving thanks to Yahweh, and when they lifted up their voice with trumpets and cymbals and instruments for song, and in praising Yahweh, “For he is good, for his steadfast love endures forever,” the house, the house of Yahweh[c][b], was filled with a cloud.
translation:
  language: te
  text: బూరలు ఊదేవారూ గాయకులూ ఏకమై[a], యెహోవాను స్తుతించడానికి, ఆయనకు కృతజ్ఞతలు చెల్లించడానికి ఒకే ధ్వని వినిపించినప్పుడు, వారు బూరలు, తాళాలు, సంగీత వాయిద్యాలతో స్వరం ఎత్తి, యెహోవాను స్తుతిస్తూ, “ఆయన మంచివాడు; ఆయన నమ్మకమైన ప్రేమ[b] శాశ్వతంగా ఉంటుంది” అని పలికినప్పుడు, ఆ మందిరం[c]—యెహోవా మందిరం—మేఘంతో నిండిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక్కటిగా” లేదా “ఏకస్వరంతో.”
    reason: lexical_alternative
  - marker: b
    text: “నమ్మకమైన ప్రేమ” అని అనువదించిన హీబ్రూ పదం హెసెద్; ఇది నిలకడైన ప్రేమ, విశ్వసనీయత, కనికరం వంటి భావాలను కలిగి ఉంటుంది.
    reason: lexical_alternative
  - marker: c
    text: మూలంలో అక్షరార్థంగా, “ఇల్లు”; తరువాత “యెహోవా ఇల్లు” అని మళ్లీ చెప్పబడింది.
    reason: translation_clarity
lexical_decisions:
- source_word: כְאֶחָד ... קוֹל אֶחָד
  choice: ఏకమై ... ఒకే స్వరం
  rationale: మొదటి పదబంధంలోని ఐక్యతను, తరువాతి పదబంధంలోని ఏకీకృత ధ్వనిని సహజమైన తెలుగులో వేర్వేరుగా నిలుపుతుంది.
- source_word: למחצצרים
  choice: బూరలు ఊదేవారు
  rationale: వాయిద్యకారులను సూచించే మూలపదాన్ని సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְלַמְשֹׁרֲרִים
  choice: గాయకులు
  rationale: ఈ పదం విస్తృతార్థంలో సంగీతకారులను కాక, పాడేవారిని ప్రత్యేకంగా సూచిస్తుంది.
- source_word: לְהַשְׁמִיעַ קוֹל אֶחָד
  choice: ఒకే స్వరం వినిపించడానికి
  rationale: వారు కలసి ఒక ఏకీకృత ధ్వనిని ఉత్పత్తి చేశారనే శ్రావ్య భావాన్ని నిలుపుతుంది.
- source_word: לְהַלֵּל וּלְהֹדוֹת
  choice: స్తుతిస్తూ ... కృతజ్ఞతలు చెల్లించడానికి
  rationale: స్తుతి, కృతజ్ఞత అనే రెండు వేర్వేరు క్రియలను నిలుపుతూ తెలుగు వాక్యప్రవాహానికి అనుగుణంగా అమర్చింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలోని దేవుని వ్యక్తిగత నామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో ఉంచింది.
- source_word: בַּחֲצֹצְרוֹת וּבִמְצִלְתַּיִם וּבִכְלֵי הַשִּׁיר
  choice: బూరలు, తాళాలు, సంగీత వాయిద్యాలతో
  rationale: వాయిద్యాల మూడు వర్గాలను సహజంగా, స్పష్టంగా వ్యక్తపరుస్తుంది; כלי השיר ను సాధారణ సమష్టి పదంగా అనువదించింది.
- source_word: כִּי טוֹב
  choice: ఆయన మంచివాడు
  rationale: హీబ్రూ కీర్తనా సూత్రంలోని సంక్షిప్త వాక్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חַסְדּוֹ
  choice: ఆయన నమ్మకమైన ప్రేమ
  rationale: חסד లోని నిలకడ, విశ్వసనీయత, అనుబంధ నిబద్ధతలను కేవలం భావోద్వేగ ప్రేమగా కుదించకుండా అందిస్తుంది.
- source_word: וְהַבַּיִת מָלֵא עָנָן בֵּית יְהוָה
  choice: ఆ మందిరం—యెహోవా మందిరం—మేఘంతో నిండిపోయింది
  rationale: మూలంలోని ‘ఇల్లు’ అనే పదపు పునరుక్తి, వివరణాత్మక అన్వయాన్ని నిలుపుతూ సందర్భానుసారంగా ‘మందిరం’ అని అనువదించింది.
theological_decisions:
- issue: దైవనామమైన יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా ఉంచుతుంది; ‘యెహోవా’ తెలుగు పాఠకులకు పరిచితమైన లిప్యంతరీకరణ.
- issue: חסד యొక్క భావవ్యాప్తి
  choice: నమ్మకమైన ప్రేమ
  alternative: కనికరం; కృప; స్థిరమైన ప్రేమ
  rationale: ఈ ఆరాధనా సూత్రంలో కనిపించే శాశ్వతమైన, నిబద్ధమైన ప్రేమ భావాన్ని నిలుపుతుంది; ఏకైక సాంకేతిక ఒడంబడిక పదంగా అతిగా నిర్దిష్టం చేయదు.
- issue: ఉల్లేఖనాన్ని పరిచయం చేసే క్రియ
  choice: ‘అని పాడినప్పుడు’
  alternative: ‘అని పలికినప్పుడు’; ఎటువంటి పరిచయ క్రియ లేకుండా ప్రత్యక్ష ఉల్లేఖనం
  rationale: హీబ్రూలో ‘చెప్పారు’ అనే ప్రత్యేక క్రియ లేకపోయినా, గాయకులు మరియు స్తుతి అనే సందర్భం వల్ల ఇది పాటగా వినిపించిందని తెలుగు వాక్యనిర్మాణంలో సహజంగా వ్యక్తం చేయబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామూహిక ఆరాధనకు తగిన గంభీరతతోనూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలంతోనూ రూపొందించబడింది. పొడవైన హీబ్రూ వాక్య నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగు పఠనసౌలభ్యం కోసం ఉపవాక్యాలను స్పష్టంగా అమర్చింది.
