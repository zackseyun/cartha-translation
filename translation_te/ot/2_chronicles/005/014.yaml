  source_fidelity: 'హీబ్రూ వాక్యంలోని ప్రధాన సంబంధాలన్నీ సరిగ్గా ప్రతిఫలించాయి: యాజకులు మేఘం కారణంగా నిలబడి సేవ చేయలేకపోవడం, దానికి కారణంగా యాహ్వే మహిమ దేవుని మందిరాన్ని నింపడం. ‘నిలబడి సేవ చేయలేకపోయారు’ అనేది לַעֲמֹד לְשָׁרֵת యొక్క దృశ్యాత్మకతను మరియు యాజక సేవ సందర్భాన్ని కాపాడుతుంది.'
