source:
  edition: WLC
  text: וְ/לֹא יָֽכְל֧וּ הַ/כֹּהֲנִ֛ים לַ/עֲמ֥וֹד לְ/שָׁרֵ֖ת מִ/פְּנֵ֣י הֶ/עָנָ֑ן כִּֽי מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֥ית הָ/אֱלֹהִֽים־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/014.yaml
  text: and the priests could not stand to minister because of the cloud[a], for the glory of Yahweh filled the house of God.
translation:
  language: te
  text: మేఘం కారణంగా యాజకులు నిలబడి సేవ చేయలేకపోయారు. ఎందుకంటే యాహ్వే మహిమ దేవుని మందిరాన్ని[a] నింపింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘దేవుని ఇల్లు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: చేయలేకపోయారు
  rationale: ఈ క్రియ సామర్థ్యాన్ని సూచిస్తుంది; ప్రతికూల రూపంతో కలిపి ‘చేయలేకపోయారు’ అని సహజమైన ఆధునిక తెలుగులో అనువదించబడింది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: ఆలయ సేవ చేసే నిర్దిష్ట యాజకులను సూచించే సూటి అనువాదం.
- source_word: לַעֲמוֹד
  choice: నిలబడి
  rationale: עמד యొక్క స్పష్టమైన ‘నిలబడుట’ అనే దృశ్యాన్ని నిలుపుతుంది; ‘తమ స్థానాల్లో ఉండటం’ వంటి వివరణను పాఠ్యంలో చేర్చదు.
- source_word: לְשָׁרֵת
  choice: సేవ చేయ
  rationale: యాజక సంబంధమైన ఆరాధనా సేవను సూచిస్తుంది; తెలుగులో ‘సేవ చేయడం’ సహజంగా ఉండి మూలంలోని విస్తృత అర్థాన్ని కూడా కాపాడుతుంది.
- source_word: מִפְּנֵי הֶעָנָן
  choice: మేఘం కారణంగా
  rationale: ఇక్కడ מִפְּנֵי కారణాన్ని తెలియజేస్తుంది; ఈ రూపం ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలో చెప్పిన అసమర్థతకు కారణాన్ని పరిచయం చేసే వివరణాత్మక సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: מָלֵא
  choice: నింపింది
  rationale: కథన సందర్భంలోని పూర్తయిన చర్యను తెలుగులో సహజమైన భూతకాల రూపంతో తెలియజేస్తుంది.
- source_word: כְבוֹד יְהוָה
  choice: యాహ్వే మహిమ
  rationale: నిర్మాణ సంబంధాన్ని సహజ తెలుగులో చూపుతూ, כָּבוֹדను ‘మహిమ’గా మరియు దైవ నామాన్ని శీర్షికతో భర్తీ చేయకుండా ‘యాహ్వే’గా అందిస్తుంది.
- source_word: בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరం
  rationale: సందర్భంలో ఇది దేవాలయాన్ని సూచిస్తుంది; ‘మందిరం’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది. మూలంలోని అక్షరార్థమైన ‘ఇల్లు’ను పాదసూచికలో భద్రపరచాం.
theological_decisions:
- issue: יְהוָה అనే దైవ నామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: హీబ్రూ పాఠ్యంలో వ్యక్తిగత దైవ నామమైన చతురక్షరి నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, ‘Jehovah’ రూపాన్ని అనుసరించకుండా, ‘Yahweh’ ఉచ్చారణకు అనుగుణంగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- issue: בֵּית הָאֱלֹהִים యొక్క రూపకం
  choice: దేవుని మందిరం
  alternative: దేవుని ఇల్లు
  rationale: ‘ఇల్లు’ మూలానికి అక్షరార్థమైనది; సందర్భంలో ఆలయ భవనమే ఉద్దేశించబడినందున ప్రధాన పాఠ్యంలో సహజమైన ‘మందిరం’ వాడి, అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. హీబ్రూ వాక్యంలోని కారణ–వివరణ సంబంధాన్ని రెండు వాక్యాలుగా సహజంగా వ్యక్తం చేశాం; ‘నిలబడి సేవ చేయడం’ అనే మూల దృశ్యాన్ని నిలిపాం.
