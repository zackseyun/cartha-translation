  text: וַ/יְהִ֕י בְּ/צֵ֥את הַ/כֹּהֲנִ֖ים מִן הַ/קֹּ֑דֶשׁ כִּ֠י כָּל הַ/כֹּהֲנִ֤ים הַֽ/נִּמְצְאִים֙ הִתְקַדָּ֔שׁוּ אֵ֖ין לִ/שְׁמ֥וֹר לְ/מַחְלְקֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/011.yaml
  text: And when the priests came out of the Holy Place—for all the priests who were present had consecrated themselves[a], without regard to divisions—
translation:
  language: te
  text: యాజకులు పరిశుద్ధ స్థలం నుండి బయటికి వచ్చినప్పుడు—అక్కడ ఉన్న యాజకులందరూ తమను తాము పరిశుద్ధపరచుకున్నారు[a]; వారు తమ విభాగాల క్రమాన్ని పాటించలేదు—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలపాఠాన్ని మరింత పదబద్ధంగా, “విభాగాల ప్రకారం పాటించడం అనేది లేకపోయింది” అని అనువదించవచ్చు; అంటే ఈ సందర్భంలో యాజకులు తమ సాధారణ సేవా విభాగాల క్రమాన్ని అనుసరించలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּצֵאת
  choice: బయటికి వచ్చినప్పుడు
  rationale: היהతో కూడిన వావ్ కథనంలోని తదుపరి సంఘటనను పరిచయం చేస్తుంది; ב + יצא ధాతువు యొక్క క్రియానామ రూపం కాలసూచక ఉపవాక్యాన్ని ఏర్పరుస్తుంది. సహజమైన తెలుగులో ‘బయటికి వచ్చినప్పుడు’ ఈ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: ఆలయ సేవకులైన כהניםకు ఆధునిక ప్రామాణిక తెలుగులో స్థిరమైన పదం.
- source_word: מִן הַקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలం నుంచి
  rationale: ఆలయ సందర్భంలో הַקֹּדֶשׁ నైరూప్యమైన పరిశుద్ధతను కాక, ప్రత్యేకంగా పరిశుద్ధమైన ఆలయ ప్రదేశాన్ని సూచిస్తుంది.
- source_word: כָּל הַכֹּהֲנִים הַנִּמְצְאִים
  choice: అక్కడ ఉన్న యాజకులందరూ
  rationale: מצא యొక్క కృదంత రూపం ఇక్కడ ‘అక్కడ హాజరై ఉన్నవారు’ అనే అర్థం ఇస్తుంది; ‘అక్కడ ఉన్న’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: הִתְקַדָּשׁוּ
  choice: తమను తాము ప్రతిష్ఠించుకున్నారు
  rationale: קדש యొక్క హిత్పయేల్ రూపం ఆలయ సేవకు అవసరమైన ఆచారపరమైన స్వీయ సిద్ధతను సూచిస్తుంది. ‘ప్రతిష్ఠించుకున్నారు’ ఆరాధనా సందర్భాన్ని నిలుపుతుంది; కేవలం నైతిక పరిశుద్ధతగా అర్థం చేసుకోకుండా చేస్తుంది.
- source_word: אֵין לִשְׁמֹר לְמַחְלְקוֹת
  choice: తమ విభాగాల క్రమాన్ని పాటించకుండా
  rationale: పదబద్ధంగా ‘విభాగాల ప్రకారం పాటించడం లేకుండా’ అనే భావం. מַחְלְקוֹת యాజకుల సాధారణ సేవా విభాగాలను సూచిస్తుంది; తెలుగులో ‘విభాగాల క్రమం’ సంస్థాగత భావాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ఆలయ సేవకు యాజకుల ఆచారపరమైన సిద్ధత
  choice: తమను తాము ప్రతిష్ఠించుకున్నారు
  alternative: తమను తాము పరిశుద్ధపరచుకున్నారు
  rationale: ఇక్కడి క్రియ ఆలయ సేవకు సంబంధించిన ఆచారపరమైన సిద్ధతను తెలియజేస్తుంది. ‘ప్రతిష్ఠించుకున్నారు’ ఆ సందర్భాన్ని కాపాడుతూ, తరువాతి సిద్ధాంతపరమైన నైతిక పరిశుద్ధీకరణ భావాన్ని అనవసరంగా చేర్చదు.
- issue: యాజక విభాగాల సాధారణ క్రమం పాటించకపోవడం
  choice: తమ విభాగాల క్రమాన్ని పాటించకుండా
  alternative: విభాగాల ప్రకారం కావలి కాయకుండా
  rationale: שׁמרకు ‘కాపాడడం/కావలి కాయడం’ అనే సాధారణ అర్థం ఉన్నా, ఇక్కడ לְמַחְלְקוֹתతో కలసి యాజకుల నియమిత వంతులు లేదా సేవా విభాగాలను అనుసరించకపోవడమే సందర్భోచిత భావం. అయినప్పటికీ మూలంలోని నిర్మాణ భేదాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూల వాక్యం తదుపరి వచనంలో కొనసాగే నిర్మాణాన్ని సూచించేందుకు చివర దీర్ఘ విరామచిహ్నం ఉంచబడింది. వివరణాత్మక כִּי ఉపవాక్యాన్ని తెలుగులో సహజమైన మధ్యవాక్య విరామంతో చూపించాం.
