source:
  edition: WLC
  text: אֵ֚ין בָּֽ/אָר֔וֹן רַ֚ק שְׁנֵ֣י הַ/לֻּח֔וֹת אֲשֶׁר נָתַ֥ן מֹשֶׁ֖ה בְּ/חֹרֵ֑ב אֲשֶׁ֨ר כָּרַ֤ת יְהוָה֙ עִם בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מִ/מִּצְרָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/010.yaml
  text: There was nothing in the ark except the two tablets that Moses put there at Horeb[b][a], where Yahweh made a covenant with the people of Israel when they came out of Egypt.
translation:
  language: te
  text: పెట్టెలో హోరేబులో మోషే ఉంచిన[a] రెండు పలకలు తప్ప మరేమీ లేదు. ఇశ్రాయేలు ప్రజలు[b] ఐగుప్తు నుండి బయలుదేరినప్పుడు, అక్కడే యాహ్వే వారితో నిబంధన చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మోషే ఇచ్చిన.” ఇక్కడ ఆ హీబ్రూ క్రియ పలకలను పెట్టెలో ఉంచడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: “ఇశ్రాయేలు కుమారులు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין בָּאָרוֹן רַק
  choice: పెట్టెలో ... తప్ప మరేమీ లేదు
  rationale: హీబ్రూ అస్తిత్వ నిరాకరణతో కూడిన ‘తప్ప/మాత్రమే’ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שְׁנֵי הַלֻּחוֹת
  choice: రెండు పలకలు
  rationale: మూలపాఠంలో ఈ వచనంలో ‘రాతి’ అనే మాట లేదు; అందువల్ల దానిని చేర్చకుండా לֻחוֹת ను ‘పలకలు’గా అనువదించాం.
- source_word: אֲשֶׁר נָתַן מֹשֶׁה
  choice: మోషే ఉంచిన
  rationale: נָתַן సాధారణంగా ‘ఇచ్చాడు’ అని అర్థమైనా, ఇక్కడ పెట్టెలో పలకలను ఉంచడాన్ని సూచిస్తుంది; తెలుగు సందర్భంలో ‘ఉంచిన’ సహజంగా ఉంటుంది.
- source_word: בְּחֹרֵב
  choice: హోరేబు దగ్గర
  rationale: స్థలాన్ని సూచించే בְּ ను సహజమైన తెలుగులో ‘దగ్గర’గా ఇచ్చి, హోరేబు అనే మూల స్థలనామాన్ని అలాగే నిలిపాం.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִם
  choice: అక్కడే యాహ్వే వారితో నిబంధన చేశాడు
  rationale: כָּרַת అనే పదానికి అక్షరార్థం ‘కోశాడు’; అయితే నిబంధన సందర్భంలో ఇది ‘నిబంధన చేయడం’ అనే స్థిరమైన హీబ్రూ ప్రయోగం. సంబంధవాచకాన్ని హోరేబుకు అన్వయిస్తూ ‘అక్కడే’ అని ఇచ్చాం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థమైన ‘ఇశ్రాయేలు కుమారులు’ ఇక్కడ సమూహాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఇశ్రాయేలు ప్రజలు’ సహజంగా అదే భావాన్ని తెలియజేస్తుంది.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: ఐగుప్తు నుండి బయలుదేరినప్పుడు
  rationale: కాలార్థక בְּ తో కూడిన క్రియానామ రూపాన్ని ‘బయలుదేరినప్పుడు’గా సహజంగా అనువదించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ఉన్న నాలుగు అక్షరాల దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణ పండిత పునర్నిర్మిత ఉచ్చారణకు తెలుగు లిప్యంతరీకరణగా ‘యాహ్వే’ అని ఇచ్చాం.
- issue: אֲשֶׁר అనే సంబంధవాచక పదం దేనిని సూచిస్తుంది?
  choice: హోరేబు స్థలాన్ని సూచించేలా ‘అక్కడే’
  alternative: పలకలను సూచించే సంబంధవాక్యంగా ఉంచడం
  rationale: వాక్యసందర్భంలో యాహ్వే ఇశ్రాయేలు ప్రజలతో నిబంధన చేసిన స్థలం హోరేబు కావడం వల్ల ఈ అన్వయం సహజమైనది; అయినా హీబ్రూ సంబంధవాచక నిర్మాణంలోని స్వల్ప వ్యాకరణ అస్పష్టతను పూర్తిగా నిరాకరించలేం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘పెట్టె’ అనే పదం אָרוֹן కు సూటిగా వాడబడింది; సందర్భం అది నిబంధన పెట్టె అని తెలియజేస్తుంది. వాక్యాన్ని రెండు భాగాలుగా విభజించడం ద్వారా పొడవైన హీబ్రూ సంబంధవాక్యాన్ని తెలుగులో సహజంగా చేశాం.
