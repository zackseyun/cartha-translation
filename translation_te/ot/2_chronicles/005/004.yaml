  edition: WLC
  text: וַ/יָּבֹ֕אוּ כֹּ֖ל זִקְנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּשְׂא֥וּ הַ/לְוִיִּ֖ם אֶת הָ/אָרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/004.yaml
  text: And all the elders of Israel came[a], and the Levites carried the ark.
translation:
  language: te
  text: ఇశ్రాయేలు పెద్దలందరూ వచ్చారు; లేవీయులు మందసాన్ని[a] మోశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, చుట్టుపక్కల సందర్భం స్పష్టం చేస్తున్నట్లుగా, నిబంధన మందసం.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: వచ్చారు
  rationale: בוא క్రియ యొక్క వయిక్తోల్ రూపం కథనంలోని తదుపరి సంఘటనను సూచిస్తుంది. ఆధునిక తెలుగు కథనంలో ‘వచ్చారు’ సహజంగాను మూలానికి నమ్మకంగాను ఉంది.
- source_word: כֹּל
  choice: అందరూ
  rationale: ఇది ‘ఇశ్రాయేలు పెద్దలు’ అనే వర్గమంతటినీ సూచిస్తుంది. వ్యక్తుల సమూహంతో ‘అందరూ’ సహజమైన తెలుగు ప్రయోగం.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పెద్దలు
  rationale: ఇది ఇశ్రాయేలు సమాజపు గుర్తింపు పొందిన నాయకులను సూచించే సమాస పదబంధం. ‘పెద్దలు’ ఆ ప్రతినిధి నాయకత్వ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּשְׂאוּ
  choice: మోశారు
  rationale: נשׂא ఇక్కడ మందసాన్ని ఎత్తుకొని తరలించడాన్ని సూచిస్తుంది. ‘మోశారు’ ఈ చర్యను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి గోత్రానికి, ఆలయ సేవకు సంబంధించిన ఈ సమూహానికి తెలుగులో స్థిరపడిన ప్రమాణ రూపం ‘లేవీయులు’.
- source_word: אֶת הָאָרוֹן
  choice: మందసాన్ని
  rationale: ఆలయ సందర్భంలో אָרוֹן నిబంధన మందసాన్ని సూచిస్తుంది; అయితే ఈ వచనంలోని హెబ్రీ పాఠం కేవలం ‘మందసం’ అనే అర్థాన్నిచ్చే పదాన్నే ఉపయోగిస్తుంది. అందువల్ల ప్రధాన పాఠంలో అదనపు వివరణ చేర్చలేదు.
theological_decisions:
- issue: ‘మందసం’ యొక్క గుర్తింపు
  choice: ప్రధాన పాఠంలో ‘మందసం’ అని మాత్రమే అనువదించడం
  alternative: ‘నిబంధన మందసం’ అని విస్తరించడం
  rationale: హెబ్రీ మూలపాఠంలో הָאָרוֹן (‘ఆ మందసం’) మాత్రమే ఉంది. సందర్భం అది నిబంధన మందసమని స్పష్టం చేసినప్పటికీ, ప్రధాన పాఠం మూలంలోని సంక్షిప్తతను నిలుపుతుంది; వివరణను పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. హెబ్రీ వాక్యక్రమాన్ని బలవంతంగా అనుకరించకుండా, రెండు వరుస చర్యలను సెమికోలన్‌తో స్పష్టంగా కలిపాం. పాదటిప్పణి గుర్తును దాని వివరణకు సంబంధించిన ‘మందసం’ పదం వద్ద ఉంచాం.
