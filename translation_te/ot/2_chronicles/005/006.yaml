source:
  edition: WLC
  text: וְ/הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה וְ/כָל עֲדַ֧ת יִשְׂרָאֵ֛ל הַ/נּוֹעָדִ֥ים עָלָ֖י/ו לִ/פְנֵ֣י הָ/אָר֑וֹן מְזַבְּחִים֙ צֹ֣אן וּ/בָקָ֔ר אֲשֶׁ֧ר לֹֽא יִסָּפְר֛וּ וְ/לֹ֥א יִמָּנ֖וּ מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/006.yaml
  text: And King Solomon and all the assembly of Israel who had assembled before him[a], before the ark[b], were sacrificing sheep and cattle that could not be counted or numbered because of their great number.
translation:
  language: te
  text: రాజైన సొలొమోను, అతనితో కూడి సమావేశమైన ఇశ్రాయేలు సమాజమంతా[a], మందసం ఎదుట ఎంతో ఎక్కువగా ఉండి లెక్కించలేనన్ని, లెక్కపెట్టలేనన్ని చిన్న పశువులను, పెద్ద పశువులను బలిగా అర్పిస్తూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని సమక్షంలో సమావేశమైన.” హీబ్రూ మాటను ప్రజలు సొలొమోనుతో కూడ సమావేశమయ్యారని గానీ, అతని సమక్షంలో సమావేశమయ్యారని గానీ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సమాజమంతా
  rationale: עֵדָה ఇక్కడ కూడివచ్చిన సమష్టి సమాజాన్ని సూచిస్తుంది. ‘సమాజం’ ఆధునిక తెలుగులో సహజంగా ఉండి, మొత్తం ఇశ్రాయేలు సమూహ భావాన్ని అందిస్తుంది.
- source_word: הַנּוֹעָדִים עָלָיו
  choice: అతనితో కూడ సమావేశమైన
  rationale: నిఫాల్ రూపం సమావేశం కావడాన్ని సూచిస్తుంది; עָלָיו ఇక్కడ ‘అతనితో కూడ’ లేదా ‘అతని సమక్షంలో’ అనే రెండు భావాలకు వీలిస్తుంది. ప్రధాన పాఠంలో సహజమైన ‘అతనితో కూడ’ను తీసుకొని ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: לִפְנֵי הָאָרוֹן
  choice: మందసం ఎదుట
  rationale: לִפְנֵי యొక్క స్థలార్థాన్ని ‘ఎదుట’ నేరుగా తెలియజేస్తుంది; הָאָרוֹןకు ఆలయ సందర్భంలో గౌరవప్రదమైన, సుపరిచితమైన ‘మందసం’ వాడబడింది.
- source_word: מְזַבְּחִים
  choice: బలిగా అర్పిస్తూ ఉన్నారు
  rationale: వర్తమాన కృదంతం దృశ్యంలో కొనసాగుతున్న బలి చర్యను తెలియజేస్తుంది. ‘అర్పిస్తూ ఉన్నారు’ ఆ నిరంతరత్వాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: צֹאן וּבָקָר
  choice: గొర్రెలను, మేకలను, పశువులను
  rationale: צֹאן గొర్రెలు మాత్రమే కాక మేకలతో కూడిన చిన్న పశుసంపదను సూచించగలదు; בָקָר పెద్ద పశువులను సూచిస్తుంది. మూలపద విస్తృతిని సంకుచితం చేయకుండా మూడు వర్గాలను స్పష్టంగా పేర్కొన్నాం.
- source_word: אֲשֶׁר לֹא יִסָּפְרוּ וְלֹא יִמָּנוּ מֵרֹב
  choice: లెక్కించడానికి, సంఖ్య గణించడానికి వీలులేనంత విస్తారంగా ఉన్న
  rationale: సమీపార్థకమైన రెండు హీబ్రూ క్రియల emphatic జంటను తెలుగులో రెండు వ్యక్తీకరణలతో నిలిపి, מֵרֹב తెలిపే అపార సంఖ్య కారణాన్ని ‘విస్తారంగా ఉన్న’తో వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. మూలంలోని కొనసాగుతున్న చర్యను, సమీపార్థక లెక్కింపు క్రియల జంటను, עָלָיוలోని నిజమైన అర్థసందిగ్ధతను నిలిపింది. צֹאן యొక్క విస్తృత అర్థాన్ని ప్రధాన పాఠంలోనే ‘గొర్రెలను, మేకలను’ అని స్పష్టం చేసింది.
