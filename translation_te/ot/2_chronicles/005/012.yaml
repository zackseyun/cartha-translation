translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన ఆరాధనా ధోరణిని నిలిపింది. పేర్లు మరియు ఆరాధనా పదజాలంలో స్థిరమైన తెలుగు బైబిలు వాడుకను సాధ్యమైనంతవరకు అనుసరించింది; ప్రాచీన వాద్యాల గుర్తింపులోని అనిశ్చితిని పాదసూచిక ద్వారా తెలిపింది.
