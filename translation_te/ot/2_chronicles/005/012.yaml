  text: וְ/הַ/לְוִיִּ֣ם הַ/מְשֹׁרֲרִ֣ים לְ/כֻלָּ֡/ם לְ/אָסָ֡ף לְ/הֵימָ֣ן לִֽ֠/ידֻתוּן וְ/לִ/בְנֵי/הֶ֨ם וְ/לַ/אֲחֵי/הֶ֜ם מְלֻבָּשִׁ֣ים בּ֗וּץ בִּ/מְצִלְתַּ֨יִם֙ וּ/בִ/נְבָלִ֣ים וְ/כִנֹּר֔וֹת עֹמְדִ֖ים מִזְרָ֣ח לַ/מִּזְבֵּ֑חַ וְ/עִמָּ/הֶ֤ם כֹּֽהֲנִים֙ לְ/מֵאָ֣ה וְ/עֶשְׂרִ֔ים מחצררים בַּ/חֲצֹֽצְרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/012.yaml
  text: And the Levites who were the singers—all of them[a], Asaph, Heman, Jeduthun, and their sons and their brothers—were clothed in fine linen, with cymbals, harps, and lyres, standing east of the altar[b]; and with them were one hundred twenty priests blowing trumpets.
translation:
  language: te
  text: గాయకులైన లేవీయులందరూ—ఆసాపు, హేమాను, యెదూతూను, వారి కుమారులు, వారి సహోదరులు—సన్నని నారవస్త్రాలు ధరించి, తాళవాద్యాలు, స్వరమండలాలు[a], సితారాలతో బలిపీఠానికి తూర్పున[b] నిలబడ్డారు. వారితోపాటు నూట ఇరవై మంది యాజకులు త్రంపెట్లు ఊదుతూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హార్పు వంటి తంతివాద్యాలు’; ఇక్కడ పేర్కొన్న ప్రాచీన తంతివాద్యాల మధ్య ఖచ్చితమైన తేడా తెలియదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘బలిపీఠం తూర్పు వైపున.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְוִיִּם הַמְשֹׁרֲרִים
  choice: గాయకులైన లేవీయులు
  rationale: నిర్దిష్ట లేవీయులను వారి గాయక పాత్ర ద్వారా గుర్తించే హీబ్రూ విశేషణార్థక క్రియారూపాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לְכֻלָּם
  choice: అందరూ
  rationale: పేరుపేరున చెప్పబడిన నాయకులు, వారి కుమారులు, సహోదరులు అందరూ ఇందులో ఉన్నారనే సమగ్ర భావాన్ని నిలుపుతుంది.
- source_word: לְאָסָף לְהֵימָן לִידוּתוּן
  choice: ఆసాపు, హేమాను, యెదూతూను
  rationale: వ్యక్తుల పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: וְלִבְנֵיהֶם וְלַאֲחֵיהֶם
  choice: వారి కుమారులు, వారి సహోదరులు
  rationale: మూలంలోని కుటుంబ సంబంధ పదాలను వ్యాఖ్యానాత్మకంగా విస్తరించకుండా నేరుగా నిలుపుతుంది.
- source_word: מְלֻבָּשִׁים בּוּץ
  choice: సన్నని నారబట్టలు ధరించి
  rationale: పవిత్ర లేదా రాజసంబంధ సందర్భాల్లో వాడే ఉన్నత నాణ్యతగల నారవస్త్ర భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలుపుతుంది.
- source_word: בִּמְצִלְתַּיִם
  choice: తాళాలు
  rationale: ఒకదానితో ఒకటి ఢీకొట్టి మోగించే ప్రాచీన లోహ వాద్యానికి సాధారణ తెలుగు సమానార్థకం.
- source_word: וּבִנְבָלִים
  choice: స్వరమండలాలు
  rationale: נבל అనే తంతివాద్యానికి తెలుగు బైబిలు సంప్రదాయంలో పరిచితమైన పేరు; దాని ఖచ్చితమైన ప్రాచీన నిర్మాణం అనిశ్చితమైనందున పాదసూచిక ఇచ్చింది.
- source_word: וְכִנֹּרוֹת
  choice: సితారాలు
  rationale: כנורను נבל నుండి వేరుచేస్తూ, పరిచితమైన తంతివాద్య పదాన్ని ఉపయోగిస్తుంది; ఇది ఖచ్చితమైన ఆధునిక వాద్య సమీకరణమని ఉద్దేశించదు.
- source_word: עֹמְדִים מִזְרָח לַמִּזְבֵּחַ
  choice: బలిపీఠానికి తూర్పున నిలబడ్డారు
  rationale: מזרח యొక్క స్థలార్థాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది; ‘తూర్పు వైపున’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: וְעִמָּהֶם כֹּהֲנִים לְמֵאָה וְעֶשְׂרִים מחצררים בַּחֲצֹצְרוֹת
  choice: వారితోపాటు నూట ఇరవై మంది యాజకులు బూరలు ఊదుతూ ఉన్నారు
  rationale: హీబ్రూ వాక్యంలోని సహవాసం, సంఖ్య, కొనసాగుతున్న వాద్యక్రియను సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
