  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יַּאֲרִיכוּ֮ הַ/בַּדִּים֒ וַ/יֵּרָאוּ֩ רָאשֵׁ֨י הַ/בַּדִּ֤ים מִן הָ/אָרוֹן֙ עַל פְּנֵ֣י הַ/דְּבִ֔יר וְ/לֹ֥א יֵרָא֖וּ הַ/ח֑וּצָ/ה וַֽ/יְהִי שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/009.yaml
  text: And the poles were so long that the heads of the poles were seen from the ark before the inner sanctuary[a], but they could not be seen from outside; and they are there to this day.
translation:
  language: te
  text: మోయు కర్రలను పొడిగించారు; దాంతో వాటి చివరలు మందసం నుండి అంతరాలయం ముందర కనిపించాయి[a]. అయితే బయట నుండి అవి కనిపించలేదు. అవి నేటివరకు అక్కడే ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతి పరిశుద్ధ స్థలం ముందర.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲרִיכוּ
  choice: పొడిగించారు
  rationale: హిఫీల్ రూపంలోని కారణార్థక భావాన్ని నేరుగా నిలుపుతుంది; కర్రలను ఎలా పొడిగించారో అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: הַבַּדִּים
  choice: మోయు కర్రలు
  rationale: ఇవి మందసాన్ని మోయడానికి ఉపయోగించే కర్రలని ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: רָאשֵׁי הַבַּדִּים
  choice: వాటి చివరలు
  rationale: అక్షరార్థమైన ‘తలలు’ కంటే వస్తువుల అంచులను సూచించే సహజ తెలుగు ‘చివరలు’ సందర్భార్థాన్ని సరిగ్గా అందిస్తుంది.
- source_word: מִן הָאָרוֹן
  choice: మందసం దగ్గరనుండి
  rationale: מִן సూచించే ఆరంభస్థానాన్ని నిలుపుతూ, కర్రల చివరలు మందసం నుంచి పొడుచుకొని కనిపించిన స్థలసంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עַל פְּנֵי הַדְּבִיר
  choice: అంతరాలయం ముందుభాగంలో
  rationale: דְּבִיר అనే ఆలయ అంతర్గత పవిత్రస్థలాన్ని ‘అంతరాలయం’గా, עַל־פְּנֵי యొక్క స్థలసంబంధాన్ని ‘ముందుభాగంలో’గా అందిస్తుంది; నిర్మాణస్థానంపై ఉన్న స్వల్ప సందిగ్ధతకు పాదసూచిక ఇస్తుంది.
- source_word: וְלֹא יֵרָאוּ הַחוּצָה
  choice: అయితే బయటినుండి అవి కనిపించలేదు
  rationale: లోపలి స్థానం నుంచి కనిపించడానికీ బయట నుంచి కనిపించకపోవడానికీ ఉన్న వ్యత్యాసాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: וַיְהִי שָׁם עַד הַיּוֹם הַזֶּה
  choice: అవి నేటివరకు అక్కడే ఉన్నాయి
  rationale: హీబ్రూ ఏకవచన అస్తిత్వప్రయోగాన్ని సందర్భానుసారంగా కర్రలను సూచించే తెలుగు బహువచనంగా, రచయిత కాలం వరకు కొనసాగిన స్థితిగా అందిస్తుంది.
theological_decisions:
- issue: הַדְּבִיר యొక్క స్థలనామం
  choice: అంతరాలయం
  alternative: అతి పరిశుద్ధ స్థలం
  rationale: మూలపదం ఆలయంలోని అంతర్గత గదిని సూచిస్తుంది. ‘అంతరాలయం’ నిర్మాణార్థాన్ని ముందుంచి, ‘అతి పరిశుద్ధ స్థలం’ అనే సాంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ద్వారా అనవసర సిద్ధాంతపరమైన అధికనిర్ణయాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి. ‘మందసం,’ ‘అంతరాలయం’ వంటి బైబిలు-ఆలయ పదజాలాన్ని సందర్భస్పష్టతతో ఉపయోగించాం; మూలంలోని స్థలసంబంధ సందిగ్ధతను పాదసూచికలో నిలిపాం.
