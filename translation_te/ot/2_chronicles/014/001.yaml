id: 2CH.14.1
reference: 2 Chronicles 14:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ אָסָא֙ הַ/טּ֣וֹב וְ/הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/001.yaml
  text: Asa did what was good and right in the eyes of Yahweh his God[a].
translation:
  language: te
  text: ఆసా తన దేవుడైన యాహ్వే దృష్టిలో[a] మంచిదీ సరైనదీ చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యాహ్వే కళ్లలో”; అంటే యాహ్వే చూపులో లేదా తీర్పులో.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేశాడు
  rationale: ఈ నైతిక మూల్యాంకన నిర్మాణంలో עשה ఒక వ్యక్తి ఆచరించినదాన్ని సూచిస్తుంది; తెలుగులో ‘చేశాడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: אָסָא
  choice: ఆసా
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: הַטּוֹב
  choice: మంచిది
  rationale: నిర్దిష్ట ఉపపదంతో, הַיָּשָׁר తో జతగా వచ్చిన ఈ పదం నైతికంగా మంచిదైన ప్రవర్తనను సూచిస్తుంది.
- source_word: וְהַיָּשָׁר
  choice: సరైనది
  rationale: నైతిక సందర్భంలో יָשָׁר అంటే న్యాయమైనది లేదా యథార్థమైనది; ‘సరైనది’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని మూల్యాంకన భావాన్ని నిలుపుతుంది.
- source_word: בְּעֵינֵי
  choice: దృష్టిలో
  rationale: అక్షరార్థంగా ‘కళ్లలో’ అయిన ఈ హెబ్రీ నుడికారం ఒకరి చూపులో లేదా తీర్పులో అని సూచిస్తుంది; ‘దృష్టిలో’ తెలుగులో సమానమైన సహజ నుడికారం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: אֱלֹהָיו
  choice: తన దేవుడైన
  rationale: రూపపరంగా బహువచన ఆకృతి ఉన్నప్పటికీ ఇక్కడ ఇశ్రాయేలు దేవుణ్ణి ఏకవచనంగా సూచిస్తుంది; సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘తన దేవుడైన’ అని ఇచ్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా, Yahweh ఉచ్చారణను ప్రతిబింబించేలా ‘యాహ్వే’ అని ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘మంచిదీ సరైనదీ’ అనే జత మూలంలోని రెండు వేర్వేరు నైతిక విశేషణాలను నిలుపుతుంది; ‘దృష్టిలో’ హెబ్రీ నుడికారానికి సహజ తెలుగు సమానార్థకం.
