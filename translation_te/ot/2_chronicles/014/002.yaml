id: 2CH.14.2
reference: 2 Chronicles 14:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֛סַר אֶת מִזְבְּח֥וֹת הַ/נֵּכָ֖ר וְ/הַ/בָּמ֑וֹת וַ/יְשַׁבֵּר֙ אֶת הַ/מַּצֵּב֔וֹת וַ/יְגַדַּ֖ע אֶת הָ/אֲשֵׁרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/002.yaml
  text: He removed the foreign altars and the high places[a], shattered the sacred pillars, and cut down the Asherim.
translation:
  language: te
  text: అతడు విదేశీ బలిపీఠాలను, ఉన్నత పూజాస్థలాలను తొలగించాడు; పూజా స్తంభాలను పగలగొట్టి, అషేరీమ్‌లను[a] నరికివేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అషేరా కంబాలను.’ హీబ్రూ పదం అషేరా ఆరాధనతో సంబంధమున్న పూజా వస్తువులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: తొలగించాడు
  rationale: హిఫిల్ రూపంలోని క్రియ ఇక్కడ తీసివేయడం లేదా తొలగించడం అనే స్పష్టమైన సంస్కరణ చర్యను సూచిస్తుంది.
- source_word: מִזְבְּחוֹת הַנֵּכָר
  choice: అన్య ఆరాధనకు చెందిన బలిపీఠాలు
  rationale: నֵכָר ఇక్కడ విదేశీయుల యాజమాన్యాన్ని మాత్రమే కాకుండా, ఇశ్రాయేలీయేతర లేదా అక్రమ ఆరాధనతో సంబంధాన్ని సూచించే అవకాశం ఉంది. ఈ అనువాదం ఆ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַבָּמוֹת
  choice: ఉన్నత పూజాస్థలాలు
  rationale: బామోత్ అనేవి ఆరాధన కోసం ఉపయోగించిన ఎత్తైన లేదా ఉన్నత స్థలాలు. కేవలం ‘ఉన్నత స్థలాలు’ కంటే వాటి ఆరాధనా స్వభావాన్ని ఈ రూపం స్పష్టం చేస్తుంది.
- source_word: וַיְשַׁבֵּר
  choice: పగలగొట్టి
  rationale: ఈ క్రియ బలంగా విరగగొట్టడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండి విధ్వంస చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמַּצֵּבוֹת
  choice: పూజా స్తంభాలు
  rationale: మత్సేబోత్ అనేవి ఆరాధనలో ఉపయోగించిన నిలువురాళ్లు లేదా స్తంభాలు. ‘పూజా స్తంభాలు’ వాటి మతపరమైన కార్యాన్ని సాధారణ పాఠకుడికి స్పష్టం చేస్తుంది.
- source_word: וַיְגַדַּע
  choice: నరికివేశాడు
  rationale: ఈ క్రియ చెక్కతో చేసిన వస్తువులు లేదా చెట్లను నరికి పడవేయడాన్ని సూచిస్తుంది; అషేరాతో సంబంధమున్న వస్తువుల సందర్భానికి సరిపోతుంది.
- source_word: הָאֲשֵׁרִים
  choice: అషేరా పూజా వస్తువులు
  rationale: ఈ బహువచన పదం అషేరా ఆరాధనతో సంబంధమున్న వస్తువులను సూచిస్తుంది; అవి స్తంభాలా, చెక్క కంబాలా, ప్రతీకాత్మక వృక్షాలా అన్నది నిర్దిష్టంగా లేదు. అందువల్ల విస్తృతమైన పదబంధాన్ని వాడి అసలు అనిశ్చితిని నిలిపాము.
theological_decisions:
- issue: విగ్రహారాధన నిర్మూలన సందర్భంలో הָאֲשֵׁרִים అనువాదం
  choice: అషేరా పూజా వస్తువులు
  alternative: అషేరా కంబాలు
  rationale: హీబ్రూ పదం అషేరా ఆరాధనతో సంబంధమున్న నిషిద్ధ వస్తువులను సూచించినా, వాటి ఖచ్చిత రూపం వివాదాస్పదం. ప్రధాన పాఠంలో విస్తృత అర్థాన్ని ఉంచి, సాధారణ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాము. వరుస విధ్వంస చర్యలను స్పష్టంగా చూపేందుకు అర్థవిరామ చిహ్నాన్ని ఉపయోగించాము. పాదసూచిక గుర్తును దానికి సంబంధించిన ‘అషేరా పూజా వస్తువులు’ అన్న పదబంధం వెంట ఉంచాము.
