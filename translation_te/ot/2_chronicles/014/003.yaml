source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ לִֽ/יהוּדָ֔ה לִ/דְר֕וֹשׁ אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם וְ/לַ/עֲשׂ֖וֹת הַ/תּוֹרָ֥ה וְ/הַ/מִּצְוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/003.yaml
  text: And he told Judah to seek the LORD, the God of their fathers, and to keep the law and the commandment.
translation:
  language: te
  text: తమ పితరుల దేవుడైన యెహోవాను వెదకాలని, ధర్మశాస్త్రాన్ని, ఆజ్ఞను పాటించాలని అతడు యూదా ప్రజలకు చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִדְרוֹשׁ
  choice: వెదకాలని
  rationale: దేవుని వైపు తిరిగి, ఆయనను ఆశ్రయించి అనుసరించడమనే భావాన్ని సహజమైన తెలుగు పదంతో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలోని దేవుని ప్రత్యేక నామాన్ని బిరుదుగా మార్చకుండా తెలుగు పాఠకులకు సుపరిచితమైన రూపంలో ఉంచింది.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: తమ పితరుల దేవుడు
  rationale: సంబంధబోధక నిర్మాణాన్నీ, యూదావారి పూర్వీకులతో దేవునికి ఉన్న సంబంధాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: הַתּוֹרָה וְהַמִּצְוָה
  choice: ధర్మశాస్త్రాన్ని, ఆజ్ఞను
  rationale: మూలంలోని రెండు ఏకవచన పదాల భేదాన్ని అలాగే ఉంచి, వాటిని ఒకే సాధారణ పదంగా కలపలేదు.
- source_word: לַעֲשׂוֹת
  choice: పాటించాలని
  rationale: ధర్మశాస్త్రం, ఆజ్ఞ విషయంలో ‘చేయడం’ అంటే వాటికి విధేయత చూపి ఆచరించడం; తెలుగులో ‘పాటించడం’ సహజంగా ఆ భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో సాధారణ బిరుదు కాక దేవుని ప్రత్యేక నామం ఉన్నందున దానిని పేరుగా ప్రతిబింబించింది; ఏ ప్రత్యేక సిద్ధాంత వ్యాఖ్యానాన్నీ చేర్చలేదు.
- issue: תורה మరియు מצוה మధ్య సంబంధం
  choice: ‘ధర్మశాస్త్రాన్ని, ఆజ్ఞను’ అని రెండింటినీ వేరుగా ఉంచడం
  alternative: ‘ధర్మశాస్త్ర ఆజ్ఞలను’ అని కలపడం
  rationale: మూలంలోని సంధి మరియు రెండు నిర్దిష్ట ఏకవచన నామవాచకాల రూపాన్ని నిలుపుతూ, వాటి మధ్య సంబంధాన్ని వ్యాఖ్యాత్మకంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘యూదావారికి’ అనేది ప్రాంతానికంటే ప్రజలను ఉద్దేశించిన సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
