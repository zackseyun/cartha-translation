id: 2CH.14.13
reference: 2 Chronicles 14:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּכּ֗וּ אֵ֤ת כָּל הֶֽ/עָרִים֙ סְבִיב֣וֹת גְּרָ֔ר כִּי הָיָ֥ה פַֽחַד יְהוָ֖ה עֲלֵי/הֶ֑ם וַ/יָּבֹ֨זּוּ֙ אֶת כָּל הֶ֣/עָרִ֔ים כִּֽי בִזָּ֥ה רַבָּ֖ה הָיְתָ֥ה בָ/הֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/013.yaml
  text: And they struck down all the cities around Gerar, for the terror of Yahweh was upon them. And they plundered all the cities, for there was much spoil in them.
translation:
  language: te
  text: వారు గెరారు చుట్టుపక్కల ఉన్న పట్టణాలన్నిటిపై దాడి చేసి వాటిని ఓడించారు; ఎందుకంటే యాహ్వే భీతి ఆ పట్టణాల ప్రజలమీద పడింది. ఆ పట్టణాల్లో దోపుడుసొమ్ము చాలా ఉండడంతో, వారు ఆ పట్టణాలన్నిటినీ దోచుకున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: మట్టుబెట్టారు
  rationale: נכה అనే క్రియ యుద్ధ సందర్భంలో బలంగా దాడిచేసి ఓడించడాన్ని సూచిస్తుంది. నగరాలనే అక్షరార్థంగా ‘చంపారు’ అని కాకుండా, వాటి ప్రజలను లేదా రక్షకులను నిర్ణయాత్మకంగా ఓడించిన భావాన్ని ఈ ప్రయోగం సహజంగా తెలియజేస్తుంది.
- source_word: כָּל הֶעָרִים סְבִיבוֹת גְּרָר
  choice: గెరారు చుట్టుపక్కల ఉన్న పట్టణాలన్నిటినీ
  rationale: עָרִים అనే పదానికి ఈ ప్రాంతీయ యుద్ధవివరణలో ‘పట్టణాలు’ సహజమైన తెలుగు సమానం; סְבִיבוֹת భావాన్ని ‘చుట్టుపక్కల ఉన్న’గా అందించాం.
- source_word: פַּחַד יְהוָה
  choice: యెహోవా భయం
  rationale: ఇది భక్తిపూర్వక భయాన్ని కాక, యెహోవా వల్ల కలిగిన లేదా ఆయనతో సంబంధమున్న భయానక స్థితిని సూచిస్తుంది. ‘యెహోవా భయం’ మూలంలోని సంక్షిప్తతను, కారణం/సంబంధంలోని స్వల్ప సందిగ్ధతను కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: עֲלֵיהֶם
  choice: వాటిమీదికి వచ్చింది
  rationale: పట్టణాలను సమూహాలుగా సూచించే తెలుగు వాక్యనిర్మాణంలో, వాటి నివాసులపై భయం ఆవరించిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיָּבֹזּוּ
  choice: దోచుకున్నారు
  rationale: בזז యుద్ధంలో సొమ్మును కొల్లగొట్టడాన్ని సూచిస్తుంది; ‘దోచుకున్నారు’ ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన క్రియ.
- source_word: בִּזָּה רַבָּה
  choice: దోపుడుసొమ్ము విస్తారంగా
  rationale: ביזה యుద్ధంలో స్వాధీనం చేసుకునే వస్తుసంపద. ‘దోపుడుసొమ్ము’ దాని అర్థాన్ని స్పష్టంగా ఇస్తుంది; רַבָּהను ‘విస్తారంగా’గా అందించాం.
- source_word: בָהֶם
  choice: ఆ పట్టణాల్లో
  rationale: సర్వనామం ముందున్న పట్టణాలనే సూచిస్తుంది. తెలుగులో సూచన స్పష్టంగా ఉండేందుకు నామవాచకాన్ని పునరుక్తి చేశాం.
theological_decisions:
- issue: פַּחַד יְהוָה అనే పదబంధంలోని సంబంధం
  choice: యెహోవా భయం
  alternative: యెహోవా కలిగించిన భీతి
  rationale: ఈ భయం యెహోవా వల్ల కలిగిందని సందర్భం సూచించినా, మూలంలోని నిర్మాణం కారణాన్ని పూర్తిగా వ్యాకరణపరంగా విప్పి చెప్పదు. అందువల్ల ‘కలిగించిన’ అని అదనంగా స్పష్టీకరించకుండా సంబంధాన్ని కాపాడాం.
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; అందువల్ల దానిని బిరుదుగా మార్చకుండా తెలుగు లిప్యంతరీకరణతో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; యుద్ధవివరణకు తగిన గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదాలను వాడాం. మూలంలోని రెండు సమాంతర వాక్యాలను తెలుగులో సహజమైన కారణసంబంధాలతో అందించాం.
