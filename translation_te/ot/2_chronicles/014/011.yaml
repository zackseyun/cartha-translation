  text: וַ/יִּגֹּ֤ף יְהוָה֙ אֶת הַ/כּוּשִׁ֔ים לִ/פְנֵ֥י אָסָ֖א וְ/לִ/פְנֵ֣י יְהוּדָ֑ה וַ/יָּנֻ֖סוּ הַ/כּוּשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/011.yaml
  text: And Yahweh struck down the Cushites before Asa and before Judah[a], and the Cushites fled.
translation:
  language: te
  text: యాహ్వే ఆసా ఎదుట, యూదా ఎదుట కూషీయులను[a] దెబ్బతీశాడు; కూషీయులు పారిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇథియోపీయులను.’ హీబ్రూలోని జాతినామం ‘కూషీయులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: దెబ్బతీశాడు
  rationale: యుద్ధ సందర్భంలో נָגַף శత్రువును బలంగా కొట్టి ఓడించడాన్ని సూచిస్తుంది. ‘దెబ్బతీశాడు’ దైవిక చర్యలోని తీవ్రతను నిలుపుతుంది; కేవలం ‘ఓడించాడు’ అనే అనువాదం కంటే మూలంలోని చిత్రాత్మకతను మెరుగ్గా వ్యక్తం చేస్తుంది, అలాగే అందరినీ చంపాడనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగు లిపిలో నేరుగా లిప్యంతరీకరించింది.
- source_word: הַכּוּשִׁים
  choice: కూషీయులు
  rationale: హీబ్రూ జాతినామమైన כּוּשִׁיםను నేరుగా ప్రతిబింబిస్తుంది; దానిని తరువాతి భౌగోళిక నామమైన ‘ఐతియోపీయులు’తో వెంటనే సమీకరించదు.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: యుద్ధ నివేదికలో ‘ఎదుట/సమక్షంలో’ అనే భావాన్ని నిలుపుతూ, ఆసా మరియు యూదా సైన్యం ముందర యాహ్వే చేసిన చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אָסָא
  choice: ఆసా
  rationale: వ్యక్తి పేరుకు ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: ఇక్కడ రాజ్యాన్ని లేదా దాని ప్రజలను సమష్టిగా సూచించే పేరును యథాతథంగా ఉంచింది.
- source_word: וַיָּנֻסוּ
  choice: పారిపోయారు
  rationale: נוּס యొక్క ‘పారిపోవడం’ అనే స్పష్టమైన అర్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవ నామమైన יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: వచనంలో బిరుదు కాకుండా చతురక్షర దైవ నామమే ఉంది. అందువల్ల దానిని ‘ప్రభువు’గా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలపాఠాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన చారిత్రక కథన శైలి. ‘దెబ్బతీశాడు’ మూల క్రియలోని తీవ్రతను నిలుపుతుండగా, ‘పారిపోయారు’ సాధారణ పాఠకులకు వెంటనే అర్థమయ్యే సహజ ప్రయోగం.
