source:
  edition: WLC
  text: וְ/גַם אָהֳלֵ֥י מִקְנֶ֖ה הִכּ֑וּ וַ/יִּשְׁבּ֨וּ צֹ֤אן לָ/רֹב֙ וּ/גְמַלִּ֔ים וַ/יָּשֻׁ֖בוּ יְרוּשָׁלִָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/014.yaml
  text: They also struck the tents of livestock[a], and they carried off sheep in abundance and camels[c][b]. Then they returned to Jerusalem.
translation:
  language: te
  text: వారు పశువులకు సంబంధించిన గుడారాలపై కూడా దాడి చేసి[a], గొర్రెలను విస్తారంగా, ఒంటెలను కూడా స్వాధీనం చేసుకున్నారు[c][b]. ఆ తర్వాత వారు యెరూషలేముకు తిరిగి వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పశువుల గుడారాలు.” ఈ పదబంధం పశువులతో సంబంధం ఉన్న శిబిరాలను లేదా కాపరుల శిబిరాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ క్రియకు “బందీలుగా పట్టుకున్నారు” అనే అర్థం కూడా ఉంది. ఇక్కడ జంతువుల గురించి చెప్పబడుతున్నందున, వాటిని యుద్ధసొమ్ముగా స్వాధీనం చేసుకున్నారనే భావం.
    reason: lexical_alternative
  - marker: c
    text: “గొర్రెలు” అనే హీబ్రూ పదం విస్తృతంగా గొర్రెలు, మేకలు వంటి చిన్న పశువుల మందలను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: కూడా
  rationale: మునుపటి సంఘటనలకు ఈ చర్యను జోడిస్తూ ఉన్న హీబ్రూ పదబంధంలోని సంయోజక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אָהֳלֵי מִקְנֶה
  choice: పశువుల కాపరుల గుడారాలు
  rationale: అక్షరార్థంగా ‘పశువుల గుడారాలు’; సందర్భంలో ఇది పశువులతో సంబంధమున్న సంచార కాపరుల శిబిరాలను సూచించే అవకాశం ఉన్నందున, తెలుగులో అర్థవంతంగా ఈ రూపాన్ని ఎంచుకున్నాం; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: הִכּוּ
  choice: దాడి చేసి
  rationale: נכה అనే క్రియకు ‘కొట్టు’ అనే ప్రాథమిక అర్థం ఉన్నా, ఇక్కడ సైనిక దాడి సందర్భంలో ‘దాడి చేయు’ సహజంగా సరిపోతుంది.
- source_word: וַיִּשְׁבּוּ
  choice: దోచుకొని వెళ్లారు
  rationale: שבה సాధారణంగా ‘బందీలుగా పట్టుకొను’ అని అర్థమిస్తుంది; ఇక్కడ జంతువులు కర్మగా ఉన్నందున వాటిని యుద్ధసొమ్ముగా స్వాధీనం చేసుకొని తీసుకెళ్లారనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: צֹאן
  choice: గొర్రెలు
  rationale: צֹאן గొర్రెలను మాత్రమే కాక చిన్న పశువుల మందలను సమష్టిగా సూచించవచ్చు. ప్రధాన పాఠ్యంలో సాధారణమైన ‘గొర్రెలు’ అని ఇచ్చి, విస్తృత అర్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: לָרֹב
  choice: విస్తారంగా
  rationale: అత్యధిక సంఖ్య లేదా సమృద్ధిని తెలిపే హీబ్రూ ప్రయోగాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וּגְמַלִּים
  choice: ఒంటెలను
  rationale: హీబ్రూ నామవాచకానికి నేరమైన, సందర్భోచిత తెలుగు రూపం.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: ఆ తర్వాత వారు యెరూషలేముకు తిరిగి వచ్చారు
  rationale: వావ్-క్రమ కథన పురోగతిని ‘ఆ తర్వాత’ ద్వారా సహజమైన ఆధునిక తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి. మూలంలోని కాపరుల శిబిరాల సూచనను ప్రధాన పాఠ్యంలో సహజంగా ఇచ్చి, దాని అక్షరార్థాన్ని పాదసూచికలో సంరక్షించాం. పాదసూచిక గుర్తులను సంబంధిత పదబంధాల వెంట ఉంచాం.
