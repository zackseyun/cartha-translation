id: 2CH.14.6
reference: 2 Chronicles 14:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר לִֽ/יהוּדָ֜ה נִבְנֶ֣ה אֶת הֶ/עָרִ֣ים הָ/אֵ֗לֶּה וְ/נָסֵ֨ב חוֹמָ֣ה וּ/מִגְדָּלִים֮ דְּלָתַ֣יִם וּ/בְרִיחִים֒ עוֹדֶ֨/נּוּ הָ/אָ֜רֶץ לְ/פָנֵ֗י/נוּ כִּ֤י דָרַ֨שְׁנוּ֙ אֶת יְהוָ֣ה אֱלֹהֵ֔י/נוּ דָּרַ֕שְׁנוּ וַ/יָּ֥נַֽח לָ֖/נוּ מִ/סָּבִ֑יב וַ/יִּבְנ֖וּ וַ/יַּצְלִֽיחוּ׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/006.yaml
  text: And he said to Judah[a], “Let us build these cities and surround them with walls and towers, gates and bars, while the land is still before us, because we have sought Yahweh our God. We have sought him, and he has given us rest on every side.” So they built and prospered.
translation:
  language: te
  text: 'అతడు యూదా ప్రజలతో ఇలా అన్నాడు: “ఈ పట్టణాలను కట్టి, వాటి చుట్టూ ప్రాకారాలు, బురుజులు, ద్వారాలు, అడ్డగడియలు ఏర్పరుద్దాం. దేశం ఇంకా మన ముందే ఉంది కాబట్టి, మన దేవుడైన యాహ్వేను మనం వెదికాం; మనం ఆయనను వెదికాం, ఆయన మనకు నలువైపులా విశ్రాంతి ఇచ్చాడు.” కాబట్టి వారు కట్టారు, వర్ధిల్లారు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לִיהוּדָה
  choice: అతడు యూదా ప్రజలతో ... అన్నాడు
  rationale: ‘యూదా’ ఇక్కడ ప్రాంతం లేదా రాజ్యనామం ద్వారా అక్కడి ప్రజలను సూచిస్తుంది. ఆధునిక తెలుగులో అర్థం స్పష్టంగా ఉండేందుకు ‘యూదా ప్రజలు’ అని అనువదించాం.
- source_word: נִבְנֶה
  choice: నిర్మిద్దాం
  rationale: ప్రథమ పురుష బహువచన కోహోర్టేటివ్ రూపం ప్రోత్సాహం లేదా ఉమ్మడి సంకల్పాన్ని వ్యక్తం చేస్తుంది. ‘నిర్మిద్దాం’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ఈ పట్టణాలను
  rationale: עָרִים జనావాస పట్టణాలను సూచిస్తుంది; రక్షణ నిర్మాణాల సందర్భంలో ‘పట్టణాలు’ సహజమైన ఎంపిక.
- source_word: וְנָסֵב
  choice: వాటి చుట్టూ ... నిర్మిద్దాం
  rationale: హిఫిల్ రూపం చుట్టుముట్టడం లేదా పరివేష్టించడం అనే భావాన్ని ఇస్తుంది. తరువాత వచ్చే రక్షణ నిర్మాణాల జాబితాతో కలిపి తెలుగులో ఈ నిర్మాణం సహజంగా ఉంటుంది.
- source_word: חוֹמָה וּמִגְדָּלִים דְּלָתַיִם וּבְרִיחִים
  choice: ప్రాకారాలు, బురుజులు, ద్వారాలు, అడ్డగడియలు
  rationale: ఇవి పట్టణ రక్షణకు సంబంధించిన నిర్మాణాలు. חוֹמָה ఏకవచన సమష్టి భావంలో ఉన్నా, అనేక పట్టణాల సందర్భంలో ‘ప్రాకారాలు’ సహజం; בְרִיחִים ద్వారాలను బిగించే అడ్డగడియలను సూచిస్తుంది.
- source_word: עוֹדֶנּוּ הָאָרֶץ לְפָנֵינוּ
  choice: దేశం ఇంకా మన ముందే ఉన్నప్పుడే
  rationale: עוֹדֶנּוּ లోని ‘ఇంకా’ అనే కాలభావాన్ని, לְפָנֵינוּ అనే మూలరూపకాన్ని నిలుపుతూ, అవకాశం ప్రస్తుతం అందుబాటులో ఉందనే భావాన్ని అతిగా వివరించకుండా ఉంచుతుంది.
- source_word: כִּי דָרַשְׁנוּ אֶת יְהוָה אֱלֹהֵינוּ
  choice: ఎందుకంటే మన దేవుడైన యెహోవాను మనం వెదికాం
  rationale: דרשׁ దేవుని విషయంగా వాడినప్పుడు భక్తితో ఆయనను వెదకడం, ఆయనపై ఆధారపడడం అనే విస్తృత భావం కలిగి ఉంటుంది. ‘వెదికాం’ మూలపదపు రూపకాన్ని, ఉద్దేశపూర్వక ఆధ్యాత్మిక అన్వేషణను నిలుపుతుంది.
- source_word: דָּרַשְׁנוּ
  choice: మనం ఆయనను వెదికాం
  rationale: హీబ్రూలోని ఉద్ఘాటనాత్మక పునరుక్తిని తొలగించకుండా ఉంచాం; కర్మను ముందు వాక్యం నుంచి సహజంగా ‘ఆయనను’ అని తెలిపాం.
- source_word: וַיָּנַח לָנוּ מִסָּבִיב
  choice: ఆయన మనకు నలువైపులా విశ్రాంతి ఇచ్చాడు
  rationale: ఈ క్రియ విశ్రాంతి లేదా ఉపశమనం కలిగించడాన్ని సూచిస్తుంది. మూలంలో స్పష్టంగా లేని ‘శత్రువుల నుంచి’ వంటి వివరాన్ని చేర్చకుండా ‘నలువైపులా’ అనే నుడికారాన్ని నిలిపాం.
- source_word: וַיִּבְנוּ וַיַּצְלִיחוּ
  choice: కాబట్టి వారు నిర్మించారు, వర్ధిల్లారు
  rationale: చివరి రెండు క్రియలు నిర్మాణం మరియు దాని విజయవంతమైన ఫలితాన్ని తెలియజేస్తాయి. ‘వర్ధిల్లారు’ విజయంతో కూడిన పురోగతిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాకుండా చతురక్షర వ్యక్తిగత దైవనామం ఉంది. అందువల్ల దానిని ‘ప్రభువు’గా మార్చకుండా నామరూపంలో ఉంచాం.
- issue: דרשׁ యొక్క ఆధ్యాత్మిక భావం
  choice: వెదికాం
  alternative: ఆశ్రయించాం
  rationale: ‘ఆశ్రయించాం’ సందర్భ భావాన్ని స్పష్టపరుస్తుంది గానీ మూలంలోని ‘వెదకడం/అన్వేషించడం’ అనే భావాన్ని కొంత సంకుచితం చేస్తుంది. అందువల్ల కావాలనే వెదకడం, భక్తితో దేవుని వైపు తిరగడం రెండింటినీ అనుమతించే ‘వెదికాం’ ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. కోట నిర్మాణ పదాలకు ‘ప్రాకారాలు, బురుజులు, ద్వారాలు, అడ్డగడియలు’ వంటి స్పష్టమైన పదాలు ఎంచుకున్నాం. హీబ్రూ పునరుక్తిని, ‘దేశం మన ముందే ఉంది’ అనే అసలు రూపకంలోని కొంత సందిగ్ధతను నిలిపాం.
