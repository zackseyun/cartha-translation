  revised_text: 'అతడు యూదా ప్రజలతో ఇలా అన్నాడు: “ఈ పట్టణాలను కట్టి, వాటి చుట్టూ ప్రాకారాలు, బురుజులు, ద్వారాలు, అడ్డగడియలు ఏర్పరుద్దాం. దేశం ఇంకా మన ముందే ఉంది కాబట్టి, మన దేవుడైన యాహ్వేను మనం వెదికాం; మనం ఆయనను వెదికాం, ఆయన మనకు నలువైపులా విశ్రాంతి ఇచ్చాడు.” కాబట్టి వారు కట్టారు, వర్ధిల్లారు.'
