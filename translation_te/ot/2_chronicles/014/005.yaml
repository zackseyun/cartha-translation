id: 2CH.14.5
reference: 2 Chronicles 14:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּ֛בֶן עָרֵ֥י מְצוּרָ֖ה בִּ/יהוּדָ֑ה כִּֽי שָׁקְטָ֣ה הָ/אָ֗רֶץ וְ/אֵין עִמּ֤/וֹ מִלְחָמָה֙ בַּ/שָּׁנִ֣ים הָ/אֵ֔לֶּה כִּֽי הֵנִ֥יחַ יְהוָ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/005.yaml
  text: He built fortified cities in Judah[a], because the land was quiet and there was no war with him in those years, because Yahweh gave him rest.
translation:
  language: te
  text: అతడు యూదాలో ప్రాకార పట్టణాలను నిర్మించాడు. దేశం ప్రశాంతంగా ఉంది; ఆ సంవత్సరాల్లో అతనికి యుద్ధమేమీ లేదు[a]. ఎందుకంటే యహ్వే అతనికి విశ్రాంతి ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనిపై యుద్ధం జరగలేదు.” ఈ హీబ్రూ నుడికారం ఆసాను ఎదుర్కొన్న యుద్ధం లేకపోవడాన్ని గానీ, అతనితో ముడిపడిన యుద్ధం అసలే లేకపోవడాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: అతడు … నిర్మించాడు
  rationale: בנה క్రియ యొక్క కథన భూతకాల రూపం. సందర్భంలోని కర్త ఆసా అని సూచించే పురుష ఏకవచనాన్ని సహజమైన తెలుగు కథన శైలిలో వ్యక్తం చేస్తుంది.
- source_word: עָרֵי מְצוּרָה
  choice: ప్రాకార పట్టణాలు
  rationale: రక్షణకోసం దుర్గీకరించబడిన పట్టణాలు అనే నిర్మాణ పదబంధ భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בִּיהוּדָה
  choice: యూదాలో
  rationale: స్థలాన్ని సూచించే בְּ ఉపసర్గను తెలుగు అధికరణ విభక్తితో అందిస్తుంది.
- source_word: שָׁקְטָה הָאָרֶץ
  choice: దేశం ప్రశాంతంగా ఉంది
  rationale: שׁקט లోని కలతలేమి, ప్రశాంతత భావాన్ని సహజమైన ఆధునిక తెలుగులో కాపాడుతుంది.
- source_word: וְאֵין עִמּוֹ מִלְחָמָה
  choice: అతనికి యుద్ధమేమీ లేదు[a]
  rationale: ఆసాను ఎదుర్కొన్న లేదా అతనితో ముడిపడిన యుద్ధం లేకపోవడం అనే హీబ్రూ నుడికారంలోని విస్తృత భావాన్ని అనవసరంగా కుదించకుండా తెలుగులో సహజంగా అందిస్తుంది.
- source_word: בַּשָּׁנִים הָאֵלֶּה
  choice: ఆ సంవత్సరాల్లో
  rationale: చర్చలో ఉన్న కాలాన్ని సూచించే సహజమైన తెలుగు కాలవాచక ప్రయోగం.
- source_word: הֵנִיחַ
  choice: విశ్రాంతి ఇచ్చాడు
  rationale: נוּחַ హిఫీల్ రూపం ఇక్కడ యుద్ధం నుండి ఉపశమనాన్ని లేదా నెమ్మదిని కలిగించడం అనే భావాన్ని ఇస్తుంది; దైవం ప్రసాదించిన విశ్రాంతి అనే మూలపాఠ్య ప్రతీకను కాపాడుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవ నామమైన నాలుగు హీబ్రూ అక్షరాల పేరును బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాక దేవుని వ్యక్తిగత నామమే ఉంది. అందువల్ల దానిని తెలుగులో లిప్యంతరీకరించడం మూలరూపాన్ని స్పష్టంగా కాపాడుతుంది.
- issue: విశ్రాంతికి కర్త మరియు గ్రహీత
  choice: యహ్వే అతనికి విశ్రాంతి ఇచ్చాడు
  alternative: అతనికి ప్రశాంతత కలిగింది
  rationale: హీబ్రూ హిఫీల్ క్రియ యహ్వేను క్రియాశీల కర్తగా, ఆసాను విశ్రాంతి పొందినవాడిగా స్పష్టంగా చూపుతుంది; ఆ దైవ కార్యసాధకతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన చారిత్రక కథన శైలి వాడబడింది. పొడవైన కారణవాక్యాన్ని చదవడానికి సులభంగా మూడు వాక్యాలుగా విభజించాం; రెండు כִּי కారణ సంబంధాలూ భావపరంగా నిలిచాయి. మూలంలోని యుద్ధ నుడికారానికి ఉన్న విస్తృతతను ప్రధాన పాఠం మరియు పాదటిప్పణి ద్వారా కాపాడాం.
