id: 2CH.14.4
reference: 2 Chronicles 14:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֨סַר֙ מִ/כָּל עָרֵ֣י יְהוּדָ֔ה אֶת הַ/בָּמ֖וֹת וְ/אֶת הַֽ/חַמָּנִ֑ים וַ/תִּשְׁקֹ֥ט הַ/מַּמְלָכָ֖ה לְ/פָנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/004.yaml
  text: He removed the high places and the incense altars from all the cities of Judah[a], and the kingdom had rest before him.
translation:
  language: te
  text: అతడు యూదాలోని అన్ని పట్టణాలనుండి ఉన్నత ఆరాధనా స్థలాలను, ధూపవేదికలను[a] తొలగించాడు; అతని కాలంలో రాజ్యానికి విశ్రాంతి కలిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సూర్యస్తంభాలను.” ఈ హీబ్రూ పదం ఆరాధనలో ఉపయోగించే వస్తువులను సూచిస్తుంది; కొన్ని సందర్భాల్లో ఇవి సూర్యారాధనతో సంబంధం కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: తొలగించాడు
  rationale: సור అనే క్రియ హిఫీల్ రూపంలో ఏదైనా తొలగింపజేయడం లేదా తీసివేయడం అనే భావాన్ని ఇస్తుంది. ‘తొలగించాడు’ సహజంగా ఉండి, అధికారికంగా రద్దుచేశాడనే అదనపు భావాన్ని చేర్చదు.
- source_word: מִכָּל עָרֵי יְהוּדָה
  choice: యూదా పట్టణాలన్నిటిలోనుండి
  rationale: מן + כל నిర్మాణం ఆసా సంస్కరణ జరిగిన భౌగోళిక పరిధిని సూచిస్తుంది; ఈ తెలుగు రూపం ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַבָּמוֹת
  choice: ఉన్నత స్థలాలను
  rationale: במות సాధారణంగా ఎత్తైన ప్రదేశాల్లోని ఆరాధనా స్థలాలను సూచిస్తుంది. ‘ఉన్నత స్థలాలు’ చారిత్రక-ఆరాధనా భావాన్ని వివరణాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: הַחַמָּנִים
  choice: ధూపవేదికలను
  rationale: חמנים ఖచ్చితార్థం వివాదాస్పదం; ఇది ధూపారాధనతో లేదా సూర్యారాధనతో సంబంధమున్న ఆరాధనా వస్తువులను సూచించవచ్చు. చదవడానికి సహజమైన సాధ్యార్థంగా ‘ధూపవేదికలు’ వాడి, మరో సాధ్యార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַתִּשְׁקֹט
  choice: ప్రశాంతంగా ఉంది
  rationale: שקט కలత లేకుండా నెమ్మదిగా, ప్రశాంతంగా ఉండడాన్ని సూచిస్తుంది. రాజ్యాన్ని కర్తగా తీసుకున్నప్పుడు ఈ రూపం ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: הַמַּמְלָכָה
  choice: రాజ్యం
  rationale: ממלכהకు నేరమైన, సాధారణ తెలుగు సమానార్థం ‘రాజ్యం’.
- source_word: לְפָנָיו
  choice: అతని పాలనలో
  rationale: అక్షరార్థంగా ‘అతని ఎదుట’ అయినా, ఈ సందర్భంలో అతని సమక్షంలో లేదా అతని ఆధీన పాలనలో అనే కాల-పాలనా భావం ఉంది. ‘అతని పాలనలో’ సాధారణ పాఠకునికి ఉద్దేశిత భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ఆసా తొలగించిన ఆరాధనా వస్తువుల స్వభావం
  choice: במותను ‘ఉన్నత స్థలాలు’గా, חמניםను ‘ధూపవేదికలు’గా concrete ఆరాధనా ఏర్పాట్లుగా అనువదించడం
  alternative: חמניםను ప్రత్యేకంగా ‘సూర్య స్తంభాలు’గా అనువదించడం
  rationale: వచనం అక్రమ ఆరాధనకు సంబంధించిన స్థలాలు, వస్తువుల తొలగింపును తెలియజేస్తుంది; అయితే חמנים యొక్క నిర్దిష్ట ఆరాధనా సంబంధం అనిశ్చితం. అందువల్ల ప్రధాన పాఠ్యంలో సాధ్యమైన అర్థాన్ని ఇచ్చి, సూర్యారాధన సంబంధిత ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. మూలంలోని ఆరాధనా పదాల చారిత్రక భావాన్ని నిలుపుతూ, అనిశ్చిత పదానికి పాదసూచిక ఇచ్చాం.
