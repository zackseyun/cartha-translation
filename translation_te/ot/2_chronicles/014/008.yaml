  text: וַ/יֵּצֵ֨א אֲלֵי/הֶ֜ם זֶ֣רַח הַ/כּוּשִׁ֗י בְּ/חַ֨יִל֙ אֶ֣לֶף אֲלָפִ֔ים וּ/מַרְכָּב֖וֹת שְׁלֹ֣שׁ מֵא֑וֹת וַ/יָּבֹ֖א עַד מָרֵשָֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/008.yaml
  text: Zerah the Cushite came out against them with an army of a thousand thousands and three hundred chariots[b][a], and he came as far as Mareshah.
translation:
  language: te
  text: కూషీయుడైన జెరహు వెయ్యి వేల సైన్యంతో[a], మూడు వందల రథాలతో వారిమీదికి బయలుదేరాడు; అతడు మారేషా వరకు వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘వెయ్యి వేలు’; ‘పది లక్షలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא אֲלֵיהֶם
  choice: వారిమీదికి బయలుదేరి వచ్చాడు
  rationale: యుద్ధ సందర్భంలో יצא బయలుదేరడాన్ని, אֲלֵיהֶם శత్రుభావంతో వారిమీదికి రావడాన్ని సూచిస్తాయి. తెలుగు వాక్యం ఈ సైనిక కదలికను సహజంగా తెలియజేస్తుంది.
- source_word: זֶרַח הַכּוּשִׁי
  choice: కూషీయుడైన జెరహు
  rationale: כּוּשִׁי అనే హెబ్రీ జాతి-భౌగోళిక పదాన్ని సంప్రదాయ వ్యాఖ్యానమైన ‘ఇథియోపీయుడు’గా మార్చకుండా ‘కూషీయుడు’గా ఉంచింది.
- source_word: בְּחַיִל
  choice: సైన్యంతో
  rationale: ఈ సందర్భంలో חַיִל సంపద లేదా పరాక్రమం కాక సైనిక బలగాన్ని సూచిస్తుంది.
- source_word: אֶלֶף אֲלָפִים
  choice: వెయ్యి వేలమంది
  rationale: మూలంలోని ‘వెయ్యి వేలు’ అనే నిర్మాణాన్ని నిలిపి, అది సైనికుల సంఖ్య అని తెలుగులో స్పష్టం చేసింది; నేరుగా ‘పది లక్షలు’ అని మార్చడం వల్ల కలిగే అధిక వ్యాఖ్యానాన్ని నివారించింది.
- source_word: וּמַרְכָּבוֹת שְׁלֹשׁ מֵאוֹת
  choice: మూడు వందల రథాలతో
  rationale: సంఖ్యను, రథాలను మూలార్థానికి అనుగుణంగా సహజమైన తెలుగు పదక్రమంలో ఇచ్చింది.
- source_word: וַיָּבֹא עַד מָרֵשָׁה
  choice: అతడు మారేషా వరకు వచ్చాడు
  rationale: עַד లోని ‘వరకు’ అనే సరిహద్దు భావాన్ని కేవలం ‘మారేషాకు వచ్చాడు’ అని కుదించకుండా నిలిపింది.
