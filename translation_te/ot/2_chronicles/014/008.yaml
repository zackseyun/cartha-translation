translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘కూషీయుడు’ మూలంలోని జాతి-భౌగోళిక పదాన్ని నిలుపుతుంది. సంఖ్య విషయంలో మూలరూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, అంకగణిత సమానార్థాన్ని పాదటిప్పణిలో ఇచ్చింది.
