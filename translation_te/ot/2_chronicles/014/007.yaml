id: 2CH.14.7
reference: 2 Chronicles 14:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י לְ/אָסָ֗א חַיִל֮ נֹשֵׂ֣א צִנָּ֣ה וָ/רֹמַח֒ מִֽ/יהוּדָה֙ שְׁלֹ֣שׁ מֵא֣וֹת אֶ֔לֶף וּ/מִ/בִּנְיָמִ֗ן נֹשְׂאֵ֤י מָגֵן֙ וְ/דֹ֣רְכֵי קֶ֔שֶׁת מָאתַ֥יִם וּ/שְׁמוֹנִ֖ים אָ֑לֶף כָּל אֵ֖לֶּה גִּבּ֥וֹרֵי חָֽיִלס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/007.yaml
  text: And Asa had an army of three hundred thousand from Judah bearing large shields and spears[a], and from Benjamin two hundred eighty thousand bearing shields and drawing bows. All these were mighty men of valor.
translation:
  language: te
  text: 'ఆసాకు ఒక సైన్యం ఉండేది: యూదా నుండి పెద్ద డాళ్లు, ఈటెలు పట్టిన మూడు లక్షల మంది; బెన్యామీను నుండి డాళ్లు పట్టి విల్లులను ఎక్కుపెట్టే రెండు లక్షల ఎనభై వేల మంది. వీరందరూ పరాక్రమవంతులైన యోధులు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַיִל
  choice: సైన్యం
  rationale: ఈ సైనిక లెక్క సందర్భంలో ఈ పదం సంపదను లేదా వ్యక్తిగత పరాక్రమాన్ని కాక, ఆసాకు చెందిన సైనిక బలగాన్ని సూచిస్తుంది.
- source_word: נֹשֵׂא צִנָּה וָרֹמַח
  choice: పెద్ద డాళ్లు, ఈటెలు ధరించిన
  rationale: נֹשֵׂא ఆయుధాలతో సన్నద్ధంగా ఉండడాన్ని సూచిస్తుంది. צִנָּה పెద్ద శరీర డాలు; అందువల్ల తరువాతి מָגֵןతో ఉన్న భేదాన్ని ‘పెద్ద డాళ్లు’ అని కొంతవరకు నిలిపాము. רֹמַחను సాధారణంగా అర్థమయ్యే ‘ఈటెలు’గా అనువదించాము.
- source_word: מִיהוּדָה
  choice: యూదా నుండి
  rationale: מִן సైనికుల గోత్ర మూలాన్ని సూచిస్తుంది; ‘నుండి’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: మూడు లక్షల మంది
  rationale: హీబ్రూ సంఖ్యను తెలుగు సంఖ్యా వాడుకకు అనుగుణంగా నేరుగా అందించాము; లెక్కించబడినవారు సైనికులు కాబట్టి ‘మంది’ చేర్చాము.
- source_word: נֹשְׂאֵי מָגֵן
  choice: డాళ్లు ధరించి
  rationale: מָגֵן సాధారణ డాలు; ముందు ఉన్న పెద్ద צִנָּהతో భేదం కనిపించేలా ఇక్కడ ‘డాళ్లు’ మాత్రమే వాడాము.
- source_word: וְדֹרְכֵי קֶשֶׁת
  choice: విల్లు ఎక్కుపెట్టే
  rationale: ఈ హీబ్రూ ప్రయోగం అక్షరార్థంగా విల్లును వంచి సిద్ధం చేయడాన్ని సూచించి, విలుకాండ్రను వర్ణిస్తుంది. ‘విల్లు ఎక్కుపెట్టే’ అనేది ఆ చర్యను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מָאתַיִם וּשְׁמוֹנִים אָלֶף
  choice: రెండు లక్షల ఎనభై వేల మంది
  rationale: హీబ్రూ సంఖ్యను ఆధునిక తెలుగు సంఖ్యా పద్ధతిలో నేరుగా అనువదించాము.
- source_word: כָּל אֵלֶּה
  choice: వీరందరూ
  rationale: ముందు పేర్కొన్న సైనికులందరినీ సంక్షిప్తంగా సూచించే సహజమైన తెలుగు రూపం.
- source_word: גִּבּוֹרֵי חָיִל
  choice: పరాక్రమశాలి యోధులు
  rationale: ఈ స్థిర సైనిక పదబంధం బలమూ శౌర్యమూ గల పోరాట యోధులను సూచిస్తుంది. ‘పరాక్రమశాలి యోధులు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి సైనిక భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: גִּבּוֹרֵי חָיִלలోని లింగసూచక సైనిక భావం
  choice: పరాక్రమశాలి యోధులు
  alternative: పరాక్రమవంతులైన పురుషులు
  rationale: ప్రాచీన సైనిక లెక్కలో వీరు పురుష సైనికులే అయినప్పటికీ, తెలుగులో ‘యోధులు’ సందర్భానుసారంగా వారిని స్పష్టంగా సూచిస్తుంది; అనవసరంగా ‘పురుషులు’ చేర్చకుండా మూలంలోని సైనిక పదబంధపు ప్రధాన భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘డాలు’ అనే సుపరిచిత ఆయుధపదాన్ని వాడి, צִנָּה/מָגֵן మధ్య భేదాన్ని ‘పెద్ద డాళ్లు’/‘డాళ్లు’గా చూపించాము.
