  text: וַ/יִּקְרָ֨א אָסָ֜א אֶל יְהוָ֣ה אֱלֹהָי/ו֮ וַ/יֹּאמַר֒ יְהוָ֗ה אֵֽין עִמְּ/ךָ֤ לַ/עְזוֹר֙ בֵּ֥ין רַב֙ לְ/אֵ֣ין כֹּ֔חַ עָזְרֵ֜/נוּ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ כִּֽי עָלֶ֣י/ךָ נִשְׁעַ֔נּוּ וּ/בְ/שִׁמְ/ךָ֣ בָ֔אנוּ עַל הֶ/הָמ֖וֹן הַ/זֶּ֑ה יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ אַ֔תָּה אַל יַעְצֹ֥ר עִמְּ/ךָ֖ אֱנֽוֹשׁ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/010.yaml
  text: And Asa cried out to Yahweh his God and said[a], “Yahweh, there is none besides you to help between the mighty and the powerless. Help us, Yahweh our God, for we rely on you, and in your name we have come against this multitude. Yahweh our God, you are our God[b]; do not let man prevail against you.”
translation:
  language: te
  text: 'ఆసా తన దేవుడైన యాహ్వేకు మొరపెట్టి ఇలా అన్నాడు: “యాహ్వే, బలవంతులకైనా శక్తిలేనివారికైనా సహాయం చేయడానికి నీవు తప్ప మరెవరూ లేరు.[a] మా దేవుడైన యాహ్వే, మాకు సహాయం చేయి. ఎందుకంటే మేము నిన్ను ఆశ్రయించాము; నీ నామంలోనే ఈ జనసమూహానికి ఎదురు వచ్చాము. యాహ్వే, నీవే మా దేవుడవు. మర్త్యుడు నీకు ఎదురు నిలవనివ్వకు.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అనేక బలగాలు ఉన్నవారికైనా బలం లేనివారికైనా సహాయం చేయడంలో నీకు తేడా లేదు.” ఈ హీబ్రూ వాక్యభాగం సంక్షిప్తంగా, సందిగ్ధంగా ఉంది; ఇది సంఖ్యనుగానీ బలాన్నిగానీ ప్రధానంగా సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “మర్త్యుడు నీపై పైచేయి సాధించనివ్వకు” / “మర్త్యుడు నీకు ఎదురు తన బలాన్ని నిలుపుకోనివ్వకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: మొరపెట్టి
  rationale: దేవునికి చేసే అత్యవసర ప్రార్థన సందర్భంలో קרא אל అనే పదబంధం కేవలం ‘పిలిచాడు’ అనే అర్థం కాక, సహాయం కోసం మొరపెట్టడాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని వ్యక్తిగత నామరూపాన్ని తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֱלֹהָיו / אֱלֹהֵינוּ
  choice: తన దేవుడు / మా దేవుడు
  rationale: హీబ్రూ స్వామ్య ప్రత్యయాలను సహజమైన తెలుగు ప్రార్థనా భాషలో యథాతథంగా నిలిపింది.
- source_word: אֵין עִמְּךָ לַעְזוֹר
  choice: సహాయం చేయడానికి నీవు తప్ప మరెవరూ లేరు
  rationale: దైవ సహాయం యొక్క ప్రత్యేకతను తెలిపే కఠినమైన హీబ్రూ ప్రయోగానికి సహజమైన తెలుగు రూపం; వేరొక సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: בֵּין רַב לְאֵין כֹּחַ
  choice: బలవంతుడికీ శక్తిలేనివాడికీ మధ్య
  rationale: רַב సంఖ్యనో బలాన్నో సూచించగలదు; యుద్ధ సందర్భంలో ప్రధాన పాఠం బలం–బలహీనత మధ్య వ్యత్యాసాన్ని ఉంచుతుంది, కాని సంఖ్యాపరమైన భావాన్ని పాదటిప్పణిలో కాపాడుతుంది.
- source_word: עָזְרֵנוּ
  choice: మాకు సహాయం చేయి
  rationale: ప్రథమ పురుష బహువచన ప్రత్యయంతో ఉన్న ప్రత్యక్ష ఆజ్ఞను స్పష్టంగా, సహజంగా అనువదించింది.
- source_word: כִּי עָלֶיךָ נִשְׁעַנּוּ
  choice: ఎందుకంటే మేము నిన్నే నమ్ముకున్నాం
  rationale: ‘నీపై ఆనుకున్నాం’ అనే మూల రూపకంలోని ఆధారపడే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘నిన్నే’ విశ్వాసం యొక్క కేంద్రీకరణను తెలియజేస్తుంది.
- source_word: וּבְשִׁמְךָ בָאנוּ
  choice: నీ నామంలోనే ... వచ్చాం
  rationale: దేవుని అధికారంపై, సహాయంపై ఆధారపడి కార్యానికి రావడం అనే బైబిలీయ నుడికారాన్ని నిలిపింది.
- source_word: הֶהָמוֹן הַזֶּה
  choice: ఈ జనసమూహం
  rationale: הָמוֹן సూచించే పెద్ద సమూహాన్ని అనవసరంగా ‘సైన్యం’ అని విశదీకరించకుండా, సందర్భానికి తగిన సాధారణ పదంతో అందించింది.
- source_word: אַל יַעְצֹר עִמְּךָ אֱנוֹשׁ
  choice: మర్త్య మానవుడు నీకు ఎదురు నిలవనివ్వకు
  rationale: అర్థనిర్ణయం కష్టమైన עצרను యుద్ధ సందర్భంలో ‘ఎదురు నిలుచుట’గా తీసుకుంది; אֱנוֹשׁలోని మానవ బలహీనత, మరణశీలత భావాన్ని ‘మర్త్య మానవుడు’ నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది; కాబట్టి దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- issue: אֵין עִמְּךָ לַעְזוֹר అనే సందిగ్ధ ప్రయోగం
  choice: సహాయం చేయడానికి నీవు తప్ప మరెవరూ లేరు
  alternative: అనేకమందితోనైనా శక్తిలేనివారితోనైనా సహాయం చేయడం నీకు సమానమే
  rationale: ప్రధాన పాఠం దేవుడు మాత్రమే నిజమైన సహాయకుడు అనే భావాన్ని అనుసరిస్తుంది; అయితే దేవునికి బలగాల సంఖ్యతో సంబంధం లేకుండా సహాయం చేయడం సాధ్యమే అనే పఠనాన్ని పాదటిప్పణిలో నిలిపింది.
- issue: אֱנוֹשׁ యొక్క ఏకవచన సాధారణ మానవ సూచన
  choice: మర్త్య మానవుడు
  alternative: మనుషులు / ఎవరూ
  rationale: మూలంలోని ఏకవచన సాధారణ ప్రయోగాన్నీ, మానవుని మరణశీలతను సూచించే భావాన్నీ కాపాడింది.
- issue: עצר యొక్క సందర్భానుసార అర్థం
  choice: ఎదురు నిలుచుట
  alternative: పైచేయి సాధించుట / బలం నిలుపుకొనుట
  rationale: యుద్ధ ప్రార్థనలో మానవుడు దేవునికి ప్రతిఘటించకూడదనే భావం సహజంగా సరిపోతుంది; పదానికి ఉన్న ఇతర సాధ్యమైన సూక్ష్మార్థాలను పాదటిప్పణిలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభమైన ప్రార్థనా శైలిని వాడింది. ‘యాహ్వే’ అనే దైవనామాన్ని ప్రతిసారి ఒకే విధంగా ఉంచింది. మూలంలోని రెండు ముఖ్యమైన సందిగ్ధతలను ప్రధాన పాఠంలో అతిగా పరిష్కరించకుండా పాదటిప్పణుల్లో స్పష్టంగా సంరక్షించింది.
