source:
  edition: WLC
  text: וַ/יֵּצֵ֥א אָסָ֖א לְ/פָנָ֑י/ו וַ/יַּֽעַרְכוּ֙ מִלְחָמָ֔ה בְּ/גֵ֥יא צְפַ֖תָה לְ/מָרֵשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/009.yaml
  text: And Asa went out before him[b][a], and they drew up for battle in the Valley of Zephathah at Mareshah.
translation:
  language: te
  text: ఆసా అతని ఎదుటికి బయలుదేరాడు[a]. వారు మారేషా వద్దనున్న సెఫాతా లోయలో యుద్ధ శ్రేణులు ఏర్పాటు చేసుకున్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతన్ని కలుసుకోవడానికి’ లేదా ‘అతన్ని ఎదుర్కోవడానికి.’ హీబ్రూ పదబంధానికి అక్షరార్థం ‘అతని ముందు/ఎదుట’; ఈ సందర్భంలో ఆసా ప్రత్యర్థి సైన్యాన్ని ఎదుర్కోవడానికి బయలుదేరాడనే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వారు యుద్ధ శ్రేణిలో నిలబడ్డారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: బయలుదేరాడు
  rationale: יצא అనే క్రియ కథన సందర్భంలో ‘బయలుదేరు/వెల్లిపోవు’ అని అర్థమిస్తుంది; సైనిక కదలికను సూచించే ఈ సందర్భంలో ‘బయలుదేరాడు’ సహజంగా ఉండి, మూలంలో లేని అదనపు భావాన్ని చేర్చదు.
- source_word: לְפָנָיו
  choice: అతని ఎదుటికి
  rationale: ఈ పదబంధానికి అక్షరార్థంగా ‘అతని ముందు/ఎదుట’ అనే భావం ఉంది. సందర్భంలో శత్రుసేనను ఎదుర్కోవడానికి వెళ్లడాన్ని సూచించినా, ప్రధాన పాఠంలో మూలంలోని వ్యక్తీకరణను, దాని స్వల్ప అస్పష్టతను నిలిపేందుకు ‘అతని ఎదుటికి’ అని అనువదించాం.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: వారు ... యుద్ధానికి పంక్తులు తీర్చారు
  rationale: ערך + מלחמה సైన్యాలను యుద్ధ క్రమంలో అమర్చడాన్ని తెలిపే ప్రయోగం. ‘యుద్ధానికి పంక్తులు తీర్చారు’ ఆధునిక తెలుగులో సైనిక వ్యూహరచన భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: בְּגֵיא
  choice: లోయలో
  rationale: גיא అంటే లోయ లేదా కనుమ. స్థలనామంతో కలిసిన ఈ సందర్భంలో ‘లోయ’ సాధారణ పాఠకులకు స్పష్టమైన, ప్రామాణిక పదం.
- source_word: צְפַתָה
  choice: జెఫాతా
  rationale: ఇది స్థలనామం; హీబ్రూ ఉచ్చారణను తెలుగు లిపిలో సాధ్యమైనంత సహజంగా లిప్యంతరీకరించాం.
- source_word: לְמָרֵשָׁה
  choice: మారేషా వద్దనున్న
  rationale: స్థలనామానికి ముందు ఉన్న ל ఇక్కడ మారేషాతో భౌగోళిక సంబంధాన్ని సూచిస్తుంది. ‘మారేషా వద్దనున్న’ అనే రూపం జెఫాతా లోయ స్థానాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘మారేషాలో’ లేదా ‘మారేషా సమీపంలో’ అనే అర్థాలూ సాధ్యమే.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. సైనిక సందర్భాన్ని స్పష్టంగా ఉంచుతూ, לְפָנָיו లోని అక్షరార్థం మరియు సందర్భార్థం మధ్య ఉన్న ఉద్వేగాన్ని ప్రధాన పాఠం–పాదసూచికల ద్వారా నిలిపాం.
