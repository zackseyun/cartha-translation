- from: ఆసా అతని ఎదుటికి బయలుదేరాడు[a]. వారు మారేషా వద్దనున్న జెఫాతా లోయలో యుద్ధానికి పంక్తులు తీర్చారు[b].
  to: ఆసా అతని ఎదుటికి బయలుదేరాడు[a]. వారు మారేషా వద్దనున్న సెఫాతా లోయలో యుద్ధ శ్రేణులు ఏర్పాటు చేసుకున్నారు[b].
  rationale: The revision corrects the transliteration of Zephathah in accordance with the Hebrew source and replaces a less idiomatic formation expression with natural Telugu that still conveys the military sense of arranging for battle. The contextual ambiguity of ‘before him’ is retained in the text and documented by footnote a.
