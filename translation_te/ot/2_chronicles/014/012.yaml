id: 2CH.14.12
reference: 2 Chronicles 14:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּרְדְּפֵ֨/ם אָסָ֜א וְ/הָ/עָ֣ם אֲשֶׁר עִמּ/וֹ֮ עַד לִ/גְרָר֒ וַ/יִּפֹּ֤ל מִ/כּוּשִׁים֙ לְ/אֵ֣ין לָ/הֶ֣ם מִֽחְיָ֔ה כִּֽי נִשְׁבְּר֥וּ לִ/פְנֵֽי יְהוָ֖ה וְ/לִ/פְנֵ֣י מַחֲנֵ֑/הוּ וַ/יִּשְׂא֥וּ שָׁלָ֖ל הַרְבֵּ֥ה מְאֹֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/012.yaml
  text: Asa and the people who were with him pursued them as far as Gerar[a], and the Cushites fell until none remained alive, for they were shattered before Yahweh and before his army[b]. Then they carried off a very great amount of plunder.
translation:
  language: te
  text: ఆసా, అతనితో ఉన్న ప్రజలతో కలిసి, వారిని గెరారు వరకు తరుముకుంటూ వెళ్లారు. కూషీయులు పడిపోయారు; వారిలో ప్రాణాలతో మిగిలినవారు ఎవరూ లేకుండాపోయారు. ఎందుకంటే వారు యాహ్వే ఎదుటా, అతని సైన్యం ఎదుటా చిత్తయ్యారు. తరువాత వారు చాలా ఎక్కువ దోపుడు సొమ్మును తీసుకువెళ్లారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְדְּפֵם
  choice: వారిని తరుముకుంటూ వెళ్లారు
  rationale: רדף యుద్ధ సందర్భంలో వెంబడించడాన్ని సూచిస్తుంది; ‘తరుముకుంటూ వెళ్లారు’ ఆధునిక తెలుగులో సహజంగా ఆ కొనసాగిన చర్యను తెలియజేస్తుంది.
- source_word: עַד לִגְרָר
  choice: గెరారు వరకు
  rationale: עַד స్థలంతో కలిసినప్పుడు వెంబడింపు చేరిన హద్దును సూచిస్తుంది.
- source_word: מִכּוּשִׁים
  choice: కూషీయుల్లో
  rationale: מן‌తో కూడిన כּוּשִׁים కూషు ప్రజలలో సంభవించిన ప్రాణనష్టాన్ని సూచిస్తుంది; చారిత్రక భౌగోళిక పేరును నేరుగా నిలుపుకుంది.
- source_word: לְאֵין לָהֶם מִחְיָה
  choice: ప్రాణాలతో మిగిలినవారు ఎవరూ లేకుండా
  rationale: జీవించి తప్పించుకున్నవారు లేరనే హీబ్రూ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נִשְׁבְּרוּ
  choice: చిత్తయ్యారు
  rationale: שבר నిఫాల్ రూపం ఇక్కడ నిర్ణాయకమైన సైనిక పతనాన్ని సూచిస్తుంది; ‘చిత్తయ్యారు’ హీబ్రూ రూపక బలాన్ని సహజంగా అందిస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే ఎదుట
  rationale: దైవ నామాన్ని వ్యక్తిగత ఒడంబడిక నామంగా లిప్యంతరీకరించి, לִפְנֵי యొక్క సమక్షం/శక్తి ముందు అనే ఉద్వేగాన్ని నిలుపుకుంది.
- source_word: וְלִפְנֵי מַחֲנֵהוּ
  choice: ఆసా సైన్యం ఎదుట
  rationale: מַחֲנֶה యుద్ధ సందర్భంలో క్రియాశీల సైనిక దళాన్ని సూచించగలదు. ప్రధాన పాఠ్యంలో ప్రత్యయం ఆసాను సూచిస్తుందని తీసుకున్నాం; ఇతర అవకాశాన్ని పాదసూచికలో నిలిపాం.
- source_word: וַיִּשְׂאוּ שָׁלָל הַרְבֵּה מְאֹד
  choice: అపారమైన దోపుడు సొమ్మును తీసుకువెళ్లారు
  rationale: נשא + שלל స్వాధీనం చేసుకున్న వస్తువులను తీసుకుపోవడాన్ని సూచిస్తుంది; הרבה מאד యొక్క తీవ్రమైన సమృద్ధిని ‘అపారమైన’ తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలోని వ్యక్తిగత దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధ్యమైన హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- issue: מַחֲנֵהוּ లోని ఏకవచన ప్రత్యయం ఎవరిని సూచిస్తుంది?
  choice: ఆసా సైన్యం
  alternative: యాహ్వే సైన్యం లేదా ఆయన శిబిరం
  rationale: కథనంలోని మానవ సైనిక దళం ఆసాతో ఉన్న ప్రజలే కావడం వల్ల ప్రధాన పాఠ్యంలో ఆసాను సూచించేలా చేశాం. అయితే హీబ్రూ ప్రత్యయం స్వతహాగా స్పష్టంగా లేనందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘చిత్తయ్యారు,’ ‘దోపుడు సొమ్ము’ వంటి పదాలు సాధారణ పాఠకులకు స్పష్టంగా ఉండి యుద్ధ సందర్భపు బలాన్ని నిలుపుతాయి. మూలంలో అస్పష్టమైన మַחֲנֵהוּ భావాన్ని ప్రధాన పాఠ్యం మరియు పాదసూచిక కలిపి సంరక్షించాయి.
