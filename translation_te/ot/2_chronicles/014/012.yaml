  to: ఆసా, అతనితో ఉన్న ప్రజలతో కలిసి, వారిని గెరారు వరకు తరుముకుంటూ వెళ్లారు. కూషీయులు పడిపోయారు; వారిలో ప్రాణాలతో మిగిలినవారు ఎవరూ లేకుండాపోయారు. ఎందుకంటే వారు యాహ్వే ఎదుటా, అతని సైన్యం ఎదుటా చిత్తయ్యారు. తరువాత వారు చాలా ఎక్కువ దోపుడు సొమ్మును తీసుకువెళ్లారు.
  rationale: సవరణ మూలంలోని కథనప్రవాహాన్ని, కూషీయుల సంపూర్ణ ఓటమిని, యాహ్వే ముందు జరిగిన పరాజయాన్ని, మరియు విస్తారమైన దోపుడు సొమ్మును నిలుపుతుంది. అదే సమయంలో మַחֲנֵהוּలో ఉన్న సూచ్య-అస్పష్టతను ‘అతని సైన్యం’ మరియు పాదసూచిక ద్వారా భద్రపరుస్తుంది; చివరి బహువచనాన్ని కూడా మూలానికి అనుగుణంగా ఉంచుతుంది.
