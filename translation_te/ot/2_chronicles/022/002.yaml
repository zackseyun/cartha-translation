source:
  edition: WLC
  text: בֶּן אַרְבָּעִ֨ים וּ/שְׁתַּ֤יִם שָׁנָה֙ אֲחַזְיָ֣הוּ בְ/מָלְכ֔/וֹ וְ/שָׁנָ֣ה אַחַ֔ת מָלַ֖ךְ בִּֽ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ עֲתַלְיָ֖הוּ בַּת עָמְרִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/002.yaml
  text: Ahaziah was forty-two years old when he became king[a], and he reigned one year in Jerusalem. His mother’s name was Athaliah[b], the daughter of Omri.
translation:
  language: te
  text: అహజ్యా రాజైనప్పుడు అతనికి నలభై రెండు సంవత్సరాలు[a]. అతడు యెరూషలేములో ఒక సంవత్సరం పరిపాలించాడు. అతని తల్లి పేరు అతల్యా[b]; ఆమె ఒమ్రీ కుమార్తె.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘నలభై రెండు సంవత్సరాలు’ అని ఉంది. సమాంతర వృత్తాంతమైన 2 రాజులు 8:26లో ‘ఇరవై రెండు సంవత్సరాలు’ అని ఉంది. అందువల్ల కొందరు దీనిని పాఠసంబంధ సమస్యగా భావిస్తారు; మరికొందరు ఈ సంఖ్యను వేరొక విధమైన కాలగణనగా అర్థం చేసుకోవాలని ప్రతిపాదిస్తారు.
    reason: textual_variant
  - marker: b
    text: లేదా ‘ఒమ్రీ వంశస్థురాలు.’ హీబ్రూలో ‘కుమార్తె’ అనే పదం కొన్నిసార్లు స్త్రీ వంశస్థురాలిని విస్తృత అర్థంలో సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים וּשְׁתַּיִם שָׁנָה
  choice: అతనికి నలభై రెండు సంవత్సరాలు
  rationale: హీబ్రూ వయస్సు సూచించే నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; మూలపాఠంలోని ‘నలభై రెండు’ను యథాతథంగా నిలుపుతుంది.
- source_word: בְמָלְכוֹ
  choice: రాజైనప్పుడు
  rationale: בְ ఉపసర్గతో కూడిన రూపం రాజ్యారంభ సమయాన్ని సూచిస్తుంది; ‘రాజైనప్పుడు’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: וְשָׁנָה אַחַת מָלַךְ
  choice: అతడు ... ఒక సంవత్సరం పరిపాలించాడు
  rationale: పాలనాకాలాన్ని తెలిపే హీబ్రూ వాక్యాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది; ‘ఒక’ అనే సంఖ్యను నిలుపుతుంది.
- source_word: בִּירוּשָׁלָם
  choice: యెరూషలేములో
  rationale: స్థలార్థక בְను తెలుగు విభక్తి ‘లో’తో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְשֵׁם אִמּוֹ
  choice: అతని తల్లి పేరు
  rationale: రాజవంశ వృత్తాంతాల్లోని సూత్రబద్ధమైన హీబ్రూ మాటను స్పష్టమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: עֲתַלְיָהוּ
  choice: అతల్యా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో సాధారణంగా గుర్తించదగిన లిప్యంతరీకరణ.
- source_word: בַּת עָמְרִי
  choice: ఒమ్రీ కుమార్తె
  rationale: בַּת అనే పదం యొక్క ప్రత్యక్ష అర్థమైన ‘కుమార్తె’ను ప్రధాన పాఠంలో నిలుపుతుంది; విస్తృత వంశార్థాన్ని పాదటిప్పణిలో ఉంచుతుంది.
theological_decisions:
- issue: అహజ్యా రాజ్యారంభ వయస్సులో కాలక్రమ సంబంధమైన ఉద్రిక్తత
  choice: ప్రధాన పాఠంలో మసొరెటిక్ పాఠంలోని ‘నలభై రెండు సంవత్సరాలు’ను నిలుపడం
  alternative: 2 రాజులు 8:26 ప్రకారం ‘ఇరవై రెండు సంవత్సరాలు’; లేదా ఈ సంఖ్యను ఒమ్రీ వంశపు కాలగణనతో ఏదో విధంగా అనుసంధానించడం
  rationale: ఇచ్చిన WLC హీబ్రూ పాఠం ‘నలభై రెండు’ అని చదువుతుంది. సమాంతర వాక్యంతో సమన్వయం చేయడానికి మూలాన్ని మౌనంగా సవరించకుండా, పాఠభేద సమస్యను పాదటిప్పణిలో తెలియజేయడం సముచితం.
- issue: ‘ఒమ్రీ కుమార్తె’ అనే బంధుత్వ పదబంధం యొక్క పరిధి
  choice: ప్రధాన పాఠంలో ‘ఒమ్రీ కుమార్తె’ అని అనువదించడం
  alternative: ‘ఒమ్రీ వంశస్థురాలు’ లేదా ‘ఒమ్రీ మనుమరాలు’
  rationale: హీబ్రూ పాఠం సాధారణ బంధుత్వ పదమైన בַּתను ఉపయోగిస్తుంది. వంశసంబంధ ప్రశ్నను అనువాదంలో ముందుగానే పరిష్కరించకుండా ప్రత్యక్ష అర్థాన్ని ఉంచి, విస్తృత అర్థసాధ్యతను పాదటిప్పణిలో సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక వృత్తాంత శైలి. ‘పరిపాలించాడు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ఎంచుకోబడింది. మూలపాఠంలోని కాలక్రమ, వంశసంబంధ ఉద్రిక్తతలను ప్రధాన పాఠంలో మౌనంగా పరిష్కరించకుండా పాదటిప్పణుల్లో వెల్లడించాం.
