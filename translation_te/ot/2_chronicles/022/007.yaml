source:
  edition: WLC
  text: וּ/מֵֽ/אֱלֹהִ֗ים הָיְתָה֙ תְּבוּסַ֣ת אֲחַזְיָ֔הוּ לָ/ב֖וֹא אֶל יוֹרָ֑ם וּ/בְ/בֹא֗/וֹ יָצָ֤א עִם יְהוֹרָם֙ אֶל יֵה֣וּא בֶן נִמְשִׁ֔י אֲשֶׁ֣ר מְשָׁח֣/וֹ יְהוָ֔ה לְ/הַכְרִ֖ית אֶת בֵּ֥ית אַחְאָֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/007.yaml
  text: Ahaziah’s downfall[a], by his going to Joram, was from God; and when he came, he went out with Jehoram to Jehu son of Nimshi, whom Yahweh had anointed to cut off the house of Ahab.
translation:
  language: te
  text: యోరాము దగ్గరికి వెళ్లడం ద్వారా అహజ్యాకు కలిగిన పతనం దేవుని నుంచే వచ్చింది. అతడు అక్కడికి చేరుకున్నప్పుడు, యెహోరాముతో కలిసి నింషీ కుమారుడైన యేహూ దగ్గరికి బయలుదేరాడు[a]. అహాబు వంశాన్ని నిర్మూలించడానికి యాహ్వే యేహూను అభిషేకించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యెహోరాముతో కలిసి యేహూతో పోరాడడానికి బయలుదేరాడు”; లేదా “యెహోరాముతో కలిసి యేహూను ఎదుర్కోవడానికి వెళ్లాడు.” హీబ్రూ అక్షరార్థంగా “యేహూ దగ్గరికి” అని చెబుతుంది, అయితే సందర్భం ఇది శత్రుత్వపూర్వకమైన ఎదురుకావడమని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵאֱלֹהִים
  choice: దేవుని నుంచే వచ్చింది
  rationale: מִן దేవుడే ఆ పతనానికి మూలమని సూచిస్తుంది. ఈ అనువాదం దైవిక కారణాన్ని స్పష్టంగా ఉంచుతుంది; అయితే అది దేవుని ప్రత్యక్ష నిర్ణయమా, అనుమతా అనే విషయాన్ని అదనంగా నిర్ధారించదు.
- source_word: תְּבוּסַת אֲחַזְיָהוּ
  choice: అహజ్యాకు కలిగిన పతనం
  rationale: תְּבוּסָה తొక్కివేత, ఓటమి, వినాశకరమైన పతనం అనే భావాలను కలిగి ఉంది. సందర్భానికి సహజంగా ఉండి దాని విస్తృత భావాన్ని నిలుపుకోవడానికి ‘పతనం’ ఎంచుకున్నాం.
- source_word: לָבוֹא אֶל יוֹרָם
  choice: యోరాము దగ్గరికి వెళ్లడం ద్వారా
  rationale: לతో కూడిన క్రియార్థక రూపం అహజ్యా పతనంతో అతని ప్రయాణానికి ఉన్న సందర్భాత్మక/కారణ సంబంధాన్ని సూచిస్తుంది. ‘ద్వారా’ ఆ సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וּבְבֹאוֹ
  choice: అతడు అక్కడికి చేరుకున్నప్పుడు
  rationale: בతో కూడిన క్రియార్థక రూపం ఇక్కడ కాలాన్ని సూచిస్తుంది. తెలుగులో సూచిత గమ్యాన్ని స్పష్టంగా తెలియజేయడానికి ‘అక్కడికి’ వాడాం.
- source_word: יָצָא עִם יְהוֹרָם אֶל יֵהוּא
  choice: యెహోరాము ... యేహూ దగ్గరికి బయలుదేరగా అతనితో కలిసి వెళ్లాడు
  rationale: יָצָא సైనిక సందర్భంలోనూ ‘బయలుదేరు’ అని అర్థమవుతుంది; אֶל అక్షరార్థంగా ‘దగ్గరికి/వైపు’ అని సూచిస్తుంది. ప్రధాన పాఠంలో తటస్థ రూపాన్ని ఉంచి, సందర్భం సూచించే శత్రుత్వ భావాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: יוֹרָם / יְהוֹרָם
  choice: యోరాము / యెహోరాము
  rationale: మూలపాఠంలో ఒకే రాజు పేరుకు కనిపించే రెండు రూపాలను సమన్వయం చేయకుండా తెలుగులోనూ వేర్వేరుగా నిలిపాం.
- source_word: מְשָׁחוֹ
  choice: యేహూను అభిషేకించాడు
  rationale: అభిషేకం ఈ సంఘటనకు ముందే జరిగినదని వాక్యక్రమం స్పష్టం చేస్తుంది. తెలుగులో సాధారణ భూతకాలమే ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన నాలుగు హల్లుల పేరును బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించాం.
- source_word: לְהַכְרִית אֶת בֵּית אַחְאָב
  choice: అహాబు వంశాన్ని నిర్మూలించడానికి
  rationale: הִכְרִית పూర్తిగా తొలగించడం లేదా నాశనం చేయడం అనే భావం ఇస్తుంది. בֵּית అక్షరార్థంగా ‘ఇల్లు’ అయినా ఇక్కడ రాజవంశాన్ని సూచిస్తుంది; అందువల్ల ఆధునిక తెలుగులో ‘వంశం’ సహజంగా ఉంటుంది.
theological_decisions:
- issue: అహజ్యా పతనంలో దేవుని కారణత్వం
  choice: అతని పతనం దేవుని నుంచే వచ్చిందని నేరుగా చెప్పడం
  alternative: దేవుడు దానిని నిర్ణయించాడు లేదా కేవలం అనుమతించాడు అని ప్రత్యేకంగా చెప్పడం
  rationale: హీబ్రూ పతనానికి దేవుడే మూలమని చెబుతుంది; కానీ ఆ కారణత్వం ఏ విధంగా పనిచేసిందో వివరించదు. అందువల్ల ఆ వేదాంత ఉద్రిక్తతను పరిష్కరించకుండా నిలిపాం.
- issue: యేహూ వైపు బయలుదేరడంలోని శత్రుత్వ భావం
  choice: ప్రధాన పాఠంలో ‘యేహూ దగ్గరికి’ అని తటస్థంగా ఉంచడం
  alternative: ‘యేహూతో పోరాడడానికి’ లేదా ‘యేహూను ఎదుర్కోవడానికి’ అని అనువదించడం
  rationale: אֶל స్వయంగా ‘వ్యతిరేకంగా’ అని చెప్పదు; అయితే కథా సందర్భం శత్రుత్వ సమావేశాన్ని సూచిస్తుంది. ఆ భావాన్ని పాదసూచికలో ఉంచడం ద్వారా మూలంలోని అస్పష్టత నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడాం. పేర్లలో మూలపాఠంలోని యోరాము/యెహోరాము భేదాన్ని నిలిపాం; יְהוָהను ‘యాహ్వే’గా లిప్యంతరీకరించాం.
