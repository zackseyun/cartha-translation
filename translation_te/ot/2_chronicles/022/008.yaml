id: 2CH.22.8
reference: 2 Chronicles 22:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֕י כְּ/הִשָּׁפֵ֥ט יֵה֖וּא עִם בֵּ֣ית אַחְאָ֑ב וַ/יִּמְצָא֩ אֶת שָׂרֵ֨י יְהוּדָ֜ה וּ/בְנֵ֨י אֲחֵ֧י אֲחַזְיָ֛הוּ מְשָׁרְתִ֥ים לַ/אֲחַזְיָ֖הוּ וַ/יַּהַרְגֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/008.yaml
  text: And it happened[a], when Jehu was executing judgment on the house of Ahab, that he found the officials of Judah and the sons of Ahaziah’s brothers, serving Ahaziah[b], and he killed them.
translation:
  language: te
  text: 'ఇలా జరిగింది: యెహూ అహాబు ఇంటివారిపై తీర్పు అమలు చేస్తున్నప్పుడు[a], అతడు యూదా అధికారులను, అహజ్యా సోదరుల కుమారులను[b] కనుగొన్నాడు; వారు అహజ్యాకు సేవచేస్తున్నారు. అతడు వారిని చంపాడు.


    [a] లేదా, “యెహూ అహాబు ఇంటివారికి తీర్పు తీర్చుతున్నప్పుడు.”


    [b] హెబ్రీలో, “అహజ్యా సోదరుల కుమారులు”; అంటే, అహజ్యాకు మేనల్లుళ్లు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహూ అహాబు ఇంటివారికి తీర్పు తీర్చుతున్నప్పుడు.”
    reason: שׁפט యొక్క న్యాయనిర్ణయ భావాన్ని మరింత పదానుసారంగా చూపే ప్రత్యామ్నాయం.
  - marker: b
    text: హెబ్రీలో, “అహజ్యా సోదరుల కుమారులు”; అంటే, అహజ్యాకు మేనల్లుళ్లు.
    reason: మూలంలోని బంధుత్వ పదబంధాన్ని నిలుపుతూ సహజ తెలుగు వివరణను అందిస్తుంది.
lexical_decisions:
- source_word: כְּהִשָּׁפֵט
  choice: తీర్పు అమలు చేస్తున్నప్పుడు
  rationale: שׁפט అనే న్యాయపరమైన భావాన్ని, ఈ సందర్భంలోని శిక్షాత్మక చర్యను రెండింటినీ నిలుపుతుంది; కేవలం ‘శిక్షిస్తున్నప్పుడు’ అని చెప్పి భావాన్ని సంకుచితం చేయదు.
- source_word: עִם בֵּית אַחְאָב
  choice: అహాబు ఇంటివారిపై
  rationale: ఇక్కడ עִם ప్రతికూల చర్యకు సంబంధించిన లక్ష్యాన్ని సూచిస్తుంది. ‘ఇంటివారు’ అనే పదం కుటుంబం/రాజవంశం అనే హెబ్రీ నుడికారపు విస్తృతిని నిలుపుతుంది.
- source_word: שָׂרֵי יְהוּדָה
  choice: యూదా అధికారులు
  rationale: שָׂרִים రాజకుమారులు, నాయకులు లేదా ఉన్నతాధికారులను సూచించగలదు; రాజకుమారులకే పరిమితం చేయకుండా రాజసభ-రాజకీయ సందర్భానికి ‘అధికారులు’ సహజంగా సరిపోతుంది.
- source_word: וּבְנֵי אֲחֵי אֲחַזְיָהוּ
  choice: అహజ్యా సోదరుల కుమారులు
  rationale: మూలంలోని బంధుత్వ నిర్మాణాన్ని నేరుగా నిలుపుతుంది; ‘మేనల్లుళ్లు’ అనే సహజ తెలుగు వివరణను పాదసూచికలో ఇస్తుంది.
- source_word: מְשָׁרְתִים לַאֲחַזְיָהוּ
  choice: అహజ్యాకు సేవచేస్తున్న వీరు
  rationale: కొనసాగుతున్న సేవ లేదా పరిచర్య పాత్రను తెలియజేస్తుంది; ఆరాధనా పరిచర్య అనే అర్థాన్ని అనవసరంగా చేర్చదు.
- source_word: וַיַּהַרְגֵם
  choice: వారిని చంపాడు
  rationale: הרג యొక్క సూటి అర్థాన్ని స్పష్టంగా, అనవసరమైన మృదూకరణ లేకుండా అందిస్తుంది.
- source_word: וַיְהִי
  choice: తెలుగు కాలవాక్య నిర్మాణంలో అంతర్లీనంగా వ్యక్తీకరించబడింది
  rationale: హెబ్రీ కథన కొనసాగింపు సూత్రాన్ని పదేపదే ‘ఇలా జరిగింది’ అని భారంగా చేయకుండా, ‘చేస్తున్నప్పుడు’ అనే సహజ తెలుగు నిర్మాణంలో కథన సంఘటనగా అందించింది.
theological_decisions:
- issue: యెహూ చర్యకు న్యాయతీర్పు భాషను వాడటం
  choice: ‘తీర్పు అమలు చేస్తున్నప్పుడు’ అని న్యాయపరమైన భావాన్ని నిలిపి, దేవుడు ప్రతి హత్యను ప్రత్యక్షంగా ఆమోదించాడని అదనంగా చెప్పకపోవడం
  alternative: ‘శిక్షిస్తున్నప్పుడు’ అని మరింత స్పష్టమైన శిక్షాత్మక అర్థం ఇవ్వడం
  rationale: ఈ వచనం యెహూ చర్యను న్యాయతీర్పు భాషలో వర్ణిస్తుంది; అయితే ఈ ఉపవాక్యంలో ప్రతి హత్యపై దేవుని ప్రత్యేక మూల్యాంకనాన్ని స్పష్టంగా ప్రకటించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇంటివారు’ ద్వారా హెబ్రీ కుటుంబ/రాజవంశ నుడికారాన్ని, ‘తీర్పు అమలు’ ద్వారా న్యాయపరమైన ఉద్వేగాన్ని నిలిపింది. డాష్‌ల మధ్య ఉన్న వివరణ మְשָׁרְתִים అనే బహువచన కృదంతం ముందున్న రెండు సమూహాలనూ వర్ణించగల నిర్మాణాన్ని స్పష్టంగా ఉంచుతుంది.
