id: 2CH.22.10
reference: 2 Chronicles 22:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/עֲתַלְיָ֨הוּ֙ אֵ֣ם אֲחַזְיָ֔הוּ רָאֲתָ֖ה כִּ֣י מֵ֣ת בְּנָ֑/הּ וַ/תָּ֗קָם וַ/תְּדַבֵּ֛ר אֶת כָּל זֶ֥רַע הַ/מַּמְלָכָ֖ה לְ/בֵ֥ית יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/010.yaml
  text: Athaliah[a], the mother of Ahaziah, saw that her son was dead, and she arose and destroyed all the royal offspring of the house of Judah.
translation:
  language: te
  text: అహజ్యా తల్లి అతల్యా తన కుమారుడు చనిపోయాడని చూసి, లేచి యూదా వంశానికి చెందిన రాజవంశ సంతానమంతటినీ నాశనం చేసింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హెబ్రీ క్రియారూపం క్లిష్టమైనది; అక్షరార్థంగా అది “మాట్లాడింది” అని ఉంటుంది. అయితే సందర్భం, అలాగే 2 రాజులు 11:1లోని సమాంతర వృత్తాంతం “నాశనం చేసింది” లేదా “చంపించింది” అనే భావానికి మద్దతిస్తాయి.
    reason: textual_variant
lexical_decisions:
- source_word: וַעֲתַלְיָהוּ
  choice: అతల్యా
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం. ఆరంభంలోని וַ־ను ప్రత్యేక కాలసూచక పదంతో అనువదించకుండా తెలుగు కథన ప్రవాహంలో సహజంగా ఉంచాం.
- source_word: אֵם אֲחַזְיָהוּ
  choice: అహజ్యా తల్లి
  rationale: హెబ్రీ సమాస సంబంధాన్ని తెలుగులో సహజమైన స్వామ్య-బంధుత్వ నిర్మాణంతో తెలిపాం.
- source_word: רָאֲתָה כִּי מֵת בְּנָהּ
  choice: తన కుమారుడు చనిపోయాడని చూసి
  rationale: רָאָה + כִּי ఒక వాస్తవాన్ని గ్రహించడం లేదా చూడడాన్ని సూచిస్తుంది. ‘చనిపోయాడని చూసి’ అనేది పూర్తయిన మరణ సంఘటనను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וַתָּקָם
  choice: లేచి
  rationale: ఈ కథన సందర్భంలో קוּם నిర్ణయాత్మక చర్యకు పూనుకోవడాన్ని సూచిస్తుంది; ‘లేచి’ మూలంలోని వరుస చర్యను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וַתְּדַבֵּר
  choice: నాశనం చేసింది
  rationale: లిఖిత రూపం సాధారణంగా ‘మాట్లాడింది’ అనే అర్థాన్ని ఇచ్చినా, ప్రత్యక్ష కర్మగా ‘రాజవంశ సంతానమంతటినీ’ రావడం మరియు 2 రాజులు 11:1లోని సమాంతర వృత్తాంతం ఇక్కడ నిర్మూలన భావాన్ని బలపరుస్తాయి. విధానాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా విస్తృత భావాన్ని నిలిపాం.
- source_word: אֵת כָּל זֶרַע הַמַּמְלָכָה
  choice: రాజవంశ సంతానమంతటినీ
  rationale: זֶרַע అక్షరార్థంగా ‘విత్తనం,’ సందర్భానుసారంగా ‘సంతానం.’ రాజ్యాధికార వంశపరంపరను సూచించేందుకు ‘రాజవంశ సంతానం’ స్పష్టంగా, సహజంగా ఉంది; כָּל భావాన్ని ‘అంతటినీ’ తెలియజేస్తుంది.
- source_word: לְבֵית יְהוּדָה
  choice: యూదా వంశానికి చెందిన
  rationale: ఈ పదబంధం ఆ రాజసంతానం యూదా రాజవంశానికి చెందిందని గుర్తిస్తుంది. ‘వంశానికి చెందిన’ అనేది తెలుగు పాఠకునికి స్పష్టమైన సంబంధ సూచన.
theological_decisions:
- issue: క్లిష్టమైన וַתְּדַבֵּר క్రియారూపం యొక్క అనువాదం
  choice: సందర్భార్థం ప్రకారం ‘నాశనం చేసింది’
  alternative: ‘మాట్లాడింది’ లేదా ‘చంపించే ఏర్పాట్లు చేసింది’
  rationale: మూలంలోని సాధారణ పదార్థాన్ని యాంత్రికంగా అనుసరిస్తే వాక్యంలోని ప్రత్యక్ష కర్మతో అర్థవంతమైన సంబంధం ఏర్పడదు. 2 రాజులు 11:1లోని సమాంతర వృత్తాంతం నిర్మూలన చర్యను సూచిస్తుంది. అయినప్పటికీ పాఠ్య క్లిష్టతను దాచకుండా పాదసూచికలో నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలిని ఉపయోగించాం. అతిగా ప్రాచీనమైన పదజాలాన్ని నివారిస్తూ ‘రాజవంశ సంతానం’ వంటి స్పష్టమైన పదబంధంతో వంశపరమైన భావాన్ని నిలిపాం. పాదసూచిక గుర్తు [a] సంబంధిత క్లిష్ట క్రియ తర్వాత ఉంచబడింది.
