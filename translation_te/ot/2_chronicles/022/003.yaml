source:
  edition: WLC
  text: גַּם ה֣וּא הָלַ֔ךְ בְּ/דַרְכֵ֖י בֵּ֣ית אַחְאָ֑ב כִּ֥י אִמּ֛/וֹ הָיְתָ֥ה יֽוֹעַצְתּ֖/וֹ לְ/הַרְשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/003.yaml
  text: He too walked in the ways of the house of Ahab[a], because his mother was his counselor to act wickedly.
translation:
  language: te
  text: అతడు కూడా అహాబు ఇంటివారి మార్గాల్లో నడిచాడు; ఎందుకంటే అతని తల్లి అతడు దుష్టంగా ప్రవర్తించేలా అతనికి సలహాదారుగా ఉండేది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “దుష్టత్వం చేయమని అతనికి సలహా ఇచ్చేది”; “దుష్టత్వంలో అతనికి సలహాదారుగా ఉండేది.”'
    reason: לְהַרְשִׁיעַ హిఫిల్ infinitiveను దుష్టప్రవర్తనకు నడిపించడం, దుష్టత్వం చేయమని సలహా ఇవ్వడం, లేదా దుష్టత్వంలో సలహాదారుగా ఉండడం అనే సంబంధిత రీతుల్లో అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: גַּם הוּא
  choice: అతడు కూడా
  rationale: גַּם యొక్క చేర్పు భావాన్ని, స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הָלַךְ בְּדַרְכֵי
  choice: మార్గాల్లో నడిచాడు
  rationale: నైతిక ప్రవర్తనను సూచించే హీబ్రూ రూపకాన్ని తెలుగులో అర్థమయ్యే బైబిలు నుడికారంగా కాపాడుతుంది.
- source_word: בֵּית אַחְאָב
  choice: అహాబు ఇంటివారి
  rationale: בֵּית ఇక్కడ కుటుంబం లేదా రాజవంశాన్ని సూచిస్తుంది. ‘ఇంటివారి’ అనేది ఆ సమూహార్థాన్ని సహజంగా తెలియజేస్తూ, ‘రాజవంశం’ అనే మరింత వ్యాఖ్యాత్మక పదాన్ని నివారిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇక్కడ రాజు ప్రవర్తనకు కారణాన్ని పరిచయం చేసే స్పష్టమైన కారణార్థక అనుసంధానం.
- source_word: אִמּוֹ
  choice: అతని తల్లి
  rationale: మూలంలోని స్వామ్య సంబంధాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: הָיְתָה יֹעַצְתּוֹ
  choice: అతనికి సలహాదారుగా ఉండేది
  rationale: ఒకసారి సలహా ఇచ్చిందనే భావం కాకుండా, మూలంలోని నామవాచక నిర్మాణం మరియు కొనసాగిన సలహాదారు పాత్ర రెండింటినీ నిలుపుతుంది.
- source_word: לְהַרְשִׁיעַ
  choice: దుష్టంగా ప్రవర్తించడానికి
  rationale: హిఫిల్ infinitiveలోని లక్ష్యం/ఫలిత భావాన్ని, నైతిక దోష నిర్ధారణను స్పష్టంగా తెలియజేస్తుంది; సందర్భానికి మించిన మానసిక వివరణను చేర్చదు.
theological_decisions:
- issue: తల్లి ప్రభావంలో రాజు ప్రవర్తనకు ఇచ్చిన నైతిక నిర్ధారణ
  choice: అతని తల్లి దుష్టంగా ప్రవర్తించడానికి సలహాదారుగా ఉండేదని స్పష్టంగా ఉంచడం
  alternative: ‘అతని తల్లి చెడు చేయమని అతన్ని ప్రోత్సహించింది’ అని స్వేచ్ఛగా అనువదించడం
  rationale: לְהַרְשִׁיעַలోని దుష్టత్వంపై స్పష్టమైన తీర్పును మృదువుచేయకుండా నిలుపుతూ, ‘ప్రోత్సహించింది’ వంటి అదనపు మానసిక సూక్ష్మభావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మార్గాల్లో నడిచాడు’ అనే నైతిక రూపకాన్ని నిలుపుతూ, ‘అహాబు ఇంటివారు’ ద్వారా కుటుంబ/రాజవంశ భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా వ్యక్తం చేసింది.
