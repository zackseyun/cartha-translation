source:
  edition: WLC
  text: וַ/יָּ֜שָׁב לְ/הִתְרַפֵּ֣א בְ/יִזְרְעֶ֗אל כִּ֤י הַ/מַּכִּים֙ אֲשֶׁ֣ר הִכֻּ֣/הוּ בָֽ/רָמָ֔ה בְּ/הִלָּ֣חֲמ֔/וֹ אֶת חֲזָהאֵ֖ל מֶ֣לֶךְ אֲרָ֑ם וַ/עֲזַרְיָ֨הוּ בֶן יְהוֹרָ֜ם מֶ֣לֶךְ יְהוּדָ֗ה יָרַ֡ד לִ/רְא֞וֹת אֶת יְהוֹרָ֧ם בֶּן אַחְאָ֛ב בְּ/יִזְרְעֶ֖אל כִּי חֹלֶ֥ה הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/006.yaml
  text: So he returned to Jezreel to recover[a], because of the wounds that they had inflicted on him at Ramah when he fought against Hazael king of Aram. And Azariah son of Jehoram, king of Judah, went down to see Jehoram son of Ahab in Jezreel[b], because he was sick.
translation:
  language: te
  text: అతడు అరాము రాజైన హజాయేలుతో యుద్ధం చేస్తున్నప్పుడు రామాలో వారు అతనికి కలిగించిన గాయాలనుంచి కోలుకోవడానికి యెజ్రెయేలుకు తిరిగి వచ్చాడు. యూదా రాజైన యెహోరాము కుమారుడు అజర్యా[a], అహాబు కుమారుడైన యెహోరామును చూడడానికి[b] యెజ్రెయేలుకు దిగివెళ్లాడు; ఎందుకంటే అతడు అనారోగ్యంతో ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ దినవృత్తాంతాల హీబ్రూ పాఠంలో ‘అజర్యా’ అని ఉంది; ఇదే రాజు ఇతర చోట్ల ‘అహజ్యా’ అని పిలువబడ్డాడు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘యెహోరామును పరామర్శించడానికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב לְהִתְרַפֵּא בְיִזְרְעֶאל
  choice: గాయాలనుంచి కోలుకోవడానికి యెజ్రెయేలుకు తిరిగి వచ్చాడు
  rationale: שוב యొక్క కథన క్రమాన్ని ‘తిరిగి వచ్చాడు’ అని, התרפא యొక్క సందర్భానుసార అర్థాన్ని సహజమైన ఆధునిక తెలుగులో ‘కోలుకోవడానికి’ అని వ్యక్తపరుస్తుంది. కదలికను సూచించే సందర్భంలో בְיִזְרְעֶאל ను ‘యెజ్రెయేలుకు’గా అనువదించాం.
- source_word: כִּי הַמַּכִּים אֲשֶׁר הִכֻּהוּ
  choice: వారు తనకు కలిగించిన గాయాలనుంచి
  rationale: מַכִּים ఇక్కడ దెబ్బల ఫలితమైన గాయాలను సూచిస్తుంది. క్రియలోని బహువచన కర్తను ‘వారు’గా ఉంచి, తెలుగులో సహజంగా ఉండేలా గాయాలనుంచి కోలుకోవడమనే నిర్మాణంతో కలిపాం.
- source_word: בָרָמָה בְּהִלָּחֲמוֹ אֶת חֲזָהאֵל מֶלֶךְ אֲרָם
  choice: అరాము రాజైన హజాయేలుతో యుద్ధం చేస్తున్నప్పుడు రామాలో
  rationale: בְּ + క్రియానామం తెలిపే కాలసంబంధాన్ని ‘యుద్ధం చేస్తున్నప్పుడు’గా అందించాం. לחם సందర్భంలో తెలుగులో ‘తో యుద్ధం చేయడం’ ప్రత్యర్థిత్వాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַעֲזַרְיָהוּ
  choice: అజర్యా
  rationale: ఈ వచనంలోని మసొరా హీబ్రూ పాఠం עזריהו అనే పేరును కలిగి ఉంది; అందువల్ల దానిని మరొక చోట కనిపించే ‘అహజ్యా’తో సమన్వయపరచకుండా ప్రధాన పాఠంలో ‘అజర్యా’గా నిలిపాం.
- source_word: יָרַד
  choice: వెళ్లాడు
  rationale: ירד లోని ‘దిగివెళ్లాడు’ అనే దిశాసూచక భావం ఉన్నప్పటికీ, గమ్యస్థానాల ఎత్తు సంబంధం తెలుగు పాఠకునికి స్పష్టంగా లేకపోతే ‘దిగివెళ్లాడు’ అసహజంగా లేదా తప్పుదోవ పట్టించేదిగా ఉంటుంది; కథన కదలికను సహజంగా ‘వెళ్లాడు’గా ఇచ్చాం.
- source_word: לִרְאוֹת
  choice: చూడడానికి
  rationale: ראה యొక్క ప్రాథమిక అర్థమైన ‘చూడడం’ను ప్రధాన పాఠంలో నిలిపాం; సందర్భానుసారమైన ‘పరామర్శించడం’ను పాదసూచికలో ఇచ్చాం.
- source_word: כִּי חֹלֶה הוּא
  choice: ఎందుకంటే అతడు అనారోగ్యంతో ఉన్నాడు
  rationale: חלה అనారోగ్యంగా లేదా అస్వస్థంగా ఉండడాన్ని సూచిస్తుంది. ముందున్న గాయాల సందర్భాన్ని అతిగా వివరిస్తూ అర్థాన్ని పరిమితం చేయకుండా సాధారణ పదబంధాన్ని ఎంచుకున్నాం.
theological_decisions:
- issue: దినవృత్తాంతాల వృత్తాంతంలో రాజు పేరు భిన్నంగా ఉండటం
  choice: ప్రధాన పాఠంలో ‘అజర్యా’ను ఉంచడం
  alternative: అహజ్యా
  rationale: ఇది సిద్ధాంతపరమైన నిర్ణయం కాదు; మూలపాఠ నిష్ఠకు సంబంధించినది. ఈ వచనంలోని హీబ్రూ రూపాన్ని సమాంతర వృత్తాంతాలతో మౌనంగా సమన్వయపరచకుండా నిలిపి, అదే రాజు ఇతర చోట్ల పిలువబడే పేరును పారదర్శకత కోసం పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. రాజపేర్లను మూల హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం; మూలంలోని పేరు భేదాన్ని సమన్వయపరచకుండా పాదసూచికతో స్పష్టం చేశాం.
