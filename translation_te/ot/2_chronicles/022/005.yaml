- from: అతడు వారి ఆలోచన ప్రకారమే నడుచుకున్నాడు[a]. అతడు ఇశ్రాయేలు రాజైన అహాబు కుమారుడు యెహోరాముతో కలిసి గిలాదులోని రామోతు దగ్గర అరాము రాజైన హజాయేలుతో యుద్ధం చేయడానికి వెళ్లాడు[b]. అక్కడ అరామీయులు యోరామును గాయపరిచారు[c].
  to: అతడు వారి సలహా ప్రకారం కూడా నడుచుకున్నాడు[a]. అతడు ఇశ్రాయేలు రాజైన అహాబు కుమారుడు యెహోరాముతో కలిసి అరాము రాజైన హజాయేలుతో[b] యుద్ధం చేయడానికి గిలాదు రామోతు వద్దకు వెళ్లాడు. అక్కడ అరామీయులు యోరామును[c] గాయపరిచారు.
