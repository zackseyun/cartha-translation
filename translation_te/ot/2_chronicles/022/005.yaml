id: 2CH.22.5
reference: 2 Chronicles 22:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: גַּ֣ם בַּ/עֲצָתָ/ם֮ הָלַךְ֒ וַ/יֵּלֶךְ֩ אֶת יְהוֹרָ֨ם בֶּן אַחְאָ֜ב מֶ֣לֶךְ יִשְׂרָאֵ֗ל לַ/מִּלְחָמָ֛ה עַל חֲזָאֵ֥ל מֶֽלֶךְ אֲרָ֖ם בְּ/רָמ֣וֹת גִּלְעָ֑ד וַ/יַּכּ֥וּ הָֽ/רַמִּ֖ים אֶת יוֹרָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/005.yaml
  text: He also walked by their counsel[a], and he went with Jehoram son of Ahab, king of Israel, to war against Hazael king of Aram at Ramoth-gilead[c][b]; and the Arameans wounded Joram.
translation:
  language: te
  text: అతడు వారి సలహా ప్రకారం కూడా నడుచుకున్నాడు[a]. అతడు ఇశ్రాయేలు రాజైన అహాబు కుమారుడు యెహోరాముతో కలిసి అరాము రాజైన హజాయేలుతో[b] యుద్ధం చేయడానికి గిలాదు రామోతు వద్దకు వెళ్లాడు. అక్కడ అరామీయులు యోరామును[c] గాయపరిచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి సలహాను అనుసరించి ప్రవర్తించాడు.’ ‘సలహా ప్రకారం నడుచుకోవడం’ అనే హీబ్రూ ప్రయోగం వారి సలహా నిర్దేశించిన విధంగా ప్రవర్తించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘అరాము’; సంప్రదాయంగా ‘సిరియా’ అని అనువదిస్తారు. అలాగే ‘అరామీయులు’ను ‘సిరియన్లు’ అని కూడా అంటారు.
    reason: alternative_reading
  - marker: c
    text: 'ఈ వచనంలో హీబ్రూ పాఠం ఒకే పేరుకు సంబంధితమైన రెండు రూపాలను వాడుతుంది: ముందు ‘యెహోరాము,’ చివర ‘యోరాము.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בַּעֲצָתָם הָלַךְ
  choice: అతడు వారి ఆలోచన ప్రకారమే నడుచుకున్నాడు
  rationale: గత వచనంతో కొనసాగింపును చూపే גַּם భావాన్ని ‘ప్రకారమే’లో సహజంగా ప్రతిబింబిస్తూ, సలహాకు అనుగుణంగా ప్రవర్తించడాన్ని తెలిపే హీబ్రూ ‘నడుచు’ రూపకాన్ని నిలుపుతుంది.
- source_word: וַיֵּלֶךְ אֶת
  choice: తో కలిసి ... వెళ్లాడు
  rationale: యెహోరాముతో సహవాసంగా వెళ్లిన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לַמִּלְחָמָה עַל
  choice: తో యుద్ధం చేయడానికి
  rationale: లక్ష్యార్థక నిర్మాణాన్నీ, సైనిక విరోధ దిశనూ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֲרָם / הָרַמִּים
  choice: అరాము / అరామీయులు
  rationale: తరువాతి కాలపు ‘సిరియా’ అనే పేరుకు బదులు హీబ్రూ చారిత్రక నామాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: בְּרָמוֹת גִּלְעָד
  choice: గిలాదులోని రామోతు దగ్గర
  rationale: స్థలనామంలోని గిలాదు సంబంధాన్ని తెలియజేస్తూ, యుద్ధం జరిగిన ప్రదేశాన్ని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: וַיַּכּוּ
  choice: గాయపరిచారు
  rationale: మూల క్రియకు ‘కొట్టారు’ అనే విస్తృత అర్థం ఉన్నా, తరువాతి వచనం యోరాము గాయాల గురించి చెప్పడం వల్ల ఇక్కడ సందర్భానుసారంగా ‘గాయపరిచారు’ సరిపోతుంది.
- source_word: יְהוֹרָם ... יוֹרָם
  choice: యెహోరాము ... యోరాము
  rationale: ఒకే వ్యక్తి పేరుకు మూలపాఠంలో కనిపించే రెండు సంబంధిత రూపాల భేదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: אֲרָם మరియు הָרַמִּים జాతీయ పేర్ల అనువాదం
  choice: అరాము / అరామీయులు
  alternative: సిరియా / సిరియనులు
  rationale: ఇది సిద్ధాంతపరమైన వివాదం కాదు; మూల హీబ్రూ చారిత్రక నామాన్ని ప్రాధాన్యపరచి, తరువాతి భౌగోళిక పేరును పాఠ్యంలోకి తీసుకురాకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. హీబ్రూ ‘నడుచు’ రూపకాన్ని అర్థమయ్యే నిర్మాణంలో నిలిపి, పేర్లను తెలుగు బైబిలు పాఠకులకు పరిచితమైన లిప్యంతరీకరణకు దగ్గరగా ఉంచింది. మూలంలోని పేరు-రూప భేదం మరియు అరాము అనే చారిత్రక నామం పాదసూచనలతో సంరక్షించబడ్డాయి.
