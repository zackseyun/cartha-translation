source:
  edition: WLC
  text: וַ/יַּמְלִיכוּ֩ יוֹשְׁבֵ֨י יְרוּשָׁלִַ֜ם אֶת אֲחַזְיָ֨הוּ בְנ֤/וֹ הַ/קָּטֹן֙ תַּחְתָּ֔י/ו כִּ֤י כָל הָ/רִאשֹׁנִים֙ הָרַ֣ג הַ/גְּד֔וּד הַ/בָּ֥א בָֽ/עַרְבִ֖ים לַֽ/מַּחֲנֶ֑ה וַ/יִּמְלֹ֛ךְ אֲחַזְיָ֥הוּ בֶן יְהוֹרָ֖ם מֶ֥לֶךְ יְהוּדָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/001.yaml
  text: Then the inhabitants of Jerusalem made Ahaziah[a], his youngest son, king in his place, because the raiding band that came with the Arabs into the camp had killed all the older sons. So Ahaziah son of Jehoram, king of Judah, became king.
translation:
  language: te
  text: 'తరువాత యెరూషలేము నివాసులు అతని అతి చిన్న కుమారుడైన అహజ్యాను అతని స్థానంలో రాజుగా చేశారు. ఎందుకంటే అరబ్బులతో కలిసి శిబిరంలోకి వచ్చిన[a] దోపిడీ దండు పెద్ద కుమారులందరినీ చంపివేసింది. ఆ విధంగా యూదా రాజైన యెహోరాము కుమారుడు అహజ్యా రాజయ్యాడు.


    [a] లేదా, “అరబ్బుల మధ్య శిబిరంలోకి వచ్చిన దండు.” ‘అరబ్బులు’ అనే మాటతో వాడిన హీబ్రూ విభక్తి ప్రత్యయాన్ని బట్టి ఈ పదబంధాన్ని వేరే విధంగా కూడా అర్థం చేసుకోవచ్చు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అరబ్బుల మధ్య శిబిరంలోకి వచ్చిన దండు.” ‘అరబ్బులు’ అనే మాటతో వాడిన హీబ్రూ విభక్తి ప్రత్యయాన్ని బట్టి ఈ పదబంధాన్ని వేరే విధంగా కూడా అర్థం చేసుకోవచ్చు.
    reason: בְעַרְבִים లోని ב సహచర్యాన్ని (‘అరబ్బులతో కలిసి’) లేదా మధ్యస్థితిని (‘అరబ్బుల మధ్య’) సూచించవచ్చు; మూలంలోని నిజమైన వ్యాకరణ సందిగ్ధతను తెలియజేయడం అవసరం.
lexical_decisions:
- source_word: וַיַּמְלִיכוּ
  choice: రాజుగా చేశారు
  rationale: מלך హిఫీల్ రూపం ఒకరిని రాజుగా నియమించడం లేదా రాజ్యాధికారంలో నిలపడం అనే causative భావాన్ని ఇస్తుంది.
- source_word: יוֹשְׁבֵי יְרוּשָׁלִַם
  choice: యెరూషలేము నివాసులు
  rationale: ‘యెరూషలేములో నివసించేవారు’ అనే మూలార్థాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְנוֹ הַקָּטֹן
  choice: అతని చిన్న కుమారుడు
  rationale: קטן అక్షరార్థంగా ‘చిన్న/యువ’ అని ఉన్నా, తరువాత పేర్కొన్న పెద్ద కుమారులతో ఉన్న వ్యత్యాసం వల్ల ఇతడు కుమారుల్లో చిన్నవాడని సందర్భం సూచిస్తుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: రాజ్య వారసత్వంలో ఒకరి స్థానాన్ని మరొకరు స్వీకరించడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָל הָרִאשֹׁנִים
  choice: పెద్ద కుమారులందరినీ
  rationale: అక్షరార్థంగా ‘ముందున్నవారందరు’; తక్షణ సందర్భంలో అహజ్యా కంటే పెద్దవారైన యెహోరాము కుమారులను సూచిస్తుంది.
- source_word: הַגְּדוּד
  choice: దోపిడీ దండు
  rationale: גדוד ఇక్కడ సైనిక దండు మాత్రమే కాక దాడి చేసి దోచుకునే బృందాన్ని సూచిస్తుంది; ‘దోపిడీ దండు’ ఆ సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: הַבָּא בָעַרְבִים
  choice: అరబ్బులతో కలిసి ... వచ్చిన
  rationale: ב అనే ప్రత్యయాన్ని సహచర్యార్థంలో తీసుకున్న ప్రధాన పఠనం; అయితే ‘అరబ్బుల మధ్య’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఉంచి మూలంలోని సందిగ్ధతను కాపాడింది.
- source_word: לַמַּחֲנֶה
  choice: శిబిరంలోకి
  rationale: ל ఇక్కడ శిబిరం వైపు కదలికతో పాటు దానిలో ప్రవేశించిన దాడి సందర్భాన్ని సూచిస్తుందని పాఠ్యసందర్భం తెలియజేస్తుంది.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: ఈ సందర్భంలో Qal క్రియ రాజ్యపాలన కొనసాగింపుకంటే సింహాసనారోహణను సంగ్రహంగా తెలియజేస్తుంది.
