translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ కృదంతాల కొనసాగుతున్న చర్యను ‘దాగి ఉన్నాడు’, ‘పరిపాలిస్తూ ఉంది’ అనే రూపాలతో నిలిపి, מִתְחַבֵּא లోని నిజమైన మధ్యార్థ సందిగ్ధతను పాదటిప్పణిలో భద్రపరిచాం.
