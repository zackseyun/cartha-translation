  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֤י אִתָּ/ם֙ בְּ/בֵ֣ית הָֽ/אֱלֹהִ֔ים מִתְחַבֵּ֖א שֵׁ֣שׁ שָׁנִ֖ים וַ/עֲתַלְיָ֖ה מֹלֶ֥כֶת עַל הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/012.yaml
  text: And he was with them in the house of God[a], hiding himself for six years[b], while Athaliah was reigning over the land.
translation:
  language: te
  text: అతడు వారితో కలిసి దేవుని మందిరంలో[a] ఆరు సంవత్సరాలు దాగి ఉన్నాడు; ఆ సమయంలో అతల్యా దేశాన్ని పరిపాలిస్తూ ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘దేవుని ఇంటిలో.’ ఇక్కడ ఇది దేవాలయ ప్రాంగణాన్ని సూచిస్తుంది. ‘దాగి’ అనే హీబ్రూ రూపాన్ని ‘తనను తాను దాచుకుంటూ’ లేదా సందర్భానుసారంగా ‘దాచబడి’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: ఉన్నాడు
  rationale: היה యొక్క కథన రూపం ఇక్కడ యోవాషు అక్కడ కొనసాగి ఉన్న సంగతిని తెలియజేస్తుంది; తెలుగులో ‘ఉన్నాడు’ సహజంగా, మూలానికి సమీపంగా ఉంది.
- source_word: אִתָּם
  choice: వారితో కలిసి
  rationale: ప్రత్యయంతో ఉన్న אֵת అనే విభక్తి యోవాషు తనను దాచినవారితో కూడ ఉన్నాడని నేరుగా సూచిస్తుంది.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: దేవుని మందిరంలో
  rationale: అక్షరార్థంగా ‘దేవుని ఇంటిలో’; ఈ సందర్భంలో అది దేవాలయ ప్రాంగణాన్ని సూచిస్తున్నందున ‘మందిరం’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది, అక్షరార్థాన్ని పాదటిప్పణి భద్రపరుస్తుంది.
- source_word: מִתְחַבֵּא
  choice: దాగి
  rationale: హిత్పయేల్ వర్తమాన కృదంతం స్వయంగా దాగడం లేదా దాచబడిన స్థితి అనే మధ్యార్థ ఛాయను కలిగి ఉంది. ‘దాగి ఉన్నాడు’ సహజమైన తెలుగు; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణి సూచిస్తుంది.
- source_word: שֵׁשׁ שָׁנִים
  choice: ఆరు సంవత్సరాలు
  rationale: కాలవ్యవధిని తెలుగులో అదనపు విభక్తి లేకుండానే సహజంగా వ్యక్తం చేయవచ్చు.
- source_word: וַעֲתַלְיָה מֹלֶכֶת
  choice: ఆ సమయంలో అతల్యా ... పరిపాలిస్తూ ఉంది
  rationale: స్త్రీలింగ ఏకవచన కృదంతం కొనసాగుతున్న పాలనను సూచిస్తుంది; ‘ఆ సమయంలో’ రెండు చర్యల సమకాలికతను తెలుగులో స్పష్టం చేస్తుంది.
- source_word: עַל הָאָרֶץ
  choice: దేశాన్ని
  rationale: הָאָרֶץ ఇక్కడ యూదా రాజ్యభూభాగాన్ని సూచిస్తుంది. ‘దేశం’ నేరుగా ఉండి, మూలంలో లేని ‘యూదా’ లేదా ‘రాజ్యం’ను చేర్చదు.
