  terminology: ‘దేవుని మందిరం’ בֵּית הָאֱלֹהִים కు సందర్భోచితమైన సహజ అనువాదం. ‘దాగి’ మִתְחַבֵּא యొక్క మధ్య/ప్రత్యయార్థ అవకాశాన్ని ప్రధాన వాక్యంలో సహజంగా ఉంచుతుంది; పాదటిప్పణి ప్రత్యామ్నాయ అవగాహనను సరియైన రీతిలో నమోదు చేస్తుంది. ‘దేశాన్ని పరిపాలిస్తూ ఉంది’ עַל־הָאָרֶץ కు సరిపోతుంది.
