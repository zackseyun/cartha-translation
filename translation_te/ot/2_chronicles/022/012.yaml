  source_fidelity: 'హీబ్రూ వాక్యంలోని అంశాలన్నీ నమ్మకంగా ప్రతిఫలించాయి: యోవాషు వారితో దేవుని మందిరంలో ఉండడం, ఆరు సంవత్సరాలపాటు దాగి ఉండడం, అదే కాలంలో అతల్యా దేశంపై పాలించడం. ‘ఆ సమయంలో’ అనేది వావ్-సంబంధంలోని సమకాలిక భావాన్ని సహజంగా తెలియజేస్తుంది; మూలంలో లేని నిర్దిష్ట భౌగోళిక పేరును చేర్చలేదు.'
