source:
  edition: WLC
  text: וַ/תִּקַּח֩ יְהוֹשַׁבְעַ֨ת בַּת הַ/מֶּ֜לֶךְ אֶת יוֹאָ֣שׁ בֶּן אֲחַזְיָ֗הוּ וַ/תִּגְנֹ֤ב אֹת/וֹ֙ מִ/תּ֤וֹךְ בְּנֵֽי הַ/מֶּ֨לֶךְ֙ הַ/מּ֣וּמָתִ֔ים וַ/תִּתֵּ֥ן אֹת֛/וֹ וְ/אֶת מֵֽינִקְתּ֖/וֹ בַּ/חֲדַ֣ר הַ/מִּטּ֑וֹת וַ/תַּסְתִּירֵ֡/הוּ יְהוֹשַׁבְעַ֣ת בַּת הַ/מֶּ֣לֶךְ יְהוֹרָ֡ם אֵשֶׁת֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן כִּ֣י הִיא֩ הָיְתָ֨ה אֲח֧וֹת אֲחַזְיָ֛הוּ מִ/פְּנֵ֥י עֲתַלְיָ֖הוּ וְ/לֹ֥א הֱמִיתָֽתְ/הוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/011.yaml
  text: But Jehoshabeath[a], the king’s daughter, took Joash son of Ahaziah and stole him away from among the king’s sons who were being put to death, and she put him and his nurse in the bedroom. So Jehoshabeath, the daughter of King Jehoram, the wife of Jehoiada the priest, hid him from Athaliah[c][b], and she did not put him to death.
translation:
  language: te
  text: అయితే రాజకుమార్తె యెహోషబతు, అహజ్యా కుమారుడైన యోవాషును తీసుకొని, చంపబడుతున్న రాజు కుమారుల మధ్యనుండి అతణ్ణి రహస్యంగా తీసుకుపోయింది.[a] ఆమె అతణ్ణి, అతనికి పాలిచ్చే దాదిని పడకగదిలో ఉంచింది.[b] రాజైన యెహోరాము కుమార్తెను, యాజకుడైన యెహోయాదా భార్యను, అహజ్యా సోదరినైన యెహోషబతు అతణ్ణి అతల్యా కంటపడకుండా దాచింది; ఆమె అతణ్ణి చంపలేదు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చంపబడబోతున్న రాజు కుమారుల మధ్యనుండి.”
    reason: הַמּוּמָתִים అనే హొఫాల్ కృదంతం జరుగుతున్న హత్యను లేదా సమీపంలో అమలుకాబోయే హత్యను సూచించవచ్చు.
  - marker: b
    text: హీబ్రూలో, “పడకల గదిలో.”
    reason: בַּחֲדַר הַמִּטּוֹת అనే పదబంధం అక్షరార్థాన్ని తెలియజేస్తుంది; సందర్భంలో ఇది పడకగది లేదా శయనగది.
  - marker: c
    text: హీబ్రూలో చివరి క్రియకు కర్త పేరు స్పష్టంగా లేదు. సందర్భాన్ని బట్టి అది అతల్యాను సూచించే అవకాశం ఎక్కువ; యెహోషబతును సూచించడం కూడా వ్యాకరణపరంగా సాధ్యమే.
    reason: చివరి స్త్రీలింగ ఏకవచన క్రియలో ఉన్న నిజమైన సూచనాస్పష్టతను భద్రపరుస్తుంది.
lexical_decisions:
- source_word: וַתִּקַּח
  choice: తీసుకొని
  rationale: לקח అనే సాధారణ కథన క్రియకు నేరమైన అర్థం ‘తీసుకొను’; ‘రక్షించింది’ అని అనువదిస్తే సందర్భార్థాన్ని పదంలోనే అదనంగా చేర్చినట్టవుతుంది.
- source_word: וַתִּגְנֹב אֹתוֹ
  choice: అతణ్ణి రహస్యంగా తీసుకుపోయింది
  rationale: גנבలోని దొంగచాటుగా తీసుకుపోవడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; బాలుణ్ణి అపహరించిందనే ప్రతికూల భావాన్ని నివారిస్తుంది.
- source_word: מִתּוֹךְ בְּנֵי הַמֶּלֶךְ הַמּוּמָתִים
  choice: చంపబడుతున్న రాజకుమారుల మధ్యనుండి
  rationale: హొఫాల్ కృదంతం మరణశిక్ష అమలవుతున్న లేదా దానికి గురవుతున్న సమూహాన్ని సూచించగలదు. వారు అప్పటికే అందరూ చనిపోయారని నిర్ధారించకుండా తక్షణ ప్రమాదాన్ని నిలుపుతుంది.
- source_word: מֵינִקְתּוֹ
  choice: అతని దాది
  rationale: శిశువుకు పాలిచ్చి సంరక్షించే స్త్రీని సూచిస్తుంది. ‘దాది’ సహజంగా, సంక్షిప్తంగా ఉంది; అవసరమైన అర్థం సందర్భంలో స్పష్టమవుతుంది.
- source_word: בַּחֲדַר הַמִּטּוֹת
  choice: పడకగదిలో
  rationale: అక్షరార్థంగా ‘పడకల గదిలో’; ఆధునిక తెలుగులో ‘పడకగది’ సహజమైన సమానార్థకం.
- source_word: וַתַּסְתִּירֵהוּ ... מִפְּנֵי עֲתַלְיָהוּ
  choice: అతల్యాకు కనబడకుండా దాచింది
  rationale: సתר మరియు מִפְּנֵי కలిపి అతల్యా దృష్టికి, అందుబాటుకు దూరంగా దాచిన భావాన్ని సహజంగా వ్యక్తం చేస్తాయి.
- source_word: כִּי הִיא הָיְתָה אֲחוֹת אֲחַזְיָהוּ
  choice: ఆమె అహజ్యా సోదరి
  rationale: యెహోషబతు ఎందుకు చర్య తీసుకుందో వివరించే కుటుంబ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది; తెలుగు వాక్య నిర్మాణంలో ముందున్న పరిచయ వివరాలతో సహజంగా కలుస్తుంది.
- source_word: וְלֹא הֱמִיתָתְהוּ
  choice: అందువల్ల అతల్యా అతణ్ణి చంపలేదు
  rationale: క్రియలోని స్త్రీలింగ ఏకవచన కర్తను సందర్భానుసారం అతల్యాగా స్పష్టం చేస్తుంది; ‘అందువల్ల’ దాచిన చర్య ఫలితాన్ని తెలుపుతుంది. హీబ్రూలో కర్త ప్రత్యక్షంగా పేర్కొనబడలేదనే విషయాన్ని పాదటిప్పణిలో ఉంచింది.
theological_decisions:
- issue: וְלֹא הֱמִיתָתְהוּ అనే చివరి క్రియకు కర్త ఎవరు?
  choice: ప్రధాన పాఠ్యంలో అతల్యాను కర్తగా స్పష్టం చేయడం
  alternative: యెహోషబతే కర్తగా తీసుకొని, ‘ఆమె అతణ్ణి చంపలేదు’ అని అనువదించడం
  rationale: ‘అతల్యాకు కనబడకుండా దాచింది’ అనే వెంటనే ముందున్న సందర్భం ప్రకారం అతల్యానే సహజమైన అంతర్లీన కర్త. అయినా హీబ్రూ కర్తను పేరుతో చెప్పనందున వ్యాకరణపరమైన అస్పష్టతను పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. పేర్లను తెలుగు బైబిలు వాడుకకు దగ్గరగా లిప్యంతరీకరించాం. పొడవైన హీబ్రూ వాక్యాన్ని చదవడానికి సులభంగా విభజించినా, గుర్తింపు వివరాలు, కారణ సంబంధం, అంతర్లీన ఉద్వేగం అన్నీ నిలిపాం.
