revisions:
- from: అయితే రాజకుమార్తె యెహోషబతు, అహజ్యా కుమారుడైన యోవాషును తీసుకొని, చంపబడుతున్న రాజకుమారుల మధ్యనుండి అతణ్ణి రహస్యంగా తీసుకుపోయింది.[a] అతణ్ణి, అతని దాదిని పడకగదిలో ఉంచింది.[b] యెహోషబతు రాజైన యెహోరాము కుమార్తె, యాజకుడైన యెహోయాదా భార్య; ఆమె అహజ్యా సోదరి. ఆమె యోవాషును అతల్యాకు కనబడకుండా దాచింది; అందువల్ల అతల్యా అతణ్ణి చంపలేదు.[c]
  to: అయితే రాజకుమార్తె యెహోషబతు, అహజ్యా కుమారుడైన యోవాషును తీసుకొని, చంపబడుతున్న రాజు కుమారుల మధ్యనుండి అతణ్ణి రహస్యంగా తీసుకుపోయింది.[a] ఆమె అతణ్ణి, అతనికి పాలిచ్చే దాదిని పడకగదిలో ఉంచింది.[b] రాజైన యెహోరాము కుమార్తెను, యాజకుడైన యెహోయాదా భార్యను, అహజ్యా సోదరినైన యెహోషబతు అతణ్ణి అతల్యా కంటపడకుండా దాచింది; ఆమె అతణ్ణి చంపలేదు.[c]
  rationale: చివరి క్రియకు పేరుపెట్టి అతల్యానే కర్త అని చెప్పడాన్ని, అలాగే హీబ్రూలో లేని స్పష్టమైన ఫలితసూచకమైన “అందువల్ల”ను తొలగించాం. అందుచేత సందర్భానుగుణంగా అతల్యా భావన కనిపించినా, మూలపాఠంలోని వ్యాకరణ అస్పష్టత పాదటిప్పణితో నిలిచింది. మֵינִקְתּוֹకు “అతనికి పాలిచ్చే దాది” అని చెప్పి దాని అర్థాన్ని నిర్దిష్టపరిచాం; “రాజు కుమారులు” ద్వారా בְּנֵי הַמֶּלֶךְను మరింత నేరుగా ప్రతిబింబించాం.
