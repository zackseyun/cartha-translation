language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/בֵ֣ית אַחְאָ֑ב כִּי הֵ֜מָּה הָֽיוּ ל֣/וֹ יֽוֹעֲצִ֗ים אַחֲרֵ֛י מ֥וֹת אָבִ֖י/ו לְ/מַשְׁחִ֥ית לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/004.yaml
  text: He did what was evil in the sight of Yahweh[a], like the house of Ahab, because they were his counselors after the death of his father, to his destruction.
translation:
  language: te
  text: అతడు అహాబు వంశంవలె యహ్వే దృష్టిలో చెడ్డది చేశాడు. ఎందుకంటే అతని తండ్రి మరణానంతరం వారు అతనికి సలహాదారులుగా ఉన్నారు—అతని నాశనానికి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని పతనానికి”; లేదా, “అతన్ని నాశనం చేయడానికి.” హీబ్రూ పదబంధం వారి సలహా వల్ల కలిగిన ఫలితాన్ని గానీ, వారి నాశనకర ఉద్దేశాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: చెడ్డది చేశాడు
  rationale: హీబ్రూ మూలంలోని సాధారణ నైతిక మూల్యాంకన సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యహ్వే దృష్టిలో
  rationale: దేవుని మూల్యాంకనాన్ని సూచించే హీబ్రూ నుడికారాన్ని సహజంగా నిలుపుతూ, יְהוָה అనే దైవనామాన్ని ‘యహ్వే’గా లిప్యంతరీకరిస్తుంది.
- source_word: כְּבֵית אַחְאָב
  choice: అహాబు వంశంవారిలా
  rationale: בֵּית ఇక్కడ కేవలం గృహాన్ని కాక అహాబు కుటుంబం లేదా రాజవంశాన్ని సూచిస్తుంది; ‘వంశంవారు’ ఆ భావాన్ని సాధారణ పాఠకునికి స్పష్టం చేస్తుంది.
- source_word: הֵמָּה הָיוּ לוֹ יוֹעֲצִים
  choice: వారు అతనికి సలహాదారులుగా ఉండి
  rationale: మూలంలోని నామవాచక విధేయాన్ని నిలుపుతూ, ముందున్న అహాబు వంశంవారినే ‘వారు’ సూచిస్తున్నారని సహజంగా తెలియజేస్తుంది.
- source_word: אַחֲרֵי מוֹת אָבִיו
  choice: అతని తండ్రి చనిపోయిన తర్వాత
  rationale: ‘అతని తండ్రి మరణం తర్వాత’ అనే మరింత గ్రాంథిక రూపానికి బదులుగా, అర్థాన్ని యథాతథంగా ఉంచే సాధారణ ఆధునిక తెలుగు ప్రయోగం.
- source_word: לְמַשְׁחִית לוֹ
  choice: అతని నాశనానికి కారణమయ్యారు
  rationale: ఈ హీబ్రూ నిర్మాణం వారి సలహా వల్ల కలిగిన నాశనకర ఫలితాన్ని లేదా అతన్ని నాశనం చేయాలనే ఉద్దేశాన్ని సూచించవచ్చు. ప్రధాన పాఠం ఫలిత భావాన్ని సహజంగా వ్యక్తపరుస్తుంది; పాదసూచిక ప్రత్యామ్నాయాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునికంగా విస్తృతంగా అంగీకరించిన ‘యహ్వే’ రూపంలో ఇస్తుంది.
- issue: לְמַשְׁחִית לוֹ లో ఉద్దేశం లేదా ఫలితం
  choice: అతని నాశనానికి కారణమయ్యారు
  alternative: అతన్ని నాశనం చేయడానికి సలహాదారులుగా ఉన్నారు
  rationale: హీబ్రూ పదబంధం నాశనకర ఫలితాన్నీ, నాశనం చేయాలనే లక్ష్యాన్నీ అనుమతిస్తుంది. ప్రధాన పాఠంలో ఫలిత భావాన్ని ఎంచుకుని, ఉద్దేశ భావాన్ని పాదసూచికలో ఉంచడం ద్వారా నిజమైన సందిగ్ధతను సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘అహాబు ఇల్లు’ అనే అక్షరార్థ రూపం అపార్థానికి దారితీయవచ్చు కాబట్టి ‘అహాబు వంశంవారు’ అని ఇచ్చాం. మూలంలోని కారణ సంబంధం మరియు చివరి పదబంధంలోని ఉద్దేశం/ఫలితం సందిగ్ధత సంరక్షించబడ్డాయి.
