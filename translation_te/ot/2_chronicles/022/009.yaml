source:
  edition: WLC
  text: וַ/יְבַקֵּשׁ֩ אֶת אֲחַזְיָ֨הוּ וַֽ/יִּלְכְּדֻ֜/הוּ וְ/ה֧וּא מִתְחַבֵּ֣א בְ/שֹֽׁמְר֗וֹן וַ/יְבִאֻ֣/הוּ אֶל יֵהוּא֮ וַ/יְמִתֻ/הוּ֒ וַֽ/יִּקְבְּרֻ֔/הוּ כִּ֤י אָֽמְרוּ֙ בֶּן יְהוֹשָׁפָ֣ט ה֔וּא אֲשֶׁר דָּרַ֥שׁ אֶת יְהוָ֖ה בְּ/כָל לְבָב֑/וֹ וְ/אֵין֙ לְ/בֵ֣ית אֲחַזְיָ֔הוּ לַ/עְצֹ֥ר כֹּ֖חַ לְ/מַמְלָכָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/009.yaml
  text: And he sought Ahaziah[a], and they captured him while he was hiding in Samaria, and they brought him to Jehu and put him to death. Then they buried him, for they said, “He is the son of Jehoshaphat[b], who sought Yahweh with all his heart.” And the house of Ahaziah had no power to retain the kingdom.
translation:
  language: te
  text: అతడు అహజ్యా కోసం వెదికాడు. సమరయలో దాక్కొని ఉన్న అతణ్ణి వారు పట్టుకొని యెహూ దగ్గరికి తీసుకొచ్చి చంపారు.[a] తరువాత అతణ్ణి పాతిపెట్టారు. ఎందుకంటే, “ఇతడు తన పూర్ణహృదయంతో యాహ్వేను వెదికిన యెహోషాపాతు కుమారుడు” అని వారు అన్నారు. అహజ్యా వంశానికి రాజ్యాన్ని నిలబెట్టే శక్తి లేకపోయింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ క్రియ కారణార్థక రూపంలో ఉంది; అక్షరార్థంగా, “అతడు చనిపోయేలా చేశారు.” అందుకే “చంపారు” అని అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'ఇలా కూడా అనువదించవచ్చు: “అహజ్యా వంశానికి రాజ్యాధికారాన్ని చేపట్టే బలం లేకపోయింది.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: అతడు ... కోసం వెదికాడు
  rationale: בקש అంటే వెదకడం లేదా అన్వేషించడం. హీబ్రూలో ఉన్న ఏకవచన కర్తను ‘అతడు’గా ఉంచి, సందర్భం సూచించే కర్తను పేరుతో నిర్దిష్టం చేయలేదు.
- source_word: וַיִּלְכְּדֻהוּ
  choice: అతణ్ణి వారు పట్టుకొని
  rationale: לכד పట్టుకోవడం లేదా బంధించడం అనే భావం ఇస్తుంది; బహువచన క్రియను ‘వారు’తో నిలిపాం.
- source_word: מִתְחַבֵּא
  choice: దాక్కొని ఉన్న
  rationale: హిత్పయేల్ వర్తమాన కృదంతం కొనసాగుతున్న దాగిన స్థితిని సూచిస్తుంది.
- source_word: בְשֹׁמְרוֹן
  choice: సమరయలో
  rationale: ב ఇక్కడ స్థలాన్ని సూచిస్తుంది; శోమ్రోను అనే స్థలనామానికి సహజమైన తెలుగు రూపం ‘సమరయ’.
- source_word: וַיְבִאֻהוּ אֶל יֵהוּא
  choice: యెహూ దగ్గరికి తీసుకొచ్చి
  rationale: హిఫీల్ రూపంలోని בוא ‘తీసుకురావడం’ అని అర్థం; తెలుగులో సహజమైన కథన రూపాన్ని వాడాం.
- source_word: וַיְמִתֻהוּ
  choice: చంపారు
  rationale: מות యొక్క కారణార్థక రూపం ‘మరణానికి గురిచేయడం’ అనే భావం ఇస్తుంది. ప్రధాన వాక్యంలో సహజమైన ‘చంపారు’ను వాడి, కారణార్థక సూక్ష్మతను పాదసూచికలో తెలిపాం.
- source_word: וַיִּקְבְּרֻהוּ
  choice: అతణ్ణి పాతిపెట్టారు
  rationale: קברకు సూటిగా, సహజంగా సరిపోయే తెలుగు ప్రయోగం.
- source_word: כִּי אָמְרוּ
  choice: ఎందుకంటే ... అని వారు అన్నారు
  rationale: כִּי ఇక్కడ అతణ్ణి పాతిపెట్టడానికి గల కారణాన్ని పరిచయం చేస్తుంది.
- source_word: בֶּן יְהוֹשָׁפָט הוּא
  choice: ఇతడు ... యెహోషాపాతు కుమారుడు
  rationale: క్రియలేని హీబ్రూ వాక్యాన్ని ప్రత్యక్ష ఉక్తి తక్షణత్వంతో సహజమైన తెలుగులో వ్యక్తం చేశాం.
- source_word: אֲשֶׁר דָּרַשׁ אֶת יְהוָה
  choice: యాహ్వేను వెదికిన
  rationale: దేవునితో వాడిన דרש భక్తితో ఆయనను ఆశ్రయించడం, వెదకడం అనే భావం కలిగి ఉంది; ‘వెదికిన’ మూలంలోని పునరుక్తిని కూడా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: בְּכָל לְבָבוֹ
  choice: తన పూర్ణహృదయంతో
  rationale: ఇది సంపూర్ణ నిబద్ధతను తెలిపే నిబంధనాత్మక నుడికారం; ‘పూర్ణహృదయంతో’ గౌరవప్రదంగా, సంక్షిప్తంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: וְאֵין לְבֵית אֲחַזְיָהוּ לַעְצֹר כֹּחַ לְמַמְלָכָה
  choice: అహజ్యా వంశానికి రాజ్యాన్ని నిలబెట్టే శక్తి లేకపోయింది
  rationale: בֵּיתను రాజవంశ భావంలో ‘వంశం’గా, עצר־כחను రాజ్యాధికారాన్ని నిలబెట్టగల సామర్థ్యంగా అనువదించాం; ఎవరు పాలించగలరనే విషయాన్ని మూలం కంటే ఎక్కువగా నిర్దిష్టం చేయలేదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగు లిపిలో సూచించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: అహజ్యా వంశానికి సంబంధించిన చివరి ఉపవాక్య భావం
  choice: రాజ్యాన్ని నిలబెట్టే శక్తి లేకపోవడం
  alternative: పాలించగల వ్యక్తి లేకపోవడం; రాజ్యాధికారాన్ని చేపట్టే బలం లేకపోవడం
  rationale: హీబ్రూ వాక్యం అహజ్యా ఇంటికి/వంశానికి రాజ్యానికి సంబంధించి כוח లేదని చెబుతుంది. నిర్దిష్ట వారసుడు లేడని స్పష్టంగా చెప్పకుండా, రాజ్యాన్ని నిలబెట్టలేని వంశపరమైన అసమర్థతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. హీబ్రూలోని ఏకవచన ‘అతడు’ మరియు తరువాతి బహువచన ‘వారు’ మధ్య మార్పును అలాగే నిలిపాం. ‘అహజ్యా ఇల్లు’ అనే అక్షరార్థం తెలుగులో అపార్థం కలిగించవచ్చు కాబట్టి రాజవంశ భావాన్ని ‘అహజ్యా వంశం’గా వ్యక్తం చేశాం.
