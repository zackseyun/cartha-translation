  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֤א אֵלָי/ו֙ מִכְתָּ֔ב מֵֽ/אֵלִיָּ֥הוּ הַ/נָּבִ֖יא לֵ/אמֹ֑ר כֹּ֣ה אָמַ֣ר יְהוָ֗ה אֱלֹהֵי֙ דָּוִ֣יד אָבִ֔י/ךָ תַּ֗חַת אֲשֶׁ֤ר לֹֽא הָלַ֨כְתָּ֙ בְּ/דַרְכֵי֙ יְהוֹשָׁפָ֣ט אָבִ֔י/ךָ וּ/בְ/דַרְכֵ֖י אָסָ֥א מֶֽלֶךְ יְהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/012.yaml
  text: 'Then a letter came to him from Elijah the prophet[a], saying, “Thus says Yahweh, the God of David your father: Because you have not walked in the ways of Jehoshaphat your father or in the ways of Asa king of Judah,”'
translation:
  language: te
  text: 'అప్పుడు ఏలీయా ప్రవక్త నుండి అతనికి ఒక ఉత్తరం వచ్చింది. అందులో ఇలా ఉంది: “నీ పూర్వికుడైన దావీదు దేవుడైన యాహ్వే ఇలా అంటున్నాడు: నీవు నీ తండ్రి యెహోషాపాతు మార్గాల్లోగానీ, యూదా రాజైన ఆసా మార్గాల్లోగానీ[a] నడవలేదు కాబట్టి—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా “మరియు” ఉంది; నిషేధ వాక్యంలో దాని భావం “ఇందులోగానీ, అందులోగానీ కాదు” అని ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֵלָיו מִכְתָּב
  choice: అతనికి ఒక ఉత్తరం వచ్చింది
  rationale: מִכְתָּב అనే కర్తతో వచ్చిన ‘వచ్చింది’ అనే నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מֵאֵלִיָּהוּ הַנָּבִיא
  choice: ఏలీయా ప్రవక్త దగ్గరనుండి
  rationale: వ్యక్తిపేరును సాంప్రదాయ తెలుగు రూపంలో లిప్యంతరీకరించి, ప్రవక్త అనే బిరుదును నేరుగా అనువదిస్తుంది.
- source_word: לֵאמֹר
  choice: అందులో ఇలా ఉంది
  rationale: ఉత్తరంలోని సందేశాన్ని పరిచయం చేసే సందర్భంలో తెలుగు వాడుకకు సహజంగా ఉండి, తరువాతి ప్రత్యక్ష ఉల్లేఖనానికి దారి తీస్తుంది.
- source_word: כֹּה אָמַר יְהוָה
  choice: యెహోవా ఇలా అంటున్నాడు
  rationale: ప్రవక్తల సందేశ సూత్రంలోని అధికారిక భావాన్ని సహజమైన వర్తమాన తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהֵי דָּוִיד אָבִיךָ
  choice: నీ పితరుడైన దావీదు దేవుడు
  rationale: ఇక్కడ אָבִיךָ వంశపూర్వికుడైన దావీదును సూచిస్తుంది; ‘పితరుడు’ ఆ వంశార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: תַּחַת אֲשֶׁר
  choice: కాబట్టి
  rationale: తరువాత ప్రకటించబోయే తీర్పుకు కారణాన్ని పరిచయం చేసే సందర్భోచిత కారణార్థాన్ని తెలుగులో సంక్షిప్తంగా అందిస్తుంది.
- source_word: לֹא הָלַכְתָּ בְּדַרְכֵי
  choice: మార్గాల్లోగానీ … మార్గాల్లోగానీ నడవలేదు
  rationale: ‘నడవడం’ అనే హీబ్రూ జీవనప్రవర్తన రూపకాన్ని నిలుపుతూ, రెండు ఆదర్శాల్లో దేనినీ అనుసరించలేదనే నిషేధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוֹשָׁפָט אָבִיךָ
  choice: నీ తండ్రి యెహోషాపాతు
  rationale: యెహోషాపాతు యెహోరాముకు ప్రత్యక్ష తండ్రి కావడంతో אָבִיךָ ను ‘నీ తండ్రి’ అని నేరుగా అనువదిస్తుంది.
- source_word: אָסָא מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన ఆసా
  rationale: పేరు, రాజబిరుదు, రాజ్యాన్ని సహజమైన తెలుగు క్రమంలో అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న ప్రత్యేక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో నిలుపుతుంది.
- issue: דָּוִיד אָבִיךָ లో బంధుత్వార్థం
  choice: నీ పితరుడైన దావీదు
  alternative: నీ తండ్రియైన దావీదు
  rationale: సంబోధించబడుతున్న రాజుకు దావీదు ప్రత్యక్ష తండ్రి కాదు; אָב విస్తృత వంశపూర్విక అర్థాన్ని ఇక్కడ కలిగి ఉంది. ‘పితరుడు’ ఆ అర్థాన్ని అపార్థం లేకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. ప్రవచన సూత్రానికి అధికారిక ధోరణి నిలుపబడింది. వాక్యం తరువాతి వచనాల్లో కొనసాగుతున్నందున చివర దీర్ఘ విరామచిహ్నం ఉంచబడింది.
