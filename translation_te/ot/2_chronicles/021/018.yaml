  text: And after all this[a], Yahweh struck him in his intestines with an incurable disease.
translation:
  language: te
  text: ఇదంతా జరిగిన తరువాత, యెహోవా అతని పేగుల్లో నయం కాని వ్యాధితో అతనిని బాధించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నివారణ లేని వ్యాధితో”; అక్షరార్థంగా, “నయం లేకుండా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי כָּל זֹאת
  choice: ఇదంతా జరిగిన తరువాత
  rationale: హీబ్రూ కథనంలోని కాలక్రమ సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో చూపిస్తూ, ముందటి సంఘటనలన్నిటినీ సమష్టిగా సూచిస్తుంది.
- source_word: נְגָפ/וֹ
  choice: అతన్ని మొత్తాడు
  rationale: దైవిక దెబ్బ లేదా తీవ్రమైన బాధ కలిగించడాన్ని సూచించే క్రియ బలాన్ని నిలుపుతుంది; వ్యాధి ద్వారా వచ్చిన తీర్పును అతిగా వివరిస్తూ పోదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలోని దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా ఉంచుతుంది.
- source_word: בְּ/מֵעָי/ו
  choice: అతని పేగుల్లో
  rationale: మֵעֶה ఇక్కడ అంతర్గత అవయవాలను, ముఖ్యంగా పేగులను సూచిస్తుంది; 'పేగులు' ఆధునిక పాఠకులకు స్పష్టమైన శరీర నిర్మాణ పదం.
- source_word: לָ/חֳלִי
  choice: వ్యాధితో
  rationale: తీవ్రమైన శారీరక రుగ్మతను సూచిస్తూ, హీబ్రూ సంబంధాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: לְ/אֵין מַרְפֵּא
  choice: నయం కాని
  rationale: అక్షరార్థంగా 'స్వస్థత లేకుండా' అనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది; చికిత్స లేదా ఉపశమన సాధ్యత లేదనే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవ నామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: వచనంలో బిరుదు కాకుండా చతురక్షర దైవ నామమే ఉంది. అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన నామరూపంతో ఉంచాం.
- issue: దైవిక చర్య యొక్క ప్రత్యక్షత
  choice: యెహోవా ... అతన్ని మొత్తాడు
  alternative: అతనికి వ్యాధి కలిగింది
  rationale: హీబ్రూ వాక్యం యెహోవానే చర్యకు కర్తగా ప్రత్యక్షంగా పేర్కొంటుంది; ఆ ధార్మిక ఉద్రిక్తతను మృదువుచేయకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే కథనంలోని గంభీరతను నిలుపుతూ రూపొందించబడింది. 'మొత్తాడు' మూల క్రియ బలాన్ని, 'పేగుల్లో' శరీర సంబంధిత స్పష్టతను కాపాడుతాయి.
