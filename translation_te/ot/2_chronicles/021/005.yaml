  yaml_path: translation/ot/2_chronicles/021/005.yaml
  text: Jehoram was thirty-two years old when he became king, and he reigned eight years in Jerusalem.
translation:
  language: te
  text: యెహోరాము రాజైనప్పుడు అతనికి ముప్పై రెండు సంవత్సరాలు. అతడు యెరూషలేములో ఎనిమిది సంవత్సరాలు పరిపాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם שָׁנָה
  choice: అతనికి ముప్పై రెండు సంవత్సరాలు
  rationale: హీబ్రూ వయస్సు తెలిపే నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; అక్షరార్థమైన ‘ముప్పై రెండు సంవత్సరాల కుమారుడు’ అనే అసహజ రూపాన్ని నివారిస్తుంది.
- source_word: יְהוֹרָם
  choice: యెహోరాము
  rationale: హీబ్రూ పేరులోని పూర్తి రూపాన్ని ప్రతిబింబించే ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: בְּמָלְכוֹ
  choice: రాజైనప్పుడు
  rationale: בְּ + క్రియానామ రూపం ఇక్కడ అతడు రాజ్యాధికారం చేపట్టిన సమయాన్ని సూచిస్తుంది; ‘రాజైనప్పుడు’ ఆ భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וּשְׁמוֹנֶה שָׁנִים
  choice: ఎనిమిది సంవత్సరాలు
  rationale: పరిపాలనా కాలవ్యవధిని నేరుగా తెలిపే సంఖ్యా పదబంధం.
- source_word: מָלַךְ
  choice: పరిపాలించాడు
  rationale: రాజుగా పాలించడం అనే క్రియార్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: స్థలార్థక בְּ ఉపసర్గను ‘లో’తో వ్యక్తం చేసి, అతని పరిపాలన జరిగిన రాజధానిని సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: సరళమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. హీబ్రూ రాజుల వయస్సు–పరిపాలన సూత్రరూపాన్ని సహజ తెలుగు వాక్య నిర్మాణంలో రెండు వాక్యాలుగా అందించింది.
