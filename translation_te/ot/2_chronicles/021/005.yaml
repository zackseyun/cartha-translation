  text: בֶּן שְׁלֹשִׁ֥ים וּ/שְׁתַּ֛יִם שָׁנָ֖ה יְהוֹרָ֣ם בְּ/מָלְכ֑/וֹ וּ/שְׁמוֹנֶ֣ה שָׁנִ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָֽם־׃
base_translation:
