source:
  edition: WLC
  text: וַ/יַּעֲל֤וּ בִֽ/יהוּדָה֙ וַ/יִּבְקָע֔וּ/הָ וַ/יִּשְׁבּ֗וּ אֵ֤ת כָּל הָ/רְכוּשׁ֙ הַ/נִּמְצָ֣א לְ/בֵית הַ/מֶּ֔לֶךְ וְ/גַם בָּנָ֖י/ו וְ/נָשָׁ֑י/ו וְ/לֹ֤א נִשְׁאַר ל/וֹ֙ בֵּ֔ן כִּ֥י אִם יְהוֹאָחָ֖ז קְטֹ֥ן בָּנָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/017.yaml
  text: They came up against Judah and invaded it[a], and carried away all the possessions found in the king’s house, and also his sons and his wives, so that no son was left to him except Jehoahaz, the youngest of his sons.
translation:
  language: te
  text: వారు యూదా దేశం మీదికి వచ్చి దానిలోకి చొచ్చుకుపోయారు. రాజభవనంలో దొరికిన ఆస్తినంతటినీ, అతని కుమారులను, భార్యలను కూడా చెరగా తీసుకుపోయారు. దాంతో అతని కుమారులందరిలో చిన్నవాడైన యెహోయాహాజు[a] తప్ప మరే కుమారుడూ అతనికి మిగలలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యెహోయాహాజు అనే వ్యక్తినే ఇతర చోట్ల అహజ్యా అని పిలిచినట్లు కనిపిస్తుంది (2 రాజులు 8:24–26; 2 దినవృత్తాంతాలు 22:1 చూడండి).
    reason: సమాంతర వచనాల్లో కనిపించే ప్రత్యామ్నాయ పేరు లేదా గుర్తింపును తెలియజేయడం.
lexical_decisions:
- source_word: וַיַּעֲלוּ בִיהוּדָה
  choice: వారు యూదా దేశం మీదికి వచ్చి
  rationale: సైనిక సందర్భంలో עלה + ב శత్రుత్వంతో ఒక ప్రాంతం మీదికి రావడాన్ని సూచిస్తుంది. ‘మీదికి వచ్చి’ అనే ప్రయోగం గమనాన్ని, దాడి సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּבְקָעוּהָ
  choice: దానిలోకి చొచ్చుకుపోయారు
  rationale: בקע యొక్క ప్రాథమిక భావం చీల్చడం లేదా బలవంతంగా తెరవడం. యూదా దేశాన్ని సూచించే స్త్రీలింగ కర్మతో ఇక్కడ రక్షణలను ఛేదించి లోనికి ప్రవేశించారనే అర్థం వస్తుంది.
- source_word: וַיִּשְׁבּוּ
  choice: చెరగా తీసుకుపోయారు
  rationale: שבה సాధారణంగా చెరపట్టడాన్ని సూచిస్తుంది. ఇక్కడ ఆస్తితో పాటు రాజకుటుంబ సభ్యులు కూడా కర్మలుగా ఉన్నందున, దోచుకొని బందీలుగా తీసుకుపోయిన భావాన్ని ఈ ఎంపిక నిలుపుతుంది.
- source_word: כָּל הָרְכוּשׁ
  choice: ఆస్తినంతటినీ
  rationale: רכוש కదిలించగల సంపద, సొత్తు లేదా ఆస్తిని సూచిస్తుంది. రాజభవనంలోని సంపదకు ‘ఆస్తి’ విస్తృతమైన, సహజమైన తెలుగు పదం.
- source_word: הַנִּמְצָא לְבֵית הַמֶּלֶךְ
  choice: రాజభవనంలో దొరికిన
  rationale: נמצא అంటే దొరికిన లేదా అక్కడ ఉన్నది. בית המלך సందర్భానుసారంగా రాజు నివసించే భవనం, అంటే రాజభవనం.
- source_word: וְגַם בָּנָיו וְנָשָׁיו
  choice: అతని కుమారులను, భార్యలను కూడా
  rationale: גם జాబితాకు అదనపు అంశాలను నొక్కిచెబుతుంది; తెలుగులో ‘కూడా’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וְלֹא נִשְׁאַר לוֹ בֵּן
  choice: మరే కుమారుడూ అతనికి మిగలలేదు
  rationale: שאר నిఫాల్ రూపం మిగిలి ఉండడాన్ని తెలియజేస్తుంది. మినహాయింపుతో కలిసి ‘మరే ... మిగలలేదు’ సహజమైన ఫలితార్థాన్ని ఇస్తుంది.
- source_word: כִּי אִם
  choice: తప్ప
  rationale: ఇక్కడ כי אם ఏకైక మినహాయింపును పరిచయం చేస్తుంది; ‘తప్ప’ స్పష్టమైన ఆధునిక తెలుగు సమానం.
- source_word: יְהוֹאָחָז
  choice: యెహోయాహాజు
  rationale: మసొరెటిక్ పాఠంలోని పేరును ప్రధాన వాక్యంలో యథాతథంగా అనుసరిస్తుంది; సమాంతర వచనాల్లోని అహజ్యా అనే గుర్తింపును పాదసూచికలో ఇస్తుంది.
- source_word: קְטֹן בָּנָיו
  choice: అతని కుమారుల్లో చిన్నవాడైన
  rationale: కుటుంబ సందర్భంలో קטן శరీర పరిమాణాన్ని కాక వయస్సులో చిన్నవాడిని సూచిస్తుంది.
theological_decisions:
- issue: యెహోరాము వద్ద మిగిలిన కుమారుని పేరు
  choice: ప్రధాన పాఠంలో మసొరెటిక్ పాఠంలోని ‘యెహోయాహాజు’ అనే పేరును ఉంచడం
  alternative: సమాంతర వచనాల ఆధారంగా ‘అహజ్యా’ అని పేర్కొనడం
  rationale: ఇది సిద్ధాంతపరమైన నిర్ణయం కంటే పాఠాంతర, కథన గుర్తింపు అంశం. మూలభాషా పాఠానికి ప్రాధాన్యమిస్తూ ప్రధాన వాక్యంలో యెహోయాహాజు అని ఉంచి, సంబంధిత వచనాల్లోని అహజ్యా గుర్తింపును పారదర్శకంగా పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘చొచ్చుకుపోయారు’ అనే పదం בקע లోని రక్షణలను ఛేదించి ప్రవేశించిన భావాన్ని, అతిగా సాంకేతికంగా కాకుండా నిలుపుతుంది. పాదసూచిక గుర్తు సంబంధిత ‘యెహోయాహాజు’ పేరుకు వెంటనే ఉంచబడింది.
