    rationale: పాదసూచిక యెహోయాహాజు/అహజ్యా అనే పేరుకు సంబంధించినది కాబట్టి గుర్తును ‘యెహోయాహాజు’ వెంటనే ఉంచడం స్పష్టమైన యాంకరింగ్‌ను ఇస్తుంది.
