revisions:
- from: వారు యూదా దేశం మీదికి వచ్చి దానిలోకి చొచ్చుకుపోయారు. రాజభవనంలో దొరికిన ఆస్తినంతటినీ, అతని కుమారులను, భార్యలను కూడా చెరగా తీసుకుపోయారు. దాంతో అతని కుమారుల్లో చిన్నవాడైన యెహోయాహాజు తప్ప మరే కుమారుడూ అతనికి మిగలలేదు.[a]
  to: వారు యూదా దేశం మీదికి వచ్చి దానిలోకి చొచ్చుకుపోయారు. రాజభవనంలో దొరికిన ఆస్తినంతటినీ, అతని కుమారులను, భార్యలను కూడా చెరగా తీసుకుపోయారు. దాంతో అతని కుమారులందరిలో చిన్నవాడైన యెహోయాహాజు[a] తప్ప మరే కుమారుడూ అతనికి మిగలలేదు.
  rationale: 'అర్థంలో మార్పు చేయకుండా రెండు స్వల్ప సవరణలు చేశాం: పాదసూచిక గుర్తును సంబంధిత పేరుకు వెంటనే తరలించాం; అలాగే హెబ్రీలోని ‘అతని కుమారులలో చిన్నవాడు’ అనే భావాన్ని ‘అతని కుమారులందరిలో చిన్నవాడైన’ అని మరింత స్పష్టంగా చేశాం. వివాదాస్పదమైన పేరు గుర్తింపును ప్రధాన పాఠంలో పరిష్కరించకుండా, మూలపాఠంలోని యెహోయాహాజు పేరునే నిలిపి పాదసూచికలో పారదర్శకంగా సూచించాం.'
