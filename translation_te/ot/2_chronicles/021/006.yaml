id: 2CH.21.6
reference: 2 Chronicles 21:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֜לֶךְ בְּ/דֶ֣רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֤ר עָשׂוּ֙ בֵּ֣ית אַחְאָ֔ב כִּ֚י בַּת אַחְאָ֔ב הָ֥יְתָה לּ֖/וֹ אִשָּׁ֑ה וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/006.yaml
  text: He walked in the way of the kings of Israel, as the house of Ahab had done, for Ahab’s daughter was his wife; and he did what was evil in the eyes of Yahweh.
translation:
  language: te
  text: అతడు ఇశ్రాయేలు రాజుల మార్గంలో నడిచాడు. అహాబు ఇంటివారు[a] చేసినట్లే అతడూ చేశాడు, ఎందుకంటే అహాబు కుమార్తె అతనికి భార్యగా ఉండేది. అతడు యాహ్వే దృష్టికి చెడైనది చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అహాబు ఇంటివారు’ అంటే అతని కుటుంబం లేదా రాజవంశం.
    reason: בֵּית అనే పదానికి ఈ రాజసంబంధ సందర్భంలో కుటుంబం, గృహం, వంశం అనే పరస్పర సంబంధిత అర్థాలు ఉన్నాయి.
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: మార్గంలో నడిచాడు
  rationale: ప్రవర్తన లేదా జీవన విధానాన్ని సూచించే హీబ్రూ రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజులు
  rationale: ఉత్తర రాజ్యపు పాలకులను సూచించే సరళమైన అనువాదం.
- source_word: בֵּית אַחְאָב
  choice: అహాబు ఇంటివారు
  rationale: రాజవంశ సందర్భంలో בַּיִת కుటుంబాన్ని లేదా వంశాన్ని సూచించగలదు; ‘ఇంటివారు’ మూలంలోని గృహ రూపకాన్ని ఉంచుతూ సమూహ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: అతడు అహాబు ఇంటివారి ప్రవర్తనను అనుసరించడానికి గల కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: בַּת אַחְאָב הָיְתָה לּוֹ אִשָּׁה
  choice: అహాబు కుమార్తె అతని భార్య
  rationale: వివాహ బంధాన్ని నేరుగా తెలుపుతుంది; ఈ సందర్భంలో వివాహం అప్పుడే జరిగిందనే భావాన్ని కలిగించదు.
- source_word: וַיַּעַשׂ הָרַע
  choice: అతడు చెడ్డది చేశాడు
  rationale: నిర్దిష్ట పదబంధమైన הָרַעను ‘చెడ్డది’గా ప్రతిబింబించి, హీబ్రూ వాక్య నిర్మాణానికి దగ్గరగా ఉంటుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యాహ్వే దృష్టిలో
  rationale: దైవిక మూల్యాంకనాన్ని తెలిపే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగు రూపంలో అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు అనుగుణంగా ‘యాహ్వే’ అని లిప్యంతరీకరించబడింది.
- issue: అహాబు ‘ఇల్లు’ అనే రాజవంశ పదబంధం
  choice: అహాబు ఇంటివారు
  alternative: అహాబు వంశం
  rationale: ఈ పదం కుటుంబం, రాజకుటుంబం లేదా వంశాన్ని సూచించవచ్చు. ‘ఇంటివారు’ అనే రూపం ఆ విస్తృతిని పూర్తిగా ఒకే అర్థానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘మార్గంలో నడిచాడు’ అనే నైతిక రూపకం మరియు ‘దృష్టిలో’ అనే మూల్యాంకన నుడికారం నిలుపబడ్డాయి.
