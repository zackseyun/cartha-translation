revisions:
- from: అలా ఎదోము తిరుగుబాటు చేసి[a] యూదా ఆధిపత్యం నుంచి బయటపడింది[b]; నేటివరకు అలాగే ఉంది. ఆ సమయంలో లిబ్నా కూడా తిరుగుబాటు చేసి అతని ఆధిపత్యం నుంచి బయటపడింది. ఎందుకంటే అతడు తన పూర్వీకుల దేవుడైన యెహోవాను విడిచిపెట్టాడు[c].
  to: ఎదోము యూదా అధికారం నుంచి తిరుగుబాటు చేసింది[a]; అది ఈ దినం వరకు అలాగే ఉంది[b]. ఆ సమయంలో లిబ్నా కూడా యెహోరాము అధికారం నుంచి తిరుగుబాటు చేసింది, ఎందుకంటే అతడు తన పూర్వీకుల దేవుడైన యెహోవాను విడిచిపెట్టాడు[c].
  rationale: The revision removes an unsupported discourse adverb, renders the political idiom more directly, and makes Jehoram the referent of the second possessive expression explicit. The causal clause and its footnote retain the source's interpretive scope without resolving the syntactic ambiguity.
