id: 2CH.21.10
reference: 2 Chronicles 21:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּפְשַׁ֨ע אֱד֜וֹם מִ/תַּ֣חַת יַד יְהוּדָ֗ה עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה אָ֣ז תִּפְשַׁ֥ע לִבְנָ֛ה בָּ/עֵ֥ת הַ/הִ֖יא מִ/תַּ֣חַת יָד֑/וֹ כִּ֣י עָזַ֔ב אֶת יְהוָ֖ה אֱלֹהֵ֥י אֲבֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/010.yaml
  text: So Edom rebelled from under the hand of Judah to this day[a]. At that time Libnah also rebelled from under his hand, because he had forsaken Yahweh[c][b], the God of his fathers.
translation:
  language: te
  text: ఎదోము యూదా అధికారం నుంచి తిరుగుబాటు చేసింది[a]; అది ఈ దినం వరకు అలాగే ఉంది[b]. ఆ సమయంలో లిబ్నా కూడా యెహోరాము అధికారం నుంచి తిరుగుబాటు చేసింది, ఎందుకంటే అతడు తన పూర్వీకుల దేవుడైన యెహోవాను విడిచిపెట్టాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తిరుగుబాటు చేసింది’ అనే మాటను ‘ఎదురు తిరిగింది’ లేదా ‘విడిపోయింది’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘యూదా చేతి కిందనుండి,’ అలాగే ‘అతని చేతి కిందనుండి’ అని ఉంది. ఇది పాలన లేదా నియంత్రణ నుంచి బయటపడడాన్ని సూచించే నుడికారం.
    reason: cultural_note
  - marker: c
    text: ఈ కారణ వాక్యం యెహోరాముకు ఎదురైన కష్టాలన్నిటినీ సాధారణంగా వివరించవచ్చు; లేదా మరింత సంకుచితంగా లిబ్నా తిరుగుబాటుకు మాత్రమే కారణాన్ని తెలియజేయవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְשַׁע / תִּפְשַׁע (פשע)
  choice: తిరుగుబాటు చేసి
  rationale: రాజకీయ సందర్భంలో ఈ క్రియ అధికారానికి వ్యతిరేకంగా తిరగబడడాన్ని సూచిస్తుంది. ‘తిరుగుబాటు’ అనే పదం ఎదోము, లిబ్నా రెండింటికీ సహజంగా సరిపోతూ మూలంలోని బలాన్ని నిలుపుతుంది.
- source_word: מִתַּחַת יַד / מִתַּחַת יָדוֹ
  choice: ఆధిపత్యం నుంచి బయటపడింది
  rationale: అక్షరార్థంగా ‘చేతి కిందనుండి’ అనే హీబ్రూ నుడికారం పాలన లేదా నియంత్రణ నుంచి బయటపడడాన్ని సూచిస్తుంది. తెలుగులో భావం స్పష్టంగా ఉండేందుకు సహజమైన నుడికారంతో అనువదించబడింది.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: రాజ్యం/గోత్రం పేరుకు ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటివరకు అలాగే ఉంది
  rationale: తిరుగుబాటు వల్ల ఏర్పడిన పరిస్థితి రచయిత కాలం వరకూ కొనసాగిందనే హీబ్రూ కాలసూత్ర భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אָז
  choice: ఆ సమయంలో
  rationale: ఎదోము తిరుగుబాటుతో సంబంధమున్న కాలంలోనే లిబ్నా తిరుగుబాటు జరిగిందని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִבְנָה
  choice: లిబ్నా
  rationale: స్థల నామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: చివరి వాక్యభాగం ముందు చెప్పిన రాజకీయ కష్టాలకు కారణాన్ని సూచిస్తుంది; దాని పరిధిని ప్రధాన పాఠంలో మరీ నిర్దిష్టం చేయకుండా ఉంచుతుంది.
- source_word: עָזַב
  choice: విడిచిపెట్టాడు
  rationale: యెహోవాతో సంబంధాన్ని త్యజించడంలోని గంభీరతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: తన పూర్వీకుల దేవుడు
  rationale: ‘తన తండ్రుల దేవుడు’ అనే మూలభావాన్ని ఆధునిక తెలుగు పాఠకులకు సహజంగా, సమగ్రంగా తెలియజేస్తుంది.
theological_decisions:
- issue: తిరుగుబాట్లకు కారణంగా చివరి వాక్యభాగం పరిధి
  choice: ‘ఎందుకంటే’ అనే కారణసూచక అనుసంధానాన్ని నిలిపి, అది యెహోరాము కష్టాలను సాధారణంగా వివరిస్తుందా లేక ముఖ్యంగా లిబ్నా తిరుగుబాటునే వివరిస్తుందా అన్నది ప్రధాన పాఠంలో నిర్ణయించకుండా ఉంచడం
  alternative: యెహోరాము యెహోవాను విడిచిపెట్టినందువల్ల లిబ్నా మాత్రమే తిరుగుబాటు చేసిందని స్పష్టీకరించడం
  rationale: హీబ్రూ వాక్యనిర్మాణంలో చివరి కారణ వాక్యం లిబ్నా వాక్యానికి దగ్గరగా ఉన్నా, దినవృత్తాంతాల గ్రంథంలోని విస్తృత ధార్మిక దృక్కోణంలో రెండు రాజకీయ పరిణామాలనూ వివరించవచ్చు. అందువల్ల నిజమైన పరిధి సందిగ్ధతను పాదసూచికలో గుర్తించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. హీబ్రూ ‘చేతి కిందనుండి’ అనే నుడికారాన్ని ప్రధాన పాఠంలో సహజమైన ‘ఆధిపత్యం నుంచి బయటపడింది’గా ఇచ్చి, మూలచిత్రాన్ని పాదసూచికలో భద్రపరిచాం. రాజకీయ తిరుగుబాటు బలం మరియు చివరి కారణ వాక్యంలోని ధార్మిక ఉద్రిక్తత రెండింటినీ నిలిపాం.
