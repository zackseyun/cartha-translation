source:
  edition: WLC
  text: וַ/יָּ֨עַר יְהוָ֜ה עַל יְהוֹרָ֗ם אֵ֣ת ר֤וּחַ הַ/פְּלִשְׁתִּים֙ וְ/הָ֣/עַרְבִ֔ים אֲשֶׁ֖ר עַל יַ֥ד כּוּשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/016.yaml
  text: And Yahweh stirred up against Jehoram the spirit of the Philistines and of the Arabians who were near the Cushites[a][b][c].
translation:
  language: te
  text: యెహోవా ఫిలిష్తీయులను, కూషీయుల సమీపంలో ఉన్న అరబ్బీయులను యెహోరాముకు విరోధంగా ప్రేరేపించాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రేరేపించాడు’ అనే మాటకు ‘రేకెత్తించాడు’ లేదా ‘పురికొల్పాడు’ అని కూడా అనువదించవచ్చు. హీబ్రూలో ‘ఆత్మ/స్ఫూర్తి’ అనే పదం ఉంది; ఇక్కడ అది ఈ ప్రజలను చర్యకు నడిపించిన వైఖరి లేదా ప్రేరణను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘కూషీయుల పక్కన ఉన్న’ అని కూడా అనువదించవచ్చు. ఈ మాట అరబ్బీయులు కూషీయులకు భౌగోళికంగా సమీపంలో ఉన్నారని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַר
  choice: రేపాడు
  rationale: ఈ క్రియ ఆయా జనులు యెహోరాముకు విరోధంగా లేచేలా యెహోవా వారిని ప్రేరేపించాడనే క్రియాశీల కారణత్వాన్ని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో అందించింది.
- source_word: עַל יְהוֹרָם
  choice: యెహోరాముకు విరోధంగా
  rationale: శత్రుత్వాన్ని సూచించే సందర్భంలో עַל అనే సంబంధబోధకానికి ‘విరోధంగా’ సహజమైన అర్థం.
- source_word: רוּחַ
  choice: శత్రుత్వ ఆవేశం
  rationale: רוּחַ ఇక్కడ ‘ఆత్మ’ అనే మూర్తిమత్వ చిత్రాన్ని కలిగి ఉన్నప్పటికీ, ప్రజలను చర్యకు నడిపే అంతరంగ ప్రేరణ లేదా వైఖరిని సూచిస్తుంది. ‘శత్రుత్వ ఆవేశం’ ఈ సందర్భార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, దాని ప్రేరక శక్తిని నిలుపుతుంది.
- source_word: הַפְּלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ఈ ప్రాచీన జనసమూహానికి తెలుగులో ప్రామాణికంగా వాడే పేరు.
- source_word: וְהָעַרְבִים
  choice: అరబ్బీయులు
  rationale: ఆధునిక జాతీయ గుర్తింపుతో అనవసరంగా కలపకుండా, ప్రాచీన జనసమూహాన్ని సూచించే సహజమైన తెలుగు రూపం.
- source_word: אֲשֶׁר עַל יַד כּוּשִׁים
  choice: కూషీయుల సమీపంలో ఉన్న
  rationale: עַל יַד అనే నుడికారం ఈ భౌగోళిక సందర్భంలో ‘పక్కన/సమీపంలో’ అనే స్థానార్థాన్ని అత్యంత సహజంగా ఇస్తుంది; రాజకీయ అధీనతను తప్పనిసరిగా సూచించదు.
theological_decisions:
- issue: యెహోరాముకు విరోధంగా ఇతర జనులను లేపడంలో యెహోవా కారణత్వం
  choice: యెహోవా వారి శత్రుత్వ ఆవేశాన్ని రేపాడని ప్రత్యక్షంగా పేర్కొనడం
  alternative: యెహోవా అప్పటికే ఉన్న శత్రుత్వం బయటపడటానికి కేవలం అనుమతించాడని చెప్పడం
  rationale: హీబ్రూ క్రియ ఈ చర్యను నేరుగా యెహోవాకే ఆపాదిస్తుంది. అందువల్ల దాన్ని కేవలం అనుమతిగా మృదువుపరచకుండా, అలాగే వాక్యం ఇవ్వని అదనపు తాత్త్విక వివరణను చేర్చకుండా అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి ఉపయోగించబడింది. ‘ఆత్మ’ అనే అక్షరార్థ రూపం తెలుగులో ఈ సందర్భంలో అస్పష్టంగా ఉండే అవకాశం ఉన్నందున, רוּחַ యొక్క ప్రేరక వైఖరి/ఆవేశ భావాన్ని ‘శత్రుత్వ ఆవేశం’గా అందించింది. రెండు జనసమూహాలపైనా ఒకే రוּחַ పదం వ్యాకరణపరంగా వర్తిస్తుందనే నిర్మాణాన్ని ‘...లోనూ ...లోనూ’ అనే సమాంతర నిర్మాణంతో స్పష్టం చేసింది.
