source:
  edition: WLC
  text: וְ/לֽ/וֹ אַחִ֞ים בְּנֵ֣י יְהוֹשָׁפָ֗ט עֲזַרְיָ֤ה וִֽ/יחִיאֵל֙ וּ/זְכַרְיָ֣הוּ וַ/עֲזַרְיָ֔הוּ וּ/מִיכָאֵ֖ל וּ/שְׁפַטְיָ֑הוּ כָּל אֵ֕לֶּה בְּנֵ֥י יְהוֹשָׁפָ֖ט מֶ֥לֶךְ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/002.yaml
  text: 'And he had brothers[a], the sons of Jehoshaphat: Azariah, Jehiel, Zechariah, Azariahu, Michael, and Shephatiah[b]. All these were the sons of Jehoshaphat king of Israel.'
translation:
  language: te
  text: 'అతనికి యెహోషాపాతు కుమారులైన సోదరులు ఉన్నారు: అజర్యా, యెహీయేలు, జెకర్యా, అజర్యాహు[b], మిఖాయేలు, షెఫట్యా. వీరందరూ ఇశ్రాయేలు రాజైన యెహోషాపాతు కుమారులు[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘ఇశ్రాయేలు రాజు’ అని ఉంది. యెహోషాపాతు సాధారణంగా యూదా రాజుగా గుర్తింపబడతాడు; ఇక్కడ దినవృత్తాంతాలు ‘ఇశ్రాయేలు’ అనే పేరును విస్తృతమైన నిబంధన-ప్రజల భావంలో ఉపయోగించి ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: మొదటి ‘అజర్యా’ పేరుతో పోలిస్తే నాలుగవ పేరు హీబ్రూలో భిన్నమైన చివరి రూపంతో ఉంది; ఆ భేదాన్ని ‘అజర్యాహు’గా నిలిపాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֽ/וֹ אַחִים
  choice: అతనికి ... సోదరులు ఉన్నారు
  rationale: ‘అతనికి సోదరులు’ అనే స్వామ్యార్థక హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בְּנֵי יְהוֹשָׁפָט
  choice: యెహోషాపాతు కుమారులైన
  rationale: సోదరులు ఎవరో స్పష్టంగా గుర్తిస్తూ, హీబ్రూ వంశావళి సంబంధాన్ని నిలుపుతుంది.
- source_word: עֲזַרְיָה ... וַ/עֲזַרְיָהוּ
  choice: అజర్యా ... అజర్యాహు
  rationale: మూలపాఠంలో ఈ రెండు పేర్ల చివరి రూపాలు భిన్నంగా ఉన్నందున తెలుగులోనూ ఆ భేదాన్ని కాపాడుతుంది.
- source_word: כָּל אֵלֶּה
  choice: వీరందరూ
  rationale: జాబితాలో పేర్కొన్న వ్యక్తులను తిరిగి సూచించే సహజమైన తెలుగు రూపం.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజైన
  rationale: మూల హీబ్రూ పాఠంలోని ‘ఇశ్రాయేలు రాజు’ అనే బిరుదును యూదా అని సవరించకుండా యథాతథంగా అనువదిస్తుంది.
theological_decisions:
- issue: యెహోషాపాతుకు ఇవ్వబడిన מֶלֶךְ יִשְׂרָאֵל అనే బిరుదు
  choice: ఇశ్రాయేలు రాజు
  alternative: యూదా రాజు
  rationale: యెహోషాపాతు చారిత్రకంగా సాధారణంగా యూదా రాజుగా గుర్తింపబడినా, హీబ్రూ మూలపాఠం స్పష్టంగా ‘ఇశ్రాయేలు రాజు’ అని చెబుతుంది. దానిని ‘యూదా’గా మార్చడం పాఠసమన్వయం అవుతుంది; అందువల్ల మూలంలోని ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యనిర్మాణాన్ని ఉపయోగిస్తూ, వంశావళికి తగిన గౌరవప్రదమైన శైలిని నిలిపాం. వ్యక్తిపేర్లను తెలుగు బైబిలు పాఠకులకు గుర్తుపట్టదగిన రూపాల్లో లిప్యంతరీకరించాం; రెండు అజర్యా పేర్ల మధ్య ఉన్న మూలపాఠ భేదాన్ని మాత్రం ఉద్దేశపూర్వకంగా కాపాడాం.
