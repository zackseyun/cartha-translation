id: 2CH.21.7
reference: 2 Chronicles 21:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹא אָבָ֣ה יְהוָ֗ה לְ/הַשְׁחִית֙ אֶת בֵּ֣ית דָּוִ֔יד לְמַ֣עַן הַ/בְּרִ֔ית אֲשֶׁ֥ר כָּרַ֖ת לְ/דָוִ֑יד וְ/כַ/אֲשֶׁ֣ר אָמַ֗ר לָ/תֵ֨ת ל֥/וֹ נִ֛יר וּ/לְ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/007.yaml
  text: Yet Yahweh was not willing to destroy the house of David[a], because of the covenant that he had made with David[c][b], and as he had said that he would give to him and to his sons a lamp for all days.
translation:
  language: te
  text: అయితే యెహోవా దావీదు వంశాన్ని నాశనం చేయడానికి ఇష్టపడలేదు, ఎందుకంటే ఆయన దావీదుతో చేసిన నిబంధనను బట్టి, దావీదుకూ అతని కుమారులకూ ఎల్లకాలం[b] ఒక దీపాన్ని[a] ఇస్తానని ఆయన చెప్పిన ప్రకారం ఆయన అలా చేయలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దీపం” అనే రూపకం దావీదు వంశం లేదా అతని రాజ్యపాలన కొనసాగడాన్ని సూచిస్తున్నట్లు కనిపిస్తుంది. దీనిని “వెలుగు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “అన్ని దినాలు.” సందర్భానుసారంగా దీనిని “ఎల్లప్పుడూ” లేదా “ఎప్పటికీ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אָבָה
  choice: అయితే ... ఇష్టపడలేదు
  rationale: אָבָה సమ్మతి లేదా సంకల్పాన్ని సూచిస్తుంది; సందర్భంలోని వ్యతిరేక భావాన్ని וְ కోసం ‘అయితే’ సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: לְהַשְׁחִית
  choice: నాశనం చేయడానికి
  rationale: హిఫిల్ రూపం దావీదు ఇంటిని పూర్తిగా అంతం చేయడాన్ని సూచిస్తుంది.
- source_word: בֵּית דָּוִיד
  choice: దావీదు వంశం
  rationale: ఇక్కడ ‘ఇల్లు’ అనే హీబ్రూ జాతీయం రాజవంశాన్ని సూచిస్తుంది; ఆధునిక తెలుగు పాఠకునికి భావం స్పష్టంగా ఉండేలా ‘వంశం’ ఎంచుకున్నాం.
- source_word: לְמַעַן הַבְּרִית
  choice: నిబంధనను బట్టి
  rationale: לְמַעַן తెలిపే కారణ సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָּרַת ... לְדָוִיד
  choice: దావీదుతో చేసిన
  rationale: ‘నిబంధనను కోయడం’ అనే హీబ్రూ జాతీయాన్ని తెలుగులో ‘నిబంధన చేయడం’గా సహజంగా అనువదించాం; לְדָוִיד ఇక్కడ సంబంధ భాగస్వామిని సూచిస్తుంది.
- source_word: וְכַאֲשֶׁר אָמַר
  choice: చెప్పాడు
  rationale: ముందుగా పలికిన దేవుని మాటను సూచిస్తుంది; ‘వాగ్దానం చేశాడు’ కంటే మూలంలోని אָמַרకు దగ్గరగా ఉంది.
- source_word: לָתֵת לוֹ נִיר
  choice: దావీదుకు ... ఒక దీపాన్ని ఇస్తానని
  rationale: נִיר అనే రాజవంశ సంబంధ రూపకాన్ని వ్యాఖ్యానించి తొలగించకుండా ‘దీపం’గా నిలిపాం.
- source_word: וּלְבָנָיו
  choice: అతని కుమారులకు
  rationale: హీబ్రూ పదంలోని నిర్దిష్టమైన ‘కుమారులు’ అనే అర్థాన్ని నిలిపాం.
- source_word: כָּל הַיָּמִים
  choice: ఎల్లకాలం
  rationale: అక్షరార్థంగా ‘అన్ని దినాలు’; నిరంతర కాలాన్ని సూచించే సహజమైన తెలుగు పదబంధం.
theological_decisions:
- issue: దావీదు నిబంధన సందర్భంలో נִיר అనే రాజవంశ రూపకం
  choice: దీపం
  alternative: వెలుగు; రాజవంశం
  rationale: దావీదు వంశం, పాలన కొనసాగడాన్ని సూచించే బైబిలీయ రూపకాన్ని ప్రధాన పాఠ్యంలోనే నిలుపుతుంది; దాని భావాన్ని పాదసూచికలో వివరిస్తుంది.
- issue: לוֹ ... וּלְבָנָיו యొక్క వాక్యనిర్మాణ సంబంధం
  choice: దావీదుకు, అతని కుమారులకు ఒక దీపం
  alternative: దావీదుకు ఒక దీపం, అలాగే అతని కుమారులకు
  rationale: ఇద్దరినీ ఒకే వాగ్దానానికి సమాంతర గ్రహీతలుగా చదవడం వాక్యనిర్మాణానికి సహజం; విరామంతో చదివే అవకాశాన్ని పాదసూచికలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలిని ఉపయోగించాం. ‘దీపం’ అనే మూల రూపకాన్ని నిలిపి, ‘దావీదు ఇల్లు’ అనే తెలుగులో అపార్థమయ్యే జాతీయాన్ని సందర్భానుసారంగా ‘దావీదు వంశం’గా ఇచ్చాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
