id: 2CH.21.20
reference: 2 Chronicles 21:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בֶּן שְׁלֹשִׁ֤ים וּ/שְׁתַּ֨יִם֙ הָיָ֣ה בְ/מָלְכ֔/וֹ וּ/שְׁמוֹנֶ֣ה שָׁנִ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וַ/יֵּ֨לֶךְ֙ בְּ/לֹ֣א חֶמְדָּ֔ה וַֽ/יִּקְבְּרֻ֨/הוּ֙ בְּ/עִ֣יר דָּוִ֔יד וְ/לֹ֖א בְּ/קִבְר֥וֹת הַ/מְּלָכִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/020.yaml
  text: He was thirty-two years old when he began to reign[a], and he reigned eight years in Jerusalem. Then he departed with no regret, and they buried him in the city of David, but not in the tombs of the kings.
translation:
  language: te
  text: అతడు రాజైనప్పుడు ముప్పై రెండు సంవత్సరాల వయస్సుగలవాడు. అతడు యెరూషలేములో ఎనిమిది సంవత్సరాలు రాజ్యపాలన చేశాడు. అతడు ఎవరికీ ఇష్టమైనవాడు కాకుండానే[a] కన్నుమూశాడు. వారు అతణ్ణి దావీదు నగరంలో పాతిపెట్టారు; అయితే రాజుల సమాధుల్లో కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని మరణానికి ఎవరూ విచారించకుండా.” హీబ్రూ పదబంధాన్ని మరింత అక్షరార్థంగా అనువదిస్తే, “కోరదగినవాడిగా లేకుండా” లేదా “ఎవరూ అతణ్ణి కోరుకోకుండా” అని కూడా చెప్పవచ్చు.
    reason: హీబ్రూ בְּלֹא חֶמְדָּה పదబంధం ‘కోరిక లేకుండా,’ ‘ప్రియమైనవాడు కాకుండా,’ లేదా సందర్భానుసారం ‘విచారం లేకుండా’ అనే భావాలకు అవకాశం ఇస్తుంది; మూలంలోని సందిగ్ధతను తెలియజేయడానికి.
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם
  choice: ముప్పై రెండు సంవత్సరాల వయస్సుగలవాడు
  rationale: హీబ్రూ వయస్సు సూచించే నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְמָלְכוֹ
  choice: అతడు రాజైనప్పుడు
  rationale: రాజ్యాధికార స్వీకరణ సమయాన్ని సూచించే హీబ్రూ నిర్మాణానికి సహజమైన తెలుగు రూపం.
- source_word: וּשְׁמוֹנֶה שָׁנִים מָלַךְ
  choice: ఎనిమిది సంవత్సరాలు రాజ్యపాలన చేశాడు
  rationale: מָלַךְ అనే ‘రాజుగా పరిపాలించు’ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: స్థలార్థక ప్రయోగాన్ని నేరుగా అనువదిస్తుంది.
- source_word: וַיֵּלֶךְ
  choice: కన్నుమూశాడు
  rationale: మరణాన్ని సూచించే సందర్భానుగత మృదూక్తిని తెలుగులో సహజమైన మృదూక్తితో అందిస్తుంది.
- source_word: בְּלֹא חֶמְדָּה
  choice: ఎవరికీ ప్రియంగా లేకుండానే
  rationale: ‘కోరిక, ప్రీతి, అభిలాషకు పాత్రమైనది’ అనే חֶמְדָּה పదార్థాన్ని కాపాడుతూ, అతని మరణం పట్ల ప్రజలకు విచారం లేకపోయిందనే సందర్భార్థాన్ని అతిగా నిర్ధారించకుండా ఉంచుతుంది.
- source_word: וַיִּקְבְּרֻהוּ
  choice: వారు అతణ్ణి పాతిపెట్టారు
  rationale: బహువచన క్రియను తెలుగులో సహజమైన అనిర్దిష్ట కర్తతో వ్యక్తం చేస్తుంది.
- source_word: בְּעִיר דָּוִיד
  choice: దావీదు నగరంలో
  rationale: ప్రామాణిక స్థలనామ రూపాన్ని నిలుపుతుంది.
- source_word: וְלֹא בְּקִבְרוֹת הַמְּלָכִים
  choice: అయితే రాజుల సమాధుల్లో కాదు
  rationale: రాజవంశపు సమాధుల సందర్భంలో קִבְרוֹת కు ‘సమాధులు’ సహజమైన తెలుగు పదం; వ్యతిరేకతను స్పష్టంగా చూపుతుంది.
