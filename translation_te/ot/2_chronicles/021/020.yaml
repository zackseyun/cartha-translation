  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే చారిత్రక వృత్తాంతానికి తగిన గౌరవప్రదమైన శైలి. ‘కన్నుమూశాడు’ ద్వారా మరణాన్ని సూచించే మూలంలోని మృదూక్తి నిలుపబడింది.
