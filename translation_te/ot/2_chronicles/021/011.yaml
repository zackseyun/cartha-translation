revisions:
- from: అతడు యూదా కొండప్రాంతంలో ఉన్నత పూజాస్థలాలను కూడా నిర్మించాడు. యెరూషలేము నివాసులు వ్యభిచరించేలా చేశాడు[a]; యూదా ప్రజలను దారి తప్పించాడు[b].
  to: అతడు కూడా యూదా కొండప్రాంతంలో ఉన్నత పూజాస్థలాలను నిర్మించాడు. యెరూషలేము నివాసులను వేశ్యల్లా ప్రవర్తించేలా చేశాడు[a], యూదాను దారి తప్పించాడు[b].
  rationale: The main text is revised only to preserve more closely the Hebrew prostitution metaphor in וַיֶּזֶן and to retain the unexpanded corporate object “Judah.” The footnotes retain the lexical alternatives and clearly distinguish the contextual implication from words explicitly present in the Hebrew.
