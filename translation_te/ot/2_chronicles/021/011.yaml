  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: גַּם ה֥וּא עָשָֽׂה בָמ֖וֹת בְּ/הָרֵ֣י יְהוּדָ֑ה וַ/יֶּ֨זֶן֙ אֶת יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם וַ/יַּדַּ֖ח אֶת יְהוּדָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/011.yaml
  text: He also made high places in the hill country of Judah[a], led the inhabitants of Jerusalem into prostitution[b], and led Judah astray.
translation:
  language: te
  text: అతడు కూడా యూదా కొండప్రాంతంలో ఉన్నత పూజాస్థలాలను నిర్మించాడు. యెరూషలేము నివాసులను వేశ్యల్లా ప్రవర్తించేలా చేశాడు[a], యూదాను దారి తప్పించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెరూషలేము నివాసులను వ్యభిచరించేలా చేశాడు.’ ఇక్కడి హెబ్రీ పదం వేశ్యావృత్తి భాషను ఉపయోగిస్తుంది; అది లైంగిక అనైతికతను, అలాగే దేవునిపట్ల అవిశ్వాసంతో కూడిన మతభ్రష్టతను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘యూదాను యెహోవా నుండి దూరం చేశాడు.’ ‘యెహోవా నుండి’ అనే మాటలు హెబ్రీ పాఠంలో స్పష్టంగా లేకపోయినా, సందర్భం ఆ భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: అతడు ... కూడా
  rationale: గַּם మరియు స్వతంత్ర సర్వనామం కలసి కొనసాగింపుతో కూడిన ఉద్ఘాటనను ఇస్తాయి. తెలుగు వాక్యనిర్మాణంలో ‘అతడు ... కూడా’ సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: עָשָׂה
  choice: నిర్మించాడు
  rationale: బామోత్ అనే పూజాస్థలాల సందర్భంలో עשה ‘చేశాడు/ఏర్పరచాడు’ అనే విస్తృత భావం కలిగి ఉంది; ‘నిర్మించాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి వాటిని నెలకొల్పిన భావాన్ని తెలియజేస్తుంది.
- source_word: בָמוֹת
  choice: ఉన్నత పూజాస్థలాలు
  rationale: ఈ పదం సాధారణంగా ఎత్తైన ప్రదేశాల్లోని ఆరాధనా కేంద్రాలను, ముఖ్యంగా అనధికార లేదా విగ్రహారాధనా స్థలాలను సూచిస్తుంది. ‘పూజా’ అనే వివరణ వాటి స్వభావాన్ని సాధారణ పాఠకునికి స్పష్టం చేస్తుంది; అయితే మూలంలో లేని నిర్దిష్ట దేవతను చేర్చదు.
- source_word: בְּהָרֵי יְהוּדָה
  choice: యూదా కొండప్రాంతంలో
  rationale: הרים ఇక్కడ విడివిడిగా ఉన్న కొండలను గానీ, భౌగోళిక కొండప్రాంతాన్ని గానీ సూచించవచ్చు. సందర్భానికి ‘కొండప్రాంతం’ సహజమైన భౌగోళిక అనువాదం.
- source_word: וַיֶּזֶן
  choice: వ్యభిచరించేలా చేశాడు
  rationale: זנה యొక్క causative రూపం ‘వ్యభిచరింపజేయడం’ లేదా ‘వేశ్యలా ప్రవర్తింపజేయడం’ అనే భావాన్ని ఇస్తుంది. ఆరాధనా సందర్భంలో ఇది లైంగిక దుర్నీతినీ, దేవునిపట్ల ఒడంబడిక అవిశ్వాసాన్నీ ప్రతిధ్వనింపజేయగలదు. తెలుగు పదప్రయోగం ఆ ఉద్దేశపూర్వక ద్వంద్వార్థాన్ని కొంతవరకు నిలుపుతుంది.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: యెరూషలేము నివాసులు
  rationale: మూలంలోని ‘యెరూషలేములో నివసించేవారు’ అనే భావానికి ఇది సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: וַיַּדַּח
  choice: దారి తప్పించాడు
  rationale: נדח యొక్క causative రూపం తరిమివేయడం లేదా సరైన విధేయతనుంచి తప్పుదారి పట్టించడం అనే భావాలను కలిగి ఉంటుంది. ఇక్కడ మతపరమైన అవిశ్వాసం సందర్భం కావడంతో ‘దారి తప్పించాడు’ తగినది.
- source_word: אֶת יְהוּדָה
  choice: యూదా ప్రజలను
  rationale: ‘యూదా’ ఇక్కడ రాజ్యాన్ని లేదా దాని ప్రజలను సమష్టిగా సూచిస్తుంది. తెలుగులో ‘యూదా ప్రజలను’ అని చెప్పడం వ్యక్తులపై జరిగిన ప్రభావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: וַיֶּזֶןలోని లైంగిక వ్యభిచారం–మతపరమైన అవిశ్వాసం మధ్య భావసంబంధం
  choice: ప్రధాన పాఠంలో ‘వ్యభిచరించేలా చేశాడు’ అని ఉంచి, రెండు భావసాధ్యతలనూ పాదటిప్పణిలో వివరించడం
  alternative: ‘దేవునికి అవిశ్వాసులయ్యేలా చేశాడు’ లేదా ‘వేశ్యావృత్తిలోకి నడిపించాడు’
  rationale: సందర్భం ఉన్నత పూజాస్థలాలు మరియు మతభ్రష్టతను సూచిస్తున్నా, హెబ్రీ పదం ఉద్దేశపూర్వకంగా లైంగిక వ్యభిచార భాషను ఉపయోగిస్తుంది. కేవలం ఒక భావానికే పరిమితం చేయకుండా రూపకంలోని తీవ్రతను, ఒడంబడిక అవిశ్వాస సూచనను రెండింటినీ నిలుపాలి.
- issue: యూదా దేనినుంచి దారి తప్పిందో స్పష్టంగా చేర్చాలా
  choice: ప్రధాన పాఠంలో కర్మపూరకాన్ని చేర్చకుండా ‘యూదా ప్రజలను దారి తప్పించాడు’ అని ఉంచడం
  alternative: ‘యూదా ప్రజలను యెహోవా నుండి దూరం చేశాడు’
  rationale: సందర్భం యెహోవాపట్ల విధేయతనుంచి తప్పించడాన్ని బలంగా సూచించినా, ఈ వచనంలోని హెబ్రీ పాఠం ‘యెహోవా నుండి’ అని స్పష్టంగా చెప్పదు. అందువల్ల మూలంలోని సంక్షిప్తతను ప్రధాన పాఠంలో కాపాడి, సూచిత భావాన్ని పాదటిప్పణిలో తెలియజేయడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక వర్ణనను ఉపయోగించాం. ‘ఉన్నత పూజాస్థలాలు’ సాధారణ పాఠకునికి בָמוֹת యొక్క ఆరాధనా స్వభావాన్ని స్పష్టం చేస్తుంది. ‘వ్యభిచరించేలా చేశాడు’ అనే పదబంధం మూలంలోని గట్టి రూపకాన్ని మృదువుపరచకుండా, దాని లైంగిక మరియు ఒడంబడిక-అవిశ్వాస ప్రతిధ్వనులను నిలుపుతుంది.
