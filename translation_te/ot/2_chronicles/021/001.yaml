id: 2CH.21.1
reference: 2 Chronicles 21:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב יְהֽוֹשָׁפָט֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵ֥ר עִם אֲבֹתָ֖י/ו בְּ/עִ֣יר דָּוִ֑יד וַ/יִּמְלֹ֛ךְ יְהוֹרָ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/001.yaml
  text: And Jehoshaphat slept with his fathers and was buried with his fathers in the city of David[b][a], and Jehoram his son reigned in his place.
translation:
  language: te
  text: యెహోషాపాతు తన పితరులతో కూడ నిద్రించి[a], దావీదు నగరంలో తన పితరులతో కూడ సమాధి చేయబడ్డాడు[b]. అతని కుమారుడైన యెహోరాము అతని స్థానంలో రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరణించాడు”; అక్షరార్థంగా, “తన పితరులతో కూడ నిద్రించాడు.”
    reason: lexical_alternative
  - marker: b
    text: “తన పితరులతో కూడ” అనేది మరణంలోనూ సమాధిలోనూ తన పూర్వీకులను చేరడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: నిద్రించాడు
  rationale: రాజుల మరణవార్తల్లో కనిపించే ‘పితరులతో కూడ నిద్రించడం’ అనే హీబ్రూ మర్యాదార్థక నుడికారాన్ని నిలుపుతుంది; భావం మరణించడమేనని పాదటిప్పణి స్పష్టం చేస్తుంది.
- source_word: עִם אֲבֹתָיו
  choice: తన పితరులతో కూడ
  rationale: వంశపారంపర్య సందర్భంలోని హీబ్రూ నుడికారానికి సన్నిహితమైన, తెలుగు బైబిలు శైలిలో పరిచితమైన రూపం; ఇక్కడ ‘పితరులు’ అంటే పూర్వీకులు.
- source_word: וַיִּקָּבֵר
  choice: సమాధి చేయబడ్డాడు
  rationale: క్రియలోని కర్మణి రూపాన్ని సహజమైన తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: בְּעִיר דָּוִיד
  choice: దావీదు నగరంలో
  rationale: ఈ స్థలనామానికి సహజమైన, సుపరిచితమైన తెలుగు రూపం.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: ఈ రాజ్యవారసత్వ సూత్రంలో కుమారుడు తండ్రి స్థానాన్ని స్వీకరించాడనే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘పరిపాలించాడు’ కూడా సాధ్యమే కాని ఇక్కడ అధిరోహణ భావం ప్రధానంగా ఉంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: రాజ్యవారసత్వాన్ని మూలానికి దగ్గరగా, అతిగా వ్యత్యాసార్థం కలిగించకుండా తెలియజేస్తుంది.
- source_word: יְהוֹשָׁפָט
  choice: యెహోషాపాతు
  rationale: హీబ్రూ పేరుకు తెలుగు బైబిలు వాడుకలో గుర్తించదగిన లిప్యంతరీకరణ.
- source_word: יְהוֹרָם
  choice: యెహోరాము
  rationale: ఇక్కడి పూర్తి హీబ్రూ రూపం יְהוֹרָםను ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
