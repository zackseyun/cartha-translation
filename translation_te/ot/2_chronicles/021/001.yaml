translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన రాజవంశ చరిత్రా శైలి. మూలంలోని మరణ నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సాధారణ పాఠకుని కోసం దాని భావాన్ని పాదటిప్పణుల్లో వివరించాం. పాదటిప్పణి [b]ను సంబంధిత సమాధి వాక్యభాగం వద్ద ఉంచాం.
