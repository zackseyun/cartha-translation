id: 2CH.21.14
reference: 2 Chronicles 21:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִנֵּ֣ה יְהוָ֗ה נֹגֵ֛ף מַגֵּפָ֥ה גְדוֹלָ֖ה בְּ/עַמֶּ֑/ךָ וּ/בְ/בָנֶ֥י/ךָ וּ/בְ/נָשֶׁ֖י/ךָ וּ/בְ/כָל רְכוּשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/014.yaml
  text: Behold[a], Yahweh is striking your people, your sons, your wives, and all your possessions with a great plague.
translation:
  language: te
  text: ఇదిగో[a], యాహ్వే నీ ప్రజలను, నీ కుమారులను, నీ భార్యలను, నీ ఆస్తి అంతటినీ గొప్ప తెగులుతో దెబ్బతీయబోతున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చూడు, యాహ్వే ... గొప్ప దెబ్బతో (లేదా, తీవ్రమైన బాధతో) దెబ్బతీస్తున్నాడు/దెబ్బతీస్తాడు.” హీబ్రూ కృదంతం సమీప భవిష్యత్తును, జరుగుతున్న చర్యను లేదా సాధారణ భవిష్యత్తును సూచించగలదు; מַגֵּפָה అనే పదం తెగులును గానీ దేవుడు కలిగించే తీవ్రమైన దెబ్బను లేదా బాధను గానీ సూచించవచ్చు.
    reason: కాలబలం మరియు పదార్థంలోని నిజమైన ప్రత్యామ్నాయాలను సంరక్షించడం
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: ప్రవచనాత్మక ప్రకటనలో శ్రద్ధను ఆకర్షించే బలాన్నీ, సమీపిస్తున్న తీర్పు యొక్క తక్షణ భావాన్నీ సహజమైన గంభీర తెలుగు పదంతో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: נֹגֵף
  choice: దెబ్బతీయబోతున్నాడు
  rationale: הִנֵּהతో కూడిన వర్తమాన కృదంతం ప్రవచన సందర్భంలో సమీప భవిష్యత్తు చర్యను సూచించగలదు. ఈ రూపం తీర్పు త్వరలో సంభవించబోతున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: מַגֵּפָה גְדוֹלָה
  choice: గొప్ప తెగులుతో
  rationale: מַגֵּפָה తెగులును గానీ దేవుడు కలిగించే తీవ్రమైన దెబ్బను/బాధను గానీ సూచించగలదు. సందర్భానికి సరిపోయే ప్రధాన అర్థంగా ‘తెగులు’ను ఉంచి, ప్రత్యామ్నాయ విస్తృతిని పాదసూచికలో నిలిపింది.
- source_word: בְּעַמֶּךָ
  choice: నీ ప్రజలను
  rationale: ב ఇక్కడ దెబ్బకు గురయ్యే ప్రత్యక్ష లక్ష్యాన్ని సూచిస్తుంది; తెలుగులో కర్మవిభక్తి సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: וּבְבָנֶיךָ
  choice: నీ కుమారులను
  rationale: בָּנִים పుంలింగ బహువచనం కాబట్టి సాధారణ ‘పిల్లలు’ అనే పదం బదులు లింగనిర్దిష్టమైన ‘కుమారులు’ను వాడింది.
- source_word: וּבְנָשֶׁיךָ
  choice: నీ భార్యలను
  rationale: స్వామ్యసూచక బహువచన సందర్భంలో נָשִׁים సాధారణంగా స్త్రీలను కాక భార్యలను సూచిస్తుంది.
- source_word: וּבְכָל רְכוּשֶׁךָ
  choice: నీ ఆస్తి అంతటినీ
  rationale: רְכוּשׁ ఆస్తి, సంపద, స్వాధీన వస్తువులను సూచిస్తుంది; כָּל యొక్క సంపూర్ణతను ‘అంతటినీ’ స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో దైవనామమే ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా పేరుగా నిలుపుతూ, Yahweh ఉచ్చారణకు సమీపమైన తెలుగు రూపాన్ని ఉపయోగించింది.
- issue: ప్రవచన ప్రకటనలో נֹגֵף కృదంతం యొక్క కాలబలం
  choice: సమీప భవిష్యత్తు — ‘దెబ్బతీయబోతున్నాడు’
  alternative: వర్తమాన కొనసాగింపు — ‘దెబ్బతీస్తున్నాడు’; సాధారణ భవిష్యత్తు — ‘దెబ్బతీస్తాడు’
  rationale: הִנֵּה + కృదంతం సమీపిస్తున్న చర్యను సూచించగలదు. అయితే వర్తమాన లేదా సాధారణ భవిష్యత్తు భావం కూడా వ్యాకరణపరంగా సాధ్యమే కాబట్టి పాదసూచికలో ఆ సందిగ్ధతను నిలిపింది.
- issue: מַגֵּפָה యొక్క తీర్పుసంబంధ అర్థవిస్తృతి
  choice: తెగులు
  alternative: తీవ్రమైన దెబ్బ; బాధ
  rationale: ఈ పదం వ్యాధిరూప తెగులుతో పాటు దేవుడు కలిగించే తీవ్రమైన దెబ్బ లేదా విపత్తును కూడా సూచించగలదు. ప్రధాన పాఠంలో సహజమైన సందర్భార్థాన్ని ఎంచుకొని ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రవచన శైలిని పాటించింది. ‘ఇదిగో’ ప్రకటన యొక్క శ్రద్ధాకర్షక బలాన్ని నిలుపుతుంది; మిగతా వాక్య నిర్మాణం సాధారణ పాఠకులకు స్పష్టంగా, సహజంగా ఉండేలా రూపొందించబడింది.
