  text: וַ/יָּ֨קָם יְהוֹרָ֜ם עַל מַמְלֶ֤כַת אָבִי/ו֙ וַ/יִּתְחַזַּ֔ק וַ/יַּהֲרֹ֥ג אֶת כָּל אֶחָ֖י/ו בֶּ/חָ֑רֶב וְ/גַ֖ם מִ/שָּׂרֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/004.yaml
  text: When Jehoram had risen over his father's kingdom and had strengthened himself[a], he killed all his brothers with the sword, and also some of the princes of Israel.
translation:
  language: te
  text: యెహోరాము తన తండ్రి రాజ్యంపై అధికారాన్ని చేపట్టి, తనను తాను బలపరచుకున్నాక, తన సోదరులందరినీ కత్తితో చంపాడు; ఇశ్రాయేలు అధిపతుల్లో[a] కొందరిని కూడా చంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అధిపతులు” అనే పదాన్ని “అధికారులు” లేదా “నాయకులు” అని కూడా అనువదించవచ్చు. హీబ్రూ పదం ఉన్నత స్థాయి పాలకులను లేదా పరిపాలకులను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם עַל מַמְלֶכַת אָבִיו
  choice: తన తండ్రి రాజ్యంపై అధికారాన్ని చేపట్టి
  rationale: రాజ్యంపై అధికారానికి రావడం అనే రాజసంబంధ సందర్భంలోని భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; עַל లోని ‘పై/మీద అధికారం’ భావాన్ని నిలుపుతుంది.
- source_word: וַיִּתְחַזַּק
  choice: తనను తాను బలపరచుకున్నాక
  rationale: హిత్పయేల్ రూపంలోని ఆత్మార్థక భావాన్ని నిలుపుతూ, అతడు తన స్థితిని దృఢపరచుకున్నాడనే సూచనను అతిగా రాజకీయంగా వ్యాఖ్యానించకుండా ఉంచుతుంది.
- source_word: וַיַּהֲרֹג אֶת כָּל אֶחָיו בֶּחָרֶב
  choice: తన సోదరులందరినీ కత్తితో చంపాడు
  rationale: పురుష సహోదరులను సూచించే אֶחָיו ను ‘సోదరులు’గా, సాధనార్థక בֶּחָרֶב ను ‘కత్తితో’గా స్పష్టంగా అందిస్తుంది.
- source_word: וְגַם מִשָּׂרֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు అధిపతుల్లో కొందరిని కూడా
  rationale: מִן యొక్క భాగార్థక భావాన్ని ‘కొందరిని’తో స్పష్టపరుస్తుంది. שָׂרִים కు రాజసభ సందర్భంలో ‘అధిపతులు’ తగినదైనా, ‘అధికారులు’ లేదా ‘నాయకులు’ అనే అర్థాలూ సాధ్యమే.
theological_decisions:
- issue: ‘ఇశ్రాయేలు అధిపతులు’లో ‘ఇశ్రాయేలు’ అనే పదం ఎవరిని సూచిస్తుంది?
  choice: మూలంలోని ‘ఇశ్రాయేలు’ అనే పేరునే నిలుపుకోవడం
  alternative: ‘యూదా అధిపతులు’ లేదా ‘దేశ నాయకులు’ అని వివరణాత్మకంగా మార్చడం
  rationale: దినవృత్తాంతాల్లో ‘ఇశ్రాయేలు’ విస్తృత నిబంధన-ప్రజల భావంలోనూ వాడబడవచ్చు. చారిత్రక సూక్ష్మతను అనువాదంలో ముందే పరిష్కరించకుండా మూలపదాన్ని నిలుపుకోవడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే చారిత్రక వర్ణనకు తగిన గంభీరతతో రూపొందించబడింది. పాదసూచిక గుర్తు అది వివరిస్తున్న ‘అధిపతులు’ పదం ఉన్న వాక్యాంతంలో ఉంచబడింది.
