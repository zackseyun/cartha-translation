  text: In his days Edom rebelled from under the hand of Judah and made a king over themselves[a].
translation:
  language: te
  text: అతని కాలంలో ఎదోము ప్రజలు యూదా చేతి కిందనుండి తిరుగుబాటు చేసి, తమపై ఒక రాజును నియమించుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదా ఆధిపత్యం నుండి తిరుగుబాటు చేసి విడిపోయారు.” హీబ్రూలో అక్షరార్థంగా, “యూదా చేతి కిందనుండి తిరుగుబాటు చేశారు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  choice: అతని కాలంలో
  rationale: యెహోరాము పరిపాలించిన కాలాన్ని సూచించే హీబ్రూ కాలవాచక నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
