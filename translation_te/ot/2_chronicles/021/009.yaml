  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సైనిక కథన శైలి వాడబడింది. మూలంలో గమ్యస్థానం చెప్పబడకపోవడం, וַיַּךְ ఫలితాన్ని నిర్దిష్టంగా పేర్కొనకపోవడం అలాగే నిలుపబడ్డాయి.
