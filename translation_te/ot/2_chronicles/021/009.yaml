revisions:
- from: అప్పుడు యెహోరాము తన సేనాధిపతులతో, తనతో ఉన్న రథాలన్నిటితో ముందుకు సాగాడు. రాత్రివేళ అతడు లేచి, తనను చుట్టుముట్టిన ఎదోమీయుల మీద, రథాల అధిపతుల[a] మీద దాడి చేశాడు.
  to: అప్పుడు యెహోరాము తన అధిపతులతోను, తనతో ఉన్న రథాలన్నిటితోను దాటి వెళ్లాడు. రాత్రివేళ అతడు లేచి, తనను చుట్టుముట్టి ఉన్న ఎదోమును, రథాల అధిపతుల[a]ను దెబ్బకొట్టాడు.
  rationale: The revision more closely represents the movement verb (‘crossed over’), preserves ‘Edom’ as the Hebrew collective national name, and uses a direct but non-overstated Telugu equivalent for ‘struck.’ The coordination leaves the Hebrew’s reference to the chariot commanders intact, and the existing lexical-alternative footnote is retained in polished modern Telugu.
