source:
  edition: WLC
  text: וַ/יַּֽעֲבֹ֤ר יְהוֹרָם֙ עִם שָׂרָ֔י/ו וְ/כָל הָ/רֶ֖כֶב עִמּ֑/וֹ וַ/יְהִי֙ קָ֣ם לַ֔יְלָה וַ/יַּ֗ךְ אֶת אֱדוֹם֙ הַ/סּוֹבֵ֣ב אֵלָ֔י/ו וְ/אֵ֖ת שָׂרֵ֥י הָ/רָֽכֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/009.yaml
  text: So Jehoram crossed over with his commanders and all the chariots with him. And it happened that he arose by night and struck Edom[a], which had surrounded him, and the commanders of the chariots.
translation:
  language: te
  text: అప్పుడు యెహోరాము తన అధిపతులతోను, తనతో ఉన్న రథాలన్నిటితోను దాటి వెళ్లాడు. రాత్రివేళ అతడు లేచి, తనను చుట్టుముట్టి ఉన్న ఎదోమును, రథాల అధిపతుల[a]ను దెబ్బకొట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రథదళాధిపతులు.’ హీబ్రూ పదబంధం రథదళానికి నాయకత్వం వహించిన అధికారులను ప్రత్యేకంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: ముందుకు సాగాడు
  rationale: עָבַר అంటే దాటడం లేదా ముందుకు వెళ్లడం. గమ్యస్థానం వచనంలో చెప్పబడలేదు కాబట్టి, తెలుగులో సహజంగా ఉండి సైనిక కదలికను మాత్రమే సూచించేలా ‘ముందుకు సాగాడు’ అని అనువదించాం.
- source_word: שָׂרָיו
  choice: తన సేనాధిపతులతో
  rationale: שַׂר పాలకుడు, అధికారి లేదా సైనిక నాయకుడిని సూచించగలదు. రథాలు ప్రస్తావించబడిన ఈ సైనిక సందర్భంలో ‘సేనాధిపతులు’ తగిన అర్థాన్ని ఇస్తుంది.
- source_word: וְכָל־הָרֶכֶב עִמּוֹ
  choice: తనతో ఉన్న రథాలన్నిటితో
  rationale: רֶכֶב ఇక్కడ రథాలను లేదా సమష్టిగా రథదళాన్ని సూచిస్తుంది. ‘రథాలన్నిటితో’ మూలంలోని సమష్టి భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיְהִי קָם לַיְלָה
  choice: రాత్రివేళ అతడు లేచి
  rationale: హీబ్రూ కథన సూత్రంలోని రాత్రి లేచి చర్యకు దిగిన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో నిలిపాం.
- source_word: וַיַּךְ
  choice: దాడి చేశాడు
  rationale: נכה అంటే కొట్టడం లేదా దెబ్బతీయడం. యుద్ధ సందర్భంలో ‘దాడి చేశాడు’ సహజంగా ఉంటుంది; ‘ఓడించాడు’ లేదా ‘చంపాడు’ అన్నట్లు మూలపాఠం కంటే ఎక్కువగా నిర్ధారించదు.
- source_word: אֱדוֹם הַסּוֹבֵב אֵלָיו
  choice: తనను చుట్టుముట్టిన ఎదోమీయుల మీద
  rationale: ఎదోము అనే దేశనామం ఇక్కడ దాని సైనికులను సమష్టిగా సూచిస్తుంది. סבב యొక్క కృదంత రూపం వారు యెహోరామును చుట్టుముట్టిన స్థితిని తెలియజేస్తుంది.
- source_word: שָׂרֵי הָרָכֶב
  choice: రథాల అధిపతులు
  rationale: ఈ నిర్మాణం రథాలకు లేదా రథదళానికి నాయకత్వం వహించే అధికారులను సూచిస్తుంది. ‘రథాల అధిపతులు’ హీబ్రూ నిర్మాణానికి దగ్గరగా ఉంటుంది.
