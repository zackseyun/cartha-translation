id: 2CH.21.15
reference: 2 Chronicles 21:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתָּ֛ה בָּ/חֳלָיִ֥ים רַבִּ֖ים בְּ/מַחֲלֵ֣ה מֵעֶ֑י/ךָ עַד יֵצְא֤וּ מֵעֶ֨י/ךָ֙ מִן הַ/חֹ֔לִי יָמִ֖ים עַל יָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/015.yaml
  text: And you yourself will suffer many illnesses[a], with a disease of your bowels, until your bowels come out because of the disease[b], day after day.
translation:
  language: te
  text: నీవైతే అనేక రోగాలతో బాధపడతావు; నీ పేగులకు వ్యాధి కలుగుతుంది. ఆ వ్యాధివల్ల రోజులు గడిచేకొద్దీ నీ పేగులు బయటికి వస్తాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘రోజుల మీద రోజులు’; అంటే ‘రోజుల తరబడి’ లేదా ‘రోజు తర్వాత రోజు’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: నీవైతే
  rationale: సంయోజక అవ్యయంతో కూడిన స్వతంత్ర సర్వనామం యెహోరామును నేరుగా, నొక్కిచెప్పి సంబోధించే మార్పును సూచిస్తుంది.
- source_word: בָּחֳלָיִים רַבִּים
  choice: అనేక రోగాలతో బాధపడతావు
  rationale: בְּ ఇక్కడ అనుభవించే బాధాకర స్థితిని సూచిస్తుంది; బహువచనాన్ని నిలుపుతూ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּמַחֲלֵה מֵעֶיךָ
  choice: నీ పేగులకు వ్యాధి కలుగుతుంది
  rationale: సాధారణ రోగాల ప్రస్తావన తర్వాత నిర్దిష్టమైన అంతరావయవ వ్యాధిని తెలియజేస్తుంది. מֵעֶה ఈ సందర్భంలో పేగులను సూచించడం సహజం.
- source_word: עַד יֵצְאוּ מֵעֶיךָ
  choice: నీ పేగులు బయటికి వచ్చేవరకు
  rationale: יצא యొక్క సూటి అర్థమైన ‘బయటికి రావడం’ను తీవ్రత తగ్గించకుండా నిలుపుతుంది.
- source_word: מִן הַחֹלִי
  choice: ఆ వ్యాధివల్ల
  rationale: מִן ఇక్కడ ఫలితానికి కారణాన్ని సూచిస్తుంది.
- source_word: יָמִים עַל יָמִים
  choice: రోజుల తరబడి
  rationale: ‘రోజుల మీద రోజులు’ అనే హీబ్రూ ప్రయోగం దీర్ఘకాలంగా వరుసగా కొనసాగే ప్రక్రియను సూచిస్తుంది; ‘రోజుల తరబడి’ సహజమైన తెలుగు సమానార్థకం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సూటి శైలి. వ్యాధి యొక్క భయానక ఫలితాన్ని మృదువుచేయలేదు. చివరి కాలవ్యాప్తి పదబంధాన్ని సహజంగా అనుసంధానించేందుకు ‘అది కొనసాగుతుంది’ను సందర్భార్థంగా చేర్చాం.
