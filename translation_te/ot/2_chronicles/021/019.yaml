id: 2CH.21.19
reference: 2 Chronicles 21:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י לְ/יָמִ֣ים מִ/יָּמִ֡ים וּ/כְ/עֵת֩ צֵ֨את הַ/קֵּ֜ץ לְ/יָמִ֣ים שְׁנַ֗יִם יָצְא֤וּ מֵעָי/ו֙ עִם חָלְי֔/וֹ וַ/יָּ֖מָת בְּ/תַחֲלֻאִ֣ים רָעִ֑ים וְ/לֹא עָ֨שׂוּ ל֥/וֹ עַמּ֛/וֹ שְׂרֵפָ֖ה כִּ/שְׂרֵפַ֥ת אֲבֹתָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/019.yaml
  text: And after some time[a], at the end of two years, his bowels came out because of his sickness, and he died of severe diseases[b]. And his people made no burning for him like the burning for his fathers.
translation:
  language: te
  text: కొంతకాలం గడిచిన తరువాత, రెండేళ్ల చివరికి, అతని వ్యాధి కారణంగా అతని పేగులు[a] బయటికి వచ్చాయి. అతడు తీవ్రమైన రోగబాధలతో మరణించాడు. అతని ప్రజలు అతని కోసం దహనం[b] చేయలేదు, అతని పితరులకు చేసిన దహనం వలె.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని అంతర్గత అవయవాలు.’ హీబ్రూ పదం లోపలి అవయవాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి ‘దహనం’ బహుశా శరీరాన్ని కాల్చడాన్ని కాకుండా, సుగంధద్రవ్యాలను కాల్చడం వంటి అంత్యక్రియల గౌరవాచారాన్ని సూచిస్తుంది; దినవృత్తాంతాల్లోని ఇతర రాజుల సమాధి ఆచారాలతో పోల్చండి.
    reason: cultural_note
lexical_decisions:
- source_word: לְיָמִים מִיָּמִים
  choice: కొంతకాలం గడిచిన తరువాత
  rationale: ఈ హీబ్రూ నుడికారం నిర్దిష్టంగా చెప్పని కొంతకాలం గడిచిందని సూచిస్తుంది; అక్షరార్థ అనువాదం తెలుగులో అసహజంగా ఉంటుంది.
- source_word: וּכְעֵת צֵאת הַקֵּץ לְיָמִים שְׁנַיִם
  choice: రెండేళ్లు పూర్తయ్యే సమయానికి
  rationale: వ్యాధి కొనసాగిన కాలపరిమితి ముగింపును సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֵעָיו
  choice: అతని పేగులు
  rationale: ఈ పదం అంతర్గత అవయవాలను, ముఖ్యంగా పేగులను సూచిస్తుంది. సందర్భంలోని తీవ్రమైన శారీరక భావాన్ని తగ్గించకుండా తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: יָצְאוּ מֵעָיו
  choice: అతని పేగులు బయటికి వచ్చాయి
  rationale: יָצְאוּ అనే క్రియ యొక్క సాధారణ అర్థమైన ‘బయటికి వచ్చాయి’ను నిలుపుతూ, మూలపాఠంలోని ఘోరమైన వర్ణనను మృదువుపరచదు.
- source_word: עִם חָלְיוֹ
  choice: అతని వ్యాధివల్ల
  rationale: עִם సాధారణంగా ‘తో’ అని అర్థమైనా, ఇక్కడ వ్యాధి కారణంగా లేదా దాని వెంట జరిగిన పరిణామాన్ని సూచిస్తుంది; ‘వ్యాధివల్ల’ తెలుగులో సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּתַחֲלֻאִים רָעִים
  choice: తీవ్రమైన రోగబాధలతో
  rationale: బహువచన రూపాన్ని, బాధాకరమైన తీవ్రతను నిలుపుతూ సహజమైన తెలుగు వ్యక్తీకరణను ఇస్తుంది.
- source_word: שְׂרֵפָה
  choice: దహనం
  rationale: హీబ్రూ పదానికి దగ్గరగా ఉండి, ఆచారం స్వరూపాన్ని ప్రధాన పాఠంలో అతిగా నిర్దిష్టం చేయదు; సాంస్కృతిక భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: כִּשְׂרֵפַת אֲבֹתָיו
  choice: అతని పితరుల కోసం చేసిన దహనంలాంటి దహనం
  rationale: మునుపటి రాజులకు లేదా పూర్వీకులకు ఇచ్చిన అంత్యక్రియల గౌరవంతో పోలికను నిలుపుతుంది; వారి శరీరాలనే కాల్చారని నిర్బంధంగా సూచించదు.
theological_decisions:
- issue: రాజుల అంత్యక్రియల సందర్భంలో שְׂרֵפָה స్వరూపం
  choice: ప్రధాన పాఠంలో ‘దహనం’ అని ఉంచి, అది బహుశా అంత్యక్రియల గౌరవార్థం చేసిన సుగంధద్రవ్యాల దహనం వంటి ఆచారమని పాదసూచికలో వివరించడం
  alternative: శవదహనం; లేదా స్వరూపం తెలియని దహనాచారం
  rationale: దినవృత్తాంతాల రాజసంబంధ సందర్భంలో యెహోరాముకు అతని పూర్వీకులకు లభించిన గౌరవం లభించలేదనే వ్యత్యాసమే ప్రధానంగా కనిపిస్తుంది. మూలపదంలోని కొంత అనిశ్చితిని ప్రధాన పాఠం నిలుపుతుంది; పాదసూచిక సంభావ్య సాంస్కృతిక భావాన్ని మాత్రమే తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్య నిర్మాణం వాడబడింది. మూలపాఠంలోని ఘోరమైన శారీరక వర్ణనను తగ్గించలేదు. ‘దహనం’ అనే పదం కలిగించే శవదహన భావాన్ని పాదసూచిక సాంస్కృతిక సందర్భంతో పరిమితం చేస్తుంది; ప్రధాన పాఠం మూలంలోని పదస్పష్టతను నిలుపుతుంది.
