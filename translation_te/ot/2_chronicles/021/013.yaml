source:
  edition: WLC
  text: וַ/תֵּ֗לֶךְ בְּ/דֶ֨רֶךְ֙ מַלְכֵ֣י יִשְׂרָאֵ֔ל וַ/תַּזְנֶ֤ה אֶת יְהוּדָה֙ וְ/אֶת יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם כְּ/הַזְנ֖וֹת בֵּ֣ית אַחְאָ֑ב וְ/גַ֨ם אֶת אַחֶ֧י/ךָ בֵית אָבִ֛י/ךָ הַ/טּוֹבִ֥ים מִמְּ/ךָ֖ הָרָֽגְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/013.yaml
  text: but you have walked in the way of the kings of Israel[a], and have led Judah and the inhabitants of Jerusalem into sexual immorality, as the house of Ahab led them into sexual immorality; and you have also killed your brothers of your father’s house[b], who were better than you.
translation:
  language: te
  text: కాని నీవు ఇశ్రాయేలు రాజుల మార్గంలో నడిచావు. అహాబు వంశం[b] వ్యభిచారం చేయించినట్లే, యూదాను, యెరూషలేము నివాసులను వ్యభిచారం చేయించావు[a]. అంతేకాక, నీకంటే మంచివారైన, నీ తండ్రి ఇంటికి చెందిన నీ సోదరులను కూడా చంపావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, “వేశ్యలా ప్రవర్తించేలా చేశావు.” ప్రవక్తల భాషలో ఇది దేవునితో చేసిన నిబంధనకు నమ్మకద్రోహం చేయడాన్ని, ముఖ్యంగా విగ్రహారాధనను సూచించే రూపకం.
    reason: lexical_alternative
  - marker: b
    text: “అహాబు వంశం” అంటే అహాబుకు చెందిన పాలక కుటుంబం లేదా రాజవంశం.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּלֶךְ בְּדֶרֶךְ
  choice: మార్గంలో నడిచావు
  rationale: ప్రవర్తనా విధానాన్ని అనుసరించడమనే హీబ్రూ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో అలాగే నిలుపుతుంది.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజులు
  rationale: యూదా రాజులకు, ఉత్తర రాజ్యమైన ఇశ్రాయేలు రాజులకు మధ్య ఉన్న చారిత్రక భేదాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: וַתַּזְנֶה אֶת יְהוּדָה וְאֶת יֹשְׁבֵי יְרוּשָׁלַם
  choice: యూదా ప్రజలు, యెరూషలేము నివాసులు వ్యభిచారం చేసేలా చేశావు
  rationale: హిఫీల్ రూపంలోని కారణార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తూ, זנה అనే ప్రవచనాత్మక లైంగిక రూపకాన్ని ‘విగ్రహారాధన’ అని సంకుచితం చేయకుండా నిలుపుతుంది. ‘యూదా’ను ఇక్కడ ప్రజాసమూహంగా తెలుగులో స్పష్టం చేసింది.
- source_word: כְּהַזְנוֹת בֵּית אַחְאָב
  choice: అహాబు వంశం చేసినట్లే
  rationale: ముందటి వాక్యభాగంలోని ‘వ్యభిచారం’ను సహజంగా తిరిగి సూచిస్తుంది; בֵּית אַחְאָבను పాలక వంశంగా వ్యక్తం చేస్తుంది.
- source_word: וְגַם
  choice: అంతేకాక ... కూడా
  rationale: మతద్రోహానికి తోడు సోదరహత్యను మరొక తీవ్రమైన నేరంగా చేర్చే భావాన్ని బలంగా తెలియజేస్తుంది.
- source_word: אַחֶיךָ בֵית אָבִיךָ
  choice: నీ తండ్రి ఇంటికి చెందిన నీ సోదరులు
  rationale: సోదరులు రాజకుటుంబానికి చెందినవారని తెలిపే సంబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: הַטּוֹבִים מִמְּךָ
  choice: నీకంటే మంచివారు
  rationale: తులనాత్మక నైతిక లేదా వ్యక్తిగత మూల్యాంకనాన్ని అదనపు వ్యాఖ్యానం లేకుండా నేరుగా నిలుపుతుంది.
- source_word: הָרָגְתָּ
  choice: చంపావు
  rationale: ‘చంపు’ అనేది మూల క్రియకు నేరమైన సమానార్థకం; ‘హత్య చేశావు’ కంటే తక్కువ వ్యాఖ్యానాత్మకం.
theological_decisions:
- issue: రాజద్రోహ సందర్భంలో זנה యొక్క రూపకార్థం
  choice: ప్రధాన పాఠ్యంలో ‘వ్యభిచారం చేసేలా చేశావు’ అని రూపకాన్ని నిలిపి, నిబంధనపట్ల అవిశ్వాసం మరియు విగ్రహారాధన భావాన్ని పాదసూచికలో వివరించడం
  alternative: ప్రధాన పాఠ్యంలోనే ‘విగ్రహారాధన చేయించారు’ లేదా ‘దేవునికి నమ్మకద్రోహం చేయించారు’ అని అర్థాన్ని పూర్తిగా విప్పి చెప్పడం
  rationale: మూలంలోని లైంగిక రూపకం ఉద్దేశపూర్వకంగా బలమైనది. దానిని కేవలం ‘విగ్రహారాధన’గా మార్చడం భావపరిధిని సంకుచితం చేస్తుంది; వివరణ లేకుండా ఉంచడం ఆధునిక పాఠకుడికి కేవలం శారీరక లైంగిక దుర్నీతిగా మాత్రమే వినిపించవచ్చు.
- issue: בֵּית אַחְאָב యొక్క అర్థం
  choice: అహాబు వంశం
  alternative: అహాబు ఇల్లు
  rationale: ఇక్కడ ‘ఇల్లు’ అనేది భవనం కాకుండా అహాబు పాలక కుటుంబం లేదా రాజవంశాన్ని సూచిస్తుంది; ‘వంశం’ ఆధునిక తెలుగులో ఆ చారిత్రక భావాన్ని సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన నిందారోపణ ధోరణి ఉంచబడింది. ‘మార్గంలో నడిచావు’ అనే బైబిలీయ రూపకం సహజంగా ఉండటంతో నిలుపబడింది. పాతకాలపు ‘వ్యభిచరింపజేశావు’కు బదులుగా స్పష్టమైన ‘వ్యభిచారం చేసేలా చేశావు’ వాడబడింది; రూపకార్థం పాదసూచికలో వివరించబడింది.
