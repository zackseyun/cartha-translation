source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן לָ/הֶ֣ם אֲ֠בִי/הֶם מַתָּנ֨וֹת רַבּ֜וֹת לְ/כֶ֤סֶף וּ/לְ/זָהָב֙ וּ/לְ/מִגְדָּנ֔וֹת עִם עָרֵ֥י מְצֻר֖וֹת בִּֽ/יהוּדָ֑ה וְ/אֶת הַ/מַּמְלָכָ֛ה נָתַ֥ן לִֽ/יהוֹרָ֖ם כִּי ה֥וּא הַ/בְּכֽוֹר׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/003.yaml
  text: Their father gave them many gifts of silver[a], gold, and precious things, along with fortified cities in Judah; but he gave the kingdom to Jehoram, because he was the firstborn.
translation:
  language: te
  text: వారి తండ్రి వారికి వెండి, బంగారం, విలువైన వస్తువులు[a] అనే ఎన్నో కానుకలను, యూదాలోని ప్రాకారాలుగల పట్టణాలతోపాటు, ఇచ్చాడు. అయితే యెహోరాము మొదట జన్మించిన కుమారుడు కాబట్టి రాజ్యాన్ని అతనికి ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘శ్రేష్ఠమైన వస్తువులు,’ ‘ఖరీదైన వస్తువులు.’ హీబ్రూ పదం విలువైన లేదా ప్రత్యేకంగా ఎంపిక చేసిన వస్తువులను విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן לָהֶם אֲבִיהֶם
  choice: వారి తండ్రి వారికి ... ఇచ్చాడు
  rationale: హీబ్రూ కథనంలోని సాధారణ భూతకాల క్రియను సహజమైన ఆధునిక తెలుగు వాక్యక్రమంలో వ్యక్తం చేస్తుంది.
- source_word: מַתָּנוֹת רַבּוֹת
  choice: ఎన్నో కానుకలు
  rationale: רַבּוֹת యొక్క పరిమాణ భావాన్ని సహజంగా నిలుపుతూ, מַתָּנוֹת ను సాధారణ పాఠకులకు స్పష్టమైన ‘కానుకలు’గా అనువదిస్తుంది.
- source_word: לְכֶסֶף וּלְזָהָב
  choice: వెండి, బంగారం ... మొదలైన
  rationale: ఇక్కడ לְ కానుకల రకాలను పరిచయం చేస్తుంది; తెలుగు జాబితాలో ‘మొదలైన’ అనే పదం వెండి, బంగారం, విలువైన వస్తువులు అన్నవి ఆ కానుకల అంశాలని స్పష్టం చేస్తుంది.
- source_word: וּלְמִגְדָּנוֹת
  choice: విలువైన వస్తువులు[a]
  rationale: מִגְדָּנוֹת విలువైనవి, శ్రేష్ఠమైనవి లేదా ఖరీదైన కానుకలను సూచించగలదు. రాజకుటుంబ సంపదల సందర్భంలో ‘విలువైన వస్తువులు’ విస్తృత భావాన్ని సహజంగా అందిస్తుంది; పదంలోని భావవిస్తృతిని పాదసూచికలో ఉంచింది.
- source_word: עִם עָרֵי מְצֻרוֹת בִּיהוּדָה
  choice: తోపాటు యూదాలోని ప్రాకార పట్టణాలను కూడా
  rationale: עִם యొక్క సహవాస/అదనపు భావాన్ని ‘తోపాటు ... కూడా’ తెలియజేస్తుంది. מְצֻרוֹת ను రక్షణ ప్రాకారాలు గల పట్టణాలుగా స్పష్టంగా అనువదిస్తుంది.
- source_word: וְאֶת הַמַּמְלָכָה נָתַן לִיהוֹרָם
  choice: అయితే ... రాజ్యాన్ని అతనికి ఇచ్చాడు
  rationale: వావ్‌ను యాంత్రికంగా ‘మరియు’ అని కాకుండా, ఇతర కుమారులకు కానుకలు ఇచ్చిన దానికి మరియు యెహోరాముకు రాజ్యం ఇచ్చిన దానికి మధ్య ఉన్న సందర్భోచిత వ్యత్యాసాన్ని ‘అయితే’తో వ్యక్తం చేస్తుంది.
- source_word: כִּי הוּא הַבְּכוֹר
  choice: యెహోరాము పెద్ద కుమారుడు కాబట్టి
  rationale: כִּי కారణాన్ని తెలియజేస్తుంది. הַבְּכוֹר ను కుటుంబంలోని జననక్రమ హోదాను స్పష్టంగా తెలిపే ‘పెద్ద కుమారుడు’గా అనువదించింది.
