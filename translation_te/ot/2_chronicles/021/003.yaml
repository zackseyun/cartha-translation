translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ప్రాకార పట్టణాలు’ సాధారణ పాఠకునికి రక్షణ కట్టడాలున్న పట్టణాల భావాన్ని స్పష్టంగా అందిస్తుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
