id: 2CH.12.6
reference: 2 Chronicles 12:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּכָּנְע֥וּ שָׂרֵֽי יִשְׂרָאֵ֖ל וְ/הַ/מֶּ֑לֶךְ וַ/יֹּאמְר֖וּ צַדִּ֥יק יְהוָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/006.yaml
  text: Then the leaders of Israel and the king humbled themselves and said[a], “Yahweh is righteous.”
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు నాయకులూ[a] రాజూ తమను తాము తగ్గించుకున్నారు, “యాహ్వే నీతిమంతుడు” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ పాఠంలో ‘ఇశ్రాయేలు నాయకులు.’ ఈ సందర్భంలో ఇది రెహబాము పాలనలోని యూదా నాయకులను ప్రత్యేకంగా సూచిస్తుందని కొందరు అర్థం చేసుకుంటారు; అయితే మూలపాఠం ‘ఇశ్రాయేలు’ అని చెబుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: తమను తాము తగ్గించుకొని
  rationale: כנע క్రియ యొక్క నిఫాల్ రూపం ఇక్కడ ప్రవక్త గద్దింపుకు ప్రతిస్పందనగా తమను తాము తగ్గించుకోవడం లేదా లోబడడం అనే భావాన్ని ఇస్తుంది. ఈ అనువాదం ఆత్మవాచక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שָׂרֵי
  choice: నాయకులు
  rationale: שָׂרִים పాలకులు, అధిపతులు లేదా ఉన్నతాధికారులను సూచిస్తుంది. సందర్భానికి తగిన విస్తృత అర్థాన్ని ‘నాయకులు’ సహజంగా అందిస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: చారిత్రక సందర్భం యూదాతో సంబంధం ఉన్నప్పటికీ, హెబ్రీ మూలపాఠం స్పష్టంగా ‘ఇశ్రాయేలు’ అని చెబుతుంది; అందువల్ల దానిని వ్యాఖ్యానాత్మకంగా ‘యూదా’గా మార్చలేదు.
- source_word: וְהַמֶּלֶךְ
  choice: రాజూ
  rationale: నాయకుల నుండి రాజును ప్రత్యేకంగా చూపే సమన్వయ నామవాచక పదబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיֹּאמְרוּ
  choice: అన్నారు
  rationale: బహువచన కర్తను అనుసరించి కథన క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: צַדִּיק
  choice: నీతిమంతుడు
  rationale: ఇక్కడ ఈ పదం యాహ్వే తీర్పులో నైతికంగా న్యాయవంతుడూ సరైనవాడూ అని ప్రకటిస్తుంది. ‘నీతిమంతుడు’ దాని నైతిక, నిబంధనాత్మక బరువును నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని ఒక బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితుల లిప్యంతరీకరణను తెలుగులో ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: దైవనామాన్ని వ్యక్తినామంగా ఉంచాలా, బిరుదుతో అనువదించాలా
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో יְהוָה అనే దైవనామమే ఉంది. కాబట్టి బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా, ‘Jehovah’ రూపాన్ని ప్రతిబింబించే ‘యెహోవా’కు బదులు మూలనామానికి దగ్గరైన ‘యాహ్వే’ను వాడాం.
- issue: చారిత్రక సందర్భాన్ని బట్టి ‘ఇశ్రాయేలు’ను ‘యూదా’గా మార్చాలా
  choice: ఇశ్రాయేలు
  alternative: యూదా
  rationale: హెబ్రీ పాఠం ‘ఇశ్రాయేలు’ అని చెప్పడం వల్ల ఆ పదాన్నే నిలిపాం. ‘యూదా’గా మార్చడం పాఠంలోని సంభావ్య విస్తృత లేదా ప్రతినిధి భావాన్ని ముందుగానే పరిష్కరించే వ్యాఖ్యానాత్మక సమన్వయం అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘నాయకులూ రాజూ’ అనే రూపం సమన్వయాన్ని సహజంగా చూపుతుంది; మూలపాఠంలోని ‘ఇశ్రాయేలు’ అనే ఉద్రిక్తతను పాదసూచికతో యథాతథంగా నిలిపాం.
