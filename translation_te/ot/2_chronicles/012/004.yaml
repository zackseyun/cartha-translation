source:
  edition: WLC
  text: וַ/יִּלְכֹּ֛ד אֶת עָרֵ֥י הַ/מְּצֻר֖וֹת אֲשֶׁ֣ר לִֽ/יהוּדָ֑ה וַ/יָּבֹ֖א עַד יְרוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/004.yaml
  text: He captured the fortified cities that belonged to Judah and came as far as Jerusalem[a].
translation:
  language: te
  text: అతడు యూదాకు చెందిన ప్రాకారబద్ధమైన పట్టణాలను స్వాధీనం చేసుకున్నాడు; యెరూషలేము వరకు వచ్చాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెరూషలేము వరకు ముందుకు సాగాడు.’ హీబ్రూ వచనం అక్షరార్థంగా ‘యెరూషలేము వరకు వచ్చాడు’ అని చెబుతుంది. యూదాకు చెందిన ప్రాకారబద్ధమైన పట్టణాలను స్వాధీనం చేసుకున్న తర్వాత అతడు యెరూషలేము వరకు వచ్చినట్లు ఇది తెలియజేస్తుంది; అతడు నగరంలోకి ప్రవేశించాడని ఇది తప్పనిసరిగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: స్వాధీనం చేసుకొని
  rationale: לכד అనే క్రియ యుద్ధంలో పట్టణాలను పట్టుకోవడం లేదా వశపరచుకోవడం అనే భావాన్ని ఇస్తుంది. ‘స్వాధీనం చేసుకొని’ ఆధునిక తెలుగులో ఆ సైనిక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עָרֵי הַמְּצֻרוֹת
  choice: ప్రాకారబద్ధమైన పట్టణాలను
  rationale: ఈ పదబంధం రక్షణ ఏర్పాట్లు, ముఖ్యంగా ప్రాకారాలు గల పట్టణాలను సూచిస్తుంది. మూలంలోని ‘పట్టణాలు’ అనే నిర్దిష్టతను ఉంచుతూ ‘కోటలు’ అనే విస్తృతార్థాన్ని నివారిస్తుంది.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: యూదాకు చెందిన
  rationale: ఇక్కడ ל రాజకీయ అధీనత లేదా అనుబంధాన్ని సూచిస్తుంది. ‘యూదాకు చెందిన’ అనేది కేవలం భౌగోళికంగా యూదాలో ఉన్నవని కాక, వాటి అనుబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיָּבֹא עַד יְרוּשָׁלָם
  choice: యెరూషలేము వరకు వచ్చాడు
  rationale: בוא తో కూడిన עַד గమనానికి ఒక హద్దును సూచిస్తుంది. ఈ అనువాదం అతడు యెరూషలేమును చేరుకున్నాడనే భావాన్ని ఉంచుతుంది గాని, నగరంలోకి ప్రవేశించాడని నిర్బంధంగా చెప్పదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘యెరూషలేము వరకు’ అనే రూపం మూలంలోని గమనహద్దును, నగరంలో ప్రవేశించాడా లేదా అన్న అనిశ్చితిని కాపాడుతుంది.
