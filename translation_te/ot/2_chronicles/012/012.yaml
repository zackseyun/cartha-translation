- from: అతడు తనను తాను తగ్గించుకున్నప్పుడు, యెహోవా కోపం అతని మీద నుంచి తొలగిపోయింది; ఆయన అతన్ని పూర్తిగా నాశనం చేయలేదు. అంతేకాక, యూదాలో కొన్ని మంచి విషయాలు[a] ఉన్నాయి.
  to: అతడు తనను తాను వినయపరచుకున్నప్పుడు, యెహోవా కోపం అతని నుండి తొలగిపోయింది, అతన్ని పూర్తిగా నాశనం చేయకుండా; యూదాలో కూడా మంచి విషయాలు[a] ఉన్నాయి.
