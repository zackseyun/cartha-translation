source:
  edition: WLC
  text: וּ/בְ/הִכָּֽנְע֗/וֹ שָׁ֤ב מִמֶּ֨/נּוּ֙ אַף יְהוָ֔ה וְ/לֹ֥א לְ/הַשְׁחִ֖ית לְ/כָלָ֑ה וְ/גַם֙ בִּֽ/יהוּדָ֔ה הָיָ֖ה דְּבָרִ֥ים טוֹבִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/012.yaml
  text: And when he humbled himself[a], the anger of Yahweh turned away from him, so as not to destroy him completely[b]; and also in Judah there were good things.
translation:
  language: te
  text: అతడు తనను తాను వినయపరచుకున్నప్పుడు, యెహోవా కోపం అతని నుండి తొలగిపోయింది, అతన్ని పూర్తిగా నాశనం చేయకుండా; యూదాలో కూడా మంచి విషయాలు[a] ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మంచి విషయాలు.” ఈ మాట యూదాలో ఉన్న ప్రశంసనీయమైన పరిస్థితులు, కార్యాలు లేదా ఇతర మంచి అంశాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהִכָּנְעוֹ
  choice: అతడు తనను తాను తగ్గించుకున్నప్పుడు
  rationale: בְּతో కూడిన హిత్పయేల్ క్రియారూపం కాలసూచకంగా ఉండి, రెహబాము స్వయంగా తనను తాను తగ్గించుకున్నాడనే ప్రతిబింబార్థాన్ని తెలియజేస్తుంది.
- source_word: שָׁב מִמֶּנּוּ אַף יְהוָה
  choice: యెహోవా కోపం అతని మీద నుంచి తొలగిపోయింది
  rationale: שׁוּב మరియు מִן కలయిక కోపం అతని నుంచి వెనుదిరిగిందనే దిశార్థాన్ని ఇస్తుంది. ‘తొలగిపోయింది’ సహజమైన తెలుగులో ఆ భావాన్ని నిలుపుతుంది; ‘మనస్సు మార్చుకున్నాడు’ వంటి అధిక వ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంగా అందిస్తుంది.
- source_word: וְלֹא לְהַשְׁחִית לְכָלָה
  choice: ఆయన అతన్ని పూర్తిగా నాశనం చేయలేదు
  rationale: ప్రతికూల క్రియార్థం మరియు לְכָלָה ఇచ్చే సంపూర్ణత భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది. సందర్భానుసారంగా కర్త యెహోవా, కర్మ రెహబాము అని స్పష్టం చేయబడింది.
- source_word: וְגַם בִּיהוּדָה הָיָה דְּבָרִים טוֹבִים
  choice: అంతేకాక, యూదాలో కొన్ని మంచి విషయాలు ఉన్నాయి
  rationale: דְּבָרִים అనే విస్తృత పదాన్ని నిర్దిష్టంగా సత్కార్యాలు, పరిస్థితులు లేదా మాటలు అని పరిమితం చేయకుండా ‘విషయాలు’గా ఉంచుతుంది.
theological_decisions:
- issue: దైవ తీర్పు తగ్గించబడిన విధానం
  choice: యెహోవా కోపం అతని మీద నుంచి తొలగిపోయింది; ఆయన అతన్ని పూర్తిగా నాశనం చేయలేదు
  alternative: యెహోవా పశ్చాత్తాపపడి అతన్ని అసలు శిక్షించలేదు
  rationale: మూలపాఠం కోపం వెనుదిరగడాన్ని, సంపూర్ణ నాశనం జరగకపోవడాన్ని చెబుతుంది; అన్ని పరిణామాలు రద్దయ్యాయని గానీ, దేవుడు తప్పును సరిదిద్దుకున్నాడని గానీ చెప్పదు.
- issue: యూదాలోని ‘మంచి విషయాల’ స్వరూపం
  choice: కొన్ని మంచి విషయాలు
  alternative: మంచి క్రియలు / అనుకూల పరిస్థితులు
  rationale: మూలంలోని דְּבָרִים טוֹבִים ఉద్దేశపూర్వకంగా విస్తృతమైనది. దానిని నైతిక సంస్కరణగా, సత్కార్యాలుగా లేదా శ్రేయోస్థితిగా మాత్రమే నిర్ణయించకుండా అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘తనను తాను తగ్గించుకున్నప్పుడు’ అనే రూపం ప్రతిబింబార్థాన్ని స్పష్టంగా ఉంచుతుంది; చివరి పదబంధంలోని విస్తృతతను పాదటిప్పణితో సంరక్షించింది.
