id: 2CH.12.11
reference: 2 Chronicles 12:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֛י מִ/דֵּי ב֥וֹא הַ/מֶּ֖לֶךְ בֵּ֣ית יְהוָ֑ה בָּ֤אוּ הָ/רָצִים֙ וּ/נְשָׂא֔וּ/ם וֶ/הֱשִׁב֖וּ/ם אֶל תָּ֥א הָ/רָצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/011.yaml
  text: And whenever the king entered the house of Yahweh[a], the guards would come and carry them[c][b], and then return them to the guards’ chamber.
translation:
  language: te
  text: రాజు యాహ్వే మందిరంలోకి ప్రవేశించినప్పుడల్లా, అంగరక్షకులు[a] వాటిని[b] మోసుకొని వచ్చి, తరువాత వాటిని అంగరక్షకుల గదికి[c] తిరిగి తీసుకెళ్లేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘పరుగెత్తేవారు’; ఇక్కడ రాజ అంగరక్షక దళం ఉద్దేశించబడింది.
    reason: lexical_alternative
  - marker: b
    text: ‘వాటిని’ అనే మాట ముందరి వచనంలో పేర్కొన్న కంచు డాళ్లను సూచిస్తుంది.
    reason: cross_reference
  - marker: c
    text: లేదా, ‘కాపలాదారుల గదికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדֵּי בּוֹא
  choice: వెళ్లినప్పుడల్లా
  rationale: మִדֵּי + క్రియావాచక రూపం పదేపదే జరిగే సందర్భాన్ని సూచిస్తుంది; ‘వెళ్లినప్పుడల్లా’ ఆ పునరావృత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే మందిరం
  rationale: బַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఇక్కడ అది ఆరాధనా మందిరాన్ని సూచిస్తుంది. సాధారణ పాఠకులకు సహజంగా ఉండేందుకు ‘మందిరం’ వాడబడింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుగా మార్చకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించాం.
- source_word: הָרָצִים
  choice: అంగరక్షకులు
  rationale: అక్షరార్థం ‘పరుగెత్తేవారు’; రాజసభ సందర్భంలో ఇది రాజుకు రక్షణగా ఉండే దళాన్ని సూచిస్తుంది. ‘అంగరక్షకులు’ వారి విధిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּנְשָׂאוּם
  choice: వాటిని మోసుకెళ్లి
  rationale: కర్మప్రత్యయం ముందరి వచనంలోని కంచు డాళ్లను సూచిస్తుంది; అయితే మూలంలోని సర్వనామాన్ని ప్రధాన పాఠ్యంలో అలాగే ఉంచాం.
- source_word: וֶהֱשִׁיבוּם
  choice: వాటిని ... తిరిగి చేర్చేవారు
  rationale: హిఫిల్ రూపం వస్తువులను మళ్లీ వాటి నిల్వస్థలానికి తీసుకురావడాన్ని సూచిస్తుంది.
- source_word: תָּא הָרָצִים
  choice: అంగరక్షకుల ప్రత్యేక గది
  rationale: תָּא అనేది గది లేదా చిన్న ప్రత్యేక గదిని సూచిస్తుంది; అనుబంధ పదబంధం అది అంగరక్షకులకు చెందినదని తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: వచనంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత ధ్వనిరూపాన్ని తెలుగులో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. పునరావృత చర్యను ‘వెళ్లినప్పుడల్లా’ మరియు ‘చేర్చేవారు’ ద్వారా స్పష్టంగా నిలిపాం; మూలంలోని సర్వనామ సూచనను పాదసూచికతో వివరించాం.
