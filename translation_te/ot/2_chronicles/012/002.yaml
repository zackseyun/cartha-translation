  terminology: “ఐగుప్తు,” “షీషకు,” “యెరూషలేము,” and “యెహోవా” are suitable established biblical forms. “నమ్మకద్రోహం” preserves the serious relational and covenantal force of the Hebrew verb. The footnote gives legitimate lexical alternatives and correctly identifies the covenant-breach sense.
