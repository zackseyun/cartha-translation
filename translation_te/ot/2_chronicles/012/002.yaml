id: 2CH.12.2
reference: 2 Chronicles 12:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֞י בַּ/שָּׁנָ֤ה הַֽ/חֲמִישִׁית֙ לַ/מֶּ֣לֶךְ רְחַבְעָ֔ם עָלָ֛ה שִׁישַׁ֥ק מֶֽלֶךְ מִצְרַ֖יִם עַל יְרוּשָׁלִָ֑ם כִּ֥י מָעֲל֖וּ בַּ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/002.yaml
  text: And in the fifth year of King Rehoboam[a], Shishak king of Egypt came up against Jerusalem, because they had acted unfaithfully against Yahweh.
translation:
  language: te
  text: రెహబాము రాజు పరిపాలనలో ఐదవ సంవత్సరంలో, ఐగుప్తు రాజైన షీషకు యెరూషలేము మీదికి వచ్చాడు. ఎందుకంటే వారు యెహోవాకు నమ్మకద్రోహం చేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా పట్ల అవిశ్వాసంగా ప్రవర్తించారు,” లేదా “యెహోవాకు విరోధంగా అపరాధం చేశారు.” హీబ్రూ క్రియ విశ్వాసాన్ని లేదా ఒడంబడికను భంగం చేయడమనే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: …సంవత్సరంలో
  rationale: హీబ్రూ కథనారంభ సూత్రాన్ని తెలుగులో కృత్రిమంగా ‘అప్పుడు జరిగింది’ అని అనకుండా, కాలసూచనతో సహజంగా కథనాన్ని కొనసాగిస్తుంది.
- source_word: בַּשָּׁנָה הַחֲמִישִׁית לַמֶּלֶךְ רְחַבְעָם
  choice: రెహబాము రాజు పరిపాలనలో ఐదవ సంవత్సరంలో
  rationale: ఇది రాజ్యపాలన సంవత్సరాన్ని సూచిస్తుంది; ‘పరిపాలనలో’ అనడం తెలుగులో భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: עָלָה … עַל יְרוּשָׁלִָם
  choice: యెరూషలేము మీదికి వచ్చాడు
  rationale: సైనిక సందర్భంలోని శత్రుత్వపూర్వక రాకను తెలియజేస్తూనే, దాడి ఇప్పటికే జరిగిందని అతిగా నిర్దిష్టపరచకుండా హీబ్రూ ప్రయోగాన్ని నిలుపుతుంది.
- source_word: שִׁישַׁק מֶלֶךְ מִצְרַיִם
  choice: ఐగుప్తు రాజైన షీషకు
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించి, construct సంబంధాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: షీషకు రాకకు గ్రంథకర్త ఇచ్చిన కారణాన్ని స్పష్టమైన కారణార్థక సంధానంతో తెలియజేస్తుంది.
- source_word: מָעֲלוּ
  choice: నమ్మకద్రోహం చేశారు
  rationale: מעלలోని విశ్వాసభంగం, ఒడంబడిక సంబంధమైన అవిశ్వాసం అనే బలమైన భావాన్ని సాధారణ ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בַּיהוָה
  choice: యెహోవాకు
  rationale: מעל + ב సూచించే, దేవుని పట్ల చేసిన విశ్వాసభంగాన్ని తెలుగులో సహజమైన సంప్రదాన విభక్తితో తెలియజేస్తుంది; దైవనామాన్ని లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: షీషకు దండయాత్రకు ఒడంబడిక సంబంధమైన కారణం
  choice: ఎందుకంటే వారు యెహోవాకు నమ్మకద్రోహం చేశారు
  alternative: ఎందుకంటే వారు యెహోవా పట్ల అవిశ్వాసంగా ప్రవర్తించారు
  rationale: రాజకీయ సంఘటనను యెహోవా పట్ల జరిగిన విశ్వాసభంగంతో గ్రంథం నేరుగా అనుసంధానిస్తుంది. అనువాదం ఆ కారణ సంబంధాన్ని, సంబంధపరమైన అపరాధాన్ని తగ్గించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘దండెత్తాడు/దాడి చేశాడు’ అనే అతినిర్దిష్ట పదాలకు బదులుగా మూలంలోని కదలికను ‘మీదికి వచ్చాడు’గా ఉంచాం.
