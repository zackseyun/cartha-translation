source:
  edition: WLC
  text: וַ/יִּתְחַזֵּ֞ק הַ/מֶּ֧לֶךְ רְחַבְעָ֛ם בִּ/ירוּשָׁלִַ֖ם וַ/יִּמְלֹ֑ךְ כִּ֣י בֶן אַרְבָּעִ֣ים וְ/אַחַ֣ת שָׁנָה֩ רְחַבְעָ֨ם בְּ/מָלְכ֜/וֹ וּֽ/שֲׁבַ֨ע עֶשְׂרֵ֥ה שָׁנָ֣ה מָלַ֣ךְ בִּֽ/ירוּשָׁלִַ֗ם הָ֠/עִיר אֲשֶׁר בָּחַ֨ר יְהוָ֜ה לָ/שׂ֨וּם אֶת שְׁמ֥/וֹ שָׁם֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָֽ/עַמֹּנִֽית־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/013.yaml
  text: So King Rehoboam strengthened himself in Jerusalem and reigned[a]. Rehoboam was forty-one years old when he began to reign, and he reigned seventeen years in Jerusalem, the city that Yahweh had chosen from all the tribes of Israel to put his name there[b]. And his mother’s name was Naamah the Ammonite.
translation:
  language: te
  text: రాజైన రెహబాము యెరూషలేములో తన అధికారాన్ని స్థిరపరచుకొని[a] పరిపాలించాడు. రెహబాము రాజైనప్పుడు నలభై ఒక్క సంవత్సరాల వయసు గలవాడు; అతడు యెహోవా తన నామాన్ని అక్కడ ఉంచడానికి ఇశ్రాయేలు గోత్రాలన్నిటిలోనుండి ఎంచుకున్న నగరమైన యెరూషలేములో పదిహేడు సంవత్సరాలు పరిపాలించాడు. అతని తల్లి పేరు నయమా; ఆమె అమ్మోనీయురాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెరూషలేములో తనను తాను బలపరచుకొని.” హీబ్రూ క్రియ బలపడడం లేదా స్థిరపడడం అనే భావాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: తన స్థానాన్ని బలపరచుకొని
  rationale: హిత్పయేల్ రూపంలోని ఆత్మార్థక భావాన్నీ, సంక్షోభం తరువాత రెహబాము తన అధికారాన్ని స్థిరపరచుకున్న సందర్భాన్నీ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; కేవలం శారీరక బలాన్ని సూచించదు.
- source_word: וַיִּמְלֹךְ
  choice: పరిపాలించాడు
  rationale: క్రియ కథన క్రమాన్ని కొనసాగిస్తుంది. రాజ్యారంభాన్ని అతిగా నిర్దిష్టం చేయకుండా, రాజుగా పాలించిన భావాన్ని ఇస్తుంది.
- source_word: כִּי ... בְּמָלְכוֹ
  choice: రాజైనప్పుడు
  rationale: ఇది రాజుల పాలనా వివరాల్లో సింహాసనారోహణ సమయపు వయస్సును తెలిపే నిర్మాణం; ఆధునిక తెలుగులో ‘రాజైనప్పుడు’ సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంలో ఉంచింది.
- source_word: לָשׂוּם אֶת־שְׁמוֹ שָׁם
  choice: తన నామాన్ని అక్కడ ఉంచడానికి
  rationale: ఆలయ-ఎన్నికకు సంబంధించిన హీబ్రూ నుడికారాన్ని సిద్ధాంతాత్మక వివరణగా విస్తరించకుండా దాని స్పష్టమైన రూపంలో నిలుపుతుంది.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాలన్నిటిలోనుండి
  rationale: మొత్తం ఇశ్రాయేలు గోత్రాల మధ్యనుండి యెరూషలేము ఎంపిక చేయబడిందనే מן యొక్క ఎంపిక భావాన్ని కాపాడుతుంది.
- source_word: הָעַמֹּנִית
  choice: అమ్మోనీయురాలు
  rationale: స్త్రీలింగ జాతివాచకాన్ని సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని సాధారణ బిరుదుగా మార్చకుండా తెలుగులో గుర్తించదగిన లిప్యంతరీకరణతో నిలుపుతుంది.
- issue: ‘తన నామాన్ని అక్కడ ఉంచడానికి’ అనే ఆలయ-ఎన్నిక నుడికారం
  choice: మూలంలోని స్పష్టమైన నుడికారాన్ని అలాగే నిలుపడం
  alternative: తన సన్నిధిని అక్కడ స్థాపించడానికి
  rationale: ‘సన్నిధి’ వంటి వివరణాత్మక సిద్ధాంత పదాన్ని చేర్చడం కంటే, మూలపాఠంలోని నామాన్ని ఉంచడం అనే భావాన్ని అనువాదంలో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి. ‘తన స్థానాన్ని బలపరచుకొని’ అనేది అధికార స్థిరీకరణను సహజంగా తెలియజేస్తుంది. వాక్య నిర్మాణాన్ని తెలుగు పఠన సౌలభ్యానికి అనుగుణంగా విభజించినా, మూలంలోని రాజ్యకాల వివరాలు మరియు యెరూషలేము ఎన్నిక భావం యథాతథంగా ఉన్నాయి.
