translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే చారిత్రక వచనశైలి వాడబడింది. మూలవాక్యం ముందరి వచనంపై వ్యాకరణపరంగా ఆధారపడుతున్నందున తెలుగులో సహజమైన సంపూర్ణ వాక్యంగా ఉండేందుకు సందర్భంలో స్పష్టమైన ‘అతడు ... వచ్చాడు’ చేర్చబడింది. పాదసూచిక గుర్తులు అవి వివరిస్తున్న పదబంధాల వెంట సరైన క్రమంలో ఉంచబడ్డాయి.
