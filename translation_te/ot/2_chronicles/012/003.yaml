id: 2CH.12.3
reference: 2 Chronicles 12:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/אֶ֤לֶף וּ/מָאתַ֨יִם֙ רֶ֔כֶב וּ/בְ/שִׁשִּׁ֥ים אֶ֖לֶף פָּרָשִׁ֑ים וְ/אֵ֣ין מִסְפָּ֗ר לָ/עָ֞ם אֲשֶׁר בָּ֤אוּ עִמּ/וֹ֙ מִ/מִּצְרַ֔יִם לוּבִ֥ים סֻכִּיִּ֖ים וְ/כוּשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/003.yaml
  text: 'with 1,200 chariots and 60,000 horsemen[a], and the people who came with him from Egypt were without number: Libyans, Sukkites[c][b], and Cushites.'
translation:
  language: te
  text: అతడు 1,200 రథాలతో, 60,000 గుర్రపు రౌతులతో వచ్చాడు. అతనితో ఈజిప్టు నుండి వచ్చిన జనానికి లెక్కే లేదు[a]—లూబీయులు, సుక్కీయులు[b], కూషీయులు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘లెక్కించలేనంత మంది’; అక్షరార్థంగా, ‘జనానికి సంఖ్య లేదు.’
    reason: lexical_alternative
  - marker: b
    text: ‘సుక్కీయులు’ అనేది ఖచ్చితంగా ఎవరో తెలియని ఒక ప్రజావర్గపు పేరుకు లిప్యంతరీకరణ; దీనిని ‘సుక్కీమ్’ అని కూడా లిప్యంతరీకరిస్తారు.
    reason: cultural_note
  - marker: c
    text: ‘కూషీయులు’కు బదులుగా ‘ఇథియోపియన్లు’ అని కూడా అనువదిస్తారు; అయితే ‘కూషీయులు’ అనే రూపం హీబ్రూ జాతి-భౌగోళిక పదాన్ని మరింత నేరుగా ప్రతిబింబిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/אֶלֶף וּ/מָאתַיִם רֶכֶב
  choice: 1,200 రథాలతో
  rationale: సైనిక బలగాల లెక్కలో בְ ఉపసర్గ సహవాసాన్ని సూచిస్తుంది; רֶכֶב ఇక్కడ సంఖ్యతో కలిసి ఉన్నందున ‘రథాలు’ అని సహజంగా అనువదించబడింది.
- source_word: וּ/בְ/שִׁשִּׁים אֶלֶף פָּרָשִׁים
  choice: 60,000 గుర్రపు రౌతులతో
  rationale: פָּרָשִׁים అనేది గుర్రాలపై యుద్ధం చేసే దళాన్ని సూచిస్తుంది; ‘గుర్రపు రౌతులు’ చారిత్రక సైనిక సందర్భంలో స్పష్టమైన, సహజమైన తెలుగు పదబంధం.
- source_word: וְ/אֵין מִסְפָּר לָ/עָם
  choice: జనానికి లెక్కే లేదు
  rationale: హీబ్రూ నుడికారంలోని ‘లెక్కించలేనంత మంది’ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, עָםను అతిగా ‘సైన్యం’గా నిర్దిష్టం చేయకుండా ‘జనం’గా ఉంచింది.
- source_word: אֲשֶׁר בָּאוּ עִמּ/וֹ מִ/מִּצְרַיִם
  choice: అతనితో ఈజిప్టు నుండి వచ్చిన
  rationale: సహవాసం, వచ్చిన ప్రదేశం రెండింటినీ మూలపాఠం క్రమానికి దగ్గరగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לוּבִים
  choice: లూబీయులు
  rationale: ఈ జాతిపేరును సాధారణంగా లిబ్యా ప్రాంత ప్రజలతో గుర్తిస్తారు; మూలపేరుకు దగ్గరగా ఉండే తెలుగు రూపాన్ని ఎంచుకుంది.
- source_word: סֻכִּיִּים
  choice: సుక్కీయులు
  rationale: ఈ ప్రజావర్గం యొక్క ఖచ్చితమైన గుర్తింపు అనిశ్చితం; అందువల్ల నిర్దిష్ట గుర్తింపును రుద్దకుండా హీబ్రూ పేరును లిప్యంతరీకరించింది.
- source_word: וְ/כוּשִׁים
  choice: కూషీయులు
  rationale: כּוּשׁ అనే చారిత్రక-భౌగోళిక పేరును నేరుగా ప్రతిబింబిస్తుంది; ఆధునిక ‘ఇథియోపియన్లు’ అనే మరింత నిర్దిష్ట గుర్తింపును రుద్దదు.
