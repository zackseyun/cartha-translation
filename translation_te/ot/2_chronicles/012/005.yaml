source:
  edition: WLC
  text: וּֽ/שְׁמַֽעְיָ֤ה הַ/נָּבִיא֙ בָּ֣א אֶל רְחַבְעָ֔ם וְ/שָׂרֵ֣י יְהוּדָ֔ה אֲשֶׁר נֶאֶסְפ֥וּ אֶל יְרוּשָׁלִַ֖ם מִ/פְּנֵ֣י שִׁישָׁ֑ק וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּה אָמַ֣ר יְהוָ֗ה אַתֶּם֙ עֲזַבְתֶּ֣ם אֹתִ֔/י וְ/אַף אֲנִ֛י עָזַ֥בְתִּי אֶתְ/כֶ֖ם בְּ/יַד שִׁישָֽׁק־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/005.yaml
  text: 'Then Shemaiah the prophet came to Rehoboam and the officials of Judah who had gathered in Jerusalem because of Shishak[a], and he said to them, “Thus says Yahweh: You have forsaken me, so I also have forsaken you into the hand of Shishak.”'
translation:
  language: te
  text: 'అప్పుడు షెమయా ప్రవక్త రెహబాము వద్దకు, షీషకు కారణంగా[a] యెరూషలేములో కూడివచ్చిన యూదా అధికారుల వద్దకు వచ్చి, వారితో ఇలా అన్నాడు: “యాహ్వే ఇలా అంటున్నాడు: ‘మీరు నన్ను విడిచిపెట్టారు; కాబట్టి నేనూ షీషకు చేతికి మిమ్మల్ని విడిచిపెట్టాను.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “షీషకు ఎదుటనుండి”; అంటే షీషకు కారణంగా లేదా అతనికి భయపడి.'
    reason: మూల నుడికారంలోని అక్షరార్థాన్నీ, సందర్భంలో సాధ్యమైన కారణ/భయ భావాలనూ చూపించడం.
lexical_decisions:
- source_word: וּ/שְׁמַעְיָה הַ/נָּבִיא
  choice: అప్పుడు షెమయా ప్రవక్త
  rationale: וּ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది. נָבִיא ను ‘ప్రవక్త’గా అనువదించాం.
- source_word: בָּא אֶל רְחַבְעָם וְ/שָׂרֵי יְהוּדָה
  choice: రెహబాము దగ్గరికీ ... యూదా అధికారుల దగ్గరికీ వచ్చి
  rationale: בָּא אֶל రాకను సూచిస్తుంది. שָׂרֵי అనే పదం ఈ రాజసభా-పాలనా సందర్భంలో ‘అధికారులు’ అని సహజంగా వస్తుంది; ‘రాజకుమారులు’ అనే అవసరానికి మించిన అర్థాన్ని రుద్దదు.
- source_word: אֲשֶׁר נֶאֶסְפוּ אֶל יְרוּשָׁלַםִ
  choice: యెరూషలేములో కూడివచ్చిన
  rationale: నిఫాల్ రూపం వారు సమకూడిన సంగతిని తెలియజేస్తుంది. గమ్యస్థానంతో పాటు ఏర్పడిన స్థితిని తెలుగులో ‘యెరూషలేములో కూడివచ్చిన’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מִ/פְּנֵי שִׁישָׁק
  choice: షీషకు కారణంగా[a]
  rationale: ఈ పదబంధానికి అక్షరార్థంగా ‘షీషకు ఎదుటనుండి’ అనే భావం ఉంది; సందర్భంలో అతని రాక లేదా అతని పట్ల భయం కారణమని సూచిస్తుంది. ప్రధాన పాఠంలో విస్తృతమైన కారణార్థాన్ని ఉంచి, నిర్దిష్ట భావసూచనను పాదటిప్పణిలో ఇచ్చాం.
- source_word: כֹּה אָמַר יְהוָה
  choice: యాహ్వే ఇలా అంటున్నాడు
  rationale: ప్రవక్త ద్వారా వచ్చే సందేశ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, יְהוָה అనే దైవనామాన్ని పేరుగానే లిప్యంతరీకరించాం.
- source_word: עֲזַבְתֶּם אֹתִי ... עָזַבְתִּי אֶתְכֶם
  choice: మీరు నన్ను విడిచిపెట్టారు ... నేను కూడా మిమ్మల్ని ... విడిచిపెట్టాను
  rationale: రెండుసార్లు వచ్చిన עָזַב కు ఒకే తెలుగు పదబంధాన్ని వాడి, ప్రజల చర్యకూ దేవుని ప్రతిచర్యకూ మధ్య ఉన్న ఉద్దేశపూర్వక వాక్యసామ్యాన్ని నిలిపాం.
- source_word: וְ/אַף אֲנִי
  choice: కాబట్టి నేను కూడా
  rationale: ఇది కేవలం జోడింపే కాక, వారి చర్యకు అనురూపమైన దైవిక ప్రతిచర్యను సూచిస్తుంది. ‘కాబట్టి ... కూడా’ ఆ సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְּ/יַד שִׁישָׁק
  choice: షీషకు చేతికి
  rationale: ‘చేతిలో/చేతికి’ అనే హెబ్రీ నుడికారం ఒకరి అధికారానికి అప్పగించబడటాన్ని సూచిస్తుంది. తెలుగు బైబిలు శైలిలోనూ అర్థమయ్యే ‘చేతికి’ రూపం ఆ న్యాయతీర్పు భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో నాలుగు అక్షరాల దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని ఇచ్చాం.
- issue: దేవుడు వారిని ‘విడిచిపెట్టడం’ అనే తీర్పు భాష
  choice: అదే క్రియను రెండుచోట్లా ‘విడిచిపెట్టారు/విడిచిపెట్టాను’గా నిలుపడం
  alternative: రెండవ చోట ‘అప్పగించాను’ అని భావానువాదం చేయడం
  rationale: దేవుడు వారిని షీషకు అధికారానికి అప్పగించాడనే భావం సందర్భంలో ఉన్నప్పటికీ, మూలంలో ప్రజలకూ దేవునికీ ఒకే עָזַב క్రియ వాడబడింది. ఆ గంభీరమైన ప్రతిస్పందనాత్మక సమాంతరతను అనువాదం మౌనంగా తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజ వాక్యనిర్మాణంతో పాటు ప్రవక్త సందేశానికి తగిన గంభీరతను నిలిపాం. పేర్లను తెలుగు లిపిలో స్థిరంగా లిప్యంతరీకరించాం; ‘అధికారులు’ వంటి ప్రస్తుత వాడుక పదాన్ని ఎంచుకున్నాం.
