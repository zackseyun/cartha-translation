language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/הָכִ֞ין מַלְכ֤וּת רְחַבְעָם֙ וּ/כְ/חֶזְקָת֔/וֹ עָזַ֖ב אֶת תּוֹרַ֣ת יְהוָ֑ה וְ/כָל יִשְׂרָאֵ֖ל עִמּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/001.yaml
  text: And when Rehoboam’s kingdom was established[a], and he had become strong, he abandoned the law of Yahweh—and all Israel with him.
translation:
  language: te
  text: రెహబాము రాజ్యం స్థిరపడి, అతడు బలపడినప్పుడు, అతడు యెహోవా ధర్మశాస్త్రాన్ని[a] విడిచిపెట్టాడు; ఇశ్రాయేలంతా అతనితోపాటు విడిచిపెట్టింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యెహోవా ఉపదేశాన్ని.’ హీబ్రూ తోరా అనే పదానికి సందర్భాన్ని బట్టి ‘ధర్మశాస్త్రం’ లేదా ‘ఉపదేశం’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּהָכִין
  choice: స్థిరపడి ... అప్పుడు
  rationale: వాక్యారంభంలోని కాలసూచక పరిస్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, כון యొక్క రాజ్య స్థిరీకరణ భావాన్ని నిలుపుతుంది.
- source_word: מַלְכוּת רְחַבְעָם
  choice: రెహబాము రాజ్యం
  rationale: మַלְכוּת ఇక్కడ రాజ్యాన్ని లేదా రాజపాలనను సూచిస్తుంది; సందర్భంలో ‘రాజ్యం’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: וּכְחֶזְקָתוֹ
  choice: అతడు బలపడినప్పుడు
  rationale: రెహబాము బలం, స్థిరత్వం సంపాదించిన కాలపరిస్థితిని స్పష్టంగా వ్యక్తం చేస్తుంది; భద్రపడ్డాడు అనే భావాన్ని అతిగా నిర్ధారించదు.
- source_word: עָזַב
  choice: విడిచిపెట్టాడు
  rationale: నిబంధనపరమైన అవిధేయతను ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేసే సహజమైన పదం.
- source_word: תּוֹרַת יְהוָה
  choice: యెహోవా ధర్మశాస్త్రాన్ని
  rationale: תּוֹרָהకు ‘ధర్మశాస్త్రం’ లేదా ‘ఉపదేశం’ అనే భావాలు ఉండవచ్చు. ఈ చారిత్రక-నిబంధన సందర్భంలో ‘ధర్మశాస్త్రం’ ప్రధాన పాఠంలో సరిపోతుంది; ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: ఇశ్రాయేలీయులందరూ అతనితోపాటు విడిచిపెట్టారు
  rationale: హీబ్రూ సంక్షిప్త అన్వయాన్ని తెలుగులో సహజంగా పూర్తి చేసి, ప్రజలు కూడా రెహబాముతో కలిసి అదే చర్య చేశారనే భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: విభజిత రాజ్య కాలంలో ‘ఇశ్రాయేలీయులందరూ’ అనే పదబంధపు పరిధి
  choice: ఇశ్రాయేలీయులందరూ
  alternative: యూదావారందరూ; అతని ప్రజలందరూ
  rationale: హీబ్రూ כָל־יִשְׂרָאֵלను అలాగే నిలుపుతూ, అది యూదా-బెన్యామీనుకు మాత్రమే వర్తిస్తుందా లేక విస్తృత నిబంధన ప్రజలను సూచిస్తుందా అన్న చారిత్రక పరిధిని అనువాదంలో ముందుగానే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి. హీబ్రూ కాలసూచక నిర్మాణాన్ని సహజమైన తెలుగు ఉపవాక్యాలుగా మలిచాం. చివరి సంక్షిప్త హీబ్రూ పదబంధంలో సూచిత క్రియను తెలుగులో పునరుక్తి చేసి అనిశ్చితిని తొలగించకుండా వాక్యాన్ని స్పష్టం చేశాం.
