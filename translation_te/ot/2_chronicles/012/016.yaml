  text: וַ/יִּשְׁכַּ֤ב רְחַבְעָם֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵ֖ר בְּ/עִ֣יר דָּוִ֑יד וַ/יִּמְלֹ֛ךְ אֲבִיָּ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/016.yaml
  text: And Rehoboam slept with his fathers and was buried in the city of David[a], and Abijah his son reigned in his place.
translation:
  language: te
  text: రెహబాము తన పితరులతో నిద్రించాడు[a]. అతన్ని దావీదు పట్టణంలో పాతిపెట్టారు. అతని కుమారుడు అబీయా అతని స్థానంలో రాజ్యమేలాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తన పితరులతో నిద్రించాడు” అనేది మరణించి పూర్వీకుల వరుసలో చేరడాన్ని సూచించే సాంప్రదాయ హీబ్రూ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: నిద్రించాడు
  rationale: రాజుల మరణాన్ని తెలిపే హీబ్రూ సంప్రదాయ ప్రయోగాన్ని నిలుపుతుంది; వెంట వచ్చే సమాధి వాక్యం దాని భావాన్ని స్పష్టం చేస్తుంది.
- source_word: עִם אֲבֹתָיו
  choice: తన పితరులతో
  rationale: వంశపారంపర్య సందర్భంలోని సూత్రబద్ధమైన హీబ్రూ ప్రయోగాన్ని సమీపంగా ప్రతిబింబిస్తుంది; ఆధునిక పాఠకునికి అర్థం కావడానికి పాదసూచిక ఇవ్వబడింది.
- source_word: וַיִּקָּבֵר
  choice: అతన్ని పాతిపెట్టారు
  rationale: హీబ్రూ కర్మణి రూపంలోని భావాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది.
- source_word: בְּעִיר דָּוִיד
  choice: దావీదు పట్టణంలో
  rationale: ఈ గుర్తింపు పొందిన స్థలనామ ప్రయోగానికి స్పష్టమైన, సహజమైన తెలుగు రూపం.
- source_word: וַיִּמְלֹךְ
  choice: రాజ్యమేలాడు
  rationale: రాజవంశ వారసత్వ ప్రకటనల్లో מלך క్రియకు తగిన గంభీరమైన తెలుగు సమానార్థకం.
- source_word: אֲבִיָּה
  choice: అబీయా
  rationale: ఈ వచనంలోని אֲבִיָּה రూపాన్నే అనుసరిస్తుంది; ఇతర చోట్ల కనిపించే అబీయాము అనే భిన్న రూపాన్ని దిగుమతి చేయదు.
- source_word: בְנוֹ
  choice: అతని కుమారుడు
  rationale: మూలంలోని నేరమైన పుత్ర సంబంధ సూచనను యథాతథంగా అందిస్తుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: రాజ్య వారసత్వాన్ని సూచించే హీబ్రూ ప్రయోగానికి సన్నిహితమైన, సహజమైన తెలుగు రూపం.
