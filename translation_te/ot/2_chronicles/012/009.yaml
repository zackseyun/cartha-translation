id: 2CH.12.9
reference: 2 Chronicles 12:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֨עַל שִׁישַׁ֥ק מֶֽלֶךְ מִצְרַיִם֮ עַל יְרוּשָׁלִַם֒ וַ/יִּקַּ֞ח אֶת אֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֹֽצְרוֹת֙ בֵּ֣ית הַ/מֶּ֔לֶךְ אֶת הַ/כֹּ֖ל לָקָ֑ח וַ/יִּקַּח֙ אֶת מָגִנֵּ֣י הַ/זָּהָ֔ב אֲשֶׁ֥ר עָשָׂ֖ה שְׁלֹמֹֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/009.yaml
  text: So Shishak king of Egypt came up against Jerusalem and took the treasuries of the house of Yahweh and the treasuries of the king’s house[a]. He took everything[b]; he also took the gold shields that Solomon had made.
translation:
  language: te
  text: ఈజిప్టు రాజైన షీషకు యెరూషలేము మీదికి దండెత్తి వచ్చి, యాహ్వే గృహంలోని ఖజానాలను[a], రాజు గృహంలోని ఖజానాలను[b] తీసుకుపోయాడు. అతడు అన్నిటినీ తీసుకుపోయాడు; సొలొమోను చేసిన బంగారు డాళ్లను కూడా తీసుకుపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యాహ్వే దేవాలయంలోని ఖజానాలను.’
    reason: ‘యాహ్వే గృహం’ ఇక్కడ దేవాలయాన్ని సూచిస్తుంది; ఇది సందర్భాన్ని స్పష్టంచేసే సహజ ప్రత్యామ్నాయం.
  - marker: b
    text: లేదా ‘రాజభవనంలోని ఖజానాలను.’
    reason: ‘రాజు గృహం’ అనే అక్షరార్థ పదబంధానికి సందర్భానుసారమైన సహజ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: וַיַּעַל ... עַל יְרוּשָׁלִַם
  choice: యెరూషలేము మీదికి దండెత్తి వచ్చి
  rationale: సైనిక సందర్భంలో עלה ... על నగరంపై దండెత్తి రావడాన్ని సూచిస్తుంది. ఈ అనువాదం కదలికను, విరోధ చర్యను రెండింటినీ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: שִׁישַׁק מֶלֶךְ מִצְרַיִם
  choice: ఈజిప్టు రాజైన షీషకు
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించి, అతని రాజపదవిని సహజమైన తెలుగు సమాసంతో తెలిపింది.
- source_word: אֹצְרוֹת
  choice: ఖజానాలను
  rationale: దేవాలయం, రాజగృహం వంటి ప్రదేశాల్లో భద్రపరచిన విలువైన సంపదను లేదా దాని నిల్వలను సందర్భానుసారంగా సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే గృహం
  rationale: హీబ్రూ భాషలోని ‘యాహ్వే గృహం’ అనే రూపకల్పనను నిలుపుతుంది; సందర్భంలో ఇది దేవాలయాన్ని సూచిస్తుందని పాదటిప్పణి స్పష్టం చేస్తుంది.
- source_word: בֵּית הַמֶּלֶךְ
  choice: రాజు గృహం
  rationale: మూలంలోని అక్షరార్థ రూపాన్ని, ముందున్న ‘యాహ్వే గృహం’తో సమాంతరతను నిలుపుతుంది; ‘రాజభవనం’ అనే సహజ ప్రత్యామ్నాయం పాదటిప్పణిలో ఇచ్చింది.
- source_word: אֶת־הַכֹּל לָקָח
  choice: అతడు అన్నిటినీ తీసుకుపోయాడు
  rationale: కొల్లగొట్టినది సంపూర్ణమని నొక్కిచెప్పే పునరుక్త వాక్యబలాన్ని నిలుపుతుంది.
- source_word: מָגִנֵּי הַזָּהָב
  choice: బంగారు డాళ్లు
  rationale: మגן అనే కవచాయుధానికి సాధారణ తెలుగు పదమైన ‘డాలు’ను ఉపయోగించి, అవి బంగారంతో చేసినవని స్పష్టంగా తెలిపింది.
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: సొలొమోను చేయించిన
  rationale: రాజైన సొలొమోను వాటిని తయారు చేయించిన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; మూలంలోని causative కాని సాధారణ ‘చేశాడు’ భావాన్ని అతిగా విస్తరించకుండా రాజసందర్భానికి తగిన విధంగా అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ప్రత్యక్షంగా ఉన్న చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. మూలంలోని ‘గృహం’ అనే సమాంతర నిర్మాణం, ‘అన్నిటినీ తీసుకుపోయాడు’ అనే ఉద్ఘాటన నిలుపబడ్డాయి.
