id: 2CH.12.14
reference: 2 Chronicles 12:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ הָ/רָ֑ע כִּ֣י לֹ֤א הֵכִין֙ לִבּ֔/וֹ לִ/דְר֖וֹשׁ אֶת יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/014.yaml
  text: And he did what was evil[a], because he had not set his heart to seek Yahweh.
translation:
  language: te
  text: అతడు యాహ్వేను వెదకడానికి తన హృదయాన్ని సిద్ధపరచలేదు[a] కాబట్టి చెడు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన హృదయాన్ని స్థిరపరచలేదు.”
    reason: הֵכִין అనే హీబ్రూ పదానికి “సిద్ధపరచడం”తో పాటు “స్థిరపరచడం, దృఢంగా నిలపడం” అనే భావం కూడా ఉండవచ్చు.
lexical_decisions:
- source_word: וַיַּעַשׂ הָרָע
  choice: చెడు చేశాడు
  rationale: עשה + הרע అనే నైతిక మూల్యాంకనాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది; వాక్యంలోని కథన ఫలిత భావం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: כִּי
  choice: కాబట్టి అనే కారణ సంబంధ నిర్మాణం
  rationale: ఇక్కడ כִּי అతడు చెడు చేయడానికి కారణాన్ని తెలియజేస్తుంది. తెలుగులో కారణ వాక్యాన్ని ముందుంచి ‘కాబట్టి’తో ప్రధాన వాక్యాన్ని కలపడం సహజంగా ఉంటుంది.
- source_word: לֹא הֵכִין לִבּוֹ
  choice: తన హృదయాన్ని సిద్ధపరచుకోలేదు
  rationale: הכין యొక్క ‘సిద్ధం చేయడం/స్థిరపరచడం’ భావాన్నీ, לב యొక్క అంతరంగ సంకల్ప భావాన్నీ కాపాడుతుంది. ప్రతిబింబాత్మక తెలుగు రూపం వ్యక్తిగత ఉద్దేశపూర్వక నిర్ణయాన్ని వ్యక్తం చేస్తుంది.
- source_word: לִדְרוֹשׁ
  choice: వెదకడానికి
  rationale: דרשׁ దేవుని కర్మగా తీసుకున్నప్పుడు ఆయనను ఆశ్రయించడం, ఆయన చిత్తాన్ని తెలుసుకోవాలని కోరడం అనే విస్తృత భావం ఉంటుంది. ‘వెదకడం’ ఆ ఉద్దేశపూర్వకతను అనవసర వివరణ లేకుండా నిలుపుతుంది.
- source_word: אֶת־יְהוָה
  choice: యెహోవాను
  rationale: మూలంలోని దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో ప్రత్యక్షంగా అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: హీబ్రూ పాఠంలో ఒడంబడిక నామం ప్రత్యక్షంగా ఉంది. దానిని సాధారణ బిరుదుగా మార్చకుండా, తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన లిప్యంతరీకరణను ఉపయోగించాం.
- issue: ‘యెహోవాను వెదకడం’ అనే భావం
  choice: వెదకడానికి
  alternative: విచారించడానికి; ఆశ్రయించడానికి
  rationale: דרשׁలో భక్తితో దేవుని వైపు తిరగడం, ఆయనను సంప్రదించడం వంటి భావాలు ఉండవచ్చు. వాటిలో ఒక్కదానికే అర్థాన్ని పరిమితం చేయకుండా మూలంలోని విస్తృతతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కారణ–ఫలిత క్రమాన్ని ఉపయోగించాం. ‘హృదయం’ అనే రూపాన్ని నిలుపుతూ హీబ్రూ అంతరంగ సంకల్ప భావాన్ని కాపాడాం; భాష గంభీరంగా ఉన్నప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా ఉంచాం.
