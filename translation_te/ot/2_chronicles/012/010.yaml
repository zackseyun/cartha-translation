  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ הַ/מֶּ֤לֶךְ רְחַבְעָם֙ תַּחְתֵּי/הֶ֔ם מָגִנֵּ֖י נְחֹ֑שֶׁת וְ/הִפְקִ֗יד עַל יַד֙ שָׂרֵ֣י הָ/רָצִ֔ים הַ/שֹּׁ֣מְרִ֔ים פֶּ֖תַח בֵּ֥ית הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/010.yaml
  text: So King Rehoboam made bronze shields in their place and committed them to the care of the commanders of the guards[b][a], who kept watch at the entrance of the king’s house.
translation:
  language: te
  text: అప్పుడు రాజైన రెహబాము వాటికి బదులుగా కంచు డాళ్లను చేశాడు,[a] రాజభవన ద్వారం వద్ద కాపలా కాసే రాజకాపలాదళాధిపతుల బాధ్యతకు వాటిని అప్పగించాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, షీషకు తీసుకుపోయిన బంగారు డాళ్ల స్థానంలో కంచు డాళ్లు (ముందటి వచనం చూడండి).
    reason: cross_reference
  - marker: b
    text: హీబ్రూలో అక్షరార్థం ‘పరుగెత్తేవారు’; బహుశా రాజభవన అంగరక్షకులుగా కూడా పనిచేసిన రాజ సేవకులు లేదా సందేశవాహకులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేయించాడు
  rationale: రాజు స్వయంగా తయారుచేశాడనే అర్థం కాకుండా, రాజాజ్ఞతో వాటిని తయారుచేయించిన భావాన్ని సహజమైన తెలుగు ప్రయోగంలో తెలియజేస్తుంది.
- source_word: תַּחְתֵּיהֶם
  choice: వాటికి బదులుగా
  rationale: మునుపటి వచనంలో తీసుకుపోయిన బంగారు డాళ్ల స్థానంలో ఇవి చేయించబడిన ప్రత్యామ్నాయ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מָגִנֵּי נְחֹשֶׁת
  choice: కంచు డాళ్లు
  rationale: ఆయుధ సామగ్రి సందర్భంలో נְחֹשֶׁתకు కంచు అనే అర్థం తగినది; מָגֵןను డాలు అని సహజంగా అనువదించవచ్చు.
- source_word: וְהִפְקִיד עַל יַד
  choice: సంరక్షణకు ... అప్పగించాడు
  rationale: వారి చేతికి లేదా బాధ్యతలో ఉంచడం అనే హిఫిల్ క్రియ మరియు జాతీయ ప్రయోగంలోని సంరక్షణ భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: שָׂרֵי
  choice: అధిపతులు
  rationale: రాజభవన భద్రతా దళానికి నాయకత్వం వహించే అధికారులను సూచించే గౌరవప్రదమైన, విస్తృత పదం.
- source_word: הָרָצִים
  choice: అంగరక్షకులు
  rationale: అక్షరార్థం ‘పరుగెత్తేవారు’; రాజసంబంధ సందర్భంలో సందేశవాహకులుగానూ రాజ అంగరక్షకులుగానూ పనిచేసిన వర్గాన్ని ఇక్కడ వారి కాపలా విధిని బట్టి సూచిస్తుంది.
- source_word: הַשֹּׁמְרִים
  choice: కాపాడే
  rationale: వారు నిరంతరం నిర్వర్తించే కాపలా బాధ్యతను వర్తమాన కృదంతానికి తగిన విధంగా తెలుపుతుంది.
- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  choice: రాజభవన ద్వారం
  rationale: ‘రాజు ఇల్లు’ ఇక్కడ రాజ నివాసమైన భవనాన్ని సూచిస్తుంది; సంక్షిప్తమైన ఈ తెలుగు రూపం మూలార్థాన్ని సహజంగా అందిస్తుంది.
