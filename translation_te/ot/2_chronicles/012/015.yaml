id: 2CH.12.15
reference: 2 Chronicles 12:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/דִבְרֵ֣י רְחַבְעָ֗ם הָ/רִאשֹׁנִים֙ וְ/הָ/אֲ֣חַרוֹנִ֔ים הֲ/לֹא הֵ֨ם כְּתוּבִ֜ים בְּ/דִבְרֵ֨י שְׁמַֽעְיָ֧ה הַ/נָּבִ֛יא וְ/עִדּ֥וֹ הַ/חֹזֶ֖ה לְ/הִתְיַחֵ֑שׂ וּ/מִלְחֲמ֧וֹת רְחַבְעָ֛ם וְ/יָרָבְעָ֖ם כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/015.yaml
  text: The acts of Rehoboam[a], the first and the last, are they not written in the records of Shemaiah the prophet and of Iddo the seer, according to genealogical enrollment? And there were wars between Rehoboam and Jeroboam all their days.
translation:
  language: te
  text: రెహబాము చేసిన కార్యాలు—మొదటివి, చివరివి—ప్రవక్తయైన షెమయా వృత్తాంతాల్లో, దర్శియైన ఇద్దో వృత్తాంతాల్లో, వంశావళి నమోదు ప్రకారం[a] రాయబడి ఉన్నాయి కదా? రెహబాముకూ యెరోబాముకూ మధ్య వారి కాలమంతా యుద్ధాలు జరిగాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వంశావళి వృత్తాంతాల్లో,’ లేదా ‘వంశావళి నమోదు కోసం.’ ఈ హీబ్రూ పదబంధం అర్థం స్పష్టంగా లేదు; ఇది ఇద్దోకు సంబంధించిన ఆధార గ్రంథం ఏ రూపంలో ఉందో లేదా ఏ ఉద్దేశంతో రాయబడిందో సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבְרֵי רְחַבְעָם
  choice: రెహబాము చేసిన కార్యాలు
  rationale: రాజు పాలనను సంక్షిప్తంగా తెలిపే ఈ సూత్రప్రయోగంలో דִבְרֵי అనేది మాటలను మాత్రమే కాక అతని కార్యాలు, పాలనలోని సంఘటనలను సూచిస్తుంది.
- source_word: הָרִאשֹׁנִים וְהָאֲחַרוֹנִים
  choice: మొదటివి, చివరివి
  rationale: హీబ్రూ సమాంతర నిర్మాణాన్ని నిలుపుతూ, అతని పాలన ఆద్యంతాన్ని సూచించే సాంప్రదాయ సూత్రాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: రాయబడి ఉన్నాయి కదా?
  rationale: మూలంలోని అలంకారప్రశ్నను, లిఖిత ఆధారాన్ని సూచించే భావాన్ని రెండింటినీ కాపాడుతుంది.
- source_word: בְּדִבְרֵי
  choice: వృత్తాంతాల్లో
  rationale: ఇక్కడ דִבְרֵי లిఖిత చారిత్రక ఆధారాలను సూచిస్తుంది; ‘మాటల్లో’ కంటే ‘వృత్తాంతాల్లో’ సందర్భానికి తగినది.
- source_word: הַנָּבִיא / הַחֹזֶה
  choice: ప్రవక్త / దర్శి
  rationale: రెండు వేర్వేరు హీబ్రూ బిరుదుల మధ్య ఉన్న పదభేదాన్ని తెలుగులోనూ నిలుపుతుంది.
- source_word: לְהִתְיַחֵשׂ
  choice: వంశావళి నమోదు ప్రకారం
  rationale: יחס ధాతువు వంశావళి ప్రకారం నమోదు చేయడం లేదా లెక్కించడం అనే భావాన్ని ఇస్తుంది; కష్టమైన వాక్యసంబంధాన్ని అతిగా నిర్ధారించకుండా ప్రధాన సాధ్యార్థాన్ని అందిస్తుంది.
- source_word: וּמִלְחֲמוֹת
  choice: యుద్ధాలు జరిగాయి
  rationale: మూలంలో నామపదబంధంగా ఉన్న మాటకు సందర్భంలో అంతర్లీనంగా ఉన్న విధేయార్థాన్ని సహజమైన తెలుగు వాక్యంగా వ్యక్తం చేస్తుంది.
- source_word: כָּל הַיָּמִים
  choice: వారి కాలమంతా
  rationale: ఇద్దరు రాజుల జీవితకాలం లేదా పాలనాకాలం అంతటినీ సూచించగల హీబ్రూ కాలవ్యాప్తిని అనవసరంగా ఒకే అర్థానికి పరిమితం చేయదు.
