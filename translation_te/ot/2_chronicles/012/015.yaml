translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన చారిత్రక శైలిని ఉపయోగించాం. మూలంలోని అలంకారప్రశ్నను నిలిపి, ‘ప్రవక్త’ మరియు ‘దర్శి’ అనే బిరుదుల భేదాన్ని కాపాడాం. లְהִתְיַחֵשׂ యొక్క అనిశ్చిత సంబంధాన్ని పాదటిప్పణిలో ప్రత్యామ్నాయాలతో స్పష్టంచేశాం.
