id: 2CH.12.7
reference: 2 Chronicles 12:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בִ/רְא֤וֹת יְהוָה֙ כִּ֣י נִכְנָ֔עוּ הָיָה֩ דְבַר יְהוָ֨ה אֶל שְׁמַֽעְיָ֧ה לֵ/אמֹ֛ר נִכְנְע֖וּ לֹ֣א אַשְׁחִיתֵ֑/ם וְ/נָתַתִּ֨י לָ/הֶ֤ם כִּ/מְעַט֙ לִ/פְלֵיטָ֔ה וְ/לֹא תִתַּ֧ךְ חֲמָתִ֛/י בִּ/ירוּשָׁלִַ֖ם בְּ/יַד שִׁישָֽׁק־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/007.yaml
  text: When Yahweh saw that they had humbled themselves[a], the word of Yahweh came to Shemaiah, saying, “They have humbled themselves; I will not destroy them, but I will grant them some deliverance, and my wrath will not be poured out on Jerusalem by the hand of Shishak.”
translation:
  language: te
  text: 'వారు తమను తాము వినమ్రపరచుకున్నారని యెహోవా చూసినప్పుడు, యెహోవా వాక్కు షెమయాకు ఇలా వచ్చింది: “వారు తమను తాము వినమ్రపరచుకున్నారు. నేను వారిని నాశనం చేయను; వారికి కొద్దిపాటి రక్షణను ఇస్తాను[a]. షీషకు చేత యెరూషలేము మీద నా ఉగ్రత కుమ్మరించబడదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారికి కొద్దిపాటి తప్పించుకునే అవకాశాన్ని ఇస్తాను”; లేదా, “వారిలో కొందరు మిగిలేలా చేస్తాను.” హెబ్రీ పదబంధం సంక్షిప్తంగా ఉంది; సంపూర్ణ నాశనానికి బదులు పరిమితమైన రక్షణను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִרְאוֹת
  choice: చూసినప్పుడు
  rationale: ב + infinitive construct ఇక్కడ కాలసూచక ఉపవాక్యాన్ని ప్రవేశపెడుతుంది; ఆధునిక తెలుగులో సహజంగా సంఘటనల క్రమాన్ని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో వ్యక్తిగత నామంగా ఉంచింది.
- source_word: נִכְנָעוּ
  choice: తమను తాము తగ్గించుకున్నారు
  rationale: כנע యొక్క నిఫాల్ రూపం ఈ సందర్భంలో ప్రవచన గద్దింపుకు ప్రతిస్పందనగా స్వయంగా వినమ్రత చూపడం లేదా లోబడడాన్ని సూచిస్తుంది.
- source_word: הָיָה דְבַר יְהוָה אֶל
  choice: యెహోవా వాక్కు ... వచ్చింది
  rationale: ప్రామాణిక ప్రవచన సూత్రప్రయోగాన్ని తెలుగులో సహజంగా, దాని రూపక స్వభావాన్ని నిలుపుతూ అందిస్తుంది.
- source_word: לֹא אַשְׁחִיתֵם
  choice: నేను వారిని నాశనం చేయను
  rationale: שׁחת హిఫీల్ తీర్పు సందర్భంలో ‘నాశనం చేయు’ అనే స్పష్టమైన అర్థాన్ని ఇస్తుంది.
- source_word: וְנָתַתִּי לָהֶם כִּמְעַט לִפְלֵיטָה
  choice: వారికి కొంత ఉపశమనం కలిగిస్తాను
  rationale: సంక్షిప్తమైన హెబ్రీ పదబంధం పరిమితమైన రక్షణ, తప్పించుకోవడం లేదా మిగిలినవారిని సూచించగలదు; ‘కొంత ఉపశమనం’ సంపూర్ణ విమోచనగా అతిశయింపకుండా తీర్పు తగ్గింపును సహజంగా తెలియజేస్తుంది.
- source_word: תִתַּךְ חֲמָתִי
  choice: నా ఉగ్రత కుమ్మరించబడదు
  rationale: נתך + חמה రూపకం ఉగ్రతను ద్రవంలా కుమ్మరించడాన్ని సూచిస్తుంది; కర్మణి రూపం మూలంలోని భావాన్ని నిలుపుతుంది.
- source_word: בְּיַד שִׁישָׁק
  choice: షీషకు చేత
  rationale: ביד అనే సాధనకర్తను సూచించే హెబ్రీ ప్రయోగాన్ని తెలుగులో అర్థమయ్యే విధంగా ‘చేత’తో అందిస్తుంది.
- source_word: שִׁישָׁק
  choice: షీషకు
  rationale: హెబ్రీ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుకరణ ప్రకారం లిప్యంతరీకరించింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుగా మార్చలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకుంది; ‘యాహ్వే’ మరొక సముచిత లిప్యంతరీకరణ.
- issue: כמעט לפליטה సూచించే రక్షణ పరిమాణం
  choice: కొంత ఉపశమనం
  alternative: కొద్దిగా తప్పించుకునే అవకాశం / కొందరిని మిగిలిస్తాను
  rationale: పదబంధం పరిమిత రక్షణనా, తప్పించుకోవడమా, లేక కొందరు మిగలడమా అన్న విషయంలో సంక్షిప్తంగా ఉంది. ప్రధాన పాఠం ఒక అర్థాన్ని అతిగా ఖరారు చేయకుండా తీర్పు తగ్గింపును తెలియజేస్తుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రవచన శైలిని ఉపయోగించింది. ‘వాక్కు వచ్చింది,’ ‘ఉగ్రత కుమ్మరించబడదు’ వంటి మూల రూపకాలను అవి తెలుగులో అర్థవంతంగా ఉన్న చోట నిలుపుకుంది; అసలులోని పరిమిత రక్షణకు సంబంధించిన సందిగ్ధతను పాదసూచికలో భద్రపరిచింది.
