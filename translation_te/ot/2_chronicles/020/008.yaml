  text: And they lived in it and built for you in it a sanctuary for your name[a], saying[b],
translation:
  language: te
  text: 'వారు దానిలో నివసించి[a], అందులో నీ నామం కోసం ఒక పరిశుద్ధస్థలాన్ని[b] కట్టి, ఇలా అన్నారు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అక్కడ కాపురముండి,’ లేదా ‘అక్కడ స్థిరపడి.’
    reason: lexical_alternative
  - marker: b
    text: ‘నీ నామం కోసం ఒక పరిశుద్ధస్థలం’ అంటే యెహోవా నామానికి అంకితం చేసిన పవిత్ర స్థలం—అంటే ఆయన వెల్లడైన సన్నిధి, ఘనతతో సంబంధమున్న స్థలం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: నివసించి
  rationale: ישׁב ఇక్కడ ఆ దేశంలో స్థిరంగా ఉండడాన్ని సూచిస్తుంది. ‘నివసించి’ అనేది ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, నివాస భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בָהּ
  choice: దానిలో / అందులో
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం ముందున్న దేశాన్ని సూచిస్తుంది. తెలుగులో దానిని ‘దానిలో’ అని, పునరుక్తిలో సహజత్వం కోసం ‘అందులో’ అని అనువదించాం.
- source_word: וַיִּבְנוּ
  choice: కట్టి
  rationale: בנה అనే క్రియకు సందర్భానుసారమైన సాధారణ తెలుగు రూపం ‘కట్టు’.
- source_word: לְךָ
  choice: నీ ... కోసం
  rationale: ఇక్కడ לְ అర్పణ లేదా ప్రయోజన భావాన్ని తెలియజేస్తుంది. పరిశుద్ధస్థలం దేవునికి అంకితమైనదని తెలుగు వాక్య నిర్మాణంలో ‘నీ నామం కోసం’ సహజంగా తెలియజేస్తుంది.
- source_word: מִקְדָּשׁ
  choice: ఒక పరిశుద్ధస్థలాన్ని
  rationale: מִקְדָּשׁ అనేది పవిత్రంగా ప్రత్యేకించబడిన స్థలాన్ని సూచిస్తుంది. ‘పరిశుద్ధస్థలం’ మూలపద భావాన్ని నిలుపుతుంది; దానిని వెంటనే ‘దేవాలయం’ అనే మరింత నిర్దిష్ట పదానికి పరిమితం చేయదు.
- source_word: לְשִׁמְךָ
  choice: నీ నామం కోసం
  rationale: ఇది దేవుని నామానికి అంకితమైన స్థలాన్ని సూచించే బైబిలీయ ప్రయోగం. ‘నీ నామంలో’ అంటే అధికారంతో చేసిన కార్యం అనే వేరే భావం కలగవచ్చు కాబట్టి దాన్ని నివారించాం.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నారు:'
  rationale: తరువాతి వచనంలో వచ్చే మాటలను పరిచయం చేస్తుంది. తెలుగులో ఉద్ధరణకు ముందుగా ‘ఇలా అన్నారు:’ అనడం సహజంగా, స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: ‘నీ నామం కోసం ఒక పరిశుద్ధస్థలం’ అనే మాట యొక్క భావం
  choice: దేవుని నామానికి—అంటే ఆయన వెల్లడైన సన్నిధి, ఘనతకు—అంకితమైన పరిశుద్ధస్థలం
  alternative: నీ ఘనత కోసం ఒక దేవాలయం; నీ నామాన్ని ధరించిన పవిత్ర స్థలం
  rationale: ఈ అనువాదం పరిశుద్ధస్థలంతో దేవుని నామానికి ఉన్న బైబిలీయ సంబంధాన్ని నిలుపుతుంది; అదే సమయంలో దేవుడు ఆ స్థలంలోనే పరిమితుడై ఉన్నాడని సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడాం. మూలంలోని వరుస క్రియలను ‘నివసించి ... కట్టి ... అన్నారు’గా అనుసంధానించాం. తదుపరి వచనంలోని మాటలను పరిచయం చేయడానికి చివర ద్విబిందువు ఉంచాం.
