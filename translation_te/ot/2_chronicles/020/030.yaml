  text: וַ/תִּשְׁקֹ֖ט מַלְכ֣וּת יְהוֹשָׁפָ֑ט וַ/יָּ֧נַֽח ל֦/וֹ אֱלֹהָ֖י/ו מִ/סָּבִֽיב׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/030.yaml
  text: So the kingdom of Jehoshaphat was at peace[a], and his God gave him rest all around.
translation:
  language: te
  text: ఈ విధంగా యెహోషాపాతు రాజ్యం ప్రశాంతంగా ఉంది[a], మరియు అతని దేవుడు అతనికి చుట్టుపక్కల నుండి విశ్రాంతి కలిగించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోషాపాతు రాజ్యం కలత లేకుండా ఉంది, మరియు అతని దేవుడు అతనికి చుట్టుపక్కల నుండి విశ్రాంతి కలిగించాడు.”
    reason: שׁקט అనే క్రియకు ‘ప్రశాంతంగా ఉండడం,’ ‘నిశ్శబ్దంగా ఉండడం,’ లేదా ‘కలత లేకుండా ఉండడం’ అనే సమీపార్థాలు ఉన్నాయి.
lexical_decisions:
- source_word: וַתִּשְׁקֹט
  choice: శాంతిగా ఉంది
  rationale: שׁקט అంటే కలత లేకుండా, నిశ్శబ్దంగా లేదా ప్రశాంతంగా ఉండడం. ‘రాజ్యం’ కర్తగా ఉన్నందున ఆధునిక తెలుగులో ‘శాంతిగా ఉంది’ సహజంగా ఉండి, యుద్ధం లేదా కల్లోలం లేని స్థితిని తెలియజేస్తుంది.
- source_word: מַלְכוּת
  choice: రాజ్యం
  rationale: ఇక్కడ ఈ పదం యెహోషాపాతు పరిపాలించిన రాజ్యాన్ని సూచిస్తుంది; ‘రాజ్యం’ సాధారణమైన, చారిత్రక సందర్భానికి తగిన తెలుగు పదం.
- source_word: יְהוֹשָׁפָט
  choice: యెహోషాపాతు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో స్థిరపడిన బైబిలు రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וַיָּנַח
  choice: విశ్రాంతి ఇచ్చాడు
  rationale: 'נוח యొక్క హిఫీల్ రూపం కారణార్థకమైనది: దేవుడు అతనికి విశ్రాంతి కలిగించాడు. ‘విశ్రాంతి ఇచ్చాడు’ ఈ భావాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.'
- source_word: אֱלֹהָיו
  choice: అతని దేవుడు
  rationale: ప్రత్యయం యెహోషాపాతును సూచిస్తూ ‘అతని దేవుడు’ అనే అర్థాన్ని ఇస్తుంది.
- source_word: מִסָּבִיב
  choice: అన్ని వైపులా
  rationale: చుట్టూ ఉన్న ప్రతి దిశనుంచి కలిగిన భద్రత లేదా శత్రుబాధల నుంచి లభించిన విశ్రాంతిని ఈ పదబంధం సూచిస్తుంది. ‘అన్ని వైపులా’ దాని స్థలసంబంధ సంపూర్ణతను సహజంగా తెలియజేస్తుంది.
- source_word: וַ
  choice: ;
  rationale: రెండు హీబ్రూ వాక్యభాగాల సమన్వయాన్ని కారణార్థకమైన ‘ఎందుకంటే’గా మార్చకుండా, తెలుగులో సహజమైన అర్ధవిరామంతో అనుసంధానించాం.
theological_decisions:
- issue: రాజ్య శాంతిలో దేవుని కార్యసాధకత్వం
  choice: రాజ్యం శాంతిగా ఉందని చెప్పి, దేవుడు యెహోషాపాతుకు అన్ని వైపులా విశ్రాంతి ఇచ్చాడని సమన్వయ వాక్యంగా అనువదించాం.
  alternative: ‘ఎందుకంటే అతని దేవుడు...’ అని రెండవ భాగాన్ని మొదటి భాగానికి స్పష్టమైన కారణంగా చూపడం.
  rationale: హీబ్రూలో రెండు భాగాలు וַ ద్వారా అనుసంధానించబడ్డాయి. సందర్భంలో దేవుని కార్యమే శాంతికి ఆధారమని స్పష్టమైనప్పటికీ, మూలంలో ప్రత్యక్షంగా లేని కారణార్థక సంధిని చేర్చకుండా సమన్వయాన్ని కాపాడటం మూలానికి మరింత సమీపం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘శాంతిగా ఉంది’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది; ‘అన్ని వైపులా విశ్రాంతి ఇచ్చాడు’ మూలంలోని దైవ కార్యసాధకత్వాన్ని, చుట్టూ ఉన్న భద్రతను నిలుపుతుంది.
