source:
  edition: WLC
  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י יְהוֹשָׁפָ֔ט הָ/רִאשֹׁנִ֖ים וְ/הָ/אַחֲרֹנִ֑ים הִנָּ֣/ם כְּתוּבִ֗ים בְּ/דִבְרֵי֙ יֵה֣וּא בֶן חֲנָ֔נִי אֲשֶׁ֣ר הֹֽעֲלָ֔ה עַל סֵ֖פֶר מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/034.yaml
  text: The rest of the acts of Jehoshaphat[a], the first and the last, behold, they are written in the records of Jehu son of Hanani[b], which are included in the Book of the Kings of Israel.
translation:
  language: te
  text: యెహోషాపాతు చేసిన మిగిలిన కార్యాలు—మొదటివి, చివరివి—హనానీ కుమారుడైన యెహూ వృత్తాంతంలో[a] రాయబడి ఉన్నాయి. ఆ వృత్తాంతం ఇశ్రాయేలు రాజుల గ్రంథంలో చేర్చబడింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హనానీ కుమారుడైన యెహూ రచనల్లో.” హీబ్రూలో అక్షరార్థంగా “యెహూ మాటలు/విషయాల్లో” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ హీబ్రూ వాక్యభాగం అక్షరార్థంగా “దానిని ఇశ్రాయేలు రాజుల గ్రంథం మీదికి అతడు ఎక్కించాడు” అని ఉంటుంది. ఇది యెహూ వృత్తాంతం ఆ పెద్ద రాజగ్రంథంలో పొందుపరచబడిందని బహుశా సూచిస్తుంది; అయితే క్రియ కర్త, సంబంధం పూర్తిగా స్పష్టంగా లేవు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹשָׁפָט
  choice: యెహోషాపాతు చేసిన మిగిలిన కార్యాలు
  rationale: రాజుల పాలనల సారాంశాల్లో דִּבְרֵי అనేది మాటలను మాత్రమే కాక కార్యాలు, పాలనాసంబంధ విషయాలను సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు ‘చేసిన కార్యాలు’ అని అనువదించాం; וְ యొక్క అనుసంధాన భావం సందర్భంలోనే వ్యక్తమవుతుంది.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרֹנִים
  choice: మొదటివి, చివరివి
  rationale: ఇది యెహోషాపాతు కార్యాల మొత్తం కాలవ్యాప్తిని సూచించే సూత్రబద్ధమైన జంట. మూలంలోని రూపాన్ని నిలుపుతూ సహజమైన తెలుగు వాడాం.
- source_word: הִנָּם כְּתוּבִים
  choice: రాయబడి ఉన్నాయి
  rationale: כְּתוּבִים అనే నిష్క్రియ భావాన్ని నేరుగా నిలిపాం. הִנָּם లోని చూపించే/ఉద్ఘాటించే భావాన్ని తెలుగులో అసహజమైన ‘ఇదిగో’తో బలవంతంగా చూపకుండా వాక్య నిర్మాణంలో మృదువుగా ఉంచాం.
- source_word: בְּדִבְרֵי יֵהוּא בֶן חֲנָנִי
  choice: హనానీ కుమారుడైన యెహూ వృత్తాంతంలో
  rationale: ఇక్కడ דִּבְרֵי ఒక లిఖిత ఆధారాన్ని సూచిస్తుంది. ‘వృత్తాంతం’ అనేది ‘మాటలు’ కంటే సందర్భానికి తగినది; ‘రాజవార్షిక గ్రంథం’ వంటి మరీ నిర్దిష్ట సాహిత్య ప్రక్రియను రుద్దదు.
- source_word: אֲשֶׁר הֹעֲלָה עַל סֵפֶר מַלְכֵי יִשְׂרָאֵל
  choice: ఆ వృత్తాంతం ఇశ్రాయేలు రాజుల గ్రంథంలో చేర్చబడింది
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఇశ్రాయేలు రాజుల గ్రంథం మీదికి ఎక్కించాడు’ అనే కఠినమైన నిర్మాణం కలిగి ఉంది. సందర్భంలో యెహూ వృత్తాంతం ఆ విస్తృత రాజగ్రంథంలో పొందుపరచబడిందనే సంబంధాన్ని సహజ తెలుగులో తెలిపాం; మూలంలోని వ్యాకరణ అస్పష్టతను పాదసూచికలో నమోదు చేశాం.
- source_word: סֵפֶר מַלְכֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజుల గ్రంథం
  rationale: సֵפֶר అంటే గ్రంథం లేదా లిఖిత పత్రం. మూలంలోని శీర్షికవంటి ఆధారగ్రంథ సూచనను సరళంగా నిలిపాం.
theological_decisions:
- issue: యెహూ వృత్తాంతానికి ఇశ్రాయేలు రాజుల గ్రంథంతో ఉన్న సంబంధం
  choice: చేర్చబడింది
  alternative: యెహూ దానిని ఇశ్రాయేలు రాజుల గ్రంథంలో నమోదు చేశాడు / దాని మీదికి ఎక్కించాడు
  rationale: ఈ అంశం సిద్ధాంతపరమైన నిర్ణయం కంటే పాఠ్య-వ్యాకరణ సమస్య. ప్రధాన వాక్యంలో సందర్భానుకూల భావాన్ని ఇచ్చి, కర్త మరియు క్రియ ప్రయోగంలోని నిజమైన అస్పష్టతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన చారిత్రక శైలి వాడబడింది. ‘ఇదిగో’ అనే అక్షరానువాదం ఈ సందర్భంలో కృత్రిమంగా వినిపించేందున విడిచిపెట్టాం. పొడవైన హీబ్రూ వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి పఠనసౌలభ్యం పెంచాం; భావసంబంధాన్ని ‘ఆ వృత్తాంతం’తో స్పష్టపరిచాం.
