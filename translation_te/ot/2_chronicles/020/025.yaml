  to: అప్పుడు యెహోషాపాతు, అతని ప్రజలు శత్రువుల దోపుడు సొమ్మును కొల్లగొట్టడానికి వచ్చారు. శత్రువుల మధ్య సమృద్ధిగా ఆస్తిపాస్తులు, శవాలు[a], విలువైన వస్తువులు వారికి కనిపించాయి. వారు మోయలేనన్ని వాటిని తమకోసం స్వాధీనం చేసుకున్నారు. దోపుడు సొమ్ము ఎంతో ఎక్కువగా ఉండడంతో, వారు దాన్ని కొల్లగొట్టడంలో మూడు రోజులపాటు ఉన్నారు.
