source:
  edition: WLC
  text: וַ/יָּבֹ֨א יְהוֹשָׁפָ֣ט וְ/עַמּ/וֹ֮ לָ/בֹ֣ז אֶת שְׁלָלָ/ם֒ וַ/יִּמְצְאוּ֩ בָ/הֶ֨ם לָ/רֹ֜ב וּ/רְכ֤וּשׁ וּ/פְגָרִים֙ וּ/כְלֵ֣י חֲמֻד֔וֹת וַ/יְנַצְּל֥וּ לָ/הֶ֖ם לְ/אֵ֣ין מַשָּׂ֑א וַ/יִּֽהְי֞וּ יָמִ֧ים שְׁלוֹשָׁ֛ה בֹּזְזִ֥ים אֶת הַ/שָּׁלָ֖ל כִּ֥י רַב הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/025.yaml
  text: Then Jehoshaphat and his people came to plunder their spoil[a], and they found among them in abundance goods, garments, and desirable articles; and they took for themselves more than they could carry. They were three days plundering the spoil, because it was so much.
translation:
  language: te
  text: అప్పుడు యెహోషాపాతు, అతని ప్రజలు శత్రువుల దోపుడు సొమ్మును కొల్లగొట్టడానికి వచ్చారు. శత్రువుల మధ్య సమృద్ధిగా ఆస్తిపాస్తులు, శవాలు[a], విలువైన వస్తువులు వారికి కనిపించాయి. వారు మోయలేనన్ని వాటిని తమకోసం స్వాధీనం చేసుకున్నారు. దోపుడు సొమ్ము ఎంతో ఎక్కువగా ఉండడంతో, వారు దాన్ని కొల్లగొట్టడంలో మూడు రోజులపాటు ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మసొరెటిక్ పాఠంలో ‘శవాలు’ అని ఉంది; ఇది పడిపోయిన శత్రువుల శరీరాలను సూచించే అవకాశం ఉంది. కొన్ని ప్రాచీన సాక్ష్యాలు, అనువాదాలు ‘వస్త్రాలు’ వంటి పాఠాన్ని ప్రతిబింబిస్తాయి లేదా జాబితా భావాన్ని సులభం చేయడానికి ఈ పదాన్ని విడిచిపెడతాయి.
    reason: textual_variant
lexical_decisions:
- source_word: לָבֹז אֶת שְׁלָלָם
  choice: వారి దోపుడు సొమ్మును కొల్లగొట్టడానికి
  rationale: యుద్ధంలో ఓడినవారి సొత్తును స్వాధీనం చేసుకునే భావాన్ని, వచ్చుట యొక్క ఉద్దేశాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בָהֶם
  choice: వారి మధ్య
  rationale: పడిపోయిన శత్రువుల మధ్య లేదా వారి వద్ద వస్తువులు కనిపించాయనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: לָרֹב וּרְכוּשׁ
  choice: విస్తారమైన ఆస్తి
  rationale: רְכוּשׁ అనే చరాస్తి/సంపద భావాన్నీ, לָרֹב సూచించే అధిక పరిమాణాన్నీ సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: פְגָרִים
  choice: శవాలు
  rationale: మసొరెటిక్ పాఠంలోని సాధారణ, ప్రత్యక్ష అర్థాన్ని యుద్ధ సందర్భానికి తగిన విధంగా నిలుపుతుంది.
- source_word: כְלֵי חֲמֻדוֹת
  choice: విలువైన వస్తువులు
  rationale: పాత్రలు అనే పరిమిత భావానికి కట్టిపడేయకుండా, కోరదగిన లేదా అమూల్యమైన సామగ్రి అనే విస్తృత అర్థాన్ని సహజంగా అందిస్తుంది.
- source_word: וַיְנַצְּלוּ לָהֶם
  choice: వాటిని తమ కోసం తీసుకున్నారు
  rationale: నצל పియేల్‌లోని లూటీగా తీసుకోవడం/ఒలిచివేయడం అనే భావాన్ని సందర్భానుసారంగా సహజ తెలుగులో ఇస్తూ, לָהֶם లోని స్వప్రయోజన భావాన్ని కాపాడుతుంది.
- source_word: לְאֵין מַשָּׂא
  choice: మోయలేనంతగా
  rationale: అక్షరార్థమైన ‘మోయుట లేకపోవుట వరకు’ అనే హీబ్రూ నుడికారాన్ని స్పష్టమైన తెలుగు పరిమాణ వ్యక్తీకరణగా అందిస్తుంది.
- source_word: וַיִּהְיוּ יָמִים שְׁלוֹשָׁה בֹּזְזִים
  choice: దాన్ని కొల్లగొట్టడానికి వారికి మూడు రోజులు పట్టింది
  rationale: మూడు రోజులపాటు కొనసాగిన చర్యను సహజమైన ఆధునిక తెలుగు వాక్య నిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: כִּי רַב הוּא
  choice: దోపుడు సొమ్ము ఎంతో ఎక్కువగా ఉండడంతో
  rationale: మూడు రోజులు పట్టడానికి కారణం దోపుడు సొమ్ము పరిమాణమేనని స్పష్టంగా తెలియజేస్తుంది.
