    rationale: లָרֹב అనేది విస్తార పరిమాణాన్ని, రְכוּשׁ చరాస్తి/సొత్తును సూచిస్తాయి. ‘సమృద్ధిగా ఆస్తిపాస్తులు’ ఈ రెండింటినీ సహజ తెలుగులో వ్యక్తపరుస్తుంది.
  - severity: low
