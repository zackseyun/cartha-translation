  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయితే యుద్ధ దోపిడీ సందర్భానికి తగిన గంభీరతతో రూపొందించబడింది. పాఠభేదాన్ని ప్రధాన పాఠంలో పరిష్కరించకుండా మసొరెటిక్ పాఠమైన ‘శవాలు’ను ఉంచి, ప్రత్యామ్నాయ సాక్ష్యాన్ని పాదసూచికలో తెలిపింది.
