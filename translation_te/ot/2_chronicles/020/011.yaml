  text: וְ/הִ֨נֵּה הֵ֔ם גֹּמְלִ֖ים עָלֵ֑י/נוּ לָ/בוֹא֙ לְ/גָ֣רְשֵׁ֔/נוּ מִ/יְּרֻשָּׁתְ/ךָ֖ אֲשֶׁ֥ר הֽוֹרַשְׁתָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/011.yaml
  text: And behold[a], they are repaying us by coming to drive us out of your possession, which you gave us as an inheritance.
translation:
  language: te
  text: ఇదిగో, నీవు మాకు స్వాస్థ్యంగా ఇచ్చిన నీ ఆస్తిలోనుండి మమ్మల్ని వెళ్లగొట్టడానికి వచ్చి, వారు మాకు ప్రతిఫలం చెల్లిస్తున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు మాకు స్వాధీనపరచిన నీ స్వాస్థ్యంలోనుండి.”
    reason: ‘స్వాస్థ్యం/ఆస్తి’ అని అర్థమిచ్చే పదం మరియు ‘స్వాధీనపరచావు/వారసత్వంగా పొందేలా చేశావు’ అనే క్రియ మధ్యనున్న హీబ్రూ పదసంబంధాన్ని మరింత రూపసామ్యంతో చూపించే ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: ప్రస్తుత అన్యాయ పరిస్థితివైపు దేవుని దృష్టిని బలంగా మళ్లించే విజ్ఞాపనను సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הֵם
  choice: వారు
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను నిలుపుతూ, అపకారం చేస్తున్నవారినే ప్రత్యేకంగా ముందుకు తెస్తుంది.
- source_word: גֹּמְלִים עָלֵינוּ
  choice: వారు మాకు చేస్తున్న ప్రతిఫలం ఇదే
  rationale: గతంలో ఇశ్రాయేలు వారిని విడిచిపెట్టినందుకు ఇప్పుడు వారు చేస్తున్నది వ్యంగ్యమైన ప్రతిచర్య లేదా ప్రతిఫలమని సూచిస్తుంది; తెలుగులో సహజంగా ఉండేందుకు నామవాచక నిర్మాణం వాడబడింది.
- source_word: לָבוֹא לְגָרְשֵׁנוּ
  choice: మమ్మల్ని వెళ్లగొట్టడానికి వచ్చారు
  rationale: రావడం మరియు వెళ్లగొట్టడం మధ్యనున్న ఉద్దేశ సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מִיְּרֻשָּׁתְךָ
  choice: నీ ఆస్తిలోనుండి
  rationale: భూమి అంతిమంగా దేవునికి చెందినదనే భావాన్ని నిలుపుతుంది; తరువాతి పదబంధంలో అది ఇశ్రాయేలుకు స్వాస్థ్యంగా ఇవ్వబడిందని వేరుగా వ్యక్తమవుతుంది.
- source_word: אֲשֶׁר הוֹרַשְׁתָּנוּ
  choice: నీవు మాకు స్వాస్థ్యంగా ఇచ్చిన
  rationale: హిఫిల్ రూపంలోని ‘స్వాధీనపరచడం/వారసత్వంగా పొందేలా చేయడం’ అనే కారణార్థాన్ని సాధారణ పాఠకులకు స్పష్టమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: భూమిపై దేవుని యాజమాన్యం మరియు ఇశ్రాయేలుకు దాని స్వాస్థ్యప్రదానం
  choice: నీవు మాకు స్వాస్థ్యంగా ఇచ్చిన నీ ఆస్తి
  alternative: నీవు మాకు స్వాధీనపరచిన నీ స్వాస్థ్యం
  rationale: ‘నీ ఆస్తి’ అని దేవుని అంతిమ యాజమాన్యాన్ని, ‘మాకు స్వాస్థ్యంగా ఇచ్చిన’ అని ఇశ్రాయేలుకు లభించిన హక్కును వేరువేరుగా నిలుపుతుంది; ప్రత్యామ్నాయ పఠనంలోని ఒకే మూలపదపు పునరుక్తిని పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలి వాడబడింది. ‘ఇదిగో’ మూలంలోని ఉద్ఘాటనను నిలుపుతుంది; ‘ప్రతిఫలం’ సందర్భంలోని వ్యంగ్యాన్ని పరిష్కరించకుండా భద్రపరుస్తుంది.
