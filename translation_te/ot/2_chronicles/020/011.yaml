  to: ఇదిగో, నీవు మాకు స్వాస్థ్యంగా ఇచ్చిన నీ ఆస్తిలోనుండి మమ్మల్ని వెళ్లగొట్టడానికి వచ్చి, వారు మాకు ప్రతిఫలం చెల్లిస్తున్నారు.[a]
