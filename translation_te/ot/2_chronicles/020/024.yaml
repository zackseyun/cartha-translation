  register: ఆధునిక ప్రామాణిక తెలుగు; కథన గాంభీర్యాన్ని నిలుపుతూ సాధారణ పాఠకులకు సులభంగా ఉండే పదజాలం. మూలంలోని దృశ్యాత్మకత, సమూహార్థం, ఆకస్మిక ఉద్ఘాటన సంరక్షించబడ్డాయి.
