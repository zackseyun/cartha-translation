source:
  edition: WLC
  text: וִֽ/יהוּדָ֛ה בָּ֥א עַל הַ/מִּצְפֶּ֖ה לַ/מִּדְבָּ֑ר וַ/יִּפְנוּ֙ אֶל הֶ֣/הָמ֔וֹן וְ/הִנָּ֧/ם פְּגָרִ֛ים נֹפְלִ֥ים אַ֖רְצָ/ה וְ/אֵ֥ין פְּלֵיטָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/024.yaml
  text: When Judah came to the lookout over the wilderness[a], they turned toward the multitude, and behold, there were corpses lying on the ground, and there was no survivor.
translation:
  language: te
  text: యూదావారు అరణ్యం వైపు ఉన్న కావలిస్థలానికి వచ్చినప్పుడు, వారు ఆ జనసమూహం వైపు తిరిగి చూశారు. ఇదిగో, నేలమీద పడి ఉన్న శవాలు కనిపించాయి[a]; తప్పించుకున్నవాడు ఒక్కడూ లేడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భూమిమీద పడిపోయిన శవాలు.” హీబ్రూలో అక్షరార్థంగా, “శవాలు, భూమివైపు పడినవి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוּדָה
  choice: యూదావారు
  rationale: ‘యూదా’ ఇక్కడ సమూహార్థకంగా యూదా ప్రజలను లేదా సైన్యాన్ని సూచిస్తుంది; తెలుగులో ‘యూదావారు’ ఆ సమూహ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בָּא
  choice: వచ్చినప్పుడు
  rationale: בוא అనే సాధారణ గమన క్రియను కథన సందర్భంలో కాలసంబంధ ఉపవాక్యంగా సహజంగా అందిస్తుంది.
- source_word: עַל הַמִּצְפֶּה לַמִּדְבָּר
  choice: అరణ్యానికి ఎదురుగా ఉన్న కావలిచోటికి
  rationale: מִצְפֶּה అనేది పరిశీలనా లేదా కావలి స్థలాన్ని సూచిస్తుంది; לַמִּדְבָּר దాని అరణ్యాభిముఖ స్థానాన్ని తెలియజేస్తుంది.
- source_word: וַיִּפְנוּ אֶל הֶהָמוֹן
  choice: వారు ఆ జనసమూహం వైపు తిరిగి చూశారు
  rationale: פנה యొక్క ‘తిరుగు’ భావాన్నీ, సందర్భంలో దృష్టి సారించడాన్నీ కలిపి సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; הָמוֹן ను ప్రత్యేకంగా ‘సైన్యం’ అని నిర్ధారించకుండా ‘జనసమూహం’గా ఉంచుతుంది.
- source_word: וְהִנָּם
  choice: ఇదిగో
  rationale: హఠాత్తుగా కనిపించిన దృశ్యాన్ని చూపించే హీబ్రూ నిర్దేశక ఉద్ఘాటనను నిలుపుతుంది.
- source_word: פְּגָרִים נֹפְלִים אַרְצָה
  choice: నేలమీద పడి ఉన్నవి శవాలే
  rationale: పదబంధంలోని ‘శవాలు, నేలవైపు పడినవి’ అనే ఫలితస్థితిని సహజంగా, దృశ్యాత్మకంగా అందిస్తుంది.
- source_word: וְאֵין פְּלֵיטָה
  choice: తప్పించుకున్నవాడు ఒక్కడూ లేడు
  rationale: פְּלֵיטָה యొక్క తప్పించుకున్న వ్యక్తి/ప్రాణాలతో బయటపడినవాడు అనే సందర్భార్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
