id: 2CH.20.14
reference: 2 Chronicles 20:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יַחֲזִיאֵ֡ל בֶּן זְכַרְיָ֡הוּ בֶּן בְּ֠נָיָה בֶּן יְעִיאֵ֧ל בֶּן מַתַּנְיָ֛ה הַ/לֵּוִ֖י מִן בְּנֵ֣י אָסָ֑ף הָיְתָ֤ה עָלָי/ו֙ ר֣וּחַ יְהוָ֔ה בְּ/ת֖וֹךְ הַ/קָּהָֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/014.yaml
  text: And Jahaziel son of Zechariah, son of Benaiah, son of Jeiel, son of Mattaniah, the Levite, from the sons of Asaph—the Spirit of Yahweh came upon him in the midst of the assembly.
translation:
  language: te
  text: సమాజం మధ్యలో ఆసాఫు కుమారులలో ఒకడైన లేవీయుడు మత్తన్యా కుమారుడైన యెయీయేలు కుమారుడైన బెనాయా కుమారుడైన జెకర్యా కుమారుడైన యహజీయేలు మీదికి యాహ్వే ఆత్మ వచ్చింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יַחֲזִיאֵל
  choice: అప్పుడు ... యహజీయేలు
  rationale: వావ్ సంధిని తెలుగు కథన ప్రవాహానికి సహజమైన ‘అప్పుడు’గా అనువదించాం; వ్యక్తి పేరును అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶּן
  choice: కుమారుడైన ... కుమారుడు ... కుమారుడు ... కుమారుడు
  rationale: మూలంలోని వంశావళి శ్రేణిని, ప్రతి בֶּן సంబంధాన్ని విడిచిపెట్టకుండా, తెలుగులో సహజంగా వెనుకనుంచి ముందుకు వచ్చే వంశపరంపర నిర్మాణంలో నిలిపాం.
- source_word: הַ/לֵּוִי
  choice: లేవీయుడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న వంశ/వర్గ గుర్తింపును తెలుగులో సహజమైన నామరూపంతో వ్యక్తం చేశాం.
- source_word: מִן בְּנֵי אָסָף
  choice: ఆసాఫు కుమారులలో ఒకడైన
  rationale: מִן యొక్క ‘నుండి/వారిలో’ భావాన్ని, בְּנֵי యొక్క సామూహిక వంశ సూచనను స్పష్టంగా తెలిపే సహజ తెలుగు ప్రయోగం.
- source_word: הָיְתָה עָלָיו רוּחַ יְהוָה
  choice: యాహ్వే ఆత్మ ... మీదికి వచ్చింది
  rationale: הָיְתָה עָלָיו ను కేవలం స్థితిగా కాక ఈ సందర్భంలో సంభవించిన ప్రవచనాత్మక ఆత్మావేశాన్ని సూచించే ఘటనాత్మక వాక్యంగా అనువదించాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: בְּ/תוֹךְ הַ/קָּהָל
  choice: సమాజం మధ్యలో
  rationale: בְּתוֹךְ యొక్క మధ్యస్థాన భావాన్ని, קָהָל యొక్క కూడిన ప్రజాసమూహ భావాన్ని సంక్షిప్తమైన ఆధునిక తెలుగులో నిలిపాం.
theological_decisions:
- issue: רוּחַ יְהוָה యొక్క అర్థం
  choice: యాహ్వే ఆత్మ
  alternative: యాహ్వే యొక్క ఆత్మ / యాహ్వే నుంచి వచ్చిన ఆత్మ
  rationale: ఈ సందర్భంలో యహజీయేలు ప్రవచన ప్రకటన చేయడానికి దేవుని ఆత్మ అతని మీదికి రావడాన్ని ఈ పదబంధం సూచిస్తుంది. తెలుగు వాక్యంలో వ్యక్తిత్వాన్ని బలవంతంగా జోడించకుండానే మూలంలోని దైవసంబంధాన్ని నిలిపాం.
- issue: יְהוָה దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది; కాబట్టి దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. పొడవైన హెబ్రీ వంశావళిని తెలుగు సహజ క్రమంలో అమర్చి, ఏ తరాన్నీ తొలగించలేదు. పాదటిప్పణులు అవసరం కాలేదు.
