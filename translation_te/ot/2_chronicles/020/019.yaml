source:
  edition: WLC
  text: וַ/יָּקֻ֧מוּ הַ/לְוִיִּ֛ם מִן בְּנֵ֥י הַ/קְּהָתִ֖ים וּ/מִן בְּנֵ֣י הַ/קָּרְחִ֑ים לְ/הַלֵּ֗ל לַ/יהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל בְּ/ק֥וֹל גָּד֖וֹל לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/019.yaml
  text: Then the Levites[a], from the sons of the Kohathites and from the sons of the Korahites, stood up to praise Yahweh, the God of Israel, with a very loud voice.
translation:
  language: te
  text: అప్పుడు కహాతీయుల సంతతివారిలోనుండి, కోరహీయుల సంతతివారిలోనుండి లేవీయులు లేచి నిలబడి, ఇశ్రాయేలు దేవుడైన యాహ్వేను అత్యంత బిగ్గరైన స్వరంతో స్తుతించడానికి సిద్ధపడ్డారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, “గొప్ప స్వరంతో అత్యధికంగా”; ఇది వారి స్తుతి స్వరం ఎంత బిగ్గరగా ఉందో నొక్కిచెప్పే హీబ్రూ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: లేచి
  rationale: קום అనే క్రియ ఇక్కడ వారు బహిరంగంగా స్తుతించడానికి లేచి నిలబడిన భౌతిక చర్యను సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో ‘లేచి ... స్తుతించారు’ సహజంగా ఉంది.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి గోత్రానికి చెందిన ఆరాధనా సేవకుల సమూహానికి ప్రామాణిక తెలుగు రూపం.
- source_word: מִן בְּנֵי הַקְּהָתִים
  choice: కహాతీయుల వంశస్థులలోనుండి
  rationale: బְּנֵי అనే వంశసంబంధ పదబంధాన్ని కేవలం ప్రత్యక్ష కుమారులుగా అపార్థం కాకుండా ‘వంశస్థులు’గా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וּמִן בְּנֵי הַקָּרְחִים
  choice: కోరహీయుల వంశస్థులలోనుండి
  rationale: ముందటి వంశపదబంధానికి సమాంతరంగా, కోరహు సంతతివారిని స్పష్టంగా సూచిస్తుంది.
- source_word: לְהַלֵּל
  choice: స్తుతించారు
  rationale: הלל యొక్క ఉద్దేశార్థాన్ని సందర్భానుసారంగా ప్రధాన క్రియతో కలిపి వ్యక్తపరుస్తుంది; మూలంలో పాడటం అని నిర్దిష్టంగా లేనందున ‘కీర్తనలు పాడారు’ అని విస్తరించలేదు.
- source_word: לַיהוָה
  choice: యాహ్వేను
  rationale: మూలంలోని יהוה అనే వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిప్యంతరీకరణలో నిలుపుతుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: యాహ్వేకు సమానాధికార విశేషణంగా ఉన్న హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בְּקוֹל גָּדוֹל לְמָעְלָה
  choice: అత్యంత బిగ్గరగా
  rationale: ‘గొప్ప స్వరంతో, పైకి’ అనే పదశః నిర్మాణం ఇక్కడ శబ్దతీవ్రతను బలపరిచే హీబ్రూ ప్రయోగం; ‘అత్యంత బిగ్గరగా’ దాని భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: వచనంలో ప్రత్యక్షంగా ఉన్న ఒడంబడిక నామాన్ని పేరుగానే నిలుపుతూ, దానిని సాధారణ బిరుదుగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. వంశపరమైన పదబంధాలను స్పష్టత కోసం ‘వంశస్థులు’గా ఇచ్చి, స్తుతి పాట రూపంలోనే జరిగిందని మూలానికి మించి నిర్దిష్టం చేయలేదు.
