revisions:
- from: అప్పుడు కహాతీయుల వంశస్థులలోనుండి, కోరహీయుల వంశస్థులలోనుండి వచ్చిన లేవీయులు లేచి, ఇశ్రాయేలు దేవుడైన యాహ్వేను అత్యంత బిగ్గరగా స్తుతించారు.[a]
  to: అప్పుడు కహాతీయుల సంతతివారిలోనుండి, కోరహీయుల సంతతివారిలోనుండి లేవీయులు లేచి నిలబడి, ఇశ్రాయేలు దేవుడైన యాహ్వేను అత్యంత బిగ్గరైన స్వరంతో స్తుతించడానికి సిద్ధపడ్డారు.[a]
  rationale: The revision removes the added idea of “coming,” makes the two ancestral-group phrases parallel, retains the physical action of standing up, and represents the Hebrew infinitive as purpose. “సిద్ధపడ్డారు” makes the purpose relation explicit in Telugu, while the loud-voice phrase and footnote preserve the Hebrew intensification.
