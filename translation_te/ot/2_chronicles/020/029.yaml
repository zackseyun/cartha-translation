language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִי֙ פַּ֣חַד אֱלֹהִ֔ים עַ֖ל כָּל מַמְלְכ֣וֹת הָ/אֲרָצ֑וֹת בְּ/שָׁמְעָ֕/ם כִּ֚י נִלְחַ֣ם יְהוָ֔ה עִ֖ם אוֹיְבֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/029.yaml
  text: And the fear of God came upon all the kingdoms of the lands when they heard that Yahweh had fought against the enemies of Israel[a].
translation:
  language: te
  text: యెహోవా ఇశ్రాయేలు శత్రువులతో యుద్ధం చేశాడని విన్నప్పుడు, దేశాల రాజ్యాలన్నిటి మీద దేవుని భయం[a] వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని నుండి వచ్చిన భీతి.” ఈ హీబ్రూ పదబంధం దేవుని సన్నిధి లేదా కార్యంతో ముడిపడిన భయాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: వచ్చింది
  rationale: ఫలితంగా ఒక భయస్థితి ఆరంభమైందనే కథన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: פַּחַד אֱלֹהִים
  choice: దేవుని భయం
  rationale: హీబ్రూ సంబంధపదబంధాన్ని నిలుపుతూ, దేవునిపట్ల భయం లేదా దేవుని చర్యవల్ల కలిగిన భీతి అనే భావసాధ్యతను తెరిచి ఉంచుతుంది.
- source_word: עַל כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: దేశాల రాజ్యాలన్నిటి మీద
  rationale: మమ్లాఖోత్‌ను ‘రాజ్యాలు,’ అరాత్సోత్ అనే బహువచనాన్ని ‘దేశాలు’గా అనువదించి, చుట్టుపక్కల ప్రాంతాల రాజకీయ రాజ్యాలను సూచించే భావాన్ని కాపాడుతుంది.
- source_word: בְּשָׁמְעָם כִּי
  choice: …అని విన్నప్పుడు
  rationale: ఇన్ఫినిటివ్ నిర్మాణంలోని కాలసంబంధ భావాన్నీ, כי ద్వారా పరిచయమయ్యే వినబడిన విషయాన్నీ సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: נִלְחַם
  choice: యుద్ధం చేశాడు
  rationale: ఇప్పటికే జరిగిన యెహోవా కార్యాన్ని స్పష్టంగా తెలిపే సాధారణ ఆధునిక తెలుగు ప్రయోగం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ప్రత్యక్ష లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- source_word: עִם אוֹיְבֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు శత్రువులతో
  rationale: לחם עם నిర్మాణంలో యుద్ధంలో ఎదిరించిన పక్షాన్ని సూచిస్తుంది; తెలుగులో ‘శత్రువులతో యుద్ధం చేశాడు’ అనేది విరోధార్థాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: פַּחַד אֱלֹהִים యొక్క సంబంధార్థం
  choice: దేవుని భయం
  alternative: దేవుని నుండి వచ్చిన భీతి
  rationale: ప్రధాన పాఠం హీబ్రూ పదబంధపు నిర్మాణాన్నీ దాని theological tension‌నూ నిలుపుతుంది; అది దేవునిపట్ల కలిగిన భయమా, దేవుని చర్యవల్ల వచ్చిన భీతియా అన్నది సందర్భం సూచించినా వ్యాకరణం పూర్తిగా నిర్ధారించదు.
- issue: יְהוָה దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా తెలుగులో ప్రత్యక్షంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. తెలుగు సహజ వాక్యక్రమం కోసం వినికిడి ఉపవాక్యాన్ని ముందుంచాం; ‘దేశాల రాజ్యాలు’ అనే రూపం మూలంలోని రెండు బహువచనాలను కాపాడుతుంది.
