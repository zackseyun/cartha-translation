id: 2CH.20.12
reference: 2 Chronicles 20:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֱלֹהֵ֨י/נוּ֙ הֲ/לֹ֣א תִשְׁפָּט בָּ֔/ם כִּ֣י אֵ֥ין בָּ֨/נוּ֙ כֹּ֔חַ לִ֠/פְנֵי הֶ/הָמ֥וֹן הָ/רָ֛ב הַ/זֶּ֖ה הַ/בָּ֣א עָלֵ֑י/נוּ וַ/אֲנַ֗חְנוּ לֹ֤א נֵדַע֙ מַֽה נַּעֲשֶׂ֔ה כִּ֥י עָלֶ֖י/ךָ עֵינֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/012.yaml
  text: Our God[a], will you not judge them? For we have no power before this great multitude that is coming against us. We do not know what to do, but our eyes are on you.
translation:
  language: te
  text: మా దేవా, నీవు వారిపై తీర్పు తీర్చవా? మా మీదికి వస్తున్న ఈ గొప్ప జనసమూహాన్ని ఎదుర్కొనే శక్తి మాకు లేదు. ఏమి చేయాలో మాకు తెలియదు; అయితే మా కళ్లు నీవైపే ఉన్నాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “ఎందుకంటే మా కళ్లు నీవైపు ఉన్నాయి.”'
    reason: చివరి כִּי పదానికి కారణార్థక అనువాదం సాధ్యమని, అలాగే మూలంలోని నేత్రాల రూపకాన్ని మరింత అక్షరార్థంగా చూపడానికి.
lexical_decisions:
- source_word: אֱלֹהֵינוּ
  choice: మా దేవా
  rationale: ప్రార్థనలో దేవుణ్ణి నేరుగా సంబోధించే రూపాన్ని సహజమైన తెలుగు సంబోధనతో వ్యక్తం చేస్తుంది.
- source_word: הֲלֹא תִשְׁפָּט בָּם
  choice: నీవు వారిపై తీర్పు తీర్చవా?
  rationale: שׁפט లోని న్యాయపరమైన భావాన్ని నిలుపుతూ, శత్రువులపై దేవుడు న్యాయం చేయాలనే విజ్ఞప్తిని వ్యక్తం చేస్తుంది; ‘శిక్షించవా’ అనడం భావాన్ని అనవసరంగా సంకుచితం చేస్తుంది.
- source_word: אֵין בָּנוּ כֹּחַ
  choice: శక్తి మాకు లేదు
  rationale: సైనిక సంక్షోభంలో వారి అసమర్థతను כֹּחַ స్పష్టంగా సూచిస్తుంది.
- source_word: לִפְנֵי הֶהָמוֹן הָרָב הַזֶּה
  choice: ఈ గొప్ప జనసమూహాన్ని ఎదుర్కొనే
  rationale: לִפְנֵי లోని ‘ఎదుట/ఎదురుగా’ అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, הָמוֹן ను ‘సైన్యం’ అని అతిగా నిర్దిష్టం చేయకుండా ‘జనసమూహం’గా ఉంచుతుంది.
- source_word: הַבָּא עָלֵינוּ
  choice: మా మీదికి వస్తున్న
  rationale: వర్తమాన కృదంతం సూచించే సమీపిస్తున్న ముప్పును, עַל లోని శత్రుభావ దిశను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַאֲנַחְנוּ לֹא נֵדַע מַה נַּעֲשֶׂה
  choice: ఏమి చేయాలో మాకు తెలియదు
  rationale: మూలంలోని సరళమైన, అత్యవసరమైన నిస్సహాయత ఒప్పుకోలును సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: כִּי עָלֶיךָ עֵינֵינוּ
  choice: అయితే మా కళ్లు నీవైపే ఉన్నాయి
  rationale: దేవునిపై ఆధారపడి నిరీక్షించడాన్ని సూచించే నేత్రాల రూపకాన్ని నిలుపుతూ, ముందున్న నిస్సహాయతతో ఉన్న భావవ్యతిరేకతను తెలుగులో స్పష్టంగా చూపుతుంది.
theological_decisions:
- issue: చివరి כִּי ఉపవాక్యం ముందున్న నిస్సహాయత ఒప్పుకోలుతో కలిగిన సంబంధం
  choice: భావవ్యతిరేకంగా ‘అయితే మా కళ్లు నీవైపే ఉన్నాయి’
  alternative: కారణార్థకంగా ‘ఎందుకంటే మా కళ్లు నీవైపు ఉన్నాయి’
  rationale: כִּי సాధారణంగా ‘ఎందుకంటే’ అని అర్థమివ్వగలిగినా, ఇక్కడ ప్రార్థన నిస్సహాయత నుంచి దేవునిపై నిరీక్షణకు చేరుతుంది. ‘అయితే’ ఆ గమనాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; కారణార్థక అవకాశాన్ని పాదసూచికలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ప్రార్థనకు తగిన గౌరవభరిత శైలిని ఉపయోగించాం. దేవునికి సంబోధనగా ‘నీవు’ను ఉంచాం. సైనిక సందర్భం స్పష్టమైనా הָמוֹן ను అతిగా నిర్దిష్టం చేయకుండా ‘గొప్ప జనసమూహం’గా అనువదించాం.
