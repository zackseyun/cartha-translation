id: 2CH.20.31
reference: 2 Chronicles 20:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּמְלֹ֥ךְ יְהוֹשָׁפָ֖ט עַל יְהוּדָ֑ה בֶּן שְׁלֹשִׁים֩ וְ/חָמֵ֨שׁ שָׁנָ֜ה בְּ/מָלְכ֗/וֹ וְ/עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ מָלַ֣ךְ בִּֽ/ירוּשָׁלִַ֔ם וְ/שֵׁ֣ם אִמּ֔/וֹ עֲזוּבָ֖ה בַּת שִׁלְחִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/031.yaml
  text: And Jehoshaphat reigned over Judah. He was thirty-five years old when he began to reign, and he reigned twenty-five years in Jerusalem. And his mother’s name was Azubah daughter of Shilhi.
translation:
  language: te
  text: యెహోషాపాతు యూదాపై రాజుగా పరిపాలించాడు. అతడు రాజైనప్పుడు ముప్పై ఐదు సంవత్సరాలవాడు; యెరూషలేములో ఇరవై ఐదు సంవత్సరాలు పరిపాలించాడు. అతని తల్లి పేరు అజూబా; ఆమె షిల్హీ కుమార్తె.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: రాజుగా పరిపాలించాడు
  rationale: מלך అనే క్రియను తెలుగు రాజవంశ చరిత్ర సందర్భంలో సహజంగా, స్పష్టంగా వ్యక్తపరుస్తుంది; తరువాతి בְּמָלְכוֹ ప్రవేశకాలాన్ని ప్రత్యేకంగా తెలియజేస్తుంది.
- source_word: עַל יְהוּדָה
  choice: యూదాపై
  rationale: מלך తో వచ్చిన עַל పరిపాలనకు లోబడిన రాజ్యాన్ని సూచిస్తుంది; ‘యూదాపై’ మూల నిర్మాణాన్ని, భావాన్ని నిలుపుతుంది.
- source_word: בֶּן שְׁלֹשִׁים וְחָמֵשׁ שָׁנָה
  choice: ముప్పై ఐదు సంవత్సరాలవాడు
  rationale: ఇది వయస్సును తెలిపే ప్రామాణిక హీబ్రూ నుడికారం; తెలుగులో సహజమైన వయస్సు వ్యక్తీకరణను ఉపయోగించాం.
- source_word: בְּמָלְכוֹ
  choice: అతడు రాజైనప్పుడు
  rationale: בְּ + מלך infinitive construct అతని రాజ్యప్రవేశ సమయాన్ని సూచిస్తుంది; ‘రాజైనప్పుడు’ సంక్షిప్తంగా, సహజంగా అదే అర్థాన్ని ఇస్తుంది.
- source_word: וְעֶשְׂרִים וְחָמֵשׁ שָׁנָה מָלַךְ
  choice: ఇరవై ఐదు సంవత్సరాలు పరిపాలించాడు
  rationale: రాజ్యపాలన వ్యవధిని నేరుగా తెలియజేసే మూల వాక్యాన్ని సహజ తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: בִּירוּשָׁלִַם
  choice: యెరూషలేములో
  rationale: రాజ్యపాలన జరిగిన కేంద్రస్థలాన్ని నేరుగా సూచిస్తుంది; సంప్రదాయ తెలుగు లిప్యంతరీకరణను అనుసరిస్తుంది.
- source_word: וְשֵׁם אִמּוֹ
  choice: అతని తల్లి పేరు
  rationale: హీబ్రూ రాజవంశ పరిచయ సూత్రాన్ని సహజ తెలుగు స్వామ్య నిర్మాణంలో నిలుపుతుంది.
- source_word: עֲזוּבָה
  choice: అజూబా
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: בַּת שִׁלְחִי
  choice: ఆమె షిల్హీ కుమార్తె
  rationale: בַּת తెలిపే ప్రత్యక్ష పితృసంబంధాన్ని స్పష్టమైన తెలుగు వాక్యంగా అందిస్తుంది; షిల్హీ పేరును లిప్యంతరీకరించాం.
