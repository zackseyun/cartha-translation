  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన చారిత్రక శైలిని ఉపయోగించాం. రాజవంశ సమాచారంలోని పునరుక్తిని తొలగించకుండా, తెలుగులో సహజంగా ఉండేలా వాక్యాలను అమర్చాం.
