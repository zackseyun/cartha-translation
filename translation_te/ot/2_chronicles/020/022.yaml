source:
  edition: WLC
  text: וּ/בְ/עֵת֩ הֵחֵ֨לּוּ בְ/רִנָּ֜ה וּ/תְהִלָּ֗ה נָתַ֣ן יְהוָ֣ה מְ֠אָֽרְבִים עַל בְּנֵ֨י עַמּ֜וֹן מוֹאָ֧ב וְ/הַר שֵׂעִ֛יר הַ/בָּאִ֥ים לִֽ/יהוּדָ֖ה וַ/יִּנָּגֵֽפוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/022.yaml
  text: And at the time they began with singing and praise[a], Yahweh set ambushes against the Ammonites, Moab, and Mount Seir, who were coming against Judah[b], and they were struck down.
translation:
  language: te
  text: వారు గానం చేయడం[a], స్తుతించడం ప్రారంభించినప్పుడు, యూదామీదికి[b] వస్తున్న అమ్మోనీయుల, మోయాబీయుల, శేయీరు పర్వతం వారి మీద యెహోవా మాటువేసినవారిని ఉంచాడు[c]; వారు దెబ్బతిన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆనందధ్వని చేయడం.’ హీబ్రూ పదం ఆనందగానాన్ని లేదా బిగ్గరగా చేసే ఆనందధ్వనిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘యూదాకు.’ సందర్భంలో వారు దండెత్తి వస్తున్నారు కాబట్టి ప్రధాన పాఠంలో ‘యూదామీదికి’ అని ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘మాటుదాడులను ఏర్పాటు చేశాడు.’ హీబ్రూ పదం మాటువేసి ఉన్నవారిని లేదా మాటుదాడులను సాధారణంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעֵת הֵחֵלּוּ
  choice: వారు … ఆరంభించిన సమయంలో
  rationale: కాలసూచక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతూ, వారి గానం-స్తుతి మొదలైన సమయానికే తదుపరి చర్య సంభవించిందని తెలియజేస్తుంది.
- source_word: בְרִנָּה וּתְהִלָּה
  choice: గానంతో, స్తుతితో
  rationale: ఆరాధనా సందర్భంలో רִנָּהను ‘గానం’గా, תְּהִלָּהను ‘స్తుతి’గా అనువదించడం సహజం; మొదటి పదంలోని ఆనందధ్వని/జయధ్వని భావాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ పాఠంలోని దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే దైవనామ రూపంతో ఇచ్చాం.
- source_word: מְאָרְבִים
  choice: మాటుదాడులను
  rationale: ఈ రూపం మాటువేసి దాడిచేసే వ్యక్తులను గానీ, మాటుదాడులను సమష్టిగా గానీ సూచించవచ్చు. ప్రధాన పాఠంలో చర్యను అతిగా నిర్దిష్టం చేయని సహజ తెలుగు రూపాన్ని వాడి, వ్యక్తులను సూచించే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: בְּנֵי עַמּוֹן מוֹאָב וְהַר שֵׂעִיר
  choice: అమ్మోనీయులు, మోయాబీయులు, శేయీరు పర్వతవాసులు
  rationale: ప్రజలను సూచించే సందర్భానుసారమైన సహజ తెలుగు జాతి/ప్రాంతవాసుల రూపాలు వాడబడ్డాయి.
- source_word: הַבָּאִים לִיהוּדָה
  choice: యూదా మీదికి వస్తున్న
  rationale: לִיהוּדָה అక్షరార్థంగా ‘యూదాకు’ కావచ్చు; సైనిక దండయాత్ర సందర్భంలో విరోధ కదలికను సహజంగా తెలిపేందుకు ‘యూదా మీదికి’ అని ఇచ్చాం.
- source_word: וַיִּנָּגֵפוּ
  choice: అప్పుడు వారు దెబ్బతిని ఓడిపోయారు
  rationale: נגף నిఫల్ రూపంలోని దెబ్బతినడం/పరాజయం పొందడం అనే బలమైన నిష్క్రియ భావాన్ని నిలుపుతూ, ‘హతమయ్యారు’ అని మరణాన్ని అవసరానికి మించి నిర్దిష్టం చేయకుండా అనువదించాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం నేరుగా ఒడంబడిక దైవనామాన్ని వాడుతుంది. కాబట్టి దానిని సాధారణ బిరుదుతో మార్చకుండా పేరుగా నిలిపాం.
- issue: మాటుదాడులను ఎవరు నిర్వహించారనే అస్పష్టత
  choice: యెహోవా మాటుదాడులను ఏర్పాటు చేశాడు
  alternative: యెహోవా మాటువేసినవారిని నియమించాడు
  rationale: మూలంలోని מְאָרְבִים వ్యక్తులను సూచించగలిగినా, వారి గుర్తింపును పాఠం స్పష్టంగా చెప్పదు. ప్రధాన అనువాదం ఆ అస్పష్టతను అనవసరంగా పరిష్కరించదు; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలిని వాడాం. ‘మాటుదాడులు,’ ‘యూదా మీదికి,’ ‘దెబ్బతిని ఓడిపోయారు’ వంటి రూపాలు సైనిక సందర్భాన్ని సహజంగా తెలియజేస్తాయి; మూలంలోని ముఖ్యమైన పదార్థ అస్పష్టతలు పాదటిప్పణుల్లో నిలుపబడ్డాయి.
