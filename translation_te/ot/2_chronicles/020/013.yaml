  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָ֨ל יְהוּדָ֔ה עֹמְדִ֖ים לִ/פְנֵ֣י יְהוָ֑ה גַּם טַפָּ֖/ם נְשֵׁי/הֶ֥ם וּ/בְנֵי/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/013.yaml
  text: And all Judah was standing before Yahweh[a], even their little ones, their wives, and their children.
translation:
  language: te
  text: యూదా ప్రజలందరూ యాహ్వే సన్నిధిలో నిలబడి ఉన్నారు; వారి చిన్నపిల్లలు, భార్యలు, కుమారులు[a] కూడా నిలబడి ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పిల్లలు” లేక “సంతానం.” హీబ్రూ పదం ప్రత్యేకంగా కుమారులను గానీ, సందర్భానుసారం పిల్లలందరినీ గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל יְהוּדָה
  choice: యూదా ప్రజలందరూ
  rationale: וְ సందర్భంలోని ముందు వాక్యంతో అనుసంధానిస్తుంది; తెలుగులో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండానే ఆ అనుసంధానం సహజంగా కొనసాగుతుంది. יְהוּדָה ఇక్కడ ప్రాంతం కంటే ఆ ప్రజలను సమష్టిగా సూచిస్తున్నందున ‘యూదా ప్రజలందరూ’ అని స్పష్టం చేశాం.
- source_word: עֹמְדִים
  choice: నిలబడి ఉన్నారు
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న స్థితిని సూచిస్తుంది; ‘నిలబడి ఉన్నారు’ ఆ నిడివిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לִ/פְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: לִפְנֵי అంటే ఒకరి ఎదుట లేదా సమక్షంలో ఉండడం. గంభీరమైన ఆరాధనా సందర్భంలో ‘సన్నిధిలో’ సహజంగా సరిపోతుంది; יְהוָה అనే వ్యక్తిగత నామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: גַּם טַפָּם
  choice: వారి చిన్నపిల్లలు ... కూడా
  rationale: גַּם తరువాత పేర్కొన్న కుటుంబ సభ్యుల చేర్పును నొక్కి చెబుతుంది. טַף ఆధారపడిన చిన్న వయసు పిల్లలను సూచిస్తుంది కాబట్టి ‘చిన్నపిల్లలు’ అని అనువదించాం.
- source_word: נְשֵׁיהֶם
  choice: భార్యలు
  rationale: ఈ కుటుంబ జాబితాలో possessive రూపం వివాహ భాగస్వాములను సూచిస్తుంది; అందువల్ల ‘భార్యలు’ సందర్భోచితం.
- source_word: וּ/בְנֵיהֶם
  choice: కుమారులు[a]
  rationale: בנים ప్రత్యేకంగా ‘కుమారులు’ అని, సందర్భానుసారం విస్తృతంగా ‘పిల్లలు/సంతానం’ అని కూడా అర్థమవుతుంది. మూలంలోని లింగ-నిర్దిష్ట సాధ్యతను ప్రధాన పాఠంలో ఉంచి, విస్తృత అర్థాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: עֹמְדִים ... גַּם
  choice: నిలబడి ఉన్నారు; ... కూడా వారితో ఉన్నారు
  rationale: హీబ్రూ వాక్యం తరువాతి కుటుంబ వర్గాలను అదే సమక్షంలో ఉన్నవారిగా చేర్చుతుంది. తెలుగులో అసహజమైన దీర్ఘ సమన్వయాన్ని నివారిస్తూ, మూలంలో అంతర్లీనంగా ఉన్న సమక్ష భావాన్ని ‘వారితో ఉన్నారు’ ద్వారా వ్యక్తం చేశాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠం బిరుదును కాకుండా చతురక్షర దైవనామాన్ని ఉపయోగిస్తుంది. అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’గా ఇచ్చాం.
- issue: בְנֵיהֶם లో లింగం మరియు పరిధి
  choice: కుమారులు[a]
  alternative: పిల్లలు / సంతానం
  rationale: ఈ పదం పురుష సంతానాన్ని ప్రత్యేకంగా సూచించగలదు; కొన్నిసార్లు సంతానమంతటినీ విస్తృతంగా సూచిస్తుంది. ప్రధాన పాఠంలో ‘కుమారులు’ ఉంచి, విస్తృత సాధ్యతను పాదటిప్పణిలో ఇవ్వడం ద్వారా మూలంలోని సందిగ్ధతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలి వాడాం. ‘సన్నిధిలో’ ఆరాధనా సందర్భానికి తగిన గౌరవభావాన్ని ఇస్తుంది. పాదటిప్పణి గుర్తు ప్రధాన పాఠంలోని సంబంధిత పదానికే జోడించబడింది.
