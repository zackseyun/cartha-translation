language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ/לֹ֣א אַתָּ֣ה אֱלֹהֵ֗י/נוּ הוֹרַ֨שְׁתָּ֙ אֶת יֹשְׁבֵי֙ הָ/אָ֣רֶץ הַ/זֹּ֔את מִ/לִּ/פְנֵ֖י עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וַֽ/תִּתְּנָ֗/הּ לְ/זֶ֛רַע אַבְרָהָ֥ם אֹֽהַבְ/ךָ֖ לְ/עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/007.yaml
  text: Did you not[a], our God, drive out the inhabitants of this land before your people Israel and give it forever to the offspring of Abraham, your friend?
translation:
  language: te
  text: మా దేవా, నీవు నీ ప్రజలైన ఇశ్రాయేలీయుల ఎదుటనుండి ఈ దేశ నివాసులను వెళ్లగొట్టి, దానిని నిన్ను ప్రేమించిన అబ్రాహాము[a] సంతానానికి శాశ్వతంగా ఇచ్చావు కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ స్నేహితుడైన అబ్రాహాము.”
    reason: אֹהַבְךָ అనే రూపానికి అక్షరార్థంగా ‘నిన్ను ప్రేమించినవాడు’ అనే భావం ఉంది; సందర్భానుసారంగా అది ‘నీ స్నేహితుడు’ అనే స్థిరమైన సంబంధ బిరుదుగానూ అర్థమవుతుంది.
lexical_decisions:
- source_word: הֲלֹא
  choice: ఇచ్చావు కదా?
  rationale: ఇది అవుననే సమాధానాన్ని ఆశించే అలంకారప్రశ్న. తెలుగులో వాక్యాంతంలోని ‘కదా?’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֱלֹהֵינוּ
  choice: మా దేవా
  rationale: ప్రార్థనలోని ప్రత్యక్ష సంబోధనను సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הוֹרַשְׁתָּ
  choice: వెళ్లగొట్టి
  rationale: హిఫీల్ రూపం ఈ దేశంలో నివసించినవారిని వారి స్వాధీనస్థలం నుంచి తొలగించడాన్ని సూచిస్తుంది. ‘వెళ్లగొట్టి’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి ఆ బలవంతపు తొలగింపు భావాన్ని నిలుపుతుంది.
- source_word: יֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: ఈ దేశ నివాసులను
  rationale: ‘ఈ దేశంలో నివసించేవారు’ అనే నిర్మాణాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מִלִּפְנֵי
  choice: ఎదుటనుండి
  rationale: ఇశ్రాయేలు ప్రజల సన్నిధి లేదా వారి ముందుకు సాగడం ఎదుటనుండి నివాసులను తొలగించిన భావాన్ని నిలుపుతుంది.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: నీ ప్రజలైన ఇశ్రాయేలు
  rationale: దేవునితో నిబంధన సంబంధాన్ని తెలిపే ‘నీ ప్రజ’ అనే పదబంధాన్నీ, దానికి వివరణగా ఉన్న ‘ఇశ్రాయేలు’ పేరునూ నిలుపుతుంది.
- source_word: וַתִּתְּנָהּ
  choice: దానిని ... ఇచ్చావు
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం ముందున్న ‘ఈ దేశం’ను సూచిస్తుంది; తెలుగులో ‘దానిని’ ఆ సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: לְזֶרַע אַבְרָהָם
  choice: అబ్రాహాము సంతానానికి
  rationale: זֶרַע సమూహార్థక ఏకవచనం. ‘సంతానం’ తెలుగులో సహజంగా ఉండి ఆ సమూహార్థాన్ని నిలుపుతుంది.
- source_word: אֹהַבְךָ
  choice: నిన్ను ప్రేమించిన
  rationale: మూలంలోని క్రియాత్మక విశేషణం అబ్రాహాము దేవుణ్ణి ప్రేమించినవాడని నేరుగా చెబుతుంది. ఈ రూపం మూలభావాన్ని వ్యాఖ్యానాత్మక బిరుదుగా మార్చకుండా కాపాడుతుంది.
- source_word: לְעוֹלָם
  choice: శాశ్వతంగా
  rationale: కొనసాగుతూ ఉండే కాలవ్యాప్తిని, వాగ్దాన సందర్భంలోని స్థిరత్వాన్ని ఆధునిక గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: అబ్రాహామును వర్ణించే אֹהַבְךָ పదబంధం
  choice: నిన్ను ప్రేమించిన
  alternative: నీ స్నేహితుడైన
  rationale: హీబ్రూ రూపం అక్షరార్థంగా ‘నిన్ను ప్రేమించినవాడు’ అని అబ్రాహామును వర్ణిస్తుంది. ఇతర లేఖన సందర్భాల్లో కనిపించే ‘స్నేహితుడు’ అనే సంబంధార్థం సముచితమైన ప్రత్యామ్నాయమే అయినా, ప్రధాన పాఠంలో క్రియాత్మక భావాన్ని ఉంచడం మూలంలోని దిశను, theological tensionను మరింత నేరుగా సంరక్షిస్తుంది; ప్రసిద్ధ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవప్రదమైన సంబోధన, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. హీబ్రూ అలంకారప్రశ్నను సహజమైన తెలుగు వాక్యాంత ‘కదా?’తో వ్యక్తపరచాం.
