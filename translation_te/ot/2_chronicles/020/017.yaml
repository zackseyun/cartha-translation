id: 2CH.20.17
reference: 2 Chronicles 20:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֹ֥א לָ/כֶ֖ם לְ/הִלָּחֵ֣ם בָּ/זֹ֑את הִתְיַצְּב֣וּ עִמְד֡וּ וּ/רְא֣וּ אֶת יְשׁוּעַת֩ יְהוָ֨ה עִמָּ/כֶ֜ם יְהוּדָ֣ה וִֽ/ירוּשָׁלִַ֗ם אַל תִּֽירְאוּ֙ וְ/אַל תֵּחַ֔תּוּ מָחָר֙ צְא֣וּ לִ/פְנֵי/הֶ֔ם וַ/יהוָ֖ה עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/017.yaml
  text: You will not need to fight in this battle[a]. Take your positions, stand still, and see the salvation of Yahweh with you, O Judah and Jerusalem. Do not fear or be dismayed. Tomorrow go out before them[b], and Yahweh is with you.
translation:
  language: te
  text: ఈ యుద్ధంలో పోరాడాల్సింది మీరు కాదు. మీ స్థానాల్లో నిలబడి, స్థిరంగా ఉండండి. యూదా, యెరూషలేములారా, మీతో ఉన్న యాహ్వే యొక్క రక్షణను[a] చూడండి. భయపడకండి, నిరుత్సాహపడకండి. రేపు వారి ఎదుటికి బయలుదేరండి; యాహ్వే మీతో ఉన్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రక్షణ’ అనే హీబ్రూ పదం ఈ సందర్భంలో యుద్ధం నుంచి కలిగే విమోచనను కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యాహ్వే మీతో ఉంటాడు.” హీబ్రూ వాక్యంలో స్పష్టమైన క్రియ లేదు; దీనిని ప్రస్తుత హామీగా గానీ భవిష్యత్ హామీగా గానీ అర్థం చేసుకోవచ్చు.
    reason: textual_ambiguity
lexical_decisions:
- source_word: לֹא לָכֶם לְהִלָּחֵם בָּזֹאת
  choice: ఈ యుద్ధంలో పోరాడాల్సింది మీరు కాదు
  rationale: హీబ్రూ వాక్యనిర్మాణంలోని ‘పోరాడడం మీ పని కాదు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; పోరాడకూడదనే నిషేధంగా కాక, వారు పోరాడవలసిన అవసరం లేదనే సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: הִתְיַצְּבוּ עִמְדוּ
  choice: మీ స్థానాల్లో నిలబడి, స్థిరంగా ఉండండి
  rationale: మొదటి ఆజ్ఞ తమ స్థానాలను చేపట్టడాన్ని, రెండవది అక్కడే నిలిచి ఉండడాన్ని సూచిస్తుంది. రెండు వరుస ఆజ్ఞల బలాన్ని తెలుగులో వేర్వేరుగా నిలిపింది.
- source_word: יְשׁוּעַת יְהוָה
  choice: యాహ్వే రక్షణ
  rationale: יְשׁוּעָה ఈ సందర్భంలో యుద్ధప్రమాదం నుంచి విమోచనను సూచించినా, ‘రక్షణ’ అనే పదం దాని విస్తృత అర్థపరిధిని కూడా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో మార్చకుండా తెలుగులో ధ్వన్యంతరీకరించింది.
- source_word: אַל תִּירְאוּ וְאַל תֵּחַתּוּ
  choice: భయపడకండి, దిగులుపడకండి
  rationale: మొదటి క్రియ భయాన్ని, రెండవది మనసు కుంగిపోవడం లేదా కలవరపడడాన్ని సూచిస్తుంది. సహజమైన, గౌరవప్రదమైన తెలుగులో రెండు నిషేధాలను నిలుపుతుంది.
- source_word: מָחָר צְאוּ לִפְנֵיהֶם
  choice: రేపు వారి ఎదుటికి బయలుదేరండి
  rationale: לִפְנֵיהֶם అనే పదబంధంలోని ‘వారి ఎదుటికి/ముందుకు’ అనే భావాన్ని నిలిపి, ‘వారితో యుద్ధం చేయడానికి’ అని అదనంగా నిర్ధారించలేదు.
- source_word: וַיהוָה עִמָּכֶם
  choice: యాహ్వే మీతో ఉన్నాడు
  rationale: క్రియలేని హీబ్రూ వాక్యాన్ని ప్రస్తుతకాల హామీగా సహజమైన తెలుగులో అందించింది; రాబోయే సంఘటన దృష్ట్యా భవిష్యత్ భావం కూడా సాధ్యమని పాదటిప్పణిలో పేర్కొంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ఉన్నందున దానిని బిరుదుతో భర్తీ చేయకుండా ధ్వన్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: יְשׁוּעַת יְהוָה యొక్క అర్థపరిధి
  choice: యాహ్వే రక్షణ
  alternative: యాహ్వే ఇచ్చే విమోచన / విజయం
  rationale: తక్షణ సందర్భం యుద్ధం నుంచి విమోచన అయినప్పటికీ, ‘రక్షణ’ హీబ్రూ పదంలోని విస్తృత భావాన్ని కుదించకుండా ఉంచుతుంది.
- issue: וַיהוָה עִמָּכֶם లో కాలభావం
  choice: యాహ్వే మీతో ఉన్నాడు
  alternative: యాహ్వే మీతో ఉంటాడు
  rationale: హీబ్రూలో స్పష్టమైన క్రియ లేదు. ప్రస్తుత దైవసాన్నిధ్యపు హామీని ప్రధాన పాఠంలో ఉంచి, రేపటి యుద్ధసందర్భానికి అనుగుణమైన భవిష్యత్ పఠనాన్ని పాదటిప్పణిలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. సైనిక సందర్భాన్ని స్పష్టంగా ఉంచుతూ, మూలంలోని సంక్షిప్త ఆజ్ఞాత్మక లయను మరియు చివరి క్రియలేని వాక్యంలోని కాలసందిగ్ధతను కాపాడింది.
