source:
  edition: WLC
  text: וַ/יִּתְנַבֵּ֞א אֱלִיעֶ֤זֶר בֶּן דֹּדָוָ֨הוּ֙ מִ/מָּ֣רֵשָׁ֔ה עַל יְהוֹשָׁפָ֖ט לֵ/אמֹ֑ר כְּ/הִֽתְחַבֶּרְ/ךָ֣ עִם אֲחַזְיָ֗הוּ פָּרַ֤ץ יְהוָה֙ אֶֽת מַעֲשֶׂ֔י/ךָ וַ/יִּשָּׁבְר֣וּ אֳנִיּ֔וֹת וְ/לֹ֥א עָצְר֖וּ לָ/לֶ֥כֶת אֶל תַּרְשִֽׁישׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/037.yaml
  text: Then Eliezer son of Dodavahu[a], from Mareshah, prophesied against Jehoshaphat, saying, “Because you joined yourself with Ahaziah[b], Yahweh has broken your works.” So the ships were wrecked and were not able to go to Tarshish.
translation:
  language: te
  text: అప్పుడు మారేషాకు చెందిన దోదావాహు కుమారుడు ఎలీయెజెరు యెహోషాపాతుకు వ్యతిరేకంగా ప్రవచించి, “నీవు అహజ్యాతో చేతులు కలిపినందువల్ల యాహ్వే నీ కార్యాలను[a] ధ్వంసం చేశాడు” అన్నాడు. దాంతో ఓడలు బద్దలై, తర్షీషుకు వెళ్లలేకపోయాయి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ పనులను.” హీబ్రూ పదం అక్షరార్థంగా “నీ కార్యాలు” అని ఉంది; ఇక్కడ అది యెహోషాపాతు చేపట్టిన ఓడల నిర్మాణ యత్నాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “తర్షీషుకు వెళ్లకుండా నిరోధించబడ్డాయి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְנַבֵּא
  choice: ప్రవచిస్తూ
  rationale: נבא యొక్క హిత్పయేల్ రూపం ఇక్కడ ప్రవక్తగా దేవుని సందేశాన్ని ప్రకటించడాన్ని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘ప్రవచించడం’ సహజమైన సమానార్థకం.
- source_word: עַל
  choice: వ్యతిరేకంగా
  rationale: ఇది యెహోషాపాతును గద్దించే తీర్పు సందేశం కాబట్టి ‘గురించి’ అనే తటస్థ భావం కంటే ‘వ్యతిరేకంగా’ సందర్భానికి తగినది.
- source_word: מִמָּרֵשָׁה
  choice: మారేషాకు చెందిన
  rationale: מן మూలస్థలాన్ని సూచిస్తుంది; తెలుగులో ఒక వ్యక్తి స్వస్థలాన్ని తెలిపేందుకు ‘చెందిన’ సహజంగా ఉంది.
- source_word: כְּהִתְחַבֶּרְךָ עִם
  choice: చేతులు కలిపినందువల్ల
  rationale: חבר యొక్క హిత్పయేల్ రూపంలోని తనను మరొకరితో కలుపుకోవడం లేదా భాగస్వామ్యం ఏర్పరచుకోవడం అనే భావాన్ని సహజంగా తెలియజేస్తుంది; అధికారిక ఒప్పందమని మితిమీరి నిర్దిష్టం చేయదు.
- source_word: פָּרַץ
  choice: భగ్నం చేశాడు
  rationale: మూల క్రియకు పగులగొట్టడం లేదా ఛిన్నాభిన్నం చేయడం అనే బలమైన భావం ఉంది; ఇక్కడ యత్నాన్ని విఫలం చేయడాన్ని ‘భగ్నం చేశాడు’ సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: מַעֲשֶׂיךָ
  choice: నీ పనులను
  rationale: హీబ్రూ బహువచనంలోని ‘నీ పనులు/కార్యాలు’ అనే రూపాన్ని నిలుపుతుంది; సందర్భంలో ఇది ఓడల నిర్మాణ యత్నాన్ని సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
- source_word: וַיִּשָּׁבְרוּ אֳנִיּוֹת
  choice: ఓడలు బద్దలై
  rationale: నిఫాల్ రూపం ఓడలు విరిగిపోయిన ఫలితాన్ని సూచిస్తుంది; ‘బద్దలై’ తెలుగులో ఓడలు ధ్వంసమైన విషయాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְלֹא עָצְרוּ לָלֶכֶת
  choice: వెళ్లలేకపోయాయి
  rationale: עצר ఇక్కడ శక్తి చాలకపోవడం, నిరోధించబడడం లేదా సామర్థ్యం లేకపోవడం అనే భావాలకు వీలు ఇస్తుంది; ధ్వంసమైన ఓడలను కర్తగా ఉంచినప్పుడు ‘వెళ్లలేకపోయాయి’ సహజంగా ఉంది.
- source_word: תַּרְשִׁישׁ
  choice: తర్షీషు
  rationale: స్థలనామాన్ని తెలుగు ధ్వన్యనుకరణలో అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా ధ్వన్యనుకరిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా ఇవ్వడం మూలంలోని నామాన్ని కాపాడుతుంది.
- issue: అహజ్యాతో సంబంధం యొక్క స్వరూపం
  choice: చేతులు కలిపినందువల్ల
  alternative: మైత్రి ఒప్పందం చేసుకున్నందువల్ల
  rationale: హీబ్రూ పదం కలవడం లేదా భాగస్వామ్యం ఏర్పరచుకోవడాన్ని సూచిస్తుంది; అది తప్పనిసరిగా అధికారిక రాజకీయ ఒప్పందమేనని పాఠం నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. వ్యక్తి పేర్లు, స్థలనామాలు తెలుగు ధ్వన్యనుకరణలో ఇవ్వబడ్డాయి. మూలంలోని తీర్పు స్వరం నిలుపుతూ, అస్పష్టత ఉన్న చోట పాదసూచికల్లో ప్రత్యామ్నాయ అర్థాలు పేర్కొనబడ్డాయి.
