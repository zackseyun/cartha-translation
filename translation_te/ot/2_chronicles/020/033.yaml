source:
  edition: WLC
  text: אַ֥ךְ הַ/בָּמ֖וֹת לֹא סָ֑רוּ וְ/ע֤וֹד הָ/עָם֙ לֹא הֵכִ֣ינוּ לְבָבָ֔/ם לֵ/אלֹהֵ֖י אֲבֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/033.yaml
  text: However[a], the high places were not removed, and the people still had not set their hearts toward the God of their fathers.
translation:
  language: te
  text: అయితే, ఉన్నత స్థలాలు తొలగించబడలేదు; ప్రజలు ఇంకా తమ హృదయాలను తమ పూర్వీకుల దేవుని వైపు స్థిరపరచుకోలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ పూర్వీకుల దేవుని వైపు తమ హృదయాలను సిద్ధపరచుకోలేదు.”
    reason: כון హిఫిల్ రూపానికి సందర్భానుసారం ‘స్థిరపరచుకోవడం’తో పాటు ‘సిద్ధపరచుకోవడం’ అనే భావం ఉండవచ్చు. లְ ఉపసర్గ దేవుని వైపు హృదయాభిముఖతను సూచిస్తుంది.
lexical_decisions:
- source_word: אַךְ
  choice: అయితే
  rationale: మునుపటి అనుకూల అంచనాకు విరుద్ధంగా ఇంకా మిగిలిన లోపాన్ని చూపించే సహజమైన వ్యతిరేక సంధానపదం.
- source_word: הַבָּמוֹת
  choice: ఉన్నత స్థలాలు
  rationale: ఆరాధనకు సంబంధించిన ఎత్తైన ప్రదేశాలు అనే చారిత్రక-మతపరమైన పదాన్ని అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: לֹא סָרוּ
  choice: తొలగించబడలేదు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘తొలగిపోలేదు/మళ్లిపోలేదు’ అనే భావం ఉన్నా, ఈ సందర్భంలో ఆ ఆరాధనా స్థలాలు అలాగే మిగిలాయని సహజంగా తెలియజేస్తుంది.
- source_word: וְעוֹד
  choice: ఇంకా
  rationale: పరిష్కారం కాని పరిస్థితి కొనసాగుతూనే ఉందనే భావాన్ని సంక్షిప్తంగా తెలుపుతుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: జనసమూహాన్ని సూచించే సహజమైన సమానార్థకం.
- source_word: לֹא הֵכִינוּ לְבָבָם
  choice: తమ హృదయాలను నిలపలేదు
  rationale: כון హిఫిల్ రూపంలో ఉన్న సిద్ధపరచడం, స్థిరపరచడం, దిశగా మళ్లించడం అనే భావాల్లో, తరువాతి ל ఉపసర్గతో కలిసి ఉద్దేశపూర్వక అంతరంగ దిశను తెలుపుతుంది; తెలుగు వాక్యరూపంలో దాని భావపరమైన విస్తృతిని నిలుపుతుంది.
- source_word: לֵאלֹהֵי אֲבֹתֵיהֶם
  choice: తమ పూర్వీకుల దేవునివైపు
  rationale: ל ఉపసర్గ సూచించే దిశ లేదా అభిముఖతను ‘వైపు’ స్పష్టంగా తెలియజేస్తుంది; ‘పూర్వీకుల దేవుడు’ ఒడంబడిక-చారిత్రక సూచనను సహజ ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ప్రజల లోపం యొక్క స్వభావం
  choice: బాహ్య ఆరాధనా సంస్కరణ పూర్తికాకపోవడంతో పాటు, ప్రజల అంతరంగ నిబద్ధత ఇంకా తమ పూర్వీకుల దేవునివైపు స్థిరపడలేదని వచనం చెబుతుంది.
  alternative: ప్రజలు ఆరాధన కోసం తమ హృదయాలను సిద్ధపరచుకోలేదని అనువదించడం.
  rationale: మూలం ఆరాధనా స్థలాల కొనసాగింపును హృదయానికి సంబంధించిన ప్రకటనతో జతచేస్తుంది. కేవలం భావోద్వేగ సిద్ధతగా లేదా ఒక నిర్దిష్ట సిద్ధాంత వర్గంగా సంకుచితం చేయకుండా, దేవునివైపు ఉద్దేశపూర్వక అంతరంగ అభిముఖతను అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఉన్నత స్థలాలు’ అనే బైబిలీయ చారిత్రక పదాన్ని నిలిపి, ‘పితరులు’ కంటే నేటి పాఠకులకు సహజమైన ‘పూర్వీకులు’ వాడబడింది.
