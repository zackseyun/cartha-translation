source:
  edition: WLC
  text: וְ/עַתָּ֡ה הִנֵּה֩ בְנֵֽי עַמּ֨וֹן וּ/מוֹאָ֜ב וְ/הַר שֵׂעִ֗יר אֲ֠שֶׁר לֹֽא נָתַ֤תָּה לְ/יִשְׂרָאֵל֙ לָ/ב֣וֹא בָ/הֶ֔ם בְּ/בֹאָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם כִּ֛י סָ֥רוּ מֵ/עֲלֵי/הֶ֖ם וְ/לֹ֥א הִשְׁמִידֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/010.yaml
  text: And now[a], behold, the people of Ammon and Moab and Mount Seir[b], whom you did not allow Israel to enter against when they came from the land of Egypt—for they turned away from them and did not destroy them—
translation:
  language: te
  text: “ఇప్పుడు ఇదిగో, అమ్మోనీయులు, మోయాబీయులు, శేయీరు పర్వత ప్రాంత ప్రజలు[a]—వారిమీదికి వెళ్లడానికి నీవు ఇశ్రాయేలుకు అనుమతి ఇవ్వలేదు[b]. ఇశ్రాయేలు ఐగుప్తు దేశం నుండి వచ్చినప్పుడు, వారు వారిని తప్పించుకొని వెళ్లిపోయారు, వారిని నాశనం చేయలేదు—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అమ్మోను కుమారులు, మోయాబు, శేయీరు పర్వతం.” ఈ పేర్లు ఇక్కడ ఆయా ప్రజలను సూచిస్తున్నాయి.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “వారిలోకి/వారిమీదికి వెళ్లడానికి ఇశ్రాయేలుకు నీవు ఇవ్వలేదు.” సందర్భంలో, వారిపై దాడి చేయడానికి దేవుడు ఇశ్రాయేలును అనుమతించలేదనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה הִנֵּה
  choice: ఇప్పుడు ఇదిగో
  rationale: వావ్‌తో కూడిన వర్తమాన సూచనను, ఫిర్యాదును బలంగా ముందుకు తెచ్చే הִנֵּה పద ప్రభావాన్ని సహజమైన తెలుగు ప్రార్థనా శైలిలో నిలుపుతుంది.
- source_word: בְנֵי עַמּוֹן וּמוֹאָב וְהַר שֵׂעִיר
  choice: అమ్మోను ప్రజలు, మోయాబు ప్రజలు, శేయీరు పర్వత ప్రాంత ప్రజలు
  rationale: మూలంలోని జాతి–భౌగోళిక నామాల సమన్వయాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; ‘కుమారులు’ అనే అక్షరార్థ జాతీయ నుడికారాన్ని సహజంగా ‘ప్రజలు’గా ఇచ్చింది.
- source_word: אֲשֶׁר לֹא נָתַתָּה לְיִשְׂרָאֵל לָבוֹא בָהֶם
  choice: ఈ ప్రజల మీదికి వెళ్లడానికి నీవు వారికి అనుమతి ఇవ్వలేదు
  rationale: ‘లోనికి/మీదికి రావడానికి ఇవ్వలేదు’ అనే హెబ్రీ నుడికారంలోని అనుమతి భావాన్ని నిలుపుతూ, ‘దండెత్తు’ వంటి మరింత బలమైన సైనిక వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: בְּבֹאָם מֵאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశం నుండి ఇశ్రాయేలీయులు వచ్చినప్పుడు
  rationale: కాలసూచక infinitive construct భావాన్ని సహజమైన తెలుగులో ఇస్తూ, క్రియ కర్త ఇశ్రాయేలు అని సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: כִּי סָרוּ מֵעֲלֵיהֶם
  choice: అందువల్ల ఇశ్రాయేలీయులు వారి దగ్గర నుండి పక్కకు మళ్లారు
  rationale: ఇశ్రాయేలు ఆ ప్రజలను ఎదుర్కోకుండా తన మార్గాన్ని మళ్లించిన కథన సూచనను వ్యక్తం చేస్తుంది.
- source_word: וְלֹא הִשְׁמִידוּם
  choice: వారిని నాశనం చేయలేదు
  rationale: שׁמד హిఫీల్ రూపంలోని యుద్ధసంబంధమైన బలమైన నాశన భావాన్ని అతిశయోక్తి లేకుండా నిలుపుతుంది.
theological_decisions:
- issue: దేవునికి నేరుగా చేసిన సంబోధనను రెండవ పురుషంలో నిలుపడం
  choice: నీవు వారికి అనుమతి ఇవ్వలేదు
  alternative: యెహోవా వారికి అనుమతి ఇవ్వలేదు
  rationale: ఇది దేవునికి నేరుగా చేస్తున్న ప్రార్థనలో భాగం; అందువల్ల మూలంలోని రెండవ పురుష సంబోధనను మూడవ పురుష దైవనామంతో మార్చలేదు.
- issue: సైనిక చర్య భావాన్ని ప్రధాన పాఠ్యంలో ఎంత స్పష్టీకరించాలి
  choice: ఈ ప్రజల మీదికి వెళ్లడానికి
  alternative: ఈ ప్రజల మీదికి దండెత్తడానికి
  rationale: సందర్భం సైనికమైనదే అయినా, לבוא בהם అనే పదబంధం అక్షరార్థంగా ‘వారిలోకి/వారిమీదికి వెళ్లడం’ అని ఉంటుంది. కాబట్టి ప్రధాన పాఠ్యం దాని స్వల్ప అస్పష్టతను నిలుపుతుంది; సందర్భార్థాన్ని పాదటిప్పణి వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలి వాడబడింది. ‘ఇదిగో’ మూలంలోని ఉద్ఘాటనను నిలుపుతుంది. వాక్యం తదుపరి వచనంలో కొనసాగుతుందని సూచించేందుకు చివర దీర్ఘ డాష్ ఉంచబడింది.
