id: 2CH.20.9
reference: 2 Chronicles 20:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם תָּב֨וֹא עָלֵ֜י/נוּ רָעָ֗ה חֶרֶב֮ שְׁפוֹט֮ וְ/דֶ֣בֶר וְ/רָעָב֒ נַֽעַמְדָ֞ה לִ/פְנֵ֨י הַ/בַּ֤יִת הַ/זֶּה֙ וּ/לְ/פָנֶ֔י/ךָ כִּ֥י שִׁמְ/ךָ֖ בַּ/בַּ֣יִת הַ/זֶּ֑ה וְ/נִזְעַ֥ק אֵלֶ֛י/ךָ מִ/צָּרָתֵ֖/נוּ וְ/תִשְׁמַ֥ע וְ/תוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/009.yaml
  text: If disaster comes upon us—sword[a], judgment, pestilence, or famine—we will stand before this house and before you, for your name is in this house, and we will cry out to you from our distress, and you will hear and save.
translation:
  language: te
  text: ఒకవేళ ఖడ్గం, తీర్పు, తెగులు లేదా కరవు అనే విపత్తు మా మీదికి వస్తే, మేము ఈ మందిరం ఎదుట, నీ సన్నిధిలో నిలబడతాము. ఎందుకంటే నీ నామం ఈ మందిరంలో ఉంది[a]. మా ఆపదలో నీకు మొరపెడతాము; అప్పుడు నీవు విని మమ్మల్ని రక్షిస్తావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ నామం ఈ మందిరంపై ఉంది,” అంటే ఈ మందిరం నీ నామాన్ని ధరించింది.
    reason: హెబ్రీ నుడికారానికి సాధ్యమైన సహజ ప్రత్యామ్నాయాన్ని తెలియజేస్తూ, మందిరం దేవునికి చెందినదనే భావాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: רָעָה
  choice: విపత్తు
  rationale: ఇక్కడ ఇది నైతిక కీడును కాక, తరువాత పేర్కొన్న ఖడ్గం, తీర్పు, తెగులు, కరవు వంటి హానికరమైన ఆపదను సూచిస్తుంది.
- source_word: חֶרֶב
  choice: ఖడ్గం
  rationale: యుద్ధం అని భావానువాదం చేయకుండా, హెబ్రీలోని నిర్దిష్టమైన రూపకాన్ని నిలుపుతుంది.
- source_word: שְׁפוֹט
  choice: తీర్పు
  rationale: విపత్తుల జాబితాలోని నామవాచకంగా తీసుకొని, శిక్షాత్మక తీర్పు భావాన్ని అతిగా వివరించకుండా నిలుపుతుంది.
- source_word: דֶבֶר
  choice: తెగులు
  rationale: సమాజాన్ని వ్యాపకంగా బాధించే అంటువ్యాధి లేదా మహమ్మారి భావాన్ని సహజమైన తెలుగు బైబిలు పదంతో తెలియజేస్తుంది.
- source_word: רָעָב
  choice: కరవు
  rationale: వ్యక్తిగత ఆకలిని కాక, విస్తృతమైన ఆహార కొరతను సూచిస్తుంది.
- source_word: נַעַמְדָה
  choice: మేము ... నిలబడతాము
  rationale: షరతుతో కూడిన సందర్భంలో సమూహం చేయబోయే కార్యాన్ని తెలిపే భవిష్యత్ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: לִפְנֵי הַבַּיִת הַזֶּה
  choice: ఈ మందిరం ఎదుట
  rationale: הַבַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఇక్కడ దేవాలయాన్ని సూచిస్తున్నందున ఆధునిక తెలుగులో స్పష్టమైన ‘మందిరం’ వాడబడింది; ‘ఎదుట’ ప్రార్థనా స్థితిని నిలుపుతుంది.
- source_word: וּלְפָנֶיךָ
  choice: నీ సన్నిధిలో
  rationale: దేవుని ఎదుట నిలబడటమనే సంబంధాత్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, మందిరం ఎదుట నిలబడటంతో ఉన్న సమాంతరతను కాపాడుతుంది.
- source_word: כִּי שִׁמְךָ בַּבַּיִת הַזֶּה
  choice: ఎందుకంటే నీ నామం ఈ మందిరంలో ఉంది
  rationale: దేవుని నామానికి మందిరంతో ఉన్న నిబంధనాత్మక సంబంధం, సన్నిధి, హక్కు అనే భావాలలో ఒక్కదానికే పరిమితం చేయకుండా హెబ్రీ నుడికారాన్ని నిలుపుతుంది.
- source_word: וְנִזְעַק
  choice: మొరపెడతాము
  rationale: సాధారణ ప్రార్థనకంటే ఆపదలో చేసే అత్యవసర విన్నపాన్ని బలంగా వ్యక్తం చేస్తుంది.
- source_word: מִצָּרָתֵנוּ
  choice: మా ఆపదలో
  rationale: మూలంలోని ‘నుండి’ భావాన్ని తెలుగులో అసహజంగా చేయకుండా, ఆ మొర ఉద్భవించే కష్ట పరిస్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְתִשְׁמַע וְתוֹשִׁיעַ
  choice: నీవు విని మమ్మల్ని రక్షిస్తావు
  rationale: వినడం, రక్షించడం అనే రెండు క్రియలను వేరుగా, నేరుగా ఉంచుతుంది; తెలుగు వాక్యానికి అవసరమైన కర్మను స్పష్టంగా చేర్చింది.
theological_decisions:
- issue: ‘నీ నామం ఈ మందిరంలో ఉంది’ అనే మందిర-నామ వేదాంతం
  choice: ‘నీ నామం ఈ మందిరంలో ఉంది’ అనే హెబ్రీ నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలుపడం.
  alternative: ‘ఈ మందిరం నీ నామాన్ని ధరించింది’ లేదా ‘నీ నామం ఈ మందిరంపై ఉంది.’
  rationale: ఈ నుడికారం దేవుని సన్నిధి, ఆయన హక్కు, నిబంధనాత్మక సంబంధం వంటి భావాలను కలిగి ఉంది. వాటిలో ఒక్కదానిని మాత్రమే నిర్ణయించకుండా మూలపాఠ్యంలోని వేదాంతపరమైన విస్తృతిని కాపాడుతుంది.
- issue: שְׁפוֹט ను విపత్తుల జాబితాలో అర్థం చేసుకోవడం
  choice: ‘తీర్పు’ అనే ప్రత్యేక అంశంగా అనువదించడం.
  alternative: ‘తీర్పు ఖడ్గం’ లేదా ‘శిక్షించే ఖడ్గం.’
  rationale: ఇచ్చిన WLC పాఠ్యరూపం మరియు విరామ నిర్మాణం ప్రకారం దాన్ని జాబితాలోని అంశంగా ఉంచడం సాధ్యమైన పఠనం; ‘శిక్ష’ అని విస్తరించడం కన్నా అసలు పదంలోని న్యాయతీర్పు భావాన్ని తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘ఖడ్గం,’ ‘తెగులు,’ ‘కరవు,’ ‘మొరపెట్టు,’ ‘నామం’ వంటి పదాలు బైబిలు సందర్భానికి తగిన గంభీరతను ఉంచుతాయి; వాక్య నిర్మాణం మాత్రం ఆధునికంగా, స్పష్టంగా ఉంది.
