source:
  edition: WLC
  text: וַ/יְהִ֣י אַֽחֲרֵי כֵ֡ן בָּ֣אוּ בְנֵי מוֹאָב֩ וּ/בְנֵ֨י עַמּ֜וֹן וְ/עִמָּ/הֶ֧ם מֵֽ/הָ/עַמּוֹנִ֛ים עַל יְהוֹשָׁפָ֖ט לַ/מִּלְחָמָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/001.yaml
  text: After this[a], the Moabites and the Ammonites, and with them some of the Meunites, came against Jehoshaphat for battle.
translation:
  language: te
  text: దీని తరువాత మోయాబీయులు, అమ్మోనీయులు, వారితోపాటు అమ్మోనీయులలో కొందరు[a] యెహోషాపాతుకు వ్యతిరేకంగా యుద్ధం చేయడానికి వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీయ మసోరా పాఠంలో ‘అమ్మోనీయులలో కొందరు’ అని ఉంది. అయితే సందర్భాన్ని, కొన్ని ప్రాచీన అనువాదాలను అనుసరించి, దీనిని మేఊనీయులు లేదా వారితో మైత్రి చేసిన ఇలాంటి మరొక జనసమూహంగా చాలామంది అర్థం చేసుకుంటారు.
    reason: textual_variant
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: దీని తరువాత
  rationale: ఇది కథనంలోని కాలక్రమ మార్పును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; హెబ్రీయ భాషలోని ‘అప్పుడు జరిగింది’ అనే సూత్రప్రాయ ప్రారంభాన్ని అనవసరంగా పదేపదే అనుకరించదు.
- source_word: בָּאוּ
  choice: వచ్చారు
  rationale: ఇది సాధారణ గమన క్రియ. עַל మరియు యుద్ధ సందర్భంతో కలిసినప్పుడు శత్రుత్వ ఉద్దేశం స్పష్టమవుతుంది; ‘దండెత్తారు’ వంటి మరింత నిర్దిష్ట భావాన్ని మూలంలోకి చేర్చదు.
- source_word: בְנֵי מוֹאָב
  choice: మోయాబీయులు
  rationale: ‘మోయాబు కుమారులు’ అనే అక్షరార్థం కంటే, ఇక్కడ ఉద్దేశించిన జాతి సమూహాన్ని ఆధునిక తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: בְנֵי עַמּוֹן
  choice: అమ్మోనీయులు
  rationale: ఈ నిర్మాణం జాతి పేరును సూచిస్తుంది; ‘అమ్మోను కుమారులు’ కంటే ఇది సహజమైన తెలుగు సమానార్థకం.
- source_word: וְעִמָּהֶם
  choice: వారితోపాటు
  rationale: అదనపు సమూహం మోయాబీయులు, అమ్మోనీయులతో కలిసి వచ్చిందనే సంబంధాన్ని సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: מֵהָעַמּוֹנִים
  choice: అమ్మోనీయులలో కొందరు[a]
  rationale: WLC మసోరా పాఠాన్ని నేరుగా అనుసరిస్తుంది. ముందే అమ్మోనీయులు ప్రస్తావించబడినందున పునరుక్తి కఠినంగా ఉన్నప్పటికీ, దానిని మౌనంగా సవరించకుండా ప్రత్యామ్నాయ ప్రాచీన పాఠసాక్ష్యాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: עַל יְהוֹשָׁפָט
  choice: యెహోషాపాతుతో
  rationale: యుద్ధం చేయడం అనే ప్రయోజన వాక్యంతో కలిపి, యెహోషాపాతుకు వ్యతిరేకంగా వచ్చిన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לַמִּלְחָמָה
  choice: యుద్ధం చేయడానికి
  rationale: వారి రాక యొక్క శత్రుత్వ ప్రయోజనాన్ని స్పష్టమైన, సహజమైన తెలుగులో తెలియజేస్తుంది; ‘యుద్ధం కొరకు’ కంటే సాధారణ పాఠకులకు సులభంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. జాతి పేర్లకు సహజమైన తెలుగు రూపాలు వాడాం. కఠినమైన మసోరా పాఠాన్ని ప్రధాన వాక్యంలో నిలిపి, పాఠాంతరాన్ని పాదటిప్పణిలో చూపించాం.
