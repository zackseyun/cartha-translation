  edition: WLC
  text: וַ/יֵּ֗לֶךְ בְּ/דֶ֛רֶךְ אָבִ֥י/ו אָסָ֖א וְ/לֹא סָ֣ר מִמֶּ֑/נָּה לַ/עֲשׂ֥וֹת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/032.yaml
  text: He walked in the way of his father Asa and did not turn aside from it, doing what was right in the eyes of Yahweh.
translation:
  language: te
  text: అతడు తన తండ్రి ఆసా నడిచిన మార్గంలోనే నడిచాడు; దాని నుండి తొలగిపోలేదు; యాహ్వే దృష్టికి సరైనదాన్ని చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: మార్గంలోనే నడిచాడు
  rationale: הלך మరియు דרך కలిపి జీవన ప్రవర్తనను సూచించే రూపకం. తెలుగు పాఠకులకు సహజంగా ఉండేలా, హెబ్రీయ రూపకాన్ని కూడా నిలుపుతుంది.
- source_word: אָבִיו אָסָא
  choice: తన తండ్రి ఆసా
  rationale: ఆసా యెహోషాపాతు తండ్రి అని స్పష్టంగా, సహజ తెలుగు పదక్రమంలో తెలియజేస్తుంది.
- source_word: וְלֹא סָר מִמֶּנָּה
  choice: దానినుంచి తొలగిపోకుండా
  rationale: סור מן అంటే ఒక మార్గం నుంచి పక్కకు తొలగడం లేదా వైదొలగడం. ఇది ముందున్న మార్గ రూపకాన్ని కొనసాగిస్తుంది.
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: సరైనదాన్ని చేశాడు
  rationale: ישר ఇక్కడ నైతికంగా సరైనది లేదా యథార్థమైనది అనే భావంలో ఉంది; సాధారణ ఆధునిక తెలుగులో ‘సరైనదాన్ని’ సహజంగా ఉంటుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టికి
  rationale: ‘కళ్లలో’ అనే యథాతథ రూపం కంటే ‘దృష్టికి’ తెలుగు భాషలో సహజమైన దైవిక మూల్యాంకన నుడికారం; మూల భావాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలో ఉన్న దైవనామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ప్రత్యేక దైవనామాన్ని ‘ప్రభువు’గా భర్తీ చేయకుండా ఉంచాలి. ఆధునిక తెలుగు బైబిలు వాడుకలో సులభంగా గుర్తించబడే రూపం ‘యెహోవా’; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించే ప్రత్యామ్నాయం.
- issue: రాజు ప్రవర్తనపై మూలంలోని మూల్యాంకనం
  choice: యెహోవా దృష్టికి సరైనదాన్ని చేశాడు
  alternative: యెహోవా దృష్టిలో యథార్థమైనది చేశాడు
  rationale: הישר నైతికంగా సరైన ప్రవర్తనను సూచిస్తుంది; అదనపు సిద్ధాంతార్థాన్ని చేర్చకుండా మూలంలోని సాధారణ దైవిక మూల్యాంకనాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. ‘మార్గంలో నడవడం’ అనే హెబ్రీయ ప్రవర్తనా రూపకాన్ని తెలుగులో సహజంగా నిలిపాం.
