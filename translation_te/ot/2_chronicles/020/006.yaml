reference: 2 Chronicles 20:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י אֲבֹתֵ֨י/נוּ֙ הֲ/לֹ֨א אַתָּֽה ה֤וּא אֱלֹהִים֙ בַּ/שָּׁמַ֔יִם וְ/אַתָּ֣ה מוֹשֵׁ֔ל בְּ/כֹ֖ל מַמְלְכ֣וֹת הַ/גּוֹיִ֑ם וּ/בְ/יָדְ/ךָ֙ כֹּ֣חַ וּ/גְבוּרָ֔ה וְ/אֵ֥ין עִמְּ/ךָ֖ לְ/הִתְיַצֵּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/006.yaml
  text: and said[a], “O Yahweh, God of our fathers, are you not God in heaven? And do you not rule over all the kingdoms of the nations? In your hand are power and might[b], and there is none who can stand against you.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “యాహ్వే, మా పితరుల దేవా[a], పరలోకంలో దేవుడవు నీవే కాదా? జాతుల రాజ్యాలన్నిటి మీద ఏలువాడవు నీవే కాదా? శక్తి, పరాక్రమం నీ చేతిలో ఉన్నాయి; నిన్ను ఎదిరించి నిలబడగలవాడు[b] ఎవరూ లేరు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మా పూర్వీకుల దేవా.” హీబ్రూ మూలంలో అక్షరార్థంగా “మా పితరుల దేవుడు” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నిన్ను తట్టుకొని నిలబడగలవాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: అతడు ఇలా అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది. సందర్భంలోని పురుష వక్తను తెలుగులో స్పష్టంగా చూపడానికి ‘అతడు’ చేర్చబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’గా ఇచ్చాం.
- source_word: אֱלֹהֵי אֲבֹתֵינוּ
  choice: మా పితరుల దేవుడు
  rationale: హీబ్రూ పదబంధంలోని పురుష బహువచన రూపాన్నీ, నిబంధన సంబంధిత సంప్రదాయ భావాన్నీ కాపాడుతుంది.
- source_word: הֲלֹא
  choice: నీవే కాదా?
  rationale: అంగీకార సమాధానాన్ని ఆశించే అలంకారప్రశ్న బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֱלֹהִים בַּשָּׁמַיִם
  choice: పరలోకంలో ఉన్న దేవుడు
  rationale: దేవుడు పరలోకాధిపతి అనే భావాన్ని సరళంగా వ్యక్తం చేస్తూ మూలంలోని స్థాన సూచనను కాపాడుతుంది.
- source_word: מוֹשֵׁל
  choice: ఏలుతున్నది
  rationale: ఈ కృదంతం నిరంతర సార్వభౌమ పరిపాలనను సూచిస్తుంది; ‘ఏలు’ ఆధునిక గౌరవప్రద తెలుగులో సహజంగా ఉంది.
- source_word: מַמְלְכוֹת הַגּוֹיִם
  choice: జనాల రాజ్యాలన్నీ
  rationale: מַמְלְכוֹתను ‘రాజ్యాలు’గా, הַגּוֹיִםను విస్తృతార్థంలో ‘జనాలు’గా అనువదించి, כֹל యొక్క సమగ్రతను ‘అన్నీ’తో తెలిపాం.
- source_word: וּבְיָדְךָ
  choice: నీ చేతిలో
  rationale: దేవుని కార్యసాధక అధికారాన్ని సూచించే హీబ్రూ రూపకాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: כֹּחַ וּגְבוּרָה
  choice: శక్తి, పరాక్రమం
  rationale: సామర్థ్యాన్నీ, ప్రబలమైన వీరబలాన్నీ తెలిపే జంటపదాల వాక్చాతుర్యాన్ని కాపాడుతుంది.
- source_word: וְאֵין עִמְּךָ לְהִתְיַצֵּב
  choice: నిన్ను ఎదిరించి నిలబడగలవాడు ఎవడూ లేడు
  rationale: ఈ సందర్భంలో יצב ప్రత్యర్థిగా నిలబడటాన్ని సూచిస్తుంది; తెలుగు రూపం ఆ వ్యతిరేక భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని సాధారణ బిరుదుగా మార్చకుండా పేరుగానే చూపడం మూలంలోని నిబంధనాత్మక ప్రత్యేకతను కాపాడుతుంది.
- issue: אֲבֹתֵינוּలోని లింగనిర్దిష్ట నిబంధన భాష
  choice: మా పితరులు
  alternative: మా పూర్వీకులు
  rationale: హీబ్రూ పదం వ్యాకరణపరంగా పురుష బహువచనం. ప్రధాన పాఠంలో దానిని నిలిపి, విస్తృతమైన సహజ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: రెండవ వాక్యభాగాన్ని ప్రశ్నగా చదవడం
  choice: జనాల రాజ్యాలన్నిటినీ ఏలుతున్నది నీవే కాదా?
  alternative: జనాల రాజ్యాలన్నిటినీ నీవే ఏలుతున్నావు.
  rationale: הֲלֹא మొదటి వాక్యంలో ప్రత్యక్షంగా ఉన్నప్పటికీ, తరువాతి וְאַתָּה מוֹשֵׁלను అదే అలంకారప్రశ్న కొనసాగింపుగా చదవవచ్చు. ప్రార్థనలోని సమాంతర ఉద్ఘాటనను తెలుగులో నిలుపడానికి ప్రశ్నరూపాన్ని ఎంచుకున్నాం; ప్రకటనరూపం కూడా వ్యాకరణపరంగా సాధ్యమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనకు తగిన గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలిని ఉపయోగించాం. దైవసంబోధనలో ఏకవచన ‘నీవు/నీ’ రూపాలు తెలుగు బైబిలు శైలికి అనుగుణంగా ఉన్నాయి. రెండు పాదటిప్పణి సూచికలూ సంబంధిత పదబంధాల వెంట ప్రధాన పాఠంలో ఉంచబడ్డాయి.
