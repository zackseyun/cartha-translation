revisions:
- from: 'అతడు ఇలా అన్నాడు: “మా పితరుల[a] దేవుడవైన యెహోవా, పరలోకంలో ఉన్న దేవుడవు నీవే కాదా? జనాల రాజ్యాలన్నిటినీ ఏలుతున్నది నీవే కాదా? శక్తి, పరాక్రమం నీ చేతిలో ఉన్నాయి; నిన్ను ఎదిరించి నిలబడగలవాడు[b] ఎవడూ లేడు.”'
