  - severity: low
    issue: “జనాల రాజ్యాలు” is imprecise for מַמְלְכוֹת הַגּוֹיִם.
    rationale: The Hebrew refers to the kingdoms of the nations/peoples in a political sense. “జాతుల రాజ్యాలు” is more precise and natural in this context.
  - severity: low
    issue: “ఏలుతున్నది నీవే” uses a neuter-style verbal form for the addressed deity.
    rationale: “ఏలువాడవు నీవే” is smoother Telugu and retains the emphatic personal subject in the Hebrew clause.
