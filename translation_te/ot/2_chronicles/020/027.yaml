id: 2CH.20.27
reference: 2 Chronicles 20:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֠/יָּשֻׁבוּ כָּל אִ֨ישׁ יְהוּדָ֤ה וִֽ/ירוּשָׁלִַ֨ם֙ וִֽ/יהוֹשָׁפָ֣ט בְּ/רֹאשָׁ֔/ם לָ/שׁ֥וּב אֶל יְרוּשָׁלִַ֖ם בְּ/שִׂמְחָ֑ה כִּֽי שִׂמְּחָ֥/ם יְהוָ֖ה מֵֽ/אוֹיְבֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/027.yaml
  text: Then all the men of Judah and Jerusalem returned[a], with Jehoshaphat at their head, to return to Jerusalem with joy[b], because Yahweh had made them rejoice over their enemies.
translation:
  language: te
  text: అప్పుడు యూదా మరియు యెరూషలేము పురుషులందరూ, యెహోషాపాతు వారికి ముందుండగా, సంతోషంగా యెరూషలేముకు తిరిగి వెళ్లడానికి తిరుగు ప్రయాణం చేశారు; ఎందుకంటే యాహ్వే వారి శత్రువులపై వారికి ఆనందం కలిగించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి శత్రువుల కారణంగా వారికి ఆనందం కలిగించాడు”; హీబ్రూ ఉపసర్గ శత్రువులతో సంబంధించి ఆనందానికి కారణం లేదా సందర్భాన్ని కూడా సూచించవచ్చు.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיָּשֻׁבוּ ... לָשׁוּב
  choice: తిరిగి వెళ్లారు
  rationale: ఒకే మూలపదమైన שוב రెండుసార్లు రావడం తిరుగు ప్రయాణాన్ని బలపరుస్తుంది. తెలుగులో రెండుసార్లు ‘తిరిగి’ అనడం కృత్రిమంగా ఉండటంతో, సహజమైన ఒకే క్రియాపదబంధంలో భావాన్ని తెలిపాం.
- source_word: כָּל אִישׁ יְהוּדָה וִירוּשָׁלַם
  choice: యూదా, యెరూషలేములకు చెందిన పురుషులందరూ
  rationale: אִישׁ అనే పురుషవాచక ఏకవచనం ఇక్కడ సమూహాన్ని విడివిడిగా సూచించే ప్రయోగం; ‘పురుషులందరూ’ దాని లింగసూచనను, సమష్టి భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: וִיהוֹשָׁפָט בְּרֹאשָׁם
  choice: యెహోషాపాతు తమకు ముందుండగా
  rationale: ‘వారి తల వద్ద’ అనే అక్షరార్థం ఇక్కడ ముందుండి నడిపించడాన్ని సూచిస్తుంది. ‘ముందుండగా’ నాయకత్వం, ముందరి స్థానం రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּשִׂמְחָה
  choice: సంతోషంగా
  rationale: שִׂמְחָה అనే ఆనందాన్ని సూచించే నామవాచక భావాన్ని ఆధునిక తెలుగులో సహజమైన క్రియావిశేషణ రూపంలో అందిస్తుంది.
- source_word: שִׂמְּחָם יְהוָה מֵאֹיְבֵיהֶם
  choice: యెహోవా వారి శత్రువులపై వారికి ఆనందం కలిగించాడు
  rationale: שׂמח పీయేల్ రూపంలోని కారణార్థాన్ని ‘ఆనందం కలిగించాడు’ నిలుపుతుంది. מן శత్రువుల విషయంలో విజయానందపు ఆధారాన్ని లేదా సందర్భాన్ని సూచించగలదు; ‘శత్రువులపై’ సందర్భానుగుణమైన విజయ భావాన్ని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగులో విస్తృతంగా స్థిరపడిన దైవనామ రూపం ‘యెహోవా’; ఇది మూలంలోని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా, తెలుగు బైబిలు వాడుకలో సుపరిచితమైన నామరూపాన్ని వాడాం; ఉచ్చారణ పునర్నిర్మాణం అనిశ్చితమైనందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: מֵאֹיְבֵיהֶם యొక్క సంబంధ భావం
  choice: వారి శత్రువులపై
  alternative: వారి శత్రువులనుండి / వారి శత్రువుల కారణంగా
  rationale: సందర్భంలో దేవుడు శత్రువులపై విజయాన్ని ఇచ్చినందువల్ల కలిగిన ఆనందమే ప్రధాన భావం. అయినా מן ఉపసర్గకు మూలం లేదా సందర్భం అనే విస్తృత భావం ఉండటంతో ప్రత్యామ్నాయాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని పునరుక్తిని యాంత్రికంగా అనుకరించకుండా తిరుగు ప్రయాణ భావాన్ని సహజంగా తెలిపాం; పురుషవాచక సమూహ సూచనను నిలిపాం.
