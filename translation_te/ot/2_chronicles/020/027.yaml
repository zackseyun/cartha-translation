revisions:
- from: అప్పుడు యూదా, యెరూషలేములకు చెందిన పురుషులందరూ, యెహోషాపాతు తమకు ముందుండగా, సంతోషంగా యెరూషలేముకు తిరిగి వెళ్లారు; ఎందుకంటే యెహోవా[a] వారి శత్రువులపై వారికి ఆనందం కలిగించాడు.[b]
