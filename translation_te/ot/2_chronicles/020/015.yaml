id: 2CH.20.15
reference: 2 Chronicles 20:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הַקְשִׁ֤יבוּ כָל יְהוּדָה֙ וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם וְ/הַ/מֶּ֖לֶךְ יְהוֹשָׁפָ֑ט כֹּֽה אָמַ֨ר יְהוָ֜ה לָ/כֶ֗ם אַ֠תֶּם אַל תִּֽירְא֤וּ וְ/אַל תֵּחַ֨תּוּ֙ מִ/פְּנֵ֨י הֶ/הָמ֤וֹן הָ/רָב֙ הַ/זֶּ֔ה כִּ֣י לֹ֥א לָ/כֶ֛ם הַ/מִּלְחָמָ֖ה כִּ֥י לֵ/אלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/015.yaml
  text: 'And he said[a], “Listen, all Judah and inhabitants of Jerusalem, and King Jehoshaphat: Thus says Yahweh to you, ‘Do not fear, and do not be dismayed because of this great multitude, for the battle is not yours, but God''s.’”'
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “యూదా ప్రజలందరూ, యెరూషలేము నివాసులారా, యెహోషాపాతు రాజా, వినండి. యాహ్వే మీతో ఇలా అంటున్నాడు: ‘ఈ గొప్ప జనసమూహాన్ని చూసి భయపడకండి, అధైర్యపడకండి. ఎందుకంటే యుద్ధం మీది కాదు, దేవునిది[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యుద్ధం మీకు చెందదు; అది దేవునికి చెందుతుంది.”
    reason: హెబ్రీలోని לָכֶם / לֵאלֹהִים నిర్మాణాన్ని స్వామ్యవాచకంగా లేదా ‘చెందడం’ అనే పూర్తి క్రియతో తెలుగులో వ్యక్తం చేయవచ్చు.
lexical_decisions:
- source_word: הַקְשִׁיבוּ
  choice: వినండి
  rationale: బహువచన ఆజ్ఞారూపం శ్రద్ధగా వినమని పిలుస్తుంది; ఆధునిక తెలుగులో ‘వినండి’ సహజంగా ఉండి ఆ ఆజ్ఞ బలాన్ని నిలుపుతుంది.
- source_word: כָל יְהוּדָה
  choice: యూదా వారందరూ
  rationale: ప్రాంతం/ప్రజాసమూహం అనే సమష్టి భావాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: యెరూషలేము నివాసులారా
  rationale: యెరూషలేములో నివసించేవారిని సూచించే కృదంత నిర్మాణాన్ని ప్రత్యక్ష సంబోధనగా సహజంగా అందిస్తుంది.
- source_word: וְהַמֶּלֶךְ יְהוֹשָׁפָט
  choice: యెహోషాపాతు రాజా
  rationale: ప్రజలతోపాటు రాజును కూడా నేరుగా సంబోధిస్తున్న హెబ్రీ నిర్మాణాన్ని తెలుగు సంబోధన రూపంలో నిలుపుతుంది.
- source_word: כֹּה אָמַר יְהוָה
  choice: యాహ్వే మీతో ఇలా అంటున్నాడు
  rationale: ప్రవక్తీయ సందేశ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తూ, దైవనామాన్ని ‘యాహ్వే’గా నిలుపుతుంది.
- source_word: אַל תִּירְאוּ
  choice: భయపడకండి
  rationale: ירא క్రియలోని నేరమైన నిషేధార్థాన్ని స్పష్టంగా, గౌరవ బహువచనంలో వ్యక్తం చేస్తుంది.
- source_word: וְאַל תֵּחַתּוּ
  choice: అధైర్యపడకండి
  rationale: חתת ఇక్కడ భయంతో కుంగిపోవడం లేదా ధైర్యం కోల్పోవడం అనే భావాన్ని ఇస్తుంది; ముందున్న ‘భయపడకండి’తో కలపకుండా రెండవ ప్రత్యేక నిషేధంగా ఉంచబడింది.
- source_word: מִפְּנֵי הֶהָמוֹן הָרָב הַזֶּה
  choice: ఈ విస్తారమైన జనసమూహాన్ని చూసి
  rationale: ముందున్న భారీ సమూహం కారణంగా భయపడవద్దనే సందర్భార్థాన్ని సహజంగా అందిస్తుంది; దానిని తప్పనిసరిగా ‘సైన్యం’గా నిర్దిష్టం చేయకుండా הָמוֹן యొక్క విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: כִּי לֹא לָכֶם הַמִּלְחָמָה כִּי לֵאלֹהִים
  choice: ఎందుకంటే యుద్ధం మీది కాదు, దేవునిది
  rationale: హెబ్రీలోని సమాంతర స్వామ్య నిర్మాణాన్ని సంక్షిప్తంగా, సహజంగా నిలిపి, యుద్ధం యూదావారికి కాక దేవునికి చెందుతుందనే వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో చతురక్షర దైవనామం నేరుగా ఉంది; దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ‘యాహ్వే’గా లిప్యంతరీకరించడం వ్యక్తినామ స్వభావాన్ని కాపాడుతుంది.
- issue: యుద్ధం ఎవరిది అనే స్వామ్య ప్రకటన
  choice: యుద్ధం మీది కాదు, దేవునిది
  alternative: యుద్ధం మీకు చెందదు; దేవునికి చెందుతుంది
  rationale: మూలంలోని సంక్షిప్త విరుద్ధ సమాంతరతను నిలుపుతుంది; ఈ సందర్భానికి మించిన విస్తృత సిద్ధాంత నిర్ణయాన్ని చేర్చకుండా యుద్ధంపై దేవుని అధికారం, బాధ్యతను వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రవక్తీయ శైలి ఉపయోగించబడింది. ప్రజలకూ రాజుకూ ఉన్న ప్రత్యక్ష సంబోధనను సంబోధన విభక్తితో స్పష్టం చేశాం. రెండు నిషేధాలను విడివిడిగా ఉంచి హెబ్రీ వావ్ యొక్క సంకలిత బలాన్ని కాపాడాం.
