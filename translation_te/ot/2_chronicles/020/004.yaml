source:
  edition: WLC
  text: וַ/יִּקָּבְצ֣וּ יְהוּדָ֔ה לְ/בַקֵּ֖שׁ מֵֽ/יְהוָ֑ה גַּ֚ם מִ/כָּל עָרֵ֣י יְהוּדָ֔ה בָּ֖אוּ לְ/בַקֵּ֥שׁ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/004.yaml
  text: And Judah gathered together to seek Yahweh[b][a]; they even came from all the cities of Judah to seek Yahweh.
translation:
  language: te
  text: యెహోవా నుండి సహాయం కోరడానికి యూదా ప్రజలు సమకూడారు[a]; యెహోవాను వెదకడానికి యూదా పట్టణాలన్నిటి నుంచీ కూడా ప్రజలు వచ్చారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “యెహోవా నుండి వెదకడానికి.” ఏమి వెదికిందో హీబ్రూ వాక్యంలో స్పష్టంగా చెప్పబడలేదు; సందర్భంలో సహాయం లేదా విడుదల అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: 'ఇక్కడ హీబ్రూ నిర్మాణం మొదటి వాక్యభాగంలోని నిర్మాణానికి కొద్దిగా భిన్నంగా ఉంది: ఇక్కడ యెహోవాయే ‘వెదకడం’ అనే క్రియకు ప్రత్యక్ష కర్మ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ יְהוּדָה
  choice: యూదా ప్రజలు సమకూడారు
  rationale: నిఫాల్ క్రియ సమకూడడాన్ని సూచిస్తుంది. యూదా ఇక్కడ ప్రాంతం మాత్రమే కాక దాని ప్రజలను సమష్టిగా సూచిస్తున్నందున తెలుగులో ‘ప్రజలు’ అని స్పష్టం చేయడం సహజం.
- source_word: לְבַקֵּשׁ מֵיְהוָה
  choice: యెహోవా దగ్గర సహాయం వెదకడానికి
  rationale: בקשׁ + מן నిర్మాణంలో యెహోవా నుండి కోరబడేది వాక్యంలో ప్రత్యక్షంగా చెప్పబడలేదు; సందర్భంలో సహాయం లేదా విడుదల భావం ఉంది. ‘సహాయం’ భావాన్ని పాఠ్యంలో స్పష్టం చేసినందుకు ప్రత్యక్షార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు వాడుకలో దైవనామానికి స్థిరంగా, గౌరవప్రదంగా, సాధారణ పాఠకులకు పరిచితంగా ఉన్న రూపం.
- source_word: גַּם מִכָּל עָרֵי יְהוּדָה
  choice: యూదా పట్టణాలన్నిటి నుంచీ కూడా
  rationale: גם యొక్క అదనపు/ఉద్ఘాటన భావాన్ని ‘కూడా’ నిలుపుతుంది; כל ערי పాల్గొనుట యొక్క విస్తృతిని తెలియజేస్తుంది.
- source_word: בָּאוּ לְבַקֵּשׁ אֶת יְהוָה
  choice: యెహోవాను వెదకడానికి ... ప్రజలు వచ్చారు
  rationale: రెండో వాక్యభాగంలో את ప్రత్యక్ష కర్మ సూచికతో యెహోవాయే వెదకబడే ప్రత్యక్ష కర్మ. మొదటి నిర్మాణంతో ఉన్న తేడాను తెలుగు అనువాదం నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ఉంచుతూ, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపాన్ని ఎంచుకున్నాం.
- issue: రెండు בקשׁ నిర్మాణాలను ఒకే విధంగా చేయాలా
  choice: మొదట ‘యెహోవా దగ్గర సహాయం వెదకడానికి,’ తరువాత ‘యెహోవాను వెదకడానికి’
  alternative: రెండింటినీ ‘యెహోవాను వెదకడానికి’ అని అనువదించడం
  rationale: మొదటిది מן తో, రెండోది את తో నిర్మించబడిన మూలభాషా తేడాను నిలుపుతూ, మొదటి వాక్యభాగంలోని అంతర్లీన సహాయార్థాన్ని సందర్భానుసారంగా వెల్లడిస్తుంది; అయినా దానిని ఏకైక సాధ్యార్థంగా చూపకుండా పాదసూచికలో ప్రత్యక్ష రూపాన్ని ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘యూదా’ అనే సమష్టి నామానికి ‘ప్రజలు’ జోడించడం ద్వారా తెలుగు పాఠకునికి కర్త స్పష్టమవుతుంది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
