translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘భాగస్వామి అయ్యాడు’ వాణిజ్య సహకార భావాన్ని స్పష్టంగా ఇస్తుంది. మూలంలోని ‘చేయు’కు యాంత్రిక అనువాదం కాకుండా, ఓడల సందర్భానికి సహజమైన ‘నిర్మించు’ ఎంచుకోబడింది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
