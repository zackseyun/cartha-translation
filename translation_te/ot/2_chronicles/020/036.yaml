  text: So he allied himself with him to make ships to go to Tarshish[b][a], and they made ships at Ezion-geber.
translation:
  language: te
  text: అతడు తర్షీషుకు వెళ్లడానికి ఓడలను నిర్మించేందుకు అతనితో భాగస్వామ్యం చేసుకున్నాడు.[a][b] వారు ఎజ్యోను-గెబెరులో ఓడలను నిర్మించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతనితో జతకట్టాడు’ లేదా ‘అతనితో కలిసి పనిచేయడానికి ఒప్పందం చేసుకున్నాడు.’ హీబ్రూ క్రియ ఒక సంబంధం లేదా భాగస్వామ్యంలో చేరడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తర్షీషుకు ప్రయాణించడానికి.’ నౌకాయాన సందర్భాల్లో తర్షీషు అనే పదాన్ని కొందరు ప్రత్యేక రకమైన ఓడలకు సంబంధించిన ప్రయోగంగా అర్థం చేసుకుంటారు; అయితే ఇక్కడి హీబ్రూ వాక్యనిర్మాణం సహజంగా తర్షీషును గమ్యస్థానంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבְּרֵהוּ עִמּוֹ
  choice: అతనితో భాగస్వామి అయ్యాడు
  rationale: హిఫిల్ రూపంలోని חבר ఇక్కడ కేవలం కలవడాన్ని కాక, వాణిజ్య లేదా రాజకీయ సహకారంలో చేరడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘భాగస్వామి అయ్యాడు’ ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לַעֲשׂוֹת / וַיַּעֲשׂוּ
  choice: నిర్మించడానికి / నిర్మించారు
  rationale: עשה ప్రాథమికంగా ‘చేయు/తయారుచేయు’ అయినా, ఓడల సందర్భంలో ‘నిర్మించు’ అనేది సహజమైన, స్పష్టమైన తెలుగు ప్రయోగం; రెండు చోట్లనూ క్రియాసంబంధాన్ని నిలిపింది.
- source_word: אֳנִיּוֹת
  choice: ఓడలు
  rationale: ఈ నామవాచకం సముద్రయానానికి ఉపయోగించే పెద్ద నౌకలను సూచిస్తుంది; సాధారణ ఆధునిక తెలుగులో ‘ఓడలు’ సరైన పదం.
- source_word: לָלֶכֶת תַּרְשִׁישׁ
  choice: తర్షీషుకు వెళ్లే
  rationale: הלך అనే ధాతువు, దాని వెంట వచ్చిన స్థలనామం ఇక్కడ గమ్యాన్ని అత్యంత సహజంగా సూచిస్తాయి. ‘వెళ్లే’ మూలంలోని సాధారణ చలన భావాన్ని కాపాడుతుంది.
- source_word: תַּרְשִׁישׁ
  choice: తర్షీషు
  rationale: స్థలనామాన్ని తెలుగు లిపిలో మూల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: ఎస్యం-గెబెరులో
  rationale: בְּ ఇక్కడ ఓడలు నిర్మించిన స్థలాన్ని సూచిస్తుంది; తెలుగులో ‘-లో’ సహజమైన స్థల విభక్తి. స్థలనామం తెలుగు లిపిలో లిప్యంతరీకరించబడింది.
