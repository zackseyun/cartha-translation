base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/003.yaml
  text: And Jehoshaphat was afraid[a], and set his face to seek Yahweh[b], and proclaimed a fast throughout all Judah.
translation:
  language: te
  text: యెహోషాపాతు భయపడ్డాడు[a]. అతడు యహ్వేను వెదకాలని దృఢంగా నిశ్చయించుకొని[b], యూదా దేశమంతటా ఉపవాసం ప్రకటించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతనికి భయం కలిగింది.’ కథన క్రమంలో హీబ్రూ క్రియ భయం మొదలైనట్లు సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థంగా ‘తన ముఖాన్ని ఉంచాడు’; ఇది దృఢ సంకల్పాన్ని లేదా ఉద్దేశపూర్వక నిర్ణయాన్ని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: భయపడ్డాడు
  rationale: ירא ఇక్కడ ఎదురైన ముప్పుకు యెహోషాపాతు చూపిన సహజ భయాన్ని సూచిస్తుంది. కథన క్రమంలో ‘భయం కలిగింది’ అనే ఆరంభ భావం కూడా సాధ్యమే; దాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וַיִּתֵּן ... אֶת־פָּנָיו
  choice: దృఢంగా నిశ్చయించుకొని
  rationale: అక్షరార్థంగా ‘తన ముఖాన్ని ఉంచాడు’ అనే హీబ్రూ నుడికారం ఉద్దేశపూర్వకమైన దృఢ నిర్ణయాన్ని తెలియజేస్తుంది. తెలుగులో సహజంగా అర్థమయ్యేలా దాని భావాన్ని అనువదించాం.
- source_word: לִדְרוֹשׁ
  choice: వెదకాలని
  rationale: דרש దేవుని సంబంధంగా వాడినప్పుడు సహాయం లేదా మార్గదర్శకత్వం కోసం ఆయనవైపు తిరిగి ఆయనను వెదకడం అనే విస్తృత భావాన్ని ఇస్తుంది.
- source_word: לַיהוָה
  choice: యహ్వేను
  rationale: మూలంలో ఉన్న ఒడంబడిక నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా లిప్యంతరీకరించాం.
- source_word: וַיִּקְרָא צוֹם
  choice: ఉపవాసం ప్రకటించాడు
  rationale: ఈ పదబంధం ప్రజలందరికీ వర్తించే ఉపవాసాన్ని అధికారికంగా ప్రకటించడాన్ని సూచిస్తుంది.
- source_word: עַל כָּל יְהוּדָה
  choice: యూదా దేశమంతటా
  rationale: עַל ఇక్కడ ప్రకటన వ్యాపించిన పరిధిని సూచిస్తుంది; ‘దేశమంతటా’ అనేది యూదా ప్రజలు/ప్రాంతమంతటినీ సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: వచనంలో బిరుదు కాకుండా టెట్రాగ్రామటన్ ప్రత్యక్షంగా ఉంది. ఒడంబడిక నామాన్ని నిలుపుతూ ఆధునికంగా ఆమోదయోగ్యమైన ‘యహ్వే’ రూపాన్ని వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. హీబ్రూ నుడికారాన్ని ప్రధాన వాక్యంలో సహజ భావానువాదంగా ఇచ్చి, మూల చిత్రాన్ని పాదటిప్పణిలో భద్రపరిచాం.
