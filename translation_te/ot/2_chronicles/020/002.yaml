id: 2CH.20.2
reference: 2 Chronicles 20:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֗אוּ וַ/יַּגִּ֤ידוּ לִֽ/יהוֹשָׁפָט֙ לֵ/אמֹ֔ר בָּ֣א עָלֶ֜י/ךָ הָמ֥וֹן רָ֛ב מֵ/עֵ֥בֶר לַ/יָּ֖ם מֵ/אֲרָ֑ם וְ/הִנָּ/ם֙ בְּ/חַֽצְצ֣וֹן תָּמָ֔ר הִ֖יא עֵ֥ין גֶּֽדִי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/002.yaml
  text: Then they came and reported to Jehoshaphat[a], saying, “A great multitude is coming against you from beyond the sea, from Aram; and behold, they are in Hazazon-tamar” (that is[b], En-gedi).
translation:
  language: te
  text: 'అప్పుడు వచ్చి యెహోషాపాతుకు ఇలా తెలియజేశారు: “సముద్రం అవతలి వైపు నుండి, అరాము నుండి, ఒక గొప్ప జనసమూహం నీకు వ్యతిరేకంగా వస్తోంది. ఇదిగో, వారు హజజోను-తామారులో ఉన్నారు; అదే ఏన్-గెదీ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ וַיַּגִּידוּ
  choice: అప్పుడు కొందరు వచ్చి ... తెలియజేశారు
  rationale: హీబ్రూ వరుస కథన క్రియల భావాన్ని సహజమైన తెలుగు కథనశైలిలో చూపిస్తుంది. కర్త స్పష్టంగా పేర్కొనబడకపోవడంతో ‘కొందరు’ అని అనిర్దిష్టంగా ఉంచబడింది.
- source_word: בָּא עָלֶיךָ
  choice: నీ మీదికి వస్తోంది
  rationale: సైనిక ముప్పు సందర్భంలోని విరోధ దిశను ‘మీదికి’ సహజంగా తెలియజేస్తుంది; qatal రూపం ఇక్కడ సమీపిస్తున్న చర్యను నివేదిస్తోంది.
- source_word: הָמוֹן רָב
  choice: గొప్ప జనసమూహం
  rationale: సందర్భంలో సైనిక బలం సూచితమైనా, మూలపదం విస్తృతంగా పెద్ద సమూహాన్ని సూచిస్తుంది; ‘సైన్యం’ అని అతిగా నిర్దిష్టపరచలేదు.
- source_word: מֵעֵבֶר לַיָּם
  choice: సముద్రానికి అవతలి వైపు నుండి
  rationale: స్థలసంబంధమైన ‘సముద్రం అవతల నుండి’ అనే మూలభావాన్ని స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מֵאֲרָם
  choice: అరాము నుండి
  rationale: తరువాతి కాలపు ‘సిరియా’ అనే పేరుకు బదులుగా హీబ్రూ స్థలనామాన్ని నేరుగా లిప్యంతరీకరించింది.
- source_word: וְהִנָּם
  choice: ఇదిగో, వారు
  rationale: వార్తలోని తక్షణత్వాన్ని, శ్రద్ధ ఆకర్షించే హీబ్రూ సూచక పద బలాన్ని నిలుపుతుంది.
- source_word: בְּחַצְצוֹן תָּמָר
  choice: హజజోను-తామారులో
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, ב అనే స్థానవాచక విభక్తిని ‘లో’తో వ్యక్తం చేసింది.
- source_word: הִיא עֵין גֶּדִי
  choice: అదే ఏన్గెదీ
  rationale: హజజోను-తామారు అనే స్థలాన్ని ఏన్గెదీతో గుర్తించే వివరణాత్మక సమానార్థక వాక్యాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
