translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన కథనశైలి. మూలంలోని స్థలనామాలు ప్రత్యక్షంగా లిప్యంతరీకరించబడ్డాయి. అందించిన English POB పాదసూచికలు వాటి గుర్తులతో ప్రధాన పాఠానికి సరిపోలకపోవడంతో, మూల హీబ్రూ ఆధారంగా అవసరం లేని పాదసూచికలు చేర్చలేదు.
