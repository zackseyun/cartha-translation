id: 2CH.20.23
reference: 2 Chronicles 20:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֠/יַּֽעַמְדוּ בְּנֵ֨י עַמּ֧וֹן וּ/מוֹאָ֛ב עַל יֹשְׁבֵ֥י הַר שֵׂעִ֖יר לְ/הַחֲרִ֣ים וּ/לְ/הַשְׁמִ֑יד וּ/כְ/כַלּוֹתָ/ם֙ בְּ/יוֹשְׁבֵ֣י שֵׂעִ֔יר עָזְר֥וּ אִישׁ בְּ/רֵעֵ֖/הוּ לְ/מַשְׁחִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/023.yaml
  text: Then the Ammonites and Moabites rose up against the inhabitants of Mount Seir to devote them to destruction and to wipe them out; and when they had finished with the inhabitants of Seir[a], they helped each other to destroy one another.
translation:
  language: te
  text: అప్పుడు అమ్మోనీయులు, మోయాబీయులు శేయీరు పర్వత నివాసులను సంపూర్ణ నాశనానికి అంకితం చేయడానికి[a], వారిని నిర్మూలించడానికి వారిపై దాడికి లేచారు. శేయీరు నివాసులను అంతం చేసిన తర్వాత, ఒకరినొకరు నాశనం చేసుకోవడానికి వారు పరస్పరం సహాయం చేసుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో పదశః, ‘నిషేధానికి గురిచేయడం’; అంటే, సంపూర్ణ నాశనానికి అంకితం చేయడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: మీదికి లేచి
  rationale: עמד అనే క్రియకు మూలార్థం ‘నిలబడు’; అయితే על తో కూడిన ఈ యుద్ధ సందర్భంలో అది శత్రుత్వంతో ఎదిరించడం లేదా దాడికి లేవడం అనే భావాన్ని ఇస్తుంది. ‘మీదికి లేచి’ ఆ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְּנֵי עַמּוֹן וּמוֹאָב
  choice: అమ్మోనీయులు, మోయాబీయులు
  rationale: ‘అమ్మోను కుమారులు, మోయాబు’ అనే పదశః రూపం కన్నా, ఇక్కడ ఉద్దేశించిన రెండు జనసమూహాలను ఆధునిక తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: יֹשְׁבֵי הַר שֵׂעִיר
  choice: శేయీరు పర్వత నివాసులు
  rationale: יֹשְׁבֵי అనేది ‘నివసించేవారు/నివాసులు’ అనే నామవాచకార్థక కృదంతం; הַר שֵׂעִיר అనే స్థలనామాన్ని ‘శేయీరు పర్వతం’గా ఉంచాం.
- source_word: לְהַחֲרִים
  choice: నాశనానికి అంకితం చేసి
  rationale: חרם హిఫీల్ రూపం సాధారణంగా చంపడం మాత్రమే కాక, దేనినైనా నిషిద్ధంగా ఉంచి సంపూర్ణ నాశనానికి అప్పగించడం అనే ఆరాధనాత్మక-యుద్ధ భావాన్ని కలిగిస్తుంది. ‘నాశనానికి అంకితం చేసి’ ఆ ప్రత్యేక బరువును కాపాడుతుంది.
- source_word: וּלְהַשְׁמִיד
  choice: పూర్తిగా నిర్మూలించారు
  rationale: שׁמד సంపూర్ణ వినాశనాన్ని సూచిస్తుంది. ముందున్న חרם పదబంధాన్ని పునరావృతం చేయకుండా, దాని తీవ్రమైన ఫలితాన్ని ‘పూర్తిగా నిర్మూలించారు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וּכְכַלּוֹתָם
  choice: అంతం చేసిన తరువాత
  rationale: כ తో ఉన్న infinitive construct ఇక్కడ కాలసంబంధంగా ‘వారు ముగించినప్పుడు/ముగించిన తరువాత’ అని అర్థం. కథన క్రమానికి ‘తరువాత’ సహజంగా సరిపోతుంది.
- source_word: עָזְרוּ אִישׁ בְּרֵעֵהוּ
  choice: పరస్పరం సహాయం చేసుకున్నారు
  rationale: పదశః ‘ఒకడు తన సహచరునికి సహాయం చేశాడు’ అనే పంపిణీ ప్రయోగం పరస్పర చర్యను తెలియజేస్తుంది. ‘పరస్పరం సహాయం చేసుకున్నారు’ ఆ వ్యంగ్యభరితమైన reciprocal భావాన్ని నిలుపుతుంది.
- source_word: לְמַשְׁחִית
  choice: ఒకరినొకరు నాశనం చేసుకోవడానికి
  rationale: עזר తరువాతి infinitive వారి పరస్పర సహాయం యొక్క ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది. సందర్భం అంతర్గత పోరాటాన్ని స్పష్టం చేస్తున్నందున, తెలుగులో అవసరమైన పరస్పర కర్మను వ్యక్తంగా పేర్కొన్నాం.
theological_decisions:
- issue: యుద్ధ సందర్భంలో חרם పదానికి అనువాదం
  choice: నాశనానికి అంకితం చేసి
  alternative: నిషేధానికి గురిచేసి; పూర్తిగా నాశనం చేసి
  rationale: ఈ పదం సాధారణ విధ్వంసం కంటే ఎక్కువగా, నిషిద్ధంగా చేసి సంపూర్ణ నాశనానికి అప్పగించే ఆరాధనాత్మక-యుద్ధ భావాన్ని కలిగి ఉంది. ప్రధాన పాఠంలో ఆ భావబరువును కాపాడి, మరింత పదశః ప్రత్యామ్నాయాన్ని పాదసూచికలో వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం వాడుతూ, חרם పదంలోని ప్రత్యేక ఆరాధనాత్మక-యుద్ధ భావాన్ని సరళీకరించకుండా నిలుపుకున్నాం. ‘శేయీరు’ అనే స్థలనామం గౌరవప్రదమైన బైబిలు శైలిలో లిప్యంతరీకరించబడింది.
