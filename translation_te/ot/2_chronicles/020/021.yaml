source:
  edition: WLC
  text: וַ/יִּוָּעַץ֙ אֶל הָ/עָ֔ם וַ/יַּעֲמֵ֤ד מְשֹֽׁרֲרִים֙ לַ/יהוָ֔ה וּֽ/מְהַֽלְלִ֖ים לְ/הַדְרַת קֹ֑דֶשׁ בְּ/צֵאת֙ לִ/פְנֵ֣י הֶֽ/חָל֔וּץ וְ/אֹֽמְרִים֙ הוֹד֣וּ לַ/יהוָ֔ה כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/021.yaml
  text: After consulting with the people[a], he appointed singers to Yahweh, who praised the splendor of holiness as they went out before the vanguard, saying, “Give thanks to Yahweh[c][b], for his steadfast love endures forever.”
translation:
  language: te
  text: 'ప్రజలతో సంప్రదించిన తరువాత, అతడు యహ్వేకు గాయకులను నియమించాడు. వారు అగ్రదళం ముందు[b] బయలుదేరుతూ పరిశుద్ధత వైభవాన్ని[a] స్తుతిస్తూ ఇలా అన్నారు: “యహ్వేకు కృతజ్ఞతలు చెల్లించండి; ఎందుకంటే ఆయన స్థిరమైన ప్రేమ[c] శాశ్వతంగా ఉంటుంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పరిశుద్ధత యొక్క అందాన్ని,” “పరిశుద్ధ వైభవాన్ని.” ఈ హీబ్రూ పదబంధం పరిశుద్ధతతో కూడిన ఆరాధనా వైభవాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ముందుకు వెళ్లే సాయుధ దళం ముందు,” “అగ్రశ్రేణి దళం ముందు.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “ఆయన కరుణ శాశ్వతంగా ఉంటుంది.” חֶסֶד అనే హీబ్రూ పదంలో స్థిరమైన ప్రేమ, కరుణ, నిబంధనపట్ల నిబద్ధత అనే భావాలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ אֶל־הָעָם
  choice: ప్రజలతో సంప్రదించిన తరువాత
  rationale: יעץ నిఫాల్ రూపం ప్రజలను సంప్రదించడం లేదా వారితో ఆలోచన చేయడం అనే భావాన్ని ఇస్తుంది; తరువాతి చర్యతో ఉన్న క్రమాన్ని సహజమైన తెలుగులో చూపిస్తుంది.
- source_word: וַיַּעֲמֵד
  choice: నియమించాడు
  rationale: హిఫీల్ రూపానికి నిలబెట్టాడు, ఉంచాడు, నియమించాడు అనే భావాలు ఉన్నాయి. ఇక్కడ గాయకులకు బాధ్యత అప్పగించడాన్ని ‘నియమించాడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: מְשֹׁרֲרִים לַיהוָה
  choice: యహ్వేకు గాయకులను
  rationale: מְשֹׁרֲרִים ప్రత్యేకంగా గాయకులను సూచిస్తుంది; לַיהוָה వారి గానం యహ్వేకు ఉద్దేశించబడిందని తెలియజేస్తుంది.
- source_word: לְהַדְרַת קֹדֶשׁ
  choice: పరిశుద్ధత యొక్క వైభవాన్ని
  rationale: హీబ్రూ పదబంధంలోని ‘వైభవం/అందం’ మరియు ‘పరిశుద్ధత’ రెండింటినీ నిలుపుతూ, దాని నిజమైన భావసందిగ్ధతను పాదసూచికలో చూపిస్తుంది.
- source_word: לִפְנֵי הֶחָלוּץ
  choice: ముందరి యుద్ధదళానికి ముందు
  rationale: הֶחָלוּץ మొత్తం సైన్యంకన్నా ముందుగా వెళ్లే సాయుధ లేదా అగ్రదళాన్ని సూచిస్తుంది. ‘ముందరి యుద్ధదళం’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: הוֹדוּ לַיהוָה
  choice: యహ్వేకు కృతజ్ఞతలు చెల్లించండి
  rationale: ఆరాధనా సందర్భంలో ידה హిఫీల్ కృతజ్ఞతలు చెప్పడం లేదా స్తుతించడం అనే భావాన్ని ఇస్తుంది; తరువాత వచ్చే కారణవాక్యానికి ‘కృతజ్ఞతలు చెల్లించండి’ చక్కగా సరిపోతుంది.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: ఎందుకంటే ఆయన స్థిరమైన ప్రేమ శాశ్వతంగా ఉంటుంది
  rationale: חֶסֶד లో ప్రేమ, విశ్వసనీయత, కరుణ, నిబంధనపట్ల నిబద్ధత అనే భావాలు కలిసివున్నాయి. ‘స్థిరమైన ప్రేమ’ ప్రధాన భావాన్ని సహజంగా అందిస్తుంది; క్రియలేని హీబ్రూ వాక్యాన్ని తెలుగులో పూర్తిచేయడానికి ‘ఉంటుంది’ చేర్చబడింది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ఉన్న దేవుని ప్రత్యేక నిబంధన నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ ‘యహ్వే’గా ఇచ్చాం.
- issue: חֶסֶד యొక్క బహుళార్థ స్వభావం
  choice: స్థిరమైన ప్రేమ
  alternative: కరుణ; నిబంధనపట్ల నిబద్ధమైన ప్రేమ
  rationale: ఒకే సిద్ధాంతపరమైన నిర్వచనానికి పరిమితం చేయకుండా ప్రేమ మరియు స్థిరత్వం రెండింటినీ ప్రధాన పాఠంలో నిలిపి, కరుణ మరియు నిబంధన నిబద్ధత భావాలను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా చర్యల వరుసను స్పష్టంగా చేశాం; అయితే ‘పరిశుద్ధత యొక్క వైభవం’ మరియు חֶסֶד లోని భావసందిగ్ధతను పాదసూచికల ద్వారా నిలిపాం.
