id: 2CH.20.28
reference: 2 Chronicles 20:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ יְר֣וּשָׁלִַ֔ם בִּ/נְבָלִ֥ים וּ/בְ/כִנֹּר֖וֹת וּ/בַ/חֲצֹצְר֑וֹת אֶל בֵּ֖ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/028.yaml
  text: And they came to Jerusalem with harps and lyres and trumpets[b][a], to the house of Yahweh.
translation:
  language: te
  text: వారు తంతివాద్యాలు[a], లైర్లు, బాకాలతో యెరూషలేముకు వచ్చి, యాహ్వే గృహానికి చేరుకున్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తంతివాద్యాలు’గా అనువదించిన ప్రాచీన వాద్యం ఖచ్చితంగా ఏ రూపంలో ఉండేదో తెలియదు; అది హార్పు లేదా లూట్ వంటి వాద్యమై ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘యాహ్వే మందిరానికి’; అక్షరార్థం, ‘యాహ్వే గృహానికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: వచ్చి ... చేరుకున్నారు
  rationale: בוא అనే ఒకే కదలిక క్రియకు గమ్యస్థానాన్ని తెలిపే రెండు אֶל పదబంధాలు అనుసంధానమై ఉన్నాయి. సహజమైన తెలుగులో పునరుక్తి లేకుండా క్రమాన్ని స్పష్టంగా చూపేందుకు ‘వచ్చి ... చేరుకున్నారు’ అని వ్యక్తీకరించాం.
- source_word: יְרוּשָׁלִַם
  choice: యెరూషలేముకు
  rationale: స్థలనామానికి ప్రామాణిక తెలుగు రూపాన్ని వాడి, గమనార్థక సందర్భానికి అనుగుణంగా ‘-కు’ విభక్తిని చేర్చాం.
- source_word: בִּנְבָלִים
  choice: వీణలు
  rationale: נֵבֶל ఒక ప్రాచీన తంతివాద్యాన్ని సూచిస్తుంది; దాని ఖచ్చితమైన నిర్మాణం నిర్ధారించడం కష్టం. సులభంగా అర్థమయ్యే సంప్రదాయ తెలుగు వాద్యపదాన్ని ప్రధాన పాఠంలో ఉంచి, అనిశ్చితిని పాదసూచికలో తెలిపాం.
- source_word: וּבְכִנֹּרוֹת
  choice: కిన్నెరలు
  rationale: כִּנּוֹר సూచించే లైర్-రకం తంతివాద్యాన్ని נֵבֶל నుండి వేరుగా నిలుపుతూ, దానికి దగ్గరైన తెలుగు వాద్యపదం ‘కిన్నెరలు’ ఎంచుకున్నాం.
- source_word: וּבַחֲצֹצְרוֹת
  choice: బాకాలు
  rationale: חֲצֹצְרָה ఆరాధనలో ఉపయోగించే బాకా/తూర్యాన్ని సూచిస్తుంది. మూలంలో ఈ వచనంలో ‘వెండి’ లేదు కాబట్టి దాన్ని జోడించలేదు.
- source_word: בִּנְבָלִים וּבְכִנֹּרוֹת וּבַחֲצֹצְרוֹת
  choice: వీణలు, కిన్నెరలు, బాకాలు వాయిస్తూ
  rationale: వాద్యాలతో ప్రయాణించడమే కాక సంగీతంతో రావడం సందర్భంలో అంతర్భావంగా ఉంది. తెలుగులో సహజత్వం కోసం ‘వాయిస్తూ’ చేర్చాం; ఇది సాధనార్థక בְ నిర్మాణం యొక్క సందర్భోచిత విప్పు.
- source_word: אֶל בֵּית יְהוָה
  choice: యెహోవా మందిరానికి
  rationale: בֵּית יְהוָה అక్షరార్థంగా ‘యెహోవా గృహం’; ఈ చారిత్రక సందర్భంలో అది దేవాలయాన్ని సూచిస్తుంది. సాధారణ పాఠకునికి సహజమైన ‘మందిరం’ ప్రధాన పాఠంలో ఉంచి, అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన వ్యక్తినామ రూపం ‘యెహోవా’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని వాడుతోంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా పేరుగా నిలిపాం; ఆధునిక పండితుల పునర్నిర్మాణానికి దగ్గరైన ‘యాహ్వే’ కూడా సాధ్యమే, కానీ తెలుగు సాధారణ వాడుకలో సుపరిచితమైన ‘యెహోవా’ను ఎంచుకున్నాం.
- issue: בֵּית יְהוָה యొక్క వ్యక్తీకరణ
  choice: యెహోవా మందిరం
  alternative: యెహోవా గృహం
  rationale: ‘గృహం’ మూలరూపాన్ని దగ్గరగా నిలుపుతుంది; ‘మందిరం’ ఈ సందర్భంలోని సూచితార్థాన్ని సహజంగా తెలియజేస్తుంది. ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలిని అనుసరించాం. వాద్యాల మధ్య ఉన్న హీబ్రూ పదభేదాన్ని నిలిపాం; ప్రాచీన వాద్యపు గుర్తింపులోని అనిశ్చితిని పాదసూచికలో స్పష్టంగా తెలిపాం.
