source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵ֗ן אֶתְחַבַּר֙ יְהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֔ה עִ֖ם אֲחַזְיָ֣ה מֶֽלֶךְ יִשְׂרָאֵ֑ל ה֖וּא הִרְשִׁ֥יעַ לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/035.yaml
  text: After this[a], Jehoshaphat king of Judah allied himself with Ahaziah king of Israel[b], who acted wickedly in doing so.
translation:
  language: te
  text: ఆ తరువాత యూదా రాజు యెహోషాపాతు ఇశ్రాయేలు రాజు అహజ్యాతో పొత్తు పెట్టుకున్నాడు[a]. అతడు దుర్మార్గంగా ప్రవర్తించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అహజ్యాతో కలిశాడు.”
    reason: lexical_alternative
  - marker: b
    text: “అతడు” అనేది అత్యంత సహజంగా అహజ్యాను సూచిస్తుంది. అయితే ఇది యెహోషాపాతును లేదా అతడు చేసుకున్న పొత్తు సంబంధమైన చర్యను సూచిస్తున్నట్లు కూడా అర్థం చేసుకోవచ్చు. హీబ్రూ వాక్యాన్ని మరింత అక్షరార్థంగా, “అతడు చేయడంలో దుర్మార్గంగా ప్రవర్తించాడు” అని అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: ఆ తరువాత
  rationale: ముందటి సంఘటనల అనంతరం జరిగినదాన్ని సూచించే సహజమైన కాలసంధిగా అనువదించబడింది.
- source_word: אֶתְחַבַּר
  choice: పొత్తు పెట్టుకున్నాడు
  rationale: חבר హిత్పయేల్ రూపం ఇక్కడ కేవలం కలవడాన్ని కాక, ఉద్దేశపూర్వక సహవాసం లేదా మైత్రిని ఏర్పరచుకోవడాన్ని సూచిస్తుంది; రాజుల సందర్భంలో ‘పొత్తు పెట్టుకున్నాడు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: యూదా రాజు యెహోషాపాతు
  rationale: రాజబిరుదు మరియు వ్యక్తినామాన్ని ఆధునిక ప్రామాణిక తెలుగు క్రమంలో స్పష్టంగా అందించింది.
- source_word: עִם אֲחַזְיָה מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు అహజ్యాతో
  rationale: עִם అనే సహవాచక సంబంధాన్ని ‘తో’ ద్వారా నేరుగా తెలిపి, రాజబిరుదును సహజమైన తెలుగు క్రమంలో ఉంచింది.
- source_word: הוּא
  choice: అతడు
  rationale: హీబ్రూ స్వతంత్ర సర్వనామాన్ని అలాగే ఉంచడం ద్వారా దాని సమీప సూచన అహజ్యా వైపు ఉన్నప్పటికీ, వాక్యంలోని నిజమైన సూచనాస్పష్టతను అనవసరంగా తొలగించలేదు.
- source_word: הִרְשִׁיעַ
  choice: దుర్మార్గంగా ప్రవర్తించాడు
  rationale: ఈ హిఫీల్ రూపంలోని నైతిక ప్రతికూలతను ఆధునిక, గౌరవప్రదమైన తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לַעֲשׂוֹת
  choice: తన కార్యాల్లో
  rationale: ‘చేయడానికి/చేయడంలో’ అనే సంక్షిప్త హీబ్రూ నిర్మాణాన్ని, దుర్మార్గం అతని కార్యాచరణలో వ్యక్తమైందనే భావంతో సహజ తెలుగులో అందించింది; నిర్దిష్ట కార్యాన్ని పాఠ్యంలో లేనంతగా పేర్కొనలేదు.
theological_decisions:
- issue: הוּא అనే సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘అతడు’ అని ఉంచి, అత్యంత సహజంగా అహజ్యాను సూచించేలా సందర్భానికే వదిలింది.
  alternative: ఇది యెహోషాపాతును లేదా అతడు చేసుకున్న పొత్తు సంబంధమైన చర్యను సూచిస్తుందని గ్రహించవచ్చు.
  rationale: వ్యాకరణపరంగా అత్యంత సమీప పూర్వపదం అహజ్యా; కథన సందర్భం కూడా అతని దుష్టత్వాన్ని సమర్థిస్తుంది. అయితే హీబ్రూ సర్వనామం పేరును మళ్లీ చెప్పదు కాబట్టి, తెలుగులో పేరును చేర్చి అస్పష్టతను పూర్తిగా తొలగించకుండా పాదటిప్పణిలో ప్రత్యామ్నాయాన్ని తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ‘పొత్తు పెట్టుకున్నాడు’ రాజకీయ-సహకార భావాన్ని సహజంగా తెలియజేస్తుంది; ‘అతడు’ అనే రూపం మూలంలోని సూచనాస్పష్టతను నిలుపుతుంది.
