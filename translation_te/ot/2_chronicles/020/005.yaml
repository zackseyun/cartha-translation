  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד יְהוֹשָׁפָ֗ט בִּ/קְהַ֧ל יְהוּדָ֛ה וִ/ירוּשָׁלִַ֖ם בְּ/בֵ֣ית יְהוָ֑ה לִ/פְנֵ֖י הֶ/חָצֵ֥ר הַ/חֲדָשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/005.yaml
  text: And Jehoshaphat stood in the assembly of Judah and Jerusalem[a], in the house of Yahweh, before the new court.
translation:
  language: te
  text: యెహోషాపాతు యూదా, యెరూషలేముల సభలో, యాహ్వే మందిరంలో కొత్త ప్రాంగణం[a] ఎదుట నిలబడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కొత్త ఆవరణం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: నిలబడ్డాడు
  rationale: עמד ఇక్కడ కథనంలోని సాధారణ భూతకాల చర్యను సూచిస్తుంది. ‘నిలబడ్డాడు’ సహజంగా, సంక్షిప్తంగా ఉంది; ‘తన స్థానం తీసుకున్నాడు’ అనడం అవసరానికి మించిన భావాన్ని జోడిస్తుంది.
- source_word: בִּקְהַל
  choice: సమాజం మధ్య
  rationale: קהל కూడివచ్చిన ప్రజాసమూహాన్ని సూచిస్తుంది. ב అనే ఉపసర్గకు ఇక్కడ ‘మధ్య’ అని అనువదించడం, యెహోషాపాతు ఆ సభలో నిలిచాడనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוּדָה וִירוּשָׁלַם
  choice: యూదా, యెరూషలేముల
  rationale: సమకూరిన ప్రజలు యూదా మరియు యెరూషలేముకు చెందినవారని మూలంలోని సమన్వయ పదబంధాన్ని విస్తరించకుండా నిలుపుతుంది.
- source_word: בְּבֵית יְהוָה
  choice: యాహ్వే మందిరంలో
  rationale: అక్షరార్థంగా ‘యాహ్వే గృహంలో’ అయినప్పటికీ, ఈ సందర్భంలో బַּיִת దేవాలయాన్ని సూచిస్తుంది. ‘మందిరం’ ఆధునిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ తెలుగు లిప్యంతరీకరణ ‘యాహ్వే’గా ఇచ్చాం.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: ఇక్కడ לִפְנֵי స్థల సంబంధాన్ని సూచిస్తుంది. ‘ఎదుట’ సహజమైన, గౌరవప్రదమైన తెలుగు ప్రయోగం.
- source_word: הֶחָצֵר הַחֲדָשָׁה
  choice: కొత్త ప్రాంగణం
  rationale: חָצֵר మందిర సముదాయంలోని తెరచిన ప్రాంగణం లేదా ఆవరణాన్ని సూచిస్తుంది. ‘ప్రాంగణం’ సందర్భానికి స్పష్టంగా సరిపోతుంది; ‘ఆవరణం’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేక నామాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యక్రమాన్ని వాడుతూ, మందిర సందర్భానికి తగిన గౌరవప్రదమైన శైలిని నిలుపుకున్నాం.
