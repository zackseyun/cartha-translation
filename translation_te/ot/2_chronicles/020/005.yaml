revisions:
- from: యెహోషాపాతు యూదా, యెరూషలేముల సమాజం మధ్య, యాహ్వే మందిరంలో కొత్త ప్రాంగణం[a] ఎదుట నిలబడ్డాడు.
  to: యెహోషాపాతు యూదా, యెరూషలేముల సభలో, యాహ్వే మందిరంలో కొత్త ప్రాంగణం[a] ఎదుట నిలబడ్డాడు.
  rationale: ‘సమాజం మధ్య’ను ‘సభలో’గా మార్చి קהל యొక్క కూడివచ్చిన సభ అనే అర్థాన్ని, בְּ యొక్క స్థానార్థక ప్రయోగాన్ని మరింత ప్రత్యక్షంగా మరియు సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేశాం. మిగిలిన పదబంధాలు మూలపాఠానికీ ఆంగ్ల ఆడిట్ నిర్ణయాలకీ అనుగుణంగా ఉన్నాయి.
