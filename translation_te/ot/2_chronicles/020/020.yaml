source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וַ/יֵּצְא֖וּ לְ/מִדְבַּ֣ר תְּק֑וֹעַ וּ/בְ/צֵאתָ֞/ם עָמַ֣ד יְהוֹשָׁפָ֗ט וַ/יֹּ֨אמֶר֙ שְׁמָע֗וּ/נִי יְהוּדָה֙ וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם הַאֲמִ֜ינוּ בַּ/יהוָ֤ה אֱלֹהֵי/כֶם֙ וְ/תֵ֣אָמֵ֔נוּ הַאֲמִ֥ינוּ בִ/נְבִיאָ֖י/ו וְ/הַצְלִֽיחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/020.yaml
  text: 'They rose early in the morning and went out to the wilderness of Tekoa[a]. As they were going out, Jehoshaphat stood and said, “Listen to me, Judah and inhabitants of Jerusalem: believe in Yahweh your God, and you will be established; believe in his prophets[c][b], and you will succeed.”'
translation:
  language: te
  text: 'వారు తెల్లవారుజామునే లేచి తెకోవా అరణ్యానికి బయలుదేరారు. వారు బయలుదేరుతున్నప్పుడు యెహోషాపాతు నిలబడి ఇలా అన్నాడు: “యూదా ప్రజలారా, యెరూషలేము నివాసులారా, నా మాట వినండి! మీ దేవుడైన యహ్వేను[a] నమ్మండి; అప్పుడు మీరు స్థిరంగా నిలుస్తారు.[b] ఆయన ప్రవక్తలను నమ్మండి[c]; అప్పుడు మీరు సఫలమవుతారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యహ్వే’ అనేది హీబ్రూ మూలపాఠంలోని יהוה (YHWH) అనే దేవుని ప్రత్యేక నామం. కొన్ని అనువాద సంప్రదాయాలు దీనిని ‘ప్రభువు’ అని ఇస్తాయి.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూలో ‘నమ్మండి’ మరియు ‘స్థిరంగా నిలుస్తారు’ అనే మాటలు ఒకే אמן పదమూలంతో ఏర్పడి పదక్రీడను కలిగిస్తాయి. భావాన్ని ‘మీ దేవుడైన యహ్వేపై నమ్మకం ఉంచండి; అప్పుడు మీరు దృఢంగా నిలుస్తారు’ అని కూడా చెప్పవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘ఆయన ప్రవక్తలను విశ్వసించండి’ లేదా ‘ఆయన ప్రవక్తలపై నమ్మకం ఉంచండి’ అని కూడా అనువదించవచ్చు. ముందటి ఆజ్ఞలో ఉన్న అదే హీబ్రూ క్రియ ఇక్కడ మళ్లీ వచ్చింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: తెల్లవారుజామునే లేచి
  rationale: హిఫిల్ రూపం ఉదయాన్నే లేవడం లేదా త్వరగా ప్రారంభించడం అనే భావాన్ని ఇస్తుంది. ఈ తెలుగు ప్రయోగం కాలాన్నీ కథన చలనాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: לְמִדְבַּר תְּקוֹעַ
  choice: తెకోవ అరణ్యానికి
  rationale: מִדְבָּר తప్పనిసరిగా ఇసుక ఎడారి కాదు; జనావాసం తక్కువైన అరణ్య లేదా బీడు ప్రాంతాన్ని సూచించగలదు. ‘అరణ్యం’ భౌగోళిక భావాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: וּבְצֵאתָם
  choice: వారు బయలుదేరుతున్నప్పుడు
  rationale: బేత్ ఉపసర్గతో కూడిన క్రియానామ రూపం సమకాలిక కాలసంబంధాన్ని సూచిస్తుంది; వారు ప్రయాణం మొదలుపెడుతున్న సందర్భంలో రాజు మాట్లాడినట్లు ఈ రూపం చూపిస్తుంది.
- source_word: שְׁמָעוּנִי
  choice: నా మాట వినండి
  rationale: శబ్దార్థంగా ‘నన్ను వినండి.’ ఆధునిక తెలుగులో ప్రత్యక్ష విజ్ఞప్తిగా ‘నా మాట వినండి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הַאֲמִינוּ בַּיהוָה אֱלֹהֵיכֶם
  choice: మీ దేవుడైన యహ్వేను నమ్మండి
  rationale: אמן హిఫిల్ రూపం ב ఉపసర్గతో ఇక్కడ విశ్వసించడం లేదా ఆధారపడడం అనే భావాన్ని ఇస్తుంది. ‘నమ్మండి’ తరువాతి ప్రవక్తల గురించిన ఆజ్ఞలోనూ పునరావృతమై మూలంలోని వాక్చాతుర్యాన్ని నిలుపుతుంది.
- source_word: וְתֵאָמֵנוּ
  choice: అప్పుడు మీరు స్థిరంగా నిలుస్తారు
  rationale: אמן నిఫల్ రూపం స్థిరపరచబడడం లేదా దృఢంగా నిలవడం అనే భావాన్ని ఇస్తుంది. ఈ అనువాదం సహజమైన తెలుగులో ఫలితాన్ని తెలియజేస్తూ, ముందున్న ‘నమ్మండి’తో మూలంలోని నమ్మకం–స్థిరత్వం పదబంధాన్ని పాదటిప్పణి ద్వారా సంరక్షిస్తుంది.
- source_word: הַאֲמִינוּ בִנְבִיאָיו
  choice: ఆయన ప్రవక్తలను నమ్మండి
  rationale: మొదటి ఆజ్ఞలోని అదే אמן క్రియ ఇక్కడ పునరావృతమైంది. ‘నమ్మండి’ ఆ పునరుక్తిని నిలుపుతుంది; ‘వారి మాటను విశ్వసించండి’ అని విస్తరించి మూలంలో లేని పదాలను చేర్చలేదు.
- source_word: וְהַצְלִיחוּ
  choice: అప్పుడు మీరు సఫలమవుతారు
  rationale: צלח హిఫిల్ రూపం విజయవంతం కావడం లేదా సఫలత పొందడం అని అర్థం. యుద్ధ సందర్భానికి మాత్రమే పరిమితం చేయకుండా మూలంలోని విస్తృత భావాన్ని ‘సఫలమవుతారు’ నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాకుండా నాలుగు హీబ్రూ అక్షరాలతో కూడిన దేవుని ప్రత్యేక నామం ఉంది. ‘యహ్వే’ దానిని తెలుగు లిపిలో నేరుగా సూచిస్తుంది; సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో వివరిస్తుంది.
- issue: אמן క్రియలోని నమ్మకం–స్థిరత్వం పదక్రీడ
  choice: నమ్మండి ... స్థిరంగా నిలుస్తారు
  alternative: విశ్వసించండి ... స్థిరపరచబడతారు
  rationale: హీబ్రూలో ఒకే మూలం మొదట విశ్వాసాన్ని, తరువాత స్థిరత్వాన్ని వ్యక్తం చేస్తుంది. అసహజమైన తెలుగు రూపాన్ని బలవంతంగా వాడకుండా భావసంబంధాన్ని ప్రధాన పాఠంలో ఉంచి పదక్రీడను పాదటిప్పణిలో స్పష్టం చేసింది.
- issue: ప్రవక్తలను ‘నమ్మడం’ అనే ఆజ్ఞ యొక్క పరిధి
  choice: ఆయన ప్రవక్తలను నమ్మండి
  alternative: ఆయన ప్రవక్తలపై నమ్మకం ఉంచండి; ఆయన ప్రవక్తల మాటను విశ్వసించండి
  rationale: మూలం ప్రవక్తలను ప్రత్యక్ష కర్మగా ఉంచుతుంది. వారి సందేశమే ఉద్దేశమని వివరణాత్మకంగా చేర్చకుండా, మూలంలోని సంక్షిప్తతను మరియు సాధ్యమైన భావవ్యాప్తిని నిలుపుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బహిరంగ రాజప్రకటనకు తగిన గంభీరతతోనూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే సహజ వాక్యనిర్మాణంతోనూ రూపొందించబడింది. ప్రాచీన లేదా అతిగా సంస్కృతీకృత పదజాలాన్ని నివారిస్తూ, స్థలనామాలు మరియు వ్యక్తినామాలకు ప్రాచుర్యంలో ఉన్న తెలుగు బైబిలు రూపాలకు దగ్గరైన లిప్యంతరీకరణ వాడబడింది.
