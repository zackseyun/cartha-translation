source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הָ/רְבִעִ֗י נִקְהֲלוּ֙ לְ/עֵ֣מֶק בְּרָכָ֔ה כִּי שָׁ֖ם בֵּרֲכ֣וּ אֶת יְהוָ֑ה עַל כֵּ֡ן קָֽרְא֞וּ אֶת שֵׁ֨ם הַ/מָּק֥וֹם הַ/ה֛וּא עֵ֥מֶק בְּרָכָ֖ה עַד הַ/יּֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/026.yaml
  text: On the fourth day they assembled in the Valley of Beracah[a], because there they blessed Yahweh. Therefore they called the name of that place the Valley of Beracah to this day.
translation:
  language: te
  text: నాలుగవ రోజు వారు బెరాకా లోయలో[a] సమకూడారు, ఎందుకంటే అక్కడ వారు యెహోవాను ఆశీర్వదించారు. అందువల్ల ఆ స్థలానికి బెరాకా లోయ అని పేరు పెట్టారు; అది నేటి వరకు అలాగే పిలువబడుతోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “బెరాకా” అంటే “ఆశీర్వాదం.” ఇక్కడ “ఆశీర్వదించారు” అనే హీబ్రూ క్రియకు, ఈ స్థలనామానికి ఒకే పదమూలం ఉంది.
    reason: స్థలనామం మరియు ‘ఆశీర్వదించారు’ అనే క్రియ మధ్యనున్న హీబ్రూ పదప్రయోగాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: נִקְהֲלוּ
  choice: సమకూడారు
  rationale: నిఫాల్ రూపం ఇక్కడ ప్రజలు ఒకచోట చేరడాన్ని సూచిస్తుంది. ‘సమకూడారు’ సహజమైన ఆధునిక తెలుగు ప్రయోగంగా ఉండి మూలార్థాన్ని నిలుపుతుంది.
- source_word: עֵמֶק
  choice: లోయ
  rationale: ఈ నామవాచకం లోయను సూచిస్తుంది; స్థలనామంలోనూ సాధారణ ఆధునిక తెలుగు పదమైన ‘లోయ’ సరిపోతుంది.
- source_word: בְּרָכָה
  choice: బెరాకా
  rationale: స్థలనామంలోని పదాన్ని లిప్యంతరీకరించాం. దాని ‘ఆశీర్వాదం’ అనే అర్థం వాక్యంలోని పదప్రయోగానికి కీలకం కాబట్టి పాదసూచికలో తెలిపాం.
- source_word: כִּי שָׁם בֵּרֲכוּ אֶת יְהוָה
  choice: ఎందుకంటే అక్కడ వారు యెహోవాను స్తుతించారు
  rationale: כִּי యొక్క కారణార్థాన్ని ‘ఎందుకంటే’ స్పష్టంగా తెలియజేస్తుంది. ברך దేవుని కర్మగా తీసుకున్నప్పుడు సందర్భానుసారంగా ‘స్తుతించారు’ సహజమైన తెలుగు; అయితే ברכהతో ఉన్న మూలభాషా పదబంధాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో అందించాం.
- source_word: קָרְאוּ אֶת שֵׁם הַמָּקוֹם הַהוּא
  choice: ఆ స్థలానికి … అని పేరు పెట్టారు
  rationale: హీబ్రూ నామకరణ సూత్రాన్ని పదేపదే కాకుండా సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: עַד הַיּוֹם
  choice: నేటి వరకూ దానికి అదే పేరు ఉంది
  rationale: రచయిత కాలం వరకు ఆ పేరు కొనసాగిందనే హీబ్రూ నుడికారార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
- issue: בֵּרֲכוּ అనే క్రియకు దేవుడు కర్మగా ఉన్నప్పుడు అర్థం
  choice: స్తుతించారు
  alternative: ఆశీర్వదించారు
  rationale: మనుషులు దేవునిని ఉద్దేశించి చేసే ברך కార్యాన్ని తెలుగులో ‘స్తుతించారు’ అని చెప్పడం సహజం. అయినప్పటికీ స్థలనామమైన ברכהతో ఉన్న మూల పదబంధం పూర్తిగా కనుమరుగుకాకుండా పాదసూచికలో వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘బెరాకా’ను స్థలనామంగా లిప్యంతరీకరించి, దాని అర్థాన్ని పాదసూచికలో ఇచ్చాం.
