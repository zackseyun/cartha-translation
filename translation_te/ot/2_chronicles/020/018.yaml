id: 2CH.20.18
reference: 2 Chronicles 20:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקֹּ֧ד יְהוֹשָׁפָ֛ט אַפַּ֖יִם אָ֑רְצָ/ה וְ/כָל יְהוּדָ֞ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם נָֽפְלוּ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/הִֽשְׁתַּחֲוֺ֖ת לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/018.yaml
  text: Then Jehoshaphat bowed with his face to the ground[a], and all Judah and the inhabitants of Jerusalem fell down before Yahweh to worship Yahweh.
translation:
  language: te
  text: అప్పుడు యెహోషాపాతు ముఖం నేలవైపు వంచి నమస్కరించాడు. యూదా ప్రజలందరూ, యెరూషలేము నివాసులందరూ యాహ్వే ఎదుట నేలపై పడి యాహ్వేను ఆరాధించడానికి నమస్కరించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקֹּד
  choice: వంగాడు
  rationale: קָדַד భక్తిపూర్వకంగా వంగడాన్ని సూచిస్తుంది. మోకరించాడని అతిగా నిర్దిష్టం చేయకుండా, వెంట వచ్చే శరీర భంగిమతో కలిసి సహజంగా అర్థమయ్యేలా ‘వంగాడు’ అని అనువదించబడింది.
- source_word: אַפַּיִם אָרְצָה
  choice: ముఖం నేలకు ఆనించి
  rationale: ‘ముఖం/నాసికలు భూమివైపు’ అనే హీబ్రూ నుడికారాన్ని పూర్తిగా నేలకు వంగిన భంగిమగా స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וְכָל יְהוּדָה
  choice: యూదా వారందరూ
  rationale: ‘యూదా’ ఇక్కడ దేశం లేదా గోత్రం పేరుగా దాని ప్రజలను సమష్టిగా సూచిస్తుంది; తెలుగులో ప్రజలను ఉద్దేశిస్తున్నది స్పష్టమయ్యేలా ‘యూదా వారందరూ’ అని ఇవ్వబడింది.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִַם
  choice: యెరూషలేము నివాసులు
  rationale: నగరంలో నివసించేవారిని సూచించే కృదంత రూపానికి సహజమైన, ప్రామాణిక తెలుగు సమానం.
- source_word: נָפְלוּ לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో నేలపై పడి
  rationale: נפל యొక్క ప్రత్యక్షమైన ‘పడటం’ అనే క్రియను నిలుపుతూ, לִפְנֵי అనే సంబంధాన్ని తెలుగులో సహజంగా ‘సన్నిధిలో’ అని వ్యక్తపరుస్తుంది; ఆరాధనా సందర్భం తరువాతి క్రియలో స్పష్టమవుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: ఆరాధించారు
  rationale: שׁחה యొక్క హిత్పయేల్ రూపం ఆరాధనార్థంగా వంగి నమస్కరించడాన్ని సూచిస్తుంది. శరీర చర్య ముందే చెప్పబడినందున, ఇక్కడ దాని ఉద్దేశాన్ని ‘ఆరాధించారు’ అని సహజంగా వ్యక్తపరచడం పునరుక్తిని నివారిస్తుంది.
- source_word: לַיהוָה
  choice: యాహ్వేను
  rationale: ఆరాధనకు కర్మగా ఉన్న దైవ నామాన్ని సర్వనామంతో మార్చకుండా, మూలంలోని పునరుక్తిని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత దైవ నామం నేరుగా రెండుసార్లు ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలపాఠంలోని నామాన్ని, దాని పునరుక్తిని నిలుపుతుంది.
- issue: నమస్కార చర్య మరియు ఆరాధన మధ్య సంబంధం
  choice: ‘నేలపై పడి’ అనే చర్యను, ‘ఆరాధించారు’ అనే ఉద్దేశాన్ని వేరుగా నిలుపడం
  alternative: ‘సాష్టాంగ నమస్కారం చేశారు’ అని రెండింటినీ ఒకే పదబంధంలో కలపడం
  rationale: మూలంలో נָפְלוּ అనే పడే చర్య, לְהִשְׁתַּחֲוֺת అనే ఆరాధనా ఉద్దేశం విడిగా ఉన్నాయి. తెలుగు అనువాదం కూడా ఈ నిర్మాణాన్ని కాపాడుతుంది; ‘సాష్టాంగ’ అనే భారతీయ ఆచారానికి ప్రత్యేకమైన వివరాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘యెహోషాపాతు’, ‘యెరూషలేము’ వంటి స్థిరపడిన తెలుగు బైబిలు నామరూపాలను ఉపయోగిస్తూ, దైవ నామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం. మూలంలో లేని సాంస్కృతికంగా ప్రత్యేకమైన ‘సాష్టాంగ’ వంటి పదాన్ని నివారించాం.
