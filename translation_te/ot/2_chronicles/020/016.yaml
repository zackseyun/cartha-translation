source:
  edition: WLC
  text: מָחָר֙ רְד֣וּ עֲלֵי/הֶ֔ם הִנָּ֥/ם עֹלִ֖ים בְּ/מַעֲלֵ֣ה הַ/צִּ֑יץ וּ/מְצָאתֶ֤ם אֹתָ/ם֙ בְּ/ס֣וֹף הַ/נַּ֔חַל פְּנֵ֖י מִדְבַּ֥ר יְרוּאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/016.yaml
  text: Tomorrow go down against them. Look[a], they are coming up by the ascent of Ziz, and you will find them at the end of the wadi, before the wilderness of Jeruel.
translation:
  language: te
  text: రేపు మీరు వారిమీదికి దిగివెళ్లండి. ఇదిగో, వారు జీజ్ ఎక్కుదారి గుండా పైకి వస్తున్నారు. యెరూయేలు అరణ్యానికి ఎదురుగా, వాగు[a] చివరన మీరు వారిని కనుగొంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘లోయ’, ‘కనుమ’. ఇక్కడి హీబ్రూ పదం נחל కాలానుగుణంగా నీరు ప్రవహించే వాగును లేదా అటువంటి లోయను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָחָר
  choice: రేపు
  rationale: కాలాన్ని సూచించే సాధారణ క్రియావిశేషణం; హీబ్రూలో లేని ‘ఉదయాన్నే’ అనే భావాన్ని చేర్చకుండా మూలార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: רְדוּ עֲלֵיהֶם
  choice: మీరు వారిమీదికి దిగివెళ్లండి
  rationale: బహువచన ఆజ్ఞను, దిగువకు వెళ్లే దిశను, సైనిక సందర్భంలోని ప్రతికూల గమనాన్ని నిలుపుతుంది.
- source_word: הִנָּם
  choice: ఇదిగో
  rationale: తరువాత చెప్పే విషయంపై శ్రద్ధ నిలిపే హీబ్రూ సూచక అవ్యయపు సంభాషణాత్మక విధిని గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עֹלִים
  choice: పైకి వస్తున్నారు
  rationale: వర్తమాన లేదా సమీప గమనాన్ని తెలిపే కృదంత రూపాన్ని, మాట్లాడేవారి దృష్టికోణాన్ని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: בְּמַעֲלֵה הַצִּיץ
  choice: జీజ్ ఎక్కుదారి గుండా
  rationale: מַעֲלֶה అనే పదంలోని పైకి ఎక్కే భౌగోళిక దారి భావాన్ని నిలుపుతూ, జీజ్ అనే స్థలనామాన్ని లిప్యంతరీకరించింది.
- source_word: וּמְצָאתֶם אֹתָם
  choice: మీరు వారిని కనుగొంటారు
  rationale: ఆజ్ఞ తరువాత కలిగే ఫలితాన్ని సూచించే రూపాన్ని నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: בְּסוֹף הַנַּחַל
  choice: వాగు చివరన
  rationale: סוֹף యొక్క అంచు లేదా చివరి భాగం అనే భావాన్ని, נחל యొక్క కాలానుగుణ జలమార్గం లేదా లోయ భావాన్ని పాఠకులకు సులభమైన పదాలతో అందిస్తుంది; పదంలోని భౌగోళిక విస్తృతిని పాదటిప్పణి వివరిస్తుంది.
- source_word: פְּנֵי מִדְבַּר יְרוּאֵל
  choice: యెరూయేలు అరణ్యానికి ఎదురుగా
  rationale: פְּנֵי యొక్క స్థలసంబంధమైన ‘ముందు/ఎదురుగా’ భావాన్ని నిలుపుతూ, מִדְבָּר ను ఇసుక ఎడారిగా పరిమితం చేయకుండా ‘అరణ్యం’గా అనువదిస్తుంది.
