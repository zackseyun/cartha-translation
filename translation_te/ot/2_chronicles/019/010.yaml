source:
  edition: WLC
  text: וְ/כָל רִיב֩ אֲשֶׁר יָב֨וֹא עֲלֵי/כֶ֜ם מֵ/אֲחֵי/כֶ֣ם הַ/יֹּשְׁבִ֣ים בְּ/עָרֵי/הֶ֗ם בֵּֽין דָּ֣ם לְ/דָם֮ בֵּין תּוֹרָ֣ה לְ/מִצְוָה֮ לְ/חֻקִּ֣ים וּ/לְ/מִשְׁפָּטִים֒ וְ/הִזְהַרְתֶּ֣ם אֹתָ֔/ם וְ/לֹ֤א יֶאְשְׁמוּ֙ לַ/יהוָ֔ה וְ/הָֽיָה קֶ֥צֶף עֲלֵי/כֶ֖ם וְ/עַל אֲחֵי/כֶ֑ם כֹּ֥ה תַעֲשׂ֖וּ/ן וְ/לֹ֥א תֶאְשָֽׁמוּ־־׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/010.yaml
  text: And every dispute that comes before you from your brothers who live in their cities—whether between blood and blood[a], between law and commandment, statutes and judgments—you shall warn them, so that they may not incur guilt before Yahweh; otherwise wrath will come upon you and upon your brothers. Do this, and you will not incur guilt.
translation:
  language: te
  text: వారి పట్టణాల్లో నివసించే మీ సహోదరుల నుంచి ఏ వివాదం మీ ముందుకు వచ్చినా—అది రక్తానికీ రక్తానికీ మధ్యదైనా,[a] ధర్మశాస్త్రానికీ ఆజ్ఞకూ, శాసనాలకూ తీర్పులకూ మధ్యదైనా—వారు యాహ్వే ఎదుట దోషులైపోకుండా వారిని హెచ్చరించండి. లేకపోతే మీ మీదా మీ సహోదరుల మీదా ఉగ్రకోపం వస్తుంది. ఇలా చేయండి; అప్పుడు మీరు దోషులు కారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘రక్తానికీ రక్తానికీ మధ్య’; ఇది బహుశా రక్తపాతం లేదా నరహత్యకు సంబంధించిన కేసులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִיב
  choice: వివాదం
  rationale: న్యాయవిచారణ సందర్భంలో తలెత్తే వివాదం లేదా వ్యాజ్యాన్ని సూచిస్తుంది; ‘వివాదం’ ఆధునిక తెలుగులో సహజంగా ఉండి, దీనిని తప్పనిసరిగా అధికారిక దావాగా పరిమితం చేయదు.
- source_word: יָבֹוא עֲלֵיכֶם
  choice: మీ ముందుకు వచ్చినా
  rationale: న్యాయాధికారుల పరిశీలనకు ఒక వివాదం రావడాన్ని తెలిపే సందర్భోచిత తెలుగు నుడికారం.
- source_word: מֵאֲחֵיכֶם
  choice: మీ సహోదరుల నుంచి
  rationale: మూలంలోని బంధుత్వపదాన్ని నిలిపి, ఇశ్రాయేలు ఒడంబడిక సమాజంలోని సహసభ్యులను సూచిస్తుంది.
- source_word: הַיֹּשְׁבִים בְּעָרֵיהֶם
  choice: వారి పట్టణాల్లో నివసించే
  rationale: పదబంధానికి నేరమైన, ఆధునిక తెలుగులో సహజమైన అనువాదం.
- source_word: בֵּין דָּם לְדָם
  choice: రక్తానికీ రక్తానికీ మధ్య
  rationale: సంక్షిప్తమైన సాంకేతిక హీబ్రూ వ్యక్తీకరణలోని అస్పష్టతను ప్రధాన పాఠ్యంలో నిలిపి, రక్తపాతం లేదా నరహత్య కేసుల సంభావ్య భావాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: בֵּין תּוֹרָה לְמִצְוָה לְחֻקִּים וּלְמִשְׁפָּטִים
  choice: ధర్మశాస్త్రానికీ ఆజ్ఞకూ, కట్టడాలకూ న్యాయవిధులకూ మధ్య
  rationale: న్యాయబోధలోని వేర్వేరు వర్గాలను ఒకే సాధారణ పదంలో కలపకుండా వాటి భేదాలను సాధ్యమైనంతగా నిలుపుతుంది.
- source_word: וְהִזְהַרְתֶּם אֹתָם
  choice: వారిని హెచ్చరించండి
  rationale: తప్పు చేసి దోషులవకుండా నివారించే హెచ్చరిక భావాన్ని తరువాతి ప్రయోజన వాక్యానికి అనుగుణంగా తెలియజేస్తుంది.
- source_word: יֶאְשְׁמוּ לַיהוָה
  choice: వారు యాహ్వే ఎదుట దోషులైపోకుండా
  rationale: אשׁם క్రియలోని దోషస్థితిని, దేవునికి జవాబుదారీతనాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరిస్తుంది.
- source_word: קֶצֶף
  choice: ఉగ్రకోపం
  rationale: ఒడంబడిక తీర్పుతో కూడిన దైవిక కోపం తీవ్రతను తెలియజేస్తుంది.
- source_word: כֹּה תַעֲשׂוּן
  choice: ఇలా చేయండి
  rationale: ముందు ఇచ్చిన న్యాయపరమైన ఆదేశాన్ని సంక్షిప్తంగా తిరిగి సూచించే సహజమైన తెలుగు ఆజ్ఞ.
- source_word: וְלֹא תֶאְשָׁמוּ
  choice: అప్పుడు మీరు దోషులు కారు
  rationale: ముందటి אשׁם పదంతో భావసామ్యాన్ని నిలిపి, ఫలితాన్ని స్పష్టమైన తెలుగులో చెబుతుంది.
theological_decisions:
- issue: אֲחֵיכֶם అనే ఒడంబడిక సమాజ బంధుత్వ భాష
  choice: మీ సహోదరుల నుంచి
  alternative: మీ తోటి ఇశ్రాయేలీయుల నుంచి
  rationale: మూలంలోని పురుష బహువచన బంధుత్వ రూపాన్ని నిలుపుతుంది; సందర్భంలో అది యూదా ఒడంబడిక సమాజ సభ్యులను సూచిస్తుంది.
- issue: יְהוָה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠ్యంలో వ్యక్తిగత ఒడంబడిక నామం నేరుగా ఉంది; అందువల్ల దానిని ఒక బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం.
- issue: בֵּין דָּם לְדָם అనే న్యాయపరమైన వ్యక్తీకరణ
  choice: రక్తానికీ రక్తానికీ మధ్య
  alternative: రక్తపాతానికి సంబంధించిన కేసుల్లో
  rationale: ఇది రక్తపాతం లేదా నరహత్య రకాల మధ్య విచారణలను సూచించే అవకాశం ఉన్నా, మూలంలోని సాంకేతిక సంక్షిప్తత పూర్తిగా నిర్దిష్టం కాదు. కాబట్టి అస్పష్టతను ప్రధాన పాఠ్యంలో ఉంచి వివరణను పాదసూచికకు పరిమితం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన న్యాయపరమైన శైలిని ఉపయోగించాం. దీర్ఘ వాక్య నిర్మాణాన్ని డాష్‌లతో క్రమబద్ధం చేసి, మూలంలోని వర్గీకరణల భేదాన్నీ ‘రక్తానికీ రక్తానికీ మధ్య’ అనే నిజమైన అస్పష్టతనూ నిలిపాం.
