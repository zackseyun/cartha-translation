  text: וַ/יַּעֲמֵ֨ד שֹֽׁפְטִ֜ים בָּ/אָ֗רֶץ בְּ/כָל עָרֵ֧י יְהוּדָ֛ה הַ/בְּצֻר֖וֹת לְ/עִ֥יר וָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/005.yaml
  text: And he appointed judges in the land[a], in all the fortified cities of Judah, city by city.
translation:
  language: te
  text: అతడు దేశంలో[a], యూదాలోని ప్రాకారాలతో బలపరచబడిన అన్ని పట్టణాల్లో, పట్టణపట్టణాన న్యాయాధిపతులను నియమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేశమంతటా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: నియమించాడు
  rationale: עמד ధాతువు హిఫీల్ రూపం ఇక్కడ వ్యక్తులను పదవిలో ఉంచడాన్ని సూచిస్తుంది; భౌతికంగా నిలబెట్టడాన్ని కాదు.
- source_word: שֹׁפְטִים
  choice: న్యాయాధిపతులను
  rationale: ఈ నామవాచకం న్యాయనిర్ణయం చేసే అధికారులను సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘న్యాయాధిపతులు’ స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: בָּאָרֶץ
  choice: దేశంలో
  rationale: ఈ పదబంధం నియామకాలు జరిగిన భూభాగాన్ని సూచిస్తుంది. తరువాతి పదబంధమే విస్తృతిని విడివిడిగా తెలియజేస్తున్నందున మూలంలోని స్థానార్థాన్ని నిలిపింది.
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: యూదా ... పట్టణాలన్నిటిలో
  rationale: యూదాలోని అన్ని పట్టణాల పరిధిని సూచించే בְּכָל నిర్మాణంలోని సమగ్రతను సహజమైన తెలుగు వాక్యక్రమంలో నిలిపింది.
- source_word: הַבְּצֻרוֹת
  choice: ప్రాకార పట్టణాలు
  rationale: ఈ విశేషణం రక్షణార్థం బలపరచబడిన పట్టణాలను సూచిస్తుంది; ‘ప్రాకార పట్టణాలు’ సంక్షిప్తమైన, సహజమైన తెలుగు ప్రయోగం.
- source_word: לְעִיר וָעִיר
  choice: పట్టణపట్టణాన
  rationale: ప్రతి పట్టణంలో విడివిడిగా నియామకం జరిగినట్లు చూపే పంపిణీ భావాన్ని తెలుగు పునరుక్తి సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలిని అనుసరించింది. హెబ్రీ వాక్యంలోని స్థానార్థం, సమగ్రత, పట్టణాలవారీ పంపిణీ భావం నిలిపివేయబడ్డాయి.
