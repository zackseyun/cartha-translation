id: 2CH.19.9
reference: 2 Chronicles 19:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְצַ֥ו עֲלֵי/הֶ֖ם לֵ/אמֹ֑ר כֹּ֤ה תַעֲשׂוּ/ן֙ בְּ/יִרְאַ֣ת יְהוָ֔ה בֶּ/אֱמוּנָ֖ה וּ/בְ/לֵבָ֥ב שָׁלֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/009.yaml
  text: And he commanded them[a], saying, “Thus you shall act in the fear of Yahweh[d][c][b], in faithfulness and with a whole heart.”
translation:
  language: te
  text: 'అతడు వారికి ఇలా ఆజ్ఞాపించాడు: “మీరు యహ్వే పట్ల భయంతో[a], నిష్ఠతో[b], పూర్ణ హృదయంతో[c] ఈ విధంగా వ్యవహరించాలి[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “భయభక్తితో” లేదా “భక్తిపూర్వక గౌరవంతో” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “విశ్వసనీయంగా” లేదా “యథార్థంగా” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “అవిభక్త హృదయంతో” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: “ఈ విధంగా చేయాలి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו עֲלֵיהֶם לֵאמֹר
  choice: అతడు వారికి ఇలా ఆజ్ఞాపించాడు
  rationale: צוה యొక్క ఆజ్ఞాపించే భావాన్ని స్పష్టంగా ఉంచుతూ, על సూచించే పరోక్ష కర్మను సహజమైన తెలుగులో ‘వారికి’గా ఇచ్చాం; לאמרను ‘ఇలా’ అనే ఉద్ధరణ పరిచయంతో వ్యక్తం చేశాం.
- source_word: כֹּה תַעֲשׂוּן
  choice: మీరు ఈ విధంగా వ్యవహరించాలి
  rationale: עשה విస్తృతంగా ‘చేయడం/వ్యవహరించడం’ అని అర్థమవుతుంది. న్యాయాధికారుల ప్రవర్తనకు సంబంధించిన సందర్భంలో ‘వ్యవహరించాలి’ సహజంగా ఉంటుంది; כֹּה భావాన్ని ‘ఈ విధంగా’ నిలుపుతుంది.
- source_word: בְּיִרְאַת יְהוָה
  choice: యెహోవా పట్ల భయంతో
  rationale: יראהలోని నిజమైన భయం మరియు భక్తిపూర్వక గౌరవం రెండింటినీ మరీ సన్నగా నిర్వచించకుండా ‘భయం’తో నిలిపాం. సంబంధాన్ని సహజ తెలుగులో ‘పట్ల’తో వ్యక్తం చేశాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దేవుని వ్యక్తిగత నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: בֶּאֱמוּנָה
  choice: నమ్మకంగా
  rationale: న్యాయసంబంధ సందర్భంలో אֱמוּנָה అంతరంగ విశ్వాసం కంటే విశ్వసనీయమైన, నిష్ఠగల ప్రవర్తనను సూచిస్తుంది. ‘నమ్మకంగా’ ఆ భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וּבְלֵבָב שָׁלֵם
  choice: పూర్ణ హృదయంతో
  rationale: לבב שלםలోని సంపూర్ణత, హృదయపూర్వకత, అవిభక్త నిబద్ధత అనే భావపరిధిని ‘పూర్ణ హృదయం’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ వ్యక్తం చేశాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో బిరుదు కాకుండా టెట్రాగ్రామాటన్ నేరుగా ఉంది. అందువల్ల వ్యక్తిగత దైవనామాన్ని నిలిపి, తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను వాడాం.
- issue: న్యాయాధికారులకు ఇచ్చిన ఉపదేశంలో אֱמוּנָה భావం
  choice: నమ్మకంగా
  alternative: విశ్వాసంతో; నిష్ఠతో; యథార్థంగా
  rationale: ఈ సందర్భం న్యాయాధికారులు తమ బాధ్యతను ఎలా నిర్వర్తించాలనే దానిపై ఉంది. కాబట్టి ఈ పదాన్ని సిద్ధాంతపరమైన ‘విశ్వాసం’కే పరిమితం చేయకుండా, విశ్వసనీయత మరియు నిష్ఠగల ప్రవర్తనగా అనువదించాం.
- issue: לבב שלם యొక్క భావపరిధి
  choice: పూర్ణ హృదయంతో
  alternative: అవిభక్త హృదయంతో
  rationale: ఈ పదబంధం హృదయపూర్వకతతో పాటు అవిభక్త నిబద్ధతను కూడా సూచించగలదు. ప్రధాన పాఠంలో మూల రూపకాన్ని నిలిపి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణాన్ని వాడాం. న్యాయసంబంధ సందర్భానికి ‘వ్యవహరించాలి’ సరిపోతుంది; మూలంలోని ‘భయం,’ ‘నమ్మకత్వం,’ ‘పూర్ణ హృదయం’ మధ్య ఉన్న నైతిక-ఆధ్యాత్మిక ఉద్రిక్తతను సులభీకరించకుండా నిలిపాం.
