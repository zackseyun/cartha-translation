    issue: The divine name is rendered ‘యెహోవా.’
    rationale: The POB source audit specifies Yahweh for יהוה. ‘యెహోవా’ represents a different traditional vocalized form; ‘యహ్వే’ more directly reflects the selected source-based name rendering.
  - severity: medium
    issue: ‘నమ్మకంగా’ is used for בֶּאֱמוּנָה.
    rationale: In current Telugu this may primarily convey acting with trust or confidence. In this instruction to judges, the Hebrew calls for faithful, reliable conduct; ‘నిష్ఠతో’ communicates that sense more clearly.
