source:
  edition: WLC
  text: וְ/עַתָּ֕ה יְהִ֥י פַֽחַד יְהוָ֖ה עֲלֵי/כֶ֑ם שִׁמְר֣וּ וַ/עֲשׂ֔וּ כִּֽי אֵ֞ין עִם יְהוָ֣ה אֱלֹהֵ֗י/נוּ עַוְלָ֛ה וּ/מַשֹּׂ֥א פָנִ֖ים וּ/מִקַּח שֹֽׁחַד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/007.yaml
  text: Now then[a], let the fear of Yahweh be upon you. Be careful and act, for with Yahweh our God there is no injustice, no partiality, and no taking of a bribe.
translation:
  language: te
  text: కాబట్టి ఇప్పుడు యాహ్వే పట్ల భయం మీపై ఉండుగాక. జాగ్రత్తగా ఉండి, ఆచరించండి. ఎందుకంటే మన దేవుడైన యాహ్వేలో అన్యాయం గానీ, పక్షపాతం[a] గానీ, లంచం పుచ్చుకోవడం గానీ లేవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘ముఖాన్ని ఎత్తడం’; ఇది ఒకరిని బట్టి అనుకూలత చూపడం లేదా పక్షపాతం వహించడం అనే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: ఈ పదబంధం కాలసూచనతో పాటు ముందున్న మాటల నుంచి వచ్చే ఉపదేశాత్మక ముగింపును కూడా పరిచయం చేస్తుంది.
- source_word: יְהִי פַחַד יְהוָה עֲלֵיכֶם
  choice: యాహ్వే పట్ల భయం మీ మీద ఉండాలి
  rationale: యస్సీవ్ రూపంలోని ఉపదేశ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘భయం’ ఇక్కడ కేవలం భీతిని కాక దేవునిపట్ల గౌరవభరితమైన భయాన్ని సూచిస్తుంది.
- source_word: שִׁמְרוּ וַעֲשׂוּ
  choice: జాగ్రత్త వహించి మీ కర్తవ్యాన్ని నిర్వర్తించండి
  rationale: న్యాయాధికారుల సందర్భంలో ఈ రెండు క్రియలు అప్రమత్తంగా ఉండి అప్పగించిన పనిని ఆచరణలో పెట్టాలని చెబుతున్నాయి; ‘కర్తవ్యం’ సందర్భంలో అంతర్లీనంగా ఉన్న కర్మను స్పష్టం చేస్తుంది.
- source_word: כִּי אֵין עִם יְהוָה אֱלֹהֵינוּ
  choice: ఎందుకంటే మన దేవుడైన యాహ్వే దగ్గర ... లేవు
  rationale: దేవుని స్వభావంలోనూ వ్యవహారంలోనూ ఇవి కనిపించవనే עִם నిర్మాణ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עַוְלָה
  choice: అన్యాయం
  rationale: న్యాయమూర్తుల సందర్భంలో నైతిక తప్పుతో పాటు న్యాయవిరుద్ధతను కూడా స్పష్టంగా తెలియజేస్తుంది.
- source_word: מַשֹּׂא פָנִים
  choice: పక్షపాతం
  rationale: అక్షరార్థంగా ‘ముఖాన్ని ఎత్తడం’ అనే హీబ్రూ నుడికారం వ్యక్తిని లేదా హోదాను బట్టి అనుకూలత చూపడాన్ని సూచిస్తుంది; ‘పక్షపాతం’ సహజమైన, సంక్షిప్తమైన తెలుగు సమానం.
- source_word: מִקַּח שֹׁחַד
  choice: లంచం పుచ్చుకోవడం
  rationale: లంచాన్ని స్వీకరించే చర్యను ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ శాస్త్రీయ ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: פַחַד అనే ‘భయం’ స్వభావం
  choice: యాహ్వే పట్ల భయం
  alternative: యాహ్వే పట్ల భక్తిపూర్వక గౌరవం
  rationale: ‘భయం’ అనే మూల రూపకాన్ని నిలుపుతూ, ‘పట్ల’ అనే నిర్మాణం ద్వారా ఇది దేవుని గురించిన భయభక్తిని సూచిస్తుందని తెలియజేస్తుంది; కేవలం ‘గౌరవం’ అని మార్చి మూలంలోని తీవ్రతను తగ్గించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ఉపదేశ శైలి ఉపయోగించబడింది. న్యాయసందర్భాన్ని స్పష్టం చేయడానికి ‘మీ కర్తవ్యాన్ని నిర్వర్తించండి’ అని ఇచ్చినా, మూడు నిషేధిత అంశాలను మూలపాఠంలోని సమాంతర నిర్మాణానికి దగ్గరగా ఉంచాం.
