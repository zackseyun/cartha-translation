  to: కాబట్టి ఇప్పుడు యాహ్వే పట్ల భయం మీపై ఉండుగాక. జాగ్రత్తగా ఉండి, ఆచరించండి. ఎందుకంటే మన దేవుడైన యాహ్వేలో అన్యాయం గానీ, పక్షపాతం[a] గానీ, లంచం పుచ్చుకోవడం గానీ లేవు.
