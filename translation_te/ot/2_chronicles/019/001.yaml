id: 2CH.19.1
reference: 2 Chronicles 19:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֠/יָּשָׁב יְהוֹשָׁפָ֨ט מֶֽלֶךְ יְהוּדָ֧ה אֶל בֵּית֛/וֹ בְּ/שָׁל֖וֹם לִֽ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/001.yaml
  text: And Jehoshaphat king of Judah returned in peace to his house in Jerusalem[a].
translation:
  language: te
  text: యూదా రాజైన యెహోషాపాతు యెరూషలేములోని తన ఇంటికి క్షేమంగా[a] తిరిగి వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శాంతితో.’ ఇక్కడి హీబ్రూ పదబంధం సురక్షితంగా, క్షేమంగా తిరిగి రావడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: తిరిగి వచ్చాడు
  rationale: שׁוב అనే క్రియ తిరిగి రావడాన్ని సూచిస్తుంది. కథన సందర్భంలో ‘తిరిగి వచ్చాడు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: יְהוֹשָׁפָט
  choice: యెహోషాపాతు
  rationale: వ్యక్తి పేరును తెలుగులో స్థిరపడిన బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
- source_word: מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన
  rationale: యెహోషాపాతు రాజపదవిని తెలిపే సమాసాన్ని తెలుగులో సహజమైన విశేషణబంధంగా అనువదించాం.
- source_word: אֶל בֵּיתוֹ
  choice: తన ఇంటికి
  rationale: בַּיִת ఇక్కడ గమ్యస్థానమైన ఇల్లు లేదా నివాసాన్ని సూచిస్తుంది; ‘తన ఇంటికి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: בְּשָׁלוֹם
  choice: క్షేమంగా
  rationale: שָׁלוֹם ఇక్కడ శాంతితో పాటు సురక్షితంగా, క్షేమంగా తిరిగి రావడం అనే భావాన్ని కలిగి ఉంది. ప్రధాన వాక్యంలో సహజమైన ‘క్షేమంగా’ వాడి, మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: לִירוּשָׁלִָם
  choice: యెరూషలేములోని
  rationale: హీబ్రూలో לְ ఉన్నప్పటికీ, అది ‘తన ఇంటికి’ అనే గమ్యంతో కలిసి యెరూషలేములో ఉన్న ఇంటిని సూచిస్తుంది. తెలుగులో ‘యెరూషలేములోని తన ఇంటికి’ అనడం సహజం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, దాని అర్థాన్ని స్పష్టంగా నిలుపుకున్నాం.
