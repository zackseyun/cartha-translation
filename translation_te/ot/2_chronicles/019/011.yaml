source:
  edition: WLC
  text: וְ/הִנֵּ֡ה אֲמַרְיָ֣הוּ כֹהֵן֩ הָ/רֹ֨אשׁ עֲלֵי/כֶ֜ם לְ/כֹ֣ל דְּבַר יְהוָ֗ה וּ/זְבַדְיָ֨הוּ בֶן יִשְׁמָעֵ֜אל הַ/נָּגִ֤יד לְ/בֵית יְהוּדָה֙ לְ/כֹ֣ל דְּבַר הַ/מֶּ֔לֶךְ וְ/שֹׁטְרִ֥ים הַ/לְוִיִּ֖ם לִ/פְנֵי/כֶ֑ם חִזְק֣וּ וַ/עֲשׂ֔וּ וִ/יהִ֥י יְהוָ֖ה עִם הַ/טּֽוֹב־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/011.yaml
  text: And behold[a], Amariah the chief priest is over you in every matter of Yahweh, and Zebadiah son of Ishmael, the ruler of the house of Judah, for every matter of the king; and the Levites will serve as officers before you. Be strong and act[b], and may Yahweh be with the good.
translation:
  language: te
  text: ఇదిగో, యాహ్వేకు సంబంధించిన ప్రతి విషయంలో ప్రధాన యాజకుడైన అమర్యా[a] మీపై అధిపతిగా ఉన్నాడు; రాజుకు సంబంధించిన ప్రతి విషయంలో యూదా ఇంటివారికి అధిపతియైన ఇష్మాయేలు కుమారుడు జెబద్యా ఉంటాడు. లేవీయులు అధికారులుగా మీ ముందుంటారు. ధైర్యంగా ఉండి కార్యం నెరవేర్చండి. మంచివానితో యాహ్వే ఉండుగాక.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మహాయాజకుడైన అమర్యా.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “మంచివారితో యాహ్వే ఉండుగాక.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: తరువాత చెప్పబోయే అధికార వ్యవస్థపై శ్రద్ధ నిలిపే హీబ్రూ సంభాషణ సూచకాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: כֹהֵן הָרֹאשׁ
  choice: ప్రధాన యాజకుడు
  rationale: అక్షరార్థంగా ‘ముఖ్య/ప్రధాన యాజకుడు.’ సందర్భంలోని నాయకత్వ భావాన్ని తెలియజేస్తూ, తప్పనిసరిగా సాంకేతిక పదవిని నిర్ధారించదు.
- source_word: עֲלֵיכֶם
  choice: మీపై అధికారిగా ఉన్నాడు
  rationale: న్యాయపరమైన, పరిపాలనాపరమైన పర్యవేక్షణను స్పష్టంగా వ్యక్తం చేస్తుంది; హీబ్రూలోని క్రియలేని వాక్యానికి తెలుగులో అవసరమైన క్రియను అందిస్తుంది.
- source_word: לְכֹל דְּבַר יְהוָה
  choice: యాహ్వేకు సంబంధించిన ప్రతి విషయంలో
  rationale: דָּבָר అనే పదంలోని ‘విషయం/వ్యవహారం/కేసు’ విస్తృతిని నిలుపుతూ, కేవలం న్యాయవిచారణ కేసులకే పరిమితం చేయదు.
- source_word: הַנָּגִיד לְבֵית יְהוּדָה
  choice: యూదా వంశానికి అధిపతి
  rationale: נָגִיד లోని నాయకత్వం లేదా పాలనా అధికారాన్ని ‘అధిపతి’ తెలియజేస్తుంది; ‘యూదా వంశం’ בית יהודה అనే సమూహార్థక ప్రయోగాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: לְכֹל דְּבַר הַמֶּלֶךְ
  choice: రాజుకు సంబంధించిన ప్రతి విషయంలో
  rationale: యాహ్వేకు సంబంధించిన విషయాలతో సమాంతర నిర్మాణాన్ని నిలుపుతూ రాజపరమైన అధికార పరిధిని సూచిస్తుంది.
- source_word: וְשֹׁטְרִים הַלְוִיִּם לִפְנֵיכֶם
  choice: లేవీయులు అధికారులుగా మీ ముందుంటారు
  rationale: שֹׁטְרִים ను పరిపాలనా ‘అధికారులు’గా చూపి, לִפְנֵיכֶם లోని సమక్షత మరియు సేవాసిద్ధతను అతి వివరణ లేకుండా నిలుపుతుంది.
- source_word: חִזְקוּ וַעֲשׂוּ
  choice: ధైర్యంగా ఉండి కార్యం నెరవేర్చండి
  rationale: బలంగా ఉండమనే ప్రోత్సాహాన్ని, అప్పగించిన బాధ్యతను ఆచరణలో పెట్టమనే ఆజ్ఞను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וִיהִי יְהוָה עִם הַטּוֹב
  choice: మంచివానికి యాహ్వే తోడుగా ఉండుగాక
  rationale: וִיהִי లోని ఆశీర్వాదాత్మక భావాన్ని ‘ఉండుగాక’తో, הַטּוֹב లోని వ్యక్తి/మంచి అనే సంక్షిప్త భావాన్ని ‘మంచివానికి’తో అందిస్తుంది; ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సాధారణంగా అర్థమయ్యే లిప్యంతరీకరణతో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలంలో నేరుగా ఉన్న ఒడంబడిక నామాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా ఉంచుతుంది; ‘యాహ్వే’ హీబ్రూ రూపానికి సమీపమైన ఆధునిక లిప్యంతరీకరణ.
- issue: כֹהֵן הָרֹאשׁ సాంకేతికంగా ‘మహాయాజకుడు’ అనే పదవినే సూచిస్తుందా
  choice: ప్రధాన యాజకుడు
  alternative: మహాయాజకుడు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ముఖ్య యాజకుడు.’ ఈ పరిపాలనా సందర్భంలో పర్యవేక్షణాధికారమే ప్రధానంగా కనిపిస్తుంది కాబట్టి, మరింత సాంకేతిక పదవిని ప్రధాన పాఠంలో బలవంతంగా నిర్ణయించలేదు.
- issue: הַטּוֹב వ్యక్తిని సూచిస్తుందా లేక మంచిని సూచిస్తుందా
  choice: మంచివానికి యాహ్వే తోడుగా ఉండుగాక
  alternative: యాహ్వే మంచికి తోడుగా ఉండుగాక
  rationale: వ్యక్తిని ఉద్దేశించిన ముగింపు ఆశీర్వాదం సందర్భానికి సహజంగా సరిపోతుంది; అయితే హీబ్రూ విశేషణం నామవాచకంగా ‘మంచి’ అనే భావాన్నీ అనుమతిస్తుంది కాబట్టి ఆ అస్పష్టతను పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. హీబ్రూ వాక్యంలోని యాహ్వే సంబంధిత విషయాలు మరియు రాజు సంబంధిత విషయాలు అనే సమాంతర అధికార విభజన నిలుపబడింది. ‘ఇదిగో,’ ‘ఉండుగాక’ వంటి స్వల్పంగా ఉన్నతమైన రూపాలు బైబిలు సందర్భపు గాంభీర్యాన్ని కాపాడుతాయి; మిగతా నిర్మాణం సహజ తెలుగులో ఉంది.
