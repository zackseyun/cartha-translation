revisions:
- from: ఇదిగో, యాహ్వేకు సంబంధించిన ప్రతి విషయంలో ప్రధాన యాజకుడైన అమర్యా[a] మీపై అధికారిగా ఉన్నాడు; రాజుకు సంబంధించిన ప్రతి విషయంలో యూదా వంశానికి అధిపతియైన ఇష్మాయేలు కుమారుడు జెబద్యా మీపై అధికారిగా ఉన్నాడు. లేవీయులు అధికారులుగా మీ ముందుంటారు. ధైర్యంగా ఉండి కార్యం నెరవేర్చండి. మంచివానికి యాహ్వే తోడుగా ఉండుగాక.[b]
  to: ఇదిగో, యాహ్వేకు సంబంధించిన ప్రతి విషయంలో ప్రధాన యాజకుడైన అమర్యా[a] మీపై అధిపతిగా ఉన్నాడు; రాజుకు సంబంధించిన ప్రతి విషయంలో యూదా ఇంటివారికి అధిపతియైన ఇష్మాయేలు కుమారుడు జెబద్యా ఉంటాడు. లేవీయులు అధికారులుగా మీ ముందుంటారు. ధైర్యంగా ఉండి కార్యం నెరవేర్చండి. మంచివానితో యాహ్వే ఉండుగాక.[b]
  rationale: The revision removes an unsupported repetition of supervisory authority in the Zebadiah clause, retains the distinction between Yahweh-related and royal matters, and represents “house of Judah” without narrowing it to lineage alone. It also makes the closing jussive blessing idiomatic Telugu while preserving the Hebrew’s generic ambiguity through a footnote.
  reviewer_model: gpt-5.6-terra
