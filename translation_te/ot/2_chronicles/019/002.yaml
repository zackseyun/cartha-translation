  to: 'హనానీ కుమారుడైన దర్శి యేహూ అతన్ని కలుసుకోవడానికి బయలుదేరి, యెహోషాపాతు రాజుతో ఇలా అన్నాడు: “నీవు దుష్టునికి సహాయం చేసి, యెహోవాను ద్వేషించేవారిని ప్రేమించాలా? నీవు ఇలా చేసినందువల్ల యెహోవా సన్నిధి నుండి నీ మీద ఆగ్రహం ఉంది.”'
  rationale: The sole revision changes the final predicate from a completed event (‘came’) to the Hebrew’s present declaration (‘is upon you’). All other wording is retained because it faithfully and naturally communicates the Hebrew text in modern standard Telugu.
