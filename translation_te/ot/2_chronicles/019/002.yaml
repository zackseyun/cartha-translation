id: 2CH.19.2
reference: 2 Chronicles 19:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּצֵ֣א אֶל פָּנָ֗י/ו יֵה֣וּא בֶן חֲנָ֘נִי֮ הַ/חֹזֶה֒ וַ/יֹּ֨אמֶר֙ אֶל הַ/מֶּ֣לֶךְ יְהוֹשָׁפָ֔ט הֲ/לָ/רָשָׁ֣ע לַ/עְזֹ֔ר וּ/לְ/שֹׂנְאֵ֥י יְהוָ֖ה תֶּאֱהָ֑ב וּ/בָ/זֹאת֙ עָלֶ֣י/ךָ קֶּ֔צֶף מִ/לִּ/פְנֵ֖י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/002.yaml
  text: Jehu son of Hanani the seer went out to meet him and said to King Jehoshaphat[a], “Should you help the wicked and love those who hate Yahweh? Because of this[b], wrath is upon you from the presence of Yahweh.”
translation:
  language: te
  text: 'హనానీ కుమారుడైన దర్శి యేహూ అతన్ని కలుసుకోవడానికి బయలుదేరి, యెహోషాపాతు రాజుతో ఇలా అన్నాడు: “నీవు దుష్టునికి సహాయం చేసి, యెహోవాను ద్వేషించేవారిని ప్రేమించాలా? నీవు ఇలా చేసినందువల్ల యెహోవా సన్నిధి నుండి నీ మీద ఆగ్రహం ఉంది.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא אֶל־פָּנָיו
  choice: అతన్ని కలుసుకోవడానికి బయలుదేరి
  rationale: ‘అతని ముఖము/సన్నిధి వైపుకు బయలుదేరాడు’ అనే హీబ్రూ నుడికారానికి సందర్భానుసారమైన సహజ తెలుగు అర్థం ‘అతన్ని కలుసుకోవడానికి బయలుదేరాడు’.
- source_word: הַחֹזֶה
  choice: దర్శి
  rationale: חֹזֶה అనేది ప్రవచన పరిచర్యకు సంబంధించిన ప్రత్యేక బిరుదు; సాధారణమైన ‘ప్రవక్త’ కంటే ‘దర్శి’ దాని పదభేదాన్ని నిలుపుతుంది.
- source_word: הֲלָרָשָׁע לַעְזֹר
  choice: నీవు దుష్టునికి సహాయం ... చేయాలా?
  rationale: ప్రశ్నరూపంలోని గద్దింపును నిలిపింది. ఆర్టికల్‌తో ఉన్న ఏకవచన విశేషణాన్ని ఈ చారిత్రక సందర్భంలో సమూహార్థంగానూ గ్రహించవచ్చు; అయితే రూపాన్ని అతిగా విస్తరించకుండా ‘దుష్టునికి’ అని ఉంచింది.
- source_word: וּלְשֹׂנְאֵי יְהוָה תֶּאֱהָב
  choice: యెహోవాను ద్వేషించేవారిని ప్రేమించాలా?
  rationale: శత్రువులు అని వ్యాఖ్యానించకుండా, שֹׂנְאֵי లోని ‘ద్వేషించేవారు’ అనే క్రియాత్మక భావాన్ని నేరుగా నిలిపింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన దైవనామ రూపాన్ని ఉపయోగించి, బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామాన్ని నిలిపింది.
- source_word: וּבָזֹאת
  choice: నీవు ఇలా చేసినందువల్ల
  rationale: ముందు పేర్కొన్న యెహోషాపాతు చర్యను సూచించే కారణార్థక సంబంధాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: עָלֶיךָ קֶּצֶף
  choice: నీ మీద ఆగ్రహం వచ్చింది
  rationale: ‘నీపై ఆగ్రహం’ అనే హీబ్రూ నిర్మాణాన్ని సహజ తెలుగులో ఉంచి, ఇది దేవుని తీర్పుతో కూడిన కోపమని సందర్భం తెలియజేసేలా చేసింది.
- source_word: מִלִּפְנֵי יְהוָה
  choice: యెహోవా సన్నిధి నుండి
  rationale: ‘యెహోవా ఎదుటనుండి/సన్నిధి నుండి’ అనే మూల చిత్రణను చదవదగిన తెలుగులో సంరక్షిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం ఉంది. దానిని బిరుదుగా మార్చకుండా, ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు సుపరిచితమైన నామరూపంతో ఇచ్చింది.
- issue: ‘దుష్టుడు’ మరియు ‘యెహోవాను ద్వేషించేవారు’ అనే పదాల పరిధి
  choice: మూలంలోని నైతిక వర్గీకరణను ఉంచడం; ఆహాబు పేరును చేర్చకపోవడం
  alternative: ఆహాబుకు సహాయం చేశావా?; దుష్టులకు సహాయం చేయాలా?
  rationale: చారిత్రకంగా ఆహాబు ఉద్దేశింపబడినప్పటికీ, మూలం అతని పేరును చెప్పకుండా విస్తృత నైతిక పదాలతో గద్దిస్తుంది. ఆ భావవ్యాప్తిని సంకుచితం చేయలేదు.
- issue: కֶּצֶף యొక్క తీవ్రత
  choice: ఆగ్రహం
  alternative: కోపం; ఉగ్రకోపం
  rationale: దైవిక అసంతృప్తి మరియు తీర్పు భావాన్ని ‘ఆగ్రహం’ గౌరవప్రదంగా తెలియజేస్తుంది; మూలం కంటే తీవ్రతను పెంచే పదాన్ని తప్పించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. హీబ్రూ ప్రశ్నలోని గద్దింపు, ప్రవచనాత్మక బిరుదు, దైవసన్నిధి అనే చిత్రణ నిలుపబడ్డాయి. సాధారణ పాఠకునికి అసహజంగా ఉండే పదశః నిర్మాణాలు సహజ తెలుగులోకి మార్చబడ్డాయి.
