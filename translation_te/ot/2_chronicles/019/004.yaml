  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֥שֶׁב יְהוֹשָׁפָ֖ט בִּ/ירוּשָׁלִָ֑ם וַ/יָּ֜שָׁב וַ/יֵּצֵ֣א בָ/עָ֗ם מִ/בְּאֵ֥ר שֶׁ֨בַע֙ עַד הַ֣ר אֶפְרַ֔יִם וַ/יְשִׁיבֵ֕/ם אֶל יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽםס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/004.yaml
  text: So Jehoshaphat lived in Jerusalem[a], and he went out again among the people from Beersheba to the hill country of Ephraim and brought them back to Yahweh[b], the God of their fathers.
translation:
  language: te
  text: యెహోషాపాతు యెరూషలేములో నివసించాడు. అతడు మళ్లీ[a] ప్రజల మధ్య బయలుదేరి, బెయేర్షెబా నుండి ఎఫ్రాయిము కొండప్రాంతం వరకు వెళ్లి, వారిని వారి పూర్వికుల దేవుడైన యాహ్వే[b] వైపు తిరిగి నడిపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తిరిగి ప్రజల మధ్య బయలుదేరాడు.” హెబ్రీలో ‘తిరుగు’ అనే క్రియ ‘బయలుదేరు’ అనే క్రియకు ముందు ఉంది; యెహోషాపాతు యెరూషలేముకు తిరిగి వచ్చిన తర్వాత ఈ కార్యాన్ని మళ్లీ చేపట్టాడనే భావాన్ని ఇది సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో దేవుని ప్రత్యేక నామం YHWH ఉంది; దీనిని కొన్నిసార్లు “యెహోవా” అని కూడా పలుకుతారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: నివసించాడు
  rationale: ישׁב ఇక్కడ కూర్చోవడం కాక, యెరూషలేములో స్థిరంగా నివసించడాన్ని సూచిస్తుంది.
- source_word: וַיָּשָׁב וַיֵּצֵא
  choice: మళ్లీ ... బయలుదేరి
  rationale: ‘తిరిగి, బయలుదేరాడు’ అనే హెబ్రీ పునరుక్తి, యెహోషాపాతు ముందటి కార్యాన్ని తిరిగి కొనసాగించాడనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיֵּצֵא בָעָם
  choice: ప్రజల మధ్యకు బయలుదేరి ... పర్యటించి
  rationale: בָעָם ఇక్కడ కేవలం ప్రజల దగ్గరకు వెళ్లడం కాక, వారి మధ్య సంచరించడాన్ని సూచిస్తుంది; ప్రాంత పరిమితితో కలిపి ‘పర్యటించి’ అని స్పష్టం చేయబడింది.
- source_word: מִבְּאֵר שֶׁבַע עַד הַר אֶפְרַיִם
  choice: బెయేర్షెబా నుండి ఎఫ్రాయిము కొండప్రాంతం వరకు
  rationale: הַר אֶפְרַיִם ఒకే కొండకన్నా భౌగోళిక పర్వత ప్రాంతాన్ని సూచిస్తుంది; అందువల్ల ‘కొండప్రాంతం’ సహజమైన ఎంపిక.
- source_word: וַיְשִׁיבֵם
  choice: వారిని ... తిరిగి నడిపించాడు
  rationale: שוב హిఫిల్ రూపం వారిని తిరిగేలా చేశాడనే causative భావాన్ని ఇస్తుంది. ఇది బలవంతపు మార్పు లేదా సాంకేతిక మతపరివర్తనను సూచించకుండా మూల భావాన్ని నిలుపుతుంది.
- source_word: אֶל יְהוָה
  choice: యెహోవా వైపు
  rationale: దైవనామం יהוהను తెలుగులో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం; אֶל యొక్క దిశాత్మక భావాన్ని ‘వైపు’ నిలుపుతుంది.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: వారి పూర్వికుల దేవుడు
  rationale: אבותיהםను ఆధునిక, సమగ్ర తెలుగు వాడుకలో ‘పూర్వికులు’గా అనువదించడం ద్వారా వంశపారంపర్య విశ్వాస సంబంధం నిలుస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలంలో ప్రత్యేక దైవనామం నేరుగా ఉంది. దానిని సాధారణ బిరుదుతో మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచాం; ప్రత్యామ్నాయ ఉచ్చారణను పాదటిప్పణిలో తెలిపాం.
- issue: וַיְשִׁיבֵם אֶל יְהוָהలో యెహోషాపాతు చేసిన కార్యం స్వభావం
  choice: వారిని యెహోవా వైపు తిరిగి నడిపించాడు
  alternative: వారిని మార్చాడు / పశ్చాత్తాపపడేలా చేశాడు
  rationale: హెబ్రీ వాక్యం తిరిగి రావడానికి కారణమయ్యాడనే భావం ఇస్తుంది; ‘మతం మార్చాడు’ లేదా అంతరంగ పశ్చాత్తాపం కలిగించాడు అనే అదనపు సిద్ధాంతార్థాన్ని మూలం నిర్బంధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘పూర్వికులు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి మూలంలోని వంశపారంపర్య భావాన్ని నిలుపుతుంది. స్థలనామాలు తెలుగు బైబిలు వాడుకకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి.
