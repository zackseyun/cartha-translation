revisions:
- from: యెహోషాపాతు యెరూషలేములో నివసించాడు.[a] అతడు మళ్లీ ప్రజల మధ్యకు బయలుదేరి, బెయేర్షెబా నుండి ఎఫ్రాయిము కొండప్రాంతం వరకు పర్యటించి, వారిని వారి పూర్వికుల దేవుడైన యెహోవా[b] వైపు తిరిగి నడిపించాడు.
  to: యెహోషాపాతు యెరూషలేములో నివసించాడు. అతడు మళ్లీ[a] ప్రజల మధ్య బయలుదేరి, బెయేర్షెబా నుండి ఎఫ్రాయిము కొండప్రాంతం వరకు వెళ్లి, వారిని వారి పూర్వికుల దేవుడైన యాహ్వే[b] వైపు తిరిగి నడిపించాడు.
  rationale: దైవనామాన్ని ఇచ్చిన POB audit trailకు అనుగుణంగా ‘యాహ్వే’గా సరిచేసి, పాదటిప్పణిలోని ప్రత్యామ్నాయ రూపాన్ని తగినట్లుగా మార్చాం. పునరుక్తి క్రియకు సంబంధించిన పాదటిప్పణిని ‘మళ్లీ’ వద్దకు తరలించాం. ‘పర్యటించి’ అనే అనవసర అదనపు క్రియను తొలగించి, మూలంలోని కార్యప్రవాహాన్ని ఆధునిక సహజ తెలుగులో నిలుపాం.
