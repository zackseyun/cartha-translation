revisions:
- from: 'అతడు న్యాయాధిపతులతో ఇలా అన్నాడు: “మీరు చేస్తున్నదేమిటో జాగ్రత్తగా చూసుకోండి. ఎందుకంటే మీరు మనిషి కోసం[a] తీర్పు తీర్చడం లేదు; యెహోవా కోసం తీర్పు తీరుస్తున్నారు. తీర్పు చెప్పే విషయంలో[b] ఆయన మీతో ఉన్నాడు.”'
  to: 'అతడు న్యాయాధిపతులతో ఇలా అన్నాడు: “మీరు చేస్తున్నదేమిటో జాగ్రత్తగా చూసుకోండి. ఎందుకంటే మీరు మనిషి కోసం[a] తీర్పు చెప్పడం లేదు; యాహ్వే కోసం తీర్పు చెబుతున్నారు. తీర్పు విషయంలో[b] ఆయన మీతో ఉన్నాడు.”'
  rationale: ఈ సవరణ మూలంలోని విరుద్ధతను—‘మనిషి కోసం కాదు, యాహ్వే కోసం’—మరియు న్యాయతీర్పులో దైవసన్నిధి అనే విస్తృత భావాన్ని కాపాడుతుంది. దైవనామాన్ని జతచేసిన POB నిర్ణయానికి అనుగుణంగా మార్చి, న్యాయపరమైన క్రియను మరింత సహజమైన తెలుగులో ఇచ్చింది. రెండు పాదటిప్పణి సూచికలు తమ తమ సంబంధిత పదబంధాల వద్ద అలాగే ఉంచబడ్డాయి.
