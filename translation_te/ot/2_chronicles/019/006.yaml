id: 2CH.19.6
reference: 2 Chronicles 19:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶל הַ/שֹּֽׁפְטִ֗ים רְאוּ֙ מָֽה אַתֶּ֣ם עֹשִׂ֔ים כִּ֣י לֹ֧א לְ/אָדָ֛ם תִּשְׁפְּט֖וּ כִּ֣י לַ/יהוָ֑ה וְ/עִמָּ/כֶ֖ם בִּ/דְבַ֥ר מִשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/006.yaml
  text: And he said to the judges[a], “See what you are doing, for you are not judging for man, but for Yahweh[b], and he is with you in the matter of judgment.”
translation:
  language: te
  text: 'అతడు న్యాయాధిపతులతో ఇలా అన్నాడు: “మీరు చేస్తున్నదేమిటో జాగ్రత్తగా చూసుకోండి. ఎందుకంటే మీరు మనిషి కోసం[a] తీర్పు చెప్పడం లేదు; యాహ్వే కోసం తీర్పు చెబుతున్నారు. తీర్పు విషయంలో[b] ఆయన మీతో ఉన్నాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మానవుల కోసం’ అని కూడా అనువదించవచ్చు. హీబ్రూలో ‘మనిషి’ అనే పదం ఏకవచనంలో ఉన్నా, ఇక్కడ అది మానవులను సాధారణంగా సూచిస్తూ యాహ్వేతో విరుద్ధంగా ఉంచబడింది.
    reason: lexical_alternative
  - marker: b
    text: ‘న్యాయానికి సంబంధించిన విషయంలో’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదబంధం తీర్పు చెప్పే కార్యాన్నిగానీ, న్యాయ వ్యవహారాలను సాధారణంగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁפְטִים
  choice: న్యాయాధిపతులు
  rationale: שׁפט ధాతువు నుంచి వచ్చిన ఈ కృదంతం ఇక్కడ నామవాచకంగా వాడబడి, నియమించబడిన న్యాయ అధికారులను సూచిస్తుంది.
- source_word: רְאוּ מָה אַתֶּם עֹשִׂים
  choice: మీరు చేస్తున్నదేమిటో జాగ్రత్తగా చూసుకోండి
  rationale: రְאוּ అనే ఆజ్ఞ కేవలం చూడటమే కాక తమ న్యాయ నిర్వహణను శ్రద్ధగా పరిశీలించమనే హెచ్చరికను ఇస్తుంది; ఈ తెలుగు రూపం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְאָדָם
  choice: మనిషి కోసం
  rationale: אָדָם ఇక్కడ సమస్త మానవాళిని సూచించే ఏకవచన సాధారణ నామం; యెహోవాతో ఉన్న వాక్యనిర్మాణ విరుద్ధతను నిలుపుటకు ఏకవచనాన్ని ఉంచాం.
- source_word: תִּשְׁפְּטוּ
  choice: తీర్పు తీర్చడం
  rationale: ఈ క్రియ న్యాయాధికారాన్ని వినియోగించి తీర్పు ఇవ్వడాన్ని సూచిస్తుంది; తెలుగు న్యాయ సందర్భంలో ‘తీర్పు తీర్చడం’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: לַיהוָה
  choice: యెహోవా కోసం
  rationale: לְ ఉపసర్గ న్యాయాధిపతులు దేవుని తరఫున, ఆయనకు జవాబుదారులుగా తీర్పు చెబుతున్నారని సూచిస్తుంది. יהוה అనే దైవనామాన్ని తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: וְעִמָּכֶם
  choice: ఆయన మీతో ఉన్నాడు
  rationale: హీబ్రూలో క్రియ లేకున్నా, ముందున్న యెహోవాయే కర్త అని సందర్భం తెలియజేస్తుంది; తెలుగులో సంపూర్ణ వాక్యం కోసం ‘ఆయన ... ఉన్నాడు’ అని వ్యక్తం చేశాం.
- source_word: בִּדְבַר מִשְׁפָּט
  choice: తీర్పు చెప్పే విషయంలో
  rationale: דבר ఇక్కడ విషయం లేదా వ్యవహారాన్ని, משפט న్యాయ తీర్పు లేదా న్యాయాన్ని సూచిస్తాయి. ఈ అనువాదం న్యాయ కార్యాన్నీ, న్యాయ సంబంధ వ్యవహారాన్నీ పూర్తిగా సంకుచితం చేయకుండా ఉంచుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో ఒడంబడిక దైవనామం ప్రత్యక్షంగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా, సాధారణ తెలుగు పాఠకులకు పరిచితమైన లిప్యంతరీకరణతో నిలిపాం.
- issue: אָדָם అనే సాధారణ ఏకవచనం
  choice: మనిషి
  alternative: మనుష్యులు; మానవజాతి
  rationale: ఇది ఒక నిర్దిష్ట పురుషుణ్ణి కాక మానవుణ్ణి సాధారణంగా సూచిస్తుంది. అయినా మూలంలోని ఏకవచనాన్ని, ‘మనిషి కోసం—యెహోవా కోసం’ అనే బలమైన విరుద్ధతను కాపాడేందుకు ‘మనిషి’ని ఎంచుకున్నాం.
- issue: దేవుడు న్యాయాధిపతులతో ఉండటం అనే వాక్య భావం
  choice: తీర్పు చెప్పే విషయంలో ఆయన మీతో ఉన్నాడు
  alternative: మీరు తీర్పు చెప్పేటప్పుడు ఆయన మీతో ఉంటాడు
  rationale: హీబ్రూ వాక్యం దైవసన్నిధిని ప్రకటిస్తుంది; అది కేవలం సహాయం, సమ్మతి లేదా శిక్ష అని ప్రత్యేకంగా నిర్వచించదు. అందువల్ల ఆ ఉద్దేశపూర్వక విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే న్యాయపరమైన శైలిని వాడాం. ప్రత్యక్ష సంభాషణలో హెచ్చరిక బలాన్ని నిలిపి, అధిక సంస్కృతీకరణను నివారించాం. ప్రతి పాదటిప్పణి సూచికను సంబంధిత పదబంధం వెంట ప్రధాన పాఠ్యంలో ఉంచాం.
