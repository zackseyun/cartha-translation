id: 2CH.19.3
reference: 2 Chronicles 19:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֲבָ֕ל דְּבָרִ֥ים טוֹבִ֖ים נִמְצְא֣וּ עִמָּ֑/ךְ כִּֽי בִעַ֤רְתָּ הָ/אֲשֵׁרוֹת֙ מִן הָ/אָ֔רֶץ וַ/הֲכִינ֥וֹתָ לְבָבְ/ךָ֖ לִ/דְרֹ֥שׁ הָֽ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/003.yaml
  text: Nevertheless[a], good things have been found in you[b], because you have cleared the Asherah poles out of the land and have set your heart to seek God.
translation:
  language: te
  text: అయితే నీలో మంచి విషయాలు కనిపించాయి. ఎందుకంటే నీవు దేశంలోనుండి అషేరా పూజా స్తంభాలను[a] తొలగించి, దేవుణ్ణి వెదకడానికి నీ హృదయాన్ని సిద్ధపరచుకున్నావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అషేరోత్’; అంటే అషేరా దేవత పూజతో సంబంధమున్న పూజా వస్తువులు.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘నీ హృదయాన్ని స్థిరపరచుకున్నావు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: అయితే
  rationale: ముందున్న గద్దింపుకు విరుద్ధంగా ఇప్పుడు చెప్పబడే ప్రశంసను గంభీరమైన, సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: דְּבָרִים טוֹבִים
  choice: మంచి విషయాలు
  rationale: గుణాలు లేదా కార్యాలు అని భావాన్ని కుదించకుండా, హీబ్రూ పదబంధంలోని విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: נִמְצְאוּ עִמָּךְ
  choice: నీలో ... కనిపించాయి
  rationale: అక్షరార్థమైన ‘నీతో కనుగొనబడ్డాయి’ కంటే వ్యక్తిలో గుర్తించబడిన ప్రశంసనీయమైన అంశాలు అనే మూలభావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: בִעַרְתָּ
  choice: తొలగించి
  rationale: కాల్చివేయడం లేదా నిర్మూలించడం అనే సాధ్యమైన ఛాయలలో ఏ ఒక్క పద్ధతినీ నిర్బంధంగా నిర్ణయించకుండా, ఆ పూజా వస్తువులను దేశం నుండి నిశ్చయంగా తీసివేసిన భావాన్ని ఇస్తుంది.
- source_word: הָאֲשֵׁרוֹת
  choice: అషేరా పూజా స్తంభాలు
  rationale: అషేరాతో సంబంధమున్న బహువచన పూజా వస్తువులను ఆధునిక పాఠకుడు గుర్తించగలిగేలా అనువదిస్తుంది; సాంస్కృతిక వివరాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: מִן הָאָרֶץ
  choice: దేశంలోనుండి
  rationale: ఆ పూజా వస్తువులను ఆ ప్రాంతం నుండి తొలగించిన ప్రాదేశిక భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: וַהֲכִינוֹתָ לְבָבְךָ
  choice: నీ హృదయాన్ని సిద్ధపరచుకున్నావు
  rationale: ‘నీ హృదయాన్ని సిద్ధం చేశావు/స్థిరపరచావు’ అనే హీబ్రూ భావాన్ని, ఉద్దేశపూర్వక అంతరంగ నిశ్చయాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: לִדְרֹשׁ הָאֱלֹהִים
  choice: దేవుణ్ణి వెదకడానికి
  rationale: దేవుని వద్ద సమాచారం అడగడం మాత్రమే కాక, ఆయనవైపు తిరిగి ఆయనను అనుసరించాలనే దినవృత్తాంతాల గ్రంథంలోని విస్తృత ఒడంబడిక సంబంధిత భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: הָאֲשֵׁרוֹת అనే పూజా పదానికి అనువాదం
  choice: అషేరా పూజా స్తంభాలు
  alternative: అషేరా పూజా చిహ్నాలు; అషేరోత్
  rationale: ఇవి అషేరాతో సంబంధమున్న నిషిద్ధ పూజా వస్తువులని పాఠకునికి తెలియజేస్తూనే, అషేరా అనే పేరును నిలుపుతుంది. వాటి ఖచ్చిత రూపం గురించి పాదసూచిక అవసరమైన జాగ్రత్తను అందిస్తుంది.
- issue: לִדְרֹשׁ הָאֱלֹהִים యొక్క భావ పరిధి
  choice: దేవుణ్ణి వెదకడానికి
  alternative: దేవుని విచారించడానికి
  rationale: దినవృత్తాంతాలలో ఈ పదబంధం కేవలం దైవసలహా అడగడాన్ని కాక, దేవునివైపు మనస్సు నిలిపి ఆయనను ఆశ్రయించడాన్ని కూడా సూచిస్తుంది; ‘వెదకడం’ ఆ విస్తృతతను నిలుపుతుంది.
- issue: וַהֲכִינוֹתָ לְבָבְךָ లోని అంతరంగ నిశ్చయం
  choice: నీ హృదయాన్ని సిద్ధపరచుకున్నావు
  alternative: నీ హృదయాన్ని స్థిరపరచుకున్నావు
  rationale: మూలంలోని ‘సిద్ధం చేయడం/స్థిరపరచడం’ అనే అర్థసాధ్యతను పూర్తిగా ఒక వైపుకు పరిమితం చేయకుండా, దేవుణ్ణి వెదకడానికి చేసిన ఉద్దేశపూర్వక అంతరంగ సిద్ధతను వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘మంచి విషయాలు’ అనే విస్తృత పదబంధం మూలంలోని అనిర్దిష్టతను కాపాడుతుంది; ‘అషేరా’కు అవసరమైన సాంస్కృతిక వివరణ పాదసూచికలో ఉంచబడింది.
