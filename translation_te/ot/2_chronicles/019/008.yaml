source:
  edition: WLC
  text: וְ/גַ֣ם בִּ֠/ירוּשָׁלִַם הֶעֱמִ֨יד יְהוֹשָׁפָ֜ט מִן הַ/לְוִיִּ֣ם וְ/הַ/כֹּהֲנִ֗ים וּ/מֵ/רָאשֵׁ֤י הָ/אָבוֹת֙ לְ/יִשְׂרָאֵ֔ל לְ/מִשְׁפַּ֥ט יְהוָ֖ה וְ/לָ/רִ֑יב וַ/יָּשֻׁ֖בוּ יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/008.yaml
  text: Also in Jerusalem[a], Jehoshaphat appointed some of the Levites, the priests, and the heads of the fathers’ houses of Israel for the judgment of Yahweh and for disputes[b]; and they returned to Jerusalem.
translation:
  language: te
  text: యెహోషాపాతు యెరూషలేములో కూడా లేవీయులలో, యాజకులలో, ఇశ్రాయేలు పితృకుటుంబాల పెద్దలలో కొందరిని యాహ్వే తీర్పు కోసం[a], వివాదాల కోసం నియమించాడు. వారు యెరూషలేముకు తిరిగి వచ్చారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, యాహ్వే ధర్మశాస్త్రం ప్రకారం తీర్చవలసిన కేసుల కోసం అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'హెబ్రీ పాఠం ఇలా ఉంది: ‘వారు యెరూషలేముకు తిరిగి వచ్చారు.’ సందర్భంలో ఈ మాట కొంత ఆకస్మికంగా ఉండటంతో, కొందరు దీనిని ‘వారు యెరూషలేములో కూర్చున్నారు/నివసించారు’ అని భిన్నంగా అర్థం చేసుకుంటారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: కూడా
  rationale: ముందటి కార్యానికి అదనంగా యెరూషలేములో చేసిన నియామకాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הֶעֱמִיד
  choice: నియమించాడు
  rationale: ఈ పరిపాలనా, న్యాయ సందర్భంలో హిఫిల్ రూపం వ్యక్తులను ఒక బాధ్యతాయుతమైన స్థానంలో ఉంచడాన్ని సూచిస్తుంది.
- source_word: מִן הַלְוִיִּם וְהַכֹּהֲנִים וּמֵרָאשֵׁי הָאָבוֹת לְיִשְׂרָאֵל
  choice: లేవీయులలో, యాజకులలో, ఇశ్రాయేలు పితృకుటుంబాల పెద్దలలో కొందరిని
  rationale: מִן/מֵ యొక్క భాగార్థాన్ని ‘కొొందరిని’ స్పష్టం చేస్తుంది; ‘పితృకుటుంబాలు’ హెబ్రీ సామాజిక నిర్మాణాన్ని అనవసరంగా సాధారణీకరించకుండా నిలుపుతుంది.
- source_word: לְמִשְׁפַּט יְהוָה
  choice: యెహోవా తీర్పు కోసం
  rationale: ఇది యెహోవాకు చెందిన తీర్పునా, ఆయన ధర్మశాస్త్రం ప్రకారం జరిగే తీర్పునా, ఆయన తరఫున తీర్చే తీర్పునా అన్న వ్యాకరణ, భావ విస్తృతిని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: וְלָרִיב
  choice: వివాదాల కోసం
  rationale: న్యాయ సందర్భంలో רִיב వివాదం, వ్యాజ్యం లేదా న్యాయవిషయాన్ని సూచిస్తుంది; ‘వివాదాలు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: వారు యెరూషలేముకు తిరిగి వచ్చారు
  rationale: ప్రామాణిక హెబ్రీ పాఠంలోని שוב క్రియకు ఇది ప్రత్యక్ష అర్థం. సందర్భంలో ఆకస్మికంగా ఉన్నప్పటికీ దానిని ప్రధాన పాఠంలో సవరించలేదు.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ప్రత్యేక దైవనామ రూపాన్ని వాడి, దానిని సాధారణ బిరుదైన ‘ప్రభువు’గా మార్చలేదు.
- issue: לְמִשְׁפַּט יְהוָה యొక్క భావపరిధి
  choice: యెహోవా తీర్పు కోసం
  alternative: యెహోవా ధర్మశాస్త్రం ప్రకారం తీర్పు చెప్పడానికి
  rationale: ప్రత్యామ్నాయం భావాన్ని ఒక నిర్దిష్ట వివరణకు పరిమితం చేస్తుంది; ఎంపిక చేసిన రూపం మూలంలోని సంబంధార్థక అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల శైలిని ఉపయోగించాం. న్యాయపరమైన భావాన్ని నిలుపుతూ అతిగా సాంకేతికమైన పదాలను నివారించాం; చివరి వాక్యంలోని మూలపాఠ అసహజతను పాదటిప్పణిలో తెలియజేశాం.
