  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י אֲבִיָּ֔ה וּ/דְרָכָ֖י/ו וּ/דְבָרָ֑י/ו כְּתוּבִ֕ים בְּ/מִדְרַ֖שׁ הַ/נָּבִ֥יא עִדּֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/022.yaml
  text: The rest of the acts of Abijah[a], and his ways and his sayings, are written in the midrash of the prophet Iddo.
translation:
  language: te
  text: అబీయా యొక్క మిగిలిన కార్యాలు, అతని నడవడి, అతని మాటలు—ఇవన్నీ ప్రవక్త ఇద్దోకు చెందిన మిద్రాష్‌లో[a] నమోదు చేయబడి ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వ్యాఖ్యానం,’ ‘వివరణ,’ లేదా మరింత సాధారణంగా ‘లిఖిత వృత్తాంతం.’ ఇక్కడి హీబ్రూ పదమైన ‘మిద్రాష్’ పరిశీలనతో కూడిన లేదా వివరణాత్మకమైన లిఖిత రచనను సూచిస్తుంది; తరువాత పూర్తిగా రూపుదిద్దుకున్న రబ్బీనీయ సాహిత్య ప్రక్రియనే ఇది తప్పనిసరిగా సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֲבִיָּה
  choice: అబీయా చేసిన మిగిలిన కార్యాలు
  rationale: రాజుల చరిత్రను ముగించే సూత్రప్రాయ వాక్యాల్లో דִּבְרֵי అనేది కేవలం ‘మాటలు’ కాకుండా కార్యాలు లేదా జీవిత సంఘటనలను సూచిస్తుంది. తెలుగు చారిత్రక శైలిలో ఈ భావాన్ని సహజంగా వ్యక్తపరచడానికి ‘చేసిన మిగిలిన కార్యాలు’ అని అనువదించాం.
- source_word: וּדְרָכָיו
  choice: అతని నడవడి
  rationale: דֶּרֶךְ అనే ‘మార్గం’ రూపకం ఇక్కడ వ్యక్తి ప్రవర్తన లేదా జీవన విధానాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘నడవడి’ ఆ భావాన్ని స్పష్టంగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: וּדְבָרָיו
  choice: అతని మాటలు
  rationale: ముందటి דִּבְרֵי చారిత్రక కార్యాలను సూచిస్తుండగా, ఇక్కడి రూపం అబీయా పలికిన లేదా లిఖితంగా భద్రపరచబడిన మాటలను సూచించే అవకాశం ఉంది. ఆ భేదాన్ని నిలుపుతూ నేరుగా ‘మాటలు’ అని ఇచ్చాం.
- source_word: כְּתוּבִים
  choice: నమోదు చేయబడి ఉన్నాయి
  rationale: ఈ నిష్క్రియ కృదంతం విషయాలు లిఖిత రూపంలో ఉన్నాయని తెలియజేస్తుంది. ‘రాయబడి ఉన్నాయి’ కూడా సాధ్యమే; అయితే రచనలో భద్రపరచబడిన చారిత్రక సమాచారమనే సందర్భార్థాన్ని ‘నమోదు చేయబడి ఉన్నాయి’ సహజంగా తెలియజేస్తుంది.
- source_word: בְּמִדְרַשׁ
  choice: మిద్రాష్‌లో[a]
  rationale: ప్రత్యేకమైన హీబ్రూ పదాన్ని సాధారణ ‘వృత్తాంతం’గా సమతలీకరించకుండా లిప్యంతరీకరించాం. పాఠకులకు అర్థమయ్యే ప్రత్యామ్నాయ భావాలను పాదసూచికలో ఇచ్చాం.
- source_word: הַנָּבִיא עִדּוֹ
  choice: ఇద్దో ప్రవక్త రాసిన
  rationale: ఈ సంబంధ నిర్మాణం గ్రంథం ఇద్దో ప్రవక్తకు చెందినదని సూచిస్తుంది; రచయితత్వం అత్యంత సహజమైన సందర్భార్థం. అందుకే తెలుగులో ‘రాసిన’ అని వ్యక్తపరచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక శైలిని ఉపయోగించాం. మూలంలోని మూడు అంశాలైన కార్యాలు, నడవడి, మాటలు అనే భేదాన్ని నిలిపాం. వాక్యాన్ని తెలుగు ప్రవాహానికి అనుగుణంగా అమర్చి, ‘ఇవన్నీ’తో బహువచన కర్తను స్పష్టం చేశాం.
