id: 2CH.13.5
reference: 2 Chronicles 13:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ/לֹ֤א לָ/כֶם֙ לָ/דַ֔עַת כִּ֞י יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל נָתַ֨ן מַמְלָכָ֧ה לְ/דָוִ֛יד עַל יִשְׂרָאֵ֖ל לְ/עוֹלָ֑ם ל֥/וֹ וּ/לְ/בָנָ֖י/ו בְּרִ֥ית מֶֽלַח׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/005.yaml
  text: Do you not know that Yahweh[a], the God of Israel, gave the kingdom over Israel to David forever, to him and to his sons[b], by a covenant of salt?
translation:
  language: te
  text: ఇశ్రాయేలు దేవుడైన యాహ్వే[a], ఇశ్రాయేలుపై రాజ్యాధికారాన్ని దావీదుకు—అతనికీ, అతని కుమారులకూ[b]—ఉప్పు నిబంధన[c] ద్వారా శాశ్వతంగా ఇచ్చాడని మీకు తెలియదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలపాఠంలో ఇక్కడ దేవుని వ్యక్తిగత నామమైన יהוה (YHWH) ఉంది.
    reason: divine_name
  - marker: b
    text: “అతని కుమారులు” అనేది దావీదు రాజవంశాన్ని, అంటే అతని సింహాసన వారసులను సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా “ఉప్పు నిబంధనతో.” ఈ పదబంధం బంధించే, నిలకడైన నిబంధనను సూచించే అవకాశం ఉంది; సంఖ్యాకాండం 18:19తో పోల్చండి.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא ... לָכֶם לָדַעַת
  choice: మీకు తెలియదా?
  rationale: అంగీకారాన్ని ఆశించే అలంకారప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; సందర్భంలోని సవాలు చేసే ధ్వనిని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ దైవనామాన్ని తెలుగులో సుపరిచితమైన రూపంలో లిప్యంతరీకరిస్తుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: హీబ్రూ సంయుక్త పదబంధానికి నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: נָתַן
  choice: ఇచ్చాడు
  rationale: చారిత్రక ప్రకటనలోని సాధారణ భూతకాల భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: מַמְלָכָה ... עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుపై రాజ్యాధికారం
  rationale: ఇక్కడ కేవలం భూభాగం కంటే ఇశ్రాయేలును పాలించే రాజరిక హక్కు ప్రధానంగా ఉంది; ‘రాజ్యాధికారం’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְעוֹלָם
  choice: శాశ్వతంగా
  rationale: వచనంలోని నిరంతరమైన నిబంధనాత్మక కాలవ్యాప్తిని వ్యాఖ్యానించి పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: לוֹ וּלְבָנָיו
  choice: అతనికి, అతని కుమారులకు
  rationale: మూలంలోని ‘కుమారులు’ అనే కుటుంబపరమైన పదాన్ని నిలుపుతుంది; రాజవంశ వారసత్వ సూచనను పాదటిప్పణిలో వివరిస్తుంది.
- source_word: בְּרִית מֶלַח
  choice: ఉప్పు నిబంధన ద్వారా
  rationale: హీబ్రూ సాంస్కృతిక-నిబంధనాత్మక రూపకాన్ని వ్యాఖ్యానాత్మకంగా ‘శాశ్వత నిబంధన’గా మార్చకుండా యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: దావీదుకు ఇచ్చిన రాజ్యాధికారం మరియు దాని శాశ్వతత్వం
  choice: ‘శాశ్వతంగా’ మరియు ‘ఉప్పు నిబంధన’ అనే రెండు మూలపాఠ భావాలనూ ప్రధాన పాఠంలో నిలుపడం
  alternative: ‘ఉప్పు నిబంధన’ను ‘శాశ్వత నిబంధన’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: మూలపాఠం לְעוֹלָם మరియు בְּרִית מֶלַח రెండింటినీ ఉపయోగిస్తుంది. రెండింటినీ నిలపడం నిబంధన యొక్క స్థిరత్వాన్ని కాపాడుతూ, తరువాతి సిద్ధాంతపరమైన నిర్ణయాలను అనువాదంలోకి దిగుమతి చేయకుండా ఉంటుంది.
- issue: ‘కుమారులు’ అనే పదం యొక్క రాజవంశ భావం
  choice: ప్రధాన పాఠంలో ‘కుమారులు’ అని ఉంచి, రాజవంశ సూచనను పాదటిప్పణిలో తెలపడం
  alternative: ప్రధాన పాఠంలో ‘వంశస్థులు’ లేదా ‘రాజవంశం’ అని అనువదించడం
  rationale: హీబ్రూ పదం యొక్క స్పష్టమైన పురుష కుటుంబపరమైన రూపాన్ని కాపాడుతూ, సందర్భంలో ఉన్న వంశపారంపర్య రాజరిక భావాన్ని పాఠకునికి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. అలంకారప్రశ్న యొక్క నేరత్వం, దైవనామం, రాజరిక అధికారం, ‘శాశ్వతంగా’ అనే కాలభావం, ‘ఉప్పు నిబంధన’ అనే సాంస్కృతిక రూపకం అన్నీ నిలుపబడ్డాయి.
