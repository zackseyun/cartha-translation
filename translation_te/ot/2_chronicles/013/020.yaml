id: 2CH.13.20
reference: 2 Chronicles 13:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹֽא עָצַ֧ר כֹּֽחַ יָרָבְעָ֛ם ע֖וֹד בִּ/ימֵ֣י אֲבִיָּ֑הוּ וַ/יִּגְּפֵ֥/הוּ יְהוָ֖ה וַ/יָּמֹֽת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/020.yaml
  text: Jeroboam no longer retained strength in the days of Abijah[a], and Yahweh struck him, and he died.
translation:
  language: te
  text: అబీయా కాలంలో యెరోబాము ఇక తన శక్తిని నిలుపుకోలేదు. యహ్వే అతన్ని దెబ్బతీశాడు[a]; అతడు చనిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యహ్వే అతన్ని బాధించాడు,’ ‘యహ్వే అతనికి తెగులు కలిగించాడు.’ హీబ్రూ మూలంలో యహ్వే యెరోబామును ‘దెబ్బతీశాడు’ అని మాత్రమే ఉంది; అది ఏ విధంగా జరిగిందో పేర్కొనలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָצַר כֹּחַ
  choice: తన బలాన్ని నిలుపుకోలేకపోయాడు
  rationale: עָצַר (‘నిలుపుకోవడం, అదుపులో ఉంచడం’) మరియు כֹּחַ (‘బలం, శక్తి’) అనే పదాల భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; దీనిని కేవలం సైనిక విజయానికి పరిమితం చేయదు.
- source_word: עוֹד
  choice: ఇక
  rationale: לֹאతో కూడిన עוֹד ఇక్కడ ‘ఇకపై కాదు/ఇక లేదు’ అనే భావాన్ని ఇస్తుంది.
- source_word: בִּימֵי אֲבִיָּהוּ
  choice: అబీయా కాలంలో
  rationale: అబీయా జీవించిన లేదా పరిపాలించిన సమయంలో అని సూచించే సహజమైన తెలుగు కాలవాచక ప్రయోగం.
- source_word: וַיִּגְּפֵהוּ
  choice: అతన్ని దెబ్బతీశాడు
  rationale: נגף దేవుడు కలిగించిన దెబ్బ, తెగులు లేదా ఓటమిని సూచించగలదు. ‘దెబ్బతీశాడు’ అనేది దాని విధానాన్ని నిర్దిష్టం చేయకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించింది.
- source_word: וַיָּמֹת
  choice: అతడు చనిపోయాడు
  rationale: సాధారణ కథన క్రమాన్ని నేరుగా వ్యక్తం చేస్తుంది; కారణ సంబంధాన్ని మూలం చెప్పినదానికంటే ఎక్కువగా నిర్దేశించదు.
theological_decisions:
- issue: וַיִּגְּפֵהוּ יְהוָהలో దైవిక చర్య స్వభావం
  choice: యహ్వే యెరోబామును దెబ్బతీశాడని, తరువాత అతడు చనిపోయాడని నేరుగా చెప్పడం
  alternative: యహ్వే అతనికి వ్యాధి కలిగించాడు; లేదా యుద్ధంలో వెంటనే అతన్ని హతమార్చాడు
  rationale: హీబ్రూ వాక్యం యెరోబాము మరణానికి ముందు యహ్వే చేసిన చర్యను స్పష్టంగా పేర్కొంటుంది; అయితే అది వ్యాధి, యుద్ధగాయం లేదా మరేదైనా సాధనమా అని చెప్పదు. అందువల్ల అనిశ్చితిని అలాగే ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘కాలంలో’ అనే సహజ ప్రయోగంతో హీబ్రూ కాలసూచనను అందించగా, ‘దెబ్బతీశాడు’ ద్వారా మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను కాపాడింది.
