  to: యాహ్వే యాజకులను—అహరోను కుమారులను, లేవీయులను—మీరు వెళ్లగొట్టి, దేశాల ప్రజల మాదిరిగా మీ కోసం యాజకులను ఏర్పరచుకోలేదా? ఒక కోడెదూడతోనూ ఏడు పొట్టేళ్లతోనూ తన చేతిని నింపుకోవడానికి[a] వచ్చే ప్రతివాడూ దేవుళ్లు కానివాటికి[b] యాజకుడవుతాడు.
