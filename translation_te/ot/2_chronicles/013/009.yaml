id: 2CH.13.9
reference: 2 Chronicles 13:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ/לֹ֤א הִדַּחְתֶּם֙ אֶת כֹּהֲנֵ֣י יְהוָ֔ה אֶת בְּנֵ֥י אַהֲרֹ֖ן וְ/הַ/לְוִיִּ֑ם וַ/תַּעֲשׂ֨וּ לָ/כֶ֤ם כֹּהֲנִים֙ כְּ/עַמֵּ֣י הָ/אֲרָצ֔וֹת כָּל הַ/בָּ֗א לְ/מַלֵּ֨א יָד֜/וֹ בְּ/פַ֤ר בֶּן בָּקָר֙ וְ/אֵילִ֣ם שִׁבְעָ֔ה וְ/הָיָ֥ה כֹהֵ֖ן לְ/לֹ֥א אֱלֹהִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/009.yaml
  text: Have you not driven out the priests of Yahweh[a], the sons of Aaron and the Levites[b], and made priests for yourselves like the peoples of the lands? Whoever comes to fill his hand with a young bull and seven rams becomes a priest of what are not gods.
translation:
  language: te
  text: యాహ్వే యాజకులను—అహరోను కుమారులను, లేవీయులను—మీరు వెళ్లగొట్టి, దేశాల ప్రజల మాదిరిగా మీ కోసం యాజకులను ఏర్పరచుకోలేదా? ఒక కోడెదూడతోనూ ఏడు పొట్టేళ్లతోనూ తన చేతిని నింపుకోవడానికి[a] వచ్చే ప్రతివాడూ దేవుళ్లు కానివాటికి[b] యాజకుడవుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘తన చేతిని నింపుకోవడం’; ఇది ఒకరిని యాజకునిగా ప్రతిష్ఠించడం లేదా నియమించడం అనే సాంకేతిక నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: ‘దేవుళ్లు కానివాటికి’ అని హీబ్రూ అక్షరార్థంగా చెబుతుంది. ‘దేవుళ్లు కానివారి కోసం’ లేదా ‘అబద్ధ దేవుళ్లకు’ అని కూడా అనువదించవచ్చు; ఆ ఆరాధ్య వస్తువులు నిజమైన దేవుళ్లు కావని ఇది నిరాకరిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא
  choice: ఏర్పరచుకోలేదా?
  rationale: అంగీకారాన్ని ఆశించే గద్దింపు ధోరణిగల అలంకార ప్రశ్నను తెలుగు ప్రతికూల ప్రశ్న రూపంలో సహజంగా నిలిపింది.
- source_word: הִדַּחְתֶּם
  choice: వెళ్లగొట్టి
  rationale: హిఫీల్ రూపంలోని బలవంతపు తొలగింపు లేదా బహిష్కరణ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כֹּהֲנֵי יְהוָה
  choice: యెహోవా యాజకులను
  rationale: నిబంధనాత్మక దైవనామాన్ని లిప్యంతరీకరించి, సంబంధ నిర్మాణాన్ని నేరుగా అనువదించింది.
- source_word: בְּנֵי אַהֲרֹן וְהַלְוִיִּם
  choice: అహరోను కుమారులను, లేవీయులను
  rationale: అహరోను యాజక వంశాన్నీ లేవీయులనూ వేర్వేరుగా పేర్కొనే మూలపాఠ నిర్మాణాన్ని నిలిపింది.
- source_word: וַתַּעֲשׂוּ לָכֶם כֹּהֲנִים
  choice: మీ కోసం యాజకులను ఏర్పరచుకొని
  rationale: עשה యొక్క నియామక భావాన్నీ לָכֶם లోని స్వప్రయోజన ఛాయనూ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כְּעַמֵּי הָאֲרָצוֹת
  choice: దేశాల ప్రజల మాదిరిగా
  rationale: ‘అన్యులు’ లేదా ‘విగ్రహారాధకులు’ వంటి అదనపు వర్గీకరణను చేర్చకుండా మూలంలోని జాతి-దేశ సంబంధ పదబంధాన్ని అనుసరిస్తుంది.
- source_word: כָּל הַבָּא
  choice: వచ్చే ప్రతివాడూ
  rationale: ఎవరినైనా అనుమతించే వ్యవస్థపై విమర్శను సూచించే సాధారణ ఏకవచన నిర్మాణాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְמַלֵּא יָדוֹ
  choice: తన చేతిని నింపుకోవడానికి
  rationale: యాజక ప్రతిష్ఠాపనకు సంబంధించిన సాంకేతిక హీబ్రూ నుడికారాన్ని వివరణలో కలిపేయకుండా పాఠ్యంలో నిలిపింది; భావం పాదసూచికలో వివరించబడింది.
- source_word: בְּפַר בֶּן בָּקָר וְאֵילִם שִׁבְעָה
  choice: ఒక కోడెదూడతోనూ ఏడు పొట్టేళ్లతోనూ
  rationale: ప్రతిష్ఠాపనకు తెచ్చే బలి జంతువులను సంఖ్యతో సహా స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: וְהָיָה כֹהֵן
  choice: యాజకుడవుతాడు
  rationale: ఆ ప్రక్రియ ఫలితంగా లభించే హోదాను సాధారణ వర్తమాన రూపంలో తెలియజేస్తుంది.
- source_word: לְלֹא אֱלֹהִים
  choice: దేవుళ్లు కానివాటికి
  rationale: ఆ ఆరాధ్య వస్తువులు నిజంగా దేవుళ్లు కావనే హీబ్రూ వాక్యపు వాదనాత్మక నిరాకరణను నిలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ప్రత్యేక నిబంధనాత్మక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యమైన రూపంలో లిప్యంతరీకరించింది.
- issue: לְלֹא אֱלֹהִים యొక్క భావం
  choice: దేవుళ్లు కానివాటికి
  alternative: అబద్ధ దేవుళ్లకు
  rationale: కేవలం వర్గీకరణ చేయకుండా, అవి నిజంగా దేవుళ్లు కావనే మూలపాఠంలోని తీక్షణమైన నిరాకరణను కాపాడుతుంది.
- issue: యాజక ప్రతిష్ఠాపన నుడికారం
  choice: తన చేతిని నింపుకోవడానికి
  alternative: యాజకునిగా ప్రతిష్ఠించుకోవడానికి
  rationale: వివరణాత్మక ప్రత్యామ్నాయం భావాన్ని స్పష్టం చేసినా, మూలంలోని ప్రత్యేక ఆచార నుడికారాన్ని చెరిపేస్తుంది; అందువల్ల నుడికారాన్ని పాఠ్యంలో ఉంచి పాదసూచికలో వివరించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలిని వాడింది. అలంకార ప్రశ్నలోని గద్దింపు ధోరణిని నిలిపింది. మూలంలోని యాజక సంబంధ సాంకేతిక నుడికారాన్ని పాఠ్యంలో ఉంచి, సాధారణ పాఠకుని కోసం పాదసూచికలో వివరించింది.
