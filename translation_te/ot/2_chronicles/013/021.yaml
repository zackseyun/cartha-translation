id: 2CH.13.21
reference: 2 Chronicles 13:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתְחַזֵּ֣ק אֲבִיָּ֔הוּ וַ/יִּ֨שָּׂא ל֔/וֹ נָשִׁ֖ים אַרְבַּ֣ע עֶשְׂרֵ֑ה וַ/יּ֗וֹלֶד עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ בָּנִ֔ים וְ/שֵׁ֥שׁ עֶשְׂרֵ֖ה בָּנֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/021.yaml
  text: And Abijah grew strong[b][a], and he took for himself fourteen wives and fathered twenty-two sons and sixteen daughters.
translation:
  language: te
  text: అబీయా బలపడ్డాడు[a]. అతడు పద్నాలుగు మంది స్త్రీలను భార్యలుగా చేసుకున్నాడు[b]; అతనికి ఇరవై ఇద్దరు కుమారులు, పదహారు మంది కుమార్తెలు పుట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శక్తిమంతుడయ్యాడు’ లేదా ‘తనను తాను బలపరచుకున్నాడు.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘తనకొరకు పద్నాలుగు మంది భార్యలను తీసుకున్నాడు’; ఇది వారిని వివాహం చేసుకున్నాడని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: బలపడ్డాడు
  rationale: חזק హిత్‌పయేల్ రూపం బలం లేదా స్థిరత్వం పెరగడాన్ని సూచిస్తుంది. ‘బలపడ్డాడు’ సహజమైన ఆధునిక తెలుగు; రాజకీయ లేదా సైనిక శక్తి అని అతిగా నిర్దిష్టం చేయదు.
- source_word: אֲבִיָּהוּ
  choice: అబీయా
  rationale: హీబ్రూ పేరుకు తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపం.
- source_word: וַיִּשָּׂא לוֹ נָשִׁים אַרְבַּע עֶשְׂרֵה
  choice: అతడు పద్నాలుగు మంది స్త్రీలను భార్యలుగా చేసుకున్నాడు
  rationale: నాసా + నాషీమ్ అనేది వివాహం చేసుకోవడాన్ని తెలిపే హీబ్రూ నుడికారం. ఈ తెలుగు రూపం ‘తనకొరకు’ అనే భావాన్ని సహజంగా ఇముడ్చుతూ, వారిని భార్యలుగా స్వీకరించాడనే అర్థాన్ని స్పష్టం చేస్తుంది.
- source_word: וַיּוֹלֶד
  choice: అతనికి ... పుట్టారు
  rationale: యలద్ హిఫీల్ పురుష కర్తతో సంతానాన్ని కనడం/తండ్రి కావడం అనే భావం ఇస్తుంది. తెలుగులో ‘అతనికి ... పుట్టారు’ సహజంగా పితృత్వాన్ని తెలియజేస్తుంది.
- source_word: עֶשְׂרִים וּשְׁנַיִם בָּנִים
  choice: ఇరవై ఇద్దరు కుమారులు
  rationale: మూలంలోని సంఖ్యను, పురుష సంతాన సూచనను యథాతథంగా ఉంచుతుంది.
- source_word: וְשֵׁשׁ עֶשְׂרֵה בָּנוֹת
  choice: పదహారు మంది కుమార్తెలు
  rationale: మూలంలోని సంఖ్యను, స్త్రీ సంతాన సూచనను యథాతథంగా ఉంచుతుంది.
theological_decisions:
- issue: బహుభార్యత్వ వివరణ
  choice: ‘పద్నాలుగు మంది స్త్రీలను భార్యలుగా చేసుకున్నాడు’ అని విలువతీర్పు లేకుండా కథనాత్మకంగా అనువదించడం
  alternative: ‘పద్నాలుగు మందిని వివాహం చేసుకున్నాడు’ అని మరింత సంక్షిప్తంగా చెప్పడం లేదా ఆ ఆచారంపై నైతిక వ్యాఖ్యను చేర్చడం
  rationale: వచనం అబీయా చేసిన పనిని మాత్రమే నివేదిస్తుంది; దానిని స్పష్టంగా ప్రశంసించదు, ఖండించదు. అందువల్ల అనువాదం మూలంలో లేని నైతిక లేదా సిద్ధాంతపరమైన తీర్పును చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. మూలంలోని భావసందిగ్ధతను [a]లో, వివాహ నుడికారాన్ని [b]లో సంరక్షించాం.
