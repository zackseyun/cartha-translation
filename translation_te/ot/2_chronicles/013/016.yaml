source:
  edition: WLC
  text: וַ/יָּנ֥וּסוּ בְנֵי יִשְׂרָאֵ֖ל מִ/פְּנֵ֣י יְהוּדָ֑ה וַ/יִּתְּנֵ֥/ם אֱלֹהִ֖ים בְּ/יָדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/016.yaml
  text: And the sons of Israel fled before Judah[c][b][a], and God gave them into their hand.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు[a] యూదా ఎదుటనుండి పారిపోయారు. దేవుడు వారిని యూదావారి చేతికి అప్పగించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలీయులు.’ హీబ్రూ మూలంలో ‘ఇశ్రాయేలు కుమారులు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థం ‘వారి చేతికి.’ ఇక్కడ ‘చేతికి’ అనేది వారి అధికారం లేదా ఆధీనంలోకి అని తెలిపే నుడికారం; ‘వారి’ అనేది యూదా పక్షాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנ֥וּסוּ
  choice: పారిపోయారు
  rationale: נוּס అనే క్రియ యుద్ధంలో శత్రువు ఎదుటనుండి పారిపోవడం లేదా వెనుదిరగడం అనే భావాన్ని ఇస్తుంది. ‘పారిపోయారు’ ఆధునిక తెలుగులో సహజంగా ఉండి సైనిక సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని ‘కుమారులు’ అనే రూపాన్ని నిలుపుతూ, అది ఇశ్రాయేలీయులను సూచించే సమూహపదమని పాదటిప్పణిలో తెలియజేశాం.
- source_word: מִפְּנֵי יְהוּדָה
  choice: యూదా ఎదుటనుండి
  rationale: מִפְּנֵי అనే పదబంధం అక్షరార్థంగా ‘ఎదుటనుండి’ అని, ఈ యుద్ధసందర్భంలో యూదా సైన్యం ఎదుటనుండి పారిపోవడాన్ని సూచిస్తుంది. మూలంలో లేని ‘యూదా మనుషులు’ అనే వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: וַיִּתְּנֵם
  choice: వారిని ... అప్పగించాడు
  rationale: נתן ఇక్కడ దేవుడు ఓడిపోయిన వారిని ప్రత్యర్థి అధికారానికి ఇచ్చాడనే సైనిక భావంలో వాడబడింది. ‘అప్పగించాడు’ తెలుగులో ఈ భావాన్ని సహజంగా వ్యక్తం చేస్తూ దేవుని ప్రత్యక్ష కార్యాన్ని నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: మూలపాఠ్యంలో దైవనామం יהוה కాక אֱלֹהִים ఉంది; అందువల్ల ‘ప్రభువు’ కాక ‘దేవుడు’ అని అనువదించాం.
- source_word: בְּיָדָם
  choice: యూదావారి చేతికి
  rationale: హీబ్రూలో అక్షరార్థంగా ‘వారి చేతికి’ ఉన్నా, తెలుగులో ఆ సర్వనామం ఇశ్రాయేలు కుమారులను సూచించినట్లు అపార్థమవవచ్చు. సందర్భంలోని బహువచన సూచన యూదా పక్షానికే చెందినందున ‘యూదావారి’ అని స్పష్టం చేసి, ‘చేతికి’ అనే అధికారాన్ని సూచించే నుడికారాన్ని నిలిపాం.
theological_decisions:
- issue: యుద్ధ ఫలితంలో దేవుని కార్యసాధకత్వం
  choice: దేవుడు వారిని యూదావారి చేతికి అప్పగించాడు
  alternative: దేవుడు వారు యూదావారి చేతికి చిక్కేలా అనుమతించాడు
  rationale: దేవుడు కర్తగా ఉన్న נתן క్రియ యుద్ధ ఫలితాన్ని ఆయన ప్రత్యక్ష కార్యానికి ఆపాదిస్తుంది. దాన్ని కేవలం అనుమతిగా మృదువుపరచకుండా మూలంలోని బలాన్ని నిలిపాం.
- issue: ఇశ్రాయేలు మరియు యూదా అనే సమూహాల గుర్తింపు
  choice: ఇశ్రాయేలు కుమారులు ... యూదా
  alternative: ఇశ్రాయేలీయులు ... యూదావారు
  rationale: మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ మరియు ‘యూదా’ అనే అసమాన రూపాలను యథాశక్తి నిలిపాం. చారిత్రకంగా ఇవి ఉత్తర రాజ్యపు సైన్యానికీ యూదా పక్షానికీ సూచనలైనా, ప్రధాన పాఠ్యంలో అదనపు వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘యూదా ఎదుటనుండి’ మూలంలోని స్థలసంబంధ నుడికారాన్ని నిలుపుతుంది; ‘యూదావారి చేతికి అప్పగించాడు’ మాత్రం తెలుగులో సర్వనామ సందిగ్ధతను తొలగిస్తూ హీబ్రూ అధికార-నుడికారాన్ని సహజంగా వ్యక్తం చేస్తుంది.
