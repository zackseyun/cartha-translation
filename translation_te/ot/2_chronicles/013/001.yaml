  text: In the eighteenth year of King Jeroboam[a], Abijah became king over Judah.
translation:
  language: te
  text: యెరోబాము రాజు పరిపాలనలోని పద్దెనిమిదవ సంవత్సరంలో[a], అబీయా యూదాపై రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 రాజులు 15:1లోని సమాంతర వృత్తాంతంలో అబీయాను ‘అబీయాము’ అని పిలిచారు; ఈ దినవృత్తాంతములు గ్రంథంలో మాత్రం ‘అబీయా’ అని ఉంది.
    reason: cross_reference
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁמוֹנֶה עֶשְׂרֵה
  choice: పరిపాలనలో పద్దెనిమిదవ సంవత్సరంలో
  rationale: ఇది రాజు పరిపాలన సంవత్సరాన్ని సూచించే హీబ్రూ కాలనిర్ణయ సూత్రం. తెలుగులో సహజంగా, స్పష్టంగా ఉండేందుకు ‘పరిపాలనలో’ అని వ్యక్తం చేశాం.
- source_word: לַ/מֶּלֶךְ יָרָבְעָם
  choice: యెరోబాము రాజు
  rationale: లామెద్‌తో కూడిన ఈ రూపం ఎవరి పరిపాలనా సంవత్సరం లెక్కించబడుతోందో సూచిస్తుంది; తెలుగులో పేరు తరువాత ‘రాజు’ ఉంచడం సహజం.
- source_word: וַ/יִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: מלך క్రియ ఇక్కడ రాజ్యాధికారాన్ని చేపట్టడాన్ని సూచిస్తుంది. ‘రాజయ్యాడు’ ఆ ఆరంభార్థాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אֲבִיָּה
  choice: అబీయా
  rationale: దినవృత్తాంతముల గ్రంథంలోని అబీయా అనే నామరూపాన్ని ప్రతిలిపి చేశాం; సమాంతర రాజుల గ్రంథంలోని అబీయాము రూపాన్ని ప్రధాన పాఠ్యంలోకి తీసుకురాలేదు.
- source_word: עַל יְהוּדָה
  choice: యూదాపై
  rationale: מלךతో వాడిన עַל పాలనా పరిధిని సూచిస్తుంది; ‘యూదాపై’ మూలంలోని నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
