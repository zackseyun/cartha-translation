translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన చారిత్రక వచనశైలి. రాజ్యారోహణ భావాన్ని ‘రాజయ్యాడు’తో, పరిపాలనా సంవత్సర సూత్రాన్ని సహజమైన తెలుగు పదక్రమంతో అందించాం.
