  source_fidelity: మొదటి వాక్యంలో ‘తీవ్రంగా దెబ్బతీశారు’ అనేది מַכָּה רַבָּה (‘గొప్ప దెబ్బ’) అనే నామవాచక పదబంధాన్ని క్రియావిశేషణంగా మారుస్తుంది. మూలంలోని ‘గొప్ప దెబ్బ’ భావాన్ని స్పష్టంగా ఉంచడం మంచిది. రెండవ వాక్యం మరణించినవారు ఇశ్రాయేలు నుండి/ఇశ్రాయేలు వారిలోనివారని, అలాగే వారు హతులై ‘పడిపోయారని’ విశ్వసనీయంగా తెలియజేస్తుంది.
