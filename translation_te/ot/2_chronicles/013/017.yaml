  terminology: అబీయా, ఇశ్రాయేలు, ప్రజలు, హతులై పడిపోయారు అనే పదాలు మూలపాఠానికి మరియు సాధారణ తెలుగు బైబిలు శైలికి అనుకూలంగా ఉన్నాయి. ‘ఎంపికైన’ అనేది בָּחוּר యొక్క ఎంపికైన/శ్రేష్ఠమైన యోధుల భావాన్ని, అదనపు వ్యాఖ్యానం లేకుండా, అందిస్తుంది.
