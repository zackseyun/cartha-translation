id: 2CH.13.17
reference: 2 Chronicles 13:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּכּ֥וּ בָ/הֶ֛ם אֲבִיָּ֥ה וְ/עַמּ֖/וֹ מַכָּ֣ה רַבָּ֑ה וַ/יִּפְּל֤וּ חֲלָלִים֙ מִ/יִּשְׂרָאֵ֔ל חֲמֵשׁ מֵא֥וֹת אֶ֖לֶף אִ֥ישׁ בָּחֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/017.yaml
  text: Abijah and his people struck them with a great blow[b][a], and five hundred thousand chosen men of Israel fell slain.
translation:
  language: te
  text: అబీయా మరియు అతని ప్రజలు వారిపై గొప్ప దెబ్బ కొట్టారు[a]. ఇశ్రాయేలు వారిలో ఎంపికైన ఐదు లక్షల మంది హతులై పడిపోయారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “గొప్ప దెబ్బ.” లేదా “తీవ్రమైన దెబ్బ,” “గొప్ప సంహారం.”
    reason: lexical_alternative
  - marker: b
    text: “ఎంపికైనవారు” అనే మాటను “ఎంపిక చేసిన యోధులు” లేదా “శ్రేష్ఠమైన మనుష్యులు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ בָהֶם
  choice: వారిని ... దెబ్బతీశారు
  rationale: נכה అనే క్రియ యుద్ధ సందర్భంలో కొట్టడం లేదా దెబ్బతీయడం అనే స్పష్టమైన భావాన్ని ఇస్తుంది; తరువాతి వాక్యభాగమే మరణాలను తెలియజేస్తుంది కాబట్టి ఇక్కడే ‘చంపారు’ అని అనువదించలేదు.
- source_word: אֲבִיָּה וְעַמּוֹ
  choice: అబీయా, అతని ప్రజలు
  rationale: עַם యొక్క ప్రాథమిక భావమైన ‘ప్రజలు’ను నిలుపుతూ, అబీయాతో యుద్ధంలో ఉన్నవారిని సందర్భం ద్వారా సూచిస్తుంది.
- source_word: מַכָּה רַבָּה
  choice: తీవ్రంగా దెబ్బతీశారు
  rationale: అక్షరార్థంగా ‘గొప్ప దెబ్బ’; సహజమైన ఆధునిక తెలుగులో యుద్ధపు తీవ్రతను తెలియజేస్తూ, తరువాత పేర్కొన్న హతులతో దీనిని పూర్తిగా కలిపివేయదు.
- source_word: וַיִּפְּלוּ חֲלָלִים
  choice: యుద్ధంలో హతులై పడిపోయారు
  rationale: נפל అనే ‘పడిపోవడం’ను, חֲלָלִים అనే యుద్ధంలో హతులైనవారి భావాన్ని రెండింటినీ స్పష్టంగా నిలుపుతుంది.
- source_word: מִיִּשְׂרָאֵל
  choice: ఇశ్రాయేలువారిలో
  rationale: మరణించినవారు ఇశ్రాయేలు సమూహానికి చెందినవారని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: חֲמֵשׁ מֵאוֹת אֶלֶף
  choice: ఐదు లక్షల
  rationale: హీబ్రూ పాఠంలోని 500,000 అనే సంఖ్యను భారతీయ సంఖ్యా పద్ధతిలో యథాతథంగా అందిస్తుంది.
- source_word: אִישׁ בָּחוּר
  choice: ఎంపిక చేయబడిన ... మంది
  rationale: בָּחוּר ఇక్కడ ఎంపిక చేసిన లేదా శ్రేష్ఠమైన యోధులను సూచిస్తుంది; ‘ఎంపిక చేయబడినవారు’ మూలంలోని ఎంపిక భావాన్ని అనవసరమైన వీరత్వ విశేషణం లేకుండా నిలుపుతుంది.
theological_decisions:
- issue: యుద్ధంలో మరణించినవారి అత్యంత పెద్ద సంఖ్య
  choice: హీబ్రూ పాఠంలో ఉన్న ఐదు లక్షల సంఖ్యను మార్చకుండా ఉంచడం
  alternative: దీనిని అతిశయోక్తిగా భావించడం, సంఖ్యను సవరించడం, లేదా ‘వేలు’ను సైనిక దళం/వంశ విభాగంగా వ్యాఖ్యానించడం
  rationale: వచనం సంఖ్యను నేరుగా పేర్కొంటుంది; దాన్ని తగ్గించడానికి లేదా ప్రతీకాత్మకంగా చేయడానికి పాఠంలో స్పష్టమైన సూచన లేదు. అనువాదం చారిత్రక విమర్శకు సంబంధించిన వివాదాన్ని స్వయంగా పరిష్కరించకుండా మూలపాఠాన్ని ప్రతిబింబించాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ప్రజలు’ అనే విస్తృత పదాన్ని మూలానికి దగ్గరగా ఉంచి, సైనిక సందర్భాన్ని వాక్యమే తెలియజేసేలా చేశాం. సంఖ్యను తెలుగు పాఠకులకు సహజమైన ‘ఐదు లక్షలు’ రూపంలో ఇచ్చాం.
