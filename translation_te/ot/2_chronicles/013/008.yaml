id: 2CH.13.8
reference: 2 Chronicles 13:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֣ה אַתֶּ֣ם אֹֽמְרִ֗ים לְ/הִתְחַזֵּק֙ לִ/פְנֵי֙ מַמְלֶ֣כֶת יְהוָ֔ה בְּ/יַ֖ד בְּנֵ֣י דָוִ֑יד וְ/אַתֶּם֙ הָמ֣וֹן רָ֔ב וְ/עִמָּ/כֶם֙ עֶגְלֵ֣י זָהָ֔ב אֲשֶׁ֨ר עָשָׂ֥ה לָ/כֶ֛ם יָרָבְעָ֖ם לֵ/אלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/008.yaml
  text: And now you are saying that you are strong enough to stand against the kingdom of Yahweh in the hand of the sons of David[c][b][a], because you are a great multitude and have with you the golden calves that Jeroboam made for you as gods.
translation:
  language: te
  text: ఇప్పుడు మీరు దావీదు కుమారుల చేతిలో[b] ఉన్న యాహ్వే రాజ్యాన్ని ఎదిరించి బలంగా నిలబడతామని అంటున్నారు[a]. మీరు గొప్ప జనసమూహం; యరొబాము మీ కోసం దేవుళ్లుగా[c] చేసిన బంగారు దూడలు కూడా మీతో ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే రాజ్యం ఎదుట మిమ్మల్ని మీరు బలపరచుకోవాలని అంటున్నారు.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “దావీదు కుమారుల చేతిలో.” ఇది దావీదు వంశం ద్వారా జరిగే పాలన లేదా నిర్వహణను సూచించే నుడికారం.
    reason: cultural_note
  - marker: c
    text: లేదా, “దేవుళ్లుగా ఉండేందుకు.” హెబ్రీ పదం బహువచనంలో ఉండి, యరొబాము చేయించిన దూడ విగ్రహాలను వ్యంగ్యంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְרִים
  choice: అంటున్నారు
  rationale: వర్తమాన కృదంత రూపంలోని మాటల క్రియను నేరుగా నిలుపుతూ, అబీయా ప్రసంగంలోని ఆరోపణాత్మక స్వరాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לְהִתְחַזֵּק לִפְנֵי
  choice: ఎదిరించి బలంగా నిలబడతామని
  rationale: హిత్పయేల్ రూపంలోని ‘తమను తాము బలపరచుకోవడం/బలవంతులుగా నిరూపించుకోవడం’ అనే భావాన్నీ, సైనిక సందర్భంలో לִפְנֵי సూచించే ఎదుర్కొనడాన్నీ కలిపి తెలియజేస్తుంది; ప్రత్యామ్నాయ అక్షరార్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: מַמְלֶכֶת יְהוָה
  choice: యాహ్వే రాజ్యం
  rationale: రాజ్యం యాహ్వేకే చెందుతుందనే దినవృత్తాంతాల ప్రధాన వాదనను స్పష్టంగా నిలుపుతుంది; יְהוָה అనే వ్యక్తిగత దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- source_word: בְּיַד בְּנֵי דָוִיד
  choice: దావీదు కుమారుల చేతిలో
  rationale: పాలన లేదా నిర్వహణను సూచించే హెబ్రీయ రూపకాన్ని తెలుగులోనూ నిలుపుతుంది; దాని నుడికారార్థాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: הָמוֹן רָב
  choice: గొప్ప జనసమూహం
  rationale: సంఖ్యాబలాన్ని నొక్కిచెప్పే సమూహార్థాన్ని గౌరవప్రదమైన, సులభమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עֶגְלֵי זָהָב
  choice: బంగారు దూడలు
  rationale: యరొబాము ఏర్పరచిన ప్రసిద్ధ ఆరాధనా విగ్రహాలను సహజమైన తెలుగు పదబంధంతో సూచిస్తుంది.
- source_word: לֵאלֹהִים
  choice: దేవుళ్లుగా
  rationale: హెబ్రీ బహువచనాన్ని, ఆ దూడలను ఆరాధనా దేవతలుగా చేసిన చర్యపై ఉన్న వ్యంగ్య విమర్శను నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరిస్తుంది.
- issue: దావీదు వంశ పాలనతో యాహ్వే రాజ్యానికి ఉన్న సంబంధం
  choice: దావీదు కుమారుల చేతిలో ఉన్న యాహ్వే రాజ్యం
  alternative: దావీదు కుమారులు పాలించే యాహ్వే రాజ్యం
  rationale: రాజ్యం యాహ్వేది అయినప్పటికీ అది దావీదు వంశం ద్వారా నిర్వహించబడుతోందనే మూలంలోని ద్వంద్వ భావాన్ని ఏ ఒక్క వైపుకూ కుదించకుండా నిలుపుతుంది.
- issue: బంగారు దూడలకు వాడిన אֱלֹהִים బహువచనం
  choice: దేవుళ్లుగా
  alternative: దేవతలుగా ఉండేందుకు
  rationale: విగ్రహాలను దేవుళ్లుగా నియమించినట్లు వక్త చేస్తున్న విమర్శను, మూలంలోని బహువచనంతో సహా, మృదువుపరచకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ప్రసంగశైలిని వాడింది. ‘చేతిలో’ అనే మూల రూపకాన్ని నిలిపి, అవసరమైన వివరణను పాదసూచికకు పరిమితం చేసింది.
