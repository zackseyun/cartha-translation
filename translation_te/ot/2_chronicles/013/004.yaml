id: 2CH.13.4
reference: 2 Chronicles 13:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֣קָם אֲבִיָּ֗ה מֵ/עַל֙ לְ/הַ֣ר צְמָרַ֔יִם אֲשֶׁ֖ר בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יֹּ֕אמֶר שְׁמָע֖וּ/נִי יָרָבְעָ֥ם וְ/כָל יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/004.yaml
  text: Then Abijah stood on Mount Zemaraim[a], which is in the hill country of Ephraim, and said, “Hear me, Jeroboam and all Israel!”
translation:
  language: te
  text: అప్పుడు అబీయా ఎఫ్రాయిము కొండప్రాంతంలో ఉన్న సెమారయిము కొండమీద నిలబడి, “యెరోబాము మరియు ఇశ్రాయేలంతా, నా మాట వినండి!” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: నిలబడి
  rationale: קום అనే క్రియ కథన సందర్భంలో ‘లేచాడు’ లేదా ‘నిలబడ్డాడు’ అని అర్థమవుతుంది. ఇక్కడ ప్రసంగించడానికి నిలబడిన భావాన్ని సహజంగా తెలియజేస్తుంది; సైనికంగా ‘స్థానం చేపట్టాడు’ అనే అదనపు భావాన్ని రుద్దదు.
- source_word: מֵעַל לְהַר
  choice: కొండమీద
  rationale: హీబ్రూ ఉపసర్గల సముదాయం అక్షరార్థంగా సంక్లిష్టమైనప్పటికీ, సందర్భంలో అబీయా కొండపై ఉన్నాడనే స్థానార్థాన్ని సూచిస్తుంది. ‘కొండమీద’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: צְמָרַיִם
  choice: సెమారయిము
  rationale: ఇది స్థలనామం; హీబ్రూ ధ్వనికి దగ్గరగా తెలుగు లిప్యంతరీకరణ చేయబడింది.
- source_word: אֲשֶׁר בְּהַר אֶפְרָיִם
  choice: ఎఫ్రాయిము కొండప్రాంతంలో ఉన్న
  rationale: הַר ఇక్కడ ఒక్క కొండనే కాక కొండలతో కూడిన ప్రాంతాన్ని కూడా సూచించగలదు. ‘కొండప్రాంతం’ భౌగోళిక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: ఇది సాధారణ కథన వాక్యారంభ క్రియ. తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో వాక్యం చివర ‘అన్నాడు’ సహజంగా ఉంటుంది.
- source_word: שְׁמָעוּנִי
  choice: నా మాట వినండి
  rationale: שמע ధాతువు ఆజ్ఞారూపానికి మొదటి పురుష ఏకవచన ప్రత్యయం ఉంది. ‘నా మాట వినండి’ ప్రత్యక్షమైన, గంభీరమైన పిలుపును సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יָרָבְעָם וְכָל יִשְׂרָאֵל
  choice: యెరోబాము, ఇశ్రాయేలంతా
  rationale: రాజును, సమకూడిన ఉత్తర రాజ్య ప్రజలను నేరుగా సంబోధిస్తుంది. ‘ఇశ్రాయేలంతా’ జాతీయ-నిబంధనాత్మక పేరును నిలుపుతుంది.
theological_decisions:
- issue: విభజిత రాజ్య సందర్భంలో יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలంతా
  alternative: ఇశ్రాయేలీయులందరూ
  rationale: మూలంలో జాతీయ-నిబంధనాత్మక నామమే నేరుగా ఉంది. ‘ఇశ్రాయేలంతా’ అని ఉంచడం ద్వారా ఉత్తర రాజ్యాన్ని పూర్తి జాతీయ నామంతో సంబోధించడంలోని రాజకీయ-దైవశాస్త్రీయ ఉద్రిక్తతను తగ్గించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి వాడబడింది. వ్యక్తి, స్థలనామాలు హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి; ప్రత్యక్ష సంబోధనలో గౌరవ/బహువచన ఆజ్ఞారూపం ఉపయోగించబడింది.
