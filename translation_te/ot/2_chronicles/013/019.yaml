  text: וַ/יִּרְדֹּ֣ף אֲבִיָּה֮ אַחֲרֵ֣י יָרָבְעָם֒ וַ/יִּלְכֹּ֤ד מִמֶּ֨/נּוּ֙ עָרִ֔ים אֶת בֵּֽית אֵל֙ וְ/אֶת בְּנוֹתֶ֔י/הָ וְ/אֶת יְשָׁנָ֖ה וְ/אֶת בְּנוֹתֶ֑י/הָ וְ/אֶת עפרון וּ/בְנֹתֶֽי/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/019.yaml
  text: 'Abijah pursued Jeroboam and captured from him cities: Bethel and its daughter towns, Jeshanah and its daughter towns, and Ephron and its daughter towns.'
translation:
  language: te
  text: 'అబీయా యరొబామును వెంబడించి, అతని నుండి పట్టణాలను స్వాధీనం చేసుకున్నాడు: బేతేలు మరియు దానికి చెందిన అనుబంధ పట్టణాలు, యెషానా మరియు దానికి చెందిన అనుబంధ పట్టణాలు, ఎఫ్రోను మరియు దానికి చెందిన అనుబంధ పట్టణాలు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְדֹּף ... אַחֲרֵי
  choice: తరిమి
  rationale: వెంటబడి తరుమడం అనే హెబ్రీయ క్రియాభావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּלְכֹּד מִמֶּנּוּ עָרִים
  choice: అతని నుండి కొన్ని పట్టణాలను స్వాధీనం చేసుకున్నాడు
  rationale: לכד యుద్ధసందర్భంలో పట్టుకోవడం లేదా స్వాధీనం చేసుకోవడం; עָרִים నిర్దిష్ట సంఖ్యలేని బహువచనం కావడంతో తెలుగులో సహజంగా ‘కొన్ని పట్టణాలను’ అని ఇచ్చాం.
- source_word: בְּנוֹתֶיהָ / בְנֹתֶיהָ
  choice: దాని చుట్టుపక్కల గ్రామాలు
  rationale: అక్షరార్థంగా ‘దాని కుమార్తెలు’; పట్టణాలకు అనుబంధమైన చిన్న నివాస ప్రాంతాలు లేదా గ్రామాలను సూచించే హెబ్రీయ నుడికారాన్ని అర్థస్పష్టంగా అందిస్తుంది.
- source_word: עפרון
  choice: ఎఫ్రోను
  rationale: కేతీబ్ రూపం עפרון ఆధారంగా లిప్యంతరీకరించబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; చారిత్రక కథనానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. స్థలనామాలు సంప్రదాయ తెలుగు బైబిలు రూపాలకు సమీపంగా ఉంచబడ్డాయి.
