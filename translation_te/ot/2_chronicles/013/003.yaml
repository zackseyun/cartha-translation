base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/003.yaml
  text: Abijah joined battle with an army of four hundred thousand chosen men[a], mighty warriors; and Jeroboam drew up for battle against him with eight hundred thousand chosen men[b], mighty men of valor.
translation:
  language: te
  text: అబీయా నాలుగు లక్షలమంది ఎంపికైన, యుద్ధవీరులైన సైనికుల బలగంతో యుద్ధానికి దిగాడు[a]. యెరోబాము అతనికి ఎదురుగా ఎనిమిది లక్షలమంది ఎంపికైన, పరాక్రమవంతులైన సైనికులతో యుద్ధం కోసం తన సైన్యాన్ని మోహరించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యుద్ధానికి దిగాడు’ అనే చోట హీబ్రూ నుడికారం అక్షరార్థంగా ‘యుద్ధాన్ని బంధించాడు’; భావం ‘యుద్ధంలో నిమగ్నమయ్యాడు’ లేదా ‘యుద్ధాన్ని ప్రారంభించాడు.’
    reason: lexical_alternative
  - marker: b
    text: ‘పరాక్రమవంతులైన సైనికులు’ అనే హీబ్రూ సైనిక పదబంధం ధైర్యవంతులైన, సమర్థులైన పోరాటయోధులను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאְסֹר אֶת־הַמִּלְחָמָה
  choice: యుద్ధానికి దిగాడు
  rationale: అక్షరార్థంగా ‘యుద్ధాన్ని బంధించాడు’ అనే ఈ హీబ్రూ సైనిక నుడికారం ఇక్కడ యుద్ధంలో నిమగ్నమవడం లేదా యుద్ధాన్ని ప్రారంభించడం అనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘యుద్ధానికి దిగాడు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: בְּחַיִל
  choice: సైనికులతో
  rationale: חַיִל కు బలం, సైన్యం, పరాక్రమం వంటి అర్థాలున్నా, వెంటనే సైనికుల సంఖ్య రావడం వల్ల ఇక్కడ సైనిక బలగాన్ని సూచిస్తుంది.
- source_word: גִּבּוֹרֵי מִלְחָמָה
  choice: యుద్ధవీరులైన
  rationale: ఈ పదబంధం సమర్థులైన బలశాలి యోధులను సూచిస్తుంది; ‘యుద్ధవీరులు’ బలం, సైనిక పాత్ర రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: בָּחוּר
  choice: ఎంపికచేయబడిన
  rationale: ఇక్కడ ఈ పదం ప్రత్యేకంగా ఎంపిక చేసిన శ్రేష్ఠ సైనికులను సూచిస్తుంది; కేవలం ‘యువకులు’ అని అనువదించడం సందర్భంలోని సైనిక భావాన్ని తగ్గిస్తుంది.
- source_word: עָרַךְ עִמּוֹ מִלְחָמָה
  choice: అతనికి ఎదురుగా ... యుద్ధానికి సైన్యాన్ని మోహరించాడు
  rationale: עָרַךְ అనే క్రియ సైనిక సందర్భంలో దళాలను యుద్ధవ్యూహంలో అమర్చడాన్ని సూచిస్తుంది; ‘సైన్యాన్ని మోహరించాడు’ ఆ వ్యూహాత్మక భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: גִּבּוֹר חָיִל
  choice: పరాక్రమవంతులైన ... సైనికులు
  rationale: ఈ స్థిర సైనిక పదబంధం ధైర్యం, సామర్థ్యం, యుద్ధనైపుణ్యం గల పోరాటయోధులను సూచిస్తుంది; తెలుగులో ఈ ఎంపిక ఆ సమగ్ర భావాన్ని సహజంగా అందిస్తుంది.
