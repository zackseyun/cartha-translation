  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే సైనిక పదజాలం వాడబడింది. మూలంలోని నాలుగు లక్షలు, ఎనిమిది లక్షలు అనే సంఖ్యలు వ్యాఖ్యానించకుండా యథాతథంగా ఉంచబడ్డాయి.
