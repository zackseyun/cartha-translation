id: 2CH.13.14
reference: 2 Chronicles 13:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּפְנ֣וּ יְהוּדָ֗ה וְ/הִנֵּ֨ה לָ/הֶ֤ם הַ/מִּלְחָמָה֙ פָּנִ֣ים וְ/אָח֔וֹר וַֽ/יִּצְעֲק֖וּ לַ/יהוָ֑ה וְ/הַ/כֹּ֣הֲנִ֔ים מחצצרים בַּ/חֲצֹצְרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/014.yaml
  text: When Judah turned around, behold, the battle was before them and behind them; and they cried out to Yahweh, and the priests were blowing the trumpets.
translation:
  language: te
  text: యూదావారు వెనక్కి తిరిగారు; ఇదిగో, వారికి ముందునుంచీ వెనకనుంచీ యుద్ధం ఎదురైంది. వారు యాహ్వేకు మొరపెట్టుకున్నారు, యాజకులు బాకాలు ఊదుతున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: వెనక్కి తిరిగి చూసినప్పుడు
  rationale: פנה అనే క్రియ ఇక్కడ వెనుకవైపు ఉన్న దాడిని గమనించడానికి తిరగడాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో శారీరకంగా తిరగడం, పరిస్థితిని చూడడం రెండూ సహజంగా వ్యక్తమవుతాయి.
- source_word: יְהוּדָה
  choice: యూదావారు
  rationale: ఏకవచన ప్రాంతనామం ఇక్కడ యూదా ప్రజలను లేదా సైన్యాన్ని సమష్టిగా సూచిస్తుంది; తెలుగులో ‘యూదావారు’ ఆ సమష్టి భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హఠాత్తుగా ఎదురైన పరిస్థితిపై దృష్టి నిలిపే హీబ్రూ సంభాషణా సూచకపు సజీవతను నిలుపుతుంది.
- source_word: הַמִּלְחָמָה
  choice: యుద్ధం
  rationale: ఇది దీర్ఘకాలిక యుద్ధస్థితికన్నా ఇక్కడ జరుగుతున్న సైనిక పోరాటాన్ని సూచిస్తుంది; సందర్భంలో ‘యుద్ధం’ సహజంగా అర్థమవుతుంది.
- source_word: פָּנִים וְאָחוֹר
  choice: ముందూ వెనుకా
  rationale: రెండు దిశల నుంచీ పోరాటం ఎదురైందనే హీబ్రూ వ్యక్తీకరణను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: וַיִּצְעֲקוּ
  choice: మొరపెట్టుకున్నారు
  rationale: తీవ్రమైన ఆపదలో దేవునికి చేసిన సహాయవిన్నపాన్ని ‘మొరపెట్టుకున్నారు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించింది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: పూజాసేవ చేసే వారిని సూచించే ప్రామాణికమైన, సాధారణ తెలుగు పదం.
- source_word: מחצצרים
  choice: ఊదుతూ ఉన్నారు
  rationale: హీబ్రూ కృదంత రూపంలోని కొనసాగుతున్న లేదా సమకాలీన చర్య భావాన్ని తెలుగులో నిలుపుతుంది.
- source_word: בַּחֲצֹצְרוֹת
  choice: బాకాలు
  rationale: ఇక్కడి חֲצֹצְרוֹת ఆరాధనలోను యుద్ధసంకేతాల్లోను ఉపయోగించే లోహపు బాకాలను సూచిస్తుంది; ఈ వచనంలో లేని ‘వెండి’ అనే వివరాన్ని చేర్చలేదు.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: హీబ్రూ వ్యక్తినామాన్ని స్పష్టంగా నిలిపి, దానిని బిరుదుగా మార్చకుండా మూలపాఠానికి దగ్గరగా ఉంచింది.
- issue: యూదావారి మొర స్వభావం
  choice: యాహ్వేకు మొరపెట్టుకున్నారు
  alternative: యాహ్వేను గట్టిగా పిలిచారు
  rationale: צעק యొక్క తీవ్రతను, దేవునివైపు చేసిన అత్యవసర సహాయవిన్నపాన్ని తెలిపింది; అయితే వచనంలో లేని సమాధానం లేదా విశ్వాసఫలితాన్ని ముందుగానే చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘ఇదిగో’ ద్వారా మూలంలోని హఠాత్ దృష్టి సూచనను నిలిపి, ‘ఊదుతూ ఉన్నారు’ ద్వారా యాజకుల చర్య కొనసాగుతున్న భావాన్ని వ్యక్తం చేసింది.
