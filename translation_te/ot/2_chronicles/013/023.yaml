  text: וַ/יִּשְׁכַּ֨ב אֲבִיָּ֜ה עִם אֲבֹתָ֗י/ו וַ/יִּקְבְּר֤וּ אֹת/וֹ֙ בְּ/עִ֣יר דָּוִ֔יד וַ/יִּמְלֹ֛ךְ אָסָ֥א בְנ֖/וֹ תַּחְתָּ֑י/ו בְּ/יָמָ֛י/ו שָׁקְטָ֥ה הָ/אָ֖רֶץ עֶ֥שֶׂר שָׁנִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/023.yaml
  text: And Abijah slept with his fathers[a], and they buried him in the City of David. And Asa his son reigned in his place. In his days the land had rest for ten years.
translation:
  language: te
  text: 'అబీయా తన పితరులతో నిద్రించాడు. అతన్ని దావీదు నగరంలో పాతిపెట్టారు. అతని కుమారుడు ఆసా అతని స్థానంలో రాజ్యమేలాడు. ఆసా కాలంలో దేశం పది సంవత్సరాలు విశ్రాంతి పొందింది.[a]


    [a] లేదా, “దేశం పది సంవత్సరాలు ప్రశాంతంగా ఉంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేశం పది సంవత్సరాలు ప్రశాంతంగా ఉంది.”
    reason: שָׁקְטָה అనే క్రియకు ‘విశ్రాంతి పొందింది’తో పాటు ‘ప్రశాంతంగా ఉంది’ అనే సముచిత అర్థం కూడా ఉంది; ఈ పదార్థ ప్రత్యామ్నాయాన్ని నమోదు చేస్తుంది.
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: నిద్రించాడు
  rationale: మరణాన్ని సూచించే హెబ్రీయుల స్థిరమైన నానుడిలోని ‘నిద్రించాడు’ అనే రూపకాన్ని నిలుపుతుంది; ‘చనిపోయాడు’ అని అనువదిస్తే మూలంలోని రూపకం తొలగిపోతుంది.
- source_word: עִם אֲבֹתָיו
  choice: తన పితరులతో
  rationale: రాజుల మరణవార్తల్లో కనిపించే సంప్రదాయ హెబ్రీయు సూత్రవాక్యాన్ని గౌరవప్రదమైన తెలుగు బైబిలు శైలిలో నిలుపుతుంది; భావపరంగా ఇది పూర్వీకులను సూచిస్తుంది.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: అతన్ని ... పాతిపెట్టారు
  rationale: హెబ్రీయులో ఉన్న కర్తను పేర్కొనని బహువచన క్రియారూపాన్ని తెలుగులో సహజంగా, క్రియాశీల రూపంలో నిలుపుతుంది.
- source_word: בְּעִיר דָּוִיד
  choice: దావీదు నగరంలో
  rationale: స్థలనామాన్ని మూలంలోని నిర్మాణానికి దగ్గరగా, తెలుగులో సహజంగా అందిస్తుంది.
- source_word: וַיִּמְלֹךְ
  choice: రాజ్యమేలాడు
  rationale: ‘రాజుగా పరిపాలించాడు’ అనే భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; మూలంలో స్పష్టంగా లేని ‘రాజయ్యాడు’ అనే ఆరంభ భావాన్ని జోడించదు.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: రాజవంశ వారసత్వంలో ఒకరి స్థానాన్ని మరొకరు స్వీకరించడాన్ని మూలానికి దగ్గరగా వ్యక్తపరుస్తుంది.
- source_word: בְּיָמָיו
  choice: ఆసా కాలంలో
  rationale: అక్షరార్థంగా ‘అతని రోజుల్లో’; తెలుగులో సూచిత వ్యక్తి స్పష్టంగా ఉండేందుకు ‘ఆసా కాలంలో’ అని సహజంగా అనువదించబడింది.
- source_word: שָׁקְטָה
  choice: విశ్రాంతిగా ఉంది
  rationale: కలత లేదా యుద్ధం లేకుండా దేశం పొందిన ఉపశమనాన్ని తెలియజేస్తూ, మూలంలోని ప్రశాంతత/విశ్రాంతి భావవిస్తృతిని నిలుపుతుంది.
- source_word: הָאָרֶץ
  choice: దేశం
  rationale: ఆసా పాలనలోని భూభాగం లేదా రాజ్యప్రాంతాన్ని సూచించే הָאָרֶץ కు సహజమైన తెలుగు సమానం; ‘రాజ్యం’ అనడం మరింత వ్యాఖ్యాత్మకం అవుతుంది.
- source_word: עֶשֶׂר שָׁנִים
  choice: పది సంవత్సరాలు
  rationale: వ్యవధిని తెలుగులో సహజంగా, మూలార్థాన్ని మార్చకుండా తెలియజేస్తుంది.
