translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ‘పితరులు,’ ‘రాజ్యమేలాడు’ వంటి స్థిరమైన బైబిలు పదాలు మూలంలోని రాజవంశ సూత్రవాక్య స్వరాన్ని కాపాడుతాయి. అస్పష్ట సర్వనామాన్ని తెలుగులో స్పష్టత కోసం ‘ఆసా’గా పేర్కొన్నప్పటికీ కొత్త సమాచారాన్ని జోడించలేదు.
