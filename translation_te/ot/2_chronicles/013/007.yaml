id: 2CH.13.7
reference: 2 Chronicles 13:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקָּבְצ֣וּ עָלָ֗י/ו אֲנָשִׁ֤ים רֵקִים֙ בְּנֵ֣י בְלִיַּ֔עַל וַ/יִּֽתְאַמְּצ֖וּ עַל רְחַבְעָ֣ם בֶּן שְׁלֹמֹ֑ה וּ/רְחַבְעָ֗ם הָ֤יָה נַ֨עַר֙ וְ/רַךְ לֵבָ֔ב וְ/לֹ֥א הִתְחַזַּ֖ק לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/007.yaml
  text: And worthless men[a], sons of Belial, gathered around him and proved stronger than Rehoboam son of Solomon, when Rehoboam was young and fainthearted and had not strengthened himself against them.
translation:
  language: te
  text: పనికిమాలిన మనుషులైన బెలీయాలు కుమారులు[a] అతని చుట్టూ చేరి, సొలొమోను కుమారుడైన రెహబాముపై పైచేయి సాధించారు. రెహబాము యువకుడూ మనోధైర్యం లేనివాడూ కావడంతో, వారిముందు తనను తాను బలపరచుకోలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “బెలీయాలు కుమారులు” అనే మాటకు “నీచులు,” “దుష్టులు,” లేదా “పనికిమాలినవారు” అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ עָלָיו
  choice: అతని చుట్టూ చేరి
  rationale: קבץ తో עַל అనేది ఒకని చుట్టూ చేరడం లేదా అతనికి వ్యతిరేకంగా సమకూడడం అని సూచించగలదు. ఇక్కడ మునుపటి సందర్భంలోని యెరోబాము చుట్టూ అతని అనుచరులు చేరారనే భావాన్ని సహజంగా వ్యక్తం చేస్తూ, రాజకీయ విరోధాన్ని తరువాతి వాక్యభాగం తెలియజేయనిస్తుంది.
- source_word: אֲנָשִׁים רֵקִים
  choice: పనికిమాలిన మనుషులు
  rationale: רֵקִים అక్షరార్థంగా ‘ఖాళీవారు’ అయినా, ఈ నుడికారంలో విలువ లేదా నైతిక స్థిరత్వం లేనివారనే అవమానార్థం ఉంది. ‘పనికిమాలిన మనుషులు’ ఆధునిక తెలుగులో సహజంగా ఆ తీర్పును తెలియజేస్తుంది.
- source_word: בְּנֵי בְלִיַּעַל
  choice: బెలీయాలు కుమారులు
  rationale: హీబ్రూ రూపాన్ని నిలుపుతూ, ‘బెలీయాలు’ వ్యక్తీకృత నామమా లేక పనికిమాలినతనం/దుష్టత్వాన్ని సూచించే పదమా అనే సందిగ్ధతను ప్రధాన పాఠం ముందుగానే పరిష్కరించదు. నుడికారార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: וַיִּתְאַמְּצוּ עַל
  choice: పైచేయి సాధించారు
  rationale: אמץ హిత్పయేల్ రూపం ఇక్కడ ఎదుటివారిపై తమ బలాన్ని చూపి ఆధిక్యం పొందడాన్ని సూచిస్తుంది. ‘పైచేయి సాధించారు’ తులనాత్మక ఫలితాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: נַעַר
  choice: యువకుడు
  rationale: נַעַר బాలుడు, యువకుడు లేదా అనుభవరాహిత్యంగల వ్యక్తిని సూచించగలదు. వక్తృత్వ సందర్భంలో రెహబాము అపరిపక్వతను సూచించేలా ‘యువకుడు’ అని అనువదించాం; ‘బాలుడు’ అనే అతిశయార్థాన్ని నివారించాం.
- source_word: רַךְ לֵבָב
  choice: మనోధైర్యం లేనివాడు
  rationale: అక్షరార్థం ‘మృదువైన హృదయం గలవాడు.’ ఈ రాజకీయ సంఘర్షణ సందర్భంలో అది కనికరాన్ని కాక దృఢనిశ్చయం లేదా ధైర్యం కొరవడటాన్ని సూచిస్తుంది.
- source_word: וְלֹא הִתְחַזַּק לִפְנֵיהֶם
  choice: వారిని ఎదిరించడానికి తనను తాను బలపరచుకోలేదు
  rationale: హీబ్రూలోని ‘తనను తాను బలపరచుకోవడం’ అనే ప్రతిబింబక భావాన్ని నిలుపుతూ, לִפְנֵיהֶם యొక్క సందర్భార్థాన్ని ‘వారిని ఎదిరించడానికి’ అని స్పష్టం చేసింది. ఇది అసమర్థతకంటే చర్య తీసుకోకపోవడం అనే రూపాన్ని కాపాడుతుంది.
theological_decisions:
- issue: בְּנֵי בְלִיַּעַל అనువాదం
  choice: బెలీయాలు కుమారులు
  alternative: నీచులు / దుష్టులు / పనికిమాలినవారు
  rationale: ‘బెలీయాలు’ ఒక స్థిరమైన వ్యక్తీకృత నామంగా ఉద్దేశించబడిందా, లేక పనికిమాలినతనం లేదా దుష్టత్వానికి వాడిన వర్ణనాత్మక పదమా అనే విషయాన్ని పాఠం స్పష్టంగా నిర్ణయించదు. అందువల్ల ప్రధాన పాఠంలో అక్షరరూపాన్ని ఉంచి, నుడికారార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘పైచేయి సాధించారు,’ ‘మనోధైర్యం లేనివాడు’ వంటి సహజ పదబంధాలతో భావాన్ని స్పష్టం చేశాం; అదే సమయంలో ‘బెలీయాలు కుమారులు’ అనే మూలంలోని ఉద్దేశపూర్వక సందిగ్ధతను పాదటిప్పణితో నిలిపాం.
