source:
  edition: WLC
  text: וַ/יָּרִ֖יעוּ אִ֣ישׁ יְהוּדָ֑ה וַ/יְהִ֗י בְּ/הָרִ֨יעַ֙ אִ֣ישׁ יְהוּדָ֔ה וְ/הָ/אֱלֹהִ֗ים נָגַ֤ף אֶת יָֽרָבְעָם֙ וְ/כָל יִשְׂרָאֵ֔ל לִ/פְנֵ֥י אֲבִיָּ֖ה וִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/015.yaml
  text: Then the men of Judah raised a shout, and when the men of Judah shouted, God struck down Jeroboam and all Israel before Abijah and Judah.
translation:
  language: te
  text: అప్పుడు యూదాకు చెందినవారు యుద్ధకేక వేశారు. యూదాకు చెందినవారు యుద్ధకేక వేసినప్పుడు, దేవుడు యరొబామును, ఇశ్రాయేలీయులందరినీ అబీయా, యూదా సమక్షంలో దెబ్బతీశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרִיעוּ / בְּהָרִיעַ
  choice: యుద్ధకేక వేశారు / యుద్ధకేక వేసినప్పుడు
  rationale: רוּעַ అనే క్రియ ఇక్కడ యుద్ధ సందర్భంలో బిగ్గరగా కేక వేయడాన్ని సూచిస్తుంది. సాధారణ ‘కేక’ కంటే ‘యుద్ధకేక’ సందర్భాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: אִישׁ יְהוּדָה
  choice: యూదావారు
  rationale: అక్షరార్థంగా ‘యూదా మనుషులు’; ఆధునిక తెలుగులో సమూహాన్ని సహజంగా సూచించేందుకు ‘యూదావారు’ ఎంచుకున్నాం.
- source_word: נָגַף
  choice: ఓడించాడు
  rationale: ఈ యుద్ధ సందర్భంలో ‘దెబ్బతీయడం/పరాజయం కలిగించడం’ అనే భావం ఉంది. తరువాతి వచనంలో పారిపోవడం ప్రస్తావించబడటంతో, అందరినీ చంపేశాడనే అపార్థం రాకుండా ‘ఓడించాడు’ అని అనువదించాం.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: ‘ముందు/సమక్షంలో’ అనే మూల భావాన్ని నిలుపుతూ, అబీయా మరియు యూదా సమక్షంలో దేవుడు శత్రువును ఓడించాడనే వాక్య నిర్మాణాన్ని కాపాడుతుంది.
theological_decisions:
- issue: విజయానికి కర్త ఎవరు?
  choice: దేవుడు ... ఓడించాడు
  alternative: యూదావారు ... ఓడించారు
  rationale: హీబ్రూ పాఠ్యంలో הָאֱלֹהִים స్పష్టమైన కర్త. కాబట్టి విజయాన్ని మానవ సైనిక చర్యకు మాత్రమే ఆపాదించకుండా దేవుని చర్యగా నేరుగా వ్యక్తపరిచాం.
- issue: యుద్ధకేక మరియు దేవుని చర్య మధ్య సంబంధం
  choice: ‘వేసినప్పుడు’ అనే కాలసంబంధ నిర్మాణం
  alternative: ‘వేసినందువల్ల’ అనే కారణార్థ నిర్మాణం
  rationale: בְּ + infinitive construct ఇక్కడ కాలసంబంధాన్ని స్పష్టంగా తెలుపుతుంది; యుద్ధకేకే దేవుని చర్యకు కారణమని మూలపాఠం చెప్పినదానికంటే ఎక్కువగా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గంభీరమైన యుద్ధవర్ణన. మూలంలోని పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం.
