id: 2CH.13.18
reference: 2 Chronicles 13:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּכָּנְע֥וּ בְנֵי יִשְׂרָאֵ֖ל בָּ/עֵ֣ת הַ/הִ֑יא וַ/יֶּֽאֶמְצוּ֙ בְּנֵ֣י יְהוּדָ֔ה כִּ֣י נִשְׁעֲנ֔וּ עַל יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/018.yaml
  text: So the sons of Israel were subdued at that time, and the sons of Judah prevailed, because they relied on Yahweh, the God of their fathers.
translation:
  language: te
  text: ఆ సమయంలో ఇశ్రాయేలు ప్రజలు అణచివేయబడ్డారు; యూదా ప్రజలు బలవంతులయ్యారు, ఎందుకంటే వారు తమ పితరుల దేవుడైన యాహ్వేపై ఆధారపడ్డారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: అణచివేయబడ్డారు
  rationale: నిఫాల్ రూపంలోని כנע ఇక్కడ యుద్ధ సందర్భంలో లోబడేలా చేయబడడం లేదా అణచివేయబడడం అనే ఫలితార్థాన్ని ఇస్తుంది; సంపూర్ణ పరాజయాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినా, ఇక్కడ ఉత్తర రాజ్యానికి చెందిన సమూహాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ప్రజలు’ సహజంగా, సమూహార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בָּעֵת הַהִיא
  choice: ఆ సమయంలో
  rationale: కాలసూచక పదబంధానికి సహజమైన, సూటియైన తెలుగు సమానం.
- source_word: וַיֶּאֶמְצוּ
  choice: బలపడ్డారు
  rationale: אמץ అనే క్రియ యొక్క ‘బలంగా ఉండడం/బలపడడం’ అనే మూలభావాన్ని నిలుపుతుంది; సందర్భం విజయాన్ని సూచించినా, ‘జయించారు’ అని ఫలితాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: בְנֵי יְהוּדָה
  choice: యూదా ప్రజలు
  rationale: ‘ఇశ్రాయేలు ప్రజలు’ అనే సమాంతర పదబంధంతో సరిపోలుతూ, యూదా సమూహాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: యూదా బలపడడానికి కారణాన్ని స్పష్టంగా పరిచయం చేసే ఆధునిక తెలుగు కారణసూచక పదం.
- source_word: נִשְׁעֲנוּ עַל
  choice: మీద ఆధారపడ్డారు
  rationale: שען על లోని ‘దేనిమీదనైనా ఆనుకోవడం’ అనే రూపక భావాన్ని ‘ఆధారపడడం’ సహజంగా నిలుపుతుంది; ‘నమ్మారు’ కంటే మూల రూపకానికి దగ్గరగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన రూపంతో దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తపరుస్తుంది.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: తమ పితరుల దేవుడు
  rationale: మూలంలోని పురుష బహువచన ‘పితరులు’ అనే పూర్వీకుల భావాన్నీ, నిబంధనాత్మక అనుబంధాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న నాలుగు అక్షరాల దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో మార్చకుండా వ్యక్తిగత నామంగానే ఉంచాం. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరగా భావించబడే ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ఇశ్రాయేలు–యూదా సమాంతరతను నిలుపుతూ, తెలుగు సహజత్వం కోసం ‘కుమారులు’ బదులు ‘ప్రజలు’ వాడబడింది.
