  text: וְ/הִנֵּה֩ עִמָּ֨/נוּ בָ/רֹ֜אשׁ הָ/אֱלֹהִ֧ים וְ/כֹהֲנָ֛י/ו וַ/חֲצֹצְר֥וֹת הַ/תְּרוּעָ֖ה לְ/הָרִ֣יעַ עֲלֵי/כֶ֑ם בְּנֵ֣י יִשְׂרָאֵ֗ל אַל תִּלָּֽחֲמ֛וּ עִם יְהוָ֥ה אֱלֹהֵֽי אֲבֹתֵי/כֶ֖ם כִּי לֹ֥א תַצְלִֽיחוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/012.yaml
  text: And behold[a], God is with us at our head, and his priests with the trumpets for the battle cry, to sound the alarm against you. Sons of Israel, do not fight against Yahweh, the God of your fathers, for you will not succeed.
translation:
  language: te
  text: '“ఇదిగో, దేవుడు మా నాయకుడిగా మాతో ఉన్నాడు. మీకు వ్యతిరేకంగా యుద్ధసంకేతం మోగించడానికి ఆయన యాజకులు యుద్ధనాదపు బూరలతో ఉన్నారు. ఇశ్రాయేలు కుమారులారా[a], మీ పితరుల దేవుడైన యాహ్వేతో యుద్ధం చేయకండి; ఎందుకంటే మీరు సఫలం కారు.”


    [a] లేదా, “ఇశ్రాయేలు సంతానమా.” హీబ్రూ మూలంలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులారా” అని ఉంది; ఇక్కడ అది ఇశ్రాయేలీయులను నేరుగా సంబోధించే పుంలింగ బహువచన ప్రయోగం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలు సంతానమా.” హీబ్రూ మూలంలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులారా” అని ఉంది; ఇక్కడ అది ఇశ్రాయేలీయులను నేరుగా సంబోధించే పుంలింగ బహువచన ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: తరువాతి విషయంపై బలంగా దృష్టి నిలిపే హీబ్రూ సంభాషణ సూచికను సహజమైన తెలుగు పదంతో నిలిపింది.
- source_word: עִמָּנוּ בָרֹאשׁ הָאֱלֹהִים
  choice: దేవుడు మా నాయకుడిగా మాతో ఉన్నాడు
  rationale: ‘మా శిరస్సు వద్ద’ అనే మూల రూపకంలోని నాయకత్వ భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; దేవుని సన్నిధి ‘మాతో’ అనే మాటలో నిలిచింది.
- source_word: וְכֹהֲנָיו
  choice: ఆయన యాజకులు
  rationale: ఏకవచన ప్రత్యయం దేవుణ్ణి సూచిస్తుంది; ఆయన సేవకు చెందిన యాజకులనే భావాన్ని కాపాడుతుంది.
- source_word: וַחֲצֹצְרוֹת הַתְּרוּעָה
  choice: యుద్ధనాదపు బూరలు
  rationale: חֲצֹצְרוֹת అనే బూరలను, תְּרוּעָה అనే బలమైన యుద్ధధ్వని లేదా సంకేత భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: לְהָרִיעַ עֲלֵיכֶם
  choice: మీకు వ్యతిరేకంగా యుద్ధసంకేతం మోగించడానికి
  rationale: ఉద్దేశార్థక క్రియారూపాన్ని ప్రత్యేకంగా నిలిపి, సైనిక సందర్భంలోని ప్రతికూల సంకేత భావాన్ని స్పష్టం చేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులారా
  rationale: మూలంలోని పుంలింగ బహువచన ప్రత్యక్ష సంబోధనను రూపపరంగా కాపాడుతుంది; సహజమైన విస్తృత ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చింది.
- source_word: אַל תִּלָּחֲמוּ עִם יְהוָה
  choice: యాహ్వేతో యుద్ధం చేయకండి
  rationale: לחם తో వచ్చిన עִם ప్రతికూల పోరాట సంబంధాన్ని తెలుగులో ‘తో యుద్ధం’ అనే సహజ ప్రయోగం తెలియజేస్తుంది; దైవనామాన్ని యాహ్వే అని లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: మీ పితరుల దేవుడు
  rationale: ఒడంబడిక సంబంధాన్ని సూచించే సంప్రదాయబద్ధమైన పదబంధాన్ని గౌరవప్రదంగా, స్పష్టంగా నిలిపింది.
- source_word: כִּי לֹא תַצְלִיחוּ
  choice: ఎందుకంటే మీరు సఫలం కారు
  rationale: צלח హిఫీల్ రూపంలోని విస్తృతమైన ‘సఫలం కావడం’ భావాన్ని నిలిపి, కేవలం యుద్ధవిజయానికే పరిమితం చేయలేదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: హీబ్రూ మూలంలోని ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’ ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించింది.
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక సంబోధన
  choice: ఇశ్రాయేలు కుమారులారా
  alternative: ఇశ్రాయేలు సంతానమా
  rationale: హీబ్రూ పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది సమస్త ఇశ్రాయేలీయులను ఉద్దేశించే సంబోధన కావచ్చనే విషయాన్ని పాదటిప్పణిలో తెలిపింది.
- issue: దేవుడు ‘తల వద్ద’ ఉన్నాడనే రూపకం
  choice: దేవుడు మా నాయకుడిగా మాతో ఉన్నాడు
  alternative: దేవుడు మా ముందున్నాడు
  rationale: దైవ నాయకత్వం మరియు సన్నిధి రెండింటినీ తెలియజేస్తూ, దేవుడు భౌతికంగా ఒక స్థానంలో మాత్రమే ఉన్నాడనే అపార్థాన్ని నివారించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రజలకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం వాడుతూ, ప్రసంగంలోని గంభీర హెచ్చరిక స్వరాన్ని నిలిపింది. ‘యాజకులు,’ ‘పితరులు,’ ‘యాహ్వే’ వంటి సందర్భోచిత బైబిలు పదాలను గౌరవప్రదంగా ఉపయోగించింది.
