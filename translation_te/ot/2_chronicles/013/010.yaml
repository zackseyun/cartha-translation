id: 2CH.13.10
reference: 2 Chronicles 13:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲנַ֛חְנוּ יְהוָ֥ה אֱלֹהֵ֖י/נוּ וְ/לֹ֣א עֲזַבְנֻ֑/הוּ וְ/כֹ֨הֲנִ֜ים מְשָׁרְתִ֤ים לַֽ/יהוָה֙ בְּנֵ֣י אַהֲרֹ֔ן וְ/הַ/לְוִיִּ֖ם בַּ/מְלָֽאכֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/010.yaml
  text: But as for us[a], Yahweh is our God, and we have not forsaken him; and the priests who minister to Yahweh are the sons of Aaron[b], and the Levites are in their work.
translation:
  language: te
  text: అయితే మా విషయానికొస్తే, యాహ్వే మా దేవుడు; మేము ఆయనను విడిచిపెట్టలేదు[a]. యాహ్వేకు పరిచర్య చేసే యాజకులు అహరోను కుమారులు; లేవీయులు తమ పనిలో నిమగ్నమై ఉన్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మేము ఆయనను త్యజించలేదు.”
    reason: עזב అనే పదానికి ‘విడిచిపెట్టు’ మరియు ‘త్యజించు’ అనే రెండూ సందర్భోచిత అర్థాలు ఉన్నాయి.
  - marker: b
    text: అక్షరార్థంగా, “లేవీయులు పనిలో”; అంటే, తమకు అప్పగించిన సేవలో ఉన్నారు.
    reason: హీబ్రూ వాక్యం సంక్షిప్తంగా ఉంది; ‘తమ’ మరియు ‘నిమగ్నమై ఉన్నారు’ అనేవి సందర్భార్థాన్ని సహజమైన తెలుగులో వెల్లడిస్తాయి.
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: అయితే మా విషయానికొస్తే
  rationale: స్వతంత్ర సర్వనామంతో కూడిన వావ్ ఇక్కడ ఉత్తర రాజ్యానికి విరుద్ధంగా యూదావారి స్థితిని నొక్కిచెబుతోంది; ఈ ప్రయోగం ఆ సందర్భోచిత వ్యత్యాసాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: אֱלֹהֵינוּ
  choice: మా దేవుడు
  rationale: ఏకవచన సూచ్యమైన యాహ్వేను ఉద్దేశించినందున ఇది ఇశ్రాయేలు దేవునికి వాడే ఏకవచనార్థక బిరుదు.
- source_word: וְלֹא עֲזַבְנֻהוּ
  choice: మేము ఆయనను విడిచిపెట్టలేదు
  rationale: עזב అనే పదంలోని ‘విడిచిపెట్టు/త్యజించు’ భావాన్ని, కొనసాగుతున్న నిబంధన విశ్వాస్యత గురించిన అబీయా వాదనకు సరిపోయే సహజమైన తెలుగులో అందిస్తుంది.
- source_word: מְשָׁרְתִים
  choice: పరిచర్య చేసే
  rationale: ఈ వర్తమాన కృదంతం కొనసాగుతున్న యాజక సేవను సూచిస్తుంది; ‘పరిచర్య చేసే’ అనేది ఆరాధన సంబంధ సందర్భాన్ని నిలుపుతుంది.
- source_word: בְּנֵי אַהֲרֹן
  choice: అహరోను కుమారులు
  rationale: హీబ్రూ పదబంధంలోని రూపాన్ని నిలుపుతూ వంశపారంపర్య యాజక శ్రేణిని సూచిస్తుంది; ‘వారసులు’ అని విస్తరించి వ్యాఖ్యానించలేదు.
- source_word: וְהַלְוִיִּם בַּמְלָאכֶת
  choice: లేవీయులు తమ పనిలో నిమగ్నమై ఉన్నారు
  rationale: మూలంలోని సంక్షిప్త నామవాచక వాక్యాన్ని సహజమైన తెలుగులో పూర్తి చేస్తూ, లేవీయులు తమకు అప్పగించిన సేవాపనిలో కొనసాగుతున్నారనే సందర్భార్థాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా, ‘Jehovah’ రూపానికి బదులు సాధారణ పండితీయ ‘Yahweh’ ఉచ్చారణను తెలుగులో ప్రతిబింబిస్తుంది.
- issue: עֲזַבְנֻהוּ క్రియ యొక్క కాలబలం
  choice: మేము ఆయనను విడిచిపెట్టలేదు
  alternative: మేము ఆయనను విడిచిపెట్టము; మేము ఆయనను విడిచిపెట్టలేదు గదా
  rationale: హీబ్రూ సంపూర్ణ క్రియ గతంలో జరిగిన చర్యకే పరిమితం కాక, ప్రసంగ సమయానికి కొనసాగుతున్న నిబద్ధతను సూచించగలదు. తెలుగు భూతకాల నిషేధ రూపం సందర్భంలో ఆ కొనసాగుతున్న ఫలితాన్ని సహజంగా అనుమతిస్తుంది; అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘పరిచర్య’ ఆలయసేవ సందర్భాన్ని తెలియజేస్తుంది; ‘తమ పనిలో నిమగ్నమై ఉన్నారు’ మూలంలోని సంక్షిప్తతను పూర్తిగా అక్షరానువాదం చేయకుండా స్పష్టంగా అందిస్తుంది. ఆంగ్ల సంప్రదింపు పాఠంలో పాదసూచిక గుర్తులు వాటి విషయాలకు సరిపోని స్థానాల్లో కనిపించినందున, [a]ను עזב అనువాదం తరువాత, [b]ను లేవీయుల పని తరువాత ఉంచాం.
