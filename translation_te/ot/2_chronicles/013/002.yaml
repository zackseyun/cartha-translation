source:
  edition: WLC
  text: שָׁל֣וֹשׁ שָׁנִ֗ים מָלַךְ֙ בִּ/יר֣וּשָׁלִַ֔ם וְ/שֵׁ֣ם אִמּ֔/וֹ מִיכָיָ֥הוּ בַת אוּרִיאֵ֖ל מִן גִּבְעָ֑ה וּ/מִלְחָמָ֥ה הָיְתָ֛ה בֵּ֥ין אֲבִיָּ֖ה וּ/בֵ֥ין יָרָבְעָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/002.yaml
  text: He reigned three years in Jerusalem[a], and his mother’s name was Micaiah daughter of Uriel from Gibeah. And there was war between Abijah and Jeroboam.
translation:
  language: te
  text: అతడు యెరూషలేములో మూడు సంవత్సరాలు రాజుగా పరిపాలించాడు.[a] అతని తల్లి పేరు మీకాయా; ఆమె గిబియాకు చెందిన ఊరియేలు కుమార్తె. అబీయాకూ యెరోబాముకూ మధ్య యుద్ధం జరిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సమాంతర వచనమైన 1 రాజులు 15:2లో అబీయా తల్లి పేరు మయకా అని ఉంది. హీబ్రూలో ‘కుమార్తె’ అనే మాటను కొన్నిసార్లు మరింత విస్తృతంగా స్త్రీ వంశస్థురాలు అనే అర్థంలోనూ వాడతారు. కాబట్టి ఈ రెండు వివరాలు వేర్వేరు నామ లేదా వంశావళి పద్ధతులను ప్రతిబింబిస్తూ ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: מָלַךְ
  choice: రాజుగా పరిపాలించాడు
  rationale: రాజ్యపాలనను సూచించే హీబ్రూ క్రియకు సహజమైన ఆధునిక తెలుగు రూపం; కేవలం ‘రాజుగా ఉన్నాడు’ కంటే పాలన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וְשֵׁם אִמּוֹ
  choice: అతని తల్లి పేరు
  rationale: హీబ్రూ వంశావళి సూత్రాన్ని అర్థానికి దగ్గరగా, సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: מִיכָיָהוּ
  choice: మీకాయా
  rationale: ఈ వచనంలోని హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ; రాజుల గ్రంథంలోని వేరే నామరూపాన్ని ఇక్కడికి దిగుమతి చేయదు.
- source_word: בַת אוּרִיאֵל
  choice: ఊరియేలు కుమార్తె
  rationale: మూలంలోని నిర్మాణ సంబంధాన్ని నేరుగా నిలుపుతుంది; ‘కుమార్తె’కు విస్తృత వంశార్థం ఉండవచ్చన్న అవకాశాన్ని ప్రధాన పాఠ్యంలో నిర్బంధంగా నిర్ణయించదు.
- source_word: מִן גִּבְעָה
  choice: గిబియాకు చెందిన
  rationale: מִן సూచించే మూలస్థాన సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది. ఈ స్థలసూచన ఊరియేలుతో అనుసంధానమయ్యే హీబ్రూ పదక్రమాన్ని కూడా కాపాడుతుంది.
- source_word: וּמִלְחָמָה הָיְתָה
  choice: యుద్ధం జరిగింది
  rationale: ‘యుద్ధం ఉండెను’ అనే అసహజ పదానువాదాన్ని నివారిస్తూ, మూలంలోని సాధారణ అస్తిత్వ వాక్యాన్ని అదనపు కాలవ్యాప్తి భావం లేకుండా తెలుగులో అందిస్తుంది.
- source_word: בֵּין ... וּבֵין
  choice: '...కు ...కు మధ్య'
  rationale: రెండు పక్షాల మధ్య పరస్పర విరోధాన్ని తెలిపే హీబ్రూ జంట అవ్యయ నిర్మాణానికి సహజమైన తెలుగు సమానం.
- source_word: אֲבִיָּה
  choice: అబీయా
  rationale: దినవృత్తాంతముల గ్రంథంలోని హీబ్రూ నామరూపాన్నే అనుసరిస్తుంది; రాజుల గ్రంథ సంప్రదాయంలోని అబీయాము రూపాన్ని కలపదు.
theological_decisions:
- issue: అబీయా తల్లి పేరుకు దినవృత్తాంతములు, రాజులు గ్రంథాల్లో కనిపించే భేదం
  choice: ప్రధాన పాఠ్యంలో ‘గిబియాకు చెందిన ఊరియేలు కుమార్తె మీకాయా’ అనే దినవృత్తాంతముల హీబ్రూ పాఠాన్నే నిలుపుట
  alternative: 1 రాజులు 15:2లోని మయకా అనే పేరుతో సమన్వయపరచడం, లేదా ప్రధాన పాఠ్యంలోనే ‘కుమార్తె’ను మనుమరాలు/వంశస్థురాలు అని వివరించడం
  rationale: అనువాదం అందిన హీబ్రూ పాఠ్యానికి సాక్ష్యమివ్వాలి; సమాంతర వచనంతో ఉన్న చారిత్రక లేదా వంశావళి ఉద్రిక్తతను మౌనంగా పరిష్కరించకూడదు. సాధ్యమైన వివరణను పాదటిప్పణిలో ఉంచడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. రాజ్యపాలన సూత్రానికి ‘రాజుగా పరిపాలించాడు’ వాడబడింది. వంశావళి భేదాన్ని ప్రధాన పాఠ్యంలో సమన్వయపరచకుండా పాదటిప్పణిలో సూచించాం.
