id: 2CH.13.6
reference: 2 Chronicles 13:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֨קָם֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט עֶ֖בֶד שְׁלֹמֹ֣ה בֶן דָּוִ֑יד וַ/יִּמְרֹ֖ד עַל אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/006.yaml
  text: Jeroboam son of Nebat[a], a servant of Solomon son of David, rose up and rebelled against his lord.
translation:
  language: te
  text: నెబాతు కుమారుడైన యరొబాము—దావీదు కుమారుడైన సొలొమోనుకు సేవకుడు—లేచి, తన యజమానిపై[a] తిరుగుబాటు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన అధిపతిపై.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום అనే క్రియ ఇక్కడ యరొబాము వ్యతిరేక చర్యకు పూనుకున్నాడనే కథన భావాన్ని ఇస్తుంది. సైనిక చర్య అని అదనంగా నిర్ధారించకుండా ‘లేచి’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: నెబాతు కుమారుడైన యరొబాము
  rationale: వ్యక్తి పేర్లను ప్రామాణిక తెలుగు రూపాల్లో ఇచ్చి, హీబ్రూ పితృనామ సంబంధాన్ని స్పష్టంగా నిలిపాం.
- source_word: עֶבֶד
  choice: సేవకుడు
  rationale: ఈ పదం దాసుడు లేదా సేవకుడు అనే అర్థాలు ఇవ్వగలదు. రాజ పరిపాలనా సందర్భంలో సొలొమోనుకు లోబడిన అధికార సంబంధాన్ని ‘సేవకుడు’ సహజంగా తెలియజేస్తుంది; ఆస్తిగా కొనబడిన దాసుడనే భావాన్ని అనవసరంగా రుద్దదు.
- source_word: שְׁלֹמֹה בֶן דָּוִיד
  choice: దావీదు కుమారుడైన సొలొమోను
  rationale: వంశపారంపర్య ప్రాధాన్యాన్ని నిలుపుతూ, పేర్లను ప్రామాణిక తెలుగు రూపాల్లో ఇచ్చాం.
- source_word: וַיִּמְרֹד
  choice: తిరుగుబాటు చేశాడు
  rationale: מרד అధికారానికి వ్యతిరేకంగా తిరుగుబాటు చేయడాన్ని సూచిస్తుంది. రాజకీయ సందర్భంలో ఇదే స్పష్టమైన, సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: עַל אֲדֹנָיו
  choice: తన యజమానిపై
  rationale: ఇక్కడ సూచించబడింది యరొబాముపై అధికారం కలిగిన సొలొమోను. ‘యజమాని’ మానవ అధికార సంబంధాన్ని తెలియజేస్తూ, దేవునికి వాడే బిరుదుతో గందరగోళం రాకుండా చేస్తుంది.
theological_decisions:
- issue: మానవ అధికారిని సూచించే אֲדֹנָיו అనువాదం
  choice: తన యజమానిపై
  alternative: తన అధిపతిపై
  rationale: ఇది దేవుని నామమో దైవ బిరుదో కాదు; సొలొమోను అనే మానవ అధికారిని సూచిస్తుంది. ‘యజమాని’ సేవకుడు–అధికారి సంబంధాన్ని సహజంగా చూపుతుంది; ‘అధిపతి’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని వరుస చర్యలు ‘లేచి ... తిరుగుబాటు చేశాడు’గా నిలుపబడ్డాయి. మధ్యలోని పరిచయ వివరణను దీర్ఘ విరామ చిహ్నాలతో వేరు చేసి వాక్యాన్ని సులభంగా చదవగలిగేలా చేశాం.
