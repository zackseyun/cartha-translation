  source_fidelity: 'హీబ్రూ వాక్యంలోని అంశాలన్నీ నమ్మకంగా ప్రతిఫలించాయి: నెబాతు కుమారుడైన యరొబాము, దావీదు కుమారుడైన సొలొమోను సేవకుడనే పరిచయం, ‘లేచి’ అనే ఆరంభ-వ్యతిరేక చర్య, తన ఉన్నతాధికారికి వ్యతిరేకంగా చేసిన తిరుగుబాటు. ‘లేచి’ సైనిక చర్యను అనవసరంగా నిర్దిష్టం చేయకుండా וַיָּקָם యొక్క కథన బలాన్ని కాపాడుతుంది.'
