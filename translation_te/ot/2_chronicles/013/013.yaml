translation:
  language: te
  text: అయితే యరొబాము వారిని వెనుకకు చేరడానికి మాటుదాడి దళాన్ని చుట్టూ తిప్పాడు. అప్పుడు వారు యూదావారి ఎదుట ఉండగా, మాటుదాడి దళం యూదావారి వెనుక ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָרָבְעָם
  choice: యరొబాము
  rationale: హీబ్రూ పేరుకు తెలుగు బైబిలు వాడుకలో సహజమైన లిప్యంతరీకరణ.
- source_word: הַמַּאְרָב
  choice: మాటుదాడి దళం
  rationale: దాగి ఉండి ఆకస్మికంగా దాడి చేసే సైనిక విభాగాన్ని సందర్భానుగుణంగా స్పష్టంగా తెలియజేస్తుంది.
- source_word: הֵסֵב
  choice: చుట్టూ తిప్పాడు
  rationale: దళాన్ని ప్రత్యర్థుల వెనుకకు చేరేలా మళ్లించాడనే causative భావాన్ని నిలుపుతుంది.
- source_word: לָבוֹא מֵאַחֲרֵיהֶם
  choice: వారిని వెనుకనుంచి ముట్టడించడానికి
  rationale: అక్షరార్థమైన ‘వారి వెనుకకు రావడానికి’ అనే భావాన్ని సహజ తెలుగు సైనిక సందర్భంలో వ్యక్తపరుస్తుంది.
- source_word: לִפְנֵי יְהוּדָה
  choice: యూదావారి ముందు
  rationale: ఇక్కడ ‘యూదా’ అనేది యూదా సైన్యాన్ని సూచించే సమూహార్థక ప్రయోగం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సైనిక కదలిక స్పష్టంగా ఉండేలా రెండు వాక్యాలుగా అందించబడింది. మూలంలోని ముందూ–వెనుకా నిర్మాణం నిలుపబడింది.
