  revision_rationale: సవరణలు మూల హీబ్రూలోని ఆచారపరమైన శుద్ధతను కచ్చితంగా ప్రతిబింబిస్తాయి, మూలంలో లేని ‘అప్పగించిన’ భావాన్ని తొలగిస్తాయి, మరియు ధూపార్పణం, దీపాల వెలిగింపు అనే ఆలయసేవా చర్యలను సహజమైన ఆధునిక తెలుగులో స్పష్టం చేస్తాయి. పునరుక్త కాలసూచకాల పంపిణీయ భావం ‘ప్రతి ఉదయం, ప్రతి సాయంత్రం’లో నిలిచింది; రొట్టెల పదబంధానికి పాదసూచిక యథార్థ ప్రత్యామ్నాయాలను భద్రపరుస్తుంది.
