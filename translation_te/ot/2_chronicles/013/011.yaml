source:
  edition: WLC
  text: וּ/מַקְטִרִ֣ים לַ/יהוָ֡ה עֹל֣וֹת בַּ/בֹּֽקֶר בַּ/בֹּ֣קֶר וּ/בָ/עֶֽרֶב בָּ/עֶ֣רֶב וּ/קְטֹֽרֶת סַמִּים֩ וּ/מַעֲרֶ֨כֶת לֶ֜חֶם עַל הַ/שֻּׁלְחָ֣ן הַ/טָּה֗וֹר וּ/מְנוֹרַ֨ת הַ/זָּהָ֤ב וְ/נֵרֹתֶ֨י/הָ֙ לְ/בָעֵר֙ בָּ/עֶ֣רֶב בָּ/עֶ֔רֶב כִּֽי שֹׁמְרִ֣ים אֲנַ֔חְנוּ אֶת מִשְׁמֶ֖רֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/אַתֶּ֖ם עֲזַבְתֶּ֥ם אֹתֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/011.yaml
  text: And we offer up burnt offerings to Yahweh morning by morning and evening by evening[a], and fragrant incense, and the arrangement of bread on the pure table, and the golden lampstand with its lamps to burn evening by evening; for we are keeping the charge of Yahweh our God, but you have forsaken him.
translation:
  language: te
  text: మేము ప్రతి ఉదయం, ప్రతి సాయంత్రం యెహోవాకు దహనబలులను అర్పిస్తున్నాం; సుగంధ ధూపాన్ని అర్పిస్తున్నాం; శుద్ధమైన బల్లపై రొట్టెలను వరుసగా అమరుస్తున్నాం[a]; బంగారు దీపస్తంభంలోని దీపాలను ప్రతి సాయంత్రం వెలిగిస్తున్నాం. ఎందుకంటే మేము మా దేవుడైన యెహోవా సేవావిధిని పాటిస్తున్నాం; కానీ మీరు ఆయనను విడిచిపెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సన్నిధి రొట్టెలు” లేదా “సముఖపు రొట్టెలు.” అక్షరార్థంగా, “రొట్టెల అమరిక.”
    reason: మూలంలోని מַעֲרֶכֶת לֶחֶם పదబంధానికి అక్షరార్థం మరియు సంప్రదాయ ఆలయపరమైన ప్రత్యామ్నాయాలను తెలియజేయడం.
lexical_decisions:
- source_word: וּמַקְטִרִים
  choice: అర్పిస్తున్నాం
  rationale: హిఫీల్ రూపం బలిని బలిపీఠంపై పొగగా పైకి లేవేలా చేయడాన్ని సూచిస్తుంది. ‘దహనబలులు’ అనే కర్మతో కలిపి ‘అర్పిస్తున్నాం’ సహజంగా బలిసంబంధ భావాన్ని తెలియజేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: మూలంలోని ఒడంబడిక నామమైన יהוהను తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: עֹלוֹת
  choice: దహనబలులు
  rationale: పూర్తిగా దహనం చేసి అర్పించే עֹלָה బలికి ఇది ప్రామాణికమైన, స్పష్టమైన తెలుగు పదం.
- source_word: בַּבֹּקֶר בַּבֹּקֶר / בָּעֶרֶב בָּעֶרֶב
  choice: ప్రతి ఉదయం, ప్రతి సాయంత్రం
  rationale: హీబ్రూ పునరుక్తి క్రమంగా ప్రతిరోజూ జరిగే ఆచరణను సూచిస్తుంది; ఆధునిక తెలుగులో ఈ పంపిణీయ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּקְטֹרֶת סַמִּים
  choice: సుగంధ ధూపం
  rationale: קְטֹרֶת ధూపాన్ని, סַמִּים సుగంధ ద్రవ్యాలను సూచిస్తాయి; ఈ పదబంధం ప్రత్యేకంగా తయారుచేసిన పరిమళ ధూప భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וּמַעֲרֶכֶת לֶחֶם
  choice: రొట్టెలను వరుసగా అమరుస్తున్నాం
  rationale: מַעֲרֶכֶת అనే పదంలోని క్రమబద్ధమైన అమరిక భావాన్ని నిలుపుతూ, తెలుగులో సహజమైన క్రియారూపంగా అనువదించాం; సంప్రదాయ పదాన్ని ప్రధాన పాఠంలోకి దిగుమతి చేయలేదు.
- source_word: עַל הַשֻּׁלְחָן הַטָּהוֹר
  choice: పవిత్రమైన బల్లపై
  rationale: טָהוֹר ఇక్కడ ఆచారపరమైన శుద్ధతను సూచిస్తుంది. ‘పవిత్రమైన’ అనే పదం సాధారణ పరిశుభ్రతకన్నా ఆలయసంబంధ ప్రత్యేకతను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וּמְנוֹרַת הַזָּהָב וְנֵרֹתֶיהָ לְבָעֵר
  choice: బంగారు దీపస్తంభపు దీపాలు … వెలిగేలా
  rationale: ఆలయ సామగ్రిని స్పష్టంగా గుర్తిస్తూ, לְבָעֵר లోని ప్రయోజనార్థక భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שֹׁמְרִים אֲנַחְנוּ אֶת מִשְׁמֶרֶת יְהוָה
  choice: యెహోవా అప్పగించిన సేవను నిబద్ధంగా నిర్వహిస్తున్నాం
  rationale: שמר את־משמרת అనే సంరక్షణ/బాధ్యత నిర్వహణ నుడికారాన్ని పదశః కాకుండా దాని ఆలయసేవా భావంతో స్పష్టంగా అందిస్తుంది.
- source_word: וְאַתֶּם עֲזַבְתֶּם אֹתוֹ
  choice: కానీ మీరు ఆయనను విడిచిపెట్టారు
  rationale: ప్రత్యక్ష విరుద్ధతను, దేవునిపట్ల అవిశ్వాసాన్ని మూలానికి దగ్గరగా నిలుపుతుంది.
theological_decisions:
- issue: ఆలయ రొట్టెల పరిభాష
  choice: రొట్టెలను వరుసగా అమరుస్తున్నాం
  alternative: సన్నిధి రొట్టెలు / సముఖపు రొట్టెలు
  rationale: మూలపదబంధం అక్షరార్థంగా రొట్టెల క్రమబద్ధ అమరికను చెబుతుంది. సంప్రదాయ పేర్లు సందర్భానుసారంగా సరైనవైనా మరింత వ్యాఖ్యానాత్మకమైనవి; అందువల్ల వాటిని పాదసూచికలో ఉంచాం.
- issue: దైవిక ఒడంబడిక నామం יהוה
  choice: యెహోవా
  alternative: యహ్వే / ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో నిలిపాం.
- issue: מִשְׁמֶרֶת యొక్క ఆలయసేవా భావం
  choice: అప్పగించిన సేవను నిబద్ధంగా నిర్వహిస్తున్నాం
  alternative: ఆజ్ఞను పాటిస్తున్నాం / కావలిని కాస్తున్నాం
  rationale: ఇక్కడ భావం కేవలం ఒక ఆజ్ఞకు విధేయత మాత్రమే కాదు; యాజకులు తమకు అప్పగించబడిన ఆరాధనా బాధ్యతను కాపాడుతూ నిర్వహించడం. అనువాదం ఆ విస్తృత భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి. నిరంతర ఆలయసేవను చూపేందుకు వర్తమాన కొనసాగింపు క్రియారూపాలు వాడాం. హీబ్రూ పునరుక్తుల భావాన్ని సహజమైన ‘ప్రతి ఉదయం, ప్రతి సాయంత్రం’ రూపంలో అందించాం; ప్రధాన పాఠంలో అనవసరమైన సంప్రదాయ సాంకేతిక పదజాలాన్ని తగ్గించాం.
