  to: మేము ప్రతి ఉదయం, ప్రతి సాయంత్రం యెహోవాకు దహనబలులను అర్పిస్తున్నాం; సుగంధ ధూపాన్ని అర్పిస్తున్నాం; శుద్ధమైన బల్లపై రొట్టెలను వరుసగా అమరుస్తున్నాం[a]; బంగారు దీపస్తంభంలోని దీపాలను ప్రతి సాయంత్రం వెలిగిస్తున్నాం. ఎందుకంటే మేము మా దేవుడైన యెహోవా సేవావిధిని పాటిస్తున్నాం; కానీ మీరు ఆయనను విడిచిపెట్టారు.
