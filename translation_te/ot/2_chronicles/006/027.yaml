source:
  edition: WLC
  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע הַ/שָּׁמַ֗יִם וְ/סָ֨לַחְתָּ֜ לְ/חַטַּ֤את עֲבָדֶ֨י/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל כִּ֥י תוֹרֵ֛/ם אֶל הַ/דֶּ֥רֶךְ הַ/טּוֹבָ֖ה אֲשֶׁ֣ר יֵֽלְכוּ בָ֑/הּ וְ/נָתַתָּ֤ה מָטָר֙ עַֽל אַרְצְ/ךָ֔ אֲשֶׁר נָתַ֥תָּה לְ/עַמְּ/ךָ֖ לְ/נַחֲלָֽה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/027.yaml
  text: then may you hear in heaven and forgive the sin of your servants and of your people Israel[a], when you teach them the good way in which they should walk, and give rain on your land that you have given to your people as an inheritance.
translation:
  language: te
  text: అప్పుడు నీవు పరలోకంలో ఆలకించి[a], నీ సేవకుల, నీ ప్రజలైన ఇశ్రాయేలు పాపాన్ని క్షమించు. వారు నడవవలసిన మంచి మార్గాన్ని నీవు వారికి బోధించినప్పుడు[b], నీ ప్రజలకు స్వాస్థ్యంగా ఇచ్చిన నీ దేశం మీద వర్షం కురిపించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరలోకం నుండి ఆలకించి.” హీబ్రూలో పదశః “ఆకాశాలను ఆలకించి” అని ఉంది; దేవుడు తన పరలోక నివాసంలోనుండి వినడాన్ని సూచించే ప్రార్థనా ప్రయోగం ఇది.
    reason: మూల హీబ్రూ ప్రయోగంలోని విభక్తి అస్పష్టతను, దాని సాధారణ భావాన్ని తెలియజేయడం.
  - marker: b
    text: లేదా, “ఎందుకంటే నీవు వారికి వారు నడవవలసిన మంచి మార్గాన్ని బోధిస్తావు.”
    reason: כִּי అనే పదానికి ఇక్కడ కాలసంబంధమైన భావంతో పాటు కారణార్థక భావం కూడా సాధ్యమని నిలుపడం.
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: ఆకాశంలో ఆలకించి
  rationale: హీబ్రూ పదబంధంలో విభక్తి సూచక అవ్యయం లేకపోయినా, ఈ ప్రార్థనా సందర్భంలో దేవుడు తన పరలోక నివాసంలో వింటాడనే భావం ఉంది. ‘ఆలకించి’ ప్రార్థనను శ్రద్ధగా వినడాన్ని తెలిపే సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: పాపాన్ని క్షమించు
  rationale: חטאת ఇక్కడ పాపాన్ని లేదా అపరాధాన్ని సూచిస్తుంది. విన్నప రూపంలో ‘క్షమించు’ సహజంగా ఉంది.
- source_word: עֲבָדֶיךָ
  choice: నీ సేవకులు
  rationale: దేవునికి లోబడిన ఆరాధక ప్రజలను సూచించే ఈ సందర్భంలో ‘సేవకులు’ తగినది; ‘బానిసలు’ అనవసరంగా సామాజిక బానిసత్వాన్ని ముందుకు తెస్తుంది.
- source_word: כִּי תוֹרֵם
  choice: నీవు వారికి బోధించినప్పుడు
  rationale: כִּי ఇక్కడ కాలసంబంధమైన లేదా సందర్భసంబంధమైన భావాన్ని ఇవ్వగలదు; ירה హిఫీల్ రూపం బోధించడం లేదా దారి చూపించడం అనే భావం ఇస్తుంది. కారణార్థక పఠనాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֶל הַדֶּרֶךְ הַטּוֹבָה אֲשֶׁר יֵלְכוּ בָהּ
  choice: వారు నడవవలసిన మంచి మార్గాన్ని
  rationale: ‘నడవడం’ అనే బైబిలీయ జీవననడత రూపకాన్ని నిలుపుతూ, הַטּוֹבָה యొక్క నైతిక గుణాన్ని ‘మంచి’ అని నేరుగా అనువదించాం.
- source_word: וְנָתַתָּ מָטָר
  choice: వర్షం కురిపించు
  rationale: పదశః ‘వర్షాన్ని ఇవ్వు’ అయినప్పటికీ, ఆధునిక తెలుగులో ‘వర్షం కురిపించు’ అదే క్రియాత్మక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַל אַרְצְךָ
  choice: నీ దేశం మీద
  rationale: హీబ్రూలోని ద్వితీయ పురుష స్వామ్యార్థాన్ని నిలిపాం; ఈ సందర్భంలో אֶרֶץ ఇశ్రాయేలుకు అనుగ్రహించిన దేశాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר נָתַתָּה לְעַמְּךָ לְנַחֲלָה
  choice: నీ ప్రజలకు స్వాస్థ్యంగా ఇచ్చిన
  rationale: נחלה వంశపారంపర్యంగా లభించిన స్వాస్థ్యాన్ని, ప్రత్యేకంగా నిబంధనలోని దేశానుగ్రహాన్ని సూచిస్తుంది. ‘స్వాస్థ్యం’ ఆ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: כִּי ద్వారా సూచించబడే బోధనకు, క్షమాపణ మరియు వర్షానికి మధ్య సంబంధం
  choice: ‘బోధించినప్పుడు’ అని కాలసంబంధమైన లేదా సందర్భసంబంధమైన భావంతో అనువదించడం
  alternative: ‘ఎందుకంటే నీవు వారికి బోధిస్తావు’ అని కారణార్థకంగా అనువదించడం
  rationale: సందర్భంలో ఇది వినడం, క్షమించడం, మార్గం బోధించడం, వర్షం అనుగ్రహించడం అనే పునరుద్ధరణ విన్నప ప్రవాహానికి సరిపోతుంది. అయితే כִּי కారణార్థకంగానూ ఉండగలదు కాబట్టి ఆ సాధ్యతను పాదసూచికలో నిలిపాం.
- issue: దేవుడు వినే స్థలాన్ని సూచించే תִּשְׁמַע הַשָּׁמַיִם అనే సంక్షిప్త హీబ్రూ ప్రయోగం
  choice: ‘ఆకాశంలో ఆలకించి’
  alternative: ‘ఆకాశం నుండి ఆలకించి’
  rationale: మూలంలోని స్థలభావానికి దగ్గరగా ఉండే పఠనాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సహజమైన మూలస్థాన భావ పఠనాన్ని పాదసూచికలో ఇచ్చాం; దేవుని సర్వవ్యాప్తి లేదా నివాసంపై అదనపు సిద్ధాంత నిర్ణయం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలిని వాడాం. ‘ఆలకించు,’ ‘స్వాస్థ్యం’ వంటి గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఎంచుకున్నాం. హీబ్రూ జీవననడత రూపకమైన ‘మార్గంలో నడవడం’ను సహజ తెలుగు వాక్యనిర్మాణంలో నిలిపాం.
