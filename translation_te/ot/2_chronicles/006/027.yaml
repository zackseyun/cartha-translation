revisions:
- from: అప్పుడు నీవు ఆకాశంలో ఆలకించి[a], నీ సేవకులూ నీ ప్రజలైన ఇశ్రాయేలూ చేసిన పాపాన్ని క్షమించు. వారు నడవవలసిన మంచి మార్గాన్ని నీవు వారికి బోధించినప్పుడు[b], నీ ప్రజలకు స్వాస్థ్యంగా ఇచ్చిన నీ దేశం మీద వర్షం కురిపించు.
  to: అప్పుడు నీవు పరలోకంలో ఆలకించి[a], నీ సేవకుల, నీ ప్రజలైన ఇశ్రాయేలు పాపాన్ని క్షమించు. వారు నడవవలసిన మంచి మార్గాన్ని నీవు వారికి బోధించినప్పుడు[b], నీ ప్రజలకు స్వాస్థ్యంగా ఇచ్చిన నీ దేశం మీద వర్షం కురిపించు.
  rationale: The revision corrects the contextual Telugu sense of the Hebrew heaven idiom, improves the syntax governing ‘servants’ and ‘people Israel,’ and makes the footnote’s literal Hebrew wording formally accurate. It preserves the draft’s cautious temporal rendering of כִּי and its footnoted causal alternative, without resolving the syntactic ambiguity beyond the source evidence.
