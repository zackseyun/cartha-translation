id: 2CH.6.8
reference: 2 Chronicles 6:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל דָּוִ֣יד אָבִ֔/י יַ֗עַן אֲשֶׁ֤ר הָיָה֙ עִם לְבָ֣בְ/ךָ֔ לִ/בְנ֥וֹת בַּ֖יִת לִ/שְׁמִ֑/י הֱֽטִיב֔וֹתָ כִּ֥י הָיָ֖ה עִם לְבָבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/008.yaml
  text: But Yahweh said to David my father[a], ‘Because it was in your heart to build a house for my name[b], you did well that it was in your heart.’
translation:
  language: te
  text: 'అయితే యెహోవా నా తండ్రియైన దావీదుతో ఇలా అన్నాడు: “నా నామం కోసం ఒక ఇల్లు[a] కట్టాలనే ఉద్దేశం నీ హృదయంలో ఉన్నందుకు నీవు మంచిగా చేశావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవాలయం.” మూలభాషలో అక్షరార్థంగా “ఇల్లు”; ఇక్కడ సందర్భం దేవాలయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ కథనంలోని సాధారణ ‘అన్నాడు’ అనే భావాన్ని సహజమైన తెలుగు ప్రత్యక్ష వాక్య పరిచయంగా తెలిపింది.
- source_word: אָבִי
  choice: నా తండ్రి
  rationale: సొలొమోను దావీదును ఉద్దేశించి చెప్పిన ప్రత్యక్ష బంధుత్వ సూచనను యథాతథంగా ఉంచింది.
- source_word: יַעַן אֲשֶׁר
  choice: …ఉంది
  rationale: కారణాన్ని తెలిపే ఈ పదబంధం తెలుగులో తరువాతి ప్రశంసతో సహజంగా అనుసంధానమయ్యేలా వాక్య నిర్మాణంలో వ్యక్తమైంది.
- source_word: הָיָה עִם לְבָבְךָ
  choice: నీ హృదయంలో ఉంది
  rationale: అంతరంగ ఉద్దేశాన్ని సూచించే హీబ్రూ హృదయ రూపకాన్ని స్పష్టమైన ఆధునిక తెలుగులో నిలిపింది.
- source_word: לִבְנוֹת בַּיִת לִשְׁמִי
  choice: నా నామం కోసం ఒక మందిరం కట్టాలని
  rationale: సందర్భంలో בַּיִת దేవాలయాన్ని సూచిస్తున్నందున సహజ తెలుగులో ‘మందిరం’ వాడి, అక్షరార్థమైన ‘ఇల్లు’ను పాదసూచికలో తెలిపాం; ‘నా నామం కోసం’ అనే ముఖ్యమైన భావాన్ని నిలిపాం.
- source_word: הֱטִיבוֹתָ
  choice: మంచిదే
  rationale: దావీదు ఉద్దేశంపై దేవుని ఆమోదాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי הָיָה עִם לְבָבֶךָ
  choice: అది నీ హృదయంలో ఉండడం
  rationale: హీబ్రూలోని పునరుక్తిని పూర్తిగా తొలగించకుండా, తెలుగులో గ్రాహ్యంగా ఉండేందుకు ‘అది’ అనే సూచనతో అందించింది.
theological_decisions:
- issue: בַּיִת לִשְׁמִי అనే దేవాలయ సంబంధిత పదబంధం
  choice: నా నామం కోసం ఒక మందిరం
  alternative: నా నామం కోసం ఒక ఇల్లు
  rationale: ‘మందిరం’ సందర్భార్థాన్ని సాధారణ తెలుగు పాఠకుడికి స్పష్టం చేస్తుంది; ‘నా నామం కోసం’ అనే పదబంధం ద్వారా దేవుడు ఆ కట్టడంలో పరిమితుడనే భావాన్ని రుద్దకుండా మూలంలోని ధార్మిక ప్రాధాన్యాన్ని నిలిపింది. అక్షరార్థాన్ని పాదసూచికలో భద్రపరిచాం.
- issue: చివరి כִּי వాక్యభాగంలోని సంబంధం
  choice: అది నీ హృదయంలో ఉండడం మంచిదే
  alternative: అది నీ హృదయంలో ఉన్నందుకు నీవు మంచిగా చేశావు
  rationale: כִּי ఇక్కడ విషయవాచకంగానూ కారణవాచకంగానూ గ్రహించవచ్చు. ప్రధాన పాఠం ఉద్దేశంపై దేవుని ఆమోదాన్ని తెలుపుతూ హీబ్రూ పునరుక్తిని నిలిపింది; ప్రత్యామ్నాయం కారణ సంబంధాన్ని మరింత స్పష్టంగా చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ ‘హృదయం’ రూపకాన్నీ, ‘నా నామం కోసం’ అనే భావాన్నీ నిలిపి, అసహజమైన పదక్రమాన్ని నివారించాం.
