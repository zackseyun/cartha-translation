- from: 'అయితే యెహోవా నా తండ్రి దావీదుతో ఇలా అన్నాడు: “నా నామం కోసం ఒక మందిరం[a] కట్టాలని నీ హృదయంలో ఉంది. అది నీ హృదయంలో ఉండడం మంచిదే.”'
  to: 'అయితే యెహోవా నా తండ్రియైన దావీదుతో ఇలా అన్నాడు: “నా నామం కోసం ఒక ఇల్లు[a] కట్టాలనే ఉద్దేశం నీ హృదయంలో ఉన్నందుకు నీవు మంచిగా చేశావు.”'
  rationale: సవరణ మూలంలోని కారణసంబంధాన్ని ‘ఉన్నందుకు’ ద్వారా, దావీదుకు ఉద్దేశించిన ప్రశంసను ‘నీవు మంచిగా చేశావు’ ద్వారా పునరుద్ధరిస్తుంది. ‘ఇల్లు’ ప్రధాన పాఠంలో బַּיִתను ప్రతిఫలింపజేస్తుంది; దేవాలయ సందర్భార్థం పాదసూచికలో అందించబడింది. హీబ్రూ పునరుక్తి తెలుగులో ఒకే సహజమైన ‘ఉద్దేశం’ నిర్మాణంలో సంక్షిప్తమవుతున్నా, ఉద్దేశం హృదయంలో ఉండటం మరియు దానికి దైవిక ఆమోదం అనే రెండు భావాలు నిలిచాయి.
