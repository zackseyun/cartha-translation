  - marker: c
    text: లేదా “నీ మంచితనంలో ఆనందించుగాక.” హెబ్రీయ పాఠంలో అక్షరార్థంగా “మంచిలో/మేలులో” అని ఉంది; “నీ” అనే స్వామ్యార్థక పదం స్పష్టంగా లేదు.
