revisions:
- from: ఇప్పుడు యెహోవా దేవా, నీవు లేచి, నీవూ నీ బలపు మందసం[a] నీ విశ్రాంతి స్థలానికి రండి. యెహోవా దేవా, నీ యాజకులు రక్షణను వస్త్రంగా ధరించుగాక; నీ విశ్వాసపాత్రులు[b] మంచిదానిలో ఆనందించుగాక.[c]
  to: ఇప్పుడు యెహోవా దేవా, నీ బలపు మందసముతో నీ విశ్రాంతి స్థలానికి లేచి రమ్ము. యెహోవా దేవా, నీ యాజకులు రక్షణను వస్త్రంగా ధరించుగాక; నీ విశ్వాసపాత్రులు మేలులో ఆనందించుగాక.[a][b][c]
  rationale: 'The opening petition has been recast to resolve the Telugu agreement problem while retaining the imperative to Yahweh, the destination of the resting place, and the ark of divine strength. The final expression is changed to the idiomatic and semantically broad “మేలులో.” Footnote anchors are placed directly after the terms to which they apply: the ark, faithful ones, and the final phrase respectively.'
