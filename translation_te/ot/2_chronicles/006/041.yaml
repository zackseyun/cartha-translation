reference: 2 Chronicles 6:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֗ה קוּמָ֞/ה יְהוָ֤ה אֱלֹהִים֙ לְֽ/נוּחֶ֔/ךָ אַתָּ֖ה וַ/אֲר֣וֹן עֻזֶּ֑/ךָ כֹּהֲנֶ֜י/ךָ יְהוָ֤ה אֱלֹהִים֙ יִלְבְּשׁ֣וּ תְשׁוּעָ֔ה וַ/חֲסִידֶ֖י/ךָ יִשְׂמְח֥וּ בַ/טּֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/041.yaml
  text: And now arise[a], O Yahweh God, to your resting place, you and the ark of your strength. Let your priests, O Yahweh God, be clothed with salvation[c][b], and let your faithful ones rejoice in what is good.
translation:
  language: te
  text: ఇప్పుడు యెహోవా దేవా, నీ బలపు మందసముతో నీ విశ్రాంతి స్థలానికి లేచి రమ్ము. యెహోవా దేవా, నీ యాజకులు రక్షణను వస్త్రంగా ధరించుగాక; నీ విశ్వాసపాత్రులు మేలులో ఆనందించుగాక.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ శక్తి మందసం,” “నీ పరాక్రమపు మందసం.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “నీ భక్తులు,” “నీ పరిశుద్ధులు.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “నీ మంచితనంలో ఆనందించుగాక.” హెబ్రీయ పాఠంలో అక్షరార్థంగా “మంచిలో/మేలులో” అని ఉంది; “నీ” అనే స్వామ్యార్థక పదం స్పష్టంగా లేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: ప్రార్థనలో చివరి ప్రధాన విన్నపాన్ని పరిచయం చేసే కాలసూచక పదంగా సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: קוּמָה
  choice: లేచి
  rationale: దేవునికి ఉద్దేశించిన ఆజ్ఞార్థక ప్రార్థనా భాషను సరళంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: יְהוָה אֱלֹהִים
  choice: యెహోవా దేవా
  rationale: దైవనామాన్ని ‘యెహోవా’గా ఉంచి, ప్రత్యక్ష సంబోధనను తెలుగు సంబోధనా రూపంతో వ్యక్తం చేస్తుంది.
- source_word: לְנוּחֶךָ
  choice: నీ విశ్రాంతి స్థలానికి
  rationale: ఆలయం, మందసం నేపథ్యంలో ఇది కేవలం విశ్రాంతికన్నా స్థిర నివాసస్థలాన్ని సూచిస్తుంది.
- source_word: אַתָּה וַאֲרוֹן עֻזֶּךָ
  choice: నీవూ నీ బలపు మందసం
  rationale: ‘నీవు మరియు నీ బలపు మందసం’ అనే హెబ్రీయ సమన్వయాన్ని, עֹז లోని బలం/శక్తి భావాన్ని సాధ్యమైనంత దగ్గరగా నిలుపుతుంది.
- source_word: כֹּהֲנֶיךָ
  choice: నీ యాజకులు
  rationale: స్వామ్యార్థక బహువచనానికి ప్రత్యక్షమైన, సాధారణ తెలుగు అనువాదం.
- source_word: יִלְבְּשׁוּ תְשׁוּעָה
  choice: రక్షణను వస్త్రంగా ధరించుగాక
  rationale: రక్షణను ధరించడమనే మూలపాఠంలోని వస్త్ర రూపకాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: חֲסִידֶיךָ
  choice: నీ విశ్వాసపాత్రులు
  rationale: నిబంధనాత్మక నిబద్ధత, భక్తి, విశ్వసనీయత అనే భావాలను మతశాఖాపరమైన అదనపు అర్థం లేకుండా తెలియజేస్తుంది.
- source_word: יִשְׂמְחוּ בַטּוֹב
  choice: మంచిదానిలో ఆనందించుగాక
  rationale: ‘మంచి/మేలు’ అనే నిర్దిష్టమైనా విస్తృతమైన హెబ్రీయ పదబంధాన్ని స్వామ్యార్థాన్ని చేర్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా పేరుగానే అందిస్తుంది.
- issue: בַטּוֹב లో దేవుని స్వామ్యార్థాన్ని స్పష్టంగా చేర్చాలా
  choice: మంచిదానిలో
  alternative: నీ మంచితనంలో
  rationale: సందర్భం ‘నీ మంచితనంలో’ అనే భావాన్ని అనుమతించినా, హెబ్రీయ పాఠంలో స్వామ్యప్రత్యయం లేదు; అందువల్ల మూలంలోని సందిగ్ధతను ప్రధాన పాఠంలో నిలిపి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- issue: חֲסִידֶיךָ యొక్క మతపరమైన భావపరిధి
  choice: నీ విశ్వాసపాత్రులు
  alternative: నీ భక్తులు; నీ పరిశుద్ధులు
  rationale: దేవునిపట్ల నిబద్ధతను ప్రధానంగా చూపిస్తూ, తరువాతి కాలపు ప్రత్యేక సంఘపరమైన భావాన్ని అనవసరంగా దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలిని వాడాం. ‘ధరించుగాక,’ ‘ఆనందించుగాక’ రూపాలు విన్నపభావాన్ని నిలుపుతాయి. ‘మందసం’ బైబిలు సందర్భంలో ఒడంబడిక మందసాన్ని సూచించే స్థిరమైన పదంగా ఉపయోగించబడింది.
