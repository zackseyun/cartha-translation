id: 2CH.6.7
reference: 2 Chronicles 6:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֕י עִם לְבַ֖ב דָּוִ֣יד אָבִ֑/י לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/007.yaml
  text: It was in the heart of David my father to build a house for the name of Yahweh[b][a], the God of Israel.
translation:
  language: te
  text: నా తండ్రి దావీదు హృదయంలో ఇశ్రాయేలు దేవుడైన యెహోవా నామం కోసం ఒక ఇల్లు కట్టాలనే సంకల్పం ఉండేది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఒక ఇల్లు’; సందర్భంలో ఇది యెహోవా నామంతో సంబంధం గల ఆలయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עִם לְבַב
  choice: హృదయంలో ... ఉద్దేశం ఉండేది
  rationale: ఈ హెబ్రీ నుడికారం ఒకరి అంతరంగంలో ఉన్న సంకల్పాన్ని సూచిస్తుంది. ‘హృదయంలో’ అనే రూపం మూలంలోని మానవ అంతరంగ భావనను నిలుపుతూ, ‘ఉద్దేశం ఉండేది’ దాని భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: דָּוִיד אָבִי
  choice: నా తండ్రి దావీదు
  rationale: హెబ్రీలో పదక్రమం ‘దావీదు, నా తండ్రి’ అయినా, ‘నా తండ్రి దావీదు’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: לִבְנוֹת בַּיִת
  choice: ఒక మందిరం కట్టాలని
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’; ఇక్కడ సందర్భానుసారం యెహోవా ఆలయాన్ని సూచిస్తుంది. తెలుగులో ‘మందిరం’ ఆ ఉద్దేశిత భవనాన్ని సహజంగా తెలియజేస్తుంది; మూలంలోని ‘నామానికి’ అనే ఆలయ సూత్రాన్ని మాత్రం యథాతథంగా నిలుపుతుంది.
- source_word: לְשֵׁם
  choice: నామానికి
  rationale: ‘నామానికి’ అనే రూపం దినవృత్తాంతాలలోని దేవుని నామం–మందిరం సంబంధాన్ని కాపాడుతుంది; ‘ఘనత కోసం’ వంటి వివరణాత్మక విస్తరణను నివారిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో అందిస్తుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: నామవాచక సమాసాన్ని తెలుగులో సహజమైన విశేషణ నిర్మాణంగా మార్చి, ‘ఇశ్రాయేలు దేవుడు’ అనే నిబంధనాత్మక బిరుదును స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: בַּיִת לְשֵׁם יְהוָה అనే ఆలయ సంబంధిత పదబంధం
  choice: యెహోవా నామానికి ఒక మందిరం
  alternative: యెహోవాకు ఒక మందిరం / యెహోవా ఘనత కోసం ఒక మందిరం
  rationale: ‘నామానికి’ అనే మూలభావం దేవుని సన్నిధి, నామం, ఆలయం మధ్య ఉన్న దినవృత్తాంతాల ప్రత్యేక సంబంధాన్ని వ్యక్తం చేస్తుంది. దాన్ని తొలగించడం లేదా ‘ఘనత’గా మాత్రమే వ్యాఖ్యానించడం మూలంలోని ధార్మిక ఉద్వేగాన్ని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘హృదయంలో ... ఉద్దేశం’ ద్వారా హెబ్రీ నుడికారంలోని రూపం, భావం రెండూ సమతుల్యం చేయబడ్డాయి.
