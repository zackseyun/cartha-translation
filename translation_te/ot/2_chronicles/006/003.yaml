id: 2CH.6.3
reference: 2 Chronicles 6:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּסֵּ֤ב הַ/מֶּ֨לֶךְ֙ אֶת פָּנָ֔י/ו וַ/יְבָ֕רֶךְ אֵ֖ת כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וְ/כָל קְהַ֥ל יִשְׂרָאֵ֖ל עוֹמֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/003.yaml
  text: Then the king turned around and blessed all the assembly of Israel[b][a], while all the assembly of Israel was standing.
translation:
  language: te
  text: అప్పుడు రాజు తిరిగి, ఇశ్రాయేలు సమాజమంతటినీ[a] ఆశీర్వదించాడు; ఇశ్రాయేలు సమాజమంతా నిలబడి ఉండగా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలు సభ అంతటినీ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב ... אֶת־פָּנָיו
  choice: వెనక్కి తిరిగి
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘తన ముఖాన్ని తిప్పి’ అని ఉన్నా, సందర్భంలో శరీరాన్ని వెనక్కి తిప్పుకోవడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘వెనక్కి తిరిగి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: וַיְבָרֶךְ
  choice: ఆశీర్వదించాడు
  rationale: ברך అనే క్రియకు ఇక్కడ నేరమైన, సాధారణ అర్థం ‘ఆశీర్వదించు’; రాజు కూడిన ప్రజలను ఆశీర్వదించడాన్ని సూచిస్తుంది.
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సమాజమంతటినీ / ఇశ్రాయేలు సమాజమంతా
  rationale: קהל అనేది సమావేశమైన ప్రజాసమూహాన్ని సూచిస్తుంది. ‘సమాజం’ ఆధునిక తెలుగులో సహజంగా ఉండి, ‘సభ’ అనే ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో ఉంచే వీలు కల్పిస్తుంది. విభక్తికి అనుగుణంగా మొదటి సందర్భంలో ‘సమాజమంతటినీ’, రెండవ సందర్భంలో ‘సమాజమంతా’ వాడబడింది.
- source_word: עוֹמֵד
  choice: నిలబడి ఉంది
  rationale: ఏకవచన సమూహవాచక నామానికి అనుగుణమైన ఈ వర్తమాన కృదంతం, రాజు ఆశీర్వదిస్తున్న సమయంలో ప్రజలు కొనసాగిస్తూ ఉన్న భంగిమను తెలియజేస్తుంది.
- source_word: וְכָל־קְהַל יִשְׂרָאֵל עוֹמֵד
  choice: ఆ సమయంలో ఇశ్రాయేలు సమాజమంతా నిలబడి ఉంది
  rationale: వావ్‌తో మొదలయ్యే ఈ ఉపవాక్యం సందర్భపరిస్థితిని వివరిస్తుంది. ‘ఆ సమయంలో’ అని అనువదించడం కాలసంబంధాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది; మూలంలోని సమాజం అనే పదబంధ పునరుక్తిని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి పాటించబడింది. హీబ్రూ వాక్యంలోని ‘ఇశ్రాయేలు సమాజమంతా’ అనే పునరుక్తిని తొలగించకుండా నిలిపి, సందర్భపరిస్థితిని తెలిపే చివరి ఉపవాక్యాన్ని ప్రత్యేక వాక్యంగా అందించడం ద్వారా తెలుగు పఠన సౌలభ్యం కల్పించబడింది.
