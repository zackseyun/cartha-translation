id: 2CH.6.24
reference: 2 Chronicles 6:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְֽ/אִם יִנָּגֵ֞ף עַמְּ/ךָ֧ יִשְׂרָאֵ֛ל לִ/פְנֵ֥י אוֹיֵ֖ב כִּ֣י יֶֽחֶטְאוּ לָ֑/ךְ וְ/שָׁ֨בוּ֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וְ/הִתְפַּֽלְל֧וּ וְ/הִֽתְחַנְּנ֛וּ לְ/פָנֶ֖י/ךָ בַּ/בַּ֥יִת הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/024.yaml
  text: If your people Israel are struck down before an enemy because they have sinned against you[a], and they turn back and confess your name, and pray and plead for favor before you in this house[c][b],
translation:
  language: te
  text: నీ ప్రజలైన ఇశ్రాయేలు నీకు విరోధంగా పాపం చేసినందువల్ల శత్రువు ఎదుట ఓడిపోతే, వారు తిరిగి వచ్చి నీ నామాన్ని స్తుతించి, ఈ మందిరంలో నీ సన్నిధిలో ప్రార్థించి కృప కోసం వేడుకుంటే,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִנָּגֵף
  choice: ఓడిపోయి
  rationale: నిఫాల్ రూపం యుద్ధ సందర్భంలో శత్రువు చేతిలో దెబ్బతిని ఓడిపోవడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఓడిపోవడం’ సహజంగా ఉండి, మూలంలోని ఫలితార్థక భావాన్ని అందిస్తుంది.
- source_word: לִפְנֵי אוֹיֵב
  choice: శత్రువు ఎదుట
  rationale: హీబ్రూ పదబంధాన్ని దగ్గరగా అనుసరిస్తూ, శత్రువు సమక్షంలో లేదా అతని బలానికి లోబడి ఓడిపోవడమనే యుద్ధసంబంధ భావాన్ని నిలుపుతుంది.
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: నీకు విరోధంగా పాపం చేసినందువల్ల
  rationale: כִּי ఇక్కడ ఓటమికి కారణాన్ని తెలియజేస్తుంది; לָךְ దేవునికి విరోధంగా చేసిన పాపాన్ని సూచిస్తుంది.
- source_word: וְשָׁבוּ
  choice: వారు తిరిగి
  rationale: שׁוב అనే క్రియకు ‘తిరిగి రావడం’ అనే ప్రాథమిక భావంతో పాటు నిబంధన సంబంధ సందర్భంలో పశ్చాత్తాపంతో దేవునివైపు తిరగడం అనే భావం కూడా ఉంది. ‘తిరిగి’ ఆ విస్తృతిని సంకుచితం చేయదు.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: నీ నామాన్ని స్తుతించి
  rationale: హిఫిల్ రూపంలోని ידה సందర్భానుసారం ఒప్పుకోవడం, స్తుతించడం, కృతజ్ఞత చెల్లించడం అనే అర్థాలను కలిగి ఉంటుంది. ప్రార్థనా సందర్భంలో ‘స్తుతించి’ సహజమైన ప్రధాన పఠనం; ఇతర అవకాశాలు పాదటిప్పణిలో నిలుపబడ్డాయి.
- source_word: וְהִתְפַּלְלוּ
  choice: ప్రార్థిస్తూ
  rationale: హిత్పయేల్ రూపంలోని פלל కు ఇది సాధారణమైన, సహజమైన ఆధునిక తెలుగు అనువాదం.
- source_word: וְהִתְחַנְּנוּ
  choice: కృప కోసం వేడుకుంటే
  rationale: హిత్పయేల్ రూపంలోని חנן అనుగ్రహం లేదా దయ కోరుతూ వినయంగా వేడుకోవడాన్ని వ్యక్తం చేస్తుంది.
- source_word: לְפָנֶיךָ
  choice: నీ సన్నిధిలో
  rationale: ప్రార్థనలో దేవుని ఎదుట ఉండడాన్ని సూచించే హీబ్రూ నుడికారానికి సహజమైన తెలుగు రూపం.
- source_word: בַּבַּיִת הַזֶּה
  choice: ఈ మందిరంలో
  rationale: בית అక్షరార్థంగా ‘ఇల్లు’ అయినా, సొలొమోను ప్రతిష్ఠిస్తున్న దేవాలయాన్ని ఇక్కడ సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు ‘మందిరం’ సందర్భాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: וְשָׁבוּ లోని పశ్చాత్తాప భావం
  choice: తిరిగి
  alternative: పశ్చాత్తాపపడి / దేవునివైపు తిరిగి
  rationale: సందర్భంలో నిబంధన సంబంధ పునరాగమనం, పశ్చాత్తాపం అంతర్లీనంగా ఉన్నప్పటికీ, హీబ్రూ క్రియ విస్తృతమైనది. సాంకేతిక ఆధ్యాత్మిక పదంతో భావాన్ని ముందుగానే పరిమితం చేయకుండా ‘తిరిగి’ అని ఉంచబడింది.
- issue: וְהוֹדוּ אֶת שְׁמֶךָ యొక్క అర్థ పరిధి
  choice: నీ నామాన్ని స్తుతించి
  alternative: నీ నామాన్ని ఒప్పుకొని / నీ నామానికి కృతజ్ఞత చెల్లించి
  rationale: ידה హిఫిల్ రూపం స్తుతి, ఒప్పుకోలు, కృతజ్ఞత అనే పరస్పర సంబంధిత భావాలను మోయగలదు. ప్రధాన పాఠ్యంలో ప్రార్థనా సందర్భానికి సహజమైన ‘స్తుతించి’ ఉంచి, నిజమైన పదార్థ సందిగ్ధతను పాదటిప్పణిలో తెలియజేశారు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలి వాడబడింది. ‘నీకు విరోధంగా,’ ‘నీ నామం,’ ‘నీ సన్నిధి’ వంటి బైబిలు భావవ్యక్తీకరణలను సాధారణ పాఠకులకు అర్థమయ్యే రూపంలో నిలిపారు. వాక్యం తదుపరి వచనంలో కొనసాగే షరతు వాక్యం కావడంతో చివర కామా ఉంచబడింది.
