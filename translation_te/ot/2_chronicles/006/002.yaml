source:
  edition: WLC
  text: וַֽ/אֲנִ֛י בָּנִ֥יתִי בֵית זְבֻ֖ל לָ֑/ךְ וּ/מָכ֥וֹן לְ/שִׁבְתְּ/ךָ֖ עוֹלָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/002.yaml
  text: But I have built for you a lofty house, a place for you to dwell forever.
translation:
  language: te
  text: అయితే నేను నీ కోసం ఒక ఉన్నతమైన మందిరాన్ని[a], నీవు శాశ్వతంగా నివసించడానికి ఒక స్థలాన్ని కట్టాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: ‘ఘనమైన నివాస మందిరాన్ని’; ఇక్కడి హెబ్రీ పదం అరుదైనది. దాని భావం ‘ఉన్నతమైనది,’ ‘మహిమాన్వితమైనది,’ లేదా ‘ఘనమైన నివాసం’ కావచ్చు.'
    reason: זְבֻל అనే అరుదైన పదానికి ఉన్న అర్థసందిగ్ధతను తెలియజేయడానికి.
lexical_decisions:
- source_word: בֵית זְבֻל
  choice: ఉన్నతమైన మందిరం
  rationale: זְבֻל అరుదైన పదం; సందర్భంలో అది ఎత్తైన, ఘనమైన లేదా మహిమాన్వితమైన నివాసాన్ని సూచిస్తుంది. ఆలయ సందర్భానికి సహజంగా ఉండేలా בֵית‌ను ‘మందిరం’గా అనువదించాం; పదంలోని భావసందిగ్ధతను పాదసూచికలో ఉంచాం.
- source_word: מָכוֹן
  choice: స్థిరమైన స్థలం
  rationale: ఈ పదం స్థాపించబడిన, సిద్ధపరచబడిన లేదా స్థిరమైన నివాసస్థలాన్ని సూచిస్తుంది; కేవలం ‘స్థలం’ కంటే మూలంలోని స్థిరత్వ భావాన్ని ఇది నిలుపుతుంది.
- source_word: עוֹלָמִים
  choice: శాశ్వతంగా
  rationale: బహువచన రూపంలోని దీర్ఘకాలిక, నిరంతర కాలభావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుడు మందిరంలో ‘శాశ్వతంగా’ నివసించడం
  choice: నీవు శాశ్వతంగా నివసించడానికి
  alternative: నీ శాశ్వత నివాసం కోసం
  rationale: మూలపాఠంలోని ప్రత్యక్ష ద్వితీయ పురుష సంబోధనను, అలాగే ఆలయ నివాసం గురించిన వాక్యంలోని theological tensionను వివరణతో పరిమితం చేయకుండా యథాతథంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలిని వాడాం. రెండు సమాంతర పదబంధాల అనుబంధాన్ని స్పష్టంచేయడానికి డాష్‌లు వాడాం; మూలంలోని ‘కట్టాను’ అనే ప్రత్యక్ష క్రియను నిలిపాం.
