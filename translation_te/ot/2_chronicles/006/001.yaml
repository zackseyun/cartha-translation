source:
  edition: WLC
  text: אָ֖ז אָמַ֣ר שְׁלֹמֹ֑ה יְהוָ֣ה אָמַ֔ר לִ/שְׁכּ֖וֹן בָּ/עֲרָפֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/001.yaml
  text: Then Solomon said[a], “Yahweh has said that he would dwell in the thick darkness.”
translation:
  language: te
  text: 'అప్పుడు సొలొమోను ఇలా అన్నాడు: “యాహ్వే కటిక చీకటిలో నివసిస్తాడని చెప్పాడు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చీకటి మేఘంలో.” హీబ్రూ పదం దట్టమైన మేఘం, మసక లేదా కటిక చీకటిని సూచించవచ్చు; ముఖ్యంగా దేవుడు ప్రత్యక్షమయ్యే సందర్భాల్లో ఈ భావాలు కనిపిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: సొలొమోను మాటలను కథన క్రమంలో పరిచయం చేసే సహజమైన కాలసూచక పదం.
- source_word: אָמַר ... שְׁלֹמֹה
  choice: సొలొమోను ఇలా అన్నాడు
  rationale: హీబ్రూ వాక్యప్రవేశాన్ని ఆధునిక తెలుగులో సహజంగా, అదనపు వ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: אָמַר
  choice: చెప్పాడు
  rationale: హీబ్రూ పరిపూర్ణ క్రియను ఈ సందర్భంలో గతంలో పలికిన, ఇప్పటికీ ప్రాముఖ్యమున్న ప్రకటనగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִשְׁכּוֹן
  choice: నివసిస్తానని
  rationale: లామెద్‌తో కూడిన క్రియార్థక రూపాన్ని పరోక్ష వాక్యంలో దేవుని స్వీయ ప్రకటనగా సహజమైన తెలుగులో అందిస్తుంది.
- source_word: בָּעֲרָפֶל
  choice: కటిక చీకటిలో
  rationale: దట్టమైన మేఘం, గాఢాంధకారం, మసక అనే భావపరిధిలోని అగోచరతను, దైవ ప్రత్యక్షత సందర్భంలోని గంభీరతను కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామం నేరుగా ఉంది; దాన్ని బిరుదుగా మార్చకుండా తెలుగులో పరిచితమైన రూపంతో ఉంచాం.
- issue: עֲרָפֶלలో దైవ సన్నిధి స్వభావం
  choice: కటిక చీకటిలో
  alternative: చీకటి మేఘంలో
  rationale: దైవ సమీపతతోపాటు ఆయన అగోచరతను సూచించే మూలపాఠంలోని ఉద్రిక్తతను వ్యాఖ్యానించి తొలగించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని సంక్షిప్తతను కాపాడుతూ, పరోక్ష వాక్యాన్ని తెలుగులో స్పష్టంగా రూపొందించాం; ప్రత్యామ్నాయ మేఘార్థాన్ని పాదటిప్పణిలో నిలిపాం.
