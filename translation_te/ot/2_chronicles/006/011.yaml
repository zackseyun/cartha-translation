id: 2CH.6.11
reference: 2 Chronicles 6:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אָשִׂ֥ים שָׁם֙ אֶת הָ֣/אָר֔וֹן אֲשֶׁר שָׁ֖ם בְּרִ֣ית יְהוָ֑ה אֲשֶׁ֥ר כָּרַ֖ת עִם בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/011.yaml
  text: And there I have placed the ark[a], in which is the covenant of Yahweh, which he made with the sons of Israel.
translation:
  language: te
  text: అక్కడ నేను మందసాన్ని ఉంచాను; అందులో యాహ్వే ఇశ్రాయేలు కుమారులతో[a] చేసిన నిబంధన ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, భావానుసారం “ఇశ్రాయేలు ప్రజలతో.” హెబ్రీలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులతో” అని ఉంది; ఇది ఇశ్రాయేలు ప్రజలకు వాడే ప్రామాణిక నిబంధనాత్మక పేరు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׂים
  choice: నేను ఉంచాను
  rationale: שׂוּם అనే క్రియకు ‘ఉంచు, పెట్టు’ అనే అర్థం. ఇక్కడ పూర్తయిన కార్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שָׁם
  choice: అక్కడ
  rationale: ముందు ప్రస్తావించిన ఆలయ స్థలాన్ని సూచించే స్థానవాచక క్రియావిశేషణానికి నేరమైన అనువాదం.
- source_word: הָאָרוֹן
  choice: మందసం
  rationale: నిబంధన మందసాన్ని సూచించే ఆరాధనా సందర్భంలో אָרוֹןకు తెలుగులో స్థిరమైన, గౌరవప్రదమైన పదం.
- source_word: אֲשֶׁר שָׁם
  choice: అందులో … ఉంది
  rationale: నిబంధన మందసంలో ఉందని తెలిపే హెబ్రీ సంబంధవాక్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘నిబంధన’ అనేది లోపల ఉన్న పలకలను సూచిస్తుందా లేక నిబంధననే సూచిస్తుందా అనే భావాన్ని అదనంగా విశదీకరించదు.
- source_word: בְּרִית יְהוָה
  choice: యాహ్వే … చేసిన నిబంధన
  rationale: בְּרִיתను ‘నిబంధన’గా అనువదించి, తదుపరి సంబంధవాక్యంతో కలిపి తెలుగులో సహజమైన వాక్యనిర్మాణాన్ని ఇచ్చింది.
- source_word: אֲשֶׁר כָּרַת
  choice: చేసిన
  rationale: ‘నిబంధనను కోయడం’ అనే హెబ్రీ నుడికారాన్ని దాని అర్థానుసారం ఆధునిక తెలుగులో ‘నిబంధన చేయడం’గా అందిస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హెబ్రీ పదబంధంలోని పుంలింగ రూపాన్ని దగ్గరగా నిలుపుతుంది; ఇది ఇశ్రాయేలు ప్రజలకు సమూహనామమని పాదసూచిక స్పష్టం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוהను అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: బిరుదుతో భర్తీ చేయకుండా హెబ్రీ దైవనామాన్ని తెలుగు లిపిలో ధ్వన్యనుకరణగా నిలుపుతుంది.
- issue: בְּנֵי יִשְׂרָאֵלలోని లింగసూచక సమూహనామం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలు ప్రజలు; ఇశ్రాయేలీయులు
  rationale: మూలంలోని ‘కుమారులు’ అనే రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది మొత్తం నిబంధన సమాజాన్ని సూచించే ప్రామాణిక సమూహనామమనే విషయాన్ని పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హెబ్రీ వాక్యంలోని సంబంధాలను స్పష్టంగా ఉంచేందుకు అర్ధవిరామంతో రెండు సమీప ఉపవాక్యాలుగా అమర్చబడింది; మూలంలో లేని వివరణను చేర్చలేదు.
