id: 2CH.6.18
reference: 2 Chronicles 6:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֚י הַֽ/אֻמְנָ֔ם יֵשֵׁ֧ב אֱלֹהִ֛ים אֶת הָ/אָדָ֖ם עַל הָ/אָ֑רֶץ הִ֠נֵּה שָׁמַ֜יִם וּ/שְׁמֵ֤י הַ/שָּׁמַ֨יִם֙ לֹ֣א יְכַלְכְּל֔וּ/ךָ אַ֕ף כִּֽי הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/018.yaml
  text: But will God indeed dwell with man on the earth? Behold[a], heaven and the highest heaven cannot contain you, much less this house that I have built.
translation:
  language: te
  text: అయితే దేవుడు నిజంగా భూమిమీద మనుషులతో[a] నివసిస్తాడా? ఇదిగో, ఆకాశమూ అత్యున్నత ఆకాశమూ నిన్ను ఇముడ్చుకోలేవు; ఇక నేను కట్టిన ఈ మందిరం నిన్ను ఎంతమాత్రం ఇముడ్చుకోగలదు!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనిషితో”; ఇక్కడ హెబ్రీ పదం మానవజాతిని సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֻמְנָם
  choice: నిజంగా
  rationale: ఆశ్చర్యాన్ని, విస్మయాన్ని వ్యక్తం చేసే అలంకారప్రశ్నను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יֵשֵׁב
  choice: నివసిస్తాడా
  rationale: మూల క్రియకు ‘కూర్చోవడం/నివసించడం’ అనే పరిధి ఉంది; ఇక్కడ దేవుని సన్నిధి, నివాసం సందర్భానికి ‘నివసించడం’ సహజం.
- source_word: אֶת הָאָדָם
  choice: మనుషులతో
  rationale: אָדָם ఇక్కడ మానవజాతిని సమష్టిగా సూచిస్తుంది; ‘తో’ అనే సంబంధార్థాన్ని, తెలుగులో సహజమైన బహువచన సమష్టి భావాన్ని అందిస్తుంది.
- source_word: עַל הָאָרֶץ
  choice: భూమిమీద
  rationale: స్థలార్థాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే మూలపద బలాన్ని ప్రార్థనకు తగిన గంభీర శైలిలో నిలుపుతుంది.
- source_word: שָׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: ఆకాశమూ అత్యున్నత ఆకాశమూ
  rationale: ‘ఆకాశాల ఆకాశం’ అనే హెబ్రీయ అతిశయోక్తి నిర్మాణాన్ని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: לֹא יְכַלְכְּלוּךָ
  choice: నిన్ను ఇముడ్చుకోలేవు
  rationale: దేవుణ్ణి ఏ సృష్టిస్థలమూ తన పరిమితుల్లో ఉంచలేదనే ‘contain’ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אַף כִּי
  choice: ఇక ... ఎంతమాత్రం ఇముడ్చుకోగలదు!
  rationale: ఆకాశమే దేవుణ్ణి ఇముడ్చుకోలేకపోతే మందిరం మరింతగా ఇముడ్చుకోలేదనే a fortiori వాదనను తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: הַבַּיִת הַזֶּה
  choice: ఈ మందిరం
  rationale: మూలంలోని ‘ఇల్లు’ ఇక్కడ యెరూషలేము దేవాలయాన్ని సూచిస్తుంది; తెలుగులో ‘మందిరం’ సందర్భాన్ని సందిగ్ధత లేకుండా తెలియజేస్తుంది.
- source_word: אֲשֶׁר בָּנִיתִי
  choice: నేను కట్టిన
  rationale: పూర్తయిన నిర్మాణక్రియను సహజమైన తెలుగు సంబంధ క్రియారూపంలో అందిస్తుంది.
theological_decisions:
- issue: אָדָם యొక్క సమష్టి మానవార్థం
  choice: మనుషులతో
  alternative: మనిషితో
  rationale: ఇక్కడ ఒక్క పురుషవ్యక్తి కాక మానవజాతి ఉద్దేశించబడింది. తెలుగు బహువచనం ఆ సమగ్ర భావాన్ని సహజంగా తెలియజేస్తుంది; ఏ లింగానికీ పరిమితం చేయదు.
- issue: దేవుడు మందిరంలో నివసించడం మరియు ఆయన అపరిమితత్వం మధ్య ఉద్రిక్తత
  choice: ప్రశ్నను అలంకారప్రశ్నగానే, అనంతరం ‘ఇముడ్చుకోలేవు’ అనే విరుద్ధతతో నిలిపాం
  alternative: దేవుడు కేవలం తన సన్నిధిని మాత్రమే అక్కడ ఉంచుతాడని వివరణను వాక్యంలో చేర్చడం
  rationale: మూలపాఠం దేవుని సన్నిధిని నిరాకరించకుండా, సృష్టి లేదా మందిరం ఆయనను పరిమితం చేయలేవని చెబుతుంది. అదనపు సిద్ధాంత వివరణను చేర్చకుండా ఈ ఉద్రిక్తతను నిలుపుతుంది.
- issue: הַבַּיִת యొక్క అనువాదం
  choice: మందిరం
  alternative: ఇల్లు
  rationale: ‘ఇల్లు’ మూలరూపానికి మరింత పదశః సమానం; అయితే ఈ సందర్భంలో నిర్మించబడిన దేవాలయాన్ని సూచించడం వల్ల ‘మందిరం’ ఆధునిక తెలుగులో స్పష్టమైనది, సిద్ధాంతపరమైన అదనాన్ని కలపదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రార్థనా శైలి. ‘ఇదిగో’ మూలంలోని శ్రద్ధాకర్షక పదాన్ని నిలుపుతుంది. అలంకారప్రశ్న, దేవుని అపరిమితత్వం, మందిరం యొక్క పరిమితి స్పష్టంగా ఉండేలా పదబంధాలు ఎంచుకున్నాం.
