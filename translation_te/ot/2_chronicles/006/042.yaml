id: 2CH.6.42
reference: 2 Chronicles 6:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהִ֔ים אַל תָּשֵׁ֖ב פְּנֵ֣י מְשִׁיחֶ֑י/ךָ זָכְרָ֕/ה לְ/חַֽסְדֵ֖י דָּוִ֥יד עַבְדֶּֽ/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/042.yaml
  text: O Yahweh God[a], do not turn away the face of your anointed one[c][b]; remember the steadfast love shown to David your servant.
translation:
  language: te
  text: యెహోవా దేవా, నీ అభిషిక్తుని ముఖాన్ని త్రిప్పివేయకు[a][b]; నీ సేవకుడైన దావీదుపట్ల చూపిన నీ స్థిరమైన ప్రేమను జ్ఞాపకం చేసుకో[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ అభిషిక్తుని తిరస్కరించకు.’ హెబ్రీలో అక్షరార్థంగా, ‘నీ అభిషిక్తుని ముఖాన్ని త్రిప్పివేయకు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నీ అభిషిక్తుని’ అనే మాటను ‘నీ మెస్సీయాను’ అని లేదా సందర్భానుసారంగా ‘నీ రాజును’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
  - marker: c
    text: లేదా, ‘నీ సేవకుడైన దావీదుకు చూపిన కనికరాలను జ్ఞాపకం చేసుకో’; లేదా, ‘నీ సేవకుడైన దావీదుపట్ల నీ నిబంధన విశ్వసనీయతను జ్ఞాపకం చేసుకో.’ హెబ్రీ పదబంధం సంక్షిప్తంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: యెహోవా దేవా
  rationale: దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించి, సంబోధనలోని సాధారణ దైవబిరుదైన אֱלֹהִיםను ‘దేవా’గా అనువదించాం.
- source_word: אַל תָּשֵׁב פְּנֵי
  choice: ముఖాన్ని తిప్పివేయకు
  rationale: ‘తిరస్కరించకు’ అనే భావం సందర్భానికి సరిపోతున్నా, మూలంలోని ‘ముఖం’ అనే స్పష్టమైన కవితాత్మక రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: מְשִׁיחֶךָ
  choice: నీవు అభిషేకించినవాని
  rationale: ఇది ఈ రాజప్రార్థన సందర్భంలో దేవుడు అభిషేకించిన రాజును సూచిస్తుంది. ‘మెస్సీయా’ అని నేరుగా పెట్టకుండా, పదార్థాన్నీ భవిష్యదర్థ ప్రతిధ్వనినీ నిలిపే రూపాన్ని ఎంచుకున్నాం.
- source_word: זָכְרָה
  choice: జ్ఞాపకం చేసుకో
  rationale: ప్రార్థనలో దేవుడు తన నిబంధన సంబంధమైన కృపకు అనుగుణంగా కార్యం చేయాలని వేడుకునే ఆజ్ఞార్థక ప్రయోగాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְחַסְדֵי דָּוִיד עַבְדֶּךָ
  choice: నీ సేవకుడైన దావీదుపట్ల చూపిన నిలకడైన ప్రేమను
  rationale: חֶסֶדలోని స్థిరమైన, నిబంధనసంబంధ ప్రేమ భావాన్ని ‘నిలకడైన ప్రేమ’గా తెలిపాం. לְను దావీదు ఆ ప్రేమకు గ్రహీతగా సూచించేదిగా ప్రధాన పాఠ్యంలో అర్థం చేసుకున్నాం; మూలంలోని సంక్షిప్తత వల్ల కలిగే ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: מְשִׁיחֶךָ అనే రాజసంబంధ పదానికి మెస్సీయా సంబంధ ప్రతిధ్వని
  choice: నీవు అభిషేకించినవాని
  alternative: నీ మెస్సీయాను; నీ రాజును
  rationale: తక్షణ సందర్భంలో దావీదు వంశపు అభిషిక్త రాజే ఉద్దేశితుడు. ‘అభిషేకించినవాడు’ అనే రూపం మూలపదార్థాన్ని కాపాడుతూ, వాక్యం నేరుగా చెప్పేదానికంటే ఎక్కువ క్రీస్తుసంబంధ నిర్దిష్టతను చేర్చదు.
- issue: חַסְדֵי דָּוִידలో ప్రేమకు కర్త లేదా గ్రహీత ఎవరు అనే సంక్షిప్త నిర్మాణం
  choice: దావీదుపట్ల చూపిన నిలకడైన ప్రేమ
  alternative: దావీదుకు చూపిన కనికరాలు; దావీదుతో చేసిన నిబంధనకు చూపిన నిబద్ధత; దావీదు చేసిన విశ్వసనీయ ప్రేమకార్యాలు
  rationale: ప్రార్థన సందర్భంలో దేవుడు దావీదుపట్ల చూపిన నిబంధన ప్రేమను జ్ఞాపకం చేసుకోవాలని వేడుకోవడం సహజమైన అర్థం. అయితే హెబ్రీ పదబంధం సంక్షిప్తంగా ఉండటంతో ప్రత్యామ్నాయాలను పూర్తిగా మూసివేయకుండా పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలిని వాడాం. ‘యెహోవా దేవా,’ ‘జ్ఞాపకం చేసుకో’ వంటి రూపాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని గంభీరతను నిలుపుతాయి. కవితాత్మక ‘ముఖం’ రూపకాన్ని ప్రధాన పాఠ్యంలో ఉంచి, దాని సహజ భావమైన ‘తిరస్కరించు’ను పాదసూచికలో వివరించాం.
