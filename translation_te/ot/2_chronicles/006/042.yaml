  to: యెహోవా దేవా, నీ అభిషిక్తుని ముఖాన్ని త్రిప్పివేయకు[a][b]; నీ సేవకుడైన దావీదుపట్ల చూపిన నీ స్థిరమైన ప్రేమను జ్ఞాపకం చేసుకో[c].
  rationale: ప్రధాన పాఠ్యాన్ని మూలానికి మరింత నేరుగా ఉండేలా ‘నీ అభిషిక్తుని’గా, మరియు ఆధునిక సహజ ప్రయోగంగా ‘స్థిరమైన ప్రేమ’గా స్వల్పంగా సవరించాం. అర్థాన్ని మార్చకుండా, పాదసూచిక cలోని అస్పష్టమైన నిబంధన-ప్రత్యామ్నాయాన్ని దైవపు దావీదుపట్ల విశ్వసనీయతను స్పష్టపరిచేలా దిద్దాం; పాదసూచిక bలో కర్మవిభక్తిని కూడా సరిచేశాం.
