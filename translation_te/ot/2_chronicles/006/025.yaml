id: 2CH.6.25
reference: 2 Chronicles 6:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתָּה֙ תִּשְׁמַ֣ע מִן הַ/שָּׁמַ֔יִם וְ/סָ֣לַחְתָּ֔ לְ/חַטַּ֖את עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וַ/הֲשֵׁיבוֹתָ/ם֙ אֶל הָ֣/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תָּה לָ/הֶ֖ם וְ/לַ/אֲבֹתֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/025.yaml
  text: then you will hear from heaven[a], and forgive the sin of your people Israel[b], and bring them back to the land that you gave to them and to their fathers.
translation:
  language: te
  text: అప్పుడు నీవు ఆకాశం నుండి వింటావు, నీ ప్రజలైన ఇశ్రాయేలు పాపాన్ని క్షమిస్తావు, వారికీ వారి పితరులకూ నీవు ఇచ్చిన దేశానికి వారిని తిరిగి రప్పిస్తావు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: ఆలకించి
  rationale: ప్రార్థనా సందర్భంలో ఈ క్రియ కేవలం శబ్దం వినడమే కాక శ్రద్ధగా విని స్పందించడాన్ని సూచించగలదు. ‘ఆలకించి’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִן הַשָּׁמַיִם
  choice: ఆకాశం నుండి
  rationale: హీబ్రూలో రూపం బహువచనమైనప్పటికీ, దేవుని నివాసాన్ని సూచించే ఈ సందర్భంలో ఆధునిక తెలుగులో ‘ఆకాశం నుండి’ సహజమైన సమానార్థకం.
- source_word: סָלַחְתָּ
  choice: క్షమిస్తావు
  rationale: దైవిక క్షమాపణకు ఉపయోగించిన ప్రామాణిక హీబ్రూ క్రియకు ఇది స్పష్టమైన ఆధునిక తెలుగు రూపం.
- source_word: לְחַטַּאת
  choice: పాపాన్ని
  rationale: ఏకవచన నామవాచకం ఇక్కడ ఇశ్రాయేలు చేసిన అపరాధాన్ని సమష్టిగా సూచిస్తుంది; తెలుగు ఏకవచనం మూలరూపాన్ని నిలుపుతుంది.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: నీ ప్రజలైన ఇశ్రాయేలు
  rationale: ఒడంబడిక సంబంధమైన ‘నీ ప్రజలు’ అనే గుర్తింపునూ, ‘ఇశ్రాయేలు’ అనే పేరునూ సహజ తెలుగు క్రమంలో ఉంచుతుంది.
- source_word: וַהֲשֵׁיבוֹתָם
  choice: వారిని తిరిగి రప్పిస్తావు
  rationale: שׁוב హిఫీల్ రూపంలోని కారణార్థాన్ని, అంటే దేవుడు వారిని తిరిగి వచ్చేలా చేయడాన్ని, స్పష్టంగా నిలుపుతుంది.
- source_word: אֶל הָאֲדָמָה
  choice: దేశానికి
  rationale: ఈ ఒడంబడిక సందర్భంలో אֲדָמָה సాధారణ నేల లేదా మట్టిని కాక ఇశ్రాయేలుకు ఇచ్చిన దేశాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר נָתַתָּה לָהֶם וְלַאֲבֹתֵיהֶם
  choice: నీవు వారికీ వారి పితరులకూ ఇచ్చిన
  rationale: ‘వారికి’ మరియు ‘వారి పితరులకు’ అనే రెండు గ్రహీతలను స్పష్టంగా ఉంచి, ప్రస్తుత తరానికి పితరులతో ఉన్న ఒడంబడిక కొనసాగింపును కాపాడుతుంది.
theological_decisions:
- issue: אֲבֹתֵיהֶם పద ప్రయోగం
  choice: వారి పితరులు
  alternative: వారి పూర్వీకులు
  rationale: హీబ్రూ పదం అక్షరార్థంగా ‘వారి తండ్రులు/పితరులు’ అని ఉంది. ‘పితరులు’ మూలంలోని పితృసంబంధ పదాన్ని నిలుపుతూ, ఈ సందర్భంలో పూర్వీకుల భావాన్నీ సహజంగా వ్యక్తపరుస్తుంది.
- issue: ప్రార్థనలోని క్రియల భావం
  choice: 'భవిష్యత్/నిశ్చయార్థ రూపం: ‘క్షమిస్తావు … తిరిగి రప్పిస్తావు’'
  alternative: 'విన్నపార్థ రూపం: ‘క్షమించు … తిరిగి రప్పించు’'
  rationale: తִּשְׁמַע తరువాత వచ్చే వరుస క్రియలు ప్రార్థనలో విన్నపంగానూ ఆశాభరిత నిశ్చయంగానూ వినిపించవచ్చు. ప్రధాన పాఠంలో హీబ్రూ క్రియారూపాలకు దగ్గరగా ఉండే భవిష్యత్ రూపాన్ని ఉంచి, విన్నప సందర్భాన్ని వాక్యపరిసరమే తెలియజేయనిచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవభరిత శైలి. ‘ఆలకించి’, ‘పితరులు’ వంటి పదాలు గంభీరతను నిలుపుతూనే సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి.
