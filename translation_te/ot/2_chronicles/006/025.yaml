revisions:
- from: అప్పుడు నీవు ఆకాశం నుండి ఆలకించి, నీ ప్రజలైన ఇశ్రాయేలు పాపాన్ని క్షమిస్తావు; నీవు వారికీ వారి పితరులకూ ఇచ్చిన దేశానికి వారిని తిరిగి రప్పిస్తావు.
  to: అప్పుడు నీవు ఆకాశం నుండి వింటావు, నీ ప్రజలైన ఇశ్రాయేలు పాపాన్ని క్షమిస్తావు, వారికీ వారి పితరులకూ నీవు ఇచ్చిన దేశానికి వారిని తిరిగి రప్పిస్తావు.
  rationale: The revision changes only the first verb from a participial construction to a finite future form, aligning it with the Hebrew imperfect and the following coordinated verbs. It retains the draft's modern standard Telugu register, the collective singular «పాపం», the causative force of «తిరిగి రప్పిస్తావు», and the source-specific «పితరులు».
