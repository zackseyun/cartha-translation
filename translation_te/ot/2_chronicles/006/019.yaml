id: 2CH.6.19
reference: 2 Chronicles 6:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/פָנִ֜יתָ אֶל תְּפִלַּ֧ת עַבְדְּ/ךָ֛ וְ/אֶל תְּחִנָּת֖/וֹ יְהוָ֣ה אֱלֹהָ֑/י לִ/שְׁמֹ֤עַ אֶל הָ/רִנָּה֙ וְ/אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֥ר עַבְדְּ/ךָ֖ מִתְפַּלֵּ֥ל לְ/פָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/019.yaml
  text: Yet turn toward the prayer of your servant and his plea for favor[a], O Yahweh my God[c][b], to hear the cry and the prayer that your servant is praying before you.
translation:
  language: te
  text: అయినా, యాహ్వే నా దేవా, నీ సేవకుని ప్రార్థనవైపూ అతని కృప కొరకైన విన్నపంవైపూ తిరుగు; నీ సేవకుడు నీ సన్నిధిలో చేస్తున్న మొరనూ ప్రార్థననూ వినడానికి ఆలకించు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפָנִיתָ
  choice: అయినా ... వైపు తిరిగి
  rationale: פנה అనే క్రియలోని ‘వైపు తిరుగు’ అనే రూపకాన్ని నిలుపుతూ, ముందరి సందర్భానికి అనుసంధానమైన వేడుకోలు భావాన్ని ‘అయినా’ తెలియజేస్తుంది.
- source_word: תְּפִלַּת / הַתְּפִלָּה
  choice: ప్రార్థన / ప్రార్థనను
  rationale: תפלהకు సహజమైన తెలుగు సమానార్థకం; హెబ్రీ పునరుక్తినీ సమాంతర నిర్మాణాన్నీ నిలిపింది.
- source_word: עַבְדְּךָ
  choice: నీ సేవకుడు / నీ సేవకుని
  rationale: దేవునితో రాజు చేసే ప్రార్థన సందర్భంలో עבדకు ‘సేవకుడు’ సహజమైనది; వినయపూర్వక సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: תְּחִנָּתוֹ
  choice: అతని కృపావిన్నపం
  rationale: תחנהలో ఉన్న కృప లేదా కనికరం కోరే గాఢమైన వేడుకోలు భావాన్ని సంక్షిప్తంగా, స్పష్టంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֱלֹהָי
  choice: నా దేవా
  rationale: ప్రత్యక్ష సంబోధనను సహజమైన తెలుగు సంబోధనారూపంలో అందించింది.
- source_word: לִשְׁמֹעַ
  choice: ఆలకించు
  rationale: దేవుడు ప్రార్థనను శ్రద్ధగా వినాలనే వేడుకోలును సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הָרִנָּה
  choice: మొర
  rationale: ప్రార్థనా సందర్భంలో సహాయం కోసం ఎత్తే గాఢమైన కేక లేదా మొర అనే భావాన్ని తెలియజేస్తుంది; ఆనందకేక అనే ఇతర సందర్భార్థాన్ని ఇక్కడ రుద్దదు.
- source_word: מִתְפַּלֵּל
  choice: చేస్తున్న
  rationale: హెబ్రీ కృదంతంలోని కొనసాగుతున్న ప్రస్తుత చర్యను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְפָנֶיךָ
  choice: నీ సన్నిధిలో
  rationale: ‘నీ ఎదుట/నీ సమక్షంలో’ అనే హెబ్రీ నుడికారాన్ని గౌరవప్రదమైన ప్రార్థనా భాషలో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవ నామాన్ని నేరుగా వాడుతుంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా నిలుపుతుంది.
- issue: הָרִנָּה భావం
  choice: మొర
  alternative: గట్టిగా చేసే మొర; ఆనందకేక
  rationale: ఈ ప్రార్థనా సందర్భంలో సహాయం కోరే మొర భావం సమాంతరంగా ఉన్న ‘ప్రార్థన’కు సరిపోతుంది; పదానికి ఇతర సందర్భాల్లో ఉండే ఆనందకేక భావాన్ని ఇక్కడ నిర్ణయాత్మకంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ప్రార్థనకు తగిన గౌరవప్రదమైన శైలి వాడబడింది. ‘వైపు తిరిగి’ మూలంలోని దృశ్యరూపాన్ని నిలుపుతుంది; ‘ఆలకించు’ శ్రద్ధగా వినాలనే భావాన్ని ఇస్తుంది. మూలంలోని ‘మొర—ప్రార్థన’ సమాంతరతను అలాగే ఉంచాం.
