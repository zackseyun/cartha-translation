review_pass:
  verdict: revise
  source_fidelity: The draft preserves the petitionary sequence and the distributive sense of giving to each person according to his ways. However, the relative clause is wrongly made the standard for giving ('according to [what] his heart is known'), rather than identifying the person whose heart God knows. The final clause also needs a more idiomatic expression of God's exclusive knowledge of human hearts.
  naturalness: The current first sentence is understandable but syntactically misleading. 'మానవులందరి హృదయాలు తెలిసినవాడవు' is awkward in modern standard Telugu; the revision gives a direct, natural formulation.
  terminology: '''హృదయం'' and ''మార్గాలు'' appropriately retain the Hebrew inner-person and conduct metaphors. ''ఆకాశంలోని నీ నివాసస్థలం'' avoids treating heaven merely as a physical sky while remaining close to the source. The footnote correctly explains the inclusive reference of בְּנֵי הָאָדָם.'
  issues:
  - severity: high
    issue: The relative clause is attached incorrectly in 'ప్రతి మనిషి హృదయం నీకు తెలిసిన ప్రకారం'.
    rationale: 'אֲשֶׁר תֵּדַע אֶת־לְבָבוֹ modifies ''each man'': God is asked to give to each person according to all his ways, the person whose heart God knows. It does not mean that the giving is according to the degree or manner in which the heart is known.'
  - severity: medium
    issue: The final clause is grammatically and idiomatically awkward.
    rationale: The Hebrew says that God alone knows the hearts of human beings. 'మానవుల హృదయాలను నీవొక్కడివే తెలుసు' expresses both the object and the exclusive emphasis naturally.
  revised_text: అప్పుడు నీవు ఆకాశంలోని నీ నివాసస్థలం నుండి విని, క్షమించి, హృదయం నీకు తెలిసిన ప్రతి మనిషికి అతని మార్గాలన్నిటిని బట్టి ఇవ్వు. ఎందుకంటే మానవులందరి[a] హృదయాలను నీవొక్కడివే తెలుసు.
