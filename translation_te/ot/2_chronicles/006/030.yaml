id: 2CH.6.30
reference: 2 Chronicles 6:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֠/אַתָּה תִּשְׁמַ֨ע מִן הַ/שָּׁמַ֜יִם מְכ֤וֹן שִׁבְתֶּ֨/ךָ֙ וְ/סָ֣לַחְתָּ֔ וְ/נָתַתָּ֤ה לָ/אִישׁ֙ כְּ/כָל דְּרָכָ֔י/ו אֲשֶׁ֥ר תֵּדַ֖ע אֶת לְבָב֑/וֹ כִּ֤י אַתָּה֙ לְ/בַדְּ/ךָ֣ יָדַ֔עְתָּ אֶת לְבַ֖ב בְּנֵ֥י הָ/אָדָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/030.yaml
  text: then may you hear from heaven[a], the place of your dwelling, and forgive, and give to each man according to all his ways, whose heart you know—for you alone know the heart of the sons of man—
translation:
  language: te
  text: అప్పుడు నీవు ఆకాశంలోని నీ నివాసస్థలం నుండి విని, క్షమించి, హృదయం నీకు తెలిసిన ప్రతి మనిషికి అతని మార్గాలన్నిటిని బట్టి ఇవ్వు. ఎందుకంటే మానవులందరి[a] హృదయాలను నీవొక్కడివే తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ నుడికారం అక్షరార్థంగా “మనిషి కుమారులు”; ఇది స్త్రీపురుషులందరినీ, అంటే మానవజాతిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: విని
  rationale: ప్రార్థనా సందర్భంలో ఈ అసంపూర్ణ క్రియ అభ్యర్థన భావాన్ని కలిగిస్తుంది; తెలుగులో తరువాతి క్రియలతో కలిసిన ‘విని’ ఆ ప్రార్థనను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מִן הַשָּׁמַיִם
  choice: ఆకాశం నుండి
  rationale: హీబ్రూలో రూపం బహువచనమైనా, దేవుని పరలోక నివాసాన్ని సూచించే ఈ సందర్భంలో ఏకవచన ‘ఆకాశం’ సహజమైన తెలుగు.
- source_word: מְכוֹן שִׁבְתֶּךָ
  choice: నీ నివాసస్థలమైన
  rationale: స్థిరమైన నివాసస్థలం అనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְסָלַחְתָּ
  choice: క్షమించి
  rationale: ఇది ప్రార్థనలో కోరుతున్న వరుస చర్యను కొనసాగిస్తుంది; ‘విని, క్షమించి’ అనే నిర్మాణం తెలుగులో సహజం.
- source_word: וְנָתַתָּה
  choice: ఇవ్వు
  rationale: న్యాయనిర్ణయ సందర్భం ఉన్నప్పటికీ, మూలపదమైన נתן యొక్క విస్తృతమైన ‘ఇవ్వు’ భావాన్ని నిలుపుతుంది; తరువాతి పదబంధమే దాని ప్రమాణాన్ని వివరిస్తుంది.
- source_word: לָאִישׁ
  choice: ప్రతి మనిషి … అతనికి
  rationale: ఏకవచన పురుషరూపానికి, పంపిణీ భావానికి సరిపోతూ ప్రతి వ్యక్తిని విడివిడిగా సూచిస్తుంది.
- source_word: כְּכָל דְּרָכָיו
  choice: అతని మార్గాలన్నిటిని బట్టి
  rationale: ‘మార్గాలు’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ జీవన ప్రవర్తన అనే భావాన్ని తెలుగులో అర్థమయ్యేలా చేస్తుంది.
- source_word: אֲשֶׁר תֵּדַע אֶת לְבָבוֹ
  choice: ప్రతి మనిషి హృదయం నీకు తెలిసిన ప్రకారం
  rationale: దేవుడు ప్రతి వ్యక్తి అంతరంగాన్ని ఎరుగుతాడనే భావాన్ని నిలుపుతుంది; తెలుగు వాక్యక్రమం కోసం సంబంధ వాక్యం సహజంగా అమర్చబడింది.
- source_word: לְבָב
  choice: హృదయం / హృదయాలు
  rationale: ఈ పదం ఆలోచన, సంకల్పం సహా అంతరంగ వ్యక్తిని సూచిస్తుంది; ‘హృదయం’ ప్రామాణికమైన, వేదగ్రంథసంబంధ ప్రతిధ్వని గల సమానార్థకం.
- source_word: כִּי אַתָּה לְבַדְּךָ יָדַעְתָּ
  choice: ఎందుకంటే … తెలిసినవాడవు నీవొక్కడివే
  rationale: కారణ సంబంధాన్ని, దేవునికే ప్రత్యేకమైన హృదయజ్ఞానాన్ని రెండింటినీ స్పష్టంగా నిలుపుతుంది.
- source_word: בְּנֵי הָאָדָם
  choice: మానవులందరి[a]
  rationale: హీబ్రూ నుడికారం అక్షరార్థంగా ‘మనిషి కుమారులు’; సందర్భార్థం మొత్తం మానవజాతి. ప్రధాన పాఠంలో సహజమైన సమగ్ర పదాన్ని వాడి, మూలరూపాన్ని పాదసూచికలో తెలిపింది.
theological_decisions:
- issue: בְּנֵי הָאָדָם లోని మానవశాస్త్ర సంబంధ నుడికారం
  choice: మానవులందరి[a]
  alternative: మనిషి కుమారుల
  rationale: ఈ హీబ్రూ ప్రతినిధి పురుష నుడికారం స్త్రీపురుషులందరినీ, అంటే మానవజాతిని సూచిస్తుంది. అక్షరానువాదం తెలుగులో అసహజంగా ఉండి వేరే ప్రత్యేకార్థాన్ని సూచించే అవకాశం ఉన్నందున, ప్రధాన పాఠంలో ఉద్దేశిత సమగ్ర అర్థాన్ని ఇచ్చి మూలరూపాన్ని పాదసూచికలో భద్రపరచింది.
- issue: మనిషి మార్గాలను బట్టి దేవుడు ఇవ్వడం
  choice: అతని మార్గాలన్నిటిని బట్టి అతనికి ఇవ్వు
  alternative: అతని క్రియలకు తగిన ప్రతిఫలం ఇవ్వు
  rationale: న్యాయపరమైన ప్రతిఫల భావం సందర్భంలో ఉన్నప్పటికీ, נתן అనే సాధారణ క్రియను ‘ప్రతిఫలమివ్వు’ అని మరింత నిర్దిష్టం చేయకుండా మూలంలోని విస్తృతతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ప్రార్థనకు తగిన గౌరవభరిత శైలి వాడబడింది. ‘ఎరుగుదువు’ వంటి ప్రాచీన రూపాల బదులు ‘నీకు తెలిసిన’, ‘తెలిసినవాడవు’ అనే ప్రస్తుత వాడుక రూపాలు ఎంచుకోబడ్డాయి. ‘మార్గాలు’ అనే మూల రూపకం నిలుపబడింది.
