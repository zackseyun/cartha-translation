revisions:
- from: అప్పుడు నీవు నీ నివాసస్థలమైన ఆకాశం నుండి విని, క్షమించి, ప్రతి మనిషి హృదయం నీకు తెలిసిన ప్రకారం అతని మార్గాలన్నిటిని బట్టి అతనికి ఇవ్వు. ఎందుకంటే మానవులందరి[a] హృదయాలు తెలిసినవాడవు నీవొక్కడివే.
  to: అప్పుడు నీవు ఆకాశంలోని నీ నివాసస్థలం నుండి విని, క్షమించి, హృదయం నీకు తెలిసిన ప్రతి మనిషికి అతని మార్గాలన్నిటిని బట్టి ఇవ్వు. ఎందుకంటే మానవులందరి[a] హృదయాలను నీవొక్కడివే తెలుసు.
  rationale: The revision restores the Hebrew syntactic relationship of 'whose heart you know' to 'each man,' while retaining the requested sequence—hear, forgive, and give—and the Hebrew metaphor 'ways.' It also makes the concluding assertion of God's sole knowledge of human hearts idiomatic in modern Telugu. The existing footnote anchor and explanation are retained.
