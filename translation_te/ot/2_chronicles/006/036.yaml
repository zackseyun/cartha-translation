review_pass:
  verdict: revise
  source_fidelity: 'The core sense is accurate: sin against God, the universal observation that no human being is sinless, divine anger, delivery to an enemy, captivity, and removal to a land far or near. However, the draft renders the successive Hebrew verbal clauses as separate conditional clauses (‘అప్పగిస్తే,’ ‘తీసుకుపోతే’). In context these clauses continue the circumstance introduced by the opening ‘when’; they are better represented as coordinated actions within that circumstance.'
  naturalness: The draft is generally clear and appropriately reverent. Revising the chained conditionals to participial coordination makes the long protasis more natural Telugu. ‘దూరమైనా సమీపమైనా దేశానికి’ is also more idiomatic and avoids unnecessarily repeating ‘దేశం.’
  terminology: ‘నీకు విరోధంగా పాపం,’ ‘మనిషి,’ ‘కోపపడి,’ ‘శత్రువుకు అప్పగించి,’ and ‘చెరపట్టినవారు’ are suitable modern-standard Telugu renderings. ‘మనిషి’ naturally retains the generic force of אָדָם here without imposing a theological interpretation.
  issues:
  - severity: medium
    issue: Successive Hebrew clauses are translated as independent conditional clauses.
    rationale: 'After the opening conditional-temporal ‘వారు ... చేసినప్పుడు,’ the Hebrew continues with coordinated verbal clauses: God becomes angry, gives them over, and captors deport them. ‘అప్పగిస్తే’ and ‘తీసుకుపోతే’ can make these sound like additional, separately conditional alternatives rather than the unfolding sequence.'
  - severity: low
    issue: The far/near phrase repeats ‘దేశం’ in a less natural way.
    rationale: The Hebrew has one ‘land’ modified by ‘far or near.’ Telugu can preserve this contrast naturally as ‘దూరమైనా సమీపమైనా దేశానికి.’
  revised_text: వారు నీకు విరోధంగా పాపం చేసినప్పుడు—పాపం చేయని మనిషి ఎవరూ లేరు గనుక—నీవు వారిమీద కోపపడి, వారిని ఒక శత్రువుకు అప్పగించి, వారిని చెరపట్టినవారు వారిని దూరమైనా సమీపమైనా దేశానికి తీసుకుపోయినప్పుడు,
