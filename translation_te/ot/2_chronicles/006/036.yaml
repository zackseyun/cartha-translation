id: 2CH.6.36
reference: 2 Chronicles 6:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י יֶחֶטְאוּ לָ֗/ךְ כִּ֣י אֵ֤ין אָדָם֙ אֲשֶׁ֣ר לֹא יֶחֱטָ֔א וְ/אָנַפְתָּ֣ בָ֔/ם וּ/נְתַתָּ֖/ם לִ/פְנֵ֣י אוֹיֵ֑ב וְ/שָׁב֧וּ/ם שׁוֹבֵי/הֶ֛ם אֶל אֶ֥רֶץ רְחוֹקָ֖ה א֥וֹ קְרוֹבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/036.yaml
  text: When they sin against you—for there is no one who does not sin—and you are angry with them and give them over to an enemy[a], and their captors carry them away to a land far or near,
translation:
  language: te
  text: వారు నీకు విరోధంగా పాపం చేసినప్పుడు—పాపం చేయని మనిషి ఎవరూ లేరు గనుక—నీవు వారిమీద కోపపడి, వారిని ఒక శత్రువుకు అప్పగించి, వారిని చెరపట్టినవారు వారిని దూరమైనా సమీపమైనా దేశానికి తీసుకుపోయినప్పుడు,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: వారు నీకు విరోధంగా పాపం చేసినప్పుడు
  rationale: ప్రార్థనలో ఊహించిన పరిస్థితిని כִּי పరిచయం చేస్తోంది; తరువాతి వాక్యం మానవ పాపాన్ని వాస్తవంగా పరిగణిస్తున్నందున ‘చేసినప్పుడు’ సహజం. לָךְ సంబంధపరమైన అపరాధాన్ని సూచిస్తూ ‘నీకు విరోధంగా’ అని అనువదించబడింది.
- source_word: כִּי אֵין אָדָם אֲשֶׁר לֹא יֶחֱטָא
  choice: పాపం చేయని మనిషి ఎవరూ లేరు గనుక
  rationale: אָדָם ఇక్కడ మానవజాతిని సాధారణంగా సూచించే ఏకవచనం. ‘మనిషి ఎవరూ’ ఆధునిక తెలుగులో సహజంగా ఉండి, మూలంలోని సాధారణ మానవ సూచనను నిలుపుతుంది.
- source_word: וְאָנַפְתָּ בָם
  choice: నీవు వారిమీద కోపపడి
  rationale: אנף కోపాన్ని సూచిస్తుంది. ‘కోపపడి’ షరతు వాక్యంలోని క్రియాక్రమంతో సహజంగా కలుస్తుంది; తీవ్రతను అనవసరంగా పెంచదు.
- source_word: וּנְתַתָּם לִפְנֵי אוֹיֵב
  choice: వారిని ఒక శత్రువుకు అప్పగిస్తే
  rationale: נתן + לפני אויב అంటే శత్రువు అధికారానికి అప్పగించడం. אוֹיֵב ఏకవచన అనిర్దిష్ట రూపాన్ని ‘ఒక శత్రువు’గా ప్రతిబింబించాం.
- source_word: וְשָׁבוּם שׁוֹבֵיהֶם
  choice: వారిని చెరపట్టినవారు వారిని ... తీసుకుపోతే
  rationale: మూలంలోని שׁבה క్రియతో దాని సంబంధిత కర్తపదం కలిగిన నిర్మాణాన్ని, తెలుగు పునరుక్తి అసహజంగా కాకుండా, చెరలోకి తీసుకుపోవడమనే భావంతో వ్యక్తం చేశాం.
- source_word: אֶל אֶרֶץ רְחוֹקָה אוֹ קְרוֹבָה
  choice: దూరమైన దేశానికైనా సమీపమైన దేశానికైనా
  rationale: మూలంలోని దూరం–సమీపం వ్యత్యాసాన్ని స్పష్టంగా, సహజమైన తెలుగు జంట నిర్మాణంతో నిలిపాం.
theological_decisions:
- issue: సార్వత్రిక మానవ పాపస్థితిని తెలిపే సాధారణ אָדָם
  choice: పాపం చేయని మనిషి ఎవరూ లేరు
  alternative: పాపం చేయని వారెవరూ లేరు
  rationale: ‘మనిషి’ మూలంలోని సాధారణ ఏకవచన אָדָםను నిలుపుతూ, ఇక్కడ స్త్రీపురుషులందరినీ సూచించే సహజ తెలుగు ప్రయోగంగా పనిచేస్తుంది. వాక్యం వ్యక్తిగత మినహాయింపు లేదని చెబుతుంది; దాని విస్తృతిని తగ్గించలేదు లేదా విస్తరించి వ్యాఖ్యానించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన ప్రార్థనా శైలి. ఈ వచనం తరువాతి వాక్యానికి కొనసాగుతున్న షరతు వాక్యం కావడంతో చివర కామా ఉంచబడింది. మూలంలో పాఠభేదం లేదా అనువాదానికి అవసరమైన నిజమైన సందిగ్ధత లేకపోవడంతో పాదటిప్పణి జోడించలేదు.
