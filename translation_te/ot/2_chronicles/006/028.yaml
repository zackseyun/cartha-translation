  to: దేశంలో కరువు వచ్చినా, అంటువ్యాధి వచ్చినా, పంటలకు మాడుతెగులు గానీ బూజు తెగులు గానీ సోకినా, మిడతలు గానీ పంటలను మింగివేసే పురుగులు గానీ[a] వచ్చినా, అతని శత్రువులు అతని పట్టణాల్లో[b] అతన్ని ముట్టడించినా, ఏ విపత్తుగానీ ఏ వ్యాధిగానీ వచ్చినా—
  rationale: יֵרָקוֹן యొక్క మొక్కలకు సోకే పసుపుదనం/బూజు-సంబంధిత వ్యాధి భావాన్ని సహజంగా ఇవ్వడానికి ‘పచ్చతెగులు’ స్థానంలో ‘బూజు తెగులు’ వాడబడింది. שִׁדָּפוֹן యొక్క పంటలను మాడ్చే/నాశనం చేసే భావానికి ‘మాడుతెగులు’ వాడబడింది. మిగిలిన వాక్యనిర్మాణం, అస్పష్టమైన కీటకపదానికి ఉన్న గమనిక, మరియు ‘ద్వారాలు’ అనే పట్టణ-సూచక ప్రయోగంపై గమనికను నిలుపుకున్నాము.
