    text: హీబ్రూ పదం חָסִיל పంటలను తినివేసే ఒక కీటకాన్ని సూచిస్తుంది; అది ఖచ్చితంగా ఏ జాతికి చెందినదో తెలియదు. ‘మింగివేసే మిడతలు’ అని కూడా అనువదించవచ్చు.
