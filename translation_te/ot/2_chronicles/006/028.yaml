translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రార్థనా సందర్భానికి తగిన సరళమైన శైలి. వ్యవసాయ విపత్తుల పేర్లకు సాధారణంగా అర్థమయ్యే పదాలు వాడబడ్డాయి; దీర్ఘ జాబితి చివర కొనసాగింపును సూచించేందుకు దీర్ఘ విరామచిహ్నం నిలుపబడింది.
