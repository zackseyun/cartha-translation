  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רָעָ֞ב כִּֽי יִהְיֶ֣ה בָ/אָ֗רֶץ דֶּ֣בֶר כִּֽי יִֽ֠הְיֶה שִׁדָּפ֨וֹן וְ/יֵרָק֜וֹן אַרְבֶּ֤ה וְ/חָסִיל֙ כִּ֣י יִהְיֶ֔ה כִּ֧י יָֽצַר ל֛/וֹ אוֹיְבָ֖י/ו בְּ/אֶ֣רֶץ שְׁעָרָ֑י/ו כָּל נֶ֖גַע וְ/כָֽל מַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/028.yaml
  text: If there is famine in the land[a], if there is plague, blight, mildew, locust, or caterpillar; if his enemies besiege him in the land of his gates[b]; whatever plague and whatever sickness there may be—
translation:
  language: te
  text: దేశంలో కరువు వచ్చినా, అంటువ్యాధి వచ్చినా, పంటలకు మాడుతెగులు గానీ బూజు తెగులు గానీ సోకినా, మిడతలు గానీ పంటలను మింగివేసే పురుగులు గానీ[a] వచ్చినా, అతని శత్రువులు అతని పట్టణాల్లో[b] అతన్ని ముట్టడించినా, ఏ విపత్తుగానీ ఏ వ్యాధిగానీ వచ్చినా—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం חָסִיל పంటలను తినివేసే ఒక కీటకాన్ని సూచిస్తుంది; అది ఖచ్చితంగా ఏ జాతికి చెందినదో తెలియదు. ‘మింగివేసే మిడతలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘అతని ద్వారాల దేశంలో.’ ఇక్కడ ‘ద్వారాలు’ ఆ దేశంలోని పట్టణాలను లేదా ఊళ్లను సూచిస్తున్నాయి.
    reason: cultural_note
lexical_decisions:
- source_word: רָעָב
  choice: కరువు
  rationale: దేశవ్యాప్త ఆహార కొరత అనే విపత్తు సందర్భంలో ఆధునిక తెలుగులో సహజమైన పదం.
- source_word: דֶּבֶר
  choice: అంటువ్యాధి
  rationale: ప్రజల్లో వ్యాపించే తీవ్రమైన మహమ్మారి స్వభావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: שִׁדָּפוֹן
  choice: పంట ఎండుతెగులు
  rationale: వేడి గాలి లేదా ఎండ వల్ల కలిగే వినాశకర పంటనష్టాన్ని సూచిస్తుంది.
- source_word: יֵרָקוֹן
  choice: పచ్చతెగులు
  rationale: మొక్కల రంగు మారడం లేదా పాలిపోవడం కలిగించే తెగులును వ్యవసాయ సందర్భంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אַרְבֶּה
  choice: మిడతలు
  rationale: పంటలను నాశనం చేసే గుంపులుగా వచ్చే మిడతలను సూచించే సాధారణ తెలుగు పదం.
- source_word: חָסִיל
  choice: పంటను మింగివేసే పురుగులు
  rationale: ఖచ్చితమైన కీటకజాతి అనిశ్చితమైనందున, పదం సూచించే పంటలను తినివేసే స్వభావాన్ని అనువదించింది.
- source_word: כִּי יָצַר לוֹ אֹיְבָיו
  choice: అతని శత్రువులు ... అతన్ని ముట్టడించినా
  rationale: צור హిఫిల్ రూపంలోని చుట్టుముట్టి ఒత్తిడి చేయడం అనే సైనిక భావాన్ని నిలుపుతుంది.
- source_word: בְּאֶרֶץ שְׁעָרָיו
  choice: అతని పట్టణాల్లో
  rationale: అక్షరార్థంగా ‘అతని ద్వారాల దేశంలో’; ద్వారాలు పట్టణాలకు సూచకంగా వాడబడినందున సహజ తెలుగులో భావాన్ని ఇచ్చింది.
- source_word: כָּל נֶגַע
  choice: ఏ విపత్తు
  rationale: దెబ్బ, బాధ, తెగులు వంటి విస్తృత భావాన్ని ఇక్కడ సమగ్ర విపత్తుగా వ్యక్తపరుస్తుంది.
- source_word: כָל מַחֲלָה
  choice: ఏ వ్యాధి
  rationale: మַחֲלָה సూచించే సాధారణ అనారోగ్య లేదా రోగ భావాన్ని నేరుగా అందిస్తుంది.
