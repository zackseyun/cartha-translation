  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֣קֶם יְהוָ֔ה אֶת דְּבָר֖/וֹ אֲשֶׁ֣ר דִּבֵּ֑ר וָ/אָק֡וּם תַּחַת֩ דָּוִ֨יד אָבִ֜/י וָ/אֵשֵׁ֣ב עַל כִּסֵּ֣א יִשְׂרָאֵ֗ל כַּ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וָ/אֶבְנֶ֣ה הַ/בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/010.yaml
  text: And Yahweh has fulfilled his word that he spoke[a], and I have risen in the place of David my father and sit on the throne of Israel, as Yahweh spoke, and I have built the house for the name of Yahweh[b], the God of Israel.
translation:
  language: te
  text: యెహోవా తాను పలికిన తన మాటను నెరవేర్చాడు[a]. నేను నా తండ్రి దావీదు స్థానంలో నిలిచి, యెహోవా పలికినట్లే ఇశ్రాయేలు సింహాసనంపై కూర్చున్నాను. ఇశ్రాయేలు దేవుడైన యెహోవా నామం కోసం ఆ ఇంటిని కట్టాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తాను పలికిన తన మాటను స్థిరపరిచాడు,” లేక “అమలు చేశాడు.” హీబ్రూ క్రియకు అక్షరార్థంగా “తన మాటను నిలిచేలా చేశాడు” అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: మూలంలో “ఆ ఇల్లు” అని ఉంది; ఇక్కడ అది మందిరాన్ని సూచిస్తుంది. “యెహోవా నామం కోసం ఇల్లు” అనే హీబ్రూ వ్యక్తీకరణను ప్రధాన పాఠ్యంలో నిలిపాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: నెరవేర్చాడు
  rationale: హిఫీల్ రూపంలో ‘తన మాటను నిలబెట్టడం/అమలు చేయడం’ అనే భావం ఉంది. వాగ్దాన సందర్భంలో ‘నెరవేర్చాడు’ సహజంగా ఉండి, ఉద్దేశించిన ఫలితాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: דְּבָרוֹ אֲשֶׁר דִּבֵּר
  choice: తాను పలికిన మాటను
  rationale: దָּבָר పదంలోని ‘మాట’ భావాన్ని, దִּבֵּר క్రియతో ఉన్న పదపునరుక్తిని సాధ్యమైనంతవరకు నిలిపింది.
- source_word: וָאָקוּם תַּחַת דָּוִיד אָבִי
  choice: నేను నా తండ్రి దావీదు స్థానంలో నిలిచి
  rationale: קום క్రియకు ‘నిలిచాను’ అనే మూలచిత్రాన్ని ఉంచుతూ, תחת ద్వారా సూచితమైన రాజవంశ వారసత్వాన్ని ‘స్థానంలో’ అని తెలిపింది.
- source_word: וָאֵשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సింహాసనం మీద కూర్చున్నాను
  rationale: రాజ్యాధికారాన్ని తెలిపే హీబ్రూ రాజభాషను సహజమైన తెలుగులో నేరుగా అందిస్తుంది.
- source_word: וָאֶבְנֶה
  choice: కట్టించాను
  rationale: రాజైన సొలొమోను ఆధ్వర్యంలో మందిర నిర్మాణం జరిగినదనే సహజ తెలుగు భావాన్ని ఇస్తుంది; ‘కట్టాను’ కూడా సాధ్యమైన మరింత రూపానుగుణ ప్రత్యామ్నాయం.
- source_word: הַבַּיִת
  choice: ఈ మందిరాన్ని
  rationale: సందర్భంలో ఇది యెరూషలేము దేవాలయాన్ని సూచిస్తుంది. తెలుగులో ‘ఇల్లు’ అనడం అపార్థానికి దారితీయవచ్చు కాబట్టి ‘మందిరం’ను ప్రధాన పాఠ్యంలో ఉంచి, మూలంలోని ‘ఇల్లు’ పదాన్ని పాదసూచికలో తెలిపాం.
- source_word: לְשֵׁם יְהוָה
  choice: యెహోవా నామం కోసం
  rationale: దేవుని నామం కోసం నిర్మించిన మందిరం అనే ముఖ్యమైన నిబంధనా వ్యక్తీకరణను వివరణాత్మకంగా మార్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: దేవాలయ సూచన הַבַּיִת
  choice: మందిరం
  alternative: ఇల్లు
  rationale: సందర్భార్థం స్పష్టంగా ఉండేందుకు ‘మందిరం’ను ఎంచుకున్నాం; అయితే హీబ్రూ రూపకాన్ని పాదసూచికలో సంరక్షించాం.
- issue: לְשֵׁם יְהוָה అనే వ్యక్తీకరణ
  choice: యెహోవా నామం కోసం
  alternative: యెహోవాను ఘనపరచడానికి
  rationale: ‘నామం’ అనే హీబ్రూ దైవశాస్త్రీయ వ్యక్తీకరణను నిలిపి, దేవుడు మందిరంలో పరిమితుడన్న భావాన్ని దిగుమతి చేయకుండా ఉంది.
- issue: దైవనామం יְהוָה
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠ్యంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణను వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు స్పష్టమైన వాక్యనిర్మాణం వాడాం. హీబ్రూ వావ్-క్రమంలోని వరుస వాక్యాలను తెలుగులో చిన్న వాక్యాలుగా విభజించాం. ‘నామం కోసం’ అనే నిబంధనా భాషను యథాతథ భావంతో నిలిపాం.
