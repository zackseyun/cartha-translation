review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the sequence: hear from heaven, their prayer and plea for favor, and act judicially for them. However, the Hebrew petitionary perfects are better conveyed in Telugu by direct prayer imperatives rather than the modal form “చేయాలి,” which can mean “must/should do” rather than a prayer addressed to God.'
  naturalness: “ఆలకించి ... చేయాలి” is understandable, but the shift from the respectful petition “నీవు” to “చేయాలి” is less idiomatic for a direct prayer. “ఆలకించి, వారి పక్షంగా న్యాయం చేయుము” is natural, reverent modern-standard Telugu and preserves the parallel petitions.
  terminology: “కృపకోసం ... విన్నపం” correctly conveys תְּחִנָּה. “వారి పక్షంగా న్యాయం చేయుము” preserves the judicial sense of מִשְׁפָּטָם without prematurely selecting only ‘judgment,’ ‘right,’ or ‘cause.’
  issues:
  - severity: medium
    issue: Petitionary force is weakened by “చేయాలి.”
    rationale: The Hebrew forms function as requests directed to God. In Telugu, “చేయాలి” commonly states obligation or necessity; “చేయుము” directly expresses the prayer request and matches the preceding address “నీవు.”
  - severity: low
    issue: The footnote’s literal gloss repeats the same modal form.
    rationale: Once the main text uses a direct petition, the literal gloss and alternatives should likewise use petitionary verbs for grammatical and stylistic consistency.
  revised_text: అప్పుడు నీవు ఆకాశం నుండి వారి ప్రార్థనను, కృపకోసం వారు చేసే విన్నపాన్ని ఆలకించి, వారి పక్షంగా న్యాయం చేయుము.[a]
  revised_footnotes:
  - marker: a
    text: లేదా ‘వారి వ్యాజ్యాన్ని సమర్థించుము,’ లేదా ‘వారి తీర్పును అమలు చేయుము.’ హీబ్రూలో అక్షరార్థంగా, ‘వారి న్యాయాన్ని/తీర్పును చేయుము.’
    reason: lexical_alternative
  revision_rationale: This revision retains the draft’s faithful lexical choices while making the two divine petitions explicit and idiomatic in Telugu. It does not resolve the semantic range of מִשְׁפָּט beyond the contextual rendering; the alternatives remain available in the footnote.
