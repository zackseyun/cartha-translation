  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שָׁמַעְתָּ֙ מִן הַ/שָּׁמַ֔יִם אֶת תְּפִלָּתָ֖/ם וְ/אֶת תְּחִנָּתָ֑/ם וְ/עָשִׂ֖יתָ מִשְׁפָּטָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/035.yaml
  text: then hear from heaven their prayer and their plea for favor[a], and maintain their cause.
translation:
  language: te
  text: అప్పుడు నీవు ఆకాశం నుండి వారి ప్రార్థనను, కృపకోసం వారు చేసే విన్నపాన్ని ఆలకించి, వారి పక్షంగా న్యాయం చేయుము.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారి వ్యాజ్యాన్ని సమర్థించుము,’ లేదా ‘వారి తీర్పును అమలు చేయుము.’ హీబ్రూలో అక్షరార్థంగా, ‘వారి న్యాయాన్ని/తీర్పును చేయుము.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: అప్పుడు నీవు ... ఆలకించి
  rationale: ముందటి షరతులతో అనుసంధానమైన ప్రార్థనా సందర్భంలో ఈ క్రియ దేవునికి చేసిన విన్నపంగా ఉంది. ‘అప్పుడు’ సందర్భ ప్రవాహాన్ని, ‘ఆలకించు’ ప్రార్థనను శ్రద్ధగా వినే భావాన్ని సహజ తెలుగులో తెలియజేస్తాయి.
- source_word: מִן הַשָּׁמַיִם
  choice: ఆకాశం నుండి
  rationale: హీబ్రూలో రూపపరంగా బహువచనమైనా, దేవుని నివాసాన్ని సూచించే ప్రార్థనా సూత్రంలో ఏకవచన ‘ఆకాశం’ ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: תְּפִלָּתָם
  choice: వారి ప్రార్థనను
  rationale: ఇది ప్రార్థనకు సాధారణ పదం; ఏకవచన రూపం సమూహపరమైన వారి ప్రార్థనను సూచిస్తుంది.
- source_word: תְּחִנָּתָם
  choice: కృపకోసం వారు చేసే విన్నపాన్ని
  rationale: ఈ పదం దయ లేదా అనుగ్రహం కోరే ప్రాధేయాన్ని సూచిస్తుంది. ‘విన్నపం’ మాత్రమే కంటే ‘కృపకోసం’ మూలంలోని భావ ఛాయను స్పష్టంగా నిలుపుతుంది.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: వారి పక్షంగా న్యాయం చేయాలి
  rationale: అక్షరార్థంగా ‘వారి న్యాయాన్ని/తీర్పును చేయు.’ ఈ న్యాయపరమైన నుడికారం వారి పక్షంగా వ్యవహరించి వారికి న్యాయం చేయడాన్ని సూచిస్తుంది; తెలుగు వాక్యం ఆ న్యాయసంబంధ భావాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: ప్రార్థనకు దేవుడు ఇచ్చే ప్రతిస్పందనను న్యాయపరమైన భాషలో అనువదించడం
  choice: వారి పక్షంగా న్యాయం చేయాలి
  alternative: వారి వ్యాజ్యాన్ని సమర్థించాలి; వారి తీర్పును అమలు చేయాలి
  rationale: מִשְׁפָּטָם అనే పదానికి న్యాయం, తీర్పు, హక్కు, వ్యాజ్యం వంటి అర్థాలు సాధ్యమే. ఎంపిక చేసిన అనువాదం దేవుడు కేవలం వినడమే కాక వారి పక్షంగా న్యాయంగా చర్య తీసుకోవాలనే భావాన్ని నిలుపుతుంది; అయితే హీబ్రూ నుడికారంలోని ఇతర సాధ్యార్థాలను పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలి వాడబడింది. ‘ఆలకించి’ కొద్దిగా ఉన్నతమైనదైనా సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది; ‘వారి పక్షంగా న్యాయం చేయాలి’ మూలంలోని న్యాయపరమైన ఉద్వేగాన్ని సహజంగా అందిస్తుంది.
