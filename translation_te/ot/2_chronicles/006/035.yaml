revisions:
- from: అప్పుడు నీవు ఆకాశం నుండి వారి ప్రార్థనను, కృపకోసం వారు చేసే విన్నపాన్ని ఆలకించి, వారి పక్షంగా న్యాయం చేయాలి.[a]
  to: అప్పుడు నీవు ఆకాశం నుండి వారి ప్రార్థనను, కృపకోసం వారు చేసే విన్నపాన్ని ఆలకించి, వారి పక్షంగా న్యాయం చేయుము.[a]
  rationale: This revision retains the draft’s faithful lexical choices while making the two divine petitions explicit and idiomatic in Telugu. It does not resolve the semantic range of מִשְׁפָּט beyond the contextual rendering; the alternatives remain available in the footnote.
