id: 2CH.6.22
reference: 2 Chronicles 6:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם יֶחֱטָ֥א אִישׁ֙ לְ/רֵעֵ֔/הוּ וְ/נָֽשָׁא ב֥/וֹ אָלָ֖ה לְ/הַֽאֲלֹת֑/וֹ וּ/בָ֗א אָלָ֛ה לִ/פְנֵ֥י מִֽזְבַּחֲ/ךָ֖ בַּ/בַּ֥יִת הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/022.yaml
  text: If a man sins against his neighbor[a], and an oath is laid on him to make him swear, and he comes and the oath is before your altar in this house,
translation:
  language: te
  text: ఒకడు తన పొరుగువానికి వ్యతిరేకంగా పాపం చేస్తే, అతనిచేత ప్రమాణం చేయించడానికి అతని మీద శాపసహిత ప్రమాణం మోపబడినప్పుడు[a], అతడు వచ్చి ఈ మందిరంలో నీ బలిపీఠం ఎదుట ఆ ప్రమాణం చేస్తే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో దీనిని ‘అతని మీద ఒక ప్రమాణం మోపబడితే’ అని కూడా అనువదించవచ్చు. ఇక్కడి పదం, ప్రమాణం అబద్ధమైతే శాపాన్ని ఆహ్వానించే ప్రమాణాన్ని సూచించవచ్చు. తరువాతి మాటలను పదశః ‘ఆ ప్రమాణం నీ బలిపీఠం ఎదుటికి వస్తే’ అని కూడా చెప్పవచ్చు.
    reason: אָלָה లోని ప్రమాణం/శాపం భావద్వంద్వాన్ని, అలాగే וּבָא אָלָה నిర్మాణంలోని కర్తకు సంబంధించిన అస్పష్టతను సంరక్షిస్తుంది.
lexical_decisions:
- source_word: אִם יֶחֱטָא אִישׁ
  choice: ఒకడు ... పాపం చేసినప్పుడు
  rationale: షరతును సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తూ, חטא లోని నైతిక-మతపరమైన ‘పాపం చేయడం’ అనే భావాన్ని నిలుపుతుంది.
- source_word: לְרֵעֵהוּ
  choice: తన పొరుగువానికి విరోధంగా
  rationale: רֵעַ సూచించే తోటి వ్యక్తి లేదా పొరుగువాడు అనే సామాజిక సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְנָשָׁא בוֹ אָלָה
  choice: అతని మీద శాపపూర్వక ప్రమాణం మోపబడితే
  rationale: న్యాయసంబంధ సందర్భంలో ఒక వ్యక్తిపై ప్రమాణబాధ్యతను మోపడం అనే నుడికారాన్ని కాపాడుతుంది; אָלָה లోని శాపంతో కూడిన ప్రమాణ భావాన్ని ప్రధాన పాఠ్యంలోనే స్పష్టం చేస్తుంది.
- source_word: לְהַאֲלֹתוֹ
  choice: అతనితో ప్రమాణం చేయించడానికి
  rationale: אלה హిఫీల్ రూపంలోని కారణార్థాన్ని, అంటే అతనితో ప్రమాణం చేయించడం లేదా అతన్ని ప్రమాణానికి లోబరచడం అనే భావాన్ని విడిగా నిలుపుతుంది.
- source_word: וּבָא אָלָה לִפְנֵי מִזְבַּחֲךָ
  choice: అతడు వచ్చి ... నీ బలిపీఠం ఎదుట ఆ ప్రమాణం చేస్తే
  rationale: పదశః ‘ప్రమాణం ... ఎదుటికి వస్తే’ అనే హీబ్రూ నిర్మాణాన్ని తెలుగులో అర్థవంతంగా వ్యక్తం చేస్తూ, వ్యక్తి బలిపీఠం ఎదుట ఆ ప్రమాణాన్ని పలికే న్యాయాచరణను సూచిస్తుంది.
- source_word: בַּבַּיִת הַזֶּה
  choice: ఈ మందిరంలో
  rationale: בַּיִת పదశః ‘ఇల్లు’ అయినా, ఈ సందర్భంలో దేవాలయాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఈ మందిరంలో’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
theological_decisions:
- issue: אָלָה పదంలోని న్యాయపరమైన ప్రమాణం–శాపం ద్వంద్వార్థం
  choice: ప్రధాన పాఠ్యంలో ‘శాపపూర్వక ప్రమాణం’ అని అనువదించడం
  alternative: ‘ప్రమాణం’ లేదా ‘శాపం’ మాత్రమే
  rationale: ఈ న్యాయసందర్భంలో అబద్ధమైతే శాపాన్ని ఆహ్వానించే ప్రమాణం ఉద్దేశించబడింది. ‘ప్రమాణం’ మాత్రమే అంటే శాపసంబంధ శిక్షార్థం కనుమరుగవుతుంది; ‘శాపం’ మాత్రమే అంటే ప్రమాణ ప్రక్రియ మరుగునపడుతుంది.
- issue: וּבָא אָלָה యొక్క కర్త మరియు చర్య
  choice: ‘అతడు వచ్చి ... ఆ ప్రమాణం చేస్తే’
  alternative: ‘ఆ ప్రమాణం నీ బలిపీఠం ఎదుటికి వస్తే’
  rationale: హీబ్రూలో ‘ప్రమాణం’ వాక్యకర్తగా గ్రహించగల నిర్మాణాత్మక అస్పష్టత ఉంది. అయితే సందర్భంలో ప్రమాణం చేయాల్సిన వ్యక్తి బలిపీఠం ఎదుటికి వచ్చి ప్రమాణం పలకడం తెలుగులో స్పష్టమైన భావం; ప్రత్యామ్నాయాన్ని పాదటీకలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రార్థనా-న్యాయశైలిని ఉపయోగించాం. ‘ఒకడు’, ‘పొరుగువాడు’, ‘బలిపీఠం’, ‘మందిరం’ వంటి సాధారణంగా అర్థమయ్యే పదాలను ఎంచుకున్నాం; రెండు హీబ్రూ ప్రమాణ నిర్మాణాలను అనవసర పునరుక్తిగా కుదించకుండా విడిగా ప్రతిబింబించాం.
