source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר֙ דִּבֶּ֣ר בְּ/פִ֔י/ו אֵ֖ת דָּוִ֣יד אָבִ֑/י וּ/בְ/יָדָ֥י/ו מִלֵּ֖א לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/004.yaml
  text: And he said[a], “Blessed be Yahweh, the God of Israel, who spoke with his mouth to David my father and has fulfilled it by his hand, saying,”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “ఇశ్రాయేలు దేవుడైన యహ్వే స్తుతింపబడునుగాక! ఆయన తన నోటితో నా తండ్రి దావీదుకు పలికిన మాటను తన చేతితో నెరవేర్చాడు,[a] ఇలా అంటూ:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “ఆయన తన నోటితో నా తండ్రి దావీదుకు పలికి, తన చేతితో దానిని నెరవేర్చాడు.” హీబ్రూలో దేవుడు పలకడం, కార్యం చేయడం మధ్య ఉద్దేశపూర్వక సమాంతరత ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు అతడు ఇలా అన్నాడు
  rationale: కథనాన్ని కొనసాగించే wayyiqtol రూపాన్ని సహజమైన ఆధునిక తెలుగు కథనశైలిలో వ్యక్తపరుస్తుంది.
- source_word: בָּרוּךְ
  choice: స్తుతింపబడును గాక
  rationale: దేవుని ఉద్దేశించిన ఆశీర్వాదోక్తి/స్తుతి సూత్రాన్ని గౌరవప్రదంగా, సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా లిప్యంతరీకరిస్తుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: నిర్మాణ సంబంధాన్ని తెలుగులో సహజమైన విశేషణ పదబంధంగా అందిస్తుంది.
- source_word: דִּבֶּר בְּפִיו
  choice: తన నోటితో చెప్పినదాన్ని
  rationale: ‘తన నోటితో’ అనే మానవరూపక పదప్రయోగాన్ని నిలుపుతూ, తరువాతి ‘తన చేతితో’తో ఉన్న ఉద్దేశపూర్వక సమాంతరతను కాపాడుతుంది.
- source_word: אֵת דָּוִיד אָבִי
  choice: నా తండ్రి దావీదుతో
  rationale: דבר క్రియతో వ్యక్తిని సూచించే אֵת ను సందర్భానుసారంగా ‘దావీదుతో’ అని అందిస్తుంది; ‘దావీదుకు’ కూడా సాధ్యమే.
- source_word: וּבְיָדוֹ מִלֵּא
  choice: తన చేతితో నెరవేర్చాడు
  rationale: దేవుడు పలికిన మాటను కార్యరూపంలో నెరవేర్చాడనే భావాన్ని, నోరు–చేయి సమాంతరతతో సహా నిలుపుతుంది.
- source_word: לֵאמֹר
  choice: ఆయన ఇలా అన్నాడు
  rationale: తదుపరి వచనంలో వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే ఉద్ధరణ సూచక infinitive ను సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత ఒడంబడిక నామం నేరుగా ఉంది; దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’గా లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: దేవుని నోరు మరియు చేయి అనే మానవరూపక భాష
  choice: ‘తన నోటితో’ మరియు ‘తన చేతితో’ రెండింటినీ నిలుపడం
  alternative: ‘చెప్పి దాన్ని నెరవేర్చాడు’ అని సరళీకరించడం
  rationale: హీబ్రూలో దేవుని పలుకుకూ కార్యానికీ మధ్య ఉద్దేశపూర్వక సమాంతరత ఉంది; దానిని సిద్ధాంతపరంగా మృదువుచేయకుండా పరిరక్షించాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆరాధనా గౌరవాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ‘నోటితో—చేతితో’ సమాంతరతను స్పష్టంగా ఉంచింది; [a] గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
