  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שָׁ֣בוּ אֵלֶ֗י/ךָ בְּ/כָל לִבָּ/ם֙ וּ/בְ/כָל נַפְשָׁ֔/ם בְּ/אֶ֥רֶץ שִׁבְיָ֖/ם אֲשֶׁר שָׁב֣וּ אֹתָ֑/ם וְ/הִֽתְפַּֽלְל֗וּ דֶּ֤רֶךְ אַרְצָ/ם֙ אֲשֶׁ֣ר נָתַ֣תָּה לַ/אֲבוֹתָ֔/ם וְ/הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֔רְתָּ וְ/לַ/בַּ֖יִת אֲשֶׁר בָּנִ֥יתִי לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/038.yaml
  text: and they return to you with all their heart and with all their soul in the land of their captivity[a], where they were taken captive, and pray toward their land that you gave to their fathers, and toward the city that you have chosen, and toward the house that I have built for your name,
translation:
  language: te
  text: వారు చెరపట్టబడిన దేశంలో, తమ హృదయమంతటితోను తమ ప్రాణమంతటితోను నీ వైపు తిరిగి[a], నీవు వారి పూర్వికులకు ఇచ్చిన వారి దేశం వైపు, నీవు ఎన్నుకున్న పట్టణం వైపు, నీ నామం కొరకు నేను కట్టిన మందిరం వైపు ప్రార్థిస్తే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ వైపు మళ్లి’; ఈ పదబంధం నిబంధన సందర్భాల్లో పశ్చాత్తాప భావాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: నీ వైపు తిరిగి
  rationale: שׁוּב אֶל యొక్క ప్రాథమిక అర్థమైన ‘తిరుగు/తిరిగి రా’ను నిలుపుతూ, ఈ నిబంధన సందర్భంలోని పశ్చాత్తాప భావాన్ని పాఠకుడు గ్రహించేలా ఉంచుతుంది; దానిని ప్రధాన పాఠ్యంలో స్పష్టీకరించి పరిమితం చేయదు.
- source_word: בְּכָל לִבָּם וּבְכָל נַפְשָׁם
  choice: తమ పూర్ణహృదయంతో, పూర్ణప్రాణంతో
  rationale: హృదయం–ప్రాణం అనే హీబ్రూ జంటను నిలుపుతూ సంపూర్ణ అంతరంగ నిబద్ధతను సహజమైన తెలుగు నిబంధన భాషలో వ్యక్తం చేస్తుంది.
- source_word: בְּאֶרֶץ שִׁבְיָם אֲשֶׁר שָׁבוּ אֹתָם
  choice: తాము చెరపట్టబడిన దేశంలోనే
  rationale: ‘వారి చెర దేశంలో, అక్కడ వారిని చెరపట్టారు’ అనే భావాన్ని తెలుగులో అనవసర పునరుక్తి లేకుండా సహజంగా వ్యక్తం చేస్తుంది; ‘లోనే’ వారు చెరలో ఉన్న ప్రదేశంలోనే తిరిగి ప్రార్థించడాన్ని స్పష్టం చేస్తుంది.
- source_word: וְהִתְפַּלְלוּ
  choice: ప్రార్థిస్తే
  rationale: ఈ వాక్యం ముందటి వచనాల నుంచి కొనసాగుతున్న షరతు నిర్మాణంలో భాగం; అందువల్ల తెలుగులో ‘ప్రార్థిస్తే’ సహజంగా ఆ సంబంధాన్ని చూపుతుంది.
- source_word: דֶּרֶךְ אַרְצָם
  choice: తమ దేశం వైపు
  rationale: ప్రార్థనలో దిశను సూచించే דֶּרֶךְను సంక్షిప్తంగా, సహజంగా ‘వైపు’ అని అందిస్తుంది.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבוֹתָם
  choice: నువ్వు తమ పూర్వికులకు ఇచ్చిన
  rationale: אָבוֹתָם ఇక్కడ వంశపూర్వికులను సూచిస్తుంది; ఆధునిక తెలుగులో ‘పూర్వికులు’ స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: וְהָעִיר אֲשֶׁר בָּחַרְתָּ
  choice: నువ్వు ఎన్నుకున్న పట్టణం వైపు
  rationale: దేవుని ఎంపికను నేరుగా నిలుపుతుంది; సందర్భం యెరూషలేమును సూచించినా పేరును పాఠ్యంలో చేర్చదు.
- source_word: וְלַבַּיִת אֲשֶׁר בָּנִיתִי לִשְׁמֶךָ
  choice: నీ నామం కోసం నేను కట్టించిన ఈ మందిరం వైపు
  rationale: בַּיִת సందర్భంలో దేవాలయాన్ని సూచిస్తున్నందున ‘మందిరం’ సాధారణ పాఠకునికి స్పష్టం. ‘నీ నామం కోసం’ అనే నిబంధన సంబంధిత మూలపదబంధాన్ని యథాతథ భావంతో నిలుపుతుంది. తెలుగు ప్రయోగంలో రాజు నిర్మాణాన్ని చేయించిన భావానికి ‘కట్టించిన’ సహజం; ‘ఈ’ సందర్భంలోని సొలొమోను ప్రార్థిస్తున్న మందిరాన్ని సూచిస్తుంది.
theological_decisions:
- issue: שׁוּב אֵלֶיךָలో పశ్చాత్తాప భావం
  choice: ‘నీ వైపు తిరిగి’ అని అనువదించడం
  alternative: ‘నీ యెదుట పశ్చాత్తాపపడి’ లేదా ‘మళ్లీ నీ వైపు మళ్లి’
  rationale: మూల క్రియ ప్రాథమికంగా తిరగడం/తిరిగి రావడం అని అర్థం. నిబంధన సందర్భంలో పశ్చాత్తాప సూచన ఉన్నప్పటికీ, దానినే ఏకైక అర్థంగా ప్రధాన పాఠ్యంలో పెట్టకుండా మూలంలోని భౌతిక, సంబంధాత్మక, అంతరంగ భావాల మధ్య ఉన్న విస్తృతిని కాపాడుతుంది.
- issue: לִשְׁמֶךָ అనే ‘నీ నామం కోసం’ పదబంధం
  choice: నామం అనే నిబంధనాత్మక భాషను నిలుపడం
  alternative: ‘నీ ఆరాధన కోసం’ లేదా ‘నీవు నివసించడానికి’
  rationale: ప్రత్యామ్నాయాలు భావవ్యాఖ్యానాన్ని చేర్చవచ్చు. ‘నీ నామం కోసం’ అనేది దేవుని నామం, సన్నిధి, మందిరం మధ్య ఉన్న అసలు వాక్యంలోని theological tensionను పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. సందర్భం దేవునితో నేరుగా మాట్లాడే ప్రార్థన కాబట్టి ‘నువ్వు/నీ’ ఏకవచన సంబోధనను వాడింది. ఇది స్వతహాగా అసంపూర్ణమైన షరతు వాక్యభాగం కావడంతో చివర కామాను నిలిపింది.
