id: 2CH.6.29
reference: 2 Chronicles 6:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּל תְּפִלָּ֣ה כָל תְּחִנָּ֗ה אֲשֶׁ֤ר יִהְיֶה֙ לְ/כָל הָ֣/אָדָ֔ם וּ/לְ/כֹ֖ל עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל אֲשֶׁ֣ר יֵדְע֗וּ אִ֤ישׁ נִגְע/וֹ֙ וּ/מַכְאֹב֔/וֹ וּ/פָרַ֥שׂ כַּפָּ֖י/ו אֶל הַ/בַּ֥יִת הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/029.yaml
  text: whatever prayer[a], whatever plea may be made by any man or by all your people Israel, each knowing his own affliction and his own pain, and spreading out his hands toward this house—
translation:
  language: te
  text: ఏ ప్రార్థనైనా, ఏ వేడుకోలైనా, ఏ మనిషి[a] చేసినా లేదా నీ ప్రజలైన ఇశ్రాయేలీయులందరూ చేసినా, ప్రతి ఒక్కరూ తమ తమ బాధను, వేదనను తెలుసుకొని ఈ మందిరం వైపు చేతులు చాపినప్పుడు—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో ‘ఏ మనిషి’ అని ఉంది; ఇక్కడ అది ఏ వ్యక్తినైనా సాధారణంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל תְּפִלָּה
  choice: ఏ ప్రార్థనైనా
  rationale: כָּל ఇక్కడ నిర్దిష్టం కాని సమగ్ర పరిధిని సూచిస్తుంది; ‘ఏ...అయినా’ ఆ విస్తృతిని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: כָל תְּחִנָּה
  choice: ఏ వేడుకోలైనా
  rationale: תְּחִנָּה కృప లేదా సహాయం కోసం చేసే మనఃపూర్వక విన్నపాన్ని సూచిస్తుంది; ‘వేడుకోలు’ సాధారణ పాఠకులకు సహజంగా ఉండి ఆ తీవ్రతను కాపాడుతుంది.
- source_word: אֲשֶׁר יִהְיֶה לְכָל הָאָדָם
  choice: ఏ వ్యక్తి చేసినా
  rationale: ప్రార్థన ఎవరివైపు నుంచి వస్తుందో తెలిపే భావాన్ని తెలుగులో ‘చేసినా’ సహజంగా వ్యక్తం చేస్తుంది; הָאָדָם ఇక్కడ మానవ వ్యక్తిని సాధారణార్థంలో సూచిస్తుంది.
- source_word: וּלְכֹל עַמְּךָ יִשְׂרָאֵל
  choice: లేక నీ ప్రజలైన ఇశ్రాయేలీయులందరూ చేసినా
  rationale: వ్యక్తి నుంచి సమాజమంతటికీ విస్తరించే పంపిణీ భావాన్ని ‘లేక’ స్పష్టంగా చూపుతుంది; ‘నీ ప్రజలైన ఇశ్రాయేలీయులు’ సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: אֲשֶׁר יֵדְעוּ אִישׁ
  choice: ప్రతి ఒక్కరూ ... తెలుసుకొని
  rationale: אִישׁ ఇక్కడ పంపిణీ భావంతో ‘ఒక్కొక్కరు’ అని సూచిస్తుంది; ‘ప్రతి ఒక్కరూ’ సమూహంలో వ్యక్తిగత అవగాహనను నిలుపుతుంది.
- source_word: נִגְעוֹ
  choice: తమ సొంత బాధను
  rationale: נֶגַע కు దెబ్బ, తెగులు, బాధ అనే విస్తృతార్థాలు ఉన్నాయి; సందర్భంలో వ్యక్తిగతంగా తెలిసిన కష్టాన్ని సూచించేందుకే ‘బాధ’ను ఎంచుకున్నాం.
- source_word: וּמַכְאֹבוֹ
  choice: వేదనను
  rationale: מַכְאוֹב శారీరక లేదా అంతరంగిక నొప్పి, వేదనను సూచిస్తుంది; ముందున్న ‘బాధ’తో అర్థభేదాన్ని కొంతవరకు నిలుపుతుంది.
- source_word: וּפָרַשׂ כַּפָּיו
  choice: తమ చేతులు చాపినప్పుడు
  rationale: ఇది ప్రార్థనా భంగిమను సూచించే హీబ్రూ నుడికారం; ‘చేతులు చాపడం’ తెలుగులో సహజమూ స్పష్టమూ.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: ఈ మందిరం వైపు
  rationale: אֶל ఇక్కడ ప్రార్థన చేసే దిశను సూచిస్తుంది; సందర్భంలోని הַבַּיִת దేవాలయం కనుక ‘మందిరం’ అర్థాన్ని స్పష్టపరుస్తుంది.
theological_decisions:
- issue: הָאָדָם అనే సాధారణ ఏకవచన పదానికి లింగసంబంధ అనువాదం
  choice: వ్యక్తి
  alternative: మనిషి
  rationale: ఈ సందర్భంలో אָדָם ఒక పురుషుణ్ణి మాత్రమే కాక ఎవరికైనా వర్తించే సాధారణ మానవ వ్యక్తిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘వ్యక్తి’ ఆ సాధారణ పరిధిని సహజంగా వ్యక్తం చేస్తుంది; మూలంలోని ఏకవచన పంపిణీ భావం పాదసూచికలో తెలియజేయబడింది.
- issue: נֶגַע యొక్క నిర్దిష్టత
  choice: బాధ
  alternative: తెగులు / దెబ్బ
  rationale: పదానికి తెగులు లేదా దెబ్బ అనే నిర్దిష్ట అర్థాలు సాధ్యమైనా, מַכְאוֹב తో కూడిన ఈ సందర్భం వ్యక్తి అనుభవించే విస్తృత కష్టాన్ని అనుమతిస్తుంది. అందువల్ల అర్థాన్ని అనవసరంగా కుదించకుండా ‘బాధ’ను ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివర దీర్ఘ విరామచిహ్నం ఉంచబడింది. వ్యక్తి మరియు సమాజం రెండింటినీ సూచించే మూల నిర్మాణాన్ని, అలాగే ‘బాధ–వేదన’ అనే జతలోని భావతేడాను నిలుపుకున్నాం.
