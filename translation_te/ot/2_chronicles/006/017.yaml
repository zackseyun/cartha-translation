id: 2CH.6.17
reference: 2 Chronicles 6:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֕ה יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל יֵֽאָמֵן֙ דְּבָ֣רְ/ךָ֔ אֲשֶׁ֥ר דִּבַּ֖רְתָּ לְ/עַבְדְּ/ךָ֥ לְ/דָוִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/017.yaml
  text: Now[a], Yahweh, God of Israel, let your word that you spoke to your servant David be confirmed.
translation:
  language: te
  text: ఇప్పుడు ఇశ్రాయేలు దేవుడవైన యాహ్వే, నీ సేవకుడైన దావీదుకు నీవు పలికిన నీ మాట స్థిరపడుగాక.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ వాగ్దానం నెరవేరుగాక”; లేదా “నీ మాట నిజమని తేలుగాక.”
    reason: יֵאָמֵן మరియు సందర్భానుసారంగా דְּבָרְךָకు సాధ్యమైన భావ ఛాయలను చూపించడానికి.
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: సొలొమోను ప్రార్థనలో తదుపరి విన్నపాన్ని ప్రవేశపెట్టే కాలసూచక సంధాన పదం. తెలుగులో ‘ఇప్పుడు’ సహజంగా ఉంది; అవసరమైతే ‘ఇక ఇప్పుడు’ అని కూడా అనవచ్చు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సాధారణ ధ్వన్యంతరీకరణను వాడింది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడవైన
  rationale: యాహ్వేను ఇశ్రాయేలు దేవునిగా గుర్తించే నిర్మాణాన్ని సంబోధనకు సహజమైన తెలుగు రూపంలో అందించింది.
- source_word: יֵאָמֵן
  choice: స్థిరపడుగాక
  rationale: אמן ధాతువు నిఫాల్ రూపం ఇక్కడ దేవుడు పలికిన మాట దృఢంగా నిలిచి నెరవేరాలని చేసే విన్నపం. ‘స్థిరపడుగాక’ దాని ఫలితార్థాన్ని, ప్రార్థనా స్వరాన్ని కాపాడుతుంది.
- source_word: דְּבָרְךָ
  choice: నీ మాట
  rationale: సందర్భంలో ఇది వాగ్దానాన్ని సూచించినా, మూలంలోని సాధారణ నామవాచకమైన ‘మాట’ను నిలుపుతూ సందర్భార్థాన్ని పాఠకుడికి తెరిచి ఉంచింది.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: నీవు ... పలికిన
  rationale: ‘మాట’తో ఉన్న మూలపద సంబంధాన్ని నిలుపుతూ, సంబంధవాచక ఉపవాక్యాన్ని తెలుగులో సహజంగా ముందుంచింది.
- source_word: לְעַבְדְּךָ לְדָוִיד
  choice: నీ సేవకుడైన దావీదుతో
  rationale: דבר తో לְ సంబోధిత వ్యక్తిని సూచిస్తుంది. తెలుగులో ‘దావీదుతో పలికిన’ సహజంగా ఉంటుంది; עבדకు ఈ రాజ-నిబంధన సందర్భంలో ‘సేవకుడు’ సముచితం.
theological_decisions:
- issue: יְהוָה అనే దైవ నామాన్ని ఎలా అందించాలి
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవ నామమే ఉంది. దానిని బిరుదుగా మార్చకుండా ధ్వన్యంతరీకరించడం మూలంలోని నామప్రయోగాన్ని కాపాడుతుంది.
- issue: דְּבָרְךָను ‘మాట’గా లేదా ‘వాగ్దానం’గా అనువదించాలా
  choice: నీ మాట
  alternative: నీ వాగ్దానం
  rationale: దావీదుకు పలికింది సందర్భానుసారం వాగ్దానమే అయినా, ‘మాట’ మూలపదాన్ని నేరుగా ప్రతిబింబించి, ఆ వాగ్దానార్థాన్ని సందర్భం ద్వారా గ్రహించనిస్తుంది.
- issue: יֵאָמֵן యొక్క భావాన్ని ఎలా వ్యక్తపరచాలి
  choice: స్థిరపడుగాక
  alternative: నెరవేరుగాక / నిజమని తేలుగాక
  rationale: ఈ రూపం పలికిన మాట దృఢంగా స్థాపితమై ఫలించాలని కోరే భావాన్ని కలిగి ఉంది. ఒకే వివరణను బలవంతంగా నిర్ణయించకుండా ప్రత్యామ్నాయ భావాలను పాదసూచికలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలి వాడబడింది. ‘స్థిరపడుగాక’ కొద్దిగా ఉన్నత శైలికి చెందినదైనా సాధారణ పాఠకునికి అర్థమయ్యేలా ఉండి, హెబ్రీయ క్రియలోని విన్నప మరియు స్థాపన భావాలను నిలుపుతుంది.
