id: 2CH.6.21
reference: 2 Chronicles 6:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שָׁ֨מַעְתָּ֜ אֶל תַּחֲנוּנֵ֤י עַבְדְּ/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יִֽתְפַּֽלְל֖וּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וְ֠/אַתָּה תִּשְׁמַ֞ע מִ/מְּק֤וֹם שִׁבְתְּ/ךָ֙ מִן הַ/שָּׁמַ֔יִם וְ/שָׁמַעְתָּ֖ וְ/סָלָֽחְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/021.yaml
  text: And hear the pleas of your servant and of your people Israel when they pray toward this place. And may you hear from your dwelling place[a], from heaven, and when you hear, forgive.
translation:
  language: te
  text: నీ సేవకుడూ, నీ ప్రజలైన ఇశ్రాయేలూ ఈ స్థలం వైపు ప్రార్థిస్తూ చేసే విన్నపాలను విను. పరలోకంలోనున్న నీ నివాసస్థలం నుండి విను; విని క్షమించు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַעְתָּ / תִּשְׁמַע / וְשָׁמַעְתָּ
  choice: విను / విను / విని
  rationale: שׁמע అనే క్రియ మూడుసార్లు రావడం వచన నిర్మాణానికి ముఖ్యమైనది. తెలుగులో సహజంగా ఉండేలా దాని పునరుక్తిని నిలిపి, చివరి క్రియను ‘విని’ అని ఇచ్చి క్షమించడానికిగల క్రమాన్ని స్పష్టం చేశాం.
- source_word: תַּחֲנוּנֵי
  choice: మొరలను
  rationale: ఈ పదం కరుణ లేదా అనుగ్రహం కోసం చేసే హృదయపూర్వక విన్నపాలను సూచిస్తుంది. ‘మొరలు’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, ఆ విన్నపాల ఆర్తిని కూడా వ్యక్తం చేస్తుంది.
- source_word: עַבְדְּךָ
  choice: నీ సేవకుడు
  rationale: దేవునికి ప్రార్థిస్తున్న సొలొమోను తనను తాను వినయంగా, గౌరవపూర్వకంగా సూచిస్తున్న సందర్భం కాబట్టి ‘సేవకుడు’ సందర్భోచితమైనది.
- source_word: יִתְפַּלְלוּ אֶל הַמָּקוֹם הַזֶּה
  choice: ఈ స్థలం వైపు ప్రార్థించినప్పుడు
  rationale: ప్రార్థనను సూచించే క్రియతో పాటు אֶל తెలిపే దిశను ‘వైపు’ సహజంగా వ్యక్తం చేస్తుంది; ఆలయాన్ని ఉద్దేశించి ప్రార్థించే భావం నిలుస్తుంది.
- source_word: מִמְּקוֹם שִׁבְתְּךָ מִן הַשָּׁמַיִם
  choice: నీవు నివసించే స్థలమైన పరలోకం నుండి
  rationale: రెండు పదబంధాల అన్వయాన్ని తెలుగులో సహజంగా చూపుతూ, దేవుని నివాసస్థలం పరలోకమని మూలంలో ఉన్న భావాన్ని స్పష్టంగా నిలిపింది.
- source_word: סָלָחְתָּ
  choice: క్షమించు
  rationale: పాపం లేదా అపరాధాన్ని మన్నించే భావానికి ‘క్షమించు’ స్పష్టమైన, సహజమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: దేవుని అతీతత్వం మరియు ఆలయ ప్రాధాన్యం
  choice: ప్రజలు ‘ఈ స్థలం వైపు’ ప్రార్థిస్తారు; దేవుడు పరలోకం నుండి వింటాడు.
  alternative: దేవుడు ఆలయంలోనే నివసిస్తున్నట్లు బలంగా స్థానీకరించడం, లేదా ఆలయ దిశకు సంబంధించిన మాటను కేవలం ప్రతీకగా మార్చడం.
  rationale: హీబ్రూ వాక్యం ఆలయం వైపు ప్రార్థించడాన్నీ, దేవుని నివాసం పరలోకమనే విషయాన్నీ కలిపి ఉంచుతుంది. అనువాదం ఈ రెండింటి మధ్యనున్న ధార్మిక ఉద్రిక్తతను పరిష్కరించకుండా యథాతథంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనకు తగిన గౌరవప్రదమైన శైలిని పాటించాం. ‘విను’ అనే పునరుక్తిని మూలపాఠ నిర్మాణానికి అనుగుణంగా నిలిపాం; వాక్యాన్ని మాత్రం సాధారణ పాఠకుడికి సులభంగా అర్థమయ్యేలా రూపొందించాం.
