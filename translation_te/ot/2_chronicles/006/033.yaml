source:
  edition: WLC
  text: וְ/אַתָּ֞ה תִּשְׁמַ֤ע מִן הַ/שָּׁמַ֨יִם֙ מִ/מְּכ֣וֹן שִׁבְתֶּ֔/ךָ וְ/עָשִׂ֕יתָ כְּ/כֹ֛ל אֲשֶׁר יִקְרָ֥א אֵלֶ֖י/ךָ הַ/נָּכְרִ֑י לְמַ֣עַן יֵדְעוּ֩ כָל עַמֵּ֨י הָ/אָ֜רֶץ אֶת שְׁמֶ֗/ךָ וּ/לְ/יִרְאָ֤ה אֹֽתְ/ךָ֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל וְ/לָ/דַ֕עַת כִּֽי שִׁמְ/ךָ֣ נִקְרָ֔א עַל הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/033.yaml
  text: then hear from heaven[a], from your dwelling place, and do according to all that the foreigner calls to you for, so that all the peoples of the earth may know your name and fear you, as your people Israel do, and may know that your name is called upon this house that I have built.
translation:
  language: te
  text: అప్పుడు నీవు ఆకాశం నుండి, నీ నివాసస్థలం నుండి విని, ఆ విదేశీయుడు నీకు మొరపెట్టి అడిగేదంతా చేయి. అప్పుడు భూమి మీద ఉన్న ప్రజలందరూ నీ నామాన్ని తెలుసుకొని, నీ ప్రజలైన ఇశ్రాయేలువారిలాగే నీకు భయపడేలా, నేను కట్టిన ఈ మందిరం మీద నీ నామం పిలువబడిందని[a] వారు తెలిసికొనేలా చేయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, భావానువాదంగా, “ఈ మందిరం నీ పేరుతో పిలువబడుతుందని.” హీబ్రూ నుడికారానికి అక్షరార్థం, “ఈ మందిరం మీద నీ నామం పిలువబడింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: విని
  rationale: ప్రార్థన సందర్భంలో శ్రద్ధగా విని స్పందించడాన్ని సూచిస్తుంది; తరువాత వచ్చే దైవకార్యంతో సహజంగా అనుసంధానమవుతుంది.
- source_word: מִן הַשָּׁמַיִם מִמְּכוֹן שִׁבְתֶּךָ
  choice: ఆకాశం నుండి, నీ నివాసస్థలం నుండి
  rationale: దేవుని నివాసాన్ని సూచించే రెండు సమాంతర పదబంధాల స్థానార్థాన్ని కాపాడుతుంది; దేవుడు మందిరానికే పరిమితుడనే భావాన్ని కలిగించదు.
- source_word: כְּכֹל אֲשֶׁר יִקְרָא אֵלֶיךָ הַנָּכְרִי
  choice: ఆ విదేశీయుడు నీకు మొరపెట్టి అడిగేదంతా
  rationale: קרא אל అనే ప్రార్థనాత్మక పిలుపును సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, అభ్యర్థన భావాన్ని నిలుపుతుంది.
- source_word: הַנָּכְרִי
  choice: ఆ విదేశీయుడు
  rationale: ఇశ్రాయేలు ప్రజలకు చెందని ఇతర జనానికి చెందిన వ్యక్తి అనే అర్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָל עַמֵּי הָאָרֶץ
  choice: భూమి మీద ఉన్న ప్రజలందరూ
  rationale: ఈ విశ్వవ్యాప్త సందర్భంలో הָאָרֶץ ఒక నిర్దిష్ట దేశాన్ని కాక భూమిని సూచిస్తుంది; עַמֵּי అనేక ప్రజాసమూహాలను సూచిస్తుంది.
- source_word: וּלְיִרְאָה אֹתְךָ
  choice: నీకు భయపడతారు
  rationale: దేవునిపట్ల భక్తిపూర్వక భయాన్ని సూచించే బైబిలు పదప్రయోగపు బలాన్ని తగ్గించకుండా ఉంచుతుంది.
- source_word: כִּי שִׁמְךָ נִקְרָא עַל הַבַּיִת הַזֶּה
  choice: ఈ మందిరం మీద నీ నామం పిలువబడిందని
  rationale: హీబ్రూ నుడికారాన్ని ఉద్దేశపూర్వకంగా దగ్గరగా ఉంచి, దాని వివరణాత్మక అర్థాన్ని పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: దేవుని నివాసస్థలం మరియు మందిరం మధ్య సంబంధం
  choice: దేవుడు ఆకాశంలోని తన నివాసస్థలం నుండి వింటాడనీ, భూమిపై ఉన్న మందిరం మీద ఆయన నామం పిలువబడిందనీ వచనంలోని భేదాన్ని అలాగే ఉంచడం
  alternative: ‘నీ పరలోక సన్నిధి నుండి’ అని వ్యాఖ్యానాత్మకంగా మార్చడం
  rationale: మూలవచనం దేవుని నివాసాన్ని ఆకాశంతో అనుసంధానిస్తూ, మందిరాన్ని ఆయన నామంతో అనుసంధానిస్తుంది; తరువాతి సిద్ధాంత వివరణలను చేర్చకుండా ఈ ఉద్రిక్తతను కాపాడాలి.
- issue: జనులు దేవునికి భయపడడం
  choice: ‘నీకు భయపడతారు’
  alternative: ‘నిన్ను భక్తితో గౌరవిస్తారు’
  rationale: ప్రత్యామ్నాయం భావంలోని భక్తిని తెలిపినా, ירא పదంలోని భయం మరియు గౌరవం కలిసిన బలాన్ని తగ్గిస్తుంది.
- issue: మందిరం మీద దేవుని నామం పిలువబడడం
  choice: మూల నుడికారాన్ని ప్రధాన పాఠ్యంలో ఉంచి వివరణను పాదసూచికలో ఇవ్వడం
  alternative: ప్రధాన పాఠ్యంలోనే ‘ఈ మందిరం నీ నామాన్ని ధరించిందని’ అని అనువదించడం
  rationale: మూలంలోని నామ-మందిర సంబంధాన్ని అతిగా వ్యాఖ్యానించకుండా, నిజమైన నుడికారాన్ని పాఠకునికి అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘నామం,’ ‘మందిరం,’ ‘మొరపెట్టి’ వంటి పదాలు ప్రార్థనా సందర్భానికి తగిన గౌరవభావాన్ని ఇస్తాయి; వాక్య నిర్మాణం సహజంగా ఉండేలా ఉంచబడింది.
