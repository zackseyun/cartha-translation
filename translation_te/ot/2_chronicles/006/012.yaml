  yaml_path: translation/ot/2_chronicles/006/012.yaml
  text: Then he stood before the altar of Yahweh in front of all the assembly of Israel and spread out his hands[a][b].
translation:
  language: te
  text: అప్పుడు అతడు యాహ్వే బలిపీఠం ముందు, ఇశ్రాయేలు సమస్త సమాజం ఎదుట నిలబడ్డాడు; తన చేతులు చాపాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలు సమాజమంతా.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, “తన అరచేతులను విప్పాడు”; ఈ నుడికారం ప్రార్థనలో చేతులు చాపడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: అప్పుడు అతడు ... నిలబడి
  rationale: కథనాన్ని ముందుకు నడిపించే wayyiqtol రూపాన్ని సహజమైన తెలుగు కథన క్రమంలో ‘అప్పుడు’తో వ్యక్తం చేస్తుంది; עמד యొక్క ‘నిలబడు’ అనే ప్రాథమిక భావాన్ని నిలుపుతుంది.
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: యాహ్వే బలిపీఠం ముందు
  rationale: לִפְנֵי ఇక్కడ స్థలసంబంధంగా ‘ముందు/ఎదుట’ అని అర్థం. మిజ్బేయాహ్‌ నిర్మాణ సంబంధాన్ని సహజ తెలుగులో ‘యాహ్వే బలిపీఠం’గా ఇచ్చాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన యహ్వేను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సులభంగా గుర్తించగల లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సమాజమంతటి ఎదుట
  rationale: נֶגֶד యొక్క ముఖాముఖి స్థలభావాన్ని ‘ఎదుట’ తెలియజేస్తుంది. קהל అనేది కూడివచ్చిన ప్రజాసమూహాన్ని సూచించేందున ‘సమాజం’ను ఎంచుకున్నాం.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: తన చేతులు చాపాడు
  rationale: כף అక్షరార్థంగా ‘అరచేయి’ కావచ్చినా, פרשׂతో కలిసినప్పుడు ప్రార్థనలో చేతులు విస్తరించే భంగిమను సూచిస్తుంది. ‘చేతులు చాపాడు’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని ప్రత్యేక నామాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘ముందు’ మరియు ‘ఎదుట’ అనే పదాలతో మూలంలోని రెండు వేర్వేరు స్థలసూచక పదాల భేదాన్ని సాధ్యమైనంతవరకు నిలిపాం.
