id: 2CH.6.26
reference: 2 Chronicles 6:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/הֵעָצֵ֧ר הַ/שָּׁמַ֛יִם וְ/לֹֽא יִהְיֶ֥ה מָטָ֖ר כִּ֣י יֶֽחֶטְאוּ לָ֑/ךְ וְ/הִֽתְפַּלְל֞וּ אֶל הַ/מָּק֤וֹם הַ/זֶּה֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ מֵ/חַטָּאתָ֥/ם יְשׁוּב֖וּ/ן כִּ֥י תַעֲנֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/026.yaml
  text: When the heavens are shut up and there is no rain because they have sinned against you[a], and they pray toward this place and confess your name and turn from their sin because you answer them,
translation:
  language: te
  text: ఆకాశం మూసుకుపోయి వర్షం కురవనప్పుడు, వారు నీకు విరోధంగా పాపం చేసినందువల్ల, వారు ఈ స్థలం వైపు తిరిగి ప్రార్థించి, నీ నామాన్ని ఒప్పుకొని, నీవు వారికి జవాబిచ్చినందువల్ల[a] తమ పాపం నుండి తిరిగినప్పుడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు వారిని బాధించినందువల్ల,” లేదా “నీవు వారిని అణకువపరచినందువల్ల.” సందర్భాన్ని బట్టి హెబ్రీ క్రియకు ఈ అర్థాలు కూడా రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהֵעָצֵר הַשָּׁמַיִם
  choice: ఆకాశం మూసుకుపోయి
  rationale: ב prefixed Niphal infinitive construct introduces the temporal circumstance. Telugu singular collective ‘ఆకాశం’ naturally denotes the rain-bearing heavens while retaining the concrete image of being shut.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: వర్షం కురవనప్పుడు
  rationale: The Hebrew literally states that there is no rain; in Telugu, ‘వర్షం కురవనప్పుడు’ naturally expresses the resulting absence of rainfall within the temporal clause.
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: వారు నీకు విరోధంగా పాపం చేసినందువల్ల
  rationale: כִּי is causal, and ethical לָךְ is clearly conveyed by ‘నీకు విరోధంగా.’ The completed Telugu participial form fits sin as the cause of the drought.
- source_word: וְהִתְפַּלְלוּ אֶל הַמָּקוֹם הַזֶּה
  choice: వారు ఈ స్థలం వైపు తిరిగి ప్రార్థించి
  rationale: אֶל marks orientation toward the temple, not prayer addressed to the place. ‘వైపు తిరిగి’ makes that directional sense natural and explicit in Telugu.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: నీ నామాన్ని ఒప్పుకొని
  rationale: In this penitential sequence, Hiphil ידה is best understood as acknowledging or confessing God’s name. ‘ఒప్పుకొని’ preserves that sense without specifying thanksgiving.
- source_word: מֵחַטָּאתָם יְשׁוּבוּן
  choice: తమ పాపం నుండి తిరిగితే
  rationale: שוב מן depicts turning away from sin. This wording retains the source metaphor rather than replacing it with the more interpretive ‘పశ్చాత్తాపపడితే.’
- source_word: כִּי תַעֲנֵם
  choice: నీవు వారికి జవాబిచ్చినందువల్ల
  rationale: Taking ענה as ‘answer’ preserves the immediate prayer-response logic. The causal כִּי is represented directly, while the alternative ‘afflict/humble’ sense is retained in a footnote.
theological_decisions:
- issue: Meaning of ענה in the final clause
  choice: నీవు వారికి జవాబిచ్చినందువల్ల
  alternative: నీవు వారిని బాధించినందువల్ల; నీవు వారిని అణకువపరచినందువల్ల
  rationale: The context of praying toward the temple supports ‘answer,’ but the consonantal Hebrew verb can also be associated with afflicting or humbling. The main text follows the prayer-response reading without suppressing the alternative.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు స్పష్టంగా ఉండే వాక్యనిర్మాణం. ‘నామం,’ ‘పాపం నుండి తిరుగు’ వంటి మూలగ్రంథ ప్రతిరూపాలు నిలుపబడ్డాయి.
