  terminology: ‘నీ నామాన్ని ఒప్పుకొని’ is an acceptable modern-standard Telugu rendering of acknowledging/confessing God's name in this penitential context. ‘పాపం నుండి తిరిగి’ appropriately retains the Hebrew repentance metaphor. The lexical-alternative footnote is correctly anchored to the final causal clause.
