    rationale: כִּי ఇక్కడ ముందరి సందర్భానికి కారణ/వివరణను ఇస్తుంది. తెలుగు సందర్భానుసారం ‘ఎందుకంటే’గా దానిని నిలపడం మూలంలోని అనుసంధానాన్ని స్పష్టంగా కాపాడుతుంది.
