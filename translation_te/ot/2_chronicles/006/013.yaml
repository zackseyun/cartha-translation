source:
  edition: WLC
  text: כִּֽי עָשָׂ֨ה שְׁלֹמֹ֜ה כִּיּ֣וֹר נְחֹ֗שֶׁת וַֽ/יִּתְּנֵ/הוּ֮ בְּ/ת֣וֹךְ הָ/עֲזָרָה֒ חָמֵ֨שׁ אַמּ֜וֹת אָרְכּ֗/וֹ וְ/חָמֵ֤שׁ אַמּוֹת֙ רָחְבּ֔/וֹ וְ/אַמּ֥וֹת שָׁל֖וֹשׁ קוֹמָת֑/וֹ וַ/יַּעֲמֹ֣ד עָלָ֗י/ו וַ/יִּבְרַ֤ךְ עַל בִּרְכָּי/ו֙ נֶ֚גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֔ל וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו הַ/שָּׁמָֽיְמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/013.yaml
  text: For Solomon had made a bronze platform and set it in the midst of the court; it was five cubits long[a], five cubits wide, and three cubits high. He stood on it, then knelt on his knees before all the assembly of Israel and spread out his hands toward heaven.
translation:
  language: te
  text: ఎందుకంటే సొలొమోను కంచుతో ఒక వేదికను[a] చేసి ప్రాంగణం మధ్యలో ఉంచాడు; అది ఐదు మూరల పొడవు, ఐదు మూరల వెడల్పు, మూడు మూరల ఎత్తు కలిగినది. అతడు దాని మీద నిలబడి, ఇశ్రాయేలు సమాజమంతటి సమక్షంలో తన మోకాళ్లపై మోకరించి, ఆకాశం వైపు తన చేతులు చాపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం సాధారణంగా ‘తొట్టి’ లేదా ‘కడుగుకొనే పాత్ర’ అని అర్థం. అయితే ఇక్కడ సొలొమోను దాని మీద నిలబడినట్లు ఉండడం, దాని కొలతలు ఇవ్వడం వల్ల, సందర్భానుసారంగా ఇది ఎత్తైన కంచు వేదికను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే అనే పదాన్ని విడిగా అనువదించకుండా నేపథ్య వివరణగా సహజ వాక్యారంభం
  rationale: ఈ అవ్యయం ముందున్న సందర్భాన్ని వివరించే భావాన్ని ఇస్తుంది. తెలుగు వచనంలో విడిగా ‘ఎందుకంటే’ అని పెట్టడం కంటే నేరుగా వివరణ మొదలుపెట్టడం సహజంగా ఉంటుంది.
- source_word: כִּיּוֹר נְחֹשֶׁת
  choice: కంచుతో ఒక వేదికను[a]
  rationale: כִּיּוֹר సాధారణంగా తొట్టి లేదా కడుగు పాత్రను సూచించినా, ఇక్కడ కొలతలు ఇవ్వడం, సొలొమోను దాని మీద నిలబడడం వల్ల ఎత్తైన వేదిక భావం సందర్భానికి సరిపోతుంది. అసాధారణ పదప్రయోగాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְּתוֹךְ הָעֲזָרָה
  choice: ప్రాంగణం మధ్యలో
  rationale: ఆలయ ఆవరణను సూచించే עֲזָרָהకు ‘ప్రాంగణం’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది; בְּתוֹךְ యొక్క మధ్యస్థాన భావమూ నిలుస్తుంది.
- source_word: חָמֵשׁ אַמּוֹת ... וְאַמּוֹת שָׁלֹשׁ
  choice: ఐదు మూరల పొడవు, ఐదు మూరల వెడల్పు, మూడు మూరల ఎత్తు
  rationale: అమ్మా అనే ప్రాచీన కొలతకు తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘మూర’ను ఉపయోగించి, మూడు కొలతలనూ సహజ క్రమంలో నిలిపాం.
- source_word: וַיַּעֲמֹד עָלָיו
  choice: అతడు దాని మీద నిలబడి
  rationale: క్రమంగా జరిగే చర్యను తెలుగులో సహజమైన అసమాపక క్రియతో తెలిపాం.
- source_word: וַיִּבְרַךְ עַל בִּרְכָּיו
  choice: మోకాళ్లూని
  rationale: ఈ సందర్భంలో ברך అంటే ఆశీర్వదించడం కాదు, మోకరించడం. ‘మోకాళ్లూని’ శరీర భంగిమను సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సమాజమంతటి ఎదుట
  rationale: קָהָל యొక్క బహిరంగ ఆరాధనా సమూహ భావాన్ని ‘సమాజం’ అందిస్తుంది; כָּל భావాన్ని ‘మంతటి’ ద్వారా నిలిపాం.
- source_word: וַיִּפְרֹשׂ כַּפָּיו הַשָּׁמָיְמָה
  choice: ఆకాశం వైపు తన చేతులు చాపాడు
  rationale: ప్రార్థనా భంగిమను సహజ తెలుగులో తెలిపి, దిశాసూచక రూపంలోని ‘ఆకాశం వైపు’ భావాన్ని కాపాడాం.
theological_decisions:
- issue: ఈ సందర్భంలో כִּיּוֹר అర్థం
  choice: వేదిక
  alternative: కంచు తొట్టి / కంచు పీఠం
  rationale: సొలొమోను దాని మీద నిలబడినట్లు వచనం చెప్పడం, దాని పొడవు-వెడల్పు-ఎత్తు ఇవ్వడం వల్ల ‘వేదిక’ సందర్భోచితంగా ఉంది. అయితే మూలపదం సాధారణ అర్థాన్ని దాచకుండా పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘మూర’, ‘మోకాళ్లూని’ వంటి సాధారణ బైబిలు పదాలను స్పష్టత కోసం నిలిపాం; మూలంలోని అసాధారణ כִּיּוֹר పదప్రయోగాన్ని పాదసూచికతో సంరక్షించాం.
