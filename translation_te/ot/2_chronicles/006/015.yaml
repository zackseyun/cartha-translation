revisions:
- from: నీవు నీ సేవకుడైన నా తండ్రి దావీదుతో చెప్పినదాన్ని అతనికోసం నెరవేర్చావు[a]. నీ నోటితో పలికావు; నీ చేతితో దాన్ని నెరవేర్చావు[b]—ఈ రోజు ఉన్నట్లుగానే.
  to: నీ సేవకుడైన నా తండ్రి దావీదుకు నీవు చెప్పినదాన్ని నెరవేర్చావు[a]. నీ నోటితో పలికావు, నీ చేతితో దాన్ని నెరవేర్చావు[b]—ఈ రోజున ఉన్నట్లుగా.
  rationale: దావీదుతో/అతనితో అనే సహచర్యార్థక రూపాలను మూలంలోని దత్తివాచకమైన “దావీదుకు/అతనికి”గా సరిచేశాం. చివరి హీబ్రూ నుడికారాన్ని అర్థం మార్చకుండా తెలుగులో మరింత సహజంగా చేశాం. వాక్కు–కార్యం అనే సమాంతరాన్ని, అలాగే దేవుని నోరు మరియు చేయి అనే పదచిత్రాలను నిలిపాం.
