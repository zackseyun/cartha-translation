  variant: modern standard Telugu
source:
  edition: WLC
  text: אֲשֶׁ֣ר שָׁמַ֗רְתָּ לְ/עַבְדְּ/ךָ֙ דָּוִ֣יד אָבִ֔/י אֵ֥ת אֲשֶׁר דִּבַּ֖רְתָּ ל֑/וֹ וַ/תְּדַבֵּ֥ר בְּ/פִ֛י/ךָ וּ/בְ/יָדְ/ךָ֥ מִלֵּ֖אתָ כַּ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/015.yaml
  text: You have kept for your servant David my father what you spoke to him[a]; with your mouth you have spoken, and with your hand you have fulfilled it[b], as it is this day.
translation:
  language: te
  text: నీ సేవకుడైన నా తండ్రి దావీదుకు నీవు చెప్పినదాన్ని నెరవేర్చావు[a]. నీ నోటితో పలికావు, నీ చేతితో దాన్ని నెరవేర్చావు[b]—ఈ రోజున ఉన్నట్లుగా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీవు అతనికి వాగ్దానం చేసినదాన్ని.’ హీబ్రూలో అక్షరార్థంగా ‘నీవు అతనికి చెప్పినదాన్ని’ అని ఉంది; అది వాగ్దానమనే భావం నెరవేర్పు సందర్భం వల్ల తెలుస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నీ నోటితో ... నీ చేతితో.’ దేవుడు పలికిన మాటను తన కార్యం ద్వారా నెరవేర్చడాన్ని చూపే హీబ్రూ వ్యక్తీకరణ ఇది.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַרְתָּ
  choice: నెరవేర్చావు
  rationale: వాగ్దానం నెరవేరిన సందర్భంలో שׁמרకు ‘కాపాడావు’ అనే అక్షరార్థం కన్నా ‘నమ్మకంగా నెరవేర్చావు’ అనే భావం సహజంగా సరిపోతుంది.
- source_word: לְעַבְדְּךָ דָּוִיד אָבִי
  choice: నీ సేవకుడైన నా తండ్రి దావీదు
  rationale: రాజప్రార్థన సందర్భంలో עבדను గౌరవప్రదంగా ‘సేవకుడు’ అని అనువదించి, తెలుగు సహజ పదక్రమంలో బంధాన్ని స్పష్టంచేశాం.
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: అతనితో చెప్పినదాన్ని
  rationale: మూలంలోని ‘అతనితో/అతనికి పలికినది’ అనే నిర్మాణాన్ని నిలుపుతూ, వాగ్దాన భావాన్ని ప్రధాన పాఠ్యంలో అదనంగా చేర్చలేదు.
- source_word: וַתְּדַבֵּר בְּפִיךָ
  choice: నీ నోటితో పలికావు
  rationale: దేవుని పలుకును కార్యంతో జతచేసే స్పష్టమైన రూపక సమాంతరాన్ని కాపాడుతుంది.
- source_word: וּבְיָדְךָ מִלֵּאתָ
  choice: నీ చేతితో దాన్ని నెరవేర్చావు
  rationale: מלא ఇక్కడ పూర్తి చేయడం లేదా నెరవేర్చడం అనే భావంలో ఉంది; ‘నీ చేతితో’ అనేది కార్యసాధనను సూచించే హీబ్రూ రూపకాన్ని నిలుపుతుంది.
- source_word: כַּיּוֹם הַזֶּה
  choice: ఈ రోజు ఉన్నట్లుగానే
  rationale: ప్రస్తుత దినాన కనబడుతున్న నెరవేర్పును సూచించే హీబ్రూ నుడికారానికి దగ్గరగా, తెలుగులో అర్థమయ్యే రూపం.
theological_decisions:
- issue: దేవుని ‘నోరు’, ‘చేయి’ అనే మానవరూప వర్ణన
  choice: ‘నీ నోటితో’, ‘నీ చేతితో’ అనే పదచిత్రాలను యథాతథంగా ఉంచడం
  alternative: ‘నీవు పలికి, దాన్ని కార్యరూపంలోకి తెచ్చావు’ అని భావానువాదం చేయడం
  rationale: వాక్కు మరియు కార్యం మధ్య ఉద్దేశపూర్వక సమాంతరాన్ని మూలపాఠ్యం బలంగా చూపుతుంది. శరీరసంబంధ సిద్ధాంతాన్ని అదనంగా ప్రతిపాదించకుండా ఆ అలంకారాన్ని నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలిని వాడాం. మూలంలోని వాక్కు–కార్యం సమాంతరాన్ని నిలుపుతూ, వాగ్దాన భావాన్ని పాదటిప్పణిలో వివరించాం.
