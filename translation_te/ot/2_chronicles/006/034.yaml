source:
  edition: WLC
  text: כִּֽי יֵצֵ֨א עַמְּ/ךָ֤ לַ/מִּלְחָמָה֙ עַל א֣וֹיְבָ֔י/ו בַּ/דֶּ֖רֶךְ אֲשֶׁ֣ר תִּשְׁלָחֵ֑/ם וְ/הִתְפַּֽלְל֣וּ אֵלֶ֗י/ךָ דֶּ֣רֶךְ הָ/עִ֤יר הַ/זֹּאת֙ אֲשֶׁ֣ר בָּחַ֣רְתָּ בָּ֔/הּ וְ/הַ/בַּ֖יִת אֲשֶׁר בָּנִ֥יתִי לִ/שְׁמֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/034.yaml
  text: If your people go out to battle against their enemies by the way that you send them[a], and they pray to you toward this city that you have chosen and the house that I have built for your name[b],
translation:
  language: te
  text: నీ ప్రజలు తమ శత్రువులకు వ్యతిరేకంగా యుద్ధానికి, నీవు వారిని పంపే మార్గంలో బయలుదేరి, నీవు ఎన్నుకున్న ఈ పట్టణం వైపుగా[a], నీ నామం కొరకు నేను కట్టిన మందిరం వైపుగా[b] నీకు ప్రార్థిస్తే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ పట్టణం వైపు తిరిగి.” హీబ్రూలో ప్రార్థనలో యెరూషలేము దిశగా ఉండడాన్ని సూచించే ‘దిశ/మార్గం’ పదం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘మందిరం’ అనేది సొలొమోను యెహోవా నామం కొరకు కట్టిన ఆలయాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: ప్రార్థిస్తే
  rationale: ఈ ప్రార్థనలో ఒక షరతుతో కూడిన సందర్భాన్ని పరిచయం చేస్తుంది. తెలుగులో వాక్యాంతంలోని ‘-తే’ రూపం ఆ షరతును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יֵצֵא עַמְּךָ לַמִּלְחָמָה
  choice: నీ ప్రజలు ... యుద్ధం చేయడానికి ... బయలుదేరి
  rationale: సైనిక సందర్భంలోని ‘యుద్ధానికి బయలుదేరు’ అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా, మూలంలోని ‘బయటికి వెళ్లడం’ భావాన్ని నిలుపుతూ అందిస్తుంది.
- source_word: עַל אֹיְבָיו
  choice: తమ శత్రువులతో
  rationale: עַל ఇక్కడ ప్రతికూల సైనిక సంబంధాన్ని సూచిస్తుంది. సామూహిక ఏకవచనమైన ‘ప్రజలు’ను తెలుగులో సహజమైన బహువచన భావంతో ‘తమ’గా ఇచ్చాం.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תִּשְׁלָחֵם
  choice: నీవు వారిని పంపే మార్గంలో
  rationale: దేవుడు పంపడం మరియు వారు అనుసరించే మార్గం అనే రెండు భావాలనూ నేరుగా నిలుపుతుంది.
- source_word: וְהִתְפַּלְלוּ אֵלֶיךָ
  choice: నీకు ప్రార్థిస్తే
  rationale: אֶל తో కూడిన ప్రార్థనా క్రియ దేవునికి ఉద్దేశించిన ప్రార్థనను సూచిస్తుంది; తెలుగు షరతు నిర్మాణానికి అనుగుణంగా ‘ప్రార్థిస్తే’గా ఇచ్చాం.
- source_word: דֶּרֶךְ הָעִיר הַזֹּאת
  choice: ఈ పట్టణం వైపుగా
  rationale: ప్రార్థన సమయంలో యెరూషలేము దిశగా తిరగడాన్ని సూచించే స్పష్టమైన దిశాభావాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר בָּחַרְתָּ בָּהּ
  choice: నీవు ఎన్నుకున్న
  rationale: దేవుడు ఆ పట్టణాన్ని ఎంపిక చేసిన కార్యాన్ని సరళంగా, ప్రత్యక్షంగా తెలియజేస్తుంది.
- source_word: וְהַבַּיִת
  choice: ఈ మందిరం
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా, సందర్భంలో సొలొమోను కట్టించిన యెహోవా మందిరాన్నే సూచిస్తుంది. ‘మందిరం’ సాధారణ తెలుగు పాఠకునికి స్పష్టంగా ఉంటుంది; ‘ఈ’ సందర్భంలో సమీపంగా సూచించబడుతున్న నిర్మాణాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר בָּנִיתִי לִשְׁמֶךָ
  choice: నీ నామం కోసం నేను కట్టించిన
  rationale: సొలొమోను రాజుగా మందిరాన్ని నిర్మింపజేసిన భావాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, దేవుని నామం కోసం అంకితం చేయబడినదనే మూలభావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: యెరూషలేము మరియు మందిరం వైపు తిరిగి ప్రార్థించడం
  choice: ‘ఈ పట్టణం వైపుగా ... ఈ మందిరం వైపుగా’ అనే నిర్దిష్ట దిశాభాషను నిలిపాం.
  alternative: ‘ఈ పట్టణాన్ని, మందిరాన్ని జ్ఞాపకం చేసుకుంటూ’ వంటి అమూర్త వ్యాఖ్యానం.
  rationale: మూల హీబ్రూ ప్రార్థనలో భౌతిక దిశను స్పష్టంగా సూచిస్తుంది. దానిని ఆధ్యాత్మికీకరించకుండా సొలొమోను మందిర ప్రార్థనలోని చారిత్రక-వేదాంత సందర్భాన్ని నిలుపుతుంది.
- issue: בַּיִת అనే పదం అనువాదం
  choice: మందిరం
  alternative: ఇల్లు
  rationale: అక్షరార్థమైన ‘ఇల్లు’కు వేదాంత ప్రతిధ్వని ఉన్నప్పటికీ, ఈ సందర్భంలో సూచించబడేది సొలొమోను నిర్మించిన దేవాలయమే. సాధారణ ఆధునిక తెలుగు పాఠకునికి అసందిగ్ధంగా ఉండేందుకు ‘మందిరం’ను ఎంచుకున్నాం; పాదటిప్పణిలో సందర్భాన్ని వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. అయితే అందించిన పాదటిప్పణులన్నిటికీ ప్రధాన పాఠ్యంలో గుర్తు ఉండాలనే నియమం ప్రకారం [b] గుర్తు ‘మందిరం’ తరువాత ఉండాలి.
