  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁ֠מֹר לְ/עַבְדְּ/ךָ֨ דָוִ֤יד אָבִ/י֙ אֵת֩ אֲשֶׁ֨ר דִּבַּ֤רְתָּ לּ/וֹ֙ לֵ/אמֹ֔ר לֹא יִכָּרֵ֨ת לְ/ךָ֥ אִישׁ֙ מִ/לְּ/פָנַ֔/י יוֹשֵׁ֖ב עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל רַ֠ק אִם יִשְׁמְר֨וּ בָנֶ֜י/ךָ אֶת דַּרְכָּ֗/ם לָ/לֶ֨כֶת֙ בְּ/ת֣וֹרָתִ֔/י כַּ/אֲשֶׁ֥ר הָלַ֖כְתָּ לְ/פָנָֽ/י׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/016.yaml
  text: And now, LORD, God of Israel, keep for your servant David my father what you spoke to him, saying, ‘A man to sit on the throne of Israel before me shall not be cut off from you, if only your sons keep their way by walking in my law, as you have walked before me.’
translation:
  language: te
  text: 'ఇప్పుడు ఇశ్రాయేలు దేవుడైన యెహోవా, నీ సేవకుడూ నా తండ్రీ అయిన దావీదుతో నీవు చెప్పిన మాటను నిలబెట్టు. నీవు అతనితో ఇలా అన్నావు: ‘నీ కుమారులు నీవు నా సన్నిధిలో నడిచినట్లే నా ధర్మశాస్త్రం ప్రకారం నడుచుకుంటూ తమ మార్గాన్ని జాగ్రత్తగా కాపాడుకుంటే, ఇశ్రాయేలు సింహాసనం మీద నా సన్నిధిలో కూర్చునే ఒక వ్యక్తి నీ వంశంలో లేకుండా పోడు.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמֹר
  choice: నిలబెట్టు
  rationale: ఈ సందర్భంలో దేవుడు దావీదుకు చేసిన వాగ్దానాన్ని నెరవేర్చాలని కోరే భావం; తెలుగులో సహజంగా ‘మాటను నిలబెట్టు’ అని వ్యక్తమవుతుంది.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  choice: పురుషుడు ... నీకు లేకుండా పోడు
  rationale: ‘నీకు ఒక పురుషుడు తెగిపోడు’ అనే హీబ్రూ నుడికారాన్ని పూర్తిగా స్వేచ్ఛానువాదం చేయకుండా, వంశపారంపర్య కొనసాగింపు భావాన్ని సహజ తెలుగులో నిలిపింది.
- source_word: מִלְּפָנַי
  choice: నా సన్నిధిలో
  rationale: దేవుని సమక్షం/ఆమోదం అనే భావాన్ని కాపాడే సాంప్రదాయబద్ధమైనప్పటికీ సులభంగా అర్థమయ్యే రూపం.
- source_word: יִשְׁמְרוּ ... אֶת דַּרְכָּם
  choice: తమ మార్గాన్ని జాగ్రత్తగా కాపాడుకుంటే
  rationale: שׁמר యొక్క జాగ్రత్తగా పాటించడం అనే భావాన్ని, ‘మార్గం’ అనే మూల రూపకాన్ని రెండింటినీ నిలిపింది.
- source_word: בְּתוֹרָתִי
  choice: నా ధర్మశాస్త్రం ప్రకారం
  rationale: תורה ఇక్కడ దేవుని ధర్మశాస్త్రం/ఉపదేశాన్ని సూచిస్తుంది; నడవడానికి ప్రమాణం అనే భావాన్ని ‘ప్రకారం’ స్పష్టం చేస్తుంది.
theological_decisions:
- issue: దావీదు వంశానికి ఇచ్చిన వాగ్దానంలోని షరతు
  choice: ‘నీ కుమారులు ... కాపాడుకుంటే’ అని షరతును స్పష్టంగా ఉంచడం
  alternative: వాగ్దానాన్ని షరతులేనిదిగా వినిపించేలా వాక్యాన్ని సడలించడం
  rationale: మూలంలోని רַק אִם (‘అయితే/కేవలం వారు ... చేస్తే’) వంశస్థుల విధేయతను నిజమైన షరతుగా ఉంచుతుంది; దానిని సిద్ధాంతపరంగా తగ్గించకూడదు.
- issue: ‘నా సన్నిధిలో’ పదబంధం దేనితో అనుసంధానమవుతుంది
  choice: సింహాసనం మీద కూర్చునే వ్యక్తి దేవుని సన్నిధిలో కొనసాగుతాడనే నిర్మాణాన్ని నిలిపివేయడం
  alternative: ‘నా సన్నిధిలో’ను ‘లేకుండా పోడు’తో మాత్రమే అనుసంధానించి మరింత స్వేచ్ఛగా అనువదించడం
  rationale: హీబ్రూ పదక్రమంలోని భావాన్ని సహజ తెలుగులో సాధ్యమైనంతవరకు కాపాడుతూ, వాక్యంలోని దేవుని సమక్ష భావాన్ని తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవప్రదమైన శైలి. ‘యెహోవా’, ‘ధర్మశాస్త్రం’, ‘నా సన్నిధిలో’ వంటి స్థిర బైబిలు పదజాలాన్ని సాధారణ పాఠకుడికి అర్థమయ్యే వాక్యనిర్మాణంతో ఉపయోగించాం.
