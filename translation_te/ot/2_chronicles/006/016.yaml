revisions:
- from: 'ఇప్పుడు ఇశ్రాయేలు దేవుడైన యెహోవా, నీ సేవకుడూ నా తండ్రీ అయిన దావీదుతో నీవు చెప్పిన మాటను నిలబెట్టు. నీవు అతనితో ఇలా అన్నావు: ‘నీ కుమారులు నీవు నా సన్నిధిలో నడిచినట్లే నా ధర్మశాస్త్రం ప్రకారం నడుచుకుంటూ తమ మార్గాన్ని జాగ్రత్తగా కాపాడుకుంటే, ఇశ్రాయేలు సింహాసనం మీద కూర్చునే పురుషుడు నా సన్నిధిలో నీకు లేకుండా పోడు.’'
  to: 'ఇప్పుడు ఇశ్రాయేలు దేవుడైన యెహోవా, నీ సేవకుడూ నా తండ్రీ అయిన దావీదుతో నీవు చెప్పిన మాటను నిలబెట్టు. నీవు అతనితో ఇలా అన్నావు: ‘నీ కుమారులు నీవు నా సన్నిధిలో నడిచినట్లే నా ధర్మశాస్త్రం ప్రకారం నడుచుకుంటూ తమ మార్గాన్ని జాగ్రత్తగా కాపాడుకుంటే, ఇశ్రాయేలు సింహాసనం మీద నా సన్నిధిలో కూర్చునే ఒక వ్యక్తి నీ వంశంలో లేకుండా పోడు.’'
  rationale: వాగ్దానంలోని షరతు, దేవుని సన్నిధి, ధర్మశాస్త్రంలో నడవడం అనే భావాలను మార్చకుండా, దావీదు వంశానికి రాజవారసుడు కొనసాగుతాడనే హీబ్రూ నుడికారాన్ని ఆధునిక తెలుగులో స్పష్టంగా చేశాం.
