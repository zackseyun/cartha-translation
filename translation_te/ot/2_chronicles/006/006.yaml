id: 2CH.6.6
reference: 2 Chronicles 6:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֶבְחַר֙ בִּ/יר֣וּשָׁלִַ֔ם לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וָ/אֶבְחַ֣ר בְּ/דָוִ֔יד לִ/הְי֖וֹת עַל עַמִּ֥/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/006.yaml
  text: But I have chosen Jerusalem for my name to be there[a], and I have chosen David to be over my people Israel.
translation:
  language: te
  text: అయితే నా నామం అక్కడ ఉండేందుకు యెరూషలేమును ఎన్నుకున్నాను[a]; నా ప్రజలైన ఇశ్రాయేలుపై అధికారముండేందుకు దావీదును ఎన్నుకున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ క్రియారూపాలను సాధారణ గతకాలంగా, ‘నేను ఎన్నుకున్నాను’ అని కూడా అనువదించవచ్చు. ఇక్కడ ఉపయోగించిన తెలుగు రూపం ఆ ఎంపిక స్థిరపరచబడినదనీ, సందర్భంలో దానికి కొనసాగుతున్న ప్రాముఖ్యత ఉందనీ సూచించగలదు.
    reason: హెబ్రీ వయ్యిక్టోల్ రూపాల సాధారణ గతకాల అనువాద అవకాశాన్ని, సందర్భంలో దేవుని స్థిరపరచిన ఎంపికకు ఉన్న కొనసాగుతున్న ప్రాముఖ్యతను స్పష్టం చేయడం.
lexical_decisions:
- source_word: וָאֶבְחַר
  choice: ఎన్నుకున్నాను
  rationale: בחר అంటే ఎన్నుకోవడం. సందర్భంలో దేవుడు గతంలో చేసిన, ఇప్పటికీ అమలులో ఉన్న నిర్ణయాన్ని సహజమైన ఆధునిక తెలుగులో ఈ రూపం తెలియజేస్తుంది.
- source_word: בִּירוּשָׁלִַם
  choice: యెరూషలేమును
  rationale: స్థల నామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపంలో ఇచ్చి, ఎన్నుకోవడం అనే క్రియకు కర్మగా విభక్తి చేర్చబడింది.
- source_word: לִהְיוֹת
  choice: ఉండేందుకు
  rationale: היה ధాతువు యొక్క ఈ క్రియారూపం ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో ‘ఉండేందుకు’ సహజంగా, మూలానికి దగ్గరగా ఉంటుంది.
- source_word: שְׁמִי
  choice: నా నామం
  rationale: మూలంలోని ‘నా పేరు/నామం’ అనే ఆలయ సంబంధిత ముఖ్యమైన ప్రయోగాన్ని వివరణాత్మకంగా మార్చకుండా నిలిపింది; ఈ గంభీర సందర్భంలో ‘నామం’ తగినది.
- source_word: שָׁם
  choice: అక్కడ
  rationale: స్థలాన్ని నొక్కిచెప్పే మూలంలోని అవ్యయాన్ని స్పష్టంగా నిలిపింది.
- source_word: בְּדָוִיד
  choice: దావీదును
  rationale: בחר తరువాత ב ఎన్నుకోబడిన వ్యక్తిని సూచిస్తుంది. తెలుగులో సహజంగా కర్మ విభక్తితో అనువదించబడింది.
- source_word: עַל
  choice: పై అధిపతిగా
  rationale: עַל ఇక్కడ ప్రజలపై అధికార స్థానాన్ని సూచిస్తుంది. కేవలం ‘పై ఉండేందుకు’ అనడం తెలుగులో అసహజం కాబట్టి, రాజు అనే నిర్దిష్ట పదాన్ని చేర్చకుండా ‘అధిపతిగా’ అని భావాన్ని సహజంగా వ్యక్తం చేసింది.
- source_word: עַמִּי יִשְׂרָאֵל
  choice: నా ప్రజలైన ఇశ్రాయేలు
  rationale: ఒడంబడిక సంబంధాన్ని తెలిపే ‘నా ప్రజలు’ అనే మాటను నిలిపి, ఇశ్రాయేలు వారే ఆ ప్రజలు అని తెలుగులో స్పష్టమైన అన్వయంతో తెలిపింది.
- source_word: וְ
  choice: అయితే
  rationale: ముందటి వాక్యంలోని ‘ఎన్నుకోలేదు’ అనే నిరాకరణకు ఇక్కడి సానుకూల ఎంపిక వ్యతిరేకంగా నిలుస్తుంది; అందువల్ల సాధారణ ‘మరియు’ కంటే ‘అయితే’ సందర్భ సంబంధాన్ని బాగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘నా నామం అక్కడ ఉండేందుకు’ అనే ఆలయ సంబంధిత ప్రయోగం
  choice: దేవుని ‘నామం’ అక్కడ ఉండడం అనే మూలభాషా ప్రయోగాన్ని యథాతథ భావంతో నిలపడం
  alternative: ‘నా సన్నిధి అక్కడ ఉండేందుకు’ లేదా ‘అక్కడ నన్ను ఆరాధించేందుకు’
  rationale: మూలపాఠం దేవుని సన్నిధి లేదా ఆరాధన అని నేరుగా చెప్పకుండా ఆయన ‘నామం’ గురించి చెబుతుంది. దానిని నిలపడం వల్ల ఆలయ వేదాంతంలోని భావగాంభీర్యం, అంతర్లీన ఉద్వేగం చెదరకుండా ఉంటాయి.
- issue: ఇశ్రాయేలుపై దావీదు స్థానం
  choice: ‘అధిపతిగా’ అని సాధారణ అధికార భావాన్ని తెలియజేయడం
  alternative: ‘రాజుగా’ లేదా ‘పాలించేందుకు’
  rationale: సందర్భం రాజత్వాన్ని సూచించినా, ఈ వాక్యంలో హెబ్రీ నేరుగా ‘రాజు’ అని చెప్పదు. కాబట్టి రాజత్వాన్ని స్పష్టంగా చేర్చకుండా, עַל తెలిపే అధికార సంబంధాన్ని మాత్రమే సహజమైన తెలుగులో వ్యక్తం చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. బైబిలు పాఠకులకు పరిచితమైన ‘నామం,’ ‘యెరూషలేము,’ ‘దావీదు,’ ‘ఇశ్రాయేలు’ రూపాలు నిలిపి, అతి ప్రాచీన వాక్యనిర్మాణాన్ని నివారించాం.
