revisions:
- from: అయితే నా నామం అక్కడ ఉండేందుకు యెరూషలేమును ఎన్నుకున్నాను[a]; నా ప్రజలైన ఇశ్రాయేలుపై అధిపతిగా ఉండేందుకు దావీదును ఎన్నుకున్నాను.
  to: అయితే నా నామం అక్కడ ఉండేందుకు యెరూషలేమును ఎన్నుకున్నాను[a]; నా ప్రజలైన ఇశ్రాయేలుపై అధికారముండేందుకు దావీదును ఎన్నుకున్నాను.
  rationale: The revision retains the Hebrew temple idiom ‘my name ... there’ without paraphrase. It changes only the rendering of David's relation to Israel, replacing the office-like ‘అధిపతిగా’ with a general expression of authority that does not add ‘king’ or another formal role. The footnote is rewritten so that its tense explanation is meaningful in Telugu.
