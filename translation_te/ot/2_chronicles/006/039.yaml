source:
  edition: WLC
  text: וְ/שָׁמַעְתָּ֨ מִן הַ/שָּׁמַ֜יִם מִ/מְּכ֣וֹן שִׁבְתְּ/ךָ֗ אֶת תְּפִלָּתָ/ם֙ וְ/אֶת תְּחִנֹּ֣תֵי/הֶ֔ם וְ/עָשִׂ֖יתָ מִשְׁפָּטָ֑/ם וְ/סָלַחְתָּ֥ לְ/עַמְּ/ךָ֖ אֲשֶׁ֥ר חָֽטְאוּ לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/039.yaml
  text: then hear from heaven[a], from the place where you dwell, their prayer and their pleas, and maintain their cause, and forgive your people who have sinned against you.
translation:
  language: te
  text: అప్పుడు నీవు ఆకాశం నుండి, నీ నివాసస్థలం నుండి, వారి ప్రార్థనను, వారి విన్నపాలను విని, వారి పక్షంగా న్యాయం చేసి[a], నీకు విరోధంగా పాపం చేసిన నీ ప్రజలను క్షమించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారికి న్యాయం చేయి,’ లేదా ‘వారి వ్యవహారాన్ని తీర్చు.’ హీబ్రూ పదబంధానికి అక్షరార్థం ‘వారి న్యాయం/న్యాయవ్యవహారాన్ని చేయి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: అప్పుడు ... విని
  rationale: ముందటి షరతులతో అనుసంధానమైన ప్రార్థనా సందర్భంలో ఈ సంపూర్ణ క్రియ దేవునికి చేసిన విన్నపంగా పనిచేస్తుంది; ‘అప్పుడు’ ఆ సందర్భానుసంధానాన్ని తెలియజేస్తుంది.
- source_word: מִן הַשָּׁמַיִם
  choice: ఆకాశం నుండి
  rationale: హీబ్రూలో రూపరీత్యా బహువచనమైనా, దేవుడు వినే పరలోక స్థానాన్ని తెలుగులో సహజంగా ‘ఆకాశం’ అని వ్యక్తపరుస్తుంది.
- source_word: מִמְּכוֹן שִׁבְתְּךָ
  choice: నీ నివాసస్థలం నుండి
  rationale: מָכוֹן స్థిరమైన స్థలాన్ని, שׁבת నివాసాన్ని సూచిస్తాయి; ఈ రూపం సంక్షిప్తంగా మూలంలోని స్థానార్థాన్ని నిలుపుతుంది.
- source_word: תְּפִלָּתָם
  choice: వారి ప్రార్థనను
  rationale: ఏకవచన సమూహార్థాన్ని నిలుపుతూ תְּפִלָּהకు ప్రామాణికమైన తెలుగు సమానం.
- source_word: תְּחִנֹּתֵיהֶם
  choice: వారి విన్నపాలను
  rationale: కరుణ కోరే ఆర్తమైన అభ్యర్థనల భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: వారి పక్షంగా న్యాయం జరిగించి
  rationale: అక్షరార్థంగా ‘వారి తీర్పు/వ్యవహారం చేయి’; సందర్భంలో వారి వ్యవహారాన్ని న్యాయంగా పరిష్కరించి వారి పక్షంగా చర్య తీసుకోవాలని సూచించే న్యాయపరమైన నుడికారాన్ని ఇది స్పష్టంగా ఉంచుతుంది.
- source_word: וְסָלַחְתָּ
  choice: క్షమించు
  rationale: దేవుని పాపక్షమాపణ సందర్భంలో סלחకు సహజమైన, ప్రామాణికమైన తెలుగు సమానం.
- source_word: לְעַמְּךָ
  choice: నీ ప్రజలను
  rationale: తెలుగు వాక్యనిర్మాణంలో ‘క్షమించు’ క్రియతో కర్మను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֲשֶׁר חָטְאוּ לָךְ
  choice: నీకు విరోధంగా పాపం చేసిన
  rationale: חטאతో לְ ఇక్కడ దేవునికి వ్యతిరేకంగా చేసిన అపరాధాన్ని సూచిస్తుంది; ‘నీకు విరోధంగా’ ఆ దిశార్థాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: וְעָשִׂיתָ מִשְׁפָּטָם లోని న్యాయపరమైన భాష
  choice: వారి పక్షంగా న్యాయం జరిగించి
  alternative: వారి వ్యాజ్యాన్ని నడిపించు; వారికి న్యాయం చేయి; వారి తీర్పును అమలు చేయి
  rationale: ప్రార్థన వినడం, వారి న్యాయవ్యవహారంలో చర్య తీసుకోవడం, పాపాన్ని క్షమించడం అనే మూడు భావాల మధ్య ఉన్న ఉద్రిక్తతను నిలుపుతుంది. ఇది వారిని నిర్దోషులని ముందుగానే తేల్చకుండా, దేవుడు వారి వ్యవహారాన్ని న్యాయంగా పరిష్కరించాలని చేసే విన్నపంగా చదవనిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ప్రార్థనకు తగిన గౌరవప్రదమైన ఏకవచన సంబోధన వాడబడింది. మూలంలోని ‘ప్రార్థన’ ఏకవచనం, ‘విన్నపాలు’ బహువచనం నిలుపబడ్డాయి; న్యాయపరమైన నుడికారంలోని భావవిస్తృతిని పాదసూచికలో భద్రపరిచాం.
