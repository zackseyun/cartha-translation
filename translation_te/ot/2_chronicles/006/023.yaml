review_pass:
  verdict: revise
  source_fidelity: The draft broadly conveys the judicial petition and correctly retains the Hebrew image of the wicked person's conduct returning on his own head. However, its separate ‘వాడికి ప్రతిఫలం ఇవ్వు’ both weakens the specific Hebrew construction and makes the sequence somewhat redundant. The revised wording keeps the two judicial outcomes coordinated under God’s judging action.
  naturalness: The short, disconnected sentences obscure the Hebrew’s single coordinated petition. ‘చర్య తీసుకో’ is understandable but somewhat bureaucratic in this prayer register; it is retained in a smoother coordinated sentence. Replacing colloquial ‘వాడి/వాడికి’ with ‘అతని’ better fits modern standard Telugu and the solemn register.
  terminology: ‘నీతిమంతుణ్ణి న్యాయవంతుడని తీర్చి’ is understandable, but ‘న్యాయవంతుడు’ can suggest a person who acts fairly rather than the forensic finding expressed by הִצְדִּיק. ‘నీతిమంతుణ్ణి సరైనవాడని తీర్చి’ more naturally expresses declaring him to be in the right, without importing later doctrinal senses.
  issues:
  - severity: medium
    issue: The sentence is divided into separate imperatives, and the wicked-person clause adds ‘వాడికి ప్రతిఫలం ఇవ్వు’ after the head idiom.
    rationale: The Hebrew forms one coordinated judicial plea. The return of the wicked person’s ‘way’ upon his head is itself the stated requital, so the added phrase is redundant and slightly dilutes the concrete source expression.
  - severity: low
    issue: ‘వాడి/వాడికి’ is too colloquial for the surrounding prayer register.
    rationale: ‘అతని’ maintains the third-person singular reference while better matching modern standard formal Telugu.
  - severity: medium
    issue: ‘న్యాయవంతుడని తీర్చి’ is less precise for the forensic force of הִצְדִּיק.
    rationale: The verb means to declare or treat the righteous person as being in the right. ‘సరైనవాడని తీర్చి’ conveys that legal finding more idiomatically.
  revised_text: అప్పుడు నీవు ఆకాశం నుండి విని, చర్య తీసుకుని, నీ సేవకులకు తీర్పు తీర్చు; దుష్టునికి అతని ప్రవర్తనను అతని తలమీదికే రప్పించి[a], నీతిమంతుణ్ణి సరైనవాడని తీర్చి[b], అతని నీతిని బట్టి అతనికి ఇవ్వు.
