  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע מִן הַ/שָּׁמַ֗יִם וְ/עָשִׂ֨יתָ֙ וְ/שָׁפַטְתָּ֣ אֶת עֲבָדֶ֔י/ךָ לְ/הָשִׁ֣יב לְ/רָשָׁ֔ע לָ/תֵ֥ת דַּרְכּ֖/וֹ בְּ/רֹאשׁ֑/וֹ וּ/לְ/הַצְדִּ֣יק צַדִּ֔יק לָ֥/תֶת ל֖/וֹ כְּ/צִדְקָתֽ/וֹ׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/023.yaml
  text: then hear from heaven and act[a], and judge your servants, repaying the wicked by bringing his way upon his own head[b], and vindicating the righteous by giving to him according to his righteousness.
translation:
  language: te
  text: అప్పుడు నీవు ఆకాశం నుండి విని, చర్య తీసుకుని, నీ సేవకులకు తీర్పు తీర్చు; దుష్టునికి అతని ప్రవర్తనను అతని తలమీదికే రప్పించి[a], నీతిమంతుణ్ణి సరైనవాడని తీర్చి[b], అతని నీతిని బట్టి అతనికి ఇవ్వు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘అతని మార్గాన్ని అతని తలమీద ఉంచి.’ ఇది ఒకరి ప్రవర్తన ఫలితాన్ని తీర్పుగా అతనికే తిరిగి రప్పించడాన్ని తెలిపే హీబ్రూ నుడికారం.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘నీతిమంతుని పక్షాన న్యాయం చేసి.’ హీబ్రూ పదం న్యాయస్థాన సంబంధమైనది; ఒక వ్యక్తి సరైనవాడని ప్రకటించడం లేదా అతనితో అలా వ్యవహరించడం అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: విని
  rationale: దేవునికి చేసే ప్రార్థనలో ఈ క్రియ కేవలం శబ్దం వినడమే కాక, శ్రద్ధగా విని స్పందించడాన్ని సూచిస్తుంది; సందర్భంలోని తదుపరి చర్య ఆ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: מִן הַשָּׁמַיִם
  choice: ఆకాశం నుండి
  rationale: హీబ్రూ రూపం బహువచనమైనా, ఈ సందర్భంలో ఆధునిక ప్రామాణిక తెలుగులో ఏకవచన ప్రయోగం సహజంగా మూలార్థాన్ని అందిస్తుంది.
- source_word: וְעָשִׂיתָ
  choice: చర్య తీసుకో
  rationale: మూలక్రియ విస్తృతార్థకమైన ‘చేయు’; న్యాయవిచారణకు సంబంధించిన ఈ ప్రార్థనలో దేవుడు నిర్ణయాత్మకంగా వ్యవహరించాలనే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וְשָׁפַטְתָּ אֶת עֲבָדֶיךָ
  choice: నీ సేవకులకు తీర్పు తీర్చు
  rationale: తర్వాత వచ్చే దుష్టుడు–నీతిమంతుడు అనే సమాంతర వాక్యాలు న్యాయస్థాన సంబంధమైన భావాన్ని నిర్ధారిస్తాయి.
- source_word: לְהָשִׁיב לְרָשָׁע
  choice: దుష్టునికి ప్రతిఫలం ఇవ్వు
  rationale: హీబ్రూ వాక్యనిర్మాణం దుష్టుని ప్రవర్తన ఫలితాన్ని తిరిగి అతనిమీదికి రప్పించే న్యాయపరమైన ప్రతిఫలాన్ని సూచిస్తుంది.
- source_word: לָתֵת דַּרְכּוֹ בְּרֹאשׁוֹ
  choice: దుష్టుని నడవడిని వాడి తలమీదికే రప్పించి
  rationale: ‘మార్గం’ ఇక్కడ ప్రవర్తన లేదా జీవన నడవడిని సూచిస్తుంది. దాని ఫలితం అతనికే తిరిగి వస్తుందనే హీబ్రూ రూపకాన్ని నిలుపుతుంది.
- source_word: וּלְהַצְדִּיק צַדִּיק
  choice: నీతిమంతుణ్ణి న్యాయవంతుడని తీర్చి
  rationale: హిఫిల్ రూపం న్యాయస్థాన సందర్భంలో ఒకడు న్యాయం వైపు ఉన్నాడని ప్రకటించడం లేదా అలా తీర్పు ఇవ్వడం అనే భావం కలిగి ఉంది; తర్వాతి సిద్ధాంతపరమైన భావాలను అనవసరంగా దిగుమతి చేయకుండా న్యాయపరమైన అర్థాన్ని కాపాడుతుంది.
- source_word: לָתֶת לוֹ כְּצִדְקָתוֹ
  choice: అతని నీతిని బట్టి అతనికి ఇవ్వు
  rationale: నీతిమంతుని న్యాయమైన స్థితి లేదా ప్రవర్తనకు అనుగుణంగా ఇవ్వడాన్ని మూలానికి దగ్గరగా వ్యక్తం చేస్తుంది; ‘బహుమానమివ్వు’ అని వ్యాఖ్యానాత్మకంగా విస్తరించదు.
theological_decisions:
- issue: దైవ తీర్పులోని న్యాయస్థాన భావం
  choice: దేవుడు సేవకులకు తీర్పు తీర్చి, దుష్టునికి ప్రతిఫలం ఇచ్చి, నీతిమంతుని న్యాయవంతుడని తీర్చడం
  alternative: సాధారణంగా పరిపాలించడం లేదా జోక్యం చేసుకోవడం
  rationale: שׁפט, הצדיק అనే పదాలతో పాటు దుష్టుడు–నీతిమంతుడు అనే జత వాక్యాలు స్పష్టమైన న్యాయవిచారణ సందర్భాన్ని సూచిస్తాయి.
- issue: הצדיק పదానికి అనువాదం
  choice: నీతిమంతుణ్ణి న్యాయవంతుడని తీర్చి
  alternative: నీతిమంతుణ్ణి సమర్థించి; నీతిమంతుణ్ణి నిర్దోషిగా ప్రకటించి
  rationale: మూలంలో ఒక వ్యక్తి న్యాయం వైపు ఉన్నాడని న్యాయపరంగా తీర్పు ఇవ్వడం ప్రధాన భావం. ‘నిర్దోషి’ అనడం భావాన్ని కొంత సంకుచితం చేయవచ్చు; ‘సమర్థించు’ అనడం న్యాయస్థాన భావాన్ని బలహీనపరచవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ప్రార్థనకు తగిన గంభీరతను ఉంచుతూ, అతిగా ప్రాచీనమైన క్రియారూపాలను నివారించాం. దేవునికి ప్రత్యక్ష సంబోధన కావడంతో ఏకవచన గౌరవభరిత ఆజ్ఞార్థక రూపాలను వాడాం. ‘వాడు’ అనే రూపం ఈ సందర్భంలో దుష్టుని పట్ల మూలంలోని మూడవ పురుష ఏకవచనాన్ని స్పష్టంగా ఉంచుతుంది.
