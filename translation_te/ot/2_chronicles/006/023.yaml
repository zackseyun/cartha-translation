  to: అప్పుడు నీవు ఆకాశం నుండి విని, చర్య తీసుకుని, నీ సేవకులకు తీర్పు తీర్చు; దుష్టునికి అతని ప్రవర్తనను అతని తలమీదికే రప్పించి[a], నీతిమంతుణ్ణి సరైనవాడని తీర్చి[b], అతని నీతిని బట్టి అతనికి ఇవ్వు.
