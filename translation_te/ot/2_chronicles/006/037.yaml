id: 2CH.6.37
reference: 2 Chronicles 6:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הֵשִׁ֨יבוּ֙ אֶל לְבָבָ֔/ם בָּ/אָ֖רֶץ אֲשֶׁ֣ר נִשְׁבּוּ שָׁ֑ם וְ/שָׁ֣בוּ וְ/הִֽתְחַנְּנ֣וּ אֵלֶ֗י/ךָ בְּ/אֶ֤רֶץ שִׁבְיָ/ם֙ לֵ/אמֹ֔ר חָטָ֥אנוּ הֶעֱוִ֖ינוּ וְ/רָשָֽׁעְנוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/037.yaml
  text: and if they come to their senses in the land where they were taken captive[a], and turn back and plead with you in the land of their captivity, saying, ‘We have sinned, we have acted perversely, and we have acted wickedly,’
translation:
  language: te
  text: వారు చెరపట్టబడిన దేశంలో తమలో తాము గ్రహించి[a], నీవైపు తిరిగి, తమ చెర దేశంలో నిన్ను వేడుకొని, ‘మేము పాపం చేశాం; వక్రంగా నడుచుకున్నాం; దుష్టంగా ప్రవర్తించాం’ అని చెబితే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘తమ హృదయానికి తిరిగి తెచ్చుకొని’; అంటే లోతుగా ఆలోచించి తమ స్థితిని గ్రహించడం.
    reason: మూలంలోని హృదయ భావచిత్రాన్ని, దాని జాతీయార్థాన్ని భద్రపరచడానికి.
lexical_decisions:
- source_word: וְהֵשִׁיבוּ אֶל־לְבָבָם
  choice: తమలో తాము గ్రహించి
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘తమ హృదయానికి తిరిగి తెచ్చుకోవడం’ అనే భావచిత్రాన్ని కలిగి ఉంది; సందర్భంలో అది లోతుగా ఆలోచించి తమ స్థితిని గుర్తించడాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో అంతరంగ గ్రహింపును ఈ ఎంపిక తెలియజేస్తుంది; మూల భావచిత్రాన్ని పాదటిప్పణి భద్రపరుస్తుంది.
- source_word: בָּאָרֶץ אֲשֶׁר נִשְׁבּוּ שָׁם
  choice: వారు చెరపట్టబడిన దేశంలో
  rationale: נשבה నిఫల్ రూపం చెరపట్టబడటాన్ని సూచిస్తుంది. ఈ అనువాదం కర్తకు జరిగిన చర్యను, చెర సందర్భాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וְשָׁבוּ
  choice: తిరిగి
  rationale: שׁוּב భౌతికంగా తిరిగిరావడం లేదా ఆత్మీయంగా దేవునివైపు మళ్లడం అనే రెండు భావాలను మోయగలదు. ‘తిరిగి’ అనే పదం ‘పశ్చాత్తాపపడి’ అని సిద్ధాంతపరంగా కుదించకుండా ఆ ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది.
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: నిన్ను వేడుకుంటూ
  rationale: חנן హిత్పయేల్ రూపం అనుగ్రహం కోసం వినయపూర్వకంగా, తీవ్రంగా వేడుకోవడాన్ని తెలియజేస్తుంది. ‘నిన్ను వేడుకుంటూ’ సాధారణ పాఠకులకు సహజంగా ఉండి ప్రార్థనలోని ఆర్తిని నిలుపుతుంది.
- source_word: בְּאֶרֶץ שִׁבְיָם
  choice: తమ చెర దేశంలో
  rationale: שְׁבִי చెర స్థితిని సూచిస్తుంది. ‘తమ చెర దేశం’ సంక్షిప్తంగా, స్పష్టంగా ఉండి మూలంలోని స్థల-స్థితి సంబంధాన్ని కాపాడుతుంది.
- source_word: לֵאמֹר
  choice: అని చెబితే
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే సాధారణ ఉక్తి రూపం. వాక్యంలోని షరతు నిర్మాణానికి అనుగుణంగా తెలుగులో ‘అని చెబితే’గా ఇచ్చాం.
- source_word: חָטָאנוּ
  choice: మేము పాపం చేశాం
  rationale: ఇది నేరుగా ఉన్న పాప ఒప్పుకోలు; ‘పాపం చేశాం’ ఖచ్చితమైన, ప్రస్తుత ప్రామాణిక తెలుగు రూపం.
- source_word: הֶעֱוִינוּ
  choice: వక్రంగా నడుచుకున్నాం
  rationale: עוה హిఫిల్ రూపం నైతికంగా వక్రమైన ప్రవర్తనను సూచిస్తుంది. ‘వక్రంగా నడుచుకున్నాం’ మూలంలోని వక్రత భావచిత్రాన్ని ఉంచి, తరువాతి ‘దుష్టంగా’ అనే ఒప్పుకోలతో అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: וְרָשָׁעְנוּ
  choice: దుష్టంగా ప్రవర్తించాం
  rationale: רשע దుష్టత్వం లేదా అపరాధభావాన్ని సూచిస్తుంది. ఈ ఎంపిక క్రియాత్మక బలాన్ని, మూడు భాగాల ఒప్పుకోలలోని పరాకాష్ఠను నిలుపుతుంది.
theological_decisions:
- issue: చెర సందర్భంలో שׁוּב యొక్క పశ్చాత్తాప/తిరుగు భావం
  choice: ‘తిరిగి’ అని అనువదించడం
  alternative: ‘పశ్చాత్తాపపడి’ లేదా ‘తిరిగి వచ్చి’
  rationale: ఈ వచనంలో అంతరంగ గ్రహింపు, తిరగడం, వేడుకోలు, పాప ఒప్పుకోలు కలిసి ఉన్నాయి. ‘తిరిగి’ అనేది భౌతిక తిరుగుదలకూ ఆత్మీయ పశ్చాత్తాపానికీ వీలున్న మూలపదపు విస్తృతిని నిలుపుతుంది; ఒకే సిద్ధాంతపరమైన అర్థానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ఒప్పుకోలలోని మూడు వరుస క్రియల బలం నిలుపబడింది. వచనం ముందున్న షరతు వాక్యానికి కొనసాగింపుగా ఉండటంతో చివర ‘అని చెబితే’ మరియు కామా ఉంచబడ్డాయి.
