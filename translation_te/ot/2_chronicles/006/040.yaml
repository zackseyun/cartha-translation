id: 2CH.6.40
reference: 2 Chronicles 6:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַתָּ֣ה אֱלֹהַ֗/י יִֽהְיוּ נָ֤א עֵינֶ֨י/ךָ֙ פְּתֻח֔וֹת וְ/אָזְנֶ֖י/ךָ קַשֻּׁב֑וֹת לִ/תְפִלַּ֖ת הַ/מָּק֥וֹם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/040.yaml
  text: Now[a], my God, please let your eyes be open and your ears attentive to the prayer of this place.
translation:
  language: te
  text: ఇప్పుడు నా దేవా, దయచేసి నీ కళ్లు తెరిచి ఉండునుగాక; నీ చెవులు ఈ స్థలపు ప్రార్థనకు శ్రద్ధగా ఉండునుగాక.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ స్థలంలో అర్పించే ప్రార్థనకు,’ లేదా ‘ఈ స్థలం నుండి చేసే ప్రార్థనకు.’ హీబ్రూలో అక్షరార్థంగా ‘ఈ స్థలపు ప్రార్థనకు’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: సొలొమోను ముగింపు విన్నపాన్ని ప్రారంభించే కాలసూచక, ప్రసంగ-మార్పు పదంగా సహజంగా ఉంది.
- source_word: אֱלֹהַי
  choice: నా దేవా
  rationale: ప్రథమ పురుష ఏకవచన ప్రత్యయంతో కూడిన ప్రత్యక్ష సంబోధనను ఆధునిక, గౌరవప్రదమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יִהְיוּ נָא
  choice: దయచేసి ... ఉండనివ్వు
  rationale: జస్సివ్ రూపం మరియు נָא కలిపి తెలిపే వినయపూర్వక విన్నప స్వరాన్ని నిలుపుతుంది.
- source_word: עֵינֶיךָ פְּתֻחוֹת
  choice: నీ కళ్లు తెరచి ఉండనివ్వు
  rationale: దేవుని శ్రద్ధను తెలిపే మానవరూపక చిత్రణను వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: וְאָזְנֶיךָ קַשֻּׁבוֹת
  choice: నీ చెవులు శ్రద్ధగా ఉండనివ్వు
  rationale: קַשֻּׁבוֹת లోని వినడానికి సిద్ధంగా, శ్రద్ధగా ఉండే భావాన్ని చెవుల రూపకంతో సహజంగా అందిస్తుంది.
- source_word: לִתְפִלַּת
  choice: ప్రార్థనను ఆలకించడానికి
  rationale: לְ సూచించే దిశ లేదా లక్ష్య సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, చెవులు శ్రద్ధగా ఉండటం ప్రార్థనవైపు ఉద్దేశించబడిందని వ్యక్తం చేస్తుంది.
- source_word: הַמָּקוֹם הַזֶּה
  choice: ఈ స్థలపు
  rationale: అక్షరార్థమైన ‘ఈ స్థలపు ప్రార్థన’ అనే సంబంధాన్ని ప్రధాన పాఠ్యంలో నిలిపి, ‘ఈ స్థలంలో అర్పించే’ లేదా ‘ఈ స్థలం నుండి చేసే’ అని ఒకే అర్థానికి పరిమితం చేయదు.
theological_decisions:
- issue: దేవుని కళ్లు, చెవులు అనే మానవరూపక భాష
  choice: ‘నీ కళ్లు తెరచి ఉండనివ్వు; ... నీ చెవులు శ్రద్ధగా ఉండనివ్వు’ అనే స్పష్టమైన చిత్రణను నిలుపడం
  alternative: ‘నీవు గమనించి ఆలకించు’ అనే వ్యాఖ్యానాత్మక పునర్వ్యాఖ్య
  rationale: హీబ్రూ పాఠం ప్రార్థనపట్ల దేవుని శ్రద్ధను శరీరావయవాల చిత్రణతో చెబుతుంది. దానిని అలాగే ఉంచడం సాహిత్య, వేదాంత ఉద్వేగాన్ని కాపాడుతుంది; దేవునికి భౌతిక శరీరం ఉందని అదనంగా నిర్ధారించదు.
- issue: ‘ఈ స్థలపు ప్రార్థన’ అనే సంబంధం
  choice: అస్పష్టతను ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘ఈ స్థలంలో అర్పించే ప్రార్థన’ లేదా ‘ఈ స్థలం నుండి చేసే ప్రార్థన’
  rationale: హీబ్రూ సంబంధ నిర్మాణం ప్రార్థన ఈ స్థలంతో ఎలా అనుసంధానమైందో స్పష్టంగా నిర్దేశించదు. సందర్భం ఆలయంతో సంబంధాన్ని సూచించినా, ప్రధాన పాఠ్యంలో ఒకే వివరణను చేర్చడం సముచితం కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవప్రదమైన సంబోధన, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. హీబ్రూ మానవరూపకాన్ని, ‘ఈ స్థలపు’ అనే నిజమైన అర్థాస్పష్టతను నిలిపింది.
