source:
  edition: WLC
  text: לִ/הְיוֹת֩ עֵינֶ֨י/ךָ פְתֻח֜וֹת אֶל הַ/בַּ֤יִת הַ/זֶּה֙ יוֹמָ֣ם וָ/לַ֔יְלָה אֶל הַ֨/מָּק֔וֹם אֲשֶׁ֣ר אָמַ֔רְתָּ לָ/שׂ֥וּם שִׁמְ/ךָ֖ שָׁ֑ם לִ/שְׁמ֨וֹעַ֙ אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֣ר יִתְפַּלֵּ֣ל עַבְדְּ/ךָ֔ אֶל הַ/מָּק֖וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/020.yaml
  text: that your eyes may be open toward this house day and night[a], toward the place where you said you would put your name[b], to hear the prayer that your servant prays toward this place.
translation:
  language: te
  text: నీ కన్నులు ఈ మందిరం వైపు రాత్రింబగళ్లు తెరిచి ఉండేలా అనుగ్రహించు[a]. నీ నామాన్ని అక్కడ ఉంచుతానని[b] నీవు చెప్పిన ఈ స్థలం వైపు నీ సేవకుడు చేసే ప్రార్థనను ఆలకించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ మందిరం పట్ల నీవు శ్రద్ధగా ఉండేలా అనుగ్రహించు.” హీబ్రూలో అక్షరార్థంగా “నీ కన్నులు తెరిచి ఉండేలా” అని ఉంది; ఇది అప్రమత్తమైన శ్రద్ధను సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: “నీ నామాన్ని అక్కడ ఉంచడం” అనేది దేవుడు ఈ స్థలాన్ని తనకు ప్రత్యేకంగా అనుబంధించుకున్నాడని సూచించే ఆలయ నుడికారం; దేవుడు అక్షరార్థంగా ఈ స్థలంలోనే పరిమితుడై ఉన్నాడని దీని భావం కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: לִהְיוֹת עֵינֶיךָ פְתֻחוֹת
  choice: నీ కన్నులు ... తెరిచి ఉండేలా అనుగ్రహించు
  rationale: హీబ్రూ అనంత క్రియారూపం మునుపటి ప్రార్థనా సందర్భంలో విన్నప భావాన్ని వ్యక్తం చేస్తుంది. ‘కన్నులు తెరిచి ఉండడం’ అనే దేవునికి మానవ అవయవాలను ఆపాదించే మూల రూపకాన్ని నిలిపి, తెలుగులో విన్నపంగా సహజంగా ఉండేందుకు ‘అనుగ్రహించు’ చేర్చబడింది.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: ఈ మందిరం వైపు
  rationale: אֶל లోని దిశార్థాన్ని ‘వైపు’ నిలుపుతుంది; ఆలయ సందర్భంలో הַבַּיִת‌కు ‘మందిరం’ సహజమైన, స్పష్టమైన తెలుగు పదం.
- source_word: יוֹמָם וָלַיְלָה
  choice: రాత్రింబగళ్లు
  rationale: పగలు-రాత్రి అనే నిరంతర కాలార్థక ద్వంద్వాన్ని సహజమైన ఆధునిక తెలుగు నుడికారంతో తెలియజేస్తుంది.
- source_word: הַמָּקוֹם
  choice: ఈ స్థలం
  rationale: మూలంలోని ‘స్థలం’ అనే సాధారణ పదాన్ని నిలుపుతూ, సమీప సూచనను తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לָשׂוּם שִׁמְךָ שָׁם
  choice: నీ నామాన్ని అక్కడ ఉంచుతానని
  rationale: ‘నామాన్ని ఉంచడం’ అనే ఆలయసంబంధమైన, వేదాంతపరంగా ప్రాముఖ్యమైన హీబ్రూ నుడికారాన్ని వివరణాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: לִשְׁמֹעַ אֶל הַתְּפִלָּה
  choice: ప్రార్థనను ఆలకించు
  rationale: శబ్దార్థమైన ‘విను’ కంటే ‘ఆలకించు’ ప్రార్థనను శ్రద్ధగా వినాలనే సందర్భార్థాన్ని గౌరవప్రదమైన తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: יִתְפַּלֵּל עַבְדְּךָ
  choice: నీ సేవకుడు చేసే
  rationale: అసంపూర్ణ క్రియారూపాన్ని సంబంధవాక్యంలో సాధారణ/సందర్భోచిత చర్యగా చూపుతుంది; ప్రార్థనా సంబోధనలో עבד‌కు ‘సేవకుడు’ సముచితం.
theological_decisions:
- issue: దేవుని గురించి ‘కన్నులు తెరిచి ఉండడం’ అనే మానవరూప భాష
  choice: మూల రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘ఈ మందిరం పట్ల శ్రద్ధ చూపు’ అని భావానువాదం చేయడం
  rationale: మూలంలోని స్పష్టమైన శరీరరూపకాన్ని తొలగిస్తే దాని సాహిత్య, వేదాంత స్వరూపం తగ్గిపోతుంది; భావాన్ని పాదసూచికలో వివరిస్తాం.
- issue: ‘నీ నామాన్ని అక్కడ ఉంచడం’ అనే ఆలయ నుడికారం
  choice: ‘నీ నామాన్ని అక్కడ ఉంచుతానని’ అని యథాతథంగా నిలుపడం
  alternative: ‘నీ సన్నిధిని అక్కడ నివసింపజేస్తానని’ అని విస్తరించడం
  rationale: ఈ నుడికారం దేవుని ఎంపిక, అనుబంధం, అధికారాన్ని సూచించగలదు; దాన్ని కేవలం భౌతిక నివాసంగా లేదా ఒకే వివరణగా పరిమితం చేయకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలి వాడబడింది. ‘మందిరం,’ ‘నామం,’ ‘సేవకుడు,’ ‘ఆలకించు’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, వచన గాంభీర్యాన్ని నిలుపుతాయి. హీబ్రూ వాక్యంలోని దీర్ఘ నిర్మాణాన్ని తెలుగులో రెండు వాక్యాలుగా విభజించి స్పష్టత పెంచినా, దిశా సంబంధం మరియు ఉద్దేశ సంబంధం నిలుపబడ్డాయి.
