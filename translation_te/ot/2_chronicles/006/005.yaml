source:
  edition: WLC
  text: מִן הַ/יּ֗וֹם אֲשֶׁ֨ר הוֹצֵ֣אתִי אֶת עַמִּ/י֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ לֹא בָחַ֣רְתִּֽי בְ/עִ֗יר מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לִ/בְנ֣וֹת בַּ֔יִת לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וְ/לֹא בָחַ֣רְתִּֽי בְ/אִ֔ישׁ לִ/הְי֥וֹת נָגִ֖יד עַל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/005.yaml
  text: From the day that I brought my people out of the land of Egypt[a], I have not chosen a city from any of the tribes of Israel to build a house for my name to be there[c][b], nor have I chosen a man to be ruler over my people Israel.
translation:
  language: te
  text: నేను నా ప్రజలను ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చిన రోజు మొదలుకొని[a], నా నామం అక్కడ ఉండేలా ఒక గృహాన్ని[b] కట్టడానికి ఇశ్రాయేలు గోత్రాలన్నిటిలో ఏ పట్టణాన్నీ ఎన్నుకోలేదు. మరియు నా ప్రజ అయిన ఇశ్రాయేలుపై అధిపతిగా[c] ఉండడానికి ఏ పురుషుణ్ణీ ఎన్నుకోలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను నా ప్రజలను ఐగుప్తు దేశం నుండి బయటకు తీసుకొచ్చిన నాటి నుండి నేను ... ఎన్నుకోలేదు.” హీబ్రూ క్రియారూపాలను సాధారణ భూతకాలంగానూ అనువదించవచ్చు; ఇక్కడ “మొదలుకొని” అనే పదం ఆ గత దినం నుండి కొనసాగిన భావాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “గృహం” అంటే దేవాలయం. హీబ్రూ పాఠం వ్యాఖ్యానాత్మకమైన “దేవాలయం” అనే పదానికి బదులు “గృహం” అనే పదాన్నే వాడుతుంది.
    reason: lexical_alternative
  - marker: c
    text: “అధిపతి” అనే పదాన్ని “నాయకుడు” లేదా “రాజకుమారుడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַיּוֹם אֲשֶׁר
  choice: రోజు మొదలుకొని
  rationale: తరువాత చెప్పే నిరాకరణలకు గతంలోని ఆ దినాన్ని ఆరంభబిందువుగా చూపే హీబ్రూ కాలవ్యక్తీకరణను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הוֹצֵאתִי
  choice: బయటకు తీసుకొచ్చిన
  rationale: יצא హిఫీల్ రూపంలోని కారణార్థాన్ని, నిర్గమ సంఘటనను స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: עַמִּי
  choice: నా ప్రజలను
  rationale: దేవునికి ఇశ్రాయేలుతో ఉన్న నిబంధన సంబంధాన్ని తెలిపే మూలంలోని స్వామ్యభావాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: భౌగోళిక వ్యక్తీకరణను సహజమైన ఆధునిక తెలుగు క్రమంలో ఉంచుతుంది.
- source_word: לֹא בָחַרְתִּי
  choice: ఎన్నుకోలేదు
  rationale: ‘రోజు మొదలుకొని’ అనే కాలచట్రంతో కలిసినప్పుడు, గతం నుండి వాక్యం పలికిన కాలం వరకు కొనసాగిన నిరాకరణ భావం తెలుగులో సహజంగా గ్రహించబడుతుంది.
- source_word: בְעִיר
  choice: ఏ పట్టణాన్నీ
  rationale: בחר తో ఉన్న ב ఎంపిక చేయబడే కర్మను సూచిస్తుంది; నిరాకరణ వాక్యంలో ‘ఏ పట్టణాన్నీ’ పంపిణీ భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాలన్నిటిలో
  rationale: ఇశ్రాయేలు గోత్ర సమూహమంతటిలోనూ ఏ పట్టణం ఎంపిక కాలేదనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לִבְנוֹת בַּיִת
  choice: ఒక గృహాన్ని కట్టడానికి
  rationale: בַּיִת అనే మూలపదంలోని ‘ఇల్లు/గృహం’ రూపకాన్ని ‘ఆలయం’ అని నేరుగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: నా నామం అక్కడ ఉండేలా
  rationale: ‘నామం అక్కడ ఉండడం’ అనే మూలభాషలోని నిబంధనాత్మక దైవసన్నిధి భాషను ‘నివసించు’ వంటి అదనపు వ్యాఖ్యానం లేకుండా కాపాడుతుంది.
- source_word: וְלֹא בָחַרְתִּי בְאִישׁ
  choice: అలాగే ... ఏ పురుషుణ్ణీ ఎన్నుకోలేదు
  rationale: రెండవ సమాంతర నిరాకరణను సహజంగా కలుపుతూ, చారిత్రక పురుష పాలకుణ్ణి సూచించే אִישׁ యొక్క పుంలింగ భావాన్ని నిలుపుతుంది.
- source_word: נָגִיד
  choice: అధిపతి
  rationale: అధికార స్థానంలో నియమించబడిన వ్యక్తిని సూచించే పదానికి స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: నా ప్రజలైన ఇశ్రాయేలుపై
  rationale: ‘పై’ ద్వారా అధికార సంబంధాన్నీ, ‘నా ప్రజలైన ఇశ్రాయేలు’ ద్వారా నిబంధన సంబంధాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: ఆరాధనా స్థల పరిభాష మరియు దైవ నామసన్నిధి
  choice: ‘గృహం’ మరియు ‘నా నామం అక్కడ ఉండేలా’ అని అనువదించడం
  alternative: ‘ఆలయం కట్టి, నా సన్నిధి అక్కడ నివసించేలా’
  rationale: మూలం సాధారణ ‘గృహం’ అనే నామవాచకాన్నీ, దేవుని ‘నామం’ అక్కడ ఉండడమనే భాషనూ వాడుతుంది. వ్యాఖ్యానాత్మక విస్తరణ దైవసన్నిధి స్వరూపాన్ని అనవసరంగా నిర్ణయిస్తుంది.
- issue: אִישׁ యొక్క లింగ సూచన
  choice: ‘ఏ పురుషుణ్ణీ’
  alternative: ‘ఎవరినీ’ లేదా ‘ఏ వ్యక్తినీ’
  rationale: సందర్భం ఇశ్రాయేలుపై నియమించబడే చారిత్రక పురుష పాలకుణ్ణి సూచిస్తుంది; అందువల్ల మూలంలోని పుంలింగ ఏకవచనాన్ని స్పష్టంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘నామం,’ ‘గోత్రాలు,’ ‘అధిపతి’ వంటి బైబిలు సందర్భానికి తగిన పదాలను ఉంచి, వాక్య నిర్మాణాన్ని సహజంగా తీర్చిదిద్దాం. ప్రతి పాదసూచిక గుర్తును సంబంధిత పదబంధం వెంట ఉంచాం.
