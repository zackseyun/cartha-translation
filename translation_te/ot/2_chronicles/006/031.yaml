source:
  edition: WLC
  text: לְמַ֣עַן יִֽירָא֗וּ/ךָ לָ/לֶ֨כֶת֙ בִּ/דְרָכֶ֔י/ךָ כָּל הַ֨/יָּמִ֔ים אֲשֶׁר הֵ֥ם חַיִּ֖ים עַל פְּנֵ֣י הָ/אֲדָמָ֑ה אֲשֶׁ֥ר נָתַ֖תָּה לַ/אֲבֹתֵֽי/נוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/031.yaml
  text: so that they may fear you and walk in your ways all the days that they live on the face of the land that you gave to our fathers[a][b].
translation:
  language: te
  text: వారు నీ పట్ల భయభక్తులు కలిగి, నీ మార్గాల్లో నడుచుకొనునట్లు, నీవు మా పితరులకు ఇచ్చిన దేశంలో వారు జీవించి ఉన్న రోజులన్నిటిలో.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן
  choice: నడుచుకునేలా
  rationale: హేతువు లేదా ఉద్దేశాన్ని సూచించే లְמַעַן భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִירָאוּךָ
  choice: వారు నీవంటే భయభక్తులు కలిగి
  rationale: యרא అనే పదంలోని భయం, గౌరవం, విధేయతతో కూడిన భక్తి అనే విస్తృత భావాన్ని ‘భయభక్తులు’ సహజంగా నిలుపుతుంది.
- source_word: לָלֶכֶת בִּדְרָכֶיךָ
  choice: నీ మార్గాల్లో నడుచుకునేలా
  rationale: దేవుడు నిర్దేశించిన జీవనరీతిని అనుసరించడాన్ని తెలిపే హీబ్రూ రూపకాన్ని కాపాడుతుంది; ఇన్ఫినిటివ్ ఉద్దేశం లేదా ఫలితంతో భయభక్తికి అనుసంధానమవుతుంది.
- source_word: כָּל הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: జీవించే రోజులన్నిటిలో
  rationale: ‘వారు జీవించి ఉన్న రోజులన్నీ’ అనే కాలవ్యాప్తిని సంక్షిప్తమైన సహజ తెలుగులో అందిస్తుంది.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: దేశంలో
  rationale: తరువాతి సంబంధవాక్యం పితరులకు ఇచ్చిన వాగ్దాన దేశాన్ని సూచిస్తున్నందున ‘భూమి మీద’ కంటే ‘దేశంలో’ సందర్భోచితం; హీబ్రూ నుడికారాన్ని పదశః అనువదించకుండా భావాన్ని స్పష్టం చేస్తుంది.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבֹתֵינוּ
  choice: నీవు మా పితరులకు ఇచ్చిన
  rationale: దేవుడు పూర్వీకులకు ఇచ్చిన సంపూర్ణమైన దానాన్ని, నిబంధన సంబంధాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: దేవునికి ‘భయపడడం’ మరియు విధేయత మధ్య సంబంధం
  choice: భయభక్తులు కలిగి
  alternative: నీకు భయపడి; నిన్ను గౌరవించి
  rationale: ఇది కేవలం భీతిని కాక, గౌరవం మరియు విధేయతతో కూడిన నిబంధనాత్మక భయాన్ని సూచిస్తుంది. వెంట వచ్చే ‘నీ మార్గాల్లో నడుచుకోవడం’ ఆ భావానికి ప్రవర్తనా రూపాన్ని తెలియజేస్తుంది.
- issue: הָאֲדָמָה యొక్క పరిధి
  choice: దేశం
  alternative: భూమి; నేల
  rationale: దేవుడు ‘మా పితరులకు ఇచ్చిన’దిగా చెప్పబడటం వల్ల ఇక్కడ సాధారణ భూమండలం కాక ఇశ్రాయేలు పితరులకు వాగ్దానం చేసిన దేశమే సందర్భోచిత సూచన.
- issue: לָלֶכֶת యొక్క సంబంధం
  choice: భయభక్తులు కలిగి ... నడుచుకునేలా
  alternative: భయభక్తులు కలిగి, నీ మార్గాల్లో నడుస్తూ
  rationale: ఇన్ఫినిటివ్‌ను భయభక్తి యొక్క ఆచరణాత్మక వ్యక్తీకరణగా లేదా దానితో ముడిపడిన ఉద్దేశంగా చదవవచ్చు; ప్రధాన పాఠం ఈ సంబంధాన్ని సహజంగా ఉంచి, పాదటిప్పణి ప్రత్యామ్నాయ నిర్మాణాన్ని సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థన సందర్భానికి తగిన గౌరవప్రదమైన ఏకవచన సంబోధన. ‘భయభక్తులు’ సామాన్య పాఠకులకు అర్థమయ్యేలా యרא యొక్క విస్తృత భావాన్ని అందిస్తుంది. ‘దేశంలో’ అనేది వాగ్దాన దేశ సందర్భాన్ని సహజంగా తెలుపుతుంది.
