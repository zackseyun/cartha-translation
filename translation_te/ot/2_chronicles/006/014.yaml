id: 2CH.6.14
reference: 2 Chronicles 6:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵין כָּמ֣וֹ/ךָ אֱלֹהִ֔ים בַּ/שָּׁמַ֖יִם וּ/בָ/אָ֑רֶץ שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לַ/עֲבָדֶ֕י/ךָ הַ/הֹלְכִ֥ים לְ/פָנֶ֖י/ךָ בְּ/כָל לִבָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/014.yaml
  text: And he said[a], “O Yahweh, God of Israel, there is no God like you in heaven or on earth, keeping the covenant and the steadfast love for your servants who walk before you with all their heart.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “ఇశ్రాయేలు దేవుడైన యాహ్వే, ఆకాశంలోగానీ భూమిమీదగానీ నీ వంటి దేవుడు లేడు. తమ పూర్ణ హృదయంతో నీ సన్నిధిలో నడిచే నీ సేవకుల పట్ల నిబంధనను, నిలకడైన ప్రేమను[a] నిలబెట్టేవాడవు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిబంధనా విశ్వసనీయత.”
    reason: חֶסֶד అనే పదం, ముఖ్యంగా నిబంధనతో జతగా వచ్చినప్పుడు, స్థిరమైన ప్రేమతో పాటు నిబంధనకు విశ్వసనీయత అనే భావాన్నీ సూచించగలదు.
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: అతడు ఇలా అన్నాడు
  rationale: ప్రార్థనను పరిచయం చేసే హీబ్రూ కథన రూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించింది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: యాహ్వేను ఇశ్రాయేలు దేవునిగా గుర్తించే సమాస సంబంధాన్ని సహజమైన తెలుగు సంబోధనగా అందిస్తుంది.
- source_word: אֵין כָּמוֹךָ אֱלֹהִים
  choice: నీ వంటి దేవుడు లేడు
  rationale: దేవుని సాటిలేనితనాన్ని చెప్పే హీబ్రూ ప్రయోగాన్ని దాని భావబలాన్ని తగ్గించకుండా అందిస్తుంది.
- source_word: בַּשָּׁמַיִם וּבָאָרֶץ
  choice: ఆకాశంలోగానీ భూమిమీదగానీ
  rationale: ప్రతికూల పోలికలో సమస్త పరిధిని సూచించే ద్వంద్వాన్ని సహజమైన తెలుగు నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: שֹׁמֵר
  choice: నిలబెట్టేవాడవు
  rationale: నిబంధనను పాటిస్తూ స్థిరంగా కొనసాగించే దేవుని లక్షణాత్మక కార్యాన్ని సూచించే వర్తమాన కర్తృవాచక భావాన్ని నిలుపుతుంది.
- source_word: הַבְּרִית
  choice: నిబంధనను
  rationale: దేవుని ఒడంబడిక సంబంధమైన కట్టుబాటుకు ప్రామాణికమైన తెలుగు పదం.
- source_word: וְהַחֶסֶד
  choice: నిలకడైన ప్రేమను
  rationale: חֶסֶד లోని ప్రేమ, విధేయత, స్థిరత్వం అనే సమృద్ధ భావాలను పాఠ్యంలో చదవదగిన రీతిలో సమతుల్యం చేస్తుంది.
- source_word: לַעֲבָדֶיךָ
  choice: నీ సేవకుల పట్ల
  rationale: దేవుని నిబంధనా పరిరక్షణకు సేవకులు సంబంధిత వ్యక్తులని తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: הַהֹלְכִים לְפָנֶיךָ
  choice: నీ సన్నిధిలో నడిచే
  rationale: దేవుని సమక్షంలో జీవించే నమ్మకమైన ప్రవర్తనను సూచించే నడక రూపకాన్ని కాపాడుతుంది.
- source_word: בְּכָל לִבָּם
  choice: నిండు హృదయంతో
  rationale: విభజనలేని సంపూర్ణ అంకితభావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది; కాబట్టి దాన్ని బిరుదుగా మార్చకుండా ధ్వన్యంతరీకరించడం సముచితం.
- issue: నిబంధన సందర్భంలో חֶסֶד భావం
  choice: నిలకడైన ప్రేమ
  alternative: నిబంధనా విశ్వసనీయత; కృప; కరుణ
  rationale: ఈ పదం నిబంధనతో జతగా ఉన్నందున ప్రేమతో కూడిన స్థిర విశ్వసనీయతను సూచిస్తుంది. ప్రధాన పాఠం దాని ప్రేమాంశాన్నీ స్థిరత్వాన్నీ ఉంచగా, ప్రత్యామ్నాయ నిబంధనా భావాన్ని పాదసూచికలో ఇస్తుంది.
- issue: אֵין כָּמוֹךָ אֱלֹהִים లో దేవుని సాటిలేనితనం
  choice: నీ వంటి దేవుడు లేడు
  alternative: దేవుళ్లలో నీవంటి వాడు లేడు
  rationale: హీబ్రూ వాక్యం దేవుని అసమానతను ప్రకటిస్తుంది. ఎలోహీమ్ రూపాన్ని అనవసరంగా బహుదేవతా ప్రకటనగా నిర్ణయించకుండా తెలుగు ఏకవచన నిర్మాణం ఆ ప్రధాన భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రార్థనా శైలిని ఉపయోగించాం. ‘నీ సన్నిధిలో నడిచే’ అనే బైబిలీయ రూపకాన్ని నిలిపి, మిగిలిన వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా ఉంచాం.
