  text: וְ/גַ֣ם אֶל הַ/נָּכְרִ֗י אֲ֠שֶׁר לֹ֥א מֵ/עַמְּ/ךָ֣ יִשְׂרָאֵל֮ הוּא֒ וּ/בָ֣א מֵ/אֶ֣רֶץ רְחוֹקָ֗ה לְמַ֨עַן שִׁמְ/ךָ֤ הַ/גָּדוֹל֙ וְ/יָדְ/ךָ֣ הַ/חֲזָקָ֔ה וּֽ/זְרֽוֹעֲ/ךָ֖ הַ/נְּטוּיָ֑ה וּ/בָ֥אוּ וְ/הִֽתְפַּלְל֖וּ אֶל הַ/בַּ֥יִת הַ/זֶּֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/032.yaml
  text: And also concerning the foreigner[a], who is not from your people Israel, but comes from a distant land because of your great name and your mighty hand and your outstretched arm, when they come and pray toward this house[b],
translation:
  language: te
  text: అలాగే, నీ ప్రజలైన ఇశ్రాయేలుకు చెందని విదేశీయుడు—నీ గొప్ప పేరు, నీ బలమైన చెయ్యి, చాచిన నీ బాహువు కారణంగా దూరదేశం నుండి వచ్చేవాడు—వారు వచ్చి ఈ మందిరం వైపుగా[a] ప్రార్థించినప్పుడు[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ మందిరానికి.’ హీబ్రూ ఉపసర్గను అక్షరార్థంగా అలా అనువదించవచ్చు; అయితే ఈ ప్రార్థనా సందర్భంలో అది ‘ఈ మందిరం వైపుగా’ అనే దిశార్థాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠ్యం ఏకవచనం (‘విదేశీయుడు ... వచ్చేవాడు’) నుండి బహువచనానికి (‘వారు వచ్చి ప్రార్థించినప్పుడు’) మారుతుంది. విదేశీయుణ్ణి ఒక ప్రతినిధి ఉదాహరణగా తీసుకొని సాధారణంగా మాట్లాడడం ఇందుకు కారణం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנָּכְרִי
  choice: అన్యదేశస్థుడు
  rationale: ఇది ఇశ్రాయేలు ప్రజలకు చెందని, వేరొక ప్రజకు లేదా దేశానికి చెందిన వ్యక్తిని సూచిస్తుంది. ‘అన్యదేశస్థుడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, కేవలం తెలియని వ్యక్తి అనే భావం కాకుండా ప్రజాపరమైన భేదాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר לֹא מֵעַמְּךָ יִשְׂרָאֵל הוּא
  choice: నీ ప్రజలైన ఇశ్రాయేలుకు చెందినవాడు కాని
  rationale: అన్యదేశస్థుడు ఇశ్రాయేలు అనే దేవుని ప్రజాసమూహానికి చెందినవాడు కాదనే మూలంలోని సంబంధాన్ని స్పష్టంగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּבָא מֵאֶרֶץ רְחוֹקָה
  choice: దూరదేశం నుండి వచ్చేవాడు
  rationale: మూలంలోని ఏకవచన క్రియను నిలుపుతూ, అన్యదేశస్థుణ్ణి ఒక ప్రతినిధి ఉదాహరణగా చూపిస్తుంది.
- source_word: לְמַעַן שִׁמְךָ הַגָּדוֹל
  choice: నీ గొప్ప పేరు కారణంగా
  rationale: לְמַעַן ఇక్కడ అతడు రావడానికి గల ప్రేరణ లేదా కారణాన్ని తెలుపుతుంది. ‘గొప్ప పేరు’ దేవుని కీర్తి, వెల్లడైన గుర్తింపు అనే బైబిలు నుడికారాన్ని నిలుపుతుంది.
- source_word: וְיָדְךָ הַחֲזָקָה
  choice: నీ బలమైన చెయ్యి
  rationale: దేవుని శక్తివంతమైన కార్యాన్ని సూచించే దృశ్యరూపమైన నుడికారాన్ని సంక్షిప్తం చేయకుండా నిలుపుతుంది.
- source_word: וּזְרוֹעֲךָ הַנְּטוּיָה
  choice: చాచిన నీ బాహువు
  rationale: దైవశక్తి కార్యరూపంలో వ్యక్తమవడాన్ని సూచించే మూలంలోని మానవరూప వర్ణనను యథాతథంగా నిలుపుతుంది.
- source_word: וּבָאוּ וְהִתְפַּלְלוּ
  choice: అలాంటివారు వచ్చి ... ప్రార్థించినప్పుడు
  rationale: మూలం ఏకవచనంలోని అన్యదేశస్థుని నుండి బహువచన క్రియలకు మారుతుంది. ‘అలాంటివారు’ అనడం ఈ మార్పును సహజమైన తెలుగులో తెలియజేస్తూ, అతడు ఒక ప్రతినిధి ఉదాహరణ అన్న భావాన్ని కాపాడుతుంది.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: ఈ మందిరం వైపుగా
  rationale: אֶל సాధారణంగా ‘కు’ అని కూడా అర్థమివ్వగలిగినా, ఈ ప్రార్థనా సందర్భంలో దిశను సూచిస్తుంది. ‘మందిరం’ ఇక్కడ దేవాలయ భవనాన్ని ఆధునిక పాఠకునికి స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: ఏకవచన ‘అన్యదేశస్థుడు’ నుండి బహువచన క్రియలకు మార్పు
  choice: ‘వచ్చేవాడు—అలాంటివారు వచ్చి ... ప్రార్థించినప్పుడు’ అని సంఖ్యా మార్పును పాఠ్యంలో కనిపించేలా ఉంచడం
  alternative: అతడు వచ్చి ప్రార్థించినప్పుడు
  rationale: హీబ్రూ పాఠ్యం ఉద్దేశపూర్వకంగా లేదా ప్రతినిధి ఉదాహరణను సాధారణీకరిస్తూ ఏకవచనం నుండి బహువచనానికి మారుతుంది. పూర్తిగా ఏకవచనంగా మార్చడం ఈ లక్షణాన్ని తొలగిస్తుంది; అక్షరానుసారంగా ‘అతడు ... వారు’ అనడం తెలుగులో అసహజం. ‘అలాంటివారు’ రెండింటినీ సమతుల్యం చేస్తుంది.
- issue: దేవుని శక్తికి మానవరూప వర్ణన
  choice: ‘నీ బలమైన చెయ్యి, చాచిన నీ బాహువు’ అని దృశ్యరూప భాషను నిలుపడం
  alternative: నీ గొప్ప శక్తి
  rationale: మూలంలోని చెయ్యి, బాహువు అనే రూపాలు దేవుని శక్తివంతమైన కార్యాన్ని, ప్రత్యేకంగా విమోచన సంబంధమైన బైబిలు భాషను మోస్తాయి. వాటిని అమూర్తమైన ‘శక్తి’గా కుదించలేదు.
- issue: ‘ఇల్లు’ లేదా ‘మందిరం’
  choice: ఈ సందర్భంలో ‘ఈ మందిరం’
  alternative: ఈ ఇల్లు
  rationale: הַבַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఇక్కడ సొలొమోను ప్రతిష్ఠించిన దేవాలయాన్ని సూచిస్తుంది. ‘మందిరం’ ఆధునిక తెలుగులో ఉద్దేశిత స్థలాన్ని స్పష్టంగా తెలుపుతుంది; దేవుని నివాసం గురించిన భావాన్ని అతిశయంగా వివరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన ప్రార్థనా శైలిని ఉపయోగించాం. తరువాతి వచనంలో పూర్తయ్యే వాక్యం కాబట్టి చివర కామాను ఉంచాం. ‘అలాంటివారు’ ద్వారా హీబ్రూలోని సంఖ్యా మార్పును అసహజత లేకుండా కనిపించేలా చేశాం.
