- from: అలాగే, నీ ప్రజలైన ఇశ్రాయేలుకు చెందినవాడు కాని అన్యదేశస్థుడు—నీ గొప్ప పేరు, నీ బలమైన చెయ్యి, చాచిన నీ బాహువు కారణంగా దూరదేశం నుండి వచ్చేవాడు—అలాంటివారు వచ్చి ఈ మందిరం వైపుగా[a] ప్రార్థించినప్పుడు[b],
