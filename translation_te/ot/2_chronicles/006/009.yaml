revisions:
- from: అయితే నువ్వు ఆ మందిరాన్ని[a] కట్టవు. నీ నడుమునుండి పుట్టే[b] నీ కుమారుడే నా నామం కోసం ఆ మందిరాన్ని కడతాడు.
  to: అయితే నీవు ఆ మందిరాన్ని[a] కట్టవు; కానీ నీ నడుము నుండి పుట్టబోయే నీ కుమారుడే నా నామం కోసం ఆ మందిరాన్ని కడతాడు.
  rationale: The revision explicitly renders the contrast carried by כִּי with ‘కానీ’ and adjusts the second-person form to the formal register. ‘పుట్టబోయే’ makes the Hebrew participle's forward-looking sense clear. Footnotes retain the literal temple and lineage alternatives.
