review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the restriction that David will not build, the direct-descendant idiom, the emphatic identification of the son, and building for God's name. However, the contrast introduced by כִּי after the negation should be expressed explicitly in Telugu; mere sentence division does not adequately carry the source's corrective contrast.
  naturalness: ‘నువ్వు’ is conversational rather than the stated respectful biblical register. ‘నీవు’ is modern-standard and more fitting here. The revised wording remains clear and natural while retaining the source's lineage formulation.
  terminology: ‘మందిరం’ is a defensible contextual rendering of הַבַּיִת in this temple context, and the footnote properly preserves the literal ‘house.’ ‘నా నామం కోసం’ adequately represents לִשְׁמִי. The lineage footnote correctly explains the Hebrew idiom.
  issues:
  - severity: medium
    issue: The contrastive force of כִּי is omitted.
    rationale: After ‘you shall not build,’ כִּי introduces the contrasting positive assertion that the son, rather, will build. Adding ‘కానీ’ preserves this relation without over-interpreting it.
  - severity: low
    issue: ‘నువ్వు’ does not match the claimed respectful biblical register.
    rationale: ‘నీవు’ is more appropriate for a divine address in formal modern-standard Telugu and does not alter the singular reference.
  revised_text: అయితే నీవు ఆ మందిరాన్ని[a] కట్టవు; కానీ నీ నడుము నుండి పుట్టబోయే నీ కుమారుడే నా నామం కోసం ఆ మందిరాన్ని కడతాడు.
  revised_footnotes:
