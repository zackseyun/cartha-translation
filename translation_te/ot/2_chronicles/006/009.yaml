  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רַ֣ק אַתָּ֔ה לֹ֥א תִבְנֶ֖ה הַ/בָּ֑יִת כִּ֤י בִנְ/ךָ֙ הַ/יּוֹצֵ֣א מֵֽ/חֲלָצֶ֔י/ךָ הֽוּא יִבְנֶ֥ה הַ/בַּ֖יִת לִ/שְׁמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/009.yaml
  text: Yet you shall not build the house[a]; rather, your son, who will come from your own body[b], shall build the house for my name.
translation:
  language: te
  text: అయితే నీవు ఆ మందిరాన్ని[a] కట్టవు; కానీ నీ నడుము నుండి పుట్టబోయే నీ కుమారుడే నా నామం కోసం ఆ మందిరాన్ని కడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఆ ఇంటిని’; ఇక్కడ అది దేవాలయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: అయితే
  rationale: ముందటి మాటకు పరిమితిని విధించే వ్యతిరేక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: תִבְנֶה הַבָּיִת / יִבְנֶה הַבַּיִת
  choice: ఆ మందిరాన్ని కట్టవు / ఆ మందిరాన్ని కడతాడు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఆ ఇల్లు’ ఉన్నప్పటికీ, సందర్భంలో అది దేవాలయాన్ని సూచిస్తుంది; తెలుగులో ‘మందిరం’ స్పష్టంగా, సహజంగా ఉంటుంది. రెండు చోట్ల ఒకే పదాన్ని ఉంచి మూలంలోని పునరుక్తిని నిలిపింది.
- source_word: כִּי
  choice: వాక్య విభజన ద్వారా ‘బదులుగా’ అనే వ్యత్యాసం
  rationale: నిషేధం తర్వాత వచ్చే వ్యతిరేక సానుకూల ప్రకటనను తెలుగులో ప్రత్యేక వాక్యంగా సహజంగా వ్యక్తం చేసింది.
- source_word: בִנְךָ
  choice: నీ కుమారుడు
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న ప్రత్యక్ష పుత్రసంబంధాన్ని యథార్థంగా తెలియజేస్తుంది.
- source_word: הַיּוֹצֵא מֵחֲלָצֶיךָ
  choice: నీ నడుమునుండి పుట్టే
  rationale: ‘నడుములు/కటి ప్రదేశం నుండి బయలుదేరే’ అనే హీబ్రూ శరీరాధారిత వంశపారంపర్య నుడికారాన్ని నిలుపుతూ, తెలుగులో అర్థమయ్యేలా చెప్పింది.
- source_word: הוּא
  choice: నీ కుమారుడే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగు నిశ్చయార్థక ‘ఏ’ ద్వారా సహజంగా నిలిపింది.
- source_word: לִשְׁמִי
  choice: నా నామం కోసం
  rationale: దేవుని నామానికి అంకితం చేయడం, ఆయన నామాన్ని ప్రతినిధ్యం చేయడం అనే భావాలను అతిగా వివరణ చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: దేవాలయానికి వాడిన పదం
  choice: మందిరం
  alternative: ఇల్లు
  rationale: הַבַּיִת అక్షరార్థంగా ‘ఆ ఇల్లు’; అయితే ఈ సందర్భంలో దేవాలయానికి స్థిరమైన సూచన. ప్రధాన పాఠ్యంలో ‘మందిరం’ సాధారణ తెలుగు పాఠకునికి వెంటనే స్పష్టతనిస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచింది.
- issue: శారీరక వంశ నుడికారం
  choice: నీ నడుమునుండి పుట్టే
  alternative: నీ సొంత శరీరం నుండి పుట్టే
  rationale: మూలంలోని శరీరాధారిత నుడికారాన్ని కాపాడి, ప్రత్యక్ష శారీరక సంతానం అనే భావాన్ని అదనపు సిద్ధాంతార్థం లేకుండా తెలియజేస్తుంది.
- issue: కుమారునిపై ఉద్ఘాటన
  choice: నీ కుమారుడే
  alternative: నీ కుమారుడు
  rationale: హీబ్రూ స్వతంత్ర సర్వనామం הוּא ఇచ్చే వ్యత్యాసాత్మక ఉద్ఘాటనను తెలుగు ‘ఏ’ సహజంగా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకునికి అర్థమయ్యే శైలి. సందర్భానుసార ఏకవచన సంబోధనగా ‘నువ్వు/నీ’ వాడబడింది. ‘నామం’ అనే బైబిలీయ పదాన్ని నిలిపి, ‘కుమారుడే’ ద్వారా మూలంలోని ఉద్ఘాటనను సహజంగా వ్యక్తం చేసింది.
