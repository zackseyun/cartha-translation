id: PSA.36.1
reference: Psalms 36:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: נְאֻֽם פֶּ֣שַׁע לָ֭/רָשָׁע בְּ/קֶ֣רֶב לִבִּ֑/י אֵֽין פַּ֥חַד אֱ֝לֹהִ֗ים לְ/נֶ֣גֶד עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/001.yaml
  text: 'Transgression speaks to the wicked within my heart: there is no fear of God before his eyes[a][b].'
translation:
  language: te
  text: 'నా హృదయంలో, అతిక్రమం దుష్టునికి పలుకుతోంది: “అతని కళ్ల ఎదుట దేవుని భయం లేదు.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీ: “నా హృదయంలో.” కొన్ని ప్రాచీన అనువాదాలు మరియు ఆధునిక అనువాదాలు దీనిని “అతని హృదయంలో” అని సులభీకరిస్తాయి; మరికొన్ని “దుష్టుని గురించి నా హృదయంలో ఒక సందేశం ఉంది” అని భావానువాదం చేస్తాయి.'
    reason: alternative_reading
  - marker: b
    text: లేదా, “అతిక్రమం నా హృదయంలో దుష్టునికి పలుకుతోంది.”
    reason: previous_rendering
lexical_decisions:
- source_word: נְאֻם
  choice: ఇలా పలుకుతోంది
  rationale: ఈ నామవాచకం గంభీరమైన ప్రకటనను సూచిస్తుంది. తెలుగులో వాక్యాన్ని సహజంగా ఉంచుతూ, అధికారపూర్వక అంతరంగ ప్రకటన భావాన్ని నిలుపడానికి క్రియారూపంగా అనువదించాం.
- source_word: פֶּשַׁע
  choice: అతిక్రమం
  rationale: ఈ పదం తిరుగుబాటు స్వభావమున్న ఉద్దేశపూర్వక తప్పును సూచిస్తుంది. ‘అతిక్రమం’ నైతిక బరువును నిలుపుతుంది; కేవలం చట్టపరమైన నేరంగా పరిమితం చేయదు.
- source_word: לָרָשָׁע
  choice: దుష్టునితో
  rationale: 'לְ ఉపసర్గను సంబోధితుని సూచించేదిగా తీసుకున్నాం: అతిక్రమం దుష్టునితో పలుకుతోంది. ఏకవచన ప్రతినిధి భావం నిలిచింది.'
- source_word: בְּקֶרֶב לִבִּי
  choice: నా హృదయంలో
  rationale: మసోరా పాఠంలో స్పష్టంగా ప్రథమ పురుష ఏకవచనం ‘నా హృదయం’ ఉంది. క్లిష్టతను తొలగించేందుకు ‘అతని హృదయంలో’ అని సవరించకుండా మూలపాఠాన్ని నిలిపాం.
- source_word: אֵין פַּחַד אֱלֹהִים
  choice: దేవుని భయం లేదు
  rationale: ఇది దేవునిపట్ల భయభక్తి లేదా గౌరవభరితమైన భయాన్ని సూచించే స్థిరమైన హెబ్రీ ప్రయోగం. ‘దేవుని భయం’ ఆ విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: לְנֶגֶד עֵינָיו
  choice: అతని కళ్ల ఎదుట
  rationale: వ్యక్తి దృష్టిలో లేదా పరిగణనలో ఏది ఉందో తెలిపే మూలరూపకాన్ని తెలుగులో సహజంగా నిలిపాం.
theological_decisions:
- issue: לִבִּי (‘నా హృదయం’) అనే క్లిష్ట మసోరా పాఠంలోని సర్వనామం మరియు దృష్టికోణం
  choice: కీర్తనకర్త తన హృదయంలో గ్రహించిన ప్రకటనగా ‘నా హృదయంలో’ అని ఉంచి, రెండో భాగంలో దుష్టుడినే ‘అతని’ అనే సర్వనామానికి సూచ్యుడిగా నిలిపాం.
  alternative: భావాన్ని సులభం చేయడానికి ‘అతని హృదయంలో’ అని సవరించడం, లేదా ‘దుష్టుని గురించి నా హృదయంలో ఒక సందేశం ఉంది’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం.
  rationale: హెబ్రీ వ్యంజన మరియు స్వరపూరిత పాఠాలు ప్రథమ పురుష ఏకవచనమైన ‘నా హృదయం’నే సమర్థిస్తాయి. వాక్యం క్లిష్టమైనప్పటికీ, మూలపాఠంలోని ఉద్రిక్తతను సవరణతో తొలగించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘నా హృదయంలో’ని ముందుకు తెచ్చి అది ‘దుష్టుడు’ను విశేషించేదిగా అపార్థం కాకుండా చేశాం; అయితే హెబ్రీలోని ప్రథమ పురుష పాఠాన్ని యథాతథంగా నిలిపాం.
