revisions:
- from: 'నా హృదయంలో, అతిక్రమం దుష్టునితో ఇలా పలుకుతోంది: “అతని కళ్ల ఎదుట దేవుని భయం లేదు.”[a][b]'
  to: 'నా హృదయంలో, అతిక్రమం దుష్టునికి పలుకుతోంది: “అతని కళ్ల ఎదుట దేవుని భయం లేదు.”[a][b]'
