  text: There the workers of wickedness have fallen[b][a]; they are thrust down and cannot rise.
translation:
  language: te
  text: అక్కడ దుర్మార్గపు పనులు చేసేవారు[a] పడిపోయారు; వారు కూలదోయబడ్డారు, లేవలేరు[b].
  philosophy: optimal-equivalence
