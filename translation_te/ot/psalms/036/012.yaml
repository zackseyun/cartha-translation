translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గంభీరతతో కూడిన సరళమైన వాక్యనిర్మాణం వాడబడింది. హెబ్రీలోని పతనం, బలవంతపు కూలద్రోయడం, తిరిగి లేవలేకపోవడం అనే క్రమం నిలుపబడింది.
