lexical_decisions:
- source_word: שָׁם
  choice: అక్కడ
  rationale: ఇది ప్రధానంగా స్థలాన్ని సూచించే అవ్యయం; దుర్మార్గుల పతనం సంభవించిన దృశ్యాన్ని చూపిస్తుంది.
- source_word: נָפְלוּ
  choice: పడిపోయారు
  rationale: పూర్తయిన పతనాన్నీ, దాని కొనసాగుతున్న ఫలితాన్నీ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: פֹּעֲלֵי אָוֶן
  choice: దుర్మార్గపు పనులు చేసేవారు
  rationale: ‘దుర్మార్గాన్ని కార్యరూపంలో చేసేవారు’ అనే హెబ్రీ నిర్మాణంలోని క్రియాత్మక భావాన్ని నిలుపుతూ, సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: אָוֶן
  choice: దుర్మార్గపు
  rationale: ఈ సందర్భంలో కష్టం లేదా వ్యర్థతకన్నా నైతిక చెడును సూచించే భావమే ప్రధానమైనది.
- source_word: דֹּחוּ
  choice: పడద్రోయబడ్డారు
  rationale: బలవంతంగా కిందికి తోసి ఓడించబడిన భావాన్నీ, దాని ఫలితమైన పతనాన్నీ వ్యక్తం చేస్తుంది.
- source_word: וְלֹא יָכְלוּ קוּם
  choice: లేవలేరు
  rationale: పడద్రోయబడిన తరువాత తిరిగి లేచే శక్తి లేకపోవడాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
