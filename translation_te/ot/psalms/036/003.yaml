lexical_decisions:
- source_word: דִּבְרֵי פִיו
  choice: అతని నోటి మాటలు
  rationale: మూలంలోని బహువచన నిర్మాణాన్నీ, ‘నోరు’ అనే స్పష్టమైన హీబ్రూ రూపకాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אָוֶן
  choice: దుష్టత్వం
