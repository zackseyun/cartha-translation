  rationale: హీబ్రూ వాక్యనిర్మాణం రెండు పఠనాలకూ అవకాశం ఇస్తుంది. ప్రధాన పాఠం రెండు కార్యాలనూ స్పష్టంగా ఉంచగా, ప్రత్యామ్నాయ సంబంధాన్ని పాదటిప్పణి కాపాడుతుంది; ఏ ప్రత్యేక సిద్ధాంతార్థాన్నీ బలవంతంగా చేర్చదు.
