source:
  edition: WLC
  text: יְ֭הוָה בְּ/הַ/שָּׁמַ֣יִם חַסְדֶּ֑/ךָ אֱ֝מֽוּנָתְ/ךָ֗ עַד שְׁחָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/005.yaml
  text: O Yahweh[a], your steadfast love is in the heavens; your faithfulness reaches to the clouds.
translation:
  language: te
  text: 'యాహ్వే, నీ స్థిరమైన ప్రేమ ఆకాశాల్లో ఉంది;[a]

    నీ విశ్వసనీయత మేఘాల వరకు చేరుతుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ స్థిరమైన ప్రేమ ఆకాశాల వరకు విస్తరించింది.” హీబ్రూ పదబంధం సాధారణ స్థానాన్ని కాక విస్తారాన్ని సూచించేదిగా కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో ఇచ్చాం; వాక్యారంభ స్థానం ప్రత్యక్ష సంబోధనను సహజంగా తెలియజేస్తుంది.
- source_word: בְּהַשָּׁמַיִם
  choice: ఆకాశాల్లో ఉంది
  rationale: בְּ యొక్క సహజ స్థానార్థాన్ని నిలుపుతూ, שָּׁמַיִם యొక్క రూపాన్ని తెలుగులో సహజమైన బహువచనంతో తెలిపాం; హీబ్రూలో అంతర్లీనంగా ఉన్న అనుసంధాన క్రియను ‘ఉంది’గా పూరించాం.
- source_word: חַסְדֶּךָ
  choice: నీ స్థిరమైన ప్రేమ
  rationale: חֶסֶד లోని నిలకడగల, నమ్మకమైన ప్రేమ భావాన్ని సాధారణ ఆధునిక తెలుగులో ‘స్థిరమైన ప్రేమ’గా వ్యక్తపరిచాం.
- source_word: אֱמוּנָתְךָ
  choice: నీ విశ్వసనీయత
  rationale: ఈ సమాంతర సందర్భంలో אֱמוּנָה సత్యం అనే భావం కంటే నమ్మదగిన స్థిరత్వం, నిబద్ధత అనే భావాన్ని సూచిస్తుంది.
- source_word: עַד
  choice: వరకు చేరుతుంది
  rationale: పరిధి లేదా విస్తారాన్ని తెలిపే עַד భావాన్ని తెలుగులో సహజమైన క్రియాత్మక నిర్మాణంతో అందించాం.
- source_word: שְׁחָקִים
  choice: మేఘాలు
  rationale: కవితాత్మకంగా ఎత్తైన ఆకాశ ప్రాంతాన్ని సూచించే పదంలోని స్పష్టమైన దృశ్యరూపాన్ని ‘మేఘాలు’ నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ప్రత్యేక దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం. తెలుగు బైబిలు వాడుకలో సాధారణ పాఠకులకు అత్యంత పరిచయమైన రూపం ‘యెహోవా’; ఖచ్చితమైన ప్రాచీన ఉచ్చారణపై ఉన్న అనిశ్చితిని ఇది సిద్ధాంతపరంగా పరిష్కరించినట్లు చెప్పదు.
- issue: בְּהַשָּׁמַיִם యొక్క స్థానార్థం లేదా పరిమాణార్థం
  choice: ఆకాశాల్లో ఉంది
  alternative: ఆకాశాల వరకు విస్తరించింది
  rationale: בְּ ను మొదట దాని సాధారణ స్థానార్థంలో అనువదించాం. అయితే కవితా సమాంతరత్వం వల్ల ‘ఆకాశాల వరకు’ అనే విస్తారార్థం కూడా సాధ్యమని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గంభీరమైనా సులభంగా అర్థమయ్యే శైలిని వాడాం. రెండు కవితా పాదాల సమాంతరత్వాన్ని నిలిపాం; మూలంలో లేని సిద్ధాంత వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
