revisions:
- from: అతడు తన మంచం మీద దుష్టత్వాన్ని ఆలోచిస్తాడు; మంచిది కాని మార్గంలో తనను తాను నిలుపుకుంటాడు; చెడును తిరస్కరించడు.
  to: అతడు తన మంచం మీద అన్యాయాన్ని పన్నుతాడు; మంచిది కాని మార్గంలో స్థిరంగా నిలుస్తాడు; చెడును తిరస్కరించడు.
  rationale: The revision retains the source’s threefold structure, moral contrast, and ‘way’ metaphor. It replaces two literal but awkward Telugu expressions with natural equivalents that more accurately convey intentional devising (יַחְשֹׁב) and deliberate self-positioning (יִתְיַצֵּב). No footnote is required because the Hebrew wording is not textually disputed here and the lexical alternatives do not need explanation in the translated text.
