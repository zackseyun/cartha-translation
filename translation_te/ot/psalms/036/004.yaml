  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָ֤וֶן יַחְשֹׁ֗ב עַֽל מִשְׁכָּ֫ב֥/וֹ יִ֭תְיַצֵּב עַל דֶּ֣רֶךְ לֹא ט֑וֹב רָ֝֗ע לֹ֣א יִמְאָֽס׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/004.yaml
  text: He devises wickedness on his bed[a]; he sets himself on a way that is not good; he does not reject evil.
translation:
  language: te
  text: అతడు తన మంచం మీద అన్యాయాన్ని పన్నుతాడు; మంచిది కాని మార్గంలో స్థిరంగా నిలుస్తాడు; చెడును తిరస్కరించడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָוֶן
  choice: దుష్టత్వం
  rationale: ఈ సందర్భంలో ఈ పదం కష్టాన్ని కాక, ఉద్దేశపూర్వకమైన నైతిక దుష్టత్వాన్ని సూచిస్తుంది; చివరి పాదంలోని ‘చెడు’తో భావసంబంధాన్ని నిలుపుతూ పదభేదాన్నీ కాపాడుతుంది.
- source_word: יַחְשֹׁב
  choice: ఆలోచిస్తాడు
  rationale: חשבకు ఆలోచించడం, యోచించడం అనే భావాలున్నాయి. ‘దుష్టత్వం’ అనే కర్మతో కలిసినప్పుడు ఉద్దేశపూర్వకంగా పన్నే ఆలోచనను సూచిస్తుంది; తెలుగు వాక్యంలో ‘దుష్టత్వాన్ని ఆలోచిస్తాడు’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַל מִשְׁכָּבוֹ
  choice: తన మంచం మీద
  rationale: స్థలాన్ని తెలిపే హీబ్రూ పదబంధంలోని ప్రత్యక్ష చిత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יִתְיַצֵּב
  choice: తనను తాను నిలుపుకుంటాడు
  rationale: హిత్పయేల్ రూపంలోని ఆత్మనిర్దేశక భావాన్ని కాపాడుతూ, ఒక మార్గానికి ఉద్దేశపూర్వకంగా కట్టుబడి నిలిచే భావాన్ని తెలియజేస్తుంది.
- source_word: עַל דֶּרֶךְ לֹא טוֹב
  choice: మంచిది కాని మార్గంలో
  rationale: ‘మార్గం’ అనే ప్రవర్తనా రూపకాన్ని, అలాగే ‘మంచిది కాని’ అనే హీబ్రూ ప్రతినిషేధ నిర్మాణాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: רָע
  choice: చెడు
  rationale: ఇక్కడ నైతికమైన చెడు ఉద్దేశించబడింది. ముందు వచ్చిన אָוֶןను ‘దుష్టత్వం’గా అనువదించినందున మూలంలోని పదభేదం కూడా నిలుస్తుంది.
- source_word: לֹא יִמְאָֽס
  choice: తిరస్కరించడు
  rationale: מאסలోని తిరస్కరించడం, అసహ్యించుకోవడం అనే భావాలలో, చెడును విడనాడేందుకు నిరాకరించే భావాన్ని ‘తిరస్కరించడు’ స్పష్టంగా తెలియజేస్తుంది.
