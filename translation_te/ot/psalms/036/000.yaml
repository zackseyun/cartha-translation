  text: לַ/מְנַצֵּ֬חַ לְ/עֶֽבֶד יְהוָ֬ה לְ/דָוִֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/000.yaml
  text: For the choirmaster[a]. Of David[d][c][b], the servant of Yahweh.
translation:
  language: te
  text: సంగీత నాయకునికి[a]. యహ్వే సేవకుడైన దావీదుది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గాన నాయకునికి.” ఈ హీబ్రూ పదం ఆరాధనా సంగీతాన్ని నడిపించే వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యహ్వే సేవకుడైన దావీదు రచించినది.” హీబ్రూ ఉపసర్గ రచన, అంకితం లేదా సంబంధాన్ని సూచించవచ్చు; ఈ శీర్షిక ఒక్కటే రచయితత్వాన్ని ఖచ్చితంగా నిర్ణయించదు.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకునికి
  rationale: కీర్తనల శీర్షికల్లో ఈ పదం ఆరాధనా సంగీతాన్ని నడిపించే వ్యక్తిని సూచిస్తుంది. ‘సంగీత నాయకుడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, పదంలోని కార్యపరమైన భావాన్ని తెలియజేస్తుంది.
- source_word: לְעֶבֶד
  choice: సేవకుడైన
  rationale: ఇక్కడ עֶבֶד బానిసత్వ స్థితిని ప్రధానంగా చెప్పడం కాక, యహ్వేతో దావీదుకున్న గౌరవప్రదమైన నిబంధనా సంబంధాన్ని సూచించే బిరుదుగా ఉంది. అందువల్ల ‘సేవకుడు’ సందర్భోచితం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని వ్యక్తిగత నామాన్ని తెలుగులో లిప్యంతరీకరించాం.
- source_word: לְדָוִד
  choice: దావీదుకు చెందినది
  rationale: కీర్తన శీర్షికల్లో לְדָוִד రచన, అంకితం లేదా సంబంధాన్ని విస్తృతంగా సూచించవచ్చు. ‘దావీదుకు చెందినది’ ఆ విస్తృత అన్వయాన్ని నిలుపుతుంది; ‘దావీదు రచించినది’ అని సంకుచితం చేయదు.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో బిరుదు కాక దైవనామమే ఉంది. ‘యహ్వే’ దానిని వ్యక్తిగత నామంగా నిలుపుతుంది; ‘ప్రభువు’ దానిని బిరుదుగా మార్చుతుంది.
- issue: עֶבֶד యొక్క సందర్భోచిత భావం
  choice: సేవకుడు
  alternative: దాసుడు / బానిస
  rationale: ఈ శీర్షికలో ఇది దావీదుకు గౌరవప్రదమైన ఆధ్యాత్మిక బిరుదు. బంధిత స్థితిని ముందుకు తెచ్చే ‘బానిస’ ఇక్కడ అవసరానికి మించిన భావాన్ని చేర్చుతుంది.
- issue: לְדָוִד సూచించే సంబంధం
  choice: దావీదుకు చెందినది
  alternative: దావీదు రచించినది
  rationale: హీబ్రూ לְ ఉపసర్గ రచయితత్వం సహా విస్తృతమైన ఆపాదన లేదా సంబంధాన్ని సూచించగలదు. కాబట్టి రచయితత్వాన్ని నిరాకరించకుండా, దానికే పరిమితం చేయకుండా అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన కీర్తన శీర్షిక శైలి వాడబడింది. ‘సంగీత నాయకుడు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ఎంచుకున్నాం. హీబ్రూ శీర్షికలోని ఆపాదనా అస్పష్టతను ‘చెందినది’ ద్వారా నిలిపి, మూలంలో లేని ‘కీర్తన’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
