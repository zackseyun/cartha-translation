id: PSA.36.10
reference: Psalms 36:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מְשֹׁ֣ךְ חַ֭סְדְּ/ךָ לְ/יֹדְעֶ֑י/ךָ וְ֝/צִדְקָֽתְ/ךָ֗ לְ/יִשְׁרֵי לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/010.yaml
  text: Continue your steadfast love to those who know you[b][a], and your righteousness to the upright in heart.
translation:
  language: te
  text: నిన్ను ఎరిగినవారికి నీ నిబద్ధ ప్రేమను కొనసాగించు[a]; హృదయంలో యథార్థులైనవారికి నీ నీతిని[b] కొనసాగించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ నిబద్ధ ప్రేమను పొడిగించు.” మూలంలోని క్రియకు అక్షరార్థంగా “లాగు” లేదా “చాచు” అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీ న్యాయాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשֹׁךְ
  choice: కొనసాగించు
  rationale: ఈ ఆజ్ఞారూప క్రియకు అక్షరార్థంగా ‘లాగు, పొడిగించు, చాచు’ అనే భావాలు ఉన్నాయి. దేవుని నిబద్ధ ప్రేమను, నీతిని కోరే ప్రార్థనలో ‘కొనసాగించు’ సహజమైన ఆధునిక తెలుగులో కాలపరంగా వాటిని ముందుకు పొడిగించాలనే భావాన్ని తెలియజేస్తుంది.
- source_word: חַסְדְּךָ
  choice: నీ నిబద్ధ ప్రేమను
  rationale: חֶסֶד కేవలం కనికరాన్ని కాక, సంబంధంలో నిలకడగా ఉండే విశ్వసనీయ ప్రేమను సూచిస్తుంది. ‘నిబద్ధ ప్రేమ’ ఈ విశ్వాస్యతను సహజంగా వ్యక్తం చేస్తుంది; ‘ఒడంబడిక ప్రేమ’ అని అనువదించి మూలంలో అంత స్పష్టంగా లేని భావాన్ని పరిమితం చేయదు.
- source_word: לְיֹדְעֶיךָ
  choice: నిన్ను ఎరిగినవారిపట్ల
  rationale: ఈ రూపం ‘నిన్ను ఎరిగినవారు’ అని అర్థం. ఇక్కడ ఎరుగుట కేవలం సమాచారం కలిగి ఉండటం కంటే సంబంధపూర్వక పరిచయాన్ని సూచించగలదు. לְ అనే ఉపసర్గను ఈ సందర్భంలో సహజమైన తెలుగుకోసం ‘పట్ల’గా వ్యక్తం చేశాం.
- source_word: וְצִדְקָתְךָ
  choice: నీ నీతిని
  rationale: צְדָקָה ‘నీతి’ లేదా సందర్భానుసారం ‘న్యాయం’ అని అర్థమవుతుంది. ఇక్కడ దేవుని నిబద్ధ ప్రేమతో సమాంతరంగా ఉన్నందున, ఆయన నైతిక విశ్వసనీయతను విస్తృతంగా నిలుపుకునే ‘నీతి’ని ప్రధాన పాఠంలో వాడాం.
- source_word: לְיִשְׁרֵי לֵב
  choice: యథార్థ హృదయం గలవారిపట్ల
  rationale: יָשָׁר అంటే ‘నిటారైన, యథార్థమైన, నీతిగా ఉన్న’ అని అర్థం. ‘యథార్థ హృదయం గలవారు’ అనే పదబంధం అంతరంగ నైతిక నిజాయితీని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుని నిబంధనాత్మక లక్షణాల సమాంతర వ్యక్తీకరణ
  choice: חֶסֶדను ‘నిబద్ధ ప్రేమ’గా, צְדָקָהను ‘నీతి’గా సమాంతరంగా అనువదించడం
  alternative: חֶסֶדను ‘కనికరం’గా, צְדָקָהను ‘న్యాయం’గా అనువదించడం
  rationale: ఈ వాక్యం దేవుడు తన ప్రజలపట్ల ప్రేమపూర్వక విశ్వసనీయతను, నైతిక నిబద్ధతను కొనసాగించాలని చేసే ప్రార్థన. ఎంచుకున్న పదాలు న్యాయస్థాన సంబంధమైన లేదా తరువాతి సిద్ధాంతపరమైన అర్థాన్ని అనవసరంగా రుద్దకుండా హెబ్రీ కవితా సమాంతరతను నిలుపుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కవితా శైలిని వాడాం. హెబ్రీ సమాంతరత స్పష్టంగా ఉండేందుకు ‘కొనసాగించు’ను రెండు పాదాల్లో పునరుక్తి చేశాం; ఇది తెలుగులో వాక్య సంబంధాన్ని స్పష్టం చేస్తుంది.
