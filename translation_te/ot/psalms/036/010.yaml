review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the imperative request, חֶסֶד as committed/steadfast love, and צְדָקָה as righteousness. However, לְ in both cola is more directly represented by a beneficiary expression (‘to/for’) than by పట్ల (‘toward/regarding’), and ישרי לב is better retained as an idiom of inward uprightness than rendered ‘those with a genuine heart.’
  naturalness: ‘కొనసాగించు’ is natural modern Telugu in this prayer context and can govern both coordinated objects. ‘హృదయంలో యథార్థులైనవారు’ is a clear, dignified, and more idiomatic rendering of the Hebrew expression than ‘యథార్థ హృదయం గలవారు.’
  terminology: ‘నిబద్ధ ప్రేమ’ appropriately conveys חֶסֶד without forcing an explicit covenantal term. ‘నీతి’ suitably renders צְדָקָה here; ‘న్యాయం’ remains a legitimate lexical alternative in the note.
  issues:
  - severity: low
    issue: The beneficiaries are rendered with పట్ల.
    rationale: The repeated Hebrew לְ introduces those who receive the requested divine action. వారికి (‘to/for them’) represents this relation more directly and preserves the parallelism.
  - severity: low
    issue: ‘యథార్థ హృదయం గలవారు’ slightly narrows ישרי לב.
    rationale: ‘యథార్థ’ can chiefly suggest truthfulness or genuineness, whereas the Hebrew idiom denotes persons who are upright in heart. ‘హృదయంలో యథార్థులైనవారు’ preserves the inward-moral sense more clearly.
  revised_text: నిన్ను ఎరిగినవారికి నీ నిబద్ధ ప్రేమను కొనసాగించు[a]; హృదయంలో యథార్థులైనవారికి నీ నీతిని[b] కొనసాగించు.
