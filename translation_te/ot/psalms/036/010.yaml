revisions:
- from: నిన్ను ఎరిగినవారిపట్ల నీ నిబద్ధ ప్రేమను కొనసాగించు[a]; యథార్థ హృదయం గలవారిపట్ల నీ నీతిని[b] కొనసాగించు.
  to: నిన్ను ఎరిగినవారికి నీ నిబద్ధ ప్రేమను కొనసాగించు[a]; హృదయంలో యథార్థులైనవారికి నీ నీతిని[b] కొనసాగించు.
  rationale: The revision makes the two לְ-phrases explicit as parallel beneficiaries and strengthens the rendering of ישרי לב as inward uprightness. It retains the draft’s sound choices for ‘steadfast love,’ ‘righteousness,’ and the contextual sense of the imperative, while keeping the poetic parallelism and both footnote anchors intact.
  reviewer_model: gpt-5.6-terra
