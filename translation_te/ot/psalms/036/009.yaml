review_pass:
  verdict: revise
  source_fidelity: The principal imagery and the repeated ‘light’ are retained well. However, the emphatic particle ‘-నే’ in both clauses adds exclusivity/emphasis not explicitly marked in the Hebrew. Also, ‘నీతోనే ... ఉంది’ is less natural Telugu for the Hebrew idiom ‘with you is’; ‘నీ వద్ద’ expresses the source/presence sense more idiomatically without interpretive expansion.
  naturalness: ‘జీవపు ఊట’ and ‘నీ వెలుగులో మేము వెలుగును చూస్తాము’ are clear, poetic, and modern-standard Telugu. ‘నీ వద్ద జీవపు ఊట ఉంది’ is more natural than ‘నీతోనే జీవపు ఊట ఉంది.’
  terminology: ‘ఊట’ suitably renders מְקוֹר as a spring/fountain, and ‘జీవపు’ appropriately conveys the construct relation with ‘life.’ ‘వెలుగు’ is correctly repeated for the Hebrew wordplay. The footnote alternative ‘జలధార’ refers more naturally to a flowing stream than to a spring/source; ‘బుగ్గ’ is a closer Telugu lexical alternative for a natural spring.
  issues:
  - severity: low
    issue: Unwarranted emphatic particles
    rationale: The two instances of ‘నే’ introduce added emphasis/exclusivity. The Hebrew has neither an explicit restrictive particle nor a construction requiring this emphasis.
  - severity: medium
    issue: Idiomatic rendering of עִמְּךָ
    rationale: In this context ‘నీతోనే జీవపు ఊట ఉంది’ is syntactically understandable but unnatural in Telugu. ‘నీ వద్ద జీవపు ఊట ఉంది’ naturally conveys that the fountain of life is found with God/at God’s disposal while preserving the metaphor.
  - severity: low
    issue: Footnote alternative ‘జలధార’
    rationale: ‘జలధార’ normally denotes a stream or flow, whereas מְקוֹר denotes a spring, fountainhead, or source. ‘బుగ్గ’ more closely represents a natural spring.
  revised_text: ఎందుకంటే నీ వద్ద జీవపు ఊట ఉంది[a]; నీ వెలుగులో మేము వెలుగును చూస్తాము[b].
