lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి సందర్భంలో చెప్పిన స్తుతి లేదా ప్రార్థనకు కారణాన్ని పరిచయం చేసే అనుసంధాన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עִמְּךָ
  choice: నీతోనే
  rationale: עִם అనే పూర్వప్రత్యయానికి ఉన్న ప్రత్యక్షమైన ‘నీతో’ భావాన్ని కాపాడుతుంది; ‘నే’ పదం జీవపు ఊట దేవుని దగ్గరే ఉందనే కవితాత్మక ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: מְקוֹר
  choice: ఊట
  rationale: నీరు ఉబికివచ్చే సహజ జలస్థానాన్ని సూచించే కవితాత్మక రూపకాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: חַיִּים
  choice: జీవపు
  rationale: రూపపరంగా బహువచనమైనా, ఇక్కడ భావవాచకంగా ‘జీవం’ అని అర్థం; ‘జీవపు ఊట’ హీబ్రూ నామవాచక సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: בְּאוֹרְךָ
  choice: నీ వెలుగులోనే
  rationale: בְ లోని స్థితి లేదా పరిధి భావాన్ని ‘లో’ ద్వారా నిలుపుతుంది; దానిని కేవలం సాధనార్థకంగా పరిమితం చేయదు.
- source_word: נִרְאֶה
  choice: మేము చూస్తాము
  rationale: కవితా సందర్భంలోని సాధారణ వర్తమాన సత్యాన్ని సహజమైన తెలుగు క్రియారూపంతో వ్యక్తం చేస్తుంది.
- source_word: אוֹר
  choice: వెలుగును
  rationale: మూలంలోని אוֹר పద పునరుక్తిని కాపాడి, దాని కవితాత్మక బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవిక జీవం, వెలుగు రూపకాల భావం
  choice: ‘జీవపు ఊట,’ ‘నీ వెలుగులోనే మేము వెలుగును చూస్తాము’ అనే రూపకాలను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపడం
  alternative: ‘నీవే సమస్త జీవానికి మూలం’ లేదా ‘నీ సత్యం ద్వారా మేము గ్రహిస్తాము’ అని వివరణాత్మకంగా మార్చడం
  rationale: మూలవచనం దేవుడు జీవానికి మూలమనీ, ఆయన వెలుగులోనే వెలుగు దర్శనమవుతుందనీ సమృద్ధమైన కవితాత్మక భాషలో చెబుతుంది. దానిని ఒక నిర్దిష్ట సిద్ధాంతార్థానికి పరిమితం చేయకుండా అసలు రూపకాన్నీ దాని భావ ఉద్వేగాన్నీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కవితా శైలి. మూలంలోని ‘జీవం/ఊట’ మరియు ‘వెలుగు/వెలుగు’ రూపకాలనూ పునరుక్తినీ కాపాడింది.
