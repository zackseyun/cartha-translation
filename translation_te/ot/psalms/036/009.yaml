  text: ఎందుకంటే నీ వద్ద జీవపు ఊట ఉంది[a]; నీ వెలుగులో మేము వెలుగును చూస్తాము[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘జీవపు బుగ్గ’ లేదా ‘జీవానికి మూలం.’
