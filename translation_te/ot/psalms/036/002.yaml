source:
  edition: WLC
  text: כִּֽי הֶחֱלִ֣יק אֵלָ֣י/ו בְּ/עֵינָ֑י/ו לִ/מְצֹ֖א עֲוֺנ֣/וֹ לִ/שְׂנֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/002.yaml
  text: For he flatters himself in his own eyes too much to find his iniquity and hate it[a].
translation:
  language: te
  text: ఎందుకంటే, తన దోషాన్ని గుర్తించి దాన్ని ద్వేషించలేనంతగా అతడు తన దృష్టిలో తనను తాను పొగుడుకుంటాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “ఎందుకంటే, అతడు తన దృష్టిలో తనకొరకు నునుపు చేసుకుంటాడు—తన దోషాన్ని కనుగొనడానికి, ద్వేషించడానికి.” హెబ్రీ వాక్యనిర్మాణం క్లిష్టంగా ఉంది. తనను తాను పొగుడుకోవడం వల్ల అతడు తన పాపాన్ని గుర్తించి తిరస్కరించలేడనేది ఒక సాధ్యమైన భావం; “తన దోషం ద్వేషార్హమని కనుగొనడం” అనే భావం కూడా సాధ్యమే.'
    reason: మూలంలోని ‘నునుపు చేయడం’ అనే రూపకాన్ని, అలాగే చివరి రెండు క్రియార్థక రూపాల మధ్య ఉన్న క్లిష్టమైన సంబంధాన్ని చూపించడానికి.
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని మాటకు కారణాన్ని లేదా వివరణను పరిచయం చేస్తుంది.
- source_word: הֶחֱלִיק אֵלָיו
  choice: తనను తాను పొగుడుకుంటాడు
  rationale: חלק హిఫీల్ రూపానికి అక్షరార్థంగా ‘నునుపు చేయడం’ అనే భావం ఉంది; ఇక్కడ స్వీయసంబంధ ప్రయోగంలో తన తప్పును కప్పిపుచ్చుకునేలా తనను తాను మెచ్చుకోవడం లేదా పొగుడుకోవడం అనే సహజమైన భావాన్ని ఇస్తుంది.
- source_word: בְּעֵינָיו
  choice: తన దృష్టిలో
  rationale: వ్యక్తి తనను తాను ఎలా అంచనా వేసుకుంటాడో తెలిపే హెబ్రీ నుడికారాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לִמְצֹא
  choice: గుర్తించి
  rationale: మూలార్థం ‘కనుగొనడం’; ఇక్కడ తన నైతిక దోషాన్ని గ్రహించడం అనే సందర్భార్థాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עֲוֺנוֹ
  choice: తన దోషాన్ని
  rationale: עָוֹן సూచించే పాపపూరితమైన తప్పు లేదా అపరాధభావాన్ని సాధారణ పాఠకులకు స్పష్టంగా, గంభీరంగా అందిస్తుంది.
- source_word: לִשְׂנֹא
  choice: దాన్ని ద్వేషించ
  rationale: క్రియకు సూచిత కర్మగా ముందున్న ‘దోషం’ను ‘దాన్ని’తో స్పష్టం చేసింది; దోషాన్ని గుర్తించిన తరువాత దానిని తిరస్కరించే నైతిక స్పందనను నిలుపుతుంది.
- source_word: לִמְצֹא עֲוֺנוֹ לִשְׂנֹא
  choice: తన దోషాన్ని గుర్తించి దాన్ని ద్వేషించలేనంతగా
  rationale: క్లిష్టమైన రెండు క్రియార్థక రూపాల సంబంధాన్ని, స్వీయపొగడ్త తన దోషాన్ని గుర్తించి తిరస్కరించకుండా అడ్డుకుంటుందనే సందర్భోచిత భావంతో అనువదిస్తుంది; ఇతర సాధ్యమైన నిర్మాణాలను పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: వచనంలోని నైతిక-మానసిక భావం
  choice: దుష్టుడు తనను తాను పొగుడుకోవడం వల్ల తన దోషాన్ని గుర్తించి ద్వేషించలేకపోతున్నాడు.
  alternative: అతడు తన దృష్టిలో తనకొరకు విషయాలను నునుపు చేసుకుంటాడు—తన దోషాన్ని కనుగొనడానికి, ద్వేషించడానికి; లేదా తన దోషం ద్వేషార్హమని కనుగొనే వరకు తనను తాను పొగుడుకుంటాడు.
  rationale: కీర్తన 36 సందర్భం దుష్టుని అంతర్గత మోసాన్ని సూచిస్తుంది. అయితే హెబ్రీ వాక్యనిర్మాణం క్లిష్టమైనందున ప్రత్యామ్నాయ సంబంధాలను పాదసూచికలో స్పష్టంగా ఉంచి, నిజమైన అనిశ్చితిని తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం వాడుతూ, కీర్తనకు తగిన గంభీరతను నిలిపింది. ప్రధాన పాఠంలో సందర్భోచిత భావాన్ని ఇచ్చి, హెబ్రీ మూలంలోని క్లిష్టతను పాదసూచికలో సంరక్షించింది.
