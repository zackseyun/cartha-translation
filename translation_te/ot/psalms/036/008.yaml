  yaml_path: translation/ot/psalms/036/008.yaml
  text: They are filled from the richness of your house[b][a], and you give them drink from the river of your delights.
translation:
  language: te
  text: నీ ఇంటి సమృద్ధిని వారు తనివితీరా పొందుతారు[a]; నీ ఆనందాల నది నుండి నీవు వారికి త్రాగుటకు ఇస్తావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ ఇంటి సమృద్ధితో వారు తృప్తి పొందుతారు.’
    reason: lexical_alternative
  - marker: b
    text: ‘నీ ఆనందాలు’ అనే మాటను ‘నీ సుఖాలు’ అని కూడా అనువదించవచ్చు; హీబ్రూలో ఇది ‘ఏదేను’ను ప్రతిధ్వనింపజేసే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְוְיוּן
  choice: వారు తృప్తి పొందుతారు
  rationale: רוה అనే క్రియ ఇక్కడ సమృద్ధిగా తృప్తి చెందడం లేదా తనివితీరా పొందడం అనే ఫలితభావాన్ని తెలియజేస్తుంది. సహజమైన ఆధునిక తెలుగులో ఆ భావాన్ని ‘తృప్తి పొందుతారు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מִדֶּשֶׁן
  choice: సమృద్ధితో
  rationale: דֶּשֶׁן అక్షరార్థంగా కొవ్వుదనం, రూపకాలంకారంగా సారవంతమైన సమృద్ధి లేదా ఐశ్వర్యాన్ని సూచిస్తుంది. ‘సమృద్ధి’ కవితాత్మక భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: בֵּיתֶךָ
  choice: నీ ఇంటి
  rationale: హీబ్రూ పదం సాధారణంగా ‘ఇల్లు’ అని అర్థం. దేవాలయం లేదా పరలోక నివాసమని ప్రత్యేకంగా నిర్ణయించకుండా మూలంలోని విస్తృత చిత్రణను నిలుపుతుంది.
- source_word: וְנַחַל
  choice: నది నుండి
  rationale: נַחַל వాగు, ప్రవాహం లేదా నది కావచ్చు. దైవిక సమృద్ధిని వర్ణించే ఈ కవితాత్మక సందర్భంలో ‘నది’ జీవదాయకమైన నిండుదనాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עֲדָנֶיךָ
  choice: నీ ఆనందాల
  rationale: עֵדֶן మూలానికి ఆనందం, సుఖం, విలాసం అనే అర్థాలు ఉన్నాయి. బహువచన రూపాన్ని ‘ఆనందాలు’గా ఉంచడం మూలంలోని భావాన్ని కాపాడుతుంది; ఏదేను గురించిన సంభావ్య ప్రతిధ్వనిని ప్రధాన పాఠ్యంలో స్పష్టార్థంగా మార్చదు.
- source_word: תַשְׁקֵם
  choice: నీవు వారికి త్రాగనిస్తావు
  rationale: שקה హిఫిల్ రూపం ‘వారిని త్రాగేటట్లు చేయడం’ లేదా ‘వారికి త్రాగనివ్వడం’ అని అర్థం. ఈ అనువాదం దేవుని క్రియాశీల అనుగ్రహాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: దేవుని ‘ఇల్లు’ అనే చిత్రణ
  choice: ‘నీ ఇల్లు’ అని నిర్దిష్టీకరించకుండా ఉంచడం
  alternative: ‘నీ దేవాలయం’, ‘నీ నివాసం’ లేదా ‘నీ గృహస్థులు’
  rationale: హీబ్రూ పాఠ్యం దేవుని సమీపంలో లభించే పోషణను కవితాత్మకంగా చిత్రిస్తుంది గాని, అది దేవాలయమా, పరలోక నివాసమా, లేక గృహసముదాయమా అని నిర్బంధంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలిని ఉపయోగించాం. ‘ఇల్లు’, ‘సమృద్ధి’, ‘ఆనందాలు’ అనే మూల చిత్రాలను అతిగా వివరణాత్మకం చేయకుండా నిలిపాం.
