id: PSA.36.11
reference: Psalms 36:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַל תְּ֭בוֹאֵ/נִי רֶ֣גֶל גַּאֲוָ֑ה וְ/יַד רְ֝שָׁעִ֗ים אַל תְּנִדֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/011.yaml
  text: Let not the foot of pride come against me[b][a], and let not the hand of the wicked drive me away.
translation:
  language: te
  text: గర్వపు పాదం నా మీదికి రానివ్వకు[a]; దుష్టుల చేయి నన్ను తరిమివేయనివ్వకు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా దగ్గరికి రానివ్వకు.’ హీబ్రూ నుడికారం అక్షరార్థంగా ‘గర్వపు పాదం నా దగ్గరికి రానివ్వకు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నన్ను అటుఇటు తిరిగేలా చేయనివ్వకు’ లేదా ‘నన్ను పారిపోయేలా చేయనివ్వకు.’ ఈ క్రియ ఒకరిని తన స్థానం నుంచి కదిలించడం లేదా వెళ్లగొట్టడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּבוֹאֵנִי
  choice: నా మీదికి రానివ్వకు
  rationale: בוא అనే క్రియకు సాధారణంగా ‘రావడం’ అనే అర్థం ఉన్నా, ‘గర్వపు పాదం’ అనే కర్తతో ఇక్కడ శత్రుత్వంతో సమీపించడం సూచితమవుతుంది. ‘నా మీదికి రావడం’ ఆ భావాన్ని సహజమైన తెలుగులో ఉంచుతూ మూలంలోని రూపకాన్ని కాపాడుతుంది.
- source_word: רֶגֶל גַּאֲוָה
  choice: గర్వపు పాదం
  rationale: ఇది మూలంలోని ‘గర్వం యొక్క పాదం’ అనే కావ్యరూపకాన్ని నిలుపుతుంది. ‘గర్విష్ఠుల పాదం’ అని అనువదిస్తే అమూర్తమైన ‘గర్వం’ను వ్యక్తులుగా వ్యాఖ్యానించినట్లవుతుంది.
- source_word: יַד רְשָׁעִים
  choice: దుష్టుల చెయ్యి
  rationale: బహువచన విశేషణం నామవాచకంగా వాడబడినందున ‘దుష్టులు’ సహజమైన సమూహార్థక అనువాదం. ‘చెయ్యి’ మూలంలోని శక్తి లేదా కార్యసాధనను సూచించే రూపకాన్ని నిలుపుతుంది.
- source_word: תְּנִדֵנִי
  choice: నన్ను తరిమివేయనివ్వకు
  rationale: హిఫిల్ రూపం ఒకరిని తన స్థానం నుంచి కదిలించడం, పారదోలడం లేదా సంచరించేలా చేయడం అనే భావాన్ని ఇస్తుంది. సందర్భంలోని శత్రుత్వానికి ‘తరిమివేయడం’ స్పష్టంగా, సహజంగా సరిపోతుంది.
- source_word: אַל
  choice: రానివ్వకు / తరిమివేయనివ్వకు
  rationale: జస్సివ్ రూపాలతో కూడిన אַל ప్రార్థనాత్మక నిషేధాన్ని లేదా వేడుకోలును వ్యక్తం చేస్తుంది. తెలుగులో ‘నివ్వకు’ నిర్మాణం ఆ భావాన్ని సహజంగా అందిస్తుంది.
