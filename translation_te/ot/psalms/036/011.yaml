translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి ఉపయోగించబడింది. ‘గర్వపు పాదం,’ ‘దుష్టుల చెయ్యి’ అనే హీబ్రూ సమాంతర రూపకాలు అలాగే నిలుపబడ్డాయి; అస్పష్టమైన క్రియార్థాలకు పాదటిప్పణులు ఇచ్చబడ్డాయి.
