  edition: WLC
  text: צִדְקָֽתְ/ךָ֨ כְּֽ/הַרְרֵי אֵ֗ל מִ֭שְׁפָּטֶ/ךָ תְּה֣וֹם רַבָּ֑ה אָ֤דָֽם וּ/בְהֵמָ֖ה תוֹשִׁ֣יעַ יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/006.yaml
  text: Your righteousness is like the mountains of God[a]; your judgments are a great deep. O Yahweh[b], you save man and beast.
translation:
  language: te
  text: 'నీ నీతి దేవుని పర్వతాలవంటిది[a];

    నీ తీర్పులు మహా అగాధంవంటివి.

    యహ్వే, నీవు మనుష్యులను, జంతువులను రక్షిస్తావు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘దేవుని పర్వతాలు’; ఇది ‘బలమైన పర్వతాలు’ లేదా ‘అత్యున్నత పర్వతాలు’ అనే భావాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘మనిషిని, జంతువును రక్షిస్తావు’; ఇక్కడ అవి మానవజాతినీ జంతుజాతినీ సమష్టిగా సూచిస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקָתְךָ
  choice: నీ నీతి
  rationale: దేవుని నైతిక న్యాయత్వాన్నీ, ఒడంబడికకు అనుగుణమైన సత్యనిష్ఠనూ సూచించే విస్తృత భావాన్ని ‘నీతి’ సహజంగా నిలుపుతుంది; ‘న్యాయం’ ఇక్కడ కొంత సంకుచితంగా ఉంటుంది.
- source_word: כְּהַרְרֵי אֵל
  choice: దేవుని పర్వతాలవంటిది
  rationale: ‘దేవుని పర్వతాలు’ అనే హీబ్రూ నిర్మాణాన్ని ప్రధాన పాఠ్యంలో పారదర్శకంగా నిలిపి, అది బలమైన లేదా అత్యున్నత పర్వతాలు అనే అతిశయార్థాన్ని సూచించే అవకాశాన్ని పాదటీకలో ఉంచాం.
- source_word: מִשְׁפָּטֶךָ
  choice: నీ తీర్పులు
  rationale: దేవుని న్యాయనిర్ణయాలు లేదా న్యాయకార్యాలను సూచించే బహువచన భావాన్ని ‘తీర్పులు’ నిలుపుతుంది; ముందున్న ‘నీతి’తో పదభేదమూ కాపాడబడుతుంది.
- source_word: תְּהוֹם רַבָּה
  choice: మహా అగాధంవంటివి
  rationale: కొలవలేనంత లోతైన జలరాశి లేదా అగాధం అనే కవితాత్మక చిత్రాన్ని ‘మహా అగాధం’ సహజమైన తెలుగులో నిలుపుతుంది; ఉపమాన సమాంతరత స్పష్టమయ్యేలా ‘వంటివి’ చేర్చబడింది.
- source_word: אָדָם
  choice: మనుష్యులను
  rationale: ఇక్కడ אָדָם ఒక వ్యక్తిగత పురుషుణ్ణి కాక మానవజాతిని సమష్టిగా సూచిస్తుంది. ఆధునిక తెలుగులో ‘మనుష్యులను’ ఈ సాధారణ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּבְהֵמָה
  choice: జంతువులను
  rationale: ఈ సందర్భంలో ఈ పదం పశువులకు మాత్రమే పరిమితం కాక జంతువులను విస్తృతంగా సూచించగలదు; ‘మనుష్యులు—జంతువులు’ అనే సమగ్ర జతను ఇది స్పష్టంగా అందిస్తుంది.
- source_word: תוֹשִׁיעַ
  choice: రక్షిస్తావు
  rationale: హిఫిల్ రూపంలోని రక్షించడం, విడిపించడం, కాపాడడం అనే విస్తృత భావాన్ని ‘రక్షిస్తావు’ నిలుపుతుంది; దైవ పరిరక్షణ భావాన్ని నిరోధించదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: ప్రత్యక్ష సంబోధనలోని దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో అందించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో బిరుదు కాక చతురక్షర దైవనామమే ఉంది. కాబట్టి వ్యక్తిగత నామాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- issue: אָדָם యొక్క సాధారణ మానవార్థం
  choice: మనుష్యులను
  alternative: మనిషిని
  rationale: ఏకవచన రూపం ఉన్నప్పటికీ, జంతువులతో జతచేయబడిన ఈ సందర్భంలో అది మానవజాతిని సమష్టిగా సూచిస్తుంది. తెలుగు సహజ వాడుకలో బహువచనం ఆ సమగ్రార్థాన్ని స్పష్టంగా తెలియజేస్తుంది; మూలంలోని ఏకవచన రూపం పాదటీకలో సూచించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని అనుసరించాం. మొదటి రెండు పాదాల సమాంతర ఉపమాన నిర్మాణాన్ని స్పష్టంగా ఉంచి, చివరి పాదంలో ప్రత్యక్ష సంబోధనను సహజంగా నిలిపాం.
