  text: מַה יָּקָ֥ר חַסְדְּ/ךָ֗ אֱלֹ֫הִ֥ים וּ/בְנֵ֥י אָדָ֑ם בְּ/צֵ֥ל כְּ֝נָפֶ֗י/ךָ יֶחֱסָיֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/007.yaml
  text: How precious is your steadfast love[b][a], O God! The children of man take refuge in the shadow of your wings.
translation:
  language: te
  text: దేవా, నీ నిబద్ధ ప్రేమ ఎంత అమూల్యమైనది![a] మానవులు నీ రెక్కల నీడలో ఆశ్రయిస్తారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నిబద్ధ ప్రేమ” అని అనువదించిన హీబ్రూ పదం హెసెద్; ఇందులో కరుణ, విశ్వసనీయ ప్రేమ, సంబంధ నిబద్ధత లేదా ఒడంబడిక నిబద్ధత అనే భావాలు కూడా ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “మనుష్యుల కుమారులు”; అంటే సాధారణంగా మానవులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה יָּקָר
  choice: ఎంత అమూల్యమైనది
  rationale: ప్రశ్నగా కాక ఆశ్చర్యం, ప్రశంస వ్యక్తం చేసే హీబ్రూ ఉద్ఘాటనను సహజమైన తెలుగు కవితా శైలిలో వ్యక్తపరుస్తుంది; יקר లోని అధిక విలువ భావాన్ని నిలుపుతుంది.
- source_word: חַסְדְּךָ
  choice: నీ నిబద్ధ ప్రేమ
  rationale: חֶסֶד లోని ప్రేమ, విశ్వసనీయత, స్థిరమైన అనుబంధం అనే భావాలను సంక్షిప్తంగా మోస్తుంది; కేవలం ‘కరుణ’ అని పరిమితం చేయదు.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ఇది ప్రత్యక్ష సంబోధన; తెలుగు సంబోధన రూపం హీబ్రూ వాక్యబలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּבְנֵי אָדָם
  choice: మానవులు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఆదాము కుమారులు/మనుష్యుల కుమారులు’ అయినా, ఇక్కడ సాధారణంగా సమస్త మానవులను సూచిస్తుంది. ‘మానవులు’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా అదే సమష్టి భావాన్ని అందిస్తుంది.
- source_word: בְּצֵל כְּנָפֶיךָ
  choice: నీ రెక్కల నీడలో
  rationale: దైవిక రక్షణను తెలిపే పక్షి-రూపకాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: יֶחֱסָיוּן
  choice: ఆశ్రయం పొందుతారు
  rationale: חסה అనే క్రియలోని రక్షణ కోసం ఆశ్రయించడం అనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; రూపకాన్ని వివరణాత్మకంగా విస్తరించదు.
theological_decisions:
- issue: חֶסֶד యొక్క విస్తృత భావపరిధి
  choice: నిబద్ధ ప్రేమ
  alternative: కరుణ; విశ్వసనీయ ప్రేమ; ఒడంబడిక విశ్వసనీయత
  rationale: ఈ పదంలో ప్రేమ, దయ, విశ్వసనీయత, సంబంధ నిబద్ధత కలిసి ఉన్నాయి. ‘నిబద్ధ ప్రేమ’ వాటిలో ఏ ఒక్కదానికే భావాన్ని పరిమితం చేయకుండా ప్రధాన ఉద్వేగాన్ని నిలుపుతుంది; పాదటిప్పణి మిగిలిన భావపరిధిని తెలియజేస్తుంది.
- issue: בְנֵי אָדָם అనే సమష్టి మానవ సూచన
  choice: మానవులు
  alternative: మనుష్యుల కుమారులు
  rationale: హీబ్రూ రూపం పుంలింగ బహువచనమైనా, భావం మానవజాతిని సాధారణంగా సూచిస్తుంది. ‘మానవులు’ లింగపరంగా, అర్థపరంగా ఖచ్చితమైన సహజ తెలుగు; అక్షర రూపాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవభరిత కవితా శైలి. ‘రెక్కల నీడ’ అనే మూల రూపకం నిలుపబడింది. హీబ్రూ సంధికారకాన్ని విడిగా అనువదించకుండా తెలుగు ప్రవాహానికి అనుగుణంగా రెండు వాక్యాలుగా మలిచాం.
