source:
  edition: WLC
  text: כִּ֤י יְהוָ֨ה אֹ֘הֵ֤ב מִשְׁפָּ֗ט וְ/לֹא יַעֲזֹ֣ב אֶת חֲ֭סִידָי/ו לְ/עוֹלָ֣ם נִשְׁמָ֑רוּ וְ/זֶ֖רַע רְשָׁעִ֣ים נִכְרָֽת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/028.yaml
  text: For Yahweh loves justice and does not forsake his faithful ones[a]; they are kept forever[b], but the offspring of the wicked will be cut off.
translation:
  language: te
  text: 'ఎందుకంటే యాహ్వే న్యాయాన్ని ప్రేమిస్తాడు;

    తన విశ్వాసపాత్రులను[a] విడిచిపెట్టడు.

    వారు ఎప్పటికీ కాపాడబడతారు[b];

    అయితే దుష్టుల సంతతి నిర్మూలించబడుతుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తన భక్తులను,’ ‘తన నిష్ఠావంతులను.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూను మరింత బిగువుగా కలిపి, ‘తన విశ్వాసపాత్రులు ఎప్పటికీ కాపాడబడతారు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ నామానికి దగ్గరైన తెలుగు లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: אֹהֵב
  choice: ప్రేమిస్తాడు
  rationale: אהב అనే పదం ఇక్కడ న్యాయం పట్ల యాహ్వేకు ఉన్న స్థిరమైన అనురక్తిని నేరుగా తెలియజేస్తుంది.
- source_word: מִשְׁפָּט
  choice: న్యాయాన్ని
  rationale: ఈ సందర్భంలో ఇది కేవలం తీర్పు ప్రక్రియను కాక, న్యాయమైనది మరియు సరిగా ఉన్నదాన్ని సూచిస్తుంది.
- source_word: יַעֲזֹב
  choice: విడిచిపెట్టడు
  rationale: עזב యొక్క ‘వదలడం/పరిత్యజించడం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חֲסִידָיו
  choice: తన విశ్వాసపాత్రులను
  rationale: חסדతో సంబంధమున్న నిష్ఠ, భక్తి, ఒడంబడిక విశ్వాసం అనే భావాలను మతపరమైన సాంకేతిక పదానికి పరిమితం చేయకుండా తెలియజేస్తుంది.
- source_word: לְעוֹלָם
  choice: ఎప్పటికీ
  rationale: దీర్ఘకాలికమైన, అంతంలేని కొనసాగింపును సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: נִשְׁמָרוּ
  choice: కాపాడబడతారు
  rationale: שמר యొక్క నిఫ్అల్ రూపంలో ఉన్న కాపాడబడటం లేదా సంరక్షించబడటం అనే కర్మణి భావాన్ని నిలుపుతుంది.
- source_word: זֶרַע
  choice: సంతతి
  rationale: ఇక్కడ זֶרַע విత్తనాన్ని కాక దుష్టుల భావి వంశాన్ని లేదా వారసులను సమష్టిగా సూచిస్తుంది.
- source_word: רְשָׁעִים
  choice: దుష్టులు
  rationale: కీర్తనలోని జ్ఞానసాహిత్య విరుద్ధతకు సరిపోయే ప్రామాణికమైన, స్పష్టమైన తెలుగు పదం.
- source_word: נִכְרָת
  choice: నిర్మూలించబడుతుంది
  rationale: ‘నరికివేయబడటం/తొలగించబడటం’ అనే హీబ్రూ రూపకానికి, సంతతి సందర్భంలో సహజంగా వినిపించే న్యాయపరమైన అంతం భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: חֲסִידָיו పదం సూచించే ప్రజలు మరియు దాని భావబలం
  choice: ‘తన విశ్వాసపాత్రులు’ అని అనువదించి, యాహ్వే పట్ల నిష్ఠతో ఉండే ప్రజలను సూచించాం.
  alternative: ‘తన భక్తులు’ లేదా ‘తన నిష్ఠావంతులు’
  rationale: ఈ పదం భక్తి, కృపతో ముడిపడిన నిష్ఠ, ఒడంబడిక విశ్వాసం వంటి పరస్పర సంబంధ భావాలను కలిగి ఉంది; ‘విశ్వాసపాత్రులు’ వాటిని ఏ ఒక్క తరువాతి మతసాంకేతిక అర్థానికీ పరిమితం చేయదు.
- issue: మధ్యలోని రెండు వాక్యభాగాల పరస్పర సంబంధం
  choice: ‘విడిచిపెట్టడు. వారు ఎప్పటికీ కాపాడబడతారు’ అనే రెండు పరస్పరపూరక ప్రకటనలుగా ఉంచాం.
  alternative: ‘తన విశ్వాసపాత్రులు ఎప్పటికీ కాపాడబడతారు’ అని మరింత బిగువైన ఒకే వాక్యభాగంగా చదవడం
  rationale: హీబ్రూ పదక్రమం రెండవ ప్రకటనను మొదటిదానికి వివరణగా చదవడానికి వీలు ఇస్తుంది; ప్రధాన పాఠం రెండు క్రియల బలాన్ని నిలిపి, ప్రత్యామ్నాయ అనుసంధానాన్ని పాదసూచికలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, కీర్తనకు తగిన గంభీరతతో రూపొందించాం. కవితా సమాంతరత కోసం పాద విభజనను ఉంచాం; దైవనామాన్ని ‘యాహ్వే’గా నిలిపాం.
