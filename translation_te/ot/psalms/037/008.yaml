  terminology: “కోపం” for אַף and “ఉగ్రత” for חֵמָה preserve the Hebrew’s deliberate pairing of ordinary anger with more intense fury. “కీడు చేయడం” is a suitable ethical rendering of the רעע infinitive. The footnote is clearly anchored at the final clause and accurately records the literal alternative.
