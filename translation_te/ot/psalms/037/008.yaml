source:
  edition: WLC
  text: הֶ֣רֶף מֵ֭/אַף וַ/עֲזֹ֣ב חֵמָ֑ה אַל תִּ֝תְחַ֗ר אַךְ לְ/הָרֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/008.yaml
  text: Let go of anger[a], and abandon wrath[b]; do not be provoked—it only leads to evil.
translation:
  language: te
  text: కోపాన్ని విడిచిపెట్టు, ఉగ్రతను వదిలివేయి; రగిలిపోకు—అది కీడు చేయడానికే దారితీస్తుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: చివరి మాటలను మరింత అక్షరార్థంగా, “కీడు చేయడానికే” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: הֶרֶף מֵאַף
  choice: కోపాన్ని విడిచిపెట్టు
  rationale: רפה ఆజ్ఞారూపం ఇక్కడ పట్టును వదలడం లేదా మానుకోవడం అనే భావాన్ని ఇస్తుంది; אַף యొక్క సాధారణ రూపకాల అర్థం ‘కోపం’. ఈ తెలుగు పదబంధం ఆజ్ఞను సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַעֲזֹב חֵמָה
  choice: ఉగ్రతను వదిలివేయి
  rationale: עזב అంటే వదలడం/త్యజించడం; חֵמָה తీవ్రమైన, మండే కోపాన్ని సూచిస్తుంది. ‘ఉగ్రత’ ముందున్న ‘కోపం’తో తేడాను నిలుపుతూ కవితాత్మక సమాంతరాన్ని కాపాడుతుంది.
- source_word: אַל תִּתְחַר
  choice: రగిలిపోకు
  rationale: חרה హిత్పయేల్ రూపం వేడెక్కడం, ఆగ్రహంతో రగిలిపోవడం లేదా కలవరపడడం అనే భావాలను కలిగి ఉంది. ‘రగిలిపోకు’ మూలంలోని వేడి రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אַךְ לְהָרֵעַ
  choice: అది కీడు చేయడానికే దారితీస్తుంది
  rationale: אַךְ పరిమితిని బలపరుస్తుంది; לְతో కూడిన רעע ధాతువు ఉద్దేశం లేదా ఫలితాన్ని సూచించవచ్చు. సందర్భంలో కోపోద్రేకం దుష్కార్యానికి నడిపిస్తుందనే హెచ్చరికను ఈ అనువాదం వ్యక్తం చేస్తుంది; మరింత అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
theological_decisions:
- issue: చివరి పదబంధంలోని ఉద్దేశం–ఫలితం సందిగ్ధత
  choice: కోపంతో రగిలిపోవడం కీడు చేయడానికి దారితీసే ఫలితంగా ప్రధాన పాఠ్యంలో చూపడం
  alternative: ‘కీడు చేయడానికే’ లేదా ‘కీడు చేయుటకే’ అని సంక్షిప్తంగా ఉద్దేశార్థంలో అనువదించడం
  rationale: לְהָרֵעַ ఉద్దేశాన్నీ ఫలితాన్నీ సూచించగలదు. కీర్తన సందర్భం ఫలితార్థానికి మద్దతిచ్చినా, హెబ్రీ పాఠ్యంలోని సంక్షిప్తత మరియు సందిగ్ధతను పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కవితాత్మక ఆజ్ఞాశైలిని ఉపయోగించాం. ‘కోపం/ఉగ్రత’ సమాంతరాన్ని, ‘రగిలిపోవడం’ అనే వేడి రూపకాన్ని నిలిపాం.
