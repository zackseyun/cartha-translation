  source_fidelity: 'The Telugu accurately represents the paired Hebrew imperatives: ceasing from anger, abandoning wrath, and not becoming heated/agitated. “రగిలిపోకు” appropriately retains the heat and emotional agitation of תִּתְחַר. The final “అది కీడు చేయడానికే దారితీస్తుంది” responsibly presents the contextual result sense of אַךְ לְהָרֵעַ without excluding the more compact purposive rendering supplied in the note.'
