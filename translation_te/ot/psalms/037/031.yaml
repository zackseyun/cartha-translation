id: PSA.37.31
reference: Psalms 37:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: תּוֹרַ֣ת אֱלֹהָ֣י/ו בְּ/לִבּ֑/וֹ לֹ֖א תִמְעַ֣ד אֲשֻׁרָי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/031.yaml
  text: The law of his God is in his heart[a]; his steps do not slip.
translation:
  language: te
  text: అతని దేవుని ధర్మశాస్త్రం అతని హృదయంలో ఉంది[a]; అతని అడుగులు జారవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని దేవుని ఉపదేశం అతని హృదయంలో ఉంది; అతని అడుగులు తడబడవు.”
    reason: תּוֹרָהకు ‘ఉపదేశం’ అనే అర్థం, מעדకు ‘తడబడడం’ అనే అర్థం కూడా సందర్భానికి సాధ్యమైనవి.
lexical_decisions:
- source_word: תּוֹרַת
  choice: ధర్మశాస్త్రం
  rationale: תּוֹרָה దేవుని అధికారపూర్వక ఉపదేశాన్ని లేదా ధర్మశాస్త్రాన్ని సూచిస్తుంది. జ్ఞానకీర్తన సందర్భంలో ‘ధర్మశాస్త్రం’ దాని నిబంధనాత్మక, నైతిక బలాన్ని నిలుపుతుంది; విస్తృతమైన ‘ఉపదేశం’ అనే భావాన్ని పాదటిప్పణిలో చూపించాం.
- source_word: אֱלֹהָיו
  choice: అతని దేవుని
  rationale: మూడవ పురుష ఏకవచన పుంలింగ ప్రత్యయం వ్యక్తిగత స్వాధీన సంబంధాన్ని తెలియజేస్తుంది; తెలుగు షష్ఠీ నిర్మాణం సహజంగా దీనిని వ్యక్తం చేస్తుంది.
- source_word: בְּלִבּוֹ
  choice: అతని హృదయంలో ఉంది
  rationale: בְּ ఉపసర్గతో కూడిన ‘హృదయం’ దేవుని బోధ అంతరంగీకరించబడినదని సూచిస్తుంది. ఇక్కడ హృదయం ఆలోచన, సంకల్పం సహా అంతరంగ వ్యక్తిని సూచిస్తుంది.
- source_word: לֹא תִמְעַד
  choice: జారవు
  rationale: מעד జారడం, తడబడడం అనే భావాలు కలిగి ఉంది. ‘అడుగులు’ అనే కర్తతో ‘జారవు’ సహజమైన తెలుగు రూపం; అపూర్ణ క్రియతో కూడిన నిషేధాన్ని సామాన్య సత్యంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֻׁרָיו
  choice: అతని అడుగులు
  rationale: ఈ బహువచన నామవాచకం అడుగులు లేదా అడుగుజాడలను సూచిస్తుంది; జీవన నడత రూపకాన్ని ‘అడుగులు’ సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: జ్ఞానసాహిత్య సందర్భంలో תּוֹרָה భావం
  choice: ధర్మశాస్త్రం
  alternative: ఉపదేశం; బోధ
  rationale: ఈ వాక్యం నీతిమంతుడు అంతరంగీకరించుకున్న దేవుని అధికారపూర్వక చిత్తాన్ని సూచిస్తుంది. ‘ధర్మశాస్త్రం’ దాని నిబంధనాత్మక బలాన్ని నిలుపుతుంది; ‘ఉపదేశం’ అనే నిజమైన విస్తృత అర్థాన్ని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. మూలంలోని రెండు సమాంతర వాక్యభాగాలు, హృదయం–అడుగులు అనే రూపకాలు నిలుపబడ్డాయి; సాధారణ సత్యాన్ని తెలిపేందుకు వర్తమానకాల రూపం వాడబడింది.
