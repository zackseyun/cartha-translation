source:
  edition: WLC
  text: כָּל הַ֭/יּוֹם חוֹנֵ֣ן וּ/מַלְוֶ֑ה וְ֝/זַרְע֗/וֹ לִ/בְרָכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/026.yaml
  text: All day long he is gracious and lends[a], and his offspring are a blessing.
translation:
  language: te
  text: రోజంతా అతడు దయ చూపుతూ అప్పులిస్తుంటాడు; అతని సంతానం ఆశీర్వాదంగా ఉంటుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని సంతానం ఆశీర్వదించబడుతుంది.” హీబ్రూలో అక్షరార్థంగా, “అతని సంతానం ఆశీర్వాదం కొరకు” అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: రోజంతా
  rationale: ‘రోజంతా’ అనే సహజమైన ఆధునిక తెలుగు ప్రయోగం, అక్షరార్థమైన ‘దినమంతా’ అనే కాలభావంతో పాటు నిరంతరమైన లేదా అలవాటైన క్రియను తెలియజేస్తుంది.
- source_word: חוֹנֵן
  choice: కృప చూపుతూ
  rationale: חנן అనే ధాతువు అనుగ్రహం లేదా కృప చూపడాన్ని సూచిస్తుంది. ఇక్కడ అప్పు ఇవ్వడంతో సమాంతరంగా ఉన్నప్పటికీ, దాని భావాన్ని కేవలం ఆర్థిక ఉదారతకే పరిమితం చేయకుండా మూలపదార్థాన్ని నిలుపుతుంది.
- source_word: וּמַלְוֶה
  choice: అప్పు ఇస్తాడు
  rationale: ఇక్కడ לוה యొక్క హిఫీల్ రూపం ‘అప్పు ఇవ్వడం’ అని అర్థం, ‘అప్పు తీసుకోవడం’ కాదు. తెలుగు పాఠకులకు ఇది స్పష్టమైన, సహజమైన వ్యక్తీకరణ.
- source_word: וְזַרְעוֹ
  choice: అతని సంతానం
  rationale: זֶרַע ఇక్కడ సమష్టిగా వారసులను లేదా సంతానాన్ని సూచిస్తుంది. ‘సంతానం’ సమష్టి ఏకవచన భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: לִבְרָכָה
  choice: ఆశీర్వాదంగా ఉంటుంది
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఆశీర్వాదం కొరకు/ఆశీర్వాదంగా’ అని ఉంటుంది. ‘ఆశీర్వాదంగా ఉంటుంది’ అనేది సంతానం ఆశీర్వాదాన్ని పొందుతుందని కాక, ఆశీర్వాదంగా నిలుస్తుందని ప్రధాన భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: చివరి పదబంధం לִבְרָכָה యొక్క భావం
  choice: అతని సంతానం ఆశీర్వాదంగా ఉంటుంది
  alternative: అతని సంతానం ఆశీర్వదించబడుతుంది
  rationale: בְּרָכָה ముందు ఉన్న לְ ఉపసర్గ ఫలితం లేదా నియామకాన్ని—‘ఆశీర్వాదంగా’—సహజంగా సూచిస్తుంది. అయినా ‘ఆశీర్వదించబడుతుంది’ అనే సంప్రదాయ భావసాధ్యతను పాదసూచికలో ఉంచి మూలంలోని కొంత భావసందిగ్ధతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. కీర్తనలోని నీతిమంతుని అలవాటైన కార్యాన్ని తెలియజేయడానికి ‘రోజంతా’ మరియు క్రియాత్మక నిర్మాణాన్ని ఉపయోగించాం; చివరి భాగంలోని హీబ్రూ భావసాధ్యతను పాదసూచికలో నిలిపాం.
