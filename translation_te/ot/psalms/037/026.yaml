revisions:
- from: రోజంతా అతడు కృప చూపుతూ అప్పు ఇస్తాడు; అతని సంతానం ఆశీర్వాదంగా ఉంటుంది.[a]
  to: రోజంతా అతడు దయ చూపుతూ అప్పులిస్తుంటాడు; అతని సంతానం ఆశీర్వాదంగా ఉంటుంది.[a]
  rationale: 'The revision retains every principal lexical and theological decision in the draft while using a continuing habitual construction for the paired Hebrew participles. The final clause and its alternative footnote remain deliberately distinct: the main text says the offspring are a blessing, whereas the note records the possible ‘are blessed’ construal.'
