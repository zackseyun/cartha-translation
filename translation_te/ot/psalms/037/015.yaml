translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన కవితా శైలిని ఉపయోగించాం. ‘ఖడ్గం’ కీర్తనల గౌరవప్రద సందర్భానికి సరిపోతుంది; వాక్యంలోని ప్రతికారాత్మక కవితా సమాంతరతను నిలిపాం.
