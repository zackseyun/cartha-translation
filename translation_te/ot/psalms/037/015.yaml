  text: Their sword will enter their own heart[a], and their bows will be broken.
translation:
  language: te
  text: వారి ఖడ్గం వారి సొంత హృదయంలోకి చొచ్చుకుపోతుంది[a]; వారి విల్లులు విరిగిపోతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి ఖడ్గం వారి సొంత హృదయాల్లోకి చొచ్చుకుపోతుంది.’ హీబ్రూలో బహువచన స్వామ్యప్రత్యయంతో ‘హృదయం’ ఏకవచనంలో ఉంది; ఇది సాధారణమైన సామూహిక ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַרְבָּם
  choice: వారి ఖడ్గం
  rationale: హీబ్రూలో నామవాచకం ఏకవచనంలో ఉండి, మూడవ పురుష బహువచన స్వామ్య ప్రత్యయాన్ని కలిగి ఉంది. సామూహిక లేదా పంపిణీయ భావాన్ని నిలుపుతూ ఏకవచనాన్ని ఉంచాం.
- source_word: תָּבוֹא
  choice: దిగుతుంది
  rationale: בוא అనే క్రియ ఇక్కడ בְּతో కలిసి ఖడ్గం హృదయంలోకి చొచ్చుకుపోవడాన్ని సూచిస్తుంది. తెలుగు కవితా సందర్భంలో ‘దిగుతుంది’ సహజంగా ఈ ప్రవేశ/చొచ్చుకుపోయే భావాన్ని తెలియజేస్తుంది.
- source_word: בְלִבָּם
  choice: వారి సొంత హృదయంలోకే
  rationale: మూలంలో అక్షరార్థంగా ‘వారి హృదయంలో/హృదయంలోకి’ ఉంది. ఆయుధం దాని యజమానుల మీదికే తిరుగుతుందనే సందర్భానుగత ప్రతిఫల భావాన్ని ‘సొంత’ మరియు ‘-కే’ సహజంగా స్పష్టం చేస్తాయి.
- source_word: וְקַשְּׁתוֹתָם
  choice: వారి విల్లు
  rationale: ఇది బహువచన నామవాచకం, మూడవ పురుష బహువచన స్వామ్య ప్రత్యయంతో ఉంది. తెలుగులో ‘విల్లు’ రూపమే సందర్భానుసారంగా బహువచన క్రియతో బహువచన భావాన్ని ఇస్తుంది.
- source_word: תִּשָּׁבַרְנָה
  choice: విరిగిపోతాయి
  rationale: שבר నిఫాల్ అసంపూర్ణ క్రియారూపం స్త్రీలింగ బహువచనంలో ఉంది. ‘విరిగిపోతాయి’ సహజమైన తెలుగు రూపం; మూలంలో లేని అధిక తీవ్రతను జోడించదు.
