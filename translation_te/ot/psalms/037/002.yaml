source:
  edition: WLC
  text: כִּ֣י כֶ֭/חָצִיר מְהֵרָ֣ה יִמָּ֑לוּ וּ/כְ/יֶ֥רֶק דֶּ֝֗שֶׁא יִבּוֹלֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/002.yaml
  text: For they will quickly wither like grass[a], and fade like green herbage.
translation:
  language: te
  text: ఎందుకంటే వారు గడ్డిలా త్వరగా వాడిపోతారు[a]; పచ్చని పచ్చికలా వెలిసిపోతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గడ్డిలా త్వరగా నరికివేయబడతారు; పచ్చని పచ్చికలా వాడిపోతారు.’ ఇక్కడి హీబ్రూ క్రియల అర్థపరిధిలో వాడిపోవడం, వెలిసిపోవడం లేదా నరికివేయబడడం అనే భావాలు ఒకదానితో ఒకటి కలుస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని ఉపదేశానికి కారణాన్ని పరిచయం చేస్తుంది; సందర్భంలోని వివరణాత్మక సంబంధాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: כֶחָצִיר
  choice: గడ్డిలా
  rationale: חָצִיר సాధారణంగా గడ్డి లేదా పచ్చికను సూచిస్తుంది; త్వరగా ఎండిపోయే వృక్షజీవన ఉపమానానికి ‘గడ్డి’ సహజంగా సరిపోతుంది.
- source_word: מְהֵרָה
  choice: త్వరగా
  rationale: వారి అంతం ఎంత వేగంగా సంభవిస్తుందో తెలిపే క్రియావిశేషణ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: יִמָּלוּ
  choice: వాడిపోతారు
  rationale: ఈ వృక్ష ఉపమానంలో ఎండిపోవడం లేదా వాడిపోవడం ప్రధాన భావం; అయితే ‘నరికివేయబడతారు’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: וּכְיֶרֶק דֶּשֶׁא
  choice: పచ్చని పచ్చికలా
  rationale: יֶרֶק మరియు דֶּשֶׁא కలిసి తాజా, పచ్చని వృక్షవృద్ధిని చిత్రిస్తాయి; ‘పచ్చని పచ్చిక’ ఈ సంయుక్త చిత్రాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: יִבּוֹלוּן
  choice: వెలిసిపోతారు
  rationale: వృక్షాలు తమ తాజాదనాన్ని, రంగును కోల్పోయి క్షీణించే భావాన్ని వ్యక్తపరుస్తుంది; మొదటి పాదంలోని ‘వాడిపోతారు’తో భావసమాంతరతను ఉంచుతూ అనవసర పునరుక్తిని నివారిస్తుంది.
