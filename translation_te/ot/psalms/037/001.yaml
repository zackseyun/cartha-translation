  yaml_path: translation/ot/psalms/037/001.yaml
  text: Of David[a]. Do not be provoked by evildoers[b]; do not envy those who do wrong.
translation:
  language: te
  text: 'దావీదుకు చెందినది.[a]


    దుష్టుల వల్ల కలత చెందకు.[b]


    అన్యాయం చేసేవారి పట్ల అసూయపడకు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దావీదు రచించినది’ లేదా ‘దావీదు కోసం.’ హీబ్రూ పదబంధం రచయితృత్వాన్ని, సంబంధాన్ని లేదా అంకితాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దుష్టుల కారణంగా మండిపడకు’ లేదా ‘దుష్టుల వల్ల విసుగు చెందకు.’ హీబ్రూ క్రియ వేడెక్కడం, ఆగ్రహించడం, కలత చెందడం లేదా విసుగు చెందడం అనే భావాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: దావీదుకు చెందినది
  rationale: లְ ఉపసర్గ రచయితృత్వం, సంబంధం లేదా అంకితం అనే భావాలను సూచించగలదు. ‘దావీదుకు చెందినది’ వాటిలో ఒక్కదానినే ఖరారు చేయకుండా సహజమైన తెలుగులో విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: אַל
  choice: పడకు / అసూయపడకు
  rationale: אַל మరియు అసంపూర్ణ క్రియ కలసి నిషేధాన్ని వ్యక్తం చేస్తాయి; తెలుగులో నేరుగా నిషేధార్థక క్రియారూపాలు సహజంగా ఉంటాయి.
- source_word: תִּתְחַר
  choice: మండిపడకు
  rationale: חרה హిత్పయేల్ రూపం వేడెక్కడం, కోపోద్రిక్తం కావడం లేదా కలత చెందడం అనే భావపరిధిని కలిగి ఉంది. ‘మండిపడకు’ వేడెక్కిన అంతరంగ ప్రతిస్పందనను స్పష్టంగా తెలిపినా, ఇతర సాధ్యమైన భావాన్ని పాదటిప్పణి ఉంచుతుంది.
- source_word: בַּמְּרֵעִים
  choice: దుష్టులను బట్టి
  rationale: בְּ ఇక్కడ కలతకు కారణం లేదా సందర్భాన్ని సూచిస్తుంది. ‘దుష్టులను బట్టి’ కారణార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది; participial form‌ను వ్యక్తులను సూచించే ‘దుష్టులు’గా అందిస్తుంది.
- source_word: תְּקַנֵּא
  choice: అసూయపడకు
  rationale: קנא అసూయ లేదా ఈర్ష్యను సూచించగలదు. ఈ సందర్భంలో చెడు చేసేవారిని చూసి కలిగే ఆకాంక్షాత్మక అసూయ భావానికి ‘అసూయపడకు’ సరిపోతుంది.
- source_word: בְּעֹשֵׂי עַוְלָה
  choice: అన్యాయం చేసేవారిని చూసి
  rationale: עֹשֵׂי క్రియాశీల participial భావాన్ని ‘చేసేవారు’ నిలుపుతుంది; עַוְלָה లోని తప్పు, అన్యాయం, నీతివిరుద్ధత భావాలలో ఇక్కడ ‘అన్యాయం’ స్పష్టమైన ఆధునిక తెలుగు పదం. בְּ సంబంధాన్ని తెలుగులో సహజంగా ‘చూసి’ వ్యక్తం చేస్తుంది.
