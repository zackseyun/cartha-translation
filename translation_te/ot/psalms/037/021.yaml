  text: The wicked borrows and does not repay[b][a], but the righteous is gracious and gives.
translation:
  language: te
  text: దుష్టుడు అప్పు తీసుకొని తిరిగి చెల్లించడు; నీతిమంతుడు దయ చూపుతాడు[a] మరియు ఇస్తాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అనుగ్రహం చూపుతాడు” లేదా “ఉదారంగా ఉంటాడు.” హీబ్రూ క్రియ దయ, అనుగ్రహం లేదా కృప చూపడాన్ని సూచిస్తుంది; ఈ సందర్భంలో అది ఉదారతతో వ్యక్తమవవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అప్పుగా ఇస్తాడు.” హీబ్రూలో సాధారణంగా “ఇస్తాడు” అని ఉంది; సందర్భాన్ని బట్టి కొందరు దీనిని అప్పుగా ఇవ్వడంగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹוֶה
  choice: అప్పు తీసుకొని
  rationale: לוה అనే క్రియ యొక్క కాల్ కృదంత రూపం ‘అప్పు తీసుకోవడం’ను సూచిస్తుంది. తెలుగు సామెతాత్మక వాక్యంలో తరువాతి క్రియతో సహజంగా కలిసేందుకు ‘అప్పు తీసుకొని’ అని అనువదించాం.
- source_word: רָשָׁע
  choice: దుష్టుడు
  rationale: ఇది దుష్ట వ్యక్తిని ఒక వర్గానికి ప్రతినిధిగా సూచించే నామవాచక విశేషణం. ‘దుష్టుడు’ హీబ్రూ ఏకవచన వ్యత్యాసాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לֹא יְשַׁלֵּם
  choice: తిరిగి చెల్లించడు
  rationale: שלם యొక్క పియేల్ రూపం ఇక్కడ అప్పుగా తీసుకున్నదాన్ని తిరిగి చెల్లించడాన్ని సూచిస్తుంది. సందర్భానుసారంగా ‘తిరిగి చెల్లించడు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: צַדִּיק
  choice: నీతిమంతుడు
  rationale: దుష్టునికి వ్యతిరేకంగా నిలిచే, ఒక వర్గానికి ప్రతినిధియైన ఏకవచన నామవాచక విశేషణం. ‘నీతిమంతుడు’ కీర్తనల శైలికి తగిన ప్రామాణిక తెలుగు పదం.
- source_word: חוֹנֵן
  choice: దయ చూపి
  rationale: חנן యొక్క ప్రాథమిక భావం అనుగ్రహం లేదా దయ చూపడం. ఇక్కడ ఇచ్చే కార్యంలో అది వ్యక్తమవుతున్నా, కేవలం ‘ఉదారంగా’ అని పరిమితం చేయకుండా మూలపద భావాన్ని నిలిపాం.
- source_word: וְנוֹתֵן
  choice: ఇస్తాడు
  rationale: נתן సాధారణంగా ‘ఇవ్వడం’ అని అర్థం. సందర్భంలో ఉదారంగా ఇవ్వడం లేదా అప్పుగా ఇవ్వడం భావించవచ్చుగాని, మూలంలో ఉన్న విస్తృత భావాన్ని ‘ఇస్తాడు’ నిలుపుతుంది.
theological_decisions:
- issue: జ్ఞానసాహిత్య వ్యత్యాసంలోని ప్రతినిధి పుంలింగ ఏకవచనం
  choice: ‘దుష్టుడు ... నీతిమంతుడు’ అనే ఏకవచన వర్గపదాలను నిలుపడం
  alternative: ‘దుష్టులు ... నీతిమంతులు’ లేదా ‘దుష్ట వ్యక్తి ... నీతిగల వ్యక్తి’
  rationale: హీబ్రూ పుంలింగ ఏకవచన రూపాలను సామెతాత్మకంగా వర్గాలకు ప్రతినిధులుగా వాడుతుంది. తెలుగు భాషలో సహజంగా ఉండేలా, మూలంలోని ఏకవచన వ్యత్యాసాన్ని నిలిపాం.
- issue: 'నీతిమంతుని చర్య: దానం చేయడమా, అప్పుగా ఇవ్వడమా'
  choice: మూలంలోని సాధారణ ‘ఇస్తాడు’ అనే భావాన్ని నిలుపడం
  alternative: ‘అప్పుగా ఇస్తాడు’ లేదా ‘ఉదారంగా ఇస్తాడు’
  rationale: సందర్భం అప్పు విషయాన్ని ప్రస్తావించినప్పటికీ נתן స్వయంగా ‘ఇవ్వడం’ అనే విస్తృత అర్థం కలిగి ఉంది. అందువల్ల ఒక నిర్దిష్ట ఆర్థిక చర్యగా సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జ్ఞానసాహిత్య శైలిని అనుసరించాం. ‘దుష్టుడు/నీతిమంతుడు’ అనే గంభీరమైన కానీ సాధారణ పాఠకులకు సుపరిచితమైన పదజంటను ఉపయోగించాం. హీబ్రూ వాక్యంలోని స్పష్టమైన వ్యత్యాసాన్ని సెమికోలన్ ద్వారా చూపించాం.
