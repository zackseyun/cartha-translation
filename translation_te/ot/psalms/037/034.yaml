  text: קַוֵּ֤ה אֶל יְהוָ֨ה וּ/שְׁמֹ֬ר דַּרְכּ֗/וֹ וִֽ֭/ירוֹמִמְ/ךָ לָ/רֶ֣שֶׁת אָ֑רֶץ בְּ/הִכָּרֵ֖ת רְשָׁעִ֣ים תִּרְאֶֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/034.yaml
  text: Wait for Yahweh and keep his way[a], and he will exalt you to inherit the land; when the wicked are cut off[c][b], you will see it.
translation:
  language: te
  text: 'యాహ్వేపై ఆశతో నిరీక్షించు,

    ఆయన మార్గాన్ని పాటించు.


    దేశాన్ని స్వాస్థ్యంగా పొందడానికి

    ఆయన నిన్ను ఉన్నతపరుస్తాడు.[b]


    దుష్టులు నిర్మూలించబడినప్పుడు

    నీవు దాన్ని చూస్తావు.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా, ‘భూమిని.’ హీబ్రూ אָרֶץ అనే పదానికి ‘దేశం’ లేదా ‘భూమి’ అనే అర్థం ఉండవచ్చు. కీర్తన 37లో స్వాస్థ్యంగా పొందే వాగ్దానం పదేపదే రావడం వల్ల ఇక్కడ ‘దేశం’ అని అనువదించబడింది. మత్తయి 5:5తో పోల్చండి.
    reason: alternative_reading_and_cross_reference
  - marker: c
    text: ‘దాన్ని’ అనే పదం హీబ్రూ పాఠంలో ప్రత్యేకంగా లేదు; దుష్టులు నిర్మూలించబడటాన్ని నీవు చూస్తావనే భావాన్ని తెలుగులో స్పష్టం చేయడానికి చేర్చబడింది.
    reason: supplied_word
lexical_decisions:
- source_word: קַוֵּה אֶל־יְהוָה
  choice: యెహోవా కోసం నిరీక్షించు
  rationale: קוה అనే ఆజ్ఞారూపం సహనంతో కూడిన ఆశాభరిత నిరీక్షణను సూచిస్తుంది; אֶל దాని దిశను యెహోవావైపు ఉంచుతుంది. ‘నిరీక్షించు’ అనే పదం ఆశను, ఓర్పును రెండింటినీ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: וּשְׁמֹר דַּרְכּוֹ
  choice: ఆయన మార్గాన్ని అనుసరించు
  rationale: שׁמר అంటే కాపాడు, పాటించు, గైకొను; ‘ఆయన మార్గం’తో కలిసినప్పుడు ఆయన చిత్తానికీ జీవన విధానానికీ నమ్మకంగా కట్టుబడి నడవడాన్ని సూచిస్తుంది. తెలుగులో ‘మార్గాన్ని అనుసరించు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: וִירוֹמִמְךָ
  choice: ఆయన నిన్ను హెచ్చిస్తాడు
  rationale: רום హిఫీల్ రూపం ‘పైకి ఎత్తు, ఉన్నతపరచు’ అని అర్థం. కీర్తనలోని సమర్థన, గౌరవ స్థాపన భావాన్ని ‘హెచ్చిస్తాడు’ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לָרֶשֶׁת אָרֶץ
  choice: దేశాన్ని స్వాస్థ్యంగా పొందేలా
  rationale: ירשׁలో స్వాధీనం చేసుకోవడం, వారసత్వంగా పొందడం అనే భావాలు ఉన్నాయి. ‘స్వాస్థ్యంగా పొందడం’ నిబంధనాత్మక వారసత్వ భావాన్ని నిలుపుతుంది. אָרֶץ ఇక్కడ ‘దేశం’ లేదా ‘భూమి’ కావచ్చు; కీర్తన 37లో పునరావృతమయ్యే స్వాస్థ్య భాష దృష్ట్యా ప్రధాన పాఠంలో ‘దేశం’ ఎంచుకున్నాం.
- source_word: בְּהִכָּרֵת רְשָׁעִים
  choice: దుష్టులు నిర్మూలించబడినప్పుడు
  rationale: בְּతో కూడిన כרת నిఫాల్ క్రియానామం కాలసంబంధ పరిస్థితిని, ‘...బడినప్పుడు,’ సూచిస్తుంది. ‘నిర్మూలించబడటం’ పూర్తిగా తొలగించబడే న్యాయతీర్పు భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: תִּרְאֶה
  choice: నీవు దాన్ని చూస్తావు
  rationale: క్రియ అక్షరార్థంగా ‘నీవు చూస్తావు.’ తెలుగు వాక్యస్పష్టత కోసం, దుష్టుల నిర్మూలనను సూచించే ‘దాన్ని’ సందర్భానుసారంగా చేర్చాం.
theological_decisions:
- issue: నిబంధన-జ్ఞానసాహిత్య సందర్భంలో אָרֶץ అనువాదం
  choice: దేశం
  alternative: భూమి
  rationale: కీర్తన 37 అంతటా ఇశ్రాయేలు నిబంధనాత్మక స్వాస్థ్య భాష ప్రతిధ్వనిస్తుంది కాబట్టి ‘దేశం’ ప్రధాన సందర్భానికి సరిపోతుంది. అయితే אָרֶץకు ‘భూమి’ అనే విస్తృత అర్థం కూడా నిజమైన అవకాశమే; దాన్ని పాదసూచికలో నిలిపాం, తద్వారా మత్తయి 5:5లోని ప్రతిధ్వనితో సహా విస్తృత భావాన్ని మూసివేయలేదు.
- issue: దుష్టుల అంతాన్ని సూచించే כרת భావం
  choice: నిర్మూలించబడినప్పుడు
  alternative: తొలగించబడినప్పుడు / నరికివేయబడినప్పుడు
  rationale: హీబ్రూ నుడికారంలోని న్యాయతీర్పు తీవ్రతను ‘నిర్మూలించబడటం’ తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ఇది విధానాన్ని లేదా అంతిమ స్థితిని అవసరానికి మించి నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కవితా శైలిని వాడాం. దైవనామాన్ని ‘యెహోవా’గా ఉంచాం. మూలంలోని నాలుగు ఆజ్ఞ/వాగ్దాన భాగాలను పంక్తులుగా అమర్చి కీర్తనా లయను నిలిపాం; אָרֶץలోని ‘దేశం/భూమి’ సందిగ్ధతను పాదసూచికలో సంరక్షించాం.
