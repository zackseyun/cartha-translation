    దుష్టులు నిర్మూలించబడినప్పుడు నీవు దాన్ని చూస్తావు.[b]'
  to: 'యాహ్వేపై ఆశతో నిరీక్షించు,

    ఆయన మార్గాన్ని పాటించు.


    దేశాన్ని స్వాస్థ్యంగా పొందడానికి

    ఆయన నిన్ను ఉన్నతపరుస్తాడు.[b]


    దుష్టులు నిర్మూలించబడినప్పుడు

