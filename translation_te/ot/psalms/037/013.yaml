- from: ప్రభువు అతన్ని చూసి నవ్వుతాడు[a]; ఎందుకంటే అతని రోజు రాబోతోందని ఆయన చూస్తున్నాడు[b].
  to: ప్రభువు అతని మీద నవ్వుతాడు[a]; ఎందుకంటే అతని రోజు[b] రాబోతోందని ఆయన చూస్తున్నాడు.
  rationale: The revision renders the Hebrew prepositional object as “అతని మీద,” avoiding the added implication that the Lord first sees the wicked person and then laughs. It retains the source's lexical “laughs,” its causal connection, and the concise expression “his day.” Footnote b is relocated to the expression it defines.
