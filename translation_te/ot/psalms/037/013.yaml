  text: The Lord laughs at him[b][a], for he sees that his day is coming.
translation:
  language: te
  text: ప్రభువు అతని మీద నవ్వుతాడు[a]; ఎందుకంటే అతని రోజు[b] రాబోతోందని ఆయన చూస్తున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతన్ని ఎగతాళి చేస్తాడు’ లేదా ‘అతన్ని పరిహసిస్తాడు’ అని కూడా అనువదించవచ్చు; హీబ్రూ క్రియ అక్షరార్థంగా ‘నవ్వుతాడు,’ అయితే ఇక్కడ సందర్భంలో ఎగతాళి భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘అతని రోజు’ అంటే దుష్టునికి నిర్ణయించబడిన పతనం లేదా తీర్పు దినం.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדֹנָי
  choice: ప్రభువు
  rationale: దేవుని అధికారాన్ని సూచించే ఈ సాధారణ బిరుదుకు ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన రూపం.
- source_word: יִשְׂחַק
  choice: నవ్వుతాడు
  rationale: హీబ్రూ క్రియ యొక్క ప్రాథమిక అర్థమైన ‘నవ్వు’ను నిలుపుతుంది; సందర్భం దానిలోని ఎగతాళి భావాన్ని తెలియజేస్తుంది.
- source_word: לוֹ
  choice: అతన్ని చూసి
  rationale: నవ్వుకు దుష్టుడే లక్ష్యమని తెలుగులో సహజంగా తెలియజేస్తుంది; అక్షరార్థమైన ‘అతనికి’ ఇక్కడ అసహజంగా ఉంటుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: మొదటి כִּי ప్రభువు నవ్వడానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: רָאָה
  choice: ఆయన చూస్తున్నాడు
  rationale: రూపరీత్యా సంపూర్ణ క్రియ అయినా, రాబోయే పరిణామాన్ని దేవుడు గ్రహిస్తున్నాడనే వర్తమాన ప్రాసంగికతను తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: כִּי
  choice: అని
  rationale: రెండవ כִּי ఆయన చూసే విషయాన్ని పరిచయం చేస్తుంది.
- source_word: יָבֹא
  choice: రాబోతోంది
  rationale: సమీపిస్తున్న భవిష్యత్ సంఘటన యొక్క సజీవ భావాన్ని వ్యక్తపరుస్తుంది.
- source_word: יוֹמוֹ
  choice: అతని రోజు
  rationale: హీబ్రూలోని సంక్షిప్త కవితాత్మక వ్యక్తీకరణను నిలుపుతుంది; సందర్భంలో అది దుష్టుని పతనం లేదా తీర్పు దినాన్ని సూచిస్తుంది.
theological_decisions:
- issue: దైవిక నవ్వు స్వభావం
  choice: ప్రధాన పాఠ్యంలో ‘నవ్వుతాడు’ అని ఉంచి, సందర్భంలోని ఎగతాళి భావాన్ని పాదటిప్పణిలో తెలియజేయడం
  alternative: ‘ఎగతాళి చేస్తాడు’ అని నేరుగా అనువదించడం
  rationale: హీబ్రూ క్రియ ప్రాథమికంగా ‘నవ్వు’ అని అర్థమిస్తుంది; తీర్పు సందర్భం దానికి ఎగతాళి భావాన్ని ఇస్తుంది. ప్రధాన పాఠ్యం మూలపదాన్ని కాపాడుతూ అనవసరంగా దైవిక క్రూరత్వాన్ని సూచించదు.
- issue: ‘అతని రోజు’ అర్థం
  choice: అస్పష్టతను ప్రధాన పాఠ్యంలో నిలుపుతూ, దుష్టుని పతనం లేదా తీర్పు దినమని పాదటిప్పణిలో వివరించడం
  alternative: ‘అతని తీర్పు దినం’ అని విపులీకరించడం
  rationale: మూలపాఠ్యం కేవలం ‘అతని రోజు’ అంటుంది; సందర్భార్థాన్ని స్పష్టం చేయవచ్చు గాని దానిని ప్రధాన పాఠ్యంలోనే నిర్బంధించడం అవసరం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా వచనం. ‘అతని రోజు’ అనే మూలంలోని సంక్షిప్తతను నిలిపి, అవసరమైన సందర్భార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
