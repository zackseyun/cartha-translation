  text: וּ/תְשׁוּעַ֣ת צַ֭דִּיקִים מֵ/יְהוָ֑ה מָֽ֝עוּזָּ֗/ם בְּ/עֵ֣ת צָרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/039.yaml
  text: The salvation of the righteous is from Yahweh[c][b][a]; he is their stronghold in a time of trouble.
translation:
  language: te
  text: 'నీతిమంతుల రక్షణ[a] యహ్వే[b] నుండి వస్తుంది;

    కష్టకాలంలో ఆయన వారికి దుర్గం[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘విడిపింపు’; హెబ్రీ పదం రక్షణతో పాటు అపాయం నుండి విడిపింపును లేదా విజయాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో ‘య్హ్వ్హ్’ (YHWH); సాంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.
    reason: alternative_reading
  - marker: c
    text: లేదా ‘ఆశ్రయం’ లేదా ‘కోట’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְשׁוּעַת
  choice: రక్షణ
  rationale: תְּשׁוּעָה రక్షణ, విడిపింపు లేదా విజయాన్ని సూచించగలదు. కీర్తన యొక్క విస్తృత భావానికి ‘రక్షణ’ సరిపోతూ, సందర్భంలోని అపాయం నుండి కాపాడబడే భావాన్నీ నిలుపుతుంది.
- source_word: צַדִּיקִים
  choice: నీతిమంతులు
  rationale: బహువచన విశేషణం నామవాచకంగా వాడబడింది. ‘నీతిమంతులు’ ఆ వర్గార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵיְהוָה
  choice: యహ్వే నుండి వస్తుంది
  rationale: מִן మూలాన్ని సూచిస్తుంది. తెలుగులో వాక్యం సహజంగా ఉండేందుకు హెబ్రీలో అంతర్లీనంగా ఉన్న క్రియను ‘వస్తుంది’ అని స్పష్టం చేశాం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: מָעוּזָּם
  choice: వారికి దుర్గం
  rationale: מָעוֹז బలమైన రక్షణస్థలాన్ని లేదా భద్రతనిచ్చే ఆధారాన్ని సూచిస్తుంది. ‘దుర్గం’ దాని కోటలాంటి రక్షణాత్మక రూపకాన్ని నిలుపుతుంది; ప్రత్యయం తెలిపే బహువచన సంబంధాన్ని ‘వారికి’ వ్యక్తం చేస్తుంది.
- source_word: בְּעֵת צָרָה
  choice: కష్టకాలంలో
  rationale: ‘కష్టం సంభవించే సమయంలో’ అనే కాలసంబంధ భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో దేవుని ప్రత్యేక నామం ప్రత్యక్షంగా ఉంది. దాన్ని సాధారణ బిరుదుగా మార్చకుండా ‘యహ్వే’ అని ఇవ్వడం నామసూచనను కాపాడుతుంది.
- issue: క్రియలేని రెండవ ఉపవాక్యాన్ని తెలుగులో వ్యక్తీకరించడం
  choice: ఆయనే వారికి దుర్గం
  alternative: వారికి దుర్గం; యహ్వే వారికి దుర్గం
  rationale: హెబ్రీ రెండవ భాగం నామవాచక వాక్యం. ‘ఆయనే’ మొదటి భాగంలోని యహ్వేనే దుర్గమని సహజంగా అనుసంధానిస్తుంది; ‘నే’ ఆయన రక్షణాధారమనే వాక్యబలాన్ని తెలుగులో వ్యక్తం చేస్తుంది, కొత్త భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కీర్తనా శైలిని అనుసరించాం. మొదటి భాగంలోని హెబ్రీ నామవాచక వాక్యాన్ని తెలుగులో సహజం చేయడానికి ‘వస్తుంది’ చేర్చాం; రెండవ భాగంలోని రక్షణాత్మక కోట రూపకాన్ని ‘దుర్గం’తో నిలిపాం.
