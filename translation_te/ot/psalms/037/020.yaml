id: PSA.37.20
reference: Psalms 37:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י רְשָׁעִ֨ים יֹאבֵ֗דוּ וְ/אֹיְבֵ֣י יְ֭הוָה כִּ/יקַ֣ר כָּרִ֑ים כָּל֖וּ בֶ/עָשָׁ֣ן כָּֽלוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/020.yaml
  text: For the wicked will perish[a], and the enemies of Yahweh are like the glory of the pastures; they vanish—like smoke they vanish away.
translation:
  language: te
  text: 'ఎందుకంటే దుష్టులు నశించిపోతారు;

    యహ్వే శత్రువులు పచ్చికబయళ్ల వైభవంలా[a] అంతమైపోతారు;

    పొగలా వారు అంతమైపోతారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, సాంప్రదాయ వ్యాఖ్యానం ప్రకారం: “గొర్రెపిల్లల కొవ్వులా.” ఈ హీబ్రూ పదబంధానికి అర్థం నిర్ధారించడం కష్టం.'
    reason: కష్టమైన హీబ్రూ పదబంధానికి ఉన్న ముఖ్యమైన ప్రత్యామ్నాయ పఠనాన్ని సంరక్షించడం.
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న వాక్యానికి కారణాన్ని లేదా వివరణను పరిచయం చేసే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: רְשָׁעִים
  choice: దుష్టులు
  rationale: కీర్తనలలో నైతికంగా చెడు చేసేవారిని సూచించే ప్రామాణికమైన, సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: יֹאבֵדוּ
  choice: నశించిపోతారు
  rationale: కేవలం కనిపించకుండా పోవడం కాక, నాశనానికి లేదా పతనానికి చేరడాన్ని సూచించే אבַד భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: וְאֹיְבֵי יְהוָה
  choice: యెహోవా శత్రువులు
  rationale: హీబ్రూ సంబంధపదబంధాన్ని సహజమైన తెలుగు పదక్రమంలో నేరుగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో వ్యక్తం చేస్తుంది.
- source_word: כִּיקַר כָּרִים
  choice: పచ్చికబయళ్ల వైభవంలా
  rationale: కష్టమైన హీబ్రూ పదబంధంలో יקר ను ‘వైభవం’, כרים ను ‘పచ్చికబయళ్లు’గా గ్రహించి, క్షణికంగా కనిపించి అంతమయ్యే ప్రకృతి చిత్రాన్ని నిలుపుతుంది; ప్రత్యామ్నాయ సాంప్రదాయ వ్యాఖ్యానాన్ని పాదసూచికలో ఉంచింది.
- source_word: כָּלוּ
  choice: అంతమైపోతారు
  rationale: כלה యొక్క ముగిసిపోవడం లేదా పూర్తిగా గతించిపోవడం అనే భావాన్ని ఇస్తుంది; మూలంలోని పునరుక్తిని రెండుసార్లు అదే పదంతో నిలిపింది.
- source_word: בֶעָשָׁן
  choice: పొగలా
  rationale: ఇక్కడి ב ను పోలికగా గ్రహించడం తరువాతి క్రియతో సహజంగా సరిపోతుంది; పూర్తిగా కనుమరుగయ్యే దృశ్యాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది; ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడుతుంది.
- issue: כִּיקַר כָּרִים అనే కష్టమైన పదబంధానికి అర్థం
  choice: పచ్చికబయళ్ల వైభవంలా
  alternative: గొర్రెపిల్లల కొవ్వులా
  rationale: మసొరేటిక్ స్వరచిహ్నాలకు అనుగుణంగా ‘పచ్చికబయళ్ల వైభవం’ అనే భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, హీబ్రూ పదబంధంలోని నిజమైన అనిశ్చితిని పాదసూచిక ద్వారా వెల్లడిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గంభీరతతోనూ సాధారణ పాఠకులకు స్పష్టంగానూ రూపొందించబడింది. మూలంలోని సమాంతర నిర్మాణం, ‘అంతమైపోతారు’ అనే పునరుక్తి నిలుపబడ్డాయి.
