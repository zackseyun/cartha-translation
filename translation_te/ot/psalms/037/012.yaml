source:
  edition: WLC
  text: זֹמֵ֣ם רָ֭שָׁע לַ/צַּדִּ֑יק וְ/חֹרֵ֖ק עָלָ֣י/ו שִׁנָּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/012.yaml
  text: The wicked plots against the righteous and gnashes his teeth at him[a][b].
translation:
  language: te
  text: దుష్టుడు నీతిమంతునికి విరోధంగా కుట్ర పన్నుతాడు[a]; అతనిపై పళ్లు కొరుకుతాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీతిమంతునికి విరోధంగా పన్నాగం పన్నుతాడు’ లేదా ‘నీతిమంతునికి కీడు తలపెడతాడు.’
    reason: lexical_alternative
  - marker: b
    text: ‘పళ్లు కొరుకుతాడు’ అనేది తీవ్రమైన కోపాన్నీ శత్రుత్వాన్నీ వ్యక్తం చేసే నానుడి.
    reason: cultural_note
lexical_decisions:
- source_word: זֹמֵם
  choice: కుట్ర పన్నుతాడు
  rationale: ఈ క్రియ శత్రుభావంతో పన్నాగం ఆలోచించడాన్ని సూచిస్తుంది. ‘కుట్ర పన్నుతాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, సందర్భంలోని దురుద్దేశాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: רָשָׁע
  choice: దుష్టుడు
  rationale: ఏకవచనంలో వ్యక్తిని సూచించే substantival adjective. ‘దుష్టుడు’ జ్ఞానసాహిత్య శైలికి తగిన, సాధారణంగా అర్థమయ్యే తెలుగు పదం.
- source_word: לַצַּדִּיק
  choice: నీతిమంతునికి విరోధంగా
  rationale: לְ ఇక్కడ శత్రుత్వ చర్య లక్ష్యాన్ని సూచిస్తుంది. తెలుగులో ‘నీతిమంతునికి విరోధంగా’ ఆ సంబంధాన్ని సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: חֹרֵק
  choice: కొరుకుతాడు
  rationale: పళ్లను బిగించి రాయడం లేదా కొరకడం ద్వారా కోపం, శత్రుత్వం వ్యక్తం చేసే చర్యను సూచిస్తుంది. ‘పళ్లు కొరుకుతాడు’ తెలుగు వాడుకలో ఆ తీవ్రతను నిలుపుతుంది.
- source_word: עָלָיו
  choice: అతనిపై
  rationale: పళ్లు కొరకడం అనే శత్రుత్వ సంకేతం ఎవరిని లక్ష్యంగా చేసిందో ఈ రూపం చూపిస్తుంది; ‘అతనిపై’ మూలంలోని దిశాత్మక భావాన్ని నిలుపుతుంది.
- source_word: שִׁנָּיו
  choice: పళ్లు
  rationale: మూలంలో ‘అతని పళ్లు’ అని స్వామ్యార్థం ఉన్నప్పటికీ, తెలుగు క్రియారూపంలోని కర్తతో స్వామ్యం సహజంగా అర్థమవుతుంది; ‘తన పళ్లు’ అని విస్తరించకుండానే భావం స్పష్టంగా ఉంటుంది.
