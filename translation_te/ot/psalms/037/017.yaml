    text: హీబ్రూలో అక్షరార్థంగా ‘బాహువులు’; ఈ చిత్రం దుష్టుల బలాన్ని లేదా శక్తిని సూచించవచ్చు.
    reason: lexical_alternative
  revision_rationale: The revision retains the Hebrew causal connection and poetic image, improves the natural Telugu expression of the broken arms and divine support, and aligns the rendering of the Tetragrammaton with the POB audit trail’s required ‘Yahweh’ form. The existing footnote remains correctly anchored and appropriately preserves the image’s possible metonymic sense.
