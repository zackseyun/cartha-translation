review_pass:
  verdict: revise
  source_fidelity: The Hebrew preserves a causal opening, the concrete plural image ‘arms,’ the future passive outcome for the wicked, and Yahweh’s ongoing supporting of the righteous. The draft captures most of these, but its divine-name form does not follow the stated POB audit trail, which specifies ‘Yahweh.’ ‘విరగగొట్టబడతాయి’ is understandable but is less idiomatic and can overemphasize an external agent; ‘విరిగిపోతాయి’ conveys the intended breaking naturally.
  naturalness: ‘దుష్టుల బాహువులు విరిగిపోతాయి’ is natural modern Telugu while retaining the poetic bodily image. ‘యాహ్వే నీతిమంతులను ఆదరిస్తాడు’ is a clear, idiomatic rendering of the participial sense ‘upholds/supports.’
  terminology: Use ‘యాహ్వే’ for יהוה, in line with the required English POB audit trail and its transliteration policy. Retain ‘బాహువులు’ in the main text and explain its figurative force only in the footnote.
  issues:
  - severity: medium
    issue: The draft renders יהוה as ‘యెహోవా.’
    rationale: The supplied POB audit trail explicitly adopts ‘Yahweh’ rather than ‘Jehovah.’ Telugu should correspondingly use ‘యాహ్వే,’ not the traditional ‘యెహోవా’ form.
  - severity: low
    issue: ‘విరగగొట్టబడతాయి’ is stylistically heavy for the Hebrew Niphal ‘will be broken.’
    rationale: It is intelligible, but ‘విరిగిపోతాయి’ is more natural Telugu and retains the result expressed by the Hebrew without adding an unnecessarily explicit causative nuance.
  - severity: low
    issue: ‘నిలబెడతాడు’ can suggest making someone stand rather than sustaining/supporting them.
    rationale: ‘ఆదరిస్తాడు’ more directly expresses the ongoing support denoted by סוֹמֵךְ in natural modern Telugu.
  revised_text: ఎందుకంటే దుష్టుల బాహువులు విరిగిపోతాయి[a]; కానీ యాహ్వే నీతిమంతులను ఆదరిస్తాడు.
  revised_footnotes:
