id: PSA.37.17
reference: Psalms 37:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י זְרוֹע֣וֹת רְ֭שָׁעִים תִּשָּׁבַ֑רְנָה וְ/סוֹמֵ֖ךְ צַדִּיקִ֣ים יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/017.yaml
  text: For the arms of the wicked will be broken[a], but Yahweh upholds the righteous.
translation:
  language: te
  text: ఎందుకంటే దుష్టుల బాహువులు విరిగిపోతాయి[a]; కానీ యాహ్వే నీతిమంతులను ఆదరిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘బాహువులు’; ఈ చిత్రం దుష్టుల బలాన్ని లేదా శక్తిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: చుట్టుపక్కల ఉన్న ఉపదేశానికి కారణాన్ని లేదా వివరణను పరిచయం చేసే హేత్వర్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: זְרוֹעוֹת
  choice: బాహువులు
  rationale: మూలంలోని స్పష్టమైన శరీరాంగ రూపకాన్ని నిలుపుతుంది; కవిత్వంలో ఇది బలం లేదా శక్తిని సూచించవచ్చు.
- source_word: רְשָׁעִים
  choice: దుష్టుల
  rationale: దుష్టులైన వ్యక్తులను సూచించే బహువచన విశేషణ నామార్థాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: תִּשָּׁבַרְנָה
  choice: విరగగొట్టబడతాయి
  rationale: ‘బాహువులు’తో ఏకీభవించే నిఫాల్ అసంపూర్ణ క్రియ యొక్క భవిష్యత్, కర్మణి భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וְ
  choice: కానీ
  rationale: దుష్టుల గతి, నీతిమంతుల స్థితి మధ్య ఉన్న వ్యతిరేకతను సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: סוֹמֵךְ
  choice: నిలబెడతాడు
  rationale: ఆధారం ఇచ్చి నిలిపే, కొనసాగిస్తూ కాపాడే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: צַדִּיקִים
  choice: నీతిమంతులను
  rationale: నీతిగా ప్రవర్తించే వ్యక్తుల సమూహాన్ని సూచించే మూలంలోని బహువచన నామార్థాన్ని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని తెలుగు బైబిల్ పాఠకులకు విస్తృతంగా పరిచయమైన వ్యక్తినామ రూపంలో అందిస్తుంది; బిరుదుతో భర్తీ చేయదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపం దానిని బిరుదుగా మార్చకుండా నిలుపుతుంది; ‘యాహ్వే’ అనేది సాధ్యమైన మరింత పునర్నిర్మిత ఉచ్చారణ.
- issue: దుష్టుల ‘బాహువులు’ అనే రూపకం
  choice: రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: దుష్టుల బలం నాశనం చేయబడుతుంది
  rationale: మూల హీబ్రూ శరీరాంగ రూపకాన్ని ఉపయోగిస్తుంది. దానిని నేరుగా ‘బలం’గా విప్పడం కవితాత్మక చిత్రాన్ని మరియు దాని భావవ్యాప్తిని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గంభీరతతో, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. హీబ్రూ కవితాత్మక రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని సూచ్యార్థాన్ని పాదటిప్పణిలో వివరించాం.
