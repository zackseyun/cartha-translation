revisions:
- from: ఎందుకంటే దుష్టుల బాహువులు విరగగొట్టబడతాయి[a]; కానీ నీతిమంతులను యెహోవా నిలబెడతాడు.
  to: ఎందుకంటే దుష్టుల బాహువులు విరిగిపోతాయి[a]; కానీ యాహ్వే నీతిమంతులను ఆదరిస్తాడు.
  rationale: The revision retains the Hebrew causal connection and poetic image, improves the natural Telugu expression of the broken arms and divine support, and aligns the rendering of the Tetragrammaton with the POB audit trail’s required ‘Yahweh’ form. The existing footnote remains correctly anchored and appropriately preserves the image’s possible metonymic sense.
