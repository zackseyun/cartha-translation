  text: Yahweh will not leave him in his hand[c][b][a], nor condemn him when he is judged.
translation:
  language: te
  text: యహ్వే అతన్ని దుష్టుని చేతిలో[a] విడిచిపెట్టడు; అతనికి తీర్పు జరిగేటప్పుడు అతన్ని దోషిగా నిర్ధారించడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దుష్టుని చేతిలో’ అంటే అతని అధికారం లేదా అదుపులో అని భావం.
    reason: lexical_alternative
  - marker: b
    text: ‘దోషిగా నిర్ధారించడు’ అనే మాటను ‘దోషిగా ప్రకటించడు’ లేదా ‘ఖండించడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సమీప లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: יַעַזְבֶנּוּ
  choice: అతన్ని … విడిచిపెట్టడు
  rationale: עזב అనే క్రియకు ‘వదలడం, విడిచిపెట్టడం, పరిత్యజించడం’ అనే భావాలున్నాయి. సందర్భంలో నీతిమంతుణ్ణి దుష్టుని ఆధీనంలో వదిలేయకపోవడాన్ని ‘విడిచిపెట్టడు’ సహజంగా తెలియజేస్తుంది.
- source_word: בְיָדוֹ
  choice: దుష్టుని చేతిలో
  rationale: మూలంలోని ‘అతని చేతిలో’ అనే రూపకాన్ని నిలిపి, పూర్వసందర్భం ప్రకారం ఆ సర్వనామం దుష్టుణ్ణి సూచిస్తుందని తెలుగులో స్పష్టం చేశాం. ఈ ప్రయోగం అధికారం లేదా అదుపును సూచిస్తుంది.
- source_word: יַרְשִׁיעֶנּוּ
  choice: అతన్ని దోషిగా తీర్పు తీర్చడు
  rationale: רשע అనే ధాతువు హిఫీల్ రూపంలో న్యాయపరంగా దోషిగా నిర్ధారించడం లేదా ఖండించడం అనే భావం ఇస్తుంది. న్యాయస్థాన సంబంధమైన భావాన్ని తెలుగులో స్పష్టంగా నిలిపాం.
- source_word: בְּהִשָּׁפְטוֹ
  choice: అతనికి తీర్పు జరిగేటప్పుడు
  rationale: ב ఉపసర్గతో వచ్చిన שפט క్రియానామ రూపాన్ని ఇక్కడ కాలసూచకంగా గ్రహించాం. ఎవరు తీర్పు నిర్వహిస్తారో లేదా ఏ న్యాయవేదికలో జరుగుతుందో మూలం చెప్పనందున అవి చేర్చలేదు.
theological_decisions:
- issue: వచనంలోని సర్వనామాల నిర్దేశం
  choice: కర్మ సర్వనామాలు నీతిమంతుణ్ణి, ‘చేతిలో’ అనే పదబంధంలోని స్వామ్య సర్వనామం దుష్టుణ్ణి సూచిస్తుంది.
  alternative: అన్ని సూచనలనూ స్పష్టీకరించకుండా ‘అతని చేతిలో అతన్ని’ అని అనువదించడం.
  rationale: 37వ కీర్తన సమీప సందర్భం దుష్టుడు నీతిమంతునికి విరోధంగా ఉండటాన్ని వివరిస్తుంది. తెలుగులో వరుసగా వచ్చే ‘అతని/అతన్ని’ రూపాలు అనవసరంగా అస్పష్టమవుతాయి కాబట్టి, సందర్భం నిర్దేశించే ‘దుష్టుని’ అని స్పష్టం చేశాం.
- issue: రెండవ పాదంలోని న్యాయపరమైన భావం
  choice: యహ్వే నీతిమంతుణ్ణి దోషిగా తీర్పు తీర్చడు.
  alternative: యహ్వే అతడు దుష్టుడిగా కనబడనివ్వడు.
  rationale: హిఫీల్ రూపంలోని רשע మరియు שפט కలయిక న్యాయపరమైన భాషను సూచిస్తుంది. అందువల్ల తరువాతి సిద్ధాంతపరమైన భావాలను చేర్చకుండా తీర్పు, దోషనిర్ధారణ అనే ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన శైలిని ఉపయోగించాం. ‘చేతిలో’ అనే హెబ్రీయ రూపకాన్ని నిలిపి, దాని భావాన్ని పాదటిప్పణిలో వివరించాం; న్యాయపరమైన పదజాలాన్ని అతిగా సాంకేతికం చేయలేదు.
