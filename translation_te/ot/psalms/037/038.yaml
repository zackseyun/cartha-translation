source:
  edition: WLC
  text: וּֽ֭/פֹשְׁעִים נִשְׁמְד֣וּ יַחְדָּ֑ו אַחֲרִ֖ית רְשָׁעִ֣ים נִכְרָֽתָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/038.yaml
  text: But transgressors are destroyed together[a]; the future of the wicked is cut off.
translation:
  language: te
  text: అయితే అతిక్రమించేవారు అందరూ కలిసి నాశనమవుతారు; దుష్టుల భవిష్యత్తు తెగిపోతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దుష్టుల అంతం తెగిపోతుంది.” హీబ్రూ אַחֲרִית అనే పదానికి “భవిష్యత్తు,” “అంతిమ ఫలితం,” లేదా “అంతం” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פֹשְׁעִים
  choice: అయితే అతిక్రమించేవారు
  rationale: פֹשְׁעִים తిరుగుబాటు లేదా నైతిక-న్యాయ అతిక్రమణను సూచిస్తుంది. సందర్భంలోని నీతిమంతులతో ఉన్న వ్యత్యాసాన్ని చూపడానికి וּ ను ‘అయితే’గా అనువదించాం.
- source_word: נִשְׁמְדוּ
  choice: నాశనమవుతారు
  rationale: שׁמד యొక్క నిఫాల్ రూపం నాశనం చేయబడడాన్ని సూచిస్తుంది. ‘నాశనమవుతారు’ తీర్పు తీవ్రతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יַחְדָּו
  choice: అందరూ కలిసి
  rationale: ఈ క్రియావిశేషణానికి ‘కలిసి’ లేదా ‘మొత్తంగా’ అనే భావాలున్నాయి. సమూహానికి చెందిన వారందరికీ ఒకే గతి కలుగుతుందనే భావాన్ని ‘అందరూ కలిసి’ స్పష్టంగా అందిస్తుంది.
- source_word: אַחֲרִית
  choice: భవిష్యత్తు
  rationale: ఈ పదానికి భవిష్యత్తు, అంతిమ ఫలితం, ముగింపు అనే అర్థాలుండవచ్చు. ఇక్కడ దుష్టులకు ఇక ముందు ఉండబోయే గతిని ‘భవిష్యత్తు’ సహజంగా తెలియజేస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: רְשָׁעִים
  choice: దుష్టులు
  rationale: జ్ఞానసాహిత్య సందర్భాల్లో רְשָׁעִים సూచించే నైతిక వర్గానికి ‘దుష్టులు’ ప్రామాణికమైన, సంక్షిప్తమైన తెలుగు పదం.
- source_word: נִכְרָתָה
  choice: తెగిపోతుంది
  rationale: כרת యొక్క నిఫాల్ రూపంలోని ‘తెగిపోవడం/తొలగించబడడం’ అనే బలమైన రూపకాన్ని ‘తెగిపోతుంది’ నిలుపుతుంది.
theological_decisions:
- issue: తీర్పు సందర్భంలో אַחֲרִית అర్థం
  choice: దుష్టుల భవిష్యత్తు తెగిపోతుంది
  alternative: దుష్టుల అంతం వస్తుంది; లేదా దుష్టుల అంతిమ ఫలితం తొలగించబడుతుంది
  rationale: אַחֲרִית భవిష్యత్తు, అంతిమ ఫలితం, ముగింపు, కొన్నిసార్లు సంతతి అనే భావాలను కలిగి ఉండవచ్చు. ఈ సందర్భం నీతిమంతులకూ దుష్టులకూ కలిగే భిన్న గతులను పోల్చుతుంది కాబట్టి ‘భవిష్యత్తు’ ప్రధాన పాఠంలో సరిపోతుంది. ‘అంతం’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచి మూలంలోని అర్థ విస్తృతిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. సమాంతర కవితా నిర్మాణాన్ని కాపాడుతూ, మూలంలోని తీర్పు తీవ్రతను తగ్గించలేదు.
