  source_fidelity: 'ప్రధాన పాఠం హీబ్రూ వాక్యనిర్మాణాన్నీ ప్రధాన పదార్థాన్నీ విశ్వసనీయంగా ప్రతిబింబిస్తుంది: פֹשְׁעִים‌కు ‘అతిక్రమించేవారు,’ נִשְׁמְדוּకు ‘నాశనమవుతారు,’ యַחְדָּוకు ‘అందరూ కలిసి,’ మరియు נִכְרָתָהకు ‘తెగిపోతుంది’ సముచితమైన ఎంపికలు. అయితే పాదసూచికలో ప్రత్యామ్నాయంగా ఇచ్చిన ‘దుష్టుల అంతం వస్తుంది’ అనేది נִכְרָתָה (‘తెగిపోతుంది/తొలగించబడుతుంది’) భావాన్ని విడిచిపెడుతుంది.'
  naturalness: ‘అయితే అతిక్రమించేవారు అందరూ కలిసి నాశనమవుతారు; దుష్టుల భవిష్యత్తు తెగిపోతుంది’ అనేది ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, గంభీరంగా ఉంది. ‘భవిష్యత్తు తెగిపోతుంది’ కొద్దిగా రూపకాలంకారమైన ప్రయోగమైనప్పటికీ, మూలంలోని ‘cut off’ రూపకాన్ని కాపాడుతుంది మరియు ఈ కవితా-తీర్పు సందర్భానికి సరిపోతుంది.
  terminology: ‘అతిక్రమించేవారు’ మరియు ‘దుష్టులు’ వరుసగా פֹשְׁעִים, רְשָׁעִים మధ్య ఉన్న సూక్ష్మ వ్యత్యాసాన్ని కాపాడుతున్నాయి. אַחֲרִיתకు ‘భవిష్యత్తు’ ప్రధాన పాఠంలో తగినది; ‘అంతం’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచవచ్చు, కానీ ప్రత్యామ్నాయ వాక్యంలో కూడా నִכְרָתָה భావం ఉండాలి.
