    issue: Opening temporal clause is elliptical in Telugu.
    rationale: 'The Hebrew itself is elliptical, but Telugu benefits from an explicit copula: “ఇంకా కొద్దికాలమే ఉంది.” This retains the source sense while improving readability.'
  - severity: low
    issue: Footnote anchor follows the final clause rather than the term explained.
