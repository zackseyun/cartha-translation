  yaml_path: translation/ot/psalms/037/010.yaml
  text: Yet a little while[a], and the wicked will be no more; though you look carefully at his place, he will not be there.
translation:
  language: te
  text: ఇంకా కొద్దికాలమే ఉంది; దుష్టుడు[a] ఇక ఉండడు. నీవు అతని స్థలాన్ని జాగ్రత్తగా పరిశీలించినా, అతడు అక్కడ ఉండడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దుష్టుడు’ అని ఉన్న హీబ్రూ పురుష ఏకవచన రూపం, దుష్టులను సాధారణంగా లేదా సమష్టిగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד מְעַט
  choice: ఇంకా కొంతకాలమే
  rationale: ఈ పదబంధం కొద్దికాలం మిగిలి ఉందనే భావాన్ని ఇస్తుంది. ‘కొంతకాలమే’ కాలార్థాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టం చేస్తుంది.
- source_word: וְאֵין רָשָׁע
  choice: దుష్టుడు ఇక ఉండడు
  rationale: భవిష్యదర్థ సందర్భంలో అస్తిత్వనిషేధాన్ని ‘ఇక ఉండడు’గా అనువదించడం, అతని ఉనికి తొలగిపోతుందనే భావాన్ని నిలుపుతుంది. ఏకవచనం ప్రతినిధి లేదా సామూహిక అర్థంలోనూ ఉండవచ్చు.
- source_word: וְהִתְבּוֹנַנְתָּ
  choice: నీవు జాగ్రత్తగా పరిశీలించినా
  rationale: హిత్పోలేల్ రూపం శ్రద్ధగా గమనించడం లేదా పరిశీలించడం అనే భావాన్ని ఇస్తుంది. సందర్భంలోని concessive భావాన్ని ‘-ఇనా’ నిర్మాణం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַל מְקוֹמוֹ
  choice: అతని స్థలాన్ని
  rationale: అతడు ఉన్న ప్రదేశం వైపు దృష్టిపెట్టి వెదకడాన్ని concrete imageతో నిలుపుతుంది; తెలుగులో ‘పరిశీలించు’తో కర్మవిభక్తి సహజం.
- source_word: וְאֵינֶנּוּ
  choice: అతడు అక్కడ ఉండడు
  rationale: ముందు ప్రస్తావించిన స్థలంలో అతడు కనిపించకపోవడాన్ని స్పష్టంగా పునరుద్ఘాటిస్తుంది; ‘అక్కడ’ అనేది హీబ్రూలోని స్థలసూచనను సహజ తెలుగులో అనుసంధానిస్తుంది.
theological_decisions:
- issue: רָשָׁע అనే పురుష ఏకవచనానికి ప్రతినిధి/సామూహిక భావం
  choice: ప్రధాన పాఠ్యంలో ‘దుష్టుడు’ అనే ఏకవచనాన్ని ఉంచి, దాని విస్తృత భావాన్ని పాదసూచికలో తెలపడం
  alternative: ‘దుష్టులు’ అని నేరుగా బహువచనంలో అనువదించడం
  rationale: హీబ్రూ వ్యాకరణ రూపాన్ని నిలుపుతూ, అది ఒక్క వ్యక్తికే పరిమితం కావలసిన అవసరం లేదనే నిజమైన అర్థవ్యాప్తిని పాఠకునికి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకునికి సులభంగా అర్థమయ్యేలా, కీర్తనకు తగిన గంభీరతతో రూపొందించబడింది. హీబ్రూ ఏకవచనం మరియు దాని ప్రతినిధి భావం రెండూ సంరక్షించబడ్డాయి.
