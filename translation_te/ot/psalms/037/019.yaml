  text: לֹֽא יֵ֭בֹשׁוּ בְּ/עֵ֣ת רָעָ֑ה וּ/בִ/ימֵ֖י רְעָב֣וֹן יִשְׂבָּֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/019.yaml
  text: They will not be put to shame in a time of trouble[c][b][a], and in days of famine they will be satisfied.
translation:
  language: te
  text: ఆపద కాలంలో వారు అవమానానికి గురికారు[a][b]; కరవు రోజుల్లో వారు తృప్తి పొందుతారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సిగ్గుపడరు.’ హీబ్రూ క్రియ సిగ్గును అనుభవించడం లేదా అవమానానికి గురికావడం—ఈ రెండింటిలో ఏ భావాన్నైనా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘విపత్తు కాలంలో,’ ‘కీడు కలిగే కాలంలో.’ ఇక్కడ ‘కీడు’ నైతిక చెడును కాక ప్రతికూల పరిస్థితిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘వారు కడుపు నిండా పొందుతారు,’ ‘వారు సంతృప్తి చెందుతారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: అవమానానికి గురికారు
  rationale: בושׁ అనే క్రియ విఫలమైన నిరీక్షణ లేదా బహిరంగ పరాభవం వల్ల కలిగే అవమానాన్ని సూచించగలదు. తెలుగు వాక్యంలో ఫలితార్థాన్ని సహజంగా నిలుపుతూ, కేవలం అంతర్గత సిగ్గు భావానికే పరిమితం కాకుండా ఈ రూపం ఉపయోగించబడింది.
- source_word: בְּעֵת רָעָה
  choice: ఆపదకాలంలో
  rationale: עֵת అంటే ‘కాలం’; ఈ సందర్భంలో רָעָה నైతిక చెడును కాక ప్రతికూలత లేదా విపత్తును సూచిస్తుంది. ‘ఆపదకాలంలో’ అనేది సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: רָעָה
  choice: ఆపద
  rationale: ఇక్కడ ఈ పదం నైతిక దుష్టత్వాన్ని కాక కష్టం, విపత్తు, దురవస్థను సూచిస్తుంది. ‘ఆపద’ ఈ విస్తృత భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּבִימֵי רְעָבוֹן
  choice: కరవు రోజుల్లో
  rationale: హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, తీవ్రమైన ఆహార కొరత కొనసాగే కాలాన్ని ఈ పదబంధం తెలియజేస్తుంది.
- source_word: רְעָבוֹן
  choice: కరవు
  rationale: רְעָבוֹן తీవ్రమైన ఆహార కొరత లేదా కరవును సూచిస్తుంది. సందర్భానికి ‘కరవు’ అత్యంత సహజమైన, నిర్దిష్టమైన తెలుగు పదం.
- source_word: יִשְׂבָּעוּ
  choice: తృప్తిగా ఉంటారు
  rationale: שׂבע కడుపు నిండడం, సమృద్ధిగా లభించి తృప్తి చెందడం అనే భావాన్ని ఇస్తుంది. ‘తృప్తిగా ఉంటారు’ సరిపడిన పోషణ లభిస్తుందనే హామీని సహజంగా తెలియజేస్తూ, అది ఏ విధంగా లభిస్తుందో అదనంగా నిర్దేశించదు.
