source:
  edition: WLC
  text: מֵ֭/יְהוָה מִֽצְעֲדֵי גֶ֥בֶר כּוֹנָ֗נוּ וְ/דַרְכּ֥/וֹ יֶחְפָּֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/023.yaml
  text: From Yahweh a man's steps are established[b][a], and he delights in his way.
translation:
  language: te
  text: యెహోవా వలన ఒక మనిషి అడుగులు స్థిరపరచబడతాయి; ఆయన అతని మార్గాన్ని ఇష్టపడతాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, ఇక్కడ ఇష్టపడేవాడు యెహోవా కాక ఆ మనిషి అని అర్థం చేసుకోవచ్చు: “అతడు తన మార్గాన్ని ఇష్టపడతాడు.”'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵיְהוָה
  choice: యెహోవా నుంచే
  rationale: מִן మూలం లేదా కార్యసాధకుడిని సూచిస్తుంది. ‘నుంచే’ అనే రూపం అడుగుల స్థిరత్వం యెహోవా నుంచే కలుగుతుందనే హెబ్రీ ముందస్థాన ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מִצְעֲדֵי גֶבֶר
  choice: ఒక మనిషి అడుగులు
  rationale: מִצְעָדִים నడకలోని అడుగులను సూచిస్తూ జీవన ప్రస్థానానికి రూపకంగా కూడా పనిచేస్తుంది; גֶבֶר ఇక్కడ జ్ఞానసాహిత్య శైలిలో ఒక మనిషిని సూచిస్తుంది.
- source_word: כּוֹנָנוּ
  choice: స్థిరపడతాయి
  rationale: כון యొక్క ఈ రూపం స్థాపించబడడం, దృఢపరచబడడం అనే భావాన్ని ఇస్తుంది. తెలుగు మధ్యమ/అకర్మక రూపం హెబ్రీ నిష్క్రియ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְדַרְכּוֹ
  choice: అతని మార్గంలో
  rationale: דֶּרֶךְ అక్షరార్థంలో మార్గాన్నీ, రూపకంగా జీవన విధానాన్నీ సూచించగలదు. חפץతో కలిపి తెలుగులో ‘మార్గంలో ఆనందించడం’ సహజంగా ఉంటుంది.
- source_word: יֶחְפָּץ
  choice: ఆయన ఆనందిస్తాడు
  rationale: חפץ ఆనందించడం, ఇష్టపడడం అనే అర్థం ఇస్తుంది. ప్రధాన పఠనంలో అంతర్లీన కర్త యెహోవా కాబట్టి గౌరవ ఏకవచనమైన ‘ఆయన’ వాడబడింది.
theological_decisions:
- issue: יֶחְפָּץ (‘ఆనందిస్తాడు’) అనే క్రియకు కర్త ఎవరు?
  choice: 'ప్రధాన పాఠంలో కర్త యెహోవా: ‘అతని మార్గంలో ఆయన ఆనందిస్తాడు.’'
  alternative: 'కర్త ఆ మనిషి: ‘అతడు తన మార్గంలో ఆనందిస్తాడు.’'
  rationale: హెబ్రీలో కర్త స్పష్టంగా చెప్పబడలేదు. మొదటి భాగంలోని యెహోవానే కర్తగా కొనసాగడం వాక్యనిర్మాణపరంగా సహజమైన ప్రధాన పఠనం; అయినా ఆ మనిషిని కర్తగా తీసుకోవడం కూడా సాధ్యమే కాబట్టి ఆ అస్పష్టతను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన కీర్తనాశైలి. ‘యెహోవా నుంచే’ మూలపాఠంలోని ముందస్థాన ఉద్ఘాటనను నిలుపుతుంది; ‘ఆయన’ ప్రధాన పఠనాన్ని స్పష్టం చేస్తూనే నిజమైన కర్త-అస్పష్టతను పాదసూచికలో భద్రపరుస్తుంది.
