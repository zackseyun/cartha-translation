source:
  edition: WLC
  text: וַֽ/יַּעְזְרֵ֥/ם יְהוָ֗ה וַֽ/יְפַ֫לְּטֵ֥/ם יְפַלְּטֵ֣/ם מֵ֭/רְשָׁעִים וְ/יוֹשִׁיעֵ֑/ם כִּי חָ֥סוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/040.yaml
  text: Yahweh helps them and delivers them[a]; he delivers them from the wicked and saves them[b], because they take refuge in him.
translation:
  language: te
  text: యాహ్వే వారికి సహాయం చేస్తాడు, వారిని విడిపిస్తాడు[a]; దుష్టులనుండి వారిని విడిపించి రక్షిస్తాడు, ఎందుకంటే వారు ఆయనలో ఆశ్రయం పొందుతారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, రెండు చోట్లా ‘వారిని కాపాడుతాడు’; హీబ్రూలో ఒకే విడిపింపు క్రియ రెండుసార్లు వచ్చి భావాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారు ఆయనపై నమ్మకం ఉంచుతారు’; హీబ్రూలో మరింత అక్షరార్థంగా ఆయనలో ఆశ్రయం పొందడం గురించి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన వ్యక్తినామ రూపంలో అందించాం.
- source_word: וַיַּעְזְרֵם
  choice: వారికి సహాయం చేసి
  rationale: עזר అనే క్రియలోని సహాయం/తోడ్పాటు భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలిపాం.
- source_word: וַיְפַלְּטֵם / יְפַלְּטֵם
  choice: వారిని విడిపిస్తాడు; వారిని విడిపించి
  rationale: פלט క్రియ యొక్క రక్షించి తప్పించే భావాన్ని ‘విడిపించు’తో తెలిపి, మూలంలోని ఉద్దేశపూర్వక పునరుక్తిని నిలిపాం.
- source_word: מֵרְשָׁעִים
  choice: దుష్టుల చేతిలోనుండి
  rationale: బహువచన నామవాచకార్థక విశేషణాన్ని ‘దుష్టులు’గా అనువదించాం; వారినుంచి కలిగే ప్రమాదం నుండి విడిపించడం తెలుగులో సహజంగా వినిపించేందుకు ‘చేతిలోనుండి’ వాడాం.
- source_word: וְיוֹשִׁיעֵם
  choice: రక్షిస్తాడు
  rationale: ישע యొక్క విస్తృత రక్షణ భావాన్నీ దాని వేదాంతపరమైన బరువునీ సహజంగా నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: దేవుని రక్షణ చర్యకు కారణాన్ని స్పష్టంగా పరిచయం చేసే ఆధునిక తెలుగు కారణసూచకం.
- source_word: חָסוּ בוֹ
  choice: వారు ఆయనను ఆశ్రయించారు
  rationale: חסה లోని ఆశ్రయం పొందడం/శరణు కోరడం అనే రూపకాన్ని సాధారణ ‘నమ్మకం’గా కుదించకుండా నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అందించాలి
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది; దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగు పాఠకులకు సుపరిచితమైన నామరూపాన్ని వాడాం.
- issue: פלט క్రియ పునరుక్తిని నిలపాలా
  choice: ‘విడిపిస్తాడు’ అనే భావాన్ని రెండు సార్లు నిలిపాం
  alternative: ఒకే విడిపింపు వాక్యంగా సంక్షిప్తం చేయడం
  rationale: హీబ్రూలో సమీప వాక్యభాగాల్లో అదే క్రియ పునరావృతమై, దేవుని విడిపింపు కార్యాన్ని నొక్కిచెబుతుంది; అందువల్ల దానిని తొలగించలేదు.
- issue: חסה ను నమ్మకమా, ఆశ్రయమా అని అనువదించాలి
  choice: ఆశ్రయించారు
  alternative: ఆయనపై నమ్మకం ఉంచారు
  rationale: సందర్భంలో నమ్మకం అంతర్భూతమైనప్పటికీ, మూలక్రియలోని ఆశ్రయం/శరణు రూపకాన్ని ప్రధాన పాఠంలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కీర్తనా శైలిని వాడాం. హీబ్రూ క్రియల కథనరూపాన్ని ఈ కీర్తన ముగింపు సారాంశానికి తగిన సహజ వర్తమానకాలంగా అందించాం; చివరి חָסוּ యొక్క సంపూర్ణ క్రియాభావాన్ని ‘ఆశ్రయించారు’గా ఉంచాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
