  text: The wicked watches the righteous and seeks to put him to death[a][b].
translation:
  language: te
  text: దుష్టుడు నీతిమంతుని గమనిస్తూ, అతన్ని చంపాలని ప్రయత్నిస్తాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీతిమంతుని మాటువేసి ఉంటాడు.” సందర్భానుసారంగా హీబ్రూ క్రియ హాని చేయాలనే ఉద్దేశంతో గమనించడం అనే భావాన్ని కలిగివుండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అతన్ని హతమార్చాలని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צוֹפֶה
  choice: కన్నేసి ఉంచి
  rationale: ఈ క్రియకు ‘గమనిస్తూ ఉండడం’ అనే ప్రాథమిక భావం ఉంది; ఈ ప్రతికూల సందర్భంలో హాని చేయాలనే ఉద్దేశంతో కనిపెట్టడం అనే భావం వస్తుంది. తెలుగు ప్రయోగం ఆ విరోధపూరిత నిగూఢార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: רָשָׁע
  choice: దుష్టుడు
  rationale: ఏకవచనంలో నామవాచకంగా వాడిన విశేషణం ఒక దుష్ట వ్యక్తిని సూచిస్తుంది; కీర్తనలోని ప్రాతినిధ్య ఏకవచనాన్ని నిలుపుతుంది.
- source_word: לַצַּדִּיק
  choice: నీతిమంతునిపై
  rationale: צַדִּיק అనే పదంలోని నైతిక వర్గాన్ని ‘నీతిమంతుడు’ స్పష్టంగా, ప్రామాణిక ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ל ఉపసర్గకు ఈ క్రియతో సందర్భానుసారంగా ‘పై’ సహజంగా సరిపోతుంది.
- source_word: וּמְבַקֵּשׁ
  choice: చంపాలని చూస్తాడు
  rationale: בקש ప్రాథమికంగా ‘వెదకు/కోరు’ అని అర్థమిచ్చినా, ఉద్దేశించిన కార్యంతో కలిసినప్పుడు ‘చేయాలని చూడడం’ అనే తెలుగు నిర్మాణం ప్రయత్నం లేదా సంకల్పాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לַהֲמִיתוֹ
  choice: అతన్ని చంపాలని
  rationale: מות హిఫీల్ రూపం ‘చనిపోయేలా చేయడం’ను సూచిస్తుంది. ‘చంపడం’ ఆధునిక తెలుగులో నేరుగా, స్పష్టంగా అదే భావాన్ని అందిస్తుంది; ప్రత్యామ్నాయంగా మరింత విస్తృతమైన ‘ప్రాణం తీయడం’ సాధ్యం.
- source_word: וּ
  choice: అతన్ని
  rationale: హీబ్రూ సంధి రెండు సమాంతర క్రియలను కలుపుతుంది; తెలుగులో మొదటి అసమాపక క్రియ తర్వాత రెండవ ప్రధాన క్రియను ఉంచడం ద్వారా ఆ అనుసంధానం సహజంగా వ్యక్తమవుతుంది.
