translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే, గంభీరమైన కవితా వాక్యంగా రూపొందించబడింది. హీబ్రూ ప్రాతినిధ్య ఏకవచనం నిలుపబడింది; విరోధపూరితంగా గమనించే భావాన్ని ప్రధాన పాఠ్యంలో సహజమైన తెలుగు నుడికారంతో, మరింత ప్రత్యక్ష ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
