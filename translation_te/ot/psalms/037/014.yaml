id: PSA.37.14
reference: Psalms 37:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: חֶ֤רֶב פָּֽתְח֣וּ רְשָׁעִים֮ וְ/דָרְכ֪וּ קַ֫שְׁתָּ֥/ם לְ֭/הַפִּיל עָנִ֣י וְ/אֶבְי֑וֹן לִ֝/טְב֗וֹחַ יִשְׁרֵי דָֽרֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/014.yaml
  text: The wicked have drawn the sword and bent their bow[a], to bring down the poor and needy[b], to slaughter those upright in way.
translation:
  language: te
  text: దుర్మార్గులు ఖడ్గాన్ని ఒరనుండి తీసి, తమ విల్లును వంచారు—పేదవారిని, అక్కరలో ఉన్నవారిని కూలదోయడానికి, నీతిగా నడిచేవారిని వధించడానికి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶרֶב פָּתְחוּ
  choice: ఖడ్గాన్ని దూసి
  rationale: పదశః ‘ఖడ్గాన్ని తెరిచారు’; ఆయుధ సందర్భంలో ఇది ఖడ్గాన్ని ఒరనుండి తీయడాన్ని సూచించే హీబ్రూ నుడికారం. ‘ఖడ్గాన్ని దూసి’ సహజమైన, చిత్రాత్మకమైన తెలుగు.
- source_word: רְשָׁעִים
  choice: దుర్మార్గులు
  rationale: నైతికంగా చెడ్డవారనే కీర్తనలోని వర్గాన్ని లింగాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
- source_word: וְדָרְכוּ קַשְׁתָּם
  choice: తమ విల్లును ఎక్కుపెట్టారు
  rationale: విల్లును తొక్కి వంచి ప్రయోగానికి సిద్ధం చేయడమే మూలభావం. ‘విల్లును ఎక్కుపెట్టారు’ ఆధునిక తెలుగులో విల్లంబును సిద్ధం చేయడాన్ని సహజంగా వ్యక్తం చేస్తుంది; హీబ్రూలోని ఏకవచన సమూహప్రయోగాన్ని కూడా నిలుపుతుంది.
- source_word: לְהַפִּיל
  choice: కూలదోయడానికి
  rationale: హిఫిల్ రూపంలోని ‘పడేలా చేయు’ అనే కారణార్థాన్ని, హింసాత్మక సందర్భానికి సరిపోయేలా వ్యక్తం చేస్తుంది.
- source_word: עָנִי
  choice: పేదవారిని
  rationale: ఈ పదం బాధితులు లేదా దీనులు అనే భావాన్నీ కలిగి ఉండగలదు; అయితే אֶבְיוֹןతో సమాంతరంగా ఉన్నందున ఆర్థిక-సామాజిక బలహీనతను సూచించే ‘పేదవారు’ తగినది.
- source_word: וְאֶבְיוֹן
  choice: అక్కరలో ఉన్నవారిని
  rationale: అవసరంలో, కొరతలో ఉన్నవారనే ప్రత్యేక భావాన్ని నిలుపుతూ עָנִיతోని సమాంతరతలో పదపునరుక్తిని నివారిస్తుంది.
- source_word: לִטְבֹחַ
  choice: వధించడానికి
  rationale: సాధారణ ‘చంపడం’ కంటే బలమైన హింసాత్మక భావాన్ని గౌరవప్రదమైన కీర్తనా శైలిలో అందిస్తుంది.
- source_word: יִשְׁרֵי דָרֶךְ
  choice: సన్మార్గంలో నడిచేవారిని
  rationale: పదశః ‘మార్గంలో నిటారైనవారు/మార్గనిష్ఠులు’; జీవన ప్రవర్తనలో నైతిక యథార్థతను ఆధునిక, సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీర కీర్తనా శైలి. ఆయుధ సంబంధ హీబ్రూ నుడికారాలను సహజ తెలుగులో అందిస్తూ, పేదరికం/అక్కర మరియు సన్మార్గ జీవనం అనే సమాంతర భావాలను నిలిపింది.
