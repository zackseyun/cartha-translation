id: PSA.37.11
reference: Psalms 37:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/עֲנָוִ֥ים יִֽירְשׁוּ אָ֑רֶץ וְ֝/הִתְעַנְּג֗וּ עַל רֹ֥ב שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/011.yaml
  text: But the humble will inherit the land and delight themselves in abundant peace[a][b].
translation:
  language: te
  text: 'అయితే అణకువగలవారు[a] దేశాన్ని[b] వారసత్వంగా పొందుతారు;

    వారు సమృద్ధమైన శాంతిలో ఆనందిస్తారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సాత్వికులు”; సందర్భానుసారంగా, “అణచివేయబడినవారు” లేదా “అల్పస్థితిలో ఉన్నవారు” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “భూమిని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָוִים
  choice: దీనులు
  rationale: ఈ బహువచన నామవాచకం అణకువగలవారిని, వినయస్థులను లేదా అణచివేయబడినవారిని సూచించగలదు. ‘దీనులు’ అనే పదం కీర్తన సందర్భంలోని సామాజిక అల్పత్వం, వినయం రెండింటినీ సంక్షిప్తంగా నిలుపుతుంది; ‘సాత్వికులు’ అనే నైతిక ఛాయను ప్రత్యామ్నాయంగా పాదటిప్పణిలో ఉంచాం.
- source_word: יִירְשׁוּ
  choice: స్వాస్థ్యంగా పొందుతారు
  rationale: ירשׁ అంటే వారసత్వంగా పొందడం లేదా స్వాధీనం చేసుకోవడం. ‘స్వాస్థ్యంగా పొందుతారు’ భవిష్యత్ భావాన్నీ, నిబంధనాత్మక వారసత్వ ప్రతిధ్వనినీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אָרֶץ
  choice: దేశాన్ని
  rationale: אֶרֶץకు ‘దేశం/భూమి’ అనే రెండు అర్థాలు సాధ్యమే. ఈ కీర్తనలో దేశంలో నిలిచి దానిని స్వాస్థ్యంగా పొందే పునరావృత సందర్భం వల్ల ‘దేశం’ ప్రధాన పాఠంగా ఎంచుకున్నాం; విస్తృతమైన ‘భూమి’ అర్థాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: וְהִתְעַנְּגוּ
  choice: ఆనందిస్తారు
  rationale: ענג హిత్పయేల్ రూపం తాము సంతోషించడం, ఎంతో ఆనందించడం అనే భావాన్ని ఇస్తుంది. తెలుగులో ‘ఆనందిస్తారు’ సహజంగా ఉండి ఆ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: עַל
  choice: లో
  rationale: మూల ఉపసర్గకు ‘మీద/వలన’ వంటి అర్థాలు ఉన్నా, శాంతికి సంబంధించి ఆనందించడం అనే ప్రయోగంలో తెలుగు సహజ నుడికారానికి ‘లో’ సరిపోతుంది.
- source_word: רֹב
  choice: సమృద్ధిగల
  rationale: ఈ నామవాచకం విస్తారాన్ని లేదా సమృద్ధిని సూచిస్తుంది. తరువాతి ‘శాంతి’తో కలిపి ‘సమృద్ధిగల’ అని చెప్పడం సహజంగా ఉండి పరిపూర్ణ పరిమాణ భావాన్ని నిలుపుతుంది.
- source_word: שָׁלוֹם
  choice: శాంతి
  rationale: שָׁלוֹםలో క్షేమం, సంపూర్ణత, సురక్షిత సౌభాగ్యం వంటి విస్తృత భావాలు ఉన్నా, ఈ సందర్భంలో ‘శాంతి’ సంక్షిప్తమైన ప్రామాణిక తెలుగు సమానార్థకం.
theological_decisions:
- issue: మత్తయి 5:5తో అంతర్పాఠ్య సంబంధం మరియు ‘సాత్వికులు భూమిని స్వతంత్రించుకుంటారు’ అనే సంప్రదాయ ప్రయోగం
  choice: హీబ్రూ కీర్తన సందర్భాన్ని అనుసరించి ప్రధాన పాఠంలో ‘దీనులు దేశాన్ని స్వాస్థ్యంగా పొందుతారు’ అని అనువదించి, ‘సాత్వికులు’ మరియు ‘భూమి’ అనే సముచిత ప్రత్యామ్నాయాలను పాదటిప్పణుల్లో ఉంచడం.
  alternative: సాత్వికులు భూమిని స్వాస్థ్యంగా పొందుతారు.
  rationale: ప్రధాన పాఠం తరువాతి సంప్రదాయ పదప్రయోగాన్ని యాంత్రికంగా అనుసరించకుండా మూలభాషలోని కీర్తన సందర్భానికి ప్రాధాన్యమిస్తుంది. అదే సమయంలో మత్తయి 5:5తో ఉన్న నిజమైన అంతర్పాఠ్య ప్రతిధ్వనిని, పదాల విస్తృత అర్థసాధ్యతను పాదటిప్పణులు కాపాడుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే కీర్తనా శైలిని అనుసరించాం. హీబ్రూలోని రెండు సమాంతర భాగాలను అర్ధవిరామంతో వేరు చేశాం. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిగ్గా జతచేయబడ్డాయి.
