  to: 'అయితే అణకువగలవారు[a] దేశాన్ని[b] వారసత్వంగా పొందుతారు;

    వారు సమృద్ధమైన శాంతిలో ఆనందిస్తారు.'
  rationale: సవరణ హీబ్రూ పదాల అర్థపరిధిని కాపాడుతూ ఆధునిక ప్రామాణిక తెలుగు నుడికారాన్ని మెరుగుపరుస్తుంది. అణకువ, వారసత్వం, సమృద్ధమైన శాంతి అనే ప్రధాన భావాలు స్పష్టంగా నిలుస్తాయి; ‘సాత్వికులు’ మరియు ‘భూమి’ అనే చెల్లుబాటు అయ్యే ప్రత్యామ్నాయాలు సరైన గుర్తులతో పాదటిప్పణుల్లో భద్రంగా ఉన్నాయి.
