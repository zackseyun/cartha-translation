  text: Delight yourself in Yahweh[a], and he will give you the desires of your heart.
translation:
  language: te
  text: యాహ్వేలో ఆనందించు; ఆయన నీ హృదయ కోరికలను[a] నీకు ఇస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ హృదయ విన్నపాలను.’ హీబ్రూ నామవాచకం అంతరంగంలో కోరుకునే వాటినీ, అడిగే విన్నపాలనూ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעַנַּג
  choice: ఆనందించు
  rationale: హిత్‌పయేల్ ఆజ్ఞారూపం యాహ్వేలో ఆనందాన్ని పొందమని వ్యక్తిని పిలుస్తుంది. తెలుగులో ‘ఆనందించు’ సహజంగా ఉండి ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל
  choice: లో
  rationale: మూల అర్థం ‘మీద/పై’ అయినా, ఆనందానికి ఆధారమైన వ్యక్తిని సూచించే ఈ సందర్భంలో తెలుగులో ‘యాహ్వేలో’ అనడం సహజమైన సంబంధార్థాన్ని ఇస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: יִתֶּן
  choice: ఇస్తాడు
  rationale: సంయోజక అవ్యయంతో ఉన్న ఖల్ అసంపూర్ణ క్రియను ఈ జ్ఞానోపదేశ సందర్భంలో భవిష్యత్తు/ఫలిత ప్రకటనగా సహజంగా అనువదించాం.
- source_word: מִשְׁאֲלֹת
  choice: కోరికలను
  rationale: ఈ నామవాచకం అంతరంగ కోరికలను గానీ అడిగిన విన్నపాలను గానీ సూచించగలదు. ‘హృదయ’ంతో కలిసినప్పుడు ‘కోరికలు’ ప్రధాన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; మరో సాధ్యార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: לִבֶּךָ
  choice: నీ హృదయ
  rationale: హీబ్రూ భావంలో హృదయం కోరిక, సంకల్పం, అంతరంగ వ్యక్తిత్వం వంటి అంశాలను కలిగి ఉంటుంది. మూలంలోని సంక్షిప్తతను నిలుపుతూ సాధారణ పదమైన ‘హృదయం’ వాడాం.
theological_decisions:
- issue: ఈ వాగ్దానాన్ని భౌతిక సమృద్ధికి హామీగా తప్పుగా అర్థం చేసుకునే అవకాశం
  choice: మూలపాఠంలో ఉన్న వాగ్దానాన్ని అదనపు పరిమితులు లేకుండా నేరుగా అనువదించడం
  alternative: ‘దైవభక్తిగల కోరికలు’ అని పరిమితం చేయడం లేదా దేవుడు కోరికలను మార్చి నెరవేరుస్తాడని విస్తరించడం
  rationale: హీబ్రూ వాక్యం వాగ్దానాన్ని సూటిగా చెబుతుంది. ‘దైవభక్తిగల’ వంటి వివరణను చేర్చడం లేదా కోరికల మార్పు గురించి చెప్పడం మూలంలో స్పష్టంగా లేని వ్యాఖ్యానాన్ని దిగుమతి చేస్తుంది.
- issue: దైవనామం యొక్క అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు లేదా యెహోవా
  rationale: మూలపాఠంలో יְהוָה అనే వ్యక్తిగత దైవనామం ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ‘యాహ్వే’గా ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఏకవచన ఆజ్ఞారూపాన్ని ఉపయోగించాం. కవితా సంక్షిప్తతను నిలిపి, మూలంలో లేని వ్యాఖ్యానాత్మక విస్తరణలను నివారించాం.
