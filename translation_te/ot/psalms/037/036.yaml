source:
  edition: WLC
  text: וַ֭/יַּֽעֲבֹר וְ/הִנֵּ֣ה אֵינֶ֑/נּוּ וָֽ֝/אֲבַקְשֵׁ֗/הוּ וְ/לֹ֣א נִמְצָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/036.yaml
  text: But he passed by[a], and behold, he was no more; I sought him, but he could not be found.
translation:
  language: te
  text: అతడు వెళ్లిపోయాడు[a]; ఇదిగో, ఇక అతడు లేడు. నేను అతని కోసం వెదికాను, కాని అతడు కనిపించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాటిపోయాడు’; ‘గతించిపోయాడు.’ హీబ్రూ క్రియ దాటిపోవడం లేదా వెళ్లిపోవడం, సందర్భానుసారంగా గతించిపోవడం అనే భావాలను ఇవ్వగలదు. ఇక్కడ దుష్టుడు కనబడకుండా పోవడాన్ని వర్ణిస్తోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: అతడు వెళ్లిపోయాడు
  rationale: עבר అనే క్రియకు ‘దాటిపోవడం,’ ‘వెళ్లిపోవడం’ అనే అర్థాలు ఉన్నాయి; ఈ సందర్భంలో దుష్టుడు అకస్మాత్తుగా కనబడకుండా పోవడాన్ని ‘వెళ్లిపోయాడు’ సహజంగా తెలియజేస్తుంది. మరణించాడని తప్పనిసరిగా నిర్ణయించే ‘గతించాడు’ అనే పదాన్ని నివారించి, మూలంలోని అర్థవిస్తృతిని పాదటిప్పణిలో ఉంచాం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: ఆశ్చర్యకరమైన పరిణామం వైపు పాఠకుని దృష్టిని ఆకర్షించే హీబ్రూ ఉద్ఘాటనను సంక్షిప్తంగా, కవితాత్మకంగా నిలుపుతుంది.
- source_word: אֵינֶנּוּ
  choice: ఇక అతడు లేడు
  rationale: ఇది అతని గైర్హాజరును, కనబడకపోవడాన్ని తీవ్రంగా తెలియజేస్తుంది; అతడు నిర్మూలమయ్యాడనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: וָאֲבַקְשֵׁהוּ
  choice: నేను అతని కోసం వెదికాను
  rationale: בקשׁ యొక్క ‘వెదుకు’ అనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְלֹא נִמְצָא
  choice: కాని అతడు కనిపించలేదు
  rationale: מצא నిఫాల్ రూపంలోని ‘దొరకలేదు/కనిపించలేదు’ అనే ఫలితాన్ని తెలుగులో సహజంగా తెలుపుతుంది; ముందున్న వెదకడానికి వ్యతిరేక ఫలితాన్ని ‘కాని’ స్పష్టం చేస్తుంది.
theological_decisions:
- issue: וַיַּעֲבֹר అనే పదం మరణాన్ని సూచిస్తుందా లేక కేవలం వెళ్లిపోవడాన్ని సూచిస్తుందా
  choice: వెళ్లిపోయాడు
  alternative: దాటిపోయాడు; గతించిపోయాడు
  rationale: వచనం దుష్టుని అకస్మాత్తు అదృశ్యాన్ని చెబుతుంది, కాని ఈ క్రియ ఒక్కటే అతడు మరణించాడని ఖచ్చితంగా చెప్పదు. అందువల్ల తటస్థమైన అనువాదాన్ని ప్రధాన పాఠ్యంలో ఉంచి, నిజమైన భాషాపరమైన సందిగ్ధతను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తనకు తగిన గంభీరత, సంక్షిప్తత నిలుపబడ్డాయి. ‘ఇదిగో’ ద్వారా హీబ్రూ కవిత్వంలోని ఆకస్మిక దృష్టి మలుపు కాపాడబడింది.
