  text: Observe the blameless[a], and see the upright[c][b], for there is a future for the man of peace.
translation:
  language: te
  text: నిందారహితుణ్ణి గమనించు[a], యథార్థవంతుణ్ణి చూడు; ఎందుకంటే శాంతిగల మనిషికి[c] భవిష్యత్తు ఉంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిందారహితుణ్ణి లక్ష్యపెట్టు, యథార్థవంతుణ్ణి చూడు.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదం ‘ముగింపు’ లేదా ‘తుదిఫలితం’ అని కూడా అర్థమివ్వగలదు; కొందరు ఇక్కడ దాన్ని ‘సంతతి’గా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘శాంతిపరుడైన మనిషికి’; ఇక్కడి హీబ్రూ పదం క్షేమం లేదా సంపూర్ణత అనే భావాలను కూడా కలిగి ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָר
  choice: గమనించు
  rationale: ఇక్కడ שׁמר అంటే కాపాడడం కాదు; ఒక వ్యక్తిని శ్రద్ధగా పరిశీలించడం లేదా గుర్తుంచుకొని చూడడం. ‘గమనించు’ ఆ ఆజ్ఞార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: תָּם
  choice: నిందారహితుణ్ణి
  rationale: תָּם పాపరహిత పరిపూర్ణతకన్నా నైతిక సమగ్రతను, యథార్థతను సూచిస్తుంది. ‘నిందారహితుడు’ కీర్తనల జ్ఞానసాహిత్య సందర్భానికి తగిన పదం.
- source_word: וּרְאֵה
  choice: యథార్థవంతుణ్ణి చూడు
  rationale: ‘చూడు’ మొదటి ఆజ్ఞకు సమాంతరమైన రెండవ ఆజ్ఞను నేరుగా నిలుపుతుంది; కర్మమైన יָשָׁר‌ను తెలుగులో సహజంగా దీనితో కలిపాం.
- source_word: יָשָׁר
  choice: యథార్థవంతుణ్ణి
  rationale: יָשָׁר నైతికంగా నేరుగా, నిజాయితీగా ఉండే వ్యక్తిని సూచిస్తుంది. ‘యథార్థవంతుడు’ దానిని ‘నీతిమంతుడు’ అనే మరింత విస్తృత పదంతో కలిపివేయకుండా వ్యక్తపరుస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ఆజ్ఞలకు కారణాన్ని పరిచయం చేసే వివరణాత్మక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַחֲרִית
  choice: భవిష్యత్తు
  rationale: ఈ పదం అంతం, తుదిఫలితం, భావి స్థితి లేదా సంతతి అనే పరిధిని కలిగి ఉంది. సందర్భంలో సానుకూల భావి అవకాశాన్ని ‘భవిష్యత్తు’ సహజంగా వ్యక్తపరుస్తుంది; ఇతర భావాలు పాదసూచికలో నిలుపబడ్డాయి.
- source_word: לְאִישׁ
  choice: మనిషికి
  rationale: హీబ్రూలో אִישׁ ఏకవచన పురుషలింగ నామవాచకం. దాని రూపాన్ని తటస్థీకరించకుండా ‘మనిషి’ అని అనువదించాం.
- source_word: שָׁלוֹם
  choice: శాంతిపరుడైన
  rationale: ఇక్కడ שָׁלוֹם ఆ వ్యక్తిని శాంతితో సంబంధమున్నవాడిగా వర్ణిస్తుంది. ‘శాంతిపరుడు’ ఆధునిక తెలుగులో సహజంగా ఉంది; క్షేమం, సంపూర్ణత అనే విస్తృత ఛాయలను పాదసూచికలో పేర్కొన్నాం.
theological_decisions:
- issue: జ్ఞానసాహిత్య సందర్భంలో ఏకవచన పురుషలింగ אִישׁ
  choice: శాంతిపరుడైన మనిషి
  alternative: శాంతిపరుడైన వ్యక్తి / అలాంటి వాడు
  rationale: మూలంలోని ఏకవచన పురుష సూచనను నిలుపుతూ, ఈ జ్ఞానవాక్యానికి ప్రాతినిధ్య వర్తింపు ఉండవచ్చనే విషయాన్ని అనువాదంలో అతిగా వివరించలేదు.
- issue: నీతిమంతుని గమ్యానికి సంబంధించి אַחֲרִית అర్థం
  choice: భవిష్యత్తు ఉంది
  alternative: ముగింపు ఉంది / తుదిఫలితం ఉంది / సంతతి ఉంటుంది
  rationale: చుట్టుపక్కల వచనాలు దుష్టుల తుదిగతితో పోల్చుతున్నందున ఇది సానుకూల భావి ఫలితాన్ని సూచిస్తుంది. అయితే కాలపరమైన భవిష్యత్తు, తుదిఫలితం, సంతతి అనే సాధ్యార్థాల్లో ఒక్కదానిని సిద్ధాంతపరంగా ఖరారు చేయకుండా పాదసూచికలో అనిశ్చితిని నిలిపాం.
- issue: אִישׁ שָׁלוֹם అనే నిర్మాణం
  choice: శాంతిపరుడైన మనిషి
  alternative: శాంతిగల మనిషి / క్షేమముగల మనిషి
  rationale: ఈ నిర్మాణం శాంతిని ప్రదర్శించే వ్యక్తినీ, శాంతి లేదా క్షేమంతో గుర్తించబడిన వ్యక్తినీ సూచించగలదు. ప్రధాన పాఠ్యంలో సహజమైన వ్యక్తిత్వ వర్ణనను ఎంచుకొని విస్తృత భావాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గౌరవప్రదమైన సంక్షిప్త శైలిని ఉపయోగించాం. రెండు ఆజ్ఞల సమాంతరతను ‘గమనించు … చూడు’ అని నిలిపాం. ‘నిందారహితుడు’ పాపరహిత పరిపూర్ణతను తప్పనిసరిగా సూచించకుండా నైతిక సమగ్రతను తెలియజేస్తుంది.
