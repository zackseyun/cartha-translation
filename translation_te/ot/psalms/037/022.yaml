source:
  edition: WLC
  text: כִּ֣י מְ֭בֹרָכָי/ו יִ֣ירְשׁוּ אָ֑רֶץ וּ֝/מְקֻלָּלָ֗י/ו יִכָּרֵֽתוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/022.yaml
  text: For those blessed by him will inherit the land[a], but those cursed by him will be cut off.
translation:
  language: te
  text: ఎందుకంటే, ఆయన ఆశీర్వదించినవారు దేశాన్ని[a] స్వాస్థ్యంగా పొందుతారు; అయితే ఆయన శపించినవారు నిర్మూలించబడతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘భూమిని.’ హీబ్రూ אֶרֶץ అనే పదానికి ‘దేశం,’ ‘భూమి’ అనే రెండు అర్థాలూ ఉండవచ్చు; ఇక్కడ కీర్తనలోని నిబంధనా సందర్భానికి ‘దేశం’ మరింత సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి మాటకు కారణం లేదా వివరణను పరిచయం చేస్తుంది; కీర్తనలోని తార్కిక ప్రవాహాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מְבֹרָכָיו
  choice: ఆయన ఆశీర్వదించినవారు
  rationale: బరఖ్ ధాతువు నుంచి వచ్చిన కర్మణి అసమాపక క్రియకు తృతీయ పురుష ఏకవచన ప్రత్యయం ఉంది. సందర్భంలోని ప్రభువును కర్తగా స్పష్టం చేస్తూ సహజమైన తెలుగులో అందిస్తుంది.
- source_word: יִירְשׁוּ
  choice: స్వాస్థ్యంగా పొందుతారు
  rationale: యారష్ అనే పదంలో స్వాధీనపరచుకోవడం, వారసత్వంగా పొందడం అనే భావాలు ఉన్నాయి. భూమి దేవుని అనుగ్రహంగా లభిస్తుందనే నిబంధనా ప్రతిధ్వనిని ఈ ప్రయోగం నిలుపుతుంది.
- source_word: אָרֶץ
  choice: దేశాన్ని
  rationale: ఎరెత్స్ అనే పదానికి దేశం లేదా భూమి అనే రెండు అర్థాలు సాధ్యమే. 37వ కీర్తనలో పునరావృతమయ్యే వాగ్దానానికి నిబంధనా నేపథ్యం ఉన్నందున ప్రధాన పాఠ్యంలో ‘దేశం’ ఎంచుకుని, విస్తృత ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: וּמְקֻלָּלָיו
  choice: అయితే ఆయన శపించినవారు
  rationale: కర్మణి అసమాపక క్రియతో తృతీయ పురుష ఏకవచన ప్రత్యయం ఉంది. రెండు పాదాల మధ్య వ్యత్యాసాన్ని తెలుగులో ‘అయితే’ స్పష్టం చేస్తుంది; ‘ఆయన’ సందర్భంలోని ప్రభువును సూచిస్తుంది.
- source_word: יִכָּרֵתוּ
  choice: నిర్మూలించబడతారు
  rationale: నిఫాల్ రూపంలోని ‘తొలగించబడడం/నరికివేయబడడం’ అనే న్యాయతీర్పు భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ‘ఆయన ఆశీర్వదించినవారు/శపించినవారు’ అనే పదాల్లోని తృతీయ పురుష ఏకవచన ప్రత్యయ సూచన
  choice: తెలుగులో ‘ఆయన’ అని స్పష్టంగా ఇచ్చి, సందర్భానుసారం ప్రభువును సూచించాం.
  alternative: ‘ఆయనకు చెందిన ఆశీర్వదించబడినవారు/శపించబడినవారు’ అని మరింత రూపానుగుణంగా అనువదించడం.
  rationale: హీబ్రూ ప్రత్యయాలు సందర్భంలోని ఏకవచన వ్యక్తిని సూచిస్తున్నాయి; కీర్తన సందర్భంలో ఆయన ప్రభువు. కర్తృత్వాన్ని స్పష్టం చేయడం కొత్త సిద్ధాంతాన్ని చేర్చకుండా భావాన్ని సహజంగా తెలియజేస్తుంది.
- issue: אָרֶץ యొక్క పరిధి
  choice: దేశం
  alternative: భూమి
  rationale: ఈ వచనం 37వ కీర్తనలోని దేశాన్ని స్వాస్థ్యంగా పొందే పునరావృత వాగ్దానంలో భాగం. ‘దేశం’ నిబంధనా-జ్ఞానసాహిత్య నేపథ్యాన్ని నిలుపుతుంది; ‘భూమి’ అనే సాధ్యమైన విస్తృత పఠనాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని వాడాం. సమాంతర పాదాల వ్యత్యాసాన్ని నిలిపి, నిబంధనా భావాన్ని అతిగా వ్యాఖ్యానించకుండా కాపాడాం.
