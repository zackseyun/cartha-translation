  source_fidelity: హీబ్రూ వాక్యనిర్మాణంలోని కారణార్థక כִּי, ‘ఆయన ఆశీర్వదించినవారు/శపించినవారు’ అనే సంబంధార్థక కర్మణి భాగరూపాలు, יִירְשׁוּ యొక్క వారసత్వ/స్వాస్థ్య భావం, మరియు יִכָּרֵתוּ యొక్క కర్మణి తీర్పు భావం అన్నీ సముచితంగా ప్రతిఫలించాయి. ‘నిర్మూలించబడతారు’ అనేది ‘నరికివేయబడతారు/తొలగించబడతారు’ కంటే కొంత వివరణాత్మకమైనదైనా, ఈ సందర్భంలో ‘cut off’ యొక్క తీవ్రమైన తీర్పు ఫలితాన్ని భంగం చేయదు.
