source:
  edition: WLC
  text: בְּטַ֣ח בַּֽ֭/יהוָה וַ/עֲשֵׂה ט֑וֹב שְׁכָן אֶ֝֗רֶץ וּ/רְעֵ֥ה אֱמוּנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/003.yaml
  text: Trust in Yahweh and do good[a]; dwell in the land and cultivate faithfulness.
translation:
  language: te
  text: యాహ్వేను నమ్మి మేలు చేయి; దేశంలో నివసించి నమ్మకత్వాన్ని పెంపొందించు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నమ్మకత్వాన్ని ఆహారంలా తీసుకో’; మరో సాధ్యమైన అర్థం, ‘భద్రతను అనుభవించు.’ హీబ్రూ పదబంధం క్లిష్టమైనది; అది మేత మేయడం లేదా నమ్మకత్వం/విశ్వసనీయత ద్వారా పోషణ పొందడం అనే చిత్రాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטַח
  choice: నమ్ముకొని
  rationale: ఈ ఆజ్ఞారూప క్రియ ఒకరిలో విశ్వాసం ఉంచడాన్ని సూచిస్తుంది. తరువాతి ఆజ్ఞతో సహజంగా అనుసంధానించడానికి ‘నమ్ముకొని’ అని అనువదించాం.
- source_word: בַּיהוָה
  choice: యాహ్వేను
  rationale: ב అనే ఉపసర్గ నమ్మకానికి పాత్రుడైన వ్యక్తిని సూచిస్తుంది. దేవుని ఒడంబడిక నామమైన יהוהను ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: וַעֲשֵׂה טוֹב
  choice: మేలు చేయి
  rationale: హీబ్రూ ఆజ్ఞ యొక్క సంక్షిప్తతను, సహజమైన తెలుగు వాడుకను నిలుపుతుంది.
- source_word: שְׁכָן אֶרֶץ
  choice: దేశంలో నివసించు
  rationale: שׁכן అంటే నివసించడం లేదా స్థిరపడడం. ఈ కీర్తనలో భూమిని స్వాధీనంగా పొందే అంశం పదేపదే రావడం వల్ల אֶרֶץను ‘భూమి’ కంటే ‘దేశం’గా అనువదించాం.
- source_word: וּרְעֵה
  choice: పెంపొందించు
  rationale: רעה యొక్క మూలార్థం మేపడం, మేత మేయడం లేదా పోషించడం. భావవాచకమైన ‘నమ్మకత్వం’తో కలిసినప్పుడు, క్రియాశీల ఆజ్ఞను సహజ తెలుగులో తెలియజేయడానికి ‘పెంపొందించు’ అని ఎంచుకున్నాం; మూలంలోని రూపకార్థ అనిశ్చితిని పాదటిప్పణిలో ఉంచాం.
- source_word: אֱמוּנָה
  choice: నమ్మకత్వం
  rationale: ఈ పదానికి స్థిరత్వం, నమ్మకత్వం, విశ్వసనీయత లేదా భద్రత అనే అర్థాలు ఉండవచ్చు. చుట్టూ ఉన్న నైతిక ఆజ్ఞలకు ‘నమ్మకత్వం’ బాగా సరిపోతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: హీబ్రూ మూలంలోని ప్రత్యేక ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, దాని ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- issue: וּרְעֵה אֱמוּנָה అనే క్లిష్టమైన పదబంధం అర్థం
  choice: నమ్మకత్వాన్ని పెంపొందించు
  alternative: నమ్మకత్వాన్ని ఆహారంగా స్వీకరించు; నమ్మకంగా మెలుగు; భద్రతను అనుభవించు
  rationale: ఈ హీబ్రూ పదబంధం బహుళార్థకమైనది. ప్రధాన పాఠంలో క్రియాశీల నైతిక ఆజ్ఞను సహజంగా తెలిపాం; మేయడం లేదా పోషణ పొందడం అనే రూపకాన్ని, ‘భద్రత’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఏకవచన ఆజ్ఞారూపాలతో సంక్షిప్తంగా, గౌరవప్రదంగా అనువదించాం. క్లిష్టమైన చివరి పదబంధాన్ని పాఠకుడికి అర్థమయ్యేలా ఇచ్చినా, దాని నిజమైన బహుళార్థకతను పాదటిప్పణిలో నిలిపాం.
