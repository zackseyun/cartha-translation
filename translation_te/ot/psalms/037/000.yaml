  to: 'దావీదు కీర్తన.[a]


    దుష్టుల కారణంగా కలత చెందకు;[b]


    అన్యాయం చేసేవారిని చూసి అసూయపడకు.[c]'
  rationale: The first imperative has been revised to express the Hebrew contextual sense of agitation or vexation rather than ordinary anger. The causal phrase has also been made explicit. No doctrinal interpretation has been added, and the superscription’s grammatical ambiguity remains documented in a footnote.
