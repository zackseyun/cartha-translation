reference: Psalms 37:0
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לְ/דָוִ֨ד אַל תִּתְחַ֥ר בַּ/מְּרֵעִ֑ים אַל תְּ֝קַנֵּ֗א בְּ/עֹשֵׂ֥י עַוְלָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/000.yaml
  text: Of David[a]. Do not fret because of evildoers[b]; do not be envious of those who do wrong.
translation:
  language: te
  text: 'దావీదు కీర్తన.[a]


    దుష్టుల కారణంగా కలత చెందకు;[b]


    అన్యాయం చేసేవారిని చూసి అసూయపడకు.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధాన్ని ‘దావీదుచే’, ‘దావీదుకు’ లేదా ‘దావీదుకు సంబంధించినది’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: source_ambiguity
  - marker: b
    text: లేదా ‘వేడెక్కకు’, ‘ఉద్రేకపడకు’ లేదా ‘చికాకుపడకు’. హీబ్రూ క్రియ కలత చెందడం లేదా మనసు వేడెక్కడం అనే భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘అధర్మం చేసేవారు’ లేదా ‘తప్పు చేసేవారు’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: దావీదు కీర్తన
  rationale: కీర్తన శీర్షికగా సహజమైన తెలుగు రూపం; హీబ్రూ לְ ఉపసర్గలోని ‘దావీదుచే/దావీదుకు/దావీదుకు సంబంధించిన’ అనే భావసాధ్యతలను పాదటిప్పణిలో నిలిపాం.
- source_word: אַל־תִּתְחַר
  choice: ఆగ్రహపడకు
  rationale: חָרָה క్రియలోని ‘వేడెక్కడం, కోపోద్రిక్తం కావడం, కలత చెందడం’ అనే భావాన్ని సందర్భానుకూలంగా వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: בַּמְּרֵעִים
  choice: దుష్టులను బట్టి
  rationale: ‘దుష్కార్యాలు చేసేవారి కారణంగా/వారిని చూసి’ అనే కారణార్థక భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: תְּקַנֵּא
  choice: అసూయపడకు
  rationale: קנא క్రియకు ఈ సందర్భంలో ఉన్న ‘ఇతరుల స్థితిని చూసి ఈర్ష్యపడడం’ అనే సాధారణ అర్థాన్ని నేరుగా అందిస్తుంది.
- source_word: עֹשֵׂי עַוְלָה
  choice: అన్యాయం చేసేవారు
  rationale: עַוְלָה లోని తప్పు, అన్యాయం, అధర్మం అనే భావాల్లో కార్యాచరణను ముందుకు తెచ్చే సహజ తెలుగు పదబంధం; నైతిక భావవిస్తృతిని పాదటిప్పణిలో సూచించాం.
theological_decisions:
- issue: לְדָוִד అనే శీర్షిక రచయితను సూచిస్తుందా, అంకితాన్ని సూచిస్తుందా
  choice: ప్రధాన పాఠ్యంలో సంప్రదాయబద్ధమైన ‘దావీదు కీర్తన’
  alternative: ‘దావీదుకు చెందినది’ లేదా ‘దావీదుకు’
  rationale: హీబ్రూ ఉపసర్గను కేవలం రచయితత్వంగా ఖరారు చేయకుండా, దాని నిజమైన వ్యాకరణ అస్పష్టతను పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన సంక్షిప్తమైన గంభీర శైలిని పాటించాం. సమాంతర ఆజ్ఞారూప వాక్యనిర్మాణాన్ని నిలిపి, మూలంలోని రచయితత్వ మరియు క్రియార్థ అస్పష్టతలను పాదటిప్పణుల్లో భద్రపరిచాం.
