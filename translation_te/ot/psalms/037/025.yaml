id: PSA.37.25
reference: Psalms 37:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: נַ֤עַר הָיִ֗יתִי גַּם זָ֫קַ֥נְתִּי וְֽ/לֹא רָ֭אִיתִי צַדִּ֣יק נֶעֱזָ֑ב וְ֝/זַרְע֗/וֹ מְבַקֶּשׁ לָֽחֶם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/025.yaml
  text: I was young[a], and now I am old[b], yet I have not seen the righteous forsaken or his offspring begging for bread.
translation:
  language: te
  text: నేను యువకుడిగా ఉన్నాను; ఇప్పుడు వృద్ధుడనయ్యాను. అయినా విడిచిపెట్టబడిన నీతిమంతుణ్ణిగానీ, రొట్టె కోసం యాచిస్తున్న అతని సంతానాన్నిగానీ[a] నేను చూడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యాచిస్తున్న’కు బదులుగా అక్షరార్థంగా ‘రొట్టెను వెదుకుతున్న’ లేదా ‘రొట్టె అడుగుతున్న’ అని కూడా అనవచ్చు. ఈ సందర్భంలో జీవనావసరమైన ఆహారం కోసం భిక్ష అడగడాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר הָיִיתִי
  choice: నేను యువకుడిగా ఉన్నాను
  rationale: నామవాచకంగా ఉన్న נַעַר ఇక్కడ היהతో విధేయార్థకంగా వచ్చి గత జీవనదశను సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘యువకుడిగా ఉన్నాను’ యౌవనాన్ని, తరువాతి వృద్ధాప్యంతో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: גַּם זָקַנְתִּי
  choice: ఇప్పుడు వృద్ధుడనయ్యాను
  rationale: גַּם యొక్క అనుసంధాన భావాన్ని జీవనదశల పురోగతిలో సహజంగా ‘ఇప్పుడు’ ద్వారా వ్యక్తం చేశాం; זקן యొక్క సంపూర్ణ క్రియ వృద్ధాప్య స్థితికి చేరడాన్ని సూచిస్తున్నందున ‘వృద్ధుడనయ్యాను’ అని అనువదించాం.
- source_word: וְלֹא רָאִיתִי
  choice: అయినా ... నేను చూడలేదు
  rationale: వక్త తన యౌవనం నుండి వృద్ధాప్యం వరకు చేసిన వ్యక్తిగత పరిశీలనను ఇది తెలియజేస్తుంది. సందర్భంలోని స్వల్ప వ్యతిరేక భావాన్ని ‘అయినా’ నిలుపుతుంది; దీనిని సార్వత్రిక వాగ్దానంగా మార్చలేదు.
- source_word: צַדִּיק
  choice: నీతిమంతుడు
  rationale: పుంలింగ ఏకవచన విశేషణం ఇక్కడ నామవాచకంగా, ప్రతినిధి భావంతో వాడబడింది. ‘నీతిమంతుడు’ రూపం మూలంలోని సంఖ్యను, వ్యాకరణ రూపాన్ని సహజంగా నిలుపుతుంది.
- source_word: נֶעֱזָב
  choice: విడిచిపెట్టబడడం
  rationale: עזב నిఫాల్ రూపంలోని నిష్క్రియార్థాన్ని నిలుపుతూ, కేవలం ఒంటరిగా ఉండడం కన్నా పరిత్యజించబడే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְזַרְעוֹ
  choice: అతని సంతానం
  rationale: זֶרַע అక్షరార్థంగా ‘విత్తనం’; ఇక్కడ ఒక వ్యక్తి సంతతి లేదా వారసులను సూచిస్తుంది. ‘సంతానం’ ఏకవచన సమూహార్థాన్ని, అతనితో ఉన్న సంబంధాన్ని కాపాడుతుంది.
- source_word: מְבַקֶּשׁ לָחֶם
  choice: ఆహారం కోసం చేయి చాచడం
  rationale: בקש యొక్క ప్రాథమిక అర్థం ‘వెదకడం/అడగడం.’ לֶחֶםతో కలిసిన ఈ దారిద్య్ర సందర్భంలో ప్రాథమిక పోషణ కోసం యాచించడాన్ని సూచిస్తుంది. ‘చేయి చాచడం’ ఆధునిక తెలుగులో ఆ భావాన్ని సహజంగా తెలియజేస్తుంది; ‘ఆహారం’ సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ఈ వాక్యం నిరపేక్షమైన దైవ వాగ్దానమా, లేక కీర్తనకర్త వ్యక్తిగత జీవిత పరిశీలనా?
  choice: ‘నేను ... చూడలేదు’ అనే ప్రథమ పురుష అనుభవసాక్ష్యంగానే ఉంచాం.
  alternative: ఏ నీతిమంతుడూ లేదా అతని సంతానమూ ఎన్నడూ దారిద్య్రాన్ని అనుభవించరనే సార్వత్రిక హామీగా చెప్పడం.
  rationale: హీబ్రూ పాఠం ‘నేను యువకుడిగా ఉన్నాను ... వృద్ధుడనయ్యాను ... నేను చూడలేదు’ అని వ్యక్తిగత జీవితానుభవంగా నిర్మితమైంది. అందువల్ల పాఠంలో లేని నిరపేక్ష సిద్ధాంత ప్రకటనను చేర్చలేదు.
- issue: צַדִּיק మరియు זַרְעוֹలోని లింగం, సంఖ్య
  choice: ‘నీతిమంతుడు ... అతని సంతానం’ అని పుంలింగ ఏకవచన ప్రతినిధి రూపాన్ని నిలిపాం.
  alternative: ‘నీతిమంతులు ... వారి పిల్లలు’ అని బహువచన, లింగతటస్థ రూపంగా మార్చడం.
  rationale: మూలం వ్యాకరణపరంగా పుంలింగ ఏకవచనంలో ఉన్నప్పటికీ ప్రతినిధి భావం కలిగి ఉంది. తెలుగు రూపం మూల నిర్మాణాన్ని మార్చకుండా సహజంగా ఉంటుంది.
- issue: రెండు విషయాల సమన్వయం
  choice: ‘విడిచిపెట్టబడడంగానీ ... చేయి చాచడంగానీ’ అనే నిరాకరణ సమన్వయాన్ని వాడాం.
  alternative: సాధారణ ‘మరియు’తో కలిపి, రెండు పరిస్థితులూ కలిసే సంభవించలేదనే భావం వచ్చేలా అనువదించడం.
  rationale: హీబ్రూ וְ రెండు చూడని పరిస్థితులను సమన్వయపరుస్తుంది. తెలుగు ‘గానీ ... గానీ’ నిర్మాణం ‘ఇదీ కాదు, అదీ కాదు’ అనే పరిధిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలిని వాడాం. కవితాత్మక సమతౌల్యాన్ని ‘యువకుడిగా ... వృద్ధుడనయ్యాను’ మరియు ‘గానీ ... గానీ’ నిర్మాణాలతో నిలిపాం. ‘రొట్టె’కు బదులు సందర్భార్థమైన ‘ఆహారం’ ప్రధాన పాఠంలో ఉంచి, మూలంలోని concrete పదచిత్రాన్ని పాదటిప్పణిలో తెలిపాం.
