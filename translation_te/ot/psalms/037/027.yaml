source:
  edition: WLC
  text: ס֣וּר מֵ֭/רָע וַ/עֲשֵׂה ט֗וֹב וּ/שְׁכֹ֥ן לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/027.yaml
  text: Turn away from evil and do good[a], and dwell forever.
translation:
  language: te
  text: చెడును విడిచిపెట్టి మేలు చేయి[a]; శాశ్వతంగా నివసించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఈ కీర్తనలో పదేపదే కనిపించే అంశాన్ని బట్టి, “దేశంలో శాశ్వతంగా నివసించు” లేదా “శాశ్వతంగా సురక్షితంగా జీవించు.” ఇక్కడి హీబ్రూ పాఠ్యంలో “దేశంలో” అని స్పష్టంగా లేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: סוּר
  choice: విడిచిపెట్టి
  rationale: ఈ ఆజ్ఞారూప క్రియకు ‘తొలగిపో, పక్కకు మళ్ళు, విడిచిపెట్టు’ అనే భావాలు ఉన్నాయి. నైతిక సందర్భంలో ‘చెడును విడిచిపెట్టి’ అనేది చెడునుంచి ఉద్దేశపూర్వకంగా వైదొలగడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵרָע
  choice: చెడును
  rationale: מִן ఉపసర్గతో వచ్చిన רַע, దేనినుంచి వైదొలగాలో సూచిస్తుంది. ఇక్కడి నైతిక సందర్భంలో ‘చెడు’ తగిన అర్థం; ‘హాని’ అనే భావం ఈ సందర్భానికి తక్కువ అనుకూలం.
- source_word: וַעֲשֵׂה טוֹב
  choice: మేలు చేయి
  rationale: ఆజ్ఞారూప క్రియతో నామవాచకార్థంలో వాడిన విశేషణం ఉంది. ‘మేలు చేయి’ సంక్షిప్తంగా, సహజంగా ఉండి, ‘చెడును విడిచిపెట్టి’ అనే మొదటి ఆజ్ఞతో సమాంతరతను నిలుపుతుంది.
- source_word: וּשְׁכֹן
  choice: నివసించు
  rationale: ఈ క్రియకు నివసించడం, స్థిరపడడం అనే భావం ఉంది. ‘నివసించు’ మూలంలోని స్థిర నివాస భావాన్ని కాపాడుతూ ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా ఉంటుంది.
- source_word: לְעוֹלָם
  choice: శాశ్వతంగా
  rationale: עוֹלָם దీర్ఘకాలికమైన లేదా అంతంలేని కొనసాగింపును సూచించగలదు. ‘శాశ్వతంగా’ మూలంలోని సంక్షిప్త కాలవ్యాప్తి భావాన్ని విస్తరించకుండా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: וּשְׁכֹן לְעוֹלָם లోని ఉపదేశం/వాగ్దాన భావం
  choice: ‘శాశ్వతంగా నివసించు’ అని ఆజ్ఞారూపంలోనే, నివసించే స్థలాన్ని చేర్చకుండా అనువదించడం
  alternative: ‘దేశంలో శాశ్వతంగా నివసించు’ లేదా ‘శాశ్వతంగా సురక్షితంగా జీవించు’
  rationale: హీబ్రూ వాక్యం వరుస ఆజ్ఞారూపాలను ఉపయోగిస్తుంది. 37వ కీర్తనలో దేశంలో నిలిచి ఉండడం పునరావృతమయ్యే అంశమైనప్పటికీ, ఈ వచనంలో ‘దేశంలో’ అనే కర్మ స్పష్టంగా లేదు. కాబట్టి ప్రధాన పాఠ్యంలో మూలంలోని సంక్షిప్తతను, సంభావ్య అస్పష్టతను నిలిపి, సందర్భాధారిత అర్థాలను పాదసూచికలో ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన ఆజ్ఞారూప శైలి. మూలంలోని మూడు ఆజ్ఞలను నిలిపి, చివరి భాగంలోని స్థలసంబంధ అస్పష్టతను ప్రధాన పాఠ్యంలో పరిష్కరించకుండా ఉంచాం.
