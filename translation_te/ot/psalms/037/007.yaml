source:
  edition: WLC
  text: דּ֤וֹם לַ/יהוָה֮ וְ/הִתְח֪וֹלֵ֫ל ל֥/וֹ אַל תִּ֭תְחַר בְּ/מַצְלִ֣יחַ דַּרְכּ֑/וֹ בְּ֝/אִ֗ישׁ עֹשֶׂ֥ה מְזִמּֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/007.yaml
  text: Be still before Yahweh[a], and wait patiently for him; do not burn with anger because of one who prospers in his way[c][b], because of a man who carries out schemes.
translation:
  language: te
  text: యహ్వే సన్నిధిలో నిశ్చలంగా ఉండు[a]; ఆయన కోసం ఓపికగా ఎదురుచూడు[b]. తన మార్గంలో వర్ధిల్లుతూ పన్నాగాలను అమలు చేసే మనిషిని బట్టి కోపంతో రగిలిపోవద్దు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యహ్వే సన్నిధిలో మౌనంగా ఉండు.” హీబ్రూ క్రియ మౌనాన్నీ నిశ్చలతనూ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆయన కోసం ఆత్రుతతో ఎదురుచూడు”; సంప్రదాయంగా, “ఆయనలో విశ్రమించు.” హీబ్రూ క్రియ దేవుని ఎదుట ఓపికతో, కొన్నిసార్లు వేదనతో కూడిన నిరీక్షణను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: సంప్రదాయంగా, “చింతపడవద్దు.” హీబ్రూ పదం మరింత అక్షరార్థంగా వేడెక్కడం లేదా కోపంతో మండడం గురించి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹם
  choice: నిశ్చలంగా ఉండు
  rationale: ఈ ఆజ్ఞారూపం మౌనంగా ఉండడం, కదలకుండా నెమ్మదిగా ఉండడం అనే భావాలను కలిగి ఉంది. దేవుని సన్నిధిలో ప్రశాంతమైన అదుపును సహజమైన తెలుగులో తెలియజేయడానికి ఈ రూపం ఎంచుకోబడింది.
- source_word: לַיהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: ఇక్కడ ל సంబంధాన్ని లేదా దేవుని ఎదుట ఉండడాన్ని సూచిస్తుంది. సందర్భానికి తగిన తెలుగులో ‘సన్నిధిలో’ అని అనువదించి, దైవనామాన్ని యెహోవాగా ఉంచాం.
- source_word: וְהִתְחוֹלֵל לוֹ
  choice: ఆయన కోసం ఓపికగా ఎదురుచూడు
  rationale: חול యొక్క ఈ రూపం వేదనతో లేదా ఆత్రుతతో కూడిన నిరీక్షణను సూచించగలదు; ఈ కీర్తనలో దేవునిపై ఆధారపడి సహనంతో వేచియుండమనే ప్రబోధార్థం ప్రధానంగా ఉంది. మూలంలోని భావవిస్తృతిని పాదటిప్పణిలో ఉంచాం.
- source_word: אַל תִּתְחַר
  choice: కోపంతో రగిలిపోవద్దు
  rationale: חרה లోని వేడెక్కడం లేదా మండడం అనే రూపకాన్ని, దాని కోపార్థాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: בְּמַצְלִיחַ דַּרְכּוֹ
  choice: తన మార్గంలో వర్ధిల్లుతున్నవానిని బట్టి
  rationale: ב ఇక్కడ ఆగ్రహానికి కారణాన్ని సూచిస్తుంది; מצליח విజయవంతమవడం లేదా వర్ధిల్లడం, דרכו అతని మార్గం లేదా జీవనగతిని సూచిస్తాయి.
- source_word: בְּאִישׁ
  choice: మనిషిని బట్టి
  rationale: אִישׁ పుంలింగ ఏకవచనం. తెలుగులో సహజంగా ఉండేలా ‘మనిషి’ అని ఇచ్చి, ప్రతినిధి వ్యక్తి అనే భావాన్ని నిలిపాం.
- source_word: עֹשֶׂה מְזִמּוֹת
  choice: కుట్రలు అమలు చేసే
  rationale: מְזִמּוֹת యోచనలు, పన్నాగాలు లేదా కుట్రలను సూచించగలదు; ప్రతికూల సందర్భంలో వాటిని కార్యరూపంలో పెట్టే భావాన్ని ఈ అనువాదం తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఒడంబడిక దైవనామం నేరుగా ఉంది; సాధారణ బిరుదుతో దానిని భర్తీ చేయకుండా తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపాన్ని ఉపయోగించాం.
- issue: אִישׁ యొక్క లింగ సూచన
  choice: మనిషి
  alternative: ఎవరైనా / వ్యక్తి
  rationale: మూలంలోని పుంలింగ ఏకవచన రూపాన్ని పూర్తిగా లింగరహితం చేయకుండా, ఆధునిక తెలుగులో సహజమైన ప్రతినిధి పదమైన ‘మనిషి’ని వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే కీర్తనకు తగిన గౌరవభరితమైన ప్రబోధ శైలిని నిలిపాం. మూలంలోని మౌనం/నిశ్చలత మరియు సహనంతో/వేదనతో నిరీక్షణ అనే భావసందిగ్ధతలను పాదటిప్పణుల్లో సంరక్షించాం.
