lexical_decisions:
- source_word: וְהוֹצִיא
  choice: బయలుపరుస్తాడు
  rationale: יצא యొక్క హిఫిల్ రూపం ఏదైనా బయటకు రావడానికి కారణమవడం అనే భావాన్ని ఇస్తుంది. ఈ సందర్భంలో దేవుడు నీతి, న్యాయమైన వాదం అందరికీ స్పష్టంగా కనిపించేలా చేస్తాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָאוֹר
  choice: వెలుగులా
  rationale: כ పోలికను సూచిస్తుంది; אוֹר అంటే వెలుగు. ‘వెలుగులా’ అనే రూపం మూలంలోని ఉపమానాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: צִדְקֶךָ
  choice: నీ నీతిని
  rationale: צדק నీతి, సరైన స్థితి, నిర్దోషిత్వ నిరూపణ వంటి భావాలను కలిగి ఉంటుంది. ప్రధాన పాఠంలో ‘నీతి’ మూలపదంతో పారదర్శక సంబంధాన్ని నిలుపుతుంది; సందర్భానుసారమైన ‘నీ నిర్దోషిత్వాన్ని’ పాదటిప్పణిలో ఇస్తున్నాం.
- source_word: וּמִשְׁפָּטֶךָ
  choice: నీ న్యాయమైన వాదాన్ని
  rationale: משפט తీర్పు, న్యాయం, న్యాయవాదం లేదా ఒకరి పక్షంలోని న్యాయబద్ధతను సూచించగలదు. ఇక్కడ సమాంతర కవిత్వంలో ఒకరి పక్షం న్యాయమైనదని బహిర్గతమవడం ప్రధాన భావం; అందువల్ల ‘న్యాయమైన వాదం’ సందర్భానికి స్పష్టంగా సరిపోతుంది.
- source_word: כַצָּהֳרָיִם
  choice: మధ్యాహ్నపు వెలుగులా
  rationale: צהריים మధ్యాహ్నాన్ని సూచిస్తుంది. తెలుగులో కేవలం ‘మధ్యాహ్నంలా’ అనడం కంటే ‘మధ్యాహ్నపు వెలుగులా’ అనడం పోలికలో అంతర్లీనంగా ఉన్న ప్రకాశం, స్పష్టతను సహజంగా తెలియజేస్తుంది.
