translation:
  language: te
  text: 'ఆయన నీ నీతిని[a] వెలుగులా,

    నీ న్యాయాన్ని[b] మధ్యాహ్నంలా బయలుపరుస్తాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ నిర్దోషిత్వాన్ని.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీ న్యాయమైన వాదాన్ని’ లేదా ‘నీ వ్యాజ్యాన్ని.’
