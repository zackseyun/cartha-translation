source:
  edition: WLC
  text: כִּֽי יִפֹּ֥ל לֹֽא יוּטָ֑ל כִּֽי יְ֝הוָ֗ה סוֹמֵ֥ךְ יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/024.yaml
  text: Though he falls[a], he will not be hurled down[b], for Yahweh holds his hand.
translation:
  language: te
  text: అతడు పడిపోయినా[a], కూలదోయబడడు; ఎందుకంటే యెహోవా అతని చెయ్యిని పట్టుకొని ఉంటాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “అతడు పడిపోతే.” ఇక్కడి హీబ్రూ సంధిపదాన్ని సందర్భానుసారంగా “ఎందుకంటే,” “ఒకవేళ,” లేదా “పడిపోయినా” అని అనువదించవచ్చు.'
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: “యెహోవా అతని చెయ్యిని ఆధరిస్తాడు.”'
    reason: literal_rendering
lexical_decisions:
- source_word: כִּי
  choice: పడిపోయినా / ఎందుకంటే
  rationale: మొదటి כִּי సందర్భంలో అనుమతార్థకంగా ‘పడిపోయినా’ అని, రెండవది కారణార్థకంగా ‘ఎందుకంటే’ అని అనువదించాం. ఒకే సంధిపదానికి సందర్భానుసారంగా ఉన్న రెండు విధులను సహజమైన తెలుగులో చూపిస్తుంది.
- source_word: יִפֹּל
  choice: అతడు పడిపోయినా
  rationale: נפל యొక్క ప్రాథమిక ‘పడిపోవు’ భావాన్ని నిలిపి, ఇది సంభవించగల కష్టాన్ని సూచించేలా అనుమతార్థక రూపాన్ని వాడాం; దీనిని కేవలం పాపంలో పడటంగా పరిమితం చేయలేదు.
- source_word: לֹא יוּטָל
  choice: పూర్తిగా నేలకూలిపోడు
  rationale: Hophal రూపంలోని పడదోయబడటం లేదా కూలదోయబడటం అనే బలమైన భావాన్ని, ముందున్న ‘పడిపోవు’తో తేడా కనిపించేలా ‘పూర్తిగా నేలకూలిపోడు’గా వ్యక్తం చేశాం. ‘పూర్తిగా’ అనేది అంతిమంగా పడదోయబడడు అనే సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: סוֹמֵךְ
  choice: పట్టుకొని నిలబెడతాడు
  rationale: סמך క్రియలోని నిరంతర ఆధారం, నిలబెట్టడం అనే భావాన్ని సహజమైన తెలుగు ప్రయోగంతో అందిస్తుంది.
- source_word: יָדוֹ
  choice: అతని చెయ్యి
  rationale: హీబ్రూలో ఉన్న ప్రత్యక్ష ‘అతని చెయ్యి’ అనే చిత్రాన్ని అలాగే ఉంచి, యెహోవా నీతిమంతుని చెయ్యి పట్టి ఆదరిస్తున్న దృశ్యాన్ని కాపాడాం.
theological_decisions:
- issue: ‘పడిపోవడం’ అనే రూపకం యొక్క పరిధి
  choice: నీతిమంతునికి ఎదురయ్యే కష్టాలు లేదా వైఫల్యాలను సాధారణంగా సూచించే విస్తృత రూపకంగా ఉంచాం.
  alternative: దీనిని ప్రత్యేకంగా పాపం లేదా ఆత్మీయ పతనానికి మాత్రమే, లేక శారీరక ప్రమాదానికి మాత్రమే పరిమితం చేయడం.
  rationale: హీబ్రూ వాక్యం పతనం ఏ రకమైనదో నిర్దేశించదు. అందువల్ల అనువాదం ఆ ఉద్దేశపూర్వక విస్తృతతను, దైవిక ఆదరణ గురించిన ఉద్వేగాన్ని నిలుపుతుంది.
- issue: దైవిక ఆదరణ యొక్క ఫలితం
  choice: అతడు పడవచ్చును, కాని అంతిమంగా పూర్తిగా కూలిపోడు.
  alternative: నీతిమంతుడు అసలు ఎన్నడూ పడడని అర్థం చేయడం.
  rationale: మొదటి క్రియ పడిపోవడాన్ని అంగీకరిస్తుంది; రెండవది సంపూర్ణంగా పడదోయబడటాన్ని నిరాకరిస్తుంది. ఈ వ్యత్యాసాన్ని అనువాదంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘పడిపోయినా—పూర్తిగా నేలకూలిపోడు’ అనే వ్యత్యాసం మూలంలోని రెండు వేర్వేరు క్రియల బలాన్ని చూపిస్తుంది. ‘చెయ్యి పట్టుకొని నిలబెడతాడు’ అనేది మూలంలోని శరీరరూపకాన్ని నిలుపుతూ తెలుగులో సహజంగా వినిపిస్తుంది.
