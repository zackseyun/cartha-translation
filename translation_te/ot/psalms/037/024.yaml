revisions:
- from: అతడు పడిపోయినా[a], పూర్తిగా నేలకూలిపోడు; ఎందుకంటే యెహోవా అతని చెయ్యి పట్టుకొని నిలబెడతాడు[b].
  to: అతడు పడిపోయినా[a], కూలదోయబడడు; ఎందుకంటే యెహోవా అతని చెయ్యిని పట్టుకొని ఉంటాడు[b].
  rationale: The revision preserves the source’s concessive possibility of falling, maintains the passive contrast that he is not cast down, and renders Yahweh’s continuing support of the person’s hand in natural Telugu. It avoids both the added intensifier ‘completely’ and the added notion that Yahweh actively makes him stand.
  reviewer_model: gpt-5.6-terra
