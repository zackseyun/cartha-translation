  text: Better is a little that belongs to the righteous than the abundance of many wicked people[a][b].
translation:
  language: te
  text: అనేకమంది దుష్టుల సమృద్ధికంటే[b] నీతిమంతునికి ఉన్న కొంచెమే[a] మేలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీతిమంతునికి ఉన్న కొంచెం.” హీబ్రూ వాక్యం సంక్షిప్తంగా ఉంది; స్వామ్య భావం అంతర్లీనంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అనేకమంది దుష్టుల అపార సంపదకంటే.” “సమృద్ధి”కి వాడిన హీబ్రూ పదం విస్తార పరిమాణాన్ని సూచిస్తుంది; ఈ సందర్భంలో అది సంపదను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: మేలు
  rationale: సామెతలాంటి ఈ తులనాత్మక నిర్మాణంలో ఈ పదం ‘మంచిది’ అనే సాధారణ భావం కంటే ‘మేలు’ అనే తులనాత్మక భావాన్ని ఇస్తుంది.
- source_word: מְעַט
  choice: కొంచెమే
  rationale: ఇది స్వల్ప పరిమాణాన్ని సూచిస్తుంది; ‘సమృద్ధి’తో ఉన్న వ్యత్యాసాన్ని సహజమైన తెలుగులో నిలుపుతుంది. ‘-ఏ’ తులనలోని నొక్కిచెప్పే భావాన్ని తెలియజేస్తుంది.
- source_word: לַצַּדִּיק
  choice: నీతిమంతునికి ఉన్న
  rationale: ל ఉపసర్గం ఈ సంక్షిప్త వాక్యనిర్మాణంలో స్వామ్యాన్ని సూచించవచ్చు. ‘నీతిమంతునికి ఉన్న’ అనేది ఆ అంతర్లీన భావాన్ని సహజంగా వ్యక్తం చేస్తూ, హీబ్రూలోని ఏకవచనాన్ని కాపాడుతుంది.
- source_word: מֵהֲמוֹן
  choice: సమృద్ధికంటే
  rationale: הָמוֹן అనే పదానికి సమృద్ధి, విస్తార పరిమాణం అనే విస్తృత భావం ఉంది. ‘సంపద’ అని అనడం మూలంలోని భావాన్ని భౌతిక ధనానికి మాత్రమే పరిమితం చేయవచ్చు; అందువల్ల విస్తృతమైన ‘సమృద్ధి’ ఎంచుకోబడింది.
- source_word: רְשָׁעִים
  choice: దుష్టుల
  rationale: ఇది నామవాచకంగా వాడిన బహువచన విశేషణం; ‘దుష్టులు’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన బైబిలు వాడుక.
- source_word: רַבִּים
  choice: అనేకమంది
  rationale: బహువచన విశేషణం సహజంగా ‘దుష్టులు’ అనే వ్యక్తులను విశేషిస్తుంది. ‘అనేకమంది’ దాని సంఖ్యాపరమైన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
