source:
  edition: WLC
  text: צַדִּיקִ֥ים יִֽירְשׁוּ אָ֑רֶץ וְ/יִשְׁכְּנ֖וּ לָ/עַ֣ד עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/029.yaml
  text: The righteous will inherit the land and dwell on it forever[a].
translation:
  language: te
  text: 'నీతిమంతులు దేశాన్ని స్వాస్థ్యంగా పొందుతారు;

    దానిలో శాశ్వతంగా నివసిస్తారు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘భూమిని.’ హీబ్రూ పదం אֶרֶץ ‘దేశం’ లేదా ‘భూమి/భూలోకం’ అని అర్థమివ్వగలదు; ఇక్కడ కీర్తన 37లో పునరావృతమయ్యే మాటలకు ‘దేశం’ బాగా సరిపోతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: צַדִּיקִים
  choice: నీతిమంతులు
  rationale: బహువచన విశేషణం నామవాచకంగా వాడబడి, నీతిగా జీవించే ప్రజలను ఒక వర్గంగా సూచిస్తుంది. ‘నీతిమంతులు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి నైతిక, దైవశాస్త్ర భావాన్ని నిలుపుతుంది.
- source_word: יִירְשׁוּ
  choice: స్వాస్థ్యంగా పొందుతారు
  rationale: ירשׁ స్వాస్థ్యంగా పొందడం లేదా స్వాధీనం చేసుకోవడం అనే భావాలను కలిగిస్తుంది. కీర్తన 37లోని వాగ్దాన, నిబంధన సంబంధిత ప్రతిధ్వనిని ‘స్వాస్థ్యంగా పొందుతారు’ నిలుపుతుంది.
- source_word: אָרֶץ
  choice: దేశాన్ని
  rationale: אֶרֶץ అనే పదం ‘దేశం/భూమి’ లేదా ‘భూలోకం’ అని అర్థమవుతుంది. కీర్తన 37లో పదేపదే వచ్చే దేశాన్ని స్వాస్థ్యంగా పొందే వాగ్దానానికి ‘దేశం’ బాగా సరిపోతుంది; విస్తృతార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְיִשְׁכְּנוּ
  choice: నివసిస్తారు
  rationale: שׁכן స్థిరంగా నివసించడం, కాపురముండడం అనే భావాన్ని ఇస్తుంది. సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే ‘నివసిస్తారు’ స్థిర నివాస భావాన్ని తెలియజేస్తుంది.
- source_word: לָעַד
  choice: శాశ్వతంగా
  rationale: ఈ పదబంధం అంతులేని లేదా నిరంతర కాలాన్ని సూచిస్తుంది. ‘శాశ్వతంగా’ దాని స్థిరత్వాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עָלֶיהָ
  choice: దానిలో
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయం ముందున్న ‘దేశం’ను సూచిస్తుంది. హీబ్రూలో అక్షరార్థంగా ‘దానిమీద’ అయినా, దేశంలో నివాసాన్ని తెలుగులో సహజంగా చెప్పడానికి ‘దానిలో’ అనుకూలం.
theological_decisions:
- issue: వాగ్దాన సందర్భంలో אָרֶץ పరిధి
  choice: దేశం
  alternative: భూమి / భూలోకం
  rationale: కీర్తన 37 తక్షణ సాహిత్య సందర్భంలో దేశాన్ని స్వాస్థ్యంగా పొందే భాష పునరావృతమవుతుంది కాబట్టి ప్రధాన పాఠ్యంలో ‘దేశం’ ఎంచుకున్నాం. అయితే హీబ్రూ పదానికి విస్తృతమైన ‘భూమి/భూలోకం’ అర్థం కూడా సాధ్యమే; దైవశాస్త్ర ఉద్రిక్తతను ఏకపక్షంగా పరిష్కరించకుండా పాదసూచికలో దాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళమైనా గౌరవప్రదమైన శైలి. హీబ్రూ సమాంతర వాక్య నిర్మాణాన్ని రెండు పాదాలుగా నిలిపి, వాగ్దాన స్వరాన్ని భవిష్యత్ కాల క్రియలతో వ్యక్తం చేశాం.
