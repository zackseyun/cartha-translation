  text: I have seen a wicked[a], ruthless man spreading himself out like a flourishing native tree.
translation:
  language: te
  text: నిర్దయుడైన దుర్మార్గుడు తన సొంత నేలలో పచ్చగా వర్ధిల్లే చెట్టులా విస్తరిస్తూ ఉండడాన్ని నేను చూశాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిర్దయుడైన దుర్మార్గుడు పచ్చగా వర్ధిల్లే స్థానికుడిలా విస్తరిస్తూ ఉండడాన్ని నేను చూశాను.” హీబ్రూ వ్యక్తీకరణ క్లిష్టమైనది. మూలపాఠంలో “చెట్టు” అనే పదం స్పష్టంగా లేదు; “స్థానికుడు/స్వదేశీయుడు” అనే పదంతో పచ్చగా వర్ధిల్లే చెట్టు, అంటే తన నేలలో బలంగా పెరిగే చెట్టు, అనే చిత్రం సూచితమై ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: నేను చూశాను
  rationale: ראה అనే క్రియ యొక్క ఖాల్ పర్ఫెక్ట్ ప్రథమ పురుష ఏకవచన రూపం. కీర్తనకర్త గతంలో ప్రత్యక్షంగా గమనించిన విషయాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: רָשָׁע
  choice: దుర్మార్గుడు
  rationale: నైతికంగా చెడ్డ వ్యక్తిని సూచించే జ్ఞానసాహిత్య సందర్భానికి సహజమైన, స్థిరమైన తెలుగు పదం.
- source_word: עָרִיץ
  choice: క్రూరుడు
  rationale: బలవంతుడైన, అణచివేసే, భయపెట్టే వ్యక్తి అనే భావాన్ని తెలియజేస్తుంది; శారీరక హింసకే అర్థాన్ని పరిమితం చేయదు.
- source_word: וּמִתְעָרֶה
  choice: విస్తరించడం
  rationale: హిత్పయేల్ కృదంతంలోని విస్తరిస్తూ వర్ధిల్లే చిత్రాన్ని సహజమైన తెలుగులో అందిస్తుంది; రూపంలోని ప్రతికర్తృక ఛాయను సందర్భంలో అతిగా బలవంతం చేయదు.
- source_word: כְּאֶזְרָח
  choice: తన సొంత నేలలో ... చెట్టులా
  rationale: אֶזְרָח సాధారణంగా స్వదేశీయుడు లేదా స్థానికంగా పుట్టినవాడు అని అర్థం. ఈ కవితా ఉపమానంలో తన నేలలో బలంగా పెరిగే చెట్టు భావం సూచితమైందని భావించి, తెలుగులో చిత్రం స్పష్టమయ్యేలా ‘చెట్టు’ను పూరించాం.
- source_word: רַעֲנָן
  choice: పచ్చగా వర్ధిల్లే
  rationale: పచ్చదనం, తాజాదనం, సమృద్ధిగా ఎదగడం అనే భావాలను కలిపి తెలియజేసి, చెట్టు యొక్క సజీవమైన కవితా చిత్రాన్ని నిలుపుతుంది.
