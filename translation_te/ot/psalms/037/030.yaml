source:
  edition: WLC
  text: פִּֽי צַ֭דִּיק יֶהְגֶּ֣ה חָכְמָ֑ה וּ֝/לְשׁוֹנ֗/וֹ תְּדַבֵּ֥ר מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/030.yaml
  text: The mouth of the righteous utters wisdom[b][a], and his tongue speaks justice.
translation:
  language: te
  text: నీతిమంతుని నోరు జ్ఞానాన్ని పలుకుతుంది[a]; అతని నాలుక న్యాయాన్ని[b] పలుకుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘జ్ఞానాన్ని ధ్యానిస్తుంది’ లేదా ‘జ్ఞానాన్ని మెల్లగా ఉచ్చరిస్తుంది.’ హీబ్రూ క్రియ మెల్లని ఉచ్చారణను లేదా మననం చేయడాన్ని సూచించగలదు; అయితే సమాంతర పాదంలోని ‘అతని నాలుక న్యాయాన్ని పలుకుతుంది’ అనే మాట వల్ల ఇక్కడ పలకడమే ప్రధాన భావంగా కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తీర్పును,’ ‘న్యాయమైనదాన్ని.’ హీబ్రూ పదం న్యాయం, న్యాయనిర్ణయం లేదా సరైనదాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי צַדִּיק
  choice: నీతిమంతుని నోరు
  rationale: హీబ్రూలోని సంబంధ నిర్మాణాన్ని, మాటకు అవయవాన్ని ప్రతీకగా వాడిన కవితా రూపాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יֶהְגֶּה
  choice: పలుకుతుంది
  rationale: ఈ క్రియకు ధ్యానించడం, మెల్లగా గొణగడం, ఉచ్చరించడం అనే భావాలు ఉండవచ్చు. ఇక్కడ ‘నోరు’ కర్తగా ఉండటం, సమాంతర పాదంలో ‘నాలుక ప్రకటిస్తుంది’ అని ఉండటం వల్ల శ్రవణయోగ్యమైన మాట ప్రధాన భావం.
- source_word: חָכְמָה
  choice: జ్ఞానాన్ని
  rationale: חָכְמָהకు సందర్భోచితమైన ప్రామాణిక తెలుగు సమానం; ఇది నీతిమంతుని మాటల విషయాన్ని సూచిస్తుంది.
- source_word: וּלְשׁוֹנוֹ
  choice: అతని నాలుక
  rationale: ‘నోరు’తో ఉన్న హీబ్రూ కవితా సమాంతరతను, మాటకు సంబంధించిన అవయవ రూపకాన్ని కాపాడుతుంది.
- source_word: תְּדַבֵּר
  choice: ప్రకటిస్తుంది
  rationale: దృఢంగా మాట వెలిబుచ్చే భావాన్ని సహజంగా ఇస్తూ, మొదటి పాదంలోని ‘పలుకుతుంది’తో అనవసర పదపునరుక్తిని నివారిస్తుంది.
- source_word: מִשְׁפָּט
  choice: న్యాయాన్ని
  rationale: ఈ పదం న్యాయం, తీర్పు, న్యాయమైనది అనే విస్తృత భావపరిధి కలిగి ఉంది. ఈ జ్ఞానసాహిత్య సందర్భంలో ‘న్యాయం’ ప్రధాన భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: జ్ఞానసాహిత్యంలో పురుషలింగ ఏకవచన నీతిమంతుడు
  choice: నీతిమంతుని / అతని
  alternative: నీతిగల వ్యక్తి / ఆ వ్యక్తి
  rationale: హీబ్రూ צַדִּיק వ్యాకరణపరంగా పురుషలింగ ఏకవచనమైన ప్రతినిధి రూపం. తెలుగు వాక్యంలో దాని ఏకవచన పురుష సూచనను నిలుపుతూ, ఇది పురుషులకు మాత్రమే పరిమితమని అదనంగా నిర్ధారించకుండా అనువదించబడింది.
- issue: מִשְׁפָּט యొక్క భావపరిధి
  choice: న్యాయం
  alternative: తీర్పు; న్యాయమైనది
  rationale: ఒక నిర్దిష్ట న్యాయస్థాన తీర్పుకన్నా, నీతిమంతుని మాటలు న్యాయానికి అనుగుణంగా ఉంటాయనే భావం ఈ సందర్భంలో బలంగా ఉంది; ఇతర సాధ్యార్థాలను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన కవితా శైలి. ‘నోరు—నాలుక’ అనే హీబ్రూ సమాంతర రూపాన్ని నిలిపి, రెండు క్రియల భావసామ్యాన్ని సహజమైన తెలుగు పదాలతో వ్యక్తం చేశాం. ప్రతి పాదటిప్పణి సూచిక సంబంధిత పదబంధం వెంట ఉంచబడింది.
