source:
  edition: WLC
  text: יוֹדֵ֣עַ יְ֭הוָה יְמֵ֣י תְמִימִ֑ם וְ֝/נַחֲלָתָ֗/ם לְ/עוֹלָ֥ם תִּהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/018.yaml
  text: Yahweh knows the days of the blameless[b][a], and their inheritance will be forever.
translation:
  language: te
  text: 'యాహ్వే నిర్దోషుల దినాలను ఎరుగుతాడు[a];

    వారి స్వాస్థ్యం ఎప్పటికీ ఉంటుంది[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిర్దోషులు’ అనే పదాన్ని ‘యథార్థులు’ లేదా ‘యథార్థహృదయులు’ అని కూడా అనువదించవచ్చు; ఇది తప్పనిసరిగా సంపూర్ణ పాపరాహిత్యాన్ని సూచించదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “వారి స్వాస్థ్యం ఎప్పటికీ ఉంటుంది.” ఈ మాట నిరంతర స్వాధీనాన్ని లేదా శాశ్వతమైన స్థిరత్వాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: יוֹדֵעַ
  choice: ఎరుగుతున్నాడు
  rationale: కొనసాగుతున్న, వ్యక్తిగతమైన ఎరుగుదలను సూచించే హీబ్రూ కృదంతానికి గంభీరమైన సహజ తెలుగు రూపం; ‘కాపాడుతున్నాడు’ వంటి అదనపు భావాన్ని చేర్చదు.
- source_word: יְמֵי
  choice: జీవితకాలాన్ని
  rationale: అక్షరార్థంగా ‘దినాలను’; ఇక్కడ వ్యక్తుల జీవనకాలం లేదా జీవిత గమనాన్ని సూచించే హీబ్రూ నుడికారాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תְמִימִם
  choice: నిర్దోషుల
  rationale: సంపూర్ణత, యథార్థత, నిందారహిత ప్రవర్తన అనే భావాలను మోస్తుంది; పాపరహిత పరిపూర్ణతను తప్పనిసరిగా సూచించదు.
- source_word: נַחֲלָתָם
  choice: వారి స్వాస్థ్యం
  rationale: వారసత్వంగా లేదా భాగంగా లభించిన ఆస్తి అనే స్పష్టమైన భావంతో పాటు నిబంధనాత్మక ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: לְעוֹלָם
  choice: ఎప్పటికీ
  rationale: కాలపరమైన నిరంతరత్వాన్ని సహజ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תִּהְיֶה
  choice: నిలిచి ఉంటుంది
  rationale: మూలంలో సరళంగా ‘ఉంటుంది’; తెలుగు సందర్భంలో స్వాస్థ్యపు శాశ్వతత్వాన్ని సహజంగా తెలియజేయడానికి ‘నిలిచి ఉంటుంది’ వాడాం, దీనిలోని వ్యాఖ్యానాత్మక విస్తరణను పాదసూచికలో వెల్లడించాం.
theological_decisions:
- issue: జ్ఞానసాహిత్య సందర్భంలో תְמִימִם అర్థం
  choice: యథార్థతతో, నిందారహితంగా జీవించే ప్రజలను సూచించే ‘నిర్దోషులు’
  alternative: నీతిమంతులు; యథార్థహృదయులు; నైతికంగా పరిపూర్ణులు
  rationale: కీర్తన దుష్టులకు విరుద్ధంగా దేవునికి నమ్మకంగా జీవించేవారిని వర్ణిస్తుంది. ఈ పదం సంపూర్ణ పాపరాహిత్యాన్ని ప్రకటిస్తుందని నిర్ణయించకుండా దాని నైతిక బలాన్ని నిలుపుతుంది.
- issue: యెహోవా ‘ఎరుగుట’ యొక్క భావబలం
  choice: శ్రద్ధతో కూడిన వ్యక్తిగత ఎరుగుదలను సూచిస్తూ ‘ఎరుగుతున్నాడు’ అని సరళంగా అనువదించడం
  alternative: ఆమోదిస్తున్నాడు; కనిపెట్టుకొని ఉన్నాడు; కాపాడుతున్నాడు
  rationale: సందర్భంలో సంరక్షణ భావం అంతర్లీనంగా ఉండవచ్చు; అయితే ידע క్రియలో స్పష్టంగా లేని పూర్తి వివరణను అనువాదంలో చేర్చకుండా ఉద్వేగాన్ని నిలిపాం.
- issue: స్వాస్థ్యం ఎప్పటికీ ఉండటం
  choice: దాని నిరంతరత్వాన్ని ‘నిలిచి ఉంటుంది’గా వ్యక్తం చేయడం
  alternative: ‘ఎప్పటికీ ఉంటుంది’ అని మరింత అక్షరార్థంగా ఇవ్వడం
  rationale: హీబ్రూ వాక్యం శాశ్వతమైన స్వాస్థ్యాన్ని చెబుతుంది; అది నిరంతర స్వాధీనమా, శాశ్వత వారసత్వమా అనే విషయాన్ని మరింత నిర్దిష్టంగా నిర్ణయించకుండా పాదసూచికలో అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీర శైలిని అనుసరించాం. కవితాత్మక సమాంతరత కోసం రెండు పాదాలుగా అమర్చాం. ‘ఎరుగుతున్నాడు’ స్వల్ప సాహిత్య గంభీరతను కలిగి ఉన్నప్పటికీ సహజంగా గ్రాహ్యం; ‘స్వాస్థ్యం’ బైబిలు సందర్భంలో వారసత్వ భాగం అనే భావాన్ని స్పష్టంగా మోస్తుంది.
