source:
  edition: WLC
  text: גּ֣וֹל עַל יְהוָ֣ה דַּרְכֶּ֑/ךָ וּ/בְטַ֥ח עָ֝לָ֗י/ו וְ/ה֣וּא יַעֲשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/005.yaml
  text: Commit your way to Yahweh[a]; trust in him[b], and he will act.
translation:
  language: te
  text: నీ మార్గాన్ని యాహ్వేకు అప్పగించు[a]; ఆయనపై నమ్మకం ఉంచు; ఆయనే చేస్తాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నీ మార్గాన్ని యాహ్వేపై దొర్లించు.” ఈ నుడికారం ఒకరి జీవనగతిని లేదా వ్యవహారాన్ని ఆయనకు అప్పగించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆయనే దాన్ని చేస్తాడు,” “ఆయనే దాన్ని జరిగిస్తాడు.” హీబ్రూలో ‘చేస్తాడు’ అని మాత్రమే ఉంది; ఏమి చేస్తాడో స్పష్టంగా చెప్పబడలేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: גּוֹל עַל
  choice: అప్పగించు
  rationale: గּוֹל అనే ఆజ్ఞారూపానికి అక్షరార్థంగా ‘దొర్లించు’ అనే భావం ఉంది. అయితే ‘మార్గాన్ని యాహ్వే మీద దొర్లించు’ అనే హీబ్రూ నుడికారం, తన జీవనగతిని ఆయనకు అప్పగించడాన్ని సూచిస్తుంది. తెలుగులో ‘అప్పగించు’ సహజంగా, స్పష్టంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ లిప్యంతరీకరణ అయిన ‘యాహ్వే’గా ఇచ్చాం.
- source_word: דַּרְכֶּךָ
  choice: నీ మార్గాన్ని
  rationale: ‘మార్గం’ అనే పదం ఇక్కడ ప్రయాణదారిని మాత్రమే కాక, వ్యక్తి జీవనగతి లేదా నడవడిని కూడా సూచించగలదు; మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: וּבְטַח עָלָיו
  choice: ఆయనపై నమ్మకం ఉంచు
  rationale: בטח అంటే ఆధారపడుతూ నమ్మడం. עָלָיוలోని ‘ఆయనపై’ అనే రూపకాన్ని తెలుగులో సహజంగా నిలుపుతూ ఈ అనువాదం వ్యక్తిగత విశ్వాసాన్ని వ్యక్తం చేస్తుంది.
- source_word: וְהוּא
  choice: ఆయనే
  rationale: ప్రత్యేక సర్వనామం హీబ్రూలో కర్తకు ఇచ్చిన నొక్కిచెప్పే భావాన్ని ‘ఆయనే’ సహజంగా తెలియజేస్తుంది.
- source_word: יַעֲשֶׂה
  choice: కార్యం చేస్తాడు
  rationale: עשה అనే క్రియకు ‘చేయు, కార్యం చేయు’ అనే విస్తృత అర్థం ఉంది. మూలంలో కర్మ స్పష్టంగా చెప్పబడలేదు. ‘కార్యం చేస్తాడు’ దేవుడు స్పందించి పనిచేస్తాడనే భావాన్ని తెలుపుతూనే, ఆయన ఏమి చేస్తాడో అనవసరంగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: יַעֲשֶׂה క్రియకు చెప్పని కర్మను చేర్చాలా
  choice: కర్మను నిర్దిష్టం చేయకుండా ‘ఆయనే కార్యం చేస్తాడు’
  alternative: ఆయనే దాన్ని నెరవేరుస్తాడు / ఆయనే అది జరిగేలా చేస్తాడు
  rationale: హీబ్రూ పాఠంలో క్రియకు స్పష్టమైన కర్మ లేదు. కాబట్టి దేవుడు ఖచ్చితంగా ఏ ఫలితాన్ని కలిగిస్తాడో చేర్చకుండా, వాక్యంలోని ఉద్దేశపూర్వక విశాలతను మరియు theological tensionను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అదే సమయంలో కీర్తనకు తగిన గౌరవప్రదమైన ఆజ్ఞారూప శైలిని వాడాం. ‘దొర్లించు’ అనే మూల రూపకాన్ని ప్రధాన వాక్యంలో కఠినంగా ఉంచకుండా పాదటిప్పణిలో భద్రపరిచాం; చివరి క్రియలోని అనిర్దిష్టతను సాధ్యమైనంతవరకు నిలిపాం.
