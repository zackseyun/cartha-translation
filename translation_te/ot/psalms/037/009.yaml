- from: ఎందుకంటే దుష్కార్యాలు చేసేవారు నిర్మూలించబడతారు; అయితే యెహోవా కోసం నిరీక్షించేవారే దేశాన్ని[a] స్వాస్థ్యంగా పొందుతారు.
