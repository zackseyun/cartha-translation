source:
  edition: WLC
  text: כִּֽי מְ֭רֵעִים יִכָּרֵת֑וּ/ן וְ/קֹוֵ֥י יְ֝הוָ֗ה הֵ֣מָּה יִֽירְשׁוּ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/009.yaml
  text: For evildoers will be cut off[a], but those who wait for Yahweh—they will inherit the land.
translation:
  language: te
  text: ఎందుకంటే చెడుచేసేవారు తొలగించబడతారు; అయితే యెహోవా కొరకు నిరీక్షించేవారే దేశాన్ని[a] వారసత్వంగా పొందుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘భూమిని.’ హెబ్రీ אֶרֶץ అనే పదానికి ‘దేశం,’ ‘భూమి’ అనే రెండు అర్థాలూ ఉండవచ్చు; ఇక్కడ కీర్తనలోని నిబంధనాత్మక సందర్భానికి ‘దేశం’ బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఉపదేశానికి కారణాన్ని తెలిపే హేతువాచక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מְרֵעִים
  choice: దుష్కార్యాలు చేసేవారు
  rationale: చెడు చేసే వ్యక్తులను సూచించే హిఫీల్ కృదంత భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: יִכָּרֵתוּן
  choice: నిర్మూలించబడతారు
  rationale: నిఫాల్ రూపంలోని తొలగించబడటం లేదా తెగగొట్టబడటం అనే న్యాయతీర్పు భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; కేవలం చంపబడతారు అని అర్థాన్ని సంకుచితం చేయదు.
- source_word: וְקֹוֵי
  choice: అయితే ... కోసం నిరీక్షించేవారు
  rationale: వ్యతిరేక సమాంతరతను ‘అయితే’ తెలియజేస్తుంది; קוה లోని ఆశతో, సహనంతో ఎదురుచూసే భావాన్ని ‘నిరీక్షించేవారు’ నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: הֵמָּה
  choice: వారే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగులో సహజంగా ‘ఏ’ ప్రత్యయంతో వ్యక్తం చేస్తుంది.
- source_word: יִירְשׁוּ
  choice: స్వాస్థ్యంగా పొందుతారు
  rationale: ירשׁ లోని స్వాధీనపరచుకోవడం మరియు వాగ్దానానుసారమైన వారసత్వ భావాలను రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אָרֶץ
  choice: దేశాన్ని
  rationale: ఈ కీర్తనలో పదేపదే కనిపించే నిబంధనాత్మక భూవాగ్దాన సందర్భానికి ‘దేశం’ సరిపోతుంది; ‘భూమి’ అనే విస్తృత అర్థాన్ని పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: אָרֶץ వాగ్దానపు పరిధి
  choice: దేశాన్ని
  alternative: భూమిని
  rationale: తక్షణ కీర్తన సందర్భం ఇశ్రాయేలు గ్రంథాల్లోని దేశ స్వాస్థ్య వాగ్దాన భాషను ప్రతిధ్వనిస్తుంది. అయితే హెబ్రీ పదం సమస్త భూమిని కూడా సూచించగలదు కాబట్టి ఆ విస్తృత సాధ్యతను పాదసూచికలో ఉంచాం.
- issue: יִכָּרֵתוּן లో తీర్పు స్వభావం
  choice: నిర్మూలించబడతారు
  alternative: తొలగించబడతారు / తెగగొట్టబడతారు
  rationale: దుష్టుల అంతిమ తొలగింపును తెలిపే న్యాయతీర్పు బలాన్ని నిలుపుతూ, విధానం లేదా మరణాన్ని మూలపాఠం కంటే స్పష్టంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘వారే’ ద్వారా హెబ్రీ ఉద్ఘాటనను నిలిపాం. దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
