translation:
  language: te
  text: సంగీత నిర్వాహకునికి. దావీదు కీర్తన[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దావీదు రచించిన కీర్తన,’ లేదా ‘దావీదు కోసం కీర్తన’; కీర్తనల శీర్షికల్లోని హీబ్రూ నిర్మాణం రచయితృత్వాన్ని లేదా ఇతర సంబంధాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నిర్వాహకునికి
  rationale: కీర్తనల శీర్షికల్లో ఈ పదం సంగీత ప్రదర్శనను పర్యవేక్షించే వ్యక్తిని సూచిస్తుంది. ‘సంగీత నిర్వాహకుడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, గాయకబృందానికి మాత్రమే అర్థాన్ని పరిమితం చేయదు; ముందున్న ל ఉపసర్గను ‘-కి’గా వ్యక్తం చేశాం.
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: ఇది సంగీతంతో పాడే గీతానికి సాధారణ ప్రక్రియా-పదం. కీర్తనల గ్రంథ సందర్భంలో ‘కీర్తన’ సుపరిచితమైన, ఖచ్చితమైన తెలుగు పదం.
- source_word: לְדָוִד
  choice: దావీదు కీర్తన
  rationale: హీబ్రూ לְ శీర్షికల్లో రచయితృత్వం, సంబంధం, అంకితం, లేదా సంకలన సంబంధాన్ని సూచించవచ్చు. తెలుగులో ‘దావీదు కీర్తన’ సంక్షిప్తంగా, సహజంగా ఉండి ఆ సంబంధాన్ని అనవసరంగా నిర్దిష్టం చేయదు; ప్రత్యామ్నాయ భావాలను పాదటిప్పణి తెలియజేస్తుంది.
theological_decisions:
- issue: శీర్షికలో לְדָוִד యొక్క భావం
  choice: దావీదు కీర్తన
  alternative: దావీదు రచించిన కీర్తన; దావీదు కోసం కీర్తన
  rationale: మూలంలోని సంబంధార్థక నిర్మాణం రచయితృత్వాన్ని సూచించగలిగినా దానికే పరిమితం కాదు. అందువల్ల ప్రధాన పాఠంలో విస్తృత సంబంధాన్ని ఉంచి, సాధ్యమైన నిర్దిష్ట భావాలను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన శీర్షిక శైలిని వాడాం. ‘సంగీత నిర్వాహకుడు’ అనే పదబంధం గాయకబృందం మాత్రమే కాక విస్తృత సంగీత పర్యవేక్షణను సూచిస్తుంది. పాదటిప్పణి గుర్తు చర్చించబడుతున్న ‘దావీదు కీర్తన’ తర్వాత ఉంచబడింది.
