source:
  edition: WLC
  text: עַד אָ֨נָה אָשִׁ֪ית עֵצ֡וֹת בְּ/נַפְשִׁ֗/י יָג֣וֹן בִּ/לְבָבִ֣/י יוֹמָ֑ם עַד אָ֓נָה יָר֖וּם אֹיְבִ֣/י עָלָֽ/י־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/002.yaml
  text: How long must I take counsel in my soul[b][a], with sorrow in my heart all day? How long will my enemy be exalted over me?
translation:
  language: te
  text: ఎంతకాలం నా అంతరంగంలో యోచనలు చేసుకుంటూ[a], రోజంతా నా హృదయంలో దుఃఖంతో ఉండాలి? ఎంతకాలం నా శత్రువు నాపై పైచేయి కలిగి ఉంటాడు[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎంతకాలం నా అంతరంగంలో పథకాలు వేసుకుంటూ, రోజంతా నా హృదయంలో దుఃఖంతో ఉండాలి?”
    reason: עֵצוֹתకు ‘యోచనలు,’ ‘పథకాలు,’ లేదా ‘సలహాలు’ అనే అర్థాలు ఉన్నాయి; אָשִׁית శాబ్దికంగా ‘ఉంచుతాను/పెడతాను.’
  - marker: b
    text: లేదా, “నా శత్రువు నాపై విజయం సాధిస్తాడు?” హీబ్రూలో శాబ్దికంగా, “నాపై ఎత్తుగా ఉంటాడు”; ఇది నాపై ఉన్నతమైన స్థితి లేదా ఆధిక్యాన్ని సూచిస్తుంది.
    reason: יָרוּם ‘ఎత్తుగా ఉండడం/ఉన్నతంగా ఉండడం’ అనే నిలువు రూపకాన్ని ఉపయోగిస్తుంది.
lexical_decisions:
- source_word: עַד־אָנָה
  choice: ఎంతకాలం
  rationale: విలాపంలో పునరావృతమయ్యే కాలసంబంధ ప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אָשִׁית עֵצוֹת בְּנַפְשִׁי
  choice: నా అంతరంగంలో ఆలోచనలతో సతమతమవుతూ
  rationale: శాబ్దికంగా ‘నా ప్రాణంలో/అంతరంగంలో ఆలోచనలు లేదా యోచనలు ఉంచడం’; సందర్భంలో ఒంటరిగా పదేపదే యోచించే మానసిక భారాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יָגוֹן בִּלְבָבִי יוֹמָם
  choice: రోజంతా నా హృదయంలో దుఃఖం మోస్తూ
  rationale: יָגוֹן యొక్క దుఃఖ భావాన్ని, לֵבָב యొక్క హృదయ రూపకాన్ని, יוֹמָם యొక్క నిరంతర పగటి వ్యవధిని నిలుపుతుంది.
- source_word: יָרוּם אֹיְבִי עָלָי
  choice: నా శత్రువు నాపై పైచేయి సాధిస్తాడు
  rationale: רוּם యొక్క ‘ఎత్తుగా ఉండడం’ అనే రూపకాన్ని తెలుగులో అర్థవంతమైన ‘పైచేయి సాధించడం’ ద్వారా వ్యక్తపరుస్తుంది; శత్రువు ఆధిక్యంలో ఉండడమే భావం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; విలాపంలోని పునరుక్త ప్రశ్నను, హృదయ రూపకాన్ని కాపాడుతూ, సాధారణ పాఠకులకు సహజంగా ఉండేలా రూపొందించబడింది. రెండు పాదాల్లో కొనసాగుతున్న భారాన్ని చూపేందుకు ‘ఉంటూ ఉండాలి’ భావ నిర్మాణం ఉపయోగించబడింది.
