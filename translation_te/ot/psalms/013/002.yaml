- from: ఎంతకాలం నా అంతరంగంలో ఆలోచనలతో సతమతమవుతూ[a], రోజంతా నా హృదయంలో దుఃఖం మోస్తూ ఉండాలి? ఎంతకాలం నా శత్రువు నాపై పైచేయి సాధిస్తాడు[b]?
  to: ఎంతకాలం నా అంతరంగంలో యోచనలు చేసుకుంటూ[a], రోజంతా నా హృదయంలో దుఃఖంతో ఉండాలి? ఎంతకాలం నా శత్రువు నాపై పైచేయి కలిగి ఉంటాడు[b]?
