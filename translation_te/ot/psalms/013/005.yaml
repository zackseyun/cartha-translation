revisions:
- from: కాని నేనైతే నీ స్థిరమైన ప్రేమను నమ్ముకున్నాను; నీ రక్షణను బట్టి నా హృదయం ఆనందిస్తుంది.[a] యెహోవాకు నేను పాడుతాను, ఎందుకంటే ఆయన నాకు మేలు సమృద్ధిగా చేశాడు.
  to: కాని నేనైతే నీ స్థిరమైన ప్రేమలో నమ్మకం ఉంచాను; నీ రక్షణలో నా హృదయం ఆనందిస్తుంది.[a] యాహ్వేకు నేను పాడుతాను, ఎందుకంటే ఆయన నాకు సమృద్ధిగా మేలు చేశాడు.
  rationale: The revision restores the Hebrew preposition in the expression of trust, aligns the divine name with the stated Yahweh policy, and improves the natural Telugu order of the final clause. It retains the future-oriented imperfect in 'ఆనందిస్తుంది,' the cohortative resolve in 'పాడుతాను,' and the footnote preserving the rescue/deliverance nuance of יְשׁוּעָה.
