  text: וַ/אֲנִ֤י בְּ/חַסְדְּ/ךָ֣ בָטַחְתִּי֮ יָ֤גֵ֥ל לִבִּ֗/י בִּֽ/ישׁוּעָ֫תֶ֥/ךָ אָשִׁ֥ירָה לַ/יהוָ֑ה כִּ֖י גָמַ֣ל עָלָֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/005.yaml
  text: But as for me[a], I have trusted in your steadfast love; my heart will rejoice in your salvation. I will sing to Yahweh, because he has dealt bountifully with me.
translation:
  language: te
  text: కాని నేనైతే నీ స్థిరమైన ప్రేమలో నమ్మకం ఉంచాను; నీ రక్షణలో నా హృదయం ఆనందిస్తుంది.[a] యాహ్వేకు నేను పాడుతాను, ఎందుకంటే ఆయన నాకు సమృద్ధిగా మేలు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “రక్షణ” అనే పదాన్ని “విడుదల” అని కూడా అనువదించవచ్చు. హీబ్రూ పదం ప్రస్తుత ఆపదనుండి కాపాడటాన్నీ, విస్తృత అర్థంలో రక్షణనూ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: కాని నేనైతే
  rationale: ముందున్న విలాపానికి భిన్నంగా కీర్తనకర్త చూపుతున్న విశ్వాసాన్ని సంధి, ఉద్ఘాటక సర్వనామం కలిసి సూచిస్తున్నాయి.
- source_word: בְּחַסְדְּךָ
  choice: నీ స్థిరమైన ప్రేమను
  rationale: חֶסֶדలోని కృపతో కూడిన, నమ్మదగిన, నిలకడైన ప్రేమ భావాలను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בָטַחְתִּי
  choice: నమ్ముకున్నాను
  rationale: పూర్తయినప్పటికీ కొనసాగుతున్న స్థిరమైన నమ్మక స్థితిని తెలుగు భూతకాల రూపం సహజంగా తెలియజేస్తుంది.
- source_word: יָגֵל לִבִּי
  choice: నా హృదయం ఆనందిస్తుంది
  rationale: దేవుని రక్షణను ఎదురుచూస్తూ కలిగే ఆనందాన్ని అసంపూర్ణ క్రియ సూచిస్తుంది; భవిష్యదర్థం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: בִּישׁוּעָתֶךָ
  choice: నీ రక్షణను బట్టి
  rationale: יְשׁוּעָה ప్రస్తుత ఆపదనుండి విడిపింపునూ విస్తృతమైన రక్షణనూ సూచించగలదు; తెలుగు ప్రయోగంలో కారణార్థాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אָשִׁירָה
  choice: నేను పాడుతాను
  rationale: కోహోర్టేటివ్ రూపంలోని సంకల్పం, ఉద్దేశాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: మూలంలోని వ్యక్తిగత దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపంలో ఉంచుతుంది.
- source_word: כִּי גָמַל עָלָי
  choice: ఎందుకంటే ఆయన నాకు మేలు సమృద్ధిగా చేశాడు
  rationale: గాయకుడు పాడటానికి కారణాన్ని స్పష్టపరుస్తూ, גמל עליలోని ఉదారమైన మేలు చేసే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా పేరుగానే అందిస్తుంది; తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను వాడింది.
- issue: יְשׁוּעָה యొక్క అర్థపరిధి
  choice: రక్షణ
  alternative: విడుదల
  rationale: ఈ పదం తక్షణ ఆపదనుండి విడుదలతో పాటు విస్తృతమైన రక్షణ భావాన్నీ కలిగి ఉండగలదు. ప్రధాన పాఠంలో విస్తృత పదాన్ని ఉంచి, నిర్దిష్ట ప్రత్యామ్నాయాన్ని పాదసూచికలో పరిరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కీర్తనా శైలిని అనుసరించింది. మూలంలోని విలాపం నుంచి విశ్వాసానికి వచ్చే మలుపు, అంతరంగ ఆనందం, గానసంకల్పం నిలుపబడ్డాయి.
