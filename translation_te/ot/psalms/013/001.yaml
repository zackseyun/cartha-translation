source:
  edition: WLC
  text: עַד אָ֣נָה יְ֭הוָה תִּשְׁכָּחֵ֣/נִי נֶ֑צַח עַד אָ֓נָה תַּסְתִּ֖יר אֶת פָּנֶ֣י/ךָ מִמֶּֽ/נִּי־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/001.yaml
  text: How long[a], O Yahweh, will you forget me forever? How long will you hide your face from me?
translation:
  language: te
  text: ఎంతకాలం, యాహ్వే, నన్ను మరచిపోతావు? ఎప్పటికీనా? ఎంతకాలం నీ ముఖాన్ని[a] నా నుండి దాచుకుంటావు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ సన్నిధిని’; అక్షరార్థంగా, ‘నీ ముఖాన్ని.’ హెబ్రీలో ముఖాన్ని దాచుకోవడం అనేది అనుగ్రహాన్ని లేదా సన్నిధిని ఉపసంహరించుకోవడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד־אָנָה
  choice: ఎంతకాలం
  rationale: విలాపంలో కాలవ్యవధిని ప్రశ్నించే సహజమైన తెలుగు ప్రయోగం; హెబ్రీ పాఠంలోని పునరుక్త ఆర్తిని కూడా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యనుకరణగా అందిస్తుంది.
- source_word: תִּשְׁכָּחֵנִי
  choice: నన్ను మరచిపోతావు
  rationale: שׁכח అనే క్రియ యొక్క సాధారణ అర్థాన్ని నేరుగా నిలుపుతూ, కొనసాగుతున్న బాధతో కూడిన ప్రశ్నను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נֶצַח
  choice: ఎప్పటికీనా?
  rationale: విలాపంలోని తీవ్రతను నిలుపుతుంది. ప్రత్యేక ప్రశ్నగా విరామచిహ్నం పెట్టడం ద్వారా ‘ఎంతకాలం’ మరియు ‘ఎప్పటికీ’ మధ్య ఉన్న ఉద్దేశపూర్వక ఉద్వేగాన్ని తెలుగులో స్పష్టంగా వినిపిస్తుంది.
- source_word: תַּסְתִּיר אֶת־פָּנֶיךָ מִמֶּנִּי
  choice: నీ ముఖాన్ని నాకు కనబడకుండా దాచుకుంటావు
  rationale: ‘నీ ముఖం’ అనే కవితాత్మక రూపకాన్ని నిలుపుతూ, מִמֶּנִּי సూచించే ‘నా నుండి’ అనే వేరుచేయడాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాకుండా దైవనామమే ఉంది. కాబట్టి దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’ అని ధ్వన్యనుకరణ చేయడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: ‘నీ ముఖం’ అనే హెబ్రీ నుడికారాన్ని వ్యాఖ్యానించి అనువదించాలా
  choice: ప్రధాన పాఠంలో ‘నీ ముఖం’ అని నిలుపడం
  alternative: నీ సన్నిధి; నీ అనుగ్రహం
  rationale: ఈ నుడికారం దేవుని సన్నిధి లేదా అనుగ్రహం ఉపసంహరించబడటాన్ని సూచించవచ్చు; అయినా మూలంలోని స్పష్టమైన కవితాత్మక రూపాన్ని ప్రధాన పాఠంలో ఉంచడం అర్థాన్ని అతిగా నిర్ధారించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా విలాపపు నేరుత్వం, పునరుక్తి, కవితాత్మక ఉద్వేగం నిలుపబడ్డాయి. ‘ఎప్పటికీనా?’ను విడి ప్రశ్నగా ఉంచి మూలంలోని భావతీవ్రతను సహజంగా వ్యక్తం చేశాం.
