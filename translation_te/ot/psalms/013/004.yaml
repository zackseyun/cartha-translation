  text: lest my enemy say[b][a], “I have overcome him,” and my adversaries rejoice because I am shaken.
translation:
  language: te
  text: 'లేకపోతే నా శత్రువు, “నేను అతన్ని జయించాను”[a] అంటాడు;

    నేను తూలినప్పుడు[b] నా విరోధులు ఉల్లసిస్తారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నేను అతనిపై పైచేయి సాధించాను.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “నేను తూలినందుకు”; మూలపదానికి “నేను జారిపోతే” లేదా “నేను కదిలితే” అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: లేకపోతే
  rationale: దేవుడు నివారించాలని కీర్తనకర్త కోరుతున్న ప్రతికూల పరిణామాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יֹאמַר
  choice: అంటాడు
  rationale: ప్రత్యక్ష వాక్య సందర్భంలో אמר అనే సాధారణ క్రియను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֹיְבִי
  choice: నా శత్రువు
  rationale: ఏకవచన నామవాచకాన్ని, ప్రథమ పురుష ఏకవచన ప్రత్యయాన్ని నేరుగా నిలుపుతుంది.
- source_word: יְכָלְתִּיו
  choice: నేను అతన్ని జయించాను
  rationale: יכל క్రియలోని ‘పైచేయి సాధించు/జయించు’ భావాన్ని, శత్రువు చెప్పే విజయగర్వంగా తెలియజేస్తుంది; సంపూర్ణ నాశనాన్ని అనవసరంగా సూచించదు.
- source_word: צָרַי
  choice: నా విరోధులు
  rationale: మూలంలోని బహువచనాన్ని నిలుపుతూ, ముందున్న ఏకవచన ‘శత్రువు’ నుంచి పదప్రయోగపరంగా వేరుచేస్తుంది.
- source_word: יָגִילוּ
  choice: ఉల్లసిస్తారు
  rationale: కీర్తనకర్త అస్థిరపడటంపై విరోధులు పొందే విజయోత్సాహాన్ని బలంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: כִּי
  choice: అప్పుడు
  rationale: ఈ సందర్భంలో כִּי కాలసంబంధమైన ‘when’ భావానికీ కారణార్థమైన ‘because’ భావానికీ వీలుంది; ప్రధాన పాఠంలో సహజమైన కాలసంబంధ పఠనాన్ని ఇచ్చి, కారణార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: אֶמּוֹט
  choice: నేను తూలినప్పుడు
  rationale: Niphal రూపంలోని అస్థిరత, కదలిక, పడిపోవడానికి దగ్గరవడం అనే భావాలను ‘తూలు’ సహజంగా మోస్తుంది; తప్పిపోవడం లేదా కదిలించబడడం అనే సాధ్యమైన ఛాయలను పాదసూచికలో ఉంచాం.
