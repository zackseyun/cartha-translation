source:
  edition: WLC
  text: הַבִּ֣יטָֽ/ה עֲ֭נֵ/נִי יְהוָ֣ה אֱלֹהָ֑/י הָאִ֥ירָ/ה עֵ֝ינַ֗/י פֶּן אִישַׁ֥ן הַ/מָּֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/003.yaml
  text: Look and answer me[a], O Yahweh my God; give light to my eyes[b], lest I sleep the sleep of death.
translation:
  language: te
  text: యాహ్వే, నా దేవా, నా వైపు చూసి నాకు జవాబివ్వు; నా కళ్లకు వెలుగు కలిగించు[a], లేకపోతే నేను మరణనిద్ర పోతాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నా కళ్లను వెలిగించు.” ఈ హీబ్రూ రూపకం పునరుద్ధరించబడిన జీవశక్తి, స్పష్టత లేదా ఆశను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో పదాల క్రమం అక్షరార్థంగా, “నేను మరణాన్ని నిద్రపోతాను”; “నేను మరణంలో నిద్రపోతాను” అని కూడా అర్థం కావచ్చు. సంప్రదాయంగా, “నేను మరణనిద్ర పోతాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבִּיטָה
  choice: నా వైపు చూసి
  rationale: నבט క్రియలోని శ్రద్ధగా చూడాలనే ప్రత్యక్ష విజ్ఞప్తిని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: עֲנֵנִי
  choice: నాకు జవాబివ్వు
  rationale: ప్రార్థనా సందర్భంలో ענה సాధారణంగా ‘జవాబివ్వు’ అని అర్థం; అనుకూలంగా చర్య తీసుకోవాలనే అదనపు భావాన్ని చేర్చదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని ఉచ్చారణను తెలుగులో ప్రతిలిపి చేస్తుంది.
- source_word: אֱלֹהָי
  choice: నా దేవా
  rationale: మొదటి పురుష ఏకవచన స్వామ్యార్థాన్నీ, ప్రత్యక్ష సంబోధననూ సహజంగా నిలుపుతుంది.
- source_word: הָאִירָה עֵינַי
  choice: నా కళ్లకు వెలుగు కలిగించు
  rationale: కారణార్థక క్రియతో కూడిన శరీరసంబంధ రూపకాన్ని నిలుపుతూ, దాన్ని కేవలం బలం, స్పష్టత లేదా ఆశ అనే ఒకే వివరణకు పరిమితం చేయదు.
- source_word: פֶּן
  choice: లేకపోతే
  rationale: కవి భయపడుతున్న పరిణామాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా పరిచయం చేస్తుంది.
- source_word: אִישַׁן הַמָּוֶת
  choice: నేను మరణనిద్ర పోతాను
  rationale: మరణాన్ని నిద్రగా చిత్రించే హీబ్రూ కవితా రూపకాన్ని సంక్షిప్తమైన, అర్థవంతమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది; ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా కాపాడుతుంది.
- issue: ‘కళ్లకు వెలుగు కలిగించు’ అనే రూపకం
  choice: రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: నా శక్తిని పునరుద్ధరించు / నాకు స్పష్టతనివ్వు / నాకు ఆశనివ్వు
  rationale: ఈ రూపకం నూతన జీవశక్తి, స్పష్టత లేదా ఆశను సూచించవచ్చు; అయితే మూలపాఠం వాటిలో ఒక్కదానికే దానిని పరిమితం చేయదు.
- issue: మరణాన్ని నిద్రగా చెప్పే రూపకం
  choice: మరణనిద్ర పోతాను
  alternative: మరణంలో నిద్రపోతాను
  rationale: మరణాన్ని నిద్రగా చిత్రించే కవితా బలాన్ని నిలుపుతుంది; మరణానంతర స్థితి గురించి పాఠం చెప్పనిదాన్ని అనవసరంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ప్రార్థనా కవిత్వానికి తగిన గంభీరతను నిలిపాం. ప్రత్యక్ష విజ్ఞప్తుల తీవ్రతను కాపాడి, హీబ్రూ రూపకాలను వివరణాత్మక భావానువాదాలతో భర్తీ చేయలేదు.
