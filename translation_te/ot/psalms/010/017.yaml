id: PSA.10.17
reference: Psalms 10:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: תַּאֲוַ֬ת עֲנָוִ֣ים שָׁמַ֣עְתָּ יְהוָ֑ה תָּכִ֥ין לִ֝בָּ֗/ם תַּקְשִׁ֥יב אָזְנֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/017.yaml
  text: O Yahweh[a], you have heard the desire of the humble; you will prepare their heart[b]; your ear will listen.
translation:
  language: te
  text: యాహ్వే[a], దీనుల ఆకాంక్షను నీవు ఆలకించావు; వారి హృదయాన్ని నీవు స్థిరపరుస్తావు[b]; నీ చెవి శ్రద్ధగా వింటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దీనులు’ అనే పదానికి ‘వినయంగలవారు,’ ‘సాత్వికులు,’ లేదా ‘అణచివేయబడినవారు’ అనే భావాలు కూడా సాధ్యం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వారి హృదయాన్ని సిద్ధపరుస్తావు’ లేదా ‘దృఢపరుస్తావు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּאֲוַת
  choice: ఆకాంక్షను
  rationale: ఈ నామవాచకం కోరిక లేదా ఆరాటాన్ని సూచిస్తుంది. ప్రార్థనా సందర్భంలో అతిశయించకుండా అంతరంగ కోరికను తెలిపేందుకు ‘ఆకాంక్ష’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: עֲנָוִים
  choice: దీనుల
  rationale: ఈ పదం అణచివేయబడినవారు, వినయంగలవారు, సాత్వికులు అనే పరస్పర సంబంధిత భావాలను కలిగి ఉంటుంది. కీర్తన సందర్భంలోని బాధితులను సూచిస్తూ, వారి అణకువ లేదా నిమ్నస్థితి అనే ద్వంద్వార్థాన్ని ‘దీనులు’ కొంతవరకు నిలుపుతుంది.
- source_word: שָׁמַעְתָּ
  choice: నీవు ఆలకించావు
  rationale: సంపూర్ణ క్రియను దేవుని వైపు నేరుగా సంబోధిస్తూ, పూర్తయినప్పటికీ ప్రస్తుతం ప్రాముఖ్యతగల వినికిడిగా తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన రూపంలో వ్యక్తిగత నామంగా నిలుపుతుంది.
- source_word: תָּכִין
  choice: స్థిరపరుస్తావు
  rationale: כון హిఫీల్ రూపం సిద్ధపరచడం, స్థాపించడం, దృఢపరచడం అనే అర్థాలను ఇవ్వగలదు. ‘హృదయం’తో కలిసినప్పుడు ‘స్థిరపరుస్తావు’ మూలంలోని దృఢత భావాన్ని సహజంగా తెలియజేస్తుంది; ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఉంచాం.
- source_word: לִבָּם
  choice: వారి హృదయాన్ని
  rationale: హీబ్రూ మానవశాస్త్రీయ రూపకాన్ని వ్యాఖ్యానించి ‘మనస్సు’గా మార్చకుండా ‘హృదయం’గానే నిలుపుతుంది.
- source_word: תַּקְשִׁיב
  choice: శ్రద్ధగా వింటుంది
  rationale: קשׁב హిఫీల్‌లోని శ్రద్ధపూర్వకంగా చెవియొగ్గే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אָזְנֶךָ
  choice: నీ చెవి
  rationale: దేవుని శ్రద్ధను తెలిపే హీబ్రూ కవితాత్మక మానవరూప చిత్రాన్ని సమతలీకరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠం బిరుదును కాక వ్యక్తిగత దైవనామాన్ని ఉపయోగిస్తుంది. తెలుగు సాధారణ పాఠకులకు గుర్తించదగిన ‘యెహోవా’ రూపం దానిని వ్యక్తిగత నామంగానే నిలుపుతుంది.
- issue: עֲנָוִים యొక్క సందర్భార్థం
  choice: దీనులు
  alternative: వినయంగలవారు; అణచివేయబడినవారు; సాత్వికులు
  rationale: కీర్తనలో అణచివేతకు గురైన పేదవారు దృష్టిలో ఉన్నప్పటికీ, పదంలో అణకువ/సాత్వికత భావం కూడా ఉంది. ‘దీనులు’ ఈ భావాల మధ్య ఉన్న ఉద్రిక్తతను పూర్తిగా ఒక్క దిశకు పరిమితం చేయదు.
- issue: תָּכִין לִבָּם యొక్క భావం
  choice: వారి హృదయాన్ని స్థిరపరుస్తావు
  alternative: వారి హృదయాన్ని సిద్ధపరుస్తావు; వారి హృదయాన్ని దృఢపరుస్తావు
  rationale: క్రియలో సిద్ధపరచడం మరియు స్థిరపరచడం రెండూ సాధ్యమైనందున ప్రధాన పాఠంలో సందర్భానుకూలమైన దృఢత భావాన్ని తీసుకుని, మిగిలిన నిజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా-కావ్య శైలి. ‘ఆలకించావు,’ ‘స్థిరపరుస్తావు’ వంటి పదాలు సాహిత్య గౌరవాన్ని కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి; హీబ్రూ సమాంతర నిర్మాణం మరియు ‘నీ చెవి’ అనే కవితాత్మక చిత్రం నిలుపబడ్డాయి.
