  source_fidelity: హీబ్రూ లִשְׁפֹּט యొక్క ఉద్దేశార్థక ప్రయోగాన్ని ‘న్యాయం చేకూర్చడానికి’ సరిగ్గా వ్యక్తపరుస్తుంది. יָתוֹם, דַּךְ, బַּל יוֹסִיף עוֹד, మరియు לַעֲרֹץ‌ల భావాలు వరుసగా తండ్రిలేనివారు, అణగారినవారు, ఇకపై జరగకూడదనే ఉద్దేశం, భయపెట్టడం అనే అర్థాలతో విశ్వసనీయంగా ప్రతిఫలించాయి. אֱנוֹשׁ מִן־הָאָרֶץ‌కు ‘భూమికి చెందిన మనిషి’ అనేది మూలంలోని ఏకవచన, మర్త్య-భూసంబంధ సూచనను సహజంగా కాపాడుతుంది; పాదసూచిక అక్షరార్థ ప్రత్యామ్నాయాన్ని అందిస్తుంది.
