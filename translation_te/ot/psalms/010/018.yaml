source:
  edition: WLC
  text: לִ/שְׁפֹּ֥ט יָת֗וֹם וָ֫/דָ֥ךְ בַּל יוֹסִ֥יף ע֑וֹד לַ/עֲרֹ֥ץ אֱ֝נ֗וֹשׁ מִן הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/018.yaml
  text: to give justice to the fatherless and the oppressed[c][b][a], so that man from the earth may terrify no more.
translation:
  language: te
  text: తండ్రిలేనివారికి[a], అణగారినవారికి[b] న్యాయం చేకూర్చడానికి, భూమికి చెందిన మనిషి[c] ఇకపై భయపెట్టకుండా ఉండడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అనాథలకు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నలిగినవారికి,’ ‘బాధింపబడినవారికి.’
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా ‘భూమినుండి వచ్చిన మనిషి’; అంటే కేవలం మర్త్య మానవుడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁפֹּט
  choice: న్యాయం చేకూర్చడానికి
  rationale: ఈ క్రియారూపం ముందరి సందర్భంలో దేవుడు వారి మొర ఆలకించడంలోని ఉద్దేశాన్ని తెలియజేస్తుంది. ‘తీర్పు తీర్చడానికి’ కంటే ‘న్యాయం చేకూర్చడానికి’ బలహీనుల పక్షాన జరిగే న్యాయచర్యను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: יָתוֹם
  choice: తండ్రిలేనివారు
  rationale: ఈ పదం సామాజికంగా రక్షణలేని తండ్రిలేని వ్యక్తిని సూచిస్తుంది. సందర్భంలో వర్గాన్ని సూచిస్తున్నందున తెలుగులో బహువచన గౌరవార్థక రూపం సహజంగా ఉంది.
- source_word: דַּךְ
  choice: అణగారినవారు
  rationale: ఈ విశేషణం నలిగిపోయిన లేదా అణచివేయబడిన స్థితిలో ఉన్నవారిని సూచిస్తుంది. ‘అణగారినవారు’ దాని సామాజిక, అనుభవాత్మక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בַּל יוֹסִיף עוֹד
  choice: ఇకపై ...కుండా ఉండడానికి
  rationale: నిషేధార్థక పదంతో ‘మరల/కొనసాగించు’ అనే భావాలు కలిసి, ఆ చర్య ఇక కొనసాగకూడదనే ఉద్దేశాన్ని వ్యక్తపరుస్తాయి.
- source_word: לַעֲרֹץ
  choice: భయపెట్టకుండా
  rationale: ఈ క్రియ భయభ్రాంతులకు గురిచేయడం లేదా భీతి కలిగించడం అనే భావాన్ని ఇస్తుంది. ‘అణచివేయడం’ అని అనువదిస్తే דַּךְతో ఉన్న పదభేదం మందగిస్తుంది.
- source_word: אֱנוֹשׁ מִן־הָאָרֶץ
  choice: భూమికి చెందిన మనిషి
  rationale: אֱנוֹשׁ బలహీనమైన మర్త్య మానవుణ్ణి సూచించగలదు; מִן־הָאָרֶץ అతని భూసంబంధమైన పరిమితిని నొక్కిచెబుతుంది. ‘భూమికి చెందిన మనిషి’ మూలంలోని ఏకవచన సాధారణ ప్రయోగాన్ని, దేవునికి ఎదురుగా మర్త్యుని పరిమితిని నిలుపుతుంది.
theological_decisions:
- issue: אֱנוֹשׁలోని ఏకవచన పుంలింగ సాధారణ ప్రయోగం
  choice: భూమికి చెందిన మనిషి
  alternative: భూమికి చెందిన మానవులు
  rationale: హీబ్రూ రూపం ఏకవచన పుంలింగంలో ఉన్నా, ప్రతినిధిగా ఏ మర్త్య మానవుణ్ణైనా సూచిస్తుంది. ‘మనిషి’ తెలుగులో ఆ ఏకవచన ప్రతినిధి శక్తిని నిలుపుతూ, దీనిని ప్రత్యేకంగా పురుషులకు మాత్రమే పరిమితం చేయదు.
- issue: מִן־הָאָרֶץ యొక్క సంబంధం
  choice: భూమికి చెందిన
  alternative: భూమినుండి వచ్చిన
  rationale: మూలపదబంధం అక్షరార్థంగా ‘భూమినుండి’ అని కూడా రావచ్చు. ప్రధాన పాఠంలో ‘భూమికి చెందిన’ అనడం మర్త్యుని భూసంబంధమైన పరిమితిని సహజంగా తెలియజేస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి అస్పష్టతను కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే కీర్తనకు తగిన గంభీరతతో అనువదించబడింది. వాక్యం ముందరి వచనంలోని దేవుని కార్యానికి ఉద్దేశాన్ని తెలిపే రెండు ప్రయోజనార్థక భాగాలుగా నిలుపబడింది.
