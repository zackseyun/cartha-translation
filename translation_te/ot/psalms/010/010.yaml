source:
  edition: WLC
  text: ו/דכה יָשֹׁ֑חַ וְ/נָפַ֥ל בַּ֝/עֲצוּמָ֗י/ו חלכאים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/010.yaml
  text: He crouches[a]; he bows down[c][b], and the helpless fall by his might.
translation:
  language: te
  text: వాడు నక్కి కూర్చుంటాడు[a]; వంగి కిందికి దిగుతాడు. నిస్సహాయులు వాడి బలానికి[c] పడిపోతారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనంలోని హీబ్రూ పాఠం క్లిష్టంగా ఉంది. ఇక్కడి మాటను “వాడు నలిగిపోతాడు” లేదా “వాడు వంగుతాడు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ క్రియ ఏకవచనంలో ఉండటంవల్ల కొందరు “వాడు పడిపోతాడు” అని అనువదిస్తారు. అయితే దుష్టుడు నిస్సహాయులను వేటాడుతున్న తక్షణ సందర్భంలో, నిస్సహాయులే పడిపోతారని గ్రహించడం మరింత సార్థకంగా ఉంటుంది.
    reason: alternative_reading
  - marker: c
    text: పదశః “వాడి బలవంతులచేత.” దీనిని “వాడి బలంవల్ల” అనీ, రూపకంగా “వాడి బలమైన పంజాల్లో” అనీ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ו/דכה
  choice: వాడు నక్కి కూర్చుంటాడు
  rationale: హీబ్రూ రూపం క్లిష్టమైనదైనా, తరువాతి క్రియతోను చుట్టుపక్కల ఉన్న వేట దృశ్యంతోను కలిపి చూస్తే దుష్టుడు ఎర కోసం కిందికి ఒదిగి ఉండే భంగిమను ఇది సూచించడం సందర్భానికి సరిపోతుంది.
- source_word: יָשֹׁחַ
  choice: వంగి కిందికి ఒదుగుతాడు
  rationale: ఈ క్రియకు వంగడం లేదా కిందికి దిగడం అనే భావం ఉంది. తెలుగు వాక్యంలో శారీరక భంగిమను సహజంగా తెలియజేస్తూ, వేటాడే దృశ్యాన్ని అతిగా విస్తరించకుండా ఈ అనువాదం నిలుపుతుంది.
- source_word: וְ/נָפַ֥ל
  choice: కూలిపోతారు
  rationale: హీబ్రూలో క్రియ ఏకవచన రూపంలో ఉన్నప్పటికీ వాక్యనిర్మాణం సంక్షిప్తంగా, క్లిష్టంగా ఉంది. సందర్భంలో నిస్సహాయులే దుష్టుని బలానికి పడిపోతున్నారని గ్రహించడం ముందున్న వేట దృశ్యానికి బాగా సరిపోతుంది; వ్యాకరణ సంబంధమైన సందిగ్ధతను పాదసూచికలో ఉంచాం.
- source_word: בַּ֝/עֲצוּמָ֗י/ו
  choice: వాడి బలానికి
  rationale: పదశః ఇది ‘వాడి బలవంతులచేత/వాడి బలమైన వాటిచేత’ అనే బహువచన భావాన్ని ఇవ్వగలదు. అయితే ఇక్కడ దుష్టుని శక్తిని సూచించే భావవాచక బహువచనంగా గ్రహించడం సహజమైన తెలుగు అర్థాన్ని ఇస్తుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో కాపాడాం.
- source_word: חלכאים
  choice: నిస్సహాయులు
  rationale: ఈ నామవాచకం బలహీనులు, దురవస్థలో ఉన్నవారు, సులభంగా దోపిడికి గురయ్యేవారు అనే భావాన్ని ఇస్తుంది. ‘నిస్సహాయులు’ ఆధునిక తెలుగులో వారి దుర్బల స్థితిని స్పష్టంగా తెలియజేస్తుంది.
