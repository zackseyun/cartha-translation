id: PSA.10.12
reference: Psalms 10:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: קוּמָ֤/ה יְהוָ֗ה אֵ֭ל נְשָׂ֣א יָדֶ֑/ךָ אַל תִּשְׁכַּ֥ח עניים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/012.yaml
  text: Rise up[a], O Yahweh; O God, lift up your hand. Do not forget the afflicted.
translation:
  language: te
  text: యాహ్వే, లేవుము! దేవా, నీ చెయ్యి ఎత్తుము; బాధితులను[a] మరచిపోవద్దు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పేదలను,’ ‘దీనులను,’ ‘అణచివేయబడినవారిని.’ హీబ్రూ పదం అణచివేయబడి బలహీన స్థితిలో ఉన్నవారిని విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: లేచి రా
  rationale: దేవునికి ఉద్దేశించిన అత్యవసర ఆజ్ఞాపూర్వక విజ్ఞప్తి. ఆధునిక తెలుగులో సహజంగా ఉండి, మూలంలోని తక్షణ చర్య పిలుపును నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని స్వరలిప్యంతరీకరణగా అందించింది.
- source_word: אֵל
  choice: దేవా
  rationale: యాహ్వే అనే సంబోధనకు సమాంతరంగా ఉన్న ప్రత్యక్ష సంబోధనను తెలుగు సంబోధనా రూపంలో నిలుపుతుంది.
- source_word: נְשָׂא יָדֶךָ
  choice: నీ చెయ్యి ఎత్తు
  rationale: చర్యకు సిద్ధపడటాన్ని సూచించే స్పష్టమైన మానవరూపక చిత్రాన్ని వ్యాఖ్యానించి మార్చకుండా నిలుపుతుంది.
- source_word: אַל תִּשְׁכַּח
  choice: మరచిపోవద్దు
  rationale: హీబ్రూ నిషేధాత్మక విజ్ఞప్తి యొక్క ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది; ‘పట్టించుకోకుండా ఉండవద్దు’ అనేది మరింత వ్యాఖ్యానాత్మకం.
- source_word: עניים
  choice: బాధితులను
  rationale: కీర్తన 10 సందర్భంలో దుష్టుల చేత అణచివేతకు గురై బలహీన స్థితిలో ఉన్నవారిని సూచిస్తుంది. ‘బాధితులు’ అనే పదం అర్థాన్ని కేవలం ఆర్థిక పేదరికానికి పరిమితం చేయదు.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవ నామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా స్వరలిప్యంతరీకరణతో నిలిపి, ప్రత్యామ్నాయ తెలుగు రూపాన్ని నమోదు చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, ప్రార్థనాత్మకమైన కవితా ధోరణి ఉపయోగించబడింది. ‘నీ చెయ్యి ఎత్తు’ అనే మానవరూపకాన్ని అలాగే నిలిపాం. అర్థానికి సంబంధించిన గమనిక ‘బాధితులను’ అన్న పదం వద్ద ఉంచబడింది.
