  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన కీర్తనా శైలి ఉపయోగించబడింది. దేవునికి ఏకవచన సంబోధనను కొనసాగిస్తూ, మూలంలోని దృశ్యరూపకాన్నీ నిస్సహాయుని ఆధారపడే భావాన్నీ సహజమైన తెలుగులో నిలిపాం.
