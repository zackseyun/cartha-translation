  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רָאִ֡תָה כִּֽי אַתָּ֤ה עָ֘מָ֤ל וָ/כַ֨עַס תַּבִּיט֮ לָ/תֵ֪ת בְּ/יָ֫דֶ֥/ךָ עָ֭לֶי/ךָ יַעֲזֹ֣ב חֵלֶ֑כָה יָ֝ת֗וֹם אַתָּ֤ה הָיִ֬יתָ עוֹזֵֽר־׀׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/014.yaml
  text: You have seen[a], for you look upon trouble and grief, to take it into your hand. The helpless commits himself to you[c][b]; you have been the helper of the fatherless.
translation:
  language: te
  text: నీవు చూశావు; కష్టాన్నీ వేదననూ నీవు గమనిస్తావు—వాటిని నీ చేతిలోకి తీసుకోవడానికి.[a] నిస్సహాయుడు తనను నీకు అప్పగించుకుంటాడు;[b] తండ్రిలేనివానికి[c] నీవే సహాయకుడిగా ఉన్నావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'పదశః: “వాటిని నీ చేతిలో ఉంచడానికి.” ఈ హీబ్రూ నానుడి దేవుడు ఆ విషయాన్ని తన ఆధీనంలోకి తీసుకొని చర్య చేపట్టడాన్ని కూడా సూచించవచ్చు.'
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: “నిస్సహాయుడు తన సంగతిని నీకే విడిచిపెడతాడు.” హీబ్రూ వాక్యం అతడు తననే దేవునికి అప్పగించుకోవడాన్ని లేదా తన వ్యాజ్యాన్ని దేవునికి వదిలేయడాన్ని సూచించవచ్చు.'
    reason: alternative_reading
  - marker: c
    text: 'లేదా: “అనాథకు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִתָה
  choice: నీవు చూశావు
  rationale: ఇది ראה ధాతువు Qal perfect 2ms రూపం; దేవుణ్ణి నేరుగా సంబోధిస్తూ, ఆయన ఇప్పటికే గమనించిన వాస్తవాన్ని కీర్తనకర్త తన విన్నపానికి ఆధారంగా ఉంచుతున్నాడు.
- source_word: עָמָל
  choice: కష్టం
  rationale: ఈ సందర్భంలో ఇది సాధారణ శ్రమకన్నా అణచివేత వల్ల కలిగే బాధను లేదా హానికరమైన కష్టాన్ని సూచిస్తుంది; ‘కష్టం’ ఆధునిక తెలుగులో సహజంగా ఉండి పదంలోని విస్తృతిని నిలుపుతుంది.
- source_word: כַעַס
  choice: వేదన
  rationale: ఈ పదం చికాకు, మనోవేదన, లేదా వేదన కలిగించే దుష్కార్యాన్ని సూచించవచ్చు. עָמָלతో జతగా ఉన్నందున ‘వేదన’ బాధితుని దుస్థితిని సహజంగా తెలియజేస్తుంది; దేవుని కోపమని అనవసరంగా నిర్ధారించదు.
- source_word: תַּבִּיט
  choice: నీవు గమనిస్తావు
  rationale: נבט Hiphil రూపం శ్రద్ధగా చూడడం లేదా లక్ష్యపెట్టి గమనించడం అనే భావం ఇస్తుంది. ‘గమనిస్తావు’ దైవిక పరిశీలనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לָתֵת בְּיָדֶךָ
  choice: వాటిని నీ చేతిలోకి తీసుకోవడానికి
  rationale: పదశః ‘నీ చేతిలో ఉంచడానికి/ఇవ్వడానికి.’ సందర్భంలో దేవుడు ఆ విషయాన్ని తన ఆధీనంలోకి తీసుకొని చర్య చేపట్టే భావం ఉంది. ప్రధాన పాఠం ఆ భావాన్ని తెలుగులో సహజంగా ఇస్తుంది; పదశః ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: עָלֶיךָ יַעֲזֹב
  choice: తనను నీకు అప్పగించుకుంటాడు
  rationale: עזב + עַל నిర్మాణం ఇక్కడ ప్రతికూలంగా విడిచిపెట్టడంకన్నా దేవునిపై ఆధారపడి తనను లేదా తన వ్యాజ్యాన్ని ఆయనకు అప్పగించడాన్ని సూచిస్తుంది.
- source_word: חֵלֶכָה
  choice: నిస్సహాయుడు
  rationale: ఈ అరుదైన పదం దురదృష్టంలో ఉన్న, బలహీనమైన లేదా రక్షణలేని వ్యక్తిని సూచిస్తుంది. సమాంతరంగా వచ్చే ‘తండ్రిలేనివాడు’ అనే పదానికి అనుగుణంగా ‘నిస్సహాయుడు’ సరిపోతుంది.
- source_word: יָתוֹם
  choice: తండ్రిలేనివాడు
  rationale: హీబ్రూ పదం ముఖ్యంగా తండ్రి రక్షణ కోల్పోయిన సామాజికంగా బలహీన వ్యక్తిని సూచిస్తుంది. ‘అనాథ’ సాధ్యమైన ప్రత్యామ్నాయం అయినా, ‘తండ్రిలేనివాడు’ మూలంలోని నిర్దిష్టతను కాపాడుతుంది.
- source_word: עוֹזֵר
  choice: సహాయకుడు
  rationale: ఇది దేవుని గురించి విధేయార్థకంగా వాడిన participle. ‘సహాయకుడు’ వ్యక్తిగతమైన, సంక్షిప్తమైన ఒప్పుకోలుగా మూలానికి దగ్గరగా ఉంది.
theological_decisions:
- issue: దేవుడు కేవలం గమనిస్తున్నాడా, లేక గమనించి చర్య చేపడుతున్నాడా
  choice: దేవుడు కష్టాన్నీ వేదననూ చూసి, ఆ విషయాన్ని తన చేతిలోకి తీసుకుంటాడు
  alternative: దేవుడు కష్టాన్నీ వేదననూ తన చేతిలో ఉంచబడేలా చూస్తాడు
  rationale: לָתֵת בְּיָדֶךָ అనే ప్రయోగం నిష్క్రియ పరిశీలనకన్నా బాధ్యత తీసుకొని జోక్యం చేసుకునే దిశను సూచిస్తుంది. అయితే తీర్పు ఏ రూపంలో జరుగుతుందో అనువాదం అదనంగా నిర్దేశించదు.
- issue: నిస్సహాయుడు దేవునికి దేనిని అప్పగిస్తాడు
  choice: నిస్సహాయుడు తనను దేవునికి అప్పగించుకుంటాడు
  alternative: నిస్సహాయుడు తన వ్యాజ్యాన్ని లేదా తన సంగతిని దేవునికి విడిచిపెడతాడు
  rationale: హీబ్రూ వాక్యనిర్మాణం వ్యక్తిని లేదా అతని వ్యాజ్యాన్ని సూచించగలదు. ప్రధాన పాఠం వ్యక్తిగత ఆధారపడటాన్ని వ్యక్తం చేస్తూ, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
