source:
  edition: WLC
  text: כִּֽי הִלֵּ֣ל רָ֭שָׁע עַל תַּאֲוַ֣ת נַפְשׁ֑/וֹ וּ/בֹצֵ֥עַ בֵּ֝רֵ֗ךְ נִ֘אֵ֥ץ יְהוָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/003.yaml
  text: For the wicked man boasts in the desire of his soul, and the greedy man blesses himself and despises the LORD.
translation:
  language: te
  text: ఎందుకంటే దుష్టుడు తన మనసులోని కోరిక గురించి గొప్పలు చెప్పుకుంటాడు; దురాశపరుడు తనను తాను దీవించుకుంటాడు, యెహోవాను తృణీకరిస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ వాక్యనిర్మాణం అస్పష్టంగా ఉంది. మరొక సాధ్యమైన అనువాదం: “దుష్టుడు దురాశపరుణ్ణి దీవించి యెహోవాను తృణీకరిస్తాడు”; లేదా, “దురాశపరుణ్ణి దీవించేవాడు యెహోవాను తృణీకరిస్తాడు.”'
    reason: וּבֹצֵעַ בֵּרֵךְ נִאֵץ יְהוָה అనే సంక్షిప్త పదబంధంలో ‘దీవించు’ క్రియకు కర్త, కర్మ ఏమిటి, అలాగే అది ‘యెహోవాను తృణీకరించు’ క్రియతో ఎలా సంబంధించిందనే విషయాల్లో ఒకటి కంటే ఎక్కువ వ్యాకరణసాధ్య విశ్లేషణలు ఉన్నాయి.
lexical_decisions:
- source_word: רָשָׁע
  choice: దుష్టుడు
  rationale: వ్యక్తిని సూచించే ఏకవచన నామవాచక ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: תַּאֲוַת נַפְשׁוֹ
  choice: తన మనసు కోరేదాన్ని
  rationale: అక్షరార్థంగా ‘తన ప్రాణపు/అంతరంగపు కోరిక’; సందర్భంలో దుష్టుని లోపలి వాంఛను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בֹצֵעַ
  choice: దురాశపరుడు
  rationale: అన్యాయ లాభాన్ని ఆశించే లేదా దోచుకునే వ్యక్తి అనే ప్రతికూల భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: בֵּרֵךְ
  choice: తనను తాను దీవించుకుంటాడు
  rationale: మసొరెటిక్ పాఠంలోని ‘దీవించు’ అర్థాన్ని నిలుపుతూ, వాక్యసందర్భంలో కర్మను ప్రతిబింబకంగా గ్రహించిన పఠనాన్ని అనుసరిస్తుంది.
- source_word: נִאֵץ יְהוָה
  choice: యెహోవాను దూషిస్తూ
  rationale: נִאֵץ యొక్క అవమానించు/తృణీకరించు భావాన్ని, దైవనామం יהוהను ‘యెహోవా’గా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ‘దీవించు’ క్రియకు కర్మ మరియు వాక్యంలోని క్రియల సంబంధం
  choice: ‘తనను తాను దీవించుకుంటాడు’ అనే ప్రధాన పఠనాన్ని తీసుకుని, ‘యెహోవాను దూషిస్తూ’ అనే సమకాలిక సంబంధాన్ని చూపించడం
  alternative: ‘దురాశపరుణ్ణి దీవించేవాడు యెహోవాను దూషిస్తాడు’ లేదా ‘దురాశపరుడు దీవించి యెహోవాను తృణీకరిస్తాడు’
  rationale: హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా ఉండి సంబంధం స్పష్టంగా లేదు. సంప్రదాయంగా సాధ్యమైన ప్రతిబింబక పఠనాన్ని ప్రధాన వచనంలో ఉంచి, ఇతర వ్యాకరణసాధ్య పఠనాలను పాదటిప్పణిలో వెల్లడించడం అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకుడికి సులభంగా అర్థమయ్యే శైలి. ‘గొప్పలు చెప్పుకుంటాడు’, ‘దురాశపరుడు’, ‘దూషిస్తూ’ వంటి ప్రస్తుత వాడుక పదాలను ఎంచుకున్నాం; దైవనామాన్ని ‘యెహోవా’గా ఉంచాం.
