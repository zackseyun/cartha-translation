  source_fidelity: హెబ్రీ మూలంలోని కష్టమైన יָחִילוּ క్రియను సందర్భానుసారంగా ‘వర్ధిల్లుతాయి’గా ఇవ్వడం సముచితం; ప్రత్యామ్నాయమైన ‘స్థిరంగా ఉంటాయి’తో పాటు క్రియకు ఉన్న ఇతర సంభావ్య భావాలను పాదసూచిక నిజాయితీగా తెలియజేస్తుంది. מָרוֹם ... מִנֶּגְדּוֹ యొక్క ‘ఎత్తులో ... చూపునకు అందకుండా’ రూపకం, అలాగే యాపీయాఖ్ యొక్క ధిక్కారపూర్వక శ్వాస/బుస చిత్రం, మూలభావాన్ని నిలుపుతున్నాయి.
