id: PSA.10.5
reference: Psalms 10:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יָ֘חִ֤ילוּ דרכ/ו בְּ/כָל עֵ֗ת מָר֣וֹם מִ֭שְׁפָּטֶי/ךָ מִ/נֶּגְדּ֑/וֹ כָּל צ֝וֹרְרָ֗י/ו יָפִ֥יחַ בָּ/הֶֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/005.yaml
  text: His ways prosper at all times[a]; your judgments are on high, out of his sight; as for all his adversaries[b], he snorts at them.
translation:
  language: te
  text: 'అతని మార్గాలు ఎల్లప్పుడూ వర్ధిల్లుతాయి[a];

    నీ తీర్పులు ఎంతో ఎత్తులో, అతని చూపునకు అందకుండా ఉన్నాయి;

    అతని విరోధులందరి మీద అతడు ధిక్కారంగా బుసకొడతాడు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని మార్గాలు ఎల్లప్పుడూ స్థిరంగా ఉంటాయి.’ ఇక్కడి హెబ్రీ క్రియ అర్థం క్లిష్టమైనది; అది మెలికలు తిరగడం లేదా ప్రసవవేదన పడడం అనే భావంతోనూ సంబంధం కలిగి ఉండవచ్చు. అయితే ఈ సందర్భం నిరంతర సఫలత లేదా భద్రత అనే భావానికి ఎక్కువగా అనుకూలిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘అతడు వారి మీద ఊదుతాడు/బుసకొడతాడు’; ఇది ధిక్కారాన్ని చూపించే సజీవ చిత్రం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחִילוּ
  choice: వర్ధిల్లుతాయి
  rationale: ఈ క్రియ అర్థం క్లిష్టమైనదైనా, ఈ కీర్తన సందర్భం దుష్టుని మార్గాలు నిరంతరం సఫలమవుతున్నట్లు కనిపిస్తున్నాయని విలపిస్తుంది. ‘వర్ధిల్లుతాయి’ ఆ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: דרכ/ו (דַּרְכּוֹ)
  choice: అతని మార్గాలు
  rationale: హెబ్రీయుల నుడికారంలోని జీవనవిధానం లేదా ప్రవర్తనా సరళి అనే సమష్టి భావాన్ని ‘మార్గాలు’ నిలుపుతుంది.
- source_word: בְּכָל עֵת
  choice: ఎల్లప్పుడూ
  rationale: ప్రతి కాలంలోనూ కొనసాగుతున్న పరిస్థితిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מָרוֹם
  choice: ఎంతో ఎత్తులో
  rationale: దేవుని తీర్పులు దుష్టునికి అందనంత ఉన్నతంగా లేదా దూరంగా ఉన్నాయనే స్థలసంబంధ రూపకాన్ని నిలుపుతుంది.
- source_word: מִשְׁפָּטֶיךָ
  choice: నీ తీర్పులు
  rationale: దేవుని న్యాయనిర్ణయాలు లేదా న్యాయపరమైన చర్యలు అనే విస్తృత భావాన్ని ‘తీర్పులు’ నిలుపుతుంది.
- source_word: מִנֶּגְדּוֹ
  choice: అతని చూపునకు అందకుండా
  rationale: ముందున్న ‘ఎత్తులో’ అనే మాటతో కలిసి, దేవుని తీర్పులు దుష్టుని దృష్టికి లేదా పరిగణనకు అందకుండా ఉన్నాయనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: כָּל צֹרְרָיו
  choice: అతని విరోధులందరి మీద
  rationale: అతనిని ఎదిరించేవారందరినీ సూచించే కవితాత్మకమైన, సాధారణ తెలుగు పదప్రయోగం.
- source_word: יָפִיחַ בָּהֶם
  choice: ధిక్కారంగా బుసకొడతాడు
  rationale: మూలంలోని ఊదడం లేదా ముక్కుతో గాలి విడవడం అనే సజీవ శారీరక చిత్రాన్ని నిలుపుతూ, అది ధిక్కారాన్ని వ్యక్తం చేస్తోందని తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: దుష్టుని స్థితిని తెలిపే יָחִילוּ అనే ప్రారంభ క్రియ అర్థం
  choice: అతని మార్గాలు నిరంతరం వర్ధిల్లుతున్నాయి.
  alternative: అతని మార్గాలు ఎల్లప్పుడూ స్థిరంగా లేదా భద్రంగా ఉన్నాయి; లేదా క్రియకు మెలికలు తిరగడం/ప్రసవవేదన పడడం వంటి అర్థం ఉండవచ్చు.
  rationale: ఈ కీర్తన దుష్టుని పైకి కనిపించే విజయం, అహంకారం గురించి విలపిస్తుంది. దేవుని తీర్పులు అతనికి అందనట్లు ఉండడం, విరోధులను అతడు ధిక్కరించడం అనే తరువాతి పాదాలతో ‘వర్ధిల్లుతాయి’ బాగా సరిపోతుంది; అయితే మూలంలోని నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో నిలిపాం.
- issue: దేవుని తీర్పులు ‘ఎత్తులో’ ఉండడం యొక్క భావం
  choice: స్థలసంబంధ రూపకాన్ని నిలుపుతూ అవి దుష్టుని చూపునకు అందకుండా ఉన్నాయని అనువదించడం.
  alternative: దుష్టుడు దేవుని తీర్పులను పట్టించుకోడు లేదా అవి అతనికి ఎంతో దూరంగా ఉన్నాయి అని పూర్తిగా భావానువాదం చేయడం.
  rationale: మూలంలోని ‘ఎత్తు’ రూపకాన్ని తొలగించకుండా, దాని సందర్భార్థమైన అందనితనాన్ని తరువాతి పదబంధంలో సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తనకు తగిన గంభీర కవితాత్మక ధోరణి పాటించబడింది. ‘మార్గాలు,’ ‘తీర్పులు,’ ‘విరోధులు’ వంటి పదాలు మూల రూపకాలను నిలుపుతాయి; క్లిష్టమైన ప్రారంభ క్రియకు ప్రధాన సందర్భార్థాన్ని పాఠ్యంలో, ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
