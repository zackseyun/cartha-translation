source:
  edition: WLC
  text: יֶאֱרֹ֬ב בַּ/מִּסְתָּ֨ר כְּ/אַרְיֵ֬ה בְ/סֻכֹּ֗/ה יֶ֭אֱרֹב לַ/חֲט֣וֹף עָנִ֑י יַחְטֹ֥ף עָ֝נִ֗י בְּ/מָשְׁכ֥/וֹ בְ/רִשְׁתּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/009.yaml
  text: He lies in wait in hiding[a], like a lion in his lair; he lies in wait to seize the poor[c][b]; he seizes the poor when he drags him into his net.
translation:
  language: te
  text: అతడు చాటున పొంచి ఉంటాడు[a], తన మాటులో ఉన్న సింహంలా[b]; పేదవాణ్ణి పట్టుకోవడానికి పొంచి ఉంటాడు; తన వలలోకి అతణ్ణి లాగి పేదవాణ్ణి పట్టుకుంటాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రహస్యంగా.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తన ఆశ్రయంలో” లేదా “తన పొదలో.” హీబ్రూ పదం ఆశ్రయాన్ని, దాపరిక స్థలాన్ని, లేదా గుబురుగా ఉన్న పొదను సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “తన వలలోకి అతణ్ణి లాగడం ద్వారా” లేదా “తన వలతో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶאֱרֹב
  choice: పొంచి ఉంటాడు
  rationale: ארב ఉద్దేశపూర్వకంగా దాడి చేయడానికి మాటువేసి వేచి ఉండడాన్ని సూచిస్తుంది. పద్యంలోని పునరుక్తిని కూడా నిలిపింది.
- source_word: בַּמִּסְתָּר
  choice: చాటున
  rationale: מִסְתָּר దాగిన స్థలాన్ని లేదా రహస్యంగా ఉండడాన్ని సూచిస్తుంది; ‘చాటున’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: כְּאַרְיֵה
  choice: సింహంలా
  rationale: ప్రమాదకరమైన వేటాడే జంతువు అనే మూల ఉపమానాన్ని నేరుగా నిలిపింది.
- source_word: בְסֻכֹּה
  choice: తన గుబురులోని
  rationale: סֻכָּה ఆశ్రయం, మాటు లేదా పొదలతో కూడిన దాపరిక స్థలాన్ని సూచించగలదు. సింహం మాటువేసే సందర్భంలో ‘గుబురు’ ఆ దృశ్యాన్ని సహజంగా అందిస్తుంది.
- source_word: לַחֲטוֹף / יַחְטֹף
  choice: పట్టుకోవడానికి / పట్టుకుంటాడు
  rationale: חטף ఆకస్మికంగా, బలవంతంగా స్వాధీనం చేసుకోవడాన్ని సూచిస్తుంది. ఒకే తెలుగు మూలాన్ని పునరావృతం చేసి కవితా బలాన్ని నిలిపింది.
- source_word: עָנִי
  choice: పేదవాణ్ణి
  rationale: עָנִי పేద, బాధిత లేదా బలహీన వ్యక్తిని సూచించవచ్చు. ఈ కీర్తనలోని సామాజిక అణచివేత సందర్భంలో ‘పేదవాడు’ ప్రత్యక్షమైన ఎంపిక.
- source_word: בְּמָשְׁכוֹ
  choice: అతణ్ణి లాగి
  rationale: ב + משך చర్య జరిగే విధానాన్ని లేదా దానితో కూడిన పరిస్థితిని సూచించవచ్చు. ‘లాగి’ హింసాత్మక చర్యను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: בְרִשְׁתּוֹ
  choice: తన వలలోకి
  rationale: ఉపసర్గ అక్షరార్థంగా ‘లో/తో’ అనే భావాలు ఇవ్వగలిగినా, లాగడం అనే క్రియతో ‘వలలోకి’ చిక్కుబడే దిశను సహజ తెలుగులో తెలియజేస్తుంది.
