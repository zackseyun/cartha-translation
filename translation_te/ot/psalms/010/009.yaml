- from: అతడు చాటున పొంచి ఉంటాడు[a], తన గుబురులోని సింహంలా[b]; పేదవాణ్ణి పట్టుకోవడానికి పొంచి ఉంటాడు; తన వలలోకి అతణ్ణి లాగి పేదవాణ్ణి పట్టుకుంటాడు[c].
  to: అతడు చాటున పొంచి ఉంటాడు[a], తన మాటులో ఉన్న సింహంలా[b]; పేదవాణ్ణి పట్టుకోవడానికి పొంచి ఉంటాడు; తన వలలోకి అతణ్ణి లాగి పేదవాణ్ణి పట్టుకుంటాడు[c].
  rationale: The sole revision replaces the overly specific “గుబురులోని” with “మాటులో ఉన్న,” preserving the Hebrew ambiguity of a lion’s sheltering covert while retaining a natural Telugu predatory image. Footnote b is correspondingly aligned with the revised wording. No doctrinal or interpretive expansion has been introduced.
