translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే కీర్తన కవిత్వానికి తగిన గంభీరతతో. పొంచి ఉండడం, పట్టుకోవడం అనే పునరుక్తులు మూలంలోని వేట మరియు హింస చిత్రణను నిలుపుతాయి.
