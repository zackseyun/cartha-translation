base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/011.yaml
  text: He says in his heart[a], “God has forgotten; he has hidden his face; he will never see.”
translation:
  language: te
  text: 'అతడు తన హృదయంలో ఇలా అనుకుంటాడు[a]: “దేవుడు మరచిపోయాడు; తన ముఖాన్ని దాచుకున్నాడు; ఆయన ఇక ఎన్నటికీ చూడడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “అతడు తన హృదయంలో ఇలా అనుకున్నాడు: ‘దేవుడు మరచిపోతాడు; తన ముఖాన్ని దాచుకుంటాడు; ఆయన ఎన్నటికీ చూడడు.’” హెబ్రీ కవిత్వంలోని సంపూర్ణ క్రియారూపాలను వర్తమాన భావంతోగానీ, భూత లేదా వర్తమాన-సంపూర్ణ భావంతోగానీ అనువదించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר
  choice: ఇలా అనుకుంటాడు
  rationale: ఇది Qal perfect 3ms రూపమైనప్పటికీ, కవిత్వంలోని సజీవమైన లేదా అలవాటైన అంతరంగ మాటను వర్తమాన కాలంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּלִבּוֹ
  choice: తన హృదయంలో
  rationale: లోపలి ఆలోచనను సూచించే హెబ్రీయ రూపకాన్ని, తెలుగులో అర్థమయ్యే బైబిలీయ వాడుకగా నిలుపుతుంది.
- source_word: שָׁכַח
  choice: మరచిపోయాడు
  rationale: మూల క్రియ యొక్క ప్రాథమిక అర్థమైన ‘మరచిపోవడం’ను నిలుపుతూ, దుష్టుని దృష్టిలో జరిగినదిగా భావించే కార్యాన్ని వ్యక్తం చేస్తుంది.
- source_word: אֵל
  choice: దేవుడు
  rationale: ఈ సందర్భంలో నిజ దేవుణ్ణి సూచించే సాధారణ ఏకవచన నామానికి సహజమైన తెలుగు సమానం.
- source_word: הִסְתִּיר פָּנָיו
  choice: తన ముఖాన్ని దాచుకున్నాడు
  rationale: దేవుడు తన దృష్టిని లేదా అనుగ్రహాన్ని ఉపసంహరించుకున్నాడనే భావాన్ని సూచించే స్పష్టమైన హెబ్రీయ రూపకాన్ని తగ్గించకుండా నిలుపుతుంది.
- source_word: בַּל ... לָנֶצַח
  choice: ఇక ఎన్నటికీ ... డు
  rationale: నిరంతర నిరాకరణను సహజమైన తెలుగులో బలంగా వ్యక్తం చేస్తుంది.
- source_word: רָאָה
  choice: చూడడు
  rationale: మూలంలోని ‘చూడు’ అనే ప్రాథమిక భావాన్ని నిలుపుతుంది; గమనించి తీర్పు తీర్చడం అనే సందర్భార్థాన్ని పాఠకుడికి తెరిచి ఉంచుతుంది.
theological_decisions:
- issue: దేవుడు తన ముఖాన్ని దాచుకోవడం అనే మానవరూప వర్ణన
  choice: ‘తన ముఖాన్ని దాచుకున్నాడు’ అనే రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘తన దృష్టిని మళ్లించాడు’ లేదా ‘పట్టించుకోవడం మానేశాడు’
  rationale: మూలంలోని స్పష్టమైన మానవరూప చిత్రణను నిలుపడం బైబిలీయ భాషా స్వరూపాన్ని కాపాడుతుంది; దాని అర్థాన్ని ఒకే వివరణకు పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. అంతరంగ మాటను ‘ఇలా అనుకుంటాడు’ అని స్పష్టం చేసినప్పటికీ ‘తన హృదయంలో’ అనే మూల రూపకాన్ని నిలుపుకుంది. కాలభేదంలోని నిజమైన సందిగ్ధతను పాదటిప్పణిలో ఇచ్చింది.
