source:
  edition: WLC
  text: אָלָ֤ה פִּ֣י/הוּ מָ֭לֵא וּ/מִרְמ֣וֹת וָ/תֹ֑ךְ תַּ֥חַת לְ֝שׁוֹנ֗/וֹ עָמָ֥ל וָ/אָֽוֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/007.yaml
  text: His mouth is full of cursing and deceit and oppression[b][a]; under his tongue are trouble and wickedness.
translation:
  language: te
  text: అతని నోరు శాపాలతో[a], మోసంతో, అణచివేతతో నిండి ఉంది; అతని నాలుక కింద అపకారం, దుర్మార్గం ఉన్నాయి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘శపించడం’; హీబ్రూ పదం కొన్ని సందర్భాల్లో ‘ప్రమాణం’ అని కూడా అర్థమివ్వవచ్చు. అయితే ఇక్కడి విరోధపూరిత మాటల సందర్భం ‘శాపాలు’ అనే అర్థానికే అనుకూలంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘అపకారం, దుర్మార్గం’ అనే మాటలకు ‘కష్టం, దుష్టత్వం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָלָה
  choice: శాపం
  rationale: విరోధపూరిత మాటల సందర్భంలో ఇది తటస్థమైన ‘ప్రమాణం’ కంటే శపించడాన్ని లేదా శాపాన్ని సూచిస్తుంది.
- source_word: פִּיהוּ
  choice: అతని నోరు
  rationale: మాట నోటి నుంచి వెలువడుతుందనే హీబ్రూ రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מָלֵא
  choice: నిండి ఉంది
  rationale: సమృద్ధిగా ఉండటాన్ని తెలిపే స్థితిని సహజంగా, నేరుగా వ్యక్తం చేస్తుంది.
- source_word: מִרְמוֹת
  choice: మోసం
  rationale: వంచనాత్మక మాట లేదా ప్రవర్తనను సూచించే ఈ పదానికి ఆధునిక తెలుగులో స్పష్టమైన సమానార్థకం.
- source_word: תֹךְ
  choice: అణచివేత
  rationale: ఇక్కడ మోసపూరితమైన, హానికరమైన దోపిడీ లేదా పీడన భావాన్ని తెలియజేస్తుంది.
- source_word: תַּחַת לְשׁוֹנוֹ
  choice: అతని నాలుక కింద
  rationale: దాగి ఉన్న హానికరమైన మాట లేదా ఉద్దేశాన్ని సూచించే సజీవ రూపకాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: עָמָל
  choice: కష్టం
  rationale: ఇక్కడ సాధారణ శ్రమ కంటే కలిగించే బాధ, ఇబ్బంది లేదా అపకార భావం ప్రధానమైనది; మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: אָוֶן
  choice: దుష్టత్వం
  rationale: చెడు, అన్యాయం, దుర్మార్గత అనే నైతిక భావాన్ని స్పష్టంగా అందిస్తుంది.
