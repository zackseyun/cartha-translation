  to: 'దుష్టుడు దేవుణ్ణి ఎందుకు తృణీకరిస్తాడు?


    “నీవు లెక్క అడగవు” అని తన మనసులో ఇలా అనుకుంటాడు.'
  rationale: The final clause is revised to communicate the contextual meaning that God will not call the wicked to account. The wording for contempt and inward thought is also adjusted for natural modern Telugu, without adding doctrinal interpretation or a footnote unsupported by the source.
