source:
  edition: WLC
  text: עַל מֶ֤ה נִאֵ֖ץ רָשָׁ֥ע אֱלֹהִ֑ים אָמַ֥ר בְּ֝/לִבּ֗/וֹ לֹ֣א תִּדְרֹֽשׁ־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/013.yaml
  text: Why does the wicked man despise God? He says in his heart, “You will not call to account.”
translation:
  language: te
  text: 'దుష్టుడు దేవుణ్ణి ఎందుకు తృణీకరిస్తాడు?


    “నీవు లెక్క అడగవు” అని తన మనసులో ఇలా అనుకుంటాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִאֵץ
  choice: తిరస్కరిస్తున్నాడు
  rationale: ఈ క్రియలో ధిక్కరించడం, తృణీకరించడం అనే భావాలు ఉన్నాయి. ఆధునిక సాధారణ తెలుగులో సహజంగా ఉండేలా ‘తిరస్కరిస్తున్నాడు’ అని అనువదించబడింది.
- source_word: רָשָׁע
  choice: దుష్టుడు
  rationale: నైతికంగా చెడ్డవాడిని సూచించే సాధారణ, గౌరవప్రద బైబిలు పదప్రయోగం.
- source_word: לֹא תִּדְרֹשׁ
  choice: నీవు విచారణ చేయవు
  rationale: דרשׁ ఇక్కడ దేవుడు అపరాధాన్ని పరిశీలించి బాధ్యత కోరడాన్ని సూచించగలదు. ‘విచారణ చేయవు’ మూలంలోని సంక్షిప్తతను, కొంత భావవిస్తృతిని కాపాడుతుంది.
theological_decisions:
- issue: לֹא תִּדְרֹשׁ అనే మాట దేవుని పరిశోధననా, శిక్ష కోరడమా, లేక లెక్క అడగడమా?
  choice: నీవు విచారణ చేయవు
  alternative: నీవు లెక్క అడగవు
  rationale: ‘లెక్క అడగవు’ బాధ్యత కోరే భావాన్ని స్పష్టంచేస్తుంది; అయితే మూలక్రియకు పరిశీలించడం లేదా వెదకడం అనే విస్తృత అర్థం కూడా ఉంది. అందువల్ల దుష్టుని మాటలోని ఉద్దేశపూర్వక సంక్షిప్తతను నిలుపుటకు ‘విచారణ చేయవు’ ఎంచుకోబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ప్రశ్నా నిర్మాణం వాడబడింది. ‘తన హృదయంలో’ అనే హెబ్రీయ భావవ్యక్తీకరణను అలాగే ఉంచి, అది అంతరంగ ఆలోచన అని తెలియజేయడానికి ‘అనుకుంటున్నాడు’ చేర్చబడింది.
