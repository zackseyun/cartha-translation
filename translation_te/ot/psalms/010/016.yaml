  yaml_path: translation/ot/psalms/010/016.yaml
  text: Yahweh is King forever and ever[a]; nations have perished from his land.
translation:
  language: te
  text: 'యహ్వే ఎప్పటికీ యుగయుగాలకూ రాజు;

    ఆయన దేశం నుండి జాతులు నశించిపోయాయి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన భూమి నుండి.” హీబ్రూ నామవాచకం సందర్భాన్ని బట్టి ‘దేశం’ లేదా ‘భూమి’ అని అర్థమివ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో సహజమైన లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: מֶלֶךְ
  choice: రాజు
  rationale: హీబ్రూలోని నామవాచక విధేయతను నిలుపుతూ, తెలుగులో సహజంగా ‘రాజు’ అని అనువదించాం.
- source_word: עוֹלָם וָעֶד
  choice: ఎప్పటికీ, యుగయుగాలకూ
  rationale: ఈ జంట పదబంధం తెలిపే అంతులేని కాలవ్యాప్తిని, దాని ఉద్ఘాటనను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אָבְדוּ
  choice: నశించిపోయాయి
  rationale: పూర్తయిన వాస్తవాన్ని తెలిపే హీబ్రూ క్రియారూపాన్ని తెలుగులో ఫలితస్థితిని సూచించే సహజమైన క్రియతో అందించాం; కర్తరిని పేర్కొనని కర్మణి భావాన్ని అనవసరంగా చేర్చలేదు.
- source_word: גּוֹיִם
  choice: జనాలు
  rationale: ఇక్కడ ఈ పదం విదేశీ జనసమూహాలను సూచిస్తుంది; ప్రత్యేక మతపరమైన వర్గార్థాన్ని రుద్దకుండా సాధారణ పదాన్ని ఎంచుకున్నాం.
- source_word: מֵאַרְצוֹ
  choice: ఆయన దేశం నుంచి
  rationale: אֶרֶץ అనే పదానికి ‘దేశం’ లేదా ‘భూమి’ అనే అర్థాలు ఉండవచ్చు. సందర్భంలో నిర్దిష్ట ప్రాంత భావం కొంత ముందుండటంతో ‘దేశం’ను ప్రధాన పాఠంలో ఉంచి, విశాలమైన అర్థాన్ని పాదటిప్పణిలో నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉన్నందున దానిని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం.
- issue: אַרְצוֹ యొక్క పరిధి
  choice: ఆయన దేశం
  alternative: ఆయన భూమి
  rationale: కీర్తన సందర్భం నిర్దిష్టమైన దేశాన్ని సూచించవచ్చు; అయితే విశ్వవ్యాప్తమైన ‘భూమి’ భావం కూడా హీబ్రూలో సాధ్యమే. ఆ సందిగ్ధతను పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన కీర్తనా శైలిని అనుసరించాం. సమాంతర వాక్య నిర్మాణాన్ని నిలిపి, పాదటిప్పణి సూచికను దానికి సంబంధించిన ‘దేశం’ భావం ఉన్న వాక్యాంతంలో ఉంచాం.
