id: PSA.10.6
reference: Psalms 10:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָמַ֣ר בְּ֭/לִבּ/וֹ בַּל אֶמּ֑וֹט לְ/דֹ֥ר וָ֝/דֹ֗ר אֲשֶׁ֣ר לֹֽא בְ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/006.yaml
  text: He says in his heart[a], “I will not be shaken[b]; through generation after generation I will not be in trouble.”
translation:
  language: te
  text: అతడు తన హృదయంలో, “నేను కదిలిపోను[a]; తరతరాలపాటు నాకు ఆపద రాదు[b]” అని అనుకుంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నేను కదిలించబడను.” హీబ్రూ క్రియకు కదలటం, తొట్రుపడటం, లేదా స్థిరత్వం కోల్పోవటం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో చివరి వాక్యభాగం అసంపూర్ణంగా ఉంది. దీనిని “తరతరాలపాటు ఆపదలో లేనివాడిగా ఉంటాను” లేదా “నాకు ఎన్నటికీ విపత్తు ఎదురుకాదు” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַר
  choice: అని అనుకుంటాడు
  rationale: కావ్యంలోని సంపూర్ణ క్రియ ఇక్కడ దుష్టుని ప్రస్తుత అంతరంగపు మాటను సజీవంగా పరిచయం చేస్తుంది; తెలుగులో ‘అనుకుంటాడు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: בְּלִבּוֹ
  choice: తన హృదయంలో
  rationale: అంతరంగ ఆలోచన లేదా తనలో తాను చెప్పుకోవడాన్ని సూచించే హీబ్రూ రూపకాన్ని స్పష్టంగా, గౌరవప్రదంగా నిలుపుతుంది.
- source_word: בַּל אֶמּוֹט
  choice: నేను కదిలిపోను
  rationale: מוט అనే క్రియ యొక్క నిఫాల్ రూపం కదిలించబడటం, తొట్రుపడటం, స్థిరత్వం కోల్పోవటం అనే భావాలను కలిగి ఉంది. ‘కదిలిపోను’ భద్రతపై అతని అతిశయాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְדֹר וָדֹר
  choice: తరతరాలపాటు
  rationale: వరుస తరాలన్నిటిలో కొనసాగే స్థితిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר לֹא בְרָע
  choice: నాకు ఆపద రాదు
  rationale: హీబ్రూ వాక్యభాగం అసంపూర్ణంగా, బహుళార్థకంగా ఉంది. ముందు ఉన్న ప్రథమపురుష అతిశయాన్ని కొనసాగిస్తూ, רָעను ఇక్కడ కీడు లేదా విపత్తు అనే అర్థంలో ‘ఆపద’గా అనువదించడం సందర్భానికి సరిపోతుంది.
theological_decisions:
- issue: చివరి అసంపూర్ణ వాక్యభాగం మరియు వక్త దృక్కోణం
  choice: దుష్టుని ప్రథమపురుష అంతరంగపు మాటను కొనసాగిస్తూ, ‘నాకు ఆపద రాదు’ అని ప్రధాన పాఠ్యంలో ఇచ్చాం.
  alternative: ‘తరతరాలపాటు ఆపదలో లేనివాడిగా’ అనే సంబంధవాచక వర్ణనగా కూడా అర్థం చేసుకోవచ్చు.
  rationale: సందర్భంలో ఇది దుష్టుని తప్పుడు భద్రతాభావాన్ని తెలిపే అతిశయం. ప్రధాన పాఠ్యంలో అత్యంత సహజమైన అనుసంధానాన్ని ఎంచుకున్నప్పటికీ, హీబ్రూలోని నిజమైన వాక్యనిర్మాణ సందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘తన హృదయంలో’ అనే బైబిలీయ రూపకాన్ని నిలిపి, దాని అర్థం తెలుగులో సహజంగా వినిపించేందుకు ‘అని అనుకుంటాడు’తో వాక్యాన్ని ముగించాం.
