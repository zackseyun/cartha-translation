source:
  edition: WLC
  text: לָ/מָ֣ה יְ֭הוָה תַּעֲמֹ֣ד בְּ/רָח֑וֹק תַּ֝עְלִ֗ים לְ/עִתּ֥וֹת בַּצָּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/001.yaml
  text: Why[a], Yahweh, do you stand far away? Why do you hide yourself in times of trouble?
translation:
  language: te
  text: 'ఎందుకు, యాహ్వే, నీవు దూరంగా నిలబడి ఉంటావు?


    ఆపద సమయాల్లో నిన్ను నీవు ఎందుకు దాచుకుంటావు?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆపద సమయాల్లో నిన్ను నీవు ఎందుకు కనబడకుండా చేసుకుంటావు?”
    reason: תַּעְלִים అనే హిఫీల్ క్రియకు తనను తాను దాచుకోవడం అనే భావంతో పాటు, తనను కనబడనీయకుండా చేసుకోవడం అనే అర్థవ్యక్తీకరణ కూడా ఉంది.
lexical_decisions:
- source_word: לָמָה
  choice: ఎందుకు
  rationale: విలాపంలోని సూటియైన ప్రశ్నను, దాని భావోద్వేగ తీవ్రతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణగా అందిస్తుంది.
- source_word: תַּעֲמֹד
  choice: నిలబడి ఉంటావు
  rationale: עמד లోని ‘నిలుచు’ అనే స్థలసంబంధ రూపకాన్ని కాపాడుతూ, కొనసాగుతున్న స్థితిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּרָחוֹק
  choice: దూరంగా
  rationale: కీర్తనకర్తకు అనుభవమవుతున్న దేవుని దూరత్వాన్ని సూచించే స్థలసంబంధ రూపకాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: תַּעְלִים
  choice: నిన్ను నీవు మరుగుచేసుకుంటావు
  rationale: దేవుడు తనను తాను కనబడకుండా చేసుకుంటున్నాడనే ఫిర్యాదును ప్రతిబింబించే హిఫీల్ భావాన్ని ఆత్మార్థకంగా వ్యక్తం చేస్తుంది.
- source_word: לְעִתּוֹת
  choice: సమయాల్లో
  rationale: עת యొక్క బహువచన కాలసూచక ప్రయోగాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: בַּצָּרָה
  choice: ఆపద
  rationale: צרה సూచించే కష్టం, ఇరుకు పరిస్థితి, బాధ అనే విస్తృత భావాన్ని సాధారణ పాఠకులకు అర్థమయ్యే పదంతో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవిక నామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవిక నామమే ఉంది; కాబట్టి దానిని బిరుదుతో మార్చకుండా లిప్యంతరీకరించడం మూలానికి నిష్ఠగా ఉంటుంది.
- issue: రెండవ పాదంలో ప్రశ్నార్థక పదాన్ని పునరుక్తి చేయడం
  choice: రెండవ పాదంలో ‘ఎందుకు’ అని స్పష్టంగా చేర్చడం
  alternative: ‘ఆపద సమయాల్లో నిన్ను నీవు మరుగుచేసుకుంటావు’ అని ప్రశ్నార్థక పదం లేకుండా ఉంచడం
  rationale: హీబ్రూలో రెండో למה లేకపోయినా, సమాంతర కవితా నిర్మాణం మొదటి ప్రశ్నను రెండవ పాదానికీ వర్తింపజేస్తుంది. తెలుగులో ‘ఎందుకు’ పునరుక్తి విలాప స్వరాన్ని స్పష్టంగా చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే విలాప శైలిని వాడాం. హీబ్రూ స్థలసంబంధ రూపకాన్ని, కవితా సమాంతరతను నిలిపాం.
