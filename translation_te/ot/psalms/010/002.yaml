    rationale: మొదటిది కొంత అనువాదసదృశంగా ఉంది; రెండవది ఆధునిక ప్రామాణిక తెలుగు సాహిత్య వాడుకలో తక్కువ సవ్యంగా ఉంది. సూచించిన రూపాలు అదే భావం, ఆకాంక్షార్థక బలాన్ని కాపాడతాయి.
