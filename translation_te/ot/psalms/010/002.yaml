revisions:
- from: దుష్టుని అహంకారంలో పేదవాడు తీవ్రంగా తరుమబడుతున్నాడు[a]; తాము పన్నిన పన్నాగాల్లో వారే చిక్కుకుందురు గాక[b].
  to: దుష్టుని అహంకారం వల్ల పేదవాడు క్రూరంగా వెంటాడబడుతున్నాడు[a]; వారు తాము పన్నిన కుట్రల్లో చిక్కుకొనుగాక[b].
  rationale: ఈ స్వల్ప సవరణలు మూలంలోని సంక్షిప్తత, మొదటి పాదపు కర్త–కర్మ సందిగ్ధత, రెండవ పాదపు ఆకాంక్షార్థక/వివరణాత్మక సందిగ్ధతలను పాదసూచికల్లో నిలుపుతాయి. ప్రధాన పాఠంలో మాత్రం ఆధునిక ప్రామాణిక తెలుగుకు సహజమైన కారణార్థక వాక్యనిర్మాణం, వెంటాడింపును సూచించే సహజ క్రియ, మరియు కీర్తనకు తగిన ఆకాంక్షార్థక రూపం ఉపయోగించబడ్డాయి.
  reviewer_model: gpt-5.6-terra
