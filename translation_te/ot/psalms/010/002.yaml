id: PSA.10.2
reference: Psalms 10:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/גַאֲוַ֣ת רָ֭שָׁע יִדְלַ֣ק עָנִ֑י יִתָּפְשׂ֓וּ בִּ/מְזִמּ֖וֹת ז֣וּ חָשָֽׁבוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/002.yaml
  text: In the pride of the wicked[a], the poor man is hotly pursued[b]; let them be caught in the schemes they have devised.
translation:
  language: te
  text: దుష్టుని అహంకారం వల్ల పేదవాడు క్రూరంగా వెంటాడబడుతున్నాడు[a]; వారు తాము పన్నిన కుట్రల్లో చిక్కుకొనుగాక[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దుష్టుడు అహంకారంతో పేదవాణ్ణి క్రూరంగా వెంటాడుతున్నాడు.” హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా ఉంది; దుష్టుణ్ణి కర్తగా, పేదవాణ్ణి కర్మగా గ్రహించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారు తాము పన్నిన కుట్రల్లో చిక్కుకుంటారు.” హీబ్రూ క్రియారూపాన్ని ప్రార్థన లేదా ఆకాంక్షగా కాక, ఒక ప్రకటనగా కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּגַאֲוַת
  choice: అహంకారంలో
  rationale: בְּ ఉపసర్గ స్థితి, సాధనం, లేదా కారణాన్ని సూచించగలదు. ‘అహంకారంలో’ అనే సంక్షిప్త రూపం మూలంలోని భావసాంద్రతను నిలుపుతూ, దుష్టుని గర్వమే ఈ చర్యకు వాతావరణం లేదా ప్రేరణ అని సూచిస్తుంది.
- source_word: רָשָׁע
  choice: దుష్టుడు / దుష్టుని
  rationale: ఇది ఏకవచన నామవాచకంగా వాడిన విశేషణం; ఒక ప్రతినిధి దుష్ట వ్యక్తిని సూచిస్తుంది. వాక్యనిర్మాణానికి అనుగుణంగా షష్ఠీ రూపమైన ‘దుష్టుని’ వాడబడింది.
- source_word: יִדְלַק
  choice: తీవ్రంగా తరుమబడుతున్నాడు
  rationale: דלק కాలడం అనే మూలభావంతో పాటు వెంటబడి తరుమడం అనే భావాన్నీ ఇస్తుంది. ఈ సందర్భంలో పేదవానిపై జరిగే శత్రుత్వపూర్వక వెంటాడింపును ‘తీవ్రంగా తరుమబడుతున్నాడు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָנִי
  choice: పేదవాడు
  rationale: עָנִי పేదవానిని, బాధితుని, లేదా అణచివేయబడినవానిని సూచించగలదు. ఇక్కడ ఏకవచనాన్ని, సామాజిక బలహీనతను స్పష్టంగా ఉంచేందుకు ‘పేదవాడు’ ఎంచుకోబడింది.
- source_word: יִתָּפְשׂוּ
  choice: చిక్కుకుందురు గాక
  rationale: నిఫాల్ అసంపూర్ణ క్రియారూపాన్ని ఇక్కడ దుష్టులపై పలికే ఆకాంక్ష లేదా ప్రార్థనగా గ్రహించాం. ‘గాక’ ఆ ప్రార్థనాత్మక భావాన్ని గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בִּמְזִמּוֹת
  choice: పన్నాగాల్లో
  rationale: מְזִמּוֹת సందర్భానుసారం యోచనలు, కుట్రలు, లేదా దుష్ట పథకాలు. ఇక్కడ హానికరమైన ఉద్దేశాన్ని ‘పన్నాగాలు’ సహజంగా తెలియజేస్తుంది; בְּ భావాన్ని ‘ల్లో’ నిలుపుతుంది.
- source_word: זוּ חָשָׁבוּ
  choice: తాము పన్నిన
  rationale: זוּ సంబంధార్థక కణం; חָשָׁבוּ ఉద్దేశపూర్వకంగా ఆలోచించి రూపొందించడాన్ని సూచిస్తుంది. ‘తాము పన్నిన’ వారి స్వంత పన్నాగాల్లో వారే చిక్కే నైతిక ప్రతిఫల భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: మొదటి పాదంలోని సంక్షిప్త వాక్యనిర్మాణం
  choice: పేదవాడు తరుమబడుతున్నాడనే భావంతో కర్మణి వాక్యంగా అనువదించడం
  alternative: దుష్టుడు అహంకారంతో పేదవాణ్ణి తరుముతున్నాడనే కర్తరి వాక్యం
  rationale: హీబ్రూ పాదం సంక్షిప్తంగా ఉండి, దుష్టుణ్ణి కర్తగా మరియు పేదవాణ్ణి కర్మగా గ్రహించవచ్చు. ప్రధాన పాఠంలోని కర్మణి రూపం పేదవానిపై దృష్టిని ఉంచుతుంది; ప్రత్యామ్నాయ వాక్యనిర్మాణాన్ని పాదసూచికలో నిలిపాం.
- issue: రెండవ పాదంలోని క్రియారూప బలం
  choice: ‘చిక్కుకుందురు గాక’ అనే ప్రార్థనాత్మక లేదా ఆకాంక్షార్థక పఠనం
  alternative: ‘వారు చిక్కుకుంటారు/చిక్కుకున్నారు’ అనే వివరణాత్మక వాక్యం
  rationale: హీబ్రూ అసంపూర్ణ క్రియారూపం ఆకాంక్షను లేదా సాధారణ ప్రకటనను సూచించగలదు. కీర్తనలోని ప్రార్థనాత్మక ధోరణి, దుష్టులు తమ పన్నాగాల్లో తామే చిక్కాలనే నైతిక ప్రతిఫల భావం దృష్ట్యా ప్రధాన పాఠంలో ఆకాంక్షార్థక పఠనం తీసుకున్నాం; నిజమైన సందిగ్ధతను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించబడింది. ‘గాక’ సాధారణ సంభాషణలో అరుదైనా, కీర్తనలోని ప్రార్థనాత్మక ఆకాంక్షను సంక్షిప్తంగా మరియు గంభీరంగా వ్యక్తం చేసే సాహిత్య రూపంగా ఉంచబడింది.
