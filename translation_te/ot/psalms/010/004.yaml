id: PSA.10.4
reference: Psalms 10:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רָשָׁ֗ע כְּ/גֹ֣בַהּ אַ֭פּ/וֹ בַּל יִדְרֹ֑שׁ אֵ֥ין אֱ֝לֹהִ֗ים כָּל מְזִמּוֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/004.yaml
  text: In the pride of his face[a], the wicked man does not seek; all his thoughts are[b], “There is no God.”
translation:
  language: te
  text: తన ముఖంలోని గర్వం వల్ల[a] దుష్టుడు విచారించడు; అతని ఆలోచనలన్నిటిలో[b] “దేవుడు లేడు” అనేదే ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “తన ముక్కు/ముఖం యొక్క ఎత్తులో.” ఇది గర్వపూరితమైన ముఖభావాన్ని లేదా అహంకార వైఖరిని సూచించే నుడికారం.
    reason: cultural_note
  - marker: b
    text: లేదా, “అతని ఆలోచనలలో దేవునికి ఏమాత్రం స్థానం లేదు.” హెబ్రీని అతని ఆలోచనల విషయాన్ని నేరుగా ఉటంకించినట్లుగానూ, అతని ఆలోచనలన్నిటి నుండి దేవుడు లేనట్లుగానూ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: רָשָׁע
  choice: దుష్టుడు
  rationale: ఏకవచన పుంలింగ విశేషణం నామవాచకంగా వాడబడింది; వ్యక్తిగత చిత్రణతోపాటు ప్రతినిధి భావాన్ని నిలుపుతుంది.
- source_word: כְּגֹבַהּ אַפּוֹ
  choice: తన ముఖంలోని గర్వంతో
  rationale: గֹבַהּ ‘ఎత్తు/ఉన్నతి’, אַף అక్షరార్థంగా ‘ముక్కు/ముఖం’. ఇక్కడ కోపంకన్నా గర్వపూరిత ముఖభావం లేదా అహంకార వైఖరిని సూచిస్తుంది; ‘ముఖం’ మూలంలోని సజీవ రూపకాన్ని నిలుపుతుంది.
- source_word: בַּל יִדְרֹשׁ
  choice: దేవుణ్ణి వెదకడు
  rationale: కావ్యాత్మక నిషేధంతో కూడిన క్రియ అలవాటైన నిరాకరణను సూచిస్తుంది. కర్మ మూలంలో స్పష్టంగా లేకపోయినా, తరువాతి భాగంలోని ‘దేవుడు’ దానిని సందర్భపరంగా సూచిస్తుంది.
- source_word: אֵין אֱלֹהִים
  choice: దేవుడు లేడు
  rationale: అస్తిత్వాన్ని నిరాకరించే హెబ్రీ వ్యక్తీకరణ; దుష్టుని ఆలోచనలోని విషయంగా సహజంగా అనువదించబడింది.
- source_word: כָּל מְזִמּוֹתָיו
  choice: అతని ఆలోచనలన్నిటిలో ... అనేదే ఉంది
  rationale: מְזִמּוֹת ఆలోచనలు, పథకాలు, యోచనలు అనే అర్థాలు ఇవ్వగలదు. ఇక్కడ అతని మొత్తం ఆలోచనా ధోరణిని సూచించడానికి ‘ఆలోచనలు’ సరిపోతుంది.
theological_decisions:
- issue: చివరి పదబంధపు వాక్యనిర్మాణ సంబంధం
  choice: 'దుష్టుని ఆలోచనల విషయంగా: “దేవుడు లేడు”'
  alternative: అతని ఆలోచనలలో దేవునికి ఏమాత్రం స్థానం లేదు
  rationale: హెబ్రీ పదక్రమం ‘దేవుడు లేడు’ అనేది అతని ఆలోచనల విషయమని చదవడానికి అనుకూలిస్తుంది. అయితే దేవుడు అతని ఆలోచనలన్నిటిలో లేడనే పఠనం కూడా వ్యాకరణపరంగా సాధ్యమైనది; దానిని పాదసూచికలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన కావ్యభాష. మూలంలోని ‘ముఖం’ రూపకాన్ని నిలుపుతూ, చివరి భాగంలోని నిజమైన వాక్యనిర్మాణ సందిగ్ధతను పాదసూచికలో సంరక్షించాం.
