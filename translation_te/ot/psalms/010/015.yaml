revisions:
- from: దుష్టుడూ దుర్మార్గుడూ అయినవాని బాహువును విరిచివేయి[a]; అతని దుష్టత్వాన్ని వెదుకు—అది ఇక కనిపించనంతవరకు.
  to: దుష్టుని బాహువును విరిచివేయి; దుర్మార్గుని దుష్టత్వాన్ని వెదుకు—నీకు ఇక అది దొరకనంతవరకు.
  rationale: 'హీబ్రూ పదవిభజనకు అత్యంత సమీపమైన పఠనాన్ని ప్రధాన పాఠ్యంలో ఉంచాం: దుష్టుని బాహువును విరచడం, దుర్మార్గుని దుష్టత్వాన్ని వెదకడం. ఒకే వ్యక్తిని రెండు సమాంతర విశేషణాలతో వర్ణించే పఠనం సాధ్యమైనందున దానిని పాదటిప్పణిలో ఇచ్చాం. పాదటిప్పణిలోని తప్పు ‘రెండో వ్యక్తి’ వివరణను తొలగించాం. చివరి వాక్యభాగంలో దేవునికి ఉద్దేశించిన రెండవ పురుషాన్ని ‘నీకు’ ద్వారా వెల్లడించాం.'
  reviewer_model: gpt-5.6-terra
