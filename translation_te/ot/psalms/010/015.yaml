source:
  edition: WLC
  text: שְׁ֭בֹר זְר֣וֹעַ רָשָׁ֑ע וָ֝/רָ֗ע תִּֽדְרוֹשׁ רִשְׁע֥/וֹ בַל תִּמְצָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/015.yaml
  text: Break the arm of the wicked and evil man[a]; seek out his wickedness until you find none.
translation:
  language: te
  text: దుష్టుని బాహువును విరిచివేయి; దుర్మార్గుని దుష్టత్వాన్ని వెదుకు—నీకు ఇక అది దొరకనంతవరకు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁבֹר
  choice: విరిచివేయి
  rationale: ఇది దేవునికి చేసిన ప్రత్యక్ష ఆజ్ఞార్థక విన్నపం. మూలంలోని బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: זְרוֹעַ
  choice: బాహువు
  rationale: అక్షరార్థంగా ‘బాహువు’; సందర్భంలో అది దుష్టుని శక్తికి రూపకం. ఆ కవితాత్మక చిత్రాన్ని నైరూప్యమైన ‘శక్తి’గా మార్చకుండా నిలిపాం.
- source_word: רָשָׁע
  choice: దుష్టుడు
  rationale: దుష్ట వ్యక్తిని సూచించే విశేషణ-నామవాచకం. ఏకవచన ప్రతినిధి భావాన్ని నిలుపుతుంది.
- source_word: וָרָע
  choice: దుర్మార్గుడు
  rationale: రָשָׁעకు సమాంతరంగా వ్యక్తిని వర్ణించే రెండో పదంగా తీసుకున్నాం. దానిని కేవలం ‘చెడు’ అనే నైరూప్య భావంగా మార్చలేదు.
- source_word: תִּדְרוֹשׁ
  choice: వెదుకు
  rationale: דרשׁకు వెదకడం, విచారించడం, లెక్క అడగడం వంటి న్యాయసంబంధ ఛాయలు ఉండవచ్చు. ‘వెదుకు’ మూల క్రియను నేరుగా ప్రతిబింబిస్తూ, సందర్భంలోని తీర్పు భావాన్ని పాఠకుడు గ్రహించడానికి వీలు కల్పిస్తుంది.
- source_word: רִשְׁעוֹ
  choice: అతని దుష్టత్వం
  rationale: మూలంలోని వ్యక్తిగత ప్రత్యయాన్నీ, ‘దుష్టత్వం/అపరాధం’ అనే భావాన్నీ నిలుపుతుంది.
- source_word: בַל תִּמְצָא
  choice: అది ఇక కనిపించనంతవరకు
  rationale: దేవుని వెదకడం లేదా తీర్పు చివరికి దుష్టత్వం ఏదీ మిగలని ఫలితాన్ని సూచిస్తుంది; ‘వరకు’ అనే నిర్మాణం మూలంలోని సంబంధాన్ని అతిగా నిర్ధారించకుండా సహజంగా తెలుపుతుంది.
theological_decisions:
- issue: దుష్టుని ‘బాహువు’ అనే రూపకాన్ని ఎలా అనువదించాలి
  choice: ప్రధాన పాఠ్యంలో ‘బాహువు’ అనే స్పష్టమైన శరీర రూపకాన్ని నిలుపడం
  alternative: ‘శక్తి’ లేదా ‘బలం’ అని నైరూప్యంగా అనువదించడం
  rationale: విన్నపం దుష్టుడు హాని చేసే సామర్థ్యాన్ని దేవుడు నిర్వీర్యం చేయాలని కోరుతుంది. అయితే హీబ్రూ కవితా చిత్రాన్ని నిలపడం వల్ల అర్థాన్ని ముందుగానే పరిమితం చేయము.
- issue: בַל תִּמְצָא అనే చివరి పదబంధ సంబంధం
  choice: ‘అది ఇక కనిపించనంతవరకు’
  alternative: ‘అది కనిపించకుండా ఉండేలా’ లేదా ‘వెదికినా అది కనిపించదు’
  rationale: దుష్టత్వాన్ని దేవుడు పూర్తిగా విచారించి పరిష్కరించిన ఫలితంగా ఇక ఏదీ మిగలకపోవాలనే ప్రార్థనను ఇది తెలియజేస్తుంది. దుష్టుని నిర్మూలన అని అతిగా వ్యాఖ్యానించదు.
- issue: רָשָׁע మరియు וָרָע ఒకే వ్యక్తికి వర్తిస్తాయా, వేర్వేరు వ్యక్తులకా
  choice: ఒకే వ్యక్తిని రెండు సమాంతర విశేషణాలతో వర్ణించడం
  alternative: ‘దుష్టుని బాహువును విరిచివేయి; దుర్మార్గుని దుష్టత్వాన్ని వెదుకు’ అని రెండు నామవాచక పదబంధాలుగా విభజించడం
  rationale: హీబ్రూ నిర్మాణం రెండవ పదాన్ని సమాంతర విశేషణ-నామవాచకంగా అనుమతిస్తుంది. ప్రధాన పాఠ్యం ఒకే వ్యక్తిపై వర్తించే సహజమైన తెలుగు నిర్మాణాన్ని ఉపయోగిస్తుంది; ప్రత్యామ్నాయ విభజనను పాదటిప్పణిలో నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనాత్మక కవిత్వానికి తగిన గంభీరతతో, సాధారణ పాఠకుడికి అర్థమయ్యే పదజాలం. ‘బాహువు’ కవితాత్మక రూపకాన్ని నిలుపుతుంది; మిగతా వాక్య నిర్మాణం సహజంగా, సంక్షిప్తంగా ఉంచబడింది.
