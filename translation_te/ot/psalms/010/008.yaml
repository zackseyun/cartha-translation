  text: He sits in ambush in the villages[a]; in the hiding places he murders the innocent[b]; his eyes watch for the helpless.
translation:
  language: te
  text: 'అతడు గ్రామాల్లో[a] మాటువేసి కూర్చుంటాడు;


    మరుగైన చోట్ల నిర్దోషిని హత్య చేస్తాడు;


    అతని కళ్లు నిస్సహాయుని కోసం పొంచి చూస్తాయి.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “గ్రామాలు” అనే పదాన్ని “పల్లెలు” లేదా “జనావాసాలు” అని కూడా అనువదించవచ్చు; ఇక్కడ “ఆవరణలు” లేదా “ప్రాంగణాలు” అనే అర్థం వచ్చే అవకాశం తక్కువ.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అతని కళ్లు నిస్సహాయుని కోసం పొంచి ఉంటాయి.” చివరి వాక్యభాగం నుడికారపూర్వకమైనది, అర్థనిర్ణయం కష్టమైనది. హెబ్రీ క్రియకు మరింత అక్షరార్థంగా దాగడం లేదా పొంచి ఉండడం అనే భావం ఉంది; అయితే “కళ్లు”తో కలిసి అది బలహీనమైన బాధితుని రహస్యంగా గమనించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב בְּמַאְרַב
  choice: మాటువేసి కూర్చుంటాడు
  rationale: יֵשֵׁב యొక్క ‘కూర్చుంటాడు’ అనే స్పష్టమైన చిత్రాన్ని నిలుపుతూ, בְּמַאְרַב సూచించే దాగి దాడి చేయడానికి వేచివుండే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חֲצֵרִים
  choice: గ్రామాల్లో
  rationale: ఈ సందర్భంలో ఈ బహువచన పదం జనావాసాలైన గ్రామాలు లేదా చిన్న పల్లెలను సూచించడం అత్యంత సహజం; హెబ్రీ ఉపసర్గలోని ‘లో’ అనే భావాన్ని కూడా నిలుపుతుంది.
- source_word: בַּמִּסְתָּרִים
  choice: రహస్య స్థలాల్లో
  rationale: దాగివుండగల అనేక మరుగు ప్రదేశాల concrete plural భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: יַהֲרֹג נָקִי
  choice: నిర్దోషిని హత్య చేస్తాడు
  rationale: క్రియ ప్రాథమికంగా ‘చంపడం’ అని అర్థమైనా, నిర్దోషియే బాధితుడు మరియు సందర్భం ఉద్దేశపూర్వకమైన దోపిడీ హింసను చిత్రిస్తుంది; అందుచేత ‘హత్య చేస్తాడు’ సముచితం.
- source_word: עֵינָיו
  choice: అతని కళ్లు
  rationale: మూలంలోని సజీవమైన శరీరాంగ చిత్రణను నేరుగా నిలుపుతుంది.
- source_word: לְחֵלְכָה
  choice: నిస్సహాయుని కోసం
  rationale: అర్థనిర్ణయం కష్టమైన ఈ పదం ఇక్కడ దాడికి గురయ్యే బలహీనమైన, దురవస్థలో ఉన్న వ్యక్తిని సూచిస్తుంది; ‘నిస్సహాయుడు’ సందర్భానికి సరిపోతుంది.
- source_word: יִצְפֹּנוּ
  choice: పొంచి చూస్తాయి
  rationale: ఈ రూపం అక్షరార్థంగా దాగడం లేదా మరుగుపడడాన్ని సూచించినా, ‘కళ్లు’తో కలిసి రహస్యంగా బాధితుని గమనించే భావాన్ని ఇస్తుంది. ‘పొంచి చూస్తాయి’ ఆ దాడి ఉద్దేశంతో కూడిన నిఘాను వ్యక్తం చేస్తుంది.
