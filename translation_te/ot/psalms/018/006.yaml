  to: 'నా ఆపదలో నేను యాహ్వేకు మొరపెడతాను;

    నా దేవునికి సహాయం కోసం మొరపెడతాను.


    ఆయన తన ఆలయం[b] నుండి నా స్వరం వింటాడు[a];

    నా మొర ఆయన ఎదుటకు వచ్చి ఆయన చెవులకు చేరుతుంది.'
  rationale: 'The revision retains the draft’s sound rendering choices while improving the plea-for-help register and restoring the Hebrew syntax and imagery in the final line: the psalmist’s cry comes before God and reaches his ears. Footnote a is clarified to preserve the legitimate future-force reading of the Hebrew imperfects without overstating a Telugu tense contrast.'
