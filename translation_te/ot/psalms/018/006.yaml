  text: In my distress I call on Yahweh[a], and to my God I cry for help. He hears my voice from his temple[b], and my cry before him comes into his ears.
translation:
  language: te
  text: 'నా ఆపదలో నేను యాహ్వేకు మొరపెడతాను;

    నా దేవునికి సహాయం కోసం మొరపెడతాను.


    ఆయన తన ఆలయం[b] నుండి నా స్వరం వింటాడు[a];

    నా మొర ఆయన ఎదుటకు వచ్చి ఆయన చెవులకు చేరుతుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ అసంపూర్ణ క్రియారూపాలకు భవిష్యత్ భావం కూడా ఉండవచ్చు. అందువల్ల, సందర్భానుసారం ‘ఆయన తన ఆలయం నుండి నా స్వరాన్ని వింటాడు; నా మొర ఆయన ఎదుటకు వచ్చి ఆయన చెవులకు చేరుతుంది’ అనే మాటలను భవిష్యత్తులో జరిగే చర్యగా కూడా గ్రహించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘ఆలయం’ అనే పదాన్ని ‘రాజభవనం’ లేదా ‘పవిత్రస్థలం’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం రాజు నివాసాన్నీ దేవుని నివాసాన్నీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לִי
  choice: నా ఆపదలో
  rationale: צַר అనేది ఇరుకు, కష్టం, ఆపద అనే భావాలను ఇస్తుంది; לִי దానిని కీర్తనకర్తకు వ్యక్తిగతమైన ఆపదగా చూపుతుంది. ‘నా ఆపదలో’ సహజమైన, గంభీరమైన తెలుగు.
- source_word: אֶקְרָא יְהוָה
  choice: నేను యాహ్వేకు మొరపెడతాను
  rationale: קרא ఇక్కడ దేవుని సహాయం కోరుతూ పిలవడాన్ని సూచిస్తుంది. ‘మొరపెడతాను’ ప్రార్థనాత్మక పిలుపును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: וְאֶל־אֱלֹהַי אֲשַׁוֵּעַ
  choice: నా దేవునికి సహాయం కోసం కేక వేస్తాను
  rationale: שׁוע పీయేల్ రూపం సహాయం కోసం గట్టిగా మొరపెట్టడాన్ని సూచిస్తుంది; దిశాసూచక אֶל భావాన్ని ‘నా దేవునికి’ నిలుపుతుంది.
- source_word: יִשְׁמַע
  choice: వింటాడు
  rationale: హీబ్రూ అసంపూర్ణ క్రియారూపం సందర్భంలో వర్తమాన లేదా భవిష్యత్ బలాన్ని కలిగి ఉండవచ్చు. ప్రధాన పాఠంలో సజీవ వర్తమాన భావాన్ని తీసుకుని, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: מֵהֵיכָלוֹ
  choice: తన ఆలయం నుండి
  rationale: הֵיכָל ఆలయం, రాజభవనం లేదా పవిత్ర నివాసాన్ని సూచించగలదు. దేవుని నివాస సందర్భంలో ‘ఆలయం’ స్పష్టమైన ప్రధాన ఎంపిక; ఇతర భావాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: קוֹלִי
  choice: నా స్వరం
  rationale: קוֹל ప్రార్థన సందర్భంలో వ్యక్తి పలికే స్వరాన్ని సూచిస్తుంది; ‘నా స్వరం’ రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: וְשַׁוְעָתִי לְפָנָיו
  choice: ఆయన సన్నిధిలోని నా మొర
  rationale: שַׁוְעָה సహాయం కోసం చేసే మొర; לְפָנָיו అక్షరార్థంగా ‘ఆయన ముఖం ఎదుట’ అని ఉండి, సహజ తెలుగులో ‘ఆయన సన్నిధిలో’గా వ్యక్తమవుతుంది.
- source_word: תָּבוֹא בְאָזְנָיו
  choice: ఆయన చెవులకు చేరుతుంది
  rationale: ‘ఆయన చెవుల్లోకి వస్తుంది’ అనే హీబ్రూ శరీరావయవ రూపకాన్ని సహజ తెలుగులో ‘చెవులకు చేరుతుంది’గా నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతుంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: יִשְׁמַע మరియు תָּבוֹא క్రియల కాలబలం
  choice: 'సజీవ వర్తమాన భావం: ‘వింటాడు … చేరుతుంది’'
  alternative: 'భవిష్యత్ భావం: ‘వింటాడు … చేరుతుంది’ అని వాగ్దానాత్మకంగా గ్రహించడం; సందర్భానుసారం ‘విననున్నాడు … చేరనున్నది’ అని స్పష్టీకరించవచ్చు'
  rationale: కావ్యంలోని హీబ్రూ అసంపూర్ణ రూపాలు వర్తమాన/అలవాటైన చర్యను గానీ భవిష్యత్ నిరీక్షణను గానీ సూచించవచ్చు. ప్రధాన పాఠం కాలాన్ని అతిగా నిర్దిష్టం చేయని సహజ తెలుగు రూపాన్ని వాడుతుంది; భవిష్యత్ బలాన్ని పాదసూచిక తెలియజేస్తుంది.
- issue: הֵיכָל ద్వారా సూచించబడే దేవుని నివాసం
  choice: ఆలయం
  alternative: రాజభవనం; పవిత్రస్థలం
  rationale: పదం రాజు నివాసాన్నీ దేవుని పవిత్ర నివాసాన్నీ సూచించగలదు. ‘ఆలయం’ సందర్భానికి అనుకూలమైన ప్రధాన ఎంపిక అయినా, పరలోక రాజప్రాసాద భావాన్ని తొలగించకుండా ప్రత్యామ్నాయాలు సూచించబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన ప్రార్థనా శైలి వాడబడింది. హీబ్రూ కవితా సమాంతరత కోసం ‘మొరపెడతాను / కేక వేస్తాను’ మరియు ‘నా స్వరం / నా మొర’ జంటలు నిలుపబడ్డాయి. దేవుని వినికిడిని తెలిపే మానవరూపకమైన ‘చెవులకు చేరుతుంది’ కూడా సంరక్షించబడింది.
