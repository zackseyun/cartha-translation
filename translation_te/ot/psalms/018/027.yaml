    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి మాటకు కారణాన్ని లేదా వివరణను పరిచయం చేసే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אַתָּה
  choice: నీవు
  rationale: దేవుణ్ణి ఉద్దేశించిన ఏకవచన సంబోధన. హీబ్రూలోని ఉద్ఘాటనను తెలుగు వాక్యనిర్మాణం సహజంగా మోస్తుంది.
- source_word: עַם עָנִי
  choice: బాధల్లో ఉన్న ప్రజలను
  rationale: עָנִי పేదరికం, బాధ, అణగారిన స్థితి లేదా దీనత్వాన్ని సూచించగలదు. రక్షణ సందర్భంలో ‘బాధల్లో ఉన్న’ ప్రధాన భావాన్ని స్పష్టంగా ఉంచి, దాన్ని కేవలం ఆర్థిక పేదరికానికో అంతరంగ వినయానికో పరిమితం చేయదు.
- source_word: תוֹשִׁיעַ
  choice: రక్షిస్తావు
  rationale: దేవుడు అపాయం లేదా బాధ నుంచి విడిపించే విశాలమైన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְ
  choice: కానీ
  rationale: మూలంలో సాధారణ సంధి ఉన్నప్పటికీ, కవితా సమాంతరంలో బాధితులను రక్షించడం మరియు గర్విష్ఠులను దిగజార్చడం మధ్య వ్యతిరేకత ఉంది.
- source_word: עֵינַיִם רָמוֹת
  choice: ఎత్తైన కళ్లను
  rationale: అక్షరార్థ చిత్రాన్ని నిలుపుతూ, గర్వం లేదా అహంకారాన్ని సూచించే హీబ్రూ నుడికారాన్ని పాదటిప్పణితో వివరిస్తుంది.
- source_word: תַּשְׁפִּיל
  choice: దించుతావు
  rationale: ‘తక్కువ చేయడం/దిగజార్చడం’ అనే స్పష్టమైన స్థలచిత్రాన్ని నిలిపి, ‘ఎత్తైన’ అనే పదంతో ఉన్న వ్యతిరేకతను కాపాడుతుంది.
theological_decisions:
- issue: עָנִי యొక్క భావపరిధి
  choice: బాధల్లో ఉన్న ప్రజలు
  alternative: పేద ప్రజలు; దీనులైన ప్రజలు
  rationale: దేవుని రక్షణ అనే సందర్భంలో బాధిత స్థితి ప్రధానంగా కనిపిస్తుంది; అయినా ఆ పదంలోని ఆర్థిక పేదరికం, అణగారిన స్థితి, దీనత్వం వంటి సాధ్యమైన భావాలను పాదటిప్పణి ద్వారా తెరిచి ఉంచాం.
- issue: עֵינַיִם רָמוֹת అనే నుడికారం
  choice: ఎత్తైన కళ్లు
  alternative: గర్విష్ఠులు; అహంకారపు చూపులు
  rationale: మూల చిత్రాన్ని అనువాదంలో నిలిపి, అది గర్వం లేదా అహంకారాన్ని సూచించే నుడికారం అని పాదటిప్పణిలో తెలియజేయడం ద్వారా కవితా ఉద్వేగాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే కవితా శైలి. ‘ఎత్తైన కళ్లు’ అనే మూలభాషా చిత్రాన్ని ఉద్దేశపూర్వకంగా నిలిపి పాదటిప్పణిలో వివరించాం.
