    text: లేదా ‘పేద ప్రజలను,’ ‘దీనులైన ప్రజలను.’ హీబ్రూ పదం ఆర్థిక పేదరికాన్ని, బాధను, అణగారిన స్థితిని లేదా దీనత్వాన్ని సూచించగలదు.
