  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా ధోరణి పాటించబడింది. హీబ్రూ సమాంతర నిర్మాణం, శత్రువులను ధూళిగా నలిపి బురదలా పారబోసే తీవ్రమైన చిత్రాలు నిలుపబడ్డాయి; అస్పష్టమైన క్రియార్థాలకు పాదసూచికల్లో ప్రత్యామ్నాయాలు ఇచ్చాం.
