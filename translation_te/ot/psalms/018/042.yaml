  text: I beat them fine like dust before the wind[c][b][a]; like mud in the streets I poured them out.
translation:
  language: te
  text: గాలికి ఎగిరిపోయే ధూళిలా వారిని నూరివేశాను[a]; వీధుల బురదలా వారిని పారబోశాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని చూర్ణం చేశాను.” అక్షరార్థంగా, “గాలి ముఖం మీద ధూళిలా”; ఈ ప్రయోగం గాలిచేత ధూళి చెదరిపోవు చిత్రాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వీధుల బురదలా వారిని కుమ్మరించాను” లేదా “ఖాళీ చేశాను.” హీబ్రూ క్రియకు కుమ్మరించడం, ఖాళీ చేయడం అనే భావాలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶשְׁחָקֵם
  choice: వారిని నలిపివేశాను
  rationale: שׁחק క్రియ ఇక్కడ శత్రువులను ధూళిగా అయ్యేంతగా నలిపివేయడం లేదా పొడిచేయడం అనే భావాన్ని ఇస్తుంది. సహజమైన ఆధునిక తెలుగులో ఆ తీవ్రతను ‘నలిపివేశాను’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: כְּעָפָר
  choice: ధూళిలా
  rationale: עָפָר సాధారణంగా ధూళి లేదా మెత్తని మట్టిని సూచిస్తుంది; గాలి చెదరగొట్టే చిత్రానికి ‘ధూళి’ సహజంగా సరిపోతుంది.
- source_word: עַל־פְּנֵי רוּחַ
  choice: గాలి ముందు
  rationale: అక్షరార్థంగా ‘గాలి ముఖం మీద’ అనే హీబ్రూ ప్రయోగం. గాలికి కొట్టుకుపోయే ధూళి భావాన్ని కాపాడుతూ ‘గాలి ముందు’ మూల నిర్మాణానికి దగ్గరగా, తెలుగులో గ్రాహ్యంగా ఉంటుంది.
- source_word: כְּטִיט חוּצוֹת
  choice: వీధుల్లోని బురదలా
  rationale: טִיט అంటే బురద లేదా ఊబి; חוּצוֹת ఇక్కడ వీధులను సూచిస్తుంది. ఈ ఎంపిక అవమానకరంగా తొక్కబడే వీధి బురద చిత్రాన్ని సహజంగా నిలుపుతుంది.
- source_word: אֲרִיקֵם
  choice: వారిని పారబోశాను
  rationale: ריק యొక్క హిఫీల్ రూపం ఖాళీ చేయడం లేదా కుమ్మరించడం అనే భావాన్ని కలిగిస్తుంది. బురదను వీధిలో పారబోసే ఉపమానంతో ‘పారబోశాను’ చక్కగా సరిపోతుంది.
