source:
  edition: WLC
  text: כִּֽי בְ֭/ךָ אָרֻ֣ץ גְּד֑וּד וּ֝/בֵֽ/אלֹהַ֗/י אֲדַלֶּג שֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/029.yaml
  text: For by you I can run against a troop[b][a], and by my God I can leap over a wall.
translation:
  language: te
  text: ఎందుకంటే, నీ ద్వారా నేను ఒక దండు మీదికి దూసుకెళ్లగలను[a]; నా దేవుని ద్వారా నేను ప్రాకారాన్ని ఎగిరి దాటగలను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ ద్వారా నేను ఒక దోపిడీ దండు మీదికి దూసుకెళ్తాను.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నా దేవుని ద్వారా నేను ఒక గోడను ఎగిరి దాటగలను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: చుట్టుపక్కల ఉన్న స్తుతి, సాక్ష్యానికి కారణాన్ని లేదా వివరణను పరిచయం చేస్తుంది.
- source_word: בְךָ
  choice: నీ వల్ల
  rationale: ఇక్కడ ב సాధనం లేదా శక్తినిచ్చే కారణాన్ని సూచిస్తుంది; దేవుని సహాయంతో సాధ్యమవుతుందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אָרֻץ
  choice: నేను ... పరుగెత్తగలను
  rationale: רוץ అనే మూలపదంలోని ‘పరుగెత్తు’ చిత్రాన్ని నిలుపుతూ, సైనిక సందర్భంలో ప్రత్యర్థి దండుమీదికి దూసుకెళ్లే భావాన్ని సందర్భం ద్వారా వ్యక్తం చేస్తుంది.
- source_word: גְּדוּד
  choice: దండు
  rationale: సైనికుల గుంపు లేదా దోపిడీ దండును సూచించే విస్తృత పదం; పరిమాణాన్ని ‘సైన్యం’ అని అతిశయింపకుండా సైనిక భావాన్ని నిలుపుతుంది.
- source_word: וּבֵאלֹהַי
  choice: నా దేవుని వల్ల
  rationale: మొదటి పాదంలోని సాధనార్థక నిర్మాణంతో సమాంతరతను కాపాడుతూ, వ్యక్తిగతమైన ‘నా దేవుడు’ అనే ఒప్పుకోలును నిలుపుతుంది.
- source_word: אֲדַלֶּג
  choice: నేను ... దాటగలను
  rationale: דלג అంటే ఎగిరి దాటడం; తెలుగులో ప్రాకారాన్ని అధిగమించే భావాన్ని సహజంగా అందించేందుకు ‘దాటగలను’ వాడి, పాదటిప్పణిలో స్పష్టమైన ‘ఎగిరి’ భావాన్ని సూచించాం.
- source_word: שׁוּר
  choice: ప్రాకారం
  rationale: సైనిక సందర్భంలోని రక్షణ గోడను సూచిస్తుంది; సాధారణ ‘గోడ’ కంటే ఇక్కడి కోట రక్షణ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: వచనంలోని సైనిక చిత్రణ స్వభావం
  choice: దేవుడు శక్తినిచ్చాడనే దావీదు సాక్ష్యంగా స్పష్టమైన సైనిక చిత్రణను నిలుపడం
  alternative: జీవితంలోని సాధారణ ఆటంకాలను అధిగమించడం అని రూపకాలుగా అనువదించడం
  rationale: హీబ్రూ పాఠంలో ‘దండు,’ ‘ప్రాకారం’ అనే స్పష్టమైన యుద్ధపరమైన పదాలు ఉన్నాయి. అందువల్ల వాటిని ఆధ్యాత్మికీకరించకుండా చారిత్రక-కావ్య చిత్రణను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన కావ్యశైలిని వాడాం. రెండు పాదాల్లో ‘వల్ల ... గలను’ అనే సమాంతర నిర్మాణాన్ని నిలిపాం; మూలంలోని సైనిక చిత్రణను మృదువుచేయలేదు.
