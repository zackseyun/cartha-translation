  edition: WLC
  text: וַ/יֵּ֤רָא֨וּ אֲפִ֥יקֵי מַ֗יִם וַֽ/יִּגָּלוּ֮ מוֹסְד֪וֹת תֵּ֫בֵ֥ל מִ/גַּעֲרָ֣תְ/ךָ֣ יְהוָ֑ה מִ֝/נִּשְׁמַ֗ת ר֣וּחַ אַפֶּֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/015.yaml
  text: Then the channels of the waters were seen[a], and the foundations of the world were laid bare, at your rebuke, O Yahweh[c][b], at the blast of the breath of your nostrils.
translation:
  language: te
  text: 'అప్పుడు జలాల ప్రవాహమార్గాలు కనిపించాయి[a],


    లోకపు పునాదులు బయల్పడ్డాయి[b]—


    యాహ్వే, నీ గద్దింపువల్ల,


    నీ నాసికల ఊపిరిగాలి వల్ల[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నదీగర్భాలు’ లేదా ‘నీటి ప్రవాహమార్గాలు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘భూమి పునాదులు.’
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా, ‘నీ నాసికల ఊపిరిగాలి వల్ల.’ ఇది యాహ్వే ఊపిరి యొక్క ప్రబల శక్తిని సజీవమైన మానవరూప చిత్రణతో వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָאוּ
  choice: కనిపించాయి
  rationale: נפעל రూపంలోని ‘కంటికి కనిపించాయి/దృశ్యమయ్యాయి’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֲפִיקֵי מַיִם
  choice: జలప్రవాహాల మార్గాలు
  rationale: אֲפִיקִים అనే పదానికి ప్రవాహమార్గాలు, నీటి కాలువలు లేదా నదీగర్భాలు అనే అర్థాలు ఉండవచ్చు. మూలంలోని ‘జలాలు’ అనే విస్తృత భావాన్ని నిలుపుతూ ఈ ఎంపిక సహజంగా ఉంది.
- source_word: וַיִּגָּלוּ
  choice: బయల్పడ్డాయి
  rationale: కప్పబడి ఉన్నవి బలంగా బహిర్గతమైన దృశ్యాన్ని తెలియజేస్తుంది.
- source_word: מוֹסְדוֹת תֵּבֵל
  choice: లోకపు పునాదులు
  rationale: מוֹסְדוֹת అంటే పునాదులు; תֵּבֵל అంటే క్రమబద్ధమైన లోకం లేదా భూమి. ‘లోకం’ మూలపదపు విస్తృతిని నిలుపుతుంది.
- source_word: מִגַּעֲרָתְךָ
  choice: నీ గద్దింపువల్ల
  rationale: מִן ఇక్కడ కారణాన్ని సూచిస్తుంది; దేవుని గద్దింపు ఫలితంగా జరిగినదని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: బిరుదుతో భర్తీ చేయకుండా హీబ్రూ దైవనామాన్ని తెలుగు లిపిలో ప్రతిలిపి చేస్తుంది.
- source_word: מִנִּשְׁמַת רוּחַ אַפֶּךָ
  choice: నీ నాసికల నుంచి వెలువడిన ఊపిరి వీచికవల్ల
  rationale: נְשָׁמָה, רוּחַ పదాల్లోని ఊపిరి/గాలి బలాన్ని, אַף లోని నాసిక అనే మానవరూప వర్ణనను సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా, సాధారణంగా పునర్నిర్మించిన ఉచ్చారణకు అనుగుణంగా ‘యాహ్వే’ అని ప్రతిలిపి చేయబడింది.
- issue: దేవుని నాసికల ఊపిరి అనే మానవరూప చిత్రణ
  choice: నీ నాసికల నుంచి వెలువడిన ఊపిరి వీచిక
  alternative: నీ కోపాగ్ని; నీ శ్వాస
  rationale: కేవలం ‘కోపం’గా భావార్థం చేయకుండా, మూలంలోని ఉద్దేశపూర్వకమైన మానవరూప, తుఫాను-సంబంధిత చిత్రణను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని ఉపయోగించాం. హీబ్రూ సమాంతర నిర్మాణాన్ని, కారణాన్ని తెలిపే చివరి పాదాలను, విశ్వవ్యాప్త ప్రకృతి దృశ్యాన్ని సాధ్యమైనంతవరకు నిలిపాం. సాధారణ పాఠకునికి అర్థమయ్యే పదాలను ఎంచుకుంటూనే మూలంలోని అస్పష్టతలను పాదటిప్పణుల్లో ఉంచాం.
