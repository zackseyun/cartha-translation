translation:
  language: te
  text: 'ఎందుకంటే నీవే నా దీపాన్ని వెలిగిస్తావు[a];

    యాహ్వే, నా దేవుడు, నా చీకటిని ప్రకాశింపజేస్తాడు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా దీపాన్ని ప్రకాశింపజేస్తావు.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘నా చీకటి’; ఇది శ్రమ, ప్రమాదం లేదా దిగులును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఈ పదం చుట్టుపక్కల ఉన్న స్తుతి లేదా నమ్మకానికి కారణాన్ని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ‘ఎందుకంటే’ ఆ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: תָּאִיר
  choice: వెలిగిస్తావు
  rationale: హిఫీల్ రూపంలోని కారణార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, దీపం అనే స్పష్టమైన రూపకాన్ని నిలుపుతుంది.
- source_word: נֵרִי
  choice: నా దీపాన్ని
  rationale: נֵר అనే పదానికి అక్షరార్థం ‘దీపం’; దానిని ‘వెలుగు’గా అమూర్తీకరించకుండా మూలంలోని దృశ్యరూపకాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరంగా గుర్తించదగిన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: אֱלֹהַי
  choice: నా దేవుడైన
  rationale: మొదటి పురుష ఏకవచన స్వామ్య సంబంధాన్ని సహజమైన తెలుగు నామవాచక నిర్మాణంలో నిలుపుతుంది.
- source_word: יַגִּיהַּ
  choice: వెలిగిస్తాడు
  rationale: ‘ప్రకాశింపజేయడం, వెలుగు కలిగించడం’ అనే కారణార్థాన్ని స్పష్టంగా తెలుపుతుంది; మొదటి పాదంతో ఉన్న కవితాత్మక సమాంతరతను కూడా కాపాడుతుంది.
- source_word: חָשְׁכִּי
  choice: నా చీకటిని
  rationale: మొదటి పురుష ప్రత్యయంతో ఉన్న ‘నా చీకటి’ అనే మూల రూపకాన్ని యథాతథంగా ఉంచి, అది కష్టం, ప్రమాదం లేదా దిగులును సూచిస్తుందా అనే భావవ్యాప్తిని తెరిచి ఉంచుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా పేరుగా నిలుపడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: ‘నా చీకటి’ అనే రూపకానికి అర్థం
  choice: రూపకాన్ని ‘నా చీకటి’గానే నిలుపడం
  alternative: నా కష్టాలు / నా దిగులు / నన్ను చుట్టుముట్టిన చీకటి
  rationale: సందర్భంలో ఈ రూపకం బాధ, ప్రమాదం, నిరాశ వంటి అనేక భావాలను కలిగి ఉండవచ్చు; వాటిలో ఒక్కదానికే పరిమితం చేయడం మూలంలోని ఉద్దేశపూర్వక విస్తృతిని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన కవితా శైలి ఉపయోగించబడింది. మొదటి పాదంలోని రెండవ పురుష సంబోధనను, రెండవ పాదంలోని మూడవ పురుష నామవాచక నిర్మాణాన్ని మూలానికి అనుగుణంగా నిలుపుతూ, రెండు పాదాల సమాంతరతను స్పష్టంగా ఉంచాం.
