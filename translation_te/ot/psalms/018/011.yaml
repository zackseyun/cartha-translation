source:
  edition: WLC
  text: יָ֤שֶׁת חֹ֨שֶׁךְ סִתְר֗/וֹ סְבִֽיבוֹתָ֥י/ו סֻכָּת֑/וֹ חֶשְׁכַת מַ֝֗יִם עָבֵ֥י שְׁחָקִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/011.yaml
  text: He made darkness his hiding place[a], around him his shelter—dark waters[c][b], thick clouds of the skies.
translation:
  language: te
  text: 'ఆయన చీకటిని తన మరుగుస్థలంగా[a] చేసుకున్నాడు;

    తన చుట్టూ ఉన్న ఆయన ఆశ్రయం[b]—జలాల చీకటి, ఆకాశంలోని దట్టమైన మేఘాలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన రహస్య స్థలంగా.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తన కప్పుదలగా,’ ‘తన పందిరిగా,’ లేదా ‘తన గుడారంగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֶׁת
  choice: చేసుకున్నాడు / ఉంచుకున్నాడు
  rationale: కావ్య సందర్భంలో ‘నియమించాడు, ఉంచాడు’ అనే భావం. మొదటి పాదంలో సహజమైన తెలుగుకోసం ‘చేసుకున్నాడు’, రెండవ పాదంలో స్థాపించే భావాన్ని నిలుపుటకు ‘ఉంచుకున్నాడు’ వాడాం.
- source_word: חֹשֶׁךְ
  choice: చీకటి
  rationale: తుఫాను-దైవప్రత్యక్షతలోని ప్రత్యక్ష వాతావరణ చిత్రాన్ని నిలుపుతుంది; నైతిక దుష్టత్వం అనే భావాన్ని చేర్చదు.
- source_word: סִתְרוֹ
  choice: తన మరుగుస్థలం
  rationale: దాగి ఉండే స్థలం అనే స్థానార్థాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: סְבִיבוֹתָיו
  choice: తన చుట్టూ
  rationale: మూలంలోని ప్రాదేశిక చిత్రాన్ని సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: סֻכָּתוֹ
  choice: తన ఆశ్రయం
  rationale: గుడారం లేదా పందిరి అనే నిర్దిష్ట రూపానికే పరిమితం చేయకుండా, కప్పి ఉంచే తాత్కాలిక ఆశ్రయం అనే సందర్భోచిత భావాన్ని ఇస్తుంది.
- source_word: חֶשְׁכַת מַיִם
  choice: జలాంధకారం
  rationale: ‘నీళ్ల చీకటి’ అనే అసహజ నిర్మాణాన్ని తప్పిస్తూ, జలాల చీకటి/చీకటి జలాలు అనే హీబ్రూ కావ్య సాంద్రతను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: עָבֵי שְׁחָקִים
  choice: ఆకాశంలోని దట్టమైన మేఘాలు
  rationale: עָבִים యొక్క దట్టత్వాన్ని, שְׁחָקִים యొక్క కావ్యాత్మక ఆకాశార్థాన్ని సాధారణ పాఠకుడికి స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: చీకటి దేవుని చుట్టూ మరుగును కలిగించే తుఫాను-దైవప్రత్యక్షత చిత్రమా, లేక నైతిక/తీర్పు సంకేతమా?
  choice: దేవుని చుట్టూ ఉన్న కావ్యాత్మక మరుగు మరియు తుఫాను చిత్రంగా సూటిగా అనువదించాం.
  alternative: చీకటిని తీర్పు లేదా నైతిక దుష్టత్వానికి సంకేతంగా వ్యాఖ్యానించడం.
  rationale: హీబ్రూ పాఠం దట్టమైన మేఘాలు, జలాంధకారం, చుట్టుముట్టే ఆశ్రయం అనే సమాంతర తుఫాను చిత్రాలను ఇస్తుంది; అంతకు మించిన సిద్ధాంతార్థాన్ని స్పష్టంగా పేర్కొనదు.
- issue: סֻכָּה అనే పదాన్ని ఆరాధనా గుడారం భావంతో అనువదించాలా?
  choice: సందర్భానుగుణంగా ‘ఆశ్రయం’ అని అనువదించాం.
  alternative: ‘గుడారం’, ‘పందిరి’ లేదా ‘నివాసగుడారం’ అని అనువదించడం.
  rationale: మూలపదంలోని కప్పుదల/ఆశ్రయ భావాన్ని నిలుపుతూ, పాఠ్యంలో స్పష్టంగా లేని ఆరాధనా వ్యవస్థకు సంబంధించిన సూచనను చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కావ్య ధోరణి. మొదటి పురుష సంబంధరూపాలను తెలుగులో సహజంగా ‘తన’తో వ్యక్తం చేశాం. హీబ్రూ సమాంతర నిర్మాణాన్ని రెండు పాదాలుగా నిలిపి, ‘జలాంధకారం’ ద్వారా మూలంలోని חֶשְׁכַת מַיִם కావ్య సాంద్రతను కాపాడాం.
