  to: 'ఆయన చీకటిని తన మరుగుస్థలంగా[a] చేసుకున్నాడు;

    తన చుట్టూ ఉన్న ఆయన ఆశ్రయం[b]—జలాల చీకటి, ఆకాశంలోని దట్టమైన మేఘాలు.'
  rationale: 'The revision preserves the verse’s two-part poetic construction: darkness is God’s hiding place, and the shelter around him is described as darkness of waters and dense sky-clouds. It avoids supplying a second action not stated in the Hebrew and maintains the non-doctrinal storm imagery.'
