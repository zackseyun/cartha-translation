  text: Yahweh repaid me according to my righteousness[b][a], according to the cleanness of my hands before his eyes.
translation:
  language: te
  text: యాహ్వే నాకు ప్రతిఫలమిచ్చాడు[a]—నా నీతిని బట్టి, ఆయన కళ్ల ఎదుట నా చేతుల శుద్ధిని బట్టి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తిరిగి ఇచ్చాడు,’ ‘తగిన ఫలం ఇచ్చాడు.’ హీబ్రూ క్రియ ఒకరి ప్రవర్తనకు అనుగుణంగా తిరిగి ఇవ్వడం లేదా ప్రతిఫలం చెల్లించడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘చేతుల శుద్ధి’ అనేది నిర్దోషమైన లేదా యథార్థమైన ప్రవర్తనను సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: ప్రతిఫలమిచ్చాడు
  rationale: שוב హిఫిల్ రూపం ఇక్కడ לִיతో కలిసి, ఒకరి ప్రవర్తనకు తగిన విధంగా తిరిగి ఇవ్వడం లేదా ప్రతిఫలం ఇవ్వడం అనే భావాన్ని తెలియజేస్తుంది. ‘ప్రతిఫలమిచ్చాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, సందర్భంలోని దైవిక ప్రతిస్పందనను వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయ భావాలను పాదటిప్పణిలో ఉంచాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, వ్యక్తిగత నామాన్ని తెలుగులో లిప్యంతరీకరించాం.
- source_word: לִי
  choice: నాకు
  rationale: హీబ్రూ ל ఉపసర్గను ప్రత్యక్షంగా ప్రతిబింబిస్తూ, తెలుగు వాక్యనిర్మాణంలో సహజమైన ‘నాకు’ను వాడాం.
- source_word: כְצִדְקִי
  choice: నా నీతిని బట్టి
  rationale: כ ఇక్కడ ప్రమాణం లేదా అనురూపతను సూచిస్తుంది. צִדְקִי అనే స్వీయ నైతిక వాదనను బలహీనపరచకుండా ‘నా నీతి’గా నిలిపాం.
- source_word: כְּבֹר יָדַי
  choice: నా చేతుల శుద్ధిని బట్టి
  rationale: בֹּרలోని శుద్ధత భావాన్నీ, יָדַיలోని చేతుల రూపకాన్నీ రెండింటినీ కాపాడుతుంది. ఇది నడవడికి సంబంధించిన హీబ్రూ నుడికారమని పాదటిప్పణి వివరిస్తుంది.
- source_word: לְנֶגֶד עֵינָיו
  choice: ఆయన కళ్ల ఎదుట
  rationale: మూలంలోని ‘ఆయన కళ్ల ఎదుట’ అనే మానవరూప వర్ణనను సంక్షిప్తంగా, సహజమైన తెలుగులో నిలిపాం.
theological_decisions:
- issue: కీర్తనకర్త తన నీతి, చేతుల శుద్ధి ఆధారంగా దేవుడు ప్రతిఫలమిచ్చాడని చెప్పడం
  choice: ‘నా నీతిని బట్టి’, ‘నా చేతుల శుద్ధిని బట్టి’ అనే ప్రత్యక్ష వాదనను యథాతథంగా నిలిపాం.
  alternative: దీనిని ‘నా నిబంధన విశ్వాస్యతను బట్టి’ లేదా కేవలం ‘నా నిర్దోషిత్వాన్ని బట్టి’ అని వివరణాత్మకంగా మృదుపరచడం.
  rationale: మూల హీబ్రూ కీర్తనకర్త నీతినీ చేతుల శుద్ధినీ స్పష్టంగా పేర్కొంటుంది. ఆ వాక్యంలోని వేదాంతపరమైన ఉద్రిక్తతను అనువాదంలో పరిష్కరించకుండా కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని సమాంతర ప్రమాణ పదబంధాలను డాష్ తరువాత ఉంచి కవితాత్మక గమనాన్ని నిలిపాం; ‘చేతులు,’ ‘కళ్లు’ అనే దృశ్యరూపాలను తొలగించలేదు.
