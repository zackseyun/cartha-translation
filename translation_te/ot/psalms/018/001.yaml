id: PSA.18.1
reference: Psalms 18:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמַ֡ר אֶרְחָמְ/ךָ֖ יְהוָ֣ה חִזְקִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/001.yaml
  text: And he said[a], “I love you, O Yahweh, my strength.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు[a]: “యాహ్వే, నా బలమా, నేను నిన్ను ప్రేమిస్తున్నాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ క్రియకు “నీ పట్ల కోమలమైన వాత్సల్యం కలిగి ఉన్నాను” లేదా “నిన్ను ఎంతో కోమలంగా ప్రేమిస్తున్నాను” అనే భావఛాయ ఉంది; ఇక్కడ అది సహజంగా ప్రేమను వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: అతడు ఇలా అన్నాడు
  rationale: వావ్-క్రమరూపంతో ఉన్న אמר అనే క్రియను స్పష్టంగా అనువదించి, WLCలో ఈ వచనారంభంలో ఉన్న మాటల పరిచయ సూత్రాన్ని నిలుపుతుంది. తెలుగు వాక్యప్రవాహంలో ‘ఇలా’ సహజంగా ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది.
- source_word: אֶרְחָמְךָ
  choice: నేను నిన్ను ప్రేమిస్తున్నాను
  rationale: רחם మూలపదానికి కనికరం, వాత్సల్యం, కోమలమైన అనురాగం అనే భావఛాయలు ఉన్నాయి. దేవునితో ప్రత్యక్షంగా మాట్లాడే ఈ భక్తిసందర్భంలో ‘ప్రేమిస్తున్నాను’ సహజమైన అర్థాన్ని ఇస్తుంది; మూలంలోని వాత్సల్యభావాన్ని పాదసూచికలో భద్రపరచాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో వ్యక్తినామంగా అందిస్తుంది.
- source_word: חִזְקִי
  choice: నా బలమా
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న నామరూపాన్ని సంబోధనగా సహజమైన తెలుగులో అందిస్తుంది; యెహోవాయే కీర్తనకర్తకు బలం అనే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని ‘ప్రభువు’ వంటి బిరుదుతో మార్చకుండా ఉంచాం; తెలుగు సాధారణ బైబిలు వాడుకలో స్థిరపడిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: దేవునిని ఉద్దేశించి רחם క్రియకు ఉన్న భావం
  choice: నేను నిన్ను ప్రేమిస్తున్నాను
  alternative: నేను నిన్ను ఎంతో వాత్సల్యంగా ఆదరిస్తున్నాను
  rationale: పదమూలం కనికరం లేదా కోమల వాత్సల్యాన్ని సూచించినా, ఇక్కడ దేవునిపట్ల జాలి చూపడం భావం కాదు; భక్తిపూర్వకమైన గాఢ అనురాగమే సందర్భోచిత భావం. అయినా ఆ ప్రత్యేక భావఛాయను పాదసూచికలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన భక్తి శైలిని ఉపయోగించాం. ప్రత్యక్ష సంబోధనను ‘యెహోవా, నా బలమా’గా ఉంచి, మూలంలోని సంక్షిప్తతను కాపాడాం.
