  yaml_path: translation/ot/psalms/018/047.yaml
  text: the God who gives vengeance to me and subdues peoples under me[a][b].
translation:
  language: te
  text: నా పక్షాన ప్రతీకారం తీర్చి, ప్రజలను నా కిందకు లోబరచే దేవుడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రతీకార కార్యాలు’; హీబ్రూలో బహువచన రూపం ఉంది; అది అనేక ప్రతీకార చర్యలను లేదా తీవ్రమైన అమూర్త భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి క్రియకు సంప్రదాయంగా ‘లోబరచడం’ లేదా ‘అధీనపరచడం’ అనే అర్థం తీసుకుంటారు; అది ‘మాట్లాడు’ అనే సాధారణ హీబ్రూ క్రియతో సంబంధం ఉన్నప్పటికీ, ఇక్కడ ఆ అర్థం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: దేవుడు
  rationale: నిర్దిష్ట ఉపపదం ఉన్నప్పటికీ, తెలుగులో ‘ఆ దేవుడు’ అనడం ఈ వర్ణనాత్మక కవితా సందర్భంలో అనవసరమైన సూచనార్థాన్ని కలిగించవచ్చు; ‘దేవుడు’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: הַנּוֹתֵן
  choice: అనుగ్రహించి
  rationale: ఈ కృదంతం దేవుణ్ణి ఆయన చేసే కార్యం ద్వారా వర్ణిస్తుంది. తరువాతి క్రియతో సహజమైన తెలుగు సమన్వయం కోసం ‘అనుగ్రహించి ... అణచివేసే’ అని నిర్మించబడింది.
- source_word: נְקָמוֹת
  choice: ప్రతీకార కార్యాలను
  rationale: హీబ్రూలోని బహువచనాన్ని కనిపించేలా ఉంచుతూ, అది అనేక ప్రతీకార చర్యలను లేదా బలమైన అమూర్త భావాన్ని సూచించగలదనే విస్తృతిని కాపాడుతుంది.
- source_word: לִי
  choice: నాకు
  rationale: లְ ఉపసర్గ సూచించే గ్రహీత లేదా లబ్ధిదారుని నేరుగా ప్రతిబింబిస్తుంది; సందర్భంలో ‘నా పక్షంగా’ అనే భావం కూడా సాధ్యమే.
- source_word: וַיַּדְבֵּר
  choice: అణచివేసే
  rationale: ఈ రూపానికి ఇక్కడ ‘మాట్లాడు’ అనే సాధారణ అర్థం కాక, ప్రజలను లోబరచడం అనే సందర్భోచిత అర్థం ఉంది. వాక్యంలోని దేవుని వర్ణించే శైలికి అనుగుణంగా తెలుగు వర్తమాన వర్ణనాత్మక రూపం వాడబడింది.
- source_word: עַמִּים
  choice: ప్రజలను
  rationale: బహువచన עַמִּים వివిధ ప్రజాసమూహాలను సూచిస్తుంది; ‘ప్రజలను’ సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: תַּחְתָּי
  choice: నా కింద
  rationale: మూలంలోని స్థలరూపకాన్ని నేరుగా నిలుపుతుంది; ‘అణచివేసే’ అనే క్రియ రాజకీయ లేదా సైనిక లోబరచడాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: దైవిక ప్రతీకారం
  choice: ‘ప్రతీకార కార్యాలు’ అనే బలమైన భావాన్ని నిలుపుకోవడం
  alternative: విమోచన కార్యాలు; న్యాయం చేకూర్చడం
  rationale: נְקָמוֹת నేరుగా ప్రతీకారం లేదా ప్రతీకార చర్యలను సూచిస్తుంది. మృదువైన ప్రత్యామ్నాయాలు మూలంలోని ఉద్రేకాన్ని తగ్గిస్తాయి. ఈ అనువాదం దేవుడు కీర్తనకర్త పక్షంగా ప్రతిఫలం తీర్చే చిత్రణను ఉంచుతుంది; దాని సిద్ధాంతపరమైన పరిధిని విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా వచనం. మూలంలోని ప్రతీకార భాషను మృదువుచేయలేదు; ‘నా కింద’ అనే స్థలరూపకాన్ని నిలిపింది. రెండు పాదాలను తెలుగు వ్యాకరణంలో ఒకే దైవవర్ణనగా సజావుగా కలిపింది.
