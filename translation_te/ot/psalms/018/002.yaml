source:
  edition: WLC
  text: יְהוָ֤ה סַֽלְעִ֥/י וּ/מְצוּדָתִ֗/י וּ/מְפַ֫לְטִ֥/י אֵלִ֣/י צ֭וּרִ/י אֶֽחֱסֶה בּ֑/וֹ מָֽגִנִּ֥/י וְ/קֶֽרֶן יִ֝שְׁעִ֗/י מִשְׂגַּבִּֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/002.yaml
  text: Yahweh is my crag and my fortress and my deliverer[a], my God, my rock, in whom I take refuge, my shield and the horn of my salvation[c][b], my stronghold.
translation:
  language: te
  text: 'యాహ్వే నా కొండబండ[a], నా కోట, నన్ను విడిపించేవాడు;

    నా దేవుడు, నా శిల—ఆయనలో నేను ఆశ్రయం పొందుతాను[b];

    ఆయనే నా డాలు, నా రక్షణ కొమ్ము[c], నా ఎత్తైన ఆశ్రయం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కొండబండ’కు ‘రాతిచరియ’ అని కూడా అనువదించవచ్చు. ఇక్కడి סֶלַע, తరువాతి צוּר రెండూ రాతిని సూచించినా, హీబ్రూలో వేర్వేరు పదాలు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆయనలో నేను ఆశ్రయిస్తాను.’
    reason: lexical_alternative
  - marker: c
    text: ‘కొమ్ము’ బలానికి, విజయవంతంగా రక్షించే శక్తికి రూపకం.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ లిప్యంతరీకరణను తెలుగులో ఇచ్చాం.
- source_word: סַלְעִי
  choice: నా కొండబండ
  rationale: సֶלַע సూచించే పెద్ద కొండబండ లేదా రాతిచరియ భావాన్ని తెలియజేస్తూ, తరువాతి צוּרִי (‘నా శిల’) నుండి పదభేదాన్ని నిలిపాం.
- source_word: מְצוּדָתִי
  choice: నా కోట
  rationale: రక్షణనిచ్చే పటిష్ఠ స్థలమనే సైనిక రూపకాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מְפַלְטִי
  choice: నన్ను విడిపించేవాడు
  rationale: తప్పించేవాడు లేదా రక్షించేవాడు అనే హీబ్రూ కర్తృవాచక భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אֵלִי
  choice: నా దేవుడు
  rationale: ఇక్కడ אֵל మొదటి పురుష ఏకవచన ప్రత్యయంతో సాధారణ దైవసంబోధనగా వాడబడింది.
- source_word: צוּרִי
  choice: నా శిల
  rationale: స్థిరత్వం, భద్రతను సూచించే రాతి రూపకాన్ని ఉంచుతూ, ముందున్న סֶלַעకు వాడిన ‘కొండబండ’తో భేదాన్ని కాపాడుతుంది.
- source_word: אֶחֱסֶה בּוֹ
  choice: ఆయనను నేను ఆశ్రయిస్తాను
  rationale: חסה యొక్క ఆశ్రయం వెదకడం లేదా పొందడం అనే భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో ఇస్తుంది; בּוֹ యొక్క మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో తెలిపాం.
- source_word: מָגִנִּי
  choice: నా డాలు
  rationale: యుద్ధంలో రక్షణనిచ్చే డాలు అనే ప్రత్యక్ష రూపకాన్ని నిలిపాం.
- source_word: קֶרֶן יִשְׁעִי
  choice: నా రక్షణ కొమ్ము
  rationale: బలం, విజయవంతమైన రక్షణను సూచించే హీబ్రూ ‘కొమ్ము’ రూపకాన్ని వివరణగా మార్చకుండా నిలిపాం.
- source_word: מִשְׂגַּבִּי
  choice: నా ఎత్తైన ఆశ్రయం
  rationale: ఎత్తులో ఉండి చేరరాని సురక్షిత స్థలం అనే భావాన్ని తెలియజేస్తూ, ముందున్న ‘కోట’ నుండి పదభేదాన్ని కాపాడుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం.
- issue: సంబంధిత రాతి మరియు రక్షణ రూపకాల భేదం
  choice: కొండబండ, కోట, శిల, ఎత్తైన ఆశ్రయం అనే వేర్వేరు పదాలు
  alternative: అనేక పదాలను ‘బండ’ లేదా ‘దుర్గం’గా ఏకరీకరించడం
  rationale: హీబ్రూ కవితలోని סלע, מצודה, צור, משגב పదాలు పరస్పరం సంబంధితమైనా భిన్నమైన రక్షణ చిత్రాలను సృష్టిస్తాయి; ఆ వైవిధ్యాన్ని నిలిపాం.
- issue: ‘రక్షణ కొమ్ము’ రూపకం
  choice: రూపకాన్ని యథాతథంగా ఉంచి పాదసూచికలో వివరణ
  alternative: నా బలమైన రక్షకుడు / నాకు విజయాన్ని ఇచ్చేవాడు
  rationale: קֶרֶן అనే స్పష్టమైన కవితాత్మక రూపకాన్ని భావానువాదంతో తొలగించకుండా, ఆధునిక పాఠకుడికి దాని సూచనను వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన కవితా శైలిని అనుసరించాం. మూలంలోని వరుస రక్షణ రూపకాలను సంక్షిప్తంగా నిలిపి, అరుదుగా అనిపించగల ‘రక్షణ కొమ్ము’కు పాదసూచిక ఇచ్చాం.
