source:
  edition: WLC
  text: חַי יְ֭הוָה וּ/בָר֣וּךְ צוּרִ֑/י וְ֝/יָר֗וּם אֱלוֹהֵ֥י יִשְׁעִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/046.yaml
  text: Yahweh lives[a], and blessed be my rock, and exalted be the God of my salvation.
translation:
  language: te
  text: యాహ్వే సజీవుడు! నా బండ ధన్యుడు కావాలి! నా రక్షణదేవుడు ఉన్నతపరచబడుగాక![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా రక్షణదేవుడు ఉన్నతుడగును”; లేదా, “నా రక్షణదేవుడు ఉన్నతుడై ఉన్నాడు.”
    reason: וְיָרוּם అనే హెబ్రీ అసంపూర్ణ క్రియారూపం ఈ స్తుతి సందర్భంలో ఆకాంక్షాత్మకంగా (‘ఉన్నతపరచబడుగాక’) లేదా నిర్దేశార్థకంగా అర్థమవవచ్చు.
lexical_decisions:
- source_word: חַי יְהוָה
  choice: యెహోవా సజీవుడు!
  rationale: חַי ఇక్కడ దైవనామంతో విధేయ విశేషణంగా వచ్చి, యెహోవా నిజంగా జీవిస్తున్నాడనే స్తుతి ప్రకటనను వ్యక్తం చేస్తుంది. తెలుగు సహజత్వం కోసం ఆశ్చర్యార్థక వాక్యంగా ఇచ్చాం; ప్రమాణార్థకమైన ‘యెహోవా జీవం తోడు’ అనే భావాన్ని చేర్చలేదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: וּבָרוּךְ
  choice: ఆశీర్వదించబడుగాక
  rationale: స్తుతి సందర్భంలోని ఈ నిష్క్రియ విశేషణరూపం ఆశీర్వాదాత్మక ప్రశంసగా పనిచేస్తుంది. ‘ఆశీర్వదించబడినవాడు’ అనే నిర్దేశ ప్రకటనకన్నా ‘ఆశీర్వదించబడుగాక’ కీర్తనా ధోరణిని నిలుపుతుంది.
- source_word: צוּרִי
  choice: నా బండ
  rationale: צוּר అనే స్థిరత్వం, రక్షణను సూచించే మూల రూపకాన్ని ‘బండ’ నేరుగా నిలుపుతుంది; ‘ఆశ్రయం’ అని వ్యాఖ్యానాత్మకంగా మార్చలేదు.
- source_word: וְיָרוּם
  choice: ఉన్నతంగా స్తుతించబడుగాక
  rationale: రూపశాస్త్రపరంగా ఇది అసంపూర్ణ క్రియారూపమైనా, సమాంతర స్తుతి వాక్యాల మధ్య ఆకాంక్షాత్మక/స్తుత్యర్థక బలాన్ని కలిగి ఉంది. తెలుగులో దేవుణ్ణి ‘హెచ్చించబడుగాక’ అనడం అసహజంగా ఉండటంతో, ఉన్నతపరచే స్తుతి భావాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: אֱלוֹהֵי יִשְׁעִי
  choice: నా రక్షణకు దేవుడు
  rationale: నిర్మాణ సంబంధాన్ని సాధ్యమైనంతగా నిలుపుతూ, దేవుడే రక్షణకు మూలమనే భావాన్ని వ్యక్తం చేస్తుంది; ‘నన్ను రక్షించే దేవుడు’ అని క్రియాత్మకంగా విపులీకరించలేదు.
theological_decisions:
- issue: יהוה దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. తెలుగులో చారిత్రకంగా, విస్తృతంగా గుర్తించదగిన లిప్యంతరీకరణను వాడి, ‘ప్రభువు’ అనే బిరుదుతో దానిని భర్తీ చేయలేదు.
- issue: וְיָרוּם యొక్క స్తుత్యర్థక బలం
  choice: 'ఆకాంక్షాత్మక స్తుతి: ‘ఉన్నతంగా స్తుతించబడుగాక’'
  alternative: 'నిర్దేశార్థకం: ‘ఉన్నతుడై ఉన్నాడు’; లేదా స్పష్టమైన ఆజ్ఞార్థకం: ‘ఉన్నతపరచబడనివ్వండి’'
  rationale: సమీపంలోని וּבָרוּךְతో ఉన్న కవితా సమాంతరత ఆకాంక్షాత్మక స్తుతిని సమర్థిస్తుంది. అయినా హెబ్రీ అసంపూర్ణ క్రియారూపం నిర్దేశార్థకంగానూ అర్థమయ్యే అవకాశాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గంభీరమైన స్తుతి ధోరణిని ఉంచాం. మూడు సమాంతర ప్రకటనలను ఆశ్చర్యార్థకాలుగా ఇచ్చి హెబ్రీ కవితా ఉత్సాహాన్ని నిలిపాం; మూల రూపకమైన ‘బండ’ను అలాగే ఉంచాం.
