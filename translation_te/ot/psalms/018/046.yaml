revisions:
- from: యెహోవా సజీవుడు! నా బండ ఆశీర్వదించబడుగాక! నా రక్షణకు దేవుడు ఉన్నతంగా స్తుతించబడుగాక![a]
  to: యాహ్వే సజీవుడు! నా బండ ధన్యుడు కావాలి! నా రక్షణదేవుడు ఉన్నతపరచబడుగాక![a]
  rationale: The revision conforms the divine name to the POB requirement, retains the direct ‘rock’ metaphor, expresses the benedictory middle line in natural poetic Telugu, and translates the final verb as exaltation rather than adding ‘praise.’ The footnote preserves the grammatical ambiguity of וְיָרוּם without deciding it beyond the main-text doxological rendering.
