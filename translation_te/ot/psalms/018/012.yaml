  yaml_path: translation/ot/psalms/018/012.yaml
  text: From the brightness before him his clouds passed on—hail and coals of fire[a].
translation:
  language: te
  text: 'ఆయన ఎదుటనున్న ప్రకాశం నుండి

    ఆయన మేఘాలు దాటిపోయాయి—

    వడగండ్లు, అగ్ని బొగ్గులు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన దట్టమైన మేఘాలు దాటిపోయాయి; వడగండ్లు, మండే బొగ్గులు.” హెబ్రీ వాక్యం సంక్షిప్తమైన, గాఢమైన కవితా శైలిలో ఉండడం వల్ల ఈ తుఫాను దృశ్యాన్ని కొద్దిగా భిన్నంగా వ్యక్తం చేయవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֹּגַהּ
  choice: ప్రకాశం నుండి
  rationale: נֹגַהּ అంటే ప్రకాశం లేదా వెలుగు; מִן మూలాన్ని సూచిస్తున్నందున ‘నుండి’ అని అనువదించాం.
- source_word: נֶגְדּוֹ
  choice: ఆయన ఎదుటి
  rationale: נֶגֶד + 3ms ప్రత్యయం ‘ఆయన ఎదుట/ఆయన ముందు’ అనే స్థలసంబంధ భావాన్ని ఇస్తుంది; తెలుగులో తరువాతి ‘ప్రకాశం’తో సహజంగా కలిసేలా ‘ఆయన ఎదుటి’ అని ఇచ్చాం.
- source_word: עָבָיו
  choice: ఆయన దట్టమైన మేఘాలు
  rationale: עָב అనేది దట్టమైన మేఘరాశిని సూచించగలదు; స్వామ్య ప్రత్యయాన్ని స్పష్టంగా నిలిపి, తుఫాను దృశ్యాన్ని తెలియజేయడానికి ‘దట్టమైన మేఘాలు’ అని ఎంచుకున్నాం.
- source_word: עָבְרוּ
  choice: దాటిపోయాయి
  rationale: עבר Qal బహువచనం ‘దాటాయి/గతించాయి’ అనే భావం ఇస్తుంది. మేఘాల కదలికను సహజ తెలుగులో తెలిపేందుకు ‘దాటిపోయాయి’ అని ఇచ్చాం.
- source_word: בָּרָד
  choice: వడగండ్లు
  rationale: వాతావరణ సంబంధ పదానికి ఆధునిక ప్రామాణిక తెలుగు సమానార్థకం.
- source_word: וְגַחֲלֵי אֵשׁ
  choice: నిప్పుకణికలు
  rationale: అక్షరార్థంగా ‘అగ్ని నిప్పులు/మండే బొగ్గులు’; కవితాత్మక తుఫాను దృశ్యంలో సహజంగా, స్పష్టంగా ఉండే ‘నిప్పుకణికలు’ను ఎంచుకున్నాం.
theological_decisions:
- issue: దైవ ప్రత్యక్షతను వర్ణించే కవితాత్మక తుఫాను దృశ్యం
  choice: దైవ ప్రత్యక్షతకు సంబంధించిన వడగండ్లు, నిప్పుకణికలు, మేఘాల చిత్రణను యథాతథంగా నిలిపాం.
  alternative: దీనిని కేవలం సైనిక విజయానికి రూపకంగా పరిమితం చేయడం, లేదా ప్రతి అంశాన్ని అక్షరార్థ వాతావరణ అద్భుతంగా విస్తరించడం.
  rationale: హెబ్రీ కవిత్వం దృశ్యాన్ని ఉద్దేశపూర్వకంగా ఘనంగా, సంక్షిప్తంగా ఉంచుతుంది. అంశాలు అక్షరార్థమా రూపకాలా అనే ఉద్రిక్తతను అనువాదం పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కవితా లయ కోసం పాద విభజన, దీర్ఘవిరామం వాడాం. మూలంలోని సంక్షిప్తతను, తుఫాను-దైవ ప్రత్యక్షత చిత్రణను కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఎంచుకున్నాం.
