  to: 'ఆయన ఎదుటనున్న ప్రకాశం నుండి

    ఆయన మేఘాలు దాటిపోయాయి—

    వడగండ్లు, అగ్ని బొగ్గులు.[a]'
  rationale: The revision improves modern Telugu clarity at the opening, restores the lexical force of "coals of fire," and makes the lexical-alternative footnote substantive. It retains the Hebrew's compressed poetic storm imagery and does not decide whether the imagery is literal or figurative.
