translation:
  language: te
  text: 'మరణపు తాళ్లు నన్ను చుట్టుముట్టాయి;

    వినాశపు[a] ప్రవాహాలు నన్ను భయభ్రాంతికి గురిచేశాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధాన్ని “పనికిమాలినత ప్రవాహాలు” లేదా “దుష్టత్వపు ప్రవాహాలు” అని కూడా అనువదించవచ్చు. בְלִיַּעַלను వ్యక్తినామంగా తీసుకుంటే, “బెలీయాలు యొక్క ప్రవాహాలు” అని కూడా అర్థం చేసుకోవచ్చు; అయితే ఇక్కడ అది వినాశాన్ని సూచించే సాధారణ నామంగా ఉండే అవకాశం ఎక్కువ.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲפָפוּנִי
  choice: నన్ను చుట్టుముట్టాయి
  rationale: אפף అనే క్రియ చుట్టూ ఆవరించడం లేదా చుట్టుముట్టడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో “చుట్టుముట్టాయి” సహజంగా ఉండి, ప్రమాదం అన్ని వైపులా ఆవరించిన చిత్రాన్ని నిలుపుతుంది.
- source_word: חֶבְלֵי
  choice: తాళ్లు
  rationale: חבל యొక్క ప్రాథమిక అర్థం తాడు లేదా బంధించే తాడు. “తాళ్లు” మరణం బంధిస్తున్నదనే కవితాత్మక రూపకాన్ని స్పష్టంగా నిలుపుతుంది; “పాశాలు” అనే భావం సాధ్యమైనా అది మూలంలోని స్పష్టమైన వస్తు-చిత్రానికి కొంత వ్యాఖ్యానాన్ని జోడిస్తుంది.
- source_word: מָוֶת
  choice: మరణపు
  rationale: మָוֶתకు సాధారణమైన, సందర్భానుకూలమైన అనువాదం “మరణం”; సంబంధ రూపంలో “మరణపు” అని వాడబడింది.
- source_word: נַחֲלֵי
  choice: ప్రవాహాలు
  rationale: נחל వాగు, ప్రవాహం లేదా ఉప్పొంగే వరదప్రవాహాన్ని సూచించగలదు. ఇక్కడ ముంచుకొచ్చే ప్రమాదాన్ని తెలియజేయడానికి “ప్రవాహాలు” సహజమైన కవితాత్మక పదం.
- source_word: בְלִיַּעַל
  choice: వినాశపు
  rationale: ఈ సందర్భంలో בְלִיַּעַלను వ్యక్తినామంగా కాక, నాశనం లేదా దుష్టమైన వ్యర్థత్వాన్ని సూచించే సాధారణ నామంగా గ్రహించడం సముచితం. “వినాశపు” అనేది ప్రవాహాల ప్రాణాంతక శక్తిని సహజ తెలుగులో తెలియజేస్తుంది; పదంలోని ఇతర సాధ్య భావాలు పాదసూచికలో నిలుపబడ్డాయి.
- source_word: יְבַעֲתוּנִי
  choice: నన్ను భయభ్రాంతికి గురిచేశాయి
  rationale: בעת తీవ్రమైన, ఆకస్మిక భయాన్ని సూచిస్తుంది. “భయభ్రాంతికి గురిచేశాయి” ఆ బలాన్ని నిలుపుతూ, వక్త లింగాన్ని అనవసరంగా నిర్దేశించదు.
theological_decisions:
- issue: בְלִיַּעַלను ‘బెలీయాలు’ అనే వ్యక్తినామంగా తీసుకోవాలా, లేక వినాశం/దుష్టత్వాన్ని సూచించే సాధారణ నామంగా తీసుకోవాలా
  choice: వినాశాన్ని సూచించే సాధారణ నామం
  alternative: ‘బెలీయాలు’ అనే వ్యక్తినామం; లేదా ‘పనికిమాలినత/దుష్టత్వం’
  rationale: ఈ కీర్తనలోని సమాంతర కవిత్వం ప్రాణాంతకమైన ప్రమాదశక్తులను చిత్రిస్తుంది. అందువల్ల తరువాతి కాలంలో ఏర్పడిన వ్యక్తీకృత ‘బెలీయాలు’ భావాన్ని ఇక్కడికి దిగుమతి చేయకుండా, సాధారణ నామార్థాన్ని ప్రధాన పాఠ్యంలో ఉంచాం; నిజమైన ప్రత్యామ్నాయాలను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తనా కవిత్వానికి తగిన గంభీరతను నిలిపాం. రెండు సమాంతర ప్రమాద-రూపకాలు—బంధించే తాళ్లు, ముంచుకొచ్చే ప్రవాహాలు—స్పష్టంగా ఉంచబడ్డాయి.
