id: PSA.18.31
reference: Psalms 18:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י מִ֣י אֱ֭לוֹהַּ מִ/בַּלְעֲדֵ֣י יְהוָ֑ה וּ/מִ֥י צ֝֗וּר זוּלָתִ֥/י אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/031.yaml
  text: For who is God besides Yahweh? And who is a rock except our God?[a]
translation:
  language: te
  text: ఎందుకంటే యహ్వే తప్ప దేవుడు ఎవరు? మన దేవుడు తప్ప శిల ఎవరు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మొదటి ప్రశ్నను “యహ్వేకు వేరుగా” అనీ, రెండవ ప్రశ్నను “మన దేవుడు కాకుండా” అనీ కూడా అనువదించవచ్చు; రెండు హీబ్రూ పదబంధాలూ ప్రత్యేకతను తెలియజేస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న స్తుతికి కారణాన్ని లేదా ఆధారాన్ని పరిచయం చేసే అనుసంధాన పదంగా సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מִי
  choice: ఎవరు
  rationale: అలంకారప్రశ్నలోని ప్రశ్నార్థక సర్వనామాన్ని నేరుగా నిలుపుతుంది.
- source_word: אֱלוֹהַּ
  choice: దేవుడు
  rationale: యెహోవాతో తప్ప మరెవరూ దేవుడు కాదనే ప్రత్యేకతను సూచించే ఏకవచన నామవాచకం.
- source_word: מִבַּלְעֲדֵי
  choice: తప్ప
  rationale: మినహాయింపు, ప్రత్యేకత అనే భావాన్ని సంక్షిప్తంగా సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో నిలుపుతుంది.
- source_word: וּמִי
  choice: ఎవరు
  rationale: రెండవ సమాంతర అలంకారప్రశ్నను తెలుగులో సహజంగా కొనసాగిస్తుంది; ప్రశ్నల వరుసే హీబ్రూ సంధానాన్ని స్పష్టం చేస్తుంది.
- source_word: צוּר
  choice: ఆశ్రయశిల
  rationale: ‘శిల’ అనే మూల రూపకాన్ని నిలుపుతూ, సందర్భంలోని స్థిరత్వం, రక్షణ భావం సాధారణ పాఠకునికి స్పష్టమయ్యేలా చేస్తుంది.
- source_word: זוּלָתִי
  choice: తప్ప
  rationale: మొదటి పాదంలోని మినహాయింపు భావానికి సమాంతరంగా సంపూర్ణ ప్రత్యేకతను తెలియజేస్తుంది.
- source_word: אֱלֹהֵינוּ
  choice: మన దేవుడు
  rationale: మొదటి పురుష బహువచన ప్రత్యయపు సామూహిక, నిబంధనాత్మక సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామపు అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉన్నందున దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన రూపంలో అందిస్తుంది.
- issue: צוּר అనే దేవుని రూపకం
  choice: ఆశ్రయశిల
  alternative: శిల
  rationale: మూలంలోని శిల రూపకాన్ని కాపాడుతూనే అది బలం, స్థిరత్వం, రక్షణను సూచిస్తుందని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; దాన్ని కేవలం అమూర్తమైన ‘ఆశ్రయం’గా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. సమాంతర అలంకారప్రశ్నలు, దైవనామం, శిల రూపకం, ‘మన దేవుడు’ అనే సామూహిక సంబంధం నిలుపబడ్డాయి.
