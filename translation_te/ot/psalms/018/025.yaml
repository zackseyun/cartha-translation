  text: With the faithful you show yourself faithful[a]; with the blameless man you show yourself blameless.
translation:
  language: te
  text: నమ్మకస్థుని పట్ల నీవు నమ్మకంగా ప్రవర్తిస్తావు[a]; నిర్దోషుడైన మనిషి పట్ల నీవు నిర్దోషంగా ప్రవర్తిస్తావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిష్ఠగలవాని పట్ల నీవు నిష్ఠగా ప్రవర్తిస్తావు.” హీబ్రూలో ఇక్కడ ఒకే మూలం (חסד) నుంచి వచ్చిన సంబంధిత పదాలు ఉన్నాయి; అవి పరస్పర నిబంధన నిష్ఠను నొక్కిచెబుతాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָסִיד
  choice: నమ్మకంగా ఉండేవాడు
  rationale: ఈ పదం నిబంధన సంబంధమైన విశ్వసనీయత, నిష్ఠ, భక్తిని సూచిస్తుంది. ‘నమ్మకంగా ఉండేవాడు’ అనే రూపం సాధారణ ఆధునిక తెలుగులో సంబంధపరమైన నిష్ఠను తెలియజేస్తూ, తరువాతి సమానమూల క్రియతో ఉన్న పదప్రయోగాన్ని కొంతవరకు నిలుపుతుంది.
- source_word: תִּתְחַסָּד
  choice: నీవు నమ్మకంగా ప్రవర్తిస్తావు
  rationale: חסד మూలంలోని హిత్పయేల్ రూపం, నమ్మకస్థుని పట్ల దేవుడు తనను నమ్మకస్థునిగా చూపించుకోవడం లేదా అలా వ్యవహరించడం అనే భావాన్ని ఇస్తుంది. తెలుగులో ‘నమ్మకంగా ప్రవర్తిస్తావు’ సహజంగా ఉండి పరస్పర అనురూపతను కాపాడుతుంది.
- source_word: גְּבַר
  choice: మనిషి
  rationale: ఇది పుంలింగ ఏకవచనంలో ‘పురుషుడు/మనిషి’ అని అర్థం. ఈ సందర్భంలో బలవంతుడు లేదా యోధుడు అనే ఛాయ ప్రధానంగా లేదు; అందుచేత సహజమైన ‘మనిషి’ ఎంచుకోబడింది.
- source_word: תָּמִים
  choice: నిర్దోషమైన
  rationale: ఈ పదం సంపూర్ణత, యథార్థత, నైతిక నిందారాహిత్యాన్ని సూచిస్తుంది. సమాంతర కవితా నిర్మాణంలో ‘నిర్దోషమైన’ స్పష్టంగా, గౌరవప్రదంగా ఉంది.
- source_word: תִּתַּמָּם
  choice: నీవు నిర్దోషిగా కనబడతావు
  rationale: תמם మూలంలోని క్రియ ముందున్న תָּמִים పదాన్ని ప్రతిధ్వనిస్తుంది. ‘నిర్దోషిగా కనబడతావు’ అనే అనువాదం ప్రతిబింబాత్మక భావాన్ని, మానవ స్వభావానికి అనుగుణంగా దేవుడు తనను వెల్లడించుకునే కవితాత్మక అనురూపతను నిలుపుతుంది.
theological_decisions:
- issue: మానవుని స్వభావానికి ప్రతిస్పందనగా దేవుని స్వభావం అనురూపంగా వ్యక్తమవడం
  choice: దేవుడు నమ్మకస్థునితో నమ్మకంగా ప్రవర్తించి, నిర్దోషునికి నిర్దోషిగా కనబడతాడని అనువదించడం
  alternative: ‘నమ్మకస్థునికి నీవు నమ్మకస్థుడవు; నిర్దోషునికి నీవు నిర్దోషుడవు’ అని స్థితివాచకంగా అనువదించడం
  rationale: హీబ్రూ ప్రతిబింబాత్మక క్రియారూపాలు దేవుని స్వభావం మారుతుందని చెప్పకుండా, సంబంధంలో ఆయన తనను ఎలా వ్యక్తపరుస్తాడో సూచిస్తాయి. అనువాదం ఈ కవితాత్మక పరస్పరతను, దానిలోని దైవశాస్త్ర ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే కీర్తన కవిత్వానికి తగిన గౌరవప్రదమైన శైలి. మొదటి భాగంలోని హీబ్రూ సమానమూల పదప్రయోగాన్ని ‘నమ్మకంగా... నమ్మకంగా’ ద్వారా ప్రతిబింబించాం; రెండవ భాగంలోని תמם పదప్రతిధ్వనిని ‘నిర్దోషమైన... నిర్దోషిగా’ ద్వారా నిలిపాం.
