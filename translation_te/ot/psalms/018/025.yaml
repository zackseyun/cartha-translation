revisions:
- from: నమ్మకంగా ఉండేవానితో నీవు నమ్మకంగా ప్రవర్తిస్తావు[a]; నిర్దోషమైన మనిషితో నీవు నిర్దోషిగా కనబడతావు.
  to: నమ్మకస్థుని పట్ల నీవు నమ్మకంగా ప్రవర్తిస్తావు[a]; నిర్దోషుడైన మనిషి పట్ల నీవు నిర్దోషంగా ప్రవర్తిస్తావు.
  rationale: The revision retains the source's reciprocal poetic structure and both Hebrew lexical echoes. It replaces 'కనబడతావు' with language of corresponding conduct, avoiding the unintended implication that God only appears blameless. No theological conclusion beyond the verse's reciprocal formulation is imposed.
