review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly reflects the two balanced Hebrew clauses, the masculine singular גֶּבֶר (''man''), and the cognate pairings חסיד/תתחסד and תמים/תתמם. However, ''నిర్దోషిగా కనబడతావు'' can mean merely ''you appear blameless,'' which weakens the reflexive/resultative force: God acts or shows himself with corresponding integrity, rather than only seeming so.'
  naturalness: The draft is generally clear modern Telugu. 'నమ్మకంగా ఉండేవానితో' is understandable but less idiomatic and less compact than 'నమ్మకస్థుని పట్ల.' Recasting both cola with 'ప్రవర్తిస్తావు' gives natural, balanced poetic parallelism.
  terminology: '''నమ్మకస్థుడు/నమ్మకంగా'' preserves the lexical echo and covenant-loyalty sense without over-specifying it. ''నిర్దోషుడు/నిర్దోషంగా'' preserves the תמם wordplay and appropriately conveys ethical blamelessness/integrity. ''మనిషి'' rightly retains the masculine singular reference of גֶּבֶר.'
  issues:
  - severity: medium
    issue: '''నిర్దోషిగా కనబడతావు'' is potentially too weak.'
    rationale: '''కనబడతావు'' readily denotes an observer''s impression (''seem/appear''), whereas the Hebrew hitpael expresses God''s corresponding self-manifestation or conduct. ''నిర్దోషంగా ప్రవర్తిస్తావు'' is natural Telugu and avoids that weakening.'
  - severity: low
    issue: '''నమ్మకంగా ఉండేవానితో'' is somewhat periphrastic.'
    rationale: '''నమ్మకస్థుని పట్ల'' is more idiomatic in modern standard Telugu, retains the nominal correspondence, and supports the parallel structure.'
