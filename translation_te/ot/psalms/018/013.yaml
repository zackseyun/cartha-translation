  yaml_path: translation/ot/psalms/018/013.yaml
  text: Yahweh thundered in the heavens[b][a], and the Most High gave his voice—hailstones and coals of fire.
translation:
  language: te
  text: 'యాహ్వే ఆకాశాలలో ఉరిమాడు;

    సర్వోన్నతుడు తన స్వరాన్ని వినిపించాడు[a]—

    వడగండ్లు[b], నిప్పుల బొగ్గులు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తన స్వరాన్ని ఇచ్చాడు.” ఇది దేవుడు తన స్వరాన్ని వినిపించడాన్ని సూచించే హెబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “వడగండ్ల వాన.” హెబ్రూ ఏకవచన పదం ఇక్కడ సమూహార్థంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְעֵם
  choice: ఉరిమాడు
  rationale: రעם అనే క్రియ ఈ తుఫాను-దైవదర్శన సందర్భంలో ఉరుము ధ్వనిని సూచిస్తుంది. తెలుగు కవితా వాడుకలో ‘ఉరిమాడు’ సహజంగా ఉండి, తరువాతి ‘స్వరాన్ని వినిపించాడు’ అనే సమాంతర భావాన్ని నిలుపుతుంది.
- source_word: בַּשָּׁמַיִם
  choice: ఆకాశాల్లో
  rationale: హెబ్రూ పదం రూపరీత్యా బహువచనం. ‘ఆకాశాల్లో’ అనే రూపం దాని కవితాత్మక విస్తృతిని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితుల ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: וְעֶלְיוֹן
  choice: సర్వోన్నతుడు
  rationale: దేవునికి వాడిన עֶלְיוֹן అనే బిరుదుకు ‘సర్వోన్నతుడు’ ఖచ్చితమైన, గౌరవప్రదమైన, తెలుగులో స్థిరపడిన సమానార్థకం.
- source_word: יִתֵּן קֹלוֹ
  choice: తన స్వరాన్ని వినిపించాడు
  rationale: హెబ్రూ నుడికారం అక్షరార్థంగా ‘తన స్వరాన్ని ఇచ్చాడు’ అంటుంది. ఆ రూపం తెలుగులో అసహజం కావడంతో, ఉరుమువంటి దైవస్వర భావాన్ని అదనపు వ్యాఖ్యానం లేకుండా సహజంగా వ్యక్తపరిచే ‘వినిపించాడు’ ఎంచుకోబడింది; అక్షరార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: בָּרָד
  choice: వడగండ్లు
  rationale: ఏకవచన రూపం ఇక్కడ సమూహార్థకంగా వడగండ్లను సూచిస్తుంది. ‘వడగండ్లు’ దృశ్యాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וְגַחֲלֵי אֵשׁ
  choice: నిప్పుకణికలు
  rationale: ఈ పదబంధం అగ్నితో మండే బొగ్గులు లేదా నిప్పుకణికలను సూచిస్తుంది. ‘నిప్పుకణికలు’ తుఫాను కవితా దృశ్యంలో సహజంగా ఉండి, అది మెరుపా లేక తీర్పు ప్రతీకా అనే విషయాన్ని నిర్ణయించదు.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతుంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేక నామాన్ని కాపాడుతుంది.
- issue: ‘వడగండ్లు, నిప్పుకణికలు’ అనే చివరి పదబంధానికి ముందున్న వాక్యంతో సంబంధం
  choice: డాష్ తరువాత క్రియలేని, ఆకస్మిక కవితా కొనసాగింపుగా ఉంచడం
  alternative: ‘పంపించాడు’ లేదా ‘కురిపించాడు’ వంటి క్రియను సరఫరా చేయడం
  rationale: హెబ్రూ పాఠంలో ఈ చివరి పదాలకు ప్రత్యేక సమాపక క్రియ లేదు. డాష్‌తో ఆకస్మిక వరుసను నిలుపడం మూలంలోని కవితా ఉత్కంఠను కాపాడి, పాఠంలో లేని క్రియను చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గంభీరమైన కవితా లయతో రూపొందించబడింది. మొదటి రెండు పాదాల సమాంతర నిర్మాణం, చివరి పాదంలోని క్రియలేని ఆకస్మిక దృశ్యక్రమం నిలుపబడ్డాయి. ‘తన స్వరాన్ని ఇచ్చాడు’ అనే అక్షరానువాదం ప్రధాన పాఠంలో అసహజంగా ఉండటంతో సహజమైన నుడికారాన్ని వాడి, మూలరూపాన్ని పాదసూచికలో భద్రపరచాం.
