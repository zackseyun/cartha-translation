source:
  edition: WLC
  text: הָ/אֵל֮ תָּמִ֪ים דַּ֫רְכּ֥/וֹ אִמְרַֽת יְהוָ֥ה צְרוּפָ֑ה מָגֵ֥ן ה֝֗וּא לְ/כֹ֤ל הַ/חֹסִ֬ים בּֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/030.yaml
  text: As for God[a], his way is blameless; the word of Yahweh is refined[b]; he is a shield to all who take refuge in him.
translation:
  language: te
  text: 'దేవుని విషయమైతే, ఆయన మార్గం నిర్దోషమైనది;

    యాహ్వే వాక్యం అగ్నిలో శుద్ధిచేయబడినది[a];

    ఆయనను ఆశ్రయించే[a] వారందరికీ ఆయన డాలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పరీక్షించబడినది’ లేదా ‘శుద్ధమైనది.’ హీబ్రూ పదం అగ్నిలో లోహాన్ని శుద్ధిచేసి దాని స్వచ్ఛతను నిరూపించే చిత్రాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: దేవుని విషయానికొస్తే
  rationale: నిర్దిష్ట ఉపపదంతో వాక్యారంభంలో ఉన్న אֵל‌కు అంశప్రాధాన్యం ఉంది; ఈ తెలుగు ప్రయోగం దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תָּמִים דַּרְכּוֹ
  choice: ఆయన మార్గం నిర్దోషమైనది
  rationale: תָּמִים సంపూర్ణతను, లోపరాహిత్యాన్ని సూచిస్తుంది; דֶּרֶךְ ఇక్కడ దేవుని కార్యవిధానాన్ని సూచిస్తూ ‘మార్గం’ అనే రూపకాన్ని నిలుపుతుంది.
- source_word: אִמְרַת יְהוָה
  choice: యెహోవా మాట
  rationale: אִמְרָה పలుకు లేదా మాటను సూచిస్తుంది; יְהוָהను వ్యక్తిగత దైవనామంగా లిప్యంతరీకరించాం.
- source_word: צְרוּפָה
  choice: అగ్నిలో శుద్ధిచేయబడినదివంటిది
  rationale: צרף లోహాన్ని అగ్నిలో కరిగించి శుద్ధిచేయడం లేదా పరీక్షించడం అనే చిత్రాన్ని కలిగిస్తుంది; తెలుగులో ఆ రూపకం స్పష్టంగా వినిపించేలా అనువదించాం.
- source_word: מָגֵן הוּא
  choice: ఆయన డాలు
  rationale: מָגֵן‌ను సాధారణ పాఠకుడికి అర్థమయ్యే ‘డాలు’గా అనువదించి రక్షణ రూపకాన్ని నిలిపాం; నామవాక్యాన్ని తెలుగులో సహజంగా ఉంచాం.
- source_word: לְכֹל הַחֹסִים בּוֹ
  choice: ఆయనను ఆశ్రయించే వారందరికీ
  rationale: חסה అంటే రక్షణకోసం ఆశ్రయం పొందడం; విశ్వాసం అంతర్భూతమైనప్పటికీ, ఆశ్రయ రూపకాన్ని ప్రత్యక్షంగా నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా నిలిపాం. ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
- issue: צְרוּפָה యొక్క రూపకార్థం
  choice: అగ్నిలో శుద్ధిచేయబడినదివంటిది
  alternative: పరీక్షించబడినది
  rationale: లోహశుద్ధి చిత్రాన్ని నిలుపుతూ యెహోవా మాట నిరూపితమైన పవిత్రతను తెలియజేశాం; కేవలం ‘పరీక్షించబడినది’ అంటే శుద్ధత భావం కొంత తగ్గవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కవితా శైలిని ఉపయోగించాం. సమాంతర పాదాలను నిలిపి, అరుదైన పదాలకు పాదటీకల ద్వారా స్పష్టత ఇచ్చాం.
