    rationale: The governing English POB decision specifies ‘Yahweh’; Telugu should use the corresponding transliteration ‘యాహ్వే,’ rather than the alternative ‘యెహోవా.’
  - severity: medium
    issue: Footnote b is attached to the shield rather than to taking refuge
    rationale: The supplied audit trail identifies the lexical alternative for הַחֹסִים בּוֹ (‘take refuge/trust’). The anchor must follow ‘ఆశ్రయించే’ rather than ‘డాలు.’
