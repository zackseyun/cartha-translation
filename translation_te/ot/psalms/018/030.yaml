  terminology: Render יְהוָה consistently as ‘యాహ్వే’ in accordance with the English POB theological decision. Retain ‘డాలు’ as an accessible literal shield metaphor. Move the refuge footnote anchor from ‘డాలు’ to ‘ఆశ్రయించే,’ since that is the lexical item it documents.
