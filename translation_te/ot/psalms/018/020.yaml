base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/020.yaml
  text: Yahweh has dealt with me according to my righteousness[b][a]; according to the cleanness of my hands he has repaid me.
translation:
  language: te
  text: 'యాహ్వే నా నీతిని బట్టి నాకు ప్రతిఫలం ఇచ్చాడు[a];

    నా చేతుల శుద్ధిని బట్టి నాకు తిరిగి చెల్లించాడు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే నా నీతిని బట్టి నాతో వ్యవహరించాడు.”
    reason: lexical_alternative
  - marker: b
    text: “చేతుల శుద్ధి” అనేది నిర్దోషమైన లేదా యథార్థమైన ప్రవర్తనను సూచించే హీబ్రూ రూపకం.
    reason: cultural_note
lexical_decisions:
- source_word: יִגְמְלֵנִי
  choice: నాకు ప్రతిఫలం ఇచ్చాడు
  rationale: גמל ఇక్కడ వ్యక్తి ప్రవర్తనకు అనుగుణంగా వ్యవహరించడం లేదా ప్రతిఫలమివ్వడం అనే భావాన్ని కలిగిస్తుంది. సమాంతర పాదంలోని יָשִׁיב לִי సానుకూల ప్రతిఫల భావాన్ని బలపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణగా నిలుపుతుంది.
- source_word: כְּצִדְקִי
  choice: నా నీతిని బట్టి
  rationale: צדק ఇక్కడ సందర్భానుగుణమైన న్యాయవర్తన లేదా యథార్థతను సూచిస్తుంది; כְּ ప్రవర్తనకు అనుగుణమైన ప్రమాణాన్ని తెలియజేస్తుంది. మూలంలోని మొదటి పురుషుని వాదనను తగ్గించకుండా ఉంచుతుంది.
- source_word: כְּבֹר יָדַי
  choice: నా చేతుల శుద్ధిని బట్టి
  rationale: בֹּר యొక్క శుద్ధత భావాన్నీ, יָדַי అనే స్పష్టమైన శరీరరూపకాన్నీ నిలుపుతుంది. 'చేతుల శుద్ధి' నిర్దోషమైన లేదా యథార్థమైన ప్రవర్తనకు హీబ్రూ రూపకం.
- source_word: יָשִׁיב לִי
  choice: నాకు తిరిగి చెల్లించాడు
  rationale: שוב హిఫిల్ రూపం ఇక్కడ తగినదాన్ని తిరిగి ఇవ్వడం, ప్రతిఫలించడం అనే భావాన్ని ఇస్తుంది. 'తిరిగి చెల్లించాడు' మూల క్రియ యొక్క తిరుగుదల భావాన్ని, కవితా సమాంతరతను నిలుపుతుంది.
theological_decisions:
- issue: '''నా నీతి'' అనేది పాపరహిత పరిపూర్ణత లేదా స్వరక్షణగా అపార్థమయ్యే అవకాశం'
  choice: '''నా నీతిని బట్టి'' అనే మొదటి పురుషుని వాదనను యథాతథంగా నిలుపడం'
  alternative: '''నా నిర్దోషిత్వాన్ని బట్టి'' లేదా ''నా న్యాయమైన వ్యాజ్యాన్ని బట్టి'''
  rationale: హీబ్రూ పాఠం צדקకు మొదటి పురుష ఏకవచన స్వామ్యప్రత్యయాన్ని స్పష్టంగా ఉపయోగిస్తుంది. సిద్ధాంతపరమైన ఉద్రిక్తతను తొలగించేందుకు దానిని బలహీనపరచకూడదు; సందర్భంలో ఇది సంబంధిత విషయములో కీర్తనకర్త యొక్క యథార్థతను, దేవుని న్యాయనిర్ణయాన్ని సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి. రెండు సమాంతర పాదాలను నిలుపుతూ, 'నీతి' అనే ధార్మికంగా పారదర్శకమైన పదాన్నీ 'చేతుల శుద్ధి' అనే మూల రూపకాన్నీ కాపాడింది.
