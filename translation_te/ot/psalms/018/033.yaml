  yaml_path: translation/ot/psalms/018/033.yaml
  text: He makes my feet like the deer’s[b][a], and sets me on my heights.
translation:
  language: te
  text: ఆయన నా పాదాలను ఆడజింకల పాదాలవలె చేస్తాడు[a]; నా ఎత్తైన స్థలాల మీద నన్ను నిలబెడతాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ పదం ప్రత్యేకంగా ఆడజింకలను సూచిస్తుంది; వాటి వేగవంతమైన, జారిపోని అడుగులే ఈ పోలికలోని భావం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “నా ఎత్తైన స్థలాల మీద నన్ను నిలబడేలా చేస్తాడు.”
    reason: alternative_reading
lexical_decisions:
- source_word: מְשַׁוֶּה
  choice: చేస్తాడు
  rationale: పీయేల్ రూపం ఇక్కడ ‘వలె చేయడం’ అనే కారక భావాన్ని వ్యక్తం చేస్తుంది; పోలికతో కలిసి ‘చేస్తాడు’ సహజంగాను మూలానికి దగ్గరగాను ఉంది.
- source_word: רַגְלַי
  choice: నా పాదాలను
  rationale: רֶגֶל యొక్క సాధారణ అర్థం ‘పాదం’; చురుకైన, స్థిరమైన అడుగుల దృశ్యానికి ‘పాదాలు’ తగినది.
- source_word: כָּאַיָּלוֹת
  choice: ఆడజింకల పాదాలవలె
  rationale: אַיָּלוֹת స్త్రీలింగ బహువచనం; ఆడజింకల వేగం, నిశ్చితమైన అడుగులు అనే రూపకాన్ని తెలియజేస్తుంది. హెబ్రీ వాక్యంలో ‘పాదాలు’ రెండోసారి స్పష్టంగా లేకపోయినా, తెలుగులో పోలికను సహజంగా చేయడానికి దాన్ని పునరుక్తి చేశాం.
- source_word: בָּמוֹתַי
  choice: నా ఎత్తైన స్థలాల మీద
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయాన్ని కాపాడుతూ, בָּמוֹת యొక్క భౌగోళిక ‘ఎత్తైన స్థలాలు’ అనే భావాన్ని అందిస్తుంది; ఆరాధనా ఉన్నత స్థలాలు అనే అర్థాన్ని ఇక్కడ బలవంతంగా చేర్చదు.
- source_word: יַעֲמִידֵנִי
  choice: నన్ను నిలబెడతాడు
  rationale: עמד యొక్క హిఫీల్ రూపం ‘నిలబడేలా చేయడం/నిలబెట్టడం’ అని అర్థం. మూలంలో స్పష్టంగా లేని ‘సురక్షితంగా’ వంటి ఫలితభావాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
theological_decisions:
- issue: చురుకుదనం మరియు ఎత్తైన స్థలాల రూపకం
  choice: దేవుడు కీర్తనకర్తకు ఆడజింకలవంటి అడుగులను ఇచ్చి, అతని ఎత్తైన స్థలాల మీద నిలబెడుతున్న కవితాత్మక దృశ్యాన్ని యథాతథంగా ఉంచడం
  alternative: దీనిని స్పష్టంగా సైనిక విజయం లేదా ఆత్మీయ భద్రతగా వ్యాఖ్యానించడం
  rationale: విస్తృత సందర్భంలో యుద్ధం మరియు విమోచన భావాలు ఉన్నప్పటికీ, ఈ వచనం స్వయంగా రూపకభాషను వాడుతుంది. అనువాదం ఆ రూపకంలోని భావసంభావ్యతను కాపాడాలి; ఒకే వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో స్థిరపరచకూడదు.
- issue: ‘నా ఎత్తైన స్థలాలు’ అనే స్వామ్యార్థం
  choice: మసొరేటిక్ పాఠంలోని మొదటి పురుష ప్రత్యయాన్ని ‘నా’గా కాపాడడం
  alternative: ‘ఎత్తైన స్థలాల మీద’ అని సాధారణీకరించడం
  rationale: בָּמוֹתַיలోని ‘నా’ స్పష్టంగా ఉంది; దాన్ని తొలగించడానికి పాఠ్యాధారం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి. ‘ఆడజింకలు’ ద్వారా హెబ్రీ స్త్రీలింగ బహువచనం నిలుపబడింది. ‘సురక్షితంగా’ అనే వివరణాత్మక పదాన్ని మూలంలో స్పష్టంగా లేకపోవడం వల్ల చేర్చలేదు; ‘నిలబెడతాడు’ కారక క్రియను నేరుగా ప్రతిబింబిస్తుంది.
