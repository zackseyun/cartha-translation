id: PSA.18.37
reference: Psalms 18:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֶרְדּ֣וֹף א֭וֹיְבַ/י וְ/אַשִּׂיגֵ֑/ם וְ/לֹֽא אָ֝שׁוּב עַד כַּלּוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/037.yaml
  text: I pursued my enemies and overtook them[a], and I did not turn back until they were consumed.
translation:
  language: te
  text: 'నేను నా శత్రువులను తరిమి పట్టుకున్నాను;

    వారు పూర్తిగా నశించే వరకు[a] నేను వెనుదిరగలేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “వారి అంతం సంపూర్ణమయ్యే వరకు” లేదా “వారు పూర్తిగా క్షీణించిపోయే వరకు.”
    reason: כלה అనే పదం ‘ముగియడం, క్షీణించడం, పూర్తిగా నశించడం’ అనే భావాలను కలిగి ఉండి, ఇక్కడ కర్తను స్పష్టంగా పేర్కొనదు.
lexical_decisions:
- source_word: אֶרְדּוֹף
  choice: నేను ... తరిమి
  rationale: רדף అనే క్రియకు సైనిక సందర్భంలో ‘వెంటాడుట/తరుముట’ అనే భావం ఉంది. చుట్టుపక్కల ఉన్న విజయవర్ణనను బట్టి అసంపూర్ణ క్రియారూపాన్ని గతకాల చర్యగా అనువదించాం.
- source_word: אֹיְבַי
  choice: నా శత్రువులను
  rationale: אויבకు ఉన్న ప్రత్యక్షమైన విరోధ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְאַשִּׂיגֵם
  choice: పట్టుకున్నాను
  rationale: נשׂג హిఫీల్ రూపం వెంటాడి చేరుకోవడం లేదా పట్టుకోవడం అని సూచిస్తుంది. ‘తరిమి పట్టుకున్నాను’ అనే కలయిక సైనిక వెంటాడటాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְלֹא אָשׁוּב
  choice: నేను వెనుదిరగలేదు
  rationale: ఈ సందర్భంలో שוב సాధారణంగా తిరిగి రావడం కంటే వెంటాడటం మానుకొని వెనక్కి తిరగడాన్ని సూచిస్తుంది.
- source_word: עַד
  choice: వరకు
  rationale: చర్య ముగిసే కాలపరమైన హద్దును సూచిస్తుంది.
- source_word: כַּלּוֹתָם
  choice: వారు పూర్తిగా నశించే
  rationale: כלה యొక్క క్రియానామ రూపం వారి అంతం లేదా సంపూర్ణ వినాశాన్ని సూచిస్తుంది; కర్తను స్పష్టంగా పేర్కొనదు. ఈ అనువాదం ఆ సంపూర్ణతను నిలుపుతూ కర్తను చేర్చదు.
theological_decisions:
- issue: చివరి పదబంధంలో హింస మరియు కర్త అంతర్భావం
  choice: ‘వారు పూర్తిగా నశించే వరకు’ అని అనువదించి సంపూర్ణ ఓటమిని స్పష్టంగా ఉంచడం, కానీ వారిని నాశనం చేసిన కర్తను అదనంగా పేర్కొనకపోవడం
  alternative: ‘నేను వారిని పూర్తిగా నాశనం చేసే వరకు’
  rationale: హీబ్రూ పాఠం శత్రువుల సంపూర్ణ అంతాన్ని తెలియజేస్తుంది, అయితే చివరి క్రియానామంలో కర్తను బహిరంగంగా పేర్కొనదు. కాబట్టి సైనిక హింసను మృదువు చేయకుండా, మూలంలోని వ్యాకరణ అనిశ్చితిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తన కవిత్వానికి తగిన సంక్షిప్తమైన, గంభీరమైన శైలి. ‘తరిమి పట్టుకున్నాను’ సాధారణ పాఠకులకు స్పష్టంగా ఉండగా సైనిక సందర్భాన్ని నిలుపుతుంది; ‘పూర్తిగా నశించే వరకు’ మూలంలోని సంపూర్ణతను తెలియజేస్తుంది.
