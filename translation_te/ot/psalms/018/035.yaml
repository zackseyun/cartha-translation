  yaml_path: translation/ot/psalms/018/035.yaml
  text: You gave me the shield of your salvation[a], and your right hand supported me, and your humility made me great.
translation:
  language: te
  text: 'నీవు నీ రక్షణ అనే డాలును నాకు ఇచ్చావు;

    నీ కుడిచేయి నన్ను ఆదుకుంది;

    నీ వినయం[a] నన్ను గొప్పగా చేసింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ సౌమ్యత.’ హీబ్రూ పదం వినయం, దీనత్వం, లేదా సౌమ్యతను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: ఇచ్చావు
  rationale: נתן క్రియ యొక్క కవితాత్మక గతకాల కథన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מָגֵן
  choice: డాలు
  rationale: రక్షణ కోసం చేతిలో ధరించే shield అనే నిర్దిష్ట చిత్రాన్ని ‘కవచం’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: יִשְׁעֶךָ
  choice: నీ రక్షణ
  rationale: వెంటనే కలిగే విడిపింపుతో పాటు విస్తృతమైన రక్షణ భావాన్ని కూడా నిలుపుతుంది; నిర్మాణ సంబంధాన్ని సహజంగా చూపేందుకు ‘నీ రక్షణ అనే డాలు’ అని కూర్చబడింది.
- source_word: וִימִינְךָ
  choice: నీ కుడిచేయి
  rationale: బలం, క్రియాశీల సహాయం సూచించే మూలభాషా శరీరరూపకాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: תִסְעָדֵנִי
  choice: నన్ను ఆదుకుంది
  rationale: సహాయం చేసి నిలబెట్టడం అనే סעד భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְעַנְוַתְךָ
  choice: నీ వినయం
  rationale: దేవుడు తనను తాను తగ్గించుకొని సహాయం చేయడంలోని ఆశ్చర్యకరమైన భావాన్ని మృదువుపరచకుండా నిలుపుతుంది; ‘సౌమ్యత’ సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: תַרְבֵּנִי
  choice: నన్ను గొప్పవానిగా చేసింది
  rationale: רבה హిఫీల్ రూపంలోని ‘గొప్పగా చేయడం/వృద్ధి చేయడం’ అనే సందర్భోచిత భావాన్ని సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: దేవునికి అన్వయించిన וְעַנְוַתְךָ పదార్థం
  choice: నీ వినయం
  alternative: నీ సౌమ్యత
  rationale: హీబ్రూ పదం వినయం, దీనత్వం, సౌమ్యత వంటి భావాలను అనుమతిస్తుంది. దేవుని ‘వినయం’ అని చెప్పడంలోని వేదాంతపరమైన ఉద్వేగాన్ని తొలగించకుండా ప్రధాన పాఠ్యంలో ఉంచి, సాధ్యమైన మరో అర్థాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి. ‘కుడిచేయి’ అనే బైబిలీయ రూపకం నిలుపబడింది; అరుదైన లేదా పురాతన పదాలకు బదులుగా సాధారణ పాఠకులకు అర్థమయ్యే పదాలు ఎంచుకోబడ్డాయి.
