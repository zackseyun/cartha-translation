source:
  edition: WLC
  text: וְֽ/אֹיְבַ֗/י נָתַ֣תָּה לִּ֣/י עֹ֑רֶף וּ֝/מְשַׂנְאַ֗/י אַצְמִיתֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/040.yaml
  text: You gave me the backs of my enemies[a]; I destroyed those who hated me.
translation:
  language: te
  text: 'నా శత్రువులు నాకు వెన్నుచూపేలా చేశావు[a];

    నన్ను ద్వేషించినవారిని నేను నిర్మూలించాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో పదశః, “నా శత్రువుల మెడను నాకు ఇచ్చావు.” ఇది శత్రువులు వెనుదిరిగి పారిపోవడం లేదా ఓడిపోవడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבַי
  choice: నా శత్రువులు
  rationale: אֹיֵב అనే పదానికి ప్రథమ పురుష ఏకవచన ప్రత్యయం జతైంది. ఆధునిక ప్రామాణిక తెలుగులో ‘నా శత్రువులు’ సహజమైన, స్పష్టమైన సమానం.
- source_word: נָתַתָּה לִּי
  choice: నాకు … చేశావు
  rationale: నిర్దిష్టంగా ‘నాకు ఇచ్చావు’ అనే నిర్మాణం ఉన్నప్పటికీ, עֹרֶףతో కలిసిన జాతీయ ప్రయోగాన్ని సహజ తెలుగులో తెలియజేయడానికి కారణార్థక నిర్మాణం వాడబడింది; కర్తగా ‘దేవుడు’ అనే పదాన్ని మూలంలో లేనందున చేర్చలేదు.
- source_word: עֹרֶף
  choice: వెన్నుచూపేలా
  rationale: పదశః ‘మెడ వెనుకభాగం/మూపు.’ శత్రువులు తిరిగి పారిపోవడం లేదా ఓడిపోవడం అనే భావాన్ని తెలుగులో ‘వెన్నుచూపడం’ సహజంగా తెలియజేస్తుంది; మూలంలోని శరీరభాగపు రూపకమూ కొంత నిలుస్తుంది.
- source_word: וּמְשַׂנְאַי
  choice: నన్ను ద్వేషించినవారిని
  rationale: שׂנא ధాతువు నుండి వచ్చిన కృదంత రూపం, ప్రథమ పురుష ప్రత్యయంతో, తనను ద్వేషించే ప్రత్యర్థుల వర్గాన్ని సూచిస్తుంది. ఈ రూపం తెలుగులో సహజంగా ఉంది.
- source_word: אַצְמִיתֵם
  choice: నేను నిర్మూలించాను
  rationale: צמת హిఫీల్ రూపం నశింపజేయడం లేదా పూర్తిగా అంతం చేయడం అనే బలమైన భావాన్ని ఇస్తుంది. ‘నిర్మూలించాను’ ఆ తీవ్రతను సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: עֹרֶףలోని శత్రువుల ఓటమిని సూచించే జాతీయ రూపకం
  choice: ‘నా శత్రువులు నాకు వెన్నుచూపేలా చేశావు’ అని భావస్పష్టంగా, రూపకాన్ని కొంత నిలుపుతూ అనువదించబడింది.
  alternative: ‘నా శత్రువుల మెడను నాకు ఇచ్చావు’ అని పదశః అనువదించడం.
  rationale: పదశః తెలుగు అసహజంగా ఉండి భావాన్ని తప్పుగా సూచించవచ్చు. ఎంపిక చేసిన రూపం శత్రువులు తిరిగి పారిపోయే దృశ్యాన్ని తెలియజేస్తూ, దేవుడు విజయాన్ని కలిగించాడనే మూల భావాన్ని అదనపు సిద్ధాంత వివరణ లేకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గంభీరతతో పాటు సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. మొదటి పాదంలో మూల రూపకాన్ని సహజ తెలుగు జాతీయ ప్రయోగంతో వ్యక్తం చేశారు.
