  yaml_path: translation/ot/psalms/018/049.yaml
  text: Therefore I will give thanks to you among the nations[a], O Yahweh, and I will sing praise to your name.
translation:
  language: te
  text: 'కాబట్టి యాహ్వే, దేశాల మధ్య[a] నీకు కృతజ్ఞతలు చెల్లిస్తాను;

    నీ నామానికి స్తుతిగీతం పాడుతాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “దేశాల మధ్య”; సందర్భానుసారం “యూదేతరుల మధ్య” అని కూడా అనువదించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: కాబట్టి
  rationale: ముందున్న సందర్భం నుంచి వచ్చే ఫలితాన్ని లేదా ముగింపును సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אוֹדְךָ
  choice: నీకు కృతజ్ఞతలు చెల్లిస్తాను
  rationale: కీర్తనల సందర్భంలో ידה పదానికి ఉన్న కృతజ్ఞత ప్రకటించే భావాన్ని, రెండవ పురుష ఏకవచన ప్రత్యయాన్ని నిలుపుతుంది.
- source_word: בַגּוֹיִם
  choice: దేశాల మధ్య
  rationale: גוים అనే పదంలోని అంతర్జాతీయ పరిధిని సహజంగా వ్యక్తం చేస్తుంది; సందర్భానుసారం ఇది యూదేతరులను కూడా సూచించవచ్చు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: וּלְשִׁמְךָ
  choice: నీ నామాన్ని
  rationale: తెలుగులో ‘స్తుతిస్తూ పాడడం’ అనే క్రియతో సహజంగా కలిసే విధంగా ఇచ్చి, దేవుని నామమే స్తుతికి లక్ష్యమనే భావాన్ని నిలుపుతుంది.
- source_word: אֲזַמֵּרָה
  choice: స్తుతిస్తూ పాడుతాను
  rationale: זמר పీయేల్ రూపంలోని సంగీతంతో కూడిన స్తుతి భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత దైవ నామం ప్రత్యక్షంగా ఉంది. దానిని ‘ప్రభువు’ వంటి బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గౌరవభరితమైన, సులభంగా అర్థమయ్యే శైలి. హీబ్రూ సమాంతర నిర్మాణాన్ని రెండు పాదాలుగా నిలిపాం.
