source:
  edition: WLC
  text: כִּֽי שָׁ֭מַרְתִּי דַּרְכֵ֣י יְהוָ֑ה וְ/לֹֽא רָ֝שַׁ֗עְתִּי מֵ/אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/021.yaml
  text: For I have kept the ways of Yahweh[b][a], and have not wickedly departed from my God.
translation:
  language: te
  text: ఎందుకంటే నేను యెహోవా మార్గాలను పాటించాను; నా దేవుని నుండి దుర్మార్గంగా వైదొలగలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా దేవుని నుండి వైదొలగడం ద్వారా దుర్మార్గంగా ప్రవర్తించలేదు.” హీబ్రూ క్రియకు అక్షరార్థంగా “దుర్మార్గంగా ప్రవర్తించాను” అనే భావం ఉంది; దాని వెంట వచ్చే పదబంధం దేవుని నుండి వేరుపడడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలో చేసిన ప్రకటనకు కారణాన్ని లేదా వివరణను పరిచయం చేస్తుంది.
- source_word: שָׁמַרְתִּי
  choice: పాటించాను
  rationale: שׁמר అనే పదానికి ‘కాపాడు, ఆచరించు, పాటించు’ అనే అర్థాలున్నాయి; దేవుని మార్గాల సందర్భంలో ‘పాటించాను’ సహజంగా ఉండి విధేయత భావాన్ని నిలుపుతుంది.
- source_word: דַּרְכֵי
  choice: మార్గాలను
  rationale: ఇది అక్షరార్థంలోని దారులను కాక, యెహోవా నిర్దేశించిన జీవన విధానాన్ని సూచిస్తుంది; ‘మార్గాలు’ ఆ రూపకాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: רָשַׁעְתִּי מֵאֱלֹהָי
  choice: నా దేవుని విడిచి దుర్మార్గంగా నడుచుకోలేదు
  rationale: רשׁע ‘దుర్మార్గంగా ప్రవర్తించు’ అనే భావాన్ని, מִן ‘నుండి/విడిచి’ అనే సంబంధాన్ని కలిపి సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; దేవుని నుండి వైదొలగడమే ఇక్కడ దుర్మార్గపు చర్యగా సూచితమవుతుంది.
theological_decisions:
- issue: కీర్తనకర్త తన నీతిని ప్రకటించడం సంపూర్ణ పాపరాహిత్యంగా వినిపించే అవకాశం
  choice: యెహోవా మార్గాలను పాటించానని, తన దేవుని విడిచి దుర్మార్గంగా నడుచుకోలేదని తెలిపే నిబంధనా విశ్వాస్యతకు సంబంధించిన ప్రకటనగా అనువదించడం
  alternative: ‘నేను అసలు దుర్మార్గుడను కాలేదు’ వంటి సంపూర్ణ పాపరాహిత్యాన్ని సూచించే అనువాదం
  rationale: హీబ్రూ వాక్యం బలమైన యథార్థత ప్రకటన చేస్తూనే, దానిని దేవుని మార్గాలను పాటించడం మరియు ఆయనను విడిచి వైదొలగకపోవడం అనే సంబంధపూర్వక భాషలో ఉంచుతుంది. ఈ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘పాటించాను’ విధేయత భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘దుర్మార్గంగా నడుచుకోలేదు’ కీర్తనా శైలికి తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది.
