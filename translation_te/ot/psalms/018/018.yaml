  source_fidelity: మూల హీబ్రూ వచనంలోని రెండు అర్ధపాదాల భావాన్ని అనువాదం నమ్మకంగా ప్రతిబింబిస్తుంది. “వారు నన్ను ఎదుర్కొన్నారు” అనేది יְקַדְּמוּנִי యొక్క శత్రుత్వ సందర్భానికి సరిపోతుంది; “నా విపత్తు రోజున” అֵידִי యొక్క విపత్తు/ఆపద భావాన్ని కాపాడుతుంది. “అయితే యాహ్వే నాకు ఆధారమయ్యాడు” వాక్యంలోని విరోధ భావాన్నీ, לְמִשְׁעָן לִי లోని ‘నాకు ఆధారం’ భావాన్నీ సహజంగా తెలియజేస్తుంది.
