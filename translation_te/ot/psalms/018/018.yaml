  terminology: యְהוָהను “యాహ్వే”గా ధ్వన్యనువదించడం ఇచ్చిన అనువాద విధానానికి, మూలంలోని వ్యక్తిగత దైవనామానికి అనుగుణంగా ఉంది. “ఆధారం” మִשְׁעָן యొక్క రూపకమైన ఆసరా/ఆధార భావాన్ని సముచితంగా వ్యక్తం చేస్తుంది.
