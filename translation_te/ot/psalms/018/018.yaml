id: PSA.18.18
reference: Psalms 18:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יְקַדְּמ֥וּ/נִי בְ/יוֹם אֵידִ֑/י וַֽ/יְהִי יְהוָ֖ה לְ/מִשְׁעָ֣ן לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/018.yaml
  text: They confronted me in the day of my calamity[a], but Yahweh was my support.
translation:
  language: te
  text: నా విపత్తు రోజున వారు నన్ను ఎదుర్కొన్నారు[a]; అయితే యాహ్వే నాకు ఆధారమయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారు నాపైకి వచ్చారు’; లేదా ‘వారు నాకు ఎదురుపడ్డారు.’
    reason: יְקַדְּמוּנִי అనే పదం శత్రుత్వంతో ఎదుర్కోవడాన్ని సూచించవచ్చు; అయితే దాని ప్రాథమిక భావం ‘ముందుకు వచ్చి కలుసుకోవడం/ఎదురుపడడం’ కావడం వల్ల ఈ ప్రత్యామ్నాయాలు సాధ్యమే.
lexical_decisions:
- source_word: יְקַדְּמוּנִי
  choice: వారు నన్ను ఎదుర్కొన్నారు
  rationale: קדמ అనే ధాతువు పియేల్ రూపంలో ఇక్కడ ‘ముందుకు వచ్చి కలుసుకోవడం/ఎదురుపడడం’ అనే భావాన్ని ఇస్తుంది. శత్రుత్వ సందర్భంలో ‘ఎదుర్కొన్నారు’ సహజంగా ఉండి, దాడి చేశారని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: בְיוֹם אֵידִי
  choice: నా విపత్తు రోజున
  rationale: אֵידִי అనేది వ్యక్తిగత భావోద్వేగ బాధకే పరిమితం కాకుండా విపత్తు, వినాశకర పరిస్థితి అనే విస్తృత భావాన్ని కలిగి ఉంది. ‘విపత్తు’ ఆ భావపరిధిని కాపాడుతుంది.
- source_word: וַיְהִי
  choice: అయితే ... ఆధారమయ్యాడు
  rationale: היה యొక్క ఈ రూపం ‘ఉన్నాడు’ లేదా ‘అయ్యాడు’ అనే భావాన్ని ఇవ్వగలదు. మొదటి అర్ధపాదంలోని శత్రుత్వానికి వ్యతిరేకంగా ఉన్న భావసంబంధాన్ని ‘అయితే’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: మూలపాఠంలోని దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యనువాదం చేయబడింది.
- source_word: לְמִשְׁעָן לִי
  choice: నాకు ఆధారమయ్యాడు
  rationale: מִשְׁעָן అనేది ఆనుకోవడానికి లేదా నిలబడడానికి తోడ్పడే ఆధారాన్ని సూచిస్తుంది. రూపకార్థాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఆధారం’ సముచితంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: వచనంలో బిరుదు కాకుండా יהוה అనే వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దాన్ని ‘ప్రభువు’గా మార్చకుండా ‘యాహ్వే’గా ధ్వన్యనువదించడం మూలపాఠ భేదాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గంభీరతతో కూడిన సరళమైన శైలి వాడబడింది. ‘ఎదుర్కొన్నారు’ సందర్భంలోని శత్రుత్వాన్ని తెలియజేస్తూనే సైనిక దాడి అనే భావాన్ని అతిగా చేర్చదు; పదంలోని విస్తృతార్థం పాదసూచికలో నిలుపబడింది.
