  text: The sons of foreigners fade away and come trembling out of their strongholds[a][b][c].
translation:
  language: te
  text: 'పరదేశీయుల కుమారులు[a] వాడిపోతారు;

    తమ కోటల్లోనుండి[c] వణుకుతూ బయటికి వస్తారు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘పరదేశితనపు కుమారులు’ లేదా ‘పరదేశీయుల కుమారులు’; భావార్థంగా ‘పరదేశీయులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘వణుకుతూ బయటికి వస్తారు’ అని అనువదించిన హీబ్రూ క్రియ అరుదైనది; దాని అర్థం నిశ్చితం కాదు. ‘అణకువగా బయటికి వస్తారు’ లేదా ‘కుంటుతూ బయటికి వస్తారు’ అనే భావాలు కూడా సాధ్యమే.
    reason: lexical_alternative
  - marker: c
    text: ‘కోటలు’ అనే పదాన్ని ‘దుర్గాలు’ లేదా మరింత సాధారణంగా ‘మూసివేసిన ఆవరణలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: పరదేశీయుల కుమారులు
  rationale: హీబ్రూ పదబంధంలోని ‘కుమారులు’ అనే కావ్యరూపాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉండేలా అనువదించబడింది.
- source_word: יִבֹּלוּ
  choice: వాడిపోతారు
  rationale: נבל అనే క్రియకు ప్రాథమికంగా ‘వాడిపోవడం, క్షీణించడం’ అనే భావం ఉంది. ఓడిపోయిన శత్రువుల బలం క్షీణించడాన్ని ఈ పదం కావ్యాత్మకంగా తెలియజేస్తుంది.
- source_word: וְיַחְרְגוּ
  choice: వణుకుతూ బయటికి వస్తారు
  rationale: חרג అరుదైన, అర్థం పూర్తిగా నిశ్చితం కాని క్రియ. ఈ సందర్భంలో భయంతో లేదా కలవరంతో బయటికి రావడం అనే సంభావ్య భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; అనిశ్చితిని పాదసూచికలో ఉంచింది.
- source_word: מִמִּסְגְּרוֹתֵיהֶם
  choice: తమ కోటల్లోనుండి
  rationale: మూసివేసిన లేదా రక్షిత ప్రదేశాలను సూచించే ఈ నామవాచకానికి యుద్ధసందర్భంలో ‘కోటలు’ సరిపోతుంది. విస్తృతమైన ‘ఆవరణలు’ అనే భావసంభావ్యతను పాదసూచికలో నిలిపింది.
