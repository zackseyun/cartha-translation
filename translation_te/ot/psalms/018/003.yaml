source:
  edition: WLC
  text: מְ֭הֻלָּל אֶקְרָ֣א יְהוָ֑ה וּ/מִן אֹ֝יְבַ֗/י אִוָּשֵֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/003.yaml
  text: I call on Yahweh[a], who is worthy to be praised[b], and I am saved from my enemies.
translation:
  language: te
  text: 'స్తుతికి అర్హుడైన యాహ్వేకు[b] నేను మొరపెడతాను;

    నా శత్రువుల నుండి రక్షించబడతాను.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ క్రియారూపాన్ని భవిష్యత్తు భావంతోనూ, సాధారణమైన లేదా నిశ్చయమైన ఫలిత భావంతోనూ అర్థం చేసుకోవచ్చు; ‘నేను రక్షణ పొందుతాను’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో ఇక్కడ YHWH అనే దైవనామం ఉంది; దాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
    reason: alternative_reading
lexical_decisions:
- source_word: מְהֻלָּל
  choice: స్తుతికి అర్హుడైన
  rationale: הלל ధాతువు యొక్క పుయల్ కృదంతం ఇక్కడ యాహ్వేను విశేషించే విధంగా ఉంది. ‘స్తుతికి అర్హుడైన’ అనేది కేవలం ‘స్తుతించబడిన’ అనే అర్థం కంటే మూలంలోని ప్రశంసార్హత భావాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶקְרָא
  choice: నేను మొరపెడతాను
  rationale: దేవుని నామంతో వచ్చిన קרא ఆయనకు ప్రార్థనాపూర్వకంగా పిలుపునివ్వడం లేదా మొరపెట్టడం అనే భావాన్ని ఇస్తుంది. ‘మొరపెడతాను’ సాధారణ పిలుపు అనే అపార్థాన్ని నివారిస్తూ కీర్తన సందర్భానికి సరిపోతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: చతురక్షర దైవనామం YHWHను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సాధారణ లిప్యంతరీకరణ ‘యాహ్వే’గా ఇచ్చాం.
- source_word: וּמִן
  choice: … నుండి
  rationale: ו conjunction రెండు పాదాలను కలుపుతుంది; מן విడిపించబడే మూలాన్ని సూచిస్తుంది. తెలుగు పద్య ప్రవాహంలో రెండో పాదాన్ని సమాంతరంగా ఉంచడం ద్వారా అనుసంధానం సహజంగా వ్యక్తమవుతుంది; మూలంలో స్పష్టంగా లేని కారణార్థాన్ని చేర్చలేదు.
- source_word: אֹיְבַי
  choice: నా శత్రువుల నుండి
  rationale: אֹיֵב పదానికి మొదటి పురుష ఏకవచన ప్రత్యయం ఉంది. ‘నా శత్రువులు’ దానికి నేరుగా, స్పష్టంగా సరిపోతుంది.
- source_word: אִוָּשֵׁעַ
  choice: రక్షించబడతాను
  rationale: ישׁע ధాతువు నిఫల్ అసంపూర్ణ క్రియారూపాన్ని భవిష్యత్తు/నిశ్చయ భావంతో సహజంగా తెలుగులో వ్యక్తం చేస్తుంది. సందర్భంలో సాధారణ లేదా ఫలితార్థ వర్తమాన భావం కూడా సాధ్యమని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలరూపాన్ని సంరక్షిస్తుంది.
- issue: אִוָּשֵׁעַ క్రియ యొక్క కాల/దృక్కోణ భావం
  choice: భవిష్యత్తు లేదా నిశ్చయ భావం—‘రక్షించబడతాను’
  alternative: సాధారణ/ఫలితార్థ భావం—‘రక్షణ పొందుతాను’ లేదా సందర్భానుసారంగా ‘రక్షించబడుతున్నాను’
  rationale: హీబ్రూ అసంపూర్ణ క్రియారూపం భవిష్యత్తు సంఘటనను గానీ, పునరావృతమైన లేదా నిశ్చితమైన ఫలితాన్ని గానీ సూచించగలదు. ప్రధాన పాఠంలో సహజమైన భవిష్యత్తు రూపాన్ని ఎంచుకుని, ఇతర సాధ్య భావాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే కీర్తనా శైలిని వాడాం. హీబ్రూ పాద సమాంతరతను నిలుపుతూ, తెలుగులో అసహజమైన పదక్రమాన్ని నివారించాం.
