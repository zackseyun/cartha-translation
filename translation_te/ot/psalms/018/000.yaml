source:
  edition: WLC
  text: לַ/מְנַצֵּ֤חַ לְ/עֶ֥בֶד יְהוָ֗ה לְ/דָ֫וִ֥ד אֲשֶׁ֤ר דִּבֶּ֨ר לַ/יהוָ֗ה אֶת דִּ֭בְרֵי הַ/שִּׁירָ֣ה הַ/זֹּ֑את בְּ/י֤וֹם הִֽצִּיל יְהוָ֘ה אוֹת֥/וֹ מִ/כַּ֥ף כָּל אֹ֝יְבָ֗י/ו וּ/מִ/יַּ֥ד שָׁאֽוּל׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/000.yaml
  text: For the choirmaster[a]. Of David, the servant of Yahweh[b], who spoke to Yahweh the words of this song on the day when Yahweh rescued him from the hand of all his enemies and from the hand of Saul.
translation:
  language: te
  text: సంగీత నాయకునికి. యాహ్వే సేవకుడైన[a] దావీదుది. యాహ్వే అతన్ని అతని శత్రువులందరి చేతిలోనుండి[b], సౌలు చేతిలోనుండి విడిపించిన రోజున దావీదు యాహ్వేకు ఈ గీతంలోని మాటలను పలికాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యాహ్వే దాసుడైన’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం సేవకుణ్ణి లేదా దాసుణ్ణి సూచించగలదు; ఇక్కడ అది దావీదుకు గౌరవసూచకమైన బిరుదుగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘చేతిలోనుండి.’ ఇది ఒకరి అధికారం లేదా నియంత్రణ నుంచి విడిపించడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకునికి
  rationale: కీర్తనల శీర్షికల్లో సంగీత నిర్వహణ బాధ్యత వహించే నాయకునికి ఉద్దేశించిన సూత్రప్రాయ పదబంధం; ఆధునిక తెలుగులో సహజంగా, విస్తృత అర్థంతో ఉంటుంది.
- source_word: לְעֶבֶד
  choice: సేవకుడైన
  rationale: עבד అనే పదానికి ‘దాసుడు’ అనే అర్థం కూడా ఉన్నప్పటికీ, ఇక్కడ దావీదుకు గౌరవసూచకమైన బిరుదుగా వాడబడింది; అందువల్ల ‘సేవకుడు’ సందర్భోచితం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని ఉచ్చారణకు సమీపమైన రూపంగా లిప్యంతరీకరించబడింది.
- source_word: לְדָוִד
  choice: దావీదుది
  rationale: కీర్తన శీర్షికలోని సంబంధార్థక לְ నిర్మాణాన్ని రచన/అనుబంధం రెండింటికీ వీలుండే సంక్షిప్త తెలుగు రూపంలో ఉంచుతుంది.
- source_word: אֲשֶׁר דִּבֶּר לַיהוָה
  choice: దావీదు యాహ్వేకు ... పలికాడు
  rationale: దావీదు యాహ్వేను ఉద్దేశించి పలికాడనే మూలంలోని వ్యక్తిగత సంబంధాన్ని నేరుగా వ్యక్తపరుస్తుంది.
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: ఈ గీతంలోని మాటలను
  rationale: ‘ఈ గీతపు మాటలు’ అనే మూల నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בְּיוֹם
  choice: రోజున
  rationale: సంఘటన జరిగిన కాలాన్ని సూచించే మూలంలోని ఏకవచన కాలనిర్మాణాన్ని నిలుపుతుంది.
- source_word: הִצִּיל
  choice: విడిపించిన
  rationale: ప్రమాదం మరియు శత్రువుల అధికారం నుంచి రక్షించి బయటకు తేవడం అనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: מִכַּף / וּמִיַּד
  choice: చేతిలోనుండి
  rationale: ‘చేతి’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ, ఒకరి అధికారం లేదా పట్టునుంచి విడిపించడాన్ని తెలుగులో అర్థమయ్యేలా చేస్తుంది.
- source_word: כָּל אֹיְבָיו
  choice: అతని శత్రువులందరి
  rationale: సమూహ సంపూర్ణతను మరియు దావీదుతో ఉన్న సంబంధాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతుంది; దాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: עֶבֶד ను సేవకుడా, దాసుడా అని అనువదించడం
  choice: సేవకుడు
  alternative: దాసుడు
  rationale: ఈ రాజసంబంధమైన కీర్తన శీర్షికలో ఈ పదం దావీదుకు యాహ్వేతో ఉన్న విధేయతా సంబంధాన్ని తెలిపే గౌరవబిరుదుగా పనిచేస్తుంది; బానిస స్థితిని ప్రధానంగా చూపదు.
- issue: ‘చేతిలోనుండి’ అనే రూపకాన్ని నిలుపడం
  choice: చేతిలోనుండి
  alternative: అధికారం నుండి / పట్టునుండి
  rationale: హీబ్రూ కవితా రూపకాన్ని నిలుపుతూ, పాదటిప్పణి ద్వారా అది అధికారం లేదా నియంత్రణను సూచిస్తుందని స్పష్టం చేయబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. శీర్షిక స్వభావాన్ని చూపేందుకు మొదటి రెండు చిన్న వాక్యాలు సంక్షిప్తంగా ఉంచబడ్డాయి; హీబ్రూ ‘చేతి’ రూపకం పాదటిప్పణితో సహా నిలుపబడింది.
