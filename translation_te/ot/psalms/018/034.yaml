  text: מְלַמֵּ֣ד יָ֭דַ/י לַ/מִּלְחָמָ֑ה וְֽ/נִחֲתָ֥ה קֶֽשֶׁת נְ֝חוּשָׁ֗ה זְרוֹעֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/034.yaml
  text: He trains my hands for battle[a], and my arms can bend a bow of bronze.
translation:
  language: te
  text: 'యుద్ధం కోసం ఆయన నా చేతులకు శిక్షణ ఇస్తాడు;

    నా బాహువులు కంచు విల్లును వంచగలవు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “కంచు విల్లు నా బాహువులచేత వంచబడుతుంది.” ఈ హీబ్రూ ఉపవాక్యం క్లిష్టమైనది; దీనిని కర్మణి అర్థంలో కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: מְלַמֵּד
  choice: శిక్షణ ఇస్తాడు
  rationale: למד క్రియారూపం ‘నేర్పు’ లేదా ‘శిక్షణ ఇవ్వు’ అనే అర్థాలను ఇస్తుంది. యుద్ధ సందర్భంలో ఆచరణాత్మక సన్నద్ధతను ‘శిక్షణ ఇస్తాడు’ సహజంగా తెలియజేస్తుంది.
- source_word: יָדַי
  choice: నా చేతులకు
  rationale: మూలంలోని బహువచన శరీరచిత్రాన్ని నిలుపుతూ, తెలుగులో ‘శిక్షణ ఇస్తాడు’తో సహజంగా దత్తివిభక్తిలో ఇచ్చాం.
- source_word: לַמִּלְחָמָה
  choice: యుద్ధానికి
  rationale: מלחמה యొక్క సైనిక భావాన్ని స్పష్టంగా, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְנִחֲתָה
  choice: వంచగలవు
  rationale: ఈ క్రియారూపం, వాక్యనిర్మాణం క్లిష్టమైనవి. సందర్భంలోని దైవిక బలపరచడం వల్ల కలిగిన సామర్థ్యాన్ని తెలుగులో సహజంగా తెలిపేందుకు సామర్థ్యార్థక రూపాన్ని ఎంచుకున్నాం; సాధ్యమైన కర్మణి అర్థాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: קֶשֶׁת נְחוּשָׁה
  choice: కంచు విల్లును
  rationale: קשת ఆయుధమైన ‘విల్లు’; נחושה ఇక్కడ రాగి/కంచు లోహాన్ని సూచించవచ్చు. బలమైన ఆయుధచిత్రానికి సంప్రదాయబద్ధంగా, సహజంగా ఉండే ‘కంచు’ను ఎంచుకున్నాం.
- source_word: זְרוֹעֹתָי
  choice: నా భుజాలు
  rationale: זרועות శక్తిని ప్రయోగించే చేతులు/బాహువులను సూచిస్తుంది. ‘నా భుజాలు’ తెలుగులో శారీరక బలం మరియు విల్లు వంచే చర్యను సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: וְנִחֲתָה קֶשֶׁת נְחוּשָׁה זְרוֹעֹתָי అనే క్లిష్ట ఉపవాక్యపు అర్థం
  choice: ‘నా భుజాలు కంచు విల్లును వంచగలవు’—దేవుడు అనుగ్రహించిన సామర్థ్యాన్ని వ్యక్తం చేసే పఠనం.
  alternative: ‘కంచు విల్లు నా భుజాలచేత వంచబడుతుంది’ అనే మరింత అక్షరార్థ కర్మణి పఠనం.
  rationale: హీబ్రూ వాక్యం సంక్షిప్తంగాను వాక్యనిర్మాణపరంగా క్లిష్టంగాను ఉంది. ప్రధాన అనువాదం కవితా సమాంతరతలోని యుద్ధశిక్షణ, బలప్రదానం భావాన్ని సహజంగా అందిస్తుంది; కర్మణి పఠనాన్ని పాదటిప్పణిలో ఉంచడం ద్వారా అసలు సందిగ్ధతను తొలగించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, కీర్తన కవిత్వానికి తగిన గంభీరతతో రూపొందించాం. ‘చేతులు/భుజాలు’ అనే సమాంతర శరీరచిత్రాన్ని నిలిపాం; క్లిష్టమైన రెండో పాదంలో సహజమైన సామర్థ్యార్థక పఠనంతో పాటు అక్షరార్థ కర్మణి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
