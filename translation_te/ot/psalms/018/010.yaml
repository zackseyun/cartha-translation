lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: ఎక్కి
  rationale: רכב అనే సాధారణ క్రియ ఇక్కడ కెరూబును వాహనంగా ఎక్కి ప్రయాణించడాన్ని సూచిస్తుంది. తెలుగులో ‘మీద ఎక్కి’ సహజంగా ఉండి మూలంలోని దృశ్యాన్ని నిలుపుతుంది.
- source_word: עַל
  choice: మీద
  rationale: ఈ విభక్త్యర్థక పదం ఆధారం లేదా స్థానం సూచిస్తుంది; కెరూబు వాహనంగా ఉన్న భావానికి ‘మీద’ సరిపోతుంది.
- source_word: כְּרוּב
  choice: కెరూబు
  rationale: ఇది ఏకవచనంలోని పరలోక జీవిని సూచిస్తుంది. స్థిరపడిన బైబిలు పదాన్ని ఉంచడం ద్వారా కవితాత్మక రూపాన్ని వివరణగా మార్చకుండా కాపాడాం.
- source_word: וַיָּעֹף
  choice: ఎగిరాడు
  rationale: עוף యొక్క ప్రత్యక్ష అర్థం ‘ఎగురు’; సమాంతర చలన చిత్రణను స్పష్టంగా నిలుపుతుంది.
- source_word: וַיֵּדֶא
  choice: దూసుకెళ్లాడు
  rationale: అరుదైన ఈ క్రియ సందర్భంలో గాలిలో వేగవంతమైన చలనాన్ని సూచిస్తుంది. ‘దూసుకెళ్లాడు’ వేగాన్ని సహజ తెలుగులో తెలియజేస్తుంది; క్రియకు సంబంధించిన అనిశ్చితిని పాదటిప్పణిలో సూచించాం.
- source_word: כַּנְפֵי
  choice: రెక్కలమీద
  rationale: כָּנָף యొక్క బహువచన నిర్మాణరూపం అక్షరార్థంగా ‘రెక్కలు’; ‘గాలి రెక్కలు’ అనే హీబ్రూ కవితా రూపకాన్ని నిలుపుతుంది.
- source_word: רוּחַ
  choice: గాలి
  rationale: తుఫాను-దైవదర్శన సందర్భంలో ‘గాలి’ అత్యంత సహజమైన అర్థం. ‘ఊపిరి’ లేదా ‘ఆత్మ’ అనే ఇతర సాధ్య అర్థాలను పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: కెరూబుమీద దేవుడు ప్రయాణించే చిత్రణ స్వభావం
  choice: దేవుడు కెరూబుమీద ఎక్కి ప్రయాణించే స్పష్టమైన కవితా చిత్రాన్ని యథాతథంగా నిలుపడం.
  alternative: కెరూబును తుఫాను మేఘాలకు లేదా దేవదూతల సమూహానికి రూపకంగా వివరించడం.
  rationale: హీబ్రూ వచనం ఈ దైవదర్శన చిత్రాన్ని వివరణ లేకుండానే అందిస్తుంది. దాన్ని అలాగే ఉంచడం కవిత్వాన్ని గౌరవించి, వచనం చెప్పని నిర్దిష్ట విశ్వదృక్పథాన్ని రుద్దకుండా ఉంటుంది.
- issue: చివరి పదబంధంలో רוּחַ అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘గాలి’ అని అనువదించడం.
  alternative: ‘ఆత్మ’ లేదా ‘ఊపిరి’.
  rationale: చుట్టుపక్కల తుఫాను దైవదర్శన సందర్భానికి ‘గాలి’ బాగా సరిపోతుంది. అయినప్పటికీ హీబ్రూ పదంలోని ఇతర నిజమైన అర్థసాధ్యతలను పాదటిప్పణిలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలిని ఉపయోగించాం. ‘కెరూబు’ అనే బైబిలు సాంకేతిక పదాన్ని నిలిపి, మిగతా చలన క్రియలను సాధారణ పాఠకులకు స్పష్టంగా ఉంచాం. పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం తరువాత క్రమంగా ఇవ్వబడ్డాయి.
