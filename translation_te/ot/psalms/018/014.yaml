source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח חִ֭צָּי/ו וַ/יְפִיצֵ֑/ם וּ/בְרָקִ֥ים רָ֝ב וַ/יְהֻמֵּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/014.yaml
  text: He sent out his arrows and scattered them[a]; he multiplied lightning bolts and threw them into confusion.
translation:
  language: te
  text: ఆయన తన బాణాలను పంపి వారిని చెదరగొట్టాడు; అనేక మెరుపులతో[a] వారిని కలవరపెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “ఆయన తన బాణాలను పంపి వారిని చెదరగొట్టాడు; మెరుపులను అధికం చేసి వారిని కలవరపెట్టాడు.” ఇక్కడి హీబ్రూ పదాన్ని “సమృద్ధిగా,” “అనేకంగా,” లేదా క్రియార్థంలో “అధికం చేశాడు” అని కూడా అర్థం చేసుకోవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపి
  rationale: שׁלח అనే క్రియకు ‘పంపడం/ప్రయోగించడం’ అనే భావం ఉంది. బాణాల సందర్భంలో సహజమైన తెలుగు కోసం ‘పంపి’ అని అనువదించాం.
- source_word: חִצָּיו
  choice: తన బాణాలను
  rationale: חֵץ అంటే ‘బాణం’; బహువచనంతో కూడిన తృతీయ పురుష ఏకవచన ప్రత్యయం ‘ఆయన బాణాలు’ అని సూచిస్తుంది.
- source_word: וַיְפִיצֵם
  choice: వారిని చెదరగొట్టాడు
  rationale: ఈ క్రియ ‘చెదరగొట్టడం/చెల్లాచెదురు చేయడం’ అని అర్థం. పుంలింగ బహువచన ప్రత్యయం సందర్భంలో శత్రువులను సూచిస్తుంది; తెలుగులో వ్యక్తులను సూచించేందుకు ‘వారిని’ సహజం.
- source_word: וּבְרָקִים
  choice: మెరుపులతో
  rationale: בְּרָקִים అనేది ‘మెరుపులు/మెరుపు జ్వాలలు’ అనే బహువచనం. ఆయుధసదృశ దృశ్యాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘మెరుపులతో’ అని ఇచ్చాం.
- source_word: רָב
  choice: విస్తారమైన
  rationale: రూపపరంగా అసాధారణమైన ఈ పదాన్ని సందర్భంలో ‘అనేకమైన/సమృద్ధిగా’ అనే పరిమాణార్థంగా గ్రహించవచ్చు. సహజమైన కవితాత్మక తెలుగులో ‘విస్తారమైన’ ఆ భావాన్ని నిలుపుతుంది.
- source_word: וַיְהֻמֵּם
  choice: వారిని కలవరపెట్టాడు
  rationale: המם యుద్ధ సందర్భంలో గందరగోళానికి, భయాందోళనకు గురిచేయడాన్ని సూచిస్తుంది. ‘కలవరపెట్టాడు’ అనేది సంపూర్ణ ఓటమిని చేర్చకుండా ఆ భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: ‘చెదరగొట్టాడు,’ ‘కలవరపెట్టాడు’ అనే క్రియల బహువచన కర్మప్రత్యయాల సూచన
  choice: సందర్భం ద్వారా అర్థమయ్యే దావీదు శత్రువులను సూచించేలా ‘వారిని’ అని అనువదించడం
  alternative: బాణాలు లేదా మెరుపులనే చెదరగొట్టినట్లు/విస్తరింపజేసినట్లు గ్రహించడం
  rationale: దైవ యోధుని చిత్రణలో బాణాలు, మెరుపులు సాధనాలు; వాటివల్ల శత్రువులు చెదరిపోయి కలవరపడతారు. המם అనే క్రియ యొక్క యుద్ధసందర్భ భావానికి కూడా ఇదే బాగా సరిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైన కవితా ధోరణిని నిలుపుతూ సామాన్య పాఠకులకు అర్థమయ్యే పదజాలం వాడాం. హీబ్రూ రָב లోని వ్యాకరణ/అర్థ అస్పష్టతను పాదసూచికలో భద్రపరిచాం.
