source:
  edition: WLC
  text: מגדל יְשׁוּע֪וֹת מַ֫לְכּ֥/וֹ וְ/עֹ֤שֶׂה חֶ֨סֶד לִ/מְשִׁיח֗/וֹ לְ/דָוִ֥ד וּ/לְ/זַרְע֗/וֹ עַד עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/050.yaml
  text: He gives great victories to his king and shows steadfast love to his anointed[c][b][a], to David and to his offspring forever.
translation:
  language: te
  text: ఆయన తన రాజుకు గొప్ప విజయాలు ఇస్తాడు[a]; తన అభిషిక్తునికి—దావీదుకు మరియు అతని సంతానానికి—ఎప్పటికీ స్థిరమైన ప్రేమ చూపిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన తన రాజుకు రక్షణల గోపురం.” వచనారంభంలోని హీబ్రూ రూపం పాఠపరంగానూ వాక్యనిర్మాణపరంగానూ క్లిష్టమైనది. దీనికి దగ్గరగా ఉన్న 2 సమూయేలు 22:51 పాఠం, “ఆయన తన రాజు విజయాలను/రక్షణలను గొప్ప చేస్తాడు” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: מגדל
  choice: గొప్ప ... అనుగ్రహిస్తాడు
  rationale: ఈ రూపం పాఠపరంగానూ వాక్యనిర్మాణపరంగానూ క్లిష్టమైనది. 2 సమూయేలు 22:51లోని సమాంతర పాఠం ఆధారంగా, రాజుకు కలిగే రక్షణలను లేదా విజయాలను గొప్పగా చేయడం/ప్రసాదించడం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేసింది; ‘గోపురం’ అనే సాధ్యమైన పఠనాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: יְשׁוּעוֹת
  choice: విజయాలు
  rationale: ఇది రక్షణ లేదా విడుదల కార్యాలను సూచించే బహువచనం. రాజసంబంధమైన యుద్ధ సందర్భంలో ‘విజయాలు’ సహజంగా ఉండి, దేవుడు పదేపదే కలిగించే రక్షణ భావాన్ని అందిస్తుంది.
- source_word: מַלְכּוֹ
  choice: తన రాజుకు
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయంతో కూడిన రూపాన్ని నేరుగా అనువదిస్తూ, దేవునికీ రాజుకీ ఉన్న సంబంధాన్ని నిలుపుతుంది.
- source_word: וְעֹשֶׂה חֶסֶד
  choice: నిలకడైన ప్రేమ చూపిస్తాడు
  rationale: חֶסֶד అనే నిబంధనాత్మక పదంలోని విశ్వసనీయమైన, స్థిరమైన ప్రేమ భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לִמְשִׁיחוֹ
  choice: తన అభిషిక్తునికి
  rationale: తక్షణ సందర్భంలో దావీదు లేదా దావీదు వంశపు రాజే ఉద్దేశించబడ్డాడు. ‘అభిషిక్తుడు’ మూలపద భావాన్ని కాపాడుతూ, విస్తృత మెస్సీయ సూచనను ముందుగానే పరిమితం చేయదు.
- source_word: לְדָוִד
  choice: దావీదుకు
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు రూపంలో ఇచ్చింది.
- source_word: וּלְזַרְעוֹ
  choice: అతని సంతానానికి
  rationale: זֶרַע ఏకవచన సమూహార్థక పదం. ‘సంతానం’ దావీదు వంశమంతటినీ సూచించగలదు; అదే సమయంలో ఏకవచన సంబంధిత విస్తృత మెస్సీయ ప్రతిధ్వనిని మూసివేయదు.
- source_word: עַד עוֹלָם
  choice: ఎప్పటికీ
  rationale: నిరంతర కాలవ్యాప్తిని సహజంగా, సంక్షిప్తంగా తెలిపే ఆధునిక తెలుగు రూపం.
theological_decisions:
- issue: దావీదు రాజకీర్తనలో מְשִׁיחוֹ పదానికి ఉన్న మెస్సీయ ప్రతిధ్వని
  choice: ప్రధాన పాఠంలో ‘తన అభిషిక్తునికి’ అని అనువదించడం
  alternative: తన మెస్సీయకు
  rationale: స్థానిక సందర్భం దావీదును స్పష్టంగా పేర్కొంటుంది కాబట్టి ‘అభిషిక్తుడు’ చారిత్రక సూచనకు సరిపోతుంది. అయినప్పటికీ, పదంలోని విస్తృత మెస్సీయ ప్రాముఖ్యతను పాదటిప్పణిలో ఉంచి వేదాంతపరమైన ఉద్వేగాన్ని కాపాడింది.
- issue: זַרְעוֹ (‘అతని సంతానం’) యొక్క పరిధి
  choice: సమూహార్థకతను నిలిపే ‘అతని సంతానం’
  alternative: అతని వంశస్థులు / అతని విత్తనం
  rationale: హీబ్రూ రూపం దావీదు వంశాన్ని సమూహంగా సూచించగలదు; కానానిక సందర్భంలో మెస్సీయ సంబంధమైన ఏకవచన పఠనానికీ అవకాశం ఇస్తుంది. ప్రధాన పాఠం ఏ ఒక్క భావానికీ అనవసరంగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించింది. ‘అనుగ్రహిస్తాడు’ రాజుకు దేవుడు విజయాలు ప్రసాదించే భావాన్ని స్పష్టంగా చేస్తుంది; ‘నిలకడైన ప్రేమ’ חֶסֶד పదంలోని స్థిరత్వం, విశ్వసనీయతను సాధారణ పాఠకులకు అర్థమయ్యేలా అందిస్తుంది. దీర్ఘ డాష్‌లు ‘దావీదుకు, అతని సంతానానికి’ అనే వివరణాత్మక సంబంధాన్ని స్పష్టపరుస్తాయి.
