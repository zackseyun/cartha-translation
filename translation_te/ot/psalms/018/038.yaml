source:
  edition: WLC
  text: אֶ֭מְחָצֵ/ם וְ/לֹא יֻ֣כְלוּ ק֑וּם יִ֝פְּל֗וּ תַּ֣חַת רַגְלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/038.yaml
  text: I crush them[a], and they cannot rise[b]; they fall beneath my feet.
translation:
  language: te
  text: నేను వారిని నలిపివేస్తాను[a]; వారు లేవలేరు[b]. వారు నా పాదాల కింద పడిపోతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారిని చితకగొడతాను,’ ‘వారిని ముక్కలు చేస్తాను’; హీబ్రూ క్రియ యుద్ధంలో బలంగా నలిపివేయడం లేదా చితకగొట్టడం అనే భావాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వారు నిలబడలేరు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶמְחָצֵם
  choice: నేను వారిని చితకగొడతాను
  rationale: מחץ అనే క్రియ యుద్ధ సందర్భంలో బలంగా నలగగొట్టడం లేదా ముక్కలు చేయడం అనే హింసాత్మక భావాన్ని ఇస్తుంది. ‘చితకగొడతాను’ ఆ తీవ్రతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְלֹא יֻכְלוּ קוּם
  choice: వారు లేవలేరు
  rationale: יכל సామర్థ్యాన్ని, קום పడిన స్థితి నుంచి లేవడాన్ని సూచిస్తాయి. సంక్షిప్తమైన ఈ రూపం రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִפְּלוּ
  choice: పడిపోతారు
  rationale: נפל యొక్క ప్రాథమిక అర్థమైన ‘పడడం’ను నిలుపుతూ, యుద్ధంలో పూర్తిగా కూలిపోయే దృశ్యాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: תַּחַת רַגְלָי
  choice: నా పాదాల కింద
  rationale: మూలంలోని ప్రత్యక్ష స్థలచిత్రాన్ని, సంపూర్ణ ఓటమి భావాన్ని యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: రాజకీర్తనలోని హింసాత్మక యుద్ధ చిత్రణ
  choice: మొదటి పురుష యుద్ధభాషను తీవ్రత తగ్గించకుండా నిలుపడం
  alternative: ‘వారిని ఓడిస్తాను’ వంటి మృదువైన పదప్రయోగం
  rationale: హీబ్రూ పాఠం చితకగొట్టడం, లేవలేకపోవడం, పాదాల కింద పడిపోవడం అనే బలమైన చిత్రాలను స్పష్టంగా వాడుతుంది. వాటిని మృదుపరచడం మూలంలోని యుద్ధ సందర్భాన్ని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే కీర్తనలోని గంభీరమైన యుద్ధకావ్య ధోరణిని నిలుపుతూ అనువదించబడింది.
