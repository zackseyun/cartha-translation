  text: הָ֭/אֵל הַ/מְאַזְּרֵ֣/נִי חָ֑יִל וַ/יִּתֵּ֖ן תָּמִ֣ים דַּרְכִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/032.yaml
  text: The God who girds me with strength and makes my way blameless[a][b].
translation:
  language: te
  text: నన్ను బలంతో సన్నద్ధం చేసే దేవుడు నా మార్గాన్ని సంపూర్ణం చేస్తాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను పరాక్రమంతో సిద్ధపరచే.” హెబ్రీలో అక్షరార్థంగా, “నన్ను బలంతో నడికట్టుకట్టే” అని ఉంది; ఇది కార్యానికి లేదా యుద్ధానికి సన్నద్ధం చేయడాన్ని సూచించే రూపకం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నా మార్గాన్ని నిర్దోషంగా చేస్తాడు” లేదా “సమగ్రంగా చేస్తాడు.” హెబ్రీ పదం תמים సంపూర్ణత, సమగ్రత, యథార్థత లేదా నిర్దోషతను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: దేవుడే
  rationale: నిర్దిష్టతను తెలిపే הָ ఆర్టికల్‌తో ఉన్న ఈ రూపం సందర్భంలో ఇశ్రాయేలు దేవుణ్ణి ప్రత్యేకంగా సూచిస్తుంది. తెలుగులో ‘దేవుడే’ అనే ఉద్ఘాటన హెబ్రీ వాక్యపు నిర్దిష్టతను, అలంకార బలాన్ని సహజంగా అందిస్తుంది.
- source_word: הַמְאַזְּרֵנִי
  choice: నాకు ... నడికట్టుగా కట్టే
  rationale: אזר అనే క్రియకు ప్రాథమికంగా ‘నడికట్టు కట్టు’ అనే భావం ఉంది. యుద్ధానికి లేదా కార్యానికి సిద్ధం చేయడమనే సజీవ రూపకాన్ని సాధ్యమైనంతగా నిలుపుతుంది.
- source_word: חָיִל
  choice: బలాన్ని
  rationale: חיל బలం, పరాక్రమం, శౌర్యం అనే భావాలను ఇవ్వగలదు. ఇక్కడ దేవుడు కీర్తనకర్తను కార్యానికి శక్తిమంతుణ్ణి చేస్తున్న సందర్భంలో ‘బలం’ సహజమైన విస్తృతార్థాన్ని ఇస్తుంది.
- source_word: וַיִּתֵּן
  choice: చేస్తాడు
  rationale: נתן సాధారణంగా ‘ఇవ్వు’ అయినా, ఇక్కడ תמים అనే విశేషణంతో דרךను ఫలితస్థితిలో ఉంచే భావం ఉంది. అందువల్ల తెలుగులో ‘చేస్తాడు’ సహజంగా ఉంటుంది.
- source_word: תָּמִים
  choice: నిర్దోషమైనదిగా
  rationale: תמים సంపూర్ణత, సమగ్రత, యథార్థత లేదా నిర్దోషతను సూచించగలదు. ‘నిర్దోషమైనది’ నైతిక జీవనమార్గపు భావాన్ని ఇస్తుంది; పాపరహిత పరిపూర్ణత అనే భావాన్ని తప్పనిసరిగా రుద్దదు.
- source_word: דַּרְכִּי
  choice: నా మార్గాన్ని
  rationale: דרך జీవనప్రయాణం లేదా ప్రవర్తనను సూచించే రూపకం. ‘మార్గం’ తెలుగులో స్పష్టమైన, సంప్రదాయబద్ధమైన, ఇంకా సాధారణ పాఠకులకు అర్థమయ్యే సమానార్థకం.
theological_decisions:
- issue: కీర్తనకర్త మార్గానికి సంబంధించిన תמים యొక్క భావం
  choice: నిర్దోషమైనది
  alternative: పరిపూర్ణమైనది / సంపూర్ణమైనది
  rationale: వాక్యం దేవుడు కీర్తనకర్త మార్గాన్ని సమగ్రతతో స్థిరపరుస్తాడని చెప్పగలదు; పాపరహిత పరిపూర్ణతను స్పష్టంగా ప్రకటించదు. ప్రధాన పాఠం నైతిక నిర్దోషతను ముందుకు తెస్తూ, ఇతర నిజమైన భావసాధ్యతలను పాదసూచిలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా రూపొందించబడింది. ‘నడికట్టుగా కట్టే’ అనే పదబంధం మూలంలోని శరీరాత్మక రూపకాన్ని నిలుపుతుంది; కొద్దిగా అసాధారణమైనప్పటికీ పాదసూచి దాని కార్యసిద్ధత భావాన్ని వివరిస్తుంది.
