    text: 'అక్షరార్థానికి దగ్గరగా: “చెవి వినికిడికి వారు నాకు లోబడతారు”; లేదా, “వారు వినగానే నాకు లోబడతారు.”'
    reason: lexical_alternative
  - marker: b
    text: లేదా, “విదేశీయులు నాకు అయిష్టంగా లొంగిపోతారు.” ఈ మాట కపటమైన లేదా బలవంతపు విధేయతను సూచించవచ్చు.
