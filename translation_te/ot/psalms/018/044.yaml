lexical_decisions:
- source_word: לְשֵׁמַע אֹזֶן
  choice: చెవిన పడగానే
  rationale: హీబ్రూ నుడికారానికి అక్షరార్థం ‘చెవి వినగానే/చెవి విన్నప్పుడు.’ సందర్భంలో వెంటనే స్పందించడాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘చెవిన పడగానే’ ఆ భావాన్నీ, వినికిడి చిత్రాన్నీ నిలుపుతుంది.
- source_word: יִשָּׁמְעוּ לִי
  choice: వారు నాకు లోబడతారు
  rationale: שׁמע అనే క్రియ לִי తో వచ్చినప్పుడు కేవలం వినడం కాక, మాట విని లోబడడం అనే అర్థం సాధారణం. రాజవిజయ సందర్భంలో ‘లోబడతారు’ తగినది.
- source_word: בְּנֵי נֵכָר
  choice: విదేశీయులు
  rationale: అక్షరార్థంగా ‘విదేశపు కుమారులు’ లేదా ‘పరదేశపు కుమారులు’; ఇది విదేశీయులను సూచించే హీబ్రూ నుడికారం. తెలుగులో ‘విదేశీయులు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: יְכַחֲשׁוּ לִי
  choice: నాకు విధేయులైనట్లు నటిస్తారు
  rationale: כחש పియేల్ రూపం మోసం చేయడం, అబద్ధంగా ప్రవర్తించడం, లేదా బలవంతపు/కపట విధేయత చూపడం అనే పరిధిని కలిగి ఉంది. మొదటి పాదంలోని నిజమైన లోబడటానికి విరుద్ధంగా కనిపించే కపట సమర్పణను ఈ ఎంపిక స్పష్టం చేస్తుంది; ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
