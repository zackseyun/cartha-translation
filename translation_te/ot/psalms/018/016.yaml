  to: ఆయన ఉన్నతస్థలం నుండి చేయి చాపి నన్ను పట్టుకున్నాడు; అనేక జలాలనుండి నన్ను బయటికి లాగాడు.[a]
  rationale: ‘మధ్యనుండి’ని ‘నుండి’గా మార్చి, మూలంలోని ‘from/out of many waters’ భావాన్ని అదనపు స్థానిక నిర్దిష్టత లేకుండా పునరుద్ధరించాను. ‘చేయి చాపి’ అనేది సందర్భంలో יִשְׁלַח యొక్క సాధ్యమైన ‘stretch out’ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; దైవిక నివాసాన్ని ‘పరలోకం’గా నిర్దిష్టపరచదు.
