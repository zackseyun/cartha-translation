translation:
  language: te
  text: ఆయన ఉన్నతస్థలం నుండి చేయి చాపి నన్ను పట్టుకున్నాడు; అనేక జలాలనుండి నన్ను బయటికి లాగాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘అనేక జలాలు’ అని ఉంది; ‘మహా జలాలు’ అని కూడా అనువదించవచ్చు. ఇది ముంచెత్తే తీవ్రమైన ప్రమాదానికి సాధారణ కవితాత్మక చిత్రం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח מִמָּרוֹם
  choice: ఉన్నత స్థలం నుండి చెయ్యి చాపి
  rationale: יִשְׁלַח అనే క్రియకు ‘పంపాడు/చాపాడు’ అనే భావం ఉంది; కర్మ స్పష్టంగా చెప్పబడకపోయినా, తరువాతి ‘నన్ను పట్టుకున్నాడు’ అనే మాట రక్షించడానికి చెయ్యి చాపిన దృశ్యాన్ని సూచిస్తుంది. ‘పరలోకం నుండి’ అని స్పష్టీకరించకుండా מָרוֹם లోని ఎత్తైన స్థలం అనే చిత్రాన్ని నిలిపింది.
- source_word: יִקָּחֵנִי
  choice: నన్ను పట్టుకున్నాడు
  rationale: లౌకికంగా ‘నన్ను తీసుకున్నాడు’ అనవచ్చు; అయితే నీటిలోనుండి రక్షించే సందర్భంలో ‘పట్టుకున్నాడు’ సహజంగా ఉండి, మూలంలోని తీసుకోవడం/చేతబట్టడం అనే భావాన్ని అతిశయింపకుండా తెలియజేస్తుంది.
- source_word: יַמְשֵׁנִי
  choice: నన్ను బయటికి లాగాడు
  rationale: ఈ హిఫీల్ రూపం నీటిలోనుండి వెలికి తీయడం లేదా లాగడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘బయటికి లాగాడు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: מִמַּיִם רַבִּים
  choice: అనేక జలాల మధ్యనుండి
  rationale: మూలపదాల సూటి భావమైన ‘many waters’ను నిలిపి, ముంచెత్తే ప్రమాదాన్ని సూచించే కవితాత్మక చిత్రాన్ని తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: రక్షణ వచ్చిన స్థలాన్ని నేరుగా పరలోకంగా పేర్కొనాలా
  choice: ‘ఉన్నత స్థలం నుండి’ అని అనువదించడం
  alternative: ‘పరలోకం నుండి’
  rationale: హీబ్రూ పాఠం ఎత్తైన స్థలం లేదా ఉన్నతం అని చెబుతుంది; ‘పరలోకం’ అని ప్రత్యేకంగా చెప్పదు. అందువల్ల దైవిక ఉన్నతత్వాన్ని సూచించే అవకాశాన్ని ఉంచుతూ, మూలంలో లేని నిర్దిష్టతను చేర్చలేదు.
- issue: జలాలను అక్షరార్థ జలాలుగా మాత్రమే చూపాలా లేక ప్రమాదానికి రూపకంగా వివరించాలా
  choice: ప్రధాన పాఠంలో జలాల చిత్రాన్ని యథాతథంగా ఉంచడం
  alternative: ‘తీవ్రమైన ప్రమాదం నుండి’ అని భావానువాదం చేయడం
  rationale: ఈ కవితాత్మక చిత్రం నిజమైన నీటినీ, ముంచెత్తే ప్రమాదాన్నీ సూచించగలదు. ప్రధాన పాఠంలో ఆ ఉద్వేగభరిత అనిశ్చితిని నిలిపి, వివరణను పాదటిప్పణికి పరిమితం చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వినిపించే, గంభీరమైన కవితాత్మక శైలి వాడబడింది. ‘చెయ్యి చాపి’ అనేది సందర్భం సూచించే చర్యను తెలుగులో సంపూర్ణంగా వ్యక్తం చేస్తుంది; ‘పరలోకం’ అనే అదనపు నిర్దిష్టతను నివారించింది.
