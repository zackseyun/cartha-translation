id: PSA.18.9
reference: Psalms 18:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֣ט שָׁ֭מַיִם וַ/יֵּרַ֑ד וַ֝/עֲרָפֶ֗ל תַּ֣חַת רַגְלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/009.yaml
  text: He bent the heavens and came down[a]; thick darkness was under his feet.
translation:
  language: te
  text: ఆయన ఆకాశాలను వంచి దిగివచ్చాడు; గాఢాంధకారం[a] ఆయన పాదాల కింద ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చీకటి మేఘం,’ లేదా ‘దట్టమైన చీకటి.’
    reason: ערפל అనే పదానికి సందర్భానుసారంగా సాధ్యమైన పదార్థ ప్రత్యామ్నాయాలను సూచించడం.
lexical_decisions:
- source_word: וַיֵּט
  choice: వంచి
  rationale: נטה అనే క్రియకు చాపడం, వంచడం, ఒగ్గించడం అనే భావాలు ఉన్నాయి. దేవుడు దిగివచ్చే ఈ దైవప్రత్యక్ష కవితా చిత్రంలో ఆకాశాలను కిందికి వంచిన దృశ్యాన్ని ‘వంచి’ సహజంగా, సజీవంగా నిలుపుతుంది.
- source_word: שָׁמַיִם
  choice: ఆకాశాలను
  rationale: హీబ్రూలోని బహువచన రూపాన్నీ, కవితలోని విశ్వవ్యాప్త పరిధినీ నిలుపడానికి తెలుగు బహువచనం వాడబడింది.
- source_word: וַיֵּרַד
  choice: దిగివచ్చాడు
  rationale: ירד సూచించే పై నుంచి కిందికి కదలికను, దైవిక వ్యక్తి వక్త ఉన్న లోకానికి రావడాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַעֲרָפֶל
  choice: గాఢాంధకారం
  rationale: ערפל దట్టమైన చీకటి, గాఢాంధకారం, లేదా చీకటి మేఘం వంటి భావాన్ని ఇవ్వగలదు. ‘గాఢాంధకారం’ దాని సాంద్రతనూ దైవప్రత్యక్ష వాతావరణాన్నీ నిలుపుతూ, దానిని తప్పనిసరిగా మేఘంగా నిర్ధారించదు.
- source_word: תַּחַת
  choice: కింద
  rationale: స్థానాన్ని తెలిపే సరళమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: רַגְלָיו
  choice: ఆయన పాదాలు
  rationale: మూలంలోని అక్షరార్థమైన బహువచన ‘అతని పాదాలు’ అనే మానవరూప దైవప్రత్యక్ష చిత్రాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: మానవరూప దైవప్రత్యక్ష చిత్రం
  choice: దేవుడు ఆకాశాలను వంచడం, దిగివరడం, ఆయన పాదాల కింద అంధకారం ఉండడం అనే స్పష్టమైన చిత్రాన్ని యథాతథంగా నిలుపడం.
  alternative: దైవిక జోక్యాన్ని సూచించే రూపక వివరణగా ఈ చిత్రాన్ని మృదువుగా మార్చడం.
  rationale: ఈ వచనం కవితాత్మకమైనదీ మానవరూప చిత్రణ కలిగినదీ అయినప్పటికీ, అనువాదం ఆ చిత్రాన్ని వివరించి తొలగించకుండా నిలుపాలి. అలా చేయడం మూలంలోని దైవశాస్త్ర సంబంధ ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే కీర్తన కవిత్వానికి తగిన గంభీరతతో. ‘ఆకాశాలను వంచి’ మరియు ‘ఆయన పాదాల కింద’ అనే స్పష్టమైన కవితా చిత్రాలు నిలుపబడ్డాయి.
