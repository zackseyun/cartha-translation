  text: You equipped me with strength for battle[b][a]; you subdued those who rose against me beneath me.
translation:
  language: te
  text: యుద్ధానికి నన్ను బలంతో సన్నద్ధం చేశావు; నా మీదికి లేచినవారిని నా కింద అణచివేశావు.[a]
  philosophy: optimal-equivalence
  footnotes:
