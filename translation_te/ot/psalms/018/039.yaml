    text: 'మరింత అక్షరార్థంగా: “యుద్ధానికి నీవు బలాన్ని నా నడుముకు కట్టావు; నా మీదికి లేచినవారిని నా కింద వంగేలా చేశావు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּאַזְּרֵנִי
  choice: నన్ను ... సన్నద్ధం చేశావు
  rationale: אזר అనే క్రియకు నడుము కట్టడం అనే మూలచిత్రం ఉన్నా, ఇక్కడ బలాన్ని ఇచ్చి యుద్ధానికి సిద్ధపరచడం భావం. ఆధునిక తెలుగులో సహజంగా ఉండేలా ‘సన్నద్ధం చేశావు’ అని అనువదించాం; మూలచిత్రాన్ని పాదసూచికలో ఉంచాం.
- source_word: חַיִל
  choice: బలంతో
  rationale: ఈ యుద్ధ సందర్భంలో ఇది సైన్యాన్ని కాక శక్తి లేదా సామర్థ్యాన్ని సూచిస్తుంది. ‘బలం’ స్పష్టమైన, సహజమైన తెలుగు పదం.
- source_word: לַמִּלְחָמָה
  choice: యుద్ధానికి
  rationale: మూలంలోని యుద్ధ సందర్భాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: תַּכְרִיעַ
  choice: అణచివేశావు
  rationale: כרע హిఫీల్ రూపం వంగేలా చేయడం, కూల్చడం అనే చిత్రాన్ని ఇస్తుంది. ‘అణచివేశావు’ సైనిక ఓటమి భావాన్ని సహజంగా తెలియజేస్తూ, తరువాతి ‘నా కింద’తో సజావుగా కలుస్తుంది.
- source_word: קָמַי
  choice: నా మీదికి లేచినవారిని
  rationale: קום క్రియలోని ‘లేవడం’ అనే సజీవమైన శత్రుత్వ చిత్రాన్ని నిలుపుతుంది; కేవలం ‘నా శత్రువులను’ అనడం కంటే మూలానికి దగ్గరగా ఉంటుంది.
- source_word: תַּחְתָּי
  choice: నా కింద
  rationale: విజయం వల్ల శత్రువులు వశపరచబడినట్లు తెలిపే మూలంలోని స్థానిక రూపకాన్ని సంక్షిప్తంగా నిలుపుతుంది.
