  text: He brought me out into a broad place[a]; he rescued me[c][b], because he delighted in me.
translation:
  language: te
  text: ఆయన నన్ను విశాలమైన స్థలంలోకి తీసుకొచ్చాడు[a]; నన్ను రక్షించాడు[b], ఎందుకంటే ఆయన నాపట్ల సంతోషించాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘విశాల ప్రదేశంలోకి’ లేదా ‘తెరచిన ప్రదేశంలోకి.’ హీబ్రూ రూపకం ఇరుకుదనం లేదా ఆపదకు విరుద్ధంగా స్వేచ్ఛను, భద్రతను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
