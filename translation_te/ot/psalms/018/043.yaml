revisions:
- from: ప్రజల కలహాల నుండి నన్ను విడిపిస్తావు[a]; నన్ను జనాలకు అధిపతిగా ఉంచుతావు[b]; నేను ఎరుగని ప్రజలు నాకు సేవ చేస్తారు[c].
  to: ప్రజల కలహాల నుండి నన్ను విడిపిస్తావు[a]; నన్ను జనాంగాలకు అధిపతిగా ఉంచుతావు[b]; నేను ఎరుగని ప్రజలు నాకు సేవ చేస్తారు[c].
  rationale: The revision makes the national-political sense of גּוֹיִם explicit through ‘జనాంగాలు’ and corrects the grammatical footnote so that it preserves, rather than over-specifies, the Hebrew imperfect’s future/characteristic ambiguity. No theological interpretation has been added.
  reviewer_model: gpt-5.6-terra
