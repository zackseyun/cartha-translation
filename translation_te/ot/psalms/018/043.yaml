source:
  edition: WLC
  text: תְּפַלְּטֵ/נִי֮ מֵ/רִ֪יבֵ֫י עָ֥ם תְּ֭שִׂימֵ/נִי לְ/רֹ֣אשׁ גּוֹיִ֑ם עַ֖ם לֹא יָדַ֣עְתִּי יַֽעַבְדֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/043.yaml
  text: You rescue me from the strivings of the people[a]; you set me as the head of nations[d][c][b]; a people whom I have not known serve me.
translation:
  language: te
  text: ప్రజల కలహాల నుండి నన్ను విడిపిస్తావు[a]; నన్ను జనాంగాలకు అధిపతిగా ఉంచుతావు[b]; నేను ఎరుగని ప్రజలు నాకు సేవ చేస్తారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రజల వివాదాల నుండి.’ హీబ్రూ పదం కలహం, వివాదం లేదా పోరును సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘జనాంగాలకు శిరస్సుగా.’ ఇక్కడ ‘శిరస్సు’ నాయకత్వానికి రూపకం.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ అసంపూర్ణ క్రియారూపం సందర్భంలో భవిష్యత్ భావాన్ని లేదా సాధారణంగా కొనసాగే చర్యను సూచించగలదు.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: תְּפַלְּטֵנִי
  choice: నన్ను విడిపిస్తావు
  rationale: పִּעֵל రూపంలోని פלט దేవుడు వ్యక్తిగతంగా ప్రమాదం లేదా విరోధం నుండి విడిపించే క్రియను సూచిస్తుంది. ‘విడిపిస్తావు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ రక్షణ చర్యను నిలుపుతుంది.
- source_word: מֵרִיבֵי עָם
  choice: ప్రజల కలహాల నుండి
  rationale: רִיב పదానికి కలహం, వివాదం, పోరు అనే విస్తృత అర్థపరిధి ఉంది. బహువచన నిర్మాణాన్ని ‘కలహాలు’ అని, עָם అనే సమూహవాచక ఏకవచనాన్ని ‘ప్రజలు’ అని సహజ తెలుగులో వ్యక్తపరిచాం.
- source_word: תְּשִׂימֵנִי
  choice: నన్ను ... ఉంచుతావు
  rationale: שׂים యొక్క ప్రాథమిక భావం ఉంచడం లేదా నియమించడం. ఇక్కడ రాజును ఉన్నత నాయకత్వ స్థానంలో ఉంచే భావాన్ని అతిగా వివరించకుండా ‘ఉంచుతావు’ నిలుపుతుంది.
- source_word: לְרֹאשׁ גּוֹיִם
  choice: జనాలకు అధిపతిగా
  rationale: רֹאשׁ అక్షరార్థంగా ‘తల/శిరస్సు’ అయినా ఇక్కడ నాయకత్వానికి రూపకం. సహజ ఆధునిక తెలుగులో దాని సందర్భార్థాన్ని ‘అధిపతి’గా ఇచ్చాం; גּוֹיִם రాజకీయ-సమూహార్థంలో ‘జనాలు,’ తరువాతి యూదేతరులనే ప్రత్యేక భావాన్ని మోపకుండా అనువదించబడింది.
- source_word: לֹא יָדַעְתִּי
  choice: నేను ఎరుగని
  rationale: יָדַעְתִּי ఇక్కడ ముందుగా పరిచయం లేకపోవడాన్ని సూచిస్తుంది. ‘ఎరుగని’ సంక్షిప్తంగా, కవితాత్మక గౌరవంతో ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: יַעַבְדוּנִי
  choice: నాకు సేవ చేస్తారు
  rationale: עבד యొక్క సూటి భావం ‘సేవ చేయడం.’ అసంపూర్ణ క్రియారూపం సందర్భానుసారం వర్తమాన లేదా భవిష్యత్ భావాన్ని అనుమతిస్తుంది; ప్రధాన పాఠంలో సహజమైన సాధారణ వర్తమాన రూపాన్ని వాడాం.
theological_decisions:
- issue: గּוֹיִם మరియు עַם యొక్క పరిధి
  choice: రాజకీయ-సమూహ పదాలుగా ‘జనాలు,’ ‘ప్రజలు’ అని అనువదించడం
  alternative: గּוֹיִם ను ‘అన్యజనులు’ అని అనువదించడం
  rationale: ఈ రాజకీర్తన సందర్భంలో విదేశీ ప్రజాసమూహాలపై రాజుకు లభించిన నాయకత్వమే ప్రధాన భావం. తరువాతి యూదు–అన్యజన theological విభజనను ఈ వచనంలోకి దిగుమతి చేయకుండా మూలంలోని విస్తృతతను నిలిపాం.
- issue: יַעַבְדוּנִי యొక్క కాలభావం
  choice: ‘సేవ చేస్తారు’ అనే సాధారణ/కొనసాగే భావం
  alternative: ‘సేవ చేస్తారు’ను స్పష్టమైన భవిష్యదర్థంగా గ్రహించడం లేదా ‘నాకు లోబడతారు’ అని అనువదించడం
  rationale: హీబ్రూ అసంపూర్ణ రూపం భవిష్యత్ లేదా లక్షణాత్మక చర్యను సూచించగలదు. ‘లోబడతారు’ రాజకీయ ఫలితాన్ని ముందే వివరిస్తుంది; అందువల్ల మూలక్రియ ‘సేవ చేయు’నే ఉంచి కాలసూక్ష్మతను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కీర్తనా శైలి. హీబ్రూ కవితా సమాంతరత కోసం మూడు ఉపవాక్యాలను అర్ధవిరామాలతో నిలిపాం. ‘శిరస్సు’ రూపకాన్ని ప్రధాన పాఠంలో బలవంతంగా ఉంచకుండా సహజమైన ‘అధిపతి’ని వాడి, మూలరూపకాన్ని పాదటిప్పణిలో సంరక్షించాం.
