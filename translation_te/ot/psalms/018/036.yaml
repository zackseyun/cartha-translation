  text: You broaden my steps beneath me[c][b][a], and my ankles have not given way.
translation:
  language: te
  text: నీవు నా అడుగులు వేయడానికి నా కింద విశాలమైన చోటు కల్పిస్తావు[a]; నా చీలమండలు జారిపోలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీవు నా అడుగును నా కింద వెడల్పు చేస్తావు.’ ఇది దేవుడు భద్రంగా, ఆటంకం లేకుండా అడుగులు వేయడానికి తగినంత చోటు ఇస్తున్నాడనే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా చీలమండలు పట్టు తప్పలేదు’ / ‘తూలలేదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְחִיב
  choice: విశాలమైన చోటు కల్పిస్తావు
  rationale: רחב అనే ధాతువు హిఫీల్ రూపంలో ‘వెడల్పు చేయడం, విశాలం చేయడం’ అనే కారణార్థాన్ని ఇస్తుంది. తెలుగు సహజత్వం కోసం, అడుగు వేయడానికి దేవుడు తగినంత చోటు కల్పించే చిత్రాన్ని ఈ విధంగా వ్యక్తం చేశాం.
- source_word: צַעֲדִי
  choice: నా అడుగు
  rationale: צעד అనే నామవాచకం ఇక్కడ ఏకవచనంలో ‘నా అడుగు’ లేదా ‘నా అడుగువేత’ అని అర్థం. భౌతిక ‘నేల’గా మార్చకుండా మూలంలోని అడుగు చిత్రాన్ని నిలిపాం.
- source_word: תַחְתָּי
  choice: కింద
  rationale: ఈ స్థలసూచక పదానికి ‘నా కింద’ అనే అర్థం ఉంది. తెలుగులో ‘నా అడుగు కింద’ అని చెప్పడం ద్వారా భావాన్ని సహజంగా తెలిపాం.
- source_word: וְלֹא
  choice: …లేదు
  rationale: సాధారణ సంధాయక అవ్యయం, నిషేధం. తెలుగులో రెండో సమాంతర వాక్యంగా సహజంగా ఇచ్చాం.
- source_word: מָעֲדוּ
  choice: జారిపోలేదు
  rationale: מעד అంటే జారడం, తూలడం లేదా పట్టు తప్పడం. చీలమండల సందర్భంలో ‘జారిపోలేదు’ స్థిరమైన నడక భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: קַרְסֻלָּי
  choice: నా చీలమండలు
  rationale: ఈ పదం సాధారణంగా పాదాలకన్నా ప్రత్యేకంగా చీలమండలను సూచిస్తుంది; అందువల్ల మూలంలోని స్పష్టమైన శరీర చిత్రాన్ని నిలిపాం.
