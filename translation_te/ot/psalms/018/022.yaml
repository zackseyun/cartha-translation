source:
  edition: WLC
  text: כִּ֣י כָל מִשְׁפָּטָ֣י/ו לְ/נֶגְדִּ֑/י וְ֝/חֻקֹּתָ֗י/ו לֹא אָסִ֥יר מֶֽנִּ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/022.yaml
  text: For all his judgments were before me[a], and I did not put away his statutes from me.
translation:
  language: te
  text: ఎందుకంటే ఆయన తీర్పులన్నీ నా ఎదుట ఉన్నాయి; ఆయన శాసనాలను నేను నా నుండి తొలగించలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను ఆయన శాసనాల నుండి తొలగిపోలేదు.” హీబ్రూ క్రియను శాసనాలను తన నుండి తొలగించడం అనే భావంలోనూ, వాటి నుండి తానే తొలగిపోవడం అనే భావంలోనూ అర్థం చేసుకోవచ్చు. ప్రధాన పాఠం హిఫీల్ రూపంలోని మరింత ప్రత్యక్షమైన సకర్మక భావాన్ని “నా నుండి” అనే మాటతో నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని లేదా ఆధారాన్ని పరిచయం చేసే వివరణాత్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כָל
  choice: అన్నీ
  rationale: హీబ్రూ పదంలోని సమగ్రతను నిలుపుతుంది.
- source_word: מִשְׁפָּטָיו
  choice: ఆయన తీర్పులు
  rationale: న్యాయపరమైన, నిబంధన సంబంధమైన భావఛాయలను కాపాడుతూ కీర్తనల సందర్భానికి తగిన గౌరవప్రదమైన పదప్రయోగాన్ని ఇస్తుంది.
- source_word: לְנֶגְדִּי
  choice: నా ఎదుటే
  rationale: వాటిని తన దృష్టిలో ఉంచుకున్నాడనే రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ‘ఏ’ ఉద్ఘాటన వాటి నిరంతర ప్రాముఖ్యతను సూచిస్తుంది, అయితే ‘ఎల్లప్పుడూ’ అనే అదనపు కాలార్థాన్ని చేర్చదు.
- source_word: וְחֻקֹּתָיו
  choice: ఆయన శాసనాలను
  rationale: స్థిరంగా నిర్దేశించబడిన విధులు లేదా శాసనాల భావాన్ని స్పష్టంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: לֹא אָסִיר
  choice: తొలగించలేదు
  rationale: సూర్ అనే క్రియ యొక్క హిఫీల్ రూపానికి ఇక్కడ ఉన్న ప్రత్యక్ష సకర్మక భావమైన ‘తొలగించు’ను కాపాడుతుంది.
- source_word: מֶנִּי
  choice: నా నుండి
  rationale: హీబ్రూలో స్పష్టంగా ఉన్న విభక్తి సంబంధాన్ని నిలుపుతూ ‘నా నుండి తొలగించలేదు’ అనే సకర్మక పఠనానికి మద్దతిస్తుంది.
