translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే కీర్తనకు తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. హీబ్రూ వాక్య నిర్మాణం మరియు క్రియలోని సాధ్యమైన ద్వంద్వార్థం పాదటిప్పణి ద్వారా సంరక్షించబడ్డాయి.
