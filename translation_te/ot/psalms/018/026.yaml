  yaml_path: translation/ot/psalms/018/026.yaml
  text: With the pure you show yourself pure[a], and with the crooked you show yourself twisted.
translation:
  language: te
  text: 'నిర్మలుని పట్ల నీవు నిర్మలుడిగా కనబడతావు;

    వక్రుని పట్ల నీవు వక్రంగా కనబడతావు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “చాకచక్యంగా వ్యవహరిస్తావు,” లేదా “వక్రుణ్ణి అతని ఎత్తులతోనే ఓడిస్తావు.” హీబ్రూలో పరస్పర పదప్రయోగం ఉంది: దేవుడు నైతికంగా వక్రుడు అవుతాడని కాదు; వక్రుని వక్రతకు తగిన విధంగా స్పందించి, దానినే అతనికి ఎదురుతిప్పుతాడని భావం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָר
  choice: నిర్మలుడు
  rationale: ఈ పదం నైతిక స్వచ్ఛతను సూచిస్తుంది. ‘నిర్మలుడు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, తరువాతి క్రియతో ఉన్న హీబ్రూ పదప్రయోగాన్ని కొంతవరకు నిలుపుతుంది.
- source_word: תִּתְבָּרָר
  choice: నిర్మలుడిగా కనబడతావు
  rationale: ברר ధాతువు హిత్‌పయేల్ రూపం ఇక్కడ నిర్మలునితో సంబంధంలో దేవుడు తన నిర్మలత్వాన్ని వ్యక్తపరచడాన్ని సూచిస్తుంది. ఈ అనువాదం కేవలం ‘నిర్మలుడివి’ అని స్థితిని చెప్పకుండా సంబంధాత్మక భావాన్ని కాపాడుతుంది.
- source_word: עִקֵּשׁ
  choice: వక్రుడు
  rationale: ఈ విశేషణం నైతికంగా వంకరైన లేదా దుర్మార్గమైన వ్యక్తిని సూచిస్తుంది. ‘వక్రుడు’ సంక్షిప్తంగా, గంభీరంగా ఉండి తరువాతి పదబంధంతో సమాంతరతను నిలుపుతుంది.
- source_word: תִּתְפַּתָּל
  choice: వక్రంగా కనబడతావు
  rationale: פתל ధాతువు హిత్‌పయేల్ రూపం మెలికగా లేదా చాకచక్యంగా వ్యవహరించడాన్ని సూచించగలదు. ‘వక్రంగా కనబడతావు’ హీబ్రూలోని బలమైన పరస్పర పదప్రయోగాన్నీ కావ్యాత్మక ఉద్రిక్తతనూ నిలుపుతుంది; అపార్థం రాకుండా పాదటీపులో వివరణ ఇచ్చాం.
theological_decisions:
- issue: వక్రునికి దేవుడు ప్రతిస్పందించే విధానాన్ని మానవరూపకంగా వర్ణించడం
  choice: ప్రధాన పాఠంలో ‘వక్రంగా కనబడతావు’ అనే బలమైన పరస్పర పదప్రయోగాన్ని నిలుపడం
  alternative: ‘చాకచక్యంగా వ్యవహరిస్తావు’ లేదా ‘వక్రుణ్ణి అతని ఎత్తులతోనే ఓడిస్తావు’
  rationale: హీబ్రూ కవిత్వం మనిషి స్వభావానికి తగిన దేవుని ప్రతిస్పందనను ఉద్దేశపూర్వక సమాంతరతతో చెబుతుంది. మృదువైన ప్రత్యామ్నాయాలు ‘నిర్మలుడు/నిర్మలుడు; వక్రుడు/వక్రంగా’ అనే పదప్రయోగాన్ని తగ్గిస్తాయి. ఇది దేవుడు నైతికంగా వక్రుడవుతాడని కాక, వక్రుని వక్రతను అతనికే ఎదురుతిప్పే న్యాయసంబంధ ప్రతిస్పందనగా పాదటీపు స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తన కవిత్వానికి తగిన గంభీరతను ఉంచాం. రెండు పాదాల సమాంతర నిర్మాణాన్ని, ‘నిర్మలుడు/నిర్మలుడు’ మరియు ‘వక్రుడు/వక్రంగా’ అనే పదప్రతిధ్వనిని సాధ్యమైనంతగా కాపాడాం.
