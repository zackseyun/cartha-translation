revisions:
- from: ఆయన బలవంతుడైన నా శత్రువు చేతిలోనుండి[a], నన్ను ద్వేషించినవారి చేతిలోనుండి నన్ను విడిపించాడు; ఎందుకంటే వారు నాకంటే బలవంతులు.
  to: ఆయన నా బలమైన శత్రువు నుండి[a], నన్ను ద్వేషించేవారి నుండి నన్ను విడిపించాడు; ఎందుకంటే వారు నాకంటే బలవంతులు.
  rationale: The revision removes the unsupported ‘hand’ imagery and retains the Hebrew’s direct ‘from’ construction. It also renders the plural participle as ‘నన్ను ద్వేషించేవారు,’ preserving its ongoing hostile designation. The singular/plural contrast, past-time main verb, causal clause, and comparative force are retained.
