  text: He delivered me from my strong enemy[a], and from those who hated me[b], for they were too mighty for me.
translation:
  language: te
  text: ఆయన నా బలమైన శత్రువు నుండి[a], నన్ను ద్వేషించేవారి నుండి నన్ను విడిపించాడు; ఎందుకంటే వారు నాకంటే బలవంతులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, కవితాత్మక అసంపూర్ణ క్రియను వర్తమానసదృశంగా తీసుకుంటే, “ఆయన నన్ను విడిపిస్తాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַצִּילֵנִי
  choice: నన్ను విడిపించాడు
  rationale: נצל హిఫిల్ రూపం ‘విడిపించు, రక్షించు’ అనే అర్థం ఇస్తుంది. కీర్తనలో గతంలో జరిగిన దైవిక రక్షణను వర్ణిస్తున్న సందర్భానికి తెలుగు భూతకాలం సహజంగా సరిపోతుంది; కవితాత్మక అసంపూర్ణ క్రియకు వర్తమాన భావం ఉండగల అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: מֵאֹיְבִי
  choice: నా శత్రువు చేతిలోనుండి
  rationale: హీబ్రూ నామవాచకం ఏకవచనంలో, ప్రథమ పురుష ఏకవచన ప్రత్యయంతో ఉంది. ‘చేతిలోనుండి’ అనేది వ్యక్తి ఆధీనమో దాడియో నుండి విడిపించడాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: עָז
  choice: బలవంతుడైన
  rationale: ‘బలమైన, శక్తిమంతమైన’ అనే ప్రత్యక్ష అర్థాన్ని వ్యక్తిగత శత్రువును సూచించే సహజ తెలుగు విశేషణ రూపంలో ఇచ్చాం.
- source_word: וּמִשֹּׂנְאַי
  choice: నన్ను ద్వేషించినవారి చేతిలోనుండి
  rationale: שׂנא ధాతువు నుండి వచ్చిన బహువచన కృదంతం అక్షరార్థంగా ‘నన్ను ద్వేషించేవారు.’ సందర్భంలోని గతకాల కథనానికి అనుగుణంగా ‘ద్వేషించినవారు’ అని సహజంగా అనువదించాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: విడుదల అవసరమైన కారణాన్ని పరిచయం చేసే కారణార్థక సంధిగా స్పష్టమైన ఆధునిక తెలుగు రూపాన్ని ఎంచుకున్నాం.
- source_word: אָמְצוּ
  choice: బలవంతులు
  rationale: אמץ అంటే ‘బలంగా ఉండు.’ తరువాతి מן తులనార్థక నిర్మాణంతో కలిపి శత్రువులు కీర్తనకర్తకంటే ఎక్కువ బలం కలవారని తెలియజేస్తుంది.
- source_word: מִמֶּנִּי
  choice: నాకంటే
  rationale: מן ఇక్కడ తులనను లేదా ఆధిక్యాన్ని సూచిస్తుంది. ‘నాకంటే బలవంతులు’ అనేది మూలంలోని తులనను నేరుగా, సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: హీబ్రూ కవిత్వంలో ఆరంభ క్రియ యొక్క కాలాస్పెక్టు
  choice: 'గతకాల కథనం: ‘విడిపించాడు’'
  alternative: 'వర్తమానసదృశ భావం: ‘విడిపిస్తాడు’ లేదా ‘రక్షిస్తాడు’'
  rationale: ఈ కీర్తన భాగం కీర్తనకర్త మొర విని యెహోవా చేసిన గతకాల రక్షణ కార్యాలను వివరిస్తుంది. అందువల్ల భూతకాల రూపం కథన ప్రవాహాన్ని నిలుపుతుంది; అయితే కవితాత్మక imperfect రూపానికి వర్తమానసదృశ పఠనం సాధ్యమనే సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. హీబ్రూలో ‘నా శత్రువు’ ఏకవచనంగా, ‘నన్ను ద్వేషించినవారు’ బహువచనంగా ఉన్న వ్యత్యాసాన్ని ప్రధాన పాఠ్యంలోనే నిలుపుకున్నాం; అందువల్ల దానికి ప్రత్యేక పాదసూచిక అవసరం లేదు.
