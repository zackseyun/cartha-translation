  text: חֶבְלֵ֣י שְׁא֣וֹל סְבָב֑וּ/נִי קִ֝דְּמ֗וּ/נִי מ֣וֹקְשֵׁי מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/005.yaml
  text: The cords of Sheol surrounded me[b][a]; the snares of death confronted me.
translation:
  language: te
  text: షెయోల్ తాళ్లు నన్ను చుట్టుముట్టాయి; మరణపు ఉచ్చులు నాకు ఎదురయ్యాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “షెయోల్”కు “సమాధి” లేదా “మృతుల లోకం” అని కూడా అర్థం కావచ్చు. “నాకు ఎదురయ్యాయి”కి “నా ముందుకు వచ్చాయి” లేదా “నన్ను కలిశాయి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבְלֵי
  choice: తాళ్లు
  rationale: బంధించే లేదా చిక్కుకునే కవితాత్మక చిత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ఇక్కడ ‘ప్రసవవేదనలు’ అనే వేరొక అర్థాన్ని అనవసరంగా తీసుకురాదు.
- source_word: שְׁאוֹל
  choice: పాతాళం
  rationale: మృతుల లోకాన్ని సూచించే హెబ్రీ భావానికి తెలుగులో స్థిరపడిన విస్తృత సమానార్థకం; దానిని కేవలం ‘సమాధి’గా సంకుచితం చేయకుండా, తరువాతి సిద్ధాంతార్థాలను కూడా స్పష్టంగా చేర్చదు.
- source_word: סְבָבוּנִי
  choice: నన్ను చుట్టుముట్టాయి
  rationale: చుట్టూ ఆవరించడం అనే క్రియ యొక్క ప్రత్యక్ష భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: קִדְּמוּנִי
  choice: నాకు ఎదురయ్యాయి
  rationale: ముందుకు రావడం లేదా కలవడం అనే మూలభావాన్నీ, సందర్భంలోని బెదిరించే ఎదురుకావడాన్నీ నిలుపుతుంది.
- source_word: מוֹקְשֵׁי
  choice: ఉచ్చులు
  rationale: పట్టుకునే ఉచ్చు లేదా వల అనే భావాన్ని సంక్షిప్తంగా, కవితాత్మకంగా అందిస్తుంది.
- source_word: מָוֶת
  choice: మృత్యువు
  rationale: కవితా గాంభీర్యాన్నీ, మరణం ఒక బెదిరించే శక్తిగా కనిపించే చిత్రాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: שְׁאוֹל పదానికి అనువాదం
  choice: పాతాళం
  alternative: సమాధి; మృతుల లోకం; షెయోల్
  rationale: ‘పాతాళం’ హెబ్రీ పదంలోని మృతుల లోక భావాన్ని తెలుగులో సహజంగా ఉంచి, దానిని భౌతిక సమాధికే పరిమితం చేయదు. అదే సమయంలో ఈ వచనం నిర్దిష్ట పరలోక సిద్ధాంతాన్ని బోధిస్తున్నట్లు అనవసరంగా నిర్ణయించదు.
- issue: קִדְּמוּנִי యొక్క సందర్భార్థం
  choice: నాకు ఎదురయ్యాయి
  alternative: నా ముందుకు వచ్చాయి; నన్ను కలిశాయి
  rationale: హెబ్రీ క్రియలోని ‘ముందుకు రావడం/కలవడం’ అనే విస్తృతిని బెదిరింపు సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది; మరింత బలమైన ‘నన్ను పట్టుకున్నాయి’ వంటి భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన కవితా శైలి. ‘తాళ్లు—ఉచ్చులు’ అనే సమాంతర చిత్రణను, ‘పాతాళం—మృత్యువు’ అనే భావసామ్యాన్ని నిలిపాం. ‘పాతాళం’ సాధారణ పాఠకులకు ‘షెయోల్’ కంటే సహజం; అయితే దానిని ప్రత్యేక మతసిద్ధాంతార్థంతో వివరించలేదు.
