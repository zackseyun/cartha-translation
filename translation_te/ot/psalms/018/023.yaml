source:
  edition: WLC
  text: וָ/אֱהִ֣י תָמִ֣ים עִמּ֑/וֹ וָ֝/אֶשְׁתַּמֵּ֗ר מֵ/עֲוֺנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/023.yaml
  text: I was blameless before him[c][b][a], and I kept myself from my iniquity.
translation:
  language: te
  text: ఆయనతో నేను నిందలేనివాడిగా ఉన్నాను[a][b]; నా దోషం[c] నుండి నన్ను నేను కాపాడుకొన్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పరిపూర్ణంగా ఉన్నాను’ లేదా ‘యథార్థంగా ఉన్నాను’; ఇక్కడ ‘నిందలేనివాడు’ అనేది తప్పనిసరిగా సంపూర్ణ పాపరాహిత్యాన్ని కాక, నైతిక సమగ్రతను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆయన’ అనే సర్వనామం చుట్టుపక్కల సందర్భంలో యెహోవాను సూచిస్తుంది.
    reason: cross_reference
  - marker: c
    text: లేదా ‘నా అపరాధం నుండి’ లేదా ‘నా పాపం నుండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: నేను ... ఉన్నాను
  rationale: היה యొక్క Qal wayyiqtol ప్రథమ పురుష ఏకవచన రూపం ఇక్కడ గతకాల స్థితిని సూచిస్తుంది; కీర్తనా సందర్భంలో ‘నేను ఉన్నాను’ సహజంగా ఉంది.
- source_word: תָמִים
  choice: నిందలేనివాడిగా
  rationale: నైతిక సందర్భంలో תָמִים సంపూర్ణ పాపరాహిత్యాన్ని తప్పనిసరిగా సూచించకుండా యథార్థతను, సమగ్రతను, నిందకు తావులేని నడవడిని తెలియజేస్తుంది.
- source_word: עִמּוֹ
  choice: ఆయనతో
  rationale: עִם + తృతీయ పురుష పుంలింగ ఏకవచన ప్రత్యయం యొక్క ప్రత్యక్ష అర్థం ‘ఆయనతో’; చుట్టుపక్కల సందర్భంలో ‘ఆయన’ యెహోవాను సూచించినా, మూలంలోని సర్వనామ రూపాన్ని నిలిపాం.
- source_word: וָאֶשְׁתַּמֵּר
  choice: నన్ను నేను కాపాడుకున్నాను
  rationale: שׁמר యొక్క Hitpael రూపంలోని ఆత్మార్థక భావాన్ని ‘నన్ను నేను కాపాడుకున్నాను’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מֵעֲוֺנִי
  choice: నా దోషం నుండి
  rationale: עָוֹן దోషం, అపరాధం లేదా పాపం అనే భావాలను కలిగి ఉంటుంది; מן విభక్తి సూచించే దూరీకరణ భావాన్ని ‘నుండి’ నిలుపుతుంది, ప్రథమ పురుష ప్రత్యయాన్ని ‘నా’గా అనువదించాం.
theological_decisions:
- issue: ‘నిందలేనివాడు’ అనే మాట మానవుని నైతిక స్థితికి సంబంధించి ఏమి సూచిస్తుంది?
  choice: ఇది యథార్థతను, నిందకు తావులేని నడవడిని సూచిస్తుంది; సంపూర్ణ పాపరాహిత్యాన్ని తప్పనిసరిగా ప్రకటించదు.
  alternative: సంపూర్ణ పాపరాహిత్యం
  rationale: ఈ కీర్తనలో వక్త తన ప్రవర్తన, నిబద్ధత, తీర్పులో తనకు లభించిన నిర్దోషిత్వం గురించి బలమైన వాదన చేస్తున్నాడు. అయితే תָמִים అనే పదం మాత్రమే సంపూర్ణ పాపరాహిత్య సిద్ధాంతాన్ని నిర్బంధించదు; అందువల్ల మూలంలోని బలాన్నీ ఉద్రిక్తతనూ నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. మూలంలోని ‘ఆయనతో’ అనే సంబంధార్థక నిర్మాణాన్ని, ‘నా దోషం’ అనే అసౌకర్యకరమైనా ఉద్దేశపూర్వకమైన స్వీయసంబంధ పదబంధాన్ని నిలిపాం.
