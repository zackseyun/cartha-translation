  - severity: low
    issue: Footnote c is anchored after the whole clause rather than at the word it explains.
    rationale: The note concerns ‘నా దోషం’ (מֵעֲוֺנִי); placing its marker immediately after that phrase makes the reference unambiguous.
  - severity: low
