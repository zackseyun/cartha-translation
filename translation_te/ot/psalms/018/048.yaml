  text: the one who rescues me from my enemies[a]; indeed, you lift me up above those who rise against me[c][b]; you deliver me from the violent man.
translation:
  language: te
  text: నా శత్రువుల నుండి నన్ను విడిపించేవాడా[a], అంతేకాదు, నాపై లేచేవారికంటే నన్ను ఉన్నతంగా నిలబెడతావు[b]; హింసాత్మక మనిషి నుండి నన్ను రక్షిస్తావు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా శత్రువుల నుండి నన్ను విడిపించువాడా.’ హెబ్రీలో వచనారంభం దేవుణ్ణి వర్ణించే బిరుదుగా వాడిన కృదంత రూపం.
