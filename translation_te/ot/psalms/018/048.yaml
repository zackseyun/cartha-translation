lexical_decisions:
- source_word: מְפַלְּטִי
  choice: నన్ను విడిపించేవాడా
  rationale: פלט ధాతువు నుంచి వచ్చిన ఈ కృదంత రూపం, ప్రథమ పురుష ఏకవచన ప్రత్యయంతో, దేవుణ్ణి ఆయన నిరంతర రక్షణ కార్యం ద్వారా సంబోధించే బిరుదులా పనిచేస్తుంది. సంబోధన రూపం హెబ్రీ కవితా నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מֵאֹיְבַי
  choice: నా శత్రువుల నుండి
  rationale: מן ఉపసర్గతో పాటు ప్రథమ పురుష ఏకవచన ప్రత్యయం కలిగిన אֹיְבִים పదానికి సందర్భానుగుణమైన ప్రత్యక్ష అనువాదం.
- source_word: אַף
  choice: ప్రత్యేక పదంగా అనువదించకుండా, వాక్య క్రమంలోని బలపరిచే భావంలో వ్యక్తీకరించబడింది
  rationale: ఇక్కడ אַף తదుపరి వాక్యభాగాన్ని బలపరుస్తుంది. తెలుగులో ‘నిజంగా’ లేదా ‘అంతేకాదు’ చేర్చితే కవితా ప్రవాహం కృత్రిమంగా వినిపించే అవకాశం ఉన్నందున, వరుస రక్షణ కార్యాల నిర్మాణమే ఆ ఉద్ఘాటనను మోస్తుంది.
- source_word: מִן קָמַי
  choice: నాపై లేచేవారికంటే
  rationale: קום యొక్క బహువచన కృదంత రూపం విరోధంగా లేచేవారిని సూచిస్తుంది. רוםతో కలిసిన מן ఇక్కడ తులనాత్మక భావాన్ని ఇస్తుంది; అందువల్ల ‘కంటే’ మూలంలోని ‘వారికి పైగా’ అనే భావాన్ని సహజంగా తెలుపుతుంది.
- source_word: תְּרוֹמְמֵנִי
  choice: నన్ను ఉన్నతంగా నిలబెడతావు
  rationale: רום యొక్క కారణార్థక భావం ‘ఎత్తడం/ఉన్నత స్థితిలో ఉంచడం.’ ఈ ఎంపిక నిలువు రూపకాన్ని కాపాడుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: מֵאִישׁ חָמָס
  choice: హింసాత్మకుడైన మనిషి నుండి
  rationale: אִישׁ ఏకవచన పుంలింగ ‘మనిషి’; חָמָס హింస, దౌర్జన్యం, అన్యాయాన్ని సూచిస్తుంది. మూలంలోని నిర్దిష్ట వ్యాకరణ రూపాన్ని నిలుపుతూ వ్యక్తి స్వభావాన్ని స్పష్టంగా చెబుతుంది.
- source_word: תַּצִּילֵנִי
  choice: నన్ను రక్షిస్తావు
  rationale: נצל ప్రమాదం లేదా దాడి నుంచి బయటపడేలా చేయడాన్ని సూచిస్తుంది. ముందు ఉన్న פלטకు ‘విడిపించు’ అని ఇచ్చినందున, ఇక్కడ ‘రక్షించు’ వాడటం మూలంలోని క్రియాభేదాన్ని కొంతవరకు నిలుపుతుంది.
theological_decisions:
- issue: వచనారంభంలోని కృదంతం ఎవరిని సూచిస్తుంది, అది ఎలా అనుసంధానమవుతుంది?
  choice: 'దేవుణ్ణి నేరుగా సంబోధించే బిరుదుగా: ‘నన్ను విడిపించేవాడా’'
  alternative: ముందరి వచనానికి అనుసంధానమైన సంబంధ వాక్యంగా లేదా కేవలం ‘నన్ను విడిపిస్తావు’ అనే సమాపక క్రియగా చదవడం
  rationale: హెబ్రీలోని substantival participle తరువాత రెండవ పురుష క్రియలు వస్తాయి. ప్రత్యక్ష సంబోధనగా ఉంచడం ఈ మార్పును, కవితా ఉద్వేగాన్ని కాపాడుతుంది; అనవసరంగా ముందరి వచనంతో ఒకే వాక్యంగా కలపదు.
- issue: אִישׁ యొక్క లింగ సూచన
  choice: మనిషి
  alternative: వ్యక్తి
  rationale: మూలం ఏకవచన పుంలింగ రూపంలో ఒక హింసాత్మక దోపిడీదారుని సూచిస్తుంది. అందువల్ల లింగాన్ని పూర్తిగా తటస్థీకరించకుండా ‘మనిషి’గా అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే కీర్తనా కవిత్వానికి తగిన గౌరవభరిత సంబోధనను ఉపయోగించింది. ‘విడిపించు/రక్షించు’ ద్వారా రెండు హెబ్రీ క్రియల భేదాన్ని కొంత నిలిపింది; ‘ఉన్నతంగా నిలబెట్టు’ ద్వారా ఎత్తు రూపకాన్ని కాపాడింది.
