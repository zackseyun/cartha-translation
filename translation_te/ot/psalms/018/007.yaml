  text: Then the earth reeled and quaked[a], and the foundations of the mountains trembled and reeled, because he was angry.
translation:
  language: te
  text: అప్పుడు భూమి తల్లడిల్లి కంపించింది; పర్వతాల పునాదులు వణికి తల్లడిల్లాయి, ఎందుకంటే ఆయనకు కోపం రగిలింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, ‘ఎందుకంటే ఆయన కోపం మండింది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגְעַשׁ
  choice: తల్లడిల్లి
  rationale: געשׁ సూచించే తీవ్రమైన కదలికను కేవలం ‘కదిలింది’ అని చదును చేయకుండా, భూమి ఊగిపోతున్న కవితాత్మక చిత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וַתִּרְעַשׁ
  choice: కంపించింది
  rationale: רעשׁ భూకంపంలాంటి ప్రకంపనను సూచిస్తుంది; ‘భూమి కంపించింది’ ఆధునిక తెలుగులో సహజమైన ప్రయోగం, అలాగే ముందటి క్రియతో ఉన్న భేదాన్ని కాపాడుతుంది.
- source_word: הָאָרֶץ
  choice: భూమి
  rationale: దైవ ప్రత్యక్షత వల్ల సృష్టి కదిలే ఈ విశ్వవ్యాప్త సందర్భంలో స్థానికమైన ‘దేశం’ కంటే ‘భూమి’ తగినది.
- source_word: מוֹסְדֵי הָרִים
  choice: పర్వతాల పునాదులు
  rationale: సృష్టి క్రమానికి ఆధారాలుగా ఊహించిన పర్వతాల మూలాధారాలను మూలంలోని కవితాత్మక చిత్రానికి సమీపంగా వ్యక్తం చేస్తుంది.
- source_word: יִרְגָּזוּ
  choice: వణికి
  rationale: רגז సూచించే వణుకు లేదా కలవరాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּתְגָּעֲשׁוּ
  choice: తల్లడిల్లాయి
  rationale: ప్రారంభంలోని געשׁను మళ్లీ ప్రతిధ్వనింపజేసి హెబ్రీ కవిత్వంలోని పునరావృత్తిని నిలుపుతుంది; తీవ్రంగా కదిలిన పునాదుల చిత్రాన్ని ఇస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: భూమి, పర్వతాల కల్లోలానికి కారణాన్ని స్పష్టంగా పరిచయం చేసే కారణార్థక అనుసంధానం.
- source_word: חָרָה לוֹ
  choice: ఆయనకు కోపం రగిలింది
  rationale: ‘మండుట’ అనే మూలరూపకాన్ని పూర్తిగా తొలగించకుండా, חרה + ל యొక్క కోపార్థక నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుని ఉగ్రతను మానవ భావోద్వేగ భాషలో వర్ణించడం
  choice: ఆయనకు కోపం రగిలింది
  alternative: ఆయన కోపంతో మండిపోయాడు
  rationale: దేవుని కోపం నిజమైనదనే వాక్యబలాన్ని తగ్గించకుండా, హెబ్రీలోని ‘మండుట’ రూపకాన్ని సహజమైన తెలుగు నుడికారంలో ఉంచుతుంది. దీనిని కేవలం భావరహిత పరిణామంగా మార్చదు; అలాగే అవసరానికి మించి శరీరసంబంధ అర్థాన్ని కూడా రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తన కవిత్వానికి తగిన గంభీరతతో, సాధారణ పాఠకునికి అర్థమయ్యే పదజాలం. సమాంతర క్రియల భేదం మరియు געשׁ పునరావృత్తి సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
