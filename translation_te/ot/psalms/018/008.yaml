  yaml_path: translation/ot/psalms/018/008.yaml
  text: Smoke rose from his nostrils[a], and fire from his mouth consumed; coals blazed from him.
translation:
  language: te
  text: ఆయన నాసికల నుండి పొగ పైకి లేచింది[a]; ఆయన నోటి నుండి దహించే అగ్ని; ఆయన నుండి నిప్పుకణాలు మండాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన కోపంలో.’ హీబ్రూ אַף అనే పదానికి ‘ముక్కు/నాసిక’ అనే అర్థమూ, రూపకంగా ‘కోపం’ అనే అర్థమూ ఉన్నాయి. ఇక్కడ ‘ఆయన నోటి నుండి’ అనే సమాంతర వాక్యభాగం స్పష్టమైన శరీరరూప చిత్రణకు మద్దతు ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עָשָׁן
  choice: పొగ పైకి లేచింది
  rationale: עלה యొక్క పైకి కదలడాన్ని, עשן యొక్క ప్రత్యక్ష అర్థాన్ని సహజమైన తెలుగు కవితా వాక్యంగా నిలుపుతుంది.
- source_word: בְּאַפּוֹ
  choice: ఆయన నాసికల నుండి
  rationale: אַף కు ‘కోపం’ అనే రూపకాలంకార అర్థం సాధ్యమైనప్పటికీ, తరువాతి ‘ఆయన నోటి నుండి’ అనే సమాంతర దృశ్యం ఇక్కడ శరీరావయవానికి సంబంధించిన స్పష్టమైన చిత్రాన్ని బలపరుస్తుంది. పొగ ఉద్గమాన్ని తెలుగులో సహజంగా చెప్పడానికి ‘నుండి’ వాడబడింది.
- source_word: וְאֵשׁ מִפִּיו תֹּאכֵל
  choice: ఆయన నోటి నుండి వచ్చిన అగ్ని దహించింది
  rationale: תֹּאכֵל ను విశేషణంగా మార్చకుండా క్రియగానే అనువదించి, అగ్ని చురుకుగా మింగివేయడం లేదా దహించడం అనే భావాన్ని నిలిపింది; తెలుగులో కర్త స్పష్టత కోసం ‘వచ్చిన’ చేర్చబడింది.
- source_word: גֶּחָלִים
  choice: నిప్పులు
  rationale: ఇక్కడ మండుతున్న అగ్నికణాలు లేదా నిప్పుకణాల దృశ్యాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: בָּעֲרוּ מִמֶּנּוּ
  choice: ఆయన నుండి నిప్పులు మండాయి
  rationale: בער యొక్క మండే భావాన్నీ, מן యొక్క ‘నుండి’ అనే మూలార్థాన్నీ అతిగా వివరణ చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: దైవ ప్రత్యక్షతలో దేవుని గురించి మానవరూప వర్ణన
  choice: ‘నాసికలు,’ ‘నోరు’ అనే శరీరరూప చిత్రణను యథాతథంగా ఉంచడం
  alternative: אַף ను ‘కోపం’గా తీసుకొని ‘ఆయన కోపంలో పొగ పైకి లేచింది’ అని అనువదించడం
  rationale: ఇది కవితాత్మక దైవ ప్రత్యక్షత. ‘నోటి నుండి’ అనే సమాంతర వాక్యభాగం స్పష్టమైన శరీరరూప చిత్రణకు మద్దతిస్తుంది; దాన్ని అమూర్తమైన ‘కోపం’గా మార్చితే మూలంలోని ఉద్దేశపూర్వక దృశ్యబలం తగ్గుతుంది. అయితే పదంలోని నిజమైన ద్వంద్వార్థాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని వాడాం. ‘నాసికలు’ దైవ ప్రత్యక్షతలోని శరీరరూప చిత్రణను స్పష్టంగా, మర్యాదగా నిలుపుతుంది; వాక్యంలోని మూడు అగ్ని-చిత్రాలను అర్ధవిరామాలతో సమాంతరంగా అమర్చాం.
