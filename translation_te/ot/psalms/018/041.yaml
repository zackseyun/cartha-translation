translation:
  language: te
  text: వారు సహాయం కోసం మొరపెట్టుకున్నారు, కాని రక్షకుడు లేడు; యెహోవాకు మొరపెట్టుకున్నారు, కాని ఆయన వారికి జవాబివ్వలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְשַׁוְּעוּ
  choice: సహాయం కోసం మొరపెట్టుకున్నారు
  rationale: ఈ క్రియలోని ఆపదలో సహాయం కోరుతూ కేకవేయడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מוֹשִׁיעַ
  choice: రక్షకుడు
  rationale: ‘రక్షించేవాడు’ అనే హీబ్రూ కర్తృవాచక రూపాన్ని సంక్షిప్తంగా నిలుపుతూ, వాక్యంలోని రక్షణ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలపాఠంలోని దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో నేరుగా సూచిస్తుంది.
- source_word: עָנָם
  choice: వారికి జవాబివ్వలేదు
  rationale: ‘వారికి సమాధానం ఇవ్వలేదు’ అనే మూలార్థాన్ని సహజమైన తెలుగులో ఖచ్చితంగా అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూల హీబ్రూ పాఠంలో వ్యక్తిగత దైవనామం ఉన్నందున దానిని బిరుదుగా మార్చకుండా నిలుపుకున్నాం.
- issue: מוֹשִׁיעַ ను వ్యక్తివాచకంగా చూపడం
  choice: రక్షకుడు
  alternative: రక్షించేవాడు ఎవరూ
  rationale: హీబ్రూ రూపంలోని ‘రక్షించే వ్యక్తి’ భావాన్ని నిలుపుతూ, ఇక్కడ అది ప్రత్యేక సిద్ధాంతపరమైన బిరుదని నిర్బంధించకుండా సందర్భానుసారంగా అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. హీబ్రూలో రెండోసారి క్రియ సూచితంగా ఉన్న చోట తెలుగులో స్పష్టత కోసం ‘మొరపెట్టుకున్నారు’ను పునరుక్తి చేశాం.
