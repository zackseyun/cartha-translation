translation:
  language: te
  text: 'నా హృదయంలో అన్యాయానికి చోటిచ్చి ఉంటే[a],

    ప్రభువు ఆలకించేవాడు కాదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా హృదయంలో అన్యాయాన్ని పరిగణించి ఉంటే, ప్రభువు వినేవాడు కాదు.’
    reason: רָאִיתִי అక్షరార్థంగా ‘చూశాను’; ఈ హృదయ-ప్రయోగంలో ‘పరిగణించడం’ లేదా అనుకూలంగా చూడడం అనే ప్రత్యామ్నాయ భావం సాధ్యమే.
lexical_decisions:
- source_word: אָוֶן
  choice: దుష్టత్వం
  rationale: ఇక్కడ ఈ పదం కష్టం లేదా వ్యథను కాక నైతికమైన చెడును సూచిస్తుంది. ‘దుష్టత్వం’ ఆ నైతిక భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אִם
  choice: ఉంటే
  rationale: ఈ అవ్యయం షరతును ప్రవేశపెడుతుంది; తెలుగులో ‘ఉంటే’ సహజమైన షరతు నిర్మాణాన్ని ఇస్తుంది.
- source_word: רָאִיתִי
  choice: ఆదరించి ఉంటే
  rationale: క్రియకు ప్రాథమికంగా ‘చూశాను’ అనే అర్థం ఉన్నా, ‘హృదయంలో చూడడం’ అనే ఈ సందర్భోచిత ప్రయోగం దుష్టత్వాన్ని అంతరంగంలో సమ్మతించి పోషించడాన్ని సూచిస్తుంది. ‘ఆదరించి ఉంటే’ ఆ భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְלִבִּי
  choice: నా హృదయంలో
  rationale: ‘హృదయం’ అంతరంగం, ఆలోచన, సంకల్పం అనే భావాలను నిలుపుతుంది; మూలంలోని రూపకాన్ని అనవసరంగా సరళీకరించదు.
- source_word: לֹא יִשְׁמַע
  choice: వినేవాడు కాదు
  rationale: ప్రార్థన సందర్భంలో ఇది కేవలం శబ్దం వినడాన్ని కాక అనుకూలంగా ఆలకించడాన్ని సూచిస్తుంది. అయితే మూలంలో నేరుగా ‘జవాబిచ్చేవాడు కాదు’ అని లేనందున దానిని చేర్చలేదు.
- source_word: אֲדֹנָי
  choice: ప్రభువు
  rationale: ఇది దేవునికి వాడే గౌరవపూర్వక బిరుదు. ఆధునిక ప్రామాణిక తెలుగులో ‘ప్రభువు’ సహజమైన అనువాదం.
theological_decisions:
- issue: ‘హృదయంలో చూడడం’ అనే హీబ్రూ ప్రయోగాన్ని అక్షరార్థంగా అనువదించాలా, భావార్థంగా అనువదించాలా
  choice: అంతరంగంలో దుష్టత్వాన్ని ఆదరించడం
  alternative: నా హృదయంలో దుష్టత్వాన్ని చూసి ఉంటే / దానిని లక్ష్యపెట్టి ఉంటే
  rationale: ఈ వాక్యం పాపం ఉందని గుర్తించడం గురించి మాత్రమే కాక, దానిని అంతరంగంలో సమ్మతించి ఉంచుకోవడం గురించి మాట్లాడుతుంది. ‘ఆదరించి’ అనేది ప్రయోగంలోని నైతిక ఉద్దేశాన్ని తెలియజేస్తూనే ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
- issue: שׁמע ను ‘విను’, ‘ఆలకించు’, లేదా ‘జవాబివ్వు’ అని అనువదించడం
  choice: వినేవాడు కాదు
  alternative: ఆలకించేవాడు కాదు / జవాబిచ్చేవాడు కాదు
  rationale: ‘విను’ మూలపదానికి దగ్గరగా ఉండి తెలుగులో ప్రార్థనను అనుకూలంగా స్వీకరించే భావాన్నీ మోయగలదు. ‘జవాబివ్వు’ అనేది మూలంలో స్పష్టంగా లేని ఫలితాన్ని చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే కీర్తనకు తగిన గంభీరతతో. రెండు పాదాల కవితా నిర్మాణం నిలుపబడింది; మూలంలో స్పష్టంగా లేని ‘నా ప్రార్థనను’ అనే కర్మను ప్రధాన పాఠంలో చేర్చలేదు.
