translation:
  language: te
  text: 'నా పెదవులు పలికినవాటిని,

    నేను కష్టంలో ఉన్నప్పుడు నా నోరు చెప్పినవాటిని.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר
  choice: వాటిని
  rationale: ముందటి వచనంలోని మొక్కుబడులను సూచించే సంబంధార్థాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: פָּצוּ
  choice: పలికిన
  rationale: మూలార్థం ‘తెరిచిన’ అయినప్పటికీ, పెదవులు తెరవడం అనే హీబ్రూ ప్రయోగం మాటలు పలకడాన్ని సూచిస్తుంది; ‘పలికిన’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: שְׂפָתַי
  choice: నా పెదవులు
  rationale: హీబ్రూ కవిత్వంలోని శరీరావయవ రూపకాన్ని, ‘నా నోరు’తో ఉన్న సమాంతరతను నిలుపుతుంది.
- source_word: וְדִבֶּר
  choice: చెప్పిన
  rationale: דבר యొక్క మాటలాడే భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ మొదటి పాదంతో సమాంతరతను ఉంచుతుంది.
- source_word: פִּי
  choice: నా నోరు
  rationale: ‘నా పెదవులు / నా నోరు’ అనే సమానార్థక కవితా సమాంతరతను యథాతథంగా నిలుపుతుంది.
- source_word: בַּצַּר לִי
  choice: నేను కష్టంలో ఉన్నప్పుడు
  rationale: వక్తను బాధించిన కష్టస్థితినీ దాని కాలసంబంధ భావాన్నీ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కవితా శైలి. ‘పెదవులు / నోరు’ అనే హీబ్రూ సమాంతరత నిలుపబడింది; ‘పెదవులు తెరిచిన’ అనే అక్షరార్థం తెలుగులో అసహజంగా ఉండటంతో దాని ప్రయోగార్థమైన ‘పలికిన’ ఎంచుకోబడింది.
