translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాక్ష్యభావంతో కూడిన గంభీరమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి. ‘విన్నాడు’ మరియు ‘శ్రద్ధగా ఆలకించాడు’ అనే సమాంతర వ్యక్తీకరణను హెబ్రీ కవితా బలానికి అనుగుణంగా నిలిపింది.
