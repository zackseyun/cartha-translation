  yaml_path: translation/ot/psalms/066/019.yaml
  text: Surely God has heard[a]; he has listened to the voice of my prayer.
translation:
  language: te
  text: నిజంగా దేవుడు విన్నాడు; నా ప్రార్థన స్వరాన్ని ఆయన శ్రద్ధగా ఆలకించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָכֵן
  choice: నిజంగా
  rationale: దృఢమైన నిర్ధారణను తెలియజేసే హెబ్రీ అవ్యయానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: שָׁמַע
  choice: విన్నాడు
  rationale: హెబ్రీ సంపూర్ణ క్రియలోని పూర్తయిన కార్యాన్ని సరళంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: క్రియ ఏకవచనంలో ఉండడం వల్ల ఇక్కడ ఏకైక దేవుణ్ణి సూచిస్తుంది; ప్రామాణిక తెలుగు అనువాదం.
- source_word: הִקְשִׁיב
  choice: శ్రద్ధగా ఆలకించాడు
  rationale: హిఫిల్ రూపం సూచించే శ్రద్ధపూర్వకంగా చెవియొగ్గి వినే భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בְּקוֹל
  choice: స్వరాన్ని
  rationale: קוֹל అనే పదంలోని ‘స్వరం/ధ్వని’ భావాన్ని నిలుపుతూ, הִקְשִׁיב క్రియతో సహజమైన తెలుగు కర్మరూపంలో ఇచ్చింది.
- source_word: תְּפִלָּתִי
  choice: నా ప్రార్థన
  rationale: మొదటి పురుష ఏకవచన స్వామ్య ప్రత్యయంతో ఉన్న నామవాచకానికి నేరమైన, సహజమైన అనువాదం.
