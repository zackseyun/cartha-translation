id: PSA.66.16
reference: Psalms 66:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לְכֽוּ שִׁמְע֣וּ וַ֭/אֲסַפְּרָה כָּל יִרְאֵ֣י אֱלֹהִ֑ים אֲשֶׁ֖ר עָשָׂ֣ה לְ/נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/016.yaml
  text: Come and hear[a], all you who fear God, and I will tell what he has done for my soul.
translation:
  language: te
  text: దేవునికి భయపడే వారందరా, రండి, వినండి; ఆయన నా ప్రాణం కోసం చేసినదాన్ని నేను చెబుతాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన నా జీవితం కోసం చేసినదాన్ని.” హీబ్రూ נֶפֶשׁ (నెఫెష్) అనే పదానికి సందర్భాన్ని బట్టి “ప్రాణం,” “జీవితం,” లేదా “స్వయం” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: రండి
  rationale: మూల క్రియకు అక్షరార్థంగా ‘వెళ్లండి/నడవండి’ అనే భావం ఉన్నా, ఇక్కడ ఆహ్వాన పిలుపులో ‘రండి’ అనే ప్రయోగమే సహజంగా వక్తవైపు శ్రోతలను పిలుస్తుంది.
- source_word: שִׁמְעוּ
  choice: వినండి
  rationale: ఆజ్ఞార్థక బలాన్ని, శ్రద్ధగా ఆలకించాలనే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וַאֲסַפְּרָה
  choice: నేను చెబుతాను
  rationale: ספר ఇక్కడ జరిగినదాన్ని వివరించి చెప్పడం అనే అర్థంలో ఉంది; ఈ రూపం వక్త సంకల్పాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כָּל יִרְאֵי אֱלֹהִים
  choice: దేవునికి భయపడే వారందరా
  rationale: దేవునిపట్ల భక్తిపూర్వక భయభక్తులు కలిగిన వారిని నేరుగా సంబోధిస్తున్న నిర్మాణాన్ని నిలుపుతుంది; ‘భయం’ అనే బైబిలు భావాన్ని కేవలం గౌరవంగా సడలించదు.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఇక్కడ దైవనామం YHWH కాక אֱלֹהִים అనే సాధారణ దైవ బిరుదు ఉంది.
- source_word: אֲשֶׁר עָשָׂה
  choice: ఆయన ... చేసినదాన్ని
  rationale: పూర్తయిన దైవకార్యాన్ని సాక్ష్యంగా వివరించే సంబంధ వాక్యాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: לְנַפְשִׁי
  choice: నా ప్రాణానికి
  rationale: נֶפֶשׁ యొక్క ‘ప్రాణం, జీవితం, స్వయం’ అనే విస్తృత భావపరిధిని కొంతవరకు నిలుపుతూ, ‘నాకు’ అని పూర్తిగా సాధారణీకరించకుండా వ్యక్తిగత లోతును వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘దేవునికి భయపడడం’ అనే భావం
  choice: భక్తిపూర్వక భయభక్తి
  alternative: భయభ్రాంతి మాత్రమే; లేదా సాధారణ గౌరవం మాత్రమే
  rationale: మూలంలోని ‘భయం’ అనే ఉద్వేగాన్ని నిలుపుతూ, దాన్ని కేవలం భీతిగా తీవ్రతరం చేయకుండా లేదా సాధారణ గౌరవంగా బలహీనపరచకుండా అనువదించబడింది.
- issue: נֶפֶשׁ యొక్క అర్థం
  choice: ప్రాణం
  alternative: జీవితం; నేను/నా స్వయం; ఆత్మ
  rationale: ఈ సందర్భంలో మూలపదానికి ఉన్న వ్యక్తిగతమైన, జీవసంబంధమైన విస్తృతిని ‘ప్రాణం’ నిలుపుతుంది. ‘జీవితం’ కూడా సందర్భోచితమైన సాధ్యార్థం కావడంతో పాదటిప్పణిలో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గౌరవప్రదమైన, సామాన్య పాఠకులకు స్పష్టమైన శైలి. ప్రత్యక్ష సంబోధనను ‘వారందరా’తో, వరుస ఆహ్వాన ఆజ్ఞలను ‘రండి, వినండి’తో సహజంగా నిలిపింది.
