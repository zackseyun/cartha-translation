- from: దేవునికి భయపడే వారందరా, రండి, వినండి; ఆయన నా ప్రాణానికి చేసినదాన్ని నేను చెబుతాను.[a]
  to: దేవునికి భయపడే వారందరా, రండి, వినండి; ఆయన నా ప్రాణం కోసం చేసినదాన్ని నేను చెబుతాను.[a]
