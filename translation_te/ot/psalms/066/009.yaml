  text: the one who keeps our soul in life and has not allowed our feet to slip[a][b][c].
translation:
  language: te
  text: మన ప్రాణాన్ని[a][b] సజీవంగా ఉంచి, మన పాదాలు జారిపోనివ్వని[c] వాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మన ప్రాణాన్ని జీవుల మధ్య ఉంచే వాడు.” שׂוּם అనే హీబ్రూ కృదంతానికి “పెట్టు/ఉంచు” అనే అర్థం రావచ్చు; ఇక్కడ అది ప్రాణాన్ని కాపాడే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “మన ప్రాణం” అనే మాటను “మన జీవితం” లేదా “మనలను” అని కూడా అనువదించవచ్చు. נֶפֶשׁ అనే హీబ్రూ పదానికి ప్రాణం, జీవితం, వ్యక్తి అనే అర్థాలు ఉన్నాయి.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “మన పాదాలు తడబడనివ్వని వాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂם
  choice: సజీవంగా ఉంచి…వాడు
  rationale: שׂוּם అనే క్రియకు మౌలికంగా ‘పెట్టు/ఉంచు’ అనే అర్థం ఉంది. అయితే נַפְשֵׁנוּ בַּחַיִּים అనే సందర్భంలో దేవుడు ప్రాణాన్ని కాపాడి సజీవంగా ఉంచుతున్న భావం ప్రధానంగా ఉంది. కర్తను సూచించే హీబ్రూ కృదంత రూపాన్ని ‘…వాడు’తో నిలిపాం.
- source_word: נַפְשֵׁנוּ
  choice: మన ప్రాణాన్ని
  rationale: נֶפֶשׁ పదం ప్రాణం, జీవితం, వ్యక్తి అనే విస్తృత అర్థాలను కలిగి ఉంది. ఇక్కడ జీవించి ఉండడమే సందర్భార్థం; ‘ప్రాణం’ మూలంలోని రూపకాన్ని, అర్థ విస్తృతిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בַּחַיִּים
  choice: సజీవంగా
  rationale: అక్షరార్థంగా ‘జీవంలో/జీవుల మధ్య’ అనే భావం. ఈ సందర్భంలో జీవుల లోకంలో నిలిపి ఉంచడం, అంటే సజీవంగా కాపాడడం ఉద్దేశం. ‘సజీవంగా’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: וְלֹא נָתַן
  choice: పోనివ్వని
  rationale: నָתַן + క్రియారూపం కలయిక ఇక్కడ ఏదైనా జరగడానికి అనుమతించడం అనే నుడికారార్థాన్ని ఇస్తుంది. అందువల్ల ‘పోనివ్వని’ అని అనువదించాం.
- source_word: לַמּוֹט
  choice: జారిపో
  rationale: מוֹט అస్థిరపడడం, తడబడడం, జారడం అనే భావాలను ఇస్తుంది. పాదాలతో కలిసి వచ్చినందున ‘జారిపోవడం’ సహజమైనది; ‘తడబడడం’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: רַגְלֵנוּ
  choice: మన పాదాలు
  rationale: మూలంలోని స్పష్టమైన శరీర రూపకాన్ని యథాతథంగా నిలిపాం. ఇది స్థిరత్వం, రక్షణను సూచించినా దానిని వివరణాత్మకంగా మార్చలేదు.
