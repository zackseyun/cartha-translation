translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గౌరవభరితమైన ధోరణితో అనువదించాం. హీబ్రూ వాక్యం ముందు సందర్భాన్ని కొనసాగించే కృదంత పదబంధం కావడంతో తెలుగులోనూ ‘…వాడు’ అనే సంబంధ రూపాన్ని ఉంచాం. ‘ప్రాణం,’ ‘పాదాలు’ అనే మూల చిత్రాలను నిలిపి, నుడికారాలను సహజమైన తెలుగులో వ్యక్తం చేశాం.
