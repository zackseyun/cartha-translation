lexical_decisions:
- source_word: אָבוֹא
  choice: వస్తాను
  rationale: בוא అనే క్రియ యొక్క ఖల్ అసంపూర్ణ రూపం, ప్రథమ పురుష ఏకవచనం; ఇక్కడ భవిష్యత్తు ఉద్దేశాన్ని సూచిస్తుంది. ‘వస్తాను’ సహజమైన తెలుగు; ‘ప్రవేశిస్తాను’ కూడా సాధ్యమే.
- source_word: בֵיתְךָ
  choice: నీ మందిరానికి
  rationale: అక్షరార్థంగా ‘నీ ఇంటికి.’ అయితే దేవునికి దహనబలులు అర్పించే స్థలాన్ని సూచించే ఈ సందర్భంలో తెలుగు పాఠకులకు ‘మందిరం’ సహజంగా, స్పష్టంగా ఉంటుంది; మూలంలోని ‘ఇల్లు’ రూపకం పాదసూచికలో భద్రపరచబడింది.
- source_word: בְעוֹלוֹת
  choice: దహనబలులతో
  rationale: עֹלָה అనేది పూర్తిగా దహించబడే బలికి వాడే ప్రామాణిక బలిసంబంధ పదం. בְ ఉపసర్గ ఇక్కడ తోడును సూచిస్తుంది.
- source_word: אֲשַׁלֵּם
  choice: నెరవేరుస్తాను
  rationale: שלם పియేల్ రూపం మొక్కుబడులతో కలిసినప్పుడు వాటిని చెల్లించడం లేదా నెరవేర్చడం అనే భావం ఇస్తుంది. ఆధునిక తెలుగులో ‘నెరవేరుస్తాను’ సహజంగా బాధ్యతను తెలియజేస్తుంది.
- source_word: לְךָ
  choice: నీకు
  rationale: לְ ఉపసర్గ మొక్కుబడుల నెరవేర్పు ఎవరికి ఉద్దేశించబడిందో సూచిస్తుంది.
- source_word: נְדָרָי
  choice: నా మొక్కుబడులను
  rationale: נֶדֶר పదం దేవునికి చేసిన గంభీరమైన ప్రమాణం లేదా మొక్కుబడిని సూచిస్తుంది; బహువచనానికి ప్రథమ పురుష ఏకవచన ప్రత్యయం జతై ‘నా మొక్కుబడులు’ అవుతుంది.
theological_decisions:
- issue: ‘నీ ఇల్లు’ అనే మూలభాషా వ్యక్తీకరణను ప్రధాన పాఠ్యంలో యథాతథంగా ఉంచాలా, లేక ఆరాధనా స్థలంగా స్పష్టీకరించాలా
  choice: నీ మందిరానికి
  alternative: నీ ఇంటికి
  rationale: హీబ్రూ అక్షరార్థం ‘నీ ఇల్లు’ అయినా, దహనబలుల సందర్భంలో అది దేవుని పవిత్రస్థలాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో దేవుని ‘ఇల్లు’ అనడం సాధ్యమైనప్పటికీ కొంత అసహజంగా ఉండవచ్చు; అందువల్ల ప్రధాన పాఠ్యంలో ‘మందిరం’ ఉంచి, నిజమైన పదరూపాన్ని పాదసూచికలో తెలిపాం.
- issue: మొక్కుబడులను ‘చెల్లించడం’ లేదా ‘నెరవేర్చడం’
  choice: నెరవేరుస్తాను
  alternative: చెల్లిస్తాను
  rationale: రెండూ హీబ్రూ ప్రయోగానికి సాధ్యమైనవి. ‘నెరవేరుస్తాను’ ఆధునిక తెలుగులో మొక్కుబడి చేసినవాని బాధ్యతను సహజంగా తెలియజేస్తూ, వాణిజ్యార్థపు అపార్థాన్ని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన భాష వాడబడింది. ‘దహనబలి,’ ‘మొక్కుబడి’ వంటి స్థిరమైన బైబిలు-ఆరాధనా పదాలు సందర్భ స్పష్టత కోసం నిలుపబడ్డాయి.
