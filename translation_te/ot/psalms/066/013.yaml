  text: I will come into your house with burnt offerings[a]; I will fulfill my vows to you[c][b],
translation:
  language: te
  text: దహనబలులతో నీ ఇంటిలోకి వస్తాను; నీకు నా మొక్కుబడులను చెల్లిస్తాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దహనబలులతో నీ ఇంటిలోకి ప్రవేశిస్తాను; నా మొక్కుబడులను నీకు నెరవేరుస్తాను.” “నీ ఇల్లు” ఇక్కడ దేవుని పవిత్రస్థలాన్ని సూచించవచ్చు.
