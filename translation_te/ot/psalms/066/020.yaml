source:
  edition: WLC
  text: בָּר֥וּךְ אֱלֹהִ֑ים אֲשֶׁ֥ר לֹֽא הֵסִ֘יר תְּפִלָּתִ֥/י וְ֝/חַסְדּ֗/וֹ מֵ/אִתִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/020.yaml
  text: Blessed be God[b][a], who has not turned away my prayer or his steadfast love from me.
translation:
  language: te
  text: నా ప్రార్థనను తిరస్కరించని, తన నమ్మకమైన ప్రేమను[a] నా నుండి దూరం చేయని దేవుడు స్తుతింపబడుగాక![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నమ్మకమైన ప్రేమ’ అనే పదబంధాన్ని ‘నిబంధనపట్ల విశ్వసనీయత,’ ‘అచంచల ప్రేమ,’ లేదా ‘నమ్మకమైన దయ’ అని కూడా అనువదించవచ్చు. హీబ్రూ חֶסֶד విశ్వసనీయమైన, నిబద్ధమైన ప్రేమను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'పదశః: ‘నా ప్రార్థనను, తన నమ్మకమైన ప్రేమను నా నుండి తొలగించని దేవుడు స్తుతింపబడుగాక.’ హీబ్రూలో ఒకే క్రియ ‘నా ప్రార్థన’కూ ‘తన నమ్మకమైన ప్రేమ’కూ వర్తిస్తుంది; తెలుగులో భావం సహజంగా ఉండేందుకు ప్రార్థనకు ‘తిరస్కరించని,’ ప్రేమకు ‘దూరం చేయని’ అని వ్యక్తం చేశాము.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: స్తుతింపబడుగాక
  rationale: ఈ నిష్క్రియార్థక కృదంతం ఇక్కడ స్తుతితో కూడిన ఆశీర్వచనంగా ఉంది. ఆధునిక తెలుగు ఆరాధనా భాషలో ‘స్తుతింపబడుగాక’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఇక్కడ ఇశ్రాయేలు దేవుణ్ణి ప్రత్యక్ష స్తుతిలో సూచించే సాధారణ పదం.
- source_word: אֲשֶׁר
  choice: …ఉన్న
  rationale: దేవుణ్ణి వర్ణించే సంబంధ వాక్యాన్ని తెలుగులో సహజంగా నిర్మించడానికి ఈ రూపం వాడబడింది.
- source_word: לֹא הֵסִיר תְּפִלָּתִי
  choice: నా ప్రార్థనను తిరస్కరించకుండా
  rationale: הֵסִיר యొక్క మూలార్థం ‘తొలగించు/పక్కకు తిప్పు’. ప్రార్థనతో కలిసినప్పుడు దానిని దేవుడు నిరాకరించలేదనే భావాన్ని ‘తిరస్కరించకుండా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְחַסְדּוֹ
  choice: తన నమ్మకమైన ప్రేమను
  rationale: חֶסֶד ప్రేమ, విశ్వసనీయత, నిబద్ధత అనే పరస్పర సంబంధిత భావాలను కలిగి ఉంది. ‘నమ్మకమైన ప్రేమ’ వీటిని సాధారణ ఆధునిక తెలుగులో సంక్షిప్తంగా నిలుపుతుంది.
- source_word: מֵאִתִּי
  choice: నాకు దూరం చేయకుండా
  rationale: ఈ విభక్తి సమాసం వక్త నుండి వేరుచేయడాన్ని సూచిస్తుంది. ప్రేమతో కలిపి ‘నాకు దూరం చేయకుండా’ సహజమైన తెలుగు ప్రయోగం.
theological_decisions:
- issue: חֶסֶד పదం యొక్క భావవ్యాప్తి
  choice: తన నమ్మకమైన ప్రేమను
  alternative: తన నిబంధన విశ్వసనీయతను; తన అచంచల ప్రేమను; తన కరుణను
  rationale: ఈ పదం కేవలం భావోద్వేగ ప్రేమను కాక, సంబంధంలో చూపే విశ్వసనీయమైన దయను కూడా సూచిస్తుంది. ‘నమ్మకమైన ప్రేమ’ దాని విస్తృత భావాన్ని ఒకే సిద్ధాంత వ్యాఖ్యానానికి పరిమితం చేయకుండా కాపాడుతుంది.
- issue: ఒకే הֵסִיר క్రియ ప్రార్థనకూ ప్రేమకూ వర్తించడం
  choice: ప్రార్థనతో ‘తిరస్కరించకుండా’, ప్రేమతో ‘దూరం చేయకుండా’ అని సందర్భానుసారంగా వ్యక్తీకరించడం
  alternative: ‘నా ప్రార్థనను, తన నమ్మకమైన ప్రేమను నా నుండి తొలగించని’ అని పదశః అనువదించడం
  rationale: హీబ్రూలో ఒకే క్రియ రెండు కర్మలను నియంత్రిస్తుంది; తెలుగులో పదశః రూపం ప్రార్థనను ‘నా నుండి తొలగించడం’ అనే అస్పష్టమైన భావాన్ని కలిగిస్తుంది. రెండు సహజ తెలుగు క్రియారూపాలు మూలంలోని ఒకే నిరాకరణ ఫలితాన్ని కాపాడుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గౌరవభరితమైన స్తుతి శైలిని ఉపయోగించాం. ‘స్తుతింపబడుగాక’ ఆరాధనా గంభీరతను నిలుపుతుండగా, మిగతా వాక్యం సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా నిర్మించబడింది.
