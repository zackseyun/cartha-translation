source:
  edition: WLC
  text: מֹ֘שֵׁ֤ל בִּ/גְבוּרָת֨/וֹ עוֹלָ֗ם עֵ֭ינָי/ו בַּ/גּוֹיִ֣ם תִּצְפֶּ֑ינָה הַ/סּוֹרְרִ֓ים אַל ירימו לָ֣/מוֹ סֶֽלָה׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/007.yaml
  text: He rules forever by his might; his eyes watch the nations[a]. Let not the rebellious exalt themselves. Selah
translation:
  language: te
  text: 'తన బలంతో ఆయన నిత్యం పరిపాలిస్తాడు;

    ఆయన కన్నులు జనములను గమనిస్తాయి.

    తిరుగుబాటుదారులు తమను తాము హెచ్చించుకోకూడదు.[a]

    సెలా'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తిరుగుబాటుదారులు తమను తాము పైకెత్తుకోకూడదు,” లేదా “పైకి లేవకూడదు.” హీబ్రూ క్రియ పైకెత్తడం, పైకి లేవడం, లేదా తనను తాను హెచ్చించుకోవడం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֵׁל
  choice: పరిపాలిస్తాడు
  rationale: Qal వర్తమాన క్రియావిశేషణం దేవుని నిరంతర పాలనను సూచిస్తుంది; తెలుగులో సహజమైన సమాపక క్రియగా ఇచ్చాం.
- source_word: בִּגְבוּרָתוֹ
  choice: తన బలంతో
  rationale: గְּבוּרָה బలం/పరాక్రమాన్ని సూచిస్తుంది; בְּ ఇక్కడ సాధనార్థకంగా ఉండటంతో ‘బలంతో’ సరిపోతుంది.
- source_word: עוֹלָם
  choice: నిత్యం
  rationale: ఇక్కడ కాలవ్యాప్తిని సూచించే క్రియావిశేషణంగా ఉండి, నిరంతరమైన పాలన భావాన్ని ఇస్తుంది.
- source_word: עֵינָיו ... תִּצְפֶּינָה
  choice: ఆయన కన్నులు ... గమనిస్తాయి
  rationale: మూలంలోని మానవరూప వర్ణనను, అలాగే ‘కన్నులు’తో క్రియకు ఉన్న బహువచన అన్వయాన్ని నిలిపాం.
- source_word: בַּגּוֹיִם
  choice: జనములను
  rationale: గּוֹיִם ఇక్కడ సాధారణంగా జనాలు/దేశజనాలను సూచిస్తుంది; తరువాతి కాలపు ప్రత్యేక మతపరమైన అర్థాన్ని రుద్దలేదు.
- source_word: הַסּוֹרְרִים
  choice: తిరుగుబాటుదారులు
  rationale: סרר మొండిగా ఎదిరించే, తిరుగుబాటు చేసే వారిని సూచిస్తుంది.
- source_word: אַל יָרִימוּ לָמוֹ
  choice: తమను తాము హెచ్చించుకోకూడదు
  rationale: אַל + imperfect నిషేధాన్ని వ్యక్తం చేస్తుంది; רום Hiphil మరియు לָמוֹ కలయిక ఇక్కడ స్వీయోన్నతి లేదా గర్వంగా తన్నుతాను హెచ్చించుకోవడం అనే భావానికి అనుకూలం.
- source_word: סֶלָה
  choice: సెలా
  rationale: అర్థం నిశ్చితంగా తెలియని సంప్రదాయ సంగీత/ఆరాధనా సూచిక కాబట్టి అనువదించకుండా లిప్యంతరీకరించాం.
theological_decisions:
- issue: దేవుని గ్రహణశక్తికి సంబంధించిన మానవరూప భాష
  choice: ఆయన కన్నులు జనములను గమనిస్తాయి
  alternative: ఆయన జనములను గమనిస్తాడు
  rationale: హీబ్రూ మూలం స్పష్టంగా ‘ఆయన కన్నులు’ అంటుంది. ఈ కవితాత్మక రూపకాన్ని తొలగించకుండా నిలిపాం.
- issue: తిరుగుబాటుదారులకు ఇచ్చిన నిషేధపు భావం
  choice: తమను తాము హెచ్చించుకోకూడదు
  alternative: వారు పైకి లేవకూడదు / తమను తాము పైకెత్తుకోకూడదు
  rationale: יָרִימוּ לָמוֹ స్వీయోన్నతిని సూచించవచ్చు; అయితే ‘పైకి లేవడం’ లేదా ‘పైకెత్తుకోవడం’ అనే పదార్థ సంభావ్యతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలిని వాడాం. ‘ఆయన కన్నులు’ అనే మూలరూపకాన్ని నిలిపి, ‘సెలా’ను సంప్రదాయ లిప్యంతరీకరణగా ఉంచాం.
