source:
  edition: WLC
  text: לְכ֣וּ וּ֭/רְאוּ מִפְעֲל֣וֹת אֱלֹהִ֑ים נוֹרָ֥א עֲ֝לִילָ֗ה עַל בְּנֵ֥י אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/005.yaml
  text: Come and see the works of God[a]; he is awesome in his deeds toward the children of man.
translation:
  language: te
  text: రండి, దేవుని కార్యాలను చూడండి; మానవుల పట్ల తన కార్యాలలో ఆయన భయభక్తులను రేకెత్తించేవాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “మనిషి కుమారుల పట్ల”; అంటే, “మానవాళి పట్ల.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: రండి
  rationale: הלך అనే బహువచన ఆజ్ఞారూపం ఇక్కడ ఆహ్వానార్థకంగా వాడబడింది; తెలుగులో ‘రండి, ... చూడండి’ సహజమైన సమానార్థకం.
- source_word: וּרְאוּ
  choice: చూడండి
  rationale: ראה అనే బహువచన ఆజ్ఞారూపం; దేవుని కార్యాలను గమనించమనే పిలుపును స్పష్టంగా ఉంచుతుంది.
- source_word: מִפְעֲלוֹת
  choice: కార్యాలను
  rationale: దేవుడు చేసిన పనులను సూచించే బహువచనం; తరువాతి עֲלִילָהతో కొంత పదభేదాన్ని నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుని
  rationale: సందర్భంలో ఇశ్రాయేలు దేవుడే ఉద్దేశించబడ్డాడు; తెలుగు విభక్తి నిర్మాణానికి అనుగుణంగా ‘దేవుని’.
- source_word: נוֹרָא
  choice: భయభక్తులు పుట్టించేవి
  rationale: ירא మూలానికి చెందిన ఈ పదం కేవలం భయంకరతనే కాక విస్మయంతో కూడిన భయభక్తిని రేకెత్తించే భావాన్ని ఇస్తుంది.
- source_word: עֲלִילָה
  choice: ఆయన చేసే క్రియలు
  rationale: దేవుని కార్యాచరణను సూచించే ఏకవచన సమష్టి/భావవాచక నామం; తెలుగులో సహజత కోసం బహువచన భావంతో అనువదించబడింది.
- source_word: עַל
  choice: పట్ల
  rationale: మానవాళికి సంబంధించి దేవుని కార్యాచరణ దిశ లేదా లక్ష్యాన్ని సూచిస్తుంది; మేలు లేదా విరోధం అని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: בְּנֵי אָדָם
  choice: మనుష్యుల
  rationale: అక్షరార్థంగా ‘ఆదాము కుమారులు/మనుష్యుని కుమారులు’; ఇక్కడ సంప్రదాయబద్ధంగా మానవాళి మొత్తాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘మనుష్యులు’ ఆ సామూహిక అర్థాన్ని అందిస్తుంది.
theological_decisions:
- issue: בְּנֵי אָדָם అనే సాధారణ మానవవాచక ప్రయోగం
  choice: మనుష్యుల
  alternative: ఆదాము కుమారుల
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా పుత్రుల రూపంలో ఉన్నా, సందర్భంలో లింగభేదం లేకుండా మానవాళిని సూచించే స్థిరప్రయోగం. ప్రధాన వాక్యంలో సహజమైన సామూహిక అర్థాన్ని ఇచ్చి, అక్షరరూపాన్ని పాదటిప్పణిలో నిలిపాం.
- issue: נוֹרָא యొక్క భావవ్యాప్తి
  choice: భయభక్తులు పుట్టించేవి
  alternative: భయంకరమైనవి
  rationale: ఈ పదం దేవుని కార్యాలు కలిగించే విస్మయం, భయం, భక్తి అనే ఉద్వేగాల మేళవింపును సూచించగలదు; ‘భయంకరమైనవి’ అనడం ప్రతికూల భయానికే పరిమితం చేసే ప్రమాదం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సంఘపఠనానికి తగిన గౌరవప్రదమైన శైలి. ‘రండి ... చూడండి’ అనే ఆహ్వాన నిర్మాణం సహజంగా ఉంచబడింది; నోరా పదంలోని భయం-విస్మయం-భక్తి భావాన్ని ‘భయభక్తులు పుట్టించేవి’గా వ్యక్తం చేసింది.
