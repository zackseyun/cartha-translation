revisions:
- from: రండి, దేవుని కార్యాలను చూడండి; మనుష్యుల పట్ల ఆయన చేసే క్రియలు భయభక్తులు పుట్టించేవి.[a]
  to: రండి, దేవుని కార్యాలను చూడండి; మానవుల పట్ల తన కార్యాలలో ఆయన భయభక్తులను రేకెత్తించేవాడు.[a]
  rationale: The revision preserves the Hebrew syntax by making God, rather than his deeds, the one characterized as awe-inspiring in his actions toward humanity. It retains the broad directional sense of עַל and gives a natural Telugu rendering of the generic-human idiom, with a literal alternative in the footnote.
