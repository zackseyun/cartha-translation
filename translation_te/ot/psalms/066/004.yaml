  yaml_path: translation/ot/psalms/066/004.yaml
  text: All the earth will bow down to you and sing praise to you[a]; they will sing praise to your name[b]. Selah
translation:
  language: te
  text: భూమంతా నీకు సాగిలపడుతుంది[a]; నీకు స్తుతిగానం చేస్తుంది; నీ నామాన్ని కీర్తిస్తూ పాడుతుంది. సెలా.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిన్ను ఆరాధిస్తుంది.” హీబ్రూ క్రియ ఆరాధనగా వంగి లేదా నేలకు సాగిలపడడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: “సెలా” బహుశా సంగీత లేదా ఆరాధనా క్రమానికి సంబంధించిన సూచన; దాని ఖచ్చితమైన అర్థం తెలియదు.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל הָאָרֶץ
  choice: భూమంతా
  rationale: כָּל హָאָרֶץ ఇక్కడ స్థానిక ‘దేశం’ కంటే సమస్త భూమిని సూచిస్తుంది. ‘భూమంతా’ సహజంగా, సమగ్ర భావంతో ఉంది.
- source_word: יִשְׁתַּחֲווּ
  choice: సాష్టాంగపడుతుంది
  rationale: ఈ క్రియ దేవుని ఎదుట వంగి నేలకు సాగిలపడే శారీరక భంగిమను, దాని ద్వారా వ్యక్తమయ్యే ఆరాధనను సూచిస్తుంది. ‘సాష్టాంగపడుతుంది’ మూలంలోని శరీరభంగిమను నిలుపుతుంది.
- source_word: לְךָ
  choice: నీకు
  rationale: ఉద్దేశింపబడిన వ్యక్తివైపు చర్యను చూపే לְ ఉపసర్గను తెలుగులో ‘నీకు’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וִיזַמְּרוּ / יְזַמְּרוּ
  choice: స్తుతిగానం చేస్తుంది / కీర్తిస్తూ పాడుతుంది
  rationale: זמר స్తుతి సందర్భంలో సంగీతంతో పాడడాన్ని సూచిస్తుంది. హెబ్రీ పునరుక్తిని తెలుగులో అర్థపునరుక్తిగా నిలుపుతూ, కృత్రిమంగా వినిపించకుండా రెండు సమానార్థక ప్రయోగాలు వాడబడ్డాయి.
- source_word: שִׁמְךָ
  choice: నీ నామాన్ని
  rationale: ‘నామం’ అనే బైబిలు వ్యక్తీకరణ దేవుని వెల్లడైన స్వభావం, కీర్తి అనే విస్తృత సూచనను నిలుపుతుంది.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఈ పదం యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం. ఊహాత్మక అనువాదం చేయకుండా లిప్యంతరీకరించడం పారదర్శకమైన పద్ధతి.
theological_decisions:
- issue: יִשְׁתַּחֲווּను స్పష్టంగా ‘ఆరాధిస్తుంది’ అని అనువదించాలా, లేక శరీరభంగిమను నిలుపాలా
  choice: సాష్టాంగపడుతుంది
  alternative: ఆరాధిస్తుంది / సాగిలపడుతుంది
  rationale: మూలక్రియ ఆరాధనార్థకంగా ఉన్నప్పటికీ, అది వ్యక్తపరిచే వంగి నేలకు పడే స్పష్టమైన శరీరచిత్రాన్ని నిలపడం వల్ల ఆరాధన భావాన్ని తొలగించకుండా అతివ్యాఖ్యానాన్ని నివారించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఏకవచన సమూహకర్త ‘భూమంతా’కు అనుగుణంగా క్రియలు ఏకవచనంలో ఉంచబడ్డాయి. ‘నామం’, ‘స్తుతిగానం’, ‘సెలా’ వంటి పదాలు కీర్తనల ఆరాధనా స్వరాన్ని నిలుపుతాయి.
