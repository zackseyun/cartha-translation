  text: For the choir director[a]. A song, a psalm. Shout to God[b], all the earth.
translation:
  language: te
  text: సంగీత నాయకునికి[a]. ఒక గీతం, ఒక కీర్తన. భూమంతా దేవునికి హర్షధ్వని చేయండి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సంగీత నిర్దేశకునికి’ లేదా ‘గాననాయకునికి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘భూమంతా దేవునికి ఆనందధ్వని చేయండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకునికి
  rationale: సంగీత ప్రదర్శనను పర్యవేక్షించే వ్యక్తిని సూచించే శీర్షికపదంగా తీసుకున్నాం. ఆధునిక తెలుగులో ఇది స్పష్టంగా ఉండి, గాయకబృందానికే పరిమితం చేయదు.
- source_word: שִׁיר
  choice: ఒక గీతం
  rationale: ప్రక్రియను సూచించే సాధారణ పదం; తెలుగు శీర్షిక శైలికి సహజంగా ఉండేందుకు ‘ఒక’ చేర్చాం.
- source_word: מִזְמוֹר
  choice: ఒక కీర్తన
  rationale: మిజ్మోర్ అనే సాంకేతిక ప్రక్రియాపదానికి తెలుగులో స్థిరమైన సమానార్థకం. హెబ్రీలోని జంట ప్రక్రియాపదాలను కలిపివేయకుండా రెండింటినీ ఉంచాం.
- source_word: הָרִיעוּ
  choice: జయధ్వని చేయండి
  rationale: ఈ క్రియ బిగ్గరగా హర్షపూర్వకమైన లేదా విజయోత్సాహపు ధ్వని చేయడాన్ని సూచిస్తుంది. ‘జయధ్వని చేయండి’ ఆ బలమైన బహిరంగ ప్రశంసను సహజమైన, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לֵאלֹהִים
  choice: దేవునికి
  rationale: ఉపసర్గ ప్రశంసాధ్వని ఎవరిని ఉద్దేశించిందో సూచిస్తుంది; ‘దేవునికి’ సహజమైన తెలుగు రూపం.
- source_word: כָּל הָאָרֶץ
  choice: భూమంతా
  rationale: ఈ సార్వత్రిక స్తుతి పిలుపులో ‘దేశమంతా’ కంటే ‘భూమంతా’ విస్తృత పరిధిని కాపాడుతుంది.
theological_decisions:
- issue: כָּל הָאָרֶץ అనే పదబంధంలోని పిలుపు పరిధి
  choice: భూమంతటికీ సార్వత్రిక పిలుపు
  alternative: దేశమంతటికీ లేదా భూభాగమంతటికీ పిలుపు
  rationale: కీర్తనలోని స్తుతి సందర్భం విశ్వవ్యాప్త పిలుపుకు సహజంగా మద్దతిస్తుంది. ‘భూమంతా’ అనే అనువాదం పాఠ్యం చెప్పేదానికంటే ఎక్కువ భావాన్ని జోడించకుండా దాని విస్తృత పరిధిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కీర్తనాశైలిని ఉపయోగించాం. శీర్షికలోని ‘గీతం’ మరియు ‘కీర్తన’ అనే రెండు ప్రక్రియాపదాలను విడివిడిగా నిలిపాం; ఆజ్ఞ బహువచన భావాన్ని ‘చేయండి’ ద్వారా వ్యక్తం చేశాం.
