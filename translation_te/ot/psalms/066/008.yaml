  text: Bless our God[a], O peoples[b], and make the sound of his praise heard.
translation:
  language: te
  text: ప్రజలారా, మన దేవుణ్ణి స్తుతించండి; ఆయన స్తుతి స్వరం వినిపించేలా చేయండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనకు స్తుతి స్వరం వినిపించేలా చేయండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרְכוּ
  choice: స్తుతించండి
  rationale: దేవునికి ఉద్దేశించిన ברך అనే బహువచన ఆజ్ఞకు తెలుగులో ‘స్తుతించండి’ సహజమైన, అర్థవంతమైన సమానార్థకం. ‘దీవించండి’ రూపపరంగా దగ్గరైనా, ఆధునిక తెలుగులో మనుషులు దేవుణ్ణి దీవిస్తున్నారనే అపార్థం కలిగించవచ్చు.
- source_word: עַמִּים
  choice: ప్రజలారా
  rationale: బహువచన సంబోధనను సహజంగా నిలుపుతుంది; వివిధ జనసమూహాలకు ఇచ్చిన పిలుపును ‘జనములారా’ కంటే ఆధునికంగా తెలియజేస్తుంది.
- source_word: אֱלֹהֵינוּ
  choice: మన దేవుణ్ణి
  rationale: మొదటి పురుష బహువచన ప్రత్యయంతో ఉన్న ‘మన దేవుడు’ అనే సమాజ దృక్కోణాన్ని నిలుపుతుంది; తెలుగులో కర్మవిభక్తి అవసరానుసారం వాడబడింది.
- source_word: וְהַשְׁמִיעוּ
  choice: వినిపించేలా చేయండి
  rationale: שמע హిఫీల్ బహువచన ఆజ్ఞలోని ‘వినబడేలా చేయు’ అనే కారణార్థక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: קוֹל
  choice: స్వరం
  rationale: קוֹל యొక్క ‘స్వరం/ధ్వని’ పరిధిలో, స్తుతి యొక్క వినిపించే వ్యక్తీకరణకు ‘స్వరం’ సహజంగా సరిపోతుంది.
- source_word: תְּהִלָּתוֹ
  choice: ఆయన స్తుతి
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయ సంబంధాన్ని నేరుగా నిలుపుతుంది; ఇది ఆయనకు అర్పించే స్తుతి అనే భావానికి కూడా అవకాశం ఇస్తుంది.
theological_decisions:
- issue: תְּהִלָּתוֹ లోని ప్రత్యయ సంబంధం
  choice: ఆయన స్తుతి
  alternative: ఆయనకు స్తుతి
  rationale: హీబ్రూ ప్రత్యయం స్వామ్యాన్ని లేదా సూచనను తెలిపే విస్తృతిని కలిగి ఉంది. ప్రధాన పాఠంలో దానిని నేరుగా ‘ఆయన స్తుతి’గా ఉంచి, దేవునికి అర్పించే స్తుతి అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టమైనదిగా, అయితే కీర్తనకు తగిన గౌరవభరిత శైలిలో. ‘దీవించండి’ వల్ల కలగగల ఆధునిక అర్థసందిగ్ధతను నివారించేందుకు సందర్భానుగుణంగా ‘స్తుతించండి’ ఎంచుకున్నాం.
