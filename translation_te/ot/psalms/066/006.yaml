source:
  edition: WLC
  text: הָ֤פַךְ יָ֨ם לְֽ/יַבָּשָׁ֗ה בַּ֭/נָּהָר יַֽעַבְר֣וּ בְ/רָ֑גֶל שָׁ֝֗ם נִשְׂמְחָה בּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/006.yaml
  text: He turned the sea into dry land[a]; they passed through the river on foot[b]; there we rejoiced in him.
translation:
  language: te
  text: ఆయన సముద్రాన్ని ఎండిన నేలగా మార్చాడు; వారు నదిని కాలినడకన దాటారు[b]; అక్కడ మనం ఆయనలో ఆనందించాం[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అక్కడ మనం ఆయనలో ఆనందిద్దాం.” హెబ్రీ క్రియారూపాన్ని గతకాల ప్రకటనగా కాక ఉద్బోధనగా కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ఇది నిర్గమ సమయంలో సముద్రాన్ని దాటిన సంఘటనను, ఆ దేశంలోకి ప్రవేశించేటప్పుడు యొర్దాను నదిని దాటిన సంఘటనను—రెండింటినీ—జ్ఞాపకం చేస్తుండవచ్చు.
    reason: cross_reference
lexical_decisions:
- source_word: הָפַךְ
  choice: మార్చాడు
  rationale: ఈ క్రియకు ‘మార్చడం/తిప్పడం’ అనే అర్థం ఉంది. సముద్ర స్థితిని ఆరిన నేలగా మార్చిన దేవుని కార్యాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יָם
  choice: సముద్రం
  rationale: మూలపదానికి సాధారణ అర్థాన్ని ఉంచుతుంది; నిర్గమ సమయంలో జరిగిన సముద్ర దాటింపును సూచించే అవకాశం ఉన్నప్పటికీ, నిర్దిష్ట సముద్రనామాన్ని పాఠ్యంలో చేర్చదు.
- source_word: לְיַבָּשָׁה
  choice: ఆరిన నేలగా
  rationale: ‘ఎండిన/ఆరిన భూమి’ అనే భావాన్ని, לְ ఉపసర్గ సూచించే స్థితిమార్పుతో సహా సహజ తెలుగులో అందిస్తుంది.
- source_word: בַּנָּהָר
  choice: నదిని
  rationale: ఉపసర్గ అక్షరార్థంగా ‘నదిలో/నది వద్ద’ అయినా, עָבַר అనే గమనక్రియతో కలిసినప్పుడు తెలుగులో ‘నదిని దాటారు’ అనడం సహజం.
- source_word: יַעַבְרוּ
  choice: దాటారు
  rationale: ‘దాటడం/గుండా వెళ్లడం’ అనే మూలభావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది; సందర్భంలోని గత రక్షణకార్య స్మరణకు అనుగుణంగా భూతకాలం వాడబడింది.
- source_word: בְרָגֶל
  choice: కాలినడకన
  rationale: పడవ వంటి సాధనం లేకుండా పాదాలతో దాటారనే భావాన్ని సహజ తెలుగు నుడికారంలో తెలియజేస్తుంది.
- source_word: שָׁם
  choice: అక్కడ
  rationale: అది నిర్దిష్ట స్థలాన్నో, జ్ఞాపకం చేసుకున్న రక్షణ సంఘటననో సూచించవచ్చు; సాధారణ స్థలవాచకాన్ని ఉంచడం ద్వారా ఆ తెరువును కాపాడుతుంది.
- source_word: נִשְׂמְחָה
  choice: మనం … ఆనందించాం
  rationale: రూపం ప్రథమ పురుష బహువచన ఉద్బోధనగా ‘మనం ఆనందిద్దాం’ అని కూడా అర్థమవుతుంది. ఇక్కడ గత రక్షణకార్యాన్ని సంఘం తనదిగా గుర్తుచేసుకుంటున్న పఠనాన్ని ప్రధాన పాఠ్యంలో ఉంచి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: בּוֹ
  choice: ఆయనలో
  rationale: పుంలింగ ఏకవచన ప్రత్యయం సందర్భంలో దేవుణ్ణి సూచించడం అత్యంత సహజం. ‘ఆయనలో’ అనే రూపం మూలంలోని సంబంధాన్ని కాపాడుతుంది.
theological_decisions:
- issue: గత రక్షణకార్యంతో ఆరాధక సమాజపు ఐక్యత
  choice: ‘అక్కడ మనం ఆయనలో ఆనందించాం’ అనే గతకాల పఠనం
  alternative: ‘అక్కడ మనం ఆయనలో ఆనందిద్దాం’ అనే ఉద్బోధనాత్మక పఠనం
  rationale: కీర్తన దేవుని గత మహాకార్యాలను జ్ఞాపకం చేస్తోంది; అందువల్ల ఆరాధకులు పూర్వ ఇశ్రాయేలుతో తమను ఐక్యపరచుకుంటున్నట్లు గతకాల పఠనం సందర్భానికి సరిపోతుంది. అయితే హెబ్రీ రూపంలోని నిజమైన ఉద్బోధనాత్మక అవకాశాన్ని పాదటిప్పణిలో నిలిపాం.
- issue: సముద్రం మరియు నది సూచించే చారిత్రక సంఘటనలు
  choice: పాఠ్యంలో సాధారణ పదాలైన ‘సముద్రం’, ‘నది’నే ఉంచడం
  alternative: వాటిని ఎర్ర సముద్రం/రెల్ల సముద్రం మరియు యొర్దాను నదిగా నేరుగా పేర్కొనడం
  rationale: నిర్గమ సముద్ర దాటింపు మరియు యొర్దాను దాటింపును ఈ వచనం సంయుక్తంగా జ్ఞాపకం చేస్తుండవచ్చు. అయినా మూలపాఠ్యం నిర్దిష్ట నామాలను ఇవ్వదు కాబట్టి వాటిని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- issue: בּוֹ అనే సర్వనామ ప్రత్యయం ఎవరిని సూచిస్తుంది
  choice: దేవుణ్ణి సూచిస్తూ ‘ఆయనలో’
  alternative: స్థలం లేదా సంఘటనను సూచిస్తూ ‘దానిలో/దానిని బట్టి’
  rationale: చుట్టుపక్కల సందర్భంలో కార్యసాధకుడు దేవుడే, స్తుతి కూడా ఆయనకే చెందుతుంది; అందువల్ల వ్యక్తిగత పుంలింగ సూచన సహజమైనది. అయినా వ్యాకరణపరంగా స్థలం లేదా సంఘటనతో అనుసంధానం పూర్తిగా అసాధ్యం కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘కాలినడకన’, ‘ఆరిన నేల’ వంటి సహజ పదబంధాలు వాడబడ్డాయి. మూలంలోని సంక్షిప్త సమాంతర నిర్మాణం మరియు చివరి క్రియారూపంలోని కాల/ఉద్బోధన సందిగ్ధత కాపాడబడ్డాయి.
