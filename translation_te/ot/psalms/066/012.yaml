source:
  edition: WLC
  text: הִרְכַּ֥בְתָּ אֱנ֗וֹשׁ לְ/רֹ֫אשֵׁ֥/נוּ בָּֽאנוּ בָ/אֵ֥שׁ וּ/בַ/מַּ֑יִם וַ֝/תּוֹצִיאֵ֗/נוּ לָֽ/רְוָיָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/012.yaml
  text: You made a man ride over our heads; we went through fire and through water, yet you brought us out into abundance.
translation:
  language: te
  text: నీవు ఒక మనిషి మా తలల మీదుగా స్వారీ చేసేలా చేశావు; మేము అగ్నిలోనూ నీళ్లలోనూ ప్రవేశించాము; అయినా నీవు మమ్మల్ని సమృద్ధిగల చోటికి తీసుకొచ్చావు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సమృద్ధిగల చోటికి” అని అనువదించిన హీబ్రూ పదం “ఉపశమన స్థితికి” లేదా “తృప్తికి” అనే భావాన్నీ ఇవ్వవచ్చు.
    reason: అరుదైన רְוָיָה పదంలోని నిజమైన అర్థవిస్తృతిని వెల్లడించడానికి.
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: ఒక మనిషిని
  rationale: ఇక్కడ ఏకవచన సాధారణ మానవ పదం ఉంది; మూలంలోని సంఖ్యను, అనిర్దిష్ట భావాన్ని నిలుపుతుంది.
- source_word: הִרְכַּבְתָּ ... לְרֹאשֵׁנוּ
  choice: మా తలల మీదుగా ... స్వారీ చేయించావు
  rationale: హిఫీల్ క్రియలోని ‘స్వారీ చేయించడం/ఎక్కించడం’ భావాన్ని, పైగా దాటిపోయే అణచివేత చిత్రాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: בָאנוּ בָאֵשׁ וּבַמַּיִם
  choice: మేము అగ్నిలోనూ నీళ్లలోనూ నడిచాము
  rationale: బוא అనే ‘వెళ్లడం/ప్రవేశించడం’ భావాన్ని సందర్భానుగుణంగా ‘నడిచాము’ అని ఇచ్చి, అగ్ని-నీళ్ల మధ్యనున్న సమాంతరతను నిలిపింది.
- source_word: לָרְוָיָה
  choice: సమృద్ధిగల చోటికి
  rationale: ఈ అరుదైన నామవాచకం సమృద్ధి, తృప్తి, విస్తార స్థితిని సూచించవచ్చు; గమ్యార్థక לְ కారణంగా స్థలసదృశ భావాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: కష్టాలకు దేవుని సార్వభౌమ అనుమతి/కారణత్వం
  choice: ‘చేయించావు’ అని ప్రత్యక్ష ద్వితీయ పురుష కారణత్వాన్ని నిలిపాం
  alternative: ‘ఒక మనిషి మా తలల మీదుగా స్వారీ చేయడానికి అనుమతించావు’
  rationale: మూలంలోని హిఫీల్ రూపం దేవుని చర్యను నేరుగా చెబుతుంది; ‘అనుమతించావు’ అని మార్చడం వచనంలోని theological tension‌ను ముందుగానే పరిష్కరిస్తుంది.
- issue: לָרְוָיָה యొక్క అర్థం
  choice: ప్రధాన పాఠంలో ‘సమృద్ధిగల చోటికి’
  alternative: ‘ఉపశమనానికి’ లేదా ‘తృప్తికి’
  rationale: పదానికి ఉన్న సమృద్ధి/తృప్తి పరిధిని ప్రధాన పాఠంలో సహజంగా తెలిపి, నిజమైన నిఘంటు అనిశ్చితిని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. మూలంలోని అగ్ని–నీళ్ల కవితాత్మక సమాంతరతను, దేవునిని ఉద్దేశించిన ఏకవచన సంభాషణను నిలిపాం.
