  text: Sing the glory of his name[a]; make his praise glorious.
translation:
  language: te
  text: 'ఆయన నామ మహిమను గానం చేయండి;

    ఆయన స్తుతిని మహిమాన్వితంగా చేయండి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ఆయన స్తుతికి మహిమను ఉంచండి.” హెబ్రీ భాషలో ‘మహిమ’ అనే నామవాచకంతో కూడిన నుడికారం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ
  choice: గానం చేయండి
  rationale: זמר అనే క్రియ యొక్క బహువచన ఆజ్ఞారూపం సంగీతంతో పాడడాన్ని సూచిస్తుంది. ‘గానం చేయండి’ అనే పదబంధం సంగీత స్తుతి భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כְבוֹד שְׁמוֹ
  choice: ఆయన నామ మహిమను
  rationale: ఈ సమాస పదబంధాన్ని నేరుగా అనువదించడం ద్వారా మహిమ ఆయన నామానికి చెందినదనే హెబ్రీయ భావం నిలుస్తుంది; ‘మహిమాన్వితమైన ఆయన నామాన్ని’ అని విశేషణ రూపంలో మార్చలేదు.
- source_word: שִׂימוּ
  choice: చేయండి
  rationale: שׂים యొక్క ప్రాథమిక అర్థం ‘పెట్టు/ఉంచు.’ అయితే ఈ సందర్భంలోని నామవాచక ప్రయోగంతో కలిపి ‘చేయండి’ అని అనువదించడం ఆధునిక తెలుగులో సహజంగా ఉండి ఆజ్ఞ భావాన్ని కాపాడుతుంది.
- source_word: כָבוֹד
  choice: మహిమాన్వితంగా
  rationale: మూలంలో ‘మహిమ’ అనే నామవాచకం ఉంది. తెలుగులో ‘చేయండి’తో కలిసి ‘మహిమాన్వితంగా’ అనే క్రియావిశేషణ రూపం సహజంగా ఉండి మూలభావాన్ని అందిస్తుంది.
- source_word: תְּהִלָּתוֹ
  choice: ఆయన స్తుతిని
  rationale: ఈ పదం ‘స్తుతి’ అని అర్థమిస్తూ మూడవ పురుష ఏకవచన పుంలింగ ప్రత్యయాన్ని కలిగి ఉంది. ‘ఆయన స్తుతిని’ అనేది ప్రత్యయాన్ని నేరుగా ప్రతిబింబిస్తూ, ఆయనకు అర్పించే లేదా ఆయనకు చెందిన స్తుతి అనే సందర్భార్థాన్ని తెరిచి ఉంచుతుంది.
