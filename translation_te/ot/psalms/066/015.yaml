translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలిని వాడాం. కవితా పాద విభజనను నిలిపి, బలి సంబంధ పదాలను స్పష్టంగా ఉంచాం. ‘పశువులు’ అనే పదం మొదటి పాదంలో సాధారణ జంతువుల అర్థంలోనూ మూడో పాదంలో בקר అనే మంద పశువుల సమష్టి అర్థంలోనూ వస్తున్నందున స్వల్ప పునరుక్తి ఉంది; అయినా మూలంలోని విస్తృత పదార్థాన్ని లింగనిర్దిష్టంగా మార్చకుండా కాపాడటానికి ఇది అనుకూలం.
