  yaml_path: translation/ot/psalms/066/015.yaml
  text: I will offer to you burnt offerings of fattened animals[a], with the smoke of rams; I will prepare cattle and goats[d][c][b]. Selah
translation:
  language: te
  text: 'బాగా బలిసిన జంతువుల దహనబలులను నీకు అర్పిస్తాను;


    పొట్టేళ్ల దహనపు పొగతో[a] పాటు,


    గొడ్డు పశువులను మగ మేకలతో[b] బలిగా అర్పిస్తాను.


    సెలా.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పొట్టేళ్ల బలి సువాసనతో’; ఇక్కడి హీబ్రూ పదం బలి దహనమవుతున్నప్పుడు వచ్చే పొగను లేదా వాసనను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదం ప్రత్యేకంగా మగ మేకలను సూచిస్తుంది.
    reason: lexical_clarification
  - marker: c
    text: ‘సెలా’ అనే పదానికి ఖచ్చితమైన అర్థం తెలియదు; అది సంగీతానికి లేదా ఆరాధన పఠనానికి సంబంధించిన సూచన అయి ఉండవచ్చు. అందువల్ల దాన్ని అనువదించకుండా ఉంచారు.
    reason: cultural_note
lexical_decisions:
- source_word: עֹלוֹת
  choice: దహనబలులు
  rationale: బలిపీఠంపై పూర్తిగా దహనం చేసే బలిని సూచించే స్థిరమైన బలిసంబంధ పదం.
- source_word: מֵחִים
  choice: కొవ్విన పశువులు
  rationale: బలికోసం బాగా మేపి బలిసిన, విలువైన జంతువులను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אַעֲלֶה לָךְ
  choice: నీకు అర్పిస్తాను
  rationale: עלה హిఫీల్ రూపానికి ఈ బలి సందర్భంలో ఉన్న ‘అర్పించడం’ అనే ప్రయోగార్థాన్ని, దేవునికి నేరుగా సంబోధించడాన్ని కాపాడుతుంది.
- source_word: עִם קְטֹרֶת אֵילִים
  choice: పొట్టేళ్ల బలి పొగతో పాటు
  rationale: קְטֹרֶת ఇక్కడ పొట్టేళ్లు దహనమవుతున్నప్పుడు పైకిలేచే పొగను సూచించగలదు; ‘బలి’ అనే పదం చేర్చడం వల్ల అది సాధారణ పొగ కాదని స్పష్టమవుతుంది.
- source_word: אֶעֱשֶׂה
  choice: బలిగా అర్పిస్తాను
  rationale: עשה బలి సందర్భంలో బలిని సిద్ధం చేసి సమర్పించడాన్ని సూచిస్తుంది; తెలుగులో కేవలం ‘చేస్తాను’ అనడం అసహజం, అస్పష్టం.
- source_word: בָקָר
  choice: పశువులు
  rationale: ఇది గోవుల జాతికి చెందిన మంద పశువులను సమష్టిగా సూచించే పదం; లింగాన్ని నిర్దిష్టంగా ‘ఎద్దులు’ అని పరిమితం చేయకుండా విస్తృత అర్థాన్ని ఉంచుతుంది.
- source_word: עִם עַתּוּדִים
  choice: మగ మేకపోతులు
  rationale: עַתּוּדִים ప్రత్యేకంగా మగ మేకలను సూచిస్తుంది; ఆ నిర్దిష్టతను ప్రధాన పాఠ్యంలోనే సహజంగా ఉంచింది.
- source_word: סֶלָה
  choice: సెలా
  rationale: పదానికి ఖచ్చితమైన అర్థం తెలియనందున ఊహాత్మకంగా అనువదించకుండా లిప్యంతరీకరించబడింది.
