id: PSA.66.11
reference: Psalms 66:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲבֵאתָ֥/נוּ בַ/מְּצוּדָ֑ה שַׂ֖מְתָּ מוּעָקָ֣ה בְ/מָתְנֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/011.yaml
  text: You brought us into the net[b][a]; you laid affliction on our loins.
translation:
  language: te
  text: నీవు మమ్మల్ని వలలోకి తెచ్చావు[a]; మా నడుములపై బాధను మోపావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వలలోకి’ అని అనువదించిన హీబ్రూ పదానికి ‘ఉచ్చులోకి,’ ‘కోటలోకి,’ లేదా ‘నిర్బంధ స్థలంలోకి’ అనే అర్థాలూ ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘బాధ’ అని అనువదించిన హీబ్రూ పదం ఒత్తిడి, కష్టం, లేదా బిగించే నిర్బంధాన్ని సూచించవచ్చు; మూలపాఠం ఆ బాధను నడుములపై ఉంచినట్లు చిత్రిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבֵאתָנוּ
  choice: నీవు మమ్మల్ని ... తెచ్చావు
  rationale: בוא ధాతువు హిఫీల్ రూపం, ప్రథమ పురుష బహువచన ప్రత్యయంతో, ‘నీవు మమ్మల్ని లోపలికి తెచ్చావు/ప్రవేశింపజేశావు’ అని అర్థం. ఈ ఎంపిక దేవుని ప్రత్యక్ష కార్యసాధకత్వాన్ని స్పష్టంగా ఉంచుతూ సహజమైన తెలుగును ఇస్తుంది.
- source_word: בַמְּצוּדָה
  choice: వలలోకి
  rationale: מְצוּדָה పట్టుకునే వల లేదా ఉచ్చు అనే అర్థంతోపాటు కోట/దుర్గం వంటి నిర్బంధ స్థలాన్నీ సూచించగలదు. పరీక్ష, చిక్కుబాటు అనే సందర్భంలో ‘వల’ ప్రధాన పాఠానికి సరిపోతుంది; అసలు పదంలోని ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఉంచాం.
- source_word: שַׂמְתָּ
  choice: మోపావు
  rationale: שׂים అంటే ‘పెట్టు, ఉంచు’. నడుములపై భారాన్ని ఉంచే శరీర రూపకానికి తెలుగులో ‘మోపావు’ సహజంగా, బలంగా సరిపోతుంది.
- source_word: מוּעָקָה
  choice: అణచివేసే భారం
  rationale: ఈ నామవాచకం బాధ, ఒత్తిడి, నిర్బంధం లేదా బిగించే భారాన్ని సూచిస్తుంది. ‘అణచివేసే భారం’ శారీరక రూపకాన్నీ, కలిగించిన కష్టాన్నీ ఒకేసారి తెలియజేస్తుంది.
- source_word: בְמָתְנֵינוּ
  choice: మా నడుములపై
  rationale: מָתְנַיִם నడుము/కటి భాగాన్ని సూచిస్తుంది. ‘నడుములు’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, మూలంలోని శరీర రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: బాధలో దేవుని ప్రత్యక్ష కార్యసాధకత్వం
  choice: దేవునినే ‘తెచ్చావు’, ‘మోపావు’ అనే ద్వితీయ పురుష క్రియలకు కర్తగా నేరుగా ఉంచడం
  alternative: ‘మేము వలలో చిక్కుకున్నాం’ లేదా ‘మాపై భారం పడింది’ అని దేవుని కార్యసాధకత్వాన్ని పరోక్షం చేయడం
  rationale: హీబ్రూ పాఠంలో రెండు క్రియలూ దేవునిని నేరుగా సంబోధించే ద్వితీయ పురుష రూపాల్లో ఉన్నాయి. అందువల్ల బాధాకరమైన పరీక్షకు దేవునితో ఉన్న సంబంధాన్ని మెత్తబరచకుండా, పాఠంలోని దైవశాస్త్రీయ ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. ‘వల’, ‘నడుములు’, ‘భారం’ అనే స్పష్టమైన శరీరాత్మక చిత్రాలను నిలుపుతూ, అరుదైన హీబ్రూ పదాల అర్థవిస్తృతిని పాదటిప్పణుల్లో సంరక్షించాం.
