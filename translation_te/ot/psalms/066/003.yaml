id: PSA.66.3
reference: Psalms 66:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִמְר֣וּ לֵ֭/אלֹהִים מַה נּוֹרָ֣א מַעֲשֶׂ֑י/ךָ בְּ/רֹ֥ב עֻ֝זְּ/ךָ֗ יְֽכַחֲשׁ֖וּ לְ/ךָ֣ אֹיְבֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/003.yaml
  text: Say to God[a], “How awesome are your works! Because of the greatness of your strength, your enemies cringe before you.”
translation:
  language: te
  text: 'దేవునికి ఇలా చెప్పండి: “నీ కార్యాలు ఎంత భయభక్తులను కలిగించేవి! నీ మహా బలంవల్ల నీ శత్రువులు నీకు కపటంగా లొంగిపోతారు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీకు అయిష్టంగానే లొంగుతారు” లేదా “నీ ఎదుట అణిగిపోతారు.” హీబ్రూ క్రియ కపటమైన, బలవంతపు, లేదా అయిష్ట లొంగుబాటును సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ
  choice: ఇలా చెప్పండి
  rationale: אמר యొక్క బహువచన ఆజ్ఞార్థక రూపాన్ని ఆరాధక సమాజానికి ఇచ్చిన ప్రత్యక్ష ఆదేశంగా సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לֵאלֹהִים
  choice: దేవునితో
  rationale: ל ఉపసర్గ దేవుడే సంబోధితుడని సూచిస్తుంది; తెలుగులో ‘దేవునితో చెప్పండి’ సహజమైన ప్రయోగం.
- source_word: מַה נּוֹרָא
  choice: ఎంత భయభక్తులు పుట్టించేవిగా
  rationale: మַה యొక్క ఆశ్చర్యార్థక బలాన్నీ, נוֹרָאలోని భయం మరియు విస్మయం కలిసిన భావాన్నీ ‘భయానకమైనవి’ అనే ఏకపక్ష ప్రతికూల పదం లేకుండా తెలియజేస్తుంది.
- source_word: מַעֲשֶׂיךָ
  choice: నీ కార్యాలు
  rationale: మַעֲשֶׂהకు సాధారణమైన ‘కార్యాలు’ అనే అర్థాన్ని కీర్తనల స్తుతి శైలికి తగిన విధంగా నిలుపుతుంది.
- source_word: בְּרֹב עֻזֶּךָ
  choice: నీ అపారమైన బలాన్ని బట్టి
  rationale: בְּ యొక్క కారణం లేదా ఆధారాన్ని సూచించే భావాన్ని, רֹבలోని అపారతను, עֹזలోని బలాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: יְכַחֲשׁוּ לְךָ
  choice: నీ ఎదుట అణిగిపోతారు
  rationale: శక్తి చేత బలవంతంగా తగ్గి లొంగే భావాన్ని సహజమైన తెలుగులో ఇస్తుంది; క్రియలో ఉండగల కపట లేదా అయిష్ట విధేయత భావాన్ని పాదటిప్పణిలో స్పష్టంగా ఉంచుతుంది.
- source_word: אֹיְבֶיךָ
  choice: నీ శత్రువులు
  rationale: బహువచన నామవాచకాన్నీ రెండవ పురుష ఏకవచన స్వామ్య ప్రత్యయాన్నీ నేరుగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: దేవుని పట్ల శత్రువుల ప్రతిస్పందన స్వభావం
  choice: దేవుని అపార బలం ఎదుట వారు అణిగిపోతారని ప్రధాన పాఠంలో చెప్పడం
  alternative: వారు కపటంగా విధేయత చూపుతారు లేదా అయిష్టంగా లొంగుతారు
  rationale: כחש యొక్క పియేల్ రూపం నిరాకరణ, కపట విధేయత లేదా బలవంతపు లొంగుబాటును సూచించగలదు. ప్రధాన పాఠం బలవంతంగా అణిగే భావాన్ని సహజంగా తెలియజేస్తూ, నిజాయితీ లేని విధేయత అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామూహిక ఆజ్ఞను గౌరవప్రదమైన బహువచనంతో అందించాం. కీర్తనాత్మక గౌరవాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఎంచుకున్నాం; ‘భయభక్తులు’ అనే పదం נוֹרָאలోని భయం-విస్మయం కలయికను వ్యక్తం చేస్తుంది.
