  yaml_path: translation/ot/psalms/066/010.yaml
  text: For you have tested us[a], O God[b]; you have refined us as silver is refined.
translation:
  language: te
  text: ఎందుకంటే దేవా, నీవు మమ్మల్ని పరీక్షించావు[a]; వెండిని శుద్ధి చేసినట్లుగా మమ్మల్ని శుద్ధి చేశావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మమ్మల్ని నిరూపించావు’; హీబ్రూ క్రియ పరీక్ష ద్వారా నిజత్వాన్ని లేదా నాణ్యతను వెల్లడించే భావాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: 'ఇది లోహశుద్ధి రూపకం: వెండిని అగ్నిలో శుద్ధి చేసే ప్రక్రియతో దేవుడు మమ్మల్ని శుద్ధి చేయడాన్ని పోల్చారు.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: సందర్భంలో ముందున్న స్తుతికి కారణాన్ని పరిచయం చేస్తుంది; హీబ్రూ సంధానపదంలోని వివరణాత్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְחַנְתָּנוּ
  choice: నీవు మమ్మల్ని పరీక్షించావు
  rationale: בחן ఒకరి లేదా ఒక వస్తువు నాణ్యతను పరిశీలించి దాని నిజత్వాన్ని నిరూపించే ఉద్దేశంతో పరీక్షించడాన్ని సూచించగలదు. ‘పరీక్షించావు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, తరువాతి శుద్ధీకరణ రూపకంతో సరిపోతుంది.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ఇది దేవునికి చేసిన ప్రత్యక్ష సంబోధన; ‘దేవా’ తెలుగులో సహజమైన, గౌరవప్రదమైన సంబోధన రూపం.
- source_word: צְרַפְתָּנוּ
  choice: మమ్మల్ని శుద్ధిచేశావు
  rationale: צרף అగ్ని ద్వారా లోహాన్ని శుద్ధిచేయడాన్ని సూచిస్తుంది. ఈ ఎంపిక లోహశుద్ధి రూపకాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: כִּצְרָף כָּסֶף
  choice: వెండిని శుద్ధిచేసినట్లు
  rationale: כְּ పోలికను సూచిస్తుంది; צרף ఇక్కడ శుద్ధిచేసే ప్రక్రియను, כסף వెండిని సూచిస్తాయి. ఈ ప్రయోగం మూలంలోని సంక్షిప్త పోలికను సహజమైన తెలుగు క్రియారూపంలో అందిస్తుంది.
