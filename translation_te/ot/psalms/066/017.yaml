  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభంగా అర్థమయ్యే కవితా శైలిని వాడాం. ‘నా నాలుక కింద’ అనే హీబ్రూ కవితాత్మక ప్రయోగం తెలుగులో అసాధారణంగా వినిపించినా, దాని దృశ్యరూపం మరియు ఉద్దేశపూర్వక అస్పష్టతను నిలుపుకోవడానికి అలాగే ఉంచాం.
