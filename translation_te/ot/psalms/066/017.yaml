translation:
  language: te
  text: 'నా నోటితో నేను ఆయనకు మొరపెట్టాను;

    నా నాలుక కింద స్తుతి ఉంది.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఘనపరచడం నా నాలుక కింద ఉంది.’ హీబ్రూ పదాన్ని దేవుణ్ణి ఘనపరిచే పలుకుగా, అంటే ‘స్తుతి’గా, అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלָיו
  choice: ఆయనకు
  rationale: ఈ రూపం అక్షరార్థంగా ‘అతనికి/ఆయనకు’ అని అర్థం. సందర్భంలో దేవుడే సూచించబడుతున్నా, మూలపాఠంలోని సర్వనామాన్ని నిలుపుకోవడానికి ‘ఆయనకు’ అని అనువదించాం.
- source_word: פִּי
  choice: నా నోటితో
  rationale: పֶּה అనే నామవాచకానికి ‘నోరు’ అనేది ప్రత్యక్ష అర్థం. ‘నా నోటితో’ అనేది హీబ్రూ శరీరాంగ రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: קָרָאתִי
  choice: నేను మొరపెట్టాను
  rationale: ప్రార్థనా సందర్భంలో קרא అనేది గట్టిగా పిలవడం లేదా సహాయం కోసం మొరపెట్టడం అనే భావాన్ని ఇస్తుంది. ‘మొరపెట్టాను’ ఆర్తితో చేసిన విన్నపాన్ని తెలియజేస్తుంది.
- source_word: וְרוֹמַם
  choice: స్తుతి
  rationale: ఈ రూపాన్ని ‘ఘనపరచడం/ఉన్నతపరచడం’ అనే భావంలోని నామవాచకంగా గ్రహించవచ్చు. సందర్భంలో పలికే దేవస్తుతిని సూచిస్తున్నందున ‘స్తుతి’ సహజంగా ఉంటుంది; అయితే ‘ఘనపరచడం’ అనే మూలభావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: תַּחַת
  choice: కింద
  rationale: ఈ ఉపసర్గకు నేరుగా ‘కింద’ అనే అర్థం ఉంది. నాలుకతో కలిసిన ఈ కవితాత్మక చిత్రం పలకడానికి సిద్ధంగా ఉన్న మాటను సూచించవచ్చు; ఆ చిత్రాన్ని వివరణతో భర్తీ చేయకుండా నిలిపాం.
- source_word: לְשׁוֹנִי
  choice: నా నాలుక
  rationale: ఇది అక్షరార్థంగా ‘నా నాలుక.’ ‘నా మాటల్లో’ అని భావానువాదం చేయకుండా మూలంలోని సజీవమైన శరీరాంగ చిత్రాన్ని కాపాడాం.
