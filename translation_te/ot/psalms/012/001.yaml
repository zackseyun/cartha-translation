  source_fidelity: ప్రస్తుత పాఠం హీబ్రూ పదార్థాలను ప్రధానంగా సరిగ్గా అందిస్తుంది; అయితే రెండు כִּי ('ఎందుకంటే/ఎందుకనగా') కారణార్థక అనుసంధానాలను ప్రధాన పాఠంలో పూర్తిగా వదిలివేసింది. అవి యాహ్వేను రక్షణ కోరడానికి గల కారణాన్ని తెలియజేస్తాయి కాబట్టి వాటిలో కనీసం సమగ్ర కారణసంబంధాన్ని స్పష్టంగా చూపాలి.
