  terminology: ‘యాహ్వే’ దైవనామానికి తగిన లిప్యంతరీకరణ. ‘భక్తుడు’ חָסִיד యొక్క ఏకవచనాన్ని నిలుపుతుంది; పాదటిప్పణి సామూహిక ప్రత్యామ్నాయాన్ని సముచితంగా వివరిస్తుంది. ‘నమ్మకస్థులు’ אֱמוּנִים సందర్భార్థానికి అనుకూలం. ‘మనుష్యుల మధ్యనుండి’ మానవ సమాజాన్ని సూచించే హీబ్రూ నుడికారాన్ని సహజంగా అందిస్తుంది.
