id: PSA.12.1
reference: Psalms 12:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הוֹשִׁ֣יעָ/ה יְ֭הוָה כִּי גָמַ֣ר חָסִ֑יד כִּי פַ֥סּוּ אֱ֝מוּנִ֗ים מִ/בְּנֵ֥י אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/001.yaml
  text: Save[a], O Yahweh, for the godly are gone[b]; for the faithful have vanished from among the sons of man.
translation:
  language: te
  text: యాహ్వే, రక్షించు! ఎందుకంటే భక్తుడు ఇక లేడు[a]; నమ్మకస్థులు మనుష్యుల మధ్యనుండి[b] కనుమరుగయ్యారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భక్తులు ఇక లేరు.” హీబ్రూలో నామవాచకమూ క్రియయూ ఏకవచనంలో ఉన్నాయి; ఆ ఏకవచనం ఒక వర్గానికి ప్రాతినిధ్యం వహించవచ్చు.
    reason: వ్యాకరణపరమైన మరియు అర్థపరమైన ప్రత్యామ్నాయం
  - marker: b
    text: అక్షరార్థంగా, “మనిషి కుమారులలోనుండి”; అంటే మానవ సమాజం మధ్యనుండి.
    reason: హీబ్రూ నుడికారానికి సంబంధించిన సాంస్కృతిక వివరణ
lexical_decisions:
- source_word: הוֹשִׁיעָה
  choice: రక్షించు
  rationale: యשׁע క్రియ యొక్క ఆజ్ఞార్థక రూపం; దేవునికి చేసే అత్యవసర ప్రార్థనను సహజమైన ఆధునిక తెలుగు భాషలో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని ప్రాచుర్యమైన ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: כִּי
  choice: (వాక్యక్రమం ద్వారా కారణార్థం)
  rationale: ఈ రెండు כִּי పదాలు మొరపెట్టుకోవడానికి గల కారణాలను పరిచయం చేస్తున్నాయి. తెలుగులో విరామచిహ్నంతో అనుసరించే వివరణ సహజంగా కారణ సంబంధాన్ని తెలియజేస్తుంది; ‘ఎందుకంటే’ను రెండుసార్లు పెట్టడం కవితా ప్రవాహాన్ని భారంగా చేస్తుంది.
- source_word: גָמַר
  choice: లేకుండాపోయాడు
  rationale: ‘ముగిసిపోవడం/ఇక లేకపోవడం’ అనే భావాన్ని వ్యక్తి విషయంగా సహజంగా తెలుపుతుంది; కేవలం పని ఆపేశాడనే అర్థాన్ని నివారిస్తుంది.
- source_word: חָסִיד
  choice: భక్తుడు
  rationale: దేవునిపట్ల నిబద్ధతతో, విశ్వాసపాత్రంగా జీవించే వ్యక్తిని సూచిస్తుంది. మూలంలోని ఏకవచన పుంలింగ రూపాన్ని నిలుపుతుంది; దాని సామూహిక ప్రయోగసాధ్యతను పాదటిప్పణి తెలియజేస్తుంది.
- source_word: פַסּוּ
  choice: కనుమరుగయ్యారు
  rationale: ‘తొలగిపోయారు/ఇక కనిపించరు’ అనే బహువచన భావాన్ని కవితాత్మకంగా, సహజంగా అందిస్తుంది.
- source_word: אֱמוּנִים
  choice: నమ్మకస్థులు
  rationale: నమ్మదగిన, విశ్వాసపాత్రులైన మనుష్యులను సూచించే బహువచన విశేషణార్థక నామవాచకంగా సరిపోతుంది.
- source_word: מִבְּנֵי אָדָם
  choice: మనుష్యుల మధ్యనుండి
  rationale: ‘ఆదాము కుమారులలోనుండి’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థకం; మానవ సమాజం మధ్యనుండి వారు అదృశ్యమయ్యారనే భావాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని వాడుతుంది. దాన్ని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: חָסִיד యొక్క ఏకవచనమూ సామూహిక భావసాధ్యత
  choice: భక్తుడు లేకుండాపోయాడు
  alternative: భక్తులు లేకుండాపోయారు
  rationale: క్రియ, నామవాచకం రెండూ మూలంలో ఏకవచనంలో ఉన్నాయి కాబట్టి ప్రధాన పాఠంలో దానిని నిలిపాం. అయితే ఇది భక్తుల వర్గానికి ప్రాతినిధ్య ఏకవచనంగా ఉండవచ్చనే నిజమైన సందిగ్ధతను పాదటిప్పణిలో ఉంచాం.
- issue: אֱמוּנִים యొక్క నైతిక-సంబంధార్థం
  choice: నమ్మకస్థులు
  alternative: విశ్వాసులు / విశ్వాసపాత్రులు
  rationale: ఇక్కడ మతపరమైన గుర్తింపుకన్నా సమాజంలో నమ్మదగిన, నిబద్ధులైన వ్యక్తుల భావం ముందుంటుంది. ‘నమ్మకస్థులు’ ఆ భావాన్ని మతపరంగా అతిగా నిర్దిష్టం చేయకుండా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనా కవిత్వానికి తగిన గౌరవభరితమైన, సంక్షిప్తమైన శైలి. అత్యవసర మొరను ఆశ్చర్యార్థక చిహ్నంతో వ్యక్తపరిచి, హీబ్రూ సమాంతర నిర్మాణాన్ని అర్థసహితంగా నిలిపింది.
