  to: యాహ్వే, రక్షించు! ఎందుకంటే భక్తుడు ఇక లేడు[a]; నమ్మకస్థులు మనుష్యుల మధ్యనుండి[b] కనుమరుగయ్యారు.
  rationale: కారణార్థక כִּיని ‘ఎందుకంటే’ ద్వారా పునరుద్ధరించాం. తెలుగు కవితా ప్రవాహాన్ని భారంగా చేయకుండా, ఆ కారణసూచకం సెమికోలన్‌తో కలిసిన రెండు ఫిర్యాదులకూ వర్తిస్తుంది. ‘భక్తుడు ఇక లేడు’ గָמַר యొక్క సందర్భోచితమైన ‘ఇక లేకపోవడం’ భావాన్ని సులభంగా తెలియజేస్తుంది. పాదటిప్పణి (b)లో ‘ఆదాము కుమారులు’ అనే అవసరానికి మించిన వ్యక్తినామ సూచనను తొలగించి, idiom యొక్క అక్షరార్థాన్ని మరింత నేరుగా ఇచ్చాం.
