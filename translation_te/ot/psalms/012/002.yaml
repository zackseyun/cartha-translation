translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తన కవితాత్మక గంభీరతను నిలిపే శైలి. హెబ్రీ పునరుక్తి, పెదవులు–హృదయాలు అనే శరీరరూపకాలు సాధ్యమైనంతవరకు సంరక్షించబడ్డాయి.
