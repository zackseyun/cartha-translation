  yaml_path: translation/ot/psalms/012/002.yaml
  text: They speak emptiness[a], each man to his neighbor; with flattering lips[b], with a double heart they speak.
translation:
  language: te
  text: ప్రతి మనిషి తన పొరుగువానితో వ్యర్థమైన మాటలు మాట్లాడతాడు; ముఖస్తుతి చేసే పెదవులతో[a], కపట హృదయంతో[b] వారు మాట్లాడతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నునుపైన పెదవులతో.’ హెబ్రీలో ఇది నునుపుగా, మృదువుగా అనిపించే మాటల రూపకం; సందర్భంలో ముఖస్తుతి చేసి మోసగించే మాటలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘హృదయంతో హృదయంతో.’ ఇది కపటత్వాన్ని లేదా విభజిత అంతరంగ ఉద్దేశాన్ని తెలిపే హెబ్రీ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁוְא
  choice: వ్యర్థమైన మాటలు
  rationale: ఈ పదం శూన్యత, అసత్యం, పనికిరానితనం అనే విస్తృత భావక్షేత్రాన్ని కలిగి ఉంది. సందర్భంలో మాటల విషయాన్ని సూచిస్తున్నందున ‘వ్యర్థమైన మాటలు’ సహజంగా ఉండి, దానిని కేవలం అబద్ధాలకే పరిమితం చేయదు.
- source_word: יְדַבְּרוּ
  choice: మాట్లాడుతున్నారు
  rationale: דבר పీయేల్ రూపానికి నేరమైన, సహజమైన తెలుగు సమానం; వచనంలోని క్రియ పునరుక్తిని కూడా నిలుపుతుంది.
- source_word: אִישׁ אֶת־רֵעֵהוּ
  choice: ప్రతి మనిషి తన పొరుగువానితో
  rationale: אִישׁ ఇక్కడ విభజనార్థక ఏకవచనం; רֵעֵהוּ సామాజిక పరిధిలోని పొరుగువాడు, సహచరుడు అనే విస్తృత భావాన్ని ఇస్తుంది.
- source_word: שְׂפַת חֲלָקוֹת
  choice: నునుపైన పెదవులతో
  rationale: మూలంలోని ‘నునుపుదనం గల పెదవి’ అనే దృశ్యరూపాన్ని నిలుపుతూ, మోసపూరిత ముఖస్తుతిని సూచించే ఉద్దేశపూర్వక అస్పష్టతను కాపాడుతుంది.
- source_word: בְּלֵב וָלֵב
  choice: రెండు హృదయాలతో
  rationale: అక్షరార్థంగా ‘హృదయంతో, హృదయంతో’ అనే హెబ్రీ నుడికారాన్ని దగ్గరగా ప్రతిబింబిస్తుంది; అది కపటత్వాన్ని లేదా విభజిత అంతరంగ ఉద్దేశాన్ని సూచిస్తుంది.
