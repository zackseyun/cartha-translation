  yaml_path: translation/ot/psalms/012/006.yaml
  text: The words of Yahweh are pure words[a], like silver refined in a furnace on the earth[b], purified seven times.
translation:
  language: te
  text: 'యాహ్వే పలుకులు స్వచ్ఛమైన పలుకులు;


    కొలిమిలో[a], భూమిమీద[b] శుద్ధి చేయబడి,


    ఏడుసార్లు పుటం వేయబడిన వెండివంటివి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘లోహశుద్ధి పాత్రలో’ లేదా ‘కరిగించే పాత్రలో’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం అరుదైనది; అది ఖచ్చితంగా దేనిని సూచిస్తుందో అనిశ్చితం, అయితే సందర్భం లోహశుద్ధికి సంబంధించినదని స్పష్టంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘భూమిమీద.’ ఈ పదబంధం శుద్ధి ప్రక్రియ జరిగే ప్రదేశాన్నో పరిసరాన్నో వర్ణించవచ్చు; దాని ఖచ్చితమైన భావఛాయ అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמֲרוֹת / אֲמָרוֹת
  choice: పలుకులు
  rationale: אמר నుంచి వచ్చిన ఈ పునరుక్త నామవాచకం పలికిన మాటలను విస్తృతంగా సూచిస్తుంది. ‘పలుకులు’ కవితాత్మక పునరుక్తిని నిలుపుతూ, భావాన్ని ‘వాగ్దానాలు’కు మాత్రమే పరిమితం చేయదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: טְהֹרוֹת
  choice: స్వచ్ఛమైన
  rationale: ఈ విశేషణం కల్మషంలేని స్వభావాన్ని తెలియజేస్తుంది; మాటల స్వచ్ఛతకూ, తరువాతి లోహశుద్ధి ఉపమానానికీ ‘స్వచ్ఛమైన’ సహజంగా సరిపోతుంది.
- source_word: כֶּסֶף
  choice: వెండి
  rationale: ఈ నామవాచకం నేరుగా వెండి లోహాన్నే సూచిస్తుంది.
- source_word: צָרוּף
  choice: పుటం వేసి
  rationale: లోహాన్ని వేడిచేసి మలినాలను తొలగించే శుద్ధి ప్రక్రియను ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בַּעֲלִיל
  choice: కొలిమిలో
  rationale: ఈ అరుదైన పదం యొక్క ఖచ్చితమైన వస్తుసూచన అనిశ్చితమైనా, వెండి శుద్ధి సందర్భంలో కొలిమి లేదా లోహశుద్ధి పాత్రను సూచించే అవకాశం ఉంది. ప్రధాన పాఠంలో ‘కొలిమి’ స్పష్టమైన లోహశుద్ధి దృశ్యాన్ని ఇస్తుంది; అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: לָאָרֶץ
  choice: భూమిమీద
  rationale: హీబ్రూ పదబంధాన్ని ఎక్కువగా వ్యాఖ్యానించకుండా దాని స్థానార్థక రూపాన్ని నిలిపాం. ఇది శుద్ధి జరిగే ప్రదేశాన్నో పరిసరాన్నో సూచించవచ్చు.
- source_word: מְזֻקָּק
  choice: శుద్ధిచేసిన
  rationale: మలినాలను తొలగించి శుభ్రపరచబడిన లోహాన్ని సూచిస్తుంది. ముందు ఉన్న ‘పుటం వేసి’ అనే ప్రక్రియను కొనసాగిస్తూ దాని ఫలితాన్ని స్పష్టంచేస్తుంది.
- source_word: שִׁבְעָתָיִם
  choice: ఏడుసార్లు
  rationale: హీబ్రూ రూపం పునరావృతమైన సంపూర్ణ శుద్ధిని వ్యక్తం చేస్తుంది; ‘ఏడుసార్లు’ దాని ప్రత్యక్ష రూపాన్నీ కవితాత్మక బలాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: యెహోవా పలుకుల స్వచ్ఛత స్వభావం
  choice: యెహోవా పలికిన మాటలు పూర్తిగా స్వచ్ఛమైనవని, నమ్మదగినవని లోహశుద్ధి ఉపమానం ద్వారా వ్యక్తం చేయడం
  alternative: ఈ మాటను కేవలం నైతిక పవిత్రతకు పరిమితం చేయడం లేదా తరువాతి కాలపు గ్రంథపరిరక్షణ సిద్ధాంతాన్ని ఇందులో విస్తరించి చదవడం
  rationale: హీబ్రూ వాక్యం యెహోవా పలుకులను పదేపదే శుద్ధిచేసిన వెండితో పోలుస్తుంది. ఆ కవితాత్మక వాదనను నిలుపుతూ, వచనం స్వయంగా చెప్పని తరువాతి సిద్ధాంతాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కవితాత్మక శైలిని వాడాం. హీబ్రూలోని ‘పలుకులు’ పునరుక్తిని నిలిపాం. లోహశుద్ధి దృశ్యానికి ‘పుటం వేసి’ అనే సహజమైన తెలుగు ప్రయోగాన్ని ఎంచుకుని, అరుదైన పదం మరియు ‘భూమిమీద’ అనే కష్టమైన పదబంధంలోని అనిశ్చితిని పాదసూచికల్లో వెల్లడించాం.
