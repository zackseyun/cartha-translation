source:
  edition: WLC
  text: לַ/מְנַצֵּ֥חַ עַֽל הַ/שְּׁמִינִ֗ית מִזְמ֥וֹר לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/000.yaml
  text: 'For the choirmaster: according to The Eighth[a]. A psalm of David[b].'
translation:
  language: te
  text: 'గాననాయకునికి: “ఎనిమిదవది” ప్రకారం[a]. దావీదు కీర్తన[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో “ఎనిమిదవది.” ఇది బహుశా ఒక రాగం, వాద్యం, సంగీత పద్ధతి లేదా ఎనిమిదవ స్వరస్థాయిని సూచించే సంగీత లేదా ఆరాధనా నిర్దేశం కావచ్చు. సంప్రదాయంగా దీనిని “షెమీనీత్” అని లిప్యంతరీకరిస్తారు.
    reason: cultural_note
  - marker: b
    text: “దావీదు రచించిన కీర్తన” లేదా “దావీదు కోసం కీర్తన” అని కూడా అనువదించవచ్చు. హీబ్రూ పదబంధం దావీదుతో ఉన్న సంబంధాన్ని ఖచ్చితంగా పేర్కొనదు.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: గాననాయకునికి
  rationale: కీర్తనల శీర్షికల్లో సంగీత ప్రదర్శనను పర్యవేక్షించే వ్యక్తిని సూచించే పదంగా తీసుకున్నాం. ఇది కేవలం సాధారణ ‘నాయకుడు’ అనే భావం కాకుండా సంగీత సంబంధమైన బాధ్యతను సహజంగా తెలియజేస్తుంది.
- source_word: עַל
  choice: ప్రకారం
  rationale: ఈ శీర్షికలో ఇది ఒక రాగం, సంగీత పద్ధతి లేదా ప్రదర్శనా నిర్దేశాన్ని పరిచయం చేసే అవకాశం ఉంది. ‘ప్రకారం’ ఆ కార్యార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַשְּׁמִינִית
  choice: “ఎనిమిదవది”
  rationale: హీబ్రూ పదానికి అక్షరార్థం ‘ఎనిమిదవది’. దాని ఖచ్చితమైన సంగీత లేదా ఆరాధనా ప్రయోగం అనిశ్చితంగా ఉన్నందున భావాన్ని నిర్దిష్టంగా పరిష్కరించకుండా అనువదించాం; ఉల్లేఖన చిహ్నాలు దీనిని ఒక ప్రత్యేక నిర్దేశంగా చూపుతాయి.
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: ఈ సాహిత్య ప్రక్రియకు తెలుగులో స్థిరపడిన, సందర్భోచితమైన పదం.
- source_word: לְדָוִד
  choice: దావీదు కీర్తన
  rationale: హీబ్రూ לְ నిర్మాణం రచయిత, అనుబంధం, అంకితం లేదా స్వామ్యాన్ని సూచించవచ్చు. తెలుగు నామసంబంధ నిర్మాణం ఈ సంబంధాన్ని ‘దావీదు రచించినది’ అని అతిగా నిర్దిష్టం చేయకుండా ఉంచుతుంది.
theological_decisions:
- issue: శీర్షికలో לְדָוִד సూచించే రచయితత్వం లేదా అనుబంధం
  choice: దావీదు కీర్తన
  alternative: దావీదు రచించిన కీర్తన; దావీదు కోసం కీర్తన
  rationale: మూల హీబ్రూ దావీదుతో ఉన్న సంబంధాన్ని ఒక్క విధంగా నిర్బంధించదు. అందువల్ల రచయితత్వాన్ని ఖచ్చితంగా నిర్ణయించకుండా మూలంలోని విస్తృత సంబంధాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన శీర్షిక శైలిని పాటించాం. ‘గాననాయకుడు,’ ‘కీర్తన’ వంటి గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే పదాలను వాడాం; సంగీత నిర్దేశంలోని అనిశ్చితిని పాదటిప్పణిలో స్పష్టంగా ఉంచాం.
