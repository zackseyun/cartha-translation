source:
  edition: WLC
  text: אַתָּֽה יְהוָ֥ה תִּשְׁמְרֵ֑/ם תִּצְּרֶ֓/נּוּ מִן הַ/דּ֖וֹר ז֣וּ לְ/עוֹלָֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/007.yaml
  text: You[a], O Yahweh, will keep them; you will guard us from this generation forever.
translation:
  language: te
  text: 'నీవే, యాహ్వే, వారిని కాపాడతావు;

    ఈ తరం నుంచి అతణ్ణి ఎప్పటికీ రక్షిస్తావు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠం ‘వారిని కాపాడతావు’ అనే బహువచనం నుంచి ‘అతణ్ణి రక్షిస్తావు’ అనే ఏకవచనానికి మారుతుంది. కొన్ని అనువాదాలు రెండవదానినీ ‘వారిని’ అని సమన్వయపరుస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: אַתָּה
  choice: నీవే
  rationale: స్వతంత్ర ద్వితీయ పురుష ఏకవచన సర్వనామం వాక్యం ముందుభాగంలో ఉండి ఉద్ఘాటనను ఇస్తుంది; ఆధునిక తెలుగులో ‘నీవే’ ఆ ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: תִּשְׁמְרֵם
  choice: వారిని కాపాడతావు
  rationale: שׁמר అనే క్రియలోని కాపాడడం, భద్రపరచడం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, 3వ పురుష బహువచన కర్మప్రత్యయాన్ని ‘వారిని’గా నిలిపాం.
- source_word: תִּצְּרֶנּוּ
  choice: అతణ్ణి ... రక్షిస్తావు
  rationale: נצר అంటే కాపాడడం లేదా రక్షించడం. మసొరా పాఠంలోని 3వ పురుష పుంలింగ ఏకవచన కర్మప్రత్యయాన్ని ‘అతణ్ణి’గా నిలిపి, ముందున్న బహువచనంతో దానిని కలిపివేయలేదు.
- source_word: מִן הַדּוֹר זּוּ
  choice: ఈ తరం నుంచి
  rationale: מִן యొక్క వియోజక భావాన్నీ, דור యొక్క సాధారణ అర్థమైన ‘తరం’నూ నేరుగా, సహజంగా అందిస్తుంది.
- source_word: לְעוֹלָם
  choice: ఎప్పటికీ
  rationale: నిరంతర కాలాన్ని తెలిపే ఈ కవితాత్మక ప్రయోగానికి ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
theological_decisions:
- issue: మొదటి క్రియలో బహువచనం (‘వారిని’), రెండవ క్రియలో ఏకవచనం (‘అతణ్ణి’) ఉండడం
  choice: 'మసొరా పాఠంలోని సంఖ్యామార్పును ప్రధాన పాఠంలోనే నిలిపాం: ‘వారిని ... అతణ్ణి’'
  alternative: రెండింటినీ బహువచనంగా సమన్వయపరచి ‘వారిని ... వారిని’ అని అనువదించడం; లేదా ‘వారిలో ప్రతి ఒక్కరిని’ అని వ్యాఖ్యానించడం
  rationale: హీబ్రూ పాఠంలో ఉన్న నిజమైన వ్యాకరణ ఉద్రిక్తతను అనువాదం మౌనంగా పరిష్కరించకూడదు. ఏకవచనం అవసరంలో ఉన్నవారిలో ఒక ప్రతినిధి వ్యక్తిని సూచించవచ్చు; అయితే ఆ వ్యాఖ్యానాన్ని ప్రధాన పాఠంలో బలవంతంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, కీర్తనకు తగిన గౌరవభరితమైన కవితాత్మక ధోరణి. సమాంతర పాదాల్లో ‘కాపాడతావు/రక్షిస్తావు’ అనే దగ్గరి భావాల క్రియలను ఉపయోగించి మూలంలోని రెండు వేర్వేరు క్రియలను ప్రతిబింబించాం.
