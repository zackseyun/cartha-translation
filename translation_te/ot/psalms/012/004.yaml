source:
  edition: WLC
  text: אֲשֶׁ֤ר אָֽמְר֨וּ לִ/לְשֹׁנֵ֣/נוּ נַ֭גְבִּיר שְׂפָתֵ֣י/נוּ אִתָּ֑/נוּ מִ֖י אָד֣וֹן לָֽ/נוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/004.yaml
  text: who say[a], “With our tongue we will prevail[d][c][b]; our lips are with us—who is lord over us?”
translation:
  language: te
  text: '“మా నాలుకతో[a] మేము పైచేయి సాధిస్తాం;

    మా పెదవులు మా వశంలో ఉన్నాయి[b]—

    మాకు యజమాని ఎవరు?[c]” అని అనేవారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మా నాలుక విషయానికొస్తే.” హీబ్రూ ఉపసర్గను విషయసూచకంగా కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “మా పెదవులు మాతో ఉన్నాయి”; లేదా, “మా పెదవులు మా సొంతం,” “మా పెదవులు మా పక్షాన ఉన్నాయి.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “మాకు ప్రభువు ఎవరు?” లేదా “మాపై అధికారి ఎవరు?”
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר אָמְרוּ
  choice: అని అనేవారు
  rationale: ముందటి వచనంలో పేర్కొన్న దుష్టులను వర్ణించే సంబంధ వాక్యంగా ఇది పనిచేస్తుంది. హీబ్రూ పరిపూర్ణ క్రియ ఇక్కడ వారి నిరంతర వైఖరిని లక్షణాత్మకంగా తెలియజేస్తుంది; అందుకే తెలుగు అలవాటు భావంలోని ‘అనేవారు’ సహజంగా సరిపోతుంది.
- source_word: לִלְשֹׁנֵנוּ
  choice: మా నాలుకతో
  rationale: לְ ఉపసర్గాన్ని సందర్భానుసారంగా సాధనార్థకంగా గ్రహించి, మాటనే ఆధిపత్యం సాధించే సాధనంగా చూపిస్తుంది. ‘నాలుక’ అనే హీబ్రూ శరీరరూపకాన్ని నిలుపుతుంది.
- source_word: נַגְבִּיר
  choice: మేము పైచేయి సాధిస్తాం
  rationale: גבר హిఫీల్ రూపం బలాన్ని ప్రదర్శించడం లేదా నెగ్గడం అనే భావాన్ని ఇస్తుంది. గొప్పలు చెప్పే ఈ సందర్భంలో ‘పైచేయి సాధిస్తాం’ మాటల ద్వారా నెగ్గుతామనే ధీమాను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שְׂפָתֵינוּ
  choice: మా పెదవులు
  rationale: ‘మాటలు’ అని భావార్థం చేయకుండా, మూలంలోని స్పష్టమైన ‘పెదవులు’ అనే రూపకాన్ని నిలుపుతుంది.
- source_word: אִתָּנוּ
  choice: మా వశంలో ఉన్నాయి
  rationale: అక్షరార్థంగా ‘మాతో ఉన్నాయి.’ సందర్భంలో ఇది తమ మాటలపై తమకే అధికారం ఉందనే స్వాధీనతా భావాన్ని సూచిస్తుంది. ‘మా వశంలో’ అనేది ఆ భావాన్ని సహజ తెలుగులో తెలియజేస్తూ, ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచుతుంది.
- source_word: מִי אָדוֹן לָנוּ
  choice: మాకు యజమాని ఎవరు?
  rationale: אָדוֹן ఇక్కడ దేవుని ప్రత్యేక నామం కాదు; తమపై ఎవరి అధికారాన్నీ అంగీకరించని వారి ధిక్కారాన్ని తెలిపే సాధారణ ‘యజమాని/ప్రభువు’ పదం. ‘యజమాని’ ఆ సాధారణ అధికార భావాన్ని దేవుని బిరుదుతో కలపకుండా ఉంచుతుంది.
theological_decisions:
- issue: אָדוֹן అనే అధికార బిరుదు యొక్క అనువాదం
  choice: యజమాని
  alternative: ప్రభువు; అధికారి
  rationale: ఈ సందర్భంలో పదం యెహోవాను నేరుగా సూచించదు; ‘మాపై ఎవరికీ అధికారం లేదు’ అనే తిరుగుబాటు ధోరణిని తెలియజేస్తుంది. ‘యజమాని’ మూలపదంలోని వ్యక్తిగత అధికార భావాన్ని నిలుపుతూ, దేవుని ప్రత్యేక బిరుదుగా అనవసరంగా చదివే అవకాశాన్ని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా ధోరణిని ఉంచాం. ‘నాలుక,’ ‘పెదవులు’ అనే సమాంతర శరీరరూపకాలను కాపాడాం. ‘మా వశంలో’ సహజ అవగాహనకు తోడ్పడుతుంది; అయితే אִתָּנוּ లోని సంక్షిప్తత మరియు బహుఅర్థకతను పాదసూచికలో స్పష్టంగా నిలిపాం.
