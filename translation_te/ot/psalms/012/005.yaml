id: PSA.12.5
reference: Psalms 12:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִ/שֹּׁ֥ד עֲנִיִּים֮ מֵ/אַנְקַ֪ת אֶבְי֫וֹנִ֥ים עַתָּ֣ה אָ֭קוּם יֹאמַ֣ר יְהוָ֑ה אָשִׁ֥ית בְּ֝/יֵ֗שַׁע יָפִ֥יחַֽ לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/005.yaml
  text: Because of the devastation of the poor[a], because of the groaning of the needy, now I will arise, says Yahweh; I will set him in the safety for which he longs.
translation:
  language: te
  text: 'పేదలపై జరుగుతున్న విధ్వంసం కారణంగా,

    అవసరంలో ఉన్నవారి మూలుగుల కారణంగా,

    “ఇప్పుడు నేను లేస్తాను,” అని యాహ్వే అంటున్నాడు;

    “అతడు ఆతురంగా కోరుకుంటున్న భద్రతలో అతణ్ణి ఉంచుతాను[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: చివరి పదబంధంలోని హీబ్రూ క్లిష్టంగా ఉంది. మరింత అక్షరార్థంగా, “నేను భద్రతలో ఉంచుతాను; అతడు దానికోసం ఆతురపడుతున్నాడు” అని ఉండవచ్చు. మరికొందరు దీనిని, “అతనిపై బుసకొట్టేవాని నుండి అతణ్ణి భద్రతలో ఉంచుతాను” అనే భావంలో తీసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: מִשֹּׁד עֲנִיִּים
  choice: పేదలు దోపిడికి గురవుతున్నందున
  rationale: מִן‌ను ఇక్కడ కారణార్థకంగా తీసుకున్నాం. שֹׁד విధ్వంసకరమైన దోపిడిని లేదా హింసను సూచిస్తుంది; సహజమైన తెలుగులో బాధితులపై జరిగిన చర్యగా వ్యక్తపరచడం భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מֵאַנְקַת אֶבְיוֹנִים
  choice: అవసరంలో ఉన్నవారు మూలుగుతున్నందున
  rationale: మొదటి పాదానికి సమాంతరంగా מִן కారణాన్ని సూచిస్తుంది. אֶבְיוֹנִים కేవలం పేదరికమే కాక అవసరంలో, కొరతలో ఉండడాన్ని నొక్కిచెబుతుంది; אַנְקָה బాధతో వెలువడే మూలుగును సూచిస్తుంది.
- source_word: עַתָּה אָקוּם
  choice: ఇప్పుడు నేను లేస్తాను
  rationale: దేవుడు వెంటనే జోక్యం చేసుకొని చర్య తీసుకోబోతున్నాడనే భావాన్ని, మూలంలోని మానవరూప వర్ణనను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని ఉచ్చారణకు సమీపమైన లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: אָשִׁית בְּיֵשַׁע
  choice: సురక్షిత స్థితిలో అతణ్ణి ఉంచుతాను
  rationale: שׂים అంటే ఉంచడం లేదా నిలపడం; יֵשַׁע ఇక్కడ విమోచన ఫలితంగా లభించే భద్రతను సూచిస్తుంది. తెలుగులో ‘సురక్షిత స్థితి’ ఆ నిర్దిష్ట ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יָפִיחַ לוֹ
  choice: అతడు ఆశగా ఎదురుచూస్తున్న
  rationale: కష్టమైన ఈ పదబంధాన్ని ‘దానికోసం ఉవ్విళ్లూరడం/ఆశపడడం’ అనే భావంలో తీసుకున్నాం. సందర్భంలో బాధితుడు కోరుతున్న భద్రతతో దీనిని అనుసంధానించడం సుసంబద్ధంగా ఉంది; ఇతర సాధ్యమైన అర్థాలను పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని నామాన్ని నిలుపుతుంది.
- issue: చివరి పదబంధం יָפִיחַ לוֹ యొక్క భావం
  choice: బాధితుడు ఆశగా ఎదురుచూస్తున్న భద్రత
  alternative: అతడు దానికోసం ఉవ్విళ్లూరుతున్నాడు; అతనిపై బుసకొట్టేవాని నుండి భద్రత
  rationale: హీబ్రూ నిర్మాణం అస్పష్టమైనందున సందర్భానికి సరిపోయే ప్రధాన అర్థాన్ని పాఠ్యంలో ఇచ్చి, భిన్న వ్యాకరణ లేదా పదార్థ అవగాహనలను పాదటిప్పణిలో స్పష్టంగా గుర్తించాం; తద్వారా అసలు పాఠంలోని అనిశ్చితిని దాచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితా సమాంతరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘అవసరంలో ఉన్నవారు’ అనే రూపం עֲנִיִּים మరియు אֶבְיוֹנִים మధ్యనున్న స్వల్ప భావభేదాన్ని నిలుపుతుంది. దైవనామాన్ని ‘యాహ్వే’గా ఇచ్చాం.
