id: PSA.12.8
reference: Psalms 12:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: סָבִ֗יב רְשָׁעִ֥ים יִתְהַלָּכ֑וּ/ן כְּ/רֻ֥ם זֻ֝לּ֗וּת לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/008.yaml
  text: The wicked walk all around[b][a], when vileness is exalted among the sons of man.
translation:
  language: te
  text: దుష్టులు నలువైపులా తిరుగుతారు; మానవుల మధ్య[a] నీచత్వం ఘనపరచబడినప్పుడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘మనుష్యకుమారుల మధ్య’; ఇది సాధారణంగా మానవులందరినీ సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దుష్టులు నలువైపులా పొంచి తిరుగుతారు; మానవుల మధ్య నీచత్వం ఘనపరచబడుతుండగా.’
    reason: alternative_reading
lexical_decisions:
- source_word: סָבִיב
  choice: నలువైపులా
  rationale: చుట్టూ ఉన్న అన్ని వైపులలో సంచరించడాన్ని సూచించే క్రియావిశేషణ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: רְשָׁעִים
  choice: దుష్టులు
  rationale: దుష్టంగా ప్రవర్తించే వ్యక్తులను సూచించే నామవాచక బహువచన భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: יִתְהַלָּכוּן
  choice: తిరుగుతారు
  rationale: הלך అనే ధాతువు హిత్పయేల్ రూపంలో ‘అటూ ఇటూ నడుచు/తిరుగు’ అనే భావం ఉంది. ‘పొంచి తిరుగుతారు’ అనడం సందర్భార్థాన్ని బలపరుస్తుంది కాబట్టి ప్రధాన పాఠంలో చేర్చలేదు.
- source_word: כְּרֻם
  choice: ఘనపరచబడినప్పుడు
  rationale: כְּ ఉపసర్గతో ఉన్న ఈ క్లిష్ట రూపాన్ని దుష్టులు స్వేచ్ఛగా తిరిగే సందర్భాన్ని సూచించే కాలార్థక నిర్మాణంగా అనువదిస్తుంది; ‘ఘనపరచబడుతుండగా’ అనే సమకాలిక భావం కూడా సాధ్యమే.
- source_word: זֻלּוּת
  choice: నీచత్వం
  rationale: విలువలేనిదనం, హీనత్వం లేదా నైతికంగా జుగుప్సాకరమైనదాన్ని సూచించే పదానికి సందర్భానుకూలమైన తెలుగు సమానం.
- source_word: לִבְנֵי אָדָם
  choice: మానవుల మధ్య
  rationale: అక్షరార్థంగా ‘ఆదాము కుమారులకు/మనుష్యకుమారుల మధ్య’ అయిన హీబ్రూ నుడికారానికి సాధారణ మానవాళిని సూచించే సహజమైన, లింగసమగ్ర తెలుగు రూపం; మూల నుడికారం పాదసూచికలో నిలుపబడింది.
theological_decisions:
- issue: לִבְנֵי אָדָם అనే మానవజాతిని సూచించే నుడికారం
  choice: మానవుల మధ్య
  alternative: మనుష్యకుమారుల మధ్య
  rationale: హీబ్రూ రూపం వ్యాకరణపరంగా పుంలింగంలో ఉన్నప్పటికీ సూచన సాధారణంగా మానవులందరికీ వర్తిస్తుంది. ప్రధాన పాఠంలో సహజమైన సామూహిక అర్థాన్ని ఇచ్చి, మూలభాష ఆకృతిని పాదసూచికలో తెలియజేస్తుంది.
- issue: כְּרֻם యొక్క కాలార్థక లేదా సందర్భార్థక సంబంధం
  choice: ఘనపరచబడినప్పుడు
  alternative: ఘనపరచబడుతుండగా
  rationale: ఈ క్లిష్ట నిర్మాణం ‘ఎప్పుడు’ అనే కాలార్థాన్నీ, ‘ఉండగా/కొద్దీ’ అనే సందర్భార్థాన్నీ అనుమతిస్తుంది. ప్రధాన పాఠం స్పష్టమైన కాలార్థాన్ని ఎంచుకుంటూ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ పదక్రమాన్ని బలవంతంగా అనుసరించకుండా తెలుగు వాక్యప్రవాహాన్ని కాపాడింది; అయితే ‘నలువైపులా తిరుగుతారు’ అనే మూల దృశ్యాన్ని నిలిపింది.
