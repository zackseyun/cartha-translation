source:
  edition: WLC
  text: יַכְרֵ֣ת יְ֭הוָה כָּל שִׂפְתֵ֣י חֲלָק֑וֹת לָ֝שׁ֗וֹן מְדַבֶּ֥רֶת גְּדֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/003.yaml
  text: May Yahweh cut off all flattering lips[b][a], the tongue that speaks great things.
translation:
  language: te
  text: పొగడ్తలు పలికే పెదవులన్నిటినీ[a], గొప్ప మాటలు పలికే[b] నాలుకను యాహ్వే నరికివేయుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘నునుపైన పెదవులు’; హీబ్రూ చిత్రం జారుడైన, పొగడ్తలతో కూడిన మాటను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘గొప్ప విషయాలు’; సందర్భంలో ఇది గర్వంతో చెప్పే పెద్ద మాటలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְרֵת
  choice: నరికివేయుగాక
  rationale: హిఫీల్ అసంపూర్ణ క్రియ ఇక్కడ ప్రార్థన లేదా శాపోక్తి భావాన్ని వ్యక్తం చేస్తుంది. ‘నరికివేయుగాక’ అనే రూపం తొలగించడం/నాశనం చేయడం అనే భావంతోపాటు హీబ్రూ పదంలోని ‘నరుకు’ చిత్రాన్ని కూడా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణకు అనుగుణంగా తెలుగులో ‘యాహ్వే’గా ఇచ్చాం.
- source_word: כָּל
  choice: అన్నిటినీ
  rationale: బహువచన పదబంధంతో సహజంగా సరిపడే సమగ్ర భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: שִׂפְתֵי חֲלָקוֹת
  choice: మృదువుగా పొగిడే పెదవులు
  rationale: అక్షరార్థంగా ‘నునుపుదనపు పెదవులు.’ సందర్భంలో ఇది ఆకట్టుకోవడానికి లేదా మోసపూరితంగా పొగిడే మాటను సూచిస్తుంది. ‘మృదువుగా పొగిడే’ అనే ఎంపిక హీబ్రూ చిత్రాన్నీ సందర్భార్థాన్నీ కలిపి అందిస్తుంది.
- source_word: לָשׁוֹן
  choice: నాలుకను
  rationale: ముందున్న బహువచన పదబంధం తరువాత హీబ్రూలో ఉన్న ఏకవచన రూపాన్ని అలాగే ఉంచి, మాటకు సంబంధించిన సజీవ చిత్రాన్ని నిలిపాం.
- source_word: מְדַבֶּרֶת
  choice: పలికే
  rationale: ‘నాలుక’ను విశేషించే వర్తమాన క్రియారూపాన్ని సహజమైన తెలుగు సంబంధార్థక రూపంగా ఇచ్చాం.
- source_word: גְּדֹלוֹת
  choice: గొప్పలు
  rationale: అక్షరార్థం ‘గొప్ప విషయాలు.’ ఈ సందర్భంలో స్వీయగర్వంతో కూడిన పెద్ద మాటలు ఉద్దేశించబడ్డాయి; ‘గొప్పలు పలికే’ అనేది తెలుగులో సహజంగా ఉండి ఆ భావాన్ని అందిస్తుంది. మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దాన్ని ‘ప్రభువు’ వంటి బిరుదుతో మార్చకుండా, యహ్వె/యాహ్వే ఉచ్చారణకు సమీపమైన ‘యాహ్వే’ రూపంలో నిలిపాం.
- issue: יַכְרֵת యొక్క విధి—వాక్యార్థం
  choice: నరికివేయుగాక
  alternative: నరికివేస్తాడు
  rationale: కీర్తన సందర్భంలో ఇది నిర్ధారణగా చెప్పిన భవిష్యద్వాక్యం కంటే ప్రార్థనాత్మకమైన కోరిక లేదా శాపోక్తిగా సహజంగా అర్థమవుతుంది. అయినా హీబ్రూ అసంపూర్ణ క్రియలో ఉన్న విధి—సూక్ష్మత కారణంగా సూచనార్థక పఠనం వ్యాకరణపరంగా పూర్తిగా అసాధ్యం కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గంభీరమైన ప్రార్థనా శైలిని ఉపయోగించాం. ‘నరికివేయుగాక’లోని శాపోక్తి ధోరణిని మృదువుపరచకుండా నిలిపాం; ‘మృదువుగా పొగిడే’ ద్వారా అక్షరార్థ చిత్రానికీ సహజ తెలుగు భావానికీ సమతుల్యం సాధించాం.
