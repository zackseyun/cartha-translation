id: PSA.51.17
reference: Psalms 51:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י לֹא תַחְפֹּ֣ץ זֶ֣בַח וְ/אֶתֵּ֑נָה ע֝וֹלָ֗ה לֹ֣א תִרְצֶֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/017.yaml
  text: For you do not delight in sacrifice[a], or I would give it; you do not take pleasure in burnt offering.
translation:
  language: te
  text: ఎందుకంటే బలిని నీవు కోరుకోవు; లేకపోతే నేను దాన్ని అర్పించేవాడిని. దహనబలి నీకు ప్రీతికరం కాదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి భావానికి కారణాన్ని పరిచయం చేసే హేతుబోధక సంధిగా సహజమైన తెలుగు రూపం.
- source_word: לֹא תַחְפֹּץ
  choice: నీవు కోరుకోవు
  rationale: חפץ లోని కోరిక/ఇష్ట భావాన్ని సహజంగా తెలియజేస్తుంది; కేవలం ఆచారబలే దేవుని అభీష్టం కాదనే వాక్యంలోని ఉద్వేగాన్ని అతిగా వివరించదు.
- source_word: זֶבַח
  choice: బలి
  rationale: ఆరాధనలో అర్పించే బలికి ప్రామాణికమైన, సాధారణ పాఠకులకు సుపరిచితమైన పదం.
- source_word: וְאֶתֵּנָה
  choice: లేకపోతే నేను దాన్ని అర్పించేవాడిని
  rationale: సందర్భంలోని షరతుతో కూడిన భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; అంతర్నిహిత కర్మను ‘దాన్ని’ అని పూరిస్తుంది.
- source_word: עוֹלָה
  choice: దహనబలి
  rationale: పూర్తిగా దహనం చేసే సాంకేతిక బలిరకానికి స్థిరమైన తెలుగు పదం.
- source_word: לֹא תִרְצֶה
  choice: నీకు ప్రీతికరం కాదు
  rationale: రצה లోని అనుకూలత, సంతోషం, అంగీకార భావాలను కలిపి తెలియజేస్తూ మొదటి క్రియతో స్వల్ప పదభేదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: బలుల విషయమై ఈ వాక్యపు ఉద్దేశం
  choice: పశ్చాత్తాప సందర్భంలో బలి మాత్రమే దేవుడు కోరేది కాదని నేరుగా చెప్పడం
  alternative: అన్ని బల్యారాధనలను సార్వత్రికంగా తిరస్కరించడం
  rationale: మూలవాక్యం ఆచారబలుల వ్యవస్థ మొత్తాన్ని రద్దు చేస్తున్నదని స్పష్టంగా చెప్పదు. అందువల్ల దాని ఉద్వేగాన్ని పరిష్కరించకుండా, ఉన్నట్లే నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గౌరవభరితమైన, అయినా సాధారణ పాఠకులకు సులభమైన శైలి. ‘అర్పించేవాడిని’ బలి సందర్భానికి సహజమైన క్రియ; ‘ప్రీతికరం కాదు’ రెండో హెబ్రీ క్రియలోని అనుకూల స్వీకార భావాన్ని ప్రతిబింబిస్తుంది.
