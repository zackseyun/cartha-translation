  terminology: ‘బలి’ and ‘దహనబలి’ are established, understandable Telugu cultic terms. The lexical distinction between the two Hebrew verbs is reasonably maintained by ‘కోరుకోవు’ and ‘ప్రీతికరం కాదు.’
