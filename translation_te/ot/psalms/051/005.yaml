  yaml_path: translation/ot/psalms/051/005.yaml
  text: Against you—you alone—I have sinned[a], and I have done what is evil in your eyes[b], so that you may be justified in your words and blameless in your judgment.
translation:
  language: te
  text: నీకు మాత్రమే విరోధంగా నేను పాపం చేశాను[a]; నీ దృష్టికి చెడైనది చేశాను. నీవు నీ మాటలో నీతిమంతుడవని తేలునట్లు, నీవు తీర్పు తీర్చేటప్పుడు నిర్దోషివని తేలునట్లు చేశాను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీకు, నీకు మాత్రమే, నేను పాపం చేశాను.’ హీబ్రూ పదక్రమం దేవునినే అంతిమంగా అపరాధం చేసినవానిగా ఉద్ఘాటిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీవు నీ మాటలో నీతిమంతుడవని తేలునట్లు, నీవు తీర్పు తీర్చేటప్పుడు పవిత్రుడవని తేలునట్లు.’ చివరి క్రియకు ‘నిర్మలుడు,’ ‘స్వచ్ఛుడు,’ లేదా న్యాయస్థాన సందర్భంలో ‘నిర్దోషి’ అనే భావాలు ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: לְךָ לְבַדְּךָ
  choice: నీకు—నీకు మాత్రమే—విరోధంగా
  rationale: לְ నిర్మాణం ఈ పాపఒప్పుకోలు సందర్భంలో పాపానికి గురైన పక్షాన్ని సూచిస్తుంది. ‘నీకు మాత్రమే’ అనే పునరుక్తి, విరామచిహ్నాలు హీబ్రూ ఉద్ఘాటనను నిలుపుతాయి.
- source_word: חָטָאתִי
  choice: నేను పాపం చేశాను
  rationale: హీబ్రూ పరిపూర్ణ క్రియను తెలుగులో సహజమైన పాపఒప్పుకోలు రూపంలో అనువదించింది.
- source_word: וְהָרַע בְּעֵינֶיךָ עָשִׂיתִי
  choice: నీ దృష్టిలో చెడ్డదాన్ని చేశాను
  rationale: ‘కళ్లలో’ అనే హీబ్రూ నుడికారాన్ని సహజ తెలుగు ‘దృష్టిలో’గా ఇచ్చి, దేవుని నైతిక అంచనాను వ్యక్తం చేసింది.
- source_word: לְמַעַן
  choice: అందువల్ల
  rationale: ఇక్కడ ఉద్దేశం లేదా ఫలితం రెండింటికీ వీలున్న సంబంధాన్ని సందర్భానుసారమైన ఫలితార్థంతో తెలిపింది; పాపం దేవుణ్ణి న్యాయవంతునిగా చేయాలనే ఉద్దేశంతో జరిగిందని సూచించకుండా ఉంటుంది.
- source_word: תִּצְדַּק בְּדָבְרֶךָ
  choice: నీవు పలికే మాటల్లో న్యాయవంతుడవని తేలుతుంది
  rationale: צדק యొక్క న్యాయస్థాన సంబంధమైన ‘సరైనవాడని/న్యాయవంతుడని తేలడం’ అనే భావాన్ని, తెలుగులో అపార్థం కలిగించగల ‘సమర్థించబడటం’ కంటే స్పష్టంగా తెలిపింది.
- source_word: תִּזְכֶּה בְשָׁפְטֶךָ
  choice: నీవు తీర్పు తీర్చేటప్పుడు నిర్దోషివని తేలుతుంది
  rationale: זכה లోని పవిత్రత, నిర్దోషిత్వం, న్యాయపరమైన సమర్థత భావాలను సమాంతర వాక్య నిర్మాణంలో సహజంగా నిలిపింది.
theological_decisions:
- issue: మానవ బాధితులు ఉన్నప్పటికీ ‘నీకు మాత్రమే విరోధంగా’ అనే సంపూర్ణ వాక్యం
  choice: ‘నీకు—నీకు మాత్రమే—విరోధంగా’ అని యథాతథ ఉద్ఘాటనను నిలుపుట
  alternative: ‘ప్రధానంగా నీకు విరోధంగా’
  rationale: హీబ్రూ పాఠంలోని తీవ్రమైన దేవకేంద్రిత పాపఒప్పుకోలను తగ్గించకుండా, మానవ బాధితుల విషయాన్ని అనువాదంలో వివరణాత్మకంగా చేర్చలేదు.
- issue: לְמַעַן లోని ఉద్దేశం–ఫలితం సందిగ్ధత
  choice: ‘అందువల్ల’ అని ఫలిత సంబంధాన్ని ప్రధాన పాఠంలో చూపుట
  alternative: ‘…తేలేలా’ లేదా ‘…తేలడానికి’
  rationale: పాపం దేవుని న్యాయాన్ని స్థాపించాలనే ఉద్దేశంతో చేయబడిందనే భావాన్ని రాకుండా చూస్తూ, హీబ్రూలోని తార్కిక సంబంధాన్ని నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- issue: దేవుని నీతి, తీర్పులోని న్యాయస్థాన భావం
  choice: ‘న్యాయవంతుడవని తేలుతుంది / నిర్దోషివని తేలుతుంది’
  alternative: ‘నీవు న్యాయవంతునిగా సమర్థించబడతావు / పవిత్రుడవని తేలుతుంది’
  rationale: దేవుని మాటలు, తీర్పు సరైనవని వెల్లడయ్యే భావాన్ని కాపాడుతూ, ప్రత్యేక సిద్ధాంతార్థాన్ని పాఠంలోకి దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన పాపఒప్పుకోలు ధోరణి. ‘నీకు—నీకు మాత్రమే’ అనే నిర్మాణం మూలంలోని ఉద్ఘాటనను నిలుపుతుంది. ‘నీ దృష్టిలో’ సహజ తెలుగు నుడికారం; చివరి రెండు భాగాల్లో న్యాయస్థాన సంబంధమైన సమాంతరత కాపాడబడింది.
