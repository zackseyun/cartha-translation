revisions:
- from: నీకు—నీకు మాత్రమే—విరోధంగా నేను పాపం చేశాను[a]; నీ దృష్టిలో చెడ్డదాన్ని చేశాను. అందువల్ల నీవు పలికే మాటల్లో న్యాయవంతుడవని తేలుతుంది; నీవు తీర్పు తీర్చేటప్పుడు నిర్దోషివని తేలుతుంది.[b]
  to: నీకు మాత్రమే విరోధంగా నేను పాపం చేశాను[a]; నీ దృష్టికి చెడైనది చేశాను. నీవు నీ మాటలో నీతిమంతుడవని తేలునట్లు, నీవు తీర్పు తీర్చేటప్పుడు నిర్దోషివని తేలునట్లు చేశాను.[b]
  rationale: The revision gives the opening a natural modern Telugu construction, retains the Hebrew’s absolute exclusive emphasis, and renders the final two clauses with second-person forms. ‘తేలునట్లు’ preserves the purpose/result ambiguity of לְמַעַן more faithfully than the exclusively consequential ‘అందువల్ల.’ The main text retains judicial ‘నిర్దోషి,’ while the footnote records the viable ‘pure’ sense without treating it as a doctrinal distinction.
