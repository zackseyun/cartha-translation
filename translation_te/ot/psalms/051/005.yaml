review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the confession, the God-directed force of ‘you alone,’ the evil done in God’s sight, and the judicial vindication in the final parallelism. However, ‘అందువల్ల’ narrows לְמַעַן to a consequential inference, whereas the Hebrew retains a purpose/result connection; the finite wording ‘తేలుతుంది’ also obscures that God is the grammatical subject of both final verbs.
  naturalness: ‘నీకు—నీకు మాత్రమే—విరోధంగా’ is not idiomatic Telugu word order because ‘నీకు’ and ‘విరోధంగా’ are split by a repeated dative phrase. ‘నీకు మాత్రమే విరోధంగా’ is natural and retains the exclusive emphasis. Subject-agreeing forms such as ‘తేలుతావు’ make the final parallelism clear and fluent.
  terminology: ‘నీ దృష్టిలో చెడ్డదాన్ని’ is understandable, but ‘నీ దృష్టికి చెడైనది’ is a more natural formal rendering of the Hebrew substantive ‘the evil.’ ‘నీతిమంతుడవని’ suitably conveys being proved right/righteous without importing a doctrinal sense. ‘నిర్దోషివని’ appropriately retains the judicial sense of זכה in parallel with God’s judging.
  issues:
  - severity: medium
    issue: The rendering ‘అందువల్ల’ for לְמַעַן restricts the source conjunction to result/consequence.
    rationale: לְמַעַן can express purpose or result here. A Telugu form such as ‘తేలునట్లు’ preserves that source-level connection without adjudicating it as exclusively purpose or exclusively consequence.
  - severity: medium
    issue: ‘న్యాయవంతుడవని తేలుతుంది; ... నిర్దోషివని తేలుతుంది’ leaves the final predicates impersonal.
    rationale: The Hebrew verbs are second-person singular, addressed to God. ‘నీతిమంతుడవని తేలుతావు ... నిర్దోషివని తేలుతావు’ preserves the grammar and parallelism.
  - severity: low
    issue: The opening phrase is syntactically awkward in Telugu.
    rationale: Replacing ‘నీకు—నీకు మాత్రమే—విరోధంగా’ with ‘నీకు మాత్రమే విరోధంగా’ is idiomatic while maintaining the Hebrew exclusivity.
  revised_text: నీకు మాత్రమే విరోధంగా నేను పాపం చేశాను[a]; నీ దృష్టికి చెడైనది చేశాను. నీవు నీ మాటలో నీతిమంతుడవని తేలునట్లు, నీవు తీర్పు తీర్చేటప్పుడు నిర్దోషివని తేలునట్లు చేశాను.[b]
