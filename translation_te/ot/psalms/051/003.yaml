- from: నా దోషం పోయేలా నన్ను పూర్తిగా కడుగు[a][b]; నా పాపం నుండి నన్ను శుద్ధి చేయి[c].
  to: నా దోషం నుండి నన్ను పూర్తిగా కడుగు[a]; నా పాపం నుండి నన్ను శుద్ధి చేయి[c].
  rationale: The revised first clause restores the Hebrew ‘from my iniquity’ construction without sacrificing natural Telugu prayer language. The revised c footnote avoids a possible shift from purification/cleansing to sanctification. Footnote b is retained as a valid lexical note; it is not anchored in the displayed text because it documents the lexical range of ‘దోషం,’ but it should be anchored after ‘దోషం’ if the publication system requires every lexical note to have an in-text marker.
