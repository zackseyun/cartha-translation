  text: Wash me thoroughly from my iniquity[c][b][a], and cleanse me from my sin.
translation:
  language: te
  text: నా దోషం నుండి నన్ను పూర్తిగా కడుగు[a]; నా పాపం నుండి నన్ను శుద్ధి చేయి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నన్ను సమృద్ధిగా కడుగు’ లేదా ‘నన్ను మళ్లీ మళ్లీ కడుగు’; హెబ్రీలోని బలపరిచే పదం సమృద్ధిగా లేదా తీవ్రంగా కడగడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘నా పాపం నుండి నన్ను శుద్ధిపరచు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְבֵּה
  choice: పూర్తిగా
  rationale: ఈ పదం తరువాతి ఆజ్ఞను తీవ్రత లేదా సమృద్ధి భావంతో బలపరుస్తుంది. ‘పూర్తిగా’ అనేది తెలుగులో సహజంగా ఉండి, సంపూర్ణమైన కడుగుదల భావాన్ని తెలియజేస్తుంది; స్పష్టంగా లేని పునరావృత భావాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: כַּבְּסֵנִי
  choice: నన్ను … కడుగు
  rationale: כּבס సాధారణంగా బట్టలను కడగడానికి వాడే క్రియ; ఇక్కడ వ్యక్తిని కడుగుతున్న బలమైన రూపకాన్ని నిలుపుతుంది. ‘నన్ను కడుగు’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: מֵעֲוֺנִי
  choice: నా దోషం పోయేలా
  rationale: עָוֹן దోషకార్యాన్ని, అపరాధస్థితిని లేదా దాని పర్యవసానాన్ని సూచించగలదు. ‘దోషం’ ఈ విస్తృతిని చాలావరకు నిలుపుతుంది; ‘పోయేలా’ అనేది ‘దోషం నుండి నన్ను కడుగు’ అనే తెలుగులో అసహజమైన నిర్మాణాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּמֵחַטָּאתִי
  choice: నా పాపం నుండి
  rationale: חַטָּאתకు ఈ పశ్చాత్తాప సందర్భంలో ‘పాపం’ సూటిగా సరిపోతుంది. ‘దోషం’ మరియు ‘పాపం’ అనే వేర్వేరు పదాలను ఉంచడం హెబ్రీ కవితా సమాంతరతలోని పదభేదాన్ని కాపాడుతుంది.
- source_word: טַהֲרֵנִי
  choice: నన్ను శుద్ధి చేయి
  rationale: טהר శుభ్రం చేయడం లేదా శుద్ధి చేయడం అనే భావాన్ని, నైతిక మరియు ఆచార సంబంధిత ప్రతిధ్వనులతో కలిగి ఉంటుంది. ‘శుద్ధి చేయి’ ఈ రెండింటినీ గౌరవప్రదమైన, సులభంగా అర్థమయ్యే తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: עָוֹן మరియు חַטָּאת అనే రెండు పశ్చాత్తాప పదాల అనువాదం
  choice: ప్రధాన పాఠ్యంలో వాటిని వరుసగా ‘దోషం’, ‘పాపం’ అని వేర్వేరుగా అనువదించడం.
  alternative: రెండింటినీ సాధారణంగా ‘తప్పు’ లేదా ‘పాపం’ అని అనువదించడం; లేదా עָוֹןను ‘అపరాధభారం’గా అనువదించడం.
  rationale: మూలంలో సంబంధితమైనా ఒకేలా కాని రెండు పదాలు కవితా సమాంతరతలో ఉన్నాయి. వాటి భేదాన్ని నిలుపడం మూలపాఠ్యపు అర్థవిస్తృతిని, కవితా నిర్మాణాన్ని కాపాడుతుంది; అదే సమయంలో ‘దోషం’ అనేది కార్యం మరియు దాని అపరాధస్థితి మధ్య ఉన్న నిజమైన అర్థసందిగ్ధతను అతిగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలిని ఉపయోగించాం. ‘నా దోషం నుండి నన్ను కడుగు’ అనే యాంత్రిక నిర్మాణం తెలుగులో అసహజంగా ఉండటంతో ‘నా దోషం పోయేలా నన్ను … కడుగు’ అని చెప్పి, వ్యక్తిని కడిగే మూల రూపకాన్నీ ‘నుండి’ భావాన్నీ నిలిపాం.
