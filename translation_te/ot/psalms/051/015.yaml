source:
  edition: WLC
  text: הַצִּ֘ילֵ֤/נִי מִ/דָּמִ֨ים אֱֽלֹהִ֗ים אֱלֹהֵ֥י תְּשׁוּעָתִ֑/י תְּרַנֵּ֥ן לְ֝שׁוֹנִ֗/י צִדְקָתֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/015.yaml
  text: Deliver me from bloodguilt[a], O God, God of my salvation[b], and my tongue will sing aloud of your righteousness.
translation:
  language: te
  text: 'రక్తపాతపు అపరాధం నుండి నన్ను విడిపించు[a],

    దేవా, నా రక్షణకర్తా;

    నా నాలుక నీ నీతిని[b]

    ఉల్లాసంగా కీర్తిస్తుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రక్తపాతం నుండి’ లేదా ‘రక్తాపరాధం నుండి.’ హీబ్రూలో అక్షరార్థంగా ‘రక్తాల నుండి’; ఇది సాధారణంగా రక్తపాతానికి సంబంధించిన అపరాధాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీ న్యాయాన్ని.’ హీబ్రూ పదం నైతిక నీతి, న్యాయబద్ధత అనే రెండు భావ ఛాయలనూ కలిగి ఉండగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: నన్ను విడిపించు
  rationale: నצל ధాతువు ఇక్కడ ఆజ్ఞార్థక విన్నపం. ప్రమాదం నుంచి కాపాడడం మాత్రమే కాక, దోషబంధం నుంచి విడుదల చేయాలనే భావాన్ని సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: מִדָּמִים
  choice: రక్తపాత దోషం నుండి
  rationale: బహువచన రూపమైన דמים అక్షరార్థంగా ‘రక్తాలు’ అయినా, ఈ పశ్చాత్తాప సందర్భంలో చిందించిన రక్తానికి సంబంధించిన అపరాధం లేదా దోషాన్ని సూచించే హీబ్రూ నుడికారం. ఆధునిక తెలుగులో ‘రక్తపాత దోషం’ ఆ బాధ్యతను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ఇది ప్రత్యక్ష సంబోధన; తెలుగు సంబోధన రూపం కవితా గౌరవాన్ని సహజంగా నిలుపుతుంది.
- source_word: אֱלֹהֵי תְּשׁוּעָתִי
  choice: నన్ను రక్షించే దేవా
  rationale: అక్షరార్థ నిర్మాణం ‘నా రక్షణకు దేవుడు.’ తెలుగులో అసహజమైన నిర్మాణాన్ని తప్పిస్తూ, దేవుడే వక్తకు రక్షణ కలిగించేవాడనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: תְּרַנֵּן
  choice: ఉల్లాసంగా కీర్తిస్తుంది
  rationale: ఈ క్రియ ఆనందంతో బిగ్గరగా పాడడం లేదా జయధ్వని చేయడం అనే భావాన్ని కలిగిస్తుంది. ‘ఉల్లాసంగా కీర్తిస్తుంది’ స్తుతిగాన భావాన్నీ, ఉత్సాహాన్నీ నిలుపుతుంది.
- source_word: לְשׁוֹנִי
  choice: నా నాలుక
  rationale: స్తుతికి సాధనంగా నాలుకను పేర్కొనే మూల కవితా చిత్రాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: צִדְקָתֶךָ
  choice: నీ నీతిని
  rationale: צדקה దేవుని నైతిక యథార్థత, న్యాయబద్ధత, రక్షణలో వ్యక్తమయ్యే సదాచరణ వంటి పరస్పర సంబంధిత భావాలను మోయగలదు. ‘నీతి’ విస్తృతతను నిలుపుతుంది; ‘న్యాయం’ అనే సాధ్యమైన ఛాయను పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: דמים అనే ‘రక్తాలు’ బహువచన నుడికారం అర్థం
  choice: రక్తపాత దోషం
  alternative: రక్తపాతం; రక్తాపరాధం
  rationale: కీర్తనలోని పశ్చాత్తాప సందర్భం కేవలం హింస నుంచి రక్షణను కాక, చిందించిన రక్తానికి సంబంధించిన అపరాధభారాన్ని సూచిస్తుంది. అయినప్పటికీ మూలపదం రక్తపాతాన్నే సూచించగల ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
- issue: צִדְקָתֶךָ లోని నీతి–న్యాయం భావ ఛాయలు
  choice: నీ నీతి
  alternative: నీ న్యాయం; రక్షించే నీతి
  rationale: ప్రధాన పాఠంలో ‘నీతి’ దేవుని నైతిక యథార్థతను, న్యాయబద్ధతను విశాలంగా నిలుపుతుంది. పదాన్ని కేవలం శిక్షాత్మక న్యాయంగా గానీ, కేవలం రక్షణకార్యంగా గానీ పరిమితం చేయకుండా ప్రత్యామ్నాయ ఛాయను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కవితా శైలి. చిన్న పాదాలు హీబ్రూ సమాంతరతను, ప్రార్థన నుంచి స్తుతికి జరిగే గమనాన్ని నిలుపుతాయి. ‘రక్తపాత దోషం’ సాధారణ పాఠకునికి అర్థమయ్యేలా ఉండి మూలంలోని అపరాధ భావాన్ని కోల్పోనివ్వదు.
