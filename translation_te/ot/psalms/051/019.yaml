source:
  edition: WLC
  text: הֵיטִ֣יבָ/ה בִ֭/רְצוֹנְ/ךָ אֶת צִיּ֑וֹן תִּ֝בְנֶ֗ה חוֹמ֥וֹת יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/019.yaml
  text: In your good pleasure[a], do good to Zion[b]; build up the walls of Jerusalem.
translation:
  language: te
  text: నీ అనుగ్రహంతో[a] సీయోనుకు మేలు చేయి; యెరూషలేము ప్రాకారాలను కట్టు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ ప్రసన్నతచొప్పున’ లేదా ‘నీ చిత్తప్రకారం.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, పునరుద్ధరణ భావంలో, ‘తిరిగి కట్టు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיבָה
  choice: మేలు చేయి
  rationale: יטב ధాతువు హిఫిల్ ఆజ్ఞార్థక విన్నపంగా దేవుడు ప్రయోజనకరంగా కార్యం చేయాలని కోరుతుంది. ‘మేలు చేయి’ ప్రార్థనలోని నేరుతనాన్ని నిలుపుతుంది.
- source_word: בִּרְצוֹנְךָ
  choice: నీ అనుగ్రహంతో
  rationale: רָצוֹן అనుగ్రహం, ప్రసన్నత, సంకల్పం అనే భావాలను కలిగి ఉంటుంది. సందర్భంలో దేవుని దయాపూర్వక ప్రసన్నతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: אֶת צִיּוֹן
  choice: సీయోనుకు
  rationale: ప్రత్యక్ష కర్మ సూచికతో ఉన్న సీయోను, చేయబడే మేలుకు లక్ష్యంగా ఉంది. తెలుగులో ‘సీయోనుకు మేలు చేయి’ సహజమైన నిర్మాణం.
- source_word: תִּבְנֶה
  choice: కట్టు
  rationale: Qal అసంపూర్ణ క్రియ ఇక్కడ ముందున్న ఆజ్ఞార్థక విన్నపాన్ని కొనసాగిస్తుంది. ‘కట్టు’ మూలార్థాన్ని కాపాడుతుంది; పునరుద్ధరణ సందర్భంలో ‘తిరిగి కట్టు’ అనే అవకాశాన్ని పాదసూచికలో సూచించాం.
- source_word: חוֹמוֹת
  choice: ప్రాకారాలను
  rationale: నగరాన్ని చుట్టే గోడలను సూచించే బహువచన నామవాచకం. ‘ప్రాకారాలు’ యెరూషలేము నగర రక్షణ గోడలకు సహజమైన, నిర్దిష్టమైన తెలుగు పదం.
- source_word: יְרוּשָׁלִָם
  choice: యెరూషలేము
  rationale: స్థలనామానికి తెలుగులో విస్తృతంగా వాడే ప్రామాణిక రూపం.
theological_decisions:
- issue: దైవ అనుగ్రహం, సంకల్పం మరియు పునరుద్ధరణ మధ్య సంబంధం
  choice: దేవుని అనుగ్రహం సీయోనుకు మేలు చేసి యెరూషలేము ప్రాకారాలు కట్టబడే స్పష్టమైన కార్యంగా ఫలించాలని చేసే ప్రార్థనగా అనువదించాం.
  alternative: ‘నీ చిత్తప్రకారం సీయోనుకు మేలు చేయి’ అనే పూర్తిగా సంకల్పకేంద్రీకృత పఠనం.
  rationale: רָצוֹן అనుగ్రహం లేదా ప్రసన్నతతో పాటు సంకల్పాన్ని కూడా సూచించగలదు. ప్రధాన పాఠం సందర్భంలోని దైవ దయను ముందుకు తెస్తూ, పాదసూచిక ద్వారా సంకల్పార్థాన్ని కూడా తెరిచి ఉంచుతుంది. תִּבְנֶה ‘కట్టు’ లేదా పునరుద్ధరణ భావంలో ‘తిరిగి కట్టు’ కావచ్చు; ప్రధాన పాఠం చారిత్రక నిర్ణయాన్ని బలవంతంగా విధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలి. ‘మేలు చేయి’ మూలంలోని నేరుగా చేసిన విన్నపాన్ని నిలుపుతుంది; ‘ప్రాకారాలు’ నగర గోడల నిర్దిష్ట భావాన్ని అందిస్తుంది. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
