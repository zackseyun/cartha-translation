  text: Do not cast me away from your presence[a], and do not take your Holy Spirit from me.
translation:
  language: te
  text: 'నీ సన్నిధి నుండి నన్ను తోసివేయకు;

    నీ పరిశుద్ధ ఆత్మను నా నుండి తీసివేయకు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ పరిశుద్ధమైన ఆత్మను’; మరింత పదశః, ‘నీ పరిశుద్ధత యొక్క ఆత్మను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשְׁלִיכֵנִי
  choice: నన్ను తోసివేయకు
  rationale: హిఫిల్ రూపంలోని שלך ఒకరిని విసరడం లేదా దూరం చేయడం అనే బలమైన భావాన్ని ఇస్తుంది. ‘తోసివేయకు’ ఆ బలాన్నీ ప్రార్థనలోని సంబంధాత్మక వేదననూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מִלְּפָנֶיךָ
  choice: నీ సన్నిధి నుండి
  rationale: పదశః ‘నీ ముఖము ఎదుట నుండి’; ఈ సందర్భంలో దేవుని సమక్షం మరియు అనుగ్రహ సంబంధాన్ని సూచించే సహజమైన తెలుగు ప్రయోగం ‘నీ సన్నిధి నుండి’.
- source_word: רוּחַ קָדְשְׁךָ
  choice: నీ పరిశుద్ధ ఆత్మను
  rationale: నిర్మాణం పదశః ‘నీ పరిశుద్ధత యొక్క ఆత్మ’ లేదా ‘నీ పరిశుద్ధ ఆత్మ.’ దేవునికి చెందిన ఆత్మను సూచిస్తూ, మూలంలోని భావాన్ని విస్తరించకుండా తెలుగులో స్థిరమైన రూపమైన ‘నీ పరిశుద్ధ ఆత్మ’ను ఉపయోగించాం.
- source_word: תִּקַּח
  choice: తీసివేయకు
  rationale: לקח యొక్క ప్రాథమిక భావం ‘తీసుకొను.’ ‘నా నుండి’తో కలిసి ‘తీసివేయకు’ అనేది మూలంలోని నేరుగా చేసిన విన్నపాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִמֶּנִּי
  choice: నా నుండి
  rationale: మూలంలోని సాధారణ వియోగార్థక ప్రయోగాన్ని నేరుగా, సహజంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: רוּחַ קָדְשְׁךָ అనే పదబంధం వ్యక్తిగత దైవాత్మను సూచిస్తుందా, లేక పదశః ‘నీ పరిశుద్ధత యొక్క ఆత్మ’గా ఇవ్వాలా
  choice: నీ పరిశుద్ధ ఆత్మ
  alternative: నీ పరిశుద్ధమైన ఆత్మ; నీ పరిశుద్ధత యొక్క ఆత్మ
  rationale: సందర్భంలో ఇది దేవునికి చెందిన ఆత్మను సూచిస్తుంది. ‘నీ పరిశుద్ధ ఆత్మ’ సహజమైన, స్థిరమైన తెలుగు రూపం; అయితే హీబ్రూ నిర్మాణంలోని పదశః ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచి అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనా గాంభీర్యాన్ని నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే భాష. రెండు సమాంతర నిషేధ విన్నపాల నిర్మాణాన్ని కాపాడాం.
