review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the emphatic opening, God's desire for truth within the person, and the causative sense of תוֹדִיעֵנִי (“make known to me”). However, “అంతరంగపు లోతుల్లో” adds the specific notion of “depths,” while “మరుగైన చోట” can sound like an external concealed location. The Hebrew poetic parallelism more directly presents two complementary images of the inner/hidden self.
  naturalness: The Telugu is generally clear and appropriately dignified. “మరుగైన అంతరంలో” is more idiomatic in this context and better paired with “అంతరంగంలో” than “మరుగైన చోట.”
  terminology: “సత్యం,” “జ్ఞానం,” and “తెలియజేస్తావు” are suitable modern-standard Telugu choices. “తెలియజేస్తావు” preserves the Hiphil causative nuance without importing a doctrinal interpretation.
  issues:
  - severity: low
    issue: “అంతరంగపు లోతుల్లో” is slightly more specific than the Hebrew image.
    rationale: בַּטֻּחוֹת denotes the inward/hidden parts, but does not explicitly specify “depths.” “అంతరంగంలో” is a closer, natural rendering; the fuller image can be retained as a footnote alternative.
  - severity: medium
    issue: “మరుగైన చోట” may suggest an external hidden place.
    rationale: וּבְסָתֻם is poetically parallel to the inward-parts expression and likely concerns the concealed inner self. “మరుగైన అంతరంలో” preserves both the locative metaphor and the inner parallelism.
  revised_text: 'ఇదిగో, నీవు అంతరంగంలో[a] సత్యాన్ని కోరుతున్నావు;

