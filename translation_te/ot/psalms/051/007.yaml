source:
  edition: WLC
  text: הֵן אֱ֭מֶת חָפַ֣צְתָּ בַ/טֻּח֑וֹת וּ֝/בְ/סָתֻ֗ם חָכְמָ֥ה תוֹדִיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/007.yaml
  text: Behold[a], you desire truth in the inward parts[b], and in the hidden place you make wisdom known to me.
translation:
  language: te
  text: 'ఇదిగో, నీవు అంతరంగంలో[a] సత్యాన్ని కోరుతున్నావు;

    మరుగైన అంతరంలో[b] నాకు జ్ఞానాన్ని తెలియజేస్తావు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అంతరంగపు లోతుల్లో’; హీబ్రూ పదం లోపలి లేదా దాగిన భాగాలను సూచించే కవితాత్మక పదం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దాగిన స్థలంలో’; ఈ పదబంధం దాగిన స్థలాన్ని లేదా వ్యక్తి లోతైన అంతరంగాన్ని సూచించవచ్చు.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: הֵן
  choice: ఇదిగో
  rationale: వాక్యాన్ని బలంగా ముందుకు తెచ్చే హీబ్రూ ఉద్ఘాటనను కీర్తనా శైలికి తగిన సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֱמֶת
  choice: సత్యం
  rationale: ఇక్కడ దేవుని ఎదుట అంతరంగ నిజాయితీ, యథార్థత అనే భావాన్ని మోస్తుంది; ‘నమ్మకత్వం’ అని పరిమితం చేయకుండా మూలంలోని విస్తృత అర్థాన్ని కాపాడుతుంది.
- source_word: חָפַצְתָּ
  choice: కోరుతున్నావు
  rationale: ‘ఇష్టపడు/ఆనందించు’ అనే ఛాయ కూడా ఉన్నప్పటికీ, ఈ సందర్భంలోని దేవుని నైతిక అభిలాషను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַטֻּחוֹת
  choice: అంతరంగపు లోతుల్లో
  rationale: లోపలి లేదా దాగిన భాగాలను సూచించే కవితాత్మక రూపకాన్ని తెలుగులో అర్థమయ్యేలా నిలుపుతుంది; కేవలం శరీర అవయవాల భావం రాకుండా చూస్తుంది.
- source_word: וּבְסָתֻם
  choice: మరుగైన చోట
  rationale: దాచబడిన లేదా అంతర్గత స్థలాన్ని సూచించే మూలంలోని స్థానిక రూపకాన్ని కాపాడి, మొదటి పాదంతో సమాంతరతను నిలుపుతుంది.
- source_word: חָכְמָה
  choice: జ్ఞానం
  rationale: దేవుడు ప్రసాదించే నైతిక, ఆధ్యాత్మిక వివేకాన్ని సూచించే ప్రామాణికమైన తెలుగు పదం.
- source_word: תוֹדִיעֵנִי
  choice: నాకు ... తెలియజేస్తావు
  rationale: ידע క్రియ యొక్క హిఫీల్ రూపంలోని ‘తెలుసుకునేలా చేయు’ అనే కారణార్థాన్ని నేరుగా ప్రతిబింబిస్తుంది; ‘నేర్పిస్తావు’ కంటే మూలరూపానికి దగ్గరగా ఉంటుంది.
theological_decisions:
- issue: దేవుడు కోరే అంతరంగ నైతిక యథార్థత స్వభావం
  choice: వ్యక్తి అంతరంగంలో దేవుడు సత్యాన్ని కోరుతున్నాడనీ, మరుగైన అంతరంలో జ్ఞానాన్ని తెలియజేస్తాడనీ అనువదించడం
  alternative: ‘సత్యం’ను ప్రత్యేకంగా నిబంధనా నమ్మకత్వంగా లేదా మానసిక స్వీయ అవగాహనగా వ్యాఖ్యానించడం
  rationale: హీబ్రూ కవితా సమాంతరత అంతరంగ సత్యాన్నీ, దేవుడు తెలియజేసే జ్ఞానాన్నీ కలిపి చెబుతుంది. తరువాతి సిద్ధాంత వర్గాలను చేర్చకుండా ఆ నైతిక-ఆధ్యాత్మిక ఉద్వేగాన్ని నిలుపుతుంది.
- issue: תוֹדִיעֵנִי యొక్క భావం
  choice: ప్రకటనాత్మకంగా ‘తెలియజేస్తావు’
  alternative: విన్నపంగా ‘తెలియజేయి’ లేదా మరింత స్వేచ్ఛగా ‘నేర్పిస్తావు’
  rationale: మూలంలోని కారణార్థ క్రియారూపాన్ని సూచనార్థక వాక్యంగా తీసుకోవడం వ్యాకరణానికీ, అందించిన సందర్భానికీ సరిపోతుంది; దానిని ఆజ్ఞగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గంభీరమైన కవితా ధోరణి పాటించబడింది. ‘అంతరంగపు లోతుల్లో’ మరియు ‘మరుగైన చోట’ అనే పదబంధాలు హీబ్రూ సమాంతర రూపకాలను నిలుపుతూనే సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి.
