source:
  edition: WLC
  text: הָשִׁ֣יבָ/ה לִּ֭/י שְׂשׂ֣וֹן יִשְׁעֶ֑/ךָ וְ/ר֖וּחַ נְדִיבָ֣ה תִסְמְכֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/013.yaml
  text: Restore to me the joy of your salvation[c][b][a], and let a willing spirit sustain me.
translation:
  language: te
  text: నీ రక్షణానందాన్ని నాకు తిరిగి ప్రసాదించు[c]; సుముఖమైన ఆత్మ నన్ను నిలబెట్టుగాక[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఉదారమైన ఆత్మ’ లేదా ‘ఉన్నతమైన ఆత్మ.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నన్ను ఆధరించుగాక.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘నీ విమోచనానందాన్ని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשִׁיבָה
  choice: తిరిగి ప్రసాదించు
  rationale: హిఫీల్ ఆజ్ఞారూపం ముందున్న స్థితిని మళ్లీ కలిగించమనే ప్రార్థనను సూచిస్తుంది. తెలుగులో ‘తిరిగి ప్రసాదించు’ సహజంగా ఉండి, దేవునికి చేసిన విన్నప స్వరాన్ని నిలుపుతుంది.
- source_word: לִּי
  choice: నాకు
  rationale: ప్రథమ పురుష ఏకవచన ప్రత్యయం పునరుద్ధరణను పొందే వ్యక్తిని సూచిస్తుంది.
- source_word: שְׂשׂוֹן
  choice: ఆనందం
  rationale: ఈ నామవాచకం ఆనందం లేదా సంతోషాన్ని సూచిస్తుంది; ప్రార్థనా సందర్భంలో ‘ఆనందం’ సహజమైన, గంభీరమైన పదం.
- source_word: יִשְׁעֶךָ
  choice: నీ రక్షణ
  rationale: ఈ పదం రక్షణ లేదా విమోచన అనే విస్తృత భావాన్ని కలిగి ఉంది. ‘నీ రక్షణ’ పాపం, శుద్ధీకరణ, పునరుద్ధరణల సందర్భంలోని విస్తృత భావాన్ని సంకుచితం చేయదు.
- source_word: וְרוּחַ
  choice: మనస్సు
  rationale: רוּחַకు ఆత్మ, ఊపిరి, గాలి వంటి అర్థాలున్నా, ఇక్కడ అంతరంగ సిద్ధతను తెలిపే తెలుగు ప్రయోగంగా ‘మనస్సు’ సహజంగా ఉంది. అయినప్పటికీ ఇది దేవుని ఆత్మనా లేక కీర్తనకర్త అంతరంగ స్వభావమా అనే విషయాన్ని పూర్తిగా నిర్ణయించదు.
- source_word: נְדִיבָה
  choice: సిద్ధ
  rationale: ఈ విశేషణానికి సిద్ధమైన, ఉదారమైన, ఔదార్యంగల లేదా ఉన్నతమైన అనే భావాలున్నాయి. ఈ సందర్భంలో స్వచ్ఛందంగా స్పందించే అంతరంగ వైఖరిని ‘సిద్ధ’ స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: תִסְמְכֵנִי
  choice: నన్ను నిలబెట్టుగాక
  rationale: סמך అంటే ఆదరించడం, నిలబెట్టడం, ఆధారమివ్వడం. అసంపూర్ణ క్రియ ఇక్కడ విన్నపార్థకంగా వాడబడింది; ‘నిలబెట్టుగాక’ ఆ ప్రార్థనా భావాన్ని, కొనసాగుతున్న ఆదరణను నిలుపుతుంది.
theological_decisions:
- issue: పశ్చాత్తాప కీర్తనలో ‘నీ రక్షణ’ భావం
  choice: నీ రక్షణ
  alternative: నీ విమోచన
  rationale: హీబ్రూ పదం రక్షణ, విమోచన రెండింటినీ అనుమతిస్తుంది. ‘రక్షణ’ ఈ సందర్భంలోని ఆధ్యాత్మిక, నైతిక, అనుభవాత్మక విస్తృతిని కాపాడుతూ, తరువాతి సిద్ధాంత వివరాలను వచనంలోకి చేర్చదు.
- issue: ‘సిద్ధమనస్సు’ ఎవరి ఆత్మ లేదా స్వభావాన్ని సూచిస్తుంది?
  choice: సిద్ధమనస్సు
  alternative: సిద్ధమైన ఆత్మ
  rationale: హీబ్రూ వాక్యభాగం ఇది దేవుని ఆత్మనా, కీర్తనకర్తలో పునరుద్ధరించబడిన అంతరంగ స్వభావమా అని స్పష్టంగా చెప్పదు. సహజ తెలుగు కోసం ‘మనస్సు’ ఎంచుకున్నప్పటికీ, కర్తను చేర్చకుండా అసలు వాక్యంలోని సందిగ్ధతను సాధ్యమైనంతవరకు నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ప్రార్థనా కవిత్వానికి తగిన గౌరవభరిత స్వరం వాడబడింది. ‘రక్షణానందం’ సంక్షిప్త కవితాత్మక సమాసంగా మూలంలోని నిర్మాణాన్ని ప్రతిబింబిస్తుంది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
