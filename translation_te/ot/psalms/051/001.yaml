translation:
  language: te
  text: అతడు బత్షెబతో లైంగిక సంబంధం పెట్టుకున్న తరువాత[a], నాతాను ప్రవక్త అతని దగ్గరకు వచ్చినప్పుడు.
  philosophy: optimal-equivalence
  footnotes:
