  source_fidelity: హీబ్రూ పాఠంలోని రెండు సమాంతర వాక్యభాగాలు నమ్మకంగా ప్రతిబింబించబడ్డాయి. אֲלַמְּדָה యొక్క సంకల్పాత్మక/భవిష్యత్ భావానికి “నేర్పుతాను” సరైనది. פֹשְׁעִים కు “అతిక్రమించేవారు,” דְּרָכֶיךָ కు “నీ మార్గాలు,” మరియు חַטָּאִים కు “పాపులు” తగిన సమానాలు. యָשׁוּבוּ యొక్క ‘తిరుగు/తిరిగి రా’ అర్థసాధ్యతను ప్రధాన పాఠం మరియు పాదసూచిక కలిసి సరిగా కాపాడుతున్నాయి.
