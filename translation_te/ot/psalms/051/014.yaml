id: PSA.51.14
reference: Psalms 51:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֲלַמְּדָ֣ה פֹשְׁעִ֣ים דְּרָכֶ֑י/ךָ וְ֝/חַטָּאִ֗ים אֵלֶ֥י/ךָ יָשֽׁוּבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/014.yaml
  text: I will teach transgressors your ways[a], and sinners will return to you.
translation:
  language: te
  text: అతిక్రమించేవారికి నీ మార్గాలను నేర్పుతాను; పాపులు నీ వైపు తిరుగుతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ దగ్గరకు తిరిగి వస్తారు.” హీబ్రూ క్రియ ‘తిరగడం,’ ‘తిరిగి రావడం’ అనే రెండు భావాలనూ వ్యక్తం చేయగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲלַמְּדָה
  choice: నేర్పుతాను
  rationale: למד హిఫిల్, ప్రథమ పురుష ఏకవచన అసంపూర్ణ/కోహోర్టేటివ్ రూపం. సందర్భంలో ఇది పునరుద్ధరణ తరువాత కీర్తనకర్త ఉద్దేశాన్ని లేదా సంకల్పాన్ని వ్యక్తం చేస్తుంది; సహజమైన తెలుగులో ‘నేర్పుతాను’ ఆ భావాన్ని అందిస్తుంది.
- source_word: פֹשְׁעִים
  choice: అతిక్రమించేవారికి
  rationale: פשע ఉద్దేశపూర్వకమైన తిరుగుబాటు లేదా అతిక్రమాన్ని సూచిస్తుంది. ‘అతిక్రమించేవారు’ నైతిక భావాన్ని నిలుపుతూ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: דְּרָכֶיךָ
  choice: నీ మార్గాలను
  rationale: דרך బహువచనంలో దేవుని మార్గాలు, ప్రవర్తనా విధానం లేదా ఆయన నిర్దేశాలను సూచించగలదు. ‘నీ మార్గాలు’ మూలంలోని రూపకాన్ని విస్తరించకుండా నిలుపుతుంది.
- source_word: חַטָּאִים
  choice: పాపులు
  rationale: חטאים కు సహజమైన, సంక్షిప్తమైన తెలుగు సమానం; ముందున్న ‘అతిక్రమించేవారు’తో సమాంతరతను కాపాడుతుంది.
- source_word: אֵלֶיךָ
  choice: నీ వైపు
  rationale: ఈ విభక్తిపూర్వక రూపం ‘నీ వద్దకు/నీ వైపు’ అనే దిశను సూచిస్తుంది. ‘నీ వైపు’ అనేది שוב లోని తిరగడం లేదా తిరిగి రావడం అనే రెండు సాధ్య భావాలతో సహజంగా కలుస్తుంది.
- source_word: יָשׁוּבוּ
  choice: తిరుగుతారు
  rationale: שוב ‘తిరుగు’ లేదా ‘తిరిగి రా’ అనే రెండు భావాలను కలిగి ఉండగలదు. ప్రధాన పాఠంలో ‘తిరుగుతారు’ మూలంలోని కదలికను సహజంగా తెలిపి, పూర్వస్థితికి తిరిగి రావడమనే భావాన్ని తప్పనిసరిగా విధించదు; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: שוב లో పశ్చాత్తాపానికి సంబంధించిన భావం
  choice: నీ వైపు తిరుగుతారు
  alternative: నీ దగ్గరకు తిరిగి వస్తారు
  rationale: హీబ్రూ క్రియ దేవుని వైపు తిరగడాన్ని గానీ, ఆయన దగ్గరకు తిరిగి రావడాన్ని గానీ సూచించగలదు. ప్రధాన పాఠం ఈ అస్పష్టతను అతి సంకుచితం చేయకుండా ఉంచుతుంది; పాదసూచిక సంబంధపూర్వకమైన ‘తిరిగి రావడం’ భావాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ కవితలోని రెండు సమాంతర భాగాలు, ‘మార్గాలు’ అనే రూపకం, שוב లోని నిజమైన అర్థసందిగ్ధత కాపాడబడ్డాయి.
