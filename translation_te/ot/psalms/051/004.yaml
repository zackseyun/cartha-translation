id: PSA.51.4
reference: Psalms 51:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי פְ֭שָׁעַ/י אֲנִ֣י אֵדָ֑ע וְ/חַטָּאתִ֖/י נֶגְדִּ֣/י תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/004.yaml
  text: For I know my transgressions, and my sin is always before me.
translation:
  language: te
  text: ఎందుకంటే నా అతిక్రమాలు నాకు తెలుసు; నా పాపం ఎల్లప్పుడూ నా ఎదుటే ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ప్రార్థనకు కారణాన్ని లేదా వివరణను పరిచయం చేస్తుంది; తెలుగు వాక్యప్రవాహంలో ఈ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: פְשָׁעַי
  choice: నా అతిక్రమాలు
  rationale: దేవునికి విరోధంగా చేసిన తిరుగుబాటు స్వభావమున్న తప్పులను సూచిస్తుంది; బహువచనాన్ని నిలుపుతూ గంభీరమైన నైతిక భావాన్ని అందిస్తుంది.
- source_word: אֲנִי אֵדָע
  choice: నాకు తెలుసు
  rationale: తన అపరాధాల గురించి వ్యక్తిగతమైన, స్పష్టమైన ఎరుకను వ్యక్తం చేస్తుంది. తెలుగులో ఈ నిర్మాణం సహజమైనది; హెబ్రీలోని స్పష్ట సర్వనామం ఇచ్చే వ్యక్తిగత దృష్టి సందర్భంలో నిలుస్తుంది.
- source_word: וְחַטָּאתִי
  choice: నా పాపం
  rationale: ఇక్కడ חטאת పాపబలిని కాక పాపాన్ని సూచిస్తుంది. మూలంలోని ఏకవచనాన్ని నిలిపి, అతిక్రమాలు అనే పదంతో ఉన్న పదభేదాన్ని కాపాడుతుంది.
- source_word: נֶגְדִּי
  choice: నా ఎదుటే
  rationale: కళ్లముందు లేదా సన్నిధిలో నిలిచి ఉన్నదనే రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ‘ఏ’ నిరంతర మానసిక సాన్నిధ్యాన్ని బలపరుస్తుంది.
- source_word: תָמִיד
  choice: ఎల్లప్పుడూ
  rationale: నిరంతరంగా కొనసాగుతున్న స్థితిని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘అతిక్రమాలు’ మరియు ‘పాపం’ మధ్య సంబంధం
  choice: రెండు వేర్వేరు పదాలను, వాటి సంఖ్యాభేదంతో సహా, నిలుపడం
  alternative: రెండింటినీ ‘పాపాలు’ అనే ఒకే పదంతో అనువదించడం
  rationale: హెబ్రీ పాఠం తిరుగుబాటు స్వభావమున్న అతిక్రమాలను సూచించే פשע పదాన్నీ, పాపాన్ని సూచించే חטאת పదాన్నీ వేరుగా ఉపయోగిస్తుంది. ఈ భేదాన్ని నిలపడం ఒప్పుకోలు యొక్క కవితాత్మక, నైతిక గాఢతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయినా కీర్తనలోని గంభీరమైన ఒప్పుకోలు ధోరణిని నిలుపుతూ అనువదించబడింది.
