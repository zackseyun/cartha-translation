  text: Behold[a], in iniquity I was brought forth[c][b], and in sin my mother conceived me.
translation:
  language: te
  text: ఇదిగో[a], దోషంలోనే నేను జన్మించాను[b][c]; పాపంలోనే నా తల్లి నన్ను గర్భం ధరించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నిశ్చయంగా,’ ‘నిజంగా.’
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, ‘నేను ప్రసవింపబడ్డాను.’
    reason: lexical_alternative
  - marker: c
    text: ఈ వాక్యాన్ని గర్భధారణ నుంచే ఉన్న పాపస్థితిని ఒప్పుకోవడంగా లేదా పశ్చాత్తాప సందర్భంలోని కవితాత్మక అతిశయోక్తిగా అర్థం చేసుకుంటారు. హెబ్రీ పాఠం ఈ వివాదాన్ని పూర్తిగా పరిష్కరించదు.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  choice: ఇదిగో
  rationale: ఈ అవ్యయం బలమైన ఉద్ఘాటనను పరిచయం చేస్తుంది. ‘ఇదిగో’ దాని గంభీరమైన, దృష్టిని ఆకర్షించే స్వరాన్ని సహజమైన తెలుగు కవితా శైలిలో నిలుపుతుంది.
- source_word: בְּעָוֹן
  choice: దోషంలోనే
  rationale: עָוֹן అనే పదం దోషం, అక్రమం, అపరాధభారం వంటి భావాలను కలిగి ఉంటుంది. ‘దోషంలోనే’ మూలంలోని בְּ ఉపసర్గను, ఉద్ఘాటనను, నైతిక భారాన్ని నిలుపుతూ ఏ ఒక్క సిద్ధాంతార్థానికీ పరిమితం చేయదు.
- source_word: חוֹלָלְתִּי
  choice: నేను జన్మించాను
  rationale: ఈ రూపం ప్రసవింపబడడం లేదా పుట్టడం అనే భావాన్ని ఇస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘నేను జన్మించాను’ జనన చిత్రాన్ని స్పష్టంగా తెలియజేస్తుంది; కర్తరి రూపంలో అతిగా వ్యాఖ్యానించే అనువాదాన్ని నివారిస్తుంది.
- source_word: וּבְחֵטְא
  choice: పాపంలోనే
  rationale: חֵטְא సాధారణంగా ‘పాపం’ అని అర్థం. ‘పాపంలోనే’ మొదటి పాదంలోని ‘దోషంలోనే’తో ఉన్న కవితా సమాంతరతను, మూలంలోని ఉపసర్గను కాపాడుతుంది.
- source_word: יֶחֱמַתְנִי
  choice: నన్ను గర్భం దాల్చింది
  rationale: ఈ సందర్భంలో క్రియకు ‘గర్భం ధరించడం/గర్భం దాల్చడం’ అనే అర్థం సరిపోతుంది. ఇది ముందు పాదంలోని జనన భావంతో సహజంగా సమాంతరమవుతుంది.
- source_word: אִמִּי
  choice: నా తల్లి
  rationale: మూలంలోని ఏకవచన స్వామ్య నామవాచకానికి నేరమైన, సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: ఈ వాక్యం తల్లి చేసిన వ్యక్తిగత పాపాన్ని సూచిస్తుందా, కవి గర్భధారణనుంచే పాపస్థితిలో ఉన్నాడని బోధిస్తుందా, లేక పశ్చాత్తాపంలోని కవితాత్మక అతిశయోక్తా?
  choice: కవి తన గర్భధారణను, జననాన్ని పాపం మరియు దోషంతో సంబంధపెట్టి చెప్పినట్లుగా హెబ్రీ పాఠాన్ని నేరుగా అనువదించడం; ఆ సంబంధాన్ని సిద్ధాంతపరంగా నిర్వచించకపోవడం.
  alternative: ఇది తల్లి చేసిన పాపకార్యాన్ని ప్రధానంగా సూచిస్తుంది; లేదా కవి గర్భధారణనుంచే సహజ పాపత్వంతో ఉన్నాడని స్పష్టంగా బోధిస్తుంది; లేదా ఇది సిద్ధాంత ప్రకటన కాని పశ్చాత్తాప అతిశయోక్తి మాత్రమే.
  rationale: హెబ్రీ పాఠం గర్భధారణను, జననాన్ని עָוֹן మరియు חֵטְאతో అనుసంధానిస్తుంది; అయితే ఆ అనుసంధానం ఎలా అర్థం చేసుకోవాలో లేదా ఏ సిద్ధాంత వ్యవస్థలో పెట్టాలో స్పష్టంగా నిర్ణయించదు. అందువల్ల అనువాదం ఆ ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని ఉపయోగించాం. ‘దోషంలోనే / పాపంలోనే’ అనే సమాంతర నిర్మాణం హెబ్రీ కవిత్వాన్ని ప్రతిబింబిస్తుంది. సాధారణ పాఠకులకు సహజంగా ఉండేందుకు ‘జన్మించాను,’ ‘గర్భం దాల్చింది’ అనే ప్రస్తుత వాడుక రూపాలను ఎంచుకున్నాం.
