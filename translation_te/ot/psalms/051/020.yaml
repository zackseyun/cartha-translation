source:
  edition: WLC
  text: אָ֤ז תַּחְפֹּ֣ץ זִבְחֵי צֶ֭דֶק עוֹלָ֣ה וְ/כָלִ֑יל אָ֤ז יַעֲל֖וּ עַל מִזְבַּחֲ/ךָ֣ פָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/020.yaml
  text: Then you will delight in righteous sacrifices[a], in burnt offerings and whole burnt offerings[c][b]; then bulls will be offered on your altar.
translation:
  language: te
  text: అప్పుడు నీవు నీతియుక్తమైన బలులలో[a], దహనబలిలోను సంపూర్ణబలిలోను[b][c] ఆనందిస్తావు; అప్పుడు నీ బలిపీఠంపై ఎద్దులను అర్పిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీతి యొక్క బలులు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దహనబలిలోను సంపూర్ణ దహనబలిలోను.” హీబ్రూలో ఇక్కడ ‘దహనబలి’ మరియు ‘సంపూర్ణబలి’ అనే పదాలు ఉన్నాయి.
    reason: lexical_alternative
  - marker: c
    text: ఈ రెండు హీబ్రూ పదాలను ఒకే బలిని నొక్కిచెప్పే జంటగా తీసుకొని, “సంపూర్ణ దహనబలి” అని కూడా అనువదించవచ్చు.
    reason: source_ambiguity
lexical_decisions:
- source_word: תַּחְפֹּץ
  choice: ఆనందిస్తావు
  rationale: חפץ ఇక్కడ కేవలం కోరుకోవడం కాక, ఆమోదంతో సంతోషించడం లేదా ఆనందించడం అనే భావాన్ని ఇస్తుంది.
- source_word: זִבְחֵי צֶדֶק
  choice: నీతియుక్తమైన బలులు
  rationale: ఈ నిర్మాణానికి అక్షరార్థంగా ‘నీతి యొక్క బలులు’ అని అర్థం రావచ్చు. ప్రధాన పాఠంలోని రూపం బలులు దేవునికి తగిన నీతితో అర్పించబడుతున్నాయనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; నిర్మాణంలోని ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: עוֹלָה
  choice: దహనబలులు
  rationale: బలిపీఠం మీద పూర్తిగా కాల్చే ప్రామాణిక బలి పదానికి ‘దహనబలి’ స్పష్టమైన, సుపరిచితమైన తెలుగు సమానం.
- source_word: וְכָלִיל
  choice: సంపూర్ణంగా దహనం చేసే బలులు
  rationale: כָלִיל బలి సంపూర్ణంగా అర్పించబడటాన్ని నొక్కి చెబుతుంది. עוֹלָהతో ఉన్న పదభేదాన్ని ప్రధాన పాఠంలో నిలిపి, రెండింటి సంబంధంపై ఉన్న సందిగ్ధతను పాదసూచికల్లో చూపింది.
- source_word: יַעֲלוּ
  choice: అర్పిస్తారు
  rationale: עלה హిఫీల్ రూపం బలి సందర్భంలో బలిపీఠం మీద బలిని ఎక్కించి అర్పించడాన్ని సూచిస్తుంది. తెలుగులో ‘అర్పిస్తారు’ సహజంగా ఉండి ఆ ఆచార భావాన్ని కాపాడుతుంది.
- source_word: מִזְבַּחֲךָ
  choice: నీ బలిపీఠం మీద
  rationale: దేవునితో ప్రత్యక్ష సంబోధనను, బలి అర్పించే స్థలాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: פָרִים
  choice: ఎద్దులు
  rationale: פָרִים బలికి ఉపయోగించే మగ పశువులను సూచిస్తుంది; ‘ఎద్దులు’ ప్రత్యక్షమైన ఆధునిక తెలుగు పదం.
- source_word: אָז ... אָז
  choice: అప్పుడు ... అప్పుడు
  rationale: హీబ్రూ పునరుక్తి క్రమాన్ని, పునరుద్ధరణ ఫలితంగా ఆమోదయోగ్యమైన ఆరాధన జరుగుతుందనే సంబంధాన్ని సూచిస్తుంది; అందువల్ల రెండు సందర్భాలనూ నిలిపాం.
theological_decisions:
- issue: పశ్చాత్తాప హృదయాన్ని నొక్కిచెప్పిన తరువాత బలుల ఆమోదం
  choice: ఈ వాక్యం నిజమైన పశ్చాత్తాపం, పునరుద్ధరణ తరువాత దేవుడు ఆమోదించే వాస్తవ బలుల ఆరాధనను చెబుతున్నట్లుగా అనువదించబడింది.
  alternative: ఇది ఆలయ బలులను మాత్రమే నొక్కిచెప్పే తరువాతి చేర్పు అని, లేదా బలులు పూర్తిగా అంతరంగ నీతికి రూపకమని అర్థం చేసుకోవచ్చు.
  rationale: మూలపాఠం బలి సంబంధమైన స్పష్టమైన పదాలను వాడుతుంది. ముందటి వచనాలతో ఉన్న ఉద్రిక్తతను తొలగించకుండా, బలులను రూపకాలుగా మార్చకుండా వాటి స్పష్టమైన అర్థాన్ని నిలిపాం.
- issue: עוֹלָה וְכָלִיל మధ్య సంబంధం
  choice: ‘దహనబలులు’ మరియు ‘సంపూర్ణంగా దహనం చేసే బలులు’ అని రెండు పదాలనూ విడిగా ప్రతిబింబించాం.
  alternative: ఈ రెండు పదాలను సమానార్థకంగా లేదా ఒకే ‘సంపూర్ణ దహనబలి’ని నొక్కిచెప్పే జంటగా చదవవచ్చు.
  rationale: וְ అనే సంధిని ‘మరియు’గా ప్రతిబింబించడం మూలంలోని పదభేదాన్ని కాపాడుతుంది; అవి ఒకే బలిని వివరించే అవకాశం పాదసూచికలో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘బలిపీఠం,’ ‘దహనబలి’ వంటి స్థిరమైన ఆరాధనా పదాలను నిలిపి, అరుదైన ‘సర్వాంగహోమం’ వంటి పదాలను నివారించాం. హీబ్రూ పునరుక్తి మరియు బలి పదాల మధ్య ఉన్న నిజమైన సందిగ్ధతను పాఠం, పాదసూచికల ద్వారా కాపాడాం.
