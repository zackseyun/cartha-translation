- from: అప్పుడు నీవు నీతియుక్తమైన బలులలో[a], దహనబలులలోనూ సంపూర్ణంగా దహనం చేసే బలులలోనూ[b][c] ఆనందిస్తావు; అప్పుడు నీ బలిపీఠం మీద ఎద్దులను అర్పిస్తారు.
