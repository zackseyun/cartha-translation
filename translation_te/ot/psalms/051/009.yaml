source:
  edition: WLC
  text: תַּ֭שְׁמִיעֵ/נִי שָׂשׂ֣וֹן וְ/שִׂמְחָ֑ה תָּ֝גֵ֗לְנָה עֲצָמ֥וֹת דִּכִּֽיתָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/009.yaml
  text: Let me hear joy and gladness[c][b][a]; let the bones you have crushed rejoice.
translation:
  language: te
  text: ఆనందాన్నీ సంతోషాన్నీ నాకు వినిపించు[a]; నీవు నలిపిన[c] ఎముకలు[b] ఉల్లసించుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆనందాన్నీ సంతోషాన్నీ నేను వినేలా చేయి.’
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో ‘ఎముకలు’; సందర్భం ప్రకారం ఇవి కీర్తనకర్త సొంత ఎముకలు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘నీవు విరగగొట్టిన.’
    reason: alternative_reading
lexical_decisions:
- source_word: תַּשְׁמִיעֵנִי
  choice: నాకు వినిపించు
  rationale: שׁמע ధాతువు హిఫిల్ రూపంలో ఉండి, మొదటి పురుష ఏకవచన ప్రత్యయంతో ‘నాకు వినిపించు’ అనే కారణార్థాన్ని ఇస్తుంది. ప్రార్థనలోని విజ్ఞాపన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שָׂשׂוֹן
  choice: ఆనందం
  rationale: ఉల్లాసభరితమైన ఆనందాన్ని సూచిస్తుంది. తరువాతి సమానార్థక పదంతో ఉన్న కవితాత్మక జంటను నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: וְשִׂמְחָה
  choice: సంతోషం
  rationale: సంతోషం లేదా సంతోషిస్తూ ఉండడాన్ని సూచిస్తుంది. ముందున్న ‘ఆనందం’ అనే పదాన్ని పునరావృతం చేయకుండా హెబ్రీ కవితాత్మక సమాంతరతను కాపాడుతుంది.
- source_word: תָּגֵלְנָה
  choice: ఉల్లసించుగాక
  rationale: గీల్ ధాతువు యొక్క మూడవ పురుష స్త్రీలింగ బహువచన అసంపూర్ణ రూపం; ఈ ప్రార్థనా సందర్భంలో ఆకాంక్షార్థక భావం కలిగి ఉంది. ‘ఉల్లసించుగాక’ ఆ భావాన్నీ ‘ఎముకలు’తో ఉన్న వ్యాకరణ సంబంధాన్నీ తెలియజేస్తుంది.
- source_word: עֲצָמוֹת
  choice: ఎముకలు
  rationale: మూలంలో ‘నా’ అనే ప్రత్యయం లేకుండా కేవలం ‘ఎముకలు’ అని ఉంది. సందర్భంలో అవి కీర్తనకర్త ఎముకలని అర్థమైనప్పటికీ ప్రధాన పాఠం హెబ్రీ రూపాన్ని యథాతథంగా కాపాడుతుంది.
- source_word: דִּכִּיתָ
  choice: నీవు నలిపిన
  rationale: דכה ధాతువు నలిపివేయడం లేదా కృంగదీయడం అనే బలమైన భావాన్ని ఇస్తుంది. రెండవ పురుష ఏకవచన సంపూర్ణ రూపం దేవుణ్ణి నేరుగా సంబోధిస్తూ కార్యాన్ని ఆయనకే ఆపాదిస్తుంది.
theological_decisions:
- issue: బాధకు దేవుని కార్యసాధకత్వాన్ని నేరుగా ఆపాదించడం
  choice: ‘నీవు నలిపిన ఎముకలు’ అని ప్రత్యక్ష సంబోధనను నిలుపడం
  alternative: ‘నలిగిన ఎముకలు’ లేదా ‘నీవు విరగగొట్టిన ఎముకలు’
  rationale: హెబ్రీలోని రెండవ పురుష ఏకవచన సంపూర్ణ క్రియ నలిపిన కార్యాన్ని దేవునికే నేరుగా ఆపాదిస్తుంది. ఈ దైవశాస్త్రీయ ఉద్రిక్తతను కర్మణి రూపంతో మృదువుచేయకుండా అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనా కవిత్వానికి తగిన గౌరవప్రదమైన శైలి. ‘ఉల్లసించుగాక’ ఆకాంక్షార్థక కవితా స్వరాన్ని నిలుపుతుంది; మిగిలిన పదజాలం సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
