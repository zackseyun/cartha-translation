lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకునికి
  rationale: కీర్తనల శీర్షికల్లో ఈ పదం సంగీత ప్రదర్శనను నడిపించే లేదా పర్యవేక్షించే వ్యక్తిని సూచిస్తుంది. ‘సంగీత నాయకుడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, గాయకబృందానికి మాత్రమే అర్థాన్ని పరిమితం చేయదు. ל ఉపసర్గను ‘-కి’తో ప్రతిబింబించాం; సందర్భానుసారం ‘కోసం’ అనే భావం కూడా సాధ్యమే.
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: ఇది సంగీత సహవాద్యంతో పాడే రచనకు వాడే ప్రామాణిక ప్రక్రియా పదం. తెలుగు బైబిల్ భాషలో ‘కీర్తన’ సహజమైన, స్థిరపడిన సమానార్థకం.
- source_word: לְדָוִד
  choice: దావీదు కీర్తన
  rationale: తెలుగులో సహజమైన శీర్షికా రూపాన్ని ఎంచుకున్నాం. అయితే హెబ్రీ לְ ఉపసర్గ రచయితృత్వం, సంబంధం, అంకితం లేదా స్వామ్యాన్ని సూచించగలదు; అందువల్ల ప్రధాన పాఠం ఏ ఒక్క సంబంధాన్నీ ఖచ్చితంగా నిర్ణయించకుండా, పాదటిప్పణిలో అస్పష్టతను స్పష్టం చేస్తుంది.
theological_decisions:
- issue: దావీదుతో ఈ కీర్తనకు ఉన్న సంబంధం
  choice: దావీదు కీర్తన
  alternative: దావీదు రచించిన కీర్తన; దావీదు కోసం కీర్తన; దావీదుకు చెందిన కీర్తన
  rationale: హెబ్రీ శీర్షిక రచయితృత్వాన్ని మాత్రమే తప్పనిసరిగా నిర్దేశించదు. సహజమైన తెలుగు ప్రధాన పాఠాన్ని ఉంచుతూ, సాధ్యమైన సంబంధాలను పాదటిప్పణిలో తెలిపి మూలంలోని నిజమైన అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన కీర్తన శీర్షికా శైలిని వాడాం. భాష గంభీరంగా, సాధారణ పాఠకులకు సులభంగా ఉంది; మూలంలోని ל ఉపసర్గల అర్థవ్యాప్తిని పాదటిప్పణుల్లో నిలిపాం.
