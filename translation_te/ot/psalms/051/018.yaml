id: PSA.51.18
reference: Psalms 51:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: זִֽבְחֵ֣י אֱלֹהִים֮ ר֪וּחַ נִשְׁבָּ֫רָ֥ה לֵב נִשְׁבָּ֥ר וְ/נִדְכֶּ֑ה אֱ֝לֹהִ֗ים לֹ֣א תִבְזֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/018.yaml
  text: The sacrifices of God are a broken spirit[a]; a broken and crushed heart, O God[b], you will not despise.
translation:
  language: te
  text: దేవుని బలులు విరిగిన ఆత్మ[a]; విరిగిన, నలిగిన[b] హృదయాన్ని, దేవా, నీవు తృణీకరించవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పశ్చాత్తాపంతో అణకువగల ఆత్మ.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘విరిగిన, పశ్చాత్తాపంతో అణకువగల హృదయం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: זִבְחֵי אֱלֹהִים
  choice: దేవుని బలులు
  rationale: హీబ్రూ సమాసబంధాన్ని నేరుగా నిలుపుతుంది. సందర్భంలో ఇవి దేవుడు కోరే లేదా అంగీకరించే బలులు అనే భావం ఉన్నప్పటికీ, దానిని ప్రధాన పాఠ్యంలో వివరణాత్మకంగా విస్తరించలేదు.
- source_word: רוּחַ נִשְׁבָּרָה
  choice: విరిగిన ఆత్మ
  rationale: רוּחַకు ‘ఆత్మ’, שבר నిఫాల్ రూపానికి ‘విరిగిన’ అనే ప్రత్యక్ష సమానార్థకాలు సరిపోతాయి; హీబ్రూలోని స్పష్టమైన రూపకాన్ని నిలుపుతాయి.
- source_word: לֵב נִשְׁבָּר
  choice: విరిగిన హృదయం
  rationale: లֵבను ‘హృదయం’గా, నִשְׁבָּרను ‘విరిగిన’గా సహజంగా, నేరుగా అనువదించింది.
- source_word: וְנִדְכֶּה
  choice: నలిగిన
  rationale: דכה మూలంలోని నలిపివేయబడిన లేదా అణచివేయబడిన భావాన్ని ‘నలిగిన’ సహజంగా వ్యక్తం చేస్తుంది; ‘పశ్చాత్తాపంతో అణకువగల’ అనేది సందర్భోచితమైనా మరింత వ్యాఖ్యానాత్మకం.
- source_word: לֹא תִבְזֶה
  choice: తృణీకరించవు
  rationale: בזהలోని హీనంగా చూడటం, తిరస్కారభావంతో చూడటం అనే అర్థాన్ని ‘తృణీకరించు’ ఖచ్చితంగా తెలియజేస్తుంది; ప్రార్థనా సందర్భానికి తగిన గౌరవప్రదమైన పదం.
- source_word: אֱלֹהִים
  choice: దేవుడు / దేవా
  rationale: సమాసంలో ‘దేవుని’గా, ప్రత్యక్ష సంబోధనలో సహజమైన ‘దేవా’గా అనువదించింది.
theological_decisions:
- issue: పశ్చాత్తాప సందర్భంలో బలి అనే రూపకం
  choice: విరిగిన ఆత్మను దేవుని బలులుగా పేర్కొనే హీబ్రూ రూపకాన్ని యథాతథంగా నిలిపింది.
  alternative: ‘దేవుడు అంగీకరించే బలి పశ్చాత్తాప హృదయమే’ అని వివరణాత్మకంగా అనువదించడం.
  rationale: వచనం అంతరంగ విరుగుదలను బలితో సమానంగా ఉంచుతుంది; అయితే బాహ్య బలుల వ్యవస్థను పూర్తిగా రద్దు చేస్తుందని గానీ, ఇది కేవలం భావోద్వేగ దుఃఖమేనని గానీ అనువాదం నిర్ణయించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ప్రార్థనా శైలి. ‘విరిగిన’, ‘నలిగిన’ అనే దృశ్యరూపకాలను నిలిపి, వ్యాఖ్యానాత్మక పదాలను పాదసూచికలకు పరిమితం చేసింది.
