id: PSA.51.11
reference: Psalms 51:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֵ֣ב טָ֭הוֹר בְּרָא לִ֣/י אֱלֹהִ֑ים וְ/ר֥וּחַ נָ֝כ֗וֹן חַדֵּ֥שׁ בְּ/קִרְבִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/011.yaml
  text: Create in me a clean heart[a], O God[b], and renew a steadfast spirit within me.
translation:
  language: te
  text: 'దేవా, నాలో శుద్ధమైన హృదయాన్ని[a] సృష్టించు;

    నా అంతరంగంలో స్థిరమైన ఆత్మను[b] నూతనపరచు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పవిత్రమైన హృదయాన్ని.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘సరియైన ఆత్మను’ లేదా ‘దృఢమైన ఆత్మను’; హీబ్రూ పదానికి స్థిరంగా లేదా స్థాపించబడి ఉండటం అనే భావం కూడా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: לֵב טָהוֹר
  choice: శుద్ధమైన హృదయం
  rationale: לֵב వ్యక్తి ఆలోచనలు, సంకల్పం, భావోద్వేగాలు కలిసిన అంతరంగ కేంద్రాన్ని సూచిస్తుంది; ‘హృదయం’ ఆ విస్తృతిని సహజంగా నిలుపుతుంది. טָהוֹרకు ‘శుద్ధమైన’ అనేది పాపశుద్ధి సందర్భాన్నీ నైతిక-ఆచార సంబంధ ప్రతిధ్వనినీ అందిస్తుంది.
- source_word: בְּרָא
  choice: సృష్టించు
  rationale: ఈ క్రియ దేవుని సృజనాత్మక కార్యంతో బలంగా ముడిపడి ఉంది. ‘సృష్టించు’ అంతరంగంలో దేవుడు చేయవలసిన మూలమైన మార్పును వ్యక్తపరుస్తుంది.
- source_word: לִי
  choice: నాలో
  rationale: అక్షరార్థంగా ‘నాకు/నా కోసం’ అయినా, హృదయ సృష్టి అనే సందర్భంలో అంతరంగ మార్పును తెలుగులో సహజంగా తెలిపేది ‘నాలో’.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ఇది ప్రార్థనలో ప్రత్యక్ష సంబోధన; తెలుగు సంబోధన రూపం ‘దేవా’ కవితాత్మకంగానూ సహజంగానూ ఉంది.
- source_word: רוּחַ נָכוֹן
  choice: స్థిరమైన ఆత్మ
  rationale: רוּחַ యొక్క విస్తృత భావాన్ని ‘ఆత్మ’ నిలుపుతుంది. נָכוֹן ఇక్కడ స్థాపించబడిన, దృఢమైన, నిలకడగల స్వభావాన్ని సూచిస్తున్నందున ‘స్థిరమైన’ అనేది ప్రధాన భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: חַדֵּשׁ
  choice: నూతనపరచు
  rationale: ఈ ఆజ్ఞారూపం అంతరంగ పునరుద్ధరణను, కొత్త బలాన్ని ప్రసాదించడాన్ని కోరుతుంది; ‘నూతనపరచు’ దానిని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: בְּקִרְבִּי
  choice: నా అంతరంగంలో
  rationale: ఈ పదబంధం వ్యక్తి లోపలి ఉనికిని సూచిస్తుంది; ‘నా అంతరంగంలో’ ఆధునిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉంది.
theological_decisions:
- issue: רוּחַ נָכוֹןలో נָכוֹן యొక్క భావం
  choice: స్థిరమైన ఆత్మ
  alternative: సరియైన ఆత్మ; దృఢమైన ఆత్మ
  rationale: హీబ్రూ పదం కేవలం నైతికంగా ‘సరియైనది’ అనే భావం కన్నా స్థిరత్వం, దృఢత్వం, స్థాపిత స్థితిని ప్రధానంగా సూచిస్తుంది. ‘స్థిరమైన’ అనేది నిరంతర అంతరంగ విశ్వాసనీయతను తెలుపుతూ అతివ్యాఖ్యానాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ప్రార్థనా కవిత్వానికి తగిన గౌరవప్రదమైన, నేరుగా అర్థమయ్యే శైలి ఉపయోగించబడింది. హీబ్రూ సమాంతర నిర్మాణాన్ని రెండు పాదాలుగా నిలిపి, ‘హృదయం/ఆత్మ’ అనే చిత్రభాషను వ్యాఖ్యానాత్మక పదాలతో భర్తీ చేయలేదు.
