source:
  edition: WLC
  text: אֲ֭דֹנָ/י שְׂפָתַ֣/י תִּפְתָּ֑ח וּ֝/פִ֗/י יַגִּ֥יד תְּהִלָּתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/016.yaml
  text: Lord, open my lips, and my mouth will declare your praise.
translation:
  language: te
  text: ప్రభువా, నా పెదవులను తెరువు; నా నోరు నీ స్తుతిని ప్రకటిస్తుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי
  choice: ప్రభువా
  rationale: దేవుని నేరుగా సంబోధించే గౌరవసూచక బిరుదు. సంబోధనార్థకమైన ‘ప్రభువా’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంది; మూలంలో లేని ‘నా’ను చేర్చదు.
- source_word: שְׂפָתַי
  choice: నా పెదవులు
  rationale: ప్రథమ పురుష ఏకవచన ప్రత్యయంతో ఉన్న బహువచన శరీరావయవ పదాన్ని స్పష్టంగా అనువదించి, మాట పలకడానికి దేవుడు సామర్థ్యమివ్వాలనే సజీవ రూపకాన్ని నిలుపుతుంది.
- source_word: תִּפְתָּח
  choice: తెరువు
  rationale: פתח అనే క్రియ యొక్క ఖల్ అసంపూర్ణ రూపం ప్రార్థనా సందర్భంలో విజ్ఞాపన భావాన్ని కలిగి ఉంది. తెలుగు ఏకవచన ఆజ్ఞార్థక రూపం ‘తెరువు’ ఆ వినతిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּפִי
  choice: నా నోరు
  rationale: సంధాయకంతో కూడిన ‘నోరు’ అనే నామవాచకం, ప్రథమ పురుష ఏకవచన ప్రత్యయంతో ఉంది. సెమికోలన్ ద్వారా రెండు భాగాల సంబంధం నిలిచినందున తెలుగులో అదనపు ‘మరియు’ అవసరం లేదు.
- source_word: יַגִּיד
  choice: ప్రకటిస్తుంది
  rationale: נגד అనే క్రియ యొక్క హిఫిల్ అసంపూర్ణ రూపం ‘తెలియజేయు/ప్రకటించు’ అనే భావాన్ని ఇస్తుంది. ముందున్న విజ్ఞాపన ఫలితంగా జరిగే కార్యాన్ని ‘ప్రకటిస్తుంది’ సహజంగా తెలియజేస్తుంది.
- source_word: תְּהִלָּתֶךָ
  choice: నీ స్తుతిని
  rationale: ద్వితీయ పురుష ఏకవచన ప్రత్యయంతో ఉన్న ‘స్తుతి’ అనే నామవాచకం. ప్రకటించే విషయాన్ని తెలుగులో కర్మవిభక్తితో ‘నీ స్తుతిని’ అని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవిక బిరుదును ప్రత్యక్ష సంబోధనలో అనువదించడం
  choice: ప్రభువా
  alternative: నా ప్రభువా
  rationale: אֲדֹנָי ఇక్కడ దేవునికి ఉపయోగించిన గౌరవసూచక బిరుదు. మూలంలోని రూపం చారిత్రకంగా మొదటి పురుష సంబంధాన్ని కలిగి ఉన్నప్పటికీ, దైవిక బిరుదుగా స్థిరపడిన వాడుకలో ‘ప్రభువా’ సరైనది; ‘నా ప్రభువా’ అని విస్తరించడం సందర్భంలో అవసరం లేని వ్యక్తిగత స్వామ్య భావాన్ని ముందుకు తెచ్చే అవకాశం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, ప్రార్థనకు తగిన గౌరవభరితమైన శైలి. ‘పెదవులు/నోరు’ అనే హెబ్రీ సమాంతర రూపకాన్ని నిలిపి, కృత్రిమమైన పదబంధాలను నివారించాం.
