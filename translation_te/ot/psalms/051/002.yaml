id: PSA.51.2
reference: Psalms 51:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: חָנֵּ֣/נִי אֱלֹהִ֣ים כְּ/חַסְדֶּ֑/ךָ כְּ/רֹ֥ב רַ֝חֲמֶ֗י/ךָ מְחֵ֣ה פְשָׁעָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/002.yaml
  text: Be gracious to me[a], God, according to your steadfast love; according to your abundant mercies[c][b], blot out my transgressions.
translation:
  language: te
  text: దేవా, నాపై అనుగ్రహం చూపు[a]; నీ నిబద్ధమైన ప్రేమను బట్టి[b], నీ అపారమైన కరుణను బట్టి[c] నా తిరుగుబాట్లను తుడిచివేయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాపై కనికరం చూపు.” హీబ్రూ క్రియ దేవుని అనుగ్రహం లేదా అనుకూలతను కోరే విన్నపాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “నిబద్ధమైన ప్రేమ” హీబ్రూ హేసెద్‌ను అనువదిస్తుంది; ఇది తరచుగా విశ్వసనీయమైన, ఒడంబడికకు నిబద్ధమైన ప్రేమను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “నీ కరుణల సమృద్ధిని బట్టి” లేదా “నీ కరుణల గొప్పతనాన్ని బట్టి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: నన్ను కనికరించు
  rationale: חנן అనే క్రియ అనుగ్రహం లేదా దయ చూపమనే విన్నపాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘కనికరించు’ ఈ విన్నప స్వరాన్ని అందిస్తుంది; తరువాతి רחמים భావంతో పూర్తిగా కలిసిపోకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ఇది దేవునికి నేరుగా చేసే సంబోధన; తెలుగు సంబోధన రూపం సహజంగా ఉంది.
- source_word: כְחַסְדֶּךָ
  choice: నీ కృపచేత
  rationale: חסד స్థిరమైన, విశ్వసనీయమైన ప్రేమపూర్వక దయను సూచిస్తుంది. ‘కృప’ సహజమైన సంక్షిప్త పదం; దాని విశ్వసనీయ ప్రేమ భావాన్ని పాదటిప్పణి వివరిస్తుంది. כְּ ఇక్కడ ప్రమాణం లేదా ఆధారాన్ని సూచించడంతో ‘చేత’ వాడాం.
- source_word: כְּרֹב רַחֲמֶיךָ
  choice: నీ అపారమైన వాత్సల్యాన్ని బట్టి
  rationale: רֹב సమృద్ధి లేదా గొప్ప పరిమాణాన్ని, רחמים లోతైన కరుణామయ వాత్సల్యాన్ని సూచిస్తాయి. ‘అపారమైన వాత్సల్యం’ సహజమైన తెలుగులో ఆ సమృద్ధిని, భావోద్వేగ లోతును కలిపి వ్యక్తం చేస్తుంది.
- source_word: מְחֵה
  choice: తుడిచివేయి
  rationale: מחה తుడిచివేయడం లేదా చెరిపివేయడం అనే రూపకాన్ని కలిగి ఉంది. ‘తుడిచివేయి’ పాపాల నమోదును లేదా మచ్చను పూర్తిగా తొలగించే భావాన్ని నిలుపుతుంది.
- source_word: פְשָׁעָי
  choice: నా తిరుగుబాట్లను
  rationale: פשע కేవలం సాధారణ తప్పులను కాక అధికారానికి లేదా దేవునికి వ్యతిరేకమైన తిరుగుబాటు, అతిక్రమణను సూచిస్తుంది. ‘తిరుగుబాట్లు’ ఆ బలమైన నైతిక భావాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: חנן / חסד / רחמים అనే పరస్పర సంబంధమున్న దయా పదాల అనువాదం
  choice: ‘కనికరించు,’ ‘కృప,’ ‘వాత్సల్యం’ అనే వేర్వేరు తెలుగు వ్యక్తీకరణలను వాడటం
  alternative: మూడు చోట్లా ‘కరుణ’ లేదా ‘దయ’ అనే ఒకే పదాన్ని వాడటం
  rationale: హీబ్రూ కవిత్వం దేవుని అనుగ్రహం, స్థిరమైన ప్రేమపూర్వక దయ, లోతైన వాత్సల్యం అనే సంబంధితమైనా భిన్నమైన పార్శ్వాలను పొరలుగా ఉంచుతుంది. వేర్వేరు పదాలు ఈ కవితా మరియు ధార్మిక వైవిధ్యాన్ని కాపాడుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ సమాంతర నిర్మాణాన్ని సహజమైన తెలుగు వాక్యప్రవాహంతో నిలుపుతూ, దయకు సంబంధించిన మూడు మూలపదాల భావభేదాన్ని సాధ్యమైనంతవరకు కాపాడాం.
