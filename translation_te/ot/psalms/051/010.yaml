lexical_decisions:
- source_word: הַסְתֵּר
  choice: దాచుకో
  rationale: సתר హిఫీల్ ఆజ్ఞార్థక రూపంలోని ప్రత్యక్ష విజ్ఞాపనను, అలాగే దేవుడు పాపాలను చూడకూడదనే సజీవ రూపకాన్ని నిలుపుతుంది.
- source_word: פָּנֶיךָ
  choice: నీ ముఖాన్ని
  rationale: పנים అనే పదానికి ప్రాథమిక అర్థం ‘ముఖం’; దేవుని వ్యక్తిగత దృష్టిని సూచించే హీబ్రూ మానవరూపకాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: מֵחֲטָאָי
  choice: నా పాపాల నుండి
  rationale: חטאను సహజమైన ఆధునిక తెలుగులో ‘పాపాలు’గా అనువదించి, מִן ఉపసర్గను ‘నుండి’తో స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: וְכָל
  choice: అన్నిటినీ
  rationale: כָּל సూచించే సంపూర్ణతను తెలుగులో సహజంగా తెలియజేస్తుంది; వాక్య నిర్మాణంలో రెండో విజ్ఞాపన మొదటిదానికి అనుసంధానమవుతుంది.
- source_word: עֲוֺנֹתַי
  choice: నా దోషాలన్నిటినీ
  rationale: עָוֹןలోని వక్రత/అపరాధం/దోషభారం అనే విస్తృత భావాన్ని ‘దోషాలు’ కొంతవరకు నిలుపుతూ, ముందున్న ‘పాపాలు’తో పదభేదాన్ని కాపాడుతుంది.
- source_word: מְחֵה
  choice: తుడిచివేయి
  rationale: מחה ఆజ్ఞార్థక రూపం ఏదైనా గుర్తును పూర్తిగా తుడిచివేయడం లేదా చెరిపివేయడం అనే చిత్రాన్ని ఇస్తుంది; ‘తుడిచివేయి’ ఆధునిక తెలుగులో సహజంగాను బలంగాను ఉంది.
theological_decisions:
- issue: పాపాన్ని సూచించే రెండు హీబ్రూ పదాల భేదం
  choice: חטאను ‘పాపాలు’గా, עוןను ‘దోషాలు’గా వేర్వేరుగా అనువదించడం
  alternative: రెండింటినీ ‘పాపాలు’గా అనువదించడం; లేదా עוןను ‘అపరాధభారం’గా అనువదించడం
  rationale: హీబ్రూ కవిత్వం సమాంతర పాదాల్లో రెండు వేర్వేరు పదాలను ఉపయోగిస్తుంది. వాటి భేదాన్ని నిలపడం భావతీవ్రతను కాపాడుతుంది; అయితే వాటికి కఠినమైన సిద్ధాంతపరమైన సాంకేతిక భేదాన్ని ఆపాదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనా గాంభీర్యాన్ని కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఉపయోగించాం. ‘నీ ముఖాన్ని దాచుకో’ అనే హీబ్రూ రూపకాన్ని వివరణాత్మకంగా మార్చకుండా నిలిపాం.
