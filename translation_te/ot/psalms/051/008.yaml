  text: Purify me with hyssop[a], and I will be clean; wash me, and I will be whiter than snow.
translation:
  language: te
  text: హిస్సోపుతో నన్ను శుద్ధిపరచు[a], నేను శుద్ధుడనవుతాను; నన్ను కడుగు, మంచుకంటే తెల్లగా అవుతాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హిస్సోపుతో నన్ను శుభ్రపరచు.” ఇక్కడి హీబ్రూ క్రియ పాపం లేదా అపవిత్రతను తొలగించి శుద్ధిపరచడాన్ని సూచిస్తుంది; హిస్సోపు ప్రస్తావన ఆచారసంబంధ శుద్ధీకరణను గుర్తుచేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַטְּאֵנִי
  choice: నన్ను శుద్ధిచేయి
  rationale: חטא పియేల్ రూపం ఇక్కడ ‘పాపం చేయించు’ అని కాక, పాపం లేదా అపవిత్రతను తొలగించి శుద్ధిచేయడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘శుద్ధిచేయి’ సహజంగా ఉండి ఆచారసంబంధమైన శుద్ధీకరణ భావాన్ని నిలుపుతుంది.
- source_word: בְאֵזוֹב
  choice: హిస్సోపుతో
  rationale: בְ అనే ఉపసర్గ సాధనార్థకంగా ఉంది; హిస్సోపు ఇశ్రాయేలు శుద్ధీకరణ ఆచారాల్లో ఉపయోగించిన మొక్క. మూలంలోని నిర్దిష్ట ఆచార చిత్రాన్ని అనువాదం నిలుపుతుంది.
- source_word: וְאֶטְהָר
  choice: అప్పుడు నేను పవిత్రుడనవుతాను
  rationale: טהר ఆచారపరంగానూ నైతికంగానూ శుద్ధమైన స్థితికి రావడాన్ని సూచిస్తుంది. ఇక్కడ వరుసగా వచ్చే ఫలితాన్ని తెలుగులో ‘అప్పుడు’ స్పష్టం చేస్తుంది; ‘పవిత్రుడనవుతాను’ మొదటి పాదంలోని శుద్ధీకరణ భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: תְּכַבְּסֵנִי
  choice: నన్ను కడుగు
  rationale: כבס ప్రధానంగా వస్త్రాన్ని కడగడాన్ని సూచించినా, ఈ కవితాత్మక ప్రార్థనలో వ్యక్తిని కడిగి శుభ్రపరచే రూపకంగా వాడబడింది. ‘నన్ను కడుగు’ ఆ రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: וּמִשֶּׁלֶג
  choice: మంచుకంటే
  rationale: מן ఇక్కడ తులనార్థకంగా ఉండి, మంచును మించిన తెలుపును సూచిస్తుంది. తెలుగులో ‘మంచుకంటే’ సహజమైన తులనారూపం.
- source_word: אַלְבִּין
  choice: తెల్లగా అవుతాను
  rationale: לבן హిఫీల్ రూపం ఇక్కడ తెల్లగా కావడం అనే ఫలితాన్ని తెలియజేస్తుంది. మంచుతో తులన కలిసినప్పుడు ‘మంచుకంటే తెల్లగా అవుతాను’ మూలార్థాన్నీ కవితాత్మక చిత్రాన్నీ స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: నైతిక పాపానికి వర్తింపజేసిన ఆచారసంబంధ శుద్ధీకరణ చిత్రం
  choice: ‘హిస్సోపుతో నన్ను శుద్ధిచేయి’ అని ఆచార చిత్రాన్ని స్పష్టంగా నిలుపడం
  alternative: ‘హిస్సోపుతో నన్ను కడిగి శుభ్రపరచు’
  rationale: కీర్తనకర్త పాపం నుండి శుద్ధి కోరుతూ ఇశ్రాయేలు శుద్ధీకరణ ఆచారాల భాషను ఉపయోగిస్తున్నాడు. ‘హిస్సోపు’ మరియు ‘శుద్ధిచేయి’ అనే పదాలను నిలుపడం ద్వారా ఆచార శుద్ధికీ నైతిక పునరుద్ధరణకీ ఉన్న సంబంధం కనిపిస్తుంది; తరువాతి కాలపు ప్రత్యేక సిద్ధాంతాన్ని ఇందులో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవభరితమైన ఏకవచన ఆజ్ఞారూపాలు వాడబడ్డాయి. ‘హిస్సోపు’ అనే బైబిలు వృక్షనామం వివరణ కోసం పాదటిప్పణితో నిలుపబడింది. కవితా సమాంతరతను కాపాడేందుకు రెండు పాదాల్లోనూ ‘అప్పుడు’ చేర్చబడింది.
