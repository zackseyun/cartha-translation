  text: Consume them in wrath[a]; consume them until they are no more, so that they may know that God rules in Jacob to the ends of the earth[b]. Selah
translation:
  language: te
  text: ఉగ్రతతో వారిని అంతం చేయి[a]; వారు ఇక లేకుండా పోయేవరకు వారిని అంతం చేయి. దేవుడు యాకోబులో పరిపాలిస్తున్నాడని భూమి అంచుల వరకు వారు తెలుసుకునేలా చేయి[b]. సెలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: ‘ఉగ్రతతో వారిని నిర్మూలించు; నిర్మూలించు, వారు ఇక ఉండరు.’ హీబ్రూ మాటలను మరింత ఆకస్మికంగా, అక్షరార్థానికి దగ్గరగా ఇలా అనువదించవచ్చు.'
    reason: lexical_alternative
  - marker: b
    text: ‘యాకోబులో’ అంటే యాకోబు అనే పేరుతో సూచించబడిన ఇశ్రాయేలు ప్రజల మధ్య లేదా వారితో సంబంధంలో దేవుని పాలన. కొందరు దీనిని ‘యాకోబుపై’ అని అనువదిస్తారు. ‘భూమి అంచుల వరకు’ అనే మాటను దేవుని పాలన విస్తారానికి లేదా దాని గుర్తింపు విస్తరించే పరిధికి అన్వయించవచ్చు.
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: כַּלֵּה
  choice: అంతం చేయి
  rationale: పీయేల్ ఆజ్ఞారూపం పూర్తిగా ముగించడం లేదా నిర్మూలించడం అనే బలమైన భావాన్ని ఇస్తుంది. పునరుక్తిని కవితాత్మక తీవ్రత కోసం అలాగే ఉంచాం.
- source_word: בְחֵמָה
  choice: నీ ఉగ్రతలో
  rationale: חֵמָה మండే కోపం లేదా ఉగ్రతను సూచిస్తుంది; בְ ఇక్కడ స్థితి లేదా విధాన భావాన్ని ఇస్తుంది. సందర్భానుసారంగా దేవుని ఉగ్రత అని స్పష్టంచేయడానికి ‘నీ’ వాడాం.
- source_word: וְאֵינֵמוֹ
  choice: వారు ఇక లేకుండా పోయేవరకు
  rationale: అక్షరార్థంగా ‘వారు లేరు/ఇక ఉండరు.’ పునరుక్త ఆజ్ఞ తరువాత వచ్చే సంపూర్ణ ఫలితాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְיֵדְעוּ
  choice: వారు తెలుసుకునేలా చేయి
  rationale: వావ్‌తో కూడిన అసంపూర్ణ క్రియ ఇక్కడ ముందున్న ప్రార్థన ఫలితం లేదా ఉద్దేశాన్ని సూచించగలదు. ఆ ఉద్దేశార్థాన్ని నిలిపాం.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: కీర్తన సందర్భంలో ఇశ్రాయేలు దేవుణ్ణి సూచించే ప్రామాణిక ఏకవచన అనువాదం.
- source_word: מֹשֵׁל
  choice: పరిపాలిస్తున్నాడు
  rationale: కృదంత రూపం కొనసాగుతున్న పాలనను సూచిస్తుంది; ఆధునిక తెలుగులో ఈ రూపం సహజంగా ఆ నిరంతర భావాన్ని అందిస్తుంది.
- source_word: בְּיַעֲקֹב
  choice: యాకోబులో
  rationale: בְ యొక్క ప్రాథమిక ‘లో’ భావాన్ని నిలిపి, యాకోబును ఇశ్రాయేలు ప్రజలకు ఒడంబడికపరమైన పేరుగా ప్రధాన పాఠ్యంలో అలాగే ఉంచాం.
- source_word: לְאַפְסֵי הָאָרֶץ
  choice: భూమి అంచుల వరకు
  rationale: ప్రపంచపు అత్యంత దూర ప్రాంతాలను సూచించే హీబ్రూ నానుడికి సహజమైన తెలుగు సమానం.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఈ పదం ఖచ్చితమైన అర్థం అనిశ్చితం కాబట్టి ఊహాత్మకంగా అనువదించకుండా లిప్యంతరీకరించాం.
theological_decisions:
- issue: శత్రువుల సంపూర్ణ నిర్మూలన కోసం చేసే ప్రార్థన
  choice: తీవ్రమైన, సంపూర్ణ అంతాన్ని కోరే భాషను తగ్గించకుండా నిలిపాం.
  alternative: దీనిని కేవలం అదుపు చేయడం లేదా ఓడించడం అన్నట్లుగా మృదువుగా అనువదించడం.
  rationale: హీబ్రూ ఆజ్ఞను రెండుసార్లు పలికి, వారు ‘ఇక లేకుండా’ పోవాలని స్పష్టంగా కోరుతుంది; మూలంలోని తీవ్రతను తగ్గించడం సముచితం కాదు.
- issue: యాకోబుతో దేవుని ప్రత్యేక సంబంధం మరియు భూవ్యాప్త గుర్తింపు
  choice: ‘యాకోబులో’ అనే ప్రత్యేక పరిధినీ, ‘భూమి అంచుల వరకు’ అనే విశ్వవ్యాప్త పరిధినీ రెండింటినీ నిలిపాం.
  alternative: యాకోబును తొలగించి పూర్తిగా విశ్వవ్యాప్త వాక్యంగా చేయడం, లేదా భూవ్యాప్త పరిధిని తగ్గించి ఇశ్రాయేలుకే పరిమితం చేయడం.
  rationale: వచనం దేవుని యాకోబుతో సంబంధిత పాలనను, దాని భూవ్యాప్త గుర్తింపును కలిపి ఉంచుతుంది; ఆ ఉద్రిక్తతను పరిష్కరించకుండా సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రార్థనా-కవితా శైలిని వాడాం. ‘అంతం చేయి’ మూలంలోని తీవ్రతను నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది. వాక్యనిర్మాణంలోని ఉద్దేశ/ఫలిత భావం మరియు చివరి పరిధి పదబంధంలోని నిజమైన అనిశ్చితిని పాదటిప్పణిలో వెల్లడించాం.
