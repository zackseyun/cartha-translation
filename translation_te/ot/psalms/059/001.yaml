  text: Deliver me from my enemies[a], my God[b]; set me on high above those who rise up against me.
translation:
  language: te
  text: 'నా దేవా, నా శత్రువుల నుండి నన్ను విడిపించు;

    నాపై లేచేవారి నుండి నన్ను ఎత్తైన, అందనిచోట ఉంచు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాపై లేచేవారి నుండి నన్ను కాపాడు.’ హీబ్రూ క్రియ ఎత్తైన, అందనిచోట ఉంచడం ద్వారా భద్రపరచడం అనే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: నన్ను విడిపించు
  rationale: నצל అనే ధాతువు హిఫీల్ ఆజ్ఞార్థక రూపంలో ప్రమాదం లేదా శత్రువుల చేతిలోనుండి తప్పించి విడిపించాలనే విన్నపాన్ని తెలియజేస్తుంది. ‘విడిపించు’ ఆధునిక తెలుగులో సహజంగా ఉండి, సందర్భంలోని రక్షణ భావాన్ని అతిగా విస్తరించదు.
- source_word: מֵאֹיְבַי
  choice: నా శత్రువుల నుండి
  rationale: אֹיֵב సాధారణంగా ‘శత్రువు’ అని అర్థం; מִן విభక్త్యర్థకం వారి నుండి వేరుచేసి కాపాడాలనే భావాన్ని సూచిస్తుంది.
- source_word: אֱלֹהָי
  choice: నా దేవా
  rationale: మొదటి పురుష ఏకవచన స్వామ్య ప్రత్యయంతో ఉన్న ప్రత్యక్ష సంబోధనను సహజమైన తెలుగు సంబోధన రూపంలో నిలిపింది.
- source_word: מִּמִתְקוֹמְמַי
  choice: నాపై లేచేవారికి అందనంత
  rationale: קום యొక్క ఈ భాగధేయ రూపం వక్తకు విరోధంగా తమను తాము నిలబెట్టుకునేవారిని సూచిస్తుంది. తరువాతి שׂגב క్రియలోని ఎత్తైన, అందనిచోట ఉంచే రూపకంతో అనుసంధానించేందుకు ఈ నిర్మాణం ఎంచుకోబడింది.
- source_word: תְּשַׂגְּבֵנִי
  choice: ఎత్తున నన్ను ఉంచు
  rationale: שׂגב పీయేల్ రూపం ‘ఎత్తున ఉంచడం,’ తద్వారా ‘అందకుండా భద్రపరచడం’ అనే భావాలను కలిగి ఉంది. ఈ అనువాదం రక్షణ భావాన్ని తెలిపే ఎత్తైన స్థల రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: אֱלֹהָי అనే దైవ సంబోధన
  choice: నా దేవా
  alternative: ఓ నా దేవా
  rationale: వ్యక్తిగత స్వామ్య భావం మరియు ప్రత్యక్ష సంబోధన రెండింటినీ అలంకరణ లేకుండా నిలిపింది.
- issue: שׂגב లోని రక్షణ మరియు ఎత్తున ఉంచడం అనే భావాల సంబంధం
  choice: నాపై లేచేవారికి అందనంత ఎత్తున నన్ను ఉంచు
  alternative: నాపై లేచేవారి నుండి నన్ను కాపాడు
  rationale: కేవలం సాధారణ ‘కాపాడు’ అని చేయకుండా, మూలంలోని ఎత్తైన అందనిచోట ఉంచడం ద్వారా రక్షించే స్పష్టమైన రూపకాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనలోని ప్రార్థనా గాంభీర్యాన్ని కాపాడుతూ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే పదప్రయోగం. హీబ్రూ సమాంతర నిర్మాణాన్ని రెండు పాదాలుగా నిలిపి, రెండో పాదంలోని ఎత్తైన రక్షణ రూపకాన్ని స్పష్టంగా ఉంచింది.
