  yaml_path: translation/ot/psalms/059/012.yaml
  text: The sin of their mouth is the word of their lips[a]; let them be caught in their pride[b], because of the curse and the lie that they tell.
translation:
  language: te
  text: వారి నోటి పాపం వారి పెదవుల మాటే[a]; వారు పలికే శాపం, అబద్ధం కారణంగా తమ గర్వంలో చిక్కుకుపోవుగాక.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి నోటి పాపం, వారి పెదవుల మాట కారణంగా, వారు పలికే శాపం, అబద్ధం కారణంగా వారు తమ గర్వంలో చిక్కుకుపోవుగాక.”
    reason: హెబ్రీలోని సంక్షిప్త వాక్యనిర్మాణం మొదటి నామవాచక పదబంధాలను, చివరి శాపం మరియు అబద్ధం పదబంధంతో పాటు, ‘చిక్కుకుపోవుగాక’ అనే క్రియకు కారణాలుగా అనుసంధానించడానికి కూడా వీలు ఇస్తుంది.
  - marker: b
    text: లేదా, “తమ గర్వం కారణంగానూ, వారు పలికే శాపం, అబద్ధం కారణంగానూ చిక్కుకుపోవుగాక.”
    reason: בִּ మరియు מִן పదబంధాల మధ్య సంబంధాన్ని సమాంతర కారణాలుగా గ్రహించే అవకాశం ఉంది.
lexical_decisions:
- source_word: חַטַּאת
  choice: పాపం
  rationale: ఇక్కడ ఈ నామవాచకం బలి అర్థంలో కాక, వారి మాటల్లో వ్యక్తమయ్యే నైతిక దోషాన్ని సూచిస్తుంది.
- source_word: פִּימוֹ
  choice: వారి నోటి
  rationale: ఏకవచన నామవాచకానికి బహువచన స్వామ్యప్రత్యయం ఉంది; హెబ్రీ కవిత్వంలోని సామూహిక ఏకవచనాన్ని తెలుగులో సహజంగా నిలిపింది.
- source_word: דְּבַר שְׂפָתֵימוֹ
  choice: వారి పెదవుల మాట
  rationale: నోరు–పెదవులు అనే సమాంతర శరీరాంగ చిత్రణను, అలాగే నిర్మాణంలోని కవితాత్మకతను కాపాడుతుంది.
- source_word: וְיִלָּכְדוּ
  choice: చిక్కుకుపోవుగాక
  rationale: నిఫాల్ అసంపూర్ణ క్రియ ప్రార్థనా సందర్భంలో కోరికను లేదా శాపోక్తిని తెలిపే జస్సివ్‌గా పనిచేస్తుంది; ఈ రూపం దాని నిష్క్రియాత్మక భావాన్ని, ప్రార్థనాత్మక స్వరాన్ని నిలుపుతుంది.
- source_word: בִגְאוֹנָם
  choice: తమ గర్వంలోనే
  rationale: גאון ఇక్కడ అహంకారపూరితమైన స్వీయఔన్నత్యాన్ని సూచిస్తుంది. ‘లోనే’ వారి గర్వమే వారు చిక్కుకునే పరిధి లేదా సాధనం అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: מֵאָלָה
  choice: శాపం కారణంగా
  rationale: מן ను ఇక్కడ కారణార్థకంగా గ్రహించాం; ఏకవచన ‘శాపం’ వారి శాపపూరిత మాటలను సమష్టిగా సూచించగలదు.
- source_word: מִכַּחַשׁ
  choice: అబద్ధం కారణంగా
  rationale: כחש అబద్ధం లేదా మోసాన్ని సూచిస్తుంది; ‘అబద్ధం’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి ‘శాపం’తో కవితాత్మక జతగా నిలుస్తుంది.
- source_word: יְסַפֵּרוּ
  choice: వారు పలికే
  rationale: ספר సాధారణంగా చెప్పడం లేదా వివరించడం అనే అర్థం కలిగి ఉంది; ఇక్కడ శాపం, అబద్ధం వారి నోటి నుంచి వెలువడుతున్నాయని సహజ తెలుగులో తెలియజేయడానికి ‘పలికే’ ఎంచుకున్నాం.
theological_decisions:
- issue: శత్రువులు చిక్కుకోవాలనే ప్రార్థనా కోరిక
  choice: ‘చిక్కుకుపోవుగాక’ అని జస్సివ్ భావాన్ని నిలిపాం
  alternative: ‘చిక్కుకుంటారు’ అనే సాధారణ భవిష్యత్ వాక్యం
  rationale: కీర్తనకర్త కేవలం ఫలితాన్ని ముందుగా చెప్పడం కాక, అది జరగాలని ప్రార్థిస్తున్న సందర్భాన్ని హెబ్రీ క్రియారూపం సూచిస్తుంది; దీనికి మించిన సిద్ధాంత వ్యాఖ్యానాన్ని చేర్చలేదు.
- issue: పాపం, పెదవుల మాట, చిక్కుకోవడం మధ్య వాక్యనిర్మాణ సంబంధం
  choice: మొదటి భాగాన్ని నామవాచక వాక్యంగా తీసుకుని, తరువాతి భాగాన్ని వేరైన ప్రార్థనా కోరికగా అనువదించాం
  alternative: ‘వారి నోటి పాపం కారణంగా, వారి పెదవుల మాట కారణంగా వారు తమ గర్వంలో చిక్కుకుపోవుగాక’
  rationale: మసొరేటిక్ విరామాలు ఈ విభజనకు అనుకూలమైనప్పటికీ, హెబ్రీ సంక్షిప్త నిర్మాణం ప్రత్యామ్నాయ కారణార్థక అనుసంధానానికీ వీలు ఇస్తుంది; అందుకే దానిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండే కవితాత్మక, గౌరవప్రద శైలి. ‘నోరు/పెదవులు’ అనే హెబ్రీ సమాంతర చిత్రణను నిలిపి, అతిగా ప్రాచీనమైన పదజాలాన్ని నివారించాం.
