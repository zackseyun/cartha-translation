source:
  edition: WLC
  text: וְ/אַתָּ֤ה יְהוָֽה אֱלֹהִ֥ים צְבָא֡וֹת אֱלֹ֘הֵ֤י יִשְׂרָאֵ֗ל הָקִ֗יצָ/ה לִ/פְקֹ֥ד כָּֽל הַ/גּוֹיִ֑ם אַל תָּחֹ֨ן כָּל בֹּ֖גְדֵי אָ֣וֶן סֶֽלָה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/005.yaml
  text: But you[a], O Yahweh God of hosts, God of Israel, awake to punish all the nations; show no favor to any treacherous evildoers[c][b]. Selah
translation:
  language: te
  text: 'కాని సైన్యాల దేవుడవైన యెహోవా, ఇశ్రాయేలు దేవా,

    సమస్త జనాంగాలను శిక్షించడానికి మేలుకో[a].

    ద్రోహపూర్వకంగా దుష్టత్వం చేసేవారిలో ఎవరికీ కృప చూపకు[b].

    సెలా[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సమస్త జనాంగాలను సందర్శించడానికి” లేదా “వారి లెక్క అడగడానికి.” פקד అనే హీబ్రూ క్రియ సందర్భానుసారం “సందర్శించు,” “శ్రద్ధ చూపు,” “లెక్క అడుగు,” లేదా “శిక్షించు” అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ద్రోహపూర్వకంగా దుష్టత్వం చేసేవారిలో ఎవరి మీదా కనికరం చూపకు.” חנן అనే హీబ్రూ క్రియ అక్షరార్థంగా “అనుగ్రహించు” లేదా “కృప చూపు” అని అర్థం.
    reason: lexical_alternative
  - marker: c
    text: “సెలా” బహుశా సంగీత లేదా ఆరాధనా సూచన కావచ్చు; దాని ఖచ్చితమైన అర్థం తెలియదు.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామంలోని నాలుగు హల్లుల పేరును తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో వ్యక్తపరుస్తుంది; సాధారణ బిరుదుతో దానిని భర్తీ చేయదు.
- source_word: אֱלֹהִים צְבָאוֹת
  choice: సైన్యాల దేవుడు
  rationale: צבאות అనే పదంలోని సైన్యాలు/సమూహాలు అనే విస్తృత భావాన్ని అనవసరంగా భూసైన్యాలకు గానీ పరలోక సైన్యాలకు గానీ పరిమితం చేయకుండా ఉంచుతుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: మూలంలోని సంబంధ నిర్మాణాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: הָקִיצָה
  choice: మేలుకో
  rationale: దేవుడు నిద్రిస్తున్నాడనే కీర్తనాత్మక రూపకాన్ని తొలగించకుండా సహజమైన ఆజ్ఞారూపంలో నిలుపుతుంది.
- source_word: לִפְקֹד
  choice: శిక్షించడానికి
  rationale: פקד పదానికి సందర్శించడం, శ్రద్ధ చూపడం, లెక్క అడగడం, శిక్షించడం వంటి అర్థాలు ఉన్నాయి. జనాలపై తీర్పు కోరుతూ తరువాత కృప చూపవద్దని చెప్పే సందర్భంలో ‘శిక్షించడానికి’ అనే న్యాయపరమైన భావం సముచితం; విస్తృత పదార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: כָּל הַגּוֹיִם
  choice: సమస్త జనాలు
  rationale: ఇక్కడి גוים రాజకీయ-సామూహిక భావాన్ని వ్యక్తపరుస్తుంది; తరువాతి యూదేతరులు అనే ప్రత్యేక మతపరమైన వర్గీకరణను వాక్యంలోకి తీసుకురాదు.
- source_word: אַל תָּחֹן
  choice: కృప చూపకు
  rationale: חנן అనే క్రియలోని అనుగ్రహం లేదా కృప చూపడం అనే ప్రాథమిక భావాన్ని నిలుపుతుంది; ‘కనికరించకు’ అనేది సందర్భానుకూల ప్రత్యామ్నాయం.
- source_word: בֹּגְדֵי אָוֶן
  choice: దుష్ట ద్రోహులు
  rationale: בגד లోని విశ్వాసఘాతుకతను, און లోని దుష్టత్వాన్ని సంక్షిప్తమైన సహజ తెలుగు పదబంధంలో కలిపి వ్యక్తపరుస్తుంది.
- source_word: סֶלָה
  choice: సెలా
  rationale: దీని ఖచ్చితమైన అర్థం తెలియనందున అనువదించి అర్థాన్ని నిర్ధారించకుండా లిప్యంతరీకరించాం.
theological_decisions:
- issue: శాపవాక్య సందర్భంలో כָּל הַגּוֹיִם యొక్క పరిధి
  choice: సమస్త జనాలు
  alternative: యూదేతరులందరూ
  rationale: ఈ పదబంధం శత్రుత్వం చూపే ప్రజాసమూహాలపై దేవుని తీర్పును విస్తృతంగా కోరుతుంది. ‘జనాలు’ అనే అనువాదం తరువాతి కాలపు యూదు–యూదేతర మతవిభజనను ఇందులోకి దిగుమతి చేయకుండా సామూహిక భావాన్ని నిలుపుతుంది.
- issue: దైవ తీర్పు కోసం చేసిన విజ్ఞప్తిలో פקד భావం
  choice: శిక్షించడానికి
  alternative: విచారించడానికి / లెక్క అడగడానికి
  rationale: తరువాతి ‘కృప చూపకు’ అనే విజ్ఞప్తి ప్రతికూల న్యాయతీర్పును సూచిస్తుంది. అయినా మూల క్రియకు ఉన్న విస్తృత భావాన్ని పాదటిప్పణిలో తెలిపి అంతర్లీన సందిగ్ధతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కీర్తనా శైలిని వాడాం. సంబోధనలో ‘దేవా’ను, విజ్ఞప్తుల్లో ఏకవచన ఆజ్ఞారూపాలను ఉంచాం. మూలంలోని కఠినమైన తీర్పు విజ్ఞప్తిని మృదువుచేయలేదు; అయితే פקד పదంలోని నిజమైన అర్థవిస్తృతిని పాదటిప్పణిలో సంరక్షించాం.
