  to: 'కాని సైన్యాల దేవుడవైన యెహోవా, ఇశ్రాయేలు దేవా,

    సమస్త జనాంగాలను శిక్షించడానికి మేలుకో[a].

    ద్రోహపూర్వకంగా దుష్టత్వం చేసేవారిలో ఎవరికీ కృప చూపకు[b].

    సెలా[c]'
  rationale: సవరణలు మూలంలోని జనాంగాల పరిధిని, ద్రోహపూర్వక దుష్టత్వం అనే ద్వంద్వభావాన్ని మరింత స్పష్టంగా ప్రతిబింబిస్తాయి. פקד యొక్క సందర్భోచితమైన న్యాయతీర్పు భావాన్ని ప్రధాన పాఠంలో ఉంచి, దాని విస్తృత పదార్థాన్ని పాదటిప్పణిలో సంరక్షించాం. పాదటిప్పణిలోని హీబ్రూ లిపి దోషాన్ని కూడా సరిచేశాం.
