source:
  edition: WLC
  text: וְ/אַתָּ֣ה יְ֭הוָה תִּשְׂחַק לָ֑/מוֹ תִּ֝לְעַ֗ג לְ/כָל גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/008.yaml
  text: But you[a], O Yahweh, laugh at them; you mock all the nations.
translation:
  language: te
  text: కాని, ఓ యాహ్వే[a], నీవు వారిని చూసి నవ్వుతావు; అన్ని దేశాలను ఎగతాళి చేస్తావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అయితే, ఓ యాహ్వే, నీవు వారిని చూసి నవ్వుతావు; అన్ని దేశాలను ఎగతాళి చేస్తావు.’ ‘ఎగతాళి చేస్తావు’కు ‘ఎగసిపడతావు’ అని కూడా అనువదించవచ్చు.
    reason: וְ యొక్క విరుద్ధార్థక ఛాయకు, అలాగే תִּלְעַג యొక్క సముచిత పదార్థ ప్రత్యామ్నాయానికి పాదటిప్పణి ఇస్తుంది.
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: కాని ... నీవు
  rationale: స్వతంత్ర సర్వనామంతో కూడిన וְ ఇక్కడ ముందున్న వర్ణనకు విరుద్ధమైన మలుపును సూచిస్తుంది; ఆధునిక తెలుగులో ‘కాని ... నీవు’ ఆ వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: תִּשְׂחַק לָמוֹ
  choice: వారిని చూసి నవ్వుతావు
  rationale: שׂחק యొక్క మూలచిత్రమైన ‘నవ్వు’ను నిలిపి, לָמוֹ సూచించే లక్ష్యాన్ని సహజమైన తెలుగు ప్రయోగంతో వ్యక్తం చేశాం.
- source_word: תִּלְעַג
  choice: ఎగతాళి చేస్తావు
  rationale: ఈ క్రియలోని అపహాస్య భావాన్ని స్పష్టమైన, ప్రస్తుత ప్రామాణిక తెలుగు పదబంధం తెలియజేస్తుంది.
- source_word: לְ/כָל גּוֹיִם
  choice: జనాలన్నిటినీ
  rationale: גּוֹיִם ఇక్కడ ఒక సాంకేతిక మతపరమైన వర్గం కంటే విస్తృతంగా జనాలను లేదా దేశజనాలను సూచిస్తుంది; ‘జనాలన్నిటినీ’ సమగ్రతను సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన లిప్యంతరీకరణను ప్రధాన పాఠ్యంలో వాడి, మరో సాధ్యమైన లిప్యంతరీకరణను పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనా శైలికి తగిన గౌరవభావాన్ని ఉంచుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదాలను ఎంచుకున్నాం. సమాంతర వాక్య నిర్మాణాన్ని నిలిపాం.
