  text: They return at evening[c][b][a]; they growl like dogs and prowl around the city.
translation:
  language: te
  text: సాయంకాలం వారు తిరిగి వస్తారు; కుక్కల్లా గుర్రుమంటూ పట్టణం చుట్టూ తిరుగుతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కుక్కల్లా అరుస్తూ పట్టణం చుట్టూ తిరుగుతారు.” హీబ్రూ క్రియ పెద్దగా చేసే జంతువులాంటి శబ్దాన్ని సూచించగలదు; అది గుర్రుమనడం లేదా అరవడం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשׁוּבוּ
  choice: వారు తిరిగి వస్తారు
  rationale: שׁוב అనే క్రియ యొక్క ప్రాథమిక అర్థం ‘తిరిగి రావడం.’ ఇక్కడ శత్రువులు ప్రతి సాయంకాలం మళ్లీ వచ్చే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לָעֶרֶב
  choice: సాయంకాలం
  rationale: עֶרֶב అంటే ‘సాయంకాలం.’ కాలసూచనను సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో ఉంచుతుంది.
- source_word: יֶהֱמוּ
  choice: గుర్రుమంటూ
  rationale: המה పెద్దగా శబ్దం చేయడం, గర్జించడం లేదా గుర్రుమనడం అనే విస్తృత భావాన్ని కలిగి ఉంది. వెంటనే వచ్చే కుక్క ఉపమానంతో ‘గుర్రుమంటూ’ సహజంగా సరిపోతుంది; ఇతర సాధ్యార్థాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: כַכָּלֶב
  choice: కుక్కల్లా
  rationale: హీబ్రూలో ఏకవచన ‘కుక్క’ జాతిని సూచించే ఉపమానంగా ఉంది. బహువచన కర్తతో ఆధునిక తెలుగులో ‘కుక్కల్లా’ సహజంగా ఉండి అదే చిత్రాన్ని అందిస్తుంది.
- source_word: וִיסוֹבְבוּ
  choice: తిరుగుతారు
  rationale: סבב అంటే చుట్టూ తిరగడం లేదా సంచరించడం. ‘తిరుగుతారు’ మూలార్థాన్ని కాపాడుతుంది; ‘వేటాడుతూ’ వంటి స్పష్టంగా లేని ఉద్దేశాన్ని చేర్చదు.
- source_word: עִיר
  choice: పట్టణమంతా
  rationale: తెలిసిన పట్టణ పరిధిలో వారు చుట్టూ తిరిగే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది. ‘అంతా’ అనేది סבב సూచించే పరిభ్రమణ భావాన్ని తెలుగులో స్పష్టం చేస్తుంది.
