  text: Without guilt[a], they run and set themselves in place; awake to meet me and see.
translation:
  language: te
  text: దోషం లేకుండానే వారు పరుగెత్తి స్థానం తీసుకుంటారు[a]; నన్ను కలుసుకోవడానికి మేల్కొను, చూడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమను తాము స్థిరపరచుకుంటారు” లేదా “సిద్ధపడతారు.” హీబ్రూ క్రియ స్థానం తీసుకోవడం లేదా చర్యకు సిద్ధపడడం అనే భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלִי עָוֺן
  choice: దోషం లేకుండానే
  rationale: కీర్తనకర్త తనపై దాడికి కారణమయ్యే అపరాధం తనలో లేదని చెబుతున్న సందర్భంలో, నైతిక-న్యాయపరమైన నిర్దోషిత్వాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יְרוּצוּן
  choice: వారు పరుగెత్తి
  rationale: రוץ అనే ధాతువు యొక్క స్పష్టమైన పరుగెత్తడం/త్వరపడడం చిత్రాన్ని నిలుపుతుంది.
- source_word: וְיִכּוֹנָנוּ
  choice: తమ స్థానాల్లో నిలబడుతున్నారు
  rationale: כון రూపం సూచించే స్థిరపడడం లేదా చర్యకు సిద్ధంగా స్థానాన్ని చేపట్టడం అనే భావాన్ని, దాడి సిద్ధతను అతిగా నిర్దిష్టం చేయకుండా అందిస్తుంది.
- source_word: עוּרָה
  choice: మేల్కొని
  rationale: దేవునికి ఉద్దేశించిన ఆజ్ఞలోని మానవరూపకాన్ని, దైవ జోక్యం కోసం చేసే విజ్ఞాపన యొక్క కవితా బలంతో సహా నిలుపుతుంది.
- source_word: לִקְרָאתִי
  choice: నన్ను ఎదుర్కొనడానికి
  rationale: లక్ష్యార్థక לִ మరియు לקראת అనే ఎదురుగా రావడం/కలుసుకోవడం భావాన్ని దగ్గరగా ఇస్తుంది; సందర్భంలో సహాయానికి రావడం పాఠకుడు గ్రహించగలిగేలా అస్పష్టతను ఉంచుతుంది.
- source_word: וּרְאֵה
  choice: చూడు
  rationale: ראה ఆజ్ఞార్థక రూపాన్ని సంక్షిప్తంగా, ప్రత్యక్షంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: దేవునికి ఉద్దేశించిన మానవరూపక ఆజ్ఞ
  choice: మేల్కొని
  alternative: లేచి కార్యానికి పూనుకో
  rationale: దేవుడు అక్షరార్థంగా నిద్రిస్తున్నాడని చెప్పకుండా, ఆయన జోక్యం కోరే విలాప కవితలోని ఉద్దేశపూర్వక ఉద్వేగాన్ని ‘మేల్కొని’ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కీర్తనా శైలిని వాడాం. హీబ్రూ వాక్యంలోని వేగం, స్థానాన్ని చేపట్టడం, దేవుణ్ణి మేల్కొనమని పిలిచే మానవరూపక ఉద్వేగం నిలుపబడ్డాయి.
