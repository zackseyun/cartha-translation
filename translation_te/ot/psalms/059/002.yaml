source:
  edition: WLC
  text: הַ֭צִּילֵ/נִי מִ/פֹּ֣עֲלֵי אָ֑וֶן וּֽ/מֵ/אַנְשֵׁ֥י דָ֝מִ֗ים הוֹשִׁיעֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/002.yaml
  text: Deliver me from workers of wickedness[b][a], and save me from men of blood.
translation:
  language: te
  text: 'దుష్టకార్యాలు చేసేవారినుండి నన్ను విడిపించు;

    రక్తపాతానికి పాల్పడే మనుషులనుండి[a] నన్ను రక్షించు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘రక్తాల మనుషులు’; అంటే రక్తపాతం చేసే లేదా రక్తదోషం కలిగిన మనుషులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: నన్ను విడిపించు
  rationale: నצל క్రియ ఇక్కడ ప్రమాదకరమైన శత్రువుల చేతినుండి తప్పించమనే వేడుకోలును వ్యక్తం చేస్తుంది. ‘విడిపించు’ సహజమైన ఆధునిక తెలుగు పదప్రయోగం.
- source_word: מִפֹּעֲלֵי אָוֶן
  choice: దుష్టకార్యాలు చేసేవారినుండి
  rationale: పదబంధం అక్షరార్థంగా ‘దుష్టత్వాన్ని/దుష్టకార్యాన్ని చేసేవారి నుండి’ అని ఉంటుంది. ‘దుష్టకార్యాలు చేసేవారు’ అనే రూపం కర్తృవాచక నిర్మాణాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: וּמֵאַנְשֵׁי דָמִים
  choice: రక్తపాతానికి పాల్పడే మనుషులనుండి
  rationale: ‘రక్తాల మనుషులు’ అనే హీబ్రూ నుడికారానికి రక్తపాతం చేసే లేదా రక్తదోషం కలిగిన మనుషులు అనే భావం ఉంది. ప్రధాన పాఠంలో అర్థం స్పష్టంగా ఉండేందుకు నుడికారాత్మక భావాన్ని ఇచ్చి, మూలరూపాన్ని పాదసూచికలో తెలిపాం.
- source_word: הוֹשִׁיעֵנִי
  choice: నన్ను రక్షించు
  rationale: ישׁע క్రియకు రక్షించు, కాపాడు అనే విస్తృత భావం ఉంది. ఇక్కడ శత్రువుల ప్రమాదం నుండి రక్షణ కోరడం వల్ల ‘రక్షించు’ సరిపోతుంది.
theological_decisions:
- issue: אַנְשֵׁי అనే పుంలింగ రూపం
  choice: మనుషులు
  alternative: వారు / వ్యక్తులు
  rationale: మూలంలోని పుంలింగ బహువచనాన్ని తెలుగులో ‘మనుషులు’ అని స్పష్టంగా ఉంచాం; అయితే దీనికి అనవసరమైన సిద్ధాంతార్థాన్ని జోడించలేదు.
- issue: דָמִים అనే బహువచన నుడికారం
  choice: రక్తపాతానికి పాల్పడే
  alternative: రక్తపు మనుషులు
  rationale: అక్షరానువాదం తెలుగులో అసహజంగా, అర్థం మసకగా ఉంటుంది. సందర్భంలో హింసాత్మక రక్తపాతం లేదా రక్తదోషాన్ని సూచించే భావాన్ని ప్రధాన పాఠంలో ఇచ్చి, హీబ్రూ రూపాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనా గాంభీర్యాన్ని నిలుపుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదాలను వాడాం. రెండు సమాంతర ఆజ్ఞారూపాలైన ‘విడిపించు’, ‘రక్షించు’లను వేరుగా ఉంచి హీబ్రూ కవితా సమాంతరత్వాన్ని కాపాడాం.
