translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తన కవిత్వానికి తగిన సంక్షిప్తమైన, గంభీరమైన శైలి. ‘పట్టణమంతా తిరుగుతారు’ సహజమైన తెలుగు ప్రయోగం; మూలంలోని కదలికను కాపాడుతూ ‘వేటాడుతూ తిరుగుతారు’ వంటి అదనపు భావాన్ని నివారిస్తుంది.
