  yaml_path: translation/ot/psalms/059/006.yaml
  text: They return at evening[c][b][a]; they growl like dogs and go around the city.
translation:
  language: te
  text: వారు సాయంకాలం తిరిగి వస్తారు; కుక్కల్లా[c] గుర్రుమంటారు[a], పట్టణం చుట్టూ తిరుగుతారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మొరుగుతారు.’ హీబ్రూ క్రియ జంతువు చేసే పెద్ద శబ్దాన్ని సూచించగలదు; ఇక్కడ బెదిరించే దృశ్యానికి సరిపడేలా ‘గుర్రుమంటారు’ అని అనువదించాం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పట్టణాన్ని చుట్టి తిరుగుతారు’ లేదా ‘పట్టణమంతా సంచరిస్తారు.’
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘కుక్కలా.’ హీబ్రూ ఏకవచనం ఇక్కడ సామూహిక భావంలో వాడబడింది.
    reason: previous_rendering
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: తిరిగి వస్తారు
  rationale: שוב అనే క్రియకు ఇక్కడ ‘తిరిగి రావడం’ అనే ప్రాథమిక భావం ఉంది; శత్రువుల పునరావృత కదలికను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לָעֶרֶב
  choice: సాయంకాలం
  rationale: ל ఉపసర్గ ఇక్కడ కాలాన్ని సూచిస్తుంది; ‘సాయంకాలం’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: יֶהֱמוּ
  choice: గుర్రుమంటారు
  rationale: המה పెద్దగా, జంతువులా శబ్దం చేయడాన్ని సూచించగలదు. కుక్కలతో చేసిన పోలికలో ‘గుర్రుమంటారు’ బెదిరించే ధ్వనిని తెలియజేస్తుంది; అయితే ‘మొరుగుతారు’ అనే భావసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: כַכָּלֶב
  choice: కుక్కల్లా
  rationale: హీబ్రూలో ఏకవచనం జాతిని లేదా వర్గాన్ని సామూహికంగా సూచించగలదు. బహువచన కర్తతో తెలుగులో ‘కుక్కల్లా’ సహజంగా ఉంటుంది.
- source_word: וִיסוֹבְבוּ
  choice: తిరుగుతారు
  rationale: סבב చుట్టూ తిరగడం లేదా సంచరించడం అనే భావాన్ని ఇస్తుంది. ‘తిరుగుతారు’ మూలంలోని కదలికను అదనపు వేటాడే భావం చేర్చకుండా తెలుపుతుంది.
- source_word: עִיר
  choice: పట్టణం
  rationale: సందర్భంలో ఒక నిర్దిష్ట పట్టణం ఉద్దేశించబడింది; తెలుగులో ‘పట్టణమంతా’ దానిలోని వివిధ ప్రాంతాల్లో తిరుగుతున్న దృశ్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
