id: PSA.59.17
reference: Psalms 59:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עֻ֭זִּ/י אֵלֶ֣י/ךָ אֲזַמֵּ֑רָה כִּֽי אֱלֹהִ֥ים מִ֝שְׂגַּבִּ֗/י אֱלֹהֵ֥י חַסְדִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/017.yaml
  text: O my strength[a], to you I will sing praises, for God is my stronghold, the God of my steadfast love.
translation:
  language: te
  text: 'నా బలమా, నీకు స్తుతిగానం చేస్తాను;

    ఎందుకంటే దేవుడు నా దుర్గం,

    నా నిబద్ధ ప్రేమయొక్క దేవుడు[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా కృపగల దేవుడు,’ లేదా ‘నాపట్ల నిబద్ధ ప్రేమ చూపించే దేవుడు.’ హెబ్రీలో వాచ్యార్థం ‘నా నిబద్ధ ప్రేమయొక్క దేవుడు.’
    reason: alternative_reading
lexical_decisions:
- source_word: עֻזִּי
  choice: నా బలమా
  rationale: עֹז అంటే ‘బలం, శక్తి.’ ఇక్కడ అది దేవుణ్ణి నేరుగా సంబోధించే కవితాత్మక రూపంగా ఉంది; తెలుగు సంబోధన ‘నా బలమా’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֵלֶיךָ
  choice: నీకు
  rationale: אֶל దిశను సూచించే ‘వైపు/కు’ అనే అర్థం ఇస్తుంది. זמרతో కలిసి ‘నీకు స్తుతిగానం చేస్తాను’ అనడం గానాన్ని దేవునికి అర్పించే భావాన్ని నిలుపుతుంది.
- source_word: אֲזַמֵּרָה
  choice: స్తుతిగానం చేస్తాను
  rationale: זמר పియేల్ రూపం కీర్తనల్లో సాధారణంగా సంగీతంతో స్తుతించడాన్ని సూచిస్తుంది. ‘స్తుతిగానం చేస్తాను’ అనే అనువాదం గానం, స్తుతి అనే రెండు ఛాయలనూ అందిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇక్కడ כִּי స్తుతిగానానికి కారణాన్ని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ‘ఎందుకంటే’ ఈ కారణ సంబంధాన్ని స్పష్టంగా, సహజంగా చూపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపపరంగా బహువచనమైనా, ఈ సందర్భంలో אֱלֹהִים ఇశ్రాయేలు దేవుణ్ణి ఏకవచనార్థంలో సూచిస్తుంది.
- source_word: מִשְׂגַּבִּי
  choice: నా దుర్గం
  rationale: מִשְׂגָּב ఎత్తైన, సురక్షిత ఆశ్రయస్థలాన్ని లేదా రక్షణనిచ్చే కోటను సూచిస్తుంది. ‘నా దుర్గం’ రక్షణ, దృఢత అనే భావాలను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: אֱלֹהֵי חַסְדִּי
  choice: నా నిబద్ధ ప్రేమకు దేవుడు
  rationale: ఈ సంధిబద్ధ పదబంధానికి వాచ్యార్థం ‘నా חֶסֶד‌కు దేవుడు.’ חֶסֶד‌లో ప్రేమ, విశ్వసనీయత, ఒడంబడిక నిబద్ధత కలిసి ఉంటాయి. ‘నిబద్ధ ప్రేమ’ ప్రధాన భావాన్ని అందిస్తుండగా, ‘...కు దేవుడు’ అనే సాంద్రమైన నిర్మాణం మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది.
theological_decisions:
- issue: חַסְדִּי దేవునితో కలిగిన సంబంధం
  choice: ‘నా నిబద్ధ ప్రేమకు దేవుడు’ అని సంబంధార్థాన్ని తెరిచి ఉంచడం
  alternative: ‘నా కృపగల దేవుడు’ లేదా ‘నాపట్ల నిబద్ధ ప్రేమ చూపించే దేవుడు’
  rationale: హెబ్రీ పదబంధం దేవుడు కీర్తనకర్తపట్ల చూపే నిబద్ధ ప్రేమను సూచించవచ్చు; లేదా ఆ ప్రేమకు దేవుడే మూలం/స్వరూపం అని చెప్పవచ్చు. ప్రధాన పాఠం ఏ ఒక్క అర్థానికీ పరిమితం చేయకుండా మూలంలోని కవితాత్మక, దైవశాస్త్ర సంబంధమైన ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా, కీర్తనా కవిత్వానికి తగిన గౌరవప్రదమైన సంబోధన మరియు పాద విభజన వాడబడ్డాయి. మూలంలోని సంక్షిప్తతను, సమాంతర నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, חֶסֶד‌కు ‘నిబద్ధ ప్రేమ’ను ఎంచుకున్నాం. అందించిన ఆంగ్ల పాఠంలో [a] గుర్తు ‘strength’ తరువాత ఉన్నప్పటికీ, దాని పాదటిప్పణి స్పష్టంగా אֱלֹהֵי חַסְדִּי గురించినది కాబట్టి తెలుగు ప్రధాన పాఠంలో ఆ గుర్తును సంబంధిత పదబంధం తరువాత ఉంచాం.
