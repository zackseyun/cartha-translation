review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the vocative 'my strength,' the directional 'to you,' the resolve to sing praise, God as the psalmist's stronghold, and the compressed final Hebrew construct. However, the Telugu postposition కు in 'నా నిబద్ధ ప్రేమకు దేవుడు' means 'God for/to my steadfast love,' not 'God of my steadfast love.'
  naturalness: The poetic lineation and register are appropriate. Replacing కు with the genitive యొక్క makes the final phrase grammatically intelligible in Telugu while retaining the deliberately compressed, somewhat unusual Hebrew expression.
  terminology: '''నా బలమా,'' ''స్తుతిగానం చేస్తాను,'' ''దుర్గం,'' and ''నిబద్ధ ప్రేమ'' are suitable modern-standard Telugu choices. The revised wording preserves the final phrase''s ambiguity rather than selecting the interpretive rendering ''the God who shows me steadfast love.'''
  issues:
  - severity: medium
    issue: The final construct phrase is rendered with the dative postposition కు.
    rationale: Hebrew אֱלֹהֵי חַסְדִּי is literally 'God of my steadfast love.' Telugu కు expresses a dative/purposive relation and materially distorts that syntactic relation. యొక్క supplies the required genitive without resolving the phrase's debated semantic force.
  revised_text: 'నా బలమా, నీకు స్తుతిగానం చేస్తాను;

    ఎందుకంటే దేవుడు నా దుర్గం,

    నా నిబద్ధ ప్రేమయొక్క దేవుడు[a].'
  revised_footnotes:
  - marker: a
    text: లేదా ‘నా కృపగల దేవుడు,’ లేదా ‘నాపట్ల నిబద్ధ ప్రేమ చూపించే దేవుడు.’ హెబ్రీలో వాచ్యార్థం ‘నా నిబద్ధ ప్రేమయొక్క దేవుడు.’
    reason: alternative_reading
  revision_rationale: A single grammatical correction changes the Telugu dative relation to a genitive relation in the final line. This maintains the Hebrew's compact and interpretively open expression, while the footnote provides natural alternative construals.
