- from: 'వాళ్లు ఆహారం కోసం అటూ ఇటూ తిరుగుతారు;

    తృప్తి చెందకపోతే రాత్రంతా అక్కడే ఉంటారు.[a]'
  to: 'వారు ఆహారం కోసం అటూ ఇటూ తిరుగుతారు;

    తృప్తి చెందకపోతే రాత్రి బస చేస్తారు.[a]'
  rationale: The revision removes the unsupported locative addition “అక్కడే,” uses a direct and natural equivalent for lodging overnight, and raises the pronoun to modern standard Telugu register. The footnote preserves the genuine lexical and contextual ambiguity without deciding it doctrinally or suppressing either reading.
