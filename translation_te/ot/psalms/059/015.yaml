  yaml_path: translation/ot/psalms/059/015.yaml
  text: They wander about for food[a]; if they are not satisfied[b], they spend the night.
translation:
  language: te
  text: 'వారు ఆహారం కోసం అటూ ఇటూ తిరుగుతారు;

    తృప్తి చెందకపోతే రాత్రి బస చేస్తారు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గుర్రుమంటారు.” హీబ్రూ క్రియను “రాత్రి బస చేస్తారు” లేదా “రాత్రి గడుపుతారు” అని అర్థం చేసుకోవచ్చు; అదే రూపాన్ని “గొణుగుతారు” లేదా “గుర్రుమంటారు” అని కూడా విశ్లేషించవచ్చు. చుట్టుపక్కల వచనాల్లో శత్రువులను గుర్రుమనే కుక్కలతో పోల్చడం ఈ రెండవ అర్థానికి బలం ఇస్తుంది.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: הֵמָּה
  choice: వాళ్లు
  rationale: మూడవ పురుష బహువచన సర్వనామం. సందర్భంలోని శత్రువులను సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది; హీబ్రూలోని స్వల్ప ఉద్ఘాటనను అతిగా విస్తరించలేదు.
- source_word: ינועון
  choice: అటూ ఇటూ తిరుగుతారు
  rationale: נוּעַ అనే ధాతువు అటూ ఇటూ కదలడం లేదా సంచరించడం అనే భావాన్ని ఇస్తుంది. ఆహారం వెదుకుతున్న ఆకలిగొన్న కుక్కల సందర్భంలో ఈ ప్రయోగం సహజంగా సరిపోతుంది.
- source_word: לֶאֱכֹל
  choice: ఆహారం కోసం
  rationale: אָכַל ధాతువు యొక్క అసమాపక క్రియారూపానికి לְ చేరి ఉద్దేశాన్ని, అంటే ‘తినడానికి,’ తెలియజేస్తుంది. తెలుగులో ‘ఆహారం కోసం’ అనేది సహజంగా ఉండి వెదుకులాట భావాన్ని స్పష్టం చేస్తుంది.
- source_word: אִם לֹא יִשְׂבְּעוּ
  choice: తృప్తి చెందకపోతే
  rationale: ఈ పదబంధాన్ని నేరుగా షరతుగా అనువదించాం. שׂבע ముఖ్యంగా ఆహారంతో కడుపు నిండి తృప్తి పొందడాన్ని సూచిస్తుంది.
- source_word: וַיָּלִינוּ
  choice: రాత్రంతా అక్కడే ఉంటారు
  rationale: לוּן/לִין యొక్క సాధారణ అర్థమైన ‘రాత్రి బసచేయడం, రాత్రి గడపడం’ ఆధారంగా ప్రధాన పాఠం రూపొందింది. కుక్కల రూపక సందర్భంలో ‘గుర్రుమంటారు’ అనే మరో సాధ్యమైన విశ్లేషణను పాదసూచికలో ఉంచి మూలంలోని నిజమైన సందిగ్ధతను కాపాడాం.
