translation_notes:
  register: సామాన్య పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగును ఉపయోగించాం. కవితా పాద విభజనను నిలిపి, ‘అటూ ఇటూ తిరుగుతారు’ ద్వారా నిరంతర సంచార భావాన్ని సహజంగా వ్యక్తం చేశాం.
