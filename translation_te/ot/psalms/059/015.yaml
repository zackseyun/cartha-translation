    text: లేదా “గుర్రుమంటారు.” హీబ్రూ క్రియను “రాత్రి బస చేస్తారు” లేదా “రాత్రి గడుపుతారు” అని అర్థం చేసుకోవచ్చు; అదే రూపాన్ని “గొణుగుతారు” లేదా “గుర్రుమంటారు” అని కూడా విశ్లేషించవచ్చు. చుట్టుపక్కల వచనాల్లో శత్రువులను గుర్రుమనే కుక్కలతో పోల్చడం ఈ రెండవ అర్థానికి బలం ఇస్తుంది.
