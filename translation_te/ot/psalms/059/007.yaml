id: PSA.59.7
reference: Psalms 59:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִנֵּ֤ה יַבִּ֘יע֤וּ/ן בְּ/פִי/הֶ֗ם חֲ֭רָבוֹת בְּ/שִׂפְתוֹתֵי/הֶ֑ם כִּי מִ֥י שֹׁמֵֽעַ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/007.yaml
  text: Look[a], they pour out from their mouths; swords are on their lips, for they say[b], “Who hears?”
translation:
  language: te
  text: ఇదిగో, వారు తమ నోళ్లనుండి మాటలను కుమ్మరిస్తారు[a]; వారి పెదవులపై కత్తులు ఉన్నాయి. ఎందుకంటే వారు, “ఎవరు వింటారు?”[b] అని అంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారు తమ నోళ్లనుండి మాటలను ఉప్పొంగించి వెలువరిస్తారు’; హీబ్రూ క్రియ మాటలు బుడగలెత్తినట్లు ఉప్పొంగి లేదా ప్రవాహంలా వెలువడే చిత్రాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో కేవలం ‘ఎవరు వింటారు?’ అని ఉంది. ఎవరిని లేదా దేనిని వింటారో చెప్పకపోవడం వల్ల వారి అహంకారపు వాదన ఉద్దేశపూర్వకంగా విస్తృతార్థంతో నిలుస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని ఆకర్షించే హీబ్రూ సూచనార్థక అవ్యయానికి సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు సమానం.
- source_word: יַבִּיעוּן
  choice: మాటలు ఉప్పొంగిస్తారు
  rationale: నבע హిఫీల్ రూపం బుడగలెత్తుతూ లేదా ప్రవాహంలా బయటికి రావడాన్ని సూచిస్తుంది. తెలుగులో కర్మను చెప్పకుండా ‘ఉప్పొంగిస్తారు’ అనడం అసహజంగా ఉండటంతో, సందర్భానుసారంగా ‘మాటలు’ చేర్చి మూలంలోని సజీవ చిత్రాన్ని నిలిపాం.
- source_word: בְּפִיהֶם
  choice: తమ నోళ్లనుండి
  rationale: మూల ఉపసర్గ సాధారణంగా ‘లో/తో’ అయినా, ఉప్పొంగి వెలువడే క్రియాచిత్రంతో తెలుగులో ‘నుండి’ సహజంగా ఉంటుంది.
- source_word: חֲרָבוֹת
  choice: కత్తులు
  rationale: హానికరమైన మాటలకు రూపకంగా వాడినప్పటికీ, మూలంలోని స్పష్టమైన ‘కత్తులు’ అనే చిత్రాన్ని వ్యాఖ్యానించి మార్చకుండా నిలిపాం.
- source_word: בְּשִׂפְתוֹתֵיהֶם
  choice: వారి పెదవులపై
  rationale: మాటలు పలకడానికి సిద్ధంగా ఉన్నాయనే కవితాత్మక చిత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే … అని వారు అంటారు
  rationale: כִּי కారణాన్ని పరిచయం చేస్తుంది; తరువాతి ప్రశ్న ప్రత్యక్ష పలుకుగా ఉందని తెలుగులో స్పష్టం చేయడానికి ‘అని వారు అంటారు’ చేర్చాం.
- source_word: מִי שֹׁמֵעַ
  choice: ఎవరు వింటారు?
  rationale: హీబ్రూ వర్తమాన క్రియార్థక రూపంలోని సంక్షిప్త అలంకార ప్రశ్నను, వినబడే కర్మను చేర్చకుండా నిలిపే సహజమైన తెలుగు.
theological_decisions:
- issue: ‘వినడం’ అనే క్రియకు కర్మ ఎవరు లేదా ఏమిటి అన్నది
  choice: “ఎవరు వింటారు?” అని కర్మను పేర్కొనకుండా ఉంచడం
  alternative: “మన మాటలు ఎవరు వింటారు?” లేదా “మనలను ఎవరు వింటారు?”
  rationale: హీబ్రూ మూలంలో కర్మ లేదు. దుష్టులు ఎవ్వరూ—దేవుడు సహా—వినడం లేదన్నట్టు మాట్లాడే అహంకారాన్ని పాఠ్యం సూచించినా, దానిని స్పష్టీకరించి మూలంలోని ఉద్దేశపూర్వక అనిశ్చితిని తొలగించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక రూపకాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన భాష. ‘మాటలు’ సందర్భార్థంగా చేర్చబడింది; ‘కత్తులు’ రెండుసార్లు రావకుండా మూల వాక్య నిర్మాణం గౌరవించబడింది.
