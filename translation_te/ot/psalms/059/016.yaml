base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/016.yaml
  text: But I will sing of your strength[a]; I will sing aloud of your steadfast love in the morning, for you have been a stronghold for me[c][b], and a refuge in the day of my distress.
translation:
  language: te
  text: 'కాని నేను నీ బలాన్ని గూర్చి పాడుతాను;


    ఉదయాన నీ నిబద్ధ ప్రేమను గూర్చి ఆనందగానం చేస్తాను[a].


    ఎందుకంటే నీవు నాకు ఎత్తైన కోటగా,


    నా ఆపద దినంలో ఆశ్రయంగా ఉన్నావు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఆనందగానం చేస్తాను” అని అనువదించిన హీబ్రూ క్రియకు “ఆనందంతో కేకలు వేస్తాను” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: కాని నేను
  rationale: స్వతంత్ర సర్వనామంతో కూడిన సంధి, ముందు చెప్పిన శత్రువుల ప్రవర్తనకు కీర్తనకర్త స్పందనను వ్యతిరేకంగా నిలుపుతుంది.
- source_word: אָשִׁיר עֻזֶּךָ
  choice: నీ బలాన్ని గూర్చి పాడుతాను
  rationale: దేవుని శక్తివంతమైన రక్షణను గానవిషయంగా చూపుతూ, అసంపూర్ణ క్రియలోని సంకల్ప లేదా భవిష్యత్ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וַאֲרַנֵּן
  choice: ఆనందగానం చేస్తాను
  rationale: רנן అనే క్రియలో గానం మాత్రమే కాక ఉల్లాసంగా బిగ్గరగా హర్షధ్వని చేయడం కూడా ఉంది; ఈ ఎంపిక దాని సంగీతాత్మకతను, ఆనంద తీవ్రతను రెండింటినీ నిలుపుతుంది.
- source_word: לַבֹּקֶר
  choice: ఉదయాన
  rationale: ఇది కాలసూచక పదబంధం; సందర్భంలోని రాత్రి-ఉదయం వ్యత్యాసానికి సరిపోయే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: חַסְדֶּךָ
  choice: నీ నిబద్ధ ప్రేమ
  rationale: חסד లోని నిలకడైన విశ్వసనీయత, సంబంధపరమైన విధేయత, ప్రేమ అనే భావాలను మతశాఖాపరమైన పదజాలం లేకుండా వ్యక్తం చేస్తుంది.
- source_word: מִשְׂגָּב
  choice: ఎత్తైన కోట
  rationale: సురక్షితమైన ఎత్తైన స్థలం లేదా దుర్గం అనే మూలపద చిత్రాన్ని నిలుపుతుంది.
- source_word: וּמָנוֹס
  choice: ఆశ్రయం
  rationale: ఆపదలో భద్రత కోసం పారిపోయి చేరే స్థలం అనే భావాన్ని సహజంగా తెలియజేస్తుంది; ‘ఎత్తైన కోట’తో ఉన్న సూక్ష్మ భేదాన్ని కూడా కాపాడుతుంది.
- source_word: בְּיוֹם צַר לִי
  choice: నా ఆపద రోజున
  rationale: వ్యక్తిగత కష్టకాలాన్ని ‘రోజు’ అనే హీబ్రూ చిత్రంతోనే సంక్షిప్తంగా, స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: దైవిక విమోచన సందర్భంలో חֶסֶד అనువాదం
  choice: నీ నిబద్ధ ప్రేమ
  alternative: నీ నిలకడైన ప్రేమ; నీ ఒడంబడిక ప్రేమ; నీ కృప
  rationale: ఈ పదం దేవుడు రక్షణలో చూపిన విశ్వసనీయమైన, నిలిచే ప్రేమను సూచిస్తుంది. ‘నిబద్ధ ప్రేమ’ సంబంధపరమైన విధేయతను తెలియజేస్తూనే, మూలంలో తప్పనిసరిగా స్పష్టీకరించని ఒడంబడిక భావాన్ని ప్రధాన పాఠ్యంలో అతిగా నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని, సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదజాలాన్ని ఉపయోగించాం. హీబ్రూ సమాంతర నిర్మాణం మరియు ‘ఎత్తైన కోట/ఆశ్రయం’ అనే వేర్వేరు రక్షణ చిత్రాలు నిలుపబడ్డాయి.
