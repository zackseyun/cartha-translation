  variant: modern standard Telugu
source:
  edition: WLC
  text: אַל תַּהַרְגֵ֤/ם פֶּֽן יִשְׁכְּח֬וּ עַמִּ֗/י הֲנִיעֵ֣/מוֹ בְ֭/חֵילְ/ךָ וְ/הוֹרִידֵ֑/מוֹ מָֽגִנֵּ֣/נוּ אֲדֹנָֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/011.yaml
  text: Do not kill them[a], lest my people forget; make them wander by your power and bring them down[b], O Lord our shield.
translation:
  language: te
  text: వారిని చంపవద్దు; లేకపోతే నా ప్రజలు మరచిపోతారు. నీ బలంతో[b] వారిని అల్లాడేలా చేయి[a]; వారిని పడద్రోయి, మా డాలువైన ప్రభువా!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారిని అటూ ఇటూ తిరిగేలా చేయి,’ ‘వారిని కదిలించు,’ లేదా ‘వారిని తూలేలా చేయి.’ హీబ్రూ క్రియ అశాంతమైన చలనాన్ని లేదా అస్థిరతను కలిగించడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నీ శక్తితో.’ హీబ్రూ పదం బలం, శక్తి, లేదా సైనిక బలాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּהַרְגֵמוֹ
  choice: వారిని చంపవద్దు
  rationale: నిషేధార్థకమైన אַל తో వచ్చిన הרג క్రియను సాధారణమైన, స్పష్టమైన ఆధునిక తెలుగులో నేరుగా అనువదిస్తుంది.
- source_word: פֶּן יִשְׁכְּחוּ עַמִּי
  choice: లేకపోతే నా ప్రజలు మరచిపోతారు
  rationale: פֶּן సూచించే భయపడిన ప్రతికూల ఫలితాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; వారు ఏమి మరచిపోతారో మూలపాఠం చెప్పనందున అనువాదమూ దానిని పూరించదు.
- source_word: הֲנִיעֵמוֹ
  choice: వారిని అల్లాడేలా చేయి
  rationale: ఈ causative క్రియలోని నిరంతర చలనం లేదా అస్థిరత భావాన్ని ‘అల్లాడేలా చేయి’ సహజంగా అందిస్తుంది; ‘తిరిగేలా చేయి,’ ‘కదిలించు,’ ‘తూలేలా చేయి’ కూడా సందర్భానుసారం సాధ్యమే.
- source_word: בְחֵילְךָ
  choice: నీ బలంతో
  rationale: חַיִל ఇక్కడ బలం, శక్తి లేదా సైనిక బలాన్ని సూచించగలదు. దేవునికి సంబోధనగా ఉన్న ఈ సందర్భంలో సాధనార్థక בְּ ను ‘నీ బలంతో’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהוֹרִידֵמוֹ
  choice: వారిని పడద్రోయి
  rationale: ירד యొక్క causative రూపంలోని ‘కిందికి దించడం’ అనే రూపకాన్ని కాపాడుతూ, అవమానించడం లేదా అణచివేయడం అనే ఒక్క వివరణకు పరిమితం చేయదు.
- source_word: מָגִנֵּנוּ
  choice: మా డాలు
  rationale: కీర్తనలలో దేవునికి వాడే స్పష్టమైన ‘డాలు’ రూపకాన్ని ‘రక్షకుడు’ వంటి భావానువాదంగా మార్చకుండా నిలుపుతుంది.
- source_word: אֲדֹנָי
  choice: ప్రభువా
  rationale: ఇది ప్రత్యక్ష సంబోధనలోని దైవ బిరుదు; తెలుగు సంబోధన రూపమైన ‘ప్రభువా’ దాని ప్రయోగాన్ని సహజంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: కోరుతున్న తీర్పు స్వభావం
  choice: శత్రువులను వెంటనే చంపకుండా, ప్రజలు మరచిపోని విధంగా వారిని అల్లాడించి పడద్రోయమని దేవునిని కోరడం
  alternative: వారు సంచరించాలని నిర్దిష్టంగా చెప్పకుండా, వారిని అస్థిరపరచి అణచివేయమనే సాధారణ విన్నపంగా అర్థం చేసుకోవడం
  rationale: ‘చంపవద్దు ... అల్లాడేలా చేయి ... పడద్రోయి’ అనే క్రమం తక్షణ మరణానికీ కొనసాగుతున్న, కనబడే తీర్పుకూ మధ్య ఉన్న ఉద్రిక్తతను చూపుతుంది. అనువాదం దానిని మరింత నిర్దిష్టమైన సిద్ధాంతంగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రార్థనా శైలి వాడబడింది. ‘డాలు’ అనే స్పష్టమైన కీర్తనా రూపకం నిలుపబడింది. తెలుగు వాక్యక్రమం వల్ల [b] గుర్తు [a] కంటే ముందుగా కనిపిస్తుంది; రెండూ తాము వివరిస్తున్న పదబంధాలకే జతచేయబడ్డాయి.
