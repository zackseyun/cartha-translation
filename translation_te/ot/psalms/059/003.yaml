revisions:
- from: ఎందుకంటే, ఇదిగో, వారు నా ప్రాణం కోసం పొంచి ఉన్నారు; బలవంతులు నా మీదికి గుంపుగా వస్తున్నారు. యెహోవా, ఇది నా అతిక్రమం వల్లగానీ నా పాపం వల్లగానీ కాదు.
  to: ఎందుకంటే, ఇదిగో, వారు నా ప్రాణం మీద మాటువేసి ఉన్నారు; బలవంతులు నాకు విరోధంగా సమకూడుతున్నారు. యెహోవా, నా అతిక్రమం వల్ల కాదు, నా పాపం వల్ల కూడా కాదు.
  rationale: The revision retains the draft’s modern, prayerful Telugu and its established rendering of the divine name, while making the hostile gathering and the elliptical ‘not because of my transgression or sin’ more faithful to the Hebrew syntax and sense.
