id: PSA.59.3
reference: Psalms 59:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י הִנֵּ֪ה אָֽרְב֡וּ לְ/נַפְשִׁ֗/י יָג֣וּרוּ עָלַ֣/י עַזִ֑ים לֹא פִשְׁעִ֖/י וְ/לֹא חַטָּאתִ֣/י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/003.yaml
  text: For look, they lie in wait for my life; fierce men gather against me, for no transgression or sin of mine, O LORD.
translation:
  language: te
  text: ఎందుకంటే, ఇదిగో, వారు నా ప్రాణం మీద మాటువేసి ఉన్నారు; బలవంతులు నాకు విరోధంగా సమకూడుతున్నారు. యెహోవా, నా అతిక్రమం వల్ల కాదు, నా పాపం వల్ల కూడా కాదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే హీబ్రూ సూచనార్థక పదాన్ని సహజమైన, గంభీరమైన తెలుగులో నిలుపుతుంది.
- source_word: אָרְבוּ לְנַפְשִׁי
  choice: నా ప్రాణం కోసం పొంచి ఉన్నారు
  rationale: אָרב యొక్క రహస్యంగా మాటువేయడం అనే భావాన్నీ, נֶפֶשׁ ఇక్కడ ప్రాణం/జీవితం అనే అర్థాన్నీ ప్రతిబింబిస్తుంది.
- source_word: יָגוּרוּ עָלַי
  choice: నా మీదికి గుంపుగా వస్తున్నారు
  rationale: ఈ సందర్భంలో క్రియకు ఉన్న శత్రుత్వంతో కూడి సమకూడడం/దాడికి గుంపుకావడం అనే భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: עַזִּים
  choice: బలవంతులు
  rationale: పదానికి ప్రాథమికంగా ఉన్న బలమైన లేదా శక్తిమంతమైన వ్యక్తులు అనే అర్థాన్ని కాపాడుతుంది; ‘క్రూరులు’ అని ఉద్దేశాన్ని అధికంగా నిర్ధారించదు.
- source_word: פִשְׁעִי ... חַטָּאתִי
  choice: నా అతిక్రమం ... నా పాపం
  rationale: פשע లోని తిరుగుబాటు/అతిక్రమ భావాన్నీ, חטאת అనే విస్తృత పాపపదాన్నీ వేర్వేరుగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలోని దైవనామాన్ని సాధారణ తెలుగు బైబిలు వాడుకలో గుర్తించదగిన రూపంలో ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: కీర్తనకర్త తన నిర్దోషిత్వాన్ని ప్రకటించడం
  choice: ఇది నా అతిక్రమం వల్లగానీ నా పాపం వల్లగానీ కాదు
  alternative: నాలో ఏ అతిక్రమమూ పాపమూ లేదు
  rationale: హీబ్రూ వాక్యం శత్రువుల దాడికి తన అతిక్రమం లేదా పాపం కారణం కాదని చెబుతుంది; సంపూర్ణ పాపరాహిత్య ప్రకటనగా విస్తరించకుండా ఆ సందర్భార్థాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనా కీర్తనకు తగిన గంభీరతతో రూపొందించబడింది. మూలంలోని సంబోధనను చివరికి దగ్గరగా ఉంచి, తెలుగు వాక్యప్రవాహం కోసం చివరి ఉపవాక్యంలో సహజంగా అమర్చాం.
