base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/000.yaml
  text: 'For the choir director: “Do Not Destroy.” Of David[a]. A miktam, when Saul sent men[d][c][b], and they watched the house to kill him.'
translation:
  language: te
  text: సంగీత నాయకునికి. “నాశనం చేయవద్దు” అనే రాగానికి.[a] దావీదుకు చెందిన మిక్తాం.[b] సౌలు మనుషులను పంపగా, వారు అతనిని చంపడానికి ఆ ఇంటిపై నిఘా ఉంచారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నాశనం చేయవద్దు” అనేది బహుశా ఒక రాగం పేరు లేదా సంగీత సూచన.
    reason: cultural_note
  - marker: b
    text: “మిక్తాం” అనే హీబ్రూ పదానికి ఖచ్చితమైన అర్థం తెలియదు; అందువల్ల దానిని అనువదించకుండా లిప్యంతరీకరించాం.
    reason: lexical_alternative
  - marker: c
    text: 'మరింత అక్షరార్థంగా: “సౌలు పంపినప్పుడు, వారు అతనిని చంపడానికి ఆ ఇంటిని గమనించారు.” హీబ్రూలో “మనుషులను” అనే పదం లేదు; అయితే తరువాతి బహువచన క్రియ పంపబడినవారు పలువురని సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకునికి
  rationale: కీర్తన శీర్షికలోని సంగీత నిర్వహణ బాధ్యతగల వ్యక్తిని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండే కార్యపరమైన అనువాదం.
- source_word: אַל־תַּשְׁחֵת
  choice: “నాశనం చేయవద్దు” అనే రాగంలో పాడాలి
  rationale: ఇది కీర్తనలోని ఆజ్ఞగా కాక, బహుశా రాగం లేదా సంగీత సూచన పేరుగా ఉంది; అర్థాన్ని ప్రధాన పాఠంలో స్పష్టంచేసి, అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: לְדָוִד
  choice: దావీదుకు చెందిన
  rationale: לְ వల్ల ఉండే రచయితత్వం, అనుబంధం లేదా అంకితం అనే విస్తృత సంబంధాన్ని ‘రచించిన’ అని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: מִכְתָּם
  choice: మిక్తాం
  rationale: పదానికి ఖచ్చితమైన అర్థం తెలియనందున ఊహాత్మక అనువాదం బదులు లిప్యంతరీకరణ చేయబడింది.
- source_word: בִּשְׁלֹחַ שָׁאוּל
  choice: సౌలు మనుషులను పంపినప్పుడు
  rationale: హీబ్రూ పాఠంలో ‘మనుషులను’ అని ప్రత్యక్షంగా లేకపోయినా, తరువాతి బహువచన క్రియ పంపబడిన ప్రతినిధులను సూచిస్తుంది; సహజమైన తెలుగుకోసం పదం పూరించబడింది.
- source_word: וַיִּשְׁמְרוּ אֶת־הַבַּיִת
  choice: వారు ... ఆ ఇంటి దగ్గర కాపుకాశారు
  rationale: హత్య ఉద్దేశం ఉన్నందున ఇది రక్షణార్థక కాపలా కాక నిఘా/ముట్టడి భావం; తెలుగులో ‘ఇంటిని కాపుకాశారు’ రక్షణ భావం కలిగించవచ్చు కాబట్టి ‘ఇంటి దగ్గర’ వాడబడింది.
- source_word: לַהֲמִיתוֹ
  choice: దావీదును చంపడానికి
  rationale: ఉద్దేశాన్ని తెలిపే క్రియారూపాన్ని సూటిగా అందిస్తుంది; ‘అతనిని’ అనే అస్పష్టతను శీర్షిక సందర్భంలోని దావీదు పేరుతో సహజంగా స్పష్టం చేస్తుంది.
