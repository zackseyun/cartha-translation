  yaml_path: translation/ot/psalms/059/010.yaml
  text: The God of his steadfast love will go before me[b][a]; God will let me look on my enemies.
translation:
  language: te
  text: 'తన స్థిరమైన ప్రేమగల దేవుడు[b] నాకు ముందుగా వెళ్తాడు[a];

    దేవుడు నా శత్రువులను నాకు చూపిస్తాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'వేరొక స్వరవిన్యాసాన్ని లేదా అనువాద సంప్రదాయాన్ని అనుసరిస్తే: “నా దేవుడు తన స్థిరమైన ప్రేమతో నాకు ముందుగా వెళ్తాడు” లేదా “స్థిరమైన ప్రేమగల నా దేవుడు నాకు ముందుగా వెళ్తాడు.”'
    reason: alternative_reading
  - marker: b
    text: “స్థిరమైన ప్రేమ” అని అనువదించిన హీబ్రూ పదం హెసెద్. ఇది తరచుగా విశ్వసనీయమైన ప్రేమను, నిబంధనకు కట్టుబడిన ప్రేమను లేదా కనికరాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי
  choice: దేవుడైనవాడు
  rationale: ఇది אֱלֹהִים పదపు సమాస రూపం; తరువాతి חַסְדּוֹతో ఉన్న సంబంధాన్ని తెలుగులో ‘...కు దేవుడైనవాడు’ అనే నిర్మాణంతో నిలుపుకుంది.
- source_word: חַסְדּוֹ
  choice: ఆయన నిలకడైన ప్రేమ
  rationale: חֶסֶד విశ్వసనీయమైన, నిబంధనకు కట్టుబడిన ప్రేమ లేదా కనికరాన్ని సూచించగలదు. ‘నిలకడైన ప్రేమ’ దాని ప్రేమభావాన్నీ స్థిరత్వాన్నీ మితిమీరిన సిద్ధాంత వివరణ లేకుండా తెలియజేస్తుంది; మూడవ పురుష ఏకవచన ప్రత్యయాన్ని ‘ఆయన’గా నిలిపింది.
- source_word: יְקַדְּמֵנִי
  choice: నాకు ముందుగా వెళ్తాడు
  rationale: קדם పియేల్ రూపం ముందుకు రావడం, ఎదుర్కోవడం లేదా ముందుగా వెళ్లడం అనే భావాలను కలిగి ఉంది. సందర్భంలో ముందుగానే సహాయం చేసే భావాన్ని, దాని స్థలకాల పరమైన బలాన్ని ఈ అనువాదం కాపాడుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: హీబ్రూలో దేవుని పదం మళ్లీ స్పష్టంగా ఉన్నందున సర్వనామంతో మార్చకుండా పునరుక్తిని నిలిపింది.
- source_word: יַרְאֵנִי
  choice: నేను చూసేలా చేస్తాడు
  rationale: ראה హిఫీల్ రూపం ‘చూసేలా చేయడం’ అనే కారణార్థక భావాన్ని ఇస్తుంది. శత్రువులపై విజయం చూచే అంతర్భావం ఉండవచ్చుగాని, ‘విజయం’ను మూలపాఠంలో లేనంత స్పష్టంగా చేర్చలేదు.
- source_word: בְשֹׁרְרָי
  choice: నా శత్రువులను
  rationale: שׁורר ఇక్కడ విరోధులను సూచిస్తుంది. ఆధునిక తెలుగులో ‘నా శత్రువులు’ స్పష్టమైన, సహజమైన సమానార్థకం.
theological_decisions:
- issue: חַסְדּוֹలోని సర్వనామ ప్రత్యయం మరియు అసాధారణ సమాస నిర్మాణం
  choice: ఆయన నిలకడైన ప్రేమకు దేవుడైనవాడు
  alternative: నా దేవుడు తన నిలకడైన ప్రేమతో / నిలకడైన ప్రేమగల నా దేవుడు
  rationale: మసొరేటిక్ స్వరవిన్యాసం మూడవ పురుష ఏకవచన ప్రత్యయాన్ని (‘ఆయన’) ఇస్తుంది; అందువల్ల ప్రధాన పాఠం అందించిన WLCను నేరుగా అనుసరిస్తుంది. వాక్యనిర్మాణం అసాధారణంగా ఉన్నందున ప్రాచుర్యంలో ఉన్న భిన్న స్వరవిన్యాసం లేదా అనువాద సంప్రదాయాన్ని పాదటిప్పణిలో ఉంచింది; ప్రధాన పాఠంలో దానిని నిశ్శబ్దంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గంభీరతతో, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. మొదటి అర్ధవాక్యంలోని హీబ్రూ అసాధారణతను పూర్తిగా సులభీకరించకుండా నిలిపి, ముఖ్యమైన ప్రత్యామ్నాయ పఠనాన్ని పాదటిప్పణిలో ఇచ్చింది.
