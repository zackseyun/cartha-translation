source:
  edition: WLC
  text: יַֽחְפְּֽשׂוּ עוֹלֹ֗ת תַּ֭מְנוּ חֵ֣פֶשׂ מְחֻפָּ֑שׂ וְ/קֶ֥רֶב אִ֝֗ישׁ וְ/לֵ֣ב עָמֹֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/006.yaml
  text: 'They devise injustices: “We have perfected a carefully concealed plot.” And the inward part of each man, and the heart, are deep.'
translation:
  language: te
  text: 'వారు అన్యాయ కార్యాలను క్షుణ్ణంగా ఆలోచిస్తారు:


    “మేము క్షుణ్ణంగా ఆలోచించి రూపొందించిన పథకాన్ని పూర్తిచేశాము” అంటారు.


    ప్రతి మనిషి అంతరంగమూ హృదయమూ లోతైనవి.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַחְפְּשׂוּ עוֹלֹת
  choice: అన్యాయపు పన్నాగాలు పన్నుతారు
  rationale: חפשׂ ఇక్కడ వెదకడం/ఆలోచించి రూపొందించడం అనే భావాన్ని, עוֹלֹת అన్యాయమైన కార్యాలను సూచిస్తాయి; సందర్భానుసారంగా కుట్రపూర్వక యోచనను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תַּמְנוּ חֵפֶשׂ מְחֻפָּשׂ
  choice: మేము పన్నాగాన్ని చక్కగా దాచిపెట్టాం
  rationale: ఈ క్లిష్ట పదబంధంలో תמם ‘పూర్తిచేయడం/సిద్ధం చేయడం’ భావమూ, חפשׂ పదపునరుక్తిలో జాగ్రత్తగా వెదకడం లేదా గూఢంగా ఉంచడం భావమూ ఉన్నాయి. సందర్భంలోని రహస్య కుట్రను తెలుగులో సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וְקֶרֶב אִישׁ וְלֵב עָמֹק
  choice: ప్రతి మనిషి అంతరంగం, హృదయం అగాధమైనవి
  rationale: קֶרֶב అంతర్భాగం/అంతరంగం; לֵב ఆలోచన-సంకల్పాల కేంద్రం; עָמֹק లోతైనది, గ్రహించడం కష్టమైనది అనే భావాలను సూచిస్తుంది. ‘అగాధమైనవి’ ఆ గూఢ లోతును నిలుపుతుంది.
theological_decisions:
- issue: మానవ అంతరంగం మరియు హృదయం గురించి చివరి వాక్యంలోని భావసంబంధం
  choice: రెండింటినీ సమాంతరంగా ‘అగాధమైనవి’ అని ఉంచడం
  alternative: ‘మనిషి అంతరంగమూ హృదయమూ ఎంత లోతైనవో!’ లేదా ‘అవి ఎవరికీ అందనంత లోతైనవి’
  rationale: హీబ్రూ వాక్యంలోని సంక్షిప్తత, కవితాత్మక అస్పష్టతను నిలిపి, దానిని ప్రత్యేక సిద్ధాంతపరమైన వ్యాఖ్యగా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తన కవిత్వానికి తగిన గంభీరతతో, సాధారణ పాఠకునికి అర్థమయ్యే పదజాలం. మూలంలోని క్లిష్టమైన రెండో పాదాన్ని అతివివరణ లేకుండా సహజంగా అందించింది.
