source:
  edition: WLC
  text: יִשְׂמַ֬ח צַדִּ֣יק בַּ֭/יהוָה וְ/חָ֣סָה ב֑/וֹ וְ֝/יִתְהַֽלְל֗וּ כָּל יִשְׁרֵי לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/010.yaml
  text: The righteous will rejoice in Yahweh and take refuge in him[a], and all the upright in heart will glory.
translation:
  language: te
  text: నీతిమంతుడు యాహ్వేలో ఆనందిస్తాడు, ఆయనను ఆశ్రయిస్తాడు; హృదయంలో యథార్థత గలవారందరూ గొప్పగా చెప్పుకుంటారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఉల్లసిస్తారు.’ హీబ్రూ క్రియ గొప్పగా చెప్పుకోవడం లేదా ఉల్లసించడం అనే భావాలను ఇవ్వగలదు; ఇక్కడ దేవునిలోను ఆయన చేసిన రక్షణ కార్యంలోను ఆనందించడం అనే సానుకూల భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂמַח
  choice: ఆనందిస్తాడు
  rationale: కావ్య సందర్భంలో ఈ అసంపూర్ణ క్రియ దేవుని తీర్పు తరువాత కలిగే ఫలితాన్ని సూచిస్తుంది; తెలుగు భవిష్యదర్థక రూపం ఆనంద భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: צַדִּיק
  choice: నీతిమంతుడు
  rationale: ఏకవచన విశేషణం నామవాచకంగా వాడబడింది. ‘నీతిమంతుడు’ మూలంలోని ఏకవచనాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: בַּיהוָה
  choice: యాహ్వేలో
  rationale: בְּ ఉపసర్గ ఆనందానికి ఆధారం లేదా పరిధిని సూచిస్తుంది; దేవుని వ్యక్తిగత నామమైన יהוהను ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: וְחָסָה בּוֹ
  choice: ఆయనను ఆశ్రయిస్తాడు
  rationale: חסה రక్షణ కోసం శరణు పొందడాన్ని సూచిస్తుంది. ‘ఆశ్రయిస్తాడు’ ఆ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; సమన్వయమైన కావ్య వాక్యంలో ముందున్న భవిష్యదర్థం దీనికీ వర్తిస్తుంది.
- source_word: וְיִתְהַלְלוּ
  choice: అతిశయిస్తారు
  rationale: הלל యొక్క హిత్పయేల్ రూపం ఉల్లాసంతో గొప్పగా చెప్పుకోవడం లేదా అతిశయించడం అనే భావాన్ని కలిగి ఉంది. ‘అతిశయిస్తారు’ మూలంలోని ప్రశంసాత్మకమైన గొప్పచెప్పుకోవడాన్ని పూర్తిగా సాదాసీదా ఆనందంగా మార్చకుండా నిలుపుతుంది.
- source_word: כָּל יִשְׁרֵי לֵב
  choice: యథార్థ హృదయులందరూ
  rationale: ‘హృదయంలో నిటారుగా ఉన్నవారు’ అనే హీబ్రూ రూపకం అంతరంగ నిజాయితీ, నైతిక యథార్థతను సూచిస్తుంది. ‘యథార్థ హృదయులు’ ఆ అంతరంగ ప్రాధాన్యాన్ని సంక్షిప్తంగా కాపాడుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో నాలుగు అక్షరాల దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా, విస్తృతంగా అంగీకరించబడిన ఉచ్చారణకు అనుగుణంగా ‘యాహ్వే’గా ఇచ్చాం.
- issue: וְיִתְהַלְלוּలోని గొప్పచెప్పుకోవడం సానుకూలమా ప్రతికూలమా
  choice: అతిశయిస్తారు
  alternative: ఉల్లసిస్తారు
  rationale: ఈ సందర్భంలో దేవుని రక్షణ కార్యం వల్ల కలిగే సానుకూల ఉల్లాసమే ప్రధానమైనా, హీబ్రూ క్రియలో ఉన్న ‘గొప్పగా చెప్పుకోవడం’ అనే భావాన్ని పూర్తిగా తొలగించలేదు. పాదసూచిక దాని భావపరిధిని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కావ్య శైలిని ఉపయోగించాం. మూలంలోని ఏకవచన ‘నీతిమంతుడు’ మరియు బహువచన ‘యథార్థ హృదయులందరూ’ అనే మార్పును నిలిపాం. పాదసూచిక సూచికను దానికి సంబంధించిన וְיִתְהַלְלוּ అనువాదం తరువాత ఉంచాం.
