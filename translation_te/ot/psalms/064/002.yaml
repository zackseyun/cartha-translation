translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనాత్మకమైన గౌరవభావంతో రూపొందించబడింది. మూలంలోని సమాంతర నిర్మాణం నిలుపబడింది; సוֹד మరియు רִגְשָׁה పదాల విస్తృత అర్థసాధ్యతలను పాదటిప్పణుల్లో భద్రపరచాం.
