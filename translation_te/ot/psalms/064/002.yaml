source:
  edition: WLC
  text: תַּ֭סְתִּירֵ/נִי מִ/סּ֣וֹד מְרֵעִ֑ים מֵ֝/רִגְשַׁ֗ת פֹּ֣עֲלֵי אָֽוֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/002.yaml
  text: Hide me from the secret counsel of evildoers[b][a], from the tumult of workers of wickedness.
translation:
  language: te
  text: దుష్టుల రహస్య సంప్రదింపుల నుండి[a], దుర్మార్గం చేసేవారి కలకలం నుండి[b] నన్ను దాచు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దుష్టుల రహస్య పన్నాగం నుండి.’ హీబ్రూ పదం గోప్యమైన సంప్రదింపును, సన్నిహిత వర్గాన్ని, లేదా రహస్య పథకాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దుర్మార్గం చేసేవారి గోల నుండి’ లేదా ‘వారి గుంపు నుండి.’ హీబ్రూ పదం శత్రుత్వంతో కూడిన గుంపు కదలికను లేదా గోలగోలగా ఉన్న ఆందోళనను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּירֵנִי
  choice: నన్ను దాచు
  rationale: סתר అనే ధాతువు హిఫీల్ రూపంలో, ప్రథమ పురుష ఏకవచన ప్రత్యయంతో ‘నన్ను దాచు/మరుగుచేయి’ అని అర్థం. సందర్భంలో ఇది దేవునికి చేసిన ప్రత్యక్ష విన్నపం.
- source_word: מִסּוֹד
  choice: రహస్య ఆలోచన నుండి
  rationale: סוֹד అనేది గోప్యమైన సంప్రదింపు, సన్నిహిత వర్గం, లేదా రహస్య పన్నాగాన్ని సూచించగలదు. ‘రహస్య ఆలోచన’ దాని గోప్యతనూ, కలిసి యోచించే భావాన్నీ నిలుపుతుంది.
- source_word: מְרֵעִים
  choice: దుష్టుల
  rationale: רעע ధాతువు నుండి వచ్చిన ఈ కృదంతం చెడు చేసేవారిని సూచిస్తుంది. తెలుగులో ‘దుష్టులు’ సహజంగా, సంక్షిప్తంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: מֵרִגְשַׁת
  choice: అల్లరి నుండి
  rationale: רִגְשָׁה శత్రుత్వపూరితమైన కలకలం, గుంపు కదలిక, లేదా గోలతో కూడిన ఆందోళనను సూచిస్తుంది. ‘అల్లరి’ ఆధునిక తెలుగులో ఈ సందర్భంలోని కల్లోలభరిత కదలికను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: פֹּעֲלֵי אָוֶן
  choice: దుర్మార్గం చేసేవారి
  rationale: ఈ నిర్మాణం ‘దుర్మార్గాన్ని చేసే/నిర్వహించే వారు’ అని అక్షరార్థం. ‘దుర్మార్గం చేసేవారు’ క్రియాశీలమైన, అలవాటైన కార్యాన్ని స్పష్టంగా చూపుతుంది.
