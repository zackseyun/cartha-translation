source:
  edition: WLC
  text: שְׁמַע אֱלֹהִ֣ים קוֹלִ֣/י בְ/שִׂיחִ֑/י מִ/פַּ֥חַד א֝וֹיֵ֗ב תִּצֹּ֥ר חַיָּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/001.yaml
  text: Hear[a], O God, my voice in my complaint; preserve my life from the fear of the enemy.
translation:
  language: te
  text: దేవా, నా ఫిర్యాదులో నా స్వరాన్ని ఆలకించు[a]; శత్రువు భయం నుండి నా ప్రాణాన్ని కాపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా ధ్యానంలో’ లేదా ‘నా మననంలో.’ హీబ్రూ పదం పలికే ఫిర్యాదును గానీ, అంతరంగ ఆలోచనను గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: ఆలకించు
  rationale: దేవునికి చేసిన ప్రత్యక్ష ప్రార్థనలోని ఆజ్ఞార్థక రూపాన్ని గౌరవప్రదంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: హీబ్రూ సంబోధనను సహజమైన తెలుగు ప్రార్థనా శైలిలో నిలుపుతుంది.
- source_word: קוֹלִי
  choice: నా స్వరం
  rationale: మూలంలోని స్పష్టమైన ‘నా స్వరం’ అనే రూపకల్పనను ‘నా ప్రార్థన’గా విస్తరించకుండా కాపాడుతుంది.
- source_word: בְשִׂיחִי
  choice: నా మొరలో
  rationale: శత్రువుల నుండి రక్షణ కోరే విలాప సందర్భంలో పలికిన బాధాపూర్వక మనవిని ‘మొర’ సహజంగా తెలియజేస్తుంది; ధ్యానం లేదా మననం అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: מִפַּחַד אוֹיֵב
  choice: శత్రువు కలిగించే భయం నుండి
  rationale: హీబ్రూ పదబంధంలో శత్రువుకు సంబంధించిన భయం లేదా భీతిని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; భయమే దాడి వస్తువు అన్న భావాన్ని బలవంతంగా నిర్ణయించదు.
- source_word: תִּצֹּר
  choice: కాపాడు
  rationale: నצר అనే ‘కాయు, భద్రపరచు, కాపాడు’ భావాన్ని ‘నా ప్రాణం’తో సహజంగా కలుపుతుంది.
- source_word: חַיָּי
  choice: నా ప్రాణాన్ని
  rationale: ఇక్కడ ప్రమాదంలో ఉన్న జీవితం అనే భావాన్ని సహజ తెలుగులో అందిస్తుంది; ‘ఆత్మ’ అనే అదనపు తాత్త్విక అర్థాన్ని దిగుమతి చేయదు.
theological_decisions:
- issue: בְשִׂיחִי అనే పదానికి విలాప సందర్భంలో ఉన్న అర్థం
  choice: నా మొరలో
  alternative: నా ధ్యానంలో / నా మననంలో
  rationale: శత్రువు నుండి రక్షణ కోరుతున్న సందర్భం ‘మొర’ లేదా విలాప భావానికి మద్దతిస్తుంది. అయితే అంతరంగ మననం అనే నిజమైన పదార్థసంభావ్యతను పాదటిప్పణిలో నిలిపాం.
- issue: מִפַּחַד אוֹיֵב సంబంధం
  choice: శత్రువు కలిగించే భయం నుండి
  alternative: శత్రువు గురించిన భయం నుండి / శత్రువు భీతి నుండి
  rationale: మూలంలో ‘శత్రువు యొక్క భయం’ అనే సంబంధం కొంత విస్తృతంగా ఉంది. తెలుగు వాక్యం సహజంగా ఉండేలా కారణసంబంధాన్ని చూపినా, రక్షణ శత్రువునుంచేనా లేక అతడు కలిగించే భయంనుంచేనా అన్న ఉద్రిక్తతను అతిగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలి. ‘దేవా,’ అనే సంబోధన, ‘ఆలకించు,’ ‘కాపాడు’ అనే రూపాలు సాధారణ పాఠకులకు స్పష్టంగా ఉండి కీర్తనా గంభీరతను నిలుపుతాయి. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
