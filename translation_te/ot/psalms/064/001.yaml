revisions:
- from: దేవా, నా మొరలో నా స్వరం ఆలకించు[a]; శత్రువు కలిగించే భయం నుండి నా ప్రాణాన్ని కాపాడు.
  to: దేవా, నా ఫిర్యాదులో నా స్వరాన్ని ఆలకించు[a]; శత్రువు భయం నుండి నా ప్రాణాన్ని కాపాడు.
  rationale: The revision avoids imposing a causal interpretation on the Hebrew expression for fear/dread in relation to the enemy, improves the idiom of the complaint-and-voice phrase, and preserves the source-supported lexical alternatives in the anchored footnote.
