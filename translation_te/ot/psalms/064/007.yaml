source:
  edition: WLC
  text: וַ/יֹּרֵ֗/ם אֱלֹ֫הִ֥ים חֵ֥ץ פִּתְא֑וֹם הָ֝י֗וּ מַכּוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/007.yaml
  text: But God shoots an arrow at them[a]; suddenly they are wounded.
translation:
  language: te
  text: కాని దేవుడు వారిమీదికి ఒక బాణాన్ని సంధిస్తాడు; అకస్మాత్తుగా వారు గాయపడిపోతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా మరింత రూపనిష్ఠంగా: “కాని దేవుడు వారిమీదికి బాణాన్ని సంధించాడు; అకస్మాత్తుగా వారికి గాయాలయ్యాయి.”'
    reason: וַיֹּרֵם మరియు הָיוּ מַכּוֹתָם అనే హీబ్రూ రూపాలకు సాధ్యమైన మరింత అక్షరానుసార ప్రత్యామ్నాయాన్ని చూపించడం.
lexical_decisions:
- source_word: וַיֹּרֵם
  choice: వారిమీదికి ... వేస్తాడు
  rationale: ירה అనే ధాతువు హిఫిల్ రూపంలో, మూడవ పురుష బహువచన కర్మప్రత్యయంతో ఉంది. దేవుడు కర్తగా, బాణం కర్మగా ఉన్నందున ‘వారిమీదికి బాణం వేస్తాడు’ అని సహజంగా అనువదించాం. హీబ్రూ కథనరూపంలోని సజీవ కవితా చిత్రాన్ని తెలుగులో వర్తమాన కాలంతో నిలిపాం.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ సందర్భంలో ఇశ్రాయేలు దేవుణ్ణి సూచించే ఏకవచన భావం; ఆధునిక ప్రామాణిక తెలుగులో సహజమైన రూపం.
- source_word: חֵץ
  choice: ఒక బాణం
  rationale: ప్రాథమిక అర్థం ‘బాణం’. తెలుగు వాక్యంలో అనిర్దిష్టమైన ఒక్క బాణాన్ని సూచించేందుకు ‘ఒక’ చేర్చడం సహజం.
- source_word: פִּתְאֹם
  choice: అకస్మాత్తుగా
  rationale: దైవిక తీర్పు ఊహించని వేగంతో సంభవించడాన్ని తెలిపే క్రియావిశేషణాన్ని నేరుగా నిలిపాం.
- source_word: הָיוּ מַכּוֹתָם
  choice: వారు గాయపడతారు
  rationale: అక్షరార్థంగా ‘వారి గాయాలు కలిగాయి/ఉన్నాయి’ అనే నామవాచక నిర్మాణం. తెలుగులో ఫలితాన్ని సహజంగా తెలిపేందుకు విధేయ క్రియారూపంలో ఇచ్చాం; మరింత రూపనిష్ఠమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: కవితా చిత్రంలో దైవిక తీర్పు
  choice: దుష్టులపై దేవుడే బాణం వేసి వారిని గాయపరుస్తున్నట్లు నేరుగా అనువదించడం
  alternative: ఈ చిత్రాన్ని కేవలం పరిస్థితుల మార్పుగా మృదువుగా చెప్పడం
  rationale: హీబ్రూ పాఠంలో దేవుడే స్పష్టమైన కర్త. అందువల్ల దేవుని కార్యసాధక పాత్రను తగ్గించకుండా, అలాగే అదనపు సిద్ధాంత వివరణను చేర్చకుండా రూపకాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా, కీర్తనలోని సంక్షిప్తత, ఆకస్మికత, గంభీరతను నిలిపే శైలి. ప్రధాన వాక్యంలో సహజమైన తెలుగు వాక్యనిర్మాణం వాడి, రూపనిష్ఠమైన హీబ్రూ నిర్మాణాన్ని పాదసూచికలో ఇచ్చాం.
