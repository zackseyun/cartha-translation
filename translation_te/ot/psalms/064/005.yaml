id: PSA.64.5
reference: Psalms 64:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יְחַזְּקוּ לָ֨/מוֹ דָּ֘בָ֤ר רָ֗ע יְֽ֭סַפְּרוּ לִ/טְמ֣וֹן מוֹקְשִׁ֑ים אָ֝מְר֗וּ מִ֣י יִרְאֶה לָּֽ/מוֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/005.yaml
  text: They strengthen for themselves an evil matter[a]; they talk of hiding snares; they say[b], “Who will see them?”
translation:
  language: te
  text: వారు చెడు విషయములో తమను తాము బలపరచుకుంటారు[a]; ఉచ్చులను దాచడం గురించి మాట్లాడుకుంటారు. “వాటిని ఎవరు చూస్తారు?” అని అంటారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చెడు విషయం’ అనే మాటను ‘చెడు మాట,’ ‘చెడ్డ వ్యవహారం,’ లేదా సందర్భానుసారం ‘దుష్ట పన్నాగం’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదానికి ఈ విస్తృత అర్థాలు ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: ‘మమ్మల్ని ఎవరు చూస్తారు?’ అని కొందరు భావానువాదం చేస్తారు. అయితే హీబ్రూ రూపం మూడవ పురుష బహువచనంలో ఉంది; సందర్భంలో అది ఉచ్చులను, లేదా విస్తృతంగా వారి దురుద్దేశాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: יְחַזְּקוּ לָמוֹ
  choice: తమ కోసం … బలపరచుకుంటారు
  rationale: חזק పియేల్ రూపంలోని ‘బలపరచడం/దృఢపరచడం’ అనే క్రియాభావాన్ని నిలుపుతూ, సందర్భంలో לָמוֹను ప్రతిబింబక భావంతో సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: דָּבָר רָע
  choice: ఒక దుష్ట పన్నాగం
  rationale: דברకు ‘మాట, విషయం, వ్యవహారం’ అనే విస్తృత అర్థాలు ఉన్నాయి. తరువాత వచ్చే రహస్య ఉచ్చుల సందర్భంలో ‘దుష్ట పన్నాగం’ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; పదంలోని విస్తృతిని పాదసూచికలో నిలుపుతుంది.
- source_word: יְסַפְּרוּ
  choice: చర్చించుకుంటారు
  rationale: ספר పియేల్ సాధారణంగా ‘చెప్పడం/వివరించడం’ అని అర్థమిచ్చినా, ఇక్కడ క్రియానామంతో కలిసి కుట్రదారులు తమ చర్యను పరస్పరం చర్చించడాన్ని సూచిస్తుంది.
- source_word: לִטְמוֹן מוֹקְשִׁים
  choice: ఉచ్చులను దాచిపెట్టడం
  rationale: טמן యొక్క ‘దాచడం’ అనే మూలార్థాన్నీ, מוקשים యొక్క ‘ఉచ్చులు’ అనే అర్థాన్నీ నేరుగా కాపాడుతుంది.
- source_word: אָמְרוּ
  choice: అని అంటారు
  rationale: రూపపరంగా సంపూర్ణ క్రియ అయినప్పటికీ, కీర్తనలో కొనసాగుతున్న చిత్రణలో వర్తమాన శైలిలో చెప్పడం సహజంగా ఉంటుంది.
- source_word: מִי יִרְאֶה לָּמוֹ
  choice: వాటిని ఎవరు చూస్తారు?
  rationale: לָמוֹ మూడవ పురుష బహువచనాన్ని ‘వాటిని’గా నిలుపుతుంది; సమీపంలోని ఉచ్చులనే సూచిస్తున్నట్లు తెలుగులో సహజంగా చదవబడుతుంది, అయితే హీబ్రూ కవిత్వంలో సూచ్యార్థం సంక్షిప్తంగా ఉన్నందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
