id: PSA.64.8
reference: Psalms 64:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּכְשִׁיל֣וּ/הוּ עָלֵ֣י/מוֹ לְשׁוֹנָ֑/ם יִ֝תְנֹדֲד֗וּ כָּל רֹ֥אֵה בָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/008.yaml
  text: They are made to stumble[a]; their own tongue is against them[b]; all who see them shake their heads.
translation:
  language: te
  text: వారి సొంత నాలుక వారికి విరోధమై, వారిని తడబడేలా చేస్తుంది[a]; వారిని చూసే వారందరూ తలలు ఊపుతారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత రూపానుసారంగా: “వారు అతనిని/దానిని తడబడేలా చేశారు; వారి నాలుక వారిమీద ఉంది.” ఈ మొదటి పాదంలోని హీబ్రూ వాక్యనిర్మాణం క్లిష్టమైనది; సర్వనామాలు ఎవరిని లేదా దేనిని సూచిస్తున్నాయనే విషయంలో అనువాదాలు భిన్నంగా ఉన్నాయి. ప్రధాన పాఠం దుష్టులు తమ సొంత మాటలవల్ల పతనమవుతారనే సందర్భార్థాన్ని అనుసరిస్తుంది.'
    reason: alternative_reading
  - marker: b
    text: ఈ క్రియను “తలలు ఆడిస్తారు,” “వణికిపోతారు,” లేదా కొన్ని సందర్భాల్లో “దూరంగా పారిపోతారు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְשִׁילוּהוּ
  choice: వారు తడబడిపోతారు
  rationale: כשׁל హిఫీల్ రూపానికి ‘తడబడేలా చేయడం/పడగొట్టడం’ అనే భావం ఉంది. రూపరీత్యా కర్మ ప్రత్యయం ఏకవచన పుంలింగంలో ఉన్నప్పటికీ, ఈ కవితా వాక్యనిర్మాణం క్లిష్టమైనది. సమీపంలోని బహువచన సూచనలను బట్టి దుష్టులు తమ మాటలవల్ల తామే పతనమవుతున్న భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేసింది.
- source_word: עָלֵימוֹ
  choice: వారికి విరోధమై
  rationale: עַל పదానికి సందర్భానుసారం ‘మీద/విరోధంగా’ అనే అర్థాలు రావచ్చు. ఇక్కడ వారి నాలుక వారికే ప్రతికూలంగా మారుతుందనే భావాన్ని తెలుగులో స్పష్టంగా, అయితే అతివ్యాఖ్యానం లేకుండా అందిస్తుంది.
- source_word: לְשׁוֹנָם
  choice: వారి సొంత నాలుకే
  rationale: హీబ్రూలోని ఏకవచన సమూహార్థకమైన ‘వారి నాలుక’ అనే సజీవ చిత్రాన్ని నిలిపి, తమ మాటలే తమకు హాని కలిగిస్తున్నాయనే నొక్కును ‘సొంత’, ‘ఏ’ ద్వారా సహజంగా తెలిపింది.
- source_word: יִתְנֹדֲדוּ
  choice: తలలు ఊపుతారు
  rationale: נוּד క్రియకు ఊగడం, సంచరించడం, వణకడం వంటి భావాలు ఉన్నాయి. ‘వారిని చూసే వారందరూ’ అనే సందర్భంలో కనిపించే ప్రతిస్పందన లేదా సంజ్ఞగా ‘తలలు ఊపుతారు’ సహజంగా సరిపోతుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచింది.
- source_word: כָּל רֹאֵה בָם
  choice: వారిని చూసే వారందరూ
  rationale: ‘అందరూ’ అనే సార్వత్రిక పరిధినీ, ‘వారిని’ అనే కర్మనూ నేరుగా నిలిపిన సహజ తెలుగు అనువాదం.
theological_decisions:
- issue: మొదటి పాదంలోని కర్త-కర్మ సర్వనామాల అనిశ్చిత సంబంధం
  choice: దుష్టులు తమ సొంత నాలుకవల్ల తడబడిపోతారని సమూహార్థంగా అనువదించడం
  alternative: మరింత రూపానుసారంగా, ‘వారి నాలుక అతణ్ణి/దానిని వారిమీద తడబడేలా చేసింది’ అని అనువదించడం
  rationale: మసొరేటిక్ పాఠంలోని ఏకవచన కర్మ ప్రత్యయం, బహువచన ప్రత్యయం, తరువాత వచ్చే ‘వారి నాలుక’ మధ్య సంబంధం వ్యాకరణపరంగా క్లిష్టంగా ఉంది. ప్రధాన పాఠం సందర్భానికి సరిపోయే భావాన్ని ఇస్తుంది; అయితే ఏ వ్యక్తిని లేదా దేవుని కర్తగా ఊహించి సిద్ధాంతపరంగా ఖరారు చేయకుండా అసలు అనిశ్చితిని పాదసూచికలో వెల్లడిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా ధోరణిని నిలిపింది. ‘నాలుక’ అనే మూర్తమైన హీబ్రూ రూపకాన్ని ఉంచి, క్లిష్టమైన మొదటి పాదాన్ని సాధారణ పాఠకుడికి అర్థమయ్యేలా సహజ వాక్యక్రమంలో ఇచ్చింది. అసలు పాఠంలోని నిజమైన వ్యాకరణ అనిశ్చితిని పాదసూచికలో స్పష్టంగా సంరక్షించింది.
