lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకునికి
  rationale: కీర్తనల శీర్షికల్లో ఈ పదం సంగీత ప్రదర్శనను పర్యవేక్షించే వ్యక్తిని సూచిస్తుంది. ‘సంగీత నాయకుడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, కేవలం సాధారణ నాయకత్వం కాక సంగీత సంబంధమైన బాధ్యతను స్పష్టం చేస్తుంది.
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: ఇది సంగీత సంబంధమైన కీర్తనకు వాడే ప్రామాణిక ప్రక్రియా పదం. కీర్తనల గ్రంథ సందర్భంలో ‘కీర్తన’ స్థిరమైన, సులభంగా అర్థమయ్యే తెలుగు సమానం.
- source_word: לְדָוִד
  choice: దావీదు
  rationale: ‘దావీదు కీర్తన’ అనే తెలుగు నిర్మాణం రచన, సంబంధం లేదా అంకితం అనే హెబ్రీ ప్రయోగంలోని విస్తృత భావాన్ని కొంతవరకు నిలుపుతుంది; ‘దావీదు రచించిన’ అని ప్రధాన పాఠంలో పెట్టడం రచయితత్వాన్ని అనవసరంగా నిర్దిష్టం చేస్తుంది.
theological_decisions:
- issue: శీర్షికలో దావీదుతో ఉన్న సంబంధం
  choice: దావీదు కీర్తన
  alternative: దావీదు రచించిన కీర్తన; దావీదు కోసం కీర్తన
  rationale: హెబ్రీలోని לְ ఉపసర్గ రచయితత్వం, సంబంధం, స్వామ్యం లేదా అంకితాన్ని సూచించగలదు. ప్రధాన పాఠం ఈ నిజమైన అనిశ్చితిని పరిష్కరించకుండా ఉంచుతుంది; ప్రత్యామ్నాయ భావాలు పాదటిప్పణిలో ఇవ్వబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన కీర్తన శీర్షికగా రూపొందించబడింది. పాదటిప్పణి గుర్తు అది వివరిస్తున్న ‘దావీదు కీర్తన’ పదబంధానికే జోడించబడింది.
