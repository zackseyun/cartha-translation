translation:
  language: te
  text: సంగీత నాయకునికి. దావీదు కీర్తన[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దావీదు రచించిన కీర్తన,” లేదా “దావీదు కోసం కీర్తన.” హెబ్రీ పదబంధం రచయితత్వాన్ని, సంబంధాన్ని లేదా అంకితాన్ని సూచించగలదు.
