source:
  edition: WLC
  text: לִ/יר֣וֹת בַּ/מִּסְתָּרִ֣ים תָּ֑ם פִּתְאֹ֥ם יֹ֝רֻ֗/הוּ וְ/לֹ֣א יִירָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/004.yaml
  text: to shoot at the blameless from hiding places[b][a]; suddenly they shoot at him and do not fear.
translation:
  language: te
  text: 'దాచిన చోట్లనుండి నిర్దోషిని[a] గురిచేసి బాణాలు వేయడానికి;

    అకస్మాత్తుగా వారు అతనిపై బాణాలు వేస్తారు, ఏమాత్రం భయపడరు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిందలేనివానిని.’ హీబ్రూ పదం నిర్దోషిత్వాన్ని లేదా నైతిక సమగ్రతను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִירוֹת
  choice: బాణంతో కొట్టడానికి
  rationale: ירה అనే క్రియ ఈ శత్రుత్వ సందర్భంలో బాణం వేయడాన్ని సూచిస్తుంది. తెలుగులో కేవలం ‘కాల్చడానికి’ అంటే ఆధునిక తుపాకి భావం రావచ్చు; అందువల్ల కవితలోని విల్లు-బాణాల దాడి దృశ్యాన్ని సహజంగా తెలియజేయడానికి ఈ రూపం ఎంచుకోబడింది.
- source_word: בַּמִּסְתָּרִים
  choice: దాగుడు స్థలాల నుండి
  rationale: ఈ నామవాచకం దాచబడిన లేదా రహస్య స్థలాలను సూచిస్తుంది. ఉపసర్గ అక్షరార్థంగా ‘లో’ అయినా, పొంచి ఉండి చేసే దాడి దిశను తెలుగులో సహజంగా వ్యక్తపరచడానికి ‘నుండి’ వాడబడింది.
- source_word: תָּם
  choice: నిర్దోషిని
  rationale: תָּם నైతిక సమగ్రతగల లేదా నిందకు తావులేని వ్యక్తిని సూచించగలదు. ఈ సందర్భంలో బాధితుని అన్యాయంగా లక్ష్యంగా చేసుకోవడం ప్రధానంగా ఉండడంతో ‘నిర్దోషి’ సహజంగా ఉంది; ‘నిందలేనివాడు’ అనే నైతిక ఛాయను పాదటిప్పణిలో ఉంచాం.
- source_word: פִּתְאֹם
  choice: అకస్మాత్తుగా
  rationale: దాడి హఠాత్తుగా జరగడాన్ని స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יֹרֻהוּ
  choice: వారు అతనిపై బాణాలు వేస్తారు
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయం ముందున్న ప్రతినిధి ఏకవచనమైన ‘నిర్దోషి’ని తిరిగి సూచిస్తుంది. తెలుగులో తుపాకి భావాన్ని నివారిస్తూ దాడి చర్యను సహజంగా తెలిపేందుకు ‘అతనిపై బాణాలు వేస్తారు’ అని అనువదించబడింది.
- source_word: וְלֹא יִירָאוּ
  choice: భయపడరు
  rationale: హీబ్రూలో భయానికి సంబంధించిన కర్తవ్యవస్తువు చెప్పబడలేదు. కాబట్టి వారు ఎవరికి లేదా దేనికి భయపడరో చేర్చకుండా మూలంలోని సంక్షిప్తత, సందిగ్ధత నిలుపబడింది.
