source:
  edition: WLC
  text: אֲשֶׁ֤ר שָׁנְנ֣וּ כַ/חֶ֣רֶב לְשׁוֹנָ֑/ם דָּרְכ֥וּ חִ֝צָּ֗/ם דָּבָ֥ר מָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/003.yaml
  text: who sharpen their tongue like a sword; they bend their arrow—a bitter word—
translation:
  language: te
  text: 'వారు తమ నాలుకను కత్తిలా పదునుపెట్టారు;

    చేదు మాటను—తమ బాణాన్ని—ఎక్కుపెట్టారు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధాన్ని మరింత అక్షరార్థంగా అనువదిస్తే, “తమ బాణాన్ని వంచారు—చేదు మాటను—” అని రావచ్చు.
    reason: דָּרְכוּ అనే క్రియ సాధారణంగా విల్లును వంచడం/ఎక్కుపెట్టడం గురించి వాడబడినా, ఇక్కడ దాని కర్మ ‘వారి బాణం’గా ఉంది. మూలంలోని ఈ అసాధారణ నిర్మాణం మరియు అనువాద సందిగ్ధతను నమోదు చేస్తుంది.
lexical_decisions:
- source_word: שָׁנְנוּ
  choice: పదునుపెట్టారు
  rationale: ఈ క్రియకు ‘పదును పెట్టడం’ అనే ప్రత్యక్ష అర్థం ఉంది; కత్తి ఉపమానంతో సహజంగా సరిపోతుంది.
- source_word: לְשׁוֹנָם
  choice: తమ నాలుకను
  rationale: మూలంలోని ఏకవచన సమూహప్రయోగాన్ని తెలుగులో సహజంగా ఉంచుతుంది; ఇక్కడ నాలుక మాటకు సాధనం.
- source_word: דָּרְכוּ
  choice: ఎక్కుపెట్టారు
  rationale: ఈ క్రియ విల్లును వంచడం/ఎక్కుపెట్టడం లేదా బాణాన్ని ప్రయోగానికి సిద్ధం చేయడం అనే విలువేట సందర్భాన్ని సూచిస్తుంది. మూలంలో ‘బాణం’ కర్మగా ఉండటంతో, తెలుగులో ‘బాణాన్ని ఎక్కుపెట్టారు’ సహజంగా ఉండి దాడికి సిద్ధం చేసిన భావాన్ని నిలుపుతుంది.
- source_word: דָּבָר מָר
  choice: చేదు మాట
  rationale: דָּבָר ను ‘మాట’గా, מָר ను దాని గుణవాచకంగా అనువదించడం ద్వారా హానికరమైన, కఠినమైన పలుకును సూచించే రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘చేదు మాట’కు ‘బాణం’తో ఉన్న వ్యాకరణ సంబంధం
  choice: ‘చేదు మాట అనే తమ బాణం’గా సమానార్థక రూపకంగా చూపడం
  alternative: ‘చేదు మాటను బాణంలా’ లేదా ‘తమ బాణాన్ని—చేదు మాటను—’
  rationale: హీబ్రూలో ‘వారి బాణం’ తరువాత ‘చేదు మాట’ రావడం వల్ల రెండవది మొదటిదాన్ని వివరిస్తున్న సమానార్థక పదబంధంగా అర్థమవుతుంది. రూపకాన్ని స్పష్టంగా చేయడం తప్ప దానికి అదనపు సిద్ధాంతార్థం జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక గంభీరతను మరియు కత్తి–బాణం రూపకాల సమాంతరతను నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉండే పదజాలం వాడబడింది.
