source:
  edition: WLC
  text: וַ/יִּֽירְא֗וּ כָּל אָ֫דָ֥ם וַ֭/יַּגִּידוּ פֹּ֥עַל אֱלֹהִ֗ים וּֽ/מַעֲשֵׂ֥/הוּ הִשְׂכִּֽילוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/009.yaml
  text: Then all mankind will fear[a], and they will declare the work of God; they will understand what he has done.
translation:
  language: te
  text: అప్పుడు మనుషులందరూ[a] భయపడతారు; దేవుని కార్యాన్ని ప్రకటిస్తారు; ఆయన చేసినదాన్ని గ్రహిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రతి మనిషి,’ ‘మానవాళి అంతా.’ హీబ్రూలో ‘కొల్ ఆదామ్’ అని ఉంది; ఇక్కడ ఆదామ్ అనే పదం మానవులను సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: భయపడతారు
  rationale: ירא భయం, భక్తితో కూడిన విస్మయం అనే రెండు ఛాయలనూ కలిగి ఉండగలదు. దేవుని తీర్పు సందర్భంలో ‘భయపడతారు’ సహజంగా ఉండి ఆ భావవిస్తృతిని పూర్తిగా పరిమితం చేయదు. కవితా సందర్భంలోని వరుస చర్యను భవిష్యత్ ఫలితంగా అనువదించాం.
- source_word: כָּל אָדָם
  choice: మనుషులందరూ
  rationale: אָדָם ఇక్కడ ఒక్క పురుషుణ్ణి సూచించకుండా మానవులను సమష్టిగా సూచిస్తుంది. ‘మనుషులందరూ’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఈ సమష్టి భావాన్ని తెలియజేస్తుంది.
- source_word: וַיַּגִּידוּ
  choice: ప్రకటిస్తారు
  rationale: נגד హిఫీల్ రూపం తెలియజేయడం, చెప్పడం, ప్రకటించడం అనే అర్థాలను ఇస్తుంది. ఇక్కడ దేవుని కార్యాన్ని బహిరంగంగా తెలియజేసే భావానికి ‘ప్రకటిస్తారు’ తగినది.
- source_word: פֹּעַל אֱלֹהִים
  choice: దేవుని కార్యాన్ని
  rationale: פֹּעַל పని, కార్యం, క్రియ అనే అర్థాలను కలిగి ఉంది. సందర్భంలోని దేవుని నిర్ణాయక చర్యను అతిగా నిర్దిష్టం చేయకుండా ‘దేవుని కార్యం’ తెలియజేస్తుంది.
- source_word: וּמַעֲשֵׂהוּ
  choice: ఆయన చేసినదాన్ని
  rationale: అక్షరార్థంగా ‘ఆయన కార్యం/చేసిన పని.’ ముందు వచ్చిన ‘కార్యం’ అనే పదాన్ని అసహజంగా పునరావృతం చేయకుండా, దేవుని చర్యనే స్పష్టంగా సూచిస్తుంది.
- source_word: הִשְׂכִּילוּ
  choice: గ్రహిస్తారు
  rationale: שׂכל హిఫీల్ రూపం అంతర్దృష్టితో అర్థం చేసుకోవడం లేదా వివేకంగా పరిశీలించడం అనే భావాన్ని ఇస్తుంది. దేవుని కార్యమే ఇక్కడ కర్మగా ఉన్నందున ‘గ్రహిస్తారు’ సందర్భానికి సరిపోతుంది.
theological_decisions:
- issue: אָדָם పదానికి సమష్టి మానవార్థం
  choice: మనుషులందరూ
  alternative: ప్రతి మనిషి / మానవాళి అంతా
  rationale: హీబ్రూలో పదం వ్యాకరణపరంగా ఏకవచనమైనా, ఇక్కడ మానవజాతిని సాధారణంగా, సమష్టిగా సూచిస్తుంది. అందువల్ల కేవలం పురుషులకు పరిమితమయ్యే అర్థాన్ని నివారించి సమష్టి భావాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన కవితా వాక్యనిర్మాణం ఉపయోగించబడింది. మూడు వరుస క్రియలను సమాంతరంగా ఉంచి హీబ్రూ కవిత్వ ప్రవాహాన్ని నిలిపాం.
