id: PSA.46.6
reference: Psalms 46:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הָמ֣וּ ג֭וֹיִם מָ֣טוּ מַמְלָכ֑וֹת נָתַ֥ן בְּ֝/קוֹל֗/וֹ תָּמ֥וּג אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/006.yaml
  text: Nations raged[a], kingdoms tottered; he uttered his voice, the earth melted.
translation:
  language: te
  text: జాతులు చెలరేగాయి[a], రాజ్యాలు తూలాయి; ఆయన తన స్వరం వినిపించాడు, భూమి కరిగిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జాతులు అల్లకల్లోలమయ్యాయి, రాజ్యాలు కదిలిపోయాయి.”
    reason: הָמוּ మరియు מָטוּ పదాల్లోని కోలాహలం, కలవరం, అస్థిరతలకు సాధ్యమైన మరింత వివరణాత్మక అనువాదం.
lexical_decisions:
- source_word: הָמוּ
  choice: చెలరేగాయి
  rationale: ఈ క్రియలో కోలాహలం, కలవరం, ఉద్ధృతమైన కదలిక అనే భావాలు ఉన్నాయి. ‘చెలరేగాయి’ శత్రుత్వంతో కూడిన అశాంతిని సహజమైన తెలుగు కవితా భాషలో తెలియజేస్తుంది; శబ్దం అనే అంశం కొంత పరోక్షంగా ఉండటంతో ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: גּוֹיִם
  choice: జాతులు
  rationale: ఇక్కడ రాజకీయ సమూహాలైన ప్రజలను సూచిస్తూ ‘రాజ్యాలు’ అనే సమాంతర పదంతో జతకడుతుంది. ‘అన్యజనులు’ అని అనువదిస్తే ఈ సందర్భంలో ముందుకు రాని యూదు–అన్యజన భేదాన్ని చేర్చినట్లవుతుంది.
- source_word: מָטוּ
  choice: తూలాయి
  rationale: ఈ పదం స్థిరత్వం కోల్పోవడం, జారడం లేదా కూలే స్థితికి చేరడం అనే చిత్రాన్ని ఇస్తుంది. ‘తూలాయి’ పూర్తిగా పడిపోయాయని అతిగా చెప్పకుండా రాజ్యాల అస్థిరతను నిలుపుతుంది.
- source_word: מַמְלָכוֹת
  choice: రాజ్యాలు
  rationale: రాజకీయ పాలనా ప్రాంతాలను సూచించే సరళమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: נָתַן בְּקוֹלוֹ
  choice: ఆయన తన స్వరం వినిపించాడు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘తన స్వరాన్ని ఇచ్చాడు.’ తెలుగు భాషలో ‘తన స్వరం వినిపించాడు’ ఆ దైవిక పలుకులోని ప్రభావాన్ని సహజంగా తెలియజేస్తూ, కేవలం గట్టిగా మాట్లాడాడనే భావానికి పరిమితం చేయదు.
- source_word: תָּמוּג
  choice: కరిగిపోయింది
  rationale: కరగడం, ద్రవించడం లేదా దృఢత్వాన్ని కోల్పోవడం అనే మూలచిత్రాన్ని నేరుగా, కవితాత్మకంగా నిలుపుతుంది.
- source_word: אָרֶץ
  choice: భూమి
  rationale: కీర్తనలోని విశ్వవ్యాప్త పరిధికి, జాతులు మరియు రాజ్యాల కల్లోలానికి అనుగుణంగా ఇక్కడ ఒక నిర్దిష్ట ‘దేశం’ కన్నా ‘భూమి’ సరిపోతుంది.
theological_decisions:
- issue: נָתַן అనే క్రియలో అంతర్లీనంగా ఉన్న కర్త
  choice: ఆయన = దేవుడు
  alternative: చుట్టుపక్కల సందర్భాన్ని బట్టి ‘యెహోవా’ అని స్పష్టంగా పేర్కొనడం
  rationale: హీబ్రూ క్రియలో పుంలింగ ఏకవచన కర్త అంతర్లీనంగా ఉంది. ‘ఆయన’ అనడం మూలంలోని సంక్షిప్తతను నిలుపుతూ, ఆ కర్త దేవుడని సందర్భమే గుర్తించనిస్తుంది; ఈ వచనంలో లేని దైవనామాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన కవితా లయను పాటించాం. ‘చెలరేగాయి—తూలాయి—కరిగిపోయింది’ అనే క్రియల క్రమం మానవ రాజకీయ కల్లోలం నుంచి దేవుని స్వరం ఎదుట భూమి దృఢత్వం కోల్పోవడం వరకు మూలపాఠంలోని తీవ్రతను నిలుపుతుంది.
