revisions:
- from: “ఆగండి[a]; నేనే దేవుణ్ణని తెలుసుకోండి. జనాల మధ్య నేను మహోన్నతుడనై నిలుస్తాను[b]; భూమియంతటా[c] నేను మహోన్నతుడనై నిలుస్తాను.”
  to: “విరమించండి[a]; నేనే దేవుడనని తెలుసుకోండి. దేశాల మధ్య నేను ఉన్నతపరచబడతాను[b]; భూమిమీద[c] నేను ఉన్నతపరచబడతాను.”
  rationale: The revision retains the source’s broad imperative and emphatic “I am God,” restores the specific corporate sense of “nations,” avoids adding “throughout” to the earth line, and removes the additional nuance of “standing/remain” from the repeated declaration of divine exaltation. Footnote anchors remain attached to the relevant words and preserve the lexical and aspectual alternatives.
