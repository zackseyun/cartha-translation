    reason: alternative_reading
  - marker: c
    text: ‘భూమి’కి వాడిన హీబ్రూ పదాన్ని ‘దేశం’ అని కూడా అనువదించవచ్చు; అయితే ఈ కీర్తనలోని విస్తృత పరిధి ప్రపంచమంతటినీ సూచించే భావానికి మద్దతిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְפּוּ
  choice: ఆగండి
  rationale: רפה ధాతువు ఇక్కడ ‘వదలడం, పట్టు సడలించడం, ప్రయత్నాన్ని నిలిపివేయడం’ అనే విస్తృత భావాన్ని కలిగిన బహువచన ఆజ్ఞ. కీర్తనలోని యుద్ధాలు, కల్లోల జనాలు అనే సందర్భంలో ‘ఆగండి’ సహజమైన ఆధునిక తెలుగు; ఇది కేవలం అంతరంగ ధ్యానమనే అర్థానికి వాక్యాన్ని పరిమితం చేయదు.
- source_word: וּדְעוּ
  choice: తెలుసుకోండి
  rationale: ידע యొక్క ప్రాథమిక భావమైన ‘తెలుసుకోవడం’ను నేరుగా నిలుపుతూ, ఇక్కడ దేవుడు ఎవరో గుర్తించి అంగీకరించే భావాన్నీ సందర్భానికి తెరిచి ఉంచుతుంది.
- source_word: כִּי אָנֹכִי אֱלֹהִים
  choice: నేనే దేవుణ్ణని
  rationale: כִּי ఇక్కడ తెలిసికోవలసిన విషయాన్ని పరిచయం చేస్తుంది. אָנֹכִי అనే స్పష్టమైన సర్వనామంలోని ఉద్ఘాటనను తెలుగు ‘నేనే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אָרוּם
  choice: నేను మహోన్నతుడనై నిలుస్తాను
  rationale: רום Qal imperfect దేవుని నిశ్చితమైన ఉన్నత స్థితి లేదా ఉన్నతీకరణను సూచిస్తుంది. ‘మహోన్నతుడనై నిలుస్తాను’ అనేది భౌతికంగా పైకి లేపబడటం అనే అపార్థాన్ని నివారిస్తూ, దేవుని సర్వోన్నతత్వం వెల్లడై స్థిరపడే భావాన్ని ఇస్తుంది; కాలబలంలోని అస్పష్టతను పాదసూచికలో ఉంచాం.
- source_word: בַּגּוֹיִם
  choice: జనాల మధ్య
  rationale: גוים ఇక్కడ ప్రపంచంలోని జనసమూహాలు లేదా దేశజనాలను సూచిస్తుంది. ‘జనాల మధ్య’ కవితాత్మక సమాంతరతను, విశ్వవ్యాప్త పరిధిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בָּאָרֶץ
  choice: భూమియంతటా
  rationale: ארץకు ‘భూమి’ లేదా ‘దేశం’ అనే అర్థాలు ఉండవచ్చు. ‘జనాల మధ్య’ అనే సమాంతర పాదం, కీర్తన యొక్క విశ్వవ్యాప్త దృశ్యం ఇక్కడ ‘భూమి’ భావానికి మద్దతిస్తాయి. విస్తృత పరిధిని సహజ తెలుగులో తెలియజేయడానికి ‘భూమియంతటా’ ఎంచుకున్నాం.
theological_decisions:
- issue: הַרְפּוּ అనే ఆరంభ ఆజ్ఞ యొక్క భావపరిధి
  choice: మానవ ప్రయత్నం లేదా ప్రతిఘటనను ఆపి దేవుని సార్వభౌమత్వాన్ని గుర్తించమనే విస్తృత పిలుపు—‘ఆగండి’
