    text: ‘వదిలేయండి,’ ‘పట్టు సడలించండి,’ లేదా ‘చేయడం మానండి’ అని కూడా అనువదించవచ్చు; హీబ్రూ ఆజ్ఞకు ఆపడం, సడలించడం, పట్టును విడిచిపెట్టడం అనే భావాలు ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
