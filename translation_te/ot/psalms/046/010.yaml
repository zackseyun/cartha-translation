  rationale: హీబ్రూ క్రియ పట్టు సడలించడం, వదలడం, నిలిపివేయడం అనే భావాలను అనుమతిస్తుంది. కీర్తన సందర్భం కల్లోల జనాలు, యుద్ధాలు, దేవుని విశ్వాధిపత్యాన్ని కలిపి చూపుతుంది. అందువల్ల అనువాదం ఏ ఒక్క సంకుచిత వివరణనూ బలవంతంగా నిర్ణయించకుండా ఆ భావ ఉద్రిక్తతను నిలుపుతుంది.
- issue: אָרוּם యొక్క కాలబలం మరియు దేవుని ఉన్నతీకరణ
  choice: నిశ్చిత భవిష్యత్ బలంతో ‘మహోన్నతుడనై నిలుస్తాను’
  alternative: ‘నేను మహోన్నతుడను’ లేదా ‘నేను ఉన్నతపరచబడతాను’
  rationale: హీబ్రూ imperfect సందర్భంలో వర్తమాన స్థితినిగానీ, నిశ్చిత భవిష్యత్ ప్రకటననిగానీ సూచించగలదు. ప్రధాన పాఠంలో నిశ్చిత భవిష్యత్ భావాన్ని తీసుకున్నప్పటికీ, పాదసూచిక ప్రత్యామ్నాయ కాలబలాన్ని స్పష్టంగా నిలుపుతుంది. దేవుని ఔన్నత్యం మనుషుల చర్యపై ఆధారపడుతుందనే భావం రాకుండా తెలుగు క్రియను ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు, గౌరవభరితమైన కవితా శైలి. బహువచన ఆజ్ఞలకు ‘-ండి’ రూపాలు వాడబడ్డాయి. ‘ఊరకుండండి’ వంటి సంప్రదాయ పదబంధం కేవలం నిశ్శబ్దంగా ఉండడమే ప్రధాన భావమనే అపార్థాన్ని కలిగించవచ్చు కాబట్టి ‘ఆగండి’ ఎంచుకున్నాం. ‘మహోన్నతుడనై నిలుస్తాను’ కవితా గాంభీర్యాన్ని ఉంచుతూ దేవుని స్థిరమైన సర్వోన్నతత్వాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
