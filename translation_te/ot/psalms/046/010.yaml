  text: Be still[a], and know that I am God. I will be exalted among the nations[c][b]; I will be exalted in the earth.
translation:
  language: te
  text: “విరమించండి[a]; నేనే దేవుడనని తెలుసుకోండి. దేశాల మధ్య నేను ఉన్నతపరచబడతాను[b]; భూమిమీద[c] నేను ఉన్నతపరచబడతాను.”
  philosophy: optimal-equivalence
  footnotes:
