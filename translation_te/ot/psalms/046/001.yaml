  text: దేవుడు మనకు ఆశ్రయం, బలం; ఆపదల్లో ఎంతోగా లభించే సహాయం.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత భావానువాదంగా: “ఆపదల్లో అత్యంత అందుబాటులో ఉండే సహాయం.” హెబ్రీలో అక్షరార్థంగా దేవుడు “ఆపదల్లో ఎంతోగా లభించేవాడు” అని ఉంది; కష్టకాలంలో ఆయన వెంటనే అందుబాటులో ఉన్నట్లు రుజువవుతాడనే భావాన్ని ఇది సూచిస్తుంది.'
