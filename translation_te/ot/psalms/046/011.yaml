  yaml_path: translation/ot/psalms/046/011.yaml
  text: Yahweh of Armies is with us[a]; the God of Jacob is a stronghold for us[c][b]. Selah
translation:
  language: te
  text: సైన్యాధిపతియైన యాహ్వే మనతో ఉన్నాడు[a]; యాకోబు దేవుడు మనకు దుర్గం[b]. సెలా[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సైన్యాల యాహ్వే మనతో ఉన్నాడు.” צְבָאוֹת అనే హీబ్రూ పదం సైన్యాలు లేదా సైనిక సమూహాలను సూచిస్తుంది; ఇందులో పరలోక సైన్యాల భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “దుర్గం” అనే పదాన్ని “ఆశ్రయం” లేదా “ఎత్తైన కోట” అని కూడా అనువదించవచ్చు. מִשְׂגָּב రక్షణనిచ్చే సురక్షితమైన ఎత్తైన స్థలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: “సెలా” అనేది ఖచ్చితమైన అర్థం తెలియని హీబ్రూ ఆరాధనా లేదా సంగీత పదం; అందువల్ల దాన్ని అనువదించకుండా ఉంచాం.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవిక నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపుపొందిన ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: צְבָאוֹת
  choice: సైన్యాలకు అధిపతియైన
  rationale: ఈ పదం సైన్యాలు లేదా సైనిక సమూహాలను సూచిస్తుంది; యెహోవాతో కలిసినప్పుడు ఆయన వాటిపై కలిగిన సార్వభౌమ అధికారాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עִמָּנוּ
  choice: మనకు తోడుగా ఉన్నాడు
  rationale: ‘మనతో ఉన్నాడు’ అనే మూల భావాన్ని సహజమైన, ప్రస్తుత తెలుగు ప్రయోగంలో వ్యక్తం చేస్తుంది; దేవుని సహవాసం మరియు అండ రెండూ వినిపిస్తాయి.
- source_word: מִשְׂגָּב
  choice: దుర్గం
  rationale: రక్షణనిచ్చే ఎత్తైన, బలమైన కోట అనే రూపకాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לָנוּ
  choice: మనకు
  rationale: ఇక్కడ ל ప్రయోజనార్థక భావాన్ని కలిగి ఉంది—దేవుడు మన ప్రయోజనం కోసం దుర్గంగా ఉన్నాడని సూచిస్తుంది.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: యాకోబు దేవుడు
  rationale: మూలంలోని సంబంధ నిర్మాణాన్నీ, ఇశ్రాయేలుతో దేవుని నిబంధనాత్మక గుర్తింపునీ సహజంగా కాపాడుతుంది.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఈ ఆరాధనా లేదా సంగీత పదం యొక్క ఖచ్చితమైన అర్థం అనిశ్చితమైనందున అనువదించకుండా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה צְבָאוֹת అనే దైవిక నామ-బిరుదు
  choice: సైన్యాలకు అధిపతియైన యెహోవా
  alternative: సైన్యాల యెహోవా; సైన్యములకధిపతియైన ప్రభువు
  rationale: వ్యక్తిగత దైవిక నామాన్ని నిలుపుతూ, צְבָאוֹת లోని సైనిక మరియు సార్వభౌమ భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేశాం.
- issue: מִשְׂגָּב యొక్క రూపకం
  choice: మనకు దుర్గంగా
  alternative: మనకు ఆశ్రయంగా; మనకు ఉన్నత కోటగా
  rationale: రక్షణతోపాటు ఎత్తైన బలమైన స్థలం అనే మూల రూపకాన్ని ‘దుర్గం’ బాగా నిలుపుతుంది; ప్రత్యామ్నాయ భావాలను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి. హీబ్రూ సమాంతర నిర్మాణాన్ని నిలుపుతూ, ‘తోడుగా ఉన్నాడు’ మరియు ‘దుర్గంగా ఉన్నాడు’ అనే సహజమైన వాక్యరూపాలు వాడాం. పాదసూచిక గుర్తులు అన్నీ ప్రధాన పాఠ్యంలో సంబంధిత పదాల వెంట ఉంచాం.
