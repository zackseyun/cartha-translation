lexical_decisions:
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ కీర్తన సందర్భంలో రూపం వ్యాకరణపరంగా బహువచనమైనా, ఇశ్రాయేలు దేవుడైన ఏకైక దేవునినే సూచిస్తుంది.
- source_word: בְּקִרְבָּהּ
  choice: ఆమె మధ్యలో
  rationale: నగరం లోపల దేవుని సన్నిధిని సూచించే సహజమైన తెలుగు ప్రయోగం; స్త్రీలింగ ఏకవచన ప్రత్యయాన్ని ‘ఆమె’గా నిలుపుతుంది.
- source_word: בַּל תִּמּוֹט
  choice: ఆమె చలించదు
  rationale: మוט అనే క్రియలోని తొట్రిల్లడం, కదిలించబడడం, స్థిరత్వం కోల్పోవడం అనే భావాలను కవితాత్మకంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: יַעְזְרֶהָ
  choice: ఆమెకు సహాయం చేస్తాడు
  rationale: అసంపూర్ణ క్రియ ఇక్కడ నిశ్చయమైన రాబోయే కార్యాన్ని సూచిస్తుంది; ఈ తెలుగు రూపం దాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִפְנוֹת בֹּקֶר
  choice: తెల్లవారగానే
  rationale: ఉదయం ప్రత్యక్షమయ్యే లేదా మళ్లే వేళ అనే హీబ్రూ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; పదచిత్రాన్ని పాదసూచికలో భద్రపరుస్తుంది.
theological_decisions:
- issue: స్త్రీలింగ ఏకవచన సర్వనామాల నిర్దేశ్యం
  choice: ముందరి సందర్భంలోని దేవుని పట్టణం/సీయోనును సూచించేలా ‘ఆమె’ అనే సర్వనామాన్ని నిలుపడం
  alternative: దేవుని ప్రజల సమాజాన్ని విస్తృతంగా సూచిస్తున్నదని భావించి వివరణాత్మక నామవాచకాన్ని చేర్చడం
  rationale: సమీప సందర్భం మరియు స్త్రీలింగ ఏకవచన వ్యాకరణం పట్టణాన్నే సహజ నిర్దేశ్యంగా చూపుతున్నాయి; అయితే ‘పట్టణం’ అని పాఠ్యంలో ప్రత్యక్షంగా చేర్చి భావాన్ని మరీ కుదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తనకు తగిన గంభీరతను ఉంచింది. ‘చలించదు’ స్థిరత్వపు కవితాత్మక రూపకాన్ని నిలుపుతుంది. ప్రతి పాదసూచిక గుర్తు సంబంధిత పదబంధం వెంట ప్రధాన పాఠ్యంలో ఉంచబడింది.
