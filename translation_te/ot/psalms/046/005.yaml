  - marker: b
    text: లేదా, ‘ఆమె కదిలించబడదు,’ ‘ఆమె తొట్రిల్లదు.’
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘ఉదయం తిరిగే వేళ’; అంటే, పగలు మొదలయ్యే సమయంలో లేదా తెల్లవారుజామున.
