  text: God is within her[a]; she will not be moved[c][b]. God will help her when morning dawns.
translation:
  language: te
  text: దేవుడు ఆమె మధ్యలో[a] ఉన్నాడు; ఆమె చలించదు[b]. తెల్లవారగానే[c] దేవుడు ఆమెకు సహాయం చేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
