  text: For the choir director. Of the sons of Korah. According to Alamoth[a]. A song.
translation:
  language: te
  text: సంగీత నిర్దేశకునికి. కోరహు కుమారులది. అలామోత్ ప్రకారం[a]. ఒక గీతం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యువతులతో సంబంధమున్నది’; అంటే స్త్రీ స్వరాల కోసం లేదా ఉన్నత స్వరాల కోసం కావచ్చు. ‘అలామోత్’ అనే హీబ్రూ పదం బహుశా సంగీత ప్రదర్శనకు సూచన లేదా ఒక రాగం పేరు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నిర్దేశకునికి
  rationale: కీర్తనల శీర్షికల్లో ఈ పదం సంగీత ప్రదర్శనను పర్యవేక్షించే వ్యక్తిని సూచిస్తుంది. ‘సంగీత నిర్దేశకుడు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, కేవలం గాయకబృందానికే పరిమితం చేయదు.
- source_word: לִבְנֵי קֹרַח
  choice: కోరహు కుమారులది
  rationale: ఇక్కడ לְ అనుబంధం, రచన లేదా ప్రదర్శనకు అప్పగింపును సూచించవచ్చు. ‘కుమారులది’ ఆ సంబంధాన్ని సంక్షిప్తంగా తెలియజేస్తూ, వారే రచయితలని గానీ ప్రదర్శకులని గానీ ఖచ్చితంగా నిర్ణయించదు.
- source_word: עַל
  choice: ప్రకారం
  rationale: సంగీత శీర్షికల్లో עַל ఒక రాగం, శైలి లేదా ప్రదర్శన సూచనను పరిచయం చేయవచ్చు. ‘ప్రకారం’ ఈ సాంకేతిక సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עֲלָמוֹת
  choice: అలామోత్
  rationale: ఈ సాంకేతిక పదం అర్థం అనిశ్చితం; ఇది యువతులను, స్త్రీల లేదా ఉన్నత స్వరాలను, లేక ఒక రాగం పేరును సూచించవచ్చు. లిప్యంతరీకరణ ఆ అనిశ్చితిని కాపాడుతుంది.
- source_word: שִׁיר
  choice: ఒక గీతం
  rationale: ఇది రచన రకాన్ని తెలిపే నామవాచక శీర్షిక. ‘ఒక గీతం’ సహజమైన ఆధునిక తెలుగు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన కీర్తన శీర్షికగా రూపొందించబడింది. మూలంలోని చిన్న చిన్న శీర్షిక భాగాల నిర్మాణాన్ని నిలిపి, ‘అలామోత్’ అర్థంలోని నిజమైన అనిశ్చితిని పాదటిప్పణిలో కాపాడింది.
