translation:
  language: te
  text: 'దాని జలాలు గర్జించి నురగలెత్తినా,

    దాని ఉప్పొంగుటవల్ల పర్వతాలు కంపించినా[a]—సెలా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని గర్వమువల్ల పర్వతాలు కంపించినా,” లేదా “దాని ఉద్ధృతివల్ల.” హీబ్రూ నామవాచకానికి ఔన్నత్యం, గర్వం, ఉప్పొంగడం అనే అర్థాలు ఉండవచ్చు; ఇక్కడ పైకెగసే జలాల భౌతిక దృశ్యానికి ప్రాధాన్యం ఇచ్చాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶהֱמוּ
  choice: ఘోషిస్తూ
  rationale: המה అనే క్రియ కల్లోల జలాల బిగ్గర శబ్దాన్ని సూచిస్తుంది; ‘ఘోషిస్తూ’ ఆ శ్రావ్య బలాన్ని సహజమైన తెలుగు కవితా భాషలో నిలుపుతుంది.
- source_word: יֶחְמְרוּ
  choice: నురగలు కక్కినా
  rationale: జలాలు కలయబడటం, పొంగి నురగెత్తటం అనే దృశ్యాన్ని ఈ సందర్భంలో సూచిస్తుంది; ‘నురగలు కక్కడం’ ఆధునిక తెలుగులో సజీవమైన జలచిత్రాన్ని ఇస్తుంది.
- source_word: מֵימָיו
  choice: దాని జలాలు
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయాన్ని ముందటి సముద్రానికి సంబంధించిన నిర్జీవ స్వామ్యంగా ‘దాని’తో వ్యక్తం చేశాం.
- source_word: יִרְעֲשׁוּ
  choice: కంపించినా
  rationale: רעשׁ తీవ్రమైన కదలికను, భూకంపంలాంటి కంపనాన్ని సూచిస్తుంది; పర్వతాల సందర్భంలో ‘కంపించు’ సహజంగా, బలంగా ఉంటుంది.
- source_word: הָרִים
  choice: పర్వతాలు
  rationale: నిర్దిష్ట రూపంలోని పర్వతాలను కవితా దృశ్యంలో సహజ తెలుగు బహువచనంగా ఇచ్చాం; తెలుగులో ప్రత్యేక నిర్దేశక పదం అవసరం లేదు.
- source_word: בְּגַאֲוָתוֹ
  choice: వాటి ఉప్పొంగుడుకు
  rationale: גאוהకు ఔన్నత్యం, గర్వం, ఉప్పొంగడం అనే భావాలు ఉండవచ్చు. కల్లోల జలాల తక్షణ సందర్భంలో భౌతికంగా ఉప్పొంగే భావాన్ని ప్రధాన పాఠ్యంలో ఎంచుకున్నాం; తెలుగు అన్వయంలో జలాలను సూచించేందుకు ‘వాటి’ వాడాం.
- source_word: סֶלָה
  choice: సెలా
  rationale: దీని ఖచ్చితమైన ఆరాధనా లేదా సంగీత విధి అనిశ్చితమైనందున అర్థానువాదం చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించాం.
