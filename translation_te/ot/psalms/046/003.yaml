translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తన కవిత్వానికి తగిన గౌరవప్రదమైన సజీవ శైలిని వాడాం. 2వ వచనంలో ప్రారంభమైన ‘…అయినా’ నిర్మాణంతో అనుసంధానం నిలిపేందుకు రెండు పాదాల్లోనూ ‘-ఇనా’ రూపం ఎంచుకున్నాం. ‘సెలా’ను అనిశ్చిత సంగీత/ఆరాధనా సూచికగా అలాగే ఉంచాం.
