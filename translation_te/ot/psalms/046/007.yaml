source:
  edition: WLC
  text: יְהוָ֣ה צְבָא֣וֹת עִמָּ֑/נוּ מִשְׂגָּֽב לָ֝/נוּ אֱלֹהֵ֖י יַעֲקֹ֣ב סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/007.yaml
  text: Yahweh of Armies is with us; the God of Jacob is a stronghold for us[a]. Selah
translation:
  language: te
  text: సైన్యాలకు అధిపతియైన యహ్వే మనతో ఉన్నాడు; యాకోబు దేవుడు మనకు దుర్గంగా ఉన్నాడు. సెలా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో గుర్తించదగిన లిప్యంతరీకరణగా ఉంచాం.
- source_word: צְבָאוֹת
  choice: సైన్యాలకు అధిపతియైన
  rationale: ఈ పదం సైన్యాల భావాన్ని కలిగి ఉంది. తెలుగులో ‘సైన్యాల యహ్వే’ అసహజంగా ఉండటంతో, యహ్వేకు సంబంధించిన బిరుదును సహజంగా తెలియజేయడానికి ‘సైన్యాలకు అధిపతియైన’ అని అనువదించాం.
- source_word: עִמָּנוּ
  choice: మనతో ఉన్నాడు
  rationale: సన్నిధి, సంఘీభావం, రక్షణ అనే సందర్భార్థాలను సహజంగా తెలిపే ప్రత్యక్ష తెలుగు రూపం.
- source_word: מִשְׂגָּב
  choice: దుర్గం
  rationale: ఎత్తైన సురక్షిత స్థలం లేదా బలమైన ఆశ్రయం అనే మూలభావాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: לָנוּ
  choice: మనకు
  rationale: సంబంధం లేదా ప్రయోజనాన్ని సూచించే ל ఉపసర్గను సహజమైన తెలుగు దత్తి రూపంతో వ్యక్తం చేశాం.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: యాకోబు దేవుడు
  rationale: హీబ్రూ సమాసాన్ని నేరుగా నిలుపుతూ, పితరుడైన యాకోబుతో నిబంధన సంబంధాన్ని కాపాడుతుంది.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఈ పదం యొక్క ఖచ్చితమైన కార్యం అనిశ్చితమైనందున అర్థానువాదం చేయకుండా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה צְבָאוֹת అనే దైవిక బిరుదు
  choice: సైన్యాలకు అధిపతియైన యహ్వే
  alternative: సైన్యాల యహ్వే; సేనల ప్రభువు
  rationale: యహ్వే అనే నిబంధన నామాన్ని నిలుపుతూ, צְבָאוֹת లోని సైనిక/విశ్వసేనల భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. ‘ప్రభువు’ అని మార్చడం మూలంలోని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేస్తుంది కాబట్టి ప్రధాన పాఠంలో ఉపయోగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయితే కీర్తనకు తగిన గంభీరతతో రూపొందించబడింది. హీబ్రూ రెండు సమాంతర వాక్య భాగాలు మరియు ‘సెలా’ యథాతథంగా నిలుపబడ్డాయి.
