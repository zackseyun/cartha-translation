  yaml_path: translation/ot/psalms/046/002.yaml
  text: Therefore we will not fear though the earth changes[b][a], though the mountains slip into the heart of the seas.
translation:
  language: te
  text: అందుచేత మనం భయపడము—భూమి మారినా[a], పర్వతాలు సముద్రాల నడిబొడ్డులోకి జారిపోయినా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘భూమి తారుమారైనా’ / ‘భూమి మార్చబడినప్పుడు.’ హీబ్రూ క్రియ మారడాన్ని లేదా మార్చబడడాన్ని సూచించగలదు; ఇక్కడ భూమి స్థిరత్వం చెదిరిపోవడాన్ని వర్ణిస్తోంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పర్వతాలు తొట్రిల్లి సముద్రాల నడిబొడ్డులోకి వెళ్లిపోయినా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: అందుచేత
  rationale: ముందటి వచనంలో దేవుడు ఆశ్రయమూ బలమూ అనే ప్రకటననుంచి వచ్చే నిర్ధారణను సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לֹא נִירָא
  choice: మనం భయపడము
  rationale: మొదటి పురుష బహువచన అసంపూర్ణ క్రియ ఇక్కడ నమ్మకంతో కూడిన దృఢనిశ్చయాన్ని వ్యక్తం చేస్తుంది; ఈ తెలుగు రూపం వర్తమాన విశ్వాసాన్నీ భవిష్యత్ సంకల్పాన్నీ సహజంగా మోస్తుంది.
- source_word: בְּהָמִיר אָרֶץ
  choice: భూమి మారిపోయినా
  rationale: בְּ ఉపసర్గతో ఉన్న క్రియానామ రూపం పరిస్థితిని సూచిస్తుంది; מוּר యొక్క ప్రాథమిక ‘మారడం/మార్చబడడం’ భావాన్ని ఉంచుతూ, కవితలోని విశ్వవ్యాప్త కల్లోలాన్ని సందర్భం తెలియజేయనిస్తుంది.
- source_word: וּבְמוֹט הָרִים
  choice: పర్వతాలు ... జారిపోయినా
  rationale: מוֹט స్థిరత్వం కోల్పోయి కదలడం, తొట్రిల్లడం లేదా జారిపోవడం అనే భావాలను కలిగి ఉంది. సముద్రాల మధ్యలోకి పర్వతాలు వెళ్లే దృశ్యంలో ‘జారిపోయినా’ స్పష్టమైన, సహజమైన చిత్రాన్ని ఇస్తుంది.
- source_word: בְּלֵב יַמִּים
  choice: సముద్రాల నడిబొడ్డులోకి
  rationale: లֵב అనే ‘హృదయం’ రూపకాన్ని తెలుగు స్థలవాచక ప్రయోగమైన ‘నడిబొడ్డు’తో నిలుపుతుంది; సందర్భంలోని లోపలికి కదలికను ‘లోకి’ తెలియజేస్తుంది. יַמִּים బహువచనాన్ని ‘సముద్రాలు’గా నిలిపింది.
