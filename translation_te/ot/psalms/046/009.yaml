source:
  edition: WLC
  text: מַשְׁבִּ֥ית מִלְחָמוֹת֮ עַד קְצֵ֪ה הָ֫/אָ֥רֶץ קֶ֣שֶׁת יְ֭שַׁבֵּר וְ/קִצֵּ֣ץ חֲנִ֑ית עֲ֝גָל֗וֹת יִשְׂרֹ֥ף בָּ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/009.yaml
  text: He makes wars cease to the end of the earth[a]; he breaks the bow and cuts the spear in two[b]; he burns the wagons with fire.
translation:
  language: te
  text: 'ఆయన భూమి అంచుల వరకు యుద్ధాలను ఆపివేస్తాడు;


    విల్లును విరిచేస్తాడు, ఈటెను నరికివేస్తాడు;


    బండ్లను[a] అగ్నితో కాల్చివేస్తాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రథాలను.” ఇక్కడి హీబ్రూ పదానికి మరింత అక్షరార్థంగా “బండ్లు” లేదా “రవాణా బండ్లు” అని అర్థం; అయితే యుద్ధ సందర్భాన్ని బట్టి కొన్ని అనువాదాలు “రథాలు” అని అనువదిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁבִּית מִלְחָמוֹת
  choice: యుద్ధాలను ఆపివేస్తాడు
  rationale: שׁבת హిఫీల్ రూపంలోని కారణార్థాన్ని ‘ఆపివేస్తాడు’ సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַד קְצֵה הָאָרֶץ
  choice: భూమి అంచుల వరకు
  rationale: హీబ్రూ ఏకవచన నిర్మాణంలోని ‘భూమి అంచు వరకు’ అనే విశ్వవ్యాప్త భావాన్ని సహజంగా, మూలానికి దగ్గరగా వ్యక్తపరుస్తుంది.
- source_word: קֶשֶׁת יְשַׁבֵּר
  choice: విల్లును విరిచేస్తాడు
  rationale: ఏకవచన ఆయుధాన్ని ఒక వర్గానికి ప్రతినిధిగా ఉంచి, పియేల్ క్రియలోని ధ్వంస భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וְקִצֵּץ חֲנִית
  choice: ఈటెను ముక్కలు చేస్తాడు
  rationale: קצץ క్రియలోని నరికి ధ్వంసం చేసే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘రెండు ముక్కలు’ అని మూలంలో లేని ఖచ్చిత సంఖ్యను చేర్చదు.
- source_word: עֲגָלוֹת
  choice: బండ్లను
  rationale: ఈ పదానికి సాధారణ అర్థం బండ్లు లేదా రవాణా బండ్లు; యుద్ధ సందర్భం వల్ల ‘రథాలు’ సాధ్యమైన సందర్భార్థమైనా, అది ప్రామాణిక రథపదం కాదు.
- source_word: יִשְׂרֹף בָּאֵשׁ
  choice: అగ్నితో కాల్చివేస్తాడు
  rationale: హీబ్రూ సాధనార్థక ప్రయోగాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తూ ధ్వంస భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యుద్ధ సందర్భంలో עֲגָלוֹת పదానికి సంప్రదాయ అనువాదం
  choice: బండ్లు
  alternative: రథాలు
  rationale: ఇక్కడి హీబ్రూ పదం సాధారణంగా బండ్లు లేదా రవాణా బండ్లను సూచిస్తుంది; అది రథానికి వాడే సాధారణ పదం కాదు. యుద్ధ సందర్భం కారణంగా ‘రథాలు’ అనే అర్థం ఊహించదగినందున దానిని పాదసూచికలో ఉంచాం.
- issue: קצץ క్రియ ధ్వంసాన్ని ఎంత నిర్దిష్టంగా చెప్పాలి
  choice: ముక్కలు చేస్తాడు
  alternative: నరికివేస్తాడు
  rationale: క్రియ నరికి లేదా కోసి ధ్వంసం చేయడాన్ని సూచిస్తుంది; మూలంలో ‘రెండు’ అనే సంఖ్య లేనందున ప్రధాన పాఠ్యంలో దానిని చేర్చలేదు. ప్రత్యామ్నాయ పదప్రయోగాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభంగా అర్థమయ్యే కవితాత్మక గద్యం. మూడు సమాంతర క్రియావాక్యాల లయను అర్ధవిరామాలు మరియు పాద విభజనతో నిలిపాం; ఆయుధాల ఏకవచన రూపాలను హీబ్రూ వలే వర్గప్రతినిధులుగా ఉంచాం.
