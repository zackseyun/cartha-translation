  - severity: low
    issue: Footnote a duplicates a better main-text rendering
    rationale: Once the main text uses “నరికివేస్తాడు,” the existing footnote “లేదా, ‘ఈటెను నరికివేస్తాడు’” is no longer an alternative and should be removed.
