  text: Come, see the works of the LORD, who has set desolations in the earth.
translation:
  language: te
  text: రండి, భూమిలో వినాశనాలను కలిగించిన యెహోవా కార్యాలను చూడండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכוּ חֲזוּ
  choice: రండి, ... చూడండి
  rationale: రెండు బహువచన ఆజ్ఞలను సహజమైన ఆధునిక తెలుగు ఆహ్వాన రూపంలో అందిస్తుంది.
- source_word: מִפְעֲלוֹת
  choice: కార్యాలను
  rationale: దేవుడు చేసిన క్రియలు లేదా పనులు అనే విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలపాఠంలోని దేవుని వ్యక్తిగత నామాన్ని తెలుగు పాఠకులకు సుపరిచితమైన రూపంలో ప్రత్యక్షంగా సూచిస్తుంది.
- source_word: שָׂם שַׁמּוֹת
  choice: వినాశనాలు కలిగించినవాడు
  rationale: שַׁמּוֹת యొక్క ‘వినాశనాలు/నిర్జన స్థితులు’ అనే కఠిన భావాన్ని నిలుపుతూ, שָׂם ను సహజమైన తెలుగు క్రియతో వ్యక్తపరుస్తుంది.
- source_word: בָּאָרֶץ
  choice: భూమిపై
  rationale: ‘భూమిలో/దేశంలో’ అనే సాధ్య పరిధిని అతిగా కుదించకుండా సాధారణ భౌగోళిక భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: వినాశనాలకు దేవుని క్రియాశీల సంబంధం
  choice: వినాశనాలు కలిగించినవాడు ఆయనే
  alternative: వినాశనాలను తొలగించినవాడు ఆయనే
  rationale: మసొరెటిక్ పాఠంలోని שָׂם שַׁמּוֹת ను దాని ప్రత్యక్ష భావంలో ఉంచి, దేవుని తీర్పు గురించి ఉన్న ఉద్రిక్తతను సున్నితపరచకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయితే కీర్తనకు తగిన గంభీరతతో అనువదించబడింది.
