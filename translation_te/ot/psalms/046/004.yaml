source:
  edition: WLC
  text: נָהָ֗ר פְּלָגָ֗י/ו יְשַׂמְּח֥וּ עִיר אֱלֹהִ֑ים קְ֝דֹ֗שׁ מִשְׁכְּנֵ֥י עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/004.yaml
  text: A river—its streams make glad the city of God[b][a], the holy dwelling place of the Most High.
translation:
  language: te
  text: ఒక నది—[a] దాని పాయలు దేవుని పట్టణాన్ని, సర్వోన్నతుని పవిత్ర నివాసాలను[b] సంతోషపరుస్తాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక నది ఉంది; దాని పాయలు…’ హీబ్రూ కవితాత్మక ఆరంభంలో ‘ఉంది’ అనే క్రియ వ్యక్తంగా లేదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘నివాసాలు’ బహువచనం. భావాన్ని సులభీకరించి ‘నివాస స్థలం’ లేదా ‘పరిశుద్ధాలయం’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: נָהָר
  choice: ఒక నది
  rationale: హీబ్రూలో నామవాచకానికి నిర్దిష్టత సూచించే రూపం లేదు. అందువల్ల ‘ఒక నది’ మూలంలోని అనిర్దిష్ట భావాన్ని నిలుపుతుంది; క్రియలేని కవితాత్మక ఆరంభాన్ని దీర్ఘ గీతతో సహజంగా వ్యక్తం చేసింది.
- source_word: פְּלָגָיו
  choice: దాని పాయలు
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయం నదిని తిరిగి సూచిస్తుంది. ‘పాయలు’ నది విడిపోయి ప్రవహించే జలధారలను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: יְשַׂמְּחוּ
  choice: సంతోషపరుస్తాయి
  rationale: పియేల్ రూపంలోని కారణార్థాన్ని—ఆ పాయలు పట్టణానికి ఆనందం కలిగిస్తాయని—స్పష్టంగా నిలుపుతుంది.
- source_word: עִיר אֱלֹהִים
  choice: దేవుని పట్టణం
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని స్పష్టంగా, గంభీరంగా, సాధారణ పాఠకులకు సులభంగా వ్యక్తం చేస్తుంది.
- source_word: קְדֹשׁ
  choice: పవిత్ర స్థలం
  rationale: ఇక్కడ ‘పవిత్రమైనది/పవిత్ర స్థలం’ అనే నామవాచక భావంతో తరువాతి ‘నివాసాలు’కు అనుసంధానమై, ‘దేవుని పట్టణం’కు సమానాధికరణంగా ఉంది.
- source_word: מִשְׁכְּנֵי
  choice: నివాసాలు
  rationale: మూలంలోని బహువచన నిర్మాణాన్ని నిలుపుతుంది. ‘గుడారాలు’ అని పరిమితం చేయకుండా, దేవుని పవిత్ర నివాస ప్రదేశాల విస్తృత కవితాత్మక భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: עֶלְיוֹן
  choice: సర్వోన్నతుడు
  rationale: దేవుని అత్యున్నత స్థానాన్ని సూచించే ఈ బిరుదుకు ఆధునిక తెలుగు బైబిలు శైలిలో గంభీరమైన, స్పష్టమైన సమానార్థకం.
theological_decisions:
- issue: מִשְׁכְּנֵי అనే బహువచనాన్ని ఏకవచన ‘నివాస స్థలం’గా సులభీకరించాలా?
  choice: ‘నివాసాలు’ అనే బహువచనాన్ని ప్రధాన వచనంలో నిలుపడం
  alternative: ‘నివాస స్థలం’ లేదా ‘పరిశుద్ధాలయం’
  rationale: హీబ్రూ రూపం స్పష్టంగా బహువచనం. అది మహిమార్థక బహువచనమో, పవిత్ర ప్రాంగణాల సముదాయాన్నో సూచించవచ్చు; ఏకవచనంగా మార్చితే ఆ నిజమైన కవితాత్మక విస్తృతి మాయమవుతుంది.
- issue: קְדֹשׁ מִשְׁכְּנֵי עֶלְיוֹן ను ‘దేవుని పట్టణం’తో ఎలా అనుసంధానించాలి?
  choice: ‘సర్వోన్నతుని నివాసాల పవిత్ర స్థలం’ అని సమానాధికరణంగా ఉంచడం
  alternative: ‘సర్వోన్నతుని పవిత్ర నివాసాలు’
  rationale: קְדֹשׁ ఏకవచన రూపాన్ని, מִשְׁכְּנֵי బహువచనాన్ని రెండింటినీ గౌరవిస్తూ, ఈ పదబంధం దేవుని పట్టణాన్ని మరొక విధంగా వర్ణిస్తుందనే కవితాత్మక నిర్మాణాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని అనుసరించాం. క్రియలేని హీబ్రూ ఆరంభాన్ని దీర్ఘ గీతతో నిలిపి, ‘పాయలు’ వంటి సాధారణంగా అర్థమయ్యే పదాన్ని వాడాం. మూలంలోని ఏకవచన ‘పవిత్ర స్థలం’–బహువచన ‘నివాసాలు’ మధ్య ఉన్న ఉద్వేగాన్ని సులభీకరించకుండా సంరక్షించాం.
