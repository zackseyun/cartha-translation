revisions:
- from: దుష్టులతోపాటు నన్ను ఈడ్చుకుపోవద్దు[a]; చెడు చేసేవారితోపాటు నన్ను తీసుకుపోవద్దు. వారు తమ పొరుగువారితో శాంతిగా మాట్లాడుతారు[b], కానీ వారి హృదయాల్లో కీడు ఉంది.
  to: దుష్టులతోను దుర్మార్గం చేసేవారితోను నన్ను లాగి తీసుకుపోవద్దు[a]. వారు తమ పొరుగువారితో[b] శాంతి మాటలు మాట్లాడుతారు, అయితే వారి హృదయాల్లో కీడు ఉంది.
  rationale: The revision restores the single Hebrew negative verb governing both coordinated descriptions of evildoers, without specifying the mechanism of being taken away. It also uses a natural Telugu expression for the Hebrew idiom 'speak peace' and preserves the lexical alternative for רֵעֵיהֶם in the anchored footnote.
  reviewer_model: gpt-5.6-terra
