reference: Psalms 28:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַל תִּמְשְׁכֵ֣/נִי עִם רְשָׁעִים֮ וְ/עִם פֹּ֪עֲלֵ֫י אָ֥וֶן דֹּבְרֵ֣י שָׁ֭לוֹם עִם רֵֽעֵי/הֶ֑ם וְ֝/רָעָ֗ה בִּ/לְבָבָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/003.yaml
  text: Do not drag me away with the wicked[a], with those who work evil[b], who speak peace with their neighbors while evil is in their hearts.
translation:
  language: te
  text: దుష్టులతోను దుర్మార్గం చేసేవారితోను నన్ను లాగి తీసుకుపోవద్దు[a]. వారు తమ పొరుగువారితో[b] శాంతి మాటలు మాట్లాడుతారు, అయితే వారి హృదయాల్లో కీడు ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నన్ను ఈడ్చుకుపోవద్దు.’
    reason: lexical_alternative
  - marker: b
    text: ‘పొరుగువారితో’ అనే చోట ‘సహచరులతో’ లేదా ‘స్నేహితులతో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשְׁכֵנִי
  choice: నన్ను ఈడ్చుకుపోవద్దు
  rationale: ఈ సందర్భంలో משׁך బలవంతంగా లాగి ఇతరులతోపాటు తీసుకుపోవడం లేదా వారి గతిలో చేర్చడం అనే భావాన్ని ఇస్తుంది. ‘ఈడ్చుకుపోవద్దు’ విన్నపంలోని తీవ్రతను నిలుపుతుంది.
- source_word: רְשָׁעִים
  choice: దుష్టులు
  rationale: కీర్తనల సందర్భంలో నైతికంగా చెడ్డవారిని సూచించే సహజమైన, స్థిరమైన తెలుగు పదం.
- source_word: פֹּעֲלֵי אָוֶן
  choice: చెడు చేసేవారు
  rationale: తప్పును క్రియాశీలంగా ఆచరించేవారు అనే హెబ్రీ పదబంధంలోని క్రియాత్మక భావాన్ని సులభమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: דֹּבְרֵי שָׁלוֹם
  choice: శాంతిగా మాట్లాడుతారు
  rationale: బయటకు స్నేహపూర్వకంగా, హాని లేనట్లు మాట్లాడటం మరియు లోపల కీడు ఉంచుకోవడం మధ్యనున్న వ్యత్యాసాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: רֵעֵיהֶם
  choice: తమ పొరుగువారు
  rationale: רֵעַకు పొరుగువాడు, సహచరుడు, స్నేహితుడు అనే అర్థాలు సాధ్యమైనవి. ఇక్కడ సాధారణ సామాజిక సంబంధాన్ని సూచించడానికి ‘పొరుగువారు’ అనుకూలం; ప్రత్యామ్నాయం పాదటీకలో ఇవ్వబడింది.
- source_word: רָעָה
  choice: కీడు
  rationale: ఇక్కడ అంతరంగంలోని హానికరమైన ఉద్దేశాన్ని సూచిస్తుంది. ‘కీడు’ నైతిక చెడుతోపాటు హాని తలపెట్టే భావాన్నీ సహజంగా మోస్తుంది.
- source_word: בִּלְבָבָם
  choice: వారి హృదయాల్లో
  rationale: హృదయాన్ని ఆలోచన, సంకల్పం, ఉద్దేశం యొక్క అంతరంగ కేంద్రంగా చూపే మూలభాష రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దుష్టులతోపాటు తీసుకుపోవద్దనే కీర్తనకర్త విన్నప స్వభావం
  choice: దుష్టుల సహవాసంలో గానీ వారి గతిలో గానీ వారితోపాటు తీసుకుపోబడకూడదనే విన్నపం
  alternative: దుష్టులను అనుకరించకుండా కాపాడమనే విన్నపం మాత్రమే
  rationale: ‘నన్ను ఈడ్చుకుపోవద్దు’ మరియు ‘దుష్టులతోపాటు’ అనే కలయిక వారితో కలిసి, బహుశా తీర్పులో, తీసుకుపోబడటాన్ని సహజంగా సూచిస్తుంది. అయితే మూలంలో తీర్పు స్పష్టంగా చెప్పబడనందున అనువాదం దానిని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గంభీరమైన కీర్తనా శైలిని ఉపయోగించాం. హెబ్రీ సమాంతర నిర్మాణాన్ని రెండు నిషేధ వాక్యాలుగా నిలిపి, బయటి శాంతియుత మాటలకు లోపలి కీడుకు మధ్య వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేశాం.
