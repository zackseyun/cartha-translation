  yaml_path: translation/ot/psalms/028/002.yaml
  text: Hear the voice of my pleas for mercy when I cry to you[c][b][a], when I lift up my hands toward your holy inner sanctuary.
translation:
  language: te
  text: కరుణకోసం నా విన్నపాల[b] స్వరాన్ని ఆలకించు; నేను నీకు మొరపెట్టేటప్పుడు, నీ పరిశుద్ధ అంతరాలయం[a] వైపు నా చేతులు ఎత్తేటప్పుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ పరిశుద్ధ ఆలయం’; ఇక్కడి హీబ్రూ పదం మరింత ప్రత్యేకంగా ఆలయంలోని లోపలి పరిశుద్ధ స్థలాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘కరుణకోసం నా విన్నపాలు’ను ‘నా మనవులు’ లేదా ‘నా వేడుకోళ్లు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: ఆలకించు
  rationale: దేవునికి చేసే ప్రత్యక్ష, అత్యవసర ప్రార్థనను తెలిపే ఆజ్ఞార్థక రూపం; ఆధునిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలికి సరిపోతుంది.
- source_word: קוֹל
  choice: స్వరం
  rationale: ‘స్వరం/శబ్దం’ అనే భావాలలో, వ్యక్తిగత విన్నపాలతో సహజంగా కలిసే ‘స్వరం’ను ఎంచుకున్నాం.
- source_word: תַּחֲנוּנַי
  choice: కరుణకోసం నేను చేసే విన్నపాలు
  rationale: దయ లేదా అనుగ్రహం కోరే హృదయపూర్వక మనవుల భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּשַׁוְּעִי אֵלֶיךָ
  choice: నేను నీకు మొరపెట్టేటప్పుడు
  rationale: ב + infinitive construct యొక్క కాలసంబంధ భావాన్ని ‘అప్పుడు’తో, שׁוע యొక్క తీవ్రతను ‘మొరపెట్టు’తో వ్యక్తం చేస్తుంది.
- source_word: בְּנָשְׂאִי יָדַי
  choice: నా చేతులు ఎత్తేటప్పుడు
  rationale: ప్రార్థనలోని శారీరక భంగిమను మూలానికి దగ్గరగా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֶל דְּבִיר קָדְשֶׁךָ
  choice: నీ పరిశుద్ధ అంతరాలయం వైపు
  rationale: דְּבִיר సూచించే ఆలయంలోని లోపలి పరిశుద్ధ స్థలపు ప్రాదేశిక ప్రత్యేకతను ‘అంతరాలయం’ తెలియజేస్తుంది.
theological_decisions:
- issue: דְּבִיר קָדְשֶׁךָ యొక్క ఆరాధనా స్థల సూచన
  choice: నీ పరిశుద్ధ అంతరాలయం
  alternative: నీ పరిశుద్ధ ఆలయం
  rationale: ఈ పదబంధం సాధారణంగా ఆలయం మొత్తాన్ని కాక, దేవుని సన్నిధితో సంబంధమున్న లోపలి పరిశుద్ధ స్థలాన్ని సూచిస్తుంది. ‘అంతరాలయం’ ఆ ప్రత్యేకతను కాపాడుతూ తరువాతి సిద్ధాంతార్థాలను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవప్రదమైన, అయితే సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని సమాంతర కాలవాక్యాలను నిలిపి, కృత్రిమమైన పదానువాదాన్ని నివారించాం.
