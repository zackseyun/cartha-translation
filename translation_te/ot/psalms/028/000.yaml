base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/000.yaml
  text: Of David[a]. To you, Yahweh, I call; my rock, do not be deaf to me, lest if you are silent to me[c][b], I become like those going down to the pit.
translation:
  language: te
  text: 'దావీదు కీర్తన.[a]


    యెహోవా, నేను నీకే మొరపెడుతున్నాను;

    నా శిలా, నన్ను విననివాడిలా ఉండకు.[b]


    నీవు నా పట్ల మౌనంగా ఉంటే,

    నేను గోతిలోకి దిగిపోయేవారిలా అవుతాను.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “దావీదుకు చెందినది.” ఇది దావీదు రచించిన కీర్తనను లేదా దావీదుతో సంబంధమున్న కీర్తనను సూచించవచ్చు.
    reason: source_ambiguity
  - marker: b
    text: లేదా, “నా పట్ల మౌనంగా ఉండకు.” ఇక్కడి హీబ్రూ క్రియ వినకపోవడం లేదా మౌనంగా ఉండడం అనే భావాలను ఇవ్వగలదు; తరువాతి పాదంలో మౌనం అనే భావం మళ్లీ వస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: “గోతి” సమాధిని లేదా మృతుల లోకాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: దావీదు కీర్తన
  rationale: హీబ్రూ శీర్షికలోని సంబంధార్థక לְ ను సహజమైన తెలుగు కీర్తనాశీర్షికగా వ్యక్తం చేస్తూ, రచయిత లేదా సంబంధం అనే పరిధిని పాదటిప్పణిలో ఉంచింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుగా మార్చకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో లిప్యంతరీకరించింది.
- source_word: צוּרִי
  choice: నా శిలా
  rationale: ‘నా బండ’ కంటే సంబోధనలో గౌరవప్రదంగా, సహజంగా ఉండే రూపాన్ని ఎంచుకొని మూలంలోని శిల రూపకాన్ని నిలిపింది.
- source_word: אַל־תֶּחֱרַשׁ מִמֶּנִּי
  choice: నా మొర విననివాడిలా ఉండకు
  rationale: חרש లోని వినకపోవడం/మౌనంగా ఉండడం అనే భావవ్యాప్తిలో మొదటి భావాన్ని ప్రధాన పాఠంలో చూపించి, వెంటనే వచ్చే חשה తో ఉన్న ఉద్దేశపూర్వక పునరుక్తి-భేదాన్ని కాపాడింది.
- source_word: תֶּחֱשֶׁה מִמֶּנִּי
  choice: నా పట్ల మౌనంగా ఉంటే
  rationale: మూలంలోని ‘మౌనంగా ఉండడం’ అనే భావాన్ని నేరుగా ఉంచి, దేవుని స్పందన లేకపోవడం వల్ల కలిగే భయాన్ని పరిష్కరించకుండా నిలిపింది.
- source_word: יוֹרְדֵי בוֹר
  choice: గోతిలోకి దిగిపోయేవారు
  rationale: ‘దిగేవారు’ అనే కదలికను మరియు בור యొక్క ప్రాథమిక ‘గొయ్యి/గోతి’ రూపకాన్ని కాపాడుతూ, మరణం లేదా మృతుల లోకం అనే విస్తృతార్థాన్ని పాదటిప్పణిలో తెలిపింది.
theological_decisions:
- issue: దేవుని మౌనం మరియు కీర్తనకర్త మరణస్థితికి సమానమవడం మధ్య సంబంధం
  choice: నీవు నా పట్ల మౌనంగా ఉంటే, నేను గోతిలోకి దిగిపోయేవారిలా అవుతాను
  alternative: నీవు నా పట్ల మౌనంగా ఉండి, నేను గోతిలోకి దిగిపోయేవారిలా కాకుండా చూడు
  rationale: פן పరిచయం చేసే భయపడిన పరిణామాన్ని సహజమైన తెలుగులో షరతు-ఫలిత సంబంధంగా చూపింది; దేవుని మౌనం ఏ విధంగా ఆ పరిణామానికి దారితీస్తుందో అదనంగా సిద్ధాంతీకరించలేదు.
- issue: ‘గోతి’ యొక్క పరలోక సంబంధిత అర్థం
  choice: ప్రధాన పాఠంలో ‘గోతి’ అనే రూపకాన్ని నిలిపింది
  alternative: ‘సమాధి’ లేదా ‘మృతుల లోకం’ అని స్పష్టీకరించడం
  rationale: בור సమాధి లేదా మృతుల లోకాన్ని సూచించగలిగినా, మూలపాఠంలోని చిత్రాన్ని ఒకే సిద్ధాంతార్థానికి పరిమితం చేయకుండా పాదటిప్పణిలో అర్థపరిధిని తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనా గాంభీర్యాన్ని నిలిపే సరళమైన కవితా పాదాలుగా రూపొందించబడింది. ‘నా శిలా’ అనే మూల రూపకాన్ని అలాగే ఉంచి, అరుదైన లేదా మతశాఖాపరమైన పదజాలాన్ని నివారించింది.
