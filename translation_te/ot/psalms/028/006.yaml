  yaml_path: translation/ot/psalms/028/006.yaml
  text: Blessed be Yahweh[b][a], for he has heard the voice of my pleas for mercy.
translation:
  language: te
  text: యాహ్వే స్తుతింపబడుగాక! ఎందుకంటే నా కరుణావిన్నపాల స్వరాన్ని ఆయన విన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా కరుణావిన్నపాల ధ్వనిని.” హీబ్రూ పదానికి “స్వరం” లేదా “ధ్వని” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: స్తుతింపబడుగాక
  rationale: దైవస్తుతి సందర్భంలోని ఆశీర్వాదాత్మక ఉద్ఘాటనను సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న స్తుతికి కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: שָׁמַע
  choice: విన్నాడు
  rationale: కీర్తనకర్త ప్రార్థనను దేవుడు ఆలకించిన పూర్తయిన కార్యాన్ని సందర్భానుకూలంగా తెలియజేస్తుంది.
- source_word: קוֹל
  choice: స్వరాన్ని
  rationale: ఈ పదంలోని ‘స్వరం/ధ్వని’ భావాన్ని నిలుపుతూ వ్యక్తిగత మొర సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: תַּחֲנוּנָי
  choice: కరుణ కోసం నేను చేసిన మొరల
  rationale: కృప లేదా కరుణ కోరుతూ చేసే తీవ్రమైన విన్నపాల భావాన్ని సాధారణ ఆధునిక పాఠకులకు స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించిన ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కీర్తనా శైలిని ఉపయోగించాం. ‘స్తుతింపబడుగాక’ దైవస్తుతి ఉద్ఘాటనను నిలుపుతుంది; మిగతా వాక్యం సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా రూపొందించబడింది.
