id: PSA.28.4
reference: Psalms 28:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: תֶּן לָ/הֶ֣ם כְּ/פָעֳלָ/ם֮ וּ/כְ/רֹ֪עַ מַֽעַלְלֵ֫י/הֶ֥ם כְּ/מַעֲשֵׂ֣ה יְ֭דֵי/הֶם תֵּ֣ן לָ/הֶ֑ם הָשֵׁ֖ב גְּמוּלָ֣/ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/004.yaml
  text: Give to them according to their work[a], and according to the evil of their deeds; according to the work of their hands give to them; repay them their due.
translation:
  language: te
  text: వారి క్రియలకు తగినట్లుగా వారికి ప్రతిఫలమివ్వు; వారి కార్యాల చెడుతనానికి తగినట్లుగా వారికి ప్రతిఫలమివ్వు. వారి చేతుల పనులకు తగినట్లుగా వారికి ప్రతిఫలమివ్వు; వారికి తగిన ప్రతిఫలాన్ని తిరిగి చెల్లించు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶּן לָהֶם
  choice: వారికి చేయి
  rationale: נתן యొక్క ఆజ్ఞార్థక రూపం అక్షరార్థంగా ‘ఇవ్వు’; అయితే ప్రతిఫలాన్ని సూచించే ఈ సందర్భంలో ‘వారికి చేయి’ అనేది సహజమైన తెలుగు, అలాగే దేవునికి ఉద్దేశించిన ప్రత్యక్ష విన్నప బలాన్ని నిలుపుతుంది.
- source_word: כְּפָעֳלָם
  choice: వారి క్రియకు తగినట్టుగా
  rationale: פעל అంటే పని, క్రియ లేదా చేసిన కార్యం. ఏ పని చేశారో దానికి అనుగుణమైన ప్రతిఫలం అనే కొలత-ప్రకారం భావాన్ని ‘తగినట్టుగా’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּכְרֹעַ מַעַלְלֵיהֶם
  choice: వారి పనుల దుష్టత్వానికి తగినట్టుగా
  rationale: רֹעַ లోని నైతికమైన ‘చెడు/దుష్టత్వం’ భావాన్ని, מעללים లోని కార్యాల భావాన్ని నిలుపుతూ సహజమైన తెలుగు నిర్మాణం ఎంచుకోబడింది.
- source_word: כְּמַעֲשֵׂה יְדֵיהֶם
  choice: వారి చేతుల పని ప్రకారం
  rationale: వారు స్వయంగా చేసినదాన్ని నొక్కిచెప్పే హీబ్రూ ‘చేతుల పని’ రూపకాన్ని, కీర్తనలోని సమాంతర నిర్మాణంతో సహా నిలుపుతుంది.
- source_word: הָשֵׁב
  choice: తిరిగి చెల్లించు
  rationale: שוב హిఫీల్ ఇక్కడ చేసినదానికి ప్రతిగా తిరిగి కలిగించడం, అంటే ప్రతిఫలమివ్వడం అనే న్యాయపరమైన భావాన్ని కలిగి ఉంది.
- source_word: גְּמוּלָם
  choice: వారికి తగిన ప్రతిఫలాన్ని
  rationale: גְּמוּלָם చేసిన కార్యానికి తగిన ప్రతిఫలం లేదా ప్రతిచెల్లింపును సూచిస్తుంది. ‘తగిన ప్రతిఫలం’ ఆధునిక తెలుగులో గంభీరంగా, స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: శాపప్రార్థనాత్మక భాష మరియు దైవిక ప్రతిఫలం
  choice: దుష్టుల క్రియలకు తగినట్టుగా దేవుడు వారికి ప్రతిఫలం చేయాలని కోరే విన్నపంగా అనువదించబడింది.
  alternative: దీన్ని కేవలం వారి భవిష్యత్తును వర్ణించే ప్రకటనగా మృదువుగా అనువదించడం.
  rationale: ‘చేయి… చేయి… తిరిగి చెల్లించు’ అనే వరుస ఆజ్ఞార్థక రూపాలు తటస్థ వర్ణన కాక, దైవన్యాయం కోసం చేసిన ప్రార్థన అని స్పష్టం చేస్తాయి. హీబ్రూ కంటే భావాన్ని తీవ్రతరం చేయకుండా దాని న్యాయపరమైన బలం నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, కీర్తనా శైలికి తగిన గంభీరతతో అనువదించబడింది. మూలంలోని కొలత-ప్రకారం సమాంతరతను ‘తగినట్టుగా/ప్రకారం’ ద్వారా, ‘వారి చేతుల పని’ అనే రూపకాన్ని యథాతథంగా నిలిపాం.
