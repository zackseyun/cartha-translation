revisions:
- from: వారి క్రియకు తగినట్టుగా వారికి చేయి; వారి పనుల దుష్టత్వానికి తగినట్టుగా చేయి. వారి చేతుల పని ప్రకారం వారికి చేయి; వారికి తగిన ప్రతిఫలాన్ని తిరిగి చెల్లించు.
  to: వారి క్రియలకు తగినట్లుగా వారికి ప్రతిఫలమివ్వు; వారి కార్యాల చెడుతనానికి తగినట్లుగా వారికి ప్రతిఫలమివ్వు. వారి చేతుల పనులకు తగినట్లుగా వారికి ప్రతిఫలమివ్వు; వారికి తగిన ప్రతిఫలాన్ని తిరిగి చెల్లించు.
  rationale: The revision makes the implied object of the repeated imperatives explicit as recompense, improving clarity and naturalness while retaining the Hebrew's repeated petition and proportional-retribution parallelism. It preserves the final distinct requital verb with “తిరిగి చెల్లించు.”
  reviewer_model: gpt-5.6-terra
