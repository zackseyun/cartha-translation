  text: Save your people and bless your inheritance[b][a]; shepherd them and carry them forever.
translation:
  language: te
  text: 'నీ ప్రజలను రక్షించు;

    నీ స్వాస్థ్యాన్ని ఆశీర్వదించు;

    వారిని కాపరిగా నడిపించు[a],

    వారిని ఎప్పటికీ మోయు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారిని మేపు.’ హెబ్రీ క్రియ మందకు ఆహారం పెట్టడాన్ని సూచించగలదు; అయితే కాపరి చేసే సమగ్ర పోషణ, మార్గదర్శనం, సంరక్షణను కూడా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వారిని పైకెత్తు’ లేదా ‘వారిని భరించు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעָה
  choice: రక్షించు
  rationale: దేవునికి ఉద్దేశించిన ఆజ్ఞార్థక ప్రార్థన. ‘రక్షించు’ అనేది విడిపించడం, కాపాడడం అనే విస్తృత భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עַמֶּךָ
  choice: నీ ప్రజలు
  rationale: దేవునికి చెందిన సమాజాన్ని సూచించే 2వ పురుష ఏకవచన ప్రత్యయంతో కూడిన పదబంధాన్ని నేరుగా, స్పష్టంగా అందిస్తుంది.
- source_word: בָרֵךְ
  choice: ఆశీర్వదించు
  rationale: ప్రార్థనలోని ఆజ్ఞార్థక రూపాన్ని, ఆరాధనా గాంభీర్యాన్ని సహజంగా నిలుపుతుంది.
- source_word: נַחֲלָתֶךָ
  choice: నీ స్వాస్థ్యం
  rationale: ప్రజలు దేవునికి చెందిన స్వాస్థ్యమనే నిబంధనాత్మక రూపకాన్ని నిలుపుతుంది; కేవలం ‘ఆస్తి’ అనే భౌతిక అర్థానికి పరిమితం చేయదు.
- source_word: רְעֵם
  choice: వారిని కాపరిగా నడిపించు
  rationale: మందను మేపడం మాత్రమే కాక, కాపరి చేసే పోషణ, మార్గదర్శనం, సంరక్షణ అన్నిటినీ సూచించే విస్తృత పశుపాలక రూపకాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: נַשְּׂאֵם
  choice: వారిని మోసుకొనిపో
  rationale: నשא అనే పదంలోని మోయడం/భరించడం భావాన్ని, ముందు ఉన్న కాపరి రూపకంతో సహజంగా అనుసంధానిస్తుంది; ‘పైకెత్తు’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: עַד הָעוֹלָם
  choice: ఎప్పటికీ
  rationale: అంతంలేని, నిరంతర కాలవ్యాప్తిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: רְעֵם లోని కాపరి రూపకం
  choice: వారిని కాపరిగా నడిపించు
  alternative: వారిని మేపు
  rationale: మూల క్రియ ఆహారం పెట్టడాన్ని కలిగి ఉన్నప్పటికీ దానికే పరిమితం కాదు. ఎటువంటి తరువాతి సిద్ధాంత భావనను జోడించకుండా దేవుని పోషణ, మార్గదర్శనం, సంరక్షణ అనే సమృద్ధమైన రూపకాన్ని నిలుపుతుంది.
- issue: נַחֲלָתֶךָ లోని నిబంధనాత్మక గుర్తింపు
  choice: నీ స్వాస్థ్యం
  alternative: నీ వారసత్వ సంపద
  rationale: ప్రజలు దేవునికి చెందిన కేటాయింపైన స్వాస్థ్యమనే రూపకాన్ని సంక్షిప్తంగా నిలుపుతుంది; వారిని కేవలం వస్తుసంబంధమైన ‘ఆస్తి’గా చదివే అవకాశాన్ని తగ్గిస్తుంది.
- issue: נַשְּׂאֵם లోని అర్థ విస్తృతి
  choice: వారిని మోసుకొనిపో
  alternative: వారిని పైకెత్తు
  rationale: కాపరి రూపక సందర్భంలో సంరక్షణతో మోసుకుపోవడం సహజంగా ఉన్నా, హెబ్రీ పదం ‘పైకెత్తడం’ లేదా ‘భరించడం’ అని కూడా అర్థమివ్వగలదు; అందుచేత ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనా గాంభీర్యాన్ని నిలుపుతూ సరళమైన ఏకవచన ఆజ్ఞార్థక రూపాలు వాడబడ్డాయి. హెబ్రీ సమాంతర నిర్మాణాన్ని పాద విభజనతో ప్రతిబింబించాం; పాతకాలపు ‘రక్షింపుము/మేపుము’ రూపాలను నివారించాం.
