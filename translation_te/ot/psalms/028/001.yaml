source:
  edition: WLC
  text: לְ/דָוִ֡ד אֵ֘לֶ֤י/ךָ יְהוָ֨ה אֶקְרָ֗א צוּרִ/י֮ אַֽל תֶּחֱרַ֪שׁ מִ֫מֶּ֥/נִּי פֶּן תֶּֽחֱשֶׁ֥ה מִמֶּ֑/נִּי וְ֝/נִמְשַׁ֗לְתִּי עִם י֥וֹרְדֵי בֽוֹר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/001.yaml
  text: Of David[a]. To you, O Yahweh, I call; my rock, do not be deaf to me[c][b], lest you be silent to me and I become like those who go down to the pit.
translation:
  language: te
  text: 'దావీదుకు చెందినది.[a]


    యాహ్వే, నీకు నేను మొరపెడతాను;

    నా బండవైనవాడా, నా మొరను వినకుండా ఉండకు.[b]

    లేకపోతే నీవు నా పట్ల మౌనంగా ఉంటే,

    నేను గోతిలోకి దిగేవారిలా అయిపోతాను.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దావీదు కోసం’ లేదా ‘దావీదు రచించినది.’ హీబ్రూ శీర్షిక ఈ సంబంధాన్ని పూర్తిగా నిర్దిష్టం చేయదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నా పట్ల మౌనంగా ఉండకు.’ ఇక్కడి హీబ్రూ క్రియ వినకపోవడం లేదా మౌనంగా ఉండడం అనే రెండు భావాలను సూచించగలదు; తరువాతి పాదంలో మౌనానికి మరో క్రియ వాడబడింది.
    reason: lexical_ambiguity
  - marker: c
    text: ‘గోతి’ సమాధిని లేదా మృతుల లోకాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: దావీదుకు చెందినది
  rationale: కీర్తన శీర్షికలోని לְ ఉపసర్గ రచయితను, అంకితాన్ని, లేదా సంబంధాన్ని సూచించవచ్చు. ‘దావీదుకు చెందినది’ ఈ అనిశ్చితిని ‘దావీదు రచించినది’ కంటే మెరుగ్గా నిలుపుతుంది.
- source_word: אֵלֶיךָ ... אֶקְרָא
  choice: నేను నీకే మొరపెడుతున్నాను
  rationale: దేవుణ్ణి ప్రార్థనలో పిలిచే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘నీకే’ దిశతో పాటు కీర్తనకర్త దేవునిపైనే ఆధారపడుతున్న భావాన్ని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: צוּרִי
  choice: నా బండవైన దేవా
  rationale: צוּר యొక్క స్థిరత్వం, రక్షణ అనే సజీవ రూపకాన్ని ‘బండ’ ద్వారా నిలుపుతుంది. సంబోధన తెలుగులో స్పష్టంగా ఉండేందుకు ‘దేవా’ చేర్చబడింది; అది కొత్త బిరుదును విధించడం కాదు, యాహ్వేనే బండగా సంబోధిస్తున్న నిర్మాణాన్ని తెలుపుతుంది.
- source_word: אַל תֶּחֱרַשׁ מִמֶּנִּי
  choice: నా మొర విననట్టుగా ఉండకు
  rationale: חרשׁ ఇక్కడ చెవిటిగా ఉండడం లేదా మౌనంగా ఉండడం అనే భావాలను కలిగి ఉండవచ్చు. తరువాత వచ్చే ‘మౌనంగా’ అనే వేరే క్రియతో తేడాను నిలుపుతూ, తెలుగులో సహజంగా ‘విననట్టుగా’ అని అనువదించబడింది.
- source_word: תֶּחֱשֶׁה מִמֶּנִּי
  choice: నీవు నా పట్ల మౌనంగా ఉంటే
  rationale: חשה యొక్క ‘మౌనంగా ఉండు, జవాబివ్వకు’ అనే భావాన్ని నిలుపుతుంది. פֶּן సూచించే భయపడుతున్న పరిణామాన్ని సహజమైన తెలుగు షరతు నిర్మాణంతో అనుసంధానిస్తుంది.
- source_word: וְנִמְשַׁלְתִּי
  choice: నేను ... లా అయిపోతాను
  rationale: నిఫాల్ రూపంలోని ‘పోలినవాడనవుతాను/సమానమవుతాను’ అనే భావాన్ని సరళమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: עִם יֹרְדֵי בוֹר
  choice: గోతిలోకి దిగేవారిలా
  rationale: ‘గోతి’ అనే స్పష్టమైన హీబ్రూ ప్రతిమను నిలుపుతూ, అది సమాధిని లేదా మృతుల లోకాన్ని సూచించగల అవకాశాన్ని పాదటిప్పణిలో వివరిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామమే ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు; ‘యెహోవా’ కంటే మూల ఉచ్చారణకు దగ్గరగా ఉన్న ‘యాహ్వే’ను ఉపయోగించింది.
- issue: צוּרִי లోని దేవుని రూపకం
  choice: నా బండవైన దేవా
  alternative: నా ఆశ్రయమా
  rationale: ‘ఆశ్రయం’ భావాన్ని వివరించినప్పటికీ, మూలంలోని బండ అనే రూపకాన్ని తొలగిస్తుంది. కాబట్టి స్థిరత్వం, రక్షణ రెండింటినీ సూచించే మూల రూపకమే నిలుపబడింది.
- issue: దేవుని మౌనం మరియు కీర్తనకర్త మరణస్థితి
  choice: మౌనంగా ఉంటే ... గోతిలోకి దిగేవారిలా అయిపోతాను
  alternative: నీవు నన్ను మరణానికి అప్పగిస్తావు
  rationale: మూలపాఠం దేవుని ఉద్దేశాన్ని ప్రత్యక్షంగా ప్రకటించదు; జవాబు రాకపోతే ఎదురయ్యే భయాన్ని మాత్రమే వ్యక్తం చేస్తుంది. అందువల్ల దేవుడు క్రియాశీలంగా మరణానికి అప్పగిస్తున్నాడని అనువాదం స్పష్టీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ప్రార్థనా కవిత్వానికి తగిన గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలి వాడబడింది. హీబ్రూ పాద విభజనను సాధ్యమైనంతవరకు నిలుపుతూ, ‘విననట్టుగా’ మరియు ‘మౌనంగా’ అనే పదాలతో మూలంలోని సమీపార్థక క్రియల మధ్య తేడా కాపాడబడింది.
