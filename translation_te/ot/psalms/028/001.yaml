    నేను గోతిలోకి దిగేవారిలా అయిపోతాను.[c]'
  rationale: The revision removes unsupported emphasis and an added title, while keeping the divine address and the rock metaphor natural in Telugu. It uses “నా మొరను వినకుండా ఉండకు” to preserve the first verb’s hearing/deafness sense in contrast with the subsequent explicit silence. “లేకపోతే” faithfully expresses the feared consequence introduced by פֶּן. Footnote anchors and their coverage remain complete and correctly placed.
  reviewer_model: gpt-5.6-terra
