  yaml_path: translation/ot/psalms/028/007.yaml
  text: Yahweh is my strength and my shield[a]; in him my heart trusts, and I am helped. Therefore my heart rejoices[c][b], and with my song I will praise him.
translation:
  language: te
  text: 'యహ్వే నా బలం, నా డాలు;

    ఆయనలో నా హృదయం నమ్మకం ఉంచింది[a], నాకు సహాయం లభించింది.

    అందుకే నా హృదయం ఉల్లసించింది[b];

    నా పాటతో ఆయనను స్తుతిస్తాను[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనపై నా హృదయం నమ్మకం ఉంచింది.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా హృదయం ఆనందంతో ఉప్పొంగింది.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ఆయనకు కృతజ్ఞతలు చెల్లిస్తాను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సమీప లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: עֻזִּי
  choice: నా బలం
  rationale: עֹז అనే నామవాచకానికి ఇక్కడ నేరమైన అర్థం ‘బలం’; తరువాతి ‘నా డాలు’ అనే రూపకంతో సహజమైన సమాంతరతను కలిగిస్తుంది.
- source_word: מָגִנִּי
  choice: నా డాలు
  rationale: మూలంలోని స్పష్టమైన ‘shield’ రూపకాన్ని సాధారణీకరించి ‘రక్షకుడు’ అని మార్చకుండా నిలిపాం.
- source_word: בּוֹ בָטַח לִבִּי
  choice: ఆయనలో నా హృదయం నమ్మకం ఉంచింది
  rationale: ב తో కూడిన בטח ఆధారపడే నమ్మకాన్ని సూచిస్తుంది. ‘ఆయనలో’ మూలంలోని సంబంధాన్ని నిలుపుతుంది; ‘నా హృదయం’ అంతరంగ వ్యక్తిని సూచించే కవితాత్మక భాషను కాపాడుతుంది.
- source_word: נֶעֱזָרְתִּי
  choice: నాకు సహాయం లభించింది
  rationale: עזר నిఫల్ రూపంలోని సహాయం పొందిన భావాన్ని సహజమైన తెలుగు కర్మణి నిర్మాణంలో వ్యక్తం చేశాం; సహాయం చేసినవారిని మూలం చెప్పనట్లే అనువాదమూ స్పష్టంగా చేర్చదు.
- source_word: וַיַּעֲלֹז לִבִּי
  choice: నా హృదయం ఉల్లసించింది
  rationale: עלז ఉత్సాహభరితమైన ఆనందాన్ని సూచిస్తుంది. వరుసలోని హీబ్రూ కథనరూపాన్ని గతకాలంతో నిలిపి, గాఢమైన ఆనందాన్ని ‘ఉల్లసించింది’తో తెలిపాం.
- source_word: וּמִשִּׁירִי
  choice: నా పాటతో
  rationale: ఇక్కడ מִן సాధనం లేదా తోడును సూచిస్తుంది; స్తుతి పాట ద్వారా వ్యక్తమవుతుందనే భావానికి ‘నా పాటతో’ సహజంగా సరిపోతుంది.
- source_word: אֲהוֹדֶנּוּ
  choice: ఆయనను స్తుతిస్తాను
  rationale: ידה హిఫిల్‌కు ‘స్తుతించు’ మరియు ‘కృతజ్ఞతలు చెల్లించు’ రెండూ సాధ్యమైనవి. పాట సందర్భంలో ‘స్తుతిస్తాను’ ప్రధాన పాఠంగా సహజం; కృతజ్ఞత భావాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని వాడుతుంది. దాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది; ‘యెహోవా’ వేరొక సాంప్రదాయ ఉచ్చారణను ప్రతిబింబిస్తుంది.
- issue: בטח యొక్క కాలం మరియు నమ్మక సంబంధం
  choice: నమ్మకం ఉంచింది
  alternative: నమ్మకం ఉంచుతోంది
  rationale: మసొరా పాఠంలో క్రియ సంపూర్ణ రూపంలో ఉంది; అందుచేత గతంలో జరిగిన నమ్మకాన్ని ప్రధాన పాఠంలో ఉంచాం. అయినా కీర్తనాత్మక సందర్భంలో కొనసాగుతున్న నమ్మకస్థితి అనే భావసంభావ్యతను పూర్తిగా నిరాకరించడం లేదు.
- issue: ידה యొక్క స్తుతి–కృతజ్ఞత అర్థవిస్తృతి
  choice: స్తుతిస్తాను
  alternative: కృతజ్ఞతలు చెల్లిస్తాను
  rationale: పాటతో కూడిన ఆరాధనా సందర్భం ‘స్తుతి’కి మద్దతిస్తుంది; అయితే హీబ్రూ క్రియలో నిజమైన కృతజ్ఞత భావమూ ఉన్నందున దాన్ని పాదటిప్పణిగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకుడికి అర్థమయ్యేలా గంభీరమైన కవితాత్మక శైలిని వాడాం. ‘బలం–డాలు’, ‘హృదయం’, ‘పాట’ అనే మూల రూపకాలను నిలిపాం. తెలుగు వాక్యప్రవాహం కోసం పాదాలను విభజించాం; పాదటిప్పణి గుర్తులను అవి వివరిస్తున్న పదబంధాల దగ్గరే క్రమంగా ఉంచాం.
