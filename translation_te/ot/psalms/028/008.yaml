source:
  edition: WLC
  text: יְהוָ֥ה עֹֽז לָ֑/מוֹ וּ/מָ֘ע֤וֹז יְשׁוּע֖וֹת מְשִׁיח֣/וֹ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/008.yaml
  text: Yahweh is strength for them[b][a], and he is a stronghold of salvation for his anointed one.
translation:
  language: te
  text: యాహ్వే వారికి బలం; తన అభిషిక్తునికి[b] రక్షణల[a] దుర్గం ఆయనే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘విమోచనల దుర్గం,’ ‘రక్షించే కార్యాలకు కోట.’ హీబ్రూలో ‘రక్షణలు’ అనే నామవాచకం బహువచనంలో ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘తన అభిషిక్తుడు’ అనే మాటను ‘తన మెస్సీయా’ అని కూడా అనువదించవచ్చు. సందర్భంలో ఇది మొదట యాహ్వే అభిషేకించిన రాజును సూచించే అవకాశం ఉంది; అదే సమయంలో విస్తృత మెస్సీయా సంబంధిత భావాన్నీ అనుమతిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: עֹז
  choice: బలం
  rationale: ఇది శక్తి లేదా బలాన్ని సూచిస్తుంది; తరువాతి מָעוֹז అనే ‘దుర్గం’ భావంతో కలపకుండా భేదాన్ని నిలిపాం.
- source_word: לָמוֹ
  choice: వారికి
  rationale: హీబ్రూ రూపం తృతీయ పురుష బహువచనం; సందర్భాన్ని బట్టి ‘అతనికి’ లేదా ‘తన ప్రజలకు’ అని మార్చకుండా మూలంలోని బహువచనాన్ని నిలిపాం.
- source_word: מָעוֹז
  choice: దుర్గం
  rationale: రక్షణనిచ్చే బలమైన ఆశ్రయస్థలం అనే కోటసదృశ భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְשׁוּעוֹת
  choice: రక్షణలు
  rationale: మూలంలోని నామవాచకం బహువచనంలో ఉంది; అనేకసార్లు లేదా అనేక విధాల కలిగే విమోచన కార్యాల భావాన్ని నిలిపేందుకు ‘రక్షణలు’ అని ఇచ్చాం.
- source_word: מְשִׁיחוֹ
  choice: తన అభిషిక్తుడు
  rationale: సందర్భంలో యాహ్వే అభిషేకించిన రాజును నేరుగా సూచించగల వర్ణనాత్మక పదబంధం; దానిని స్థిరమైన ‘మెస్సీయా’ బిరుదుగా ముందుగానే నిర్ణయించదు.
- source_word: הוּא
  choice: ఆయనే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగు వాక్యంలో సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: מְשִׁיחוֹ పదాన్ని ‘తన అభిషిక్తుడు’గా ఇవ్వాలా, ‘తన మెస్సీయా’గా ఇవ్వాలా
  choice: తన అభిషిక్తుడు
  alternative: తన మెస్సీయా
  rationale: కీర్తన సందర్భంలో ఈ పదం మొదట యాహ్వే అభిషేకించిన రాజును సూచించవచ్చు. అదే సమయంలో విస్తృత మెస్సీయా సంబంధిత ప్రతిధ్వనిని పాదసూచికలో నిలిపి, ప్రధాన పాఠంలో వివాదాన్ని ఏకపక్షంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘రక్షణల దుర్గం’ కొంత అసాధారణమైన ప్రయోగమైనప్పటికీ, హీబ్రూ బహువచనాన్ని మరియు కోటసదృశ రూపకాన్ని ఉద్దేశపూర్వకంగా నిలిపాం.
