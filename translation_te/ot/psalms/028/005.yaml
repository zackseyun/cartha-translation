  choice: గ్రహించరు
  alternative: పట్టించుకోరు
  rationale: בין ప్రధానంగా అర్థం చేసుకోవడం లేదా వివేచించడం సూచించినా, אֶל తో కూడిన నిర్మాణం శ్రద్ధ పెట్టడం లేదా పరిగణించడం అనే ఛాయను కలిగి ఉండవచ్చు. ప్రధాన పాఠం విస్తృతమైన ‘గ్రహించరు’ భావాన్ని తీసుకుంటుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
