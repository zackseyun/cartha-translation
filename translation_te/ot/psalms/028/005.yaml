theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో నాలుగు అక్షరాల దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా, నామాన్ని తెలుగులో ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలరూపాన్ని కాపాడుతుంది.
