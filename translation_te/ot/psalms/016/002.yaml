  yaml_path: translation/ot/psalms/016/002.yaml
  text: I said to Yahweh[a], “You are my Lord; I have no good apart from you.”
translation:
  language: te
  text: నేను యాహ్వేతో అన్నాను[a], “నీవే నా ప్రభువు; నీవు తప్ప నాకు ఏ మేలూ లేదు.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ రూపం వ్యాకరణపరంగా “నీవు అన్నావు” అని కూడా చదవబడవచ్చు; అయితే సందర్భం మరియు ప్రాచీన అనువాదాలు “నేను అన్నాను” అనే భావానికి మద్దతిస్తాయి.
    reason: textual_and_grammatical_ambiguity
  - marker: b
    text: మరింత అక్షరార్థంగా, “నా మేలు నీకు అతీతమైనది కాదు.” ఈ సంక్షిప్త హీబ్రూ ప్రయోగం కీర్తనకర్త మేలు యాహ్వేకు వేరుగా లేదనే భావాన్ని వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתְּ
  choice: నేను … అన్నాను
  rationale: హీబ్రూ వ్యంజన-స్వర రూపం వ్యాకరణపరంగా రెండవ పురుష ఏకవచన స్త్రీలింగంగా కనిపించినా, సందర్భంలో కీర్తనకర్త దేవునితో చేసే ప్రథమ పురుష ఒప్పుకోలుగా ప్రాచీన అనువాదాలు దీనిని గ్రహించాయి. సహజమైన తెలుగులో కర్తను స్పష్టంగా ఉంచడం అవసరం.
- source_word: לַיהוָה
  choice: యాహ్వేతో
  rationale: לְ ఇక్కడ మాట ఎవరిని ఉద్దేశించి చెప్పబడిందో సూచిస్తుంది. తెలుగులో ‘యాహ్వేతో అన్నాను’ అనేది సహజమైన ప్రత్యక్ష సంబోధన నిర్మాణం; יהוה అనే దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: אֲדֹנָי
  choice: నా ప్రభువు
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయం ‘నా’ అనే భావాన్ని ఇస్తుంది. ప్రార్థనా సందర్భంలో ‘ప్రభువు’ గౌరవభరితంగానూ సహజంగానూ ఉంది.
- source_word: אָתָּה
  choice: నీవే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగులో ‘-ఏ’ ద్వారా వ్యక్తం చేశాం; హీబ్రూ నామవాచక వాక్యానికి తెలుగులో ప్రత్యేకంగా ‘ఉన్నావు’ అవసరం లేదు.
- source_word: טוֹבָתִי
  choice: నాకు … మేలు
  rationale: ఈ నామవాచకం మేలు, శ్రేయస్సు, ప్రయోజనం వంటి విస్తృత భావాలను కలిగి ఉంది. ‘మేలు’ నైతిక స్వయంనీతిని సూచించకుండా ఆ విస్తృతతను నిలుపుతుంది.
- source_word: בַּל עָלֶיךָ
  choice: నీవు తప్ప … లేదు
  rationale: కవితాత్మక నిరాకరణతో కూడిన ఈ సంక్షిప్త హీబ్రూ ప్రయోగాన్ని సహజమైన తెలుగులో దేవునికి వేరుగా తనకు మేలు లేదనే భావంతో ఇచ్చాం; మరింత అక్షరార్థమైన నిర్మాణాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: హీబ్రూ పాఠంలో నిబంధన దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలపాఠంలోని ప్రత్యేక నామాన్ని నిలుపుతుంది.
- issue: చివరి వాక్యభాగం యొక్క భావం
  choice: నీవు తప్ప నాకు ఏ మేలూ లేదు
  alternative: నా మేలు నీకు మించినది కాదు
  rationale: హీబ్రూ వాక్యం సంక్షిప్తమూ కొంత సందిగ్ధమూ. ప్రధాన అనువాదం దేవునిపై ఆధారపడే ఒప్పుకోలును సహజంగా తెలియజేస్తుంది; ‘మించినది కాదు’ అనే రూపంలో కనిపించే మూల నిర్మాణాన్ని పాదసూచికలో ఉంచి భావాన్ని అతిగా నిర్ణయించలేదు.
- issue: אָמַרְתְּ లోని వ్యాకరణ అసమానత
  choice: నేను అన్నాను
  alternative: నీవు అన్నావు
  rationale: వ్యంజన-స్వర రూపం రెండవ పురుష స్త్రీలింగంగా ఉన్నప్పటికీ, కీర్తన సందర్భం మరియు ప్రాచీన అనువాద సాక్ష్యం దీనిని కీర్తనకర్త పలికిన ప్రథమ పురుష వాక్యంగా గ్రహించడానికి బలమిస్తాయి. పాఠరూపంలోని అసమానతను పాదసూచికలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవభరితమైన ప్రార్థనా శైలిని ఉపయోగించాం. ‘నీవే’ ఒప్పుకోలులోని ఉద్ఘాటనను నిలుపుతుంది; ‘ఏ మేలూ లేదు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి కవితాత్మక గంభీరతను కాపాడుతుంది.
