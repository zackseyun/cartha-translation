  yaml_path: translation/ot/psalms/016/007.yaml
  text: I will bless Yahweh[a], who counsels me; even at night my inner being instructs me.
translation:
  language: te
  text: నాకు సలహా ఇచ్చే యహ్వేను నేను స్తుతిస్తాను; రాత్రివేళల్లో కూడా నా అంతరంగం నాకు ఉపదేశిస్తుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నా అంతరంగం’—అక్షరార్థంగా, ‘నా మూత్రపిండాలు.’ హీబ్రూ వాడుకలో మూత్రపిండాలు మనిషి లోతైన భావాలు, మనస్సాక్షి, అంతరాత్మను సూచించగలవు. ‘ఉపదేశిస్తుంది’ అనే క్రియకు ‘సరిదిద్దుతుంది’ లేదా ‘క్రమశిక్షణ ఇస్తుంది’ అనే ఛాయ కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָרֵךְ
  choice: నేను స్తుతిస్తాను
  rationale: పియేల్ రూపంలోని ברך దేవుని గురించి మేలు పలకడం, ఆయనను స్తుతించడం అనే భావాన్ని ఇక్కడ ఇస్తుంది. ఆధునిక తెలుగులో దేవునిని ‘ఆశీర్వదిస్తాను’ అనడం అపార్థానికి దారితీయవచ్చు; కాబట్టి సందర్భానుగుణంగా ‘స్తుతిస్తాను’ సహజంగా ఉంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సులభంగా పలికే లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: יְעָצָנִי
  choice: నాకు ఆలోచన చెప్పే
  rationale: יעץ అంటే సలహా లేదా ఆలోచన చెప్పడం. అసంపూర్ణ క్రియ ఇక్కడ యహ్వే చేసే లక్షణాత్మక కార్యాన్ని సూచిస్తుంది.
- source_word: אַף לֵילוֹת
  choice: రాత్రివేళల్లో కూడా
  rationale: אַף యొక్క సముచ్చయ-ఉద్ఘాటక భావాన్ని ‘కూడా’ తెలియజేస్తుంది; לֵילוֹת బహువచనం పునరావృతమయ్యే రాత్రివేళలను సూచిస్తుంది.
- source_word: יִסְּרוּנִי
  choice: నాకు ఉపదేశిస్తుంది
  rationale: יסרకు ఉపదేశించడం, సరిదిద్దడం, క్రమశిక్షణ ఇవ్వడం అనే భావపరిధి ఉంది. ఈ జ్ఞానసాహిత్య సందర్భంలో ‘ఉపదేశిస్తుంది’ ప్రధాన భావాన్ని సహజంగా ఇస్తుంది; సరిదిద్దే ఛాయను పూర్తిగా నిరాకరించదు.
- source_word: כִלְיוֹתָי
  choice: నా అంతరంగం
  rationale: అక్షరార్థంగా ‘నా మూత్రపిండాలు’; హీబ్రూ మానవశాస్త్రీయ రూపకంలో ఇది లోతైన భావాలు, మనస్సాక్షి, అంతరాత్మను సూచిస్తుంది. ‘నా అంతరంగం’ ఆధునిక పాఠకునికి ఆ కార్యార్థాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: כִלְיוֹתָי లోని శరీరావయవ రూపకం
  choice: ప్రధాన పాఠ్యంలో ‘నా అంతరంగం’; అక్షరార్థాన్ని పాదసూచికలో ఉంచడం
  alternative: ‘నా మూత్రపిండాలు’, ‘నా హృదయం’, లేదా ‘నా మనస్సు’
