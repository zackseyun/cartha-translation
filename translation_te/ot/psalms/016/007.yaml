- issue: יִסְּרוּנִי యొక్క ఉపదేశం/శిక్షణ భావపరిధి
  choice: ‘ఉపదేశిస్తుంది’
  alternative: ‘నన్ను సరిదిద్దుతుంది’ లేదా ‘నాకు క్రమశిక్షణ నేర్పుతుంది’
  rationale: రాత్రివేళ అంతరంగ పరిశీలన ద్వారా లభించే బోధ ఇక్కడ సహజమైన భావం. అయితే క్రియలోని సరిదిద్దే లేదా శిక్షణాత్మక ఛాయను నిర్ణయాత్మకంగా తొలగించకుండా పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని రెండు సమాంతర పాదాలను సెమికోలన్‌తో నిలిపాం; ‘రాత్రివేళల్లో’ ద్వారా హీబ్రూ బహువచన కాలవ్యక్తీకరణను సహజంగా ప్రతిబింబించాం.
