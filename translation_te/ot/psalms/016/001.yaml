  text: A miktam of David. Preserve me[a], O God, for I take refuge in you.
translation:
  language: te
  text: 'దావీదు మిక్తాం.[a]


    దేవా, నన్ను కాపాడు;


    ఎందుకంటే నేను నీలో ఆశ్రయం పొందాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మిక్తాం’ అనేది అర్థం ఖచ్చితంగా తెలియని హెబ్రీ కీర్తన శీర్షిక; అది ఒక రచనా రకాన్ని సూచించవచ్చు. కొందరు దీనిని ‘కీర్తన’ లేదా ‘సువర్ణ గీతం’ అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְתָּם
  choice: మిక్తాం
  rationale: ఈ కీర్తన శీర్షిక పదానికి అర్థం అనిశ్చితంగా ఉంది. ఊహాత్మకమైన అర్థాన్ని ప్రధాన పాఠ్యంలో పెట్టకుండా, హెబ్రీ రూపాన్ని లిప్యంతరీకరించడం సముచితం.
- source_word: לְדָוִד
  choice: దావీదు
  rationale: కీర్తన శీర్షికల్లో לְ అనేది రచయితను, సంబంధాన్ని లేదా అంకితాన్ని సూచించవచ్చు. తెలుగులో సహజమైన సంక్షిప్త శీర్షికగా ‘దావీదు మిక్తాం’ ఉంచడం ఈ సంబంధాన్ని అనవసరంగా నిర్ధారించదు.
- source_word: שָׁמְרֵנִי
  choice: నన్ను కాపాడు
  rationale: שׁמר క్రియ ఇక్కడ దేవుని సంరక్షణను కోరే ఆజ్ఞార్థక ప్రార్థన. ‘కాపాడు’ శారీరక రక్షణకే పరిమితం కాకుండా సాధారణ సంరక్షణ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֵל
  choice: దేవా
  rationale: ప్రత్యక్ష సంబోధనను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న వేడుకోలుకు కారణాన్ని స్పష్టంగా అనుసంధానిస్తుంది.
- source_word: חָסִיתִי
  choice: నేను ఆశ్రయం పొందాను
  rationale: חסה లోని ఆశ్రయ రూపకాన్ని నిలుపుతూ, హెబ్రీ సంపూర్ణ క్రియ సూచించే ఇప్పటికే ఏర్పడిన ఆధారపడే స్థితిని వ్యక్తపరుస్తుంది.
- source_word: בָךְ
  choice: నీలో
  rationale: חסה తో వచ్చిన בְ ఆశ్రయం ఎవరిలో ఉంచబడిందో సూచిస్తుంది; ‘నీలో’ దానికి నేరమైన, సహజమైన సమానార్థకం.
theological_decisions:
- issue: మִכְתָּם అనే శీర్షిక అర్థం
  choice: ‘మిక్తాం’ అని లిప్యంతరీకరించడం
  alternative: ‘కీర్తన’, ‘సువర్ణ గీతం’ లేదా ‘శాసనం’ అని అర్థానువాదం చేయడం
  rationale: ఈ పదం యొక్క ఖచ్చితమైన అర్థం తెలియదు. ఒక వివాదాస్పద అర్థాన్ని ఖచ్చితమైనదిగా చూపకుండా మూలంలోని అనిశ్చితిని కాపాడేందుకు లిప్యంతరీకరణను ఎంచుకున్నాం.
- issue: לְדָוִד సూచించే సంబంధం
  choice: ‘దావీదు మిక్తాం’ అనే సంక్షిప్త శీర్షిక
  alternative: ‘దావీదు రచించినది’, ‘దావీదు కోసం’ లేదా ‘దావీదుకు చెందినది’
  rationale: లామెద్ ఉపసర్గ రచయిత, సంబంధం లేదా అంకితం అనే భావాల్లో ఉండవచ్చు. తెలుగు శీర్షికలో సంబంధాన్ని తెరవిడిగా ఉంచడం మూలంలోని భావ విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవప్రదమైన, సరళమైన శైలి. కవితా పాద విభజనను నిలిపి, అనిశ్చితమైన శీర్షిక పదాన్ని పాదటిప్పణితో వివరించాం.
