source:
  edition: WLC
  text: כִּ֤י לֹא תַעֲזֹ֣ב נַפְשִׁ֣/י לִ/שְׁא֑וֹל לֹֽא תִתֵּ֥ן חֲ֝סִידְ/ךָ֗ לִ/רְא֥וֹת שָֽׁחַת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/010.yaml
  text: For you will not abandon my soul to Sheol[b][a], nor will you let your faithful one see the pit.
translation:
  language: te
  text: 'ఎందుకంటే, నీవు నా ప్రాణాన్ని షియోల్‌కు విడిచిపెట్టవు;

    నీ భక్తుణ్ణి[a] గొయ్యిని[b] చూడనివ్వవు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ పరిశుద్ధుణ్ణి,’ ‘నీ నమ్మకస్థుణ్ణి.’ హీబ్రూ పదం నమ్మకమైన, నిబద్ధతగల, భక్తిగల లేదా పరిశుద్ధుడైన వ్యక్తిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘క్షయాన్ని.’ సెప్టుయజింటులోనూ, కొత్త నిబంధనలో ఈ వచనాన్ని ఉటంకించిన చోట్లనూ క్షయం లేదా కుళ్లిపోవడం అనే భావాన్ని నొక్కిచెప్పే పదం ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని నమ్మకానికి కారణాన్ని పరిచయం చేస్తుంది; కీర్తనలోని తార్కిక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: תַעֲזֹב
  choice: విడిచిపెట్టవు
  rationale: עזב అంటే విడిచిపెట్టు, వదిలివేయు, త్యజించు. ఇక్కడ మరణలోకానికి అప్పగించి వదిలేయకపోవడాన్ని ‘విడిచిపెట్టవు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נַפְשִׁי
  choice: నా ప్రాణాన్ని
  rationale: נפש వ్యక్తి ప్రాణం, జీవం లేదా స్వయాన్ని సూచించగలదు. ‘ప్రాణం’ తెలుగు కవితా సందర్భంలో సహజంగా ఉండి, కేవలం శరీరానికి వేరైన ఆత్మ అనే సంకుచిత భావాన్ని బలవంతంగా రుద్దదు.
- source_word: לִשְׁאוֹל
  choice: షియోల్‌కు
  rationale: שְׁאוֹל సాధారణ సమాధి మాత్రమే కాక మృతుల లోకాన్ని సూచించే ప్రత్యేక హీబ్రూ పదం. మూల సంస్కృతి భావాన్ని నిలుపుటకు లిప్యంతరీకరణ ఉపయోగించబడింది.
- source_word: תִתֵּן
  choice: చూడనివ్వవు
  rationale: נתן అక్షరార్థంగా ‘ఇవ్వు’; క్రియావాచక రూపంతో వచ్చినప్పుడు ‘అనుమతించు/నివ్వు’ అనే భావం కలుగుతుంది. తెలుగులో ‘చూడనివ్వవు’ సహజమైన ప్రయోగం.
- source_word: חֲסִידְךָ
  choice: నీ విశ్వాసపాత్రుణ్ణి
  rationale: חסיד నిబద్ధత, నమ్మకత్వం, భక్తి గల వ్యక్తిని సూచిస్తుంది. ‘విశ్వాసపాత్రుడు’ సంబంధపరమైన నిబద్ధతను తెలియజేస్తూ, తరువాతి క్రైస్తవ ప్రయోగాన్ని ప్రధాన పాఠ్యంలో ముందుగానే నిర్ణయించదు.
- source_word: לִרְאוֹת
  choice: చూడ
  rationale: ראה యొక్క సాధారణ అర్థమైన ‘చూడు’ను నిలుపుతుంది. సందర్భంలో ‘అనుభవించు’ అనే భావం సూచితమైనా, హీబ్రూ కవితా ప్రయోగాన్ని అనువాదం కాపాడుతుంది.
- source_word: שָׁחַת
  choice: గోతిని
  rationale: שחת అంటే సందర్భానుసారం గొయ్యి/గోతి, నాశనం లేదా క్షయం కావచ్చు. షియోల్‌తో ఉన్న సమాంతరతలో ‘గోతి’ ప్రత్యక్ష హీబ్రూ భావానికి అనుకూలం; ‘క్షయం’ అనే ప్రాచీన ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
theological_decisions:
- issue: కొత్త నిబంధనలో ఈ వచనానికి ఉన్న మెస్సీయ సంబంధమైన అన్వయం
  choice: హీబ్రూ కీర్తనలోని తక్షణ పదార్థాన్ని ప్రధాన పాఠ్యంలో అనువదించి, ‘విశ్వాసపాత్రుడు’ మరియు ‘గోతి’ అని ఇవ్వడం.
  alternative: క్రీస్తు సంబంధమైన తరువాతి వినియోగాన్ని ముందుకు తేవడానికి ‘నీ పరిశుద్ధుడు’ మరియు ‘క్షయం’ అని అనువదించడం.
  rationale: అపొస్తలుల కార్యములలో ఈ వచనం మెస్సీయకు అన్వయించబడినా, ప్రధాన అనువాదం హీబ్రూ పాఠ్యంలోని నిజమైన పదార్థ పరిధిని అనవసరంగా సంకుచితం చేయకూడదు. సంప్రదాయపరంగా, క్రీస్తు సంబంధంగా ప్రాముఖ్యమైన ప్రత్యామ్నాయాలు పాదసూచికల్లో భద్రపరచబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళమైనప్పటికీ గౌరవప్రదమైన కవితా ధోరణి. ‘షియోల్’ మూలపాఠ్యంలోని ప్రత్యేక భావప్రపంచాన్ని నిలుపుతుంది. రెండు పాదాల సమాంతర నిర్మాణం సంరక్షించబడింది.
