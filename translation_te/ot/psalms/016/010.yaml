  rationale: The revision corrects the main-line nuance of חֲסִידְךָ and uses a more idiomatic term for ‘pit.’ It preserves the Hebrew text’s immediate sense, its poetic parallelism, Sheol terminology, and the historically important ‘Holy One/corruption’ alternatives in properly anchored footnotes.
