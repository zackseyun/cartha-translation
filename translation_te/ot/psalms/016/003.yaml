id: PSA.16.3
reference: Psalms 16:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לִ֭/קְדוֹשִׁים אֲשֶׁר בָּ/אָ֣רֶץ הֵ֑מָּה וְ֝/אַדִּירֵ֗י כָּל חֶפְצִ/י בָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/003.yaml
  text: As for the holy ones who are in the land[c][b][a], they are the noble ones in whom is all my delight.
translation:
  language: te
  text: దేశంలో ఉన్న[b] పవిత్రుల విషయానికొస్తే[a], వారు ఘనులు[c]; వారిలోనే నా ఆనందమంతా ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పవిత్రులకు’ లేదా ‘పవిత్రుల కొరకు.’
    reason: లְ ఉపసర్గను విషయప్రస్తావనగా కాక సంప్రదానార్థకంగా అర్థం చేసుకునే ప్రత్యామ్నాయం.
  - marker: b
    text: లేదా, ‘భూమిపై ఉన్న.’
    reason: אֶרֶץ కు ‘దేశం’తో పాటు ‘భూమి’ అనే అర్థం కూడా సాధ్యం.
  - marker: c
    text: లేదా, ‘శ్రేష్ఠులు’ లేదా ‘మహిమాన్వితులు.’
    reason: אַדִּיר గౌరవం, శ్రేష్ఠత, మహిమ అనే భావాలను సూచించగలదు.
lexical_decisions:
- source_word: לִקְדוֹשִׁים
  choice: పవిత్రుల విషయానికొస్తే
  rationale: ముందున్న לְ ను సందర్భంలో సాధారణ సంప్రదానార్థకంగా కాక విషయాన్ని సూచించే ప్రయోగంగా గ్రహించాం. קְדוֹשִׁים కు మతసంప్రదాయపరమైన ప్రత్యేకార్థాన్ని రుద్దకుండా ‘పవిత్రులు’ అని అనువదించాం.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: దేశంలో ఉన్న
  rationale: אֶרֶץ కు ‘దేశం’ లేదా ‘భూమి’ అనే రెండు అర్థాలు సాధ్యం. ఈ సందర్భంలో దేశంలో నివసించే మానవ సమాజాన్ని సూచించడం సహజంగా ఉంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: הֵמָּה
  choice: వారే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగు సహజ ప్రయోగమైన ‘వారే’ ద్వారా నిలిపాం.
- source_word: וְאַדִּירֵי
  choice: ఘనులు
  rationale: אַדִּיר అనే పదంలోని గౌరవం, శ్రేష్ఠత భావాలను ‘ఘనులు’ సహజంగా తెలియజేస్తుంది; సైనిక బలాన్ని అనవసరంగా సూచించదు.
- source_word: כָּל חֶפְצִי
  choice: నాకు కలిగే ఆనందమంతా
  rationale: חֵפֶץ లోని ఆనందం, ఇష్టం, అభిలాష అనే భావాలలో ఈ సందర్భానికి ‘ఆనందం’ సరిపోతుంది. స్వామ్యభావాన్ని తెలుగులో సహజంగా ‘నాకు కలిగే’ అని వ్యక్తం చేశాం.
- source_word: בָם
  choice: వారిలోనే
  rationale: בְ యొక్క ‘లో’ భావాన్ని నిలిపి, వ్యక్తులను సూచించే సహజ తెలుగు రూపాన్ని వాడాం; ‘నే’ ద్వారా వాక్యంలోని సంపూర్ణ ఆనందం అనే ఉద్ఘాటన స్పష్టమవుతుంది.
theological_decisions:
- issue: ‘పవిత్రులు’ ఎవరనే గుర్తింపు
  choice: దేశంలో ఉన్న దేవునికి చెందిన పవిత్ర ప్రజలను సూచించేలా అనువదించడం
  alternative: పరలోక పవిత్ర జీవులు; సాధారణంగా ప్రతిష్ఠించబడిన వ్యక్తులు
  rationale: ‘దేశంలో ఉన్న’ అనే పదబంధం భూమిపై ఉన్న మనుషులను బలంగా సూచిస్తుంది. అయినప్పటికీ తరువాతి సంఘపరమైన సాంకేతిక పదజాలాన్ని దిగుమతి చేయకుండా ‘పవిత్రులు’ అనే విస్తృత పదాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే శైలిని వాడాం. హీబ్రూ వాక్యంలోని అంశప్రస్తావన, సర్వనామ ఉద్ఘాటన, వ్యక్తులలో ఆనందం అనే సంబంధాన్ని సాధ్యమైనంత సహజంగా నిలిపాం.
