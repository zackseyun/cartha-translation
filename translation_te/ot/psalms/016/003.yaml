  - severity: low
    issue: Several distinct lexical alternatives are combined under one footnote anchor.
    rationale: The topical force of לְ, the ‘land/earth’ alternative, and the sense of אַדִּיר are separate source questions. Individual anchors provide clearer auditability without altering meaning.
