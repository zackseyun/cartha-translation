  text: Therefore my heart is glad[a], and my glory rejoices[b]; even my flesh will dwell securely.
translation:
  language: te
  text: 'కాబట్టి నా హృదయం సంతోషిస్తుంది;

    నా మహిమ[a] ఉల్లసిస్తుంది;

    నా శరీరం కూడా సురక్షితంగా నివసిస్తుంది.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా ఘనత,” “నా సర్వస్వం.” ఇక్కడ “నా మహిమ” అనేది వ్యక్తినే సూచించే కవితాత్మక ప్రయోగమని కొందరు అర్థం చేసుకుంటారు; కొన్ని ప్రాచీన అనువాద సంప్రదాయాలు దీనిని “నా నాలుక”గా వ్యక్తం చేశాయి.
    reason: lexical_alternative
  - marker: b
    text: లేదా “క్షేమంగా విశ్రమిస్తుంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: కాబట్టి
  rationale: ముందటి వచనాల్లో యెహోవా సన్నిధి, ఉపదేశం వల్ల కలిగిన నమ్మకానికి ఇది ఫలితమని తెలిపే నిర్ధారణాత్మక సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שָׂמַח לִבִּי
  choice: నా హృదయం సంతోషిస్తుంది
  rationale: హృదయాన్ని అంతరంగ వ్యక్తిత్వం, భావోద్వేగాల కేంద్రంగా చూపే హీబ్రూ రూపకాన్ని నిలుపుతూ, సందర్భంలోని ప్రస్తుత ఆనందస్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיָּגֶל
  choice: ఉల్లసిస్తుంది
  rationale: גיל సూచించే ఉప్పొంగే ఆనందాన్ని ‘ఉల్లసిస్తుంది’ స్పష్టంగా తెలియజేస్తుంది; మొదటి పాదంలోని ‘సంతోషిస్తుంది’తో ఉన్న కవితాత్మక సమాంతరతలో పదవైవిధ్యాన్ని కూడా నిలుపుతుంది.
- source_word: כְּבוֹדִי
  choice: నా మహిమ
  rationale: మూలపదానికి నేరమైన అర్థాన్ని నిలుపుతుంది. ఇది వ్యక్తి గౌరవాన్ని, అతని సర్వస్వాన్ని లేదా వ్యక్తీకరణాంగాన్ని సూచించే కవితాత్మక ప్రయోగం కావచ్చు; ఆ అనిశ్చితిని ప్రధాన పాఠంలో పరిష్కరించకుండా ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తుంది.
- source_word: אַף בְּשָׂרִי
  choice: నా శరీరం కూడా
  rationale: אַף యొక్క చేర్పు/ఉద్ఘాటన భావాన్ని ‘కూడా’ అందిస్తుంది. בשר అక్షరార్థంగా ‘మాంసం’ అయినా, ఇక్కడ భౌతిక దేహాన్ని సూచిస్తున్నందున ఆధునిక తెలుగులో అపార్థం కలగకుండా ‘శరీరం’ ఎంచుకుంది.
- source_word: יִשְׁכֹּן לָבֶטַח
  choice: సురక్షితంగా నివసిస్తుంది
  rationale: שׁכן యొక్క ‘నివసించు, స్థిరపడు’ భావాన్నీ, לבטח యొక్క భద్రత భావాన్నీ నేరుగా నిలుపుతుంది; ‘విశ్రమిస్తుంది’ అనే సాధ్యమైన సందర్భార్థాన్ని పాదసూచికలో ఉంచుతుంది.
theological_decisions:
- issue: తరువాతి గ్రంథసంబంధ వినియోగం ఉన్న సందర్భంలో כְּבוֹדִי అనువాదం
  choice: నా మహిమ
  alternative: నా ఘనత; నా సర్వస్వం; నా నాలుక
  rationale: హీబ్రూ పదం అక్షరార్థంగా ‘నా మహిమ.’ ప్రధాన పాఠంలో దానిని నిలపడం మూలానికి పారదర్శకతను కాపాడి, అది వ్యక్తి గౌరవమా, సర్వస్వమా, వ్యక్తీకరణాంగమా అనే కవితాత్మక ఉద్రిక్తతను ముందుగానే పరిష్కరించదు. ‘నాలుక’ అనే అవగాహన ప్రాచీన అనువాద సంప్రదాయంలో కనిపిస్తుంది; దానిని ప్రత్యామ్నాయంగా మాత్రమే సూచించాం.
- issue: בְּשָׂרִי అనువాదం
  choice: నా శరీరం
  alternative: నా మాంసం
  rationale: ఈ సందర్భంలో పదం భౌతిక దేహాన్ని సూచిస్తుంది. తెలుగులో ‘నా మాంసం’ అనడం శరీరంలోని మాంసభాగాన్ని మాత్రమే సూచించినట్లు వినిపించే అవకాశం ఉన్నందున ‘నా శరీరం’ సహజమైన సమానార్థకం; దీనిలో ‘పాప స్వభావం’ వంటి తరువాతి సిద్ధాంతార్థాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కవితా శైలిని ఉపయోగించాం. మూడు సమాంతర పాదాలు హీబ్రూ కవిత్వంలోని అంతరంగ ఆనందం నుంచి వ్యక్తీకరణకు, అక్కడి నుంచి శరీర భద్రతకు జరిగే విస్తరణను ప్రతిబింబిస్తాయి.
