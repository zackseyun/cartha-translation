  yaml_path: translation/ot/psalms/016/006.yaml
  text: The boundary lines have fallen for me in pleasant places[a]; indeed[b], my inheritance is beautiful to me.
translation:
  language: te
  text: సరిహద్దు రేఖలు నాకు ఆహ్లాదకరమైన ప్రదేశాల్లో పడ్డాయి[a]; అవును, నా వారసత్వ భాగం నాకు మనోహరంగా ఉంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొలత తాళ్లు నాకు ఆహ్లాదకరమైన ప్రదేశాల్లో పడ్డాయి.” హీబ్రూ చిత్రం కేటాయించబడిన వారసత్వ భాగాన్ని కొలిచి హద్దులు నిర్ణయించే తాళ్లు లేదా రేఖలకు సంబంధించినది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నా వారసత్వం నాకు ఆహ్లాదకరంగా ఉంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבָלִים
  choice: కొలత తాళ్లు
  rationale: భూమిని కొలిచి స్వాస్థ్యభాగాన్ని హద్దులు వేయడానికి ఉపయోగించే తాళ్లను సూచించే మూలభాషా చిత్రాన్ని నిలుపుతుంది; సందర్భంలో అవి కేటాయించబడిన భాగపు సరిహద్దులను సూచిస్తాయి.
- source_word: נָפְלוּ
  choice: పడ్డాయి
  rationale: హీబ్రూ క్రియ యొక్క అక్షరార్థ చిత్రాన్ని నిలుపుతూ, స్వాస్థ్యభాగం కేటాయింపును సందర్భం ద్వారా గ్రహింపజేస్తుంది.
- source_word: לִי
  choice: నాకు
  rationale: వక్తకు అనుకూలంగా జరిగిన కేటాయింపును సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בַּנְּעִמִים
  choice: ఆహ్లాదకరమైన స్థలాల్లో
  rationale: భూకేటాయింపు సందర్భంలోని స్థానార్థాన్ని, అలాగే ఆ ప్రదేశాల మనోహరత్వాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אַף
  choice: నిజంగా
  rationale: మొదటి వాక్యాన్ని బలపరచి ధృవీకరించే అవ్యయార్థాన్ని అందిస్తుంది; కేవలం అదనపు భావమైన ‘కూడా’గా పరిమితం చేయదు.
- source_word: נַחֲלָת
  choice: నా స్వాస్థ్యం
  rationale: కేటాయించబడిన వారసత్వపు భాగం అనే స్పష్టమైన భూసంబంధ, నిబంధనాత్మక నేపథ్యాన్ని నిలుపుతుంది.
- source_word: שָׁפְרָה
  choice: సుందరంగా ఉంది
  rationale: క్రియలోని అందం, మేలిమి, ఆహ్లాదం అనే మూల్యాంకన భావాన్ని సహజమైన తెలుగు విధేయ వాక్యంగా అందిస్తుంది.
- source_word: עָלַי
  choice: నాకు
  rationale: అక్షరార్థంగా ‘నాపై’ అయినా, ఈ ప్రయోగంలో వక్త దృష్టిలో లేదా వక్తకు సంబంధించి అనే భావం ఉంది; ‘నాకు’ తెలుగులో సహజం.
theological_decisions:
- issue: కీర్తనకర్తకు దేవుడు ఇచ్చిన భాగానికి రూపకంగా భూకేటాయింపు చిత్రం
  choice: కొలత తాళ్లు, స్థలాలు, స్వాస్థ్యం అనే స్పష్టమైన భూకేటాయింపు చిత్రాన్ని నిలుపడం
  alternative: నాకు కేటాయించబడిన ఆశీర్వాదాలు ఆహ్లాదకరమైనవి; నా భాగం మధురమైనది
  rationale: సమీప సందర్భంలో యెహోవాయే కీర్తనకర్త భాగం అనే భావంతో ఈ భూస్వాస్థ్య భాష ముడిపడి ఉంది. దానిని సాధారణ ‘ఆశీర్వాదాలు’గా మార్చకుండా ఉంచడం మూలంలోని నిబంధనాత్మక భావసంపదను, రూపకంలోని ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘కొలత తాళ్లు’ మూలంలోని స్పష్టమైన చిత్రాన్ని నిలుపుతుంది; ‘స్వాస్థ్యం’ భూకేటాయింపు మరియు వారసత్వ భావాలను సముచితంగా మోస్తుంది.
