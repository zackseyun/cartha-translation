source:
  edition: WLC
  text: תּֽוֹדִיעֵ/נִי֮ אֹ֤רַח חַ֫יִּ֥ים שֹׂ֣בַע שְׂ֭מָחוֹת אֶת פָּנֶ֑י/ךָ נְעִמ֖וֹת בִּ/ימִינְ/ךָ֣ נֶֽצַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/011.yaml
  text: You make known to me the path of life[a]; in your presence is fullness of joy[b]; at your right hand are pleasures forever.
translation:
  language: te
  text: జీవమార్గాన్ని నీవు నాకు తెలియజేస్తావు; నీ సన్నిధిలో సంపూర్ణ ఆనందం ఉంది; నీ కుడిచేతి వైపున ఎల్లకాలమూ సుఖాలు ఉన్నాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹדִיעֵנִי
  choice: నీవు నాకు తెలియజేస్తావు
  rationale: ידע హిఫీల్ రూపంలోని ‘తెలియజేయు’ అనే కారణార్థాన్ని నిలుపుతుంది. కవితాత్మక నమ్మకాన్ని వ్యక్తం చేసే అసంపూర్ణ క్రియను వర్తమానార్థ ఛాయతో సహజమైన తెలుగులో అందించింది; భవిష్యత్ భావం కూడా సందర్భంలో పూర్తిగా తప్పిపోదు.
- source_word: אֹרַח חַיִּים
  choice: జీవమార్గం
  rationale: אֹרַח అంటే మార్గం; חַיִּים రూపపరంగా బహువచనమైనా ఇక్కడ ‘జీవం/జీవితం’ అనే భావనామంగా ఉంది. తెలుగు బైబిలీయ కవిత్వంలో ‘జీవమార్గం’ సహజంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: שֹׂבַע שְׂמָחוֹת
  choice: సంపూర్ణ ఆనందం
  rationale: שֹׂבַע యొక్క నిండుదనం, సమృద్ధి భావాన్ని ‘సంపూర్ణ’ తెలియజేస్తుంది. שְׂמָחוֹת బహువచనమైనప్పటికీ తెలుగులో భావనామక ఏకవచనమైన ‘ఆనందం’ మరింత సహజం; సమృద్ధి భావం ‘సంపూర్ణ’లో నిలుస్తుంది.
- source_word: אֶת־פָּנֶיךָ
  choice: నీ సన్నిధిలో
  rationale: అక్షరార్థంగా ‘నీ ముఖం ఎదుట/తో’ అయిన ఈ హెబ్రీయ ప్రయోగం సమీప సాన్నిధ్యాన్ని సూచిస్తుంది. ‘నీ సన్నిధిలో’ ఆధునిక తెలుగులో సహజంగా అదే భావాన్ని అందిస్తుంది.
- source_word: נְעִמוֹת
  choice: సుఖాలు
  rationale: నయమైనవి, ఆహ్లాదకరమైనవి, సంతోషానుభవాలు అనే బహువచన భావాన్ని ‘సుఖాలు’ సంక్షిప్తంగా అందిస్తుంది.
- source_word: בִּימִינְךָ
  choice: నీ కుడిచేతి వైపున
  rationale: స్థానార్థకమైన ‘నీ కుడిచేతి దగ్గర/వైపున’ అనే చిత్రాన్ని స్పష్టంగా నిలుపుతుంది; ‘చేతిలో’ అని అనువదించి స్వాధీనార్థాన్ని అనవసరంగా నిర్ణయించదు.
- source_word: נֶצַח
  choice: నిత్యమైన
  rationale: అంతం లేని కొనసాగింపును తెలుపుతుంది. తెలుగులో నామవాచకంతో ‘నిత్యమైన సుఖాలు’ అనే నిర్మాణం సహజంగా ఉంటుంది.
theological_decisions:
- issue: אֶת־פָּנֶיךָను అక్షరార్థంగా ‘నీ ముఖం ఎదుట’ అని ఇవ్వాలా, భావార్థంగా ‘నీ సన్నిధిలో’ అని ఇవ్వాలా
  choice: నీ సన్నిధిలో
  alternative: నీ ముఖం ఎదుట
  rationale: ‘ముఖం’ అనే మూలచిత్రం దేవుని ప్రత్యక్ష సాన్నిధ్యాన్ని సూచించే హెబ్రీయ నుడికారం. తెలుగులో ‘నీ ముఖం ఎదుట’ అసహజంగా లేదా కేవలం శారీరక స్థానంగా వినిపించవచ్చు; ‘నీ సన్నిధిలో’ అర్థాన్ని సహజంగా ఇస్తుంది, అదనపు సిద్ధాంత భావాన్ని చేర్చదు.
- issue: שְׂמָחוֹתలోని వ్యాకరణ బహువచనాన్ని తెలుగులో నిలుపాలా
  choice: సంపూర్ణ ఆనందం
  alternative: ఆనందాల సమృద్ధి
  rationale: ‘ఆనందాల సమృద్ధి’ మూలరూపానికి దగ్గరగా ఉన్నా ఆధునిక తెలుగులో భారంగా ఉంటుంది. ‘సంపూర్ణ ఆనందం’ సమృద్ధి మరియు నిండుదనాన్ని నిలుపుతూ సహజంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు స్పష్టమైన కవితాత్మక శైలి. హెబ్రీయ సమాంతర నిర్మాణాన్ని మూడు సమతుల్య భాగాలుగా నిలిపి, అసహజమైన పదానువాదాన్ని నివారించాం.
