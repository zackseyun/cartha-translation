    issue: నֶצַחను ‘నిత్యమైన’గా విశేషణ రూపంలో ఇవ్వడం
    rationale: మూలంలో נֶצַח చివరి పాదాన్ని కాలపరంగా విశదపరుస్తుంది (‘ఎల్లకాలమూ/ఎప్పటికీ’). ‘నిత్యమైన సుఖాలు’ సాధ్యమైన అనువాదమే అయినా, ‘ఎల్లకాలమూ సుఖాలు ఉన్నాయి’ మూల వాక్యనిర్మాణం మరియు కొనసాగింపు భావాన్ని మరింత నేరుగా ప్రతిబింబిస్తుంది.
