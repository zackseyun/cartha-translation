  to: జీవమార్గాన్ని నీవు నాకు తెలియజేస్తావు; నీ సన్నిధిలో సంపూర్ణ ఆనందం ఉంది; నీ కుడిచేతి వైపున ఎల్లకాలమూ సుఖాలు ఉన్నాయి.
