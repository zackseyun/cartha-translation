- from: వేరొక దేవుని వెంట పరుగెత్తేవారి దుఃఖాలు పెరుగుతాయి[a]; వారి రక్తపు పానార్పణలను నేను పోయను[b], వారి పేర్లను నా పెదవుల మీదికి తీసుకోను.
  to: వేరొక దేవుని వెంట పరుగెత్తేవారి దుఃఖాలు పెరుగుతాయి[a]; వారి రక్తపు పానార్పణలను నేను పోసి అర్పించను[b], నా పెదవులపై వారి పేర్లను ఎత్తను.
