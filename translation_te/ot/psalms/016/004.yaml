id: PSA.16.4
reference: Psalms 16:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יִרְבּ֥וּ עַצְּבוֹתָ/ם֮ אַחֵ֪ר מָ֫הָ֥רוּ בַּל אַסִּ֣יךְ נִסְכֵּי/הֶ֣ם מִ/דָּ֑ם וּֽ/בַל אֶשָּׂ֥א אֶת שְׁ֝מוֹתָ֗/ם עַל שְׂפָתָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/004.yaml
  text: The sorrows of those who hurry after another god will multiply[a]; I will not pour out their drink offerings of blood[b], nor will I lift up their names on my lips.
translation:
  language: te
  text: వేరొక దేవుని వెంట పరుగెత్తేవారి దుఃఖాలు పెరుగుతాయి[a]; వారి రక్తపు పానార్పణలను నేను పోసి అర్పించను[b], నా పెదవులపై వారి పేర్లను ఎత్తను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వేరొక దేవుని వెంట పరుగెత్తేవారి విగ్రహాలు పెరుగుతాయి.” హీబ్రూ పదానికి కొన్ని సందర్భాల్లో విగ్రహాలతో సంబంధం ఉండవచ్చు; అయితే ఇక్కడ “దుఃఖాలు” అనే అర్థం పాద భావానికి మరింత సహజంగా సరిపోతుంది.
    reason: alternative_reading
  - marker: b
    text: “రక్తపు” అనే మాటకు బదులుగా “రక్తంతో” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְבּוּ
  choice: పెరుగుతాయి
  rationale: רבה అనే క్రియ యొక్క భావం పెరగడం లేదా విస్తరించడం. ఇక్కడ విగ్రహారాధనను అనుసరించేవారికి కలిగే పరిణామాన్ని తెలిపే కవితాత్మక వాక్యంగా వర్తమాన-భవిష్యత్ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַצְּבוֹתָם
  choice: వారి దుఃఖాలు
  rationale: ఈ పదం బాధలు లేదా దుఃఖాలను సూచించగలదు. తరువాతి పాదాల్లో ఇతర దేవతల ఆరాధన ప్రస్తావన ఉన్నందున, ఇక్కడ ఆరాధకులకు కలిగే దుఃఖాలనే ప్రధాన భావంగా తీసుకున్నాం; ‘విగ్రహాలు’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: אַחֵר
  choice: వేరొక దేవుని
  rationale: హీబ్రూలో అక్షరార్థంగా ‘వేరొకని/వేరొకదాన్ని’ అని ఉన్నా, పానార్పణలు మరియు పేర్ల ప్రస్తావన వల్ల ఉద్దేశించినది వేరొక దేవుడని సందర్భం స్పష్టం చేస్తుంది. తెలుగులో భావం అస్పష్టంగా కాకుండా ఉండేందుకు ‘దేవుని’ని పూరించాం.
- source_word: מָהָרוּ
  choice: వెంట పరుగెత్తేవారి
  rationale: מהר సాధారణంగా త్వరపడడం లేదా వేగంగా వెళ్లడం అనే భావాన్ని ఇస్తుంది. ‘వెంట పరుగెత్తడం’ ఇతర దేవుని ఆసక్తిగా అనుసరించే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בַּל אַסִּיךְ
  choice: నేను పోయను
  rationale: బలి సంబంధ సందర్భంలో נסך పానార్పణను పోయడాన్ని సూచిస్తుంది. సాధారణ ‘అర్పించను’ కంటే ‘పోయను’ మూలంలోని క్రియాచిత్రాన్ని నిలుపుతుంది; בַּל నిరాకరణను వ్యక్తం చేస్తుంది.
- source_word: נִסְכֵּיהֶם
  choice: వారి ... పానార్పణలను
  rationale: ఇది ద్రవాన్ని పోసి అర్పించే ఆచారపరమైన అర్పణను సూచించే పదం. ‘పానార్పణలు’ సంక్షిప్తంగా, గౌరవప్రదంగా, ఆచార భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִדָּם
  choice: రక్తపు
  rationale: מן ఇక్కడ పదార్థం లేదా మూలాన్ని సూచించవచ్చు. ‘రక్తపు పానార్పణలు’ మూలంలోని దిగ్భ్రాంతికరమైన బలి చిత్రాన్ని కాపాడుతుంది; ‘రక్తంతో’ అనే సాధ్యమైన సంబంధాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: אֶשָּׂא אֶת שְׁמוֹתָם עַל שְׂפָתָי
  choice: వారి పేర్లను నా పెదవుల మీదికి తీసుకోను
  rationale: నשא (‘ఎత్తడం/తీసుకోవడం’) మరియు ‘పెదవుల మీద’ అనే మూల చిత్రాన్ని తెలుగులో సహజమైన నుడికారంతో నిలిపి, వారి పేర్లను పలకననే భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ‘వేరొక’ అనే పదం తరువాత అంతర్లీనంగా ఉన్న నామవాచకం
  choice: వేరొక దేవుని
  alternative: వేరొకని
  rationale: పానార్పణలు, పేర్లు, వాటిలో పాల్గొనడానికి నిరాకరణ అనే సందర్భం విగ్రహారాధనను సూచిస్తుంది. ‘దేవుని’ అని పూరించడం కొత్త సిద్ధాంతాన్ని చేర్చకుండా అంతర్లీన సూచనను స్పష్టం చేస్తుంది.
- issue: עַצְּבוֹתָם పదార్థం
  choice: దుఃఖాలు
  alternative: విగ్రహాలు
  rationale: ఈ వాక్య నిర్మాణంలో ఇతర దేవుని అనుసరించేవారికి దుఃఖాలు పెరుగుతాయనే పరిణామ భావం సహజంగా సరిపోతుంది. అయితే ఈ రూపం కొన్ని సందర్భాల్లో విగ్రహ సంబంధ పదంతో అనుసంధానించబడగలదు కాబట్టి ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- issue: ‘వారి పేర్లు’ ఎవరిని సూచిస్తాయి?
  choice: తెలుగు సర్వనామంలో మూలంలోని అస్పష్టతను నిలిపాం
  alternative: ఇతర దేవతల పేర్లు అని స్పష్టీకరించడం
  rationale: సందర్భం ఇతర దేవతల పేర్ల వైపు బలంగా సూచించినా, వ్యాకరణపరంగా ‘వారి’ అనేది ఆరాధకులను కూడా సూచించగలదు. అందువల్ల మూలంలోని నిజమైన అస్పష్టతను అనువాదంలో పరిష్కరించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా వాక్యనిర్మాణం వాడాం. ‘పానార్పణలు’ అనే ఆచారపరమైన పదాన్ని ఉంచి, దానికి సంబంధించిన ‘పోయడం’ అనే స్పష్టమైన చిత్రాన్ని కాపాడాం. ‘పెదవుల మీదికి తీసుకోవడం’ అనే నుడికారం మూలంలోని రూపకాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది.
