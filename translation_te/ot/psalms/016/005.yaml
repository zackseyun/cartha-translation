  text: Yahweh is the portion of my inheritance and my cup[a]; you uphold my lot.
translation:
  language: te
  text: 'యెహోవా నా స్వాస్థ్యపు భాగం, నా పాత్ర[a];

    నీవే నా వంతును స్థిరంగా ఉంచుతావు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా నా భాగం, నా పాత్ర.” హీబ్రూలో “భాగం,” “స్వాస్థ్యభాగం,” “వంతు” అనే కేటాయింపు చిత్రాలు ఒకదాని వెంట మరొకటి వస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణగా నిలుపుతుంది.
- source_word: מְנָת חֶלְקִי
  choice: నా స్వాస్థ్యపు భాగం
  rationale: మְנָת అనే నిర్మాణరూపం మరియు חֶלְקִי కలిసి సూచించే కేటాయించబడిన స్వాస్థ్యభాగ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְכוֹסִי
  choice: నా పాత్ర
  rationale: ఒకరికి కేటాయించబడిన అనుభవం లేదా గతిని సూచించే కవితాత్మక పాత్ర రూపకాన్ని వ్యాఖ్యానించి తొలగించకుండా యథాతథంగా ఉంచుతుంది.
- source_word: אַתָּה
  choice: నీవే
  rationale: హీబ్రూలోని స్పష్టమైన సర్వనామం ఇచ్చే ఉద్ఘాటనను తెలుగులో ‘ఏ’ ద్వారా తెలియజేస్తుంది.
- source_word: תּוֹמִיךְ
  choice: స్థిరంగా ఉంచుతావు
  rationale: క్రియలోని ఆదరించడం, నిలబెట్టడం, భద్రపరచడం అనే భావాలను ఈ సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: גּוֹרָלִי
  choice: నా వంతు
  rationale: చీటి ద్వారా కేటాయించబడిన భాగం అనే భావాన్ని తెలుగులో అర్థమయ్యేలా చెబుతూ, ముందున్న స్వాస్థ్య-కేటాయింపు చిత్రణను కొనసాగిస్తుంది.
theological_decisions:
- issue: యెహోవాయే కీర్తనకర్తకు కేటాయించబడిన స్వాస్థ్యమనే రూపకం
  choice: ‘నా స్వాస్థ్యపు భాగం ... నా వంతు’ అని పరస్పరం ముడిపడిన కేటాయింపు పదాలను వేర్వేరుగా నిలిపాం.
  alternative: ‘నా భాగం, నా పాత్ర’ అని సంక్షిప్తంగా అనువదించడం.
  rationale: హీబ్రూ వచనం భాగం, స్వాస్థ్యం, పాత్ర, వంతు అనే సమీప రూపకాలను ఉద్దేశపూర్వకంగా ఒకదానిపై మరొకటి కూర్చుతుంది. వాటిని ఒకే పదంలో కలపకుండా ఉంచడం ద్వారా యెహోవాయే కీర్తనకర్త స్వాస్థ్యమన్న భావంతో పాటు దానిని ఆయనే స్థిరపరుస్తాడన్న ఉద్వేగం నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలిని ఉపయోగించాం. ‘స్వాస్థ్యం,’ ‘పాత్ర,’ ‘వంతు’ ద్వారా మూలంలోని పునరావృత కేటాయింపు చిత్రణను సాధ్యమైనంత స్పష్టంగా నిలిపాం.
