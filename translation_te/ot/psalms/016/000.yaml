translation:
  language: te
  text: 'దావీదు మిక్తాము.[a]

    దేవా, నన్ను కాపాడు; ఎందుకంటే నేను నీలో ఆశ్రయం పొందాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘మిక్తాము’; ఇది అర్థం స్పష్టంగా తెలియని కీర్తన శీర్షిక. ఇది ఒక రచన రకాన్ని సూచించవచ్చు. కొందరు దీనిని ‘కీర్తన’ లేదా ‘బంగారు గీతం’ అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְתָּם
  choice: మిక్తాం
  rationale: ఈ కీర్తన శీర్షికలోని పదానికి అర్థం అనిశ్చితం కాబట్టి, ఊహాత్మక అర్థాన్ని ప్రధాన పాఠ్యంలో పెట్టకుండా లిప్యంతరీకరించాం.
- source_word: שָׁמְרֵנִי
  choice: నన్ను కాపాడు
  rationale: దైవ సంరక్షణ కోసం చేసే ప్రత్యక్ష విజ్ఞప్తిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חָסִיתִי בָךְ
  choice: నేను నీలో ఆశ్రయం పొందాను
  rationale: בְּ ఉపసర్గతో కూడిన חסה క్రియలోని ఆశ్రయ భావాన్ని, దేవుడే ఆశ్రయస్థానం అనే రూపకాన్ని నిలుపుతూ అనువదించాం.
theological_decisions:
- issue: חָסִיתִי క్రియ యొక్క కాలం/భావం
  choice: ఆశ్రయం పొందాను
  alternative: ఆశ్రయం పొందుతున్నాను / నిన్ను ఆశ్రయించాను
  rationale: హీబ్రూ పరిపూర్ణ క్రియను గత లేదా స్థిర నమ్మక ప్రకటనగా గ్రహించవచ్చు. తెలుగు పరిపూర్ణ రూపం మూల రూపాన్ని దగ్గరగా నిలుపుతుంది; దానిని కేవలం వర్తమాన అలవాటుగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన ప్రార్థనా శైలిని వాడాం. అనిశ్చిత శీర్షికను లిప్యంతరీకరించి, దాని వివరణను పాదసూచికలో ఇచ్చాం.
