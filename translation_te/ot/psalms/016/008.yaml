id: PSA.16.8
reference: Psalms 16:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שִׁוִּ֬יתִי יְהוָ֣ה לְ/נֶגְדִּ֣/י תָמִ֑יד כִּ֥י מִֽ֝/ימִינִ֗/י בַּל אֶמּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/008.yaml
  text: I have set Yahweh before me continually[a]; because he is at my right hand[b], I will not be shaken.
translation:
  language: te
  text: నేను యాహ్వేను[a] ఎల్లప్పుడూ నా ఎదుట ఉంచుకున్నాను; ఆయన నా కుడివైపున ఉన్నాడు కాబట్టి నేను కదలిపోను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో YHWH అనే దైవనామం; సాంప్రదాయికంగా “యెహోవా” అని కూడా వాడుతారు.
    reason: alternative_reading
  - marker: b
    text: “కదలిపోను” అనే హీబ్రూ మాటకు “తొట్రుపడను” లేదా “నా స్థిరస్థానం నుంచి కదిలించబడను” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁוִּיתִי
  choice: ఉంచుకున్నాను
  rationale: పీయేల్ రూపంలోని క్రియ ఉద్దేశపూర్వకంగా ఎదుట ఉంచడాన్ని సూచిస్తుంది; తెలుగు పూర్తిక్రియ కొనసాగుతున్న స్థిర నిర్ణయాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో వ్యక్తిగత నామంగా ఇచ్చాం.
- source_word: לְנֶגְדִּי
  choice: నా ఎదుట
  rationale: వ్యక్తి దృష్టి లేదా సన్నిధిలో ఉండే స్థలసంబంధ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: תָמִיד
  choice: ఎల్లప్పుడూ
  rationale: నిరంతరమైన లేదా స్థిరమైన కొనసాగింపును సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: కాబట్టి
  rationale: యెహోవా కుడివైపున ఉండటం వల్ల కలిగే స్థిరత్వాన్ని కారణ-ఫల సంబంధంగా సహజంగా కలుపుతుంది.
- source_word: מִימִינִי
  choice: నా కుడివైపున
  rationale: మూలంలోని స్థలచిత్రాన్ని కాపాడుతుంది; రక్షణ లేదా తోడ్పాటు భావాన్ని పాఠకుడు గ్రహించగలిగేలా దాన్ని వివరణగా మార్చలేదు.
- source_word: בַּל אֶמּוֹט
  choice: నేను కదలిపోను
  rationale: మוט క్రియలోని స్థిరస్థానం నుంచి కదలడం, తొట్రుపడడం లేదా కుదేలవడం అనే రూపకార్థాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఉచ్చారణ పునర్నిర్మాణంపై ఉన్న అనిశ్చితిని గమనిస్తూ, ఆధునిక తెలుగు క్రైస్తవ వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ప్రధాన పాఠంలో ఉంచాం.
- issue: కుడివైపు అనే చిత్రార్థం
  choice: నా కుడివైపున
  alternative: నాకు అండగా
  rationale: రక్షణ, సమీప సహాయం అనే భావాన్ని వివరణాత్మకంగా నిర్ణయించకుండా మూలంలోని స్థలరూపకాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కీర్తనా శైలిని కాపాడుతూ సాధారణ పాఠకులకు సహజంగా ఉండే పదాలను వాడాం. హీబ్రూ వాక్యక్రమంలోని ఉద్దేశపూర్వక స్థాపన, కుడివైపు సన్నిధి, స్థిరత్వం అనే చిత్రాలను నిలిపాం.
