id: PSA.44.8
reference: Psalms 44:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בֵּֽ֭/אלֹהִים הִלַּלְ֣נוּ כָל הַ/יּ֑וֹם וְ/שִׁמְ/ךָ֓ לְ/עוֹלָ֖ם נוֹדֶ֣ה סֶֽלָה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/008.yaml
  text: In God we boast all day long[a], and we will give thanks to your name forever[b]. Selah
translation:
  language: te
  text: దేవునిలో మేము రోజంతా అతిశయిస్తాము[a]; నీ నామానికి ఎప్పటికీ కృతజ్ఞతలు చెల్లిస్తాము[b]. సెలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవునిలో మేము రోజంతా స్తుతిస్తాము,’ లేదా ‘దేవునిలో మేము రోజంతా గొప్పగా చెప్పుకుంటాము.’ సందర్భాన్ని బట్టి ఈ హీబ్రూ క్రియ స్తుతించడం లేదా ఉల్లాసంగా అతిశయించడం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, ‘నీ నామానికి.’ ఇది దేవుడు బయలుపరచిన స్వభావాన్ని, ఆయన ఖ్యాతిని సూచించే బైబిలీయ విధానం.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: దేవునిలోనే
  rationale: בְּ ఉపసర్గ ఇక్కడ అతిశయానికి ఆధారం లేదా విషయాన్ని సూచిస్తుంది. ‘దేవునిలోనే’ అనే రూపం సాధనార్థం కంటే దేవుడే వారి అతిశయానికి ఆధారమనే భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: הִלַּלְנוּ
  choice: మేము అతిశయిస్తాము
  rationale: הלל పియేల్ రూపానికి ‘స్తుతించు’ అనే అర్థమున్నా, בֵּאלֹהִיםతో కూడిన ఈ నిర్మాణంలో ‘దేవునిలో అతిశయించు/గర్వించు’ అనే భావం బలంగా ఉంటుంది. ‘అతిశయిస్తాము’ అనేది పాపపూరితమైన స్వగర్వాన్ని సూచించకుండా ఆ భావాన్ని నిలుపుతుంది.
- source_word: כָל הַיּוֹם
  choice: రోజంతా
  rationale: ఈ పదబంధం దినమంతటా కొనసాగే కాలవ్యాప్తిని సూచిస్తుంది; ‘రోజంతా’ ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: וְשִׁמְךָ
  choice: నీ నామానికి
  rationale: ‘నీ నామం’ తరువాతి క్రియకు లక్ష్యంగా ఉంది. ‘నీ నామానికి’ అనే రూపం దేవుని బయలుపరచబడిన స్వభావం, ఖ్యాతిని సూచించే బైబిలీయ ప్రయోగాన్ని నిలుపుతుంది.
- source_word: לְעוֹלָם
  choice: నిత్యం
  rationale: לְעוֹלָם నిరంతర కాలాన్ని సూచిస్తుంది. ‘నిత్యం’ గౌరవప్రదమైన, సహజమైన తెలుగు పదం.
- source_word: נוֹדֶה
  choice: కృతజ్ఞతలు చెల్లిస్తాము
  rationale: ידה హిఫీల్ రూపం కృతజ్ఞతతో అంగీకరించడం లేదా స్తుతించడం అనే భావాన్ని ఇస్తుంది. మొదటి పాదంలోని అతిశయంతో భిన్నమైన కృతజ్ఞతా ఛాయను ‘కృతజ్ఞతలు చెల్లిస్తాము’ నిలుపుతుంది; అసంపూర్ణ క్రియారూపాన్ని కొనసాగుతున్న సంకల్ప ప్రకటనగా అనువదించాం.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఈ ఆరాధనా/సంగీత సూచిక యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం కనుక ఊహాత్మకంగా అనువదించకుండా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కీర్తనా శైలిని ఉపయోగించాం. హీబ్రూ సమాంతర నిర్మాణాన్ని నిలుపుతూ, ‘అతిశయిస్తాము’ మరియు ‘కృతజ్ఞతలు చెల్లిస్తాము’ మధ్యనున్న భావభేదాన్ని కాపాడాం.
