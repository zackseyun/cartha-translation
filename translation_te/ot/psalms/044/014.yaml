source:
  edition: WLC
  text: תְּשִׂימֵ֣/נוּ מָ֭שָׁל בַּ/גּוֹיִ֑ם מְנֽוֹד רֹ֝֗אשׁ בַּל אֻמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/014.yaml
  text: You make us a proverb among the nations[b][a], a shaking of the head among the peoples.
translation:
  language: te
  text: నీవు మమ్మల్ని జనముల మధ్య సామెతగా[a], ప్రజల మధ్య తల ఊపుతూ చేసే హేళనకు గురిగా[b] చేస్తున్నావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జనముల మధ్య నిందార్థక నానుడిగా.” హీబ్రూ מָשָׁל అనే పదం సామెతను లేదా ఎగతాళిగా వాడే నానుడిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ప్రజల మధ్య తల ఊపుడుగా.” తల ఊపడం ఇక్కడ ఎగతాళి లేదా తిరస్కారాన్ని తెలిపే సంజ్ఞ.
    reason: cultural_note
lexical_decisions:
- source_word: תְּשִׂימֵנוּ
  choice: నీవు మమ్మల్ని ... చేస్తున్నావు
  rationale: שׂים అనే క్రియలోని ‘ఉంచు/చేయు’ అనే ఫలితార్థాన్ని, దేవునితో నేరుగా మాట్లాడుతున్న వర్తమాన విలాప ధోరణిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מָשָׁל
  choice: సామెతగా
  rationale: ఈ పదం సామెతను లేదా నిందార్థక నానుడిని సూచించగలదు. ప్రధాన పాఠంలో నేరమైన సమానార్థక పదాన్ని ఉంచి, అవమాన భావాన్ని సందర్భం మరియు పాదసమాంతరత తెలియజేస్తాయి.
- source_word: בַּגּוֹיִם
  choice: జనాల మధ్య
  rationale: ఇక్కడ గోయిమ్ సాధారణంగా ఇతర జనాలను సూచిస్తుంది; తరువాతి ‘ప్రజల మధ్య’తో కవితాత్మక సమాంతరతను నిలుపుతుంది.
- source_word: מְנוֹד רֹאשׁ
  choice: తల ఊపే ఎగతాళికి గురిగా
  rationale: అక్షరార్థమైన తల ఊపడం అనే దృశ్యాన్ని ఉంచుతూ, అది అపహాస్యం లేదా తిరస్కారాన్ని సూచించే సంజ్ఞ అని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: בַּל אֻמִּים
  choice: ప్రజల మధ్య
  rationale: మొదటి పాదంలోని ‘జనాల మధ్య’కు సమాంతరంగా ఉండే భావాన్ని, అనవసర పదపునరుక్తి లేకుండా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, విలాప కవిత్వానికి తగిన గంభీరతతో అనువదించబడింది. ‘సామెత’ అనే మూలరూపకాన్ని నిలుపుతూ, రెండో పాదంలో తల ఊపడం ఎగతాళి సంజ్ఞ అని పాఠకునికి సహజంగా అర్థమయ్యేలా చెప్పబడింది.
