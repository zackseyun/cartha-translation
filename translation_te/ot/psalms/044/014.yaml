review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly reflects the direct address to God, the causative sense of תְּשִׂימֵנוּ, and the two parallel images: becoming a מָשָׁל among the nations and an object of derisive head-shaking among peoples. However, ‘జనాల’ is relatively colloquial for this poetic lament, and the second expression can be made more idiomatic while retaining the concrete head-shaking image.'
  naturalness: ‘తల ఊపే ఎగతాళికి గురిగా’ is understandable but slightly compressed and awkward in modern standard Telugu. ‘తల ఊపుతూ చేసే హేళనకు గురిగా’ reads naturally and clearly identifies the gesture as derision. ‘జనముల మధ్య’ better suits the elevated poetic register than ‘జనాల మధ్య.’
  terminology: ‘సామెతగా’ is a sound direct rendering of מָשָׁל; the note appropriately supplies the scornful/byword sense. ‘హేళన’ naturally conveys mockery or contempt without adding a doctrinal interpretation. ‘జనములు’ and ‘ప్రజలు’ preserve the Hebrew poetic variation between גּוֹיִם and אֻמִּים.
  issues:
  - severity: low
    issue: Register of ‘జనాల మధ్య’
    rationale: ‘జనాల’ is common conversational Telugu. ‘జనముల మధ్య’ better maintains the solemn, poetic register of the psalm while retaining the meaning ‘among the nations.’
  - severity: low
    issue: Idiomatic expression for מְנוֹד רֹאשׁ
    rationale: The draft’s ‘తల ఊపే ఎగతాళికి గురిగా’ is intelligible, but ‘తల ఊపుతూ చేసే హేళనకు గురిగా’ is smoother modern Telugu and preserves the derisive head-shaking image.
  revised_text: నీవు మమ్మల్ని జనముల మధ్య సామెతగా[a], ప్రజల మధ్య తల ఊపుతూ చేసే హేళనకు గురిగా[b] చేస్తున్నావు.
