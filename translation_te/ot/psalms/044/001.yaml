id: PSA.44.1
reference: Psalms 44:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֱלֹהִ֤ים בְּ/אָזְנֵ֬י/נוּ שָׁמַ֗עְנוּ אֲבוֹתֵ֥י/נוּ סִפְּרוּ לָ֑/נוּ פֹּ֥עַל פָּעַ֥לְתָּ בִֽ֝/ימֵי/הֶ֗ם בִּ֣/ימֵי קֶֽדֶם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/001.yaml
  text: God[a], we have heard with our ears; our fathers have told us the deed you did in their days[c][b], in days of old.
translation:
  language: te
  text: దేవా, మేము మా చెవులతో విన్నాము; మా తండ్రులు మాకు చెప్పారు—వారి రోజుల్లో, పూర్వకాలంలో, నీవు చేసిన కార్యాన్ని.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మా తండ్రులు’ అని ఉన్న హీబ్రూ మాటను ‘మా పూర్వీకులు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: వాక్యారంభంలో ఇది ప్రత్యక్ష సంబోధన. తెలుగు విభక్తి రూపమైన ‘దేవా’ అదనపు సంబోధన పదం లేకుండానే దీనిని సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בְּאָזְנֵינוּ שָׁמַעְנוּ
  choice: మేము మా చెవులతో విన్నాము
  rationale: హీబ్రూ శరీరాధారిత నుడికారంలోని బలాన్ని నిలుపుతూ, తెలుగులో సహజంగా వినిపించే ప్రత్యక్ష అనువాదం.
- source_word: אֲבוֹתֵינוּ
  choice: మా తండ్రులు
  rationale: మూలంలోని పుంలింగ కుటుంబపదాన్ని యథాతథంగా నిలుపుతుంది; సందర్భంలో ఇది పూర్వీకులను సూచించవచ్చు.
- source_word: סִפְּרוּ לָנוּ
  choice: మాకు చెప్పారు
  rationale: తరతరాలుగా కథనం ద్వారా అందిన సాక్ష్యాన్ని సరళమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: פֹּעַל פָּעַלְתָּ
  choice: నీవు చేసిన కార్యాన్ని
  rationale: నామవాచకం–క్రియ మధ్యనున్న హీబ్రూ పదసంబంధాన్ని కొంతవరకు నిలుపుతూ, దేవుని చారిత్రక చర్యను గంభీరంగా, సహజంగా తెలుపుతుంది.
- source_word: בִּימֵיהֶם
  choice: వారి రోజుల్లో
  rationale: తండ్రులు జీవించిన కాలాన్ని సూచించే మూలంలోని కాలప్రయోగాన్ని నేరుగా నిలుపుతుంది.
- source_word: בִּימֵי קֶדֶם
  choice: పూర్వకాలంలో
  rationale: సుదూర గతాన్ని సూచించే కవితాత్మక భావాన్ని ఆధునిక తెలుగులో సంక్షిప్తంగా అందిస్తుంది.
theological_decisions:
- issue: వాక్యారంభంలోని దేవుని ప్రత్యక్ష సంబోధన
  choice: దేవా
  alternative: ఓ దేవా
  rationale: హీబ్రూలో ప్రత్యేక సంబోధన అవ్యయం లేదు. తెలుగు సంబోధన విభక్తి ఒక్కటే భావాన్ని స్పష్టంగా అందిస్తుంది; ‘ఓ’ చేర్చడం సాధ్యమే గాని అవసరం లేదు.
- issue: אֲבוֹתֵינוּ యొక్క పరిధి
  choice: మా తండ్రులు
  alternative: మా పూర్వీకులు
  rationale: ‘తండ్రులు’ మూలపద రూపాన్ని నిలుపుతుంది; అయితే సందర్భానుసారం అది మునుపటి తరాల పూర్వీకులను విస్తృతంగా సూచించవచ్చనే అవకాశాన్ని పాదటిప్పణి సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. కాలపదబంధాల రెండింటినీ నిలిపి, మూలంలోని పునరుద్ఘాటనను సంరక్షించాం.
