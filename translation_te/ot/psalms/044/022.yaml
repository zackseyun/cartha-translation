revisions:
- from: ఎందుకంటే, నీ నిమిత్తమే మేము రోజంతా చంపబడుతున్నాం[a]; వధకు సిద్ధంగా ఉన్న గొర్రెలుగా మేము ఎంచబడుతున్నాం[b].
  to: ఎందుకంటే నీ నిమిత్తమే మేము రోజంతా చంపబడుతున్నాం[a]; వధకు గొర్రెలుగా మేము పరిగణించబడుతున్నాం[b].
  rationale: The revision corrects the mistranslation of ‘we are regarded/reckoned’ and removes the added ‘prepared’ nuance, while retaining the draft’s faithful treatment of the opening causal clause, the ambiguity of ‘for your sake,’ and the ongoing lament sense.
  reviewer_model: gpt-5.6-terra
