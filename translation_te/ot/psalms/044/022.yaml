source:
  edition: WLC
  text: כִּֽי עָ֭לֶי/ךָ הֹרַ֣גְנוּ כָל הַ/יּ֑וֹם נֶ֝חְשַׁ֗בְנוּ כְּ/צֹ֣אן טִבְחָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/022.yaml
  text: For your sake we are killed all day long[b][a]; we are regarded as sheep for slaughter.
translation:
  language: te
  text: ఎందుకంటే నీ నిమిత్తమే మేము రోజంతా చంపబడుతున్నాం[a]; వధకు గొర్రెలుగా మేము పరిగణించబడుతున్నాం[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ కారణంగా’ లేదా ‘నీ విషయమై.’ హీబ్రూ పదబంధం దేవునితో ఉన్న సంబంధంలో లేదా ఆయన నిమిత్తం అనుభవించే బాధను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వధకు గొర్రెలుగా మేము లెక్కించబడుతున్నాం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ఫిర్యాదుకు కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: עָלֶיךָ
  choice: నీ నిమిత్తమే
  rationale: దేవునితో తమ సంబంధం లేదా ఆయనపట్ల నిబద్ధత కారణంగా బాధను అనుభవిస్తున్న భావాన్ని నిలుపుతుంది; దేవుడే నేరుగా హతం చేస్తున్నాడని నిర్దేశించదు.
- source_word: הֹרַגְנוּ
  choice: మేము ... చంపబడుతున్నాం
  rationale: రూపపరంగా సంపూర్ణ క్రియ అయినా, కవితాత్మక విలాపంలో రోజంతా కొనసాగుతున్న లేదా పదేపదే సంభవిస్తున్న బాధను వర్తమాన కర్మణి రూపం సహజంగా తెలియజేస్తుంది.
- source_word: כָל הַיּוֹם
  choice: రోజంతా
  rationale: నిరంతర వ్యవధిని తెలిపే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: נֶחְשַׁבְנוּ
  choice: మేము ఎంచబడుతున్నాం
  rationale: ఇక్కడి కర్మణి మూల్యాంకన భావాన్ని తెలియజేస్తుంది; వధకు ఉద్దేశించిన గొర్రెలుగా పరిగణింపబడుతున్న స్థితిని సూచిస్తుంది.
- source_word: כְּצֹאן
  choice: గొర్రెలుగా
  rationale: ఉపమాన సూచకమైన כְ భావాన్ని తెలుగు విభక్తి సహజంగా వ్యక్తం చేస్తుంది.
- source_word: טִבְחָה
  choice: వధకు సిద్ధంగా ఉన్న
  rationale: వధ కోసం ఉంచబడిన గొర్రెల భావాన్ని గౌరవప్రదమైన, సులభంగా అర్థమయ్యే తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ఈ వాక్యం దేవుడే బాధ కలిగిస్తున్నాడని సూచిస్తుందా, లేక దేవునిపట్ల నిబద్ధత కారణంగా బాధ అనుభవిస్తున్నారని సూచిస్తుందా?
  choice: నీ నిమిత్తమే
  alternative: నీ కారణంగా; నీ విషయమై
  rationale: హీబ్రూ ఉపసర్గ కారణం లేదా సంబంధం రెండింటినీ సూచించగలదు. ప్రధాన పాఠం బాధ దేవునితో వారి సంబంధం వల్ల కలుగుతోందనే ఉద్రిక్తతను నిలుపుతూ, దేవునిపై నేరుగా నింద మోపడాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తన విలాపానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. నిరంతర బాధను తెలియజేయడానికి వర్తమాన కర్మణి రూపాన్ని ఎంచుకున్నాం; హీబ్రూ వాక్యంలోని కారణార్థక మరియు ధార్మిక ఉద్రిక్తతను పాదటిప్పణిలో నిలిపాం.
