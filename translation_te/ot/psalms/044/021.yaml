source:
  edition: WLC
  text: הֲ/לֹ֣א אֱ֭לֹהִים יַֽחֲקָר זֹ֑את כִּֽי ה֥וּא יֹ֝דֵ֗עַ תַּעֲלֻמ֥וֹת לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/021.yaml
  text: Would not God search this out? For he knows the hidden things of the heart[a].
translation:
  language: te
  text: దేవుడు దీనిని పరిశోధించకుండా ఉంటాడా? ఎందుకంటే హృదయంలో దాగిన సంగతులు ఆయనకు తెలుసు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “హృదయ రహస్యాలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: పరిశోధించకుండా ఉంటాడా?
  rationale: సానుకూల జవాబును ఆశించే హీబ్రూ అలంకార ప్రశ్నను తెలుగులో సహజంగా నిలుపుతుంది; దానిని ‘తప్పకుండా’ అనే నిశ్చయవాక్యంగా మార్చదు.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: బహువచన రూపంలో ఉన్నప్పటికీ, ఈ సందర్భంలో ఇశ్రాయేలు దేవుణ్ణి సూచించే ఏకవచన దైవపదవి; ‘దేవుడు’ సహజమైన తెలుగు సమానం.
- source_word: יַחֲקָר
  choice: పరిశోధించకుండా ఉంటాడా
  rationale: ఈ క్రియ పూర్తిగా వెదకడం లేదా లోతుగా పరిశీలించడం అనే భావాన్ని ఇస్తుంది. తెలుగు అలంకార ప్రశ్నలో ప్రతికూల నిర్మాణంతో ‘పరిశోధించకుండా ఉంటాడా?’ అని చెప్పడం మూలంలోని ప్రశ్నార్థక బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: זֹאת
  choice: దీనిని
  rationale: ముందు ప్రస్తావించిన విషయాన్ని సంక్షిప్తంగా సూచించే మూలంలోని నిర్దేశక సర్వనామాన్ని నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: మొదటి ప్రశ్నకు ఆధారమైన కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: יֹדֵעַ
  choice: తెలుసు
  rationale: దేవుని నిరంతరమైన, స్వభావసిద్ధమైన జ్ఞానాన్ని తెలుగు సాధారణ వర్తమాన రూపంలో తెలియజేస్తుంది.
- source_word: תַּעֲלֻמוֹת
  choice: దాగిన సంగతులు
  rationale: దాచబడినవి లేదా గుప్తమైనవి అనే పదార్థాన్ని విస్తరించకుండా నిలుపుతుంది. ‘రహస్యాలు’ కూడా సాధ్యమైనందున దానిని పాదసూచికలో ఇచ్చాం.
- source_word: לֵב
  choice: హృదయం
  rationale: ఆలోచన, సంకల్పం, భావోద్వేగం సహా అంతరంగ వ్యక్తిని సూచించే హీబ్రూ రూపకాన్ని, దాని బైబిలు ప్రతిధ్వనిని నిలుపుతుంది.
theological_decisions:
- issue: లֵב అనే మానవ అంతరంగాన్ని సూచించే పదం
  choice: హృదయం
  alternative: మనస్సు; అంతరంగం
  rationale: మూలపదం జ్ఞానం, సంకల్పం, భావాలు అన్నిటినీ కలిగి ఉంది. ‘హృదయం’ మూలంలోని రూపకాన్నీ దాని విస్తృత భావాన్నీ నిలుపుతుంది; ‘మనస్సు’ అని అనడం దాని అర్థాన్ని కేవలం ఆలోచనకు పరిమితం చేయవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే కీర్తనకు తగిన గంభీరతతో అనువదించబడింది. అలంకార ప్రశ్నను ప్రశ్నగానే ఉంచి, హృదయం అనే బైబిలు రూపకాన్ని కాపాడాం.
