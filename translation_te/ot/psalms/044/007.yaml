source:
  edition: WLC
  text: כִּ֣י ה֭וֹשַׁעְתָּ/נוּ מִ/צָּרֵ֑י/נוּ וּ/מְשַׂנְאֵ֥י/נוּ הֱבִישֽׁוֹתָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/007.yaml
  text: For you have saved us from our adversaries[a], and you have put those who hate us to shame.
translation:
  language: te
  text: ఎందుకంటే నీవు మా విరోధుల నుండి మమ్మల్ని రక్షించావు, మమ్మల్ని ద్వేషించేవారిని అవమానపరిచావు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని అతిశయానికి లేదా స్తుతికి కారణాన్ని తెలిపే వివరణాత్మక-కారణార్థక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הוֹשַׁעְתָּנוּ
  choice: మమ్మల్ని రక్షించినవాడవు
  rationale: హిఫిల్ రూపంలోని ‘రక్షించు, విడిపించు’ అనే ప్రత్యక్ష దైవిక కార్యాన్ని, పూర్తయిన చర్య భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִצָּרֵינוּ
  choice: మా విరోధుల నుండి
  rationale: צַר అనే పదంలోని శత్రుత్వపూర్వకంగా ఎదిరించేవారి విస్తృత భావాన్ని ‘విరోధులు’ నిలుపుతుంది; ‘శత్రువులు’ కంటే కొద్దిగా విస్తృతమైన కీర్తనాత్మక పదం.
- source_word: וּמְשַׂנְאֵינוּ
  choice: మమ్మల్ని ద్వేషించేవారిని
  rationale: శׂנא క్రియ యొక్క కృదంత రూపమైన ‘మమ్మల్ని ద్వేషిస్తున్నవారు’ అనే వ్యక్తిగత శత్రుత్వ భావాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా తెలుపుతుంది.
- source_word: הֱבִישׁוֹתָ
  choice: అవమానపరచినవాడవు
  rationale: హిఫిల్‌లోని ‘సిగ్గుపడేలా చేయు, అవమానానికి గురిచేయు’ అనే కారణార్థక భావాన్ని అతిశయింపకుండా సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కీర్తనాత్మక శైలి. సమాంతర పాదాల్లో ‘నీవే’ భావాన్ని పునరుద్ఘాటించడం హీబ్రూ ద్వితీయ పురుష ఏకవచన దైవిక చర్యకు తగిన కవితాత్మక బలం ఇస్తుంది.
