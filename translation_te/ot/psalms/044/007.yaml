revisions:
- from: ఎందుకంటే మా విరోధుల నుండి మమ్మల్ని రక్షించినవాడవు నీవే; మమ్మల్ని ద్వేషించేవారిని అవమానపరచినవాడవు నీవే.
  to: ఎందుకంటే నీవు మా విరోధుల నుండి మమ్మల్ని రక్షించావు, మమ్మల్ని ద్వేషించేవారిని అవమానపరిచావు.
  rationale: Recast both predicates as finite second-person past/perfective verbs, preserving the Hebrew’s parallel completed divine actions without adding the source-unexpressed emphasis of “నీవే.” The causal opening, adversarial terminology, and participial sense of “those who hate us” are retained.
  reviewer_model: gpt-5.6-terra
