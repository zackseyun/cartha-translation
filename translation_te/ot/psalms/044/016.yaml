  text: because of the voice of one who reproaches and blasphemes[b][a], because of the enemy and the avenger.
translation:
  language: te
  text: 'నిందించి దూషించేవాని స్వరం వల్ల[a],

    శత్రువు మరియు ప్రతీకారం తీర్చుకునేవాని కారణంగా[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిందించి దూషించేవాని శబ్దం నుండి.”
    reason: מִקּוֹל అనే పదబంధం కారణాన్ని సూచించవచ్చు; మరింత పదశఃగా మూలం లేదా వినిపించే శబ్దాన్ని కూడా వ్యక్తం చేస్తుంది.
  - marker: b
    text: హెబ్రీలో పదశః, “శత్రువు మరియు ప్రతీకారం తీర్చుకునేవాని ముఖం నుండి”; ఇది “వారి కారణంగా” లేదా “వారి సన్నిధి వల్ల” అనే అర్థమిచ్చే నుడికారం.
    reason: מִפְּנֵי లోని పదశః రూపాన్నీ, సందర్భానుసారమైన కారణార్థాన్నీ తెలియజేస్తుంది.
lexical_decisions:
- source_word: מִקּוֹל
  choice: స్వరం వల్ల
  rationale: מִן ఇక్కడ కారణాన్ని లేదా మూలాన్ని సూచిస్తుంది; ‘స్వరం’ అనే హెబ్రీయ concrete imageను ఉంచుతూ ‘వల్ల’ సందర్భంలోని కారణార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מְחָרֵף
  choice: నిందించేవాని
  rationale: חרף అనే క్రియారూపం అవమానకరంగా నిందించే లేదా ఎగతాళి చేసే వ్యక్తిని సూచిస్తుంది. ‘నిందించేవాని’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి participial forceను కాపాడుతుంది.
- source_word: וּמְגַדֵּף
  choice: దూషించేవాని
  rationale: גדף సాధారణ దుర్భాషతో పాటు దేవుని పట్ల అపవిత్రమైన దూషణను కూడా సూచించగలదు. ‘దూషించేవాని’ ఈ విస్తృతిని కాపాడి, సందర్భం నిర్దిష్టంగా దేవదూషణేనని ముందుగానే నిర్ణయించదు.
- source_word: מִפְּנֵי
  choice: కారణంగా
  rationale: పదశః ‘ముఖం నుండి/సన్నిధి నుండి’ అయినా, ఈ ప్రయోగం ఇక్కడ కారణం లేదా సందర్భాన్ని సూచిస్తుంది. ‘కారణంగా’ సమాంతర నిర్మాణాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֹיֵב
  choice: శత్రువు
  rationale: హెబ్రీ ఏకవచనాన్ని నిలుపుతూ సాధారణ ఆధునిక తెలుగు సమానార్థక పదాన్ని ఉపయోగించింది.
- source_word: וּמִתְנַקֵּם
  choice: ప్రతీకారం తీర్చుకునేవాని
  rationale: נקם యొక్క హిత్పయేల్ participle స్వయంగా ప్రతీకారం తీర్చుకునే వ్యక్తిని సూచిస్తుంది. ఈ రూపం వ్యక్తిగత, కొనసాగుతున్న కార్యభావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: וּמְגַדֵּף లోని శత్రుత్వపూరిత మాటలు దేవదూషణను తప్పనిసరిగా సూచిస్తాయా అనే సందిగ్ధత
  choice: దూషించేవాని
  alternative: దేవదూషణ చేసేవాని
  rationale: ఈ హెబ్రీ పదం దేవునికి విరోధమైన దూషణను సూచించగలిగినా, సాధారణంగా తీవ్రంగా దుర్భాషలాడటాన్నీ సూచించగలదు. ‘దూషించేవాని’ రెండు అవకాశాలనూ తెరిచి ఉంచి, మూలంలోని theological tensionను అనవసరంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కీర్తనాశైలిని పాటించింది. రెండు సమాంతర కారణపూర్వక పదబంధాలను నిలిపింది; ఒకే వ్యక్తిని సూచించే రెండు participlesను ‘నిందించి దూషించేవాని’గా సహజంగా కలిపింది.
