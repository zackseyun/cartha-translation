source:
  edition: WLC
  text: בְּ֭/ךָ צָרֵ֣י/נוּ נְנַגֵּ֑חַ בְּ֝/שִׁמְ/ךָ֗ נָב֥וּס קָמֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/005.yaml
  text: Through you we push back our foes[b][a]; through your name we trample those who rise against us.
translation:
  language: te
  text: నీ ద్వారా మా శత్రువులను వెనక్కి నెట్టివేస్తాము[a]; నీ నామం ద్వారా[b] మాకు విరోధంగా లేచేవారిని కాళ్లకింద తొక్కుతాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ క్రియ అక్షరార్థంగా కొమ్ములతో కుమ్మడం లేదా పొడవడం అని అర్థం; ఇక్కడ శత్రువులను బలంగా వెనక్కి నెట్టడాన్ని సూచించే రూపకం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నీ నామంలో.’ ఇక్కడ ‘నామం’ దేవుని వెల్లడైన వ్యక్తిత్వం, అధికారం, శక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּךָ
  choice: నీ ద్వారా
  rationale: వ్యక్తిని సూచించే ప్రత్యయంతో ఉన్న ב ఇక్కడ యుద్ధవిజయానికి సాధనం లేదా కార్యసాధకత్వాన్ని తెలియజేస్తుంది. ‘నీ ద్వారా’ అనే ప్రయోగం విజయం దేవునిపై ఆధారపడిందని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: צָרֵינוּ
  choice: మా శత్రువులను
  rationale: צר అనే పదం క్రియాశీలంగా విరోధించే వారిని సూచిస్తుంది. ‘శత్రువులు’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, సహజమైన పదం.
- source_word: נְנַגֵּחַ
  choice: వెనక్కి నెట్టివేస్తాము
  rationale: נגח అనే క్రియ అక్షరార్థంగా కొమ్ములతో కుమ్మడం లేదా పొడవడం అనే దృశ్యాన్ని కలిగిస్తుంది; ఇక్కడ శత్రువులను బలంగా తిప్పికొట్టడాన్ని రూపకంగా సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజతను కాపాడుతూ ఆ బలప్రయోగ భావాన్ని ఈ ఎంపిక అందిస్తుంది.
- source_word: בְּשִׁמְךָ
  choice: నీ నామం ద్వారా
  rationale: ‘నామం’ దేవుని వెల్లడైన వ్యక్తిత్వం, అధికారం, శక్తిని సూచిస్తుంది. ‘ద్వారా’ మొదటి పాదంలోని సాధనార్థక నిర్మాణానికి సమాంతరంగా ఉండి, విజయానికి దేవుడే మూలమని తెలియజేస్తుంది.
- source_word: נָבוּס
  choice: కాళ్లకింద తొక్కుతాము
  rationale: בוס అంటే తొక్కడం లేదా పాదాలకింద అణచివేయడం. ఈ రూపం హీబ్రూ యుద్ధచిత్రణను స్పష్టంగా, సజీవంగా నిలుపుతుంది.
- source_word: קָמֵינוּ
  choice: మాకు విరోధంగా లేచేవారిని
  rationale: קום నుండి వచ్చిన ఈ రూపం ఎదిరించడానికి లేచే ప్రత్యర్థులను సూచిస్తుంది. సాధారణంగా ‘దాడిచేసేవారు’ అనడం కంటే హీబ్రూ క్రియాత్మక భావాన్ని ఈ పదబంధం మెరుగ్గా కాపాడుతుంది.
theological_decisions:
- issue: యుద్ధవిజయంలో దేవుని కార్యసాధకత్వం మరియు ప్రజల చర్య
  choice: ‘నీ ద్వారా … నీ నామం ద్వారా’ అని దేవుణ్ణి విజయానికి నిర్ణాయక సాధనంగా చూపుతూనే, పోరాడే చర్యను ప్రజల చర్యగా ఉంచడం.
  alternative: ప్రజల సైనిక చర్యనే ప్రధానంగా చూపడం; లేదా ‘నామం’ను కేవలం ఒక సూత్రప్రాయమైన ఉచ్చారణగా భావించడం.
  rationale: రెండు సమాంతర పాదాల్లోని సాధనార్థక పదబంధాలు విజయానికి దేవుడే మూలమని తెలియజేస్తాయి; అదే సమయంలో బహువచన క్రియలు ప్రజల క్రియాశీల భాగస్వామ్యాన్ని నిలుపుతాయి. అనువాదం ఈ ఉద్రిక్తతను పరిష్కరించకుండా రెండింటినీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తనకు తగిన గంభీరతను కాపాడే శైలి. యుద్ధసంబంధ సమాంతరతను అర్ధవిరామంతో నిలిపి, హీబ్రూ రూపకాల తీవ్రతను ప్రధాన పాఠ్యం మరియు పాదసూచికల ద్వారా సమతుల్యం చేశాం.
