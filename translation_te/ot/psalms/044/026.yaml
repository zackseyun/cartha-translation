  yaml_path: translation/ot/psalms/044/026.yaml
  text: Rise up as our help[c][b][a], and redeem us for the sake of your steadfast love.
translation:
  language: te
  text: లేచి, మాకు సహాయం చేయి[a]; నీ స్థిరమైన ప్రేమను[b] బట్టి మమ్మల్ని విమోచించు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘లేచి, మాకు సహాయంగా ఉండు.’ హీబ్రూ అక్షరార్థంగా ‘లేచి, మాకు సహాయం’ అని సహాయం అనే నామవాచకాన్ని ఉపయోగిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ ‘హెసెద్’ అనే పదం స్థిరమైన, విశ్వసనీయమైన ప్రేమను సూచిస్తుంది; ముఖ్యంగా దేవుని తన ప్రజలతో ఉన్న నిబంధన సంబంధంలో కనిపించే నమ్మకమైన ప్రేమ అనే భావం దీనిలో ఉంది.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘మమ్మల్ని విడిపించు’ లేదా ‘మమ్మల్ని రక్షించు.’ హీబ్రూ క్రియ వెల చెల్లించి విడిపించడాన్నీ, నిర్ణాయకంగా జోక్యం చేసుకొని రక్షించడాన్నీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: లేచి
  rationale: קום క్రియ యొక్క పుంలింగ ఏకవచన ఆజ్ఞార్థక రూపం; దేవుడు తక్షణమే కార్యానికి పూనుకోవాలనే అత్యవసర విజ్ఞప్తిని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: עֶזְרָתָה לָנוּ
  choice: మాకు సహాయంగా రా
  rationale: עֶזְרָה అనే నామవాచకంలోని ‘సహాయం’ భావాన్ని నిలుపుతూ, לָנוּ లోని ‘మా పక్షంగా/మాకు’ సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. ‘రా’ మూలంలో స్పష్టంగా లేకపోయినా, నామవాచక పదబంధాన్ని తెలుగు వాక్యంగా సహజంగా పూర్తి చేస్తుంది; అక్షరార్థ నిర్మాణం పాదసూచికలో ఇవ్వబడింది.
- source_word: וּפְדֵנוּ
  choice: మమ్మల్ని విమోచించు
  rationale: פדה క్రియ చెల్లింపుద్వారా విడిపించడం లేదా శక్తివంతమైన జోక్యంతో రక్షించడం అనే పరిధిని కలిగి ఉంది. ‘విమోచించు’ ఆ ప్రత్యేక విడిపింపు భావాన్నీ, నిబంధనాత్మక లోతునీ నిలుపుతుంది.
- source_word: לְמַעַן
  choice: బట్టి
  rationale: తరువాత చెప్పబడే దేవుని స్వభావమే విజ్ఞప్తికి ఆధారం లేదా ప్రేరణ అని సంక్షిప్తంగా, సహజంగా తెలుపుతుంది.
- source_word: חַסְדֶּךָ
  choice: నీ నిబంధన విశ్వాసం
  rationale: חסד లోని ప్రేమ, విధేయత, స్థిరత్వం, నిబంధన సంబంధమైన నమ్మకత్వం అన్నింటినీ సూచించేందుకు ఈ ఎంపిక చేయబడింది; దీనిని కేవలం ‘కరుణ’గా కుదించదు.
theological_decisions:
- issue: פדה ను ప్రత్యేకమైన ధార్మిక పదంతో అనువదించాలా
  choice: మమ్మల్ని విమోచించు
  alternative: మమ్మల్ని విడిపించు / మమ్మల్ని రక్షించు
  rationale: కీర్తనలో దేవుని నిబంధనాత్మక విడిపింపును సూచించే లోతును ‘విమోచించు’ నిలుపుతుంది; అయితే తరువాతి సిద్ధాంతపరమైన వివరాలను వచనంలోకి చేర్చదు.
- issue: חסד లోని బహుముఖ నిబంధన భావాన్ని ఎలా నిలుపాలి
  choice: నీ నిబంధన విశ్వాసం
  alternative: నీ స్థిరమైన ప్రేమ / నీ విశ్వసనీయ ప్రేమ / నీ కరుణ
  rationale: దేవుని రక్షణకార్యానికి ఆధారంగా ఉన్న ప్రేమతో కూడిన నమ్మకత్వాన్ని ఈ పదబంధం స్పష్టం చేస్తుంది. ‘ప్రేమ’ అనే భావాంశం పూర్తిగా వినిపించకపోవచ్చని పాదసూచికలో వివరణ ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవభరితమైన ఏకవచన సంబోధన. వాక్యాన్ని సాధారణ పాఠకులకు సహజంగా ఉంచుతూ, సహాయం అనే నామరూపం, פדה యొక్క విమోచన భావం, חסד యొక్క నిబంధనాత్మక నమ్మకత్వం పాదసూచికలతో సంరక్షించబడ్డాయి.
