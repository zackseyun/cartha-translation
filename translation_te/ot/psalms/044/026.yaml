    issue: The main text adds “రా” (“come”).
    rationale: קוּמָה means “arise/rise up”; the Hebrew does not contain a verb meaning “come.” The following help expression should not be rendered in a way that introduces an additional movement command.
  - severity: medium
    issue: “నీ నిబంధన విశ్వాసం” inadequately renders חַסְדֶּךָ.
    rationale: Although hesed can carry loyalty and covenantal faithfulness, it centrally includes benevolent, loyal love. The draft’s phrase foregrounds an abstract “faithfulness” and omits love; “covenant” is best retained as explanatory footnote nuance rather than made the sole lexical content.
