  rationale: The revision removes the unsupported “come” while giving a natural Telugu imperative for the Hebrew appeal for help. It restores the love component of hesed in the main text and preserves its loyal, covenant-related nuance in the footnote. The wording keeps the source’s urgent prayerful register, retains “redeem” for פדה, and anchors every footnote at the relevant word or phrase.
