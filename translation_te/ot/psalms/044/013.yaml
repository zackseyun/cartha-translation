  yaml_path: translation/ot/psalms/044/013.yaml
  text: You have made us a reproach to our neighbors[a], a mockery and derision to those around us.
translation:
  language: te
  text: 'మా పొరుగువారికి మమ్మల్ని నిందపాలు చేశావు;

    మా చుట్టూ ఉన్నవారికి ఎగతాళికీ అపహాస్యానికీ గురిచేశావు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּשִׂימֵנוּ
  choice: మమ్మల్ని ... చేశావు / గురిచేశావు
  rationale: שׂים అనే క్రియకు ‘పెట్టు, ఉంచు, చేయు’ అనే భావాలున్నాయి. దేవుణ్ణి ఉద్దేశించిన ద్వితీయ పురుష ఏకవచన రూపాన్ని, విలాప సందర్భంలోని ఫలితభావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: חֶרְפָּה
  choice: నిందపాలు
  rationale: ఈ పదం నింద, అవమానం, దూషణకు గురికావడం అనే భావాన్ని ఇస్తుంది. పొరుగువారి దృష్టిలో ప్రజలు అవమానానికి గురైన సంబంధాత్మక భావాన్ని ‘నిందపాలు’ సహజంగా తెలియజేస్తుంది.
- source_word: לִשְׁכֵנֵינוּ
  choice: మా పొరుగువారి ఎదుట
  rationale: ל ఇక్కడ సంబంధాన్ని లేదా ఎవరి దృష్టిలో అన్న భావాన్ని సూచిస్తుంది. ‘ఎదుట’ అనేది పొరుగునున్న ప్రజల సమక్షంలో, వారి దృష్టిలో నిందపాలైన భావాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: לַעַג
  choice: ఎగతాళి
  rationale: לַעַג వెక్కిరింపుతో కూడిన హేళన లేదా పరిహాసాన్ని సూచిస్తుంది. ‘ఎగతాళి’ ఆధునిక తెలుగులో ఆ బహిరంగ వెక్కిరింపు భావాన్ని సహజంగా అందిస్తుంది.
- source_word: קֶלֶס
  choice: అపహాస్యం
  rationale: קֶלֶס తృణీకారంతో చేసే హేళనను సూచిస్తుంది. ‘అపహాస్యం’ ముందున్న ‘ఎగతాళి’తో సమాంతరంగా ఉండి, పునరుక్తి తీవ్రతను కాపాడుతుంది.
- source_word: לִסְבִיבוֹתֵינוּ
  choice: మా చుట్టూ ఉన్నవారికి
  rationale: అక్షరార్థంగా ‘మా చుట్టుపక్కలివారికి’ లేదా ‘మమ్మల్ని చుట్టుముట్టిన ప్రజలకు.’ ఇది చుట్టుపక్కలనున్న జనాలను విస్తృతంగా సూచించే సహజమైన తెలుగు రూపం.
