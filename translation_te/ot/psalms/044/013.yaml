translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, విలాప కవిత్వానికి తగిన గంభీరతతో అనువదించబడింది. హెబ్రీ సమాంతర నిర్మాణం రెండు పాదాల్లో నిలుపబడింది; לַעַג మరియు קֶלֶס అనే దగ్గరి భావాలున్న రెండు నామవాచకాలను ‘ఎగతాళి, అపహాస్యం’గా వేరు చేసి ప్రజల బహిరంగ హేళన తీవ్రతను కాపాడాం.
