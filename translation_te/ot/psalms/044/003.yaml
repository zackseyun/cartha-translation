  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י לֹ֪א בְ/חַרְבָּ֡/ם יָ֥רְשׁוּ אָ֗רֶץ וּ/זְרוֹעָ/ם֮ לֹא הוֹשִׁ֪יעָ֫ה לָּ֥/מוֹ כִּֽי יְמִֽינְ/ךָ֣ וּ֭/זְרוֹעֲ/ךָ וְ/א֥וֹר פָּנֶ֗י/ךָ כִּ֣י רְצִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/003.yaml
  text: For they did not possess the land by their sword[a], and their arm did not save them; but your right hand, your arm, and the light of your face did[b], because you delighted in them.
translation:
  language: te
  text: ఎందుకంటే, వారు తమ ఖడ్గంతో ఆ భూమిని స్వాధీనం చేసుకోలేదు; వారి బాహువు వారిని రక్షించలేదు. నీ కుడిచేయి, నీ బాహువు, నీ ముఖకాంతే[a] వారికి విజయాన్ని కలిగించాయి; ఎందుకంటే నీవు వారిపట్ల ప్రసన్నుడవయ్యావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ సన్నిధి వెలుగు.’ హీబ్రూలో అక్షరార్థంగా ‘నీ ముఖపు వెలుగు’; ఇది దేవుని అనుగ్రహాన్ని సూచించే చిత్రం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרְשׁוּ
  choice: స్వాధీనం చేసుకోలేదు
  rationale: ఈ చారిత్రక సందర్భంలో భూమిని పొందడం, దానిపై అధికారం సాధించడం అనే భావాన్ని ఇస్తుంది; కేవలం వారసత్వంగా పొందారనే అర్థాన్ని రుద్దదు.
- source_word: אָרֶץ
  choice: ఆ దేశాన్ని
  rationale: ఇక్కడ సాధారణంగా భూమి లేదా లోకం కాక, వారు స్వాధీనం చేసుకున్న నిర్దిష్ట దేశం ఉద్దేశించబడింది.
- source_word: זְרוֹעָם
  choice: వారి బాహువు
  rationale: మానవ సైనిక శక్తిని సూచించే శరీరరూపకాన్ని నిలుపుతుంది; తరువాత వచ్చే దేవుని ‘బాహువు’తో ఉన్న కవితాత్మక వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: הוֹשִׁיעָה לָּמוֹ
  choice: వారిని రక్షించలేదు
  rationale: ישׁע అనే క్రియలోని రక్షించడం/విడిపించడం అనే ప్రాథమిక భావాన్ని సైనిక సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְמִינְךָ
  choice: నీ కుడిచేయి
  rationale: దేవుని శక్తివంతమైన కార్యాన్ని సూచించే హీబ్రూ రూపకాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: זְרוֹעֲךָ
  choice: నీ బాహువు
  rationale: ‘వారి బాహువు’తో ఉన్న ఉద్దేశపూర్వక సమాంతరతను, వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: אוֹר פָּנֶיךָ
  choice: నీ ముఖకాంతి
  rationale: దైవానుగ్రహాన్ని సూచించే ‘ముఖపు వెలుగు’ అనే హీబ్రూ కవితా చిత్రాన్ని సంక్షిప్తంగా, సహజమైన తెలుగులో నిలుపుతుంది; ‘సన్నిధి వెలుగు’ అనే భావానువాదాన్ని పాదసూచికలో ఉంచింది.
- source_word: רְצִיתָם
  choice: నీవు వారిపట్ల ప్రసన్నుడవయ్యావు
  rationale: వారిని మెచ్చుకోవడానికి వారిలో ఏదో యోగ్యత ఉందని సూచించకుండా, దేవుని ప్రసన్నత మరియు అనుకూలతను వ్యక్తం చేస్తుంది.
- source_word: כִּי ... כִּי
  choice: ఎందుకంటే ... ఎందుకంటే
  rationale: మొదటిది ముందటి వాక్యానికి వివరణను, చివరిది దేవుని కార్యానికి కారణాన్ని పరిచయం చేస్తుంది; తెలుగులో పునరుక్తి కీర్తనాత్మక తర్కాన్ని సహజంగానే నిలుపుతుంది.
theological_decisions:
- issue: దైవ కార్యసాధకత్వం మరియు మానవ సైనిక శక్తి మధ్య వ్యత్యాసం
  choice: దేశ స్వాధీనతను, రక్షణను వారి ఖడ్గం లేదా బాహువుకు కాక దేవుని కుడిచేయి, బాహువు, ముఖకాంతికి ఆపాదించింది.
  alternative: దేవునిపై సాధారణ ఆధారపడుదల గురించిన విస్తృత ప్రకటనగా మార్చడం.
  rationale: హీబ్రూ వాక్యం మానవ ఆయుధబలాన్ని దేవుని కార్యంతో నేరుగా వ్యతిరేకిస్తుంది; ఆ పరిమితిని దాటి అదనపు సిద్ధాంతాన్ని చేర్చలేదు.
- issue: אוֹר פָּנֶיךָ లోని అనుగ్రహం/సన్నిధి చిత్రం
  choice: ప్రధాన పాఠ్యంలో ‘నీ ముఖకాంతి’ అని రూపకాన్ని నిలిపింది.
  alternative: నీ సన్నిధి వెలుగు; నీ అనుగ్రహం.
  rationale: ఈ పదబంధం దేవుని అనుకూల సన్నిధిని సూచించినా, హీబ్రూ కవితా చిత్రం స్వయంగా అర్థసమృద్ధమైనది; దానిని ఒకే వివరణగా కుదించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
- issue: సానుకూల వాక్యభాగంలో క్రియ లుప్తంగా ఉండడం
  choice: ‘వారికి దాన్ని సాధించిపెట్టాయి’ అని సందర్భానుగుణమైన క్రియను పూరించింది.
  alternative: హీబ్రూ వలె క్రియను పూర్తిగా లుప్తంగా ఉంచడం.
  rationale: హీబ్రూలోని లుప్తక్రియ దేశ స్వాధీనత, రక్షణ అనే ముందటి రెండు భావాలను తిరిగి సూచిస్తుంది. తెలుగులో అర్థం స్పష్టంగా, వాక్యం సహజంగా ఉండేందుకు తటస్థమైన ‘దాన్ని సాధించిపెట్టాయి’ వాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కీర్తనా శైలిని పాటించింది. ‘ఖడ్గం,’ ‘బాహువు,’ ‘కుడిచేయి,’ ‘ముఖకాంతి’ వంటి కవితాత్మక రూపకాలను నిలిపి, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా చేసింది.
