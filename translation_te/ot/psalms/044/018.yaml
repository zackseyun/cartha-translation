source:
  edition: WLC
  text: לֹא נָס֣וֹג אָח֣וֹר לִבֵּ֑/נוּ וַ/תֵּ֥ט אֲשֻׁרֵ֗י/נוּ מִנִּ֥י אָרְחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/018.yaml
  text: Our heart has not turned back[a], nor have our steps turned aside from your path.
translation:
  language: te
  text: మా హృదయం వెనక్కి మళ్లలేదు; మా అడుగులు నీ మార్గం నుండి పక్కకు తొలగలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మా హృదయం వెనక్కి పోలేదు; మా అడుగులు నీ దారి నుండి పక్కకు మళ్లలేదు.”
    reason: నָסוֹג, אֲשֻׁרֵינוּ, וַתֵּט, אֹרַח పదాలకు సాధ్యమైన సహజ తెలుగు ప్రత్యామ్నాయాలను చూపుతుంది.
lexical_decisions:
- source_word: נָסוֹג אָחוֹר
  choice: వెనక్కి మళ్లలేదు
  rationale: סוג అనే క్రియకు వెనుదిరగడం, వెనక్కి తగ్గడం అనే భావాలున్నాయి; אָחוֹר దిశను బలపరుస్తుంది. ఈ కలయికను సహజమైన తెలుగులో ‘వెనక్కి మళ్లలేదు’ అని అనువదించడం మూలంలోని తిరోగమన రూపకాన్ని నిలుపుతుంది.
- source_word: לִבֵּנוּ
  choice: మా హృదయం
  rationale: హీబ్రూ ‘హృదయం’ అంతరంగం, సంకల్పం, నిబద్ధతలను సమగ్రంగా సూచిస్తుంది. మూలంలోని సమూహార్థక ఏకవచనాన్ని అలాగే ఉంచడం కవితాత్మకతను, బైబిలు మానవశాస్త్ర రూపకాన్ని కాపాడుతుంది.
- source_word: וַתֵּט
  choice: పక్కకు తొలగలేదు
  rationale: נטה కు వంగడం, మళ్లడం, పక్కకు తొలగడం అనే అర్థాలున్నాయి. మార్గ రూపకంలో ‘పక్కకు తొలగడం’ దారి తప్పడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲשֻׁרֵינוּ
  choice: మా అడుగులు
  rationale: ఈ నామవాచకం పాదాలకన్నా అడుగులు లేదా నడకను సూచిస్తుంది. ‘అడుగులు’ మార్గ రూపకాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מִנִּי
  choice: నుండి
  rationale: ఈ విభక్తి మార్గం నుండి వేరుపడడాన్ని సూచిస్తుంది; ‘పక్కకు తొలగడం’తో కలిపి ‘నుండి’ సహజమైన తెలుగు ప్రయోగం.
- source_word: אָרְחֶךָ
  choice: నీ మార్గం
  rationale: אֹרַח అనేది బాటను లేదా జీవన విధానాన్ని సూచిస్తుంది. ‘మార్గం’ దాని స్పష్టమైన చిత్రాన్నీ రూపకార్థాన్నీ కాపాడుతుంది.
theological_decisions:
- issue: ‘హృదయం’ అనే మానవశాస్త్ర రూపకం
  choice: ‘మా హృదయం’ అని యథాతథంగా నిలుపడం
  alternative: ‘మా మనస్సు’ లేదా ‘మా నిబద్ధత’ అని వివరణాత్మకంగా అనువదించడం
  rationale: ‘హృదయం’ మేధస్సు, భావోద్వేగం లేదా నిబద్ధతలో ఒక్కదానికే పరిమితం కాకుండా అంతరంగ వ్యక్తిని సమగ్రంగా సూచిస్తుంది; అందువల్ల మూల రూపకాన్ని నిలుపడం అర్థాన్ని అనవసరంగా సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితాత్మక శైలి. ‘హృదయం,’ ‘అడుగులు,’ ‘మార్గం’ అనే మూల రూపకాలు నిలుపబడ్డాయి; వచనంలోని సమూహ స్వరం కోసం ‘మా’ ఉపయోగించబడింది.
