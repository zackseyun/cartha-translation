  source_fidelity: ‘ఇదంతా’ כָּל־זֹאת యొక్క సమష్టి సూచనను సరిగ్గా ఇస్తుంది. ‘మాపైకి వచ్చినా’ బָּאַתְנוּ యొక్క ‘మాపైకి వచ్చింది’ అనే విపత్తు-రూపకాన్ని, తరువాతి వాక్యాలతో ఉన్న విరోధ భావాన్ని సహజంగా తెలియజేస్తుంది. దేవునిని మరచిపోలేదని, ఆయన నిబంధనకు సంబంధించి అబద్ధ/మోసపూరితంగా ప్రవర్తించలేదని ఉన్న రెండు పరిమిత నిరాకరణలను అనువాదం నిలుపుతుంది; సంపూర్ణ పాపరాహిత్యాన్ని జోడించదు.
