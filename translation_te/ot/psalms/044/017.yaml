  text: All this has come upon us[a], yet we have not forgotten you, and we have not been false to your covenant.
translation:
  language: te
  text: ఇదంతా మాపైకి వచ్చినా, మేము నిన్ను మరచిపోలేదు; నీ నిబంధనపట్ల మేము అసత్యంగా ప్రవర్తించలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל זֹאת
  choice: ఇదంతా
  rationale: ముందు వివరించిన బాధలన్నిటినీ సమష్టిగా సూచించే సహజమైన తెలుగు ప్రయోగం; כָּל యొక్క సమగ్ర భావాన్ని నిలుపుతుంది.
- source_word: בָּאַתְנוּ
  choice: మాపైకి వచ్చినా
  rationale: בוא అనే క్రియలోని ‘వచ్చుట’ రూపకాన్ని నిలుపుతూ, విపత్తులు తమపైకి వచ్చాయనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. తరువాతి నిరాకరణలతో ఉన్న వ్యతిరేక సంబంధాన్ని ‘వచ్చినా’ తెలియజేస్తుంది.
- source_word: וְלֹא שְׁכַחֲנוּךָ
  choice: మేము నిన్ను మరచిపోలేదు
  rationale: దేవునిని సూచించే ద్వితీయ పురుష ఏకవచన కర్మప్రత్యయాన్ని, అలాగే ‘మరచిపోవుట’ అనే సరళమైన మూలార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: וְלֹא שִׁקַּרְנוּ
  choice: మేము అసత్యంగా ప్రవర్తించలేదు
  rationale: שׁקר ఇక్కడ కేవలం అబద్ధం చెప్పడం కంటే విశ్వాసఘాతకంగా లేదా మోసపూరితంగా ప్రవర్తించడాన్ని సూచించగలదు; ‘అసత్యంగా ప్రవర్తించలేదు’ ఆ విస్తృత భావాన్ని అందిస్తుంది.
- source_word: בִּבְרִיתֶךָ
  choice: నీ నిబంధనపట్ల
  rationale: ב ఉపసర్గం అసత్య ప్రవర్తనకు సంబంధించిన పరిధి లేదా విషయాన్ని సూచిస్తుంది. ‘నీ నిబంధనపట్ల’ అనేది తెలుగులో సహజంగా ఉండి, దేవునితో నిబంధన సంబంధానికి అవిశ్వాసంగా ఉండలేదనే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: బాధల మధ్య ఇశ్రాయేలు చేస్తున్న నిర్దోషిత్వ వాదన స్వభావం
  choice: దేవునిని మరచిపోలేదని, ఆయన నిబంధనపట్ల అసత్యంగా ప్రవర్తించలేదని చెప్పే పరిమిత నిబంధన-విశ్వాస వాదనగా అనువదించబడింది.
  alternative: దేవుని ఎదుట సంపూర్ణ పాపరాహిత్యాన్ని ప్రకటించే విస్తృత వాదనగా అర్థం చేసుకోవడం.
  rationale: 'హీబ్రూ పాఠం రెండు నిర్దిష్ట నిరాకరణలనే చెబుతుంది: దేవునిని మరచిపోవడం, ఆయన నిబంధనపట్ల అసత్యంగా ప్రవర్తించడం. కాబట్టి పాఠంలో లేని సంపూర్ణ పాపరాహిత్య భావాన్ని అనువాదం చేర్చదు.'
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘నిబంధన’ బైబిలు సందర్భంలో విస్తృతంగా అర్థమయ్యే పదం; ‘అసత్యంగా ప్రవర్తించలేదు’ మూలంలోని నిబంధన అవిశ్వాస భావాన్ని అతిగా వివరణాత్మకం కాకుండా తెలియజేస్తుంది.
