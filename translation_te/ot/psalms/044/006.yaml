  yaml_path: translation/ot/psalms/044/006.yaml
  text: For I do not trust in my bow[b][a], and my sword does not save me.
translation:
  language: te
  text: ఎందుకంటే నేను నా విల్లును నమ్మను[a], మరియు నా ఖడ్గం నన్ను రక్షించదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను నా విల్లును నమ్మను, మరియు నా ఖడ్గం నన్ను రక్షించదు.” హెబ్రీ అసంపూర్ణ క్రియారూపాలు భవిష్యత్ లేదా సంకల్ప ఛాయను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: యుద్ధ సందర్భంలో “నన్ను రక్షించదు” అనే మాటను “నాకు విజయం కలిగించదు” లేదా “నన్ను విడిపించదు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ప్రకటనకు కారణాన్ని లేదా ఆధారాన్ని పరిచయం చేస్తుంది; కవితా ప్రవాహంలో వివరణాత్మక సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: בְקַשְׁתִּי
  choice: నా విల్లును
  rationale: קֶשֶׁת అంటే యుద్ధాయుధమైన ‘విల్లు’; בְ ఉపసర్గ בטח క్రియతో కలిసి తెలుగులో సహజంగా ‘నా విల్లును నమ్ముకోను’ అవుతుంది.
- source_word: אֶבְטָח
  choice: నేను ... నమ్ముకోను
  rationale: בטח అనే కాల్ క్రియకు ‘నమ్ము, ఆధారపడు’ అనే అర్థాలు ఉన్నాయి. ఇక్కడ సాధారణంగా కొనసాగుతున్న వైఖరిని తెలిపే వర్తమాన భావం సహజం; అసంపూర్ణ క్రియారూపంలోని భవిష్యత్ భావసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: וְחַרְבִּי
  choice: నా ఖడ్గం
  rationale: חֶרֶב అనే పదానికి 1వ పురుష ఏకవచన స్వామ్య ప్రత్యయం ఉంది. విల్లు–ఖడ్గం సమాంతరతను నిలుపుతూ రెండో పాదాన్ని తెలుగులో సహజంగా కలిపాం.
- source_word: תוֹשִׁיעֵנִי
  choice: నన్ను రక్షించదు
  rationale: ישׁע హిఫీల్ రూపం ‘రక్షించు, విడిపించు, విజయం కలిగించు’ అనే పరిధి కలిగి ఉంది. ‘రక్షించదు’ మూలపదపు విస్తృత భావాన్ని కాపాడుతుంది; సైనిక సందర్భంలోని ‘విజయం కలిగించదు’ భావాన్ని పాదసూచికలో సూచించాం.
theological_decisions:
- issue: యుద్ధ సందర్భంలో ישׁע తెలిపే విమోచన భావం
  choice: నన్ను రక్షించదు
  alternative: నాకు విజయం కలిగించదు; నన్ను విడిపించదు
  rationale: సందర్భం యుద్ధానికి సంబంధించినదైనా, ‘విజయం’ అని మాత్రమే అనువదిస్తే హెబ్రీ పదపు విస్తృత రక్షణ భావం కుదించబడుతుంది. ‘రక్షించదు’ దేవునిపై ఆధారపడే అంశాన్ని నిలుపుతుంది, అయితే అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: హెబ్రీ అసంపూర్ణ క్రియారూపాల కాలభావం
  choice: 'వర్తమాన సాధారణ భావం: ‘నమ్ముకోను ... రక్షించదు’'
  alternative: 'భవిష్యత్ భావం: ‘నమ్ముకోను/నమ్మను ... రక్షించదు/రక్షించదు’ అనే సంకల్ప లేదా భవిష్యత్ పఠనం'
  rationale: కవితా సందర్భంలో ఇవి సాధారణంగా ఉన్న విశ్వాస వైఖరిని తెలిపేలా చదవవచ్చు; అయినా భవిష్యత్‌సదృశ భావం నిజమైన వ్యాకరణ సాధ్యత కాబట్టి పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా వాక్యనిర్మాణం. ‘విల్లు’, ‘ఖడ్గం’, ‘రక్షించు’ వంటి సాధారణంగా అర్థమయ్యే పదాలను వాడి, మూలంలోని విల్లు–ఖడ్గం సమాంతరతను నిలిపాం. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
