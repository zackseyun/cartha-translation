  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַף זָ֭נַחְתָּ וַ/תַּכְלִימֵ֑/נוּ וְ/לֹא תֵ֝צֵ֗א בְּ/צִבְאוֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/009.yaml
  text: Yet you have rejected us and put us to shame[a], and you do not go out with our armies.
translation:
  language: te
  text: అయినా నీవు మమ్మల్ని తిరస్కరించావు, అవమానపరిచావు; మా సైన్యాలతో నీవు బయలుదేరడం లేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: ‘మా సైన్యాలలో నీవు బయలుదేరడం లేదు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: అయినా
  rationale: ముందటి వచనాల్లో దేవుని సహాయాన్ని గూర్చిన మాటలకు విరుద్ధంగా ఇప్పుడు పరిస్థితి మారిందనే బలమైన మలుపును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: זָנַחְתָּ
  choice: నీవు మమ్మల్ని తిరస్కరించి
  rationale: זנח లోని విడిచిపెట్టడం లేదా తోసివేయడం అనే సంబంధపరమైన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וַתַּכְלִימֵנוּ
  choice: అవమానానికి గురిచేశావు
  rationale: כלם హిఫీల్ రూపంలోని అవమానం కలిగించడం అనే కారణార్థక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְלֹא
  choice: లేదు
  rationale: మునుపటి ఫిర్యాదుకు మరో అంశాన్ని జోడించే సముచ్చయ-నిషేధ భావాన్ని తెలుగు వాక్యనిర్మాణంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תֵצֵא
  choice: బయలుదేరడం
  rationale: יצא యొక్క ప్రాథమికమైన ‘బయటికి వెళ్లడం/బయలుదేరడం’ భావాన్ని నిలుపుతూ, యుద్ధ సందర్భాన్ని తరువాతి పదబంధం తెలియజేయనిస్తుంది.
- source_word: בְּצִבְאוֹתֵינוּ
  choice: మా సైన్యాలతో
  rationale: צָבָא ఇక్కడ సైనిక దళాలను సూచిస్తుంది; בְּ అనే పూర్వప్రత్యయాన్ని సహవాసార్థకంగా ‘తో’ అని అనువదించడం సందర్భానుసారంగా సహజం.
theological_decisions:
- issue: యుద్ధంలో దేవుని ఉపసంహరణ చిత్రణ
  choice: కీర్తనకర్త అనుభవిస్తున్నట్లుగా దేవుడు ఇశ్రాయేలు సైన్యాలతో బయలుదేరక తన సహాయాన్ని ఉపసంహరించుకున్నాడనే విలాపంగా అనువదించబడింది.
  alternative: మరింత అక్షరార్థంగా, ‘మా సైన్యాలలో నీవు బయలుదేరడం లేదు.’
  rationale: దైవిక గైర్హాజరు లేదా విసర్జన గురించిన కీర్తనలోని ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది; అదే సమయంలో వచనం చెప్పిన దానికంటే విస్తృతమైన సిద్ధాంత నిర్ణయాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన విలాప శైలి. ‘మా సైన్యాలతో’ ప్రధాన భావాన్ని స్పష్టంగా ఇస్తుంది; בְּ యొక్క ‘లో’ అనే మరింత అక్షరార్థక సాధ్యతను పాదసూచికలో నిలిపింది.
