review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the central images of being handed over as sheep for food and scattered among the nations. However, תִּתְּנֵנוּ is an imperfect ('you give/hand us over'), whereas the draft renders it as a completed past action ('అప్పగించావు'). The revised wording preserves the Hebrew aspect more closely. The perfect זֵרִיתָנוּ is appropriately rendered as 'చెదరగొట్టావు.'
  naturalness: ‘ఆహారమయ్యే గొర్రెలవలె’ is understandable but slightly compressed. ‘ఆహారం కోసమైన గొర్రెలవలె’ is more immediately clear in modern standard Telugu while retaining the source metaphor. ‘జనాల మధ్య’ is natural and, with the explanatory footnote, adequately conveys the contextual sense of foreign nations.
  terminology: ‘అప్పగిస్తున్నావు’ suitably communicates נתן in this lament context without adding a specific agent or method. ‘ఆహారం కోసమైన’ represents מַאֲכָל without importing ‘slaughter.’ ‘జనాలు’ and the cultural footnote avoid a potentially misleading religiously specialized use of ‘అన్యజనులు.’
  issues:
  - severity: medium
    issue: Verbal aspect of תִּתְּנֵנוּ
    rationale: The Hebrew verb is imperfect, but the draft uses the past perfective ‘అప్పగించావు.’ Rendering it as ‘అప్పగిస్తున్నావు’ better reflects the ongoing/present force of the lament and accords with the English audit trail’s ‘You give us over.’
  - severity: low
    issue: Clarity of the sheep-for-food expression
    rationale: ‘ఆహారమయ్యే గొర్రెలవలె’ is not incorrect, but ‘ఆహారం కోసమైన గొర్రెలవలె’ more naturally expresses sheep designated as food, without strengthening the image to slaughter.
  revised_text: నీవు మమ్మల్ని ఆహారం కోసమైన గొర్రెలవలె అప్పగిస్తున్నావు[a]; జనాల మధ్య మమ్మల్ని చెదరగొట్టావు[b].
