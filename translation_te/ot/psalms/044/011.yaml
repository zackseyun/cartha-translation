revisions:
- from: నీవు మమ్మల్ని ఆహారమయ్యే గొర్రెలవలె అప్పగించావు[a]; జనాల మధ్య మమ్మల్ని చెదరగొట్టావు[b].
  to: నీవు మమ్మల్ని ఆహారం కోసమైన గొర్రెలవలె అప్పగిస్తున్నావు[a]; జనాల మధ్య మమ్మల్ని చెదరగొట్టావు[b].
  rationale: The revision corrects the first verb’s aspect from completed past to the Hebrew imperfect’s present/ongoing lament force. It also makes the metaphor of sheep intended for food more idiomatic in Telugu, without introducing the unsupported notion of slaughter. Footnote anchors and their sequence are retained.
