source:
  edition: WLC
  text: תִּ֭תְּנֵ/נוּ כְּ/צֹ֣אן מַאֲכָ֑ל וּ֝/בַ/גּוֹיִ֗ם זֵרִיתָֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/011.yaml
  text: You give us over like sheep for food[b][a], and among the nations you have scattered us.
translation:
  language: te
  text: నీవు మమ్మల్ని ఆహారం కోసమైన గొర్రెలవలె అప్పగిస్తున్నావు[a]; జనాల మధ్య మమ్మల్ని చెదరగొట్టావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: ‘నీవు మమ్మల్ని ఆహారంగా గొర్రెలవలె అప్పగిస్తున్నావు.’'
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో ‘జనాలు’ అని ఉంది; ఈ సందర్భంలో ఇశ్రాయేలు చెదరగొట్టబడిన విదేశీ ప్రజలను అది సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְּנֵנוּ
  choice: నీవు మమ్మల్ని ... అప్పగించావు
  rationale: נתן యొక్క ప్రాథమిక భావం ‘ఇవ్వడం’; ఈ విలాప సందర్భంలో శత్రువుల చేతికి అప్పగించడం అనే బలం ఉంది. ‘అప్పగించావు’ తెలుగు వాక్యంలో ఆ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כְּצֹאן מַאֲכָל
  choice: ఆహారమయ్యే గొర్రెలవలె
  rationale: כְּ పోలికను సూచిస్తుంది; צֹאן గొర్రెల మందను, מַאֲכָל ఆహారం లేదా తినబడేదాన్ని సూచిస్తుంది. ‘వధకు’ అని అనువదించడం మూలంలోని మాటకన్నా నిర్దిష్టంగా ఉంటుంది.
- source_word: וּבַגּוֹיִם
  choice: జనాల మధ్య
  rationale: גּוֹיִם ఇక్కడ ఇశ్రాయేలుకు వెలుపలి ప్రజలను లేదా జనాలను సూచిస్తుంది. ‘అన్యజనులు’ అనే పదానికి ఏర్పడగల ప్రత్యేక మతపరమైన ఛాయను నివారిస్తూ ‘జనాలు’ మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: זֵרִיתָנוּ
  choice: మమ్మల్ని చెదరగొట్టావు
  rationale: זרה యొక్క అక్షరార్థ పరిధిలో చెదరగొట్టడం లేదా తూర్పారబట్టడం ఉన్నాయి. జనాల మధ్య విస్తరింపజేయబడిన సందర్భంలో ‘చెదరగొట్టావు’ స్పష్టమైన, సహజమైన తెలుగు.
theological_decisions:
- issue: ప్రజలను ఆహారమయ్యే గొర్రెలతో పోల్చిన రూపకం
  choice: ‘ఆహారమయ్యే గొర్రెలవలె’ అనే తీవ్రమైన రూపకాన్ని నిలుపుకున్నాం.
  alternative: ‘వధకు తీసుకెళ్లే గొర్రెలవలె’ లేదా ‘మింగివేయబడే గొర్రెలవలె’
  rationale: మూలంలోని מַאֲכָל ‘ఆహారం/తినబడేది’ అని చెబుతుంది; ‘వధ’ అనే ప్రత్యేక చర్యను నేరుగా చెప్పదు. అందువల్ల విలాపంలోని తీవ్రతను తగ్గించకుండా, మూలానికి మించిన వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; విలాపానికి తగిన గంభీరతతో, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. హీబ్రూ కవిత్వంలోని నేర సంబోధన, గొర్రెల రూపకం, జనాల మధ్య చెదరగొట్టబడిన భావం నిలుపబడ్డాయి.
