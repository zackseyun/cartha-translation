translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి. హీబ్రూ సమాంతరతను, ‘అవమానం/సిగ్గు’ మధ్య భావభేదాన్ని, కప్పివేయడం అనే రూపకాన్ని నిలుపుకుంది.
