  yaml_path: translation/ot/psalms/044/015.yaml
  text: All day long my disgrace is before me[a], and the shame of my face has covered me.
translation:
  language: te
  text: రోజంతా నా అవమానం నా కళ్లముందే ఉంది; నా ముఖంలోని సిగ్గు నన్ను కప్పివేసింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ముఖం మీదున్న సిగ్గు నన్ను కప్పివేసింది.” హీబ్రూ వాక్యం మరింత అక్షరార్థంగా, “నా ముఖపు సిగ్గు నన్ను కప్పివేసింది” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: రోజంతా
  rationale: రోజు పొడవునా నిరంతరంగా అనే కాలవ్యాప్తి భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כְּלִמָּתִי
  choice: నా అవమానం
  rationale: బహిరంగ అగౌరవం, పరాభవం అనే సామాజిక భావాన్ని వ్యక్తం చేస్తుంది; తరువాతి בֹשֶׁת‌కు ఎంచుకున్న ‘సిగ్గు’తో అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: נֶגְדִּי
  choice: నా కళ్లముందే ఉంది
  rationale: తన ఎదుట, తన దృష్టిలో నిరంతరం నిలిచి ఉండటం అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘ఏ’ నొక్కిచెప్పే భావాన్ని ఇస్తుంది.
- source_word: וּבֹשֶׁת
  choice: సిగ్గు
  rationale: అంతర్గత లజ్జను నేరుగా తెలియజేస్తూ, ‘అవమానం’తో ఉన్న సమాంతరతను మరియు స్వల్ప భావభేదాన్ని నిలుపుతుంది.
- source_word: פָּנַי
  choice: నా ముఖంలోని
  rationale: హీబ్రూలోని ‘నా ముఖపు సిగ్గు’ అనే సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ‘నా ముఖం మీదున్న’ అనేది సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: כִּסָּתְנִי
  choice: నన్ను కప్పివేసింది
  rationale: כסה అనే క్రియలోని ‘కప్పు’ రూపకాన్ని నిలుపుతూ, సిగ్గు వక్తను పూర్తిగా ఆవరించిన ప్రస్తుత ఫలితస్థితిని తెలియజేస్తుంది.
