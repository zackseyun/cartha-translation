source:
  edition: WLC
  text: כִּ֣י דִ֭כִּיתָ/נוּ בִּ/מְק֣וֹם תַּנִּ֑ים וַ/תְּכַ֖ס עָלֵ֣י/נוּ בְ/צַלְמָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/019.yaml
  text: For you crushed us in a place of jackals and covered us with deep darkness[a][b].
translation:
  language: te
  text: ఎందుకంటే నక్కల నివాసస్థలంలో నీవు మమ్మల్ని నలిపివేశావు[b]; కటిక చీకటితో మమ్మల్ని కప్పావు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరణ ఛాయతో మమ్మల్ని కప్పావు.”
    reason: lexical_alternative
  - marker: b
    text: నిర్జన ప్రదేశాన్ని వర్ణించే ఈ చిత్రంలో “నక్కలు” అనేదే ఎక్కువగా సంభావ్యమైన అర్థం; కొన్ని పాత అనువాదాల్లో “ఘటసర్పాలు” లేదా “మహాసర్పాలు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: అయినా
  rationale: ముందటి వాక్యాల్లో తమ హృదయం వెనుదిరగలేదని చెప్పిన తరువాత, ఇక్కడ దేవుడు వారిని నలిపివేసిన పరిస్థితిని వ్యతిరేక భావంతో ప్రస్తావిస్తుంది. כִּי అనేక సంబంధాలను సూచించగలదన్న అస్పష్టతలో, ఈ సందర్భ ప్రవాహానికి ‘అయినా’ సహజంగా సరిపోతుంది.
- source_word: דִכִּיתָנוּ
  choice: నీవు మమ్మల్ని నలిపివేశావు
  rationale: దెబ్బతీయడం, నలిపివేయడం, అవమానకరంగా కుంగదీయడం అనే బలమైన భావాన్ని ఇది సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בִּמְקוֹם תַּנִּים
  choice: నక్కలు సంచరించే చోట
  rationale: నిర్జన ప్రదేశాన్ని సూచించే కవితా చిత్రంలో תַּנִּים అనేది ఎక్కువగా నక్కలను సూచిస్తుంది. ‘సంచరించే చోట’ అనే రూపం ఆ ప్రదేశ స్వభావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַתְּכַס עָלֵינוּ
  choice: మమ్మల్ని కప్పావు
  rationale: హీబ్రూ వాక్యంలోని కప్పివేయడం అనే స్పష్టమైన రూపకాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: בְצַלְמָוֶת
  choice: కటిక చీకటితో
  rationale: צַלְמָוֶת ఇక్కడ తీవ్రమైన, ఆవరించే చీకటిని సూచించగలదు. ‘కటిక చీకటి’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి కవితా బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: בְצַלְמָוֶת పదబంధం యొక్క అర్థం
  choice: కటిక చీకటి
  alternative: మరణ ఛాయ
  rationale: ఈ పదం తీవ్రమైన చీకటిని సూచించే స్థిర ప్రయోగంగా ఉండవచ్చు; అదే సమయంలో సంప్రదాయంగా ‘మరణ ఛాయ’ అని కూడా అర్థం చేసుకున్నారు. ప్రధాన పాఠంలో సందర్భానుకూలమైన అర్థాన్ని ఇచ్చి, మరణాన్ని నేరుగా సూచించే అవకాశాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కవితా శైలిని వాడాం. ‘నలిపివేశావు,’ ‘కటిక చీకటి’ వంటి పదాలు మూలంలోని తీవ్రతను సహజంగా తెలియజేస్తాయి. పాదసూచిక సూచికలను సంబంధిత పదబంధాల వెంట ఉంచాం.
