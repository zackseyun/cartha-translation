  to: ఎందుకంటే నక్కల నివాసస్థలంలో నీవు మమ్మల్ని నలిపివేశావు[b]; కటిక చీకటితో మమ్మల్ని కప్పావు[a].
  rationale: The revision corrects the discourse relation expressed by כִּי, replacing the adversative “అయినా” with causal “ఎందుకంటే.” It also uses “నక్కల నివాసస్థలంలో” to represent בִּמְקוֹם תַּנִּים more directly, without adding an action. The direct address, the crushing image, and the lexical ambiguity of צַלְמָוֶת are retained, with footnote anchors preserved at their relevant expressions.
