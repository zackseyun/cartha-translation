source:
  edition: WLC
  text: לָֽ/מָּה פָנֶ֥י/ךָ תַסְתִּ֑יר תִּשְׁכַּ֖ח עָנְיֵ֣/נוּ וְֽ/לַחֲצֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/024.yaml
  text: Why do you hide your face and forget our affliction and our oppression?[a]
translation:
  language: te
  text: నీ ముఖాన్ని ఎందుకు దాచుకుంటున్నావు? మా బాధను, మాపై ఉన్న అణచివేతను ఎందుకు మరచిపోతున్నావు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ సన్నిధిని.’ హీబ్రూలో అక్షరాలా ‘నీ ముఖాన్ని’ అని ఉంది; ఇది అనుకూలమైన శ్రద్ధను లేదా సమీపత్వాన్ని సూచించే సాధారణ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: ఎందుకు
  rationale: కారణాన్ని ప్రశ్నించే సహజమైన ఆధునిక తెలుగు రూపం; విలాపంలోని ప్రత్యక్ష ప్రశ్నను నిలుపుతుంది.
- source_word: פָנֶיךָ
  choice: నీ ముఖాన్ని
  rationale: హీబ్రూ రూపకాన్ని అక్షరార్థానికి దగ్గరగా నిలుపుతూ, దేవుని అనుకూల సన్నిధి లేదా శ్రద్ధ అనే భావాన్ని అంతర్లీనంగా ఉంచుతుంది.
- source_word: תַסְתִּיר
  choice: దాచుకుంటున్నావు
  rationale: ‘ముఖాన్ని దాచుకోవడం’ అనే సంబంధాత్మక రూపకానికి తెలుగులో సహజంగా సరిపోతుంది; ఉద్దేశపూర్వకంగా కనబడకుండా ఉండే భావాన్ని ఇస్తుంది.
- source_word: תִּשְׁכַּח
  choice: మరచిపోతున్నావు
  rationale: ‘పట్టించుకోకపోవడం’ అని వివరణాత్మకంగా మార్చకుండా, మూలంలోని ధైర్యమైన విలాప భాషను నిలుపుతుంది.
- source_word: עָנְיֵנוּ
  choice: మా బాధను
  rationale: సమూహం అనుభవిస్తున్న దుఃఖం, కష్టం అనే విస్తృత భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וְלַחֲצֵנוּ
  choice: మాపై ఉన్న అణచివేతను
  rationale: לַחַץ సూచించే బయటి శత్రుత్వపూర్వక ఒత్తిడి లేదా పీడనను స్పష్టంగా తెలియజేస్తుంది; ‘మా అణచివేత’ కంటే తెలుగులో సహజం.
theological_decisions:
- issue: దేవుని గురించి ‘నీ ముఖం’ అనే మానవరూప వర్ణన
  choice: ‘నీ ముఖాన్ని’ అనే మూల రూపకాన్ని నిలుపడం
  alternative: ‘నీ సన్నిధిని’
  rationale: మూలంలోని శరీర సంబంధమైన సంబంధభాష దేవుని అనుకూల శ్రద్ధ, సమీపత్వాన్ని సూచిస్తుంది. దానిని అమూర్తమైన పదంగా మార్చకుండా ఉంచడం కవితా బలాన్ని, విలాపంలోని ఉద్వేగాన్ని కాపాడుతుంది.
- issue: దేవుడు ‘మరచిపోవడం’ అనే విలాప వచనం
  choice: ‘మరచిపోతున్నావు’ అని నేరుగా అనువదించడం
  alternative: ‘పట్టించుకోవడం లేదు’
  rationale: కీర్తనకర్త దేవుని స్వభావంపై సిద్ధాంత ప్రకటన చేయడం కంటే అనుభూతిచెందిన పరిత్యాగాన్ని ధైర్యంగా వ్యక్తం చేస్తున్నాడు; మూలంలోని ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామూహిక విలాపానికి తగిన గౌరవప్రదమైన, నేరుగా ప్రశ్నించే శైలి. సమాంతరమైన రెండు క్రియల స్పష్టత కోసం తెలుగులో రెండవ భాగంలో ‘ఎందుకు’ పునరుక్తి చేయబడింది.
