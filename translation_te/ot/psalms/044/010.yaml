- source_word: לָמוֹ
  choice: తమ కోసం
  rationale: తమ స్వలాభం కోసం దోచుకోవడం అనే ప్రయోజనార్థక దత్తివు భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
