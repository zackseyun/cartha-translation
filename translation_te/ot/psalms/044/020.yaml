  text: אִם שָׁ֭כַחְנוּ שֵׁ֣ם אֱלֹהֵ֑י/נוּ וַ/נִּפְרֹ֥שׂ כַּ֝פֵּ֗י/נוּ לְ/אֵ֣ל זָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/020.yaml
  text: If we had forgotten the name of our God and spread out our hands to a foreign god—[a]
translation:
  language: te
  text: మా దేవుని నామాన్ని మేము మరచిపోయి, అన్య దేవుని వైపు మా చేతులు చాచి ఉంటే—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరాయి దేవుడు.’ హీబ్రూ విశేషణానికి ‘అన్యమైన,’ ‘పరాయైన,’ లేదా ‘వేరొక ప్రజకు చెందిన’ అనే అర్థాలు ఉండవచ్చు; ఇక్కడ అది ఇశ్రాయేలు నిబంధన ఆరాధనకు చెందని దేవతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: చాచివుంటే అనే షరతార్థ నిర్మాణంలో వ్యక్తీకరించబడింది
  rationale: హీబ్రూ షరతార్థ కణం ఊహాత్మక ప్రతివాదాన్ని ప్రవేశపెడుతుంది; తెలుగులో వాక్యాంతంలోని ‘ఉంటే’ సహజంగా మొత్తం సంయుక్త షరతును సూచిస్తుంది.
- source_word: שָׁכַחְנוּ
  choice: మేము మరచిపోయి
  rationale: పూర్తయిన క్రియను ఊహాత్మక షరతులో చూపుతుంది; తరువాతి క్రియతో కలిసి ‘చాచివుంటే’ వద్ద షరతు పూర్తవడం సహజ తెలుగు వాక్యనిర్మాణం.
- source_word: שֵׁם אֱלֹהֵינוּ
  choice: మన దేవుని నామాన్ని
  rationale: దేవుని గుర్తింపు, ఖ్యాతి, ఆరాధనతో ముడిపడిన ‘నామం’ అనే హీబ్రూ భావాన్ని గంభీరంగా నిలుపుతుంది; אֱלֹהֵינוּ యొక్క స్వామ్యార్థాన్ని ‘మన దేవుని’గా అందిస్తుంది.
- source_word: וַנִּפְרֹשׂ כַּפֵּינוּ
  choice: మా చేతులు చాచివుంటే
  rationale: ప్రార్థన లేదా మొరలో అరచేతులను విప్పి చాచే స్పష్టమైన భంగిమను ‘ఆరాధించివుంటే’ అని వ్యాఖ్యానించకుండా కాపాడుతుంది.
- source_word: לְאֵל זָר
  choice: అన్య దేవుని వైపు
  rationale: לְ యొక్క దిశార్థాన్ని ‘వైపు’ తెలియజేస్తుంది; זָר ఇశ్రాయేలు నిబంధన ఆరాధనకు చెందని దేవతను సూచిస్తుండగా ‘అన్య’ ఆ భావాన్ని సహజమైన బైబిలు తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: విగ్రహారాధనకు సంబంధించిన చేతులు చాచే భంగిమ
  choice: అన్య దేవుని వైపు మా చేతులు చాచివుంటే
  alternative: అన్య దేవుణ్ణి ఆరాధించివుంటే
  rationale: మూలపాఠం ఆరాధన లేదా ప్రార్థనను సూచించినా, దానిని నేరుగా ‘ఆరాధించుట’గా విప్పి చెప్పకుండా భౌతిక భంగిమను యథాతథంగా ఉంచుతుంది.
- issue: זָר అనే విశేషణం యొక్క పరిధి
  choice: అన్య దేవుడు
  alternative: పరాయి దేవుడు / విచిత్రమైన దేవుడు
  rationale: ఇక్కడ భావం కేవలం అసాధారణమైన దేవుడు కాదు, నిబంధన ఆరాధనకు చెందని ఇతర దేవత. ‘అన్య’ ఆ మతపరమైన భేదాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనా గౌరవప్రదమైన శైలి. ‘నామం’ మూలంలోని గంభీరతను నిలుపుతుంది; ‘చేతులు చాచుట’ ఆరాధనా భంగిమను అతివ్యాఖ్యానం చేయకుండా స్పష్టంగా చూపుతుంది. తెలుగు సహజ వాక్యక్రమం కోసం షరతార్థ సూచనను చివరి క్రియలో ఉంచాం.
