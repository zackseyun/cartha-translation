source:
  edition: WLC
  text: אַתָּ֤ה יָדְ/ךָ֡ גּוֹיִ֣ם ה֭וֹרַשְׁתָּ וַ/תִּטָּעֵ֑/ם תָּרַ֥ע לְ֝אֻמִּ֗ים וַֽ/תְּשַׁלְּחֵֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/002.yaml
  text: You[a], by your hand, drove out nations and planted them; you afflicted peoples and sent them out.
translation:
  language: te
  text: నీవు నీ చేతితో జాతులను వెళ్లగొట్టి, వారిని నాటావు; ప్రజలను బాధించి, వారిని పంపివేశావు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజలను బాధించి, వారిని విస్తరింపజేశావు.” ఈ పఠనంలో చివరి “వారిని” ఇశ్రాయేలు పూర్వికులను సూచిస్తుంది; ప్రజలను కాదు.
    reason: alternative_reading
lexical_decisions:
- source_word: יָדְךָ
  choice: నీ చేతితో
  rationale: దేవుని శక్తి, కార్యసాధకత్వం అనే సాధనార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, ‘చేయి’ అనే మూర్త రూపకాన్ని నిలుపుతుంది.
- source_word: גּוֹיִם
  choice: జనాలను
  rationale: ఈ చారిత్రక సందర్భంలో దేశంలో నివసించిన వివిధ జనసమూహాలను సూచిస్తుంది; తరువాతి మతపరమైన ‘అన్యజనులు’ అనే భావాన్ని అనవసరంగా రుద్దదు.
- source_word: הוֹרַשְׁתָּ
  choice: వెళ్లగొట్టి
  rationale: హిఫీల్ రూపం స్వాధీనాన్ని కోల్పోయేలా చేయడం లేదా దేశం నుంచి తరిమివేయడం అనే భావాన్నిస్తుంది; ‘వెళ్లగొట్టి’ స్పష్టమైన, సహజమైన తెలుగు.
- source_word: וַתִּטָּעֵם
  choice: వారిని నాటావు
  rationale: దేశంలో ఒక ప్రజను స్థిరపరచడాన్ని సూచించే వ్యవసాయ రూపకాన్ని కాపాడుతుంది. సందర్భానుసారం ‘వారు’ ఇశ్రాయేలు పూర్వికులు; మూలంలో పేరు స్పష్టంగా లేకపోవడంతో అనువాదంలోనూ చేర్చలేదు.
- source_word: תָּרַע
  choice: బాధించి
  rationale: רעע హిఫీల్‌లో హాని చేయడం, కీడు కలిగించడం, బాధించడం అనే పరిధి ఉంది. ‘బాధించి’ హాని స్వభావాన్ని అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
- source_word: לְאֻמִּים
  choice: ప్రజలను
  rationale: గోయిమ్‌తో అర్థసామ్యం ఉన్నా కవితా సమాంతరంలో పదవైవిధ్యాన్ని నిలుపుటకు ‘ప్రజలు’ అని ఇచ్చింది.
- source_word: וַתְּשַׁלְּחֵם
  choice: వారిని వెళ్లగొట్టావు
  rationale: שלח ప్రాథమికంగా ‘పంపు’ అయినా, ఇక్కడ బాధింపబడిన ప్రజలను దేశం నుంచి పంపివేయడం అనే సందర్భార్థం ఉంది. ‘వెళ్లగొట్టావు’ ఆ బలవంతపు పంపివేతను సహజంగా వ్యక్తం చేస్తుంది; చివరి సర్వనామం ఎవరిని సూచిస్తుందన్న సందిగ్ధతను పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: ‘వారిని నాటావు’, చివరి ‘వారిని’ అనే సర్వనామ ప్రత్యయాల సూచితులు
  choice: మొదటి ‘వారిని’ ఇశ్రాయేలు పూర్వికులను, చివరి ‘వారిని’ అక్కడి ప్రజలను సూచించినట్లు ప్రధాన పాఠంలో అనువదించడం
  alternative: రెండు సందర్భాల్లోనూ ఇశ్రాయేలు పూర్వికులనే సూచించినట్లు తీసుకుని, ‘ప్రజలను బాధించి, వారిని విస్తరింపజేశావు’ అని అనువదించడం
  rationale: విస్తృత సందర్భంలో దేవుడు జనాలను వెళ్లగొట్టి ఇశ్రాయేలును దేశంలో స్థాపించిన కార్యం స్మరించబడుతోంది. అందువల్ల ‘నాటావు’ ఇశ్రాయేలు పూర్వికులకు, బాధించిన తరువాతి చర్య అక్కడి ప్రజలకు వర్తించడం సమాంతర నిర్మాణానికి సరిపోతుంది. అయితే హెబ్రీ సర్వనామ ప్రత్యయాలు చర్చకు తావిస్తాయి కాబట్టి ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా వాక్యనిర్మాణం ఉపయోగించబడింది. ‘నాటావు’ అనే మూల రూపకం నిలుపబడింది. ప్రధాన పాఠంలోని సర్వనామ సూచితులు హెబ్రీ కవిత్వంలోని సంక్షిప్తతను అనుసరిస్తాయి; నిజమైన సందిగ్ధత పాదసూచికలో తెలియజేయబడింది.
