  to: నీవు నీ చేతితో జాతులను వెళ్లగొట్టి, వారిని నాటావు; ప్రజలను బాధించి, వారిని పంపివేశావు.[a]
  rationale: 'The revision preserves the compressed and disputed pronominal references of the Hebrew: the main text follows the contextual reading in which those planted are Israel’s ancestors and those sent away are the peoples, while the viable alternative referent for the final suffix remains in the footnote. It also restores lexical distinction between the two Hebrew terms for peoples and between the two verbs of removal/sending.'
