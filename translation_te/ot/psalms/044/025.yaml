source:
  edition: WLC
  text: כִּ֤י שָׁ֣חָה לֶ/עָפָ֣ר נַפְשֵׁ֑/נוּ דָּבְקָ֖ה לָ/אָ֣רֶץ בִּטְנֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/025.yaml
  text: For our soul has sunk down to the dust[b][a]; our belly clings to the earth.
translation:
  language: te
  text: ఎందుకంటే మా ప్రాణం ధూళిలోకి కుంగిపోయింది[b][a]; మా పొట్ట నేలకు అంటుకుపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మా జీవితం’ లేదా ‘మేమే.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ధూళిలోకి వంగిపోయింది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: సందర్భంలోని మొరపెట్టుకోలుకు ఈ వాక్యం కారణాన్ని తెలియజేస్తుంది; కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: שָׁחָה
  choice: కుంగిపోయింది
  rationale: వంగి అత్యంత దిగువకు చేరిన స్థితిని సూచిస్తుంది. ధూళివరకు అనే చిత్రంతో సహజంగా కలిసి, కేవలం శరీర భంగిమకు మాత్రమే భావాన్ని పరిమితం చేయదు.
- source_word: לֶעָפָר
  choice: ధూళివరకు
  rationale: దీనత, అవమానం, మరణశీలతలను సూచించే హెబ్రీ కవితా చిత్రాన్ని, దిగువకు చేరిన దిశాభావంతో సహా నిలుపుతుంది.
- source_word: נַפְשֵׁנוּ
  choice: మా ప్రాణం
  rationale: נֶפֶשׁ ప్రాణం, జీవితం, వ్యక్తి తానే అనే విస్తృత భావాలను కలిగి ఉంటుంది. 'మా ప్రాణం' తెలుగు బైబిలు కవితా భాషలో సహజంగా ఉండి, దానిని కేవలం నిరాకార ఆత్మగానీ శారీరక జీవితంగానీ పరిమితం చేయదు.
- source_word: דָּבְקָה
  choice: అంటుకుపోయింది
  rationale: నేలకు గట్టిగా అతుక్కొని ఉన్న సజీవ చిత్రాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לָאָרֶץ
  choice: నేలకు
  rationale: ధూళికి సమాంతరంగా, నేలపై పూర్తిగా పడి ఉన్న దృశ్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בִּטְנֵנוּ
  choice: మా పొట్ట
  rationale: మూలపదంలోని ప్రత్యక్ష శరీర చిత్రాన్ని నిలుపుతుంది. 'శరీరం' అనడం రూపకాన్ని అతిగా సులభీకరిస్తుంది; 'కడుపు' అంతర్గత అవయవ భావాన్ని ఎక్కువగా కలిగించవచ్చు.
theological_decisions:
- issue: נַפְשֵׁנוּ పదంలోని మానవస్వరూప సంబంధ భావం
  choice: మా ప్రాణం
  alternative: మా జీవితం; మేమే
  rationale: కీర్తనలోని విలాప కవిత్వంలో ఈ పదం ప్రాణం, జీవితం, స్వయం అనే భావపరిధిని కలిగి ఉంది. 'మా ప్రాణం' ఆ భావవిస్తృతిని, వేదాంతపరమైన ఉద్వేగాన్ని నిలుపుతూ ఒకే మానవస్వరూప సిద్ధాంతానికి దాన్ని కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా విలాప ధోరణి. 'ధూళి,' 'ప్రాణం,' 'పొట్ట,' 'నేల' అనే ప్రత్యక్ష చిత్రాలను నిలిపి, వాక్యాన్ని సాధారణ పాఠకులకు అర్థమయ్యేలా రూపొందించాం. పాదాల సమాంతరతను సెమీకోలన్‌తో చూపించాం.
