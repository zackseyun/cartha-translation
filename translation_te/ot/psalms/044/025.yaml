review_pass:
  verdict: revise
  source_fidelity: The causal particle and the two parallel images are retained. However, “ధూళివరకు” primarily marks an extent (‘as far as the dust’) and does not express the Hebrew downward/directional sense as clearly as “ధూళిలోకి.”
  naturalness: The diction is otherwise clear, modern, and suitably poetic. “ధూళిలోకి కుంగిపోయింది” is a more natural and vivid Telugu expression for the abasement image.
  terminology: “మా ప్రాణం” appropriately preserves the deliberately broad poetic sense of נַפְשֵׁנוּ, with viable alternatives supplied. “పొట్ట” and “నేలకు అంటుకుపోయింది” faithfully retain the concrete bodily image of בִּטְנֵנוּ and דָּבְקָה.
  issues:
  - severity: low
    issue: Directional sense of לֶעָפָר is weakened by “ధూళివరకు.”
    rationale: “వరకు” normally means ‘up to/as far as’ in Telugu. The Hebrew depicts the soul bowed or sunk down toward the dust; “ధూళిలోకి” more naturally conveys this descent without adding interpretation.
