translation:
  language: te
  text: దేవా, నీవే నా రాజు; యాకోబుకు విజయాలను[a] ఆజ్ఞాపించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాకోబుకు విడుదలలను ఆజ్ఞాపించు”; లేదా, “యాకోబుకు రక్షణ కార్యాలను నియమించు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה הוּא
  choice: నీవే
  rationale: రెండు సర్వనామాల వల్ల కలిగే ఉద్ఘాటనను ఆధునిక తెలుగులో సహజంగా ‘నీవే’ తెలియజేస్తుంది.
- source_word: מַלְכִּי
  choice: నా రాజువు
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న నామవాచకానికి నేరమైన అర్థం ‘నా రాజు’; దేవునికి ప్రత్యక్ష సంబోధనలో ‘నా రాజువు’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ఇక్కడి పదాన్ని ప్రత్యక్ష సంబోధనగా గ్రహించి తెలుగు సంబోధన రూపంలో అనువదించాం.
- source_word: צַוֵּה
  choice: ఆజ్ఞాపించు
  rationale: צוה పియేల్ ఆజ్ఞార్థక రూపంలోని ‘ఆజ్ఞాపించు, నిర్దేశించు’ అనే బలమైన భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: יְשׁוּעוֹת
  choice: విజయాలను
  rationale: ఈ యుద్ధసంబంధ కీర్తన సందర్భంలో బహువచన పదం సూచించే రక్షణ కార్యాలు శత్రువులపై విజయాలుగా ప్రత్యక్షమవుతున్నాయి; మూలంలోని విస్తృతమైన ‘విడుదలలు/రక్షణలు’ భావాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: יַעֲקֹב
  choice: యాకోబుకు
  rationale: మూలంలోని కవితాత్మక ప్రజానామం ‘యాకోబు’ను ‘ఇశ్రాయేలు’గా వివరణాత్మకంగా మార్చకుండా ఉంచి, సందర్భానుసార లబ్ధిదారుని తెలపడానికి చతుర్థీ విభక్తి వాడాం.
theological_decisions:
- issue: యుద్ధసంబంధ సందర్భంలో יְשׁוּעוֹת అర్థం
  choice: విజయాలను
  alternative: విడుదలలను; రక్షణ కార్యాలను
  rationale: చుట్టుపక్కల వచనాల్లో శత్రువులు, యుద్ధం ప్రస్తావనలో ఉన్నందున ‘విజయాలు’ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది. అయినా మూలపదంలోని విస్తృత రక్షణ భావాన్ని ప్రత్యామ్నాయంగా నమోదు చేశాం.
- issue: אֱלֹהִים యొక్క వాక్యనిర్మాణ పాత్ర
  choice: ప్రత్యక్ష సంబోధనగా ‘దేవా’
  alternative: ‘నా రాజైన దేవుడు’ అనే అన్వయం
  rationale: ‘నీవే నా రాజువు’ అనే ప్రార్థనా ప్రకటన తరువాత ఇది ప్రత్యక్ష సంబోధనగా చదవడం హెబ్రీ కవితా నిర్మాణానికి సహజంగా సరిపోతుంది; మరో అన్వయాన్ని బలవంతంగా ప్రవేశపెట్టదు.
- issue: దైవ ఆజ్ఞ మరియు విజయాల మధ్య రూపకం
  choice: ‘విజయాలను ఆజ్ఞాపించు’ అనే మూలరూపకాన్ని నిలుపడం
  alternative: ‘విజయాలు కలగాలని ఆజ్ఞాపించు’
  rationale: మూలంలో ఆజ్ఞాపించబడే ప్రత్యక్ష కర్మగా రక్షణలు/విజయాలు ఉన్నాయి. తెలుగు కవితా భాషలో అర్థమయ్యే ఈ బలమైన రూపకాన్ని వివరణాత్మకంగా విస్తరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన ప్రార్థనా-కవితా శైలిని వాడాం. ‘నీవే’ మూలంలోని ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది; ‘విజయాలను ఆజ్ఞాపించు’ మూలంలోని ధైర్యమైన కవితా రూపకాన్ని కాపాడుతుంది.
