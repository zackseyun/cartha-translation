translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ప్రత్యక్ష విలాప శైలిని వాడాం. మొదటి పాదంలోని ‘సంపద’ అనే స్పష్టమైన భావాన్ని నిలుపుతూ, రెండవ పాదాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో ఇచ్చాం.
