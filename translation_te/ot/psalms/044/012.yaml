  yaml_path: translation/ot/psalms/044/012.yaml
  text: You sell your people for no gain[a], and you have not increased by their price.
translation:
  language: te
  text: నీవు నీ ప్రజలను ఏ సంపదా పొందకుండా అమ్ముతున్నావు[a]; వారి వెలవల్ల నీవు లాభపడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీవు నీ ప్రజలను ఏమీ పొందకుండా అమ్మేశావు; వారి వెలతో నీ సంపదను పెంచుకోలేదు.’
    reason: హీబ్రూ అసంపూర్ణ క్రియను సందర్భానుసారం గతకాలంలోనూ అర్థం చేసుకోవచ్చు; అలాగే רבה అనే క్రియలోని ‘పెంచుకోవడం’ అనే రూపకాన్ని ఈ ప్రత్యామ్నాయం మరింత ప్రత్యక్షంగా నిలుపుతుంది.
lexical_decisions:
- source_word: תִּמְכֹּר
  choice: అమ్ముతున్నావు
  rationale: మכר క్రియ యొక్క ఖాల్ అసంపూర్ణ రూపం దేవుణ్ణి నేరుగా సంబోధిస్తుంది. కీర్తనలోని విలాపానికి ఉన్న తక్షణతను నిలుపుతూ వర్తమానంలో కొనసాగుతున్న చర్యగా అనువదించాం; సందర్భాన్ని బట్టి గతకాల అనువాదమూ సాధ్యమే.
- source_word: עַמְּךָ
  choice: నీ ప్రజలను
  rationale: עַם ఇక్కడ దేవునితో నిబంధన సంబంధంలో ఉన్న సమూహాన్ని సూచిస్తుంది. ‘నీ ప్రజలు’ అనే రూపం ఆ సంబంధ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: בְּלֹא הוֹן
  choice: ఏ సంపదా పొందకుండా
  rationale: הוֹן అంటే సంపద, ఆస్తి, విలువైన లాభం. అమ్మకం ద్వారా విలువైన ప్రతిఫలం రాలేదనే భావాన్ని తెలుగులో సహజంగా, అదే సమయంలో మూలంలోని స్పష్టమైన ‘సంపద’ భావాన్ని ఉంచుతూ తెలిపింది.
- source_word: רִבִּיתָ
  choice: లాభపడలేదు
  rationale: רבה పియేల్ రూపం ఇక్కడ పెంచుకోవడం లేదా అధికం చేసుకోవడం అనే భావంలో ఉంది. అమ్మకపు వెల ద్వారా ఏ పెరుగుదల లేదా ప్రయోజనం కలగలేదనే సందర్భార్థాన్ని ‘లాభపడలేదు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בִּמְחִירֵיהֶם
  choice: వారి వెలవల్ల
  rationale: מְחִיר అంటే కొనుగోలు లేదా అమ్మకపు వెల. ב ఉపసర్గ సాధనం లేదా మూలాన్ని సూచించగలదు; ‘వెలవల్ల’ ఆ సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
