  source_fidelity: The translation accurately represents the Hebrew poetic complaint. ‘అమ్ముతున్నావు’ appropriately renders the imperfect as a vivid present while the footnote responsibly preserves the viable past-time alternative. ‘నీ ప్రజలను’ retains the covenantal-relational force of עַמְּךָ. ‘ఏ సంపదా పొందకుండా’ reflects בְלֹא הוֹן, and ‘వారి వెలవల్ల నీవు లాభపడలేదు’ conveys the contextual sense of the Piel רבה together with בִּמְחִירֵיהֶם, without over-specifying the imagery.
