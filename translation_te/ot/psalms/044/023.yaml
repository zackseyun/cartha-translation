id: PSA.44.23
reference: Psalms 44:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ע֤וּרָ/ה לָ֖/מָּה תִישַׁ֥ן אֲדֹנָ֑/י הָ֝קִ֗יצָ/ה אַל תִּזְנַ֥ח לָ/נֶֽצַח׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/023.yaml
  text: Awake! Why do you sleep[a], Lord? Rouse yourself; do not reject us forever.
translation:
  language: te
  text: మేలుకో! ప్రభువా, నీవెందుకు నిద్రపోతున్నావు? మేల్కొను; మమ్మల్ని శాశ్వతంగా త్రోసివేయకు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “మమ్మల్ని ఎప్పటికీ విడిచిపెట్టకు.”'
    reason: זנח అనే పదానికి ‘త్రోసివేయడం’తో పాటు ‘విడిచిపెట్టడం’ అనే సందర్భానుకూల ప్రత్యామ్నాయ భావం ఉంది.
lexical_decisions:
- source_word: עוּרָה
  choice: మేలుకో!
  rationale: עור ధాతువు నుంచి వచ్చిన ఆజ్ఞార్థకం. దేవునికి చేసే ధైర్యమైన ప్రత్యక్ష పిలుపును సహజమైన, బలమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לָמָּה
  choice: ఎందుకు
  rationale: విలాపంలోని ప్రశ్నను పరిచయం చేసే సాధారణ ప్రశ్నార్థక క్రియావిశేషణం.
- source_word: תִישַׁן
  choice: నీవెందుకు నిద్రపోతున్నావు?
  rationale: ישן ధాతువు యొక్క అసంపూర్ణ క్రియారూపం; ఇక్కడ అలంకారిక ప్రశ్న. తెలుగు వర్తమాన ప్రగతిశీల రూపం కొనసాగుతున్న నిష్క్రియతను గురించిన ఫిర్యాదును సహజంగా వ్యక్తం చేస్తూ నిద్ర రూపకాన్ని నిలుపుతుంది.
- source_word: אֲדֹנָי
  choice: ప్రభువా
  rationale: దేవునికి ప్రత్యక్ష సంబోధనగా ఉన్న అధికార బిరుదు. సంబోధన రూపమైన ‘ప్రభువా’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: הָקִיצָה
  choice: మేల్కొను
  rationale: קיץ/יקץ ధాతువు నుంచి వచ్చిన మరొక మేల్కొలుపు ఆజ్ఞ. మొదటి ఆజ్ఞతో సమాంతరమైన తీవ్రతను నిలుపుతూ, స్వల్ప రూపభేదంతో కవితా ప్రవాహాన్ని అందిస్తుంది.
- source_word: אַל
  choice: -కు
  rationale: తదుపరి క్రియతో నిషేధాన్ని సూచించే అవ్యయం; తెలుగులో ‘త్రోసివేయకు’ అనే నిషేధ ఆజ్ఞారూపంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: תִּזְנַח
  choice: త్రోసివేయకు
  rationale: זנח అంటే తిరస్కరించడం, విడిచిపెట్టడం, త్రోసివేయడం. ‘త్రోసివేయకు’ మూలంలోని బలమైన సంబంధ విసర్జన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לָנֶצַח
  choice: శాశ్వతంగా
  rationale: దీర్ఘకాలికంగా లేదా ఎప్పటికీ అనే సాధారణ కాలవ్యాప్తి భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుడు నిద్రించడం, మేల్కొనడం అనే మానవరూప వర్ణన
  choice: కీర్తనలోని ప్రత్యక్ష నిద్ర–మేల్కొలుపు రూపకాన్ని అనువాదంలో యథాతథంగా నిలుపడం
  alternative: ‘ప్రభువా, నీవెందుకు నిష్క్రియగా కనిపిస్తున్నావు?’ అని రూపకాన్ని వివరణాత్మకంగా మృదువుచేయడం
  rationale: హీబ్రూ ప్రార్థన దేవునితో ధైర్యంగా నిద్ర–మేల్కొలుపు భాషలో మాట్లాడుతుంది. ఇది దేవుడు అక్షరార్థంగా నిద్రిస్తాడనే సిద్ధాంత ప్రకటన కాదు; విలాపంలోని అనుభూతి మరియు theological tensionను వ్యాఖ్యానంతో తొలగించకుండా నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవభరితమైనప్పటికీ ధైర్యమైన విలాప శైలి. రెండు మేల్కొలుపు ఆజ్ఞల సమాంతరతను ‘మేలుకో / మేల్కొను’తో నిలిపి, దేవుని నిద్ర రూపకాన్ని మృదువుచేయలేదు. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత ప్రత్యామ్నాయాన్ని సూచిస్తుంది.
