source:
  edition: WLC
  text: לַ/מְנַצֵּ֥חַ אֶֽל הַ/נְּחִיל֗וֹת מִזְמ֥וֹר לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/000.yaml
  text: 'For the choirmaster: according to the flutes[a]. A psalm of David[b].'
translation:
  language: te
  text: సంగీత నాయకునికి; వేణువుల ప్రకారం[a]. దావీదు కీర్తన[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గాలి వాద్యాల ప్రకారం.’ హీబ్రూ పదం ఖచ్చితమైన అర్థం తెలియని సాంకేతిక సంగీత సూచన కావచ్చు; సంప్రదాయంగా దాన్ని ‘నెహీలోత్’ అని లిప్యంతరీకరిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: ‘దావీదు కీర్తన’ అనే శీర్షిక దావీదు రచనను, ఆయనకు అంకితమైనదాన్ని, ఆయనతో అనుబంధాన్ని, లేదా దావీదు కీర్తనల సంపుటికి చెందినదాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకునికి
  rationale: కీర్తనల శీర్షికల్లో ఈ పదం సంగీత ప్రదర్శనను నడిపించే బాధ్యతగల వ్యక్తిని సూచిస్తుంది. ‘సంగీత నాయకుడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, కేవలం గానబృందానికే అర్థాన్ని పరిమితం చేయదు; לְ ఉపసర్గను ‘-కి’తో ప్రతిబింబించాం.
- source_word: אֶל
  choice: ప్రకారం
  rationale: సంగీత శీర్షికల్లో אֶל రాగం, ప్రదర్శన విధానం లేదా వాద్యాలను పరిచయం చేయవచ్చు. ‘ప్రకారం’ ఈ సాంకేతిక సంబంధాన్ని చూపిస్తూ ఒకే వివరణకు అతిగా కట్టుబడదు.
- source_word: הַנְּחִילוֹת
  choice: వేణువులు
  rationale: ఈ అరుదైన సంగీతపదం సాధారణంగా వేణువులు లేదా గాలి వాద్యాలకు సంబంధించినదిగా అర్థం చేసుకుంటారు. ప్రధాన పాఠ్యంలో సంభావ్య అర్థాన్ని ఇచ్చి, దాని అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: కానోనికల్ సందర్భంలో מִזְמוֹרకు స్థిరమైన, సహజమైన తెలుగు సమానం ‘కీర్తన’.
- source_word: לְדָוִד
  choice: దావీదు కీర్తన
  rationale: తెలుగులో సహజమైన శీర్షికా రూపం. ఇది రచయిత, అంకితం లేదా దావీదుతో సంబంధం అనే לְ ఉపసర్గలోని అవకాశాలను ప్రధాన పాఠ్యంలో బలవంతంగా పరిష్కరించదు; పాదసూచిక ఆ విస్తృతిని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: לְדָוִד అనే శీర్షికా పదబంధం నేరుగా దావీదే రచయిత అని నిర్ధారిస్తుందా?
  choice: దావీదు కీర్తన
  alternative: దావీదు రచించిన కీర్తన
  rationale: హీబ్రూ לְ రచయితృత్వాన్ని సూచించవచ్చు; అయితే అంకితం, అనుబంధం లేదా దావీదు సంపుటికి చెందినదనే భావాన్నీ కలిగి ఉండవచ్చు. అందువల్ల ప్రత్యక్ష రచయితృత్వాన్ని పాఠ్యంలో నిర్బంధించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన కీర్తన శీర్షికా శైలిని వాడాం. ‘వేణువు’ గౌరవప్రదంగా, విస్తృతంగా అర్థమయ్యే పదం; మూలంలోని సంగీత సాంకేతికతకు సంబంధించిన అనిశ్చితిని పాదసూచికలో కాపాడాం. ‘దావీదు కీర్తన’ తెలుగు పాఠకులకు సహజమైనదైనా, దాని భావవ్యాప్తిని పాదసూచికలో స్పష్టం చేశాం.
