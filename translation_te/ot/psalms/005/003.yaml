source:
  edition: WLC
  text: יְֽהוָ֗ה בֹּ֭קֶר תִּשְׁמַ֣ע קוֹלִ֑/י בֹּ֥קֶר אֶֽעֱרָךְ לְ֝/ךָ֗ וַ/אֲצַפֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/003.yaml
  text: Yahweh[a], in the morning you hear my voice[b]; in the morning I lay my request before you and watch expectantly.
translation:
  language: te
  text: 'యహ్వే, ఉదయాన నా స్వరం నీవు వింటావు;

    ఉదయాన నా విన్నపాన్ని నీ ముందు ఉంచి[a], ఆశతో ఎదురుచూస్తాను[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ కోసం క్రమంగా సిద్ధం చేస్తాను.’ హీబ్రూ క్రియకు ‘క్రమపరచడం’ లేదా ‘సిద్ధపరచడం’ అనే భావం ఉంది; ఇక్కడ కర్మ స్పష్టంగా చెప్పబడలేదు, అయితే ప్రార్థన లేదా విన్నపాన్ని సమర్పించడం ఉద్దేశమై ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘చూస్తూ ఉంటాను’ లేదా ‘నిరీక్షిస్తూ ఉంటాను.’ హీబ్రూ క్రియ ఆశతో చూడడం, నిరీక్షించడం, ఎదురుచూడడం అనే భావాలను కలిగి ఉండగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని ప్రాచుర్యమైన లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: בֹּקֶר
  choice: ఉదయాన
  rationale: కాలార్థక నామవాచకం క్రియావిశేషణంగా వాడబడింది. మూలంలోని పునరుక్తి ప్రాధాన్యాన్ని నిలుపుతూ రెండు చోట్లా స్పష్టంగా అనువదించాం.
- source_word: תִּשְׁמַע
  choice: నీవు వింటావు
  rationale: Qal imperfect రూపం భవిష్యత్తు భావాన్నిగానీ, నమ్మకంతో చెప్పే అలవాటైన కార్యాన్నిగానీ సూచించవచ్చు. ‘వింటావు’ ఈ రెండింటినీ సహజంగా మోయగలదు.
- source_word: קוֹלִי
  choice: నా స్వరం
  rationale: ప్రార్థనా సందర్భంలోనూ ‘స్వరం’ అనేది నేరుగా మూలార్థాన్ని ఇస్తుంది; ‘నా మొర’ అని అనడం మూలంలో లేని తీవ్రతను చేర్చవచ్చు.
- source_word: אֶעֱרָךְ
  choice: నా విన్నపాన్ని … ఉంచి
  rationale: ఈ క్రియకు ‘క్రమపరచు, సిద్ధపరచు, సమర్పించు’ అనే భావాలు ఉన్నాయి; కర్మ మూలంలో వ్యక్తంగా లేకపోయినా, సందర్భం ప్రార్థన లేదా విన్నపాన్ని దేవుని ముందు సమర్పించడాన్ని సూచిస్తుంది. తెలుగులో భావం సహజంగా ఉండేందుకు ‘నా విన్నపాన్ని’ చేర్చాం; ప్రత్యక్ష రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: לְךָ
  choice: నీ ముందు
  rationale: ఉపసర్గానికి అక్షరార్థంగా ‘నీకు/నీకోసం’ అని ఉన్నా, ערך క్రియతో కలిసినప్పుడు దేవుని సన్నిధిలో సమర్పించడం అనే భావాన్ని ‘నీ ముందు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַאֲצַפֶּה
  choice: ఆశతో ఎదురుచూస్తాను
  rationale: צפה చూడడం, కనిపెట్టడం, నిరీక్షించడం వంటి భావాలను కలిగి ఉంది. ప్రార్థన సమర్పించిన తరువాత ఆశతో ఫలితం కోసం చూడడాన్ని ఈ తెలుగు పదబంధం స్పష్టం చేస్తుంది; ‘చూస్తాను’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా
  rationale: వచనంలో వ్యక్తిగత దైవనామమే నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా, మూలనామాన్ని సూచించే ‘యహ్వే’గా లిప్యంతరీకరించాం.
- issue: దేవుడు స్వరం వినడం—వర్తమాన అలవాటా, భవిష్యత్ నిశ్చయమా
  choice: నీవు వింటావు
  alternative: నీవు వింటున్నావు
  rationale: హీబ్రూ imperfect రూపంలోని కాలభావం సందర్భానుసారంగా తెరిచి ఉంది. ‘వింటావు’ కీర్తనకర్త నమ్మకంతో ఆశించే భవిష్యత్ స్పందననూ, దేవుని అలవాటైన వినికిడినీ కఠినంగా విడదీయకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కవితా శైలిని ఉపయోగించాం. ‘ఉదయాన’ అనే పునరుక్తిని మూల కవితా నిర్మాణం కోసం నిలిపాం. ఇంగ్లీషు సంప్రదింపు పాఠ్యంలో పాదటిప్పణి గుర్తులు వాటి విషయాలకు అనుగుణమైన పదాల వద్ద లేనందున, తెలుగులో [a]ను אֶעֱרָךְ అనువాదం వద్ద, [b]ను וַאֲצַפֶּה అనువాదం వద్ద ఉంచాం.
