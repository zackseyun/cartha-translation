source:
  edition: WLC
  text: כִּֽי אַתָּה֮ תְּבָרֵ֪ךְ צַ֫דִּ֥יק יְהוָ֑ה כַּ֝/צִּנָּ֗ה רָצ֥וֹן תַּעְטְרֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/012.yaml
  text: For you bless the righteous[a], O Yahweh; like a shield, favor surrounds him.
translation:
  language: te
  text: ఎందుకంటే యహ్వే, నీవు నీతిమంతుణ్ణి ఆశీర్వదిస్తావు; నీ అనుగ్రహంతో అతణ్ణి డాలువలె చుట్టుముడతావు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ అనుగ్రహంతో అతనికి డాలువలె కిరీటం పెడతావు.” హీబ్రూ క్రియకు “కిరీటం పెట్టడం” లేదా “చుట్టుముట్టడం” అనే అర్థాలు రావచ్చు; డాలు ఉపమానం రక్షణగా చుట్టుముట్టే భావానికి అనుకూలంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ప్రార్థనకూ నమ్మకానికీ ఆధారాన్ని తెలియజేసే కారణార్థక సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: תְּבָרֵךְ
  choice: ఆశీర్వదిస్తావు
  rationale: ఇక్కడి అసంపూర్ణ క్రియ దేవుని సాధారణమైన, నిశ్చయమైన కార్యాన్ని సూచిస్తుంది; తెలుగు వర్తమాన రూపం ఆ నమ్మకాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: צַדִּיק
  choice: నీతిమంతుణ్ణి
  rationale: ఏకవచన విశేషణం నామవాచకంగా వాడబడి, నీతిమంతుడైన వ్యక్తిని ప్రాతినిధ్యార్థంగా సూచిస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: כַּצִּנָּה
  choice: డాలులా
  rationale: כְּ ఉపసర్గలోని ఉపమానార్థాన్ని నిలుపుతుంది; צִנָּה రక్షణనిచ్చే, సాధారణంగా పెద్ద డాలును సూచిస్తుంది.
- source_word: רָצוֹן
  choice: నీ అనుగ్రహంతో
  rationale: ఇక్కడ ఇది నీతిమంతునిపట్ల దేవుని ప్రసన్నతను సూచిస్తుంది; కర్తతో సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలిపేందుకు ‘నీ’ చేర్చబడింది.
- source_word: תַּעְטְרֶנּוּ
  choice: అతణ్ణి చుట్టుముడతావు
  rationale: క్రియకు ‘కిరీటంలా చుట్టడం’ లేదా ‘చుట్టుముట్టడం’ అనే భావాలు ఉండవచ్చు; డాలు అనే రక్షణాత్మక ఉపమానం వల్ల ‘చుట్టుముడతావు’ సందర్భానికి తగినది, అయితే ప్రత్యామ్నాయం పాదటిప్పణిలో నిలుపబడింది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠం దైవ నామాన్ని ప్రత్యక్షంగా ఉపయోగిస్తుంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా, మూల ఉచ్చారణకు దగ్గరగా ‘యహ్వే’ అని లిప్యంతరీకరించడం నామానికి ఉన్న ప్రత్యేకతను నిలుపుతుంది.
- issue: దేవుని అనుగ్రహం మరియు రక్షణాత్మక ప్రతిమ
  choice: నీ అనుగ్రహంతో అతణ్ణి డాలులా చుట్టుముడతావు
  alternative: అనుగ్రహం అతనికి డాలులా కిరీటమవుతుంది
  rationale: మూలంలోని వ్యాకరణపరమైన దైవకర్తను, వ్యక్తిపై అనుగ్రహం ద్వారా కలిగే రక్షణను నిలుపుతూ, ‘కిరీటముంచడం/చుట్టుముట్టడం’ అనే నిజమైన పదార్థ సందిగ్ధతను పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. ప్రత్యక్ష సంబోధనను ‘యహ్వే, నీవు’గా నిలిపి, కీర్తనలోని నమ్మకభరిత స్వరాన్ని వర్తమాన క్రియలతో వ్యక్తపరిచాం.
