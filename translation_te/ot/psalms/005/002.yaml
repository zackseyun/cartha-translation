  yaml_path: translation/ot/psalms/005/002.yaml
  text: Pay attention to the sound of my cry for help[a], my King and my God, for to you I pray.
translation:
  language: te
  text: నా సహాయం కోసం మొర ధ్వనిని ఆలకించు, నా రాజా, నా దేవా! ఎందుకంటే నేను నీకు ప్రార్థిస్తున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రార్థిస్తాను.” హెబ్రీ క్రియారూపం సందర్భానుసారం వర్తమాన, కొనసాగుతున్న లేదా భవిష్యత్ క్రియను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: ఆలకించు
  rationale: קשׁב ధాతువు శ్రద్ధగా వినమనే విజ్ఞప్తిని సూచిస్తుంది. ‘ఆలకించు’ ఆధునిక గౌరవప్రదమైన తెలుగులో ఆ శ్రద్ధాపూర్వక వినికిడి భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: לְקוֹל
  choice: ధ్వనిని
  rationale: קוֹל అంటే ‘స్వరం/ధ్వని.’ తరువాతి ‘నా సహాయ మొర’తో కలిసి ఉన్న హెబ్రీ నిర్మాణాన్ని తెలుగులో ‘నా సహాయ మొర ధ్వనిని’ అని దగ్గరగా నిలిపింది.
- source_word: שַׁוְעִי
  choice: నా సహాయ మొర
  rationale: שַׁוְעָה సాధారణ అరుపుకంటే ఆపదలో సహాయం కోరే మొరను సూచిస్తుంది; ‘సహాయ మొర’ ఆ ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מַלְכִּי
  choice: నా రాజా
  rationale: దేవునికి నేరుగా సంబోధనగా ఉన్న రాజ బిరుదును తెలుగు సంబోధనా రూపంలో నిలిపింది.
- source_word: וֵאלֹהָי
  choice: నా దేవా
  rationale: మొదటి పురుష ఏకవచన స్వామ్యప్రత్యయంతో ఉన్న దైవ బిరుదును నేర సంబోధనగా సహజమైన తెలుగులో అందించింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న విజ్ఞప్తికి కారణాన్ని పరిచయం చేస్తుంది; ‘ఎందుకంటే’ ఈ తార్కిక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֵלֶיךָ
  choice: నీకే
  rationale: ప్రార్థన దిశ దేవుని వైపేనని సూచించే אֵלֶיךָ ను ‘నీకే’ అని అందించడం ద్వారా లక్ష్యాన్ని సహజంగా, ఉద్ఘాటనతో వ్యక్తం చేసింది.
- source_word: אֶתְפַּלָּל
  choice: ప్రార్థిస్తున్నాను
  rationale: פלל హిత్పయేల్ మొదటి పురుష ఏకవచన అసంపూర్ణ రూపం సందర్భానుసారం వర్తమాన, కొనసాగుతున్న, అలవాటైన లేదా భవిష్యత్ క్రియను సూచించగలదు. ఇక్కడ జరుగుతున్న ప్రార్థన సందర్భంలో ‘ప్రార్థిస్తున్నాను’ సహజంగా సరిపోతుంది; ఇతర కాలసంభావ్యతను పాదటిప్పణి నిలుపుతుంది.
theological_decisions:
- issue: దేవునికి రాజ బిరుదుతో సంబోధన
  choice: నా రాజా, నా దేవా
  alternative: నా రాజు, నా దేవుడు
  rationale: హెబ్రీ పాఠం దేవునిని రాజుగానూ దేవునిగానూ నేరుగా సంబోధిస్తుంది. తెలుగు సంబోధనా రూపాలు రెండింటినీ ఎలాంటి అదనపు సిద్ధాంతార్థం చేర్చకుండా నిలుపుతాయి.
- issue: אֶתְפַּלָּל యొక్క కాలం/క్రియారూప దృష్టి
  choice: ప్రార్థిస్తున్నాను
  alternative: ప్రార్థిస్తాను
  rationale: హెబ్రీ అసంపూర్ణ క్రియారూపం వర్తమానంగా కొనసాగుతున్న లేదా భవిష్యత్ క్రియగా అర్థమవవచ్చు. తక్షణ విజ్ఞప్తి సందర్భంలో కొనసాగుతున్న వర్తమానం ప్రధాన పాఠ్యంలో సహజం; భవిష్యత్ ప్రత్యామ్నాయం పాదటిప్పణిలో భద్రపరచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ప్రార్థనకు తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘ఆలకించు’ కొంత సాహిత్య గౌరవాన్ని కలిగి ఉన్నా సాధారణ పాఠకులకు స్పష్టమే. సంబోధనలో ‘నా రాజా, నా దేవా’ సహజమైన తెలుగు రూపం.
