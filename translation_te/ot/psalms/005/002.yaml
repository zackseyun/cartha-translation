review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the imperative appeal, the cry for help, and the direct address, “my King, my God.” However, “నీకే” adds an exclusive force (“to you alone”) that is not expressed by Hebrew אֵלֶיךָ (“to you”). It should be “నీకు.” The imperfect אֶתְפַּלָּל is well rendered as an ongoing present, with the future possibility appropriately retained in the note.
  naturalness: “నా సహాయ మొర ధ్వనిని” is understandable but somewhat compressed. “నా సహాయం కోసం మొర ధ్వనిని” is more immediately clear while retaining the Hebrew’s explicit reference to the sound/voice of the cry. The vocatives and prayerful register are natural modern standard Telugu.
  terminology: “ఆలకించు,” “నా రాజా,” “నా దేవా,” and “ప్రార్థిస్తున్నాను” are suitable and respectful without adding doctrinal content. The footnote accurately represents the contextual flexibility of the Hebrew imperfect.
  issues:
  - severity: medium
    issue: Exclusive emphasis in “నీకే”
    rationale: The suffix -ఏ normally adds exclusivity or strong focus (“to you alone/indeed”). Hebrew אֵלֶיךָ has only the directional sense “to you,” with no explicit exclusive particle. “నీకు” preserves the source without added emphasis.
  - severity: low
    issue: Compressed phrase “నా సహాయ మొర ధ్వనిని”
    rationale: The phrase is intelligible, but “సహాయ మొర” is less idiomatic than an explicit expression such as “సహాయం కోసం మొర.” This revision improves clarity while retaining the cry-for-help sense and the explicit “sound” of קוֹל.
  revised_text: నా సహాయం కోసం మొర ధ్వనిని ఆలకించు, నా రాజా, నా దేవా! ఎందుకంటే నేను నీకు ప్రార్థిస్తున్నాను.[a]
