  text: יְהוָ֤ה נְחֵ֬/נִי בְ/צִדְקָתֶ֗/ךָ לְמַ֥עַן שׁוֹרְרָ֑/י הושר לְ/פָנַ֣/י דַּרְכֶּֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/008.yaml
  text: O Yahweh[a], lead me in your righteousness because of my enemies[b]; make your way straight before me.
translation:
  language: te
  text: యాహ్వే, నా శత్రువుల వల్ల[a] నీ నీతిలో నన్ను నడిపించు; నా ఎదుట నీ మార్గాన్ని సూటిగా చేయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నన్ను గమనిస్తూ పొంచి ఉన్నవారివల్ల’; హీబ్రూ పదం సాధారణ శత్రువులనే కాక శత్రుత్వంతో గమనిస్తున్నవారిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా ఎదుట నీ మార్గాన్ని సమంగా చేయి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని ప్రత్యేక నామమైన చతురక్షర నామాన్ని తెలుగు ఉచ్చారణకు తగిన విధంగా నేరుగా లిప్యంతరీకరించాం.
- source_word: נְחֵנִי
  choice: నన్ను నడిపించు
  rationale: నחה అనే క్రియలోని నడిపించడం, మార్గదర్శనం చేయడం అనే భావాన్ని ప్రార్థనా సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: בְצִדְקָתֶךָ
  choice: నీ నీతిలో
  rationale: בְ అనే ఉపసర్గ సూచించే పరిధి లేదా ప్రమాణ భావాన్ని నిలుపుతూ, దేవుని న్యాయమైన స్వభావానికి అనుగుణమైన నడిపింపును వ్యక్తం చేస్తుంది.
- source_word: לְמַעַן
  choice: నుబట్టి
  rationale: కీర్తనకర్త శత్రువుల వల్ల ఏర్పడిన పరిస్థితిని కారణంగా చూపించే సందర్భోచిత భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: שׁוֹרְרָי
  choice: నా శత్రువులు
  rationale: పదం ప్రధానంగా విరోధులను సూచిస్తుంది; పొంచి చూస్తున్నవారు లేదా శత్రుత్వంతో గమనించేవారు అనే ప్రత్యేక ఛాయను పాదటిప్పణిలో ఉంచాం.
- source_word: הושר
  choice: తిన్నగా చేయి
  rationale: ישר ధాతువు హిఫీల్ రూపంలోని సూటిగా, సమంగా లేదా అడ్డంకుల్లేకుండా చేయడం అనే మార్గరూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לְפָנַי
  choice: నా ఎదుట
  rationale: కీర్తనకర్త ముందర మార్గం సిద్ధంగా ఉండాలనే స్థలార్థక రూపకాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: דַּרְכֶּךָ
  choice: నీ మార్గం
  rationale: דרך పదంలోని దారి మరియు జీవనవిధానం అనే రెండు సాధ్యమైన ప్రతిధ్వనులను ‘మార్గం’ నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో ఉన్న దేవుని ప్రత్యేక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా అంగీకరించబడిన ‘యాహ్వే’ రూపంలో అందించాం.
- issue: צדקה పద భావం
  choice: నీతి
  alternative: న్యాయం
  rationale: ఇక్కడ దేవుని న్యాయతీర్పు మాత్రమే కాక ఆయన యథార్థమైన, నిటారైన స్వభావం మరియు ప్రవర్తన అనే విస్తృత భావం ఉద్దేశించబడినందున ‘నీతి’ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనకు తగిన గౌరవప్రదమైన కవితా శైలిని ఉపయోగించాం. మూలంలోని మార్గరూపకాన్ని, ‘నీ నీతిలో’ అనే నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపి, అస్పష్టమైన పదార్థాలకు పాదటిప్పణులు ఇచ్చాం.
