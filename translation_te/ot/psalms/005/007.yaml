language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲנִ֗י בְּ/רֹ֣ב חַ֭סְדְּ/ךָ אָב֣וֹא בֵיתֶ֑/ךָ אֶשְׁתַּחֲוֶ֥ה אֶל הֵֽיכַל קָ֝דְשְׁ/ךָ֗ בְּ/יִרְאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/007.yaml
  text: But as for me[a], by the abundance of your steadfast love I will enter your house[b]; I will bow down toward your holy temple in fear of you.
translation:
  language: te
  text: అయితే నేను నీ అపారమైన స్థిరమైన ప్రేమవల్ల[a] నీ గృహంలోకి ప్రవేశిస్తాను; నీ పట్ల భయంతో[b] నీ పరిశుద్ధ మందిరం వైపు వంగి నమస్కరిస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ సమృద్ధిగల నిబంధన నమ్మకత్వంవల్ల.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీ పట్ల భయభక్తులతో’ లేదా ‘నీ పట్ల విస్మయంతో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: అయితే నేను
  rationale: ముందు ప్రస్తావించిన దుష్టులకు కీర్తనకర్తను భిన్నంగా చూపించే సందర్భోచిత వ్యత్యాసాన్ని సంధి మరియు స్వతంత్ర సర్వనామం వ్యక్తం చేస్తున్నాయి.
- source_word: בְּרֹב חַסְדְּךָ
  choice: నీ విస్తారమైన స్థిరప్రేమనుబట్టి
  rationale: בְּרֹב దేవుని సమృద్ధిగల חֶסֶד కీర్తనకర్త ప్రవేశానికి ఆధారమని సూచిస్తుంది. ‘స్థిరప్రేమ’ ప్రేమతో పాటు దాని నమ్మకమైన, నిలకడగల స్వభావాన్ని కూడా కాపాడుతుంది.
- source_word: אָבוֹא בֵיתֶךָ
  choice: నీ గృహంలోకి ప్రవేశిస్తాను
  rationale: అసంపూర్ణ క్రియ ఇక్కడ సంకల్పం లేదా నిరీక్షణను తెలియజేస్తుంది. בֵיתֶךָ యొక్క సాధారణ అర్థమైన ‘నీ గృహం’ను నిలుపుతూ, తరువాతి הֵיכַל పదంతో ఉన్న భేదాన్ని కాపాడింది.
- source_word: אֶשְׁתַּחֲוֶה
  choice: వంగి నమస్కరిస్తాను
  rationale: ఈ క్రియలోని శరీరాన్ని వంచి ఆరాధించే దృశ్యాన్ని ‘ఆరాధిస్తాను’ అని మాత్రమే సాధారణీకరించకుండా స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֶל הֵיכַל קָדְשְׁךָ
  choice: నీ పరిశుద్ధ మందిరం వైపు
  rationale: אֶל యొక్క దిశార్థాన్ని ‘వైపు’ తెలియజేస్తుంది; הֵיכַל‌ను దేవుని ఆరాధనా నివాసాన్ని సూచించే ‘మందిరం’గా అనువదించింది.
- source_word: בְּיִרְאָתֶךָ
  choice: నీ పట్ల భయంతో
  rationale: יִרְאָהలోని భయం, భక్తి, విస్మయం అనే అర్థపరిధిని అతిగా మృదువుచేయకుండా, హెబ్రీ పదానికి సన్నిహితమైన ప్రధాన భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఆరాధనా సందర్భంలో חֶסֶד అనువాదం
  choice: స్థిరప్రేమ
  alternative: నిబంధనపట్ల నీ నమ్మకత్వం; కరుణ
  rationale: దేవుని సమృద్ధిగల, నమ్మకమైన ప్రేమే ఆయన గృహంలోకి ప్రవేశించడానికి ఆధారమని వాక్యం చెబుతుంది. ‘స్థిరప్రేమ’ దానిని కేవలం కరుణకు పరిమితం చేయకుండా, నిబంధన సంబంధిత భావాన్ని అతిగా స్పష్టీకరించకుండా ఉంచుతుంది.
- issue: దేవుని ఎదుట יִרְאָה యొక్క భావం
  choice: నీ పట్ల భయంతో
  alternative: నీ పట్ల భయభక్తులతో; నీ పట్ల విస్మయంతో
  rationale: ఈ పదం భయం మరియు భక్తిపూర్వక విస్మయం మధ్య ఉన్న ఉద్దేశపూర్వక భావ ఉద్రిక్తతను కలిగి ఉంది. ప్రధాన పాఠం ఆ బరువును నిలుపుతుంది; పాదసూచిక ఇతర సహజ భావాలను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘గృహం’ మరియు ‘మందిరం’ అనే వేర్వేరు పదాలతో בַּיִת మరియు הֵיכַל మధ్యనున్న మూలపాఠ భేదం నిలుపబడింది. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల వెంట ఉంచాం.
