  to: అయితే నేను నీ అపారమైన స్థిరమైన ప్రేమవల్ల[a] నీ గృహంలోకి ప్రవేశిస్తాను; నీ పట్ల భయంతో[b] నీ పరిశుద్ధ మందిరం వైపు వంగి నమస్కరిస్తాను.
