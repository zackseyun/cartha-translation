source:
  edition: WLC
  text: אֲמָרַ֖/י הַאֲזִ֥ינָ/ה יְהוָ֗ה בִּ֣ינָ/ה הֲגִֽיגִ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/001.yaml
  text: Give ear to my words[a], O Yahweh; understand my groaning.
translation:
  language: te
  text: 'యాహ్వే, నా మాటలు ఆలకించు;

    నా మూలుగును గ్రహించు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ధ్యానాన్ని” లేదా “నా మెల్లని పలుకును.” హీబ్రూ పదం అంతరంగ ఆలోచనను లేదా మెల్లగా వెలువడే పలుకును సూచించవచ్చు; ఈ విలాప సందర్భంలో దాన్ని “మూలుగు” అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲמָרַי
  choice: నా మాటలు
  rationale: אמר పదానికి చెందిన బహువచన రూపం, ప్రథమ పురుష ఏకవచన ప్రత్యయంతో ఉంది; కీర్తనకర్త పలికే మాటలను నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: הַאֲזִינָה
  choice: ఆలకించు
  rationale: אזן ధాతువు శ్రద్ధగా చెవియొగ్గి వినాలనే ప్రార్థనాత్మక విజ్ఞప్తిని సూచిస్తుంది; ఆధునిక గౌరవప్రదమైన తెలుగులో ‘ఆలకించు’ ఆ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలో దేవుని వ్యక్తిగత నామమైన చతురక్షర నామం నేరుగా ఉంది; తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంతో దానిని బిరుదుగా మార్చకుండా ఉంచాం.
- source_word: בִּינָה
  choice: గ్రహించు
  rationale: בין ధాతువు కేవలం వినడం కాక అర్థం చేసుకొని గమనించడాన్ని సూచిస్తుంది; ‘గ్రహించు’ ఆ జ్ఞానాత్మక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: הֲגִיגִי
  choice: నా మూలుగు
  rationale: הגיג అంతరంగ ధ్యానం, మెల్లని పలుకు లేదా గొణుగును సూచించగలదు. విలాప సందర్భంలో ‘మూలుగు’ అంతరంగ వేదనతో వెలువడే మెల్లని శబ్దాన్ని తెలియజేస్తుంది; ఇతర సాధ్యార్థాలను పాదటిప్పణిలో నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠం బిరుదును కాక దేవుని వ్యక్తిగత నామాన్ని వాడుతుంది. తెలుగు పాఠకులకు సుపరిచితమైన నామరూపాన్ని ఉపయోగించడం ద్వారా ఆ భేదాన్ని నిలిపాం; ‘ప్రభువు’ అని మార్చలేదు.
- issue: הֲגִיגִי భావం
  choice: నా మూలుగు
  alternative: నా ధ్యానం; నా గొణుగు
  rationale: పదం ఉద్దేశపూర్వకంగా విస్తృతార్థాన్ని కలిగి ఉంది. విలాప సందర్భం ‘మూలుగు’కు మద్దతిచ్చినా, ప్రశాంత ధ్యానం లేదా మెల్లని పలుకు అనే అవకాశాన్ని పూర్తిగా తొలగించదు; అందుకే పాదటిప్పణిలో ప్రత్యామ్నాయాలను ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనకు తగిన గౌరవప్రదమైన కాని సులభమైన శైలి. హీబ్రూ సమాంతర నిర్మాణాన్ని రెండు పాదాలుగా నిలిపాం. ‘ఆలకించు’ శ్రద్ధగా వినే భావాన్ని, ‘గ్రహించు’ మాటలకు అతీతమైన అంతరంగ వేదనను అర్థం చేసుకునే విజ్ఞప్తిని వ్యక్తం చేస్తాయి.
