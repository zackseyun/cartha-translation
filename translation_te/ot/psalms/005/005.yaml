source:
  edition: WLC
  text: לֹֽא יִתְיַצְּב֣וּ הֽ֭וֹלְלִים לְ/נֶ֣גֶד עֵינֶ֑י/ךָ שָׂ֝נֵ֗אתָ כָּל פֹּ֥עֲלֵי אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/005.yaml
  text: The boastful will not stand before your eyes[b][a]; you hate all workers of wickedness.
translation:
  language: te
  text: 'ప్రగల్భాలు పలికేవారు నీ కళ్ల ఎదుట నిలువలేరు[a];

    దుర్మార్గం చేసేవారందరినీ నీవు ద్వేషిస్తావు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గర్విష్ఠులు,’ ‘మూర్ఖులు,’ లేదా ‘ధిక్కారులు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘చెడుచేసేవారందరినీ,’ ‘దుష్టకార్యాలు చేసేవారందరినీ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצְּבוּ
  choice: నిలువలేరు
  rationale: హిత్పయేల్ రూపం నిలబడడం లేదా తన స్థానాన్ని తీసుకోవడం అనే భావాన్ని ఇస్తుంది. దేవుని సన్నిధిలో నిలిచి ఉండలేరనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הוֹלְלִים
  choice: ప్రగల్భాలు పలికేవారు
  rationale: ఈ రూపం కేవలం బుద్ధిహీనులను కాక, తమను తాము గొప్పగా చెప్పుకునే గర్విష్ఠులను సూచిస్తుంది. సందర్భంలోని నైతిక భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: לְנֶגֶד עֵינֶיךָ
  choice: నీ కళ్ల ఎదుట
  rationale: హీబ్రూ పదబంధంలోని స్పష్టమైన కళ్ల రూపకాన్ని నిలుపుతూ, దేవుని దృష్టిలో లేదా సన్నిధిలో అనే భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: שָׂנֵאתָ
  choice: నీవు ద్వేషిస్తావు
  rationale: హీబ్రూ క్రియ నేరుగా ద్వేషాన్ని తెలియజేస్తుంది; దాని తీవ్రతను వ్యతిరేకిస్తావు లేదా తిరస్కరిస్తావు అని తగ్గించలేదు.
- source_word: פֹּעֲלֵי אָוֶן
  choice: దుర్మార్గం చేసేవారందరినీ
  rationale: కర్తృవాచక రూపంలోని క్రియాశీల భావాన్ని 'చేసేవారు' నిలుపుతుంది; אָוֶן యొక్క నైతిక దుష్టత్వ భావాన్ని 'దుర్మార్గం' సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుడు దుష్టులను ద్వేషిస్తాడనే ప్రత్యక్ష వాక్యం
  choice: దుర్మార్గం చేసేవారందరినీ నీవు ద్వేషిస్తావు
  alternative: దుర్మార్గం చేసేవారందరినీ నీవు వ్యతిరేకిస్తావు/తిరస్కరిస్తావు
  rationale: שָׂנֵאתָ అనే హీబ్రూ క్రియ స్పష్టంగా 'ద్వేషించు' అని అర్థమిస్తుంది. వాక్యంలోని గంభీరమైన దైవశాస్త్రీయ ఉద్రిక్తతను సిద్ధాంతపరంగా మృదువుచేయకుండా అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి. హీబ్రూ సమాంతర నిర్మాణాన్ని రెండు పాదాలుగా ఉంచి, ‘నీ కళ్ల ఎదుట’ అనే స్పష్టమైన రూపకాన్నీ ‘ద్వేషిస్తావు’ అనే తీవ్ర పదాన్నీ నిలిపాం.
