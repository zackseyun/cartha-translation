id: PSA.5.10
reference: Psalms 5:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הַֽאֲשִׁימֵ֨/ם אֱֽלֹהִ֗ים יִפְּלוּ֮ מִֽ/מֹּעֲצ֪וֹתֵ֫י/הֶ֥ם בְּ/רֹ֣ב פִּ֭שְׁעֵי/הֶם הַדִּיחֵ֑/מוֹ כִּי מָ֥רוּ בָֽ/ךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/010.yaml
  text: Declare them guilty[a], O God; let them fall by their own counsels. Drive them away because of their many transgressions[b], for they have rebelled against you.
translation:
  language: te
  text: దేవా, వారిని దోషులుగా తీర్చు; వారి సొంత యోచనల వల్ల వారు కూలిపోవాలి.[a] వారి అనేక అపరాధాల కారణంగా వారిని తరిమివేయి,[b] ఎందుకంటే వారు నీకు విరోధంగా తిరుగుబాటు చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు తమ యోచనల ద్వారా కూలిపోవాలి,” అంటే తమ సొంత ప్రణాళికలవల్ల నాశనమవాలి.
    reason: lexical_alternative
  - marker: b
    text: “తరిమివేయి” అనే మాటను “బయటికి తోసివేయి” లేదా “వెలివేయి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲשִׁימֵם
  choice: వారిని దోషులుగా తీర్చు
  rationale: אשם హిఫీల్ ఆజ్ఞారూపం న్యాయపరంగా వారిని దోషులని నిర్ధారించమనే విన్నపాన్ని వ్యక్తం చేస్తుంది. ఈ ఎంపిక శిక్ష స్వరూపాన్ని అదనంగా నిర్దేశించకుండా ఆ న్యాయార్థాన్ని నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ప్రార్థనలో ప్రత్యక్ష సంబోధన; ఆధునిక తెలుగు కవితా వాక్యంలో సహజమైన సంబోధన రూపం.
- source_word: יִפְּלוּ
  choice: వారు పడిపోవాలి
  rationale: ఈ అసంపూర్ణ క్రియ ఇక్కడ ఆజ్ఞార్థక ఆకాంక్షను వ్యక్తం చేస్తుంది; కేవలం భవిష్యద్వాణిగా కాక దేవునికి చేసిన విన్నపంగా అనువదించబడింది.
- source_word: מִמֹּעֲצוֹתֵיהֶם
  choice: వారి సొంత పన్నాగాల వల్లనే
  rationale: מוֹעֵצוֹת యోచనలు లేదా పన్నాగాలను సూచిస్తుంది. מן కారణం/సాధనం లేదా దూరమవడం అనే భావాలకు వీలిస్తుంది; ప్రధాన పాఠంలో సందర్భానుకూలమైన కారణార్థాన్ని తీసుకుని, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: בְּרֹב פִּשְׁעֵיהֶם
  choice: వారి అనేక అపరాధాల కారణంగా
  rationale: בְּ־רֹב ఇక్కడ కారణార్థకంగా ఉంది. פשׁע నేరపూరిత అతిక్రమణతో పాటు తిరుగుబాటు భావాన్ని కలిగి ఉంది; 'అపరాధాలు' నైతిక బరువును సహజ తెలుగులో నిలుపుతుంది.
- source_word: הַדִּיחֵמוֹ
  choice: వారిని వెళ్లగొట్టు
  rationale: נדח హిఫీల్ రూపం దూరంగా తరిమివేయడం లేదా వెలివేయడం అనే బలమైన భావాన్ని ఇస్తుంది; 'వెళ్లగొట్టు' స్పష్టంగా, సహజంగా ఉంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి విన్నపాలకు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: מָרוּ בָךְ
  choice: వారు నీకు విరోధంగా తిరుగుబాటు చేశారు
  rationale: מרה తో בְ దేవునికి వ్యతిరేకమైన తిరుగుబాటును సూచిస్తుంది; 'నీకు విరోధంగా' సంబంధాన్ని స్పష్టం చేస్తూ మూలార్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: శాపోక్తి ప్రార్థనలో తీర్పు కోసం ప్రత్యక్ష విన్నపం
  choice: ఆజ్ఞారూపాలు, ఆకాంక్షార్థక క్రియను తీర్పు కోసం దేవునికి చేసిన ప్రత్యక్ష విన్నపాలుగానే నిలుపడం
  alternative: వాటిని కేవలం భవిష్యత్తు గురించి చెప్పే వాక్యాలుగా అనువదించడం
  rationale: హీబ్రూలో దేవునిని ఉద్దేశించిన ఆజ్ఞారూపాలు మరియు ఆకాంక్షార్థక అసంపూర్ణ క్రియ ఉన్నాయి. వాటిని మృదువుపరచకుండా ఉంచడం మూలపాఠంలోని ప్రార్థనా స్వరాన్ని, theological tensionను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రార్థనా-కవితా శైలి. సాధారణ పాఠకులకు అర్థమయ్యే పదాలను వాడుతూ న్యాయపరమైన భావాన్ని, కఠినమైన తీర్పు విన్నపాన్ని తగ్గించలేదు. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
