  source_fidelity: 'ప్రధాన భావం హీబ్రూ పాఠానికి నమ్మకంగా ఉంది: దేవునికి నేరుగా చేసిన తీర్పు-విన్నపాలు, వారి స్వీయ యోచనలతో కలిగే పతనం, అనేక అతిక్రమణల కారణంగా వారిని తొలగించమనే విన్నపం, దేవునికి వ్యతిరేక తిరుగుబాటు అన్నీ నిలిచాయి. అయితే "పన్నాగాలు" మూలంలోని మోఅత్సోత్ (‘యోచనలు/ప్రణాళికలు’) కంటే అనవసరంగా కపటార్థాన్ని నిర్దేశిస్తుంది; "తరిమివేయి" హిఫీల్ נדח యొక్క బలమైన ‘దూరం చేయి/బహిష్కరించు’ భావాన్ని మరింత స్పష్టంగా ఇస్తుంది.'
