  text: For you are not a God who delights in wickedness[a]; evil may not dwell with you.
translation:
  language: te
  text: ఎందుకంటే నీవు దుష్టత్వంలో ఆనందించే దేవుడవు కావు; చెడు నీతో నివసించదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చెడ్డవాడు నీతో నివసించడు’; లేదా, ‘దుర్మార్గుడు నీతో నివసించడు.’
    reason: రָע అనే హీబ్రూ పదాన్ని భావవాచకంగా ‘చెడు’ అనీ, వ్యక్తివాచకంగా ‘చెడ్డవాడు/దుర్మార్గుడు’ అనీ అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి విన్నపానికి కారణాన్ని పరిచయం చేస్తుంది; తెలుగు వాక్యప్రవాహంలో ‘ఎందుకంటే’ సహజంగా ఉంది.
- source_word: אֵל
  choice: దేవుడు
  rationale: నేరుగా సంబోధించబడుతున్న నిజమైన దేవుణ్ణి సూచిస్తుంది.
- source_word: חָפֵץ
  choice: ఆనందించే
  rationale: కేవలం కోరుకోవడం కాక, దానిలో ఇష్టానందం పొందడం అనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: רֶשַׁע
  choice: దుష్టత్వం
  rationale: నైతిక దుర్మార్గతను సూచించే భావవాచక నామవాచకంగా మూలపాఠ భావాన్ని నిలుపుతుంది.
- source_word: יְגֻרְךָ
  choice: నీతో నివసించలేదు
  rationale: גור అనే ధాతువు అతిథిగా బసచేయడం లేదా నివసించడం అనే భావాన్ని ఇస్తుంది; ఇక్కడ దేవుని సన్నిధిలో చెడుకు నివాసం లేదనే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: רָע
  choice: చెడు
  rationale: ఇది భావవాచకంగా ‘చెడు’ అనీ, వ్యక్తివాచకంగా ‘చెడ్డవాడు’ అనీ అర్థమివ్వగలదు. ‘దుష్టత్వం’తో ఉన్న సమాంతరత కారణంగా ప్రధాన పాఠంలో భావవాచక అర్థాన్ని ఎంచుకున్నాం.
theological_decisions:
- issue: רָע ను భావవాచకంగా ‘చెడు’ అని అనువదించాలా, వ్యక్తివాచకంగా ‘చెడ్డవాడు/దుష్కార్యాలు చేసేవాడు’ అని అనువదించాలా
  choice: చెడు
  alternative: చెడ్డవాడు నీతో నివసించడు / దుష్కార్యాలు చేసేవాడు నీతో నివసించడు
  rationale: హీబ్రూ పదం రెండు అర్థాలకూ అవకాశం ఇస్తుంది. ఈ వచనంలోని ‘దుష్టత్వం’తో సమాంతరత భావవాచక పఠనానికి మద్దతిస్తుంది; తరువాతి వచనం దుష్కార్యాలు చేసేవారిని స్పష్టంగా ప్రస్తావిస్తుంది. ప్రత్యామ్నాయ వ్యక్తివాచక పఠనాన్ని పాదటిప్పణిలో ఉంచడం ద్వారా అసలు అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా కీర్తనకు తగిన గౌరవప్రదమైన శైలిని పాటించాం. ‘నీతో నివసించలేదు’ అనే రూపం దైవసన్నిధిలో చెడుకు స్థానం లేదనే నిషేధాత్మక భావాన్ని సహజంగా తెలియజేస్తుంది.
