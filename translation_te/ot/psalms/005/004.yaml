  source_fidelity: 'మొదటి అర్థభాగం హీబ్రూ כִּי־לֹא אֵל חָפֵץ רֶשַׁע אַתָּה ను నమ్మకంగా తెలియజేస్తుంది: దేవుడు దుష్టత్వంలో ఆనందించడు. రెండవ భాగంలో יְגֻרְךָ యొక్క సందర్భానుగుణ నిషేధ/అసంభవ భావాన్ని వర్తమాన-సామాన్య రూపంలో ఇవ్వాలి. ముసాయిదాలోని ‘నివసించలేదు’ భూతకాలాన్ని సూచిస్తుంది; మూలపాఠానికి అది సరిపోదు.'
