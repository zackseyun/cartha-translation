id: PSA.5.9
reference: Psalms 5:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י אֵ֪ין בְּ/פִ֡י/הוּ נְכוֹנָה֮ קִרְבָּ֪/ם הַ֫וּ֥וֹת קֶֽבֶר פָּת֥וּחַ גְּרוֹנָ֑/ם לְ֝שׁוֹנָ֗/ם יַחֲלִֽיקוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/009.yaml
  text: For there is nothing trustworthy in their mouth[a]; their inward part is destruction. Their throat is an open grave[c][b]; with their tongue they flatter.
translation:
  language: te
  text: 'ఎందుకంటే వారి నోటిలో నమ్మదగినదేదీ లేదు[a];


    వారి అంతరంగం వినాశనమే[b].


    వారి గొంతు తెరచిన సమాధి;


    వారి నాలుకతో వారు ముఖస్తుతి చేస్తారు[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలరూపాన్ని మరింత కచ్చితంగా ఏకవచనంలో ఉంచితే, ‘అతని నోటిలో నమ్మదగినదేదీ లేదు’ అని అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘వారి అంతరంగం నాశనమే’; లేదా ‘వారి హృదయం వినాశనమే.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘వారి నాలుకతో వారు నునుపుగా మాట్లాడుతారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: మునుపటి విన్నపానికి ఈ వాక్యం కారణాన్ని తెలియజేస్తోంది; తెలుగు సందర్భంలో కారణసంబంధాన్ని సహజంగా చూపిస్తుంది.
- source_word: אֵין בְּפִיהוּ נְכוֹנָה
  choice: వారి నోటిలో నమ్మదగినదేదీ లేదు
  rationale: נְכוֹנָה ఇక్కడ స్థిరమైనది, విశ్వసనీయమైనది అనే భావాన్ని కలిగి ఉంది. మోసపూరితమైన మాటల సందర్భంలో ‘నమ్మదగినదేదీ’ అనే అనువాదం సంపూర్ణ నిరాకరణను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בְּפִיהוּ
  choice: వారి నోటిలో
  rationale: రూపం అక్షరార్థంగా ఏకవచన సూచన కలిగి ఉన్నప్పటికీ, తరువాతి ప్రత్యయాలన్నీ బహువచనంలో ఉండి దుష్టులను సమూహంగా సూచిస్తున్నాయి. ప్రధాన పాఠంలో సందర్భానుగుణమైన బహువచనం వాడి, ఏకవచన రూపాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: קִרְבָּם
  choice: వారి అంతరంగం
  rationale: వారి లోపలి స్వభావం లేదా అంతరంగ జీవిని సూచించే హీబ్రూ రూపకాన్ని, దానిని ప్రత్యేకంగా ‘హృదయం’కు పరిమితం చేయకుండా తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: הַוּוֹת
  choice: వినాశనమే
  rationale: ఈ బహువచన నామవాచకం వినాశకరమైన ఉద్దేశాలు, విపత్తు లేదా నాశనాన్ని సూచించగలదు. విధేయస్థానంలోని బలాన్ని తెలుగులో ఏకవచన భావనామంగా వ్యక్తం చేశాం.
- source_word: קֶבֶר פָּתוּחַ
  choice: తెరచిన సమాధి
  rationale: ప్రాణాంతకమైన, చెడిపోయిన మాటలను చిత్రించే స్పష్టమైన హీబ్రూ రూపకాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: גְּרוֹנָם
  choice: వారి గొంతు
  rationale: మాటల రూపక సందర్భంలో శరీర భాగాన్ని సహజంగా, నేరుగా సూచిస్తుంది.
- source_word: לְשׁוֹנָם יַחֲלִיקוּן
  choice: తమ నాలుకతో వారు ముఖస్తుతి చేస్తారు
  rationale: חלק హిఫీల్ రూపం మాటలను నునుపుగా చేయడం, తద్వారా పొగడి మోసగించడం అనే భావాన్ని ఇక్కడ ఇస్తుంది. ‘ముఖస్తుతి చేస్తారు’ సందర్భార్థాన్ని సంక్షిప్తంగా అందిస్తుంది; అక్షరార్థానికి దగ్గరైన ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంది.
theological_decisions:
- issue: קִרְבָּם లోని మానవ అంతరంగ రూపకం
  choice: వారి అంతరంగం
  alternative: వారి హృదయం
  rationale: ఈ వచనం లోపలి చెడును దాని మాటల ఫలితంతో అనుసంధానిస్తుంది. ‘అంతరంగం’ మూలంలోని విస్తృత భావాన్ని నిలుపుతూ, దాన్ని ఒక నిర్దిష్ట అంతఃకరణ సామర్థ్యమైన ‘హృదయం’కు పరిమితం చేయదు.
- issue: בְּפִיהוּ లోని వచన సంఖ్య
  choice: వారి నోటిలో
  alternative: అతని నోటిలో
  rationale: మూలరూపంలో ఏకవచన ప్రత్యయం ఉన్నప్పటికీ, వచనంలోని తరువాతి ప్రత్యయాలు బహువచనంలో ఉన్నాయి. దుష్టుల సమూహ సూచనను ప్రధాన పాఠంలో సహజంగా వ్యక్తం చేసి, మూలంలోని ఏకవచనాన్ని పాదటిప్పణిలో సంరక్షించాం.
- issue: הַוּוֹת యొక్క బహువచన, వినాశకర భావం
  choice: వినాశనమే
  alternative: వినాశకరమైన పన్నాగాలే
  rationale: మూలపదం విపత్తులు లేదా వినాశకర పన్నాగాలను సూచించగలదు. ప్రధాన పాఠం దాని విస్తృతమైన నాశన భావాన్ని ఉంచుతుంది; పాదటిప్పణి మరో సాధ్యమైన భావాన్ని తెలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తన కవిత్వానికి తగిన గంభీరతను నిలిపాం. ‘తెరచిన సమాధి’ అనే బలమైన మూలరూపకాన్ని మార్చలేదు. అర్థస్పష్టత కోసం పాదవిభజన, విరామచిహ్నాలు ఉపయోగించాం; మూలంలోని సంఖ్యా భేదం మరియు ప్రధాన పదార్థ ప్రత్యామ్నాయాలను పాదటిప్పణుల్లో సంరక్షించాం.
