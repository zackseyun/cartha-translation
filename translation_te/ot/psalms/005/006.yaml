  text: תְּאַבֵּד֮ דֹּבְרֵ֪י כָ֫זָ֥ב אִישׁ דָּמִ֥ים וּ/מִרְמָ֗ה יְתָ֘עֵ֥ב יְהוָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/006.yaml
  text: You destroy those who speak lies[b][a]; Yahweh abhors a man of bloodshed and deceit.
translation:
  language: te
  text: అబద్ధాలు పలికేవారిని నీవు నాశనం చేస్తావు[a]; రక్తపాతం, మోసం చేసే మనిషిని[b] యాహ్వే అసహ్యించుకుంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీవు నాశనం చేస్తావు’ అనే హీబ్రూ క్రియను దేవుని సాధారణ చర్యగానూ, ‘నీవు నాశనం చేయబోతావు’ అనే భవిష్యత్ భావంగానూ గ్రహించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘రక్తాల మరియు మోసపు మనిషి’; ఇది రక్తపాతం మరియు వంచనతో గుర్తించబడిన మనిషి అనే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּאַבֵּד
  choice: నీవు నాశనం చేస్తావు
  rationale: אבד ధాతువు పియేల్ రూపం ‘నశింపజేయడం/నాశనం చేయడం’ అనే కారణార్థక భావాన్ని ఇస్తుంది. తెలుగు వర్తమాన-భవిష్యత్ రూపం సందర్భంలో దేవుని సాధారణ చర్యగానూ, రాబోయే చర్యగానూ వినిపించగలదు.
- source_word: דֹּבְרֵי כָזָב
  choice: అబద్ధాలు పలికేవారిని
  rationale: ‘అసత్యం పలికేవారు’ అనే హీబ్రూ నిర్మాణంలోని క్రియాత్మక భావాన్ని నిలుపుతూ, సహజమైన ఆధునిక తెలుగులో ఇచ్చింది.
- source_word: אִישׁ דָּמִים
  choice: రక్తపాతం గల మనిషిని
  rationale: అక్షరార్థంగా ‘రక్తాల మనిషి’; ఇది రక్తపాతం లేదా రక్తదోషంతో గుర్తింపబడిన పురుషుణ్ని సూచించే నుడికారం. ‘మనిషి’ ద్వారా మూలంలోని పుంలింగ ఏకవచనాన్ని నిలిపింది.
- source_word: וּמִרְמָה
  choice: మోసం గల
  rationale: מִרְמָה మోసం, వంచన లేదా ద్రోహాన్ని సూచిస్తుంది. ‘మోసం’ విస్తృతమైన, సాధారణ ఆధునిక తెలుగు పదం.
- source_word: יְתָעֵב
  choice: అసహ్యించుకుంటాడు
  rationale: תעב పియేల్ రూపం తీవ్రమైన నైతిక ఏవగింపును వ్యక్తం చేస్తుంది; ‘అసహ్యించుకుంటాడు’ ఆ బలాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపం ‘యెహోవా’గా లిప్యంతరీకరించింది.
theological_decisions:
- issue: תְּאַבֵּד యొక్క కాల/అంశ భావం
  choice: నీవు నాశనం చేస్తావు
  alternative: నీవు నాశనం చేస్తావు—దీనిని దేవుని సాధారణ చర్యగా లేదా భవిష్యత్ చర్యగా గ్రహించవచ్చు
  rationale: హీబ్రూ అసంపూర్ణ క్రియ సందర్భానుసారం భవిష్యత్ చర్యను లేదా దేవుని లక్షణాత్మక చర్యను తెలియజేయగలదు. తెలుగు రూపం ఆ రెండింటినీ పూర్తిగా మూసివేయదు.
- issue: దైవనామం יְהוָה
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా నామరూపంలో ఉంచడం మూలాన్ని అనుసరిస్తుంది; తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ప్రధాన పాఠ్యంలో వాడి, ప్రత్యామ్నాయ లిప్యంతరీకరణను గమనికలో తెలిపింది.
- issue: אִישׁ అనే పుంలింగ ఏకవచనం
  choice: మనిషిని
  alternative: వ్యక్తిని
  rationale: మూలంలోని పుంలింగ ఏకవచనాన్ని నిలుపుతూ, రక్తపాతం మరియు మోసం అనే రెండు లక్షణాలు ఒకే మనిషిని వర్ణిస్తున్న నిర్మాణాన్ని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; కీర్తన కవిత్వానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదజాలం వాడబడింది. ‘రక్తపాతం, మోసం గల మనిషి’ మూలంలోని ‘రక్తాల మరియు మోసపు మనిషి’ అనే నుడికారాన్ని సహజ తెలుగులో నిలుపుతుంది.
