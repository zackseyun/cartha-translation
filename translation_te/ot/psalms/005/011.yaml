  yaml_path: translation/ot/psalms/005/011.yaml
  text: But let all who take refuge in you rejoice[a]; let them shout for joy forever. Spread your protection over them[b], so that those who love your name may exult in you.
translation:
  language: te
  text: 'కాని నీలో ఆశ్రయం పొందే వారందరూ సంతోషించాలి;

    వారు ఎల్లప్పుడూ హర్షధ్వానాలు చేయాలి.[a]

    నీవు వారిమీద నీ రక్షణను పరచాలి,[b]

    నీ నామాన్ని ప్రేమించేవారు నీలో ఉల్లసించాలి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు ఎల్లప్పుడూ ఆనందగానం చేయాలి.” హీబ్రూ క్రియ ఉల్లాసభరితమైన ఆనందధ్వనులను సూచిస్తుంది; అందులో గానం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారిని కప్పాలి” లేదా “వారికి ఆశ్రయం కల్పించాలి.” హీబ్రూ పదచిత్రం రక్షణగా కప్పడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׂמְחוּ
  choice: సంతోషించాలి
  rationale: ప్రార్థనా సందర్భంలోని ఈ అసంపూర్ణ క్రియకు కోరిక/విన్నప భావం ఉంది; తెలుగు ‘సంతోషించాలి’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חוֹסֵי בָךְ
  choice: నీలో ఆశ్రయం పొందే వారు
  rationale: חסה కేవలం అంతరంగ విశ్వాసాన్ని కాక, రక్షణ కోసం ఆశ్రయం పొందడమనే స్పష్టమైన చిత్రాన్ని సూచిస్తుంది.
- source_word: לְעוֹלָם
  choice: ఎల్లప్పుడూ
  rationale: నిలకడగా కొనసాగే కాలాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: יְרַנֵּנוּ
  choice: ఆనందంతో కేకలు వేయాలి
  rationale: רנן యొక్క పీయేల్ రూపం ఉప్పొంగే ఆనందధ్వనిని సూచిస్తుంది; అది గానం కూడా కావచ్చు, కాబట్టి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְתָסֵךְ עָלֵימוֹ
  choice: నీవు వారిపై నీ రక్షణను కప్పాలి
  rationale: סכך లోని కప్పి కాపాడే దృశ్యరూపాన్ని, దాని రక్షణార్థాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: וְיַעְלְצוּ בְךָ
  choice: నీలో ఉల్లసించాలి
  rationale: עלץ సాధారణ సంతోషం కంటే ఉప్పొంగే ఆనందాన్ని సూచిస్తుంది; בְךָ లోని దేవుని-కేంద్రిత ‘నీలో’ భావాన్ని నిలుపుతుంది.
- source_word: אֹהֲבֵי שְׁמֶךָ
  choice: నీ నామాన్ని ప్రేమించేవారు
  rationale: మూలంలోని ‘నీ నామం’ అనే నిబంధనాత్మక, ప్రత్యక్ష పదబంధాన్ని ‘నిన్ను’ అని సరళీకరించకుండా కాపాడుతుంది.
theological_decisions:
- issue: వాక్యమంతటా ప్రార్థనా కోరికా, లేక భవిష్యద్వాక్యమా
  choice: ‘సంతోషించాలి… కేకలు వేయాలి… ఉల్లసించాలి’ అనే ప్రార్థనా/కోరిక భావం
  alternative: ‘సంతోషిస్తారు… కేకలు వేస్తారు… ఉల్లసిస్తారు’ అనే సాధారణ భవిష్యత్ భావం
  rationale: కీర్తనలోని ప్రార్థనా సందర్భం ఈ అసంపూర్ణ క్రియారూపాలను కోరికలు లేదా విన్నపాలుగా చదవడానికి అనుకూలిస్తుంది; అయినా హీబ్రూ రూపాల్లోని భవిష్యత్ సంభావ్యతను పూర్తిగా నిరాకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గౌరవప్రదమైన కవితా శైలి. మూలంలోని సమాంతర నిర్మాణం, ఆశ్రయం–కప్పడం అనే రక్షణాత్మక దృశ్యరూపాలు, అలాగే ప్రార్థనా కోరిక భావం నిలుపబడ్డాయి.
