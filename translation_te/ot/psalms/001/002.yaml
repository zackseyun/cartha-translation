source:
  edition: WLC
  text: כִּ֤י אִ֥ם בְּ/תוֹרַ֥ת יְהוָ֗ה חֶ֫פְצ֥/וֹ וּֽ/בְ/תוֹרָת֥/וֹ יֶהְגֶּ֗ה יוֹמָ֥ם וָ/לָֽיְלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/002.yaml
  text: But his delight is in the law of Yahweh[b][a], and on his law he meditates day and night.
translation:
  language: te
  text: 'కాని అతని ఆనందం యాహ్వే ధర్మశాస్త్రంలోనే ఉంది[a];

    ఆయన ధర్మశాస్త్రాన్ని పగలూ రాత్రీ ధ్యానిస్తాడు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యాహ్వే ధర్మశాస్త్రం’ అనే మాటను ‘యాహ్వే ఉపదేశం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఈ హీబ్రూ క్రియ ధ్యానిస్తూ మెల్లని స్వరంతో పలకడం లేదా వల్లించడం అనే భావాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: కాని
  rationale: మొదటి వచనంలోని నిరాకరణలకు వ్యతిరేకంగా నీతిమంతుని వైఖరిని చూపే విరోధార్థక నిర్మాణం; తెలుగులో ‘కాని’ సహజంగా ఆ వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: בְּתוֹרַת יְהוָה
  choice: యాహ్వే ధర్మశాస్త్రమే
  rationale: תּוֹרָה దేవుని బోధన లేదా ఉపదేశం అనే విస్తృత భావాన్ని కలిగి ఉన్నప్పటికీ, ఇక్కడ నిబంధనాత్మకంగా వెల్లడైన బోధకు ఉన్న బలాన్ని ‘ధర్మశాస్త్రం’ నిలుపుతుంది; ‘-మే’ כִּי אִם నిర్మాణంలోని ప్రత్యేక దృష్టిని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణకు అనుగుణంగా తెలుగులో ‘యాహ్వే’గా ఇచ్చాం.
- source_word: חֶפְצוֹ
  choice: అతనికి ఆనందం
  rationale: ఈ పదం ఒకడు దేనిలో సంతోషం, ఇష్టం లేదా ప్రీతి పొందుతాడో సూచిస్తుంది; ‘అతనికి ఆనందం’ ఆధునిక తెలుగులో సహజంగా ఆ హృదయపూర్వక ఆసక్తిని తెలియజేస్తుంది.
- source_word: וּבְתוֹרָתוֹ
  choice: ఆయన ధర్మశాస్త్రాన్ని
  rationale: ప్రత్యయం సహజంగా యాహ్వేను తిరిగి సూచిస్తుంది. ‘ఆయన’ ఆ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది; ‘ధ్యానించు’తో తెలుగులో కర్మవిభక్తి సహజం.
- source_word: יֶהְגֶּה
  choice: ధ్యానిస్తాడు
  rationale: הגה ఆలోచిస్తూ మననం చేయడాన్నీ, మెల్లగా పలుకుతూ వల్లించడాన్నీ సూచించగలదు. సందర్భంలో ‘ధ్యానిస్తాడు’ ప్రధాన భావాన్ని సహజంగా ఇస్తుంది; శబ్దంతో కూడిన భావఛాయను పాదటీపులో ఉంచాం.
- source_word: יוֹמָם וָלָיְלָה
  choice: పగలూ రాత్రీ
  rationale: నిరంతర ఆచరణను సూచించే హీబ్రూ యుగ్మాన్ని నేరుగా, కవితాత్మకంగా మరియు సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: జ్ఞానకీర్తన సందర్భంలో תּוֹרָה అనువాదం
  choice: ధర్మశాస్త్రం
  alternative: ఉపదేశం
  rationale: ‘ఉపదేశం’ అనే విస్తృత అర్థం సాధ్యమే; అయినా యాహ్వే వెల్లడించిన నిబంధనాత్మక బోధ అనే భావబలాన్ని ‘ధర్మశాస్త్రం’ నిలుపుతుంది. విస్తృత ప్రత్యామ్నాయాన్ని పాదటీపులో ఇచ్చాం.
- issue: יהוה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: הגה క్రియలోని మౌనధ్యానం–మెల్లని ఉచ్చారణ భావవిస్తృతి
  choice: ధ్యానిస్తాడు
  alternative: మెల్లగా వల్లిస్తాడు; మననం చేస్తాడు
  rationale: జ్ఞానసాహిత్య సందర్భంలో నిరంతర లోతైన మననమే ప్రధానంగా వినిపిస్తుంది; అయితే క్రియలో ఉండగల మెల్లని ఉచ్చారణ భావాన్ని తొలగించకుండా పాదటీపులో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కవితాత్మక శైలిని ఉపయోగించాం. మూలంలోని రెండు సమాంతర భాగాలను అర్ధవిరామంతో నిలిపి, ‘పగలూ రాత్రీ’ అనే లయబద్ధమైన రూపాన్ని ఎంచుకున్నాం.
