source:
  edition: WLC
  text: כִּֽי יוֹדֵ֣עַ יְ֭הוָה דֶּ֣רֶךְ צַדִּיקִ֑ים וְ/דֶ֖רֶךְ רְשָׁעִ֣ים תֹּאבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/006.yaml
  text: For Yahweh knows the way of the righteous[a], but the way of the wicked will perish.
translation:
  language: te
  text: ఎందుకంటే యెహోవా నీతిమంతుల మార్గాన్ని ఎరుగుతాడు[a]; కానీ దుష్టుల మార్గం నశిస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కాపాడుతూ ఉంటాడు.’ హీబ్రూలోని ‘తెలుసు’ అనే పదం కేవలం తెలిసి ఉండటమే కాక, సంబంధపూర్వక శ్రద్ధ లేదా ఆమోదాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: మునుపటి వ్యత్యాసానికి కారణాన్ని తెలియజేసే హేత్వర్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יֹדֵעַ
  choice: ఎరుగుతాడు
  rationale: మూలంలోని ‘తెలుసుకొను’ అనే ప్రాథమిక అర్థాన్ని నిలుపుతూ, కేవలం సమాచారం కలిగి ఉండటంకన్నా సంబంధపూర్వక శ్రద్ధ లేదా ఆమోదం అనే అంతర్భావానికి కూడా చోటిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని సాధారణ ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా వ్యక్తిగత నామంగానే ఉంచుతుంది.
- source_word: דֶּרֶךְ
  choice: మార్గం
  rationale: జీవన విధానాన్నీ అది చేరే గమ్యాన్నీ సూచించగల విస్తృత రూపకం; రెండు పాదాల్లోని పునరుక్త సమాంతరతను కాపాడుతుంది.
- source_word: צַדִּיקִים
  choice: నీతిమంతులు
  rationale: నామవాచకంగా వాడిన బహువచన విశేషణానికి సహజమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం.
- source_word: וְ
  choice: కానీ
  rationale: రూపపరంగా ‘మరియు’ అయినా, కవితా సమాంతరతలో రెండు మార్గాల మధ్య స్పష్టమైన వ్యతిరేకతను సూచిస్తుంది.
- source_word: רְשָׁעִים
  choice: దుష్టులు
  rationale: జ్ఞానసాహిత్యంలోని నైతిక వర్గాన్ని స్పష్టంగా తెలిపే సహజమైన తెలుగు పదం.
- source_word: תֹּאבֵד
  choice: నశిస్తుంది
  rationale: కర్త అయిన ‘మార్గం’ చివరకు అంతమవడం లేదా వినాశానికి చేరడం అనే అకర్మక భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యెహోవా ‘ఎరుగుట’ అనే మాట భావం
  choice: ప్రధాన పాఠ్యంలో మూలానికి సమీపమైన ‘ఎరుగుతాడు’ ఉంచి, సంబంధపూర్వక శ్రద్ధ లేదా ఆమోదం అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో తెలిపాం.
  alternative: ‘కాపాడుతూ ఉంటాడు’ లేదా ‘ఆమోదిస్తాడు’ అని నేరుగా అనువదించడం.
  rationale: హీబ్రూ క్రియ సందర్భంలో కేవలం అవగాహనకన్నా ఎక్కువను సూచించగలదు; అయితే దాని విస్తృత భావాల్లో ఒక్కదానిని ప్రధాన పాఠ్యంలో ఖరారు చేయకుండా అసలు పదంలోని అర్థవిస్తృతిని కాపాడటం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనల కవితాత్మక గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదాలు వాడబడ్డాయి. ‘మార్గం’ అనే పదాన్ని రెండు పాదాల్లోనూ పునరావృతం చేసి హీబ్రూ సమాంతర నిర్మాణాన్ని కాపాడాం.
