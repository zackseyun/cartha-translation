  text: Therefore the wicked will not stand in the judgment[b][a], nor sinners in the assembly of the righteous.
translation:
  language: te
  text: కాబట్టి దుష్టులు తీర్పులో[a] నిలువలేరు; పాపులు నీతిమంతుల సభలో[b] నిలువలేరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘న్యాయవిచారణలో.’ హీబ్రూ పదం ప్రస్తుత వ్యవస్థలో జరిగే న్యాయపరిశీలననైనా, అంతిమ తీర్పునైనా విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నీతిమంతుల సమాజంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: కాబట్టి
  rationale: ముందటి వచనాల్లో దుష్టుల గురించి చెప్పిన దానికి తార్కిక ఫలితాన్ని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: יָקֻמוּ
  choice: నిలువలేరు
  rationale: మూలంలోని ‘లేచుట/నిలుచుట’ అనే రూపకాన్ని నిలుపుతూ, తీర్పును ఎదుర్కొని నిలబడలేకపోవడం అనే న్యాయసంబంధ భావాన్ని అతిగా వివరణ చేయకుండా తెలియజేస్తుంది. రెండవ పాదంలో క్రియ అధ్యాహారంగా ఉన్నందున తెలుగులో స్పష్టతకోసం పునరుక్తి చేయబడింది.
- source_word: רְשָׁעִים
  choice: దుష్టులు
  rationale: జ్ఞానసాహిత్యంలో నైతిక వర్గాన్ని సూచించే ప్రామాణికమైన, సంక్షిప్తమైన తెలుగు సమానార్థకం.
- source_word: בַּמִּשְׁפָּט
  choice: తీర్పులో
  rationale: מִשְׁפָּט లోని న్యాయవిచారణ లేదా తీర్పు భావాన్ని నిలుపుతుంది; ఇది ప్రస్తుతకాల లెక్కతీర్పా, అంతిమ తీర్పా అనే విషయాన్ని నిర్ణయించదు.
- source_word: חַטָּאִים
  choice: పాపులు
  rationale: పాపం చేత లక్షణీకరించబడిన వారిని నేరుగా, సహజంగా సూచిస్తూ ‘దుష్టులు’ అనే సమాంతర పదంతో సరిపోతుంది.
- source_word: בַּעֲדַת
  choice: సమాజంలో
  rationale: עֵדָה సూచించే సమకూడిన సముదాయ భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; ‘సభలో’ అనే ప్రత్యామ్నాయం కూడా సాధ్యం.
- source_word: צַדִּיקִים
  choice: నీతిమంతులు
  rationale: నైతికంగా న్యాయమైనవారి వర్గాన్ని సూచించే స్థిరమైన తెలుగు బైబిలు పదం.
theological_decisions:
- issue: ‘తీర్పు’ యొక్క పరిధి
  choice: ‘తీర్పులో’ అని సాధారణ న్యాయార్థంతో అనువదించబడింది; అది ప్రస్తుత న్యాయవిచారణను సూచిస్తుందా, అంతిమ తీర్పును సూచిస్తుందా, లేక రెండింటినీ సూచిస్తుందా అనేది నిర్దిష్టం చేయలేదు.
  alternative: ‘న్యాయవిచారణలో’ లేదా ‘అంతిమ తీర్పులో’
  rationale: హీబ్రూ పదం విస్తృతమైన న్యాయపరమైన లెక్కతీర్పును అనుమతిస్తుంది. కీర్తనలోని ఉద్దేశపూర్వక భావవిస్తృతిని, వేదాంతపరమైన ఉద్రిక్తతను అనువాదం పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. హీబ్రూ సమాంతర నిర్మాణాన్ని స్పష్టంగా ఉంచేందుకు రెండవ పాదంలో అధ్యాహార క్రియను పునరుక్తి చేశాం; సెమికోలన్ రెండు సమాంతర వాక్యభాగాలను కలుపుతుంది.
