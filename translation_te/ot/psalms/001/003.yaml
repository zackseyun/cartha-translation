id: PSA.1.3
reference: Psalms 1:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְֽ/הָיָ֗ה כְּ/עֵץ֮ שָׁת֪וּל עַֽל פַּלְגֵ֫י מָ֥יִם אֲשֶׁ֤ר פִּרְי֨/וֹ יִתֵּ֬ן בְּ/עִתּ֗/וֹ וְ/עָלֵ֥/הוּ לֹֽא יִבּ֑וֹל וְ/כֹ֖ל אֲשֶׁר יַעֲשֶׂ֣ה יַצְלִֽיחַ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/003.yaml
  text: He will be like a tree planted by streams of water[a], which yields its fruit in its season, and its leaf does not wither; in all that he does, he prospers.
translation:
  language: te
  text: అతడు నీటి కాలువల పక్కన నాటబడిన చెట్టులా ఉంటాడు. అది తన కాలంలో ఫలాన్ని ఇస్తుంది; దాని ఆకు వాడిపోదు. అతడు చేసే ప్రతిదానిలో సఫలమవుతాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “అతడు చేసేదంతా సఫలమవుతుంది.” హీబ్రూ వాక్యాన్ని ఇలా కూడా అర్థం చేసుకోవచ్చు: “అతడు చేసేదంతా” చివరి క్రియకు కర్తగా ఉంటుంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: అతడు ... ఉంటాడు
  rationale: ముందరి వచనాల్లో వర్ణించిన ధన్యుని ఫలిత స్థితిని సూచించే భావాన్ని సహజమైన తెలుగు భవిష్యత్ రూపంలో వ్యక్తం చేస్తుంది.
- source_word: כְּעֵץ
  choice: చెట్టులా
  rationale: כְּ సూచించే ఉపమానాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: שָׁתוּל
  choice: నాటబడిన
  rationale: చెట్టును ఉద్దేశపూర్వకంగా ఒక చోట నాటినట్లు తెలిపే నిష్క్రియార్థాన్ని నిలుపుతుంది; ‘మారునాటబడిన’ అనే మరింత నిర్దిష్ట భావాన్ని అనవసరంగా చేర్చదు.
- source_word: עַל פַלְגֵי מָיִם
  choice: నీటి కాలువల పక్కన
  rationale: פַלְגֵי అనే బహువచనం నీటి ప్రవాహాలు లేదా విభజిత కాలువలను సూచిస్తుంది. ‘కాలువలు’ సమృద్ధిగా, నిరంతరం అందే నీటి చిత్రాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: פִּרְיוֹ יִתֵּן
  choice: ఫలాన్ని ఇస్తుంది
  rationale: హీబ్రూ పదబంధంలోని ‘తన ఫలాన్ని ఇస్తుంది’ అనే సరళమైన ఉత్పాదక భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: בְּעִתּוֹ
  choice: తన కాలంలో
  rationale: చెట్టుకు తగిన లేదా నియమిత ఫలకాలాన్ని సూచిస్తుంది; మూలంలోని సర్వనామ సంబంధాన్ని నిలుపుతుంది.
- source_word: וְעָלֵהוּ לֹא יִבּוֹל
  choice: దాని ఆకు వాడిపోదు
  rationale: ఏకవచన సమష్టి భావంలోని ‘ఆకు’ను, మొక్క ఎండిపోయే లేదా వాడే భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: וְכֹל אֲשֶׁר יַעֲשֶׂה
  choice: అతడు చేసే ప్రతిదానిలో
  rationale: సమగ్రతను నిలుపుతూ, చివరి క్రియకు ధన్యుడినే కర్తగా తీసుకునే ప్రధాన పఠనాన్ని తెలుగులో సహజంగా ఏర్పరుస్తుంది.
- source_word: יַצְלִיחַ
  choice: వర్ధిల్లుతాడు
  rationale: צלח యొక్క సఫలత/అభివృద్ధి భావాన్ని వ్యక్తిపై వర్తింపజేస్తూ, చెట్టు చిత్రంతోనూ సహజంగా అనుసంధానిస్తుంది.
theological_decisions:
- issue: చివరి క్రియ יַצְלִיחַ యొక్క కర్త
  choice: ‘అతడు చేసే ప్రతిదానిలో వర్ధిల్లుతాడు’—కర్తగా ధన్యుడిని తీసుకోవడం
  alternative: ‘అతడు చేసేదంతా సఫలమవుతుంది’—అతని కార్యాలనే కర్తగా తీసుకోవడం
  rationale: హీబ్రూ వాక్యనిర్మాణం ధన్యుడిని తిరిగి కర్తగా గ్రహించడానికి గానీ, ‘అతడు చేసేదంతా’ అనే పదబంధాన్ని చివరి క్రియకు కర్తగా గ్రహించడానికి గానీ వీలు ఇస్తుంది. ప్రధాన పాఠం వ్యక్తిపై ఉన్న కీర్తన దృష్టిని కొనసాగిస్తుంది; నిజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కవితాత్మక వచనం. వ్యవసాయ చిత్రాన్ని స్పష్టంగా ఉంచడానికి ‘నీటి కాలువలు,’ ‘ఫలాన్ని ఇస్తుంది,’ ‘ఆకు వాడిపోదు’ అనే సాధారణ పదాలను వాడాం. వాక్యాలను విభజించడం వల్ల తెలుగు పఠన సౌలభ్యం పెరుగుతుంది; మూలంలోని భావక్రమం అలాగే ఉంటుంది.
