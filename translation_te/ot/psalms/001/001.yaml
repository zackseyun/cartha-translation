source:
  edition: WLC
  text: אַ֥שְֽׁרֵי הָ/אִ֗ישׁ אֲשֶׁ֤ר לֹ֥א הָלַךְ֮ בַּ/עֲצַ֪ת רְשָׁ֫עִ֥ים וּ/בְ/דֶ֣רֶךְ חַ֭טָּאִים לֹ֥א עָמָ֑ד וּ/בְ/מוֹשַׁ֥ב לֵ֝צִ֗ים לֹ֣א יָשָֽׁב־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/001.yaml
  text: Blessed is the man who does not walk in the counsel of the wicked[a], nor stand in the way of sinners[c][b], nor sit in the seat of scoffers.
translation:
  language: te
  text: 'దుష్టుల సలహా ప్రకారం నడవకుండా,

    పాపుల మార్గంలో నిలవకుండా,

    అపహాసకుల ఆసనంలో కూర్చోకుండా ఉండే మనిషి[a] ధన్యుడు![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో ‘మనిషి’ పుంలింగ ఏకవచనంగా ఉంది; ఇక్కడ అది పురుషులను మాత్రమే కాక, ఆదర్శ నీతిమంత వ్యక్తిని సాధారణంగా సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: ‘ఎంత భాగ్యవంతుడు!’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం కేవలం ఆనందభావాన్ని కాక, లోతుగా శుభకరమైన దీవెనగల స్థితిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: ధన్యుడు
  rationale: హీబ్రూ ఆశీర్వచనం కేవలం భావోద్వేగమైన సంతోషాన్ని కాక, శుభకరమైన మరియు దీవెనగల స్థితిని ప్రకటిస్తుంది. తెలుగు కీర్తనల శైలిలో ‘ధన్యుడు’ సహజంగా, గంభీరంగా ఉంటుంది.
- source_word: הָאִישׁ
  choice: మనిషి
  rationale: మూలంలో పుంలింగ ఏకవచనం ఉన్నా, జ్ఞానసాహిత్యంలో ఇది ఆదర్శవంతమైన నీతిమంత వ్యక్తిని ప్రతినిధిగా సూచిస్తుంది. ‘మనిషి’ ఆ రూపాన్ని నిలుపుతూ తెలుగులో సాధారణ వ్యక్తికీ వర్తించగలదు.
- source_word: הָלַךְ
  choice: నడవకుండా
  rationale: ప్రవర్తనకు సంబంధించిన హీబ్రూ రూపకాన్ని, అలాగే నడుచుట—నిలుచుట—కూర్చుండుట అనే కవితాత్మక క్రమాన్ని నిలుపుతుంది.
- source_word: בַּעֲצַת
  choice: ఆలోచన ప్రకారం
  rationale: עֵצָה సలహా, యోచన, మార్గదర్శక దృక్పథం అనే భావాలను కలిగి ఉంది. ‘ఆలోచన ప్రకారం’ దుష్టుల మార్గదర్శకత్వానికి లోబడటాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: רְשָׁעִים
  choice: దుష్టులు
  rationale: నైతికంగా దుర్మార్గులైన వారిని సూచించే మూలపదానికి నేరుగా సరిపోయే, ప్రస్తుత ప్రమాణ తెలుగులో సుపరిచితమైన పదం.
- source_word: דֶרֶךְ
  choice: మార్గంలో
  rationale: భౌతిక దారినీ జీవన విధానాన్నీ సూచించగల హీబ్రూ జ్ఞానసాహిత్య రూపకాన్ని నిలుపుతుంది.
- source_word: חַטָּאִים
  choice: పాపులు
  rationale: మూలంలోని బహువచన నామవాచకానికి నేరమైన, సంప్రదాయబద్ధమైనప్పటికీ ఇప్పటికీ స్పష్టమైన తెలుగు సమానం.
- source_word: עָמָד
  choice: నిలవకుండా
  rationale: మూలంలోని స్పష్టమైన క్రియను, నడవడం నుంచి నిలవడం వైపు సాగే కవితాత్మక తీవ్రతను నిలుపుతుంది.
- source_word: מוֹשַׁב
  choice: కూర్చునే చోట
  rationale: ఈ నామవాచకం కూర్చునే స్థలం, సమావేశం లేదా నివాసాన్ని సూచించగలదు. సందర్భంలో ישבతో ఉన్న పదప్రయోగాన్ని సహజ తెలుగులో నిలుపుతూ, ‘సభ’ అని నిర్ణయాత్మకంగా అర్థాన్ని కుదించదు.
- source_word: לֵצִים
  choice: అపహాసకులు
  rationale: ఇతరులను లేదా సత్యాన్ని ఎగతాళి చేసి తృణీకరించేవారిని సూచిస్తుంది. ‘అపహాసకులు’ గంభీరమైన కీర్తన శైలికి సరిపోతూ ఆధునిక పాఠకులకు అర్థమవుతుంది.
- source_word: יָשָׁב
  choice: కూర్చోకుండా
  rationale: మూలంలోని concrete imageను నిలుపుతూ నడవడం—నిలవడం—కూర్చోవడం అనే త్రిక్రమాన్ని పూర్తి చేస్తుంది.
theological_decisions:
- issue: జ్ఞానసాహిత్యంలో ప్రతినిధి పుంలింగ ఏకవచనం
  choice: మనిషి
  alternative: వ్యక్తి / ఎవరైతే
  rationale: הָאִישׁ వ్యాకరణపరంగా పుంలింగ ఏకవచనం; అయితే ఇక్కడ ఆదర్శ నీతిమంతుని సాధారణ ప్రతినిధిగా వాడబడింది. ‘మనిషి’ మూలరూపాన్ని ప్రతిబింబిస్తూ అది పురుషులకు మాత్రమే పరిమితమని చెప్పకుండా ఉండేందుకు పాదసూచిక ఇచ్చాం.
- issue: אַשְׁרֵי అనే ఆశీర్వచనపు భావం
  choice: ధన్యుడు
  alternative: సంతోషవంతుడు / ఎంత భాగ్యవంతుడు
  rationale: ఈ పదం అంతర్గత ఆనందాన్ని మాత్రమే కాక, ప్రశంసించదగిన దీవెనగల స్థితిని ప్రకటిస్తుంది. ‘ధన్యుడు’ ఆ జ్ఞానసాహిత్య మరియు ఆధ్యాత్మిక విస్తృతిని కాపాడుతుంది.
- issue: מוֹשַׁב యొక్క స్థలం లేదా సమూహం అనే సందిగ్ధత
  choice: కూర్చునే చోట
  alternative: సభలో / ఆసనంలో
  rationale: మూల నామవాచకం కూర్చునే స్థలం, సమావేశం లేదా నివాసం అనే పరిధి కలిగి ఉంది. ‘కూర్చునే చోట’ ప్రధాన దృశ్యాన్ని నిలుపుతూ ఏకైక సంస్థాగత అర్థాన్ని బలవంతంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, కీర్తనకు తగిన గంభీరతతో మూడు సమాంతర పాదాలుగా రూపొందించబడింది. నడవడం—నిలవడం—కూర్చోవడం అనే మూల కవితాత్మక పురోగతి కాపాడబడింది. అతిగా సంస్కృతీకరించిన లేదా మతశాఖాపరమైన పదజాలం నివారించబడింది.
