revisions:
- from: 'దుష్టుల ఆలోచన ప్రకారం నడవకుండా,

    పాపుల మార్గంలో నిలవకుండా,

    అపహాసకులు కూర్చునే చోట కూర్చోకుండా ఉండే మనిషి[a] ధన్యుడు![b]'
  to: 'దుష్టుల సలహా ప్రకారం నడవకుండా,

    పాపుల మార్గంలో నిలవకుండా,

    అపహాసకుల ఆసనంలో కూర్చోకుండా ఉండే మనిషి[a] ధన్యుడు![b]'
  rationale: A limited lexical correction changes ‘ఆలోచన’ to ‘సలహా’ to reflect the Hebrew ‘counsel’ more accurately. The revised ‘ఆసనంలో’ renders ‘seat’ concisely and maintains the concrete poetic imagery, without deciding whether the seat is merely a place or a formal gathering.
