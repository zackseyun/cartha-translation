lexical_decisions:
- source_word: לֹא כֵן
  choice: అలా ఉండరు
  rationale: మునుపటి వచనంలోని నీతిమంతుని స్థిరమైన వర్ధిల్లుదలకు దుష్టులు భిన్నమని తెలిపే హీబ్రూ సంక్షిప్త వ్యతిరేకతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הָרְשָׁעִים
  choice: దుష్టులు
  rationale: జ్ఞానసాహిత్యంలో నైతికంగా చెడ్డవారిని సూచించే ప్రామాణికమైన, సందర్భోచితమైన తెలుగు పదం.
- source_word: כִּי אִם
  choice: బదులుగా
  rationale: నీతిమంతుని చెట్టు రూపకానికి విరుద్ధంగా దుష్టుల నిజస్థితిని పరిచయం చేసే బలమైన సవరణాత్మక వ్యతిరేకతను వ్యక్తం చేస్తుంది.
- source_word: כַּמֹּץ
  choice: పొట్టులా
  rationale: ధాన్యం నుంచి వేరుచేయబడే తేలికైన వ్యర్థభాగాన్ని సూచించే వ్యవసాయ రూపకాన్ని సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: אֲשֶׁר
  choice: —ఏ
  rationale: ‘గాలి ఎగరగొట్టే పొట్టు’ అనే తెలుగు సంబంధవాచక నిర్మాణంలో సహజంగా అంతర్భవిస్తుంది.
- source_word: תִּדְּפֶנּוּ
  choice: ఎగరగొట్టే
  rationale: נדף క్రియలోని గాలి చేత తరిమివేయబడటం లేదా ఊదివేయబడటం అనే చలనాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: רוּחַ
  choice: గాలి
  rationale: ధాన్యం వడకట్టే ఈ వ్యవసాయ ఉపమానంలో ‘ఆత్మ’ లేదా ‘ఊపిరి’ కాక, భౌతికమైన గాలే ఉద్దేశించబడింది.
