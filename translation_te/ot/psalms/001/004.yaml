  source_fidelity: The draft correctly renders the contrast, ‘the wicked,’ the chaff image, and wind as the agent. However, ‘బదులుగా’ is somewhat syntactically awkward here, because the Hebrew adversative introduces the comparison directly rather than an alternative action.
