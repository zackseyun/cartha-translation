    rationale: ‘గాలి ఊదివేసే’ is a clearer lexical alternative for the wind’s action of driving/blowing away the chaff.
  revised_text: దుష్టులు మాత్రం అలా ఉండరు; గాలి కొట్టుకుపోయే పొట్టులా ఉంటారు.[a]
