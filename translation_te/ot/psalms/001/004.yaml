translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన శైలి. హీబ్రూలోని ఆకస్మిక వ్యతిరేకతను ‘అలా ఉండరు’తో, వ్యవసాయ రూపకాన్ని ‘పొట్టు’తో నిలిపాం. పాదసూచిక గుర్తు ప్రధాన వాక్యంలో చేర్చబడింది.
