reference: Psalms 61:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כֵּ֤ן אֲזַמְּרָ֣ה שִׁמְ/ךָ֣ לָ/עַ֑ד לְֽ/שַׁלְּמִ֥/י נְדָרַ֗/י י֣וֹם יֽוֹם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/008.yaml
  text: So I will sing praise to your name forever[a], to fulfill my vows day by day.
translation:
  language: te
  text: అందుచేత నేను నీ నామాన్ని శాశ్వతంగా కీర్తిస్తూ పాడుతాను, నా మొక్కుబడులను రోజు రోజుకు తీర్చడానికి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֵּן
  choice: అందుచేత
  rationale: ముందటి ప్రార్థన, నమ్మకం నుంచి వచ్చే ఫలితాన్ని లేదా సంకల్పాన్ని సూచించే అనుసంధాన పదం.
- source_word: אֲזַמְּרָה
  choice: కీర్తిస్తూ పాడుతాను
  rationale: זמר పియేల్ రూపం సంగీతంతో కూడిన స్తుతిగానాన్ని సూచిస్తుంది; ఈ తెలుగు ప్రయోగం ఆరాధనా భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שִׁמְךָ
  choice: నీ నామాన్ని
  rationale: మూలంలోని ‘నీ పేరు/నామం’ అనే రూపకాన్ని నిలుపుతుంది; సందర్భంలో అది దేవుని వెల్లడైన స్వభావం, కీర్తిని కూడా సూచించవచ్చు.
- source_word: לָעַד
  choice: శాశ్వతంగా
  rationale: నిరంతరమైన, అంతంలేని కాలాన్ని సూచించే సహజమైన గౌరవప్రద తెలుగు పదం.
- source_word: לְשַׁלְּמִי
  choice: తీర్చడానికి
  rationale: שלם పియేల్ క్రియ మొక్కుబడులతో వాడినప్పుడు వాటిని చెల్లించడం లేదా నెరవేర్చడం అనే భావం ఇస్తుంది; ‘తీర్చడం’ తెలుగులో ఈ రెండింటినీ సహజంగా ఆవర్తిస్తుంది.
- source_word: נְדָרַי
  choice: నా మొక్కుబడులను
  rationale: దేవునికి చేసిన వాగ్దానాలనే ఆరాధనా సందర్భంలో స్పష్టంగా సూచించే సాధారణ తెలుగు పదం.
- source_word: יוֹם יוֹם
  choice: రోజు రోజుకు
  rationale: హీబ్రూ పదపునరుక్తిలోని క్రమమైన, నిరంతర ఆచరణ భావాన్ని దగ్గరగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కీర్తనాశైలిని వాడాం. ‘నామం’ అనే బైబిలు సంబంధిత రూపాన్ని నిలుపుతూ, వాక్యాన్ని సాధారణ పాఠకులకు సులభంగా ఉంచాం. లְשַׁלְּמִי లోని ‘చెల్లించు/నెరవేర్చు’ భావభేదాన్ని ‘తీర్చు’ సహజంగా కలుపుతున్నందున ప్రత్యేక పాదటిప్పణి అవసరం లేదు.
