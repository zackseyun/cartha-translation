source:
  edition: WLC
  text: כִּֽי אַתָּ֣ה אֱ֭לֹהִים שָׁמַ֣עְתָּ לִ/נְדָרָ֑/י נָתַ֥תָּ יְ֝רֻשַּׁ֗ת יִרְאֵ֥י שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/005.yaml
  text: For you[a], O God, have heard my vows[b]; you have given me the inheritance of those who fear your name.
translation:
  language: te
  text: ఎందుకంటే దేవా, నీవు నా మొక్కుబడులను ఆలకించావు; నీ నామానికి భయపడేవారి[b] స్వాస్థ్యాన్ని[a] నీవు ఇచ్చావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ నామానికి భయపడేవారి స్వాస్థ్యాన్ని నీవు నాకు ఇచ్చావు.” హీబ్రూలో “నాకు” అని స్పష్టంగా లేదు; అయితే సందర్భాన్ని బట్టి కొందరు ఆ భావాన్ని గ్రహిస్తారు.
    reason: alternative_reading
  - marker: b
    text: “నీ నామానికి భయపడేవారు” అంటే దేవునిపట్ల భయభక్తులతో జీవించేవారు.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ప్రార్థన లేదా నమ్మకానికి కారణాన్ని పరిచయం చేసే అనుసంధాన పదంగా సహజంగా పనిచేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: రెండవ పురుష సంబోధనను ఆధునిక తెలుగు ప్రార్థనా శైలిలో సహజంగా, గౌరవంగా వ్యక్తం చేస్తుంది.
- source_word: שָׁמַעְתָּ
  choice: ఆలకించావు
  rationale: కేవలం శబ్దం వినడమే కాక శ్రద్ధగా వినడాన్ని సూచిస్తుంది; పూర్తయి ప్రస్తుతం ప్రాముఖ్యత కలిగిన చర్యగా తెలుగు భూతకాలంలో సహజంగా ఉంది.
- source_word: לִנְדָרָי
  choice: నా మొక్కుబడులను
  rationale: נדר అనేది సాధారణంగా దేవునికి చేసిన మొక్కుబడి లేదా ప్రతిజ్ఞను సూచిస్తుంది; అర్పణలను స్వయంగా సూచించదు.
- source_word: נָתַתָּ
  choice: నీవు ఇచ్చావు
  rationale: హీబ్రూ సంపూర్ణ క్రియను పూర్తయిన కార్యంగా నేరుగా వ్యక్తం చేస్తుంది.
- source_word: יְרֻשַּׁת
  choice: స్వాస్థ్యాన్ని
  rationale: వారసత్వంగా లేదా అనుగ్రహంగా లభించే స్థిరమైన భాగం/ఆస్తి అనే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: יִרְאֵי שְׁמֶךָ
  choice: నీ నామానికి భయపడేవారి
  rationale: దేవునిపట్ల భక్తిపూర్వక భయంతో జీవించేవారిని సూచించే నిర్మాణాన్ని పారదర్శకంగా నిలుపుతుంది; ‘భయపడు’ అనే మూలభావాన్ని మృదువుగా మార్చదు.
theological_decisions:
- issue: నָתַתָּ יְרֻשַּׁת יִרְאֵי שְׁמֶךָ అనే చివరి ఖండంలో గ్రహీత
  choice: నీ నామానికి భయపడేవారి స్వాస్థ్యాన్ని నీవు ఇచ్చావు
  alternative: నీ నామానికి భయపడేవారి స్వాస్థ్యాన్ని నీవు నాకు ఇచ్చావు
  rationale: హీబ్రూ పాఠంలో ‘నాకు’ అనే పరోక్ష కర్మ స్పష్టంగా లేదు. సందర్భం ఆధారంగా దాన్ని ఊహించవచ్చుగాని, ప్రధాన పాఠంలో చేర్చకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం మూలంలోని అస్పష్టతను కాపాడుతుంది.
- issue: ‘నీ నామానికి భయపడేవారు’ అనే మాట యొక్క భావం
  choice: భయపడేవారు
  alternative: భక్తితో గౌరవించేవారు
  rationale: మూలంలోని ירא అనే భయభక్తుల భావాన్ని ప్రధాన పాఠంలో నిలుపుతూ, అది కేవలం భీతిని సూచించదని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనకు తగిన గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘మొక్కుబడులు,’ ‘స్వాస్థ్యం,’ ‘భయపడేవారు’ అనే పదాలు మూలంలోని ఆధ్యాత్మిక మరియు నిబంధనాత్మక బరువును నిలుపుతాయి. పాదసూచిక సూచికలు అవి వివరించే పదబంధాల దగ్గర ఉంచబడ్డాయి.
