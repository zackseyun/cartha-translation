source:
  edition: WLC
  text: יָמִ֣ים עַל יְמֵי מֶ֣לֶךְ תּוֹסִ֑יף שְׁ֝נוֹתָ֗י/ו כְּמוֹ דֹ֥ר וָ/דֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/006.yaml
  text: May you add days to the days of the king[b][a]; may his years be like generation after generation.
translation:
  language: te
  text: రాజు దినాలకు దినాలు చేర్చు[a]; అతని సంవత్సరాలు తరం వెంట తరం వలె ఉండునుగాక[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు రాజు దినాలకు దినాలు చేర్చుతావు; అతని సంవత్సరాలు తరం వెంట తరం వలె ఉంటాయి.” హెబ్రీ క్రియారూపాన్ని ప్రార్థనగా కాక భవిష్యత్తును తెలిపే వాక్యంగా కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “తరం మరియు తరం”; అంటే వరుస తరాలపాటు కొనసాగడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִים עַל יְמֵי מֶלֶךְ
  choice: రాజు దినాలకు దినాలు
  rationale: ‘దినాలు’ అనే మూలరూపాన్ని నిలుపుతూ, עַל‌ను ఈ జోడింపు సందర్భంలో సహజమైన తెలుగు చతుర్థీ విభక్తితో వ్యక్తపరచింది. ఇది దీర్ఘాయుష్షును సూచించే హెబ్రీ నుడికారాన్ని, ‘సంవత్సరాలు’తో ఉన్న సమాంతరతను కాపాడుతుంది.
- source_word: תּוֹסִיף
  choice: చేర్చు
  rationale: יסף హిఫీల్ రూపానికి ‘చేర్చు/పెంచు’ అనే అర్థం. కీర్తనలోని ప్రార్థనా సందర్భాన్ని బట్టి దీన్ని దేవునికి చేసే విన్నపంగా అనువదించాం; భవిష్యదర్థ పఠనాన్ని పాదసూచికలో ఉంచాం.
- source_word: שְׁנוֹתָיו
  choice: అతని సంవత్సరాలు
  rationale: మూడవ పురుష ఏకవచన పుంలింగ ప్రత్యయం రాజును సహజంగా సూచిస్తుంది.
- source_word: כְּמוֹ דֹר וָדֹר
  choice: తరం వెంట తరం
  rationale: పోలికతో కూడిన పునరుక్త హెబ్రీ నుడికారం వరుసగా కొనసాగే తరాలను సూచిస్తుంది. ‘తరం వెంట తరం’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ పునరావృత్త భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఈ వాక్యం రాజు దీర్ఘాయుష్షు కోసం చేసే ప్రార్థనా, లేక భవిష్యత్తును తెలిపే ప్రకటననా?
  choice: ప్రధాన పాఠ్యంలో ‘చేర్చు… ఉండనివ్వు’ అని ప్రార్థనగా అనువదించాం.
  alternative: ‘నీవు చేర్చుతావు… అతని సంవత్సరాలు ఉంటాయి’ అనే భవిష్యదర్థ ప్రకటన.
  rationale: హెబ్రీ అసంపూర్ణ క్రియారూపం భవిష్యదర్థాన్ని కూడా ఇవ్వగలదు. అయితే కీర్తన ప్రార్థనా సందర్భంలో విన్నపార్థం బలంగా కనిపిస్తుంది; నిజమైన వ్యాకరణ సందిగ్ధతను పాదసూచికలో స్పష్టంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గంభీరతతో అనువదించాం. మూలంలోని ‘దినాలు… సంవత్సరాలు’ సమాంతరతను కాపాడుతూ, అసహజమైన పదానువాదాన్ని నివారించాం.
