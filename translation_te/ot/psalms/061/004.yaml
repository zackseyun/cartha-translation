  text: אָג֣וּרָה בְ֭/אָהָלְ/ךָ עוֹלָמִ֑ים אֶֽחֱסֶ֨ה בְ/סֵ֖תֶר כְּנָפֶ֣י/ךָ סֶּֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/004.yaml
  text: Let me dwell in your tent forever[a]; let me take refuge in the shelter of your wings[b]. Selah
translation:
  language: te
  text: 'నీ గుడారంలో నేను శాశ్వతంగా నివసించుగాక[a];

    నీ రెక్కల చాటున నేను ఆశ్రయం పొందుదును గాక[b]. సెలా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేను నీ గుడారంలో శాశ్వతంగా నివసిస్తాను.’ హెబ్రీ క్రియారూపం బలమైన కోరికను లేదా సంకల్పాన్ని వ్యక్తపరచగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘రెక్కల చాటు’ అనేది దేవుడు ఇచ్చే సంరక్షణ, భద్రతను చిత్రించే రూపకం.
    reason: cultural_note
lexical_decisions:
- source_word: אָגוּרָה
  choice: నివసించనివ్వు
  rationale: גור ధాతువు యొక్క ప్రథమ పురుష ఏకవచన కోహోర్టేటివ్ రూపం బలమైన కోరికను లేదా సంకల్పాన్ని వ్యక్తపరుస్తుంది. ప్రార్థనా సందర్భంలో ‘నివసించనివ్వు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: בְאָהָלְךָ
  choice: నీ గుడారంలో
  rationale: אָהֶל యొక్క ప్రత్యక్ష అర్థం ‘గుడారం’. ఇది దేవుని సన్నిధిని లేదా పవిత్ర నివాసాన్ని సూచించవచ్చు; అయినా మూలంలోని స్పష్టమైన రూపకాన్ని అలాగే ఉంచేందుకు ‘గుడారం’ ఎంచుకున్నాం.
- source_word: עוֹלָמִים
  choice: శాశ్వతంగా
  rationale: עוֹלָם యొక్క బహువచన రూపం ఇక్కడ అంతులేని కాలాన్ని బలంగా సూచిస్తుంది. ఆధునిక తెలుగులో ‘శాశ్వతంగా’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: אֶחֱסֶה
  choice: ఆశ్రయం పొందనివ్వు
  rationale: חסה అంటే రక్షణ కోసం ఆశ్రయం పొందడం లేదా ఆశ్రయించడం. ముందున్న కోహోర్టేటివ్‌తో సమాంతరంగా దీన్ని ప్రార్థనాత్మక కోరికగా అనువదించాం.
- source_word: בְסֵתֶר כְּנָפֶיךָ
  choice: నీ రెక్కల చాటున
  rationale: సֵתֶר దాగి రక్షణ పొందే స్థలాన్ని సూచిస్తుంది. ‘రెక్కల చాటున’ అనే సహజ తెలుగు ప్రయోగం దాచిపెట్టడం, కాపాడడం అనే రెండు భావాలనూ కలిగి ఉంది.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఈ ఆరాధనా లేదా సంగీత సూచిక యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం కాబట్టి ఊహాత్మకంగా అనువదించకుండా లిప్యంతరీకరించాం.
theological_decisions:
- issue: ‘నీ గుడారం’లోని పవిత్రస్థల భావచిత్రం
  choice: దేవాలయం లేదా పరలోక నివాసం అని వివరణాత్మకంగా మార్చకుండా ‘నీ గుడారం’ అనే మూల రూపకాన్ని నిలిపాం.
  alternative: నీ పవిత్రస్థలంలో / నీ నివాసంలో
  rationale: ఈ పదం దేవుని సన్నిధి, పవిత్రస్థలాన్ని జ్ఞాపకం చేయవచ్చు; అయితే ‘గుడారం’ అనే స్పష్టమైన నామవాచకాన్ని ఉంచడం వల్ల వచనం చెప్పినదానికంటే నిర్దిష్టమైన ఆరాధనా లేదా పరలోక అర్థాన్ని అనువాదం రుద్దదు.
- issue: మొదటి రెండు క్రియల ప్రార్థనాత్మక భావం
  choice: రెండింటినీ ‘నివసించనివ్వు’, ‘ఆశ్రయం పొందనివ్వు’ అనే కోరికగా వ్యక్తపరిచాం.
  alternative: నేను నివసిస్తాను; నేను ఆశ్రయం పొందుతాను
  rationale: మొదటి క్రియ కోహోర్టేటివ్; రెండవ క్రియ దానికి సమాంతరంగా ఉంది. అయినప్పటికీ ఈ రూపాల్లో సంకల్ప భావం కూడా ఉండగలదనే అస్పష్టతను పాదటిప్పణిలో గుర్తించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ప్రార్థనకు తగిన గౌరవభరితమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘గుడారం’, ‘రెక్కల చాటు’ అనే స్పష్టమైన కవితాత్మక రూపకాలను నిలిపాం; అనిశ్చితమైన ‘సెలా’ను అనువదించకుండా లిప్యంతరీకరించాం.
