    issue: First-person volitional verbs are rendered with permissive forms.
    rationale: “నివసించనివ్వు” / “ఆశ్రయం పొందనివ్వు” do not naturally mean “Let me dwell / let me take refuge” in Telugu. They obscure the psalmist’s first-person wish or resolve. The revision supplies explicit “నేను” and idiomatic optative wording.
  revised_text: 'నీ గుడారంలో నేను శాశ్వతంగా నివసించుగాక[a];

