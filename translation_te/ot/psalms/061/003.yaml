  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי הָיִ֣יתָ מַחְסֶ֣ה לִ֑/י מִגְדַּל עֹ֝֗ז מִ/פְּנֵ֥י אוֹיֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/003.yaml
  text: For you have been a refuge for me, a strong tower against the enemy.
translation:
  language: te
  text: 'ఎందుకంటే నీవు నాకు ఆశ్రయంగా నిలిచావు,

    శత్రువు నుండి కాపాడే బలమైన గోపురంగా నిలిచావు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַחְסֶה
  choice: ఆశ్రయం
  rationale: ప్రమాదం నుంచి రక్షణ పొందే చోటు అనే మూలార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מִגְדַּל עֹז
  choice: బలమైన గోపురం
  rationale: ‘బలం/దృఢత్వం గల గోపురం’ అనే హీబ్రూ రూపకాన్ని స్పష్టంగా, నేరుగా నిలుపుతుంది.
- source_word: מִפְּנֵי אוֹיֵב
  choice: శత్రువుకు ఎదురుగా
  rationale: מִפְּנֵי ఇక్కడ శత్రువు కలిగించే ముప్పు నుంచి రక్షణను సూచిస్తుంది; ‘ఎదురుగా’ అన్నది గోపురం శత్రువుకు ప్రతిఘటనగా నిలిచే భావాన్ని, ఆంగ్ల సంప్రదింపు పాఠంలోని ‘against’ భావాన్నీ కాపాడుతుంది.
theological_decisions:
- issue: దేవుడు ఆశ్రయం మరియు బలమైన గోపురం అనే రూపకం
  choice: రెండు రూపకాలనూ నేరుగా నిలుపుతూ ‘ఉన్నావు’ను రెండవ పాదంలో పునరుక్తి చేయడం
  alternative: రెండవ పాదాన్ని క్రియలేని సమాంతర వాక్యంగా ‘శత్రువుకు ఎదురుగా బలమైన గోపురం’ అని ఉంచడం
  rationale: హీబ్రూలోని ఒకే క్రియ రెండు రూపకాలకూ వర్తిస్తుంది. తెలుగులో పునరుక్తి భావాన్ని మార్చకుండా వాక్యాన్ని సహజంగా, స్పష్టంగా చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనా కవిత్వానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. హీబ్రూ సమాంతర నిర్మాణం రెండు పాదాలుగా నిలుపబడింది.
