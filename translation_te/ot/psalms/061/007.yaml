source:
  edition: WLC
  text: יֵשֵׁ֣ב ע֭וֹלָם לִ/פְנֵ֣י אֱלֹהִ֑ים חֶ֥סֶד וֶ֝/אֱמֶ֗ת מַ֣ן יִנְצְרֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/007.yaml
  text: May he sit enthroned before God forever[b][a]; appoint steadfast love and truth to guard him.
translation:
  language: te
  text: అతడు దేవుని సన్నిధిలో ఎప్పటికీ సింహాసనాసీనుడై ఉండుగాక[a]; అతనిని కాపాడుటకు స్థిరమైన ప్రేమను, సత్యాన్ని[b] నియమించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు దేవుని సన్నిధిలో ఎప్పటికీ నివసించుగాక.” ఇక్కడి హీబ్రూ క్రియకు “కూర్చోవడం,” “నిలిచి ఉండడం,” లేదా “నివసించడం” అనే అర్థాలు రావచ్చు; రాజును గూర్చిన ఈ సందర్భంలో సింహాసనంపై కొనసాగి పాలించే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “సత్యం” అనే పదాన్ని ఇక్కడ “నమ్మకత్వం” అని కూడా అనువదించవచ్చు. “స్థిరమైన ప్రేమ, సత్యం/నమ్మకత్వం” అనే హీబ్రూ పదజంట దేవుని నిబద్ధమైన ప్రేమను, విశ్వసనీయతను తరచుగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: సింహాసనాసీనుడై ఉండుగాక
  rationale: ישב అనే క్రియకు కూర్చోవడం, నివసించడం, నిలిచి ఉండడం అనే అర్థాలు ఉన్నాయి. ఇది రాజును గూర్చిన కీర్తన కావడం వల్ల సింహాసనంపై కొనసాగి పాలించాలనే ప్రార్థనా భావాన్ని ప్రధాన పాఠం వ్యక్తం చేస్తుంది; క్రియలోని నిజమైన సందిగ్ధతను పాదసూచిక నిలుపుతుంది.
- source_word: עוֹלָם
  choice: ఎప్పటికీ
  rationale: అంతం లేని లేదా నిరంతర కాలవ్యవధిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לִפְנֵי אֱלֹהִים
  choice: దేవుని సన్నిధిలో
  rationale: ‘దేవుని ఎదుట’ అనే మూలభావాన్ని, ఆయన సమక్షంలో జీవించడం లేదా పాలించడం అనే సంబంధాత్మక భావంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חֶסֶד
  choice: స్థిరమైన ప్రేమ
  rationale: חסדలోని ప్రేమ, నిలకడ, నిబద్ధత అనే భావాలను కలిపి తెలియజేస్తుంది; కేవలం ‘కరుణ’ అని చెప్పడం కంటే దీని విస్తృత అర్థాన్ని కాపాడుతుంది.
- source_word: אֱמֶת
  choice: సత్యం
  rationale: పదం యొక్క ప్రాథమిక అర్థాన్ని పారదర్శకంగా ఉంచుతుంది. חסדతో జతగా వచ్చినప్పుడు ‘నమ్మకత్వం’ అనే సందర్భోచిత భావం కూడా ఉండవచ్చని పాదసూచికలో తెలిపింది.
- source_word: מַן
  choice: నియమించు
  rationale: מנה నుండి వచ్చిన ఆజ్ఞార్థక రూపంగా గ్రహించి, ప్రేమ మరియు సత్యం రాజును కాపాడేలా దేవుడు వాటిని నియమించాలనే ప్రార్థనగా అనువదించబడింది.
- source_word: יִנְצְרֻהוּ
  choice: అతనికి కాపలాగా
  rationale: נצרలోని కాపాడడం, భద్రపరచడం అనే భావాన్ని తెలుపుతుంది. బహువచన క్రియకు అనుగుణంగా ప్రేమ, సత్యం వ్యక్తీకరించబడిన కాపలాదారులవలె పనిచేస్తున్న చిత్రాన్ని నిలుపుతుంది.
theological_decisions:
- issue: రాజును గూర్చిన ప్రార్థనలో అసంపూర్ణ క్రియారూపం యొక్క భావం
  choice: 'కోరిక లేదా ప్రార్థనగా: ‘ఉండుగాక’'
  alternative: 'సాధారణ భవిష్యత్తుగా: ‘ఉంటాడు’'
  rationale: చుట్టుపక్కల సందర్భం విన్నపభరితంగా ఉంది; రెండవ పాదంలో దేవునికి చేసిన ఆజ్ఞార్థక విన్నపం కూడా ఉంది. అందువల్ల మొదటి పాదాన్ని ప్రార్థనగా చదవడం వాక్య ఐక్యతకు సరిపోతుంది, అయితే భవిష్యదర్థం పూర్తిగా అసాధ్యం కాదు.
- issue: חֶסֶד וֶאֱמֶת అనే జంట పదాల భావం
  choice: ‘స్థిరమైన ప్రేమ, సత్యం’ అనే వ్యక్తీకరించబడిన దైవిక గుణాలు
  alternative: ‘స్థిరమైన ప్రేమ, నమ్మకత్వం’ లేదా ‘కరుణ, సత్యం’
  rationale: ఈ హీబ్రూ జంట దేవుని నిబద్ధమైన ప్రేమను, విశ్వసనీయతను తరచుగా సూచిస్తుంది. ప్రధాన పాఠంలో ‘సత్యం’ అనే ప్రత్యక్ష పదార్థాన్ని ఉంచి, సందర్భానికి బలమైన ‘నమ్మకత్వం’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనా కవిత్వానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘సింహాసనాసీనుడై’ అనే పదం కొంత సాహిత్యరంగు కలిగినదైనా రాజసందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘ఉండుగాక,’ ‘నియమించు’ రూపాలు విన్నప స్వరాన్ని నిలుపుతాయి.
