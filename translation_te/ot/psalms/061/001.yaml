  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలి. ‘ఆలకించు’ మరియు ‘శ్రద్ధగా విను’ అనే సమాంతర పదబంధాలు హీబ్రూ వాక్యంలోని రెండు వినికిడి క్రియల స్వల్ప భావభేదాన్ని నిలుపుతాయి.
