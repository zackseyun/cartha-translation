  yaml_path: translation/ot/psalms/061/001.yaml
  text: Hear my cry[a], O God; listen to my prayer.
translation:
  language: te
  text: దేవా, నా మొరను[a] ఆలకించు; నా ప్రార్థనను శ్రద్ధగా విను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా బిగ్గర మొరను’ లేదా ‘నా వేడుకోలును.’ హీబ్రూ నామవాచకం బిగ్గర కేకను, కొన్ని సందర్భాల్లో ఉల్లాసధ్వనిని లేదా గానాన్ని కూడా సూచించగలదు; ఇక్కడ ప్రార్థనా సందర్భం అత్యవసర మొర అనే అర్థానికే అనుకూలంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעָה
  choice: ఆలకించు
  rationale: దేవునికి ఉద్దేశించిన שׁמע అనే క్రియ యొక్క ఆజ్ఞార్థక రూపం. ‘ఆలకించు’ ప్రార్థనా సందర్భంలో సహజంగా ఉండి, వినమనే ప్రత్యక్ష విజ్ఞప్తిని నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ఇది ప్రత్యక్ష సంబోధన. ఆధునిక ప్రామాణిక తెలుగులో ‘దేవా’ సహజమైన, గౌరవప్రదమైన సంబోధన.
- source_word: רִנָּתִי
  choice: నా మొరను
  rationale: רִנָּה సందర్భానుసారం బిగ్గర కేక, మొర, లేదా ఉల్లాసధ్వని/గానం అనే అర్థాలను ఇవ్వగలదు. ఇక్కడ ‘నా ప్రార్థన’తో సమాంతరంగా ఉండటం వల్ల అత్యవసర విజ్ఞప్తిని తెలిపే ‘నా మొరను’ తగినది.
- source_word: הַקְשִׁיבָה
  choice: శ్రద్ధగా విను
  rationale: קשׁב హిఫీల్ ఆజ్ఞార్థకం కేవలం వినడమే కాక శ్రద్ధపెట్టి వినాలని కోరుతుంది. ‘శ్రద్ధగా విను’ మొదటి క్రియతో ఉన్న భావతీవ్రతను సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: תְּפִלָּתִי
  choice: నా ప్రార్థనను
  rationale: תְּפִלָּהకు నేరమైన, సాధారణ తెలుగు సమానం ‘ప్రార్థన’. ఇది ‘మొర’తో సమాంతరతను, అలాగే పదాల మధ్య భేదాన్ని నిలుపుతుంది.
theological_decisions: []
