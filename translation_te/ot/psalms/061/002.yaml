id: PSA.61.2
reference: Psalms 61:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִ/קְצֵ֤ה הָ/אָ֨רֶץ אֵלֶ֣י/ךָ אֶ֭קְרָא בַּ/עֲטֹ֣ף לִבִּ֑/י בְּ/צוּר יָר֖וּם מִמֶּ֣/נִּי תַנְחֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/002.yaml
  text: From the end of the earth I call to you when my heart grows faint[b][a]; lead me to a rock higher than I.
translation:
  language: te
  text: 'భూమి అంచు నుండి నేను నీకు మొరపెడుతున్నాను;

    నా హృదయం సొమ్మసిల్లుతున్నప్పుడు[a],

    నాకంటే ఎత్తైన బండ మీదికి[b] నన్ను నడిపించు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా హృదయం తట్టుకోలేకపోయినప్పుడు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నేను చేరలేనంత ఎత్తైన బండ మీదికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה הָאָרֶץ
  choice: భూమి అంచు నుండి
  rationale: קָצֶה సూచించే చివర లేదా అంచు భావాన్ని నిలుపుతూ, కీర్తనకర్త అనుభవిస్తున్న అత్యంత దూరాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אֵלֶיךָ אֶקְרָא
  choice: నేను నీకు మొరపెడుతున్నాను
  rationale: קרא అంటే పిలవడం లేదా మొరపెట్టడం. ప్రార్థనలోని ఆర్తిని తెలియజేయడానికి ‘మొరపెడుతున్నాను’ సహజంగా సరిపోతుంది.
- source_word: בַּעֲטֹף לִבִּי
  choice: నా హృదయం సొమ్మసిల్లుతున్నప్పుడు
  rationale: עטף ఇక్కడ అంతరంగ బలం క్షీణించడం, సొమ్మసిల్లడం లేదా పూర్తిగా తట్టుకోలేకపోవడం అనే భావాలను అనుమతిస్తుంది. ప్రధాన పాఠం బలహీనత చిత్రాన్ని నిలుపుతుంది; ప్రత్యామ్నాయ భావాన్ని పాదటీపులో ఉంచింది.
- source_word: בְּצוּר
  choice: బండ మీదికి
  rationale: צוּר అనే స్పష్టమైన ‘బండ’ రూపకాన్ని కాపాడుతుంది. నడిపించమనే క్రియతో తెలుగులో ‘బండ మీదికి’ సహజంగా ఉండి, ఎత్తైన సురక్షిత స్థలానికి చేర్చే దృశ్యాన్ని వ్యక్తపరుస్తుంది.
- source_word: יָרוּם מִמֶּנִּי
  choice: నాకంటే ఎత్తైన
  rationale: רוּם యొక్క తులనాత్మక భావాన్ని నేరుగా నిలుపుతుంది. ‘నేను చేరలేనంత ఎత్తైన’ అనే సాధ్యమైన అధికత లేదా అసాధ్యత భావాన్ని ప్రధాన పాఠంలో బలవంతంగా చేర్చకుండా పాదటీపులో ఇస్తుంది.
- source_word: תַנְחֵנִי
  choice: నన్ను నడిపించు
  rationale: Hiphil రూపంలోని נחהకు ‘నడిపించు’ లేదా ‘మార్గం చూపు’ అనే భావం ఉంది. ప్రార్థనకర్త ఆధారపడుతున్న భావాన్ని ‘నన్ను నడిపించు’ స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘బండ’ అనే రూపకం యొక్క భావం
  choice: దాన్ని సురక్షిత ఆశ్రయాన్ని సూచించే స్పష్టమైన ‘బండ’ రూపకంగానే నిలుపడం
  alternative: ‘సురక్షిత స్థలానికి’ లేదా ‘ఆశ్రయానికి’ అని వివరణాత్మకంగా అనువదించడం
  rationale: హీబ్రూ పాఠం צוּר అనే స్పష్టమైన కవితాత్మక చిత్రాన్ని ఉపయోగిస్తుంది. దేవుడే ఆశ్రయం అనే అంతర్భావాన్ని ప్రధాన పాఠంలో వివరించి నిర్ణయించకుండా, ఆ రూపకంలోని కవిత్వం మరియు వేదాంత ప్రతిధ్వనిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కవితాత్మక శైలిని ఉపయోగించాం. ‘మొరపెడుతున్నాను,’ ‘సొమ్మసిల్లుతున్నప్పుడు,’ ‘బండ’ వంటి పదాలు మూలంలోని ఆర్తి, బలహీనత, ఆశ్రయ రూపకాలను సహజంగా నిలుపుతాయి.
