lexical_decisions:
- source_word: אַךְ
  choice: వైపే
  rationale: ‘ఏ/మాత్రమే’ అనే నిశ్చయార్థక అవధారణ ద్వారా దేవునిపట్ల ఉన్న ప్రత్యేక, ఏకైక దృష్టిని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: אֶל
  choice: వైపు
  rationale: ఈ ఉపసర్గ దిశను లేదా అభిముఖతను సూచిస్తుంది. ‘దేవుని వైపు’ అనేది ప్రాణం దేవునివైపు మళ్లి ఉన్న భంగిమను కాపాడుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ ఏకవచన సూచనాత్మక సందర్భంలో ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది.
- source_word: דּוּמִיָּה
  choice: మౌనంగా ఉంది
  rationale: ఈ నామవాచకం మౌనం, నిశ్చలత, ప్రశాంతత అనే భావాలను కలిగి ఉంది. ప్రధాన పాఠం దాని ప్రాథమికమైన మౌన చిత్రాన్ని ఉంచుతుంది; నిరీక్షణ లేదా విశ్రాంతి అనే భావాలను స్పష్టంగా చేర్చి అర్థాన్ని కుదించదు.
- source_word: נַפְשִׁי
  choice: నా ప్రాణం
  rationale: נֶפֶשׁ వ్యక్తి, జీవం, అంతరంగం అనే పరిధిని కలిగి ఉంది. కవితాత్మక సందర్భంలో ‘నా ప్రాణం’ సహజంగా ఉండి మూలంలోని వ్యక్తిగత అంతరంగ భావాన్ని నిలుపుతుంది.
- source_word: מִמֶּנּוּ
  choice: ఆయన నుంచే
  rationale: ఈ రూపం మూలాన్ని సూచిస్తుంది. ‘నుంచే’ అనేది రక్షణకు దేవుడే మూలమనే వాక్యంలోని ప్రత్యేక అవధారణను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יְשׁוּעָתִי
  choice: నా రక్షణ
  rationale: ఈ పదం రక్షణ లేదా విడుదలను సూచించగలదు. ‘నా రక్షణ’ కీర్తనలోని భావస్థాయికి సరిపోతూ, కష్టంనుంచి విడుదల అనే స్పష్టమైన భావాన్నీ అనుమతిస్తుంది.
theological_decisions:
- issue: דּוּמִיָּה נַפְשִׁי అనే పదబంధ భావం
  choice: దేవునివైపు అభిముఖమైన ప్రశాంత మౌనానికి వ్యక్తీకరణ
  alternative: దేవునికోసం మౌనంగా నిరీక్షించడం; దేవునిలో విశ్రాంతి పొందడం
  rationale: హీబ్రూ నామవాచకం మౌనం, నిశ్చలత, ప్రశాంత నిరీక్షణను సూచించగలదు. ప్రధాన పాఠం ‘మౌనం’ అనే మూల చిత్రాన్ని కాపాడి, నిరీక్షణ లేదా విశ్రాంతి అనే ఒకే వివరణను తప్పనిసరి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కవితాత్మక శైలి. ‘నా ప్రాణం’ అనే సంప్రదాయబద్ధమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే పదబంధాన్ని ఉంచింది. హీబ్రూ వాక్యంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు నిలిపి, రెండో ఉపవాక్యంలో సహజ తెలుగు కోసం ‘వస్తుంది’ అనే క్రియను పూరించింది.
