source:
  edition: WLC
  text: אַ֤ךְ מִ/שְּׂאֵת֨/וֹ יָעֲצ֣וּ לְ/הַדִּיחַ֮ יִרְצ֪וּ כָ֫זָ֥ב בְּ/פִ֥י/ו יְבָרֵ֑כוּ וּ֝/בְ/קִרְבָּ֗/ם יְקַלְלוּ סֶֽלָה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/004.yaml
  text: They only plan to cast him down from his high position[a]; they delight in falsehood. With their mouth they bless, but inwardly they curse[b]. Selah
translation:
  language: te
  text: వారు అతని ఉన్నత స్థానం నుండి అతనిని దించివేయాలని మాత్రమే కుట్ర పన్నుతారు[a]; అబద్ధాన్ని ఇష్టపడతారు. తమ నోటితో దీవిస్తారు, కానీ లోలోపల శపిస్తారు[b]. సెలా
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతని ఘనత నుండి,” “అతని ఉన్నతి నుండి,” లేదా “అతని ప్రతిష్ఠిత స్థానం నుండి.”
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూలో అక్షరార్థంగా “అతని నోటితో వారు దీవిస్తారు.” అయితే భావం బహుశా సమూహార్థకం: బయటికి వారు దీవిస్తారు, కానీ లోలోపల శపిస్తారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: మాత్రమే
  rationale: ఈ సందర్భంలో శత్రువుల ఏకైక ఉద్దేశాన్ని పరిమితం చేసే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִשְּׂאֵתוֹ
  choice: అతని ఉన్నత స్థానం నుండి
  rationale: שְׂאֵת లోని ఎత్తు, ఘనత, ఉన్నతి అనే భావాలను సందర్భానుసారంగా కలిపి చూపుతుంది; అది సామాజిక హోదానా, రూపకాలంకారమైన ఉన్నతినా అని అతిగా నిర్దిష్టం చేయదు.
- source_word: יָעֲצוּ
  choice: పన్నాగం పన్నుతారు
  rationale: ఆలోచించి చేసే శత్రుత్వపూర్వక యోచనను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְהַדִּיחַ
  choice: పడదోయాలని
  rationale: ఉన్నత స్థితి నుండి కిందికి తోసివేయడం లేదా తొలగించడం అనే causative భావాన్ని సందర్భానికి తగినట్లు అందిస్తుంది.
- source_word: יִרְצוּ כָזָב
  choice: అబద్ధంలో ఆనందిస్తారు
  rationale: మోసాన్ని ఇష్టపడడం లేదా దానిలో సంతోషించడం అనే భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: בְּפִיו יְבָרֵכוּ
  choice: తమ నోటితో దీవిస్తారు
  rationale: హీబ్రూలో అక్షరార్థంగా ఏకవచన స్వామ్యరూపం కనిపించినా, సమాంతర నిర్మాణం మరియు సమూహ కర్త దృష్ట్యా బాహ్యంగా వారు పలికే దీవెన అనే భావాన్ని వ్యక్తం చేస్తుంది; పాఠ్య సమస్యను పాదటిప్పణిలో ఉంచింది.
- source_word: וּבְקִרְבָּם
  choice: లోలోపల
  rationale: వారి అంతరంగ వైఖరిని, నోటితో పలికే మాటలకు విరుద్ధంగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יְקַלְלוּ
  choice: శపిస్తారు
  rationale: ‘దీవిస్తారు’ అనే పదానికి ఉన్న స్పష్టమైన వ్యతిరేకతను యథాతథంగా నిలుపుతుంది.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఈ ఆరాధనా లేదా సంగీత పదం యొక్క ఖచ్చితమైన అర్థం అనిశ్చితమైనందున వ్యాఖ్యానాత్మక అనువాదం చేయకుండా లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: ‘అతని ఉన్నత స్థానం నుండి’ అనే పదబంధంలోని ఏకవచన ప్రత్యయం మరియు పడదోయబడే వ్యక్తి ఎవరు అన్న ప్రశ్న
  choice: శత్రువులు కీర్తనకర్తను లేదా ఆ నీతిమంత వ్యక్తిని అతని ఉన్నతమైన లేదా సురక్షితమైన స్థితి నుండి పడదోయాలని చూస్తున్నారు.
  alternative: ‘అతణ్ణి’ బదులు సాధారణమైన ‘ఒకణ్ణి’ అని ఇవ్వవచ్చు; లేదా ‘ఉన్నత స్థానం’ కంటే ‘గౌరవం/ఘనత’ను ప్రధానంగా చూపవచ్చు.
  rationale: హీబ్రూ ప్రత్యయం పుంలింగ ఏకవచనం; సందర్భంలో ఒక వ్యక్తి శత్రువుల లక్ష్యంగా ఉన్నాడు. ‘అతణ్ణి’ ఆ వ్యక్తిగత లక్ష్యాన్ని నిలుపుతూ ప్రత్యేకమైన మరొక theological referentను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కీర్తనా శైలిని నిలిపింది. ‘పన్నాగం పన్నుతారు’ శత్రుత్వపూర్వక deliberationను స్పష్టం చేస్తుంది; ‘ఉన్నత స్థానం’ మూలపదంలోని స్థానం/ఘనత అనిశ్చితిని పాదటిప్పణితో సంరక్షిస్తుంది.
