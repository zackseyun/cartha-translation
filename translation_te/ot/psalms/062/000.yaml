translation:
  language: te
  text: 'సంగీత నాయకునికి: యెదూతూను ప్రకారం[a]. దావీదు కీర్తన[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “యెదూతూను మీద,” “యెదూతూను కోసం” అని కూడా అర్థం కావచ్చు. ఈ మాట యెదూతూనుతో సంబంధమున్న సంగీత శైలి, స్వరబాణీ లేదా ప్రదర్శన సూచనను తెలియజేయవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “దావీదు” అనే శీర్షిక దావీదు రచనను, ఆయనకు అంకితాన్ని లేదా ఆయనతో అనుబంధాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకునికి
  rationale: కీర్తనల శీర్షికల్లో సంగీత ప్రదర్శనను పర్యవేక్షించే వ్యక్తిని సూచించే సంప్రదాయ అర్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עַל
  choice: ప్రకారం
  rationale: యెదూతూనుతో సంబంధమున్న స్వరబాణీ, సంగీత శైలి లేదా ప్రదర్శన సూచన అనే అవకాశాలను ఏదో ఒక్కదానికి పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: יְדוּתוּן
  choice: యెదూతూను
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించింది; ఇది యెదూతూను అనే సంగీతకారుణ్ణి గానీ, అతనితో సంబంధమున్న స్వరబాణీ లేదా శైలిని గానీ సూచించవచ్చు.
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: ఈ సాహిత్య-సంగీత ప్రక్రియకు తెలుగులో స్థిరపడిన, సాధారణ పాఠకులకు స్పష్టమైన పదం.
- source_word: לְדָוִד
  choice: దావీదు కీర్తన
  rationale: తెలుగులో సహజమైన శీర్షికా నిర్మాణం; రచన, అంకితం లేదా దావీదుతో అనుబంధం అనే హెబ్రీ పూర్వప్రత్యయ విస్తృతిని పాదటిప్పణితో నిలుపుతుంది.
theological_decisions:
- issue: శీర్షికలో לְדָוִד భావం
  choice: దావీదు కీర్తన
  alternative: దావీదు రచించిన కీర్తన / దావీదు కోసం కీర్తన
  rationale: హెబ్రీ నిర్మాణం రచయితత్వాన్ని మాత్రమే తప్పనిసరిగా నిర్ధారించదు. ప్రధాన పాఠంలో సహజమైన తెలుగు రూపాన్ని ఉంచి, దాని విస్తృత సాధ్యతలను పాదటిప్పణిలో తెలియజేయడం మూలంలోని అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన కీర్తన శీర్షిక. ‘ప్రకారం’ ద్వారా సంగీత సంబంధమైన అస్పష్టతను, పాదటిప్పణుల ద్వారా యెదూతూను మరియు దావీదు సంబంధాల విస్తృతిని కాపాడింది.
