  yaml_path: translation/ot/psalms/062/008.yaml
  text: Trust in him at all times[a], O people; pour out your hearts before him. God is a refuge for us[d][c][b]. Selah
translation:
  language: te
  text: ప్రజలారా, అన్ని వేళలా ఆయనపై నమ్మకం ఉంచండి[a]; మీ హృదయాలను ఆయన సన్నిధిలో కుమ్మరించండి[b]. దేవుడు మనకు ఆశ్రయం. సెలా[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ప్రతి సమయంలో’; ‘ఎల్లప్పుడూ’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘హృదయాలను కుమ్మరించండి’ అనేది తమ అంతరంగ ఆలోచనలు, కోరికలను దేవుని ఎదుట దాచకుండా వెల్లడించడాన్ని సూచించే హీబ్రూ రూపకం.
    reason: lexical_alternative
  - marker: c
    text: ‘సెలా’ బహుశా ఆరాధనా లేదా సంగీత సంబంధమైన పదం; దాని ఖచ్చితమైన అర్థం తెలియదు.
    reason: cultural_note
lexical_decisions:
- source_word: בִּטְחוּ בּוֹ
  choice: ఆయనను నమ్మండి
  rationale: בטח యొక్క బహువచన ఆజ్ఞారూపం దేవునిపై నమ్మకం ఉంచమనే అర్థాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘ఆయనను నమ్మండి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: בְכָל־עֵת
  choice: అన్ని వేళలా
  rationale: అక్షరార్థంగా ‘ప్రతి సమయంలో’; నిరంతరంగా, ఏ పరిస్థితిలోనైనా అనే విస్తృత భావాన్ని ‘అన్ని వేళలా’ నిలుపుతుంది.
- source_word: עָם
  choice: ప్రజలారా
  rationale: ఇది సమాజాన్ని నేరుగా సంబోధించే పదం. ‘ప్రజలారా’ ఆ సంబోధనను సహజమైన తెలుగు రూపంలో తెలియజేస్తుంది.
- source_word: שִׁפְכוּ ... לְבַבְכֶם
  choice: మీ హృదయాలను కుమ్మరించండి
  rationale: שפך అనే ‘కుమ్మరించు’ రూపకాన్ని నిలుపుతూ, לְבַבְכֶם లోని బహువచన సంబోధనకు అనుగుణంగా ‘మీ హృదయాలను’ వాడబడింది.
- source_word: לְפָנָיו
  choice: ఆయన సన్నిధిలో
  rationale: అక్షరార్థంలోని ‘ఆయన ముఖం ఎదుట’ అనే భావాన్ని తెలుగులో సహజంగా ‘ఆయన సన్నిధిలో’ తెలియజేస్తుంది.
- source_word: אֱלֹהִים מַחֲסֶה לָנוּ
  choice: దేవుడు మనకు ఆశ్రయం
  rationale: מַחֲסֶה రక్షణనిచ్చే ఆశ్రయాన్ని సూచిస్తుంది; לָנוּ ను ప్రయోజనార్థకంగా ‘మనకు’ అని అనువదించడం సహజం.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఈ ఆరాధనా లేదా సంగీత పదం యొక్క ఖచ్చితమైన అర్థం అనిశ్చితమైనందున అనువదించకుండా లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: עָם యొక్క సామూహిక సంబోధన
  choice: ‘ప్రజలారా’ అని ఆరాధక సమాజానికి నేర సంబోధనగా అనువదించడం
  alternative: సంబోధన భావం లేకుండా ‘ప్రజలు’ లేదా రాజకీయ భావమున్న ‘జాతి’
  rationale: ఆజ్ఞారూపాల మధ్య עָם సహజంగా సంబోధనగా పనిచేస్తుంది. ఈ రూపం వాక్యంలోని సామూహిక పిలుపును నిలుపుతుంది.
- issue: סֶלָה యొక్క అనిశ్చిత అర్థం
  choice: ‘సెలా’ అని అనువదించకుండా ఉంచడం
  alternative: ‘విరామం’ లేదా ‘సంగీత విరామం’ అని అర్థనిర్ణయం చేయడం
  rationale: పదం యొక్క ఖచ్చితమైన విధి తెలియనందున ఒక నిర్దిష్ట సంగీత లేదా ఆరాధనా అర్థాన్ని రుద్దకుండా లిప్యంతరీకరణ చేయడం పారదర్శకం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కవితాత్మక శైలి. ‘కుమ్మరించండి’ ద్వారా మూల రూపకం, ‘మీ హృదయాలను’ ద్వారా హీబ్రూ బహువచనం, ‘ప్రజలారా’ ద్వారా సామూహిక సంబోధన నిలుపబడ్డాయి.
