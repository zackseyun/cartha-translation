review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the plural imperatives, the vocative communal address (עָם), the plural ‘your hearts,’ God as refuge ‘for us,’ and untranslated Selah. However, ‘ఆయనను నమ్మండి’ can commonly mean ‘believe him’ (believe what he says), whereas בטחו בו here calls for placing one’s trust/confidence in him. ‘ఆయనపై నమ్మకం ఉంచండి’ preserves that relational force more precisely.
  naturalness: The revised phrasing is natural modern standard Telugu with an appropriately dignified psalmic register. ‘మీ హృదయాలను ఆయన సన్నిధిలో కుమ్మరించండి’ is an established and comprehensible metaphorical expression.
  terminology: ‘ఆశ్రయం’ appropriately renders מַחֲסֶה. ‘సన్నిధిలో’ naturally conveys לפניו. ‘సెలా’ appropriately transliterates the uncertain liturgical/musical term. The revised trust expression avoids a semantic shift toward mere credence.
  issues:
  - severity: medium
    issue: ‘ఆయనను నమ్మండి’ may mean ‘believe him’ rather than ‘trust in him.’
    rationale: The Hebrew בטח with ב calls for reliance or confidence placed in God. Telugu ‘ఆయనపై నమ్మకం ఉంచండి’ explicitly and naturally expresses that sense.
  - severity: low
    issue: Footnote b adds ‘బాధలను’ (sufferings), which is not part of the supplied audit-trail explanation.
    rationale: Although such an application may be pastorally plausible, the note should describe the idiom without adding a particular category of content not stated by the source or English audit trail.
