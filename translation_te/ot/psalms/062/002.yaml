source:
  edition: WLC
  text: אַךְ ה֣וּא צ֭וּרִ/י וִֽ/ישׁוּעָתִ֑/י מִ֝שְׂגַּבִּ֗/י לֹא אֶמּ֥וֹט רַבָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/002.yaml
  text: He alone is my rock and my salvation[a], my stronghold; I will not be greatly shaken.
translation:
  language: te
  text: 'ఆయనే నా బండ, నా రక్షణ,

    నా దుర్గం;

    నేను బాగా కదిలిపోను.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేను కదిలిపోను.’ హీబ్రూలో ‘బాగా’ లేదా ‘ఎక్కువగా’ అనే పరిమాణాన్ని తెలిపే పదం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: ఆయనే
  rationale: ఈ సందర్భంలో אַךְ దేవుడే ఏకైక భద్రతాధారమని నొక్కిచెబుతుంది. తెలుగులో ‘ఆయనే’ సహజంగా ఆ ప్రత్యేకతను తెలియజేస్తుంది.
- source_word: צוּרִי
  choice: నా బండ
  rationale: צוּר స్థిరత్వం, రక్షణను సూచించే శిల/బండ రూపకం. ‘నా బండ’ మూల రూపకాన్ని సరళంగా నిలుపుతుంది.
- source_word: וִישׁוּעָתִי
  choice: నా రక్షణ
  rationale: יְשׁוּעָה విడిపింపు లేదా రక్షణను సూచిస్తుంది. ఈ కీర్తనలోని భద్రతా సందర్భానికి ‘రక్షణ’ విస్తృతమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: מִשְׂגַּבִּי
  choice: నా దుర్గం
  rationale: מִשְׂגָּב సురక్షితమైన ఎత్తైన కోట లేదా ఆశ్రయస్థలాన్ని సూచిస్తుంది. ‘దుర్గం’ కోటసంబంధ రక్షణ రూపకాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לֹא אֶמּוֹט
  choice: నేను కదిలిపోను
  rationale: מוֹט నిఫాల్ రూపం కదలడం, తూలడం లేదా స్థిరత్వం కోల్పోవడాన్ని సూచిస్తుంది. ‘కదిలిపోను’ రూపకాన్నీ ఆధునిక తెలుగు సహజత్వాన్నీ కాపాడుతుంది.
- source_word: רַבָּה
  choice: ఎంతమాత్రమూ
  rationale: రַבָּה ఇక్కడ కదలిక పరిమాణాన్ని సూచించే క్రియావిశేషణ భావంలో ఉంది. నిరాకరణతో కలిపి ‘ఎంతమాత్రమూ’ అంటే ‘గొప్పగా/ఎక్కువగా కాదు’ అనే పరిమాణ భావం సహజ తెలుగులో వ్యక్తమవుతుంది; అయితే దీన్ని సంపూర్ణ నిరాకరణగా గ్రహించే అవకాశం ఉన్నందున పాదటిప్పణిలో ప్రత్యామ్నాయం స్పష్టం చేయబడింది.
theological_decisions:
- issue: చివరి వాక్యంలో భద్రత యొక్క పరిమాణం
  choice: నేను ఎంతమాత్రమూ కదిలిపోను
  alternative: నేను ఎక్కువగా కదిలిపోను
  rationale: హీబ్రూలో רַבָּה అనే పరిమాణ సూచకం ఉంది. ప్రధాన పాఠం కవితాత్మకంగా, సహజంగా ఉండేలా అనువదించగా, సమీపంలోని మరింత సంపూర్ణ వాక్యంతో దీనిని నిశ్శబ్దంగా సమానీకరించకుండా పరిమాణార్థాన్ని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కీర్తనా శైలి. ‘బండ’, ‘దుర్గం’ అనే మూల రూపకాలు నిలుపబడ్డాయి; పాద విభజన హీబ్రూ కవితా సమాంతరత్వాన్ని ప్రతిబింబిస్తుంది.
