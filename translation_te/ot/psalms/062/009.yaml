id: PSA.62.9
reference: Psalms 62:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַ֤ךְ הֶ֥בֶל בְּנֵֽי אָדָם֮ כָּזָ֪ב בְּנֵ֫י אִ֥ישׁ בְּ/מֹאזְנַ֥יִם לַ/עֲל֑וֹת הֵ֝֗מָּה מֵ/הֶ֥בֶל יָֽחַד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/009.yaml
  text: Surely the sons of man are a breath; the sons of men are a lie[a]. In the balances they go up; together they are lighter than a breath.
translation:
  language: te
  text: నిశ్చయంగా మానవులు ఊపిరివంటివారు; మనుష్యులు అసత్యమే[a]. త్రాసుపళ్లలో వారు పైకి లేస్తారు; వారందరూ కలిసి ఊపిరికంటే తేలికైనవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, వ్యాఖ్యానార్థంగా: “అల్పస్థాయి మనుషులు ఊపిరివంటివారు; ఉన్నతస్థాయి మనుషులు అసత్యమే.” హెబ్రీయ పాఠం మరింత అక్షరార్థంగా “మానవుని కుమారులు,” “పురుషుని కుమారులు” అని ఉంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: నిశ్చయంగా
  rationale: కీర్తనలోని బలమైన నిశ్చయార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הֶבֶל
  choice: ఊపిరి
  rationale: క్షణభంగురత, సారహీనత అనే భావాలతోపాటు హెబ్రీయ చిత్రాన్ని స్పష్టంగా నిలుపుతుంది; వచనం చివర కూడా ఇదే పదాన్ని వాడడం ద్వారా అనుసంధానం కాపాడబడింది.
- source_word: בְּנֵי אָדָם
  choice: ఆదాము కుమారులు
  rationale: ఆదామ్ అనే హెబ్రీయ పదరూపాన్ని, తరువాతి ఇష్‌తో ఉన్న కవితా భేదాన్ని సాధ్యమైనంత స్పష్టంగా కాపాడుతుంది; సామాజిక వర్గాలనే అర్థంగా ప్రధాన పాఠ్యంలో నిర్ణయించదు.
- source_word: כָּזָב
  choice: అబద్ధం
  rationale: అసత్యం లేదా నమ్మదగనితనాన్ని సంక్షిప్తంగా, బలంగా తెలియజేస్తూ ‘ఊపిరి’తో ఉన్న సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: בְּנֵי אִישׁ
  choice: మనుష్యుల కుమారులు
  rationale: ఇష్‌కు సాధారణమైన ‘మనుష్యులు’ అనే రూపాన్ని ఇచ్చి, ముందున్న ‘ఆదాము కుమారులు’తో పదభేదాన్ని కొంతవరకు కనిపించేలా ఉంచుతుంది.
- source_word: בְּמֹאזְנַיִם
  choice: త్రాసులో
  rationale: తూకం వేసే రెండు పళ్ల త్రాసు చిత్రాన్ని ఆధునిక పాఠకునికి సహజంగా తెలియజేస్తుంది.
- source_word: לַעֲלוֹת
  choice: పైకి లేస్తారు
  rationale: తక్కువ బరువు వల్ల త్రాసు పళ్లలో పైకి లేచే దృశ్యాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా నేరుగా కాపాడుతుంది.
- source_word: מֵהֶבֶל
  choice: ఊపిరికంటే తేలికే
  rationale: హెబ్రీయ తులనార్థాన్ని త్రాసు రూపకానికి సరిపోయే సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: יָחַד
  choice: వారందరూ కలిసినా
  rationale: అందరినీ సమష్టిగా తీసుకున్నా ఇదే తీర్పు వర్తిస్తుందనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: בְּנֵי אָדָם / בְּנֵי אִישׁ అనే జత పదబంధాల అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘ఆదాము కుమారులు / మనుష్యుల కుమారులు’ అని పదభేదాన్ని నిలుపడం
  alternative: ‘అల్పస్థాయి మనుషులు / ఉన్నతస్థాయి మనుషులు’ అని సామాజిక వర్గాలుగా వ్యాఖ్యానించడం
  rationale: సామాజిక స్థాయి వ్యత్యాసం సందర్భానుసారంగా సాధ్యమైన వ్యాఖ్యానమే అయినా, హెబ్రీయ పదాలు దానిని నేరుగా చెప్పవు. అందువల్ల అసలు పాఠ్యంలోని సందిగ్ధతను ప్రధాన పాఠ్యంలో కాపాడి, సామాజిక వ్యాఖ్యానాన్ని పాదటిప్పణిలో ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కీర్తనా శైలితో పాటు సాధారణ పాఠకునికి అర్థమయ్యే పదజాలం. ‘త్రాసులో పైకి లేస్తారు’ అనే రూపకం ఉద్దేశపూర్వకంగా నిలుపబడింది.
