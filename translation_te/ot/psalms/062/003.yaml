source:
  edition: WLC
  text: עַד אָ֤נָה תְּהֽוֹתְת֣וּ עַל אִישׁ֮ תְּרָצְּח֪וּ כֻ֫לְּ/כֶ֥ם כְּ/קִ֥יר נָט֑וּי גָּ֝דֵ֗ר הַ/דְּחוּיָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/003.yaml
  text: How long will you assail a man? Will you all break him down[a], like a leaning wall[c][b], a tottering fence?
translation:
  language: te
  text: ఒక మనిషి మీద మీరు ఎంతకాలం విరుచుకుపడతారు? వాలిన గోడలా, తోసివేయబడిన కంచెలా, అతన్ని మీరు అందరూ కూలదోస్తారా?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతన్ని హత్య చేస్తారా?’ అని కూడా అనువదించవచ్చు. మూలభాషలోని క్రియ సాధారణంగా హత్య చేయడం లేదా వధించడం అనే అర్థాన్ని ఇస్తుంది; అయితే తరువాతి గోడ, కంచె చిత్రాల దృష్ట్యా ఇక్కడ ‘కూలదోయడం’ అనే రూపకార్థం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఈ పోలిక దాడికి గురైన మనిషి బలహీనంగా, కూలిపోవడానికి దగ్గరగా ఉన్నాడని సూచించవచ్చు. మరికొందరు, దాడిచేసేవారే ముందుకు వాలిన గోడలా అతనిపై గుంపుగా పడుతున్నారని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּהֽוֹתְת֣וּ
  choice: విరుచుకుపడతారు
  rationale: ఈ అరుదైన క్రియ హింసాత్మకంగా దాడిచేయడం లేదా బలంగా మోదడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘విరుచుకుపడతారు’ శత్రుత్వంతో కూడిన సమష్టి దాడిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַל אִישׁ
  choice: ఒక మనిషి మీద
  rationale: אִישׁ ఇక్కడ ఏకవచన పురుషలింగంలో ఉండి, సాధారణ మానవజాతికన్నా దాడికి గురవుతున్న ఒక వ్యక్తిని సూచిస్తుంది.
- source_word: תְּרָצְּחוּ
  choice: అతన్ని కూలదోస్తారా
  rationale: רצח సాధారణంగా హత్యచేయడాన్ని సూచించినా, వెంటనే వచ్చే వాలిన గోడ, కూలిపోతున్న కంచె రూపకాలు ఇక్కడ ఒక వ్యక్తిని పూర్తిగా కూలదోయడం అనే సందర్భోచిత భావానికి బలం ఇస్తాయి. మూలపదంలోని ప్రాణాంతక హింసను పాదసూచికలో నిలిపాం.
- source_word: כֻלְּכֶם
  choice: మీరందరూ
  rationale: బహువచన సర్వనామంలోని సమష్టి ఉద్ఘాటనను సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: כְּקִיר נָטוּי
  choice: వాలిపోయిన గోడను
  rationale: నిలకడ కోల్పోయి పడిపోవడానికి దగ్గరగా ఉన్న గోడ చిత్రాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: גָּדֵר הַדְּחוּיָה
  choice: కూలిపోతున్న కంచెను
  rationale: דחה రూపం తోసివేయబడిన లేదా పక్కకు నెట్టబడిన స్థితిని సూచిస్తుంది; కవితా చిత్రంలోని అస్థిరతను ‘కూలిపోతున్న కంచె’ సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: గోడ, కంచె ఉపమానాలు ఎవరిని వర్ణిస్తున్నాయి?
  choice: దాడికి గురవుతున్న మనిషిని కూలదోయబడబోయే గోడ, కంచెతో పోల్చడం
  alternative: దాడిచేసేవారు ఉబ్బి ముందుకు వాలిన గోడలా అతనిపై గుంపుగా పడుతున్నారని అర్థం చేసుకోవడం
  rationale: పదక్రమం రెండు సంబంధాలకు కొంత అవకాశం ఇస్తుంది. అయితే తְּרָצְּחוּకు సందర్భోచితంగా ‘కూలదోస్తారు’ అని తీసుకున్నప్పుడు తరువాతి నిర్మాణాత్మక రూపకంతో సహజమైన అనుసంధానం ఏర్పడుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తన కవిత్వానికి తగిన గంభీరతతో పాటు సాధారణ పాఠకునికి అర్థమయ్యే సహజ పదజాలాన్ని వాడాం. ప్రశ్నార్థక ధోరణి, సమష్టి దాడి, కూలిపోతున్న నిర్మాణాల రూపకాన్ని నిలిపాం.
