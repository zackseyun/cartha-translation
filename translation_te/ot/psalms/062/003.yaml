  to: ఒక మనిషి మీద మీరు ఎంతకాలం విరుచుకుపడతారు? వాలిన గోడలా, తోసివేయబడిన కంచెలా, అతన్ని మీరు అందరూ కూలదోస్తారా?[a][b]
