source:
  edition: WLC
  text: אַחַ֤ת דִּבֶּ֬ר אֱלֹהִ֗ים שְׁתַּֽיִם ז֥וּ שָׁמָ֑עְתִּי כִּ֥י עֹ֝֗ז לֵ/אלֹהִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/011.yaml
  text: 'One thing God has spoken[a]; two things I have heard: that strength belongs to God.'
translation:
  language: te
  text: 'దేవుడు ఒక విషయం పలికాడు[a]; నేను రెండు విషయాలు విన్నాను: బలం దేవునికి చెందుతుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు ఒకసారి పలికాడు; నేను దీన్ని రెండుసార్లు విన్నాను.” హీబ్రూ వాక్యరీతిని ‘ఒకసారి/రెండుసార్లు’ అని గానీ, ‘ఒకటి/రెండు’ అనే సంఖ్యాత్మక జ్ఞానోక్తిగా గానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַת
  choice: ఒక మాట
  rationale: స్త్రీలింగ ఏకవచన సంఖ్యావాచకం ‘ఒకటి’ అని అర్థం. דִּבֶּר‌తో కలిసి, తరువాతి ‘రెండు’తో ఉన్న సంఖ్యాత్మక జ్ఞానోక్తి నిర్మాణాన్ని తెలుగులో సహజంగా చూపడానికి ‘ఒక మాట’ అని ఇచ్చాం.
- source_word: דִּבֶּר
  choice: పలికాడు
  rationale: పూర్తయిన దేవుని ఉచ్ఛారణను సూచించే ఈ క్రియకు గంభీరమైన, సహజమైన తెలుగు రూపం ‘పలికాడు’.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపంలో బహువచనమైనా ఇక్కడ ఏకవచనార్థంలో ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది.
- source_word: שְׁתַּיִם זוּ
  choice: రెండు విషయాలు
  rationale: ‘ఒకటి… రెండు’ అనే సంఖ్యాత్మక వాక్యరీతిలో זוּ తరువాత వెల్లడయ్యే విషయాన్ని సూచిస్తుంది; తెలుగులో భావం స్పష్టంగా ఉండేందుకు ‘విషయాలు’ చేర్చాం.
- source_word: שָׁמָעְתִּי
  choice: నేను … విన్నాను
  rationale: హీబ్రూ సంపూర్ణ క్రియను తెలుగులో సహజమైన భూతకాల రూపంతో అనువదించాం.
- source_word: כִּי
  choice: ':'
  rationale: ఇది విన్న విషయపు విషయవస్తువును పరిచయం చేస్తుంది; తెలుగులో ద్విబిందువు ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עֹז
  choice: బలం
  rationale: ఈ నామవాచకం శక్తి లేదా బలాన్ని సూచిస్తుంది; ‘బలం’ సాధారణ పాఠకులకు స్పష్టమైన, నేరమైన సమానార్థకం.
- source_word: לֵאלֹהִים
  choice: దేవునికే చెందుతుంది
  rationale: לְ ఇక్కడ స్వామ్యాన్ని లేదా ఆపాదనను సూచిస్తుంది. ‘దేవునికే’ అనే అవధారణ మూలంలోని దేవునికి బలం చెందుతుందనే ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘ఒకటి… రెండు’ అనే సంఖ్యాత్మక వాక్యరీతి
  choice: ‘దేవుడు ఒక మాట పలికాడు; నేను రెండు విషయాలు విన్నాను’
  alternative: ‘దేవుడు ఒకసారి పలికాడు; నేను దీన్ని రెండుసార్లు విన్నాను’
  rationale: హీబ్రూ పదాలను ‘ఒకసారి/రెండుసార్లు’ అనే క్రియావిశేషణాలుగా గానీ, ‘ఒకటి/రెండు’ అనే సంఖ్యాత్మక జ్ఞానోక్తిగా గానీ అర్థం చేసుకోవచ్చు. ప్రధాన పాఠం రెండవ అవకాశాన్ని అనుసరిస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి మూలంలోని నిజమైన సందిగ్ధతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన కవితా ధోరణిని ఉంచాం. ‘పలికాడు,’ ‘చెందుతుంది’ రూపాలు సహజత్వం, గౌరవం రెండింటినీ నిలుపుతాయి; [a] గుర్తు ప్రధాన పాఠంలో సంబంధిత సందిగ్ధ వాక్యానికి వెంటనే ఉంచబడింది.
