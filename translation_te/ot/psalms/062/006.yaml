lexical_decisions:
- source_word: אַךְ הוּא
  choice: ఆయనే
  rationale: אַךְ ఇక్కడ ప్రత్యేకతను, ఉద్ఘాటనను సూచిస్తుంది. తెలుగు ‘ఆయనే’ దేవుడొక్కడే అని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: צוּרִי
  choice: నా బండ
  rationale: צוּר దేవుని స్థిరత్వం, రక్షణను తెలిపే రూపకం. ‘నా బండ’ ఆ రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: וִישׁוּעָתִי
  choice: నా రక్షణ
  rationale: יְשׁוּעָה విమోచన, కాపుదల, రక్షణ అనే విస్తృత భావాన్ని కలిగి ఉంది; ‘రక్షణ’ ఆ విస్తృతిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מִשְׂגַּבִּי
  choice: నా దుర్గం
  rationale: מִשְׂגָּב ఎత్తైన, సురక్షితమైన ఆశ్రయస్థలాన్ని సూచిస్తుంది. ‘దుర్గం’ రక్షణాత్మక స్థిరత్వాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא אֶמּוֹט
  choice: నేను కదిలిపోను
  rationale: మוט్ నిఫాల్ రూపం కదిలించబడడం, స్థిరత్వం కోల్పోవడం అనే భావాన్ని ఇస్తుంది. ‘కదిలిపోను’ కీర్తనకర్త నమ్మకాన్ని, స్థిరత్వ రూపకాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: చివరి వాక్యంలో వ్యక్తమయ్యే నమ్మక స్థాయి
  choice: నేను కదిలిపోను
  alternative: నేను చలించను
  rationale: హీబ్రూ దేవునిలోని భద్రతవల్ల కలిగే దృఢ నమ్మకాన్ని వ్యక్తం చేస్తుంది. ‘కదిలిపోను’ స్థిరత్వ రూపకాన్ని కాపాడుతూ, సంపూర్ణ అభేద్యత అనే భావాన్ని అనవసరంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కీర్తనా శైలి. మూలంలోని సమాంతర నామవాక్య నిర్మాణం, బండ–రక్షణ–దుర్గం అనే రూపకాల వరుస నిలుపబడింది.
