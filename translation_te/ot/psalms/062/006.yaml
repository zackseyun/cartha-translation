  text: He alone is my rock and my salvation[a], my stronghold; I will not be shaken.
translation:
  language: te
  text: ఆయనే నా బండ, నా రక్షణ, నా దుర్గం; నేను కదిలిపోను[a].
  philosophy: optimal-equivalence
