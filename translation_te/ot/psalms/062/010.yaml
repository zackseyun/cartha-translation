review_pass:
  verdict: revise
  source_fidelity: The draft correctly takes עשק as oppression/exploitation, גזל as robbery, חיל as wealth, and the final idiom as a warning against inward attachment. However, it narrows גזל to stolen goods (“బలవంతంగా దోచుకున్నదానిపై”), whereas the Hebrew may refer to robbery as an act or practice. The concessive “పెరిగినా” is possible but “పెరిగితే” more directly reflects the conditional force of כי יָנוּב.
  naturalness: The current final clause, “దానిపై మీ హృదయం నిలపవద్దు,” lacks the required object marking for “heart” in natural Telugu. “మీ హృదయాన్ని దానిపై నిలపవద్దు” is grammatical and idiomatic. The revised middle clause is also less cumbersome.
  terminology: “అణచివేత” distinguishes עשק from “దోపిడీ” for גזל. “వ్యర్థమైన ఆశ” reasonably renders one contextual reading of the difficult תֶּהְבָּלוּ without presenting it as certain. The footnote preserves viable alternatives and is anchored to the disputed expression itself.
  issues:
  - severity: medium
    issue: The rendering of גָזֵל is overly narrowed to property already seized by force.
    rationale: The noun can denote robbery/plunder as an act or practice, not only “what was forcibly stolen.” Rendering it as “దోపిడీ విషయంలో” retains the broader Hebrew ambiguity.
  - severity: medium
    issue: The final Telugu clause is grammatically incomplete.
    rationale: '“హృదయం నిలపవద్దు” needs the accusative object: “మీ హృదయాన్ని ... నిలపవద్దు.”'
  - severity: low
    issue: The footnote marker is placed after the whole second sentence rather than immediately after the difficult middle expression.
    rationale: Moving the marker to “వ్యర్థమైన ఆశ” makes its lexical scope clear.
  - severity: low
    issue: “పెరిగినా” gives the clause a concessive emphasis.
    rationale: The Hebrew permits contextual flexibility, but “పెరిగితే” more directly expresses the conditional reading adopted in the English audit trail.
  revised_text: అణచివేతపై నమ్మకం పెట్టుకోవద్దు; దోపిడీ విషయంలో వ్యర్థమైన ఆశ పెట్టుకోవద్దు[a]. సంపద పెరిగితే, మీ హృదయాన్ని దానిపై నిలపవద్దు.
