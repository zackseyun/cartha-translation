source:
  edition: WLC
  text: אַל תִּבְטְח֣וּ בְ/עֹשֶׁק֮ וּ/בְ/גָזֵ֪ל אַל תֶּ֫הְבָּ֥לוּ חַ֤יִל כִּֽי יָנ֑וּב אַל תָּשִׁ֥יתוּ לֵֽב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/010.yaml
  text: Do not trust in oppression[a], and do not put vain hope in robbery; if wealth increases, do not set your heart on it.
translation:
  language: te
  text: అణచివేతపై నమ్మకం పెట్టుకోవద్దు; దోపిడీ విషయంలో వ్యర్థమైన ఆశ పెట్టుకోవద్దు[a]. సంపద పెరిగితే, మీ హృదయాన్ని దానిపై నిలపవద్దు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దోపిడీ విషయంలో వ్యర్థంగా ప్రవర్తించవద్దు,” లేదా “దోపిడిని బట్టి గొప్పలు చెప్పుకోవద్దు.” ఇక్కడి హెబ్రీ క్రియ అర్థనిర్ణయం కష్టమైనది; అది వ్యర్థంగా ప్రవర్తించడం లేదా శూన్యమైన దానిపై ఆశ పెట్టుకోవడం అనే భావాన్ని ఇవ్వవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּבְטְחוּ
  choice: నమ్మకం పెట్టుకోవద్దు
  rationale: בטח అంటే సాధారణంగా నమ్మడం లేదా ఆధారం పెట్టుకోవడం. ఈ సందర్భంలో అన్యాయ మార్గాలపై ఆధారపడవద్దనే హెచ్చరికను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְעֹשֶׁק
  choice: దోపిడీపై
  rationale: עֹשֶׁקలో అణచివేత, బలవంతపు వసూళ్లు, అన్యాయ దోపిడీ అనే భావాలు ఉన్నాయి. సందర్భం ఆర్థిక అన్యాయాన్ని సూచిస్తున్నందున ‘దోపిడీ’ విస్తృతంగానూ సహజంగానూ సరిపోతుంది.
- source_word: בְגָזֵל
  choice: బలవంతంగా దోచుకున్నదానిపై
  rationale: גָזֵל బలప్రయోగంతో లాక్కోవడాన్ని లేదా అలా దోచుకున్న సొత్తును సూచించగలదు. నామరూపంలోని ఈ భావాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: תֶּהְבָּלוּ
  choice: వ్యర్థమైన ఆశ పెట్టుకోవద్దు
  rationale: הבל మూలానికి శూన్యత, వ్యర్థత అనే భావం ఉంది; ఈ క్రియ యొక్క ఖచ్చిత భావం కఠినమైనది. సమాంతర వాక్య నిర్మాణంలో ఖాళీదానిపై ఆశ పెట్టుకోవడమనే భావాన్ని ఈ అనువాదం చదవదగిన రీతిలో ఇస్తుంది.
- source_word: חַיִל
  choice: సంపద
  rationale: חַיִל బలం, వనరులు, సంపదను సూచించగలదు. ‘పెరగడం’ అనే క్రియతో ఇక్కడ భౌతిక సంపద భావమే సందర్భోచితం.
- source_word: כִּי יָנוּב
  choice: పెరిగినా
  rationale: נוב అక్షరార్థంగా మొలకెత్తడం లేదా వృద్ధి చెందడం. సంపదతో కలిసినప్పుడు ‘పెరగడం’ సహజమైన తెలుగు; כִּי యొక్క సందర్భానుగుణ concessive/conditional బలాన్ని ‘పెరిగినా’ వ్యక్తం చేస్తుంది.
- source_word: תָּשִׁיתוּ לֵב
  choice: దానిపై మీ హృదయం నిలపవద్దు
  rationale: שׁית לב అనే నుడికారం హృదయాన్ని లేదా అంతరంగ దృష్టిని దేనిమీదైనా నిలపడం, దానికే అంటిపెట్టుకోవడం అనే భావం ఇస్తుంది. ‘హృదయం’ అనే హెబ్రీయ మానవశాస్త్రీయ రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: మధ్య పాదంలోని תֶּהְבָּלוּ భావం
  choice: బలవంతంగా దోచుకున్నదానిపై వ్యర్థమైన ఆశ పెట్టుకోవద్దు
  alternative: దోపిడీలో వ్యర్థులుగా మారవద్దు; లేదా దోపిడిని బట్టి గొప్పలు చెప్పుకోవద్దు
  rationale: క్రియకు శూన్యత లేదా వ్యర్థత అనే మూలభావం ఉన్నా, సందర్భంలో ‘నమ్మకం పెట్టుకోవద్దు’ అనే మొదటి పాదానికి సమాంతరంగా ఖాళీ ఆశను సూచించవచ్చు. అయితే ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఉంచి అసలు వచనంలోని సందిగ్ధతను కాపాడాం.
- issue: అన్యాయ సంపద నుండి సాధారణ సంపదకు హెచ్చరిక విస్తరణ
  choice: మొదటి రెండు పాదాలు అన్యాయ సాధనాలపై ఆధారాన్ని నిషేధిస్తాయి; చివరి పాదం పెరుగుతున్న సంపదపైనే హృదయం నిలపవద్దని విస్తరిస్తుంది
  alternative: మూడవ పాదంలోని సంపద కూడా కేవలం అన్యాయంగా సంపాదించిన సంపదనే సూచిస్తుంది
  rationale: మూడవ పాదం חַיִל అనే సాధారణ పదాన్ని వాడుతుంది. అందువల్ల అన్యాయ సంపాదనను మించి, పెరుగుతున్న సంపదపై అంతరంగ ఆధారాన్ని ఉంచవద్దనే విస్తృత హెచ్చరికను అనువాదం తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘దోపిడీ’ మరియు ‘బలవంతంగా దోచుకున్నది’ ద్వారా עֹשֶׁק, גָזֵל మధ్య ఉన్న భావభేదాన్ని కొంతవరకు నిలిపాం; ‘హృదయం నిలపడం’ అనే రూపకాన్ని సహజంగా సంరక్షించాం.
