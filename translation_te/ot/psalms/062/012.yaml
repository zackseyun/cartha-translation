source:
  edition: WLC
  text: וּ/לְ/ךָֽ אֲדֹנָ֥/י חָ֑סֶד כִּֽי אַתָּ֨ה תְשַׁלֵּ֖ם לְ/אִ֣ישׁ כְּֽ/מַעֲשֵֽׂ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/012.yaml
  text: And to you[a], O Lord, belongs steadfast love[b], for you repay each man according to his work.
translation:
  language: te
  text: ప్రభువా, నిబద్ధమైన ప్రేమ నీదే[a]; ఎందుకంటే నీవు ప్రతి మనిషికి అతని కార్యాన్ని బట్టి ప్రతిఫలం చెల్లిస్తావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువా, నిబద్ధమైన ప్రేమ నీకు చెందుతుంది.” హీబ్రూలో ఇది క్రియలేని వాక్యం; “నీకు” అనే మాట ముందుకు వచ్చి, నిబద్ధమైన ప్రేమ ప్రభువుకే చెందుతుందని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְךָ
  choice: నీదే
  rationale: ముందుకు తెచ్చిన לְךָ స్వామ్యాన్ని లేదా ఆపాదనను బలంగా సూచిస్తుంది. తెలుగులో ‘నీదే’ సహజంగా ఉండి ఆ ఉద్ఘాటనను నిలుపుతుంది.
- source_word: אֲדֹנָי
  choice: ప్రభువా
  rationale: దైవ బిరుదైన అֲדֹנָי ఇక్కడ ప్రత్యక్ష సంబోధనలో ఉంది; ‘ప్రభువా’ ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా, సహజంగా ఉంది.
- source_word: חָסֶד
  choice: నిబద్ధమైన ప్రేమ
  rationale: חֶסֶד లోని నిలకడైన ప్రేమ, విశ్వసనీయత, కృప అనే భావాలను ‘నిబద్ధమైన ప్రేమ’ సంక్షిప్తంగా మోస్తుంది; కేవలం ‘కరుణ’ అని పరిమితం చేయదు.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా ఆధారాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: תְשַׁלֵּם
  choice: ప్రతిఫలం ఇస్తావు
  rationale: పియేల్ రూపం వ్యక్తికి తగినదాన్ని తిరిగి చెల్లించడం లేదా అనుగుణంగా ప్రతిఫలించడం సూచిస్తుంది. ఈ తెలుగు పదబంధం మంచి లేదా చెడు రెండింటికీ వర్తించే న్యాయప్రతిఫల భావాన్ని తెరిచి ఉంచుతుంది.
- source_word: לְאִישׁ
  choice: ప్రతి మనిషికి
  rationale: ఏకవచన పురుషలింగ పదమైన אִישׁ ఇక్కడ ప్రతినిధి లేదా పంపిణీ భావంలో ఉంది; ‘ప్రతి మనిషికి’ మూలంలోని రూపాన్నీ సందర్భంలోని సాధారణ వర్తింపునీ నిలుపుతుంది.
- source_word: כְּמַעֲשֵׂהוּ
  choice: అతని చేసినదాని ప్రకారం
  rationale: వ్యక్తి చేసిన కార్యానికి అనుగుణంగా ప్రతిఫలం ఉంటుందనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ ఏకవచన ప్రత్యయాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దేవుని నిబద్ధమైన ప్రేమకూ ఆయన న్యాయప్రతిఫలానికీ మధ్య సంబంధం
  choice: నిబద్ధమైన ప్రేమను, ప్రతి మనిషికి అతని చేసినదాని ప్రకారం ప్రతిఫలం ఇవ్వడాన్ని రెండింటినీ మృదువుపరచకుండా కలిపి ఉంచడం
  alternative: חסד ను కేవలం కరుణగా పరిమితం చేయడం లేదా תשלם ను సానుకూల బహుమతికే పరిమితం చేయడం
  rationale: మూలవాక్యం దైవిక నిబద్ధ ప్రేమను న్యాయమైన ప్రతిఫలంతో కలిపి ఉంచుతుంది. ‘ప్రతిఫలం ఇస్తావు’ అనేది అనుకూలమైనదైనా ప్రతికూలమైనదైనా తగిన ఫలితం అనే విస్తృత భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనా శైలికి తగిన గౌరవప్రదమైన ప్రత్యక్ష సంబోధన. ‘నిబద్ధమైన ప్రేమ’ ద్వారా חסד లోని ప్రేమ మరియు విశ్వసనీయత రెండూ, ‘ప్రతిఫలం ఇస్తావు’ ద్వారా తీర్పు లేదా బహుమతి రెండింటికీ తెరిచి ఉన్న ప్రతిఫల భావం నిలుపబడ్డాయి.
