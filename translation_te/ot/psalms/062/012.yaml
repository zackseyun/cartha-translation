  source_fidelity: The draft accurately conveys the Hebrew verbless attribution clause ('to you ... steadfast love') and preserves the explanatory force of כִּי. It also rightly leaves תְשַׁלֵּם broad, encompassing just recompense rather than only positive reward. However, 'అతని చేసినదాని ప్రకారం' is less precise and idiomatic than a direct rendering of מַעֲשֶׂה, 'his deed/work.'
