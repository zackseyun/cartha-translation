  terminology: '''ప్రభువా,'' ''నిబద్ధమైన ప్రేమ,'' and ''ప్రతి మనిషికి'' are suitable. ''ప్రతిఫలం చెల్లిస్తావు'' retains the judicially neutral recompense sense more effectively than language limited to reward.'
  issues:
