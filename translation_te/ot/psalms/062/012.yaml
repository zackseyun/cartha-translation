  revised_text: ప్రభువా, నిబద్ధమైన ప్రేమ నీదే[a]; ఎందుకంటే నీవు ప్రతి మనిషికి అతని కార్యాన్ని బట్టి ప్రతిఫలం చెల్లిస్తావు.
