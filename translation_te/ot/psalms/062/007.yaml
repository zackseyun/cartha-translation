  text: On God rest my salvation and my glory[a]; the rock of my strength, my refuge[b], is in God.
translation:
  language: te
  text: నా రక్షణ, నా ఘనత దేవునిపైనే ఆధారపడి ఉన్నాయి[a]; నా బలానికి బండయైన నా ఆశ్రయం దేవునిలోనే ఉంది.
  philosophy: optimal-equivalence
  footnotes:
