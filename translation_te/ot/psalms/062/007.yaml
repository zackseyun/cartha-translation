    text: 'మరింత రూపానుసారంగా: “దేవునిపైనే నా రక్షణ, నా ఘనత ఉన్నాయి.” “నా ఘనత”ను “నా గౌరవం” అని కూడా అర్థం చేసుకోవచ్చు; అంటే కీర్తనకర్త గౌరవం లేదా అతడు నిర్దోషిగా సమర్థించబడటం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: దేవునిపైనే ఆధారపడి ఉన్నాయి
  rationale: ఈ విభక్తి రక్షణ, ఘనత దేవునిపై ఆధారపడి ఉన్నాయని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ఆ ఆధార భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఇశ్రాయేలు దేవుణ్ణి సూచించే אֱלֹהִיםకు ప్రామాణిక తెలుగు సమానార్థకం.
- source_word: יִשְׁעִי
  choice: నా రక్షణ
  rationale: విడుదల, కాపాడటం అనే విస్తృత భావాన్ని నిలుపుకునే సహజమైన కీర్తనల పదప్రయోగం.
- source_word: וּכְבוֹדִי
  choice: నా ఘనత
  rationale: כָּבוֹדలోని మహిమ, గౌరవం, ప్రతిష్ఠ భావాలను సందర్భానుసారంగా కలిగివుండగల పదం; కీర్తనకర్త గౌరవం లేదా సమర్థన దేవునిపై ఆధారపడిందనే భావాన్ని తెరిచి ఉంచుతుంది.
- source_word: צוּר
  choice: బండ
  rationale: స్థిరత్వం, రక్షణను సూచించే మూల రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: עֻזִּי
  choice: నా బలమైన
  rationale: צוּרతో కలిసి 'నా బలమైన బండ'గా అనువదించడం తెలుగులో సహజంగా ఉండి, עֹז యొక్క బలం అనే అర్థాన్ని నిలుపుతుంది; ప్రత్యేకంగా 'కోట' అనే చిత్రాన్ని చేర్చదు.
- source_word: מַחְסִי
  choice: నా ఆశ్రయం
  rationale: రక్షణ పొందే స్థలం అనే భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בֵּאלֹהִים
  choice: దేవునిలోనే ఉన్నాయి
  rationale: కీర్తనకర్త బలమైన బండ, ఆశ్రయం దేవునిలో ఉన్నాయని తెలిపే స్థాన/ఆధార భావాన్ని వ్యక్తం చేస్తుంది; హీబ్రూలో లేని సంధాన క్రియను తెలుగులో అవసరానుసారం సరఫరా చేసింది.
theological_decisions:
- issue: ప్రారంభంలోని עַל అనే విభక్తి పదబంధం మరియు క్రియలేని వాక్యాల సంబంధం
  choice: కీర్తనకర్త రక్షణ, ఘనత దేవునిపైనే ఆధారపడి ఉన్నాయని తెలిపే ఒప్పుకోలుగా అనువదించడం
  alternative: మరింత రూపానుసారంగా, ‘దేవునిపైనే నా రక్షణ, నా ఘనత ఉన్నాయి’ అని అనువదించడం
  rationale: హీబ్రూ కవిత్వంలో వాక్యం క్రియలేకుండా ఉంది. ఎంచుకున్న అనువాదం దేవునిపై ఆధారపడే రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది; సిద్ధాంతపరమైన అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
- issue: כְבוֹדִי యొక్క భావ పరిధి
  choice: నా ఘనత
  alternative: నా గౌరవం
  rationale: మూలపదం మహిమ, ఘనత, గౌరవం లేదా ప్రతిష్ఠను సూచించగలదు. ‘ఘనత’ కవితాత్మక గాంభీర్యాన్ని నిలుపుతూ, కీర్తనకర్త గౌరవం లేదా సమర్థన అనే భావాన్ని నిరోధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, కీర్తనా శైలికి తగిన గౌరవప్రదమైన ధోరణి. ‘బండ’ అనే మూల రూపకాన్ని నిలిపి, ‘కోట’ వంటి అదనపు చిత్రాన్ని చేర్చలేదు.
