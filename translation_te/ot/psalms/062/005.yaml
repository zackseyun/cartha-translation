  yaml_path: translation/ot/psalms/062/005.yaml
  text: For God alone[a], be silent, my soul[c][b], for my hope is from him.
translation:
  language: te
  text: నా ప్రాణమా, దేవుని వైపే[a] మౌనంగా ఉండు[b]; ఎందుకంటే నా నిరీక్షణ ఆయన నుండి వస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, క్రియను ఉద్బోధగా కాక స్థితిని తెలిపే ప్రకటనగా తీసుకుంటే, ‘దేవుని వైపు మాత్రమే నా ప్రాణం మౌనంగా నిరీక్షిస్తుంది.’
    reason: alternative_reading
  - marker: b
    text: హీబ్రూ క్రియకు మౌనంగా ఉండడం, నిశ్చలంగా ఉండడం, లేదా నిశ్శబ్దంగా వేచి ఉండడం అనే భావాలు ఉండవచ్చు; అందువల్ల కొందరు ‘నిశ్శబ్దంగా వేచి ఉండు’ అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: కోసమే
  rationale: אַךְ దేవుడే ప్రత్యేకమైన, ఏకైక లక్ష్యమని నొక్కిచెబుతుంది. తెలుగు ‘-ఏ’ ప్రత్యయం ఈ ప్రత్యేకతను సహజంగా తెలియజేస్తుంది.
- source_word: לֵאלֹהִים
  choice: దేవుని కోసం
  rationale: לְ అనే ఉపసర్గలోని దేవునివైపు దృష్టి లేదా ఆయన కొరకు ఉండే భావాన్ని నిలుపుతుంది. తెలుగులో సహజమైన వాక్యనిర్మాణం కోసం אַךְ భావంతో కలిపి ‘దేవుని కోసమే’ అని ఇచ్చాం.
- source_word: דּוֹמִּי
  choice: మౌనంగా ఉండు
  rationale: דמם మూలానికి చెందిన ఈ రూపాన్ని కీర్తనకర్త తన ప్రాణానికి చేసే ఉద్బోధగా తీసుకున్నాం. ‘వేచియుండు’ అనే సందర్భార్థాన్ని ప్రధాన పాఠంలో అదనంగా చేర్చకుండా ప్రత్యక్ష అర్థాన్ని నిలిపాం.
- source_word: נַפְשִׁי
  choice: నా ప్రాణమా
  rationale: కీర్తనల్లో కనిపించే స్వీయసంబోధనను నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా మరియు సహజంగా ఉంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఉద్బోధకు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: מִמֶּנּוּ
  choice: ఆయన నుండి
  rationale: ఈ సర్వనామం దేవుణ్ణి తిరిగి సూచిస్తుంది. ‘ఆయన నుంచే’ అని చెప్పి אַךְ యొక్క ప్రత్యేకతను ఈ పదబంధానికి మార్చకుండా మూలపాఠంలోని అనుసంధానాన్ని నిలిపాం.
- source_word: תִּקְוָתִי
  choice: నా నిరీక్షణ
  rationale: תִּקְוָה లోని ఆశతో కూడిన ఎదురుచూపు భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఈ వాక్యాన్ని స్థితిని తెలిపే ప్రకటనగా తీసుకోవాలా, లేక తన ప్రాణానికి చేసే ఉద్బోధగా తీసుకోవాలా?
  choice: 'ఉద్బోధ: ‘మౌనంగా ఉండు, నా ప్రాణమా’'
  alternative: 'ప్రకటన: ‘దేవుని కోసమే నా ప్రాణం మౌనంగా వేచియున్నది’'
  rationale: స్వరచిహ్నాలతో ఉన్న דּוֹמִּי రూపాన్ని తన ప్రాణాన్ని నేరుగా సంబోధించే ఉద్బోధగా తీసుకోవచ్చు. అయితే ప్రకటనాత్మక పఠనం కూడా సాధ్యమే కాబట్టి దానిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనలోని గంభీరమైన స్వీయసంబోధనను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదాలు వాడాం. ‘ప్రాణమా’ కీర్తనా శైలిని నిలుపుతుంది; ‘మౌనంగా ఉండు’ మూల క్రియకు దగ్గరగా ఉండి, ‘వేచియుండు’ అనే విస్తృత సందర్భార్థాన్ని పాదసూచికలో ఉంచుతుంది.
