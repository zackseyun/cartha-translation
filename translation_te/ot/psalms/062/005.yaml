- from: నా ప్రాణమా, దేవుని కోసమే[a][c] మౌనంగా ఉండు[b]; ఎందుకంటే నా నిరీక్షణ ఆయన నుండి కలుగుతుంది.
  to: నా ప్రాణమా, దేవుని వైపే[a] మౌనంగా ఉండు[b]; ఎందుకంటే నా నిరీక్షణ ఆయన నుండి వస్తుంది.
