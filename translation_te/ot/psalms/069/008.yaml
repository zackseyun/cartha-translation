id: PSA.69.8
reference: Psalms 69:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מ֭וּזָר הָיִ֣יתִי לְ/אֶחָ֑/י וְ֝/נָכְרִ֗י לִ/בְנֵ֥י אִמִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/008.yaml
  text: I have become a stranger to my brothers[b][a], and a foreigner to my mother's sons.
translation:
  language: te
  text: 'నా సోదరులకు నేను పరాయివాడినయ్యాను[a];

    నా తల్లి కుమారులకు అన్యుడినయ్యాను[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నేను పరాయివాడిగా ఉన్నాను.’ హీబ్రూ క్రియను సాధారణ గతస్థితిగా గానీ, ఆ స్థితిలోకి వచ్చిన భావంతో గానీ అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘నా తల్లి కుమారులు’ అనేది అత్యంత సన్నిహిత కుటుంబ సభ్యులను, ముఖ్యంగా సోదరులను, సూచించే కవితా వ్యక్తీకరణ.
    reason: cultural_note
lexical_decisions:
- source_word: מוּזָר
  choice: పరాయివాడు
  rationale: זוּר మూలం నుంచి వచ్చిన ఈ రూపం పరాయివాడిగా లేదా దూరమైనవాడిగా ఉండే సంబంధ స్థితిని సూచిస్తుంది. ‘పరాయివాడు’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండి, తరువాతి ‘అన్యుడు’తో కవితా సమాంతరతను నిలుపుతుంది.
- source_word: הָיִיתִי
  choice: అయ్యాను
  rationale: היה యొక్క ఖతల్ రూపం ఇక్కడ ఒక స్థితిలోకి వచ్చిన భావాన్నీ, దాని ఫలిత స్థితినీ సూచించగలదు. ‘అయ్యాను’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; సాధారణ గతకాలమైన ‘ఉన్నాను’ కూడా సాధ్యమేనని పాదసూచిక తెలియజేస్తుంది.
- source_word: לְאֶחָי
  choice: నా సోదరులకు
  rationale: హీబ్రూ పదం అక్షరార్థంగా పురుష బహువచనంలో ‘నా సోదరులకు’ అని ఉంది. లింగసూచనను విస్తరించకుండా అలాగే నిలుపుతూ, לְ యొక్క సంబంధార్థాన్ని తెలుగులో ‘కు’తో వ్యక్తం చేశాం.
- source_word: וְנָכְרִי
  choice: అన్యుడు
  rationale: נָכְרִי పరదేశి, అన్యుడు, తమవాడు కానివాడు అనే భావాలను కలిగిస్తుంది. కుటుంబ సంబంధ సందర్భంలో ‘అన్యుడు’ స్పష్టంగా ఉండి, చట్టపరమైన లేదా జాతీయతాపరమైన భావాన్ని అనవసరంగా బలపరచదు.
- source_word: לִבְנֵי אִמִּי
  choice: నా తల్లి కుమారులకు
  rationale: అక్షరార్థమైన ‘నా తల్లి కుమారులకు’ అనే హీబ్రూ కుటుంబ పదబంధాన్ని నిలిపి, మొదటి పాదంలోని ‘నా సోదరులకు’తో ఉన్న కవితా సమాంతరతను కాపాడుతుంది.
theological_decisions:
- issue: లింగసూచిత కుటుంబ పదజాలం
  choice: ప్రధాన పాఠంలో ‘సోదరులు’, ‘నా తల్లి కుమారులు’ అని నిలుపడం
  alternative: తోబుట్టువులు; కుటుంబ సభ్యులు
  rationale: వచనం కవితా సమాంతరతలో స్పష్టంగా పురుషలింగ కుటుంబ పదాలను ఉపయోగిస్తుంది. సందర్భం వాటిని సాధారణ లింగసమావేశ పదాలుగా విస్తరించాల్సిన అవసరాన్ని స్పష్టంగా చూపనందున మూలంలోని లింగసూచనను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలిని వాడాం. రెండు పాదాల్లో ‘పరాయివాడు/అన్యుడు’ మరియు ‘సోదరులు/తల్లి కుమారులు’ అనే సమాంతర నిర్మాణాన్ని నిలిపాం. మూలంలోని కాలభావ అస్పష్టతను పాదసూచికలో భద్రపరిచాం.
