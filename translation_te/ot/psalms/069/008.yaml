  terminology: ‘సోదరులు’ and ‘తల్లి కుమారులు’ correctly retain the masculine kinship terms of the Hebrew. ‘పరాయివాడు/అన్యుడు’ gives an appropriately relational sense without over-specifying national or legal foreignness.
