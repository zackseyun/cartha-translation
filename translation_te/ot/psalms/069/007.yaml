review_pass:
  verdict: revise
  source_fidelity: ‘నీ నిమిత్తమే’ can convey ‘for your sake,’ but the Hebrew עָלֶיךָ here most directly expresses cause/account (‘because of you’). The added emphatic -మే is not represented in the source. The remaining clauses accurately convey the Hebrew’s causal introduction, bearing of reproach, and shame covering the face.
  naturalness: The draft is clear modern Telugu. ‘కప్పింది’ is slightly more direct and closer to the concrete Hebrew metaphor than the somewhat more forceful colloquial ‘కప్పేసింది.’
  terminology: ‘నింద’ fittingly renders חֶרְפָּה, and ‘అవమానం’ is an acceptable rendering of כְלִמָּה, maintaining a useful distinction between the parallel terms. ‘ముఖం’ correctly retains the literal image of פָּנַי.
  issues:
  - severity: low
    issue: ‘నీ నిమిత్తమే’ adds emphasis and can suggest ‘for your sake.’
    rationale: The Hebrew עָלֶיךָ is best represented here by a causal expression, ‘నీ కారణంగా,’ without the added exclusive emphasis.
  - severity: low
    issue: ‘కప్పేసింది’ slightly intensifies the covering image.
    rationale: The Hebrew כִּסְּתָה simply means ‘covered’; ‘కప్పింది’ preserves the image without added force.
  revised_text: ఎందుకంటే నీ కారణంగా నేను నిందను భరించాను; అవమానం నా ముఖాన్ని కప్పింది.
  revised_footnotes: []
  revision_rationale: The revision more precisely reflects the causal force of עָלֶיךָ and retains the unembellished ‘covered’ metaphor of כִּסְּתָה. It preserves the verse’s parallel poetic structure and modern standard Telugu register.
