  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי עָ֭לֶי/ךָ נָשָׂ֣אתִי חֶרְפָּ֑ה כִּסְּתָ֖ה כְלִמָּ֣ה פָנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/007.yaml
  text: For because of you I have borne reproach[b][a]; disgrace has covered my face.
translation:
  language: te
  text: ఎందుకంటే నీ కారణంగా నేను నిందను భరించాను; అవమానం నా ముఖాన్ని కప్పింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఈ సందర్భంలో כִּי ముందున్న భావానికి కారణాన్ని లేదా వివరణను పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ‘ఎందుకంటే’ ఆ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עָלֶיךָ
  choice: నీ నిమిత్తమే
  rationale: ఇక్కడ עַל స్థలార్థం కాక కారణం లేదా ఒకరి కారణంగా సంభవించినదనే భావాన్ని ఇస్తుంది. ‘నీ నిమిత్తమే’ కారణార్థంతో పాటు కీర్తనకర్త దేవునితో ఉన్న సంబంధం వల్ల నింద భరించాడనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: נָשָׂאתִי
  choice: నేను ... భరించాను
  rationale: נשא యొక్క మౌలిక భావం మోయడం; חֶרְפָּהతో కలిసినప్పుడు ‘భరించడం’ తెలుగులో సహజంగా ఉండి, నింద అనే భారాన్ని మోసే రూపకాన్ని నిలుపుతుంది.
- source_word: חֶרְפָּה
  choice: నిందను
  rationale: חֶרְפָּהలో దూషణ, తిరస్కారం, వాటివల్ల కలిగే పరాభవం ఉన్నాయి. ‘నింద’ సాధారణ ఆధునిక తెలుగులో ఈ భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: כִּסְּתָה
  choice: కప్పేసింది
  rationale: כסה యొక్క ‘కప్పడం’ అనే స్పష్టమైన రూపకాన్ని నిలుపుతూ, ఫలిత స్థితి బలంగా వ్యక్తమయ్యే సహజ తెలుగు రూపం.
- source_word: כְלִמָּה
  choice: అవమానం
  rationale: כְלִמָּה సిగ్గు, పరాభవం, అగౌరవం అనే భావాలను సూచిస్తుంది. ‘అవమానం’ ప్రజల ఎదుట కలిగిన పరాభవాన్ని తెలియజేస్తూ ‘నింద’తో అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: פָנַי
  choice: నా ముఖాన్ని
  rationale: ఈ రూపకంలో פָּנִים నేరుగా ముఖాన్ని సూచిస్తుంది; అవమానం కనిపించే వ్యక్తిగత స్థలంగా ‘నా ముఖాన్ని’ సహజంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గౌరవభరితమైన, సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలోని రెండు సమాంతర భాగాలు మరియు ‘ముఖాన్ని కప్పడం’ అనే రూపకం నిలుపబడ్డాయి.
