revisions:
- from: ఎందుకంటే నీ నిమిత్తమే నేను నిందను భరించాను; అవమానం నా ముఖాన్ని కప్పేసింది.
  to: ఎందుకంటే నీ కారణంగా నేను నిందను భరించాను; అవమానం నా ముఖాన్ని కప్పింది.
  rationale: The revision more precisely reflects the causal force of עָלֶיךָ and retains the unembellished ‘covered’ metaphor of כִּסְּתָה. It preserves the verse’s parallel poetic structure and modern standard Telugu register.
