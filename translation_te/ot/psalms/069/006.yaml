review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the two parallel prohibitions, the causal sense of בִי ('because of/on account of me'), and the distinctions between those who hope/wait and those who seek. The divine name is appropriately represented as యాహ్వే. A revision is warranted because the prohibitive wording is archaic and less idiomatic in modern standard Telugu, and the title can be expressed more naturally without reducing its components.
  naturalness: సిగ్గుపడకుందురు గాక and గురికాకుందురు గాక are marked, archaizing forms. Direct prohibitives addressed to God—సిగ్గుపడనివ్వకుము / అవమానపడనివ్వకుము—are clear, natural modern Telugu and retain the prayerful force. ‘నీయందు నిరీక్షించేవారు’ is concise and idiomatic while preserving the hope/wait semantic range.
  terminology: ‘యాహ్వే’ preserves יהוה. ‘సైన్యాలకు అధిపతియైన ప్రభువా యాహ్వే’ retains both אֲדֹנָי and יהוה and preserves the concrete ‘hosts/armies’ imagery of צְבָאוֹת rather than paraphrasing it as ‘Almighty.’ ‘ఇశ్రాయేలు దేవా’ is a natural vocative for אֱלֹהֵי יִשְׂרָאֵל.
  issues:
  - severity: medium
    issue: Archaic and awkward prohibitive verb forms
    rationale: ‘సిగ్గుపడకుందురు గాక’ and ‘అవమానానికి గురికాకుందురు గాక’ are not natural modern standard Telugu. They can obscure the direct petition that God not allow these people to suffer shame.
  - severity: low
    issue: The first participial phrase is unnecessarily expanded
    rationale: ‘నీ కోసం ఆశతో ఎదురుచూసేవారు’ is understandable, but ‘నీయందు నిరీక్షించేవారు’ is more idiomatic and encompasses the Hebrew participle’s expectant waiting/hope without over-specifying both senses.
  - severity: low
    issue: Footnote anchors are absent from the Telugu text
    rationale: The source audit trail supplies a lexical alternative for קֹוֶיךָ and a title note for אֲדֹנָי יְהוָה צְבָאוֹת. Adding anchored Telugu notes preserves this information.
