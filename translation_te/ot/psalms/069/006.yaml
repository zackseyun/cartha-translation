source:
  edition: WLC
  text: אַל יֵ֘בֹ֤שׁוּ בִ֨/י קֹוֶי/ךָ֮ אֲדֹנָ֥/י יְהוִ֗ה צְבָ֫א֥וֹת אַל יִכָּ֣לְמוּ בִ֣/י מְבַקְשֶׁ֑י/ךָ אֱ֝לֹהֵ֗י יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/006.yaml
  text: Let not those who hope in you be put to shame because of me[a], Lord Yahweh of hosts; let not those who seek you be humiliated because of me[b], God of Israel.
translation:
  language: te
  text: నీయందు నిరీక్షించేవారు నా కారణంగా సిగ్గుపడనివ్వకుము[a], సైన్యాలకు అధిపతియైన ప్రభువా యాహ్వే[b]; నిన్ను వెదికేవారు నా కారణంగా అవమానపడనివ్వకుము, ఇశ్రాయేలు దేవా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ కోసం వేచియుండేవారు.” హెబ్రీ పదం ఆశతో కూడిన నిరీక్షణను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో “ప్రభువా యాహ్వే సైన్యాల.” ఈ బిరుదులో అֲదోనాయ్ (“ప్రభువు”), యాహ్వే అనే దైవనామం, మరియు “సైన్యాలు” అనే భావం ఉన్నాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: సిగ్గుపడకుందురు గాక
  rationale: בוש అనుభవించే సిగ్గు లేదా అపకీర్తిని సూచిస్తుంది. ప్రార్థనాత్మక నిషేధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בִי
  choice: నా కారణంగా
  rationale: ఇక్కడ בִי సందర్భానుసారంగా కీర్తనకర్త ఇతరుల సిగ్గుకు కారణం కాకూడదనే భావాన్ని ఇస్తుంది.
- source_word: קֹוֶיךָ
  choice: నీ కోసం ఆశతో ఎదురుచూసేవారు
  rationale: קוה లోని ‘ఎదురుచూడడం’ మరియు ‘ఆశించడం’ అనే రెండు భావ ఛాయలనూ ఒకే సహజ తెలుగు పదబంధంలో నిలుపుతుంది.
- source_word: אֲדֹנָי יְהוָה צְבָאוֹת
  choice: సైన్యాలకు అధిపతివైన ప్రభువా యాహ్వే
  rationale: אֲדֹנָיను ‘ప్రభువా,’ יהוהను ‘యాహ్వే’గా వేరు చేసి, צְבָאוֹת యొక్క సైన్యాల చిత్రాన్ని నిలుపుతూ సహజమైన సంబోధనగా అనువదించబడింది.
- source_word: יִכָּלְמוּ
  choice: అవమానానికి గురికాకుందురు గాక
  rationale: כלם లోని అవమానం, పరాభవం అనే బలమైన భావాన్ని ఇస్తూ, మొదటి పాదంలోని בושతో ఉన్న పదభేదాన్ని నిలుపుతుంది.
- source_word: מְבַקְשֶׁיךָ
  choice: నిన్ను వెదికేవారు
  rationale: בקש యొక్క కొనసాగుతున్న, క్రియాశీల అన్వేషణ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవా
  rationale: నిర్మాణ సంబంధాన్ని మరియు ప్రత్యక్ష సంబోధనను సహజమైన తెలుగు విభక్తితో తెలియజేస్తుంది.
theological_decisions:
- issue: אֲדֹנָי יְהוָה అనే సంయుక్త దైవ సంబోధనలో יהוה అనువాదం
  choice: ప్రభువా యాహ్వే
  alternative: ప్రభువైన దేవా / ప్రభువా యెహోవా
  rationale: మూలంలోని אֲדֹנָי మరియు ఒడంబడిక నామమైన יהוה రెండింటినీ వేర్వేరుగా కనిపించేలా ఉంచుతుంది; దైవనామాన్ని సాధారణ బిరుదుగా మార్చదు.
- issue: צְבָאוֹת యొక్క అర్థం
  choice: సైన్యాలకు అధిపతివైన
  alternative: సైన్యముల దేవా / సర్వశక్తిమంతుడా
  rationale: మూలపదంలోని ‘సైన్యాలు’ అనే చిత్రాన్ని నిలుపుతూ, తెలుగులో ఆ బిరుదు ఎవరిని సూచిస్తుందో స్పష్టంగా చేస్తుంది; ‘సర్వశక్తిమంతుడు’గా భావవ్యాఖ్య చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైన కీర్తనా శైలి. ‘ఆశతో ఎదురుచూసేవారు’ అనే పదబంధం קוה లోని ఆశ మరియు నిరీక్షణ రెండింటినీ నిలుపుతుంది. సమాంతర పాదాల్లో ‘సిగ్గుపడు’ మరియు ‘అవమానానికి గురవు’ అని వేరు చేసి హెబ్రీ పదభేదం కాపాడబడింది.
