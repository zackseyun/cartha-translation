source:
  edition: WLC
  text: יָשִׂ֣יחוּ בִ֭/י יֹ֣שְׁבֵי שָׁ֑עַר וּ֝/נְגִינ֗וֹת שׁוֹתֵ֥י שֵׁכָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/012.yaml
  text: Those who sit in the gate talk about me[b][a], and I am the song of those who drink strong drink.
translation:
  language: te
  text: పట్టణ ద్వారం వద్ద కూర్చునేవారు నా గురించి మాట్లాడుకుంటారు[a]; మత్తుపానీయం తాగేవారు నన్ను గురించి పాటలు పాడుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పట్టణ ద్వారం ప్రాచీన కాలంలో ప్రజా వ్యవహారాలు, న్యాయతీర్పులు జరిగే ముఖ్య స్థలం. కాబట్టి ఇక్కడ కేవలం ద్వారపాలకులు కాక, సమాజంలో పలుకుబడి గలవారు బహిరంగంగా అపహాస్యం చేయడం సూచించబడవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: יָשִׂיחוּ בִי
  choice: నా గురించి మాట్లాడుకుంటారు
  rationale: שׂיח ఇక్కడ అంతరంగ ధ్యానం కంటే మాటలలో చర్చించడం అనే భావాన్ని ఇస్తుంది; בִי ఆ మాటల విషయాన్ని, ‘నా గురించి,’ సూచిస్తుంది. విరోధ భావం సందర్భంలో ఉన్నా, ‘నాకు వ్యతిరేకంగా’ అని మూలపదంలో లేని భావాన్ని నేరుగా చేర్చలేదు.
- source_word: יֹשְׁבֵי שָׁעַר
  choice: పట్టణ ద్వారం దగ్గర కూర్చునేవారు
  rationale: అక్షరార్థంగా ‘ద్వారం వద్ద కూర్చునేవారు.’ ప్రాచీన పట్టణ ద్వారం పౌర వ్యవహారాలు, తీర్పులు జరిగే బహిరంగ స్థలం; ‘పట్టణ’ అనే స్పష్టీకరణ ఆధునిక పాఠకుడికి ఆ దృశ్యాన్ని సహజంగా తెలియజేస్తుంది, అయితే వారిని కేవలం ద్వారపాలకులు లేదా పెద్దలు అని పరిమితం చేయదు.
- source_word: וּנְגִינוֹת
  choice: నన్ను పాటగా పాడుకుంటారు
  rationale: నామవాచక రూపం ‘పాటలు/సంగీతం’ అయినా, సమాంతర వాక్య నిర్మాణంలో కీర్తనకర్త వారిపాటకు అంశమయ్యాడనే అంతర్భావం ఉంది. తెలుగులో సహజంగా ఉండేందుకు క్రియారూపంగా వ్యక్తీకరించబడింది.
- source_word: שׁוֹתֵי שֵׁכָר
  choice: మత్తుపానీయం తాగేవారు
  rationale: שֵׁכָר ద్రాక్షారసం కాక ఇతర మత్తుకలిగించే పానీయాన్ని సూచించగలదు. ‘తాగుబోతులు’ అనేది సాధ్యమైన సందర్భార్థమైనా, వ్యక్తులపై అదనపు తీర్పు మోపకుండా మూలంలోని వివరణాత్మక రూపాన్ని నిలిపింది.
