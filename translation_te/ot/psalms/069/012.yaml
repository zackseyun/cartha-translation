translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా వాక్యంగా రూపొందించబడింది. మొదటి పాదంలోని ప్రజా చర్చను, రెండవ పాదంలోని మత్తుపానీయం సేవించేవారి పాటను సమాంతరంగా ఉంచింది; సందర్భంలోని అపహాస్య భావాన్ని నిలిపినా మూలంలో స్పష్టంగా లేని ‘వ్యతిరేకంగా’ లేదా ‘ఎగతాళి పాట’ వంటి పదాలను ప్రధాన వచనంలో చేర్చలేదు.
