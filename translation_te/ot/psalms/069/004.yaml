id: PSA.69.4
reference: Psalms 69:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רַבּ֤וּ מִ/שַּׂעֲר֣וֹת רֹאשִׁ/י֮ שֹׂנְאַ֪/י חִ֫נָּ֥ם עָצְמ֣וּ מַ֭צְמִיתַ/י אֹיְבַ֣/י שֶׁ֑קֶר אֲשֶׁ֥ר לֹא גָ֝זַ֗לְתִּי אָ֣ז אָשִֽׁיב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/004.yaml
  text: Those who hate me without cause are more than the hairs of my head[a]; those who would destroy me, my false enemies, are mighty. What I did not steal[b], then I must restore.
translation:
  language: te
  text: కారణం లేకుండానే నన్ను ద్వేషించేవారు నా తల వెంట్రుకలకంటే ఎక్కువమంది; నన్ను నాశనం చేయాలనుకునే మోసపూరితమైన నా శత్రువులు[a] బలవంతులయ్యారు. నేను దోచుకోనిదాన్ని[b] అప్పుడు తిరిగి చెల్లించవలసి వస్తోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అన్యాయంగా నన్ను ఎదిరించేవారు.” హెబ్రీ పదబంధం శత్రువులు మోసపూరితులని గానీ, వారు కీర్తనకర్తను అన్యాయంగా ఎదిరిస్తున్నారని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో, “అప్పుడు నేను తిరిగి చెల్లిస్తాను.” తాను దోచుకోనిదానికి కీర్తనకర్తను పరిహారం చెల్లించమని బలవంతం చేస్తున్నారనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוּ מִשַּׂעֲרוֹת רֹאשִׁי
  choice: నా తల వెంట్రుకలకంటే ఎక్కువమంది
  rationale: מִן తులనను సూచిస్తుంది; శత్రువుల లెక్కలేనంత సంఖ్యను తెలిపే కవితాత్మక అతిశయోక్తిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שֹׂנְאַי חִנָּם
  choice: కారణం లేకుండానే నన్ను ద్వేషించేవారు
  rationale: חִנָּם ఇక్కడ ప్రతిఫలం లేకపోవడం కంటే సమర్థనీయమైన కారణం లేకపోవడాన్ని సూచిస్తుంది.
- source_word: עָצְמוּ
  choice: బలవంతులయ్యారు
  rationale: ఈ క్రియ బలంగా లేదా శక్తిమంతంగా కావడాన్ని సూచిస్తుంది; హెబ్రీ గత/పూర్త క్రియ యొక్క భావాన్ని నిలుపుతుంది.
- source_word: מַצְמִיתַי
  choice: నన్ను నాశనం చేయాలనుకునే
  rationale: కృదంత రూపం కీర్తనకర్తను నిర్మూలించాలని ఉద్దేశించే వారిని సూచిస్తుంది; తెలుగులో ఉద్దేశాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֹיְבַי שֶׁקֶר
  choice: నా అబద్ధపు శత్రువులు
  rationale: שֶׁקֶר శత్రువులను మోసపూరితులుగా వర్ణించవచ్చు లేదా వారి శత్రుత్వం అన్యాయమైనదని సూచించవచ్చు; ప్రధాన పాఠ్యంలో సంక్షిప్త విశేషణ రూపాన్ని ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- source_word: אֲשֶׁר לֹא גָזַלְתִּי
  choice: నేను దోచుకోనిదాన్ని
  rationale: גזל బలవంతంగా తీసుకోవడం లేదా దోచుకోవడం అనే ప్రత్యేక భావాన్ని కలిగి ఉంది; సాధారణ ‘దొంగిలించు’ కంటే ‘దోచుకో’ మూలార్థానికి దగ్గరగా ఉంది.
- source_word: אָז אָשִׁיב
  choice: అప్పుడు తిరిగి చెల్లించాల్సి వస్తోంది
  rationale: పదశః ‘అప్పుడు నేను తిరిగి ఇస్తాను/చెల్లిస్తాను’; సందర్భంలో చేయని దోపిడికి బలవంతపు పరిహారం చెల్లించే అసంబద్ధ పరిస్థితిని తెలుగులో స్పష్టం చేస్తుంది, కాగా పాదసూచిక పదశః రూపాన్ని సంరక్షిస్తుంది.
theological_decisions:
- issue: నిర్దోషి అయినప్పటికీ చివరి పాదంలో పరిహారం చెల్లించడం
  choice: నేను దోచుకోనిదాన్ని అప్పుడు తిరిగి చెల్లించాల్సి వస్తోంది
  alternative: నేను దోచుకోనిదాన్ని అప్పుడు తిరిగి చెల్లిస్తాను
  rationale: సందర్భం తప్పుడు ఆరోపణ వల్ల కలిగిన బలవంతపు పరిహారాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యం ఆ ఒత్తిడిని సహజమైన తెలుగులో తెలియజేస్తుంది; హెబ్రీలోని సంక్షిప్తతను, అస్పష్టతను పాదసూచికలో ఉంచుతుంది.
- issue: אֹיְבַי שֶׁקֶר యొక్క సంబంధం
  choice: నా అబద్ధపు శత్రువులు
  alternative: అబద్ధంగా/అన్యాయంగా నాకు శత్రువులైనవారు
  rationale: שֶׁקֶר శత్రువుల స్వభావాన్ని లేదా వారి విరోధానికి ఆధారం లేకపోవడాన్ని సూచించగలదు. ఒక అర్థాన్ని సిద్ధాంతపరంగా ఖరారు చేయకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా వచనం. ‘వెంట్రుకలకంటే ఎక్కువమంది’ అనే రూపం హెబ్రీ తులనను స్పష్టంగా ఉంచుతుంది. ‘దోచుకోనిదాన్ని’ גזל లోని బలవంతపు స్వాధీన భావాన్ని కాపాడుతుంది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
