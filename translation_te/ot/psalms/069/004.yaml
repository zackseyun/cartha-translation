revisions:
- from: కారణం లేకుండానే నన్ను ద్వేషించేవారు నా తల వెంట్రుకలకంటే ఎక్కువమంది[a]; నన్ను నాశనం చేయాలనుకునే నా అబద్ధపు శత్రువులు బలవంతులయ్యారు. నేను దోచుకోనిదాన్ని[b] అప్పుడు తిరిగి చెల్లించాల్సి వస్తోంది.
  to: కారణం లేకుండానే నన్ను ద్వేషించేవారు నా తల వెంట్రుకలకంటే ఎక్కువమంది; నన్ను నాశనం చేయాలనుకునే మోసపూరితమైన నా శత్రువులు[a] బలవంతులయ్యారు. నేను దోచుకోనిదాన్ని[b] అప్పుడు తిరిగి చెల్లించవలసి వస్తోంది.
  rationale: שֶׁקֶר కు ఉన్న రెండు సాధ్యార్థాలను కాపాడుతూ, ప్రధాన పాఠ్యంలో తప్పుదారి పట్టించే ‘అబద్ధపు శత్రువులు’ స్థానంలో ‘మోసపూరితమైన నా శత్రువులు’ ఉంచాం. సంబంధిత పాదసూచిక గుర్తును కూడా అదే పదబంధానికి తరలించాం. ఇతర వచనార్థం, కవితా రిజిస్టర్, మరియు చివరి క్లాజులోని ఉద్దేశపూర్వక అస్పష్టతను మార్చలేదు.
