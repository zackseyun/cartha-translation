review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects the Hebrew vocative, emphatic divine knowledge, first-person singular ‘my foolishness,’ and plural ‘my guilt(s)/offenses.’ It rightly preserves the psalmist’s personal confession without importing later theological interpretation.
  naturalness: ‘దేవా, నా మూర్ఖత్వం నీకు తెలుసు’ is clear and suitably prayerful. In contemporary standard Telugu, ‘నీకు మరుగై లేవు’ is understandable but less idiomatic than ‘నీకు దాగి లేవు.’
  terminology: ‘మూర్ఖత్వం’ appropriately conveys culpable folly. ‘అపరాధాలు’ naturally renders the plural culpabilities/offenses here and avoids the contextually unsuitable sacrificial sense of ‘guilt offerings.’
  issues:
  - severity: low
    issue: Less natural concealment idiom
    rationale: Replace ‘నీకు మరుగై లేవు’ with ‘నీకు దాగి లేవు’ for more idiomatic modern Telugu while retaining the Niphal sense that the offenses are not hidden from God.
  revised_text: 'దేవా, నా మూర్ఖత్వం నీకు తెలుసు;

    నా అపరాధాలు నీకు దాగి లేవు.'
