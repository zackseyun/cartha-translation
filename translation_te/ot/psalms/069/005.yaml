  yaml_path: translation/ot/psalms/069/005.yaml
  text: God[a], you know my foolishness[b], and my guilt is not hidden from you.
translation:
  language: te
  text: 'దేవా, నా మూర్ఖత్వం నీకు తెలుసు;

    నా అపరాధాలు నీకు దాగి లేవు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ఇది ప్రార్థనలో దేవుణ్ణి నేరుగా సంబోధించే పదం; తెలుగు సంబోధన రూపమైన ‘దేవా’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: אַתָּה יָדַעְתָּ
  choice: నీకు తెలుసు
  rationale: వ్యక్తంగా ఉన్న ద్వితీయ పురుష సర్వనామం దేవుని జ్ఞానాన్ని నొక్కిచెబుతుంది. ידע యొక్క సంపూర్ణ క్రియారూపం ఇక్కడ వర్తమాన స్థితిని సూచిస్తున్నందున ‘నీకు తెలుసు’ సహజమైన అనువాదం.
- source_word: לְאִוַּלְתִּי
  choice: నా మూర్ఖత్వం
  rationale: ఈ నామవాచకం కేవలం తెలివితక్కువతనాన్ని కాక, బాధ్యతతో కూడిన అవివేకాన్ని లేదా నైతిక మూర్ఖత్వాన్ని సూచించగలదు; ‘మూర్ఖత్వం’ ఆ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וְאַשְׁמוֹתַי
  choice: నా అపరాధాలు
  rationale: మూలంలో నామవాచకం బహువచనంలో ఉంది. సందర్భంలో ఇది అపరాధబలి కంటే కర్త చేసిన తప్పులు లేదా దోషకార్యాలను సూచిస్తుంది; ‘అపరాధాలు’ ఆ బహువచన స్పష్టతను నిలుపుతుంది.
- source_word: מִמְּךָ לֹא נִכְחָדוּ
  choice: నీకు మరుగై లేవు
  rationale: నిఫల్ బహువచన క్రియ ‘దాచబడి ఉండడం/మరుగై ఉండడం’ అనే భావాన్ని ఇస్తుంది. ‘నీకు మరుగై లేవు’ తెలుగులో సహజంగా ఉండి, దేవుని అవగాహన నుండి అవి దాగలేదనే భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: కొత్త నిబంధనలో మెస్సీయకు అన్వయించబడే కీర్తనలో వక్త తన మూర్ఖత్వం, అపరాధాలను ఒప్పుకోవడం
  choice: వచనాన్ని కీర్తనకర్త స్వీయ ఒప్పుకోలుగానే అనువదించడం
  alternative: ఇది వ్యక్తిగత ఒప్పుకోలు కాదని, కేవలం సమూహానికి ప్రాతినిధ్యం వహించే ఒప్పుకోలుగా వివరించడం
  rationale: హీబ్రూ పాఠం ప్రథమ పురుషంలో మూర్ఖత్వం, అపరాధాలను నేరుగా ఒప్పుకుంటుంది. తరువాతి వేదాంత అన్వయాల వల్ల ఈ ఉద్వేగాన్ని తొలగించకుండా మూల స్వరాన్ని నిలుపుకోవాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనా గౌరవాన్ని నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే సంక్షిప్త కవితా శైలి. మూలంలోని సమాంతర నిర్మాణం రెండు పాదాలుగా ఉంచబడింది.
