  yaml_path: translation/ot/psalms/069/011.yaml
  text: I made sackcloth my clothing[b][a], and I became a byword to them.
translation:
  language: te
  text: నేను గోనెపట్టను నా వస్త్రంగా ధరించుకున్నాను; వారికి నేను ఎగతాళి మాటనయ్యాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి నోట నానుడిగా”; అంటే, ఎగతాళి చేయడానికి తరచుగా ప్రస్తావించే వ్యక్తిగా.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה
  choice: చేసుకున్నాను
  rationale: נתן అనే క్రియకు ‘ఇవ్వడం, ఉంచడం, చేయడం’ అనే భావాలు ఉన్నాయి. ‘నా వస్త్రం’ మరియు ‘గోనెపట్ట’తో కూడిన ఈ నిర్మాణంలో, గోనెపట్టను తన వస్త్రంగా ధరించుకున్నాడనే భావాన్ని ‘చేసుకున్నాను’ సహజంగా తెలియజేస్తుంది.
- source_word: לְבוּשִׁי
  choice: నా వస్త్రంగా
  rationale: కీర్తనకర్త ధరించిన దానిని సూచిస్తుంది. ‘నా వస్త్రంగా’ అనే ప్రయోగం స్వామ్యార్థాన్ని, వాక్యంలోని విధేయ సంబంధాన్ని కాపాడుతుంది.
- source_word: שָׂק
  choice: గోనెపట్ట
  rationale: దుఃఖం లేదా వినయానికి సూచనగా ధరించే ముతక వస్త్రాన్ని సూచించే సుపరిచితమైన తెలుగు బైబిలు పదం.
- source_word: וָאֱהִי
  choice: నేను ... మారాను
  rationale: היה ఇక్కడ ఫలితంగా ఏర్పడిన స్థితిని సూచిస్తుంది; ‘మారాను’ ఆ పరిణామాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לָהֶם
  choice: వారికి
  rationale: కీర్తనకర్తను గురించి అలా మాట్లాడే లేదా ఎగతాళి చేసే వారితో ఉన్న సంబంధాన్ని దత్తివ విభక్తితో సహజంగా తెలియజేస్తుంది.
- source_word: לְמָשָׁל
  choice: ఎగతాళి మాటగా
  rationale: מָשָׁל కు సామెత, నానుడి, ఎద్దేవా మాట లేదా అపహాస్యానికి ఉదాహరణ అనే అర్థాలు ఉండవచ్చు. ఈ విలాప సందర్భంలో తటస్థమైన ‘సామెత’కన్నా, హేళనకు గురైన వ్యక్తిని సూచించే ‘ఎగతాళి మాట’ సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
