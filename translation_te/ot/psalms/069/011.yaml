  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన విలాప శైలి. ‘గోనెపట్ట’ సాంస్కృతిక దుఃఖ సూచనను నిలుపుతుంది; ‘ఎగతాళి మాట’ מָשָׁל యొక్క సందర్భానుగుణ ప్రతికూల భావాన్ని ప్రధాన పాఠ్యంలో వ్యక్తం చేస్తుంది.
