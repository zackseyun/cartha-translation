source:
  edition: WLC
  text: כִּֽי קִנְאַ֣ת בֵּיתְ/ךָ֣ אֲכָלָ֑תְ/נִי וְ/חֶרְפּ֥וֹת ח֝וֹרְפֶ֗י/ךָ נָפְל֥וּ עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/009.yaml
  text: For zeal for your house has consumed me[b][a], and the reproaches of those who reproach you have fallen on me.
translation:
  language: te
  text: నీ ఇంటి పట్ల నా అత్యుత్సాహం నన్ను కబళించింది[a][b]; నిన్ను నిందించేవారి నిందలు నా మీద పడ్డాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ ఇంటి పట్ల నా అత్యుత్సాహం నన్ను తినివేసింది.”
    reason: lexical_alternative
  - marker: b
    text: యోహాను 2:17లో ఈ వచనంలోని మొదటి భాగం యేసును సూచిస్తూ ఉదహరించబడింది.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఈ పదం సందర్భంలో కీర్తనకర్త పరిస్థితికి కారణాన్ని తెలియజేస్తుంది; తెలుగు వాక్యంలో కారణార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: קִנְאַת
  choice: ఆసక్తి
  rationale: ఇక్కడ అసూయ కాదు, దేవుని మందిరం పట్ల తీవ్రమైన అంకితభావం ఉద్దేశించబడింది. ‘ఆసక్తి’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండగా, క్రియతో కలిసి దాని తీవ్రత స్పష్టమవుతుంది.
- source_word: בֵּיתְךָ
  choice: నీ మందిరం
  rationale: అక్షరార్థం ‘నీ ఇల్లు’; ఈ కీర్తన సందర్భంలో దేవుని ఆలయం లేదా పవిత్రస్థలాన్ని సూచిస్తుంది. తెలుగులో ‘దేవుని ఇల్లు’ కంటే ‘మందిరం’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: אֲכָלָתְנִי
  choice: నన్ను దహించివేసింది
  rationale: అక్షరార్థంగా ‘నన్ను తినివేసింది’; రూపకాలంకారంగా పూర్తిగా ఆవరించి క్షీణింపజేయడాన్ని సూచిస్తుంది. ‘దహించివేసింది’ ఆసక్తి యొక్క తీవ్రతను సహజమైన తెలుగు కవితా భాషలో నిలుపుతుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: וְחֶרְפּוֹת
  choice: నిందలు
  rationale: అవమానకరమైన మాటలు, దూషణలు అనే భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; తరువాతి సమాన ధాతు రూపంతో పదబంధ సంబంధాన్ని నిలుపుతుంది.
- source_word: חֹרְפֶיךָ
  choice: నిన్ను నిందించేవారి
  rationale: దేవుణ్ణి నిందించేవారిని సూచించే కర్తృవాచక రూపాన్ని సహజమైన తెలుగు సంబంధ పదబంధంగా అనువదిస్తుంది; ‘నిందలు—నిందించేవారు’ అనే మూలంలోని పదపునరుక్తిని నిలుపుతుంది.
- source_word: נָפְלוּ עָלַי
  choice: నా మీద పడ్డాయి
  rationale: మూలంలోని ‘పడుట’ రూపకాన్ని నేరుగా నిలుపుతూ, దేవునిపై ఉద్దేశించిన నింద కీర్తనకర్తపైకి వచ్చిందనే భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఈ వచనంలోని మెస్సీయ సంబంధమైన కానోనికల్ ప్రతిధ్వని
  choice: ప్రధాన పాఠ్యంలో వచనాన్ని కీర్తనకర్త స్వరంలోనే అనువదించి, యేసుకు అన్వయించిన నూతన నిబంధన సందర్భాన్ని పాదసూచికలో పేర్కొనడం.
  alternative: యోహాను 2:17 ఆధారంగా ప్రధాన పాఠ్యంలోనే స్పష్టమైన క్రీస్తు సంబంధ అర్థాన్ని చేర్చడం.
  rationale: హీబ్రూ పాఠ్యం నేరుగా కీర్తనకర్త అనుభవాన్ని పలుకుతుంది. తరువాతి క్రీస్తు సంబంధ అన్వయాన్ని గౌరవిస్తూ కూడా, దానిని మూల వచనంలోకి దిగుమతి చేయకుండా పాదసూచికలో ఉంచడం మూలభాష ప్రాధాన్యాన్ని, కానోనికల్ సంబంధాన్ని రెండింటినీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కవితా శైలి. ‘మందిరం’ సందర్భార్థాన్ని స్పష్టం చేస్తుంది; ‘దహించివేసింది’ హీబ్రూ రూపకపు తీవ్రతను సహజంగా అందిస్తుంది. పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో రెండూ చేర్చబడ్డాయి.
