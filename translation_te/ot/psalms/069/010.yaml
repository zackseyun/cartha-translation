  text: When I wept with fasting in my soul[b][a], it became a reproach to me.
translation:
  language: te
  text: నేను ఉపవాసంతో నన్ను నేను శ్రమపెట్టుకొని ఏడ్చినప్పుడు[a], అది నాకు నిందగా మారింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ వాక్యనిర్మాణం సంక్షిప్తంగా, అక్షరార్థానికి దగ్గరగా “నేను ఉపవాసంలో ఏడ్చాను—నా ప్రాణం/నేనే” అని ఉంది. “ఉపవాసంతో నన్ను నేను శ్రమపెట్టుకొని ఏడ్చినప్పుడు” అనేది సాధారణ అర్థగ్రహణం. లేదా, “నేను ఉపవాసంతో, నా ప్రాణంతో ఏడ్చినప్పుడు” అని అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶבְכֶּה
  choice: నేను … ఏడ్చినప్పుడు
  rationale: בכה అంటే ‘ఏడవడం.’ తరువాతి వాక్యభాగంతో ఉన్న ఫలిత సంబంధాన్ని తెలుగులో సహజంగా తెలియజేయడానికి వావ్‌తో కూడిన క్రియను కాలార్థకంగా ‘ఏడ్చినప్పుడు’ అని అనువదించాం.
- source_word: בַצּוֹם
  choice: ఉపవాసంతో
  rationale: צוֹם అంటే ‘ఉపవాసం.’ ב ఉపసర్గ ఇక్కడ ఏడుపుతో కలిసి జరిగిన సాధనాన్ని లేదా పరిస్థితిని సూచించగలదు; ‘ఉపవాసంతో’ రెండింటినీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: נַפְשִׁי
  choice: నా అంతరంగంలో
  rationale: נֶפֶשׁ‌కు ‘ప్రాణం, వ్యక్తి, అంతరంగం’ వంటి అర్థాలు ఉన్నాయి. ఇక్కడ దానిని వదలకుండా, తెలుగులో సహజంగా ఉండేలా ఏడుపు యొక్క అంతర్గత లోతును సూచించే ‘నా అంతరంగంలో’ అని ఇచ్చాం; వాక్యనిర్మాణంలోని ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: וַתְּהִי
  choice: అది … మారింది
  rationale: היה ఇక్కడ ముందటి చర్య ఫలితంగా ఏర్పడిన స్థితిని సూచిస్తుంది. స్త్రీలింగ ఏకవచన క్రియ ముందున్న మొత్తం చర్యను సూచిస్తున్నదని గ్రహించి ‘అది … మారింది’ అని ఇచ్చాం.
- source_word: לַחֲרָפוֹת
  choice: నిందగా
  rationale: חֲרָפוֹת రూపరీత్యా బహువచనమైనా, ఈ నిర్మాణంలో అవమానం లేదా నింద అనే సమష్టి భావాన్ని సూచిస్తుంది. తెలుగులో ‘నిందగా’ సహజమైన అమూర్త ఏకవచన ప్రయోగం.
- source_word: לִי
  choice: నాకు
  rationale: ל ఉపసర్గ ప్రభావిత వ్యక్తిని సూచిస్తుంది; ‘నాకు నిందగా మారింది’ అనే తెలుగు నిర్మాణం మూలార్థాన్ని నేరుగా అందిస్తుంది.
theological_decisions:
- issue: נַפְשִׁי పదానికి ఈ సందర్భంలో ఉన్న వాక్యనిర్మాణ సంబంధం
  choice: నా అంతరంగంలో
  alternative: నా ప్రాణం ఉపవాసముండగా / ఉపవాసంతో నన్ను నేను తగ్గించుకున్నప్పుడు
  rationale: మూలంలోని נַפְשִׁיని తొలగించకుండా ఉంచుతూ, మూలంలో లేని ‘తగ్గించుకున్నాను’ అనే క్రియను ప్రధాన పాఠ్యంలో చేర్చలేదు. అయితే హెబ్రీ సంక్షిప్త నిర్మాణం ఇతర పఠనాలకు వీలు కల్పిస్తుందని పాదసూచికలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా ‘ఆత్మలో’ కంటే ‘అంతరంగంలో’ ఎంచుకున్నాం. కీర్తనకు తగిన గంభీరతను ఉంచి, మూలంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు కాపాడాం.
