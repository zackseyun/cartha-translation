id: PSA.69.1
reference: Psalms 69:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הוֹשִׁיעֵ֥/נִי אֱלֹהִ֑ים כִּ֤י בָ֖אוּ מַ֣יִם עַד נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/001.yaml
  text: Save me[a], O God, for the waters have come up to my neck.
translation:
  language: te
  text: దేవా, నన్ను రక్షించు, ఎందుకంటే నీళ్లు నా గొంతు వరకూ వచ్చాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నా ప్రాణం వరకు.” ఇక్కడి హెబ్రీ పదం నెఫెష్‌కు “ప్రాణం,” “జీవితం,” “స్వయం” అనే అర్థాలు ఉండవచ్చు; ఇలాంటి మునిగే ప్రమాద సందర్భంలో అది గొంతు లేదా మెడ ప్రాంతాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעֵנִי
  choice: నన్ను రక్షించు
  rationale: ישׁע ధాతువు హిఫీల్ ఆజ్ఞార్థక రూపానికి ఏకవచన ప్రథమ పురుష ప్రత్యయం జతైంది; తీవ్రమైన ప్రమాదం నుంచి కాపాడమనే ప్రత్యక్ష విన్నపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ఇది ప్రత్యక్ష సంబోధన; తెలుగు ప్రార్థనా భాషలో సంబోధనార్థకమైన ‘దేవా’ సహజంగా, గంభీరంగా ఉంటుంది.
- source_word: כִּי
  choice: ;
  rationale: ఈ సందర్భంలో כִּי విన్నపానికి కారణాన్ని పరిచయం చేస్తుంది. తెలుగులో ప్రత్యేకంగా ‘ఎందుకంటే’ అని చేర్చకుండా అర్ధవిరామంతో తరువాతి కారణవాక్యాన్ని ఉంచడం కవితాత్మకంగా, సహజంగా ఉంది.
- source_word: בָאוּ מַיִם
  choice: నీళ్లు ... వచ్చాయి
  rationale: నీరు పైకి వచ్చి ప్రాణాపాయ స్థాయికి చేరిన దృశ్యాన్ని మూలంలోని సాధారణ పదాలతోనే నిలుపుతుంది; ‘వరదనీళ్లు’ అని మూలంలో లేని నిర్దిష్టతను చేర్చదు.
- source_word: עַד נָפֶשׁ
  choice: నా గొంతు వరకూ
  rationale: נֶפֶשׁ సాధారణంగా ప్రాణం, జీవి, స్వయం అనే భావాలు కలిగినప్పటికీ, మునిగిపోయే సందర్భంలో శ్వాసకు సంబంధించిన గొంతు/మెడ ప్రాంతాన్ని సూచించగలదు. ‘గొంతు వరకూ’ సమీపిస్తున్న మునక ప్రమాదాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది; పదశః భావాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: మునిగే ప్రమాద చిత్రణలో נֶפֶשׁ అనువాదం
  choice: శరీర సంబంధమైన ‘గొంతు’ అనే సందర్భోచిత భావం
  alternative: పదశః ‘నా ప్రాణం వరకు’ లేదా విస్తృతంగా ‘నా జీవితం వరకు’
  rationale: ఈ వాక్యం ఆత్మ స్వభావంపై సిద్ధాంత ప్రకటన చేయడం కాదు; ముంచెత్తుతున్న ఆపదను శరీరానుభవంతో చిత్రిస్తుంది. అందువల్ల ప్రధాన పాఠ్యంలో స్పష్టమైన సందర్భోచిత భావాన్ని ఇచ్చి, హెబ్రీ పదంలోని నిజమైన విస్తృతిని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గంభీరతతో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే సంక్షిప్త కవితా వాక్యం. ‘గొంతు’ ఎంపిక మునిగే సందర్భంలో శ్వాస ఆడకపోయే ప్రమాదాన్ని సహజంగా వ్యక్తం చేస్తుంది.
