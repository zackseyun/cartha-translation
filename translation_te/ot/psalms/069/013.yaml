  text: וַ/אֲנִ֤י תְפִלָּתִֽ/י לְ/ךָ֨ יְהוָ֡ה עֵ֤ת רָצ֗וֹן אֱלֹהִ֥ים בְּ/רָב חַסְדֶּ֑/ךָ עֲ֝נֵ֗/נִי בֶּ/אֱמֶ֥ת יִשְׁעֶֽ/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/013.yaml
  text: But as for me[a], my prayer is to you, O Yahweh, at a time of favor; O God, in the abundance of your steadfast love[b], answer me in the truth of your salvation.
translation:
  language: te
  text: అయితే నా ప్రార్థన నీకు, యహ్వే; అనుకూలమైన సమయంలో[a], దేవా, నీ అపారమైన స్థిరమైన ప్రేమను బట్టి, నీ రక్షణ సత్యానికి అనుగుణంగా నాకు జవాబివ్వు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అంగీకారయోగ్యమైన సమయంలో.” దేవుడు ఆలకించి కార్యం చేయడానికి అనుకూలమైన సమయాన్ని హీబ్రూ పదబంధం సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీ రక్షణ విశ్వసనీయతకు అనుగుణంగా.” אמת అనే హీబ్రూ పదానికి “సత్యం” లేదా “విశ్వసనీయత/నమ్మకత్వం” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: అయితే నేను
  rationale: సంధిపదం, స్వతంత్ర సర్వనామం కలిసి సందర్భంలోని వ్యత్యాసాన్ని, వ్యక్తిగత ఉద్ఘాటనను సూచిస్తున్నాయి.
- source_word: תְפִלָּתִי לְךָ
  choice: నేను నీకే ప్రార్థిస్తున్నాను
  rationale: అక్షరార్థంగా ‘నా ప్రార్థన నీకు’; తెలుగులో సహజమైన క్రియారూపం ద్వారా ప్రార్థన దిశను తెలియజేస్తూ, ‘నీకే’తో ఉద్ఘాటనను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ప్రత్యక్షంగా లిప్యంతరీకరించింది.
- source_word: עֵת רָצוֹן
  choice: అనుకూలమైన సమయంలో
  rationale: దేవుడు ఆలకించి కార్యం చేయడానికి అనుగ్రహపూర్వకంగా అనుకూలమైన కాలం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בְּרָב חַסְדֶּךָ
  choice: నీ అపారమైన స్థిరప్రేమనుబట్టి
  rationale: רב యొక్క సమృద్ధిని ‘అపారమైన’ అని, חסד లోని నిలకడగల నమ్మకమైన ప్రేమను ‘స్థిరప్రేమ’ అని వ్యక్తం చేస్తుంది; ב ఇక్కడ ఆధారం లేదా ప్రమాణాన్ని సూచిస్తుంది.
- source_word: עֲנֵנִי
  choice: నాకు జవాబివ్వు
  rationale: ప్రార్థనా సందర్భంలో ప్రత్యక్షమైన వేడుకోలును సహజంగా తెలియజేస్తుంది.
- source_word: בֶּאֱמֶת יִשְׁעֶךָ
  choice: నీ రక్షణ సత్యంతో
  rationale: אמת యొక్క ‘సత్యం’ భావాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, ב ను సాధన లేదా ఆధార భావంతో సహజంగా వ్యక్తం చేస్తుంది; ‘విశ్వసనీయత’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యహ్వే
  alternative: యెహోవా
  rationale: హీబ్రూ పాఠ్యంలో వ్యక్తిగత దైవ నామం ప్రత్యక్షంగా ఉంది; అందువల్ల దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం.
- issue: אֱמֶת పదం రక్షణతో ఉన్న సంబంధం
  choice: సత్యం
  alternative: విశ్వసనీయత
  rationale: ఈ పదం ‘సత్యం’ లేదా ‘నమ్మకత్వం/విశ్వసనీయత’ రెండింటినీ సూచించగలదు. ప్రధాన పాఠ్యం మొదటి భావాన్ని ఉంచగా, సందర్భోచితమైన రెండవ భావాన్ని పాదసూచిక సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గౌరవభరితమైన, నేరుగా వేడుకునే శైలి. ‘స్థిరప్రేమ’ חסד లోని నిలకడ, నిబద్ధత భావాలను సంక్షిప్తంగా మోస్తుంది. ప్రధాన పాఠ్యంలోని ప్రతి పాదసూచిక సూచిక [a], [b] సంబంధిత స్థానంలో చేర్చబడింది.
