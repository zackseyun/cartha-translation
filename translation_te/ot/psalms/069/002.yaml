id: PSA.69.2
reference: Psalms 69:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: טָבַ֤עְתִּי בִּ/יוֵ֣ן מְ֭צוּלָה וְ/אֵ֣ין מָעֳמָ֑ד בָּ֥אתִי בְ/מַעֲמַקֵּי מַ֝֗יִם וְ/שִׁבֹּ֥לֶת שְׁטָפָֽתְ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/002.yaml
  text: I have sunk in deep mire[a], and there is no foothold; I have come into deep waters, and the flood has swept over me.
translation:
  language: te
  text: 'నేను లోతైన బురదలో మునిగిపోయాను;

    కాలు నిలపడానికి చోటే లేదు.

    లోతైన నీళ్లలోకి వచ్చాను;

    నీటి ప్రవాహం నన్ను ముంచెత్తింది.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వరద నన్ను కొట్టుకుపోయింది”; లేదా, “ప్రవాహం నన్ను కమ్మేసింది.”
    reason: శִׁבֹּלֶת మరియు שׁטף పదాల కలయికను ‘ప్రవాహం ముంచెత్తింది,’ ‘వరద కొట్టుకుపోయింది,’ లేదా ‘ప్రవాహం కమ్మేసింది’ అని అనువదించవచ్చు.
lexical_decisions:
- source_word: טָבַעְתִּי
  choice: మునిగిపోయాను
  rationale: Qal perfect first-person singular. The Telugu perfective form naturally conveys both the experienced event and its continuing perilous result.
- source_word: בִּיוֵן מְצוּלָה
  choice: లోతైన బురదలో
  rationale: יוֵן denotes mire or mud, while מְצוּלָה contributes the idea of depth. This wording preserves both elements in clear modern Telugu.
- source_word: וְאֵין מָעֳמָד
  choice: కాలు నిలపడానికి చోటే లేదు
  rationale: מָעֳמָד is a place or support for standing. This idiomatic Telugu expression preserves the physical image of finding no secure footing.
- source_word: בָּאתִי
  choice: వచ్చాను
  rationale: The Qal perfect of בוא indicates coming or entering into the watery depths. In context, the following phrase supplies the destination, so the ordinary Telugu verb is sufficient.
- source_word: בְמַעֲמַקֵּי מַיִם
  choice: లోతైన నీళ్లలోకి
  rationale: The phrase denotes the depths of waters. The directional suffix లోకి naturally expresses motion with వచ్చాను in Telugu.
- source_word: שִׁבֹּלֶת
  choice: నీటి ప్రవాహం
  rationale: Here שִׁבֹּלֶת denotes a forceful current, stream, or flood. నీటి ప్రవాహం retains the concrete water image without deciding more narrowly between current, torrent, and flood.
- source_word: שְׁטָפָתְנִי
  choice: నన్ను ముంచెత్తింది
  rationale: שטף conveys inundating, sweeping over, or engulfing. ముంచెత్తింది is vivid, natural Telugu and expresses overpowering water without implying that the speaker was necessarily carried away.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనలోని ఆపదభరితమైన జలరూపకాన్ని స్పష్టంగా, గౌరవప్రదంగా ఉంచింది. పాద విభజన హెబ్రీ సమాంతర నిర్మాణాన్ని ప్రతిబింబిస్తుంది.
