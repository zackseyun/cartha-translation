review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the Hebrew sequence and core senses well: weariness resulting from crying out, a dried/burning throat, failing eyes, and expectant waiting for the psalmist''s God. However, the repeated wording “మొరపెట్టి మొరపెట్టి” makes explicit a repetition/intensity not stated by the Hebrew, and “క్షీణించాయి” is less natural for eyes in this immediate physical-lament context.'
  naturalness: The register is appropriately modern and dignified. “నా కళ్లు నీరసించిపోయాయి” more naturally expresses eyes being spent/failing than “నా కళ్లు క్షీణించాయి.” The alternative for hopeful waiting is also smoother as “ఆశతో ఎదురుచూస్తూ.”
  terminology: “మొరపెట్టి,” “గొంతు,” “ఎండిపోయింది,” “నిరీక్షిస్తూ,” and “నా దేవునికోసం” are faithful, natural choices. The revised wording preserves the ambiguity of יחל between waiting and hoping without importing doctrinal interpretation.
  issues:
  - severity: low
    issue: The main clause duplicates “మొరపెట్టి.”
    rationale: The Hebrew states weariness in/through crying out but does not explicitly repeat the word or otherwise mark repetition. Telugu can express the causal relationship naturally without this modest added intensification.
  - severity: low
    issue: “నా కళ్లు క్షీణించాయి” is somewhat stiff and imprecise in modern Telugu.
    rationale: כלה with “eyes” depicts them as spent, exhausted, or failing. “నా కళ్లు నీరసించిపోయాయి” preserves the embodied image and reads more naturally.
  - severity: low
    issue: The footnote alternative “ఆశపెట్టుకొని ఉండగా” is less direct than the Hebrew's expectant-waiting sense.
    rationale: “ఆశతో ఎదురుచూస్తూ” expresses hopeful expectation while retaining the temporal sense of the participle.
  revised_text: నేను మొరపెట్టి అలసిపోయాను; నా గొంతు ఎండిపోయింది[a]. నా దేవునికోసం నిరీక్షిస్తూ నా కళ్లు నీరసించిపోయాయి[b].
