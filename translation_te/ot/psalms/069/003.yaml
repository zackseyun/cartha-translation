  text: I am weary from my crying[a]; my throat is parched[b]; my eyes fail while I wait for my God.
translation:
  language: te
  text: నేను మొరపెట్టి అలసిపోయాను; నా గొంతు ఎండిపోయింది[a]. నా దేవునికోసం నిరీక్షిస్తూ నా కళ్లు నీరసించిపోయాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా గొంతు బొంగురుపోయింది.’ హీబ్రూ పదం దీర్ఘకాలంగా మొరపెట్టడం వల్ల గొంతు ఎండిపోవడం లేదా మండడాన్ని మరింత నేరుగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా దేవునికోసం ఆశతో ఎదురుచూస్తూ.’ హీబ్రూ క్రియ నిరీక్షించడాన్నీ ఆశతో ఎదురుచూడడాన్నీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגַעְתִּי בְקָרְאִי
  choice: నేను మొరపెట్టి మొరపెట్టి అలసిపోయాను
  rationale: יגע ఫలితంగా కలిగిన అలసటను సూచిస్తుంది; בְּקָרְאִי కారణార్థకంగా, సహాయం కోసం పదేపదే మొరపెట్టడం వల్ల వచ్చిన అలసటను తెలియజేస్తుంది. పునరుక్తి దీర్ఘకాల మొరను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נִחַר גְּרוֹנִי
  choice: నా గొంతు ఎండిపోయింది
  rationale: נחר వేడి, ఎండిపోవడం లేదా మంటపట్టిన స్థితిని సూచించగలదు. గొంతుతో కలిసినప్పుడు దీర్ఘకాలంగా మొరపెట్టడం వల్ల కలిగిన ఎండుదనాన్ని ఈ అనువాదం నేరుగా నిలుపుతుంది.
- source_word: כָּלוּ עֵינַי
  choice: నా కళ్లు క్షీణించాయి
  rationale: כלה ఇక్కడ కళ్లు శక్తి కోల్పోయి నీరసించడం లేదా విఫలమవడం అనే భావాన్ని ఇస్తుంది. ‘క్షీణించాయి’ నిరీక్షణ వల్ల కలిగిన దృష్టి అలసటను, శరీర సంబంధ రూపకాన్ని నిలుపుతుంది.
- source_word: מְיַחֵל לֵאלֹהָי
  choice: నా దేవునికోసం నిరీక్షిస్తూ
  rationale: יחל నిరీక్షణతో పాటు ఆశాభావాన్ని కూడా వ్యక్తం చేయగలదు. ప్రధాన పాఠంలో ‘నిరీక్షిస్తూ’ కాలవ్యాప్తిని చూపుతుంది; ఆశ అనే ప్రత్యామ్నాయ ఛాయను పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: מְיַחֵל లో నిరీక్షణ మరియు ఆశ మధ్య భావ ఉద్వేగం
  choice: ప్రధాన పాఠంలో ‘నిరీక్షిస్తూ’
  alternative: ‘నా దేవునిపై ఆశపెట్టుకొని’
  rationale: హీబ్రూ క్రియ ఎదురు చూడడాన్నీ ఆశాభావాన్నీ కలిపి సూచించగలదు. సందర్భంలోని దీర్ఘకాల సహనాన్ని ప్రధాన పాఠం ముందుకు తెస్తుంది; ఆశాభావాన్ని పాదటిప్పణి ద్వారా సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన విలాప శైలి. శరీర సంబంధ చిత్రణను నిలుపుతూ, ‘మొరపెట్టి మొరపెట్టి’ అనే సహజ పునరుక్తితో నిరంతర పిలుపు తీవ్రతను వ్యక్తం చేసింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
