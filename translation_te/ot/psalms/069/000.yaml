  text: 'For the choirmaster: according to Lilies[a]. Of David[b].'
translation:
  language: te
  text: 'సంగీత నాయకునికి: “లిల్లీలు” ప్రకారం[a]. దావీదుకు చెందినది[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘“లిల్లీలు” అనే బాణీకి అనుగుణంగా.’ ఈ మాట బహుశా ఒక బాణీ లేదా సంగీత పద్ధతి పేరును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘దావీదుకు చెందినది’ అనే హీబ్రూ మాట రచనను, అంకితాన్ని లేదా సంబంధాన్ని సూచించవచ్చు; అది ఒక్కటే దావీదు రచయిత అని ఖచ్చితంగా తేల్చదు.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకునికి
  rationale: కీర్తన శీర్షికల్లో ఈ పదం గానవాద్య ప్రదర్శనను నడిపించే వ్యక్తికి ఇచ్చే సూచనను తెలియజేస్తుంది. ‘సంగీత నాయకుడు’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండి, కేవలం గాయకబృందానికే అర్థాన్ని పరిమితం చేయదు.
- source_word: עַל
  choice: ప్రకారం
  rationale: సంగీత శీర్షికలో ఇది రాగం, బాణీ లేదా ప్రదర్శన విధానంతో ఉన్న సంబంధాన్ని సూచించవచ్చు. ‘ప్రకారం’ ఆ సంబంధాన్ని ఉంచుతూ, ఏ ఒక్క సాంకేతిక అర్థాన్నీ ఖచ్చితంగా నిర్ణయించదు.
- source_word: שׁוֹשַׁנִּים
  choice: “కలువలు”
  rationale: ఈ పదానికి అక్షరార్థం ‘కలువలు/లిల్లీలు’; ఇక్కడ ఇది బహుశా ఒక బాణీ లేదా సంగీత పద్ధతి పేరు. ఉద్ధరణ చిహ్నాలు దాని శీర్షికసదృశ వాడకాన్ని సూచిస్తాయి.
- source_word: לְדָוִד
  choice: దావీదుకు చెందినది
  rationale: לְ ఉపసర్గ రచన, అంకితం లేదా సంబంధాన్ని సూచించగలదు. ‘దావీదుకు చెందినది’ అనే రూపం ‘దావీదు రచించినది’ అని అతిగా నిర్ధారించకుండా మూలంలోని విస్తృత సంబంధార్థాన్ని కాపాడుతుంది.
theological_decisions:
- issue: לְדָוִד అనే మాట దావీదు రచయిత అని నిర్ధారిస్తుందా?
  choice: దావీదుకు చెందినది
  alternative: దావీదు రచించినది
  rationale: హీబ్రూ నిర్మాణం రచయితత్వాన్ని సూచించవచ్చు, కానీ అంకితం లేదా సంబంధాన్ని కూడా సూచించగలదు; అందువల్ల అసలు పాఠంలోని సందిగ్ధతను నిలుపుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తన శీర్షికకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. సంగీత సంబంధమైన అనిశ్చితి మరియు לְדָוִד యొక్క భావవ్యాప్తి పాదసూచనల్లో స్పష్టంగా నిలుపబడ్డాయి.
