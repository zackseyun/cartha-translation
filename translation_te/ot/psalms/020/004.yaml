  text: May he grant you according to your heart[a], and fulfill all your counsel.
translation:
  language: te
  text: 'నీ హృదయం కోరినదాన్ని ఆయన నీకు అనుగ్రహించి,

    నీ ఆలోచనలన్నిటినీ[a] నెరవేర్చుగాక.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ ప్రణాళికలన్నిటినీ నెరవేర్చుగాక.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּן
  choice: అనుగ్రహించి ... నెరవేర్చుగాక
  rationale: נתן యొక్క ప్రాథమిక భావం ‘ఇవ్వడం’. ఈ ఆశీర్వాద ప్రార్థన సందర్భంలో ‘అనుగ్రహించు’ సహజంగా ఉండి, యిక్తోల్ రూపంలోని ఆకాంక్షార్థాన్ని చివరి క్రియతో కలిపి తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְךָ
  choice: నీకు
  rationale: హీబ్రూ పరోక్ష కర్మను తెలుగులో సహజంగా ‘నీకు’ అని వ్యక్తం చేశాం.
- source_word: כִלְבָבֶךָ
  choice: నీ హృదయానికి తగినదాన్ని
  rationale: అక్షరార్థమైన ‘నీ హృదయం ప్రకారం’ అనే భావాన్ని సహజమైన తెలుగులో ఇస్తూ, ‘హృదయం’ అనే హీబ్రూ రూపకాన్ని నిలిపాం. ఇది కోరిక, సంకల్పం, అంతరంగ ఉద్దేశం వంటి విస్తృత భావాన్ని కలిగి ఉంది.
- source_word: וְכָל
  choice: అన్నిటినీ
  rationale: వావ్ సంధి రెండు ప్రార్థనాంశాలను కలుపుతుంది; כל యొక్క సమగ్ర భావాన్ని ‘అన్నిటినీ’ తెలియజేస్తుంది.
- source_word: עֲצָתְךָ
  choice: నీ ఆలోచనలన్నిటినీ
  rationale: עֵצָה సందర్భానుసారం ఆలోచన, యోచన, ప్రణాళిక, సంకల్పం అనే భావాలను ఇవ్వగలదు. ‘ఆలోచనలు’ deliberation భావాన్ని నిలిపి సాధారణ పాఠకులకు సహజంగా ఉంటుంది; సందర్భోచితమైన ‘ప్రణాళికలు’ను పాదటిప్పణిలో ఉంచాం.
- source_word: יְמַלֵּא
  choice: నెరవేర్చుగాక
  rationale: מלא పియేల్ ఇక్కడ పూర్తిగా సాకారం చేయడం అనే భావం ఇస్తుంది. ‘నెరవేర్చుగాక’ ఆ భావంతో పాటు ప్రార్థనాత్మక ఆకాంక్షను స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఆశీర్వాదం/ప్రార్థన సందర్భంలో క్రియారూపాల బలం
  choice: 'రెండు క్రియలను ఆకాంక్షార్థక ప్రార్థనగా అనువదించడం: ‘అనుగ్రహించి ... నెరవేర్చుగాక’'
  alternative: 'సాధారణ భవిష్యత్తుగా: ‘ఆయన ... అనుగ్రహిస్తాడు, నెరవేరుస్తాడు’'
  rationale: రూపపరంగా ఇవి యిక్తోల్ క్రియలైనా, కీర్తన 20లోని వరుస ప్రార్థనల సందర్భం వీటికి జస్సివ్‌లాంటి ఆశీర్వాదార్థాన్ని ఇస్తుంది. తెలుగు వాక్యంలో చివరి ‘గాక’ రెండు సమన్విత క్రియలకూ వర్తిస్తుంది.
- issue: ఈ వాక్యంలో ‘హృదయం’ అర్థం
  choice: కోరిక లేదా ఉద్దేశాన్ని మాత్రమే నిర్దిష్టంగా చెప్పకుండా ‘హృదయం’ అనే రూపకాన్ని నిలపడం
  alternative: ‘నీ కోరిక ప్రకారం’ లేదా ‘నీ సంకల్పం ప్రకారం’ అని స్పష్టీకరించడం
  rationale: హీబ్రూ ‘హృదయం’ అంతరంగ కోరిక, సంకల్పం, ఉద్దేశం మొదలైన భావాలను కలిగి ఉంది. దానిని నిలపడం మూలంలోని విస్తృత భావాన్నీ నిజమైన అనిశ్చితినీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనాత్మక గౌరవశైలికి ‘అనుగ్రహించి ... నెరవేర్చుగాక’ వాడాం. ‘హృదయం’ అనే బైబిలీయ రూపకాన్ని నిలిపి, עֵצָה యొక్క సందర్భోచిత ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
