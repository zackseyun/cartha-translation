  text: נְרַנְּנָ֤ה בִּ֘/ישׁ֤וּעָתֶ֗/ךָ וּ/בְ/שֵֽׁם אֱלֹהֵ֥י/נוּ נִדְגֹּ֑ל יְמַלֵּ֥א יְ֝הוָ֗ה כָּל מִשְׁאֲלוֹתֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/005.yaml
  text: We will shout for joy in your salvation[a], and in the name of our God we will raise our banners[c][b]. May Yahweh fulfill all your requests.
translation:
  language: te
  text: 'నీ రక్షణను బట్టి మేము ఆనందంతో కేకలు వేస్తాం[a];


    మా దేవుని నామంలో మా పతాకాలను ఎగరవేస్తాం[b].


    యహ్వే నీ విన్నపాలన్నిటినీ నెరవేర్చుగాక[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ విజయాన్ని బట్టి’ లేదా ‘నీ విమోచనను బట్టి.’ హెబ్రీ పదం విస్తృత అర్థంలో రక్షణను సూచించడమే కాక, విడిపింపును లేదా యుద్ధ విజయాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘మా పతాకాన్ని నిలబెడతాం.’ హెబ్రీ క్రియ విజయోత్సవంలో పతాకాన్ని పైకెత్తడం లేదా ప్రదర్శించడం అనే భావాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘యహ్వే నీ విన్నపాలన్నిటినీ నెరవేరుస్తాడు.’ హెబ్రీ క్రియారూపాన్ని ప్రార్థనాత్మక కోరికగా గానీ, భవిష్యద్వాక్యంగా గానీ అర్థం చేసుకోవచ్చు; ఈ సందర్భంలో ప్రార్థనాత్మక భావం మరింత సహజంగా సరిపోతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: נְרַנְּנָה
  choice: మేము ఆనందంతో కేకలు వేస్తాం
  rationale: רנן అనే క్రియ ఉల్లాసభరితమైన బహిరంగ ఆనందధ్వనిని సూచిస్తుంది. సందర్భంలో పాడడం సాధ్యమైనా, క్రియ తప్పనిసరిగా గానాన్నే సూచించదు; అందువల్ల ‘ఆనందంతో కేకలు వేస్తాం’ దాని బలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בִּישׁוּעָתֶךָ
  choice: నీ రక్షణలో
  rationale: יְשׁוּעָהకు రక్షణ, విమోచన, విజయం అనే భావపరిధి ఉంది. రాజు యుద్ధసందర్భంలో ‘విజయం’ సముచితమైనప్పటికీ, ‘రక్షణ’ మూలపదంలోని విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: וּבְשֵׁם אֱלֹהֵינוּ
  choice: మా దేవుని నామంలో
  rationale: בְּ అనే విభక్తి ఇక్కడ దేవుని అధికారాన్ని, ఆయనతో గుర్తింపును ఆధారంగా చేసుకొని కార్యం చేయడాన్ని సూచించే ‘నామంలో’ అనే సహజమైన నుడికారంగా అనువదించబడింది.
- source_word: נִדְגֹּל
  choice: మా పతాకాలను ఎగరవేస్తాం
  rationale: דגל ఇక్కడ విజయోత్సవంలో పతాకాన్ని పైకెత్తడం లేదా ప్రదర్శించడం అనే దృశ్యాన్ని సూచించే అవకాశం ఎక్కువ. బహువచన రూపం తెలుగులో సామూహిక ఉత్సవ దృశ్యాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְמַלֵּא
  choice: నెరవేర్చుగాక
  rationale: రూపపరంగా అసంపూర్ణ క్రియారూపమైనప్పటికీ, ఈ ప్రార్థనా సందర్భంలో ఇది కోరిక లేదా ఆశీర్వాద వాక్యంగా పనిచేస్తుంది. ‘నెరవేర్చుగాక’ ఆ ప్రార్థనా స్వరాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు అనుగుణంగా తెలుగులో ‘యహ్వే’ అని లిప్యంతరీకరించబడింది.
- source_word: כָּל מִשְׁאֲלוֹתֶיךָ
  choice: నీ విన్నపాలన్నిటినీ
  rationale: מִשְׁאֲלוֹת కోరబడిన విషయాలను సూచిస్తుంది. ప్రార్థనా సందర్భానికి ‘విన్నపాలు’ సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
theological_decisions:
- issue: రాజసంబంధమైన యుద్ధకీర్తనలో יְשׁוּעָה భావం
  choice: రక్షణ
  alternative: విజయం; విమోచన
  rationale: తక్షణ సందర్భం రాజుకు దేవుడు అనుగ్రహించే విజయాన్ని సూచించగలదు. అయినా ‘రక్షణ’ అనే విస్తృత పదం సైనిక విజయాన్ని మినహాయించకుండా, హెబ్రీ పదంలోని సమగ్ర భావాన్ని మరియు దైవశాస్త్రీయ బరువును కాపాడుతుంది.
- issue: చివరి יְמַלֵּא క్రియారూపపు బలం
  choice: ప్రార్థనాత్మక కోరిక—‘నెరవేర్చుగాక’
  alternative: సాధారణ భవిష్యద్వాక్యం—‘నెరవేరుస్తాడు’
  rationale: కీర్తనలోని సామూహిక ప్రార్థన, ఆశీర్వాద సందర్భానికి కోరికను తెలిపే పఠనం బాగా సరిపోతుంది. అయితే హెబ్రీ రూపం భవిష్యద్వాక్యంగా కూడా అర్థమయ్యే అవకాశాన్ని పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కవితా శైలి వాడబడింది. సమాంతర పాద నిర్మాణం నిలుపబడింది; ‘యహ్వే’ అనే వ్యక్తిగత దైవనామం బిరుదుతో భర్తీ చేయబడలేదు.
