source:
  edition: WLC
  text: יִזְכֹּ֥ר כָּל מִנְחֹתֶ֑/ךָ וְ/עוֹלָתְ/ךָ֖ יְדַשְּׁנֶ֣/ה סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/003.yaml
  text: May he remember all your offerings and accept your burnt offering[b][a]. Selah
translation:
  language: te
  text: 'నీ అర్పణలన్నిటినీ[a] ఆయన జ్ఞాపకం చేసుకొనుగాక;

    నీ దహనబలిని అనుకూలంగా స్వీకరించుగాక[b].

    సెలా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ ధాన్యార్పణలన్నిటినీ.’ హీబ్రూ పదం మిన్‌ఖా ప్రత్యేకంగా ధాన్యార్పణను గానీ, మరింత విస్తృతంగా అర్పణను లేదా కానుకను గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘కొవ్వుగా చేయుగాక’ లేదా ‘సమృద్ధమైనదిగా ఎంచుగాక’; బలిని అనుకూలంగా స్వీకరించడాన్ని సూచించే నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְכֹּר
  choice: జ్ఞాపకం చేసుకొనుగాక
  rationale: זכר అనే క్రియ ఇక్కడ ఆశీర్వాద ప్రార్థనలో కోరికను తెలిపే భావంతో ఉంది. ‘జ్ఞాపకం చేసుకొనుగాక’ ఆ ప్రార్థనా స్వరాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: כָּל
  choice: అన్నిటినీ
  rationale: హీబ్రూ పరిమాణవాచకంలోని సమగ్ర భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מִנְחֹתֶךָ
  choice: నీ అర్పణలన్నిటినీ
  rationale: מִנְחָה కానుక లేదా అర్పణ అనే విస్తృత అర్థాన్నీ, ప్రత్యేకంగా ధాన్యార్పణ అనే బలిసంబంధ అర్థాన్నీ కలిగి ఉండగలదు. సందర్భాన్ని అనవసరంగా సంకుచితం చేయకుండా ప్రధాన పాఠంలో ‘అర్పణలు’ వాడి, ప్రత్యేక అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְעוֹלָתְךָ
  choice: నీ దహనబలిని
  rationale: עוֹלָה అనేది పూర్తిగా దహనం చేసే బలికి ప్రామాణిక బలిసంబంధ పదం; ‘దహనబలి’ ఆధునిక తెలుగు బైబిలు వాడుకలో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: יְדַשְּׁנֶה
  choice: అనుకూలంగా స్వీకరించుగాక
  rationale: דשן పియేల్ రూపానికి అక్షరార్థంగా ‘కొవ్వుగా చేయడం’ లేదా ‘సమృద్ధమైనదిగా ఎంచడం’ అనే చిత్రం ఉంది. బలి సందర్భంలో అది దేవుడు బలిని ప్రసన్నంగా అంగీకరించడాన్ని సూచిస్తుంది; ‘అనుకూలంగా స్వీకరించుగాక’ ఆ సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఈ పదం యొక్క ఖచ్చితమైన కార్యం అనిశ్చితంగా ఉన్నందున అర్థాన్ని ఊహించి అనువదించకుండా సంప్రదాయ లిప్యంతరీకరణను నిలిపాం.
theological_decisions:
- issue: మూడవ పురుష ఏకవచన క్రియలకు కర్త ఎవరు?
  choice: కీర్తన సందర్భం ప్రకారం సూచిత కర్త దేవుడు; తెలుగులో ‘ఆయన’ అని వ్యక్తం చేశాం.
  alternative: కర్తను తెలుగులో కూడా పూర్తిగా అవ్యక్తంగా ఉంచడం.
  rationale: హీబ్రూలో ఈ వచనంలో కర్త నామవాచకంగా చెప్పబడకపోయినా, 20వ కీర్తన సందర్భంలో సమాజం రాజు కోసం దేవుని అనుగ్రహాన్ని ప్రార్థిస్తోంది. ‘ఆయన’ అని చేర్చడం కొత్త సిద్ధాంతాన్ని ప్రవేశపెట్టకుండా తెలుగులో ప్రార్థనను సహజంగా చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలిని వాడాం. ‘అర్పణలు’ అనే సాధారణ పదంతో మూలంలోని అర్థవిస్తృతిని నిలిపి, బలిసంబంధ ప్రత్యేకతను పాదసూచికలో ఇచ్చాం. పాదసూచిక గుర్తులను అవి వివరించే పదబంధాల వెంట ఉంచాం.
