  text: They have bowed down and fallen[a], but we have risen and stand upright.
translation:
  language: te
  text: వారు మోకాళ్లు వంగి పడిపోయారు; కానీ మేము లేచి నిటారుగా నిలిచాము.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “స్థిరపడ్డాము,” “బలపడ్డాము,” లేదా “దృఢంగా నిలిచాము.”
    reason: మూలంలోని చివరి క్రియ అరుదైనది; అది నిటారుగా నిలబడడం, తిరిగి బలపడడం లేదా స్థిరపడడం అనే పరస్పర సంబంధిత భావాలను అనుమతిస్తుంది.
lexical_decisions:
- source_word: הֵמָּה
  choice: వారు
  rationale: స్వతంత్ర మూడవ పురుష బహువచన సర్వనామం ‘మేము’తో ఉన్న స్పష్టమైన వ్యత్యాసాన్ని చూపుతుంది. తెలుగులో ‘వారు’ సహజంగా ఆ వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: כָּרְעוּ
  choice: కుంగి
  rationale: ఈ క్రియ మోకాళ్లు వంగడం లేదా కిందికి దిగిపోవడం అనే దృశ్యాన్ని సూచిస్తుంది. యుద్ధసందర్భంలో ‘మోకరిల్లి’ అనేది ఉద్దేశపూర్వకంగా మోకాళ్లపై కూర్చోవడం లేదా ఆరాధించడం అనే భావాన్ని కలిగించవచ్చు; ‘కుంగి’ మాత్రం ఓటమితో శక్తి కోల్పోయి కిందికి దిగిపోవడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְנָפָלוּ
  choice: పడిపోయారు
  rationale: మూలంలోని సరళ సమన్వయాన్ని, కుంగడం తరువాత పడిపోవడం అనే కవితాత్మక క్రమాన్ని నేరుగా నిలుపుతుంది.
- source_word: וַאֲנַחְנוּ
  choice: కానీ మేము
  rationale: వావ్ సంధి రూపపరంగా ‘మరియు’ అయినప్పటికీ, ‘వారు’–‘మేము’ మధ్య బలమైన వ్యత్యాసం ఉంది. అందువల్ల ఆధునిక తెలుగులో ‘కానీ’ ఆ విరుద్ధ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: קַּמְנוּ
  choice: లేచి
  rationale: קום అనే క్రియలోని లేవడం లేదా నిలబడడం అనే భావాన్ని, శత్రువుల పడిపోవడానికి వ్యతిరేకంగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וַנִּתְעוֹדָד
  choice: నిటారుగా నిలిచాము
  rationale: అరుదైన ఈ ఆత్మనేపద రూపం తిరిగి కోలుకోవడం, తనను బలపరచుకోవడం లేదా నిటారుగా నిలబడడం అనే భావాలను కలిగి ఉంది. ‘నిటారుగా నిలిచాము’ ముందున్న ‘లేచి’తో సహజంగా అనుసంధానమై భౌతిక పునరుద్ధరణను చూపుతుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
