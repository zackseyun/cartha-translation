  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా, కీర్తనలోని సంక్షిప్త కవితాత్మక వ్యత్యాసాన్ని మరియు గంభీరతను నిలిపాం. ‘మోకరిల్లి’ వల్ల రావచ్చిన ఆరాధనా భావాన్ని నివారించడానికి ‘కుంగి’ ఎంచుకున్నాం.
