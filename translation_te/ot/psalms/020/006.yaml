id: PSA.20.6
reference: Psalms 20:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַתָּ֤ה יָדַ֗עְתִּי כִּ֤י הוֹשִׁ֥יעַ יְהוָ֗ה מְשִׁ֫יח֥/וֹ יַ֭עֲנֵ/הוּ מִ/שְּׁמֵ֣י קָדְשׁ֑/וֹ בִּ֝/גְבֻר֗וֹת יֵ֣שַׁע יְמִינֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/006.yaml
  text: I know that the LORD saves his anointed; he answers him from his holy heaven with the mighty saving deeds of his right hand.
translation:
  language: te
  text: ఇప్పుడు యెహోవా తన అభిషిక్తుణ్ణి రక్షించాడని నాకు తెలుసు[a]; ఆయన తన పవిత్ర పరలోకం నుండి అతనికి సమాధానం ఇస్తాడు, తన కుడిచేతి శక్తివంతమైన రక్షణ కార్యాల ద్వారా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “రక్షిస్తాడు.”'
    reason: హీబ్రూ సంపూర్ణ క్రియను జరిగిన కార్యంగా లేదా నిశ్చయంగా జరిగే రక్షణను తెలిపే రూపంగా అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: ఇది వాక్యంలో స్పష్టంగా ఉన్న కాలసూచక పదం; కాబట్టి అనువాదంలో నిలుపబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలోని దేవుని వ్యక్తిగత నామాన్ని తెలుగులో సుపరిచితమైన రూపంలో ప్రతిబింబిస్తుంది.
- source_word: מְשִׁיחוֹ
  choice: తన అభిషిక్తుణ్ణి
  rationale: పదశః ‘తన అభిషిక్తుడు’; ఈ కీర్తన సందర్భంలో రాజును సూచించవచ్చు. ‘మెస్సీయా’ అని అనువదించి భావాన్ని ముందుగానే పరిమితం చేయలేదు.
- source_word: מִשְּׁמֵי קָדְשׁוֹ
  choice: తన పవిత్ర ఆకాశం నుండి
  rationale: హీబ్రూ బహువచన రూపం దేవుని పరలోక నివాసాన్ని సూచిస్తుంది; సహజమైన ఆధునిక తెలుగులో ఏకవచన సమూహార్థక రూపం వాడబడింది.
- source_word: בִּגְבֻרוֹת יֵשַׁע יְמִינוֹ
  choice: తన కుడిచేతి బలమైన రక్షణ కార్యాలతో
  rationale: ‘బలప్రదర్శనలు/మహాశక్తి కార్యాలు’, ‘రక్షణ’, ‘కుడిచేయి’ అనే మూడు మూల భావాలను సహజంగా కలిపి, కార్యాల బహువచనాన్ని నిలుపుతుంది.
theological_decisions:
- issue: הוֹשִׁיעַ అనే సంపూర్ణ క్రియ యొక్క కాలార్థం
  choice: రక్షిస్తాడు
  alternative: రక్షించాడు
  rationale: కీర్తనలో వ్యక్తమవుతున్న స్థిర నమ్మకాన్ని సహజ తెలుగులో వర్తమాన/సాధారణ భావంతో తెలిపింది; అయితే హీబ్రూ సంపూర్ణ రూపం గత లేదా నిశ్చయార్థక భావాన్నీ అనుమతిస్తుంది, అందుకే పాదటిప్పణి ఇచ్చింది.
- issue: ‘అభిషిక్తుడు’ అనే పదానికి గుర్తింపు
  choice: తన అభిషిక్తుణ్ణి
  alternative: తన రాజును / మెస్సీయాను
  rationale: మూలపదంలోని విస్తృత భావాన్ని అలాగే ఉంచి, దాన్ని కేవలం చారిత్రక రాజుగా గానీ ప్రత్యేక మెస్సీయ బిరుదుగా గానీ ముందుగానే నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘జవాబిస్తాడు’, ‘రక్షణ కార్యాలు’ వంటి పదబంధాలు సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా ఎంచుకోబడ్డాయి.
