  revision_rationale: The revision retains the explicit ‘now,’ the ambiguity of ‘his anointed,’ and the imagery of God’s holy heavenly dwelling and right hand. It more directly represents the Hebrew perfect in the main text, preserves the alternative contextual sense in a footnote, and makes the instrumental saving acts phrase natural and syntactically clear in Telugu.
