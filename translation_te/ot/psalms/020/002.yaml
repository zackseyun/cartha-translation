  to: 'పరిశుద్ధ స్థలం నుండి నీకు సహాయం పంపుగాక;

    సీయోను నుండి నిన్ను నిలబెట్టుగాక.[a][b]'
  rationale: The revision removes the supplied pronoun so that the subject remains implicit as in Hebrew, and replaces the broader “ఆదుకొనుగాక” with “నిలబెట్టుగాక” to represent the sustaining/upholding sense of סעד more closely. Footnote a is orthographically corrected while retaining the stated lexical alternatives. The existing anchor placement is retained.
