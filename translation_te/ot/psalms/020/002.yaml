  text: May he send you help from the sanctuary and sustain you from Zion[a][b].
translation:
  language: te
  text: 'పరిశుద్ధ స్థలం నుండి నీకు సహాయం పంపుగాక;

    సీయోను నుండి నిన్ను నిలబెట్టుగాక.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సీయోను నుండి నీకు మద్దతు ఇవ్వుగాక” లేదా “నిన్ను నిలబెట్టుగాక.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “పరిశుద్ధత నుండి” లేదా “పరిశుద్ధ స్థలం నుండి”; ఇక్కడ ఇది దేవుని ఆలయాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: పంపుగాక
  rationale: Qal imperfect 3ms. కీర్తనలోని ఆశీర్వాద–ప్రార్థనా సందర్భాన్ని బట్టి సాధారణ భవిష్యత్తుగా కాక, ఆకాంక్షను తెలిపే విధిగా అనువదించబడింది.
- source_word: עֶזְרְךָ
  choice: నీకు సహాయం
  rationale: עֵזֶר + 2ms ప్రత్యయం అక్షరార్థంగా ‘నీ సహాయం’; ఆధునిక తెలుగులో ‘నీకు సహాయం పంపు’ సహజంగా ఉండి, సహాయం పొందే వ్యక్తినీ స్పష్టంగా ఉంచుతుంది.
- source_word: מִקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలం నుండి
  rationale: קֹדֶשׁ ‘పరిశుద్ధత’ అనే భావార్థాన్నీ, ‘పరిశుద్ధ స్థలం/ఆలయం’ అనే స్థలార్థాన్నీ కలిగి ఉంటుంది. ‘సీయోను నుండి’ అనే సమాంతర పదబంధం కారణంగా ఇక్కడ స్థలార్థం సహజం; అయితే మూలంలోని విస్తృతార్థాన్ని ‘పరిశుద్ధ స్థలం’ నిలుపుతుంది.
- source_word: וּמִצִּיּוֹן
  choice: సీయోను నుండి
  rationale: צִיּוֹן స్థలనామాన్ని ప్రామాణిక తెలుగు రూపమైన ‘సీయోను’గా ఉంచి, וְ సంధిని రెండు సమాంతర పాదాల నిర్మాణం ద్వారా వ్యక్తం చేశాం.
- source_word: יִסְעָדֶךָּ
  choice: నిన్ను ఆదుకొనుగాక
  rationale: סעד అంటే ‘ఆదుకొను, మద్దతివ్వు, నిలబెట్టు’. ‘ఆదుకొను’ ఆపదలో తోడ్పాటు, బలపరచడం అనే భావాలను సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; imperfect రూపం సందర్భానుసారం ఆకాంక్షార్థకంగా అనువదించబడింది.
theological_decisions:
- issue: క్రియలలో అంతర్లీనంగా ఉన్న కర్త ఎవరనేది
  choice: ‘ఆయన’ అని మాత్రమే అనువదించి, ముందరి సందర్భం ద్వారా యెహోవాను సూచించనిచ్చాం.
  alternative: ఈ వచనంలోనే ‘యెహోవా’ అని స్పష్టంగా చేర్చడం.
  rationale: హీబ్రూ వాక్యంలో కర్తగా దేవుని పేరు ప్రత్యక్షంగా లేదు; రెండు క్రియలూ 3ms రూపాల్లో ఉన్నాయి. మూలంలో లేని దైవనామాన్ని చేర్చకుండా, సందర్భంలోని సూచనను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనాత్మక కవితా గౌరవాన్ని నిలిపేందుకు ‘పంపుగాక/ఆదుకొనుగాక’ రూపాలు వాడబడ్డాయి. రెండవ ఏకవచన పురుషునికి సహజమైన ‘నీకు/నిన్ను’ రూపాలు ఉపయోగించబడ్డాయి. సమాంతర హీబ్రూ కవితా నిర్మాణాన్ని రెండు పాదాలుగా నిలిపాం.
