  text: יַֽעַנְ/ךָ֣ יְ֭הוָה בְּ/י֣וֹם צָרָ֑ה יְ֝שַׂגֶּבְ/ךָ֗ שֵׁ֤ם אֱלֹהֵ֬י יַעֲקֹֽב׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/001.yaml
  text: May Yahweh answer you in the day of trouble[a]; may the name of the God of Jacob protect you.
translation:
  language: te
  text: 'కష్టకాలంలో యాహ్వే నీకు జవాబివ్వుగాక;

    యాకోబు దేవుని నామం నిన్ను అందనంత ఎత్తున సురక్షితంగా ఉంచుగాక.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిన్ను కాపాడుగాక.” హీబ్రూ క్రియ, ప్రమాదానికి అందనంత ఎత్తైన సురక్షిత స్థలంలో ఒకరిని ఉంచడాన్ని చిత్రిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַנְךָ
  choice: నీకు జవాబివ్వుగాక
  rationale: ענה క్రియకు ఇక్కడ ‘జవాబివ్వడం/స్పందించడం’ అనే భావం ఉంది. కీర్తనలోని ప్రార్థనాత్మక ఆశీర్వాద సందర్భాన్ని ‘-గాక’ రూపం సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ లిప్యంతరీకరణను తెలుగులో నిలిపింది.
- source_word: בְּיוֹם צָרָה
  choice: కష్టకాలంలో
  rationale: హీబ్రూ పదబంధంలోని కాలసూచక భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; צָרָה సూచించే కష్టం లేదా ఆపద అనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: יְשַׂגֶּבְךָ
  choice: నిన్ను అందనంత ఎత్తున సురక్షితంగా ఉంచుగాక
  rationale: שׂגב పియేల్ రూపం ప్రమాదానికి అందనంత ఎత్తైన సురక్షిత స్థలంలో ఉంచే రూపకాన్ని కలిగి ఉంది. కేవలం ‘కాపాడుగాక’ అనడం కంటే ఈ అనువాదం ఆ రూపకాన్నీ దాని రక్షణార్థాన్నీ నిలుపుతుంది.
- source_word: שֵׁם
  choice: నామం
  rationale: ‘నామం’ కీర్తి, అధికారం, సన్నిధి వంటి అనుబంధ భావాలను కలిగి ఉండగలిగినా, ఇక్కడి కవితాత్మక మరియు ధార్మిక ప్రాధాన్యాన్ని కాపాడేందుకు మూలంలోని పదాన్ని నేరుగా నిలిపింది.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: యాకోబు దేవుడు
  rationale: నిర్మాణాన్ని సహజ తెలుగులో ‘యాకోబు దేవుని’ అని ఇచ్చి, మూలంలోని చారిత్రక మరియు నిబంధన సంబంధిత ప్రతిధ్వనిని నిలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దాన్ని బిరుదుగా మార్చకుండా తెలుగులో లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను నిలుపుతుంది.
- issue: ఆశీర్వాదం/ప్రార్థన సందర్భంలోని క్రియారూపాల భావం
  choice: ‘-గాక’తో ఆకాంక్షార్థక భావం
  alternative: సాధారణ భవిష్యత్తుగా ‘జవాబిస్తాడు… కాపాడుతుంది’
  rationale: సమూహ ప్రార్థన లేదా ఆశీర్వాద స్వరానికి అనుగుణంగా ఈ అసంపూర్ణ క్రియారూపాలు ఇక్కడ కేవలం భవిష్యద్వాక్యాలకంటే ఆకాంక్షలు లేదా విన్నపాలుగా బాగా అర్థమవుతాయి.
- issue: దేవుని ‘నామం’ రక్షించే కర్తగా ఉండటం
  choice: ‘యాకోబు దేవుని నామం’ అనే వ్యక్తీకరణను యథాతథంగా నిలపడం
  alternative: అర్థాన్ని విప్పి ‘యాకోబు దేవుడు తన శక్తితో’ అని అనువదించడం
  rationale: ‘నామం’లోని సన్నిధి, అధికారం, కీర్తి వంటి భావాలను ఒక్క వివరణకు పరిమితం చేయకుండా మూలంలోని ధార్మిక మరియు కవితాత్మక ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కీర్తనా శైలిని ఉపయోగించాం. సమాంతర పాద నిర్మాణాన్ని నిలిపి, ప్రార్థనాత్మక భావానికి ‘-గాక’ రూపాన్ని ఎంచుకున్నాం.
