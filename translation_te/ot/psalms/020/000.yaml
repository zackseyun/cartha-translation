lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకునికి
  rationale: కీర్తనల శీర్షికల్లో ఈ పదం సంగీత ప్రదర్శనను పర్యవేక్షించే వ్యక్తిని సూచించే ఆదేశంగా సాధారణంగా అర్థమవుతుంది. ‘సంగీత నాయకుడు’ అనేది ఆధునిక తెలుగు పాఠకులకు సహజంగా ఉండి, కేవలం గాయకబృందానికే పరిమితం చేయదు.
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: సంగీత ప్రదర్శనతో ముడిపడిన గీతాన్ని సూచించే ఈ నామవాచకానికి, కీర్తనల గ్రంథ సందర్భంలో ‘కీర్తన’ ప్రామాణికమైన, సహజమైన తెలుగు పదం.
- source_word: לְדָוִד
  choice: దావీదు కీర్తన
  rationale: హెబ్రీ ఉపసర్గ לְ రచన, సంబంధం, అంకితం లేదా స్వామ్యాన్ని సూచించగలదు. తెలుగు శీర్షికా నిర్మాణమైన ‘దావీదు కీర్తన’ ఈ సంబంధాన్ని సంక్షిప్తంగా తెలియజేస్తూ, రచయిత దావీదేనని తప్పనిసరిగా నిర్ణయించదు.
- source_word: לְ
  choice: -కి
  rationale: לַמְנַצֵּחַలోని ఉపసర్గ సంగీత ఆదేశం ఎవరికి ఉద్దేశించబడిందో సూచిస్తుంది; తెలుగులో చతుర్థీ విభక్తి ‘-కి’ దీనిని సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: దావీదుతో సంబంధాన్ని తెలిపే శీర్షిక భావం
  choice: దావీదు కీర్తన
  alternative: దావీదు రచించిన కీర్తన / దావీదు కోసం కీర్తన
  rationale: לְדָוִד అనే హెబ్రీ నిర్మాణం రచన, సంబంధం లేదా అంకితం మధ్య తప్పనిసరి నిర్ణయం చేయదు. ప్రధాన పాఠం ఆ సందిగ్ధతను నిలుపుతుంది; స్పష్టమైన ప్రత్యామ్నాయాలు పాదటిప్పణిలో ఇవ్వబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన కీర్తన శీర్షికగా రూపొందించబడింది. ‘గాననాయకుడు’ అనే మరింత సంకుచిత పదానికి బదులుగా, సంగీత నిర్వహణ అనే విస్తృత భావాన్ని నిలుపడానికి ‘సంగీత నాయకుడు’ వాడబడింది.
