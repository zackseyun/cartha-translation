  text: These trust in chariots and those in horses, but we call on the name of the LORD our God.
translation:
  language: te
  text: కొందరు రథాలను, మరికొందరు గుర్రాలను నమ్ముకుంటారు; అయితే మనం మన దేవుడైన యెహోవా నామాన్ని స్మరిస్తాం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘స్మరిస్తాం’ అని అనువదించిన హీబ్రూ పదానికి ‘జ్ఞాపకం చేసుకుంటాం’ లేదా ‘ప్రస్తావిస్తాం’ అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: నַזְכִּיר అనే హీబ్రూ క్రియ యొక్క అర్థవ్యాప్తిని మూలానికి మించిన వ్యాఖ్యానాన్ని జోడించకుండా తెలియజేయడానికి.
lexical_decisions:
- source_word: אֵלֶּה בָרֶכֶב וְאֵלֶּה בַסּוּסִים
  choice: కొందరు రథాలను, మరికొందరు గుర్రాలను నమ్ముకుంటారు
  rationale: హీబ్రూలో మొదటి రెండు వాక్యభాగాల్లో క్రియ ప్రత్యక్షంగా లేదు; కీర్తన సందర్భంలోని ఆధారపడే భావాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘నమ్ముకుంటారు’ అని పూరించాం.
- source_word: בְּשֵׁם יְהוָה אֱלֹהֵינוּ
  choice: మన దేవుడైన యెహోవా నామాన్ని
  rationale: దైవనామమైన יהוהను ‘యెహోవా’గా లిప్యంతరీకరించి, ‘మన దేవుడు’ అనే సంబంధాన్ని సహజమైన తెలుగు నిర్మాణంలో నిలిపాం.
- source_word: נַזְכִּיר
  choice: స్మరిస్తాం
  rationale: זכר అనే ధాతువు హిఫీల్ రూపానికి ‘జ్ఞాపకం చేసుకోవడం/ప్రస్తావించడం’ అనే భావవ్యాప్తి ఉంది. ఇక్కడ దేవుని నామాన్ని విశ్వాసంతో గుర్తుచేసుకొని ప్రకటించే భావాన్ని సంక్షిప్తంగా నిలిపేందుకు ‘స్మరిస్తాం’ ఎంచుకున్నాం.
theological_decisions:
- issue: రథాలు, గుర్రాలపై ఆధారం మరియు యెహోవా నామం మధ్య వ్యత్యాసం
  choice: ‘నమ్ముకుంటారు’ మరియు ‘స్మరిస్తాం’ అనే వ్యత్యాసాన్ని నిలిపాం
  alternative: రెండు భాగాల్లోనూ ‘అతిశయిస్తారు/అతిశయిస్తాం’ అని అనువదించడం
  rationale: మూలంలోని మొదటి భాగాలకు క్రియ లేకపోవడం, చివరి క్రియకు ‘స్మరించు/ప్రస్తావించు’ అనే ప్రాథమిక భావం ఉండటం వల్ల ఒకే ‘అతిశయించు’ క్రియను మొత్తం వాక్యంపై రుద్దలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే కీర్తనకు తగిన గౌరవభరిత శైలిలో రూపొందించాం. ‘రథాలు/గుర్రాలు’ అనే సమాంతర నిర్మాణాన్ని, ‘అయితే మనం’ అనే స్పష్టమైన వ్యత్యాసాన్ని కాపాడాం.
