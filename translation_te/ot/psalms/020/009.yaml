id: PSA.20.9
reference: Psalms 20:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יְהוָ֥ה הוֹשִׁ֑יעָ/ה הַ֝/מֶּ֗לֶךְ יַעֲנֵ֥/נוּ בְ/יוֹם קָרְאֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/009.yaml
  text: O Yahweh[a], save! May the King answer us in the day we call.
translation:
  language: te
  text: యాహ్వే[a], రక్షించు! మేము మొరపెట్టే రోజున రాజు మాకు జవాబిచ్చుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “యాహ్వే, రాజును రక్షించు; మేము మొరపెట్టే రోజున మాకు జవాబివ్వు.” మరొక సాధ్యమైన అనువాదం: “యాహ్వే, రక్షించు! మేము మొరపెట్టే రోజున రాజు మాకు జవాబిస్తాడు.” హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా ఉండడం వల్ల ‘రాజు’ అనే పదాన్ని ఒకటి కంటే ఎక్కువ విధాలుగా అన్వయించవచ్చు.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన లిప్యంతరీకరణతో అందించాం.
- source_word: הוֹשִׁיעָה
  choice: రక్షించు!
  rationale: ప్రత్యక్ష ప్రార్థనలోని ఆజ్ఞార్థక రూపాన్ని సహజంగా వ్యక్తపరుస్తూ, విమోచన మరియు విజయ భావాలు రెండింటికీ చోటిస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న సాధారణ నామవాచకపు ప్రత్యక్ష అర్థాన్ని ఉంచాం; అది మానవ రాజునా, దేవునికి సంబంధించిన బిరుదా అనే సందిగ్ధతను పాదసూచికలో నిలిపాం.
- source_word: יַעֲנֵנוּ
  choice: మాకు జవాబిచ్చుగాక
  rationale: సందర్భంలోని ప్రార్థనాత్మక, ఆశార్థక భావాన్ని తెలుగు విధ్యర్థక రూపంతో వ్యక్తపరుస్తుంది.
- source_word: בְיוֹם
  choice: రోజున
  rationale: హీబ్రూ కాలసూచక నుడికారాన్ని సంక్షిప్తంగా, సహజమైన కవితా తెలుగులో నిలుపుతుంది.
- source_word: קָרְאֵנוּ
  choice: మేము మొరపెట్టే
  rationale: ప్రార్థనా సందర్భంలో ‘పిలుచు’ అనే మూలార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది; అతిగా భావోద్వేగాన్ని జోడించదు.
theological_decisions:
- issue: ఈ వచనంలో ‘రాజు’ అనే పదానికి సూచితుడు ఎవరు?
  choice: ప్రధాన పాఠ్యంలో ‘రాజు’ను ‘మాకు జవాబిచ్చుగాక’ అనే క్రియకు కర్తగా ఉంచడం
  alternative: ‘యెహోవా, రాజును రక్షించు; మేము మొరపెట్టే రోజున మాకు జవాబివ్వు,’ లేదా ‘యెహోవా, రక్షించు! మేము మొరపెట్టే రోజున రాజు మాకు జవాబిస్తాడు’
  rationale: హీబ్రూ వాక్యనిర్మాణం అత్యంత సంక్షిప్తంగా ఉండి అనేక అన్వయాలకు వీలు కల్పిస్తుంది. రాజకీర్తన సందర్భంలో మానవ రాజు అనే అన్వయం సాధ్యమైనప్పటికీ, దేవునికి సంబంధించిన ‘రాజు’ అనే అన్వయమూ సాధ్యమే; అందువల్ల సందిగ్ధతను పాదసూచికలో స్పష్టంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన ప్రార్థనా-కవితా శైలిని వాడాం. ‘మొరపెట్టే’, ‘జవాబిచ్చుగాక’ రూపాలు సామాన్య పాఠకులకు అర్థమయ్యేలా ఉండి కీర్తనా గాంభీర్యాన్ని నిలుపుతాయి.
