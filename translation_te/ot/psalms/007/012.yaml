  to: వెనుదిరగకపోతే[a], ఖడ్గానికి పదును పెడతాడు[b]; విల్లును ఎక్కుపెట్టి దాన్ని సిద్ధం చేశాడు.
  rationale: Explicit reflexive possessives have been removed because they force a single antecedent in Telugu. The null-subject, possessive-less formulation remains natural and leaves the agent/referent unresolved in the verse itself, while footnote b preserves the contextual and alternative readings. విల్లును is added as the explicit object of ఎక్కుపెట్టి for smoother standard Telugu syntax.
