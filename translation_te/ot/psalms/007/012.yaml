id: PSA.7.12
reference: Psalms 7:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם לֹ֣א יָ֭שׁוּב חַרְבּ֣/וֹ יִלְט֑וֹשׁ קַשְׁתּ֥/וֹ דָ֝רַ֗ךְ וַֽ/יְכוֹנְנֶֽ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/012.yaml
  text: If he does not turn back[a], he will sharpen his sword[c][b]; he has bent his bow and made it ready.
translation:
  language: te
  text: వెనుదిరగకపోతే[a], ఖడ్గానికి పదును పెడతాడు[b]; విల్లును ఎక్కుపెట్టి దాన్ని సిద్ధం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పశ్చాత్తాపపడకపోతే.” హీబ్రూ క్రియకు “తిరుగు/వెనుదిరుగు” అనే అర్థం ఉంది; ఈ సందర్భంలో అది పశ్చాత్తాపాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ఆయుధాలను సిద్ధం చేస్తున్నవాడు తీర్పు తీర్చే దేవుడని సందర్భం సూచిస్తుంది. అయితే హీబ్రూ సర్వనామాలను దుష్టునికి అన్వయించి, అతడే తన ఆయుధాలను సిద్ధం చేసుకుంటున్నాడని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם לֹא
  choice: వెనుదిరగకపోతే
  rationale: హీబ్రూ షరతు నిర్మాణాన్ని తెలుగులో సహజమైన ‘-కపోతే’ రూపంలో వ్యక్తం చేస్తుంది.
- source_word: יָשׁוּב
  choice: వెనుదిరగకపోతే
  rationale: שׁוּב యొక్క ప్రాథమిక ‘తిరుగు/వెనుదిరుగు’ భావాన్ని నిలుపుతుంది; ఈ సందర్భంలో పశ్చాత్తాప భావం అంతర్లీనంగా ఉండవచ్చు.
- source_word: חַרְבּוֹ יִלְטוֹשׁ
  choice: తన ఖడ్గానికి పదును పెడతాడు
  rationale: ఖడ్గాన్ని పదును పెట్టడం అనే హీబ్రూ చిత్రాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: קַשְׁתּוֹ דָרַךְ
  choice: తన విల్లు ఎక్కుపెట్టి
  rationale: విల్లును ప్రయోగానికి సిద్ధం చేయడానికి వంచి నారిని బిగించే చర్యను ‘విల్లు ఎక్కుపెట్టు’ అనే సహజ తెలుగు ప్రయోగం తెలియజేస్తుంది.
- source_word: וַיְכוֹנְנֶהָ
  choice: దాన్ని సిద్ధం చేశాడు
  rationale: స్త్రీలింగ ప్రత్యయం సూచించే విల్లునే కర్మగా ఉంచి, כון యొక్క సిద్ధపరచడం అనే భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: మూడవ పురుష ఏకవచన కర్త ఎవరు?
  choice: ప్రధాన సందర్భార్థంలో తీర్పు తీర్చే దేవుడు ఆయుధాలను సిద్ధం చేస్తున్నాడు; అయితే ప్రధాన వాక్యంలో కర్తను పేరుతో పేర్కొనలేదు.
  alternative: దుష్టుడే తన ఆయుధాలను సిద్ధం చేసుకుంటున్నాడని కూడా సర్వనామాలను అన్వయించవచ్చు.
  rationale: సమీప సందర్భం దేవుణ్ణి నీతిమంతుడైన న్యాయాధిపతిగా చూపుతుంది. అయినప్పటికీ హీబ్రూ పాఠంలో కర్త స్పష్టంగా పేరుపెట్టబడలేదు. అందువల్ల తెలుగులో కూడా కర్తను చేర్చి సందిగ్ధతను తొలగించకుండా, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా ఉండే పదజాలం వాడబడింది. హీబ్రూలోని కర్త-సందిగ్ధతను కర్తపదాన్ని అదనంగా చేర్చకుండా కాపాడాం; ‘విల్లు ఎక్కుపెట్టు’ ఆయుధ సిద్ధతను సహజంగా తెలియజేస్తుంది.
