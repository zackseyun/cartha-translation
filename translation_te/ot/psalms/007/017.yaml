  to: ఆయన నీతికి అనుగుణంగా యాహ్వేకు కృతజ్ఞతలు చెల్లిస్తాను[a]; సర్వోన్నతుడైన యాహ్వే నామాన్ని స్తుతిస్తూ పాడుతాను.
