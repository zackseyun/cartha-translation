source:
  edition: WLC
  text: אוֹדֶ֣ה יְהוָ֣ה כְּ/צִדְק֑/וֹ וַ֝/אֲזַמְּרָ֗ה שֵֽׁם יְהוָ֥ה עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/017.yaml
  text: I will give thanks to Yahweh according to his righteousness[a], and I will sing praise to the name of Yahweh Most High.
translation:
  language: te
  text: ఆయన నీతికి అనుగుణంగా యాహ్వేకు కృతజ్ఞతలు చెల్లిస్తాను[a]; సర్వోన్నతుడైన యాహ్వే నామాన్ని స్తుతిస్తూ పాడుతాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన నీతిని బట్టి’; ‘ఆయన న్యాయానికి అనుగుణంగా’ లేదా ‘ఆయన న్యాయాన్ని బట్టి.’ హీబ్రూ పదానికి ‘నీతి,’ ‘న్యాయం’ అనే రెండు భావాలూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדֶה
  choice: కృతజ్ఞతలు చెల్లిస్తాను
  rationale: కీర్తనల ఆరాధనా సందర్భంలో ידה యొక్క హిఫీల్ రూపం కృతజ్ఞతలు చెల్లించడం లేదా స్తుతించడం అనే భావాన్ని ఇస్తుంది. ఇక్కడ ‘కృతజ్ఞతలు చెల్లిస్తాను’ సహజంగా ఉండి కృతజ్ఞతా భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవిక నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ ధ్వన్యంతరీకరణను తెలుగులో ‘యాహ్వే’గా ఇచ్చాం.
- source_word: כְּצִדְקוֹ
  choice: ఆయన నీతికి తగినట్లుగా
  rationale: כְ ఉపసర్గలోని ‘దానికి అనుగుణంగా/తగినట్లుగా’ అనే భావాన్ని నిలుపుతూ, צֶדֶק లోని నైతిక నీతి భావాన్ని ప్రధాన పాఠంలో ఉంచాం. సందర్భానుసారంగా ‘న్యాయం’ లేదా ‘నీతి కారణంగా’ అనే భావాలు కూడా సాధ్యమే.
- source_word: וַאֲזַמְּרָה
  choice: స్తుతిగానం చేస్తాను
  rationale: זמר ఇక్కడ సంగీతంతో కూడిన స్తుతిని సూచిస్తుంది. ‘స్తుతిగానం చేస్తాను’ ఆరాధనా భావాన్నీ, పాడే క్రియనూ సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: שֵׁם
  choice: నామానికి
  rationale: దేవుని వెల్లడైన గుర్తింపు, ఖ్యాతి అనే బైబిలు భావాలను నిలుపడానికి ప్రామాణికమైన ‘నామం’ పదాన్ని ఉపయోగించాం.
- source_word: עֶלְיוֹן
  choice: సర్వోన్నతుడైన
  rationale: దైవిక బిరుదైన עֶלְיוֹן ను సహజమైన, గౌరవప్రదమైన తెలుగు రూపంలో ఇచ్చాం; మూలంలో లేని ‘దేవుడు’ అనే పదాన్ని చేర్చలేదు.
theological_decisions:
- issue: దైవిక నామం יְהוָה యొక్క అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత దైవిక నామమే ఉంది. అందువల్ల దానిని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా ధ్వన్యంతరీకరణ చేశాం.
- issue: దేవునికి సంబంధించిన צדק పదం
  choice: నీతి
  alternative: న్యాయం
  rationale: ఈ పదం దేవుని నైతిక సద్గుణాన్నీ, న్యాయమైన కార్యాన్నీ సూచించగలదు. ప్రధాన పాఠంలో విస్తృతమైన ‘నీతి’ భావాన్ని ఉంచి, ‘న్యాయం’ అనే సందర్భోచిత ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కీర్తనా శైలిని ఉపయోగించాం. మొదటి పాదంలో మూలంలోని כְ యొక్క అనుగుణత భావాన్ని స్పష్టంగా ఉంచి, రెండో పాదంలో గానస్తుతి భావాన్ని సంక్షిప్తంగా వ్యక్తం చేశాం.
