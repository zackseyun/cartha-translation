  yaml_path: translation/ot/psalms/007/009.yaml
  text: Please let the evil of the wicked come to an end, but establish the righteous—O righteous God who examines hearts and kidneys.
translation:
  language: te
  text: 'దుష్టుల చెడు అంతమవుగాక;

    నీతిమంతుణ్ణి స్థిరపరచు.

    హృదయాలనూ మూత్రపిండాలనూ[a] పరీక్షించేవాడు

    నీతిమంతుడైన దేవుడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో “మూత్రపిండాలు.” ప్రాచీన హెబ్రీ వాడుకలో ఇవి మనిషి లోతైన భావాలు, ఆలోచనలు, ఉద్దేశాలు ఉన్న అంతరంగాన్ని సూచిస్తాయి.
    reason: ఆధునిక పాఠకులకు అపరిచితమైన హెబ్రీ శరీరాంగ రూపకాన్ని మూల పాఠ్యంలో కాపాడుతూ దాని భావాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: יִגְמָר נָא
  choice: అంతమవుగాక
  rationale: יִגְמָר అనే జుసివ్ భావాన్నీ, נָאలోని విజ్ఞాపన భావాన్నీ గంభీరమైన సహజ తెలుగు ఆశీర్వచన/విజ్ఞాపన రూపంలో వ్యక్తం చేస్తుంది.
- source_word: רַע רְשָׁעִים
  choice: దుష్టుల చెడు
  rationale: רַעను సారాంశమైన ‘చెడు’గా, רְשָׁעִיםను ‘దుష్టులు’గా నేరుగా ఉంచి, అది వారి దుష్టక్రియలా దుష్టత్వమా అనే విస్తృత భావాన్ని మూసివేయదు.
- source_word: וּתְכוֹנֵן צַדִּיק
  choice: నీతిమంతుణ్ణి స్థిరపరచు
  rationale: כונן యొక్క స్థాపించడం, దృఢపరచడం అనే భావాన్ని ‘స్థిరపరచు’ అందిస్తుంది; צַדִּיק ఏకవచన రూపాన్ని అలాగే నిలుపుతుంది.
- source_word: לִבּוֹת וּכְלָיוֹת
  choice: హృదయాలనూ మూత్రపిండాలనూ
  rationale: ప్రాచీన హెబ్రీ మానవ అంతరంగ చిత్రణను సాధారణీకరించి ‘మనస్సులు’గా మార్చకుండా, రెండు శరీరాంగ పదాలను స్పష్టంగా నిలుపుతుంది.
- source_word: וּבֹחֵן
  choice: పరీక్షించేవాడు
  rationale: בחןలోని లోతుగా పరిశీలించి నిజ స్వభావాన్ని నిర్ధారించే భావానికి సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: אֱלֹהִים צַדִּיק యొక్క వాక్యనిర్మాణ సంబంధం
  choice: ‘పరీక్షించేవాడు నీతిమంతుడైన దేవుడు’ అని ప్రకటనగా అనువదించడం
  alternative: ‘ఓ నీతిమంతుడైన దేవా, ... పరీక్షించేవాడా’ అని సంబోధనగా అనువదించడం
  rationale: హెబ్రీ పదక్రమం దేవుణ్ణి పరీక్షించే కర్తగా చదవడానికి సహజంగా వీలు ఇస్తుంది. ముందున్న ప్రార్థనా సందర్భం వల్ల సంబోధన భావం సాధ్యమైనప్పటికీ, మూలంలో స్పష్టమైన సంబోధనా సూచిక లేకపోవడంతో ప్రకటన రూపాన్ని ఎంచుకున్నాం.
- issue: כְלָיוֹת యొక్క రూపకాల భావం
  choice: ‘మూత్రపిండాలు’ అనే శరీరాంగ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘మనస్సులు’ లేదా ‘అంతరంగాలు’ అని భావానువాదం చేయడం
  rationale: హెబ్రీ మానవశాస్త్రంలో మూత్రపిండాలు లోతైన భావోద్వేగాలు, ఆలోచనలు, ఉద్దేశాల కేంద్రాన్ని సూచిస్తాయి. మూల చిత్రాన్ని తొలగించకుండా పాదటిప్పణిలో వివరణ ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన సంక్షిప్తమైన గంభీర శైలిని వాడాం. ‘అంతమవుగాక’ ప్రార్థనా స్వరాన్ని, ‘స్థిరపరచు’ ప్రత్యక్ష విజ్ఞాపనను నిలుపుతున్నాయి. మూలంలోని సమాంతర పాద నిర్మాణాన్ని పంక్తి విభజనతో ప్రతిబింబించాం.
