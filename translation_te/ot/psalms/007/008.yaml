  text: יְהוָה֮ יָדִ֪ין עַ֫מִּ֥ים שָׁפְטֵ֥/נִי יְהוָ֑ה כְּ/צִדְקִ֖/י וּ/כְ/תֻמִּ֣/י עָלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/008.yaml
  text: Yahweh judges the peoples[a]; judge me, O Yahweh[c][b], according to my righteousness and according to my integrity that is upon me.
translation:
  language: te
  text: 'యెహోవా ప్రజలకు తీర్పు తీరుస్తాడు;


    యెహోవా, నా నీతిని బట్టి నాకు తీర్పు తీర్చు[a];


    నాకున్న[c] యథార్థతను[b] బట్టి తీర్పు తీర్చు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను నిర్దోషిగా తీర్పు తీర్చు.” హీబ్రూ ఆజ్ఞ ‘నాకు తీర్పు తీర్చు’ సందర్భానుసారంగా అనుకూల తీర్పు ఇవ్వమనే భావాన్ని కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘యథార్థత’కు బదులుగా “నిర్దోష ప్రవర్తన” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “నాపై ఉన్న.” ఇక్కడ అది కీర్తనకర్తకు చెందిన లేదా అతనిలో ఉన్న యథార్థతను సూచించవచ్చు.
    reason: source_idiom
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: יָדִין
  choice: తీర్పు తీరుస్తాడు
  rationale: దీన్ క్రియలోని న్యాయనిర్ణయ భావాన్ని, కవిత్వంలో సాధారణ వర్తమాన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַמִּים
  choice: ప్రజలకు
  rationale: ఈ బహువచనం వివిధ మానవ సమూహాలను సూచిస్తుంది; ‘ప్రజలకు’ రాజకీయ దేశాలకే పరిమితం చేయకుండా ఆ విస్తృత భావాన్ని అందిస్తుంది.
- source_word: שָׁפְטֵנִי
  choice: నాకు తీర్పు తీర్చు
  rationale: మూలంలోని ఆజ్ఞార్థక ‘నాకు తీర్పు తీర్చు’ అనే నేర భావాన్ని నిలుపుతుంది; సందర్భంలో అనుకూల తీర్పు కోరుతున్న భావం ఉన్నప్పటికీ దాన్ని ప్రధాన పాఠ్యంలో ముందుగానే నిర్ణయించలేదు.
- source_word: כְּצִדְקִי
  choice: నా నీతిని బట్టి
  rationale: צדק అనే పదంలోని నీతి లేదా ఈ వివాదంలో న్యాయమైన స్థితి భావాన్ని, כְּ లోని ప్రమాణార్థాన్ని నిలుపుతుంది.
- source_word: וּכְתֻמִּי
  choice: నాకున్న యథార్థతను బట్టి
  rationale: תֻּם సూచించే సంపూర్ణ నైతిక నిజాయితీని ‘యథార్థత’ సహజంగా తెలియజేస్తుంది; సంపూర్ణ పాపరాహిత్యాన్ని అనవసరంగా సూచించదు.
- source_word: עָלָי
  choice: నాకున్న
  rationale: అక్షరార్థంగా ‘నాపై’ అయినా, ఇక్కడ యథార్థత కీర్తనకర్తకు చెందినదని తెలుగులో సహజంగా తెలియజేయడానికి ‘నాకున్న’ అని ఇచ్చాం; అక్షర రూపాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: కీర్తనకర్త తన నీతి, యథార్థతలను చెప్పుకోవడం సంపూర్ణ పాపరాహిత్యాన్ని సూచిస్తుందా?
  choice: మూలంలోని మొదటి వ్యక్తి వాదనను ‘నా నీతి’, ‘నాకున్న యథార్థత’ అని నేరుగా నిలిపాం.
  alternative: ‘ఈ విషయంలో నా నిర్దోషిత్వం’ లేదా ‘నా న్యాయమైన పక్షం’ అని సందర్భానికే పరిమితం చేసి వ్యాఖ్యానించడం.
  rationale: హీబ్రూ పాఠ్యం ‘నా నీతి’, ‘నా యథార్థత’ అని స్పష్టంగా చెబుతుంది. ఇది సందర్భానుసార న్యాయవిన్నపమా లేక మరింత విస్తృతమైన నైతిక వాదనా అనే ఉద్రిక్తతను అనువాదం పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా ధోరణిని ఉంచాం. ‘తీర్పు తీరుస్తాడు/తీర్చు’ అనే పునరుక్తి మూలంలోని న్యాయపరమైన అనుసంధానాన్ని ప్రతిబింబిస్తుంది; పాద విభజన హీబ్రూ కవిత్వ సమాంతరతను స్పష్టపరుస్తుంది.
