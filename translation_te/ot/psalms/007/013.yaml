  text: And for him he has prepared weapons of death[a]; he makes his arrows fiery.
translation:
  language: te
  text: 'అతని కోసం ఆయన మరణకరమైన ఆయుధాలను సిద్ధం చేశాడు;

    తన బాణాలను మండేవిగా చేస్తాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన బాణాలను వెంటాడేవారి కోసం చేస్తాడు,” లేదా “వెంటాడేవారికి వ్యతిరేకంగా చేస్తాడు.” ఇక్కడి హెబ్రీ పదాన్ని “మండే” అనే అర్థంలోగానీ, “వెంటాడేవారు” అనే అర్థంలోగానీ గ్రహించవచ్చు. ప్రధాన పాఠం అగ్నిబాణాల సాధారణ యుద్ధచిత్రణను అనుసరిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹו
  choice: అతని కోసం
  rationale: ל ఉపసర్గతో కూడిన తృతీయ పురుష ఏకవచన ప్రత్యయం సహజంగా ‘అతని కోసం’ అని అర్థమిస్తుంది. ముందరి సందర్భంలోని దుష్టుడే దీనికి సూచితుడు; దేవుడు అతనికి ఎదురుగా సిద్ధం చేసిన వాటిని ఇది తెలియజేస్తుంది.
- source_word: הֵכִין
  choice: సిద్ధం చేశాడు
  rationale: כון ధాతువు హిఫీల్ రూపంలో ‘సిద్ధం చేయు, తయారుగా ఉంచు’ అనే అర్థం ఇస్తుంది. పూర్తయిన సిద్ధతను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כְּלֵי מָוֶת
  choice: మరణాయుధాలను
  rationale: כְּלִי అనేది పరికరం లేదా ఆయుధాన్ని సూచించగలదు. వెంటనే బాణాల ప్రస్తావన ఉన్న యుద్ధచిత్రణలో ‘ఆయుధాలు’ సముచితం; ‘మరణాయుధాలు’ హెబ్రీ నిర్మాణంలోని ప్రాణాంతక భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: חִצָּיו
  choice: తన బాణాలను
  rationale: బహువచన నామవాచకంతో ఉన్న తృతీయ పురుష ఏకవచన ప్రత్యయానికి నేరమైన అనువాదం. తెలుగులో కర్తతో సంబంధాన్ని సహజంగా చూపడానికి ‘తన’ వాడబడింది.
- source_word: לְדֹלְקִים
  choice: మండే బాణాలుగా
  rationale: דלק రూపానికి ‘మండే’ లేదా ‘వెంటాడే’ అనే అర్థాలు సాధ్యమైనవి. బాణాలతో కూడిన యుద్ధచిత్రణలో అగ్నిబాణాల భావం సహజంగా సరిపోతుంది; నిజమైన పదసందిగ్ధతను పాదసూచికలో ఉంచాం.
- source_word: יִפְעָל
  choice: చేస్తాడు
  rationale: פעל కాల్ రూపం ఇక్కడ ‘చేయు, రూపొందించు’ అనే భావంలో బాణాలపై జరిగే చర్యను తెలియజేస్తుంది. ‘చేస్తాడు’ సరళమైన, సహజమైన వర్తమాన రూపం.
