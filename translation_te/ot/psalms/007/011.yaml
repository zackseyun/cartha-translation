source:
  edition: WLC
  text: אֱ֭לֹהִים שׁוֹפֵ֣ט צַדִּ֑יק וְ֝/אֵ֗ל זֹעֵ֥ם בְּ/כָל יֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/011.yaml
  text: God is a righteous judge[b][a], and a God who is indignant every day.
translation:
  language: te
  text: దేవుడు నీతిమంతుడైన న్యాయాధిపతి; ఆయన ప్రతిరోజూ ఆగ్రహిస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు ప్రతిరోజూ కోపపడతాడు.”
    reason: זֹעֵם‌కు ‘ఆగ్రహిస్తాడు’ లేదా మరింత సాధారణంగా ‘కోపపడతాడు’ అనే అర్థాలు సందర్భోచితంగా సాధ్యమే.
lexical_decisions:
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ కీర్తన సందర్భంలో రూపం వ్యాకరణపరంగా బహువచనమైనప్పటికీ ఏకైక దేవుణ్ణే సూచిస్తోంది; అందువల్ల తెలుగులో ఏకవచనం సహజం.
- source_word: שׁוֹפֵט
  choice: న్యాయాధిపతి
  rationale: కృదంతాన్ని ‘తీర్పుతీర్చేవాడు’ అని క్రియాత్మకంగా కూడా అనువదించవచ్చు; ఇక్కడ దేవుని స్వభావాన్ని తెలిపే విధంగా నామవాచక రూపం సహజంగా ఉంది.
- source_word: צַדִּיק
  choice: నీతిమంతుడైన
  rationale: ఈ పదం న్యాయంగా, సరిగా ఉండే స్వభావాన్ని సూచిస్తుంది. ‘నీతిమంతుడైన’ అనేది దాని నైతిక, ధార్మిక బరువును నిలుపుతుంది.
- source_word: וְאֵל
  choice: దేవుడు
  rationale: אֵל ఇక్కడ ముందున్న אֱלֹהִים‌కు సమాంతరంగా అదే దేవుణ్ణి సూచిస్తోంది. తెలుగు వాక్యనిర్మాణంలో రెండో ‘దేవుడు’ను సమానాధికరణంగా ఉంచడం సహజం; కలిపే భావం విరామచిహ్నం ద్వారా వ్యక్తమవుతుంది.
- source_word: זֹעֵם
  choice: ఆగ్రహించే
  rationale: కృదంతం కొనసాగుతున్న లేదా నియమితమైన దైవ అసంతృప్తిని తెలియజేస్తుంది. ‘ఆగ్రహించే’ అనే పదం సాధారణ కోపం కంటే నైతికంగా సముచితమైన తీవ్ర అసమ్మతిని సూచిస్తూ, మూలంలోని కఠినతను తగ్గించదు.
- source_word: בְּכָל יוֹם
  choice: ప్రతిరోజూ
  rationale: ఈ పదబంధం ఒకే రోజంతా నిరంతరంగా అనే భావం కంటే ‘రోజురోజూ/ప్రతి రోజు’ అనే నియమితత్వాన్ని సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: దైవ ఆగ్రహ భాష
  choice: ప్రతిరోజూ ఆగ్రహించే దేవుడు
  alternative: దేవుడు ప్రతిరోజూ కోపపడతాడు
  rationale: హీబ్రూ దేవునికి కొనసాగుతున్న ఆగ్రహాన్ని స్పష్టంగా ఆపాదిస్తుంది. దానిని మృదువుపరచకుండా నిలిపి, నైతిక అసమ్మతి భావాన్ని తెలిపేందుకు ‘ఆగ్రహించే’ అని అనువదించాం.
- issue: שׁוֹפֵט צַדִּיק యొక్క వ్యాకరణ సంబంధం
  choice: నీతిమంతుడైన న్యాయాధిపతి
  alternative: నీతిమంతునికి న్యాయం తీర్చేవాడు
  rationale: ప్రధాన పఠనంలో צַדִּיק అనేది שׁוֹפֵט‌ను విశేషించే పదంగా తీసుకోవడం వాక్య సమాంతరతకు, మసొరా విరామానికి అనుకూలంగా ఉంది. అయితే ‘నీతిమంతునికి తీర్పుతీర్చేవాడు’ అనే నిర్మాణసాధ్యతను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే కీర్తనాశైలిని వాడాం. మూలంలోని రెండు సమాంతర దైవ లక్షణాలను ఒక సహజ తెలుగు సమానాధికరణ వాక్యంగా ఉంచాం; దైవ ఆగ్రహాన్ని మృదువుపరచలేదు.
