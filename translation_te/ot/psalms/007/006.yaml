id: PSA.7.6
reference: Psalms 7:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ק֘וּמָ֤/ה יְהוָ֨ה בְּ/אַפֶּ֗/ךָ הִ֭נָּשֵׂא בְּ/עַבְר֣וֹת צוֹרְרָ֑/י וְ/ע֥וּרָ/ה אֵ֝לַ֗/י מִשְׁפָּ֥ט צִוִּֽיתָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/006.yaml
  text: Rise up[a], O Yahweh, in your anger; lift yourself up against the fury of my enemies; awake for me[c][b]; you have appointed judgment.
translation:
  language: te
  text: 'యాహ్వే, నీ కోపంతో లేచు;

    నా శత్రువుల కోపావేశాలకు ఎదురుగా నిన్ను నీవు పైకెత్తుకో[a].

    నా పక్షంగా మేలుకో[b];

    నీవు తీర్పును నియమించావు[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నా శత్రువుల కోపావేశాలపై ఉన్నతుడిగా లేచు.” హీబ్రూ క్రియకు పైకెత్తబడడం లేదా మహోన్నతుడిగా కనబడడం అనే భావం కూడా ఉండవచ్చు.'
    reason: lexical_alternative
  - marker: b
    text: 'అక్షరార్థంగా: “నా వైపు మేలుకో”; భావం “నా తరఫున మేలుకో” కావచ్చు.'
    reason: lexical_alternative
  - marker: c
    text: 'లేదా: “నీవు ఆజ్ఞాపించిన తీర్పు కోసం.” సంక్షిప్త హీబ్రూ వాక్యనిర్మాణం ఈ పదాలను ముందున్న ‘మేలుకో’తో కలిపి చదవడానికి కూడా వీలు కల్పిస్తుంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמָה
  choice: లేచు
  rationale: దేవుడు న్యాయపరమైన చర్యకు పూనుకోవాలని కోరే ఆజ్ఞార్థక క్రియ. మూలంలోని సజీవమైన మానవరూపకాన్ని ఆధునిక తెలుగులో సంక్షిప్తంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: בְּאַפֶּךָ
  choice: నీ కోపంతో
  rationale: אַף అక్షరార్థంగా ముక్కు/నాసికను సూచించినా, ఇక్కడ స్పష్టంగా కోపాన్ని తెలిపే హీబ్రూ నుడికారం.
- source_word: הִנָּשֵׂא
  choice: నిన్ను నీవు పైకెత్తుకో
  rationale: నిఫాల్ ఆజ్ఞార్థక రూపంలోని ప్రతిఫలిత లేదా ఎత్తబడే భావాన్ని, ముందున్న ‘లేచు’ అనే చర్యాత్మక సమాంతరంతో సహా నిలుపుతుంది.
- source_word: בְּעַבְרוֹת
  choice: కోపావేశాలకు ఎదురుగా
  rationale: עֶבְרָה ఉప్పొంగే తీవ్రమైన కోపాన్ని సూచిస్తుంది; శత్రువుల వైరం ఎదిరించే సందర్భంలో בְּ ను ‘ఎదురుగా’ అని సహజంగా వ్యక్తం చేసింది.
- source_word: צוֹרְרָי
  choice: నా శత్రువుల
  rationale: צרר క్రియ నుంచి వచ్చిన నామవాచక ప్రయోగం కీర్తనకర్తకు విరోధులైన వారిని సూచిస్తుంది.
- source_word: וְעוּרָה
  choice: మేలుకో
  rationale: దైవ జోక్యాన్ని కోరే కవితాత్మక మానవరూపక ఆజ్ఞను వివరణాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: אֵלַי
  choice: నా పక్షంగా
  rationale: అక్షరార్థమైన ‘నా వైపు/నా దగ్గరకు’ కంటే ఈ న్యాయవిన్నప సందర్భంలోని ప్రయోజనార్థక భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: מִשְׁפָּט
  choice: తీర్పును
  rationale: న్యాయస్థాన నేపథ్యంలోని న్యాయచర్య లేదా నిర్ణయాన్ని సూచిస్తుంది.
- source_word: צִוִּיתָ
  choice: నియమించావు
  rationale: צוה సాధారణంగా ‘ఆజ్ఞాపించు’ అయినా, తీర్పుతో కలిసినప్పుడు దాన్ని స్థాపించడం లేదా నిర్ణయించడం అనే భావం సాధ్యం; ‘నియమించావు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతుంది; దాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలభేదాన్ని కాపాడుతుంది.
- issue: దేవునికి ఉద్దేశించిన మానవరూపక ఆజ్ఞలు
  choice: ‘లేచు… పైకెత్తుకో… మేలుకో’ అని సజీవ రూపకాలను నిలుపుట
  alternative: ‘చర్య తీసుకో’ లేదా ‘జోక్యం చేసుకో’ అని భావానువాదం చేయుట
  rationale: ఈ ఆజ్ఞలు కీర్తనలోని అత్యవసర విన్నప స్వరాన్ని నిర్మిస్తాయి. వాటిని నిలపడం దేవుడు నిజంగా నిద్రిస్తున్నాడనే సిద్ధాంతార్థాన్ని విధించదు.
- issue: ముగింపు పదబంధం מִשְׁפָּט צִוִּיתָ యొక్క వాక్య సంబంధం
  choice: ‘నీవు తీర్పును నియమించావు’ అనే స్వతంత్ర ప్రకటన
  alternative: ‘నీవు ఆజ్ఞాపించిన తీర్పు కోసం మేలుకో’
  rationale: హీబ్రూ పదక్రమం మరియు సంక్షిప్త కవితా నిర్మాణం రెండింటికీ అవకాశం ఇస్తాయి. ప్రధాన పాఠం ప్రకటనగా చదివి, ఆధారపదబంధంగా చదివే అవకాశాన్ని పాదటిప్పణిలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనా కవిత్వానికి తగిన గంభీరతను ఉంచుతూ పాతకాలపు ఆజ్ఞార్థక రూపాలను నివారించింది. పంక్తి విభజన హీబ్రూ సమాంతరతను స్పష్టపరుస్తుంది.
