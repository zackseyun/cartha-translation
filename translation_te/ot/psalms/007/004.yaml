source:
  edition: WLC
  text: אִם גָּ֭מַלְתִּי שֽׁוֹלְמִ֥/י רָ֑ע וָ/אֲחַלְּצָ֖/ה צוֹרְרִ֣/י רֵיקָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/004.yaml
  text: if I have repaid the one at peace with me with evil[a], or delivered my enemy for nothing—
translation:
  language: te
  text: 'నాతో శాంతిగా ఉన్నవానికి నేను కీడుతో ప్రతిఫలించి ఉంటే,

    నిర్హేతుకంగా నాకు విరోధియైనవాణ్ణి విడిపించి ఉంటే[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లేక కారణం లేకుండా నా విరోధిని దోచుకొని ఉంటే.” హీబ్రూ క్రియకు సాధారణంగా “విడిపించు/రక్షించు” అనే అర్థం ఉన్నప్పటికీ, మొదటి పాదానికి సమాంతరంగా ఇక్కడ “దోచుకొను/ఒలిచివేయు” అనే భావాన్ని కొందరు గ్రహిస్తారు. רֵיקָם అనే పదానికి “వట్టి చేతులతో” అనే అర్థం కూడా రావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: ఉంటే
  rationale: స్వయంశాప ప్రమాణంలోని షరతును సహజమైన తెలుగు వాక్యనిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: גָּמַלְתִּי
  choice: ప్రతిఫలించి ఉంటే
  rationale: ఈ క్రియలో ఉన్న ‘చేసినదానికి బదులుగా చేయడం/తిరిగి చెల్లించడం’ అనే భావాన్ని నిలుపుతుంది.
- source_word: שׁוֹלְמִי
  choice: నాతో శాంతిగా ఉన్నవానికి
  rationale: స్నేహితుడు లేదా మిత్రుడు అని పరిమితం చేయకుండా, వక్తతో శాంతి సంబంధంలో ఉన్న వ్యక్తి అనే హీబ్రూ భావాన్ని దగ్గరగా తెలియజేస్తుంది.
- source_word: רָע
  choice: కీడుతో
  rationale: హాని అనే సాధారణ భావం కంటే నైతికంగా చెడ్డ ప్రతిఫలమనే బలాన్ని నిలుపుతుంది.
- source_word: וָאֲחַלְּצָה
  choice: విడిపించి ఉంటే
  rationale: חלץ క్రియకు సాధారణంగా ఉన్న ‘బయటకు తీయడం, రక్షించడం, విడిపించడం’ అనే అర్థానికి ప్రాధాన్యం ఇచ్చింది; సందర్భంలో ప్రతిపాదితమైన ‘దోచుకోవడం’ అనే అర్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: צוֹרְרִי
  choice: నాకు విరోధియైనవాణ్ణి
  rationale: వక్తకు శత్రుత్వంగా ఎదిరించే వ్యక్తిని స్పష్టంగా సూచిస్తుంది.
- source_word: רֵיקָם
  choice: నిర్హేతుకంగా
  rationale: ఇక్కడ ‘కారణం లేకుండా’ అనే అర్థాన్ని తీసుకొని విరోధం అన్యాయమైనదని తెలిపేలా అనుసంధానించింది; ‘వట్టి చేతులతో’ అనే సాధ్యార్థం కూడా ఉంది.
theological_decisions:
- issue: וָאֲחַלְּצָה צוֹרְרִי רֵיקָם అనే క్లిష్టమైన భాగం యొక్క భావం
  choice: ‘నిర్హేతుకంగా నాకు విరోధియైనవాణ్ణి విడిపించి ఉంటే’ అనే సానుకూల కార్యార్థం
  alternative: ‘లేక కారణం లేకుండా నా విరోధిని దోచుకొని ఉంటే’ అనే ప్రతికూల సమాంతరార్థం
  rationale: חלץ అనే హీబ్రూ క్రియకు ‘విడిపించు/రక్షించు’ అనేది బలంగా సాక్ష్యమున్న సాధారణ అర్థం. అయితే అది మొదటి పాదంలోని అపరాధంతో సులభంగా సమాంతరంగా ఉండదు; అందువల్ల కొందరు ఇక్కడ ‘దోచుకొను/ఒలిచివేయు’ అనే ప్రతికూల అర్థాన్ని గ్రహిస్తారు. మూలపదానికి దగ్గరైన అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సందర్భపరంగా సాధ్యమైన మరొక పఠనాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కీర్తనాశైలిని పాటించాం. ‘నాతో శాంతిగా ఉన్నవానికి’ అనే పదబంధం మూలంలోని సంబంధార్థాన్ని కాపాడుతుంది. రెండో పాదంలోని హీబ్రూ సందిగ్ధతను ప్రధాన పాఠ్యంలో నిశ్శబ్దంగా పరిష్కరించకుండా పాదసూచికలో స్పష్టంగా నిలిపాం.
