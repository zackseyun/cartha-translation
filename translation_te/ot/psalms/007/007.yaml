source:
  edition: WLC
  text: וַ/עֲדַ֣ת לְ֭אֻמִּים תְּסוֹבְבֶ֑/ךָּ וְ֝/עָלֶ֗י/הָ לַ/מָּר֥וֹם שֽׁוּבָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/007.yaml
  text: And let the assembly of peoples surround you[b][a]; and over them return on high.
translation:
  language: te
  text: ప్రజల సమూహం నిన్ను చుట్టుముట్టుగాక; దానిపై ఉన్నతస్థలానికి తిరిగి రా.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రజలు’కు బదులు ‘జాతులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘దానిపై’ అనేది ప్రజల సమూహాన్ని ఒక సమష్టిగా సూచిస్తుంది; భావానుసారంగా ‘వారిపై’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: עֲדַת
  choice: సభ
  rationale: సమావేశమైన సమూహాన్ని సూచించే ఈ పదానికి ‘సభ’ సహజమైన, గౌరవప్రదమైన తెలుగు సమానం; ప్రత్యేక మతసంఘార్థాన్ని అనవసరంగా జోడించదు.
- source_word: לְאֻמִּים
  choice: జనసమూహాల
  rationale: వివిధ జాతి లేదా ప్రజా సమూహాలను సూచించే బహువచన భావాన్ని ‘జనసమూహాలు’ స్పష్టంగా నిలుపుతుంది; ‘దేశాలు’ అనే అనువాదం కూడా సాధ్యమే.
- source_word: תְּסוֹבְבֶךָּ
  choice: నిన్ను చుట్టుముట్టుగాక
  rationale: סבב యొక్క ‘చుట్టుముట్టు’ భావాన్ని నిలుపుతూ, సందర్భంలోని ప్రార్థనాత్మక లేదా ఆకాంక్షాత్మక బలాన్ని ‘-గాక’ తెలియజేస్తుంది.
- source_word: וְעָלֶיהָ
  choice: దానికి పైగా
  rationale: హీబ్రూ స్త్రీలింగ ఏకవచన ప్రత్యయం సమష్టిగా భావించిన ‘సభ’ను సూచిస్తుంది. అందువల్ల దాని వ్యాకరణ రూపాన్ని తెలుగులో ఏకవచనంగానే నిలిపాం.
- source_word: לַמָּרוֹם
  choice: ఉన్నతస్థలానికి
  rationale: מָרוֹם యొక్క ఎత్తైన లేదా ఘనమైన స్థలమనే ప్రాథమిక భావాన్ని నిలుపుతుంది; ‘పరలోకానికి’ అని ప్రత్యేకంగా నిర్ధారించదు.
- source_word: שׁוּבָה
  choice: తిరిగి రా
  rationale: שוב యొక్క ఆజ్ఞార్థక రూపాన్ని నేరుగా వ్యక్తపరుస్తుంది; ‘మళ్లీ సింహాసనంపై కూర్చో’ వంటి వ్యాఖ్యానాత్మక విస్తరణను నివారిస్తుంది.
theological_decisions:
- issue: ఈ వచనం దేవుడు ఉన్నత న్యాయాసనం చేపట్టాలని కోరుతోందా, లేక అక్షరార్థంగా పైకి కదలాలని కోరుతోందా?
  choice: దేవుడు జనసమూహాల సభకు పైగా ఉన్నతస్థలానికి తిరిగి రావాలనే కవితాత్మక విన్నపంగా అనువదించడం
  alternative: దేవుడు సభపైగా భౌతికంగా పరలోకానికి ఎక్కాలని కోరడం; లేదా దీనిని భవిష్యత్ ప్రకటనగా చదవడం
  rationale: שׁוּבָה ఆజ్ఞార్థక రూపం విన్నపాన్ని బలపరుస్తుంది. ‘ఉన్నతస్థలం’ అనే పదం ఉన్నత పరిపాలన లేదా తీర్పు భావానికి వీలు కల్పించినా, మూలంలో స్పష్టంగా లేని సింహాసన లేదా విశ్వనిర్మాణ వివరాలను అనువాదంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గౌరవప్రదమైన కవితా శైలిని ఉపయోగించాం. ‘చుట్టుముట్టుగాక’ ప్రార్థనాత్మక స్వరాన్ని, ‘తిరిగి రా’ ఆజ్ఞార్థక విన్నపాన్ని నిలుపుతాయి. మూలంలోని ఏకవచన సమష్టి సూచనను ప్రధాన పాఠ్యంలో కాపాడి, భావానుసార బహువచనాన్ని పాదటిప్పణిలో ఇచ్చాం.
