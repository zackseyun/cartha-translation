revisions:
- from: జనసమూహాల సభ నిన్ను చుట్టుముట్టుగాక;[a] దానికి పైగా ఉన్నతస్థలానికి తిరిగి రా.[b]
  to: ప్రజల సమూహం నిన్ను చుట్టుముట్టుగాక; దానిపై ఉన్నతస్థలానికి తిరిగి రా.[a][b]
  rationale: The revision replaces the redundant expression for “assembly of peoples” with a natural collective phrase, while preserving the Hebrew’s plural “peoples” and the singular collective suffix in the second clause. It retains the petitionary force and the deliberately noncommittal “high place” imagery of the source.
