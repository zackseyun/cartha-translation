id: PSA.7.1
reference: Psalms 7:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יְהוָ֣ה אֱ֭לֹהַ/י בְּ/ךָ֣ חָסִ֑יתִי הוֹשִׁיעֵ֥/נִי מִ/כָּל רֹ֝דְפַ֗/י וְ/הַצִּילֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/001.yaml
  text: O Yahweh my God[a], in you I have taken refuge; save me from all who pursue me, and deliver me.
translation:
  language: te
  text: యాహ్వే, నా దేవా, నీలో నేను ఆశ్రయం పొందాను[a]; నన్ను తరుముతున్న వారందరి నుండి నన్ను రక్షించు, నన్ను విడిపించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీలో నేను ఆశ్రయం పొందుతున్నాను.” ప్రార్థనా సందర్భంలో హీబ్రూ పరిపూర్ణ క్రియారూపాన్ని వర్తమాన భావంతో కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని ప్రత్యేక నామమైన చతురక్షర నామాన్ని బిరుదుగా మార్చకుండా, హీబ్రూ నామానికి సమీపమైన ఆధునిక తెలుగు లిప్యంతరీకరణతో అందించాం.
- source_word: אֱלֹהַי
  choice: నా దేవా
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయాన్ని ‘నా’తో, ప్రత్యక్ష సంబోధనను సహజమైన తెలుగు సంబోధనా రూపం ‘దేవా’తో వ్యక్తం చేశాం.
- source_word: בְּךָ חָסִיתִי
  choice: నీలో నేను ఆశ్రయం పొందాను
  rationale: בְּ యొక్క ‘లో’ భావాన్ని, חסה యొక్క ఆశ్రయం కోరడం/పొందడం అనే భావాన్ని నిలిపి, పరిపూర్ణ క్రియారూపపు పూర్తయిన చర్యకు వర్తమాన ప్రాసంగికతను సహజమైన తెలుగులో తెలిపాం.
- source_word: הוֹשִׁיעֵנִי
  choice: నన్ను రక్షించు
  rationale: హిఫీల్ ఆజ్ఞార్థక రూపంలోని రక్షణ విన్నపాన్ని సూటిగా వ్యక్తం చేస్తుంది; తరువాతి נצל క్రియతో ఉన్న స్వల్ప పదభేదాన్ని కూడా నిలుపుతుంది.
- source_word: מִכָּל רֹדְפַי
  choice: నన్ను తరుముతున్న వారందరి నుండి
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న వెంబడింపు భావాన్ని ‘తరుముతున్న’తో తెలిపాం; హీబ్రూలో లేని ఉద్దేశాన్ని సూచించే ‘హింసించేవారు’ వంటి పదాన్ని చేర్చలేదు.
- source_word: וְהַצִּילֵנִי
  choice: నన్ను విడిపించు
  rationale: נצל హిఫీల్ రూపంలోని ప్రమాదం నుండి బయటకు తీసుకురావడం లేదా విడిపించడం అనే భావాన్ని వ్యక్తం చేస్తూ, ముందున్న ‘రక్షించు’తో పదభేదాన్ని నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అందించాలి
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం ప్రత్యేక దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దాన్ని సాధారణ బిరుదుగా మార్చకుండా, ‘Yahweh’ ఉచ్చారణకు సమీపంగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనకు తగిన గౌరవభరితమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. మూలంలోని రెండు రక్షణ క్రియల మధ్య స్వల్ప భేదాన్ని ‘రక్షించు’ మరియు ‘విడిపించు’గా నిలిపాం; పాదంలోని సమాంతర విన్నప స్వరాన్ని సెమీకోలన్‌తో స్పష్టంచేశాం.
