  text: A Shiggaion of David[a], which he sang to Yahweh concerning the words of Cush, a Benjaminite.
translation:
  language: te
  text: 'దావీదుకు చెందిన షిగ్గాయోన్[a]: బెన్యామీనీయుడైన కూషు మాటల గురించి అతడు యహ్వేకు పాడినది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘షిగ్గాయోన్’ అరుదైన హీబ్రూ పదం; దాని కచ్చితమైన అర్థం తెలియదు. ఇది ‘విలాపగీతం’ లేదా ‘ఉద్వేగభరితమైన గీతం’ వంటి సంగీత లేదా కవితా సాంకేతిక పదం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁגָּיוֹן
  choice: షిగ్గాయోన్
  rationale: ఈ అరుదైన హీబ్రూ పదం యొక్క కచ్చితమైన అర్థం అనిశ్చితం. దాని సాంకేతిక సంగీత లేదా కవితా స్వభావాన్ని అతిగా నిర్వచించకుండా నిలుపుకోవడానికి లిప్యంతరీకరించబడింది; సాధ్యమైన అర్థాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: לְדָוִד
  choice: దావీదుకు చెందిన
  rationale: కీర్తనల శీర్షికల్లో ל అనే విభక్తి రచయితను, అనుబంధాన్ని లేదా అంకితాన్ని సూచించవచ్చు. ‘దావీదుకు చెందిన’ అనే రూపం ఈ సంబంధాన్ని చూపిస్తూ, ‘దావీదు రచించిన’ అని ఖచ్చితంగా నిర్ణయించదు.
- source_word: אֲשֶׁר שָׁר
  choice: అతడు ... పాడినది
  rationale: సంబంధవాచక ఉపవాక్యాన్ని, שׁיר క్రియ యొక్క భూతకాల భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לַיהוָה
  choice: యహ్వేకు
  rationale: హీబ్రూ దైవనామమైన יהוהను వ్యక్తిగత నామంగా ‘యహ్వే’ అని లిప్యంతరీకరించి, ל ఉపసర్గను ‘కు’తో వ్యక్తం చేశాం.
- source_word: עַל
  choice: గురించి
  rationale: ఇక్కడ עַל అంశాన్ని లేదా సందర్భాన్ని సూచించవచ్చు. ‘గురించి’ కారణార్థాన్ని బలవంతంగా మోపకుండా విషయసంబంధాన్ని నిలుపుతుంది.
- source_word: דִּבְרֵי
  choice: మాటలను
  rationale: דָּבָר అనే పదానికి మాటలు, విషయాలు, వ్యవహారాలు వంటి అర్థాలు ఉండవచ్చు. ‘మాటలు’ మూలంలోని బహువచనానికి అత్యంత పారదర్శకమైన అనువాదం; ‘ఆరోపణలు’ వంటి ప్రత్యేక వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: כּוּשׁ
  choice: కూషు
  rationale: వ్యక్తి పేరును ఆధునిక తెలుగు ధ్వనిరూపంలో లిప్యంతరీకరించాం.
- source_word: בֶּן יְמִינִי
  choice: బెన్యామీనీయుడైన
  rationale: ఈ పదబంధం బెన్యామీను గోత్రానికి చెందిన వ్యక్తిని సూచించే వంశసంబంధ పదం. ‘బెన్యామీనీయుడు’ అనే రూపం ఆధునిక తెలుగులో సహజంగా ఆ అర్థాన్ని అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఒడంబడిక దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’ అని లిప్యంతరీకరించడం వ్యక్తిగత నామాన్ని స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తన శీర్షికకు తగిన సంక్షిప్తమైన, గంభీరమైన శైలి వాడబడింది. మూలంలోని అనిశ్చితులను ‘షిగ్గాయోన్’ లిప్యంతరీకరణలోను, ‘దావీదుకు చెందిన’ మరియు ‘గురించి’ అనే ఎంపికల్లోను ఉద్దేశపూర్వకంగా నిలిపాం.
