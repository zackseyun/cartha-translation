lexical_decisions:
- source_word: מָגִנִּי
  choice: నా డాలు
  rationale: మూలంలోని స్పష్టమైన ‘డాలు’ రూపకాన్ని నిలుపుతుంది; ‘నా రక్షణ’ వంటి అమూర్త పదం ఆ కవితాత్మక చిత్రాన్ని తగ్గిస్తుంది.
- source_word: עַל
  choice: దేవునివద్ద ఉంది
  rationale: ఇక్కడ עַל దేవునితో సంబంధంలో కీర్తనకర్త రక్షణ ఉందనే భావాన్ని సూచిస్తుంది. ‘వద్ద ఉంది’ మూలంలోని సంక్షిప్త నిర్మాణాన్ని తెలుగులో అర్థమయ్యేలా ఉంచుతుంది; దేవుడే డాలు అని నేరుగా పునర్నిర్మించకుండా అస్పష్టతను కాపాడుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుని
  rationale: ఈ సందర్భంలో రూపం ఇశ్రాయేలు యొక్క ఏకైక దేవుణ్ణి సూచిస్తుంది; అందువల్ల తెలుగులో ఏకవచనం వాడబడింది.
- source_word: מוֹשִׁיעַ
  choice: రక్షిస్తాడు
  rationale: హెబ్రీ వర్తమాన కృదంతం దేవుని లక్షణమైన, కొనసాగుతున్న కార్యాన్ని తెలియజేస్తుంది; తెలుగు సాధారణ వర్తమాన క్రియ దీనిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִשְׁרֵי־לֵב
  choice: యథార్థ హృదయం గలవారిని
  rationale: నైతికంగా నేరుగా, నిష్కపటంగా ఉండే అంతరంగ స్వభావాన్ని తెలియజేస్తుంది; ‘నీతిమంతులు’ అనే వేరొక పదక్షేత్రాన్ని అనవసరంగా దిగుమతి చేయదు.
theological_decisions:
- issue: మొదటి పాదంలోని వాక్యనిర్మాణ సంబంధం
  choice: ‘నా డాలు దేవునివద్ద ఉంది’ అని అనువదించి, కీర్తనకర్త రక్షణ దేవునితో ఉందనే భావాన్ని ఉంచడం
  alternative: ‘దేవుడే నా డాలు’ అని మరింత వ్యాఖ్యానాత్మకంగా పునర్నిర్మించడం
  rationale: హెబ్రీలో స్పష్టమైన క్రియ లేదు; עַל కారణంగా నిర్మాణం సంక్షిప్తంగా, కొంత అస్పష్టంగా ఉంది. ప్రధాన పాఠం మూలరూపానికి దగ్గరగా ఉండగా, సహజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కీర్తనా శైలి వాడబడింది. ‘డాలు’ అనే స్పష్టమైన రూపకం, ‘యథార్థ హృదయం’ అనే అంతరంగ నైతిక భావం నిలుపబడ్డాయి.
