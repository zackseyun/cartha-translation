  text: My shield is with God[b][a], who saves the upright in heart.
translation:
  language: te
  text: నా డాలు దేవునిపై ఆధారపడి ఉంది[a]; ఆయన నిష్కపట హృదయులైనవారిని రక్షిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడే నా డాలు.” హెబ్రీ వాక్యనిర్మాణం సంక్షిప్తంగా ఉండడం వల్ల ఈ విధంగా కూడా అర్థం చేసుకోవచ్చు.
