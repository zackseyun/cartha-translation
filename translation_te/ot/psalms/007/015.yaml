translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా వచనం. ‘గొయ్యి/గోతి’ పదజంట మూలంలోని בּוֹר/שַׁחַת భేదాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది; [a] మూలంలోని రెండు తవ్వే క్రియల పునరుక్తికి మరింత రూపపరమైన ప్రత్యామ్నాయాన్ని ఇస్తుంది.
