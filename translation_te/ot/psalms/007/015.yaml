  yaml_path: translation/ot/psalms/007/015.yaml
  text: He dug a pit and hollowed it out[a], and he fell into the hole he made.
translation:
  language: te
  text: అతడు ఒక గొయ్యి తవ్వి, దాన్ని లోతుగా చేశాడు[a]; తాను చేసిన గోతిలో తానే పడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు ఒక గొయ్యి తవ్వి దాన్ని మరింత తవ్వాడు; తాను చేసిన గోతిలో తానే పడ్డాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹר
  choice: గొయ్యి
  rationale: ఈ పదం గొయ్యి లేదా నీటి తొట్టిని సూచించగలదు. ఇక్కడ ఉచ్చు తవ్వే దృశ్యం ఉన్నందున సాధారణమైన ‘గొయ్యి’ సహజంగా సరిపోతుంది.
- source_word: כָּרָה
  choice: తవ్వి
  rationale: తవ్వడం అనే స్పష్టమైన క్రియార్థాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּחְפְּרֵהוּ
  choice: దాన్ని లోతుగా చేశాడు
  rationale: ముందున్న ‘తవ్వి’ అనే క్రియకు కొనసాగింపుగా మరింత తవ్వి సిద్ధం చేయడాన్ని సూచిస్తుంది; తెలుగులో అనవసర పునరుక్తిని తగ్గిస్తూ క్రమవృద్ధిని నిలుపుతుంది.
- source_word: וַיִּפֹּל
  choice: తానే పడ్డాడు
  rationale: ‘పడ్డాడు’ మూలంలోని సరళమైన కథన క్రమాన్ని నిలుపుతుంది. తెలుగు వాక్యంలో ‘తానే’ చేర్చడం ద్వారా అతడు చేసిన ఉచ్చులో అతడే పడిన ప్రతిఫల వ్యంగ్యం సహజంగా వెల్లడవుతుంది.
- source_word: שַׁחַת
  choice: గోతి
  rationale: ఇక్కడ తవ్వబడిన ఉచ్చు వంటి కుహరాన్ని concretely సూచిస్తుంది. ముందే ‘గొయ్యి’ వాడినందున భావాన్ని నిలుపుతూ భారమైన పునరుక్తిని నివారించడానికి ‘గోతి’ ఎంచుకోబడింది.
- source_word: יִפְעָל
  choice: తాను చేసిన
  rationale: פעל యొక్క విస్తృతమైన ‘చేయు/రూపొందించు’ భావంలో, తవ్వడం ద్వారా అతడు సిద్ధం చేసిన గోతిని సహజంగా సూచిస్తుంది.
