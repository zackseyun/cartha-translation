theological_decisions:
- issue: נַפְשִׁי యొక్క మానవ స్వరూప సంబంధ భావం
  choice: నా ప్రాణాన్ని
  alternative: నా ఆత్మను
  rationale: వెంబడించడం, పట్టుకోవడం, తొక్కివేయడం అనే భౌతిక సందర్భం జీవం/ప్రాణం అనే అర్థానికి అనుకూలం. ‘ఆత్మ’ అని మాత్రమే అనువదించడం మూలం కోరని సన్నని దేహం–ఆత్మ విభజనను సూచించవచ్చు.
- issue: כְבוֹדִי అనే కవితాత్మక స్వీయసూచన
  choice: నా మహిమను
  alternative: నా గౌరవాన్ని / నా ఘనతను
  rationale: హీబ్రూ పదంలోని మహిమ, గౌరవం, ఘనత అనే విస్తృత భావాన్ని ‘మహిమ’ కవితాత్మకంగా నిలుపుతుంది; మరింత నిర్దిష్టమైన ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని పాటించింది. స్వీయశాప జస్సివ్ భావాన్ని ‘నివ్వు’ రూపాలతో నిలిపి, ‘ధూళిలో నివసింపజేయు’ అనే మూల కవితా ఉద్రిక్తతను సరళీకరించలేదు.
