  to: శత్రువు నా ప్రాణాన్ని తరిమి పట్టుకొనునుగాక[a]; నా జీవితాన్ని నేలపై తొక్కునుగాక, నా మహిమను ధూళిలో నివసింపజేయునుగాక[b]. సెలా
