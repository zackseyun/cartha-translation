review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the conditional self-imprecation and retains the concrete sense of נַפְשִׁי as “life”/“breath” rather than imposing a body–soul distinction. However, “నేలమట్టం చేసి” means “razing/demolishing” and does not adequately render the explicit verb וְיִרְמֹס, “trample underfoot,” nor its relation to “to the ground.” The third-person jussive force is more accurately and naturally expressed by “-నుగాక” than by the imperative-like “నివ్వు” constructions.
  naturalness: The draft’s “తరిమి, దాన్ని పట్టుకోనివ్వు” is awkward because “నివ్వు” normally addresses a second-person addressee, whereas the Hebrew has successive third-person imprecations directed toward the enemy. A parallel pair of third-person jussives is clear, elevated, and natural in modern standard Telugu biblical poetry.
  terminology: “ప్రాణం” for נַפְשִׁי and “మహిమ” for כְבוֹדִי are suitable poetic renderings. “ధూళిలో నివసింపజేయు” appropriately retains the causative force of יַשְׁכֵּן and the Hebrew poetic image. “సెలా” should remain transliterated.
  issues:
  - severity: high
    issue: The jussive/imprecatory forms are rendered with “నివ్వు.”
    rationale: “నివ్వు” is ordinarily a second-person imperative (‘allow’), introducing an unstated addressee and obscuring the Hebrew third-person jussive sequence. “పట్టుకొనునుగాక / తొక్కునుగాక / నివసింపజేయునుగాక” preserves the intended self-imprecation.
  - severity: high
    issue: “నా జీవితాన్ని నేలమట్టం చేసి” does not explicitly translate “trample ... to the ground.”
    rationale: “నేలమట్టం చేయడం” commonly means destroy or raze, whereas וְיִרְמֹס specifically depicts trampling. “నా జీవితాన్ని నేలపై తొక్కునుగాక” preserves both the action and the ground imagery.
  - severity: medium
    issue: The first clause’s object resumption, “దాన్ని,” is unnecessarily awkward.
    rationale: 'Telugu can naturally retain the object through a single coordinated verbal phrase: “నా ప్రాణాన్ని తరిమి పట్టుకొనునుగాక.” This also avoids a potentially unclear pronoun.'
