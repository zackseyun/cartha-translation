source:
  edition: WLC
  text: יְהוָ֣ה אֱ֭לֹהַ/י אִם עָשִׂ֣יתִי זֹ֑את אִֽם יֶשׁ עָ֥וֶל בְּ/כַפָּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/003.yaml
  text: O Yahweh my God[a], if I have done this, if there is injustice in my hands—
translation:
  language: te
  text: యాహ్వే, నా దేవా, నేను ఇది చేసి ఉంటే, నా చేతుల్లో అన్యాయం ఉంటే[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా చేతులపై దోషం ఉంటే.” హీబ్రూ ప్రయోగం నైతిక అపరాధాన్ని లేదా దానికి బాధ్యత వహించడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో నేరుగా అందించాం.
- source_word: אֱלֹהַי
  choice: నా దేవా
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయాన్ని ‘నా’గా, ప్రత్యక్ష సంబోధనను సహజమైన తెలుగు సంబోధనారూపం ‘దేవా’గా ఇచ్చాం.
- source_word: אִם
  choice: ఉంటే / చేసి ఉంటే
  rationale: ఇది షరతుతో కూడిన స్వీయశాప ప్రకటనను ప్రారంభిస్తుంది; తెలుగులో సహజంగా షరతును క్రియాంతంలో వ్యక్తపరిచాం.
- source_word: עָשִׂיתִי זֹאת
  choice: నేను ఇది చేసి ఉంటే
  rationale: ‘నేను దీనిని చేశాను’ అనే భావాన్ని ప్రస్తుత ఆరోపణకు సంబంధించిన షరతుగా సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: עָוֶל
  choice: అన్యాయం
  rationale: ఈ పదంలోని నైతిక తప్పు, వక్రత, న్యాయవిరుద్ధత అనే భావాల్లో కీర్తన యొక్క న్యాయసంబంధ స్వరాన్ని ‘అన్యాయం’ కాపాడుతుంది.
- source_word: בְּכַפָּי
  choice: నా చేతుల్లో
  rationale: మూలంలోని ‘నా అరచేతుల్లో/చేతుల్లో’ అనే రూపకాన్ని నిలుపుతూ, క్రియకు సంబంధించిన నైతిక దోషం లేదా బాధ్యతను సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో దైవనామం ప్రత్యక్షంగా ఉంది. దానిని సాధారణ బిరుదుతో మార్చకుండా, ఆధునిక తెలుగు బైబిల్ పాఠకులకు సుపరిచితమైన వ్యక్తినామ రూపంలో ఉంచాం.
- issue: בְּכַפָּי లోని నైతిక బాధ్యత భావం
  choice: నా చేతుల్లో అన్యాయం
  alternative: నా చేతులపై దోషం
  rationale: మూల రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది కేవలం భౌతికంగా చేతుల్లో ఉన్నదని కాక నైతిక అపరాధం లేదా బాధ్యతను సూచించగలదని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రార్థనా సంబోధనను ఉపయోగించాం. మూలంలోని రెండు షరతులను, ‘చేతుల్లో’ అనే రూపకాన్ని, తదుపరి వచనానికి కొనసాగుతున్న అసంపూర్ణ వాక్యభావాన్ని దీర్ఘ విరామచిహ్నంతో కాపాడాం.
