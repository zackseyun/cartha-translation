  yaml_path: translation/ot/psalms/007/016.yaml
  text: His trouble returns on his own head[b][a], and his violence descends on his own skull.
translation:
  language: te
  text: 'అతని కీడు[a] అతని సొంత తలమీదే తిరిగి వస్తుంది;

    అతని హింస అతని తలపై భాగంపైకి[b] దిగివస్తుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కీడు’ అని అనువదించిన హీబ్రూ పదం శ్రమ, బాధ, హానికరమైన పని లేదా దుష్ట పన్నాగం అనే భావాలను కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అతని నడినెత్తిపైకి.’ హీబ్రూ పదం తల పైభాగాన్ని, అంటే తల మోపును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּב
  choice: తిరిగి వస్తుంది
  rationale: שׁוב అనే క్రియ ఇక్కడ దుష్టుడు కలిగించిన కీడు తిరిగి అతనిపైనే పడే భావాన్ని తెలియజేస్తుంది. ‘తిరిగి వస్తుంది’ మూలంలోని ప్రతిఫల భావాన్నీ కవితాత్మక సహజత్వాన్నీ నిలుపుతుంది.
- source_word: עֲמָלוֹ
  choice: అతని కీడు
  rationale: עָמָל అనే పదానికి శ్రమ, బాధ, కీడు, హానికరమైన పని వంటి భావాలు ఉన్నాయి. ఈ ప్రతిఫల సందర్భంలో తటస్థమైన శ్రమకన్నా అతడు తలపెట్టిన హానిని ‘కీడు’ సహజంగా వ్యక్తం చేస్తుంది; పదంలోని విస్తృత భావాన్ని పాదటిప్పణి సూచిస్తుంది.
- source_word: בְרֹאשׁוֹ
  choice: అతని సొంత తలమీదికే
  rationale: ‘తలమీదికి’ మూలంలోని בְּ + רֹאשׁ రూపకాన్ని నిలుపుతుంది. ‘సొంత’ మరియు ‘-కే’ వల్ల అతడు చేసిన కీడు అతనిపైనే తిరిగివచ్చే ప్రతిఫల బలం తెలుగులో స్పష్టమవుతుంది.
- source_word: וְעַל
  choice: అతని ... మీదికి
  rationale: సమాంతర రెండవ పాదాన్ని సహజ తెలుగులో కలుపుతూ, עַל సూచించే ‘మీదికి’ అనే దిశను నిలుపుతుంది.
- source_word: קָדְקֳדוֹ
  choice: అతని నడినెత్తిమీదికి
  rationale: קָדְקֹד తల పైభాగాన్ని లేదా నెత్తి మోపును సూచిస్తుంది. ‘నడినెత్తి’ ఆధునిక తెలుగులో స్పష్టమైన, సజీవమైన పదం; మొదటి పాదంలోని ‘తల’తో కవితాత్మక సమాంతరతను కూడా కాపాడుతుంది.
- source_word: חֲמָסוֹ
  choice: అతని హింస
  rationale: חָמָס సాధారణంగా హింస, క్రూరత్వం లేదా హింసాత్మక అన్యాయాన్ని సూచిస్తుంది. ‘హింస’ నేరుగా, సందర్భోచితంగా ఉంది.
- source_word: יֵרֵד
  choice: దిగివస్తుంది
  rationale: ירד యొక్క ‘దిగడం/కిందికి రావడం’ అనే దిశాత్మక చిత్రాన్ని ‘దిగివస్తుంది’ నిలుపుతుంది; హింస అతని నెత్తిమీదికి వచ్చిపడే కవితాత్మక దృశ్యాన్ని అనవసరంగా వివరించదు.
theological_decisions:
- issue: కవితాత్మక న్యాయంలో ప్రతిఫల చిత్రం
  choice: దుష్టుడు చేసిన కీడూ హింసా తిరిగి అతనిపైనే పడుతున్నట్లు వాక్యం చెబుతుంది.
  alternative: నైతిక ప్రతిఫలాన్ని ప్రత్యేకంగా నొక్కకుండా, ఒక వ్యక్తి బాధ తిరిగి అతనిపైకి వస్తుందని సాధారణంగా చదవవచ్చు.
  rationale: ‘అతని కీడు ... అతని తలమీదికే తిరిగి వస్తుంది’ మరియు ‘అతని హింస ... దిగివస్తుంది’ అనే సమాంతర చిత్రాలు అతని చర్యలే అతనికి ప్రతిఫలమవుతున్నాయని బలంగా సూచిస్తాయి. అనువాదం ఈ భావాన్ని నిలుపుతుంది గాని, పాఠానికి మించిన సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలిని ఉపయోగించాం. రెండు సమాంతర పాదాల నిర్మాణాన్ని నిలుపుతూ ‘తల—నడినెత్తి,’ ‘తిరిగి వస్తుంది—దిగివస్తుంది’ అనే చిత్రాత్మక జతలను కాపాడాం.
