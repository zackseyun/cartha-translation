source:
  edition: WLC
  text: הִנֵּ֥ה יְחַבֶּל אָ֑וֶן וְ/הָרָ֥ה עָ֝מָ֗ל וְ/יָ֣לַד שָֽׁקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/014.yaml
  text: 'Look: he labors with wickedness, conceives trouble, and gives birth to falsehood.[a]'
translation:
  language: te
  text: ఇదిగో, అతడు దుష్టత్వంతో ప్రసవవేదన పడుతూ, కీడును గర్భం దాల్చి, అబద్ధాన్ని కంటున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యం ప్రసవవేదన, గర్భధారణ, ప్రసవం అనే రూపకాలను ఒకదానిపై ఒకటి పొరలుగా ఉంచుతుంది. మొదటి క్రియకు ‘దుష్టత్వంతో వేదనపడుతున్నాడు’ లేదా ‘దుష్టత్వంతో ప్రసవయాతన పడుతున్నాడు’ అని కూడా అనువదించవచ్చు; ‘దుష్టత్వం,’ ‘కీడు’ అనే పదాల భావాలు కొంతవరకు ఒకదానితో ఒకటి కలుస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: దృష్టిని ఆకర్షించే హీబ్రూ అవ్యయాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు వ్యక్తీకరణతో అందిస్తుంది.
- source_word: יְחַבֶּל
  choice: ప్రసవవేదన పడుతున్నాడు
  rationale: ఈ క్రియలోని వేదనపడటం/ప్రసవయాతన అనుభవించడం అనే భావాన్ని నిలుపుతూ, తరువాతి గర్భధారణ-ప్రసవ రూపకంతో అనుసంధానిస్తుంది.
- source_word: אָוֶן
  choice: దుష్టత్వం
  rationale: నైతిక చెడుతో పాటు హానికరమైన పరిణామం అనే భావఛాయ ఉన్నా, తరువాతి עָמָל నుండి భేదాన్ని నిలుపడానికి ‘దుష్టత్వం’ ఎంచుకోబడింది.
- source_word: הָרָה
  choice: గర్భం దాల్చి
  rationale: గర్భం ధరించడం అనే మూలార్థాన్ని స్పష్టంగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עָמָל
  choice: కష్టం
  rationale: శ్రమ, బాధ, హానికరమైన చిక్కు అనే విస్తృత భావాలను కలిగిన పదం; ఈ సందర్భంలో పుట్టించబడే బాధాకరమైన కష్టాన్ని సూచిస్తుంది.
- source_word: יָלַד שָׁקֶר
  choice: అబద్ధాన్ని కంటున్నాడు
  rationale: ‘కనడం’ ప్రసవ రూపకాన్ని సంక్షిప్తంగా పూర్తిచేస్తుంది; שָׁקֶר లోని అసత్యం/మోసం భావాన్ని ‘అబద్ధం’ సహజంగా అందిస్తుంది.
