  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మకమైనా సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రద శైలి. హీబ్రూలోని సహజ జీవక్రమాన్ని అనుసరించని ప్రసవ రూపకాల వరుసను సరిచేయకుండా అలాగే నిలిపింది.
