  text: lest he tear my soul like a lion[a], rending it apart with no one to rescue.
translation:
  language: te
  text: 'లేకపోతే అతడు సింహంలా నా ప్రాణాన్ని[a] చీల్చి ముక్కలు చేస్తాడు;

    రక్షించేవారు ఎవరూ ఉండరు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను.” ఇక్కడ “ప్రాణం” (נַפְשִׁי) అంటే ప్రమాదంలో ఉన్న కీర్తనకర్త జీవం లేదా అతని స్వయానా వ్యక్తి.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: లేకపోతే
  rationale: ముందటి వాక్యంలోని విజ్ఞాపన నెరవేరకపోతే సంభవించగల భయంకరమైన ఫలితాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా హెచ్చరిక భావాన్ని నిలుపుతుంది.
- source_word: יִטְרֹף
  choice: చీల్చి ముక్కలు చేస్తాడు
  rationale: మృగం తన ఎరను హింసాత్మకంగా చీల్చే దృశ్యాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; తరువాతి פֹּרֵק‌తో కలిసిన తీవ్రతను తెలుగులో ఒక సహజమైన క్రియాబంధంగా అందిస్తుంది.
- source_word: כְּאַרְיֵה
  choice: సింహంలా
  rationale: כְּ సూచించే ఉపమానాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: נַפְשִׁי
  choice: నా ప్రాణాన్ని
  rationale: ఈ సందర్భంలో కీర్తనకర్త ప్రమాదంలో ఉన్న జీవాన్ని లేదా స్వయానా వ్యక్తిని సూచిస్తుంది. ‘ప్రాణం’ మరణముప్పు సందర్భానికి సహజంగా సరిపోతూ, కేవలం దేహానికి వేరైన ‘ఆత్మ’ అనే సంకుచిత అర్థాన్ని రుద్దదు.
- source_word: פֹּרֵק
  choice: ముక్కలు చేస్తాడు
  rationale: మొదటి క్రియలోని సింహపు దాడి చిత్రాన్ని మరింత తీవ్రం చేస్తుంది. తెలుగులో ‘చీల్చి ముక్కలు చేస్తాడు’ అనే సంయుక్త వ్యక్తీకరణ రెండు హెబ్రీ క్రియల భావాన్ని సహజంగా కలుపుతుంది.
- source_word: וְאֵין מַצִּיל
  choice: విడిపించేవాడెవడూ ఉండడు
  rationale: ప్రమాదం నుంచి రక్షించి బయటకు తీసేవారు ఎవరూ లేరనే అస్తిత్వ నిరాకరణను స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: נֶפֶשׁ యొక్క మానవ స్వరూప సంబంధ అర్థం
  choice: ‘ప్రాణం’—ప్రమాదంలో ఉన్న జీవం లేదా స్వయం
  alternative: ‘ఆత్మ’—దేహానికి భిన్నమైన అభౌతిక భాగం
  rationale: ఇక్కడి మృగదాడి, రక్షణ సందర్భం శారీరక మరణముప్పులో ఉన్న కీర్తనకర్త జీవాన్ని లేదా అతడినే సూచిస్తుంది. అందువల్ల వచనం చెప్పనంత ప్రత్యేకమైన మానవ స్వరూప సిద్ధాంతాన్ని అనువాదంలో ప్రవేశపెట్టలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. సింహపు దాడి దృశ్యంలోని తీవ్రతను ‘చీల్చి ముక్కలు చేస్తాడు’ అనే సహజమైన పదబంధంతో నిలిపి, చివరి పాదంలో రక్షకుడు లేకపోవడాన్ని సంక్షిప్తంగా తెలిపింది.
