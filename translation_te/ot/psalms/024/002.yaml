source:
  edition: WLC
  text: כִּי ה֭וּא עַל יַמִּ֣ים יְסָדָ֑/הּ וְ/עַל נְ֝הָר֗וֹת יְכוֹנְנֶֽ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/002.yaml
  text: For he founded it upon the seas[a], and established it upon the rivers.
translation:
  language: te
  text: 'ఎందుకంటే ఆయనే దానిని సముద్రాలపై స్థాపించాడు,

    నదులపై దానిని స్థిరపరిచాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: మునుపటి వచనంలోని ప్రకటనకు కారణాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘ఎందుకంటే’ ఈ సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הוּא
  choice: ఆయనే
  rationale: మూలంలోని స్వతంత్ర సర్వనామం ఇచ్చే ఉద్ఘాటనను ‘ఆయనే’ నిలుపుతుంది.
- source_word: עַל יַמִּים
  choice: సముద్రాల మీద
  rationale: עַל యొక్క స్థానం/ఆధార భావాన్ని, יַמִּים యొక్క బహువచనార్థమైన ‘సముద్రాలు’ను నేరుగా నిలుపుతూ ప్రాచీన కవితాత్మక సృష్టి చిత్రణను పరిరక్షిస్తుంది.
- source_word: יְסָדָהּ
  choice: దానిని ... పునాది వేసి
  rationale: יסד అంటే పునాది వేయడం. స్త్రీలింగ ప్రత్యయం ముందు వచనంలోని భూమిని సూచిస్తుంది; తెలుగులో ‘దానిని’ అని సహజంగా వ్యక్తమవుతుంది.
- source_word: וְעַל נְהָרוֹת
  choice: నదుల మీద
  rationale: సమాంతర కవితా నిర్మాణాన్ని నిలుపుతూ נְהָרוֹת యొక్క సాధారణ అర్థమైన ‘నదులు’ను ఉపయోగిస్తుంది.
- source_word: יְכוֹנְנֶהָ
  choice: దానిని స్థిరపరిచాడు
  rationale: כון లోని స్థిరంగా నిలబెట్టడం లేదా దృఢపరచడం అనే భావాన్ని తెలియజేస్తూ, יסד తో ఉన్న పదార్థ భేదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: భూమి సముద్రాలు, నదుల మీద స్థాపించబడినదనే సృష్టి చిత్రణ
  choice: కవితాత్మక విశ్వచిత్రణను యథాతథంగా నిలుపడం
  alternative: దీనిని కేవలం స్థిరత్వానికి రూపకంగా వివరించడం లేదా ఆధునిక శాస్త్రీయ భాషలో మార్చడం
  rationale: హీబ్రూ వచనం దేవుడు సృష్టిని క్రమపరిచిన విధానాన్ని ప్రాచీన కవితాత్మక జలచిత్రణతో వివరిస్తుంది. దానిని నైరూప్యంగా మార్చకుండా, వచనంలోని నిజమైన చిత్రణను అనువాదం నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కవితా శైలి. రెండు పాదాల సమాంతరతను నిలిపి, ‘పునాది వేసి/స్థిరపరిచాడు’ ద్వారా మూలంలోని వేర్వేరు క్రియలను ప్రతిబింబించాం.
