  rationale: The revision changes only the first predicate from a participial expression to a finite verb and uses the more idiomatic postposition ‘పై.’ It retains the causal connection, explicit emphasis in ‘ఆయనే,’ the referential ambiguity of ‘దానిని,’ and the poetic cosmological image of the earth established over seas and rivers.
  reviewer_model: gpt-5.6-terra
