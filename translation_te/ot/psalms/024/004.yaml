  yaml_path: translation/ot/psalms/024/004.yaml
  text: The one who has clean hands and a pure heart[c][b][a], who has not lifted up his soul to falsehood or sworn deceitfully.
translation:
  language: te
  text: చేతులు శుభ్రంగా ఉన్నవాడూ, హృదయం నిర్మలమైనవాడూ,[c] అసత్యం[b] వైపు నా ప్రాణాన్ని[a] ఎత్తనివాడూ, మోసపూరితంగా ప్రమాణం చేయనివాడూ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘నా ప్రాణాన్ని’ అని ఉంది; ఈ వచనమంతటా ఉన్న మూడవ పురుష వర్ణనకు అనుగుణంగా అనేక అనువాదాలు ప్రత్యామ్నాయ పఠనాన్ని అనుసరించి ‘తన ప్రాణాన్ని’ అని ఇస్తాయి.
    reason: textual_variant
  - marker: b
    text: లేదా ‘వ్యర్థమైనదాని వైపు’, ‘అబద్ధమైనదాని వైపు’; కొందరు ఇక్కడి పదాన్ని విగ్రహాన్ని సూచించేదిగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: c
    text: 'లేదా: ‘చేతులు శుభ్రంగా ఉన్నవాడూ, హృదయం నిర్మలమైనవాడూ, అసత్యం వైపు నా ప్రాణాన్ని ఎత్తనివాడూ మరియు మోసపూరితంగా ప్రమాణం చేయనివాడూ.’'
    reason: previous_rendering
lexical_decisions:
- source_word: נְקִי כַּפַּיִם
  choice: చేతులు శుభ్రమైనవాడు
  rationale: చేతులు బాహ్య ప్రవర్తనను సూచించే హీబ్రూ రూపకాన్ని నిలుపుతూ, నైతిక నిర్దోషిత్వాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בַר לֵבָב
  choice: హృదయం నిర్మలమైనవాడు
  rationale: అంతరంగ నైతిక స్వచ్ఛతను సూచిస్తూ, ‘చేతులు శుభ్రమైనవాడు’ అనే బాహ్య ప్రవర్తనతో ఉన్న సమాంతరతను కాపాడుతుంది.
- source_word: נָשָׂא ... נַפְשִׁי
  choice: నా ప్రాణాన్ని ఎత్తనివాడు
  rationale: WLCలో ఉన్న ప్రథమ పురుష ఏకవచన ప్రత్యయాన్ని (‘నా’) ప్రధాన పాఠ్యంలో నిలిపి, హీబ్రూ నుడికారంలోని అస్పష్టతను వివరణతో తొలగించకుండా ఉంచుతుంది. సందర్భానికి సులభంగా సరిపోయే ‘తన ప్రాణాన్ని’ పాదసూచికలో ఇవ్వబడింది.
- source_word: לַשָּׁוְא
  choice: అసత్యం వైపు
  rationale: שָׁוְא అనే పదంలోని అబద్ధం/అసత్యం భావం తరువాతి మోసపూరిత ప్రమాణంతో సహజంగా జతపడుతుంది; ‘వ్యర్థమైనది’ లేదా ‘విగ్రహం’ అనే సాధ్య భావాలను పాదసూచికలో భద్రపరుస్తుంది.
- source_word: נִשְׁבַּע לְמִרְמָה
  choice: మోసపూరితంగా ప్రమాణం చేయనివాడు
  rationale: మోసం చేసే విధంగా లేదా మోసం చేయాలనే ఉద్దేశంతో ప్రమాణం చేయడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: נַפְשִׁיలోని ‘నా ప్రాణం’ అనే పఠనం, సందర్భానికి సరిపోయే ‘తన ప్రాణం’ అనే ప్రత్యామ్నాయం
  choice: ప్రధాన పాఠ్యంలో ‘నా ప్రాణాన్ని’ ఉంచడం
  alternative: ‘తన ప్రాణాన్ని’ అని చదవడం
  rationale: చుట్టూ ఉన్న వాక్య నిర్మాణం మూడవ పురుషంలో ఉండటంతో ‘తన ప్రాణాన్ని’ సులభంగా సరిపోతుంది. అయినా, ఇచ్చిన WLC పాఠ్యంలో ప్రథమ పురుష ప్రత్యయం స్పష్టంగా ఉన్నందున దానిని ప్రధాన పాఠ్యంలో నిలిపి, పాఠ్య ఉద్రిక్తతను పాదసూచికలో వివరించడం మూలభాషా ప్రాధాన్యానికి అనుగుణం.
- issue: שָׁוְא యొక్క భావ పరిధి
  choice: ‘అసత్యం’
  alternative: ‘వ్యర్థమైనది’, ‘అబద్ధమైనది’, లేదా సందర్భానుసారం ‘విగ్రహం’
  rationale: నైతిక సందర్భంలో ‘అసత్యం’ సముచితం; అయితే పదంలోని వ్యర్థత/శూన్యత భావాన్నీ, విగ్రహాన్ని సూచించే సాధ్యతనూ పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ఇది 3వ వచనంలోని ప్రశ్నకు సమాధానంగా కొనసాగే వర్ణన కావడంతో క్రియాపదంతో ముగిసే స్వతంత్ర వాక్యంగా మార్చకుండా, ‘-వాడూ’ అనే సమాంతర నిర్మాణాన్ని నిలిపాం. బాహ్య ప్రవర్తన (‘చేతులు’) మరియు అంతరంగ స్వభావం (‘హృదయం’) మధ్య ఉన్న కవితాత్మక సమాంతరతను కాపాడాం.
