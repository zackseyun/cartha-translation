  text: Who is this King of glory? Yahweh[a], strong and mighty; Yahweh, mighty in battle.
translation:
  language: te
  text: 'ఈ మహిమగల రాజు ఎవరు?


    బలవంతుడూ పరాక్రమశాలియూ అయిన యాహ్వే;


    యుద్ధంలో పరాక్రమశాలి అయిన యాహ్వే.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי זֶה
  choice: ఎవరు?
  rationale: తెలుగులో సహజమైన ప్రత్యక్ష ప్రశ్న. זֶה యొక్క సూచనార్థాన్ని ప్రత్యేకంగా ‘ఈయన’ అని పెట్టడం సాధ్యమే అయినా, తరువాత వచ్చే నామవాచకంతో ‘మహిమగల రాజు ఎవరు?’ అనే రూపం సహజంగా సవాలు–ప్రత్యుత్తర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: మహిమగల రాజు
  rationale: హెబ్రీ నిర్మాణం అక్షరార్థంగా ‘మహిమ యొక్క రాజు.’ ఆధునిక తెలుగులో ‘మహిమగల రాజు’ సహజంగా ఉండి, బిరుదు భావాన్ని మరియు కీర్తనలోని పునరుక్తిని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునికంగా ప్రాచుర్యంలో ఉన్న ‘యాహ్వే’ రూపంలో లిప్యంతరీకరించాం.
- source_word: עִזּוּז וְגִבּוֹר
  choice: బలశూరుడైన
  rationale: రెండు సమీపార్థక విశేషణాలు కలిసి యాహ్వే బలాన్నీ పరాక్రమాన్నీ తీవ్రంగా వ్యక్తం చేస్తున్నాయి. తెలుగులో అసహజమైన ద్వంద్వాన్ని తప్పిస్తూ ‘బలశూరుడు’ అనే సమాసరూపం ఆ సంయుక్త బలాన్ని సహజంగా అందిస్తుంది.
- source_word: גִּבּוֹר מִלְחָמָה
  choice: యుద్ధంలో పరాక్రమశాలి
  rationale: గిబ్బోర్ యొక్క శౌర్యార్థాన్నీ మిల్హామా యొక్క యుద్ధార్థాన్నీ స్పష్టంగా నిలుపుతూ, ‘యోధుడు’ అనే మూలంలో లేని నామవాచకాన్ని చేర్చకుండా సహజమైన తెలుగు వాక్యాంశాన్ని వాడాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా లిప్యంతరీకరించాం; ‘యాహ్వే’ హెబ్రీ ఉచ్చారణకు సాధారణంగా అంగీకరించబడిన ఆధునిక రూపం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామూహిక ఆరాధనలో ప్రశ్న–ప్రత్యుత్తరంగా చదవడానికి అనువైన గంభీరమైన, సంక్షిప్త శైలి. మూలంలోని రెండు పాదాల సమాంతరతను పంక్తి విభజనతో నిలిపాం.
