  text: A psalm of David[a]. The earth and its fullness are Yahweh’s[b], the world and those who dwell in it.
translation:
  language: te
  text: 'దావీదుకు సంబంధించిన కీర్తన.[a]


    భూమీ, దానిలోని సమస్తమూ యాహ్వేకే చెందినవి;


    లోకమూ, అందులో నివసించేవారూ యాహ్వేకే చెందినవారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: ‘దావీదు రచించిన కీర్తన’; లేదా ‘దావీదు కోసం కీర్తన.’'
    reason: లְדָוִדలోని לְ ఉపసర్గ రచయితత్వం, సంబంధం, లేదా అంకితాన్ని సూచించగలదు; అందువల్ల మూలంలోని సందిగ్ధతను తెలియజేస్తుంది.
lexical_decisions:
- source_word: לְדָוִד
  choice: దావీదుకు సంబంధించిన
  rationale: לְ ఉపసర్గ రచయిత, సంబంధం, లేదా అంకితం అనే భావాలను సూచించగలదు. ‘దావీదు రచించిన’ లేదా ‘దావీదు కోసం’ అని పరిమితం చేయకుండా మూలంలోని సందిగ్ధతను ఈ రూపం కాపాడుతుంది.
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: కీర్తనల శీర్షికల్లో వాడే ప్రామాణిక పదం; ఆధునిక తెలుగు బైబిలు శైలిలో సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: לַיהוָה
  choice: యాహ్వేవే
  rationale: లేఖనంలోని దైవనామం יהוהను ‘యాహ్వే’గా లిప్యంతరీకరించి, క్రియలేని స్వామ్య వాక్యాన్ని తెలుగు నొక్కిచెప్పే ప్రత్యయం ‘-వే’తో సహజంగా వ్యక్తం చేసింది.
- source_word: הָאָרֶץ
  choice: భూమి
  rationale: תֵּבֵלతో ఉన్న సమాంతరత, వాక్యంలోని విశ్వవ్యాప్త పరిధి దృష్ట్యా ‘దేశం’ కంటే ‘భూమి’ సరైనది.
- source_word: וּמְלוֹאָהּ
  choice: దానిలోని సమస్తం
  rationale: מְלוֹא యొక్క ‘నిండుదల/నింపినదంతా’ అనే భావాన్ని సామాన్య ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: תֵּבֵל
  choice: లోకం
  rationale: నివాసయోగ్యమైన, క్రమబద్ధమైన ప్రపంచాన్ని సూచించే పదం; తరువాతి ‘అందులో నివసించేవారు’ అనే మాట దాని నివాసిత లోక భావాన్ని బలపరుస్తుంది.
- source_word: וְיֹשְׁבֵי בָהּ
  choice: అందులో నివసించేవారు
  rationale: హీబ్రూ కృదంతంలోని నిరంతర నివాస భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో నేరుగా ఉన్న ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా అందించింది.
- issue: మొదటి పాదంలోని స్వామ్య నిర్మాణం
  choice: ‘భూమి, దానిలోని సమస్తం యాహ్వేవే’
  alternative: ‘భూమి యాహ్వేది, దాని నిండుదల కూడా’
  rationale: హీబ్రూలో הָאָרֶץ וּמְלוֹאָהּ సంయుక్త అంశంగా ఉండటాన్ని కాపాడుతూ, రెండూ యాహ్వేకు చెందినవనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక సమాంతరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘దానిలోని సమస్తం’ అనే రూపం పదశః ‘దాని నిండుదల’ కంటే సహజంగా ఉంది.
