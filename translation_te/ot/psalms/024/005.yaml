  naturalness: The two-line poetic form and “పొందుతాడు” are natural modern Telugu. The revision retains this register while using a formulation for the final construct phrase that is natural and does not overstate one interpretive option.
  terminology: “ఆశీర్వాదం” and “నీతి” are suitable. “నీతి” appropriately preserves the breadth of צְדָקָה, with alternatives supplied in the footnote. “యాహ్వే” aligns with the English POB audit trail’s rendering of יהוה.
