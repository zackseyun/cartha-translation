source:
  edition: WLC
  text: יִשָּׂ֣א בְ֭רָכָה מֵ/אֵ֣ת יְהוָ֑ה וּ֝/צְדָקָ֗ה מֵ/אֱלֹהֵ֥י יִשְׁעֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/005.yaml
  text: He will receive blessing from Yahweh[a], and righteousness from the God of his salvation.
translation:
  language: te
  text: 'అతడు యాహ్వే నుండి ఆశీర్వాదాన్ని పొందుతాడు;

    తన రక్షణకు మూలమైన దేవుని నుండి నీతిని[a] పొందుతాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నిర్దోష నిర్ధారణ” లేదా “న్యాయం.” హీబ్రూ పదం నైతిక నీతితో పాటు న్యాయపరమైన అనుకూల తీర్పు, రక్షణను తెచ్చే న్యాయం అనే భావాలను కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: పొందుతాడు
  rationale: నָשָׂא అనే క్రియకు సాధారణంగా ‘ఎత్తు/మోయు’ అనే అర్థాలున్నా, ‘ఆశీర్వాదం’ వంటి భావవాచక కర్మతో ఇక్కడ ‘పొందు’ అనే నుడికారార్థం సహజంగా సరిపోతుంది.
- source_word: בְרָכָה
  choice: ఆశీర్వాదాన్ని
  rationale: ఏకవచనాన్ని నిలుపుతూ, దేవుడు అనుగ్రహించే మేలును సూచించే ప్రామాణిక తెలుగు పదాన్ని వాడాం.
- source_word: מֵאֵת יְהוָה
  choice: యెహోవా నుండి
  rationale: מֵאֵת మూలాన్ని సూచిస్తుంది; יהוה అనే దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: וּצְדָקָה
  choice: నీతిని
  rationale: צְדָקָהలో నైతిక నీతి, న్యాయం, దేవుని అనుకూల తీర్పు అనే భావవిస్తృతి ఉంది. ప్రధాన పాఠంలో ‘నీతి’ ఆ విస్తృతిని సాధ్యమైనంతగా నిలుపుతుంది; ఇతర సందర్భోచిత భావాలను పాదసూచికలో ఇచ్చాం.
- source_word: מֵאֱלֹהֵי יִשְׁעוֹ
  choice: తన రక్షణకర్తయైన దేవుని నుండి
  rationale: అక్షరార్థంగా ‘అతని రక్షణ యొక్క దేవుడు’ అయిన నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, దేవుడే అతని రక్షణకు మూలమని తెలియజేస్తుంది.
- source_word: יִשְׁעוֹ
  choice: తన రక్షణ
  rationale: יֵשַׁע రక్షణ లేదా విమోచనను సూచిస్తుంది. సమాంతర నిర్మాణాన్ని సహజ తెలుగులో చెప్పేందుకు ‘రక్షణకర్తయైన’ అని రూపాంతరం చేశాం.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా ఉంచాం. ఆధునిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరగా భావించే ప్రత్యామ్నాయం.
- issue: צְדָקָה యొక్క సందర్భార్థం
  choice: నీతి
  alternative: నిర్దోషిగా తీర్పు; న్యాయం
  rationale: ఇక్కడ దేవుని నుండి లభించేదిగా చెప్పబడిన צְדָקָה నైతిక నీతి, న్యాయపరమైన అనుకూల తీర్పు, రక్షించే న్యాయం అనే భావాలను మోయగలదు. ప్రధాన పాఠంలో విస్తృతమైన ‘నీతి’ని ఉంచి, నిజమైన సందిగ్ధతను పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గంభీరతతో కూడిన సరళమైన శైలి. హీబ్రూ సమాంతర నిర్మాణాన్ని రెండు పాదాలుగా నిలిపాం; అసహజమైన ‘అతని రక్షణ యొక్క దేవుడు’కు బదులుగా సహజమైన ‘తన రక్షణకర్తయైన దేవుడు’ వాడాం.
