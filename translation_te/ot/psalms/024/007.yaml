  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שְׂא֤וּ שְׁעָרִ֨ים רָֽאשֵׁי/כֶ֗ם וְֽ֭/הִנָּשְׂאוּ פִּתְחֵ֣י עוֹלָ֑ם וְ֝/יָב֗וֹא מֶ֣לֶךְ הַ/כָּבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/007.yaml
  text: Lift up your heads[a], O gates, and be lifted up, O ancient doors, that the King of glory may come in.
translation:
  language: te
  text: 'ద్వారాలారా, మీ తలలను పైకెత్తండి;

    పురాతన తలుపులారా,[a] పైకెత్తబడండి;

    మహిమగల రాజు లోపలికి ప్రవేశించునట్లు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నిత్యమైన తలుపులారా.’ హీబ్రూ పదబంధం ఎంతో పురాతనమైన తలుపులను గానీ, నిరంతరం నిలిచే తలుపులను గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: పైకెత్తండి
  rationale: ద్వారాలను వ్యక్తులుగా సంబోధించే బహువచన ఆజ్ఞను, కవితాత్మక బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שְׁעָרִים
  choice: ద్వారాలారా
  rationale: పట్టణం లేదా ఆలయ ప్రవేశ ద్వారాలకు సాధారణ తెలుగు పదం; సంబోధన రూపం హీబ్రూ వ్యక్తీకరణను కాపాడుతుంది.
- source_word: רָאשֵׁיכֶם
  choice: మీ తలలను
  rationale: అక్షరార్థమైన ‘మీ తలలు’ అనే రూపకాన్ని నిలిపి, దాన్ని ‘పైభాగాలు’ అని వాస్తుశిల్ప పరంగా సడలించకుండా కవితా చిత్రాన్ని కాపాడుతుంది.
- source_word: וְהִנָּשְׂאוּ
  choice: పైకెత్తబడండి
  rationale: నిఫాల్ రూపంలోని కర్మణి లేదా ఆత్మనేపద ఛాయను నిలుపుతూ, మొదటి పాదంలోని ‘పైకెత్తండి’తో కవితాత్మక ప్రతిధ్వనిని కలిగిస్తుంది.
- source_word: פִּתְחֵי עוֹלָם
  choice: పురాతన తలుపులారా
  rationale: ‘తలుపులు/ప్రవేశాలు’ అనే అర్థం సమాంతర పాదంలోని ‘ద్వారాలు’కు సరిపోతుంది. עוֹלָם ఇక్కడ సుదీర్ఘ ప్రాచీనతను లేదా శాశ్వత కాలవ్యాప్తిని సూచించగలదు; ప్రధాన పాఠ్యంలో చదవడానికి సహజమైన ‘పురాతన’ను ఎంచుకొని ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וְיָבֹא
  choice: లోపలికి వస్తాడు
  rationale: ఆజ్ఞల ఫలితంగా జరిగే రాజప్రవేశాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; హీబ్రూ సంధి-అసంపూర్ణ క్రియారూపం ఉద్దేశం లేదా ఫలితం అనే ఛాయలను అనుమతించినా, తెలుగు వాక్యక్రమంలో ఇది ప్రత్యక్షంగా, గంభీరంగా వినిపిస్తుంది.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: మహిమగల రాజు
  rationale: హీబ్రూ నిర్మాణంలోని గౌరవబిరుదు భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘మహిమ యొక్క రాజు’ కంటే ఇది సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: ద్వారాల వ్యక్తీకరణను, రాజప్రవేశ చిత్రాన్ని వ్యాఖ్యానంతో సంకుచితం చేయాలా
  choice: ద్వారాలు, తలుపులను నేరుగా సంబోధిస్తూ ‘తలలు’ అనే కవితాత్మక వ్యక్తీకరణను నిలుపుట
  alternative: ‘ద్వారాలను తెరవండి’ అని భావానువాదం చేయుట
  rationale: మూల హీబ్రూ ద్వారాలను నేరుగా సంబోధించి వాటికి ‘తలలు’ ఉన్నట్లు చిత్రిస్తుంది. దీన్ని నిలుపడం చారిత్రక లేదా మెస్సీయ సంబంధమైన ఒక నిర్దిష్ట వ్యాఖ్యానాన్ని పాఠ్యంలోకి చేర్చకుండా కీర్తన యొక్క కవితాత్మక, ఆరాధనా బలాన్ని కాపాడుతుంది.
- issue: וְיָבֹא ను ఉద్దేశార్థకంగా లేదా ఫలితార్థకంగా తెలుగులో వ్యక్తం చేయడం
  choice: ‘మహిమగల రాజు లోపలికి వస్తాడు’ అనే ఫలితార్థక రూపం
  alternative: ‘మహిమగల రాజు లోపలికి వచ్చేలా’ అనే ఉద్దేశార్థక రూపం
  rationale: ఆజ్ఞల తరువాతి హీబ్రూ నిర్మాణం ఉద్దేశం లేదా ఫలితం రెండింటినీ సూచించగలదు. ప్రధాన పాఠ్యంలో సహజమైన ఫలితార్థక వాక్యాన్ని ఎంచుకున్నప్పటికీ, రాజు ప్రవేశించేందుకు ద్వారాలు పైకెత్తబడుతున్న సంబంధాన్ని సందర్భం స్పష్టంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా ధోరణి. ‘ద్వారాలారా’, ‘తలుపులారా’ అనే సంబోధనలు వ్యక్తీకరణను నిలుపుతాయి; ‘మీ తలలను’ అనే అసాధారణమైనా ఉద్దేశపూర్వకమైన రూపకం మూలంలోని ఉద్వేగాన్ని కాపాడుతుంది. పాద విభజన హీబ్రూ సమాంతర కవితా నిర్మాణాన్ని ప్రతిబింబిస్తుంది.
