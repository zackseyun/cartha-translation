  text: מִֽי יַעֲלֶ֥ה בְ/הַר יְהוָ֑ה וּ/מִי יָ֝קוּם בִּ/מְק֥וֹם קָדְשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/003.yaml
  text: Who may ascend the mountain of Yahweh? And who may stand in his holy place?[a]
translation:
  language: te
  text: యాహ్వే పర్వతం ఎక్కగలవారు ఎవరు? ఆయన పరిశుద్ధ స్థలంలో నిలువగలవారు ఎవరు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే కొండ.” హీబ్రూ הַר పదానికి “పర్వతం” లేదా “కొండ” అనే అర్థం ఉండవచ్చు; ఈ కీర్తనలో సాధారణంగా వాడే రూపంగా “పర్వతం” ఉంచబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: ఎవడు
  rationale: అర్హతగల వ్యక్తి ఎవరనే అలంకారిక ప్రశ్నను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: יַעֲלֶה
  choice: ఎక్కగలవాడు
  rationale: עלה అనే క్రియలోని ‘పైకి ఎక్కు’ భావాన్ని నిలుపుతూ, ఇక్కడ కేవలం భవిష్యత్ చర్యకన్నా ప్రవేశించడానికి తగిన అర్హతను సూచిస్తుంది.
- source_word: בְהַר
  choice: పర్వతాన్ని
  rationale: הַר అంటే ‘పర్వతం’ లేదా ‘కొండ’; ఈ కీర్తనలో దేవుని ఉన్నత నివాసస్థలాన్ని సూచించే ప్రామాణిక పదంగా ‘పర్వతం’ ఎంచుకోబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపంలో వ్యక్తిగత నామంగా ఉంచుతుంది.
- source_word: וּמִי
  choice: ఎవడు
  rationale: రెండవ సమాంతర ప్రశ్నను సహజమైన తెలుగు కవితా శైలిలో కొనసాగిస్తుంది; ‘మరి’ని చేర్చకపోయినా సమాంతర నిర్మాణం స్పష్టంగా ఉంటుంది.
- source_word: יָקוּם
  choice: నిలువగలవాడు
  rationale: קום లోని ‘నిలుచు’ భావాన్ని కాపాడుతూ, దేవుని సన్నిధిలో స్థానం పొందడానికి లేదా నిలిచి ఉండడానికి అర్హత అనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: בִּמְקוֹם
  choice: స్థలంలో
  rationale: מָקוֹם అనే సాధారణ ‘స్థలం’ భావాన్ని నిలుపుతుంది; ‘ఆలయం’ లేదా ‘పరిశుద్ధస్థలం’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: קָדְשׁוֹ
  choice: ఆయన పరిశుద్ధ
  rationale: మూడవ పురుష ఏకవచన స్వామ్యప్రత్యయాన్ని ‘ఆయన’గా, קֹדֶשׁ యొక్క పవిత్రత భావాన్ని ‘పరిశుద్ధ’గా సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా ఉంచుతూ, సాధారణ ఆధునిక తెలుగు పాఠకులకు విస్తృతంగా తెలిసిన లిప్యంతరీకరణను ఉపయోగించింది.
- issue: అసంపూర్ణ క్రియారూపాల ప్రశ్నార్థక బలం
  choice: ఎక్కగలవాడు / నిలువగలవాడు
  alternative: ఎక్కేవాడు / నిలిచేవాడు
  rationale: ఈ ప్రశ్నలు కేవలం భవిష్యత్తులో ఎవరు ఆ కార్యాలు చేస్తారో కాకుండా, దేవుని సన్నిధికి చేరడానికి ఎవరు అర్హులో అడుగుతున్నాయి. ‘గలవాడు’ ఆ అనుమతి/అర్హత భావాన్ని తెలిపినా, తదుపరి వచనం ఇచ్చే నైతిక సమాధానాన్ని ముందుగానే పూర్తిగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కవితా శైలి వాడబడింది. రెండు సమాంతర ప్రశ్నల నిర్మాణం నిలుపబడింది; అర్హత భావం కోసం ‘గలవాడు’ ప్రయోగించబడింది.
