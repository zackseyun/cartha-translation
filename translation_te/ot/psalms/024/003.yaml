revisions:
- from: యెహోవా పర్వతాన్ని ఎక్కగలవాడెవడు? ఆయన పరిశుద్ధ స్థలంలో నిలువగలవాడెవడు?[a]
  to: యాహ్వే పర్వతం ఎక్కగలవారు ఎవరు? ఆయన పరిశుద్ధ స్థలంలో నిలువగలవారు ఎవరు?[a]
