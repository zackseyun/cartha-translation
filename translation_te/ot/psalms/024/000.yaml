  text: A psalm of David[a]. Yahweh's is the earth and its fullness[b], the world and those who dwell in it.
translation:
  language: te
  text: 'దావీదుకు చెందిన కీర్తన.[a]


    భూమి, దానిని నింపిన సమస్తమూ యెహోవాకు చెందినవే;[b]


    లోకమూ, దానిలో నివసించేవారూ ఆయనకు చెందినవారే.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: ‘దావీదు కీర్తన’ లేదా ‘దావీదు కోసం కీర్తన.’'
    reason: శీర్షికలోని హీబ్రూ לְ ఉపసర్గ సంబంధం, రచన, అంకితం వంటి భావాలకు అవకాశం ఇస్తుంది.
  - marker: b
    text: 'అక్షరార్థంగా: ‘భూమి, దాని నిండుదనం యెహోవావే.’'
    reason: מְלוֹאָהּ అనే పదంలోని ‘నిండుదనం’ రూపకాన్ని చూపిస్తుంది.
lexical_decisions:
- source_word: לְדָוִד
  choice: దావీదుకు చెందిన
  rationale: లְ ఉపసర్గకు ‘దావీదుచే,’ ‘దావీదుకు,’ లేదా ‘దావీదుకు చెందిన’ అనే భావాలు సాధ్యమైనందున, కీర్తన శీర్షికలోని సంబంధాన్ని సహజంగా చూపుతూ రచయితను ఖచ్చితంగా నిర్ణయించని రూపాన్ని ఎంచుకున్నాం.
- source_word: מְלוֹאָהּ
  choice: దానిని నింపిన సమస్తం
  rationale: ‘దాని నిండుదనం’ అనే అక్షరార్థాన్ని సహజమైన ఆధునిక తెలుగులో, భూమిలో ఉన్న సమస్తాన్ని సూచించేలా వ్యక్తం చేస్తుంది.
- source_word: תֵּבֵל
  choice: లోకం
  rationale: నివాసయోగ్యమైన ప్రపంచం లేదా లోకం అనే కవితాత్మక భావాన్ని సరళంగా నిలుపుతుంది.
- source_word: יהוה
  choice: యెహోవా
  rationale: మూలంలోని దేవుని ప్రత్యేక నామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిప్యంతరీకరణలో ఉంచింది.
theological_decisions:
- issue: భూమిపై యెహోవా అధికారం లేదా యాజమాన్యం
  choice: ‘యెహోవాకు చెందినవే’ అని స్వామ్య భావాన్ని స్పష్టంగా వ్యక్తం చేయడం
  alternative: ‘యెహోవాదే భూమి’ అనే ముందుంచిన స్వామ్య నిర్మాణం
  rationale: హీబ్రూ వాక్యంలోని לַיהוָה స్వామ్య భావాన్ని కాపాడుతూ, భూమి మరియు దానిని నింపిన సమస్తాన్ని ఒకే సంయుక్త అంశంగా సహజ తెలుగులో ఉంచుతుంది.
- issue: రెండో కవితా పాదంలోని గుప్త క్రియ
  choice: ‘ఆయనకు చెందినవారే’ అని మొదటి పాదంలోని స్వామ్య భావాన్ని పునరుద్ధరించడం
  alternative: క్రియ లేకుండా ‘లోకం, దానిలో నివసించేవారు’ అని ఉంచడం
  rationale: హీబ్రూ సమాంతర నిర్మాణంలో రెండో పాదం మొదటి పాదంలోని స్వామ్య ప్రకటనను పంచుకుంటుంది; తెలుగులో అర్థం స్పష్టంగా ఉండేందుకు దాన్ని వ్యక్తంగా చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా ధోరణిని ఉంచాం. ‘భూమీ… సమస్తమూ; లోకమూ… నివసించేవారూ’ అనే సమాంతర నిర్మాణం హీబ్రూ కవిత్వాన్ని ప్రతిబింబిస్తుంది. సాధారణ పాఠకులకు అర్థమయ్యే పదజాలాన్ని ఉపయోగించాం.
