  yaml_path: translation/ot/psalms/024/006.yaml
  text: Such is the generation of those who seek him, who seek your face, O Jacob. Selah
translation:
  language: te
  text: 'ఆయనను వెదికేవారి తరం ఇదే—

    నీ ముఖాన్ని వెదికేవారు, ఓ యాకోబూ![a]

    సెలా'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో “యాకోబూ” అని ఉంది. కొన్ని ప్రాచీన అనువాదాలు “యాకోబు దేవుని ముఖాన్ని” అని చదువుతాయి.
    reason: The Masoretic wording is syntactically difficult and is retained in the main text as a vocative. The note records the ancient-version alternative without importing 'God of' into the translation.
lexical_decisions:
- source_word: זֶה דּוֹר
  choice: తరం ఇలాంటిదే
  rationale: The Hebrew identifies the character of the generation just described; this wording is natural Telugu while retaining the demonstrative force of זֶה.
- source_word: דֹּרְשָׁיו
  choice: ఆయనను వెదికేవారి
  rationale: The pronominal suffix is rendered explicitly as ‘him,’ represented naturally in Telugu by the respectful pronoun ఆయనను.
- source_word: מְבַקְשֵׁי פָנֶיךָ
  choice: నీ ముఖాన్ని వెదికేవారి
  rationale: Preserves the concrete Hebrew idiom ‘seek your face’ rather than reducing it to a generalized idea such as seeking favor or presence.
- source_word: סֶלָה
  choice: సెలా
  rationale: Transliterates the uncertain liturgical or musical term instead of assigning it a disputed meaning.
theological_decisions:
- issue: Referent and syntax of יַעֲקֹב (‘Jacob’)
  choice: యాకోబూ (‘O Jacob’), as direct address
  alternative: ‘యాకోబు దేవుని ముఖాన్ని’ or ‘యాకోబును వెదికేవారి’
  rationale: The Masoretic wording has ‘Jacob’ without ‘God of.’ Treating it as a vocative preserves the received Hebrew text and its genuine tension rather than importing an explanatory divine title.
translation_notes:
  register: Modern standard Telugu with dignified poetic parallelism. The repeated ‘తరం’ clarifies the elliptical second line without resolving the difficult vocative ‘Jacob.’
