id: PSA.24.10
reference: Psalms 24:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִ֤י ה֣וּא זֶה֮ מֶ֤לֶךְ הַ/כָּ֫ב֥וֹד יְהוָ֥ה צְבָא֑וֹת ה֤וּא מֶ֖לֶךְ הַ/כָּב֣וֹד סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/010.yaml
  text: Who is this King of glory? Yahweh of hosts—he is the King of glory[b][a]. Selah
translation:
  language: te
  text: ఈ మహిమా రాజు ఎవరు? సైన్యాల యాహ్వే[a]—ఆయనే మహిమా రాజు. సెలా[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సైన్యాల ప్రభువు.’ ‘యాహ్వే సబాయోత్’ అనే హెబ్రీ బిరుదు పరలోక సైన్యాలను లేదా క్రమబద్ధమైన శక్తులన్నిటినీ విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘సెలా’ బహుశా సంగీత సంబంధమైన లేదా ఆరాధనా సంబంధమైన సూచన; దాని ఖచ్చితమైన అర్థం తెలియదు.
    reason: cultural_note
lexical_decisions:
- source_word: מִי הוּא זֶה
  choice: ఈ ... ఎవరు?
  rationale: సర్వనామం, సూచనార్థక పదం కలిసిన హెబ్రీ ప్రశ్నలోని ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగు ప్రశ్నారూపంలో నిలిపింది.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: మహిమా రాజు
  rationale: ‘మహిమకు చెందిన రాజు/మహిమ యొక్క రాజు’ అనే కృత్రిమ నిర్మాణాన్ని నివారిస్తూ, כבוד లోని మహిమ, ఘనత భావాన్ని మరియు దైవిక బిరుదు స్వరూపాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హెబ్రీ దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: צְבָאוֹת
  choice: సైన్యాల
  rationale: ఈ బహువచన పదంలోని విస్తృత భావాన్ని నిలిపి, అది కేవలం మానవ సైన్యాలకే పరిమితమని నిర్దిష్టం చేయదు.
- source_word: הוּא
  choice: ఆయనే
  rationale: హెబ్రీలో స్పష్టంగా ఉన్న ఉద్ఘాటక సర్వనామాన్ని గౌరవసూచకమైన, సహజమైన తెలుగు రూపంలో వ్యక్తం చేస్తుంది; పాఠ్యంలో లేని అదనపు ప్రత్యేకతను చేర్చదు.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఈ పదం యొక్క ఖచ్చితమైన అర్థం అనిశ్చితంగా ఉన్నందున వ్యాఖ్యానాత్మక అనువాదం చేయకుండా లిప్యంతరీకరించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. కాబట్టి దానిని ఒక బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా అంగీకరించబడిన ‘యాహ్వే’ రూపంలో ఇచ్చింది.
- issue: יְהוָה צְבָאוֹת అనే బిరుదు పరిధి
  choice: సైన్యాల యాహ్వే
  alternative: సైన్యాల ప్రభువు; సేనల యాహ్వే
  rationale: צְבָאוֹת సూచించే సైన్యాలు లేదా సమూహాల పరిధిని సంకుచితం చేయకుండా, హెబ్రీ బిరుదు యొక్క సంక్షిప్త నిర్మాణాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన కీర్తనా శైలిని ఉపయోగించింది. ‘మహిమా రాజు’ను దైవిక బిరుదుగా నిలిపి, ‘ఆయనే’ ద్వారా మూలంలోని ఉద్ఘాటనను సహజంగా వ్యక్తం చేసింది.
