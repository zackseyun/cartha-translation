source:
  edition: WLC
  text: שְׂא֤וּ שְׁעָרִ֨ים רָֽאשֵׁי/כֶ֗ם וּ֭/שְׂאוּ פִּתְחֵ֣י עוֹלָ֑ם וְ֝/יָבֹא מֶ֣לֶךְ הַ/כָּבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/009.yaml
  text: Lift up your heads[a], O gates, and be lifted up, O ancient doors, that the King of glory may come in.
translation:
  language: te
  text: 'ద్వారాలారా, మీ తలలు పైకెత్తండి;

    పురాతన ద్వారాలారా,[a] పైకెత్తుకొనండి;

    మహిమగల రాజు ప్రవేశించడానికి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శాశ్వత ద్వారాలారా.’ హీబ్రూ పదబంధం ఎంతో పురాతనమైన ద్వారాలనూ లేదా దీర్ఘకాలం నిలిచే ద్వారాలనూ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: పైకెత్తండి
  rationale: బహువచన ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, ద్వారాలను సంబోధించే సజీవ కవితా రూపకాన్ని నిలుపుతుంది.
- source_word: שְׁעָרִים
  choice: ద్వారాలారా
  rationale: పట్టణం లేదా ఆలయ ప్రవేశ ద్వారాలకు సరిపోయే సాధారణ పదం; సంబోధన రూపం హీబ్రూ కవిత్వంలోని వ్యక్తీకరణను చూపుతుంది.
- source_word: רָאשֵׁיכֶם
  choice: మీ తలలు
  rationale: అక్షరార్థమైన ‘మీ తలలు’ అనే రూపకాన్ని నిర్మాణ సంబంధమైన వివరణగా మార్చకుండా నిలుపుతుంది.
- source_word: וּשְׂאוּ
  choice: పైకి లేవండి
  rationale: పునరుక్త ఆజ్ఞను నిలుపుతూ, నిర్జీవ ద్వారాలను వ్యక్తులుగా సంబోధించే సందర్భంలో తెలుగులో సహజంగా వినిపిస్తుంది.
- source_word: פִּתְחֵי עוֹלָם
  choice: పురాతన ద్వారాలు
  rationale: עוֹלָם ఇక్కడ సుదీర్ఘ కాలం, ప్రాచీనత్వం లేదా నిరంతర ఉనికిని సూచించగలదు. ప్రధాన పాఠ్యంలో ‘పురాతన’ సహజంగా ఉండగా, మరో సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְיָבֹא
  choice: లోపలికి వస్తాడు
  rationale: ఆజ్ఞల ఫలితంగా రాజు ప్రవేశించడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; హీబ్రూ రూపం ఉద్దేశం లేదా ఫలితం అనే భావాన్నీ అనుమతిస్తుంది.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: మహిమగల రాజు
  rationale: తెలుగులో సహజమైన గుణవాచక నిర్మాణంతో כבוד యొక్క మహిమ భావాన్ని, ఉన్నతమైన రాజ బిరుదును కాపాడుతుంది.
theological_decisions:
- issue: ద్వారాలకు ‘తలలు’ ఉన్నట్లుగా చెప్పే వ్యక్తీకరణను నిలుపాలా
  choice: ‘ద్వారాలారా, మీ తలలు పైకెత్తండి’ అని రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపాం.
  alternative: ‘ద్వారాలారా, పూర్తిగా తెరుచుకోండి’ అని నిర్మాణపరంగా వివరణ ఇవ్వడం.
  rationale: హీబ్రూ పాఠ్యం ద్వారాలను వ్యక్తులుగా సంబోధించి ‘తలలు’ అని స్పష్టంగా చెబుతుంది. దాన్ని నిలపడం కీర్తనలోని కవితా, ఆరాధనా శక్తిని కాపాడుతుంది.
- issue: פִּתְחֵי עוֹלָם లో עוֹלָם అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘పురాతన ద్వారాలు’ అని ఇచ్చాం.
  alternative: ‘శాశ్వత ద్వారాలు’ లేదా ‘ఎప్పటికీ నిలిచే ద్వారాలు.’
  rationale: ఈ పదం ప్రాచీనత్వాన్ని లేదా నిరంతర కాలాన్ని సూచించగలదు. ఒక అర్థాన్ని సంపూర్ణంగా మూసివేయకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- issue: וְיָבֹא ను ఉద్దేశంగా లేదా ఫలితంగా అనువదించడం
  choice: ‘మహిమగల రాజు లోపలికి వస్తాడు’ అని ఫలిత భావంతో ఇచ్చాం.
  alternative: ‘మహిమగల రాజు లోపలికి వచ్చేలా’ అని ఉద్దేశ భావంతో ఇవ్వడం.
  rationale: హీబ్రూ అనుసంధానం ఉద్దేశం లేదా ఫలితం రెండింటినీ అనుమతిస్తుంది. సరళమైన తెలుగు వాక్యం ఆజ్ఞ తరువాత జరిగే ప్రవేశాన్ని స్పష్టంగా చెబుతూ మూలంలోని క్రమాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా సంబోధనను ఉపయోగించాం. ‘మీ తలలు’ అనే అసాధారణమైనా ఉద్దేశపూర్వకమైన రూపకాన్ని నిలిపి, పంక్తుల సమాంతరతను స్పష్టంగా ఉంచాం.
