  to: 'ద్వారాలారా, మీ తలలు పైకెత్తండి;

    పురాతన ద్వారాలారా,[a] పైకెత్తుకొనండి;

    మహిమగల రాజు ప్రవేశించడానికి.'
  rationale: The revision restores the repeated ‘lift up’ imagery in the second line and renders the final verb as the purpose/result of the imperatives. It retains the source’s poetic personification, the ambiguity of עוֹלָם, and the elevated modern Telugu register.
