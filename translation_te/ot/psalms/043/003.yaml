id: PSA.43.3
reference: Psalms 43:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שְׁלַח אוֹרְ/ךָ֣ וַ֭/אֲמִתְּ/ךָ הֵ֣מָּה יַנְח֑וּ/נִי יְבִיא֥וּ/נִי אֶל הַֽר קָ֝דְשְׁ/ךָ֗ וְ/אֶל מִשְׁכְּנוֹתֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/003.yaml
  text: Send out your light and your truth[a]; let them lead me[b]; let them bring me to your holy mountain and to your dwelling places.
translation:
  language: te
  text: నీ వెలుగును, నీ సత్యాన్ని[a] పంపు; అవే నన్ను నడిపించుగాక; అవే నన్ను నీ పరిశుద్ధ పర్వతానికి, నీ నివాసస్థలాలకు[b] తీసుకువెళ్లుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీ సత్యాన్ని’ అనే చోట ‘నీ నమ్మకత్వాన్ని’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం సత్యం, నమ్మదగినతనం లేదా నమ్మకత్వం అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘నీ నివాసస్థలాలు’ అనేది హీబ్రూలోని బహువచన రూపాన్ని అనువదిస్తుంది; సంప్రదాయంగా ‘నీ గుడారాలు’ అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח
  choice: పంపు
  rationale: ద్వితీయ పురుష ఏకవచన ఆజ్ఞార్థక రూపాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: אוֹרְךָ
  choice: నీ వెలుగును
  rationale: మార్గదర్శకత్వం లేదా రక్షణ అనే అంతర్భావం ఉండవచ్చుగాని, మూలంలోని స్పష్టమైన కవితాత్మక ప్రతిమ ‘వెలుగు’నే నిలుపుతుంది.
- source_word: אֲמִתְּךָ
  choice: నీ సత్యాన్ని
  rationale: אֱמֶת అనే పదానికి సత్యం, నమ్మదగినతనం, నమ్మకత్వం అనే భావాలు ఉన్నాయి; ప్రధాన పాఠంలో ‘సత్యం’ మూలపద విస్తృతిని తక్కువగా సంకుచితం చేస్తుంది.
- source_word: הֵמָּה
  choice: అవే
  rationale: స్వతంత్ర బహువచన సర్వనామంలోని ఉద్ఘాటనను తెలుగులో ‘అవే’ సహజంగా నిలుపుతుంది.
- source_word: יַנְחוּנִי
  choice: నన్ను నడిపించుగాక
  rationale: హిఫిల్ అసంపూర్ణ రూపానికి సందర్భంలో ఉన్న ఆకాంక్షార్థక బలాన్ని గౌరవప్రదమైన తెలుగు ప్రార్థనా శైలిలో వ్యక్తం చేస్తుంది.
- source_word: יְבִיאוּנִי
  choice: నన్ను ... తీసుకువెళ్లుగాక
  rationale: దేవుని సన్నిధివైపు చలనాన్ని సహజమైన తెలుగులో చూపుతూ ఆకాంక్షార్థక భావాన్ని నిలుపుతుంది.
- source_word: הַר קָדְשְׁךָ
  choice: నీ పరిశుద్ధ పర్వతం
  rationale: ‘నీ పరిశుద్ధత యొక్క పర్వతం’ అనే నిర్మాణానికి సహజమైన సమానార్థక రూపం; ‘సీయోను’ అని మూలంలో లేని నిర్దిష్టతను చేర్చదు.
- source_word: מִשְׁכְּנוֹתֶיךָ
  choice: నీ నివాసస్థలాలు
  rationale: మూలంలోని బహువచనాన్ని నిలుపుతూ, పాతబడిన లేదా అతిగా సాంకేతికమైన పదానికి బదులు సాధారణ పాఠకులకు స్పష్టమైన రూపాన్ని ఇస్తుంది.
theological_decisions:
- issue: ‘వెలుగు’, ‘సత్యం’లను దైవ లక్షణాలుగా మాత్రమే వివరించాలా, లేక కవితాత్మకంగా నడిపించే ప్రతినిధులుగా నిలుపాలా
  choice: ‘అవే నన్ను నడిపించుగాక; అవి నన్ను ... తీసుకువెళ్లుగాక’ అని బహువచన సర్వనామం, క్రియలతో కవితాత్మక వ్యక్తీకరణను నిలుపడం
  alternative: దేవుని రక్షణాత్మక మార్గదర్శకత్వంగా వివరణాత్మకంగా మార్చడం
  rationale: హీబ్రూ పాఠం ‘వెలుగు’, ‘సత్యం’లను సూచిస్తూ స్పష్టంగా బహువచన సర్వనామం, క్రియలను వాడుతుంది; దానిని నిలుపడం మూల కవిత్వాన్ని, దాని భావ ఉద్రిక్తతను కాపాడుతుంది.
- issue: పరిశుద్ధ పర్వతం, నివాసస్థలాలను సీయోను లేదా దేవాలయం అని ప్రధాన పాఠంలో నిర్దిష్టంగా పేర్కొనాలా
  choice: ‘నీ పరిశుద్ధ పర్వతం’, ‘నీ నివాసస్థలాలు’ అనే విస్తృత మూల ప్రతిమలను నిలుపడం
  alternative: ‘సీయోను’, ‘నీ ఆలయం’ లేదా ‘నీ పరిశుద్ధస్థలం’ అని పేర్కొనడం
  rationale: సందర్భంలో సీయోను, ఆలయం ఉద్దేశించబడి ఉండవచ్చు; అయితే మూలపాఠం వాటిని నేరుగా పేర్కొనదు. అనవసరమైన వ్యాఖ్యానాత్మక నిర్దిష్టతను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా-కవితా శైలి ఉపయోగించబడింది. ‘నడిపించుగాక’, ‘తీసుకువెళ్లుగాక’ రూపాలు అభ్యర్థనాత్మక ఆకాంక్షను నిలుపుతాయి; ‘అవే’ మూలంలోని ఉద్ఘాటనను వ్యక్తం చేస్తుంది. ప్రతి పాదంలో ‘దగ్గరికి’ పునరావృతం చేయడం రెండు గమ్యపదాల నిర్మాణాన్ని స్పష్టంగా ఉంచుతుంది.
