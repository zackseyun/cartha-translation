- from: నీ వెలుగును, నీ సత్యాన్ని[a] పంపు; అవే నన్ను నడిపించుగాక; అవి నన్ను నీ పరిశుద్ధ పర్వతం దగ్గరికి, నీ నివాసస్థలాల[b] దగ్గరికి తీసుకువెళ్లుగాక.
  to: నీ వెలుగును, నీ సత్యాన్ని[a] పంపు; అవే నన్ను నడిపించుగాక; అవే నన్ను నీ పరిశుద్ధ పర్వతానికి, నీ నివాసస్థలాలకు[b] తీసుకువెళ్లుగాక.
