review_pass:
  verdict: revise
  source_fidelity: The causal opening, the repeated lament questions, divine rejection language, mourning imagery, and enemy oppression are all substantially faithful. The Hebrew מָעוֹז denotes a refuge/stronghold (and can carry a strength nuance); the draft's coined compound “ఆశ్రయదుర్గం” is understandable but is not the most natural modern Telugu expression.
  naturalness: The verse is generally fluent, but “నా ఆశ్రయదుర్గమైన దేవుడవు” is somewhat compressed and unnatural in modern standard Telugu. “నాకు ఆశ్రయదుర్గమైన దేవుడవు” clearly and naturally presents God as the psalmist's protective refuge/stronghold. The footnote alternative “చీకటిముఖంతో” is less natural and less precise than a wording based on being in gloom/mourning.
  terminology: “తిరస్కరించావు” appropriately renders זנחתני without importing total abandonment. “అణచివేత” accurately conveys לחץ. “దుఃఖంతో” suitably expresses the mourning force of קֹדֵר, while the footnote should preserve the underlying darkened/gloom idiom more accurately.
  issues:
  - severity: low
    issue: The expression “నా ఆశ్రయదుర్గమైన దేవుడవు” is stylistically compressed.
    rationale: It can sound like an unfamiliar compound. Adding “నాకు” makes the predication natural while retaining refuge/stronghold imagery.
  - severity: low
    issue: Footnote b uses “చీకటిముఖంతో.”
    rationale: The Hebrew describes going about darkened/in gloom, an idiom of mourning; it does not specifically refer to a dark-faced appearance. “విషాదంగా” or “చీకటిగా” better preserves the idiom and meaning.
  revised_text: ఎందుకంటే నీవే నాకు ఆశ్రయదుర్గమైన దేవుడవు[a]; నన్నెందుకు తిరస్కరించావు? శత్రువు అణచివేతవల్ల నేనెందుకు దుఃఖంతో తిరుగుతున్నాను[b]?
