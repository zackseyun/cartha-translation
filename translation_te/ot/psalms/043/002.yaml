language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי אַתָּ֤ה אֱלֹהֵ֣י מָֽעוּזִּ/י֮ לָ/מָ֪ה זְנַ֫חְתָּ֥/נִי לָֽ/מָּה קֹדֵ֥ר אֶתְהַלֵּ֗ךְ בְּ/לַ֣חַץ אוֹיֵֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/002.yaml
  text: For you are the God of my refuge[b][a]; why have you rejected me? Why do I go about mourning under the oppression of the enemy?
translation:
  language: te
  text: ఎందుకంటే నీవే నాకు ఆశ్రయదుర్గమైన దేవుడవు[a]; నన్నెందుకు తిరస్కరించావు? శత్రువు అణచివేతవల్ల నేనెందుకు దుఃఖంతో తిరుగుతున్నాను[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా ఆశ్రయమైన దేవుడు,’ ‘నా దుర్గమైన దేవుడు,’ లేదా ‘నా బలమైన దేవుడు.’ హీబ్రూ నామవాచకం సందర్భానుసారం ఆశ్రయం, దుర్గం లేదా బలం అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘శత్రువు అణచివేతవల్ల నేనెందుకు విషాదంగా తిరుగుతున్నాను?’ హీబ్రూ వాక్యం అక్షరార్థంగా ‘చీకటిపడినవాడిగా’ తిరగడాన్ని చెబుతుంది; ఇది దుఃఖాన్ని సూచించే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: మునుపటి విన్నపానికి ఆధారాన్ని తెలిపే కారణార్థక ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֱלֹהֵי מָעוּזִּי
  choice: నా ఆశ్రయదుర్గమైన దేవుడు
  rationale: מָעוֹז లోని ఆశ్రయం, రక్షణస్థలం లేదా దుర్గం అనే భావాలను ఒకే సహజమైన పదబంధంలో సాధ్యమైనంతవరకు నిలుపుతుంది; కేవలం బలం అనే భావానికి పరిమితం చేయదు.
- source_word: זְנַחְתָּנִי
  choice: నన్ను తిరస్కరించావు
  rationale: దూరం చేయడం లేదా తోసివేయడం అనే తీవ్రమైన విలాపభావాన్ని నిలుపుతూ, సంపూర్ణంగా విడిచిపెట్టడం అనే అదనపు భావాన్ని రుద్దదు.
- source_word: קֹדֵר אֶתְהַלֵּךְ
  choice: దుఃఖంతో తిరుగుతున్నాను
  rationale: అక్షరార్థంగా చీకటిపడిన స్థితిలో నడవడం అనే హీబ్రూ రూపకాన్ని, సందర్భంలోని శోకార్థంతో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּלַחַץ אוֹיֵב
  choice: శత్రువు అణచివేతవల్ల
  rationale: בְ ను కారణార్థకంగా గ్రహించి, לַחַץ లోని ఒత్తిడి లేదా అణచివేత భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుడు తిరస్కరించినట్లు విలపించే భాష
  choice: నన్నెందుకు తిరస్కరించావు?
  alternative: నన్నెందుకు విడిచిపెట్టావు? / నన్నెందుకు తోసివేశావు?
  rationale: కీర్తనకర్త అనుభవిస్తున్న దేవుని దూరత్వాన్ని నేరుగా ప్రశ్నించే ఒడంబడిక విలాపాన్ని మృదువుచేయకుండా నిలుపుతుంది; అదే సమయంలో మూలపదం తప్పనిసరిగా సూచించని సంపూర్ణ పరిత్యాగాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక గౌరవాన్ని, పునరుక్త ప్రశ్నల విలాపబలాన్ని నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉండే పదప్రయోగం. ప్రధాన వాక్యంలో రక్షణస్థల భావాన్ని ‘ఆశ్రయదుర్గం’తో నిలిపి, ఇతర సాధ్యార్థాలను పాదసూచికలో ఇచ్చాం.
