id: PSA.43.5
reference: Psalms 43:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מַה תִּשְׁתּ֬וֹחֲחִ֨י נַפְשִׁ/י֮ וּֽ/מַה תֶּהֱמִ֪י עָ֫לָ֥/י הוֹחִ֣ילִי לֵֽ֭/אלֹהִים כִּי ע֣וֹד אוֹדֶ֑/נּוּ יְשׁוּעֹ֥ת פָּ֝נַ֗/י וֵֽ/אלֹהָֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/005.yaml
  text: Why are you cast down[a], O my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him[b], the salvation of my countenance and my God.
translation:
  language: te
  text: నా ప్రాణమా, నీవెందుకు కృంగిపోతున్నావు? నాలో నీవెందుకు కలత చెందుతున్నావు? దేవునిమీద ఆశ పెట్టుకో; ఎందుకంటే నా ముఖానికి రక్షణయైన[a] నా దేవుణ్ణి నేను ఇంకా స్తుతిస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రూ పదబంధం అక్షరార్థంగా “నా ముఖపు రక్షణలు, మరియు నా దేవుడు.” ఇది కుంగిపోయిన కీర్తనకర్త ముఖాన్ని దేవుని రక్షణ తిరిగి నిలబెడుతుందనే భావాన్ని సూచించవచ్చు. మరో అనువాదం: “నా ముఖానికి సహాయమైనవాడు.”'
    reason: మూలంలోని అసాధారణ నిర్మాణాన్ని, దాని అక్షరార్థ బహువచనాన్ని, మరియు సంబంధంలోని అర్థసందిగ్ధతను తెలియజేయడం.
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: కుంగిపోయావు
  rationale: ఈ క్రియ వంగిపోవడం లేదా దిగులుతో కుంగిపోవడం అనే భావాన్ని ఇస్తుంది. సందర్భంలోని మానసిక దిగులును ఆధునిక తెలుగులో సహజంగా తెలియజేస్తూనే మూల రూపకాన్ని నిలుపుతుంది.
- source_word: נַפְשִׁי
  choice: నా ప్రాణమా
  rationale: కీర్తనలోని అంతరంగ స్వీయసంభాషణను నిలుపుతూ, נֶפֶשׁ సూచించే వ్యక్తి అంతరంగ స్వరూపాన్ని తెలుగులో గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: תֶּהֱמִי
  choice: కలత చెందుతున్నావు
  rationale: ఈ పదం కల్లోలం, అశాంతి, అంతరంగ ఆందోళనను సూచిస్తుంది. సాధారణ ఆధునిక పాఠకులకు సహజంగా ఉండేలా ‘కలత చెందుతున్నావు’ అని అనువదించబడింది.
- source_word: עָלַי
  choice: నాలో
  rationale: అక్షరార్థంగా ‘నాపై’ అయినప్పటికీ, ఇక్కడ కీర్తనకర్తలో జరుగుతున్న అంతరంగ కలత ఉద్దేశించబడింది; తెలుగులో ‘నాలో’ ఆ భావాన్ని సహజంగా ఇస్తుంది.
- source_word: הוֹחִילִי לֵאלֹהִים
  choice: దేవునిమీద ఆశ పెట్టుకో
  rationale: ఈ ఆజ్ఞ దేవునికోసం నిరీక్షణతో ఎదురుచూడడాన్ని, ఆయనపై నమ్మకం ఉంచడాన్ని సూచిస్తుంది. తెలుగులో ఈ ప్రయోగం సహజమూ స్పష్టమూ.
- source_word: עוֹד אוֹדֶנּוּ
  choice: ఆయనను నేను ఇంకా స్తుతిస్తాను
  rationale: ప్రస్తుత దిగులుకు విరుద్ధంగా భవిష్యత్తులో స్తుతి కొనసాగుతుందనే నమ్మకాన్ని עוֹד తెలియజేస్తుంది; ידה ఇక్కడ ఆరాధనా సందర్భంలో ‘స్తుతించు’ అనే భావంలో ఉంది.
- source_word: יְשׁוּעוֹת פָּנַי
  choice: నా ముఖానికి రక్షణయైన
  rationale: మూలంలోని అసాధారణమైన ‘నా ముఖపు రక్షణలు’ అనే చిత్రాన్ని పూర్తిగా తొలగించకుండా, దేవుని రక్షణ కుంగిన ముఖాన్ని తిరిగి నిలబెడుతుందనే భావాన్ని తెలుగులో గ్రహించదగిన రీతిలో అందిస్తుంది.
- source_word: וֵאלֹהָי
  choice: నా దేవుణ్ణి
  rationale: దేవునితో కీర్తనకర్తకున్న వ్యక్తిగత సంబంధాన్ని, మూలంలోని ‘మరియు నా దేవుడు’ అనే ముగింపును తెలుగు వాక్యనిర్మాణానికి తగిన విధంగా నిలుపుతుంది.
theological_decisions:
- issue: יְשׁוּעוֹת פָּנַי అనే పదబంధం యొక్క అర్థం
  choice: నా ముఖానికి రక్షణయైన ఆయన
  alternative: నా ముఖానికి సహాయమైనవాడు; లేదా అక్షరార్థంగా ‘నా ముఖపు రక్షణలు’
  rationale: మసొరెటిక్ పాఠంలోని అసాధారణ నిర్మాణాన్ని సులభమైన ‘నా రక్షకుడు’గా మార్చి దాని చిత్రాన్ని కోల్పోలేదు. అదే సమయంలో అర్థంకాని పదానువాదాన్ని ప్రధాన పాఠంలో పెట్టకుండా, ముఖాన్ని పునరుద్ధరించే దేవుని రక్షణ అనే భావాన్ని వ్యక్తం చేసింది. అక్షరార్థ రూపం, ప్రత్యామ్నాయ అర్థం పాదసూచికలో ఉంచబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కీర్తనా శైలి వాడబడింది. ‘నా ప్రాణమా’ అనే సంబోధన స్వీయసంభాషణను నిలుపుతుంది; అతిగా ప్రాచీనమైన లేదా ఏదైనా సంఘపరమైన ప్రత్యేక పదజాలాన్ని నివారించాం.
