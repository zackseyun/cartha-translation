revisions:
- from: నా ప్రాణమా, నీవెందుకు కుంగిపోయావు? నాలో నీవెందుకు కలత చెందుతున్నావు? దేవునిమీద ఆశ పెట్టుకో; ఎందుకంటే నా ముఖానికి రక్షణయైన[a] ఆయనను—నా దేవుణ్ణి—నేను ఇంకా స్తుతిస్తాను.
  to: నా ప్రాణమా, నీవెందుకు కృంగిపోతున్నావు? నాలో నీవెందుకు కలత చెందుతున్నావు? దేవునిమీద ఆశ పెట్టుకో; ఎందుకంటే నా ముఖానికి రక్షణయైన[a] నా దేవుణ్ణి నేను ఇంకా స్తుతిస్తాను.
