  terminology: ‘బలిపీఠం,’ ‘స్తుతిస్తాను,’ ‘దేవా, నా దేవా,’ and ‘కిన్నెర’ are appropriate. The cultural note responsibly avoids equating the kinnor uncritically with a modern harp or veena.
