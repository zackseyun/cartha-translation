- from: అప్పుడు నేను దేవుని బలిపీఠం దగ్గరికి, నా ఉల్లాసానికి ఆనందమైన దేవుని దగ్గరికి వస్తాను; దేవా, నా దేవా, కిన్నెరతో[a] నిన్ను స్తుతిస్తాను.
