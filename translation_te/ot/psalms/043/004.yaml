source:
  edition: WLC
  text: וְ/אָב֤וֹאָה אֶל מִזְבַּ֬ח אֱלֹהִ֗ים אֶל אֵל֮ שִׂמְחַ֪ת גִּ֫ילִ֥/י וְ/אוֹדְ/ךָ֥ בְ/כִנּ֗וֹר אֱלֹהִ֥ים אֱלֹהָֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/004.yaml
  text: Then I will go to the altar of God[a], to God, the joy of my rejoicing; and I will praise you with the lyre, O God[b], my God.
translation:
  language: te
  text: అప్పుడు నేను దేవుని బలిపీఠం వద్దకు, నా ఉల్లాసానికి ఆనందమైన దేవుని వద్దకు వస్తాను; దేవా, నా దేవా, కిన్నెరతో[a] నిన్ను స్తుతిస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కిన్నెర’ అనేది ప్రాచీన తంతివాద్యం; అది నేటి హార్పు లేదా వీణతో పూర్తిగా సమానం కాకపోవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וְאָבוֹאָה
  choice: అప్పుడు నేను ... వస్తాను
  rationale: ముందున్న ప్రార్థనలకు ఫలితంగా కలిగే సంకల్పం లేదా ఉద్దేశాన్ని ఈ మొదటి పురుష రూపం వ్యక్తం చేస్తుంది. తెలుగులో ‘అప్పుడు ... వస్తాను’ సందర్భానుగుణమైన క్రమాన్నీ, దేవుని సన్నిధికి చేరే దిశనూ సహజంగా తెలియజేస్తుంది.
- source_word: אֶל מִזְבַּח אֱלֹהִים
  choice: దేవుని బలిపీఠం దగ్గరికి
  rationale: హీబ్రూ సమాస సంబంధాన్ని స్పష్టంగా నిలుపుతూ, గమ్యాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶל אֵל
  choice: దేవుని దగ్గరికి
  rationale: ఇక్కడ אֵל దైవబిరుదుగా אֱלֹהִיםకు సమాంతరంగా ఉంది. అవసరం లేని అర్థభేదాన్ని ప్రవేశపెట్టకుండా రెండింటినీ ‘దేవుడు’గా అనువదించాం.
- source_word: שִׂמְחַת גִּילִי
  choice: నా ఉల్లాసానికి ఆనందమైన
  rationale: మూలంలోని రెండు సమీపార్థక ఆనందపదాల సమాసాన్ని, వాటి బలపరిచే పునరుక్తిని సాధ్యమైనంత పారదర్శకంగా నిలుపుతుంది.
- source_word: וְאוֹדְךָ
  choice: నిన్ను స్తుతిస్తాను
  rationale: ידה పదానికి కృతజ్ఞత చెప్పడం లేదా స్తుతించడం అనే అర్థాలు సాధ్యం. సంగీత వాద్యంతో కూడిన ఆరాధన సందర్భంలో ‘స్తుతిస్తాను’ సముచితం.
- source_word: בְכִנּוֹר
  choice: కిన్నెరతో
  rationale: כִּנּוֹר ఒక ప్రాచీన తంతివాద్యం. తెలుగు బైబిలు-సాంస్కృతిక వాడుకలోని ‘కిన్నెర’ మూలపదానికి దగ్గరగా ఉండి, సాధారణ వీణతో దానిని తప్పుగా సమానపరచదు.
- source_word: אֱלֹהִים אֱלֹהָי
  choice: దేవా, నా దేవా
  rationale: సంబోధనను, పునరుక్తిని, వ్యక్తిగత భక్తి భావాన్ని సహజమైన తెలుగు విభక్తితో నిలుపుతుంది.
theological_decisions:
- issue: אֱלֹהִים / אֵל అనే పునరావృత దైవబిరుదుల అనువాదం
  choice: రెండింటినీ ‘దేవుడు’గా అనువదించి పునరుక్తిని నిలుపడం
  alternative: אֵלను ‘బలవంతుడైన దేవుడు’గా లేదా ‘ఏల్’గా అనువదించడం
  rationale: ఇక్కడ కవిత్వం వేర్వేరు దైవస్వరూపాలను బోధించడం కంటే ఒకే దేవునికి చెందిన దైవబిరుదులను సమాంతరంగా ఉపయోగిస్తుంది. ‘దేవుడు’ అనడం అనవసరమైన సిద్ధాంత భేదాన్ని రానివ్వదు.
- issue: שִׂמְחַת גִּילִיలో ఆనందభాష యొక్క ద్విగుణీకరణ
  choice: ‘నా ఉల్లాసానికి ఆనందమైన’ అని రెండు ఆనందపదాల సంబంధాన్ని నిలుపడం
  alternative: ‘నా అత్యధిక ఆనందమైన’ లేదా ‘నా పరమానందమైన’ అని తీవ్రతగా మాత్రమే వ్యక్తం చేయడం
  rationale: హీబ్రూ నిర్మాణం తీవ్రతను సూచించవచ్చు, అయితే అది అక్షరార్థంగా రెండు సమీపార్థక ఆనందపదాలను ఉపయోగిస్తుంది. ప్రధాన పాఠం ఆ కవితాత్మక ఉద్వేగాన్ని కనిపించేలా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గంభీరమైన కాని సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని గమనక్రమం, ఆనందపదాల పునరుక్తి, ప్రత్యక్ష సంబోధన నిలుపబడ్డాయి.
