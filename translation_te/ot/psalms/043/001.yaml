- from: దేవా, నాకు న్యాయం తీర్చు; విశ్వాసనిష్ఠ లేని జనానికి[a] వ్యతిరేకంగా నా పక్షాన వాదించు. మోసమూ అన్యాయమూ చేసే మనిషి నుండి నన్ను విడిపించు.
