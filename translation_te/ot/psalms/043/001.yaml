reference: Psalms 43:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שָׁפְטֵ֤/נִי אֱלֹהִ֨ים וְ/רִ֘יבָ֤/ה רִיבִ֗/י מִ/גּ֥וֹי לֹא חָסִ֑יד מֵ֤/אִישׁ מִרְמָ֖ה וְ/עַוְלָ֣ה תְפַלְּטֵֽ/נִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/001.yaml
  text: Vindicate me[a], O God, and plead my cause against an unfaithful nation; deliver me from the deceitful and unjust man.
translation:
  language: te
  text: దేవా, నాకు న్యాయం చేయి; విశ్వాసనిష్ఠ లేని జాతికి[a] వ్యతిరేకంగా నా పక్షాన వాదించు. మోసమూ అన్యాయమూ చేసే మనిషి నుండి నన్ను విడిపించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భక్తిహీనమైన జాతికి.” హీబ్రూలో, “విశ్వాసనిష్ఠ లేని ఒక జాతి.”
    reason: חָסִיד పదం విశ్వాసపూర్వక నిబద్ధతతో పాటు భక్తి అనే భావాన్నీ కలిగి ఉండగలందున నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని సూచించడానికి.
lexical_decisions:
- source_word: שָׁפְטֵנִי
  choice: నాకు న్యాయం తీర్చు
  rationale: వ్యక్తిని కర్మగా తీసుకున్న ఈ న్యాయవిన్నపంలో, కేవలం తీర్పు చెప్పడం కాక విన్నపకర్తకు న్యాయం జరిగేలా తీర్పు ఇవ్వాలనే భావం ఉంది. తెలుగు న్యాయపరమైన సందర్భంలో ఈ పదబంధం సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ఇది ప్రార్థనలోని ప్రత్యక్ష సంబోధన; ఆధునిక ప్రామాణిక తెలుగులో ‘దేవా’ సహజమైన, గౌరవప్రదమైన సంబోధన.
- source_word: וְרִיבָה רִיבִי
  choice: నా పక్షాన వాదించు
  rationale: క్రియతో అదే మూలానికి చెందిన నామవాచకం కలిసిన ఈ న్యాయపరమైన నుడికారం, విన్నపకర్త వ్యాజ్యాన్ని చేపట్టి అతని తరఫున వాదించడాన్ని సూచిస్తుంది.
- source_word: מִגּוֹי לֹא חָסִיד
  choice: విశ్వాసనిష్ఠ లేని జనానికి వ్యతిరేకంగా
  rationale: ఈ సందర్భంలో מִן న్యాయవివాదంలోని ప్రత్యర్థిని సూచిస్తుంది. חָסִיד అనే పదం విశ్వాసపూర్వకమైన నిబద్ధత లేదా భక్తిని సూచించగలదు; దాని నిరాకరణను ‘విశ్వాసనిష్ఠ లేని’ అని అనువదించడం సంబంధపరమైన, నైతిక భావాన్ని నిలుపుతుంది.
- source_word: מֵאִישׁ מִרְמָה וְעַוְלָה
  choice: మోసమూ అన్యాయమూ చేసే మనిషి నుండి
  rationale: హీబ్రూ నిర్మాణం మోసం, అన్యాయం అనే లక్షణాలతో గుర్తించబడే ఒక వ్యక్తిని సూచిస్తుంది. తెలుగు క్రియాత్మక రూపం సహజంగా ఉండి, మూలంలోని ఏకవచన వ్యక్తిని నిలుపుతుంది.
- source_word: תְפַלְּטֵנִי
  choice: నన్ను విడిపించు
  rationale: పియేల్ రూపం ప్రమాదం లేదా శత్రువు చేతిలోనుండి సురక్షితంగా బయటపడేలా చేయడాన్ని సూచిస్తుంది. ‘విడిపించు’ ప్రార్థనా సందర్భానికి తగిన, స్పష్టమైన ఆధునిక తెలుగు పదం.
theological_decisions:
- issue: నిరాకరణతో వచ్చిన חָסִיד పదానికి అనువాదం
  choice: విశ్వాసనిష్ఠ లేని
  alternative: భక్తిహీనమైన
  rationale: חָסִיד పదం חסדతో సంబంధమున్న విశ్వాసపూర్వక నిబద్ధతను లేదా భక్తిని సూచించవచ్చు. ప్రధాన పాఠం సంబంధపరమైన నిష్ఠాభావాన్ని నిలుపుతుంది; విస్తృతమైన సంప్రదాయ భావాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవప్రదమైన శైలి. న్యాయస్థాన రూపకాన్ని ‘న్యాయం తీర్చు,’ ‘నా పక్షాన వాదించు’ అనే సహజమైన పదబంధాలతో నిలిపింది. ‘జనం’ అనే సమూహార్థాన్ని ఏకవచన విభక్తి రూపమైన ‘జనానికి’ ద్వారా వ్యక్తం చేసింది.
