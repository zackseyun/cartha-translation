source:
  edition: WLC
  text: לׅׄוּלֵׅׄ֗אׅׄ הֶ֭אֱמַנְתִּי לִ/רְא֥וֹת בְּֽ/טוּב יְהוָ֗ה בְּ/אֶ֣רֶץ חַיִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/013.yaml
  text: Unless I had believed that I would see the goodness of Yahweh in the land of the living[a][b].
translation:
  language: te
  text: సజీవుల దేశంలో యాహ్వే మంచితనాన్ని నేను చూస్తానని నమ్మి ఉండకపోతే—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీ వాక్యం ఇక్కడ అసంపూర్ణంగా ఉంది: “సజీవుల దేశంలో యాహ్వే మంచితనాన్ని నేను చూడగలనని నమ్మి ఉండకపోతే—.” దాని సూచిత ఫలితం “నేను నిరాశచెంది ఉండేవాడిని” లేదా “నేను ధైర్యం కోల్పోయి ఉండేవాడిని” అని సాధారణంగా అర్థం చేసుకుంటారు.'
    reason: alternative_reading
  - marker: b
    text: 'లేదా, భావాన్ని పూరించి: “నేను ధైర్యం కోల్పోయి ఉండేవాడిని.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּלֵא
  choice: నమ్మకపోయి ఉంటే
  rationale: ఈ అవ్యయం వాస్తవానికి విరుద్ధమైన షరతును ప్రవేశపెడుతుంది. హెబ్రీలో ఫలిత వాక్యం చెప్పకుండా వదిలినందున, తెలుగులోనూ అసంపూర్ణతను సూచించే దీర్ఘ విరామంతో దాని బలాన్ని నిలిపాం.
- source_word: הֶאֱמַנְתִּי
  choice: నేను ... నమ్మకపోయి ఉంటే
  rationale: అמן హిఫీల్ రూపం ఇక్కడ ‘నమ్మడం’ అనే భావాన్ని ఇస్తుంది. לוּלֵאతో కలిపి ప్రతికూల షరతుగా సహజమైన ఆధునిక తెలుగులో ఇచ్చాం.
- source_word: לִרְאוֹת
  choice: నేను చూస్తానని
  rationale: మూలంలో infinitive construct (‘చూడడానికి/చూడటం’) ఉన్నా, నమ్మకంలోని విషయాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘చూస్తానని’ వాడాం.
- source_word: בְּטוּב
  choice: మంచితనాన్ని
  rationale: טוּב దేవుని మేలు, దయ, ఔదార్యాన్ని సూచించగలదు. కేవలం భౌతిక వరాలకు పరిమితం చేయకుండా విస్తృత భావాన్ని ‘మంచితనం’ నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: בְּאֶרֶץ חַיִּים
  choice: సజీవుల దేశంలో
  rationale: ఇది మరణం/షియోల్‌కు విరుద్ధంగా జీవించి ఉన్నవారి లోకాన్ని సూచించే హెబ్రీ నుడికారం. ‘సజీవుల దేశం’ దాని రూపకాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: '[implicit apodosis after לוּלֵא]'
  choice: ప్రధాన ఫలిత వాక్యాన్ని పాఠ్యంలో పూరించలేదు
  rationale: మసొరేటిక్ పాఠం ఫలితాన్ని స్పష్టంగా చెప్పదు. ఒక నిర్దిష్ట భావాన్ని ప్రధాన వాక్యంలో చేర్చి సందిగ్ధతను తొలగించకుండా, దీర్ఘ విరామం మరియు పాదటిప్పణులతో ఈ కావ్యాత్మక అసంపూర్ణతను కాపాడాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం ఉంది; దాన్ని సాధారణ బిరుదుగా మార్చలేదు. తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం.
- issue: హెబ్రీలో విడిచిపెట్టిన ఫలిత వాక్యం
  choice: దాన్ని ప్రధాన పాఠ్యంలో పూరించకుండా దీర్ఘ విరామంతో నిలుపడం
  alternative: ‘నేను నిరాశచెంది ఉండేవాడిని’ లేదా ‘నా ధైర్యం కోల్పోయి ఉండేవాడిని’ అని పూరించడం
  rationale: మూల పాఠం ఫలితాన్ని పేర్కొనదు. సందర్భం నిరాశ లేదా ధైర్యక్షయాన్ని సూచించినా, వాటిలో ఒకదాన్ని ఖచ్చితమైన మూలవాక్యంగా చూపకుండా నిజమైన సందిగ్ధతను పాదటిప్పణిలో వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కీర్తనా శైలిని ఉంచాం. మూలంలోని ఉద్దేశపూర్వక అసంపూర్ణతను తెలుగులో దీర్ఘ విరామంతో వినిపించి, అవసరమైన వివరణను పాదటిప్పణులకు పరిమితం చేశాం.
