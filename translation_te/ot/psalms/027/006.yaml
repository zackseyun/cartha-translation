source:
  edition: WLC
  text: וְ/עַתָּ֨ה יָר֪וּם רֹאשִׁ֡/י עַ֤ל אֹֽיְבַ֬/י סְֽבִיבוֹתַ֗/י וְ/אֶזְבְּחָ֣ה בְ֭/אָהֳל/וֹ זִבְחֵ֣י תְרוּעָ֑ה אָשִׁ֥ירָה וַ֝/אֲזַמְּרָ֗ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/006.yaml
  text: And now my head will be lifted up above my enemies around me[a], and I will offer in his tent sacrifices of joyful shouting; I will sing, yes[b], I will make music to Yahweh.
translation:
  language: te
  text: ఇప్పుడు నా చుట్టూ ఉన్న శత్రువులపై నా తల పైకెత్తబడుతుంది. ఆయన గుడారంలో[a] ఆనందధ్వనులతో బలులు అర్పిస్తాను[b]. నేను పాడుతాను; యాహ్వేకు సంగీతంతో కీర్తిస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆయన’ అనేది సందర్భంలో అత్యంత సహజంగా యాహ్వేను సూచిస్తుంది.
    reason: referent_clarification
  - marker: b
    text: లేదా ‘ఆనందధ్వని బలులు.’ హీబ్రూ పదబంధం బలుల ఉత్సవ స్వభావాన్నిగానీ, వాటితో పాటు చేసే ఆనందధ్వనులనుగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: వర్తమాన పరిస్థితిలో సంభవించే మలుపును సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది; వాక్యసంబంధం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: יָרוּם רֹאשִׁי
  choice: నా తల పైకెత్తబడుతుంది
  rationale: ‘తల’ అనే హీబ్రూ రూపకాన్ని అలాగే ఉంచి, గౌరవం, ధైర్యం, విజయం అనే భావాలను విప్పి చెప్పకుండా కాపాడుతుంది.
- source_word: עַל אֹיְבַי סְבִיבוֹתַי
  choice: నా చుట్టూ ఉన్న శత్రువులపై
  rationale: శత్రువులు చుట్టుముట్టారనే భావాన్నీ, వారిపై కీర్తి లేదా విజయం పొందడాన్నీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: בְּאָהֳלוֹ
  choice: ఆయన గుడారంలో
  rationale: మూడవ పురుష ఏకవచన సర్వనామాన్ని నిలుపుతుంది; సందర్భంలో అది యాహ్వేను సూచించడం అత్యంత సహజం, అయితే అనువాదంలో పేరును చొప్పించలేదు.
- source_word: זִבְחֵי תְרוּעָה
  choice: జయధ్వనులతో బలులు
  rationale: తెరూఆ అనే పదంలోని బిగ్గర ధ్వని, విజయోత్సాహం లేదా ఆనందోత్సవ కేక భావాన్ని ‘జయధ్వనులు’ తెలియజేస్తుంది. బలుల స్వభావమా లేక వాటితో కూడిన ధ్వనులా అనే నిర్మాణాత్మక అస్పష్టతను పాదటిప్పణిలో నిలిపాం.
- source_word: אָשִׁירָה וַאֲזַמְּרָה
  choice: నేను పాడుతాను; ... స్తుతిగానం చేస్తాను
  rationale: సమాంతరమైన రెండు ఆరాధనా క్రియల ఉద్దేశపూర్వక బలాన్ని తెలుగులో సహజంగా వేరు చేస్తుంది; రెండవ క్రియలోని సంగీతపూర్వక స్తుతి భావాన్ని తెలియజేస్తుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: హీబ్రూ ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యనువదిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని నేరుగా ప్రతిబింబిస్తుంది; దానిని బిరుదుగా మార్చదు.
- issue: בְּאָהֳלוֹ లోని ‘ఆయన’ ఎవరిని సూచిస్తుంది?
  choice: సర్వనామాన్ని అలాగే ఉంచి, పాదటిప్పణిలో యాహ్వేను సూచించడం సహజమని తెలియజేయడం
  alternative: ‘యాహ్వే గుడారంలో’ అని పాఠంలోనే స్పష్టీకరించడం; కీర్తనకర్త గుడారం అని గ్రహించడం
  rationale: బలి, గానం, యాహ్వేకు స్తుతి అనే సందర్భం యాహ్వే గుడారాన్నే బలంగా సూచిస్తుంది. అయినా మూలంలోని సర్వనామాన్ని పేరుతో భర్తీ చేయకుండా ఉంచడం మూలరూపానికి న్యాయం చేస్తుంది.
- issue: זִבְחֵי תְרוּעָה యొక్క సంబంధం
  choice: జయధ్వనులతో బలులు
  alternative: జయధ్వని బలులు
  rationale: హీబ్రూ నిర్మాణం బలుల లక్షణాన్నో, వాటితో పాటు వినిపించే ఉత్సాహధ్వనులనో సూచించగలదు. ప్రధాన పాఠంలో సహజమైన తెలుగు రూపాన్ని ఎంచుకుని ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘తల పైకెత్తబడుతుంది,’ ‘గుడారం,’ ‘బలులు’ వంటి మూల రూపకాలు మరియు ఆరాధనా పదజాలం నిలుపబడ్డాయి; అవసరానికి మించిన వ్యాఖ్యానాన్ని ప్రధాన పాఠంలో చేర్చలేదు.
