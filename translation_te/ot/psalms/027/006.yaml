- from: ఇప్పుడు నా చుట్టూ ఉన్న శత్రువులపై నా తల పైకెత్తబడుతుంది. ఆయన గుడారంలో[a] జయధ్వనులతో బలులు అర్పిస్తాను[b]. నేను పాడుతాను; యాహ్వేకు స్తుతిగానం చేస్తాను.
  to: ఇప్పుడు నా చుట్టూ ఉన్న శత్రువులపై నా తల పైకెత్తబడుతుంది. ఆయన గుడారంలో[a] ఆనందధ్వనులతో బలులు అర్పిస్తాను[b]. నేను పాడుతాను; యాహ్వేకు సంగీతంతో కీర్తిస్తాను.
