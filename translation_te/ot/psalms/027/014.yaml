  text: קַוֵּ֗ה אֶל יְה֫וָ֥ה חֲ֭זַק וְ/יַאֲמֵ֣ץ לִבֶּ֑/ךָ וְ֝/קַוֵּ֗ה אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/014.yaml
  text: Wait for Yahweh[a]; be strong, and let your heart take courage; yes[c][b], wait for Yahweh.
translation:
  language: te
  text: యాహ్వే కోసం నిరీక్షించు[a]; బలంగా ఉండు, నీ హృదయం ధైర్యపడనివ్వు[b]; యాహ్వే కోసం నిరీక్షించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిరీక్షించు’ అనే మాటను ‘ఆశతో ఎదురు చూడు’ లేదా ‘ఆయనలో ఆశ ఉంచు’ అని కూడా అనువదించవచ్చు. ఇందులో ఓపికతో వేచి ఉండడం, నమ్మకంతో ఆశించడం—రెండు భావాలూ ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆయన నీ హృదయాన్ని దృఢపరుస్తాడు.” హీబ్రూ క్రియను కొనసాగుతున్న ప్రోత్సాహంగా గానీ, యాహ్వే చేసే కార్యాన్ని తెలిపే వాగ్దానంగా గానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: קַוֵּה / וְקַוֵּה
  choice: నిరీక్షించు
  rationale: పీయేల్ ఆజ్ఞారూపం ఓపికగా వేచి ఉండడమే కాక, నమ్మకంతో ఎదురుచూడడాన్ని కూడా సూచిస్తుంది. పద్యంలోని పునరుక్తిని యథాతథంగా నిలిపాం.
- source_word: אֶל
  choice: కోసం
  rationale: קוה తో కలిసి, ఎదుటివానివైపు ఆశతో నిరీక్షించడాన్ని సూచిస్తుంది; తెలుగులో ‘యాహ్వే కోసం నిరీక్షించు’ సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో సాధారణమైన లిప్యంతరీకరణతో అందించాం.
- source_word: חֲזַק
  choice: బలంగా ఉండు
  rationale: ఆజ్ఞారూపంలోని ప్రత్యక్ష ప్రోత్సాహాన్ని నిలుపుతూ, బలం ఏ రంగానికి సంబంధించినదో అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: וְיַאֲמֵץ לִבֶּךָ
  choice: నీ హృదయం ధైర్యం పొందనివ్వు
  rationale: చుట్టూ ఉన్న ఆజ్ఞారూపాల క్రమంలో దీన్ని ప్రోత్సాహక భావంతో చదివి, ‘హృదయం’ అనే హీబ్రూ రూపకాన్ని నిలిపాం. క్రియారూపానికి సాధ్యమైన వాగ్దానాత్మక పఠనాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; కాబట్టి దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
- issue: וְיַאֲמֵץ యొక్క వాక్యనిర్మాణ భావం
  choice: 'కొనసాగుతున్న ప్రోత్సాహం: ‘నీ హృదయం ధైర్యం పొందనివ్వు’'
  alternative: 'వాగ్దానాత్మక భావం: ‘ఆయన నీ హృదయాన్ని దృఢపరుస్తాడు’'
  rationale: ఆజ్ఞల మధ్య ఉన్నందున ప్రోత్సాహక భావం సందర్భానికి సరిపోతుంది; అయినా హిఫీల్ క్రియారూపం యాహ్వేను సూచించే అంతర్లీన కర్తతో వాగ్దానంగా కూడా అర్థమవుతుంది. ఆ నిజమైన సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కవితా శైలిని వాడాం. ‘హృదయం’ అనే మూలభాషా రూపకాన్ని, చివరి ఆజ్ఞ పునరుక్తిని నిలిపాం; మూలంలో లేని ఉద్ఘాటక పదాన్ని చేర్చలేదు.
