source:
  edition: WLC
  text: אִם תַּחֲנֶ֬ה עָלַ֨/י מַחֲנֶה֮ לֹֽא יִירָ֪א לִ֫בִּ֥/י אִם תָּק֣וּם עָ֭לַ/י מִלְחָמָ֑ה בְּ֝/זֹ֗את אֲנִ֣י בוֹטֵֽחַ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/003.yaml
  text: Though an army encamps against me[a], my heart will not fear; though war rises against me[c][b], even then I will trust.
translation:
  language: te
  text: ఒక సైన్యం నాకు వ్యతిరేకంగా మోహరించినా[a], నా హృదయం భయపడదు; యుద్ధం నాపై చెలరేగినా, ఈ పరిస్థితిలో కూడా నేను విశ్వసిస్తున్నాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఒక సైన్యం నాకు వ్యతిరేకంగా మోహరిస్తే … యుద్ధం నాపై చెలరేగితే.’ హీబ్రూ పదం షరతును (‘అయితే’) లేదా ప్రతికూల పరిస్థితినీ లెక్కచేయని భావాన్ని (‘అయినా’) సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఇందులో నేను ధైర్యంగా ఉన్నాను’ లేదా ‘అయినా నేను విశ్వసిస్తున్నాను.’ హీబ్రూ వాక్యం ముప్పు మధ్య నిలిచే విశ్వాసాన్ని లేదా ధైర్యాన్ని నొక్కిచెప్పవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: …అయినా
  rationale: రెండు సమాంతర వాక్యాల్లో אִם షరతుకన్నా concessive భావాన్ని ఇస్తోంది; ‘…అయినా’ ఆ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: תַּחֲנֶה עָלַי מַחֲנֶה
  choice: ఒక సైన్యం నాకు వ్యతిరేకంగా మోహరించినా
  rationale: חנה శిబిరం వేయడం అనే సైనిక చిత్రాన్ని ఇస్తుంది; מחנה అక్షరార్థంగా ‘శిబిరం’ అయినా, యుద్ధ సందర్భంలో సైన్యాన్ని సూచిస్తుంది. ‘మోహరించు’ ఈ రెండింటి సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: לֹא יִירָא לִבִּי
  choice: నా హృదయం భయపడదు
  rationale: హీబ్రూలో ‘నా హృదయం’ స్పష్టమైన కర్త; దాన్ని ‘నేను’గా సరళీకరించకుండా మూలంలోని వ్యక్తీకరణను నిలుపుతుంది.
- source_word: תָּקוּם עָלַי מִלְחָמָה
  choice: యుద్ధం నాపై చెలరేగినా
  rationale: קום యొక్క ‘లేచు/తలెత్తు’ చిత్రాన్ని తెలుగు యుద్ధ సందర్భంలో ‘చెలరేగు’ సహజంగా వ్యక్తపరుస్తుంది; עָלַי లోని విరోధ దిశను ‘నాపై’ నిలుపుతుంది.
- source_word: בְּזֹאת אֲנִי בוֹטֵחַ
  choice: ఈ పరిస్థితిలో కూడా నేను నమ్మకంగా ఉంటాను
  rationale: בזאת లోని సూచనాత్మకమైన ‘ఇందులో/ఈ దానిలో’ భావాన్ని ముందున్న ముప్పుకు అనుసంధానిస్తూ, בטח లోని నమ్మకం–ధైర్యం భావపరిధిని కాపాడుతుంది; విశ్వాసానికి వ్యక్తమైన కర్మను మూలం చెప్పనందున జోడించదు.
theological_decisions:
- issue: בְּזֹאת యొక్క సూచన మరియు בטח యొక్క భావం
  choice: ముందు వివరించిన ముప్పును సూచిస్తూ ‘ఈ పరిస్థితిలో కూడా నేను నమ్మకంగా ఉంటాను’
  alternative: ‘ఇందులో నేను ధైర్యంగా ఉన్నాను’ లేదా ‘అయినా నేను నమ్ముతాను’
  rationale: సమీప సందర్భం సైన్యం, యుద్ధం అనే పరిస్థితులనే సూచనగా తీసుకోవడానికి అనుకూలిస్తుంది. అయితే మూలంలోని సంక్షిప్తత వల్ల ‘ఇందులో’ అనే నిర్దిష్ట సూచన లేదా ‘ధైర్యంగా ఉన్నాను’ అనే భావం కూడా సాధ్యమే; దేవునిని స్పష్టమైన కర్మగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ‘నా హృదయం’ అనే కవితాత్మక రూపాన్ని నిలిపి, ‘మోహరించినా/చెలరేగినా’ ద్వారా సైనిక దృశ్యాన్ని సహజంగా వ్యక్తపరిచాం.
