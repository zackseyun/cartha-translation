source:
  edition: WLC
  text: ה֤וֹרֵ֥/נִי יְהוָ֗ה דַּ֫רְכֶּ֥/ךָ וּ֭/נְחֵ/נִי בְּ/אֹ֣רַח מִישׁ֑וֹר לְ֝מַ֗עַן שׁוֹרְרָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/011.yaml
  text: Teach me your way[a], O Yahweh, and lead me on a level path because of my enemies.
translation:
  language: te
  text: 'యహ్వే, నీ మార్గాన్ని నాకు బోధించు;

    నా శత్రువుల కారణంగా సమతలమైన దారిలో నన్ను నడిపించు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹרֵנִי
  choice: నాకు బోధించు
  rationale: హిఫీల్ రూపంలోని ירה ఇక్కడ ‘బోధించు, ఉపదేశించు’ అనే భావాన్ని ఇస్తుంది. ప్రార్థనా సందర్భంలో ‘నాకు బోధించు’ సహజంగా ఉండి, కేవలం చూపించడం కంటే శిక్షణ భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని ఉచ్చారణకు సమీపమైన ‘యహ్వే’గా లిప్యంతరీకరించాం.
- source_word: דַּרְכֶּךָ
  choice: నీ మార్గాన్ని
  rationale: דֶּרֶךְ అక్షరార్థంగా దారి లేదా మార్గం; రూపకాలంకారంగా జీవన విధానం, దేవుని చిత్తం అనే భావాలనూ కలిగి ఉంటుంది. ‘మార్గం’ ఈ రెండు కోణాలనూ నిలుపుతుంది.
- source_word: וּנְחֵנִי
  choice: నన్ను నడిపించు
  rationale: נחה అంటే నడిపించడం లేదా మార్గదర్శనం చేయడం. ‘నడిపించు’ దారి అనే దృశ్యరూపాన్ని స్పష్టంగా కొనసాగిస్తుంది.
- source_word: בְּאֹרַח מִישׁוֹר
  choice: సమతలమైన దారిలో
  rationale: אֹרַח అంటే దారి; מִישׁוֹר ప్రాథమికంగా చదునైన లేదా సమతలమైన నేలను సూచిస్తుంది, అలాగే నేరుతనం అనే రూపకాలంకార భావాన్నీ కలిగి ఉండవచ్చు. ‘సమతలమైన దారి’ మూలంలోని స్పష్టమైన భౌతిక చిత్రాన్ని నిలుపుతుంది.
- source_word: לְמַעַן
  choice: కారణంగా
  rationale: ఈ సందర్భంలో కీర్తనకర్త విజ్ఞప్తికి శత్రువుల ఉనికి కారణమని సూచిస్తుంది. తెలుగులో ‘నుబట్టి’తో కలిపిన నిర్మాణం సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: שׁוֹרְרָי
  choice: నా శత్రువులు
  rationale: ఈ పదం విరోధులను సూచిస్తుంది; వారిలో కీర్తనకర్తకు వ్యతిరేకంగా అవకాశంకోసం గమనించేవారు లేదా పొంచి ఉండేవారు అనే ప్రత్యేక ఛాయ ఉండవచ్చు. ప్రధాన పాఠంలో స్పష్టమైన ‘శత్రువులు’ను వాడి, ఆ ఛాయను పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా నిలుపుతూ, సాధారణంగా పునర్నిర్మించిన ఉచ్చారణను తెలుగులో ‘యహ్వే’గా అందించాం.
- issue: מִישׁוֹר లోని భౌతిక, నైతిక భావాల సంబంధం
  choice: సమతలమైన
  alternative: నేరైన / యథార్థమైన
  rationale: మూలపదపు ప్రాథమిక భౌగోళిక దృశ్యాన్ని ప్రధాన పాఠంలో నిలిపాం; దానిలో వినిపించగల నైతిక నేరుతనాన్ని స్పష్టీకరించి ఒకే అర్థానికి పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలిని వాడాం. హీబ్రూ వాక్యంలోని మార్గం–దారి దృశ్యరూపాన్ని కాపాడుతూ, పదక్రమాన్ని తెలుగు సహజ వాక్యనిర్మాణానికి అనుగుణంగా మార్చాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘శత్రువులు’ పదబంధం వెంట ఉంచాం.
