  edition: WLC
  text: לְ/דָוִ֨ד יְהוָ֤ה אוֹרִ֣/י וְ֭/יִשְׁעִ/י מִ/מִּ֣י אִירָ֑א יְהוָ֥ה מָֽעוֹז חַ֝יַּ֗/י מִ/מִּ֥י אֶפְחָֽד׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/000.yaml
  text: Of David[a]. Yahweh is my light and my salvation; whom shall I fear? Yahweh is the stronghold of my life[b]; of whom shall I be afraid?
translation:
  language: te
  text: 'దావీదు కీర్తన.[a]


    యెహోవా నా వెలుగు, నా రక్షణ;

    నేను ఎవరికి భయపడాలి?

    యెహోవా నా ప్రాణానికి దుర్గం;

    నేను ఎవరికి బెదరాలి?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దావీదు రచించినది,’ ‘దావీదుకు చెందినది,’ లేదా ‘దావీదు కొరకు.’ శీర్షికలోని హీబ్రూ לְדָוִד రచయితత్వాన్ని, సంబంధాన్ని లేదా అంకితాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: దావీదు కీర్తన
  rationale: శీర్షికలోని לְ ఉపసర్గ రచయితను, సంబంధాన్ని లేదా అంకితాన్ని సూచించవచ్చు. తెలుగులో సహజమైన శీర్షికగా ‘దావీదు కీర్తన’ను వాడి, అసలు భాషలోని పరిధిని పాదటిప్పణిలో నిలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామంలోని నాలుగు హల్లులకు తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించదగిన రూపం; సాధారణ బిరుదుగా మార్చకుండా వ్యక్తినామాన్ని నిలుపుతుంది.
- source_word: אוֹרִי
  choice: నా వెలుగు
  rationale: ‘వెలుగు’ అనే మూల రూపకాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: יִשְׁעִי
  choice: నా రక్షణ
  rationale: విడుదల, కాపుదల అనే భావపరిధిని సందర్భానికి తగిన సాధారణ తెలుగు పదంతో వ్యక్తపరుస్తుంది.
- source_word: מָעוֹז חַיַּי
  choice: నా జీవితానికి దుర్గం
  rationale: מָעוֹז లోని బలమైన ఆశ్రయం లేదా కోట అనే రూపకాన్ని ‘దుర్గం’ నిలుపుతుంది; חַיַּי ను ‘నా జీవితానికి’గా సహజంగా అనుసంధానిస్తుంది.
- source_word: אֶפְחָד
  choice: నేను ఎవరిని చూసి బెదరాలి?
  rationale: మొదటి ప్రశ్నలోని ‘భయపడాలి’తో అనవసర పదపునరుక్తిని తగ్గిస్తూ, రెండవ భయపదంలోని తీవ్రతను సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה ను ఎలా ప్రతిబింబించాలి
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: అసలు పాఠంలోని వ్యక్తిగత దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా స్పష్టంగా నిలిపాం.
- issue: לְדָוִד శీర్షికలో రచయితత్వం లేదా సంబంధం
  choice: దావీదు కీర్తన
  alternative: దావీదు రచించినది / దావీదు కొరకు
  rationale: హీబ్రూ నిర్మాణం రచయితత్వంతో పాటు సంబంధం లేదా అంకితాన్ని కూడా అనుమతిస్తుంది. ప్రధాన పాఠంలో సహజమైన రూపాన్ని ఎంచుకుని, ఇతర సాధ్యార్థాలను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనాత్మక గంభీరతతో పాటు సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదాలను వాడాం. రెండు సమాంతర అలంకార ప్రశ్నలను, ‘వెలుగు’ మరియు ‘దుర్గం’ అనే మూల రూపకాలను నిలిపాం.
