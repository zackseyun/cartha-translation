  rationale: రెండవ ప్రశ్నలో మూలపాఠంలో లేని “చూసి” భావాన్ని తొలగించాము. חַיַּי యొక్క ‘నా జీవం/ప్రాణం’ భావాన్ని “నా ప్రాణానికి”గా ఇచ్చి, מָעוֹז యొక్క కోటవంటి రక్షణ రూపకాన్ని “దుర్గం”గా నిలిపాము. మిగిలిన పాఠం మరియు పాదటిప్పణి మూలార్థం, కీర్తనాత్మక రిజిస్టర్, మరియు శీర్షికలోని ఉద్దేశపూర్వక అస్పష్టతను సముచితంగా కాపాడుతున్నాయి.
