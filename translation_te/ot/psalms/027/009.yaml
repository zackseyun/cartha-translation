  to: 'నా నుండి నీ ముఖాన్ని దాచవద్దు;

    కోపంతో నీ సేవకుణ్ణి తిప్పివేయకు.

    నీవు నాకు సహాయంగా ఉన్నావు.

    నన్ను త్రోసివేయకు, నన్ను విడిచిపెట్టకు,

    నా రక్షణకర్తవైన దేవా![a]'
  rationale: The revision uses natural Telugu for the Hebrew image of hiding one’s face ‘from me,’ removes unmarked emphasis from the perfect clause, and replaces the unclear final vocative with an idiomatic expression that conveys God as the one characterized by and responsible for the psalmist’s salvation. The alternative footnote remains anchored to the final divine title and represents the deliverance sense of ישע.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T10:26:37Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the sequence and parallel appeals of the Hebrew and correctly distinguishes נטה ('turn away'), נטש ('cast off/reject'), and עזב ('forsake/leave'). However, ‘నీవే’ adds an emphasis not marked in the Hebrew, and ‘నా రక్షణకు దేవా’ is not an idiomatic or sufficiently clear rendering of אֱלֹהֵי יִשְׁעִי.
  naturalness: ‘నీ ముఖాన్ని నాకు మరుగుచేయకు’ is understandable but less natural than the standard Telugu construction ‘నా నుండి నీ ముఖాన్ని దాచవద్దు.’ The final vocative needs revision for idiomatic modern Telugu.
  terminology: ‘నీ సేవకుణ్ణి,’ ‘త్రోసివేయకు,’ and ‘విడిచిపెట్టకు’ are appropriate and retain the prayer’s humble, forceful register. ‘నా రక్షణకర్తవైన దేవా’ naturally conveys the Hebrew construct without reducing salvation merely to a momentary act of rescue.
  issues:
  - severity: medium
    issue: The phrase ‘నా రక్షణకు దేవా’ is syntactically awkward and semantically under-specified.
    rationale: It can sound like ‘O God, for my salvation’ rather than the Hebrew vocative ‘O God of my salvation.’ A possessive, personal formulation is needed.
  - severity: low
    issue: ‘నీవే’ introduces explicit exclusivity/emphasis.
    rationale: The Hebrew has ‘you have been my help’ but does not include an independent emphatic particle. Omitting ‘-ఏ’ better reflects the source.
  - severity: low
    issue: ‘నీ ముఖాన్ని నాకు మరుగుచేయకు’ is less idiomatic than a ‘hide ... from me’ construction.
    rationale: ‘నా నుండి నీ ముఖాన్ని దాచవద్దు’ clearly expresses the Hebrew preposition and preserves the face imagery in natural modern Telugu.
