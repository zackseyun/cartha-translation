id: PSA.27.9
reference: Psalms 27:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַל תַּסְתֵּ֬ר פָּנֶ֨י/ךָ מִמֶּ/נִּי֮ אַֽל תַּט בְּ/אַ֗ף עַ֫בְדֶּ֥/ךָ עֶזְרָתִ֥/י הָיִ֑יתָ אַֽל תִּטְּשֵׁ֥/נִי וְ/אַל תַּֽ֝עַזְבֵ֗/נִי אֱלֹהֵ֥י יִשְׁעִֽ/י־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/009.yaml
  text: Do not hide your face from me[a]; do not turn your servant away in anger. You have been my help. Do not cast me off, and do not forsake me[c][b], O God of my salvation.
translation:
  language: te
  text: 'నా నుండి నీ ముఖాన్ని దాచవద్దు;

    కోపంతో నీ సేవకుణ్ణి తిప్పివేయకు.

    నీవు నాకు సహాయంగా ఉన్నావు.

    నన్ను త్రోసివేయకు, నన్ను విడిచిపెట్టకు,

    నా రక్షణకర్తవైన దేవా![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నన్ను విడిపించే దేవా!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתֵּר
  choice: మరుగుచేయకు
  rationale: סתר అంటే ‘దాచు/మరుగుచేయు.’ దేవుడు తన ముఖాన్ని దాచుకోవడం అనే సంబంధాత్మక కవితా చిత్రాన్ని ‘మరుగుచేయకు’ సహజంగా నిలుపుతుంది.
- source_word: פָּנֶיךָ
  choice: నీ ముఖాన్ని
  rationale: హీబ్రూ మూలంలోని ‘ముఖం’ అనే మానవరూపక భాషను ‘సన్నిధి’ అని వివరణాత్మకంగా మార్చకుండా యథాతథంగా నిలిపాం.
- source_word: מִמֶּנִּי
  choice: నాకు
  rationale: తెలుగులో ‘నీ ముఖాన్ని నాకు మరుగుచేయకు’ అనేది మూలంలోని ‘నా నుండి’ అనే భావాన్ని సహజమైన ప్రార్థనా భాషలో వ్యక్తం చేస్తుంది.
- source_word: תַּט בְּאַף
  choice: కోపంతో ... తిప్పివేయకు
  rationale: נטה యొక్క ‘తిప్పు/పక్కకు మళ్లించు’ భావాన్ని, בְאַף లోని కోపార్థాన్ని కాపాడుతూ సంబంధాత్మక తిరస్కారంగా అనువదించాం.
- source_word: עַבְדֶּךָ
  choice: నీ సేవకుణ్ణి
  rationale: ఈ ప్రార్థనా సందర్భంలో עבד వినయపూర్వకంగా దేవునికి లోబడిన వ్యక్తిని సూచిస్తుంది; చట్టపరమైన బానిసత్వం ఇక్కడ ప్రధానాంశం కాదు.
- source_word: עֶזְרָתִי הָיִיתָ
  choice: నీవే నాకు సహాయంగా ఉన్నావు
  rationale: עזרה అంటే ‘సహాయం’; perfect రూపం గతంలో అనుభవించిన, ఇప్పటికీ ప్రాసంగికమైన దేవుని సహాయాన్ని సూచిస్తుంది. ‘నీవే’ ప్రార్థనలోని ప్రత్యక్ష సంబోధనను సహజంగా చేస్తుంది.
- source_word: תִּטְּשֵׁנִי
  choice: నన్ను త్రోసివేయకు
  rationale: נטש లోని విడిచిపెట్టడం లేదా తిరస్కరించడం అనే బలమైన భావాన్ని ‘త్రోసివేయకు’ చూపిస్తుంది; తదుపరి עזבతో భేదాన్ని కూడా నిలుపుతుంది.
- source_word: תַּעַזְבֵנִי
  choice: నన్ను విడిచిపెట్టకు
  rationale: עזב యొక్క సాధారణ భావం ‘విడిచిపెట్టు.’ ఇది ఆధునిక తెలుగులో సహజంగా ఉండి, ముందటి ‘త్రోసివేయకు’తో సమానార్థక పునరుక్తి తీవ్రతను నిలుపుతుంది.
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: నా రక్షణకు దేవా
  rationale: హీబ్రూ construct పదబంధంలోని భావాన్ని తెలుగులో సహజమైన సంబోధనగా అందిస్తుంది. ఇది ‘నన్ను రక్షించే దేవా’ అనే క్రియాత్మక అర్థానికి కూడా అవకాశం ఉంచుతుంది.
theological_decisions:
- issue: దేవుని గురించి ‘నీ ముఖం’ అనే మానవరూపక భాష
  choice: ‘నీ ముఖాన్ని’ అని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘నీ సన్నిధిని’
  rationale: మూలపాఠం స్పష్టంగా ‘ముఖం’ అనే కవితా చిత్రాన్ని వాడుతుంది. దానిని ‘సన్నిధి’గా అర్థవివరణ చేయకుండా ఉంచడం వల్ల దైవానుగ్రహం, సంబంధం, సన్నిధి అనే అంతర్భావాలు నిలుస్తాయి.
- issue: עבד పదాన్ని దేవునితో సంబంధంలో అనువదించడం
  choice: సేవకుడు
  alternative: దాసుడు / బానిస
  rationale: ఈ కీర్తన ప్రార్థనలో వినయపూర్వక సేవాభావం ప్రధానంగా ఉంది; చట్టపరమైన బంధస్థితి కాదు. ‘సేవకుడు’ ఆధునిక పాఠకులకు సహజంగా ఆ సందర్భాన్ని తెలియజేస్తుంది.
- issue: אֱלֹהֵי יִשְׁעִי లోని ישע భావవ్యాప్తి
  choice: నా రక్షణకు దేవా
  alternative: నన్ను విడిపించే దేవా
  rationale: ישע రక్షణ, విడిపింపు రెండింటినీ సూచించగలదు. ప్రధాన పాఠ్యంలో విస్తృతమైన ‘రక్షణ’ను ఉంచి, ‘విడిపింపు’ను పాదటీకలో ఇచ్చాం; తద్వారా భావవ్యాప్తిని సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, నేరుగా దేవునితో మాట్లాడే ప్రార్థనా శైలిని ఉపయోగించాం. హీబ్రూ కవిత్వంలోని సమాంతర విజ్ఞప్తులను వేర్వేరు పంక్తులుగా ఉంచి, ‘త్రోసివేయకు / విడిచిపెట్టకు’ అనే భావతీవ్రతను కాపాడాం.
