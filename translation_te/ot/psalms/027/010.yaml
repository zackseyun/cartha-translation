  yaml_path: translation/ot/psalms/027/010.yaml
  text: For my father and my mother have forsaken me[a], but Yahweh will take me in.
translation:
  language: te
  text: ఎందుకంటే నా తండ్రి, నా తల్లి నన్ను విడిచిపెట్టారు; అయితే యాహ్వే నన్ను చేరదీస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నన్ను స్వీకరిస్తాడు,’ ‘నన్ను తన దగ్గరకు తీసుకుంటాడు.’ హీబ్రూ క్రియకు అక్షరార్థంగా ‘కూడదీస్తాడు’ అనే భావం ఉంది; ఇక్కడ అది యాహ్వే ఆదరంగా స్వీకరించి తన రక్షణలో ఉంచడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఈ సందర్భంలో కారణాన్ని లేదా నమ్మకానికి ఆధారమైన పరిస్థితిని పరిచయం చేసే సంధానార్థాన్ని స్పష్టంగా ఉంచుతుంది; దాన్ని మౌలికంగా ‘అయినప్పటికీ’ అని మార్చదు.
- source_word: אָבִי וְאִמִּי
  choice: నా తండ్రి, నా తల్లి
  rationale: రెండు స్వామ్య నామరూపాలను సహజమైన ఆధునిక తెలుగు క్రమంలో నేరుగా అందిస్తుంది.
- source_word: עֲזָבוּנִי
  choice: నన్ను విడిచిపెట్టారు
  rationale: עזב లోని విడిచివేయడం లేదా పరిత్యజించడం అనే బలమైన భావాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: וַיהוָה
  choice: అయితే యాహ్వే
  rationale: వావ్ సంధిని ఇక్కడ మానవుల విడిచిపెట్టడానికి దేవుని ఆదరణకు మధ్యనున్న వ్యతిరేకతగా సహజంగా వ్యక్తం చేస్తుంది; దైవనామాన్ని యాహ్వే అని లిప్యంతరీకరిస్తుంది.
- source_word: יַאַסְפֵנִי
  choice: నన్ను చేరదీస్తాడు
  rationale: אסף అనే ‘కూడదీయు/సమకూర్చు’ మూలచిత్రాన్ని నిలుపుతూ, ఈ వ్యక్తిగత సందర్భంలో ఆదరంగా స్వీకరించి రక్షణలోకి తీసుకోవడం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: హీబ్రూ నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ప్రాజెక్టు నిర్దేశించిన రూపానికి అనుగుణంగా లిప్యంతరీకరిస్తుంది.
- issue: తల్లిదండ్రుల విడిచిపెట్టడం మరియు యాహ్వే స్వీకరించడం మధ్య సంబంధం
  choice: వాస్తవ ప్రకటనను నిలుపుతూ ‘అయితే’తో వ్యతిరేకతను చూపడం
  alternative: ‘విడిచిపెట్టినా’ అనే షరతు/అనుమతి భావం
  rationale: హీబ్రూ సంపూర్ణ క్రియారూపాన్ని ఊహాత్మక షరతుగా మార్చకుండా, వాక్యంలో ఉన్న గాఢమైన మానవ పరిత్యాగం–దైవ ఆదరణ వ్యత్యాసాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి. ‘చేరదీస్తాడు’ అనేది మూలంలోని సమకూర్చే చిత్రాన్నీ, ఆదరణతో స్వీకరించే సందర్భార్థాన్నీ సమతుల్యం చేస్తుంది.
