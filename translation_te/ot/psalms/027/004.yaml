  to: 'నేను యాహ్వేను ఒక్కటి అడిగాను; దానినే వెదకుతాను: నా జీవితకాలమంతా యాహ్వే మందిరంలో నివసించడానికీ, యాహ్వే సౌందర్యాన్ని[a] తిలకించడానికీ, ఆయన ఆలయంలో విచారించడానికీ[b].'
  rationale: సవరణ మూలంలోని ఏకైక విన్నపం, దానిని నిరంతరం వెదకే సంకల్పం, అలాగే నివసించడం–తిలకించడం–విచారించడం అనే మూడు ఉద్దేశ్యాలను స్పష్టంగా నిలుపుతుంది. యాహ్వే అనే దైవనామం ప్రాజెక్టు విధానానికి అనుగుణంగా ఏకరీతిగా చేయబడింది; నֹעַם మరియు బָּקַרల అర్థవ్యాప్తి పాదసూచికల్లో భద్రపరచబడింది.
