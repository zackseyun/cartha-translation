  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַחַ֤ת שָׁאַ֣לְתִּי מֵֽ/אֵת יְהוָה֮ אוֹתָ֪/הּ אֲבַ֫קֵּ֥שׁ שִׁבְתִּ֣/י בְּ/בֵית יְ֭הוָה כָּל יְמֵ֣י חַיַּ֑/י לַ/חֲז֥וֹת בְּ/נֹֽעַם יְ֝הוָ֗ה וּ/לְ/בַקֵּ֥ר בְּ/הֵיכָלֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/004.yaml
  text: 'One thing I have asked from Yahweh[a]; this I will seek: that I may dwell in the house of Yahweh all the days of my life[c][b], to behold the beauty of Yahweh and to inquire in his temple.'
translation:
  language: te
  text: 'నేను యాహ్వేను ఒక్కటి అడిగాను; దానినే వెదకుతాను: నా జీవితకాలమంతా యాహ్వే మందిరంలో నివసించడానికీ, యాహ్వే సౌందర్యాన్ని[a] తిలకించడానికీ, ఆయన ఆలయంలో విచారించడానికీ[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యాహ్వే మనోహరత్వాన్ని’ లేదా ‘యాహ్వే అనుగ్రహాన్ని.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆయన ఆలయంలో వెదకడానికి’ లేదా ‘ఆయన ఆలయంలో ధ్యానించడానికి.’ ఇక్కడి హీబ్రూ క్రియ అర్థం క్లిష్టమైనది; ఆలయంలో శ్రద్ధగా విచారించడం లేదా ధ్యానించడం అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת
  choice: ఒకటే
  rationale: స్త్రీలింగ ఏకవచన సంఖ్యావాచకం ఇక్కడ నామవాచకంగా పనిచేసి, కీర్తనకర్త కోరిక ఒక్కటేనని నొక్కి చెబుతుంది.
- source_word: שָׁאַלְתִּי מֵאֵת יְהוָה
  choice: నేను యెహోవాను ... అడిగాను
  rationale: హీబ్రూ పరిపూర్ణ క్రియ ఇప్పటికే చేసిన, ఇంకా ప్రస్తుత ప్రాధాన్యం గల విన్నపాన్ని సూచిస్తుంది; తెలుగులో సహజమైన కర్మ నిర్మాణం వాడబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన వ్యక్తినామ రూపంలో అందిస్తుంది.
- source_word: אוֹתָהּ אֲבַקֵּשׁ
  choice: దానినే కోరుకుంటాను
  rationale: సర్వనామం ముందున్న ఏకైక విన్నపాన్ని తిరిగి సూచిస్తుంది; నొక్కిచెప్పే భావాన్ని ‘నే’ నిలుపుతుంది. అసంపూర్ణ క్రియ నిరంతర సంకల్పాన్ని సూచిస్తుంది.
- source_word: שִׁבְתִּי בְּבֵית יְהוָה
  choice: యెహోవా మందిరంలో నివసిస్తూ
  rationale: ఇక్కడ ‘కూర్చోవడం’కన్నా దేవుని సన్నిధిలో నిలకడగా ఉండడం భావం సందర్భానికి సరిపోతుంది; ‘మందిరం’ ఆరాధనా స్థల చిత్రాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כָּל יְמֵי חַיַּי
  choice: నా జీవితకాలమంతా
  rationale: హీబ్రూ కాలవ్యాప్తిని సహజమైన ఆధునిక తెలుగు వ్యక్తీకరణతో పూర్తిగా నిలుపుతుంది.
- source_word: לַחֲזוֹת
  choice: తిలకించడానికి
  rationale: సాధారణంగా చూడడమే కాక, శ్రద్ధతో దర్శించే ధ్యానాత్మక భావాన్ని తెలియజేస్తుంది.
- source_word: בְּנֹעַם יְהוָה
  choice: యెహోవా సౌందర్యాన్ని
  rationale: נֹעַם లోని మనోహరత, ఆహ్లాదకరత, అనుగ్రహం వంటి భావవ్యాప్తిలో ఈ ఆరాధనా సందర్భానికి ‘సౌందర్యం’ సహజంగా సరిపోతుంది; ప్రత్యామ్నాయాలు పాదసూచికలో ఉంచబడ్డాయి.
- source_word: וּלְבַקֵּר בְּהֵיכָלוֹ
  choice: ఆయన ఆలయంలో ధ్యానపూర్వకంగా విచారించడానికి
  rationale: క్రియకు ఇక్కడ శ్రద్ధగా వెదకడం, విచారించడం లేదా ధ్యానించడం అనే క్లిష్ట భావవ్యాప్తి ఉంది. ‘ధ్యానపూర్వకంగా విచారించడం’ ఆ అనిశ్చితిని అతిగా ఒక్క అర్థానికి పరిమితం చేయకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని ఉపయోగిస్తుంది. తెలుగులో గుర్తించదగిన ‘యెహోవా’ రూపం దాన్ని బిరుదుతో భర్తీ చేయకుండా నిలుపుతుంది.
- issue: נֹעַם יְהוָה భావం
  choice: యెహోవా సౌందర్యం
  alternative: యెహోవా మనోహరత్వం; యెహోవా అనుగ్రహం
  rationale: పదం సౌందర్యం, ఆహ్లాదకరత లేదా అనుగ్రహాన్ని సూచించగలదు. ప్రధాన పాఠంలో సందర్భోచితమైన ‘సౌందర్యం’ ఉంచి, నిజమైన అర్థవ్యాప్తిని పాదసూచికలో కాపాడాం.
- issue: וּלְבַקֵּר యొక్క ఆలయసందర్భ భావం
  choice: ధ్యానపూర్వకంగా విచారించడం
  alternative: వెదకడం; ధ్యానించడం
  rationale: మూల క్రియ ఇక్కడ అర్థపరంగా క్లిష్టమైనది. విచారణ మరియు ధ్యానాత్మక శ్రద్ధ రెండింటినీ ప్రతిబింబించే పదబంధాన్ని ఎంచుకుని, ఇతర సాధ్యార్థాలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కీర్తనా శైలి వాడబడింది. ‘మందిరం/ఆలయం,’ ‘తిలకించు,’ ‘ధ్యానపూర్వకంగా విచారించు’ వంటి పదాలు ఉన్నతతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి. ప్రధాన పాఠంలోని ప్రతి పాదసూచిక సూచిక [a], [b] సంబంధిత స్థానంలో ఉంచబడింది.
