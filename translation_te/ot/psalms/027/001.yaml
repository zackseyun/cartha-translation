source:
  edition: WLC
  text: לְ/דָוִ֨ד יְהוָ֤ה אוֹרִ֣/י וְ֭/יִשְׁעִ/י מִ/מִּ֣י אִירָ֑א יְהוָ֥ה מָֽעוֹז חַ֝יַּ֗/י מִ/מִּ֥י אֶפְחָֽד׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/001.yaml
  text: Of David[a]. Yahweh is my light and my salvation; whom shall I fear? Yahweh is the stronghold of my life[b]; of whom shall I be afraid?
translation:
  language: te
  text: 'దావీదుకు చెందినది.[a]


    యాహ్వే[b] నా వెలుగు, నా రక్షణ;

    నేను ఎవరికి భయపడతాను?

    యాహ్వే నా జీవితానికి దుర్గం;

    నేను ఎవరి విషయంలో భయపడతాను?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దావీదు చేత రచించబడినది’ లేదా ‘దావీదు కొరకు.’ శీర్షికలోని హీబ్రూ לְדָוִד రచయితత్వాన్ని లేదా దావీదుతో ఉన్న సంబంధాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూలో దేవుని వ్యక్తిగత నామం יהוה (YHWH); ఇక్కడ దాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: దావీదుకు చెందినది
  rationale: కీర్తన శీర్షికలోని לְ ఉపసర్గ రచయితను, సంబంధాన్ని లేదా ఎవరి నిమిత్తమో సూచించగలదు. ‘దావీదుకు చెందినది’ అనేది రచయిత దావీదేనని ఖచ్చితంగా నిర్ణయించకుండా ఆ సంబంధాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ లిప్యంతరీకరణగా ‘యాహ్వే’ అని ఇచ్చాం.
- source_word: אוֹרִי
  choice: నా వెలుగు
  rationale: ‘వెలుగు’ అనే మూల రూపకాన్ని మార్గదర్శకత్వం లేదా నిరీక్షణగా విప్పి చెప్పకుండా యథాతథంగా నిలిపాం.
- source_word: וְיִשְׁעִי
  choice: నా రక్షణ
  rationale: יֵשַׁע రక్షణ లేదా విమోచనను సూచిస్తుంది. ఈ సందర్భంలోని విస్తృతమైన కాపుదల భావానికి ‘రక్షణ’ సహజంగా సరిపోతుంది.
- source_word: מִמִּי אִירָא
  choice: నేను ఎవరికి భయపడతాను?
  rationale: హీబ్రూ ప్రశ్నలోని ‘ఎవరి నుండి’ అనే నిర్మాణాన్ని సహజ తెలుగు వాడుకలో ‘ఎవరికి’గా ఇచ్చాం. అసంపూర్ణ క్రియారూపం ఇక్కడ ధైర్యాన్ని తెలిపే అలంకారిక ప్రశ్నగా ఉంది.
- source_word: מָעוֹז
  choice: దుర్గం
  rationale: ఈ పదం బలం, భద్రత కలిగించే రక్షిత స్థలాన్ని సూచిస్తుంది. ‘దుర్గం’ దాని కోటలాంటి రక్షణ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: חַיַּי
  choice: నా జీవిత
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన తెలుగు సమాసంగా ఇచ్చి, యాహ్వే కీర్తనకర్త జీవితానికి రక్షణాత్మక దుర్గమనే భావాన్ని నిలిపాం.
- source_word: מִמִּי אֶפְחָד
  choice: నేను ఎవరికి బెదరుతాను?
  rationale: פחד లోని భీతి లేదా జడుపు భావాన్ని ‘బెదరుతాను’తో వ్యక్తం చేసి, మొదటి ప్రశ్నతో ఉన్న సమాంతరతనూ పదవైవిధ్యాన్నీ నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని నామాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: לְדָוִד ద్వారా సూచితమైన దావీదుతో సంబంధం
  choice: దావీదుకు చెందినది
  alternative: దావీదు రచన
  rationale: హీబ్రూ ఉపసర్గ రచయితృత్వాన్ని సూచించగలిగినా అది ఒక్కటే సాధ్యార్థం కాదు. అందువల్ల రచయితృత్వాన్ని సిద్ధాంతపరంగా ఖరారు చేయకుండా మూలంలోని సందిగ్ధతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనాత్మక గౌరవభావాన్ని నిలుపుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదాలను వాడాం. రెండు అలంకారిక ప్రశ్నల్లో ‘భయపడతాను/బెదరుతాను’ అనే సమాంతర పదవైవిధ్యాన్ని నిలిపాం; అతిగా ప్రాచీనమైన క్రియారూపాలను నివారించాం.
