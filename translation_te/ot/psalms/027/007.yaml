id: PSA.27.7
reference: Psalms 27:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שְׁמַע יְהוָ֖ה קוֹלִ֥/י אֶקְרָ֗א וְ/חָנֵּ֥/נִי וַ/עֲנֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/007.yaml
  text: Hear[a], O Yahweh, when I cry aloud[b]; be gracious to me and answer me.
translation:
  language: te
  text: యాహ్వే[a], నేను మొరపెట్టినప్పుడు నా స్వరం విను; నాపై కృప చూపి[b] నాకు జవాబివ్వు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: יהוה (YHWH), దేవుని ప్రత్యేక నామం; సంప్రదాయంగా ‘ప్రభువు’ లేదా ‘యెహోవా’ అని కూడా అందిస్తారు.'
    reason: divine_name
  - marker: b
    text: లేదా ‘నాపై దయ చూపి’; సంప్రదాయంగా ‘నన్ను కరుణించి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: విను
  rationale: ఇది שׁמע క్రియ యొక్క ఆజ్ఞార్థక రూపం. ఇక్కడ కేవలం శబ్దాన్ని వినడం కాక, ప్రార్థనను శ్రద్ధగా ఆలకించాలనే విజ్ఞప్తి ఉంది; సాధారణ ఆధునిక తెలుగులో ‘విను’ సహజంగా ఆ భావాన్ని మోస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ మూలంలో ఉన్న దేవుని ప్రత్యేక నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిప్యంతరీకరణలో అందించింది.
- source_word: קוֹלִי
  choice: నా స్వరం
  rationale: קוֹלִי అనే స్పష్టమైన, దృశ్యమయమైన హీబ్రూ వ్యక్తీకరణను ‘నన్ను’ అని సరళీకరించకుండా ‘నా స్వరం’గా నిలిపింది.
- source_word: אֶקְרָא
  choice: నేను మొరపెట్టినప్పుడు
  rationale: కרא ఇక్కడ దేవునికి అత్యవసరంగా పిలవడం లేదా మొరపెట్టడం అనే ప్రార్థనా భావంలో ఉంది. ముందున్న ‘నా స్వరం విను’తో సహజంగా అనుసంధానించేందుకు కాలార్థక నిర్మాణం వాడింది.
- source_word: וְחָנֵּנִי
  choice: నాపై కృప చూపి
  rationale: חנן అనేది అనుగ్రహం లేదా కృప చూపమనే విజ్ఞప్తి. ‘కరుణించు’ కూడా సాధ్యమే గాని, ‘కృప చూపు’ మూలక్రియలోని అనుగ్రహ భావాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: וַעֲנֵנִי
  choice: నాకు జవాబివ్వు
  rationale: ענה ఇక్కడ ప్రార్థనకు సమాధానం ఇవ్వడం అనే అర్థంలో ఉంది. ‘నాకు జవాబివ్వు’ నేరుగా, సహజంగా ఉంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం ప్రత్యేక దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని సాధారణ బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని వ్యక్తిగత సంబోధనను నిలుపుతుంది.
- issue: חנן యొక్క భావం
  choice: కృప చూపు
  alternative: కరుణించు / దయ చూపు
  rationale: ఈ క్రియ దయ భావాన్ని కలిగి ఉన్నప్పటికీ, ముఖ్యంగా అనుగ్రహం చూపడాన్ని సూచిస్తుంది. అందువల్ల ప్రత్యేక సిద్ధాంత వివరణను చేర్చకుండా ‘కృప చూపు’ అని అనువదించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ప్రార్థనా శైలిని ఉపయోగించింది. ‘నా స్వరం’ అనే హీబ్రూ యొక్క స్పష్టమైన వ్యక్తీకరణను నిలిపి, వాక్యక్రమాన్ని తెలుగు పఠనానికి అనుకూలంగా అమర్చింది.
