source:
  edition: WLC
  text: כִּ֤י יִצְפְּנֵ֨/נִי בְּ/סֻכֹּ/ה֮ בְּ/י֪וֹם רָ֫עָ֥ה יַ֭סְתִּרֵ/נִי בְּ/סֵ֣תֶר אָהֳל֑/וֹ בְּ֝/צ֗וּר יְרוֹמְמֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/005.yaml
  text: For he will hide me in his shelter in the day of trouble[a]; he will conceal me in the secret place of his tent[c][b]; he will lift me high upon a rock.
translation:
  language: te
  text: 'ఎందుకంటే, ఆపద దినంలో[b] ఆయన తన ఆశ్రయంలో[a] నన్ను దాచుతాడు;

    తన గుడారంలోని మరుగు స్థలంలో నన్ను దాచిపెడతాడు;

    బండపై నన్ను ఎత్తుగా ఉంచుతాడు.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పందిరిలో,’ ‘మండపంలో,’ ‘గుడారంలో.’ హీబ్రూ పదం కప్పుగల ఆశ్రయ నిర్మాణాన్ని సూచిస్తుంది; పరిశుద్ధస్థల భావసూచన కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘కీడు సంభవించే దినంలో,’ ‘విపత్తు దినంలో.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘బండపై నన్ను ఉన్నతంగా ఉంచుతాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలో వ్యక్తమైన నమ్మకానికి కారణాన్ని పరిచయం చేసే వివరణాత్మక భావాన్ని నిలుపుతుంది.
- source_word: יִצְפְּנֵנִי
  choice: నన్ను దాచుతాడు
  rationale: צפן అనే క్రియలోని దాచడం ద్వారా కాపాడే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּסֻכּוֹ
  choice: తన పందిరిలో
  rationale: סֻכָּה తాత్కాలికమైన కప్పుగల ఆశ్రయాన్ని సూచిస్తుంది. ‘పందిరి’ concrete imageryని, రక్షణ భావాన్ని నిలుపుతూ, దానిని తప్పనిసరిగా ఆరాధనా మందిరంగా పరిమితం చేయదు.
- source_word: בְּיוֹם רָעָה
  choice: ఆపద దినంలో
  rationale: ఇక్కడ רָעָה నైతిక దుష్టత్వం కంటే విపత్తు లేదా కష్టకాలాన్ని సూచిస్తుంది; ‘ఆపద దినం’ ఆ సందర్భార్థాన్ని గౌరవప్రదంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: יַסְתִּרֵנִי
  choice: నన్ను మరుగుచేస్తాడు
  rationale: סתר లోని కనబడకుండా భద్రపరచే భావాన్ని తెలియజేస్తూ, మొదటి పాదంలోని ‘దాచుతాడు’తో ఉన్న సమాంతరతను పదేపదే అదే క్రియ వాడకుండా నిలుపుతుంది.
- source_word: בְּסֵתֶר אָהֳלוֹ
  choice: తన గుడారంలోని మరుగు స్థలంలో
  rationale: סֵתֶר యొక్క దాగిన/మరుగు స్థల భావాన్నీ, אֹהֶל యొక్క స్పష్టమైన ‘గుడారం’ రూపకాన్నీ సహజమైన తెలుగు పదబంధంలో నిలుపుతుంది.
- source_word: בְּצוּר
  choice: బండపై
  rationale: צוּר సూచించే దృఢమైన బండ లేదా శిలా ప్రదేశాన్ని, భద్రతనిచ్చే ఎత్తైన స్థల రూపకంతో కలిపి తెలియజేస్తుంది.
- source_word: יְרוֹמְמֵנִי
  choice: నన్ను ఎత్తుగా నిలుపుతాడు
  rationale: רום క్రియలోని పైకి ఎత్తడం/ఉన్నత స్థితిలో ఉంచడం అనే నిలువు రక్షణ రూపకాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: סֻכּוֹ మరియు אָהֳלוֹ పదాల్లో ఉండగల పరిశుద్ధస్థల సంబంధిత సూచన
  choice: ‘పందిరి’, ‘గుడారం’ అనే concrete రక్షణ రూపకాలతో అనువదించడం
  alternative: రెండింటినీ ‘గుడారం/మందిరం’ వంటి స్పష్టమైన ఆరాధనా స్థల పదాలతో అనువదించడం
  rationale: ఈ పదాలకు పరిశుద్ధస్థల అనుబంధం ఉండవచ్చు; అయినా మూలపాఠం సాధారణ ఆశ్రయ నిర్మాణాల పదాలనే వాడుతుంది. అందువల్ల ఆ సూచనను పూర్తిగా తొలగించకుండా, వచనాన్ని ఒక నిర్దిష్ట ఆరాధనా వ్యవస్థకే పరిమితం చేయకుండా ఉంచాం.
- issue: בְּיוֹם רָעָה లో רָעָה యొక్క భావం
  choice: నైతిక చెడుకంటే విపత్తు/కష్టం అనే అర్థంలో ‘ఆపద’
  alternative: ‘చెడు దినంలో’
  rationale: కీర్తనకర్త రక్షణ కోరుతున్న సందర్భంలో ఇది నైతిక దుష్టత్వాన్ని కాక ప్రతికూల పరిస్థితి లేదా విపత్తును సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, కీర్తనా కవిత్వానికి తగిన గౌరవభరితమైన ధోరణి. హీబ్రూ సమాంతరతను మూడు పాదాలుగా నిలుపుతూ ‘దాచుతాడు/మరుగుచేస్తాడు’ అనే సమీపార్థక క్రియలను వాడాం. అడుగుసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల వెంట ఉంచాం.
