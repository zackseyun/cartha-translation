  naturalness: ‘నా విరోధుల కోరికకు నన్ను అప్పగించవద్దు,’ ‘అబద్ధ సాక్షులు నాపై లేచారు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉన్నాయి. ‘హింసను ఊదివిడుస్తున్నారు’ కొంత సజీవమైన, అసాధారణమైన రూపకమే అయినా, మూలంలోని יפח (‘ఊదుట/ఊపిరితో వెలువరించుట’)ను సముచితంగా కాపాడుతుంది; కీర్తనాత్మక సందర్భంలో ఆమోదయోగ్యం.
