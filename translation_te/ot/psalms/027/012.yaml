  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַֽל תִּ֭תְּנֵ/נִי בְּ/נֶ֣פֶשׁ צָרָ֑/י כִּ֥י קָֽמוּ בִ֥/י עֵֽדֵי שֶׁ֝֗קֶר וִ/יפֵ֥חַ חָמָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/012.yaml
  text: Do not give me over to the desire of my adversaries[a], for false witnesses have risen against me[c][b], and they breathe out violence.
translation:
  language: te
  text: 'నా విరోధుల కోరికకు నన్ను అప్పగించవద్దు.[a]


    ఎందుకంటే అబద్ధ సాక్షులు నాపై లేచారు;


    వారు హింసను ఊదివిడుస్తున్నారు.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా విరోధుల ఇష్టానికి నన్ను అప్పగించవద్దు.” ఇక్కడి హీబ్రూ పదం נֶפֶשׁ సంకుచితంగా ‘ఆత్మ’ అని కాకుండా కోరిక, ఆకాంక్ష లేదా సంకల్పం అనే భావాన్ని కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అబద్ధ సాక్షులు నాపై లేచి, హింసను ఊదివిడుస్తున్నారు.” చివరి మాటలు ఆ సాక్షులనే సమష్టిగా వర్ణించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “మరియు హింసను ఊదివిడిచేవాడు.” హీబ్రూలో చివరి వర్ణన వ్యాకరణపరంగా ఏకవచనంలో ఉంది; అది అబద్ధ సాక్షులలో ఒకరిని లేదా వారి సమష్టి వర్ణనను సూచించవచ్చు.
    reason: previous_rendering
lexical_decisions:
- source_word: תִּתְּנֵנִי
  choice: నన్ను అప్పగించవద్దు
  rationale: నָתַן అనే క్రియ, אַל అనే నిషేధ అవ్యయంతోను కర్మ ప్రత్యయంతోను కలిసి, మరొకరి అధికారానికి ‘అప్పగించవద్దు’ అనే భావాన్ని ఇస్తుంది.
- source_word: בְּנֶפֶשׁ
  choice: కోరికకు
  rationale: נֶפֶשׁ ఇక్కడ సంకుచితమైన ‘ఆత్మ’ భావంలో కాకుండా కోరిక, ఆకాంక్ష లేదా సంకల్పం అనే భావంలో వాడబడింది; సందర్భంలో ‘కోరికకు’ సహజంగా, శత్రువుల ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: צָרָי
  choice: నా విరోధుల
  rationale: ఈ పదం శత్రుత్వంతో ఎదిరించే వారిని సూచిస్తుంది; ‘విరోధులు’ న్యాయపరమైన మరియు హింసాత్మక నేపథ్యాలు రెండింటికీ సరిపోతుంది.
- source_word: קָמוּ בִי
  choice: నాపై లేచారు
  rationale: קוּם అనే క్రియ בְּతో వ్యక్తిని సూచించినప్పుడు సాధారణంగా ‘ఎదిరించి లేవడం’ అని అర్థం; తెలుగు కీర్తనాశైలిలో ‘నాపై లేచారు’ సహజంగా ఉంది.
- source_word: עֵדֵי שֶׁקֶר
  choice: అబద్ధ సాక్షులు
  rationale: ఇది అబద్ధంతో లక్షణీకరించబడిన సాక్షులను సూచించే నిర్మాణం; ‘అబద్ధ సాక్షులు’ సహజమైన న్యాయపరమైన సమానార్థకం.
- source_word: וִיפֵחַ חָמָס
  choice: వారు హింసను ఊదివిడుస్తున్నారు
  rationale: יפח ఊపిరితో బయటకు విడవడం లేదా పలకడం అనే సజీవ రూపకాన్ని కలిగి ఉంది. రూపంలో ఏకవచనం ఉన్నప్పటికీ, ముందున్న బహువచన సాక్షులను సమష్టిగా లేదా పంపిణీ భావంలో వర్ణించవచ్చు; ప్రధాన పాఠంలో సహజమైన బహువచనం ఉంచి, ఏకవచన అవకాశాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: חָמָס
  choice: హింస
  rationale: חָמָס హింస, క్రూరమైన అన్యాయం లేదా దౌర్జన్యాన్ని సూచిస్తుంది; ఇక్కడ ‘హింస’ బలమైన మరియు సూటి సమానార్థకం.
theological_decisions:
- issue: וִיפֵחַ అనే ఏకవచన రూపం మరియు עֵדֵי అనే బహువచన పదబంధం మధ్య సంబంధం
  choice: ప్రధాన పాఠంలో అబద్ధ సాక్షులనే సమష్టిగా సూచించే ‘వారు’ అని అనువదించడం
  alternative: ‘హింసను ఊదివిడిచేవాడొకడు’ లేదా ‘హింసను ఊదివిడిచే సాక్షి’ అని ప్రత్యేక ఏకవచన వ్యక్తిగా అనువదించడం
  rationale: హీబ్రూ వాక్యనిర్మాణం ఏకవచనాన్ని పంపిణీ లేదా సమష్టి భావంలో గ్రహించడానికి వీలు ఇస్తుంది, కానీ ప్రత్యేక వ్యక్తిని సూచించే అవకాశాన్ని పూర్తిగా తొలగించదు. అందువల్ల సహజమైన పఠనాన్ని ప్రధాన పాఠంలో, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనాత్మకమైన గౌరవభరిత శైలిని పాటించాం. ‘ఊదివిడుస్తున్నారు’ అనే వ్యక్తీకరణ మూలంలోని ఊపిరి-రూపకాన్ని నిలుపుతూ సాధారణ పాఠకునికి అర్థమయ్యేలా ఉంది. పాద విభజన కీర్తన యొక్క కవితాత్మక ప్రవాహాన్ని స్పష్టపరుస్తుంది.
