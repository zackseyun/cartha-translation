source:
  edition: WLC
  text: בִּ/קְרֹ֤ב עָלַ֨/י מְרֵעִים֮ לֶ/אֱכֹ֪ל אֶת בְּשָׂ֫רִ֥/י צָרַ֣/י וְ/אֹיְבַ֣/י לִ֑/י הֵ֖מָּה כָשְׁל֣וּ וְ/נָפָֽלוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/002.yaml
  text: When evildoers came near me to devour my flesh[b][a], my adversaries and my enemies—they stumbled and fell.
translation:
  language: te
  text: 'దుర్మార్గులు నా మాంసాన్ని మింగివేయడానికి[a] నాపైకి వచ్చినప్పుడు—

    నా విరోధులు, నా శత్రువులు—

    వారే తడబడి పడిపోయారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా మాంసాన్ని తినడానికి.’ ఇది హింసాత్మక దాడిని చిత్రించే స్పష్టమైన హీబ్రూ రూపకం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּקְרֹב עָלַי
  choice: నాపైకి వచ్చినప్పుడు
  rationale: בִּקְרֹב కాలసూచక భావాన్ని ‘వచ్చినప్పుడు’గా సహజంగా తెలియజేస్తుంది. עָלַי ఇక్కడ శత్రుత్వంతో సమీపించడాన్ని సూచిస్తుంది; ‘నాపైకి’ ఆ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: מְרֵעִים
  choice: దుర్మార్గులు
  rationale: చెడు చేసేవారిని సూచించే కృదంత రూపం. ‘దుర్మార్గులు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి నైతిక భావాన్ని నిలుపుతుంది.
- source_word: לֶאֱכֹל אֶת־בְּשָׂרִי
  choice: నా మాంసాన్ని మింగివేయడానికి
  rationale: హింసాత్మక దాడిని చిత్రించే స్పష్టమైన హీబ్రూ రూపకాన్ని నిలుపుతూ, ‘మింగివేయడానికి’ దాని క్రూరత్వాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది. అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: צָרַי וְאֹיְבַי לִי
  choice: నా విరోధులు, నా శత్రువులు
  rationale: రెండు సమాంతర శత్రుత్వ పదాలను వేర్వేరుగా నిలిపింది. לִי యొక్క వ్యతిరేక సంబంధం ‘నా’ అనే స్వామ్యరూపాల్లో తెలుగులో సహజంగా అంతర్భవిస్తుంది; అదనంగా ‘నాకు వ్యతిరేకంగా’ అనడం పునరుక్తిగా ఉంటుంది.
- source_word: הֵמָּה
  choice: వారే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగు ‘-ఏ’ ద్వారా స్పష్టంగా నిలిపింది.
- source_word: כָשְׁלוּ וְנָפָלוּ
  choice: తడబడి పడిపోయారు
  rationale: రెండు క్రియల క్రమాన్ని సహజ తెలుగులో నిలుపుతుంది; పతనం భౌతికమా, యుద్ధపరమా, రూపకమా అన్నది నిర్దిష్టం చేయదు.
