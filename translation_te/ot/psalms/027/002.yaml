translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. హీబ్రూ కవితా ఉద్ఘాటనను డాష్‌లు, పాద విభజన, ‘వారే’ ద్వారా నిలిపింది.
