  variant: modern standard Telugu
source:
  edition: WLC
  text: לְ/ךָ֤ אָמַ֣ר לִ֭בִּ/י בַּקְּשׁ֣וּ פָנָ֑/י אֶת פָּנֶ֖י/ךָ יְהוָ֣ה אֲבַקֵּֽשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/008.yaml
  text: On your behalf my heart says[a], “Seek my face.” Your face, Yahweh[c][b], I seek.
translation:
  language: te
  text: 'నీ తరఫున నా హృదయం ఇలా అంటోంది[a]: “నా ముఖాన్ని వెదకండి.” యాహ్వే, నీ ముఖాన్నే[b] నేను వెదుకుతున్నాను[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ ఆరంభ భాగం క్లిష్టమైనది. దీనిని “నీతో నా హృదయం అంటోంది” అని, లేదా కొద్దిగా భిన్నంగా అన్వయించి “నీ గురించి నా హృదయం, ‘ఆయన ముఖాన్ని వెదకండి’ అంటోంది” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా “నీ సన్నిధినే.” హీబ్రూలో “ముఖం” అనే పదం తరచుగా వ్యక్తిగత సన్నిధిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా “నేను వెదుకుతాను.” హీబ్రూ క్రియ ప్రస్తుత సంకల్పాన్ని గానీ భవిష్యత్ ఉద్దేశాన్ని గానీ వ్యక్తం చేయగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ אָמַר לִבִּי
  choice: నీ తరఫున నా హృదయం ఇలా అంటోంది
  rationale: హీబ్రూ ఆరంభ వాక్యనిర్మాణం క్లిష్టమైనది. לְךָ యొక్క దత్తి/సంబంధ భావాన్ని ‘నీ తరఫున’ అని చూపిస్తూ, హృదయం దేవుని పిలుపును పలుకుతున్న భావాన్ని నిలుపుతుంది; ఇతర సాధ్యమైన అన్వయాలను పాదసూచికలో ఉంచాం.
- source_word: בַּקְּשׁוּ
  choice: వెదకండి
  rationale: ఇది בקשׁ ధాతువు యొక్క బహువచన ఆజ్ఞారూపం. ఆధునిక ప్రామాణిక తెలుగులో ఆజ్ఞను సహజంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: פָנָי / פָּנֶיךָ
  choice: నా ముఖాన్ని / నీ ముఖాన్ని
  rationale: ఒకే హీబ్రూ నామపదం పునరావృతాన్ని, వ్యక్తిగత సన్నిధి అనే సంబంధాత్మక చిత్రాన్ని కాపాడటానికి ‘ముఖం’ అనే అక్షరార్థాన్ని ప్రధాన పాఠ్యంలో ఉంచాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన లిప్యంతరీకరణతో అందించాం.
- source_word: אֲבַקֵּשׁ
  choice: నేను వెదుకుతున్నాను
  rationale: మొదటి పురుష ఏకవచన అసంపూర్ణ క్రియ ఇక్కడ ప్రస్తుత సంకల్పాన్ని లేదా భవిష్యత్ ఉద్దేశాన్ని సూచించగలదు. ప్రధాన పాఠ్యంలో తక్షణ ప్రతిస్పందనను చూపే ప్రస్తుత భావాన్ని ఎంచుకుని, భవిష్యత్ భావాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. అందువల్ల బిరుదైన ‘ప్రభువు’తో మార్చకుండా దైవనామాన్ని లిప్యంతరీకరించాం.
- issue: לְךָ אָמַר לִבִּי అనే క్లిష్టమైన ఆరంభ భాగం
  choice: 'నీ తరఫున నా హృదయం ఇలా అంటోంది: ‘నా ముఖాన్ని వెదకండి’'
  alternative: ‘నీతో నా హృదయం అంటోంది’ లేదా ‘నీ గురించి నా హృదయం, “ఆయన ముఖాన్ని వెదకండి” అంటోంది’
  rationale: మసొరేటిక్ పాఠాన్ని సవరించకుండా దాని అసాధారణ వాక్యనిర్మాణాన్ని గౌరవించాం. దేవుని పిలుపు కీర్తనకర్త హృదయంలో ప్రతిధ్వనిస్తున్న అన్వయాన్ని ప్రధాన పాఠ్యంలో తీసుకుని, నిజమైన వ్యాకరణ సందిగ్ధతను పాదసూచికలో ఉంచాం.
- issue: ‘ముఖం’ అనే పదంలోని భావం
  choice: ముఖం
  alternative: సన్నిధి
  rationale: ‘సన్నిధి’ సందర్భానుకూల భావమే అయినప్పటికీ, రెండు పాదాల్లోని పదపునరావృతం మరియు దేవునితో ప్రత్యక్ష సంబంధాన్ని సూచించే రూపకాన్ని నిలుపుటకు ‘ముఖం’ ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తన కవిత్వానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘ముఖం’ పదపునరావృతాన్ని నిలిపి, క్లిష్టమైన హీబ్రూ వాక్యనిర్మాణాన్ని అతిగా సులభీకరించకుండా పాదసూచికలతో స్పష్టం చేశాం.
