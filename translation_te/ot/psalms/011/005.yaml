lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణగా ఉంచింది.
- source_word: צַדִּיק
  choice: నీతిమంతుణ్ణి
  rationale: ఇక్కడ విశేషణం వ్యక్తిని సూచించే నామవాచకార్థంలో, ఏకవచన సాధారణ ప్రతినిధిగా ఉంది.
- source_word: יִבְחָן
  choice: పరీక్షిస్తాడు
  rationale: בחן లోని పరిశీలించి నిజస్థితిని నిర్ధారించే భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; కేవలం చూడటం లేదా శిక్షించడం అనే భావాన్ని జోడించదు.
- source_word: וְרָשָׁע
  choice: దుష్టుణ్ణి
  rationale: నైతికంగా చెడ్డవాడిని సూచించే నామవాచకార్థ విశేషణాన్ని, మూలంలోని ఏకవచన సాధారణ భావంతో నిలుపుతుంది.
- source_word: וְאֹהֵב חָמָס
  choice: హింసను ప్రేమించేవాణ్ణి
  rationale: కృదంత రూపంలోని అలవాటైన లేదా స్వభావసిద్ధమైన ప్రేమ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: חָמָס
  choice: హింస
  rationale: ఈ సందర్భంలో శారీరక హింసతో పాటు హింసాత్మక అన్యాయాన్నీ సూచించగల మూలపదానికి నేరమైన సమానార్థకం.
- source_word: שָׂנְאָה נַפְשׁוֹ
  choice: ఆయన ప్రాణం ద్వేషిస్తుంది
  rationale: అక్షరార్థంగా ఉన్న ‘ఆయన ప్రాణం ద్వేషిస్తుంది’ అనే హెబ్రీ తీవ్రతను నిలుపుతూ, దేవుని అంతరంగపూర్వకమైన అసహ్యాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: చివరి ఉపవాక్యంలో ‘ఆయన ప్రాణం’ అనే మాటకు సూచ్యము మరియు బలం
  choice: ‘ఆయన ప్రాణం’ యెహోవానే సూచిస్తూ, ఆయన లోతైన వ్యక్తిగత అసహ్యాన్ని బలంగా వ్యక్తం చేస్తుంది
  alternative: సహజత కోసం ‘ఆయన ద్వేషిస్తాడు’ అని సరళీకరించడం
  rationale: נפש అనే ముఖ్యమైన మూలపదాన్ని తొలగించకుండా, దేవునికి సంబంధించి వచనం ఉపయోగించిన మానవరూప వర్ణననూ దాని ధార్మిక ఉద్రిక్తతనూ నిలుపుతుంది.
- issue: ద్వేషానికి గురయ్యే కర్మల నిర్మాణం
  choice: దుష్టుణ్ణీ, హింసను ప్రేమించేవాణ్ణీ—ఇద్దరినీ ‘ద్వేషిస్తుంది’ అనే క్రియకు కర్మలుగా చూపడం
  alternative: ‘దుష్టుడు హింసను ప్రేమిస్తాడు’ అన్నట్లుగా రెండింటినీ ఒకే వ్యక్తి వర్ణనగా కలపడం
  rationale: హెబ్రీ సమన్వయ నిర్మాణం దుష్టుడిని మరియు హింసను ప్రేమించేవాడిని సమాంతర కర్మలుగా చదవడానికి బలంగా అనుకూలిస్తుంది; వారిద్దరూ ఒకే వర్గానికి చెందినవారై ఉండగల అవకాశాన్ని మాత్రం ఇది నిరాకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైనదిగా, అయినా కీర్తనకు తగిన గంభీరతతో ఉంది. మూలంలోని ఏకవచన సాధారణ వ్యక్తులను మరియు ‘ఆయన ప్రాణం’ అనే ఉద్దేశపూర్వక తీవ్రతను నిలిపింది.
