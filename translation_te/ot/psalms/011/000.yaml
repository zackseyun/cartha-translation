source:
  edition: WLC
  text: לַ/מְנַצֵּ֗חַ לְ/דָ֫וִ֥ד בַּֽ/יהוָ֨ה חָסִ֗יתִי אֵ֭יךְ תֹּאמְר֣וּ לְ/נַפְשִׁ֑/י נודו הַרְ/כֶ֥ם צִפּֽוֹר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/000.yaml
  text: For the choirmaster[a]. Of David. In Yahweh I take refuge; how can you say to my soul, “Flee to your mountain[b], bird” ?
translation:
  language: te
  text: 'గాననాయకునికి. దావీదుది.


    యెహోవాలో నేను ఆశ్రయం పొందాను.


    అయితే మీరు నన్ను,


    “మీ పర్వతానికి పారిపోండి, పక్షీ!”[a]


    అని ఎలా అంటారు?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీ వాక్యం క్లిష్టంగా ఉంది: “మీ పర్వతానికి పారిపోండి, పక్షీ.” దీనిని “పక్షీ, మీ పర్వతానికి పారిపోండి” అనీ, లేదా “పక్షిలా మీ పర్వతానికి పారిపోండి” అనీ అర్థం చేసుకోవచ్చు. హెబ్రీలో ఆజ్ఞ బహువచనంలో ఉండగా “పక్షి” ఏకవచనంలో ఉంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: గాననాయకునికి
  rationale: కీర్తనల శీర్షికలో సంగీత ప్రదర్శనను నడిపించే వ్యక్తిని సూచించే పదంగా సందర్భానుకూలంగా, ఆధునిక పాఠకులకు స్పష్టంగా అనువదించబడింది.
- source_word: בַיהוָה
  choice: యెహోవాలో
  rationale: దైవనామమైన יהוהను సాధారణ బిరుదుతో భర్తీ చేయకుండా ‘యెహోవా’గా ఉంచి, בְ ఉపసర్గను ‘లో’తో వ్యక్తం చేసింది.
- source_word: חָסִיתִי
  choice: నేను ఆశ్రయం పొందాను
  rationale: ఈ క్రియలోని రక్షణ కోసం ఒకరివద్ద శరణు పొందడం అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; హెబ్రీ పరిపూర్ణ క్రియకు సందర్భంలో వర్తమాన ప్రాముఖ్యత ఉంది.
- source_word: לְנַפְשִׁי
  choice: నాతో
  rationale: ‘నా ప్రాణంతో/నా ఆత్మతో’ అనే అక్షరార్థం తెలుగులో అసహజంగా ఉండటంతో, వ్యక్తినే సూచించే హెబ్రీ ప్రయోగాన్ని సహజంగా ‘నాతో’ అని ఇచ్చి అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: נודו הַרְכֶם צִפּוֹר
  choice: మీ పర్వతానికి పారిపోండి, పక్షీ!
  rationale: కఠినమైన హెబ్రీ పదక్రమాన్ని, బహువచన ఆజ్ఞను, చివరనున్న ఏకవచన ‘పక్షి’ని సాధ్యమైనంత వరకు అలాగే ఉంచి, దాని అనిశ్చితిని పాదటిప్పణిలో వివరించింది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న ప్రత్యేక దైవనామాన్ని బిరుదుగా మార్చకుండా స్పష్టంగా ప్రతిబింబిస్తుంది.
- issue: חָסִיתִי యొక్క కాలసూచన
  choice: నేను ఆశ్రయం పొందాను
  alternative: నేను ఆశ్రయించాను / నేను ఆశ్రయం పొందుతున్నాను
  rationale: హెబ్రీ పరిపూర్ణ రూపాన్ని గౌరవిస్తూ, అది సూచించే కొనసాగుతున్న నమ్మకాన్ని అనవసరంగా ఒకే కాలవ్యాఖ్యకు పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించింది. శీర్షికను సంక్షిప్తంగా ఉంచింది. కఠినమైన చివరి హెబ్రీ పదబంధాన్ని ప్రధాన పాఠ్యంలో పూర్తిగా సాఫీ చేసి దాని సందిగ్ధతను తొలగించకుండా, పాదటిప్పణిలో ప్రత్యామ్నాయ నిర్మాణాలను నమోదు చేసింది.
