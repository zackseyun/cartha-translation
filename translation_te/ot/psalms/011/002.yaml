revisions:
- from: ఎందుకంటే, ఇదిగో, దుష్టులు విల్లు ఎక్కుపెడుతున్నారు; హృదయంలో యథార్థంగా ఉన్నవారిని చీకటిలోనుండి[a] బాణంతో కొట్టడానికి, వారు తమ బాణాన్ని వింటినారిపై సిద్ధంగా ఉంచారు.
  to: ఎందుకంటే, ఇదిగో, దుష్టులు విల్లు ఎక్కుపెడుతున్నారు; యథార్థ హృదయులపై చీకటిలో[a] బాణం వేయడానికి వారు తమ బాణాన్ని విల్లుతీగపై అమర్చారు.
  rationale: 'The revision preserves the Hebrew’s vivid threat, the singular collective “arrow,” and the debated spatial nuance of בְּמוֹ אֹפֶל. It also makes the bow-and-arrow sequence explicit: bending the bow, setting the arrow on its string, and shooting at the upright in heart.'
  reviewer_model: gpt-5.6-terra
