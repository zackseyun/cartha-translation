source:
  edition: WLC
  text: כִּ֤י הִנֵּ֪ה הָ/רְשָׁעִ֡ים יִדְרְכ֬וּ/ן קֶ֗שֶׁת כּוֹנְנ֣וּ חִצָּ֣/ם עַל יֶ֑תֶר לִ/יר֥וֹת בְּמוֹ אֹ֝֗פֶל לְ/יִשְׁרֵי לֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/002.yaml
  text: For look[a], the wicked bend the bow; they have fitted their arrow to the string to shoot in the darkness at the upright in heart.
translation:
  language: te
  text: ఎందుకంటే, ఇదిగో, దుష్టులు విల్లు ఎక్కుపెడుతున్నారు; యథార్థ హృదయులపై చీకటిలో[a] బాణం వేయడానికి వారు తమ బాణాన్ని విల్లుతీగపై అమర్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చీకటిలోనుండి.’ హీబ్రూ పదబంధం దాడి జరిగే చీకటి పరిస్థితినిగానీ, దాడి ప్రారంభమయ్యే దాగిన స్థలాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని తెలిపే అనుసంధానాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: సమీపిస్తున్న ప్రమాదంపై శ్రద్ధను ఆకర్షించే హీబ్రూ సూచనాత్మక అవ్యయపు సజీవతను కాపాడుతుంది.
- source_word: הָרְשָׁעִים
  choice: దుష్టులు
  rationale: కీర్తనలలో నైతికంగా చెడ్డ ప్రత్యర్థులను సూచించే רְשָׁעִים పదానికి స్థిరమైన, సహజమైన తెలుగు సమానం.
- source_word: יִדְרְכוּן קֶשֶׁת
  choice: విల్లు ఎక్కుపెడుతున్నారు
  rationale: విల్లును వంచి ప్రయోగానికి సిద్ధం చేసే హీబ్రూ నానుడిని సహజమైన తెలుగు విలువిద్యా ప్రయోగంతో తెలియజేస్తుంది.
- source_word: כּוֹנְנוּ חִצָּם עַל יֶתֶר
  choice: తమ బాణాన్ని వింటినారిపై సిద్ధంగా ఉంచారు
  rationale: ఏకవచన బాణాన్ని నిలుపుతూ, దానిని వింటినారిపై అమర్చి ప్రయోగానికి సిద్ధం చేసిన దృశ్యాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לִירוֹת
  choice: బాణంతో కొట్టడానికి
  rationale: విలువిద్య సందర్భంలోని ‘ప్రయోగించడం/కొట్టడం’ అనే ఉద్దేశాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּמוֹ אֹפֶל
  choice: చీకటిలోనుండి
  rationale: దాడి దాగిన చోటు నుంచి జరుగుతుందనే సాధ్యమైన భావాన్ని ప్రధాన పాఠ్యంలో ప్రతిబింబిస్తుంది; చీకటి పరిస్థితిలో దాడి అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: לְיִשְׁרֵי לֵב
  choice: హృదయంలో యథార్థంగా ఉన్నవారు
  rationale: అంతరంగ నైతిక నిష్కపటతను సూచించే హీబ్రూ భావాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
