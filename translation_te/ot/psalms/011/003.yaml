  text: If the foundations are destroyed[a], what can the righteous do?
translation:
  language: te
  text: పునాదులు కూల్చివేయబడితే[a], నీతిమంతుడు ఏమి చేయగలడు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకంటే పునాదులు కూల్చివేయబడుతున్నాయి; నీతిమంతుడు ఏమి చేశాడు?” హీబ్రూలో చివరి క్రియను రూపపరంగా భూతకాల భావంతో అనువదించవచ్చు; అయితే సందర్భంలో “నీతిమంతుడు ఏమి చేయగలడు?” అనే భావం సాధారణంగా తీసుకోబడుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: కూలగొట్టబడితే
  rationale: כִּי సాధారణంగా ‘ఎందుకంటే’ అని అర్థమివ్వగలిగినా, ఇక్కడ తరువాతి అలంకార ప్రశ్నతో కలిసి షరతు భావాన్ని సహజంగా ఇస్తుంది; అందువల్ల ‘-తే’ రూపం వాడబడింది.
- source_word: הַשָּׁתוֹת
  choice: పునాదులు
  rationale: మూలపదంలోని స్పష్టమైన నిర్మాణ రూపకాన్ని నిలుపుతుంది; సామాజిక, నైతిక లేదా న్యాయవ్యవస్థలలో ఏదో ఒకదానిగా అర్థాన్ని పరిమితం చేయదు.
- source_word: יֵהָרֵסוּן
  choice: కూలగొట్టబడితే
  rationale: הרס నిఫ్అల్ రూపంలోని నిష్క్రియ భావాన్ని తెలుగులో స్పష్టంగా నిలుపుతూ, పునాదులను పడగొట్టడం అనే చిత్రాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: צַדִּיק
  choice: నీతిమంతుడు
  rationale: ఏకవచన ప్రతినిధి భావాన్ని నిలుపుతుంది; ఆధునిక ప్రామాణిక తెలుగులో సాధారణంగా అర్థమయ్యే గౌరవప్రదమైన పదం.
- source_word: מַה
  choice: ఏమి
  rationale: అలంకార ప్రశ్నను నేరుగా, విస్తరణ లేకుండా పరిచయం చేస్తుంది.
- source_word: פָּעָל
  choice: చేయగలడు
  rationale: రూపపరంగా ఇది ఖతల్ (‘చేశాడు/ఏమి చేశాడు’) అయినా, సందర్భంలోని అలంకార ప్రశ్న ఆ పరిస్థితిలో నీతిమంతునికి ఏమి సాధ్యమనే భావాన్ని సూచిస్తుంది. తెలుగు ప్రధాన పాఠంలో ‘చేయగలడు’ ఆ భావాన్ని సహజంగా అందిస్తుంది; రూపపరమైన భూతకాల పఠనం పాదసూచికలో నిలుపబడింది.
theological_decisions:
- issue: ‘పునాదులు’ అనే రూపకపు పరిధి
  choice: రూపకాన్ని ‘పునాదులు’గానే ఉంచి, దాని సూచనను నిర్దిష్టంగా నిర్వచించలేదు.
  alternative: దాన్ని సమాజపు పునాదులు, న్యాయపు పునాదులు లేదా నైతిక వ్యవస్థగా స్పష్టీకరించడం.
  rationale: హీబ్రూ రూపకం విస్తృతంగా, ఉద్దేశపూర్వకంగా తెరిచి ఉంది. ఒక నిర్దిష్ట సామాజిక లేదా సిద్ధాంతపరమైన అర్థాన్ని అనువాదంలో చేర్చకుండా ఆ భావవిస్తృతిని కాపాడుతుంది.
- issue: פָּעָל యొక్క కాలం మరియు ప్రశ్న భావం
  choice: సందర్భానుగుణ సామర్థ్య ప్రశ్నగా ‘ఏమి చేయగలడు?’
  alternative: రూపపరమైన భూతకాల పఠనంగా ‘నీతిమంతుడు ఏమి చేశాడు?’
  rationale: ఖతల్ రూపం భూతకాల పఠనాన్ని అనుమతించినప్పటికీ, కీర్తన సందర్భంలో ముందున్న షరతుకు ప్రతిస్పందించే ఆచరణాత్మక అసమర్థత ప్రశ్న సాధారణంగా బలంగా ఉంటుంది. అయినా నిజమైన వ్యాకరణ సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా కవితాత్మక గంభీరతను నిలుపుతూ అనువదించబడింది. ‘పునాదులే’లోని ‘ఏ’ ముందుగా ఉంచిన మూలాధారాలే కూలిపోతున్నాయనే వాక్యబలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
