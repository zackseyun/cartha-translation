id: PSA.11.1
reference: Psalms 11:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לַ/מְנַצֵּ֗חַ לְ/דָ֫וִ֥ד בַּֽ/יהוָ֨ה חָסִ֗יתִי אֵ֭יךְ תֹּאמְר֣וּ לְ/נַפְשִׁ֑/י נודו הַרְ/כֶ֥ם צִפּֽוֹר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/001.yaml
  text: For the choirmaster. Of David. In the LORD I have taken refuge; how can you say to me, “Flee to your mountain like a bird”?
translation:
  language: te
  text: 'సంగీత నాయకునికి. దావీదుది.

    నేను యెహోవాను ఆశ్రయించాను;

    అయితే మీరు నాతో,

    “పక్షిలా నీ కొండకు పారిపో”[a] అని ఎలా అంటారు?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వాక్యభాగపు హెబ్రీ పాఠంలో సంఖ్య, సర్వనామం విషయంలో క్లిష్టత ఉంది. వ్రాయబడిన రూపాన్ని ‘మీ కొండకు పారిపోండి’ అని కూడా చదవవచ్చు; సంప్రదాయ పఠనం ‘నీ కొండకు పారిపో’ అనే ఏకవచనాన్ని సూచిస్తుంది. ‘పక్షీ’ అని నేరుగా సంబోధించినట్లుగానూ అర్థం చేసుకోవచ్చు.
    reason: కెతీవ్–కెరే భేదాన్ని, అలాగే ‘పక్షి’ అనే పదం పోలికా లేక సంబోధనా అనే నిజమైన మూలపాఠ అస్పష్టతను వెల్లడిస్తుంది.
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకునికి
  rationale: కీర్తన ప్రదర్శనను నడిపించే వ్యక్తిని సూచించే శీర్షికగా సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: לְדָוִד
  choice: దావీదుది
  rationale: ‘దావీదుకు సంబంధించినది/దావీదుచే’ అనే హెబ్రీ శీర్షికలోని సంక్షిప్తతను, రచయితత్వాన్ని మించిన నిర్దిష్టతను చేర్చకుండా నిలుపుతుంది.
- source_word: בַּיהוָה חָסִיתִי
  choice: నేను యెహోవాను ఆశ్రయించాను
  rationale: חסה అనే క్రియలోని రక్షణ కోసం ఆశ్రయం పొందే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది; יהוה అనే ప్రత్యేక దైవనామాన్ని ‘యెహోవా’గా చూపుతుంది.
- source_word: לְנַפְשִׁי
  choice: నాతో
  rationale: అక్షరార్థంగా ‘నా ప్రాణంతో/నా ఆత్మతో’; ఈ సందర్భంలో మొత్తం వ్యక్తిని సూచించే హెబ్రీ ప్రయోగం కాబట్టి తెలుగులో సహజమైన ‘నాతో’ ఎంచుకున్నాం.
- source_word: צִפּוֹר
  choice: పక్షిలా
  rationale: హెబ్రీలో పోలికను తెలిపే ప్రత్యేక అవ్యయం లేకపోయినా, సందర్భంలో పక్షి పారిపోవడాన్ని పోలికగా గ్రహించే సాంప్రదాయ వ్యాఖ్యానాన్ని సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יהוה దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో సాధారణ బిరుదు కాక ప్రత్యేక నామం ఉన్నందున దానిని తెలుగు లిప్యంతరీకరణతో నిలిపాం.
- issue: לְדָוִד యొక్క సంబంధం
  choice: దావీదుది
  alternative: దావీదు రచించినది
  rationale: హెబ్రీ ఉపసర్గ రచయితత్వాన్ని సూచించగలిగినా, అంకితం లేదా సంబంధం అనే విస్తృత భావాన్నీ అనుమతిస్తుంది; అందువల్ల మరింత నిర్దిష్టమైన వాదన చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గౌరవభరితమైన కానీ సాధారణ పాఠకులకు స్పష్టమైన శైలిని వాడాం. ప్రశ్నలోని ధిక్కారభావాన్ని ‘అయితే… ఎలా అంటారు?’ ద్వారా నిలిపాం.
