  yaml_path: translation/ot/psalms/011/006.yaml
  text: He will rain down traps on the wicked; fire and sulfur and a scorching wind will be the portion of their cup.
translation:
  language: te
  text: 'దుష్టుల మీద ఆయన ఉచ్చులను కురిపిస్తాడు;

    అగ్ని, గంధకం, మండించే గాలి వారి పాత్రలోని భాగం.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּחִים
  choice: ఉచ్చులను
  rationale: ఈ బహువచన నామవాచకం పక్షులను లేదా మనుషులను పట్టే ఉచ్చులు/వలలను సూచిస్తుంది. సందర్భంలోని దైవిక తీర్పు చిత్రణను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: גָפְרִית
  choice: గంధకం
  rationale: అగ్నితో కలిసి ప్రస్తావించబడే sulfur/brimstone‌కు ఆధునిక ప్రామాణిక తెలుగు పదం.
- source_word: רוּחַ זִלְעָפוֹת
  choice: మండించే గాలి
  rationale: זִלְעָפוֹת తీవ్రంగా దహించే లేదా ఉక్కిరిబిక్కిరి చేసే వేడిని సూచిస్తుంది; ‘మండించే గాలి’ మూలంలోని తీవ్రతను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מְנָת כּוֹסָם
  choice: వారి పాత్రలో వారికి దక్కే వంతు
  rationale: ‘వారి పాత్ర యొక్క భాగం’ అనే హీబ్రూ రూపకాన్ని కాపాడుతూ, అది వారికి కేటాయించబడిన తీర్పు అని తెలుగులో గ్రాహ్యంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: దైవిక తీర్పును వర్షంగా కురిపించే రూపకం
  choice: ‘ఉచ్చులను వర్షంలా కురిపిస్తాడు’ అని ప్రత్యక్ష దైవిక చర్యగా ఉంచడం
  alternative: ‘ఉచ్చులు వారి మీద వర్షిస్తాయి’ లేదా రూపకాన్ని సాధారణ శిక్షగా మార్చడం
  rationale: יַמְטֵר అనే కర్తృవాచక క్రియ దేవుడే తీర్పును అమలు చేస్తున్నాడని చెబుతుంది; మూలంలోని కఠినమైన తీర్పు చిత్రణను మృదువుపరచలేదు.
- issue: ‘పాత్రలో వంతు’ అనే తీర్పు రూపకం
  choice: పాత్ర మరియు కేటాయించబడిన వంతు రెండింటినీ నిలుపడం
  alternative: ‘ఇదే వారి శిక్ష’ అని రూపకాన్ని తొలగించడం
  rationale: కీర్తనలలో పాత్ర ఒకరికి దేవుని చేత దక్కే భాగం లేదా అనుభవానికి రూపకం; దాని భావసాంద్రతను నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలి. మొదటి పాదంలోని వర్ష రూపకాన్ని ‘వర్షంలా’తో సహజీకరించి, రెండో పాదంలో మూలంలోని తీర్పు జాబితా మరియు పాత్ర రూపకాన్ని కాపాడాం.
