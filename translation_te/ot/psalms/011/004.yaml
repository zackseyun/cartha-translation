source:
  edition: WLC
  text: יְהוָ֤ה בְּֽ/הֵ֘יכַ֤ל קָדְשׁ֗/וֹ יְהוָה֮ בַּ/שָּׁמַ֪יִם כִּ֫סְא֥/וֹ עֵינָ֥י/ו יֶחֱז֑וּ עַפְעַפָּ֥י/ו יִ֝בְחֲנ֗וּ בְּנֵ֣י אָדָֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/004.yaml
  text: Yahweh is in his holy temple[a]; Yahweh—his throne is in heaven. His eyes see[d][c][b]; his eyelids examine the children of man.
translation:
  language: te
  text: యాహ్వే తన పవిత్ర మందిరంలో ఉన్నాడు; యాహ్వే సింహాసనం ఆకాశంలో ఉంది. ఆయన కళ్లు చూస్తాయి; ఆయన కనురెప్పలు మానవులను పరిశీలిస్తాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మనిషి కుమారులను”; లేదా “మనుష్యుల పిల్లలను.” ఇక్కడ సమస్త మానవులనే సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: בְּהֵיכַל קָדְשׁוֹ
  choice: తన పవిత్ర మందిరంలో
  rationale: הֵיכָל అనే పదానికి ‘రాజభవనం’ లేదా ‘మందిరం’ అనే అర్థాలు సాధ్యమైనా, పవిత్రత మరియు పరలోక సింహాసన సమాంతరత దృష్ట్యా ‘పవిత్ర మందిరం’ సహజంగా సరిపోతుంది; అది భూలోక మందిరమే అని పరిమితం చేయదు.
- source_word: בַּשָּׁמַיִם כִּסְאוֹ
  choice: ఆయన సింహాసనం ఆకాశంలో ఉంది
  rationale: హీబ్రూ పదక్రమంలోని ముందుంచిన దైవనామం మరియు దాని తరువాతి ప్రకటనను డాష్‌తో నిలిపి, తెలుగులో స్పష్టమైన స్థానార్థాన్ని ఇచ్చాం.
- source_word: עֵינָיו יֶחֱזוּ
  choice: ఆయన కళ్ళు చూస్తాయి
  rationale: חזה యొక్క ప్రత్యక్షమైన ‘చూచు’ భావాన్ని సరళమైన ఆధునిక తెలుగులో ఉంచి, కవితాత్మక మానవరూప వర్ణనను నిలిపాం.
- source_word: עַפְעַפָּיו יִבְחֲנוּ
  choice: ఆయన కనురెప్పలు పరిశీలిస్తాయి
  rationale: ‘కనురెప్పలు’ అనే మూలచిత్రాన్ని సడలించకుండా ఉంచాం; בחן లోని పరీక్షించడం/పరిశీలించడం భావానికి సందర్భానుకూలంగా ‘పరిశీలిస్తాయి’ ఎంచుకున్నాం.
- source_word: בְּנֵי אָדָם
  choice: మానవులను
  rationale: అక్షరార్థంగా ‘ఆదాము కుమారులు/మనుష్యుని పిల్లలు’; ఇక్కడ సమస్త మానవుల సమూహార్థం ఉన్నందున సహజమైన, లింగసమగ్ర తెలుగు ‘మానవులను’ వాడాం.
theological_decisions:
- issue: దేవుని నివాసస్థల చిత్రణ
  choice: యెహోవా తన పవిత్ర మందిరంలో ఉన్నాడనీ, ఆయన సింహాసనం ఆకాశంలో ఉందనీ రెండు ప్రకటనలనూ పక్కపక్కనే నిలిపాం.
  alternative: ‘పవిత్ర మందిరం’ను భూలోక మందిరానికి మాత్రమే లేదా ఆకాశానికి పర్యాయంగా మాత్రమే వ్యాఖ్యానించడం.
  rationale: హీబ్రూ వచనం రెండు చిత్రాలను సమన్వయ వివరణ లేకుండా కలిపి ఉంచుతుంది; అనువాదం ఆ కవితాత్మక ఉద్వేగాన్ని పరిష్కరించకుండా కాపాడుతుంది.
- issue: בְּנֵי אָדָם యొక్క సమూహార్థం
  choice: మానవులను
  alternative: మనుష్యుని కుమారులను
  rationale: మూలంలోని కుటుంబరూప నుడికారాన్ని అక్షరాలా తెలుగులో పెట్టడం అసహజంగా, పురుషులకు మాత్రమే పరిమితమైనట్టుగా వినిపించవచ్చు. సందర్భంలోని సమస్త మానవుల భావాన్ని ‘మానవులను’ స్పష్టంగా అందిస్తుంది; అక్షరార్థం పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కవితా శైలిని అనుసరించాం. ‘కళ్ళు—కనురెప్పలు’ అనే హీబ్రూ సమాంతర మానవరూప చిత్రణను నిలిపాం; పునరుక్త దైవనామం మరియు ‘యెహోవా—ఆయన సింహాసనం’ నిర్మాణాన్ని కూడా సాధ్యమైనంతవరకు కాపాడాం.
