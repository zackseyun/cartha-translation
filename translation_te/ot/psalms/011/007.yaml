source:
  edition: WLC
  text: כִּֽי צַדִּ֣יק יְ֭הוָה צְדָק֣וֹת אָהֵ֑ב יָ֝שָׁ֗ר יֶחֱז֥וּ פָנֵֽי/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/007.yaml
  text: For Yahweh is righteous[a]; he loves righteous deeds[b]; the upright will behold his face.
translation:
  language: te
  text: 'ఎందుకంటే యెహోవా నీతిమంతుడు;

    ఆయన నీతి కార్యాలను ప్రేమిస్తాడు;

    యథార్థులు ఆయన ముఖాన్ని[a] చూస్తారు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఆయన ముఖం.’ ఈ పదబంధం ఆయన సన్నిధిని లేదా అనుగ్రహాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: మరో విధంగా, అయితే తక్కువ సంభావ్యతతో, ‘ఆయన ముఖం యథార్థులను చూస్తుంది’ అని అనువదించవచ్చు. చివరి వాక్యభాగంలోని హెబ్రీయ వాక్యనిర్మాణాన్ని ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకున్నారు.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని తెలిపే అనుసంధానాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: צַדִּיק
  choice: నీతిమంతుడు
  rationale: యెహోవా నైతికంగా న్యాయమైనవాడని తెలియజేస్తూ, ఇదే వాక్యంలోని צְדָקוֹתతో ఉన్న మూలపద సంబంధాన్ని ‘నీతి’ ద్వారా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో ప్రతిబింబిస్తుంది.
- source_word: צְדָקוֹת
  choice: నీతి కార్యాలు
  rationale: బహువచన నామవాచకం ఇక్కడ అమూర్తమైన గుణం కంటే ఆచరణలోని నీతికార్యాలను సూచిస్తుంది; ‘నీతిమంతుడు’తో పదసంబంధాన్నీ నిలుపుతుంది.
- source_word: אָהֵב
  choice: ప్రేమిస్తాడు
  rationale: యెహోవా యొక్క స్థిరమైన వైఖరిని సరళంగా, నేరుగా తెలియజేస్తుంది.
- source_word: יָשָׁר
  choice: యథార్థులు
  rationale: నైతికంగా నేరుగా నడిచేవారిని సూచించే విశేషణాన్ని, తరువాతి బహువచన క్రియకు అనుగుణంగా సమూహార్థక బహువచనంగా అందిస్తుంది.
- source_word: יֶחֱזוּ
  choice: చూస్తారు
  rationale: ‘చూచుట/దర్శించుట’ అనే భావాన్ని ఆధునిక పాఠకులకు సహజంగా అందిస్తూ, హెబ్రీయ క్రియలోని ప్రత్యక్ష దర్శన భావాన్ని నిలుపుతుంది.
- source_word: פָנֵימוֹ
  choice: ఆయన ముఖాన్ని
  rationale: ‘ఆయన ముఖం’ అనే స్పష్టమైన హెబ్రీయ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; ‘సన్నిధి’ లేదా ‘అనుగ్రహం’ అనే భావవ్యాప్తిని పాదసూచికలో ఉంచుతుంది.
theological_decisions:
- issue: చివరి వాక్యభాగంలోని కర్త-కర్మ సంబంధం
  choice: యథార్థులు ఆయన ముఖాన్ని చూస్తారు
  alternative: ఆయన ముఖం యథార్థులను చూస్తుంది
  rationale: יֶחֱזוּ అనే బహువచన క్రియను బట్టి יָשָׁרను సమూహార్థక కర్తగా తీసుకోవడం సహజం; దేవుని ముఖాన్ని చూడడం అనే బైబిలీయ ప్రయోగానికీ ఇది సరిపోతుంది. అయినా హెబ్రీయ వాక్యనిర్మాణాన్ని మరో విధంగా అర్థం చేసుకునే అవకాశం ఉన్నందున ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరచాం.
- issue: ‘ముఖం’ అనే పదబంధపు భావం
  choice: ప్రధాన పాఠ్యంలో అక్షరార్థమైన ‘ముఖం’
  alternative: సన్నిధి లేదా అనుగ్రహం
  rationale: స్పష్టమైన శరీరరూపకాన్ని తొలగించకుండా ఉంచడం మూలపాఠ్యానికి దగ్గరగా ఉంటుంది; దాని విస్తృత భావాన్ని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తనకు తగిన గౌరవప్రదమైన శైలిని వాడాం. ‘ఎందుకనగా,’ ‘ముఖదర్శనం చేసెదరు’ వంటి పాత రూపాలను నివారించాం; మూలంలోని మూడు సమాంతర వాక్యభాగాలను పంక్తి విభజనతో నిలిపాం.
