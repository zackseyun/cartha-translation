  text: Good and upright is Yahweh[a]; therefore he instructs sinners in the way.
translation:
  language: te
  text: 'యాహ్వే మంచివాడు, యథార్థవంతుడు;

    అందుకే ఆయన పాపులకు మార్గాన్ని బోధిస్తాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన పాపులకు మార్గంలో దారి చూపిస్తాడు.” ఈ క్రియకు ‘బోధించు,’ ‘ఉపదేశించు,’ లేదా ‘దారి చూపించు’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: మంచివాడు
  rationale: ఇక్కడ ఈ విశేషణం నైతిక మంచితనాన్ని సూచిస్తుంది. ‘మంచివాడు’ అనేది ఆధునిక తెలుగులో సూటిగా, సహజంగా ఉంటుంది.
- source_word: וְיָשָׁר
  choice: యథార్థవంతుడు
  rationale: יָשָׁר నైతిక సూటితనాన్ని, యథార్థ ప్రవర్తనను సూచిస్తుంది. ‘యథార్థవంతుడు’ ఈ నైతిక భావాన్ని నిలుపుతుంది; కేవలం భౌతికంగా ‘నేరుగా’ అనే అర్థాన్ని నివారిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’ ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: עַל כֵּן
  choice: అందుకే
  rationale: ముందటి వాక్యంలోని యాహ్వే మంచితనం, యథార్థత తరువాతి కార్యానికి కారణమని చూపే సహజమైన తెలుగు అనుసంధానం.
- source_word: יוֹרֶה
  choice: బోధిస్తాడు
  rationale: హిఫిల్ రూపంలోని ירה బోధించడం, ఉపదేశించడం లేదా దారి చూపించడం అనే భావాలను కలిగి ఉంది. ‘బోధిస్తాడు’ సందర్భానికి సహజంగా ఉండి, బోధనా భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: חַטָּאִים
  choice: పాపులకు
  rationale: నామవాచక బహువచనాన్ని మృదువుపరచకుండా ‘పాపులు’ అనే నైతిక వర్గంగానే అనువదించబడింది.
- source_word: בַּדָּרֶךְ
  choice: మార్గాన్ని
  rationale: హీబ్రూ పదబంధం జీవన మార్గపు రూపకాన్ని కలిగి ఉంది. తెలుగు బోధనా క్రియతో సహజంగా ఉండేందుకు ‘మార్గాన్ని’ అని ఇచ్చినా, ‘సరైన’ వంటి మూలంలో లేని విశేషణాన్ని చేర్చలేదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా దాని నామస్వరూపాన్ని కాపాడుతుంది.
- issue: בַּדָּרֶךְ యొక్క భావం
  choice: మార్గాన్ని
  alternative: మార్గంలో; సరైన మార్గాన్ని
  rationale: ‘సరైన’ అని స్పష్టీకరించడం మూలపాఠంలో లేని వివరణను చేర్చుతుంది. ‘మార్గాన్ని’ రూపకాన్ని కాపాడుతూ తెలుగులో సహజమైన వాక్యనిర్మాణాన్ని ఇస్తుంది.
- issue: יוֹרֶה లోని బోధన మరియు దిశానిర్దేశ భావాలు
  choice: బోధిస్తాడు
  alternative: ఉపదేశిస్తాడు; దారి చూపిస్తాడు
  rationale: ఒకే భావానికి పరిమితం చేయకుండా ప్రధాన బోధనా శక్తిని పాఠ్యంలో ఉంచి, దిశానిర్దేశ భావాన్ని పాదటిప్పణిలో తెలియజేయబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కీర్తనాశైలిని ఉపయోగించాం. సమాంతర విశేషణాలను నిలిపి, రెండో పాదంలో కారణ–ఫల సంబంధాన్ని సహజంగా వ్యక్తం చేశాం.
