source:
  edition: WLC
  text: הַדְרִ֘יכֵ֤/נִי בַ/אֲמִתֶּ֨/ךָ וְֽ/לַמְּדֵ֗/נִי כִּֽי אַ֭תָּה אֱלֹהֵ֣י יִשְׁעִ֑/י אוֹתְ/ךָ֥ קִ֝וִּ֗יתִי כָּל הַ/יּֽוֹם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/005.yaml
  text: Lead me in your truth and teach me[a], for you are the God of my salvation[b]; for you I wait all day long.
translation:
  language: te
  text: 'నీ సత్యంలో నన్ను నడిపించు[a];

    నాకు బోధించు.


    ఎందుకంటే నీవే నాకు రక్షణనిచ్చే దేవుడవు;

    దినమంతా నీ కోసం ఎదురుచూస్తున్నాను[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీ నమ్మకత్వం చేత నన్ను నడిపించు’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదానికి ‘సత్యం,’ ‘నమ్మకత్వం’ అనే రెండు భావాలూ ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘దినమంతా నీ కోసం ఆశతో ఎదురుచూస్తున్నాను’ అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ ఆశతో ఎదురుచూడడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדְרִיכֵנִי
  choice: నన్ను నడిపించు
  rationale: דרך హిఫిల్ ఆజ్ఞారూపం ఒకరిని మార్గంలో నడిపించడం లేదా దారి చూపించడం అనే భావాన్ని ఇస్తుంది. ‘నన్ను నడిపించు’ దిశా రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בַאֲמִתֶּךָ
  choice: నీ సత్యంలో
  rationale: אֱמֶתకు ‘సత్యం,’ ‘నమ్మకత్వం’ అనే భావాలు ఉన్నాయి. నడిపించడం, బోధించడం అనే సమీప సందర్భంలో ‘నీ సత్యంలో’ అనేది దేవుని సత్యాన్ని మార్గం లేదా ప్రమాణంగా వ్యక్తం చేస్తుంది; మరో సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וְלַמְּדֵנִי
  choice: నాకు బోధించు
  rationale: למד పియేల్ ఆజ్ఞారూపానికి నేరమైన అర్థం ‘బోధించు.’ ఈ రూపం ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఈ సంధి ముందున్న ప్రార్థనకు కారణాన్ని పరిచయం చేస్తుంది. ‘ఎందుకంటే’ ఆ వివరణాత్మక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: నాకు రక్షణనిచ్చే దేవుడు
  rationale: హీబ్రూ నిర్మాణం అక్షరార్థంగా ‘నా రక్షణ యొక్క దేవుడు.’ తెలుగులో అసహజమైన నామవాచక కూర్పును నివారిస్తూ, దేవుడే రక్షణకు మూలం అనే భావాన్ని ‘నాకు రక్షణనిచ్చే దేవుడు’ సహజంగా తెలియజేస్తుంది.
- source_word: קִוִּיתִי
  choice: ఎదురుచూస్తున్నాను
  rationale: קוה ఆశతో, నిరీక్షణతో వేచియుండడాన్ని సూచిస్తుంది. ‘ఎదురుచూస్తున్నాను’ కాలవ్యాప్తి గల వేచియుండే భావాన్ని నిలుపుతుంది; ఆశాభావాన్ని పాదటిప్పణి స్పష్టం చేస్తుంది.
- source_word: אוֹתְךָ
  choice: నీ కోసమే
  rationale: קוהతో కూడిన ప్రత్యక్ష కర్మ సూచకం మరియు సర్వనామం ఒకరి కోసం ఎదురుచూడడాన్ని తెలియజేస్తాయి. ‘నీ కోసమే’ సహజమైన తెలుగుతో పాటు కీర్తనకర్త దృష్టి దేవునిపైనే ఉందనే ఉద్ఘాటనను వ్యక్తం చేస్తుంది.
- source_word: כָּל הַיּוֹם
  choice: దినమంతా
  rationale: ఈ పదబంధం రోజంతటి వ్యవధిని సూచిస్తుంది. ‘దినమంతా’ సంక్షిప్తమైన, సహజమైన, కవితాత్మక తెలుగు రూపం.
theological_decisions:
- issue: దైవిక నడిపింపుతో సంబంధించి אֱמֶת అర్థం
  choice: ‘సత్యం’గా అనువదించాం.
  alternative: ‘నమ్మకత్వం’ లేదా ‘విశ్వసనీయత’
  rationale: నడిపించు, బోధించు అనే క్రియల జతలో దేవుని సత్యం కీర్తనకర్త నేర్చుకొని అనుసరించవలసిన మార్గం లేదా ప్రమాణంగా సరిపోతుంది. అయితే దేవుని నమ్మకత్వం అనే నిజమైన పదార్థసాధ్యతను పాదటిప్పణిలో నిలిపాం.
- issue: קוה క్రియలోని నిరీక్షణ భావం
  choice: ప్రధాన పాఠ్యంలో ‘ఎదురుచూస్తున్నాను’ అని ఇచ్చాం.
  alternative: ‘నీలో ఆశపెట్టుకున్నాను’ లేదా ‘ఆశతో ఎదురుచూస్తున్నాను’
  rationale: హీబ్రూ క్రియలో వేచియుండడం, ఆశించడం రెండూ కలిసివున్నాయి. ప్రధాన పాఠ్యం వేచియుండే స్పష్టమైన రూపకాన్ని కాపాడుతుంది; ఆశతో కూడిన నిరీక్షణను పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, ప్రార్థనా కీర్తనకు తగిన గౌరవప్రదమైన మరియు స్వల్ప కవితాత్మక శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని విజ్ఞప్తి–కారణం–నిరీక్షణ క్రమాన్ని నిలిపాం; పదార్థపరమైన సందిగ్ధతలను ప్రధాన పాఠ్యంలో ఏకపక్షంగా పరిష్కరించకుండా పాదటిప్పణుల్లో చూపించాం.
