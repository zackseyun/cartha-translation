source:
  edition: WLC
  text: גַּ֣ם כָּל קֹ֭וֶי/ךָ לֹ֣א יֵבֹ֑שׁוּ יֵ֝בֹ֗שׁוּ הַ/בּוֹגְדִ֥ים רֵיקָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/003.yaml
  text: Indeed[a], none of those who wait for you will be put to shame[b]; those who deal treacherously without cause will be put to shame.
translation:
  language: te
  text: నిశ్చయంగా, నీ కోసం నిరీక్షించే వారిలో ఎవ్వరూ సిగ్గుపడరు[a]; కారణం లేకుండా ద్రోహం చేసేవారు సిగ్గుపడతారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీపై ఆశ ఉంచేవారు.” హీబ్రూ క్రియ ఆశతో ఎదురుచూస్తూ నిరీక్షించే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “కారణం లేకుండా” అని అనువదించిన హీబ్రూ పదాన్ని “వ్యర్థంగా” లేదా “ఏమీ లేకుండానే” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: నిశ్చయంగా
  rationale: ఇక్కడ ఈ పదం కేవలం కూడికను కాక, వాక్యంలోని నిశ్చయాన్ని నొక్కిచెబుతోంది.
- source_word: כָּל קֹוֶיךָ לֹא
  choice: నీ కోసం నిరీక్షించే వారిలో ఎవ్వరూ ... పడరు
  rationale: హీబ్రూ వాక్యంలోని సార్వత్రిక నిరాకరణను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: קֹוֶיךָ
  choice: నీ కోసం నిరీక్షించే వారు
  rationale: קוה అనే క్రియ ఆశతో, ఎదురుచూపుతో నిరీక్షించడాన్ని సూచిస్తుంది; ప్రత్యక్ష అర్థాన్ని నిలుపుతూ ఆశాభావాన్ని కూడా వినిపిస్తుంది.
- source_word: לֹא יֵבֹשׁוּ / יֵבֹשׁוּ
  choice: సిగ్గుపడరు / సిగ్గుపడతారు
  rationale: రెండు పాదాల్లో ఒకే క్రియ పునరావృతమైనందున, అదే తెలుగు పదాన్ని వాడి వ్యతిరేక సమాంతరతను నిలిపాం.
- source_word: הַבּוֹגְדִים
  choice: ద్రోహంగా ప్రవర్తించేవారు
  rationale: בגד విశ్వాసఘాతుకంగా లేదా ద్రోహంగా ప్రవర్తించడాన్ని సూచిస్తుంది; కృదంతంలోని క్రియాశీల భావాన్ని ఈ రూపం నిలుపుతుంది.
- source_word: רֵיקָם
  choice: కారణం లేకుండా
  rationale: ఈ సందర్భంలో ద్రోహానికి సముచిత కారణం లేకపోవడాన్ని సూచించే పఠనం సందర్భానికి సహజంగా సరిపోతుంది; ఇతర సాధ్యార్థాలను పాదటీపులో ఉంచాం.
theological_decisions:
- issue: దేవుని కోసం నిరీక్షించడం మరియు అవమాన ఫలితం మధ్య ఉన్న కవితాత్మక నిశ్చయం
  choice: వాక్యంలోని సంపూర్ణ నిశ్చయాన్ని మృదువుచేయకుండా నిలిపాం
  alternative: ఇది సాధారణ సూత్రమని సూచించేలా అర్థాన్ని పరిమితం చేయడం
  rationale: మూల హీబ్రూ ఎటువంటి పరిమితిని స్పష్టంగా జోడించదు; అందువల్ల దాని కవితాత్మక, ధార్మిక ఉద్రిక్తతను యథాతథంగా ఉంచడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదజాలం. రెండు పాదాల్లోని ‘సిగ్గుపడు’ పునరావృతం హీబ్రూ కవితా సమాంతరతను నిలుపుతుంది.
