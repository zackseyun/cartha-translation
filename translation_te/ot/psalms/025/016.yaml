lexical_decisions:
- source_word: פְּנֵה אֵלַי
  choice: నా వైపు తిరిగి
  rationale: దేవుడు తనవైపు దృష్టి నిలపాలని ప్రార్థకుడు వేడుకునే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְחָנֵּנִי
  choice: నాపై కృప చూపు
  rationale: חנן అనే క్రియలోని అనుగ్రహం, దయతో కూడిన ఆదరణ అనే భావాన్ని ‘కృప చూపు’ స్పష్టంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న విన్నపానికి కారణాన్ని పరిచయం చేసే హీబ్రూ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: יָחִיד
  choice: ఒంటరిగా
  rationale: ఈ విలాప సందర్భంలో సామాజికంగా ఒంటరిగా లేదా అంతరంగంగా ఏకాకిగా ఉండే భావాలను రెండింటినీ సహజంగా మోస్తుంది; ‘ఒక్కడినే’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: וְעָנִי
  choice: బాధల్లో
  rationale: עָנִי సూచించగల దారిద్ర్యం, అణచివేత, సాధారణ దుస్థితి అనే విస్తృత భావపరిధిని సందర్భానుగుణంగా సంక్షిప్తంగా అందిస్తుంది; ప్రత్యామ్నాయ అర్థాలను పాదసూచికలో నిలుపుతుంది.
- source_word: אָנִי
  choice: నేను … ఉన్నాను
  rationale: స్వతంత్ర సర్వనామంలోని వ్యక్తిగత ఉద్ఘాటనను తెలుగులో సహజమైన కర్త–క్రియా నిర్మాణంతో వ్యక్తం చేస్తుంది.
