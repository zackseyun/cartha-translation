  yaml_path: translation/ot/psalms/025/017.yaml
  text: The troubles of my heart have multiplied[b][a]; bring me out of my distresses.
translation:
  language: te
  text: నా హృదయపు బాధలు పెరిగిపోయాయి[a]; నా సంకటాల నుండి నన్ను బయటకు తీసుకురా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా హృదయపు బాధలు విస్తరించాయి.’
    reason: హెబ్రీ క్రియకు అక్షరార్థంగా వెడల్పు కావడం లేదా విస్తరించడం అనే రూపకం ఉంది; సందర్భంలో బాధలు పెరగడం అనే భావాన్ని సూచిస్తుంది.
  - marker: b
    text: లేదా, ‘నా ఇరుకైన పరిస్థితుల నుండి నన్ను బయటకు తీసుకురా.’
    reason: హెబ్రీ పదం ఇరుకు స్థలం లేదా తీవ్రమైన సంకటాన్ని సూచిస్తుంది; ఈ ప్రత్యామ్నాయం మూలంలోని సంకుచితత రూపకాన్ని నిలుపుతుంది.
lexical_decisions:
- source_word: צָרוֹת
  choice: బాధలు
  rationale: ఈ బహువచన నామవాచకం కష్టాలు, బాధలు, విపత్తులను సూచిస్తుంది. ఆధునిక తెలుగులో ‘బాధలు’ సహజంగా ఉండి, అంతరంగాన్ని వేధించే కష్టాల భావాన్ని తెలియజేస్తుంది.
- source_word: לְבָבִי
  choice: నా హృదయ
  rationale: హెబ్రీ పదం భావోద్వేగాలు, ఆలోచనలు కలిగిన అంతరంగ వ్యక్తిని సూచించగలదు. ‘హృదయ’ మూలభాషలోని మానవశాస్త్రీయ రూపకాన్ని నిలుపుతుంది.
- source_word: הִרְחִיבוּ
  choice: విస్తరించాయి
  rationale: హిఫీల్ రూపంలోని క్రియకు అక్షరార్థంగా ‘వెడల్పు చేశాయి/విస్తరించాయి’ అనే భావం ఉంది. బాధలు పెరిగాయనే సందర్భార్థంతో పాటు మూలంలోని విస్తరణ రూపకాన్ని కూడా ‘విస్తరించాయి’ నిలుపుతుంది.
- source_word: מִמְּצוּקוֹתַי
  choice: నా ఇరుకులలోనుండి
  rationale: ఈ పదం ఇరుకైన స్థితులు, సంకటాలు, తీవ్రమైన ఒత్తిడిని సూచిస్తుంది. ‘ఇరుకులు’ మూలంలోని సంకుచిత స్థల రూపకాన్ని నిలుపుతుంది; బహువచనాన్నీ కాపాడుతుంది.
- source_word: הוֹצִיאֵנִי
  choice: నన్ను బయటకు తీసుకురా
  rationale: ఈ క్రియకు ‘బయటకు తీసుకురా’ అనే స్పష్టమైన కారణార్థక భావం ఉంది. ఇది సంకుచిత స్థితినుండి రక్షించే concrete రూపకాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
