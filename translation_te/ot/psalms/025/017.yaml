translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రార్థనా శైలిని ఉపయోగించాం. మొదటి పాదంలో హెబ్రీ ‘వెడల్పు కావడం’ రూపకాన్ని, రెండవ పాదంలో ‘ఇరుకులలోనుండి బయటకు తీయడం’ రూపకాన్ని ఉద్దేశపూర్వకంగా నిలిపి, వాటి సహజ భావానువాదాలను పాదటిప్పణుల్లో ఇచ్చాం.
