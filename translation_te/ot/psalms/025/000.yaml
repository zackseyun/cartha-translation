  yaml_path: translation/ot/psalms/025/000.yaml
  text: Of David. To you[a], Yahweh, I lift up my soul.
translation:
  language: te
  text: 'దావీదుది.


    యహ్వే, నీ వైపుకు నా ప్రాణాన్ని[a] ఎత్తుతున్నాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా జీవితాన్ని’ లేదా ‘నన్నే’. హెబ్రీలోని ‘నెఫెష్’ అనే పదం కేవలం శరీరానికి భిన్నమైన ఆత్మను మాత్రమే కాక, మొత్తం వ్యక్తిని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: దావీదు కీర్తన
  rationale: శీర్షికలోని లְ సంబంధాన్ని సహజమైన తెలుగు శైలిలో తెలిపింది; ఇది రచయితత్వం, అంకితం లేదా దావీదుతో సంబంధం అనే సాధ్యమైన భావాలను పూర్తిగా నిర్ధారించకుండా సంక్షిప్తంగా ఉంచుతుంది.
- source_word: אֵלֶיךָ
  choice: నీ వైపుకు
  rationale: దిశను సూచించే אֶל భావాన్ని నిలుపుతూ, ప్రార్థనలో దేవునివైపు మనస్సు మళ్లించడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా, తెలుగు బైబిల్ పాఠకులకు సుపరిచితమైన రూపంలో ప్రతిలిపి చేసింది.
- source_word: נַפְשִׁי
  choice: నా ప్రాణాన్ని
  rationale: נֶפֶשׁ పదంలోని జీవం, వ్యక్తి, అంతరంగ స్వరూపం అనే విస్తృత భావపరిధిని ‘ప్రాణం’ కొంతవరకు నిలుపుతుంది; దానిని కేవలం అమూర్తమైన ఆత్మగా పరిమితం చేయదు.
- source_word: אֶשָּׂא
  choice: ఎత్తుతున్నాను
  rationale: נשא క్రియ యొక్క రూపకాన్ని నిలుపుతూ, దేవునికి తన సంపూర్ణ వ్యక్తిత్వాన్ని అప్పగించడం లేదా ఆయనవైపు తిప్పడం అనే కవితాత్మక ఉద్వేగాన్ని కాపాడుతుంది.
theological_decisions:
- issue: נֶפֶשׁ యొక్క మానవశాస్త్ర సంబంధ భావం
  choice: ప్రాణం
  alternative: ఆత్మ / జీవితం / నన్ను నేనే
  rationale: ‘ఆత్మ’ అనడం శరీరానికి వేరైన అమూర్త భాగమనే భావాన్ని అనవసరంగా బలపరచవచ్చు. మూలపదం మొత్తం వ్యక్తిని లేదా జీవితాన్ని కూడా సూచించగలదని పాదటిప్పణిలో స్పష్టం చేశాం.
- issue: లְדָוִד అనే శీర్షిక సంబంధం
  choice: దావీదు కీర్తన
  alternative: దావీదుది / దావీదు కోసం
  rationale: హెబ్రీ ఉపసర్గకు రచయితత్వం, అనుబంధం, అంకితం వంటి భావాలు సాధ్యమైనందున, ఖచ్చితమైన సిద్ధాంత నిర్ణయాన్ని రుద్దకుండా తెలుగు కీర్తనల శీర్షికకు సహజమైన సంప్రదాయ రూపాన్ని వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, ప్రార్థనాత్మకమైన, గౌరవప్రదమైన శైలి. మూలంలోని కవితాత్మక ‘ఎత్తడం’ రూపకాన్ని నిలిపి, నెఫెష్ పదంలోని అర్థవిస్తృతిని పాదటిప్పణితో సంరక్షించాం.
