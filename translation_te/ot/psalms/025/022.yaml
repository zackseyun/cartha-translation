source:
  edition: WLC
  text: פְּדֵ֣ה אֱ֭לֹהִים אֶת יִשְׂרָאֵ֑ל מִ֝/כֹּ֗ל צָֽרוֹתָי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/022.yaml
  text: Redeem Israel[a], O God, from all his troubles.
translation:
  language: te
  text: దేవా, ఇశ్రాయేలును అతని కష్టాలన్నిటి నుండి విమోచించు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలును వారి కష్టాలన్నిటి నుండి విమోచించు.” ఇక్కడ “ఇశ్రాయేలు”ను సమష్టి ప్రజలుగా తీసుకుంటే ఇలా అనువదించవచ్చు; హీబ్రూలో మాత్రం సర్వనామ ప్రత్యయం ఏకవచనంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּדֵה
  choice: విమోచించు
  rationale: פדה అనే క్రియకు విమోచించడం, వెల చెల్లించి విడిపించడం, రక్షించడం అనే భావపరిధి ఉంది. ప్రార్థనలోని ఆజ్ఞార్థక రూపాన్నీ, నిబంధన సంబంధమైన దైవశాస్త్ర బరువునీ ‘విమోచించు’ సహజంగా నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ఇక్కడ దేవుడు ప్రత్యక్ష సంబోధనలో ఉన్నాడు; ఆధునిక ప్రామాణిక తెలుగులో ‘దేవా’ సహజమైన సంబోధన రూపం.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: ఈ సందర్భంలో ఇది పితరుడైన యాకోబును మాత్రమే కాక, సమష్టిగా నిబంధన ప్రజలను సూచించే సొంత పేరు.
- source_word: מִכֹּל
  choice: అన్నిటి నుండి
  rationale: מִן మరియు כֹּל కలయిక కష్టాల సంపూర్ణ సముదాయం నుండి విడిపించడాన్ని వ్యక్తం చేస్తుంది.
- source_word: צָרוֹתָיו
  choice: అతని కష్టాలు
  rationale: צָרוֹתָיוలోని మూడవ పురుష ఏకవచన పురుషలింగ ప్రత్యయాన్ని ‘అతని’గా నిలిపి, צָרוֹת అనే విస్తృత భావాన్ని సాధారణ పాఠకులకు సహజమైన ‘కష్టాలు’తో వ్యక్తం చేశాం.
theological_decisions:
- issue: ఇశ్రాయేలును సూచించే సమష్టి ఏకవచన సర్వనామం
  choice: ‘అతని కష్టాలు’ అనే ఏకవచన రూపాన్ని నిలుపుట
  alternative: ‘వారి కష్టాలు’ అని సమష్టి ప్రజలను బహువచనంగా వ్యక్తం చేయుట
  rationale: హీబ్రూ పాఠంలో ‘కష్టాలు’కు మూడవ పురుష ఏకవచన పురుషలింగ ప్రత్యయం ఉంది; ‘ఇశ్రాయేలు’ సమష్టి నామంగా ఏకవచనంలో పరిగణించబడింది. ప్రధాన పాఠం మూల వ్యాకరణాన్ని నిలుపుతుంది; తెలుగులో సహజమైన సమష్టి బహువచన ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనాత్మక గౌరవాన్ని నిలుపుతూ సాధారణ పాఠకులకు స్పష్టమైన, సంక్షిప్తమైన వాక్య నిర్మాణం. ‘విమోచించు’ మూలంలోని విమోచన భావాన్ని కాపాడుతుంది.
