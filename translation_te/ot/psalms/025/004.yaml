source:
  edition: WLC
  text: דְּרָכֶ֣י/ךָ יְ֭הוָה הוֹדִיעֵ֑/נִי אֹ֖רְחוֹתֶ֣י/ךָ לַמְּדֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/004.yaml
  text: Make your ways known to me[a], O Yahweh; teach me your paths.
translation:
  language: te
  text: 'యాహ్వే, నీ మార్గాలను నాకు తెలియజేయి[a];

    నీ త్రోవలను నాకు నేర్పించు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, “నేను తెలుసుకునేలా చేయి”; సాంప్రదాయంగా, “నాకు చూపించు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָכֶיךָ
  choice: నీ మార్గాలను
  rationale: דֶּרֶךְ అనే పదంలోని ‘మార్గం’ అనే రూపకాన్ని నిలుపుతూ, దేవుని ప్రవర్తనా విధానం లేదా ఆయన కోరే జీవనగతి అనే విస్తృత భావాన్ని ముందుగానే పరిమితం చేయదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తినామంగా అందిస్తుంది.
- source_word: הוֹדִיעֵנִי
  choice: నాకు తెలియజేయి
  rationale: ידע హిఫీల్ ఆజ్ఞారూపంలోని కారణార్థాన్ని—‘నేను తెలుసుకునేలా చేయి’—సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אֹרְחוֹתֶיךָ
  choice: నీ త్రోవలను
  rationale: אֹרַח లోని బాట/త్రోవ భావాన్ని నిలుపుతూ, సమాంతర పాదంలోని דֶּרֶךְ కు వాడిన ‘మార్గాలు’తో ఉన్న కవితాత్మక వైవిధ్యాన్ని కాపాడుతుంది.
- source_word: לַמְּדֵנִי
  choice: నాకు నేర్పించు
  rationale: למד పియేల్ ఆజ్ఞారూపం యొక్క ప్రత్యక్ష అర్థమైన ‘నాకు బోధించు/నేర్పించు’ను సాధారణ పాఠకులకు సహజంగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా పేరు రూపంలో ఉంచాం; ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ను ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలి. రెండు సమాంతర పాదాల్లో ‘మార్గాలు/త్రోవలు’ అనే భేదాన్ని నిలిపి, మూలంలోని కవితాత్మక సమాంతరతను కాపాడాం.
