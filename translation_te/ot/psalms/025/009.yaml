  text: He guides the humble in justice[b][a], and he teaches the humble his way.
translation:
  language: te
  text: ఆయన వినయులైనవారిని న్యాయంలో నడిపిస్తాడు.[a][b] వినయులైనవారికి తన మార్గాన్ని బోధిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘న్యాయంతో,’ ‘తీర్పులో,’ లేదా ‘సరైన దానిలో.’
    reason: lexical_alternative
  - marker: b
    text: ‘వినయులైనవారు’ అనే హెబ్రీ పదం సందర్భానుసారం ‘సాత్వికులు,’ ‘దీనులు,’ లేదా ‘బాధితులు’ అని కూడా అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַדְרֵךְ
  choice: నడిపిస్తాడు
  rationale: דרך హిఫిల్ రూపం ‘నడిపించడం, దారి చూపించడం’ అనే కారణార్థాన్ని ఇస్తుంది. ‘నడిపిస్తాడు’ సహజమైన తెలుగులో ఆ భావాన్ని నిలుపుతుంది.
- source_word: עֲנָוִים
  choice: వినయస్థులు
  rationale: ఈ పదం వినయంగలవారు, సాత్వికులు, దీనులు లేదా బాధితులు అనే భావాలను సందర్భానుసారం సూచించగలదు. దేవుని ఉపదేశాన్ని స్వీకరించే వైఖరిని ఇక్కడ ‘వినయస్థులు’ స్పష్టంగా తెలియజేస్తుంది; మూలంలోని పునరుక్తి కూడా నిలుపబడింది.
- source_word: בַּמִּשְׁפָּט
  choice: న్యాయమైన మార్గంలో
  rationale: מִשְׁפָּטకు న్యాయం, తీర్పు, సరైనది అనే అర్థాలు ఉన్నాయి. בְּ ఉపసర్గతో ఇది దేవుడు నడిపించే ప్రమాణాన్ని లేదా విధానాన్ని సూచించవచ్చు. సహజమైన తెలుగులో ‘న్యాయమైన మార్గంలో’ ఈ భావాన్ని తెలియజేస్తుంది.
- source_word: וִילַמֵּד
  choice: బోధిస్తాడు
  rationale: למד పియేల్ రూపం ‘బోధించడం, నేర్పించడం’ అని అర్థం. ‘బోధిస్తాడు’ గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది.
- source_word: דַּרְכּוֹ
  choice: తన మార్గాన్ని
  rationale: ఇది ఏకవచన నామవాచకానికి మూడవ పురుష ఏకవచన ప్రత్యయం కలిసిన రూపం. తెలుగు వాక్య నిర్మాణంలో కర్తను తిరిగి సూచించడానికి ‘తన మార్గాన్ని’ సహజంగా ఉంటుంది.
theological_decisions:
- issue: עֲנָוִים పదంలో ఆధ్యాత్మిక వినయం, సామాజిక దీనత్వం మధ్య భావసంబంధం
  choice: వినయస్థులు
  alternative: సాత్వికులు; దీనులు; అణగారినవారు
  rationale: కీర్తన సందర్భంలో యెహోవా ఉపదేశాన్ని స్వీకరించే వినయపూర్వక వైఖరి ప్రధానంగా కనిపిస్తుంది. అయితే హెబ్రీ పదంలో దీనత్వం లేదా బాధిత స్థితి అనే సాధ్యార్థాన్ని పాదటిప్పణి ద్వారా నిలుపుకున్నాం.
- issue: בַּמִּשְׁפָּט దేవుని నడిపింపు జరిగే పరిధిని, విధానాన్ని, లేక ప్రమాణాన్ని సూచిస్తుందా
  choice: న్యాయమైన మార్గంలో
  alternative: న్యాయంతో; తీర్పులో; సరైన దానిలో
  rationale: మూలంలోని సంబంధం కొంత విస్తృతంగా ఉంది. ప్రధాన పాఠంలో సహజమైన తెలుగు కోసం ‘న్యాయమైన మార్గంలో’ వాడినా, ‘న్యాయంతో’ లేదా ‘సరైన దానిలో’ అనే సాధ్యార్థాలను పాదటిప్పణిలో ఇచ్చి భావ ఉద్రిక్తతను నిలుపుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హెబ్రీ సమాంతర నిర్మాణంలోని ‘వినయస్థులు’ అనే పునరుక్తిని ఉద్దేశపూర్వకంగా నిలుపుకున్నాం. అన్ని పాదటిప్పణి సూచికలు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠంలో ఉన్నాయి.
