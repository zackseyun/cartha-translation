  variant: modern standard Telugu
source:
  edition: WLC
  text: לְמַֽעַן שִׁמְ/ךָ֥ יְהוָ֑ה וְֽ/סָלַחְתָּ֥ לַ֝/עֲוֺנִ֗/י כִּ֣י רַב הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/011.yaml
  text: For the sake of your name[a], O Yahweh, forgive my iniquity[b], for it is great.
translation:
  language: te
  text: నీ నామం నిమిత్తం[a], యాహ్వే, నా అపరాధాన్ని[b] క్షమించు; ఎందుకంటే అది ఎంతో గొప్పది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘నీ నామం నిమిత్తం.’ ఇక్కడ ‘నామం’ కేవలం పలికే పేరును మాత్రమే కాక, దేవుని స్వభావం, ఖ్యాతి, నిబంధన గౌరవాన్ని కూడా సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: ‘అపరాధం’కు ఉన్న హీబ్రూ పదం עָוֹן; సందర్భానుసారం అది చేసిన తప్పు, అపరాధస్థితి, లేదా అపరాధభారం/దాని పర్యవసానాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: నిమిత్తం
  rationale: దేవుని నామమే ఈ విన్నపానికి ఆధారం లేదా ప్రేరణ అని తెలిపే హీబ్రూ ప్రయోగాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: שִׁמְךָ
  choice: నీ నామం
  rationale: మూలంలోని నిర్దిష్ట రూపకాన్ని నిలుపుతుంది; ఇక్కడ ‘నామం’ దేవుని ఖ్యాతి, స్వభావం, నిబంధన గౌరవాన్ని కూడా సూచించగలదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణగా అందిస్తుంది.
- source_word: וְסָלַחְתָּ
  choice: క్షమించు
  rationale: వ్యాకరణ రూపం పరిపూర్ణ క్రియారూపమైనప్పటికీ, ఈ ప్రార్థనా సందర్భంలో అది విన్నపంగా పనిచేస్తుంది; ‘క్షమించు’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: לַעֲוֺנִי
  choice: నా దోషాన్ని
  rationale: עָוֹן సూచించే తప్పు, అపరాధస్థితి, దాని భారము అనే భావపరిధిని పూర్తిగా ఒకే పదంలో బంధించలేము; ‘దోషం’ నైతిక గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: క్షమాపణ విన్నపానికి తరువాతి వాక్యం కారణాన్ని ఇస్తున్నదనే సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: רַב הוּא
  choice: అది గొప్పది
  rationale: ఏకవచనమైన ‘దోషం’ను הוּא తిరిగి సూచిస్తుంది; רַב ఇక్కడ సంఖ్యకన్నా దాని తీవ్రత లేదా పరిమాణాన్ని తెలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠం బిరుదును కాక దేవుని వ్యక్తినామాన్ని ఉపయోగిస్తుంది; లిప్యంతరీకరణ ఆ భేదాన్ని నిలుపుతుంది.
- issue: עָוֹן యొక్క భావపరిధి
  choice: దోషం
  alternative: అపరాధం / పాపం / అపరాధభారం
  rationale: ఈ హీబ్రూ పదం చేసిన తప్పును, దాని వల్ల కలిగిన దోషస్థితిని, కొన్నిసార్లు దాని పర్యవసానాన్ని సూచించగలదు. ప్రధాన పాఠంలో ‘దోషం’ ఉంచి, ఇతర సాధ్యార్థాలను పాదసూచికలో తెలిపాం.
- issue: ‘దోషం గొప్పది’ అనే కారణవాక్యంలోని ఉద్వేగం
  choice: ఎందుకంటే అది గొప్పది
  alternative: అది గొప్పదైనప్పటికీ
  rationale: 'כִּי కి ఇక్కడ సహజమైన కారణార్థాన్ని నిలిపాం: దోషం తీవ్రంగా ఉండటమే క్షమాపణ అవసరాన్ని మరింత బలపరుస్తుంది. దానిని concessive భావంగా మార్చి వేదాంత ఉద్వేగాన్ని ముందుగానే పరిష్కరించలేదు.'
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ప్రార్థనకు తగిన గంభీరమైన, కానీ సాధారణ పాఠకులకు సులభమైన శైలిని ఉపయోగించాం. హీబ్రూ పదక్రమపు కవితాత్మక బలాన్ని నిలుపుటకు ‘నీ నామం నిమిత్తం’ ముందుంచి, దైవనామాన్ని సంబోధనగా మధ్యలో ఉంచాం.
