source:
  edition: WLC
  text: רְאֵ֣ה עָ֭נְיִ/י וַ/עֲמָלִ֑/י וְ֝/שָׂ֗א לְ/כָל חַטֹּאותָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/018.yaml
  text: Look on my affliction and my trouble[a], and forgive all my sins.
translation:
  language: te
  text: నా బాధను, నా కష్టాన్ని చూడు; నా పాపాలన్నిటినీ క్షమించు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నా పాపాలన్నిటినీ ఎత్తివేయి.” హెబ్రీ క్రియకు “మోయు” లేదా “తొలగించు” అనే అర్థాలు ఉండవచ్చు; ఇక్కడ అది పాపాలను క్షమించడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: చూడు
  rationale: దేవునికి చేసిన ప్రత్యక్ష విజ్ఞప్తిలోని ఆజ్ఞార్థక రూపాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; కేవలం గమనించడం మాత్రమే కాక శ్రద్ధ చూపాలనే ప్రార్థనా భావం సందర్భం ద్వారా వ్యక్తమవుతుంది.
- source_word: עָנְיִי
  choice: నా బాధను
  rationale: עֳנִי ఇక్కడ దారిద్ర్యానికే పరిమితం కాకుండా దుఃఖం, అణచివేత, బాధ అనే విస్తృత అర్థాన్ని ఇస్తుంది. ‘బాధ’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి ఆ విస్తృతిని నిలుపుతుంది.
- source_word: וַעֲמָלִי
  choice: నా కష్టాన్ని
  rationale: עָמָל శ్రమ, ఇబ్బంది, బాధాకరమైన కష్టం అనే అర్థాలు కలిగి ఉంది. ‘బాధ’తో సమాంతరంగా ‘కష్టం’ అనడం పునరుక్తిని తగ్గిస్తూ అనుభవిస్తున్న భారాన్ని తెలియజేస్తుంది.
- source_word: וְשָׂא
  choice: క్షమించు
  rationale: נשׂא యొక్క ప్రాథమిక భావం ‘ఎత్తు/మోయు/తొలగించు’; పాపాలు కర్మగా ఉన్న ఈ ప్రయోగంలో అది పాపాన్ని తొలగించడం, అంటే క్షమించడం అనే స్థిరమైన నుడికార భావాన్ని ఇస్తుంది.
- source_word: לְכָל
  choice: అన్నిటినీ
  rationale: נשׂאతో కూడిన לְను తెలుగులో ప్రత్యేకంగా అనువదించాల్సిన అవసరం లేదు; כָל యొక్క సమగ్ర భావాన్ని ‘అన్నిటినీ’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: חַטֹּאותָי
  choice: నా పాపాలు
  rationale: חַטָּאות్ యొక్క నైతిక భావానికి ‘పాపాలు’ స్పష్టమైన, ప్రామాణిక తెలుగు సమానార్థకం; బహువచనాన్ని కూడా నిలుపుతుంది.
theological_decisions:
- issue: పాపాలను కర్మగా తీసుకున్న נשׂא నుడికార అనువాదం
  choice: నా పాపాలన్నిటినీ క్షమించు
  alternative: నా పాపాలన్నిటినీ ఎత్తివేయి / తొలగించు
  rationale: ప్రధాన పాఠ్యంలో ‘క్షమించు’ అనడం హెబ్రీ నుడికార ఉద్దేశాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది. అదే సమయంలో ‘ఎత్తివేయడం/తొలగించడం’ అనే మూల రూపకాన్ని పాదటిప్పణిలో ఉంచడం ద్వారా దాని భావవ్యాప్తిని కోల్పోకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ప్రార్థనా శైలి. దేవునితో ఏకవచన ప్రత్యక్ష సంభాషణకు తగిన ‘చూడు’, ‘క్షమించు’ రూపాలు వాడబడ్డాయి. హెబ్రీ సమాంతర నిర్మాణం ‘బాధను, కష్టాన్ని’ ద్వారా నిలుపబడింది.
