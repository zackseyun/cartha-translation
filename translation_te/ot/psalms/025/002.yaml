  text: אֱֽלֹהַ֗/י בְּ/ךָ֣ בָ֭טַחְתִּי אַל אֵב֑וֹשָׁה אַל יַֽעַלְצ֖וּ אֹיְבַ֣/י לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/002.yaml
  text: My God[a], in you I trust; do not let me be put to shame[b]; do not let my enemies exult over me.
translation:
  language: te
  text: నా దేవా, నేను నిన్ను నమ్ముకున్నాను; నాకు అవమానం కలగనివ్వకు[a]; నా శత్రువులు నాపై ఉల్లసించనివ్వకు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నేను సిగ్గుపడనివ్వకు.” హెబ్రీ క్రియ అంతరంగంలో సిగ్గుపడటాన్నీ, బహిరంగంగా అవమానానికి లేదా పరాభవానికి గురికావటాన్నీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నా శత్రువులు నాపై విజయోత్సాహంతో సంతోషించనివ్వకు,” లేదా “నన్ను చూసి ఆనందించనివ్వకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: నా దేవా
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న ఈ రూపానికి ‘నా దేవుడు’ అని అర్థం; ఇక్కడ ప్రత్యక్ష సంబోధన కావడంతో సహజమైన తెలుగు సంబోధన రూపం ‘నా దేవా’ అని వాడబడింది.
- source_word: בְּךָ
  choice: నిన్నే
  rationale: ב అనే విభక్తి בטח అనే క్రియతో నమ్మకానికి ఆధారమైన వ్యక్తిని సూచిస్తుంది. వాక్యారంభంలోని ప్రాధాన్యాన్ని తెలుగులో ‘ఏ’ నొక్కిచెప్పే ప్రత్యయంతో సహజంగా వ్యక్తం చేశాం.
- source_word: בָטַחְתִּי
  choice: నమ్ముకున్నాను
  rationale: Qal perfect 1cs స్థిరపడిన నమ్మకాన్ని సూచించగలదు. ‘నమ్ముకున్నాను’ గతంలో ఏర్పడి ప్రస్తుతం కొనసాగుతున్న ఆధారపడే వైఖరిని సహజంగా తెలియజేస్తుంది.
- source_word: אַל אֵבוֹשָׁה
  choice: నాకు అవమానం కలగనివ్వకు
  rationale: אַל తో కూడిన అభ్యర్థనను ‘కలగనివ్వకు’గా వ్యక్తం చేశాం. בושׁ అంతరంగ సిగ్గునూ బహిరంగ అవమానాన్నీ సూచించగలదు; శత్రువుల సందర్భంలో ప్రధాన పాఠం బహిరంగ అవమాన భావాన్ని ముందుకు తెస్తుంది, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- source_word: יַעַלְצוּ
  choice: ఉల్లసించనివ్వకు
  rationale: עלץ తీవ్రంగా సంతోషించడం లేదా విజయోత్సాహంతో ఉల్లసించడం అనే భావాన్ని ఇస్తుంది. శత్రువులు కర్తలుగా ఉండటం వల్ల ఇది హానికరమైన విజయానందాన్ని సూచిస్తుంది; ‘ఉల్లసించు’ కవితాత్మక గౌరవాన్ని నిలుపుతుంది.
- source_word: אֹיְבַי
  choice: నా శత్రువులు
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న నామవాచకానికి నేరుగా, సహజంగా సరిపోయే అనువాదం.
- source_word: לִי
  choice: నాపై
  rationale: ఉల్లాసాన్ని తెలిపే క్రియతో ל, ఎవరి పతనం లేదా అవమానం మీద శత్రువులు ఆనందిస్తారో ఆ వ్యక్తిని సూచిస్తుంది. తెలుగులో ‘నాపై’ ఈ సంబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: కీర్తనకర్త అవమానం గురించి చేసే విజ్ఞప్తి
  choice: నాకు అవమానం కలగనివ్వకు
  alternative: నేను సిగ్గుపడనివ్వకు
  rationale: శత్రువుల ఎదుట న్యాయం పొందాలనే సందర్భం బహిరంగ అవమానం లేదా పరాభవం అనే భావాన్ని బలపరుస్తుంది. అయితే హెబ్రీ క్రియ అంతరంగ సిగ్గును కూడా సూచించగలదు; అందువల్ల ఆ నిజమైన అస్పష్టతను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనా కవిత్వానికి తగిన గౌరవభరితమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే భాష వాడబడింది. ‘నా దేవా’ సంబోధనను, ‘నిన్నే నమ్ముకున్నాను’లోని స్థిర నమ్మకాన్ని, అలాగే అవమానం మరియు శత్రువుల విజయానందం మధ్యనున్న ఉద్రిక్తతను నిలిపాం.
