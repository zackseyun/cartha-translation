  text: Who is the man who fears Yahweh? He will instruct him in the way he should choose[a].
translation:
  language: te
  text: 'యాహ్వేకు భయపడే మనిషి ఎవరు?


    అతడు ఎంచుకోవలసిన మార్గాన్ని యాహ్వే అతనికి బోధిస్తాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు ఎంచుకునే మార్గాన్ని” లేదా “యాహ్వే ఎంచుకునే మార్గాన్ని.” చివరి హీబ్రూ క్రియకు కొద్దిగా భిన్నమైన అర్థసూచనలు సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה הָאִישׁ
  choice: మనిషి ఎవడు?
  rationale: ప్రశ్నార్థక పదంతో కూడిన సూచనార్థక రూపం ఇక్కడ అలంకారిక ప్రశ్నగా పనిచేస్తుంది. ‘మనిషి ఎవడు?’ అనేది సహజమైన ఆధునిక తెలుగు; హీబ్రూ పుంలింగ ఏకవచన ప్రతినిధి స్వరూపాన్ని నిలుపుతుంది.
- source_word: יְרֵא יְהוָה
  choice: యెహోవాకు భయపడే
  rationale: కీర్తనలూ జ్ఞానసాహిత్య సందర్భాల్లో ירא దేవునిపట్ల భక్తిపూర్వక భయాన్ని సూచిస్తుంది. ‘భయపడే’ అనే పదం దాని గంభీరతను నిలుపుతుంది; ‘యెహోవాకు’ తెలుగు ప్రయోగంలో సహజంగా ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: יוֹרֶנּוּ
  choice: యెహోవా అతనికి బోధిస్తాడు
  rationale: ירה హిఫిల్ రూపం బోధించడం, ఉపదేశించడం లేదా దారి చూపించడం అనే భావాలను కలిగి ఉంటుంది. సందర్భం వల్ల కర్త యెహోవా అని గ్రహించి తెలుగులో స్పష్టంగా పేర్కొన్నాం; ప్రత్యయ కర్మను ‘అతనికి’గా ఇచ్చాం.
- source_word: בְּדֶרֶךְ
  choice: మార్గంలో
  rationale: דרך అక్షరార్థ మార్గంతో పాటు జీవన విధానాన్ని కూడా సూచించగల రూపకాన్ని కలిగి ఉంది; ‘మార్గంలో’ ఆ విస్తృతిని నిలుపుతుంది.
- source_word: יִבְחָר
  choice: ఎంచుకోవలసిన
  rationale: అసంపూర్ణ క్రియారూపం ‘ఎంచుకుంటాడు,’ ‘ఎంచుకోబోతాడు,’ లేదా సందర్భానుసారంగా ‘ఎంచుకోవలసిన’ అనే సూక్ష్మార్థాలను అనుమతిస్తుంది. ప్రధాన పాఠంలో ఉపదేశ సందర్భానికి సరిపోయే విధ్యర్థక భావాన్ని ఎంచుకుని, ఇతర సాధ్యార్థాలను పాదటిప్పణిలో నిలిపాం.
theological_decisions:
- issue: ‘అతనికి బోధిస్తాడు’ అనే క్రియకు కర్త ఎవరు?
  choice: యెహోవానే భయపడే మనిషికి బోధించే కర్తగా స్పష్టీకరించాం.
  alternative: కర్తను తెలుగులో సూచించకుండా వదలడం లేదా అనిర్దిష్ట కర్తగా గ్రహించడం.
  rationale: హీబ్రూ క్రియలో కర్త ప్రత్యక్షంగా లేకపోయినా, వెంటనే ముందున్న యెహోవా ప్రస్తావన మరియు కీర్తన సందర్భం యెహోవానే కర్త అని బలంగా సూచిస్తాయి. తెలుగు వాక్య స్పష్టత కోసం పేరును పునరుక్తి చేశాం.
- issue: יִבְחָר లోని వ్యక్తి మరియు విధ్యర్థక భావం
  choice: భయపడే మనిషి ‘ఎంచుకోవలసిన’ మార్గంగా ప్రధాన పాఠంలో ఇచ్చాం.
  alternative: యెహోవా ఎంచుకునే మార్గం; లేదా ఆ మనిషి ఎంచుకునే/ఎంచుకోబోయే మార్గం.
  rationale: క్రియ పుంలింగ ఏకవచనంగా ఉండటం వల్ల వ్యాకరణపరంగా ఒకటి కంటే ఎక్కువ అనుసంధానాలు సాధ్యమే. ఉపదేశ సందర్భం ప్రధాన ఎంపికకు మద్దతిచ్చినా, నిజమైన అస్పష్టతను పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కీర్తన శైలిని అనుసరించాం. ‘యెహోవా,’ ‘భయపడే,’ ‘మార్గం,’ ‘బోధిస్తాడు’ వంటి సాధారణంగా అర్థమయ్యే పదాలతో మూలంలోని భక్తిపూర్వకతను, మార్గ రూపకాన్ని నిలిపాం.
