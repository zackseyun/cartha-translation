  text: All the paths of Yahweh are steadfast love and faithfulness to those who keep his covenant and his testimonies[a][b].
translation:
  language: te
  text: 'యెహోవా మార్గాలన్నీ


    ఆయన నిబంధనను, ఆయన సాక్ష్యవచనాలను పాటించేవారికి


    నిలకడగల ప్రేమ, విశ్వసనీయత.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విశ్వసనీయత’కు బదులు ‘సత్యం’ అని కూడా అనువదించవచ్చు. అయితే ‘నిలకడగల ప్రేమ, విశ్వసనీయత’ అనే ఈ నిబంధన సంబంధమైన పదజంటలో హెబ్రీ పదం సాధారణంగా ఆధారపడదగిన విశ్వసనీయతను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘పాటించేవారికి’ అనే పదంలోని మూల హెబ్రీ క్రియకు ‘కాపాడేవారికి’ లేదా ‘జాగ్రత్తగా ఆచరించేవారికి’ అనే భావం కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אָרְחוֹת
  choice: మార్గాలన్నీ
  rationale: మొత్తం మార్గాలను సూచించే כָּל భావాన్ని, אָרְחוֹתలోని మార్గరూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపున్న రూపంలో అందిస్తుంది.
- source_word: חֶסֶד
  choice: నిలకడగల ప్రేమ
  rationale: నిబంధన సందర్భంలోని స్థిరమైన, విశ్వసనీయమైన ప్రేమను తెలియజేస్తుంది.
- source_word: אֱמֶת
  choice: నమ్మకత్వం
  rationale: חֶסֶדతో జతగా ఇక్కడ అమూర్తమైన ‘సత్యం’ కంటే ఆధారపడదగిన విశ్వసనీయత ప్రధాన భావం.
- source_word: לְנֹצְרֵי
  choice: పాటించేవారికి
  rationale: נצרలోని జాగ్రత్తగా కాపాడి ఆచరించే భావాన్ని సందర్భానుకూలంగా తెలుపుతూ, לְ సంబంధాన్ని ‘వారికి’గా నిలుపుతుంది.
- source_word: בְרִיתוֹ
  choice: ఆయన నిబంధనను
  rationale: బైబిలు నిబంధన సందర్భానికి ప్రమాణికమైన తెలుగు పదప్రయోగం.
- source_word: וְעֵדֹתָיו
  choice: ఆయన శాసనాలను
  rationale: దేవుడు సాక్ష్యంగా నిర్దేశించిన ఆజ్ఞాపూర్వక నియమాల భావాన్ని సాధారణ పాఠకునికి సహజంగా తెలియజేస్తుంది; ‘సాక్ష్యాలు’ అనే అపార్థసాధ్యమైన పదాన్ని నివారిస్తుంది.
theological_decisions:
- issue: యెహోవా మార్గాలు ప్రేమ, నమ్మకత్వం ‘అవుతాయి’ అనే విధేయ సంబంధం
  choice: మార్గాలే నిలకడగల ప్రేమ, నమ్మకత్వమని చెప్పే హెబ్రీ విధేయ నిర్మాణాన్ని నిలిపివేయడం
  alternative: ఆయన మార్గాలు నిలకడగల ప్రేమకు, నమ్మకత్వానికి నడిపిస్తాయి
  rationale: క్రియలేని హెబ్రీ వాక్యం חֶסֶד וֶאֱמֶתను యెహోవా మార్గాలకు విధేయంగా ఉంచుతుంది; ఫలితానికి నడిపించే మార్గాలుగా మార్చడం మూలపాఠాన్ని వివరణాత్మకంగా విస్తరించుతుంది.
- issue: నిబంధన పాటించేవారితో సంబంధం
  choice: ‘పాటించేవారికి’ అని సంబంధాన్ని నేరుగా ఉంచడం
  alternative: వారి విధేయతవల్ల మాత్రమే దేవుని స్వభావం ప్రేమగలదవుతుందని వివరణ చేర్చడం
  rationale: לְ ఉపసర్గ సూచించే సంబంధాన్ని మాత్రమే అనువదించి, దేవుని స్వభావం మానవ విధేయతపై ఆధారపడుతుందా అనే ప్రశ్నను పాఠ్యానికి మించి పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కీర్తనాశైలిని ఉపయోగించాం. పద్య పంక్తుల విభజన భావ నిర్మాణాన్ని స్పష్టంచేస్తుంది. ‘యెహోవా’ వ్యక్తినామాన్ని నిలిపాం; ‘శాసనాలు’ సాధారణ పాఠకునికి ‘సాక్ష్యాలు’ కంటే సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
