base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/006.yaml
  text: Remember your mercies[a], O Yahweh, and your steadfast love[c][b], for they are from of old.
translation:
  language: te
  text: 'యాహ్వే, నీ కరుణలను,

    నీ అచంచల ప్రేమను స్మరించు;

    ఎందుకంటే అవి పూర్వకాలం నుంచే ఉన్నాయి.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: లేదా, “అవి నిత్యకాలం నుంచే ఉన్నాయి.” హీబ్రూ పదబంధం సుదూర ప్రాచీనతను లేదా నిత్యకాలాన్ని సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: זְכֹר
  choice: జ్ఞాపకం చేసుకో
  rationale: זכר అనే ధాతువు యొక్క Qal ఆజ్ఞార్థక ఏకవచన రూపం; దేవునికి చేసే ప్రత్యక్ష ప్రార్థనను సహజమైన తెలుగు ప్రార్థనా భాషలో వ్యక్తం చేస్తుంది.
- source_word: רַחֲמֶיךָ
  choice: నీ కనికర కార్యాలను
  rationale: רחמים బహువచన రూపాన్ని తెలుగులో సహజంగా నిలుపుతూ, కేవలం అమూర్తమైన ‘కనికరం’ కాక దాని సమృద్ధమైన వ్యక్తీకరణలను సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో అందిస్తుంది.
- source_word: וַחֲסָדֶיךָ
  choice: నీ అచంచల ప్రేమ కార్యాలను
  rationale: חסדలోని స్థిరమైన, నిబద్ధమైన ప్రేమ భావాన్ని ‘అచంచల ప్రేమ’ తెలియజేస్తుంది; హీబ్రూ బహువచనాన్ని ‘కార్యాలు’ ద్వారా సహజ తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న విజ్ఞప్తికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: מֵעוֹלָם
  choice: పూర్వకాలం నుంచే
  rationale: సుదూర గతం లేదా నిత్యత్వం అనే రెండింటినీ సూచించగల పదానికి, ఈ సందర్భంలో అతిశయ నిర్ణయం చేయకుండా ప్రాచీనకాల భావాన్ని ప్రధాన పాఠ్యంలో ఉంచుతుంది.
- source_word: הֵמָּה
  choice: అవి ... ఉన్నాయి
  rationale: ముందున్న రెండు బహువచన నామాలకు తిరిగి సూచించే స్వతంత్ర తృతీయ పురుష బహువచన సర్వనామాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం.
- issue: מֵעוֹלָם యొక్క కాలార్థం
  choice: పూర్వకాలం నుంచే
  alternative: నిత్యకాలం నుంచే
  rationale: ఈ హీబ్రూ పదబంధం సుదూర ప్రాచీనతను గానీ నిత్యత్వాన్ని గానీ సూచించవచ్చు. ప్రధాన పాఠ్యం సందర్భోచితమైన ప్రాచీనతను ఇస్తూ, విస్తృత అర్థసాధ్యతను పాదటిప్పణిలో నిలుపుతుంది.
- issue: רחמים మరియు חסדים బహువచనాలు
  choice: కనికర కార్యాలు; అచంచల ప్రేమ కార్యాలు
  alternative: కనికరం; అచంచల ప్రేమ
  rationale: హీబ్రూ బహువచన రూపాలను అసహజమైన తెలుగు బహువచన అమూర్తనామాలుగా చేయకుండా, దేవుని కనికరం మరియు నిబద్ధ ప్రేమ అనేక కార్యాల్లో వ్యక్తమవుతాయని సూచించే సహజ రూపాన్ని ఉపయోగించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన ప్రార్థనా శైలి. హీబ్రూ సమాంతర నిర్మాణాన్ని పాద విభజనలో నిలిపి, బహువచన భావాన్ని సహజ తెలుగులో ‘కార్యాలు’ ద్వారా వ్యక్తం చేశాం.
