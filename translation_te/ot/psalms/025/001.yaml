source:
  edition: WLC
  text: לְ/דָוִ֡ד אֵלֶ֥י/ךָ יְ֝הוָ֗ה נַפְשִׁ֥/י אֶשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/001.yaml
  text: Of David. To you[a], O Yahweh, I lift up my soul.
translation:
  language: te
  text: దావీదుకు చెందినది. యాహ్వే, నీకు నా ప్రాణాన్ని[a] ఎత్తుతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా జీవితాన్ని’ లేదా ‘నన్ను’; హెబ్రీలోని ‘నా ప్రాణం’ (నెఫెష్) అనే మాట దేహరహిత భాగాన్ని మాత్రమే కాక, సంపూర్ణ వ్యక్తిని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: దావీదుకు చెందినది
  rationale: కీర్తన శీర్షికలో వ్యక్తి పేరుకు ముందున్న לְ అనుబంధం, రచన, అంకితం వంటి భావాలకు వీలు కల్పిస్తుంది. ‘దావీదు రచించినది’ అని రచయితత్వాన్ని ఖచ్చితంగా నిర్ణయించకుండా మూలంలోని అస్పష్టతను నిలుపుతుంది; మూలంలో లేని ‘కీర్తన’ అనే పదాన్ని కూడా చేర్చదు.
- source_word: אֵלֶיךָ
  choice: నీ వైపునకు
  rationale: אֶל ఉపసర్గతో ఉన్న ద్వితీయ పురుష ఏకవచన ప్రత్యయం ‘నీ వైపునకు/నీకు’ అని అర్థం. ‘నా ప్రాణాన్ని ఎత్తడం’ అనే రూపకంతో తెలుగులో ‘నీ వైపునకు’ సహజంగా సరిపోతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా అందించాం.
- source_word: נַפְשִׁי
  choice: నా ప్రాణాన్ని
  rationale: נֶפֶשׁ ప్రాణం, జీవితం, స్వయం, సంపూర్ణ వ్యక్తి వంటి విస్తృత భావాలను కలిగి ఉంది. ‘నా ప్రాణాన్ని’ హెబ్రీ రూపకాన్ని నిలుపుతూ తెలుగులో గంభీరంగా, సహజంగా ఉంటుంది; దానిని కేవలం దేహరహిత ‘ఆత్మ’గా పరిమితం చేయదు.
- source_word: אֶשָּׂא
  choice: ఎత్తుతున్నాను
  rationale: נָשָׂא ధాతువు ఇక్కడ ‘ఎత్తు’ అనే భావాన్ని ఇస్తుంది. వర్తమాన ప్రార్థనా ప్రకటనగా ఉన్న హెబ్రీ అసంపూర్ణ క్రియను తెలుగులో ‘ఎత్తుతున్నాను’ అని సహజంగా అందించి, దేవునివైపు తన ప్రాణాన్ని మళ్లించే రూపకాన్ని కాపాడాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: వచనంలో బిరుదు కాకుండా చతురక్షర దైవనామమే ఉంది. అందువల్ల ‘ప్రభువు’ అని ప్రత్యామ్నాయ బిరుదు పెట్టకుండా వ్యక్తిగత నామాన్ని ఉంచాం. తెలుగు పాఠకులకు స్థిరంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణకు మరింత సమీపమైన ప్రత్యామ్నాయం.
- issue: נֶפֶשׁ యొక్క వ్యక్తి-సంబంధ భావవ్యాప్తి
  choice: నా ప్రాణాన్ని
  alternative: నా జీవితాన్ని; నన్ను నేనే; నా ఆత్మను
  rationale: ఈ పదం కేవలం మనిషి యొక్క దేహరహిత భాగాన్నే సూచిస్తుందని నిర్ణయించకుండా, జీవితం లేదా సంపూర్ణ వ్యక్తినీ సూచించగల మూలంలోని భావ ఉద్రిక్తతను ప్రధాన పాఠం మరియు పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనకు తగిన గంభీరతతో రూపొందించబడింది. ‘నీ వైపునకు’ అనే ప్రయోగం మూలంలోని దిశాభావాన్ని, ‘నా ప్రాణాన్ని ఎత్తుతున్నాను’ అనే ప్రయోగం హెబ్రీ రూపకాన్ని కాపాడుతాయి. శీర్షికలోని సంబంధార్థక అస్పష్టతను ‘దావీదుకు చెందినది’ ద్వారా నిలిపాం.
