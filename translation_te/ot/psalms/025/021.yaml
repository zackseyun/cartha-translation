  text: Integrity and uprightness may preserve me[b][a], for I wait for you.
translation:
  language: te
  text: యథార్థత, న్యాయవర్తన నన్ను కాపాడుగాక[a]; ఎందుకంటే నేను నీ కోసం నిరీక్షిస్తున్నాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యథార్థత, న్యాయవర్తన నన్ను కాపాడుతాయి’; ఈ సందర్భంలో హీబ్రూ క్రియ కోరికను/ప్రార్థనను లేదా నిశ్చయమైన ఆశాభావాన్ని వ్యక్తం చేయగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నేను నీపై ఆశ ఉంచుతున్నాను’; హీబ్రూ క్రియలో ఆశతో నిరీక్షించే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּם
  choice: యథార్థత
  rationale: నైతిక స్వభావంలోని సంపూర్ణత, చిత్తశుద్ధి, నిందారహితత్వం అనే భావాలను సూచిస్తుంది. ‘యథార్థత’ ఆధునిక తెలుగులో సహజంగా ఉండి, పాపరహితత్వాన్ని అతిగా సూచించకుండా వ్యక్తిత్వ సమగ్రతను తెలియజేస్తుంది.
- source_word: וָיֹשֶׁר
  choice: న్యాయవర్తన
  rationale: నైతికంగా నేరుగా, న్యాయంగా నడుచుకోవడాన్ని సూచిస్తుంది. ఇది תֹּם తో ఉన్న సమాంతర జోడీని నిలుపుతూ, కేవలం మాటల్లోని నిజాయితీకి భావాన్ని పరిమితం చేయదు.
- source_word: יִצְּרוּנִי
  choice: నన్ను కాపాడుగాక
  rationale: נצר అనే మూలపదానికి కాపాడు, భద్రపరచు అనే అర్థాలున్నాయి. ఇక్కడి yiqtol రూపం ప్రార్థనాత్మక ఆకాంక్షను గానీ నమ్మకంతో కూడిన నిరీక్షణను గానీ వ్యక్తం చేయగలదు; ప్రధాన పాఠంలో ప్రార్థనా సందర్భానికి తగిన ఆకాంక్షార్థం ఎంచుకుని, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ప్రార్థనకు కారణాన్ని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: קִוִּיתִיךָ
  choice: నేను నీ కోసం నిరీక్షిస్తున్నాను
  rationale: קוה ఆశతో ఎదురుచూడడం, నిరీక్షించడం అనే భావాన్ని కలిగి ఉంది. ఈ ఎంపిక ఎదురుచూపు అనే క్రియాత్మక భావాన్ని నిలుపుతుంది; అంతర్లీన ఆశాభావాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
theological_decisions:
- issue: కీర్తనకర్త తన నైతిక లక్షణాలను స్వయార్జిత పుణ్యంగా పేర్కొంటున్నాడా, లేక వాటిని తన సంరక్షణతో ముడిపెట్టి ప్రార్థిస్తున్నాడా?
  choice: యథార్థత, న్యాయవర్తన తనను కాపాడాలని కీర్తనకర్త ప్రార్థిస్తున్నట్లు అనువదించాం; అవి స్వయార్జిత పుణ్యమని అదనంగా నిర్ధారించలేదు.
  alternative: కీర్తనకర్త తన నీతినే విమోచనకు అర్హత కలిగించే ఆధారంగా చూపుతున్నాడనే బలమైన పుణ్యాధారిత పఠనం.
  rationale: హీబ్రూ పాఠం ఈ నైతిక గుణాలను కాపాడే కర్తలుగా పేర్కొని, దేవుని కోసం కీర్తనకర్త నిరీక్షించడంతో వాటిని కలుపుతుంది. అనువాదం ఈ ఉద్వేగాన్ని అలాగే ఉంచి, నైతిక భాషను తగ్గించదు; అదే సమయంలో పాఠానికి మించిన సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనా ప్రార్థనకు తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని రెండు నైతిక గుణాల సమాంతరతను, క్రియలోని ప్రార్థన/నమ్మకం అస్పష్టతను, ఆశతో కూడిన నిరీక్షణ భావాన్ని నిలిపాం.
