id: PSA.25.7
reference: Psalms 25:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: חַטֹּ֤אות נְעוּרַ֨/י וּ/פְשָׁעַ֗/י אַל תִּ֫זְכֹּ֥ר כְּ/חַסְדְּ/ךָ֥ זְכָר לִ/י אַ֑תָּה לְמַ֖עַן טוּבְ/ךָ֣ יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/007.yaml
  text: Do not remember the sins of my youth or my transgressions[a]; according to your steadfast love, remember me—for the sake of your goodness[b], O Yahweh.
translation:
  language: te
  text: నా యౌవనకాలపు పాపాలను, నా అతిక్రమాలను జ్ఞాపకం చేసుకోవద్దు; యాహ్వే, నీ నిబద్ధమైన ప్రేమ ప్రకారం నన్ను జ్ఞాపకం చేసుకో—నీ మంచితనాన్ని బట్టి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నీ మంచితనం నిమిత్తం” అని కూడా అనువదించవచ్చు. హీబ్రూ పదబంధం దేవుని మంచితనాన్ని ఈ విన్నపానికి ఆధారంగానూ ప్రేరణగానూ చూపగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטֹּאות נְעוּרַי
  choice: నా యౌవనకాలపు పాపాలను
  rationale: ఈ నిర్మాణం యౌవనంతో సంబంధమున్న నిర్దిష్ట పాపకార్యాలను సూచిస్తుంది; ఈ తెలుగు రూపం మూలంలోని సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: וּפְשָׁעַי
  choice: నా అతిక్రమాలను
  rationale: פשע ఉద్దేశపూర్వక తిరుగుబాటు లేదా హద్దుమీరడాన్ని సూచించగలదు; ‘అతిక్రమాలు’ దాని నైతిక బలాన్ని అతిగా వ్యాఖ్యానించకుండా అందిస్తుంది. ו ఇక్కడ ‘మరియు’ భావంతో సమన్వయపరుస్తుంది.
- source_word: אַל תִּזְכֹּר
  choice: జ్ఞాపకం చేసుకోవద్దు
  rationale: ఇది దేవునికి చేసిన నిషేధార్థక విన్నపం; పాపాలను లెక్కలోకి తీసుకోకూడదనే న్యాయ/సంబంధార్థ ఛాయను కూడా నిలుపుతుంది.
- source_word: כְּחַסְדְּךָ
  choice: నీ నిబద్ధ ప్రేమ ప్రకారం
  rationale: חסד ప్రేమతో పాటు విశ్వసనీయత, సంబంధ నిబద్ధతను మోసే సమృద్ధ పదం; ‘నిబద్ధ ప్రేమ’ ఈ విస్తృతిని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: זְכָר לִי אַתָּה
  choice: నన్ను జ్ఞాపకం చేసుకో
  rationale: ముందటి ‘పాపాలను జ్ఞాపకం చేసుకోవద్దు’ అన్న విన్నపానికి ఇది ఉద్దేశపూర్వక సానుకూల ప్రతిరూపం. אַתָּה ఇచ్చే ఉద్ఘాటన సందర్భంలో సహజంగానే వ్యక్తమవుతుంది.
- source_word: לְמַעַן טוּבְךָ
  choice: నీ మంచితనాన్ని బట్టి
  rationale: విన్నపానికి దేవుని సొంత మంచితనమే ఆధారం లేదా ప్రేరణ అని తెలియజేస్తుంది; తెలుగు వాడుకలో ఇది సహజంగా ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చారిత్రకంగా తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగానే ఉంచుతుంది.
theological_decisions:
- issue: חסד యొక్క భావవిస్తృతి
  choice: నిబద్ధ ప్రేమ
  alternative: కరుణ; ఒడంబడిక ప్రేమ
  rationale: ఈ వాక్యం కేవలం కనికరానికే కాక దేవుని స్థిరమైన, విశ్వసనీయమైన సంబంధ ప్రేమకూ మొరపెడుతుంది; ఎంపిక చేసిన రూపం ఏకైక సిద్ధాంతపరమైన నిర్వచనానికి దానిని కుదించదు.
- issue: పాపాలను జ్ఞాపకం చేసుకోవడం మరియు వ్యక్తిని జ్ఞాపకం చేసుకోవడం మధ్య వ్యత్యాసం
  choice: రెండు చోట్లా ‘జ్ఞాపకం చేసుకో’ అనే ఒకే మూలభావాన్ని నిలుపడం
  alternative: మొదట ‘లెక్కలోకి తీసుకోవద్దు,’ తరువాత ‘దయతో చూడు’ అని భావానువాదం చేయడం
  rationale: హీబ్రూ పదపునరుక్తి వాక్యంలోని కవితాత్మక, ధార్మిక ఉద్వేగాన్ని మోస్తుంది; దానిని వివరించి పరిష్కరించకుండా అలాగే నిలుపడం సముచితం.
- issue: దైవనామం יְהוָה
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: రెండూ దైవనామాన్ని సూచించే లిప్యంతరీకరణ సంప్రదాయాలు. తెలుగు సాధారణ పాఠకులకు విస్తృతంగా గుర్తుపట్టదగిన ‘యెహోవా’ను ఎంచుకుని, దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలి. మూలంలోని ‘జ్ఞాపకం చేసుకోవద్దు / నన్ను జ్ఞాపకం చేసుకో’ అనే వ్యత్యాసాన్ని స్పష్టంగా నిలిపి, חסדకు ‘నిబద్ధ ప్రేమ’ అనే సహజమైన కానీ భావసమృద్ధ రూపాన్ని వాడింది.
