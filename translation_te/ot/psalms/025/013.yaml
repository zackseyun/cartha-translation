source:
  edition: WLC
  text: נַ֭פְשׁ/וֹ בְּ/ט֣וֹב תָּלִ֑ין וְ֝/זַרְע֗/וֹ יִ֣ירַשׁ אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/013.yaml
  text: His soul will dwell in goodness[b][a], and his offspring will inherit the land.
translation:
  language: te
  text: 'అతని ప్రాణం మేలులో నివసిస్తుంది[b];

    అతని సంతానం దేశాన్ని వారసత్వంగా పొందుతుంది[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘భూమిని.’ హెబ్రీ పదం దేశాన్ని లేదా భూమిని సూచించగలదు; ఇక్కడ ‘దేశాన్ని’ అనేది వాగ్దాన దేశాన్ని వారసత్వంగా పొందే నిబంధనాత్మక భావానికి బాగా సరిపోతుంది.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా ‘బస చేస్తుంది’ లేదా ‘రాత్రి గడుపుతుంది.’ హెబ్రీ క్రియలో బస చేయడం లేదా నిలిచి ఉండడం అనే చిత్రం ఉంది; ఇక్కడ అది స్థిరంగా నివసించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשׁוֹ
  choice: అతని ప్రాణం
  rationale: నֶפֶשׁ అనే పదానికి ప్రాణం, వ్యక్తి, జీవితం అనే అర్థాలు ఉండగలవు. ఇక్కడ ‘అతని ప్రాణం’ అని అనువదించడం మూలంలోని కవితాత్మక వ్యక్తీకరణను నిలుపుతుంది.
- source_word: בְּטוֹב
  choice: మేలులో
  rationale: טוֹב మేలు, శ్రేయస్సు, సుఖస్థితి అనే విస్తృత భావాలను సూచిస్తుంది. ‘మేలులో’ నైతిక మేలునూ అనుభవించే శ్రేయస్సునూ సంకుచితం చేయకుండా ఉంచుతుంది.
- source_word: תָלִין
  choice: నివసిస్తుంది
  rationale: לון ప్రాథమికంగా రాత్రి బస చేయడం లేదా నిలిచి ఉండడం అనే చిత్రాన్ని కలిగి ఉంది. సందర్భంలో స్థిరంగా ఉండడాన్ని సహజ తెలుగులో ‘నివసిస్తుంది’ అని తెలిపి, అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְזַרְעוֹ
  choice: అతని సంతానం
  rationale: זֶרַע ఇక్కడ విత్తనం అనే అక్షరార్థంలో కాకుండా సంతతి లేదా వారసుల భావంలో ఉంది. ‘సంతానం’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: יִירַשׁ
  choice: స్వాధీనం చేసుకుంటుంది
  rationale: ירשׁ వారసత్వంగా పొందడం లేదా స్వాధీనం చేసుకోవడం అనే భావాలను కలిగి ఉంది. తెలుగులో దేశం విషయంలో ‘స్వాధీనం చేసుకుంటుంది’ సహజంగా ఉండి, భూస్వాధీన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אָרֶץ
  choice: దేశాన్ని
  rationale: אֶרֶץ దేశం, భూమి అనే రెండు భావాలను ఇవ్వగలదు. ירשׁతో కలిసి ఇక్కడ నిబంధనాత్మకంగా దేశాన్ని పొందే భావం బలంగా ఉన్నందున ‘దేశాన్ని’ ఎంచుకున్నాం; విస్తృత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: יִירַשׁ אָרֶץలో אָרֶץ పరిధి
  choice: దేశాన్ని
  alternative: భూమిని
  rationale: ఈ పదబంధం మొత్తం భూమిని పొందడం కంటే వాగ్దాన దేశాన్ని స్వాధీనం చేసుకునే నిబంధనాత్మక భాషను ప్రతిధ్వనించే అవకాశం ఎక్కువ. అయితే హెబ్రీ పదానికి ఉన్న విస్తృత భావాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలిని ఉపయోగించాం. మూలంలోని ‘అతని ప్రాణం’ అనే వ్యక్తీకరణను నిలిపి, אָרֶץ మరియు לון పదాల నిజమైన భావవిస్తృతిని పాదసూచికలలో సంరక్షించాం.
