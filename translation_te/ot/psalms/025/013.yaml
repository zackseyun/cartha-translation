- from: 'అతని ప్రాణం మేలులో నివసిస్తుంది[b];

    అతని సంతానం దేశాన్ని స్వాధీనం చేసుకుంటుంది[a].'
  to: 'అతని ప్రాణం మేలులో నివసిస్తుంది[b];

    అతని సంతానం దేశాన్ని వారసత్వంగా పొందుతుంది[a].'
