  source_fidelity: 'The draft accurately renders the three Hebrew petitions: guard my life (שמרה נפשי), deliver me (והצילני), and do not let me be ashamed (אל אבוש), followed by the stated basis that the psalmist has taken refuge in God (כי חסיתי בך). “నా ప్రాణాన్ని” suitably conveys נפשי in this context.'
