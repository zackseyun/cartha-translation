id: PSA.25.20
reference: Psalms 25:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שָׁמְרָ֣/ה נַ֭פְשִׁ/י וְ/הַצִּילֵ֑/נִי אַל אֵ֝ב֗וֹשׁ כִּֽי חָסִ֥יתִי בָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/020.yaml
  text: Guard my life and rescue me; let me not be put to shame, for I take refuge in you.
translation:
  language: te
  text: నా ప్రాణాన్ని కాపాడి, నన్ను విడిపించు; నేను నీ ఆశ్రయం పొందాను గనుక నన్ను అవమానపాలు కానివ్వకు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַפְשִׁי
  choice: నా ప్రాణాన్ని
  rationale: ఇక్కడ נֶפֶשׁ మొత్తం వ్యక్తిని, ముఖ్యంగా ప్రమాదంలో ఉన్న ప్రాణాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘నా ప్రాణాన్ని’ సహజంగా ఈ భావాన్ని తెలియజేస్తుంది.
- source_word: שָׁמְרָה
  choice: కాపాడి
  rationale: దైవ రక్షణ కోసం చేసే విజ్ఞప్తిని సహజమైన తెలుగు ఆజ్ఞార్థక రూపంలో వ్యక్తం చేస్తుంది.
- source_word: וְהַצִּילֵנִי
  choice: నన్ను విడిపించు
  rationale: నష్టం లేదా ప్రమాదం నుంచి రక్షించి బయటకు తేవాలనే హీబ్రూ క్రియ భావాన్ని నిలుపుతుంది.
- source_word: חָסִיתִי בָךְ
  choice: నేను నీ ఆశ్రయం పొందాను
  rationale: దేవునిలో భద్రత కోరుతూ శరణు పొందిన భావాన్ని స్పష్టమైన, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: אַל אֵבוֹשׁ లోని సిగ్గు/అవమానం భావం
  choice: నన్ను అవమానం పాలుకానివ్వకు
  alternative: నేను సిగ్గుపడనివ్వకు
  rationale: హీబ్రూ పదం వ్యక్తిగత సిగ్గుతో పాటు బహిరంగ అవమానం లేదా నిరాశాభంగాన్ని కూడా సూచించగలదు. ‘అవమానం పాలుకానివ్వకు’ ఈ విస్తృత భావాన్ని అనవసరంగా సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనా కీర్తనకు తగిన గౌరవప్రదమైన, సరళమైన వాక్యనిర్మాణం. మూలంలోని మూడు విజ్ఞప్తులు మరియు వాటికి ఆధారమైన ఆశ్రయ ప్రకటన స్పష్టంగా నిలుపబడ్డాయి.
