translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనా గాంభీర్యాన్ని నిలుపుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని ‘ద్వేషం—ద్వేషించడం’ పునరుక్తిని ప్రధాన పాఠ్యంలో సాధ్యమైనంతవరకు నిలిపి, חָמָס భావవ్యాప్తిని పాదటిప్పణిలో స్పష్టం చేశాం.
