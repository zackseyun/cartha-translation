  yaml_path: translation/ot/psalms/025/019.yaml
  text: Look at my enemies[a], for they are many, and they hate me with violent hatred.
translation:
  language: te
  text: 'నా శత్రువులను చూడు, ఎందుకంటే వారు అనేకులై ఉన్నారు;

    వారు హింసాత్మకమైన ద్వేషంతో నన్ను ద్వేషిస్తున్నారు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వారు నన్ను హింస యొక్క ద్వేషంతో ద్వేషిస్తున్నారు.” హిబ్రూ వ్యక్తీకరణలో ‘ద్వేషం’ అనే నామవాచకం, ‘ద్వేషిస్తున్నారు’ అనే క్రియ పునరుక్తమవుతాయి; అది వారి ద్వేషం హింసాత్మకమైన, నిర్దాక్షిణ్యమైన స్వభావాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: చూడు
  rationale: దేవునికి ఉద్దేశించిన ఏకవచన ఆజ్ఞార్థక రూపం. ప్రార్థనలోని విజ్ఞాపన భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: אוֹיְבַי
  choice: నా శత్రువులను
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న నామవాచకానికి సూటియైన, ప్రామాణిక తెలుగు రూపం.
- source_word: כִּי רָבּוּ
  choice: వారు అనేకులు
  rationale: כִּי ఇక్కడ తరువాతి వాక్యాన్ని గమనించమనే విజ్ఞాపనకు ఆధారంగా పరిచయం చేస్తుంది; తెలుగులో విరామచిహ్నంతో ఈ సంబంధం సహజంగా వ్యక్తమవుతుంది. רָבּוּ శత్రువుల అధిక సంఖ్యను సూచిస్తుంది.
- source_word: וְשִׂנְאַת חָמָס
  choice: క్రూరమైన ద్వేషంతో
  rationale: חָמָס‌లోని హింసాత్మకత, దౌర్జన్యం, నిర్దాక్షిణ్య స్వభావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; కేవలం ద్వేష తీవ్రతకే పరిమితం చేయదు.
- source_word: שְׂנֵאוּנִי
  choice: నన్ను ద్వేషిస్తున్నారు
  rationale: హిబ్రూ సంపూర్ణ క్రియారూపం విలాప సందర్భంలో కొనసాగుతున్న శత్రుత్వ స్థితిని సూచిస్తుంది; తెలుగు వర్తమాన కొనసాగింపు రూపం దాన్ని సహజంగా వ్యక్తం చేస్తుంది.
