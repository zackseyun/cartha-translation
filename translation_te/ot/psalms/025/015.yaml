  yaml_path: translation/ot/psalms/025/015.yaml
  text: My eyes are continually toward Yahweh[a], for he will bring my feet out of the net.
translation:
  language: te
  text: 'నా కళ్ళు ఎల్లప్పుడూ యాహ్వేవైపు ఉంటాయి;

    ఎందుకంటే ఆయనే నా పాదాలను వలలోనుండి[a] బయటకు తీస్తాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వల నుండి.’ హీబ్రూ క్రియకు అక్షరార్థం ‘బయటకు తీస్తాడు’; ఇది చిక్కులో నుండి రక్షించే చిత్రాన్ని నిలుపుతుంది.
    reason: లెక్సికల్ ప్రత్యామ్నాయం
lexical_decisions:
- source_word: עֵינַי
  choice: నా కళ్లు
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న స్పష్టమైన బహువచన రూపాన్ని, చూపు అనే భావార్థంగా మార్చకుండా, హీబ్రూ శరీరరూపకంతోనే నిలుపుతుంది.
- source_word: תָּמִיד
  choice: ఎల్లప్పుడూ
  rationale: నిరంతరంగా, అలవాటుగా దేవునివైపు దృష్టి ఉంచడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶל
  choice: వైపే
  rationale: కళ్ల దిశను సహజంగా తెలుపుతుంది; ‘ఏ’ అవధారణ కీర్తనకర్త దృష్టి యెహోవాపైనే నిలిచిందనే హీబ్రూ వాక్యబలాన్ని తెలుగులో మృదువుగా ప్రతిబింబిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ప్రత్యక్ష లిప్యంతరీకరణతో నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הוּא
  choice: ఆయనే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగులో గౌరవార్థకంగా, అతిశయించకుండా వ్యక్తం చేస్తుంది.
- source_word: יוֹצִיא
  choice: బయటకు తీస్తాడు
  rationale: హిఫీల్ రూపంలోని ‘బయటకు రప్పించు/తీయు’ అనే కారణార్థాన్ని, రక్షణను అమూర్తంగా మార్చకుండా, వలలో చిక్కుకున్న పాదాల చిత్రంతో నిలుపుతుంది.
- source_word: מֵרֶשֶׁת
  choice: వలలోనుండి
  rationale: ‘వల’ అనే ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది; సాధారణమైన ‘ఉచ్చు’ కంటే మూలంలోని జాలరూప చిత్రానికి దగ్గరగా ఉంటుంది.
- source_word: רַגְלָי
  choice: నా పాదాలను
  rationale: మొదటి పురుష బహువచన శరీరపదాన్ని నేరుగా నిలిపి, చిక్కుకోవడం మరియు బయటపడడం అనే రూపకాన్ని కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా ఉంచాలి. తెలుగు బైబిల్ పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ప్రధాన పాఠంలో ఉంచి, మూలనామ ఉచ్చారణకు దగ్గరైన ‘యాహ్వే’ను పాదసూచికలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనా కవిత్వానికి తగిన గౌరవభరితమైన, సులభమైన శైలి. రెండు పాదాల సమాంతర నిర్మాణాన్ని నిలిపి, ‘వలలోనుండి ... బయటకు తీస్తాడు’ ద్వారా మూలంలోని స్పష్టమైన రక్షణ చిత్రాన్ని కాపాడాం.
