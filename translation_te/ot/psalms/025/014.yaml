source:
  edition: WLC
  text: ס֣וֹד יְ֭הוָה לִ/ירֵאָ֑י/ו וּ֝/בְרִית֗/וֹ לְ/הוֹדִיעָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/014.yaml
  text: The counsel of the LORD is for those who fear him, and his covenant is to make it known to them.
translation:
  language: te
  text: 'యెహోవా రహస్య సలహా ఆయనకు భయపడేవారికే చెందుతుంది;

    ఆయన తన నిబంధనను వారికి తెలియజేస్తాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סוֹד
  choice: ఆంతరంగిక సలహా
  rationale: ఈ పదం గోప్యమైన ఆలోచన, సన్నిహిత సంప్రదింపు, ఆంతరంగిక వర్గం అనే భావపరిధిని కలిగి ఉంది. సందర్భంలో దేవునికి భయపడేవారికి ఆయన అనుగ్రహించే సన్నిహిత సలహా లేదా అవగాహన భావాన్ని ఈ రూపం సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన చతురక్షర నామాన్ని తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో సూచిస్తుంది.
- source_word: לִירֵאָיו
  choice: ఆయనకు భయపడేవారికి
  rationale: దేవునిపట్ల భక్తిపూర్వక భయం కలిగినవారిని సూచించే హీబ్రూ వ్యక్తీకరణను ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: וּבְרִיתוֹ
  choice: ఆయన తన నిబంధనను
  rationale: בְּרִית యొక్క ఒడంబడిక సంబంధిత అర్థాన్ని ‘నిబంధన’ స్పష్టంగా వ్యక్తం చేస్తుంది; వాక్య నిర్మాణంలో దేవుడే తెలియజేసే కర్తగా సహజ తెలుగుకు అనుగుణంగా అమర్చబడింది.
- source_word: לְהוֹדִיעָם
  choice: వారికి తెలియజేస్తాడు
  rationale: హిఫీల్ రూపంలోని ‘తెలియజేయడం/అర్థమయ్యేలా చేయడం’ భావాన్ని సహజమైన తెలుగు క్రియతో అందిస్తుంది.
theological_decisions:
- issue: రెండవ పాదంలోని అపూర్ణ వాక్య నిర్మాణం
  choice: ఆయన తన నిబంధనను వారికి తెలియజేస్తాడు
  alternative: ఆయన నిబంధన వారికి దానిని తెలియజేయడానికే ఉంది
  rationale: హీబ్రూలో ‘ఆయన నిబంధన’ తరువాత ‘వారికి తెలియజేయుటకు’ అనే నిర్మాణం సంక్షిప్తంగా ఉంది. కీర్తన సమాంతరత్వం మరియు సాధారణ హీబ్రూ ప్రయోగం ప్రకారం దేవుడు తన నిబంధనను వారికి తెలియజేస్తాడనే భావం సహజం; అస్పష్టమైన ప్రత్యామ్నాయాన్ని పాఠ్యంలో బలవంతంగా నిలపలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. కవితాత్మక సమాంతరత్వాన్ని రెండు పాదాలుగా నిలిపి, అతిగా మతశాఖాపరమైన పదజాలాన్ని నివారించాం.
