revisions:
- from: తాను నివసించే స్థలం నుండి భూమిపై నివసించే వారందరినీ ఆయన శ్రద్ధగా చూస్తున్నాడు[a][b].
  to: తన నివాసస్థలం నుండి ఆయన భూమిపై నివసించే వారందరినీ శ్రద్ధగా గమనిస్తాడు[a][b].
  rationale: The revision removes an avoidable progressive nuance, uses more idiomatic modern Telugu for God's dwelling place and attentive observation, and improves the lexical-alternative footnote while preserving the source text's universal scope and the acknowledged land/earth ambiguity.
