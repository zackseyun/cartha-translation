source:
  edition: WLC
  text: מִֽ/מְּכוֹן שִׁבְתּ֥/וֹ הִשְׁגִּ֑יחַ אֶ֖ל כָּל יֹשְׁבֵ֣י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/014.yaml
  text: From the place of his dwelling he looks out on all the inhabitants of the earth[a][b].
translation:
  language: te
  text: తన నివాసస్థలం నుండి ఆయన భూమిపై నివసించే వారందరినీ శ్రద్ధగా గమనిస్తాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నిశితంగా గమనిస్తాడు,” “శ్రద్ధగా పరిశీలిస్తాడు.” హీబ్రూ క్రియ శ్రద్ధతో గమనించడం అనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ప్రాంతీయ అర్థంలో తీసుకుంటే “దేశంలో” అని కూడా అనువదించవచ్చు; అయితే ఇక్కడి సందర్భం విశ్వవ్యాప్తమైనది కాబట్టి “భూమిపై” అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמְּכוֹן
  choice: స్థలం నుండి
  rationale: מָכוֹן స్థిరపరచబడిన లేదా నియమితమైన స్థలాన్ని సూచిస్తుంది. שִׁבְתּוֹతో కలిసి తెలుగులో ‘తాను నివసించే స్థలం నుండి’ సహజంగా ఉండి మూలంలోని స్థలార్థాన్ని నిలుపుతుంది.
- source_word: שִׁבְתּוֹ
  choice: తాను నివసించే
  rationale: ישׁב మూలం నుండి వచ్చిన ఈ రూపం ‘ఆయన నివాసం’ లేదా ‘ఆయన కూర్చుండే స్థలం’ అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో సంబంధాన్ని సహజంగా వ్యక్తం చేయడానికి క్రియాత్మక నిర్మాణం ఎంచుకోబడింది.
- source_word: הִשְׁגִּיחַ
  choice: శ్రద్ధగా చూస్తున్నాడు
  rationale: שׁגח హిఫీల్ రూపం కేవలం చూడటం కాక శ్రద్ధగా పరిశీలించడం లేదా గమనించడం అనే భావాన్ని కలిగి ఉంది. ‘శ్రద్ధగా చూస్తున్నాడు’ ఆ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: אֶל
  choice: -నూ / వైపు దృష్టి సారించే భావం
  rationale: చూచుటను సూచించే క్రియతో אֶל లక్ష్యదిశను తెలియజేస్తుంది. తెలుగులో ప్రత్యేక విభక్తిపదం కంటే కర్మవిభక్తితో ఈ సంబంధం సహజంగా వ్యక్తమవుతుంది.
- source_word: כָּל
  choice: అందరినీ
  rationale: తరువాతి బహువచన మానవ సమూహంపై సమగ్రతను సూచిస్తుంది.
- source_word: יֹשְׁבֵי
  choice: నివసించే వారిని
  rationale: ישׁב కృదంతం ఇక్కడ నామవాచకంగా ‘నివసించేవారు’ అనే అర్థంలో ఉంది. ఈ పదబంధం ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: הָאָרֶץ
  choice: భూమిపై
  rationale: కీర్తన సందర్భంలోని విశ్వవ్యాప్త పరిధి కారణంగా నిర్దిష్ట ప్రాంతమైన ‘దేశం’ కంటే ‘భూమి’ అనేది అనుకూలం; స్థలసంబంధాన్ని తెలుగులో ‘భూమిపై’ తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుని పరిశీలన పరిధి
  choice: భూమిపై నివసించే వారందరినీ దేవుడు చూస్తున్నాడనే విశ్వవ్యాప్త పరిధి
  alternative: ఒక నిర్దిష్ట దేశంలో నివసించే వారిని చూస్తున్నాడనే ప్రాంతీయ పరిధి
  rationale: כָּל יֹשְׁבֵי הָאָרֶץ అనే పదబంధం, ఈ కీర్తన సందర్భంలో, ఒక ప్రాంతానికి పరిమితం కాక సమస్త మానవాళిని సూచిస్తుంది. అయినా הָאָרֶץ పదానికి సందర్భానుసారం ‘దేశం’ అనే అర్థం సాధ్యమని పాదటిప్పణిలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘తాను నివసించే స్థలం’ మూలంలోని నిర్మాణాన్ని సహజ తెలుగులో అందిస్తుంది; ‘శ్రద్ధగా చూస్తున్నాడు’ పరిశీలనాత్మక భావాన్ని నిలుపుతుంది.
