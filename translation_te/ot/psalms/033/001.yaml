id: PSA.33.1
reference: Psalms 33:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רַנְּנ֣וּ צַ֭דִּיקִים בַּֽ/יהוָ֑ה לַ֝/יְשָׁרִ֗ים נָאוָ֥ה תְהִלָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/001.yaml
  text: Shout for joy in Yahweh[a], you righteous[b]; praise is fitting for the upright.
translation:
  language: te
  text: నీతిమంతులారా, యాహ్వేలో ఆనందధ్వని చేయండి[a]; యథార్థవంతులకు స్తుతి తగినది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆనందంతో పాడండి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘యథార్థవంతులకు స్తుతి శోభనమైనది’ లేదా ‘స్తుతి యథార్థవంతులకు శోభిస్తుంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: רַנְּנוּ
  choice: ఆనందధ్వని చేయండి
  rationale: ఈ బహువచన ఆజ్ఞ ఆనందంతో వెలువడే బలమైన స్వరాన్ని సూచిస్తుంది. ‘ఆనందధ్వని చేయండి’ అనేది పాడడం లేదా హర్షధ్వని చేయడం అనే భావపరిధిని పూర్తిగా ఒకదానికే పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: צַדִּיקִים
  choice: నీతిమంతులారా
  rationale: ఆజ్ఞను అనుసరించి ఇది ప్రత్యక్ష సంబోధనగా ఉంది; తెలుగు సంబోధన రూపం ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַּיהוָה
  choice: యాహ్వేలో
  rationale: ב ఇక్కడ ఆనందానికి ఆధారం లేదా పరిధిని సూచిస్తుంది; అందువల్ల ‘యాహ్వేలో’ మూలంలోని ‘లో’ భావాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: మూలంలో ఉన్న దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో నేరుగా లిప్యంతరీకరించాం.
- source_word: לַיְשָׁרִים
  choice: యథార్థవంతులకు
  rationale: יָשָׁר యొక్క నైతిక సూటితనం, నిజాయితీ అనే భావాన్ని ‘యథార్థవంతులు’ సహజంగా తెలియజేస్తుంది; ל ఇక్కడ వారికి తగినదనే సంబంధాన్ని సూచిస్తుంది.
- source_word: נָאוָה
  choice: తగినది
  rationale: ఈ పదం తగినది, శోభనమైనది, సముచితమైనది అనే భావాలను కలిగి ఉంది. సందర్భంలో ‘తగినది’ సరళంగా, సహజంగా ఉంది.
- source_word: תְהִלָּה
  choice: స్తుతి
  rationale: ఈ నామవాచకం స్తుతిని లేదా స్తుతి వ్యక్తీకరణను సూచిస్తుంది; దాని రూపాన్ని పాటగా మాత్రమే పరిమితం చేయకుండా ‘స్తుతి’ అని అనువదించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: వచనం చతురక్షర దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దాన్ని బిరుదుగా మార్చకుండా, మూలంలోని వ్యక్తిగత నామాన్ని ‘యాహ్వే’గా నిలిపాం.
- issue: בַּיהוָהలో ב యొక్క సంబంధం
  choice: యాహ్వేలో ఆనందధ్వని చేయండి
  alternative: యాహ్వేకు ఆనందధ్వని చేయండి
  rationale: ב ను ఆనందానికి ఆధారం లేదా పరిధిగా తీసుకోవడం మూల నిర్మాణాన్ని కాపాడుతుంది; అయితే దేవుని ఉద్దేశించి ధ్వని చేయడం అనే భావసంభావ్యత పూర్తిగా తొలగిపోదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. కవితా సమాంతరతను నిలుపుతూ, అనవసరంగా ప్రాచీనమైన పదజాలాన్ని నివారించాం.
