source:
  edition: WLC
  text: יְֽהוָ֗ה הֵפִ֥יר עֲצַת גּוֹיִ֑ם הֵ֝נִ֗יא מַחְשְׁב֥וֹת עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/010.yaml
  text: Yahweh frustrates the counsel of the nations[a]; he thwarts the plans of the peoples.
translation:
  language: te
  text: 'యహ్వే[a] దేశాల సంకల్పాన్ని భగ్నపరుస్తాడు;

    ప్రజల పథకాలను నిష్ఫలం చేస్తాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో YHWH అనే దైవనామం; ‘యెహోవా’ అనేది ప్రత్యామ్నాయ సంప్రదాయ రూపం.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామం (YHWH) స్థానంలో బిరుదును పెట్టకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: הֵפִיר
  choice: భగ్నం చేస్తాడు
  rationale: హిఫీల్ రూపం ఆలోచన లేదా సంకల్పాన్ని చెదరగొట్టి అది కార్యరూపం దాల్చకుండా చేయడాన్ని సూచిస్తుంది; ‘భగ్నం చేస్తాడు’ ఈ క్రియాశీల భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עֲצַת
  choice: ఆలోచనను
  rationale: עֵצָהకు సలహా, ఆలోచన, సంకల్పం అనే భావాలు ఉన్నాయి. జనాంగాల సమష్టి యోచనను సూచించే సందర్భంలో ‘ఆలోచన’ సహజంగా ఉండి, రెండవ పాదంలోని ‘పథకాలు’తో కవితాత్మక భేదాన్ని నిలుపుతుంది.
- source_word: גּוֹיִם
  choice: జనాంగాల
  rationale: ఇక్కడ ఈ పదం ఇశ్రాయేలీయేతరులను మతపరంగా గుర్తించడం కంటే విస్తృతంగా దేశజనాలను సూచిస్తుంది; ‘జనాంగాలు’ ఆ సమష్టి భావాన్ని అందిస్తుంది.
- source_word: הֵנִיא
  choice: నిష్ఫలం చేస్తాడు
  rationale: ఉద్దేశించిన కార్యం నెరవేరకుండా అడ్డుకోవడం లేదా దారి మళ్లించడం అనే భావాన్ని ఈ హిఫీల్ క్రియ ఇక్కడ కలిగిస్తుంది; ‘నిష్ఫలం చేస్తాడు’ ఫలితాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מַחְשְׁבוֹת
  choice: పథకాలను
  rationale: ఈ పదానికి ఆలోచనలు, ఉద్దేశాలు, పన్నాగాలు అనే అర్థాలు సాధ్యమైనా, עֲצַתకు సమాంతరంగా ఇక్కడ కార్యాచరణ కోసం వేసిన పథకాలనే ప్రధానంగా సూచిస్తుంది.
- source_word: עַמִּים
  choice: ప్రజల
  rationale: గోయిమ్‌కు సమాంతరంగా వచ్చినప్పటికీ వేరైన పదాన్ని వాడిన హీబ్రూ కవితా నిర్మాణాన్ని ‘జనాంగాలు/ప్రజలు’ అనే భేదంతో నిలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా లిప్యంతరీకరించడం మూలంలోని నామాన్ని స్పష్టంగా ఉంచుతుంది; సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కవితా శైలిని ఉపయోగించింది. రెండు సమాంతర పాదాల్లో ‘జనాంగాలు/ప్రజలు’, ‘ఆలోచన/పథకాలు’, ‘భగ్నం/నిష్ఫలం’ అనే భావభేదాలను నిలిపింది.
