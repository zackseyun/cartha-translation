source:
  edition: WLC
  text: כִּ֤י ה֣וּא אָמַ֣ר וַ/יֶּ֑הִי הֽוּא צִ֝וָּ֗ה וַֽ/יַּעֲמֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/009.yaml
  text: For he spoke[a], and it came to be; he commanded[b], and it stood firm.
translation:
  language: te
  text: ఎందుకంటే ఆయన పలికాడు[a], అది ఉనికిలోకి వచ్చింది; ఆయన ఆజ్ఞాపించాడు[b], అది స్థిరంగా నిలిచింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది అయింది”; హీబ్రూ చాలా సంక్షిప్తంగా “అది అయింది/ఉనికిలోకి వచ్చింది” అని చెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అది నిలిచింది” లేదా “అది స్థాపించబడింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి సందర్భానికి కారణాన్ని తెలియజేసే సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: הוּא
  choice: ఆయన
  rationale: దేవుని సూచించే స్వతంత్ర సర్వనామాన్ని గౌరవప్రదమైన తెలుగు రూపంలో నిలుపుతుంది; హీబ్రూ కవితా సమాంతరతలోని ఉద్ఘాటన సందర్భం ద్వారా వ్యక్తమవుతుంది.
- source_word: אָמַר
  choice: పలికాడు
  rationale: ‘చెప్పాడు’ కంటే కవితాత్మక గాంభీర్యాన్ని కలిగి ఉండి, దైవ వాక్కు యొక్క ప్రభావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיְהִי
  choice: అది ఉనికిలోకి వచ్చింది
  rationale: అత్యంత సంక్షిప్తమైన హీబ్రూ ‘అది అయింది/ఉనికిలోకి వచ్చింది’ అనే ఫలితార్థాన్ని, సృష్టి సందర్భంలో అతివ్యాఖ్యానం చేయకుండా స్పష్టంగా తెలియజేస్తుంది.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించాడు
  rationale: ఆజ్ఞ జారీచేయడాన్ని నేరుగా తెలిపి, మొదటి పాదంలోని ‘పలికాడు’తో సమాంతరతను కాపాడుతుంది.
- source_word: וַיַּעֲמֹד
  choice: అది స్థిరంగా నిలిచింది
  rationale: עמד యొక్క ‘నిలిచింది’ అనే దృశ్యరూపాన్ని కాపాడుతూ, ఇక్కడి స్థాపితమైన లేదా దృఢమైన ఫలితార్థాన్ని సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: దైవ వాక్కు తరువాత సృష్టి/ఫలిత భాష
  choice: మొదటి ఫలితాన్ని ‘అది ఉనికిలోకి వచ్చింది’గా, రెండవదాన్ని ‘అది స్థిరంగా నిలిచింది’గా అనువదించడం.
  alternative: ‘అది అయింది / అది నిలిచింది’ లేదా ‘అది ఏర్పడింది / అది స్థాపించబడింది’.
  rationale: దేవుని పలుకు, ఆజ్ఞ తక్షణమూ స్థిరమూ అయిన ఫలితాన్ని కలిగిస్తాయని కవితాత్మక సమాంతరత తెలియజేస్తుంది. ఈ రూపం అదనపు సిద్ధాంత వివరణను చేర్చకుండా ఆ ప్రభావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి. రెండు పాదాల సమాంతర నిర్మాణాన్ని ‘ఆయన… అది…; ఆయన… అది…’ రూపంలో కాపాడాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
