    rationale: Although interpretively sound, it shifts from ‘a horse is a false hope’ to an explicit act of trusting. Keeping the horse as subject better preserves the Hebrew wording and parallelism.
  revised_text: విడుదల కొరకు గుర్రం మోసపూరితమైన ఆశ; తన అపార బలంతోనూ అది రక్షించలేడు.[a]
