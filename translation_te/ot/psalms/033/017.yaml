source:
  edition: WLC
  text: שֶׁ֣קֶר הַ֭/סּוּס לִ/תְשׁוּעָ֑ה וּ/בְ/רֹ֥ב חֵ֝יל֗/וֹ לֹ֣א יְמַלֵּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/017.yaml
  text: A horse is a false hope for deliverance[b][a], and by its great strength it cannot rescue.
translation:
  language: te
  text: విడుదల కొరకు గుర్రం మోసపూరితమైన ఆశ; తన అపార బలంతోనూ అది రక్షించలేడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: శబ్దార్థంగా, “విడుదల కొరకు గుర్రం అబద్ధం.” హెబ్రీ పదబంధం సంక్షిప్తంగా ఉంది; విడుదల సాధించడానికి గుర్రం మోసపుచ్చే లేదా వ్యర్థమైన ఆధారమని దీని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר הַסּוּס
  choice: గుర్రాన్ని నమ్మడం వృథా ఆశ
  rationale: శబ్దార్థంగా ఈ సంక్షిప్త హెబ్రీ పదబంధం ‘గుర్రం అబద్ధం’ అని ఉంటుంది. సందర్భంలో గుర్రం విడుదలకు నమ్మదగని, మోసపుచ్చే ఆధారమని భావం; సహజమైన ఆధునిక తెలుగులో ‘గుర్రాన్ని నమ్మడం వృథా ఆశ’ దానిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִתְשׁוּעָה
  choice: విడుదల కోసం
  rationale: יְשׁוּעָה అనే పదానికి రక్షణ, విడుదల, విజయం అనే అర్థాలు సాధ్యం. సైనిక సందర్భంలో ప్రమాదం నుంచి విడుదల అనే భావం ప్రధానమైనందున ఈ ఎంపిక చేయబడింది.
- source_word: וּבְרֹב חֵילוֹ
  choice: దానికి ఎంతో బలం ఉన్నా
  rationale: బేత్ ఉపసర్గ సాధనం లేదా పరిస్థితిని సూచించగలదు. ఇక్కడ గుర్రానికి అపార బలం ఉన్నప్పటికీ అది రక్షించలేదనే విరుద్ధ భావాన్ని సహజ తెలుగులో ఈ నిర్మాణం వ్యక్తం చేస్తుంది.
- source_word: לֹא יְמַלֵּט
  choice: అది రక్షించలేదు
  rationale: מלט పియేల్ రూపం ‘విడిపించు, రక్షించు’ అని అర్థం. హెబ్రీలోని సాధారణ నిరాకరణను కాపాడుతూ, సామెతసదృశ సత్యాన్ని తెలుగులో సహజంగా తెలిపేందుకు ‘రక్షించలేదు’ వాడబడింది.
theological_decisions:
- issue: תְּשׁוּעָה పదంలోని రక్షణ/విడుదల/విజయం అర్థపరిధి
  choice: విడుదల
  alternative: రక్షణ; విజయం
  rationale: ఈ కీర్తనలో యుద్ధబలం, గుర్రం ప్రస్తావన ఉన్నందున లోకసంబంధమైన ప్రమాదం నుంచి విడుదల అనే భావం సరిపోతుంది; పదానికి ఉండే విస్తృత ఆధ్యాత్మిక భావాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, కీర్తనకు తగిన గంభీరతతో అనువదించబడింది. హెబ్రీ కవితలోని సమాంతర భావాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో నిలిపింది.
