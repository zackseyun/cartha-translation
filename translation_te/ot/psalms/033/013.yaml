source:
  edition: WLC
  text: מִ֭/שָּׁמַיִם הִבִּ֣יט יְהוָ֑ה רָ֝אָ֗ה אֶֽת כָּל בְּנֵ֥י הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/013.yaml
  text: From heaven Yahweh looks[a]; he sees all the sons of man.
translation:
  language: te
  text: ఆకాశం నుండి యాహ్వే చూస్తున్నాడు; మానవులందరినీ[a] ఆయన చూస్తున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'పదశః: ‘మనుష్యుని కుమారులందరినీ’; ఇది మానవులందరినీ సమష్టిగా సూచించే హీబ్రూ కవితా ప్రయోగం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁמַיִם
  choice: ఆకాశం నుండి
  rationale: מִן మూలస్థానాన్ని సూచిస్తుంది. שָׁמַיִם రూపపరంగా బహువచనమైనా, ఈ సందర్భంలో సహజమైన ఆధునిక తెలుగు ప్రయోగం ‘ఆకాశం నుండి’.
- source_word: הִבִּיט
  choice: చూస్తున్నాడు
  rationale: హిఫిల్ రూపం దృష్టి సారించి చూడడాన్ని సూచిస్తుంది. కవిత్వంలోని సాధారణ, నిరంతర సత్యాన్ని తెలుగులో వర్తమాన కొనసాగింపు రూపంతో సహజంగా వ్యక్తం చేశాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ ధ్వన్యంతరీకరణను తెలుగులో ఇచ్చాం.
- source_word: רָאָה
  choice: ఆయన చూస్తున్నాడు
  rationale: ראה యొక్క ప్రాథమిక అర్థం ‘చూడు’. ముందు క్రియలాగే ఇది సాధారణంగా ఎల్లప్పుడూ వర్తించే సత్యాన్ని తెలియజేస్తుంది; కర్త స్పష్టత కోసం ‘ఆయన’ చేర్చబడింది.
- source_word: כָּל בְּנֵי הָאָדָם
  choice: మానవులందరినీ
  rationale: పదశః ‘మనుష్యుని కుమారులందరినీ’ అనే హీబ్రూ కవితా నుడికారం మానవజాతి మొత్తాన్ని సూచిస్తుంది. తెలుగులో తప్పుగా కేవలం పురుషులను సూచించకుండా, దాని సమష్టి భావాన్ని ప్రధాన పాఠ్యంలో సహజంగా అందించాం; పదశః రూపాన్ని పాదటీకలో ఉంచాం.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామమే ఉంది. ‘ప్రభువు’ అని బిరుదుగా మార్చకుండా, ‘Yahweh’ ఉచ్చారణకు దగ్గరైన తెలుగు రూపం ‘యాహ్వే’ను వాడాం.
- issue: בְּנֵי הָאָדָם యొక్క సమష్టి సూచన
  choice: మానవులందరినీ
  alternative: మనుష్యుని కుమారులందరినీ
  rationale: హీబ్రూ పదబంధం రూపంలో పుంలింగమైనప్పటికీ, ఇక్కడ అది స్త్రీపురుషులందరితో కూడిన మానవజాతిని సూచించే కవితా నుడికారం. ప్రధాన పాఠ్యంలో ఆ ఉద్దేశిత విస్తృత అర్థాన్ని ఇచ్చి, రూపపరమైన పదశః భావాన్ని పాదటీకలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా వాక్యనిర్మాణం వాడబడింది. సమాంతర క్రియలను నిలుపుతూ, హీబ్రూ యొక్క సాధారణ వర్తమాన భావాన్ని ‘చూస్తున్నాడు’తో వ్యక్తం చేశాం.
