source:
  edition: WLC
  text: נַ֭פְשֵׁ/נוּ חִכְּתָ֣ה לַֽ/יהוָ֑ה עֶזְרֵ֖/נוּ וּ/מָגִנֵּ֣/נוּ הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/020.yaml
  text: Our soul waits for Yahweh[a]; he is our help and our shield.
translation:
  language: te
  text: మన ప్రాణం యాహ్వే కోసం నిరీక్షిస్తోంది[a]; ఆయనే మన సహాయం, మన డాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మన ప్రాణం” అంటే కేవలం శరీరానికి వేరైన ఆత్మభాగం కాదు; ఇక్కడ అది సమాజమంతటి అంతరంగ స్వరూపాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשֵׁנוּ
  choice: మన ప్రాణం
  rationale: నెఫెష్ అనే పదం ఇక్కడ కేవలం దేహానికి వేరైన ఆత్మభాగాన్ని కాక, సమాజమంతటి అంతరంగ స్వరూపాన్ని సూచిస్తుంది. ఏకవచన సామూహిక రూపాన్ని, హెబ్రీ కవితా చిత్రాన్ని నిలుపుతుంది.
- source_word: חִכְּתָה
  choice: నిరీక్షిస్తోంది
  rationale: ఈ క్రియ ఆశాభావంతో ఎదురుచూడడాన్ని సూచిస్తుంది. హెబ్రీ పరిపూర్ణ రూపాన్ని సందర్భానుగుణమైన వర్తమాన భావంతో సహజంగా అందిస్తుంది.
- source_word: לַיהוָה
  choice: యాహ్వే కోసం
  rationale: ל ఉపసర్గ నిరీక్షణ ఎవరిని లక్ష్యంగా చేసుకుందో తెలియజేస్తుంది; దేవుని వ్యక్తిగత నామమైన יהוהను ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: עֶזְרֵנוּ
  choice: మన సహాయం
  rationale: עֵזֶר అనే నామవాచకంలోని ‘సహాయం’ అనే భావాన్ని వ్యక్తివాచకమైన ‘సహాయకుడు’గా మార్చకుండా నిలుపుతుంది.
- source_word: וּמָגִנֵּנוּ
  choice: మన డాలు
  rationale: מָגֵן యొక్క స్పష్టమైన రక్షణ రూపకాన్ని ‘రక్షకుడు’ అని వివరణాత్మకంగా మార్చకుండా కాపాడుతుంది.
- source_word: הוּא
  choice: ఆయనే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగులో ‘ఆయనే’ సహజంగా వ్యక్తం చేస్తుంది; మూలంలో లేని ‘ఒక్కడే’ అనే భావాన్ని చేర్చదు.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో నేరుగా ఉన్న నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా అందించడం ద్వారా వ్యక్తిగత దైవనామాన్ని నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి. హెబ్రీలోని సామూహిక ఏకవచనం, నిరీక్షణ భావం, ‘డాలు’ అనే రక్షణ రూపకం నిలుపబడ్డాయి.
