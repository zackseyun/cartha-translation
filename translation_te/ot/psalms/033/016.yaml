translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తన కవిత్వానికి తగిన సంక్షిప్తమైన రెండు సమాంతర పాదాలుగా అనువదించబడింది. ‘వల్ల’ సాధనార్థాన్ని సహజంగా తెలియజేస్తుంది; ‘రక్షించబడడు / తప్పించుకోడు’ అనే జత మూలంలోని సమాంతరమైనా భిన్నమైన క్రియలను నిలుపుతుంది.
