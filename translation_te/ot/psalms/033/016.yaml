source:
  edition: WLC
  text: אֵֽין הַ֭/מֶּלֶךְ נוֹשָׁ֣ע בְּ/רָב חָ֑יִל גִּ֝בּ֗וֹר לֹֽא יִנָּצֵ֥ל בְּ/רָב כֹּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/016.yaml
  text: The king is not saved by a great army[b][a]; a warrior is not delivered by great strength.
translation:
  language: te
  text: గొప్ప సైన్యం వల్ల రాజు రక్షించబడడు[a]; అధిక బలం వల్ల వీరుడు[b] తప్పించుకోడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అధిక బలం వల్ల’; ఇక్కడ ‘సైన్యం’గా అనువదించిన హీబ్రూ పదం బలాన్ని లేదా విస్తృతంగా సైనిక వనరులను కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘బలవంతుడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: రక్షించబడడు
  rationale: హీబ్రూ నిరాకరణను తరువాతి నిఫాల్ కృదంతంతో కలిపి, తెలుగులో సహజంగా క్రియలోనే ప్రతికూలార్థాన్ని వ్యక్తం చేసింది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: హీబ్రూలో నిర్దిష్ట విభక్త్యర్థక ఉపపదం ఉన్నా, ఇక్కడ ఒక సాధారణ సత్యాన్ని తెలిపే ఏకవచనంగా ఉంది; తెలుగులో ‘రాజు’ సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: נוֹשָׁע
  choice: రక్షించబడడు
  rationale: ישׁע ధాతువు నిఫాల్ రూపం ‘రక్షింపబడడం/విడిపించబడడం’ అనే భావాన్ని ఇస్తుంది. మొదటి పాదంలో విస్తృతమైన బైబిలు ప్రయోగాన్ని నిలుపుకోవడానికి ‘రక్షించబడడు’ ఎంచుకుంది.
- source_word: בְּרָב חָיִל
  choice: గొప్ప సైన్యం వల్ల
  rationale: בְּ ఇక్కడ సాధనాన్ని సూచిస్తుంది. חָיִל బలం, సైనిక వనరులు, సైన్యం అనే అర్థాలు కలిగి ఉండగలదు; రాజు మరియు వీరుడు ఉన్న యుద్ధ సందర్భంలో ‘సైన్యం’ ప్రధాన భావంగా సహజంగా సరిపోతుంది, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: גִּבּוֹר
  choice: వీరుడు
  rationale: బలవంతుడైన లేదా పరాక్రమశాలి యోధుణ్ణి సూచిస్తుంది. ‘వీరుడు’ ఆధునిక తెలుగులో సంక్షిప్తంగా, గౌరవప్రదంగా ఉండి యుద్ధసందర్భానికి సరిపోతుంది.
- source_word: לֹא יִנָּצֵל
  choice: తప్పించుకోడు
  rationale: נצל నిఫాల్ రూపం రక్షింపబడడం, విడిపించబడడం, ప్రమాదం నుంచి తప్పించుకోవడం అనే భావాలను కలిగి ఉంది. రెండో పాదంలో ‘తప్పించుకోడు’ సైనిక ప్రమాదం నుంచి బయటపడలేడనే భావాన్ని సహజంగా వ్యక్తం చేస్తూ మొదటి పాదంలోని పదాన్ని అనవసరంగా పునరావృతం చేయదు.
- source_word: בְּרָב כֹּחַ
  choice: అధిక బలం వల్ల
  rationale: רָב పరిమాణాధిక్యాన్ని, כֹּחַ శక్తి లేదా బలాన్ని సూచిస్తాయి. ‘అధిక బలం’ మూలంలోని పరిమాణ భావాన్ని స్పష్టంగా నిలుపుతుంది.
