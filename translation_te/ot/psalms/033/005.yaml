    text: లేదా, ‘విశ్వసనీయ ప్రేమ.’ హీబ్రూ חֶסֶד ప్రేమతోపాటు నిబద్ధతను, విశ్వసనీయతను కూడా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: ప్రేమిస్తాడు
  rationale: పుంలింగ ఏకవచన Qal కృదంతం ఇక్కడ యాహ్వే స్వభావాన్ని నిరంతరంగా వర్ణిస్తుంది; ఆధునిక తెలుగులో వర్తమాన క్రియారూపం సహజంగా ఉండి ఆ అలవాటైన, స్థిరమైన భావాన్ని నిలుపుతుంది.
- source_word: צְדָקָה
  choice: నీతి
  rationale: מִשְׁפָּטతో జతగా ఉన్నందున ఇది న్యాయనిర్ణయాన్ని పునరుక్తి చేయకుండా నైతిక సదాచారాన్ని సూచిస్తుంది.
- source_word: מִשְׁפָּט
  choice: న్యాయం
  rationale: ఈ సందర్భంలో న్యాయమైన తీర్పు, న్యాయవ్యవస్థ అనే విస్తృత నైతిక భావం ఉంది; ‘నీతి, న్యాయం’ అనే జత మూలంలోని భేదాన్ని కాపాడుతుంది.
- source_word: חֶסֶד
  choice: నిలకడైన ప్రేమ
  rationale: ఈ పదంలో ప్రేమ, విశ్వసనీయత, నిబద్ధత అనే భావాలు కలిసివున్నాయి. ‘నిలకడైన ప్రేమ’ సాధారణ పాఠకులకు సహజంగా ఉండి ప్రేమ యొక్క నిరంతరత్వాన్ని తెలియజేస్తుంది; మరో సాధ్యమైన భావాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: మూలంలోని దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: מָלְאָה
  choice: నిండివుంది
  rationale: స్త్రీలింగ ఏకవచన perfect రూపం ఇక్కడ ప్రస్తుత స్థితి లేదా ఫలితస్థితిని సూచిస్తుంది; ‘నిండివుంది’ తెలుగులో ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָאָרֶץ
  choice: భూమి
  rationale: కీర్తనలోని విశ్వవ్యాప్త సందర్భం కారణంగా స్థానిక ‘దేశం’ కన్నా ‘భూమి’ సరైనది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా లేదా ప్రభువు
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు అనుగుణంగా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలరూపాన్ని మరింత ప్రత్యక్షంగా కాపాడుతుంది.
- issue: חֶסֶדలోని ప్రేమ–విశ్వసనీయత భావసమ్మేళనం
  choice: నిలకడైన ప్రేమ
  alternative: నమ్మకమైన ప్రేమ
  rationale: ఏ ఒక్క తెలుగు పదబంధమూ חֶסֶד యొక్క ప్రేమ, కరుణ, నిబద్ధత, విశ్వసనీయత అన్న భావాలన్నింటినీ పూర్తిగా మోయదు. ప్రధాన పాఠంలో నిరంతర ప్రేమను ముందుకు తెచ్చి, విశ్వసనీయతను ప్రత్యామ్నాయంగా పాదసూచికలో ఉంచడం మూలంలోని భావవిస్తృతిని అనవసరంగా సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. ‘నీతి, న్యాయం’ అనే సుపరిచిత జతను నిలిపి, కవితాత్మక రెండో వాక్యభాగాన్ని సంక్షిప్తంగా ఉంచాం. పాదసూచిక గుర్తు సంబంధిత חֶסֶד అనువాదం వెంటనే ఉంచబడింది.
