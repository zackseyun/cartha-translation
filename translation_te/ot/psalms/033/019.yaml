  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తన కవితా సమాంతర నిర్మాణాన్ని నిలుపుతూ రెండు పాదాలుగా రూపొందించబడింది. పదప్రయోగం గంభీరంగా ఉన్నప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా ఉంది.
