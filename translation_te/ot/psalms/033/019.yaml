  yaml_path: translation/ot/psalms/033/019.yaml
  text: to deliver their soul from death and to keep them alive in famine[a].
translation:
  language: te
  text: 'మరణం నుండి వారి ప్రాణాన్ని విడిపించడానికి,

    కరవులో వారిని సజీవంగా ఉంచడానికి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వారి ప్రాణాన్ని’ అనే మాటను ‘వారి జీవాన్ని’ లేదా ‘వారి ప్రాణాలను’ అని కూడా అనువదించవచ్చు. హెబ్రీ పదం నెఫెష్ ప్రాణం, వ్యక్తి, లేదా జీవం అనే అర్థాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַצִּיל
  choice: విడిపించడానికి
  rationale: నצל హిఫీల్ రూపం ప్రమాదం నుండి తప్పించడం లేదా రక్షించడం అనే అర్థాన్ని ఇస్తుంది. ‘మరణం నుండి విడిపించడం’ తెలుగు కవితా సందర్భంలో సహజంగా ఉండి, రక్షణ విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: מִמָּוֶת
  choice: మరణం నుండి
  rationale: מן ఉపసర్గతో వచ్చిన מָוֶת, మరణం నుండి తప్పించడాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: נַפְשָׁם
  choice: వారి ప్రాణాన్ని
  rationale: נֶפֶשׁ ఇక్కడ ప్రాణం, జీవం, లేదా వ్యక్తి అనే భావాలను కలిగి ఉండవచ్చు. ఏకవచన రూపానికి బహువచన స్వామ్య ప్రత్యయం జతచేయబడిన నిర్మాణాన్ని ‘వారి ప్రాణాన్ని’ నిలుపుతుంది; సందర్భంలో ఇది వారి జీవరక్షణను సూచిస్తుంది.
- source_word: וּלְחַיּוֹתָם
  choice: వారిని సజీవంగా ఉంచడానికి
  rationale: חיה యొక్క ఈ రూపం చనిపోకుండా జీవించి ఉండేలా కాపాడడం అనే భావాన్ని ఇస్తుంది. ‘సజీవంగా ఉంచడం’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: בָּרָעָב
  choice: కరవులో
  rationale: רָעָב ఇక్కడ వ్యక్తిగత ఆకలి కంటే ఆహార కొరత లేదా కరవును సూచిస్తుంది. ‘కరవులో’ హెబ్రీ పదబంధపు సంక్షిప్తతను కాపాడుతుంది.
