id: PSA.33.6
reference: Psalms 33:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בִּ/דְבַ֣ר יְ֭הוָה שָׁמַ֣יִם נַעֲשׂ֑וּ וּ/בְ/ר֥וּחַ פִּ֝֗י/ו כָּל צְבָאָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/006.yaml
  text: By the word of Yahweh the heavens were made[a], and by the breath of his mouth all their host.
translation:
  language: te
  text: యాహ్వే మాటచేత ఆకాశాలు చేయబడ్డాయి; ఆయన నోటి ఊపిరిచేత[a] వాటి సైన్యమంతా చేయబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన నోటి ఆత్మచేత.” హీబ్రూ పదానికి “ఊపిరి,” “గాలి,” లేదా “ఆత్మ” అనే అర్థాలు రావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּדְבַר
  choice: వాక్కుచేత
  rationale: בְּ ఉపసర్గం ఇక్కడ సాధనార్థకంగా ఉంది. ‘వాక్కుచేత’ అనే ప్రయోగం ఆకాశాలు యెహోవా పలికిన మాట ద్వారా ఉనికిలోకి వచ్చాయనే భావాన్ని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో ఉంచింది.
- source_word: שָׁמַיִם
  choice: ఆకాశాలు
  rationale: హీబ్రూ బహువచన రూపాన్ని నిలుపుతూ, కేవలం కనిపించే ఆకాశానికే పరిమితం కాని సృష్టి సందర్భానికి సరిపోతుంది.
- source_word: נַעֲשׂוּ
  choice: చేయబడ్డాయి
  rationale: עשה అనే సాధారణ ‘చేయు/నిర్మించు’ క్రియకు నేరమైన సమానం. మూలంలో లేని ברא భావబలాన్ని తెచ్చే ‘సృష్టించబడ్డాయి’ కంటే ఇది ఖచ్చితమైనది.
- source_word: וּבְרוּחַ
  choice: ఆయన నోటి ఊపిరిచేత
  rationale: רוּחַకు ఊపిరి, గాలి, ఆత్మ అనే అర్థాలు ఉండగలవు. ‘నోటి’ అనే సమీప పదంతో ఉన్న కవితా సమాంతరతలో ‘ఊపిరి’ ప్రధాన భావంగా సహజంగా సరిపోతుంది; ‘ఆత్మ’ను పాదసూచికలో నిలిపింది.
- source_word: פִּיו
  choice: ఆయన నోటి
  rationale: ‘వాక్కు’తో ఉన్న కవితా సమాంతరతను, మూలంలోని మానవరూప వర్ణనను కాపాడుతుంది.
- source_word: כָּל־צְבָאָם
  choice: వాటి సైన్యమంతా
  rationale: כָּל యొక్క సమగ్ర భావాన్ని ‘అంతా’ తెలియజేస్తుంది. צבא ఆకాశాలకు సంబంధించిన సమూహాన్ని—నక్షత్రాలు మొదలైన ఆకాశగణాన్ని—‘సైన్యం’ అనే కవితాత్మక రూపంలో సూచిస్తుంది; బహువచన పూర్వపదమైన ‘ఆకాశాలు’ను ‘వాటి’ స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: సృష్టి సందర్భంలో רוּחַ మరియు సాధ్యమైన త్రిత్వ ప్రతిధ్వని
  choice: ఊపిరి
  alternative: ఆత్మ
  rationale: ‘యెహోవా వాక్కు’ // ‘ఆయన నోటి ఊపిరి’ అనే సమాంతర నిర్మాణం ‘ఊపిరి’ని ప్రధాన అర్థంగా బలపరుస్తుంది. అయినా רוּחַకు ‘ఆత్మ’ అనే నిజమైన అర్థసాధ్యత ఉన్నందున దానిని పాదసూచికలో ఉంచి వేదాంతపరమైన ఉద్వేగాన్ని పరిష్కరించకుండా కాపాడింది.
- issue: రెండవ పాదంలో క్రియ అధ్యాహారం
  choice: ‘చేయబడింది’ని తెలుగులో స్పష్టంగా పునరుద్ధరించడం
  alternative: క్రియ లేకుండా ‘వాటి సైన్యమంతా’ అని ముగించడం
  rationale: హీబ్రూ కవిత్వంలో మొదటి పాదంలోని נַעֲשׂוּ రెండవ పాదానికీ అధ్యాహారంగా వర్తిస్తుంది. సహజమైన, సంపూర్ణమైన తెలుగు వాక్యానికి క్రియను పునరుద్ధరించింది; కొత్త భావాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని ఉపయోగించింది. ‘వాక్కు,’ ‘ఊపిరి,’ ‘సైన్యం’ అనే పదాలు మూలంలోని సమాంతరతను, సృష్టి చిత్రణను నిలుపుతాయి. ప్రతి పాదంలో ‘చేత’ వాడటం హీబ్రూ సాధనార్థక నిర్మాణాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
