source:
  edition: WLC
  text: יְהִֽי חַסְדְּ/ךָ֣ יְהוָ֣ה עָלֵ֑י/נוּ כַּ֝/אֲשֶׁ֗ר יִחַ֥לְנוּ לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/022.yaml
  text: Let your steadfast love be upon us, O LORD, even as we hope in you.
translation:
  language: te
  text: 'యెహోవా, నీ అచంచల ప్రేమ మాపై ఉండుగాక,

    మేము నిన్ను నిరీక్షిస్తున్నట్లే.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶסֶד (ḥesed)
  choice: నిబంధన ప్రేమ
  rationale: ఈ పదం ప్రేమ, విశ్వసనీయత, కృప అనే భావాలను కలిపి సూచిస్తుంది; దేవుని నిబంధనబద్ధమైన స్థిర ప్రేమను సంక్షిప్తంగా తెలియజేయడానికి ఈ పదబంధం ఎంచుకోబడింది.
- source_word: יְהוָה (YHWH)
  choice: యెహోవా
  rationale: మూలపాఠంలోని దేవుని ప్రత్యేక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో ఉంచింది.
- source_word: יִחַלְנוּ לָךְ (yiḥalnu lakh)
  choice: మేము నీ మీద నిరీక్షణ ఉంచినట్లే
  rationale: యָחַל క్రియలోని ఆశతో ఎదురుచూడడం/నిరీక్షించడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; לָךְ లోని దిశను ‘నీ మీద’గా చూపుతుంది.
- source_word: כַּאֲשֶׁר (kaʾasher)
  choice: ఉంచినట్లే
  rationale: ‘ఎలాగైతే/అనుగుణంగా’ అనే పోలిక లేదా అనుసరణ భావాన్ని నిలుపుతుంది; మూలంలో లేని బలవంతపు కారణార్థాన్ని చేర్చదు.
- source_word: יְהִי ... עָלֵינוּ (yehi ... ʿalenu)
  choice: మాపై ఉండుగాక
  rationale: జస్సివ్ ప్రార్థనా భావాన్నీ, ‘మాపై’ అనే స్థానిక రూపకాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: חֶסֶד యొక్క విస్తృత భావపరిధి
  choice: నిబంధన ప్రేమ
  alternative: స్థిరమైన ప్రేమ / కృప
  rationale: ఒక్క తెలుగు పదంతో పూర్తిగా అందని ప్రేమ-విశ్వసనీయత భావసముదాయాన్ని ‘నిబంధన ప్రేమ’ తగినంత స్పష్టంగా వ్యక్తపరుస్తుంది; అయితే ప్రేమ పరిమాణం మన నిరీక్షణకు మాత్రమే పరిమితమని చెప్పదు.
- issue: כַּאֲשֶׁר సంబంధం
  choice: నిరీక్షణ ఉంచినట్లే
  alternative: నిరీక్షణ ఉంచుతున్నందున / నిరీక్షణ మేరకు
  rationale: హీబ్రూ రూపం పోలిక, అనుగుణత, లేదా సంబంధాన్ని అనుమతిస్తుంది. అనువాదం కారణం లేదా ఖచ్చిత ప్రమాణం అని తేల్చకుండా ఆ ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ప్రార్థనాత్మక, గంభీరమైన శైలిని ఉపయోగించింది. కవితా సమతుల్యత కోసం సంబోధన మరియు నిరీక్షణ వాక్యభాగాన్ని మొదటి పాదంలో, ప్రధాన విజ్ఞప్తిని రెండవ పాదంలో ఉంచింది.
