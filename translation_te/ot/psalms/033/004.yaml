language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי יָשָׁ֥ר דְּבַר יְהוָ֑ה וְ/כָל מַ֝עֲשֵׂ֗/הוּ בֶּ/אֱמוּנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/004.yaml
  text: For the word of Yahweh is upright[b][a], and all his work is done in faithfulness.
translation:
  language: te
  text: 'ఎందుకంటే యాహ్వే వాక్కు యథార్థమైనది,

    ఆయన కార్యమంతా నమ్మకంగా చేయబడింది.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న స్తుతి పిలుపుకు కారణాన్ని తెలియజేసే హేత్వర్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: יָשָׁר
  choice: న్యాయమైనది
  rationale: ‘నిటారైనది’ అనే మూలచిత్రం ఇక్కడ నైతిక సరైనతను సూచిస్తుంది; ఆధునిక తెలుగులో ‘న్యాయమైనది’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: דְּבַר יְהוָה
  choice: యాహ్వే వాక్కు
  rationale: דָּבָר ఇక్కడ దేవుని పలుకు లేదా ప్రకటనను సూచిస్తుంది; ‘వాక్కు’ గౌరవప్రదమైన, సహజమైన తెలుగు పదం.
- source_word: וְכָל מַעֲשֵׂהוּ
  choice: ఆయన చేసే ప్రతి కార్యమూ
  rationale: హీబ్రూలో ఏకవచన సమష్టి రూపంలో ఉన్న ‘ఆయన కార్యమంతా’ అనే భావాన్ని సహజ తెలుగులో సమగ్రంగా వ్యక్తం చేస్తుంది.
- source_word: בֶּאֱמוּנָה
  choice: నమ్మకత్వంతో కూడినది
  rationale: אֱמוּנָה లోని స్థిరత్వం, విశ్వసనీయత, నమ్మకత్వం అనే గుణార్థాన్ని నామవాచక రూపంలో నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దానికి సమీపమైన తెలుగు లిప్యంతరీకరణను ఉపయోగించింది.
- issue: מַעֲשֵׂהוּ యొక్క ఏకవచన సమష్టి భావం
  choice: ఆయన చేసే ప్రతి కార్యమూ
  alternative: ఆయన కార్యమంతా
  rationale: ఏకవచన రూపంలోని సమష్టి పరిధిని కాపాడుతూ, దేవుని కార్యాలన్నిటినీ సూచించే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- issue: בֶּאֱמוּנָה తో క్రియలేని వాక్యభాగం
  choice: నమ్మకత్వంతో కూడినది
  alternative: నమ్మకత్వంతో జరుగుతుంది
  rationale: మూలంలోని క్రియలేని నిర్మాణాన్ని బలవంతంగా కార్యాచరణ క్రియగా మార్చకుండా, దేవుని కార్యానికి సహజసిద్ధమైన గుణంగా నమ్మకత్వాన్ని వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గౌరవప్రదమైన కవితా ధోరణిని ఉపయోగించింది. రెండు సమాంతర పాదాలను నిలిపి, అరుదైన లేదా మతశాఖాపరమైన పదజాలాన్ని నివారించింది.
