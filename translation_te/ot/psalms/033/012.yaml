source:
  edition: WLC
  text: אַשְׁרֵ֣י הַ֭/גּוֹי אֲשֶׁר יְהוָ֣ה אֱלֹהָ֑י/ו הָ/עָ֓ם בָּחַ֖ר לְ/נַחֲלָ֣ה לֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/012.yaml
  text: Blessed is the nation whose God is Yahweh[b][a], the people he has chosen for his inheritance.
translation:
  language: te
  text: యాహ్వే తన దేవుడైన జనము ధన్యము[a]; ఆయన తనకు స్వాస్థ్యంగా ఎన్నుకున్న ప్రజలు[b] ధన్యులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ధన్యము’ అనే చోట ‘సంతోషకరమైనది’ లేదా ‘భాగ్యవంతమైనది’ అని కూడా అనువదించవచ్చు. అయితే హీబ్రూ אַשְׁרֵי అనే ఆశీర్వచన ప్రయోగంలోని ఆరాధనా, ఒడంబడిక ధ్వనిని ‘ధన్యము’ మెరుగ్గా నిలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: రెండవ పాదం ముఖ్యంగా యాహ్వే తనకోసం ఎన్నుకున్న ఇశ్రాయేలు ప్రజలను సూచించే అవకాశం ఉంది; అయితే హీబ్రూ పాఠం కవితాత్మకంగా ‘ప్రజలు’ అనే పదాన్నే ఉంచుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: ధన్యము / ధన్యులు
  rationale: హీబ్రూ ఆశీర్వచన ప్రయోగం కేవలం భావోద్వేగమైన సంతోషాన్ని కాక, దేవుని అనుగ్రహంలో ఉన్న శుభస్థితిని సూచిస్తుంది. తెలుగులో వాక్యంలోని ‘జనము,’ ‘ప్రజలు’ అనే పదాలకు అనుగుణంగా ఏకవచన, బహువచన రూపాలు వాడబడ్డాయి.
- source_word: הַגּוֹי
  choice: జనము
  rationale: గּוֹי ఇక్కడ సామూహిక జాతీయ సముదాయాన్ని సూచిస్తుంది. ‘జనము’ సహజమైన తెలుగు పదంగా ఉండి, తరువాతి ‘ప్రజలు’తో కవితాత్మక సమాంతరతను నిలుపుతుంది.
- source_word: אֲשֶׁר
  choice: తన దేవుడుగా ఉన్న
  rationale: హీబ్రూ సంబంధవాచక నిర్మాణాన్ని తెలుగులో సహజమైన స్వామ్యార్థక సంబంధ వాక్యంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని ఒక బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ వ్యక్తినామానికి సమీపమైన ఆధునిక లిప్యంతరీకరణగా ఇచ్చింది.
- source_word: אֱלֹהָיו
  choice: తన దేవుడు
  rationale: మూడవ పురుష ఏకవచన స్వామ్య ప్రత్యయాన్ని ‘తన’ ద్వారా తెలుగులో సహజంగా వ్యక్తం చేసింది; సూచించబడుతున్నవాడు యాహ్వే కాబట్టి ‘దేవుడు’ వాడబడింది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: עָם ఒడంబడిక సంబంధమైన సామూహిక గుర్తింపును సూచించగలదు. ‘ప్రజలు’ అనే పదం మూలంలోని కవితాత్మక సమాంతరతను కాపాడుతుంది.
- source_word: בָּחַר
  choice: ఎన్నుకున్న
  rationale: హీబ్రూ సంపూర్ణ క్రియను, గతంలో జరిగిన ఎంపికకు కొనసాగుతున్న ఫలితం ఉందనే భావాన్ని సహజ తెలుగు విశేషణ క్రియారూపం ద్వారా తెలియజేస్తుంది.
- source_word: לְנַחֲלָה לוֹ
  choice: తనకు స్వాస్థ్యంగా
  rationale: ఈ పదబంధం దేవుడు తనకోసం కేటాయించుకున్న వారసత్వసదృశమైన సొత్తు లేదా స్వాధీనాన్ని సూచిస్తుంది. ‘స్వాస్థ్యంగా’ ఒడంబడిక భావాన్ని నిలుపుతూ తెలుగులో గౌరవప్రదంగా ఉంటుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలంలోని ఒడంబడిక నామాన్ని కాపాడుతుంది.
- issue: ‘జనము,’ ‘ప్రజలు’ ఎవరిని సూచిస్తాయి?
  choice: మూలంలోని కవితాత్మక పదాలనే ఉంచి, ప్రధాన పాఠంలో ఇశ్రాయేలు అని స్పష్టీకరించలేదు
  alternative: రెండు పదాలనూ ‘ఇశ్రాయేలు’ అని స్పష్టంగా అనువదించడం లేదా ఏ జనానికైనా వర్తించే సాధారణ ప్రకటనగా చేయడం
  rationale: సందర్భంలో ముఖ్యంగా ఇశ్రాయేలు ఉద్దేశించబడి ఉండవచ్చు; అయినా హీబ్రూ పాఠం ‘జనము,’ ‘ప్రజలు’ అనే సమాంతర పదాలనే వాడుతుంది. అందువల్ల ఆ అర్థ ఉద్రిక్తతను ప్రధాన పాఠంలో పరిష్కరించకుండా నిలుపుతుంది.
- issue: రెండవ పాదంలో ఆశీర్వచన క్రియను పునరుక్తి చేయడం
  choice: ‘ధన్యులు’ అని తెలుగులో పునరుక్తి
  alternative: ‘ప్రజలు’తోనే వాక్యాన్ని ముగించి, మొదటి ‘ధన్యము’ రెండవ పాదానికీ వర్తించేలా ఉంచడం
  rationale: హీబ్రూలో రెండవ పాదం మొదటి పాదానికి సమానాధికరణంగా ఉండి ఆశీర్వచనం రెండింటికీ వర్తిస్తుంది. తెలుగులో అర్థం స్పష్టంగా, సహజంగా ఉండేందుకు విధేయాన్ని పునరుక్తి చేసింది; కొత్త భావాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కీర్తనా శైలి వాడబడింది. ‘జనము—ప్రజలు’ అనే సమాంతరతను, ఆశీర్వచన ధోరణిని నిలిపి, స్పష్టత కోసం రెండవ పాదంలో ‘ధన్యులు’ను పునరుక్తి చేసింది.
