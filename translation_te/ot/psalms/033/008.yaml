source:
  edition: WLC
  text: יִֽירְא֣וּ מֵ֭/יְהוָה כָּל הָ/אָ֑רֶץ מִמֶּ֥/נּוּ יָ֝ג֗וּרוּ כָּל יֹשְׁבֵ֥י תֵבֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/008.yaml
  text: Let all the earth fear Yahweh[a]; let all the inhabitants of the world stand in awe of him.
translation:
  language: te
  text: 'భూమంతా యాహ్వేకు భయపడుగాక;

    లోకంలో నివసించే వారందరూ ఆయనకు భయపడి వణకుగాక.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనంటే భీతిల్లుగాక” లేదా “ఆయన సన్నిధిలో వణకుగాక.” హీబ్రూ క్రియ భయంతో కూడిన విస్మయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִירְאוּ מֵיְהוָה
  choice: యెహోవాకు భయపడాలి
  rationale: יִירְאוּ అనే అసంపూర్ణ క్రియ ఇక్కడ కవితాత్మక ప్రబోధం లేదా పిలుపు భావాన్ని కలిగిస్తుంది. מן విభక్తి יְהוָהతో కలిసి భయానికి గురియైన వ్యక్తిని సూచిస్తుంది. ‘భయపడాలి’ సాధారణ ఆధునిక తెలుగులో ఆ పిలుపునూ, భక్తిపూర్వక భయ విస్తృతినీ నిలుపుతుంది.
- source_word: כָּל הָאָרֶץ
  choice: భూమంతా
  rationale: తరువాతి పాదంలోని ‘లోకంలో నివసించే వారందరూ’ అనే సమాంతర పదబంధం వల్ల אֶרֶץ ఇక్కడ ఒక ప్రాంతం కాక సమస్త భూమిని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలో ఉన్న దేవుని ప్రత్యేక నామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా తెలిసిన ‘యెహోవా’ రూపంలో అందించాం.
- source_word: מִמֶּנּוּ יָגוּרוּ
  choice: ఆయనకు భయభక్తులతో వణకాలి
  rationale: גור ఇక్కడ భయం, దిగులు, వణుకు కలిసిన విస్మయభావాన్ని సూచిస్తుంది. మొదటి పాదంలోని יראతో ఉన్న కవితాత్మక సమాంతరతను నిలుపుతూ, కేవలం పునరుక్తి కాకుండా తీవ్రతను వ్యక్తం చేయడానికి ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: כָּל יֹשְׁבֵי תֵבֵל
  choice: లోకంలో నివసించే వారందరూ
  rationale: יֹשְׁבֵי అనేది నివసించేవారిని సూచించే కృదంత రూపం; תֵבֵל నివాసిత లోకాన్ని సూచిస్తుంది. ఈ తెలుగు రూపం సహజంగా ఉండి విశ్వవ్యాప్త భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని ప్రత్యేక దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’ను వాడాం; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరగా భావించబడే ప్రత్యామ్నాయం.
- issue: భయం మరియు భక్తిపూర్వక విస్మయం మధ్య భావ ఉద్రిక్తత
  choice: భయపడాలి … భయభక్తులతో వణకాలి
  alternative: భయపడాలి … ఆయనను చూసి విస్మయపడాలి
  rationale: ఈ రెండు హీబ్రూ క్రియల్లో నిజమైన భయం, భక్తిపూర్వక విస్మయం రెండూ అంతర్లీనంగా ఉన్నాయి. భయాన్ని కేవలం గౌరవంగా పలుచన చేయకుండా, రెండవ పాదంలో దాని తీవ్రతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనా కవిత్వానికి తగిన సంక్షిప్తత, సమాంతర నిర్మాణం, గంభీరతను నిలిపాం. ‘భయభక్తులతో’ సాధారణ పాఠకులకు అర్థమయ్యేలా భయం మరియు భక్తిపూర్వక విస్మయం రెండింటినీ కలుపుతుంది.
