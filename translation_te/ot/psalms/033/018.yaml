source:
  edition: WLC
  text: הִנֵּ֤ה עֵ֣ין יְ֭הוָה אֶל יְרֵאָ֑י/ו לַֽ/מְיַחֲלִ֥ים לְ/חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/018.yaml
  text: Behold[a], the eye of Yahweh is on those who fear him, on those who wait for his steadfast love,
translation:
  language: te
  text: 'ఇదిగో, యాహ్వే కన్ను ఆయనకు భయపడేవారిపై,

    ఆయన అచంచల ప్రేమ కోసం నిరీక్షించేవారిపై[a] ఉంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన అచంచల ప్రేమపై ఆశ పెట్టుకునేవారిపై.” హీబ్రూ క్రియకు నిరీక్షించడం, ఆశ పెట్టుకోవడం అనే రెండు భావాలూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని ఆకర్షించే హీబ్రూ అవ్యయపు సూచనాత్మక, కవితాత్మక బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: עֵין
  choice: కన్ను
  rationale: దేవుని శ్రద్ధగల పర్యవేక్షణను తెలిపే పారదర్శకమైన మానవరూపకాన్ని వ్యాఖ్యానించి విస్తరించకుండా యథాతథంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యనుసారంగా అందిస్తుంది.
- source_word: אֶל
  choice: పై ఉంది
  rationale: ‘వైపు’ అనే మూలభావం ఇక్కడ కన్ను ఎవరిమీద నిలిచి ఉందో తెలిపే హీబ్రూ ప్రయోగం; ‘పై ఉంది’ తెలుగులో సహజంగా శ్రద్ధగల దృష్టిని వ్యక్తం చేస్తుంది.
- source_word: יְרֵאָיו
  choice: ఆయనకు భయపడేవారు
  rationale: భక్తిపూర్వక భయాన్ని బలహీనపరచకుండా, వారిని లక్షణీకరించే కృదంత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַמְיַחֲלִים
  choice: నిరీక్షించేవారు
  rationale: హీబ్రూ క్రియలోని ఎదురుచూపు, ఆశాభావం రెండింటిలో ప్రధాన పాఠ్యంలో ఎదురుచూసే భంగిమను చూపుతుంది; ఆశ అనే సాధ్యమైన భావాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: לְחַסְדּוֹ
  choice: ఆయన అచంచల ప్రేమ కోసం
  rationale: חֶסֶד లోని స్థిరత్వం, నమ్మకమైన దయ, ఒడంబడిక సంబంధమైన ప్రేమ అనే విస్తృత భావాన్ని ‘అచంచల ప్రేమ’ సంక్షిప్తంగా అందిస్తుంది; לְ ను ముందున్న క్రియకు పూరకంగా ‘కోసం’ అని తీసుకుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా, ‘Yahweh’ ఉచ్చారణకు దగ్గరైన తెలుగు రూపంలో ఉంచింది.
- issue: חֶסֶד యొక్క భావవిస్తృతి
  choice: అచంచల ప్రేమ
  alternative: కరుణ / నమ్మకమైన ప్రేమ
  rationale: ‘కరుణ’ ఈ పదాన్ని కనికరానికి మాత్రమే పరిమితం చేయవచ్చు; ‘అచంచల ప్రేమ’ దేవుని స్థిరమైన, నమ్మకమైన అనుగ్రహాన్ని విస్తృతంగా నిలుపుతుంది.
- issue: יחל క్రియలో ఎదురుచూపు–ఆశ అనే ద్వంద్వ భావం
  choice: ప్రధాన పాఠ్యంలో ‘నిరీక్షించేవారు’; పాదసూచికలో ‘ఆశ పెట్టుకునేవారు’
  alternative: ప్రధాన పాఠ్యంలో ‘ఆశ పెట్టుకునేవారు’
  rationale: క్రియ రెండుభావాలను మోయగలదు. ఒకదానిని మాత్రమే తుదార్థంగా నిర్ణయించకుండా ప్రధాన పాఠ్యం మరియు పాదసూచిక ద్వారా నిజమైన పదార్థ అస్పష్టతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తనకు తగిన గంభీరమైన, కవితాత్మక శైలి పాటించబడింది. సమాంతర నిర్మాణాన్ని నిలుపుతూ అనవసర పునరుక్తిని నివారించింది.
