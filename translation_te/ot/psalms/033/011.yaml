id: PSA.33.11
reference: Psalms 33:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עֲצַ֣ת יְ֭הוָה לְ/עוֹלָ֣ם תַּעֲמֹ֑ד מַחְשְׁב֥וֹת לִ֝בּ֗/וֹ לְ/דֹ֣ר וָ/דֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/011.yaml
  text: The counsel of Yahweh stands forever[a], the plans of his heart from generation to generation.
translation:
  language: te
  text: 'యాహ్వే సంకల్పం శాశ్వతంగా నిలుస్తుంది;[a]

    ఆయన హృదయ సంకల్పాలు తరతరాలపాటు నిలుస్తాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మొదటి ‘సంకల్పం’కు ‘ఆలోచన’ లేదా ‘ఉద్దేశం’ అని, రెండవ ‘సంకల్పాలు’కు ‘ఆలోచనలు’ లేదా ‘ఉద్దేశాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת
  choice: ఆలోచన
  rationale: ఈ నామవాచకం ఆలోచన, సలహా, సంకల్పం అనే భావాలను కలిగి ఉంది. దేవుని ఉద్దేశపూర్వక నిర్ణయాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, దాని విస్తృత భావాన్ని కాపాడేందుకు ‘ఆలోచన’ ఎంచుకున్నాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: לְעוֹלָם
  choice: శాశ్వతంగా
  rationale: కాలాంతర స్థిరత్వాన్ని ఆధునిక, సహజ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: תַּעֲמֹד
  choice: నిలుస్తుంది
  rationale: ఇక్కడి అసంపూర్ణ క్రియ సాధారణంగా ఎల్లప్పుడూ నిజంగా ఉండే, కొనసాగుతున్న సత్యాన్ని సూచిస్తుంది; ‘నిలుస్తుంది’ దాని స్థిరత్వాన్ని కాపాడుతుంది.
- source_word: מַחְשְׁבוֹת
  choice: సంకల్పాలు
  rationale: ఈ పదానికి ఆలోచనలు, యోచనలు, ఉద్దేశాలు అనే అర్థాలు ఉన్నాయి. మొదటి పాదంతో సమాంతరంగా దేవుని ఉద్దేశపూర్వక యోచనలను సూచించేందుకు ‘సంకల్పాలు’ అనుకూలం.
- source_word: לִבּוֹ
  choice: ఆయన హృదయ
  rationale: హీబ్రూ భాషలో హృదయం ఆలోచనకు, చిత్తానికి కేంద్రం. దానిని ‘మనస్సు’గా వ్యాఖ్యానించకుండా మూలంలోని రూపకాన్ని నిలిపాం.
- source_word: לְדֹר וָדֹר
  choice: తరతరాల వరకు
  rationale: వరుసగా వచ్చే ప్రతి తరంలోనూ కొనసాగే స్థిరత్వాన్ని సహజమైన తెలుగు నుడికారంలో తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా పేరుగానే ఉంచాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణగా ‘యెహోవా’ను ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గంభీరతతోనూ సాధారణ పాఠకులకు స్పష్టంగానూ రూపొందించాం. హీబ్రూ సమాంతర నిర్మాణాన్ని రెండు పాదాలుగా నిలిపి, రెండవ పాదంలో సహజ తెలుగు కోసం ‘నిలుస్తాయి’ని పూరించాం.
