source:
  edition: WLC
  text: הוֹד֣וּ לַ/יהוָ֣ה בְּ/כִנּ֑וֹר בְּ/נֵ֥בֶל עָ֝שׂ֗וֹר זַמְּרוּ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/002.yaml
  text: Give thanks to Yahweh with the lyre[a]; make music to him with a ten-stringed harp.
translation:
  language: te
  text: 'యాహ్వేకు వీణతో కృతజ్ఞతలు తెలియజేయండి;

    పది తీగల నెవెల్‌తో[a] ఆయనను కీర్తించండి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘పది తీగల నెవెల్‌తో.’ ఈ ప్రాచీన తంతివాద్యం ఖచ్చితంగా ఏ రకమైనదో తెలియదు; దీనిని వీణ, హార్పు, లేదా లూట్ అని వివిధ రీతుల్లో అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: కృతజ్ఞతలు చెల్లించండి
  rationale: ידה హిఫిల్ ఆజ్ఞారూపం ఆరాధనా సందర్భంలో కృతజ్ఞతలు తెలియజేయడం లేదా స్తుతించడం అనే భావాన్ని ఇస్తుంది; ఇక్కడ ప్రత్యేకమైన కృతజ్ఞతా భావాన్ని నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: మూలంలోని దైవనామం יהוהను సాధారణ తెలుగు బైబిలు వాడుకలో గుర్తించదగిన ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: בְּכִנּוֹר
  choice: వీణతో
  rationale: כִּנּוֹר ఒక ప్రాచీన తీగవాద్యం; ఖచ్చితమైన ఆధునిక సమానం లేకపోయినా, ‘వీణ’ తెలుగు పాఠకులకు సహజమైన, గౌరవప్రదమైన సాధారణ తీగవాద్య పదం.
- source_word: בְּנֵבֶל עָשׂוֹר
  choice: పది తీగల స్వరమండలంతో
  rationale: נֵבֶל యొక్క ఖచ్చిత రూపం అనిశ్చితం; עָשׂוֹר తెలిపే పది తీగల లక్షణాన్ని స్పష్టంగా నిలుపుతూ, మొదటి వాద్యం నుంచి వేరుచేయడానికి ‘స్వరమండలం’ ఉపయోగించబడింది.
- source_word: זַמְּרוּ לוֹ
  choice: ఆయనకు సంగీతం చేయండి
  rationale: זמר పియేల్ రూపం గానం చేయడం లేదా వాద్యసంగీతంతో స్తుతించడం రెండింటినీ సూచించవచ్చు; వెంటనే వాద్యాలు ప్రస్తావించబడినందున ఈ విస్తృత అనువాదం సందర్భానికి సరిపోతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ఉంచింది. తెలుగు బైబిలు సంప్రదాయంలో విస్తృతంగా గుర్తించబడే రూపం ‘యెహోవా’; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరగా భావించబడే ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామూహిక ఆరాధనకు తగిన గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. రెండు ప్రాచీన వాద్యాల మధ్య తేడాను సాధ్యమైనంతవరకు నిలుపుతూ, రెండవ వాద్యపు అనిశ్చితిని పాదసూచికలో తెలిపింది.
