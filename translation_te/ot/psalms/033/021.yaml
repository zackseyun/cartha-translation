  text: כִּי ב֭/וֹ יִשְׂמַ֣ח לִבֵּ֑/נוּ כִּ֤י בְ/שֵׁ֖ם קָדְשׁ֣/וֹ בָטָֽחְנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/021.yaml
  text: For our heart rejoices in him[b][a], because we have trusted in his holy name.
translation:
  language: te
  text: ఎందుకంటే ఆయనలో మన హృదయం[b] ఆనందిస్తుంది[a]; ఎందుకంటే ఆయన పరిశుద్ధ నామంపై మనం నమ్మకం ఉంచాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనలో మన హృదయం ఆనందించును”; హీబ్రూ అసంపూర్ణ క్రియను వర్తమాన అలవాటు అర్థానికి బదులుగా భవిష్యదర్థంగా తీసుకుంటే.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “మన హృదయం” అని ఏకవచనంలో ఉంది; ఇది ప్రజల సమిష్టి అంతరంగ జీవితం గురించి చెప్పే ప్రయోగం.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: మొదటి כִּי ముందున్న ప్రకటనకు కారణాన్ని పరిచయం చేస్తుంది; తెలుగు కవితా ప్రవాహంలో దాని కారణార్థాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: בּוֹ
  choice: ఆయనలో
  rationale: పుంలింగ ఏకవచన ప్రత్యయం సమీప సందర్భంలోని యెహోవాను సూచిస్తుంది; మూలంలోని వ్యక్తిగత సర్వనామాన్ని అలాగే నిలుపుతుంది.
- source_word: יִשְׂמַח
  choice: ఆనందిస్తుంది
  rationale: హీబ్రూ అసంపూర్ణ క్రియ ప్రస్తుత అలవాటు స్థితిని లేదా నిశ్చయమైన భవిష్యత్తును సూచించగలదు. కీర్తనలోని ప్రస్తుత విశ్వాస ప్రకటనకు అనుగుణంగా వర్తమానార్థం ప్రధాన పాఠ్యంలో ఉంచబడింది; భవిష్యదర్థం పాదసూచికలో నిలుపబడింది.
- source_word: לִבֵּנוּ
  choice: మన హృదయం
  rationale: మూలంలో ఏకవచన ‘హృదయం’ బహువచన ప్రత్యయంతో వచ్చి ప్రజల సమిష్టి అంతరంగాన్ని సూచిస్తుంది; ఆ రూపాన్ని తెలుగులోనూ నిలిపాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: రెండవ כִּי ఆనందానికి ఆధారమైన కారణాన్ని తెలియజేస్తుంది; కారణ సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: בְשֵׁם
  choice: నామంపై
  rationale: בטח క్రియతో వచ్చిన בְ విశ్వాసానికి ఆధారమైన విషయాన్ని సూచిస్తుంది; ‘నామంపై నమ్మకం ఉంచడం’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: קָדְשׁוֹ
  choice: ఆయన పరిశుద్ధ
  rationale: קָדֹשׁ యొక్క పవిత్రతార్థాన్ని స్థిరమైన, గౌరవప్రదమైన తెలుగు పదమైన ‘పరిశుద్ధ’ స్పష్టంగా అందిస్తుంది.
- source_word: בָטָחְנוּ
  choice: మనం నమ్మకం ఉంచాము
  rationale: హీబ్రూ సంపూర్ణ క్రియ గతంలో స్థిరపడి ఇప్పటికీ వర్తించే విశ్వాసాన్ని సూచించగలదు; ఈ తెలుగు రూపం పూర్తయిన చర్యను చూపుతూ దాని కొనసాగుతున్న ప్రాసంగికతను అనుమతిస్తుంది.
theological_decisions:
- issue: בּוֹ మరియు קָדְשׁוֹ లోని పుంలింగ ఏకవచన సర్వనామాల సూచన
  choice: సర్వనామాలు సమీప సందర్భంలో పేర్కొన్న యెహోవాను సూచిస్తాయి; అయితే వచనంలో దేవుని నామాన్ని చేర్చకుండా ‘ఆయన’ అనే రూపమే ఉంచబడింది.
  alternative: సందర్భంలోని నిబంధనా నామంతో సంబంధాన్ని ప్రత్యేకంగా చూపకుండా, సాధారణంగా దేవునిని సూచిస్తున్నట్లు గ్రహించడం.
  rationale: చుట్టుపక్కల వచనాలు యెహోవా గురించి మాట్లాడుతున్నందున సర్వనామాలు సహజంగా ఆయననే సూచిస్తాయి. అయినా ఈ వచనం స్వయంగా దైవనామాన్ని ఉపయోగించదు కాబట్టి అనువాదం దానిని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కీర్తనా శైలి. మూలంలోని రెండు కారణసూచక כִּי పదాలను రెండుసార్లు ‘ఎందుకంటే’గా ఉంచి వాక్య తార్కిక నిర్మాణాన్ని కాపాడాం. ‘మన హృదయం’ అనే ఏకవచన సమిష్టి రూపాన్ని ఉద్దేశపూర్వకంగా నిలిపాం.
