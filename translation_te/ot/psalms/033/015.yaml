translation:
  language: te
  text: వారందరి హృదయాలను రూపించేవాడు[a], వారి కార్యాలన్నిటినీ గ్రహించేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి హృదయాలను కలిసి రూపించేవాడు.” హీబ్రూ పదం יַחַד కు “కలిసి” అని అర్థం రావచ్చు; ఈ సందర్భంలో ఆయన వారందరి హృదయాలను సమష్టిగా, ఒకే విధంగా రూపిస్తాడనే భావాన్నీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיֹּצֵר
  choice: రూపించేవాడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న יצר ధాతువు ఖాల్ వర్తమాన కృదంతం ఇక్కడ నామవాచకంగా పనిచేస్తుంది. దేవుని లక్షణాత్మక కార్యాన్ని సహజంగా తెలియజేయడానికి ‘రూపించేవాడు’ ఎంచుకున్నాం.
- source_word: יַחַד
  choice: వారందరి
  rationale: ఇక్కడ יַחַד అందరి హృదయాలను సమష్టిగా వ్యాప్తిలోకి తీసుకొస్తుంది. ‘వారందరి’ అనేది ఏకకాలంలో లేదా ఒకేచోట రూపించడం అనే అనవసర భావాన్ని కలిగించకుండా ఆ విస్తృతిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘కలిసి’ అనే ప్రత్యక్ష అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: לִבָּם
  choice: హృదయాలను
  rationale: హీబ్రూలో ఏకవచన నామానికి మూడవ పురుష బహువచన ప్రత్యయం ఉంది; తెలుగులో ప్రతి వ్యక్తికి చెందిన హృదయాన్ని పంపిణీయ బహువచనంగా ‘హృదయాలను’ అనడం సహజం.
- source_word: הַמֵּבִין
  choice: గ్రహించేవాడు
  rationale: בין హిఫీల్ కృదంతం అర్థంచేసుకోవడం, వివేచించడం అనే భావాన్ని ఇస్తుంది. ‘గ్రహించేవాడు’ జ్ఞానంతో కూడిన సంపూర్ణ అవగాహనను సహజంగా తెలియజేస్తుంది.
- source_word: אֶל
  choice: —
  rationale: בין తో వచ్చిన אֶל అవగాహన దిశగా ఉన్న కర్మను సూచిస్తుంది; తెలుగులో ప్రత్యేక పదంగా అనువదించకుండా ‘క్రియలన్నిటినీ గ్రహించేవాడు’ అనే కర్మవిభక్తిలో సహజంగా అంతర్భవిస్తుంది.
- source_word: כָּל מַעֲשֵׂיהֶם
  choice: వారి క్రియలన్నిటినీ
  rationale: מַעֲשֵׂיהֶם వారి పనులు లేదా కార్యాలను సూచిస్తుంది. ‘క్రియలు’ మానవ చర్యల భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది; כָּל ను ‘అన్నిటినీ’ స్పష్టంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: వచనంలోని వ్యక్తుల పరిధి
  choice: దేవుడు వారందరి హృదయాలను రూపించి, వారి క్రియలన్నిటినీ గ్రహించేవాడని విస్తృతంగా ఉంచడం
  alternative: సమీప సందర్భంలోని రాజులు లేదా జనాంగాల హృదయాలకు మాత్రమే పరిమితం చేయడం
  rationale: 33:13–15 సందర్భం మనుష్యులందరినీ, భూనివాసులందరినీ ప్రస్తావిస్తుంది. అందువల్ల మూలపాఠంలోని విస్తృత పరిధిని అనువాదం కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. రెండు హీబ్రూ కృదంతాల సమాంతర నిర్మాణాన్ని ‘రూపించేవాడు … గ్రహించేవాడు’గా నిలిపి, יַחַד లోని నిజమైన ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో భద్రపరిచాం.
