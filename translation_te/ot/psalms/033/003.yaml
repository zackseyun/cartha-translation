  text: Sing to him a new song[a]; play skillfully with a joyful shout.
translation:
  language: te
  text: 'ఆయనకు కొత్త పాట పాడండి;

    హర్షధ్వనితో[a] నైపుణ్యంగా వాయించండి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆనంద కేకతో.’ హీబ్రూ పదం ఉల్లాసభరితమైన కేకను, గట్టి జయధ్వనిని, లేదా కొన్ని సందర్భాల్లో బాకా వంటి ఘోషను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: పాడండి
  rationale: שׁיר క్రియ యొక్క బహువచన ఆజ్ఞారూపాన్ని నేరుగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לוֹ
  choice: ఆయనకు
  rationale: ל ఉపసర్గతో కూడిన తృతీయ పురుష ఏకవచన పుంలింగ ప్రత్యయం పాట ఎవరిని ఉద్దేశించి పాడాలో సూచిస్తుంది; సందర్భంలో అది యెహోవాను సూచిస్తుంది.
- source_word: שִׁיר חָדָשׁ
  choice: కొత్త పాట
  rationale: మూలంలోని సాధారణ కీర్తనాత్మక పదబంధాన్ని అర్థపరంగానూ, ఆరాధనా ప్రతిధ్వనితోనూ నేరుగా నిలుపుతుంది.
- source_word: הֵיטִיבוּ נַגֵּן
  choice: నైపుణ్యంగా వాయించండి
  rationale: הֵיטִיבוּ ఇక్కడ נַגֵּן అనే సంగీత క్రియను విశేషిస్తూ చక్కగా లేదా నేర్పుగా వాయించమనే భావం ఇస్తుంది. ఈ సంయుక్త అనువాదం తెలుగులో సహజంగా ఉంది.
- source_word: בִּתְרוּעָה
  choice: హర్షధ్వనితో
  rationale: תְּרוּעָה ఉల్లాసభరితమైన గట్టికేక, సామూహిక జయధ్వని, లేదా కొన్నిసందర్భాల్లో బాకా వంటి ఘోషను సూచించగలదు. స్తుతి సందర్భంలో ‘హర్షధ్వని’ దాని ఉల్లాసభరితమైన శ్రవ్య బలాన్ని నిలుపుతూ వాద్యాన్ని అతిగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: לוֹ లోని తృతీయ పురుష ఏకవచన ప్రత్యయం ఎవరిని సూచిస్తుంది
  choice: ‘ఆయనకు’—కీర్తన సందర్భంలో దేవుడైన యెహోవాను ఉద్దేశించిన స్తుతి
  alternative: ‘ఆయన కోసం’
  rationale: చుట్టుపక్కల వచనాల్లోని స్తుతి పిలుపు యెహోవావైపు మళ్లి ఉంది. ‘ఆయనకు’ పాట యొక్క గ్రహీతను సహజంగా తెలియజేస్తుంది; సందర్భం స్పష్టంగా ఉన్నందున వివరణాత్మక పాదటిప్పణి అవసరం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామూహిక ఆజ్ఞారూపాలను ఉపయోగించి, కీర్తనకు తగిన గౌరవభరితమైనప్పటికీ సులభంగా అర్థమయ్యే శైలిని నిలిపాం. పాద విభజన హీబ్రూ కవితా సమాంతరతను ప్రతిబింబిస్తుంది.
