source:
  edition: WLC
  text: כֹּנֵ֣ס כַּ֭/נֵּד מֵ֣י הַ/יָּ֑ם נֹתֵ֖ן בְּ/אֹצָר֣וֹת תְּהוֹמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/007.yaml
  text: He gathers the waters of the sea like a heap[b][a]; he puts the depths in storehouses.
translation:
  language: te
  text: ఆయన సముద్ర జలాలను కుప్పలా పోగుచేస్తున్నాడు[a]; అగాధ జలాలను[b] భాండాగారాలలో ఉంచుతున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దిబ్బలా’; ఇలాంటి ఇతర జలచిత్రాల దృష్ట్యా కొందరు ‘గోడలా’ అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అగాధాలను.’ హీబ్రూ బహువచనం మహాసముద్రపు లోతులను లేదా ఆదిమ అగాధ జలాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּנֵס
  choice: పోగుచేస్తున్నాడు
  rationale: כנס అనే క్రియారూపం కూడగట్టడం, పోగుచేయడం అనే భావాన్ని ఇస్తుంది. కర్తరి వర్తమాన వర్ణనాత్మక బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: כַּנֵּד
  choice: కుప్పలా
  rationale: נֵד సాధారణంగా కుప్పగా పోసిన సమూహాన్ని, ముఖ్యంగా జలరాశిని సూచిస్తుంది. పోలికను యథాతథంగా ఉంచుతూ తెలుగులో సహజంగా ఉంది.
- source_word: מֵי הַיָּם
  choice: సముద్ర జలాలను
  rationale: ‘సముద్రపు జలాలు’ అనే నిర్మాణార్థాన్ని సంక్షిప్తమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נֹתֵן
  choice: ఉంచుతున్నాడు
  rationale: נתן ఇక్కడ పెట్టడం లేదా ఉంచడం అనే విస్తృత భావంలో ఉంది; సమాంతర కవితా నిర్మాణంలో ‘ఉంచుతున్నాడు’ సహజంగా సరిపోతుంది.
- source_word: בְּאֹצָרוֹת
  choice: గిడ్డంగుల్లో
  rationale: אֹצָר నిల్వచేసే స్థలం, భాండాగారం లేదా గిడ్డంగిని సూచిస్తుంది. ఈ జలసంబంధ కవితా చిత్రంలో ‘గిడ్డంగులు’ సామాన్య పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: תְּהוֹמוֹת
  choice: అగాధ జలాలను
  rationale: תְּהוֹמוֹת సముద్రపు లోతులను లేదా ఆదిమ అగాధ జలరాశులను సూచించే బహువచనం. ‘అగాధ జలాలు’ ఆ జలసంబంధ భావాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: దేవుడు సముద్రంపై సార్వభౌమాధికారం కలిగివున్నాడనే సృష్టి సంబంధ కవితా చిత్రం
  choice: ‘కుప్ప’ మరియు ‘గిడ్డంగులు’ అనే స్పష్టమైన కవితా చిత్రాలను నిలుపుకోవడం
  alternative: ‘ఆయన సముద్రాన్ని అదుపు చేస్తాడు’ అని భావాన్ని అమూర్తంగా చెప్పడం
  rationale: హీబ్రూ వాక్యం జలాలను దేవుడు క్రమపరచడాన్ని స్పష్టమైన కవితా రూపకాల ద్వారా చూపుతుంది. వాటిని వివరణాత్మక సిద్ధాంత వాక్యంగా మార్చకుండా మూలంలోని ఉద్వేగం, రూపచిత్రం నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయినా కీర్తన కవిత్వానికి తగిన గౌరవప్రద శైలిలో రూపొందించబడింది. హీబ్రూ సమాంతర వర్తమాన వర్ణనను రెండు చోట్ల ‘-స్తున్నాడు’ రూపంతో నిలిపింది.
