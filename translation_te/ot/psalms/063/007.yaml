base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/007.yaml
  text: For you have been my help[a], and in the shadow of your wings I sing for joy.
translation:
  language: te
  text: 'ఎందుకంటే నీవు నాకు సహాయంగా ఉన్నావు;

    నీ రెక్కల నీడలో నేను ఆనందంతో పాడుతాను.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నేను ఆనందంతో కేకలు వేస్తాను.’ హీబ్రూ క్రియ ఆనందగానాన్నే కాక ఉల్లాసభరితమైన బిగ్గర కేకను కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: సమీప సందర్భంలో కీర్తనకర్త స్పందనకు కారణాన్ని పరిచయం చేస్తుంది; కారణ సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: הָיִיתָ
  choice: ఉన్నావు
  rationale: దేవుడు గతంలో నిరూపించిన సహాయం ప్రస్తుతానికీ సంబంధించినదనే భావాన్ని సందర్భంతో కలిపి సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עֶזְרָתָה לִּי
  choice: నాకు సహాయంగా
  rationale: לִּי సూచించే వ్యక్తిగత ప్రయోజనాన్ని నిలుపుతూ, దేవుడే కీర్తనకర్తకు సహాయంగా ఉన్నాడనే సంబంధ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וּבְצֵל
  choice: నీడలో
  rationale: בְּ అనే స్థల సూచనను సహజంగా తెలియజేస్తూ, రక్షణను సూచించే కవితాత్మక ‘నీడ’ రూపకాన్ని నిలుపుతుంది.
- source_word: כְּנָפֶיךָ
  choice: నీ రెక్కల
  rationale: దైవిక ఆశ్రయాన్ని సూచించే స్పష్టమైన రెక్కల రూపకాన్ని వ్యాఖ్యానంగా మార్చకుండా యథాతథంగా ఉంచుతుంది.
- source_word: אֲרַנֵּן
  choice: నేను ఆనందంతో పాడుతాను
  rationale: רנן పీయేల్ రూపంలోని ఉల్లాసభరితమైన స్వర వ్యక్తీకరణను, గాన భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; ఆనంద కేక అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో నిలుపుతుంది.
theological_decisions:
- issue: దైవిక రక్షణను తెలిపే రెక్కల రూపకం
  choice: ‘నీ రెక్కల నీడలో’ అనే రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: ‘నీ రక్షణలో’ వంటి వివరణాత్మక అనువాదం
  rationale: మూలపాఠం దేవుని ఆశ్రయాన్ని స్పష్టమైన కవితాత్మక చిత్రంతో వ్యక్తం చేస్తుంది. దాన్ని నేరుగా నిలుపడం వల్ల సాహిత్య, ధార్మిక గాఢత కాపాడబడుతుంది; ఒక నిర్దిష్ట వ్యాఖ్యానానికి పరిమితం చేయబడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి వాడబడింది. మూలంలోని కారణ సంబంధం, సమాంతర పాద నిర్మాణం, రెక్కల నీడ అనే రూపకం నిలుపబడ్డాయి.
