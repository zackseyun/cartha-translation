  text: When I remember you on my bed, I meditate on you in the night watches.
translation:
  language: te
  text: 'నా పడకమీద నిన్ను జ్ఞాపకం చేసుకున్నప్పుడు,

    రాత్రి జాముల్లో నిన్ను ధ్యానిస్తాను.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: చేసుకున్నప్పుడు
  rationale: ఇక్కడ షరతును సూచించే ‘అయితే’ కంటే, పునరావృతమయ్యే సందర్భాన్ని తెలిపే ‘చేసుకున్నప్పుడు’ సందర్భానుకూలంగా, సహజంగా ఉంది; మూలంలోని కాలసంబంధ భావాన్ని నిలుపుతుంది.
- source_word: יְצוּעָי
  choice: నా పడకమీద
  rationale: ‘నా పరుపు/శయనస్థలం’ అనే మూలార్థాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: בְּאַשְׁמֻרוֹת
  choice: రాత్రి జాముల్లో
  rationale: కాపలాకాల విభాగాలుగా లెక్కించిన రాత్రి వేళలను సూచిస్తుంది; తెలుగులో ‘రాత్రి జాములు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: אֶהְגֶּה
  choice: ధ్యానిస్తాను
  rationale: లోలోపల తలపోసుకోవడం, మననం చేయడం అనే క్రియాభావాన్ని గౌరవప్రదమైన సాధారణ తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కవితా శైలి; సమాంతర పాద నిర్మాణం నిలుపబడింది.
