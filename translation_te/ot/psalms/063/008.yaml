  text: My soul clings to you[b][a]; your right hand upholds me.
translation:
  language: te
  text: నా ప్రాణం నీ వెంటే గట్టిగా అంటుకొని ఉంది[a]; నీ కుడిచేయి నన్ను నిలబెడుతోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా ప్రాణం నిన్ను గట్టిగా అంటిపెట్టుకొని ఉంది.’ హెబ్రీలో అక్షరార్థంగా ‘నీ వెనుక/నీ తరువాత’ అని ఉంది; ఇది దగ్గరగా అనుసరించడం లేదా విడువకుండా అంటుకొని ఉండడం అనే భావాన్ని తెలియజేయవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּבְקָה
  choice: గట్టిగా అంటిపెట్టుకొని ఉంది
  rationale: דבק అనే క్రియలో అంటుకొని ఉండడం, విడువకుండా పట్టుకొని ఉండడం అనే భావం ఉంది. హెబ్రీ పరిపూర్ణ క్రియ ఇక్కడ కొనసాగుతున్న స్థితిని తెలియజేస్తున్నందున తెలుగులో ‘ఉంది’ అని వర్తమాన స్థితిగా ఇచ్చాం.
- source_word: נַפְשִׁי
  choice: నా ప్రాణం
  rationale: נפשׁ అనేది ప్రాణం, జీవితం, స్వయం లేదా వ్యక్తి అనే భావాలను సూచించగలదు. కీర్తనలోని కవితాత్మక భక్తి స్వరాన్ని కాపాడుతూ, దాన్ని కేవలం ‘నేను’గా చదును చేయకుండా ‘నా ప్రాణం’ అని అనువదించాం.
- source_word: אַחֲרֶיךָ
  choice: నిన్ను
  rationale: אַחֲרֵי అక్షరార్థంగా ‘నీ వెనుక/నీ తరువాత’ అని ఉన్నా, דבקతో కలిసి సన్నిహితంగా అంటిపెట్టుకొని అనుసరించే భావాన్ని ఇస్తుంది. సహజమైన తెలుగు ప్రధాన పాఠ్యంలో ‘నిన్ను ... అంటిపెట్టుకొని’ అని ఇచ్చి, మూలంలోని వెనుక అనుసరించే దృశ్యాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: בִּי
  choice: నన్ను
  rationale: తదుపరి תמך క్రియతో కలిసి ఇది క్రియకు వ్యక్తిగత కర్మను సూచిస్తుంది; అందువల్ల సహజమైన తెలుగులో ‘నన్ను’ అని అనువదించాం.
- source_word: תָּמְכָה
  choice: నిలబెడుతోంది
  rationale: תמך అంటే ఆసరా ఇవ్వడం, నిలబెట్టడం, ఆదుకోవడం. దేవుని కుడిచేయి క్రియాశీలంగా ఆధారమిస్తున్న దృశ్యాన్ని ‘నిలబెడుతోంది’ సహజంగా కాపాడుతుంది.
- source_word: יְמִינֶךָ
  choice: నీ కుడిచేయి
  rationale: మూలంలోని స్పష్టమైన శరీరరూపకాన్ని ‘శక్తి’ అని విప్పి చెప్పకుండా, అక్షరార్థమైన ‘నీ కుడిచేయి’గా నిలిపాం.
theological_decisions:
- issue: נַפְשִׁי లోని మానవస్వరూప భావన
  choice: నా ప్రాణం
  alternative: నేను / నా జీవితం / నా అంతరంగం
  rationale: ‘నా ప్రాణం’ కవితాత్మకమైన వ్యక్తిగత, ఆధ్యాత్మిక లోతును నిలుపుతుంది; అదే సమయంలో ఆత్మ గురించి ప్రత్యేక సిద్ధాంతాన్ని పాఠ్యంలో బలవంతంగా ప్రవేశపెట్టదు.
- issue: దేవుని కుడిచేయి అనే మానవరూపక భాష
  choice: నీ కుడిచేయి
  alternative: నీ శక్తి / నీ బలం
  rationale: హెబ్రీ పాఠ్యంలోని సజీవమైన రూపకాన్ని వ్యాఖ్యానాత్మకంగా అమూర్తం చేయకుండా యథాతథంగా కాపాడాం.
- issue: אַחֲרֶיךָ లోని అనుసరణ మరియు అనుబంధం మధ్య ఉద్వేగం
  choice: ప్రధాన పాఠ్యంలో ‘నిన్ను గట్టిగా అంటిపెట్టుకొని ఉంది’; పాదటిప్పణిలో ‘నీ వెనుకనే అంటుకొని ఉంది’
  alternative: నిన్ను గట్టిగా వెంబడిస్తోంది
  rationale: דבק లోని అంటుకొని ఉండే భావాన్ని ప్రధానంగా ఉంచుతూ, אַחֲרֵי లోని వెనుక అనుసరించే దృశ్యాన్ని తొలగించకుండా పాదటిప్పణిలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా ధోరణి పాటించబడింది. ‘అంటిపెట్టుకొని ఉంది’ సాధారణ పాఠకులకు స్పష్టంగా ఉండగా, ‘గట్టిగా’ דבק లోని విడువని అనుబంధాన్ని వ్యక్తం చేస్తుంది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
