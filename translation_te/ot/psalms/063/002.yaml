  text: So I have looked upon you in the sanctuary[a], to see your power and your glory.
translation:
  language: te
  text: అట్లా పవిత్రస్థలంలో నేను నిన్ను చూశాను[a], నీ శక్తినీ నీ మహిమనూ చూడటానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: ‘ఈ విధంగా, పవిత్రస్థలంలో నేను నిన్ను దర్శించాను.’'
    reason: כֵּןకు ‘ఈ విధంగా’ అనే ప్రత్యామ్నాయ భావాన్ని, חזהకు ‘దర్శించాను’ అనే మరింత గంభీరమైన సందర్భానుగుణ ప్రత్యామ్నాయాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: כֵּן
  choice: అలాగే
  rationale: ముందున్న దాహంతో పవిత్రస్థలంలోని దర్శనానుభవాన్ని అనుసంధానించే ‘అట్లా/అలాగే’ అనే క్రియావిశేషణ భావాన్ని సహజంగా తెలియజేస్తుంది; సంబంధాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: בַּקֹּדֶשׁ
  choice: పవిత్రస్థలంలో
  rationale: కֹדֶשׁకు ‘పవిత్రత’ అనే అమూర్త భావం సాధ్యమైనా, ఉపసర్గతోను ఆరాధనా సందర్భంలోను ఇది పవిత్ర స్థలాన్ని లేదా పరిశుద్ధ మందిరాన్ని సూచించడం సహజం.
- source_word: חֲזִיתִיךָ
  choice: నేను నిన్ను చూశాను
  rationale: חזה గ్రహింపుతో లేదా ధ్యానపూర్వకంగా చూడడాన్ని సూచించగలదు. తెలుగులో ‘చూశాను’ సహజంగా ఉండి మూలంలోని ప్రత్యక్ష కర్మ ‘నిన్ను’ను నిలుపుతుంది; దాని లోతైన భావాన్ని సందర్భమే మోస్తుంది.
- source_word: לִרְאוֹת
  choice: చూడడానికి
  rationale: ల ఉపసర్గతో కూడిన క్రియారూపం ఉద్దేశాన్ని వ్యక్తం చేస్తుంది; ‘చూడడానికి’ దానిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: עֻזְּךָ
  choice: నీ శక్తిని
  rationale: עֹז బలం, పరాక్రమం, శక్తి అనే భావాలను కలిగి ఉంది. దేవుని మహిమతో జతగా ‘శక్తి’ ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన ఎంపిక.
- source_word: וּכְבוֹדֶךָ
  choice: నీ మహిమను
  rationale: దేవునికి సంబంధించిన כָּבוֹד యొక్క భారవంతమైన, ప్రత్యక్షమయ్యే వైభవాన్ని ‘మహిమ’ స్థిరంగా మరియు గౌరవప్రదంగా తెలియజేస్తుంది.
theological_decisions:
- issue: పవిత్రస్థలంలో దేవుణ్ణి చూడడం అనే మాట యొక్క భావం
  choice: మూలంలోని ‘నిన్ను చూశాను’ అనే ప్రత్యక్ష కవితాత్మక వాక్యాన్ని నిలిపి, అది దేవుని శక్తి మరియు మహిమను దర్శించడమనే ఆరాధనా సందర్భంలో ఉండనిచ్చాం.
  alternative: దీనిని దేవుని సారాన్ని అక్షరార్థంగా దర్శించడం లేదా ప్రత్యేక మర్మదర్శనం అని స్పష్టీకరించడం.
  rationale: హీబ్రూ వాక్యం దేవుణ్ణి ప్రత్యక్ష కర్మగా ఉంచుతూ, వెంటనే ఆయన శక్తి మరియు మహిమను చూడడాన్ని చెబుతుంది. అనువాదం ఈ ఉద్రిక్తతను పరిష్కరించకుండా సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కీర్తనా శైలి. ‘పవిత్రస్థలం’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి ఆరాధనా ప్రదేశ భావాన్ని కాపాడుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
