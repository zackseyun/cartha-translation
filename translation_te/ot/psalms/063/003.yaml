  text: For your steadfast love is better than life[a]; my lips will praise you.
translation:
  language: te
  text: నీ నిలకడైన ప్రేమ[a] జీవితం కంటే మేలైనది గనుక నా పెదవులు నిన్ను స్తుతిస్తాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విశ్వసనీయ ప్రేమ,’ ‘నిబంధనాత్మక ప్రేమ.’ హీబ్రూ חֶסֶד (హెసెద్) పదం ప్రేమతో కూడిన విశ్వసనీయతను, నిలకడను సూచిస్తుంది; ఇది తరచుగా నిబంధన సంబంధంలో ఉపయోగించబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: తరువాత వచ్చే స్తుతికి కారణాన్ని పరిచయం చేసే హీబ్రూ సంబంధాన్ని సహజమైన తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: טוֹב
  choice: మేలైనది
  rationale: מִן‌తో కూడిన నిర్మాణం పోలికను సూచిస్తుంది; అందువల్ల కేవలం ‘మంచిది’ కాకుండా ‘కంటే మేలైనది’ అని అనువదించబడింది.
- source_word: חַסְדְּךָ
  choice: నీ నిలకడైన ప్రేమ
  rationale: חֶסֶד‌లోని ప్రేమ, విశ్వసనీయత, స్థిరత్వం అనే భావాలను సాధారణ పాఠకులకు సహజంగా తెలియజేస్తూ, దాని నిబంధనాత్మక నేపథ్యాన్ని అతిగా నిర్దిష్టం చేయకుండా ఉంచుతుంది.
- source_word: מֵחַיִּים
  choice: జీవితం కంటే
  rationale: חַיִּים రూపపరంగా బహువచనమైనా ఇక్కడ జీవితం అనే సమష్టి భావాన్ని సూచిస్తుంది; తెలుగు ఏకవచనం సహజమైనది.
- source_word: שְׂפָתַי
  choice: నా పెదవులు
  rationale: హీబ్రూ కవిత్వంలోని స్పష్టమైన శరీరాంగ రూపకాన్ని ‘మాటలు’గా భావానువాదం చేయకుండా నిలుపుతుంది.
- source_word: יְשַׁבְּחוּנְךָ
  choice: నిన్ను స్తుతిస్తాయి
  rationale: పియేల్ క్రియలోని బలమైన స్తుతి భావాన్ని, సందర్భంలోని భవిష్యత్ లేదా సంకల్ప ఛాయను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఆరాధన సందర్భంలో חֶסֶד అనువాదం
  choice: నిలకడైన ప్రేమ
  alternative: విశ్వసనీయ ప్రేమ; నిబంధన ప్రేమ; కరుణ
  rationale: ఈ పదం దేవుని ప్రేమతో కూడిన స్థిరమైన విశ్వసనీయతను సూచిస్తుంది. ‘నిలకడైన ప్రేమ’ ఆ భావవిస్తృతిని కాపాడుతూ, ఏదైనా సంకుచితమైన సిద్ధాంతార్థాన్ని వచనంలోకి బలవంతంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కవితాత్మక శైలి. కారణసంబంధం, పోలిక, ‘పెదవులు’ అనే కవితా రూపకం నిలుపబడ్డాయి.
