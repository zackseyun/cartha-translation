  text: וְ/הַ/מֶּלֶךְ֮ יִשְׂמַ֪ח בֵּ/אלֹ֫הִ֥ים יִ֭תְהַלֵּל כָּל הַ/נִּשְׁבָּ֣ע בּ֑/וֹ כִּ֥י יִ֝סָּכֵ֗ר פִּ֣י דֽוֹבְרֵי שָֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/011.yaml
  text: But the king will rejoice in God[a]; everyone who swears by him will boast[c][b], for the mouths of those who speak lies will be shut.
translation:
  language: te
  text: అయితే రాజు దేవునిలో ఆనందిస్తాడు; ఆయన పేరట ప్రమాణం చేసే ప్రతి ఒక్కరూ గొప్పగా చెప్పుకుంటారు[a], ఎందుకంటే అబద్ధాలు పలికేవారి నోళ్లు మూయబడతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గొప్పగా చెప్పుకుంటారు’ అనే మాటకు ‘మహిమపడతారు’ లేదా ‘గౌరవంతో ఉల్లసిస్తారు’ అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: అయితే రాజు
  rationale: వావ్ సాధారణంగా ‘మరియు’ అని అర్థమిచ్చినా, ముందటి వచనంలో చెప్పిన దుష్టుల గతికి విరుద్ధంగా రాజు స్థితిని చూపుతున్నందున ‘అయితే’ సందర్భప్రవాహాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִשְׂמַח בֵּאלֹהִים
  choice: దేవునిలో ఆనందిస్తాడు
  rationale: שמח తో వచ్చిన ב ఆనందానికి ఆధారం లేదా లక్ష్యాన్ని సూచిస్తుంది; ‘దేవునిలో ఆనందిస్తాడు’ మూలంలోని భావాన్ని, భవిష్యదర్థాన్ని నిలుపుతుంది.
- source_word: כָּל הַנִּשְׁבָּע בּוֹ
  choice: ఆయన పేరట ప్రమాణం చేసే ప్రతి ఒక్కరూ
  rationale: ‘ప్రమాణం చేయడం’తో ב ప్రమాణంలో ఎవరిని ఆహ్వానిస్తున్నారో సూచిస్తుంది. తెలుగులో ‘ఆయన పేరట’ ఈ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; సర్వనామం సందర్భానుసారం దేవునినే సూచిస్తుంది.
- source_word: יִתְהַלֵּל
  choice: అతిశయిస్తారు
  rationale: הלל హిత్పయేల్ రూపం ఇక్కడ గౌరవంతో గొప్పగా చెప్పుకోవడం లేదా ఉల్లసించడం అనే భావాన్ని ఇస్తుంది. ‘అతిశయిస్తారు’ ఆ భావపరిధిని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ఆనందం, అతిశయానికి కారణాన్ని పరిచయం చేసే వివరణాత్మక సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: יִסָּכֵר פִּי דֹבְרֵי שָׁקֶר
  choice: అబద్ధాలు పలికేవారి నోళ్లు మూయబడతాయి
  rationale: మూలంలో ‘అసత్యం పలికేవారి నోరు మూయబడుతుంది’ అనే ఏకవచన సమూహవాచక చిత్రం ఉంది; సహజమైన తెలుగులో వ్యక్తుల సమూహానికి అనుగుణంగా బహువచనం వాడి అదే భావాన్ని అందించింది.
theological_decisions:
- issue: ‘రాజు’ ఎవరిని సూచిస్తున్నాడు
  choice: ఎలాంటి వ్యాఖ్యాత్మక విస్తరణ లేకుండా ‘రాజు’ అని ఉంచడం
  alternative: ప్రత్యేకంగా దావీదు అని లేదా రూపకంగా మెస్సీయ రాజు అని గుర్తించడం
  rationale: హెబ్రీ వచనం ‘రాజు’ అని మాత్రమే చెబుతుంది. వచనంలో స్పష్టంగా లేని చారిత్రక లేదా మెస్సీయ సంబంధమైన గుర్తింపును అనువాదంలో చేర్చకుండా మూలంలోని విస్తృతతను నిలిపింది.
- issue: בּוֹ (‘ఆయన’) సర్వనామ సూచన
  choice: దేవునిని సూచిస్తున్నదిగా అనువదించడం
  alternative: రాజును సూచిస్తున్నదిగా గ్రహించడం
  rationale: దగ్గరలోని స్పష్టమైన పూర్వపదం ‘దేవుడు’; అంతేకాక దేవుని పేరట ప్రమాణం చేయడం సాధారణ బైబిలు ప్రయోగం. అయినా మూలంలోని సర్వనామ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కీర్తనాశైలిని పాటించాం. ‘ఆయన పేరట ప్రమాణం’ సహజ తెలుగు ప్రయోగం; ‘అతిశయిస్తారు’ అనే పదానికి ఉన్న భావపరిధిని పాదటిప్పణిలో వెల్లడించాం.
