  yaml_path: translation/ot/psalms/063/004.yaml
  text: So I will bless you as long as I live[a]; in your name I will lift up my hands.
translation:
  language: te
  text: కాబట్టి నేను జీవించి ఉన్నంతకాలం నిన్ను ఆశీర్వదిస్తాను[a]; నీ నామంలో నా చేతులను పైకెత్తుతాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిన్ను స్తుతిస్తాను.” హీబ్రూలో పదశః, “నిన్ను ఆశీర్వదిస్తాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: అలా
  rationale: ముందటి వచనంలోని దేవుని కృపను స్తుతించాలనే భావానికి ఈ ప్రతిజ్ఞను ఫలితార్థకంగా అనుసంధానిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: אֲבָרֶכְךָ
  choice: నిన్ను స్తుతిస్తాను
  rationale: పదశః ‘నిన్ను ఆశీర్వదిస్తాను’; అయితే దేవునికి ఉద్దేశించిన సందర్భంలో ברך ఆరాధనాత్మకంగా స్తుతించడాన్ని సూచిస్తుంది. సహజమైన తెలుగు ప్రధాన పాఠంలో ‘స్తుతిస్తాను’ను ఉంచి, మూలంలోని పదశః భావాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: בְחַיָּי
  choice: నేను బ్రతికినంతకాలం
  rationale: పదశః ‘నా జీవితంలో’; సందర్భంలో జీవితకాలమంతా కొనసాగే చర్యను సూచిస్తుంది.
- source_word: בְּשִׁמְךָ
  choice: నీ నామంలో
  rationale: ב ఉపసర్గ ఇక్కడ పరిధి, ఆధారం లేదా ఆహ్వానాన్ని సూచించవచ్చు. ‘నీ నామంలో’ ఈ ఉద్దేశపూర్వక అస్పష్టతను కాపాడే సహజమైన తెలుగు రూపం.
- source_word: אֶשָּׂא
  choice: పైకెత్తుతాను
  rationale: נשא అంటే ఎత్తడం; చేతులతో కలిసి ప్రార్థన లేదా స్తుతి భంగిమను సూచిస్తుంది.
- source_word: כַפָּי
  choice: నా చేతులు
  rationale: כף ప్రత్యేకంగా అరచేతిని సూచించగలిగినా, ఈ స్థిర ప్రయోగంలో తెలుగులో ‘చేతులు’ సహజంగా ఉండి భంగిమను స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుని ఉద్దేశించి వాడిన ברך అనే ఆరాధనా పదం
  choice: ప్రధాన పాఠంలో ‘స్తుతిస్తాను’
  alternative: ‘నిన్ను ఆశీర్వదిస్తాను’
  rationale: హీబ్రూ క్రియ పదశః ‘ఆశీర్వదించు’ అయినా, దేవుని ఉద్దేశించినప్పుడు తెలుగు ‘నిన్ను ఆశీర్వదిస్తాను’ సాధారణ పాఠకునికి దేవునికి మేలు కలిగించడం అనే తప్పు భావాన్ని ఇవ్వవచ్చు. సందర్భానుగుణ అర్థమైన ‘స్తుతిస్తాను’ను ప్రధాన పాఠంలో ఉంచి, మూలరూపాన్ని పాదటిప్పణిలో వెల్లడించడం సహజత్వం మరియు మూలపాఠ పారదర్శకత రెండింటినీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ ఆరాధనకు తగిన గౌరవప్రదమైన శైలి. ద్వితీయ పురుష ఏకవచన రూపాలు మూలంలోని దేవునితో నేర సంభాషణను నిలుపుతాయి.
