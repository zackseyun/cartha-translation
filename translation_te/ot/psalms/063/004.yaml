    text: లేదా, “నిన్ను స్తుతిస్తాను.” హీబ్రూలో పదశః, “నిన్ను ఆశీర్వదిస్తాను.”
    reason: lexical_alternative
  revision_rationale: The revision restores the Hebrew lexical sense of ברך (“bless”) to the main text, while retaining “praise” as a legitimate contextual alternative in the footnote. It also improves the resultative connection and corrects the object form in the hand-raising expression. No disputed textual or doctrinal interpretation is introduced.
