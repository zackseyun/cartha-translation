  yaml_path: translation/ot/psalms/063/010.yaml
  text: They will be given over to the power of the sword[b][a]; they will become a portion for foxes.
translation:
  language: te
  text: వారు ఖడ్గానికి అప్పగించబడతారు[b]; నక్కలకు[a] వాటాగా మారతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నక్కలు’ అని అనువదించిన హీబ్రూ పదం జాకల్స్‌ (అడవి నక్కలు)ను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ మూలానికి దగ్గరగా: ‘వారు అతణ్ణి ఖడ్గబలంతో పారబోస్తారు.’ మొదటి భాగంలో ‘అతణ్ణి’ అనే ఏకవచన కర్మప్రత్యయం ఉండగా, తరువాతి భాగంలో బహువచన క్రియారూపం ఉంది.'
    reason: textual_grammatical_ambiguity
lexical_decisions:
- source_word: יַגִּירֻהוּ
  choice: వారు … అప్పగించబడతారు
  rationale: ఈ హిఫిల్ క్రియకు అక్షరార్థంగా ‘అతణ్ణి పారబోస్తారు/కారిపోయేలా చేస్తారు’ అనే బలమైన దృశ్యార్థం ఉంది. అయితే మొదటి భాగంలోని ఏకవచన కర్మప్రత్యయం (‘అతణ్ణి’) తరువాతి భాగంలోని బహువచన కర్తతో (‘వారు’) మారుతుంది. ప్రధాన పాఠంలో కర్మణి ప్రయోగం సందర్భంలోని శత్రువులే ఖడ్గానికి గురవుతారని సహజంగా తెలియజేస్తుంది; అక్షరార్థ రూపాన్నీ వ్యాకరణ ఉద్రిక్తతనూ పాదటిప్పణిలో నిలుపుతుంది.
- source_word: עַל יְדֵי חָרֶב
  choice: ఖడ్గానికి
  rationale: ఈ పదబంధం ఖడ్గం ద్వారా కలిగే హింసాత్మక మరణాన్ని సూచిస్తుంది. ‘ఖడ్గం చేతుల ద్వారా’ అనే పదక్షర రూపం ఆధునిక తెలుగులో కృత్రిమంగా ఉంటుంది; ‘ఖడ్గానికి అప్పగించబడతారు’ సహజంగా ఉండి ఖడ్గాధీనత అనే భావాన్ని నిలుపుతుంది.
- source_word: מְנָת
  choice: వాటా
  rationale: మְנָת అంటే కేటాయించబడిన భాగం లేదా వాటా. మృతదేహాలు మృగాలకు ఆహారంగా దక్కుతాయనే కవితాత్మక భావాన్ని ‘వాటా’ సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שֻׁעָלִים
  choice: నక్కలు
  rationale: హీబ్రూ పదానికి సాధారణ సమానార్థంగా ‘నక్కలు’ ఎంచుకున్నాం. యుద్ధభూమి లేదా పాడుబడిన ప్రదేశం సందర్భంలో ఇది జాకల్ జాతి అడవి నక్కలను కూడా సూచించవచ్చు; ఆ ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంది.
- source_word: יִהְיוּ
  choice: మారతారు
  rationale: היה ‘ఉండడం’ లేదా ‘మారడం’ అని అర్థమివ్వగలదు. హింసాత్మక మరణం తరువాత కలిగే స్థితిని ఇక్కడ ‘వాటాగా మారతారు’ స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: మొదటి భాగంలోని ఏకవచన కర్మప్రత్యయం, రెండవ భాగంలోని బహువచన కర్త మధ్య మార్పు
  choice: ప్రధాన పాఠంలో శత్రువులను సూచించే బహువచన కర్మణి రూపం
  alternative: ‘వారు అతణ్ణి ఖడ్గబలంతో పారబోస్తారు; వారు నక్కలకు వాటా అవుతారు’ అనే పదక్షర రూపం
  rationale: సందర్భంలో కీర్తనకర్త ప్రాణాన్ని తీయాలని చూసేవారి గతి వర్ణించబడుతోంది. కర్మణి రూపం ప్రధాన భావాన్ని అపార్థం లేకుండా అందిస్తుంది; అయినా హీబ్రూలోని అసాధారణ ఏకవచన–బహువచన మార్పును పాదటిప్పణి ద్వారా దాచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా వాక్య నిర్మాణం వాడబడింది. ‘ఖడ్గానికి అప్పగించబడతారు’ సాధారణ పాఠకునికి అర్థమయ్యేలా హీబ్రూ ప్రయోగంలోని హింసాత్మక ఫలితాన్ని తెలియజేస్తుంది; మూలంలోని మరింత మూర్తమైన ‘పారబోయడం’ రూపం పాదటిప్పణిలో భద్రపరచబడింది.
