source:
  edition: WLC
  text: אֱלֹהִ֤ים אֵלִ֥/י אַתָּ֗ה אֲֽשַׁחֲ֫רֶ֥/ךָּ צָמְאָ֬ה לְ/ךָ֨ נַפְשִׁ֗/י כָּמַ֣הּ לְ/ךָ֣ בְשָׂרִ֑/י בְּ/אֶֽרֶץ צִיָּ֖ה וְ/עָיֵ֣ף בְּלִי מָֽיִם׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/001.yaml
  text: God[a], you are my God; I seek you at dawn. My soul thirsts for you, my flesh longs for you[b], in a dry and weary land without water.
translation:
  language: te
  text: 'దేవా, నీవే నా దేవుడవు;

    వేకువనే నిన్ను వెదుకుతాను.[a]

    నా ప్రాణం నీకోసం దాహపడుతోంది,

    నా దేహం నీకోసం తపిస్తోంది,[b]

    నీళ్లు లేని ఎండిన, అలసిన నేలలో.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తెల్లవారగానే నిన్ను వెదుకుతాను,’ ‘నిన్ను శ్రద్ధగా వెదుకుతాను,’ లేదా భావానువాదంగా ‘నిన్ను ఆతురంగా వెదుకుతాను.’ హీబ్రూ క్రియ అక్షరార్థంగా వేకువనే వెదకడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: ‘నా ప్రాణం నీకోసం దాహపడుతోంది; నీళ్లు లేని ఎండిన, అలసిన నేలలో నా దేహం నీకోసం తపిస్తోంది.’ చివరి పదబంధాన్ని రెండవ వాక్యభాగంతో మాత్రమే అనుసంధానించి కూడా చదవవచ్చు.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: אֱלֹהִים אֵלִי אַתָּה
  choice: దేవా, నీవే నా దేవుడవు
  rationale: మొదటి పదాన్ని ప్రత్యక్ష సంబోధనగా సహజమైన తెలుగు రూపంలో ఇచ్చి, స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను ‘నీవే’తో నిలిపాం.
- source_word: אֲשַׁחֲרֶךָּ
  choice: వేకువనే నిన్ను వెదుకుతాను
  rationale: שׁחר క్రియలోని తెల్లవారుజామున వెదకడం అనే మూలచిత్రాన్ని నిలిపి, కేవలం ‘ఆసక్తిగా’ అనే వ్యాఖ్యానానికి పరిమితం చేయలేదు.
- source_word: צָמְאָה לְךָ נַפְשִׁי
  choice: నా ప్రాణం నీకోసం దాహపడుతోంది
  rationale: נפשׁకు ఈ కవితాత్మక సందర్భంలో ‘ప్రాణం’ సహజంగా ఉండి, దాహం అనే రూపకాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: כָּמַהּ לְךָ בְשָׂרִי
  choice: నా దేహం నీకోసం తపిస్తోంది
  rationale: בשר సూచించే శారీరక పార్శ్వాన్ని ‘దేహం’తో నిలిపాం; ‘మాంసం’ ఆధునిక తెలుగులో కలిగించగల అనవసరార్థాలను నివారించాం. כּמהּలోని తీవ్రమైన ఆకాంక్షను ‘తపిస్తోంది’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּאֶרֶץ צִיָּה וְעָיֵף בְּלִי מָיִם
  choice: నీళ్లు లేని ఎండిన, అలసిన నేలలో
  rationale: నీరు లేమి, ఎండుదనం, నేలకు ఆపాదించిన అలసట అనే కవితాత్మక వ్యక్తీకరణ—ఈ మూడింటినీ సంక్షిప్తంగా నిలిపాం.
theological_decisions:
- issue: נפשׁ / בשר అనే మానవస్వరూప పదజంట
  choice: ‘నా ప్రాణం’ మరియు ‘నా దేహం’గా వేర్వేరు కవితాత్మక పార్శ్వాలను నిలపడం
  alternative: ‘నా అంతరంగం’ మరియు ‘నా శరీరం’ లేదా ‘నా సర్వస్వం’గా సమీకరించడం
  rationale: మూలంలోని అంతరంగ-శారీరక సమాంతరతను నిలుపుతున్నాం; అయితే ఇది కఠినమైన ఆత్మ-దేహ ద్వైత సిద్ధాంతాన్ని ప్రకటిస్తుందని అనవసరంగా నిర్ధారించడం లేదు.
- issue: చివరి స్థానవాచక పదబంధం వర్తించే పరిధి
  choice: ‘నీళ్లు లేని... నేలలో’ అనే మాటను ప్రాణదాహం, దేహతపన రెండింటికీ వర్తించగల విధంగా చివర ఉంచడం
  alternative: దానిని దేహం తపించడానికి మాత్రమే నేరుగా అనుసంధానించడం
  rationale: హీబ్రూ పదక్రమం విస్తృత పరిధిని అనుమతిస్తుంది; తెలుగు ప్రధాన పాఠంలో ఆ కవితాత్మక పరిధిని తెరిచి ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన కవితా శైలి. ‘వేకువనే,’ ‘దాహపడుతోంది,’ ‘తపిస్తోంది’ అనే పదాలు మూలంలోని శోధన, దాహం, తీవ్రమైన ఆకాంక్ష చిత్రాలను సహజంగా నిలుపుతాయి.
