source:
  edition: WLC
  text: מִזְמ֥וֹר לְ/דָוִ֑ד בִּ֝/הְיוֹת֗/וֹ בְּ/מִדְבַּ֥ר יְהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/000.yaml
  text: A psalm of David[a], when he was in the wilderness[b] of Judah.
translation:
  language: te
  text: దావీదు కీర్తన[a]. అతడు యూదా అరణ్యంలో[b] ఉన్నప్పుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దావీదు రచించిన కీర్తన’ లేదా ‘దావీదు కోసం కీర్తన.’ హీబ్రూ శీర్షిక రచనను, అంకితాన్ని, స్వామ్యాన్ని లేదా సంబంధాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘యూదా ఎడారిలో.’ హీబ్రూ పదం అరణ్యప్రాంతాన్ని, బీడుభూమిని లేదా ఎడారిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: కీర్తనల శీర్షికలోని సాంకేతిక సాహిత్య ప్రక్రియ పదాన్ని సహజమైన, సంప్రదాయబద్ధమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְדָוִד
  choice: దావీదు కీర్తన
  rationale: హీబ్రూ לְ ఉపసర్గ రచయితను, అంకితాన్ని, స్వామ్యాన్ని లేదా సంబంధాన్ని సూచించవచ్చు. తెలుగు షష్ఠీ సంబంధ నిర్మాణం ఈ భావాన్ని రచయితకే పరిమితం చేయకుండా కొంతవరకు నిలుపుతుంది.
- source_word: בִּהְיוֹתוֹ
  choice: అతడు … ఉన్నప్పుడు
  rationale: בְּ + היה క్రియానామ రూపం, పురుష ఏకవచన ప్రత్యయంతో కలిసి కాలార్థక ఉపవాక్యాన్ని ఏర్పరుస్తుంది; ఈ తెలుగు రూపం సహజంగా అదే కాలసంబంధాన్ని తెలియజేస్తుంది.
- source_word: בְּמִדְבַּר
  choice: అరణ్యంలో
  rationale: מִדְבָּר ఎడారి, జనావాసం లేని అరణ్యప్రాంతం లేదా బీడుభూమిని సూచించగలదు. ‘అరణ్యం’ దానిని కేవలం ఇసుక ఎడారిగా సంకుచితం చేయదు.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: ప్రాంతం లేదా గోత్ర భూభాగానికి సంబంధించిన పేరును ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చింది.
theological_decisions:
- issue: దావీదు సంబంధిత శీర్షిక భావం
  choice: ‘దావీదు కీర్తన’ అని సంబంధార్థకంగా ఉంచడం
  alternative: ‘దావీదు రచించిన కీర్తన’ లేదా ‘దావీదు కోసం కీర్తన’
  rationale: కీర్తనల శీర్షికల్లో לְדָוִד రచన, అంకితం, స్వామ్యం లేదా సంబంధాన్ని సూచించవచ్చు. మూలపాఠం ఒకే భావాన్ని తప్పనిసరి చేయదు కాబట్టి అనువాదం దాన్ని నిర్దిష్టంగా తీర్మానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన కీర్తన శీర్షిక. ‘దావీదు కీర్తన’ అనే నిర్మాణం మూలంలోని సంబంధార్థక అనిశ్చితిని సాధ్యమైనంతవరకు నిలుపుతుంది; ‘అరణ్యం’ విస్తృత భౌగోళిక భావాన్ని ఇస్తుంది.
