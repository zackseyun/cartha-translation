source:
  edition: WLC
  text: וְ/הֵ֗מָּה לְ֭/שׁוֹאָה יְבַקְשׁ֣וּ נַפְשִׁ֑/י יָ֝בֹ֗אוּ בְּֽ/תַחְתִּיּ֥וֹת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/009.yaml
  text: But they[a], who seek my life, to destroy it[b], will go into the depths of the earth.
translation:
  language: te
  text: 'కాని నా ప్రాణాన్ని నాశనం చేయడానికి నన్ను వెదకేవారు[b]

    భూమి అట్టడుగు ప్రాంతాలకు[a] దిగిపోతారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘భూమి దిగువ భాగాలకు.’
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, ‘నాశనం కోసం నా ప్రాణాన్ని వెదకేవారు.’
    reason: previous_rendering
lexical_decisions:
- source_word: וְהֵמָּה
  choice: కాని … వారు
  rationale: ముందటి వచనంలోని కీర్తనకర్త విశ్వాసానికి వ్యతిరేకంగా శత్రువుల గతి చెప్పబడుతోంది. అందువల్ల వావ్‌ను సందర్భానుసారంగా ‘కాని’ అని అనువదించాం; స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను ‘వారు’ నిలుపుతుంది.
- source_word: לְשׁוֹאָה
  choice: నాశనం చేయడానికి
  rationale: שׁוֹאָה నాశనం, పాడుచేయడం అనే భావాన్ని ఇస్తుంది. ఇక్కడ అది ప్రాణాన్ని వెదకడం వెనుక ఉన్న హానికర ఉద్దేశాన్ని తెలియజేస్తుంది.
- source_word: יְבַקְשׁוּ נַפְשִׁי
  choice: నా ప్రాణాన్ని … నన్ను వెదకేవారు
  rationale: נֶפֶשׁ ఇక్కడ అమూర్తమైన ‘ఆత్మ’ కంటే కీర్తనకర్త ప్రాణాన్ని సూచిస్తుంది. సహజమైన తెలుగులో హత్య ఉద్దేశంతో చేసే వెదకడాన్ని స్పష్టంగా వ్యక్తం చేయడానికి ‘నా ప్రాణాన్ని నాశనం చేయడానికి నన్ను వెదకేవారు’ అని ఇచ్చాం.
- source_word: יָבֹאוּ
  choice: దిగిపోతారు
  rationale: క్రియ మౌలికంగా ‘వస్తారు/చేరుతారు’ అని ఉన్నా, గమ్యం భూమి అట్టడుగు ప్రాంతాలు కావడంతో తెలుగు సందర్భంలో ‘దిగిపోతారు’ కదలికను, కిందికి వెళ్లే కవితాత్మక చిత్రాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּתַחְתִּיּוֹת הָאָרֶץ
  choice: భూమి అట్టడుగు ప్రాంతాలకు
  rationale: ఈ పదబంధం భూమి దిగువ లేదా లోతైన ప్రాంతాలను సూచిస్తుంది. ‘అట్టడుగు ప్రాంతాలు’ మరణం లేదా సమాధి వైపు దిగిపోవడం అనే చిత్రాన్ని నిలుపుతూ, దానిని నిర్దిష్ట పరలోక సిద్ధాంతంగా మార్చదు.
theological_decisions:
- issue: ‘భూమి అట్టడుగు ప్రాంతాలు’ అనే అవరోహణ చిత్రానికి అర్థం
  choice: మరణం, సమాధి లేదా తీర్పులో కిందికి దించబడడాన్ని సూచించే కవితాత్మక వ్యక్తీకరణగా అనిశ్చితిని నిలుపడం
  alternative: పాతాళానికి సంబంధించిన నిర్దిష్ట సాంకేతిక సూచనగా అనువదించడం
  rationale: హీబ్రూ పదబంధం మృతుల లోకాన్ని సూచించవచ్చు; అదే సమయంలో నాశనం, మరణం లేదా లోతైన భూభాగాల చిత్రంగానూ చదవవచ్చు. అందువల్ల అనువాదం ఈ ఉద్రిక్తతను పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలిని వాడాం. హీబ్రూ క్రమాన్ని యథాశక్తి నిలుపుతూ, తెలుగులో అసహజంగా వినిపించే ‘నాశనం కోసం నా ప్రాణాన్ని వెదకడం’ అనే నిర్మాణాన్ని ప్రధాన పాఠ్యంలో ఉద్దేశార్థకంగా మార్చి, అక్షరార్థ రూపాన్ని పాదటిప్పణిలో ఉంచాం.
