id: PSA.63.5
reference: Psalms 63:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כְּמ֤וֹ חֵ֣לֶב וָ֭/דֶשֶׁן תִּשְׂבַּ֣ע נַפְשִׁ֑/י וְ/שִׂפְתֵ֥י רְ֝נָנ֗וֹת יְהַלֶּל פִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/005.yaml
  text: My soul is satisfied as with fat and richness[b][a], and my mouth praises you with lips of joyful songs.
translation:
  language: te
  text: కొవ్వు, పుష్కలమైన ఆహారం తిన్నంతగా నా ప్రాణం తృప్తి పొందుతుంది[a]; ఆనందకేకల పెదవులతో[b] నా నోరు నిన్ను స్తుతిస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ప్రాణం కొవ్వుతోనూ పుష్కలమైన ఆహారంతోనూ తృప్తి పొందుతుంది.” హీబ్రూ అసంపూర్ణ క్రియారూపాలను భవిష్య లేదా నిరీక్షణ భావంలో కూడా అనువదించవచ్చు.
    reason: כְּמוֹతో కూడిన పోలికను నేరుగా పలికే ప్రత్యామ్నాయం మరియు హీబ్రూ క్రియారూపాల కాలభావ ప్రత్యామ్నాయం.
  - marker: b
    text: అక్షరార్థంగా, “ఆనందోత్సాహాల పెదవులతో”; లేదా, “ఆనందగానాల పెదవులతో.”
    reason: רְנָנוֹת ఆనందోత్సాహాలు, ఆనందకేకలు, లేదా ఆనందగానాలను సూచించగలదు.
lexical_decisions:
- source_word: כְּמוֹ
  choice: తృప్తి చెందినట్టుగా
  rationale: ఇది పోలికను పరిచయం చేస్తుంది. తెలుగులో ఆహారంతో తృప్తి చెందడాన్ని పోలికగా సహజంగా వ్యక్తం చేయడానికి ఈ రూపం సరిపోతుంది.
- source_word: חֵלֶב
  choice: కొవ్వు
  rationale: మూలపదంలోని స్పష్టమైన ఆహారచిత్రాన్ని నిలుపుతూ, శ్రేష్ఠమైన సమృద్ధికరమైన ఆహారాన్ని సూచిస్తుంది.
- source_word: דֶּשֶׁן
  choice: పుష్టికరమైన ఆహారం
  rationale: ఈ పదం పుష్టి, సమృద్ధి, సారవంతమైన కొవ్వుదనాన్ని సూచించగలదు. తెలుగులో అసహజమైన పదపునరుక్తిని నివారిస్తూ ఆహారసమృద్ధి భావాన్ని తెలియజేస్తుంది.
- source_word: תִּשְׂבַּע
  choice: తృప్తి పొందుతుంది
  rationale: కవిత్వంలోని అసంపూర్ణ క్రియారూపం ప్రస్తుత, అలవాటైన లేదా భవిష్య భావాన్ని మోయగలదు. సందర్భంలో అనుభవిస్తున్న తృప్తిని సహజమైన వర్తమాన రూపంలో తెలిపింది; భవిష్య ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: נַפְשִׁי
  choice: నా ప్రాణం
  rationale: נֶפֶשׁ వ్యక్తి అంతరంగం, జీవం లేదా స్వయాన్ని సూచించగలదు. ఆధునిక తెలుగు కీర్తనాశైలిలో ‘నా ప్రాణం’ సహజంగా ఉండి మూలంలోని వ్యక్తిగత లోతును కాపాడుతుంది.
- source_word: שִׂפְתֵי רְנָנוֹת
  choice: ఆనందధ్వనులు చేసే పెదవులతో
  rationale: అక్షరార్థంగా ‘ఆనందోత్సాహాల/ఆనందకేకల పెదవులతో’ అనే భావం. పెదవుల కవితాత్మక చిత్రాన్ని, స్వరంతో వ్యక్తమయ్యే ఉల్లాసాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: יְהַלֶּל
  choice: నిన్ను స్తుతిస్తుంది
  rationale: కర్త ‘నా నోరు’. మూలంలో కర్మ ప్రత్యక్షంగా లేకపోయినా కీర్తనలో దేవునితో జరుగుతున్న ప్రత్యక్ష సంభాషణ వల్ల ‘నిన్ను’ సందర్భానుసారంగా స్పష్టంగా ఉంది.
- source_word: פִּי
  choice: నా నోరు
  rationale: ‘పెదవులు’తో సమాంతరంగా ఉన్న శరీరాంగ చిత్రాన్ని యథాతథంగా కాపాడుతుంది.
theological_decisions:
- issue: స్తుతికి సంబంధించిన అంతర్నిహిత కర్మ
  choice: ‘నా నోరు నిన్ను స్తుతిస్తుంది’ అని ‘నిన్ను’ చేర్చడం
  alternative: ‘నా నోరు స్తుతిస్తుంది’
  rationale: హీబ్రూ వాక్యంలో కర్మ స్పష్టంగా లేకపోయినా, దేవునిని నేరుగా సంబోధిస్తున్న సమీప సందర్భం దానిని నిర్దేశిస్తుంది. ఇది కొత్త సిద్ధాంతార్థాన్ని చేర్చకుండా తెలుగులో వాక్యాన్ని సహజంగా చేస్తుంది.
- issue: కవితాత్మక అసంపూర్ణ క్రియల కాలభావం
  choice: 'వర్తమాన భావం: ‘తృప్తి పొందుతుంది’, ‘స్తుతిస్తుంది’'
  alternative: 'భవిష్య భావం: ‘తృప్తి పొందుతుంది/పొందబోతుంది’, ‘స్తుతిస్తుంది/స్తుతిస్తుంది’ అనే సందర్భానుసార భవిష్య పఠనం'
  rationale: హీబ్రూ అసంపూర్ణ రూపాలు కవిత్వంలో వర్తమాన, అలవాటైన లేదా భవిష్య చర్యను సూచించగలవు. ప్రధాన పాఠ్యంలో ప్రస్తుత అనుభవాన్ని ఎంచుకున్నప్పటికీ, నిజమైన కాలభావ సందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కీర్తనా శైలి. మూలంలోని ఆహారచిత్రం, ‘ప్రాణం—పెదవులు—నోరు’ అనే శరీరాంగ కవితాత్మకత, క్రియాకాల సందిగ్ధత కాపాడబడ్డాయి.
