lexical_decisions:
- source_word: אַךְ
  choice: కాని
  rationale: ముందటి వచనాల్లో చెప్పిన ధనవంతుల మరణగతికి భిన్నంగా, కీర్తనకర్తకు దేవునిపై ఉన్న నమ్మకాన్ని వ్యతిరేక భావంతో పరిచయం చేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ వాక్యంలో ఇశ్రాయేలు దేవుణ్ణి ఏకవచనంలో సూచించే సహజమైన తెలుగు పదం.
- source_word: יִפְדֶּה
  choice: విమోచిస్తాడు
  rationale: పדה అనే క్రియ ఒక శక్తి లేదా స్థితి ఆధీనంనుండి వెల చెల్లించి విడిపించడం లేదా రక్షించడం అనే భావాన్ని కలిగి ఉంది; ‘విమోచిస్తాడు’ ఆ భావగాఢతను నిలుపుతుంది.
- source_word: נַפְשִׁי
  choice: నా ప్రాణాన్ని
  rationale: נפש ఇక్కడ శరీరానికి వేరైన అమూర్త ఆత్మను మాత్రమే కాక, వ్యక్తి జీవాన్ని లేదా వ్యక్తినే సూచించగలదు. ‘నా ప్రాణాన్ని’ ఆధునిక తెలుగులో సహజంగా ఉండి ఈ అర్థవిస్తృతిని కాపాడుతుంది.
- source_word: מִיַּד
  choice: చేతిలోనుండి
  rationale: హీబ్రూ జాతీయాన్ని యథాతథ చిత్రంతో అందిస్తూ, షెయోల్ పట్టు లేదా అధికారంనుండి విడిపించడాన్ని సూచిస్తుంది.
- source_word: שְׁאוֹל
  choice: షెయోల్
  rationale: ఇది మృతుల లోకానికి వాడిన ప్రత్యేక హీబ్రూ పదం. కేవలం ‘సమాధి’ అని పరిమితం చేయకుండా లిప్యంతరీకరించి, అర్థాన్ని పాదసూచికలో వివరించాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి నమ్మక ప్రకటనకు కారణం లేదా ఆధారాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: יִקָּחֵנִי
  choice: ఆయన నన్ను తీసుకుంటాడు
  rationale: לקח యొక్క ప్రాథమిక అర్థమైన ‘తీసుకోవడం’ను నిలుపుతూ, దేవుడు తనవద్దకు చేర్చుకుంటాడనే సాధ్యమైన అంతర్భావాన్ని అనువాదంలో అతిగా స్పష్టీకరించకుండా ఉంచుతుంది.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఈ పదం యొక్క ఖచ్చితమైన అర్థం లేదా గీత సంబంధమైన విధి అనిశ్చితంగా ఉన్నందున సంప్రదాయ లిప్యంతరీకరణను ఉంచాం.
theological_decisions:
- issue: మరణం మరియు విమోచన సందర్భంలో נַפְשִׁי అర్థం
  choice: ‘నా ఆత్మను’ అని సంకుచితం చేయకుండా ‘నా ప్రాణాన్ని’ అని అనువదించాం.
  alternative: ‘నా ఆత్మను’ లేదా ‘నన్ను’
  rationale: హీబ్రూ కవిత్వంలో נפש తరచుగా సంపూర్ణ వ్యక్తిని లేదా జీవాన్ని సూచిస్తుంది. ‘నా ప్రాణాన్ని’ అనే రూపం తరువాతి కాలపు కఠిన శరీర–ఆత్మ ద్వైతాన్ని పాఠ్యంలోకి చేర్చకుండా, తెలుగు వాడుకలోని భావవిస్తృతిని నిలుపుతుంది.
- issue: షెయోల్ నుండి విమోచన స్వరూపం
  choice: ‘షెయోల్ చేతిలోనుండి విమోచిస్తాడు; ... నన్ను తీసుకుంటాడు’ అనే విస్తృతమైన వాక్యరూపాన్ని నిలిపాం.
  alternative: దీనిని స్పష్టంగా పునరుత్థానమని చెప్పడం, లేదా అకాల మరణంనుండి రక్షణకు మాత్రమే పరిమితం చేయడం
  rationale: హీబ్రూ వాక్యం దేవుని తుద విమోచనపై ధైర్యాన్ని వ్యక్తం చేస్తుంది; అయితే అది పునరుత్థానమా, మరణానంతరం దేవుని సన్నిధిలో చేర్చుకోవడమా, లేక మరణాధికారంపై కవితాత్మక విజయమా అని వ్యవస్థీకృతంగా వివరించదు. అందువల్ల ఆ భావ ఉద్రిక్తతను పరిష్కరించకుండా నిలిపాం.
- issue: יִקָּחֵנִי లో దేవుని చర్య
  choice: ‘ఆయన నన్ను తీసుకుంటాడు’
  alternative: ‘ఆయన నన్ను తనవద్దకు చేర్చుకుంటాడు’
  rationale: ‘తనవద్దకు’ అనే భావం సాధ్యమైనప్పటికీ మూలపాఠ్యంలో ప్రత్యక్షంగా లేదు. సరళమైన ‘తీసుకుంటాడు’ అనే రూపం హనోకు లేదా మరణానంతర స్వీకరణ వంటి నిర్దిష్ట వ్యాఖ్యానాన్ని బలవంతంగా రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలిని అనుసరించాం. ‘చేతిలోనుండి’ అనే హీబ్రూ రూపకాన్ని నిలిపి, ‘షెయోల్’ మరియు ‘సెలా’ పదాలను వాటి ప్రత్యేకత లేదా అనిశ్చితి కారణంగా లిప్యంతరీకరించాం. ప్రధాన పాఠ్యంలోని [a], [b] గుర్తులు సంబంధిత పాదసూచికలకు సరిపోతాయి.
