id: PSA.49.11
reference: Psalms 49:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: קִרְבָּ֤/ם בָּתֵּ֨י/מוֹ לְֽ/עוֹלָ֗ם מִ֭שְׁכְּנֹתָ/ם לְ/דֹ֣ר וָ/דֹ֑ר קָֽרְא֥וּ בִ֝/שְׁמוֹתָ֗/ם עֲלֵ֣י אֲדָמֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/011.yaml
  text: Their inward thought is that their houses will last forever[a], their dwelling places from generation to generation[b]; they have called lands by their own names.
translation:
  language: te
  text: వారి అంతరంగ ఆలోచన ఏమిటంటే, తమ ఇళ్లు శాశ్వతంగా నిలుస్తాయని[a], తమ నివాసాలు తరతరాల వరకు ఉంటాయని; వారు భూములకు తమ పేర్లు పెట్టుకున్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, ప్రత్యామ్నాయ పాఠ అవగాహన ప్రకారం: “వారి సమాధులే వారి శాశ్వత గృహాలు; వారి నివాసాలు తరతరాల వరకు ఉంటాయి.”'
    reason: textual_variant
  - marker: b
    text: 'అక్షరార్థంగా, “వారు భూములపై తమ పేర్లతో పిలిచారు.” భావం: వారు భూములకు లేదా స్థిరాస్తులకు తమ పేర్లు పెట్టుకున్నారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְבָּם
  choice: వారి అంతరంగ ఆలోచన
  rationale: WLC స్వరచిహ్నాలతో ఉన్న పాఠం ‘వారి అంతర్భాగం/వారిలోపల’ అనే భావాన్ని ఇస్తుంది. క్రియలేని వాక్యంలో సందర్భానుసారంగా ‘వారి అంతరంగ ఆలోచన’ అని వ్యక్తీకరించడం సహజంగా ఉండి, ధనవంతుల శాశ్వతత్వ భ్రమను తెలియజేస్తుంది; ‘సమాధులు’ అనే ప్రత్యామ్నాయ పాఠార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: בָּתֵּימוֹ
  choice: తమ ఇళ్లు
  rationale: בית యొక్క సాధారణ అర్థం ‘ఇల్లు’; తరువాతి ‘నివాసాలు’తో సమాంతరతను నిలుపుతుంది.
- source_word: לְעוֹלָם
  choice: శాశ్వతంగా నిలుస్తాయని
  rationale: హీబ్రూ క్రియలేని పదబంధంలోని నిరంతర స్థిరత్వ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִשְׁכְּנֹתָם
  choice: తమ నివాసాలు
  rationale: సాధారణ నివాస స్థలాలను సూచించే పదం; ‘ఇళ్లు’తో ఉన్న కవితా సమాంతరతను కాపాడుతుంది.
- source_word: לְדֹר וָדֹר
  choice: తరతరాల వరకు
  rationale: వరుస తరాలన్నిటిలో కొనసాగే భావాన్ని సహజ తెలుగు నుడికారంతో అందిస్తుంది.
- source_word: קָרְאוּ בִשְׁמוֹתָם
  choice: తమ పేర్లే పెట్టుకున్నారు
  rationale: קרא ఇక్కడ ‘పేరు పెట్టడం’ అనే అర్థంలో ఉంది; తమ పేర్లతో భూములను గుర్తించారనే భావాన్ని స్పష్టంగా, సహజంగా చెబుతుంది.
- source_word: עֲלֵי אֲדָמוֹת
  choice: తమ భూములకు
  rationale: అక్షరార్థంగా ‘భూముల మీద’; సందర్భంలో భూభాగాలు లేదా స్థిరాస్తులను సూచిస్తుంది. తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా ‘భూములకు’ అని అనువదించాం.
theological_decisions:
- issue: קִרְבָּם పఠనం
  choice: ప్రధాన పాఠంలో ‘వారి అంతరంగ ఆలోచన’
  alternative: ‘వారి సమాధులే వారి శాశ్వత గృహాలు’
  rationale: అందించిన WLC మసొరెటిక్ స్వరపాఠం קִרְבָּם (‘వారి అంతర్భాగం’)ను సమర్థిస్తుంది. ‘సమాధులు’ అనే పురాతన ప్రత్యామ్నాయ అవగాహనను తొలగించకుండా పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. హీబ్రూ కవితా సమాంతరతను ‘ఇళ్లు/నివాసాలు’ మరియు ‘శాశ్వతంగా/తరతరాల వరకు’ ద్వారా నిలిపాం. రెండు పాదసూచిక గుర్తులూ ప్రధాన పాఠంలో ఉంచాం.
