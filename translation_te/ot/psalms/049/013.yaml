  yaml_path: translation/ot/psalms/049/013.yaml
  text: This is their way—their folly[a]; yet after them, people approve their words[b]. Selah
translation:
  language: te
  text: ఇదే వారి మార్గం—వారి మూర్ఖత్వం; అయినా వారి తర్వాత వచ్చేవారు[a] వారి నోటి మాటలను[b] మెచ్చుకుంటారు. సెలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారి సంతతివారు.’ హీబ్రూ పదబంధం సాధారణంగా వారి తర్వాత వచ్చేవారినీ, ప్రత్యేకంగా వారి సంతతివారినీ సూచించగలదు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా ‘వారి నోరు’; ఇక్కడ వారు పలికిన మాటలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה דַרְכָּם
  choice: ఇదే వారి మార్గం
  rationale: זֶה ఇచ్చే నిర్దేశక భావాన్ని, דֶּרֶךְలోని మార్గం/జీవనవిధానం అనే రూపక విస్తృతిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כֵּסֶל לָמוֹ
  choice: వారి మూర్ఖత్వం
  rationale: כֶּסֶל ఇక్కడ ముందరి వచనాల్లో వర్ణించిన జీవనమార్గంపై తీర్పుగా ‘మూర్ఖత్వం’ అనే భావాన్ని ఇస్తుంది. לָמוֹతో కూడిన సంక్షిప్త హీబ్రూ నిర్మాణాన్ని తెలుగులో వివరణాత్మక సమానార్థక అనుబంధంగా అందించాం.
- source_word: וְאַחֲרֵיהֶם
  choice: అయినా వారి తర్వాత వచ్చేవారు
  rationale: אַחֲרֵי కాలపరంగా ‘తర్వాత’ అని, అలాగే తరువాతి అనుచరులు లేదా తరాలవారిని సూచించగలదు. సందర్భంలోని వ్యంగ్య విరుద్ధతను ‘అయినా’ స్పష్టం చేస్తుంది; బంధుత్వాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: בְּפִיהֶם
  choice: వారి నోటి మాటలను
  rationale: అక్షరార్థంగా ‘వారి నోటిలో/నోటితో’. ఇక్కడ నోరు పలికిన మాటలకు సూచకంగా ఉన్నందున, తెలుగు సహజత్వం కోసం ‘నోటి మాటలు’ అని ఇచ్చాం; ‘నోరు’ అనే మూల రూపకాన్ని కూడా నిలిపాం.
- source_word: יִרְצוּ
  choice: మెచ్చుకుంటారు
  rationale: רצה Qal రూపం సంతోషించడం, అనుకూలంగా స్వీకరించడం, ఆమోదించడం అనే భావాలను కలిగి ఉంటుంది. ఈ సందర్భంలో ‘మెచ్చుకుంటారు’ అనేది వారి మాటల పట్ల అనుకూల స్పందనను సహజంగా తెలియజేస్తుంది.
- source_word: סֶלָה
  choice: సెలా
  rationale: దీని ఖచ్చితమైన ఆరాధనా లేదా సంగీత కార్యం అనిశ్చితమైనందున సంప్రదాయ లిప్యంతరీకరణను ఉంచాం.
theological_decisions:
- issue: וְאַחֲרֵיהֶם ఎవరిని సూచిస్తుంది?
  choice: వారి తర్వాత వచ్చేవారు—తరువాతి అనుచరులు లేదా తరాలవారు
  alternative: వారి సంతతివారు
  rationale: హీబ్రూ పదబంధం కేవలం జీవసంబంధ సంతానాన్నే నిర్బంధంగా సూచించదు. అందువల్ల మూలంలోని విస్తృతతను కాపాడుతూ, ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- issue: כֵּסֶל యొక్క భావం
  choice: మూర్ఖత్వం
  alternative: నమ్మకం లేదా ఆత్మవిశ్వాసం
  rationale: ఈ కీర్తనలో సంపదపై ఆధారపడే వారి మార్గంపై ప్రతికూల జ్ఞానసాహిత్య తీర్పు ప్రధానంగా ఉంది. అయినప్పటికీ పదానికి కొన్ని సందర్భాల్లో ‘నమ్మకం’ అనే భావం ఉండగలదని గుర్తించాలి; ఇక్కడ సందర్భం ‘మూర్ఖత్వం’ను బలపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయినా కీర్తనలోని గంభీరమైన తీర్పు స్వరాన్ని నిలుపుతూ రూపొందించబడింది. హీబ్రూ వాక్యంలోని సంక్షిప్తతను డాష్‌తో ప్రతిబింబించాం.
