theological_decisions:
- issue: వచనంలోని పురుష-వచన మార్పు
  choice: మొదటి భాగాన్ని సందర్భానుసారంగా ఏకవచనంలో (‘అతడు … చేరతాడు’), రెండవ భాగాన్ని హెబ్రీ క్రియారూపం ప్రకారం బహువచనంలో (‘వారు … చూడరు’) అనువదించడం.
  alternative: రెండు భాగాలనూ ఏకవచనంలో ఇవ్వడం; లేదా మొదటి క్రియను దాని లిఖిత రూపం ప్రకారం ‘నీవు చేరతావు’ అని ఇవ్వడం.
  rationale: תָּבוֹא రూపం వ్యాకరణపరంగా రెండవ పురుష పుంలింగ ఏకవచనం; יִרְאוּ మాత్రం మూడవ పురుష పుంలింగ బహువచనం. సందర్భ ప్రవాహం మొదటి భాగంలో సంపన్నుడైన వ్యక్తిని సూచిస్తుంది; రెండవ భాగంలోని బహువచనం అతడు చేరే మృతుల సమూహాన్ని ముందుకు తెస్తుంది. ప్రధాన పాఠ్యంలో అర్థసంబంధ స్పష్టతను ఉంచుతూ, మూలంలోని ఉద్రిక్తతను పాదసూచికలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే శైలిని వాడాం. ‘పితరులు’ అనే పదం మూలంలోని కుటుంబ-పూర్వీకుల భాషను నిలుపుతుంది; ‘చేరతాడు’ గమ్యార్థాన్ని తెలుగులో సులభంగా అందిస్తుంది. మూలంలోని దృష్టికోణ మార్పును ఏకవచనం నుంచి బహువచనానికి మార్పుగా ఉంచాం.
