  naturalness: The Telugu is clear, modern-standard, and appropriately dignified for a psalm. ‘పితరులు’ is somewhat elevated but is natural in biblical register and avoids the misleadingly literal ‘తండ్రులు.’ The singular-to-plural transition is understandable in Telugu and reflects the source’s tension.
  terminology: ‘పితరులు,’ ‘తరం,’ and ‘వెలుగు’ preserve the ancestral and life/death imagery without importing doctrinal conclusions. The notes responsibly explain the idiom and the grammatical irregularity.
