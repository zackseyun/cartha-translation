- source_word: עַד נֵצַח
  choice: ఇక ఎన్నటికీ
  rationale: నిరాకరణతో కూడిన ఈ ప్రయోగం భవిష్యత్తులో శాశ్వతంగా జరగకపోవడాన్ని సూచిస్తుంది. ‘ఇక ఎన్నటికీ’ ఆ బలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לֹא יִרְאוּ
