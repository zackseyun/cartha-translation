- source_word: דּוֹר
  choice: తరం
  rationale: דּוֹר యొక్క సాధారణ అర్థం ‘తరం.’ ఇక్కడ అది మరణించిన పూర్వీకుల సమూహాన్ని సూచించినా, మూలంలోని తరానికి సంబంధించిన రూపకాన్ని నిలిపాం.
- source_word: אֲבוֹתָיו
  choice: తన పితరులు
