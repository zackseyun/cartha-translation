id: PSA.49.16
reference: Psalms 49:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַל תִּ֭ירָא כִּֽי יַעֲשִׁ֣ר אִ֑ישׁ כִּֽי יִ֝רְבֶּה כְּב֣וֹד בֵּיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/016.yaml
  text: Do not fear when a man becomes rich[a], when the glory of his house increases;
translation:
  language: te
  text: 'ఒక మనిషి ధనవంతుడైనప్పుడు,

    అతని ఇంటి వైభవం పెరిగినప్పుడు భయపడకు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతని ఇల్లు’ అనే హీబ్రూ పదబంధం అతని కుటుంబాన్ని లేదా ఆస్తిపాస్తులను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: భయపడకు
  rationale: אַל తో వచ్చిన క్రియ నిషేధార్థాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘భయపడకు’ సహజమైన, సంక్షిప్తమైన రూపం.
- source_word: כִּי
  choice: అయినప్పుడు / పెరిగినప్పుడు
  rationale: రెండు చోట్లా భయానికి కారణమయ్యే పరిస్థితిని సూచిస్తుంది; తెలుగులో ‘అప్పుడు’ భావం సందర్భానికి సరిపోతుంది.
- source_word: יַעֲשִׁר אִישׁ
  choice: ఒక మనిషి ధనవంతుడైనప్పుడు
  rationale: יַעֲשִׁר ఇక్కడ ‘ధనవంతుడు కావడం’ అనే అకర్మక భావంలో ఉంది; אִישׁ అనే ఏకవచన పురుషరూపాన్ని నిలుపుతుంది.
- source_word: יִרְבֶּה
  choice: పెరిగినప్పుడు
  rationale: רבה యొక్క ‘పెరగడం, విస్తరించడం’ అనే సాధారణ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: כְּבוֹד
  choice: వైభవం
  rationale: כבוד ఇక్కడ గౌరవం, ప్రతిష్ఠ, సంపదతో కూడిన ఔన్నత్యాన్ని సూచించవచ్చు; ‘వైభవం’ ఆ విస్తృత భావాన్ని కేవలం ధనానికి పరిమితం చేయదు.
- source_word: בֵּיתוֹ
  choice: అతని ఇంటి
  rationale: బేత్ అనే మూలరూపంలోని ‘ఇల్లు’ చిత్రాన్ని నిలుపుతూ, సందర్భంలో కుటుంబం లేదా గృహసంపద అనే విస్తృత అర్థానికీ చోటిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనలోని సామెతసదృశ కవితా ధోరణిని నిలుపుతూ, సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదజాలం వాడబడింది. హీబ్రూ వాక్యక్రమంలోని రెండు సమాంతర పరిస్థితి వాక్యాలను తెలుగు కవితా ప్రవాహానికి అనుగుణంగా ఉంచాం.
