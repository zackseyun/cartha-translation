id: PSA.49.20
reference: Psalms 49:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָדָ֣ם בִּ֭/יקָר וְ/לֹ֣א יָבִ֑ין נִמְשַׁ֖ל כַּ/בְּהֵמ֣וֹת נִדְמֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/020.yaml
  text: Man in honor[a], yet without understanding, is like the beasts that perish.
translation:
  language: te
  text: ఘనతలో ఉండి కూడా గ్రహించని మనిషి నశించిపోయే జంతువుల వంటివాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జంతువులతో పోల్చబడ్డాడు; వాటివలె అయ్యాడు.” చివరి హీబ్రూ క్రియను ‘నశించిపోవడం’కు బదులు ‘పోలివుండడం’ అనే అర్థంలో కూడా గ్రహించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: మనిషి
  rationale: ఏ ఒక్క పురుషుణ్ణి మాత్రమే కాక, మానవుణ్ణి సామెతరూపంగా సూచించే ఏకవచన పదం. ‘మనిషి’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని ఏకవచన కవితా స్వరాన్ని నిలుపుతుంది.
- source_word: בִּיקָר
  choice: ఘనతలో
  rationale: ఈ సందర్భంలో గౌరవం, ప్రతిష్ఠ, ఉన్నత స్థితి అనే భావాన్ని సూచిస్తుంది. ‘ఘనతలో’ సంక్షిప్తంగా ఉండి కీర్తన కవితా శైలికి సరిపోతుంది.
- source_word: וְלֹא יָבִין
  choice: ఉండి కూడా గ్రహించని
  rationale: בין అనే క్రియకు గ్రహించడం, వివేచించడం అనే అర్థం ఉంది. ఘనత ఉన్నప్పటికీ అవగాహన లేకపోవడంలోని వ్యతిరేకతను ‘కూడా’ స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נִמְשַׁל
  choice: సమానుడు
  rationale: משל క్రియ యొక్క నిఫాల్ రూపం ‘పోల్చబడడం, వంటివాడిగా ఉండడం’ అనే భావాన్ని ఇస్తుంది. ‘సమానుడు’ తెలుగులో ఈ పోలికను గంభీరంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: כַּבְּהֵמוֹת
  choice: జంతువులతో
  rationale: ఇక్కడ ఈ పదం కేవలం పశువులను కాక విస్తృతంగా జంతువులను సూచిస్తుంది. అందువల్ల ‘జంతువులు’ సాధారణ పాఠకులకు స్పష్టమైన సమానార్థకం.
- source_word: נִדְמוּ
  choice: నశించిపోయే
  rationale: ఈ కీర్తనలోని మరణం, నిలిచిపోని మానవ ఘనత అనే ప్రధాన భావానికి అనుగుణంగా ఈ రూపాన్ని ‘నశించిపోవడం’ అనే అర్థంలో తీసుకున్నాం. అయితే ‘వాటివలె అయ్యారు’ అనే సాధ్యమైన మరో విశ్లేషణను పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: చివరి క్రియ נִדְמוּ యొక్క భావం
  choice: ‘నశించిపోయే’ అని, జంతువులను విశేషించే మాటగా అనువదించడం
  alternative: ‘వాటివలె అయ్యాడు/వాటిని పోలి ఉన్నాడు’ అని సాదృశ్యాన్ని తెలిపే క్రియగా అనువదించడం
  rationale: కీర్తన అంతటా సంపద, ఘనత మరణాన్ని అడ్డుకోలేవనే భావం ప్రధానంగా ఉంది; కాబట్టి నశించడమనే పఠనం సందర్భానికి బలంగా సరిపోతుంది. అయినప్పటికీ హెబ్రీ రూపానికి సాదృశ్యాన్ని సూచించే విశ్లేషణ కూడా సాధ్యమైనందున ఆ వ్యాఖ్యాన ఉద్రిక్తతను పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే కీర్తనకు తగిన గంభీరమైన కవితా స్వరంతో అనువదించబడింది.
