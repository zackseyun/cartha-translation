revisions:
- from: ఘనతలో ఉండి కూడా గ్రహించని మనిషి, నశించిపోయే జంతువులతో సమానుడు.[a]
  to: ఘనతలో ఉండి కూడా గ్రహించని మనిషి నశించిపోయే జంతువుల వంటివాడు.[a]
  rationale: The revision replaces an equality expression with an idiomatic Telugu comparison that more closely reflects נִמְשַׁל. It retains the mortality-focused main reading of the final verb and preserves the disputed resemblance reading in the footnote.
