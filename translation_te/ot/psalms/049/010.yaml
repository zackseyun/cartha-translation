id: PSA.49.10
reference: Psalms 49:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י יִרְאֶ֨ה חֲכָ֘מִ֤ים יָמ֗וּתוּ יַ֤חַד כְּסִ֣יל וָ/בַ֣עַר יֹאבֵ֑דוּ וְ/עָזְב֖וּ לַ/אֲחֵרִ֣ים חֵילָֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/010.yaml
  text: For he sees that wise men die[a]; together the fool and the brutish man perish[c][b], and they leave their wealth to others.
translation:
  language: te
  text: ఎందుకంటే, అతడు జ్ఞానులు మరణించడాన్ని చూస్తాడు; మూర్ఖుడూ వివేకంలేనివాడూ ఒకే విధంగా నశిస్తారు, తమ సంపదను ఇతరులకు విడిచిపెడతారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి భావానికి కారణాన్ని లేదా వివరణను పరిచయం చేసే అనుసంధాన బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יִרְאֶה
  choice: అతడు చూస్తాడు
  rationale: హీబ్రూ మూడవ పురుష ఏకవచన రూపాన్ని కాపాడుతూ, సాధారణంగా గమనించే సత్యాన్ని వర్తమాన కాలంలో వ్యక్తం చేస్తుంది.
- source_word: חֲכָמִים
  choice: జ్ఞానులు
  rationale: ఇది జ్ఞానం కలిగిన మానవ వర్గాన్ని సూచించే పుంలింగ బహువచన నామవాచక ప్రయోగం; తెలుగులో ‘జ్ఞానులు’ సహజంగా, ప్రతినిధి వర్గార్థంతో వినిపిస్తుంది.
- source_word: יָמוּתוּ
  choice: చనిపోవడం
  rationale: మరణమనే సరళ భావాన్ని, ‘చూస్తాడు’ అనే ప్రధాన క్రియతో సహజమైన తెలుగు వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: יַחַד
  choice: ఒకే విధంగా
  rationale: ఇక్కడ తప్పనిసరిగా ఒకే సమయంలో అనే భావం కంటే, భిన్న వర్గాలవారు పంచుకునే ఒకే గతి ప్రధానంగా ఉంది.
- source_word: כְּסִיל
  choice: మూర్ఖుడు
  rationale: నైతికంగానూ బుద్ధిపరంగానూ అవివేకిగా ఉండే వ్యక్తిని సూచించే ప్రామాణిక జ్ఞానసాహిత్య పదానికి సరైన తెలుగు సమానం.
- source_word: בַעַר
  choice: వివేకంలేనివాడు
  rationale: ఆలోచనా శక్తి లేని, మందబుద్ధిగల లేదా పశుసమానమైన వ్యక్తి అనే మూల భావాన్ని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: יֹאבֵדוּ
  choice: నశిస్తారు
  rationale: కేవలం చనిపోవడమే కాక అంతరించిపోవడం లేదా పతనమవడం అనే אבד క్రియ బలాన్ని నిలుపుతుంది.
- source_word: וְעָזְבוּ
  choice: విడిచిపెడతారు
  rationale: తాము కూడబెట్టినదాన్ని మరణానంతరం ఇతరులకు వదిలివెళ్లే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לַאֲחֵרִים
  choice: ఇతరులకు
  rationale: ‘అపరిచితులకు’ అనే అదనపు భావాన్ని చేర్చకుండా హీబ్రూ అనిర్దిష్ట బహువచనాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: חֵילָם
  choice: తమ సంపదను
  rationale: ఈ మరణ సందర్భంలో חֵילָם సూచించే ఆస్తి, వనరులు లేదా ధనసంపదను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: חֲכָמִים మరియు בַעַר పదాల్లోని మానవవర్గ, లింగ సూచన
  choice: జ్ఞానులు ... వివేకంలేనివాడు
  alternative: జ్ఞానవంతులైన పురుషులు ... పశుసమానుడైన పురుషుడు
  rationale: హీబ్రూలో వ్యాకరణపరంగా పుంలింగ రూపాలు ఉన్నప్పటికీ అవి ప్రతినిధి మానవ వర్గాలను సూచిస్తున్నాయి. తెలుగులో ‘జ్ఞానులు’, ‘వివేకంలేనివాడు’ మూల రూపాల వ్యక్తి/వర్గ స్వభావాన్ని కాపాడుతూ, భావాన్ని కేవలం పురుషులకు పరిమితం చేయవు.
- issue: יַחַד సూచించే ఉమ్మడి గతి
  choice: ఒకే విధంగా
  alternative: కలిసి / ఒకేసారి
  rationale: వచనం మూర్ఖుడూ వివేకంలేనివాడూ పంచుకునే నాశన గతిని నొక్కిచెబుతుంది; వారు ఒకే సమయంలో మరణిస్తారనే అనవసర కాలార్థాన్ని ఈ ఎంపిక నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్య నిర్మాణం, అయితే కీర్తనకు తగిన గంభీరతను నిలుపుకుంది. మూలంలో నిజమైన పాఠభేదం లేదా అవసరమైన వివరణాత్మక ప్రత్యామ్నాయం లేనందున పాదటిప్పణులు చేర్చలేదు.
