review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the Hebrew sequence and contrasts: the observer sees the wise die; the fool and the senseless/brutish person share ruin; they leave their wealth to others. “ఒకే విధంగా” appropriately conveys the shared fate expressed by יַחַד without imposing an unnecessary ‘at the same time’ sense.'
  naturalness: The opening order, “జ్ఞానులు చనిపోవడం అతడు చూస్తాడు,” is understandable but less natural in modern standard Telugu. Recasting it with “మరణించడాన్ని” produces a smoother, more direct sentence while retaining the Hebrew singular subject.
  terminology: “జ్ఞానులు,” “మూర్ఖుడు,” “వివేకంలేనివాడు,” “నశిస్తారు,” and “సంపద” are suitable modern Telugu renderings. “వివేకంలేనివాడు” preserves the core sense of בַעַר (senseless/brutish) without importing an interpretive moral category.
  issues:
  - severity: low
    issue: Opening clause is somewhat awkward in Telugu word order and nominal construction.
    rationale: “జ్ఞానులు చనిపోవడం అతడు చూస్తాడు” is intelligible, but “అతడు జ్ఞానులు మరణించడాన్ని చూస్తాడు” is more idiomatic and clearly expresses that he observes their dying.
  revised_text: ఎందుకంటే, అతడు జ్ఞానులు మరణించడాన్ని చూస్తాడు; మూర్ఖుడూ వివేకంలేనివాడూ ఒకే విధంగా నశిస్తారు, తమ సంపదను ఇతరులకు విడిచిపెడతారు.
