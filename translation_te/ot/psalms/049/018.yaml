id: PSA.49.18
reference: Psalms 49:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי נַ֭פְשׁ/וֹ בְּ/חַיָּ֣י/ו יְבָרֵ֑ךְ וְ֝/יוֹדֻ֗/ךָ כִּי תֵיטִ֥יב לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/018.yaml
  text: For his soul blesses itself during his life[a], and they praise you when you do well for yourself.
translation:
  language: te
  text: ఎందుకంటే, అతడు బ్రతికున్నప్పుడు తనను తాను ధన్యుడని అనుకుంటాడు[a]; నీవు నీకే మేలు చేసుకున్నప్పుడు ప్రజలు నిన్ను పొగడతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు బ్రతికున్నంతకాలం తాను ధన్యుడనని భావిస్తాడు; నీవు వర్ధిల్లినప్పుడు ప్రజలు నిన్ను పొగడతారు.”
    reason: నֶפֶשׁ యొక్క సందర్భోచిత ప్రతిబింబార్థాన్ని, అలాగే תֵיטִיב לָךְ యొక్క ‘మేలు చేసుకోవడం/వర్ధిల్లడం’ అనే భావసాధ్యతలను చూపే పదార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను పరిచయం చేస్తుంది; కీర్తనలోని వాదనా ప్రవాహాన్ని నిలుపుతుంది.
- source_word: נַפְשׁוֹ
  choice: తనను తాను
  rationale: נֶפֶשׁ అక్షరార్థంగా ‘ప్రాణం/ఆత్మ’ అయినా, ఇక్కడ వ్యక్తినే సూచించే ప్రతిబింబార్థక ప్రయోగం. తెలుగులో ‘తన ఆత్మ తనను ధన్యపరచుకుంటుంది’ అసహజంగా, భావాన్ని తప్పుదోవ పట్టించేలా ఉంటుంది.
- source_word: בְּחַיָּיו
  choice: అతడు బ్రతికున్నప్పుడు
  rationale: చర్య జరిగే కాలపరిధిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יְבָרֵךְ
  choice: ధన్యుడని అనుకుంటాడు
  rationale: సందర్భంలో తనను తాను ఆశీర్వదించుకోవడం అంటే తన స్థితిని ధన్యమైనదిగా భావించడం. ఈ ఎంపిక ప్రతిబింబార్థాన్ని స్పష్టంగా చేస్తుంది.
- source_word: וְיוֹדֻךָ
  choice: ప్రజలు నిన్ను పొగడతారు
  rationale: బహువచన కర్త నిర్దిష్టంగా చెప్పబడలేదు; తెలుగులో ‘ప్రజలు’ సాధారణ సామాజిక ప్రశంసను స్పష్టంగా వ్యక్తం చేస్తుంది. ידה ఇక్కడ ‘కృతజ్ఞత చెప్పడం’ కంటే ‘పొగడడం’కు అనుకూలం.
- source_word: כִּי
  choice: ఎప్పుడు
  rationale: ఇతరులు ప్రశంసించే పరిస్థితిని సూచిస్తుంది; తెలుగులో ‘చేసుకున్నప్పుడు’ అనే నిర్మాణంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: תֵיטִיב לָךְ
  choice: నీవు నీకు మేలు చేసుకున్నప్పుడు
  rationale: ‘నీ కోసం మేలు చేసుకోవడం’ మరియు ‘వర్ధిల్లడం’ మధ్య ఉన్న భావవిస్తృతిని ప్రధాన పాఠంలో సాధ్యమైనంతవరకు నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. హీబ్రూ నֶפֶשׁ ప్రయోగాన్ని అక్షరానువాదం చేయకుండా దాని సందర్భోచిత ప్రతిబింబార్థాన్ని అందించాం; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
