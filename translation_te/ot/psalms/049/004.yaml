  text: I will incline my ear to a proverb[c][b][a]; I will open my riddle with the lyre.
translation:
  language: te
  text: 'నేను ఒక జ్ఞానోక్తికి[a] చెవి ఒగ్గుతాను;

    లైర్‌తో[b] నా గూఢోక్తిని[c] విప్పుతాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సామెతకు’ లేదా ‘ఉపమానకథకు.’ హీబ్రూ పదం מָשָׁל సామెతను, ఉపమానకథను, లేదా జ్ఞానబోధక వాక్యాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘లైర్‌పై’; సంప్రదాయంగా ‘హార్పుతో.’ హీబ్రూ כִּנּוֹר లైర్‌ను పోలిన ప్రాచీన తంతివాద్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘నా పొడుపుకథను,’ ‘నా చిక్కుమాటను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַטֶּה
  choice: చెవి ఒగ్గుతాను
  rationale: נטה హిఫీల్ రూపం ‘వంచు, తిప్పు, ఒగ్గు’ అనే భావం ఇస్తుంది. ‘చెవి ఒగ్గు’ శ్రద్ధగా వినడాన్ని సహజమైన తెలుగులో తెలియజేస్తూ హీబ్రూ రూపకాన్ని నిలుపుతుంది.
- source_word: לְמָשָׁל
  choice: ఒక జ్ఞానోక్తికి
  rationale: מָשָׁל సామెత, ఉపమానకథ, జ్ఞానబోధక వాక్యం అనే విస్తృత అర్థాలను కలిగి ఉంది. ఈ జ్ఞానకీర్తన సందర్భంలో ‘జ్ఞానోక్తి’ ఆ పరిధిని అతిగా కుదించకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אָזְנִי
  choice: చెవి
  rationale: హీబ్రూలో ఏకవచనం ఉంది; తెలుగులో ‘చెవి ఒగ్గు’ అనే ప్రయోగంలో ఏకవచనమే సహజం.
- source_word: אֶפְתַּח
  choice: విప్పుతాను
  rationale: פתח యొక్క మూలార్థం ‘తెరచు’. గూఢమైన మాటను వెల్లడించే సందర్భంలో ‘విప్పుతాను’ హీబ్రూ రూపకాన్ని కాపాడుతూ తెలుగులో సహజంగా ఉంటుంది; ‘వివరిస్తాను’ అని అర్థాన్ని పూర్తిగా పరిష్కరించదు.
- source_word: בְּכִנּוֹר
  choice: వీణతో
  rationale: כִּנּוֹר ప్రాచీన లైర్ తరహా తంతివాద్యం. సామాన్య తెలుగు పాఠకునికి ‘వీణ’ సులభంగా అర్థమయ్యే సమీప సాంస్కృతిక సమానం; ఖచ్చితమైన వాద్యభేదాన్ని పాదటిప్పణి స్పష్టం చేస్తుంది. ב ఇక్కడ సాధనార్థకంగా తీసుకోబడింది.
- source_word: חִידָתִי
  choice: నా గూఢోక్తిని
  rationale: חִידָה పొడుపుకథ, చిక్కుమాట, గూఢమైన జ్ఞానవాక్యం అనే భావాలను ఇస్తుంది. సందర్భం బోధాత్మకమైనది కనుక ‘గూఢోక్తి’ దాని అర్థం గ్రహించడానికి వివేచన అవసరమనే భావాన్ని నిలుపుతుంది.
