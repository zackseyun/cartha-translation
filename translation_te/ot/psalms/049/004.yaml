translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా గ్రహించగల కవితా శైలి వాడబడింది. రెండు సమాంతర పాదాలు, ప్రథమ పురుష భవిష్యత్ క్రియలు, ‘చెవి ఒగ్గు/గూఢోక్తిని విప్పు’ అనే మూలరూపకాలు నిలుపబడ్డాయి.
