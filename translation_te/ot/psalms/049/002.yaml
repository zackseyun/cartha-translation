  terminology: “సామాన్యులు / ఉన్నతులు” more directly expresses the status contrast than “సామాన్యులు / ప్రముఖులు.” “ధనికులు / పేదలు” is an idiomatic and accurate economic pairing. The literal footnote appropriately preserves the Hebrew expressions.
  issues:
