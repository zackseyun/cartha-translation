  source_fidelity: 'The main sense is faithful: the verse includes people of lower and higher social standing, as well as rich and poor, jointly. The draft’s “ప్రముఖులు” can primarily mean notable or famous people, however, and does not consistently convey the social-rank contrast expressed by the paired Hebrew idiom.'
