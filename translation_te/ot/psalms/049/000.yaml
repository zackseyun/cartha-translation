lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకునికి
  rationale: కీర్తనల శీర్షికల్లో ఈ పదం సంగీత ప్రదర్శనను నడిపించే నాయకుణ్ణి సూచిస్తుంది. ל ఉపసర్గలోని దిశ/అంకిత భావాన్ని ‘-కి’ సహజంగా తెలియజేస్తుంది; అయితే శీర్షికల్లో దాని సంబంధం కొంత అనిశ్చితంగా ఉండటాన్ని పాదటిప్పణి సూచిస్తుంది.
- source_word: לִבְנֵי
  choice: కుమారులది
  rationale: ל ఉపసర్గ రచన, వినియోగం, అంకితం లేదా సమూహ సంబంధాన్ని సూచించవచ్చు. ‘కుమారులది’ కోరహీయుల సమూహంతో అనుబంధాన్ని తెలియజేస్తూ, రచయితలే వారని లేదా వారికోసమేనని ఖచ్చితంగా నిర్ణయించదు.
- source_word: קֹרַח
  choice: కోరహు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: מִזְמוֹר
  choice: ఒక కీర్తన
  rationale: ఈ పదం సాధారణంగా సంగీత సహిత పవిత్ర గీతాన్ని సూచించే ప్రక్రియా నామం. ‘కీర్తన’ తెలుగులో స్థిరపడిన, సహజమైన సమానార్థకం.
