  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సంగీతనాయకుని కోసం.’ కీర్తనల శీర్షికల్లోని హీబ్రూ ఉపసర్గను ‘కు’ లేదా ‘కోసం’ అని అనువదించవచ్చు.
