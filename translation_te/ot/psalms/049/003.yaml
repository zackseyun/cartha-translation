lexical_decisions:
- source_word: פִּי
  choice: నా నోరు
  rationale: మాట నోటినుంచి వెలువడుతుందనే హీబ్రూ రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְדַבֵּר
  choice: పలుకుతుంది
  rationale: ఈ సందర్భంలోని అసంపూర్ణ క్రియ కీర్తనకర్త ఉద్దేశాన్ని ప్రకటిస్తుంది; తెలుగు భవిష్యదర్థక వర్తమాన రూపం సహజంగా ఉంది.
- source_word: חָכְמוֹת
  choice: జ్ఞానాన్ని
  rationale: రూపరీత్యా బహువచనమైనా, ఇక్కడ భావవాచక నామంగా పనిచేస్తుంది; ఏకవచన భావం తెలుగులో సహజం.
- source_word: הָגוּת
  choice: ధ్యానం
  rationale: అంతరంగ చింతన లేదా మననాన్ని సూచిస్తుంది; హృదయం ఆలోచనా కేంద్రంగా ఉన్న హీబ్రూ భావాన్ని కాపాడుతుంది.
- source_word: לִבִּי
  choice: నా హృదయ
  rationale: హీబ్రూ సంబంధాన్ని, హృదయం అంతరంగ ఆలోచనకు కేంద్రం అనే బైబిలీయ చిత్రాన్ని నేరుగా నిలుపుతుంది.
- source_word: תְבוּנוֹת
  choice: వివేకాన్ని
  rationale: రూపరీత్యా బహువచనమైనా భావవాచకంగా ఉంది; జ్ఞానానికి సమాంతరంగా గ్రహణశక్తి, లోతైన అవగాహన అనే భావాన్ని ‘వివేకం’ సహజంగా తెలియజేస్తుంది.
