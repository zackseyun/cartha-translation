translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక సమాంతరత్వాన్ని కాపాడుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన శైలి. రెండో పాదంలో హీబ్రూ నామవాచక వాక్యంలోని భావాన్ని తెలుగులో సంపూర్ణంగా తెలియజేయడానికి ‘వ్యక్తం చేస్తుంది’ చేర్చబడింది.
