id: PSA.49.7
reference: Psalms 49:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָ֗ח לֹא פָדֹ֣ה יִפְדֶּ֣ה אִ֑ישׁ לֹא יִתֵּ֖ן לֵ/אלֹהִ֣ים כָּפְרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/007.yaml
  text: Surely no man can redeem a brother[a], or give to God his ransom—
translation:
  language: te
  text: ఏ మనిషీ తన సోదరుణ్ణి ఎంతమాత్రమూ విమోచించలేడు[a]; అతని కోసం విమోచన వెలను దేవునికి చెల్లించలేడు—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిశ్చయంగా, ఏ మనిషీ మరొక మనిషిని విమోచించలేడు; అతని కోసం విమోచన వెలను దేవునికి చెల్లించలేడు.”
    reason: אָח ను ‘సోదరుడు’ అనే నామవాచకంగా తీసుకోవాలా, ‘నిశ్చయంగా’ అనే ఉద్ఘాటనగా తీసుకోవాలా అన్న మూలభాషా సందిగ్ధతను సూచించడానికి.
lexical_decisions:
- source_word: אָח
  choice: తన సహోదరుణ్ణి
  rationale: אָח యొక్క సాధారణ అర్థం ‘సహోదరుడు’. ఇక్కడ అది కేవలం రక్తసంబంధ సహోదరునికే పరిమితం కాక, సాటి మనిషిని సూచించవచ్చు. హీబ్రూ పదక్రమంలోని సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
- source_word: פָדֹה יִפְדֶּה
  choice: ఎంతమాత్రమూ విమోచించలేడు
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియ తీవ్రతను తెలియజేస్తుంది; నిరాకరణతో కలిపి సంపూర్ణ అసమర్థతను సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఎంతమాత్రమూ ... లేడు’ ఆ బలాన్ని సహజంగా అందిస్తుంది.
- source_word: אִישׁ
  choice: ఒకడు
  rationale: אִישׁ ఏకవచన పురుషవాచకం. ‘ఒకడు’ మూలంలోని ఏకవచన మానవ ప్రతినిధిత్వాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: לֵאלֹהִים
  choice: దేవునికి
  rationale: ఈ కీర్తన సందర్భంలో אֱלֹהִים ఏకైక దేవుణ్ణి సూచిస్తుంది.
- source_word: כָּפְרוֹ
  choice: అతని విమోచన వెలను
  rationale: כֹּפֶר విడుదల కోసం చెల్లించే మూల్యాన్ని సూచిస్తుంది. ‘విమోచన వెల’ ఆర్థిక-విమోచన రూపకాన్ని స్పష్టంగా ఉంచుతుంది; అవసరం లేని బలిపరమైన భావాన్ని చేర్చదు.
theological_decisions:
- issue: దేవునికి ఇచ్చే כֹּפֶר యొక్క భావం
  choice: ఒక మనిషి ప్రాణవిమోచన కోసం దేవునికి చెల్లించే వెల
  alternative: ప్రాయశ్చిత్త వెల లేదా సాధారణ విడుదల మూల్యం
  rationale: సందర్భం మరణం నుంచి మనిషిని ధనమూల్యంతో విడిపించలేని అసమర్థతను చెబుతుంది. ‘విమోచన వెల’ ఆ రూపకాన్ని నిలుపుతుంది; పూర్తి బలిపరమైన సిద్ధాంతాన్ని వచనంలోకి దిగుమతి చేయదు.
- issue: మొదటి పాదంలోని אָח పదనిర్మాణ సందిగ్ధత
  choice: אָח ను క్రియకు కర్మగా తీసుకొని ‘తన సహోదరుణ్ణి’ అని అనువదించడం
  alternative: אָח ను ఉద్ఘాటనాత్మక క్రియావిశేషణంగా తీసుకొని ‘నిశ్చయంగా’ అని అనువదించడం
  rationale: మసొరేటిక్ పదక్రమం కఠినమైనదైనా, ‘సహోదరుడు’ అనే నామవాచక భావం సందర్భానికి సరిపోతుంది. నిజమైన సందిగ్ధతను పాదటిప్పణిలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కీర్తనా శైలిని ఉంచుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడాం. తరువాతి వచనంతో వాక్యం కొనసాగుతుందని సూచించడానికి చివర దీర్ఘ విరామచిహ్నం ఉంచాం.
