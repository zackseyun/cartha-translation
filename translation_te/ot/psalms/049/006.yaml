translation:
  language: te
  text: 'తమ సంపదపై నమ్మకం పెట్టుకొని,

    తమ ఐశ్వర్య సమృద్ధిని బట్టి గొప్పలు చెప్పుకునేవారు—[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ ఐశ్వర్య సమృద్ధిలో గర్వించేవారు.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ חַיִל అనే పదానికి “బలం” లేదా “వనరులు” అనే అర్థాలు కూడా ఉండవచ్చు; అయితే ఇక్కడ “ఐశ్వర్య సమృద్ధి”తో ఉన్న సమాంతరత భౌతిక సంపదను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֹּטְחִים
  choice: నమ్మకం పెట్టుకొని ... వారు
  rationale: నిర్దిష్ట ఆర్టికల్‌తో ఉన్న ఖాల్ వర్తమాన కృదంతం ఒక వర్గాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘...వారు’ సహజంగా ఉండి, వారి నిరంతర లక్షణాన్ని తెలియజేస్తుంది.
- source_word: עַל
  choice: పై
  rationale: בטח అనే క్రియతో עַל ఆధారపడే వస్తువును సూచిస్తుంది. ‘సంపదపై నమ్మకం పెట్టుకోవడం’ ఆధునిక తెలుగులో సహజంగా ఆ సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: חֵילָם
  choice: తమ సంపద
  rationale: חַיִלకు ‘బలం,’ ‘సైన్యం,’ ‘వనరులు,’ ‘సంపద’ అనే అర్థాలు ఉండవచ్చు. సమాంతర పాదంలోని עֹשֶׁר కారణంగా ఇక్కడ భౌతిక సంపద భావమే సందర్భోచితం.
- source_word: וּבְרֹב
  choice: సమృద్ధిని బట్టి
  rationale: רֹב అధిక పరిమాణం లేదా సమృద్ధిని సూచిస్తుంది. בְּతో కలిసి గొప్పలు చెప్పుకోవడానికి ఆధారమైన విషయాన్ని తెలుగులో ‘...ను బట్టి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָשְׁרָם
  choice: తమ ధనసమృద్ధి
  rationale: עֹשֶׁר ప్రత్యేకంగా ధనం లేదా ఐశ్వర్యాన్ని సూచిస్తుంది. మొదటి పాదంలోని ‘సంపద’తో కవితాత్మక సమాంతరతను నిలుపుతూ పదభేదాన్ని కాపాడేందుకు ‘ధనసమృద్ధి’ ఎంచుకోబడింది.
- source_word: יִתְהַלָּלוּ
  choice: గొప్పలు చెప్పుకునేవారు
  rationale: הלל హిత్పయేల్ రూపం ఇక్కడ తనకు ఉన్నదానిని బట్టి అతిశయించడం లేదా గర్వించడం అనే భావాన్ని ఇస్తుంది. ‘గొప్పలు చెప్పుకోవడం’ సాధారణ ఆధునిక తెలుగులో స్పష్టమైన సమానార్థకం.
