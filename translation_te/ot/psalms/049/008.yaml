source:
  edition: WLC
  text: וְ֭/יֵקַר פִּדְי֥וֹן נַפְשָׁ֗/ם וְ/חָדַ֥ל לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/008.yaml
  text: For the ransom of their life is costly[a], and it ceases forever[b],
translation:
  language: te
  text: వారి ప్రాణానికి[a] విమోచన వెల ఖరీదైనది; అది ఎప్పటికీ ఆగిపోతుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రాణం’ అనే పదాన్ని ‘ఆత్మ’ అని కూడా అనువదించవచ్చు. హీబ్రూ నెఫెష్ తరచుగా కేవలం అమూర్తమైన ఆత్మను కాక, జీవాన్ని లేదా జీవిస్తున్న వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ వాక్యభాగం చాలా సంక్షిప్తంగా ఉంది. మరింత అక్షరార్థంగా, ‘మరియు అది శాశ్వతంగా ఆగిపోతుంది’ అని అనువదించవచ్చు. దీని భావం విమోచన ప్రయత్నం శాశ్వతంగా విఫలమవడం లేదా దానిని పూర్తిగా మానుకోవాల్సి రావడం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֵקַר
  choice: ఎంతో అధికం
  rationale: יקר ఇక్కడ విలువైనది లేదా ఖరీదైనది అనే భావాన్ని ఇస్తుంది. విమోచన వెల సందర్భంలో ‘ఎంతో అధికం’ సహజంగా ఉండి, చెల్లించలేనంత అని పాఠ్యంలో లేని మాటను స్పష్టంగా చేర్చదు.
- source_word: פִּדְיוֹן
  choice: విమోచన వెల
  rationale: ఈ నామవాచకం విడుదల కోసం చెల్లించే మూల్యాన్ని సూచిస్తుంది. ‘విమోచన వెల’ లావాదేవీ భావాన్ని నిలుపుతుంది.
- source_word: נַפְשָׁם
  choice: వారి ప్రాణానికి
  rationale: נפש ఇక్కడ అమూర్తమైన ఆత్మను మాత్రమే కాక జీవాన్ని లేదా జీవిస్తున్న వ్యక్తిని సూచిస్తుంది. మరణం నుంచి విమోచించే సందర్భంలో ‘ప్రాణం’ తగిన ఆధునిక తెలుగు పదం.
- source_word: וְחָדַל
  choice: ఆ ప్రయత్నం ... విఫలమవుతుంది
  rationale: חדל యొక్క ప్రాథమిక భావం ఆగిపోవడం, మానిపోవడం లేదా విఫలమవడం. సంక్షిప్తమైన హీబ్రూ వాక్యాన్ని తెలుగులో అర్థవంతంగా చేయడానికి ‘ఆ ప్రయత్నం’ అని సందర్భానుసారంగా పూరించబడింది; అనిశ్చితి పాదసూచికలో నిలుపబడింది.
- source_word: לְעוֹלָם
  choice: శాశ్వతంగా
  rationale: ఈ సందర్భంలో לעולם నిరంతరమైన లేదా తుద స్థితిని సూచిస్తుంది; ‘శాశ్వతంగా’ దాని కాలబలాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: మరణం మరియు విమోచన సందర్భంలో נפש అర్థం
  choice: ప్రాణం
  alternative: ఆత్మ
  rationale: కీర్తనలో మనిషి జీవాన్ని మరణం నుంచి విమోచించలేకపోవడం ప్రధానాంశం. ‘ప్రాణం’ హీబ్రూ పదం యొక్క జీవం/వ్యక్తి భావాన్ని నిలుపుతూ, తరువాతి కాలపు దేహ–ఆత్మ విభజనను పాఠ్యంలోకి దిగుమతి చేయదు.
- issue: וְחָדַל לְעוֹלָם అనే సంక్షిప్త వాక్యభాగం యొక్క అర్థం
  choice: విమోచన ప్రయత్నం శాశ్వతంగా విఫలమవుతుంది
  alternative: అది శాశ్వతంగా ఆగిపోతుంది; దానిని శాశ్వతంగా మానుకోవాలి
  rationale: హీబ్రూ వాక్యభాగం కర్తను స్పష్టంగా చెప్పదు. ప్రధాన అనువాదం కీర్తన సందర్భంలోని విమోచన ప్రయత్నాన్ని సూచించినా, సాధ్యమైన మరింత అక్షరార్థ పఠనాలను పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘విమోచన వెల’ ద్వారా మూలంలోని ఆర్థిక రూపకాన్ని నిలిపాం; క్లిష్టమైన రెండో వాక్యభాగంలోని అనిశ్చితిని పాదసూచికలో స్పష్టంగా ఉంచాం.
