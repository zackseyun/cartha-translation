  rationale: షియోల్‌కు వారి గమ్య-అప్పగింపును తెలుగులో సహజంగా, మూలానికి సమీపంగా చేయడానికి “నియమించబడ్డారు”ను “అప్పగించబడ్డారు”గా మార్చాం. చివరి, పాఠపరంగా క్లిష్టమైన మִזְּבֻל לוֹ పదబంధంలో అస్పష్టమైన సర్వనామాన్ని ప్రధాన పాఠం నుండి తొలగించాం; అనిశ్చిత ప్రత్యామ్నాయాలను పాదసూచికలోనే నిలిపాం. మిగిలిన రూపకాలు, కాలసూచన, మరియు షియోల్ పదాన్ని యథాతథంగా ఉంచాం.
