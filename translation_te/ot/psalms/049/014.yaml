id: PSA.49.14
reference: Psalms 49:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כַּ/צֹּ֤אן לִֽ/שְׁא֣וֹל שַׁתּוּ֮ מָ֤וֶת יִ֫רְעֵ֥/ם וַ/יִּרְדּ֘וּ בָ֤/ם יְשָׁרִ֨ים לַ/בֹּ֗קֶר ו/ציר/ם לְ/בַלּ֥וֹת שְׁא֗וֹל מִ/זְּבֻ֥ל לֽ/וֹ׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/014.yaml
  text: Like sheep they are appointed for Sheol[a]; death will shepherd them, and the upright will rule over them in the morning. Their form will waste away in Sheol[d][c][b], far from its lofty dwelling.
translation:
  language: te
  text: 'గొర్రెల్లా వారు షియోల్‌కు[a] అప్పగించబడ్డారు;


    మృత్యువు వారిని మేపుతుంది.


    ఉదయాన యథార్థవంతులు వారిమీద ఏలుతారు.[b]


    వారి రూపం[c] షియోల్‌లో క్షీణించిపోతుంది,


    ఉన్నతమైన నివాసం నుండి దూరంగా.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: షియోల్ అంటే మృతుల లోకం; అది కేవలం ‘సమాధి’కన్నా విస్తృతమైన భావం.
    reason: cultural_note
  - marker: b
    text: లేదా, “ఉదయాన యథార్థవంతులు వారిమీద ఆధిపత్యం చెలాయిస్తారు.”
    reason: alternative_reading
  - marker: c
    text: లేదా, “వారి బలం/దుర్గం.” ఈ హెబ్రీ పదబంధం క్లిష్టమైనది; సందర్భాన్ని బట్టి ప్రధాన పాఠంలో “వారి రూపం” అని అనువదించాం.
    reason: lexical_alternative
  - marker: d
    text: 'చివరి హెబ్రీ పదబంధం క్లిష్టమైనది. మరొక సాధ్యమైన అనువాదం: “షియోల్ వారి రూపాన్ని క్షీణింపజేస్తుంది; వారికి నివాసం ఉండదు,” లేదా “షియోల్ వారి ఉన్నత నివాసం నుండి వారిని క్షీణింపజేస్తుంది.”'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּצֹּאן
  choice: గొర్రెల్లా
  rationale: צֹאן సమూహార్థకంగా గొర్రెలను లేదా చిన్న పశువుల మందను సూచిస్తుంది. ఇక్కడి ఉపమానాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לִשְׁאוֹל
  choice: షియోల్‌కు
  rationale: ל దిశను లేదా గమ్యాన్ని సూచిస్తుంది. שְׁאוֹל‌ను కేవలం భౌతిక సమాధిగా కుదించకుండా మూలపదాన్ని లిప్యంతరీకరించాం.
- source_word: שַׁתּוּ
  choice: నియమించబడ్డారు
  rationale: ఈ క్రియకు ‘ఉంచు, నియమించు’ అనే భావం ఉంది. సందర్భంలో వారు షియోల్‌కు అప్పగించబడిన గమ్యాన్ని ఇది వ్యక్తం చేస్తుంది.
- source_word: מָוֶת יִרְעֵם
  choice: మృత్యువు వారిని మేపుతుంది
  rationale: רעה అంటే మందను మేపడం లేదా కాయడం. గొర్రెల ఉపమానాన్ని కొనసాగిస్తూ మృత్యువును వ్యంగ్యంగా వారి కాపరిగా చూపే చిత్రాన్ని నిలుపుతుంది.
- source_word: וַיִּרְדּוּ בָם
  choice: వారిమీద ఏలుతారు
  rationale: ఈ రూపం ఇక్కడ ఆధిపత్యం చెలాయించడం అనే భావాన్ని ఇస్తుంది. ‘తొక్కుతారు’ అనే సాధ్యార్థాన్ని ప్రధాన పాఠంలో బలవంతంగా చేర్చలేదు.
- source_word: יְשָׁרִים
  choice: యథార్థవంతులు
  rationale: ఈ పదం నిటారుగా, నిజాయితీగా నడిచేవారిని సూచిస్తుంది; భిన్నమైన హెబ్రీ పదానికి సాధారణంగా వాడే ‘నీతిమంతులు’ అనే పదంతో కలపకుండా చూశాం.
- source_word: לַבֹּקֶר
  choice: ఉదయాన
  rationale: కాలసూచక పదబంధాన్ని సంక్షిప్తంగా అనువదిస్తుంది; ఉదయం దేనికి ప్రతీక అనే వ్యాఖ్యానాన్ని పాఠంలో నిర్ణయించదు.
- source_word: וְצוּרָם / וְצִירָם
  choice: వారి రూపం
  rationale: హెబ్రీ పాఠం, పదార్థం క్లిష్టమైనవి. తరువాతి ‘క్షీణించు’ భావానికి సరిపోయే సందర్భాధారిత అర్థంగా ‘రూపం’ ఎంచుకుని, ఇతర సాధ్యతలను పాదసూచికలో ఉంచాం.
- source_word: לְבַלּוֹת
  choice: క్షీణించిపోతుంది
  rationale: בלה అరిగిపోవడం, క్షీణించడం, నశించడం అనే భావాన్ని ఇస్తుంది. తెలుగులో సహజమైన వాక్యనిర్మాణం కోసం సమాపక క్రియగా ఇచ్చాం.
- source_word: מִזְּבֻל לוֹ
  choice: దాని ఉన్నత నివాసానికి దూరంగా
  rationale: זְבֻל ఉన్నతమైన నివాసాన్ని సూచించగలదు. క్లిష్టమైన చివరి పదబంధాన్ని ముందున్న క్షీణతకు సంబంధించిన స్థలవివరణగా తీసుకున్నాం; అనిశ్చితిని పాదసూచికలో స్పష్టంచేశాం.
theological_decisions:
- issue: שְׁאוֹל అనువాదం
  choice: షియోల్
  alternative: పాతాళం; సమాధి; మృతుల లోకం
  rationale: ఈ హెబ్రీ పదం కేవలం భౌతిక సమాధికన్నా విస్తృతమైన మృతుల లోకాన్ని సూచించగలదు. తరువాతి సిద్ధాంతవ్యవస్థను పాఠంపై రుద్దకుండా మూలపదాన్ని నిలిపి, అర్థాన్ని పాదసూచికలో తెలిపాం.
- issue: ‘ఉదయం’ యొక్క భావం
  choice: ఉదయాన
  alternative: తెల్లవారేసరికి
  rationale: ఇది విమోచన, తీర్పు లేదా పునరుత్థానాన్ని తప్పనిసరిగా సూచిస్తుందని పాఠంలో నిర్ణయించకుండా హెబ్రీ కాలసూచనను నిలుపుతుంది.
- issue: మృత్యువు వ్యక్తీకరణ
  choice: మృత్యువు వారిని మేపుతుంది
  alternative: మృత్యువు వారిని భక్షిస్తుంది
  rationale: ‘మేపు/కాయు’ అనే ప్రత్యక్ష క్రియార్థం గొర్రెల చిత్రాన్ని కొనసాగిస్తుంది. ‘భక్షిస్తుంది’ అనేది సాధ్యమైన వ్యాఖ్యానమైనా, మూలంలోని ఉద్దేశపూర్వక ఉద్రిక్తతను తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా ధోరణిని ఉంచాం. ‘మృత్యువు వారిని మేపుతుంది’ అనే అసాధారణమైన కానీ మూలచిత్రానికి నమ్మకమైన వ్యక్తీకరణను సరళీకరించలేదు. ‘షియోల్’ అనే లిప్యంతరీకరణకు పాదసూచిక వివరణ ఇచ్చాం. అన్ని అనిశ్చిత పఠనాలను ప్రధాన పాఠంలో పరిష్కరించినట్టు చూపకుండా పాదసూచికల్లో నిలిపాం.
