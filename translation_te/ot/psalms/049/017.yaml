id: PSA.49.17
reference: Psalms 49:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י לֹ֣א בְ֭/מוֹת/וֹ יִקַּ֣ח הַ/כֹּ֑ל לֹא יֵרֵ֖ד אַחֲרָ֣י/ו כְּבוֹדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/017.yaml
  text: For at his death he will take nothing[c][b][a]; his glory will not go down after him.
translation:
  language: te
  text: ఎందుకంటే, అతడు చనిపోయేటప్పుడు ఏదీ తనతో తీసుకుపోడు[a]; అతని వైభవం[b] అతని వెంట దిగిపోదు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దానిలో ఏదీ తీసుకుపోడు’; అక్షరార్థంగా, ‘మొత్తమంతా తీసుకోడు.’
    reason: lexical_alternative
  - marker: b
    text: ‘వైభవం’ అనే పదం అతని ఘనత, ప్రతిష్ఠ, శోభ లేదా సంపద-హోదాను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘అతని వెంట దిగిపోదు’ అనే మాట మరణం, సమాధి లేదా పాతాళాన్ని సూచించే అవకాశం ఉంది; అయితే హీబ్రూ పాఠ్యం గమ్యస్థానాన్ని స్పష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని లేదా వివరణను పరిచయం చేస్తుంది; కీర్తనలోని తార్కిక ప్రవాహాన్ని సహజమైన తెలుగులో చూపుతుంది.
- source_word: בְמוֹתוֹ
  choice: అతడు చనిపోయేటప్పుడు
  rationale: ב ఉపసర్గతో ఉన్న ‘అతని మరణం’ అనే రూపానికి ఇక్కడ కాలార్థం ఉంది; ఆధునిక తెలుగులో ఇది సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: לֹא ... יִקַּח הַכֹּל
  choice: ఏదీ తనతో తీసుకుపోడు
  rationale: అక్షరార్థంగా ‘మొత్తమంతా తీసుకోడు’; నిరాకరణతో కలిసిన సందర్భార్థం ‘దానిలో ఏదీ తీసుకుపోడు.’ మరణసందర్భం వల్ల ‘తనతో’ అనేది తెలుగులో సహజంగా అంతర్లీన భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: יֵרֵד אַחֲרָיו
  choice: అతని వెంట దిగిపోదు
  rationale: ‘దిగిపోవడం’ అనే హీబ్రూ దృశ్యరూపాన్ని, అలాగే గమ్యస్థానం చెప్పకపోవడాన్ని నిలుపుతుంది; אַחֲרָיוకు ‘అతని వెంట’ సహజమైన సందర్భానువాదం.
- source_word: כְּבוֹדוֹ
  choice: అతని వైభవం
  rationale: כבוד ఇక్కడ ఘనత, ప్రతిష్ఠ, సంపదతో కూడిన ప్రాపంచిక వైభవం వంటి విస్తృత భావాలను కలిగి ఉంది. ‘వైభవం’ కవితాత్మకతను, సందర్భంలోని భౌతిక-సామాజిక భావవిస్తృతిని నిలుపుతుంది.
theological_decisions:
- issue: మరణానంతర దిగిపోవడం సూచించే గమ్యస్థానం
  choice: ‘దిగిపోదు’ అనే దృశ్యరూపాన్ని ఉంచి, గమ్యస్థానాన్ని ప్రధాన పాఠ్యంలో పేర్కొనలేదు.
  alternative: ‘పాతాళానికి దిగిపోదు’ లేదా ‘సమాధికి అతని వెంట రాదు.’
  rationale: హీబ్రూ క్రియ మరణం, సమాధి లేదా షియోల్‌ను సూచించవచ్చు; అయితే గమ్యస్థానం స్పష్టంగా లేదు. దానిని నిర్దిష్టం చేయకుండా ఉంచడం మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి. ‘తీసుకుపోడు’ సాధారణ పాఠకుడికి సహజంగా ఉండగా, ‘దిగిపోదు’ మూలంలోని దృశ్యరూపాన్నీ theological ambiguityనూ నిలుపుతుంది.
