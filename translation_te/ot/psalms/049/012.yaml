source:
  edition: WLC
  text: וְ/אָדָ֣ם בִּ֭/יקָר בַּל יָלִ֑ין נִמְשַׁ֖ל כַּ/בְּהֵמ֣וֹת נִדְמֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/012.yaml
  text: But man in honor does not remain[c][b][a]; he is like the beasts that perish.
translation:
  language: te
  text: అయితే గౌరవంలో ఉన్న మనిషి[a] నిలిచి ఉండడు[b]; నశించే జంతువులతో అతడు పోల్చబడ్డాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మానవజాతి.’ హెబ్రీలోని אָדָם ‘మనిషి’ లేదా ‘మానవజాతి’ అని అర్థమివ్వవచ్చు; ఇక్కడ ఏకవచనం ప్రతినిధి భావంలో ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘రాత్రి బస చేయడు.’ ఈ ప్రయోగం గౌరవస్థితిలో కొనసాగకపోవడం లేదా నిలిచి ఉండకపోవడం అనే భావాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘నాశనమయ్యే జంతువులతో.’ చివరి క్రియను ఇక్కడ సాంప్రదాయంగా నశించడాన్ని లేదా నాశనమవడాన్ని సూచించేదిగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: మనిషి
  rationale: ఏకవచన రూపం ఇక్కడ మానవుని ప్రతినిధిగా చూపుతుంది; ఆధునిక తెలుగులో ‘మనిషి’ సహజంగా ఉండి, మానవజాతికి వర్తించే సామెతసదృశ భావాన్ని నిలుపుతుంది.
- source_word: בִּיקָר
  choice: గౌరవస్థితిలో
  rationale: יָקָר ఇక్కడ కేవలం ధనాన్ని కాక గౌరవం, ప్రతిష్ఠ, వైభవం కలిగిన స్థితిని సూచిస్తుంది. ‘గౌరవస్థితిలో’ అనే రూపం יָלִין‌తో ఉన్న సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַּל יָלִין
  choice: నిలిచి ఉండడు
  rationale: యָלִין అక్షరార్థంగా ‘రాత్రి బసచేయు’ అని అర్థమివ్వగలిగినా, ఈ జ్ఞానసాహిత్య సందర్భంలో గౌరవస్థితి కొనసాగదనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נִמְשַׁל
  choice: వలె అతడు ఉన్నాడు
  rationale: నిఫాల్ రూపం పోలికను తెలియజేస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘జంతువులవలె అతడు ఉన్నాడు’ అనేది గంభీరంగా, సహజంగా ఉంటుంది.
- source_word: כַּבְּהֵמוֹת
  choice: జంతువులవలె
  rationale: בְּהֵמוֹת సాధారణంగా జంతువులను సూచిస్తుంది. ‘మృగాలు’ కంటే ‘జంతువులు’ విస్తృతమైన మూలార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: נִדְמוּ
  choice: నశించిపోయే
  rationale: ఈ సందర్భంలో సాంప్రదాయంగా ‘నశించు/నాశనమగు’ అనే అర్థం తీసుకోబడుతుంది; మానవ మరణశీలతతో పోలికను ఇది స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: אָדָם యొక్క ప్రతినిధి ఏకవచనం
  choice: మనిషి
  alternative: మానవజాతి
  rationale: మూలంలోని ఏకవచన రూపాన్ని నిలుపుతూ, వాక్యం సమస్త మానవులకు వర్తిస్తుందనే భావాన్ని సందర్భం ద్వారా తెరిచి ఉంచుతుంది.
- issue: נִדְמוּ యొక్క భావం
  choice: నశించిపోయే
  alternative: నాశనం చేయబడే / మూగబోయే
  rationale: కీర్తనలోని మరణశీలత అంశానికి ‘నశించిపోయే’ బాగా సరిపోతుంది; అయితే హెబ్రీ క్రియకు సంబంధించిన ప్రత్యామ్నాయ భావాన్ని పాదసూచనలో నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; జ్ఞానసాహిత్యానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదప్రయోగం. మూలంలోని రెండు సమాంతర అర్ధపాదాలు మరియు మానవ గౌరవం–మరణశీలత మధ్య ఉద్రిక్తత సంరక్షించబడ్డాయి.
