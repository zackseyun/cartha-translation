id: PSA.49.9
reference: Psalms 49:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וִֽ/יחִי ע֥וֹד לָ/נֶ֑צַח לֹ֖א יִרְאֶ֣ה הַ/שָּֽׁחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/009.yaml
  text: that he should still live on forever and not see the Pit[a].
translation:
  language: te
  text: 'అతడు ఎప్పటికీ జీవిస్తూ,

    గుంటను చూడకుండా ఉండేలా.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִיחִי
  choice: జీవిస్తూనే ఉండి
  rationale: ముందటి వాక్యంలోని ఆలోచనను కొనసాగిస్తూ, సాధించలేని ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో కొనసాగుతున్న జీవన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עוֹד
  choice: -తూనే ఉండి
  rationale: జీవితం ఇంకా కొనసాగడాన్ని సూచించే עוֹד భావాన్ని తెలుగు క్రియారూపంలో సహజంగా కలిపింది.
- source_word: לָנֶצַח
  choice: నిత్యం
  rationale: అంతం లేని కాలవ్యాప్తిని గౌరవప్రదమైన, సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לֹא
  choice: చూడకుండా
  rationale: తదుపరి క్రియను నిషేధించే భావాన్ని ఉద్దేశార్థక వాక్యనిర్మాణంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִרְאֶה
  choice: చూడకుండా
  rationale: హీబ్రూ భాషలోని ‘చూచుట’ అనే రూపకాన్ని నిలుపుతుంది; ‘అనుభవించుట’ అని అర్థాన్ని ముందుగానే నిర్ధారించదు.
- source_word: הַשָּׁחַת
  choice: గోతిని
  rationale: మరణం, సమాధి, నాశనం అనే భావవ్యాప్తిని కలిగిన కవితాత్మక చిత్రాన్ని నిలుపుతూ, ఒక్క అర్థానికే పరిమితం చేయదు.
theological_decisions:
- issue: మరణ సందర్భంలో שחת పదార్థం
  choice: గోతి
  alternative: సమాధి; కుళ్లు లేదా నాశనం
  rationale: ‘గోతి’ అనే రూపం మరణంలోకి దిగిపోవడం, సమాధి, నాశనం వంటి హీబ్రూ కవితాత్మక భావవ్యాప్తిని కాపాడుతుంది. ఇతర సాధ్యమైన అర్థాలను పాదటీకలో ఉంచడం ద్వారా అసలులోని సందిగ్ధతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి. ఈ భాగం ముందటి వచనంలోని ఉద్దేశం లేదా సాధించలేని ఫలితాన్ని కొనసాగిస్తుందనే భావాన్ని చివరి ‘ఉండేలా’ ద్వారా నిలిపింది.
