source:
  edition: WLC
  text: לָ֣/מָּה אִ֭ירָא בִּ֣/ימֵי רָ֑ע עֲוֺ֖ן עֲקֵבַ֣/י יְסוּבֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/005.yaml
  text: Why should I fear in days of evil[a], when the iniquity of my pursuers surrounds me?
translation:
  language: te
  text: కీడు దినాల్లో, నన్ను కూలదోయాలని చూసేవారి దోషం నన్ను చుట్టుముట్టినప్పుడు నేను ఎందుకు భయపడాలి?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, ‘నా మడమల దోషం.’ ఈ హెబ్రీ పదబంధం ‘నా మడమల వెంట ఉన్న దోషం’ అని, నన్ను వెంబడించే దోషం అని, లేదా నన్ను మడమ పట్టి కూలదోయాలని చూసేవారి దోషం అని అర్థమవవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: לָמָּה אִירָא
  choice: నేనెందుకు భయపడాలి?
  rationale: లָמָּהతో కూడిన అసంపూర్ణ క్రియ ఇక్కడ అలంకారిక ప్రశ్నను వ్యక్తం చేస్తుంది. ‘నేనెందుకు భయపడాలి?’ అనేది ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בִּימֵי רָע
  choice: కీడు కలిగే రోజుల్లో
  rationale: రָע అనే పదంలోని కీడు, ఆపద, విపత్తు వంటి విస్తృత భావాన్ని ఒకే నిర్దిష్ట పరిస్థితికి పరిమితం చేయకుండా వ్యక్తం చేస్తుంది.
- source_word: עָוֹן
  choice: దోషం
  rationale: ఈ పదం పాపకార్యం, దోషం, అపరాధభారం లేదా దాని పర్యవసానాన్ని సూచించగలదు. ‘దోషం’ నైతిక బరువును నిలుపుతూ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: עֲקֵבַי
  choice: నన్ను కూలదోయాలని చూసేవారి
  rationale: పదశః ‘నా మడమలు’ అయిన ఈ క్లిష్టమైన రూపం, మడమ పట్టి పడదోయడం లేదా వెనుకనుంచి హాని చేయడం అనే భావాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో సందర్భానికి సరిపోయే శత్రుభావ అర్థాన్ని స్పష్టంగా, కానీ పాదసూచికలో మూలంలోని అస్పష్టతను నిలిపేలా అనువదించబడింది.
- source_word: יְסוּבֵּנִי
  choice: నన్ను చుట్టుముట్టినప్పుడు
  rationale: סבב క్రియలోని చుట్టుముట్టడం/ఆవరించడం అనే ప్రాథమిక భావాన్ని నిలుపుతుంది; వాక్య సంబంధాన్ని తెలుగులో సహజంగా చూపేందుకు ‘అప్పుడు’ భావంతో నిర్మించబడింది.
theological_decisions:
- issue: עֲוֹן עֲקֵבַי అనే క్లిష్ట పదబంధం యొక్క భావం
  choice: నన్ను కూలదోయాలని చూసేవారి దోషం
  alternative: నా మడమల దోషం; నా మడమల వెంట వచ్చే దోషం; నన్ను వెంబడించేవారి అపరాధం
  rationale: కీర్తన సందర్భంలో సంపన్నులైన విరోధుల వల్ల కలిగే భయాన్ని ఉద్దేశించిన అర్థం సరిపోతుంది. అయినా హెబ్రీ పదబంధం కవి స్వదోషాన్ని సూచిస్తుందా, వెంటాడే దోషాన్ని సూచిస్తుందా, లేక శత్రువులను సూచిస్తుందా అన్నది పూర్తిగా నిర్ధారించదు; అందువల్ల ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. హెబ్రీ సమాంతరతను గౌరవించేందుకు ప్రశ్నను రెండు పాదాలుగా ఉంచినా, తెలుగులో పూర్తి ప్రశ్న స్పష్టంగా వినిపించేందుకు రెండో పాదంలో ప్రశ్నను పునరుక్తి చేశాం.
