translation:
  language: te
  text: 'ప్రజలందరూ, ఇది వినండి;

    లోకంలో నివసించే వారందరూ[a], చెవియొగ్గండి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘భూమి మీద నివసించే వారందరూ.’ హీబ్రూ חָלֶד మానవ జీవన లోకాన్ని లేదా భూలోక పరిధిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: వినండి
  rationale: שׁמע క్రియ యొక్క బహువచన ఆజ్ఞారూపం. శ్రద్ధగా వినాలనే ప్రత్యక్ష పిలుపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: זֹאת
  choice: ఇది
  rationale: తరువాత రాబోయే కీర్తనకర్త బోధన లేదా ప్రకటనను సూచించే సాధారణ నిర్దేశక సర్వనామం.
- source_word: כָּל הָעַמִּים
  choice: ప్రజలందరూ
  rationale: עַמִּים అనేక ప్రజాసమూహాలను విస్తృతంగా సూచిస్తుంది. ‘ప్రజలందరూ’ విశ్వవ్యాప్త సంబోధనను సహజంగా వ్యక్తం చేస్తుంది; దానిని రాజకీయ దేశాలకు మాత్రమే పరిమితం చేయదు.
- source_word: הַאֲזִינוּ
  choice: చెవియొగ్గండి
  rationale: אזן క్రియ యొక్క బహువచన ఆజ్ఞారూపం; శ్రద్ధగా ఆలకించమనే కవితాత్మక పిలుపు. ఇది మొదటి పాదంలోని ‘వినండి’తో సమాంతరతను నిలుపుతుంది.
- source_word: כָּל יֹשְׁבֵי
  choice: నివసించే వారందరూ
  rationale: ఈ కృదంత నిర్మాణం ఒక ప్రాంతంలో నివసించే వారిని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ఇది సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: חָלֶד
  choice: లోకం
  rationale: חָלֶד మానవ జీవన లోకాన్ని, నివాసిత భూలోకాన్ని, లేదా భౌతిక జీవన పరిధిని సూచించగలదు. విశ్వవ్యాప్త పిలుపున్న ఈ సందర్భంలో ‘లోకం’ ప్రధాన భావాన్ని కాపాడుతుంది; ‘భూమి’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
