  text: Deliver me from all my transgressions[a]; do not make me the reproach of a fool.
translation:
  language: te
  text: 'నా అతిక్రమాలన్నిటి నుండి నన్ను విడిపించు;

    మూర్ఖుని నిందకు నన్ను గురిచేయకు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మూర్ఖునికి సంబంధించిన అవమానంగా నన్ను చేయకు.” హీబ్రూ మాటలను, మూర్ఖుని నిందకు లక్ష్యమవడం అనీ లేదా మూర్ఖత్వంతో ముడిపడిన అవమానంగా మారడం అనీ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל
  choice: అన్నిటి నుండి
  rationale: מִן తో కూడిన כָּל, వక్త తన అతిక్రమాల మొత్తం నుండి విడిపించబడాలని కోరుతున్న భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: פְּשָׁעַי
  choice: నా అతిక్రమాలు
  rationale: פֶּשַׁע అనేది కేవలం పొరపాటును కాక, నైతిక హద్దును మీరడం లేదా అధికారానికి వ్యతిరేకంగా తిరుగుబాటు చేయడం అనే బలమైన భావాన్ని కలిగి ఉంది. ‘అతిక్రమాలు’ ఆ భావాన్ని సంక్షిప్తంగా, గంభీరంగా నిలుపుతుంది.
- source_word: הַצִּילֵנִי
  choice: నన్ను విడిపించు
  rationale: נצל యొక్క హిఫిల్ ఆజ్ఞారూపం ప్రమాదం, భారము లేదా పరిణామాల నుండి రక్షించి బయటపడేయడాన్ని సూచిస్తుంది. ఈ ప్రార్థనా సందర్భంలో ‘విడిపించు’ సహజంగా సరిపోతుంది.
- source_word: חֶרְפַּת
  choice: నిందకు
  rationale: חֶרְפָּהలో నింద, అపకీర్తి, బహిరంగ అవమానం అనే గౌరవ-అవమాన సంబంధిత భావాలు ఉన్నాయి. ‘నిందకు గురిచేయకు’ అనేది వ్యక్తి మరొకరి ఎగతాళి లేదా దూషణకు లక్ష్యమవడాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נָבָל
  choice: మూర్ఖుని
  rationale: కీర్తనలలో נָבָל కేవలం తెలివిలేని వ్యక్తినే కాక, నైతిక వివేకం లేని వ్యక్తిని కూడా సూచించగలదు. ప్రధాన పాఠ్యంలో అదనపు వ్యాఖ్యానం చేర్చకుండా ‘మూర్ఖుడు’ ఆ సంక్షిప్తతను నిలుపుతుంది.
- source_word: אַל תְּשִׂימֵנִי
  choice: నన్ను గురిచేయకు
  rationale: שׂים ఇక్కడ ఒకరిని ఏదో స్థితిలో ఉంచడం లేదా దానికి లక్ష్యంగా చేయడం అనే అర్థం ఇస్తుంది. ‘నిందకు నన్ను గురిచేయకు’ అనేది ఆ కారణార్థక భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: మూర్ఖునికి సంబంధించిన నింద లేదా అవమానంపై ప్రార్థన భావం
  choice: కీర్తనకర్త తనను నైతిక వివేకం లేని వ్యక్తి నిందకు లక్ష్యంగా చేయవద్దని దేవుణ్ణి వేడుకుంటున్నాడు.
  alternative: కీర్తనకర్తను మూర్ఖత్వంతో ముడిపడిన అవమానంగా లేదా మూర్ఖునికి కలిగే అపకీర్తిగా చేయవద్దనే ప్రార్థన.
  rationale: חֶרְפַּת נָבָל అనే నిర్మాణం ‘మూర్ఖుని నింద’ అని—అంటే మూర్ఖుని నుండి వచ్చే లేదా అతనితో సంబంధమున్న నింద అని—అర్థం కావచ్చు. అయితే అది ‘మూర్ఖునికి సంబంధించిన అవమానం’ అనే భావాన్నీ అనుమతిస్తుంది. ప్రధాన పాఠ్యం మొదటి భావాన్ని సహజంగా ఇస్తూ, పాదటిప్పణి నిజమైన భాషాత్మక సందిగ్ధతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ప్రార్థనా గాంభీర్యాన్ని నిలుపుతూ, సాధారణ పాఠకులకు అర్థమయ్యే పదాలు వాడబడ్డాయి. ‘అతిక్రమాలు’ నైతిక-ఆధ్యాత్మిక బలాన్ని కాపాడుతుంది; ‘నిందకు గురిచేయకు’ తెలుగు సహజ ప్రయోగం. మూలంలోని సంక్షిప్త సమాంతర నిర్మాణాన్ని రెండు పాదాలుగా నిలిపాం.
