  yaml_path: translation/ot/psalms/039/012.yaml
  text: Hear my prayer[a], O Yahweh, and give ear to my cry; do not be deaf to my tears. For I am a sojourner with you[b], a resident alien like all my fathers.
translation:
  language: te
  text: 'యెహోవా, నా ప్రార్థన విను;

    నా మొరను ఆలకించు.

    నా కన్నీళ్ల పట్ల మౌనంగా ఉండకు.[a]

    ఎందుకంటే, నేను నీతో ఉన్న పరదేశిని,

    నా పితరులందరిలాగే నివాస పరదేశిని.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా కన్నీళ్లకు చెవిటిగా ఉండకు.” హీబ్రూ క్రియకు “మౌనంగా ఉండు” అనే అర్థం ఉంది; అయితే “విను,” “ఆలకించు” అనే ముందటి మాటల సందర్భంలో వినకుండా ఉండే భావమూ సూచించబడుతుంది.
    reason: lexical_alternative
  - marker: b
    text: “నా పితరులు” అంటే “నా పూర్వీకులు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעָה תְפִלָּתִי
  choice: నా ప్రార్థన విను
  rationale: שׁמע ఆజ్ఞార్థక రూపంలోని ప్రత్యక్ష విన్నపాన్ని, సహజమైన తెలుగు ప్రార్థనా భాషలో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: וְשַׁוְעָתִי הַאֲזִינָה
  choice: నా మొరను ఆలకించు
  rationale: שַׁוְעָה లోని ఆర్తితో కూడిన సహాయ మొర భావాన్ని ‘మొర’ తెలియజేస్తుంది; הַאֲזִינָה ను ‘ఆలకించు’గా అనువదించడం వినికిడి సమాంతరతను కాపాడుతుంది.
- source_word: אֶל דִּמְעָתִי
  choice: నా కన్నీళ్లను చూసి
  rationale: అక్షరార్థంగా ‘నా కన్నీళ్లవైపు’ అయినా, తదుపరి ‘మౌనంగా ఉండకు’తో సహజ తెలుగు సంబంధం ఏర్పడేందుకు ‘చూసి’ చేర్చబడింది; కన్నీళ్ల ప్రతిమ నిలిచింది.
- source_word: אַל תֶּחֱרַשׁ
  choice: మౌనంగా ఉండకు
  rationale: חרשׁ ఇక్కడ ‘మౌనంగా ఉండు’ లేదా ‘చెవిటిగా ఉండు’ అనే భావాలను అనుమతిస్తుంది. తెలుగు ప్రధాన పాఠంలో సాధారణమైన ప్రాథమిక భావాన్ని ఉంచి, శ్రవణ సందర్భానికి సరిపోయే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో చూపుతుంది.
- source_word: גֵר אָנֹכִי עִמָּךְ
  choice: నేను నీతో ఉన్న పరదేశిని
  rationale: גֵר సూచించే స్వదేశీయ హక్కులు లేని పరదేశ నివాసి భావాన్ని ‘పరదేశి’ సహజంగా తెలియజేస్తుంది; עִמָּךְ లోని ‘నీతో’ అనే ఉద్దేశపూర్వక అస్పష్టతను అలాగే ఉంచుతుంది.
- source_word: תּוֹשָׁב
  choice: నివాస పరదేశిని
  rationale: స్థిర స్వదేశీయుడు కానప్పటికీ అక్కడ నివసించే వ్యక్తి అనే సామాజిక-న్యాయ భావాన్ని తెలియజేస్తూ, ముందున్న גֵר నుండి కొంత భేదాన్ని నిలుపుతుంది.
- source_word: כְּכָל אֲבוֹתָי
  choice: నా పితరులందరిలాగే
  rationale: אֲבוֹתָי లోని పురుష పూర్వీకుల పదప్రయోగాన్ని ‘పితరులు’ నేరుగా కాపాడుతుంది; ఆధునిక సాధారణ ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
theological_decisions:
- issue: גֵר మరియు תּוֹשָׁב అనే జత సామాజిక పదాల అనువాదం
  choice: ‘పరదేశి’ మరియు ‘నివాస పరదేశి’గా భేదించడం
  alternative: రెండింటినీ ‘పరదేశి/యాత్రికుడు’ వంటి సమానార్థకాలుగా కలిపివేయడం
  rationale: దేవుని సమక్షంలో భూమిపై పూర్తి స్వాధీన హక్కులేని మనిషి స్థితిని చెప్పే రెండు సంబంధితమైనా వేరైన పదాలను సాధ్యమైనంతవరకు భేదిస్తుంది.
- issue: אַל תֶּחֱרַשׁ లోని శ్రవణ/మౌన ద్వంద్వార్థం
  choice: ప్రధాన పాఠంలో ‘మౌనంగా ఉండకు’
  alternative: ‘చెవిటివాడిలా ఉండకు’ లేదా ‘పట్టించుకోకుండా ఉండకు’
  rationale: హీబ్రూ క్రియ యొక్క ప్రాథమిక మౌన భావాన్ని నిలుపుతూ, ముందున్న ‘విను/ఆలకించు’ సందర్భం సూచించే శ్రవణ భావాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
- issue: עִמָּךְ యొక్క సంబంధ భావం
  choice: ‘నీతో’ అని నేరుగా అనువదించడం
  alternative: ‘నీ సన్నిధిలో’ లేదా ‘నీ దేశంలో’
  rationale: దేవుని సన్నిధి, ఆధిపత్యం, లేదా అతిథ్య సంబంధం వంటి భావాలలో ఒక్కదానిని మాత్రమే నిర్ణయించకుండా మూలంలోని సంక్షిప్తత మరియు ఉద్వేగాన్ని కాపాడుతుంది.
- issue: אֲבוֹתָי యొక్క లింగనిర్దిష్ట పూర్వీకుల భాష
  choice: ‘నా పితరులు’
  alternative: ‘నా పూర్వీకులు’
  rationale: మూలంలోని స్పష్టమైన పురుష బహువచన పూర్వీకుల పదాన్ని ప్రధాన పాఠంలో నిలిపి, సహజమైన సమగ్ర ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనా కవిత్వానికి తగిన గంభీరమైనా సామాన్య పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘ఆలకించు,’ ‘మొర,’ ‘పితరులు’ వంటి పదాలు కవితాత్మక గౌరవాన్ని నిలుపుతాయి; వాక్య నిర్మాణం మాత్రం సరళంగా ఉంది.
