  yaml_path: translation/ot/psalms/039/013.yaml
  text: Look away from me[a], so that I may smile again before I go and am no more.
translation:
  language: te
  text: నా మీదనుంచి నీ దృష్టిని మరల్చు; నేను వెళ్లి ఇక లేకపోకముందు, నేను మళ్లీ తేరుకునేలా చేయి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మళ్లీ బలం పుంజుకునేలా చేయి’ లేదా ‘మళ్లీ ఉల్లాసపడేలా చేయి.’ హీబ్రూ క్రియలో కొత్త కాంతి, ఉపశమనం లేదా కోలుకోవడం అనే భావాలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשַׁע מִמֶּנִּי
  choice: నా మీదనుంచి నీ దృష్టిని మరల్చు
  rationale: ఈ సందర్భంలో దేవుడు తన బాధకలిగించే దృష్టిని కీర్తనకర్త మీదనుంచి తిప్పాలని కోరే ఆజ్ఞార్థక వాక్యం. ‘దృష్టిని మరల్చు’ అనేది సహజమైన, గంభీరమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: וְאַבְלִיגָה
  choice: మళ్లీ తేరుకోనివ్వు
  rationale: בלג అనే క్రియలో మళ్లీ కాంతి పొందడం, ఉపశమనం కలగడం, ధైర్యం లేదా బలం పుంజుకోవడం వంటి భావాలు ఉన్నాయి. ‘తేరుకోనివ్వు’ ఈ విస్తృత భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ఇతర సాధ్యార్థాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: בְּטֶרֶם
  choice: ముందు
  rationale: జరగబోయే మరో కార్యానికి పూర్వకాలాన్ని సూచించే సాధారణ ఆధునిక తెలుగు సమానం.
- source_word: אֵלֵךְ
  choice: నేను వెళ్లిపోయి
  rationale: మూలంలోని ‘వెళ్లు’ అనే నిగూఢ మరణసూచక రూపకాన్ని స్పష్టంగా ‘చనిపోవడం’గా మార్చకుండా నిలుపుతుంది.
- source_word: וְאֵינֶנִּי
  choice: ఇక లేకపోవడానికి
  rationale: ఇక ఉనికిలో లేదా జీవించి ఉండకపోవడాన్ని సూచించే గంభీరమైన నానుడిని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: אֵלֵךְ וְאֵינֶנִּי లోని మరణసూచనను ఎంత స్పష్టంగా చెప్పాలి
  choice: ‘నేను వెళ్లిపోయి ఇక లేకపోవడానికి ముందు’ అని మూలంలోని పరోక్ష రూపాన్ని నిలుపడం
  alternative: ‘నేను చనిపోయి కనుమరుగయ్యే ముందు’
  rationale: సందర్భం మరణాన్ని సూచించినా, హీబ్రూ దానిని నేరుగా చెప్పదు. కాబట్టి కవితాత్మక నిగూఢతను, గంభీరతను కాపాడుతూ మరణాన్ని అనవసరంగా స్పష్టీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తనకు తగిన గంభీరతను నిలిపే శైలి. మూలంలోని సంక్షిప్త విన్నపం, మరణాన్ని పరోక్షంగా సూచించే కవితాత్మక భాష కాపాడబడ్డాయి.
