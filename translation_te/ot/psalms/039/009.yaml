    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఎందుకంటే నీవే చేశావు’; క్రియకు కర్మ చెప్పబడలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱלַמְתִּי
  choice: నేను మౌనమయ్యాను
  rationale: אלם ధాతువు నిఫాల్ రూపం మౌనంగా చేయబడడం లేదా మౌనస్థితికి చేరడం అనే భావాన్ని ఇస్తుంది. ‘మౌనమయ్యాను’ అనేది ఫలితస్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, కర్తను ప్రత్యేకంగా పేర్కొనదు.
- source_word: לֹא אֶפְתַּח פִּי
  choice: నా నోరు తెరవను
  rationale: ‘నోరు తెరవడం’ అనేది మాట్లాడడాన్ని సూచించే హీబ్రూ నుడికారం. ‘తెరవను’ అనే రూపం ప్రస్తుత నిశ్చయాన్ని లేదా కొనసాగుతున్న వైఖరిని సహజంగా వ్యక్తం చేస్తుంది; ‘నోరు’ అనే మూలపద చిత్రాన్ని నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: కీర్తనకర్త మౌనంగా ఉండడానికి కారణాన్ని పరిచయం చేసే స్పష్టమైన కారణార్థక అనుసంధానం.
- source_word: אַתָּה
  choice: నీవే
  rationale: హీబ్రూలో సర్వనామం స్పష్టంగా ఉండి వాక్యంలో ఉద్ఘాటన పొందింది. తెలుగులో ‘నీవే’ ఆ ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: עָשִׂיתָ
  choice: చేశావు
  rationale: עשה అనే విస్తృతార్థక క్రియకు ‘చేయు’ సమీపమైన సమానార్థకం. హీబ్రూలో కర్మ చెప్పబడనట్లే తెలుగులోనూ దానిని పూరించకుండా ఉంచడం వల్ల వాక్యంలోని సంక్షిప్తత, భావ ఉద్వేగం నిలుస్తాయి.
theological_decisions:
- issue: עָשִׂיתָ క్రియలో చెప్పబడని కర్మ మరియు దేవుని కార్యసాధకత్వం
  choice: ఎందుకంటే నీవే చేశావు
  alternative: ఎందుకంటే నీవే దీనిని చేశావు; ఎందుకంటే నీవే కార్యం చేశావు
  rationale: మూల హీబ్రూ కర్మను స్పష్టంగా చెప్పదు. తెలుగులో కూడా కర్మను చెప్పకుండా ఉంచడం సాధ్యమే; దీనివల్ల కీర్తనకర్త తన పరిస్థితికి దేవుని కార్యాన్ని కారణంగా అంగీకరిస్తున్నాడనే భావం నిలుస్తుంది, అయితే దేవుడు ఖచ్చితంగా ఏమి చేశాడో అనువాదం అదనంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కీర్తనా శైలి వాడబడింది. దేవునికి ఏకవచన సంబోధనగా ‘నీవే’ ఉంచి, మూలంలోని ఉద్ఘాటనను నిలిపాం. చెప్పబడని కర్మను ప్రధాన పాఠ్యంలో పూరించకుండా మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను కాపాడాం.
