source:
  edition: WLC
  text: בְּֽ/תוֹכָ֘ח֤וֹת עַל עָוֺ֨ן יִסַּ֬רְתָּ אִ֗ישׁ וַ/תֶּ֣מֶס כָּ/עָ֣שׁ חֲמוּד֑/וֹ אַ֤ךְ הֶ֖בֶל כָּל אָדָ֣ם סֶֽלָה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/011.yaml
  text: With rebukes for iniquity you discipline a man[a], and like a moth you consume what is precious to him; surely every man is vapor[b]. Selah
translation:
  language: te
  text: దోషం కారణంగా గద్దింపులతో నీవు ఒక మనిషిని శిక్షించావు; చిమ్మటవలె అతనికి ప్రియమైనదాన్ని కరిగిపోయేలా చేశావు.[a] నిజంగా, ప్రతి మనిషీ ఆవిరే.[b] సెలా
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు అతనికి ప్రియమైన వాటిని చిమ్మటవలె క్షీణింపజేశావు.” “అతనికి ప్రియమైనది” అనే హీబ్రూ పదాన్ని మరింత నిర్దిష్టంగా “అతని అందం” అనీ, విస్తృతంగా “అతని విలువైన వస్తువులు” అనీ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ఆవిరి” హీబ్రూ హెవెల్ అనే పదానికి అనువాదం. అది ఊపిరిలా త్వరగా మాయమయ్యే క్షణభంగురతను లేదా అస్థిరతను సూచిస్తుంది; సంప్రదాయంగా “వ్యర్థం” అని అనువదించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹכָחוֹת
  choice: గద్దింపులతో
  rationale: బే ఉపసర్గలోని సాధనార్థాన్ని, תוכחה బహువచనంలోని గద్దింపు/దిద్దుబాటు భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: עַל עָוֺן
  choice: దోషం నిమిత్తం
  rationale: עָוֺן పాపదోషం, అపరాధం లేదా దాని బాధ్యతను సూచించగలదు; ఇక్కడ శిక్షకు కారణాన్ని తెలిపే విస్తృత నైతిక పదంగా అనువదించబడింది.
- source_word: יִסַּרְתָּ
  choice: శిక్షిస్తావు
  rationale: יסר లోని క్రమశిక్షణతో సరిదిద్దే శిక్ష భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אִישׁ
  choice: ఒక మనిషిని
  rationale: పుంలింగ ఏకవచన రూపాన్ని నిలుపుతూ, ఇక్కడి ప్రతినిధిక మానవార్థాన్నీ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַתֶּמֶס
  choice: కరిగించివేస్తావు
  rationale: מסס యొక్క కరిగిపోవడం, క్షీణించిపోవడం అనే చిత్రాన్ని చిమ్మట ఉపమానంతో అనుసంధానిస్తుంది.
- source_word: כָּעָשׁ
  choice: చిమ్మటలాగా
  rationale: వస్త్రాన్ని క్రమంగా నశింపజేసే చిమ్మట అనే స్పష్టమైన ఉపమానాన్ని నిలుపుతుంది.
- source_word: חֲמוּדוֹ
  choice: అతనికి ప్రియమైనదాన్ని
  rationale: חמד మూలంలోని కోరదగినది/విలువైనది అనే విస్తృత భావాన్ని నిలుపుతుంది; దాన్ని కేవలం అందం లేదా ఆస్తిగా పరిమితం చేయదు.
- source_word: אַךְ
  choice: నిజంగా
  rationale: వాక్యాంతంలోని గంభీరమైన నిశ్చయోక్తిని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הֶבֶל
  choice: ఆవిరి
  rationale: క్షణభంగురత, అస్థిరత్వం, సారహీనతను సూచించే శ్వాసలాంటి దృశ్యరూపాన్ని నిలుపుతుంది.
- source_word: כָּל אָדָם
  choice: ప్రతి మనిషీ
  rationale: אָדָם యొక్క సమస్త మానవాళిని సూచించే సామాన్యార్థాన్ని ఏకవచన నిర్మాణంతో నిలుపుతుంది.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఖచ్చితమైన అర్థం అనిశ్చితమైన ఆరాధనా/సంగీత పదం కావడంతో అనువదించకుండా లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: శిక్ష యొక్క స్వభావం
  choice: సరిదిద్దే భావం కలిగిన ‘శిక్షిస్తావు’
  alternative: కేవలం ‘దిద్దుతావు’ లేదా తీవ్రమైన ‘దండిస్తావు’
  rationale: יִסַּרְתָּ లో శిక్ష మరియు దిద్దుబాటు రెండూ ఉన్నాయి; ఏ ఒక్క వైపుకూ అతిగా మొగ్గకుండా సాధారణ పదాన్ని ఎంచుకున్నాం.
- issue: ప్రతినిధిక మానవ సూచన
  choice: ‘ఒక మనిషిని’, ‘ప్రతి మనిషీ’
  alternative: ‘ఒక వ్యక్తిని’, ‘ప్రతి మానవుడూ’
  rationale: אִישׁ, אָדָם పదాల ఏకవచన మానవ సూచనను నిలుపుతూ, సందర్భంలోని సార్వత్రిక వర్తింపును అడ్డుకోకుండా అనువదించబడింది.
- issue: మానవుని క్షణభంగురతకు రూపకం
  choice: ‘ఆవిరే’
  alternative: ‘వ్యర్థమే’ లేదా ‘ఊపిరే’
  rationale: הֶבֶל లోని స్పృశ్యమైన, త్వరగా చెదిరిపోయే రూపకాన్ని నిలుపుతూ దాని భావాన్ని కేవలం నైతిక వ్యర్థతగా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనా సందర్భానికి తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. హీబ్రూ కవిత్వంలోని చిమ్మట, ఆవిరి రూపకాలు మరియు ‘సెలా’ యొక్క అనిశ్చితి నిలుపబడ్డాయి.
