translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి వాడబడింది. ‘హృదయం,’ ‘అగ్ని,’ ‘నాలుక’ అనే మూల శరీర మరియు అగ్ని రూపకాలు నిలుపబడ్డాయి; అర్థాన్ని అతిగా వివరణాత్మకం చేయకుండా వాక్యక్రమంలోని తీవ్రత పెరుగుదల కాపాడబడింది.
