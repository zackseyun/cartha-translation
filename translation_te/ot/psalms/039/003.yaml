source:
  edition: WLC
  text: חַם לִבִּ֨/י בְּ/קִרְבִּ֗/י בַּ/הֲגִיגִ֥/י תִבְעַר אֵ֑שׁ דִּ֝בַּ֗רְתִּי בִּ/לְשֽׁוֹנִ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/003.yaml
  text: 'My heart grew hot within me[a]; as I meditated, the fire burned[b]; then I spoke with my tongue:'
translation:
  language: te
  text: 'నా హృదయం నాలో వేడెక్కింది; నేను తలపోస్తుండగా[a] అగ్ని మండింది[b]. అప్పుడు నా నాలుకతో ఇలా పలికాను:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నేను మననం చేస్తుండగా,’ లేదా ‘నా ధ్యానంలో.’ హీబ్రూ పదం అంతరంగ తలపోతను లేదా ధ్యానాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఒక అగ్ని మండింది,’ లేదా ‘అగ్ని రగులుకుంది.’ హీబ్రూ చిత్రణ అంతరంగ వేడి నుండి మండే అగ్ని వరకు తీవ్రత పెరగడాన్ని చూపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַם
  choice: వేడెక్కింది
  rationale: సందర్భంలో ఇది అంతరంగ స్థితి తీవ్రత పెరగడాన్ని సూచిస్తుంది. తరువాత వచ్చే స్పష్టమైన అగ్ని చిత్రణతో కలిపివేయకుండా, వేడి మొదలై పెరిగిన భావాన్ని ఈ పదం సహజంగా తెలియజేస్తుంది.
- source_word: לִבִּי
  choice: నా హృదయం
  rationale: హీబ్రూ భావంలో ఆలోచనలు, భావోద్వేగాలు కలిగే అంతరంగ వ్యక్తిని సూచించే శరీరరూపకాన్ని నిలుపుతుంది.
- source_word: בקרבי
  choice: నాలో
  rationale: అంతరంగంలో జరుగుతున్న అనుభవాన్ని ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: בהגיגי
  choice: నేను తలపోస్తుండగా
  rationale: הֲגִיג అనే పదానికి అంతరంగ మననం, తలపోత, ధ్యానం వంటి భావాలు ఉండవచ్చు. ఇక్కడ ב ఉపసర్గను సందర్భానుసారంగా కాలసూచకంగా అనువదించాం; మూలంలోని భావపరిధిని పూర్తిగా ఒకే విధమైన ఆధ్యాత్మిక ధ్యానానికి పరిమితం చేయలేదు.
- source_word: תבער אש
  choice: అగ్ని మండింది
  rationale: అంతరంగ వేడి అగ్నిగా మండే స్థాయికి చేరిన స్పష్టమైన హీబ్రూ రూపకాన్ని నిలుపుతుంది. తెలుగు వాక్యంలో నిర్దిష్టతను తెలిపే ఉపపదం అవసరం లేదు.
- source_word: דברתי
  choice: అప్పుడు ... పలికాను
  rationale: అంతరంగ తలపోత నుండి బహిరంగ మాటకు జరిగే క్రమాన్ని ‘అప్పుడు’ సహజంగా తెలియజేస్తుంది; ‘పలికాను’ గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: בלשוני
  choice: నా నాలుకతో
  rationale: మాట బయటకు పలికినదనే హీబ్రూ శరీరరూపకాన్ని ‘నోటితో’ అని సాధారణీకరించకుండా యథాతథంగా నిలుపుతుంది.
