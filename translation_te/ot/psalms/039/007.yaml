source:
  edition: WLC
  text: וְ/עַתָּ֣ה מַה קִּוִּ֣יתִי אֲדֹנָ֑/י תּ֝וֹחַלְתִּ֗/י לְ/ךָ֣ הִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/007.yaml
  text: And now[a], Lord, what do I wait for? My hope is in you.
translation:
  language: te
  text: మరి ఇప్పుడు[a], ప్రభువా, నేను దేనికోసం ఎదురుచూస్తున్నాను? నా నిరీక్షణ నీలోనే ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, పదక్షరార్థానికి దగ్గరగా: “మరి ఇప్పుడు, ప్రభువా, నేను దేనికోసం నిరీక్షించాను? నా నిరీక్షణ నీలోనే ఉంది.” హీబ్రూ క్రియ קוהకు ఎదురుచూడడం, ఆశించడం అనే రెండు భావాలూ ఉండవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: וְ అనే అనుసంధానంతో కూడిన עַתָּה కీర్తనకర్త ప్రస్తుత నిర్ధారణవైపు తిరుగుతున్నట్టు సూచిస్తుంది. తెలుగులో ‘ఇప్పుడు’ సహజంగా ఈ కాలసూచక మలుపును వ్యక్తం చేస్తుంది; [a]లో మరింత రూపసన్నిహితమైన ప్రత్యామ్నాయం ఇవ్వబడింది.
- source_word: מַה
  choice: దేనికోసం
  rationale: ఈ అలంకారప్రశ్నలో מַה అనేది ఎదురుచూపు దేనివైపు ఉందో అడుగుతుంది. ‘దేనికోసం’ అనేది తెలుగులో సహజమైన ప్రశ్నారూపం.
- source_word: קִוִּיתִי
  choice: ఎదురుచూస్తున్నాను
  rationale: קוה అనే క్రియలో ఎదురుచూడడం, ఆశించడం అనే భావాలు రెండూ ఉన్నాయి. తరువాతి ‘నా నిరీక్షణ’తో భావసంబంధాన్ని ఉంచుతూ, ప్రశ్నలో ఎదురుచూపు భావాన్ని ప్రధాన పాఠ్యంలో వ్యక్తం చేశాం; కాలరూపం మరియు భావవికల్పాన్ని [a]లో గుర్తించాం.
- source_word: אֲדֹנָי
  choice: ప్రభువా
  rationale: దేవునిని నేరుగా సంబోధించే గౌరవపూర్వక దైవబిరుదు. ఆధునిక ప్రామాణిక తెలుగులో ‘ప్రభువా’ సహజమైన సంబోధన.
- source_word: תּוֹחַלְתִּי
  choice: నా నిరీక్షణ
  rationale: ఈ నామవాచకం ఆశ, నిరీక్షణ, ఎదురుచూపు అనే భావక్షేత్రాన్ని కలిగి ఉంది. దేవునిమీద ఆధారపడిన ఆశను ‘నా నిరీక్షణ’ గౌరవప్రదంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לְךָ
  choice: నీలోనే
  rationale: לְךָ ఆశ యొక్క దిశను లేదా లక్ష్యాన్ని దేవునివైపు నిర్దేశిస్తుంది. తెలుగులో ‘నీలో’ ఆధారభావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘నే’ అవధారణ హీబ్రూ వాక్యంలోని ముందుంచిన పదబంధం, పునరుద్ఘాటక సర్వనామం ఇచ్చే దృష్టిని ప్రతిబింబిస్తుంది.
- source_word: הִיא
  choice: ఉంది
  rationale: స్త్రీలింగ నామవాచకమైన תּוֹחַלְתִּיని పునరుద్ఘాటించే స్వతంత్ర సర్వనామం. తెలుగులో దానిని ప్రత్యేక సర్వనామంగా కాక, సహజమైన అస్తిత్వ క్రియతో మరియు ‘నే’ అవధారణతో వ్యక్తం చేశాం.
theological_decisions:
- issue: אֲדֹנָי అనే దైవబిరుదు అనువాదం
  choice: ప్రభువా
  alternative: నా ప్రభువా
  rationale: ఇది దేవునికి వాడే ప్రామాణిక గౌరవబిరుదు. రూపచరిత్రలో మొదటి పురుష ఏకవచన సంబంధం ఉన్నప్పటికీ, ఇక్కడ స్థిరమైన దైవబిరుదుగా పనిచేస్తుంది; అందువల్ల ‘నా’ను చేర్చి అర్థాన్ని అతిగా నిర్దిష్టం చేయలేదు.
- issue: కీర్తనకర్త ఎదురుచూపు మరియు ఆశ మధ్య సంబంధం
  choice: ప్రశ్నలో ‘ఎదురుచూస్తున్నాను’, ప్రకటనలో ‘నిరీక్షణ’
  alternative: ప్రశ్నలో ‘ఆశపెట్టుకున్నాను’, ప్రకటనలో ‘నిరీక్షణ’
  rationale: קוה లోని ఎదురుచూపు–ఆశ ద్వంద్వార్థాన్ని పూర్తిగా ఒకే భావానికి పరిమితం చేయకుండా, రెండు తెలుగు పదాల ద్వారా కాపాడాం. మూలంలోని కాలరూపానికి మరింత సన్నిహితమైన పఠనాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కీర్తనా శైలి. నేర సంబోధనకు ‘ప్రభువా’, ఆశాభావానికి సాధారణంగా అర్థమయ్యే ‘నిరీక్షణ’ వాడాం. మూలంలోని భావసందిగ్ధతను పాదటిప్పణితో నిలిపాం.
