  yaml_path: translation/ot/psalms/039/000.yaml
  text: For the choir director; according to Jeduthun[a]. A psalm of David[b].
translation:
  language: te
  text: సంగీత నాయకునికి; యెదూతూను ప్రకారం[a]. దావీదు కీర్తన[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెదూతూను కోసం’ లేదా ‘యెదూతూనుకు.’ కీర్తనల శీర్షికల్లోని హీబ్రూ ఉపసర్గ వివిధ రకాల అనుబంధాన్ని సూచించగలదు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘దావీదు రచించిన కీర్తన.’ హీబ్రూ శీర్షిక అక్షరార్థంగా ‘దావీదుకు చెందిన కీర్తన’ అని ఉంటుంది; అది రచనను లేదా అనుబంధాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకునికి
  rationale: కీర్తనల శీర్షికల్లో ఈ పదం సంగీత ప్రదర్శనను పర్యవేక్షించే వ్యక్తిని సూచిస్తుంది. ‘సంగీత నాయకుడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, గాయకబృందానికి మాత్రమే అర్థాన్ని పరిమితం చేయదు.
- source_word: לִידוּתוּן
  choice: యెదూతూను ప్రకారం
  rationale: ל ఉపసర్గ అనుబంధాన్ని, ఉద్దేశాన్ని లేదా దిశను సూచించవచ్చు. ఇక్కడ ‘ప్రకారం’ అనేది యెదూతూనుతో సంబంధమున్న సంగీత పద్ధతి, సంప్రదాయం లేదా బృంద అనుబంధాన్ని సూచించే అవకాశం ఉంది; ఆ అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: మిజ్మోర్‌కు కీర్తనల గ్రంథంలో వాడే స్థిరమైన, సహజమైన తెలుగు ప్రక్రియా-పదం; ఇది సంగీత రచనను సూచిస్తుంది.
- source_word: לְדָוִד
  choice: దావీదు కీర్తన
  rationale: తెలుగులో ఈ నిర్మాణం ‘దావీదుకు సంబంధించిన కీర్తన’ అనే సహజ అర్థాన్ని ఇస్తూ, రచయిత దావీదే అని తప్పనిసరిగా నిర్ణయించదు. రచన, అంకితం లేదా అనుబంధం అనే అవకాశాలను పాదసూచిక స్పష్టం చేస్తుంది.
