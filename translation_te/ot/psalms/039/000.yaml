translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన కీర్తన శీర్షిక శైలిని ఉపయోగించాం. ‘గాన నాయకుడు’ కంటే ‘సంగీత నాయకుడు’ మూలపదంలోని విస్తృత సంగీత పర్యవేక్షణ భావాన్ని మెరుగ్గా కాపాడుతుంది. యెదూతూను, దావీదు ముందు ఉన్న ל ఉపసర్గల అస్పష్టతను ప్రధాన పాఠ్యంలో సహజంగా ఉంచి, పాదసూచికల్లో ప్రత్యామ్నాయాలను ఇచ్చాం.
