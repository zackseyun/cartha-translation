source:
  edition: WLC
  text: הִנֵּ֤ה טְפָח֨וֹת נָ֘תַ֤תָּה יָמַ֗/י וְ/חֶלְדִּ֣/י כְ/אַ֣יִן נֶגְדֶּ֑/ךָ אַ֥ךְ כָּֽל הֶ֥בֶל כָּל אָ֝דָ֗ם נִצָּ֥ב סֶֽלָה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/005.yaml
  text: Behold[a], you have made my days a few handbreadths, and my lifetime is as nothing before you; surely every man, though standing firm, is altogether vapor[c][b]. Selah
translation:
  language: te
  text: ఇదిగో, నీవు నా రోజులను కొన్ని చేతివెడల్పుల మేరకు చేశావు; నీ ఎదుట నా జీవితకాలం ఏమాత్రమూ కాదు. నిశ్చయంగా, ప్రతి మనిషి, నిలిచి ఉన్నా, కేవలం ఆవిరే[a][b]. సెలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నిలిచి ఉన్నా” అనే మాటను “నిలిచి ఉన్న” లేదా “స్థాపించబడిన” అని కూడా అనువదించవచ్చు; భద్రంగా కనిపించే మనిషి కూడా క్షణభంగురుడే అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ఆవిరి” అనే హెబ్రీ పదానికి “ఊపిరి” లేదా “వ్యర్థత” అనే భావాలు కూడా ఉన్నాయి; అది పట్టుకోలేనిదాన్ని, క్షణభంగురమైనదాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రద్ధను బలంగా ఆకర్షించే కావ్యోచిత సూచనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: טְפָחוֹת
  choice: కొన్ని జానలంతగా
  rationale: చేతి వెడల్పుతో కొలిచే అతి చిన్న ప్రమాణమైన ‘జాన’ అనే స్పష్టమైన దృశ్యరూపాన్ని, బహువచనాన్ని నిలుపుతుంది.
- source_word: נָתַתָּה
  choice: చేశావు
  rationale: దేవుడు కీర్తనకర్త రోజుల పరిమాణాన్ని అలా నియమించాడనే సందర్భార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יָמַי
  choice: నా రోజుల్ని
  rationale: జీవితకాలాన్ని సూచించే హెబ్రీయుల నుడికారాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: וְחֶלְדִּי
  choice: నా జీవితకాలం
  rationale: లోకంలో ఒకరి జీవనవ్యవధిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: כְאַיִן
  choice: ఏమాత్రమూ కాదు
  rationale: దేవుని ఎదుట మానవ జీవితపు అత్యల్పతను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נֶגְדֶּךָ
  choice: నీ ఎదుట
  rationale: దేవుని సన్నిధిలోను ఆయనతో పోల్చినప్పుడును అనే సంబంధార్థాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: אַךְ
  choice: నిశ్చయంగా
  rationale: కీర్తనకర్త చెప్పే సాధారణ నిర్ధారణలోని ఉద్ఘాటనను అందిస్తుంది.
- source_word: כָּל הֶבֶל
  choice: పూర్తిగా ఆవిరే
  rationale: כָּל యొక్క సంపూర్ణతను, הֶבֶל సూచించే క్షణభంగురమైన మరియు సారంలేని ఆవిరి దృశ్యాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: כָּל אָדָם
  choice: ప్రతి మనిషి
  rationale: ఏ ఒక్క లింగానికీ పరిమితం కాని సాధారణ మానవార్థాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: נִצָּב
  choice: స్థిరంగా నిలిచిన
  rationale: ‘నిలిచిన/నిలబెట్టబడిన’ అనే మూలభావంతో పాటు భద్రంగా లేదా స్థిరంగా కనిపించే వ్యక్తిని సూచించే సందర్భసూక్ష్మతను నిలుపుతుంది.
- source_word: סֶלָה
  choice: సెలా
  rationale: దీని ఖచ్చితమైన కార్యార్థం అనిశ్చితమైనందున సంప్రదాయ లిప్యంతరీకరణను నిలుపుతుంది.
theological_decisions:
- issue: אָדָם అనే ఏకవచన సాధారణ పదం మానవాళిని సూచించడం
  choice: ప్రతి మనిషి
  alternative: మనుష్యులందరూ
  rationale: మూలంలోని ‘ప్రతి’ అనే ఏకవచన నిర్మాణాన్ని నిలుపుతూ, వాక్యం సమస్త మానవులకు వర్తిస్తుందని సహజమైన తెలుగులో తెలియజేస్తుంది.
- issue: נִצָּב యొక్క భావం
  choice: స్థిరంగా నిలిచిన
  alternative: నిలిచిన / స్థాపించబడిన
  rationale: మనిషి స్థిరంగా కనిపించినా అతడు క్షణభంగురుడే అనే కావ్య ఉద్వేగాన్ని నిలుపుతుంది; అయితే ఈ క్రియారూపంలోని సాధ్యమైన అర్థాలను పాదటిప్పణిలో ఉంచుతుంది.
- issue: הֶבֶל యొక్క రూపకార్థం
  choice: ఆవిరి
  alternative: ఊపిరి / వ్యర్థత
  rationale: క్షణంలో కనుమరుగయ్యే, పట్టుకోలేని పదార్థం అనే మూల దృశ్యాన్ని నిలుపుతూ, ‘వ్యర్థత’ అనే ఒక్క వ్యాఖ్యానానికి అర్థాన్ని పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలిని వాడాం. ‘జాన’ అనే సుపరిచిత శరీరాధారిత కొలత మూలంలోని స్పష్టమైన దృశ్యాన్ని నిలుపుతుంది. ‘సెలా’ను అర్థం అనిశ్చితంగా ఉన్నందున అనువదించకుండా లిప్యంతరీకరించాం.
