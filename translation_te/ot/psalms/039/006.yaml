source:
  edition: WLC
  text: אַךְ בְּ/צֶ֤לֶם יִֽתְהַלֶּךְ אִ֗ישׁ אַךְ הֶ֥בֶל יֶהֱמָי֑וּ/ן יִ֝צְבֹּ֗ר וְֽ/לֹא יֵדַ֥ע מִי אֹסְפָֽ/ם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/006.yaml
  text: Surely a man walks about as a shadow[a]; surely they are in turmoil in vain[c][b]. He heaps up wealth and does not know who will gather it.
translation:
  language: te
  text: 'నిజంగా, మనిషి నీడలా[a] తిరుగుతాడు;

    నిజంగా, మనుషులు వ్యర్థంగానే అల్లాడుతారు[b].

    అతడు సంపదను పోగుచేస్తాడు;

    దానిని ఎవరు సేకరిస్తారో అతనికి తెలియదు[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రతిరూపంలా,’ ‘కేవలం రూపమాత్రంగా,’ ‘మాయారూపంలా.’ హీబ్రూ పదానికి అక్షరార్థం ‘రూపం’ లేదా ‘ప్రతిరూపం’; ఇక్కడ అది స్థిరసారం లేని మానవ ఉనికిని సూచిస్తోంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘వారు అల్లాడుతారు’ అని బహువచన క్రియ ఉంది. ముందు ‘మనిషి’ అని ఏకవచనంలో చెప్పిన తరువాత, ఈ బహువచనం సాధారణంగా మనుషులందరినీ సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: grammatical_ambiguity
  - marker: c
    text: హీబ్రూలో ‘వాటిని ఎవరు సేకరిస్తారో’ అని ఉంది; ‘వాటిని’ అనేది అతడు పోగుచేసిన ఆస్తులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: నిజంగా
  rationale: ఈ పదం రెండుసార్లు వచ్చి కీర్తనకర్త చెప్పే విషయాన్ని నొక్కి చెబుతోంది. ‘నిజంగా’ అనే పునరుక్తి ఆ కవితా బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בְּצֶלֶם
  choice: నీడలా
  rationale: צֶלֶם యొక్క ప్రాథమిక అర్థం ‘రూపం/ప్రతిరూపం.’ ఇక్కడ అది మానవ జీవితం స్థిరసారంలేని ఛాయవంటిదనే భావాన్ని ఇస్తుంది; ‘నీడలా’ ఆ రూపకాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది, అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణి భద్రపరుస్తుంది.
- source_word: יִתְהַלֶּךְ אִישׁ
  choice: మనిషి ... తిరుగుతాడు
  rationale: הלך యొక్క హిత్పయేల్ రూపం అటూ ఇటూ సంచరించడం లేదా జీవనంలో నడుచుకోవడం అనే భావాన్ని ఇస్తుంది. אִישׁ ఏకవచన పురుషరూపాన్ని ‘మనిషి’గా ఉంచి, దాని సాధారణ మానవ సూచనను సహజంగా వ్యక్తం చేశాం.
- source_word: הֶבֶל
  choice: వ్యర్థంగానే
  rationale: הֶבֶלకు ‘ఊపిరి,’ ‘శూన్యత,’ ‘వ్యర్థత’ అనే భావాలు ఉన్నాయి. ఇక్కడ అది కలవరపడే కార్యం నిష్ఫలమని క్రియావిశేషణంగా తెలియజేస్తోంది.
- source_word: יֶהֱמָיוּן
  choice: మనుషులు ... అల్లాడుతారు
  rationale: המה శబ్దం, కలవరం, ఆందోళనతో కూడిన చలనం సూచిస్తుంది. హీబ్రూలో క్రియ బహువచనంలో ఉన్నందున ‘మనుషులు’ అని స్పష్టం చేసి బహువచనాన్ని నిలిపాం; ‘అల్లాడుతారు’ కలవరంతో కూడిన వ్యర్థ శ్రమను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִצְבֹּר
  choice: సంపదను పోగుచేస్తాడు
  rationale: צבר అంటే కుప్పగా కూడబెట్టడం లేదా పోగుచేయడం. హీబ్రూలో కర్మ ప్రత్యక్షంగా లేకపోయినా, తరువాతి బహువచన సర్వనామం కూడబెట్టిన ఆస్తులను సూచిస్తున్నందున ‘సంపదను’ సందర్భానుసారంగా చేర్చాం.
- source_word: וְלֹא יֵדַע
  choice: అతనికి తెలియదు
  rationale: నిరాకరణతో ఉన్న ידעను నేరుగా, సహజమైన తెలుగులో వ్యక్తం చేశాం. ముందు వాక్యంతో ఉన్న సమన్వయాన్ని అర్ధవిరామం ద్వారా నిలిపాం.
- source_word: מִי אֹסְפָם
  choice: దాన్ని ఎవరు సమకూర్చుకుంటారో
  rationale: హీబ్రూ ప్రత్యయం వ్యాకరణపరంగా బహువచనం—‘వాటిని.’ తెలుగులో ‘సంపద’ సమష్టి ఏకవచనంగా సహజంగా ఉండటంతో ‘దాన్ని’ వాడి, మూలంలోని బహువచనాన్ని పాదటిప్పణిలో తెలిపాం.
theological_decisions:
- issue: אִישׁలోని ప్రాతినిధ్య పురుష ఏకవచనం
  choice: మనిషి
  alternative: ఒక వ్యక్తి
  rationale: మూలంలోని పురుష ఏకవచన రూపాన్ని చెరపకుండా ‘మనిషి’గా అనువదించాం. తదుపరి బహువచన క్రియ మానవులను సాధారణంగా సూచిస్తుందని వేరుగా స్పష్టం చేశాం; ఏ ప్రత్యేక సిద్ధాంతార్థాన్నీ చేర్చలేదు.
- issue: ఏకవచన కర్త తరువాత బహువచన క్రియ
  choice: మనుషులు ... అల్లాడుతారు
  alternative: అతడు ... అల్లాడుతాడు
  rationale: יֶהֱמָיוּן స్పష్టంగా మూడవ పురుష బహువచనం. దాన్ని ఏకవచనంగా సరిచేయకుండా, మానవజాతిని సాధారణంగా సూచించే సంఖ్యామార్పును తెలుగులో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైన కవితా ధోరణిని ఉంచుతూ సాధారణ పాఠకునికి అర్థమయ్యే పదాలను ఎంచుకున్నాం. אַךְ పునరుక్తిని ‘నిజంగా’ అని రెండుసార్లు నిలిపాం. మూలంలోని ఏకవచనం–బహువచనం మధ్య ఉద్రిక్తతను తొలగించకుండా ప్రధాన పాఠం మరియు పాదటిప్పణిలో చూపించాం.
