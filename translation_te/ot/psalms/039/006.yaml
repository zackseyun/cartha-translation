  rationale: Only the final gathering clause is revised. It now more directly reflects the Hebrew ‘who gathers them,’ while retaining the natural Telugu collective singular ‘సంపద/దానిని’ and explicitly documenting the Hebrew plural suffix in the footnote. No doctrinal or interpretive change is made.
