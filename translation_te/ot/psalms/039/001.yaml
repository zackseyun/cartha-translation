id: PSA.39.1
reference: Psalms 39:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָמַ֗רְתִּי אֶֽשְׁמְרָ֣ה דְרָכַ/י֮ מֵ/חֲט֪וֹא בִ/לְשׁ֫וֹנִ֥/י אֶשְׁמְרָ֥ה לְ/פִ֥/י מַחְס֑וֹם בְּ/עֹ֖ד רָשָׁ֣ע לְ/נֶגְדִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/001.yaml
  text: I said[a], “I will guard my ways from sinning with my tongue; I will keep a muzzle for my mouth while the wicked is before me.”
translation:
  language: te
  text: 'నేను ఇలా అన్నాను: “నా నాలుకతో పాపం చేయకుండా నా నడవడిని కాపాడుకుంటాను; దుర్మార్గుడు[a] నా ఎదుట ఉన్నంతకాలం నా నోటికి మూతికట్టు వేసుకుంటాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఒక దుర్మార్గుడు.” హెబ్రీ పదం పుంలింగ ఏకవచనంలో ఉంది.
    reason: మూలంలోని పుంలింగ ఏకవచన రూపాన్ని, నిర్దిష్టతలోని స్వల్ప అస్పష్టతను తెలియజేయడానికి.
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: నేను ఇలా అనుకున్నాను
  rationale: אמר అనే క్రియ యొక్క Qal perfect ప్రథమ పురుష ఏకవచనం. ఇది కీర్తనకర్త తనలో తాను చేసుకున్న పూర్వ నిర్ణయాన్ని పరిచయం చేస్తోంది; ‘అనుకున్నాను’ తెలుగు సందర్భంలో సహజంగా ఉండి, ‘నిర్ణయించుకున్నాను’ అనే అధిక వ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: אֶשְׁמְרָה דְרָכַי
  choice: నా నడవడిని జాగ్రత్తగా కాపాడుకుంటాను
  rationale: שׁמר జాగ్రత్తగా కాపాడడం లేదా చూసుకోవడం అనే భావాన్ని, דְרָכַי జీవన మార్గాలు లేదా ప్రవర్తన అనే భావాన్ని ఇస్తాయి. తెలుగులో ‘నడవడి’ ఈ రూపక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מֵחֲטוֹא בִלְשׁוֹנִי
  choice: నా నాలుకతో పాపం చేయకుండా
  rationale: מן + חטא infinitive నివారణ భావాన్ని వ్యక్తం చేస్తుంది; ב instrumental ప్రయోగం. ‘నాలుకతో’ అనే రూపం మాటల ద్వారా పాపం చేయడాన్ని మూలపాఠానికి దగ్గరగా ఉంచుతుంది.
- source_word: אֶשְׁמְרָה לְפִי מַחְסוֹם
  choice: నా నోటికి మూతికట్టు వేసుకుంటాను
  rationale: מַחְסוֹם జంతువు నోటిని అదుపు చేసే muzzle‌ను సూచిస్తుంది. ‘మూతికట్టు’ ఆ స్పష్టమైన నియంత్రణ రూపకాన్ని ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בְּעוֹד
  choice: ఉన్నంతకాలం
  rationale: సమకాలీనత లేదా వ్యవధిని సూచించే ఈ పదబంధానికి, సందర్భంలో ‘ఉన్నంతకాలం’ సహజమైన తెలుగు రూపం.
- source_word: רָשָׁע
  choice: దుర్మార్గుడు
  rationale: పుంలింగ ఏకవచన విశేషణం నామవాచకంగా వాడబడింది. ‘దుర్మార్గుడు’ సంఖ్యను, వ్యాకరణ లింగాన్ని, నైతిక భావాన్ని నిలుపుతుంది.
- source_word: לְנֶגְדִּי
  choice: నా ఎదుట
  rationale: ఈ పదబంధం ‘నా ముందు/నా సమక్షంలో’ అని అర్థం. ‘నా ఎదుట’ సంక్షిప్తంగా, సహజంగా ఉంది.
theological_decisions:
- issue: רָשָׁע యొక్క లింగం మరియు నిర్దిష్టత
  choice: దుర్మార్గుడు
  alternative: ఒక దుర్మార్గుడు; దుష్టుడు
  rationale: హెబ్రీ రూపం పుంలింగ ఏకవచనంలో ఉన్నప్పటికీ దానికి నిర్దిష్ట ఉపపదం లేదు. తెలుగు ‘దుర్మార్గుడు’ మూలంలోని పుంలింగ ఏకవచనాన్ని నిలుపుతూ, అది నిర్దిష్ట వ్యక్తినా లేక ప్రతినిధి వ్యక్తినా అనే అంశాన్ని బలవంతంగా తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘నాలుక,’ ‘మూతికట్టు’ వంటి మూలపాఠంలోని స్పష్టమైన శరీరాత్మక రూపకాలు నిలుపబడ్డాయి; ‘మార్గాలు’ అనే అసహజ పదానువాదం బదులు సందర్భానుకూలమైన ‘నడవడి’ ఎంచుకోబడింది.
