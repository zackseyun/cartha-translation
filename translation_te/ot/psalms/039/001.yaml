  to: 'నేను ఇలా అన్నాను: “నా నాలుకతో పాపం చేయకుండా నా నడవడిని కాపాడుకుంటాను; దుర్మార్గుడు[a] నా ఎదుట ఉన్నంతకాలం నా నోటికి మూతికట్టు వేసుకుంటాను.”'
  rationale: 'Only the opening verb has been revised: “అనుకున్నాను” has been replaced by “అన్నాను” to represent the direct sense of אָמַרְתִּי. The remaining wording is retained because it is faithful, idiomatic modern Telugu and preserves the Hebrew imagery and ambiguity.'
