  variant: modern standard Telugu
source:
  edition: WLC
  text: הוֹדִ֘יעֵ֤/נִי יְהוָ֨ה קִצִּ֗/י וּ/מִדַּ֣ת יָמַ֣/י מַה הִ֑יא אֵ֝דְעָ֗ה מֶה חָדֵ֥ל אָֽנִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/004.yaml
  text: O Yahweh[a], make me know my end and what is the measure of my days; let me know how fleeting I am.
translation:
  language: te
  text: 'యాహ్వే, నా అంతం ఏమిటో నాకు తెలియజేయి;

    నా రోజుల కొలత ఏమిటో తెలియజేయి;

    నేను ఎంత క్షణభంగురుడినో తెలుసుకునేలా చేయి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను ఎంత బలహీనుడినో” లేక “ఎంత నశ్వరుడినో.” హీబ్రూ ప్రయోగం సంక్షిప్తంగా ఉంది; అది మానవ బలహీనతను గానీ జీవితపు స్వల్పత్వాన్ని గానీ నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִיעֵנִי
  choice: నాకు తెలియజేయి
  rationale: ידע హిఫిల్ ఆజ్ఞారూపంలోని కారణార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: קִצִּי
  choice: నా అంతం
  rationale: קֵץ సూచించే ముగింపు లేదా జీవితపు చివరి హద్దును సందర్భానికి తగినట్లు నేరుగా నిలుపుతుంది.
- source_word: וּמִדַּת יָמַי מַה הִיא
  choice: నా రోజుల కొలత ఎంతో
  rationale: מִדָּה లోని ‘కొలత’ రూపకాన్ని నిలుపుతూ, మַה הִיא అడిగే పరిమాణాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: אֵדְעָה
  choice: తెలుసుకునేలా చేయి
  rationale: ముందున్న అభ్యర్థనల ఫలితం లేదా ఉద్దేశాన్ని సూచించే cohortative భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֶה חָדֵל אֲנִי
  choice: నేను ఎంత క్షణభంగురుడినో
  rationale: సంక్షిప్తమైన, అర్థసందిగ్ధమైన హీబ్రూ ప్రయోగాన్ని ఈ కీర్తనలోని జీవిత స్వల్పత్వ సందర్భానికి అనుగుణంగా అందిస్తుంది; బలహీనత లేదా నశ్వరత భావాలు కూడా సాధ్యమని పాదటిప్పణిలో నిలుపబడింది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించబడింది; ఆధునిక తెలుగు బైబిలు పాఠకులకు పరిచితమైన ‘యెహోవా’ రూపం ఎంచుకోబడింది.
- issue: מֶה חָדֵל אֲנִי యొక్క భావం
  choice: నేను ఎంత క్షణభంగురుడినో
  alternative: నేను ఎంత బలహీనుడినో / ఎంత నశ్వరుడినో
  rationale: సందర్భం మానవ జీవితపు స్వల్పత్వాన్ని ప్రధానంగా సూచించినప్పటికీ, హీబ్రూ పదంలోని బలహీనత-నశ్వరత అర్థవిస్తృతిని పాదటిప్పణిలో భద్రపరచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనాత్మక గాంభీర్యాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ‘రోజుల కొలత’ అనే మూల రూపకం ఉద్దేశపూర్వకంగా నిలుపబడింది.
