id: PSA.39.10
reference: Psalms 39:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הָסֵ֣ר מֵ/עָלַ֣/י נִגְעֶ֑/ךָ מִ/תִּגְרַ֥ת יָ֝דְ/ךָ֗ אֲנִ֣י כָלִֽיתִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/010.yaml
  text: Remove your plague from me[d][c][b][a]; by the blow of your hand I am consumed.
translation:
  language: te
  text: 'నీ దెబ్బను[a] నా మీదనుండి[d] తొలగించు;

    నీ చేతి దాడివల్ల[b] నేను క్షీణించిపోయాను[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ తెగులును’ లేదా ‘నీవు కలిగించిన బాధను’.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నీ చేతి ప్రతిఘటనవల్ల’ లేదా ‘నీ చేతి ప్రహారంవల్ల’.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘నేను తరిగిపోతున్నాను’ లేదా ‘నేను పూర్తిగా అయిపోయాను’.
    reason: lexical_alternative
  - marker: d
    text: అక్షరార్థంగా, ‘నా మీదనుండి’.
    reason: literal_rendering_note
lexical_decisions:
- source_word: הָסֵר
  choice: తొలగించు
  rationale: హిఫీల్ ఆజ్ఞార్థక రూపంలోని ప్రత్యక్ష విన్నపాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מֵעָלַי
  choice: నా మీదనుండి
  rationale: ‘నుండి’ మరియు ‘నా మీద’ అనే హీబ్రూ స్థలసంబంధ భావం రెండింటినీ సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: נִגְעֶךָ
  choice: నీ దెబ్బను
  rationale: נגע అనే పదానికి దెబ్బ, తెగులు, బాధ అనే అర్థవ్యాప్తి ఉంది. సందర్భంలో దేవుని నుండి వచ్చిన బాధను సూచిస్తూ, అది వ్యాధేనని నిర్దిష్టం చేయకుండా ‘దెబ్బ’ విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: מִתִּגְרַת
  choice: దాడివల్ల
  rationale: תגרה లోని పోరు, ప్రతిఘటన, శత్రుత్వపూర్వక దూకుడు అనే అరుదైన భావాన్ని ‘చేతి’ అనే రూపకంతో కలిపి స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יָדְךָ
  choice: నీ చేతి
  rationale: దేవుని శక్తి లేదా కార్యాన్ని సూచించే మూలంలోని మానవరూపకాన్ని వివరణగా మార్చకుండా నిలుపుతుంది.
- source_word: אֲנִי כָלִיתִי
  choice: నేను క్షీణించిపోయాను
  rationale: ప్రత్యక్ష సర్వనామంలోని ఉద్ఘాటనను నిలుపుతూ, כלה యొక్క అయిపోవడం, ఖర్చైపోవడం, క్షీణించడం అనే సందర్భోచిత భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: נִגְעֶךָ సూచించే బాధ స్వరూపం
  choice: ‘నీ దెబ్బ’ అని అనువదించి, బాధ దేవుని నుండి వచ్చిందనే వాక్య భావాన్ని నిలిపాము; దానిని ప్రత్యేకంగా వ్యాధి లేదా తీర్పుగా నిర్ధారించలేదు.
  alternative: ‘నీ తెగులు’ లేదా ‘నీవు కలిగించిన బాధ’
  rationale: మూలవాక్యం బాధను దేవునితో నేరుగా సంబంధపరుస్తుంది, కానీ దాని ఖచ్చిత స్వరూపాన్ని చెప్పదు. అందువల్ల ఆ వేదాంత ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రార్థనా స్వరం ఉంచబడింది. ‘నా మీదనుండి’ మూలంలోని స్థలసంబంధ చిత్రాన్ని నిలుపుతుంది; ‘దెబ్బ’ మరియు ‘దాడి’ వేర్వేరు హీబ్రూ పదాల భావభేదాన్ని కాపాడుతాయి.
