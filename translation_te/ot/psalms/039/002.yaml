source:
  edition: WLC
  text: נֶאֱלַ֣מְתִּי ד֭וּמִיָּה הֶחֱשֵׁ֣יתִי מִ/טּ֑וֹב וּ/כְאֵבִ֥/י נֶעְכָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/002.yaml
  text: I was mute in silence[a]; I kept silent from good[b], and my pain was stirred up.
translation:
  language: te
  text: నేను మూగనై నిశ్శబ్దంగా ఉన్నాను; మేలు నుండికూడా మౌనంగా ఉన్నాను[a], నా బాధ చెలరేగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మంచి మాటలు కూడా పలకకుండా మౌనంగా ఉన్నాను’; ఇంకొక సాధ్యమైన అర్థం ‘మేలైనదానికి దూరంగా ఉన్నాను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱלַמְתִּי
  choice: మూగవాడినయ్యాను
  rationale: నిఫల్ రూపం మాట రాకపోవడం లేదా మాట్లాడకుండా ఉండడం అనే భావాన్ని ఇస్తుంది. ఈ అనువాదం ఆ స్థితిని తెలియజేస్తూ, అది స్వచ్ఛందమా లేక బలవంతమా అన్నది నిర్ణయించదు.
- source_word: דּוּמִיָּה
  choice: నిశ్శబ్దంగా
  rationale: ఈ నామవాచకం నిశ్శబ్దం లేదా నిశ్చలతను సూచిస్తుంది. తెలుగులో క్రియావిశేషణ రూపం సహజంగా ఉండి, ముందున్న క్రియను బలపరుస్తుంది.
- source_word: הֶחֱשֵׁיתִי
  choice: మౌనం వహించాను
  rationale: హిఫిల్ రూపం మౌనంగా ఉండడం లేదా మాటాడకుండా ఉండడం అనే భావాన్ని ఇస్తుంది. మొదటి పదబంధంలోని ‘మూగవాడినయ్యాను’తో ఉన్న సమాంతరతను, స్వల్ప భేదాన్ని నిలుపుతుంది.
- source_word: מִטּוֹב
  choice: మేలు విషయంలో కూడా
  rationale: מִן + טוֹב అనే సంక్షిప్త పదబంధం సందిగ్ధమైనది. ఈ ఎంపిక తెలుగులో చదవడానికి సహజంగా ఉండడంతో పాటు, మంచి మాటలు పలకకపోవడమా లేక మేలైనదానికి దూరంగా ఉండడమా అనే రెండు అవకాశాలను పాదటిప్పణిలో నిలుపుతుంది.
- source_word: וּכְאֵבִי
  choice: నా బాధ
  rationale: כְּאֵב శారీరక లేదా మానసిక వేదనను సూచించగలదు. ‘బాధ’ రెండింటినీ కలుపుకునే సాధారణ, సహజమైన తెలుగు పదం.
- source_word: נֶעְכָּר
  choice: చెలరేగింది
  rationale: עכר యొక్క నిఫల్ రూపం కలవరపడడం, రగులుకోవడం లేదా తీవ్రం కావడం అనే భావాన్ని ఇస్తుంది. మౌనంలో అంతర్గత బాధ మరింత ఉధృతమైన సందర్భాన్ని ‘చెలరేగింది’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: מִטּוֹב పదబంధం సూచించే మౌనం యొక్క పరిధి
  choice: ప్రధాన పాఠంలో ‘మేలు విషయంలో కూడా’ అని ఉంచి అర్థాన్ని పూర్తిగా విప్పలేదు.
  alternative: ‘మంచి మాటలు కూడా పలకలేదు’ లేదా ‘మేలైనదానికి దూరంగా ఉన్నాను’ అని స్పష్టీకరించడం.
  rationale: హీబ్రూ పదబంధం మంచి మాటలు పలకకుండా ఉండడాన్ని గానీ, మేలైనదానికి దూరంగా ఉండడాన్ని గానీ సూచించవచ్చు. ప్రధాన పాఠంలో ఒకే వివరణను సిద్ధాంతపరంగా ఖరారు చేయకుండా సందిగ్ధతను నిలిపి, అవకాశాలను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కీర్తనాశైలిని నిలుపుతూ, సాధారణ పాఠకులకు అర్థమయ్యే పదాలను వాడాం. హీబ్రూ సమాంతర నిర్మాణాన్ని రెండు భిన్నమైన మౌన వ్యక్తీకరణలతో కాపాడాం.
