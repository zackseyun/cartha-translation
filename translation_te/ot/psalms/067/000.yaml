lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నిర్దేశకునికి
  rationale: కీర్తనల శీర్షికల్లో ఈ పదం సంగీత ప్రదర్శనను నడిపించే లేదా పర్యవేక్షించే వ్యక్తిని సూచిస్తుంది. ‘సంగీత నిర్దేశకుడు’ అనే పదం కేవలం ‘నాయకుడు’ కంటే ఆ సంగీత బాధ్యతను స్పష్టంగా తెలియజేస్తుంది; לַ ఉపసర్గను ‘-కి’తో సహజంగా వ్యక్తం చేశాం.
- source_word: בִּנְגִינֹת
  choice: తంతివాద్యాలతో
  rationale: ఈ సంగీత శీర్షికలో నామవాచకం తంతివాద్యాలను లేదా వాటితో చేసే సంగీతాన్ని సూచిస్తుంది. ‘తంతివాద్యాలతో’ అనేది సహజమైన ఆధునిక తెలుగు ప్రయోగం; בְּ ఉపసర్గకు సాధ్యమైన మరో భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: ఇది కీర్తనల శీర్షికల్లో కనిపించే ప్రామాణిక సాహిత్య-సంగీత ప్రక్రియ సూచకం. తెలుగులో ‘కీర్తన’ ఆ ప్రక్రియను సంక్షిప్తంగా, సుపరిచితంగా తెలియజేస్తుంది.
- source_word: שִׁיר
  choice: గీతం
  rationale: ఇది సాధారణంగా ‘పాట/గీతం’ అనే ప్రక్రియను సూచిస్తుంది. מִזְמוֹרతో కలిపివేయకుండా హెబ్రీ మూలంలోని రెండు వేర్వేరు ప్రక్రియ పదాలను కాపాడేందుకు ‘గీతం’ అని విడిగా అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, శీర్షికకు తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలిని వాడాం. సంగీత సంబంధ పదాలను సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ఎంచుకున్నాం; మూలంలోని మూడు విడి శీర్షిక భాగాల నిర్మాణాన్ని నిలిపాం.
