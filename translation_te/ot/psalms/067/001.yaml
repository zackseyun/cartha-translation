  naturalness: ‘దేవుడు మనకు కృప చూపుగాక, మనలను ఆశీర్వదించుగాక’ అనేది ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సామూహిక ప్రార్థనా శైలి. ‘ఆయన ముఖం మనపై ప్రకాశించుగాక’ కూడా సుపరిచితమైన బైబిలు-ప్రార్థనా ప్రయోగం.
