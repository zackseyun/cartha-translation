  rationale: హీబ్రూ పాఠంలోని ప్రార్థనాత్మక బలాన్ని రెండు స్పష్టమైన కోరికార్థక క్రియలతో నిలిపాం. అక్షరార్థంగా ‘మనతో’ ఉన్న అప్రతീക്ഷిత ప్రయోగాన్ని తొలగించకుండా పాదసూచికలో తెలియజేసి, ప్రధాన పాఠ్యంలో ముఖం ప్రకాశించే ఆశీర్వాదానికి సహజమైన తెలుగు రూపమైన ‘మనపై ప్రకాశించుగాక’ను వాడాం. పాదసూచిక గుర్తులను సంబంధిత పదబంధాలకు సరిగా జతచేశాం.
