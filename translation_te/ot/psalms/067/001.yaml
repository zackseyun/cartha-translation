  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֱלֹהִ֗ים יְחָנֵּ֥/נוּ וִֽ/יבָרְכֵ֑/נוּ יָ֤אֵ֥ר פָּנָ֖י/ו אִתָּ֣/נוּ סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/001.yaml
  text: May God be gracious to us and bless us[a]; may his face shine upon us[c][b]. Selah
translation:
  language: te
  text: దేవుడు మనకు కృప చూపుగాక, మనలను ఆశీర్వదించుగాక! ఆయన ముఖం మనపై ప్రకాశించుగాక.[a][b] సెలా.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో అక్షరార్థంగా “మనతో” అని ఉంది. అయితే ‘ముఖం ప్రకాశించు’ అనే ప్రయోగంలో దీనిని “మనపై ప్రకాశించుగాక” అని అర్థం చేసుకోవడం సహజం.
    reason: lexical_alternative
  - marker: b
    text: ఈ మాటలు సంఖ్యాకాండము 6:24–26లోని యాజక ఆశీర్వాదాన్ని, ముఖ్యంగా “యెహోవా తన ముఖాన్ని నీపై ప్రకాశింపజేయుగాక” అనే మాటను ప్రతిధ్వనింపజేస్తాయి.
    reason: cross_reference
  - marker: c
    text: “సెలా” బహుశా ఆరాధనా లేదా సంగీత సూచన; దాని ఖచ్చితమైన అర్థం తెలియదు.
    reason: cultural_note
lexical_decisions:
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపంలో బహువచనంగా కనిపించినా, ఇక్కడ ఏకవచన క్రియలతో వచ్చి ఇశ్రాయేలు దేవుణ్ణే సూచిస్తుంది.
- source_word: יְחָנֵּנוּ
  choice: మనపై కృప చూపి
  rationale: חנן అనే క్రియ ప్రార్థనాత్మక సందర్భంలో కృపాపూర్వక అనుగ్రహాన్ని కోరుతుంది; ‘కరుణించు’ కంటే ‘కృప చూపు’ మూలార్థ విస్తృతిని కాపాడుతుంది.
- source_word: וִיבָרְכֵנוּ
  choice: మనలను ఆశీర్వదించుగాక
  rationale: ברך అనే సాధారణ ఆశీర్వాద క్రియను సహజమైన ఆధునిక తెలుగు ప్రార్థనా రూపంలో అందిస్తుంది.
- source_word: יָאֵר
  choice: ప్రకాశించుగాక
  rationale: אור హిఫీల్ రూపం ‘ప్రకాశింపజేయు’ అనే భావం కలిగినప్పటికీ, ‘ముఖం’తో కూడిన ఈ ప్రయోగంలో తెలుగు వాక్యానికి ‘ప్రకాశించుగాక’ సహజంగా ఉంటుంది.
- source_word: פָּנָיו
  choice: ఆయన ముఖం
  rationale: మూలంలోని స్పష్టమైన ముఖరూపకాన్ని నిలుపుతుంది; సంఖ్యాకాండము 6:25లోని యాజక ఆశీర్వాద ప్రతిధ్వనిని కూడా కాపాడుతుంది.
- source_word: אִתָּנוּ
  choice: మనతో
  rationale: హీబ్రూ אִתָּנוּ యొక్క ప్రత్యక్ష అర్థం ‘మనతో’; సాధారణంగా అర్థానుసారంగా ‘మనపై’ అని అనువదించగలిగినా, ఇక్కడ మూలంలోని అరుదైన ప్రయోగాన్ని మరియు దాని సాధ్యమైన భావసూక్ష్మతను కాపాడాం.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఖచ్చితమైన అర్థం తెలియని ఆరాధనా లేదా సంగీత సూచన కావచ్చునని భావించబడుతుంది; ఊహాత్మక అర్థం పెట్టకుండా లిప్యంతరీకరించాం.
theological_decisions:
- issue: క్రియల ప్రార్థనాత్మక/కోరికార్థక బలం
  choice: ‘కృప చూపి ... ఆశీర్వదించుగాక; ... ప్రకాశించుగాక’ అనే ప్రార్థనగా అనువదించడం
  alternative: ‘దేవుడు మనపై కృప చూపుతున్నాడు, మనలను ఆశీర్వదిస్తున్నాడు’ అనే సూచనార్థక వాక్యం
  rationale: కీర్తనలోని ఆశీర్వాద సందర్భం ఈ క్రియలను కోరిక లేదా ప్రార్థనగా గ్రహించడానికి బలమైన ఆధారం ఇస్తుంది.
- issue: యాజక ఆశీర్వాద ప్రతిధ్వని
  choice: ‘ఆయన ముఖం ... ప్రకాశించుగాక’ అనే రూపకాన్ని నిలుపడం
  alternative: ‘ఆయన మనలను అనుగ్రహంతో చూడుగాక’ అని భావానువాదం చేయడం
  rationale: సంఖ్యాకాండము 6:24–26తో ఉన్న అంతర్గ్రంథ సంబంధాన్ని వ్యాఖ్యానించి తొలగించకుండా, ముఖం ప్రకాశించే దృశ్యరూపాన్ని కాపాడుతుంది.
- issue: אִתָּנוּ యొక్క అసాధారణ ప్రయోగం
  choice: ‘మనతో’ అనే ప్రత్యక్ష అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: యాజక ఆశీర్వాదంలోని సాధారణ ప్రయోగాన్ని అనుసరించి ‘మనపై’ అని ఇవ్వడం
  rationale: WLC పాఠం ‘మనతో’ అని ఉంది. ‘మనపై’ సందర్భోచిత భావం అయినప్పటికీ, ప్రధాన పాఠ్యంలో ప్రత్యక్ష రూపాన్ని ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలియజేయడం నిజమైన అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామూహిక ప్రార్థనా శైలిని ఉపయోగించాం. ‘ముఖం’ అనే స్పష్టమైన హీబ్రూ రూపకాన్ని నిలిపి, అసాధారణమైన ‘మనతో’ అనే పూర్వప్రత్యయార్థాన్ని ప్రధాన పాఠ్యంలో కాపాడి, సాధారణ భావానువాదమైన ‘మనపై’ను పాదసూచికలో ఇచ్చాం.
