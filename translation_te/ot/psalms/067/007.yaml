  text: יְבָרְכֵ֥/נוּ אֱלֹהִ֑ים וְ/יִֽירְא֥וּ אֹ֝ת֗/וֹ כָּל אַפְסֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/007.yaml
  text: God will bless us[a], and all the ends of the earth will fear him.
translation:
  language: te
  text: దేవుడు మనలను ఆశీర్వదిస్తాడు; భూమి నలుమూలలవారందరూ ఆయనకు భయపడతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనను భక్తితో గౌరవిస్తారు” లేదా “ఆయన పట్ల భక్తిపూర్వక విస్మయంతో ఉంటారు.” దేవునికి సంబంధించి హీబ్రూ క్రియ భయంతోపాటు భక్తిపూర్వక విస్మయాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבָרְכֵנוּ
  choice: మనలను ఆశీర్వదిస్తాడు
  rationale: పీయేల్ రూపం, మొదటి పురుష బహువచన కర్మప్రత్యయంతో, ‘మనలను ఆశీర్వదించు’ అనే అర్థం ఇస్తుంది. ఈ కవితా ముగింపులో అసంపూర్ణ క్రియను నమ్మకంతో చెప్పే భవిష్యత్/ఫలితార్థంగా అనువదించాం; ‘ఆశీర్వదించుగాక’ అనే భావం కూడా సందర్భపరంగా సాధ్యమే.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: పదరూపం బహువచనసదృశమైనప్పటికీ, క్రియ ఏకవచనంలో ఉండడం వల్ల ఇక్కడ ఏకవచన వ్యక్తిగత సూచనగా ‘దేవుడు’ సరైనది.
- source_word: וְיִירְאוּ
  choice: భయపడతాయి
  rationale: దేవుని విషయంగా ירא భయం, భక్తిపూర్వక విస్మయం, గౌరవభావం అన్నింటినీ కలిగి ఉండగలదు. మూలంలోని బలాన్ని, భావపరమైన విస్తృతిని నిలుపుకోవడానికి ‘భయపడతాయి’ ఎంచుకున్నాం.
- source_word: אֹתוֹ
  choice: ఆయనకు
  rationale: ఏకవచన వ్యక్తిగత సూచన దేవునివైపు తిరిగి ఉంది. తెలుగులో ‘భయపడు’తో సహజంగా దత్తివిభక్తి వాడబడేందున ‘ఆయనకు’ అని ఇచ్చాం.
- source_word: כָּל אַפְסֵי אָרֶץ
  choice: భూమి అంచులన్నీ
  rationale: ఇది భూమి యొక్క అత్యంత దూర ప్రాంతాలను సూచించే కవితాత్మక నానుడి. ‘భూమి అంచులన్నీ’ మూలరూపకాన్ని నిలుపుతూ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: దేవుని పట్ల ירא భావం
  choice: ఆయనకు భయపడతాయి
  alternative: ఆయనను భక్తితో గౌరవిస్తాయి / ఆయనను చూసి విస్మయంతో నిలుస్తాయి
  rationale: ‘భయపడతాయి’ అనేది భయం, భక్తిపూర్వక విస్మయం, విధేయత మధ్యనున్న బైబిలీయ భావతీవ్రతను కాపాడుతుంది; దానిని కేవలం గౌరవంగా కుదించదు.
- issue: יְבָרְכֵנוּ క్రియ యొక్క విధి/కాల భావం
  choice: మనలను ఆశీర్వదిస్తాడు
  alternative: మనలను ఆశీర్వదించుగాక
  rationale: కీర్తన ముగింపులోని సమాంతర అసంపూర్ణ క్రియల నేపథ్యంలో దీన్ని నమ్మకభరితమైన భవిష్యత్ ప్రకటనగా చదివాం. ప్రార్థనాత్మక భావం సాధ్యమైనప్పటికీ దానిని ప్రధాన పాఠ్యంలో బలవంతంగా ఎంచుకోలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే కీర్తన కవితాత్మక గాంభీర్యాన్ని నిలుపుతూ రూపొందించబడింది. ‘భూమి అంచులన్నీ’ అనే మూలరూపకం అలాగే ఉంచబడింది.
