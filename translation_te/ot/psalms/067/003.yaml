  yaml_path: translation/ot/psalms/067/003.yaml
  text: Let the peoples praise you[a], O God[b]; let all the peoples praise you.
translation:
  language: te
  text: దేవా, ప్రజలు నిన్ను స్తుతించుగాక[a]; ప్రజలందరూ నిన్ను స్తుతించుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజలు నిన్ను స్తుతిస్తారు.” హీబ్రూ క్రియారూపాన్ని కోరిక లేదా ప్రార్థనగా అర్థం చేసుకోవచ్చు; ఇక్కడ తక్కువ సంభావ్యతతో భవిష్యత్ ప్రకటనగానూ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: నిన్ను స్తుతించుగాక
  rationale: ידה అనే క్రియ యొక్క హిఫీల్ రూపం కీర్తనల సందర్భంలో దేవుణ్ణి స్తుతించడం లేదా ఆయనకు కృతజ్ఞత చెల్లించడం అనే భావాన్ని ఇస్తుంది. ఇక్కడ పల్లవిలాంటి ప్రార్థనా సందర్భం ఉన్నందున, కోరికను తెలిపే ‘స్తుతించుగాక’ సహజంగా ఉండి కవితా సమాంతరతను కాపాడుతుంది.
- source_word: עַמִּים
  choice: ప్రజలు / ప్రజలందరూ
  rationale: బహువచన రూపం అనేక జనసమూహాలను సూచిస్తుంది. ‘ప్రజలు’ అనేది రాజకీయ భావాన్ని అనవసరంగా చేర్చకుండా ఆ విస్తృత బహువచన భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ఇక్కడ ఇది ప్రత్యక్ష సంబోధన. తెలుగు కవితా ప్రార్థనా భాషలో ‘దేవా’ ఆ సంబోధనను స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כֻּלָּם
  choice: అందరూ
  rationale: ఇది పేర్కొన్న ప్రజల సమగ్రతను సూచిస్తుంది. ‘ప్రజలందరూ’ అనే రూపం ‘వారందరూ’ అనే భావాన్ని సంక్షిప్తంగా, స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: స్తుతి పల్లవిలో పునరావృతమైన క్రియ యొక్క కోరిక/ప్రార్థనా భావం
  choice: ‘నిన్ను స్తుతించుగాక’ అనే ప్రార్థనాత్మక కోరికగా అనువదించడం
  alternative: ‘నిన్ను స్తుతిస్తారు’ అనే భవిష్యత్ ప్రకటనగా అనువదించడం
  rationale: హీబ్రూ క్రియారూపం వ్యాకరణపరంగా అసంపూర్ణ క్రియ అయినప్పటికీ, ఈ ప్రార్థనా పల్లవి సందర్భంలో కోరిక లేదా విన్నపాన్ని వ్యక్తం చేస్తుంది. ‘స్తుతించుగాక’ ఈ భావాన్ని నిలుపుతూ భవిష్యత్తు గురించిన ఖచ్చితమైన ప్రవచనంగా అతిగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కవితా-ప్రార్థనా శైలి. ‘స్తుతించుగాక’ కొంత సాహిత్యరూపమైనప్పటికీ కీర్తనా సందర్భంలో సహజంగా ఉండి హీబ్రూ కోరికార్థక అస్పష్టతను బాగా కాపాడుతుంది.
