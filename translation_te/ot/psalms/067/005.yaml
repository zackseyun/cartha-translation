  text: Let the peoples praise you[a], O God[b]; let all the peoples praise you.
translation:
  language: te
  text: దేవా, ప్రజలు నిన్ను స్తుతించుగాక[a]; ప్రజలందరూ నిన్ను స్తుతించుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవా, ప్రజలు నిన్ను స్తుతిస్తారు; ప్రజలందరూ నిన్ను స్తుతిస్తారు.” ఇక్కడ “స్తుతించు” అనే హీబ్రూ క్రియకు “కృతజ్ఞతలు చెల్లించు” అనే భావం కూడా ఉండవచ్చు.
    reason: క్రియారూపంలోని సూచనార్థక/ఆకాంక్షార్థక సందిగ్ధతను, అలాగే ముఖ్యమైన పదార్థ ప్రత్యామ్నాయాన్ని సంరక్షించడం.
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: నిన్ను స్తుతించుగాక
  rationale: ידה హిఫిల్ రూపం కీర్తనలలో దేవునికి బహిరంగంగా కృతజ్ఞతలు చెల్లించడం లేదా స్తుతించడం అనే భావాన్ని ఇస్తుంది. ఈ ఆరాధనా పల్లవిలో ‘స్తుతించు’ సహజంగా ఉండి విస్తృత భావాన్ని అందిస్తుంది; ‘-గాక’ ప్రార్థనాత్మక ఆకాంక్షను వ్యక్తపరుస్తుంది.
- source_word: עַמִּים
  choice: ప్రజలు / ప్రజలందరూ
  rationale: బహువచన రూపం అనేక జనసమూహాలను సూచిస్తుంది. తెలుగులో ‘ప్రజలు’ సహజంగా ఆ సమిష్టి బహువచనాన్ని నిలుపుతుంది; రెండో పాదంలోని כֻּלָּםతో కలిసి ‘ప్రజలందరూ’ సంపూర్ణతను స్పష్టం చేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ఇక్కడ పదం ప్రత్యక్ష సంబోధన. ‘దేవా’ ఆధునిక ప్రామాణిక తెలుగులో ప్రార్థనా-కావ్య శైలికి తగిన సహజ సంబోధన.
- source_word: כֻּלָּם
  choice: అందరూ
  rationale: ఇది ప్రజల సమస్త సమూహాన్ని చేర్చే సంపూర్ణతను బలపరుస్తుంది. ‘ప్రజలందరూ’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని తెలుపుతుంది.
theological_decisions:
- issue: పునరుక్త వాక్యంలోని క్రియాభావం
  choice: ప్రార్థన/ఆకాంక్షగా ‘స్తుతించుగాక’
  alternative: భవిష్యత్ లేదా నిశ్చయ వాక్యంగా ‘స్తుతిస్తారు’
  rationale: హీబ్రూ రూపాన్ని సందర్భానుసారం సూచనార్థకంగా కూడా గ్రహించవచ్చు. అయితే ఈ కీర్తనలోని ప్రార్థనాత్మక పల్లవి కారణంగా ఆకాంక్షార్థక భావం ప్రధానంగా కనిపిస్తుంది; అసలు భాషలోని ప్రత్యామ్నాయ సాధ్యతను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, కీర్తనా పల్లవికి తగిన గౌరవప్రదమైన ప్రార్థనా-కావ్య శైలి. ‘జనములు’ వంటి పాత రూపానికి బదులుగా ‘ప్రజలు’ వాడబడింది.
