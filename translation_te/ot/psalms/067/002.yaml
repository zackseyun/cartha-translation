source:
  edition: WLC
  text: לָ/דַ֣עַת בָּ/אָ֣רֶץ דַּרְכֶּ֑/ךָ בְּ/כָל גּ֝וֹיִ֗ם יְשׁוּעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/002.yaml
  text: that your way may be known on the earth[b][a], your salvation among all nations.
translation:
  language: te
  text: 'భూమిమీద నీ మార్గం తెలియబడునట్లు,[a]

    అన్ని జనాంగాల మధ్య నీ రక్షణ తెలియబడునట్లు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేశంలో.’ హీబ్రూ పదం స్థానిక దేశాన్ని లేదా భూమిని సూచించగలదు; అయితే ‘అన్ని జనాంగాల మధ్య’ అనే సమాంతర వాక్యం విశ్వవ్యాప్త అర్థానికి మద్దతిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీ విడిపింపు.’ హీబ్రూ పదం అపాయం నుంచి కాపాడటాన్ని లేదా విస్తృతమైన రక్షణను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָדַעַת
  choice: తెలియబడటానికి
  rationale: ל prefixed infinitive purposeను సూచిస్తుంది. ముందటి వచనంలోని ప్రార్థనకు కొనసాగింపుగా తెలుగులో ‘తెలియబడటానికి’ సహజంగా ఉండి ప్రయోజనార్థాన్ని నిలుపుతుంది; రెండో పాదంలో క్రియను అధ్యాహారంగా పునరుక్తి చేయడం తెలుగు స్పష్టతకు తోడ్పడుతుంది.
- source_word: בָּאָרֶץ
  choice: భూమి అంతటా
  rationale: אֶרֶץ అనేది ‘దేశం/భూమి’ రెండింటినీ సూచించగలదు. ‘సమస్త జనాల మధ్య’ అనే సమాంతర పాదం విశ్వవ్యాప్త పరిధిని బలపరుస్తుంది; అందువల్ల ‘భూమి అంతటా’ ఎంచుకున్నాం.
- source_word: דַּרְכֶּךָ
  choice: నీ మార్గం
  rationale: దేవుని పథం మరియు ఆయన వ్యవహరించే విధానం అనే రూపక విస్తృతిని ‘మార్గం’ నిలుపుతుంది.
- source_word: בְּכָל גּוֹיִם
  choice: సమస్త జనాల మధ్య
  rationale: גּוֹיִם ఇక్కడ అంతర్జాతీయ సమూహాలైన జనాలను సూచిస్తుంది. ‘సమస్త జనాల మధ్య’ בְ యొక్క సందర్భార్థాన్ని, కీర్తనలోని విశ్వవ్యాప్త దృష్టిని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְשׁוּעָתֶךָ
  choice: నీ రక్షణ
  rationale: יְשׁוּעָה కాపాడటం, విడిపించడం, విస్తృతమైన రక్షణ అనే భావాలను కలిగి ఉంది. ‘రక్షణ’ దైవిక రక్షక కార్యపు విస్తృతిని నిలుపుతుంది.
theological_decisions:
- issue: విశ్వవ్యాప్త ఆరాధన కీర్తనలో אֶרֶץ పరిధి
  choice: స్థానిక ‘దేశం’ కంటే విశ్వవ్యాప్త ‘భూమి’
  alternative: దేశంలో
  rationale: ‘సమస్త జనాల మధ్య’ అనే సమాంతర పాదం ప్రపంచవ్యాప్త పరిధిని సూచిస్తుంది. తరువాతి సిద్ధాంతాలను చేర్చకుండా కీర్తనలోని విశాల దృష్టిని ఇది కాపాడుతుంది.
- issue: יְשׁוּעָה యొక్క భావవిస్తృతిని నిలుపడం
  choice: రక్షణ
  alternative: విడుదల
  rationale: ఈ పదం నిర్దిష్ట అపాయం నుంచి విడుదలను సూచించగలిగినా, దేవుని మార్గం సమస్త జనాల మధ్య తెలియబడే సందర్భంలో ‘రక్షణ’ ఆయన రక్షక కార్యపు విస్తృతిని మెరుగ్గా నిలుపుతుంది; దానిని తరువాతి క్రమబద్ధ సిద్ధాంతార్థానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, కీర్తనకు తగిన గంభీరతతో రూపొందించబడింది. హీబ్రూ సమాంతరతను నిలుపుతూ, తెలుగులో అర్థస్పష్టత కోసం రెండో పాదంలో ‘తెలియబడటానికి’ అధ్యాహారంగా పునరుక్తి చేయబడింది.
