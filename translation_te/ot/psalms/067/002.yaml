revisions:
- from: 'భూమి అంతటా నీ మార్గం తెలియబడటానికి,[a]

    సమస్త జనాల మధ్య నీ రక్షణ తెలియబడటానికి.[b]'
  to: 'భూమిమీద నీ మార్గం తెలియబడునట్లు,[a]

    అన్ని జనాంగాల మధ్య నీ రక్షణ తెలియబడునట్లు.[b]'
  rationale: The revision preserves the Hebrew purpose construction and parallelism, uses a more idiomatic modern Telugu poetic form, and renders גּוֹיִם with ‘జనాంగాలు’ to retain its sense of nations. Footnote anchors remain attached to the corresponding lexical alternatives.
  reviewer_model: gpt-5.6-terra
