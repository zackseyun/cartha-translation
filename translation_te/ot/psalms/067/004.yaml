  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יִֽשְׂמְח֥וּ וִֽ/ירַנְּנ֗וּ לְאֻ֫מִּ֥ים כִּֽי תִשְׁפֹּ֣ט עַמִּ֣ים מִישׁ֑וֹר וּ/לְאֻמִּ֓ים בָּ/אָ֖רֶץ תַּנְחֵ֣/ם סֶֽלָה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/004.yaml
  text: Let the nations be glad and sing for joy[a], for you judge the peoples with equity and guide the nations on the earth[b]. Selah
translation:
  language: te
  text: దేశాలు సంతోషించి ఆనందంతో పాడుగాక[a]; ఎందుకంటే నీవు ప్రజలకు న్యాయంగా తీర్పు తీర్చుతావు, భూమిమీద[b] దేశాలకు మార్గం చూపిస్తావు. సెలా
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేశాలు సంతోషించి ఆనందంతో కేకలు వేయుగాక.’ ఈ క్రియ ఉల్లాసభరితమైన గానాన్ని లేదా మార్మోగే ఆనందకేకలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: אֶרֶץ‌ను మరింత స్థానిక భావంలో తీసుకుంటే, ‘దేశంలో’ అని కూడా అనువదించవచ్చు; ఈ కీర్తన పరిధి సర్వజన సంబంధమైనది కాబట్టి ఇక్కడ ‘భూమిమీద’ అని అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: సంతోషించి ... గాక
  rationale: שׂמח అనే క్రియలోని సంతోషస్థితిని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; సందర్భంలోని సంకల్పార్థక/ఆహ్వానార్థక భావాన్ని ‘గాక’ తెలియజేస్తుంది.
- source_word: וִירַנְּנוּ
  choice: ఆనందంతో పాడుగాక
  rationale: רנן సూచించే ఉల్లాసభరితమైన స్వరవ్యక్తీకరణను ‘ఆనందంతో పాడు’ సహజంగా అందిస్తుంది; అది ఆనందకేకను కూడా సూచించగలదని పాదసూచికలో ఉంచబడింది.
- source_word: לְאֻמִּים
  choice: దేశాలు
  rationale: కీర్తనలోని విశ్వవ్యాప్త సందర్భానికి అనుగుణంగా జాతులను/దేశాలను సూచిస్తుంది; తరువాతి పునరుక్తిలోనూ ఇదే పదం నిలుపబడింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: దేశాల ఆనందానికి తరువాతి వాక్యం కారణమని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: תִשְׁפֹּט
  choice: తీర్పు తీరుస్తావు
  rationale: שׁפט యొక్క న్యాయనిర్ణయ భావాన్ని నిలుపుతుంది; ఇక్కడ అసంపూర్ణ క్రియారూపాన్ని దేవుని లక్షణాత్మక కార్యంగా వర్తమానార్థంలో అందిస్తుంది.
- source_word: עַמִּים
  choice: ప్రజలు
  rationale: לְאֻמִּיםకు వాడిన ‘దేశాలు’ నుండి పదభేదాన్ని నిలిపి, విస్తృత ప్రజాసమూహాల భావాన్ని అందిస్తుంది.
- source_word: מִישׁוֹר
  choice: న్యాయంగా
  rationale: సూటితనం, సమత్వం, న్యాయబద్ధత అనే భావాలను న్యాయవిచారణ సందర్భంలో సులభమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בָּאָרֶץ
  choice: భూమిమీద
  rationale: కీర్తన యొక్క సర్వజన పరిధిని బట్టి אֶרֶץ‌ను స్థానిక ‘దేశం’గా కాక ప్రపంచవ్యాప్త ‘భూమి’గా అందిస్తుంది.
- source_word: תַּנְחֵם
  choice: మార్గం చూపిస్తావు
  rationale: נחה హిఫిల్ రూపంలోని నడిపించడం/దారి చూపించడం అనే భావాన్ని, కేవలం భౌతిక కదలికను సూచించకుండా సహజంగా అందిస్తుంది.
- source_word: סֶלָה
  choice: సెలా
  rationale: పదం యొక్క ఖచ్చితమైన కార్యం అనిశ్చితమైనందున వ్యాఖ్యానార్థం బలవంతంగా చేర్చకుండా లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: אֶרֶץ యొక్క పరిధి
  choice: ప్రపంచవ్యాప్త ‘భూమి’
  alternative: స్థానిక ‘దేశం’ లేదా ‘నేల’
  rationale: 67వ కీర్తన అంతటా ప్రజలు, దేశాలు అనే సర్వజన దృష్టి ఉన్నందున ‘భూమి’ సందర్భానికి బాగా సరిపోతుంది; అయినా స్థానిక అర్థసాధ్యతను పాదసూచికలో నిలిపాం.
- issue: అసంపూర్ణ క్రియారూపాల కాలం/భావం
  choice: ఆహ్వానార్థకం మరియు లక్షణాత్మక వర్తమానం—‘పాడుగాక ... తీర్పు తీరుస్తావు ... మార్గం చూపిస్తావు’
  alternative: భవిష్యదర్థం—‘సంతోషిస్తాయి ... తీర్పు తీరుస్తావు ... నడిపిస్తావు’
  rationale: మొదటి క్రియలు ఆరాధనాత్మక కోరిక లేదా పిలుపుగా, తరువాతివి దేవుని నిరంతర స్వభావకార్యాలుగా సహజంగా వినిపిస్తాయి; హెబ్రీ అసంపూర్ణ రూపంలోని భవిష్యత్ సాధ్యతను సిద్ధాంతపరంగా అతిగా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కీర్తనా శైలి వాడబడింది. ‘గాక’ కవితాత్మక ఆహ్వానాన్ని నిలుపుతుంది; మిగిలిన వాక్య నిర్మాణం సహజమైన ప్రస్తుత తెలుగు ప్రయోగానికి దగ్గరగా ఉంది.
