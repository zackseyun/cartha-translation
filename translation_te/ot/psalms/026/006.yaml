base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/006.yaml
  text: I wash my hands in innocence[a], and go around your altar, O Yahweh[b],
translation:
  language: te
  text: 'నిర్దోషత్వంతో[a] నా చేతులు కడుక్కొని,

    యాహ్వే, నీ బలిపీఠం చుట్టూ తిరుగుతాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శుద్ధతతో” లేదా “పరిశుభ్రతతో.” హీబ్రూ పదం నైతిక నిర్దోషత్వాన్నీ, ఆచార సంబంధ శుద్ధతనూ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרְחַץ
  choice: కడుక్కొని
  rationale: רחץ అనే క్రియ ఇక్కడ కవితాత్మక వర్తమాన లేదా అలవాటైన చర్యను సూచించగలదు. తరువాతి క్రియతో సహజంగా అనుసంధానించేందుకు తెలుగు అసమాపక క్రియారూపం వాడబడింది.
- source_word: בְּנִקָּיוֹן
  choice: నిర్దోషత్వంతో
  rationale: נִקָּיוֹןకు శుద్ధత, పరిశుభ్రత, నిర్దోషత్వం అనే భావాలు ఉన్నాయి. సందర్భంలోని నైతిక భావాన్ని ముందుకు తెస్తూనే ఇతర సాధ్యమైన భావాలను పాదసూచికలో ఉంచుతుంది.
- source_word: כַּפָּי
  choice: నా చేతులు
  rationale: כף అక్షరార్థంగా అరచేతిని సూచించగలిగినా, కడుక్కోవడం అనే సందర్భంలో సహజమైన తెలుగు ప్రయోగం ‘చేతులు’.
- source_word: וַאֲסֹבְבָה
  choice: చుట్టూ తిరుగుతాను
  rationale: סבב అంటే చుట్టూ తిరగడం లేదా ప్రదక్షిణగా వెళ్లడం. చివరి విస్తృత రూపం సంకల్ప ఛాయను కలిగి ఉండవచ్చు; తెలుగు భవిష్యద్వర్తమాన రూపం చర్యతో పాటు ఆ సంకల్ప ఛాయను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִזְבַּחֲךָ
  choice: నీ బలిపీఠం
  rationale: מזבחకు సాధారణమైన, సందర్భోచితమైన తెలుగు పదం ‘బలిపీఠం’; ప్రత్యయం రెండవ పురుష ఏకవచన స్వామ్యాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ శాస్త్రీయ ఉచ్చారణకు సమీపమైన తెలుగు లిప్యంతరీకరణగా ‘యాహ్వే’ వాడబడింది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: נִקָּיוֹןలోని నైతిక, ఆచార సంబంధ భావాలు
  choice: ప్రధాన పాఠంలో ‘నిర్దోషత్వం’; పాదసూచికలో ‘శుద్ధత/పరిశుభ్రత’
  alternative: ప్రధాన పాఠంలో కేవలం ‘శుద్ధత’
  rationale: కీర్తన సందర్భం నైతిక యథార్థతను బలంగా సూచించినా, చేతులు కడుక్కోవడం ఆచార సంబంధ పరిశుభ్రతను కూడా ప్రతిధ్వనింపజేస్తుంది. అందువల్ల ఒక భావాన్ని ప్రధాన పాఠంలో ఎంచుకొని మరొకదాన్ని పూర్తిగా తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరమైన కవితా ధోరణితో అనువదించబడింది. ‘కడుక్కొని … తిరుగుతాను’ అనే నిర్మాణం రెండు చర్యలను సాఫీగా అనుసంధానిస్తుంది; మూలంలోని భావ అస్పష్టతను పాదసూచిక కాపాడుతుంది.
