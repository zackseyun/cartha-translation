lexical_decisions:
- source_word: אֲשֶׁר
  choice: ఎవరి … ఉందో
  rationale: మునుపటి వచనంలోని దుష్టులను వర్ణించే సంబంధార్థక నిర్మాణాన్ని తెలుగులో సహజంగా కొనసాగిస్తుంది.
- source_word: בִּידֵיהֶם
  choice: ఎవరి చేతుల్లో
  rationale: కార్యాలు వారి చేతుల్లో ఉన్నాయనే హీబ్రూ రూపకాన్ని నిలుపుతుంది.
- source_word: זִמָּה
  choice: దుష్టత్వం
  rationale: ఈ సందర్భంలో లైంగిక దుర్నీతికే పరిమితం చేయకుండా, లంచాలకు సమాంతరంగా విస్తృతమైన నైతిక చెడును సూచిస్తుంది.
- source_word: וִימִינָם
  choice: ఎవరి కుడిచేయి
  rationale: హీబ్రూలోని ఏకవచన సమూహార్థక రూపాన్ని, కార్యసాధనకు మరియు శక్తికి సూచకమైన కుడిచేయి రూపకాన్ని నిలుపుతుంది.
- source_word: מָלְאָה
  choice: నిండి ఉందో
  rationale: హీబ్రూ స్థిత్యర్థాన్ని సహజమైన వర్తమాన తెలుగు రూపంలో వ్యక్తపరుస్తుంది.
- source_word: שֹׁחַד
  choice: లంచాలతో
  rationale: హీబ్రూలో రూపపరంగా ఏకవచనమైనా సాధారణంగా అవినీతి ఆచారాన్ని సూచిస్తున్నందున తెలుగు బహువచనార్థక రూపం సహజంగా ఉంటుంది.
