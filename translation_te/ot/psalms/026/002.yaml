source:
  edition: WLC
  text: בְּחָנֵ֣/נִי יְהוָ֣ה וְ/נַסֵּ֑/נִי צרופ/ה כִלְיוֹתַ֣/י וְ/לִבִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/002.yaml
  text: Examine me[a], O Yahweh, and test me; refine my mind and my heart.
translation:
  language: te
  text: 'యాహ్వే, నన్ను పరిశీలించు, నన్ను పరీక్షించు;

    నా మూత్రపిండాలనూ[a], నా హృదయాన్నీ పుటం వేయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘మూత్రపిండాలు.’ ప్రాచీన హీబ్రూ వాడుకలో ఇవి మనిషి లోతైన ఆలోచనలు, భావోద్వేగాలు లేదా అంతరంగాన్ని సూచించగలవు.
    reason: cultural_note
lexical_decisions:
- source_word: בְּחָנֵנִי
  choice: నన్ను పరిశీలించు
  rationale: בחן ఒకరి నిజ స్వభావాన్ని తెలుసుకునేలా పరిశీలించడం లేదా పరీక్షించడం అనే భావాన్ని ఇస్తుంది. తరువాతి נסהతో ఉన్న స్వల్ప భేదాన్ని తెలుగులో నిలుపుకోవడానికి ‘పరిశీలించు’ ఎంచుకున్నాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన నాలుగు హీబ్రూ అక్షరాలను బిరుదుతో భర్తీ చేయకుండా, వ్యక్తిగత నామంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וְנַסֵּנִי
  choice: నన్ను పరీక్షించు
  rationale: נסה పరీక్ష ద్వారా నిరూపించడం అనే భావాన్ని ఇస్తుంది; సమాంతర పాదంలోని בחןకు భిన్నంగా ‘పరీక్షించు’ సహజంగా ఉంటుంది.
- source_word: צרופה
  choice: పుటం వేయి
  rationale: צרף లోహాన్ని కరిగించి మలినాలను తొలగించే శుద్ధీకరణ ప్రక్రియను సూచిస్తుంది. ‘పుటం వేయి’ ఆ రూపకాన్ని సంక్షిప్తంగా, కవితాత్మకంగా నిలుపుతుంది.
- source_word: כִלְיוֹתַי
  choice: నా మూత్రపిండాలు
  rationale: హీబ్రూ పదానికి అక్షరార్థం ‘మూత్రపిండాలు’; ప్రాచీన హీబ్రూ మనోవ్యవహారంలో అవి లోతైన ఆలోచనలు, భావోద్వేగాల స్థానాన్ని సూచిస్తాయి. మూలంలోని శరీరాంగ రూపకాన్ని ప్రధాన పాఠ్యంలో ఉంచి, దాని భావాన్ని పాదటిప్పణిలో వివరించాం.
- source_word: וְלִבִּי
  choice: నా హృదయం
  rationale: לב హృదయాన్ని, విస్తృతంగా ఆలోచన, సంకల్పం, అంతరంగాన్ని సూచిస్తుంది. ‘హృదయం’ మూల రూపకాన్నీ మూత్రపిండాలతో ఉన్న కవితా సమాంతరతనూ నిలుపుతుంది.
theological_decisions:
- issue: హీబ్రూ కవిత్వంలోని మానవ అంతరంగ శరీరాంగ రూపకం
  choice: ‘మూత్రపిండాలు’, ‘హృదయం’ అనే శరీరాంగ రూపకాలను ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘నా అంతరంగాన్ని, నా హృదయాన్ని పుటం వేయి’
  rationale: మూలం అంతరంగాన్ని సూచించడానికి రెండు స్పష్టమైన శరీరాంగ పదాలను ఉపయోగిస్తుంది. భావానువాదంతో మొదటి రూపకాన్ని తొలగించకుండా, పాఠకునికి అవసరమైన సాంస్కృతిక వివరణను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కవితా శైలి వాడబడింది. ‘పుటం వేయి’ లోహశుద్ధి రూపకాన్ని నిలుపుతుంది; ‘మూత్రపిండాలు’ అసాధారణంగా వినిపించినా మూలంలోని స్పష్టమైన రూపకాన్ని దాచకుండా పాదటిప్పణితో వివరించబడింది.
