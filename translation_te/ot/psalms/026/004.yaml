source:
  edition: WLC
  text: לֹא יָ֭שַׁבְתִּי עִם מְתֵי שָׁ֑וְא וְ/עִ֥ם נַ֝עֲלָמִ֗ים לֹ֣א אָבֽוֹא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/004.yaml
  text: I have not sat with men of falsehood[a], and I do not go in with those who conceal themselves.
translation:
  language: te
  text: 'నేను అబద్ధికులతో కూర్చోలేదు;

    తమ నిజ స్వభావాన్ని దాచుకునేవారితో నేను కలవను.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాగి ఉండేవారితో నేను ప్రవేశించను.” హీబ్రూ పదం తమ నిజ స్వభావాన్ని దాచుకునే వ్యక్తులను సూచించవచ్చు.
    reason: నిఘంటు పరమైన ప్రత్యామ్నాయం మరియు మూలంలోని అస్పష్టతను సూచించడం
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: కూర్చోలేదు
  rationale: ישׁב యొక్క ప్రాథమిక ‘కూర్చోవడం’ అనే రూపచిత్రాన్ని నిలుపుతూ, עִם తో కలిసి సహవాసం చేయడం అనే సందర్భార్థాన్ని సహజంగా సూచిస్తుంది.
- source_word: מְתֵי שָׁוְא
  choice: అబద్ధికులతో
  rationale: שָׁוְא లోని అబద్ధం, మోసం, శూన్యత అనే భావాల్లో ఈ నైతిక సందర్భానికి ‘అబద్ధికులు’ సహజంగా సరిపోతుంది; מְתֵי అనే ‘మనుషులు’ భావం వ్యక్తులను సూచించే తెలుగు రూపంలో అంతర్భూతమైంది.
- source_word: נַעֲלָמִים
  choice: తమ నిజ స్వభావాన్ని దాచుకునేవారితో
  rationale: עלם మూలంలోని ‘దాచడం’ భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘వేషధారులు’ లేదా ‘కపటులు’ అని మరింత వ్యాఖ్యానాత్మకంగా నిర్ధారించకుండా, వారు ఏమిటో దాచే వ్యక్తులనే భావాన్ని నిలుపుతుంది.
- source_word: אָבוֹא
  choice: కలవను
  rationale: בוא యొక్క అక్షరార్థం ‘రావడం/వెళ్లడం/ప్రవేశించడం’; ఇక్కడ עִם తోను మొదటి పాదంలోని సహవాస భావానికి సమాంతరంగాను ఉన్నందున, వారి సాంగత్యంలో చేరడాన్ని సహజ తెలుగులో ‘కలవను’ అని తెలిపింది.
- source_word: וְעִם
  choice: …వారితో
  rationale: రెండవ పాదాన్ని మొదటి పాదంతో సమాంతరంగా కలుపుతుంది; తెలుగు ప్రతికూల సమాంతర నిర్మాణంలో సంధికార్థం సహజంగా అంతర్భూతమవుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గంభీరతతో రెండు సమాంతర పాదాలుగా రూపొందించబడింది. మొదటి పాదంలో హీబ్రూ రూపచిత్రం నిలుపబడగా, రెండవ పాదం సాధారణ పాఠకునికి స్పష్టంగా ఉండేలా భావసమానత్వంతో అనువదించబడింది.
