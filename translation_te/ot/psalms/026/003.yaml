source:
  edition: WLC
  text: כִּֽי חַ֭סְדְּ/ךָ לְ/נֶ֣גֶד עֵינָ֑/י וְ֝/הִתְהַלַּ֗כְתִּי בַּ/אֲמִתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/003.yaml
  text: For your steadfast love is before my eyes[b][a], and I have walked in your truth.
translation:
  language: te
  text: ఎందుకంటే నీ స్థిరమైన ప్రేమ నా కళ్లముందు ఉంది[a]; నీ సత్యంలో నేను నడుచుకున్నాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ నిబంధనపట్ల నిబద్ధత.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీ విశ్వసనీయతలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని కీర్తనకర్త విన్నపానికి కారణాన్ని పరిచయం చేస్తుంది; తెలుగు వాక్యంలో వివరణాత్మక సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: חַסְדְּךָ
  choice: నీ స్థిరమైన ప్రేమ
  rationale: దేవుని నిబద్ధమైన, నిలకడగల ప్రేమను వ్యక్తం చేస్తుంది; కేవలం భావోద్వేగ ప్రేమగా లేదా సాధారణ కనికరంగా అర్థాన్ని కుదించదు.
- source_word: לְנֶגֶד עֵינַי
  choice: నా కళ్లముందు ఉంది
  rationale: మూలంలోని దృశ్య రూపకాన్ని నిలుపుతూ, దానిని ఎల్లప్పుడూ మనస్సులో ఉంచుకోవడం అనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וְהִתְהַלַּכְתִּי
  choice: నేను నడుచుకున్నాను
  rationale: הלך హిత్పయేల్ రూపం జీవన ప్రవర్తనను సూచించగలదు. ‘నడుచుకున్నాను’ మూల రూపకాన్ని, ఇప్పటివరకు కొనసాగిన జీవన విధాన భావాన్ని కాపాడుతుంది.
- source_word: בַּאֲמִתֶּךָ
  choice: నీ సత్యంలో
  rationale: אֱמֶת లోని సత్యం, విశ్వసనీయత, నమ్మకత్వం అనే విస్తృత భావపరిధిని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: దైవిక నిబంధన సంబంధ పదాలైన חֶסֶד మరియు אֱמֶת భావపరిధి
  choice: חֶסֶד ను ‘స్థిరమైన ప్రేమ’గా, אֱמֶת ను ‘సత్యం’గా అనువదించడం
  alternative: חֶסֶד ను ‘నిబంధన నిబద్ధత’గా, אֱמֶת ను ‘విశ్వసనీయత’గా అనువదించడం
  rationale: ఈ పదాలు దేవుని ప్రేమపూర్వక నిబద్ధతను, నమ్మదగిన స్వభావాన్ని కలిసి సూచిస్తాయి. ప్రధాన అనువాదం వాటి వేదాంతపరమైన సమృద్ధిని ఏకైక సిద్ధాంతపరమైన భావానికి పరిమితం చేయదు; ప్రత్యామ్నాయ భావాలను పాదసూచికల్లో చూపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘కళ్లముందు’ మరియు ‘నడుచుకున్నాను’ అనే మూల రూపకాలను సాధారణ పాఠకులకు అర్థమయ్యేలా నిలిపి ఉంచింది.
