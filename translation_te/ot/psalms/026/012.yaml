source:
  edition: WLC
  text: רַ֭גְלִ/י עָֽמְדָ֣ה בְ/מִישׁ֑וֹר בְּ֝/מַקְהֵלִ֗ים אֲבָרֵ֥ךְ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/012.yaml
  text: My foot stands on level ground[a]; in the assemblies I will bless Yahweh.
translation:
  language: te
  text: నా పాదం సమతలమైన నేలపై స్థిరంగా నిలిచి ఉంది[a]; సభల్లో నేను యాహ్వేను స్తుతిస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సమమైన స్థలంలో’; హీబ్రూ పదానికి నిటారుతనం లేదా యథార్థత అనే అంతరార్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלִי
  choice: నా పాదం
  rationale: హీబ్రూలో ఏకవచన నామవాచకానికి ప్రథమ పురుష ఏకవచన ప్రత్యయం ఉంది; కాబట్టి కవితాత్మక ఏకవచనాన్ని నిలుపుకున్నాం.
- source_word: עָמְדָה
  choice: స్థిరంగా నిలిచింది
  rationale: స్త్రీలింగ ఏకవచన కర్తతో ఏకీభవించే Qal perfect రూపం. పూర్తయిన క్రియ ఫలితంగా ఉన్న ప్రస్తుత స్థిరత్వాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בְמִישׁוֹר
  choice: సమతలమైన చోట
  rationale: ముఖ్యంగా సమమైన లేదా చదునైన స్థలాన్ని సూచించే స్పష్టమైన భౌతిక చిత్రాన్ని నిలుపుతూ, న్యాయం లేదా యథార్థత అనే సంభావ్య నైతిక అంతరార్థాన్ని పాఠకుడిపై బలవంతంగా మోపదు.
- source_word: בְמַקְהֵלִים
  choice: సమాజాల్లో
  rationale: קהל నుండి వచ్చిన బహువచనం కూడి ఉన్న జనసమూహాలను సూచిస్తుంది. ‘సమాజాల్లో’ బహువచనాన్ని నిలుపుతూ అతిగా మతసంస్థాపరమైన పదప్రయోగాన్ని నివారిస్తుంది.
- source_word: אֲבָרֵךְ
  choice: నేను … స్తుతిస్తాను
  rationale: ברך అనే క్రియకు మూలార్థం ‘దీవించు’; అయితే దేవుని ఉద్దేశించినప్పుడు తెలుగు వాడుకలో ‘యెహోవాను దీవిస్తాను’ కంటే ‘స్తుతిస్తాను’ ఉద్దేశించిన గౌరవప్రకటనను సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా అందించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం; ఇది ఏ ప్రత్యేక సిద్ధాంత వ్యాఖ్యానాన్నీ చేర్చదు.
- issue: בְמִישׁוֹר లోని భౌతిక మరియు నైతిక భావసంభావ్యత
  choice: ప్రధాన పాఠంలో ‘సమతలమైన చోట’ అనే భౌతిక చిత్రం
  alternative: యథార్థతలో / న్యాయమైన మార్గంలో
  rationale: మూలపదం సమతల ప్రదేశాన్ని సూచించగలదు; అదే సమయంలో నిటారుతనం లేదా యథార్థత అనే అంతరార్థం ఉండవచ్చు. ప్రధాన పాఠం స్పష్టమైన చిత్రాన్ని ఉంచి, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గంభీరమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి. హీబ్రూ ఏకవచనం, సమాజాల బహువచనం, స్థిరత్వ భావం నిలుపబడ్డాయి.
