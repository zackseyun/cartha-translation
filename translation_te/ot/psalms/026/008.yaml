source:
  edition: WLC
  text: יְֽהוָ֗ה אָ֭הַבְתִּי מְע֣וֹן בֵּיתֶ֑/ךָ וּ֝/מְק֗וֹם מִשְׁכַּ֥ן כְּבוֹדֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/008.yaml
  text: O Yahweh[a], I love the habitation of your house, the place where your glory dwells.
translation:
  language: te
  text: 'యాహ్వే[a], నీ ఇంటి నివాసాన్ని,

    నీ మహిమ నివసించే స్థలాన్ని నేను ప్రేమిస్తున్నాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరానువాదంగా, “యాహ్వే, నీ ఇంటి నివాసాన్ని, నీ మహిమ నివాసస్థలాన్ని నేను ప్రేమించియున్నాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: אָהַבְתִּי
  choice: నేను ప్రేమిస్తున్నాను
  rationale: హీబ్రూ పరిపూర్ణ క్రియ ఇక్కడ కీర్తనకర్త స్థిరమైన ప్రస్తుత అనురక్తిని వ్యక్తం చేస్తుంది; అందువల్ల సహజమైన వర్తమాన రూపం ఎంచుకున్నాం.
- source_word: מְעוֹן בֵּיתֶךָ
  choice: నీ మందిర నివాసం
  rationale: మְעוֹן అంటే నివాసం; בֵּיתֶךָ అక్షరార్థంగా ‘నీ ఇల్లు’. సందర్భం దేవుని పవిత్రస్థలాన్ని సూచిస్తున్నందున, తెలుగులో అసహజమైన ‘నీ ఇంటి నివాసం’ను తప్పించి ‘నీ మందిర నివాసం’ అని ఇచ్చాం.
- source_word: וּמְקוֹם
  choice: స్థలం
  rationale: מָקוֹם యొక్క సాధారణ అర్థమైన ‘స్థలం’ను నిలిపి, సమాంతర పదబంధంగా సహజంగా అమర్చాం.
- source_word: מִשְׁכַּן
  choice: నివసించే
  rationale: ఇది నామవాచకంగా ‘నివాసం/నివాసస్థలం’; అయితే నిర్మాణబద్ధమైన హీబ్రూ పదబంధాన్ని తెలుగులో స్పష్టంగా చెప్పేందుకు ‘నీ మహిమ నివసించే స్థలం’గా క్రియాత్మకంగా మార్చాం.
- source_word: כְּבוֹדֶךָ
  choice: నీ మహిమ
  rationale: దేవుని ప్రత్యక్ష సన్నిధి, వైభవాన్ని సూచించే כָּבוֹדకు ‘మహిమ’ సహజమైన మరియు స్థిరమైన తెలుగు సమానం.
theological_decisions:
- issue: పవిత్రస్థలానికి సంబంధించిన భాషను ఎంతవరకు నిర్దిష్టం చేయాలి
  choice: నీ మందిర నివాసం; నీ మహిమ నివసించే స్థలం
  alternative: నీ ఇంటి నివాసం; నీ మహిమ నివాసముండే స్థలం
  rationale: మూలంలోని ‘నీ ఇల్లు’ అనే రూపకం పూర్తిగా అంతరించకుండా ‘మందిరం’ ద్వారా సందర్భాన్ని స్పష్టం చేశాం; ‘దేవాలయం’ వంటి మరింత నిర్దిష్ట చారిత్రక గుర్తింపును బలవంతంగా చేర్చలేదు.
- issue: దైవ నామం యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ప్రత్యక్షంగా ఉన్న יְהוָה అనే వ్యక్తిగత దైవ నామాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; భక్తిపూర్వకమైనా సహజంగా వినిపించే కవితా శైలి. రెండు సమాంతర పదబంధాలను పంక్తి విభజనతో నిలిపాం.
