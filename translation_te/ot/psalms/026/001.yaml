id: PSA.26.1
reference: Psalms 26:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לְ/דָוִ֨ד שָׁפְטֵ֤/נִי יְהוָ֗ה כִּֽי אֲ֭נִי בְּ/תֻמִּ֣/י הָלַ֑כְתִּי וּ/בַ/יהוָ֥ה בָּ֝טַ֗חְתִּי לֹ֣א אֶמְעָֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/001.yaml
  text: Of David[a]. Vindicate me, O Yahweh, for I have walked in my integrity, and I have trusted in Yahweh[c][b]; I will not slip.
translation:
  language: te
  text: 'దావీదుకు సంబంధించినది.[a]


    యహ్వే, నాకు న్యాయం తీర్చు[b];

    ఎందుకంటే నేను నా యథార్థతతో నడిచాను[c].

    యహ్వేను నమ్ముకున్నాను;

    నేను తడబడను.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దావీదుది,’ ‘దావీదు రచించినది,’ లేదా ‘దావీదు కోసం.’ హీబ్రూ పదబంధం కర్తృత్వాన్ని, సంబంధాన్ని, లేదా అంకితాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘నాకు తీర్పు తీర్చు.’ సందర్భంలో ఇది ‘నా పక్షంగా తీర్పు చెప్పు’ లేదా ‘నాకు న్యాయం చేయి’ అనే భావాన్ని ఇవ్వవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘నా నిష్కళంకతలో.’ హీబ్రూ పదం యథార్థతను, సంపూర్ణతను, లేదా నిందలేని ప్రవర్తనను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: d
    text: లేదా ‘నేను జారిపోను’ లేదా ‘నేను ఊగిసలాడను.’ హీబ్రూ రూపకం కాలు జారడం లేదా నిలకడ కోల్పోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: దావీదుకు సంబంధించినది
  rationale: వ్యక్తి పేరుతో కూడిన לְ అనే ఉపసర్గ కర్తృత్వాన్ని, సంబంధాన్ని, లేదా అంకితాన్ని సూచించవచ్చు. ఏ ఒక్క భావానికీ పరిమితం చేయకుండా మూలంలోని సందిగ్ధతను నిలుపుతుంది.
- source_word: שָׁפְטֵנִי
  choice: నాకు న్యాయం తీర్చు
  rationale: שׁפט యొక్క ప్రాథమిక భావం ‘తీర్పు తీర్చు’; ఇక్కడ కీర్తనకర్త తన యథార్థతను ఆధారంగా చేసుకొని తనకు అనుకూలంగా న్యాయనిర్ణయం చేయమని వేడుకుంటున్నాడు. తెలుగు న్యాయవిన్నప శైలిలో ‘నాకు న్యాయం తీర్చు’ ఈ రెండు కోణాలనూ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన నాలుగు హీబ్రూ అక్షరాలను బిరుదుతో భర్తీ చేయకుండా, వ్యక్తిగత నామంగా లిప్యంతరీకరించింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: కీర్తనకర్త చేసిన న్యాయవిన్నపానికి తరువాతి మాటలు కారణమని స్పష్టంగా సూచిస్తుంది.
- source_word: בְּתֻמִּי
  choice: నా యథార్థతతో
  rationale: תֹּם/תֻּמָּה సంపూర్ణత, నిష్కళంక ప్రవర్తన, యథార్థత అనే భావాలను కలిగి ఉంది. ‘యథార్థత’ పాపరహిత పరిపూర్ణతను అతిగా సూచించకుండా నైతిక సమగ్రతను తెలియజేస్తుంది.
- source_word: הָלַכְתִּי
  choice: నడిచాను
  rationale: జీవన ప్రవర్తనను ‘నడక’గా చెప్పే హీబ్రూ రూపకాన్ని తెలుగులో అర్థమయ్యే విధంగా నిలుపుతుంది.
- source_word: בָּטַחְתִּי
  choice: నమ్ముకున్నాను
  rationale: בטח సూచించే ఆధారపడిన విశ్వాసాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לֹא אֶמְעָד
  choice: నేను తడబడను
  rationale: מעד అంటే కాలు జారడం లేదా నిలకడ కోల్పోవడం. ‘తడబడను’ భౌతిక రూపకాన్నీ, స్థిరంగా ఉండే నమ్మకాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాక దైవనామమే ఉంది; అందువల్ల దానిని వ్యక్తిగత నామంగా లిప్యంతరీకరించడం మూలరూపాన్ని కాపాడుతుంది.
- issue: కీర్తనకర్త చెప్పుకున్న תֻם యొక్క భావం
  choice: యథార్థత
  alternative: నిష్కళంకత
  rationale: ఇది తన ప్రవర్తనలోని సమగ్రతను ఆధారంగా చేసుకున్న న్యాయవిన్నపం. సంపూర్ణ పాపరాహిత్యమనే భావాన్ని చేర్చకుండా మూలంలోని నైతిక వాదనను, దైవశాస్త్ర సంబంధమైన ఉద్రిక్తతను నిలుపుతుంది.
- issue: לֹא אֶמְעָד యొక్క కాలం మరియు ధోరణి
  choice: నేను తడబడను
  alternative: నేను తడబడలేదు
  rationale: హీబ్రూ అసంపూర్ణ క్రియ ఇక్కడ విశ్వాసం వల్ల కలిగే వర్తమాన-భవిష్యత్ ధైర్యాన్ని తెలియజేయగలదు. దానిని గతకాల వాదనగా పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రార్థనా శైలిని వాడింది. హీబ్రూ సమాంతర నిర్మాణాన్ని పంక్తులుగా నిలిపి, ‘నడిచాను,’ ‘తడబడను’ అనే రూపకాల్ని సంరక్షించింది. ‘యహ్వే’ను సాధారణ తెలుగు విభక్తి ప్రయోగానికి అనుగుణంగా ‘యహ్వేను’ అని ఉపయోగించింది.
