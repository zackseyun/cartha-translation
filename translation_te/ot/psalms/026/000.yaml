source:
  edition: WLC
  text: לְ/דָוִ֨ד שָׁפְטֵ֤/נִי יְהוָ֗ה כִּֽי אֲ֭נִי בְּ/תֻמִּ֣/י הָלַ֑כְתִּי וּ/בַ/יהוָ֥ה בָּ֝טַ֗חְתִּי לֹ֣א אֶמְעָֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/000.yaml
  text: Of David[a]. Judge me, Yahweh, for I have walked in my integrity, and I have trusted in Yahweh[c][b]; I will not slip.
translation:
  language: te
  text: 'దావీదుది[a].


    యెహోవా, నాకు న్యాయం తీర్చు[b];

    ఎందుకంటే నేను నా యథార్థతతో[c] నడుచుకున్నాను.

    నేను యెహోవాను నమ్ముకున్నాను;

    నేను తడబడను[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దావీదుచేత’, ‘దావీదుకు’ లేదా ‘దావీదుకు సంబంధించినది’ అని కూడా అర్థం కావచ్చు.
    reason: superscription_ambiguity
  - marker: b
    text: అక్షరార్థంగా ‘నాకు తీర్పు తీర్చు’; ఇక్కడ తనకు అనుకూలంగా న్యాయనిర్ణయం చేయమనే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘నా నిష్కపటతతో’ లేదా ‘నా నిందలేని నడవడిలో’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం సమగ్రత, యథార్థత, నిందలేని ప్రవర్తనను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: d
    text: ‘నేను తొట్రిల్లను’ లేదా ‘నేను చలించను’ అని కూడా అనువదించవచ్చు. హీబ్రూ రూపకం పాదం జారడం లేదా నిలకడ కోల్పోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: దావీదుది
  rationale: లְ ఉపసర్గ ఇక్కడ రచయితత్వం, సంబంధం లేదా అంకితాన్ని సూచించవచ్చు. సంక్షిప్త కీర్తన శీర్షికగా ‘దావీదుది’ సహజంగా ఉండి మూలంలోని సంబంధార్థాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: שָׁפְטֵנִי
  choice: నాకు న్యాయం తీర్చు
  rationale: సాధారణంగా ‘నాకు తీర్పు తీర్చు/నన్ను తీర్పు తీర్చు’ అని అర్థమైనా, ఈ సందర్భంలో తన నిర్దోషిత్వాన్ని పరిశీలించి అనుకూల న్యాయనిర్ణయం ఇవ్వమనే విజ్ఞప్తి ఉంది. అందువల్ల సహజమైన ‘నాకు న్యాయం తీర్చు’ ఎంచుకుని మూలార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: בְתֻמִּי
  choice: నా యథార్థతతో
  rationale: תֹּם సంపూర్ణత, నిష్కపటత, నిందలేని ప్రవర్తన అనే అర్థపరిధిని కలిగి ఉంది. ‘యథార్థత’ వ్యక్తిగత పరిపూర్ణతను అతిశయించకుండా నిజాయితీతో కూడిన సమగ్ర నడవడిని తెలియజేస్తుంది.
- source_word: לֹא אֶמְעָד
  choice: నేను తడబడను
  rationale: మూలంలోని పాదం జారడం లేదా నిలకడ కోల్పోవడం అనే రూపకాన్ని తెలుగులో సహజంగా నిలుపుతుంది; భవిష్య/దృఢనిశ్చయ భావాన్నీ కాపాడుతుంది.
theological_decisions:
- issue: కీర్తనకర్త తన యథార్థత ఆధారంగా న్యాయం కోరడం
  choice: ‘నా యథార్థతతో నడుచుకున్నాను’ అని మూలంలోని వాదనను యథాతథంగా ఉంచాం.
  alternative: దీనిని సంపూర్ణ పాపరాహిత్య ప్రకటనగా లేదా కేవలం ఒడంబడిక విశ్వాసంగా వివరణాత్మకంగా మార్చడం.
  rationale: ఈ వాక్యం కలిగించే నైతిక, ధార్మిక ఉద్వేగాన్ని అనువాదంలో ముందుగానే పరిష్కరించకుండా, మూలంలోని విస్తృతార్థ పదాన్ని నిలిపాం.
- issue: యెహోవాపై నమ్మకం మరియు తడబడకపోవడం మధ్య సంబంధం
  choice: రెండు స్వతంత్ర వాక్యఖండాలుగా, కారణసంబంధాన్ని అదనంగా చేర్చకుండా అనువదించాం.
  alternative: ‘కాబట్టి నేను తడబడను’ అని స్పష్టమైన ఫలితసంబంధం చేర్చడం.
  rationale: హీబ్రూ పాఠ్యంలో అనుసంధానం ఉన్నప్పటికీ ‘కాబట్టి’ అనే స్పష్టమైన కారణసూచక పదం లేదు; అందువల్ల అసలు వాక్యంలోని సంక్షిప్తత, ఉద్వేగం నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కీర్తన శైలిని పాటించాం. ‘యెహోవా’ అనే దైవనామాన్ని లిప్యంతరీకరించాం. పాద విభజన హీబ్రూ కవిత్వంలోని సమాంతరతను స్పష్టంగా చూపేలా ఉంది; అరుదైన లేదా మతశాఖాపరమైన పదజాలాన్ని నివారించాం.
