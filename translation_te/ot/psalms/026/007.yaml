    text: లేదా ‘కృతజ్ఞతా స్వరం వినబడేలా చేయడానికి.’ హెబ్రీ క్రియ కారణార్థకమైనది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నీ అద్భుతాలన్నిటినీ’ లేదా ‘నీ ఆశ్చర్యకరమైన కార్యాలన్నిటినీ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לַשְׁמִעַ
  choice: వినిపించడానికి
  rationale: హిఫీల్ క్రియారూపంలోని ‘వినేలా చేయడం/వినిపించడం’ అనే కారణార్థాన్ని సహజమైన తెలుగులో నేరుగా నిలుపుతుంది.
- source_word: בְּקוֹל
  choice: స్వరాన్ని
  rationale: קוֹל అనే స్పష్టమైన ‘స్వరం’ భావాన్ని నిలుపుతూ, לַשְׁמִעַతో కలిపి తెలుగులో సహజమైన ‘స్వరాన్ని వినిపించడం’ అనే నిర్మాణాన్ని ఇస్తుంది.
- source_word: תּוֹדָה
  choice: కృతజ్ఞతా
  rationale: ఈ సందర్భంలో పలికే లేదా పాడే కృతజ్ఞత భావాన్ని ‘స్తుతి’ అనే విస్తృత పదం కంటే నిర్దిష్టంగా తెలియజేస్తుంది.
- source_word: וּלְסַפֵּר
  choice: వివరించడానికి
  rationale: పీయేల్ రూపంలోని చెప్పడం, లెక్కపెట్టి వర్ణించడం అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כָּל
  choice: అన్నిటినీ
  rationale: హెబ్రీ పదంలోని సమగ్ర భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: נִפְלְאוֹתֶיךָ
  choice: నీ అద్భుత కార్యాలు
  rationale: దేవుని ఆశ్చర్యకరమైన క్రియలు లేదా కార్యాలు అనే సందర్భోచిత భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
