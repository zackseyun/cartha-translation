translation:
  language: te
  text: 'కృతజ్ఞతా స్వరాన్ని వినిపించడానికి[a],

    మరియు నీ అద్భుత కార్యాలన్నిటినీ వివరించి చెప్పడానికి[b].'
  philosophy: optimal-equivalence
  footnotes:
