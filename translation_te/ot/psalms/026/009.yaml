source:
  edition: WLC
  text: אַל תֶּאֱסֹ֣ף עִם חַטָּאִ֣ים נַפְשִׁ֑/י וְ/עִם אַנְשֵׁ֖י דָמִ֣ים חַיָּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/009.yaml
  text: Do not gather my soul with sinners[b][a], nor my life with men of bloodshed.
translation:
  language: te
  text: 'పాపులతో కలిసి నా ప్రాణాన్ని చేర్చకు[a];

    రక్తపాతులైన వారితో కలిసి నా జీవితాన్ని చేర్చకు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పాపులతో కలిసి నా ప్రాణాన్ని కూడదీయకు.” ఈ క్రియ తీర్పులో దుష్టులతో కలిపి తీసుకుపోవడం అనే భావాన్నీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: మూలంలో అక్షరార్థంగా “రక్తాల మనుషులు”; ఇది హింసాత్మకులైన లేదా రక్తదోషులైన వారిని సూచించే హెబ్రీయ భాషీయం.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּאֱסֹף
  choice: తీసివేయకు
  rationale: אָסַף అనే క్రియకు ప్రాథమికంగా ‘పోగుచేయు/సమకూర్చు’ అనే అర్థం ఉన్నా, తీర్పు సందర్భంలో ఇతరులతో కలిపి ప్రాణాన్ని తీసివేయడం అనే భావం కలుగుతుంది. సహజమైన తెలుగులో సందర్భార్థాన్ని అందించడానికి ‘తీసివేయకు’ అని అనువదించాం; మూలంలోని ‘పోగుచేయు’ రూపకాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: נַפְשִׁי
  choice: నా ప్రాణాన్ని
  rationale: נֶפֶשׁ ఇక్కడ వ్యక్తి ప్రాణం/జీవం/తనను సూచించగలదు. חַיָּיతో ఉన్న సమాంతరతలో పదభేదాన్ని నిలుపుతూ, తెలుగులో అనవసరమైన శరీర–ఆత్మ సిద్ధాంతార్థం రాకుండా ‘నా ప్రాణాన్ని’ ఎంచుకున్నాం.
- source_word: חַטָּאִים
  choice: పాపులతో
  rationale: పాప స్వభావం లేదా పాపకార్యాలతో గుర్తింపబడే వారిని సూచించే నామవాచకానికి ‘పాపులు’ సంక్షిప్తమైన, సహజమైన సమానం.
- source_word: אַנְשֵׁי דָמִים
  choice: రక్తపాతానికి పాల్పడేవారితో
  rationale: అక్షరార్థంగా ‘రక్తాల మనుషులు’ అనే హెబ్రీయ భాషీయం హింసాత్మకులనూ రక్తదోషులనూ సూచిస్తుంది. ‘రక్తపాతానికి పాల్పడేవారు’ ఆ పరిధిని ‘హంతకులు’ అని అతిగా సంకుచితం చేయకుండా సహజంగా తెలియజేస్తుంది.
- source_word: חַיָּי
  choice: నా జీవితాన్ని
  rationale: נַפְשִׁיకి సమాంతరంగా חַיָּי ‘నా జీవితం’ అని అర్థమిస్తుంది. ‘ప్రాణం’ మరియు ‘జీవితం’ అనే రెండు దగ్గరి కాని వేర్వేరు కవితా పదాలను నిలిపాం.
- source_word: אַל
  choice: తీసివేయకు
  rationale: అసంపూర్ణ క్రియారూపంతో אַל ప్రతికూల విన్నపాన్ని వ్యక్తం చేస్తుంది. తెలుగులో ‘చేయకు’ రూపం ప్రార్థనలో సహజంగా ఉంటుంది.
theological_decisions:
- issue: נַפְשִׁי మరియు חַיָּיలోని మానవశాస్త్ర సంబంధ సూక్ష్మత
  choice: ‘నా ప్రాణం’, ‘నా జీవితం’ అనే వేర్వేరు కవితా పదాలను నిలుపుకోవడం.
  alternative: ‘నన్ను’, ‘నా జీవితాన్ని’ అని మరింత సాధారణీకరించడం లేదా రెండింటినీ దాదాపు ఒకే పదంతో అనువదించడం.
  rationale: ఈ వాక్యం సాంకేతికమైన శరీర–ఆత్మ ద్వైత సిద్ధాంతాన్ని నిర్దేశించదు. అయినా మూలంలో పరస్పర సంబంధమున్న రెండు వేర్వేరు పదాలు సమాంతరంగా ఉన్నాయి; వాటి భేదాన్ని నిలపడం మూలంలోని కవితా బరువును కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రార్థనా శైలిని వాడాం. మొదటి పాదంలోని క్రియ రెండో పాదంలో మూలంలో అంతర్లీనంగా ఉన్నప్పటికీ, తెలుగులో స్పష్టత మరియు సహజ సమాంతరత కోసం దాన్ని పునరుక్తం చేశాం. ‘మగవారు/మనుషులు’ అని లింగాన్ని ముందుకు తేవకుండా, హెబ్రీయ భాషీయ భావాన్ని ‘పాల్పడేవారు’ ద్వారా అందించాం.
