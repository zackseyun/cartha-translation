id: PSA.26.11
reference: Psalms 26:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֭/אֲנִי בְּ/תֻמִּ֥/י אֵלֵ֗ךְ פְּדֵ֣/נִי וְ/חָנֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/011.yaml
  text: But as for me[a], I will walk in my integrity[b]; redeem me and be gracious to me.
translation:
  language: te
  text: 'కాని నేనైతే నా యథార్థతలో[a] నడుస్తాను;

    నన్ను విమోచించు, నాపై కృప చూపు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా నిష్కళంకతలో’; లేదా ‘నా నిర్దోషిత్వంలో.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నాపై దయ చూపు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: కాని నేనైతే
  rationale: సంయోజక అవ్యయం, స్వతంత్ర సర్వనామం కలిసి సందర్భంలోని వ్యత్యాసాన్నీ, ‘నేను’పై ఉన్న ఉద్ఘాటననూ సూచిస్తున్నాయి.
- source_word: בְּתֻמִּי
  choice: నా యథార్థతలో
  rationale: תֹּם/תֻּם నైతిక సమగ్రత, నిష్కళంకత, నిర్దోషిత్వం వంటి భావాలను కలిగి ఉంది. ‘యథార్థత’ సంపూర్ణ పాపరాహిత్యాన్ని అతిశయంగా సూచించకుండా, కీర్తనకర్త చెప్పే నైతిక నిబద్ధతను సహజంగా తెలియజేస్తుంది; ב ఉపసర్గ భావాన్ని ‘లో’తో నిలిపింది.
- source_word: אֵלֵךְ
  choice: నడుస్తాను
  rationale: הלך ఇక్కడ జీవన ప్రవర్తనకు రూపకంగా వాడబడింది. ‘నడుస్తాను’ ఆ హీబ్రూ రూపకాన్ని నిలుపుతూ నిరంతర జీవన విధానాన్ని సహజంగా సూచిస్తుంది.
- source_word: פְּדֵנִי
  choice: నన్ను విమోచించు
  rationale: פדה కష్టస్థితి లేదా బంధం నుంచి వెల చెల్లించి విడిపించడం/విమోచించడం అనే భావాన్ని కలిగి ఉంది. ‘విమోచించు’ సాధారణమైన ‘విడిపించు’కన్నా మూలపదపు గాఢతను నిలుపుతుంది.
- source_word: וְחָנֵּנִי
  choice: నాపై కృప చూపు
  rationale: חנן అనుగ్రహం లేదా దయాపూర్వక ఆదరణ చూపడాన్ని సూచిస్తుంది. ‘కృప చూపు’ మూలంలోని gracious favor భావాన్ని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: కీర్తనకర్త తన תֻם గురించి చేస్తున్న ప్రకటన యొక్క భావం
  choice: ‘నా యథార్థతలో’—నైతిక సమగ్రతతో, నిబద్ధతతో జీవించడం
  alternative: ‘నా నిష్కళంకతలో’ లేదా ‘నా నిర్దోషిత్వంలో’ అనే మరింత బలమైన వాదన
  rationale: సందర్భంలో కీర్తనకర్త దుష్టుల ప్రవర్తనకు భిన్నంగా తన జీవన విధానాన్ని చూపుతూ, అదే సమయంలో విమోచననూ కృపనూ అడుగుతున్నాడు. ‘యథార్థత’ సానుకూల నైతిక వాదనను నిలుపుతుంది; అయితే సంపూర్ణ పాపరాహిత్య సిద్ధాంతాన్ని వచనంలోకి చొప్పించదు. ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచడం మూలంలోని భావ విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన కీర్తన శైలిని ఉపయోగించాం. హీబ్రూలోని ‘నడుచుట’ రూపకాన్ని నిలిపి, ఆజ్ఞార్థక ప్రార్థనల సంక్షిప్తతను కాపాడాం.
