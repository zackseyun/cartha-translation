  text: I hate the assembly of evildoers[a], and I will not sit with the wicked.
translation:
  language: te
  text: కీడు చేసేవారి సమూహాన్ని నేను ద్వేషిస్తాను[a]; దుష్టులతో కలిసి నేను కూర్చోను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కీడు చేసేవారి సమూహాన్ని నేను ద్వేషించాను.’ హీబ్రూ సంపూర్ణ క్రియారూపాన్ని గతకాల చర్యగా అనువదించవచ్చు; అయితే ఇక్కడ అది కీర్తనకర్త స్థిరమైన వైఖరిని సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: నేను ద్వేషిస్తాను
  rationale: שׂנא అనే క్రియ యొక్క Qal perfect మొదటి పురుష ఏకవచన రూపం. ఈ కవితా సందర్భంలో ఇది కీర్తనకర్తకు స్థిరంగా ఉన్న వైఖరిని తెలియజేస్తుంది; అందువల్ల సహజమైన తెలుగు వర్తమాన రూపం ఎంచుకోబడింది. భూతార్థమైన ‘నేను ద్వేషించాను’ కూడా వ్యాకరణపరంగా సాధ్యమే.
- source_word: קְהַל
  choice: సమూహాన్ని
  rationale: ఈ పదం కూడిన జనసమూహాన్ని సూచిస్తుంది. ‘సభ’ అనేది ఆరాధన లేదా అధికారిక సమావేశం అనే అదనపు భావాన్ని కలిగించవచ్చు; ‘సమూహం’ ఇక్కడ తటస్థంగా, సహజంగా ఉంది.
- source_word: מְרֵעִים
  choice: కీడు చేసేవారి
  rationale: רעע నుండి వచ్చిన కృదంతం నామవాచకంగా వాడబడి, కీడు చేయడం చేత గుర్తింపబడే వ్యక్తులను సూచిస్తుంది. తెలుగు వాడుకలో ‘కీడు చేసేవారు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: וְ/עִם
  choice: దుష్టులతో కలిసి
  rationale: సంయోజక అవ్యయం మరియు ‘తో’ అనే సంబంధార్థక పూర్వప్రత్యయం రెండవ పాదాన్ని మొదటిదానితో కలుపుతున్నాయి. ‘కలిసి’ అనేది సహవాస భావాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: רְשָׁעִים
  choice: దుష్టులతో
  rationale: ఈ నామవాచక విశేషణం నైతికంగా దుష్టులైన వారిని సూచిస్తుంది. ‘దుష్టులు’ సంక్షిప్తంగా ఉండి, మొదటి పాదంలోని ‘కీడు చేసేవారు’తో కవితా సమాంతరతను నిలుపుతుంది.
- source_word: לֹא אֵשֵׁב
  choice: నేను కూర్చోను
  rationale: నిషేధంతో ఉన్న ישב క్రియ యొక్క imperfect మొదటి పురుష ఏకవచన రూపం. ఇది కేవలం భవిష్యత్తును కాక, స్థిరమైన నిరాకరణ లేదా సంకల్పాన్ని వ్యక్తం చేస్తుంది. ‘కూర్చోను’ మూలంలోని దృశ్యరూపాన్నీ తెలుగు భాషలోని సంకల్ప భావాన్నీ నిలుపుతుంది.
