  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన కవితా శైలి. రెండు పాదాల సమాంతరతను, ‘కూర్చోవడం’ అనే మూల దృశ్యాన్ని నిలుపుతూ సహవాసాన్ని సూచించేందుకు ‘కలిసి’ వాడబడింది.
