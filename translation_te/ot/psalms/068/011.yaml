  source_fidelity: అֹמֶרకు ‘ఆజ్ఞ’ సాధ్యమైన సందర్భార్థం అయినప్పటికీ, మూలపదం ప్రధానంగా పలుకు/మాట/సందేశం అనే విస్తృతార్థాన్ని కలిగి ఉంది. ఈ వచనంలో దానిని ప్రధాన పాఠ్యంలో ‘ఆజ్ఞ’గా నిర్దిష్టీకరించడం అవసరానికి మించిన అర్థసంకుచితం. ‘సందేశం’ మూలంలోని విస్తృతతను కాపాడుతూ ఆధునిక తెలుగులో సహజంగా ఉంది. స్త్రీలింగ బహువచనమైన הַמְבַשְּׂרוֹתను స్పష్టంగా స్త్రీలుగా అనువదించడం, అలాగే צָבָא רָבను పెద్ద సమూహంగా అనువదించడం పాఠ్యనిష్ఠంగా ఉన్నాయి.
