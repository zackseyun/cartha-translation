  text: The Lord gives the word[c][b][a]; the women who announce the good news are a great host.
translation:
  language: te
  text: ప్రభువు సందేశాన్ని ఇస్తాడు[a]; శుభవార్త ప్రకటించే స్త్రీలు[b] గొప్ప సమూహం[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మాటను,’ ‘ఆజ్ఞను.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘శుభవార్త ప్రకటించే స్త్రీలు’ అనే పదం స్త్రీలింగ బహువచనంలో ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘గొప్ప సైన్యం,’ ‘పెద్ద సమూహం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: ప్రభువు
  rationale: ఇక్కడ ఇది దేవునికి వాడిన బిరుదు. ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన రూపం ‘ప్రభువు’.
- source_word: יִתֶּן
  choice: ఇస్తాడు
  rationale: ఈ కవితా వాక్యంలో యిక్టోల్ రూపాన్ని వర్తమానార్థక ప్రకటనగా తీసుకోవడం సహజం; భవిష్యత్ భావం కూడా వ్యాకరణపరంగా సాధ్యమే.
- source_word: אֹמֶר
  choice: ఆజ్ఞను
  rationale: ఈ పదానికి మాట, సందేశం, ఆజ్ఞ అనే అర్థాలు సాధ్యం. తదుపరి పాదంలోని ప్రకటనకు దారితీసే ప్రభువు పలుకుగా ‘ఆజ్ఞ’ సందర్భానికి సరిపోతుంది; ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఉంచాం.
- source_word: הַמְבַשְּׂרוֹת
  choice: శుభవార్త ప్రకటించే స్త్రీలు
  rationale: హీబ్రూ క్రియావిశేషణ రూపం స్త్రీలింగ బహువచనం; అందువల్ల లింగ సూచనను తటస్థీకరించకుండా స్పష్టంగా నిలిపాం.
- source_word: צָבָא רָב
  choice: గొప్ప సమూహం
  rationale: צָבָאకు సైన్యం, దండు, సమూహం అనే భావాలు ఉన్నాయి; ఇక్కడ ప్రకటించే స్త్రీల పెద్ద సంఖ్యను సహజ తెలుగులో తెలియజేయడానికి ‘గొప్ప సమూహం’ ఎంచుకున్నాం. సైనిక ప్రతిమ సాధ్యమని పాదటిప్పణిలో నిలిపాం.
theological_decisions:
- issue: הַמְבַשְּׂרוֹת అనే స్త్రీలింగ బహువచన రూపం
  choice: ‘శుభవార్త ప్రకటించే స్త్రీలు’ అని స్పష్టంగా అనువదించడం
  alternative: ‘శుభవార్త ప్రకటించేవారు’ అని లింగతటస్థంగా అనువదించడం
  rationale: మూలపాఠంలో వ్యాకరణ లింగం స్పష్టంగా ఉంది. దానిని నిలపడం పాఠ్యనిష్ఠమైన నిర్ణయం; దీనికి మించిన సిద్ధాంతపరమైన భావాన్ని జోడించలేదు.
- issue: אֹמֶר యొక్క భావం
  choice: ఆజ్ఞ
  alternative: మాట లేదా సందేశం
  rationale: కీర్తన సందర్భంలోని విజయప్రకటనకు కారణమైన దైవిక పలుకుగా ‘ఆజ్ఞ’ సరిపోతుంది; అయితే మూలపదంలోని విస్తృతార్థం వల్ల ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ కీర్తనా కవిత్వానికి తగిన గౌరవప్రదమైన శైలిని వాడాం. స్త్రీలింగ సూచనను స్పష్టంగా నిలిపి, אֹמֶר మరియు צָבָא పదాల నిజమైన అర్థవిస్తృతిని పాదటిప్పణుల్లో భద్రపరిచాం.
