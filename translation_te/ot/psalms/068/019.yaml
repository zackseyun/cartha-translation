source:
  edition: WLC
  text: בָּ֤ר֣וּךְ אֲדֹנָ/י֮ י֤וֹם י֥וֹם יַֽעֲמָס לָ֗/נוּ הָ֘/אֵ֤ל יְֽשׁוּעָתֵ֬/נוּ סֶֽלָה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/019.yaml
  text: Blessed be the Lord[a], who day by day bears us up—God is our salvation. Selah
translation:
  language: te
  text: రోజురోజూ మనకొరకు మోసే[a] ప్రభువు స్తుతింపబడుగాక—దేవుడు మన రక్షణ. సెలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రోజురోజూ మన భారాన్ని మోసే”; సంప్రదాయంగా, “రోజురోజూ మనకు మేలులతో భారం మోపే.” హీబ్రూ క్రియకు ‘భారం మోపు’ లేదా ‘మోయు’ అనే అర్థం ఉంది; అయితే మోయబడేది లేదా మోపబడేది ఏమిటో మూలపాఠం స్పష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרוּךְ
  choice: స్తుతింపబడుగాక
  rationale: దైవాన్ని స్తుతిస్తూ పలికే ఆశీర్వాద సూత్రంలోని కర్మణి భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֲדֹנָי
  choice: ప్రభువు
  rationale: దైవాధికారాన్ని సూచించే ఈ బిరుదుకు సాధారణంగా అర్థమయ్యే ప్రామాణిక తెలుగు రూపం.
- source_word: יוֹם יוֹם
  choice: రోజురోజూ
  rationale: హీబ్రూలోని పదపునరుక్తిని, నిరంతరమైన దినదిన సహాయ భావాన్ని నిలుపుతుంది.
- source_word: יַעֲמָס לָנוּ
  choice: మనలను మోసే
  rationale: עמס అనే క్రియలోని మోయడం/భారం భరించడం అనే మూలచిత్రాన్ని నిలుపుతూ, తెలుగులో సహజంగా దేవుని నిరంతర ఆదరణను తెలియజేస్తుంది. హీబ్రూ వాక్యంలో మోయబడే వస్తువు స్పష్టంగా చెప్పబడనందున ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
- source_word: הָאֵל
  choice: దేవుడే
  rationale: నిర్దిష్టతను, వాక్యంలోని బలమైన నిర్ధారణను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְשׁוּעָתֵנוּ
  choice: మన రక్షణ
  rationale: విడుదల, కాపుదల, రక్షించే సహాయం అనే విస్తృత భావాలను కలిగి ఉండే సమానార్థక రూపం.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఈ పదం యొక్క ఖచ్చితమైన కార్యం అనిశ్చితమైనందున అర్థాన్ని ఊహించి అనువదించకుండా సంప్రదాయ లిప్యంతరీకరణను నిలిపాం.
theological_decisions:
- issue: יַעֲמָס לָנוּ అనే సంక్షిప్త పదబంధం యొక్క అర్థం
  choice: దేవుడు రోజురోజూ తన ప్రజలను మోస్తూ ఆదరిస్తాడని ప్రధాన పాఠంలో వ్యక్తపరచడం
  alternative: దేవుడు మన భారాన్ని మోస్తాడు; లేదా ప్రతిరోజూ మనకు మేలులతో భారం మోపుతాడు
  rationale: క్రియకు ‘భారం మోపు/మోయు’ అనే ప్రాథమిక భావం ఉంది; అయితే దాని కర్మ హీబ్రూలో స్పష్టంగా లేదు. ‘మేలులతో నింపుతాడు’ అనడం మూలపాఠంలో లేని కర్మను చేర్చుతుంది. ప్రధాన పాఠం సందర్భానుసారంగా దేవుని ఆదరణను వ్యక్తపరుస్తుంది; నిజమైన పాఠ్య అస్పష్టతను పాదసూచిక కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, కీర్తనకు తగిన గౌరవప్రదమైన స్తుతి శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని సంక్షిప్తత వల్ల కలిగే అస్పష్టతను ప్రధాన పాఠంలో అతిగా విస్తరించకుండా పాదసూచికలో భద్రపరచాం.
