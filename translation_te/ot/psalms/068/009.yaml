source:
  edition: WLC
  text: גֶּ֣שֶׁם נְ֭דָבוֹת תָּנִ֣יף אֱלֹהִ֑ים נַחֲלָתְ/ךָ֥ וְ֝/נִלְאָ֗ה אַתָּ֥ה כֽוֹנַנְתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/009.yaml
  text: You sent abundant rain[a], O God; when your inheritance was weary[b], you established it.
translation:
  language: te
  text: దేవా, నీవు సమృద్ధిగా వర్షాన్ని కురిపించావు[a]; నీ స్వాస్థ్యం అలసిపోయినప్పుడు[b], దానిని స్థిరపరిచావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఉదారమైన వర్షాన్ని’; హీబ్రూ పదబంధం దేవుడు విస్తారంగా అనుగ్రహించడాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నీ స్వాస్థ్యం’ అనేది దేవుని ప్రజలను, దేశాన్ని, లేదా కావ్యరీతిలో రెండింటినీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: גֶּשֶׁם נְדָבוֹת
  choice: సమృద్ధిగా వర్షం
  rationale: నామవాచకానికి ‘వర్షం’ సహజమైన అర్థం. נְדָבוֹת స్వచ్ఛందత లేదా ఉదారతతో సంబంధమున్నా, ఈ పదబంధంలో దేవుని విస్తారమైన అనుగ్రహాన్ని సూచిస్తుంది; అందువల్ల ‘సమృద్ధిగా’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: תָּנִיף
  choice: కురిపించావు
  rationale: נוּף హిఫిల్ రూపం ఊపడం లేదా కదిలించడం అనే మూలభావాన్ని కలిగి ఉంది; వర్షంతో కూడిన ఈ సందర్భంలో వర్షాన్ని కురిపించడం అనే భావం సహజం. ‘కురిపించావు’ దైవిక కార్యసాధకత్వాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ఇది ప్రత్యక్ష సంబోధన; ‘దేవా’ ఆధునిక తెలుగులో సహజమైన, గౌరవప్రదమైన కావ్య సంబోధన.
- source_word: נַחֲלָתְךָ
  choice: నీ స్వాస్థ్యం
  rationale: ఈ పదం వారసత్వంగా లేదా వాటాగా లభించిన స్వాధీనాన్ని సూచిస్తుంది. ప్రజలను, దేశాన్ని, లేదా రెండింటినీ సూచించే కావ్య విస్తృతిని ‘స్వాస్థ్యం’ నిలుపుతుంది.
- source_word: וְנִלְאָה
  choice: అలసిపోయినప్పుడు
  rationale: స్త్రీలింగ ఏకవచన రూపం ‘స్వాస్థ్యం’తో అన్వయించి అలసట లేదా క్షీణత స్థితిని తెలియజేస్తుంది. సందర్భంలోని సంబంధాన్ని సహజ తెలుగులో కాలార్థకంగా వ్యక్తం చేశాం.
- source_word: כּוֹנַנְתָּהּ
  choice: దానిని స్థిరపరిచావు
  rationale: כּוּן క్రియ స్థిరపరచడం, దృఢపరచడం, సక్రమంగా నిలబెట్టడం అనే భావాలను ఇస్తుంది. ‘స్థిరపరిచావు’ భూమి లేదా ప్రజలు అనే రెండు సాధ్యమైన సూచనలకూ సరిపోతుంది.
theological_decisions:
- issue: ‘నీ స్వాస్థ్యం’ దేనిని సూచిస్తుంది?
  choice: ప్రజలా, దేశమా అని నిర్దిష్టం చేయకుండా ‘నీ స్వాస్థ్యం’ అని ఉంచడం
  alternative: ఇశ్రాయేలు దేశం; ఇశ్రాయేలు ప్రజలు; దేవునికి చెందిన వాటా మొత్తంగా
  rationale: హీబ్రూ కావ్యప్రయోగం దేవుని ప్రజలను, దేశాన్ని, లేదా రెండింటినీ కలిపి సూచించవచ్చు. ఒకే సూచనను నిర్ణయించకుండా మూలంలోని ఉద్దేశపూర్వక విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కావ్యశైలిని ఉపయోగించాం. ‘స్వాస్థ్యం’ మూలపదంలోని నిబంధనాత్మక మరియు కావ్య విస్తృతిని నిలుపుతుంది; పాదాన్ని సాధారణ పాఠకులకు అర్థమయ్యేలా వాక్యనిర్మాణం సహజీకరించాం.
