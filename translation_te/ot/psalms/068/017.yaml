source:
  edition: WLC
  text: רֶ֤כֶב אֱלֹהִ֗ים רִבֹּתַ֣יִם אַלְפֵ֣י שִׁנְאָ֑ן אֲדֹנָ֥/י בָ֝֗/ם סִינַ֥י בַּ/קֹּֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/017.yaml
  text: The chariots of God are myriads[a], thousands upon thousands; the Lord is among them[c][b], Sinai in holiness.
translation:
  language: te
  text: 'దేవుని రథాలు పదివేలకొలది[a], వేలవేలు;

    ప్రభువు వాటి మధ్య ఉన్నాడు—సీనాయి, పరిశుద్ధతలో.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘రెండు పదివేలు’ అని కూడా అర్థమివ్వవచ్చు; ఇక్కడ అది అపారమైన పెద్ద సంఖ్యను సూచించే కవితాత్మక ప్రయోగంగా కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ హీబ్రూ వాక్యభాగం అత్యంత సంక్షిప్తమైనది, అర్థనిర్ణయం కష్టమైనది. ‘ప్రభువు వాటి మధ్య ఉన్నాడు—సీనాయి వద్ద ఉన్నట్లుగా, పరిశుద్ధతలో’ లేదా ‘ప్రభువు సీనాయి నుండి పరిశుద్ధ స్థలానికి వచ్చాడు’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: רֶכֶב אֱלֹהִים
  choice: దేవుని రథాలు
  rationale: רֶכֶב ఇక్కడ సమూహార్థంగా రథాలను లేదా రథసేనను సూచిస్తుంది. తెలుగు పాఠకులకు సహజంగా ఉండేలా, మూలంలోని దృశ్యరూపాన్ని నిలుపుతూ ‘దేవుని రథాలు’ అని అనువదించాం.
- source_word: רִבֹּתַיִם
  choice: లక్షలకొలది
  rationale: ఈ ద్వివచన రూపం అక్షరార్థంగా ‘రెండు పదివేలు’ అని సూచించగలిగినా, కవిత్వంలో అపారమైన పెద్ద సంఖ్యను వ్యక్తం చేస్తుంది. ‘లక్షలకొలది’ తెలుగు కవితాత్మక వాడుకలో విస్తార సంఖ్యను సహజంగా తెలియజేస్తుంది; ఖచ్చిత గణనగా చదవనవసరం లేదని పాదసూచిక స్పష్టం చేస్తుంది.
- source_word: אַלְפֵי שִׁנְאָן
  choice: వేలవేలు
  rationale: שִׁנְאָן అరుదైన, అర్థనిర్ణయం కష్టమైన పదం. పునరావృతం లేదా బహుళత్వం అనే సాధ్యమైన భావాన్ని ‘వేలవేలు’ సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: אֲדֹנָי
  choice: ప్రభువు
  rationale: దైవాధిపత్యాన్ని సూచించే אֲדֹנָי అనే బిరుదుకు ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన సాధారణ సమానార్థకం ‘ప్రభువు’.
- source_word: בָם
  choice: వాటి మధ్య
  rationale: בָם అనేది ‘వాటిలో/వాటి మధ్య/వాటితో’ అని అర్థమివ్వగలదు. రథసమూహం సందర్భంలో ‘వాటి మధ్య’ అత్యంత సహజమైనది.
- source_word: סִינַי
  choice: సీనాయి
  rationale: స్థలనామాన్ని తెలుగులో స్థిరపడిన రూపమైన ‘సీనాయి’గా లిప్యంతరీకరించాం.
- source_word: בַּקֹּדֶשׁ
  choice: పరిశుద్ధతలో
  rationale: קֹדֶשׁ ‘పరిశుద్ధత’ అనే అమూర్త భావాన్నీ, ‘పరిశుద్ధ స్థలం/ఆలయం’ అనే స్థలార్థాన్నీ సూచించగలదు. మూలంలోని సంక్షిప్తతను, సందిగ్ధతను నిలుపుటకు ప్రధాన పాఠంలో అమూర్తార్థాన్ని ఎంచుకున్నాం.
theological_decisions:
- issue: אֲדֹנָי בָם סִינַי בַּקֹּדֶשׁ అనే సంక్షిప్త వాక్యభాగపు అన్వయం
  choice: ప్రభువు వాటి మధ్య ఉన్నాడు—పరిశుద్ధతలో సీనాయి
  alternative: ప్రభువు వాటి మధ్య, సీనాయిలో ఉన్నట్లుగా, పరిశుద్ధతలో ఉన్నాడు; లేదా ప్రభువు సీనాయి నుండి పరిశుద్ధ స్థలంలోకి వచ్చాడు
  rationale: హీబ్రూ వాక్యం అత్యంత సంక్షిప్తంగా ఉండి పదాల పరస్పర సంబంధాన్ని స్పష్టంగా చెప్పదు. ‘సీనాయిలో ఉన్నట్లుగా’ అనే పోలికనుగానీ, ‘నుండి…లోకి వచ్చాడు’ అనే గమనాన్నిగానీ ప్రధాన పాఠంలో చేర్చితే మూలంలో లేని సంబంధాన్ని నిర్ణయించినట్లవుతుంది. అందువల్ల కవితాత్మక ఉద్వేగాన్ని నిలిపి, ప్రధాన ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన సంక్షిప్త, గౌరవప్రద కవితాత్మక శైలి. అరుదైన సంఖ్యాపదానికి సహజ తెలుగు రూపాన్ని వాడి పాదసూచికలో అక్షరార్థాన్ని తెలిపాం. చివరి వాక్యభాగంలోని ఉద్దేశపూర్వక హీబ్రూ సందిగ్ధతను పూర్తిగా పరిష్కరించకుండా నిలిపాం.
