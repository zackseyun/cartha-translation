  variant: modern standard Telugu
source:
  edition: WLC
  text: כְּ/הִנְדֹּ֥ף עָשָׁ֗ן תִּ֫נְדֹּ֥ף כְּ/הִמֵּ֣ס דּ֭וֹנַג מִ/פְּנֵי אֵ֑שׁ יֹאבְד֥וּ רְ֝שָׁעִ֗ים מִ/פְּנֵ֥י אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/002.yaml
  text: As smoke is driven away[a], so you drive them away; as wax melts before fire[c][b], so the wicked perish before God.
translation:
  language: te
  text: పొగ చెదరగొట్టబడినట్లు[a], నీవు వారిని చెదరగొడతావు; అగ్ని ముందు మైనం కరిగినట్లు[b], దుష్టులు దేవుని సన్నిధిలో నశిస్తారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చెదరగొట్టబడినట్లు’ అనే చోట ‘కొట్టుకుపోయినట్లు’ లేదా ‘చెల్లాచెదరైనట్లు’ అని కూడా అనువదించవచ్చు; హీబ్రూ క్రియలో తరిమివేయబడడం, చెదరిపోవడం, గాలికి కొట్టుకుపోవడం అనే భావాలు ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: ‘అగ్ని ముందు,’ ‘దేవుని సన్నిధిలో’ అనే పదబంధాలకు హీబ్రూలో అక్షరార్థం ‘అగ్ని ముఖం ఎదుటనుండి,’ ‘దేవుని ముఖం ఎదుటనుండి’; ఈ ప్రయోగం సమక్షంలో ఉండడం లేదా ఆ సాన్నిధ్యం వల్ల కలిగే ఫలితాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ క్రియారూపాలను ‘చెదరగొడతావు ... నశిస్తారు’ అనే సాధారణ వర్ణనగా, ‘చెదరగొడతావు ... నశిస్తారు’ అనే భవిష్యదర్థంగా, లేదా సందర్భంలో ‘చెదరగొట్టుము ... నశించుగాక’ అనే కోరికగా కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּ/הִנְדֹּף עָשָׁן
  choice: పొగ చెదరగొట్టబడినట్లు
  rationale: כְּ పోలికను సూచిస్తుంది; נדף పొగ గాలికి కొట్టుకుపోవడం, చెదరిపోవడం అనే భావాన్ని ఇస్తుంది. తెలుగు కవితా ప్రయోగంలో ఈ రూపం సహజంగా ఉండి కర్మణి భావాన్ని నిలుపుతుంది.
- source_word: תִּנְדֹּף
  choice: నీవు వారిని చెదరగొడతావు
  rationale: ఇది దేవుణ్ణి నేరుగా సంబోధించే ద్వితీయ పురుష ఏకవచన క్రియ. హీబ్రూలో కర్మ స్పష్టంగా లేకపోయినా, ముందరి వచనంలోని శత్రువులు మరియు తరువాతి సమాంతర పాదంలోని దుష్టులు ఉద్దేశించబడ్డారని సందర్భం సూచిస్తుంది; అందువల్ల ‘వారిని’ చేర్చబడింది.
- source_word: כְּ/הִמֵּס דּוֹנַג
  choice: మైనం కరిగినట్లు
  rationale: כְּ తో కూడిన క్రియానామ రూపం పోలికను పరిచయం చేస్తుంది. דּוֹנַג కు సాధారణ అర్థం ‘మైనం’; సహజమైన తెలుగు వాక్య నిర్మాణం కోసం పరిమిత క్రియారూపం వాడబడింది.
- source_word: מִ/פְּנֵי אֵשׁ
  choice: అగ్ని ముందు
  rationale: מִפְּנֵי అక్షరార్థంగా ‘ముఖం ఎదుటనుండి/సన్నిధి వల్ల’ అనే భావాన్ని కలిగి ఉంది. మైనం అగ్ని సమక్షంలో కరగడమనే చిత్రాన్ని ‘అగ్ని ముందు’ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: יֹאבְדוּ
  choice: నశిస్తారు
  rationale: אבד క్రియకు ‘నశించు, అంతరించు’ అనే భావం ఉంది. నాశనం జరిగే విధానాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా కవితా సమాంతరతను ఈ పదం కాపాడుతుంది.
- source_word: רְשָׁעִים
  choice: దుష్టులు
  rationale: ఈ విశేషణం నామవాచకంగా వాడబడి దుష్టులైన వ్యక్తులను సూచిస్తుంది. ‘దుష్టులు’ ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, సుపరిచితమైన సమానార్థకం.
- source_word: מִ/פְּנֵי אֱלֹהִים
  choice: దేవుని సన్నిధిలో
  rationale: మూలంలోని ‘దేవుని ముఖం/సన్నిధి ఎదుట’ అనే సాన్నిధ్య భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: కవితా సందర్భంలో అసంపూర్ణ క్రియారూపాల కాలం మరియు భావం
  choice: సాధారణ వర్తమానాన్ని లేదా నిశ్చిత భవిష్యత్తును తెలుగులో సందర్భానుసారంగా మోయగల ‘చెదరగొడతావు ... నశిస్తారు’ అనే రూపాలు
  alternative: ‘చెదరగొట్టుము ... నశించుగాక’ అనే కోరిక/ప్రార్థనా భావం, లేదా స్పష్టమైన భవిష్యదర్థం
  rationale: హీబ్రూ imperfect రూపాలు భవిష్యత్తు, అలవాటుగా జరిగేది, లేదా సందర్భంలో కోరిక వంటి భావాలను మోయగలవు. తెలుగు రూపాలు వాక్యాన్ని అతిగా శాపప్రార్థనగా మార్చకుండా, దేవుని సన్నిధిలో జరిగే ఫలితాన్ని సజీవంగా వ్యక్తం చేస్తాయి; ప్రత్యామ్నాయ భావాలు పాదసూచికలో నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తన కవిత్వానికి తగిన గౌరవప్రదమైన శైలి పాటించబడింది. పొగ, మైనం అనే రెండు సమాంతర దృశ్యాలు మరియు ‘అగ్ని ముందు/దేవుని సన్నిధిలో’ అనే నిర్మాణాత్మక ప్రతిధ్వని నిలుపబడ్డాయి.
