id: PSA.68.4
reference: Psalms 68:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שִׁ֤ירוּ לֵֽ/אלֹהִים֮ זַמְּר֪וּ שְׁ֫מ֥/וֹ סֹ֡לּוּ לָ/רֹכֵ֣ב בָּ֭/עֲרָבוֹת בְּ/יָ֥הּ שְׁמ֗/וֹ וְ/עִלְז֥וּ לְ/פָנָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/004.yaml
  text: Sing to God[a]; sing praise to his name. Lift up a song for the one who rides through the deserts; Yah is his name[b]; exult before him.
translation:
  language: te
  text: దేవునికి పాడండి; ఆయన నామాన్ని కీర్తిస్తూ పాడండి. ఎడారి మైదానాల గుండా[b] స్వారీ చేసేవానికోసం దారి సిద్ధం చేయండి[a]. యాహ్ ఆయన నామం; ఆయన సన్నిధిలో ఉల్లసించండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనకోసం స్తుతిగానం చేయండి.” హెబ్రీ క్రియకు దారిని ఎత్తి నిర్మించడం లేదా సిద్ధం చేయడం అనే అర్థం ఉంది; ఈ సందర్భంలో కొందరు దాన్ని స్తుతిగానానికి పిలుపుగా గ్రహిస్తారు.
    reason: alternative_reading
  - marker: b
    text: “ఎడారి మైదానాల గుండా” అనే మాటను కొందరు “మేఘాలపై” అని అర్థం చేసుకుంటారు. అయితే హెబ్రీ పదానికి సాధారణ అర్థం ఎడారి మైదానాలు లేదా మైదాన ప్రాంతాలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ לֵאלֹהִים
  choice: దేవునికి పాడండి
  rationale: బహువచన ఆజ్ఞారూపాన్ని నేరుగా, సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; సందర్భంలో אֱלֹהִים ఇశ్రాయేలు దేవుణ్ణే సూచిస్తుంది.
- source_word: זַמְּרוּ שְׁמוֹ
  choice: ఆయన నామాన్ని కీర్తిస్తూ పాడండి
  rationale: זמר యొక్క సంగీతపూర్వక స్తుతి భావాన్నీ, שְׁמוֹ అనే ప్రత్యక్ష కర్మను కూడా స్పష్టంగా నిలుపుతుంది.
- source_word: סֹלּוּ
  choice: దారి సిద్ధం చేయండి
  rationale: סלל యొక్క ప్రాథమిక రహదారి నిర్మించడం లేదా ఎత్తి సిద్ధం చేయడం అనే భావాన్ని అనుసరిస్తుంది. ముందున్న గాన ఆజ్ఞలకు సమాంతరంగా దీన్ని ‘పాట ఎత్తండి’ అని మార్చకుండా, మూలంలోని చిత్రణను కాపాడుతుంది.
- source_word: לָרֹכֵב בָּעֲרָבוֹת
  choice: ఎడారి మైదానాల గుండా స్వారీ చేసేవానికోసం
  rationale: רכב అనే కృదంతపు ‘స్వారీ చేసేవాడు’ భావాన్ని, עֲרָבוֹת యొక్క సాధారణ ‘ఎడారి మైదానాలు/మైదాన ప్రాంతాలు’ భావాన్ని కాపాడుతుంది. ‘మేఘాలపై’ అనే సందర్భాధారిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: בְּיָהּ שְׁמוֹ
  choice: ఆయన నామం యాహ్
  rationale: יָהּ దేవుని నామపు సంక్షిప్త రూపం; దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్’గా లిప్యంతరీకరించడం మూలరూప భేదాన్ని నిలుపుతుంది.
- source_word: וְעִלְזוּ לְפָנָיו
  choice: ఆయన సన్నిధిలో ఆనందోత్సాహాలు చేయండి
  rationale: עלז సూచించే ఉప్పొంగే ఆనందాన్ని, לְפָנָיו సూచించే ఆయన ఎదుట/సన్నిధిలో అనే సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יָהּ అనే సంక్షిప్త దైవనామం అనువాదం
  choice: యాహ్
  alternative: ప్రభువు
  rationale: మూలంలో సంపూర్ణ చతురక్షర దైవనామం కాక יָהּ అనే ప్రత్యేక సంక్షిప్త రూపం ఉంది. పేరును లిప్యంతరీకరించడం ఆ భేదాన్ని కాపాడుతుంది; ‘ప్రభువు’ అని అనువదిస్తే అది బిరుదుగా మారిపోతుంది.
- issue: దైవిక స్వారీ చిత్రణలో עֲרָבוֹת అర్థం
  choice: ఎడారి మైదానాలు
  alternative: మేఘాలు
  rationale: పదానికి సాధారణ హెబ్రీ అర్థం ఎడారి మైదానాలు లేదా మైదాన ప్రాంతాలు. అయితే దైవ ప్రత్యక్షతకు సంబంధించిన ‘మేఘాలపై స్వారీ’ భావన సాధ్యమైనందున దానిని పాదసూచికలో ఉంచి వ్యాఖ్యానాత్మక ఉద్రిక్తతను నిలుపుతున్నాం.
- issue: סֹלּוּ యొక్క చిత్రాత్మక అర్థం
  choice: దారి సిద్ధం చేయండి
  alternative: పాట ఎత్తండి
  rationale: మూల క్రియ యొక్క సాధారణ అర్థం దారిని ఎత్తి నిర్మించడం లేదా సిద్ధం చేయడం. స్తుతి సందర్భంలో ‘పాట ఎత్తండి’ అని గ్రహించే అవకాశం ఉన్నా, అది మూలంలోని రహదారి చిత్రణను వ్యాఖ్యానాత్మకంగా మార్చుతుంది; అందువల్ల ప్రత్యామ్నాయంగా పాదసూచికలో సూచించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కీర్తనా శైలిని ఉపయోగించాం. బహువచన ఆజ్ఞారూపాలను ఏకరీతిగా ఉంచాం. ‘సన్నిధిలో,’ ‘నామం,’ ‘యాహ్’ వంటి పదాలు ఉన్నతమైన ధోరణిని నిలుపుతూనే సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
