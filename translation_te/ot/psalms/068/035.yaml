id: PSA.68.35
reference: Psalms 68:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: נ֤וֹרָ֥א אֱלֹהִ֗ים מִֽ/מִּקְדָּ֫שֶׁ֥י/ךָ אֵ֤ל יִשְׂרָאֵ֗ל ה֤וּא נֹתֵ֨ן עֹ֖ז וְ/תַעֲצֻמ֥וֹת לָ/עָ֗ם בָּר֥וּךְ אֱלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/035.yaml
  text: Awesome is God from your sanctuaries; the God of Israel—he gives strength and mighty power to the people[a]. Blessed be God!
translation:
  language: te
  text: నీ పరిశుద్ధ స్థలాల నుండి దేవుడు భయభక్తులను కలిగించేవాడు; ఇశ్రాయేలు దేవుడే ప్రజలకు బలాన్నీ మహాశక్తినీ ఇస్తాడు. దేవుడు ధన్యుడు గాక!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נוֹרָא
  choice: భయభక్తులు పుట్టించేవాడవు
  rationale: దేవుని మహిమ విస్మయంతో కూడిన భయభక్తిని కలిగిస్తుందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; కేవలం ‘భయంకరుడు’ అని అనువదిస్తే ప్రతికూల భావం కలిగే అవకాశం ఉంది.
- source_word: אֱלֹהִים
  choice: దేవా / దేవుడు
  rationale: ఈ బహువచన రూపం ఇక్కడ ఇశ్రాయేలు యొక్క ఏకైక దేవుణ్ణి సూచిస్తుంది. మొదటి భాగంలోని ద్వితీయ పురుష ప్రత్యయం కారణంగా సంబోధనను ‘దేవా’గా, చివరి స్తోత్రవాక్యంలో ‘దేవుడు’గా ఇచ్చాం.
- source_word: מִמִּקְדָּשֶׁיךָ
  choice: నీ పరిశుద్ధ స్థలాల నుండి
  rationale: మూలంలోని מן అనే ఉపసర్గను ‘నుండి’గా, రూపపరమైన బహువచనాన్ని ‘స్థలాల’గా నిలిపాం. ఏకవచన లేదా స్థానార్థక పఠనాలను పాదటిప్పణిలో ఉంచాం.
- source_word: אֵל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: ముందు ప్రస్తావించిన దేవుణ్ణి ఇశ్రాయేలు దేవుడిగా గుర్తించే నామపద సమానాధికరణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הוּא
  choice: దేవుడే
  rationale: స్పష్టంగా ఉన్న బలప్రదమైన సర్వనామాన్ని తెలుగు నొక్కిచెప్పే ‘ఏ’ ప్రత్యయంతో ప్రతిబింబించాం.
- source_word: נֹתֵן
  choice: ఇస్తాడు
  rationale: భాగధాతువు దేవుని లక్షణమైన, నిరంతర కార్యాన్ని సూచిస్తుంది; తెలుగు సాధారణ వర్తమాన రూపం దీనిని సహజంగా తెలియజేస్తుంది.
- source_word: עֹז
  choice: బలం
  rationale: עֹז యొక్క సాధారణ అర్థమైన strength/might ను ‘బలం’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְתַעֲצֻמוֹת
  choice: మహాశక్తి
  rationale: మొదటి పదమైన ‘బలం’తో తేడాను ఉంచుతూ, ఈ బహువచన భావంలోని తీవ్రతను ‘మహాశక్తి’ తెలియజేస్తుంది.
- source_word: לָעָם
  choice: ప్రజలకు
  rationale: మూలంలో స్వామ్యసూచక పదం లేదు; కాబట్టి ‘తన ప్రజలకు’ అని చేర్చకుండా నిర్దిష్ట రూపాన్ని మాత్రమే ప్రతిబింబించాం.
- source_word: בָּרוּךְ
  choice: స్తుతించబడునుగాక
  rationale: దేవుణ్ణి ధన్యుడని ప్రకటించే స్తోత్రసూత్రాన్ని గౌరవప్రదమైన, అర్థవంతమైన తెలుగు ఆశీర్వాద/స్తుతి రూపంలో అందిస్తుంది.
theological_decisions:
- issue: ‘పరిశుద్ధ స్థలాలు’ అనే పదంలోని వచనం మరియు సంబంధార్థం
  choice: నీ పరిశుద్ధ స్థలాల నుండి
  alternative: నీ పరిశుద్ధ స్థలం నుండి / నీ పరిశుద్ధ స్థలంలో
  rationale: హీబ్రూ రూపం ద్వితీయ పురుష ఏకవచన ప్రత్యయంతో కూడిన రూపపరమైన బహువచనం; అందువల్ల ప్రధాన పాఠ్యంలో బహువచనాన్నీ ‘నుండి’ అనే సంబంధాన్నీ నిలిపాం. అది మహిమార్థక లేదా సమష్టి బహువచనంగా ఒకే పరిశుద్ధ నివాసాన్ని సూచించే అవకాశాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కీర్తనాశైలిని వాడాం. మొదటి పాదంలోని ‘నీ’ కారణంగా దేవుణ్ణి నేరుగా సంబోధించే నిర్మాణాన్ని ఎంచుకున్నాం; ‘దేవుడే’ ద్వారా הוּא లోని నొక్కును నిలిపాం.
