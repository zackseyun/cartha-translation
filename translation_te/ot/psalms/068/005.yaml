source:
  edition: WLC
  text: אֲבִ֣י יְ֭תוֹמִים וְ/דַיַּ֣ן אַלְמָנ֑וֹת אֱ֝לֹהִ֗ים בִּ/מְע֥וֹן קָדְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/005.yaml
  text: God is a father of the fatherless and a judge of widows in his holy dwelling[a][b][c].
translation:
  language: te
  text: తండ్రిలేనివారికి[a] తండ్రి, విధవరాళ్లకు న్యాయాధిపతి[b]—తన పరిశుద్ధ నివాసంలో[c] ఉన్న దేవుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అనాథలకు.’ అయితే హీబ్రూ పదం ప్రత్యేకంగా తండ్రిని కోల్పోయినవారిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘విధవరాళ్ల పక్షాన న్యాయం తీర్చేవాడు.’ హీబ్రూ పదం మరింత అక్షరార్థంగా తీర్పు తీర్చే లేదా న్యాయం నిర్వహించే వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘తన పరిశుద్ధ నివాసం నుండి.’ కొన్ని అనువాదాలు దేవుడు కార్యం చేసే స్థలాన్ని ఈ విధంగా వ్యక్తం చేస్తాయి; అయితే హీబ్రూ ఉపసర్గ అక్షరార్థంగా ‘లో’ అని ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבִי
  choice: తండ్రి
  rationale: ఆב అనే నామవాచకపు నిర్మిత రూపం. తెలుగులో ‘తండ్రిలేనివారికి తండ్రి’ అనే ప్రయోగం సంబంధాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְתוֹמִים
  choice: తండ్రిలేనివారు
  rationale: ఈ పదం ముఖ్యంగా తండ్రిని కోల్పోయిన పిల్లలను సూచిస్తుంది. ‘అనాథలు’ కంటే ‘తండ్రిలేనివారు’ మూలపదంలోని నిర్దిష్ట సామాజిక దుర్బలతను కాపాడుతుంది.
- source_word: דַיַּן
  choice: న్యాయాధిపతి
  rationale: ఈ నామవాచకం తీర్పు తీర్చే లేదా న్యాయం నిర్వహించే వ్యక్తిని సూచిస్తుంది. ‘సంరక్షకుడు’ అనే భావం సందర్భంలో ఉండవచ్చుగాని, అది మూలపదం కంటే వివరణాత్మకం.
- source_word: אַלְמָנוֹת
  choice: విధవరాళ్లు
  rationale: భర్తలను కోల్పోయిన స్త్రీలను సూచించే సాధారణ బహువచన రూపానికి ఆధునిక ప్రామాణిక తెలుగు సమానార్థకం.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఇక్కడ రూపం బహువచన ఆకృతిలో ఉన్నప్పటికీ అర్థం ఏకవచనం; వాక్యంలోని కర్తగా ‘దేవుడు’ సహజమైన అనువాదం.
- source_word: בִּמְעוֹן
  choice: నివాసంలో
  rationale: מָעוֹן అంటే నివాసస్థలం; ב అనే ఉపసర్గకు ప్రాథమికంగా ‘లో/లోపల’ అనే స్థానార్థం ఉంది. అందువల్ల ‘నివాసంలో’ మూలానికి దగ్గరగా ఉండి ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: קָדְשׁוֹ
  choice: తన పరిశుద్ధ
  rationale: ‘ఆయన పరిశుద్ధతకు చెందిన’ అనే నిర్మాణ భావాన్ని తెలుగులో సహజమైన విశేషణ ప్రయోగమైన ‘తన పరిశుద్ధ’గా వ్యక్తం చేశాం.
theological_decisions:
- issue: דַיַּן పదాన్ని రక్షణాత్మక భావంతో అనువదించాలా?
  choice: న్యాయాధిపతి
  alternative: విధవరాళ్ల పక్షాన న్యాయం తీర్చేవాడు / సంరక్షకుడు
  rationale: సందర్భం దేవుడు బలహీనులకు న్యాయం కలిగిస్తాడని సూచించినప్పటికీ, మూలపదం ప్రత్యక్షంగా న్యాయపరమైన పాత్రను సూచిస్తుంది. ‘న్యాయాధిపతి’ ఆ న్యాయస్థాన రూపకాన్ని కాపాడి, రక్షణ అనే భావాన్ని అనువాదంలో ముందుగానే నిర్ధారించదు.
- issue: בִּמְעוֹן קָדְשׁוֹ స్థలాన్ని (‘లో’) సూచిస్తుందా, కార్యం మొదలయ్యే మూలాన్ని (‘నుండి’) సూచిస్తుందా?
  choice: తన పరిశుద్ధ నివాసంలో
  alternative: తన పరిశుద్ధ నివాసం నుండి
  rationale: హీబ్రూ ఉపసర్గ ב సాధారణంగా ‘లో’ అని అర్థం. ‘నుండి’ అని అనువదించడం దేవుడు అక్కడి నుండి కార్యం చేస్తాడనే సందర్భార్థాన్ని స్పష్టం చేస్తుంది గాని, మూలంలోని స్థానార్థాన్ని మార్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, కీర్తనకు తగిన గంభీరమైన కవితాత్మక నామవాక్య నిర్మాణాన్ని నిలిపాం. ‘తండ్రిలేనివారు,’ ‘న్యాయాధిపతి,’ ‘పరిశుద్ధ నివాసం’ అనే పదాలు మూలంలోని సామాజిక, న్యాయపరమైన, పవిత్ర స్థల భావాలను అతివ్యాఖ్యానం లేకుండా కాపాడుతాయి.
