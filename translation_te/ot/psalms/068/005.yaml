  terminology: ‘తండ్రిలేనివారికి,’ ‘విధవరాళ్లకు,’ ‘న్యాయాధిపతి,’ ‘దేవుడు,’ and ‘పరిశుద్ధ నివాసం’ are suitable and consistent terms. The alternatives in the notes accurately distinguish ‘అనాథలు,’ a protective rendering of the judicial term, and ‘నుండి’ versus the Hebrew’s literal locative ‘లో.’
