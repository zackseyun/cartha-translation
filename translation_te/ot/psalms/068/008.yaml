  yaml_path: translation/ot/psalms/068/008.yaml
  text: The earth quaked; even the heavens dripped before God—this Sinai—before God, the God of Israel.
translation:
  language: te
  text: భూమి కంపించింది; దేవుని సమక్షంలో ఆకాశాలు సైతం చినుకులు రాల్చాయి—ఈ సీనాయి—ఇశ్రాయేలు దేవుడైన ఆయన సమక్షంలో.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָעָשָׁה
  choice: కంపించింది
  rationale: భూమి కదలికను సూచించే మూల క్రియకు సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: נָטְפוּ
  choice: వర్షించాయి
  rationale: అక్షరార్థంగా ‘చుక్కలు కార్చాయి/బొట్లు రాల్చాయి’; ఆకాశాలు కర్తగా ఉన్న సందర్భంలో వర్షాన్ని కురిపించడమనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִפְּנֵי
  choice: సన్నిధిలో
  rationale: ‘ముఖం ఎదుట/సమక్షంలో’ అనే భావాన్ని దైవ ప్రత్యక్షత సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: זֶה סִינַי
  choice: ఈ సీనాయి
  rationale: మూలంలోని సంక్షిప్తమైన, వ్యాకరణపరంగా ఉద్వేగభరితమైన పదబంధాన్ని వివరణ జోడించకుండా నిలుపుతుంది.
theological_decisions:
- issue: ‘ఈ సీనాయి’ అనే పదబంధం యొక్క సంబంధం
  choice: ఈ సీనాయి
  alternative: సీనాయి సైతం / సీనాయి వద్ద
  rationale: హీబ్రూ పాఠంలోని זֶה סִינַי నిర్మాణం సంక్షిప్తంగా, కొంత అస్పష్టంగా ఉంది; సీనాయిని కర్తగా చేయడం గాని స్థలార్థాన్ని చేర్చడం గాని చేయకుండా ఆ ఉద్వేగాన్ని కాపాడింది.
- issue: దైవనామం אֱלֹהִים యొక్క పునరుక్తి
  choice: దేవుని సన్నిధిలో ... దేవుని సన్నిధిలో, ఇశ్రాయేలు దేవుని సన్నిధిలో
  alternative: దేవుని ఎదుట ... ఇశ్రాయేలు దేవుని ఎదుట
  rationale: మూలంలోని మూడుసార్ల దైవసూచనను, చివరి ‘ఇశ్రాయేలు దేవుడు’ అనే గుర్తింపును సంక్షిప్తం చేయకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలి. హీబ్రూ పాదంలోని పునరుక్తిని, ‘ఈ సీనాయి’ అనే ఉద్దేశపూర్వక సంక్షిప్తతను కాపాడుతూ, సాధారణ పాఠకునికి అర్థమయ్యే పదాలను ఉపయోగించింది.
