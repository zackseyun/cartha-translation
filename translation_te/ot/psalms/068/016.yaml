source:
  edition: WLC
  text: לָ֤/מָּה תְּֽרַצְּדוּ/ן֮ הָרִ֪ים גַּבְנֻ֫נִּ֥ים הָ/הָ֗ר חָמַ֣ד אֱלֹהִ֣ים לְ/שִׁבְתּ֑/וֹ אַף יְ֝הוָ֗ה יִשְׁכֹּ֥ן לָ/נֶֽצַח׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/016.yaml
  text: Why do you leap about[a], O many-peaked mountains, at the mountain God desired for his dwelling? Indeed, Yahweh will dwell there forever.
translation:
  language: te
  text: 'అనేక శిఖరాలున్న పర్వతాలారా,


    దేవుడు తాను నివసించడానికి కోరుకున్న పర్వతాన్ని చూసి


    మీరెందుకు గంతులు వేస్తున్నారు[a]?


    నిశ్చయంగా, యహ్వే అక్కడ శాశ్వతంగా నివసిస్తాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరెందుకు అసూయతో చూస్తున్నారు?” లేదా “మీరెందుకు వంకరగా చూస్తున్నారు?” ఈ హెబ్రీ క్రియ అరుదైనది; దాని అర్థం అనిశ్చితం. అది గంతులు వేయడాన్ని లేదా అసూయతో/వంకరగా చూడడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרַצְּדוּן
  choice: గంతులు వేస్తున్నారు
  rationale: ఈ హెబ్రీ క్రియ అరుదైనది, దాని అర్థం అనిశ్చితం. కదలికను సూచించే ‘గంతులు వేయడం’ అనే భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, అసూయతో లేదా వంకరగా చూడడం అనే సాధ్యమైన భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: הָרִים גַּבְנֻנִּים
  choice: అనేక శిఖరాలుగల పర్వతాలు
  rationale: גַּבְנֻנִּים పర్వతాల ఉబ్బిన వీపులను, వరుస శిఖరాలను లేదా ఎత్తైన మిట్టలను సూచించవచ్చు. ‘అనేక శిఖరాలుగల’ అనే పదబంధం ఆ దృశ్యరూపాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: הָהָר
  choice: పర్వతం
  rationale: హెబ్రీ పాఠ్యంలో నిర్దిష్టమైన పర్వతం సూచించబడింది గాని ‘సీయోను’ అనే పేరు లేదు; అందువల్ల పేరు చేర్చకుండా ‘పర్వతం’ అని ఉంచాం.
- source_word: חָמַד
  choice: కోరుకున్న
  rationale: ఈ క్రియ కోరిక, ఇష్టం లేదా అభిలాషను సూచిస్తుంది. ‘కోరుకున్న’ అనేది ‘ఎంచుకున్న’ కంటే మూలపదానికి దగ్గరగా ఉండి, దైవిక ఎంపికను అతిగా వివరిస్తూ చెప్పదు.
- source_word: לְשִׁבְתּוֹ
  choice: తన నివాసం కోసం
  rationale: ఈ నిర్మాణం దేవుడు నివసించడానికి కోరుకున్న స్థలమనే ఉద్దేశాన్ని తెలియజేస్తుంది. ‘తన నివాసం కోసం’ సంక్షిప్తంగానూ సహజంగానూ ఉంది.
- source_word: אַף
  choice: నిశ్చయంగా
  rationale: ఇక్కడ אַף తరువాతి ప్రకటనను బలపరుస్తుంది; కేవలం ‘కూడా’ అనే సంకలనార్థం కంటే ‘నిశ్చయంగా’ ఆ ఉద్ఘాటనను స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు దగ్గరైన రూపంలో లిప్యంతరీకరించాం.
- source_word: יִשְׁכֹּן לָנֶצַח
  choice: అక్కడ శాశ్వతంగా నివసిస్తాడు
  rationale: שׁכן స్థిరంగా నివసించడాన్ని సూచిస్తుంది; ‘అక్కడ’ అనేది సందర్భంలోని పర్వతాన్ని స్పష్టంగా తిరిగి సూచిస్తుంది. לָנֶצַח యొక్క నిరంతర కాలభావాన్ని ‘శాశ్వతంగా’ అందిస్తుంది.
theological_decisions:
- issue: పర్వతాన్ని ‘సీయోను’ అని స్పష్టంగా గుర్తించాలా?
  choice: ప్రధాన పాఠ్యంలో ‘పర్వతం’ అనే సాధారణ నామాన్నే ఉంచడం
  alternative: ‘సీయోను పర్వతం’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: కీర్తన యొక్క విస్తృత సందర్భం సీయోనును సూచించినా, ఈ వచనం స్వయంగా ఆ పేరును ఉపయోగించదు. కాబట్టి మూలపాఠ్యానికి మించిన నిర్దిష్టతను చేర్చలేదు.
- issue: ఇతర పర్వతాలకు, దేవుడు కోరుకున్న పర్వతానికి మధ్య ఉన్న అలంకారిక విరోధాన్ని ఎలా వ్యక్తపరచాలి?
  choice: అరుదైన క్రియ యొక్క కదలిక భావాన్ని ‘గంతులు వేస్తున్నారు’ అని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘అసూయతో చూస్తున్నారు’ లేదా ‘వంకరచూపు చూస్తున్నారు’ అని విరోధ భావాన్ని స్పష్టం చేయడం
  rationale: మూలక్రియ అనిశ్చితమైనందున ఒక వ్యాఖ్యానాన్ని తుది అర్థంగా స్థిరపరచలేదు. కదలిక భావాన్ని పాఠ్యంలో ఉంచి, సందర్భానికి సరిపోయే అసూయ/విరోధ భావాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలిని ఉపయోగించాం. పర్వతాలను నేరుగా సంబోధించే రూపాన్ని, పాద విభజనను నిలిపి ఉంచాం. ‘యహ్వే’ను దైవనామ లిప్యంతరీకరణగా వాడాం.
