source:
  edition: WLC
  text: הַר אֱ֭לֹהִים הַר בָּשָׁ֑ן הַ֥ר גַּ֝בְנֻנִּ֗ים הַר בָּשָֽׁן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/015.yaml
  text: A mountain of God is the mountain of Bashan[b][a]; a mountain of peaks is the mountain of Bashan.
translation:
  language: te
  text: దేవుని పర్వతం[a] బాషాను పర్వతమే; శిఖరాల పర్వతం[b] బాషాను పర్వతమే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మహా పర్వతం” లేదా “మహిమాన్వితమైన పర్వతం.” హీబ్రూలోని “దేవుని పర్వతం” అనే మాట అతిశయార్థక నుడికారంగా ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “శిఖరాల” అని అనువదించిన అరుదైన హీబ్రూ పదం ఎగుడుదిగుడైన లేదా మూపురాలవంటి పర్వతాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַר
  choice: పర్వతం
  rationale: సాధారణ అర్థం ‘పర్వతం’. పద్యంలోని నొక్కిచెప్పే పునరుక్తిని నిలుపుకోవడానికి మూడుసార్లూ ఇదే పదాన్ని వాడాం.
- source_word: אֱלֹהִים
  choice: దేవుని
  rationale: הַר אֱלֹהִים అనే సమాసానికి నేరమైన అర్థం ‘దేవుని పర్వతం’. ఇది అతిశయార్థక ప్రయోగం కావచ్చనే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: בָּשָׁן
  choice: బాషాను
  rationale: ఇది ప్రాంతనామం; ఆధునిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: גַּבְנֻנִּים
  choice: శిఖరాలు గల
  rationale: అరుదైన ఈ బహువచన పదం అనేక శిఖరాలు ఉన్న, ఎగుడుదిగుడైన లేదా మూపురాలవంటి ఆకృతి గల పర్వతాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో సహజమైన భౌగోళిక భావాన్ని ఇచ్చి, ఇతర ఛాయలను పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: הַר אֱלֹהִים ను అక్షరార్థంగా అనువదించాలా, అతిశయార్థక నుడికారంగా అనువదించాలా
  choice: ప్రధాన పాఠంలో ‘దేవుని పర్వతం’
  alternative: ‘మహా పర్వతం’ లేదా ‘మహిమాన్వితమైన పర్వతం’
  rationale: హీబ్రూ నిర్మాణం నేరుగా ‘దేవుని పర్వతం’ అని ఉంటుంది. అయితే אֱלֹהִים ఇక్కడ అతిశయాన్ని సూచించే అవకాశం ఉంది; ఆ సందిగ్ధతను తొలగించకుండా పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన కవితా శైలి. మూలంలోని ‘పర్వతం’ అనే పునరుక్తిని, రెండు సమాంతర భాగాల నిర్మాణాన్ని నిలిపాం. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల వెంట ఉంచాం.
