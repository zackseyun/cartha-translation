  text: God is to us a God of salvations[b][a], and to the Lord GOD belong escapes from death.
translation:
  language: te
  text: దేవుడు మనకు రక్షణలు ప్రసాదించే దేవుడు[a]; మరణం నుంచి బయటపడే మార్గాలు[b] యాహ్వే ప్రభువుకే చెందుతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రక్షణలు’ అని ఉన్న హీబ్రూ పదం బహువచనం; ఇది దేవుడు మళ్లీ మళ్లీ లేదా అనేక విధాలుగా విడిపించడాన్ని నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘మరణానికి బయటికి వెళ్లే దారులు’ లేదా ‘నిష్క్రమణలు’; సందర్భంలో ఇది మరణం నుంచి బయటపడే మార్గాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל ... אֵל
  choice: దేవుడు ... దేవుడు
  rationale: మూలంలోని אֵל పదపునరుక్తిని నిలుపుతూ, మొదటి రూపంలోని నిర్దిష్ట సూచనను సహజమైన తెలుగులో ‘దేవుడు’గా వ్యక్తం చేశాం.
- source_word: לָנוּ
  choice: మనకు
  rationale: ל ఉపసర్గ ఇక్కడ సంబంధం లేదా మేలు పొందే వ్యక్తులను సూచిస్తుంది; ‘మనకు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: לְמוֹשָׁעוֹת
  choice: రక్షణలు ప్రసాదించే
  rationale: מוֹשָׁעוֹת బహువచనాన్ని ‘రక్షణలు’గా నిలిపి, తెలుగులో సహజమైన విధేయ నిర్మాణం కోసం ‘ప్రసాదించే’ చేర్చాం.
- source_word: וְלֵיהוָה אֲדֹנָי
  choice: ప్రభువైన యాహ్వేకే
  rationale: אֲדֹנָי అనే బిరుదును ‘ప్రభువు’గా, יהוה అనే దైవనామాన్ని ‘యాహ్వే’గా వేరు చేసి చూపించాం; ל లోని అధీనత భావాన్ని ‘-కే’ తెలియజేస్తుంది.
- source_word: לַמָּוֶת תּוֹצָאוֹת
  choice: మరణం నుంచి బయటపడే మార్గాలు
  rationale: תּוֹצָאוֹת అక్షరార్థంగా ‘బయటికి వెళ్లే దారులు/నిష్క్రమణలు’; మరణంతో ఉన్న సందర్భంలో దాని భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేశాం, అలాగే బహువచనాన్ని నిలిపాం.
theological_decisions:
- issue: יהוה దైవనామాన్ని אֲדֹנָיతో కలిపి అనువదించడం
  choice: ప్రభువైన యాహ్వే
  alternative: ప్రభువైన దేవుడు / ప్రభువైన యెహోవా
  rationale: మూలంలో బిరుదు, దైవనామం రెండూ ఉన్నాయి. అందువల్ల రెండింటినీ వేరు చేసి నిలుపుతూ, יהוהను దైవనామంగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- issue: לַמָּוֶת תּוֹצָאוֹתలో దేవుని అధికారమా లేక తప్పించుకునే మార్గాలా
  choice: మరణం నుంచి బయటపడే మార్గాలు
  alternative: మరణానికి సంబంధించిన నిష్క్రమణలు
  rationale: సందర్భం రక్షణను ప్రధానంగా చూపుతుంది కాబట్టి ‘బయటపడే మార్గాలు’ సహజమైన భావం. అయితే మూలపదంలోని విస్తృతమైన ‘నిష్క్రమణలు’ భావాన్ని పాదటిప్పణిలో ఉంచి అనిశ్చితిని పూర్తిగా తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గౌరవభరితమైన శైలిని ఉపయోగించాం. మూలంలోని ‘దేవుడు ... దేవుడు’ పునరుక్తి, ‘రక్షణలు’ మరియు ‘మార్గాలు’ అనే బహువచనాలు నిలుపబడ్డాయి; అరుదైన అక్షరార్థ పదాలకు బదులుగా సాధారణ పాఠకులకు అర్థమయ్యే పదబంధాలు వాడబడ్డాయి.
