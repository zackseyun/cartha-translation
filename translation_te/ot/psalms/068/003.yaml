id: PSA.68.3
reference: Psalms 68:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְֽ/צַדִּיקִ֗ים יִשְׂמְח֣וּ יַֽ֭עַלְצוּ לִ/פְנֵ֥י אֱלֹהִ֗ים וְ/יָשִׂ֥ישׂוּ בְ/שִׂמְחָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/003.yaml
  text: But the righteous will be glad[a]; they will exult before God[b], and they will rejoice with gladness.
translation:
  language: te
  text: కానీ నీతిమంతులు సంతోషిస్తారు[a]; దేవుని సన్నిధిలో[b] ఉల్లసిస్తారు; ఆనందంతో హర్షిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మరియు నీతిమంతులు సంతోషిస్తారు.’ హీబ్రూ సంధిపదానికి సాధారణంగా ‘మరియు’ అని అర్థం; ప్రధాన పాఠంలోని ‘కానీ’ ముందు వచనంతో ఉన్న వ్యత్యాసాన్ని చూపుతుంది.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూలో ‘దేవుని ఎదుట,’ అంటే దేవుని సన్నిధిలో.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצַדִּיקִים
  choice: కానీ నీతిమంతులు
  rationale: צַדִּיקִים అంటే నీతిగా ఉండేవారు. ముందు వచనంలోని దుష్టుల గతికి విరుద్ధంగా ఉన్న భావాన్ని సందర్భానుసారంగా చూపేందుకు וְను ప్రధాన పాఠంలో ‘కానీ’ అని అనువదించాం; దాని సాధారణ అర్థమైన ‘మరియు’ను పాదసూచికలో ఉంచాం.
- source_word: יִשְׂמְחוּ
  choice: సంతోషిస్తారు
  rationale: שׂמח సంతోషాన్ని సూచిస్తుంది. తరువాతి రెండు ఆనందక్రియల ప్రత్యేక ఛాయలను నిలుపుతూ, సహజమైన ఆధునిక తెలుగు రూపంగా దీనిని ఎంచుకున్నాం.
- source_word: יַעַלְצוּ
  choice: ఉల్లసిస్తారు
  rationale: עלץ ఉప్పొంగే, ఉత్సాహభరితమైన ఆనందాన్ని వ్యక్తం చేస్తుంది. ‘ఉల్లసిస్తారు’ ఆ తీవ్రతను సహజంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי אֱלֹהִים
  choice: దేవుని సన్నిధిలో
  rationale: అక్షరార్థంగా ‘దేవుని ముఖం ఎదుట’; ఇది దేవుని సమక్షం లేదా సన్నిధిని సూచిస్తుంది. తెలుగులో ‘దేవుని సన్నిధిలో’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וְיָשִׂישׂוּ
  choice: హర్షిస్తారు
  rationale: שׂוש ఆనందంతో పొంగిపోవడం లేదా హర్షించడం అనే భావాన్ని ఇస్తుంది. ముందున్న עלץకు వాడిన ‘ఉల్లసిస్తారు’తో భేదాన్ని నిలుపేందుకు ‘హర్షిస్తారు’ అని అనువదించాం.
- source_word: בְשִׂמְחָה
  choice: ఆనందంతో
  rationale: שׂמחה ఆనందాన్ని సూచిస్తూ హర్షించే విధానాన్ని బలపరుస్తుంది. ‘ఆనందంతో’ సహజమైన తెలుగు ప్రయోగం; మూలంలోని ఆనందపదాల ఉద్దేశపూర్వక సమూహాన్నీ నిలుపుతుంది.
