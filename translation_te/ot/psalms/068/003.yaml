  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గౌరవప్రదమైన ధోరణితో అనువదించాం. మూలంలోని మూడు ఆనందక్రియలకు ‘సంతోషిస్తారు,’ ‘ఉల్లసిస్తారు,’ ‘హర్షిస్తారు’ అనే వేర్వేరు పదాలను వాడి భావపునరుక్తి మరియు పెరుగుతున్న ఉత్సాహాన్ని నిలిపాం.
