source:
  edition: WLC
  text: רָא֣וּ הֲלִיכוֹתֶ֣י/ךָ אֱלֹהִ֑ים הֲלִ֘יכ֤וֹת אֵלִ֖/י מַלְכִּ֣/י בַ/קֹּֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/024.yaml
  text: They have seen your processions[a], O God— the processions of my God, my King, into the sanctuary.
translation:
  language: te
  text: 'దేవా, నీ ఊరేగింపులను వారు చూశారు—

    పరిశుద్ధస్థలంలో నా దేవుని, నా రాజు ఊరేగింపులను.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “దేవా, నీ నడకలను వారు చూశారు—పరిశుద్ధతలో నా దేవుని, నా రాజు నడకలను.”'
    reason: హֲלִיכוֹת అనే పదానికి ‘నడకలు/వెళ్లడాలు’ అనే విస్తృత అర్థం ఉంది; בַּקֹּדֶשׁకు ‘పరిశుద్ధతలో’ అనే గుణార్థం కూడా సాధ్యమే.
lexical_decisions:
- source_word: רָאוּ
  choice: వారు చూశారు
  rationale: ראה అనే క్రియ యొక్క ఖాల్ పర్ఫెక్ట్ మూడవ పురుష బహువచన రూపం; పూర్తయిన, ప్రత్యక్షంగా గమనించిన చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הֲלִיכוֹתֶיךָ
  choice: నీ ఊరేగింపులను
  rationale: הלך నుంచి వచ్చిన ఈ బహువచన నామవాచకం వెళ్లడాలు, అడుగులు, కవాతు లేదా ఆచారబద్ధమైన ఊరేగింపులను సూచించగలదు. పరిసరంలోని ఆరాధనా, ఉత్సవ సందర్భంలో ‘ఊరేగింపులు’ అనేది బహిరంగమైన ఆచారబద్ధ కదలికను సహజంగా వ్యక్తం చేస్తుంది; బహువచనాన్నీ నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: సందర్భం ప్రత్యక్ష సంబోధనను సూచిస్తుంది; తెలుగు సంబోధన రూపం కవితాత్మక ప్రార్థనా స్వరాన్ని సహజంగా నిలుపుతుంది.
- source_word: הֲלִיכוֹת
  choice: ఊరేగింపులను
  rationale: మూలంలోని పునరుక్తిని, సమాంతర నిర్మాణాన్ని కాపాడేందుకు మొదటి పదంతో సమానంగా అనువదించబడింది.
- source_word: אֵלִי
  choice: నా దేవుని
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో కూడిన రూపం నేరుగా ‘నా దేవుడు’ అనే స్వామ్య సంబంధాన్ని తెలియజేస్తుంది; వాక్య నిర్మాణానుసారం ద్వితీయా రూపం వాడబడింది.
- source_word: מַלְכִּי
  choice: నా రాజు
  rationale: కీర్తనకర్త దేవుణ్ణి రాజుగా పేర్కొనే మూలంలోని రాజసంబంధ బిరుదును యథాతథంగా నిలుపుతుంది.
- source_word: בַקֹּדֶשׁ
  choice: పరిశుద్ధస్థలంలోకి సాగే
  rationale: ఈ పదబంధం అక్షరార్థంగా ‘పరిశుద్ధతలో/పరిశుద్ధ స్థలంలో’ అని ఉండగలదు. ఊరేగింపు సందర్భంలో పవిత్ర ప్రాంగణంలోకి కదలిక అనే భావం సహజంగా ఉన్నందున ‘పరిశుద్ధస్థలంలోకి సాగే’ అని అనువదించబడింది; ప్రత్యామ్నాయ అర్థం పాదటిప్పణిలో నిలుపబడింది.
theological_decisions:
- issue: ఊరేగింపుల సూచన
  choice: దేవుని ఆచారబద్ధమైన ఊరేగింపులు పరిశుద్ధస్థలంలోకి సాగుతున్న దృశ్యం
  alternative: దేవుని మార్గాలు లేదా కార్యాలు కనిపించాయని మరింత అమూర్తంగా అర్థం చేసుకోవచ్చు.
  rationale: పునరుక్తమైన הֲלִיכוֹת, దేవునికి ప్రత్యక్ష సంబోధన, చివరనున్న בַקֹּדֶשׁ కలిసి ఆరాధనా ఊరేగింపు దృశ్యాన్నే బలపరుస్తాయి; అయితే నిర్దిష్ట చారిత్రక సందర్భాన్ని అనువాదం చేర్చదు.
- issue: בַקֹּדֶשׁ యొక్క స్థానార్థం లేదా గుణార్థం
  choice: పరిశుద్ధస్థలంలోకి
  alternative: పరిశుద్ధతలో
  rationale: సందర్భంలోని కదలిక దృష్ట్యా పవిత్రస్థలాన్ని సూచించే స్థానార్థం ప్రధాన పాఠ్యంలో తీసుకోబడింది. హెబ్రీ పదబంధంలోని నిజమైన సందిగ్ధతను పాదటిప్పణి ద్వారా కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, కీర్తనా శైలికి తగిన గౌరవభరితమైన కవితాత్మక ధోరణి. మూలంలోని బహువచనం, పునరుక్తి, ప్రత్యక్ష సంబోధన నిలుపబడ్డాయి.
