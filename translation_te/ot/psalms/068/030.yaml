  yaml_path: translation/ot/psalms/068/030.yaml
  text: Rebuke the beast of the reeds[a], the herd of bulls among the calves of the peoples, trampling on pieces of silver[b]. Scatter the peoples who delight in wars.
translation:
  language: te
  text: 'రెల్లుపొదల మృగాన్ని,

    ప్రజల దూడల మధ్యనున్న ఎద్దుల మందను,

    వెండి ముక్కలపై తొక్కుతూ ఉన్నదాన్ని గద్దించు.[a][b]


    యుద్ధాలను ఇష్టపడే ప్రజలను చెదరగొట్టు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రెల్లుల మధ్యనున్న అడవి మృగం.’ ఇది ఐగుప్తును లేదా మరొక శత్రు శక్తిని సూచించే రూపకం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఈ పాదంలోని హెబ్రీ క్లిష్టమైనది. ‘వెండి ముక్కలతో లొంగుతున్నదాన్ని’ లేదా ‘వెండి కడ్డీలతో సాష్టాంగపడుతున్నదాన్ని’—అంటే కప్పం అర్పిస్తున్నదాన్ని—అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: גְּעַר
  choice: గద్దించు
  rationale: దేవుడు శత్రు శక్తులను బలంగా అదుపుచేసే మందలింపును సూచించే ఆజ్ఞారూప క్రియ. ‘నాశనం చేయి’ అని భావాన్ని మించి చెప్పకుండా మూలంలోని బలాన్ని నిలుపుతుంది.
- source_word: חַיַּת קָנֶה
  choice: రెల్లుపొదల మృగం
  rationale: అక్షరార్థంగా ‘రెల్లుల మృగం.’ చిత్తడి నేలలోని ప్రమాదకర జంతువు అనే చిత్రాన్ని నిలుపుతూ, దానిని ఐగుప్తు లేదా మరొక శత్రు రాజ్యంగా ప్రధాన పాఠ్యంలో నిర్దిష్టంగా గుర్తించదు.
- source_word: עֲדַת אַבִּירִים
  choice: ఎద్దుల మంద
  rationale: עֲדָה సాధారణంగా సమూహం లేదా సభ అని అర్థమైనా, చుట్టూ ఉన్న జంతు రూపకాలలో אַבִּירִים బలమైన ఎద్దులను సూచించగలదు. అందువల్ల ‘ఎద్దుల మంద’ రూపకపు కొనసాగింపును కాపాడుతుంది.
- source_word: בְּעֶגְלֵי עַמִּים
  choice: ప్రజల దూడల మధ్య
  rationale: בְּ ను ఇక్కడ స్థల/సహవాస భావంలో ‘మధ్య’గా తీసుకొని, עֶגְלֵי ను ‘దూడలు’గా అనువదించింది. అధీన పాలకులు లేదా జనసమూహాలపై ఉన్న పశు రూపకాన్ని ఇది నిలుపుతుంది.
- source_word: מִתְרַפֵּס
  choice: తొక్కివేసేదాన్ని
  rationale: ఈ పదరూపం క్లిష్టమైనది. శత్రుత్వభరితమైన జంతు రూపకం, చివరి పాదంలోని యుద్ధాసక్త ప్రజలు అనే సందర్భం దృష్ట్యా ప్రధాన పాఠ్యంలో తొక్కివేయడం అనే భావం తీసుకుంది; లొంగిపోవడం లేదా సాష్టాంగపడడం అనే ముఖ్య ప్రత్యామ్నాయం పాదసూచికలో ఉంచింది.
- source_word: בְּרַצֵּי כָסֶף
  choice: వెండి ముక్కలను
  rationale: רַצֵּי అర్థం అస్పష్టమైనది; ముక్కలు, భాగాలు లేదా కడ్డీలు కావచ్చు. ‘వెండి ముక్కలు’ అనే అనువాదం వస్తువు రూపాన్ని అతిగా నిర్దిష్టం చేయకుండా ఆర్థిక చిత్రాన్ని నిలుపుతుంది.
- source_word: בִּזַּר
  choice: చెదరగొట్టు
  rationale: రూపపరంగా సంపూర్ణ క్రియగా సూచించబడినా, కవితా సందర్భంలో మొదటి ఆజ్ఞకు సమాంతరమైన ప్రార్థనా విజ్ఞప్తిగా అర్థమవుతుంది. తెలుగు ఆజ్ఞారూపం వాక్య ప్రవాహాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַמִּים
  choice: ప్రజలు
  rationale: మూలపదానికి సాధారణమైన ‘ప్రజలు/జనాలు’ భావాన్ని తీసుకుంది; ‘దేశాలు’ అని రాజకీయంగా కుదించలేదు.
- source_word: קְרָבוֹת יֶחְפָּצוּ
  choice: యుద్ధాలను ఇష్టపడే
  rationale: బహువచన నామవాచకం, కోరికను తెలిపే క్రియ కలిసి యుద్ధం పట్ల నిరంతర ఆసక్తిని సూచిస్తాయి. ఈ తెలుగు పదబంధం సహజంగా ఉండి మూలంలోని నైతిక తీవ్రతను నిలుపుతుంది.
theological_decisions:
- issue: ‘రెల్లుపొదల మృగం’ ఐగుప్తునే సూచిస్తుందని ప్రధాన పాఠ్యంలో స్పష్టంగా చెప్పాలా?
  choice: ప్రధాన పాఠ్యంలో రూపకాన్ని అలాగే ఉంచడం
  alternative: దీనిని ప్రత్యేకంగా ఐగుప్తుగా లేదా సాధారణ శత్రు సామ్రాజ్యంగా వివరించడం
  rationale: చిత్తడి నేల/రెల్లుల చిత్రం, కీర్తన సందర్భం ఐగుప్తును సూచించవచ్చు; అయితే హెబ్రీ పాఠ్యం ఇక్కడ దేశం పేరు చెప్పకుండా రూపకాన్నే వాడుతుంది. అందువల్ల అనువాదం పాఠ్యం కంటే ఎక్కువగా నిర్ధారించదు.
- issue: מִתְרַפֵּס శత్రుత్వంతో తొక్కివేయడాన్నా, వెండితో లొంగిపోవడాన్నా సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో శత్రుత్వ చర్యగా ‘తొక్కివేసేదాన్ని’ అని అనువదించడం
  alternative: వెండి ముక్కలతో లొంగిపోవడం లేదా వెండి కడ్డీలతో సాష్టాంగపడడం, అంటే కప్పం చెల్లించడం
  rationale: పదం వ్యుత్పత్తి, వాక్య నిర్మాణం వివాదాస్పదమైనవి. శత్రు జంతువులు, యుద్ధాలను ఇష్టపడే ప్రజలు అనే సందర్భం తొక్కివేయడం అనే భావానికి అనుకూలమైనా, లొంగుబాటు/కప్పం భావం ప్రాముఖ్యమైన ప్రత్యామ్నాయం కాబట్టి పాదసూచికలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలిని ఉపయోగించింది. ‘రెల్లుపొదలు,’ ‘ఎద్దుల మంద,’ ‘దూడలు’ అనే స్పష్టమైన దృశ్యపదాలతో మూలంలోని జంతు రూపకాన్ని నిలిపింది. క్లిష్టమైన వెండి పాదాన్ని ప్రధాన పాఠ్యంలో సంక్షిప్తంగా ఉంచి, ముఖ్య ప్రత్యామ్నాయాలను పాదసూచికలో తెలిపింది.
