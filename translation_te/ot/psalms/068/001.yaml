source:
  edition: WLC
  text: יָק֣וּם אֱ֭לֹהִים יָפ֣וּצוּ אוֹיְבָ֑י/ו וְ/יָנ֥וּסוּ מְ֝שַׂנְאָ֗י/ו מִ/פָּנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/001.yaml
  text: God rises up; his enemies are scattered[a], and those who hate him flee from before him.
translation:
  language: te
  text: దేవుడు లేస్తాడు; ఆయన శత్రువులు చెదరిపోతారు[a]. ఆయనను ద్వేషించేవారు ఆయన సన్నిధి నుండి పారిపోతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, సంప్రదాయ ప్రార్థనాత్మక పఠనం ప్రకారం: “దేవుడు లేవుగాక; ఆయన శత్రువులు చెదరిపోవుగాక; ఆయనను ద్వేషించేవారు ఆయన సన్నిధి నుండి పారిపోవుగాక.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יָקוּם
  choice: లేస్తాడు
  rationale: קום అనే క్రియ యొక్క కాల్ అసంపూర్ణ రూపం. కవితా సందర్భంలో ఇది సజీవ ప్రకటనగానూ, కోరిక లేదా ప్రార్థనగానూ వినిపించవచ్చు. ప్రధాన పాఠంలోని ‘లేస్తాడు’ అనే రూపం క్రియాచిత్రాన్ని నిలుపుతూ ప్రకటనాత్మక భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపపరంగా బహువచనంగా కనిపించినా, ఇక్కడ ఏకవచన క్రియతో వచ్చి ఇశ్రాయేలు దేవుణ్ణి సూచిస్తోంది; అందువల్ల ఏకవచనమైన ‘దేవుడు’ సరైనది.
- source_word: יָפוּצוּ
  choice: చెదరిపోతారు
  rationale: פוץ అనే క్రియ యొక్క కాల్ అసంపూర్ణ బహువచన రూపం. శత్రువులకు కలిగే ఫలితాన్ని, కవితా సమాంతరతను సహజంగా వ్యక్తం చేయడానికి ‘చెదరిపోతారు’ ఎంచుకున్నాం.
- source_word: אֹיְבָיו
  choice: ఆయన శత్రువులు
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న నిర్మాణరూపం; స్వామ్యార్థాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: וְיָנוּסוּ
  choice: పారిపోతారు
  rationale: נוס అనే క్రియ యొక్క కాల్ అసంపూర్ణ బహువచన రూపం. భయంతో లేదా ఓటమితో దూరమవడాన్ని ఆధునిక తెలుగులో స్పష్టంగా, గంభీరంగా తెలియజేస్తుంది.
- source_word: מְשַׂנְאָיו
  choice: ఆయనను ద్వేషించేవారు
  rationale: నామవాచక విధిలో వాడిన కృదంతం. ‘ద్వేషించేవారు’ అనే అనువాదం మూలంలోని క్రియాశీల భావాన్ని నిలుపుతుంది.
- source_word: מִפָּנָיו
  choice: ఆయన సన్నిధి నుండి
  rationale: అక్షరార్థంగా ‘ఆయన ముఖం/సన్నిధి నుండి’. ‘ఆయన సన్నిధి నుండి’ అనే రూపం దేవుని సమక్షం నుండి వెనుదిరిగి పారిపోవడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: కవితాత్మక యుద్ధ-దైవప్రత్యక్ష సందర్భంలో ప్రారంభ అసంపూర్ణ క్రియల భావం
  choice: 'ప్రకటనాత్మక పఠనం: ‘దేవుడు లేస్తాడు; ఆయన శత్రువులు చెదరిపోతారు…’'
  alternative: 'కోరిక/ప్రార్థనాత్మక పఠనం: ‘దేవుడు లేవుగాక; ఆయన శత్రువులు చెదరిపోవుగాక…’'
  rationale: హీబ్రూ అసంపూర్ణ క్రియారూపాలు ఈ సందర్భంలో సజీవ ప్రకటనగానూ, ప్రార్థనాత్మక కోరికగానూ అర్థమవుతాయి. ప్రధాన పాఠం ప్రకటనాత్మక భావాన్ని ఇస్తుంది; సంప్రదాయ ప్రార్థనాత్మక పఠనాన్ని పాదసూచికలో ఉంచి మూలంలోని సందిగ్ధతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గంభీరమైన కవితా శైలిని ఉపయోగించాం. ‘సన్నిధి’ అనే పదం మూలంలోని ‘ముఖం/సమక్షం’ భావాన్ని సహజంగా మోస్తుంది; ఏ ప్రత్యేక సంఘ సిద్ధాంత భాషనూ చేర్చలేదు.
