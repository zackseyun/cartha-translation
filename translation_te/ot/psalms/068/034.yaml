  terminology: “వైభవం,” “ఇశ్రాయేలుపై,” “బలం,” and “ఆకాశాల్లో” are suitable renderings. Repeating “బలం” preserves the Hebrew poetic linkage of עֹז and עֻזּוֹ. The footnotes retain the literal alternative and the legitimate semantic range of שְׁחָקִים.
