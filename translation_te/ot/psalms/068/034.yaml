  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: תְּנ֥וּ עֹ֗ז לֵֽ/אלֹ֫הִ֥ים עַֽל יִשְׂרָאֵ֥ל גַּאֲוָת֑/וֹ וְ֝/עֻזּ֗/וֹ בַּ/שְּׁחָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/034.yaml
  text: Ascribe strength to God[a]; his majesty is over Israel[b], and his strength is in the skies.
translation:
  language: te
  text: 'దేవుని బలాన్ని కొనియాడండి[a];


    ఆయన వైభవం ఇశ్రాయేలుపై ఉంది,


    ఆయన బలం ఆకాశాల్లో ఉంది[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “దేవునికి బలాన్ని ఇవ్వండి.” ఇక్కడ ఇది దేవుని బలాన్ని అంగీకరించి కొనియాడమనే కవితాత్మక పిలుపు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “మేఘాల్లో,” లేదా “ఉన్నత ఆకాశాల్లో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ עֹז לֵאלֹהִים
  choice: దేవుని బలాన్ని గుర్తించి ప్రకటించండి
  rationale: תְּנוּ అనే క్రియకు అక్షరార్థంగా ‘ఇవ్వండి’ అని అర్థం. అయితే దేవునికి బలాన్ని మనుషులు సమకూర్చాలని కాక, ఆయన బలాన్ని అంగీకరించి చాటాలని ఈ స్తుతి కవిత పిలుస్తోంది. సహజమైన తెలుగులో ఆ భావాన్ని ఈ రూపం వ్యక్తం చేస్తుంది.
- source_word: גַּאֲוָתוֹ
  choice: ఆయన వైభవం
  rationale: ఈ నామవాచకం సందర్భానుసారం ఔన్నత్యం, మహోన్నతత్వం, వైభవం లేదా గర్వం అనే భావాలు ఇవ్వగలదు. దేవుని స్తుతించే ఈ సందర్భంలో ‘వైభవం’ సానుకూల భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుపై
  rationale: עַל ఇక్కడ ఇశ్రాయేలుపై విస్తరించి ఉన్న దేవుని వైభవాన్ని సూచిస్తుంది; అందువల్ల ‘పై’ అనే రూపం మూలంలోని స్థానిక లేదా ఆధిపత్య సంబంధాన్ని తెరిచి ఉంచుతుంది.
- source_word: וְעֻזּוֹ
  choice: ఆయన బలం
  rationale: ప్రారంభంలోని עֹז పదంతో ఉన్న కవితాత్మక పునరుక్తిని నిలుపుకోవడానికి రెండుచోట్లా ‘బలం’ వాడబడింది.
- source_word: בַּשְּׁחָקִים
  choice: ఆకాశాల్లో
  rationale: שְׁחָקִים కవిత్వంలో ఆకాశపు ఉన్నత ప్రదేశాలను, కొన్నిసార్లు మేఘాలను సూచిస్తుంది. ‘ఆకాశాల్లో’ విస్తృతమైన భావాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: మనుషులు దేవునికి నిజంగా బలాన్ని ఇస్తున్నారని ఆజ్ఞ సూచిస్తుందా?
  choice: దేవుని బలాన్ని గుర్తించి ప్రకటించండి
  alternative: దేవునికి బలాన్ని ఇవ్వండి
  rationale: మూలంలోని ‘ఇవ్వండి’ అనే కవితాత్మక ప్రయోగం దేవునికి లేని బలాన్ని మనుషులు అందిస్తారని చెప్పడం కాదు; ఆయనకున్న బలాన్ని అంగీకరించి ప్రకటించమనే పిలుపు. ప్రధాన పాఠం అపార్థాన్ని నివారిస్తుండగా, పాదసూచిక అక్షరార్థాన్ని భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన స్తుతి-కవితా శైలి ఉపయోగించబడింది. మూడు సమాంతర పాదాలు మూలంలోని సంక్షిప్తతను, ‘బలం’ అనే పదపు పునరుక్తిని నిలుపుతున్నాయి.
