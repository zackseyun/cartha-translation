source:
  edition: WLC
  text: יֶאֱתָ֣יוּ חַ֭שְׁמַנִּים מִנִּ֣י מִצְרָ֑יִם כּ֥וּשׁ תָּרִ֥יץ יָ֝דָ֗י/ו לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/031.yaml
  text: Nobles shall come from Egypt[b][a]; Cush shall quickly stretch out its hands to God.
translation:
  language: te
  text: 'ఈజిప్టు నుండి ప్రముఖులు[a] వస్తారు;

    కూషు దేవుని వైపు తన చేతులను త్వరగా చాపుతుంది.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఉన్నతాధికారులు,’ ‘రాయబారులు,’ ‘రాజకుమారులు.’ అరుదైన హెబ్రీ పదం బహుశా ఈజిప్టుకు చెందిన ఉన్నత స్థాయి వ్యక్తులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘కూషు దేవునికి తన చేతులు చాపడానికి త్వరపడుతుంది.’ హెబ్రీలో వ్యక్తిగా చిత్రించబడిన దేశాన్ని సూచించే ప్రత్యయం ఏకవచనంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶאֱתָיוּ
  choice: వస్తారు
  rationale: Qal అసంపూర్ణ క్రియ ఇక్కడ రావడం లేదా చేరుకోవడం అనే భావాన్ని సహజంగా ఇస్తుంది; కానుకలు తీసుకురావడం అనే భావాన్ని క్రియలో లేనందున చేర్చలేదు.
- source_word: חַשְׁמַנִּים
  choice: ప్రముఖులు
  rationale: అరుదైన ఈ నామవాచకం ఈ సందర్భంలో ఉన్నత స్థానం గల వ్యక్తులను సూచించే అవకాశం ఎక్కువ. ‘ప్రముఖులు’ వారి హోదాను తెలియజేస్తూనే వారు రాయబారులా, రాజకుమారులా అన్నది అనవసరంగా నిర్ధారించదు.
- source_word: מִנִּי מִצְרָיִם
  choice: ఈజిప్టు నుండి
  rationale: మూలం లేదా బయలుదేరిన ప్రదేశాన్ని సూచించే హెబ్రీ విభక్తికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: כּוּשׁ
  choice: కూషు
  rationale: తరువాతి కాలపు భౌగోళిక పేరుతో భర్తీ చేయకుండా హెబ్రీ స్థలనామాన్ని లిప్యంతరీకరించింది.
- source_word: תָּרִיץ
  choice: త్వరగా చాపుతుంది
  rationale: רוץ యొక్క Hiphil రూపంలోని వేగం లేదా త్వరపడడం అనే భావాన్ని, ‘చేతులు’ అనే కర్మతో సహజమైన తెలుగు వ్యక్తీకరణగా అందించింది.
- source_word: יָדָיו
  choice: తన చేతులను
  rationale: ఏకవచనంగా వ్యక్తీకరించబడిన కూషు దేశాన్నే తిరిగి సూచిస్తూ, 3వ పురుష ఏకవచన ప్రత్యయాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: לֵאלֹהִים
  choice: దేవుని వైపు
  rationale: לְ సూచించే దిశను స్పష్టంగా ఉంచి, చేతులు చాపే భంగిమను ప్రార్థన, ఆరాధన లేదా సమర్పణలో ఏదో ఒక్కదానికే పరిమితం చేయదు.
theological_decisions:
- issue: కూషు దేవుని వైపు చేతులు చాపడం అనే భంగిమ యొక్క అర్థం
  choice: దేవుని వైపు మళ్లిన ప్రార్థన, విన్నపం, ఆరాధన లేదా సమర్పణను సూచించగల తెరచిన వ్యక్తీకరణ
  alternative: ఇది ప్రత్యేకంగా కప్పం సమర్పించే దౌత్య చర్య లేదా సంపూర్ణ నిబంధనాత్మక చేర్పు అని నిర్ధారించడం
  rationale: చేతులు చాపడం అనే హెబ్రీ ప్రయోగం ప్రార్థన, విన్నపం, ఆరాధన లేదా సమర్పణను సూచించవచ్చు. వచనం ఖచ్చితమైన విధానాన్ని పేర్కొననందున అనువాదం ఆ సందిగ్ధతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన కవితా వాక్య నిర్మాణం వాడబడింది. ‘ప్రముఖులు’ అరుదైన హోదా పదాన్ని అతిగా నిర్దిష్టం చేయదు; ‘దేవుని వైపు’ భంగిమలోని దిశను, దాని ధార్మిక విస్తృతార్థాన్ని కాపాడుతుంది.
