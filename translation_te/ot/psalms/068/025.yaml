lexical_decisions:
- source_word: קִדְּמוּ
  choice: ముందుగా నడిచారు
  rationale: కדם అనే క్రియ ఇక్కడ ఊరేగింపులో ముందరి స్థానంలో సాగడాన్ని సూచిస్తుంది. ‘ముందుగా నడిచారు’ అనేది ఆ కదలికను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: שָׁרִים
  choice: గాయకులు
  rationale: ఇది שׁיר (‘పాడుట’) నుండి వచ్చిన రూపం; సంగీత సందర్భంలో పాట పాడేవారినే సూచిస్తుంది, ‘ప్రభువులు’ అనే అర్థాన్ని కాదు.
- source_word: אַחַר
  choice: వారి వెనుక
  rationale: ఊరేగింపులో స్థానక్రమాన్ని సూచించే ఈ పదాన్ని సహజమైన తెలుగులో ‘వారి వెనుక’ అని అనువదించాం.
- source_word: נֹגְנִים
  choice: వాద్యకారులు
  rationale: נגן వాద్యాలను వాయించేవారిని సూచిస్తుంది. ‘వాద్యకారులు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి ‘గాయకులు’తో సమాంతరతను నిలుపుతుంది.
- source_word: בְּתוֹךְ
  choice: మధ్యలో
  rationale: ఊరేగింపులో యువతుల స్థానాన్ని సూచించే ప్రాదేశిక భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עֲלָמוֹת
  choice: యువతులు
  rationale: ఈ పదం యౌవనస్థులైన స్త్రీలను సూచిస్తుంది. ‘కన్యలు’ అని అనువదిస్తే మూలపదం తప్పనిసరిగా చెప్పని కన్యత్వ భావం అదనంగా చేరవచ్చు.
- source_word: תּוֹפֵפוֹת
  choice: కంజీరలు మోగించే
  rationale: ఈ రూపం చేతితో వాయించే తాళవాద్యాన్ని కొట్టి లేదా మోగించి వాయించే చర్యను సూచిస్తుంది. ‘కంజీరలు మోగించే’ అనేది ఆ తాళవాద్య చర్యను స్పష్టంగా తెలియజేస్తుంది.
