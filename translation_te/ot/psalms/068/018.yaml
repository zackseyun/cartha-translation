source:
  edition: WLC
  text: עָ֘לִ֤יתָ לַ/מָּר֨וֹם שָׁ֘בִ֤יתָ שֶּׁ֗בִי לָקַ֣חְתָּ מַ֭תָּנוֹת בָּ/אָדָ֑ם וְ/אַ֥ף ס֝וֹרְרִ֗ים לִ/שְׁכֹּ֤ן יָ֬הּ אֱלֹהִֽים׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/018.yaml
  text: You ascended on high[a]; you led captivity captive; you received gifts among men, even among the rebellious[b], so that Yah God might dwell there.
translation:
  language: te
  text: 'నీవు ఉన్నత స్థలానికి ఎక్కావు;

    బందీలను పట్టుకొని నడిపించావు;

    మనుషుల మధ్య కానుకలు స్వీకరించావు[a]—

    తిరుగుబాటుదారుల మధ్య కూడా—

    యాహ్ దేవుడు అక్కడ నివసించేలా.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనుషుల నుండి కానుకలు స్వీకరించావు.” “మనుషులు” అనే పదానికి ముందు ఉన్న హీబ్రూ ఉపసర్గ ‘మధ్య’ అనే భావంతో పాటు ‘నుండి’ అనే మూలార్థాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యాహ్ దేవుడు వారి మధ్య నివసించేలా”; లేదా, “యాహ్ దేవునికి నివాసంగా.” హీబ్రూ చివరి వాక్యభాగం సంక్షిప్తంగా ఉండి ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: עָלִיתָ
  choice: ఎక్కావు
  rationale: עלה అనే క్రియలోని పైకి వెళ్లే భావాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: לַמָּרוֹם
  choice: ఉన్నత స్థలానికి
  rationale: మָרוֹם సూచించే ఎత్తు లేదా ఉన్నత ప్రదేశం అనే భావాన్ని స్థలాన్ని మరీ నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: שָׁבִיתָ שֶּׁבִי
  choice: బందీలను పట్టుకొని నడిపించావు
  rationale: మూలంలోని ఒకే ధాతువుతో ఏర్పడిన బలమైన విజయోత్సవ ప్రయోగాన్ని తెలుగులో యథాతథంగా పునరావృతం చేస్తే అసహజంగా ఉంటుంది; ఈ రూపం బందీలను చెరపట్టి విజయయాత్రలో నడిపించే చిత్రాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לָקַחְתָּ
  choice: స్వీకరించావు
  rationale: לקח సాధారణంగా ‘తీసుకోవడం’ అయినా, కానుకల సందర్భంలో ‘స్వీకరించడం’ సహజంగా ఉండి విజేతకు అందిన కానుకల దిశను తెలియజేస్తుంది.
- source_word: מַתָּנוֹת
  choice: కానుకలు
  rationale: మూల నామవాచకంలోని సాధారణ ‘బహుమతులు/కానుకలు’ భావాన్ని ‘కప్పం’ లేదా ‘అర్పణలు’ అని సందర్భాన్ని అధికంగా వ్యాఖ్యానించకుండా అందిస్తుంది.
- source_word: בָּאָדָם
  choice: మనుషుల మధ్య
  rationale: ב అనే ఉపసర్గను పరిధి లేదా సమూహం అనే భావంలో తీసుకొని, אָדָם యొక్క సమస్త మానవుల భావాన్ని లింగపరంగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘మనుషుల నుండి’ అనే మూలార్థ సాధ్యతను పాదటిప్పణిలో ఉంచింది.
- source_word: וְאַף סוֹרְרִים
  choice: తిరుగుబాటుదారుల మధ్య కూడా
  rationale: וְאַף లోని విస్తరణాత్మక ఉద్ఘాటనను ‘కూడా’ ద్వారా, סוֹרְרִים లోని మొండిగా ఎదిరించే వారి భావాన్ని ‘తిరుగుబాటుదారులు’ ద్వారా తెలియజేస్తుంది.
- source_word: לִשְׁכֹּן
  choice: నివసించేలా
  rationale: ל తో కూడిన క్రియానామం ఇక్కడ ఉద్దేశం లేదా ఫలితాన్ని సూచించగలదు; ‘నివసించేలా’ ఆ సంబంధాన్ని సహజంగా ఉంచుతుంది.
- source_word: יָהּ אֱלֹהִים
  choice: యాహ్ దేవుడు
  rationale: יָהּ అనే దైవనామపు సంక్షిప్త రూపాన్ని ‘యాహ్’గా లిప్యంతరీకరించి, אֱלֹהִים ను ‘దేవుడు’గా అనువదిస్తుంది; దీనిని పూర్తి దైవనామంతో కలపదు.
theological_decisions:
- issue: కానుకల వాక్యభాగంలో בָּאָדָם యొక్క సంబంధం
  choice: మనుషుల మధ్య
  alternative: మనుషుల నుండి
  rationale: ב ఉపసర్గ ఇక్కడ పరిధిని (‘మధ్య’) లేదా మూలాన్ని (‘నుండి’) సూచించవచ్చు. ప్రధాన పాఠం తక్కువ వ్యాఖ్యానాత్మకమైన పరిధి భావాన్ని ఉంచగా, మూలాన్ని సూచించే సాధ్యమైన పఠనాన్ని పాదటిప్పణి భద్రపరుస్తుంది.
- issue: చివరి భాగమైన לִשְׁכֹּן יָהּ אֱלֹהִים యొక్క సంక్షిప్త వాక్యనిర్మాణం
  choice: యాహ్ దేవుడు అక్కడ నివసించేలా
  alternative: యాహ్ దేవుడు వారి మధ్య నివసించేలా; యాహ్ దేవునికి నివాసంగా
  rationale: హీబ్రూ వాక్యభాగం సంక్షిప్తంగా ఉండి నివాసస్థలాన్ని స్పష్టంగా చెప్పదు. ‘అక్కడ’ అని సరఫరా చేయడం స్థలాన్ని లేదా ప్రజలను ఖచ్చితంగా నిర్ణయించకుండా తెలుగు వాక్యాన్ని సంపూర్ణం చేస్తుంది; ఇతర సాధ్యమైన నిర్మాణాలను పాదటిప్పణిలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గంభీరమైన కవితా లయతో రూపొందించబడింది. మూలంలోని పంక్తుల క్రమాన్ని సాధ్యమైనంతవరకు నిలిపి, తెలుగులో అసహజమైన ధాతు పునరుక్తిని సహజమైన విజయయాత్ర చిత్రంగా తెలిపింది. పరిష్కరించలేని రెండు హీబ్రూ సందిగ్ధతలను ప్రధాన పాఠంలో బలవంతంగా తీర్మానించకుండా పాదటిప్పణుల్లో భద్రపరిచింది.
