  text: צִוָּ֥ה אֱלֹהֶ֗י/ךָ עֻ֫זֶּ֥/ךָ עוּזָּ֥/ה אֱלֹהִ֑ים ז֝֗וּ פָּעַ֥לְתָּ לָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/028.yaml
  text: Your God has commanded your strength. Show strength[a], O God, you who have worked for us.
translation:
  language: te
  text: నీకు బలం కలగాలని నీ దేవుడు ఆజ్ఞాపించాడు. బలాన్ని కనబరచు[a], దేవా, మా కోసం కార్యం చేసినవాడా!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బలాన్ని కనబరచు’ అని అనువదించిన హీబ్రూ పదం అర్థం క్లిష్టమైనది. దీనిని ‘బలంగా ఉండు, దేవా’ అని కూడా అర్థం చేసుకోవచ్చు; లేదా తరువాతి వచనంతో కలిపి, ‘దేవా, మా కోసం నీవు చేసినదాన్ని బలపరచు’ అని అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: צִוָּה
  choice: ఆజ్ఞాపించాడు
  rationale: పూర్తయినప్పటికీ ప్రస్తుతం ప్రభావం కలిగిన అధికారపూర్వక ఆదేశాన్ని సూచించే క్రియాబలాన్ని నిలుపుతుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: రూపంలో బహువచనమైన אֱלֹהִים ఇక్కడ ఇశ్రాయేలు దేవుణ్ణి సూచించే ఏకవచనార్థంలో ఉంది; ప్రత్యయం రెండవ పురుష ఏకవచనం.
- source_word: עֻזֶּךָ
  choice: నీ బలాన్ని
  rationale: మూలంలోని రెండవ పురుష ఏకవచన స్వామ్యార్థాన్ని, ‘బలం/శక్తి’ అనే నామవాచక భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: עוּזָה
  choice: బలాన్ని కనబరచు
  rationale: అసాధారణమైన ఈ రూపాన్ని దేవుడు తన బలాన్ని వెల్లడించాలనే ప్రార్థనగా సహజమైన తెలుగులో అందిస్తుంది; మూలంలో లేని స్వామ్యసర్వనామాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: సందర్భంలోని సంబోధన భావాన్ని తెలుగు సంబోధనారూపం స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: זוּ
  choice: చేసినవాడా
  rationale: దేవుణ్ణి వర్ణించే సంబంధవాచక భావాన్ని ప్రత్యక్ష సంబోధనకు తగిన తెలుగు రూపంలో తెలియజేస్తుంది.
- source_word: פָּעַלְתָּ
  choice: కార్యం చేసిన
  rationale: దేవుని ప్రభావవంతమైన చర్యను విస్తరించకుండా సాధారణంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: לָּנוּ
  choice: మా కోసం
  rationale: ప్రజల మేలు కోసం దేవుడు కార్యం చేశాడనే హితార్థక భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: עוּזָה అనే సందిగ్ధ రూపం
  choice: 'దేవుడు బలాన్ని కనబరచాలనే విన్నపం: ‘బలాన్ని కనబరచు, దేవా’'
  alternative: ‘బలవంతుడవై ఉండు, దేవా’ లేదా తరువాతి వాక్యంతో కలిపి ‘దేవా, మా కోసం నీవు చేసినదాన్ని బలపరచు’
  rationale: హీబ్రూ రూపం వాక్యనిర్మాణపరంగా క్లిష్టమైనది. ప్రధాన పాఠ్యం ఈ వచనంలోనే ప్రార్థనా భావాన్ని సహజంగా ఉంచుతుంది; ప్రత్యామ్నాయాలను పాదటిప్పణిలో నిలుపుతూ సందిగ్ధతను అతిగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన ప్రార్థనా శైలిని వాడాం. ‘ఆజ్ఞాపించాడు’ అనే కొంత అసాధారణమైన కలయిక మూలపాఠంలోని ఉద్దేశపూర్వకమైన కఠినత్వాన్ని నిలుపుతుంది; [a] గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
