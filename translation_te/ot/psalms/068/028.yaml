revisions:
- from: నీ దేవుడు నీ బలాన్ని ఆజ్ఞాపించాడు. బలాన్ని కనబరచు[a], దేవా, మా కోసం కార్యం చేసినవాడా!
  to: నీకు బలం కలగాలని నీ దేవుడు ఆజ్ఞాపించాడు. బలాన్ని కనబరచు[a], దేవా, మా కోసం కార్యం చేసినవాడా!
  rationale: The revision makes the first Hebrew clause idiomatic in modern standard Telugu while retaining the authoritative force of ‘has commanded/ordained.’ It retains the main-text handling of the disputed עוּזָה and preserves all stated alternatives in the footnote, without importing the following verse into the translation itself.
