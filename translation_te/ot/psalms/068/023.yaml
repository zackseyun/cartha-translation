source:
  edition: WLC
  text: לְמַ֤עַן תִּֽמְחַ֥ץ רַגְלְ/ךָ֗ בְּ֫/דָ֥ם לְשׁ֥וֹן כְּלָבֶ֑י/ךָ מֵ/אֹיְבִ֥ים מִנֵּֽ/הוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/023.yaml
  text: so that your foot may crush them in blood[b][a], and the tongue of your dogs may have its portion from the enemies.
translation:
  language: te
  text: నీ పాదం రక్తంలో వారిని నలిపివేసేలా[b], నీ కుక్కల నాలుక శత్రువుల నుంచి తన వంతు పొందేలా[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: చివరి హీబ్రూ పదబంధం క్లిష్టంగా, సంక్షిప్తంగా ఉంది. “తన వంతు” అనేది సందర్భానుసారంగా వ్యక్తపరచిన భావం; చివరి హీబ్రూ రూపం దేని లేదా ఎవరి నుంచో అనే సూచనను స్పష్టంగా నిర్ధారించదు.
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: “నీ పాదం రక్తంలో నలిపేలా.” క్రియకు సూచిత కర్మగా “వారిని” ప్రధాన పాఠ్యంలో చేర్చబడింది.'
    reason: previous_rendering
lexical_decisions:
- source_word: לְמַעַן
  choice: —ఏలా
  rationale: ఈ పదం ఉద్దేశాన్ని లేదా ఫలితాన్ని సూచిస్తుంది. తెలుగులో రెండు సమాంతర క్రియలకు ‘—ఏలా’ అనే నిర్మాణం సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: תִּמְחַץ
  choice: నలిపివేసేలా
  rationale: מחץ అనే ధాతువు కొట్టడం, చితకగొట్టడం, నలిపివేయడం అనే బలమైన భావాన్ని ఇస్తుంది. యుద్ధంలోని తీవ్ర దృశ్యాన్ని ‘నలిపివేయు’ స్పష్టంగా నిలుపుతుంది.
- source_word: רַגְלְךָ
  choice: నీ పాదం
  rationale: హీబ్రూ రూపం ఏకవచనం, ద్వితీయ పురుష ఏకవచన సంబంధప్రత్యయంతో ఉంది; అందువల్ల బహువచనంగా మార్చకుండా ఏకవచనమే ఉంచబడింది.
- source_word: בְּדָם
  choice: రక్తంలో
  rationale: ב అనే ఉపసర్గను ఇక్కడ స్థల/పరిధి భావంతో సహజంగా అనువదించవచ్చు. ఇది రక్తంలో పాదం నలిపే తీవ్రమైన చిత్రణను నిలుపుతుంది.
- source_word: לְשׁוֹן כְּלָבֶיךָ
  choice: నీ కుక్కల నాలుక
  rationale: మూలంలో ‘నాలుక’ ఏకవచనంలో ఉండి సమూహార్థకంగా వాడబడింది. తెలుగు వాక్యం కూడా ఆ రూపాన్ని అర్థమయ్యే విధంగా నిలుపుతుంది.
- source_word: מֵאֹיְבִים
  choice: శత్రువుల నుంచి
  rationale: מן ఉపసర్గ మూలం లేదా దేనినుంచి లభించిందో సూచిస్తుంది; ‘శత్రువుల నుంచి’ ఆ సంబంధాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: מִנֵּהוּ
  choice: తన వంతు పొందేలా
  rationale: చివరి హీబ్రూ రూపం క్లిష్టమైనది, సంక్షిప్తమైనది. సందర్భంలో కుక్కల నాలుకకు శత్రువుల నుంచి భాగం దొరకడం అనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, పదశః ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: హింసాత్మక యుద్ధ చిత్రణ
  choice: రక్తంలో పాదం శత్రువులను నలిపివేయడం, కుక్కలకు శత్రువుల నుంచి భాగం దొరకడం అనే నిర్దిష్ట చిత్రణను నిలుపడం
  alternative: దీనిని సాధారణ విజయ ప్రకటనగా మృదువుగా చెప్పడం
  rationale: మూలవచనం ఉద్దేశపూర్వకంగా తీవ్రమైన యుద్ధ చిత్రణను ఉపయోగిస్తుంది. దానిని సిద్ధాంతపరమైన లేదా ఆధునిక అభిరుచుల కారణంగా మృదువుచేయకుండా దాని ఉద్రిక్తతను నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. హీబ్రూ కవిత్వంలోని సమాంతర నిర్మాణాన్ని రెండు ‘—ఏలా’ క్రియారూపాలతో నిలిపాం; అయితే చివరి భాగంలోని మూలభాషా అస్పష్టతను పాదసూచికలో స్పష్టంగా గుర్తించాం.
