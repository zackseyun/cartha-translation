source:
  edition: WLC
  text: בְּ/פָ֘רֵ֤שׂ שַׁדַּ֓י מְלָ֘כִ֤ים בָּ֗/הּ תַּשְׁלֵ֥ג בְּ/צַלְמֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/014.yaml
  text: When the Almighty scattered kings there, it snowed on Zalmon.
translation:
  language: te
  text: సర్వశక్తిమంతుడు అక్కడ[a] రాజులను చెదరగొట్టినప్పుడు, సల్మోనుపై మంచు కురిసింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదాన్ని అక్షరార్థంగా “దానిలో” లేదా “ఆమెలో” అని కూడా అనువదించవచ్చు; అది దేనిని సూచిస్తుందో స్పష్టంగా లేదు.
    reason: בָּהּ అనే స్త్రీలింగ సూచన పదంలోని నిజమైన అనిశ్చితిని పరిరక్షించడం.
  - marker: b
    text: “నీవు సల్మోనుపై మంచు కురిపించావు” అని కూడా అనువదించవచ్చు. “సల్మోను” బహుశా ఒక పర్వతం లేదా ప్రాంతం పేరు.
    reason: תַּשְׁלֵג క్రియారూపానికి సాధ్యమైన ప్రత్యామ్నాయ పఠనాన్నీ, צַלְמוֹן స్థలనామ స్వభావాన్నీ తెలియజేయడం.
lexical_decisions:
- source_word: שַׁדַּי
  choice: సర్వశక్తిమంతుడు
  rationale: ‘షద్దయి’ అనే దైవనామానికి సందర్భానుగుణంగా, సాధారణ తెలుగు పాఠకులకు అర్థమయ్యే సంప్రదాయ అర్థరూపం.
- source_word: פָרֵשׂ
  choice: చెదరగొట్టినప్పుడు
  rationale: రాజులను విస్తరింపజేయడం లేదా చెల్లాచెదురు చేయడం అనే మూలభావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בָּהּ
  choice: అక్కడ
  rationale: హీబ్రూ స్త్రీలింగ ఏకవచన సూచనకు పూర్వపదం స్పష్టంగా లేకపోవడంతో, సందర్భానికి సరిపోయే స్థలార్థక రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి అస్పష్టతను పాదసూచికలో తెలిపాం.
- source_word: תַּשְׁלֵג
  choice: మంచు కురిసింది
  rationale: రూపం అరుదైనదీ, వ్యాకరణపరంగా బహుళ విధాల అర్థమయ్యేదీ అయినప్పటికీ, సందర్భంలో మంచు సంభవాన్ని తెలిపే సహజ తెలుగు వాక్యంగా ఇచ్చాం.
- source_word: צַלְמוֹן
  choice: సల్మోను
  rationale: స్థలనామాన్ని అర్థానువాదం చేయకుండా తెలుగు లిప్యంతరీకరణలో నిలిపాం.
theological_decisions:
- issue: ‘షద్దయి’ అనే దైవనామం
  choice: సర్వశక్తిమంతుడు
  alternative: షద్దయి
  rationale: దైవనామపు భావాన్ని పాఠకులకు నేరుగా తెలియజేస్తుంది; ప్రత్యేక మతశాఖీయ వ్యాఖ్యానాన్ని చేర్చదు.
- issue: మంచు క్రియకు కర్త
  choice: మంచు కురిసింది
  alternative: నీవు మంచు కురిపించావు
  rationale: హీబ్రూ క్రియారూపంలోని అస్పష్టతను ప్రధాన పాఠ్యంలో సహజ వాతావరణ వర్ణనగా ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో పరిరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గంభీరతతోనూ సాధారణ పాఠకులకు స్పష్టంగానూ రూపొందించబడింది. మూలంలోని సంక్షిప్తతను నిలిపి, వ్యాకరణ మరియు స్థలసూచక అస్పష్టతలను పాదసూచికల్లో చూపించాం.
