  yaml_path: translation/ot/psalms/068/022.yaml
  text: The Lord said[a], “I will bring them back from Bashan; I will bring them back from the depths of the sea,”
translation:
  language: te
  text: 'ప్రభువు ఇలా అన్నాడు: “బాషాను నుండి వారిని తిరిగి తీసుకొస్తాను; సముద్రపు అగాధాల నుండి వారిని తిరిగి తీసుకొస్తాను.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “బాషాను నుండి తిరిగి తీసుకొస్తాను; సముద్రపు అగాధాల నుండి తిరిగి తీసుకొస్తాను.” హీబ్రూలో ఎవరిని తిరిగి తీసుకొస్తానో అనే కర్మ పేర్కొనబడలేదు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: ప్రభువు
  rationale: ఇది యెహోవా అనే దైవనామం కాదు, దేవునికి వాడిన గౌరవ బిరుదు. ఆధునిక ప్రామాణిక తెలుగులో ‘ప్రభువు’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: אָמַר
  choice: ఇలా అన్నాడు
  rationale: దైవవాక్యాన్ని నేరుగా పరిచయం చేసే కతల్ రూపాన్ని సహజమైన తెలుగు భూతకాలంతో అనువదించాం; ‘ఇలా’ ప్రత్యక్ష వాక్యానికి సులభమైన అనుసంధానం ఇస్తుంది.
- source_word: מִבָּשָׁן
  choice: బాషాను నుంచి
  rationale: మִן ఉపసర్గకు ‘నుంచి’ సహజమైన సమానం; బాషాను స్థలనామంగా లిప్యంతరీకరించబడింది.
- source_word: אָשִׁיב ... אָשִׁיב
  choice: వారిని తిరిగి తీసుకొస్తాను ... వారిని తిరిగి తీసుకొస్తాను
  rationale: שוב హిఫిల్ రూపంలోని ‘తిరిగి తీసుకురావడం’ అనే సకర్మక భావాన్ని వ్యక్తం చేస్తుంది. హీబ్రూలో కర్మ స్పష్టంగా లేకపోయినా తెలుగులో సహజత కోసం ‘వారిని’ చేర్చాం; పునరుక్తిని ఉద్ఘాటన కోసం నిలిపాం.
- source_word: מִמְּצֻלוֹת יָם
  choice: సముద్రపు అగాధాల నుంచి
  rationale: מְצֻלוֹת నీటి లోతైన ప్రదేశాలను సూచిస్తుంది. ‘సముద్రపు అగాధాలు’ మూలంలోని తీవ్ర లోతు, దూరం అనే చిత్రాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: אָשִׁיב అనే పునరుక్త క్రియకు స్పష్టంగా చెప్పని కర్మ
  choice: ప్రధాన పాఠ్యంలో ‘వారిని’ చేర్చడం
  alternative: ‘బాషాను నుంచి తిరిగి తీసుకొస్తాను; సముద్రపు అగాధాల నుంచి తిరిగి తీసుకొస్తాను’ అని కర్మను చెప్పకుండా ఉంచడం
  rationale: హీబ్రూ కర్మను చెప్పకుండా వదిలింది. అయితే సకర్మక క్రియతో తెలుగు వాక్యం సహజంగా ఉండేందుకు సందర్భం సూచించే ‘వారిని’ చేర్చాం. పాదటిప్పణిలో మూలంలోని అస్పష్టతను స్పష్టంగా తెలిపాం; వారు దేవుని ప్రజలా లేక శత్రువులా అన్న సందర్భాన్వయ ప్రశ్నను అనువాదంలో నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే కీర్తనకు తగిన గౌరవప్రదమైన శైలి. ‘నుంచైనా’ ద్వారా దూరమైన రెండు ప్రదేశాల నుంచికూడా తీసుకురాగల భావాన్ని సహజంగా వ్యక్తం చేశాం; మూలంలోని కర్మలేమిని పాదటిప్పణిలో భద్రపరిచాం.
