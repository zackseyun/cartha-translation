translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక పునరుక్తిని నిలుపుతూ సరళమైన, గౌరవప్రదమైన శైలి వాడబడింది. “ఇంటిలో ఉండే స్త్రీ” ద్వారా మూలంలోని స్త్రీలింగ ఏకవచనం కాపాడబడింది; “దోపుడుసొమ్ము” యుద్ధసందర్భాన్ని స్పష్టం చేస్తుంది.
