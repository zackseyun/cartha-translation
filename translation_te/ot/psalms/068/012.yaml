translation:
  language: te
  text: 'సైన్యాల రాజులు పారిపోతారు, పారిపోతారు;

    ఇంట్లో ఉండే స్త్రీ దోపుడుసొమ్మును పంచుతుంది.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇంటి యజమానురాలు దోపుడుసొమ్మును పంచుతుంది” / “ఇంట్లో నివసించే ఆమె దోపుడుసొమ్మును పంచుతుంది.” హెబ్రీ పదబంధం స్త్రీలింగ ఏకవచనంలో ఉంది; ఇంటివద్ద ఉండి యుద్ధంలో సంపాదించిన దోపుడుసొమ్మును స్వీకరించి పంచే స్త్రీని ఇది సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכֵי צְבָאוֹת
  choice: సైన్యాల రాజులు
  rationale: మַלְכֵי అనే బహువచన నిర్మిత రూపాన్నీ, צְבָאוֹת యొక్క సైనిక అర్థాన్నీ నేరుగా నిలుపుతుంది; దేవుని బిరుదుకు సంబంధించిన భావాన్ని అనవసరంగా చేర్చదు.
- source_word: יִדֹּדוּן יִדֹּדוּן
  choice: పారిపోతున్నారు, పారిపోతున్నారు
  rationale: נדד ధాతువు సూచించే పారిపోవడాన్ని, హెబ్రీ కవిత్వంలోని ఉద్ఘాటనాత్మక పునరుక్తిని యథాతథంగా నిలుపుతుంది.
- source_word: וּנְוַת בַּיִת
  choice: ఇంటిలో ఉండే స్త్రీ
  rationale: ఈ పదబంధంలోని స్త్రీలింగ ఏకవచనాన్ని స్పష్టంగా నిలుపుతూ, ఇంటివద్ద మిగిలి ఉన్న స్త్రీ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תְּחַלֵּק
  choice: పంచుతుంది
  rationale: పీయేల్ రూపం సూచించే విభజించి పంచిపెట్టడం అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שָׁלָל
  choice: దోపుడుసొమ్ము
  rationale: యుద్ధంలో స్వాధీనం చేసుకున్న సంపద అనే అర్థాన్ని సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
