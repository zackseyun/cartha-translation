translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తన కవిత్వానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకునికి అర్థమయ్యే పదాలను వాడాం. వివాదాస్పదమైన שְׁפַתָּיִם అర్థాన్ని ప్రధాన పాఠంలో అతిగా వివరించకుండా ప్రత్యామ్నాయాలను పాదసూచికలో నిలిపాం.
