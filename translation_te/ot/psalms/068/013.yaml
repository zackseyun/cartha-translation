  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִֽם תִּשְׁכְּבוּ/ן֮ בֵּ֪ין שְׁפַ֫תָּ֥יִם כַּנְפֵ֣י י֭וֹנָה נֶחְפָּ֣ה בַ/כֶּ֑סֶף וְ֝/אֶבְרוֹתֶ֗י/הָ בִּֽ/ירַקְרַ֥ק חָרֽוּץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/013.yaml
  text: Though you lie down among the sheepfolds[a], the wings of a dove are covered with silver[b], and her pinions with yellow gold.
translation:
  language: te
  text: 'మీరు గొర్రెల దొడ్ల మధ్య పడుకున్నప్పటికీ[a],


    పావురపు రెక్కలు వెండితో కప్పబడి ఉన్నాయి;


    దాని రెక్కల పొడవాటి ఈకలు పసుపుపచ్చని బంగారంతో కప్పబడి ఉన్నాయి[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘జీనుకు ఇరువైపులా ఉండే సంచుల మధ్య’; లేదా ‘పొయ్యి రాళ్ల మధ్య.’ ఇక్కడి హీబ్రూ పదానికి ఖచ్చితమైన అర్థం తెలియదు.
    reason: lexical_alternative
  - marker: b
    text: మూలపాఠానికి మరింత అక్షరార్థంగా, ‘ఆకుపచ్చటి బంగారంతో’ లేదా ‘బంగారపు పసుపు-ఆకుపచ్చ మెరుపుతో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: పడుకున్నా
  rationale: కావ్య సందర్భంలో אִם షరతును లేదా concessive భావాన్ని సూచించవచ్చు. ‘పడుకున్నా’ అనేది ‘పడుకున్నప్పటికీ’ అనే సంభావ్య భావాన్ని సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తూ కొంత అస్పష్టతను నిలుపుతుంది.
- source_word: תִּשְׁכְּבוּן
  choice: మీరు ... పడుకున్నా
  rationale: שׁכב అనే మూలపదంలోని శారీరకంగా పడుకోవడం అనే చిత్రాన్ని నేరుగా నిలుపుతుంది; బహువచన సంబోధనను ‘మీరు’ స్పష్టం చేస్తుంది.
- source_word: בֵּין שְׁפַתָּיִם
  choice: గొర్రెల దొడ్ల మధ్య
  rationale: ఈ అరుదైన హీబ్రూ పదబంధం అర్థం వివాదాస్పదం. సంప్రదాయబద్ధమైన ‘గొర్రెల దొడ్లు’ ప్రధాన పాఠంలో ఉంచి, ఇతర ముఖ్య అవకాశాలను పాదసూచికలో ఇచ్చాం.
- source_word: כַּנְפֵי יוֹנָה
  choice: పావురపు రెక్కలు
  rationale: హీబ్రూ సమాసాన్ని ఆధునిక తెలుగులో సహజంగా, చిత్రాన్ని యథాతథంగా వ్యక్తం చేస్తుంది.
- source_word: נֶחְפָּה בַכֶּסֶף
  choice: వెండితో కప్పబడి ఉన్నాయి
  rationale: חפה లోని కప్పబడటం లేదా పైపూత వేయబడటం అనే భావాన్ని అనవసర వివరణ లేకుండా స్పష్టంగా అందిస్తుంది.
- source_word: אֶבְרוֹתֶיהָ
  choice: దాని రెక్కల పొడవాటి ఈకలు
  rationale: אברה సాధారణ ఈకలను కాక ఎగరడానికి ఉపయోగపడే పెద్ద రెక్క ఈకలను సూచిస్తుంది. సాధారణ పాఠకునికి అర్థమయ్యేలా ‘పినియన్లు’ వంటి అరుదైన పదానికి బదులు వివరణాత్మకమైన సహజ పదబంధాన్ని వాడాం.
- source_word: בִּירַקְרַק חָרוּץ
  choice: పసుపుపచ్చని బంగారంతో
  rationale: חָרוּץ ఇక్కడ బంగారాన్ని, יְרַקְרַק పసుపు-ఆకుపచ్చ లేదా ఆకుపచ్చటి ఛాయను సూచిస్తుంది. ‘పసుపుపచ్చని బంగారం’ రంగు మరియు పదార్థం రెండింటినీ సహజంగా అందిస్తుంది; రంగు సూక్ష్మతను పాదసూచిక వివరిస్తుంది.
