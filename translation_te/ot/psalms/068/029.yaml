  yaml_path: translation/ot/psalms/068/029.yaml
  text: From your temple above Jerusalem[c][b][a], kings will bring tribute to you.
translation:
  language: te
  text: యెరూషలేములోని నీ ఆలయంవల్ల[a] రాజులు నీకు కానుకలు[b] తీసుకొస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెరూషలేముకు ఎగువన ఉన్న నీ ఆలయం నుండి రాజులు నీకు కానుకలు తీసుకొస్తారు.”
    reason: alternative_reading
  - marker: b
    text: “కానుకలు” అనే పదాన్ని ఇక్కడ ఉన్నతునికి సమర్పించే “కప్పం” లేదా “గౌరవ కానుకలు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהֵיכָלֶךָ
  choice: నీ ఆలయం నుండి
  rationale: מִן యొక్క సహజమైన మూలస్థాన భావాన్ని ‘నుండి’ తెలియజేస్తుంది; הֵיכָל ఇక్కడ దేవుని ఆలయాన్ని సూచిస్తుంది.
- source_word: עַל יְרוּשָׁלִָם
  choice: యెరూషలేముకు ఎగువన ఉన్న
  rationale: עַל లోని ‘మీద/ఎగువన’ అనే స్థలసంబంధ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ఆలయం ఉన్న ఎత్తైన ప్రదేశాన్నీ సూచించగలదు.
- source_word: לְךָ
  choice: నీకు
  rationale: రాజులు తీసుకొచ్చే కానుకను స్వీకరించేవాడు దేవుడని తెలిపే సంప్రదానార్థక రూపం.
- source_word: יוֹבִילוּ
  choice: తీసుకొస్తారు
  rationale: יבל హిఫిల్ రూపం కానుకను ఒకరి దగ్గరకు తీసుకురావడం అనే సందర్భోచిత భావాన్ని ఇస్తుంది.
- source_word: מְלָכִים
  choice: రాజులు
  rationale: మూలపదంలోని రాజరిక చిత్రణను నేరుగా నిలుపుతుంది.
- source_word: שָׁי
  choice: కానుకలు
  rationale: ఈ పదం ఉన్నతునికి సమర్పించే కానుక లేదా కప్పాన్ని సూచించగలదు. ‘కానుకలు’ సాధారణ పాఠకులకు సహజంగా ఉండి, సమర్పణ భావాన్ని నిలుపుతుంది; రాజకీయ గౌరవార్పణ భావం పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: ఆలయాన్ని యెరూషలేముతో అనుసంధానించే వాక్యనిర్మాణం
  choice: ఆలయం యెరూషలేముకు ఎగువన ఉన్నదని, రాజులు ఆ ఆలయం నుండి/దాని సంబంధంగా దేవునికి కానుకలు తీసుకొస్తారని ప్రధాన పాఠం సూచిస్తుంది.
  alternative: ‘యెరూషలేములోని నీ ఆలయం కారణంగా, రాజులు నీకు కానుకలు తీసుకొస్తారు.’
  rationale: מִן ను మూలస్థానార్థకంగా, עַל ను స్థలసంబంధంగా తీసుకోవడం హెబ్రీ ఉపసర్గల ప్రాథమిక భావాలను నిలుపుతుంది. అయితే కారణార్థక, సాధారణ స్థానార్థక అన్వయమూ వ్యాకరణపరంగా సాధ్యమైనందున దాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ఎగువన ఉన్న’ అనేది ‘పైన’ వల్ల కలగగల తేలియాడుతున్నట్టున్న అపార్థాన్ని నివారిస్తూ עַל యొక్క స్థలభావాన్ని నిలుపుతుంది. హెబ్రీ ఏకవచన సమూహార్థక שָׁי ను సహజమైన తెలుగు వాడుక కోసం ‘కానుకలు’గా ఇచ్చాం.
