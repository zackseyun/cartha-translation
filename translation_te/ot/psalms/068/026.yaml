source:
  edition: WLC
  text: בְּֽ֭/מַקְהֵלוֹת בָּרְכ֣וּ אֱלֹהִ֑ים יְ֝הוָ֗ה מִ/מְּק֥וֹר יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/026.yaml
  text: In the assemblies[a], bless God, the Lord[b], from the fountain of Israel.
translation:
  language: te
  text: 'సభలలో దేవుణ్ణి స్తుతించండి—

    ఇశ్రాయేలు ఊట నుండి యాహ్వేను.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּמַקְהֵלוֹת
  choice: సభల్లో
  rationale: మూలంలోని బహువచనాన్ని నిలుపుతూ, కూడివచ్చిన ఆరాధక సమూహాలను సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: בָּרְכוּ
  choice: స్తుతించండి
  rationale: בּרך అనే క్రియకు ప్రాథమికంగా ‘దీవించు’ అనే భావం ఉన్నా, దేవుడు కర్మగా వచ్చినప్పుడు ఆరాధనలో ఆయనను కొనియాడడం లేదా స్తుతించడం అని అర్థం. ‘దేవుణ్ణి దీవించండి’ కంటే ‘స్తుతించండి’ సాధారణ తెలుగు పాఠకులకు సహజంగా ఉంటుంది.
- source_word: אֱלֹהִים
  choice: దేవుణ్ణి
  rationale: ఇక్కడ యాహ్వేతో సమాంతరంగా ఉన్నందున ఏకవచన దేవుణ్ణి సూచిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వేను
  rationale: దైవనామమైన నాలుగు హల్లుల పేరును బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణను తెలుగులో అందిస్తుంది.
- source_word: מִמְּקוֹר יִשְׂרָאֵל
  choice: ఇశ్రాయేలు మూలం నుండి వచ్చినవారలారా
  rationale: మూలభాషలో సంక్షిప్తంగా, సంబంధం స్పష్టంగా చెప్పని పదబంధం ఇది. సందర్భానుసారం ఇశ్రాయేలు వంశమూలం నుండి వచ్చిన ఆరాధకులను సంబోధిస్తున్న పఠనాన్ని ప్రధాన పాఠ్యంలో సహజంగా వ్యక్తం చేస్తుంది; అక్షరార్థ చిత్రాన్ని పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: హీబ్రూ పాఠ్యంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని ఒక బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
- issue: מִמְּקוֹר יִשְׂרָאֵל అనే సంక్షిప్త పదబంధం ఎవరిని విశేషిస్తుంది
  choice: ఇశ్రాయేలు మూలం నుండి వచ్చిన ఆరాధకులకు సంబోధనగా
  alternative: ‘ఇశ్రాయేలు ఊట నుండి’ అనే క్రియావిశేషణ పదబంధంగా
  rationale: హీబ్రూ వాక్యం సంబంధాన్ని స్పష్టంగా తెలపదు. ప్రధాన పాఠ్యంలో సహజమైన సంబోధన పఠనాన్ని ఇచ్చి, అక్షరార్థమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ద్వారా అస్పష్టతను పూర్తిగా దాచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామూహిక ఆరాధనకు తగిన గౌరవప్రదమైన కవితా శైలిని వాడాం. అస్పష్టమైన హీబ్రూ నిర్మాణాన్ని తెలుగులో చదవదగినదిగా చేయడానికి రెండోసారి ‘స్తుతించండి’ని పూరించాం; అది మూలంలో పునరుక్తం కాలేదు. ‘సభలు’ అనే పదం మతసంస్థలకే పరిమితం కాకుండా కూడివచ్చిన సమూహాల భావాన్ని ఇస్తుంది.
