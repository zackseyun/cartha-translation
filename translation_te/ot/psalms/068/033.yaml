  text: to him who rides in the highest heavens[a], which are from ancient times—behold, he gives forth his voice[b], a mighty voice.
translation:
  language: te
  text: ప్రాచీనకాలం నాటి అత్యున్నత ఆకాశాల్లో స్వారీ చేసే ఆయనకు[a]—ఇదిగో, ఆయన తన స్వరాన్ని వినిపిస్తాడు—బలమైన స్వరాన్ని.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ప్రాచీనకాలం నాటి ఆకాశాల ఆకాశాల్లో స్వారీ చేసే ఆయనకు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆయన తన స్వరాన్ని వెలువరిస్తాడు—బలముగల స్వరాన్ని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לָ/רֹכֵב
  choice: స్వారీచేసే ఆయనకు
  rationale: ముందటి వచనంలోని ఆజ్ఞకు ל ఉపసర్గ అనుసంధానమై పరోక్ష కర్మను సూచిస్తుంది; רֹכֵב కృదంతం నామవాచకంగా దేవుణ్ణి ‘స్వారీచేసే ఆయన’గా వర్ణిస్తుంది.
- source_word: בִּ/שְׁמֵי שְׁמֵי
  choice: అత్యున్నత ఆకాశాల్లో
  rationale: ‘ఆకాశాల ఆకాశాలు’ అనే హీబ్రూ నిర్మాణం అత్యున్నత ఆకాశాలను సూచించే అతిశయోక్తి రూపం; తెలుగు సహజత్వంతో ఆ భావాన్ని ఇస్తుంది.
- source_word: קֶדֶם
  choice: పూర్వకాలం నుంచీ ఉన్న
  rationale: ఇక్కడ పదం దిక్కును కాక కాలపరమైన ప్రాచీనతను సూచించి ఆకాశాలను విశేషిస్తుంది.
- source_word: הֵן
  choice: ఇదిగో
  rationale: దృష్టిని ఆకర్షించే కవితాత్మక అవ్యయ బలాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: יִתֵּן בְּ/קוֹל/וֹ
  choice: తన స్వరాన్ని వినిపిస్తాడు
  rationale: అక్షరార్థంగా ‘తన స్వరాన్ని ఇస్తాడు’; సందర్భంలో స్వరాన్ని వెలువరించడం లేదా వినిపించడం అనే హీబ్రూ నుడికారార్థం ఉంది.
- source_word: קוֹל עֹז
  choice: బలమైన స్వరాన్ని
  rationale: ‘బలముగల స్వరం’ అనే నిర్మాణాన్ని సహజమైన తెలుగులో అందిస్తూ దాని శక్తిని నిలుపుతుంది.
theological_decisions:
- issue: స్వారీచేసే వ్యక్తి ఎవరనే సందర్భార్థం
  choice: చుట్టుపక్కల సందర్భంలో ఇశ్రాయేలు దేవుణ్ణే సూచించే దైవిక స్వారీ రూపకంగా ఉంచడం
  alternative: తరువాతి మెస్సీయ సంబంధ అన్వయంతో లేదా దేవదూత సంబంధ గుర్తింపుతో ప్రత్యేకంగా నిర్ధారించడం
  rationale: హీబ్రూ సందర్భం నేరుగా దేవుణ్ణి మహోన్నత కవితాత్మక రూపంలో వర్ణిస్తుంది; ప్రధాన పాఠ్యంలో తరువాతి సిద్ధాంతపరమైన గుర్తింపును చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గౌరవప్రదమైన కవితాత్మక ధోరణి. ‘ఆకాశాల ఆకాశాలు’ అనే అక్షర నిర్మాణాన్ని ప్రధాన పాఠ్యంలో సహజమైన ‘అత్యున్నత ఆకాశాలు’గా ఇచ్చి, మూలరూపాన్ని పాదటిప్పణిలో నిలిపాం.
