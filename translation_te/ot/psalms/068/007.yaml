  text: God[a], when you went out before your people, when you marched through the wilderness—Selah
translation:
  language: te
  text: 'దేవా, నీవు నీ ప్రజల ముందుగా బయలుదేరినప్పుడు,

    నీవు నిర్జన ప్రదేశంలో సాగినప్పుడు—సెలా[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిర్జన ప్రదేశం’ అనే హీబ్రూ పదాన్ని ‘ఎడారి’ లేదా ‘బంజరు ప్రదేశం’ అని కూడా అనువదించవచ్చు. ‘సెలా’ అనే పదం యొక్క ఖచ్చితమైన అర్థం తెలియదు; అది బహుశా సంగీత లేదా ఆరాధనా సూచన కావచ్చు.
    reason: lexical_alternative_and_uncertain_liturgical_term
lexical_decisions:
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: వాక్యారంభంలోని పదం సందర్భంలో ప్రత్యక్ష సంబోధనగా పనిచేస్తుంది. తెలుగులో సంబోధనను సహజంగా, స్పష్టంగా తెలియజేయడానికి ‘దేవా’ అని ఇచ్చాం.
- source_word: בְּצֵאתְךָ
  choice: నీవు ... బయలుదేరినప్పుడు
  rationale: בְּ + క్రియానామ రూపం ఇక్కడ కాలార్థాన్ని ఇస్తుంది; ‘బయలుదేరినప్పుడు’ సంఘటనాత్మక భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: לִפְנֵי עַמֶּךָ
  choice: నీ ప్రజలకు ముందుగా
  rationale: దేవుడు తన ప్రజలను ముందుండి నడిపిస్తున్న దృశ్యాన్ని లִפְנֵי యొక్క ‘ముందుగా/ముందు’ భావంతో కాపాడుతుంది.
- source_word: בְּצַעְדְּךָ
  choice: నీవు ... నడిచినప్పుడు
  rationale: צעד అడుగులు వేస్తూ సాగడాన్ని సూచిస్తుంది. దేవుని ఉద్దేశపూర్వక గమనాన్ని తెలియజేస్తూ, తెలుగులో అతిగా సైనిక భావాన్ని చేర్చకుండా ‘నడిచినప్పుడు’ అని ఇచ్చాం.
- source_word: בִישִׁימוֹן
  choice: నిర్జన ప్రదేశంలో
  rationale: יְשִׁימוֹן జనావాసం లేని ఎడారి లేదా బంజరు ప్రాంతాన్ని సూచిస్తుంది. స్థలార్థక בִּను అనుసరించి ‘లో’ను ఉంచి, పదంలోని విస్తృత నిర్జన భావాన్ని నిలిపాం.
- source_word: סֶלָה
  choice: సెలా
  rationale: దీని ఖచ్చితమైన ప్రార్థనా లేదా సంగీత సంబంధమైన విధి అనిశ్చితం కాబట్టి అర్థాన్ని ఊహించి అనువదించకుండా లిప్యంతరీకరించాం.
theological_decisions:
- issue: అరణ్య ప్రయాణంలో దేవుని కార్యం
  choice: దేవుడు తన ప్రజలకు ముందుగా బయలుదేరి నిర్జన ప్రదేశంలో నడిచిన సంగతిని ఆయనకే ప్రత్యక్షంగా సంబోధిస్తూ జ్ఞాపకం చేయడం
  alternative: దేవుని గురించి పరోక్షంగా వర్ణించడం
  rationale: ద్వితీయ పురుష ఏకవచన ప్రత్యయాలు మరియు కీర్తన సందర్భం ప్రత్యక్ష సంబోధనకు మద్దతిస్తాయి. అదనపు సిద్ధాంత వివరణను చేర్చకుండా దేవుని నాయకత్వ దృశ్యాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గంభీరతతోనూ సాధారణ పాఠకులకు అర్థమయ్యే సహజ వాక్యనిర్మాణంతోనూ రూపొందించాం. హీబ్రూ కవితా సమాంతర నిర్మాణాన్ని రెండు పాదాలుగా నిలిపాం.
