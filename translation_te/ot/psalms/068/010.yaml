source:
  edition: WLC
  text: חַיָּתְ/ךָ֥ יָֽשְׁבוּ בָ֑/הּ תָּ֤כִ֥ין בְּ/טוֹבָתְ/ךָ֖ לֶ/עָנִ֣י אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/010.yaml
  text: Your creatures settled in it; in your goodness[a], O God, you provided for the poor.
translation:
  language: te
  text: 'నీ జీవులు[a] అందులో నివసించాయి;

    దేవా, నీ మంచితనంతో పేదవాని కోసం ఏర్పాటుచేశావు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ పదం חַיָּתְךָ అర్థం నిర్ధారించడం కష్టం; దీనిని “నీ సజీవ ప్రాణులు,” “నీ సమూహం,” లేదా “నీ సంఘం” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: חַיָּתְךָ
  choice: నీ జీవసమూహం
  rationale: חַיָּה సాధారణంగా జీవి లేదా జంతువును సూచించినా, ఇక్కడ ఏకవచన సమూహార్థంలో దేవునికి చెందిన జీవుల సమూహాన్ని సూచించవచ్చు. ‘జీవసమూహం’ మూలపదంలోని జీవార్థాన్ని నిలుపుతూ, అది మనుషుల సమూహమా లేక ఇతర జీవులా అనే కవితాత్మక సందిగ్ధతను పూర్తిగా తొలగించదు.
- source_word: יָשְׁבוּ בָהּ
  choice: అందులో నివసించింది
  rationale: ישב అంటే కూర్చోవడం, నివసించడం, స్థిరపడడం. ముందటి సందర్భంలోని స్త్రీలింగ ప్రదేశాన్ని בָהּ సూచిస్తుంది. సమూహవాచక ఏకవచనమైన ‘జీవసమూహం’తో సహజంగా సరిపడేందుకు ‘నివసించింది’ వాడబడింది.
- source_word: תָּכִין
  choice: సమకూర్చావు
  rationale: כון హిఫీల్ రూపం సిద్ధపరచడం, స్థిరపరచడం, సమకూర్చడం అనే అర్థాలను కలిగి ఉంది. పేదవాని కోసం దేవుడు చేసిన ఏర్పాటును ‘సమకూర్చావు’ సహజంగా వ్యక్తం చేస్తూ మూలంలోని విస్తృత అర్థానికి దగ్గరగా ఉంటుంది.
- source_word: בְּטוֹבָתְךָ
  choice: నీ మంచితనంతో
  rationale: טוֹבָה ఇక్కడ మంచితనం, మేలు లేదా ఔదార్యాన్ని సూచిస్తుంది. בְּ సాధనాన్ని లేదా ఆధారాన్ని సూచించగలదు; ‘నీ మంచితనంతో’ దేవుని మేలుచేసే స్వభావం మరియు దాని ద్వారా కలిగిన సమకూర్పు రెండింటినీ తెలియజేస్తుంది.
- source_word: לֶעָנִי
  choice: పేదవానికి
  rationale: עָנִי పేదవాడు, బాధితుడు, దీనుడు అనే అర్థాలను కలిగి ఉంది. సమకూర్పు సందర్భంలో ‘పేదవానికి’ సూటిగా, సహజంగా ఉంది; ఇతర సాధ్యార్థాలు పాదటిప్పణిలో ఇవ్వబడ్డాయి.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: వాక్యాంతంలో ఇది ప్రత్యక్ష సంబోధన. తెలుగు కవితాత్మక ప్రార్థనా శైలిలో ‘దేవా’ సహజమైన సంబోధన.
theological_decisions:
- issue: חַיָּתְךָ అనే క్లిష్టమైన కవితాత్మక పదం ఎవరిని సూచిస్తుంది?
  choice: జీవార్థాన్ని, సమూహార్థాన్ని రెండింటినీ ఉంచే ‘నీ జీవసమూహం’
  alternative: నీ జీవులు; నీ సమూహం; నీ సంఘం; నీ మంద
  rationale: సందర్భం దేవుడు తన ప్రజలకు నివాసం సిద్ధం చేయడాన్ని సూచించవచ్చుగానీ, మూలపదం స్వయంగా జంతువులు లేదా జీవులను కూడా సూచించగలదు. ‘మంద’ లేదా ‘సంఘం’ అని అనువదిస్తే ఒక నిర్దిష్ట మానవ లేదా పశుపాలక రూపకాన్ని ముందుగానే నిర్ణయించినట్లవుతుంది. అందుచేత ప్రధాన పాఠ్యంలో విస్తృతమైన పదాన్ని ఉంచి ప్రత్యామ్నాయాలను పాదటిప్పణిలో పేర్కొనడం ద్వారా అసలు సందిగ్ధతను కాపాడాం.
translation_notes:
  register: 'ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక శైలి. అయితే ప్రధాన పాఠ్యంలో [b] సూచిక లేకపోవడం నిషిద్ధం కాబట్టి అదనపు పాదటిప్పణిని తొలగించాలి లేదా సూచికను చేర్చాలి; ప్రచురణ పాఠ్య సమగ్రత కోసం ఇక్కడ [b]ను ప్రధాన పాఠ్యంలో చేర్చిన సవరించిన రూపం ఉద్దేశించబడింది: ‘దేవా, నీ మంచితనంతో పేదవానికి[b] సమకూర్చావు.’'
