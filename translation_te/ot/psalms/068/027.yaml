translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కవితాత్మక శైలి. జాబితా స్వరూపాన్ని నిలుపుతూ తెలుగులో సంపూర్ణంగా వినిపించేందుకు ‘ఉన్నారు’ను అవసరమైన చోట చేర్చాం. మూలంలోని రెండు ముఖ్యమైన పదార్థ అనిశ్చితులను పాదసూచికల్లో నిలిపాం.
