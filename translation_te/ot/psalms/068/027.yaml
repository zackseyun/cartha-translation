  text: שָׁ֤ם בִּנְיָמִ֨ן צָעִ֡יר רֹדֵ֗/ם שָׂרֵ֣י יְ֭הוּדָה רִגְמָתָ֑/ם שָׂרֵ֥י זְ֝בֻל֗וּן שָׂרֵ֥י נַפְתָּלִֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/027.yaml
  text: There is little Benjamin[a], leading them; the princes of Judah in their throng; the princes of Zebulun[b]; the princes of Naphtali.
translation:
  language: te
  text: అక్కడ చిన్న బెన్యామీను వారిని నడిపిస్తున్నాడు[a]; యూదా అధిపతులు తమ సమూహంతో[b]; జెబూలూను అధిపతులు, నఫ్తాలి అధిపతులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారిని పరిపాలిస్తున్నాడు,” “వారిపై ఆధిపత్యం వహిస్తున్నాడు.” హీబ్రూ కృదంతం పరిపాలనను లేదా ముందుండడాన్ని సూచించవచ్చు; ఈ ఊరేగింపు సందర్భంలో ప్రధాన పాఠం ముందుండి నడిపించే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “తమ గుంపు,” “తమ జనసమూహం,” లేదా “తమ సమూహం.” ఇక్కడి హీబ్రూ పదం అరుదైనది; దాని కచ్చితమైన భావఛాయ అనిశ్చితం, అయితే యూదాతో సంబంధమున్న కూడిన గుంపును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: అక్కడ
  rationale: స్థానాన్ని సూచించే అవ్యయాన్ని నేరుగా, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בִּנְיָמִן צָעִיר
  choice: చిన్న బెన్యామీను
  rationale: צָעִיר ఇక్కడ వయస్సుకన్నా గోత్రపు చిన్నతనం లేదా అల్పస్థితిని సూచించే అవకాశం ఉంది; ‘చిన్న’ మూలంలోని సంక్షిప్త కవితాత్మక భావాన్ని నిలుపుతుంది.
- source_word: רֹדֵם
  choice: వారికి ముందుగా నడుస్తున్నాడు
  rationale: ఈ కృదంతం పరిపాలించడం లేదా ఆధిక్యం వహించడం అనే భావాన్నివ్వగలదు; ఊరేగింపు సందర్భంలో ముందుండి నడిపించే భావాన్ని ప్రధాన పాఠంలో సహజంగా వ్యక్తం చేస్తూ, ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచింది.
- source_word: שָׂרֵי
  choice: అధిపతులు
  rationale: שַׂר అనే పదంలోని అధికార, ఉన్నత హోదా భావాలను ఆధునిక గౌరవప్రద తెలుగులో తెలియజేస్తుంది.
- source_word: רִגְמָתָם
  choice: తమ సమూహంతో
  rationale: అరుదైన ఈ పదం గుంపు, సమూహం లేదా జనసందోహాన్ని సూచించే అవకాశముంది; ‘తమ సమూహంతో’ సందర్భానికి సహజంగా సరిపోతుంది, అయితే అనిశ్చితిని పాదసూచికలో కాపాడింది.
- source_word: יְהוּדָה / זְבֻלוּן / נַפְתָּלִי
  choice: యూదా / జెబూలూను / నఫ్తాలి
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన గోత్రనామ రూపాలు.
