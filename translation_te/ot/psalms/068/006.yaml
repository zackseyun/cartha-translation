source:
  edition: WLC
  text: אֱלֹהִ֤ים מ֘וֹשִׁ֤יב יְחִידִ֨ים בַּ֗יְתָ/ה מוֹצִ֣יא אֲ֭סִירִים בַּ/כּוֹשָׁר֑וֹת אַ֥ךְ ס֝וֹרֲרִ֗ים שָׁכְנ֥וּ צְחִיחָֽה׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/006.yaml
  text: God settles the solitary in a home; he brings out prisoners into prosperity[a], but the rebellious dwell in a parched land.
translation:
  language: te
  text: 'దేవుడు ఒంటరిగా ఉన్నవారిని ఇంటిలో నివసింపజేస్తాడు;


    చెరలో ఉన్నవారిని శ్రేయస్సులోకి తీసుకువస్తాడు[a];


    కాని తిరుగుబాటు చేసేవారు ఎండిపోయిన నేలలో నివసిస్తారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సమృద్ధిలోకి’; ఈ అరుదైన హీబ్రూ పదాన్ని కొందరు ‘గానంతో’ అని, లేదా ఆనందభరితమైన విడుదలకు సంబంధించిన మరో వ్యక్తీకరణగా కూడా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఇక్కడ ఇశ్రాయేలు దేవునికి సాధారణ సంబోధన; తరువాతి ఏకవచన క్రియారూపాలకు అనుగుణంగా ఏకవచనంగా అనువదించబడింది.
- source_word: מוֹשִׁיב
  choice: స్థిరపరుస్తాడు
  rationale: ישׁב అనే ధాతువు హిఫిల్ రూపంలో ‘నివసించేలా చేయడం, స్థిరపరచడం’ అనే కారణార్థాన్ని ఇస్తుంది.
- source_word: יְחִידִים
  choice: ఒంటరివారిని
  rationale: ఒంటరిగా లేదా ఇతరుల నుంచి వేరై ఉన్నవారిని సూచిస్తుంది; కేవలం భావోద్వేగపరమైన ఒంటరితనానికే పరిమితం చేయదు.
- source_word: בַּיְתָה
  choice: ఒక ఇంటిలో
  rationale: בַּיִת అనే పదానికి ఇల్లు లేదా ఇంటివారు అనే భావాలు ఉండవచ్చు. మూలంలోని ఏకవచన ‘ఇల్లు’ ప్రతిమను నిలుపుతూ ఆశ్రయం, చెందిన భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מוֹצִיא
  choice: నడిపిస్తాడు
  rationale: יצא హిఫిల్ రూపం బయటకు తీసుకురావడం లేదా నడిపించడం అనే అర్థం ఇస్తుంది; చెర నుంచి అనుకూల స్థితిలోకి చేర్చే సందర్భానికి ఇది సహజంగా ఉంది.
- source_word: אֲסִירִים
  choice: చెరలో ఉన్నవారిని
  rationale: బంధించబడినవారిని లేదా ఖైదీలను సూచిస్తుంది; ఆధునిక తెలుగులో స్పష్టమైన, విస్తృత ప్రయోగం.
- source_word: בַּכּוֹשָׁרוֹת
  choice: సౌభాగ్యంలోకి
  rationale: ఇది అరుదైన, అర్థనిర్ణయం కష్టమైన పదం. విజయం, శ్రేయస్సు లేదా సమృద్ధితో సంబంధం ఉన్న అర్థం సందర్భానికి సరిపోతుంది; ఇతర సాధ్యార్థాలు పాదసూచికలో ఉంచబడ్డాయి.
- source_word: אַךְ
  choice: కాని
  rationale: దేవుడు బలహీనులకు చేసే మేలుకు, తిరుగుబాటు చేసేవారి స్థితికి మధ్యనున్న స్పష్టమైన వ్యత్యాసాన్ని తెలియజేస్తుంది.
- source_word: סוֹרֲרִים
  choice: తిరుగుబాటు చేసేవారు
  rationale: మొండిగా ఎదిరిస్తూ అవిధేయత చూపేవారిని సూచించే క్రియావిశేషణ రూపం; నైతిక భావాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: שָׁכְנוּ
  choice: నివసిస్తారు
  rationale: שכן అనే ధాతువు నివసించడం అనే అర్థం ఇస్తుంది. కవితా సందర్భంలోని సాధారణ సత్యాన్ని తెలుగులో వర్తమాన కాలంతో వ్యక్తపరుస్తుంది.
- source_word: צְחִיחָה
  choice: ఎండిపోయిన నేలలో
  rationale: ఎండిన, నీరులేని ప్రదేశాన్ని సూచిస్తుంది; ‘ఇల్లు,’ ‘సౌభాగ్యం’ అనే అనుకూల చిత్రాలకు వ్యతిరేకమైన దృశ్యాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఒంటరివారి పట్ల దేవుని కార్యం
  choice: దేవుడు ఒంటరిగా లేదా వేరై ఉన్నవారికి స్థిరమైన నివాసాన్ని కల్పిస్తాడు.
  alternative: దేవుడు ఒంటరివారిని కుటుంబాలలో ఉంచుతాడు.
  rationale: హీబ్రూ పాఠంలో ‘ఒంటరివారు,’ ‘ఇల్లు’ అనే పదాలున్నాయి. ‘కుటుంబాలు’ అనేది సంప్రదాయ వ్యాఖ్యానాత్మక అనువాదమైనప్పటికీ, మూలంలోని בַּיִת ఏకవచన రూపాన్ని ‘ఒక ఇంటిలో’ అని నేరుగా నిలుపడం జీవసంబంధ కుటుంబాలకు భావాన్ని అనవసరంగా పరిమితం చేయదు.
- issue: בַּכּוֹשָׁרוֹת అనే అరుదైన పదం అర్థం
  choice: సౌభాగ్యంలోకి
  alternative: సమృద్ధిలోకి; గానంతో/ఆనందగానంతో
  rationale: పదార్థం అనిశ్చితమైనందున ప్రధాన పాఠంలో సందర్భానికి అనుకూలమైన శ్రేయస్సు భావాన్ని ఎంచుకుని, నిజమైన భాషాత్మక అనిశ్చితిని పాదసూచికలో స్పష్టంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కవితా శైలి. సమాంతర పాద నిర్మాణం నిలుపబడింది; అరుదైన హీబ్రూ పదంలోని అనిశ్చితి పాదసూచిక ద్వారా పరిరక్షించబడింది.
