revisions:
- from: భూమి మీదున్న రాజ్యాలారా, దేవునికి పాడండి; ప్రభువును స్తుతిస్తూ పాడండి—సెలా.
  to: భూమిపై ఉన్న రాజ్యాలారా, దేవునికి పాడండి; ప్రభువుకు స్తుతిగీతాలు పాడండి—సెలా.
  rationale: 'The revision preserves the Hebrew parallelism: ‘sing to God; sing praises to the Lord.’ It also uses an idiomatic Telugu dative for the addressee of praise and avoids adding the aspectual nuance ‘while praising.’'
  reviewer_model: gpt-5.6-terra
