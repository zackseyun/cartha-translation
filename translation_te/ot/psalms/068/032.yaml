  text: Kingdoms of the earth[a], sing to God; sing praises to the Lord—Selah
translation:
  language: te
  text: భూమిపై ఉన్న రాజ్యాలారా, దేవునికి పాడండి; ప్రభువుకు స్తుతిగీతాలు పాడండి—సెలా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַמְלְכוֹת הָאָרֶץ
  choice: భూమి మీదున్న రాజ్యాలారా
  rationale: ఈ సంబోధన భూమంతటా ఉన్న రాజకీయ రాజ్యాలను ఉద్దేశిస్తుంది. తెలుగు వాక్యనిర్మాణంలో సంబోధనను స్పష్టంగా చూపడానికి ‘రాజ్యాలారా’ అని ఇచ్చాం.
- source_word: שִׁירוּ
  choice: పాడండి
  rationale: ఇది బహువచన ఆజ్ఞార్థకం; స్వరంతో దేవునికి గానం చేయమనే పిలుపును నేరుగా తెలియజేస్తుంది.
- source_word: לֵאלֹהִים
  choice: దేవునికి
  rationale: לְ ఉపసర్గ గానాన్ని అందుకునే వ్యక్తిని సూచిస్తుంది; తెలుగులో ‘దేవునికి’ సహజమైన సమానం.
- source_word: זַמְּרוּ
  choice: స్తుతిస్తూ పాడండి
  rationale: זמר పియేల్ రూపం సంగీతపూర్వక స్తుతిని సూచిస్తుంది. ‘స్తుతిస్తూ పాడండి’ గానం మరియు ఆరాధన అనే రెండు ఛాయలనూ సహజంగా నిలుపుతుంది.
- source_word: אֲדֹנָי
  choice: ప్రభువును
  rationale: ఇక్కడ యెహోవా నామం కాక אֲדֹנָי అనే దైవ బిరుదు ఉంది. క్రియకు అనుగుణంగా తెలుగులో కర్మవిభక్తితో ‘ప్రభువును’ అని అనువదించాం.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఈ ఆరాధనా/సంగీత పదం యొక్క ఖచ్చితమైన భావం అనిశ్చితం కాబట్టి అర్థాన్ని ఊహించకుండా లిప్యంతరీకరించాం.
theological_decisions:
- issue: אֲדֹנָי అనే దైవ బిరుదు అనువాదం
  choice: ప్రభువు
  alternative: యెహోవా
  rationale: మూలపాఠంలో చతురక్షర దైవనామం יהוה కాక אֲדֹנָי ఉంది. కాబట్టి దానిని పేరుగా ‘యెహోవా’ అని కాక బిరుదుగా ‘ప్రభువు’ అని అనువదించడం మూలభేదాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామూహిక ఆరాధనకు తగిన గౌరవప్రదమైన శైలిని వాడాం. రెండు బహువచన ఆజ్ఞలను సమాంతరంగా ఉంచి, ‘సెలా’ను వివరణ లేకుండా నిలిపాం.
