  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַךְ אֱלֹהִ֗ים יִמְחַץ֮ רֹ֤אשׁ אֹ֫יְבָ֥י/ו קָדְקֹ֥ד שֵׂעָ֑ר מִ֝תְהַלֵּ֗ךְ בַּ/אֲשָׁמָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/021.yaml
  text: Surely God will crush the head of his enemies[a], the hairy crown of the one who walks in his guilt.
translation:
  language: te
  text: నిశ్చయంగా దేవుడు తన శత్రువుల తలలను పగులగొడతాడు—అపరాధంలో నడిచేవాని రోమాలతో నిండిన నడినెత్తిని[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “అపరాధంలో నడిచేవాని రోమాలతో నిండిన పుర్రెను”; “తన అపరాధాలలో కొనసాగేవాని రోమాలతో నిండిన నడినెత్తిని.”'
    reason: కָדְקֹדకు ‘నడినెత్తి’ లేదా ‘పుర్రె’ అనే అర్థసాధ్యతలు ఉన్నాయి; בַּאֲשָׁמָיוను ‘అపరాధంలో’ లేదా ‘అపరాధాలలో’ అని అనువదించవచ్చు.
lexical_decisions:
- source_word: אַךְ
  choice: నిశ్చయంగా
  rationale: ఇక్కడ ఇది పరిమితిని సూచించే ‘మాత్రమే’ అనే అర్థంలో కాక, బలమైన నిశ్చయాన్ని తెలిపే ఉద్ఘాటనార్థక అవ్యయంగా ఉంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపరీత్యా బహువచనమైనా, ఏకవచన క్రియతో వచ్చి ఇశ్రాయేలు దేవుణ్ణి సూచిస్తోంది.
- source_word: יִמְחַץ
  choice: చితకగొడతాడు
  rationale: హింసాత్మకంగా నలగగొట్టడం లేదా పగులగొట్టడం అనే బలమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: רֹאשׁ
  choice: తలను
  rationale: శరీర భాగానికి సంబంధించిన స్పష్టమైన కవితాత్మక చిత్రాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: אֹיְבָיו
  choice: తన శత్రువుల
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయం సమీపంలోని కర్తయైన దేవుణ్ణే అత్యంత సహజంగా సూచిస్తుంది.
- source_word: קָדְקֹד שֵׂעָר
  choice: రోమాలతో నిండిన నడినెత్తిని
  rationale: కָדְקֹד తల పైభాగాన్ని, שֵׂעָר దాని రోమసమృద్ధ స్వరూపాన్ని సూచిస్తాయి; తెలుగు సహజత్వం కోసం రెండింటినీ కలిపి అనువదించాం.
- source_word: מִתְהַלֵּךְ
  choice: నడిచేవాని
  rationale: కొనసాగుతున్న లేదా అలవాటైన జీవన ప్రవర్తనను సూచించే భాగధాతు రూపంలోని నైతిక ‘నడక’ రూపకాన్ని నిలుపుతుంది.
- source_word: בַּאֲשָׁמָיו
  choice: తన అపరాధాలలో
  rationale: ఈ రూపం దోషం, అపరాధం లేదా దోషకార్యాలను సూచించగలదు; బహువచన ప్రత్యయరూపాన్ని, కొనసాగుతున్న ప్రవర్తనతో దాని సంబంధాన్ని తెలుగులో సహజంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ‘తన శత్రువులు’లోని సర్వనామ ప్రత్యయం ఎవరిని సూచిస్తుంది?
  choice: దేవుణ్ణి సూచించేలా ‘తన శత్రువులు’ అని అనువదించాం.
  alternative: సందర్భాన్ని బట్టి దేవుని ప్రజల శత్రువులు లేదా దైవిక రాజుకు విరోధులు అని విస్తృతంగా గ్రహించవచ్చు.
  rationale: వాక్యంలోని సమీప కర్త దేవుడు; ఏకవచన క్రియ కూడా ఉంది. అందువల్ల దేవుడే సహజమైన పూర్వపదం. వచనంలో లేని ప్రత్యేక జాతీయ లేదా మెస్సీయ సంబంధాన్ని చేర్చలేదు.
- issue: בַּאֲשָׁמָיו యొక్క భావం
  choice: అలవాటైన దోషపూరిత ప్రవర్తనను సూచించేలా ‘తన అపరాధాలలో నడిచేవాడు’ అని ఇచ్చాం.
  alternative: ‘తన దోషంలో నడిచేవాడు’ లేదా ‘తన అపరాధాలతో కొనసాగేవాడు.’
  rationale: నడకను తెలిపే భాగధాతుతో ఈ పదబంధం కలిసినందున, కేవలం అంతర్గత దోషస్థితికన్నా కొనసాగుతున్న అపరాధ ప్రవర్తన స్పష్టమవుతుంది; అయినా మూలపదంలోని దోషం/అపరాధం అర్థపరిధిని అతిగా నిర్దిష్టం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక శైలిని వాడాం. ‘నడిచేవాడు’ అనే నైతిక జీవన రూపకాన్ని నిలిపి, హీబ్రూ సమాంతర చిత్రాలైన ‘తల’ మరియు ‘రోమాలతో నిండిన నడినెత్తి’ రెండింటినీ సంరక్షించాం.
