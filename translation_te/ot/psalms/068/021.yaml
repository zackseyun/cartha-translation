  source_fidelity: మూలంలోని אַךְ యొక్క ఉద్ఘాటన, ఏకవచన క్రియతో వచ్చిన దేవుడు, శత్రువుల తలపై తీర్పు-చిత్రం, అలాగే అపరాధంలో కొనసాగుతున్న వ్యక్తి యొక్క రోమమయ నడినెత్తి అనే సమాంతర చిత్రాలు ముసాయిదాలో ప్రధానంగా ఉన్నాయి. అయితే బహువచనమైన “శత్రువుల”తో ఏకవచన “తలను” కలపడం తెలుగు వ్యాకరణంలో అస్పష్టంగా ఉంది; “తలలను” అవసరం. యిమ్హత్సు యొక్క నలిపివేయు/పగులగొట్టు బలాన్ని “చితకగొడతాడు” కంటే “పగులగొడతాడు” మరింత నేరుగా తెలియజేస్తుంది.
  naturalness: “శత్రువుల తలను” సహజమైన ఆధునిక తెలుగు కాదు. “శత్రువుల తలలను” అని, రెండవ సమాంతర కర్మను “అపరాధంలో నడిచేవాని రోమాలతో నిండిన నడినెత్తిని” అని ఉంచితే వాక్యం స్పష్టంగా, కవితాత్మకంగా ఉంటుంది.
