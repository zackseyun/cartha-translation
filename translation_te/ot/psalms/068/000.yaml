  yaml_path: translation/ot/psalms/068/000.yaml
  text: For the choir director[a]. Of David. A psalm[b]. A song.
translation:
  language: te
  text: సంగీత నిర్దేశకునికి[b]. దావీదుకు చెందినది[a]. ఒక కీర్తన. ఒక గీతం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దావీదు రచించినది’; కీర్తనల శీర్షికల్లోని హీబ్రూ ఉపసర్గ రచయితత్వాన్ని, అంకితాన్ని లేదా అనుబంధాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘సంగీత నిర్దేశకునికి’ అనే మాటను ‘సంగీత నిర్వాహకునికి’ లేదా ‘గానబృంద నిర్దేశకునికి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నిర్దేశకునికి
  rationale: కీర్తనల శీర్షికల్లో ఈ పదం సంగీత ప్రదర్శనను పర్యవేక్షించే వ్యక్తిని సూచిస్తుంది. ‘సంగీత నిర్దేశకుడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, కేవలం ‘నాయకుడు’ అనే అస్పష్ట పదం కంటే సంగీత సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְדָוִד
  choice: దావీదుకు చెందినది
  rationale: హీబ్రూ לְ ఉపసర్గ రచయితను, అంకితాన్ని లేదా అనుబంధాన్ని సూచించగలదు. ‘దావీదుకు చెందినది’ అనేది ‘దావీదు రచించినది’ అని అర్థాన్ని పరిమితం చేయకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: מִזְמוֹר
  choice: ఒక కీర్తన
  rationale: సంగీత సహితంగా పాడే రచనను సూచించే ఈ ప్రక్రియా పదానికి ‘కీర్తన’ ప్రామాణికమైన, సహజమైన తెలుగు రూపం.
- source_word: שִׁיר
  choice: ఒక గీతం
  rationale: మూలంలో ఉన్న రెండవ ప్రక్రియా పదాన్ని వదలకుండా ‘గీతం’గా అనువదించడం ద్వారా ‘కీర్తన, గీతం’ అనే జతను నిలుపుతున్నాం.
theological_decisions:
- issue: לְדָוִד అనే శీర్షికలోని సంబంధం
  choice: దావీదుకు చెందినది
  alternative: దావీదు రచించినది; దావీదు కోసం
  rationale: ఈ ఉపసర్గ రచయితత్వం, అంకితం లేదా అనుబంధం మధ్య నిర్ణయాత్మకంగా తేల్చదు. అందువల్ల ఏ ఒక్క వివరణను సిద్ధాంతపరంగా ఖరారు చేయకుండా మూలంలోని భావ విస్తృతిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సంక్షిప్తమైన కీర్తన శీర్షిక శైలిని పాటించాం. ‘దావీదు రచించినది’ అని నిర్దిష్టీకరించకుండా హీబ్రూ శీర్షికలోని అనిశ్చితిని నిలిపాం. అందించిన ఆంగ్ల పాఠ్యంలో పాదసూచిక గుర్తులు వాటి విషయాలతో తారుమారుగా కనిపించినందున, [a]ను దావీదు సంబంధిత వాక్యానికి, [b]ను సంగీత నిర్దేశకుని పదానికి జతచేసి అంతర్గత సుసంగతిని పునరుద్ధరించాం.
