source:
  edition: WLC
  text: כִּֽי הֶ֭חֱרַשְׁתִּי בָּל֣וּ עֲצָמָ֑/י בְּ֝/שַׁאֲגָתִ֗/י כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/003.yaml
  text: For when I kept silent[a], my bones wasted away through my groaning all day long.
translation:
  language: te
  text: 'నేను మౌనంగా ఉన్నప్పుడు,

    రోజంతా మూలుగుతూ

    నా ఎముకలు క్షీణించిపోయాయి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రోజంతా గర్జిస్తూ.’ హీబ్రూ పదం సింహగర్జనవంటి బిగ్గర కేకను సూచించగలదు; ఇక్కడ అది వేదనతో కూడిన మూలుగును సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: నేను … ఉన్నప్పుడు
  rationale: כִּי ఇక్కడ ముందటి భావానికి వివరణాత్మక కారణం లేదా పరిస్థితిని పరిచయం చేస్తుంది. తెలుగులో సందర్భానుసారంగా ‘ఉన్నప్పుడు’ సహజంగా ఉంది; సంబంధాన్ని పదక్రమం ద్వారా వ్యక్తం చేయవచ్చు.
- source_word: הֶחֱרַשְׁתִּי
  choice: నేను మౌనంగా ఉన్నప్పుడు
  rationale: חרשׁ యొక్క ‘మౌనంగా ఉండు’ అనే అర్థాన్ని, కొనసాగిన స్థితిని సూచించే సహజ తెలుగు రూపంలో అందిస్తుంది. మౌనం పాపం గురించి అని సందర్భం సూచించినా, హీబ్రూ ఈ వచనంలో దాన్ని స్పష్టంగా చెప్పదు.
- source_word: בָּלוּ
  choice: క్షీణించిపోయాయి
  rationale: בלה సూచించే అరిగిపోవడం, బలహీనమవడం, క్షీణించడం అనే భావాన్ని ఎముకల రూపకానికి తగిన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עֲצָמַי
  choice: నా ఎముకలు
  rationale: హీబ్రూలోని శరీర సంబంధ కవితాత్మక చిత్రణను యథాతథంగా నిలుపుతుంది.
- source_word: בְּשַׁאֲגָתִי
  choice: నా మూలుగుల వల్ల
  rationale: שׁאגה ప్రాథమికంగా గర్జనలాంటి బిగ్గర కేకను సూచించగలదు; ఈ విలాప సందర్భంలో వేదనతో వెలువడే మూలుగును ‘మూలుగులు’ సహజంగా తెలియజేస్తుంది. בְ సాధనం లేదా తోడు పరిస్థితిని సూచించడం వల్ల ‘వల్ల’ ఎంచుకోబడింది.
- source_word: כָּל הַיּוֹם
  choice: రోజంతా
  rationale: నిరంతర కాలవ్యాప్తిని సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: మౌనం ఒప్పుకోని పాపాన్ని గూర్చినదని స్పష్టంగా చేర్చాలా
  choice: ప్రధాన పాఠ్యంలో అంతర్లీనంగానే ఉంచడం
  alternative: ‘నా పాపం గురించి నేను మౌనంగా ఉన్నప్పుడు’ అని అనువదించడం
  rationale: సమీప సందర్భం మౌనం దేనిని గూర్చినదో సూచిస్తుంది; అయితే ఈ వచనంలోని హీబ్రూ దానిని ప్రత్యక్షంగా చెప్పదు. కాబట్టి మూలంలోని సంక్షిప్తతను, అంతర్లీన భావాన్ని నిలుపుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తన కవితా లయను నిలుపుతూ మూడు పాదాలుగా అమర్చబడింది. ‘నా ఎముకలు’ అనే శరీర రూపకాన్ని అలాగే ఉంచి, అనవసరంగా ‘పాపం’ అనే కర్మను చేర్చలేదు. ప్రధాన పాఠ్యంలోని [a] సూచిక సంబంధిత పదబంధం తరువాత ఉంచబడింది.
