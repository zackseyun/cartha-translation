  yaml_path: translation/ot/psalms/032/000.yaml
  text: Of David[a]. A Maskil. Blessed is the one whose transgression is forgiven[b], whose sin is covered.
translation:
  language: te
  text: దావీదుది. మస్కీల్[a]. ఎవరి అతిక్రమం క్షమించబడిందో[b], ఎవరి పాపం కప్పబడిందో వారు ధన్యులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: మస్కీల్. ఇది ఒక కీర్తన శీర్షిక; దీని ఖచ్చితమైన అర్థం అనిశ్చితం. బహుశా బోధనాత్మకమైన లేదా ధ్యానాత్మకమైన రచన కావచ్చు.'
    reason: cultural_note
  - marker: b
    text: అక్షరార్థంగా, “ఎత్తివేయబడినది” లేదా “మోయబడినది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: దావీదుది
  rationale: కీర్తన శీర్షికలోని సంబంధార్థక לְను సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది; అది రచయితత్వం, అంకితం లేదా సంబంధాన్ని నిర్దిష్టంగా తేల్చదు.
- source_word: מַשְׂכִּיל
  choice: మస్కీల్
  rationale: ఈ సాంకేతిక కీర్తన శీర్షిక యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం కాబట్టి భావాన్ని ఊహించి అనువదించకుండా లిప్యంతరీకరించబడింది.
- source_word: אַשְׁרֵי
  choice: ధన్యులు
  rationale: హీబ్రూ ఆశీర్వాద ప్రకటనను ఆధునిక, గౌరవప్రదమైన తెలుగు వాడుకలో సహజంగా అందిస్తుంది.
- source_word: נְשׂוּי
  choice: క్షమించబడిందో
  rationale: సందర్భంలో ఇది అపరాధం తొలగింపబడటం ద్వారా క్షమాపణను సూచిస్తుంది; మూలంలోని ‘ఎత్తివేయబడిన/మోసివేయబడిన’ రూపకాన్ని పాదటిప్పణిలో నిలిపాము.
- source_word: כְּסוּי
  choice: కప్పబడిందో
  rationale: మూలంలోని సమాంతర రూపకాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: అతిక్రమం ‘ఎత్తివేయబడటం’ అనే రూపకం మరియు క్షమాపణ మధ్య సంబంధం
  choice: ప్రధాన పాఠ్యంలో ‘క్షమించబడిందో’; పాదటిప్పణిలో అక్షరార్థం
  alternative: ‘ఎత్తివేయబడిందో’ లేదా ‘మోసివేయబడిందో’
  rationale: సందర్భార్థాన్ని సాధారణ పాఠకుడికి స్పష్టంగా చేస్తూనే, హీబ్రూ రూపకానికి ఉన్న భావసూక్ష్మతను దాచకుండా పాదటిప్పణిలో భద్రపరుస్తుంది.
- issue: לְדָוִד రచయితత్వాన్ని ఖచ్చితంగా నిర్ధారిస్తుందా
  choice: ‘దావీదుది’ అనే సంబంధాన్ని మాత్రమే తెలిపే రూపం
  alternative: ‘దావీదు రచించినది’
  rationale: హీబ్రూ ఉపసర్గలోని నిజమైన విస్తృతార్థాన్ని రచయితత్వంగా మాత్రమే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. సమాంతర కవితా నిర్మాణం నిలుపబడింది; లింగాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా ‘ఎవరి... వారు’ రూపం ఉపయోగించబడింది.
