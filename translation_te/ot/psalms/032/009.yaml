id: PSA.32.9
reference: Psalms 32:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַל תִּֽהְי֤וּ כְּ/ס֥וּס כְּ/פֶרֶד֮ אֵ֤ין הָ֫בִ֥ין בְּ/מֶֽתֶג וָ/רֶ֣סֶן עֶדְי֣/וֹ לִ/בְל֑וֹם בַּ֝֗ל קְרֹ֣ב אֵלֶֽי/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/009.yaml
  text: Do not be like a horse or like a mule[a], without understanding, whose trappings are bit and bridle to restrain it, or else it will not come near you.
translation:
  language: te
  text: వివేచనలేని గుర్రంలా గానీ, కంచరగాడిదలా గానీ ఉండకండి. దాన్ని అదుపులో ఉంచేందుకు కళ్లెమూ ముకుతాడూ అవసరం; లేకపోతే అది మీ దగ్గరికి రాదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది మీ దగ్గరికి రాకుండా దాన్ని అదుపులో ఉంచాలి.” చివరి మాటలు హెబ్రీలో క్లిష్టంగా ఉన్నాయి. అదుపు చేయకపోతే జంతువు దగ్గరకు రాదని గానీ, దగ్గరకు దూసుకురాకుండా దాన్ని అదుపులో ఉంచాలని గానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּהְיוּ
  choice: ఉండకండి
  rationale: אַל‌తో కూడిన היה అసంపూర్ణ క్రియ ఇక్కడ నిషేధార్థక ఆజ్ఞను ఇస్తుంది; బహువచన సంబోధనను సహజమైన ఆధునిక తెలుగులో నిలిపింది.
- source_word: כְּסוּס כְּפֶרֶד
  choice: గుర్రంలా గానీ, కంచరగాడిదలా గానీ
  rationale: రెండు జంతువులతో చేసిన పోలికను స్పష్టంగా ఉంచింది; פֶרֶד‌కు సాధారణ తెలుగు పదం ‘కంచరగాడిద’.
- source_word: אֵין הָבִין
  choice: వివేచనలేని
  rationale: అర్థం చేసుకునే లేదా గ్రహించే సామర్థ్యం లేకపోవడాన్ని సంక్షిప్తంగా, నైతిక-బౌద్ధిక భావంతో వ్యక్తం చేస్తుంది.
- source_word: בְּמֶתֶג וָרֶסֶן
  choice: కళ్లెమూ ముకుతాడూ
  rationale: జంతువును నియంత్రించేందుకు ఉపయోగించే రెండు సాధనాల చిత్రాన్ని సాధారణ తెలుగు పాఠకునికి అర్థమయ్యే పదాలతో అందిస్తుంది; హెబ్రీ పదాల ఖచ్చిత సాధన-భేదం సందర్భంలో పూర్తిగా నిశ్చితం కాదు.
- source_word: עֶדְיוֹ לִבְלֹם
  choice: దాన్ని అదుపుచేయడానికి ... వేయాలి
  rationale: עֶדְיוֹ అక్షరార్థంగా అలంకారం/సామగ్రి అనే భావం కలిగినా, ఈ సందర్భంలో జంతువుపై అమర్చే నియంత్రణ సామగ్రిని సూచిస్తుంది; בלם యొక్క అదుపుచేయు భావాన్ని సహజ తెలుగు వాక్యంగా మలిచింది.
- source_word: בַּל קְרֹב אֵלֶיךָ
  choice: లేకపోతే అది మీ దగ్గరికి రాదు
  rationale: కష్టమైన చివరి ఉపవాక్యానికి సాధ్యమైన ప్రధాన పఠనాన్ని అనుసరిస్తుంది; జంతువు అనే ఏకవచన చిత్రాన్ని నిలిపింది, మరో సాధ్యమైన అర్థాన్ని పాదసూచికలో ఇచ్చింది.
theological_decisions:
- issue: చివరి ఉపవాక్యంలో జంతువు దగ్గరకు రాకపోవడమా, దగ్గరకు రాకుండా అడ్డుకోవడమా
  choice: అదుపు చేయకపోతే అది మీ దగ్గరికి రాదు
  alternative: అది మీ దగ్గరికి రాకుండా దాన్ని అదుపుచేయాలి
  rationale: בַּל קְרֹב אֵלֶיךָ వాక్యనిర్మాణం క్లిష్టమైనది; రెండూ భాషాపరంగా ప్రతిపాదించబడగలవు. ప్రధాన పాఠంలో ఒక సహజ పఠనాన్ని ఇచ్చి, అనిశ్చితిని పాదసూచికలో సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞను వాడింది. జంతు నియంత్రణ సామగ్రికి పాఠకులకు పరిచితమైన పదాలను ఎంచుకుంది; మూలంలోని క్లిష్టతను పాదసూచిక ద్వారా నిలిపింది.
