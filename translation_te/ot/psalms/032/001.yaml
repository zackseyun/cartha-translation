    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: దావీదుకు సంబంధించినది
  rationale: కీర్తన శీర్షికలో לְ అనే విభక్తి రచయితను, అంకితాన్ని, లేదా సంబంధాన్ని సూచించవచ్చు. ‘సంబంధించినది’ అనేది ఈ అస్పష్టతను అనవసరంగా పరిష్కరించకుండా సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מַשְׂכִּיל
  choice: మస్కీల్
  rationale: ఈ శీర్షికా పదం యొక్క ఖచ్చితమైన భావం, విధి అనిశ్చితం. అందువల్ల వివాదాస్పద అర్థాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా లిప్యంతరీకరించబడింది.
- source_word: אַשְׁרֵי
  choice: ధన్యుడు
  rationale: ఇది ఆశీర్వాదస్థితిని ప్రకటించే హీబ్రూ ప్రయోగం. ‘ధన్యుడు’ అనే పదం కేవలం భావోద్వేగ సంతోషం కంటే విస్తృతమైన ఆధ్యాత్మిక శ్రేయస్సును తెలియజేస్తుంది.
- source_word: נְשׂוּי
  choice: క్షమించబడిందో
  rationale: נשׂא అనే మూలపదానికి అక్షరార్థంగా ‘ఎత్తడం’ లేదా ‘మోసుకుపోవడం’ అనే భావం ఉన్నా, అపరాధంతో కూడిన ఈ ప్రయోగంలో సహజమైన భావం ‘క్షమించబడడం.’ మూల రూపకం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: פֶּשַׁע
  choice: అతిక్రమం
  rationale: దేవుని నియమాన్ని ఉద్దేశపూర్వకంగా మీరడం లేదా తిరుగుబాటు చేయడం అనే భావాన్ని ‘అతిక్రమం’ స్పష్టంగా అందిస్తుంది; తరువాతి ‘పాపం’తో ఉన్న సమాంతరతను కూడా నిలుపుతుంది.
- source_word: כְּסוּי
  choice: కప్పబడిందో
  rationale: ‘కప్పబడినది’ అనే మూల రూపకాన్ని నేరుగా నిలుపుతూ, ముందున్న ‘క్షమించబడినది’తో కవితాత్మక సమాంతరతను కాపాడుతుంది.
- source_word: חֲטָאָה
  choice: పాపం
  rationale: ఇక్కడ ఈ పదం ‘అతిక్రమం’కు సమాంతరంగా నైతిక దోషాన్ని సూచిస్తుంది; ‘పాపబలి’ అనే ప్రత్యామ్నాయ అర్థం సందర్భానికి సరిపోదు.
theological_decisions:
- issue: ధన్యతా ప్రకటనలో ఏకవచన ప్రతినిధి వ్యక్తిని ఎలా వ్యక్తీకరించాలి
  choice: ఎవరి... ఆ వ్యక్తి ధన్యుడు
  alternative: ఎవరి... వారు ధన్యులు
  rationale: మూలంలోని ప్రతినిధి ఏకవచనాన్ని నిలుపుతూ, అది పురుషులకు మాత్రమే వర్తిస్తుందనే భావం రాకుండా ‘ఆ వ్యక్తి’ అని అనువదించబడింది.
- issue: מַשְׂכִּיל అనే శీర్షికా పదాన్ని ఎలా అందించాలి
  choice: ప్రధాన పాఠ్యంలో ‘మస్కీల్’గా నిలుపడం
  alternative: ‘ఉపదేశ కీర్తన’ లేదా ‘ధ్యాన గీతం’ అని అనువదించడం
  rationale: పదం యొక్క ఖచ్చితమైన అర్థం అనిశ్చితమైనందున, ఒక నిర్దిష్ట వ్యాఖ్యానాన్ని పాఠ్యంలోకి చేర్చకుండా లిప్యంతరీకరణ చేయబడింది; సాధ్యమైన అర్థాలు పాదటిప్పణిలో సూచించబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. కవితాత్మక సమాంతరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఉపయోగించాం. శీర్షికలోని సంబంధం మరియు ‘మస్కీల్’ అర్థంలోని నిజమైన అనిశ్చితిని ఉద్దేశపూర్వకంగా నిలిపాం.
