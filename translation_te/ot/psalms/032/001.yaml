  text: לְ/דָוִ֗ד מַ֫שְׂכִּ֥יל אַשְׁרֵ֥י נְֽשׂוּי פֶּ֗שַׁע כְּס֣וּי חֲטָאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/001.yaml
  text: Of David[a]. A Maskil. Blessed is the one whose transgression is forgiven[b], whose sin is covered.
translation:
  language: te
  text: దావీదుకు సంబంధించినది. మస్కీల్[a]. ఎవరి అతిక్రమం క్షమించబడిందో[b], ఎవరి పాపం కప్పబడిందో, ఆ వ్యక్తి ధన్యుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘మస్కీల్.’ ఇది కీర్తన శీర్షికలోని పదం; దీని ఖచ్చితమైన అర్థం అనిశ్చితం. బహుశా ఇది ఉపదేశాత్మకమైన లేదా ధ్యానపూర్వకమైన రచనను సూచించవచ్చు.
