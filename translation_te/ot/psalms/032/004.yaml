review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the continuing pressure of God's hand and the depletion of the psalmist's vitality. However, “ఎండిపోయినట్టుగా మారిపోయింది” is unnecessarily repetitive and less idiomatic. A small revision more naturally represents the Hebrew passive change (נֶהְפַּךְ) together with the summer-parching image.
  naturalness: “పగలూ రాత్రీ,” “నీ చెయ్యి నా మీద భారంగా ఉండింది,” and “నా జీవసారం” are natural modern standard Telugu in an appropriately elevated psalmic register. “ఎండిపోయినట్లైంది” is smoother than “ఎండిపోయినట్టుగా మారిపోయింది.”
  terminology: “జీవసారం” appropriately retains both the concrete bodily-sap sense and the figurative sense of vitality in לְשַׁדִּי. “సెలా” suitably preserves the untranslated Hebrew liturgical/musical term. The alternatives in both footnotes are relevant and correctly anchored.
  issues:
  - severity: low
    issue: Redundant expression in the second colon
    rationale: “ఎండిపోయినట్టుగా మారిపోయింది” duplicates the ideas of becoming and drying up. “ఎండిపోయినట్లైంది” is idiomatic Telugu while retaining the resultant-change sense of נֶהְפַּךְ.
  revised_text: ఎందుకంటే పగలూ రాత్రీ నీ చెయ్యి నా మీద భారంగా ఉండింది; నా జీవసారం[a] వేసవి ఎండల్లో ఎండిపోయినట్లైంది[b]. సెలా.
