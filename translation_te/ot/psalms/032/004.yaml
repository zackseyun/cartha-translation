  yaml_path: translation/ot/psalms/032/004.yaml
  text: For day and night your hand was heavy upon me[a]; my vitality was dried up as by the heat of summer[b]. Selah
translation:
  language: te
  text: ఎందుకంటే పగలూ రాత్రీ నీ చెయ్యి నా మీద భారంగా ఉండింది; నా జీవసారం[a] వేసవి ఎండల్లో ఎండిపోయినట్లైంది[b]. సెలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా తేమ”; లేదా “నా జీవశక్తి.”
    reason: లְשַׁדִּי అనే అరుదైన పదం శరీర తేమ, జీవరసం లేదా జీవశక్తిని సూచించవచ్చు.
  - marker: b
    text: హీబ్రూలో “వేసవి కరవుల్లో.”
    reason: בְּחַרְבֹנֵי קַיִץ అనే పదబంధానికి మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని సంరక్షిస్తుంది.
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని అనుభవానికి కారణాన్ని పరిచయం చేస్తుంది; వివరణాత్మక సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יוֹמָם וָלַיְלָה
  choice: పగలూ రాత్రీ
  rationale: నిరంతర కాలాన్ని సూచించే హీబ్రూ జంటను సహజమైన, సంక్షిప్త తెలుగు ప్రయోగంతో నిలుపుతుంది.
- source_word: תִּכְבַּד ... יָדֶךָ
  choice: నీ చెయ్యి ... భారంగా ఉండింది
  rationale: దేవుని చెయ్యి తన మీద బరువుగా ఉండడమనే స్పష్టమైన మూలరూపకాన్ని వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: עָלַי
  choice: నా మీద
  rationale: బరువు తనపై నిలిచిన భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נֶהְפַּךְ
  choice: ఎండిపోయినట్టుగా మారిపోయింది
  rationale: క్రియలోని ‘మారిపోవడం’ అనే భావాన్ని నిలుపుతూ, తరువాతి వేసవి ఎండల చిత్రంతో సూచితమైన క్షీణతను తెలుగులో అర్థవంతంగా తెలియజేస్తుంది.
- source_word: לְשַׁדִּי
  choice: నా జీవసారం
  rationale: పదంలోని శరీర తేమ లేదా జీవరసం అనే concrete భావాన్నీ, రూపకాలంకారంగా జీవశక్తి అనే భావాన్నీ సాధ్యమైనంతవరకు కలిపి ఉంచుతుంది.
- source_word: בְּחַרְבֹנֵי קַיִץ
  choice: వేసవి ఎండల్లో
  rationale: కాల్చివేసే వేడి లేదా కరవు అనే భావాన్ని సహజమైన తెలుగు చిత్రంగా అందిస్తుంది; ‘వేసవి కరవుల్లో’ అనే మరింత అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఖచ్చితమైన అర్థం అనిశ్చితంగా ఉన్న ఆరాధనా లేదా సంగీత సూచనను అనువదించకుండా తెలుగు లిపిలో నిలుపుతుంది.
theological_decisions:
- issue: బాధలో దేవుని కార్యసాధకత్వం
  choice: దేవుని చెయ్యి కీర్తనకర్త మీద భారంగా ఉందని నేరుగా అనువదించడం
  alternative: సాధారణ బాధగా మాత్రమే చెప్పడం లేదా దీనిని స్పష్టమైన శిక్షాసిద్ధాంతంగా విస్తరించడం
  rationale: మూలపాఠం దేవుని చెయ్యిని స్పష్టంగా ప్రస్తావిస్తుంది; అయితే ఆ బాధ యొక్క పూర్తి తాత్త్విక విధానాన్ని వివరించదు. అందువల్ల దైవ కార్యసాధకత్వాన్ని నిలుపుతూ అదనపు సిద్ధాంత నిర్ణయాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘చెయ్యి భారంగా ఉండింది’ అనే హీబ్రూ రూపకం, ‘జీవసారం’ అనే శరీరాధారిత చిత్రం, అలాగే ‘సెలా’ అనే అనిశ్చిత సంగీత/ఆరాధనా సూచన నిలుపబడ్డాయి.
