id: PSA.32.11
reference: Psalms 32:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שִׂמְח֬וּ בַֽ/יהוָ֣ה וְ֭/גִילוּ צַדִּיקִ֑ים וְ֝/הַרְנִ֗ינוּ כָּל יִשְׁרֵי לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/011.yaml
  text: Be glad in Yahweh and rejoice[a], you righteous; shout for joy[b], all you upright in heart.
translation:
  language: te
  text: యాహ్వేలో సంతోషించి ఉల్లసించండి, నీతిమంతులారా! హృదయ యథార్థులైన మీరందరూ ఆనందధ్వని చేయండి![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆనందంతో కేకలు వేయండి” లేదా “ఆనందగానం చేయండి.” హీబ్రూ క్రియ ఆనందంతో మ్రోగే స్వరాన్ని సూచిస్తుంది; అది పలికిన కేకగానీ పాడిన గానంగానీ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחוּ
  choice: సంతోషించండి
  rationale: שׂמח అనే క్రియ యొక్క బహువచన ఆజ్ఞారూపం. ఆనందంగా ఉండాలనే పిలుపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; తరువాతి גילו నుండి పదభేదాన్ని కూడా నిలుపుతుంది.
- source_word: בַיהוָה
  choice: యెహోవాలో
  rationale: ב ఉపసర్గ ఆనందానికి పరిధి లేదా ఆధారాన్ని సూచిస్తుంది; దేవుని వ్యక్తిగత నామాన్ని తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: וְגִילוּ
  choice: ఉల్లసించండి
  rationale: גיל ఉప్పొంగే ఆనందాన్ని సూచించే బహువచన ఆజ్ఞారూపం. ‘ఉల్లసించండి’ మొదటి క్రియను అనవసరంగా పునరావృతం చేయకుండా దాని ఉత్సాహభరిత భావాన్ని నిలుపుతుంది.
- source_word: צַדִּיקִים
  choice: నీతిమంతులారా
  rationale: ఇది ఆజ్ఞలను స్వీకరించేవారిని నేరుగా సంబోధించే పదం; తెలుగు సంబోధన రూపం ఆ కార్యాన్ని స్పష్టంగా చూపుతుంది.
- source_word: וְהַרְנִינוּ
  choice: ఆనందధ్వని చేయండి
  rationale: רנן యొక్క హిఫిల్ బహువచన ఆజ్ఞారూపం ఆనందంతో మ్రోగే స్వరాన్ని సూచిస్తుంది. అది కేకగా లేదా గానంగా ఉండగల అస్పష్టతను ‘ఆనందధ్వని’ కొంతవరకు కాపాడుతుంది.
- source_word: כָּל
  choice: అందరూ
  rationale: సంబోధించబడుతున్న సమూహమంతటినీ చేర్చే పరిమాణార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יִשְׁרֵי לֵב
  choice: హృదయంలో యథార్థంగా ఉన్నవారు
  rationale: అంతరంగ నైతిక నిష్కపటతను సూచించే హీబ్రూ నుడికారాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; దానిని కేవలం బాహ్య ప్రవర్తనగా కుదించదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠం బిరుదును కాక నాలుగు అక్షరాల దైవనామాన్ని వాడుతుంది. వ్యక్తిగత నామాన్ని నిలుపుతూ, సాధారణ తెలుగు బైబిలు పాఠకులకు పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ సాధ్యమైన పండితుల లిప్యంతరీకరణ.
- issue: רנן యొక్క వ్యక్తీకరణ విధానం
  choice: ఆనందధ్వని చేయండి
  alternative: ఆనందంతో కేకలు వేయండి / ఆనందగానం చేయండి
  rationale: హీబ్రూ క్రియ ఆనందంతో మ్రోగే కేకను లేదా గానాన్ని సూచించగలదు. ప్రధాన పాఠం రెండింటిలో ఒక్కదానిని మాత్రమే ఖరారు చేయకుండా విస్తృతమైన పదబంధాన్ని వాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గౌరవభరితమైన, ఉత్సాహపూరిత సంబోధన. సమాంతర ఆజ్ఞారూపాలను నిలుపుతూ, అసహజమైన పదానువాదాన్ని నివారించాం.
