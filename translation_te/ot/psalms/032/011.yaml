  terminology: Use “యాహ్వే” for the Tetragrammaton, in accordance with the supplied English POB audit trail and theological decision. “నీతిమంతులు” and “హృదయ యథార్థులు” appropriately distinguish the verse’s two Hebrew descriptions.
  issues:
