id: PSA.32.6
reference: Psalms 32:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַל זֹ֡את יִתְפַּלֵּ֬ל כָּל חָסִ֨יד אֵלֶי/ךָ֮ לְ/עֵ֪ת מְ֫צֹ֥א רַ֗ק לְ֭/שֵׁטֶף מַ֣יִם רַבִּ֑ים אֵ֝לָ֗י/ו לֹ֣א יַגִּֽיעוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/006.yaml
  text: Therefore let every godly one pray to you at a time when you may be found[a]; surely when the great floodwaters come[b], they will not reach him.
translation:
  language: te
  text: కాబట్టి భక్తిగల ప్రతి ఒక్కరూ నిన్ను కనుగొనగల సమయంలో నీకు ప్రార్థించాలి[a]. నిశ్చయంగా, అనేక జలాల వెల్లువ వచ్చినా[b], అవి అతనిని చేరవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దీనికోసం విశ్వాసపాత్రుడైన ప్రతి ఒక్కరూ నిన్ను కనుగొనగల సమయంలో నీకు ప్రార్థించాలి.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అనేక జలాల వెల్లువలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל זֹאת
  choice: కాబట్టి
  rationale: ముందటి వచనంలోని పాపఒప్పుకోలు, క్షమాపణల నుంచి వచ్చే నిర్ధారణను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יִתְפַּלֵּל
  choice: ప్రార్థించాలి
  rationale: ఈ సందర్భంలోని అపూర్ణ క్రియకు ఉన్న ప్రోత్సాహక లేదా విధ్యర్థక భావాన్ని ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָּל חָסִיד
  choice: భక్తిగల ప్రతి ఒక్కరూ
  rationale: חָסִיד సూచించే దేవునిపట్ల విశ్వాసపూర్వక నిబద్ధత, భక్తి భావాలను మతశాఖాపరమైన పదజాలం లేకుండా అందిస్తుంది.
- source_word: אֵלֶיךָ
  choice: నీకు
  rationale: ప్రార్థన ఎవరిని ఉద్దేశించిందో చూపే దిశార్థక భావాన్ని సంక్షిప్తంగా నిలుపుతుంది; మూలంలో లేని 'దేవా'ను చేర్చదు.
- source_word: לְעֵת מְצֹא
  choice: నీవు దొరికే సమయంలో
  rationale: వ్యాకరణపరంగా సంక్షిప్తమైన 'కనుగొనే సమయంలో' అనే భావాన్ని, దేవుడు కనుగొనబడే సమయంగా అర్థమయ్యేలా ఇస్తుంది; ఇతర సాధ్యమైన పఠనాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: רַק
  choice: అయినా
  rationale: తర్వాతి వాక్యంలోని ధీమాను, విపత్తు వచ్చినప్పటికీ రక్షణ ఉంటుందనే వ్యతిరేక భావంతో సహజమైన తెలుగులో అనుసంధానిస్తుంది.
- source_word: לְשֵׁטֶף מַיִם רַבִּים
  choice: అనేక జలాలు ఉప్పొంగి ప్రవహించినా
  rationale: అనేక జలాల వెల్లువ అనే కవితాత్మక చిత్రాన్ని సహజంగా, సజీవంగా ఉంచుతుంది; దాన్ని కేవలం సాధారణ కష్టంగా వివరణాత్మకంగా మార్చదు.
- source_word: אֵלָיו לֹא יַגִּיעוּ
  choice: అవి అతని వరకు చేరవు
  rationale: జలాలు ప్రార్థించే భక్తుని వరకు చేరవనే ఏకవచన సూచనను, 'చేరడం' అనే మూల క్రియార్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: రక్షణ వాగ్దానంలో 'అతను' ఎవరిని సూచిస్తుంది?
  choice: ప్రార్థించే భక్తిగల వ్యక్తిని సూచించేలా 'అతని' అని అనువదించడం
  alternative: జలాలు దేవుని వరకు చేరవని అర్థం చేసుకోవడం
  rationale: సమీప వ్యాకరణ సందర్భంలో אֵלָיו భక్తిగల వ్యక్తినే సూచించడం అత్యంత సహజం. అయినా జలాలు అక్షరార్థపు వరదనా, విపత్తు లేదా తీర్పుకు రూపకమా అన్నది అనువాదంలో నిర్ధారించకుండా కవితాత్మక చిత్రాన్ని అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కవితాత్మక శైలి. దేవునికి సంబోధనలో ఏకవచన ‘నీవు/నీకు’ వాడబడింది; మూలంలోని రూపకాన్ని సిద్ధాంతపరంగా విప్పి చెప్పలేదు.
