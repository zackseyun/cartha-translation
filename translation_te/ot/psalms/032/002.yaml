revisions:
- from: యెహోవా ఎవరి లెక్కలో అపరాధాన్ని[a] వేయడో, ఎవరి ఆత్మలో కపటం లేదో, ఆ మనిషి[b] ధన్యుడు.
  to: యెహోవా ఎవరి మీద అపరాధాన్ని[a] లెక్కించడో, ఎవరి ఆత్మలో కపటం లేదో, ఆ మనిషి[b] ధన్యుడు.
  rationale: The revision changes only the Telugu expression of the accounting relation. “ఎవరి మీద ... లెక్కించడో” preserves the Hebrew reckoning metaphor and clearly identifies the person as the one against whom guilt is not counted. No theological interpretation beyond the source wording is introduced; the two coordinated relative clauses and the generic singular beatitude are retained.
