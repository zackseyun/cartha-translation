  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַ֥שְֽׁרֵי אָדָ֗ם לֹ֤א יַחְשֹׁ֬ב יְהוָ֣ה ל֣/וֹ עָוֺ֑ן וְ/אֵ֖ין בְּ/רוּח֣/וֹ רְמִיָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/002.yaml
  text: Blessed is the man to whom Yahweh does not count iniquity[b][a], and in whose spirit there is no deceit.
translation:
  language: te
  text: యెహోవా ఎవరి మీద అపరాధాన్ని[a] లెక్కించడో, ఎవరి ఆత్మలో కపటం లేదో, ఆ మనిషి[b] ధన్యుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పాపాన్ని’ లేదా ‘దోషాన్ని.’ హీబ్రూ పదం చేసిన అపరాధాన్ని గానీ, దానివల్ల కలిగే దోషభారాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘మనిషి’ ఇక్కడ పురుషులకు మాత్రమే పరిమితం కాదు; ఏ మానవ వ్యక్తికైనా వర్తించే సాధారణార్థక ఏకవచనం.
    reason: source_form_clarification
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: ధన్యుడు
  rationale: హీబ్రూ బహువచన రూపంలోని ఈ ఆశీర్వచనం ఇక్కడ ఒక వ్యక్తిని ధన్యుడిగా ప్రకటిస్తుంది. ‘ధన్యుడు’ గంభీరతను నిలుపుతూ ఆధునిక తెలుగు పాఠకులకు సహజంగా ఉంటుంది.
- source_word: אָדָם
  choice: మనిషి
  rationale: ఇది ఏ మానవ వ్యక్తికైనా వర్తించే సాధారణార్థక ఏకవచనం. ‘మనిషి’ హీబ్రూ ఏకవచన రూపాన్ని, దాని సమగ్ర మానవార్థాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: יַחְשֹׁב ... לּוֹ
  choice: ఎవరి లెక్కలో ... వేయడో
  rationale: חשב అనే క్రియలోని లెక్కించడం లేదా ఖాతాలో చేర్చడం అనే రూపకాన్ని స్పష్టమైన, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన నాలుగు హీబ్రూ అక్షరాల పేరును తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంతో సూచిస్తుంది.
- source_word: עָוֹן
  choice: అపరాధం
  rationale: ఈ పదం దోషకార్యాన్ని, పాపాన్ని, దానివల్ల కలిగే దోషభారాన్ని సూచించగలదు. సందర్భంలో నైతిక తప్పును, లెక్కలో వేయబడే దోషాన్ని రెండింటినీ ‘అపరాధం’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּרוּחוֹ
  choice: ఎవరి ఆత్మలో
  rationale: వ్యక్తి అంతర్గత స్వభావం లేదా మనోవైఖరిని సూచించే רוּחַ పదాన్ని మూలానికి దగ్గరగా ఉంచుతుంది.
- source_word: רְמִיָּה
  choice: కపటం
  rationale: మోసపూరితమైన అంతర్గత వైఖరిని ‘కపటం’ సంక్షిప్తంగా, గౌరవప్రదంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: సాధారణార్థక ఏకవచన మానవ సూచన
  choice: ఆ మనిషి
  alternative: ఆ వ్యక్తి
  rationale: אָדָם ఇక్కడ ఒక్క పురుషునికే పరిమితం కాకుండా ప్రతినిధి మానవ వ్యక్తిని సూచిస్తుంది. ‘మనిషి’ మూలంలోని ఏకవచనాన్ని నిలుపుతూ తెలుగులో సాధారణార్థాన్ని కలిగి ఉంటుంది.
- issue: దేవుడు అపరాధాన్ని లెక్కించకపోవడంలోని లెక్కల రూపకం
  choice: ఎవరి లెక్కలో అపరాధాన్ని వేయడో
  alternative: ఎవరికి అపరాధాన్ని ఆపాదించడో
  rationale: మూలంలోని లెక్కింపు రూపకాన్ని తరువాతి సిద్ధాంతపరమైన సాంకేతిక పదజాలంగా మార్చకుండా, సాధారణ పాఠకునికి అర్థమయ్యేలా నిలుపుతుంది.
- issue: עָוֹן పదంలోని అపరాధం–దోషభారం భావ విస్తృతి
  choice: అపరాధం
  alternative: పాపం; దోషం
  rationale: మూలపదం చేసిన తప్పును, దాని దోషభారాన్ని రెండింటినీ సూచించగలదు. ప్రధాన పాఠంలో ఒకే భావానికి పరిమితం చేయకుండా ‘అపరాధం’ వాడి, ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ఆశీర్వచన శైలిని అనుసరించాం. ‘లెక్కలో ... వేయడం’ అనే సాధారణ ప్రయోగంతో హీబ్రూ లెక్కింపు రూపకాన్ని నిలిపాం; ‘కపటం’ మరియు ‘ఆత్మ’ మూలంలోని అంతర్గత నైతిక భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తాయి.
