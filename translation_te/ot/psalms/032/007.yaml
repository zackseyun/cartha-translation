source:
  edition: WLC
  text: אַתָּ֤ה סֵ֥תֶר לִ/י֮ מִ/צַּ֪ר תִּ֫צְּרֵ֥/נִי רָנֵּ֥י פַלֵּ֑ט תְּס֖וֹבְבֵ֣/נִי סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/007.yaml
  text: You are a hiding place for me[a]; from distress you preserve me; you surround me with shouts of deliverance[b]. Selah
translation:
  language: te
  text: 'నీవు నాకు దాగుచోటువి;


    ఆపద నుండి నన్ను కాపాడుతావు;


    రక్షణ ఆనందఘోషలతో నన్ను చుట్టుముడతావు.[a]


    సెలా.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విడుదల గీతాలు’ లేదా ‘రక్షణను ప్రకటించే మోగే కేకలు.’
    reason: lexical_alternative
  - marker: b
    text: ‘సెలా’ బహుశా సంగీతపరమైన లేదా ఆరాధనకు సంబంధించిన సూచన; దాని ఖచ్చితమైన అర్థం తెలియదు.
    reason: cultural_note
lexical_decisions:
- source_word: סֵתֶר
  choice: దాగుచోటు
  rationale: ఈ నామవాచకం దాగి ఉండే లేదా రక్షణ పొందే స్థలాన్ని సూచిస్తుంది. ‘దాగుచోటు’ ఆశ్రయ రూపకాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: מִצַּר
  choice: ఆపద నుండి
  rationale: צַר ఇక్కడ ఇరుకు స్థితి, కష్టం, ఆపద అనే విస్తృత భావాన్ని కలిగి ఉంది. వ్యక్తిగత శత్రువును నిర్దిష్టంగా సూచించకుండా ప్రమాదకర పరిస్థితిని ‘ఆపద’ తెలియజేస్తుంది.
- source_word: תִּצְּרֵנִי
  choice: నన్ను కాపాడుతావు
  rationale: נצר అంటే కాయడం, భద్రపరచడం, కాపాడడం. ఆధునిక తెలుగులో ‘కాపాడుతావు’ సహజంగా ఉండి దైవ రక్షణ భావాన్ని నిలుపుతుంది.
- source_word: רָנֵּי פַלֵּט
  choice: విడుదల ఆనందఘోషలు
  rationale: רָנֵּי అనేది మోగే, సాధారణంగా ఆనందభరితమైన కేకలు లేదా గానాలను సూచిస్తుంది; פַלֵּט రక్షణ లేదా తప్పింపును సూచిస్తుంది. ‘విడుదల ఆనందఘోషలు’ శబ్దోద్ఘాటనను, ఆనందాన్ని నిలుపుతూ దానిని తప్పనిసరిగా పాటలుగానే పరిమితం చేయదు.
- source_word: תְּסוֹבְבֵנִי
  choice: నన్ను చుట్టుముట్టేలా చేస్తావు
  rationale: סבב అంటే చుట్టుముట్టడం. హిబ్రూ వాక్యనిర్మాణంలో దేవుడే ఈ ఘోషలు కీర్తనకర్తను చుట్టుముట్టేలా చేస్తున్నాడనే భావాన్ని ఈ రూపం సహజ తెలుగులో తెలియజేస్తుంది; ఘోషలు ఎవరివో మాత్రం నిర్ణయించదు.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఈ పదం యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం. ఊహాత్మక అర్థాన్ని చేర్చకుండా లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: కీర్తనకర్తను చుట్టుముట్టే ‘విడుదల ఆనందఘోషల’ స్వభావం మరియు మూలం
  choice: విడుదలకు సంబంధించిన ఆనందభరిత ఘోషలు కీర్తనకర్తను చుట్టుముట్టేలా దేవుడు చేస్తాడనే కవితాత్మక చిత్రణను నిలుపడం
  alternative: విజయగీతాలు; విడుదల గీతాలు; రక్షణ కేకలు
  rationale: רָנֵּי פַלֵּט అనే సంక్షిప్త హిబ్రూ పదబంధం పాటలు, ఆనందకేకలు, రక్షణ ఘోషలు అనే సమీప భావాలకు వీలు ఇస్తుంది. ఘోషించేది దేవుడా, ఆరాధకులా, కీర్తనకర్తనా అని మూలపాఠం చెప్పదు; అనువాదం కూడా దాన్ని నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కవితా శైలి వాడబడింది. సమాంతర పాద నిర్మాణం నిలుపబడింది. ‘ఆనందఘోషలు’ సాధారణ పాఠకునికి అర్థమయ్యేలా ఉండి రָנֵּי యొక్క శబ్దభరిత ఆనందాన్ని వ్యక్తం చేస్తుంది. అన్ని పాదాల్లో ఏకవచన ప్రత్యక్ష సంబోధనను కొనసాగించాం.
