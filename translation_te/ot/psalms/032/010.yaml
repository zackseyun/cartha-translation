  terminology: “స్థిరమైన ప్రేమ” is a clear modern Telugu equivalent for חֶסֶד in this context, retaining the enduring aspect while the note preserves alternatives such as mercy and covenant love. “దుష్టునికి” appropriately retains the representative singular without restricting the sense to one particular man.
  issues:
  - severity: low
    issue: Generic participle rendered with masculine singular “నమ్ముకొనేవాణ్ణి.”
    rationale: The Hebrew participle is substantival and representative, not specifically male. Modern Telugu naturally uses an inclusive plural form for this generic class.
  - severity: low
    issue: “ఆవరించి ఉంటుంది” is less direct than the Hebrew finite verb.
    rationale: The Hebrew says that ḥesed surrounds/encircles the trusting person. “చుట్టుముడుతుంది” expresses this action directly and idiomatically.
  revised_text: దుష్టునికి అనేక బాధలు కలుగుతాయి[a]; అయితే యెహోవాను నమ్ముకొనేవారిని స్థిరమైన ప్రేమ చుట్టుముడుతుంది[b].
