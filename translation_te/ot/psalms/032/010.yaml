  text: רַבִּ֥ים מַכְאוֹבִ֗ים לָ/רָ֫שָׁ֥ע וְ/הַ/בּוֹטֵ֥חַ בַּ/יהוָ֑ה חֶ֝֗סֶד יְסוֹבְבֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/010.yaml
  text: Many pains belong to the wicked[b][a], but steadfast love surrounds the one who trusts in Yahweh.
translation:
  language: te
  text: దుష్టునికి అనేక బాధలు కలుగుతాయి[a]; అయితే యెహోవాను నమ్ముకొనేవారిని స్థిరమైన ప్రేమ చుట్టుముడుతుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దుష్టునికి అనేక దుఃఖాలు ఉంటాయి.” హీబ్రూ నామవాచకం నొప్పులు, దుఃఖాలు లేదా బాధలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ חֶסֶד అనే పదాన్ని సందర్భానుసారం “కరుణ,” “విశ్వసనీయ ప్రేమ,” లేదా “ఒడంబడిక ప్రేమ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: అనేక
  rationale: పరిమాణాన్ని తెలిపే సాధారణ విశేషణం; వాక్యారంభంలోని ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מַכְאוֹבִים
  choice: బాధలు
  rationale: శారీరక నొప్పులు, మనోవేదనలు, కష్టాలు అనే విస్తృత భావపరిధిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לָרָשָׁע
  choice: దుష్టునికి ... కలుగుతాయి
  rationale: ל సంబంధం లేదా దత్తార్థాన్ని సూచిస్తుంది; కారణాన్ని అతిగా నిర్ధారించకుండా ‘దుష్టునికి’ అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וְהַבּוֹטֵחַ
  choice: అయితే ... నమ్ముకొనేవాణ్ణి
  rationale: కృదంతం వ్యక్తిని సూచిస్తుంది; రెండు భాగాల మధ్య వ్యత్యాసం ఉన్నందున וְ ను ‘అయితే’గా అనువదించాం.
- source_word: בַּיהוָה
  choice: యెహోవాను
  rationale: בטח + ב అనే నిర్మాణం తెలుగులో ‘యెహోవాను నమ్ముకొను’ అని సహజంగా వస్తుంది; దైవనామాన్ని పేరుగానే ఉంచుతుంది.
- source_word: חֶסֶד
  choice: ఆయన నిబద్ధ ప్రేమ
  rationale: חֶסֶד లోని నిలకడైన విశ్వసనీయత, కరుణ, సంబంధ నిబద్ధతను ‘నిబద్ధ ప్రేమ’ సంక్షిప్తంగా ప్రతిబింబిస్తుంది; స్పష్టత కోసం స్వామ్యార్థకమైన ‘ఆయన’ చేర్చబడింది.
- source_word: יְסוֹבְבֶנּוּ
  choice: ఆవరించి ఉంటుంది
  rationale: చుట్టుముట్టడం లేదా అన్ని వైపులా ఉండడం అనే క్రియాభావాన్ని గంభీరమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ పాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచాం; మూల ఉచ్చారణపై ఉన్న అనిశ్చితిని అనువాదం తీర్చివేయదు.
- issue: רָשָׁע అనే ఏకవచన పురుషరూపం
  choice: దుష్టుడు / దుష్టునికి
  alternative: దుష్టులు
  rationale: మూలంలోని ప్రతినిధిక ఏకవచనాన్ని నిలుపుతూ, అది ఒక నిర్దిష్ట పురుషునికే పరిమితం కాకుండా సాధారణ స్వభావవర్గాన్ని సూచించేలా సహజమైన తెలుగు రూపాన్ని వాడాం.
- issue: חֶסֶד యొక్క భావవ్యాప్తి
  choice: నిబద్ధ ప్రేమ
  alternative: కరుణ
  rationale: కేవలం జాలి అనే భావానికి పరిమితం చేయకుండా, విశ్వసనీయమైన మరియు నిలకడైన ప్రేమ అనే వేదాంతపరమైన ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకునికి అర్థమయ్యేలా గౌరవప్రదమైన కవితాత్మక శైలిని ఉపయోగించాం. మొదటి భాగంలోని ఫలిత సంబంధాన్ని అతిగా కారణాత్మకంగా చేయకుండా, రెండో భాగంలోని వ్యత్యాసాన్ని స్పష్టంగా ఉంచాం.
