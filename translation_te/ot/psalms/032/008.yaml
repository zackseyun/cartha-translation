source:
  edition: WLC
  text: אַשְׂכִּֽילְ/ךָ֨ וְֽ/אוֹרְ/ךָ֗ בְּ/דֶֽרֶךְ ז֥וּ תֵלֵ֑ךְ אִֽיעֲצָ֖ה עָלֶ֣י/ךָ עֵינִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/008.yaml
  text: I will instruct you and teach you in the way you should go[c][b][a]; I will counsel you with my eye upon you.
translation:
  language: te
  text: నేను నీకు అవగాహన కలిగిస్తాను; నీవు నడవవలసిన మార్గాన్ని నీకు బోధిస్తాను.[a][b] నా కన్ను నీ మీద ఉంచి నీకు సలహా ఇస్తాను.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీవు నడిచే మార్గాన్ని’ లేదా ‘ఈ మార్గంలో నీవు నడుస్తావు’ అని కూడా అనువదించవచ్చు. హెబ్రీ పదప్రయోగం సాధారణ భవిష్యత్ భావానికి వీలు ఇస్తుంది; అయితే ఉపదేశ సందర్భం ‘నడవవలసిన మార్గం’ అనే భావానికి మద్దతిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ వచనంలో మాట్లాడుతున్నది యెహోవా కావచ్చు లేదా కీర్తనకర్త కావచ్చు; హెబ్రీ పాఠ్యం వక్తను స్పష్టంగా గుర్తించదు.
    reason: alternative_reading
  - marker: c
    text: అక్షరార్థంగా, ‘నీ మీద నా కన్ను.’ ఇది జాగ్రత్తతో కూడిన మార్గదర్శకత్వాన్ని లేదా శ్రద్ధగల సంరక్షణను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׂכִּילְךָ
  choice: నేను నీకు అవగాహన కలిగిస్తాను
  rationale: שׂכל హిఫీల్ రూపంలోని కారణార్థాన్ని—అవగాహన కలిగించడం లేదా వివేకం ఇవ్వడం—స్పష్టంగా నిలుపుతుంది; తరువాతి బోధనా క్రియతో సహజంగా జతపడుతుంది.
- source_word: וְאוֹרְךָ
  choice: నీకు బోధిస్తాను
  rationale: ירה హిఫీల్‌కు బోధించడం, నిర్దేశించడం అనే భావాలున్నాయి. ‘మార్గం’ అనే తరువాతి పదబంధం దిశానిర్దేశ భావాన్ని మోస్తుండగా, ఈ ఎంపిక బోధనా భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּדֶרֶךְ זוּ תֵלֵךְ
  choice: నీవు నడవవలసిన మార్గాన్ని
  rationale: హెబ్రీ వాక్యనిర్మాణం ‘నీవు నడిచే/నడవబోయే మార్గం’ లేదా ‘ఈ మార్గంలో నీవు నడుస్తావు’ అనే అర్థాలకు వీలు ఇస్తుంది. ఉపదేశ సందర్భంలో ‘నడవవలసిన మార్గం’ సహజమైన తెలుగు; ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
- source_word: אִיעֲצָה
  choice: నీకు సలహా ఇస్తాను
  rationale: יעץ యొక్క సలహా లేదా ఆలోచన చెప్పడం అనే జ్ఞానోపదేశ భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: עָלֶיךָ עֵינִי
  choice: నా కన్ను నీ మీద ఉంచి
  rationale: ‘నీ మీద నా కన్ను’ అనే మూల రూపకాన్ని నిలుపుతూ, శ్రద్ధతో కూడిన పర్యవేక్షణ లేదా మార్గదర్శకత్వం అనే సాధ్యమైన భావాలను ముందే నిర్ణయించదు.
theological_decisions:
- issue: కీర్తన 32:8లో మాట్లాడుతున్న వ్యక్తి ఎవరు?
  choice: ప్రథమ పురుషంలోనే అనువదించి, మాట్లాడుతున్నది యెహోవా అని గానీ కీర్తనకర్త అని గానీ ప్రధాన పాఠ్యంలో పేర్కొనలేదు.
  alternative: మాట్లాడుతున్నది యెహోవా అని స్పష్టీకరించడం; లేదా కీర్తనకర్త శ్రోతతో మాట్లాడుతున్నాడని స్పష్టీకరించడం.
  rationale: ఈ వచనంలోని హెబ్రీ పాఠ్యం వక్తను ప్రత్యక్షంగా గుర్తించదు. అందువల్ల మూలంలోని వ్యాఖ్యాన స్వేచ్ఛను అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని వాడాం. మూలంలోని కన్ను రూపకాన్ని, వక్తకు సంబంధించిన అస్పష్టతను నిలిపాం; ‘నడవవలసిన’ అనేది సందర్భానుకూల optimal-equivalence ఎంపిక.
