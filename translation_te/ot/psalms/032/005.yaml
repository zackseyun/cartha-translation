  text: חַטָּאתִ֨/י אוֹדִ֪יעֲ/ךָ֡ וַ/עֲוֺ֘נִ֤/י לֹֽא כִסִּ֗יתִי אָמַ֗רְתִּי אוֹדֶ֤ה עֲלֵ֣י פְ֭שָׁעַ/י לַ/יהוָ֑ה וְ/אַתָּ֨ה נָ֘שָׂ֤אתָ עֲוֺ֖ן חַטָּאתִ֣/י סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/005.yaml
  text: I made my sin known to you[a], and I did not cover my iniquity. I said, “I will confess my transgressions to Yahweh,” and you forgave the iniquity of my sin. Selah
translation:
  language: te
  text: నా పాపాన్ని నీకు తెలియజేశాను; నా దోషాన్ని కప్పిపెట్టలేదు. “యాహ్వేకు నా అతిక్రమాలను ఒప్పుకుంటాను” అని చెప్పాను. నీవు నా పాపపు దోషాన్ని క్షమించావు.[a] సెలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నా పాపపు దోషాన్ని నీవు ఎత్తి తీసివేశావు” లేదా “మోశావు.” ఈ క్రియ భారం తొలగించే చిత్రాన్ని కలిగి ఉండి, ఇక్కడ నుడికారంగా “క్షమించావు” అని అర్థమిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטָּאתִי
  choice: నా పాపాన్ని
  rationale: חטאת అనే పదానికి సాధారణమైన, సహజమైన సమానార్థం ‘పాపం’; ఈ వచనంలోని మూడు పాపసంబంధ పదాల మధ్య భేదాన్ని కూడా ఇది నిలుపుతుంది.
- source_word: אוֹדִיעֲךָ
  choice: నీకు తెలియజేశాను
  rationale: ידע హిఫీల్ రూపంలోని ‘తెలియజేయడం’ అనే causative భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עֲוֺנִי
  choice: నా దోషాన్ని
  rationale: עון పాపం, దోషం, అపరాధభారం వంటి భావాలను కలిగి ఉంటుంది; ‘దోషం’ ఇక్కడ חטאת, פשע పదాల నుంచి పదభేదాన్ని నిలుపుతూ సహజంగా ఉంటుంది.
- source_word: לֹא כִסִּיתִי
  choice: కప్పిపెట్టలేదు
  rationale: כסה లోని ‘కప్పడం’ అనే రూపకాన్ని నిలుపుతూ, దాచకుండా ఒప్పుకోవడం అనే సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אוֹדֶה
  choice: ఒప్పుకుంటాను
  rationale: ידה హిఫీల్ సందర్భానుసారం స్తుతించడం లేదా ఒప్పుకోవడం కావచ్చు; ‘నా అతిక్రమాలు’ అనే కర్మతో పశ్చాత్తాప సందర్భంలో ‘ఒప్పుకోవడం’ సరైనది.
- source_word: עֲלֵי פְשָׁעַי
  choice: నా అతిక్రమాలను … ఎదుట
  rationale: על ఇక్కడ ఒప్పుకోలు దేనిని గూర్చినవో సూచిస్తుంది; తెలుగులో నేరుగా కర్మగా పలకడం సహజం. దేవుని సమక్షంలో ఒప్పుకోవడాన్ని ‘ఎదుట’ వ్యక్తం చేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవా ఎదుట
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా సుపరిచితమైన తెలుగు లిప్యంతరీకరణ ‘యెహోవా’గా ఉంచింది; ל ఉపసర్గను సందర్భానుకూలంగా ‘ఎదుట’గా అనువదించింది.
- source_word: נָשָׂאתָ
  choice: క్షమించావు
  rationale: נשא అక్షరార్థంగా ఎత్తడం లేదా మోయడం; దోషం కర్మగా వచ్చినప్పుడు క్షమించడం అనే నుడికారార్థం ఇస్తుంది. మూల రూపకం పాదసూచికలో నిలుపబడింది.
- source_word: עֲוֺן חַטָּאתִי
  choice: నా పాపదోషాన్ని
  rationale: ‘నా పాపపు దోషం’ అనే భావాన్ని సహజమైన తెలుగు సమాసంలో తెలిపి, పాపం మరియు దాని దోషభారం రెండింటి పొరలను వీలైనంత వరకు నిలుపుతుంది.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఈ పదం యొక్క ఖచ్చితమైన భావం అనిశ్చితం కాబట్టి వివరణాత్మక అర్థాన్ని రుద్దకుండా లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని సాధారణ బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచింది. హీబ్రూ ఉచ్చారణ పునర్నిర్మాణం పూర్తిగా నిశ్చితం కాదనే అంశాన్ని అంగీకరిస్తుంది.
- issue: נָשָׂאתָ עֲוֺן లోని రూపకాన్ని అక్షరార్థంగా ఉంచాలా, నుడికారార్థంగా ఇవ్వాలా
  choice: ప్రధాన పాఠంలో ‘క్షమించావు’
  alternative: నా పాపదోషాన్ని ఎత్తివేశావు; నా పాపదోషాన్ని మోశావు
  rationale: ఈ సందర్భంలో దైవిక క్షమాపణే ఉద్దేశించిన నుడికారార్థం. అయితే భారం ఎత్తివేయడం లేదా మోయడం అనే మూల రూపకానికి వేదాంతపరమైన ప్రాముఖ్యత ఉండటంతో దాన్ని పాదసూచికలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. חטאת, עון, פשע అనే మూడు పదాలకు వరుసగా ‘పాపం’, ‘దోషం’, ‘అతిక్రమాలు’ ఉపయోగించి మూలంలోని పదభేదాన్ని నిలుపబడింది. కవితాత్మక ప్రవాహం కోసం చిన్న వాక్యాలు వాడబడ్డాయి.
