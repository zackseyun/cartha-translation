  text: נַפְשִׁ֤/י בְּ/ת֥וֹךְ לְבָאִם֮ אֶשְׁכְּבָ֪ה לֹ֫הֲטִ֥ים בְּֽנֵי אָדָ֗ם שִׁ֭נֵּי/הֶם חֲנִ֣ית וְ/חִצִּ֑ים וּ֝/לְשׁוֹנָ֗/ם חֶ֣רֶב חַדָּֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/004.yaml
  text: My soul is in the midst of lions[a]; I lie down among those who are aflame—sons of man, whose teeth are spears and arrows[b], and whose tongue is a sharp sword.
translation:
  language: te
  text: 'నా ప్రాణం సింహాల మధ్య ఉంది;


    మండుతున్న మనుష్యుల[a] మధ్య నేను పడుకొని ఉన్నాను—


    వారి పళ్లు ఈటెలు, బాణాలు,


    వారి నాలుక పదునైన ఖడ్గం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో పదశః ‘మండుతున్నవారు, మనుష్య కుమారులు’ లేదా ‘ఆదాము కుమారులు.’ ‘మండుతున్నవారు’ను ‘జ్వలించేవారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשִׁי
  choice: నా ప్రాణం
  rationale: נֶפֶשׁ ఇక్కడ వ్యక్తి, ప్రాణం, జీవితం అనే భావాలను మోస్తుంది. ‘నా ప్రాణం’ హెబ్రీ కవితా చిత్రాన్ని నిలుపుతూ ప్రమాదంలో ఉన్న కీర్తనకర్తను సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: בְּתוֹךְ לְבָאִם
  choice: సింహాల మధ్య
  rationale: చుట్టుముట్టిన ప్రమాదాన్ని సూచించే בְּתוֹךְ భావాన్నీ, לְבָאִם అనే సింహాల చిత్రాన్నీ వ్యాఖ్యానించి తొలగించకుండా నేరుగా నిలిపింది.
- source_word: אֶשְׁכְּבָה
  choice: నేను పడుకొని ఉన్నాను
  rationale: שׁכב క్రియలోని పడుకోవడం అనే స్పష్టమైన భంగిమను కాపాడుతుంది; ఈ సందర్భంలో కొనసాగుతున్న ప్రమాదకర స్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֹהֲטִים
  choice: మండుతున్నవారు
  rationale: ఈ కృదంతం మండడం లేదా జ్వలించడం అనే రూపకాన్ని కలిగి ఉంది. శత్రువుల తీవ్ర ఉగ్రతగా దాన్ని ముందే పూర్తిగా వ్యాఖ్యానించకుండా, మూలంలోని సంక్షిప్తమైన రూపకాన్ని నిలిపింది.
- source_word: בְּנֵי אָדָם
  choice: మనుష్యులు
  rationale: ఈ హెబ్రీ నానుడి ఇక్కడ సింహాలవంటి శత్రువులు మానవ ప్రత్యర్థులని గుర్తిస్తుంది. ‘మనుష్యులు’ ఆధునిక తెలుగులో సహజమైన అర్థసమాన రూపం; పదశః నిర్మాణం పాదసూచికలో ఇవ్వబడింది.
- source_word: שִׁנֵּיהֶם חֲנִית וְחִצִּים
  choice: వారి పళ్లు ఈటెలు, బాణాలు
  rationale: వారి దాడి స్వభావాన్ని ఆయుధాలతో పోల్చే స్పష్టమైన రూపకాన్ని కాపాడుతుంది. ఏకవచన חֲנִית ను సమాంతరమైన బహువచన ‘బాణాలు’తో సహజంగా సరిపడేలా తెలుగులో ‘ఈటెలు’గా ఇచ్చింది.
- source_word: וּלְשׁוֹנָם חֶרֶב חַדָּה
  choice: వారి నాలుక పదునైన ఖడ్గం
  rationale: హానికరమైన మాటలను పదునైన ఖడ్గంతో పోల్చే మూల రూపకాన్ని సంక్షిప్తంగా, గంభీరంగా నిలిపింది.
theological_decisions:
- issue: సింహాలు, ఆయుధాలు అక్షరార్థమా లేక మానవ శత్రువులకు రూపకాలా?
  choice: మానవ శత్రువులను సూచించే కవితా చిత్రాలుగా అవి పనిచేస్తున్నట్టు పాఠ్యాన్ని ఉంచి, వాటి అక్షరార్థ లేదా రూపకాల స్వభావాన్ని పూర్తిగా తేల్చలేదు.
  alternative: ‘సింహాలు’ను పూర్తిగా నిజమైన జంతువులుగా తీసుకోవడం, లేదా అన్ని చిత్రాలనూ వివరణాత్మకంగా ‘హింసాత్మక శత్రువులు’ అని మార్చడం.
  rationale: వచనం ‘సింహాలు’ అనే చిత్రంనుంచి ‘మనుష్యులు’ అనే గుర్తింపుకు కదులుతుంది. అందువల్ల ఆ కవితా పొరల మధ్య ఉన్న ఉద్రిక్తతను అనువాదం నిలపాలి.
- issue: בְּנֵי אָדָם లోని లింగరూపం మరియు నానుడి భావం
  choice: ప్రధాన పాఠ్యంలో సహజమైన తెలుగు ‘మనుష్యులు’ అని ఇచ్చి, పదశః రూపాన్ని పాదసూచికలో చూపించడం.
  alternative: ‘మనుష్య కుమారులు’ లేదా ‘ఆదాము కుమారులు’.
  rationale: హెబ్రీ బహువచన నానుడి మానవజాతికి చెందినవారిని, ఇక్కడ సందర్భానుసారంగా శత్రువులైన మనుష్యులను సూచిస్తుంది. పదశః తెలుగు ప్రధాన పాఠ్యంలో అసహజంగా లేదా ప్రత్యేక బిరుదులా వినిపించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని ఉపయోగించాం. చిన్న పాదాలు హెబ్రీ సమాంతర నిర్మాణాన్ని ప్రతిబింబిస్తాయి. ‘ప్రాణం,’ ‘ఈటెలు,’ ‘ఖడ్గం’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, కీర్తన కవిత్వానికి తగిన ఔన్నత్యాన్ని నిలుపుతాయి.
