  yaml_path: translation/ot/psalms/057/006.yaml
  text: They prepared a net for my steps[a]; my soul was bowed down; they dug a pit before me; they fell into the midst of it[d][c][b]. Selah
translation:
  language: te
  text: 'వారు నా అడుగుల కోసం వల[a] సిద్ధం చేశారు;

    నా ప్రాణం వంగిపోయింది[b];

    వారు నా ఎదుట గొయ్యి తవ్వారు;

    వారు దాని మధ్యలో పడ్డారు[c]. సెలా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఉచ్చు.’
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: ‘నా ప్రాణం వంగిపోయింది’; ‘నా ప్రాణం’ అంటే ‘నేను’ లేదా ‘నా జీవం’ అని కూడా అర్థం కావచ్చు.'
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘వారు దాని మధ్యలో పడ్డారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶשֶׁת
  choice: వల
  rationale: ఈ నామవాచకం పట్టుకోవడానికి ఉపయోగించే వలను సూచిస్తుంది. సందర్భంలోని ఉచ్చు భావాన్ని స్పష్టంగా ఉంచుతూ, తెలుగులో సహజంగా ఉండే పదం ‘వల’.
- source_word: הֵכִינוּ
  choice: సిద్ధం చేశారు
  rationale: כון ధాతువు హిఫీల్ రూపంలో ‘సిద్ధం చేయడం, ఏర్పాటుచేయడం’ అనే భావం ఇస్తుంది; శత్రువుల ఉద్దేశపూర్వక చర్యను ఇది కాపాడుతుంది.
- source_word: לִפְעָמַי
  choice: నా అడుగులకు
  rationale: פעם ఇక్కడ పాదాలు లేదా అడుగులను సూచించవచ్చు. కదలికలో ఉన్న కీర్తనకర్తను పట్టుకోవాలనే వల చిత్రణకు ‘నా అడుగులకు’ సరిపోతుంది.
- source_word: כָּפַף נַפְשִׁי
  choice: నా ప్రాణం కృంగిపోయింది
  rationale: כפף అంటే వంగడం లేదా కిందికి వాలడం; נפשׁ ఇక్కడ వ్యక్తి అంతరంగాన్ని లేదా స్వయాన్ని సూచిస్తుంది. ‘కృంగిపోయింది’ తెలుగులో సహజంగా ఆ దిగువ స్థితిని తెలియజేస్తుంది; ‘నా ప్రాణం’ అనే హీబ్రూ కవితా వ్యక్తీకరణను నిలుపుతుంది.
- source_word: כָּרוּ
  choice: తవ్వారు
  rationale: గొయ్యి చేయడాన్ని నేరుగా సూచించే సాధారణ క్రియ.
- source_word: לְפָנַי
  choice: నా ఎదుట
  rationale: కీర్తనకర్త ముందున్న స్థానాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: שִׁיחָה
  choice: గొయ్యి
  rationale: ఈ పదం ఉచ్చుగా ఉపయోగించే గుంత లేదా గొయ్యిని సూచిస్తుంది; ‘గొయ్యి’ స్పష్టమైన, సాధారణ తెలుగు పదం.
- source_word: נָפְלוּ בְתוֹכָהּ
  choice: వారే దానిలో పడ్డారు
  rationale: శత్రువులు తాము తవ్విన గొయ్యిలో పడిన వ్యంగ్యాత్మక పరిణామాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. ‘వారే’ అనేది హీబ్రూలోని విషయకర్తను, సందర్భంలోని తిరుగుబాటును ఉద్ఘాటిస్తుంది; ‘దానిలో’ בְתוֹכָהּ యొక్క భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: סֶלָה
  choice: సెలా
  rationale: దీని ఖచ్చితమైన అర్థం అనిశ్చితం; ఇది బహుశా సంగీత లేదా ఆరాధనా సూచిక. ఊహాత్మకంగా అనువదించకుండా లిప్యంతరీకరించబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తన కవిత్వానికి తగిన గంభీరతను ఉంచాం. సమాంతర పాదాలను పంక్తులుగా అమర్చి, వల–గొయ్యి మరియు సిద్ధం చేయడం–పడిపోవడం అనే కవితా నిర్మాణాన్ని నిలిపాం. ‘సెలా’ను అనువదించకుండా ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
