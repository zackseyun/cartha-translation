  to: 'వారు నా అడుగుల కోసం వల[a] సిద్ధం చేశారు;

    నా ప్రాణం వంగిపోయింది[b];

    వారు నా ఎదుట గొయ్యి తవ్వారు;

    వారు దాని మధ్యలో పడ్డారు[c]. సెలా.'
