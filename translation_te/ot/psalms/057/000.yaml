  to: 'సంగీత నాయకునికి: “నాశనం చేయవద్దు.”[a] దావీదుకు చెందిన మిక్తాం;[b] అతడు సౌలు నుండి పారిపోతూ గుహలో ఉన్నప్పుడు.'
