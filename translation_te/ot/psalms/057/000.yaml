source:
  edition: WLC
  text: לַ/מְנַצֵּ֣חַ אַל תַּ֭שְׁחֵת לְ/דָוִ֣ד מִכְתָּ֑ם בְּ/בָרְח֥/וֹ מִ/פְּנֵי שָׁ֝א֗וּל בַּ/מְּעָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/000.yaml
  text: 'For the choirmaster: “Do Not Destroy.” Of David[a]. A miktam, when he fled from Saul[b], in the cave.'
translation:
  language: te
  text: 'సంగీత నాయకునికి: “నాశనం చేయవద్దు.”[a] దావీదుకు చెందిన మిక్తాం;[b] అతడు సౌలు నుండి పారిపోతూ గుహలో ఉన్నప్పుడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ఇది ఒక గీతం పేరు, రాగం పేరు లేదా పల్లవి కావచ్చు. అక్షరార్థం: “నాశనం చేయవద్దు.”'
    reason: alternative_reading
  - marker: b
    text: “మిక్తాం” అనే హీబ్రూ పదం యొక్క అర్థం అనిశ్చితం; అందువల్ల దాన్ని అనువదించకుండా లిప్యంతరీకరించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకునికి
  rationale: కీర్తనల ఉపోద్ఘాతాల్లో ఈ పదం సంగీత నిర్వహణకు బాధ్యత వహించే నాయకుణ్ణి సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజంగా, స్పష్టంగా ఉంది.
- source_word: אַל־תַּשְׁחֵת
  choice: “నాశనం చేయవద్దు” అనే రాగంలో
  rationale: ఇది కీర్తన శరీరంలోని ఆజ్ఞకన్నా, తెలిసిన గీతం లేదా రాగం పేరుగా ఉండే అవకాశం ఎక్కువ. ఉద్ధరణ చిహ్నాలు దాని శీర్షిక స్వభావాన్ని చూపుతాయి; ‘అనే రాగంలో’ దాని సంగీత నిర్దేశక పాత్రను తెలుగులో స్పష్టం చేస్తుంది.
- source_word: לְדָוִד
  choice: దావీదుకు చెందిన
  rationale: לְ ఉపసర్గ రచయితత్వం, సంబంధం లేదా అంకితం అనే భావాల్లో ఉండవచ్చు. ‘దావీదుకు చెందిన’ అనేది ‘దావీదు రచించిన’ అని అనవసరంగా ఖరారు చేయకుండా ఈ విస్తృతిని నిలుపుతుంది.
- source_word: מִכְתָּם
  choice: మిక్తాం
  rationale: ఈ ప్రక్రియాపదం యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం కాబట్టి ఊహాత్మక అనువాదం చేయకుండా తెలుగు లిప్యంతరీకరణను ఉంచాం.
- source_word: בְּבָרְחוֹ
  choice: అతడు ... పారిపోయి ... ఉన్నప్పుడు
  rationale: בְ తో కూడిన క్రియానామ రూపం ఇక్కడ కాలసంబంధ పరిస్థితిని తెలియజేస్తుంది; తెలుగులో సందర్భానుసారంగా ఈ నిర్మాణం సహజంగా ఉంటుంది.
- source_word: מִפְּנֵי
  choice: సౌలు నుండి
  rationale: అక్షరార్థంగా ‘సన్నిధి నుండి’ అనే హీబ్రూ నుడికారానికి ఈ సందర్భంలో ‘నుండి’ సహజమైన తెలుగు సమానం.
- source_word: שָׁאוּל
  choice: సౌలు
  rationale: వ్యక్తి పేరుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: בַּמְּעָרָה
  choice: గుహలో
  rationale: בְ ఇక్కడ స్థలాన్ని సూచిస్తుంది; మూలంలో లేని ప్రవేశ గమనాన్ని సూచించకుండా ‘గుహలో’ అని అనువదించాం.
theological_decisions:
- issue: ఉపోద్ఘాతం యొక్క సాహిత్య స్వభావం
  choice: వాక్యమంతటినీ కీర్తన ఉపోద్ఘాతంగా సమర్పించడం
  alternative: ‘నాశనం చేయవద్దు’ వంటి భాగాలను కవితా శరీరంలో భాగంగా పరిగణించడం
  rationale: హీబ్రూ పాఠమంతా సంగీత నిర్దేశం, గీతం/రాగం పేరు, దావీదు సంబంధం, ప్రక్రియాపదం, చారిత్రక సందర్భం అనే సంప్రదాయ ఉపోద్ఘాత అంశాలతో కూడి ఉంది.
- issue: מִכְתָּם అనే అనిశ్చిత ప్రక్రియాపదం
  choice: ‘మిక్తాం’ అని లిప్యంతరీకరించడం
  alternative: శాసనం; బంగారు కీర్తన; రహస్య కీర్తన
  rationale: అర్థం వివాదాస్పదం కాబట్టి ఏ ఊహాత్మక వివరణనూ ప్రధాన పాఠంలో ఖరారు చేయకుండా మూలపదాన్ని పారదర్శకంగా నిలిపాం.
- issue: לְדָוִד లోని సంబంధం
  choice: ‘దావీదుకు చెందిన’ అని విస్తృత సంబంధార్థంతో అనువదించడం
  alternative: ‘దావీదు రచించినది’ లేదా ‘దావీదు కొరకు’
  rationale: హీబ్రూ నిర్మాణం రచయితత్వం, సంబంధం లేదా అంకితాన్ని సూచించగలదు; ఒకే అర్థాన్ని సిద్ధాంతపరంగా ఖరారు చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఇది కీర్తన ఉపోద్ఘాతం అని వాక్య నిర్మాణం స్పష్టం చేస్తుంది. అనిశ్చిత హీబ్రూ పదాన్ని లిప్యంతరీకరించి, దావీదు సంబంధాన్ని అతిగా నిర్దిష్టం చేయకుండా ఉంచాం.
