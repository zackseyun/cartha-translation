  text: I will give thanks to you among the peoples[a], Lord; I will sing praise to you among the nations.
translation:
  language: te
  text: ప్రభువా, ప్రజల మధ్య నీకు కృతజ్ఞతలు చెల్లిస్తాను[a]; జాతుల మధ్య నిన్ను కీర్తిస్తూ పాడుతాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రజల మధ్య నిన్ను స్తుతిస్తాను.’ హీబ్రూ క్రియ కృతజ్ఞతలు చెల్లించడం లేదా స్తుతించడం అనే రెండు భావాలనూ ఇవ్వగలదు. తరువాతి పాదంలోని ‘కీర్తిస్తూ పాడుతాను’ అనే మాటతో భేదాన్ని నిలపడానికి ప్రధాన పాఠంలో ‘కృతజ్ఞతలు చెల్లిస్తాను’ అని ఇచ్చాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדְךָ
  choice: నీకు కృతజ్ఞతలు చెల్లిస్తాను
  rationale: ידה హిఫీల్ రూపం కృతజ్ఞతలు చెల్లించడం లేదా స్తుతించడం అనే భావాలను ఇవ్వగలదు. తరువాతి పాదంలోని ‘కీర్తిస్తూ పాడుతాను’తో భేదాన్ని నిలుపుటకు ‘కృతజ్ఞతలు చెల్లిస్తాను’ ఎంచుకున్నాం.
- source_word: בָעַמִּים
  choice: ప్రజల మధ్య
  rationale: עַמִּים అనేది ప్రజాసమూహాలను సూచించే బహువచనం. ‘ప్రజల మధ్య’ ఆ సమూహార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֲדֹנָי
  choice: ప్రభువా
  rationale: ఇది దేవునికి వాడిన బిరుదు; సంబోధన భావాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘ప్రభువా’ అని అనువదించాం.
- source_word: אֲזַמֶּרְךָ
  choice: నిన్ను కీర్తిస్తూ పాడుతాను
  rationale: זמר పీయేల్ రూపం కీర్తిగానం చేయడాన్ని సూచిస్తుంది. ‘కీర్తిస్తూ పాడుతాను’ గానం మరియు స్తుతి అనే రెండు భావాలనూ స్పష్టంగా అందిస్తుంది.
- source_word: בַּל
  choice: మధ్య
  rationale: ఇక్కడ ఇది మొదటి పాదంలోని ב కు సమాంతరమైన కావ్యాత్మక విభక్తిగా, ‘మధ్య’ అనే పరిధి భావాన్ని ఇస్తుంది.
- source_word: אֻמִּים
  choice: జనాలు
  rationale: ఈ పదం జనాలను లేదా జనసమూహాలను సూచిస్తుంది. మొదటి పాదంలోని עַמִּים కు సమాంతరతను నిలుపుతూ పదభేదాన్ని చూపడానికి ‘జనాలు’ ఎంచుకున్నాం.
theological_decisions:
- issue: אֲדֹנָי అనే దైవ బిరుదు అనువాదం
  choice: ప్రభువా
  alternative: ఓ ప్రభువా
  rationale: మూలంలో యెహోవా అనే నామం కాకుండా దైవ బిరుదు ఉంది. ‘ప్రభువా’ దానిని బిరుదుగానే ఉంచి, సంబోధనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘ఓ’ అవసరం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కవితాత్మక శైలి. రెండు పాదాల సమాంతరతను నిలుపుతూ ‘ప్రజలు/జనాలు’ మరియు ‘కృతజ్ఞతలు చెల్లించడం/కీర్తిస్తూ పాడడం’ అనే భేదాలను కాపాడాం.
