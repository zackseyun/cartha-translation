revisions:
- from: 'మహోన్నతుడైన దేవునికి నేను మొరపెడతాను;

    నా విషయాన్ని నెరవేర్చే దేవునికి మొరపెడతాను.[a]'
  to: 'మహోన్నతుడైన దేవునికి నేను మొరపెడతాను;

    నాకు సంబంధించినదాన్ని పూర్తిచేసే దేవునికి.[a]'
  rationale: The revision replaces the non-idiomatic ‘నా విషయాన్ని నెరవేర్చే’ with ‘నాకు సంబంధించినదాన్ని పూర్తిచేసే,’ which directly reflects the completion sense of גֹמֵר while leaving the implied object unspecified, as in Hebrew. It also removes the second supplied ‘మొరపెడతాను,’ which is unnecessary for Telugu and absent from the source. The footnote preserves the legitimate benefactive alternative without asserting an explicit ‘purpose’ in the Hebrew.
