source:
  edition: WLC
  text: אֶ֭קְרָא לֵֽ/אלֹהִ֣ים עֶלְי֑וֹן לָ֝/אֵ֗ל גֹּמֵ֥ר עָלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/002.yaml
  text: I call to God Most High[a], to God who fulfills his purpose for me.
translation:
  language: te
  text: 'మహోన్నతుడైన దేవునికి నేను మొరపెడతాను;

    నాకు సంబంధించినదాన్ని పూర్తిచేసే దేవునికి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా కోసం కార్యాన్ని పూర్తి చేసే దేవునికి.”
    reason: גֹמֵר עָלָי అనే హీబ్రూ పదబంధం ‘నాకు సంబంధించినదాన్ని పూర్తిచేసే’ లేదా ‘నా పక్షంగా కార్యాన్ని పూర్తి చేసే’ అనే భావాలను ఇవ్వగలదు.
lexical_decisions:
- source_word: אֶקְרָא
  choice: నేను మొరపెడతాను
  rationale: కרא అనే క్రియ యొక్క Qal అసంపూర్ణ రూపం వర్తమాన/భవిష్యత్ లేదా సంకల్ప భావాన్ని వ్యక్తం చేయగలదు. కీర్తనలోని ఆపద సందర్భానికి సహజంగా సరిపోయే ‘మొరపెడతాను’ భావతీవ్రతను తెలియజేస్తూనే, కేవలం ‘పిలుస్తాను’ కంటే తెలుగులో దేవునికి చేసే విజ్ఞప్తిని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לֵאלֹהִים עֶלְיוֹן
  choice: మహోన్నతుడైన దేవునికి
  rationale: עֶלְיוֹן దేవునికి ఉపయోగించిన ‘అత్యున్నతుడు/మహోన్నతుడు’ అనే బిరుదు. ఆధునిక గౌరవప్రదమైన తెలుగులో ‘మహోన్నతుడైన దేవుడు’ సహజంగా ఉంటుంది.
- source_word: לָאֵל
  choice: దేవునికి
  rationale: אֵל ఇక్కడ దేవునిని సూచిస్తుంది; ముందటి אֱלֹהִיםతో సమాంతరంగా ఉన్నందున ‘దేవునికి’ అని అనువదించడం కవితా సమాంతరతను కాపాడుతుంది.
- source_word: גֹמֵר
  choice: నెరవేర్చే
  rationale: גמר అంటే పూర్తి చేయడం, ముగింపుకు తీసుకురావడం. అసలు వాక్యంలో కర్మ స్పష్టంగా చెప్పబడలేదు కాబట్టి ‘ఉద్దేశాన్ని’ వంటి పదాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా ‘నెరవేర్చే’ అని ఉంచాం.
- source_word: עָלָי
  choice: నా విషయాన్ని
  rationale: עַל + మొదటి పురుష ఏకవచన ప్రత్యయం ఇక్కడ ‘నన్నుగూర్చినది/నాకు సంబంధించినది’ అనే భావాన్ని ఇవ్వగలదు. ‘నా విషయాన్ని’ ఈ అస్పష్టతను కొంతవరకు నిలుపుతూ సహజమైన తెలుగు ప్రయోగంగా ఉంటుంది.
theological_decisions:
- issue: גֹמֵר עָלַי యొక్క భావం
  choice: దేవుడు కీర్తనకర్తకు సంబంధించిన విషయాన్ని నెరవేరుస్తాడు
  alternative: దేవుడు నా పక్షంగా తన ఉద్దేశాన్ని నెరవేరుస్తాడు
  rationale: హీబ్రూ వాక్యంలో ‘ఉద్దేశం’ అనే స్పష్టమైన కర్మ లేదు. అందువల్ల దైవ ఉద్దేశాన్ని సూచించే భావం సాధ్యమైనప్పటికీ, ప్రధాన పాఠ్యంలో దానిని నిర్దిష్టంగా చేర్చకుండా మూలంలోని భావ విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కీర్తనా శైలిని ఉపయోగించాం. రెండు సమాంతర పాదాల్లో ‘దేవునికి’ మరియు ‘మొరపెడతాను’ పునరావృతం చేసి హీబ్రూ కవితా నిర్మాణాన్ని నిలిపాం; మూలంలో లేని ‘తన ఉద్దేశం’ను ప్రధాన పాఠ్యంలో చేర్చలేదు.
