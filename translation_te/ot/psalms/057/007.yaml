  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనాత్మకమైన మరియు గౌరవప్రదమైన కీర్తన శైలిని ఉపయోగించాం. మూలంలోని ‘హృదయం’ రూపకాన్ని, రెండుసార్లు వచ్చే ప్రకటనను, చివరి రెండు సంకల్ప క్రియల కవితాత్మక సమాంతరతను నిలిపాం.
