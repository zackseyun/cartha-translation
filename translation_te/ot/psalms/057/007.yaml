  text: My heart is steadfast[a], O God; my heart is steadfast. I will sing, yes[b], I will make melody.
translation:
  language: te
  text: దేవా, నా హృదయం స్థిరంగా ఉంది[a]; నా హృదయం స్థిరంగా ఉంది. నేను పాడుతాను, స్తుతిగానం చేస్తాను[b].
  philosophy: optimal-equivalence
