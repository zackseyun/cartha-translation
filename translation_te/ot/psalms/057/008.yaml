translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా కవితాత్మక గంభీరతను నిలిపాం. ‘నా మహిమా’ అనే అసాధారణమైన కానీ ఉద్దేశపూర్వక మూలరూపకాన్ని పాదటిప్పణి సహాయంతో పరిరక్షించాం; పునరుక్తమైన ‘మేలుకో’ను కూడా హీబ్రూ కవితా నిర్మాణానికి అనుగుణంగా ఉంచాం.
