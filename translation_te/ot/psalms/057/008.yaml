source:
  edition: WLC
  text: ע֤וּרָ/ה כְבוֹדִ֗/י ע֭וּרָֽ/ה הַ/נֵּ֥בֶל וְ/כִנּ֗וֹר אָעִ֥ירָה שָּֽׁחַר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/008.yaml
  text: Awake[a], my glory! Awake[b], harp and lyre! I will awaken the dawn.
translation:
  language: te
  text: 'మేలుకో, నా మహిమా![a]

    మేలుకో, వీణా, కిన్నెరా![b]

    నేను వేకువను మేల్కొలుపుతాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నా ఆత్మా’ లేదా ‘నా సర్వస్వమా’ అని కూడా అనువదించవచ్చు. ‘నా మహిమ’ అనేది కవి తనను తాను సూచించుకునే కవితాత్మక ప్రయోగం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠంలో రెండు ప్రాచీన తంతివాద్యాల పేర్లు ఉన్నాయి; వాటికి సరిపోయే ఖచ్చితమైన ఆధునిక వాద్యాలు ఏవో తెలియదు.
    reason: cultural_note
lexical_decisions:
- source_word: עוּרָה
  choice: మేలుకో
  rationale: עור అనే క్రియకు చెందిన ఈ ఆజ్ఞారూపం నేరుగా మేల్కొనమని పిలుస్తుంది. ‘మేలుకో’ కవితాత్మక గంభీరతను నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: כְבוֹדִי
  choice: నా మహిమా
  rationale: మూలార్థం ‘నా మహిమ’. ఇక్కడ అది కవితాత్మకంగా కవి అంతరంగాన్ని లేదా సంపూర్ణ వ్యక్తిత్వాన్ని సూచించవచ్చు. రూపకాన్ని వ్యాఖ్యానంతో భర్తీ చేయకుండా ప్రధాన పాఠంలో యథాతథంగా నిలిపి, ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఇచ్చాం.
- source_word: הַנֵּבֶל
  choice: వీణా
  rationale: ఇది ఒక ప్రాచీన తంతివాద్యం; దాని ఖచ్చితమైన ఆధునిక సమానం తెలియదు. తెలుగులో సులభంగా అర్థమయ్యే తంతివాద్య పదంగా ‘వీణ’ను ఎంచుకున్నాం.
- source_word: כִנּוֹר
  choice: కిన్నెరా
  rationale: ఇది మరో ప్రాచీన తంతివాద్యం. ‘కిన్నెర’ అనే పదం నెబెల్‌కు వాడిన ‘వీణ’ నుండి దీనిని వేరుగా ఉంచుతూ, తెలుగు కవితా సందర్భంలో సహజంగా వినిపిస్తుంది.
- source_word: אָעִירָה
  choice: నేను ... మేల్కొలుపుతాను
  rationale: హిఫిల్ రూపంలోని కారణార్థాన్ని ఇది స్పష్టంగా తెలియజేస్తుంది. కవి తన గానంతో వేకువనే మేల్కొలుపుతాననే సజీవ కవితా చిత్రాన్ని నిలుపుతుంది.
- source_word: שָּׁחַר
  choice: వేకువను
  rationale: ‘వేకువ’ ఉదయారంభాన్ని సూచిస్తూ, వ్యక్తీకరించిన ‘మేల్కొలుపుతాను’ అనే క్రియతో సహజమైన కవితా జతగా నిలుస్తుంది.
