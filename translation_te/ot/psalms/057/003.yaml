revisions:
- from: ఆయన పరలోకం నుండి పంపి నన్ను రక్షిస్తాడు; నన్ను మింగివేయాలని ఆరాటపడేవాణ్ణి ఆయన దూషిస్తాడు.[a] సెలా. దేవుడు తన నిబంధన ప్రేమను, తన నమ్మకత్వాన్ని పంపిస్తాడు.
  to: ఆయన ఆకాశం నుండి పంపి నన్ను రక్షిస్తాడు; నన్ను ఆశగా వెంబడించేవాణ్ణి ఆయన నిందిస్తాడు.[a] సెలా. దేవుడు తన స్థిరమైన ప్రేమను, తన విశ్వసనీయతను పంపిస్తాడు.
  rationale: సవరణ మూలంలోని క్రమాన్ని, దైవిక రక్షణపై నమ్మకపూర్వక భవిష్యదర్థాన్ని, మరియు חֵרֵף שֹׁאֲפִי యొక్క నిజమైన వాక్యనిర్మాణ సందిగ్ధతను కాపాడుతుంది. శత్రువు ‘మింగివేయాలని’ తహతహలాడుతాడనే వివరణను ప్రధాన పాఠం నుండి పాదసూచికకు మార్చి, మూల రూపకాన్ని ప్రధాన పాఠంలో నిలిపాం. חֶסֶדను ‘స్థిరమైన ప్రేమ’గా ఇవ్వడం ద్వారా నిబంధనాత్మక ఛాయను తప్పనిసరి చేయకుండా పదం యొక్క విస్తృత భావపరిధిని నిలిపాం.
