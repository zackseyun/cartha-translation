source:
  edition: WLC
  text: יִשְׁלַ֤ח מִ/שָּׁמַ֨יִם וְֽ/יוֹשִׁיעֵ֗/נִי חֵרֵ֣ף שֹׁאֲפִ֣/י סֶ֑לָה יִשְׁלַ֥ח אֱ֝לֹהִ֗ים חַסְדּ֥/וֹ וַ/אֲמִתּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/003.yaml
  text: He will send from heaven and save me[a]; he reproaches the one who pants after me. Selah[b]. God will send his steadfast love and his faithfulness.
translation:
  language: te
  text: ఆయన ఆకాశం నుండి పంపి నన్ను రక్షిస్తాడు; నన్ను ఆశగా వెంబడించేవాణ్ణి ఆయన నిందిస్తాడు.[a] సెలా. దేవుడు తన స్థిరమైన ప్రేమను, తన విశ్వసనీయతను పంపిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను ఆశగా వెంబడించేవాడు నన్ను నిందిస్తున్నాడు”; లేదా, “నన్ను ఆశగా వెంబడించేవాని నింద నుండి ఆయన నన్ను రక్షిస్తాడు.” “నన్ను ఆశగా వెంబడించేవాడు” అనే మాటను సందర్భాన్ని బట్టి “నన్ను మింగివేయాలని ఆరాటపడేవాడు” అని కూడా అర్థం చేసుకోవచ్చు. హీబ్రూ వాక్యభాగం సంక్షిప్తంగా ఉండడం వల్ల ఈ పఠనాలు సాధ్యమవుతాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁלַח
  choice: పంపిస్తాడు
  rationale: Qal imperfectను కీర్తనకర్త వ్యక్తం చేస్తున్న నమ్మకపూర్వక భవిష్యదర్థ ప్రకటనగా అనువదించాం.
- source_word: מִשָּׁמַיִם
  choice: పరలోకం నుండి
  rationale: దేవుని సహాయం వచ్చే స్థలాన్ని సహజమైన ఆధునిక తెలుగు ప్రయోగంతో తెలియజేస్తుంది.
- source_word: וְיוֹשִׁיעֵנִי
  choice: నన్ను రక్షిస్తాడు
  rationale: ישׁע హిఫిల్ రూపంలోని విస్తృత రక్షణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חֵרֵף
  choice: ఆయన దూషిస్తాడు
  rationale: హీబ్రూ క్రియలోని ‘దూషించు/నిందించు’ అనే ప్రత్యక్ష భావాన్ని నిలిపి, దేవుణ్ణే కర్తగా తీసుకున్నాం; వాక్యనిర్మాణంలోని భిన్న అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: שֹׁאֲפִי
  choice: నన్ను మింగివేయాలని ఆరాటపడేవాణ్ణి
  rationale: శత్రువు అత్యాశతో వెంటపడుతున్న సజీవ రూపకాన్ని తెలుగులో అర్థమయ్యేలా, అయితే వ్యాఖ్యానాత్మక అతిశయంలేకుండా వ్యక్తం చేస్తుంది.
- source_word: סֶלָה
  choice: సెలా
  rationale: పదం యొక్క ఖచ్చితమైన అర్థం అనిశ్చితమైనందున సంప్రదాయ లిప్యంతరీకరణను నిలిపాం.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఇక్కడ ఏకవచన దైవసూచక నామానికి ప్రామాణిక తెలుగు అనువాదం.
- source_word: חַסְדּוֹ
  choice: తన నిబంధన ప్రేమను
  rationale: חסדలోని ప్రేమ, కరుణ, స్థిరమైన నిబద్ధత అనే అంశాలను సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וַאֲמִתּוֹ
  choice: తన నమ్మకత్వాన్ని
  rationale: חסדతో జతగా ఉన్న אמת ఇక్కడ సత్యతకన్నా విశ్వసనీయత లేదా నమ్మకత్వాన్ని ప్రధానంగా సూచిస్తుంది.
theological_decisions:
- issue: חֵרֵף שֹׁאֲפִי అనే సంక్షిప్త వాక్యభాగం యొక్క కర్త, సంబంధం
  choice: దేవుణ్ణి కర్తగా తీసుకుని, ‘నన్ను మింగివేయాలని ఆరాటపడేవాణ్ణి ఆయన దూషిస్తాడు’ అని అనువదించడం
  alternative: వెంటాడే శత్రువే కర్తగా తీసుకుని, ‘నన్ను వెంటాడేవాడు దూషిస్తున్నాడు’ అని అనువదించడం; లేదా ‘నన్ను వెంటాడేవాని దూషణ నుండి రక్షిస్తాడు’ అనే సంబంధార్థం
  rationale: హీబ్రూ వాక్యభాగం సంక్షిప్తమై వ్యాకరణపరంగా ఒకటికంటే ఎక్కువ విధాలుగా అన్వయించవచ్చు. ప్రధాన పాఠం ముందు, తరువాత ఉన్న దైవకార్యాల వరుసకు అనుగుణంగా దేవుణ్ణి కర్తగా తీసుకుంటుంది; నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవభరితమైన కీర్తనా శైలి. ‘సెలా’ను అనువదించకుండా ఉంచాం. ‘నిబంధన ప్రేమ’ ద్వారా חסדలోని స్థిరమైన సంబంధనిబద్ధతను స్పష్టంచేశాం; వివాదాస్పద వాక్యనిర్మాణాన్ని పాదసూచికలో భద్రపరిచాం.
