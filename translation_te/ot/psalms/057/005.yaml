  to: 'దేవా, ఆకాశాలపైగా నీవు మహోన్నతుడవుగా;

    నీ మహిమ సమస్త భూమిపై ఉండుగాక.[a]'
  rationale: The revision restores the spatial force of ‘above the heavens,’ renders the exaltation appeal in idiomatic modern Telugu liturgical language, and retains the source's genuine syntactic ambiguity in the second colon through the footnote.
