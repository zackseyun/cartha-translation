source:
  edition: WLC
  text: ר֣וּמָ/ה עַל הַ/שָּׁמַ֣יִם אֱלֹהִ֑ים עַ֖ל כָּל הָ/אָ֣רֶץ כְּבוֹדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/005.yaml
  text: Be exalted above the heavens[a], O God; let your glory be over all the earth.
translation:
  language: te
  text: 'దేవా, ఆకాశాలపైగా నీవు మహోన్నతుడవుగా;

    నీ మహిమ సమస్త భూమిపై ఉండుగాక.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ మహిమ సమస్త భూమిపై ఉంది.” హెబ్రీలో రెండవ పాదానికి క్రియ లేదు; కాబట్టి దాన్ని ప్రార్థన లేదా ఆకాంక్షగానైనా, ఒక ప్రకటనగానైనా చదవవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ר֣וּמָה
  choice: ఉన్నతంగా మహిమపరచబడుము
  rationale: רום రూపం ఇక్కడ ప్రార్థనాత్మక ఆజ్ఞ/ఆకాంక్షను వ్యక్తం చేస్తుంది. కేవలం భౌతికంగా పైకి లేవడాన్ని కాక, దేవుని ఔన్నత్యం వెల్లడై ఘనపరచబడాలనే భావాన్ని ఈ పదబంధం సహజమైన తెలుగు ఆరాధనా భాషలో తెలియజేస్తుంది.
- source_word: עַל הַשָּׁמַיִם
  choice: ఆకాశాలకంటే ఉన్నతంగా
  rationale: עַל ఇక్కడ ఉన్నత స్థితిని సూచిస్తుంది; הַשָּׁמַיִם యొక్క బహువచన కవితా రూపాన్ని ‘ఆకాశాలు’గా నిలుపుతూ, దేవుని పరమోన్నతత్వాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ఇది ప్రత్యక్ష సంబోధన. ఆధునిక ప్రామాణిక తెలుగులో ‘దేవా’ సహజమైన, గౌరవప్రదమైన సంబోధన.
- source_word: עַל כָּל הָאָרֶץ
  choice: భూమంతటిపై
  rationale: ఈ సందర్భంలో עַל విశ్వవ్యాప్త పరిధిని లేదా భూమిపై వ్యాపించిన ఆధిపత్యాన్ని సూచించగలదు. ‘భూమంతటిపై’ కవితా సమాంతరతను, సార్వత్రిక పరిధిని రెండింటినీ నిలుపుతుంది.
- source_word: כְּבוֹדֶךָ
  choice: నీ మహిమ
  rationale: దేవునికి సంబంధించిన כבוד ఆయన ఘనత, వైభవం, ప్రత్యక్ష మహిమను సూచిస్తుంది. ‘మహిమ’ తెలుగులో స్థిరపడినప్పటికీ సాధారణ పాఠకులకు కూడా స్పష్టమైన పదం.
theological_decisions:
- issue: రెండవ పాదంలోని క్రియలేని హెబ్రీ వాక్యాన్ని ఆకాంక్షగా చదవాలా, ప్రకటనగా చదవాలా
  choice: నీ మహిమ భూమంతటిపై ఉండుగాక
  alternative: నీ మహిమ భూమంతటిపై ఉంది
  rationale: మొదటి పాదంలోని ప్రార్థనాత్మక రూపంతో సమాంతరంగా రెండవ పాదాన్ని ఆకాంక్షగా చదవడం సహజం. అయితే మూలంలో క్రియ లేకపోవడం వల్ల ప్రకటనాత్మక పఠనం కూడా సాధ్యమే; ఆ నిజమైన సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనా సందర్భానికి తగిన గౌరవప్రదమైన కవితా శైలి. ‘ఉండుగాక’ ప్రార్థనాత్మక ఆకాంక్షను సహజంగా తెలియజేస్తుంది; మూలంలోని సందిగ్ధతను పాదటిప్పణి సంరక్షిస్తుంది.
