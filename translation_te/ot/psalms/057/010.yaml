source:
  edition: WLC
  text: כִּֽי גָדֹ֣ל עַד שָׁמַ֣יִם חַסְדֶּ֑/ךָ וְֽ/עַד שְׁחָקִ֥ים אֲמִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/010.yaml
  text: For your steadfast love is great to the heavens[b][a], and your faithfulness to the clouds.
translation:
  language: te
  text: ఎందుకంటే నీ అచంచల ప్రేమ ఆకాశాల వరకు గొప్పది; నీ విశ్వసనీయత మేఘాల వరకు గొప్పది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ అచంచల ప్రేమ ఆకాశాల వరకు, నీ సత్యం మేఘాల వరకు.’ రెండో పాదంలో ‘గొప్పది’ అనే భావం మొదటి పాదం నుండి అర్థమవుతుంది.
    reason: lexical_and_ellipsis_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి స్తుతికి కారణాన్ని పరిచయం చేసే హేత్వర్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: גָדֹל
  choice: గొప్పది
  rationale: దేవుని ప్రేమ పరిమాణాన్ని తెలిపే విశేషణానికి నేరమైన, సాధారణ ఆధునిక తెలుగు సమానార్థకం.
- source_word: עַד
  choice: వరకు
  rationale: ఆకాశం, మేఘాల దాకా చేరే విస్తృతిని సూచించే మూలపాఠ భావాన్ని నిలుపుతుంది.
- source_word: שָׁמַיִם
  choice: ఆకాశాలు
  rationale: హీబ్రూ కవిత్వంలోని ఉన్నతమైన బహువచన చిత్రణను సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: חַסְדֶּךָ
  choice: నీ అచంచల ప్రేమ
  rationale: חֶסֶד‌లోని ప్రేమ, విశ్వసనీయ నిబద్ధత, నిలకడ అనే భావాలను మతశాఖాపరమైన సాంకేతిక పదజాలం లేకుండా అందిస్తుంది.
- source_word: שְׁחָקִים
  choice: మేఘాలు
  rationale: సమాంతర కవితా పాదంలోని స్పష్టమైన ఆకాశ చిత్రాన్ని అందిస్తుంది.
- source_word: אֲמִתֶּךָ
  choice: నీ నమ్మకత్వం
  rationale: חֶסֶד‌కు సమాంతరంగా ఇక్కడ దేవుని విశ్వసనీయత ప్రధాన భావం; ‘సత్యం’ అనే ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో నిలిపాం.
theological_decisions:
- issue: దేవుని ఒడంబడిక సంబంధ లక్షణాల కవితా జంట
  choice: חֶסֶד‌ను ‘అచంచల ప్రేమ’గా, אֱמֶת‌ను ‘నమ్మకత్వం’గా అనువదించడం
  alternative: ‘కృప/ప్రేమ’ మరియు ‘సత్యం’
  rationale: ఈ సందర్భంలో దేవుని ప్రేమపూర్వక నిబద్ధత, ఆధారపడదగిన స్వభావం ప్రశంసించబడుతున్నాయి. ఎంపిక చేసిన జంట సంబంధాత్మక భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూనే ‘సత్యం’ అనే నిజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని వాడాం. హీబ్రూలో రెండో పాదంలో క్రియ లేకపోవడం తెలుగు పాఠకునికి అసహజంగా ఉండేందున, సమాంతర భావాన్ని ‘చేరింది’తో సహజీకరించాం; ‘గొప్పది’ అనే మూల విశేషణాన్ని మొదటి పాదంలో స్పష్టంగా నిలిపాం.
