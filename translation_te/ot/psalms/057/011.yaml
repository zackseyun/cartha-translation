source:
  edition: WLC
  text: ר֣וּמָ/ה עַל שָׁמַ֣יִם אֱלֹהִ֑ים עַ֖ל כָּל הָ/אָ֣רֶץ כְּבוֹדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/011.yaml
  text: Be exalted above the heavens[a], O God; let your glory be above all the earth.
translation:
  language: te
  text: దేవా, ఆకాశాలకు పైగా నీవు మహోన్నతుడవై ఉండుగాక; భూమి అంతటిమీద నీ మహిమ ఉండుగాక.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ మహిమ భూమి అంతటిమీద ఉంది.” హీబ్రూ రెండో పాదంలో స్పష్టమైన క్రియ లేదు; సందర్భాన్ని బట్టి దానిని ప్రార్థనగా గానీ ప్రకటనగా గానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ר֣וּמָה
  choice: మహోన్నతుడవై ఉండుగాక
  rationale: దేవునికి ఉద్దేశించిన ఆజ్ఞార్థక/ఆశీర్వచనార్థక రూపాన్ని ప్రార్థనాత్మకంగా వ్యక్తపరుస్తుంది. కేవలం స్థలపరంగా ‘పైకి లేవు’ అని కాక, దేవుని ఔన్నత్యం వెల్లడికావాలనే భావాన్ని అందిస్తుంది.
- source_word: עַל
  choice: పైగా
  rationale: ఆకాశాలు, భూమి అనే రెండు సమాంతర పదబంధాల్లో ఎత్తు మరియు సర్వోన్నతత్వం రెండింటినీ సహజంగా నిలుపుతుంది.
- source_word: שָׁמַיִם
  choice: ఆకాశాలు
  rationale: హీబ్రూ బహువచన రూపాన్ని, కవితాత్మక విశాలతను కాపాడుతుంది.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ఇది ప్రత్యక్ష సంబోధన; తెలుగు ప్రార్థనా భాషలో ‘దేవా’ సహజమైన సంబోధన రూపం.
- source_word: כָּל הָאָרֶץ
  choice: భూమి అంతటి
  rationale: ‘ఆకాశాలు’తో ఉన్న విశ్వవ్యాప్త సమాంతరతలో ‘దేశమంతా’ కంటే ‘భూమి అంతటి’ సరైన భావాన్ని ఇస్తుంది.
- source_word: כְּבוֹדֶךָ
  choice: నీ మహిమ
  rationale: దేవుని ప్రత్యక్షమయ్యే ఘనత, వైభవం అనే כבוד భావాన్ని స్పష్టంగా, స్థిరంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: హీబ్రూ రెండో పాదంలో స్పష్టమైన క్రియ లేకపోవడం
  choice: నీ మహిమ ఉండుగాక
  alternative: నీ మహిమ ఉంది
  rationale: మొదటి పాదంలోని ప్రార్థనాత్మక భావాన్ని రెండో పాదానికీ కొనసాగిస్తూ కవితా సమాంతరతను నిలుపుతుంది. అయితే క్రియ లేనందున దీన్ని ప్రకటనగా గ్రహించే అవకాశాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన ప్రార్థనా-కవితా శైలిని ఉపయోగించాం. ‘ఉండుగాక’ అనే రూపం రెండు పాదాల ప్రార్థనాత్మక సమాంతరతను కాపాడుతుంది.
