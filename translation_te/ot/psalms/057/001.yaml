  yaml_path: translation/ot/psalms/057/001.yaml
  text: Be gracious to me[a], God, be gracious to me, for in you my soul takes refuge[b]; and in the shadow of your wings I will take refuge until destruction passes by.
translation:
  language: te
  text: 'దేవా, నాపై కృప చూపు, నాపై కృప చూపు;

    ఎందుకంటే నా ప్రాణం[a] నీలో ఆశ్రయం పొందింది.

    విపత్తులు[b] దాటిపోయే వరకు

    నీ రెక్కల నీడలో నేను ఆశ్రయం పొందుతాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నా జీవితం’ లేదా ‘నేనే’ అని కూడా అర్థం కావచ్చు. హీబ్రూ נַפְשִׁי అనే పదం ‘ప్రాణం,’ ‘జీవితం,’ లేదా ‘స్వయం’ను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ఇది బహువచనం; వినాశకరమైన ఆపదలు లేదా ప్రమాదాలను సమష్టిగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: నాపై దయచూపు
  rationale: חנן ధాతువు ఇక్కడ అనుగ్రహం లేదా దయ చూపాలని చేసే విజ్ఞప్తి. ఆధునిక తెలుగులో ‘నాపై దయచూపు’ సహజంగా ఉండి, మూలంలోని ఆజ్ఞార్థక విజ్ఞప్తిని నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: దేవుణ్ణి నేరుగా సంబోధిస్తున్నందున తెలుగు సంబోధన రూపం వాడబడింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న విజ్ఞప్తికి కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בְךָ
  choice: నీలో
  rationale: חסהతో వచ్చిన ב ఆశ్రయం ఎవరియందు ఉంచబడిందో సూచిస్తుంది; ‘నీలో’ దానికి సహజమైన సమానార్థకం.
- source_word: חָסָיָה נַפְשִׁי
  choice: నా ప్రాణం నీలో ఆశ్రయం పొందింది
  rationale: נפשׁ యొక్క ‘ప్రాణం/జీవితం/స్వయం’ అనే విస్తృత అర్థపరిధిని ‘నా ప్రాణం’ కొంతవరకు నిలుపుతుంది. సంపూర్ణ క్రియారూపం ఇప్పటికే స్థిరపడిన నమ్మకాన్ని సూచించేలా ‘ఆశ్రయం పొందింది’గా అనువదించబడింది.
- source_word: וּבְצֵל כְּנָפֶיךָ
  choice: నీ రెక్కల నీడలో
  rationale: దైవిక రక్షణను సూచించే పక్షి-రూపకాన్ని వివరణాత్మకంగా మార్చకుండా యథాతథంగా నిలుపుతుంది.
- source_word: אֶחְסֶה
  choice: నేను ఆశ్రయం పొందుతాను
  rationale: మొదటి పురుష ఏకవచన అసంపూర్ణ క్రియ భవిష్యత్తులోనూ కొనసాగబోయే ఆశ్రయాన్ని వ్యక్తం చేస్తుంది.
- source_word: עַד יַעֲבֹר
  choice: దాటిపోయే వరకు
  rationale: ప్రమాదాలు తొలగిపోయే దాకా ఆశ్రయంలో ఉండే కాలవ్యవధిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַוּוֹת
  choice: విపత్తులు
  rationale: మూలంలోని బహువచనాన్ని నిలుపుతూ, వినాశకరమైన ఆపదలు లేదా ప్రమాదాలు అనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: נַפְשִׁי పదంలోని మానవ స్వరూప సంబంధిత అర్థం
  choice: నా ప్రాణం
  alternative: నా జీవితం / నేనే
  rationale: ఈ హీబ్రూ పదం తాత్విక అర్థంలో శరీరానికి వేరైన ఆత్మను మాత్రమే సూచించదు; జీవితం లేదా సంపూర్ణ వ్యక్తిని కూడా సూచించగలదు. కవితాత్మక రూపాన్ని నిలుపుతూ అతిగా సిద్ధాంతీకరించకుండా ‘నా ప్రాణం’ వాడి, విస్తృత అర్థాన్ని పాదసూచికలో తెలిపాం.
- issue: ‘నీ రెక్కల నీడ’ అనే రక్షణాత్మక రూపకం
  choice: రూపకాన్ని యథాతథంగా ఉంచడం
  alternative: ‘నీ రక్షణలో’ అని వివరణాత్మకంగా అనువదించడం
  rationale: దైవిక రక్షణను తెలిపే మూల కవితా చిత్రాన్ని చదును చేయకుండా, శరీరరూప ఆరోపణను సిద్ధాంతపరంగా వివరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా-కవితా శైలి వాడబడింది. మూలంలోని పునరుక్తి, కారణ సంబంధం, రెక్కల నీడ అనే రూపకం, అలాగే ఆశ్రయం పొందడంలోని కాలభేదం నిలుపబడ్డాయి.
