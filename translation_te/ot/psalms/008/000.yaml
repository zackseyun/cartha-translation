source:
  edition: WLC
  text: לַ/מְנַצֵּ֥חַ עַֽל הַ/גִּתִּ֗ית מִזְמ֥וֹר לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/000.yaml
  text: For the choir director[a]; according to the Gittith[c][b]. A psalm of David.
translation:
  language: te
  text: సంగీత నిర్దేశకునికి; గిత్తీతు ప్రకారం.[a] దావీదు కీర్తన.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గిత్తీతు’ అనేది బహుశా ఒక సంగీత లేదా ఆరాధనా సాంకేతిక పదం; అది ఒక రాగం లేదా వాయిద్యం పేరు కావచ్చు. దాని ఖచ్చితమైన అర్థం తెలియదు.
    reason: cultural_note
  - marker: b
    text: లేదా ‘దావీదు రచించిన కీర్తన,’ ‘దావీదు కోసం కీర్తన,’ లేదా ‘దావీదుకు చెందిన కీర్తన.’ హీబ్రూ పదబంధం రచయితత్వాన్ని లేదా అనుబంధాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నిర్దేశకునికి
  rationale: కీర్తనల శీర్షికల్లో ఈ రూపం సంగీత ప్రదర్శనను పర్యవేక్షించే వ్యక్తిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘సంగీత నిర్దేశకుడు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: עַל
  choice: ప్రకారం
  rationale: ఇక్కడ తరువాత వచ్చే సాంకేతిక సంగీత పదంతో కీర్తనను ఎలా ఆలపించాలో సూచించే భావం ఉండవచ్చు. ‘ప్రకారం’ నిర్దిష్ట రాగం లేదా వాయిద్యం అని తేల్చకుండా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: הַגִּתִּית
  choice: గిత్తీతు
  rationale: ఈ పదం సూచించే ఖచ్చితమైన విషయం తెలియదు; ఇది బహుశా ఒక సంగీత లేదా ఆరాధనా సాంకేతిక పదం, రాగం పేరు, లేదా వాయిద్యం పేరు కావచ్చు. అందువల్ల అర్థాన్ని ఊహించి అనువదించకుండా ధ్వన్యనువాదం చేయబడింది.
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: ఈ శీర్షికలోని గీత ప్రక్రియను తెలుగులో సహజంగా, సంప్రదాయబద్ధంగా సూచించే పదం ‘కీర్తన’.
- source_word: לְדָוִד
  choice: దావీదు కీర్తన
  rationale: హీబ్రూ לְ ఉపసర్గ రచన, సంబంధం, అంకితం, లేదా సంకలన సంబంధాన్ని సూచించవచ్చు. సంక్షిప్తమైన ‘దావీదు కీర్తన’ అనే రూపం ప్రధాన పాఠ్యంలో సహజంగా ఉండగా, దాని విస్తృత సాధ్యతలను పాదసూచిక తెలియజేస్తుంది.
theological_decisions:
- issue: לְדָוִד సూచించే రచయితత్వం లేదా అనుబంధం
  choice: దావీదు కీర్తన
  alternative: దావీదు రచించిన కీర్తన; దావీదు కోసం కీర్తన; దావీదుకు చెందిన కీర్తన
  rationale: మూల హీబ్రూ దావీదుతో ఉన్న సంబంధాన్ని ఒకే విధంగా నిర్బంధించదు. అందువల్ల ప్రధాన పాఠ్యంలో స్థిరపడిన సంక్షిప్త రూపాన్ని ఉంచి, ప్రత్యామ్నాయ సంబంధాలను పాదసూచికలో స్పష్టం చేయడం ద్వారా సందిగ్ధతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన కీర్తన శీర్షికగా రూపొందించబడింది. తెలియని సంగీత పదాన్ని అనవసరంగా వివరించకుండా ధ్వన్యనువాదంగా ఉంచాం; దావీదుతో సంబంధం విషయంలో మూలంలోని సందిగ్ధతను పాదసూచికలో నిలిపాం.
