id: PSA.8.3
reference: Psalms 8:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי אֶרְאֶ֣ה שָׁ֭מֶי/ךָ מַעֲשֵׂ֣י אֶצְבְּעֹתֶ֑י/ךָ יָרֵ֥חַ וְ֝/כוֹכָבִ֗ים אֲשֶׁ֣ר כּוֹנָֽנְתָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/003.yaml
  text: When I look at your heavens[a], the work of your fingers, the moon and the stars, which you have set in place—
translation:
  language: te
  text: నీ ఆకాశాలను, నీ వేళ్ల పనిని, నీవు స్థిరపరచిన చంద్రుణ్ణీ నక్షత్రాలనూ నేను చూసినప్పుడు—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: చూసినప్పుడు
  rationale: తదుపరి వచనంలోని ప్రశ్నకు దారితీసే సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; కారణార్థకమైన ‘ఎందుకంటే’ కూడా సాధ్యమే కాబట్టి దానిని పాదటిప్పణిలో ఉంచాం.
- source_word: אֶרְאֶה
  choice: నేను చూసినప్పుడు
  rationale: ראה అనే క్రియలోని పరిశీలించి చూడడం అనే అనుభవార్థాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: שָׁמֶיךָ
  choice: నీ ఆకాశాలను
  rationale: హీబ్రూ బహువచన రూపాన్నీ, విశ్వవ్యాప్తమైన ఉన్నత కవితా భావాన్నీ నిలుపుతుంది.
- source_word: מַעֲשֵׂי אֶצְבְּעֹתֶיךָ
  choice: నీ వేళ్ల పనిని
  rationale: దేవుని సృజనాత్మక కార్యాన్ని చిత్రించే మానవరూపకాన్ని సరళీకరించకుండా నిలుపుతుంది; ‘పని’ సమష్టి భావంలో వాడబడింది.
- source_word: יָרֵחַ וְכוֹכָבִים
  choice: చంద్రుణ్ణి, నక్షత్రాలను
  rationale: తెలుగులో సహజమైన నిర్దిష్ట ఖగోళ సూచనను ఇస్తూ మూలంలోని జాబితా నిర్మాణాన్ని కాపాడుతుంది.
- source_word: אֲשֶׁר
  choice: నీవు స్థిరపరచిన
  rationale: తెలుగు సంబంధ విశేషణ నిర్మాణంతో చంద్రుడు, నక్షత్రాలకు సహజంగా అనుసంధానిస్తుంది.
- source_word: כּוֹנָנְתָּה
  choice: నీవు స్థిరపరచిన
  rationale: כון పోయెల్ రూపంలోని స్థాపించడం, దృఢంగా అమర్చడం అనే భావాలను సంక్షిప్తంగా తెలియజేస్తుంది; ‘ఏర్పరచిన’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
theological_decisions:
- issue: దైవ సృజనకార్యానికి మానవరూపక భాష
  choice: ‘నీ వేళ్ల పని’ అనే చిత్రాన్ని యథాతథంగా నిలుపడం
  alternative: ‘నీ చేతిపని’ లేదా ‘నీవు చేసినది’
  rationale: మూలంలోని ‘వేళ్లు’ అనే చిత్రం దేవుని సన్నిహితమైన, సులభమైన సృజనశక్తిని కవితాత్మకంగా వ్యక్తం చేస్తుంది. దైవానికి భౌతిక శరీరం ఉందనే సిద్ధాంతాన్ని చేర్చకుండానే ఆ చిత్రాన్ని నిలుపవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి. తదుపరి వచనంలో కొనసాగే ప్రశ్నను సూచించేందుకు చివర దీర్ఘ విరామచిహ్నం ఉంచబడింది; మూలంలోని పంక్తి ప్రవాహం కోసం పదక్రమం తెలుగుకు అనుగుణంగా మార్చబడింది.
