  to: 'పసిపిల్లలూ పాలు తాగే శిశువుల నోటినుండి


    నీ విరోధుల కారణంగా నీవు బలాన్ని స్థాపించావు[a],


    శత్రువునూ ప్రతీకారం తీర్చుకునేవానినీ నిలిపివేయడానికి.'
  rationale: 'The revised text follows the WLC Hebrew: God has established “strength” from the mouths of infants and nursing children, in connection with his adversaries, in order to cause the enemy and the vengeful person to cease. It improves Telugu flow while replacing a semantically narrower verb with one that directly reflects the Hebrew causative. The alternative Septuagint/Matthew-related “praise” remains explicitly confined to the footnote.'
