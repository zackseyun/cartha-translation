id: PSA.8.2
reference: Psalms 8:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִ/פִּ֤י עֽוֹלְלִ֨ים וְֽ/יֹנְקִים֮ יִסַּ֪דְתָּ֫ עֹ֥ז לְמַ֥עַן צוֹרְרֶ֑י/ךָ לְ/הַשְׁבִּ֥ית א֝וֹיֵ֗ב וּ/מִתְנַקֵּֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/002.yaml
  text: From the mouths of infants and nursing babies you have established strength because of your foes[a], to silence the enemy and the avenger.
translation:
  language: te
  text: 'పసిపిల్లలూ పాలు తాగే శిశువుల నోటినుండి


    నీ విరోధుల కారణంగా నీవు బలాన్ని స్థాపించావు[a],


    శత్రువునూ ప్రతీకారం తీర్చుకునేవానినీ నిలిపివేయడానికి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్తుతిని.” మత్తయి 21:16లో ప్రతిఫలించిన సెప్టువజింటు సంప్రదాయం ఈ పఠనాన్ని అనుసరిస్తుంది; హీబ్రూ పాఠ్యంలో “బలం” అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: מִפִּי
  choice: నోటినుండి
  rationale: מִן + פֶּה అనే ప్రయోగం ‘నోటి నుండి’ అని అర్థం. రెండు వర్గాలు ఉన్నప్పటికీ తెలుగులో సమాసబద్ధ ఏకవచనం సహజంగా సమూహార్థాన్ని ఇస్తుంది.
- source_word: עוֹלְלִים
  choice: పసిపిల్లలు
  rationale: చాలా చిన్న పిల్లలను సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: יֹנְקִים
  choice: పాలుతాగే శిశువులు
  rationale: పాలు తాగుతున్నవారనే క్రియాత్మక చిత్రాన్ని నిలుపుతుంది; ముందు పదంతో ఉన్న భావసూక్ష్మ భేదాన్ని కాపాడుతుంది.
- source_word: יִסַּדְתָּ
  choice: నీవు స్థాపించావు
  rationale: יסד యొక్క ప్రాథమిక భావం పునాది వేయడం లేదా స్థాపించడం; ‘బలం’ అనే కర్మతో రూపకార్థంలోనూ సరిపోతుంది.
- source_word: עֹז
  choice: బలం
  rationale: హీబ్రూ పదానికి సాధారణార్థం ‘బలం/శక్తి’; గ్రీకు సంప్రదాయంలోని ‘స్తుతి’ని ప్రధాన పాఠ్యంలోకి తేవకుండా పాదటిప్పణిలో ఉంచాం.
- source_word: לְמַעַן
  choice: నుబట్టి
  rationale: ఈ సందర్భంలో విరోధులు కారణం లేదా సందర్భం అవుతున్న భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; ఉద్దేశ్య ఛాయను పూర్తిగా అతిగా నిర్ణయించదు.
- source_word: צוֹרְרֶיךָ
  choice: నీ విరోధులు
  rationale: దేవునికి వ్యతిరేకంగా నిలిచే శత్రుభావుల్ని సూచిస్తుంది; తరువాతి ‘శత్రువు’తో పదపునరుక్తిని తగ్గిస్తుంది.
- source_word: לְהַשְׁבִּית
  choice: అణచివేయడానికి
  rationale: హిఫిల్ రూపంలోని ‘నిలిపివేయడం/చేయకుండా చేయడం’ భావాన్ని సందర్భానుకూలంగా అందిస్తుంది. కేవలం మాటలను మౌనపరచడమేనని పరిమితం చేయదు.
- source_word: אוֹיֵב
  choice: శత్రువు
  rationale: ఏకవచనంలో ఒక వర్గానికి ప్రతినిధిగా ఉన్న శత్రువును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִתְנַקֵּם
  choice: ప్రతీకారం తీర్చుకునేవాడు
  rationale: ప్రతీకార చర్యలో నిమగ్నమైన వ్యక్తిని సూచించే భాగధాతు భావాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: హీబ్రూ עֹז మరియు సెప్టువజింటు/మత్తయి 21:16లో ప్రతిఫలించిన ‘స్తుతి’ మధ్య భేదం
  choice: ప్రధాన పాఠ్యంలో ‘బలం’
  alternative: స్తుతి
  rationale: WLC హీబ్రూ పాఠ్యం స్పష్టంగా עֹז (‘బలం/శక్తి’) అని ఉంది. మూలభాష ప్రాధాన్యాన్ని అనుసరించి దానినే ప్రధాన పాఠ్యంలో ఉంచి, అంతర్పాఠ్య ప్రాముఖ్యతగల గ్రీకు సంప్రదాయాన్ని పాదటిప్పణిలో తెలిపాం.
- issue: לְהַשְׁבִּית యొక్క సందర్భార్థం
  choice: అణచివేయడానికి
  alternative: మౌనపరచడానికి; నిలిపివేయడానికి
  rationale: హీబ్రూ క్రియకు విస్తృతంగా ‘ఆపడం, లేకుండా చేయడం’ అనే భావం ఉంది. శత్రువుల ప్రతిఘటనను అంతమొందించే భావాన్ని ‘అణచివేయడానికి’ సహజంగా అందిస్తుంది; అది కేవలం వాచిక మౌనానికి పరిమితం కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గంభీరతతోనూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలంతోనూ అనువదించబడింది. పద్య పంక్తులు హీబ్రూ భావ విభాగాలను అనుసరిస్తాయి. ‘అణచివేయడానికి’ అనేది ‘మౌనపరచడానికి’ కంటే మూలక్రియ యొక్క విస్తృత causative భావాన్ని మెరుగుగా నిలుపుతుంది.
