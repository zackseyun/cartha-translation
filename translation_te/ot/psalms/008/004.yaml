- from: మానవుడు ఎంతటివాడు, నీవు అతన్ని జ్ఞాపకం చేసుకోవడానికి?[a] మనుష్య కుమారుడు ఎంతటివాడు, నీవు అతని గురించి శ్రద్ధ తీసుకోవడానికి?[b][c]
  to: మానవుడు ఎంతటివాడు, నీవు అతనిని జ్ఞాపకం చేసుకోవడానికి?[a] మానవ సంతానానికి చెందినవాడు ఎంతటివాడు, నీవు అతనిపట్ల శ్రద్ధ వహించడానికి?[b][c]
  rationale: సవరణ మూలంలోని రెండు సమాంతర ప్రశ్నలను, ప్రతినిధి ఏకవచనాన్ని, మరియు దేవుని మానవునిపట్ల క్రియాశీల శ్రద్ధ భావాన్ని నిలుపుతుంది. అసహజమైన ‘శ్రద్ధ తీసుకోవడం’ను సహజమైన ‘శ్రద్ధ వహించడం’తో మార్చాం. బֶן־אָדָםను ఈ కీర్తనలోని సాధారణ మానవార్థంలో స్పష్టపరచి, తరువాతి మెస్సీయ సంబంధ వాడుకను ప్రధాన పాఠ్యంలోకి రానీయలేదు.
