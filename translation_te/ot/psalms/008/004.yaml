    rationale: ఈ సందర్భంలో בֶן־אָדָם అనేది אֱנוֹשׁకు సమాంతరంగా సాధారణ మానవుణ్ణి సూచిస్తుంది. సందర్భార్థాన్ని స్పష్టపరిచే రూపం మెస్సీయార్థాన్ని ముందుగానే సూచించకుండా ఉంటుంది.
