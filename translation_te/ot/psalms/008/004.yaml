source:
  edition: WLC
  text: מָֽה אֱנ֥וֹשׁ כִּֽי תִזְכְּרֶ֑/נּוּ וּ/בֶן אָ֝דָ֗ם כִּ֣י תִפְקְדֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/004.yaml
  text: What is man that you remember him[c][b][a], and the son of man that you attend to him?
translation:
  language: te
  text: మానవుడు ఎంతటివాడు, నీవు అతనిని జ్ఞాపకం చేసుకోవడానికి?[a] మానవ సంతానానికి చెందినవాడు ఎంతటివాడు, నీవు అతనిపట్ల శ్రద్ధ వహించడానికి?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మానవుడు’ అని అనువదించిన హీబ్రూ పదం అశాశ్వతమైన, బలహీనమైన మనిషిని ప్రత్యేకంగా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘మానవ సంతానానికి చెందినవాడు’ ఇక్కడ ఒక మానవుణ్ణి, ప్రతినిధిగా మానవాళిని సూచించే హీబ్రూ ప్రయోగం. తరువాతి బైబిలు వాడుకలో ఈ పదబంధానికి మెస్సీయ సంబంధ ప్రాముఖ్యత ఉండవచ్చు; అయితే ఈ కీర్తనలో ఇది మానవత్వానికి కవితా సమాంతరంగా పనిచేస్తుంది.
    reason: cross_reference
  - marker: c
    text: ‘శ్రద్ధ వహించడానికి’ అనే మాటకు ‘గమనించడానికి’, ‘పట్టించుకోవడానికి’ లేదా ‘సందర్శించడానికి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֱנוֹשׁ
  choice: మానవుడు ఎంతటివాడు
  rationale: క్రియలేని హీబ్రూ ప్రశ్న మానవుని అల్పత్వాన్ని సూచిస్తుంది. ‘ఎంతటివాడు’ ఆధునిక తెలుగులో సహజమైన అలంకారిక ప్రశ్నగా ఉండి ఏకవచన ప్రతినిధి భావాన్ని నిలుపుతుంది.
- source_word: תִזְכְּרֶנּוּ
  choice: నీవు అతన్ని జ్ఞాపకం చేసుకోవడానికి
  rationale: זכר యొక్క ప్రాథమిక ‘జ్ఞాపకం చేసుకొను’ భావాన్ని ప్రత్యక్షంగా నిలుపుతూ, దేవుని నిరంతర దృష్టిని సందర్భంలో తెలియజేస్తుంది.
- source_word: וּבֶן־אָדָם
  choice: మనుష్య కుమారుడు
  rationale: హీబ్రూ కవితా సమాంతరతను, ఏకవచన మానవ ప్రతినిధిత్వాన్ని, తరువాతి గ్రంథాంతర ప్రతిధ్వనిని నిలుపుతుంది; ఇక్కడ ఇది సాధారణంగా మానవుణ్ణి సూచిస్తుంది.
- source_word: תִפְקְדֶנּוּ
  choice: నీవు అతని గురించి శ్రద్ధ తీసుకోవడానికి
  rationale: פקד పదానికి గమనించు, విచారించు, దర్శించు, శ్రద్ధ చూపు అనే విస్తృత పరిధి ఉంది. ఈ సందర్భంలో ‘శ్రద్ధ తీసుకోవడం’ దేవుని క్రియాశీలమైన పట్టింపును సహజ తెలుగులో వ్యక్తం చేస్తూ, ‘సందర్శించడం’ అనే ఒక్క భావానికి పరిమితం చేయదు.
theological_decisions:
- issue: మానవజాతికి ప్రతినిధిగా ఉన్న పుంలింగ ఏకవచనం
  choice: ‘మానవుడు’, ‘మనుష్య కుమారుడు’, ‘అతన్ని’ అనే ఏకవచన రూపాలను నిలుపడం
  alternative: ‘మనుషులు’, ‘మానవజాతి’ వంటి బహువచన లేదా సామూహిక రూపాలు
  rationale: మూలంలోని పుంలింగ ఏకవచనం సమస్త మానవాళిని ప్రతినిధిగా సూచిస్తుంది. ఏకవచనం కవితా సమాంతరతను, గ్రంథాంతర అనుసంధానాన్ని కాపాడుతుంది; అది కేవలం పురుషులకే పరిమితమని భావించకూడదని పాదటిప్పణి వివరిస్తుంది.
- issue: ‘మనుష్య కుమారుడు’ ఇక్కడ మెస్సీయ బిరుదా?
  choice: ఈ కీర్తనలో మానవుణ్ణి సూచించే హీబ్రూ ప్రయోగంగా అనువదించడం; ప్రత్యేక బిరుదుగా సంకేతీకరించకపోవడం
  alternative: దీనిని నేరుగా మెస్సీయ బిరుదుగా గుర్తించడం
  rationale: తక్షణ సందర్భంలో ఈ పదబంధం אֱנוֹשׁకు కవితా సమాంతరంగా మానవత్వాన్ని సూచిస్తుంది. తరువాతి లేఖనాల్లో క్రీస్తు సంబంధ అన్వయం ఉన్నా, దానిని ఇక్కడి ప్రధాన పాఠ్యంలో ముందుగానే నిర్ణయించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కవితా శైలి. ‘ఎంతటివాడు’ అలంకారిక ప్రశ్నను సహజంగా మోస్తుంది. మూలంలోని ద్విపద సమాంతరత, రెండవ పురుష ఏకవచన దైవసంబోధన, మానవుణ్ణి సూచించే ఏకవచన రూపం నిలుపబడ్డాయి.
