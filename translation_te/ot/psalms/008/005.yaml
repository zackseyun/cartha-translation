id: PSA.8.5
reference: Psalms 8:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תְּחַסְּרֵ֣/הוּ מְּ֭עַט מֵ/אֱלֹהִ֑ים וְ/כָב֖וֹד וְ/הָדָ֣ר תְּעַטְּרֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/005.yaml
  text: Yet you made him a little lower than God[a], and crowned him with glory and honor.
translation:
  language: te
  text: అయినా నీవు అతనిని దేవునికంటే కొంచెం తక్కువగా చేశావు[a]; మహిమతో, ఘనతతో అతనికి కిరీటం పెట్టావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దివ్య జీవులకంటే.’ సెప్టువజింటులో ‘దేవదూతలకంటే’ అని ఉంది; హెబ్రీయులు 2:7లో అదే అనువాదం ప్రతిఫలిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּחַסְּרֵהוּ
  choice: అతనిని ... తక్కువగా చేశావు
  rationale: חסר హిఫీల్ రూపం, తరువాత వచ్చే מן పోలికతో కలిసి, ఒకరిని తక్కువ స్థితిలో ఉంచడాన్ని సూచిస్తుంది; తెలుగులో ఈ నిర్మాణం సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: מְּעַט
  choice: కొంచెం
  rationale: ఇక్కడ ప్రధానంగా కాలవ్యవధి కాక, స్థాయిలో స్వల్ప తక్కువతనాన్ని సూచిస్తుంది.
- source_word: מֵאֱלֹהִים
  choice: దేవునికంటే
  rationale: ఈ హీబ్రూ సందర్భంలో אֱלֹהִים అనే పదానికి నేరమైన పఠనం ‘దేవుడు’; ‘దివ్య జీవులు’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచి మూలంలోని అర్థసందిగ్ధతను కాపాడాం.
- source_word: וְכָבוֹד
  choice: మహిమతో
  rationale: כָבוֹד సూచించే ఘనమైన గౌరవం, వైభవం అనే భావాలకు ‘మహిమ’ ఈ కవితా సందర్భంలో తగినది.
- source_word: וְהָדָר
  choice: ఘనతతో
  rationale: הָדָר లోని వైభవం, గౌరవం, మహోన్నతత అనే భావాలను ‘ఘనత’ సహజంగా వ్యక్తం చేస్తూ ‘మహిమ’తో అనవసర పునరుక్తిని తగ్గిస్తుంది.
- source_word: תְּעַטְּרֵהוּ
  choice: అతనికి కిరీటం పెట్టావు
  rationale: עטר పియేల్ రూపంలోని కిరీటం పెట్టడం లేదా గౌరవంతో అలంకరించడం అనే రాజసంబంధ రూపకాన్ని ఈ పదబంధం స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ఏకవచన పురుష సర్వనామం సూచించే వ్యక్తి మరియు ప్రతినిధిత్వ భావం
  choice: ‘అతనిని/అతనికి’ అనే ఏకవచనాన్ని నిలుపడం
  alternative: ‘వారిని’ లేదా ‘మానవజాతిని’ అని మార్చడం
  rationale: హీబ్రూ పాఠంలో ఏకవచన సర్వనామ ప్రత్యయాలే ఉన్నాయి. సందర్భంలో అది మానవుని ప్రతినిధిగా సూచించగలిగినా, ఆ భావాన్ని వివరణగా ప్రధాన పాఠంలో చేర్చకుండా మూల రూపాన్ని నిలిపాం.
- issue: מֵאֱלֹהִים యొక్క అనువాదం
  choice: దేవునికంటే
  alternative: దివ్య జీవులకంటే; దేవదూతలకంటే
  rationale: హీబ్రూ పాఠానికి ప్రాధాన్యం ఇస్తే ‘దేవునికంటే’ నేరమైన పఠనం. ‘దేవదూతలకంటే’ అనేది సెప్టువజింటు పఠనం ద్వారా హెబ్రీయులు 2:7లో ప్రతిఫలిస్తుంది; అందుచేత దాన్ని ప్రధాన పాఠంలోకి దిగుమతి చేయకుండా పాదసూచికలో నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలి. హీబ్రూ ఏకవచనాన్ని, పోలికలోని స్వల్ప స్థాయి భావాన్ని, కిరీట రూపకాన్ని నిలిపాం; אֱלֹהִים లోని నిజమైన అర్థసందిగ్ధతను పాదసూచిక ద్వారా చూపించాం.
