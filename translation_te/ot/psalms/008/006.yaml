  yaml_path: translation/ot/psalms/008/006.yaml
  text: You made him rule over the works of your hands[b][a]; you put everything under his feet.
translation:
  language: te
  text: నీ చేతుల పనులపై అతనిని పాలకునిగా చేశావు[a][b]; సమస్తాన్ని అతని పాదాల కింద ఉంచావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ చేతుల పనులపై అతనికి అధికారం ఇచ్చావు.’
    reason: lexical_alternative
  - marker: b
    text: ‘అతనిని’, ‘అతని’ అనే ఏకవచన పుంలింగ రూపాలు హీబ్రూ వ్యాకరణాన్ని కొనసాగిస్తున్నాయి; ఇక్కడ అతను మానవజాతికి ప్రతినిధిగా ఉన్నాడు.
    reason: cultural_note
lexical_decisions:
- source_word: תַּמְשִׁילֵהוּ
  choice: అతనికి అధికారం ఇచ్చావు
  rationale: המשׁיל అనే హిఫిల్ రూపం ఒకరిని పాలించేలా చేయడం లేదా అధికారం అప్పగించడం అనే భావాన్ని ఇస్తుంది. తెలుగులో ‘అధికారం ఇచ్చావు’ సహజంగా ఉండి, దేవుడు మానవునికి పాలన బాధ్యత అప్పగించిన భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘పాలించేలా చేశావు’ మరింత రూపానుసారమైన ప్రత్యామ్నాయం.
- source_word: בְּמַעֲשֵׂי יָדֶיךָ
  choice: నీ చేతుల పనులపై
  rationale: ‘చేతుల పనులు’ అనే మూర్తమైన హీబ్రూ రూపకాన్ని నిలుపుతూ, בְ ఇక్కడ పాలనకు సంబంధించిన పరిధి లేదా విషయాన్ని ‘పై’ ద్వారా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כֹּל
  choice: సమస్తాన్ని
  rationale: సందర్భంలో సృష్టించబడిన వాటన్నిటినీ సమగ్రంగా సూచించే నిరపేక్ష ప్రయోగం. ‘సమస్తాన్ని’ ఆధునిక, గౌరవప్రదమైన తెలుగులో ఆ సంపూర్ణ భావాన్ని నిలుపుతుంది.
- source_word: שַׁתָּה
  choice: ఉంచావు
  rationale: שׁית క్రియకు పెట్టడం, ఉంచడం, నెలకొల్పడం అనే అర్థాలు ఉన్నాయి. ‘ఉంచావు’ ఇక్కడ నేరుగా, సహజంగా ఉంది.
- source_word: תַחַת רַגְלָיו
  choice: అతని పాదాల కింద
  rationale: అధీనతను లేదా అధికారానికి లోబరచడాన్ని సూచించే హీబ్రూ చిత్రణను పదచిత్రంతో సహా నిలుపుతుంది.
theological_decisions:
- issue: 8వ కీర్తనలో మానవజాతిని ప్రతినిధిగా సూచించే ఏకవచన పుంలింగ ప్రయోగం
  choice: ‘అతనికి’, ‘అతని’ అనే ఏకవచన పుంలింగ రూపాలను నిలుపడం
  alternative: ‘వారికి’, ‘వారి’ అని బహువచనంగా మార్చడం
  rationale: హీబ్రూ మూలంలో తక్షణ సందర్భం ఏకవచన పుంలింగ రూపాలను ఉపయోగిస్తూ మానవుణ్ణి మానవజాతికి ప్రతినిధిగా చూపుతుంది. వ్యాకరణ రూపాన్ని మార్చకుండా ఆ ప్రతినిధి భావాన్ని పాదటిప్పణిలో తెలియజేయడం మూలానికి నిబద్ధంగా ఉంటుంది.
- issue: పాలన లేదా అధికారం సూచించే భాష
  choice: ‘అతనికి అధికారం ఇచ్చావు’
  alternative: ‘అతన్ని పాలించేలా చేశావు’
  rationale: రెండు అనువాదాలూ హిఫిల్ యొక్క కారణార్థాన్ని వ్యక్తం చేయగలవు. ప్రధాన పాఠంలోని ఎంపిక దేవుడు మానవునికి సృష్టిపై అధికారం అప్పగించిన భావాన్ని సహజ తెలుగులో ఇస్తుంది; ప్రత్యామ్నాయం క్రియా నిర్మాణానికి మరింత దగ్గరగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘చేతుల పనులు’, ‘పాదాల కింద’ అనే మూలంలోని స్పష్టమైన చిత్రణలు నిలుపబడ్డాయి. పాదటిప్పణి గుర్తులు రెండూ ప్రధాన పాఠంలో ఉన్నాయి.
