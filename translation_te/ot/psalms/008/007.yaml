translation:
  language: te
  text: 'గొర్రెలను, ఎద్దులను—వాటన్నిటినీ,

    అలాగే పొలప్రాంతంలోని జంతువులను[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గొర్రెలను, పశువులన్నిటినీ, అలాగే పొలప్రాంతంలోని జంతువులను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹנֶה
  choice: గొర్రెలను
  rationale: ఈ పదం గొర్రెలు, మేకలు వంటి చిన్న పెంపుడు మందజంతువులను సూచించగలదు. కవితాత్మక జాబితాలో సహజంగా, సంక్షిప్తంగా ఉండేందుకు ‘గొర్రెలను’ ఎంచుకున్నాం; విస్తృతార్థం పాదసూచికలో ఇచ్చాం.
- source_word: וַאֲלָפִים
  choice: పశువులను
  rationale: ఇది పెద్ద పెంపుడు పశువులను, ముఖ్యంగా గోవులను సూచిస్తుంది. ఆధునిక తెలుగులో ‘పశువులు’ సహజంగా ఉండి జాబితాలోని పెంపుడు జంతువుల భావాన్ని అందిస్తుంది.
- source_word: כֻּלָּם
  choice: వాటన్నిటినీ
  rationale: హీబ్రూ రూపంలోని ‘అవన్నీ’ అనే సర్వసమగ్ర ఉద్ఘాటనను స్పష్టంగా నిలుపుతుంది.
- source_word: וְגַם
  choice: అలాగే
  rationale: పెంపుడు జంతువుల జాబితికి మరో వర్గాన్ని చేర్చే additive భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בַּהֲמוֹת
  choice: జంతువులను
  rationale: ఈ సందర్భంలో ఈ బహువచనం సాధారణంగా జంతువులను, ముఖ్యంగా పొలప్రాంతంలోని పెద్ద జంతువులను సూచిస్తుంది. ‘అడవి’తో కలిపి పెంపుడు పశువులకు భిన్నమైన వర్గం స్పష్టమవుతుంది.
- source_word: שָׂדָי
  choice: అడవి
  rationale: ఈ పదం పొలం, బహిరంగ ప్రదేశం, గ్రామ్యప్రాంతం అనే భావాలను కలిగి ఉంది. ఇక్కడ పెంపుడు జంతువులకు భిన్నంగా స్వేచ్ఛగా సంచరించే జంతువులను సూచించేందుకు ‘అడవి జంతువులు’ ఆధునిక తెలుగులో సహజమైన సమానార్థక ప్రయోగం.
