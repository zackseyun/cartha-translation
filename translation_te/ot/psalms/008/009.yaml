id: PSA.8.9
reference: Psalms 8:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יְהוָ֥ה אֲדֹנֵ֑י/נוּ מָֽה אַדִּ֥יר שִׁ֝מְ/ךָ֗ בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/009.yaml
  text: O Yahweh[a], our Lord[b], how majestic is your name in all the earth!
translation:
  language: te
  text: యాహ్వే[a], మా ప్రభువా, భూమి అంతటా నీ నామం ఎంత మహిమాన్వితమైనదో[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: “YHWH.” సంప్రదాయంగా “యెహోవా” లేదా “ప్రభువు” అని అనువదిస్తారు; ఇక్కడ “యాహ్వే” అని లిప్యంతరీకరించబడింది.'
    reason: alternative_reading
  - marker: b
    text: లేదా “ఎంత ఘనమైనదో!”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన YHWHను బిరుదుగా మార్చకుండా, హీబ్రూ నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: אֲדֹנֵינוּ
  choice: మా ప్రభువా
  rationale: ప్రత్యక్ష సంబోధనను తెలుగులో సహజమైన సంబోధనారూపంతో ఉంచుతూ, దేవుని సార్వభౌమ అధికారాన్ని సూచించే ‘ప్రభువు’ అనే పదాన్ని వాడాం.
- source_word: מָה
  choice: ఎంత…దో
  rationale: ఆశ్చర్యం, ప్రశంస వ్యక్తమయ్యే హీబ్రూ ఉద్గార నిర్మాణాన్ని సహజమైన తెలుగు ఉద్గార నిర్మాణంతో తెలిపాం.
- source_word: אַדִּיר
  choice: మహిమాన్వితమైనదో
  rationale: ఈ సందర్భంలో ఉన్న వైభవం, మహత్తు అనే భావాలను కలిపి తెలియజేస్తుంది; కేవలం బలాన్ని లేదా నైతిక శ్రేష్ఠతను మాత్రమే సూచించదు.
- source_word: שִׁמְךָ
  choice: నీ నామం
  rationale: దేవుని వెల్లడైన గుర్తింపు, ఘనత, కీర్తిని సూచించే మూలభాషా రూపకాన్ని వివరించి విస్తరించకుండా నిలిపాం.
- source_word: בְּכָל הָאָרֶץ
  choice: భూమి అంతటా
  rationale: కీర్తనలోని విశ్వవ్యాప్త పరిధిని సహజంగా తెలియజేస్తుంది; ‘దేశమంతటా’ అనే స్థానిక అర్థాన్ని నివారిస్తుంది.
theological_decisions:
- issue: יְהוָה אֲדֹנֵינוּ అనే దైవనామం–బిరుదు వరుస
  choice: యాహ్వే, మా ప్రభువా
  alternative: యెహోవా, మా ప్రభువా; ప్రభువా, మా ప్రభువా
  rationale: మొదటి పదాన్ని ప్రత్యేక దైవనామంగా, రెండవదాన్ని అధికారాన్ని సూచించే బిరుదుగా వేరు చేసి నిలిపాం. ఇలా చేయడం వల్ల మూలంలోని నామం–బిరుదు మధ్య వ్యత్యాసం కనుమరుగవదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆరాధనకు తగిన గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టమైన శైలిని వాడాం. ‘మా ప్రభువా’ అనే సంబోధన సహజత్వాన్ని, ‘నీ నామం’ అనే రూపం మూలంలోని ప్రత్యక్షతను కాపాడుతాయి.
