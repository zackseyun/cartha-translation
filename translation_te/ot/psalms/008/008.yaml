source:
  edition: WLC
  text: צִפּ֣וֹר שָׁ֭מַיִם וּ/דְגֵ֣י הַ/יָּ֑ם עֹ֝בֵ֗ר אָרְח֥וֹת יַמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/008.yaml
  text: the birds of the heavens[a], and the fish of the sea[b], whatever passes along the paths of the seas.
translation:
  language: te
  text: ఆకాశంలోని పక్షులనూ, సముద్రపు చేపలనూ, సముద్రాల మార్గాల్లో[b] సంచరించే సమస్తాన్నీ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘సంచరించేది’ అనే కృదంతం ఏకవచనంలో ఉంది. దీనిని ‘సముద్రాల మార్గాల్లో సంచరించేది ఏదైనా’ అని కూడా అనువదించవచ్చు; ఇక్కడ అది సముద్ర జీవజాతిని సమష్టిగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘సముద్రాల మార్గాలు’ అని బహువచనంలో ఉంది. కొన్ని అనువాదాలు దీన్ని ‘సముద్రపు మార్గాలు’ అని ఏకవచన భావంతో సరళీకరిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִפּוֹר שָׁמַיִם
  choice: ఆకాశ పక్షులు
  rationale: צִפּוֹר వ్యాకరణరీత్యా ఏకవచనమైనా ఇక్కడ జాతిని సమష్టిగా సూచిస్తుంది. అందువల్ల సహజమైన ఆధునిక తెలుగులో బహువచనంగా అనువదించాం; שָׁמַיִם సందర్భానుసారం పక్షులు ఎగిరే ‘ఆకాశం’ను సూచిస్తుంది.
- source_word: וּדְגֵי הַיָּם
  choice: సముద్రపు చేపలు
  rationale: ఈ సంబంధపదబంధాన్ని తెలుగులో సహజంగా ‘సముద్రపు చేపలు’ అని ఇచ్చాం; ‘చేపలు’ ఇక్కడ ఒక జీవవర్గాన్ని సమష్టిగా సూచిస్తుంది.
- source_word: עֹבֵר
  choice: సంచరించేవన్నీ
  rationale: ఏకవచన కృదంతం సందర్భంలో సమష్టి భావాన్ని కలిగి ఉండవచ్చు. ‘సంచరించేవన్నీ’ అనే రూపం సముద్రంలో కదిలే జీవులను విస్తృతంగా సూచిస్తూ ఆ భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: אָרְחוֹת
  choice: దారుల్లో
  rationale: సముద్రంలో జీవులు ప్రయాణించే మార్గాలనే కవితాత్మక చిత్రాన్ని ‘దారులు’ స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: יַמִּים
  choice: సముద్రాల
  rationale: హీబ్రూ పదం బహువచనంలో ఉన్నందున దాని కవితాత్మక విస్తృతిని నిలుపుతూ తెలుగులో కూడా బహువచనం వాడాం.
theological_decisions:
- issue: עֹבֵר అనే ఏకవచన కృదంతం దేనిని సూచిస్తుంది?
  choice: సముద్రాల దారుల్లో సంచరించే జీవులన్నిటినీ సమష్టిగా సూచించేలా అనువదించడం
  alternative: దాన్ని ముందున్న ‘సముద్రపు చేపలు’ అనే పదబంధానికే నేరుగా అన్వయించడం
  rationale: హీబ్రూ వ్యాకరణం ఏకవచన రూపాన్ని కలిగి ఉన్నప్పటికీ, జాబితా ముగింపులో అది సమష్టి సారాంశంగా పనిచేసే అవకాశం ఉంది. ప్రధాన పాఠంలో విస్తృత భావాన్ని ఇచ్చి, పరిమిత అన్వయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తన కవిత్వానికి తగిన గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదాలను ఎంచుకున్నాం. మూలంలోని సమష్టి ఏకవచనాలను తెలుగులో సహజమైన బహువచన రూపాలతో వ్యక్తం చేశాం.
