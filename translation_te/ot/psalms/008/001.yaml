id: PSA.8.1
reference: Psalms 8:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יְהוָ֤ה אֲדֹנֵ֗י/נוּ מָֽה אַדִּ֣יר שִׁ֭מְ/ךָ בְּ/כָל הָ/אָ֑רֶץ אֲשֶׁ֥ר תְּנָ֥/ה ה֝וֹדְ/ךָ֗ עַל הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/001.yaml
  text: O Yahweh[a], our Lord[c][b], how majestic is your name in all the earth—you have set your splendor above the heavens.
translation:
  language: te
  text: 'యాహ్వే[a], మా ప్రభువా,

    భూమంతటా నీ నామం ఎంత మహిమాన్వితమైనది!

    నీ తేజస్సును ఆకాశాలకంటే పైగా ఉంచావు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీయులో YHWH అనే దైవనామం; సంప్రదాయంగా దీనిని “ప్రభువు” అని అనువదిస్తారు; “యెహోవా” అనే ధ్వన్యంతరీకరణ కూడా వాడుకలో ఉంది.
    reason: alternative_reading
  - marker: b
    text: 'హెబ్రీ క్రియారూపాన్ని అక్షరార్థంగా ఆజ్ఞగా చదివితే: “నీ తేజస్సును ఆకాశాలపై ఉంచు.” ఈ పాదపు హెబ్రీ నిర్మాణం క్లిష్టమైనది.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన YHWHను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ ధ్వన్యంతరీకరణగా ఇచ్చాం.
- source_word: אֲדֹנֵינוּ
  choice: మా ప్రభువా
  rationale: మొదటి పురుష బహువచన ప్రత్యయాన్ని ‘మా’తో, దేవునికి చేసే ప్రత్యక్ష సంబోధనను ‘ప్రభువా’తో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מָה אַדִּיר
  choice: ఎంత మహిమాన్వితమైనది
  rationale: מָה యొక్క ఆశ్చర్యోద్గార భావాన్ని, אַדִּיר సూచించే ఘనతను మరియు మహోన్నతత్వాన్ని ఆరాధనా సందర్భానికి తగిన రీతిలో నిలుపుతుంది.
- source_word: שִׁמְךָ
  choice: నీ నామం
  rationale: దేవుని వెల్లడైన ఖ్యాతి, సన్నిధి వంటి విస్తృత భావాలను కలిగిన హెబ్రీయుల నామ-ప్రయోగాన్ని వ్యాఖ్యానించకుండా యథాతథంగా నిలుపుతుంది.
- source_word: בְּכָל הָאָרֶץ
  choice: భూమంతటా
  rationale: ‘ఆకాశాలు’తో ఉన్న విశ్వవ్యాప్త సమాంతర భావాన్ని సహజమైన సంక్షిప్త తెలుగులో తెలియజేస్తుంది.
- source_word: תְּנָה
  choice: ఉంచావు
  rationale: మసొరెటిక్ రూపం వ్యాకరణపరంగా ఆజ్ఞార్థకంగా కనిపించినా, వాక్యసందర్భంలో దేవుడు తన తేజస్సును ఆకాశాలపై స్థాపించాడనే కవితాత్మక ప్రకటనగా గ్రహించాం; రూపంలోని క్లిష్టతను పాదటిప్పణిలో తెలిపాం.
- source_word: הוֹדְךָ
  choice: నీ తేజస్సును
  rationale: הוֹד లోని వైభవం, ప్రకాశం, మహిమ అనే భావపరిధిని కవితాత్మకంగా అందిస్తుంది; ముందటి ‘మహిమాన్వితమైనది’తో అనవసర పదపునరుక్తిని నివారిస్తుంది.
- source_word: עַל הַשָּׁמָיִם
  choice: ఆకాశాలకంటే పైగా
  rationale: עַל ఇక్కడ తెలిపే ఉన్నతస్థాన భావాన్ని, దేవుని తేజస్సు ఆకాశాలకన్నా మిన్నగా ఉన్నదనే విశ్వవ్యాప్త చిత్రణను స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ప్రత్యేక దైవనామం నేరుగా ఉంది. దానిని సాధారణ బిరుదుగా మార్చకుండా ధ్వన్యంతరీకరించడం మూలంలోని నిబంధనాత్మక నామాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: תְּנָה క్రియారూపపు భావం
  choice: గత/పూర్తి కార్య ప్రకటనగా ‘ఉంచావు’
  alternative: ఆజ్ఞార్థకంగా ‘నీ తేజస్సును ఆకాశాలపై ఉంచు’
  rationale: పద్యంలోని స్తుతి ప్రవాహం మరియు ప్రాచీన అనువాద సంప్రదాయాల్లో ప్రతిబింబించే ప్రకటనాత్మక అవగాహన ‘ఉంచావు’కు మద్దతిస్తాయి. అయితే మసొరెటిక్ స్వరచిహ్నాలతో ఉన్న రూపం ఆజ్ఞార్థకంగా చదవగలదనే నిజమైన ఉద్రిక్తతను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే స్తోత్రశైలిని వాడాం. ప్రత్యక్ష సంబోధనకు ‘ప్రభువా’, ఆశ్చర్యోద్గారానికి ‘ఎంత ...!’ అనే సహజ నిర్మాణాలను ఎంచుకున్నాం; మూలంలోని కవితా పాదవిభజనను నిలిపాం.
