  to: 'మనుష్యుల కుమారులారా,


    ఎంతకాలం నా ఘనతను[a] అవమానపరుస్తారు?


    మీరు వ్యర్థమైనదాన్ని ప్రేమించి,


    అబద్ధాన్ని వెదుకుతారు?


    సెలా.'
  rationale: The revision removes the added second temporal question and uses coordinated finite verbs under the one rhetorical “ఎంతకాలం?” This more closely reflects the Hebrew syntax and poetic parallelism while retaining the draft’s sound lexical choices and its noncommittal rendering of כְבוֹדִי.
