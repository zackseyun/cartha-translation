  text: Sons of men[a], how long will my honor be turned into shame? Will you love emptiness and seek falsehood? Selah
translation:
  language: te
  text: 'మనుష్యుల కుమారులారా,


    ఎంతకాలం నా ఘనతను[a] అవమానపరుస్తారు?


    మీరు వ్యర్థమైనదాన్ని ప్రేమించి,


    అబద్ధాన్ని వెదుకుతారు?


    సెలా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా మహిమను.” హీబ్రూ పదం ఘనత, గౌరవం, మహిమ అనే భావాలను సూచించగలదు; ఇక్కడ బహిరంగంగా అవమానించబడుతున్న కీర్తనకర్త గౌరవాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אִישׁ
  choice: మనుష్యుల కుమారులారా
  rationale: మానవ ప్రత్యర్థులను ఉద్దేశించిన హీబ్రూ సంబోధనలోని ‘కుమారులు’ అనే రూపకాన్ని, దాని వాక్చాతుర్య బలాన్ని నిలుపుతూ తెలుగులో సహజంగా అర్థమయ్యేలా అనువదించబడింది.
- source_word: עַד מֶה
  choice: ఎంతకాలం
  rationale: కాలవ్యవధిని ప్రశ్నిస్తూ మందలించే హీబ్రూ కవితా ప్రయోగానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: כְבוֹדִי
  choice: నా ఘనతను
  rationale: כָּבוֹד ఇక్కడ వ్యక్తి గౌరవం, ప్రతిష్ఠ అనే సామాజిక భావాన్ని సూచించగలదు. ‘ఘనత’ ఆ భావాన్ని తెలియజేస్తూనే ‘మహిమ’ అనే విస్తృత ప్రత్యామ్నాయాన్ని పూర్తిగా తొలగించదు.
- source_word: לִכְלִמָּה
  choice: అవమానంగా మారుస్తారు
  rationale: హీబ్రూలో స్పష్టమైన క్రియ లేకపోయినా, לִכְלִמָּה సందర్భంలో ఫలితాన్ని సూచిస్తుంది. తెలుగులో వాక్యం సహజంగా ఉండేందుకు అంతర్లీనమైన మార్పు భావం వ్యక్తపరచబడింది.
- source_word: תֶּאֱהָבוּן
  choice: ప్రేమిస్తూ
  rationale: అసంపూర్ణ క్రియారూపం కొనసాగుతున్న లేదా పదేపదే జరిగే ప్రవర్తనను సూచించగలదు. ‘ఎంతకాలం’ అనే ప్రశ్న పరిధిలో ‘ప్రేమిస్తూ’ ఆ నిరంతర ధోరణిని సహజంగా తెలియజేస్తుంది.
- source_word: רִיק
  choice: వ్యర్థమైనదాన్ని
  rationale: రూపరహిత ‘శూన్యత’ కంటే, ప్రయోజనం లేని లేదా సారంలేని దానిని ప్రేమించడం అనే సందర్భార్థాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: תְּבַקְשׁוּ
  choice: వెదకుతారు
  rationale: בקשׁ యొక్క ప్రాథమిక భావాన్ని కవితా సమాంతరతలో నేరుగా నిలుపుతుంది.
- source_word: כָזָב
  choice: అబద్ధాన్ని
  rationale: ఏకవచన భావవాచక నామాన్ని నిలుపుతూ అసత్యం లేదా మోసం అనే భావాన్ని సరళంగా వ్యక్తపరుస్తుంది.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఈ ఆరాధనా లేదా సంగీత సూచిక యొక్క ఖచ్చితమైన అర్థం అనిశ్చితమైనందున వివరణాత్మక అనువాదం చేయకుండా లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: ‘నా ఘనత’ దేనిని సూచిస్తుంది?
  choice: కీర్తనకర్తకు చెందిన ఘనత లేదా గౌరవం అనే విస్తృత భావాన్ని నిలుపడం
  alternative: నా మహిమ; దేవుడు నాకు ఇచ్చిన గౌరవం
  rationale: హీబ్రూ పదం కీర్తనకర్త రాజసంబంధ గౌరవాన్ని గానీ, దేవుని వలన అతనికి కలిగిన ఘనతను గానీ సూచించవచ్చు. అనువాదం ఏ ఒక్క నిర్దిష్ట దైవశాస్త్రీయ వివరణకూ పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితా గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదాలు వాడబడ్డాయి. సంబోధనలోని హీబ్రూ రూపకం నిలుపబడింది; ‘సెలా’ యొక్క అనిశ్చిత అర్థం వివరణతో పరిమితం చేయబడలేదు.
