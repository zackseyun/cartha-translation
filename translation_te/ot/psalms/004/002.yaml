    rationale: The single Hebrew phrase עַד־מֶה (“how long?”) introduces both the shame clause and the love/seek clause. Repeating it is not seriously misleading, but is less formally faithful.
  - severity: medium
    issue: The coordinated verbal construction is uneven in Telugu.
    rationale: The draft combines “మారుస్తారు” with “ప్రేమిస్తూ” and “వెదకుతారు.” Finite coordinated verbs better express the two parallel Hebrew imperfects and the continuing rhetorical rebuke.
