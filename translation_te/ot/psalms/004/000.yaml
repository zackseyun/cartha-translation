  yaml_path: translation/ot/psalms/004/000.yaml
  text: 'For the choirmaster: with stringed instruments. A psalm of David[a].'
translation:
  language: te
  text: సంగీత నిర్దేశకునికి; తంతివాద్యాలతో. దావీదు కీర్తన[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దావీదు రచించిన కీర్తన,’ లేదా ‘దావీదు కోసం కీర్తన’; హీబ్రూ ప్రయోగం రచయితత్వాన్ని, సంబంధాన్ని లేదా అంకితాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నిర్దేశకునికి
  rationale: కీర్తనల శీర్షికల్లో ఈ పదం సంగీత ప్రదర్శనకు బాధ్యత వహించే నాయకునికి ఇచ్చిన సూచనగా అర్థమవుతుంది. ‘సంగీత నిర్దేశకుడు’ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉండి, గాయకబృందానికే పరిమితం చేయదు.
- source_word: בִּנְגִינוֹת
  choice: తంతివాద్యాలతో
  rationale: ఈ సందర్భంలో పదం తీగలుగల వాద్యాలతో చేసే సంగీతాన్ని సూచిస్తుంది. ఈ అనువాదం ప్రదర్శన విధానాన్ని అవసరానికి మించి నిర్దిష్టం చేయకుండా సంగీత సూచనను సహజంగా తెలియజేస్తుంది.
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: ఇది సంగీత కూర్పును సూచించే ప్రామాణిక శీర్షికా పదం; కీర్తనల గ్రంథ సందర్భంలో ‘కీర్తన’ సహజమైన, స్థిరపడిన తెలుగు రూపం.
- source_word: לְדָוִד
  choice: దావీదు కీర్తన
  rationale: హీబ్రూ לְ సంబంధం, రచన లేదా అంకితాన్ని సూచించగలదు. తెలుగు ‘దావీదు కీర్తన’ ఈ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తూ, రచయిత దావీదేనని పాఠ్యంలోనే కచ్చితంగా తేల్చదు.
theological_decisions:
- issue: శీర్షికలో לְדָוִד సూచించే రచయితత్వం లేదా సంబంధం
  choice: దావీదు కీర్తన
  alternative: దావీదు రచించిన కీర్తన / దావీదు కోసం కీర్తన
  rationale: మూలంలోని సంబంధార్థం విస్తృతమైనది. ఎంచుకున్న రూపం సంప్రదాయ అనుబంధాన్ని నిలుపుతూ, రచయితత్వం లేదా అంకితార్థం అనే ఒకే వివరణను బలవంతంగా నిర్ణయించదు; ప్రత్యామ్నాయ అర్థాలను పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన శీర్షికా శైలిని ఉపయోగించాం. ‘సంగీత నిర్దేశకుడు’ అనే విస్తృత పదం గాయకబృంద నాయకుడనే అనవసర పరిమితిని నివారిస్తుంది. పాదసూచిక గుర్తు దాని విషయమైన ‘దావీదు కీర్తన’ తర్వాత ఉంచబడింది.
