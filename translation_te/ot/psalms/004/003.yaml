id: PSA.4.3
reference: Psalms 4:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/דְע֗וּ כִּֽי הִפְלָ֣ה יְ֭הוָה חָסִ֣יד ל֑/וֹ יְהוָ֥ה יִ֝שְׁמַ֗ע בְּ/קָרְאִ֥/י אֵלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/003.yaml
  text: And know that Yahweh has set apart the godly for himself[b][a]; Yahweh hears when I call to him.
translation:
  language: te
  text: యాహ్వే భక్తుణ్ణి తనకోసం ప్రత్యేకపరిచాడని తెలుసుకోండి[a]. నేను ఆయనకు మొరపెట్టినప్పుడు యాహ్వే వింటాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే తన నమ్మకస్థుణ్ణి తనకోసం విశిష్టంగా ఉంచాడని.” హీబ్రూ పదం నిబంధనపరమైన విశ్వాస్యతను లేదా భక్తిని నొక్కి చెప్పవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నేను ఆయనకు మొరపెట్టినప్పుడు యాహ్వే విననున్నాడు.” హీబ్రూ క్రియారూపాన్ని అలవాటైన వర్తమానంగా లేదా నిశ్చయమైన భవిష్యత్‌గా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְעוּ
  choice: తెలుసుకోండి
  rationale: ידע క్రియ యొక్క బహువచన ఆజ్ఞారూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది. వాక్యారంభంలోని ו అనుసంధానాన్ని తెలుగులో ప్రత్యేక పదంతో అనువదించకపోయినా భావప్రవాహం నిలుస్తుంది.
- source_word: כִּי
  choice: అని
  rationale: ఏ విషయం తెలుసుకోవాలో తెలిపే ఉపవాక్యాన్ని తెలుగులో సహజంగా పరిచయం చేస్తుంది.
- source_word: הִפְלָה
  choice: ప్రత్యేకించుకున్నాడు
  rationale: హిఫీల్ రూపం ఇక్కడ ఒకరిని వేరుగా లేదా విశిష్టంగా ఉంచడాన్ని సూచిస్తుంది; לוֹతో కలిపి ‘తనకోసం ప్రత్యేకించుకున్నాడు’ సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: חָסִיד
  choice: తన భక్తుణ్ణి
  rationale: దైవభక్తి, విశ్వాస్యత, నిబంధనాపరమైన నిబద్ధత అనే భావవలయాన్ని సాధారణ పాఠకునికి సహజంగా తెలియజేస్తుంది; మూలంలోని ఏకవచనాన్ని నిలుపుతుంది.
- source_word: לוֹ
  choice: తనకోసం
  rationale: యాహ్వే తన కొరకు ఆ వ్యక్తిని ప్రత్యేకించుకున్నాడనే ప్రతిబింబార్థాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: יִשְׁמַע
  choice: వింటాడు
  rationale: హీబ్రూ అసంపూర్ణ క్రియారూపం అలవాటైన వర్తమాన చర్యను లేదా నిశ్చయమైన భవిష్యత్ చర్యను సూచించగలదు. ప్రధాన పాఠంలో కీర్తనకర్త ప్రస్తుత నమ్మకాన్ని చూపే ‘వింటాడు’ ఎంచుకోబడింది.
- source_word: בְּקָרְאִי
  choice: నేను … మొరపెట్టినప్పుడు
  rationale: בతో కూడిన క్రియానామ రూపంలోని కాలసంబంధ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ప్రార్థనా సందర్భంలో ‘మొరపెట్టు’ తగినది.
- source_word: אֵלָיו
  choice: ఆయనకు
  rationale: ప్రార్థన యాహ్వే వైపు ఉద్దేశించబడిందనే దిశార్థాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉన్నందున దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించబడింది.
- issue: חָסִיד భావం
  choice: భక్తుడు
  alternative: నమ్మకస్థుడు; విశ్వాసపాత్రుడు
  rationale: ఈ పదం భక్తితో పాటు నిబంధన విశ్వాస్యతను కూడా సూచించగలదు. ప్రధాన పాఠం విస్తృతమైన భక్తి భావాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలియజేస్తుంది.
- issue: יִשְׁמַע కాలార్థం
  choice: వింటాడు
  alternative: వింటాడు/విననున్నాడు
  rationale: ఈ రూపం అలవాటైన వర్తమానాన్ని గానీ నిశ్చయమైన భవిష్యత్తును గానీ సూచించగలదు. సందిగ్ధతను పాదసూచికలో నిలిపి, ప్రధాన పాఠంలో కీర్తనకర్త నమ్మకాన్ని సహజంగా వ్యక్తపరచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సరళంగా, అయితే కీర్తనకు తగిన గౌరవభరిత శైలిలో ఉంది. మూలంలోని ఏకవచనం, ప్రార్థనా దిశ, దైవనామం నిలుపబడ్డాయి.
