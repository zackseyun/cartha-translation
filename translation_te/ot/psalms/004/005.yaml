  rationale: సవరణ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన పదబంధాన్ని ఉపయోగిస్తూ זִבְחֵי צֶדֶק యొక్క ఉద్దేశపూర్వక విస్తృతిని నిలుపుతుంది. అలాగే, וּבִטְחוּ אֶל יְהוָהలోని వ్యక్తిపట్ల ఉంచే విశ్వాసం/నమ్మకాన్ని ‘యాహ్వేపై నమ్మకం ఉంచండి’ అని స్పష్టంగా తెలిపింది. పాదసూచికలోని ప్రత్యామ్నాయాలు మూలపదం యొక్క అర్థపరిధిని చూపుతాయి; వాటిలో ఏ ఒక్క వ్యాఖ్యానాన్నీ నిర్దిష్టంగా ఎంచుకోవు.
