source:
  edition: WLC
  text: זִבְח֥וּ זִבְחֵי צֶ֑דֶק וּ֝/בִטְח֗וּ אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/005.yaml
  text: Offer sacrifices of righteousness[a], and trust in Yahweh.
translation:
  language: te
  text: నీతియుక్తమైన బలులు అర్పించండి[a]; యాహ్వేపై నమ్మకం ఉంచండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సరైన బలులు అర్పించండి’; లేదా, ‘న్యాయమైన బలులు అర్పించండి.’
    reason: צֶדֶק పదం నీతి, న్యాయం, సరైనదనం అనే పరస్పర సంబంధమైన భావాలను కలిగి ఉంది; ఈ పదబంధం నైతిక యథార్థతను, ఆరాధనలో సరైన విధానాన్ని, లేదా రెండింటినీ సూచించవచ్చు.
lexical_decisions:
- source_word: זִבְחוּ זִבְחֵי
  choice: బలులు అర్పించండి
  rationale: ఒకే మూలం నుంచి వచ్చిన క్రియ, నామవాచకాల పునరుక్తిని తెలుగులో యథాతథంగా ఉంచితే అసహజంగా ఉంటుంది. ‘బలులు అర్పించండి’ బలిపరమైన చర్యను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: צֶדֶק
  choice: నీతి
  rationale: ఈ పదంలో నీతి, న్యాయం, సరైన క్రమం అనే భావాలు ఉన్నాయి. ‘నీతి బలులు’ అనే నిర్మాణం బలులు నైతిక నిజాయితీతోనివా, నిబంధన ప్రకారం సరైనవా, లేక రెండూ కలిసినవా అనే మూలంలోని విస్తృతిని నిలుపుతుంది.
- source_word: וּבִטְחוּ אֶל
  choice: నమ్మండి
  rationale: బహువచన ఆజ్ఞారూపంలోని విశ్వాస పిలుపును తెలుగులో నేరుగా, సహజంగా వ్యక్తం చేస్తుంది. సంబంధాన్ని తెలిపే אֶל భావం తెలుగు క్రియకు జోడించిన కర్మవిభక్తిలో సహజంగా వ్యక్తమవుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
theological_decisions:
- issue: ‘నీతి బలులు’ అనే పదబంధం యొక్క అర్థం
  choice: నీతి లేదా సరైన క్రమంతో లక్షణీకరించబడిన బలులు అనే విస్తృత భావాన్ని నిలుపడం
  alternative: నైతికంగా నిజాయితీగల ఆరాధన మాత్రమే, లేదా నిబంధన ప్రకారం చెల్లుబాటైన బలులు మాత్రమే అని పరిమితం చేయడం
  rationale: זִבְחֵי צֶדֶק నైతిక యథార్థతను, ఆరాధనలో సరైన విధానాన్ని, లేదా రెండింటినీ సూచించగలదు. అనువాదం ఈ ఉద్దేశపూర్వక విస్తృతిని సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. ‘నీతి బలులు’ మూలంలోని సంక్షిప్త నిర్మాణాన్నీ అర్థవిస్తృతినీ కాపాడుతుంది; అర్థస్పష్టత కోసం ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
