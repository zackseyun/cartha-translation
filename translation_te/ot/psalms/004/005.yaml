review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys both plural imperatives and preserves the sacrificial sense of זבח. However, ‘నీతి బలులు’ is not a sufficiently natural modern Telugu construction for the construct phrase זִבְחֵי צֶדֶק, and ‘యాహ్వేను నమ్మండి’ can lean toward believing what Yahweh says rather than placing trust in him. The revision more clearly expresses the trust relationship while retaining the source’s broad sense.
  naturalness: ‘నీతియుక్తమైన బలులు’ is idiomatic modern standard Telugu. ‘యాహ్వేపై నమ్మకం ఉంచండి’ is a natural Telugu exhortation for trusting in Yahweh and avoids the possible narrower sense of ‘believe Yahweh.’
  terminology: ‘బలులు అర్పించండి’ correctly retains the cultic meaning. ‘నీతియుక్తమైన’ appropriately represents צֶדֶק without deciding between ethical integrity and proper/right worship. ‘యాహ్వే’ consistently represents the Tetragrammaton.
  issues:
  - severity: medium
    issue: ‘నీతి బలులు’ is an awkward and potentially unclear noun-noun combination in contemporary Telugu.
    rationale: Although it is structurally close to the Hebrew construct phrase, modern Telugu readers more naturally understand ‘నీతియుక్తమైన బలులు.’ This retains the qualifying breadth of צֶדֶק without adding an interpretive restriction.
  - severity: low
    issue: ‘యాహ్వేను నమ్మండి’ may be read as ‘believe Yahweh’ rather than ‘trust in Yahweh.’
    rationale: The Hebrew בטח with אֶל is a call to place confidence or trust in Yahweh. ‘యాహ్వేపై నమ్మకం ఉంచండి’ expresses that relationship naturally.
