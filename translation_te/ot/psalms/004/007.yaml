source:
  edition: WLC
  text: נָתַ֣תָּה שִׂמְחָ֣ה בְ/לִבִּ֑/י מֵ/עֵ֬ת דְּגָנָ֖/ם וְ/תִֽירוֹשָׁ֣/ם רָֽבּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/007.yaml
  text: You have put joy in my heart more than when their grain and their new wine abound[a].
translation:
  language: te
  text: వారి ధాన్యం, కొత్త ద్రాక్షారసం సమృద్ధిగా ఉన్నప్పటి కంటే ఎక్కువ ఆనందాన్ని నీవు నా హృదయంలో ఉంచావు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “వారి ధాన్యం, కొత్త ద్రాక్షారసం పెరిగినప్పటి నుండి నీవు నా హృదయంలో ఆనందాన్ని ఉంచావు.” దేవుడు ఇచ్చిన ఆనందం భౌతిక సమృద్ధివల్ల కలిగే ఆనందం కంటే గొప్పదనే పోలికగా ఈ హీబ్రూ పదబంధాన్ని సాధారణంగా అర్థం చేసుకుంటారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַתָּה
  choice: నీవు ... ఉంచావు
  rationale: దేవుణ్ణి సంబోధించే נתן క్రియ యొక్క కాలపూర్ణ ద్వితీయ పురుష ఏకవచన రూపం. దేవుడు హృదయంలో ఆనందాన్ని కలిగించాడనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: שִׂמְחָה
  choice: ఆనందాన్ని
  rationale: లోపలి సంతోషం లేదా ఉల్లాసాన్ని సూచించే ఈ నామవాచకానికి ఆధునిక ప్రామాణిక తెలుగులో సహజమైన పదం.
- source_word: בְלִבִּי
  choice: నా హృదయంలో
  rationale: లֵב ఇక్కడ అంతరంగ వ్యక్తిత్వాన్ని సూచిస్తుంది; మూలంలోని స్థానార్థక నిర్మాణాన్ని అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: מֵעֵת
  choice: ఉన్నప్పటి కంటే ఎక్కువ
  rationale: מִן + עֵת నిర్మాణాన్ని పోలికగా గ్రహించి, పంట సమృద్ధి కలిగే సమయంతో దేవుడిచ్చిన ఆనందాన్ని పోల్చే భావాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: דְּגָנָם
  choice: వారి ధాన్యం
  rationale: דגן ధాన్యపు పంటను సూచిస్తుంది; 'ధాన్యం' ఖచ్చితమైన, సాధారణ ఆధునిక తెలుగు పదం.
- source_word: וְתִירוֹשָׁם
  choice: కొత్త ద్రాక్షారసం
  rationale: תירוש సాధారణంగా తాజా లేదా కొత్త ద్రాక్షారసాన్ని సూచిస్తుంది; వ్యవసాయ సమృద్ధి చిత్రాన్ని కాపాడుతుంది.
- source_word: רָבּוּ
  choice: సమృద్ధిగా ఉన్నప్పుడు
  rationale: רבה యొక్క ఈ రూపం పెరగడం లేదా విస్తారమవడం అనే అర్థాన్ని ఇస్తుంది; ధాన్యం, ద్రాక్షారసం సమృద్ధిని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: వాక్యంలోని పోలిక నిర్మాణం
  choice: దేవుడు ఇచ్చిన అంతరంగ ఆనందం, వారి ధాన్యం మరియు కొత్త ద్రాక్షారసం సమృద్ధిగా ఉన్నప్పటి ఆనందం కంటే ఎక్కువ అని కీర్తనకర్త చెబుతున్నాడు.
  alternative: మరింత అక్షరార్థంగా, ‘వారి ధాన్యం, కొత్త ద్రాక్షారసం పెరిగినప్పటి నుండి నీవు నా హృదయంలో ఆనందాన్ని ఉంచావు’ అని చదవవచ్చు.
  rationale: מֵעֵת సాధారణంగా ఇక్కడ పోలికకు ప్రమాణాన్ని పరిచయం చేస్తుందని గ్రహించబడుతుంది. అయినా కాలార్థక పఠనం సాధ్యమనే మూలభాషా సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనాత్మక గౌరవాన్ని నిలుపుతూ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం. ‘కొత్త ద్రాక్షారసం’ వ్యవసాయ నేపథ్యాన్ని స్పష్టంగా ఉంచుతుంది.
