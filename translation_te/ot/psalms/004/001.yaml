review_pass:
  verdict: revise
  source_fidelity: The temporal opening, imperative requests, perfect recollection of prior relief, and the distress-versus-spaciousness image are faithfully represented. However, ‘నా నీతికి దేవా’ is grammatically and idiomatically less clear in Telugu than the Hebrew construct it seeks to represent; it can sound as though God is merely ‘for’ the speaker’s righteousness, rather than ‘God of my righteousness.’
  naturalness: The prayer register is otherwise modern, clear, and appropriately poetic. ‘నా నీతికి దేవుడవైనవాడా’ is a more natural and intelligible Telugu vocative while preserving the formal construct relationship and its interpretive openness.
  terminology: ‘కృప చూపి,’ ‘ప్రార్థన,’ ‘ఇరుకులో,’ and ‘విశాలమైన చోటు కల్పించావు’ are suitable. The revised vocative avoids making God’s righteousness or vindicating action the sole meaning in the main text.
  issues:
  - severity: medium
    issue: The vocative ‘నా నీతికి దేవా’ is semantically and syntactically opaque.
    rationale: It is intended to reproduce אֱלֹהֵי צִדְקִי, but Telugu ‘కి’ can be read as a dative (‘for my righteousness’) and lacks an explicit relational expression. ‘నా నీతికి దేవుడవైనవాడా’ clearly conveys ‘God of my righteousness’ without resolving the construct’s ambiguity.
  revised_text: 'నేను పిలిచినప్పుడు నాకు జవాబివ్వు,

