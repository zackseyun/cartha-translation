source:
  edition: WLC
  text: בְּ/קָרְאִ֡/י עֲנֵ֤/נִי אֱלֹ֘הֵ֤י צִדְקִ֗/י בַּ֭/צָּר הִרְחַ֣בְתָּ לִּ֑/י חָ֝נֵּ֗/נִי וּ/שְׁמַ֥ע תְּפִלָּתִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/001.yaml
  text: When I call[a], answer me, O God of my righteousness. In distress you have made room for me[b]. Be gracious to me and hear my prayer.
translation:
  language: te
  text: 'నేను పిలిచినప్పుడు నాకు జవాబివ్వు,

    నా నీతికి దేవుడవైనవాడా![a]

    ఇరుకులో నాకు విశాలమైన చోటు కల్పించావు.[b]

    నాపై కృప చూపి, నా ప్రార్థన ఆలకించు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీతిమంతుడవైన నా దేవా,’ లేదా ‘నాకు న్యాయం తీర్చే దేవా.’ హీబ్రూలో అక్షరార్థంగా ‘నా నీతి యొక్క దేవా’ అని ఉంది.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘నాకు ఉపశమనం కలిగించావు.’ హీబ్రూ మాటచిత్రం ఇరుకైన స్థితి నుంచి విశాలత కలిగించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקָרְאִי
  choice: నేను పిలిచినప్పుడు
  rationale: ב + infinitive construct ఇక్కడ కాలార్థాన్ని ఇస్తుంది. קרא ప్రార్థనా సందర్భంలో ‘మొరపెట్టు’ అనే భావాన్ని కలిగి ఉండగలిగినా, మూలంలోని సాధారణ ‘పిలుచు’ భావాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: עֲנֵנִי
  choice: నాకు జవాబివ్వు
  rationale: ענה ఇక్కడ ప్రార్థనకు స్పందించడం అనే సాధారణ అర్థంలో ఉంది; ఆధునిక తెలుగులో ఇది సహజమైన ప్రయోగం.
- source_word: אֱלֹהֵי צִדְקִי
  choice: నా నీతికి దేవా
  rationale: ‘నా నీతి యొక్క దేవుడు’ అనే హీబ్రూ నిర్మాణాన్ని సాధ్యమైనంత దగ్గరగా ఉంచుతూ, దేవుడు నీతికి మూలమా, న్యాయం తీర్చేవాడా, లేక ‘నీతిమంతుడైన నా దేవుడా’ అనే భావమా అన్న తెరవుదలను నిలిపే రూపం.
- source_word: בַּצָּר
  choice: ఇరుకులో
  rationale: צַר కష్టం లేదా సంకటాన్ని సూచించడమే కాక, ఇరుకైన స్థలం అనే కవితాత్మక చిత్రాన్ని కూడా మోస్తుంది. తరువాతి ‘విశాలమైన చోటు’తో ఉన్న వ్యత్యాసాన్ని ఇది నిలుపుతుంది.
- source_word: הִרְחַבְתָּ לִּי
  choice: నాకు విశాలమైన చోటు కల్పించావు
  rationale: רחב యొక్క హిఫిల్ రూపంలోని ‘విశాలం చేయు’ అనే స్థలసంబంధ చిత్రాన్ని సహజమైన తెలుగులో నిలిపాం; సందర్భంలో ఇది సంకటంనుంచి ఉపశమనం లేదా విడుదలను సూచిస్తుంది.
- source_word: חָנֵּנִי
  choice: నాపై కృప చూపు
  rationale: חנן యొక్క ప్రాథమిక భావం అనుగ్రహం లేదా కృప చూపడం. ‘నన్ను కరుణించు’ సాధ్యమైనా, ‘కృప చూపు’ పదార్థానికి మరింత దగ్గరగా ఉంది.
- source_word: וּשְׁמַע
  choice: ఆలకించు
  rationale: ప్రార్థనా భాషలో שׁמע కేవలం శబ్దం వినడం కాక శ్రద్ధగా వినడాన్ని సూచిస్తుంది; ‘ఆలకించు’ సంక్షిప్తంగా, గౌరవప్రదంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: תְּפִלָּתִי
  choice: నా ప్రార్థన
  rationale: תפלה కు నేరమైన, సాధారణ తెలుగు సమానార్థకం ‘ప్రార్థన’.
theological_decisions:
- issue: אֱלֹהֵי צִדְקִי అనే నిర్మాణం యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో ‘నా నీతికి దేవా’ అని నిర్మాణాత్మక తెరవుదలను నిలిపాం.
  alternative: ‘నీతిమంతుడవైన నా దేవా’ లేదా ‘నాకు న్యాయం తీర్చే దేవా’.
  rationale: హీబ్రూ నిర్మాణం నీతి దేవుని లక్షణమని మాత్రమే చెప్పుతోందా, దేవుడు కీర్తనకర్తను నిర్దోషిగా తీర్చేవాడని చెబుతోందా, లేక అతని నీతికి మూలం/ఆధారం దేవుడని చెబుతోందా అన్నది ఖచ్చితంగా నిర్ణయించదు. ఒక వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా పెట్టకుండా ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనకు తగిన గౌరవప్రదమైన కవితా శైలిని వాడాం. ‘ఇరుకు—విశాలమైన చోటు’ అనే మూల స్థలరూపకాన్ని స్పష్టంగా నిలిపాం. ‘నా నీతికి దేవా’ సాధారణ గద్యానికి కొంత అసాధారణమైనా, మూలంలోని ఉద్దేశపూర్వక భావతెరవుదలను కాపాడటానికి ఎంచుకున్నాం; పాదసూచిక ప్రత్యామ్నాయాలను వివరిస్తుంది.
