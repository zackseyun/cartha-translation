  source_fidelity: 'The draft accurately represents the Hebrew imperatives: רגזו as “వణకండి,” the prohibition against sin, inward speech, the plural possessives in “మీ ... మీ,” and דמו as silence/stillness. “సెలా” appropriately preserves the untranslated liturgical term. The alternative anger reading is correctly retained without treating it as certain.'
