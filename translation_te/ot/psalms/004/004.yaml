source:
  edition: WLC
  text: רִגְז֗וּ וְֽ/אַל תֶּ֫חֱטָ֥אוּ אִמְר֣וּ בִ֭/לְבַבְ/כֶם עַֽל מִשְׁכַּבְ/כֶ֗ם וְ/דֹ֣מּוּ סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/004.yaml
  text: Tremble[a], and do not sin; speak in your hearts on your beds, and be still[b]. Selah
translation:
  language: te
  text: 'వణకండి[a], పాపం చేయకండి;

    మీ పడకలపై ఉన్నప్పుడు, మీ హృదయాల్లో చెప్పుకోండి,

    నిశ్శబ్దంగా ఉండండి[b]. సెలా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కోపపడండి, పాపం చేయకండి.” హీబ్రూ క్రియ వణకడం, కలవరపడడం, లేదా కోపపడడం అనే భావాలను సూచించగలదు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “నిశ్చలంగా ఉండండి.”
    reason: lexical_ambiguity
lexical_decisions:
- source_word: רִגְזוּ
  choice: వణకండి
  rationale: רגז అనే క్రియ వణకడం, కలవరపడడం, లేదా కోపపడడం అనే భావాలను సందర్భానుసారం సూచించగలదు. పాపం చేయవద్దనే హెచ్చరికతోను, అంతరంగ పరిశీలన మరియు నిశ్శబ్దం వైపు సాగే వాక్యగమనంతోను ‘వణకండి’ సరిపోతుంది; ‘కోపపడండి’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וְאַל תֶּחֱטָאוּ
  choice: పాపం చేయకండి
  rationale: חטא అనే సాధారణ క్రియతో ఉన్న నిషేధాన్ని ఆధునిక తెలుగులో నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אִמְרוּ בִלְבַבְכֶם
  choice: మీ హృదయాల్లో చెప్పుకోండి
  rationale: אִמְרוּ యొక్క ‘చెప్పండి’ అనే క్రియాబలాన్ని నిలుపుతూ, בִלְבַבְכֶם సూచించే అంతరంగ సంభాషణను తెలుగులో సహజంగా తెలియజేయడానికి ‘చెప్పుకోండి’ వాడాం. ‘హృదయాల్లో’ అనే బహువచనం మూలంలోని బహువచన ప్రత్యయాన్ని నిలుపుతుంది.
- source_word: עַל מִשְׁכַּבְכֶם
  choice: మీ పడకలపై
  rationale: మూలంలోని బహువచనాన్ని నిలుపుతూ, విశ్రాంతి లేదా రాత్రివేళ వ్యక్తిగత ఆత్మపరిశీలన జరిగే స్థలాన్ని నేరుగా సూచిస్తుంది.
- source_word: וְדֹמּוּ
  choice: నిశ్శబ్దంగా ఉండండి
  rationale: דמם మౌనంగా లేదా నిశ్చలంగా ఉండడాన్ని సూచించగలదు. ఇక్కడ అంతరంగ సంభాషణ తరువాత వచ్చే ఆగిపోవడం మరియు మౌనాన్ని ‘నిశ్శబ్దంగా ఉండండి’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఈ ఆరాధనా లేదా సంగీత సూచిక యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం కాబట్టి అనువదించకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించాం.
theological_decisions:
- issue: నైతిక హెచ్చరిక సందర్భంలో רגזו యొక్క భావం
  choice: పాపానికి దారితీయకుండా వణకడం లేదా కలవరపడడం అనే విస్తృత భావం
  alternative: కోపపడండి, కానీ పాపం చేయకండి
  rationale: ఈ హీబ్రూ క్రియ కోపాన్ని కూడా సూచించగలిగినా, వెంటనే వచ్చే అంతరంగ సంభాషణ మరియు నిశ్శబ్దం అనే పిలుపు విస్తృతమైన భావోద్వేగ కలవరాన్ని సూచించవచ్చు. అందువల్ల ప్రధాన పాఠ్యంలో ‘వణకండి’ ఉంచి, సంప్రదాయబద్ధమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చి అర్థసందిగ్ధతను కాపాడాం.
- issue: וְדֹמּוּలో మౌనం మరియు నిశ్చలత మధ్య భావవ్యాప్తి
  choice: నిశ్శబ్దంగా ఉండండి
  alternative: నిశ్చలంగా ఉండండి
  rationale: మూలక్రియ రెండు భావాలనూ అనుమతిస్తుంది. ముందున్న అంతరంగ సంభాషణకు అనుసరించే మౌనం ప్రధాన పాఠ్యానికి అనుకూలం; నిశ్చలత భావాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. ‘మీ హృదయాల్లో చెప్పుకోండి’ అనే రూపం హీబ్రూ అంతరంగ-సంభాషణ నుడికారాన్ని అతిగా వివరణాత్మకంగా మార్చకుండా సహజీకరిస్తుంది. కవితా పాద విభజనను భావగమనానికి అనుగుణంగా ఉంచాం.
