  terminology: “పాపం,” “హృదయాలు,” and “సెలా” are suitable in a dignified modern-standard Telugu biblical register. “నిశ్శబ్దంగా ఉండండి” is a sound main rendering for דמו; “నిశ్చలంగా ఉండండి” appropriately preserves the related alternative nuance in the note.
