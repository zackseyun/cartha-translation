revisions:
- from: నేను ప్రశాంతంగా పడుకొని నిద్రపోతాను[a]; ఎందుకంటే యెహోవా, నీవే నాకు సురక్షితంగా నివాసం కలిగిస్తావు[b].
  to: నేను శాంతితో పడుకొని నిద్రపోతాను[a]; ఎందుకంటే యాహ్వే, నీవే నన్ను సురక్షితంగా నివసింపజేస్తావు[b].
  rationale: 'The revision preserves the verse’s Hebrew syntax and the audit trail’s preferred reading: peaceful rest is grounded in Yahweh alone causing the psalmist to dwell securely. It improves the causative wording, aligns the divine name with the project’s stated policy, and makes the lexical-alternative note more exact while retaining the disputed attachment of לְבָדָד.'
  reviewer_model: gpt-5.6-terra
