id: PSA.4.8
reference: Psalms 4:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/שָׁל֣וֹם יַחְדָּו֮ אֶשְׁכְּבָ֪ה וְ/אִ֫ישָׁ֥ן כִּֽי אַתָּ֣ה יְהוָ֣ה לְ/בָדָ֑ד לָ֝/בֶ֗טַח תּוֹשִׁיבֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/008.yaml
  text: In peace I will both lie down and sleep[a], for you alone, O Yahweh[b], make me dwell in safety.
translation:
  language: te
  text: నేను శాంతితో పడుకొని నిద్రపోతాను[a]; ఎందుకంటే యాహ్వే, నీవే నన్ను సురక్షితంగా నివసింపజేస్తావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను శాంతితో కలిసి పడుకొని నిద్రపోతాను.” హీబ్రూ క్రియావిశేషణానికి “కలిసి” లేదా “పూర్తిగా” అనే అర్థాలు ఉండవచ్చు; ప్రధాన పాఠంలో రెండు క్రియలతో దాని భావాన్ని సహజంగా వ్యక్తం చేశాం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఎందుకంటే యాహ్వే, నీవు నన్ను ఒంటరిగా సురక్షితంగా నివసింపజేస్తావు.” హీబ్రూ వాక్యాన్ని ‘ఒంటరిగా’ అనే మాట కీర్తనకర్త నివాసస్థితిని వర్ణించేలా కూడా అర్థం చేసుకోవచ్చు; ప్రధాన పాఠం దాన్ని ‘నీవే’తో అనుసంధానిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּשָׁלוֹם
  choice: ప్రశాంతంగా
  rationale: שָׁלוֹם ఇక్కడ శాంతి, క్షేమం, భద్రతతో కూడిన స్థితిని సూచిస్తుంది. తెలుగులో నిద్రపోవడాన్ని వర్ణించేటప్పుడు ‘ప్రశాంతంగా’ సహజంగా ఉండి సందర్భార్థాన్ని అందిస్తుంది.
- source_word: יַחְדָּו
  choice: పడుకొని నిద్రపోతాను
  rationale: అక్షరార్థంగా ‘కలిసి/ఒకేసారి.’ ఇక్కడ వరుసగా ఉన్న రెండు క్రియలను ఒక సమగ్ర చర్యగా కలుపుతుంది. సహజమైన తెలుగులో ప్రత్యేక పదం చేర్చకుండా క్రియల సమన్వయం ద్వారా దాని బలాన్ని వ్యక్తం చేశాం; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אֶשְׁכְּבָה
  choice: నేను ... పడుకొని
  rationale: ఈ అపూర్ణ క్రియ సంకల్పం లేదా నమ్మకంతో కూడిన భవిష్యత్తును సూచిస్తుంది. ‘పడుకొని’ తదుపరి క్రియతో సహజంగా కలుస్తుంది.
- source_word: וְאִישָׁן
  choice: నిద్రపోతాను
  rationale: ישן అనే క్రియకు సరళమైన అర్థం ‘నిద్రపోవడం.’ తెలుగు వాక్య నిర్మాణంలో భవిష్యత్/నిశ్చయ భావాన్ని ప్రధాన క్రియపై వ్యక్తం చేశాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: కీర్తనకర్త ప్రశాంతంగా నిద్రపోవడానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: לְבָדָד
  choice: నీవే
  rationale: ‘ఒంటరిగా/ఒక్కడే’ అనే క్రియావిశేషణాన్ని ప్రధాన పఠనంలో దేవునితో అనుసంధానించాం. తెలుగులో ‘నీవే’ దేవుడు మాత్రమే భద్రత కలిగిస్తాడనే పరిమితార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לָבֶטַח
  choice: సురక్షితంగా
  rationale: בֶּטַח భద్రత లేదా నిర్భయ స్థితిని సూచిస్తుంది. ‘నివాసం కలిగిస్తావు’తో ‘సురక్షితంగా’ సహజంగా సరిపోతుంది.
- source_word: תּוֹשִׁיבֵנִי
  choice: నాకు ... నివాసం కలిగిస్తావు
  rationale: ישׁב యొక్క హిఫీల్ రూపంలోని కారణార్థాన్ని ‘నివాసం కలిగిస్తావు’ నిలుపుతుంది; కేవలం అనుమతించడం అనే బలహీన భావాన్ని నివారిస్తుంది.
theological_decisions:
- issue: לְבָדָד యొక్క అన్వయం, భావబలం
  choice: కీర్తనకర్తకు సురక్షిత నివాసం కలిగించేది యెహోవా ఒక్కడే.
  alternative: కీర్తనకర్త ఒంటరిగా సురక్షితంగా నివసిస్తాడు.
  rationale: పదక్రమం, సందర్భం לְבָדָדను ‘నీవు’తో అనుసంధానించడానికి అనుకూలంగా ఉన్నాయి; అందువల్ల ‘నీవే’ అని అనువదించాం. అయినా అది కీర్తనకర్త నివాసస్థితిని వర్ణించే వ్యాకరణ అవకాశాన్ని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ కీర్తనా గౌరవాన్ని నిలిపే శైలి. ‘నివాసం కలిగిస్తావు’ కారణార్థాన్ని స్పష్టంగా ఉంచుతుంది. రెండు నిజమైన హీబ్రూ సందిగ్ధతలను పాదటిప్పణుల్లో నిలిపాం.
