id: PSA.4.6
reference: Psalms 4:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רַבִּ֥ים אֹמְרִים֮ מִֽי יַרְאֵ֪/נ֫וּ ט֥וֹב נְֽסָ/ה עָ֭לֵי/נוּ א֨וֹר פָּנֶ֬י/ךָ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/006.yaml
  text: Many are saying[a], “Who will show us good? Lift up the light of your face upon us[c][b], O Yahweh.”
translation:
  language: te
  text: 'అనేకులు ఇలా అంటున్నారు: “మనకు మేలు చూపించేవాడు ఎవరు?[a] యెహోవా[c], నీ ముఖకాంతిని[b] మా మీద ఎత్తుము.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మనకు మేలు కనిపించేలా చేసేవాడు ఎవరు?” హీబ్రూ క్రియ కారణార్థకమైనది.
    reason: lexical_alternative
  - marker: b
    text: “నీ ముఖకాంతి” అనేది దేవుని అనుగ్రహాన్ని లేదా కృపగల సన్నిధిని సూచించే కవితాత్మక వ్యక్తీకరణ. “ఎత్తుము”గా అనువదించిన హీబ్రూ క్రియారూపం క్లిష్టమైనది; కొందరు దాన్ని “పతాకంలా ఎత్తు” అని గ్రహిస్తారు.
    reason: lexical_alternative
  - marker: c
    text: “యెహోవా” అనేది హీబ్రూ YHWH అనే దైవనామానికి తెలుగు లిప్యంతరీకరణ; దీనిని “యాహ్వే” అని కూడా లిప్యంతరీకరిస్తారు, సంప్రదాయంగా “ప్రభువు” అని అనువదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים אֹמְרִים
  choice: అనేకులు ఇలా అంటున్నారు
  rationale: רַבִּים నామవాచకార్థంలో ‘అనేకులు’ అని సూచిస్తుంది; వర్తమాన కృదంతమైన אֹמְרִים కొనసాగుతున్న లేదా తరచుగా వినిపించే మాటను తెలియజేస్తుంది.
- source_word: מִי יַרְאֵנוּ טוֹב
  choice: మనకు మేలు చూపించేవాడు ఎవరు?
  rationale: יַרְאֵנוּ అనేది ראה ధాతువు హిఫీల్ రూపం; దాని కారణార్థాన్ని సహజమైన తెలుగులో ‘చూపించేవాడు’ నిలుపుతుంది. טוֹב ను నిర్దిష్టమైన ఐశ్వర్యంగా పరిమితం చేయకుండా విస్తృతార్థంలో ‘మేలు’గా ఇచ్చాం.
- source_word: נְסָה עָלֵינוּ
  choice: మా మీద ప్రకాశింపజేయి
  rationale: ఈ క్లిష్టమైన క్రియారూపం సందర్భంలో దేవుని ముఖకాంతి ప్రజలపై వెలిగేలా చేయమనే ప్రార్థనను సూచిస్తుంది. ‘ప్రకాశింపజేయి’ తెలుగులో సహజంగా ఉండి కాంతి రూపకాన్ని నిలుపుతుంది.
- source_word: אוֹר פָּנֶיךָ
  choice: నీ ముఖకాంతిని
  rationale: అక్షరార్థంలోని ‘నీ ముఖపు కాంతి’ భావాన్ని సహజమైన సమాసరూపంలో ఇచ్చి, దైవానుగ్రహం లేదా సన్నిధి అనే కవితాత్మక రూపకాన్ని వ్యాఖ్యానంగా మార్చకుండా కాపాడాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామం YHWHను తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం; బిరుదుతో భర్తీ చేయలేదు.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణను ఉపయోగించడం ద్వారా దానిని బిరుదుగా మార్చకుండా నిలుపుతున్నాం; ఉచ్చారణ పునర్నిర్మాణమైన ‘యాహ్వే’ను పాదటిప్పణిలో సూచించాం.
- issue: ‘నీ ముఖకాంతి’ అనే మానవరూపాత్మక కవితా వ్యక్తీకరణ
  choice: రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: నీ అనుగ్రహం / నీ సన్నిధి
  rationale: ఈ రూపకం దేవుని అనుగ్రహపూర్వక సన్నిధిని సూచించినా, ప్రధాన పాఠ్యంలో దానిని నేరుగా వ్యాఖ్యానిస్తే కవితా మరియు ధార్మిక ఉద్వేగం తగ్గిపోతుంది.
- issue: నְסָה అనే క్రియారూపంలోని పాఠ్య/పదార్థ క్లిష్టత
  choice: ప్రకాశింపజేయి
  alternative: మా మీద ఎత్తు / పతాకంలా ఎత్తు
  rationale: ముఖకాంతితో కలిసిన సందర్భార్థాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది; అయితే రూపంలోని క్లిష్టతను పాదటిప్పణిలో దాచకుండా తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గౌరవభరితమైన కవితా ధోరణి. సాధారణ పాఠకులకు సహజంగా ఉండేందుకు ‘ముఖకాంతి’ అనే సులభమైన రూపాన్ని, దేవునితో ప్రత్యక్ష సంబోధనలో ఏకవచన ‘నీ’ రూపాన్ని వాడాం.
