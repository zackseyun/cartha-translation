  yaml_path: translation/ot/psalms/040/004.yaml
  text: Blessed is the man who has made Yahweh his trust[a], and has not turned to the proud[d][c][b], to those who turn aside to falsehood.
translation:
  language: te
  text: 'యెహోవాను తన నమ్మకంగా చేసుకొని,


    గర్విష్ఠులవైపు గాని,


    అబద్ధం వైపు తొలగిపోయేవారివైపు గాని తిరగని మనిషి ధన్యుడు!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: ధన్యుడు
  rationale: హీబ్రూ జ్ఞానసాహిత్య ధన్యతా ప్రకటనలోని ఆనందం, దేవుని అనుగ్రహంలో ఉన్న శ్రేయస్సు రెండింటినీ ‘ధన్యుడు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַגֶּבֶר
  choice: మనిషి
  rationale: ఇది వ్యాకరణపరంగా పుంలింగ ఏకవచనమైనా, ఇక్కడ జ్ఞానోక్తిలో ప్రతినిధి అర్థంతో వాడబడింది; తెలుగు ‘మనిషి’ మూలంలోని ఏకవచన రూపాన్ని సహజంగా నిలుపుతుంది.
- source_word: שָׂם
  choice: ఉంచుకొని
  rationale: మూల క్రియ యొక్క ‘పెట్టడం/ఉంచడం’ భావాన్ని, యెహోవాపై నమ్మకాన్ని స్థిరపరచుకోవడం అనే సందర్భార్థాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన ప్రత్యక్ష లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: מִבְטַחוֹ
  choice: తన నమ్మకంగా
  rationale: తాను ఆధారపడే వ్యక్తి అనే భావంతో కూడిన ‘నమ్మకం/ఆధారం’ అర్థాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: פָנָה אֶל
  choice: వైపు తిరగకుండా
  rationale: దిశను మార్చుకోవడం అనే రూపకాన్ని, సహాయం లేదా విధేయత కోసం ఆశ్రయించడం అనే సందర్భ భావంతో సహా నిలుపుతుంది.
- source_word: רְהָבִים
  choice: గర్విష్ఠులు
  rationale: ఇక్కడ ఇది ‘రాహాబు’ అనే నామవాచకంగా కాక, గర్వించే లేదా అహంకరించే వ్యక్తులను సూచించే బహువచన సాధారణ నామంగా గ్రహించబడింది.
- source_word: שָׂטֵי כָזָב
  choice: అబద్ధం వైపు తొలగిపోయేవారు
  rationale: వాక్యనిర్మాణం కొంత క్లిష్టమైనప్పటికీ, ‘తొలగిపోవడం/పక్కకు మళ్లడం’ మరియు ‘అబద్ధం’ అనే రెండు మూల భావాలనూ సంరక్షిస్తుంది.
theological_decisions:
- issue: జ్ఞానసాహిత్య ధన్యతా ప్రకటనలో ప్రతినిధి పుంలింగ ఏకవచనం
  choice: మనిషి ధన్యుడు
  alternative: ఆ వ్యక్తి ధన్యుడు; అలాంటి వాడు ధన్యుడు
  rationale: మూలంలోని పుంలింగ ఏకవచన రూపాన్ని ఉంచుతూ, అది సందర్భంలో ప్రతినిధి స్వభావం కలిగిందనే విషయాన్ని తెలుగు సహజంగా తెలియజేస్తుంది.
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా తెలుగులో విస్తృతంగా తెలిసిన రూపంలో నిలుపుతుంది.
- issue: చివరి పదబంధపు సంబంధం
  choice: గర్విష్ఠులవైపు తిరగకపోవడం మరియు అబద్ధం వైపు తొలగిపోయేవారిని ఆశ్రయించకపోవడం అనే సమాంతర సంబంధం
  alternative: అబద్ధం వైపు తొలగిపోయిన గర్విష్ఠులు అనే ఒకే సమూహం
  rationale: హీబ్రూ పదబంధం రెండు విధాల సంబంధాన్ని అనుమతించవచ్చు. ప్రధాన పాఠం సమాంతర పఠనాన్ని సహజ తెలుగులో ఇస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నమోదు చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గౌరవభరితమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ సమాంతరతను మూడు పాదాలుగా ప్రతిఫలింపజేసి, అస్పష్టమైన చివరి నిర్మాణాన్ని అతిగా సిద్ధాంతీకరించకుండా పాదటిప్పణిలో ప్రత్యామ్నాయంగా ఉంచింది.
