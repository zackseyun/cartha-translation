source:
  edition: WLC
  text: קַוֺּ֣ה קִוִּ֣יתִי יְהוָ֑ה וַ/יֵּ֥ט אֵ֝לַ֗/י וַ/יִּשְׁמַ֥ע שַׁוְעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/001.yaml
  text: I waited patiently for Yahweh[a], and he turned to me and heard my cry for help.
translation:
  language: te
  text: యహ్వే కోసం నేను ఓపికగా ఎదురుచూశాను[a]; ఆయన నా వైపు తిరిగి, సహాయం కోసం నేను పెట్టిన మొరను విన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఎదురుచూస్తూ నేను ఎదురుచూశాను.” ఇది “నేను ఓపికగా ఎదురుచూశాను” లేదా “నేను గాఢమైన ఆశతో ఎదురుచూశాను” అనే బలమైన వ్యక్తీకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַוֺּה קִוִּיתִי
  choice: నేను ఓపికగా ఎదురుచూశాను
  rationale: కוה ధాతువు యొక్క క్రియార్థక నామరూపం, సమాపక క్రియతో కలిసి రావడం చర్యను బలంగా నొక్కిచెబుతుంది. తెలుగులో ‘ఓపికగా ఎదురుచూశాను’ అనేది ఆ నిలకడైన నిరీక్షణను సహజంగా వ్యక్తం చేస్తుంది; మూలంలోని నిర్మాణాన్ని పాదసూచికలో చూపించాం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: ఇది బిరుదు కాదు, దేవుని వ్యక్తిగత నామమైన చతురక్షర నామం. అందువల్ల దానిని ‘ప్రభువు’గా మార్చకుండా ‘యహ్వే’ అని లిప్యంతరీకరించాం.
- source_word: וַיֵּט אֵלַי
  choice: ఆయన నా వైపు తిరిగి
  rationale: נטה ఇక్కడ కీర్తనకర్త వైపు దృష్టి మళ్లించడం లేదా వంగడం అనే భావాన్ని ఇస్తుంది. ‘నా వైపు తిరిగి’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి ఆ సంబంధపూర్వక కదలికను నిలుపుతుంది.
- source_word: וַיִּשְׁמַע
  choice: విన్నాడు
  rationale: שׁמע ఇక్కడ మొరను శ్రద్ధగా వినడాన్ని సూచిస్తుంది. ‘విన్నాడు’ సందర్భంలో స్పష్టంగా, సహజంగా ఉంది; ప్రతిస్పందించాడనే భావాన్ని అదనంగా చేర్చలేదు.
- source_word: שַׁוְעָתִי
  choice: సహాయం కోసం నేను పెట్టిన మొరను
  rationale: שַׁוְעָה సాధారణ కేకకన్నా ఆపదలో సహాయం కోరుతూ పెట్టే మొరను సూచిస్తుంది. ఈ అనువాదం ఆ సహాయవిన్నప భావాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: హీబ్రూ పాఠంలో దేవుని వ్యక్తిగత నామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, ఆధునికంగా సమీపమైన ‘యహ్వే’ రూపంలో ఉంచడం మూలపాఠానికి నిష్ఠగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. మూలంలోని బలమైన పునరుక్తిని ప్రధాన పాఠంలో సహజమైన క్రియావిశేషణంతో, పాదసూచికలో మరింత అక్షరార్థంగా ప్రతిబింబించాం.
