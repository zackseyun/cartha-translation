translation:
  language: te
  text: సంగీత నిర్దేశకునికి. దావీదుకు సంబంధించినది[a]. ఒక కీర్తన.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దావీదు రచించినది,’ లేదా ‘దావీదు కోసం’; హీబ్రూ శీర్షిక రచయితను, అనుబంధాన్ని, లేదా అంకితాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నిర్దేశకునికి
  rationale: ఈ పదం సంగీత ప్రదర్శనను పర్యవేక్షించే నాయకుణ్ణి సూచిస్తుంది. కీర్తన శీర్షికలోని ל ఉపసర్గను ‘-కి’గా ఇవ్వడం అంకితార్థక భావాన్ని సహజంగా తెలియజేస్తుంది; ‘గానబృంద నాయకుడు’ అని పరిమితం చేయకుండా విస్తృత సంగీత సందర్భాన్ని నిలుపుతుంది.
- source_word: לְדָוִד
  choice: దావీదుకు సంబంధించినది
  rationale: కీర్తన శీర్షికల్లో ל కర్తృత్వం, అనుబంధం, అంకితం, లేదా సంకలన సంబంధాన్ని సూచించవచ్చు. ‘దావీదు రచించినది’ అని చెప్పడం కంటే ఈ రూపం మూలంలోని విస్తృత అనిశ్చితిని కాపాడుతుంది.
- source_word: מִזְמוֹר
  choice: ఒక కీర్తన
  rationale: ఇది సంగీత సంబంధమైన కీర్తన ప్రక్రియకు సాధారణ హీబ్రూ పేరు. ఆధునిక తెలుగు పాఠకులకు ‘కీర్తన’ స్పష్టమైన, స్థిరమైన సమానార్థకం.
theological_decisions:
- issue: దావీదు సంబంధిత శీర్షిక యొక్క భావం
  choice: దావీదుకు సంబంధించినది
  alternative: దావీదు రచించినది; దావీదు కోసం
  rationale: లְדָוִד అనే రూపం కచ్చితమైన రచయితను మాత్రమే నిర్దేశించదు. అందువల్ల దావీదు కర్తృత్వాన్ని అవసరానికి మించి నిర్ధారించకుండా, రచన, అనుబంధం లేదా అంకితం అనే సాధ్యార్థాలను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన కీర్తన శీర్షికగా రూపొందించబడింది. మూలంలోని మూడు భాగాల నిర్మాణం మరియు לְדָוִד లోని భావ అనిశ్చితి కాపాడబడ్డాయి.
