source:
  edition: WLC
  text: אָ֣ז אָ֭מַרְתִּי הִנֵּה בָ֑אתִי בִּ/מְגִלַּת סֵ֝֗פֶר כָּת֥וּב עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/007.yaml
  text: Then I said[a], “Behold, I have come[b]; in the scroll of the book it is written about me.”
translation:
  language: te
  text: 'అప్పుడు నేను ఇలా అన్నాను: “ఇదిగో, నేను వచ్చాను; గ్రంథపు చుట్టలో నా గురించి[a] రాయబడి ఉంది.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా కోసం వ్రాయబడినది” లేక “నాకు నిర్దేశించబడినది.” హెబ్రీ పదబంధం వక్తను గురించి రాయబడినదానినిగానీ, అతని కోసం నిర్ణయించబడినదానినిగానీ సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ఈ వాక్యం మెస్సీయకు అన్వయిస్తూ హెబ్రీయులకు 10:7లో ఉదహరించబడింది.
    reason: cross_reference
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: ముందున్న సందర్భానికి ప్రతిస్పందనగా తరువాత జరిగిన మాటను పరిచయం చేసే కాలక్రమ సూచనను సహజంగా తెలియజేస్తుంది.
- source_word: אָמַרְתִּי
  choice: నేను ఇలా అన్నాను
  rationale: మొదటి పురుష ఏకవచన క్రియ యొక్క సాధారణ అర్థాన్ని నిలుపుతూ, వెంట వచ్చే ప్రత్యక్ష వాక్యాన్ని తెలుగులో సహజంగా పరిచయం చేస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: వక్త తన రాకపై దృష్టి నిలిపే హెబ్రీ ఉద్ఘాటనను, కవితాత్మక గాంభీర్యాన్ని కాపాడుతుంది.
- source_word: בָאתִי
  choice: నేను వచ్చాను
  rationale: వక్త తనను తాను సమర్పించుకుంటూ వచ్చిన స్థితిని తెలుగులో సహజమైన పూర్తయిన క్రియతో వ్యక్తం చేస్తుంది.
- source_word: בִּמְגִלַּת סֵפֶר
  choice: గ్రంథపు చుట్టలో
  rationale: מְגִלָּה అనే చుట్ట ఆకారపు లిఖిత పత్రం చిత్రాన్ని నిలుపుతూ, సֵפֶר దానిని గ్రంథంగా నిర్దేశిస్తున్న భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: כָּתוּב
  choice: రాయబడి ఉంది
  rationale: నిలకడైన కర్మణి స్థితిని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: עָלַי
  choice: నా గురించి
  rationale: చుట్టలో వక్తను గురించి రాయబడిందనే సందర్భోచిత ప్రధాన భావాన్ని ఇస్తుంది; ‘నా కోసం’ లేదా ‘నాకు నిర్దేశించబడినది’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: హెబ్రీయులకు 10లో తరువాత క్రీస్తుతో అనుసంధానించబడిన עָלַי పదబంధం యొక్క భావం
  choice: నా గురించి
  alternative: నా కోసం; నాకు నిర్దేశించబడినది
  rationale: కీర్తన యొక్క తక్షణ సందర్భంలో ‘నా గురించి’ అనేది ప్రత్యక్షమైన భావం. అయితే వక్త కోసం వ్రాయబడినది లేదా అతనికి విధించబడినది అనే అర్థసంభావ్యతను ప్రధాన పాఠంలో సిద్ధాంతపరంగా తీర్మానించకుండా పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరమైన కవితా ధోరణితో అనువదించబడింది. ‘ఇదిగో’ మూలంలోని ఉద్ఘాటనను, ‘గ్రంథపు చుట్ట’ ప్రాచీన లిఖిత రూపపు చిత్రాన్ని నిలుపుతాయి.
