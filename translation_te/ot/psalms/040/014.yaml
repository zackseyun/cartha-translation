revisions:
- from: నా ప్రాణాన్ని అంతం చేయాలని వెదకేవారు అందరూ సిగ్గుపడి అవమానం పొందాలి[a][b]; నాకు హాని కలగాలని కోరుకునేవారు వెనుదిరిగి అపకీర్తి పొందాలి.
  to: నా ప్రాణాన్ని అంతం చేయాలని ప్రయత్నించేవారందరూ కలిసి సిగ్గుపడి అవమానానికి గురికావాలి[a][b]; నాకు హాని కలగాలని కోరుకునేవారు వెనుదిరిగి అవమానపడాలి.
  rationale: יַחַדను ‘అందరూ కలిసి’గా స్పష్టపరచి, చివరి క్రియను ‘అవమానపడాలి’గా మార్చడం ద్వారా హీబ్రూ సమాంతర అవమాన-భావాన్ని కాపాడాం. ‘ప్రయత్నించేవారు’ అనేది ‘ప్రాణాన్ని అంతం చేయాలని వెదకేవారు’ కంటే సహజంగా ఉండి, మְבַקְשֵׁי ... לִסְפּוֹתָהּలోని హత్యాప్రయత్న ఉద్దేశాన్ని వ్యక్తం చేస్తుంది. పాదటిప్పణి ప్రత్యామ్నాయాన్ని కూడా సహజమైన తెలుగుకు సవరించాం.
