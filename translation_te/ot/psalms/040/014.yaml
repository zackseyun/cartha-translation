id: PSA.40.14
reference: Psalms 40:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יֵ֘בֹ֤שׁוּ וְ/יַחְפְּר֨וּ יַחַד֮ מְבַקְשֵׁ֥י נַפְשִׁ֗/י לִ/סְפּ֫וֹתָ֥/הּ יִסֹּ֣גוּ אָ֭חוֹר וְ/יִכָּלְמ֑וּ חֲ֝פֵצֵ֗י רָעָתִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/014.yaml
  text: Let those who seek to sweep away my life be put to shame and humiliated together[c][b][a]; let those who delight in my harm turn back and be disgraced.
translation:
  language: te
  text: నా ప్రాణాన్ని అంతం చేయాలని ప్రయత్నించేవారందరూ కలిసి సిగ్గుపడి అవమానానికి గురికావాలి[a][b]; నాకు హాని కలగాలని కోరుకునేవారు వెనుదిరిగి అవమానపడాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ప్రాణాన్ని తుడిచివేయాలని”; ఈ హీబ్రూ క్రియకు నాశనం చేయడం, పూర్తిగా అంతం చేయడం అనే భావాలు కూడా ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదానికి అక్షరార్థంగా “నా ప్రాణం/నా జీవం”; ఇక్కడ శత్రువులు కీర్తనకర్తను చంపాలని ప్రయత్నించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ וְיַחְפְּרוּ יַחַד
  choice: అందరూ సిగ్గుపడి అవమానం పొందాలి
  rationale: రెండు సమాంతర క్రియలలోని సిగ్గు, అవమానం భావాలను వేరువేరు సహజ తెలుగు పదాలతో నిలిపి, יַחַד ను సమూహార్థకమైన ‘అందరూ’గా వ్యక్తం చేసింది.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: నా ప్రాణాన్ని ... వెదకేవారు
  rationale: נפשׁ ఇక్కడ అమూర్తమైన ‘ఆత్మ’ కంటే కీర్తనకర్త ప్రాణం/జీవితాన్ని సూచిస్తుంది; ‘ప్రాణాన్ని వెదకడం’ శత్రువుల ప్రాణహరణ ఉద్దేశాన్ని నిలుపుతుంది.
- source_word: לִסְפּוֹתָהּ
  choice: అంతం చేయాలని
  rationale: ספה ఇక్కడ ప్రాణాన్ని తుదముట్టించడం లేదా నాశనం చేయడం అనే భావాన్ని ఇస్తుంది. సహజమైన తెలుగులో ఉద్దేశాన్ని స్పష్టంగా తెలిపే రూపం ఎంచుకోబడింది; పదంలోని మరింత చిత్రాత్మక ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంది.
- source_word: יִסֹּגוּ אָחוֹר
  choice: వెనుదిరిగి
  rationale: సוג మరియు אָחוֹר కలయికలోని వెనక్కి మళ్లడం లేదా తగ్గిపోవడం అనే భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: וְיִכָּלְמוּ
  choice: అపకీర్తి పొందాలి
  rationale: כלם లోని అవమానానికి గురికావడం అనే భావాన్ని మొదటి అర్ధపాదంలోని పదజాలాన్ని యాంత్రికంగా పునరావృతం చేయకుండా తెలిపింది.
- source_word: חֲפֵצֵי רָעָתִי
  choice: నాకు హాని కలగాలని కోరుకునేవారు
  rationale: חפץ కోరిక లేదా ఆనందాన్ని సూచించగలదు; רעה ఇక్కడ కీర్తనకర్తకు కలిగే హాని/విపత్తు. ఈ అనువాదం నైతిక దుష్టత్వం అనే అపార్థాన్ని నివారిస్తుంది.
theological_decisions:
- issue: נפשׁ యొక్క అర్థం
  choice: ప్రాణం
  alternative: ఆత్మ
  rationale: శత్రువులు కీర్తనకర్తను చంపాలని వెదకే సందర్భంలో נפשׁ జీవప్రాణాన్ని సూచిస్తుంది; శరీరానికి వేరైన అమూర్త ఆత్మ అనే ప్రత్యేక సిద్ధాంతార్థాన్ని పాఠ్యంలోకి చేర్చలేదు.
- issue: శాపార్థక/ఆకాంక్షార్థక క్రియారూపాలు
  choice: ‘పొందాలి’ అనే ఆకాంక్షార్థక రూపం
  alternative: భవిష్యత్ నిర్దేశంగా ‘పొందుతారు’
  rationale: హీబ్రూ సందర్భంలోని ప్రార్థనాత్మక ఆకాంక్షను లేదా విజ్ఞప్తిని నిలుపుతుంది; ఫలితం ఇప్పటికే జరిగినట్టు లేదా కేవలం అంచనాగా చూపదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనా కవిత్వానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. హీబ్రూ సమాంతర నిర్మాణం రెండు అర్ధపాదాలుగా నిలుపబడింది.
