id: PSA.40.12
reference: Psalms 40:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י אָפְפ֥וּ עָלַ֨/י רָע֡וֹת עַד אֵ֬ין מִסְפָּ֗ר הִשִּׂיג֣וּ/נִי עֲ֭וֺנֹתַ/י וְ/לֹא יָכֹ֣לְתִּי לִ/רְא֑וֹת עָצְמ֥וּ מִ/שַּֽׂעֲר֥וֹת רֹ֝אשִׁ֗/י וְ/לִבִּ֥/י עֲזָבָֽ/נִי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/012.yaml
  text: For evils beyond number have surrounded me[a]; my iniquities have overtaken me, and I am not able to see. They are more than the hairs of my head[c][b], and my heart fails me.
translation:
  language: te
  text: 'ఎందుకంటే లెక్కకు అందనన్ని కీడులు[a] నన్ను చుట్టుముట్టాయి;

    నా దోషాలు[b] నన్ను పట్టుకున్నాయి,

    నేను చూడలేకపోతున్నాను.

    అవి నా తల వెంట్రుకలకంటే ఎక్కువయ్యాయి;

    నా హృదయం నన్ను విడిచిపోయింది.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కీడులు” అనే హీబ్రూ పదానికి “కష్టాలు,” “విపత్తులు,” లేదా “హానికరమైన సంగతులు” అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “నా దోషాలు” అని అనువదించిన హీబ్రూ పదం “నా పాపాలు” లేదా “నా అపరాధభారం” అని కూడా అర్థమివ్వగలదు; అది తప్పునూ దానివల్ల కలిగే దోషభారాన్నీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “నా హృదయం నన్ను విడిచిపోయింది.” ఇది బలం లేదా ధైర్యం పూర్తిగా క్షీణించడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ప్రార్థనకు కారణాన్ని తెలిపే హేత్వర్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אָפְפוּ עָלַי
  choice: నన్ను చుట్టుముట్టాయి
  rationale: అన్ని వైపుల నుంచీ ఆవరించి చిక్కుల్లో పెట్టే మూలభాషా దృశ్యాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: רָעוֹת
  choice: కీడులు
  rationale: ఈ పదం చెడు సంగతులు, హానులు, విపత్తులు అనే విస్తృత భావాలను కలిగి ఉంటుంది; ‘కీడులు’ దానిని కేవలం కష్టాలుగా పరిమితం చేయదు.
- source_word: עַד אֵין מִסְפָּר
  choice: లెక్కకు అందనన్ని
  rationale: లెక్కించలేనంత అధిక సంఖ్యను సహజమైన, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הִשִּׂיגוּנִי
  choice: నన్ను పట్టుకున్నాయి
  rationale: వెంటాడి అందుకోవడం లేదా పట్టుకోవడం అనే క్రియలోని భావాన్ని తెలుగులో సజీవంగా వ్యక్తం చేస్తుంది.
- source_word: עֲוֹנֹתַי
  choice: నా దోషాలు
  rationale: వ్యక్తి చేసిన తప్పులతో పాటు వాటికి సంబంధించిన అపరాధభారం లేదా దోషస్థితిని కూడా సూచించగల పదాన్ని అతిగా సంకుచితం చేయకుండా ఉంచుతుంది.
- source_word: וְלֹא יָכֹלְתִּי לִרְאוֹת
  choice: నేను చూడలేకపోతున్నాను
  rationale: చూడగల సామర్థ్యం లేకపోవడాన్ని నేరుగా తెలియజేస్తూ, అది శారీరకమా లేక తీవ్రమైన కలవరానికి రూపకమా అనే సందిగ్ధతను పరిష్కరించకుండా ఉంచుతుంది.
- source_word: עָצְמוּ מִשַּׂעֲרוֹת רֹאשִׁי
  choice: అవి నా తల వెంట్రుకలకంటే ఎక్కువయ్యాయి
  rationale: సంఖ్యాపరమైన విస్తారతను సూచించే పోలికను మూలానికి దగ్గరగా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לִבִּי עֲזָבָנִי
  choice: నా హృదయం నన్ను విడిచిపోయింది
  rationale: బలం లేదా ధైర్యం క్షీణించిన భావాన్ని మోసే మూల రూపకాన్ని అర్థవివరణతో భర్తీ చేయకుండా యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: עֲוֹנֹתַי కీర్తనకర్త చేసిన పాపాలను సూచిస్తుందా, అతని అపరాధభారాన్ని సూచిస్తుందా, లేక వాటి ఫలితాలను సూచిస్తుందా?
  choice: నా దోషాలు
  alternative: నా పాపాలు; నా అపరాధభారం; నా పాపాల పర్యవసానాలు
  rationale: ప్రథమ పురుష స్వామ్యరూపం కీర్తనకర్త సొంత దోషాలను సహజంగా సూచిస్తుంది. అయితే עָוֹן తప్పు కార్యాన్నీ దాని అపరాధభారాన్నీ కలిపి సూచించగలదు. ‘దోషాలు’ బాహ్య కీడులకు తోడు అంతర్గత నైతిక బాధ్యతను నిలుపుతూ, దానిని కేవలం శ్రమగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనా కవిత్వానికి తగిన గౌరవప్రదమైన లయతో రూపొందించబడింది. పాద విభజన హీబ్రూ వాక్యంలోని భావ క్రమాన్ని స్పష్టపరుస్తుంది. ‘హృదయం నన్ను విడిచిపోయింది’ అనే మూల రూపకం ఉద్దేశపూర్వకంగా నిలుపబడింది.
