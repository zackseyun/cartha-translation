id: PSA.40.9
reference: Psalms 40:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בִּשַּׂ֤רְתִּי צֶ֨דֶק בְּ/קָ֘הָ֤ל רָ֗ב הִנֵּ֣ה שְׂ֭פָתַ/י לֹ֣א אֶכְלָ֑א יְ֝הוָ֗ה אַתָּ֥ה יָדָֽעְתָּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/009.yaml
  text: I have proclaimed righteousness in the great assembly[a]; behold, I have not restrained my lips; O Yahweh[b], you know.
translation:
  language: te
  text: 'పెద్ద సభలో నీతిని[a] ప్రకటించాను;


    ఇదిగో, నా పెదవులను నేను అరికట్టలేదు[b];


    యాహ్వే, నీకు తెలుసు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘న్యాయాన్ని.’ హెబ్రీ పదం నైతిక నీతి, న్యాయం అనే రెండు భావఛాయలనూ కలిగి ఉండగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా పెదవులను ఆపుకోలేదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשַּׂרְתִּי
  choice: ప్రకటించాను
  rationale: ఈ పియేల్ క్రియ వార్తను, తరచుగా శుభవార్తను, బహిరంగంగా తెలియజేయడాన్ని సూచిస్తుంది. ఇక్కడ ‘నీతి’ కర్మగా ఉన్నందున ‘ప్రకటించాను’ ప్రకటనాత్మక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: צֶדֶק
  choice: నీతి
  rationale: ఈ పదానికి నైతిక సదాచారం, న్యాయం అనే రెండు భావఛాయలూ ఉన్నాయి. కీర్తన సందర్భంలో ‘నీతి’ ప్రధాన భావాన్ని సహజంగా అందిస్తుంది; ‘న్యాయం’ను పాదసూచికలో ఉంచాం.
- source_word: בְּקָהָל רָב
  choice: గొప్ప సభలో
  rationale: קָהָל కూడివచ్చిన ప్రజాసమూహాన్ని లేదా సభను సూచిస్తుంది; רָב దాని విస్తారతను తెలియజేస్తుంది. ‘గొప్ప సభలో’ బహిరంగ, సామూహిక సందర్భాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: వినేవారి దృష్టిని తరువాతి మాటపై నిలిపే హెబ్రీ ఉద్ఘాటనను ‘ఇదిగో’ కవితాత్మకంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שְׂפָתַי לֹא אֶכְלָא
  choice: నా పెదవులను కట్టడి చేయలేదు
  rationale: మూలంలోని ‘పెదవులు’ అనే స్పష్టమైన కవితా చిత్రాన్ని నిలుపుతూ, మాటను నిరోధించలేదనే భావాన్ని ‘కట్టడి చేయలేదు’ తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: మూలంలో ఉన్న దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సాధారణ లిప్యంతరీకరణను వాడాం.
- source_word: יָדָעְתָּ
  choice: నీకు తెలుసు
  rationale: హెబ్రీ సంపూర్ణ క్రియ ఇక్కడ కొనసాగుతున్న జ్ఞానస్థితిని సూచిస్తుంది. ప్రత్యక్ష సంబోధనలో ‘నీకు తెలుసు’ సహజమైన ఆధునిక తెలుగు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: వచనం బిరుదును కాకుండా చతురక్షర దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల మూలంలోని వ్యక్తిగత నామాన్ని లిప్యంతరీకరించి, దానిని బిరుదుగా మార్చలేదు.
- issue: צֶדֶק పదంలోని నీతి–న్యాయం భావవిస్తృతి
  choice: ప్రధాన పాఠంలో ‘నీతి’; పాదసూచికలో ‘న్యాయం’
  alternative: ప్రధాన పాఠంలో ‘న్యాయం’
  rationale: సందర్భం దేవునికి సంబంధించిన నైతిక సద్వర్తనను సూచించగలదు, అదే సమయంలో న్యాయపరమైన భావఛాయను కూడా మోస్తుంది. ఒక భావాన్ని పూర్తిగా తొలగించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా, కీర్తనకు తగిన గౌరవప్రదమైన కవితా ధోరణిని ఉంచాం. మూలంలోని మూడు ప్రకటన విభాగాలను అర్ధవిరామాలతో నిలిపి, ‘పెదవులు’ అనే శరీరాంగ రూపకాన్ని కాపాడాం.
