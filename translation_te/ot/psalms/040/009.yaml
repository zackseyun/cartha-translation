  rationale: The revision replaces “గొప్ప” with “పెద్ద” to reflect the size of the assembly and makes the second clause explicitly first-person with a more idiomatic verb for restraining. It retains the original poetic structure, the lexical ambiguity of צֶדֶק in a footnote, and the divine name Yahweh.
  reviewer_model: gpt-5.6-terra
