source:
  edition: WLC
  text: וַ/יַּעֲלֵ֤/נִי מִ/בּ֥וֹר שָׁאוֹן֮ מִ/טִּ֪יט הַ/יָּ֫וֵ֥ן וַ/יָּ֖קֶם עַל סֶ֥לַע רַגְלַ֗/י כּוֹנֵ֥ן אֲשֻׁרָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/002.yaml
  text: He brought me up out of the pit of tumult[a], out of the miry clay; he set my feet on a rock, making my steps secure.
translation:
  language: te
  text: ఆయన కల్లోలపు గుంటలోనుండి[a], జిగట బురదలోనుండి నన్ను పైకి తీశాడు; నా పాదాలను బండమీద నిలిపి, నా అడుగులను స్థిరపరిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కోలాహలపు గుంటలోనుండి,’ ‘గర్జనల గుంటలోనుండి.’ కొన్ని అనువాదాలు దీనిని భావార్థంగా ‘నాశనపు గుంటలోనుండి’ అని ఇస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלֵנִי
  choice: నన్ను పైకి తీశాడు
  rationale: హిఫిల్ రూపంలోని ‘పైకి తీసుకురావడం’ అనే కారణార్థాన్ని, గుంటనుండి రక్షించే సజీవ చిత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מִבּוֹר
  choice: గుంటలోనుండి
  rationale: בּוֹר గుంట, నీటి తొట్టి లేదా చెరసాలవంటి లోతైన స్థలాన్ని సూచించగలదు; ఈ కవితాత్మక సందర్భంలో ‘గుంట’ విస్తృతంగా సరిపోతుంది.
- source_word: שָׁאוֹן
  choice: కల్లోలపు
  rationale: ఈ పదానికి శబ్దం, గర్జన, కోలాహలం, కల్లోలం అనే భావపరిధి ఉంది. ‘కల్లోలం’ మూలంలోని అస్థిరతను కాపాడుతూ ‘నాశనం’ అని వ్యాఖ్యానాత్మకంగా మార్చదు.
- source_word: מִטִּיט הַיָּוֵן
  choice: జిగట బురదలోనుండి
  rationale: טִיט మరియు יָוֵן కలసి చిక్కని, జారే మట్టి లేదా బురద చిత్రాన్ని బలపరుస్తాయి. తెలుగులో అనవసర పునరుక్తి లేకుండా ‘జిగట బురద’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיָּקֶם עַל סֶלַע רַגְלַי
  choice: నా పాదాలను బండమీద నిలిపి
  rationale: కారణార్థక క్రియను ‘నిలిపి’గా అనువదించడం ద్వారా అస్థిరమైన బురదకు విరుద్ధంగా బండపై స్థిరంగా నిలబడే చిత్రాన్ని కాపాడుతుంది.
- source_word: כּוֹנֵן אֲשֻׁרָי
  choice: నా అడుగులను స్థిరపరిచాడు
  rationale: כּוֹנֵן స్థిరపరచడం లేదా దృఢపరచడం అనే భావాన్ని, אֲשֻׁרָי అడుగులు అనే స్పష్టమైన చిత్రాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: రక్షణకు సంబంధించిన స్పష్టమైన కవితా చిత్రాలను నైతిక లేదా ఆధ్యాత్మిక విమోచనగా విప్పి చెప్పాలా?
  choice: గుంట, బురద, పాదాలు, బండ, అడుగులు అనే స్పష్టమైన చిత్రాలను ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘ఆయన నన్ను నాశనం నుండి రక్షించాడు’ అని భావార్థంగా అనువదించడం
  rationale: హీబ్రూ పాఠ్యం రక్షణను స్పష్టమైన భౌతిక రూపకాలతో చిత్రిస్తుంది. వాటిని అమూర్తమైన ఆధ్యాత్మిక వివరణగా మార్చకుండా మూలంలోని కవితాత్మకతను, వ్యాఖ్యాన విస్తృతిని నిలుపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తనకు తగిన గంభీర కవితా శైలిని పాటించాం. ‘పైకి తీశాడు,’ ‘బండమీద నిలిపి,’ ‘అడుగులను స్థిరపరిచాడు’ అనే వరుస మూలంలోని రక్షణ మరియు స్థిరత్వ చిత్రాలను స్పష్టంగా ఉంచుతుంది.
