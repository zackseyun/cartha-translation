source:
  edition: WLC
  text: וַ/יִּתֵּ֬ן בְּ/פִ֨/י שִׁ֥יר חָדָשׁ֮ תְּהִלָּ֪ה לֵֽ/אלֹ֫הֵ֥י/נוּ יִרְא֣וּ רַבִּ֣ים וְ/יִירָ֑אוּ וְ֝/יִבְטְח֗וּ בַּ/יהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/003.yaml
  text: He put a new song in my mouth[a], a song of praise to our God. Many will see and fear[c][b], and will trust in Yahweh.
translation:
  language: te
  text: ఆయన నా నోటిలో ఒక కొత్త పాటను—మన దేవునికి స్తుతిగీతాన్ని—ఉంచాడు. అనేకులు చూసి, భయపడి, యాహ్వేను నమ్ముకుంటారు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘భయపడి’ అని అనువదించిన హీబ్రూ పదానికి ‘భక్తిభయం కలిగి’ లేదా ‘విస్మయపడుతూ’ అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: ‘YHWH’; ఇక్కడ దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.'
    reason: divine_name
lexical_decisions:
- source_word: וַיִּתֵּן בְּפִי
  choice: ఆయన నా నోటిలో ... ఉంచాడు
  rationale: נתן సాధారణంగా ‘ఇచ్చాడు’ అని అర్థమైనా, ‘నా నోటిలో’ అనే ప్రయోగంలో ‘ఉంచాడు’ సహజంగా ఉండి మూలంలోని స్పష్టమైన శరీరచిత్రాన్ని నిలుపుతుంది.
- source_word: שִׁיר חָדָשׁ
  choice: ఒక కొత్త పాట
  rationale: విడుదల వల్ల పుట్టిన తాజా స్తుతిని సూచించే సరళమైన, ప్రత్యక్ష అనువాదం.
- source_word: תְּהִלָּה לֵאלֹהֵינוּ
  choice: మన దేవునికి స్తుతిగీతం
  rationale: ఇది ‘కొత్త పాట’కు సమానాధికార వివరణగా ఉండి, ఆ పాట స్వభావాన్ని తెలియజేస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ‘స్తుతిగీతం’ వాడబడింది.
- source_word: יִרְאוּ רַבִּים
  choice: అనేకులు దాన్ని చూసి
  rationale: יִרְאוּ అనే క్రియకు వ్యాకరణపరంగా ప్రత్యక్ష కర్మ లేకపోయినా, సందర్భంలో దేవుని కార్యం లేదా దాని ఫలితంగా వచ్చిన స్తుతి దర్శనవిషయంగా ఉంది; తెలుగులో వాక్యం సహజంగా ఉండేందుకు ‘దాన్ని’ చేర్చబడింది.
- source_word: וְיִירָאוּ
  choice: భయపడతారు
  rationale: ירא భయం, భక్తిభయం, విస్మయం అనే భావాలను మోయగలదు. ‘భయపడతారు’ మూలంలోని ధార్మిక ఉద్రిక్తతను మృదువుగా పరిష్కరించకుండా నిలుపుతుంది.
- source_word: וְיִבְטְחוּ בַּיהוָה
  choice: యెహోవాను నమ్ముకుంటారు
  rationale: בטח అంటే ఆధారపడడం లేదా నమ్మకం ఉంచడం. ‘నమ్ముకుంటారు’ తెలుగులో వ్యక్తిపై విశ్వాసపూర్వక ఆధారాన్ని సహజంగా వ్యక్తం చేస్తుంది; יהוה వ్యక్తిగత దైవనామంగా ‘యెహోవా’గా లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: וְיִירָאוּ లోని భయం/భక్తిభయం భావం
  choice: భయపడతారు
  alternative: విస్మయపడతారు; భక్తిభయం కలిగి ఉంటారు
  rationale: మూలక్రియ భయం మరియు భక్తిపూర్వక విస్మయం రెండింటినీ సూచించగలదు. ప్రధాన పాఠంలో ‘భయం’ ఉంచడం ద్వారా ఆ ద్వంద్వార్థాన్ని అతిగా మృదువుచేయకుండా, ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగా చూపించబడింది. తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపం ‘యెహోవా’; మూల ఉచ్చారణకు దగ్గరైన ‘యాహ్వే’ను పాదటిప్పణిలో ఇస్తుంది.
- issue: చూచే విషయానికి సూచన
  choice: దాన్ని
  alternative: కర్మను పేర్కొనకుండా ‘అనేకులు చూసి’
  rationale: హీబ్రూలో కర్మ స్పష్టంగా చెప్పబడలేదు; అది దేవుని రక్షణకార్యం, కొత్త పాట, లేదా సాక్ష్యమంతటినీ సూచించవచ్చు. తెలుగు సహజత్వం కోసం సర్వనామం వాడినా, దాని సూచనను ఉద్దేశపూర్వకంగా నిర్దిష్టం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కవితాత్మక శైలి. ‘నా నోటిలో’ అనే మూలచిత్రం అలాగే ఉంచబడింది. ప్రధాన పాఠంలోని ప్రతి పాదటిప్పణి సూచిక సంబంధిత పదబంధం వెంట అమర్చబడింది.
