id: PSA.40.6
reference: Psalms 40:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: זֶ֤בַח וּ/מִנְחָ֨ה לֹֽא חָפַ֗צְתָּ אָ֭זְנַיִם כָּרִ֣יתָ לִּ֑/י עוֹלָ֥ה וַ֝/חֲטָאָ֗ה לֹ֣א שָׁאָֽלְתָּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/006.yaml
  text: Sacrifice and offering you did not desire[a]; ears you have opened for me[b]; burnt offering and sin offering you did not ask for.
translation:
  language: te
  text: 'బలిని, అర్పణను[b] నీవు కోరుకోలేదు;

    నాకు చెవులు తెరిచావు[a];

    దహనబలిని, పాపబలిని

    నీవు అడగలేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: “నాకు చెవులు తవ్వావు.” ఇది వినడానికి లేదా విధేయత చూపడానికి సామర్థ్యం కలిగించడాన్ని సూచించే నుడికారం కావచ్చు. సెప్టుయజింటులో, దానిని అనుసరించిన హెబ్రీయులు 10:5లో, “నాకొక శరీరాన్ని సిద్ధం చేశావు” అని ఉంది.'
    reason: alternative_reading
  - marker: b
    text: 'మరింత నిర్దిష్టంగా: “ధాన్యార్పణ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח
  choice: బలి
  rationale: ఆరాధనా సందర్భంలోని సాధారణ బలిని సూచించే సహజమైన, స్థిరపడిన తెలుగు పదం.
- source_word: מִנְחָה
  choice: అర్పణ
  rationale: זֶבַחతో ఉన్న కవితాత్మక జతలో విస్తృత భావాన్ని సహజంగా తెలియజేస్తుంది; ప్రత్యేకంగా ధాన్యార్పణ అనే భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: חָפַצְתָּ
  choice: కోరుకోలేదు
  rationale: ఇష్టపడడం లేదా ఆనందించడం అనే ఛాయను అతిశయింపకుండా సంకల్పపూర్వకమైన కోరికను తెలియజేస్తుంది.
- source_word: אָזְנַיִם
  choice: చెవులు
  rationale: మూలంలోని ద్వివచన శరీరాంగ పదాన్ని నేరుగా నిలుపుతుంది.
- source_word: כָּרִיתָ לִּי
  choice: నాకు చెవులు తెరిచావు
  rationale: כּרה అనే క్రియ అక్షరార్థంగా ‘తవ్వడం’ అయినా, చెవులతో కలిసినప్పుడు వినేలా లేదా విధేయత చూపేలా చేయడం అనే నుడికార భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; అక్షరార్థ చిత్రాన్ని పాదసూచికలో కాపాడాం.
- source_word: עוֹלָה
  choice: దహనబలి
  rationale: పూర్తిగా దహనం చేసే బలికి స్పష్టమైన, ప్రామాణికమైన ఆరాధనా పదం.
- source_word: חֲטָאָה
  choice: పాపపరిహార బలి
  rationale: ఈ బలుల సందర్భంలో అమూర్తమైన ‘పాపం’ కాకుండా పాపానికి సంబంధించిన బలినే సూచిస్తుంది.
- source_word: שָׁאָלְתָּ
  choice: అడగలేదు
  rationale: ‘కోరలేదు’ లేదా ‘అవసరపరచలేదు’ అని బలపరచకుండా שאל యొక్క సాధారణ అర్థాన్ని, సమాంతర కవితా నిర్మాణాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘నాకు చెవులు తవ్వావు’ అనే హీబ్రూ రూపానికి, హెబ్రీయులు 10:5లోని ‘నాకొక శరీరాన్ని సిద్ధం చేశావు’ అనే గ్రీకు ఆధారిత ఉల్లేఖనానికి మధ్య సంబంధం
  choice: కీర్తన హీబ్రూ భావాన్ని ప్రధాన పాఠ్యంలో ‘నాకు చెవులు తెరిచావు’గా ఇచ్చి, అక్షరార్థమైన ‘తవ్వావు’ను మరియు గ్రీకు పాఠరూపాన్ని పాదసూచికలో పేర్కొనడం.
  alternative: ప్రధాన పాఠ్యంలో ‘నాకు చెవులు తవ్వావు’ లేదా ‘నాకొక శరీరాన్ని సిద్ధం చేశావు’ అని ఇవ్వడం.
  rationale: కీర్తనకు హీబ్రూ మూలపాఠ్యానికే ప్రాధాన్యం ఇస్తూ, తెలుగులో నుడికార భావాన్ని సహజంగా అందిస్తుంది. అదే సమయంలో సెప్టుయజింటు మరియు హెబ్రీయులు 10:5లోని భిన్న రూపాన్ని దాచకుండా పాదసూచికలో ఉంచి వేదాంతపరమైన ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కవితా శైలిని ఉపయోగించాం. పాదాల సమాంతరతను నిలుపుతూ ‘కోరుకోలేదు / అడగలేదు’ అనే వేర్వేరు క్రియలను సంరక్షించాం. మూల హీబ్రూలోని కఠినమైన చెవుల చిత్రాన్ని సహజ నుడికారంగా ప్రధాన పాఠ్యంలో ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో స్పష్టంగా ఉంచాం.
