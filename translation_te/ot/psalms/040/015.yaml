  yaml_path: translation/ot/psalms/040/015.yaml
  text: Let those who say to me[a], “Aha[b], aha!” be appalled because of their shame.
translation:
  language: te
  text: నన్ను ఉద్దేశించి, “అహా! అహా!” అని అనేవారు తమ అవమానం కారణంగా[b] దిగ్భ్రాంతి చెందుగాక.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నివ్వెరపోవుగాక,’ ‘నాశనమైపోవుగాక.’ హీబ్రూ క్రియ దిగ్భ్రాంతిని లేదా పాడైపోయిన/నాశనమైన స్థితిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘తమ అవమానపు మడమపై.’ ఈ హీబ్రూ నుడికారం ఇక్కడ కారణాన్ని లేదా పర్యవసానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֹׁמּוּ
  choice: దిగ్భ్రాంతి చెందుగాక
  rationale: שׁמם అనే క్రియ ఇక్కడ నాశనస్థితికి చేరడం లేదా భయంతో/ఆశ్చర్యంతో నివ్వెరపోవడం అనే భావాలను కలిగించగలదు. ఎగతాళి చేసేవారిపై వచ్చే తీర్పు సందర్భంలో ‘దిగ్భ్రాంతి చెందుగాక’ సహజమైన ఆధునిక తెలుగులో ఆ తీవ్రమైన కలవరాన్ని వ్యక్తం చేస్తూ మూలంలోని భావవిస్తృతిని పూర్తిగా సంకుచితం చేయదు.
- source_word: עַל עֵקֶב
  choice: కారణంగా
  rationale: ఈ హీబ్రూ పదబంధం అక్షరార్థంగా ‘మడమపై/వెనుక’ అనే చిత్రాన్ని కలిగివున్నా, ఇక్కడ కారణం లేదా పర్యవసానాన్ని సూచించే నుడికారంగా పనిచేస్తుంది. ‘కారణంగా’ సందర్భానికి సహజమైన తెలుగు.
- source_word: בָּשְׁתָּם
  choice: తమ అవమానం
  rationale: ఈ పదం సిగ్గు, అపకీర్తి, అవమానం అనే అర్థపరిధిని కలిగివుంది. ‘తమ అవమానం’ మూలానికి దగ్గరగా ఉండి బహిరంగ పరాభవ భావాన్ని నిలుపుతుంది.
- source_word: הָאֹמְרִים לִי
  choice: నాతో … అని చెప్పేవారు
  rationale: నిర్దిష్ట ఉపపదంతో కూడిన కృదంతం వ్యక్తుల సమూహాన్ని—‘చెప్పేవారు’—సూచిస్తుంది. తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా ఉద్ధరణను మధ్యలో ఉంచాం.
- source_word: הֶאָח הֶאָח
  choice: ఆహా! ఆహా!
  rationale: ఇది హానికరమైన సంతోషం, ఎగతాళి లేదా ప్రత్యర్థి కష్టాన్ని చూసి గర్వంగా పలికే ధ్వని. పునరుక్తిని నిలుపుతూ ‘ఆహా! ఆహా!’ ఆ గloating ధ్వనిని తెలుగులో సహజంగా తెలియజేస్తుంది.
