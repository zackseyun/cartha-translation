- from: నాతో, “ఆహా! ఆహా!” అని చెప్పేవారు తమ అవమానం కారణంగా[b] దిగ్భ్రాంతి చెందుగాక.[a]
  to: నన్ను ఉద్దేశించి, “అహా! అహా!” అని అనేవారు తమ అవమానం కారణంగా[b] దిగ్భ్రాంతి చెందుగాక.[a]
  rationale: The revision clarifies that the mockers address their cry at the psalmist, uses a more recognizably derisive Telugu interjection, and corrects the literal explanation of the Hebrew idiom. It preserves the draft's defensible contextual rendering of יָשֹׁמּוּ and all source-level ambiguity noted in the lexical footnote.
  reviewer_model: gpt-5.6-terra
