source:
  edition: WLC
  text: יָ֘שִׂ֤ישׂוּ וְ/יִשְׂמְח֨וּ בְּ/ךָ֗ כָּֽל מְבַ֫קְשֶׁ֥י/ךָ יֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל יְהוָ֑ה אֹֽ֝הֲבֵ֗י תְּשׁוּעָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/016.yaml
  text: Let all who seek you rejoice and be glad in you[a]; let those who love your salvation say continually[b], “May Yahweh be magnified!”
translation:
  language: te
  text: 'నిన్ను వెదికేవారందరూ నీలో ఆనందించి సంతోషించుగాక;


    నీ రక్షణను[a] ప్రేమించేవారు,


    “యాహ్వే గొప్పవాడుగా కొనియాడబడుగాక!”[b] అని ఎల్లప్పుడూ చెప్పుగాక.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ విడుదలను.” హెబ్రీ תְּשׁוּעָה అనే పదానికి “రక్షణ,” “విడుదల” అనే రెండు భావాలూ ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, “యాహ్వే గొప్పవాడగుగాక!” ఇది యాహ్వే గొప్పతనం బహిరంగంగా అంగీకరించబడాలనే స్తుతి నినాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂישׂוּ
  choice: ఆనందించుగాక
  rationale: ప్రార్థనాత్మక సందర్భంలో ఈ అసంపూర్ణ క్రియ కోరికను వ్యక్తం చేస్తుంది; ‘ఆనందించుగాక’ ఆ భావాన్ని సహజమైన తెలుగు ఆశీర్వాద రూపంలో నిలుపుతుంది.
- source_word: וְיִשְׂמְחוּ
  choice: సంతోషించుగాక
  rationale: మొదటి క్రియతో ఉన్న కవితాత్మక జోడీని, స్వల్ప పదభేదాన్ని కాపాడుతూ అందిస్తుంది.
- source_word: בְּךָ
  choice: నీలో
  rationale: ఆనందానికి దేవుడే ఆధారం, పరిధి అనే హెబ్రీ పూర్వప్రత్యయ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: כָּל מְבַקְשֶׁיךָ
  choice: నిన్ను వెదికేవారందరూ
  rationale: దేవుణ్ణి వెదకడం వారి లక్షణమని సూచించే కృదంత నిర్మాణానికి సహజమైన ఆధునిక తెలుగు.
- source_word: יֹאמְרוּ תָמִיד
  choice: ఎల్లప్పుడూ చెప్పుగాక
  rationale: నిరంతరంగా లేదా మళ్లీ మళ్లీ పలకడాన్ని సూచించే תָמִיד భావాన్ని కాపాడుతుంది; క్రియారూపం ప్రార్థనాత్మక కోరికను కొనసాగిస్తుంది.
- source_word: יִגְדַּל יְהוָה
  choice: యాహ్వే గొప్పవాడని కొనియాడబడుగాక
  rationale: ఇది కేవలం ‘యాహ్వే గొప్పవాడు’ అనే ప్రకటన కాక, ఆయన గొప్పతనం బహిరంగంగా అంగీకరించబడాలనే ఆకాంక్ష. సహజమైన తెలుగులో ఆ స్తుతి భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హెబ్రీ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֹהֲבֵי תְּשׁוּעָתֶךָ
  choice: నీ రక్షణను ప్రేమించేవారు
  rationale: దేవుని రక్షించే కార్యాన్ని ప్రేమించే ప్రజలను సూచిస్తుంది; תְּשׁוּעָהలోని విస్తృత రక్షణ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల బిరుదును పెట్టకుండా దానిని లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: תְּשׁוּעָה యొక్క భావపరిధి
  choice: రక్షణ
  alternative: విడుదల
  rationale: ఈ పదం నిర్దిష్ట అపాయం నుంచి విడుదలను, విస్తృతమైన రక్షణను రెండింటినీ సూచించగలదు. ప్రధాన పాఠంలోని ‘రక్షణ’ ఆ విస్తృతిని నిలుపుతుంది; ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
- issue: יִגְדַּל యొక్క ప్రార్థనాత్మక స్వరం
  choice: గొప్పవాడని కొనియాడబడుగాక
  alternative: యాహ్వే గొప్పవాడు
  rationale: ఈ సందర్భంలో రూపం సాధారణ వాస్తవ ప్రకటనకన్నా, యాహ్వే గొప్పతనం అంగీకరించబడాలనే కోరిక లేదా స్తుతి నినాదాన్ని వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన ప్రార్థనా-కవితా శైలి. ‘ఆనందించి సంతోషించుగాక’ అనే జోడీ మూలంలోని సమాంతర కవిత్వాన్ని నిలుపుతుంది; దైవనామం ‘యాహ్వే’గా ఉంచబడింది.
