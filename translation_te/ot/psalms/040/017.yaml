id: PSA.40.17
reference: Psalms 40:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲנִ֤י עָנִ֣י וְ/אֶבְיוֹן֮ אֲדֹנָ֪/י יַחֲשָׁ֫ב לִ֥/י עֶזְרָתִ֣/י וּ/מְפַלְטִ֣/י אַ֑תָּה אֱ֝לֹהַ֗/י אַל תְּאַחַֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/017.yaml
  text: But I am poor and needy; the Lord thinks of me. You are my help and my deliverer; my God[a], do not delay.
translation:
  language: te
  text: కాని నేను దీనుడను, అవసరంలో ఉన్నవాడను; ప్రభువు నన్ను గురించి ఆలోచిస్తాడు.[a] నీవే నాకు సహాయం, నన్ను విడిపించేవాడవు; నా దేవా, ఆలస్యం చేయకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రభువు నాపట్ల శ్రద్ధ చూపుతాడు’; లేదా ‘ప్రభువు నన్ను గురించి ఆలోచించును.’
    reason: יַחֲשָׁב לִי అనే పదబంధం ‘ఆలోచించడం’, ‘పరిగణించడం/శ్రద్ధ చూపడం’ అనే భావాలను, సందర్భానుసారంగా వర్తమాన లేదా భవిష్యత్ సూక్ష్మభేదాన్ని కలిగి ఉండవచ్చు.
lexical_decisions:
- source_word: וַאֲנִי
  choice: కాని నేను
  rationale: స్వతంత్ర సర్వనామంతో కూడిన సంధి పదం ముందటి సందర్భానికి వ్యత్యాసాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘కాని నేను’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: עָנִי וְאֶבְיוֹן
  choice: దీనుడను, అవసరంలో ఉన్నవాడను
  rationale: మొదటి పదంలోని అణగారిన లేదా దుఃఖిత స్థితినీ, రెండవ పదంలోని అవసరతనూ వేర్వేరుగా ఉంచి, ఒకే అర్థంతో రెండింటినీ చదును చేయకుండా అనువదిస్తుంది.
- source_word: אֲדֹנָי
  choice: ప్రభువు
  rationale: ఇది יהוה అనే దైవనామం కాక, ‘ప్రభువు’ అనే దైవ బిరుదు; అందువల్ల తెలుగులో సహజమైన బిరుదుగా అనువదించబడింది.
- source_word: יַחֲשָׁב לִי
  choice: నన్ను గురించి ఆలోచిస్తాడు
  rationale: חשב + ל నిర్మాణం ‘గురించి ఆలోచించు’, ‘పరిగణించు’, ‘శ్రద్ధ చూపు’ అనే భావాలను కలిగి ఉండవచ్చు. ప్రధాన పాఠం వ్యక్తిగత శ్రద్ధను సహజంగా వ్యక్తం చేస్తూ, కాలం లేదా దైవ ప్రణాళిక గురించి అవసరానికి మించిన నిర్ధారణ చేయదు.
- source_word: עֶזְרָתִי
  choice: నాకు సహాయం
  rationale: మూలంలో వ్యక్తిని సూచించే ‘సహాయకుడు’ కంటే ‘సహాయం’ అనే నామవాచకం ఉంది; తెలుగు వాక్యంలో ‘నీవే నాకు సహాయం’ కవితాత్మక సంక్షిప్తతను కాపాడుతుంది.
- source_word: וּמְפַלְטִי
  choice: నన్ను విడిపించేవాడవు
  rationale: פלט ధాతువు నుండి వచ్చిన రూపం విడిపించే లేదా రక్షిత స్థితికి చేర్చే వ్యక్తిని సూచిస్తుంది; ఈ ఎంపిక క్రియాత్మక భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: אֱלֹהַי
  choice: నా దేవా
  rationale: ప్రత్యయం ‘నా దేవుడు’ అనే సంబంధాన్ని చూపుతుంది; ఇక్కడ ప్రత్యక్ష సంబోధన కావడంతో తెలుగు సంబోధన రూపం ‘నా దేవా’ సహజమైనది.
- source_word: אַל תְּאַחַר
  choice: ఆలస్యం చేయకు
  rationale: నిషేధ ఆజ్ఞ తక్షణ సహాయం కోసం ఉన్న ఆవశ్యకతను తెలియజేస్తుంది; ఈ రూపం ఆధునిక తెలుగులో స్పష్టంగా, గంభీరంగా ఉంటుంది.
theological_decisions:
- issue: אֲדֹנָי అనే దైవ బిరుదు అనువాదం
  choice: ప్రభువు
  alternative: నా ప్రభువు
  rationale: మూలపాఠంలో יהוה కాక אֲדֹנָי ఉంది. కాబట్టి దీనిని దైవనామంగా కాక బిరుదుగా అనువదించడం మూలంలోని భేదాన్ని కాపాడుతుంది; ప్రత్యయం లేకపోవడంతో ‘నా’ను ప్రధాన పాఠంలో చేర్చలేదు.
- issue: יַחֲשָׁב לִי యొక్క భావం మరియు కాలం
  choice: ప్రభువు నన్ను గురించి ఆలోచిస్తాడు
  alternative: ప్రభువు నాపట్ల శ్రద్ధ చూపుతాడు; లేదా ప్రభువు నన్ను గురించి ఆలోచిస్తాడు/ఆలోచించును
  rationale: హీబ్రూ రూపం సందర్భంలో వర్తమాన లేదా భవిష్యత్ సూక్ష్మభేదాన్ని, అలాగే ‘ఆలోచించడం’ లేదా ‘పరిగణించడం/శ్రద్ధ చూపడం’ అనే భావపరిధిని అనుమతిస్తుంది. ప్రధాన పాఠం వ్యక్తిగత సంబంధ భావాన్ని ఉంచుతుంది; నిజమైన ప్రత్యామ్నాయాలను పాదటిప్పణిలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ప్రార్థనా-కవితా శైలిని ఉపయోగించాం. ‘దీనుడు’ అనే పదం గంభీరతను నిలుపుతుండగా, ‘అవసరంలో ఉన్నవాడు’ రెండవ హీబ్రూ పదంలోని అవసరతను స్పష్టంచేస్తుంది. మూలంలోని సంక్షిప్త సమాంతర నిర్మాణం సాధ్యమైనంతవరకు నిలుపబడింది.
