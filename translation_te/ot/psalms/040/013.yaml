  text: Be pleased[a], O Yahweh, to deliver me; O Yahweh[b], hurry to help me.
translation:
  language: te
  text: 'యాహ్వే, నన్ను విడిపించడానికి ఇష్టపడు[a];

    యాహ్వే, నాకు సహాయం చేయడానికి త్వరపడు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో, “నన్ను విడిపించడానికి సమ్మతించు” లేదా “నన్ను విడిపించడంలో సంతోషించు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నా సహాయానికి త్వరగా రా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רְצֵה
  choice: దయచేయి
  rationale: רצה ఆజ్ఞార్థక రూపం దేవుని అనుకూల సంకల్పాన్ని, సమ్మతిని కోరుతుంది. ఆధునిక తెలుగు ప్రార్థనా శైలిలో “దయచేయి” సహజంగా ఉండి ఆ వినయపూర్వక అభ్యర్థనను తెలియజేస్తుంది; మూలంలోని ‘ఇష్టపడు/సమ్మతించు’ భావవ్యాప్తిని పాదటిప్పణి స్పష్టం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ “యెహోవా”గా ఉంచాం.
- source_word: לְהַצִּילֵנִי
  choice: నన్ను విడిపించడానికి
  rationale: נצל హిఫీల్ రూపం ప్రమాదం లేదా శత్రువుల చేతిలోనుంచి రక్షించడం, విడిపించడం అనే భావం ఇస్తుంది. “విడిపించు” కీర్తనలోని సందర్భానికి సహజమైనది.
- source_word: לְעֶזְרָתִי
  choice: నాకు సహాయం చేయడానికి
  rationale: అక్షరార్థంగా ‘నా సహాయానికి’ అనే నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో “నాకు సహాయం చేయడానికి”గా వ్యక్తం చేశాం.
- source_word: חוּשָׁה
  choice: త్వరపడు
  rationale: חושׁ ఆజ్ఞార్థకం వేగంగా చర్య తీసుకోవాలనే అత్యవసరతను సూచిస్తుంది. “త్వరపడు” ఆ భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే “యెహోవా” రూపాన్ని వాడాం; “యాహ్వే” మరొక సాధ్యమైన లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనకు తగిన గౌరవప్రదమైన ఏకవచన సంబోధనను ఉపయోగించాం. వాక్యంలోని సమాంతర నిర్మాణం, రెండుసార్లు వచ్చే దైవనామం, అత్యవసర అభ్యర్థన అన్నీ నిలుపబడ్డాయి.
