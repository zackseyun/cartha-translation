    reason: alternative_reading
  revision_rationale: A small idiomatic revision makes the rendering of ‘will not withhold your compassion from me’ direct and natural in Telugu. The confident main-text reading and the viable plea-like alternative remain distinct, while all other lexical and theological choices are retained.
