id: PSA.40.11
reference: Psalms 40:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַתָּ֤ה יְהוָ֗ה לֹא תִכְלָ֣א רַחֲמֶ֣י/ךָ מִמֶּ֑/נִּי חַסְדְּ/ךָ֥ וַ֝/אֲמִתְּ/ךָ֗ תָּמִ֥יד יִצְּרֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/011.yaml
  text: You[a], O Yahweh, will not withhold your compassion from me[b]; your steadfast love and your faithfulness will continually preserve me.
translation:
  language: te
  text: యాహ్వే, నీవు నాపట్ల నీ కనికరాన్ని ఆపివేయవు[b]; నీ నిలకడైన ప్రేమ, నీ నమ్మకత్వం[a] నన్ను ఎల్లప్పుడూ కాపాడుతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ సత్యం.”
    reason: lexical_alternative
  - marker: b
    text: లేదా విజ్ఞాపనగా, “యాహ్వే, నాపట్ల నీ కనికరాన్ని ఆపివేయవద్దు.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ నామానికి సమీపమైన ఆధునిక తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: תִכְלָא
  choice: అందకుండా ఆపవు
  rationale: כלא అనే క్రియకు ఇక్కడ ‘నిలిపివేయడం, అందనివ్వకుండా చేయడం’ అనే భావం ఉంది. తెలుగు వాక్యంలో ‘కనికరాన్ని నాకు అందకుండా ఆపవు’ అనేది సహజంగా ఆ అర్థాన్ని తెలియజేస్తుంది.
- source_word: רַחֲמֶיךָ
  choice: నీ కనికరాన్ని
  rationale: హీబ్రూలో బహువచన రూపం ఉన్నప్పటికీ, అది దేవుని కరుణామయ స్వభావాన్ని సమష్టిగా సూచిస్తుంది; ఆధునిక తెలుగులో ఏకవచన భావనామమైన ‘కనికరం’ సహజంగా ఉంటుంది.
- source_word: חַסְדְּךָ
  choice: నీ నిలకడైన ప్రేమ
  rationale: חסד లోని దయ, విశ్వసనీయత, ఒడంబడిక నిబద్ధతలను ఒకే మతపరమైన సాంకేతిక పదంలో బంధించకుండా ‘నిలకడైన ప్రేమ’ సమతుల్యంగా తెలియజేస్తుంది.
- source_word: אֲמִתְּךָ
  choice: నీ నమ్మకత్వం
  rationale: חסד తో సమాంతరంగా వచ్చి కాపాడే దేవుని ఆధారపడదగిన స్వభావాన్ని సూచిస్తున్నందున ‘నమ్మకత్వం’ సందర్భానికి సరిపోతుంది; ‘సత్యం’ కూడా సాధ్యమైన అర్థం కాబట్టి పాదసూచికలో ఉంచాం.
- source_word: תָּמִיד
  choice: ఎల్లప్పుడూ
  rationale: కాపాడే కార్యం నిరంతరంగా కొనసాగుతుందనే కాలవ్యాప్త భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יִצְּרוּנִי
  choice: నన్ను కాపాడుతాయి
  rationale: נצר క్రియలోని కాపలా కాయడం, భద్రంగా ఉంచడం అనే రక్షణాత్మక భావాన్ని ‘కాపాడుతాయి’ స్పష్టంగా అందిస్తుంది. సంయుక్త కర్తలైన ప్రేమ, నమ్మకత్వానికి అనుగుణంగా బహువచన క్రియ వాడాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ప్రత్యక్షంగా ఉన్న ఒడంబడిక నామాన్ని నిలుపుతూ, దానిని సాధారణ బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- issue: אמת యొక్క సందర్భార్థం
  choice: నమ్మకత్వం
  alternative: సత్యం
  rationale: חסד తో జతగా ఉండి కీర్తనకర్తను కాపాడే దేవుని గుణాన్ని సూచించడం వల్ల సంబంధాత్మకమైన ‘నమ్మకత్వం’ ప్రధాన పాఠంలో సరిపోతుంది. పదానికి ‘సత్యం’ అనే నిజమైన ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో భద్రపరిచాం.
- issue: תִכְלָא ను నిశ్చయ వాక్యంగా లేదా విజ్ఞాపనగా గ్రహించడం
  choice: 'నిశ్చయ వాక్యం: ‘ఆపవు’'
  alternative: 'విజ్ఞాపన: ‘ఆపవద్దు’'
  rationale: రూపం ద్వితీయ పురుష ఏకవచన అసంపూర్ణ క్రియ; ఇది నమ్మకంతో చెప్పే భవిష్యత్/అసంపూర్ణ వాక్యంగా సహజంగా చదవవచ్చు. అయితే సందర్భంలో ప్రార్థనాత్మక విజ్ఞాపనగా గ్రహించే అవకాశం ఉన్నందున దానిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన ప్రార్థనా శైలిని పాటించాం. ‘నిలకడైన ప్రేమ’, ‘నమ్మకత్వం’ వంటి పదబంధాలు కవితా సమాంతరతను మరియు మూలంలోని ఒడంబడిక సంబంధ భావాన్ని నిలుపుతాయి.
