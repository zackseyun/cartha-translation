id: PSA.40.5
reference: Psalms 40:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רַבּ֤וֹת עָשִׂ֨יתָ אַתָּ֤ה יְהוָ֣ה אֱלֹהַ/י֮ נִֽפְלְאֹתֶ֥י/ךָ וּ/מַחְשְׁבֹתֶ֗י/ךָ אֵ֫לֵ֥י/נוּ אֵ֤ין עֲרֹ֬ךְ אֵלֶ֗י/ךָ אַגִּ֥ידָה וַ/אֲדַבֵּ֑רָה עָ֝צְמ֗וּ מִ/סַּפֵּֽר׀׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/005.yaml
  text: You have done many things[a], O Yahweh my God—your wonders and your plans for us; none can be compared to you. If I would declare and speak of them, they are too many to recount.
translation:
  language: te
  text: యాహ్వే, నా దేవా, నీవు ఎన్నో కార్యాలు చేశావు—నీ అద్భుతాలూ, మా పట్ల నీ ఆలోచనలూ ఎన్నెన్నో! నీకు సాటిగా ఎవరూ లేరు. నేను వాటిని ప్రకటించి చెప్పాలంటే, అవి లెక్కించలేనంతగా ఎన్నో ఉన్నాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַבּוֹת עָשִׂיתָ
  choice: నీవు ఎన్నో కార్యాలు చేశావు
  rationale: రַבּוֹת క్రియావిశేషణ భావంతో దేవుని కార్యాల విస్తార సంఖ్యను సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు అంతర్లీన కర్మను ‘కార్యాలు’గా వ్యక్తం చేశాం.
- source_word: יְהוָה אֱלֹהַי
  choice: నా దేవుడైన యెహోవా
  rationale: దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించి, אֱלֹהַי లోని వ్యక్తిగత సంబంధాన్ని ‘నా దేవుడు’గా నిలిపాం.
- source_word: נִפְלְאֹתֶיךָ
  choice: నీ అద్భుతాలు
  rationale: פלא మూలం నుంచి వచ్చిన ఈ నామవాచకం ఆశ్చర్యకరమైన దైవకార్యాలను సూచిస్తుంది; ‘అద్భుతాలు’ సంక్షిప్తంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: וּמַחְשְׁבֹתֶיךָ אֵלֵינוּ
  choice: మా పట్ల నీ ఆలోచనలు
  rationale: מַחְשָׁבוֹת అనేది ఆలోచనలు, ఉద్దేశాలు, ప్రణాళికలు అనే అర్థాలను కలిగి ఉంటుంది. మూలంలోని విస్తృతతను ప్రధాన పాఠ్యంలో ‘ఆలోచనలు’ నిలుపుతుంది; సందర్భానుకూలమైన ‘ప్రణాళికలు’ను పాదసూచికలో ఇచ్చాం.
- source_word: אֵין עֲרֹךְ אֵלֶיךָ
  choice: నీకు సాటిగా ఎవరూ లేరు
  rationale: ఈ హీబ్రూ ప్రయోగం యెహోవా అసమానత్వాన్ని తెలియజేస్తుంది. ఆధునిక తెలుగులో సహజంగా, గంభీరంగా ఉండే సమానార్థక ప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: אַגִּידָה וַאֲדַבֵּרָה
  choice: వాటిని ప్రకటించి చెప్పాలంటే
  rationale: రెండు cohortative రూపాలు తరువాతి వాక్యానికి షరతు లేదా ఊహాత్మక పూర్వపక్షంగా పనిచేస్తున్న ప్రవాహాన్ని ఈ రూపం నిలుపుతుంది.
- source_word: עָצְמוּ מִסַּפֵּר
  choice: అవి లెక్కించలేనన్ని ఉన్నాయి
  rationale: ఇక్కడ עָצְמוּ బలాన్ని కాక సంఖ్యాబాహుళ్యాన్ని సూచిస్తుంది; מִסַּפֵּרతో కలిసి ‘లెక్కకు మించినవి’ అనే భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: ప్రజల పట్ల దేవుని מַחְשָׁבוֹת యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో ‘మా పట్ల నీ ఆలోచనలు’
  alternative: ‘మా కోసం నీ ప్రణాళికలు’
  rationale: వచనం దేవుని శ్రేయోభిలాషపూర్వకమైన ఉద్దేశాన్ని తెలియజేస్తుంది గాని, నిర్దిష్టమైన విధివాద లేదా పూర్వనిర్ణయ సిద్ధాంతాన్ని వివరించదు. అందువల్ల పదంలోని సహజమైన అర్థవిస్తృతిని కాపాడాం.
- issue: אֵין עֲרֹךְ אֵלֶיךָలో పోలిక యొక్క పరిధి
  choice: ‘నీకు సాటిగా ఎవరూ లేరు’ అని దేవుని అసమానత్వంగా అనువదించడం
  alternative: ‘వాటిలో దేనినీ నీ ముందు వరుసగా వివరించలేం’ అనే కార్యాల-కేంద్రిత పఠనం
  rationale: వ్యాకరణం మరియు సాధారణ హీబ్రూ ప్రయోగం దేవునితో పోల్చదగినవారు లేరనే పఠనానికి బలంగా అనుకూలిస్తాయి; అయినా దైవకార్యాల లెక్కకు మించిన విస్తారతను తరువాతి వాక్యం ప్రత్యేకంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన కీర్తనా శైలిని ఉపయోగించాం. ‘ఎన్నెన్నో!’ అనే రూపం హీబ్రూ వాక్యంలోని ఆశ్చర్యం మరియు బాహుళ్యాన్ని సహజంగా వ్యక్తం చేస్తుంది; చివరి వాక్యంలో మూలంలోని షరతు భావాన్ని నిలిపాం.
