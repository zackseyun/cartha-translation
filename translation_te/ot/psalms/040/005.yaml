- from: నా దేవుడైన యెహోవా, నీవు ఎన్నో కార్యాలు చేశావు—నీ అద్భుతాలు, మా పట్ల నీ ఆలోచనలు[a] ఎన్నెన్నో! నీకు సాటిగా ఎవరూ లేరు. వాటిని ప్రకటించి చెప్పాలంటే, అవి లెక్కించలేనన్ని ఉన్నాయి.
  to: యాహ్వే, నా దేవా, నీవు ఎన్నో కార్యాలు చేశావు—నీ అద్భుతాలూ, మా పట్ల నీ ఆలోచనలూ ఎన్నెన్నో! నీకు సాటిగా ఎవరూ లేరు. నేను వాటిని ప్రకటించి చెప్పాలంటే, అవి లెక్కించలేనంతగా ఎన్నో ఉన్నాయి.
