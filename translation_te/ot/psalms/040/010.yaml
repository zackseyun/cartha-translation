revisions:
- from: నీ నీతిని నా హృదయంలో దాచిపెట్టలేదు[a]; నీ నమ్మకత్వాన్ని, నీ రక్షణను ప్రకటించాను[b]. మహాసభకు నీ స్థిరమైన ప్రేమను[c], నీ సత్యాన్ని మరుగుచేయలేదు[d].
  to: నీ నీతిని నా హృదయంలో దాచిపెట్టలేదు[a]; నీ విశ్వసనీయతను, నీ రక్షణను ప్రకటించాను[b]. నీ స్థిరమైన ప్రేమను[c], నీ సత్యాన్ని మహాసభ నుండి[d] దాచలేదు.
  rationale: మహాసభతో ఉన్న వాక్యసంబంధాన్ని ‘మహాసభ నుండి’గా సరిచేసి, హీబ్రూ క్రియార్థాన్ని స్పష్టమైన సహజ తెలుగు రూపంలో ఇచ్చాం. అర్థభేద అవకాశాన్ని పాదసూచికలో నిలిపాం. అలాగే దేవుని గుణాన్ని సూచించే אֱמוּנָהకు మరింత సహజమైన ‘విశ్వసనీయత’ను ఉపయోగించాం; ఇతర పదజాలం మరియు కవితా సమాంతరతను నిలిపాం.
