id: PSA.40.10
reference: Psalms 40:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: צִדְקָתְ/ךָ֬ לֹא כִסִּ֨יתִי בְּ/ת֬וֹךְ לִבִּ֗/י אֱמוּנָתְ/ךָ֣ וּ/תְשׁוּעָתְ/ךָ֣ אָמָ֑רְתִּי לֹא כִחַ֥דְתִּי חַסְדְּ/ךָ֥ וַ֝/אֲמִתְּ/ךָ֗ לְ/קָהָ֥ל רָֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/010.yaml
  text: I have not hidden your righteousness within my heart[a]; I have spoken of your faithfulness and your salvation[d][c][b]. I have not concealed your steadfast love and your truth from the great assembly.
translation:
  language: te
  text: నీ నీతిని నా హృదయంలో దాచిపెట్టలేదు[a]; నీ విశ్వసనీయతను, నీ రక్షణను ప్రకటించాను[b]. నీ స్థిరమైన ప్రేమను[c], నీ సత్యాన్ని మహాసభ నుండి[d] దాచలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీ నీతి’కు బదులుగా ‘నీ న్యాయం’ లేదా సందర్భానుసారం ‘నీవు చేసిన న్యాయకార్యం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘నీ రక్షణ’కు బదులుగా ‘నీ విడిపింపు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘నీ స్థిరమైన ప్రేమ’కు బదులుగా ‘నీ ఒడంబడిక ప్రేమ’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: ‘మహాసభ నుండి’కు బదులుగా ‘మహాసభ ఎదుట’ అని కూడా అర్థం చేసుకోవచ్చు; హీబ్రూ నిర్మాణం తాను ఎవరి నుండి దాచలేదో లేదా ఎవరి ఎదుట ప్రకటించాడో నొక్కిచెప్పవచ్చు.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: צִדְקָתְךָ
  choice: నీ నీతి
  rationale: צדקה దేవుని నైతిక నీతిని సూచించగలదు; సందర్భానుసారం న్యాయకార్యం లేదా విమోచనాత్మక న్యాయం అనే ఛాయ కూడా ఉంది. ఇతర దైవిక లక్షణాలతో ఉన్న సమాంతర నిర్మాణంలో ‘నీతి’ సహజంగా సరిపోతుంది.
- source_word: כִסִּיתִי
  choice: దాచిపెట్టలేదు
  rationale: כסה అక్షరార్థంగా ‘కప్పు’; హృదయంలో ఉంచి బయటకు చెప్పకుండా ఉండడాన్ని తెలుగులో ‘దాచిపెట్టు’ సహజంగా తెలియజేస్తుంది.
- source_word: בְּתוֹךְ לִבִּי
  choice: నా హృదయంలో
  rationale: హీబ్రూ రూపకాన్ని నిలుపుతూ, అంతరంగంలోనే ఉంచుకోవడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֱמוּנָתְךָ
  choice: నీ నమ్మకత్వం
  rationale: ఇక్కడ אֱמוּנָה విశ్వాసం పెట్టే చర్యకన్నా దేవుని విశ్వసనీయత, నిలకడను సూచిస్తుంది.
- source_word: וּתְשׁוּעָתְךָ
  choice: నీ రక్షణ
  rationale: תשועה రక్షణ, విడిపింపు, విజయాన్ని సూచించగలదు. ‘రక్షణ’ విస్తృత అర్థాన్ని నిలుపుతూ కీర్తన సందర్భానికి సరిపోతుంది.
- source_word: אָמָרְתִּי
  choice: ప్రకటించాను
  rationale: సాధారణ అర్థం ‘చెప్పాను’; ఇక్కడ దైవిక కార్యాలను బహిరంగంగా తెలియజేయడం ఉద్దేశం కావడంతో ‘ప్రకటించాను’ సహజంగా ఉంటుంది.
- source_word: כִחַדְתִּי
  choice: మరుగుచేయలేదు
  rationale: כחד దాచడం లేదా తెలియనివ్వకుండా ఉంచడం అనే భావం ఇస్తుంది. మొదటి క్రియతోని కవితా సమాంతరతను ఉంచుతూ స్వల్ప పదవైవిధ్యం కల్పిస్తుంది.
- source_word: חַסְדְּךָ
  choice: నీ స్థిరమైన ప్రేమ
  rationale: חסד ప్రేమతో పాటు నిబద్ధత, నిలకడను కలిగిన ఒడంబడిక సంబంధ గుణాన్ని సూచిస్తుంది; ‘స్థిరమైన ప్రేమ’ ఈ విస్తృతిని సాధారణ పాఠకునికి అందిస్తుంది.
- source_word: וַאֲמִתְּךָ
  choice: నీ సత్యం
  rationale: אמת సత్యం, విశ్వసనీయత అనే అర్థాలను కలిగి ఉంది. ముందున్న אֱמוּנָהను ‘నమ్మకత్వం’గా అనువదించినందున ఇక్కడ ‘సత్యం’ మూలంలోని పదభేదాన్ని నిలుపుతుంది.
- source_word: לְקָהָל רָב
  choice: మహాసభకు
  rationale: כחדతో వచ్చిన לְ ఎవరికి దాచలేదో సూచించవచ్చు; ‘మహాసభకు’ ఆ సమూహాన్ని సహజంగా సూచిస్తుంది. ‘మహాసభ ఎదుట’ అనే బహిరంగ ప్రకటన ఛాయ కూడా నిర్మాణంలో సాధ్యమే.
theological_decisions:
- issue: אֱמוּנָה మరియు אֱמֶת అనే సమీపార్థక ఒడంబడిక పదాలను వేరుగా చూపడం
  choice: ‘నమ్మకత్వం’ మరియు ‘సత్యం’గా వేరు చేయడం
  alternative: రెండింటినీ ‘నమ్మకత్వం/విశ్వసనీయత’ వంటి ఒకే భావంతో అనువదించడం
  rationale: మూలంలోని పదభేదం మరియు కవితా సమృద్ధిని నిలుపుతూ దేవుని ఆధారపడదగిన స్వభావం, సత్యత్వం రెండింటినీ వ్యక్తం చేస్తుంది.
- issue: לְקָהָל רָב యొక్క సంబంధం
  choice: దాచకపోవడానికి సంబంధించిన పరోక్ష కర్మగా ‘మహాసభకు’
  alternative: బహిరంగ ప్రకటన జరిగిన స్థలార్థంగా ‘మహాసభ ఎదుట’
  rationale: పదక్రమం, כחד క్రియతో לְ వినియోగం ‘సభకు దాచలేదు’ అనే పఠనానికి బలం ఇస్తాయి; అయితే ‘సభ ఎదుట’ అనే బహిరంగ సాక్ష్యపు ఛాయను పాదసూచికలో నిలిపాం.
- issue: హీబ్రూ సంపూర్ణ క్రియారూపాల కాలప్రయోగం
  choice: తెలుగులో సంపూర్ణ గత చర్యలుగా ‘దాచిపెట్టలేదు, ప్రకటించాను, మరుగుచేయలేదు’
  alternative: వర్తమాన సంబంధాన్ని స్పష్టంచేసే విస్తృత రూపాలు, ఉదా. ‘దాచిపెట్టకుండా ఉన్నాను’
  rationale: తెలుగులో సరళ గతరూపాలు కీర్తనకర్త ఇచ్చే పూర్తయిన సాక్ష్యాన్ని సహజంగా తెలియజేస్తాయి; అవసరానికి మించిన కాలార్థాన్ని చేర్చవు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే కీర్తనా గౌరవభావాన్ని నిలిపే శైలి. ‘హృదయం’, ‘నీతి’, ‘రక్షణ’, ‘మహాసభ’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని సహజ వాక్యనిర్మాణంతో ఉపయోగించాం.
