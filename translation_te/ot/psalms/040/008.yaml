id: PSA.40.8
reference: Psalms 40:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לַֽ/עֲשֽׂוֹת רְצוֹנְ/ךָ֣ אֱלֹהַ֣/י חָפָ֑צְתִּי וְ֝/ת֥וֹרָתְ/ךָ֗ בְּ/ת֣וֹךְ מֵעָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/008.yaml
  text: I delight to do your will[a], my God, and your law is within my inner being.
translation:
  language: te
  text: నా దేవా, నీ చిత్తాన్ని నెరవేర్చడం నాకు ఆనందం; నీ ధర్మశాస్త్రం[a] నా అంతరంగంలో ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఉపదేశం.’ హీబ్రూ పదమైన తోరా కేవలం చట్టవిధులనే కాక, దేవుని బోధను మరింత విస్తృతంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: నెరవేర్చడం
  rationale: עשה అనే క్రియకు ఇక్కడ దేవుని చిత్తాన్ని కార్యరూపంలో పెట్టడం అనే భావం ఉంది. తెలుగులో ‘చిత్తాన్ని నెరవేర్చడం’ సహజమైన సముచ్చయం.
- source_word: רְצוֹנְךָ
  choice: నీ చిత్తాన్ని
  rationale: רָצוֹן ఇక్కడ సంకల్పం, ఇష్టం అనే అర్థాన్ని ఇస్తుంది; ‘నీ చిత్తం’ ఆ భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగు వాడుకలో నిలుపుతుంది.
- source_word: אֱלֹהַי
  choice: నా దేవా
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో కూడిన ప్రత్యక్ష సంబోధనను ‘నా దేవా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חָפָצְתִּי
  choice: నాకు ఆనందం
  rationale: חפץ కేవలం కోరుకోవడమే కాక ఇష్టపడటం, ఆనందించడం అనే భావాన్ని కలిగి ఉంది. కార్యాన్ని చేయడంలో ఉన్న సంతోషపూర్వక అభిలాషను ఈ రూపం తెలియజేస్తుంది.
- source_word: וְתוֹרָתְךָ
  choice: నీ ధర్మశాస్త్రం
  rationale: תּוֹרָהకు ధర్మశాస్త్రం, ఉపదేశం అనే విస్తృత అర్థపరిధి ఉంది. ‘ధర్మశాస్త్రం’ కీర్తనలలోని నిబంధనాత్మక, లేఖనసంబంధ ప్రతిధ్వనిని నిలుపుతుంది; విస్తృత ప్రత్యామ్నాయాన్ని పాదటిప్పణి సూచిస్తుంది.
- source_word: בְּתוֹךְ
  choice: లో
  rationale: అంతర్భాగంలో ఉన్న స్థితిని తెలుగులో ‘నా అంతరంగంలో’ అనే సహజ నిర్మాణం ద్వారా వ్యక్తం చేస్తుంది.
- source_word: מֵעָי
  choice: నా అంతరంగం
  rationale: מֵעֶה అక్షరార్థంగా శరీరంలోని లోపలి భాగాలను సూచించినా, ఇక్కడ వ్యక్తి లోతైన అంతరాత్మను సూచిస్తుంది. ‘అంతరంగం’ శారీరక అపార్థం లేకుండా ఆ భావాన్ని నిలుపుతుంది; ‘హృదయం’ అనడం మూలపదాన్ని మించిన వ్యాఖ్యానం అవుతుంది.
theological_decisions:
- issue: భక్తిపూర్వక సందర్భంలో תּוֹרָה అనువాదం
  choice: ధర్మశాస్త్రం
  alternative: ఉపదేశం
  rationale: ‘ధర్మశాస్త్రం’ అనే పదం నిబంధనాత్మక, లేఖనసంబంధ భావగాంభీర్యాన్ని కాపాడుతుంది. అయితే హీబ్రూ תּוֹרָה కేవలం చట్టవిధులకే పరిమితం కాక దేవుని బోధను కూడా సూచించగలదనే విస్తృతిని పాదటిప్పణి నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే కీర్తనకు తగిన గౌరవప్రదమైన భక్తి ధోరణితో రూపొందించబడింది. ‘నా దేవా’ సంబోధనను, ‘అంతరంగం’ అనే అంతర్ముఖ భావాన్ని స్పష్టంగా నిలిపింది.
