id: PSA.53.5
reference: Psalms 53:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שָׁ֤ם פָּֽחֲדוּ פַחַד֮ לֹא הָ֪יָה֫ פָ֥חַד כִּֽי אֱלֹהִ֗ים פִּ֭זַּר עַצְמ֣וֹת חֹנָ֑/ךְ הֱ֝בִשֹׁ֗תָה כִּֽי אֱלֹהִ֥ים מְאָסָֽ/ם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/005.yaml
  text: There they were in great fear[a], where there was no fear; for God scattered the bones of the one encamping against you. You put them to shame[c][b], for God rejected them.
translation:
  language: te
  text: అక్కడ వారు భయపడాల్సినదేమీ లేకున్నా మహా భయానికి గురయ్యారు[a]; ఎందుకంటే నిన్ను ముట్టడించి శిబిరం వేసినవాడి[b] ఎముకలను దేవుడు చెదరగొట్టాడు. నీవు వారిని అవమానానికి గురిచేశావు[c], ఎందుకంటే దేవుడు వారిని తిరస్కరించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “వారు భయాన్ని భయపడ్డారు.” హీబ్రూలో ఒకే మూలానికి చెందిన క్రియను, నామవాచకాన్ని కలిపి భయ తీవ్రతను నొక్కిచెప్పారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నీ చుట్టూ శిబిరం వేసినవాడి,” “నిన్ను ముట్టడించినవాడి.” హీబ్రూ పదం అక్షరార్థంగా శిబిరం వేయడాన్ని సూచిస్తుంది; ఈ సందర్భంలో అది శత్రుత్వపూర్వకమైనది. హీబ్రూ రూపం ఏకవచనంలో ఉంది.
    reason: lexical_alternative
  - marker: c
    text: వచనం దేవుని గురించి చెప్పడం నుండి అకస్మాత్తుగా “నీవు” అని ఆయనను నేరుగా సంబోధించడానికి మారుతుంది. హీబ్రూ కవిత్వంలోని ఈ మార్పు అనువాదంలో నిలుపబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: అక్కడ
  rationale: సన్నివేశాన్ని అకస్మాత్తుగా పరిచయం చేసే స్థానవాచక క్రియావిశేషణానికి సరళమైన, సహజమైన సమానార్థకం.
- source_word: פָּחֲדוּ פַחַד
  choice: మహా భయానికి గురయ్యారు
  rationale: ఒకే మూలానికి చెందిన క్రియ–నామవాచక ప్రయోగం భయ తీవ్రతను నొక్కిచెబుతుంది; తెలుగు సహజత్వంతో ఆ ఉద్ఘాటనను నిలుపుతుంది.
- source_word: לֹא הָיָה פָחַד
  choice: భయపడాల్సినదేమీ లేకున్నా
  rationale: భయానికి నిజమైన కారణం లేదా వస్తువు లేదనే భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: פִּזַּר עַצְמוֹת
  choice: ఎముకలను ... చెదరగొట్టాడు
  rationale: פִּזַּר బలవంతంగా చెల్లాచెదురు చేయడాన్ని సూచిస్తుంది; ఓడిపోయిన శత్రువుల ఎముకల దృశ్యాన్ని నేరుగా నిలుపుతుంది.
- source_word: חֹנָךְ
  choice: నీకు వ్యతిరేకంగా శిబిరం వేసినవారి
  rationale: חנה అంటే శిబిరం వేయడం. చెదరగొట్టబడిన ఎముకలు, అవమానం అనే సందర్భం దీనికి శత్రుత్వ భావాన్ని ఇస్తుంది; తెలుగు వాక్యంలో సమూహార్థకంగా సహజంగా పలకడానికి ‘వారి’ వాడబడింది.
- source_word: הֱבִשֹׁתָה
  choice: నీవు వారిని అవమానానికి గురిచేశావు
  rationale: హిఫీల్ రూపం ‘సిగ్గుపడేలా చేయడం/అవమానానికి గురిచేయడం’ అనే causative భావాన్ని ఇస్తుంది; రెండవ పురుష ఏకవచన సంబోధనను నిలుపుతుంది.
- source_word: מְאָסָם
  choice: వారిని తిరస్కరించాడు
  rationale: מאס లోని తోసిపుచ్చడం లేదా నిరాకరించడం అనే భావాన్ని అనవసరమైన భావోద్వేగ తీవ్రత చేర్చకుండా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: వచనంలో పురుషం మరియు సంబోధితుడు మారడం
  choice: మొదట దేవుని గురించి మూడవ పురుషంలో చెప్పి, తరువాత ‘నీవు’ అని దేవునిని నేరుగా సంబోధించే మసొరెటిక్ పాఠంలోని మార్పును నిలుపడం.
  alternative: అన్ని సూచనలనూ మూడవ పురుషంలోకి మార్చి ‘దేవుడు వారిని అవమానానికి గురిచేశాడు’ అని చదవడం; లేదా ‘నీవు’ అనేది సీయోను/యెరూషలేమును సూచిస్తుందని తీసుకోవడం.
  rationale: హీబ్రూ కవిత్వంలోని ఆకస్మిక సంబోధన మార్పును సరిచేసి సమతలపరచకుండా సంరక్షిస్తుంది. వెంటనే వచ్చే ‘దేవుడు వారిని తిరస్కరించాడు’ అనే మాటల దృష్ట్యా మధ్య పాదంలో కీర్తనకర్త దేవునివైపు తిరిగి మాట్లాడడం సుసంగతమైన పఠనం.
- issue: חֹנָךְ లోని శిబిరం వేసే వ్యక్తి లేదా సమూహం యొక్క పాత్ర
  choice: శత్రుత్వ భావంతో ‘నీకు వ్యతిరేకంగా శిబిరం వేసినవారి’.
  alternative: ‘నీ చుట్టూ శిబిరం వేసినవారు’ లేదా ‘నిన్ను ముట్టడించినవారు’.
  rationale: ఎముకలను చెదరగొట్టడం, వారిని అవమానపరచడం, దేవుడు వారిని తిరస్కరించడం అనే సందర్భం తటస్థమైన లేదా రక్షణాత్మకమైన శిబిరం కంటే శత్రు మోహరింపునే సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే కీర్తనా కవిత్వానికి తగిన గంభీరతతో అనువదించబడింది. ‘భయం’ పునరుక్తి యొక్క అక్షరరూపాన్ని ప్రధాన పాఠంలో సహజీకరించి పాదటిప్పణిలో చూపించాం; ‘నీవు’ అనే సంబోధన మార్పును ఉద్దేశపూర్వకంగా నిలిపాం.
