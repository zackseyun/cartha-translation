source:
  edition: WLC
  text: כֻּלּ֥/וֹ סָג֮ יַחְדָּ֪ו נֶ֫אֱלָ֥חוּ אֵ֤ין עֹֽשֵׂה ט֑וֹב אֵ֝֗ין גַּם אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/003.yaml
  text: All of them have turned aside; together they have become corrupt; there is none who does good[a], not even one.
translation:
  language: te
  text: వారందరూ దారి తప్పారు; అందరూ కలిసి చెడిపోయారు. మేలు చేసేవారు ఎవరూ లేరు[a]—ఒక్కరూ లేరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అందరూ కలిసి కలుషితులయ్యారు.” ఈ హెబ్రీ క్రియ నైతికంగా మలినులు లేదా కలుషితులు కావడాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלּוֹ
  choice: వారంతా
  rationale: మొత్తం సమూహాన్ని సూచించే హెబ్రీ సామూహిక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: סָג
  choice: దారి తప్పారు
  rationale: సరైన మార్గం నుండి పక్కకు తొలగిపోవడం అనే రూపకాలంకార భావాన్ని, అనవసరమైన సిద్ధాంతార్థం చేర్చకుండా నిలుపుతుంది.
- source_word: יַחְדָּו
  choice: అందరూ కలిసి
  rationale: సమూహమంతటికీ వర్తించే ఉమ్మడి స్థితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: נֶאֱלָחוּ
  choice: చెడిపోయారు
  rationale: నైతికంగా కలుషితులు లేదా భ్రష్టులు కావడం అనే భావాన్ని సామాన్య పాఠకులకు సహజంగా అందిస్తుంది; ప్రత్యామ్నాయ భౌతిక-కలుష భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: אֵין
  choice: ఎవడూ లేడు
  rationale: ఒక్క వ్యక్తి కూడా లేడనే సంపూర్ణ నిరాకరణను గంభీరంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עֹשֵׂה
  choice: చేసేవాడు
  rationale: హెబ్రీ కృదంతంలోని లక్షణాత్మక లేదా నిరంతర కార్య భావాన్ని తెలుగు సంబంధార్థక రూపంలో సహజంగా అందిస్తుంది.
- source_word: טוֹב
  choice: మేలు
  rationale: విస్తృత నైతిక మంచితనాన్ని ‘మేలు చేయడం’ అనే సహజ తెలుగు ప్రయోగంతో తెలియజేస్తుంది.
- source_word: גַּם אֶחָד
  choice: ఒక్కడు కూడా
  rationale: ముందున్న నిరాకరణను బలపరుస్తూ, ‘ఒక్క వ్యక్తి సైతం కాదు’ అనే హెబ్రీ ఉద్ఘాటనను నిలుపుతుంది.
theological_decisions:
- issue: కీర్తనలోని నైతిక భ్రష్టత్వ ఆరోపణ పరిధి
  choice: ‘వారంతా... ఎవడూ లేడు... ఒక్కడు కూడా లేడు’ అనే సమగ్ర భాషను యథాతథంగా నిలుపడం.
  alternative: ఈ మాటలను సందర్భంలోని దుష్కార్యులు అనే పరిమిత వర్గానికి మాత్రమే వర్తింపజేయడం.
  rationale: హెబ్రీ వాక్యం సమగ్ర పదాలను ఉపయోగిస్తుంది. అందువల్ల దాని విశ్వవ్యాప్త ధ్వనిని నిలుపుతూ, ఈ వచనం స్వయంగా చెప్పని విస్తృత సిద్ధాంత వ్యవస్థను అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనా కవిత్వానికి తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదజాలం. సమాంతర నిర్మాణం మరియు చివరి ఉద్ఘాటన నిలుపబడ్డాయి.
