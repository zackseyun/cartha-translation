source:
  edition: WLC
  text: הֲ/לֹ֥א יָדְעוּ֮ פֹּ֤עֲלֵ֫י אָ֥וֶן אֹכְלֵ֣י עַ֭מִּ/י אָ֣כְלוּ לֶ֑חֶם אֱ֝לֹהִ֗ים לֹ֣א קָרָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/004.yaml
  text: Do not the workers of wickedness know—those who eat up my people as they eat bread? They do not call on God[a][b][c].
translation:
  language: te
  text: దుష్టకార్యాలు చేసేవారికి[a] తెలియదా? వారు నా ప్రజలను[c] రొట్టె తిన్నట్టే తినివేస్తారు[b]; దేవునికి మొరపెట్టరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దుష్టత్వాన్ని చేసేవారు.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నా ప్రజలను తినేవారు; వారు రొట్టె తింటారు.’ దేవుని ప్రజలను సాధారణ ఆహారంలా సులభంగా తినివేస్తున్నారనేది భావం.
    reason: lexical_alternative
  - marker: c
    text: ‘నా ప్రజలు’ అని దేవుడు మాట్లాడుతున్నట్లుగానైనా, కీర్తనకర్త మాట్లాడుతున్నట్లుగానైనా అర్థం చేసుకోవచ్చు; ఇక్కడ మాట్లాడుతున్న వ్యక్తిని హీబ్రూ పాఠం స్పష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא יָדְעוּ
  choice: తెలియదా?
  rationale: ప్రశ్నకు అవుననే జవాబు ఆశించే హీబ్రూ అలంకారప్రశ్నను సహజమైన ఆధునిక తెలుగు రూపంలో నిలుపుతుంది. సందర్భంలోని సాధారణ స్వభావవర్ణనకు వర్తమానార్థం సరిపోతుంది.
- source_word: פֹּעֲלֵי אָוֶן
  choice: దుష్టకార్యాలు చేసేవారు
  rationale: ‘చెడు/దుష్టత్వాన్ని కార్యరూపంలో చేసేవారు’ అనే నిర్మాణాత్మక భావాన్ని నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: אֹכְלֵי עַמִּי
  choice: నా ప్రజలను ... తినివేస్తారు
  rationale: పీడించి నాశనం చేయడాన్ని సూచించే తినడం అనే హీబ్రూ రూపకాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אָכְלוּ לֶחֶם
  choice: రొట్టె తిన్నట్లుగా
  rationale: హీబ్రూలో పక్కపక్కన ఉన్న ‘నా ప్రజలను తినడం’ మరియు ‘రొట్టె తినడం’ మధ్య ఉద్దేశిత పోలికను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֱלֹהִים לֹא קָרָאוּ
  choice: దేవునికి మొరపెట్టరు
  rationale: ఇక్కడ קרא అనేది దేవుణ్ణి సహాయం లేదా ఆరాధన కోసం పిలవడం అనే భావంలో ఉంది; ‘మొరపెట్టు’ ఆ అర్థాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ‘నా ప్రజలు’ అనే మాటలో మాట్లాడుతున్న వ్యక్తి ఎవరు?
  choice: మాట్లాడుతున్నది దేవుడా, కీర్తనకర్తా అని నిర్దిష్టం చేయకుండా ‘నా ప్రజలు’ అని ఉంచడం
  alternative: దీనిని దేవుని ప్రత్యక్ష మాటగా లేదా నీతిమంతుల తరఫున కీర్తనకర్త చెప్పిన మాటగా స్పష్టీకరించడం
  rationale: హీబ్రూలో ప్రథమ పురుష ఏకవచన ప్రత్యయం ఉన్నప్పటికీ, ఈ పాదంలో మాట్లాడుతున్న వ్యక్తిని స్పష్టంగా గుర్తించలేదు. అందువల్ల మూలపాఠంలోని సందిగ్ధతను అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. హీబ్రూలోని అలంకారప్రశ్న, తినడం అనే బలమైన రూపకం, ‘నా ప్రజలు’లోని వక్త-సందిగ్ధత నిలుపబడ్డాయి.
