source:
  edition: WLC
  text: אָ֘מַ֤ר נָבָ֣ל בְּ֭/לִבּ/וֹ אֵ֣ין אֱלֹהִ֑ים הִֽ֝שְׁחִ֗יתוּ וְ/הִֽתְעִ֥יבוּ עָ֝֗וֶל אֵ֣ין עֹֽשֵׂה טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/001.yaml
  text: The fool says in his heart[a], “There is no God.” They are corrupt; they commit abominable injustice; there is no one who does good.
translation:
  language: te
  text: మూర్ఖుడు తన హృదయంలో, “దేవుడు లేడు” అని అంటాడు. వారు చెడిపోయారు; అసహ్యకరమైన అన్యాయం చేశారు[a]; మంచి చేసేవాడు ఒక్కడూ లేడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అసహ్యమైన తప్పు చేశారు’; లేదా ‘తమ క్రియలను అసహ్యకరంగా చేసుకున్నారు.’ హీబ్రూలో అసహ్యాన్ని తెలిపే క్రియతో ‘తప్పు/అన్యాయం’ అనే నామవాచకం కలిసివున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָל
  choice: మూర్ఖుడు
  rationale: ఇది కేవలం తెలివిలేనివాడిని కాక, నైతిక వివేకం లేని దేవభక్తిహీనుడిని సూచిస్తుంది. ‘మూర్ఖుడు’ అనే పదం కీర్తనలోని నైతిక భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: בְּלִבּוֹ
  choice: తన హృదయంలో
  rationale: హీబ్రూ నుడికారం అంతరంగ ఆలోచనను, మనోవైఖరిని సూచిస్తుంది. మూలంలోని హృదయరూపకాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: אֵין אֱלֹהִים
  choice: దేవుడు లేడు
  rationale: ఇశ్రాయేలు విశ్వాస సందర్భంలో ఇది దేవుని ఉనికిని నిరాకరించే స్పష్టమైన వాక్యం.
- source_word: הִשְׁחִיתוּ
  choice: వారు చెడిపోయారు
  rationale: ఏకవచనంలోని ప్రతినిధి మూర్ఖుని నుంచి బహువచనంలోని ఆ వర్గమంతటికి మారే మూల వాక్య నిర్మాణాన్ని ఇది నిలుపుతుంది; ఫలితంగా ఏర్పడిన నైతిక భ్రష్టత్వాన్ని తెలియజేస్తుంది.
- source_word: וְהִתְעִיבוּ עָוֶל
  choice: అసహ్యకరమైన అన్యాయం చేశారు
  rationale: అసహ్యంగా ప్రవర్తించడాన్ని తెలిపే క్రియను, తప్పు లేదా అన్యాయం అనే నామవాచకంతో హీబ్రూ కలుపుతుంది. ఈ అనువాదం ఆ రెండింటినీ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: మంచి చేసేవాడు ఒక్కడూ లేడు
  rationale: మంచి చేసేవారి సంపూర్ణ లేమిని చెప్పే హీబ్రూ కృదంత నిర్మాణాన్ని సహజమైన, బలమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ప్రతినిధి ఏకవచనం నుంచి బహువచన క్రియలకు మార్పు
  choice: మొదటి వాక్యంలో ‘మూర్ఖుడు’ అనే ఏకవచనాన్ని, తరువాత ‘వారు’ అనే బహువచనాన్ని నిలుపడం
  alternative: వాక్యమంతటినీ ఏకవచనంగా లేదా బహువచనంగా మార్చడం
  rationale: హీబ్రూ వాక్యం ప్రతినిధి మూర్ఖుని నుంచి అలాంటి వారందరి వర్గానికి ఉద్దేశపూర్వకంగా విస్తరిస్తుంది; దాన్ని సమరీకరించకుండా మూలంలోని వాక్చాతుర్యాన్ని నిలిపాం.
- issue: ప్రతినిధి ఏకవచనంలోని లింగరూపం
  choice: ‘తన హృదయంలో’ అని అనువదించడం
  alternative: ‘వారి హృదయంలో’ లేదా ‘హృదయంలో’ అని సాధారణీకరించడం
  rationale: తెలుగులో ‘తన’ సందర్భానుసార ప్రతిబింబ సర్వనామం కావడంతో మూలంలోని ఏకవచన సంబంధాన్ని సహజంగా నిలుపుతుంది; అనవసరంగా బహువచనంగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కీర్తనా శైలిని ఉపయోగించాం. మూలంలోని ఏకవచనం నుంచి బహువచనానికి మార్పును నిలిపాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘అసహ్యకరమైన అన్యాయం చేశారు’ అనే పదబంధం వద్ద ఉంచాం.
