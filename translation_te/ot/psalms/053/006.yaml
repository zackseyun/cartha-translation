revisions:
- from: సీయోనులోనుంచి ఇశ్రాయేలుకు రక్షణ వస్తే ఎంత బాగుంటుంది! దేవుడు తన ప్రజల దుస్థితిని తొలగించి వారిని పునరుద్ధరించినప్పుడు[a], యాకోబు ఉల్లసించుగాక; ఇశ్రాయేలు సంతోషించుగాక.
  to: సీయోను నుండి ఇశ్రాయేలుకు రక్షణ వస్తే ఎంత బాగుంటుంది! దేవుడు తన ప్రజల క్షేమస్థితిని పునరుద్ధరించినప్పుడు[a], యాకోబు ఉల్లసించుగాక; ఇశ్రాయేలు సంతోషించుగాక.
