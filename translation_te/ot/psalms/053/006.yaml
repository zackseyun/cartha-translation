id: PSA.53.6
reference: Psalms 53:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִ֥י יִתֵּ֣ן מִ/צִּיּוֹן֮ יְשֻׁע֪וֹת יִשְׂרָ֫אֵ֥ל בְּ/שׁ֣וּב אֱ֭לֹהִים שְׁב֣וּת עַמּ֑/וֹ יָגֵ֥ל יַ֝עֲקֹ֗ב יִשְׂמַ֥ח יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/006.yaml
  text: Oh[a], that the salvation of Israel would come out of Zion! When God restores the fortunes of his people, let Jacob rejoice; let Israel be glad.
translation:
  language: te
  text: సీయోను నుండి ఇశ్రాయేలుకు రక్షణ వస్తే ఎంత బాగుంటుంది! దేవుడు తన ప్రజల క్షేమస్థితిని పునరుద్ధరించినప్పుడు[a], యాకోబు ఉల్లసించుగాక; ఇశ్రాయేలు సంతోషించుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుడు తన ప్రజలను చెరనుంచి తిరిగి రప్పించినప్పుడు,’ లేదా ‘దేవుడు చెరలో ఉన్న తన ప్రజలను పునరుద్ధరించినప్పుడు.’ హెబ్రీ నుడికారం సాధారణంగా దుస్థితి నుంచి పునరుద్ధరణను సూచించగలదు; అనేక సందర్భాల్లో చెరనుంచి తిరిగి రావడం కూడా అందులో ఉంటుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: వస్తే ఎంత బాగుంటుంది
  rationale: ఈ హెబ్రీ నుడికారం అక్షరార్థమైన ప్రశ్న కాకుండా గాఢమైన కోరికను వ్యక్తం చేస్తుంది. ఆధునిక తెలుగులో ఈ రూపం సహజంగా ఆ ఆకాంక్షను తెలియజేస్తుంది.
- source_word: מִצִּיּוֹן
  choice: సీయోనులోనుంచి
  rationale: מִן మూలాన్ని లేదా బయలుదేరే స్థానాన్ని సూచిస్తుంది; ‘లోనుంచి’ రక్షణ అక్కడి నుంచి వెలువడే భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: יְשֻׁעוֹת
  choice: రక్షణ
  rationale: రూపపరంగా బహువచనమైనా, ఇక్కడ ఇది సంపూర్ణ విమోచనను సూచించే భావవాచక లేదా తీవ్రతా బహువచనంగా పనిచేస్తుంది; తెలుగులో ఏకవచనం సహజం.
- source_word: בְּשׁוּב אֱלֹהִים שְׁבוּת עַמּוֹ
  choice: దేవుడు తన ప్రజల దుస్థితిని తొలగించి వారిని పునరుద్ధరించినప్పుడు
  rationale: בְּ + క్రియానామ రూపం కాలసంబంధమైన ‘అప్పుడు’ భావాన్ని ఇస్తుంది. שׁוּב שְׁבוּת అనే నుడికారం చెరనుంచి తిరిగి రావడాన్ని కలుపుకోగలిగినా, సాధారణంగా దుస్థితిని తారుమారు చేసి పునరుద్ధరించడాన్ని కూడా సూచిస్తుంది.
- source_word: יָגֵל
  choice: ఉల్లసించుగాక
  rationale: ప్రారంభంలోని ఆకాంక్షాభావానికి అనుగుణంగా ఈ yiqtol రూపాన్ని ఆశీర్వచనాత్మక కోరికగా అనువదించాం.
- source_word: יִשְׂמַח
  choice: సంతోషించుగాక
  rationale: యాకోబు–ఇశ్రాయేలు సమాంతర నిర్మాణాన్ని, అలాగే రెండు హెబ్రీ క్రియల మధ్య ఉన్న స్వల్ప పదభేదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: שׁוּב שְׁבוּת అనే పునరుద్ధరణ నుడికారపు అర్థం
  choice: తన ప్రజల దుస్థితిని తొలగించి వారిని పునరుద్ధరించినప్పుడు
  alternative: తన ప్రజలను చెరనుంచి తిరిగి రప్పించినప్పుడు
  rationale: ఈ నుడికారం కొన్ని సందర్భాల్లో నిజమైన చెరనుంచి తిరిగి రావడాన్ని సూచించినా, విస్తృతంగా దుస్థితి మారి క్షేమం పునరుద్ధరించబడటాన్నీ సూచిస్తుంది. ప్రధాన పాఠం విస్తృత భావాన్ని ఇస్తూ, చెర సంబంధమైన సాధ్యార్థాన్ని పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యనిర్మాణాన్ని ఉపయోగించాం. ‘ఉల్లసించుగాక/సంతోషించుగాక’ అనే రూపాలు కీర్తనలోని ప్రార్థనాత్మక, కావ్యాత్మక స్వరాన్ని గౌరవప్రదంగా నిలుపుతాయి; మిగిలిన పదజాలం సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ఉంచాం.
