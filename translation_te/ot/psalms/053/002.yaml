  variant: modern standard Telugu
source:
  edition: WLC
  text: אֱֽלֹהִ֗ים מִ/שָּׁמַיִם֮ הִשְׁקִ֪יף עַֽל בְּנֵ֫י אָדָ֥ם לִ֭/רְאוֹת הֲ/יֵ֣שׁ מַשְׂכִּ֑יל דֹּ֝רֵ֗שׁ אֶת אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/002.yaml
  text: God looks down from heaven on the children of man to see whether there is anyone who has understanding[a], who seeks God.
translation:
  language: te
  text: 'దేవుడు ఆకాశం నుండి కిందికి, మానవుల[a] వైపు చూస్తున్నాడు—

    వివేకం గలవాడు,

    దేవుణ్ణి వెదికేవాడు

    ఎవరైనా ఉన్నాడో లేదో చూడటానికి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో “మానవుని కుమారులు” అనే సమష్టి ప్రయోగం; అంటే మానవులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: సందర్భంలో ఈ రూపం ఇశ్రాయేలు దేవుణ్ణి ఏకవచనంగా సూచిస్తుంది; అందువల్ల సహజమైన తెలుగు ఏకవచన రూపం వాడబడింది.
- source_word: מִשָּׁמַיִם
  choice: ఆకాశం నుండి
  rationale: హీబ్రూలో రూపం బహువచనమైనా ఈ సందర్భంలో దేవుని ఉన్నత నివాసస్థానాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఆకాశం నుండి’ సహజంగా ఉంది.
- source_word: הִשְׁקִיף
  choice: కిందికి చూసి
  rationale: పై నుండి క్రింద ఉన్నవారిని పరిశీలిస్తూ చూడడం అనే దృశ్యాన్ని నిలుపుతుంది.
- source_word: בְּנֵי אָדָם
  choice: మానవుల వైపు
  rationale: ఈ హీబ్రూ సమష్టి నానుడి మానవజాతిలోని మనుషులందరినీ సూచిస్తుంది. తెలుగులో అక్షరార్థమైన ‘ఆదాము కుమారులు’ అనవసరంగా వంశార్థాన్ని కలిగించవచ్చు; ‘మానవులు’ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לִרְאוֹת
  choice: అని చూస్తున్నాడు
  rationale: దేవుడు కిందికి చూడడానికి గల ఉద్దేశాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: הֲיֵשׁ
  choice: ఎవరైనా ఉన్నాడా
  rationale: అటువంటి వ్యక్తి ఉన్నాడా అనే ప్రశ్నార్థక-అస్తిత్వ నిర్మాణాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: מַשְׂכִּיל
  choice: వివేకం గలవాడు
  rationale: కేవలం తెలివికంటే నైతిక-ఆధ్యాత్మిక అవగాహనను సూచించే పదంగా ‘వివేకం’ మూలంలోని విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: דֹּרֵשׁ
  choice: వెదికేవాడు
  rationale: దేవుని కోసం అన్వేషించే నిరంతర స్వభావాన్ని వర్తమాన కృదంత రూపంలో తెలియజేస్తుంది.
- source_word: אֶת אֱלֹהִים
  choice: దేవుణ్ణి
  rationale: ప్రత్యక్ష కర్మగా ఉన్న ‘దేవుడు’ అనే పదాన్ని తెలుగు విభక్తితో సహజంగా అనువదించింది.
theological_decisions:
- issue: בְּנֵי אָדָם అనే సమష్టి నానుడి అనువాదం
  choice: మానవులు
  alternative: ఆదాము కుమారులు / మనుష్యుల కుమారులు
  rationale: ఈ నానుడి మానవులను సమష్టిగా సూచిస్తుంది. అక్షరానువాదం తెలుగులో పురుష సంతానాన్ని మాత్రమే లేదా ఆదాము వంశాన్ని ప్రత్యేకంగా సూచిస్తున్నట్టు అపార్థం కలిగించవచ్చు; ‘మానవులు’ లింగపరంగా సరియైన సమష్టి అర్థాన్ని అందిస్తుంది.
- issue: מַשְׂכִּיל యొక్క భావపరిధి
  choice: వివేకం గలవాడు
  alternative: జ్ఞాని / జ్ఞానంతో ప్రవర్తించేవాడు
  rationale: మూలపదం అవగాహనతో పాటు వివేకపూర్వక ప్రవర్తనను కూడా సూచించగలదు. ఒకే పార్శ్వానికి పరిమితం చేయకుండా ‘వివేకం గలవాడు’ ఆ భావ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గంభీరతతో, సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం. సమాంతర హీబ్రూ కవితా నిర్మాణాన్ని పాద విభజనతో నిలిపింది.
