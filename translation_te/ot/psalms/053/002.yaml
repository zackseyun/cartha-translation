    text: హీబ్రూలో “మానవుని కుమారులు” అనే సమష్టి ప్రయోగం; అంటే మానవులు.
    reason: lexical_alternative
  revision_rationale: The revision makes the two participial descriptions modify the same potential person, preserves the purpose clause (“to see whether”), and supplies the lexical footnote anchor corresponding to the English POB audit trail. No theological interpretation has been added.
