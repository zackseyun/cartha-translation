source:
  edition: WLC
  text: לַ/מְנַצֵּ֥חַ עַֽל מָחֲלַ֗ת מַשְׂכִּ֥יל לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/000.yaml
  text: 'For the choir director: according to Mahalath[a]. A Maskil[b] of David[c].'
translation:
  language: te
  text: 'సంగీత నాయకునికి: మహలత్ ప్రకారం[a]. మస్కీల్[b], దావీదుకు చెందినది[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మహలత్’ బహుశా ఒక రాగనామం లేదా సంగీత/ఆరాధనా సాంకేతిక పదం కావచ్చు; దాని అర్థం అనిశ్చితం.
    reason: lexical_alternative
  - marker: b
    text: ‘మస్కీల్’ కీర్తనల శీర్షికల్లో కనిపించే సాంకేతిక పదం; ఇది బోధాత్మకమైన లేదా ధ్యానాత్మకమైన రచనను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హెబ్రీలోని ‘లెదావీద్’ (לְדָוִד) రచయితత్వాన్ని, అనుబంధాన్ని, అంకితాన్ని లేదా సంకలన సంబంధాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకునికి
  rationale: కీర్తనల శీర్షికల్లో సంగీత ప్రదర్శనను పర్యవేక్షించే వ్యక్తిని సూచించే సాంప్రదాయిక పదం. ఆధునిక తెలుగులో సహజంగా ఉండేలా, గాయకబృందానికే పరిమితం చేయకుండా మూలంలోని కార్యార్థాన్ని నిలుపుతుంది.
- source_word: עַל
  choice: ప్రకారం
  rationale: సంగీత శీర్షికల్లో ఇది రాగం, శైలి లేదా ప్రదర్శన సూచనను పరిచయం చేయవచ్చు. ‘ప్రకారం’ అనే అనువాదం ఖచ్చితమైన సాంకేతిక భావాన్ని నిర్ణయించకుండా ఆ సంబంధాన్ని నిలుపుతుంది.
- source_word: מָחֲלַת
  choice: మహలత్
  rationale: దీని సూచన అనిశ్చితం; ఇది రాగనామం లేదా సంగీత/ఆరాధనా సాంకేతిక పదం కావచ్చు. ఊహాత్మక భావానువాదం చేయకుండా లిప్యంతరీకరించడం సముచితం.
- source_word: מַשְׂכִּיל
  choice: మస్కీల్
  rationale: కీర్తన శీర్షికల్లోని ఈ సాంకేతిక పదం ఖచ్చితంగా ఏమి సూచిస్తుందో వివాదాస్పదం. ‘బోధాత్మక కీర్తన’ లేదా ‘ధ్యానగీతం’ అని నిర్దిష్టంగా చెప్పకుండా లిప్యంతరీకరణ మూలంలోని అనిశ్చితిని కాపాడుతుంది.
- source_word: לְדָוִד
  choice: దావీదుకు చెందిన
  rationale: లְ ఉపసర్గ రచయితను, అనుబంధాన్ని, అంకితాన్ని లేదా సంకలన సంబంధాన్ని సూచించవచ్చు. ‘దావీదుకు చెందిన’ అనేది ‘దావీదు రచించిన’ కంటే తక్కువ నిర్ణయాత్మకంగా ఉండి మూలంలోని విస్తృత సంబంధార్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: శీర్షిక స్వభావం మరియు దావీదు సంబంధం
  choice: శీర్షికను వచనంలో భాగంగా అనువదించి, לְדָוִד లోని సంబంధార్థాన్ని ‘దావీదుకు చెందిన’గా ఉంచడం.
  alternative: ‘దావీదు రచించినది’ అని స్పష్టమైన రచయితత్వంగా అనువదించడం లేదా శీర్షికను సంపాదకీయ అంశంగా భావించి అనువదించకపోవడం.
  rationale: హెబ్రీ పాఠ్యంలో శీర్షిక వచనంలో భాగంగా ఉంది. לְדָוִד తప్పనిసరిగా రచయితత్వాన్ని మాత్రమే నిర్దేశించదు; అందువల్ల అనుబంధం, అంకితం లేదా సంకలన సంబంధానికి ఉన్న అవకాశాన్ని మూసివేయకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన కీర్తన శీర్షిక. అనిశ్చిత సంగీత పదాలను లిప్యంతరీకరించి పాదటిప్పణుల్లో వివరించాం. ప్రతి పాదటిప్పణి సూచికను అది వివరించే పదబంధం పక్కనే ఉంచాం.
