  text: You crown the year with your goodness[b][a], and your paths drip with abundance.
translation:
  language: te
  text: నీ మంచితనమనే కిరీటంతో సంవత్సరాన్ని అలంకరిస్తావు; నీ బాటలు[a] సమృద్ధితో[b] కారుతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ జాడలు.’ హీబ్రూ పదం బాటలు, జాడలు లేదా చక్రపు జాడలను సూచించవచ్చు; దేవుని సాగింపు వెనుక సారవంతత మిగిలిపోతున్న చిత్రాన్ని ఇది సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘సమృద్ధి’కి వాడిన హీబ్రూ పదానికి అక్షరార్థం ‘కొవ్వుదనం’ లేదా ‘సమృద్ధమైన సారం’; ఇక్కడ అది గొప్ప సారవంతతను, పుష్కలమైన ఫలసమృద్ధిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִטַּרְתָּ
  choice: కిరీటం పెడతావు
  rationale: ‘కిరీటం పెట్టడం, చుట్టుముట్టడం, అలంకరించడం’ అనే అర్థాలున్న హీబ్రూ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: שְׁנַת טוֹבָתֶךָ
  choice: నీ మంచితనంతో సంవత్సరానికి
  rationale: నిర్మాణాన్ని ‘నీ మంచితనంతో సంవత్సరానికి కిరీటం పెడతావు’గా గ్రహించడం సందర్భానికి సరిపోతుంది; טוֹבָהలోని మంచితనం, మేలు, సమృద్ధి అనే విస్తృత భావాన్ని ‘మంచితనం’ నిలుపుతుంది.
- source_word: וּמַעְגָּלֶיךָ
  choice: నీ అడుగుజాడలు
  rationale: מַעְגָּלִים దారులు, బాటలు, చక్రపు జాడలు అనే భావాలను ఇవ్వగలదు. దేవుని గమనం వెనుక సారవంతమైన సమృద్ధి మిగిలే కవితాత్మక చిత్రాన్ని ‘అడుగుజాడలు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: יִרְעֲפוּן
  choice: కురిపిస్తాయి
  rationale: ఈ క్రియకు చిందించడం, బొట్లుగా కారడం, కురిపించడం అనే భావాలున్నాయి. తెలుగులో ‘సమృద్ధిని కురిపిస్తాయి’ సహజంగా ఉండి వ్యవసాయ ఆశీర్వాద చిత్రాన్ని నిలుపుతుంది.
- source_word: דָּשֶׁן
  choice: సమృద్ధి
  rationale: అక్షరార్థంగా ‘కొవ్వుదనం’; సందర్భంలో నేల సారవంతత, పుష్కలమైన పంట, సమృద్ధమైన పోషణను సూచిస్తుంది. ‘సమృద్ధి’ ఆధునిక పాఠకులకు అపార్థం లేకుండా మూల భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: వ్యవసాయ ఆశీర్వాద రూపకాన్ని వ్యాఖ్యానంగా మార్చకుండా నిలుపడం
  choice: దేవుడు సంవత్సరానికి కిరీటం పెట్టడం, ఆయన అడుగుజాడలు సమృద్ధిని కురిపించడం అనే రూపకాలను ఉంచడం
  alternative: దేవుడు పంటకాలాన్ని విస్తారంగా ఆశీర్వదిస్తాడని వివరణాత్మకంగా అనువదించడం
  rationale: మూలపాఠం దేవుని మేలుచేసే కార్యాన్ని సజీవమైన కవితా చిత్రాలతో తెలియజేస్తుంది. వాటిని నిలపడం వచనంలోని కవిత్వాన్నీ, వ్యవసాయ సమృద్ధిని దేవునికి ఆపాదించే భావాన్నీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనా కవిత్వానికి తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. మూలంలోని రూపకాలు నిలుపబడ్డాయి; ‘అడుగుజాడలు’ ప్రధాన పాఠంలో సహజమైన కవితా రూపంగా, ‘బాటలు/చక్రపు జాడలు’ పాదటిప్పణిలో ప్రత్యామ్నాయంగా ఇవ్వబడ్డాయి.
