  text: אַשְׁרֵ֤י תִּֽבְחַ֣ר וּ/תְקָרֵב֮ יִשְׁכֹּ֪ן חֲצֵ֫רֶ֥י/ךָ נִ֭שְׂבְּעָה בְּ/ט֣וּב בֵּיתֶ֑/ךָ קְ֝דֹ֗שׁ הֵיכָלֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/004.yaml
  text: Blessed is the one you choose and bring near to dwell in your courts[a]; we will be satisfied with the goodness of your house[b], the holiness of your temple.
translation:
  language: te
  text: 'నీ ప్రాంగణాల్లో నివసించడానికి

    నీవు ఎన్నుకొని నీ దగ్గరికి చేర్చుకునే వ్యక్తి ధన్యుడు[a]!


    నీ మందిరంలోని మేలుతో[b],

    నీ ఆలయ పవిత్రతతో మేము తృప్తి చెందుతాం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు ఎన్నుకొని నీ దగ్గరికి చేర్చుకునే వ్యక్తి ఎంత ధన్యుడు! అతడు నీ ప్రాంగణాల్లో నివసిస్తాడు.”
    reason: lexical_alternative
  - marker: b
    text: “మేలు” అనే పదాన్ని “మంచివాటితో” లేదా “సమృద్ధితో” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: ధన్యుడు
  rationale: ఈ బహువచన రూపంలోని ఆశీర్వచన ఉద్ఘాటనను ఆధునిక ప్రామాణిక తెలుగులో సహజమైన బైబిలు శైలితో వ్యక్తపరుస్తుంది; కేవలం మానసిక సంతోషాన్ని సూచించే పదాన్ని నివారిస్తుంది.
- source_word: תִּבְחַר
  choice: నీవు ఎన్నుకొని
  rationale: దేవుని చొరవను స్పష్టంగా ఉంచుతూ, తరువాతి సిద్ధాంతపరమైన సాంకేతిక పదజాలాన్ని పాఠ్యంలోకి చేర్చకుండా בחר యొక్క సాధారణ అర్థాన్ని ఇస్తుంది.
- source_word: וּתְקָרֵב
  choice: నీ దగ్గరికి చేర్చుకునే
  rationale: קרב హిఫీల్ రూపంలోని కారణార్థాన్ని—దేవుడే ఆ వ్యక్తిని సమీపానికి తీసుకురావడాన్ని—సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יִשְׁכֹּן
  choice: నివసించడానికి
  rationale: రూపరీత్యా మూడవ పురుష ఏకవచన అసంపూర్ణ క్రియ అయినప్పటికీ, ముందున్న ఎన్నుకోవడం మరియు దగ్గరికి చేర్చుకోవడం యొక్క ఉద్దేశం లేదా ఫలితాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; ప్రత్యామ్నాయ వాక్యనిర్మాణం పాదసూచికలో ఇవ్వబడింది.
- source_word: חֲצֵרֶיךָ
  choice: నీ ఆవరణాల్లో
  rationale: ఆరాధనాస్థలపు బయటి ప్రాంగణాలను సూచించే חצר యొక్క బహువచనాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: נִשְׂבְּעָה
  choice: మేము తృప్తి చెందుతాం
  rationale: ఈ cohortative రూపంలో ఉన్న నమ్మకపూర్వక నిరీక్షణ లేదా సంకల్ప భావాన్ని సహజమైన భవిష్యత్ ప్రకటనగా అందిస్తుంది.
- source_word: בְּטוּב
  choice: మేలుతో
  rationale: טוּב లోని గుణాత్మకమైన ‘మంచితనం’ భావాన్నీ, అనుగ్రహంగా లభించే ‘మంచివాటిని/సమృద్ధిని’ సూచించే భావాన్నీ ఒక మేరకు తెరిచి ఉంచుతుంది.
- source_word: בֵּיתֶךָ
  choice: నీ మందిరంలోని
  rationale: ‘నీ ఆలయం’తో ఉన్న సమాంతరత కారణంగా בית ఇక్కడ దేవుని ఆరాధనాస్థలాన్ని సూచిస్తుంది; ‘మందిరం’ ఆ సందర్భాన్ని స్పష్టంగా చేస్తుంది.
- source_word: קְדֹשׁ
  choice: పవిత్రతతో
  rationale: ఆలయపు పరిశుద్ధ స్వభావాన్ని సూచించే భావాన్ని నామవాచక రూపంలో అందిస్తుంది; హెబ్రీ వాక్యనిర్మాణంలోని సంక్షిప్తతను తెలుగులో అర్థవంతంగా చేస్తుంది.
- source_word: הֵיכָלֶךָ
  choice: నీ ఆలయ
  rationale: ఆరాధనా సందర్భం, అలాగే ‘మందిరం’ మరియు ‘ఆవరణాలు’తో ఉన్న సంబంధం వల్ల היכל కు ఇక్కడ ‘ఆలయం’ సరైన అర్థం; ‘రాజభవనం’ కాదు.
theological_decisions:
- issue: ఆరాధనలో దేవుని ఎంపిక మరియు సమీపానికి చేర్చడం
  choice: దేవుడే వ్యక్తిని ఎన్నుకొని తన దగ్గరికి చేర్చుకుంటాడనే సూటి భాషను నిలిపి ఉంచడం
  alternative: దీనిని నిర్దిష్ట పూర్వనిర్ణయ సిద్ధాంతంగా వివరించడం, లేదా కేవలం యాజక సంబంధమైన నియామకంగా పరిమితం చేయడం
  rationale: దేవుని సన్నిధికి ప్రవేశంలో చొరవ దేవునిదేనని హెబ్రీ పాఠ్యం చెబుతుంది; అయితే ఆ ఎంపిక యొక్క పరిధి లేదా సిద్ధాంత వ్యవస్థను ఈ వచనం స్వయంగా నిర్ణయించదు.
- issue: ఆలయ ప్రవేశానికి సంబంధించిన దృశ్యభాష
  choice: ఆవరణాలు, మందిరం, ఆలయం అనే నిర్దిష్ట ఆరాధనాస్థల పదాలను ఉంచడం
  alternative: వాటన్నిటినీ ‘సన్నిధి’ వంటి ఆధ్యాత్మిక రూపకాలతో మార్చడం
  rationale: వచనం ఇశ్రాయేలు ఆలయ ఆరాధనా సందర్భంలో నిలిచివుంది. నిర్దిష్ట స్థల దృశ్యాన్ని ఉంచడం వల్ల అన్వయాన్ని అనువాదంలోనే ముందుగా నిర్ణయించకుండా ఉంటాం.
- issue: קְדֹשׁ הֵיכָלֶךָ యొక్క సంబంధం
  choice: ‘నీ ఆలయ పవిత్రతతో’ అని, קדש ను ఆలయపు పవిత్ర స్వభావంగా గ్రహించడం
  alternative: ‘నీ ఆలయంలోని పవిత్ర స్థలంతో’ లేదా ‘నీ పవిత్ర ఆలయంతో’
  rationale: హెబ్రీలోని సంక్షిప్త అనుబంధ నిర్మాణం పలు విధాలుగా అర్థమవుతుంది. ప్రధాన పాఠ్యం ఆంగ్ల పరిశీలనా పొరలోని భావాన్ని అనుసరించినా, దేవాలయ పవిత్రతను మాత్రమే చెబుతుంది; ప్రత్యేక అంతర్గర్భ స్థలాన్ని అనవసరంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కీర్తనాశైలిని వాడాం. దేవునితో ప్రత్యక్ష సంభాషణ కావడంతో ఏకవచన ‘నీవు/నీ’ రూపాలను నిలిపాం. పాద విభజన కవితా సమాంతరతను స్పష్టపరుస్తుంది.
