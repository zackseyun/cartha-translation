id: PSA.65.1
reference: Psalms 65:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לְ/ךָ֤ דֻֽמִיָּ֬ה תְהִלָּ֓ה אֱלֹ֘הִ֥ים בְּ/צִיּ֑וֹן וּ֝/לְ/ךָ֗ יְשֻׁלַּם נֶֽדֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/001.yaml
  text: To you[a], silence is praise, O God, in Zion, and to you a vow will be paid.
translation:
  language: te
  text: దేవా, సీయోనులో మౌనమే నీకు స్తుతి[a]; నీకు మొక్కుబడి చెల్లించబడుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవా, సీయోనులో స్తుతి నీకోసం మౌనంగా వేచియున్నది”; లేదా, “దేవా, సీయోనులో మౌన స్తుతి నీకే చెందుతుంది.” హీబ్రూ పదబంధం క్రియ లేకుండా సంక్షిప్తంగా ఉంది; అందువల్ల దాన్ని ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: דֻמִיָּה
  choice: మౌనం
  rationale: ఈ నామవాచకానికి సాధారణంగా ‘మౌనం’ లేదా ‘నిశ్శబ్దం’ అనే అర్థం. కవితాత్మకమైన సంక్షిప్త వాక్యంలోని వైచిత్ర్యాన్ని వ్యాఖ్యానాత్మకంగా సులభీకరించకుండా ‘మౌనం’ నేరుగా నిలుపుతుంది.
- source_word: תְהִלָּה
  choice: స్తుతి
  rationale: దీని సాధారణ అర్థం ‘స్తుతి’. తెలుగులో దేవునికి అర్పించే ప్రశంసను సహజంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: לְךָ דֻמִיָּה תְהִלָּה
  choice: మౌనమే నీకు స్తుతి
  rationale: హీబ్రూ వాక్యంలో క్రియ స్పష్టంగా లేదు. రెండు నామవాచకాలను నిలుపుతూ, మౌనమే స్తుతిగా ఉందనే కవితాత్మక విరోధాభాసాన్ని ఈ రూపం కాపాడుతుంది; మూలంలో లేని ‘వేచియున్నది’ వంటి క్రియను చేర్చదు.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ఇక్కడ ఈ రూపం ఇశ్రాయేలు యొక్క ఏకైక దేవుణ్ణి సంబోధిస్తోంది. సంబోధన రూపమైన ‘దేవా’ తెలుగు వాక్యంలో సహజంగా ఉంటుంది.
- source_word: בְּצִיּוֹן
  choice: సీయోనులో
  rationale: בְּ యొక్క స్థానార్థాన్ని ‘లో’ నేరుగా తెలియజేస్తుంది. ‘సీయోను’ స్థలనామానికి ఆధునిక ప్రామాణిక తెలుగు విభక్తి రూపం వాడబడింది.
- source_word: יְשֻׁלַּם
  choice: చెల్లించబడుతుంది
  rationale: שלם ధాతువు పుయల్ రూపం మొక్కుబడిని తీర్చడం లేదా చెల్లించడం అనే భావాన్ని ఇస్తుంది. కర్మణి రూపం హీబ్రూ వ్యాకరణ రూపాన్నీ, వాగ్దానం చేసినదాన్ని దేవునికి అర్పించే భావాన్నీ నిలుపుతుంది.
- source_word: נֶדֶר
  choice: మొక్కుబడి
  rationale: దేవునికి చేసుకున్న ప్రతిజ్ఞ లేదా దాని నెరవేర్పును తెలుగులో ‘మొక్కుబడి’ సహజంగా తెలియజేస్తుంది; కేవలం కానుకకే అర్థాన్ని పరిమితం చేయదు.
theological_decisions:
- issue: לְךָ דֻמִיָּה תְהִלָּה అనే క్రియలేని, సంక్షిప్త పదబంధం యొక్క అర్థం
  choice: మౌనమే దేవునికి స్తుతిగా సమర్పించబడుతున్నట్లు ప్రధాన పాఠంలో ఉంచడం.
  alternative: ‘దేవా, సీయోనులో స్తుతి నీకోసం మౌనంగా వేచియున్నది’ లేదా ‘దేవా, సీయోనులో మౌన స్తుతి నీకే చెందుతుంది.’
  rationale: మూల హీబ్రూలో స్పష్టమైన క్రియ లేకపోవడం వల్ల ఒకటి కంటే ఎక్కువ నిర్మాణాలు సాధ్యమే. ప్రధాన రూపం ఆ కవితాత్మక ఉద్వేగాన్ని నిలుపుతుంది; ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చి నిజమైన సందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక శైలి. ‘మౌనమే నీకు స్తుతి’ అనే అసాధారణ నిర్మాణం మూలంలోని ఉద్దేశపూర్వక వైచిత్ర్యాన్ని నిలుపుతుంది. ‘మొక్కుబడి’ సాధారణ పాఠకులకు అర్థమయ్యే భక్తి సంబంధ పదంగా ఎంపికైంది.
