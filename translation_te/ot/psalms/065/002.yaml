  source_fidelity: హీబ్రూ సంబోధనాత్మక కర్తరి రూపం שֹׁמֵעַను ‘ఆలకించేవాడా’ సరిగ్గా ప్రతిబింబిస్తుంది. תְּפִלָּה యొక్క సాధారణ/సమష్టి భావం ‘ప్రార్థనను’లో నిలిచింది. עָדֶיךָకు ‘నీ దగ్గరకు,’ యָבֹאוּకు ‘వస్తారు’ సరైన, సహజమైన అనువాదాలు. כָּל־בָּשָׂר యొక్క విశ్వవ్యాప్త మానవ సూచనను ‘మనుషులందరూ’ స్పష్టంగా అందిస్తుంది.
