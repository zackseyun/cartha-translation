id: PSA.65.2
reference: Psalms 65:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שֹׁמֵ֥עַ תְּפִלָּ֑ה עָ֝דֶ֗י/ךָ כָּל בָּשָׂ֥ר יָבֹֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/002.yaml
  text: O you who hear prayer[a], to you all flesh will come.
translation:
  language: te
  text: 'ప్రార్థనను ఆలకించేవాడా,

    మనుషులందరూ[a] నీ దగ్గరకు వస్తారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘సర్వ శరీరం’; ఇది మనుషులందరినీ లేదా మానవాళి మొత్తాన్ని సూచించే కవితా వ్యక్తీకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמֵעַ
  choice: ఆలకించేవాడా
  rationale: שׁמע అనే క్రియ యొక్క కర్తరి వర్తమానార్థక రూపం ఇక్కడ దేవుణ్ణి సంబోధించే నామవాచక ప్రయోగంగా ఉంది. ‘ఆలకించేవాడా’ అనేది ఆ సంబోధనను సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: תְּפִלָּה
  choice: ప్రార్థనను
  rationale: ఏదో ఒక నిర్దిష్ట ప్రార్థనను కాకుండా ప్రార్థన అనే వర్గాన్ని సమిష్టిగా సూచించే ఏకవచన ప్రయోగం. తెలుగులో ‘ప్రార్థనను’ ఈ సాధారణ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עָדֶיךָ
  choice: నీ దగ్గరకు
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న עַד ఇక్కడ సంబోధితుని వైపు కదలికను సూచిస్తుంది. తరువాతి రాక అనే క్రియతో ‘నీ దగ్గరకు’ సహజమైన తెలుగు ప్రయోగం.
- source_word: כָּל־בָּשָׂר
  choice: మనుషులందరూ
  rationale: అక్షరార్థంగా ‘సర్వ శరీరం’ అయిన ఈ హీబ్రూ కవితా నుడికారం మానవాళి మొత్తాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో ఆధునిక పాఠకులకు స్పష్టంగా ఉండేందుకు ‘మనుషులందరూ’ అని ఇచ్చి, మూలంలోని రూపకాన్ని పాదసూచికలో నిలిపాం.
- source_word: יָבֹאוּ
  choice: వస్తారు
  rationale: మూడవ పురుష బహువచన అసంపూర్ణ క్రియారూపం భవిష్యత్తు లేదా ఇంకా పూర్తికాని చర్యను సూచిస్తుంది. తెలుగు సందర్భంలో ‘వస్తారు’ సహజంగానే భవిష్యదర్థాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: כָּל־בָּשָׂר యొక్క పరిధి
  choice: మానవాళి మొత్తాన్ని సూచించే ‘మనుషులందరూ’
  alternative: ‘సర్వ శరీరులు’ లేదా ‘మానవాళి అంతా’
  rationale: ఈ పదబంధం దేవుని దగ్గరకు ప్రార్థనలో లేదా ఆరాధనలో వచ్చే మానవాళిని విస్తృతంగా సూచిస్తుంది. ‘మనుషులందరూ’ దాని సార్వత్రిక పరిధిని సంకుచితం చేయకుండా ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; అక్షర రూపాన్ని పాదసూచిక భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ కీర్తనా కవిత్వానికి తగిన గౌరవప్రదమైన సంబోధనను వాడాం. ‘ఆలకించేవాడా’ మూలంలోని సంబోధనాత్మక కర్తరి రూపాన్ని నిలుపుతుంది; ‘మనుషులందరూ’ అరుదైన అక్షరానువాదం వల్ల కలిగే అస్పష్టతను నివారిస్తుంది.
