id: PSA.65.8
reference: Psalms 65:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּ֤ירְא֨וּ יֹשְׁבֵ֣י קְ֭צָוֺת מֵ/אוֹתֹתֶ֑י/ךָ מ֤וֹצָֽאֵי בֹ֖קֶר וָ/עֶ֣רֶב תַּרְנִֽין׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/008.yaml
  text: Those who dwell at the ends of the earth fear because of your signs[b][a]; you make the dawn and the evening shout for joy.
translation:
  language: te
  text: భూమి అంచుల్లో నివసించేవారు నీ సూచనలవల్ల భయపడతారు[a]; వేకువను, సాయంకాలాన్ని నీవు ఆనందధ్వని చేయిస్తావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ సూచనలవల్ల భక్తిపూర్వక విస్మయంతో నిలుస్తారు.’ హీబ్రూ క్రియ భయం, భీతి, లేదా భక్తిపూర్వక విస్మయాన్ని వ్యక్తం చేయగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఉదయం, సాయంత్రం వెలువడుటలు’ లేదా ‘ఉదయం, సాయంత్రం బయలుదేరే చోట్లను.’ ఈ కవితాత్మక పదబంధం వేకువ, సంధ్య వెలిసే వేళలను లేదా అవి వెలువడుతున్నట్లుగా కనిపించే దిక్కులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: భయపడతారు
  rationale: ירא అనే క్రియ భయం, దిగులు, లేదా భక్తితో కూడిన విస్మయాన్ని సూచించగలదు. ‘భయపడతారు’ ఈ విస్తృత భావాన్ని అనవసరంగా ఒకే దిశలో పరిమితం చేయదు.
- source_word: יֹשְׁבֵי קְצָוֺת
  choice: భూమి అంచుల్లో నివసించేవారు
  rationale: ‘అంచుల్లో నివసించేవారు’ అనే మూలరూపాన్ని నిలుపుతూ, కీర్తనలోని విశ్వవ్యాప్త భావానికి అనుగుణంగా సహజమైన తెలుగులో ‘భూమి’ని స్పష్టంచేస్తుంది.
- source_word: מֵאוֹתֹתֶיךָ
  choice: నీ సూచకకార్యాలను బట్టి
  rationale: భయాన్ని కలిగించే కారణాన్ని מִן సూచిస్తుంది. אוֹתֹתֶיךָ దేవుని శక్తిని తెలియజేసే కార్యాలను సూచిస్తున్నందున ‘సూచకకార్యాలు’ అనేది కేవలం గుర్తులకన్నా సందర్భానికి స్పష్టమైనది; ‘అద్భుతాలు’ అన్నంత వ్యాఖ్యానాత్మకమూ కాదు.
- source_word: מוֹצָאֵי בֹקֶר וָעֶרֶב
  choice: ఉదయం, సాయంత్రం వెలిసే వేళలను
  rationale: מוֹצָאֵי అక్షరార్థంగా ‘బయలుదేరుటలు/వెలువడుటలు’. ఉదయసంధ్యల ఆవిర్భావాన్ని సూచించే కవితాత్మక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: תַּרְנִין
  choice: నీవు ఆనందంతో కేకలు వేయిస్తావు
  rationale: רנן హిఫీల్ రూపం ఆనందధ్వని చేయించడాన్ని సూచిస్తుంది. దేవుడే కర్త అనే వ్యాకరణాన్ని, అలాగే మూలంలోని ఉత్సాహభరితమైన వ్యక్తీకరణను ఇది నిలుపుతుంది.
theological_decisions:
- issue: దేవుని సూచకకార్యాలకు మానవుల ప్రతిస్పందన స్వభావం
  choice: ‘భయపడతారు’ అని విస్తృతార్థంతో అనువదించడం
  alternative: ‘భక్తిభయంతో విస్మయపడతారు’ లేదా ‘భీతిల్లుతారు’
  rationale: హీబ్రూ క్రియ భయాన్నీ భక్తిపూర్వక విస్మయాన్నీ సూచించగలదు. సందర్భం అనుమతించే ఈ భావ ఉద్రిక్తతను అనువాదం ఒకే అర్థానికి పరిమితం చేయదు.
- issue: ఉదయం, సాయంత్రం ఆనందధ్వని చేయడం
  choice: కాలసంధులను వ్యక్తులుగా చిత్రించే కవితాత్మక రూపాన్ని నిలుపడం
  alternative: తూర్పు పడమర ప్రాంతాల ప్రజలు ఆనందిస్తారని భౌగోళికంగా వివరించడం
  rationale: מוֹצָאֵי భౌగోళిక అంచులను సూచించే అవకాశం ఉన్నా, ఉదయసంధ్యల వెలుగుదలను వ్యక్తీకరించే పఠనం సహజంగా ఉంది. అసలు కవితాత్మక వ్యక్తీకరణను వ్యాఖ్యానాత్మకంగా మానవ సమూహాలుగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని ఉపయోగించాం. ‘సూచకకార్యాలు’ దేవుని శక్తిని తెలియజేసే signs అనే భావాన్ని స్పష్టపరుస్తుంది. ‘ఆనందంతో కేకలు వేయిస్తావు’ మూలంలోని causative రూపాన్నీ సజీవ వ్యక్తీకరణనూ నిలుపుతుంది.
