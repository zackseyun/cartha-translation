- from: భూమి అంచుల్లో నివసించేవారు నీ సూచకకార్యాలను బట్టి భయపడతారు[a]; ఉదయం, సాయంత్రం వెలిసే వేళలను నీవు ఆనందంతో కేకలు వేయిస్తావు[b].
  to: భూమి అంచుల్లో నివసించేవారు నీ సూచనలవల్ల భయపడతారు[a]; వేకువను, సాయంకాలాన్ని నీవు ఆనందధ్వని చేయిస్తావు[b].
  rationale: సవరణలు మూల హీబ్రూ పదాల అర్థపరిధిని మరింత దగ్గరగా కాపాడుతూ ఆధునిక, సహజమైన తెలుగు కీర్తనా-శైలిని ఇస్తాయి. భయానికి సంబంధించిన ఉద్దేశపూర్వక అస్పష్టతను నిలుపుకున్నాం; ఉదయసాయంకాలాల కవితాత్మక వ్యక్తీకరణను మానవ సమూహాలుగా వ్యాఖ్యానించలేదు. పాదటిప్పణి గుర్తులు వాటి సంబంధిత పదబంధాల వద్దనే ఉన్నాయి.
