  yaml_path: translation/ot/psalms/065/012.yaml
  text: The pastures of the wilderness drip[b][a], and the hills gird themselves with rejoicing.
translation:
  language: te
  text: అరణ్యపు పచ్చికబయళ్లు తేమను చిందిస్తాయి[a]; కొండలు ఆనందాన్ని నడికట్టుగా ధరించుకుంటాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తేమతో నిండిపొర్లుతాయి’; హీబ్రూ క్రియ బిందువులుగా కారడాన్ని లేదా సమృద్ధిగా ప్రవహించడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘కొండలు ఆనందంతో నడికట్టు కట్టుకుంటాయి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְעֲפוּ
  choice: తేమను చిందిస్తాయి
  rationale: రָעַף అనే క్రియలో బిందువులుగా కారడం, కురవడం లేదా సమృద్ధిగా ప్రవహించడం అనే కవితాత్మక భావం ఉంది. తెలుగు వాక్యంలో సహజంగా ఉండేందుకు అంతర్లీనంగా ఉన్న తేమను స్పష్టం చేస్తూ, దృశ్యరూపకాన్ని నిలిపింది.
- source_word: נְאוֹת
  choice: పచ్చికబయళ్లు
  rationale: నָוֶה ఇక్కడ పశువులు మేసే పచ్చిక ప్రదేశాలను సూచిస్తుంది. అరణ్యంతో పాటు వచ్చే సస్యసమృద్ధి దృశ్యానికి ‘పచ్చికబయళ్లు’ సహజంగా సరిపోతుంది.
- source_word: מִדְבָּר
  choice: అరణ్యం
  rationale: מִדְבָּר అనేది సాగుచేయని అడవి లేదా బీడు మైదాన ప్రాంతాన్ని సూచించగలదు. ‘అరణ్యం’ ఇక్కడ ఇసుక ఎడారి అనే అతి సంకుచిత భావాన్ని రానివ్వదు.
- source_word: גִיל
  choice: ఆనందం
  rationale: גִיל ఉప్పొంగే సంతోషాన్ని సూచిస్తుంది. కొండలు దానిని కట్టుకున్నట్లుగా వ్యక్తీకరించే కవితా రూపకంలో ‘ఆనందం’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: גְּבָעוֹת
  choice: కొండలు
  rationale: భూదృశ్యంలోని ఎత్తైన చిన్న కొండలను సూచించే సూటి, సాధారణ తెలుగు పదం.
- source_word: תַּחְגֹּרְנָה
  choice: నడికట్టుగా కట్టుకుంటాయి
  rationale: חָגַר యొక్క ప్రాథమిక భావం నడుముకు కట్టుకోవడం. ‘ధరిస్తాయి’ అని సాధారణీకరించకుండా, హీబ్రూ కవితలోని నడికట్టు రూపకాన్ని ఈ అనువాదం నిలుపుతుంది.
