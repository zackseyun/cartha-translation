translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కవితా శైలి. హీబ్రూ మూలంలోని సజీవీకరణ, సమాంతర నిర్మాణం, ఉల్లాసభరిత ముగింపు నిలుపబడ్డాయి.
