source:
  edition: WLC
  text: לָבְשׁ֬וּ כָרִ֨ים הַ/צֹּ֗אן וַ/עֲמָקִ֥ים יַֽעַטְפוּ בָ֑ר יִ֝תְרוֹעֲע֗וּ אַף יָשִֽׁירוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/013.yaml
  text: The pastures are clothed with flocks[a], and the valleys wrap themselves in grain; they shout for joy, yes[b], they sing.
translation:
  language: te
  text: పచ్చికబయళ్లు మందలతో కప్పబడ్డాయి[a]; లోయలు ధాన్యంతో కప్పుకొన్నాయి. అవి ఆనందంగా హర్షధ్వానాలు చేస్తాయి; అవును, పాడుతాయి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పచ్చిక మైదానాలు మందలతో కప్పబడ్డాయి.” ఈ సందర్భంలో హీబ్రూ నామవాచకం పచ్చికబయళ్లను లేదా పచ్చిక మైదానాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ కవిత భూదృశ్యాన్ని సజీవంగా చిత్రిస్తుంది: “లోయలు ధాన్యంతో కప్పుకొన్నాయి.”'
    reason: cultural_note
lexical_decisions:
- source_word: לָבְשׁוּ
  choice: వస్త్రంలా ధరించాయి
  rationale: ‘ధరించు/వస్త్రం వేసుకొను’ అనే మూలరూపకాన్ని తెలుగులో సహజంగా నిలుపుతుంది; భూభాగాన్ని సజీవంగా చిత్రించే కవితాత్మక వ్యక్తీకరణను కాపాడుతుంది.
- source_word: כָרִים
  choice: పచ్చికబయళ్లు
  rationale: ఇక్కడ ‘మంద’తోనూ, సమాంతరంగా ఉన్న ‘లోయలు’తోనూ కలిపి చూస్తే ఇది పొట్టేళ్లను కాక పశువులు మేసే పచ్చిక నేలను సూచిస్తుంది.
- source_word: הַצֹּאן
  choice: మందలను
  rationale: గొర్రెలు, మేకలు వంటి చిన్న పశువుల సమూహాన్ని సూచించే హీబ్రూ సమష్టివాచక భావాన్ని సహజమైన తెలుగు బహువచనం అందిస్తుంది.
- source_word: וַעֲמָקִים
  choice: లోయలు
  rationale: భూదృశ్యాన్ని సూచించే బహువచనానికి నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: יַעַטְפוּ
  choice: కప్పుకున్నాయి
  rationale: ‘చుట్టుకొను/కప్పుకొను’ అనే క్రియలోని క్రియాశీల వ్యక్తీకరణను నిలిపి, లోయలను సజీవీకరించే కవితా రూపకాన్ని కాపాడుతుంది.
- source_word: בָר
  choice: ధాన్యాన్ని
  rationale: ఒక నిర్దిష్ట పంటకు పరిమితం చేయకుండా సాధారణ ధాన్య ఉత్పత్తిని సూచిస్తుంది.
- source_word: יִתְרוֹעֲעוּ
  choice: ఆనందంతో కేకలు వేస్తున్నాయి
  rationale: ఈ స్తుతిగీత సందర్భంలో క్రియ సూచించే ఉల్లాసభరితమైన ఘోషను స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַף
  choice: అంతేకాదు
  rationale: ముందటి మాటకు కేవలం మరో చర్యను జోడించకుండా, దానిని బలపరుస్తూ తరువాతి సమాంతర వాక్యానికి తీసుకెళ్తుంది.
- source_word: יָשִׁירוּ
  choice: పాటలు పాడుతున్నాయి
  rationale: ‘పాడు’ అనే సాధారణ క్రియను సహజమైన తెలుగులో అందించి, ఆనందఘోషతో ఉన్న కవితాత్మక సమాంతరతను నిలుపుతుంది.
