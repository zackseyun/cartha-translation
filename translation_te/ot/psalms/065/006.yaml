  yaml_path: translation/ot/psalms/065/006.yaml
  text: who establishes the mountains by his power[a], being girded with might.
translation:
  language: te
  text: 'తన బలంతో పర్వతాలను స్థిరపరచేవాడు,

    పరాక్రమంతో నడుము బిగించుకున్నవాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన శక్తితో పర్వతాలను స్థిరపరచేవాడు, బలంతో నడుము బిగించుకున్నవాడు.”
    reason: כֹּחַ, גְּבוּרָה పదాలను వరుసగా ‘శక్తి,’ ‘బలం’ అని కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: מֵכִין
  choice: స్థిరపరచేవాడు
  rationale: כון అనే ధాతువు హిఫీల్ కృదంత రూపంలో దేనినైనా దృఢంగా నిలపడం లేదా స్థాపించడం అనే భావాన్ని ఇస్తుంది. పర్వతాల సందర్భంలో ‘స్థిరపరచేవాడు’ వాటి దృఢత్వాన్ని తెలియజేస్తూ, శూన్యం నుండి సృష్టించాడనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: הָרִים
  choice: పర్వతాలను
  rationale: הָרִים అంటే నేరుగా ‘పర్వతాలు’. తెలుగు వాక్యంలో కర్మార్థక రూపం సహజంగా ఉంది.
- source_word: בְּכֹחוֹ
  choice: తన బలంతో
  rationale: כֹּחַ బలం లేదా శక్తిని సూచిస్తుంది; సాధనార్థక בְּను ‘తో’ సహజంగా వ్యక్తపరుస్తుంది. ‘తన’ అనే రూపం దైవాన్ని సూచించే తృతీయ పురుష సంబంధాన్ని నిలుపుతుంది.
- source_word: נֶאְזָר
  choice: నడుముకు కట్టుకున్నవాడు
  rationale: אזר నిఫాల్ కృదంతం నడుము కట్టుకోవడం, కార్యానికి సిద్ధంగా ఉండడం అనే రూపకాన్ని కలిగిస్తుంది. కేవలం ‘ధరించినవాడు’ అనడం కంటే ఈ ఎంపిక మూలంలోని శరీరాత్మక కవితా చిత్రాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: בִּגְבוּרָה
  choice: పరాక్రమాన్ని
  rationale: גְּבוּרָה బలమైన శక్తి, మహాబలం లేదా పరాక్రమాన్ని సూచిస్తుంది. ముందున్న כֹּחַకు ‘బలం’ వాడినందున, ఇక్కడ ‘పరాక్రమం’ రెండు పదాల స్వల్ప భేదాన్ని కాపాడుతుంది.
theological_decisions:
- issue: రెండు కృదంతాల పరస్పర సంబంధం
  choice: 'రెండింటినీ దేవుని లక్షణాత్మక కార్యం, స్థితిని వర్ణించే సమాంతర రూపాలుగా అనువదించడం: ‘స్థిరపరచేవాడు ... కట్టుకున్నవాడు’'
  alternative: 'రెండవదాన్ని వేరే సమాపక క్రియగా అనువదించడం: ‘స్థిరపరుస్తాడు ... పరాక్రమాన్ని కట్టుకున్నాడు’'
  rationale: హీబ్రూలో రెండు కృదంతాలు వరుసగా ఉన్నాయి. సమాంతర తెలుగు కృదంత రూపాలు ఆ కవితా నిర్మాణాన్ని, లక్షణాత్మక వర్ణనను నిలుపుతాయి.
- issue: దైవబలానికి సంబంధించిన రూపకం
  choice: ‘పరాక్రమాన్ని నడుముకు కట్టుకున్నవాడు’ అని రూపకాన్ని నిలుపడం
  alternative: ‘శక్తిమంతుడు’ లేదా ‘బలంతో నిండినవాడు’ అని భావాన్ని విప్పి చెప్పడం
  rationale: మూలపాఠం దైవశక్తిని శరీరాత్మకమైన నడుము కట్టుకునే చిత్రంతో చెబుతుంది. దాన్ని అమూర్త లక్షణంగా మార్చకుండా కవితా ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి. మూలంలోని రెండు కృదంతాల సమాంతరతను ‘-వాడు’ రూపాలతో కాపాడి, אזר యొక్క నడుము కట్టుకునే రూపకాన్ని స్పష్టంగా ఉంచాం.
