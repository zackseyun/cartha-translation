  text: For the choirmaster[a]. A psalm of David[b]; a song.
translation:
  language: te
  text: సంగీత నిర్దేశకునికి. దావీదు కీర్తన[a]; ఒక గీతం.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దావీదు కీర్తన’ అనే హెబ్రీ పదబంధం దావీదు రచించాడని, అతనికి అంకితం చేయబడిందని, లేదా అతనితో సంబంధముందని సూచించవచ్చు; అనువాదం ఈ అస్పష్టతను అలాగే ఉంచింది.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘దావీదు కీర్తన. ఒక గీతం.’
    reason: previous_rendering
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నిర్దేశకునికి
  rationale: కీర్తనల శీర్షికల్లో ఈ పదం సంగీత ప్రదర్శనను పర్యవేక్షించే వ్యక్తిని సాధారణంగా సూచిస్తుంది. לַ లోని ఉపసర్గను ‘-కి’తో వ్యక్తం చేశాం.
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: కీర్తనల శీర్షికల్లో సంగీత రచనను సూచించే ప్రామాణిక పదానికి సహజమైన, స్థిరపడిన తెలుగు సమానార్థకం.
- source_word: לְדָוִד
  choice: దావీదు కీర్తన
  rationale: ఈ సంక్షిప్త తెలుగు నిర్మాణం రచన, అంకితం, లేదా సంబంధం అనే హెబ్రీ לְ యొక్క సాధ్యమైన భావాలను ఒక్కదానికే పరిమితం చేయకుండా ఉంచుతుంది.
- source_word: שִׁיר
  choice: ఒక గీతం
  rationale: מִזְמוֹרకు భిన్నమైన శీర్షిక పదాన్ని కలిపివేయకుండా ప్రత్యేకంగా నిలుపుతుంది.
theological_decisions:
- issue: לְדָוִד అనే పదబంధంలో సంబంధ స్వభావం
  choice: దావీదు కీర్తన
  alternative: దావీదు రచించిన కీర్తన / దావీదుకు అంకితమైన కీర్తన
  rationale: మూలంలోని לְ రచయితను, అంకితాన్ని, లేదా సంబంధాన్ని సూచించవచ్చు. అనువాదం ఈ నిజమైన అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. శీర్షికలోని సంక్షిప్తతను, מִזְמוֹר మరియు שִׁיר మధ్య భేదాన్ని నిలిపాం.
