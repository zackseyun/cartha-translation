source:
  edition: WLC
  text: נ֤וֹרָא֨וֹת בְּ/צֶ֣דֶק תַּ֭עֲנֵ/נוּ אֱלֹהֵ֣י יִשְׁעֵ֑/נוּ מִבְטָ֥ח כָּל קַצְוֵי אֶ֝֗רֶץ וְ/יָ֣ם רְחֹקִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/005.yaml
  text: With awesome deeds in righteousness you answer us[a], O God of our salvation[b], the confidence of all the ends of the earth and of the distant sea.
translation:
  language: te
  text: భయవిస్మయకరమైన కార్యాలతో, నీతితో నీవు మాకు జవాబిస్తావు[a], మా రక్షణకు దేవా; భూమి అంచులన్నిటికీ, సుదూర సముద్రానికీ[b] నీవే నమ్మకస్థానమైనవాడవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘న్యాయంతో నీవు మాకు జవాబిస్తావు.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘సముద్రం’ ఏకవచనంలో ఉంది; ఇక్కడ అది సమిష్టిగా ‘సుదూర సముద్రాలు’ అని కూడా అర్థమివ్వవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נ֤וֹרָא֨וֹת
  choice: భయవిస్మయం కలిగించే కార్యాలతో
  rationale: యרא మూలం భయాన్నీ విస్మయాన్నీ కలిగించే స్వభావాన్ని సూచిస్తుంది. సందర్భం దేవుని రక్షణ కార్యాలు గనుక, తెలుగు పాఠకునికి సహజంగా ఉండేలా ‘కార్యాలు’ అనే భావాన్ని స్పష్టంగా చేర్చాం.
- source_word: בְּצֶ֣דֶק
  choice: నీతికి అనుగుణంగా
  rationale: ב ఉపసర్గ ఇక్కడ విధానాన్ని లేదా ప్రమాణాన్ని సూచిస్తుంది. దేవుడు ఇచ్చే జవాబు ఆయన నీతికి అనుగుణంగా ఉంటుందనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘న్యాయానికి అనుగుణంగా’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: תַּ֭עֲנֵנוּ
  choice: నీవు మాకు జవాబిస్తావు
  rationale: ענה Qal క్రియకు ‘జవాబివ్వు’ అనే ప్రత్యక్ష అర్థం ఉంది; נוּ ప్రత్యయం ప్రథమ పురుష బహువచనాన్ని సూచిస్తుంది.
- source_word: אֱלֹהֵ֣י יִשְׁעֵ֑נוּ
  choice: మాకు రక్షణనిచ్చే దేవా
  rationale: హీబ్రూ సమాసం ‘మా రక్షణ దేవుడు’ అనే భావాన్ని ఇస్తుంది. అక్షరార్థపు అసహజ నిర్మాణాన్ని తప్పించి, ప్రార్థనా సంబోధనను మరియు రక్షణ భావాన్ని సహజ తెలుగులో నిలిపాం.
- source_word: מִבְטָ֥ח
  choice: నమ్మకం
  rationale: ఈ పదం ఎవరిపై లేదా దేనిపై ఆధారపడి నమ్మకం ఉంచుతారో దానిని సూచిస్తుంది. ‘ఆశ్రయం’ కంటే మూలంలోని విశ్వాస భావాన్ని ‘నమ్మకం’ నేరుగా నిలుపుతుంది.
- source_word: כָּל קַצְוֵי אֶ֝֗רֶץ
  choice: భూమి అంచులన్నిటికీ
  rationale: ప్రపంచంలోని అత్యంత సుదూర ప్రాంతాలను సూచించే హీబ్రూ నానుడిని తెలుగులో సుపరిచితమైన సమాన రూపంతో అందించాం.
- source_word: וְיָ֣ם רְחֹקִֽים
  choice: సుదూర సముద్రానికీ
  rationale: יָם వ్యాకరణపరంగా ఏకవచనం కావడంతో ప్రధాన పాఠంలో ‘సముద్రం’ను నిలిపాం. רְחֹקִים రూపం మరియు సందర్భం వల్ల ఇది సముద్రాలను సమిష్టిగా సూచించే అవకాశం పాదటిప్పణిలో భద్రపరచబడింది.
theological_decisions:
- issue: కీర్తన సందర్భంలో צֶדֶק అనువాదం
  choice: నీతి
  alternative: న్యాయం
  rationale: ఈ సందర్భంలో దేవుని చర్య నైతికంగా సరైనదిగాను ఆయన స్వభావానికి అనుగుణంగాను ఉండటాన్ని ‘నీతి’ విస్తృతంగా తెలియజేస్తుంది. న్యాయతీర్పు కోణాన్ని బలపరిచే ‘న్యాయం’ కూడా సాధ్యమే కాబట్టి దానిని పాదటిప్పణిలో ఇచ్చాం.
- issue: אֱלֹהֵי יִשְׁעֵנוּ లో రక్షణ సంబంధం
  choice: మాకు రక్షణనిచ్చే దేవా
  alternative: మా రక్షణకు దేవా
  rationale: దేవుడు రక్షణకు మూలమూ దాతయూ అన్న హీబ్రూ భావాన్ని సహజ తెలుగులో తెలిపాం; ‘రక్షకుడు’ అని మాత్రమే మార్చి సమాసంలోని భావవిస్తృతిని అనవసరంగా కుదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనా కీర్తనకు తగిన గౌరవభరితమైన సంబోధనతో రూపొందించాం. మూలంలోని ద్వితీయ పురుష ఏకవచనాన్ని ‘నీవు’గా, విశ్వవ్యాప్త నమ్మక భావాన్ని చివర ‘నీవే నమ్మకం’గా సహజంగా నిలిపాం.
