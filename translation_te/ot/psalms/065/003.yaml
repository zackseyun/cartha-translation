id: PSA.65.3
reference: Psalms 65:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: דִּבְרֵ֣י עֲ֭וֺנֹת גָּ֣בְרוּ מֶ֑נִּ/י פְּ֝שָׁעֵ֗י/נוּ אַתָּ֥ה תְכַפְּרֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/003.yaml
  text: Words of iniquity have prevailed against me[b][a]; our transgressions—you will atone for them.
translation:
  language: te
  text: పాపపు సంగతులు నాపై పైచేయి సాధించాయి[a]; మా అతిక్రమాలకు—నీవే ప్రాయశ్చిత్తం చేస్తావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పాపపు విషయాలు నాకు మించిన బలంతో ఉన్నాయి.” హీబ్రూ ప్రారంభ వాక్యం సంక్షిప్తంగా ఉంది; దానిని “పాపపు మాటలు” అని కూడా అక్షరార్థంగా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వాటిని తొలగిస్తావు” లేదా “వాటిని కప్పివేస్తావు.” హీబ్రూ క్రియ పాపానికి ప్రాయశ్చిత్తం చేసి దాని అపరాధాన్ని తొలగించే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי עֲוֺנֹת
  choice: పాపపు సంగతులు
  rationale: దִּבְרֵי అనే నిర్మిత బహువచనం ‘మాటలు’ లేదా ‘విషయాలు/సంగతులు’ అని అర్థమివ్వగలదు. ఇక్కడ ‘పాపపు మాటలు’ అనడం కేవలం పాపపూరితమైన పలుకులనే సూచించే ప్రమాదం ఉంది; ‘పాపపు సంగతులు’ మూలంలోని సంక్షిప్తతను, విస్తృతార్థాన్ని నిలుపుతుంది.
- source_word: גָּבְרוּ מֶנִּי
  choice: నాపై పైచేయి సాధించాయి
  rationale: גבר అనే క్రియలోని బలపడటం లేదా జయించడం అనే భావాన్ని, מן‌తో వ్యక్తమైన ‘నన్ను మించి/నాపై’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: פְּשָׁעֵינוּ
  choice: మా అతిక్రమాలకు
  rationale: פֶּשַׁע ఉద్దేశపూర్వక హద్దుమీరుట లేదా తిరుగుబాటు భావాన్ని కలిగి ఉంది. ‘అతిక్రమాలు’ ఆ నైతిక బరువును కాపాడుతూ సాధారణ బైబిలు తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: אַתָּה
  choice: నీవే
  rationale: హీబ్రూలో స్పష్టంగా ఉంచిన కర్త సర్వనామంలోని ఉద్ఘాటనను ‘నీవే’ సహజంగా ప్రతిబింబిస్తుంది.
- source_word: תְכַפְּרֵם
  choice: ప్రాయశ్చిత్తం చేస్తావు
  rationale: כפר యొక్క పియేల్ రూపం పాపానికి ప్రాయశ్చిత్తం చేయడం, దాని అపరాధాన్ని తొలగించడం అనే భావాన్ని ఇస్తుంది. ఈ ఎంపిక కేవలం ‘కప్పివేయడం’ అనే సంకుచిత భావాన్ని నివారిస్తూ మూలంలోని ఆరాధనా-దైవశాస్త్ర బరువును నిలుపుతుంది.
theological_decisions:
- issue: పాపాల విషయమై כפר క్రియను అనువదించడం
  choice: మా అతిక్రమాలకు—నీవే ప్రాయశ్చిత్తం చేస్తావు
  alternative: మా అతిక్రమాలను—నీవే తొలగిస్తావు / కప్పివేస్తావు
  rationale: ‘ప్రాయశ్చిత్తం చేస్తావు’ అనేది మూలక్రియలోని పాపపరిహార భావాన్ని నిలుపుతుంది; అయితే ప్రాయశ్చిత్తం ఎలా కార్యసాధకం అవుతుందనే నిర్దిష్ట సిద్ధాంతాన్ని వచనంలోకి చేర్చదు. ‘కప్పివేస్తావు’ తెలుగులో పాపాన్ని దాచిపెట్టడం అనే అపార్థం కలిగించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కీర్తన శైలిని వాడాం. ‘పైచేయి సాధించాయి’ ద్వారా పాపాలు కీర్తనకర్తను మించిపోయిన బలంలా చిత్రించబడే మూలరూపకం నిలిచింది; విరామచిహ్నం మరియు ‘నీవే’ రెండవ భాగంలోని దైవకర్తపై ఉద్ఘాటనను చూపుతాయి.
