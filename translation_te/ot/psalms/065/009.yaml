  text: You visit the earth and water it[a]; you greatly enrich it. The river of God is full of water; you prepare their grain[b], for so you prepare the earth.
translation:
  language: te
  text: 'నీవు భూమిని సందర్శించి, దానికి నీరు సమకూరుస్తావు;

    దానిని ఎంతో సుసంపన్నం చేస్తావు.

    దేవుని ప్రవాహం[a] నీటితో నిండి ఉంది;

    నీవు వారి ధాన్యాన్ని[b] సిద్ధపరుస్తావు,

    ఎందుకంటే ఈ విధంగానే నీవు భూమిని సిద్ధపరుస్తావు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దేవుని సెలయేరు’ లేదా ‘దేవుని కాలువ’ అని కూడా అనువదించవచ్చు. ఈ హెబ్రీయ కవితాత్మక పదబంధం వర్షానికీ సారవంతతకూ పరలోక మూలాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘వారి ధాన్యాన్ని సమకూరుస్తావు’ లేదా ‘వారి ధాన్యాన్ని స్థిరపరుస్తావు’ అని కూడా అనువదించవచ్చు. హెబ్రీయ క్రియకు ‘సిద్ధపరచు,’ ‘సమకూర్చు,’ లేదా ‘స్థిరపరచు’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקַדְתָּ
  choice: దర్శించి
  rationale: పָּקַד్ అనే క్రియకు ‘సందర్శించు, శ్రద్ధ చూపు, పట్టించుకొను’ అనే అర్థపరిధి ఉంది. ఇక్కడ భూమికి మేలు చేసే దేవుని శ్రద్ధను సూచిస్తూ, హెబ్రీయ కవితాత్మక రూపకాన్ని నిలుపుకోవడానికి ‘దర్శించి’ అని అనువదించాం.
- source_word: וַתְּשֹׁקְקֶהָ
  choice: దానికి నీరు పెడతావు
  rationale: వ్యవసాయ సందర్భంలో ఈ రూపం భూమికి నీటిని సమకూర్చడాన్ని సూచిస్తుంది. ‘నీరు పెడతావు’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉండి మూలంలోని కార్యాన్ని తెలియజేస్తుంది.
- source_word: רַבַּת תַּעְשְׁרֶנָּה
  choice: దానిని ఎంతో సుసంపన్నం చేస్తావు
  rationale: עשר క్రియలోని ‘సంపన్నం చేయు’ అనే కారణార్థాన్ని, רַבַּת ఇచ్చే తీవ్రతను ‘ఎంతో సుసంపన్నం చేస్తావు’ ప్రతిబింబిస్తుంది.
- source_word: פֶּלֶג אֱלֹהִים
  choice: దేవుని ప్రవాహం
  rationale: פֶּלֶג అంటే ప్రవాహం, సెలయేరు లేదా నీటి కాలువ కావచ్చు. ‘దేవుని ప్రవాహం’ నిర్మాణ సంబంధాన్ని, ఉన్నతమైన కవితా చిత్రాన్ని నిలుపుతూ, దాని ఖచ్చిత స్వరూపాన్ని అతిగా నిర్ధారించదు.
- source_word: מָלֵא מָיִם
  choice: నీటితో నిండి ఉంది
  rationale: నీటి సమృద్ధిని తెలిపే సరళమైన విధేయ వాక్యాన్ని సహజ తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: תָּכִין דְּגָנָם
  choice: వారి ధాన్యాన్ని సిద్ధం చేస్తావు
  rationale: כון హిఫిల్ రూపానికి ‘సిద్ధం చేయు, ఏర్పరచు, స్థిరపరచు’ అనే అర్థాలు ఉన్నాయి. వ్యవసాయ సందర్భంలో ‘సిద్ధం చేస్తావు’ సరిపోతుంది; పుంలింగ బహువచన ప్రత్యయాన్ని ‘వారి’గా నిలిపాం.
- source_word: כִּי כֵן תְּכִינֶהָ
  choice: ఎందుకంటే ఈ విధంగా నీవు భూమిని సిద్ధం చేస్తావు
  rationale: చివరి స్త్రీలింగ ఏకవచన ప్రత్యయం ‘భూమి’ని సూచిస్తుంది. ముందు వచ్చిన כון క్రియతో పదసంబంధాన్ని నిలుపుకోవడానికి ‘సిద్ధం చేస్తావు’ను పునరావృతం చేశాం; తెలుగులో స్పష్టత కోసం ‘భూమిని’ అని పేర్కొన్నాం.
theological_decisions:
- issue: ‘వారి ధాన్యం’లోని బహువచన ప్రత్యయం ఎవరిని సూచిస్తుంది?
  choice: మూలంలోని పుంలింగ బహువచన భేదాన్ని నిలుపుతూ ‘వారి ధాన్యాన్ని’ అని అనువదించాం; ఇది భూమి ఫలాన్ని పొందే ప్రజలను సూచించే అవకాశం ఉంది.
  alternative: మానవ సూచనను వ్యక్తం చేయకుండా ‘ధాన్యాన్ని సమకూరుస్తావు’ లేదా ‘భూమి పంటను సిద్ధం చేస్తావు’ అని అనువదించడం.
  rationale: హెబ్రీయ ప్రత్యయం పుంలింగ బహువచనంలో ఉంది; ‘భూమి’ మాత్రం స్త్రీలింగ ఏకవచనం. అందువల్ల దానిని భూమితో కలిపివేయకుండా వ్యాకరణ భేదాన్ని కాపాడాం, అయితే సూచిత ప్రజలు వచనంలో ప్రత్యక్షంగా పేర్కొనబడలేదనే అనిశ్చితిని అంగీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కవితా శైలిని వాడాం. సమాంతర పాదాలను నిలుపుతూ, మూలంలోని ‘సిద్ధం చేయు’ అనే క్రియ పునరావృతిని సంరక్షించాం. ‘దర్శించి’ అనే పదం దేవుని అనుగ్రహపూర్వక శ్రద్ధను సూచించే హెబ్రీయ సందర్శన రూపకాన్ని కాపాడుతుంది.
