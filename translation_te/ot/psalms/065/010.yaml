source:
  edition: WLC
  text: תְּלָמֶ֣י/הָ רַ֭וֵּה נַחֵ֣ת גְּדוּדֶ֑י/הָ בִּ/רְבִיבִ֥ים תְּ֝מֹגְגֶ֗/נָּה צִמְחָ֥/הּ תְּבָרֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/010.yaml
  text: Saturate its furrows; settle its ridges. With showers you soften it; you bless its growth.
translation:
  language: te
  text: దాని చాళ్లను సమృద్ధిగా తడుపుతావు; దాని మడులను కుదిస్తావు. జల్లులతో నేలను మెత్తబరుస్తావు; దాని పెరుగుదలను దీవిస్తావు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּלָמֶיהָ
  choice: దాని చాళ్లను
  rationale: పొలంలో నాగలితో ఏర్పడిన furrows అనే అర్థాన్ని సహజమైన ఆధునిక తెలుగు వ్యవసాయ పదంతో వ్యక్తం చేస్తుంది.
- source_word: רַוֵּה
  choice: సమృద్ధిగా తడుపుతావు
  rationale: కేవలం తడపడం కంటే పూర్తిగా నీటితో నింపి తృప్తిపరచే భావాన్ని నిలుపుతుంది.
- source_word: נַחֵת גְּדוּדֶיהָ
  choice: దాని మడులను అణగబెడతావు
  rationale: נחת అనే క్రియకు ఇక్కడ దిగజార్చడం లేదా కుంగజేయడం అనే భావం ఉంది; వర్షం పొలంలోని ఎత్తైన మట్టిమడులను కుదించి సమం చేసే చిత్రాన్ని అతిగా నిర్దిష్టీకరించకుండా అందిస్తుంది.
- source_word: בִּרְבִיבִים
  choice: జల్లులతో
  rationale: సమృద్ధిగా కురిసే వర్షపు జల్లులను సూచించే సహజమైన రూపం.
- source_word: תְּמֹגְגֶנָּה
  choice: నేలను మెత్తబరుస్తావు
  rationale: స్త్రీలింగ ప్రత్యయం భూమిని సూచిస్తుంది; వర్షం గట్టిన నేలను కరిగినట్లు మెత్తబరచే భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: צִמְחָהּ
  choice: దాని మొలకను
  rationale: భూమి నుండి మొలిచే పెరుగుదల లేదా పంటను సూచించే మూలార్థానికి దగ్గరగా ఉంటుంది.
- source_word: תְּבָרֵךְ
  choice: దీవిస్తావు
  rationale: దేవుని అనుగ్రహం వల్ల మొలక వర్ధిల్లే భావాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: దేవుడు భూమిని దీవించడం అనే వ్యక్తీకరణ
  choice: దాని మొలకను దీవిస్తావు
  alternative: దాని పంటను వృద్ధి చేస్తావు
  rationale: హీబ్రూ వచనంలోని ప్రత్యక్షమైన ‘దీవించు’ అనే దైవకార్య భాషను ఫలితార్థంగా మార్చకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనా కవిత్వానికి తగిన గౌరవభరితమైన సరళ శైలి. ముందరి వచనంలోని భూమిని సూచించే ‘దాని’ అనే సర్వనామ సంబంధాన్ని నిలిపింది.
