  naturalness: ‘ఎందుకంటే ప్రతి ఆపద నుండి ఆయన నన్ను విడిపించాడు; నా కన్ను నా శత్రువులను చూసింది’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది. ‘నా కన్ను’ అనే కొంత కవితాత్మకమైన ప్రయోగం ఇక్కడ హీబ్రూ శైలిని తగిన విధంగా నిలుపుతుంది.
