  text: For he has delivered me from every trouble[a], and my eye has looked on my enemies.
translation:
  language: te
  text: ఎందుకంటే ప్రతి ఆపద నుండి ఆయన నన్ను విడిపించాడు; నా కన్ను నా శత్రువులను చూసింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి స్తుతి లేదా ప్రతిజ్ఞకు కారణాన్ని తెలిపే వివరణాత్మక భావాన్ని సందర్భానుసారంగా వ్యక్తం చేస్తుంది.
- source_word: מִכָּל צָרָה
  choice: ప్రతి ఆపద నుండి
  rationale: מִן తో కూడిన כָּל, అన్ని ఆపదల సమగ్రత నుండి విడుదలను సూచిస్తుంది. ‘ప్రతి ఆపద నుండి’ ఆధునిక తెలుగులో సహజంగా ఉండి పంపిణీ భావాన్ని నిలుపుతుంది.
- source_word: הִצִּילָנִי
  choice: ఆయన నన్ను విడిపించాడు
  rationale: נצל ధాతువు హిఫీల్ రూపంలో రక్షించడం లేదా విడిపించడం అని అర్థం. క్రియలో అంతర్లీనంగా ఉన్న కర్తను సందర్భంలోని దేవునిగా ‘ఆయన’తో వ్యక్తం చేశాం; పూర్తి జరిగిన కార్యాన్ని తెలుగు భూతకాలంతో తెలిపాం.
- source_word: וּבְאֹיְבַי
  choice: నా శత్రువులను
  rationale: ראה తో వచ్చిన בְ ఇక్కడ దర్శనానికి సంబంధించిన వారిని సూచిస్తుంది. తెలుగులో సహజమైన కర్మరూపం వాడినా, వారి ఓటమి లేదా పతనాన్ని అనువాదంలో అదనంగా చేర్చలేదు.
- source_word: רָאֲתָה עֵינִי
  choice: నా కన్ను ... చూసింది
  rationale: హీబ్రూ వాక్యంలో ‘నా కన్ను’ కర్తగా ఉన్న సజీవమైన ప్రయోగాన్ని తెలుగులోనూ నిలిపి, ראה యొక్క సాధారణ భావాన్ని ‘చూసింది’గా అనువదించాం.
theological_decisions:
- issue: కీర్తనకర్త తన శత్రువులను చూడడంలో అంతర్లీనంగా ఉండవచ్చిన భావం
  choice: శత్రువుల ఓటమి, పతనం లేదా వారిపై విజయాన్ని స్పష్టంగా చేర్చకుండా, ‘నా కన్ను నా శత్రువులను చూసింది’ అని అనువదించడం.
  alternative: ‘నా శత్రువుల పతనాన్ని నా కన్ను చూసింది’ లేదా ‘నా శత్రువులను విజయగర్వంతో చూశాను.’
  rationale: హీబ్రూ పాఠం కీర్తనకర్త కన్ను శత్రువులను చూసిందని మాత్రమే నేరుగా చెబుతుంది. సందర్భం అతని న్యాయస్థాపనను లేదా వారి ఓటమిని సూచించవచ్చు; అయితే వాటిని వచనం స్పష్టంగా పేర్కొనదు. అందువల్ల ఆ భావసందిగ్ధతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘నా కన్ను’ అనే హీబ్రూ రూపక ప్రయోగాన్ని దాని సజీవత కోసం నిలిపాం; ‘ఆపద’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి צָרָה యొక్క విస్తృతమైన distress/trouble భావాన్ని అందిస్తుంది.
