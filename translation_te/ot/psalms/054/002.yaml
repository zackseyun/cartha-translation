source:
  edition: WLC
  text: אֱ֭לֹהִים בְּ/שִׁמְ/ךָ֣ הוֹשִׁיעֵ֑/נִי וּ/בִ/גְבוּרָתְ/ךָ֥ תְדִינֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/002.yaml
  text: God[a], save me by your name, and vindicate me by your might.
translation:
  language: te
  text: దేవా, నీ నామం ద్వారా నన్ను రక్షించు; నీ పరాక్రమం ద్వారా నాకు న్యాయం చేయు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాకు తీర్పు తీర్చు’ లేదా ‘నా పక్షాన తీర్పు తీర్చు.’ హీబ్రూ క్రియ న్యాయస్థానంలో తీర్పు చెప్పడాన్ని సూచించగలదు; ఇక్కడ న్యాయం జరిగేలా చేయడం లేదా తన పక్షాన న్యాయమైన తీర్పు ఇవ్వడం అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ప్రార్థనా సందర్భంలో ఇది ప్రత్యక్ష సంబోధన. ఆధునిక ప్రామాణిక తెలుగులో సంబోధనను సహజంగా చూపేందుకు ‘దేవా’ అని అనువదించాం.
- source_word: בְּשִׁמְךָ
  choice: నీ నామం ద్వారా
  rationale: בְ అనే ఉపసర్గకు ఇక్కడ సాధనార్థక భావం ఉంది. ‘నామం’ దేవుని వెల్లడైన స్వభావం, ఖ్యాతి, గుర్తింపును సూచించే హీబ్రూ సంక్షిప్తతను నిలుపుతుంది.
- source_word: הוֹשִׁיעֵנִי
  choice: నన్ను రక్షించు
  rationale: ישׁע హిఫీల్ రూపం రక్షణ కోసం చేసే ప్రత్యక్ష మనవి. ‘రక్షించు’ విస్తృత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וּבִגְבוּרָתְךָ
  choice: నీ పరాక్రమం ద్వారా
  rationale: גְּבוּרָה బలం, శక్తిసామర్థ్యం, పరాక్రమం అనే భావాలను కలిగి ఉంది. ‘పరాక్రమం’ కీర్తనా శైలికి తగిన గౌరవభరిత పదం; ఉపసర్గలోని సాధనార్థాన్ని ‘ద్వారా’ నిలుపుతుంది.
- source_word: תְדִינֵנִי
  choice: నాకు న్యాయం తీర్చు
  rationale: דין న్యాయస్థానంలో తీర్పు చెప్పడాన్ని సూచించగలదు; ఈ శత్రువుల మధ్య రక్షణ కోరే సందర్భంలో తన పక్షంగా న్యాయమైన తీర్పు ఇవ్వమనే భావం బలంగా ఉంది. ‘నాకు న్యాయం తీర్చు’ ఆ న్యాయపరమైన భావాన్ని సహజంగా ఉంచి, కేవలం దోషనిర్ణయం అనే అపార్థాన్ని తగ్గిస్తుంది.
theological_decisions:
- issue: దైవన్యాయానికి సంబంధించిన ‘తీర్పు తీర్చు/న్యాయం తీర్చు’ అనే మనవి
  choice: నాకు న్యాయం తీర్చు
  alternative: నాకు తీర్పు తీర్చు; నా వ్యాజ్యాన్ని సమర్థించు
  rationale: కవి తటస్థ విచారణను మాత్రమే కాక, విరోధుల ఎదుట న్యాయమైన అనుకూల తీర్పును కోరుతున్నాడు. అయినప్పటికీ మూలంలోని న్యాయస్థాన సంబంధిత ఉద్వేగాన్ని పూర్తిగా ‘నిర్దోషిగా ప్రకటించు’ అని పరిష్కరించకుండా, ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, కీర్తనకు తగిన గౌరవభరిత ప్రార్థనా శైలి. రెండు సమాంతర భాగాల్లో ‘ద్వారా’ను ఉంచి హీబ్రూ నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపాం.
