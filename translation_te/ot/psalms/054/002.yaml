revisions:
- from: దేవా, నీ నామం ద్వారా నన్ను రక్షించు; నీ పరాక్రమం ద్వారా నాకు న్యాయం తీర్చు.[a]
  to: దేవా, నీ నామం ద్వారా నన్ను రక్షించు; నీ పరాక్రమం ద్వారా నాకు న్యాయం చేయు.[a]
  rationale: 'The revision makes only a safe idiomatic adjustment: ‘నాకు న్యాయం చేయు’ is the normal Telugu expression for granting justice and fits the psalm’s appeal for judicial vindication. It neither removes the underlying judicial ambiguity nor imports a doctrinal interpretation. The revised footnote preserves ‘judge me’ as an alternative and clarifies the favorable-forensic possibility.'
