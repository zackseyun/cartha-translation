review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the vocative address, the instrumental force of בְ in both clauses, and the rescue plea. The final clause appropriately seeks judicial redress, but the idiom chosen should more clearly express favorable justice rather than the potentially awkward literal collocation ‘నాకు న్యాయం తీర్చు.’
  naturalness: ‘దేవా’ and the parallel prayer clauses are natural and suitably elevated. ‘నీ నామం ద్వారా’ and ‘నీ పరాక్రమం ద్వారా’ are understandable, though ‘నామమునుబట్టి/పరాక్రమమునుబట్టి’ might be more psalmic; no change is necessary there. ‘నాకు న్యాయం తీర్చు’ is less idiomatic than ‘నాకు న్యాయం చేయు.’
  terminology: ‘నామం,’ ‘రక్షించు,’ and ‘పరాక్రమం’ are suitable modern-standard Telugu terms. For תְדִינֵנִי, ‘నాకు న్యాయం చేయు’ preserves the legal appeal without prematurely reducing it to a declaration of innocence. The footnote’s ‘నా వ్యాజ్యాన్ని సమర్థించు’ is understandable but less precise than ‘నా పక్షాన తీర్పు తీర్చు’ or ‘నా వాదాన్ని సమర్థించు.’
  issues:
  - severity: low
    issue: Idiomatic rendering of the judicial plea
    rationale: In contemporary Telugu, ‘న్యాయం తీర్చు’ is not as natural as ‘న్యాయం చేయు.’ The latter communicates an appeal for justice/vindication while retaining the source verb’s judicial resonance.
  - severity: low
    issue: Footnote alternative ‘నా వ్యాజ్యాన్ని సమర్థించు’
    rationale: ‘వ్యాజ్యం’ can be understood but is relatively legalistic and ‘సమర్థించు’ can suggest merely endorsing an argument. ‘నా పక్షాన తీర్పు తీర్చు’ more directly reflects the forensic sense of דין.
  revised_text: దేవా, నీ నామం ద్వారా నన్ను రక్షించు; నీ పరాక్రమం ద్వారా నాకు న్యాయం చేయు.[a]
