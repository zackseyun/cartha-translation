  edition: WLC
  text: לַ/מְנַצֵּ֥חַ בִּ/נְגִינֹ֗ת מַשְׂכִּ֥יל לְ/דָוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/000.yaml
  text: 'For the choirmaster: with stringed instruments. A Maskil[b] of David[a].'
translation:
  language: te
  text: 'సంగీత నాయకునికి: తంతివాయిద్యాలతో. దావీదుకు సంబంధించిన[a] మస్కీల్[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దావీదు రచించినది,” లేదా “దావీదు కోసం.” హీబ్రూ శీర్షిక రచయితత్వాన్ని, అంకితాన్ని లేదా అనుబంధాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “మస్కీల్” అనేది కీర్తనల శీర్షికల్లో వాడే హీబ్రూ సాంకేతిక పదం. ఇది ఒక రచనా లేదా ప్రదర్శనా విధానాన్ని సూచించే అవకాశం ఉంది; అయితే దీని ఖచ్చితమైన అర్థం అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకునికి
  rationale: కీర్తనల శీర్షికల్లో సంగీత ప్రదర్శనను నడిపించే వ్యక్తిని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా, గాయకబృందానికే పరిమితం చేయకుండా సంగీత బాధ్యతను వ్యక్తపరుస్తుంది.
- source_word: בִּנְגִינֹת
  choice: తంతివాయిద్యాలతో
  rationale: ఈ పదం తంతివాయిద్యాల సహవాద్యాన్ని సూచిస్తుంది; వాయిద్య స్వభావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: מַשְׂכִּיל
  choice: మస్కీల్
  rationale: ఇది కీర్తన శీర్షికల్లో కనిపించే సాంకేతిక పదం; దాని ఖచ్చితమైన అర్థం అనిశ్చితం కాబట్టి ఊహాత్మక అర్థానువాదం చేయకుండా లిప్యంతరీకరించబడింది.
- source_word: לְדָוִד
  choice: దావీదు సంబంధమైన
  rationale: హీబ్రూ לְ రచయితృత్వం, అంకితం లేదా అనుబంధాన్ని సూచించగలదు. ఈ తెలుగు రూపం ఆ ఉద్దేశపూర్వక అస్పష్టతను సాధ్యమైనంతవరకు నిలుపుతుంది.
theological_decisions:
- issue: దావీదు పేరుతో ఉన్న శీర్షికకు అర్థం
  choice: దావీదు సంబంధమైన
  alternative: దావీదు రచించినది; దావీదు కోసం
  rationale: శీర్షికలోని హీబ్రూ నిర్మాణం రచయితృత్వం, అంకితం లేదా అనుబంధాన్ని సూచించవచ్చు; మూలం తేల్చని విషయాన్ని అనువాదం తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన కీర్తన శీర్షిక శైలిని, గౌరవప్రదమైన ధోరణిని కాపాడింది. సాంకేతిక పదాన్ని వివరణాత్మక పాదసూచికతో నిలిపింది.
