translation:
  language: te
  text: 'దేవా, నా ప్రార్థన విను;

    నా నోటి మాటలను ఆలకించు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ఇది ప్రార్థనలో నేరుగా సంబోధించే పదం. తెలుగు సంబోధన రూపమైన ‘దేవా’ మూలంలోని సంబోధన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שְׁמַע
  choice: విను
  rationale: ఈ ఆజ్ఞారూపం కేవలం శబ్దం వినడం కాక, శ్రద్ధగా విని స్పందించమనే ప్రార్థనా భావాన్ని కలిగి ఉంది; ‘విను’ ఆ భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: תְּפִלָּתִי
  choice: నా ప్రార్థన
  rationale: תְּפִלָּה యొక్క సాధారణ అర్థం ‘ప్రార్థన’; సందర్భంలోని కీర్తనాత్మక విన్నపానికి ఇదే స్పష్టమైన సమానార్థకం.
- source_word: הַאֲזִינָה
  choice: ఆలకించు
  rationale: ఈ పదం చెవి ఒగ్గి శ్రద్ధగా వినడాన్ని సూచిస్తుంది. ‘ఆలకించు’ మొదటి పాదంలోని ‘విను’తో సమాంతరతను ఉంచుతూ మరింత శ్రద్ధగల వినికిడిని తెలియజేస్తుంది.
- source_word: לְאִמְרֵי
  choice: మాటలను
  rationale: אִמְרֵי అనేది ‘మాటలు/పలుకులు’ అనే అర్థమిచ్చే నిర్మాణ బహువచనం. తెలుగులో ‘నా నోటి మాటలను’ అనే నిర్మాణంలో విభక్తి సహజంగా క్రియతో అనుసంధానమవుతుంది.
- source_word: פִי
  choice: నా నోటి
  rationale: మూలంలోని స్పష్టమైన శరీరరూపకాన్ని పరిరక్షిస్తూ ‘నా నోటి మాటలు’ అనే సహజమైన తెలుగు కవితాత్మక ప్రయోగాన్ని ఉపయోగించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన ప్రార్థనా శైలిని ఉపయోగించింది. హెబ్రీ సమాంతర నిర్మాణాన్ని రెండు పాదాలుగా నిలిపింది. ఆంగ్ల సంప్రదింపు పాఠంలోని [a] గుర్తు దాని గమనికతో స్థానపరంగా సరిపోలకపోవడం, అలాగే మూలపాఠంలో ప్రచురణకు అవసరమైన ప్రత్యేక పాఠాంతర సమస్య లేకపోవడం వల్ల తెలుగు ముసాయిదాలో పాదటిప్పణి చేర్చలేదు.
