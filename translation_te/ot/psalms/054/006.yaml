  text: May evil return upon my adversaries[a]; in your faithfulness[b], destroy them.
translation:
  language: te
  text: కీడు నా విరోధుల మీదికి తిరిగి రావాలి[a]; నీ నమ్మకత్వాన్ని బట్టి[b] వారిని నాశనం చేయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కీడు నా విరోధుల మీదికి తిరిగి వస్తుంది; నీ నమ్మకత్వాన్ని బట్టి వారిని నాశనం చేయి.” మొదటి క్రియను కోరికగా కాక ప్రకటనగా కూడా చదవవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “నీ సత్యాన్ని బట్టి.” హెబ్రీ పదానికి సత్యం, విశ్వసనీయత, నమ్మకత్వం అనే అర్థాలు ఉండగలవు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ישוב
  choice: తిరిగి రావాలి
  rationale: שוב అనే అసంపూర్ణ క్రియారూపం సూచనార్థకంగా (‘తిరిగి వస్తుంది’) లేదా సంకల్పార్థకంగా చదవవచ్చు. ప్రార్థనా సందర్భం, తరువాతి ఆజ్ఞార్థక క్రియ దృష్ట్యా ఇక్కడ ప్రార్థనాత్మక కోరికగా అనువదించాం.
- source_word: הָרַע
  choice: కీడు
  rationale: רַע నైతిక చెడును గానీ హాని/విపత్తును గానీ సూచించగలదు. ‘కీడు’ మూలంలోని సంక్షిప్తతను, ఈ రెండు భావసాధ్యతలను నిలుపుతుంది.
- source_word: לְשֹׁרְרָי
  choice: నా విరోధుల మీదికి
  rationale: ఈ పదం కీర్తనకర్తకు విరోధంగా నిలిచినవారిని సూచిస్తుంది. ‘విరోధులు’ సైనిక శత్రుత్వాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בַּאֲמִתְּךָ
  choice: నీ నమ్మకత్వాన్ని బట్టి
  rationale: אֱמֶת సత్యం, విశ్వసనీయత, నమ్మకత్వం అనే భావాలను కలిగి ఉంటుంది. దేవుని చర్యకు ఆధారంగా ఉన్న ఆయన విశ్వసనీయ స్వభావాన్ని ‘నమ్మకత్వం’ స్పష్టంగా తెలుపుతుంది; ב ఇక్కడ ఆధారం/సాధన భావాన్ని సూచించగలదు.
- source_word: הַצְמִיתֵם
  choice: వారిని నాశనం చేయి
  rationale: צמת హిఫీల్ ఆజ్ఞారూపం పూర్తిగా నిర్మూలించడం లేదా అంతం చేయడం అనే బలమైన భావాన్ని ఇస్తుంది. ‘నాశనం చేయి’ ఆజ్ఞ యొక్క తీవ్రతను మెత్తబరచకుండా నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: శాపప్రార్థనాత్మక తీర్పు భావం
  choice: దైవిక తీర్పు కోసం చేసే ప్రార్థనగా అనువదించడం
  alternative: ‘కీడు నా విరోధుల మీదికి తిరిగి వస్తుంది; నీ నమ్మకత్వాన్ని బట్టి నీవు వారిని నాశనం చేస్తావు’ అనే ప్రకటనాత్మక పఠనం
  rationale: కీర్తన నేరుగా దేవునితో చేసే ప్రార్థన; చివరి క్రియ స్పష్టంగా ఆజ్ఞార్థకంగా ఉంది. మొదటి క్రియను కోరికగా చూపడం హెబ్రీ వాక్యంలోని ప్రార్థనాత్మక, శాపప్రార్థనాత్మక ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గంభీరమైన శైలి. మూలంలోని సంక్షిప్తతను, తీర్పు ప్రార్థన యొక్క తీవ్రతను, క్రియారూపంలోని సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
