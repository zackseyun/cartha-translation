id: PSA.54.4
reference: Psalms 54:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י זָרִ֨ים קָ֤מוּ עָלַ֗/י וְֽ֭/עָרִיצִים בִּקְשׁ֣וּ נַפְשִׁ֑/י לֹ֤א שָׂ֨מוּ אֱלֹהִ֖ים לְ/נֶגְדָּ֣/ם סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/004.yaml
  text: For strangers have risen against me[a], and ruthless men seek my life; they do not set God before them[c][b]. Selah
translation:
  language: te
  text: ఎందుకంటే, పరాయివారు నాకు విరోధంగా లేచారు[a]; క్రూరులు[b] నా ప్రాణం తీయాలని చూస్తున్నారు[c]. వారు దేవుణ్ణి తమ ఎదుట ఉంచుకోరు. సెలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విదేశీయులు’ లేదా ‘అపరిచితులు’ అని కూడా అనువదించవచ్చు. హీబ్రూ זָרִים అనే పదం పరాయివారు, సంబంధంలేనివారు లేదా విదేశీయులను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘క్రూరులు’ అనే చోట ‘హింసాత్మకులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా, ‘నా ప్రాణాన్ని వెదుకుతున్నారు.’ ఇక్కడ ‘ప్రాణం’ కీర్తనకర్త జీవాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఈ వాక్యం పరిసర సందర్భంలోని ప్రార్థనకు కారణాన్ని తెలియజేస్తుంది; కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: זָרִים
  choice: పరాయివారు
  rationale: ఈ పదం అపరిచితులు, సంబంధంలేనివారు లేదా విదేశీయులు అనే భావాలను ఇవ్వగలదు. సందర్భం తప్పనిసరిగా జాతిపరంగా విదేశీయులనే సూచించదు కాబట్టి ‘పరాయివారు’ మూలంలోని విస్తృతిని బాగా కాపాడుతుంది.
- source_word: קָמוּ עָלַי
  choice: నాకు విరోధంగా లేచారు
  rationale: ఈ హీబ్రూ ప్రయోగం శత్రుత్వంతో ఎదిరించడాన్ని సూచిస్తుంది; ‘లేచారు’ అనే మూల చిత్రణను కూడా నిలుపుతుంది.
- source_word: עָרִיצִים
  choice: క్రూరులు
  rationale: బలాత్కారంగా, నిర్దయగా, అణచివేసేలా ప్రవర్తించేవారిని సూచించే పదం. ‘క్రూరులు’ సాధారణ పాఠకులకు సహజంగా ఉండి దాని నైతిక తీవ్రతను నిలుపుతుంది.
- source_word: בִּקְשׁוּ נַפְשִׁי
  choice: నా ప్రాణం తీయాలని చూస్తున్నారు
  rationale: బెదిరింపు సందర్భంలో נֶפֶשׁ వ్యక్తి జీవాన్ని సూచిస్తుంది. తెలుగులో ఈ ప్రయోగం శత్రువులు అతన్ని చంపాలని ప్రయత్నిస్తున్నారనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לֹא שָׂמוּ אֱלֹהִים לְנֶגְדָּם
  choice: వారు దేవుణ్ణి తమ ఎదుట ఉంచుకోరు
  rationale: దేవుణ్ణి తమ దృష్టిలో లేదా నైతిక అవగాహనలో ఉంచుకోకపోవడం అనే మూల రూపకాన్ని వ్యాఖ్యానంతో భర్తీ చేయకుండా నిలుపుతుంది.
- source_word: סֶלָה
  choice: సెలా
  rationale: దీని ఖచ్చితమైన సంగీత లేదా ఆరాధనా విధి అనిశ్చితంగా ఉన్నందున అనువదించకుండా లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: బెదిరింపు సందర్భంలో נֶפֶשׁ యొక్క మానవశాస్త్ర సంబంధమైన అర్థం
  choice: ‘ఆత్మ’ అని కాకుండా ‘ప్రాణం’ అని అనువదించడం
  alternative: ఆత్మ
  rationale: ఇక్కడ శత్రువులు కీర్తనకర్తను చంపాలని ప్రయత్నిస్తున్నారు. అందువల్ల శరీరం నుంచి వేరైన ఆత్మ అనే భావాన్ని పాఠ్యంలోకి చేర్చకుండా, נֶפֶשׁ యొక్క సందర్భోచితమైన జీవం/వ్యక్తి భావాన్ని ‘ప్రాణం’ తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా వచనం. ‘తమ ఎదుట ఉంచుకోరు’ అనే పదబంధం మూలంలోని రూపకాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది; ‘సెలా’ సంప్రదాయ లిప్యంతరీకరణగా ఉంచబడింది.
