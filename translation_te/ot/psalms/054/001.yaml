translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తన శీర్షికకు తగిన గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. హీబ్రూ అలంకార ప్రశ్నను ప్రకటనగా మార్చకుండా ‘కదా?’ రూపంలో నిలిపాం.
