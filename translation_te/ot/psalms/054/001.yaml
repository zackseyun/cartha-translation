revisions:
- from: జీఫీయులు సౌలు దగ్గరకు వచ్చి, “దావీదు మా మధ్య[a] దాక్కొని ఉన్నాడు కదా?” అని చెప్పినప్పుడు.
  to: జీఫీయులు వచ్చి సౌలుతో, “దావీదు మా మధ్య[a] దాక్కొని ఉన్నాడా?” అని చెప్పినప్పుడు.
  rationale: “సౌలుతో” is placed with the speech verb rather than with “వచ్చి,” avoiding an unsupported specification of where the Ziphites came. The question is recast as a direct Telugu interrogative, preserving the Hebrew rhetorical question. The source is a heading-style temporal clause, so the final “అని చెప్పినప్పుడు” remains intentionally dependent rather than being expanded into a complete sentence.
