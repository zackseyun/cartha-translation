id: PSA.54.1
reference: Psalms 54:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/ב֣וֹא הַ֭/זִּיפִים וַ/יֹּאמְר֣וּ לְ/שָׁא֑וּל הֲ/לֹ֥א דָ֝וִ֗ד מִסְתַּתֵּ֥ר עִמָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/001.yaml
  text: when the Ziphites came and said to Saul[a], “Is not David hiding among us?”
translation:
  language: te
  text: జీఫీయులు వచ్చి సౌలుతో, “దావీదు మా మధ్య[a] దాక్కొని ఉన్నాడా?” అని చెప్పినప్పుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మాతో.” హీబ్రూ పదానికి అక్షరార్థం “మాతో”; అయితే దావీదు జీఫీయుల ప్రాంతంలో లేదా వారి మధ్య దాక్కొని ఉన్నాడనే భావాన్ని “మా మధ్య” స్పష్టంగా తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא
  choice: వచ్చి … చెప్పినప్పుడు
  rationale: בְּ + בוא క్రియానామ రూపం కాలసూచక ఉపవాక్యాన్ని ప్రవేశపెడుతుంది. తెలుగు వాక్య నిర్మాణంలో ప్రధాన నివేదన క్రియతో కలిపి ‘వచ్చి … చెప్పినప్పుడు’ అనడం సహజంగా ఉంటుంది.
- source_word: הַזִּיפִים
  choice: జీఫీయులు
  rationale: ఇది జీఫు ప్రాంత నివాసులను సూచించే బహువచన జాతివాచకం; ‘జీఫీయులు’ సంక్షిప్తంగా, స్పష్టంగా ఆ సమూహ గుర్తింపును తెలియజేస్తుంది.
- source_word: וַיֹּאמְרוּ
  choice: అని చెప్పినప్పుడు
  rationale: אמר యొక్క కథన రూపం సాధారణంగా ‘చెప్పారు’ అనే అర్థం ఇస్తుంది; కాలసూచక శీర్షిక వాక్యాన్ని సహజ తెలుగులో పూర్తి చేయడానికి ‘అని చెప్పినప్పుడు’గా ఇచ్చాం.
- source_word: לְשָׁאוּל
  choice: సౌలు దగ్గరకు
  rationale: לְ పరోక్ష కర్మను సూచిస్తుంది. రావడం మరియు చెప్పడం రెండింటి సందర్భంలో ‘సౌలు దగ్గరకు’ సహజమైన తెలుగు ప్రయోగం.
- source_word: הֲלֹא
  choice: కదా?
  rationale: సానుకూల సమాధానాన్ని ఆశించే అలంకార ప్రశ్నను ఆధునిక తెలుగులో ‘కదా?’ సహజంగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: דָוִד
  choice: దావీదు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: מִסְתַּתֵּר
  choice: దాక్కొని ఉన్నాడు
  rationale: סתר హిత్పయేల్ వర్తమాన కృదంతం తనను తాను మరుగుచేసుకొని కొనసాగుతున్న స్థితిని సూచిస్తుంది; ‘దాక్కొని ఉన్నాడు’ ఆ కొనసాగుతున్న భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עִמָּנוּ
  choice: మా మధ్య
  rationale: పదశః ‘మాతో’ అయినా, ఇక్కడ దావీదు జీఫీయుల ప్రాంతంలో లేదా వారి సమూహం నడుమ దాక్కొని ఉన్నాడనే సందర్భార్థాన్ని ‘మా మధ్య’ స్పష్టంగా అందిస్తుంది; పదశః ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
