source:
  edition: WLC
  text: בִּ/נְדָבָ֥ה אֶזְבְּחָה לָּ֑/ךְ א֤וֹדֶה שִּׁמְ/ךָ֖ יְהוָ֣ה כִּי טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/007.yaml
  text: I will sacrifice a freewill offering to you[a]; I will give thanks to your name, O Yahweh[c][b], for it is good.
translation:
  language: te
  text: స్వచ్ఛంద అర్పణగా నీకు బలి అర్పిస్తాను[a]; యాహ్వే[c], నీ నామానికి కృతజ్ఞతలు తెలుపుతాను, ఎందుకంటే అది మంచిది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘స్వచ్ఛంద అర్పణగా’ అని ఉంది; దీనిని ‘స్వచ్ఛందంగా’ లేదా ‘ఇష్టపూర్వకంగా బలి అర్పిస్తాను’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా ‘ఎందుకంటే మంచిది’ అని ఉంది; కర్త స్పష్టంగా లేదు. దీన్ని ‘నీ నామం మంచిది’ అని లేదా ‘ఆయన మంచివాడు’—అంటే యాహ్వే మంచివాడు—అని అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: c
    text: హీబ్రూ దైవనామం YHWH; సంప్రదాయంగా దీనిని ‘ప్రభువు’ అని అనువదిస్తారు. దీనిని ‘యెహోవా’ అని కూడా లిప్యంతరీకరిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְדָבָה
  choice: స్వేచ్ఛార్పణతో
  rationale: נְדָבָה అనేది స్వచ్ఛందంగా సమర్పించే అర్పణను సూచిస్తుంది. זבח అనే బలి సంబంధ క్రియతో కలిసి ఉన్నందున కేవలం ‘ఇష్టపూర్వకంగా’ అనే క్రియావిశేషణ భావం కాకుండా అర్పణ భావాన్ని ప్రధాన పాఠ్యంలో నిలిపింది.
- source_word: אֶזְבְּחָה
  choice: బలి అర్పిస్తాను
  rationale: זבח యొక్క బలి సమర్పణ భావాన్ని ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לָּךְ
  choice: నీకు
  rationale: బలి ఎవరికో సమర్పించబడుతుందో తెలిపే ל ఉపసర్గ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: אוֹדֶה
  choice: కృతజ్ఞతలు చెల్లిస్తాను
  rationale: హిఫిల్ రూపంలోని ידה ఇక్కడ కృతజ్ఞత ప్రకటించడం లేదా స్తుతించడం అనే భావం కలిగి ఉంది; ‘నీ నామానికి’తో సహజంగా కలిసే కృతజ్ఞత భావాన్ని ఎంచుకుంది.
- source_word: שִׁמְךָ
  choice: నీ నామానికి
  rationale: హీబ్రూలో స్పష్టంగా ఉన్న ‘నీ నామం’ అనే నిబంధనాత్మక వ్యక్తీకరణను ‘నీకు’గా కుదించకుండా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: తరువాతి మాట కృతజ్ఞతకు కారణాన్ని తెలియజేస్తున్న సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: טוֹב
  choice: అది మంచిది
  rationale: హీబ్రూలో కర్త స్పష్టంగా లేకపోవడంతో, సమీపంలోని ‘నీ నామం’ను సూచించే సంభావ్య పఠనాన్ని ప్రధాన పాఠ్యంలో ఉంచుతుంది; దేవునినే సూచించే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని వాడుతుంది. తెలుగులో స్థిరంగా పరిచయమైన ‘యెహోవా’ రూపం పేరును పేరుగానే నిలుపుతుంది; ఇతర సంప్రదాయ రూపాలను పాదటిప్పణిలో తెలియజేస్తుంది.
- issue: כִּי טוֹב లో טוֹב యొక్క సూచ్యం
  choice: ఎందుకంటే అది మంచిది — ‘నీ నామం’ను సూచిస్తుంది
  alternative: ఎందుకంటే ఆయన మంచివాడు — యెహోవాను నేరుగా సూచిస్తుంది
  rationale: హీబ్రూ విశేషణానికి స్పష్టమైన కర్త లేదు. సమీపంలోని ‘నీ నామం’తో అనుసంధానించే పఠనం సహజమైనదైనా, యెహోవాను నేరుగా సూచించే పఠనం కూడా సాధ్యమే; అందువల్ల అస్పష్టతను పాదటిప్పణిలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ప్రార్థనా గాంభీర్యాన్ని కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ‘బలి అర్పిస్తాను’, ‘కృతజ్ఞతలు చెల్లిస్తాను’ వంటి సహజ పదబంధాలు ఎంచుకోబడ్డాయి; మూలంలోని భావసందిగ్ధత పాదటిప్పణుల్లో నిలుపబడింది.
