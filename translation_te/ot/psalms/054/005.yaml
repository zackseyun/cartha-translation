source:
  edition: WLC
  text: הִנֵּ֣ה אֱ֭לֹהִים עֹזֵ֣ר לִ֑/י אֲ֝דֹנָ֗/י בְּֽ/סֹמְכֵ֥י נַפְשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/005.yaml
  text: Behold[a], God is my helper[b]; the Lord is among those who sustain my life.
translation:
  language: te
  text: ఇదిగో, దేవుడు నాకు సహాయకుడు; ప్రభువు నా ప్రాణాన్ని[b] నిలబెట్టేవారిలో ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువే నా ప్రాణాన్ని నిలబెట్టేవాడు.” “నా ప్రాణాన్ని నిలబెట్టేవారిలో” అనే హీబ్రూ వాక్యనిర్మాణం క్లిష్టమైనది; కొన్ని అనువాదాలు ప్రభువునే నేరుగా నిలబెట్టేవానిగా అర్థం చేసుకుంటాయి.
    reason: alternative_reading
  - marker: b
    text: “ప్రాణం” అని అనువదించిన హీబ్రూ పదం נֶפֶשׁ (నెఫెష్); సందర్భానుసారం ఇది “జీవితం,” “వ్యక్తి/స్వయం,” లేదా “ఆత్మ” అని అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షిస్తూ దృఢమైన ప్రకటనను పరిచయం చేసే కణం; కీర్తనలోని ఉన్నతమైన కావ్యబలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఇక్కడ ఏకవచన భావంలో వాక్యానికి కర్తగా ఉన్న సాధారణ దైవనామం.
- source_word: עֹזֵר לִי
  choice: నాకు సహాయకుడు
  rationale: עֹזֵר అనే క్రియావిశేషణ రూపం వ్యక్తిగతంగా సహాయం చేసే వానిని సూచిస్తుంది; לִי లోని ప్రయోజనార్థక సంబంధాన్ని ‘నాకు’ స్పష్టంగా నిలుపుతుంది.
- source_word: אֲדֹנָי
  choice: ప్రభువు
  rationale: ఇది మానవ యజమానిని కాక దేవుని బిరుదును సూచిస్తుంది; గౌరవభరితమైన సహజ తెలుగు రూపం.
- source_word: בְּסֹמְכֵי
  choice: నిలబెట్టేవారిలో ఉన్నాడు
  rationale: בְּ తో కూడిన బహువచన క్రియావిశేషణ నిర్మాణం కఠినమైనది. ఈ అనువాదం దానిని సహవాసం లేదా సమూహంలో ఉండడం అనే సాధ్యమైన భావంతో తీసుకొని, మూలంలోని బహువచనాన్ని నిలుపుతుంది.
- source_word: נַפְשִׁי
  choice: నా ప్రాణాన్ని
  rationale: ఈ ప్రమాదసందర్భంలో נֶפֶשׁ వ్యక్తి జీవితం లేదా సజీవమైన స్వరూపాన్ని సూచిస్తుంది; ‘ప్రాణం’ జీవితం అనే భావాన్ని సహజంగా అందిస్తూ ‘ఆత్మ’ అనే సంకుచిత ద్వైతార్థాన్ని రుద్దదు.
theological_decisions:
- issue: אֲדֹנָי అనే దైవబిరుదు
  choice: ప్రభువు
  alternative: యజమాని
  rationale: సందర్భంలో ఇది మానవ యజమానిని కాదు, దేవుని అధికారాన్ని సూచించే బిరుదు.
- issue: בְּסֹמְכֵי נַפְשִׁי అనే కఠిన వాక్యనిర్మాణం
  choice: ప్రభువు నా ప్రాణాన్ని నిలబెట్టేవారిలో ఉన్నాడు
  alternative: ప్రభువే నా ప్రాణాన్ని నిలబెట్టేవాడు
  rationale: మసొరా పాఠంలోని בְּ మరియు బహువచన క్రియావిశేషణాన్ని ప్రధాన పాఠంలో నిలుపుతూ, ప్రభువే ప్రత్యక్షంగా నిలబెట్టేవాడు అనే ప్రాచుర్యమైన ప్రత్యామ్నాయ నిర్మాణాన్ని పాదసూచికలో ఇస్తుంది; తద్వారా నిజమైన అస్పష్టత పరిష్కరించబడదు.
- issue: נַפְשִׁי యొక్క భావం
  choice: నా ప్రాణాన్ని
  alternative: నా ఆత్మను
  rationale: శత్రువుల మధ్య రక్షణ అనే సందర్భంలో మొత్తం జీవితం లేదా వ్యక్తిని సూచించే భావం బలంగా ఉంది; శరీరం-ఆత్మ విభజనను అనవసరంగా దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గౌరవభరితమైన కావ్యశైలి. మూలంలోని సంక్షిప్త సమాంతర నిర్మాణం మరియు రెండవ అర్ధపాదంలోని వాక్యనిర్మాణ అస్పష్టతను ప్రధాన పాఠం, పాదసూచికల ద్వారా నిలుపుకున్నాం.
