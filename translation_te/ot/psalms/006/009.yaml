translation:
  language: te
  text: 'యాహ్వే నా మొర విన్నాడు;

    యాహ్వే నా ప్రార్థనను స్వీకరిస్తాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తీసుకుంటాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హెబ్రీ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: שָׁמַע
  choice: విన్నాడు
  rationale: సందర్భంలో పూర్తయిన కార్యాన్ని తెలియజేసే qatal రూపాన్ని సహజమైన ఆధునిక తెలుగులో ‘విన్నాడు’గా ఇచ్చాం; దేవుడు మొరను ఇప్పటికే విన్నాడనే కీర్తనకర్త నిశ్చయాన్ని ఇది నిలుపుతుంది.
- source_word: תְּחִנָּתִי
  choice: నా మొర
  rationale: ఈ పదం కృప లేదా కనికరం కోరే హృదయపూర్వక విన్నపాన్ని సూచిస్తుంది. ‘మొర’ సాధారణ పాఠకులకు సహజంగా ఉండి, దాని భావోద్వేగ తీవ్రతను తెలియజేస్తుంది.
- source_word: תְּפִלָּתִי
  choice: నా ప్రార్థనను
  rationale: ప్రార్థనకు వాడే సాధారణ హెబ్రీ పదాన్ని ‘ప్రార్థన’గా ఇచ్చి, ముందున్న תְּחִנָּה (‘మొర’)తో ఉన్న పదభేదాన్ని కాపాడాం.
- source_word: יִקָּח
  choice: స్వీకరిస్తాడు
  rationale: לָקַח అనే క్రియకు అక్షరార్థం ‘తీసుకొను’; అయితే ప్రార్థన కర్మగా ఉన్న ఈ సందర్భంలో ‘స్వీకరించు’ సహజమైన భావం. అసంపూర్ణ క్రియారూపంలోని భవిష్యత్ నిశ్చయాన్ని ‘స్వీకరిస్తాడు’ నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో దైవ నామమే నేరుగా ఉంది. కాబట్టి దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు సమీపమైన ‘యాహ్వే’గా ఇచ్చాం.
- issue: יִקָּח క్రియలో ప్రార్థన అంగీకరించబడుతుందనే భావం
  choice: స్వీకరిస్తాడు
  alternative: తీసుకుంటాడు
  rationale: ‘స్వీకరిస్తాడు’ సందర్భోచితమైన తెలుగు; అయితే మూలక్రియలోని అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచి, ‘అంగీకరిస్తాడు’ అనే మరింత వ్యాఖ్యానాత్మక భావాన్ని ప్రధాన పాఠంలో బలవంతంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన కవితా వాక్యనిర్మాణం వాడాం. హెబ్రీ సమాంతర నిర్మాణాన్ని రెండు పాదాలుగా నిలిపి, תְּחִנָּה మరియు תְּפִלָּה మధ్య తేడాను ‘మొర’ మరియు ‘ప్రార్థన’తో కాపాడాం. పాదటిప్పణి గుర్తును అది వివరిస్తున్న రెండవ పాదంలోని క్రియ తర్వాత ఉంచాం.
