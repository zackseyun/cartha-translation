id: PSA.6.4
reference: Psalms 6:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שׁוּבָ֣/ה יְ֭הוָה חַלְּצָ֣/ה נַפְשִׁ֑/י ה֝וֹשִׁיעֵ֗/נִי לְמַ֣עַן חַסְדֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/004.yaml
  text: Return, O LORD; rescue my life; save me for the sake of your steadfast love.
translation:
  language: te
  text: యెహోవా, తిరిగి రా; నా ప్రాణాన్ని విడిపించు; నీ నిబద్ధ ప్రేమనుబట్టి నన్ను రక్షించు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוּבָה
  choice: తిరిగి రా
  rationale: దేవుడు మరల తన సన్నిధి, అనుగ్రహం చూపాలని చేసే ప్రత్యక్ష విజ్ఞప్తిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: חַלְּצָה
  choice: విడిపించు
  rationale: ప్రమాదం లేదా కష్టంనుంచి లాగి తప్పించే భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: נַפְשִׁי
  choice: నా ప్రాణాన్ని
  rationale: ఇక్కడ נֶפֶשׁ విడిగా ఉన్న అమూర్త ‘ఆత్మ’కన్నా వ్యక్తి జీవప్రాణాన్ని సూచిస్తుంది; ‘ప్రాణం’ ఆ భావాన్ని సహజంగా కాపాడుతుంది.
- source_word: חַסְדֶּךָ
  choice: నీ నిబద్ధ ప్రేమ
  rationale: חֶסֶד లోని స్థిరమైన, సంబంధనిష్ఠమైన ప్రేమ భావాన్ని తెలిపి, కేవలం సాధారణ దయగా కుదించదు.
theological_decisions:
- issue: దేవుడు ‘తిరిగి రావాలి’ అనే విజ్ఞప్తి
  choice: తిరిగి రా
  alternative: మా వైపు తిరుగు
  rationale: మూలంలోని సంక్షిప్త ఆజ్ఞారూపాన్ని, దానిలోని ప్రార్థనా ఉద్వేగాన్ని వ్యాఖ్యానంతో సడలించకుండా ఉంచింది.
- issue: రక్షణకు ఆధారంగా חֶסֶד
  choice: నీ నిబద్ధ ప్రేమనుబట్టి
  alternative: నీ కృపనుబట్టి
  rationale: రక్షణ దేవుని స్వభావం మరియు సంబంధనిష్ఠ ప్రేమపై ఆధారపడిందనే వాక్యంలోని బలాన్ని కాపాడుతుంది; నిర్దిష్ట సిద్ధాంత పదజాలాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనకు తగిన గౌరవభరితమైన ప్రత్యక్ష సంబోధన. మూడు సమాంతర విజ్ఞప్తుల లయను నిలిపింది; మూలంలో లేని వివరణను చేర్చలేదు.
