lexical_decisions:
- source_word: וְנַפְשִׁי
  choice: నా ప్రాణమూ
  rationale: נֶפֶשׁ ఇక్కడ వ్యక్తి అంతరంగాన్ని, జీవాన్ని లేదా స్వయాన్ని సూచించగలదు. ‘నా ప్రాణం’ దాని కవితాత్మక, భావోద్వేగ బలాన్ని నిలుపుతుంది; ‘-మూ’ ఆరంభ సంధికారకాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נִבְהֲלָה מְאֹד
  choice: ఎంతో కలవరపడుతోంది
  rationale: בהל భయంతో లేదా తీవ్ర ఆందోళనతో దిగ్భ్రాంతి చెందడాన్ని సూచిస్తుంది; מְאֹד తీవ్రతను పెంచుతుంది. ఈ ఎంపిక సందర్భంలోని గాఢమైన వేదనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְאַתָּה
  choice: అయితే నీవు
  rationale: וְ సాధారణంగా ‘మరియు’ అయినా, ఇక్కడ విలాపం నుంచి దేవునికి నేరుగా చేసే విజ్ఞప్తికి అకస్మాత్తుగా మళ్లడాన్ని సూచిస్తుంది. ‘అయితే’ ఆ వ్యతిరేక మలుపును తెలుగులో సహజంగా చూపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: עַד מָתָי
  choice: ఇంకెంతకాలం?
  rationale: హీబ్రూ విలాపాల్లోని ఈ సుపరిచిత ప్రశ్న నిరీక్షణలోని వేదనను, అత్యవసరతను వ్యక్తం చేస్తుంది. ‘ఇంకెంతకాలం?’ తెలుగులో సహజంగా అదే బలాన్ని అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాక దేవుని ప్రత్యేక నామం ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా పేరుగానే ఉంచాం; తెలుగు బైబిల్ వాడుకలో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: וְאַתָּה తరువాత వాక్యం అసంపూర్ణంగా నిలిచే ఉద్వేగం
  choice: ‘అయితే నీవు, యెహోవా—ఇంకెంతకాలం?’ అని విరామంతో ఉంచడం
  alternative: ‘యెహోవా, నీవు ఇంకెంతకాలం ఆలస్యం చేస్తావు?’ అని క్రియను చేర్చడం
  rationale: మూలంలో దేవుడు ఏమి చేయాలి లేదా ఎంతకాలం ఏమి కొనసాగుతుందో స్పష్టంగా చెప్పలేదు. క్రియను చేర్చి భావాన్ని నిర్ణయించకుండా, విలాపంలోని ఉద్దేశపూర్వక అసంపూర్ణతను, ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కవితాత్మక శైలిని వాడాం. డాష్ ద్వారా మూలంలోని అకస్మాత్తు మలుపు, అసంపూర్ణ విలాపం నిలుపబడ్డాయి.
