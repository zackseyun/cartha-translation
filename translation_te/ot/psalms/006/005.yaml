id: PSA.6.5
reference: Psalms 6:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י אֵ֣ין בַּ/מָּ֣וֶת זִכְרֶ֑/ךָ בִּ֝/שְׁא֗וֹל מִ֣י יֽוֹדֶה לָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/005.yaml
  text: For in death there is no remembrance of you[a]; in Sheol who will give thanks to you?
translation:
  language: te
  text: ఎందుకంటే మరణంలో నిన్ను స్మరించడం ఉండదు; షియోల్‌లో[a] నీకు కృతజ్ఞతలు చెల్లించేవారు ఎవరు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సమాధిలో’ లేదా ‘మృతుల లోకంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న విన్నపానికి కారణాన్ని పరిచయం చేసే వివరణాత్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֵין
  choice: ఉండదు
  rationale: ఉనికిని నిరాకరించే హీబ్రూ నిర్మాణాన్ని తెలుగు వాక్యరీతిలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בַּמָּוֶת
  choice: మరణంలో
  rationale: స్థానార్థక భావాన్ని నిలుపుతూ, రెండో పాదంలోని ‘షియోల్‌లో’ అనే పదంతో ఉన్న కవితాత్మక సమాంతరతను కాపాడుతుంది.
- source_word: זִכְרֶךָ
  choice: నిన్ను స్మరించడం
  rationale: ఈ పదంలో ఉన్న జ్ఞాపకం చేసుకోవడం లేదా ప్రస్తావించడం అనే భావాన్ని సహజంగా అందిస్తుంది; తదుపరి పాదంలోని కృతజ్ఞతాస్తుతితో సంబంధాన్ని కూడా నిలుపుతుంది.
- source_word: בִּשְׁאוֹל
  choice: షియోల్‌లో
  rationale: హీబ్రూ భావప్రపంచంలోని ప్రత్యేక పదాన్ని ‘సమాధి’ అనే మరింత సంకుచిత అర్థానికి పరిమితం చేయకుండా లిప్యంతరీకరిస్తుంది.
- source_word: מִי
  choice: ఎవరు
  rationale: అలంకారిక ప్రశ్నను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יוֹדֶה לָּךְ
  choice: నీకు కృతజ్ఞతలు చెల్లించేవారు
  rationale: ידה హిఫీల్ రూపంలోని ‘కృతజ్ఞతలు తెలుపు, స్తుతించు’ అనే భావాలలో మొదటిదాన్ని నేరుగా, సులభంగా అందిస్తుంది.
theological_decisions:
- issue: שְׁאוֹל పదాన్ని అనువదించడం
  choice: షియోల్
  alternative: సమాధి; మృతుల లోకం
  rationale: ‘షియోల్’ అనే లిప్యంతరీకరణ హీబ్రూ పదంలోని సాంస్కృతిక, భావపరమైన ప్రత్యేకతను నిలుపుతుంది; దానిని కేవలం భౌతిక సమాధిగా లేదా తరువాతి కాలపు నిర్దిష్ట పరలోక సిద్ధాంతంగా నిర్ణయించదు. అర్థసహాయక ప్రత్యామ్నాయాలు పాదటిప్పణిలో ఇవ్వబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కవితాత్మక శైలి. మూలంలోని రెండు సమాంతర పాదాలు, కారణార్థక ఆరంభం, అలంకారిక ప్రశ్న నిలుపబడ్డాయి. ‘షియోల్’ అనే పదానికి పాదటిప్పణి గుర్తు అదే పదం వెంట ఉంచబడింది.
