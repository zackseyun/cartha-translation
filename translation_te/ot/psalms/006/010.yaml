source:
  edition: WLC
  text: יֵבֹ֤שׁוּ וְ/יִבָּהֲל֣וּ מְ֭אֹד כָּל אֹיְבָ֑/י יָ֝שֻׁ֗בוּ יֵבֹ֥שׁוּ רָֽגַע׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/010.yaml
  text: Let all my enemies be ashamed and greatly terrified[a]; let them turn back and be ashamed in an instant.
translation:
  language: te
  text: నా శత్రువులందరూ సిగ్గుపడి, ఎంతో భయభ్రాంతులకు లోనవుతారు[a]; వారు వెనుదిరిగి, క్షణంలోనే సిగ్గుపడతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా శత్రువులందరూ సిగ్గుపడి, ఎంతో భయభ్రాంతులకు లోనవుగాక; వారు వెనుదిరిగి, అకస్మాత్తుగా సిగ్గుపడుగాక.”
    reason: హీబ్రూ క్రియారూపాలను ధీమాతో చేసిన ప్రకటనగా గానీ, కోరిక లేదా విన్నపంగా గానీ అర్థం చేసుకోవచ్చు; అలాగే రָגַעకు ‘క్షణంలోనే’ లేదా ‘అకస్మాత్తుగా’ అనే భావాలు సాధ్యమే.
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: సిగ్గుపడతారు
  rationale: בוש అనే పదంలోని సిగ్గు, అవమానం అనే భావాన్ని నిలుపుతుంది. ఈ కవితా సందర్భంలోని అసంపూర్ణ క్రియారూపాన్ని ప్రార్థనకు లభించే ఫలితంపై ధీమాగా కూడా చదవవచ్చు; అందువల్ల సహజమైన తెలుగు భవిష్యదర్థ రూపం వాడబడింది.
- source_word: וְיִבָּהֲלוּ
  choice: భయభ్రాంతులకు లోనవుతారు
  rationale: בהל సూచించే ఆకస్మికమైన తీవ్ర భయం లేదా కలవరాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מְאֹד
  choice: ఎంతో
  rationale: తీవ్రతను సూచించే מְאֹד భావాన్ని సరళంగా, సహజంగా తెలియజేస్తుంది.
- source_word: כָּל אֹיְבָי
  choice: నా శత్రువులందరూ
  rationale: సంబంధ నిర్మాణం మరియు ప్రథమ పురుష ఏకవచన ప్రత్యయాన్ని ఖచ్చితంగా, సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: יָשֻׁבוּ
  choice: వారు వెనుదిరిగి
  rationale: שׁוב యొక్క తిరుగు లేదా వెనుదిరుగు భావాన్ని నిలుపుతూ, అవసరానికి మించిన సైనిక భావాన్ని చేర్చదు.
- source_word: יֵבֹשׁוּ
  choice: సిగ్గుపడతారు
  rationale: హీబ్రూ కవితలో בוש పదం పునరావృతమైన దృష్ట్యా, తెలుగులోనూ అదే పదాన్ని పునరావృతం చేశారు.
- source_word: רָגַע
  choice: క్షణంలోనే
  rationale: ఇక్కడ క్రియావిశేషణంగా ఉన్న పదం సూచించే ఆకస్మికతను, తక్షణత్వాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: 'క్రియారూపాల భావం: విన్నపమా లేక ధీమాతో చేసిన ప్రకటననా'
  choice: ధీమాతో చేసిన భవిష్యదర్థ ప్రకటనగా ప్రధాన పాఠంలో అనువదించడం
  alternative: “సిగ్గుపడుగాక ... వెనుదిరిగి సిగ్గుపడుగాక” అనే విన్నపార్థ అనువాదం
  rationale: హీబ్రూ అసంపూర్ణ క్రియారూపాలు కవితా సందర్భంలో కోరికను లేదా ఆశాభరిత ధీమాను సూచించగలవు. ముందున్న కీర్తన సందర్భంలో యెహోవా ప్రార్థన ఆలకించాడనే ధీమా ఉన్నందున ప్రకటనార్థం సహజంగా సరిపోతుంది; అయినా విన్నపార్థ సాధ్యతను పాదటిప్పణిలో నిలిపారు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే భాష వాడబడింది. హీబ్రూ కవితలోని ‘సిగ్గుపడు’ పునరావృతం నిలుపబడింది; ‘భయభ్రాంతులకు లోనవుతారు’ తీవ్ర కలవరాన్ని సహజంగా వ్యక్తం చేస్తుంది.
