  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ס֣וּרוּ מִ֭מֶּ/נִּי כָּל פֹּ֣עֲלֵי אָ֑וֶן כִּֽי שָׁמַ֥ע יְ֝הוָ֗ה ק֣וֹל בִּכְיִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/008.yaml
  text: Depart from me[a], all you workers of wickedness[b], for Yahweh has heard the sound of my weeping.
translation:
  language: te
  text: దుర్మార్గం చేసేవారలారా,[a] మీరందరూ నా దగ్గర నుంచి తొలగిపోండి! ఎందుకంటే యహ్వే నా ఏడుపు స్వరాన్ని విన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అధర్మం చేసేవారలారా’; మరింత సంక్షిప్తంగా ‘దుర్మార్గులారా.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థంగా ‘నా ఏడుపు యొక్క స్వరం/ధ్వని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּרוּ מִמֶּנִּי
  choice: నా దగ్గర నుంచి తొలగిపోండి
  rationale: బహువచన ఆజ్ఞలోని బలాన్ని, కీర్తనకర్త నుంచి దూరంగా వెళ్లాలనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: దుర్మార్గం చేసేవారలారా, మీరందరూ
  rationale: כָּל యొక్క సమగ్ర భావాన్ని ‘మీరందరూ’ నిలుపుతుంది; פֹּעֲלֵי అనే ‘చేసేవారు’ భావాన్ని కుదించి ‘దుర్మార్గులు’ అని మాత్రమే అనకుండా స్పష్టంగా ఉంచుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఆజ్ఞకు కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: שָׁמַע
  choice: విన్నాడు
  rationale: పూర్తయిన క్రియను సహజమైన తెలుగు భూతకాల రూపంలో అందిస్తుంది; సందర్భంలో దాని ప్రస్తుత ప్రాముఖ్యత కీర్తనకర్త ధైర్యం ద్వారా స్పష్టమవుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సాధారణ ధ్వన్యనుకరణగా అందిస్తుంది.
- source_word: קוֹל בִּכְיִי
  choice: నా ఏడుపు స్వరం
  rationale: ‘నా ఏడుపు యొక్క స్వరం/ధ్వని’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ, అది వినిపించే రోదన అని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. అందువల్ల దాన్ని బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా ధ్వన్యనుకరణగా ఉంచాం; ‘యహ్వే’ రూపం మూలనామానికి దగ్గరగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా స్వరాన్ని ఉంచాం. సంబోధనను ముందుకు తెచ్చి, బహువచన ఆజ్ఞను బలంగా వినిపించాం. ఆంగ్ల సంప్రదింపు పాఠంలో పాదసూచిక గుర్తుల స్థానాలు వాటి విషయంతో సరిపోలకపోవడంతో, మూలభాష ఆధారంగా [a]ను ‘దుర్మార్గం చేసేవారు’ దగ్గర, [b]ను ‘ఏడుపు స్వరం’ దగ్గర ఉంచాం.
