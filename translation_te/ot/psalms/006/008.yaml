  source_fidelity: The translation accurately represents the plural imperative סוּרוּ מִמֶּנִּי ('go away from me'), the inclusive vocative כָּל פֹּעֲלֵי אָוֶן, the causal כִּי, and the perfect שָׁמַע. ‘నా ఏడుపు స్వరాన్ని’ appropriately conveys קוֹל בִּכְיִי as the audible sound/voice of the psalmist’s weeping. ‘యహ్వే’ faithfully renders the Tetragrammaton without replacing it with a title.
  naturalness: The wording is clear, forceful, and suitable for modern standard Telugu in a poetic-prayer register. The fronted vocative and emphatic ‘మీరందరూ’ are natural rhetorical Telugu, while preserving the verse’s direct confrontation.
  terminology: ‘దుర్మార్గం చేసేవారలారా’ preserves the participial ‘workers/doers of wickedness’ rather than reducing it simply to ‘wicked people.’ ‘యహ్వే’ is consistently and appropriately used for יהוה. Both footnotes give legitimate lexical alternatives, and their anchors are correctly placed in the Telugu text.
