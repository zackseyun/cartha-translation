  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יְֽהוָ֗ה אַל בְּ/אַפְּ/ךָ֥ תוֹכִיחֵ֑/נִי וְֽ/אַל בַּ/חֲמָתְ/ךָ֥ תְיַסְּרֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/001.yaml
  text: O Yahweh[a], do not rebuke me in your anger[c][b], and do not discipline me in your wrath.
translation:
  language: te
  text: యాహ్వే[a], నీ కోపంలో నన్ను గద్దించకు; నీ ఉగ్రతలో నన్ను క్రమశిక్షణతో దిద్దకు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ దైవనామం יהוה. సంప్రదాయ తెలుగు బైబిలు వాడుకలో దీనిని ‘యెహోవా’ అని కూడా రాస్తారు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘నన్ను శిక్షించకు’ లేదా ‘నన్ను దిద్దకు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచి, ప్రత్యక్ష సంబోధనను సహజంగా వ్యక్తం చేసింది.
- source_word: אַל
  choice: చేయకు
  rationale: అసంపూర్ణ క్రియారూపంతో వచ్చిన నిషేధార్థక కణం ఇక్కడ ప్రార్థనాత్మక విజ్ఞప్తిని సూచిస్తుంది; తెలుగు ఏకవచన ప్రత్యక్ష సంబోధనలో ‘చేయకు’ సహజంగా ఉంది.
- source_word: בְּאַפְּךָ
  choice: నీ కోపంలో
  rationale: אַף అక్షరార్థంగా ‘ముక్కు’ అయినా ఇక్కడ కోపాన్ని సూచించే హీబ్రూ నుడికారం; בְּ తో కలిసి ‘నీ కోపంలో’ అని అనువదించడం భావాన్ని, కవితా నిర్మాణాన్ని నిలుపుతుంది.
- source_word: תוֹכִיחֵנִי
  choice: నన్ను గద్దించకు
  rationale: יכח హిఫిల్ రూపం ఇక్కడ తప్పును ఎత్తిచూపుతూ గద్దించడం లేదా మందలించడం అనే భావాన్ని ఇస్తుంది. ‘గద్దించకు’ గంభీరంగానూ సాధారణ పాఠకులకు స్పష్టంగానూ ఉంది.
- source_word: וְאַל
  choice: చేయకు
  rationale: సంయోజక అవ్యయం మరియు నిషేధార్థక కణం రెండో సమాంతర విజ్ఞప్తిని కలుపుతున్నాయి; తెలుగులో విరామచిహ్నంతో సమాంతర నిర్మాణం స్పష్టంగా ఉండటంతో అదనపు ‘మరియు’ అవసరం లేదు.
- source_word: בַּחֲמָתְךָ
  choice: నీ ఉగ్రతలో
  rationale: חֵמָה మండే తీవ్ర ఆగ్రహాన్ని సూచిస్తుంది. మొదటి పాదంలోని ‘కోపం’తో తేడాను ఉంచుతూ ‘ఉగ్రత’ తీవ్రతను, కవితా గాంభీర్యాన్ని కాపాడుతుంది.
- source_word: תְיַסְּרֵנִי
  choice: నన్ను శిక్షించకు
  rationale: יסר పియేల్ రూపానికి క్రమశిక్షణ కలిగించడం, దిద్దడం, శిక్షణ ద్వారా సరిచేయడం వంటి పరిధి ఉంది. ‘శిక్షించకు’ ఈ సందర్భంలో సహజమైన తెలుగు; అయితే అది కేవలం ప్రతీకార శిక్ష అనే సంకుచిత భావానికి పరిమితం కాకుండా ఉండేందుకు పాదటిప్పణిలో ప్రత్యామ్నాయం ఇచ్చింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో దైవనామం నేరుగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగానే ఉంచాం; తెలుగు క్రైస్తవ వాడుకలో విస్తృతంగా తెలిసిన ‘యెహోవా’ రూపాన్ని ప్రధాన పాఠంలో ఎంచుకుని, పునర్నిర్మిత ఉచ్చారణ ‘యాహ్వే’ను పాదటిప్పణిలో తెలిపాం.
- issue: దైవ అసంతృప్తిని తెలిపే సమాంతర పదాల భేదం
  choice: కోపం / ఉగ్రత
  alternative: కోపం / తీవ్రమైన కోపం
  rationale: אַף మరియు חֵמָה సంబంధితమైనా ఒకే పదం కావు. రెండు వేరు తెలుగు పదాలతో సమాంతరతను, రెండో పదంలోని అధిక తీవ్రతను నిలిపాం.
- issue: יסר యొక్క దిద్దుబాటు మరియు శిక్ష భావాల మధ్య ఉద్రిక్తత
  choice: శిక్షించకు
  alternative: క్రమశిక్షణలో పెట్టకు
  rationale: సందర్భంలోని దైవ ఉగ్రత ‘శిక్షించు’ అనే సహజ పదానికి అనుకూలంగా ఉన్నా, హీబ్రూ క్రియలో దిద్దుబాటు-శిక్షణ భావం కూడా ఉంది. ప్రధాన పాఠం ఆ భావాన్ని పూర్తిగా పరిష్కరించకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రార్థనా-కవితా శైలిని ఉపయోగించాం. ఏకవచన ప్రత్యక్ష సంబోధనలోని ‘నీ’, ‘చేయకు’ రూపాలు హీబ్రూ ప్రార్థన యొక్క సాన్నిహిత్యాన్ని నిలుపుతాయి. రెండు పాదాల సమాంతర నిర్మాణాన్ని అర్థవిరామంతో స్పష్టపరిచాం.
