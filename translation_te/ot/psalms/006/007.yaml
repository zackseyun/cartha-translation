translation:
  language: te
  text: 'దుఃఖంతో నా కన్ను క్షీణించింది[a];

    నా శత్రువులందరి కారణంగా అది ముసలిదైంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చికాకుతో నా కన్ను మసకబారింది; నా విరోధులందరి కారణంగా అది వాడిపోయింది.”
    reason: עָשְׁשָׁה, כַּעַס, עָתְקָה పదాలకు సందర్భానుసారం ‘మసకబారడం,’ ‘చికాకు,’ ‘వాడిపోవడం’ అనే భావాలు కూడా సాధ్యమైనందున ఈ పఠనాన్ని సూచించాం.
lexical_decisions:
- source_word: עָשְׁשָׁה
  choice: క్షీణించింది
  rationale: ఈ క్రియ క్షయించడం, నీరసించడం, విఫలమవడం అనే భావాన్ని ఇస్తుంది. కన్ను అనే కర్తతో ‘క్షీణించింది’ శారీరక క్షయ చిత్రాన్ని సహజంగా నిలుపుతుంది; చూపు మసకబారడానికే భావాన్ని పరిమితం చేయదు.
- source_word: מִכַּעַס
  choice: దుఃఖంతో
  rationale: כַּעַס దుఃఖం, వేదన, చికాకు లేదా ఆగ్రహాన్ని సూచించగలదు. ఈ వ్యక్తిగత విలాప సందర్భంలో శారీరక క్షీణతకు కారణమైన మనోవేదనను ‘దుఃఖంతో’ సహజంగా తెలియజేస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: עֵינִי
  choice: నా కన్ను
  rationale: హీబ్రూలో ఏకవచనం, ప్రథమ పురుష ఏకవచన ప్రత్యయం ఉన్నాయి. మూలంలోని ఏకవచన శరీర చిత్రాన్ని తెలుగులోనూ నిలిపాం.
- source_word: עָתְקָה
  choice: ముసలిదైంది
  rationale: ఈ క్రియ ముసలితనం చెందడం లేదా వాడిపోవడం అనే రూపక భావాన్ని ఇస్తుంది. ‘ముసలిదైంది’ మూలంలోని అసాధారణమైనా ఉద్దేశపూర్వకమైన క్షీణత రూపకాన్ని నిలుపుతుంది.
- source_word: בְּכָל
  choice: అందరి కారణంగా
  rationale: ఇక్కడ בְ శత్రువుల సమూహాన్ని ఆ పరిస్థితికి కారణం లేదా సందర్భంగా సూచిస్తుంది. తెలుగులో ‘కారణంగా’ ఆ సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: צוֹרְרָי
  choice: నా శత్రువులు
  rationale: צרר నుంచి వచ్చిన ఈ రూపం విరోధంగా నిలిచేవారిని లేదా బాధించేవారిని సూచిస్తుంది. విలాప సందర్భంలో ‘నా శత్రువులు’ సహజమైన, తగినంత బలమైన పదప్రయోగం.
