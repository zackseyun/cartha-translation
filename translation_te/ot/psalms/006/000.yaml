  yaml_path: translation/ot/psalms/006/000.yaml
  text: 'For the choirmaster: with stringed instruments, according to the Sheminith[a]. A psalm of David[b].'
translation:
  language: te
  text: సంగీత నాయకునికి. తంతివాద్యాలతో, షెమీనీత్[a] ప్రకారం. దావీదు కీర్తన[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీ: షెమీనీత్. బహుశా ‘ఎనిమిదవది,’ అష్టక స్వరస్థాయి లేదా ఎనిమిది తీగల వాద్యం కావచ్చు.'
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దావీదు రచించిన కీర్తన’ లేదా ‘దావీదు కోసం కీర్తన’; హెబ్రీ పదబంధం రచయితత్వాన్ని గానీ, దావీదుతో ఉన్న ఇతర అనుబంధాన్ని గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకునికి
  rationale: కీర్తనల శీర్షికల్లో ఈ పదం సంగీత ప్రదర్శనను పర్యవేక్షించే వ్యక్తిని సూచిస్తుంది. ‘సంగీత నాయకుడు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, కేవలం సాధారణ నాయకత్వం కంటే సంగీత సందర్భాన్ని బాగా తెలియజేస్తుంది.
- source_word: בִּנְגִינוֹת
  choice: తంతివాద్యాలతో
  rationale: ఈ పదం ఇక్కడ తంతివాద్య సంగీతాన్ని లేదా తంతివాద్యాలను సూచిస్తుంది. ‘తంతివాద్యాలతో’ అనేది వాయించే విధానం గురించి అవసరానికి మించి నిర్దిష్టతను చేర్చకుండా వాద్యార్థాన్ని నిలుపుతుంది.
- source_word: עַל
  choice: ప్రకారం
  rationale: సంగీత శీర్షికల్లో ఈ విభక్తి సంగీత పద్ధతి, స్వరస్థాయి, రాగం లేదా వాద్య నిర్దేశాన్ని పరిచయం చేయవచ్చు. ‘ప్రకారం’ అనే పదం వీటిలో ఒక్కదానినే నిర్ణయించకుండా మూలంలోని అనిశ్చితిని కాపాడుతుంది.
- source_word: הַשְּׁמִינִית
  choice: షెమినీతు
  rationale: దీని ఖచ్చితమైన సాంకేతిక అర్థం నిర్ధారితం కాదు; ‘ఎనిమిదవది’, అష్టక స్వరస్థాయి లేదా ఎనిమిది తీగల వాద్యం కావచ్చు. అందువల్ల తప్పుడు నిర్దిష్టతను నివారించడానికి హెబ్రీ పదాన్ని లిప్యంతరీకరించాం.
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: సంగీత ప్రదర్శనతో సంబంధమున్న గీతానికి వాడే ప్రామాణిక పదం. కీర్తనల గ్రంథ సందర్భంలో ‘కీర్తన’ సహజమైన, స్థిరపడిన తెలుగు సమానార్థకం.
- source_word: לְדָוִד
  choice: దావీదు కీర్తన
  rationale: לְ అనే ఉపసర్గ రచయితను, సంబంధాన్ని, అంకితాన్ని లేదా సంకలన అనుబంధాన్ని సూచించవచ్చు. తెలుగులో ‘దావీదు కీర్తన’ ఈ సంబంధాన్ని సంక్షిప్తంగా తెలియజేస్తూ, ‘దావీదు రచించిన’ అని అతిగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: శీర్షికలో לְדָוִד సూచించే రచయితత్వం లేదా అనుబంధం
  choice: దావీదు కీర్తన
  alternative: దావీదు రచించిన కీర్తన; దావీదు కోసం కీర్తన
  rationale: హెబ్రీ నిర్మాణం ప్రత్యక్ష రచయితత్వాన్నే తప్పనిసరిగా నిర్ధారించదు. ఎంపిక చేసిన రూపం దావీదుతో ఉన్న సంబంధాన్ని ఉంచుతూ, ఆ సంబంధ స్వభావాన్ని పాదసూచికలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన సంగీత-ఆరాధనా శైలి వాడబడింది. తెలియని సాంకేతిక సంగీత పదాన్ని ప్రధాన పాఠంలో లిప్యంతరీకరించి, సాధ్యమైన అర్థాలను పాదసూచికలో ఇచ్చాం.
