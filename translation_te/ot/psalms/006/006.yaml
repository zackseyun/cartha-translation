  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יָגַ֤עְתִּי בְּֽ/אַנְחָתִ֗/י אַשְׂחֶ֣ה בְ/כָל לַ֭יְלָה מִטָּתִ֑/י בְּ֝/דִמְעָתִ֗/י עַרְשִׂ֥/י אַמְסֶֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/006.yaml
  text: I am weary with my groaning[a]; every night I drench my bed[b]; with my tears I soak my couch.
translation:
  language: te
  text: 'నా మూలుగుతో[a] నేను అలసిపోయాను;

    ప్రతి రాత్రీ నా మంచాన్ని ముంచెత్తుతున్నాను[b];

    నా కన్నీళ్లతో నా పరుపును తడిపేస్తున్నాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా నిట్టూర్పుతో.”
    reason: alternative_reading
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “నా మంచాన్ని ఈదేలా చేస్తున్నాను”; ఇది కన్నీళ్లతో దాన్ని ముంచెత్తడాన్ని తెలిపే కవితాత్మక అతిశయోక్తి.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגַעְתִּי
  choice: నేను అలసిపోయాను
  rationale: ఈ క్రియ దీర్ఘకాల బాధవల్ల కలిగిన అలసటను, నిస్సత్తువను సూచిస్తుంది. తెలుగు సంపూర్ణ క్రియారూపం ప్రస్తుతం అనుభవిస్తున్న ఫలితస్థితినీ సహజంగా తెలియజేస్తుంది.
- source_word: בְּאַנְחָתִי
  choice: నా మూలుగుతో
  rationale: אַנְחָה నిట్టూర్పు, మూలుగు, వేదనతో కూడిన శ్వాస అనే భావాలను కలిగి ఉంది. సందర్భంలోని శరీరబద్ధమైన విలాపాన్ని ‘మూలుగు’ స్పష్టంగా నిలుపుతుంది.
- source_word: אַשְׂחֶה
  choice: ముంచెత్తుతున్నాను
  rationale: హిఫిల్ రూపం అక్షరార్థంగా మంచాన్ని ‘ఈదేలా చేయడం’ అనే అతిశయోక్తి చిత్రాన్ని ఇస్తుంది. ‘ముంచెత్తుతున్నాను’ ఆ చిత్రపు తీవ్రతను సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בְכָל־לַיְלָה
  choice: ప్రతి రాత్రీ
  rationale: ఈ పదబంధం ఒకే రాత్రి అంతటినీ కాక, రాత్రి రాత్రికీ పునరావృతమయ్యే విలాపాన్ని సూచించడం సహజం.
- source_word: מִטָּתִי
  choice: నా మంచాన్ని
  rationale: מִטָּה సాధారణంగా నిద్రించే మంచాన్ని సూచిస్తుంది; ‘మంచం’ ఆధునిక తెలుగులో స్పష్టమైన సమానార్థకం.
- source_word: בְּדִמְעָתִי
  choice: నా కన్నీళ్లతో
  rationale: בְּ ఇక్కడ సాధనాన్ని సూచిస్తుంది. ‘కన్నీళ్లతో’ అనే రూపం మూలంలోని సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: עַרְשִׂי
  choice: నా పరుపును
  rationale: עֶרֶשׂ పడుకునే స్థలాన్ని లేదా శయ్యను సూచిస్తుంది. ‘పరుపు’ అని అనువదించడం ముందున్న מִטָּהకు వాడిన ‘మంచం’తో ఉన్న కవితాత్మక పదవైవిధ్యాన్ని కాపాడుతుంది.
- source_word: אַמְסֶה
  choice: తడిపేస్తున్నాను
  rationale: ఈ హిఫిల్ రూపం అక్షరార్థంగా కరిగించడం లేదా కరిగిపోయేలా చేయడం; ఇక్కడ కన్నీళ్లతో పూర్తిగా తడపడం అనే అతిశయోక్తి భావంలో ఉంది. ‘తడిపేస్తున్నాను’ స్పష్టంగా, సహజంగా ఆ తీవ్రతను తెలియజేస్తుంది.
