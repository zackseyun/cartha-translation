translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన విలాప స్వరం ఉంచబడింది. ‘మంచం/పరుపు’ అనే పదవైవిధ్యంతో హీబ్రూ సమాంతర నిర్మాణం నిలుపబడింది; అతిశయోక్తిని ప్రధాన వాక్యంలో సహజంగా ఇచ్చి, అక్షరార్థ చిత్రాన్ని పాదటిప్పణిలో తెలిపాం.
