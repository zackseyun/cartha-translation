review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the two imperatives, the divine name, and the literal image of ‘bones.’ However, both occurrences of כִּי explicitly give the reason for the plea; semicolons alone leave that causal relation implicit. Also, ‘క్షీణించిపోయాను’ can suggest a completed decline more strongly than the Hebrew adjective requires.
  naturalness: The Telugu is generally clear and appropriately reverent. Explicit ‘ఎందుకంటే’ is both natural modern Telugu and more faithful to the Hebrew poetic logic.
  terminology: ‘యాహ్వే,’ ‘కృప చూపు,’ ‘స్వస్థపరచు,’ and ‘ఎముకలు’ are suitable. ‘బలహీనంగా ఉన్నాను’ is a clearer, more direct rendering of אֻמְלַל while the footnote preserves the languishing/wasting nuance.
  issues:
  - severity: medium
    issue: The causal force of כִּי is not represented explicitly in either clause.
    rationale: In both cola, כִּי means ‘for/because’ and grounds the request. Replacing it merely with a semicolon weakens an overt source-language connection.
  - severity: low
    issue: ‘క్షీణించిపోయాను’ is somewhat more resultative than the Hebrew adjective.
    rationale: אֻמְלַל denotes being feeble, languishing, or wasted. ‘నేను బలహీనంగా ఉన్నాను’ directly conveys the present state without implying a completed process.
  revised_text: యాహ్వే, నాపై కృప చూపు, ఎందుకంటే నేను బలహీనంగా ఉన్నాను[a]. యాహ్వే, నన్ను స్వస్థపరచు, ఎందుకంటే నా ఎముకలు వణికిపోతున్నాయి[b].
