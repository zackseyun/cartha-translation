source:
  edition: WLC
  text: חָנֵּ֥/נִי יְהוָה֮ כִּ֤י אֻמְלַ֫ל אָ֥נִי רְפָאֵ֥/נִי יְהוָ֑ה כִּ֖י נִבְהֲל֣וּ עֲצָמָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/002.yaml
  text: Be gracious to me[a], O Yahweh, for I am weak; heal me, O Yahweh[b], for my bones are trembling.
translation:
  language: te
  text: యాహ్వే, నాపై కృప చూపు, ఎందుకంటే నేను బలహీనంగా ఉన్నాను[a]. యాహ్వే, నన్ను స్వస్థపరచు, ఎందుకంటే నా ఎముకలు వణికిపోతున్నాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నేను క్షీణించిపోయాను’ లేదా ‘వాడిపోతున్నాను’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం క్షీణించి, నీరసించిన స్థితిని వర్ణిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నా ఎముకలు కలవరపడ్డాయి’ లేదా ‘భయభ్రాంతికి లోనయ్యాయి’ అని కూడా అనువదించవచ్చు. ‘ఎముకలు’ అనే మాట లోతైన శారీరక లేదా అంతరంగిక వేదనను వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: నాపై కృప చూపు
  rationale: חנן క్రియారూపం అనుగ్రహం లేదా దయ చూపమనే విన్నపాన్ని వ్యక్తం చేస్తుంది. ‘నాపై కృప చూపు’ మూలంలోని భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ లిప్యంతరీకరణను తెలుగులో అందించాం.
- source_word: כִּי
  choice: ;
  rationale: ఈ రెండు చోట్ల כִּי విన్నపానికి కారణాన్ని పరిచయం చేస్తుంది. తెలుగులో అర్ధవిరామం ద్వారా ఆ కారణసంబంధం సహజంగా, సంక్షిప్తంగా వ్యక్తమవుతుంది.
- source_word: אֻמְלַל
  choice: క్షీణించిపోయాను
  rationale: ఈ పదం నీరసించి, వాడిపోతున్న లేదా బలహీనమైన స్థితిని సూచిస్తుంది. ‘క్షీణించిపోయాను’ ఆ కొనసాగుతున్న దురవస్థ తీవ్రతను సహజంగా తెలియజేస్తుంది.
- source_word: רְפָאֵנִי
  choice: నన్ను స్వస్థపరచు
  rationale: רפא నేరుగా స్వస్థపరచడం లేదా నయం చేయడాన్ని సూచిస్తుంది. సందర్భం శారీరక బాధతో పాటు వ్యక్తి అంతటినీ ఆవరించే వేదనకు కూడా వీలు ఇస్తుంది.
- source_word: נִבְהֲלוּ
  choice: వణికిపోతున్నాయి
  rationale: בהל తీవ్రంగా కలవరపడడం, భయభ్రాంతికి లోనవడం అనే భావాలను కలిగి ఉంది. ‘ఎముకలు’ అనే కర్తతో ‘వణికిపోతున్నాయి’ శరీరమంతటా అనుభవిస్తున్న తీవ్ర వేదనను స్పష్టంగా వ్యక్తం చేస్తుంది; ఇతర భావసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: עֲצָמָי
  choice: నా ఎముకలు
  rationale: మూలంలోని స్పష్టమైన శరీరరూపకాన్ని మార్చకుండా ‘నా ఎముకలు’ అని అనువదించాం; ఇది లోతైన శారీరక లేదా అంతరంగిక వేదనను కూడా సూచించవచ్చు.
theological_decisions:
- issue: יהוה దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలపాఠాన్ని పారదర్శకంగా నిలుపుతుంది.
- issue: ‘ఎముకలు’ వణకడం అనే వాక్యంలోని వేదన స్వరూపం
  choice: రూపకాన్ని అలాగే ఉంచి ‘నా ఎముకలు వణికిపోతున్నాయి’
  alternative: ‘నా అంతరంగం కలవరపడుతోంది’
  rationale: పాఠం శారీరక బాధకూ, లోతైన అంతరంగిక కలవరానికీ అవకాశం ఇస్తుంది. ‘ఎముకలు’ అనే మూలరూపకాన్ని నిలుపడం ద్వారా ఈ ఉద్దేశపూర్వక విస్తృతిని ఏకపక్షంగా నిర్ణయించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కవితాత్మక శైలిని వాడాం. రెండు సమాంతర విన్నపాల నిర్మాణాన్ని నిలిపి, సహజ తెలుగు కారణసంబంధం కోసం అర్ధవిరామాలను ఉపయోగించాం.
