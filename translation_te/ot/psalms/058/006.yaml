source:
  edition: WLC
  text: אֱֽלֹהִ֗ים הֲרָס שִׁנֵּ֥י/מוֹ בְּ/פִ֑י/מוֹ מַלְתְּע֥וֹת כְּ֝פִירִ֗ים נְתֹ֣ץ יְהוָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/006.yaml
  text: God[a], break their teeth in their mouths; shatter the fangs of the young lions[b], O Yahweh.
translation:
  language: te
  text: దేవా, వారి నోటిలో వారి పళ్లను విరగగొట్టు; యువ సింహాల దవడపళ్లను పగులగొట్టు, యాహ్వే.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కోరపళ్లను.’ హీబ్రూ పదం బలంగా నమిలే పళ్లను లేదా దవడపళ్లను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘YHWH’; ఇది దేవుని వ్యక్తిగత నామం, ఇక్కడ ‘యాహ్వే’గా లిప్యంతరీకరించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ఇది ప్రత్యక్ష సంబోధన; ఆధునిక తెలుగులో సంబోధనార్థక రూపం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הֲרָס
  choice: విరగగొట్టు
  rationale: హీబ్రూ క్రియకు ‘పడగొట్టు/ధ్వంసం చేయు’ అనే బలమైన భావం ఉంది; పళ్లు కర్మగా ఉన్నందున ‘విరగగొట్టు’ సహజమైన, సజీవమైన సమానార్థకం.
- source_word: שִׁנֵּימוֹ
  choice: వారి పళ్లను
  rationale: బహువచన నామవాచకానికి మూడవ పురుష బహువచన ప్రత్యయం ఉన్నదాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: בְּפִימוֹ
  choice: వారి నోటిలోనే
  rationale: בְ అనే విభక్తి సూచించే ‘లో’ అనే స్థానార్థాన్ని నిలుపుతూ, తెలుగు వాక్యంలో దృశ్యానికి బలం చేకూర్చేందుకు ‘నే’ వాడబడింది.
- source_word: מַלְתְּעוֹת
  choice: దవడపళ్లను
  rationale: ఈ పదం నమిలే లేదా దవడలోని బలమైన పళ్లను సూచిస్తుంది. ‘దవడపళ్లు’ మూలపద భావాన్ని ‘కోరపళ్లు’ కంటే తక్కువ వ్యాఖ్యానాత్మకంగా కాపాడుతుంది.
- source_word: כְּפִירִים
  choice: యువ సింహాల
  rationale: చిన్న కూనలకంటే బలమైన యువ సింహాలను సూచించే సాధారణ హీబ్రూ ప్రయోగాన్ని ప్రతిబింబిస్తుంది.
- source_word: נְתֹץ
  choice: ఊడగొట్టు
  rationale: ఈ ఆజ్ఞార్థక క్రియలో విరగ్గొట్టడం లేదా తొలగిపోయేలా పడగొట్టడం అనే బలమైన భావం ఉంది; దవడపళ్ల సందర్భంలో ‘ఊడగొట్టు’ సహజంగా ఆ బలవంతపు తొలగింపును తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన నాలుగు హీబ్రూ అక్షరాల పేరును బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో బిరుదు కాకుండా దేవుని వ్యక్తిగత నామం ఉంది; అందువల్ల దానిని లిప్యంతరీకరించడం మూల భేదాన్ని నిలుపుతుంది.
- issue: శత్రువులపై హింసాత్మక శాపప్రార్థన దృశ్యం
  choice: పళ్లు విరగగొట్టి దవడపళ్లు ఊడగొట్టమనే స్పష్టమైన దృశ్యాన్ని నిలుపడం
  alternative: ‘వారి శక్తిని తొలగించు’ అని భావానువాదం చేయడం
  rationale: మూల హీబ్రూలో ఉద్దేశపూర్వకంగా శరీరసంబంధమైన, తీవ్ర దృశ్యం ఉంది. దానిని నైరూప్యమైన మాటగా మృదువుపరచకుండా కవితాత్మక ఉద్రేకాన్ని నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా-ప్రార్థనా శైలి. ‘దేవా’ అనే సంబోధన, సమాంతరంగా ‘యెహోవా’ అనే నామసంబోధన నిలుపబడ్డాయి. హింసాత్మక రూపకాన్ని మృదువుపరచలేదు; అయితే సాధారణ పాఠకుడికి అర్థమయ్యే పదాలను ఎంచుకున్నాం.
