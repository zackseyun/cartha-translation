  text: Even in your heart you work injustice[b][a]; on the earth your hands weigh out violence.
translation:
  language: te
  text: మీ హృదయంలో కూడా మీరు అన్యాయం చేస్తున్నారు; భూమిపై[b] మీ చేతులు హింసను తూచి పంచుతున్నాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హింసను కొలిచి పంచుతున్నాయి.’ హీబ్రూ క్రియకు తూచడం లేదా కొలవడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘భూమిపై’ అనే మాటను ‘దేశంలో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: అవును
  rationale: ఆరోపణను బలంగా నొక్కిచెప్పే అవ్యయంగా తీసుకున్నాం; సహజమైన ఆధునిక తెలుగులో ‘అవును’ ఆ ఉద్ఘాటనను తెలియజేస్తుంది.
- source_word: בְּלֵב
  choice: హృదయంలోనే
  rationale: בְּ ను స్థానార్థకంగా తీసుకొని అంతరంగ సంకల్పాన్ని సూచించాం; ‘నే’ ఉద్ఘాటన אַף యొక్క బలాన్ని కూడా సహజంగా మోస్తుంది.
- source_word: עוֹלֹת
  choice: అన్యాయాన్ని
  rationale: న్యాయవిచారణ నేపథ్యానికి సరిపోయే నైతిక, సామాజిక తప్పును ‘అన్యాయం’ స్పష్టంగా వ్యక్తపరుస్తుంది; హీబ్రూ బహువచనాన్ని తెలుగులో సహజమైన సమూహార్థ ఏకవచనంగా ఇచ్చాం.
- source_word: תִּפְעָלוּן
  choice: జరిగిస్తున్నారు
  rationale: פעל లోని ఉద్దేశపూర్వకంగా చేయడం/కార్యసాధన భావాన్ని ప్రస్తుత ఆరోపణకు తగిన విధంగా వ్యక్తపరుస్తుంది.
- source_word: בָּאָרֶץ
  choice: భూమిపై
  rationale: అంతరంగ సంకల్పానికి ఎదురుగా బహిరంగ కార్యాన్ని సూచించే విస్తృతార్థాన్ని నిలుపుతుంది; ‘దేశంలో’ కూడా సాధ్యమే.
- source_word: חֲמַס
  choice: హింసను
  rationale: חמס యొక్క ప్రధాన భావమైన హింసాత్మక దుర్మార్గాన్ని నేరుగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: יְדֵיכֶם
  choice: మీ చేతులు
  rationale: కార్యాలు మరియు బాధ్యతను సూచించే స్పష్టమైన శరీరరూపకాన్ని యథాతథంగా నిలిపాం.
- source_word: תְּפַלֵּסוּן
  choice: తూచి పంచుతున్నారు
  rationale: פלס లోని తూకం వేయడం/కొలవడం అనే రూపకాన్ని నిలుపుతూ, హింసను ఇతరులకు కేటాయించే భావం తెలుగులో స్పష్టంగా వినిపించేలా ‘పంచుతున్నారు’ జోడించాం.
theological_decisions:
- issue: న్యాయవిచారణ సందర్భంలో చివరి క్రియ యొక్క రూపకార్థం
  choice: ‘హింసను తూచి పంచుతున్నారు’ అని అనువదించి తూకం వేసి కేటాయించే రూపకాన్ని నిలపడం
  alternative: ‘హింసను కొలిచి ఇస్తున్నారు’ లేదా ‘హింసను పంచుతున్నారు’
  rationale: కీర్తనలోని అవినీతిపరులైన తీర్పరులపై ఆరోపణలో, న్యాయాన్ని తూచి ఇవ్వవలసిన చేతులే హింసను తూచి పంచుతున్నాయనే వ్యంగ్యాన్ని ఇది కాపాడుతుంది; ప్రత్యేక సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా ధోరణిని ఉంచాం. ‘హృదయంలోనే’ అంతరంగ ఉద్దేశాన్ని, ‘మీ చేతులు’ బహిరంగ కార్యసాధనను పరస్పరం ఎదురెదురుగా నిలుపుతాయి. పాదాంతంలో రెండు గమనికల గుర్తులూ ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
