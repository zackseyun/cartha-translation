  verdict: revise
  source_fidelity: The draft conveys the two Hebrew cola and preserves the imagery of inward injustice and hands weighing/measuring violence. However, “అవును” is not idiomatic Telugu for the emphatic accusatory particle אַף, and “జరిగిస్తున్నారు” does not naturally express the active transitive sense of תִּפְעָלוּן (“you do/work”).
  naturalness: “మీ హృదయంలో కూడా మీరు అన్యాయం చేస్తున్నారు” is natural modern Telugu and communicates the emphatic extension inward. “మీ చేతులు హింసను తూచి పంచుతున్నాయి” retains the concrete metaphor and is idiomatic enough in a poetic register. Footnote markers are placed directly after the words to which they apply.
  terminology: అన్యాయం appropriately renders עוֹלֹת in the judicial setting; హింస renders חָמָס directly. తూచి పంచుతున్నాయి preserves the weighing/distribution metaphor of תְּפַלֵּסוּן without adding a doctrinal interpretation.
  issues:
