    issue: “అవును” for אַף
    rationale: In this accusation, Telugu “అవును” reads chiefly as an affirmative response (“yes”), rather than as the Hebrew particle’s emphatic force (“indeed/even”).
  - severity: medium
    issue: “అన్యాయాన్ని జరుగిస్తున్నారు” for עוֹלֹת תִּפְעָלוּן
    rationale: జరుగిస్తున్నారు is not a natural active collocation with an్యాయం and weakens the deliberate “do/work” sense. “అన్యాయం చేస్తున్నారు” is direct and idiomatic.
  - severity: low
