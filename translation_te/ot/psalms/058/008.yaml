source:
  edition: WLC
  text: כְּמ֣וֹ שַׁ֭בְּלוּל תֶּ֣מֶס יַהֲלֹ֑ךְ נֵ֥פֶל אֵ֝֗שֶׁת בַּל חָ֥זוּ שָֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/008.yaml
  text: Like a snail that melts away as it goes[b][a], like a stillborn child that has not seen the sun.
translation:
  language: te
  text: 'కదులుతూ కరిగిపోయే నత్తలా,

    సూర్యుణ్ణి ఎన్నడూ చూడని మృతశిశువులా.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּמוֹ
  choice: లా
  rationale: ఉపమానాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: שַׁבְּלוּל
  choice: నత్త
  rationale: సంప్రదాయబద్ధమైన ప్రధాన అర్థం ‘నత్త’; కదులుతూ కరిగిపోతున్నదనే కవితా చిత్రానికి సరిపోతుంది.
- source_word: תֶּמֶס
  choice: కరిగిపోయే
  rationale: కరగడం లేదా క్షీణించిపోవడం అనే భావాన్ని క్రియాత్మకంగా, స్పష్టంగా అందిస్తుంది.
- source_word: יַהֲלֹךְ
  choice: నడుస్తూ
  rationale: మూలంలోని ‘వెళ్లు/నడుచు’ అనే భావాన్ని నత్త కదలికకు అనుగుణంగా సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: נֵפֶל אֵשֶׁת
  choice: మృతశిశువు
  rationale: స్త్రీ గర్భం నుంచి సజీవంగా జన్మించని శిశువు అనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది; తదుపరి వాక్యభాగం తల్లిని కాక శిశువునే సూచిస్తుందని స్పష్టం చేస్తుంది.
- source_word: בַּל חָזוּ
  choice: చూడని
  rationale: ‘వారు చూడలేదు’ అనే మూలంలోని బహువచన క్రియను తెలుగు ఉపమానంలో సహజంగా ఏకవచన సంబంధవాచక రూపంతో అందిస్తుంది; సంఖ్యా అసామ్యాన్ని పాదటీకలో సూచించింది.
- source_word: שָׁמֶשׁ
  choice: సూర్యుణ్ణి
  rationale: మూలపదానికి ప్రత్యక్షమైన, సహజమైన తెలుగు సమానం.
