translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని పాటించాం. కీర్తనలోని శాపార్థక సందర్భాన్ని చూపేందుకు చివర ‘అయిపోవాలి’ చేర్చాం. ‘మృతశిశువు’ సాధారణ పాఠకునికి స్పష్టంగా ఉండి, సంబంధవాక్యం తల్లికి అన్వయించే అపార్థాన్ని నివారిస్తుంది.
