  text: Their venom is like the venom of a serpent[a], like a deaf cobra that stops up its ear,
translation:
  language: te
  text: వారి విషం పాము విషంలాంటిది; చెవిటిదై తన చెవిని మూసుకునే నాగుపాములాంటిది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నాగుపాము’కు బదులు ‘విషసర్పం’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం פֶתֶן ఒక విషసర్పాన్ని సూచిస్తుంది, కానీ ఖచ్చితమైన జాతి నిర్ధారించబడలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת
  choice: విషం
  rationale: పాము అనే సందర్భంలో ఈ పదం ‘కోపం’ కంటే విషాన్ని, ప్రత్యేకంగా పాము విషాన్ని సూచిస్తుంది.
- source_word: לָמוֹ
  choice: వారి
  rationale: 'ఈ నిర్మాణంలో సర్వనామ రూపం తరువాతి నామవాచకంతో స్వామ్యార్థాన్ని ఇస్తుంది: ‘వారి విషం.’'
- source_word: כִּדְמוּת
  choice: లాంటిది
  rationale: పోలికను సహజమైన ఆధునిక తెలుగు కవితా వాక్యరూపంలో వ్యక్తం చేస్తుంది.
- source_word: נָחָשׁ
  choice: పాము
  rationale: సాధారణ వర్గాన్ని సూచించే సహజ తెలుగు పదం; తరువాత వచ్చే నిర్దిష్ట విషసర్పం నుండి దీనిని వేరు చేస్తుంది.
- source_word: כְּמוֹ
  choice: లాంటిది
  rationale: రెండవ ఉపమానాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: פֶתֶן
  choice: నాగుపాము
  rationale: హీబ్రూ పదం ఒక విషసర్పాన్ని సూచిస్తుంది; ఖచ్చితమైన జీవజాతి అనిశ్చితమైనా, ఆధునిక పాఠకునికి ‘నాగుపాము’ స్పష్టమైన సమానార్థకం. ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
- source_word: חֵרֵשׁ
  choice: చెవిటిదై
  rationale: ఇక్కడ మాటలేనిదని కాదు, విననిదని భావం; మంత్రగాడి స్వరాన్ని వినని సర్పచిత్రానికి సరిపోతుంది.
- source_word: יַאְטֵם
  choice: మూసుకునే
  rationale: మూయడం లేదా బిగించడం అనే క్రియార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אָזְנוֹ
  choice: తన చెవిని
  rationale: సర్పాన్నే కర్తగా ఉంచి, దాని స్వంత చెవిని మూసుకోవడం అనే ప్రతిబింబార్థాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
