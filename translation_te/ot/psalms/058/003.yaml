  terminology: '''దుష్టులు,'' ''గర్భం,'' ''దారితప్పి,'' and ''అబద్ధాలు పలుకుతున్నారు'' are standard and appropriate. The footnote properly identifies the literal womb/belly imagery and the poetic-hyperbolic character of the expression, without adding denominational conclusions.'
