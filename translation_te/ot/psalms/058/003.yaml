  source_fidelity: 'The translation accurately represents the Hebrew parallelism: זֹרוּ is conveyed as becoming estranged/alienated (''పరాయివారై ఉన్నారు''), מֵרָחֶם as ''గర్భం నుంచే,'' and תָּעוּ ... מִבֶּטֶן as going astray from earliest life (''పుట్టినప్పటి నుంచే దారితప్పి''). ''అబద్ధాలు పలుకుతున్నారు'' appropriately renders the participial characterization דֹּבְרֵי כָזָב. The wording retains the psalm’s force without recasting it as a technical doctrinal statement.'
