id: PSA.58.3
reference: Psalms 58:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: זֹ֣רוּ רְשָׁעִ֣ים מֵ/רָ֑חֶם תָּע֥וּ מִ֝/בֶּ֗טֶן דֹּבְרֵ֥י כָזָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/003.yaml
  text: The wicked are estranged from the womb; they go astray from birth[a], speaking lies.
translation:
  language: te
  text: 'దుష్టులు గర్భం నుంచే పరాయివారై ఉన్నారు;

    పుట్టినప్పటి నుంచే దారితప్పి, అబద్ధాలు పలుకుతున్నారు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “గర్భం నుండి” ... “ఉదరం/గర్భం నుండి.” దుష్టులు జీవితపు అత్యంత తొలి దశ నుంచే దారితప్పినవారనే భావాన్ని ఈ వచనం కవితాత్మక అతిశయోక్తితో తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹרוּ
  choice: పరాయివారై ఉన్నారు
  rationale: זור అనే క్రియలోని దూరమవడం లేదా పరాయివారవడం అనే భావాన్ని నిలుపుతుంది; దానిని కేవలం నైతిక భ్రష్టత్వంగా మాత్రమే పరిమితం చేయదు.
- source_word: רְשָׁעִים
  choice: దుష్టులు
  rationale: רְשָׁעִים అనే వర్గసూచక బహువచనానికి సహజమైన, ప్రామాణిక తెలుగు సమానం.
- source_word: מֵרָחֶם
  choice: గర్భం నుంచే
  rationale: మూలంలోని ‘గర్భం నుండి’ అనే బలమైన కవితాత్మక చిత్రాన్ని సహజమైన తెలుగులో నేరుగా నిలుపుతుంది.
- source_word: תָּעוּ
  choice: దారితప్పి
  rationale: תעה లోని మార్గం తప్పడం అనే భావాన్ని స్పష్టంగా అందించి, తరువాతి కొనసాగుతున్న క్రియతో సహజంగా కలుస్తుంది.
- source_word: מִבֶּטֶן
  choice: పుట్టినప్పటి నుంచే
  rationale: בטן అక్షరార్థంగా ‘ఉదరం/గర్భం’; అయితే సమాంతర రెండో పాదంలో ‘పుట్టినప్పటి నుంచే’ అనేది సహజంగా ఉండి, అతి తొలినాటి జీవితం అనే భావాన్ని అందిస్తుంది.
- source_word: דֹּבְרֵי כָזָב
  choice: అబద్ధాలు పలుకుతున్నారు
  rationale: భాగవాచక పదబంధంలోని నిరంతర లక్షణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָזָב
  choice: అబద్ధాలు
  rationale: మాటల సందర్భంలో ‘అసత్యం’ కంటే సాధారణ పాఠకులకు నేరుగా అర్థమయ్యే సహజమైన పదం.
theological_decisions:
- issue: ఈ వచనం గర్భస్థ దశలోనే వ్యక్తిగత నైతిక దోషాన్ని లేదా వారసత్వ పాప సిద్ధాంతాన్ని సాంకేతికంగా బోధిస్తున్నట్లు అనువదించాలా?
  choice: దుష్టులు జీవితపు అత్యంత తొలి దశ నుంచే దారితప్పినవారనే కీర్తనలోని కవితాత్మక అతిశయోక్తిని నిలుపడం.
  alternative: దీనిని గర్భధారణ నుంచే సంపూర్ణ భ్రష్టత్వం గురించిన ప్రత్యక్ష సిద్ధాంత ప్రకటనగా చేయడం; లేదా ఎలాంటి మానవ స్వభావ సంబంధిత ప్రాముఖ్యతలేని కేవలం నిందావాక్యంగా బలహీనపరచడం.
  rationale: ‘గర్భం నుంచే’ మరియు ‘పుట్టినప్పటి నుంచే’ అనే సమాంతర కవితా నిర్మాణం బలమైన నిందాత్మక చిత్రణ. అనువాదం దాని బలాన్ని నిలుపుతుంది గాని, మూలం స్పష్టంగా నిర్ధారించని వ్యవస్థీకృత సిద్ధాంతాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలి. ‘గర్భం నుంచే’ అనే మూలచిత్రాన్ని మొదటి పాదంలో నిలిపి, రెండో పాదంలో సహజమైన ‘పుట్టినప్పటి నుంచే’ వాడి హీబ్రూ సమాంతరతను స్పష్టంగా అందించాం. పాద విభజన భావసమాంతరతను చూపుతుంది.
