id: PSA.58.1
reference: Psalms 58:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הַֽ/אֻמְנָ֗ם אֵ֣לֶם צֶ֭דֶק תְּדַבֵּר֑וּ/ן מֵישָׁרִ֥ים תִּ֝שְׁפְּט֗וּ בְּנֵ֣י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/001.yaml
  text: Do you indeed speak righteousness in silence? Do you judge uprightly[c][b][a], sons of man?
translation:
  language: te
  text: మీరు నిజంగానే మౌనంగా[a] నీతిని పలుకుతున్నారా? మానవులారా[b], మీరు న్యాయంగా తీర్పు ఇస్తున్నారా?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ఇక్కడి హెబ్రీ పదం אֵלֶם క్లిష్టమైనది. మసొరెటిక్ పాఠంలోని స్వరచిహ్నాల ప్రకారం దానికి ‘మౌనం’ లేదా ‘మూగతనం’ అనే అర్థం వస్తుంది. మరికొందరు దాన్ని ‘బలవంతులారా’ లేదా ‘దేవతలారా’ అనే సంబోధనగా అర్థం చేసుకుంటారు; అప్పుడు భావం: ‘బలవంతులారా, మీరు నిజంగానే నీతిని పలుకుతున్నారా?’'
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, ‘మనిషి కుమారులారా’ లేదా ‘ఆదాము కుమారులారా’; భావార్థంగా, ‘మానవులారా.’
    reason: lexical_alternative
  - marker: c
    text: '‘మానవులారా’ అనే సంబోధనను రెండు ప్రశ్నలకూ వర్తింపజేసి ఇలా కూడా అమర్చవచ్చు: ‘మానవులారా, మీరు నిజంగానే మౌనంగా నీతిని పలుకుతున్నారా? మీరు న్యాయంగా తీర్పు ఇస్తున్నారా?’'
    reason: syntactic_alternative
lexical_decisions:
- source_word: הַאֻמְנָם
  choice: మీరు నిజంగానే … చేస్తున్నారా?
  rationale: ప్రశ్నార్థకమైన బలప్రయోగాన్ని, కీర్తనకర్త సవాలు చేసే ధ్వనిని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֵלֶם
  choice: మౌనంలో
  rationale: మసొరెటిక్ స్వరచిహ్నాల ప్రకారం మౌనం లేదా మూగతనం అనే భావాన్ని ప్రధాన పాఠంలో అనుసరిస్తుంది; వేరొక పఠనాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: צֶדֶק
  choice: నీతి
  rationale: మాటలలో ఉండవలసిన నైతిక, న్యాయ సంబంధమైన సరిగ్గా ఉండటాన్ని సూచించే హెబ్రీ నామవాచకానికి సన్నిహితమైన, సహజమైన తెలుగు పదం.
- source_word: תְּדַבֵּרוּן
  choice: పలుకుతున్నారా
  rationale: דבר క్రియ యొక్క సాధారణ భావాన్ని కవితాత్మక గౌరవంతో వ్యక్తపరుస్తుంది.
- source_word: מֵישָׁרִים
  choice: న్యాయంగా
  rationale: తీర్పులో సూటితనం, సమత్వం అనే భావాన్ని తెలుగులో సహజమైన క్రియావిశేషణంగా అందిస్తుంది.
- source_word: תִּשְׁפְּטוּ
  choice: తీర్పు తీరుస్తున్నారా
  rationale: సందర్భంలోని న్యాయపరమైన కార్యాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: בְּנֵי אָדָם
  choice: మనుష్య కుమారులారా
  rationale: ‘మనిషి/ఆదాము కుమారులు’ అనే హెబ్రీ రూపాన్ని, సంబోధనను మరియు మానవ మర్త్యత్వాన్ని గుర్తుచేసే ధ్వనిని నిలుపుతుంది.
theological_decisions:
- issue: అర్థం క్లిష్టంగా ఉన్న אֵלֶם పదం
  choice: ప్రధాన పాఠంలో మసొరెటిక్ స్వరచిహ్నాలను అనుసరించి ‘మౌనంలో’
  alternative: ‘బలవంతులారా’ లేదా ‘దేవతలారా’ అనే సంబోధన
  rationale: అందిన హెబ్రీ పాఠం మౌనం/మూగతనానికి సంబంధించిన పఠనానికి మద్దతిస్తుంది. అయితే ప్రత్యామ్నాయ పఠనం వాక్యార్థాన్ని గణనీయంగా మార్చుతుంది కాబట్టి దాన్ని పాదసూచికలో స్పష్టంగా భద్రపరచాలి.
- issue: בְּנֵי אָדָם సంబోధన పరిధి
  choice: హెబ్రీ పదక్రమానికి సమీపంగా రెండవ ప్రశ్నలో సంబోధనగా ఉంచడం
  alternative: రెండు ప్రశ్నలకూ వర్తిస్తుందని స్పష్టం చేయడానికి వచనం ఆరంభంలో ఉంచడం
  rationale: చివర ఉన్న హెబ్రీ సంబోధనను నిలుపుతూ, అది మొత్తం సవాలుకు వర్తించే అవకాశం పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే కీర్తనలోని గంభీరమైన న్యాయస్థాన సవాలు మరియు ఉద్దేశపూర్వక విరోధాభాసం నిలిచేలా రూపొందించబడింది. ‘మౌనంలో నీతిని పలకడం’ సహజీకరించకుండా ఉంచబడింది, ఎందుకంటే మూలపాఠమే క్లిష్టంగా ఉంది.
