source:
  edition: WLC
  text: בְּ/טֶ֤רֶם יָבִ֣ינוּ סִּֽירֹתֵי/כֶ֣ם אָטָ֑ד כְּמוֹ חַ֥י כְּמוֹ חָ֝ר֗וֹן יִשְׂעָרֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/009.yaml
  text: Before your pots can feel the thornbush[a], whether green or burning, he will sweep them away.
translation:
  language: te
  text: మీ కుండలకు ముళ్లపొద వేడి తగలకముందే[a], అది పచ్చిగా ఉన్నా మండుతున్నా, అతడు దానిని సుడిగాలిలా ఊడ్చివేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యం చాలా క్లిష్టమైనది. అక్షరార్థానికి దగ్గరగా, “మీ కుండలు ముళ్లపొదను గ్రహించకముందే—పచ్చిదానివలె, మండుట/కోపమువలె—అతడు దానిని లేదా అతనిని సుడిగాలిలా తీసివేస్తాడు” అని ఉంది. భావం బహుశా మంట కుండలకు వేడి తగలకముందే అకస్మాత్తుగా ఊడ్చివేయడం. చివరి మాటలను “అతడు కోపంతో దానిని/అతనిని ఊడ్చివేస్తాడు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: గ్రహించకముందే
  rationale: తరువాతి క్రియ జరగకముందే తీర్పు అకస్మాత్తుగా సంభవిస్తుందనే కాలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יָבִינוּ
  choice: వేడిని గ్రహించు
  rationale: సాధారణంగా ‘అర్థం చేసుకొను/గ్రహించు’ అని అర్థమయ్యే క్రియకు ఇక్కడ కుండలు కర్తలుగా ఉన్నాయి; ముళ్లపొద మంట వేడిని అవి ఇంకా పొందకముందే అనే రూపకార్థాన్ని ఈ ఎంపిక స్పష్టపరుస్తుంది.
- source_word: סִּירֹתֵיכֶם
  choice: మీ కుండలు
  rationale: వంటకు ఉపయోగించే పాత్రలను సూచించే సరళమైన, సహజమైన తెలుగు పదబంధం.
- source_word: אָטָד
  choice: ముళ్లపొద
  rationale: త్వరగా మండే ఇంధనంగా ఉపయోగించే ముళ్లతో కూడిన పొద అనే స్పష్టమైన దృశ్యాన్ని నిలుపుతుంది.
- source_word: כְּמוֹ חַי
  choice: పచ్చిగా ఉన్నా
  rationale: ఇంధనమైన పొద ఇంకా ఎండకుండా పచ్చిగా ఉన్న స్థితిని సందర్భానుసారంగా తెలియజేస్తుంది; ‘సజీవంగా’ అనే అక్షరార్థం తెలుగులో ఈ దృశ్యాన్ని అస్పష్టంగా చేస్తుంది.
- source_word: כְּמוֹ חָרוֹן
  choice: మండుతున్నా
  rationale: ‘మండే కోపం’ అని కూడా అర్థమయ్యే పదాన్ని ఇక్కడ అగ్ని దృశ్యానికి అనుగుణంగా ‘మండుతున్నా’ అని ఇచ్చాం; ‘కోపంతో’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: יִשְׂעָרֶנּוּ
  choice: సుడిగాలిలా ఊడ్చివేస్తాడు
  rationale: తుఫానులా లేదా సుడిగాలిలా హఠాత్తుగా తీసివేయడాన్ని సూచించే క్రియ యొక్క బలమైన కవితాత్మక భావాన్ని నిలుపుతుంది. మూలంలోని ఏకవచన కర్మప్రత్యయం సందర్భంలో అస్పష్టమైనందున ప్రధాన పాఠంలో కుండలను సూచించే ‘వాటిని’ వాడాం.
theological_decisions:
- issue: కఠినమైన అగ్ని-కుండల రూపకానికి అర్థం
  choice: ముళ్లపొద మంట కుండలను వేడెక్కించకముందే దుష్టులు అకస్మాత్తుగా ఊడ్చివేయబడతారనే దృశ్యం
  alternative: ముళ్లపొదను కుండలు గ్రహించకముందే, అది పచ్చిదైనా మండే కోపమైనా, ఆయన దానిని/అతనిని సుడిగాలిలో తీసివేస్తాడు
  rationale: ప్రధాన అనువాదం ఆకస్మిక తీర్పు అనే సందర్భార్థాన్ని సహజంగా అందిస్తుంది; అయితే חָרוֹן లోని ‘కోపం’ భావాన్నీ, చివరి కర్మప్రత్యయ అస్పష్టతనూ పాదసూచికలో భద్రపరచి వేదాంతపరమైన ఉద్రిక్తతను అతిగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన కవితా శైలిని ఉపయోగించాం. ‘సుడిగాలిలా ఊడ్చివేస్తాడు’ అనే పదబంధం మూలంలోని హఠాత్తైన, బలమైన తొలగింపు చిత్రాన్ని నిలుపుతుంది. పాఠంలోని [a] గుర్తు పాదసూచికతో సరిపోలుతుంది.
