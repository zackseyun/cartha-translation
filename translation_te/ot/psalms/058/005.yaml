    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “మంత్రాలను బంధించేవాడు, నేర్పరి.” ఇది మంత్రప్రయోగంలో నిపుణుడైన వ్యక్తిని సూచించే హీబ్రూ నుడికారం.
