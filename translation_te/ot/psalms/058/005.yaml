translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తన కవిత్వానికి తగిన గంభీరతతో రెండు సమాంతర పాదాలుగా రూపొందించబడింది. ‘మంత్రాలు కట్టే’ అనే కొద్దిగా అసాధారణమైన ప్రయోగాన్ని మూలంలోని חוֹבֵר חֲבָרִים రూపకాన్ని నిలుపుటకు ఉద్దేశపూర్వకంగా ఉంచి, పాదటిప్పణిలో వివరించబడింది.
