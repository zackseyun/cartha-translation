source:
  edition: WLC
  text: אֲשֶׁ֣ר לֹא יִ֭שְׁמַע לְ/ק֣וֹל מְלַחֲשִׁ֑ים חוֹבֵ֖ר חֲבָרִ֣ים מְחֻכָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/005.yaml
  text: that does not listen to the voice of charmers[b][a], of one who skillfully casts spells.
translation:
  language: te
  text: 'అది మంత్రోచ్చారణ చేసేవారి[a] స్వరాన్నీ,

    మంత్రాలను నేర్పుగా ప్రయోగించే వాని[b] స్వరాన్నీ వినదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గుసగుసలాడేవారి.” ఇక్కడి హీబ్రూ పదం గుసగుసలాడడం లేదా మంత్రోచ్చారణ చేయడం అనే భావంతో సంబంధం కలిగి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “మంత్రాలను బంధించేవాడు, నేర్పరి.” ఇది మంత్రప్రయోగంలో నిపుణుడైన వ్యక్తిని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: అది
  rationale: మునుపటి వచనంలోని చెవిటి నాగును సూచించే సంబంధార్థక ప్రయోగం; తెలుగులో వాక్యాన్ని సహజంగా కొనసాగించేందుకు ‘అది’ వాడబడింది.
- source_word: לֹא יִשְׁמַע
  choice: వినదు
  rationale: ఇక్కడ అపూర్ణ క్రియ నాగు స్పందించకపోవడాన్ని లక్షణంగా తెలియజేస్తుంది; ‘వినదు’ వినికిడితో పాటు మాటను పట్టించుకోకపోవడం అనే భావాన్నీ సందర్భంలో మోయగలదు.
- source_word: לְקוֹל
  choice: స్వరాన్ని / మాటను
  rationale: קוֹל అంటే ‘స్వరం’ లేదా ‘శబ్దం.’ మొదటి పాదంలో మూలపదానికి దగ్గరగా ‘స్వరాన్ని,’ సమాంతర రెండో పాదంలో సహజ తెలుగు కోసం ‘మాటను’ వాడబడింది.
- source_word: מְלַחֲשִׁים
  choice: మంత్రగాళ్లు
  rationale: ఈ పదం గుసగుసలాడడం లేదా మంత్రోచ్చారణ చేయడం అనే మూలభావంతో సంబంధం కలిగి ఉంది; నాగును వశపరచే సందర్భంలో ‘మంత్రగాళ్లు’ సాధారణ పాఠకునికి ఉద్దేశిత అర్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: חוֹבֵר חֲבָרִים
  choice: మంత్రాలు కట్టే వాడు
  rationale: అక్షరార్థంగా ‘కట్టులను/మంత్రాలను కట్టేవాడు’ అనే క్లిష్టమైన పదబంధం. ‘మంత్రాలు కట్టు’ అనే రూపం మూలంలోని పునరుక్తి, బంధించే రూపకాన్ని కొంత నిలుపుతూ మంత్రప్రయోగాన్ని సూచిస్తుంది.
- source_word: מְחֻכָּם
  choice: నేర్పుగా
  rationale: జ్ఞానం/నైపుణ్యానికి సంబంధించిన ఈ రూపం ఇక్కడ సాధించిన ప్రావీణ్యాన్ని సూచిస్తుంది; నైతికంగా ‘జ్ఞానవంతుడు’ అని భావింపకుండా ‘నేర్పుగా’ ఎంచుకోబడింది.
