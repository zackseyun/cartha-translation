source:
  edition: WLC
  text: יִשְׂמַ֣ח צַ֭דִּיק כִּי חָזָ֣ה נָקָ֑ם פְּעָמָ֥י/ו יִ֝רְחַ֗ץ בְּ/דַ֣ם הָ/רָשָֽׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/010.yaml
  text: The righteous will rejoice when he sees vengeance[b][a]; he will wash his feet in the blood of the wicked.
translation:
  language: te
  text: నీతిమంతుడు ప్రతీకారాన్ని చూసినప్పుడు[a] సంతోషిస్తాడు; దుష్టుని రక్తంలో తన పాదాలను కడుగుకుంటాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతీకారాన్ని చూసినందుకు.” హీబ్రూ సంధిపదం కాలార్థంలో (“చూసినప్పుడు”) లేదా కారణార్థంలో (“చూసినందుకు”) అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “దుష్టుని రక్తంలో తన పాదాలను కడుగుకుంటాడు” అనేది తీర్పు సంపూర్ణంగా అమలైనట్లు చిత్రించే కవితాత్మక రూపకం; ఇది వ్యక్తిగత హింసకు ఆజ్ఞ కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: יִשְׂמַח
  choice: సంతోషిస్తాడు
  rationale: కాల్ అసంపూర్ణ క్రియారూపంలోని భవిష్యత్ భావాన్ని సందర్భానుసారంగా సహజమైన తెలుగు వర్తమాన-భవిష్యత్ రూపంతో వ్యక్తం చేస్తుంది.
- source_word: צַדִּיק
  choice: నీతిమంతుడు
  rationale: ఏకవచన నామవాచకార్థక విశేషణాన్ని ప్రతినిధ్య ఏకవచనంగానే నిలుపుతుంది.
- source_word: כִּי
  choice: చూసినప్పుడు
  rationale: כִּי ఇక్కడ కాలార్థకంగా ‘ఎప్పుడు/చూసినప్పుడు’ అని చదవవచ్చు; కారణార్థక పఠనాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: חָזָה
  choice: చూసినప్పుడు
  rationale: ‘చూచుట’ అనే భావాన్ని భవిష్యత్ ప్రధాన వాక్యానికి అనుగుణమైన కాల ఉపవాక్యంగా సహజంగా అందిస్తుంది.
- source_word: נָקָם
  choice: ప్రతీకారం
  rationale: తీర్పులోని ప్రతిఫల చర్య తీవ్రతను తగ్గించకుండా మూలపదంలోని vengeance/retribution భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: פְּעָמָיו
  choice: తన పాదాలను
  rationale: ఈ రక్తంలో కడుగుకొనే కవితాత్మక దృశ్యంలో ‘అడుగులు’ కన్నా శరీర భాగమైన ‘పాదాలు’ సహజమైన అర్థం.
- source_word: יִרְחַץ
  choice: కడుగుకుంటాడు
  rationale: కాల్ అసంపూర్ణ క్రియ యొక్క ‘కడుగుకొను’ భావాన్ని, తన పాదాలపై జరిగే చర్యగా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּדַם
  choice: రక్తంలో
  rationale: בְּ ఉపసర్గలోని స్థలార్థాన్ని, మూలంలోని కఠినమైన కవితా చిత్రాన్ని నేరుగా నిలుపుతూ అందిస్తుంది.
- source_word: הָרָשָׁע
  choice: దుష్టుని
  rationale: ఏకవచన నామవాచకార్థక విశేషణాన్ని ‘దుష్టుడు’ అనే ప్రతినిధ్య ఏకవచనంగా నిలుపుతుంది.
theological_decisions:
- issue: ఈ వచనం వ్యక్తిగత కక్షసాధింపును చిత్రిస్తుందా, లేక న్యాయమైన ప్రతీకార తీర్పును చూసి సంతోషించడాన్నా?
  choice: మూలంలో ఉన్నట్లే ప్రతీకారాన్ని చూసి నీతిమంతుడు సంతోషించడం మరియు రక్తంలో పాదాలు కడుగుకొనే చిత్రం నిలుపబడింది; దాన్ని వ్యక్తిగత హింసగా గాని స్పష్టంగా ‘దైవిక’ ప్రతీకారంగా గాని ప్రధాన పాఠ్యంలో నిర్ణయించలేదు.
  alternative: ‘దేవుని న్యాయతీర్పు’ లేదా ‘వ్యక్తిగత ప్రతీకారం’ అని వివరణాత్మకంగా అనువదించడం.
  rationale: హీబ్రూ పాఠ్యం ప్రతీకారం ఎవరిదో ఈ వచనంలో ప్రత్యేకంగా చెప్పదు. కాబట్టి తీవ్రతను తగ్గించకుండా, అలాగే వ్యక్తిగత కక్షను దిగుమతి చేయకుండా, కీర్తనలోని ధార్మిక ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కీర్తనా శైలిని ఉంచుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. మూలంలోని హింసాత్మక కవితా చిత్రాన్ని మృదువుపరచలేదు; అవసరమైన వివరణను పాదటిప్పణికే పరిమితం చేశాం.
