  text: 'For the choirmaster: “Do Not Destroy.”[a] Of David. A miktam.[b]'
translation:
  language: te
  text: సంగీత నాయకునికి. “నాశనం చేయవద్దు.”[a] దావీదుకు సంబంధించినది. ఒక మిక్తాం.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఈ మాటలు రాగాన్ని లేదా సంగీత అమరికను మరింత స్పష్టంగా సూచిస్తే, “‘నాశనం చేయవద్దు’ అనే రాగం ప్రకారం.”
    reason: alternative_reading
  - marker: b
    text: ‘మిక్తాం’ అనే హెబ్రీ పదం అర్థం ఖచ్చితంగా తెలియదు; అది ఒక రచనా రకాన్ని లేదా సంగీత అమరికను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకునికి
  rationale: కీర్తనల శీర్షికల్లో ఈ పదం సంగీత నిర్వహణ బాధ్యతగల నాయకుణ్ణి సూచిస్తుంది. ఈ అనువాదం ఆ ఆరాధనా సంబంధిత విధిని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: אַל תַּשְׁחֵת
  choice: “నాశనం చేయవద్దు”
  rationale: ఇది ప్రత్యక్ష ఆజ్ఞగా కూడా చదవదగినప్పటికీ, ఇలాంటి కీర్తన శీర్షికల్లో సాధారణంగా ఒక రాగం లేదా సంగీత అమరిక పేరుగా భావించబడుతుంది. ఉద్ధరణ చిహ్నాలు దీనిని శీర్షికగా సూచిస్తాయి; మూలంలో లేని ‘ప్రకారం’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: לְדָוִד
  choice: దావీదుకు సంబంధించినది
  rationale: ఇక్కడి לְ ఉపసర్గ రచయితను, అంకితాన్ని లేదా సంబంధాన్ని సూచించవచ్చు. ‘దావీదు రచించినది’ అని నిర్దిష్టంగా చెప్పకుండా మూలంలోని విస్తృత సంబంధార్థాన్ని ఈ రూపం నిలుపుతుంది.
- source_word: מִכְתָּם
  choice: ఒక మిక్తాం
  rationale: ఈ కీర్తన-వర్గపు పదానికి ఖచ్చితమైన అర్థం తెలియదు. ఊహాత్మకంగా అనువదించకుండా లిప్యంతరీకరించడం దాని అనిశ్చితిని కాపాడుతుంది.
theological_decisions:
- issue: కీర్తన శీర్షికలోని సంగీత, సాహిత్య సూచనల స్వభావం
  choice: אַל תַּשְׁחֵתను సంభావ్య సంగీత శీర్షికగా చూపించి, לְדָוִדను సాధారణ సంబంధార్థంతో అనువదించడం
  alternative: దీనిని ‘నాశనం చేయవద్దు’ అనే ప్రత్యక్ష ఆజ్ఞగా తీసుకొని, לְדָוִדను ‘దావీదు రచించినది’ అని స్పష్టీకరించడం
  rationale: మూల హెబ్రీ పాఠ్యం రాగాన్ని సూచించే ‘ప్రకారం’ అనే మాటను స్పష్టంగా ఇవ్వదు; అలాగే దావీదుతో ఉన్న సంబంధాన్ని కేవలం రచయితత్వానికే పరిమితం చేయదు. కాబట్టి అనిశ్చితిని పరిష్కరించకుండా నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తన శీర్షికకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి వాడబడింది. తెలియని సాంకేతిక పదమైన ‘మిక్తాం’ను లిప్యంతరీకరించి, దాని వివరణను పాదసూచికలో ఇచ్చాం.
