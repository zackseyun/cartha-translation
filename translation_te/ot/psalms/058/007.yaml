id: PSA.58.7
reference: Psalms 58:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יִמָּאֲס֣וּ כְמוֹ מַ֭יִם יִתְהַלְּכוּ לָ֑/מוֹ יִדְרֹ֥ךְ חצ/ו כְּמ֣וֹ יִתְמֹלָֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/007.yaml
  text: Let them melt away like water that runs off[a]; when he aims his arrows[c][b], let them be as though cut off.
translation:
  language: te
  text: ప్రవహించి వెళ్లిపోయే నీటిలా వారు కరిగిపోవాలి[a]; అతడు తన బాణాన్ని ఎక్కుపెట్టినప్పుడు[b], అవి తెగిపోయినవాటిలా కావాలి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రవహించి దూరమయ్యే నీటిలా.’ హీబ్రూ ప్రయోగం నీరు కదులుతూ దూరమై కనుమరుగయ్యే దృశ్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘అతని బాణం’ అని ఏకవచనంలో ఉంది; దీనిని సమూహార్థంగా ‘అతని బాణాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: చివరి పదబంధం పాఠ్యపరంగానూ పదార్థపరంగానూ క్లిష్టమైనది. హీబ్రూ క్రియ బహువచనంలో ఉంది. ‘అవి మొద్దుబారిపోవాలి,’ ‘వాడిపోవాలి,’ లేదా ‘తెగిపోయినవాటిలా కావాలి’ అనే అర్థాలూ సాధ్యమే.
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּאֲסוּ
  choice: వారు కరిగిపోవాలి
  rationale: నీరు కనుమరుగయ్యే ఉపమానానికి అనుగుణంగా, క్రమంగా నశించిపోవడం అనే కవితాత్మక భావాన్ని మరియు ఆకాంక్షార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כְמוֹ מַיִם
  choice: నీటిలా
  rationale: హీబ్రూ ఉపమానాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: יִתְהַלְּכוּ לָמוֹ
  choice: పారిపోయే
  rationale: నీరు ప్రవహిస్తూ దూరమై కనుమరుగయ్యే దృశ్యాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; హీబ్రూ ప్రయోగంలోని కదలిక భావాన్ని కాపాడుతుంది.
- source_word: יִדְרֹךְ
  choice: ఎక్కుపెట్టినప్పుడు
  rationale: బాణసంబంధ సందర్భంలో విల్లును వంచి బాణాన్ని ప్రయోగానికి సిద్ధం చేయడాన్ని సూచించే సహజ తెలుగు ఆయుధప్రయోగ పదం; మూలంలో స్పష్టంగా లేని ‘విల్లు’ను ప్రధాన పాఠంలో చేర్చదు.
- source_word: חצו
  choice: తన బాణాన్ని
  rationale: మసొరేటిక్ పఠనంలోని ఏకవచన రూపాన్ని నిలుపుతుంది; సమూహార్థక బహువచనం అవసరం లేకుండా తెలుగు సహజంగా ఉంటుంది.
- source_word: כְּמוֹ יִתְמֹלָלוּ
  choice: అది మొన విరిగినదానిలా కావాలి
  rationale: క్లిష్టమైన చివరి క్రియను బాణం పనికిరాకుండా పోవడం అనే సందర్భోచిత చిత్రంతో అందిస్తుంది; అయితే పాఠ్య-పదార్థ అనిశ్చితిని పాదటిప్పణిలో స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: శాపప్రార్థనలోని ఆకాంక్షార్థం
  choice: ‘కరిగిపోవాలి’, ‘కావాలి’ అనే ఆకాంక్షార్థక రూపాలు
  alternative: నిశ్చయార్థక భవిష్యత్ రూపాలు
  rationale: సందర్భం శత్రువులపై తీర్పు రావాలని చేసే కవితాత్మక విజ్ఞప్తి; దానిని జరిగిన లేదా తప్పక జరగబోయే విషయంగా మార్చకుండా మూలంలోని జస్సివ్ భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని వాడాం. సాధారణ పాఠకునికి అర్థమయ్యే ‘పారిపోయే నీరు’, ‘బాణాన్ని ఎక్కుపెట్టు’ వంటి సహజ ప్రయోగాలను ఎంచుకున్నాం; మూలంలోని ఏకవచనాన్ని, ఆకాంక్షార్థాన్ని, చివరి పదబంధంలోని నిజమైన అనిశ్చితిని నిలిపాం.
