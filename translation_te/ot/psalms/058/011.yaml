id: PSA.58.11
reference: Psalms 58:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יֹאמַ֣ר אָ֭דָם אַךְ פְּרִ֣י לַ/צַּדִּ֑יק אַ֥ךְ יֵשׁ אֱ֝לֹהִ֗ים שֹׁפְטִ֥ים בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/011.yaml
  text: And people will say[a], “Surely there is fruit for the righteous[b]; surely there is a God who judges on the earth.”
translation:
  language: te
  text: 'మనుషులు ఇలా అంటారు: “నీతిమంతునికి తప్పకుండా ఫలం ఉంది; భూమిపై తీర్పు తీర్చే దేవుడు తప్పకుండా ఉన్నాడు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో “దేవుడు” (אֱלֹהִים), “తీర్పు తీర్చే” (שֹׁפְטִים) అనే రెండు పదాలూ రూపపరంగా బహువచనంలో ఉన్నాయి. అయినప్పటికీ, చాలామంది వీటిని ఏకవచన సత్యదేవుణ్ణి సూచిస్తున్నవిగా అర్థం చేసుకుంటారు; మరికొందరు, తక్కువ సంభావ్యంగా, “భూమిపై తీర్పు తీర్చే దేవుళ్లు ఉన్నారు” అని చదువుతారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֹאמַר אָדָם
  choice: అప్పుడు మనుషులు ఇలా అంటారు
  rationale: కవితా సందర్భంలో అపూర్ణ క్రియ ముందరి తీర్పు ఫలితంగా కలిగే భావి స్పందనను సూచిస్తుంది. אָדָם ఏకవచన రూపంలో ఉన్నా ఇక్కడ మానవులను సాధారణంగా సూచిస్తుంది; ఆధునిక తెలుగులో ‘మనుషులు’ సహజంగా ఉంటుంది.
- source_word: אַךְ
  choice: తప్పకుండా
  rationale: రెండు సందర్భాల్లోనూ ఇది పరిమితిని కాక బలమైన నిశ్చయాన్ని వ్యక్తం చేస్తుంది.
- source_word: פְּרִי לַצַּדִּיק
  choice: నీతిమంతునికి ... ఫలం ఉంది
  rationale: פְּרִי యొక్క ‘ఫలం’ అనే మూలరూపకాన్ని నిలుపుతూ, నీతిమంతునికి దక్కే పరిణామం లేదా ప్రతిఫలం అనే సందర్భార్థాన్ని సూచిస్తుంది.
- source_word: יֵשׁ אֱלֹהִים
  choice: దేవుడు ... ఉన్నాడు
  rationale: יֵשׁ ఉనికిని బలంగా ప్రకటిస్తుంది. אֱלֹהִים ఇక్కడ ఏకైక సత్యదేవుణ్ణి సూచిస్తుందని సందర్భం బలపరుస్తుంది; తెలుగులో అనిర్దిష్ట పదబంధం అవసరం లేదు.
- source_word: שֹׁפְטִים בָּאָרֶץ
  choice: భూమిపై తీర్పు తీర్చే
  rationale: ‘భూమిపై’ విశాలమైన నైతిక-న్యాయ పరిధిని తెలియజేస్తుంది. బహువచన రూపంలోని participle అర్థపరంగా ఏకవచన దేవునితో అనుసంధానమైందని ప్రధాన పాఠంలో సహజమైన ఏకవచన నిర్మాణంతో అనువదించబడింది.
theological_decisions:
- issue: אֱלֹהִים שֹׁפְטִים ను ఏకవచనంగా లేదా బహువచనంగా అర్థం చేసుకోవడం
  choice: “తీర్పు తీర్చే దేవుడు” అనే ఏకవచన పఠనం
  alternative: “తీర్పు తీర్చే దేవుళ్లు” అనే బహువచన పఠనం
  rationale: కీర్తన యొక్క శిఖర వాక్యం లోకంలో దైవన్యాయం నిజంగా అమలవుతుందని ఒప్పుకుంటుంది; సమీప సందర్భం אֱלֹהִים ను సత్యదేవునిగా అర్థం చేసుకోవడానికి మద్దతిస్తుంది. అయితే שֹׁפְטִים రూపపరంగా బహువచనం కావడంతో ఆ అస్పష్టతను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హెబ్రీ ‘ఫలం’ రూపకాన్ని నిలిపి, వాక్యక్రమాన్ని సహజమైన తెలుగుకు అనుగుణంగా తీర్చిదిద్దాం. ప్రధాన పాఠంలో ఉన్న ఏకైక పాదటిప్పణి సూచిక [a] సంబంధిత అస్పష్టత ఉన్న వాక్యాంతంలో ఉంచబడింది.
