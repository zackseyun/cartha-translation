  to: 'మనుషులు ఇలా అంటారు: “నీతిమంతునికి తప్పకుండా ఫలం ఉంది; భూమిపై తీర్పు తీర్చే దేవుడు తప్పకుండా ఉన్నాడు.”[a]'
