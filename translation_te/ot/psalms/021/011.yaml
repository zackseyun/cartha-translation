  text: For they intended evil against you[a]; they devised a scheme[b], but they could not carry it out.
translation:
  language: te
  text: ఎందుకంటే వారు నీకు విరోధంగా కీడు తలపెట్టారు[a]; కుట్ర పన్నారు[b], కానీ దాన్ని నెరవేర్చలేరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘వారు నీకు విరోధంగా కీడును చాచారు.’ ఈ హీబ్రూ ప్రయోగం నీకు విరోధంగా కీడును ఉద్దేశించడం లేదా లక్ష్యంగా చేసుకోవడం అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారు ఒక పథకం వేశారు, కానీ దాన్ని నెరవేర్చలేరు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలో చెప్పిన తీర్పుకు కారణాన్ని పరిచయం చేసే వివరణాత్మక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נָטוּ
  choice: తలపెట్టారు
  rationale: మూల క్రియ అక్షరార్థంగా ‘చాచారు/విస్తరించారు’ అని ఉన్నా, רָעָה మరియు עַל‌తో కలిసి ఒకరికి విరోధంగా కీడు ఉద్దేశించడాన్ని సూచిస్తుంది.
- source_word: עָלֶיךָ
  choice: నీకు విరోధంగా
  rationale: విరోధపూర్వక చర్య సందర్భంలో עַל‌కు ఉన్న ‘against’ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: רָעָה
  choice: కీడు
  rationale: శత్రువుల దుష్ట ఉద్దేశాన్ని సూచిస్తూ, నైతిక ప్రతికూలతను నిలుపుతుంది; ఇక్కడ ఇది కేవలం విపత్తు కాదు.
- source_word: חָשְׁבוּ
  choice: పన్నారు
  rationale: ఆలోచించి రూపొందించిన ఉద్దేశపూర్వక ప్రణాళిక భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מְזִמָּה
  choice: కుట్ర
  rationale: సందర్భంలోని కపటమైన, హానికరమైన పథకాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: בַּל
  choice: కానీ ... లేకపోయారు
  rationale: కావ్యాత్మక నిషేధాన్ని, వారు పన్నిన కుట్రకూ వారి వైఫల్యానికీ మధ్య ఉన్న వ్యత్యాసంతో తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יוּכָלוּ
  choice: దాన్ని నెరవేర్చలేకపోయారు
  rationale: ‘సమర్థులవడం’ అనే మూల భావాన్ని నిలుపుతూ, ముందు పేర్కొన్న కుట్రను అమలు చేయలేకపోయారనే అంతర్లీన కర్మను సహజంగా స్పష్టం చేస్తుంది.
