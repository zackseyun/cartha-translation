  text: You have given him his heart’s desire[a], and you have not withheld the request of his lips[b]. Selah
translation:
  language: te
  text: 'అతని హృదయపు కోరికను నీవు అతనికి ఇచ్చావు;


    అతని పెదవుల విన్నపాన్ని[a] నీవు ఇవ్వకుండా ఉంచలేదు.


    సెలా.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విన్నపం’ అని అనువదించిన హీబ్రూ పదం అరుదైనది; దానికి ‘కోరిక’ లేదా ‘పెదవులతో పలికిన అభ్యర్థన’ అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘సెలా’ అనే పదం యొక్క ఖచ్చితమైన అర్థం లేదా విధి తెలియదు; అది సంగీతపరమైన లేదా ఆరాధనపరమైన విరామాన్ని సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: תַּאֲוַת לִבּוֹ
  choice: అతని హృదయ కోరికను
  rationale: ఈ పదబంధానికి అక్షరార్థంగా ‘అతని హృదయ కోరిక’ అనే భావం ఉంది; అంతరంగంలోని ఆకాంక్షను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: נָתַתָּה לּוֹ
  choice: నీవు అతనికి అనుగ్రహించావు
  rationale: క్రియ పూర్తయిన కార్యాన్ని సూచిస్తుంది. దేవుడు కోరికను తీర్చిన సందర్భంలో ‘అనుగ్రహించావు’ సహజంగాను గౌరవప్రదంగాను ఉంది.
- source_word: וַאֲרֶשֶׁת
  choice: విన్నపాన్ని
  rationale: అరుదైన ఈ నామవాచకం పలికిన కోరిక లేదా అభ్యర్థనను సూచించే అవకాశం ఉంది; మొదటి పాదంలోని అంతరంగ కోరికకు సమాంతరంగా, రెండో పాదంలోని మాటగా వ్యక్తమైన ప్రార్థనను ‘విన్నపం’ తెలియజేస్తుంది.
- source_word: שְׂפָתָיו
  choice: అతని పెదవుల
  rationale: మూలంలోని పెదవుల రూపకాన్ని నిలుపుతూ పలికిన విన్నపాన్ని సూచిస్తుంది.
- source_word: בַּל מָנַעְתָּ
  choice: నీవు నిరాకరించలేదు
  rationale: మూల క్రియకు ‘వెనక్కి ఉంచు/ఇవ్వకుండా ఉండు’ అనే అర్థం ఉంది. సందర్భంలో విన్నపాన్ని ఇవ్వకుండా ఉండలేదనే భావాన్ని సహజమైన తెలుగులో ‘నిరాకరించలేదు’ వ్యక్తపరుస్తుంది.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఈ పదం యొక్క ఖచ్చితమైన అర్థం లేదా గీతసంబంధమైన విధి అనిశ్చితమైనందున అనువదించకుండా లిప్యంతరీకరించబడింది.
