source:
  edition: WLC
  text: תִּמְצָ֣א יָ֭דְ/ךָ לְ/כָל אֹיְבֶ֑י/ךָ יְ֝מִֽינְ/ךָ תִּמְצָ֥א שֹׂנְאֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/008.yaml
  text: Your hand will find all your enemies[a]; your right hand will find those who hate you.
translation:
  language: te
  text: నీ చేయి నీ శత్రువులందరినీ కనుగొంటుంది[a]; నీ కుడి చేయి నిన్ను ద్వేషించేవారిని కనుగొంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చేరుకుంటుంది” లేదా “వెంటాడి అందుకుంటుంది.” హెబ్రీ క్రియకు అక్షరార్థం “కనుగొంటుంది”; ఈ సందర్భంలో అది శత్రువులను విజయవంతంగా చేరుకోవడాన్ని లేదా పట్టుకోవడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְצָא
  choice: పట్టుకుంటుంది
  rationale: מצא అనే క్రియకు ప్రాథమికంగా ‘కనుగొను’ అనే అర్థం ఉన్నా, ఈ యుద్ధ సందర్భంలో శత్రువులను విజయవంతంగా చేరుకొని వశపరచుకోవడం అనే భావం ఉంది. తెలుగులో ‘చెయ్యి ... కనుగొంటుంది’ సహజంగా లేకపోవడం వల్ల, సందర్భార్థాన్ని సహజంగా తెలియజేసే ‘పట్టుకుంటుంది’ ఎంచుకున్నాం; మూలపదపు రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: יָדְךָ
  choice: నీ చెయ్యి
  rationale: రాజు కార్యసాధక శక్తిని సూచించే మూర్తమైన శరీరాంగ రూపకాన్ని, దాన్ని ‘శక్తి’గా విప్పకుండా నిలిపాం.
- source_word: לְכָל
  choice: నీ ... అందరినీ
  rationale: כֹּל యొక్క సమగ్ర భావాన్ని తెలుగులో సహజమైన ‘శత్రువులందరినీ’ అనే నిర్మాణంతో తెలిపాం.
- source_word: אֹיְבֶיךָ
  choice: నీ శత్రువులు
  rationale: אֹיֵבకు ప్రామాణిక తెలుగు సమానార్థకం; రెండవ పురుష ఏకవచన ప్రత్యయాన్ని ‘నీ’తో నిలిపాం.
- source_word: יְמִינְךָ
  choice: నీ కుడిచెయ్యి
  rationale: బలం, నైపుణ్యం, విజయకార్యాన్ని సూచించే హెబ్రీ సమాంతర రూపకాన్ని యథాతథంగా నిలిపాం.
- source_word: שֹׂנְאֶיךָ
  choice: నిన్ను ద్వేషించేవారు
  rationale: కృదంతంలోని క్రియాత్మక భావాన్ని ‘శత్రువులు’గా కుదించకుండా, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేశాం.
theological_decisions:
- issue: రాజకీయ కీర్తనలో దైవిక/రాజకీయ శక్తిని శరీరాంగాల ద్వారా చిత్రించడం
  choice: ‘చెయ్యి’, ‘కుడిచెయ్యి’ అనే మూర్తమైన రూపకాలను నిలిపాం.
  alternative: ‘నీ శక్తి నీ శత్రువులందరినీ జయిస్తుంది’
  rationale: మూలంలోని శరీరాంగ చిత్రణ కవితా, ధార్మిక ప్రాముఖ్యత కలది. దాన్ని అమూర్తమైన ‘శక్తి’గా మార్చకుండా ఉంచడం ద్వారా సమాంతరతను, భావబలాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలి. ‘చెయ్యి’ సాధారణ పాఠకులకు సహజంగా ఉండడంతో పాటు హెబ్రీ సమాంతర చిత్రణను నిలుపుతుంది; రెండవ పాదంలోని పునరుక్తి ఉద్దేశపూర్వకంగా కాపాడబడింది.
