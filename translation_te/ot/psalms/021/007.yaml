  terminology: యְהוָהను ఆంగ్ల POB audit trailలో నిర్ణయించినట్లే ‘యాహ్వే’గా లిప్యంతరీకరించబడింది. עֶלְיוֹןకు ‘సర్వోన్నతుడు,’ חֶסֶדకు ‘స్థిరమైన ప్రేమ’ సరైనవి. ప్రత్యామ్నాయంగా ‘నిబంధన నిబద్ధత’ను పాదటిప్పణిలో ఉంచడం పదం యొక్క విస్తృత భావాన్ని కాపాడుతుంది.
