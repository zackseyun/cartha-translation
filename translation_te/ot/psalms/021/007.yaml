id: PSA.21.7
reference: Psalms 21:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי הַ֭/מֶּלֶךְ בֹּטֵ֣חַ בַּ/יהוָ֑ה וּ/בְ/חֶ֥סֶד עֶ֝לְי֗וֹן בַּל יִמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/007.yaml
  text: For the king trusts in Yahweh[b][a], and through the steadfast love of the Most High he will not be shaken.
translation:
  language: te
  text: ఎందుకంటే రాజు యాహ్వేపై నమ్మకం ఉంచుతాడు; సర్వోన్నతుని స్థిరమైన ప్రేమవల్ల[a] అతడు చలించడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సర్వోన్నతుని స్థిరమైన ప్రేమలో’; ఇక్కడి హీబ్రూ ఉపసర్గ సాధనం లేదా కారణాన్ని, అలాగే స్థితిని కూడా సూచించవచ్చు. ‘స్థిరమైన ప్రేమ’కు ‘నిబంధన నిబద్ధత’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘కదలడు’ లేదా ‘తూలిపోడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ప్రకటనకు కారణం లేదా ఆధారాన్ని పరిచయం చేసే అనుసంధాన పదంగా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: కీర్తనలోని నిర్దిష్ట రాజవ్యక్తిని సూచించే సాధారణ, సందర్భోచిత అనువాదం.
- source_word: בֹּטֵחַ
  choice: నమ్ముకుంటాడు
  rationale: Qal కృదంతం తెలిపే కొనసాగుతున్న లేదా స్వభావసిద్ధమైన ఆధారపడటాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בַּיהוָה
  choice: యెహోవాను
  rationale: నమ్మకానికి లక్ష్యమైన దేవుని వ్యక్తిగత నామం יהוהను సంప్రదాయ తెలుగు రూపమైన ‘యెహోవా’గా ఉంచుతుంది; తెలుగు క్రియావిన్యాసానికి అనుగుణంగా ద్వితీయా విభక్తి వాడబడింది.
- source_word: וּבְחֶסֶד
  choice: స్థిరమైన ప్రేమవల్ల
  rationale: חֶסֶדలోని నిలకడగల, నిబద్ధమైన ప్రేమ భావాన్ని కాపాడుతూ, בְּ ఉపసర్గను ఇక్కడ సాధనార్థక/కారణార్థకంగా వ్యక్తపరుస్తుంది.
- source_word: עֶלְיוֹן
  choice: సర్వోన్నతుడు
  rationale: దేవునికి వాడిన బిరుదును సహజమైన, గౌరవప్రదమైన తెలుగు రూపంలో అందిస్తుంది.
- source_word: בַּל יִמּוֹט
  choice: కదిలిపోడు
  rationale: కదలడం, చలించడం, తూలడం అనే రూపకార్థాన్ని సంక్షిప్తంగా కాపాడుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ పాఠంలోని వ్యక్తిగత దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణలో ఉంచింది.
- issue: חֶסֶד యొక్క భావవ్యాప్తి
  choice: స్థిరమైన ప్రేమ
  alternative: నిబంధన నిబద్ధత
  rationale: పదంలోని ప్రేమ, విశ్వసనీయత, నిబద్ధత భావాలను ఒకే నిర్దిష్ట సిద్ధాంతపరమైన అర్థానికి పరిమితం చేయకుండా ప్రధాన పాఠంలో సహజంగా అందించింది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో సూచించింది.
- issue: בְּ ఉపసర్గ సంబంధం
  choice: ప్రేమవల్ల
  alternative: ప్రేమలో నిలిచి
  rationale: ఇక్కడ రాజు కదలకపోవడానికి సర్వోన్నతుని חֶסֶד కారణం/సాధనం అని చదవడం సందర్భానికి సరిపోతుంది; అయితే స్థితి లేదా పరిధిని సూచించే పఠనం సాధ్యమని పాదటిప్పణిలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కీర్తనా శైలి. హీబ్రూ కవిత్వంలోని సంక్షిప్తతను నిలుపుతూ, חֶסֶד మరియు בְּ యొక్క నిజమైన భావసందిగ్ధతలను పాదటిప్పణిలో సంరక్షించింది.
