  source_fidelity: హీబ్రూలోని כִּי వివరణాత్మక అనుసంధానాన్ని, ‘రాజు,’ యెహోవాపై ఉంచిన విశ్వాసాన్ని, మరియు సర్వోన్నతుని חֶסֶד వల్ల కలిగే అచంచలత్వాన్ని పాఠం సరిగ్గా ప్రతిబింబిస్తుంది. అయితే ఆంగ్ల POB నిర్ణయంలో ఉన్న దైవనామ-రూపానికి అనుగుణంగా యెహోవా స్థానంలో యాహ్వే వాడడం అవసరం. బְּחֶסֶדకు ‘ప్రేమవల్ల’ అనేది సముచితమైన సాధనార్థక/కారణార్థక పఠనం; లోకేటివ్ ప్రత్యామ్నాయం పాదటిప్పణిలో నిలుపబడింది.
