id: PSA.21.1
reference: Psalms 21:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יְֽהוָ֗ה בְּ/עָזְּ/ךָ֥ יִשְׂמַח מֶ֑לֶךְ וּ֝/בִ/ישׁ֥וּעָתְ/ךָ֗ מַה יגיל מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/001.yaml
  text: O Yahweh[a], in your strength the king rejoices, and in your salvation how greatly he exults!
translation:
  language: te
  text: యాహ్వే, నీ బలంలో రాజు సంతోషిస్తాడు; నీ రక్షణలో[a] అతడు ఎంతగానో ఉల్లసిస్తాడు!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదానికి ‘రక్షణ’తో పాటు సందర్భాన్ని బట్టి ‘విడిపింపు’ లేదా ‘విజయం’ అనే అర్థాలు కూడా రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుగా కాకుండా పేరుగానే లిప్యంతరీకరించాం; ప్రత్యక్ష సంబోధనను తెలుగులో విరామచిహ్నంతో సహజంగా వ్యక్తం చేశాం.
- source_word: בְּעָזְּךָ
  choice: నీ బలాన్ని బట్టి
  rationale: בְ ఇక్కడ రాజు ఆనందానికి ఆధారం లేదా కారణాన్ని సూచిస్తుంది. ‘నీ బలంలో’ అనే అక్షరానువాదం కంటే ‘నీ బలాన్ని బట్టి’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: יִשְׂמַח
  choice: సంతోషిస్తాడు
  rationale: కావ్యంలోని yiqtol వర్తమాన అలవాటు భావాన్నీ భవిష్యత్ భావాన్నీ మోయగలదు. తెలుగు సాధారణ వర్తమాన రూపం ఈ కాలసంబంధ సౌలభ్యాన్ని కొంతవరకు నిలుపుతుంది.
- source_word: מֶלֶךְ
  choice: రాజు
  rationale: హీబ్రూలో నిర్దేశక ఉపపదం లేకున్నా సందర్భంలో ఒక నిర్దిష్ట రాజు ఉద్దేశించబడ్డాడు; తెలుగులో ‘రాజు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: וּבִישׁוּעָתְךָ
  choice: నీ రక్షణను బట్టి
  rationale: יְשׁוּעָהకు రక్షణ, విడిపింపు, విజయం అనే విస్తృత భావపరిధి ఉంది. ‘రక్షణ’ ఆ విస్తృతతను నిలుపుతుంది; సమాంతర నిర్మాణం కోసం కారణార్థక పదబంధాన్ని వాడాం.
- source_word: מַה ... מְאֹד
  choice: ఎంతగా
  rationale: מַה ప్రశ్నార్థకం కాకుండా ఆశ్చర్యార్థక తీవ్రతను వ్యక్తం చేస్తుంది; מְאֹדతో కలిసి తెలుగులో సహజమైన ‘ఎంతగా’ రూపం సరిపోతుంది.
- source_word: יגיל
  choice: ఉల్లసిస్తాడు
  rationale: גיל ఉప్పొంగే ఆనందాన్ని సూచిస్తుంది. మొదటి పాదంలోని ‘సంతోషిస్తాడు’ను పునరావృతం చేయకుండా కావ్య సమాంతరతలోని భావతీవ్రతను నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల దాన్ని బిరుదైన ‘ప్రభువు’గా మార్చకుండా, ‘Jehovah’ రూపాన్ని సూచించే ‘యెహోవా’కు బదులు హీబ్రూ పేరుకు దగ్గరైన ‘యాహ్వే’గా ఇచ్చాం.
- issue: יְשׁוּעָה యొక్క భావపరిధి
  choice: రక్షణ
  alternative: విడిపింపు / విజయం
  rationale: ఈ సందర్భంలో రాజుకు దేవుడు అనుగ్రహించిన విడిపింపు లేదా విజయం ఉద్దేశించబడవచ్చు. అయితే ఒక్క భావానికే పరిమితం చేయకుండా మూలపదంలోని విస్తృత ధార్మిక, సందర్భోచిత పరిధిని ‘రక్షణ’ నిలుపుతుంది; ప్రత్యామ్నాయాలను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కావ్యశైలిని ఉపయోగించాం. రెండు సమాంతర పాదాల్లో కారణార్థక నిర్మాణాన్ని నిలిపి, రెండవ పాదంలోని ఉల్లాస తీవ్రతను ఆశ్చర్యార్థక రూపంతో వ్యక్తం చేశాం.
