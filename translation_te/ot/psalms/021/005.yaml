lexical_decisions:
- source_word: גָּדוֹל
  choice: గొప్పది
  rationale: వాక్యారంభంలోని విధేయ విశేషణం మహిమ యొక్క గొప్పతనాన్ని నొక్కిచెబుతుంది; తెలుగులో సహజమైన విధేయ నిర్మాణంతో అందించబడింది.
- source_word: כְּבוֹדוֹ
  choice: అతని మహిమ
  rationale: రాజసంబంధ సందర్భంలో כָּבוֹד సూచించే ఘనత, గౌరవం, కీర్తి అనే విస్తృత భావాన్ని ‘మహిమ’ నిలుపుతుంది.
- source_word: בִּישׁוּעָתֶךָ
  choice: నీ రక్షణ ద్వారా
  rationale: ב అనే ఉపసర్గ ఇక్కడ సాధనం లేదా పరిధిని సూచించవచ్చు. ‘ద్వారా’ దేవుని రక్షణ కార్యాన్ని సాధనంగా సహజంగా వ్యక్తం చేస్తుంది; ఇతర సాధ్యార్థాలను పాదటిప్పణులు నిలుపుతున్నాయి.
- source_word: הוֹד
  choice: వైభవం
  rationale: రాజోచితమైన తేజస్సు, ఠీవి, శోభ అనే భావాన్ని ‘వైభవం’ సహజంగా తెలియజేస్తుంది.
- source_word: וְהָדָר
  choice: మహాత్మ్యం
  rationale: הוֹד తో ఉన్న కవితాత్మక జంటలో రాజసమైన ఘనతను సూచిస్తూ, ‘వైభవం’తో పదభేదాన్ని కాపాడుతుంది.
- source_word: תְּשַׁוֶּה עָלָיו
  choice: నీవు అతనికి అనుగ్రహిస్తావు
  rationale: అక్షరార్థంగా ‘అతనిమీద ఉంచుతావు’; సందర్భంలో రాజసమైన గౌరవాన్ని ప్రసాదించడాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: రాజకీర్తనలో יְשׁוּעָה యొక్క అర్థం
  choice: రక్షణ
  alternative: విడుదల లేదా విజయం
  rationale: మూలపదం విస్తృతంగా రక్షణ లేదా విడుదలను సూచిస్తుంది; రాజసైనిక సందర్భంలో విజయాన్ని కూడా సూచించగలదు. ‘రక్షణ’ దాని ప్రాథమిక భావాన్నీ వేదాంతపరమైన విస్తృతినీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన కవితా శైలి. సమాంతరమైన రాజస పదజంటను ‘వైభవం—మహాత్మ్యం’గా నిలుపుతూ, మూలంలోని ఉపసర్గ మరియు יְשׁוּעָה పదాల అర్థవిస్తృతిని పాదటిప్పణుల్లో భద్రపరచింది.
