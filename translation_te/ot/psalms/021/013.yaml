revisions:
- from: యెహోవా[a], నీ బలంలో నీవు ఉన్నతుడవై కనిపించు[b]! నీ పరాక్రమాన్ని గురించి మేము పాడుతాం, సంగీతంతో స్తుతిస్తాం.
  to: యాహ్వే[a], నీ బలంలో మహిమపరచబడుము[b]! నీ పరాక్రమాన్ని గూర్చి మేము పాడుతాం, సంగీతంతో స్తుతిస్తాం.
  rationale: The revision removes the unsupported ‘కనిపించు’ nuance, retains the deliberate ambiguity of רוּמָה through a main-text exaltation rendering and a ‘rise up’ footnote, and changes the divine name to ‘యాహ్వే’ to conform to the supplied POB rendering policy. The two praise verbs and the lexical distinction between strength and might are retained.
