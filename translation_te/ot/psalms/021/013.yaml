id: PSA.21.13
reference: Psalms 21:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ר֣וּמָ/ה יְהוָ֣ה בְּ/עֻזֶּ֑/ךָ נָשִׁ֥ירָה וּֽ֝/נְזַמְּרָה גְּבוּרָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/013.yaml
  text: Be exalted[a], O Yahweh[b], in your strength! We will sing and make music to your might.
translation:
  language: te
  text: యాహ్వే[a], నీ బలంలో మహిమపరచబడుము[b]! నీ పరాక్రమాన్ని గూర్చి మేము పాడుతాం, సంగీతంతో స్తుతిస్తాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో దేవుని వ్యక్తిగత నామం YHWH ఉంది; ఇక్కడ దాన్ని ‘యాహ్వే’ అని ఇచ్చాం.
    reason: divine_name
  - marker: b
    text: లేదా, ‘నీ బలంతో లేచిరా!’ హీబ్రూ క్రియ దేవుడు లేవాలనే పిలుపుగానీ, ఉన్నతపరచబడాలనే విన్నపంగానీ అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֣וּמָה
  choice: నీవు ఉన్నతుడవై కనిపించు
  rationale: רום యొక్క ఆజ్ఞార్థక/సంకల్పార్థక రూపం దేవునికి చేసిన విన్నపం. అది ‘లేచిరా’ అనే భావాన్నీ, దేవుడు తన బలంలో ఉన్నతుడిగా ప్రత్యక్షం కావాలనే భావాన్నీ మోయగలదు. సందర్భంలోని స్తుతి స్వరానికి తగినట్లుగా రెండవ భావాన్ని ప్రధాన పాఠ్యంలో సహజంగా వ్యక్తం చేశాం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: בְּעֻזֶּךָ
  choice: నీ బలంలో
  rationale: בְּ ఉపసర్గ సూచించగల పరిధి/సాధన భావాన్ని నిలుపుతూ, עֹז ను సహజమైన ‘బలం’గా అనువదించాం.
- source_word: נָשִׁירָה
  choice: మేము పాడుతాం
  rationale: మొదటి పురుష బహువచన cohortative ఇక్కడ ఆరాధకుల సంకల్పిత స్పందనను తెలియజేస్తుంది; ఆధునిక తెలుగులో ‘మేము పాడుతాం’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וּנְזַמְּרָה
  choice: సంగీతంతో స్తుతిస్తాం
  rationale: זמר స్తుతి సందర్భంలో వాద్యసంగీతం చేయడం లేదా సంగీతంతో ప్రశంసించడం అనే భావాన్ని ఇస్తుంది. ‘పాడుతాం’తో ఉన్న కవితా సమాంతరాన్ని కేవలం పునరుక్తిగా చేయకుండా సంగీత నుడికారాన్ని నిలిపాం.
- source_word: גְּבוּרָתֶךָ
  choice: నీ పరాక్రమాన్ని గురించి
  rationale: גְּבוּרָה బలం, శౌర్యం, కార్యరూపంలో వెల్లడైన శక్తి అనే భావాలను కలిగి ఉంది. ముందున్న עֹז (‘బలం’)తో పదభేదాన్ని నిలుపడానికి ‘పరాక్రమం’ ఎంచుకున్నాం. తెలుగు క్రియలతో సహజ సంబంధం కోసం ‘గురించి’ వాడాం.
theological_decisions:
- issue: దైవనామం YHWH అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం יְהוָה నేరుగా ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా పేరుగానే ఉంచాం; తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం.
- issue: רומה లోని విన్నప భావం
  choice: నీవు ఉన్నతుడవై కనిపించు
  alternative: లేచిరా
  rationale: ఈ రూపం దేవుడు లేవాలనే పిలుపుగానూ, తన బలంలో ఉన్నతుడిగా వెల్లడవాలనే విన్నపంగానూ అర్థమవుతుంది. కీర్తన ముగింపులోని స్తుతి సందర్భం దృష్ట్యా ప్రధాన పాఠ్యంలో రెండవదాన్ని ఎంచుకుని, నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కవితా శైలిని ఉపయోగించాం. ‘బలం/పరాక్రమం’ ద్వారా మూలంలోని עֹז/גְּבוּרָה పదభేదాన్ని నిలిపాం; ‘పాడుతాం, సంగీతంతో స్తుతిస్తాం’ ద్వారా రెండు cohortative క్రియల సంకల్ప భావాన్నీ సంగీత సమాంతరాన్నీ వ్యక్తం చేశాం.
