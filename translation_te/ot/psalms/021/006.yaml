source:
  edition: WLC
  text: כִּֽי תְשִׁיתֵ֣/הוּ בְרָכ֣וֹת לָ/עַ֑ד תְּחַדֵּ֥/הוּ בְ֝/שִׂמְחָ֗ה אֶת פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/006.yaml
  text: For you make him blessings forever[b][a]; you gladden him with joy in your presence.
translation:
  language: te
  text: ఎందుకనగా నీవు అతణ్ణి ఎప్పటికీ ఆశీర్వాదమయునిగా చేస్తావు[a]; నీ సన్నిధిలో ఆనందంతో అతణ్ణి సంతోషింపజేస్తావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు అతనిపై ఎప్పటికీ ఆశీర్వాదాలు ఉంచుతావు,” లేదా “నీవు అతణ్ణి ఎప్పటికీ ఒక ఆశీర్వాదంగా చేస్తావు.” హీబ్రూ ప్రయోగం సంక్షిప్తమైనది మరియు అసాధారణమైన బహువచనాన్ని వాడుతుంది. అది రాజుకు అనుగ్రహించబడిన సమృద్ధి ఆశీర్వాదాలనుగానీ, రాజే ఆశీర్వాదానికి ప్రతిరూపం లేదా మూలం కావడాన్నిగానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలో చెప్పిన స్తుతికి కారణాన్ని లేదా వివరణను పరిచయం చేస్తుంది.
- source_word: תְשִׁיתֵהוּ
  choice: నీవు అతణ్ణి ... చేస్తావు
  rationale: שׁית అనే క్రియలోని ‘ఉంచు/నిలుపు/చేయు’ భావాలలో, తరువాత వచ్చే విధేయ నామవాచకంతో ‘చేస్తావు’ సహజంగా సరిపోతుంది.
- source_word: בְרָכוֹת
  choice: ఆశీర్వాదాలుగా
  rationale: హీబ్రూలోని అసాధారణ బహువచనాన్ని నిలిపి, రాజు విస్తారమైన ఆశీర్వాదాన్ని పొందడం లేదా దానికి ప్రతిరూపం/మూలం కావడం అనే భావసాధ్యతలను తెరిచి ఉంచుతుంది.
- source_word: לָעַד
  choice: ఎప్పటికీ
  rationale: నిరంతరమైన, శాశ్వత కాలవ్యాప్తిని తెలిపే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: תְּחַדֵּהוּ
  choice: అతణ్ణి సంతోషింపజేస్తావు
  rationale: పియేల్ రూపంలోని కారణార్థక భావాన్ని—అతనికి ఆనందం కలిగించడం—స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְשִׂמְחָה
  choice: ఆనందంతో
  rationale: సంతోషాన్ని కలిగించే సాధనం లేదా దానితో కూడిన స్థితి అనే హీబ్రూ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶת־פָּנֶיךָ
  choice: నీ సన్నిధిలో
  rationale: అక్షరార్థంగా ‘నీ ముఖంతో/నీ ముఖం ఎదుట’ అనే హీబ్రూ ప్రయోగం దేవుని సమక్షాన్ని సూచిస్తుంది; తెలుగులో ‘నీ సన్నిధిలో’ సహజమైన సమానార్థకం.
theological_decisions:
- issue: ‘అతణ్ణి ఆశీర్వాదాలుగా చేస్తావు’ అనే వాక్యభాగపు భావం
  choice: అసాధారణమైన బహువచన నిర్మాణాన్ని ప్రధాన వచనంలో నిలిపి, రాజు విస్తారంగా ఆశీర్వదించబడటం మరియు ఆశీర్వాదానికి ప్రతిరూపం లేదా మూలం కావడం అనే భావాల మధ్య ఉన్న ఉద్రిక్తతను పరిష్కరించకుండా ఉంచడం.
  alternative: ‘నీవు అతనిపై ఎప్పటికీ ఆశీర్వాదాలు ఉంచుతావు’ లేదా ‘నీవు అతణ్ణి ఎప్పటికీ ఒక ఆశీర్వాదంగా చేస్తావు.’
  rationale: హీబ్రూ వాక్యం సంక్షిప్తంగా, అసాధారణంగా ఉంది. దానిని కేవలం భౌతిక శ్రేయస్సుగా గానీ, నిర్దిష్టమైన మెస్సీయ సంబంధిత అర్థంగా గానీ పరిమితం చేయడానికి మూలవచనం బలవంతం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కీర్తనాశైలిని వాడాం. మొదటి అర్ధవాక్యంలో హీబ్రూ అసాధారణతను ఉద్దేశపూర్వకంగా కొంత నిలిపి, దాని భావసాంద్రతను పాదటిప్పణిలో వివరించాం.
