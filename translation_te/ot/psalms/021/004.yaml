- from: అతడు నిన్ను జీవం అడిగాడు; నీవు అతనికి దాన్ని అనుగ్రహించావు—యుగయుగాల వరకు దీర్ఘాయుష్షు.[a][b]
  to: అతడు నీ వద్ద జీవాన్ని అడిగాడు; నీవు అతనికి దాన్ని ఇచ్చావు—యుగయుగాల వరకు దీర్ఘాయుష్షును.[a][b]
  rationale: The revision corrects the relation expressed by the Hebrew preposition מִן, rendering it naturally as “నీ వద్ద.” It also uses the unembellished equivalent “ఇచ్చావు” for “you gave,” while retaining the draft’s faithful rendering of the life/duration parallel and its interpretively open footnote.
