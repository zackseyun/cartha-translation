  text: חַיִּ֤ים שָׁאַ֣ל מִ֭מְּ/ךָ נָתַ֣תָּה לּ֑/וֹ אֹ֥רֶךְ יָ֝מִ֗ים עוֹלָ֥ם וָ/עֶֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/004.yaml
  text: He asked life from you[b][a]; you gave it to him—length of days forever and ever.
translation:
  language: te
  text: అతడు నీ వద్ద జీవాన్ని అడిగాడు; నీవు అతనికి దాన్ని ఇచ్చావు—యుగయుగాల వరకు దీర్ఘాయుష్షును.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘దినాల పొడవు’; అంటే ‘దీర్ఘ జీవితం.’
    reason: lexical_alternative
  - marker: b
    text: ‘యుగయుగాల వరకు’ అనే మాటను రాజుకు సుదీర్ఘ జీవితం, పాలనను తెలిపే రాజకవితా అతిశయోక్తిగా చదవవచ్చు; లేదా మెస్సీయలో మరింత సంపూర్ణంగా నెరవేరే భాషగా గ్రహించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: חַיִּים
  choice: జీవం
  rationale: రూపపరంగా బహువచనమైనా, ఇక్కడ ఈ నామవాచకం ‘జీవం’ అనే భావవాచక ఏకవచనార్థంలో ఉంది. తరువాతి పదబంధమే దాని దీర్ఘకాల పరిమాణాన్ని వివరిస్తుంది కాబట్టి, ఇక్కడే ‘దీర్ఘాయుష్షు’ అని విస్తరించలేదు.
- source_word: שָׁאַל מִמְּךָ
  choice: నిన్ను ... అడిగాడు
  rationale: מן మూలం లేదా ఎవరి వద్ద అడిగాడో సూచిస్తుంది. ఆధునిక సహజ తెలుగులో ‘నీ వద్ద ... అడిగాడు’ కంటే ‘నిన్ను ... అడిగాడు’ సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: נָתַתָּה לּוֹ
  choice: నీవు అతనికి దాన్ని అనుగ్రహించావు
  rationale: పూర్ణక్రియను కవితాత్మక వర్ణనలో భూతకాలంగా ఇచ్చాం. ముందు చెప్పిన ‘జీవం’ను సూచించేందుకు ‘దాన్ని’ చేర్చాం; దేవుని ప్రసాదాన్ని తెలిపే సందర్భంలో ‘అనుగ్రహించావు’ సహజమైన గౌరవభాష.
- source_word: אֹרֶךְ יָמִים
  choice: దీర్ఘాయుష్షు
  rationale: అక్షరార్థం ‘దినాల పొడవు’; తెలుగులో దాని సహజమైన నానుడి సమానార్థం ‘దీర్ఘాయుష్షు’. అక్షరానువాదమైన ‘దినాల పొడవు’ అసహజంగా ఉంటుంది.
- source_word: עוֹלָם וָעֶד
  choice: యుగయుగాల వరకు
  rationale: అపరిమితంగా కొనసాగు కాలాన్ని బలంగా వ్యక్తపరిచే ఈ జంట పదబంధానికి ‘యుగయుగాల వరకు’ సహజమైన, కవితాత్మక తెలుగు సమానం.
theological_decisions:
- issue: రాజకీయ కీర్తనలో రాజుకు అనుగ్రహించిన జీవకాల పరిమాణం
  choice: ‘యుగయుగాల వరకు’ అని మూలంలోని అపరిమిత కాలభాషను నేరుగా నిలిపాం.
  alternative: దీర్ఘకాల రాజ్యపాలనను సూచించే రాజసభా అతిశయోక్తిగా అనువదించడం; లేదా ప్రధాన వాక్యంలోనే మెస్సీయలో నెరవేరే నిత్యజీవంగా స్పష్టం చేయడం.
  rationale: హీబ్రూ పదబంధం స్వయంగా అపరిమిత కాలాన్ని చెబుతుంది. అది దావీదు వంశ రాజును గూర్చిన కవితాత్మక అతిశయోక్తా, లేక మెస్సీయలో సంపూర్ణ నెరవేర్పు పొందే భాషా అనే ఉద్వేగాన్ని అనువాదం పరిష్కరించకుండా కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, కీర్తనకు తగిన గౌరవప్రదమైన కవితాత్మక ధోరణి. ‘దినాల పొడవు’ అనే అసహజ అక్షరానువాదానికి బదులు ‘దీర్ఘాయుష్షు’ వాడి, అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
