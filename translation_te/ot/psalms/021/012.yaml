source:
  edition: WLC
  text: כִּ֭י תְּשִׁיתֵ֣/מוֹ שֶׁ֑כֶם בְּ֝/מֵֽיתָרֶ֗י/ךָ תְּכוֹנֵ֥ן עַל פְּנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/012.yaml
  text: For you will make them turn their back[c][b][a]; with your bowstrings you will aim at their faces.
translation:
  language: te
  text: 'ఎందుకంటే నీవు వారిని వెన్ను చూపేలా చేస్తావు[a];

    నీ విల్లునారులతో వారి ముఖాలపై గురిపెడతావు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, ‘నీవు వారిని భుజముగా ఉంచుతావు.’ ఈ హీబ్రూ నుడికారం శత్రువులు వెనుదిరిగి పారిపోవడాన్ని లేదా లక్ష్యాలుగా తమ వీపును చూపడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీ తాళ్లతో వారి ముఖాలపై సిద్ధం చేస్తావు.’ హీబ్రూ చిత్రణ సంక్షిప్తంగా ఉంది; ఇక్కడ విల్లు లేదా బాణాలు భావంలో అంతర్లీనంగా ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని నమ్మకానికి కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: תְּשִׁיתֵמוֹ שֶׁכֶם
  choice: నీవు వారిని వెన్ను చూపేలా చేస్తావు
  rationale: పదశః ‘వారిని భుజంగా ఉంచుతావు’ అనే సంక్షిప్త హీబ్రూ నుడికారాన్ని, శత్రువులు వెనుదిరిగి పారిపోయే భావంతో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּמֵיתָרֶיךָ
  choice: నీ వింటినారులతో
  rationale: מֵיתָר సాధారణంగా తాడు లేదా నారు; యుద్ధ సందర్భంలో విల్లునారులు ఉద్దేశించబడ్డాయని సందర్భం సూచిస్తుంది.
- source_word: תְּכוֹנֵן
  choice: గురిపెడతావు
  rationale: ఈ రూపానికి ‘సిద్ధం చేయు’ అనే ప్రాథమిక భావం ఉన్నా, విల్లునారులు మరియు ఎదురున్న శత్రువుల సందర్భంలో గురిపెట్టడమే సహజమైన సందర్భార్థం.
- source_word: עַל־פְּנֵיהֶם
  choice: వారి ముఖాలకు
  rationale: శత్రువుల ముఖాలనే ప్రత్యక్ష లక్ష్యంగా చూపే హీబ్రూ దృశ్యాన్ని నిలుపుతుంది.
theological_decisions:
- issue: వెనుకకు తిరిగిన శత్రువుల ముఖాలకు గురిపెట్టడం అనే కవితాత్మక ఉద్రిక్తత
  choice: రెండు పాదాలను సమాంతరంగా ఉంచడం
  alternative: ‘నీవు వారి ముఖాలకు గురిపెట్టినప్పుడు వారు వెన్ను చూపేలా చేస్తావు’ అని కాల లేదా కారణ సంబంధాన్ని చేర్చడం
  rationale: హీబ్రూ వాక్యం కాల లేదా కారణ సంబంధాన్ని స్పష్టంగా చెప్పదు. అందువల్ల ఆ సంబంధాన్ని అనువాదంలో చేర్చి అసలు కవితాత్మక సంక్షిప్తతను పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని పాటించాం. ‘వెన్ను చూపు’ సాధారణ పాఠకులకు అర్థమయ్యే సహజ నుడికారం. హీబ్రూలోని రెండు పాదాల మధ్య ఉన్న అస్పష్ట సంబంధాన్ని సెమీకోలన్ ద్వారా నిలిపి, కారణార్థకమైన ‘అప్పుడు/కాబట్టి’ వంటి పదాలను చేర్చలేదు.
