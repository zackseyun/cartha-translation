source:
  edition: WLC
  text: כִּֽי תְ֭קַדְּמֶ/נּוּ בִּרְכ֣וֹת ט֑וֹב תָּשִׁ֥ית לְ֝/רֹאשׁ֗/וֹ עֲטֶ֣רֶת פָּֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/003.yaml
  text: For you meet him with blessings of good[c][b][a]; you set a crown of fine gold on his head.
translation:
  language: te
  text: ఎందుకంటే, మంచి దీవెనలతో నీవు అతనిని ముందుగానే కలుస్తావు[a]; మేలిమి బంగారు కిరీటాన్ని[b] అతని తలపై ఉంచుతావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మంచి దీవెనలతో నీవు అతనికి ముందుగా వెళ్తావు,” లేదా “మంచి దీవెనలతో నీవు అతనిని కలుసుకోవడానికి వస్తావు.” హీబ్రూ క్రియకు ఎవరినైనా ముందుగానే కలవడం లేదా వారికి ముందుగా వెళ్లడం అనే భావఛాయలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “మేలిమి బంగారం” అనే మాటను “స్వచ్ఛమైన బంగారం” లేదా “శుద్ధిచేసిన బంగారం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలో చెప్పిన రాజు ఆనందానికి కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: תְקַדְּמֶנּוּ
  choice: నీవు అతనిని ఎదుర్కొంటావు
  rationale: קדם అనే క్రియలో ఉన్న ‘ఎదురుగా రావడం’ అనే భావాన్ని నిలుపుతూ, దేవుడే ముందడుగు వేస్తున్నాడనే అంతర్భావాన్ని సందర్భం ద్వారా వ్యక్తం చేస్తుంది.
- source_word: בִּרְכוֹת טוֹב
  choice: మంచి దీవెనలతో
  rationale: బహువచనమైన ‘దీవెనలు’ను నిలుపుతుంది; వాటిని కేవలం భౌతికమైనవిగా లేదా కేవలం ఆధ్యాత్మికమైనవిగా పరిమితం చేయకుండా טוֹב యొక్క విస్తృత భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: תָּשִׁית
  choice: ఉంచుతావు
  rationale: కిరీటాన్ని తలపై పెట్టడాన్ని ఆధునిక తెలుగులో సహజంగా, మూలంలోని సాధారణ స్థాపన క్రియకు సమీపంగా తెలియజేస్తుంది.
- source_word: לְרֹאשׁוֹ
  choice: అతని తలపై
  rationale: ఉంచడం అనే క్రియతో לְ ఉపసర్గకు సందర్భానుగుణమైన స్థానార్థాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עֲטֶרֶת
  choice: కిరీటాన్ని
  rationale: రాజును గూర్చిన ఈ కీర్తన సందర్భంలో ‘కిరీటం’ రాజరిక భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: פָּז
  choice: మేలిమి బంగారు
  rationale: అత్యుత్తమ నాణ్యతగల బంగారాన్ని సూచించే పదానికి గంభీరమైన, సులభంగా అర్థమయ్యే తెలుగు సమానార్థకం.
theological_decisions:
- issue: రాజుకు అనుగ్రహించిన దీవెనల స్వభావం
  choice: ‘మంచి దీవెనలు’ అని విస్తృతంగా అనువదించడం
  alternative: వాటిని ప్రత్యేకంగా భౌతిక సమృద్ధిగా లేదా ఆధ్యాత్మిక/నిబంధన దీవెనలుగా పేర్కొనడం
  rationale: మూలంలోని בִּרְכוֹת טוֹב అనే పదబంధం దీవెనల స్వభావాన్ని ఒకే వర్గానికి పరిమితం చేయదు; అందువల్ల దాని ఉద్దేశపూర్వక విస్తృతిని అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తనా కవిత్వానికి తగిన గంభీరతను నిలిపింది. వాక్యంలోని దైవీయ ముందడుగును, దీవెనల విస్తృత స్వభావాన్ని, రాజరిక చిత్రణను అతివ్యాఖ్యానం చేయకుండా కాపాడింది.
