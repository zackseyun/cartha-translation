  text: You will destroy their fruit from the earth[a], and their offspring from among the sons of man.
translation:
  language: te
  text: వారి ఫలాన్ని భూమి నుండి, వారి సంతానాన్ని మానవుల మధ్య నుండి నిర్మూలిస్తావు.[a]
