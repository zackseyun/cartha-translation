lexical_decisions:
- source_word: פִּרְיָמוֹ
  choice: వారి ఫలాన్ని
  rationale: పదశః ‘ఫలం’; సమాంతరంగా ఉన్న ‘సంతానం’ వల్ల ఇక్కడ వారసులను సూచించే కవితాత్మక రూపకంగా వినిపిస్తుంది. ఆ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: מֵאֶרֶץ
  choice: భూమిమీద లేకుండా
  rationale: אֶרֶץ కు ‘భూమి’ లేదా ‘దేశం’ అనే అర్థాలు ఉండవచ్చు. విస్తృతమైన తీర్పు సందర్భంలో ‘భూమి’ అనేది తగినది; ‘నుండి నాశనం’ అనే హెబ్రీ భావాన్ని సహజమైన తెలుగులో ‘భూమిమీద లేకుండా నాశనం’గా తెలిపాం.
- source_word: תְּאַבֵּד
  choice: నాశనం చేస్తావు
  rationale: అבד పియేల్ రూపం ‘నశింపజేయడం/నాశనం చేయడం’ అనే కారక భావాన్ని ఇస్తుంది; రెండవ పురుష ఏకవచన సంబోధనను నిలిపాం.
- source_word: וְזַרְעָם
  choice: వారి సంతానాన్ని
  rationale: זֶרַע పదశః ‘విత్తనం’, మనుషుల విషయంలో ‘సంతానం/వారసులు’. ఆధునిక తెలుగులో ‘సంతానం’ స్పష్టంగా ఉండి, ‘ఫలం’తోని సమాంతర భావాన్ని కాపాడుతుంది.
- source_word: מִבְּנֵי אָדָם
  choice: మానవుల మధ్యనుండి
  rationale: హెబ్రీ పదబంధం పదశః ‘ఆదాము కుమారుల మధ్యనుండి’; ఇది సాధారణంగా మానవజాతిని సూచించే నానుడి. తెలుగులో లింగపరంగా, అర్థపరంగా సహజమైన ‘మానవుల మధ్యనుండి’ని ఎంచుకున్నాం.
theological_decisions:
- issue: בְּנֵי אָדָם పదబంధంలో אָדָם అనువాదం
  choice: మానవుల మధ్యనుండి
  alternative: మనుష్యకుమారుల మధ్యనుండి
  rationale: ఈ పదబంధం ఒక నిర్దిష్ట పురుష వంశాన్ని కాక సాధారణ మానవాళిని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన సామూహిక అర్థాన్ని ఇచ్చి, హెబ్రీ రూపాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గంభీరమైన కవితా ధోరణి. ‘ఫలం’ అనే మూల రూపకాన్ని నిలిపి, మిగతా వాక్యాన్ని సాధారణ పాఠకులకు సహజంగా తీర్చిదిద్దాం.
