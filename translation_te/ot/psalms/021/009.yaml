source:
  edition: WLC
  text: תְּשִׁיתֵ֤/מוֹ כְּ/תַנּ֥וּר אֵשׁ֮ לְ/עֵ֪ת פָּ֫נֶ֥י/ךָ יְ֭הוָה בְּ/אַפּ֣/וֹ יְבַלְּעֵ֑/ם וְֽ/תֹאכְלֵ֥/ם אֵֽשׁ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/009.yaml
  text: You will make them like a fiery furnace at the time of your presence; Yahweh in his anger will swallow them up[a], and fire will consume them.
translation:
  language: te
  text: 'నీవు ప్రత్యక్షమయ్యే వేళ[a] వారిని మండే అగ్నికొలిమిలా చేస్తావు;

    యాహ్వే తన కోపంలో వారిని మింగివేస్తాడు,

    అగ్ని వారిని దహించివేస్తుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ సన్నిధి వేళ”; అక్షరార్థంగా, “నీ ముఖ సమయాన.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשִׁיתֵמוֹ
  choice: వారిని ... చేస్తావు
  rationale: שׁית అంటే ‘ఉంచు/నిలుపు/చేయు.’ తరువాత వచ్చే ఉపమానంతో కలిపి, వారిని ఆ స్థితికి గురిచేయడం అనే ఫలితార్థాన్ని ‘చేస్తావు’ సహజంగా తెలియజేస్తుంది.
- source_word: כְּתַנּוּר אֵשׁ
  choice: మండుతున్న పొయ్యిలా
  rationale: תנור అనేది అగ్ని మండే పొయ్యి లేదా కొలిమి. సాధారణ పాఠకులకు సహజంగా ఉండే ‘మండుతున్న పొయ్యి’ అనే రూపం తీవ్రమైన వేడి, నాశనం అనే దృశ్యాన్ని నిలుపుతుంది.
- source_word: לְעֵת פָּנֶיךָ
  choice: నీవు ప్రత్యక్షమయ్యే వేళ[a]
  rationale: అక్షరార్థంగా ‘నీ ముఖ సమయాన.’ פנים ఇక్కడ సన్నిధి లేదా ప్రత్యక్షతను సూచించగలదు. తెలుగు ప్రధాన పాఠ్యంలో ‘ప్రత్యక్షమయ్యే వేళ’ సహజంగా ఉండగా, ‘సన్నిధి’ అనే సాధ్యమైన భావాన్ని పాదసూచిక నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: בְּאַפּוֹ
  choice: తన కోపంలో
  rationale: אַף అక్షరార్థంగా ‘ముక్కు’ అయినా, ఈ సందర్భంలో కోపాన్ని సూచించే హీబ్రూ నుడికారం. ‘తన కోపంలో’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְבַלְּעֵם
  choice: వారిని మింగివేస్తాడు
  rationale: בלע అనే క్రియలోని ‘మింగివేయు’ అనే బలమైన రూపకాన్ని అలాగే నిలిపి, తరువాతి అగ్ని దహన క్రియతో తేడాను కాపాడాం.
- source_word: וְתֹאכְלֵם אֵשׁ
  choice: అగ్ని వారిని దహించివేస్తుంది
  rationale: ‘అగ్ని తినివేస్తుంది’ అనే అక్షరార్థ భావాన్ని తెలుగులో అగ్ని చర్యకు సహజమైన ‘దహించివేస్తుంది’గా వ్యక్తం చేశాం.
theological_decisions:
- issue: ‘నీ ముఖ సమయాన’ అనే మానవరూప వర్ణన
  choice: నీవు ప్రత్యక్షమయ్యే వేళ
  alternative: నీ సన్నిధి వేళ
  rationale: దేవుని ప్రత్యక్షత లేదా సన్నిధి అనే భావాన్ని నిలుపుతూ, దీనిని ప్రత్యేక అంత్యకాల సాంకేతిక పదంగా నిర్ధారించలేదు. మూలంలోని ‘ముఖం’ అనే రూపాన్ని పాదసూచికలో తెలిపాం.
- issue: దైవనామం יהוה
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగానే ఉంచాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపాన్ని ఎంచుకున్నాం.
- issue: రెండవ పురుషుని నుంచి మూడవ పురుషునికి మార్పు
  choice: ‘నీవు ... చేస్తావు’ తరువాత ‘యెహోవా ... మింగివేస్తాడు’ అనే మార్పును నిలిపాం
  alternative: రెండు భాగాల్లోనూ ఒకే పురుష రూపాన్ని వాడటం
  rationale: హీబ్రూ వాక్యంలో ఉన్న సంబోధన మార్పును సమతలపరచకుండా అలాగే ఉంచడం ద్వారా, రాజు మరియు యెహోవా చర్యల మధ్య ఉన్న అసలైన వాక్య నిర్మాణ ఉద్వేగాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గంభీరతతో కూడిన సరళమైన శైలి. సమాంతర పాద నిర్మాణాన్ని నిలిపి, అతిగా సంస్కృతీకరించిన పదజాలాన్ని నివారించాం.
