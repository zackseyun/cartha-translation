source:
  edition: WLC
  text: וַֽ֭/יהוָה לְ/עוֹלָ֣ם יֵשֵׁ֑ב כּוֹנֵ֖ן לַ/מִּשְׁפָּ֣ט כִּסְאֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/007.yaml
  text: But Yahweh sits enthroned forever[b][a]; he has established his throne for judgment.
translation:
  language: te
  text: అయితే యాహ్వే ఎప్పటికీ సింహాసనంపై ఆసీనుడై ఉన్నాడు[a]; న్యాయతీర్పు కొరకు ఆయన సింహాసనాన్ని స్థిరపరిచాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘కూర్చొని ఉన్నాడు’; సందర్భంలోని రాజసంబంధమైన సింహాసన భావాన్ని ప్రధాన పాఠం స్పష్టం చేస్తోంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘న్యాయం కోసం ఆయన సింహాసనాన్ని సిద్ధం చేశాడు.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיהוָה
  choice: అయితే యాహ్వే
  rationale: ముందటి సందర్భంలో దుష్టుల నాశనానికి విరుద్ధంగా యాహ్వే నిరంతర పాలనను చూపుతున్నందున וַ־ను ‘అయితే’ అని ఇచ్చాం; יהוהను వ్యక్తిగత దైవనామంగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- source_word: לְעוֹלָם
  choice: శాశ్వతంగా
  rationale: కాలపరమైన నిరంతరత్వాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יֵשֵׁב
  choice: సింహాసనాసీనుడై ఉన్నాడు
  rationale: మూల క్రియ అక్షరార్థంగా ‘కూర్చున్నాడు’; అయితే ఇదే వాక్యంలో సింహాసనం, న్యాయతీర్పు ప్రస్తావించబడటంతో రాజుగా, న్యాయాధిపతిగా ఆసీనుడై ఉండే భావాన్ని సందర్భానుగుణంగా వ్యక్తం చేస్తుంది.
- source_word: כּוֹנֵן
  choice: స్థిరపరిచాడు
  rationale: పోలేల్ రూపం దృఢంగా నెలకొల్పడం లేదా సిద్ధం చేయడం అనే భావాన్ని కలిగి ఉంది; ‘స్థిరపరిచాడు’ ఆ స్థిరత్వాన్ని కాపాడుతుంది.
- source_word: לַמִּשְׁפָּט
  choice: న్యాయం తీర్చడానికి
  rationale: מִשְׁפָּט ఇక్కడ దైవిక న్యాయనిర్ణయ క్రియను సూచిస్తుంది; తెలుగు వాడుకలో ‘న్యాయం తీర్చడం’ న్యాయం మరియు తీర్పు రెండింటి భావాన్నీ సహజంగా మోస్తుంది.
- source_word: כִּסְאוֹ
  choice: ఆయన తన సింహాసనాన్ని
  rationale: మూడవ పురుష ఏకవచన స్వామ్యార్థాన్ని స్పష్టంగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ప్రత్యక్షంగా నిలుపుతుంది.
- issue: יֵשֵׁבలోని దైవిక రాజత్వ భావం
  choice: సింహాసనాసీనుడై ఉన్నాడు
  alternative: కూర్చున్నాడు
  rationale: ‘కూర్చున్నాడు’ మూల క్రియకు నేరమైన రూపం; అయినా సింహాసనం, న్యాయతీర్పు అనే సమీప సందర్భం రాజసంబంధమైన భావాన్ని స్పష్టంగా సూచిస్తున్నందున ప్రధాన పాఠంలో దాన్ని వ్యక్తం చేసి, అక్షరార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: מִשְׁפָּט యొక్క న్యాయం/తీర్పు భావవ్యాప్తి
  choice: న్యాయం తీర్చడానికి
  alternative: తీర్పు తీర్చడానికి
  rationale: హీబ్రూ పదం న్యాయనిర్ణయం మరియు న్యాయస్థాపన రెండింటినీ సూచించగలదు; ఎంచుకున్న రూపం ఆ భావవ్యాప్తిని తెలుగులో కొంతవరకు నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. రాజసంబంధమైన కీర్తనాభాషను నిలుపుతూ, అతిగా ప్రాచీనమైన పదబంధాలను నివారించాం.
