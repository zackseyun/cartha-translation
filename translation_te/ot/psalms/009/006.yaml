id: PSA.9.6
reference: Psalms 9:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הָֽ/אוֹיֵ֨ב תַּ֥מּוּ חֳרָב֗וֹת לָ֫/נֶ֥צַח וְ/עָרִ֥ים נָתַ֑שְׁתָּ אָבַ֖ד זִכְרָ֣/ם הֵֽמָּה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/006.yaml
  text: The enemy has come to an end in everlasting ruins[a]; you have uprooted cities; the very memory of them has perished.
translation:
  language: te
  text: శత్రువా, విధ్వంసాలు శాశ్వతంగా అంతమయ్యాయి[a]; నీవు పట్టణాలను పెకలించివేశావు; వాటి జ్ఞాపకమే నశించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శత్రువు శాశ్వత శిథిలాల్లో అంతమయ్యాడు.” హీబ్రూ ప్రారంభాన్ని ‘శత్రువా’ అనే నేర సంబోధనగా కాక, ‘శత్రువు’ను వాక్యకర్తగా తీసుకుని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאוֹיֵב
  choice: శత్రువు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ఈ రూపాన్ని సహజంగా వాక్యకర్తగా తీసుకుని ‘శత్రువు’ అని అనువదించాం; సంబోధనగా తీసుకునే అవకాశాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: תַּמּוּ
  choice: అంతమయ్యాడు
  rationale: תמם అనే ధాతువు ముగింపుకు రావడం లేదా పూర్తిగా అంతమవడం అనే భావాన్ని ఇస్తుంది. హీబ్రూలో క్రియ బహువచనంగా ఉండటం వల్ల వాక్యనిర్మాణంలో అస్పష్టత ఉంది; ప్రధాన పఠనంలో శత్రువు అంతాన్ని సహజ తెలుగులో తెలిపాం.
- source_word: חֳרָבוֹת
  choice: శిథిలాలు
  rationale: ఈ నామవాచకం పాడైన స్థలాలు లేదా విధ్వంసాలను సూచిస్తుంది; ‘శిథిలాలు’ సందర్భంలోని పట్టణ విధ్వంస చిత్రణకు సరిపోతుంది.
- source_word: לָנֶצַח
  choice: నిత్య
  rationale: శాశ్వతత్వం లేదా ఎప్పటికీ నిలిచే స్థితిని సూచించే ఈ పదబంధాన్ని ‘శిథిలాలు’తో సహజంగా కలిపి ‘నిత్య శిథిలాలు’గా ఇచ్చాం.
- source_word: וְעָרִים
  choice: పట్టణాలను
  rationale: עִיר యొక్క సాధారణ అర్థం పట్టణం లేదా నగరం; ఆధునిక సాధారణ తెలుగులో ‘పట్టణాలు’ స్పష్టంగా ఉంటుంది.
- source_word: נָתַשְׁתָּ
  choice: పెకలించివేశావు
  rationale: נתשׁ వేరుతో సహా పీకివేయడం, పూర్తిగా తొలగించడం అనే బలమైన రూపకాన్ని కలిగి ఉంది; ‘పెకలించివేశావు’ ఆ సంపూర్ణ నిర్మూలనను నిలుపుతుంది.
- source_word: אָבַד
  choice: నశించింది
  rationale: నాశనం కావడం లేదా కనుమరుగవడం అనే భావాన్ని గంభీరమైన, సహజ తెలుగు పదంతో వ్యక్తం చేశాం.
- source_word: זִכְרָם
  choice: వాటి జ్ఞాపకం
  rationale: ప్రత్యయంతో కూడిన ఈ పదం వాటిని గూర్చిన జ్ఞాపకాన్ని సూచిస్తుంది; పట్టణాలకు తెలుగులో ‘వాటి’ సహజ అన్వయం.
- source_word: הֵמָּה
  choice: జ్ఞాపకమే
  rationale: చివరనున్న స్వతంత్ర సర్వనామం ఇచ్చే ఉద్ఘాటనను తెలుగులో ‘-ఏ’ నిశ్చయార్థక ప్రత్యయంతో సహజంగా వ్యక్తం చేశాం.
theological_decisions:
- issue: ప్రారంభ ఉపవాక్యపు వాక్యనిర్మాణం
  choice: శత్రువు అంతిమంగా నాశనమయ్యాడనే ప్రకటనగా చదవడం
  alternative: ‘ఓ శత్రువా, విధ్వంసాలు ఎప్పటికీ ముగిశాయి’ అనే సంబోధనాత్మక పఠనం
  rationale: הָאוֹיֵב రూపాన్ని నిర్దిష్ట వాక్యకర్తగా తీసుకోవడం సాధ్యమూ సందర్భానుకూలమూ. అయితే క్రియ బహువచనం మరియు హీబ్రూ పదక్రమం సంబోధనాత్మక ప్రత్యామ్నాయానికి అవకాశం ఇస్తాయి; అందువల్ల దానిని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గంభీరతతో కూడిన సాధారణ పదజాలం వాడాం. ‘పెకలించివేశావు’ ద్వారా మూలంలోని బలమైన రూపకాన్ని నిలిపి, చివరి ఉద్ఘాటనను ‘జ్ఞాపకమే’తో సహజీకరించాం.
