  yaml_path: translation/ot/psalms/009/013.yaml
  text: Be gracious to me[a], O Yahweh; see my affliction from those who hate me[b], you who lift me up from the gates of death.
translation:
  language: te
  text: యాహ్వే, నాపై కృప చూపు[a]; నన్ను ద్వేషించేవారి వల్ల కలిగిన నా బాధను చూడు, మరణ ద్వారాల[b] నుంచి నన్ను పైకి లేపేవాడా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నన్ను కరుణించు.”'
    reason: lexical_alternative
  - marker: b
    text: “మరణ ద్వారాలు” అనేది మరణపు అంచున లేదా మరణం అధికారంలో ఉండడాన్ని సూచించే హీబ్రూ రూపకం.
    reason: cultural_note
lexical_decisions:
- source_word: חָנְנֵנִי
  choice: నాపై కృప చూపు
  rationale: חנן ధాతువు ఆజ్ఞార్థక రూపంలో అనుగ్రహపూర్వకమైన దయను కోరుతుంది. ‘నాపై కృప చూపు’ మూలంలోని భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ‘నన్ను కరుణించు’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ లిప్యంతరీకరణగా ‘యాహ్వే’ అని ఇచ్చాం.
- source_word: רְאֵה
  choice: చూడు
  rationale: ראה ఆజ్ఞార్థక రూపానికి ఇది ప్రత్యక్షమైన, ప్రార్థనా సందర్భంలో సహజమైన అనువాదం.
- source_word: עָנְיִי
  choice: నా బాధను
  rationale: עֳנִי బాధ, దుస్థితి, శ్రమ అనే విస్తృత భావాన్ని కలిగివుంది. ‘నా బాధను’ శారీరక లేదా మానసిక కోణాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: מִשֹּׂנְאַי
  choice: నన్ను ద్వేషించేవారి వల్ల కలిగిన
  rationale: מן ఇక్కడ బాధకు మూలాన్ని సూచిస్తున్నదనే సహజమైన వాక్యసంబంధాన్ని స్పష్టం చేస్తుంది; శత్రువులు కలిగించిన బాధ అనే భావాన్ని అతిగా విస్తరించకుండా తెలియజేస్తుంది.
- source_word: מְרוֹמְמִי
  choice: నన్ను పైకి లేపేవాడా
  rationale: רום ధాతువు Polel వర్తమాన కృదంతం, ఏకవచన ప్రథమ పురుష ప్రత్యయంతో, యాహ్వేను సంబోధించే పదంగా ఉంది. తెలుగు సంబోధన రూపం దాని కృదంత బలాన్ని నిలుపుతుంది.
- source_word: מִשַּׁעֲרֵי מָוֶת
  choice: మరణ ద్వారాల నుంచి
  rationale: ఇది మరణపు అంచు లేదా మరణాధికారం అనే హీబ్రూ రూపకాన్ని నేరుగా నిలుపుతుంది; మూలంలో లేని ‘షియోల్’ను చేర్చదు.
theological_decisions:
- issue: יהוה దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ దానికి విస్తృతంగా అంగీకరించబడిన లిప్యంతరీకరణ; దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చలేదు.
- issue: ‘నన్ను ద్వేషించేవారి నుంచి/వల్ల’ అనే పదబంధపు వాక్యసంబంధం
  choice: '‘నా బాధ’తో అనుసంధానం: ‘నన్ను ద్వేషించేవారి వల్ల కలిగిన నా బాధ’'
  alternative: 'విడిగా: ‘నా బాధను చూడు; నన్ను ద్వేషించేవారిని చూడు’'
  rationale: హీబ్రూ పదక్రమంలో מן పదబంధం బాధకు మూలాన్ని సూచించడం అత్యంత సహజం. ప్రత్యామ్నాయ పఠనానికి మూలంలో లేని రెండవ ‘చూడు’ను పూరించాల్సి వస్తుంది.
- issue: ‘మరణ ద్వారాలు’ రూపకం
  choice: రూపకాన్ని యథాతథంగా ఉంచడం
  alternative: ‘మరణపు అంచు నుంచి’ అని భావానువాదం చేయడం
  rationale: మూలంలోని స్పష్టమైన కవితాత్మక చిత్రాన్ని ప్రధాన పాఠంలో నిలిపి, దాని భావాన్ని పాదసూచికలో వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలిని ఉపయోగించాం. హీబ్రూ కవితాత్మక రూపకాన్ని నిలిపాం; చివరి భాగాన్ని యాహ్వేను సంబోధించే కృదంత వాక్యంగా అనువదించాం.
