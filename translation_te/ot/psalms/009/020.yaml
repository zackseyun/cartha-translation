translation:
  language: te
  text: 'యెహోవా, వారికి భయం కలుగజేయి;

    జాతులు తాము కేవలం మనుషులేనని తెలుసుకొనునుగాక. సెలా'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיתָה
  choice: పుట్టించు
  rationale: ‘పెట్టు/నియమించు’ అనే మూలభావాన్ని מוֹרָהతో సహజమైన ఆధునిక తెలుగులో ‘భయం పుట్టించు’గా వ్యక్తపరుస్తుంది.
- source_word: מוֹרָה
  choice: భయం
  rationale: ఈ సందర్భంలో అరుదైన రూపానికి ‘భయం/భీతి’ అనే అర్థం సరిపోతుంది; ప్రత్యామ్నాయ పాఠసంభావ్యతను ఆధారంగా చేసుకొని ‘బోధకుడు’ అని మార్చలేదు.
- source_word: גּוֹיִם
  choice: జనాలు
  rationale: ఇక్కడ ఇశ్రాయేలుకు వెలుపలి సమూహాలను సూచించినా, సాధారణ పాఠకునికి సహజంగా ఉండే ‘జనాలు’ మూలంలోని బహువచన సామూహిక భావాన్ని నిలుపుతుంది.
- source_word: אֱנוֹשׁ
  choice: కేవలం మనుషులు
  rationale: אֱנוֹשׁ మానవుని బలహీన, మర్త్య స్వభావాన్ని సూచిస్తుంది; సందర్భంలోని దేవునితో వ్యత్యాసాన్ని ‘కేవలం’ స్పష్టంగా వినిపిస్తుంది.
- source_word: סֶּלָה
  choice: సెలా
  rationale: అర్థం నిర్ధారితం కాని ఆరాధనా/సంగీత సూచనను అనువదించి ఊహించకుండా లిప్యంతరీకరించింది.
theological_decisions:
- issue: జనాల మానవ పరిమితత్వం
  choice: తాము కేవలం మనుషులేనని
  alternative: తాము మర్త్యులని
  rationale: దేవుని ఎదుట వారి పరిమిత స్థితిని నిలుపుతూ, אֱנוֹשׁను మరణం అనే ఒక్క భావానికే కుదించకుండా మూలంలోని విస్తృత మానవ-బలహీనత భావాన్ని ఉంచుతుంది.
- issue: దైవనామం יהוה
  choice: యెహోవా
  alternative: ప్రభువా
  rationale: మూలంలో ఉన్న ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగు బైబిలు వాడుకలో పరిచితమైన రూపంలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనా స్వరాన్ని, ఆజ్ఞార్థక సమాంతర నిర్మాణాన్ని, సంక్షిప్త కవితా గంభీరతను కాపాడింది. ‘సెలా’ను వివరణ లేకుండా మూల సూచనగా నిలిపింది.
