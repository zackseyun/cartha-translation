source:
  edition: WLC
  text: כִּֽי דֹרֵ֣שׁ דָּ֭מִים אוֹתָ֣/ם זָכָ֑ר לֹֽא שָׁ֝כַ֗ח צַעֲקַ֥ת עניים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/012.yaml
  text: For the one who avenges bloodshed remembers them[a]; he does not forget the cry of the afflicted.
translation:
  language: te
  text: ఎందుకంటే రక్తపాతానికి లెక్క అడిగేవాడు వారిని జ్ఞాపకం చేసుకుంటాడు; బాధితుల[a] మొరను ఆయన మరచిపోడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పేదల.’ హీబ్రూ పదం పేదలు, బాధితులు, దీనులు లేదా అణచివేయబడినవారిని సూచించగలదు; ఇక్కడ రక్తపాతం మరియు న్యాయం కోసం మొర అనే సందర్భంలో ‘బాధితులు’ అనే విస్తృత భావం సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని లేదా ఆధారాన్ని పరిచయం చేస్తుంది; కీర్తనలోని వివరణాత్మక ప్రవాహాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: דֹרֵשׁ דָּמִים
  choice: రక్తపాతానికి లెక్క అడిగేవాడు
  rationale: ఈ పదబంధం రక్తపాతాన్ని న్యాయవిచారణకు లోబరచి దానికి బాధ్యులను జవాబుదారులుగా చేసే దేవుణ్ణి సూచిస్తుంది. ‘ప్రతీకారం తీర్చుకునేవాడు’ అనే భావం ఇందులో ఉన్నప్పటికీ, తెలుగు పాఠంలో న్యాయపరమైన జవాబుదారీతనాన్ని స్పష్టంగా ఉంచేందుకు ఈ రూపం ఎంచుకోబడింది.
- source_word: אוֹתָם
  choice: వారిని
  rationale: హీబ్రూ పాఠసంప్రదాయంలోని బహువచన కర్మరూపాన్ని నిలుపుతూ, బాధితుల సమూహాన్ని సూచిస్తుంది.
- source_word: זָכָר
  choice: జ్ఞాపకం చేసుకుంటాడు
  rationale: రూపపరంగా సంపూర్ణ క్రియ అయినా, కావ్య సందర్భంలో దేవుని నిరంతర స్వభావపూర్వక కార్యాన్ని వ్యక్తం చేస్తుంది.
- source_word: לֹא שָׁכַח
  choice: మరచిపోడు
  rationale: ముందున్న ‘జ్ఞాపకం చేసుకుంటాడు’ అనే క్రియకు సమాంతరంగా, దేవుడు వారి మొరను విస్మరించడనే కొనసాగుతున్న సత్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: צַעֲקַת
  choice: మొరను
  rationale: బాధలో దేవునికి చేసే ఆర్తనాదం లేదా సహాయవిన్నపం అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עניים
  choice: బాధితుల
  rationale: ఈ పదం పేదలు, బాధపడేవారు, దీనులు లేదా అణచివేయబడినవారిని సూచించగలదు. రక్తపాతం, న్యాయం కోసం మొర అనే సందర్భంలో ‘బాధితులు’ విస్తృత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: דֹרֵשׁ דָּמִים సూచించే దైవ న్యాయం
  choice: దేవుడు రక్తపాతానికి లెక్క అడిగి, దానికి బాధ్యులను జవాబుదారులుగా చేస్తాడు.
  alternative: దేవుడు రక్తపాతాన్ని కేవలం గమనిస్తాడు; లేదా అక్షరార్థంగా రక్తాన్ని వెదుకుతాడు.
  rationale: ఈ హీబ్రూ నుడికారం రక్తాపరాధంపై న్యాయపరమైన విచారణ, ప్రతిఫలాన్ని సూచిస్తుంది; రక్తం కోసం అక్షరార్థమైన అన్వేషణను కాదు. ప్రత్యేకమైన చట్టపరమైన ‘రక్తప్రతీకారకుడు’ అనే హోదాను పాఠంలోకి చేర్చకుండా దైవ న్యాయభావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. హీబ్రూ కవిత్వంలోని సమాంతర భావాలు, బహువచన సర్వనామం, న్యాయపరమైన దైవ చర్య నిలుపబడ్డాయి.
