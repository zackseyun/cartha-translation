revisions:
- from: సీయోను కుమార్తె ద్వారాల దగ్గర నీ స్తుతులన్నిటినీ నేను ప్రకటించడానికి, నీ రక్షణను బట్టి ఆనందిస్తాను.[a]
  to: సీయోను కుమార్తె ద్వారాల వద్ద నీ స్తుతులన్నిటినీ నేను ప్రకటించడానికి, నీ రక్షణలో ఆనందిస్తాను.[a]
  rationale: The revision preserves the Hebrew purpose clause, renders the preposition with “నీ రక్షణలో” rather than the more causally specific “ను బట్టి,” and uses the more standard “ద్వారాల వద్ద.” The title “సీయోను కుమార్తె,” the plural “స్తుతులన్నిటినీ,” and the lexical-alternative footnote are retained.
