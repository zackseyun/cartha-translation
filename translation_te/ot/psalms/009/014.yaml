  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לְמַ֥עַן אֲסַפְּרָ֗ה כָּֽל תְּהִלָּ֫תֶ֥י/ךָ בְּ/שַֽׁעֲרֵ֥י בַת צִיּ֑וֹן אָ֝גִ֗ילָה בִּ/ישׁוּעָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/014.yaml
  text: so that I may recount all your praises in the gates of Daughter Zion[a]; I will rejoice in your salvation.
translation:
  language: te
  text: సీయోను కుమార్తె ద్వారాల వద్ద నీ స్తుతులన్నిటినీ నేను ప్రకటించడానికి, నీ రక్షణలో ఆనందిస్తాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “రక్షణ” అనే హీబ్రూ పదం ఇక్కడ ప్రస్తుత ప్రమాదం నుంచి కలిగే “విడుదల”ను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: ప్రకటించడానికి
  rationale: తెలుగులో ఉద్దేశార్థాన్ని సహజంగా వ్యక్తం చేసే క్రియార్థక రూపం; ముందున్న సందర్భంలోని దేవుని కాపాడే కార్యానికి ఉద్దేశం/ఫలితాన్ని సూచిస్తుంది.
- source_word: אֲסַפְּרָה
  choice: నేను ప్రకటించడానికి
  rationale: פיעל రూపంలోని ‘వివరించి చెప్పు, ప్రకటించు’ అనే భావాన్ని బహిరంగ స్తుతి సందర్భంలో సహజంగా అందిస్తుంది.
- source_word: כָּל תְּהִלָּתֶיךָ
  choice: నీ స్తుతులన్నిటినీ
  rationale: బహువచన రూపాన్ని నిలుపుతూ, దేవునికి చెల్లే స్తుతులను లేదా ఆయన స్తుతించదగిన కార్యాలను సూచించే మూలంలోని భావవ్యాప్తిని కాపాడుతుంది.
- source_word: בְּשַׁעֲרֵי
  choice: ద్వారాల దగ్గర
  rationale: ב ఉపసర్గ ఇక్కడ ‘ద్వారాల వద్ద/దగ్గర’ అనే బహిరంగ సమాహార స్థలాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘దగ్గర’ సహజంగా ఉంటుంది.
- source_word: בַת צִיּוֹן
  choice: సీయోను కుమార్తె
  rationale: సీయోను/యెరూషలేమును స్త్రీగా వ్యక్తీకరించే హీబ్రూ కవితాత్మక బిరుదును నేరుగా నిలుపుతుంది.
- source_word: אָגִילָה
  choice: ఆనందిస్తాను
  rationale: గాఢమైన సంతోషాన్ని తెలిపే גיל భావాన్ని సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: בִּישׁוּעָתֶךָ
  choice: నీ రక్షణను బట్టి
  rationale: ישועה లోని రక్షణ/విడుదల భావవ్యాప్తిని ‘రక్షణ’ నిలుపుతుంది; ב ను తెలుగులో కారణం లేదా ఆధారాన్ని సహజంగా తెలిపే ‘ను బట్టి’గా వ్యక్తం చేసింది.
theological_decisions:
- issue: ישועה పదాన్ని అనువదించడం
  choice: రక్షణ
  alternative: విడుదల
  rationale: సందర్భంలో శత్రువుల ప్రమాదం నుంచి విడిపించడం ప్రధానమైనప్పటికీ, ‘రక్షణ’ మూలపదంలోని విస్తృత భావాన్ని నిలుపుతుంది. తక్షణ ప్రమాదం నుంచి విడిపించే అర్థాన్ని పాదసూచికలో స్పష్టపరచడం ద్వారా భావంలోని ఉద్వేగాన్ని పరిష్కరించకుండా కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గౌరవప్రదమైన కవితాత్మక శైలి. ‘సీయోను కుమార్తె’ అనే మూలభాషా వ్యక్తీకరణను నిలిపి, వాక్య నిర్మాణాన్ని తెలుగు పఠనానికి సహజంగా అమర్చాం.
