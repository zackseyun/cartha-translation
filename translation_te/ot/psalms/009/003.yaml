id: PSA.9.3
reference: Psalms 9:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/שׁוּב אוֹיְבַ֥/י אָח֑וֹר יִכָּשְׁל֥וּ וְ֝/יֹאבְד֗וּ מִ/פָּנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/003.yaml
  text: When my enemies turn back[a], they stumble and perish before you.
translation:
  language: te
  text: 'నా శత్రువులు వెనుదిరిగినప్పుడు,

    నీ ఎదుట[a] వారు తొట్రిల్లి నశిస్తారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ సన్నిధి నుండి’; అక్షరార్థంగా, ‘నీ ముఖము ఎదుట నుండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּב
  choice: తిరిగినప్పుడు
  rationale: בְּ + infinitive construct ఇక్కడ కాలార్థక ఉపవాక్యాన్ని పరిచయం చేస్తుంది. ‘తిరిగినప్పుడు’ సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: אוֹיְבַי
  choice: నా శత్రువులు
  rationale: אויבకు ప్రథమ పురుష ఏకవచన ప్రత్యయం కలిసిన రూపం; నేరుగా ‘నా శత్రువులు’ అని అర్థం.
- source_word: אָחוֹר
  choice: వెనక్కి
  rationale: שובతో కలిసి తిరోగమనం లేదా వెనుదిరగడాన్ని సూచించే క్రియావిశేషణార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יִכָּשְׁלוּ
  choice: వారు తొట్రిల్లి
  rationale: כשל నిఫాల్ రూపంలోని తొట్రిల్లడం లేదా తడబడడం అనే దృశ్యరూపాన్ని నిలుపుతుంది; వెంటనే వచ్చే నాశన భావాన్ని ముందుగానే ఇందులో కలపదు.
- source_word: וְיֹאבְדוּ
  choice: నశిస్తారు
  rationale: אבד కాల్ రూపం ‘నశించడం/అంతరించడం’ అనే భావాన్ని ఇస్తుంది. ‘నశిస్తారు’ కవితాత్మక సమాంతరతను నిలుపుతూ నాశన విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: מִפָּנֶיךָ
  choice: నీ సన్నిధిలో
  rationale: అక్షరార్థంగా ‘నీ ముఖము/సన్నిధి నుండి’ అనే నిర్మాణం. సందర్భంలో దేవుని సమక్షంలో శత్రువులు కూలిపోవడాన్ని ‘నీ సన్నిధిలో’ సహజంగా వ్యక్తం చేస్తుంది; మూలంలోని מִן సూచించే ‘నీ సన్నిధి నుండి/ఎదుటనుండి’ భావాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: శత్రువుల పతనంలో దేవుని కార్యసాధకత్వం
  choice: శత్రువులు దేవుని సన్నిధిలో తొట్రిల్లి నశిస్తారని మాత్రమే వచనం చెబుతుంది; అది ఎలా జరుగుతుందో విస్తరించలేదు.
  alternative: దేవుడే వారిని నేరుగా నాశనం చేస్తాడు; లేదా దేవుని సన్నిధిని చూడగానే వారు కూలిపోతారు.
  rationale: హీబ్రూ పాఠం వారు దేవుని ‘ముఖము/సన్నిధి నుండి’ తొట్రిల్లి నశిస్తారని చెబుతుంది. తీర్పు జరిగే ఖచ్చిత విధానాన్ని నిర్ణయించకుండా ఆ దైవసంబంధ భావబలాన్ని అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలిని వాడాం. ‘తొట్రిల్లి నశిస్తారు’ అనే వరుస మూలంలోని రెండు క్రియల అభివృద్ధిని నిలుపుతుంది.
