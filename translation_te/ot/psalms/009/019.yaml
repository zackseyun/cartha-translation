source:
  edition: WLC
  text: קוּמָ֣/ה יְ֭הוָה אַל יָעֹ֣ז אֱנ֑וֹשׁ יִשָּׁפְט֥וּ ג֝וֹיִ֗ם עַל פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/019.yaml
  text: Rise up[a], O Yahweh; do not let man prevail; let the nations be judged before you.
translation:
  language: te
  text: యాహ్వే, లేవుము! నరుడు పైచేయి సాధించనివ్వకు; జనములు నీ సన్నిధిలో తీర్పు పొందుదురు గాక.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నరుడు” అని అనువదించిన హీబ్రూ పదమైన אֱנוֹשׁ మానవుని బలహీనతను లేదా మరణశీలతను ప్రత్యేకంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: లేచి రా
  rationale: దేవునికి ఉద్దేశించిన קום ఆజ్ఞారూపాన్ని సహజమైన ఆధునిక తెలుగు విన్నపంగా వ్యక్తం చేస్తుంది; దైవ జోక్యాన్ని కోరే కీర్తన స్వరాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన నామరూపంగా అందిస్తుంది.
- source_word: אַל יָעֹז
  choice: పైచేయి సాధించనివ్వకు
  rationale: నిషేధార్థక విన్నపాన్ని, సందర్భంలో మనిషి బలపడి విజయం పొందకూడదనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֱנוֹשׁ
  choice: నరుడు
  rationale: ఏకవచన ప్రతినిధి భావాన్ని ఉంచుతూ, బలహీనమైన లేదా మరణశీలమైన మానవుణ్ణి సూచించే పదానికి గంభీరమైన తెలుగు సమానార్థకాన్ని ఇస్తుంది.
- source_word: יִשָּׁפְטוּ
  choice: తీర్పు పొందాలి
  rationale: నిఫాల్ రూపంలోని న్యాయపరమైన నిష్క్రియార్థాన్ని, జనాలు దేవుని తీర్పుకు లోబడాలనే ప్రార్థనా భావంతో నిలుపుతుంది.
- source_word: גּוֹיִם
  choice: జనాలు
  rationale: వివిధ ప్రజాసమూహాలు లేదా దేశజనాలను సూచించే విస్తృత భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: עַל־פָּנֶיךָ
  choice: నీ సన్నిధిలో
  rationale: అక్షరార్థంగా ‘నీ ముఖం ఎదుట’ అనే హీబ్రూ ప్రయోగాన్ని, దేవుని సమక్షంలో తీర్పు జరగడాన్ని సూచించే సహజ తెలుగు రూపంలో అందిస్తుంది.
theological_decisions:
- issue: אֱנוֹשׁ పదంలోని మానవ బలహీనత, మరణశీలత భావం
  choice: నరుడు
  alternative: మరణశీలుడైన మనిషి
  rationale: ‘నరుడు’ ఏకవచన ప్రతినిధి భావాన్ని, దేవునితో పోల్చిన మానవ పరిమితిని సంక్షిప్తంగా నిలుపుతుంది; మరణశీలతను ప్రధాన పాఠంలో అతిగా స్పష్టీకరించకుండా అడుగుసూచనలో తెలియజేస్తుంది.
- issue: יִשָּׁפְטוּ యొక్క న్యాయపరమైన అర్థం
  choice: తీర్పు పొందాలి
  alternative: పరిపాలించబడాలి
  rationale: ఈ సందర్భంలో జనాలు దేవుని ఎదుట న్యాయవిచారణకు లోబడాలనే భావం బలంగా ఉంది; అయినా క్రియకు కొన్ని సందర్భాల్లో పరిపాలన భావం ఉండవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనాత్మకమైన, గంభీరమైన కీర్తన శైలి. దైవనామానికి ‘యెహోవా’ వాడబడింది. ‘లేచి రా’ ప్రత్యక్ష సంబోధనలో సహజంగా ఉండగా, ‘పైచేయి సాధించనివ్వకు’ సందర్భానుగుణ విజయం లేదా ఆధిపత్య భావాన్ని వ్యక్తం చేస్తుంది.
