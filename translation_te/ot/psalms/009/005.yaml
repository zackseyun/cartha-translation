  text: גָּעַ֣רְתָּ ג֭וֹיִם אִבַּ֣דְתָּ רָשָׁ֑ע שְׁמָ֥/ם מָ֝חִ֗יתָ לְ/עוֹלָ֥ם וָ/עֶֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/005.yaml
  text: You rebuked nations[a]; you destroyed the wicked[b]; you blotted out their name forever and ever.
translation:
  language: te
  text: నీవు జనాంగాలను గద్దించావు; దుష్టులను[a] నాశనం చేశావు; వారి పేరును[b] యుగయుగాలకు తుడిచివేశావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘దుష్టుణ్ణి.’ ఈ ఏకవచనం ఒక దుష్ట వ్యక్తిని లేదా దుష్టుల వర్గాన్ని సమిష్టిగా సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా ‘వారి పేరు’; సందర్భంలో ఇది వారి జ్ఞాపకం లేదా కీర్తి పూర్తిగా తొలగిపోవడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּעַרְתָּ
  choice: గద్దించావు
  rationale: ఈ క్రియ బలమైన మందలింపును సూచిస్తుంది. ‘గద్దించావు’ దాని ప్రత్యక్షతను, తీర్పు సందర్భంలోని తీవ్రతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: גּוֹיִם
  choice: జనాంగాలను
  rationale: కీర్తనలో ఇది సమిష్టి ప్రజాసమూహాలైన జనాంగాలను సూచిస్తుంది. ‘అన్యజనులు’ అని అనువదిస్తే మూలంలో స్పష్టంగా లేని మతపరమైన భేదాన్ని చేర్చే అవకాశం ఉంది.
- source_word: אִבַּדְתָּ
  choice: నాశనం చేశావు
  rationale: పియేల్ రూపం నశింపజేయడం అనే బలమైన కారణార్థాన్ని వ్యక్తం చేస్తుంది; ‘నాశనం చేశావు’ తీర్పు సందర్భానికి తగిన సహజమైన అనువాదం.
- source_word: רָשָׁע
  choice: దుష్టులను
  rationale: హీబ్రూలో పదం ఏకవచనంలో ఉన్నా, ఒక వర్గాన్ని సమిష్టిగా లేదా సాధారణంగా సూచించగలదు. ముందున్న ‘జనాంగాలు,’ తరువాతి బహువచన సంబంధసూచకం దృష్ట్యా తెలుగులో ‘దుష్టులను’ సహజంగా ఉంటుంది; ఏకవచన సాధ్యతను పాదసూచికలో నిలిపాం.
- source_word: שְׁמָם
  choice: వారి పేరును
  rationale: అక్షరార్థం ‘వారి పేరు.’ అది వారి జ్ఞాపకం లేదా కీర్తిని కూడా సూచించవచ్చు; ప్రధాన పాఠంలో మూల రూపకాన్ని ఉంచి, విస్తృత భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: מָחִיתָ
  choice: తుడిచివేశావు
  rationale: ఈ క్రియ రాతను లేదా జ్ఞాపకాన్ని పూర్తిగా చెరిపివేయడం అనే సజీవ రూపకాన్ని కలిగిస్తుంది. ‘పేరును తుడిచివేశావు’ తెలుగులో ఆ రూపకాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לְעוֹלָם וָעֶד
  choice: యుగయుగాలకు
  rationale: ఈ జంట పదబంధం అంతులేని కాలాన్ని బలంగా వ్యక్తం చేస్తుంది. ‘యుగయుగాలకు’ దాని గంభీరతను, కాలవ్యాప్తిని సంక్షిప్తంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: רָשָׁע అనే ఏకవచనానికి సమిష్టి భావమా, వ్యక్తిగత భావమా?
  choice: 'సమిష్టి/సాధారణ భావం: ‘దుష్టులు’'
  alternative: 'వ్యక్తిగత భావం: ‘దుష్టుడు’'
  rationale: ఏకవచన రూపం ఒక వ్యక్తిని లేదా ఒక వర్గానికి ప్రతినిధిగా నిలిచే సాధారణ ఏకవచనాన్ని సూచించవచ్చు. ‘జనాంగాలు’ అనే సమాంతర పదం, తరువాత వచ్చే ‘వారి పేరు’ అనే బహువచన సూచన సమిష్టి భావానికి మద్దతిస్తాయి; అయినా వ్యక్తిగత పఠనాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన కీర్తనా శైలిని అనుసరించాం. సమాంతర వాక్య నిర్మాణాన్ని నిలిపి, మూలంలోని తీర్పు తీవ్రతను మృదువుపరచలేదు.
