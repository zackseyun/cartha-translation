    text: లేదా ‘నా తీర్పును, నా వ్యాజ్యాన్ని’ లేదా ‘నా హక్కును, నా కేసును.’ హీబ్రూలో న్యాయసమర్థనను సూచించే రెండు న్యాయపరమైన పదాలు జతగా ఉన్నాయి.
