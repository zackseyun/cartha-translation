    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి స్తుతికి కారణాన్ని పరిచయం చేసే హేతువాచక సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: עָשִׂיתָ
  choice: సమర్థించావు
  rationale: మిశ్పాట్, దీన్ అనే న్యాయపరమైన కర్మలతో వచ్చినప్పుడు, కేవలం ‘చేశావు’ అనే అర్థం కాకుండా ఒకరి న్యాయమైన హక్కు లేదా వ్యాజ్యాన్ని నిలబెట్టడం అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מִשְׁפָּטִי
  choice: నా న్యాయాన్ని
  rationale: ఈ పదంలో న్యాయం, తీర్పు, న్యాయమైన హక్కు అనే భావాలు ఉన్నాయి; జతగా ఉన్న న్యాయపరమైన పదంతో కలిసి కీర్తనకర్తకు జరిగిన న్యాయసమర్థనను సూచిస్తుంది.
- source_word: וְדִינִי
  choice: నా వ్యాజ్యాన్ని
  rationale: న్యాయస్థానంలో విచారణకు వచ్చే కేసు లేదా వాదాన్ని సూచించే భావాన్ని నిలుపుతూ, మునుపటి ‘న్యాయం’ అనే పదం నుంచి భేదాన్ని కాపాడుతుంది.
- source_word: יָשַׁבְתָּ
  choice: కూర్చున్నావు
  rationale: న్యాయాధిపతిగా సింహాసనంపై ఆసీనుడైన దృశ్యాన్ని సరళంగా, నేరుగా వ్యక్తం చేస్తుంది.
- source_word: לְכִסֵּא
  choice: సింహాసనంపై
  rationale: రాజుగా, న్యాయాధిపతిగా దేవుడు ఆసీనుడై ఉన్న న్యాయపరమైన దృశ్యానికి సహజమైన తెలుగు రూపం.
- source_word: שׁוֹפֵט
  choice: తీర్పు తీర్చే
  rationale: హీబ్రూ కృదంతంలోని కొనసాగుతున్న న్యాయాధిపతి పాత్రను తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: צֶדֶק
  choice: న్యాయంగా
  rationale: ‘నీతి/న్యాయం’ అనే నామవాచకం ఇక్కడ క్రియావిశేషణ భావంతో వాడబడింది; ‘న్యాయంగా’ సాధారణ పాఠకులకు సహజంగా ఉండి న్యాయసమ్మత తీర్పును తెలియజేస్తుంది.
theological_decisions:
- issue: దైవిక న్యాయాధిపతి దృశ్యం
  choice: దేవుడు సింహాసనంపై ఆసీనుడైన న్యాయాధిపతిగా కీర్తనకర్త న్యాయాన్ని, వ్యాజ్యాన్ని సమర్థిస్తున్నట్లు అనువదించబడింది.
  alternative: దేవుడు సాధారణంగా కీర్తనకర్త పక్షాన కార్యం చేశాడనే విస్తృత భావం.
  rationale: מִשְׁפָּט, דִּין అనే న్యాయపరమైన జతపదాలతో పాటు సింహాసనం, తీర్పు తీర్చడం అనే భాష కూడా స్పష్టమైన న్యాయస్థాన దృశ్యాన్ని బలపరుస్తుంది; తరువాతి సిద్ధాంత వర్గీకరణలను చేర్చకుండా ఆ దృశ్యాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘న్యాయం—వ్యాజ్యం—తీర్పు—సింహాసనం’ అనే న్యాయపరమైన పదజాల సంబంధాన్ని ఉద్దేశపూర్వకంగా నిలిపాం; హీబ్రూ పదజతలోని ప్రత్యామ్నాయ భావాలను పాదసూచిలో ఇచ్చాం.
