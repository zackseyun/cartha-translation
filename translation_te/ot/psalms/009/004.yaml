  text: ఎందుకంటే నీవు నా న్యాయాన్ని, నా వ్యాజ్యాన్ని సమర్థించావు[a]; న్యాయంగా తీర్పు తీర్చే నీవు సింహాసనంపై కూర్చున్నావు[b].
  philosophy: optimal-equivalence
  footnotes:
