id: PSA.9.18
reference: Psalms 9:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י לֹ֣א לָ֭/נֶצַח יִשָּׁכַ֣ח אֶבְי֑וֹן תִּקְוַ֥ת ענוים תֹּאבַ֥ד לָ/עַֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/018.yaml
  text: For the needy will not be forgotten forever[b][a]; the hope of the afflicted will not perish forever.
translation:
  language: te
  text: ఎందుకంటే, అవసరంలో ఉన్నవాడు శాశ్వతంగా మరచిపోబడడు; బాధితుల[a] ఆశ ఎప్పటికీ నశించదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దీనుల” లేదా “వినయుల.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ కవిత్వంలో ఇక్కడ “శాశ్వతంగా,” “ఎప్పటికీ” అనే రెండు సమీపార్థక కాలవ్యక్తీకరణలు ఉన్నాయి. అవసరంలో ఉన్నవారు శాశ్వతంగా విడిచిపెట్టబడరనే నిశ్చయాన్ని అవి నొక్కిచెబుతున్నాయి.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ప్రార్థనకు ఆధారాన్ని లేదా నిశ్చయాన్ని తెలిపే అనుసంధాన పదంగా సహజమైన తెలుగులో అందిస్తుంది.
- source_word: לָנֶצַח
  choice: శాశ్వతంగా
  rationale: దీర్ఘకాలికంగా లేదా ఎప్పటికీ అనే కాలార్థాన్ని మొదటి పాదంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִשָּׁכַח
  choice: మరచిపోబడడు
  rationale: హీబ్రూ నిఫాల్ క్రియలోని కర్మణి భావాన్ని నిలుపుతూ, దేవుణ్ణి వాక్యంలో స్పష్టమైన కర్తగా చేర్చకుండా ఉంటుంది.
- source_word: אֶבְיוֹן
  choice: అవసరంలో ఉన్నవాడు
  rationale: ఆర్థిక పేదరికానికే పరిమితం చేయకుండా కొరతలోను నిస్సహాయ స్థితిలోను ఉన్న వ్యక్తిని సూచిస్తుంది.
- source_word: תִּקְוַת
  choice: ఆశ
  rationale: తరువాతి నామవాచకంతో నిర్మాణ సంబంధాన్ని తెలుగులో ‘బాధితుల ఆశ’గా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ענוים
  choice: బాధితులు
  rationale: ‘దీనులు/వినయులు’ అనే భావసాధ్యతను నిరాకరించకుండా, אֶבְיוֹןతో ఉన్న సమాంతరతలో బాధ మరియు అణచివేత స్థితిని ముందుకు తెస్తుంది.
- source_word: תֹּאבַד
  choice: నశించదు
  rationale: אבד క్రియలోని ‘నశించు, లేకుండాపోవు’ భావాన్ని అందిస్తుంది; మొదటి పాదంలోని నిరాకరణను సమాంతర భావం ప్రకారం తెలుగులో స్పష్టంగా పునరుద్ఘాటిస్తుంది.
- source_word: לָעַד
  choice: ఎప్పటికీ
  rationale: לָנֶצַחకు సమీపార్థకమైన కాలవ్యక్తీకరణ; తెలుగు కవితా సమాంతరతలో సహజ వైవిధ్యంతో అదే శాశ్వత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘మరచిపోబడడు’ అనే కర్మణి క్రియకు అంతర్లీన కర్త
  choice: దేవుడు అవసరంలో ఉన్నవాణ్ణి మరచిపోడనే భావాన్ని సందర్భానికి వదిలి, అనువాదంలో కర్మణి నిర్మాణాన్ని నిలుపడం.
  alternative: దేవుడు అవసరంలో ఉన్నవాణ్ణి శాశ్వతంగా మరచిపోడు.
  rationale: హీబ్రూ వాక్యం దేవుణ్ణి ప్రత్యక్ష కర్తగా పేర్కొనదు. కర్మణి రూపాన్ని నిలపడం మూలంలోని కవితా రూపాన్ని, ఉద్దేశపూర్వక పరోక్షతను కాపాడుతుంది.
- issue: ענוים పదార్థం
  choice: బాధితులు
  alternative: దీనులు; వినయులు; సాత్వికులు
  rationale: ఈ పదానికి సామాజిక బాధ మరియు అంతరంగ వినయం రెండూ భావసాధ్యాలు. ఇక్కడ ‘అవసరంలో ఉన్నవాడు’తో సమాంతరంగా రావడం వల్ల బాధిత స్థితి ప్రధానంగా కనిపిస్తుంది; ప్రత్యామ్నాయ భావాలను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని రెండు సమాంతర పాదాలు, కర్మణి నిర్మాణం, కాలార్థపు పునరుక్తి నిలుపబడ్డాయి; తెలుగులో సహజత్వం కోసం ‘శాశ్వతంగా/ఎప్పటికీ’ అనే సమీపార్థక జంట వాడబడింది.
