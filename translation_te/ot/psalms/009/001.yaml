source:
  edition: WLC
  text: אוֹדֶ֣ה יְ֭הוָה בְּ/כָל לִבִּ֑/י אֲ֝סַפְּרָ֗ה כָּל נִפְלְאוֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/001.yaml
  text: I will give thanks to Yahweh with all my heart[a]; I will recount all your wondrous deeds.
translation:
  language: te
  text: 'నా పూర్ణహృదయంతో యాహ్వేకు కృతజ్ఞతలు చెల్లిస్తాను;

    నీ అద్భుత కార్యాలన్నిటినీ[a] చెబుతాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘నీ అద్భుతాలు’ లేదా ‘నీ అద్భుత కార్యాలు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדֶה
  choice: కృతజ్ఞతలు చెల్లిస్తాను
  rationale: ידה అనే క్రియ యొక్క హిఫీల్ రూపం ఆరాధన సందర్భంలో కృతజ్ఞత తెలపడం లేదా స్తుతించడం అనే భావాన్ని ఇస్తుంది. ఈ కీర్తనలోని కృతజ్ఞతా స్వరాన్ని స్పష్టంగా వ్యక్తం చేయడానికి ఈ రూపం ఎంచుకోబడింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ మూలంలో ఉన్న దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణకు అనుగుణంగా తెలుగులో ‘యాహ్వే’ అని ఇచ్చాం.
- source_word: בְּכָל לִבִּי
  choice: నా హృదయమంతటితో
  rationale: ఇది సంపూర్ణమైన అంతరంగ నిబద్ధతను తెలిపే హీబ్రూ నుడికారం. כָל తెలిపే సంపూర్ణతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֲסַפְּרָה
  choice: వివరిస్తాను
  rationale: ספר క్రియ ఇక్కడ దేవుని కార్యాలను చెప్పడం, వివరంగా ప్రకటించడం అనే భావాన్ని కలిగిస్తుంది. ‘వివరిస్తాను’ సాక్ష్యంగా వాటిని తెలియజేసే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: כָּל
  choice: అన్నిటినీ
  rationale: దేవుని అద్భుత కార్యాల సమగ్రతను సూచించే హీబ్రూ పదం యొక్క బలాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: נִפְלְאוֹתֶיךָ
  choice: నీ అద్భుత కార్యాలు
  rationale: פלא మూలం ఆశ్చర్యం కలిగించే అసాధారణ కార్యాలను, ముఖ్యంగా దేవుని శక్తిమంతమైన జోక్యాలను సూచిస్తుంది. ‘అద్భుత కార్యాలు’ ఆశ్చర్య భావాన్నీ క్రియాత్మక భావాన్నీ రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠం చతురక్షర దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా, Yahweh అనే పండిత లిప్యంతరీకరణకు సరిపోయే ‘యాహ్వే’ రూపాన్ని వాడటం దేవుని వ్యక్తిగత నామాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన ఆరాధనా శైలి ఉపయోగించబడింది. హీబ్రూ కవిత్వంలోని రెండు సమాంతర పాదాలు మరియు సమగ్రతను తెలిపే ‘హృదయమంతటితో/అన్నిటినీ’ అనే జత భావాలు నిలుపబడ్డాయి.
