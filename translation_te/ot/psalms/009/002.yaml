- from: నీలో నేను సంతోషించి ఉల్లసిస్తాను; సర్వోన్నతుడా, నీ నామాన్ని స్తుతిస్తూ పాడుతాను.[a]
  to: నీలో నేను సంతోషిస్తాను, ఉల్లసిస్తాను; సర్వోన్నతుడా, నీ నామాన్ని స్తుతిస్తూ గానం చేస్తాను.[a]
  rationale: The revision corrects the Telugu clause relationship so that both joy expressions remain parallel, as in the Hebrew. It also slightly smooths the rendering of זמר while retaining both singing and praise. The divine title remains a direct vocative, and no interpretive theological expansion has been introduced.
