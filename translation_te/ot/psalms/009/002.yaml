source:
  edition: WLC
  text: אֶשְׂמְחָ֣ה וְ/אֶעֶלְצָ֣ה בָ֑/ךְ אֲזַמְּרָ֖ה שִׁמְ/ךָ֣ עֶלְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/002.yaml
  text: I will rejoice and exult in you[a]; I will sing praise to your name[b], Most High.
translation:
  language: te
  text: నీలో నేను సంతోషిస్తాను, ఉల్లసిస్తాను; సర్వోన్నతుడా, నీ నామాన్ని స్తుతిస్తూ గానం చేస్తాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘స్తుతిస్తూ గానం చేస్తాను’ అని అనువదించిన హీబ్రూ పదానికి ‘సంగీతంతో స్తుతిస్తాను’ అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׂמְחָה
  choice: నేను సంతోషించి
  rationale: שׂמח అనే మూలపదం సంతోషించడం, ఆనందించడం అనే భావాన్ని ఇస్తుంది. మొదటి పురుష రూపంలోని సంకల్ప/భవిష్యత్ ఛాయను సహజమైన ఆధునిక తెలుగులో ‘సంతోషిస్తాను’గా అందిస్తుంది.
- source_word: וְאֶעֶלְצָה
  choice: ఉల్లసిస్తాను
  rationale: עלץ తీవ్రమైన, ఉప్పొంగే ఆనందాన్ని సూచిస్తుంది. ముందున్న క్రియతో భేదాన్ని నిలుపుతూ ‘ఉల్లసిస్తాను’ దాని ఉత్సాహభరిత భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בָךְ
  choice: నీలో
  rationale: בָךְ ఇక్కడ ఆనందానికి కేంద్రమైన దేవుణ్ణి సూచిస్తుంది. ‘నీలో’ మూలంలోని సంక్షిప్తతను, ‘నిన్నుబట్టి’ అని కూడా అర్థం చేసుకోగల భావవ్యాప్తిని కాపాడుతుంది.
- source_word: אֲזַמְּרָה
  choice: స్తుతిస్తూ పాడుతాను
  rationale: זמר పియేల్ రూపం సాధారణంగా సంగీతంతో స్తుతించడం లేదా స్తుతిగానం చేయడం అనే భావాన్ని ఇస్తుంది. ‘స్తుతిస్తూ పాడుతాను’ ఆ ఆరాధనా భావాన్ని సామాన్య పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: שִׁמְךָ
  choice: నీ నామాన్ని
  rationale: ‘నామం’ అనే పదం మూలంలోని שֵׁם పదాన్ని నిలుపుతూ, దేవుని వ్యక్తిత్వం మరియు కీర్తిని సూచించే బైబిలీయ భావాన్ని కూడా మోస్తుంది.
- source_word: עֶלְיוֹן
  choice: సర్వోన్నతుడా
  rationale: עֶלְיוֹן దేవునికి వాడిన ‘అత్యున్నతుడు/సర్వోన్నతుడు’ అనే బిరుదు. ఈ సందర్భంలో ప్రత్యక్ష సంబోధనగా ఉండటాన్ని తెలుగు సంబోధనాంతం ‘-ఆ’ స్పష్టం చేస్తుంది.
theological_decisions:
- issue: עֶלְיוֹן అనే దైవిక బిరుదు అనువాదం
  choice: సర్వోన్నతుడా
  alternative: అత్యున్నతుడా; సర్వోన్నతుడు
  rationale: హీబ్రూలో ఇది దేవునికి ఇచ్చిన బిరుదుగా, ప్రత్యక్ష సంబోధనలో ఉంది. ‘సర్వోన్నతుడా’ బిరుదును విస్తరించకుండా కాపాడి, తెలుగు వాక్యంలో సంబోధనను సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా కీర్తనకు తగిన గౌరవభరితమైన కవితా శైలిలో రూపొందించబడింది. సమాంతర ఆనందక్రియల మధ్య భావతీవ్రత భేదం నిలుపబడింది.
