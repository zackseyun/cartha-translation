source:
  edition: WLC
  text: טָבְע֣וּ ג֭וֹיִם בְּ/שַׁ֣חַת עָשׂ֑וּ בְּ/רֶֽשֶׁת ז֥וּ טָ֝מָ֗נוּ נִלְכְּדָ֥ה רַגְלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/015.yaml
  text: The nations have sunk into the pit they made; in the net they hid[a], their own foot has been caught.
translation:
  language: te
  text: 'జనములు తాము చేసిన గోతిలో మునిగిపోయారు;

    తాము దాచిన వలలో వారి కాలు చిక్కుకుంది.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ‘వారి కాలు’ ఏకవచనంలో ఉంది; ఇది జనములను సమష్టిగా సూచించే ఏకవచనం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: טָבְעוּ
  choice: మునిగిపోయారు
  rationale: కాల్ సంపూర్ణ క్రియ సూచించే ‘మునుగు/లోనికి దిగిపోవు’ అనే చిత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: גּוֹיִם
  choice: జనాలు
  rationale: ఈ కీర్తన సందర్భంలో శత్రుత్వంగా వ్యవహరించే ప్రజాసమూహాలను సూచిస్తుంది; ఆధునిక సాధారణ తెలుగులో సహజంగా ఉంటుంది.
- source_word: בְּשַׁחַת עָשׂוּ
  choice: తాము తవ్విన గోతిలో
  rationale: שׁחת ఉచ్చుగా ఉపయోగించే గోతిని సూచించగలదు. עשה అక్షరార్థంగా ‘చేశారు’; అయితే గోతిని ‘తవ్వడం’ తెలుగు వాడుకలో సహజమై, వారు సిద్ధం చేసిన దానిలో వారే పడిన వ్యంగ్యాన్ని స్పష్టం చేస్తుంది.
- source_word: בְּרֶשֶׁת
  choice: వలలో
  rationale: రשת అనే స్పష్టమైన వల చిత్రాన్ని, తరువాతి ‘చిక్కుకుంది’ అనే నిష్క్రియ భావంతో సహజంగా కలుపుతుంది.
- source_word: זוּ טָמָנוּ
  choice: తాము దాచిపెట్టిన
  rationale: זוּ సంబంధార్థక అవ్యయం; טמן రహస్యంగా దాచడం లేదా ఉచ్చు అమర్చడం అనే భావం ఇస్తుంది. ‘దాచిపెట్టిన’ వల యొక్క రహస్య స్వభావాన్ని కాపాడుతుంది.
- source_word: נִלְכְּדָה
  choice: చిక్కుకుంది
  rationale: నిఫాల్ సంపూర్ణ రూపంలోని పట్టుబడిన/చిక్కుకున్న భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: רַגְלָם
  choice: వారి కాలు
  rationale: హీబ్రూలో ఉన్న ఏకవచన సమూహార్థ చిత్రాన్ని బహువచనంగా మార్చకుండా నిలుపుతుంది.
