  yaml_path: translation/ot/psalms/009/017.yaml
  text: The wicked will return to Sheol—all the nations that forget God[a][b].
translation:
  language: te
  text: దుష్టులూ, దేవుణ్ణి మరచిపోయే సమస్త జనములూ షియోల్‌కు తిరిగి వెళ్తారు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘షియోల్‌కు వెనుదిరుగుతారు.’ హెబ్రీ క్రియకు ‘తిరిగి వెళ్లు’ లేదా ‘వెనుదిరుగు’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: షియోల్ అనేది మృతుల లోకాన్ని సూచించే హెబ్రీ పదం; తరువాతి కాలంలో మరింత నిర్దిష్టంగా రూపుదిద్దుకున్న ‘నరకం’ అనే భావంతో ఇది పూర్తిగా సమానం కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: తిరిగి వెళ్తారు
  rationale: שוב అనే క్రియకు ‘తిరిగివెళ్లు’ లేదా ‘వెనుదిరుగు’ అనే అర్థాలు ఉన్నాయి. షియోల్ వైపు కదలికను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూనే మూలంలోని భావాన్ని ఇది కాపాడుతుంది.
- source_word: רְשָׁעִים
  choice: దుష్టులు
  rationale: నైతికంగా చెడ్డవారిని సూచించే ఈ బహువచన నామవాచక ప్రయోగానికి ‘దుష్టులు’ సంక్షిప్తమైన, గౌరవప్రదమైన ప్రామాణిక తెలుగు పదం.
- source_word: לִשְׁאוֹלָה
  choice: షియోల్‌కు
  rationale: షియోల్ అనేది మృతుల లోకాన్ని సూచించే హెబ్రీ పదం. ‘సమాధి’ అనడం భావాన్ని మరీ సంకుచితం చేస్తుంది; ‘నరకం’ అనడం తరువాతి నిర్దిష్టమైన వేదాంత భావాన్ని మూలపదంలోకి చేర్చుతుంది.
- source_word: כָּל גּוֹיִם
  choice: జనాలన్నీ
  rationale: గּוֹיִם ఇక్కడ జాతులు లేదా జనసమూహాలను సూచిస్తుంది. ‘జనాలన్నీ’ సాధారణ పాఠకులకు సహజంగా ఉండి, כָּל తెలిపే సమగ్రతను నిలుపుతుంది.
- source_word: שְׁכֵחֵי אֱלֹהִים
  choice: దేవుణ్ణి మరచిపోయే
  rationale: ఈ నిర్మాణం ఆ జనాలకు లక్షణంగా ఉన్న క్రియను సూచిస్తుంది. ‘మరచిపోయే’ అనే సంబంధార్థక రూపం ఆ కొనసాగుతున్న లక్షణ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: తీర్పు సందర్భంలో שְׁאוֹל అర్థం
  choice: ‘నరకం’ అని వ్యాఖ్యానించకుండా ‘షియోల్’ అని లిప్యంతరీకరించడం
  alternative: సమాధి; మృతుల లోకం; నరకం
  rationale: ఈ వచనం దుష్టుల గతి గురించి చెబుతున్నప్పటికీ, హెబ్రీ పదం స్వయంగా తరువాత ఏర్పడిన శాశ్వత నరకం అనే మరింత నిర్దిష్ట భావాన్ని తప్పనిసరిగా సూచించదు. లిప్యంతరీకరణ మూలంలోని వేదాంత విస్తృతిని, ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని రెండో పాదం క్రియారహిత సమాంతర నిర్మాణంగా ఉండటంతో, తెలుగులో అర్థస్పష్టత కోసం ‘అక్కడికే వెళ్తాయి’ అని పూరించబడింది; డ్యాష్ రెండు పాదాల సమానార్థక సంబంధాన్ని నిలుపుతుంది. ‘షియోల్’ అనే అపరిచిత పదానికి పాదటిప్పణి ఇచ్చి, దానిని ‘నరకం’గా ముందుగానే వ్యాఖ్యానించకుండా ఉంచాం.
