id: PSA.9.9
reference: Psalms 9:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וִ֘/יהִ֤י יְהוָ֣ה מִשְׂגָּ֣ב לַ/דָּ֑ךְ מִ֝שְׂגָּ֗ב לְ/עִתּ֥וֹת בַּצָּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/009.yaml
  text: And Yahweh will be a stronghold for the oppressed[b][a], a stronghold in times of trouble.
translation:
  language: te
  text: 'అణగారినవారికి[b] యాహ్వే దుర్గంగా[a] ఉంటాడు;

    ఆపద కాలాల్లో దుర్గంగా ఉంటాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆశ్రయం,’ ‘ఎత్తైన సురక్షిత ఆశ్రయం.’ హీబ్రూ పదం రక్షణనిచ్చే, చేరుకోవడం కష్టమైన ఎత్తైన స్థలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నలిగినవారికి,’ ‘అణచివేయబడినవారికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי
  choice: ఉంటాడు
  rationale: ఇక్కడి అసంపూర్ణ క్రియారూపం సందర్భంలో ప్రకటనాత్మక భావాన్ని ఇస్తుంది. అందువల్ల ప్రార్థనాత్మకమైన ‘ఉండుగాక’ కంటే ‘ఉంటాడు’ అని అనువదించడం కీర్తనలోని నమ్మక ప్రకటనకు సరిపోతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సాధారణ లిప్యంతరీకరణగా ‘యాహ్వే’ అని ఇచ్చాం.
- source_word: מִשְׂגָּב
  choice: దుర్గం
  rationale: ఈ పదం చేరుకోలేని ఎత్తైన, సురక్షితమైన ఆశ్రయస్థలాన్ని సూచిస్తుంది. ‘దుర్గం’ రక్షణ, భద్రత అనే రెండు భావాలనూ సహజంగా తెలియజేస్తుంది; మూలంలోని పునరుక్తిని కూడా నిలిపాం.
- source_word: לַדָּךְ
  choice: అణగారినవారికి
  rationale: דך నలిగిపోయిన, అణచివేయబడిన లేదా దీనస్థితికి చేరిన వ్యక్తిని సూచిస్తుంది. ‘అణగారినవారు’ సామాజిక అణచివేతతో పాటు దయనీయ స్థితినీ ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לְעִתּוֹת
  choice: కాలాల్లో
  rationale: బహువచన నామంతో ఉన్న ל ఇక్కడ కాలసంబంధ భావాన్ని ఇస్తుంది; పునరావృతమయ్యే ఆపద సందర్భాలను ‘కాలాల్లో’ సహజంగా తెలియజేస్తుంది.
- source_word: בַּצָּרָה
  choice: ఆపద
  rationale: צָרָה ఇబ్బంది, బాధ, సంకటస్థితి అనే అర్థాలను కలిగి ఉంది. ‘ఆపద’ సంక్షిప్తంగా, గంభీరంగా ఉండి ఈ కవితా సందర్భానికి సరిపోతుంది.
theological_decisions:
- issue: וִיהִי క్రియారూపం ప్రకటననా లేక ఆకాంక్షనా
  choice: యాహ్వే ... ఉంటాడు
  alternative: యాహ్వే ... ఉండుగాక
  rationale: రూపపరంగా ఆకాంక్షార్థం సాధ్యమైనప్పటికీ, ఈ సందర్భంలో దేవుడు అణగారినవారికి రక్షణగా ఉంటాడనే నమ్మక ప్రకటనగా చదవడం సహజం. అయినా ప్రత్యామ్నాయాన్ని గమనికలో నమోదు చేయలేదు, ఎందుకంటే పాఠకునికి ప్రధానంగా అవసరమైన పదార్థ ప్రత్యామ్నాయాలకే గమనికలు పరిమితం చేశాం.
- issue: יְהוָה దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉన్నందున దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గంభీరమైన కవితా శైలిని వాడాం. మూలంలోని ‘దుర్గం’ పునరుక్తిని భావబలం కోసం యథాతథంగా నిలిపాం; వాక్యక్రమాన్ని తెలుగు సహజ ప్రవాహానికి అనుగుణంగా మార్చాం.
