review_pass:
  verdict: revise
  source_fidelity: The two plural imperatives and the sequence of thought are retained. However, לַיהוָה is most naturally represented by Telugu dative «యాహ్వేకు», not accusative «యాహ్వేను». Also, «స్తుతిస్తూ పాడండి» introduces a concomitant-action nuance (‘singing while praising’) rather than directly rendering the praise-song imperative.
  naturalness: «యాహ్వేకు స్తుతిగీతాలు పాడండి» is idiomatic modern Telugu and preserves the elevated psalmic register. «ప్రజల మధ్య ఆయన కార్యాలను ప్రకటించండి» is clear and natural.
  terminology: «యాహ్వే», «సీయోను», «ప్రజలు», and «కార్యాలు» appropriately render the divine name and key Hebrew terms. The alternative enthronement nuance of יֹשֵׁב is appropriately retained in a footnote without making it the main reading.
  issues:
  - severity: medium
    issue: Case marking for Yahweh
    rationale: The Hebrew לַיהוָה means ‘to/for Yahweh.’ With «స్తుతిగీతాలు పాడండి», Telugu normally uses «యాహ్వేకు» rather than «యాహ్వేను».
  - severity: low
    issue: Rendering of זַמְּרוּ
    rationale: «స్తుతిస్తూ పాడండి» can imply that praising is an action accompanying singing. «స్తుతిగీతాలు పాడండి» directly expresses the imperative to sing praise.
  - severity: low
    issue: Footnote anchor placement
    rationale: The note concerns «సీయోనులో నివసించే», so its marker should be placed directly after that phrase rather than at the end of the entire verse.
  revised_text: సీయోనులో నివసించే[a] యాహ్వేకు స్తుతిగీతాలు పాడండి; ప్రజల మధ్య ఆయన కార్యాలను ప్రకటించండి.
  revised_footnotes:
