revisions:
- from: సీయోనులో నివసించే యాహ్వేను స్తుతిస్తూ పాడండి; ప్రజల మధ్య ఆయన కార్యాలను ప్రకటించండి.[a]
  to: సీయోనులో నివసించే[a] యాహ్వేకు స్తుతిగీతాలు పాడండి; ప్రజల మధ్య ఆయన కార్యాలను ప్రకటించండి.
  rationale: The revision represents the Hebrew dative with natural Telugu «యాహ్వేకు», renders זַמְּרוּ directly as an imperative to sing praise, and moves the footnote marker to the phrase whose possible enthronement nuance it documents. No interpretive theological claim is added.
  reviewer_model: gpt-5.6-terra
