  revision_rationale: The revision represents the Hebrew dative with natural Telugu «యాహ్వేకు», renders זַמְּרוּ directly as an imperative to sing praise, and moves the footnote marker to the phrase whose possible enthronement nuance it documents. No interpretive theological claim is added.
