id: PSA.9.11
reference: Psalms 9:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: זַמְּר֗וּ לַ֭/יהוָה יֹשֵׁ֣ב צִיּ֑וֹן הַגִּ֥ידוּ בָ֝/עַמִּ֗ים עֲלִֽילוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/011.yaml
  text: Sing praises to Yahweh[a], who dwells in Zion; declare his deeds among the peoples.
translation:
  language: te
  text: సీయోనులో నివసించే[a] యాహ్వేకు స్తుతిగీతాలు పాడండి; ప్రజల మధ్య ఆయన కార్యాలను ప్రకటించండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సీయోనులో సింహాసనాసీనుడై ఉన్న.”
    reason: יֹשֵׁב అనే పదం ఈ సందర్భంలో ‘నివసించే’ అనే భావంతో పాటు ‘సింహాసనాసీనుడై ఉన్న’ అనే రాజరిక భావాన్ని కూడా సూచించవచ్చు.
lexical_decisions:
- source_word: זַמְּרוּ
  choice: స్తుతిస్తూ పాడండి
  rationale: స్తుతి సందర్భంలోని బహువచన ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, పాట మరియు ఆరాధన అనే రెండు భావాలను నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యాహ్వేను
  rationale: మూలంలోని దేవుని ప్రత్యేక నామమైన יהוהను దాచకుండా తెలుగులో ‘యాహ్వే’గా లిప్యంతరీకరించింది; ‘పాడండి’ క్రియతో సహజ తెలుగు కర్మరూపం వాడబడింది.
- source_word: יֹשֵׁב צִיּוֹן
  choice: సీయోనులో నివసించే
  rationale: יֹשֵׁב అనే కృదంతానికి నివసించడం, ఆసీనుడై ఉండడం అనే భావాలు సాధ్యమైనవి. ప్రధాన పాఠంలో దైవసన్నిధి భావాన్ని స్పష్టంగా ఉంచి, రాజాసన భావాన్ని పాదసూచికలో కాపాడింది.
- source_word: הַגִּידוּ
  choice: ప్రకటించండి
  rationale: హిఫిల్ బహువచన ఆజ్ఞలోని బహిరంగంగా తెలియజేయడం అనే భావాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: בָעַמִּים
  choice: ప్రజల మధ్య
  rationale: ב ఉపసర్గకు ‘మధ్య’ సరిపోతుంది; עַמִּים యొక్క బహువచన సామూహిక భావాన్ని ‘ప్రజలు’ నిలుపుతుంది.
- source_word: עֲלִילוֹתָיו
  choice: ఆయన కార్యాలను
  rationale: దేవుడు చేసిన క్రియలు లేదా కార్యాలు అనే మూలార్థాన్ని అదనపు ‘మహాకార్యాలు’ వంటి తీవ్రతను చేర్చకుండా తెలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: వచనంలో ఉన్న ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, మూలానికి సమీపంగా లిప్యంతరీకరించింది.
- issue: יֹשֵׁב צִיּוֹן లోని భావ ఛాయ
  choice: సీయోనులో నివసించే
  alternative: సీయోనులో సింహాసనాసీనుడై ఉన్న
  rationale: ఈ పదబంధం నివాసం/సన్నిధి భావాన్నీ రాజరిక ఆసన భావాన్నీ సూచించగలదు. ప్రధాన పాఠం మొదటి భావాన్ని స్వీకరిస్తూ, సాధ్యమైన రాజరిక భావాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గౌరవప్రదమైన కవితాత్మక శైలిని వాడింది. బహువచన ఆజ్ఞలను స్పష్టంగా ఉంచి, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలాన్ని ఎంచుకుంది.
