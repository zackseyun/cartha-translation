id: PSA.9.16
reference: Psalms 9:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: נ֤וֹדַ֨ע יְהוָה֮ מִשְׁפָּ֪ט עָ֫שָׂ֥ה בְּ/פֹ֣עַל כַּ֭פָּי/ו נוֹקֵ֣שׁ רָשָׁ֑ע הִגָּי֥וֹן סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/016.yaml
  text: Yahweh has made himself known[a]; he has executed judgment. The wicked is snared by the work of his own hands. Higgaion[b]. Selah
translation:
  language: te
  text: 'యెహోవా తనను తాను వెల్లడిచేసుకున్నాడు[a]; ఆయన తీర్పు తీర్చాడు.


    దుష్టుడు తన చేతుల పనివల్ల చిక్కుకున్నాడు.


    హిగ్గాయోను[b]. సెలా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా తెలిసియున్నాడు; ఆయన తీర్పు తీర్చాడు.” హెబ్రీ పదం נודעను “తెలిసియున్నాడు” అనే స్థిత్యర్థక కర్మణి భావంలో గానీ, “తనను తాను వెల్లడిచేసుకున్నాడు” అనే ఫలితార్థంలో గానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “హిగ్గాయోను” బహుశా సంగీత లేదా ఆరాధనా సంబంధమైన సూచన. దీనికి “ధ్యానం” లేదా “ప్రతిధ్వనించే సంగీతం” అనే అర్థాలు కూడా సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹדַע
  choice: తనను తాను తెలియజేసుకున్నాడు
  rationale: నిఫాల్ రూపం ఇక్కడ యెహోవా చేసిన తీర్పు ద్వారా ఆయన వెల్లడై, గుర్తించబడ్డాడనే ఫలితార్థాన్ని సూచించగలదు. తెలుగు వాక్యం ఆత్మవాచక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘తెలిసినవాడయ్యాడు’ అనే స్థిత్యర్థాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: מִשְׁפָּט עָשָׂה
  choice: తీర్పు తీర్చాడు
  rationale: ఈ పదబంధం న్యాయపరమైన తీర్పును అమలు చేయడాన్ని సూచిస్తుంది. ‘తీర్పు తీర్చాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి న్యాయార్థాన్ని కాపాడుతుంది.
- source_word: בְּפֹעַל כַּפָּיו
  choice: తన చేతుల పనిలోనే
  rationale: దుష్టుని స్వంత కార్యాలే అతడు చిక్కుకునే పరిస్థితి లేదా సాధనం అవుతున్నాయని స్వామ్యార్థంతో వ్యక్తం చేస్తుంది. ‘లోనే’ ప్రతిఫలాత్మక వ్యంగ్యాన్ని సహజంగా బలపరుస్తుంది.
- source_word: נוֹקֵשׁ
  choice: చిక్కుకున్నాడు
  rationale: ఉచ్చులో పడటం అనే రూపకాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: רָשָׁע
  choice: దుష్టుడు
  rationale: ఏకవచన నామవాచకంగా వాడిన విశేషణాన్ని ప్రతినిధి ఏకవచనంగానే నిలుపుతుంది.
- source_word: הִגָּיוֹן
  choice: హిగ్గాయోను
  rationale: ఖచ్చితమైన అర్థం తెలియని సంగీత లేదా ఆరాధనా సూచన కావచ్చు కాబట్టి ప్రధాన పాఠ్యంలో లిప్యంతరీకరించి, సాధ్యమైన అర్థాలను పాదటిప్పణిలో ఇచ్చాం.
- source_word: סֶלָה
  choice: సెలా
  rationale: దీని ఖచ్చితమైన అర్థం అనిశ్చితం; బహుశా సంగీత లేదా ఆరాధనా సూచన. అందువల్ల సంప్రదాయ లిప్యంతరీకరణను నిలిపాం.
theological_decisions:
- issue: తీర్పు ద్వారా దేవుని స్వీయప్రకటన
  choice: యెహోవా తీర్పు తీర్చడం ద్వారా తనను తాను తెలియజేసుకున్నాడని ప్రధాన పాఠ్యం చెబుతుంది.
  alternative: ‘యెహోవా తెలిసినవాడయ్యాడు; ఆయన తీర్పు తీర్చాడు’ అని స్థిత్యర్థక కర్మణి భావంలో అనువదించవచ్చు.
  rationale: נוֹדַע రూపం స్థిత్యర్థక కర్మణి భావానికీ, ఫలితాన్ని సూచించే ఆత్మవాచక భావానికీ అవకాశం ఇస్తుంది. సందర్భంలోని తీర్పుతో ఉన్న సంబంధాన్ని ప్రధాన పాఠ్యం స్పష్టంగా ఉంచుతూ, నిజమైన వ్యాకరణ సందిగ్ధతను పాదటిప్పణిలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కవితా శైలిని వాడాం. రెండు హెబ్రీ పాదాల సంక్షిప్తతను నిలిపి, అనిశ్చిత ఆరాధనా పదాలను లిప్యంతరీకరించాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
