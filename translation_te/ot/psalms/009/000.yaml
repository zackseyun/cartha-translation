  yaml_path: translation/ot/psalms/009/000.yaml
  text: 'For the choirmaster: according to “Death of the Son.”[a] A psalm of David.'
translation:
  language: te
  text: 'సంగీత నాయకునికి: “కుమారుని మరణం” అనే రాగం ప్రకారం.[a] దావీదు కీర్తన.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ పదబంధం עַלְמוּת לַבֵּן (లిప్యంతరీకరణలో ‘అల్మూత్ లబ్బేన్’) అర్థం అనిశ్చితం. ఇది బహుశా సంగీత సూచన లేదా రాగం పేరు; సంప్రదాయంగా దీనిని అనువదించకుండా పేరులాంటి పదబంధంగా కూడా ఉంచారు.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకునికి
  rationale: కీర్తనల శీర్షికల్లో ఈ రూపం సంగీత ప్రదర్శనకు బాధ్యత వహించే నాయకునికి ఇచ్చిన సూచనగా సాధారణంగా పనిచేస్తుంది. ఆధునిక తెలుగులో ఇది సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: עַלְמוּת לַבֵּן
  choice: “కుమారుని మరణం” అనే రాగం ప్రకారం
  rationale: ఈ క్లిష్టమైన పదబంధం బహుశా రాగం లేదా గీతం పేరును సూచిస్తుంది. మసొరా స్వరచిహ్నాల ప్రకారం సాధ్యమైన పదార్థాన్ని ఉద్ధరణలో ఇచ్చి, దాని సంగీత సంబంధమైన పాత్రను ‘అనే రాగం ప్రకారం’ అని స్పష్టం చేశాం; అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: శీర్షికల్లో గానరూపమైన కీర్తనను సూచించే సాధారణ పదానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: לְדָוִד
  choice: దావీదు కీర్తన
  rationale: హీబ్రూ לְ ఉపసర్గ రచయితను, అనుబంధాన్ని, అంకితాన్ని లేదా సంకలన సంబంధాన్ని సూచించవచ్చు. ‘దావీదు కీర్తన’ అనే సంక్షిప్త శీర్షికా రూపం ‘దావీదు రచించినది’ అని అతిగా నిర్ధారించకుండా మూలంలోని విస్తృత అనుబంధాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తన శీర్షికకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి వాడబడింది. క్లిష్టమైన సంగీత పదబంధం యొక్క సాధ్యమైన అర్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, దాని నిజమైన అనిశ్చితిని పాదసూచికలో వెల్లడించాం.
