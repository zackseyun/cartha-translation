lexical_decisions:
- source_word: וְהוּא
  choice: ఆయన
  rationale: సందర్భంలోని భావప్రవాహాన్ని కొనసాగిస్తూ కర్తను స్వల్పంగా నొక్కిచెబుతుంది; తెలుగులో అతిశయోక్తి లేకుండా సహజంగా ఉంది.
- source_word: יִשְׁפֹּט
  choice: తీర్పు తీరుస్తాడు
  rationale: న్యాయాధిపతిగా తీర్పు ఇవ్వడం అనే שׁפט యొక్క ప్రాథమిక భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; కవితాత్మక ప్రకటనలో భవిష్యదర్థాన్ని నిలుపుతుంది.
- source_word: תֵּבֵל
  choice: లోకం
  rationale: భౌతిక భూమి మాత్రమే కాక, నివాసిత లోకాన్ని సూచించే విస్తృత భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בְּצֶדֶק
  choice: నీతి ప్రకారం
  rationale: ఆయన తీర్పుకు నీతియే ప్రమాణమని తెలియజేస్తూ צדק యొక్క నైతిక, ధార్మిక బరువును నిలుపుతుంది.
- source_word: יָדִין
  choice: న్యాయం చేస్తాడు
  rationale: דין లోని న్యాయనిర్ణయ భావాన్ని నిలుపుతూ, మొదటి పాదంలోని పదబంధాన్ని యాంత్రికంగా పునరావృతం చేయకుండా తెలుగు సమాంతర కవిత్వానికి సహజంగా ఉంటుంది.
- source_word: לְאֻמִּים
  choice: జనాలకు
  rationale: ఆధునిక జాతీయ రాజ్యాలకు మాత్రమే పరిమితం చేయకుండా ప్రజాసమూహాలు అనే బహువచన భావాన్ని అందిస్తుంది.
- source_word: בְּמֵישָׁרִים
  choice: న్యాయబద్ధంగా
  rationale: నిష్పక్షపాతమైన సమన్యాయం, యథార్థత అనే מישרים భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: మానవాళి అంతటిపై దేవుని న్యాయపరమైన పాలన
  choice: ఈ వాక్యం దేవుడు లోకానికీ జనాలకూ నీతి, సమన్యాయాల ప్రకారం తీర్పు తీరుస్తాడని ప్రకటిస్తుంది; దాన్ని నిర్దిష్ట అంత్యకాల క్రమానికి పరిమితం చేయదు.
  alternative: ఇది ప్రస్తుతం నిరంతరం జరిగే పాలనగా లేదా ప్రత్యేకంగా తుది అంత్యకాల తీర్పుగా అర్థం చేసుకోవచ్చు.
  rationale: హీబ్రూ కవిత్వంలోని yiqtol రూపాలు భవిష్యత్ చర్యను గానీ లక్షణాత్మకంగా జరిగే చర్యను గానీ సూచించగలవు. తెలుగు భవిష్యదర్థాన్ని ఉంచుతూ, వాక్యం చెప్పనంత సిద్ధాంత వివరాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, గంభీరమైన కీర్తనాశైలిని కాపాడింది. రెండు సమాంతర పాదాల్లో ‘తీర్పు తీరుస్తాడు / న్యాయం చేస్తాడు’ అనే సహజ వైవిధ్యాన్ని ఉపయోగించింది.
