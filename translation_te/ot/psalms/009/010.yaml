id: PSA.9.10
reference: Psalms 9:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/יִבְטְח֣וּ בְ֭/ךָ יוֹדְעֵ֣י שְׁמֶ֑/ךָ כִּ֤י לֹֽא עָזַ֖בְתָּ דֹרְשֶׁ֣י/ךָ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/010.yaml
  text: And those who know your name will trust in you[a], for you, O Yahweh[c][b], have not forsaken those who seek you.
translation:
  language: te
  text: నీ నామాన్ని తెలిసినవారు నీపై నమ్మకం ఉంచుతారు[a]; ఎందుకంటే, యాహ్వే[c], నిన్ను వెదికేవారిని నీవు విడిచిపెట్టలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో “నీ నామాన్ని తెలిసినవారు.” ఇక్కడ “నామం” కేవలం పేరులోని శబ్దాన్ని కాకుండా, దేవుడు వెల్లడించిన స్వభావాన్ని, కీర్తిని కూడా సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా “త్యజించలేదు.”
    reason: lexical_alternative
  - marker: c
    text: 'హీబ్రూ: YHWH; దీనిని “యాహ్వే” అని లిప్యంతరీకరిస్తారు; సంప్రదాయంగా “ప్రభువు” అని అనువదిస్తారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִבְטְחוּ בְךָ
  choice: నీపై నమ్మకం ఉంచుతారు
  rationale: בטח క్రియకు בְּ ద్వారా నమ్మకానికి ఆధారమైన వ్యక్తి సూచించబడుతున్నాడు. అసంపూర్ణ క్రియారూపాన్ని ఈ కవితా సందర్భంలో భవిష్యత్ లేదా సాధారణ నిశ్చయార్థంగా సహజమైన తెలుగులో అందించింది; ప్రారంభ וְ ను వాక్యప్రవాహంలో సహజంగా అంతర్లీనంగా ఉంచింది.
- source_word: יֹדְעֵי שְׁמֶךָ
  choice: నీ నామాన్ని తెలిసినవారు
  rationale: కృదంత నిర్మాణం దేవుని నామాన్ని తెలిసికొనడం ద్వారా లక్షణీకరించబడిన వర్గాన్ని సూచిస్తుంది. 'నామం' అనే మూల రూపాన్ని ఉంచి దాని విస్తృత భావాన్ని పాదటీపులో వివరించింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న నమ్మకానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: לֹא עָזַבְתָּ
  choice: నీవు విడిచిపెట్టలేదు
  rationale: עזב అంటే విడిచిపెట్టు, త్యజించు. తెలుగు వర్తమాన సంబంధిత భూతార్థంలో 'విడిచిపెట్టలేదు' సహజంగా ఉండి మూలంలోని సంపూర్ణ క్రియ భావాన్ని నిలుపుతుంది.
- source_word: דֹרְשֶׁיךָ
  choice: నిన్ను వెదికేవారిని
  rationale: దేవుని విషయంగా דרש భక్తితో ఆయనను ఆశ్రయించడం, వెదకడం అనే భావాన్ని ఇస్తుంది. 'వెదికేవారు' ఈ భావాన్ని సాధారణ ఆధునిక తెలుగులో కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపుపొందిన 'యెహోవా' రూపంలో లిప్యంతరీకరించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని 'ప్రభువు' అనే బిరుదుతో మార్చకుండా తెలుగు పాఠకులకు పరిచితమైన లిప్యంతరీకరణను ఉపయోగించింది; ప్రత్యామ్నాయ సంప్రదాయ రూపాన్ని పాదటీపులో తెలిపింది.
- issue: '''నీ నామాన్ని తెలిసినవారు'' అనే భావం'
  choice: మూలంలోని 'నామం' పదాన్ని ప్రధాన పాఠంలో నిలుపుట
  alternative: నీ స్వభావాన్ని తెలిసినవారు
  rationale: ఇక్కడ 'నామం' దేవుని వెల్లడైన స్వభావం, కీర్తి, వ్యక్తిత్వాన్ని సూచించగలదు. అయితే దాన్ని ప్రధాన పాఠంలో ఒకే వివరణకు పరిమితం చేయకుండా మూల రూపాన్ని నిలిపి, భావవ్యాప్తిని పాదటీపులో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గౌరవభరితమైన సరళ శైలిని ఉపయోగించింది. 'నామం', 'వెదికేవారు' వంటి బైబిలు ప్రతిధ్వని కలిగిన పదాలను సాధారణ పాఠకులకు అర్థమయ్యే విధంగా నిలిపింది.
