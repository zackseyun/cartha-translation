  yaml_path: translation/ot/psalms/014/000.yaml
  text: 'For the choir director[a]. Of David.


    The fool says in his heart, “There is no God.”

    They are corrupt; they do abominable deeds[c][b].

    There is none who does good.'
translation:
  language: te
  text: 'సంగీత నాయకునికి.[a] దావీదుదీ.[b]


    మూర్ఖుడు తన హృదయంలో, “దేవుడు లేడు” అని అనుకుంటాడు.


    వారు చెడిపోయారు; అసహ్యమైన పనులు చేశారు.[c]


    మంచి చేసేవాడు ఒక్కడూ లేడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గాన నాయకునికి” లేదా “బృందగాన నాయకునికి.”
    reason: lexical_alternative
  - marker: b
    text: కీర్తన శీర్షికలో “దావీదుదీ” అనేది “దావీదు రచించినది” లేదా “దావీదు కోసం” అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ పాఠం ఏకవచనంలోని “మూర్ఖుడు” నుంచి బహువచనంలోని “వారు చెడిపోయారు” అనే రూపానికి మారుతుంది; ఒక ప్రతినిధి వ్యక్తి నుంచి అతడు సూచించే వర్గానికి దృష్టి మళ్లుతుంది.
    reason: discourse_structure
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకునికి
  rationale: కీర్తన ప్రదర్శనకు బాధ్యత వహించే నాయకుణ్ణి సూచించే శీర్షిక పదంగా సహజమైన ఆధునిక తెలుగు రూపం; ఖచ్చితమైన బాధ్యత స్పష్టంగా లేనందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: לְדָוִד
  choice: దావీదు కీర్తన
  rationale: కీర్తన శీర్షికలోని సంబంధాన్ని సహజంగా తెలియజేస్తుంది; ‘దావీదు రచించినది’ లేదా ‘దావీదు కోసం’ అనే సాధ్యమైన భావాలను పాదసూచికలో సంరక్షించాం.
- source_word: נָבָל
  choice: మూర్ఖుడు
  rationale: ఇది కేవలం తెలివి లోపాన్ని కాక దేవుణ్ణి తిరస్కరించే నైతిక-ఆధ్యాత్మిక అవివేకాన్ని సూచించినప్పటికీ, తెలుగు బైబిలు శైలిలో ‘మూర్ఖుడు’ విస్తృతంగా అర్థమయ్యే సముచిత పదం.
- source_word: בְּלִבּוֹ
  choice: తన హృదయంలో
  rationale: హీబ్రూ భావనలో అంతరంగ ఆలోచన, సంకల్పం రెండింటినీ సూచించే రూపకాన్ని యథాతథంగా నిలిపింది.
- source_word: הִשְׁחִיתוּ
  choice: వారు చెడిపోయారు
  rationale: నైతిక భ్రష్టతను తెలిపే క్రియ యొక్క స్థితి భావాన్ని నేరుగా వ్యక్తపరుస్తుంది.
- source_word: הִתְעִיבוּ עֲלִילָה
  choice: అసహ్యమైన పనులు చేశారు
  rationale: ‘చర్యలో అసహ్యంగా ప్రవర్తించారు’ అనే హీబ్రూ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: మంచి చేసేవాడు ఒక్కడూ లేడు
  rationale: ఎవరూ మినహాయింపు కాదనే హీబ్రూ నిరాకరణ బలాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘దేవుడు లేడు’ అనే ప్రకటన స్వరూపం
  choice: మూర్ఖుని అంతరంగ ప్రకటనగా ఉద్ధరణలో ఉంచడం
  alternative: కేవలం ఆచరణాత్మక దేవనిరాకరణగా వివరణాత్మకంగా అనువదించడం
  rationale: మూలపాఠం అస్తిత్వ నిరాకరణకూ, దేవుణ్ణి లెక్కచేయని జీవన వైఖరికీ అవకాశం ఇస్తుంది; అనువాదం ఆ ఉద్రిక్తతను వివరణతో పరిమితం చేయదు.
- issue: ఏకవచనం నుంచి బహువచనానికి మార్పు
  choice: ‘మూర్ఖుడు’ తరువాత ‘వారు’ అని మూలంలోని మార్పును నిలిపివేయడం
  alternative: మొత్తాన్ని ఏకవచనంలో లేదా బహువచనంలో సమన్వయపరచడం
  rationale: ప్రతినిధి వ్యక్తి నుంచి అతడు సూచించే వర్గానికి పాఠం మారుతున్న నిర్మాణాన్ని సంరక్షిస్తుంది.
- issue: ‘మంచి చేసేవాడు ఒక్కడూ లేడు’ అనే తీర్పు పరిధి
  choice: ఎటువంటి వివరణాత్మక పరిమితి చేర్చకుండా మూలపాఠం ప్రకారమే ఇవ్వడం
  alternative: ఇది మూర్ఖుల వర్గానికే పరిమితమని అనువాదంలో స్పష్టీకరించడం
  rationale: హీబ్రూ వాక్యం పరిధిని వివరించదు; దాని విశాలమైన ధార్మిక ఉద్రిక్తతను అనువాదం అలాగే ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘హృదయంలో’ అనే సాంప్రదాయ బైబిలు రూపకాన్ని నిలిపి, మిగతా వాక్యాలను సహజమైన ప్రస్తుతకాల తెలుగులో నిర్మించాం. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
