source:
  edition: WLC
  text: עֲצַת עָנִ֥י תָבִ֑ישׁוּ כִּ֖י יְהוָ֣ה מַחְסֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/006.yaml
  text: You shame the counsel of the poor[a], because Yahweh is his refuge.
translation:
  language: te
  text: మీరు పేదవాని ఆలోచనను అవమానపరుస్తారు[a]; ఎందుకంటే యాహ్వే అతని ఆశ్రయం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీరు పేదవాని యోచనను అవమానపరుస్తారు.’ עֲצַת עָנִי అనే మాటకు ‘పేదవాని ఆలోచన/యోచన/సలహా’ అనే అర్థాలు సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת
  choice: ఆలోచనను
  rationale: עֵצָה నిర్మాణ రూపం ‘ఆలోచన, యోచన, సలహా’ అనే విస్తృత అర్థాలను కలిగి ఉంది. సందర్భాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘ఆలోచన’ ఆ విస్తృతిని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: עָנִי
  choice: పేదవాని
  rationale: עָנִי పేదరికంతో పాటు బాధితుడు లేదా అణచివేయబడినవాడు అనే ఛాయనూ కలిగి ఉండవచ్చు. ఇక్కడ ‘పేదవాడు’ ప్రధాన సామాజిక భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: תָבִישׁוּ
  choice: మీరు … అవమానపరుస్తారు
  rationale: בוש హిఫీల్ ద్వితీయ పురుష బహువచన రూపం ‘సిగ్గుపడేలా చేయడం, అవమానపరచడం’ అని సూచిస్తుంది. ‘మీరు … అవమానపరుస్తారు’ కర్త యొక్క బహువచనాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇక్కడ כִּי కారణాన్ని పరిచయం చేస్తుంది; ‘ఎందుకంటే’ ఆ కారణ సంబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: מַחְסֵהוּ
  choice: అతనికి ఆశ్రయం
  rationale: מַחְסֶה రక్షణనిచ్చే ఆశ్రయం లేదా శరణును సూచిస్తుంది; తృతీయ పురుష ఏకవచన ప్రత్యయాన్ని సహజ తెలుగులో ‘అతనికి’గా వ్యక్తం చేశాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’ను ఎంచుకున్నాం; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
- issue: పేదవాని ఆలోచన అవమానింపబడటం మరియు యెహోవా ఆశ్రయంగా ఉండటం మధ్య సంబంధం
  choice: కారణ సంబంధాన్ని ‘ఎందుకంటే’తో నిలిపాం
  alternative: వివరణాత్మకంగా ‘ఏలయనగా/నిజానికి’ అని అనువదించడం
  rationale: כִּי యొక్క సహజ కారణార్థాన్ని నిలుపుతూ, దుష్టులు ఎందుకు ఇలా చేస్తున్నారో లేదా వారి చర్య ఎందుకు వ్యర్థమో పాఠ్యంలోనే తీర్మానించకుండా ఉన్న వేదాంత ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన శైలిని వాడాం. రెండవ పురుష బహువచనాన్ని ‘మీరు’తో స్పష్టంగా చూపించాం; హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా తెలుగు సహజ వాక్యనిర్మాణాన్ని పాటించాం.
