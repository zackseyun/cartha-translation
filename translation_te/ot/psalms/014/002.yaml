id: PSA.14.2
reference: Psalms 14:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יְֽהוָ֗ה מִ/שָּׁמַיִם֮ הִשְׁקִ֪יף עַֽל בְּנֵי אָ֫דָ֥ם לִ֭/רְאוֹת הֲ/יֵ֣שׁ מַשְׂכִּ֑יל דֹּ֝רֵשׁ אֶת אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/002.yaml
  text: Yahweh looks down from heaven on the children of man to see whether there is one who has insight[a], one who seeks God.
translation:
  language: te
  text: యాహ్వే ఆకాశం నుండి మానవులను కిందికి చూశాడు—వివేకం గలవాడు, దేవుణ్ణి వెదికేవాడు ఎవరైనా ఉన్నాడేమో చూడడానికి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని ఉచ్చారణకు సమీపమైన రూపంగా ఇచ్చాం.
- source_word: מִשָּׁמַיִם
  choice: పరలోకం నుండి
  rationale: హీబ్రూ రూపం బహువచనమైనా, ఇక్కడ దేవుడు చూసే ఉన్నత స్థలాన్ని సూచించే సహజ తెలుగు ఏకవచన ప్రయోగం సరిపోతుంది.
- source_word: הִשְׁקִיף
  choice: కిందికి చూశాడు
  rationale: ఎత్తైన స్థలం నుండి కిందికి చూడడం అనే దృశ్యాన్ని నిలిపి, హీబ్రూ సంపూర్ణ క్రియారూపాన్ని భూతకాలంలో ప్రతిబింబించాం.
- source_word: בְּנֵי אָדָם
  choice: మనుష్యుల
  rationale: అక్షరార్థంగా ‘ఆదాము కుమారులు/మనుష్యుని కుమారులు’ అయిన ఈ హీబ్రూ నానుడి మానవులందరినీ సూచిస్తుంది; తెలుగులో అపార్థం రాకుండా సహజమైన సమష్టి పదాన్ని వాడి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: מַשְׂכִּיל
  choice: వివేకంగలవాడు
  rationale: שׂכל మూలంలోని అవగాహన, అంతర్దృష్టి భావాన్ని కేవలం జ్ఞానం కలవాడిగా పరిమితం చేయకుండా తెలిపే సహజ పదబంధం.
- source_word: דֹּרֵשׁ אֶת אֱלֹהִים
  choice: దేవుణ్ణి వెదికేవాడు
  rationale: క్రియావిశేషణాత్మక రూపంలోని నిరంతర లక్షణాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది; ‘విచారించేవాడు’ అనే పరిమిత భావాన్ని రుద్దదు.
theological_decisions:
- issue: בְּנֵי אָדָם లోని ప్రతినిధి పుంలింగ రూపం
  choice: ప్రధాన పాఠంలో ‘మనుష్యుల’, పాదసూచికలో అక్షరార్థం
  alternative: ‘మనుష్యుని కుమారులు’ లేదా ‘ఆదాము కుమారులు’
  rationale: ఈ హీబ్రూ నానుడి స్త్రీపురుషులందరితో కూడిన మానవజాతిని సూచిస్తుంది. అక్షరానువాదం తెలుగులో పురుషులను మాత్రమే సూచిస్తున్నట్టు లేదా ఆదాము వంశావళిని ప్రత్యేకంగా సూచిస్తున్నట్టు అపార్థం కలిగించవచ్చు; పాదసూచిక మూలరూపాన్ని పారదర్శకంగా ఉంచుతుంది.
- issue: מַשְׂכִּיל మరియు דֹּרֵשׁ మధ్య సంబంధం
  choice: కామాతో సమాంతర వర్ణనగా ఉంచడం
  alternative: ‘అంటే దేవుణ్ణి వెదికేవాడు’ అని ఒకే వ్యక్తికి స్పష్టంగా అన్వయించడం, లేదా ‘వివేకంగలవాడైనా, దేవుణ్ణి వెదికేవాడైనా’ అని రెండు వర్గాలుగా విడదీయడం
  rationale: హీబ్రూలో సంధాయకం లేకుండా రెండు పదబంధాలు వరుసగా ఉన్నాయి. తెలుగు కామా వాటిని దగ్గరగా ఉంచుతూ, అవి ఒకే వ్యక్తికి సంబంధించిన సమాంతర లక్షణాలా లేక శోధన పరిధిని విస్తరించే పదాలా అన్న స్వల్ప నిర్మాణాత్మక తెరువును అనవసరంగా మూసివేయదు.
- issue: הִשְׁקִיף యొక్క కాలరూపం
  choice: ‘కిందికి చూశాడు’
  alternative: ‘కిందికి చూస్తాడు’
  rationale: హీబ్రూ క్రియ సంపూర్ణ రూపంలో ఉంది. కవితాత్మక వర్తమానం సాధ్యమైనప్పటికీ, మూలరూపాన్ని నేరుగా ప్రతిబింబిస్తూ భూతకాలాన్ని ఎంచుకున్నాం; ఇది దేవుని పరిశీలనను ఒక్కసారి మాత్రమే జరిగినదిగా సిద్ధాంతీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉండే వాక్యనిర్మాణం వాడాం. ‘యాహ్వే’ అనే వ్యక్తినామాన్ని నిలిపి, ‘వివేకంగలవాడు’ మరియు ‘వెదికేవాడు’ అనే సాధారణంగా అర్థమయ్యే పదాలను ఎంచుకున్నాం.
