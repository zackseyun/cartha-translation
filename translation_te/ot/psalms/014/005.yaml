id: PSA.14.5
reference: Psalms 14:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שָׁ֤ם פָּ֣חֲדוּ פָ֑חַד כִּֽי אֱ֝לֹהִ֗ים בְּ/ד֣וֹר צַדִּֽיק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/005.yaml
  text: There they were in great dread[b][a], for God is with the generation of the righteous.
translation:
  language: te
  text: అక్కడ వారు మహా భయానికి లోనయ్యారు[a]; ఎందుకంటే దేవుడు నీతిమంతుల తరములో ఉన్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “వారు భయాన్ని భయపడ్డారు”; ఇది తీవ్రమైన భయాన్ని తెలిపే ఉద్ఘాటన.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దేవుడు నీతిమంతుల తరంతో ఉన్నాడు”; లేదా, “దేవుడు నీతిమంతుల తరం మధ్య ఉన్నాడు.”
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: అక్కడ
  rationale: స్థలాన్ని లేదా ఆ సందర్భంలో అకస్మాత్తుగా కలిగిన భయాన్ని సూచించే సంక్షిప్త కవితాత్మక అవ్యయం; హీబ్రూ వాక్యంలోని క్లుప్తతను నిలుపుతుంది.
- source_word: פָּחֲדוּ פָחַד
  choice: మహా భయానికి లోనయ్యారు
  rationale: క్రియతో పాటు అదే మూలానికి చెందిన నామవాచకం వచ్చిన హీబ్రూ ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో బలంగా వ్యక్తపరుస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: వారి భయానికి కారణాన్ని పరిచయం చేసే కారణార్థక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ సందర్భంలో ఇశ్రాయేలు దేవుణ్ణి సూచించే సాధారణ హీబ్రూ పదానికి సహజమైన తెలుగు సమానం.
- source_word: בְּדוֹר
  choice: తరములో ఉన్నాడు
  rationale: בְ ఉపసర్గకు ఇక్కడ ‘లో/మధ్య/తో’ అనే సమీప భావాలు సాధ్యం. ‘తరములో ఉన్నాడు’ మూల రూపాన్ని దగ్గరగా అనుసరిస్తూ దేవుని సాన్నిధ్యాన్ని తెలియజేస్తుంది; ‘తో ఉన్నాడు’ అనే భావాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: צַדִּיק
  choice: నీతిమంతుల
  rationale: రూపపరంగా ఏకవచన విశేషణమైనప్పటికీ ‘తరం’తో కలిసి సమూహార్థంగా పనిచేస్తుంది; తెలుగులో ‘నీతిమంతుల తరం’ సహజంగా ఆ సమూహాన్ని సూచిస్తుంది.
theological_decisions:
- issue: בְּדוֹר צַדִּיק లో దేవునికి నీతిమంతుల తరానికి మధ్య సంబంధం
  choice: దేవుడు నీతిమంతుల తరములో ఉన్నాడు
  alternative: దేవుడు నీతిమంతుల తరంతో ఉన్నాడు / నీతిమంతుల తరం మధ్య ఉన్నాడు
  rationale: హీబ్రూ בְ దేవుడు ఆ తరంలో లేదా వారి మధ్య ఉన్నాడనే భావాన్నీ, వారితో ఉన్నాడనే సాన్నిధ్య భావాన్నీ అనుమతిస్తుంది. ప్రధాన పాఠం రూపానికి దగ్గరగా ఉంటుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణి ద్వారా చూపి నిజమైన సందిగ్ధతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కీర్తన శైలి. హీబ్రూ ఉద్ఘాటనను యథాతథంగా కఠినంగా అనుకరించకుండా దాని తీవ్రతను నిలిపింది; בְדוֹר లోని ‘లో/మధ్య/తో’ అనే భావసాధ్యతలను ప్రధాన పాఠం మరియు పాదటిప్పణి ద్వారా సంరక్షించింది.
