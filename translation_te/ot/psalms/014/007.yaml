id: PSA.14.7
reference: Psalms 14:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִ֥י יִתֵּ֣ן מִ/צִּיּוֹן֮ יְשׁוּעַ֪ת יִשְׂרָ֫אֵ֥ל בְּ/שׁ֣וּב יְ֭הוָה שְׁב֣וּת עַמּ֑/וֹ יָגֵ֥ל יַ֝עֲקֹ֗ב יִשְׂמַ֥ח יִשְׂרָֽאֵל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/007.yaml
  text: Oh[a], that Israel’s salvation would come from Zion! When Yahweh restores the fortunes of his people, Jacob will rejoice; Israel will be glad.
translation:
  language: te
  text: సీయోను నుండి ఇశ్రాయేలుకు రక్షణ వస్తే ఎంత బాగుంటుంది! యాహ్వే తన ప్రజల స్థితిని పునరుద్ధరించినప్పుడు[a], యాకోబు ఉల్లసిస్తాడు; ఇశ్రాయేలు సంతోషిస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “యాహ్వే తన ప్రజలను చెరనుండి తిరిగి తీసుకొచ్చినప్పుడు.” ఈ హీబ్రూ నుడికారం తరచుగా ప్రజల స్థితిని పునరుద్ధరించడం లేదా వారి దుస్థితిని తారుమారు చేయడం అనే అర్థాన్నిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: వస్తే ఎంత బాగుంటుంది!
  rationale: ఈ హీబ్రూ పదబంధం అక్షరార్థ ప్రశ్న కంటే బలమైన కోరికను వ్యక్తం చేస్తుంది; ఆధునిక తెలుగులో ఈ ప్రయోగం ఆ ఆకాంక్షను సహజంగా తెలియజేస్తుంది.
- source_word: מִצִּיּוֹן
  choice: సీయోనులోనుండి
  rationale: מן మూలాన్ని లేదా ఆరంభస్థానాన్ని సూచిస్తుంది; స్థలనామాన్ని ప్రామాణిక తెలుగు రూపంలో ఉంచాం.
- source_word: יְשׁוּעַת יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు రక్షణ
  rationale: יְשׁוּעָה సూచించే విస్తృతమైన రక్షణ, విమోచన భావాన్ని ‘రక్షణ’ నిలుపుతుంది; తెలుగు వాక్యంలో లబ్ధిదారుని సూచించే రూపం సహజంగా ఉంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ వ్యక్తిగత నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణను వాడాం.
- source_word: בְּשׁוּב יְהוָה שְׁבוּת עַמּוֹ
  choice: యాహ్వే తన ప్రజల స్థితిని పునరుద్ధరించినప్పుడు
  rationale: שׁוּב שְׁבוּת అనే నుడికారం కేవలం చెరనుండి తిరిగి తీసుకురావడమే కాక, దుస్థితిని మార్చి మునుపటి మేలైన స్థితికి చేర్చడాన్ని కూడా సూచించగలదు.
- source_word: יָגֵל
  choice: ఉల్లసిస్తాడు
  rationale: גיל లోని ఉప్పొంగే ఆనంద భావాన్ని ‘ఉల్లసిస్తాడు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יַעֲקֹב
  choice: యాకోబు
  rationale: పేరును ప్రామాణిక తెలుగు రూపంలో ఉంచాం; ఇక్కడ అది దేవుని ప్రజలకు కావ్యాత్మక సమష్టి పేరు.
- source_word: יִשְׂמַח
  choice: సంతోషిస్తుంది
  rationale: ముందున్న גיל నుంచి పదభేదాన్ని నిలుపుతూ సమాంతర ఆనంద భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: ప్రామాణిక తెలుగు పేరును నిలిపాం; ఇక్కడ ‘యాకోబు’కు సమాంతరంగా దేవుని ప్రజలను సమష్టిగా సూచిస్తుంది.
theological_decisions:
- issue: שׁוּב שְׁבוּת నుడికారాన్ని ఎలా అనువదించాలి
  choice: తన ప్రజల స్థితిని పునరుద్ధరించినప్పుడు
  alternative: తన ప్రజలను చెరనుండి తిరిగి తీసుకొచ్చినప్పుడు
  rationale: ఈ కీర్తన స్పష్టంగా ఒక చారిత్రక చెరను ప్రస్తావించదు. అందువల్ల ప్రజల దుస్థితిని తారుమారు చేసి వారి స్థితిని బాగుచేయడం అనే విస్తృత భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, మరింత అక్షరార్థమైన చెర సంబంధ భావాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కావ్యశైలిని వాడాం. మొదటి పాదంలోని బలమైన ఆకాంక్షను ఆశ్చర్యార్థక వాక్యంతో తెలిపాం. చివరి రెండు భాగాల్లోని సమాంతర నిర్మాణాన్ని, అలాగే גיל మరియు שמח మధ్యనున్న పదభేదాన్ని ‘ఉల్లసిస్తాడు / సంతోషిస్తుంది’ ద్వారా నిలిపాం.
