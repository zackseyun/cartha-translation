  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ/לֹ֥א יָדְעוּ֮ כָּל פֹּ֪עֲלֵ֫י אָ֥וֶן אֹכְלֵ֣י עַ֭מִּ/י אָ֣כְלוּ לֶ֑חֶם יְ֝הוָ֗ה לֹ֣א קָרָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/004.yaml
  text: Do not all the workers of wickedness know—those who eat up my people as they eat bread[a], and do not call on Yahweh?
translation:
  language: te
  text: దుష్టకార్యాలు చేసేవారందరికీ తెలియదా? వారు నా ప్రజలను రొట్టె తిన్నట్టుగా[a] తినివేస్తారు; యాహ్వేను పిలవరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నా ప్రజలను తినేవారు; వారు రొట్టె తింటారు.” దేవుని ప్రజలను వారు సాధారణంగా రొట్టె తిన్నంత సులభంగా కబళిస్తున్నారనే పోలిక ఇది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא יָדְעוּ
  choice: తెలియదా?
  rationale: הֲלֹא ఆశించే సమాధానం ‘అవును’ అనే భావమున్న అలంకారప్రశ్నను సూచిస్తుంది. יָדְעוּ యొక్క ప్రాథమిక ‘తెలుసుకొను/తెలియు’ భావాన్ని సహజమైన తెలుగు ప్రశ్నారూపంలో నిలిపింది.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: దుష్టకార్యాలు చేసేవారందరికీ
  rationale: పాల్గొనే క్రియారూపాన్ని సహజమైన తెలుగు సంబంధార్థక నిర్మాణంతో వ్యక్తం చేస్తూ, אָוֶן లోని నైతిక దుష్టత్వ భావాన్ని నిలిపింది.
- source_word: אֹכְלֵי עַמִּי
  choice: నా ప్రజలను తినివేస్తూ
  rationale: మూలంలోని ‘తినడం’ అనే బలమైన రూపకాన్ని నిలిపి, విధ్వంసకరమైన దోపిడీ భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: אָכְלוּ לֶחֶם
  choice: రొట్టె తిన్నట్టుగా
  rationale: హీబ్రూలో పక్కపక్కన ఉంచిన రెండు తినడం సంబంధిత వాక్యభాగాల మధ్య ఉన్న పోలికను తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో మార్చకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: לֹא קָרָאוּ
  choice: యెహోవాను పిలవని
  rationale: קרא యొక్క దేవుణ్ణి ప్రార్థనలో లేదా ఆరాధనలో పిలుచుట అనే భావాన్ని విస్తరించి వ్యాఖ్యానించకుండా నేరుగా నిలిపింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం సాధారణ బిరుదును కాక దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది; అందువల్ల ఆ ప్రత్యేక నామసూచనను నిలిపింది.
- issue: కרא అనే క్రియలోని ఆరాధన/ప్రార్థన భావం
  choice: యెహోవాను పిలవని
  alternative: యెహోవాకు ప్రార్థించని
  rationale: ‘ప్రార్థించు’ అనేది సందర్భార్థాన్ని స్పష్టం చేసినా, మూలంలోని విస్తృతమైన ‘పిలుచు/ఆశ్రయించు’ భావాన్ని కుదించవచ్చు. అందువల్ల ఉద్దేశపూర్వకంగా విస్తృతమైన పదాన్ని ఎంచుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వినిపించే అలంకారప్రశ్నగా రూపొందించబడింది. ‘తినివేస్తూ’ అనే పదం మూల రూపకంలోని తీవ్రతను నిలిపింది; ‘యెహోవాను పిలవని’ అనేది ప్రార్థన, ఆరాధన, ఆశ్రయం అనే సందర్భసాధ్య భావాలను ఒక్కదానికే పరిమితం చేయదు.
