- from: రొట్టె తిన్నట్టుగా[a] నా ప్రజలను తినివేస్తూ, యెహోవాను పిలవని దుష్టకార్యాలు చేసేవారందరికీ తెలియదా?
  to: దుష్టకార్యాలు చేసేవారందరికీ తెలియదా? వారు నా ప్రజలను రొట్టె తిన్నట్టుగా[a] తినివేస్తారు; యాహ్వేను పిలవరు.
