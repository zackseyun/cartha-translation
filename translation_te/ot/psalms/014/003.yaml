id: PSA.14.3
reference: Psalms 14:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הַ/כֹּ֥ל סָר֮ יַחְדָּ֪ו נֶ֫אֱלָ֥חוּ אֵ֤ין עֹֽשֵׂה ט֑וֹב אֵ֝֗ין גַּם אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/003.yaml
  text: All have turned aside; together they have become corrupt. There is none who does good[a], not even one.
translation:
  language: te
  text: 'అందరూ దారితప్పారు;

    అందరూ కలిసి చెడిపోయారు[a].


    మంచి చేసేవారెవరూ లేరు—

    ఒక్కరు కూడా లేరు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కలుషితమయ్యారు,’ లేదా ‘అపవిత్రులయ్యారు.’ హీబ్రూ క్రియ పాడైపోవడం లేదా భ్రష్టమవడం అనే భావాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: అందరూ
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ఈ పదం సమగ్రంగా ‘అందరూ’ అనే అర్థాన్ని ఇస్తుంది; సందర్భంలో ఇది మనుషులందరినీ సూచిస్తుంది.
- source_word: סָר
  choice: దారితప్పారు
  rationale: సוּר అంటే పక్కకు తొలగడం లేదా సరైన దారి నుంచి మరలడం. సమూహవాచక కర్తకు అనుగుణంగా తెలుగులో బహువచనం సహజం.
- source_word: יַחְדָּו
  choice: అందరూ కలిసి
  rationale: ఈ క్రియావిశేషణం సమష్టి భావాన్ని వ్యక్తం చేస్తుంది. రెండో పాదంలో ‘అందరూ కలిసి’ అని అనడం ఆ ఉమ్మడి స్థితిని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: נֶאֱלָחוּ
  choice: చెడిపోయారు
  rationale: నిఫల్ రూపం పాడైపోవడం, కలుషితమవడం లేదా భ్రష్టమవడం అనే ఫలితస్థితిని సూచిస్తుంది. ‘చెడిపోయారు’ సాధారణ ఆధునిక తెలుగులో విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: אֵין
  choice: ఎవడూ లేడు
  rationale: లేమిని తెలిపే ఈ అవ్యయం వ్యక్తిని సూచించే కృదంతంతో కలిసి సంపూర్ణ నిరాకరణను వ్యక్తం చేస్తుంది.
- source_word: עֹשֵׂה טוֹב
  choice: మంచి చేసేవాడు
  rationale: కృదంతం మరియు ‘మంచి’ అనే పదం కలిసి స్వభావంగా లేదా నిరంతరంగా మంచి చేసే వ్యక్తిని సూచిస్తాయి.
- source_word: גַּם אֶחָד
  choice: ఒక్కడు కూడా లేడు
  rationale: గַּם మరియు אֶחָד కలయిక నిరాకరణను బలపరుస్తుంది; ‘ఒక్కడు కూడా లేడు’ ఆ ఉద్ఘాటనను సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: మానవ అవినీతిని గూర్చిన సార్వత్రిక ప్రకటన పరిధి
  choice: ‘అందరూ,’ ‘ఎవడూ లేడు,’ ‘ఒక్కడు కూడా లేడు’ అనే సమగ్ర భాషను యథాతథంగా నిలుపడం.
  alternative: దీనిని చాలామంది గురించిన సాధారణ వ్యాఖ్యగా మృదువుగా అనువదించడం.
  rationale: హీబ్రూ వాక్యం సంపూర్ణతను, మినహాయింపు లేని నిరాకరణను ఉద్దేశపూర్వకంగా బలపరుస్తుంది. తరువాతి సిద్ధాంత వ్యవస్థలను చేర్చకుండా ఆ వాక్యపు ధార్మిక ఉద్వేగాన్ని అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన కీర్తన శైలిని పాటించాం. సమాంతర పాద నిర్మాణాన్ని నిలిపి, సంపూర్ణ నిరాకరణను బలంగా వ్యక్తం చేశాం.
