source:
  edition: WLC
  text: לַ/מְנַצֵּ֗חַ לְ/דָ֫וִ֥ד אָ֘מַ֤ר נָבָ֣ל בְּ֭/לִבּ/וֹ אֵ֣ין אֱלֹהִ֑ים הִֽשְׁחִ֗יתוּ הִֽתְעִ֥יבוּ עֲלִילָ֗ה אֵ֣ין עֹֽשֵׂה טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/001.yaml
  text: For the choir director[a]. Of David. The fool says in his heart, “There is no God.” They are corrupt; they do abominable deeds[c][b]. There is no one who does good.
translation:
  language: te
  text: 'సంగీత నిర్వాహకునికి.[a] దావీదుకు చెందినది.[b]


    మూర్ఖుడు తన హృదయంలో, “దేవుడు లేడు” అని అనుకుంటాడు. వారు చెడిపోయారు; అసహ్యకరమైన పనులు చేశారు.[c] మంచి చేసేవాడు ఒక్కడూ లేడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సంగీత నాయకునికి” లేదా “గాయకబృంద నాయకునికి.”
    reason: lexical_alternative
  - marker: b
    text: “దావీదుకు చెందినది” అనే మాటకు “దావీదు రచించినది” లేదా “దావీదు కోసం” అనే అర్థాలు కూడా సాధ్యమే.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో “మూర్ఖుడు” అనే ఏకవచనం నుంచి “వారు చెడిపోయారు” అనే బహువచనానికి మార్పు ఉంది; ఒక ప్రతినిధి వ్యక్తి నుంచి అతడు సూచించే వర్గానికి భావం విస్తరిస్తుంది.
    reason: source_structure
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకునికి
  rationale: కీర్తన శీర్షికలో సంగీత నిర్వహణ బాధ్యతగల నాయకునికి సూచనగా ఉన్న పదం. ఆధునిక తెలుగులో సహజంగా ఉండేలా, గాయకబృందానికి మాత్రమే అర్థాన్ని పరిమితం చేయకుండా అనువదించబడింది.
- source_word: לְדָוִד
  choice: దావీదుకు చెందిన కీర్తన
  rationale: לְ ఉపసర్గ రచయితను, సంబంధాన్ని, లేదా అంకితాన్ని సూచించవచ్చు. ‘చెందిన’ అనే పదం దావీదుతో సంబంధాన్ని ఉంచుతూ రచయితగా మాత్రమే ఖరారు చేయదు.
- source_word: נָבָל
  choice: మూర్ఖుడు
  rationale: ఇది కేవలం తెలివి తక్కువతనాన్ని కాక నైతిక, ఆధ్యాత్మిక అవివేకాన్ని సూచిస్తుంది; తెలుగు బైబిలు శైలిలో ‘మూర్ఖుడు’ ఈ భావాన్ని సహజంగా మోస్తుంది.
- source_word: בְּלִבּוֹ
  choice: తన హృదయంలో
  rationale: హీబ్రూ భావంలో హృదయం ఆలోచన, సంకల్పం గల అంతరంగాన్ని సూచిస్తుంది. ప్రత్యక్ష రూపం తెలుగులోనూ సహజంగా ఉంది.
- source_word: אֵין אֱלֹהִים
  choice: దేవుడు లేడు
  rationale: హీబ్రూ వాక్యంలోని ప్రత్యక్ష అస్తిత్వ నిరాకరణను నిలుపుతుంది; ‘దేవుడు పట్టించుకోడు’ వంటి వ్యాఖ్యాత్మక భావాన్ని చేర్చదు.
- source_word: הִשְׁחִיתוּ
  choice: వారు చెడిపోయారు
  rationale: క్రియ చెడిపోవడం లేదా భ్రష్టమవడం అనే ఫలిత స్థితిని సూచిస్తుంది. మూలంలోని బహువచన మార్పును నిలుపుతుంది.
- source_word: הִתְעִיבוּ עֲלִילָה
  choice: అసహ్యకరమైన పనులు చేశారు
  rationale: క్రియ మరియు ‘చర్య/ప్రవర్తన’ అనే నామవాచకాన్ని తెలుగులో సహజమైన ఒక వాక్యభాగంగా వ్యక్తం చేస్తూ నైతిక అసహ్యతను నిలుపుతుంది.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: మంచి చేసేవాడు ఒక్కడూ లేడు
  rationale: మంచి చేసే వ్యక్తి ఎవరూ లేరనే మూల వాక్య నిర్మాణం, బలాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: אֵין אֱלֹהִים లో నిరాకరణ పరిధి
  choice: “దేవుడు లేడు” అనే ప్రత్యక్ష అస్తిత్వ నిరాకరణ
  alternative: “దేవుడు పట్టించుకోడు” లేదా “తీర్పు లేదు” అనే ఆచరణాత్మక నాస్తికత్వ భావం
  rationale: కీర్తన ఆచరణాత్మక దేవరాహిత్యాన్ని కూడా విమర్శించినప్పటికీ, హీబ్రూ పదాలు ప్రత్యక్షంగా ‘దేవుడు లేడు’ అని చెబుతున్నాయి; సూచిత భావంతో మూల వాక్యాన్ని భర్తీ చేయలేదు.
- issue: ఏకవచన נָבָל తరువాత బహువచన క్రియలు
  choice: “మూర్ఖుడు…” తరువాత “వారు…” అనే సంఖ్య మార్పును నిలుపడం
  alternative: వాక్యమంతా ఏకవచనంగా చేయడం లేదా ఆరంభాన్నే బహువచనంగా మార్చడం
  rationale: మూలంలో ఒక ప్రతినిధి వ్యక్తి నుండి అతడు ప్రతినిధ్యం వహించే వర్గానికి ఉద్దేశపూర్వక మార్పు ఉంది. దానిని సవరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కీర్తన శైలి. శీర్షికను ప్రధాన వాక్యం నుంచి వేరుగా ఉంచాం. మూలంలోని ఏకవచనం-బహువచనం మార్పును ఉద్దేశపూర్వకంగా నిలిపాం; అస్పష్టమైన శీర్షిక పదాలకు పాదసూచికలు ఇచ్చాం.
