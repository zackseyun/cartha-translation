source:
  edition: WLC
  text: בָּ֘חַ֤נְתָּ לִבִּ֨/י פָּ֘קַ֤דְתָּ לַּ֗יְלָה צְרַפְתַּ֥/נִי בַל תִּמְצָ֑א זַ֝מֹּתִ֗י בַּל יַעֲבָר פִּֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/003.yaml
  text: You have examined my heart; you have visited me by night; you have tested me and find nothing[a]. I have purposed that my mouth will not transgress.
translation:
  language: te
  text: 'నీవు నా హృదయాన్ని పరిశీలించావు;

    రాత్రివేళ నన్ను దర్శించావు;

    నన్ను పుటం వేసి పరీక్షించావు, ఏదీ కనుగొనవు.

    నా నోరు హద్దు మీరదని నేను నిశ్చయించుకున్నాను.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా మరింత అక్షరార్థంగా, “నేను ఉద్దేశించుకున్నాను; నా నోరు హద్దు దాటి వెళ్లదు.” హెబ్రీ చివరి పాదం సంక్షిప్తంగా ఉండి, వేరుగా నిర్మించడానికి వీలుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּחַנְתָּ לִבִּי
  choice: నా హృదయాన్ని పరిశీలించావు
  rationale: בחן అంతరంగ స్వభావాన్ని పరీక్షించడం లేదా పరిశీలించడం అనే భావాన్ని ఇస్తుంది; ‘హృదయం’ హెబ్రీ మానవ అవగాహనలో ఆలోచనలూ ఉద్దేశాలూ కలిగిన అంతరంగ వ్యక్తిని సూచిస్తుంది.
- source_word: פָּקַדְתָּ לַּיְלָה
  choice: రాత్రివేళ నన్ను దర్శించావు
  rationale: פקד కు దర్శించడం, శ్రద్ధ చూపడం, తనిఖీ చేయడం వంటి విస్తృత అర్థాలు ఉన్నాయి. ఇక్కడ దైవిక పరిశీలన సందర్భంలో ‘దర్శించావు’ హెబ్రీ నుడికారాన్ని నిలుపుతుంది; ‘రాత్రివేళ’ కాలసూచనను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: צְרַפְתַּנִי
  choice: నన్ను పుటం వేసి పరీక్షించావు
  rationale: צרף లోహాన్ని పుటం వేసి శోధించే మూలచిత్రాన్ని కలిగి, రూపకంగా వ్యక్తిని పరీక్షించడాన్ని సూచిస్తుంది. ఈ అనువాదం చిత్రం మరియు సందర్భార్థం రెండింటినీ స్పష్టంగా ఉంచుతుంది.
- source_word: בַל תִּמְצָא
  choice: ఏమీ కనుగొనలేదు
  rationale: హెబ్రీలో కర్మ పేర్కొనబడలేదు. అందువల్ల దానిని ‘చెడు’ లేదా ‘దోషం’ అని నిర్దిష్టం చేయకుండా మూలంలోని సంక్షిప్తతను నిలిపింది.
- source_word: זַמֹּתִי
  choice: నేను నిశ్చయించుకున్నాను
  rationale: ఈ రూపాన్ని זמם అనే క్రియ నుండి వచ్చిన ‘నేను ఉద్దేశించాను/నిశ్చయించుకున్నాను’గా గ్రహించడం తరువాతి మాటలకు సహజమైన సంకల్పార్థాన్ని ఇస్తుంది.
- source_word: בַּל יַעֲבָר פִּי
  choice: నా నోరు హద్దు మీరకూడదు
  rationale: עבר అక్షరార్థంగా దాటడం లేదా హద్దు మీరడం. ‘నోరు’తో కలిసినప్పుడు మాటల్లో హద్దు మీరకపోవడాన్ని సూచిస్తుంది; తెలుగు నుడికారంలో నైతిక బలాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: చివరి పాదం యొక్క అర్థనిర్ణయం
  choice: కీర్తనకర్త తన మాటల్లో హద్దు మీరకూడదని చేసుకున్న నిశ్చయంగా అనువదించబడింది.
  alternative: ‘నేను ఉద్దేశించినది—నా నోరు దానిని దాటి వెళ్లదు’ లేదా ‘నా నోరు అతిక్రమించదు’ అని కూడా నిర్మించవచ్చు.
  rationale: హెబ్రీ వాక్యం సంక్షిప్తంగాను కొంత క్లిష్టంగాను ఉంది. זַמֹּתִי ను క్రియగా తీసుకొని తరువాతి మాటలను ఆ నిశ్చయపు విషయంగా గ్రహించడం సందర్భానికి సరిపోతుంది; అయితే ఇతర నిర్మాణసాధ్యతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కీర్తనా శైలిని పాటించాం. ‘దర్శించావు’ కొద్దిగా సాహిత్య గంభీరతను నిలుపుతుండగా, ‘పుటం వేసి పరీక్షించావు’ మూలంలోని లోహశోధన రూపకాన్ని సాధారణ పాఠకుడికి అర్థమయ్యేలా చేస్తుంది.
