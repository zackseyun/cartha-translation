revisions:
- from: మనుషుల క్రియల విషయానికొస్తే, నీ పెదవుల మాటను బట్టి హింసాత్మకుని మార్గాలకు నేను దూరంగా ఉన్నాను.[a]
  to: మానవుల క్రియల విషయములో, నీ పెదవుల మాటచేత నేను హింసాత్మకుని మార్గాలనుండి నన్ను కాపాడుకున్నాను.[a]
  rationale: The revision makes the divine word explicitly instrumental, renders the perfect verb as active self-restraint rather than mere distance, and retains the poetic imagery and the source's singular/generic designation of the violent person. The footnote preserves the genuine lexical ambiguity without presenting the less likely sense as the main text.
