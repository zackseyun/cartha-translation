source:
  edition: WLC
  text: לִ/פְעֻלּ֣וֹת אָ֭דָם בִּ/דְבַ֣ר שְׂפָתֶ֑י/ךָ אֲנִ֥י שָׁ֝מַ֗רְתִּי אָרְח֥וֹת פָּרִֽיץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/004.yaml
  text: As for the deeds of man[a], by the word of your lips I have kept myself from the paths of the violent.
translation:
  language: te
  text: మానవుల క్రియల విషయములో, నీ పెదవుల మాటచేత నేను హింసాత్మకుని మార్గాలనుండి నన్ను కాపాడుకున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత రూపనిష్ఠంగా, “హింసాత్మకుని మార్గాలను నేను కాచుకున్నాను.” హీబ్రూ క్రియకు “గమనించాను” అనే అర్థం కూడా ఉండవచ్చు; అయితే సందర్భం ఆ మార్గాలనుండి తనను తాను కాపాడుకున్నాననే భావానికే ఎక్కువ మద్దతిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: לִפְעֻלּוֹת אָדָם
  choice: మనుషుల క్రియల విషయానికొస్తే
  rationale: לְను విషయాన్ని పరిచయం చేసేదిగా తీసుకొని, אָדָםను ఒక నిర్దిష్ట పురుషునిగా కాక సాధారణంగా మానవులను సూచించే సమూహార్థక పదంగా అనువదించాం.
- source_word: בִּדְבַר שְׂפָתֶיךָ
  choice: నీ పెదవుల మాటను బట్టి
  rationale: בְ ఇక్కడ దేవుని పలుకే కీర్తనకర్త ప్రవర్తనకు ప్రమాణం లేదా సాధనం అనే భావాన్ని ఇస్తుంది. ‘నీ పెదవులు’ అనే హీబ్రూ కవితాత్మక మానవరూప వర్ణనను నిలిపాం.
- source_word: שָׁמַרְתִּי
  choice: నేను దూరంగా ఉన్నాను
  rationale: శబ్దార్థంగా ‘కాపాడాను/పాటించాను/గమనించాను’ కావచ్చు; అయితే ఈ సందర్భంలో హింసాత్మక మార్గాలను నివారించడమే ప్రధాన భావం. అసలు పదంలోని ప్రత్యామ్నాయ పఠనాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אָרְחוֹת
  choice: మార్గాలకు
  rationale: జీవన విధానం లేదా ప్రవర్తనా పద్ధతిని సూచించే ‘దారులు/మార్గాలు’ అనే రూపకాన్ని ‘మార్గాలు’ సహజంగా నిలుపుతుంది.
- source_word: פָּרִיץ
  choice: హింసాత్మకుని
  rationale: ఈ పదం సాధారణ అపరాధిని కాక హింసాత్మకంగా, క్రూరంగా ప్రవర్తించే వ్యక్తిని సూచిస్తుంది; హీబ్రూలోని ఏకవచన రూపాన్ని నిలిపాం.
theological_decisions:
- issue: שָׁמַרְתִּיతో కూడిన వాక్యభాగం యొక్క భావం
  choice: దేవుని పలుకును బట్టి కీర్తనకర్త హింసాత్మకుని మార్గాలకు దూరంగా ఉన్నాడు.
  alternative: కీర్తనకర్త హింసాత్మకుని మార్గాలను గమనించాడు లేదా వాటిపై కాపలా ఉంచాడు.
  rationale: שׁמרకు ‘కాపాడు, పాటించు, గమనించు’ అనే అర్థాలున్నా, కీర్తనలోని నిర్దోష ప్రవర్తన ప్రకటన మరియు దేవుని మాటకు ఇచ్చిన పాత్ర నివారణ/ఆత్మనిగ్రహ భావానికే ఎక్కువ మద్దతిస్తాయి. అయినప్పటికీ మూలంలోని నిజమైన సందిగ్ధతను పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తనాత్మక గౌరవాన్ని నిలిపే శైలి. ‘నీ పెదవుల మాట’ అనే కవితాత్మక రూపాన్ని ఉద్దేశపూర్వకంగా ఉంచాం; సందిగ్ధ క్రియను ప్రధాన పాఠంలో సందర్భానుకూలంగా, పాదటిప్పణిలో రూపనిష్ఠ ప్రత్యామ్నాయాలతో ఇచ్చాం.
