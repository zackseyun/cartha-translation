id: PSA.17.8
reference: Psalms 17:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שָׁ֭מְרֵ/נִי כְּ/אִישׁ֣וֹן בַּת עָ֑יִן בְּ/צֵ֥ל כְּ֝נָפֶ֗י/ךָ תַּסְתִּירֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/008.yaml
  text: Keep me like the pupil of the eye[a]; hide me in the shadow of your wings.
translation:
  language: te
  text: కంటిపాపవలె నన్ను కాపాడు; నీ రెక్కల నీడలో నన్ను దాచు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמְרֵנִי
  choice: నన్ను కాపాడు
  rationale: שׁמר అనే క్రియకు కాపాడడం, భద్రంగా ఉంచడం, కనిపెట్టుకొని ఉండడం అనే భావాలు ఉన్నాయి. ప్రార్థనలోని రక్షణ విన్నపాన్ని సహజమైన ఆధునిక తెలుగులో ‘నన్ను కాపాడు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: כְּאִישׁוֹן בַּת עָיִן
  choice: నా కనుపాపలా
  rationale: ఈ హీబ్రూ నానుడి కంటి మధ్యలోని కనుపాపను సూచించి, అత్యంత జాగ్రత్తగా కాపాడడాన్ని చిత్రిస్తుంది. తెలుగులో ‘కనుపాపలా కాపాడు’ సహజమైన, పారదర్శకమైన సమానార్థక నానుడి. సందర్భానికి తగిన సహజ వాక్య నిర్మాణం కోసం స్వామ్యార్థకమైన ‘నా’ చేర్చబడింది; హీబ్రూలో అది స్పష్టంగా లేదు కాబట్టి ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: בְּצֵל
  choice: నీడలో
  rationale: צֵל అంటే నీడ లేదా ఛాయ. రెక్కలతో కలిసి రక్షణనిచ్చే కప్పుదల అనే కవితాత్మక చిత్రాన్ని ‘నీడలో’ సహజంగా నిలుపుతుంది.
- source_word: כְּנָפֶיךָ
  choice: నీ రెక్కల
  rationale: כָּנָף అంటే రెక్క. దేవుని రక్షణను సూచించే మూలపాఠంలోని సజీవ రూపకాన్ని వ్యాఖ్యానించి మార్చకుండా యథాతథంగా నిలుపుతుంది.
- source_word: תַּסְתִּירֵנִי
  choice: నన్ను దాచు
  rationale: סתר హిఫిల్ రూపం దాచడం లేదా మరుగుపరచడం అని అర్థం. ‘నన్ను దాచు’ మూలక్రియను నేరుగా అనువదిస్తూ రక్షణాత్మక చిత్రాన్ని కాపాడుతుంది.
theological_decisions:
- issue: కంటి కనుపాపకు సంబంధించిన రక్షణ నానుడి
  choice: తెలుగులో సహజమైన ‘నా కనుపాపలా నన్ను కాపాడు’ అనే రూపాన్ని ప్రధాన పాఠంలో ఉపయోగించడం.
  alternative: ‘కంటి కనుపాపలా నన్ను కాపాడు’
  rationale: ఈ వచనం సిద్ధాంతపరమైన నిర్వచనం ఇవ్వకుండా, సున్నితమైన కనుపాపను జాగ్రత్తగా కాపాడే దృశ్యం ద్వారా దేవుని రక్షణను వేడుకుంటుంది. తెలుగు నానుడి ఆ భావాన్ని స్పష్టంగా అందిస్తుంది; హీబ్రూలో లేని స్వామ్య సూచనను పాదసూచిక గుర్తిస్తుంది.
- issue: రెక్కల రూపకాన్ని నిలుపడం
  choice: ‘నీ రెక్కల నీడలో’ అని రూపకాన్ని నేరుగా ఉంచడం.
  alternative: ‘నీ రక్షణలో’ లేదా ‘నీ సంరక్షణలో’
  rationale: హీబ్రూ పాఠం దేవుని రక్షణను రెక్కల నీడ అనే శరీరాత్మక కవితా రూపకంతో వ్యక్తం చేస్తుంది. దానిని వివరణాత్మక భావంగా మార్చకుండా ఉంచడం సాహిత్య, దైవశాస్త్ర ఉద్వేగాన్ని సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనా కవిత్వానికి తగిన గౌరవప్రదమైన, సంక్షిప్త శైలి. సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే ‘కనుపాపలా కాపాడు’ అనే తెలుగు నానుడిని ఉపయోగిస్తూ, మూలంలోని కంటి మరియు రెక్కల దృశ్యరూపాలను నిలుపుకుంది.
