id: PSA.17.7
reference: Psalms 17:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הַפְלֵ֣ה חֲ֭סָדֶי/ךָ מוֹשִׁ֣יעַ חוֹסִ֑ים מִ֝/מִּתְקוֹמְמִ֗ים בִּֽ/ימִינֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/007.yaml
  text: Show your wondrous steadfast love[a], O Savior of those who take refuge from those who rise up against them[b], by your right hand.
translation:
  language: te
  text: వారికి విరోధంగా లేచేవారి నుండి ఆశ్రయం పొందేవారిని నీ కుడిచేతితో[b] రక్షించేవాడా, నీ అద్భుతమైన స్థిరప్రేమను చూపించు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ స్థిరప్రేమను అద్భుతమైనదిగా చేయి.” హీబ్రూ ఆజ్ఞారూపం దానిని అసాధారణమైనదిగా చూపించు లేదా అద్భుతమైనదిగా చేయి అనే రెండు భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: చివరి పదబంధాన్ని “నీ కుడిచేతి వద్ద ఆశ్రయం పొందేవారిని” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְלֵה
  choice: ఆశ్చర్యకరమైన ... చూపించు
  rationale: פלא హిఫీల్ ఆజ్ఞారూపం ఏదైనా అద్భుతమైనదిగా చేయడం లేదా దాని అసాధారణతను ప్రదర్శించడం అనే భావాలను కలిగి ఉంది. ప్రార్థనా సందర్భంలో సహజమైన తెలుగులో ఈ రెండవ భావాన్ని ప్రధాన పాఠం వ్యక్తపరుస్తుంది.
- source_word: חֲסָדֶיךָ
  choice: నీ ... స్థిరప్రేమను
  rationale: חסדలో కరుణ, నిబద్ధత, విశ్వసనీయమైన ప్రేమ అనే భావాలు కలిసి ఉన్నాయి. ‘స్థిరప్రేమ’ సంక్షిప్తంగా ఉండి, ప్రేమలోని నిలకడను నిలుపుతుంది.
- source_word: מוֹשִׁיעַ
  choice: రక్షించువాడా
  rationale: ఈ కృదంతం దేవుణ్ణి నేరుగా సంబోధిస్తూ, ఆయన రక్షించే వ్యక్తి అని తెలియజేస్తుంది. సంబోధనార్థకమైన ‘రక్షించువాడా’ ఆ ప్రయోగాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: חוֹסִים
  choice: ఆశ్రయం పొందేవారిని
  rationale: חסה రక్షణ కోసం ఆశ్రయం పొందడాన్ని సూచిస్తుంది. ఇది కేవలం ‘నమ్మడం’ అనే అమూర్త భావం కంటే మూలంలోని రక్షణాత్మక రూపకాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מִמִּתְקוֹמְמִים
  choice: వారి మీదికి లేచేవారి నుండి
  rationale: קום యొక్క ఈ రూపం శత్రుత్వంతో ఎదిరించి లేవడాన్ని సూచిస్తుంది. ఎవరికి వ్యతిరేకంగా లేస్తున్నారో హీబ్రూలో స్పష్టంగా చెప్పకపోయినా, సమీపంలోని ‘ఆశ్రయం పొందేవారు’ అనే కర్మను బట్టి ‘వారి మీదికి’ అని సహజంగా వ్యక్తపరచబడింది.
- source_word: בִּימִינֶךָ
  choice: నీ కుడిచేతితో
  rationale: ప్రధాన వాక్యనిర్మాణంలో ఇది దేవుడు రక్షించే సాధనాన్ని సూచిస్తుంది. ‘కుడిచేతితో’ దేవుని శక్తిని సూచించే మానవరూప వర్ణనను నిలుపుతుంది.
theological_decisions:
- issue: చివరి పదబంధమైన בִּימִינֶךָ యొక్క వాక్యసంబంధం
  choice: 'దేవుని రక్షణక్రియతో అనుసంధానం: ‘నీ కుడిచేతితో రక్షించువాడా’'
  alternative: ‘నీ కుడిచేతి వద్ద ఆశ్రయం పొందేవారిని’ అని ఆశ్రయం పొందేవారితో అనుసంధానించవచ్చు; లేదా ‘నీ కుడిచేతికి ఎదురుగా లేచేవారి నుండి’ అని కూడా గ్రహించవచ్చు.
  rationale: చివర ఉన్న విభక్తి పదబంధం ఏ భాగంతో అనుసంధానమవుతుందో హీబ్రూ పూర్తిగా నిర్దిష్టం చేయదు. సందర్భంలో దేవుడు తన కుడిచేతితో రక్షిస్తాడనే పఠనం అత్యంత సహజమైనది; అయినా నిజమైన వాక్యనిర్మాణ సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ప్రార్థనకు తగిన గౌరవప్రదమైన సంబోధన వాడబడింది. ‘స్థిరప్రేమ’ మూలంలోని విశ్వసనీయత, నిబద్ధతను సంక్షిప్తంగా నిలుపుతుంది. పాదటిప్పణి సూచికలు సంబంధిత ప్రధాన వాక్యాంతంలో ఉంచబడ్డాయి.
