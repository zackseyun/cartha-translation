id: PSA.17.13
reference: Psalms 17:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: קוּמָ֤/ה יְהוָ֗ה קַדְּמָ֣/ה פָ֭נָי/ו הַכְרִיעֵ֑/הוּ פַּלְּטָ֥/ה נַ֝פְשִׁ֗/י מֵ/רָשָׁ֥ע חַרְבֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/013.yaml
  text: Rise up[a], O Yahweh; confront him, bring him low[b]; deliver my life from the wicked by your sword.
translation:
  language: te
  text: లెమ్ము, యాహ్వే! అతణ్ణి ఎదుర్కొని కూలదోయి; నా ప్రాణాన్ని[a] దుష్టుని నుండి నీ ఖడ్గంతో[b] రక్షించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో నెఫెష్; దీనికి తరచుగా ‘ఆత్మ’ అని అర్థం ఉండవచ్చు, అయితే ఇక్కడ ప్రాణాపాయ సందర్భంలో ‘ప్రాణం’ లేదా ‘నేను’ అనే భావం సంభావ్యం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీ ఖడ్గమైన దుష్టుని నుండి నా ప్రాణాన్ని రక్షించు.” దుష్టుణ్ణి యాహ్వే చేతిలోని ఒక సాధనంగా హెబ్రీ చిత్రిస్తుండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמָה
  choice: లెమ్ము
  rationale: קום క్రియ యొక్క ఆజ్ఞార్థకం. ప్రార్థనలోని అత్యవసర పిలుపును గౌరవభరితమైన, సహజమైన తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో మార్చకుండా, దాని సాధారణ ధ్వన్యనుకరణను తెలుగులో ఇస్తుంది.
- source_word: קַדְּמָה פָנָיו
  choice: అతణ్ణి ఎదుర్కొని
  rationale: అక్షరార్థంగా ‘అతని ముఖం ముందుకు వెళ్లు’; శత్రువుతో ముఖాముఖిగా తలపడే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הַכְרִיעֵהוּ
  choice: కూలదోయి
  rationale: כרע హిఫీల్ రూపం అతణ్ణి వంగిపోయేలా లేదా కిందపడేలా చేయడాన్ని సూచిస్తుంది; యుద్ధసందర్భంలోని బలాన్ని నిలుపుతుంది.
- source_word: פַּלְּטָה
  choice: రక్షించు
  rationale: ప్రమాదం నుంచి విడిపించడం లేదా కాపాడడం అనే פלט క్రియ భావాన్ని సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: נַפְשִׁי
  choice: నా ప్రాణాన్ని
  rationale: נפש కు ‘ప్రాణం, జీవితం, స్వయం’ అనే అర్థాలు ఉన్నాయి. ప్రాణాపాయ సందర్భంలో ‘నా ప్రాణాన్ని’ అనేది స్పష్టమైన సహజ అర్థం.
- source_word: מֵרָשָׁע
  choice: దుష్టుని నుండి
  rationale: ఏకవచన రూపం ఇక్కడ ముందున్న పురుష ఏకవచన సూచనలకు అనుగుణంగా ఒక దుష్ట ప్రత్యర్థిని సూచించగలదు; హెబ్రీ సంక్షిప్తతను నిలుపుతుంది.
- source_word: חַרְבֶּךָ
  choice: నీ ఖడ్గంతో
  rationale: ‘నీ ఖడ్గం’ అనే పదబంధాన్ని సాధనార్థకంగా తీసుకొని, యాహ్వే తన ఖడ్గం ద్వారా రక్షించాలని కీర్తనకర్త కోరుతున్న భావాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘నీ ఖడ్గం’ అనే పదబంధానికి ‘దుష్టుడు’తో ఉన్న సంబంధం
  choice: యాహ్వే తన ఖడ్గాన్ని ఉపయోగించి కీర్తనకర్తను రక్షిస్తాడు
  alternative: ‘నీ ఖడ్గమైన దుష్టుని నుండి’—దుష్టుడు యాహ్వే చేతిలో ఒక సాధనంగా చిత్రించబడతాడు
  rationale: מֵרָשָׁע חַרְבֶּךָ అనే హెబ్రీ పదక్రమం సంక్షిప్తంగా ఉండి, సాధనార్థకంగానూ సమానాధికరణంగానూ అర్థం కావచ్చు. ప్రత్యక్ష దైవ జోక్యాన్ని కోరే ఆజ్ఞార్థక క్రియల సందర్భం ప్రధాన పాఠంలోని సాధనార్థక పఠనానికి మద్దతిస్తుంది; దైవ కార్యనిర్వహణపై ప్రభావం చూపే ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనా కీర్తనకు తగిన గౌరవభరితమైన మరియు అత్యవసర స్వరాన్ని ఉపయోగించాం. ‘లెమ్ము’, ‘ఖడ్గం’ వంటి పదాలు కీర్తనా గాంభీర్యాన్ని నిలుపుతాయి; మిగతా వాక్యనిర్మాణం సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
