  yaml_path: translation/ot/psalms/017/009.yaml
  text: from the wicked who devastate me[a], my deadly enemies who surround me.
translation:
  language: te
  text: 'నన్ను నాశనం చేసే దుష్టుల నుంచీ,

    నన్ను చుట్టుముట్టే నా ప్రాణాంతక శత్రువుల నుంచీ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ప్రాణానికి విరోధంగా నన్ను చుట్టుముట్టే నా శత్రువుల నుంచీ.” హీబ్రూ పదబంధంలో అక్షరార్థంగా “ప్రాణం/జీవితం” (בְּנֶפֶשׁ) ఉంది; అది శత్రువులు కీర్తనకర్త ప్రాణాన్ని తీయాలని చూస్తున్నారని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי
  choice: నుంచీ
  rationale: ఈ సందర్భంలో కీర్తనకర్త రక్షణ కోరుతున్న శత్రుత్వ మూలాన్ని సూచిస్తుంది. ‘ఎదుటి నుంచి’ అనే పదక్షర అనువాదం కన్నా ‘నుంచీ’ సహజంగా ఉంది.
- source_word: רְשָׁעִים
  choice: దుష్టులు
  rationale: నైతికంగా దోషులైన వ్యక్తులను సూచించే బహువచన నామవాచక ప్రయోగాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: זוּ
  choice: చేసే
  rationale: దుష్టులను తరువాతి క్రియతో కలిపే సంబంధార్థక కణాన్ని తెలుగులో సహజమైన సంబంధ క్రియారూపంతో వ్యక్తం చేస్తుంది.
- source_word: שַׁדּוּנִי
  choice: నన్ను నాశనం చేసే
  rationale: שׁדד హింసాత్మకంగా పాడుచేయడం లేదా కొల్లగొట్టడం అనే బలమైన భావాన్ని కలిగిస్తుంది. ‘నాశనం చేసే’ ఆ తీవ్రతను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; సంపూర్ణంగా సంహరించడమే అని అనవసరంగా నిర్బంధించదు.
- source_word: אֹיְבַי
  choice: నా శత్రువులు
  rationale: కీర్తనకర్తకు విరోధులైనవారిని సూచించే సరళమైన స్వామ్య బహువచనం.
- source_word: בְּנֶפֶשׁ
  choice: ప్రాణాంతక
  rationale: נֶפֶשׁ ఇక్కడ ప్రాణం/జీవితం అనే భావంతో శత్రుత్వం ప్రాణానికే ముప్పుగా ఉందని సూచించవచ్చు. ‘ప్రాణాంతక’ సహజమైన ప్రధాన పాఠాన్ని ఇస్తుంది; ప్రత్యామ్నాయ నిర్మాణం పాదటిప్పణిలో నిలుపబడింది.
- source_word: יַקִּיפוּ עָלָי
  choice: నన్ను చుట్టుముట్టే
  rationale: נקף హిఫీల్ రూపం עַל‌తో కలిసి చుట్టూ ఆవరించడం లేదా ముట్టడించడం అనే భావాన్ని ఇస్తుంది. ఈ ఎంపిక స్పష్టంగా, దృశ్యాత్మకంగా ఉంది.
theological_decisions:
- issue: בְּנֶפֶשׁ అనే పదబంధం శత్రువుల స్వభావాన్నా, లేక కీర్తనకర్త ప్రాణంపై వారి దాడినేనా సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో ‘ప్రాణాంతక శత్రువులు’
  alternative: ‘నా ప్రాణానికి విరోధంగా నన్ను చుట్టుముట్టే నా శత్రువులు’
  rationale: హీబ్రూ పదబంధం జీవితం/ప్రాణం అనే భావాన్ని నిజంగా కలిగి ఉన్నా దాని వ్యాకరణ సంబంధం సంక్షిప్తంగా, కొంత అనిశ్చితంగా ఉంది. ప్రధాన పాఠం ప్రాణహాని తీవ్రతను సహజంగా వ్యక్తం చేస్తుంది; పాదటిప్పణి మరింత పదక్షర ప్రత్యామ్నాయాన్ని భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనా-కావ్య గౌరవాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. రెండు సమాంతర పాదాలలో ‘నుంచీ’ని పునరావృతం చేసి, ముందున్న రక్షణ విన్నపంతో ఈ వాక్యఖండానికి ఉన్న సంబంధాన్ని స్పష్టంగా ఉంచాం.
