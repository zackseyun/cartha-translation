  text: תְּפִלָּ֗ה לְ/דָ֫וִ֥ד שִׁמְעָ֤/ה יְהוָ֨ה צֶ֗דֶק הַקְשִׁ֥יבָ/ה רִנָּתִ֗/י הַאֲזִ֥ינָ/ה תְפִלָּתִ֑/י בְּ֝/לֹ֗א שִׂפְתֵ֥י מִרְמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/000.yaml
  text: A prayer of David. Hear righteousness[a], Yahweh; pay attention to my cry; give ear to my prayer from lips without deceit.
translation:
  language: te
  text: 'దావీదు ప్రార్థన.


    యెహోవా, న్యాయమైన వాదనను[a] విను; నా మొరను ఆలకించు; మోసంలేని పెదవుల నుండి వచ్చే నా ప్రార్థనకు చెవి ఒగ్గు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీతిని విను” లేదా “న్యాయాన్ని విను.” హెబ్రీ పదం నీతి, న్యాయం లేదా న్యాయమైన వాదనను సూచించగలదు; ఇక్కడ అది కీర్తనకర్త తన న్యాయమైన పక్షాన్ని వినమని కోరుతున్న భావంలో ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: దావీదు ప్రార్థన
  rationale: లְ అనేది రచయితత్వం, సంబంధం లేదా అంకితం సూచించగలదు. శీర్షికగా సహజమైన తెలుగు రూపాన్ని ఎంచుకున్నాం; అసలు వాక్యంలోని సంక్షిప్తతను నిలిపాం.
- source_word: צֶדֶק
  choice: న్యాయమైన నా వాదనను
  rationale: ఈ పదానికి ‘నీతి’, ‘న్యాయం’, ‘న్యాయమైన వాదన/వ్యాజ్యం’ అనే భావాలు ఉన్నాయి. సందర్భంలో కీర్తనకర్త దేవుని ఎదుట తన న్యాయమైన పక్షాన్ని వినమని కోరుతున్నందున ఈ రూపం సహజంగా ఉంటుంది; పదంలోని విస్తృత అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: רִנָּתִי
  choice: నా మొరకు
  rationale: ఇక్కడ רִנָּה ఆనందధ్వని కంటే సహాయం కోరే బిగ్గర మొరను సూచిస్తుంది.
- source_word: הַאֲזִינָה
  choice: ఆలకించు
  rationale: ‘చెవి ఒగ్గు’ అనే మూల చిత్రాన్ని గౌరవిస్తూ, ఆధునిక గౌరవప్రద తెలుగులో శ్రద్ధగా వినడాన్ని తెలిపే పదం.
- source_word: בְּלֹא שִׂפְתֵי מִרְמָה
  choice: మోసంలేని పెదవుల నుండి వచ్చే
  rationale: హెబ్రీ వాక్యభాగం సంక్షిప్తంగా ఉంది. ప్రార్థన మోసపూరిత పెదవుల నుంచి రావడం లేదనే సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేశాం.
theological_decisions:
- issue: צֶדֶק పదం కీర్తనకర్త యొక్క నీతినే సూచిస్తుందా, లేక అతని న్యాయమైన వ్యాజ్యాన్నా?
  choice: న్యాయమైన నా వాదనను
  alternative: నీతిని / న్యాయాన్ని
  rationale: దేవుడు తన మొరను, ప్రార్థనను వినాలని కీర్తనకర్త కోరుతున్న సమాంతర నిర్మాణంలో ‘న్యాయమైన వాదన’ సందర్భానుకూలంగా ఉంది. అయినా హెబ్రీ పదంలోని నీతి/న్యాయం అనే విస్తృత భావాన్ని పాదటిప్పణిలో నిలిపాం.
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువా
  rationale: ఇది సాధారణ బిరుదు కాక ఒడంబడిక దైవనామం కావడంతో తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలిని ఉపయోగించాం. ‘శ్రద్ధ చూపు’, ‘ఆలకించు’ వంటి పదాలు హెబ్రీలోని వరుస వినికిడి ఆజ్ఞల తీవ్రతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి.
