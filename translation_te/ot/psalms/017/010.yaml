  yaml_path: translation/ot/psalms/017/010.yaml
  text: They close up their fat hearts[a]; with their mouths they speak arrogantly.
translation:
  language: te
  text: వారు తమ కొవ్వెక్కిన హృదయాలను మూసివేసుకుంటారు[a]; తమ నోటితో అహంకారంగా మాట్లాడుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “వారు తమ కొవ్వును మూసివేస్తారు.” ఇక్కడ “కొవ్వు” స్పందనలేని లేదా స్వయంతృప్తితో కఠినమైన హృదయానికి రూపకంగా ఉండవచ్చు. ప్రధాన పాఠ్యంలో భావం స్పష్టంగా ఉండేందుకు “హృదయాలు” అని చేర్చబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבָּמוֹ
  choice: తమ కొవ్వును
  rationale: హీబ్రూ వాక్యంలో అక్షరార్థంగా ‘వారి కొవ్వు’ అని ఉంది; ‘హృదయం’ అనే పదం మూలంలో లేదు. కవితాత్మక రూపకంలోని ఉద్దేశపూర్వక అస్పష్టతను ప్రధాన పాఠ్యంలో నిలిపి, భావసూచనను పాదటిప్పణిలో ఇచ్చాం.
- source_word: סָּגְרוּ
  choice: మూసివేసుకున్నారు
  rationale: మూల క్రియ ‘మూయడం/బిగించడం’ అనే భావాన్ని ఇస్తుంది. తెలుగు వాక్యంలో తమను తాము స్పందనలేనివారిగా చేసుకున్న రూపకాన్ని సహజంగా తెలియజేయడానికి ఆత్మార్థక రూపం వాడాం.
- source_word: פִּימוֹ
  choice: తమ నోటితో
  rationale: రూపపరంగా ఏకవచన నామానికి బహువచన స్వామ్యప్రత్యయం ఉంది; సమూహార్థాన్ని నిలిపే సహజ తెలుగు ప్రయోగంగా ‘తమ నోటితో’ ఎంచుకున్నాం.
- source_word: דִּבְּרוּ
  choice: మాట్లాడుతున్నారు
  rationale: హీబ్రూ సంపూర్ణ క్రియారూపం ఈ కవితా సందర్భంలో దుష్టుల కొనసాగుతున్న స్వభావాన్ని వర్ణిస్తుంది; అందువల్ల వర్తమాన కొనసాగింపు సహజంగా ఉంది.
- source_word: בְגֵאוּת
  choice: అహంకారంగా
  rationale: ఈ నామవాచకం గర్వం, అతిశయం, అహంకారం అనే ప్రతికూల భావాన్ని సూచిస్తుంది; క్రియావిశేషణ రూపం తెలుగులో సహజంగా సరిపోతుంది.
