- from: వారు తమ కొవ్వును మూసివేసుకున్నారు[a]; తమ నోటితో అహంకారంగా మాట్లాడుతున్నారు.
  to: వారు తమ కొవ్వెక్కిన హృదయాలను మూసివేసుకుంటారు[a]; తమ నోటితో అహంకారంగా మాట్లాడుతారు.
  rationale: The revision supplies the idiom’s implied inward referent, “hearts,” so that the verse reads naturally in modern standard Telugu, while retaining “fat” imagery in “కొవ్వెక్కిన” and documenting the Hebrew’s literal wording in the footnote. It also makes both clauses parallel generic-present descriptions of the opponents’ conduct.
