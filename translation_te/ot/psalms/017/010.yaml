review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the Hebrew image of “fat” in its note and renders the second colon faithfully. However, “తమ కొవ్వును మూసివేసుకున్నారు” is not a comprehensible Telugu rendering of the Hebrew idiom, and the reflexive verb adds an awkward nuance not explicit in the source. The idiom concerns a heart rendered closed, insensitive, or self-satisfied; supplying “hearts” in the main text is warranted for intelligibility, with the concrete Hebrew wording retained in the note.
  naturalness: The second clause is natural, though matching the ongoing/general characterization with simple present verbs improves parallelism. The first clause requires revision because Telugu cannot naturally say that people “close their fat.” “కొవ్వెక్కిన హృదయాలను మూసివేసుకుంటారు” is understandable modern Telugu and retains the metaphorical force.
  terminology: “అహంకారంగా” accurately conveys בְגֵאוּת. “కొవ్వెక్కిన హృదయాలు” preserves the Hebrew fat imagery while making its idiomatic referent explicit. The footnote should identify the literal Hebrew expression and explain that “heart” is supplied in the translation.
  issues:
  - severity: medium
    issue: The phrase “వారు తమ కొవ్వును మూసివేసుకున్నారు” is semantically opaque and unnatural in Telugu.
    rationale: Although formally close to the Hebrew words, it does not communicate the Hebrew idiom to modern Telugu readers. The source expression uses “fat” figuratively in connection with inward insensibility/self-satisfied hardness.
  - severity: low
    issue: “మూసివేసుకున్నారు” introduces a completed reflexive sense and does not align smoothly with “మాట్లాడుతున్నారు.”
    rationale: The poetic perfect can portray characteristic conduct. Simple present verbs provide a consistent, natural Telugu portrayal without claiming a distinct completed event.
  revised_text: వారు తమ కొవ్వెక్కిన హృదయాలను మూసివేసుకుంటారు[a]; తమ నోటితో అహంకారంగా మాట్లాడుతారు.
  revised_footnotes:
