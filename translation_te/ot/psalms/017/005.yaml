lexical_decisions:
- source_word: תָּמֹךְ
  choice: స్థిరంగా నిలిచాయి
  rationale: תמך అనే క్రియలో గట్టిగా పట్టుకోవడం, నిలబెట్టడం, స్థిరంగా ఉండడం అనే భావాలు ఉన్నాయి. రెండవ పాదంలోని ‘జారలేదు’ అనే సమాంతర భావానికి అనుగుణంగా, సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ఈ రూపాన్ని ఎంచుకున్నాం; హెబ్రీలోని వ్యాకరణ సందిగ్ధతను పాదసూచికలో ఉంచాం.
- source_word: אֲשֻׁרַי
  choice: నా అడుగులు
  rationale: నడకలోని అడుగులను లేదా ఒకరి నడవడిని సూచించే స్పష్టమైన, సహజమైన తెలుగు పదబంధం.
- source_word: בְּמַעְגְּלוֹתֶיךָ
  choice: నీ బాటల్లో
  rationale: מַעְגָּל నడిచే బాటను లేదా ఏర్పడిన త్రోవను సూచిస్తుంది. ‘బాటల్లో’ concrete walking imageryను నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: בַּל
  choice: లేదు
  rationale: కావ్యరూపంలోని నిషేధార్థక అవ్యయాన్ని తెలుగు క్రియతో సహజంగా కలిపి ప్రత్యక్ష నిషేధంగా అనువదించాం.
- source_word: נָמֹטּוּ
  choice: జారలేదు
  rationale: מוט ఇక్కడ జారడం, తూలడం, స్థానం తప్పడం అనే భావాన్ని ఇస్తుంది. పాదాలతో కలిసిన సందర్భంలో ‘జారలేదు’ అత్యంత సహజమైన సమానార్థకం.
- source_word: פְעָמָי
  choice: నా పాదాలు
  rationale: ఈ పదం అడుగులు లేదా అడుగుల చప్పుళ్లను సూచించగలిగినా, ‘జారలేదు’ అనే క్రియతో తెలుగులో ‘నా పాదాలు’ సహజంగా ఉండి మొదటి పాదంలోని ‘నా అడుగులు’తో సమాంతరతను కాపాడుతుంది.
theological_decisions:
- issue: תָּמֹךְ అనే రూపం విన్నపమా లేక స్థిరత్వాన్ని తెలిపే ప్రకటననా
  choice: ప్రధాన పాఠ్యంలో గత స్థిరత్వాన్ని తెలిపే ప్రకటనగా అనువదించడం
  alternative: “నీ బాటల్లో నా అడుగులను నిలబెట్టు” అనే విన్నపం
  rationale: తర్వాతి ‘నా పాదాలు జారలేదు’ అనే ప్రకటనతో ప్రధాన పాఠ్యాన్ని సమాంతరంగా ఉంచాం. అయితే హెబ్రీ రూపం విన్నపంగా కూడా అర్థమయ్యే అవకాశాన్ని పాదసూచికలో స్పష్టంగా నిలిపాం; అందువల్ల ఏ theological readingనూ ఏకపక్షంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కావ్యశైలిని వాడాం. ‘అడుగులు—పాదాలు,’ ‘నిలిచాయి—జారలేదు’ అనే సమాంతర నిర్మాణాన్ని కాపాడాం. హెబ్రీలోని విన్నపం/ప్రకటన సందిగ్ధతను ప్రధాన పాఠ్యంలో బలవంతంగా పరిష్కరించకుండా పాదసూచికలో నిలిపాం.
