  source_fidelity: 'ప్రధాన పాఠ్యంలో ఉన్న “నా అడుగులు స్థిరంగా నిలిచాయి” హెబ్రీ תָּמֹךְ యొక్క ప్రత్యక్ష వ్యాకరణాన్ని ప్రతిఫలించదు. మసొరెటిక్ స్వరపాఠంలో ఇది సాధారణంగా దేవునికి ఉద్దేశించిన ఆజ్ఞార్థక/విన్నప రూపం: “నా అడుగులను నిలబెట్టు/ఆధరించు.” రెండవ పాదంలోని “నా పాదాలు జారలేదు” ప్రకటనను యథాతథంగా నిలిపాం. ప్రకటనగా చదివే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచవచ్చు.'
