translation:
  language: te
  text: నీ బాటల్లో నా అడుగులను నిలబెట్టు[a][b]; నా పాదాలు జారలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ బాటల్లో నా అడుగులు స్థిరంగా నిలిచాయి.” హెబ్రీని విన్నపంగా గానీ, తన స్థిరత్వం గురించి కీర్తనకర్త చేసిన ప్రకటనగా గానీ అర్థం చేసుకోవచ్చు.
