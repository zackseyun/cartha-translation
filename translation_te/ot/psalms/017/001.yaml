  yaml_path: translation/ot/psalms/017/001.yaml
  text: A prayer of David. Hear[a], O Yahweh, a just cause; attend to my cry; give ear to my prayer from lips without deceit.
translation:
  language: te
  text: 'దావీదు ప్రార్థన.


    యహ్వే, న్యాయమైన వాదాన్ని ఆలకించు[a];

    నా మొరకు శ్రద్ధ చూపు;

    మోసం లేని పెదవులనుండి వచ్చే

    నా ప్రార్థనకు చెవియొగ్గు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీతిని ఆలకించు,” అంటే న్యాయమైనదాన్ని లేదా సరైనదాన్ని విను. ఇక్కడి హీబ్రూ పదం צֶדֶק (త్సెదెక్) ‘నీతి,’ ‘న్యాయం,’ లేదా ‘న్యాయమైన వాదం’ అని అర్థమివ్వగలదు; ఈ సందర్భంలో అది కీర్తనకర్త న్యాయమైన వ్యాజ్యాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: దావీదు ప్రార్థన
  rationale: కీర్తన శీర్షికలోని לְדָוִד దావీదుతో రచనాత్మక లేదా అనుబంధ సంబంధాన్ని సూచిస్తుంది. తెలుగులో ‘దావీదు ప్రార్థన’ సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: שִׁמְעָה
  choice: ఆలకించు
  rationale: శ్రద్ధగా వినాలనే ప్రత్యక్ష విజ్ఞాపనను తెలియజేస్తుంది; తరువాతి వినికిడి క్రియలతో కవితాత్మక సమాంతరతను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యనుకరణగా అందిస్తుంది.
- source_word: צֶדֶק
  choice: న్యాయమైన నా వాదాన్ని
  rationale: ఇక్కడ పదం సాధారణమైన ‘నీతి’కన్నా కీర్తనకర్త దేవుని ఎదుట ఉంచుతున్న న్యాయమైన వ్యాజ్యం లేదా వాదాన్ని సూచించే అవకాశం ఎక్కువ. హీబ్రూలో లేని ‘నా’ సందర్భార్థాన్ని తెలుగులో స్పష్టంచేస్తుంది; ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: הַקְשִׁיבָה
  choice: శ్రద్ధ చూపు
  rationale: కేవలం వినడం కాకుండా జాగ్రత్తగా గమనించాలనే హిఫిల్ ఆజ్ఞార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: רִנָּתִי
  choice: నా మొర
  rationale: విలాప-ప్రార్థన సందర్భంలో అత్యవసరమైన పిలుపు లేదా వేడుకోలును ‘మొర’ సహజంగా తెలియజేస్తుంది.
- source_word: הַאֲזִינָה
  choice: చెవియొగ్గు
  rationale: చెవి పెట్టి విను అనే హీబ్రూ రూపకాన్ని గౌరవప్రదమైన తెలుగు కవితా వాడుకలో నిలుపుతుంది.
- source_word: תְפִלָּתִי
  choice: నా ప్రార్థన
  rationale: మూలపదానికి నేరమైన అనువాదం; శీర్షికలోని ‘ప్రార్థన’తో పదసంబంధాన్ని కూడా నిలుపుతుంది.
- source_word: בְּלֹא שִׂפְתֵי מִרְמָה
  choice: మోసం లేని పెదవులనుండి వచ్చే
  rationale: ప్రార్థన వంచనలేని పెదవులనుండి వస్తోందనే భావాన్ని స్పష్టమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని సాధారణ బిరుదైన ‘ప్రభువు’గా మార్చకుండా ‘యహ్వే’ అని ధ్వన్యనుకరణ చేయడం మూలంలోని నామాన్ని నిలుపుతుంది.
- issue: צֶדֶק యొక్క న్యాయసంబంధ భావం
  choice: న్యాయమైన నా వాదం
  alternative: నీతి / న్యాయం / సరైనది
  rationale: కీర్తనకర్త తన వ్యాజ్యాన్ని దేవుడు వినాలని కోరుతున్న సందర్భంలో న్యాయమైన వాదం అనే భావం సముచితం. అయినా మూలపదం ‘నీతి’ లేదా ‘న్యాయం’ అనే అమూర్త భావాన్నీ సూచించగలదు కాబట్టి ఆ అనిశ్చితిని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా-కవితా శైలిని వాడాం. ‘ఆలకించు,’ ‘శ్రద్ధ చూపు,’ ‘చెవియొగ్గు’ అనే మూడు సమాంతర విజ్ఞాపనలు మూలంలోని వేర్వేరు వినికిడి క్రియలను సహజంగా ప్రతిబింబిస్తాయి.
