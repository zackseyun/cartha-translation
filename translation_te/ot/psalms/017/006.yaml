source:
  edition: WLC
  text: אֲנִֽי קְרָאתִ֣י/ךָ כִֽי תַעֲנֵ֣/נִי אֵ֑ל הַֽט אָזְנְ/ךָ֥ לִ֝֗/י שְׁמַ֣ע אִמְרָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/006.yaml
  text: I call on you[a], for you answer me, O God; incline your ear to me[b]; hear my words.
translation:
  language: te
  text: నేను నీకు మొరపెట్టుకుంటున్నాను[a], ఎందుకంటే నీవు నాకు జవాబిస్తావు, దేవా! నీ చెవిని నా వైపు వంచు[b]; నా మాట విను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను నీకు మొరపెట్టుకున్నాను, ఎందుకంటే నీవు నాకు జవాబిస్తావు, దేవా.” కవితాత్మక ప్రార్థనలోని హెబ్రీ క్రియారూపాలకు గతకాల, వర్తమానకాల, లేదా నమ్మకంతో కూడిన భవిష్యత్తు భావం ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “నీ చెవిని నా వైపు వంచు” అనేది శ్రద్ధగా వినమని దేవుణ్ణి కోరే హెబ్రీ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: קְרָאתִיךָ
  choice: నేను నీకు మొరపెట్టుకుంటున్నాను
  rationale: קרא అనే క్రియకు ఇక్కడ ప్రార్థనలో దేవుణ్ణి పిలవడం లేదా ఆయనకు మొరపెట్టుకోవడం అనే భావం ఉంది. హెబ్రీ పరిపూర్ణ క్రియారూపాన్ని కేవలం గతకాలానికి పరిమితం చేయకుండా, కొనసాగుతున్న ప్రత్యక్ష ప్రార్థనగా సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేసింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: కీర్తనకర్త దేవునికి మొరపెట్టుకోవడానికి గల కారణాన్ని పరిచయం చేసే causal conjunction భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: תַעֲנֵנִי
  choice: నీవు నాకు జవాబిస్తావు
  rationale: దేవుడు స్పందిస్తాడనే కీర్తనకర్త నమ్మకాన్ని తెలియజేస్తుంది. తెలుగు ‘జవాబిస్తావు’ సందర్భానుసారం సాధారణ వర్తమాన భావాన్నీ, నమ్మకంతో కూడిన భవిష్యత్తు భావాన్నీ మోయగలదు.
- source_word: אֵל
  choice: దేవా
  rationale: ప్రత్యక్ష సంబోధనను సహజమైన తెలుగు సంబోధన రూపంతో నిలుపుతుంది.
- source_word: הַט אָזְנְךָ לִי
  choice: నీ చెవిని నా వైపు వంచు
  rationale: శ్రద్ధగా వినమని కోరే హెబ్రీ రూపకాన్ని తొలగించకుండా, తెలుగులో అర్థమయ్యే విధంగా అక్షరార్థానికి సమీపంగా ఉంచింది.
- source_word: שְׁמַע
  choice: విను
  rationale: ఆజ్ఞార్థక రూపంలోని ప్రత్యక్ష విజ్ఞప్తిని నిలుపుతుంది; ముందున్న చెవి వంచే రూపకంతో సమాంతరతను కూడా కాపాడుతుంది.
- source_word: אִמְרָתִי
  choice: నా మాట
  rationale: WLC పాఠంలోని ఏకవచన రూపం ‘నా పలుకు/నా మాట’ను అనుసరించి ‘నా మాట’గా అనువదించింది. ఇది కీర్తనకర్త పలికే విజ్ఞప్తిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
