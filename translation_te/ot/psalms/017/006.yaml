  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే ప్రార్థనా కవిత్వానికి తగిన గౌరవభరితమైన ప్రత్యక్ష సంబోధనతో అనువదించబడింది. మూలంలోని క్రియాకాల అస్పష్టతను పాదటిప్పణిలో నిలిపి, ‘చెవిని వంచు’ అనే రూపకాన్ని ప్రధాన పాఠంలో ఉంచింది.
