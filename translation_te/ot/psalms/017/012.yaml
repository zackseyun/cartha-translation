translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ప్రత్యక్ష ఉపమానాన్ని వాడుతూ, కీర్తనలోని సజీవమైన వేటమృగ చిత్రణను నిలిపాం. ‘కూర్చున్న’ అనే మూలానికి దగ్గరైన పదాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సందర్భానుగుణమైన ‘మాటువేసి ఉన్న’ భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
