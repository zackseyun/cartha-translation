revisions:
- from: అతడు చీల్చివేయాలని తహతహలాడే సింహంలా ఉన్నాడు; చాటుస్థలాల్లో కూర్చున్న కొదమ సింహంలా ఉన్నాడు.[a]
  to: అతడు చీల్చివేయాలని తహతహలాడే సింహంలా ఉన్నాడు; దాగి ఉన్న చోట్ల కూర్చున్న యువ సింహంలా ఉన్నాడు.[a]
  rationale: 'The revision makes two safe lexical adjustments for modern standard Telugu: ‘చాటుస్థలాల్లో’ becomes ‘దాగి ఉన్న చోట్ల,’ preserving the Hebrew plural ‘hiding places,’ and ‘కొదమ సింహం’ becomes ‘యువ సింహం,’ a clear contemporary rendering of כְּפִיר. The main text continues to render יֹשֵׁב literally as ‘కూర్చున్న’; the ambush nuance remains appropriately in the footnote.'
