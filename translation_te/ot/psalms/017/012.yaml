source:
  edition: WLC
  text: דִּמְיֹנ֗/וֹ כְּ֭/אַרְיֵה יִכְס֣וֹף לִ/טְר֑וֹף וְ֝/כִ/כְפִ֗יר יֹשֵׁ֥ב בְּ/מִסְתָּרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/012.yaml
  text: He is like a lion eager to tear[c][b][a], like a young lion sitting in hiding places.
translation:
  language: te
  text: అతడు చీల్చివేయాలని తహతహలాడే సింహంలా ఉన్నాడు; దాగి ఉన్న చోట్ల కూర్చున్న యువ సింహంలా ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దాగి ఉన్న చోట్ల మాటువేసి ఉన్న యువ సింహంలా’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం అక్షరార్థంగా ‘కూర్చున్న’ అని ఉన్నా, ఈ సందర్భంలో అది ఆకస్మిక దాడికోసం మాటువేసి ఉండడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּמְיֹנוֹ כְּאַרְיֵה
  choice: అతడు ... సింహంలా ఉన్నాడు
  rationale: హీబ్రూ నామవాచక నిర్మాణం అక్షరార్థంగా ‘అతని పోలిక సింహంలా’ అని ఉన్నా, తెలుగులో అది అనవసర పునరుక్తిగా వినిపిస్తుంది. ప్రత్యక్ష ఉపమానం మూల భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יִכְסוֹף
  choice: తహతహలాడే
  rationale: ఈ క్రియ బలమైన కోరికను సూచిస్తుంది. వేటాడే సింహం సందర్భంలో ‘తహతహలాడే’ అనే మాట ఆ తీవ్ర ఆకాంక్షను స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: לִטְרוֹף
  choice: చీల్చివేయాలని
  rationale: טרף వేటమృగం తన ఎరను పట్టుకొని చీల్చే భావాన్ని ఇస్తుంది. ‘చీల్చివేయడం’ సింహపు వేట చిత్రణను సజీవంగా నిలుపుతుంది.
- source_word: וְכִכְפִיר
  choice: కొదమ సింహంలా
  rationale: כפיר యౌవనంలోని సింహాన్ని సూచిస్తుంది. ‘కొదమ సింహం’ ఆధునిక ప్రామాణిక తెలుగులో ఈ జంతు చిత్రణకు సంక్షిప్తమైన, గౌరవప్రదమైన పదబంధం.
- source_word: יֹשֵׁב
  choice: కూర్చున్న
  rationale: మూలంలోని క్రియారూపానికి ‘కూర్చున్న’ అనేది సన్నిహితమైన అర్థం. సందర్భం మాటువేసి ఉండడాన్ని సూచించినా, ఆ వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో కలపకుండా మూల చిత్రాన్ని నిలిపింది.
- source_word: בְּמִסְתָּרִים
  choice: చాటుస్థలాల్లో
  rationale: ఈ బహువచన నామవాచకం దాగి ఉండే లేదా కనబడని ప్రదేశాలను సూచిస్తుంది. ‘చాటుస్థలాల్లో’ బహువచన భావాన్నీ, ఆకస్మిక దాడికి అనువైన మరుగున ప్రదేశాల భావాన్నీ సహజంగా అందిస్తుంది.
