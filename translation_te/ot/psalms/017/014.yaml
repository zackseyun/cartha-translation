source:
  edition: WLC
  text: מִֽ/מְתִ֥ים יָדְ/ךָ֨ יְהוָ֡ה מִֽ/מְתִ֬ים מֵ/חֶ֗לֶד חֶלְקָ֥/ם בַּֽ/חַיִּים֮ ו/צפינ/ך תְּמַלֵּ֪א בִ֫טְנָ֥/ם יִשְׂבְּע֥וּ בָנִ֑ים וְ/הִנִּ֥יחוּ יִ֝תְרָ֗/ם לְ/עוֹלְלֵי/הֶֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/014.yaml
  text: from men by your hand[a], O Yahweh, from men of the world, whose portion is in this life. You fill their belly with your stored-up treasure; they are satisfied with sons[c][b], and they leave their abundance to their children.
translation:
  language: te
  text: 'నీ చేతితో మనుష్యులనుండి నన్ను రక్షించు[a], యాహ్వే,

    ఈ లోకపు మనుష్యులనుండి—

    ఈ జీవితంలో తమ వంతు ఉన్నవారినుండి.


    నీవు దాచివుంచిన సంపదతో వారి కడుపులు నింపుతావు;

    వారు కుమారులతో తృప్తి పొందుతారు[b],

    తమ సమృద్ధిని తమ పసిపిల్లలకు[c] విడిచిపెడతారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ వాక్యనిర్మాణం చాలా సంక్షిప్తంగా ఉంది. దీన్ని ‘మనుష్యులనుండి—నీ చేతితో’ లేదా ‘నీ చేతికి చెందిన మనుష్యులనుండి’ అని కూడా అన్వయించవచ్చు. ‘నన్ను రక్షించు’ అనే క్రియ ముందటి వచనం నుండి భావానుసారంగా తీసుకోబడింది.
    reason: alternative_reading
  - marker: b
    text: హెబ్రీలో ‘కుమారులు.’ ఈ పదబంధాన్ని ‘వారి కుమారులు తృప్తి పొందుతారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: హెబ్రీ పదం ప్రత్యేకంగా చిన్న పిల్లలను లేదా పసిపిల్లలను సూచిస్తుంది.
    reason: lexical_nuance
lexical_decisions:
- source_word: מִמְתִים
  choice: మనుష్యులనుండి
  rationale: సందర్భంలో ఇది చనిపోయినవారిని కాదు, కీర్తనకర్తను ఎదిరించే మానవులను సూచిస్తుంది. מִן ఉపసర్గను ముందటి వచనంలోని రక్షణ విన్నపంతో కలిపి అర్థం చేసుకున్నాం.
- source_word: יָדְךָ
  choice: నీ చేతితో
  rationale: దేవుని చేయి సాధనంగా లేదా కార్యసాధక శక్తిగా ఉన్న భావాన్ని నిలుపుతుంది; అయితే హెబ్రీ వాక్యనిర్మాణం మరొక విధంగా కూడా అర్థం కావచ్చు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హెబ్రీ వ్యక్తిగత నామానికి తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: מֵחֶלֶד
  choice: ఈ లోకపు
  rationale: ఇక్కడ חֶלֶד తాత్కాలిక మానవ జీవితపు లోకాన్ని సూచిస్తుంది; నైరూప్య విశ్వాన్ని కాదు.
- source_word: חֶלְקָם בַּחַיִּים
  choice: ఈ జీవితంలో తమ వంతు ఉన్నవారు
  rationale: ప్రస్తుత జీవితంలో వారికి దక్కిన భాగాన్ని తెలియజేస్తుంది; భవిష్యత్తు తీర్పు గురించి వచనం స్పష్టంగా చెప్పనిదాన్ని అనువాదం చేర్చదు.
- source_word: וצפינך
  choice: నీవు దాచివుంచిన సంపద
  rationale: మూలపదంలోని దాచినది లేదా నిల్వచేసినది అనే భావాన్ని, సమృద్ధి సందర్భానికి సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תמלא בטנם
  choice: వారి కడుపులు నింపుతావు
  rationale: בטן యొక్క స్పష్టమైన శరీరరూపకాన్ని నిలుపుతూ, సమృద్ధిగా పోషించబడుతున్న భావాన్ని తెలియజేస్తుంది.
- source_word: ישבעו בנים
  choice: వారు కుమారులతో తృప్తి పొందుతారు
  rationale: దుష్టులకున్న అనేక మంది మగ సంతానం వారి సౌభాగ్య సూచనగా భావించే పఠనాన్ని అనుసరిస్తుంది. పదబంధం ‘వారి కుమారులు తృప్తి పొందుతారు’ అని కూడా అర్థం కావచ్చు; ఆ అస్పష్టతను పాదసూచికలో ఉంచాం.
- source_word: והניחו יתרם
  choice: తమకు మిగిలినదాన్ని విడిచిపెడతారు
  rationale: יֶתֶר మిగులు, శేషం లేదా సమృద్ధిలో మిగిలిన భాగాన్ని సూచిస్తుంది; తెలుగు వాక్యం ఆ విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: לעולליהם
  choice: తమ పసిపిల్లలకు
  rationale: עוֹלֵל సాధారణంగా చిన్న పిల్లవాడిని సూచిస్తుంది; అందువల్ల సాధారణ ‘పిల్లలు’ కంటే మూలంలోని వయస్సు ఛాయను ప్రధాన పాఠ్యంలోనే నిలిపాం.
theological_decisions:
- issue: విరోధులకు దేవుని చేతితో ఉన్న సంబంధం
  choice: ‘నీ చేతితో ... నన్ను రక్షించు’ అని అనువదించి దేవుని కార్యసాధకతను సూచించాం.
  alternative: ‘నీ చేతికి చెందిన మనుష్యులనుండి’ లేదా ‘మనుష్యులనుండి—నీ చేతితో’
  rationale: హెబ్రీ నిర్మాణం సంక్షిప్తంగా ఉండి అనేక అన్వయాలకు వీలు ఇస్తుంది. ప్రధాన పాఠ్యం దేవుని సార్వభౌమ కార్యాన్ని సూచించినా, ఆ మనుష్యులు తీర్పు సాధనాలే అని నిర్దిష్టంగా చెప్పదు.
- issue: దుష్టుల ప్రస్తుతకాల సౌభాగ్యం
  choice: వారి వంతు ఈ జీవితంలో ఉందని మాత్రమే తెలిపాం.
  alternative: ‘వారి భాగం సజీవుల మధ్య ఉంది’
  rationale: ప్రస్తుత సౌభాగ్యానికి, కీర్తనకర్త ఆశకు మధ్యనున్న ఉద్రిక్తతను నిలుపుతూ, వచనం స్వయంగా వివరించని పరలోక నిర్ణయాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- issue: ישבעו בנים లో కర్త-కర్మ అస్పష్టత
  choice: దుష్టులు కుమారులతో తృప్తి పొందుతారని ప్రధాన పాఠ్యంలో ఇచ్చాం.
  alternative: ‘వారి కుమారులు తృప్తి పొందుతారు’
  rationale: వ్యంజన పాఠం రెండు అన్వయాలకు అవకాశమిస్తుంది. సంతాన సమృద్ధి అనే సందర్భానుకూల పఠనాన్ని ఎంచుకుని, ప్రత్యామ్నాయాన్ని పాదసూచికలో స్పష్టంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనా కవిత్వానికి తగిన గంభీరతతో సరళమైన పంక్తి విభజన వాడబడింది. ‘యాహ్వే’ అని దైవనామాన్ని లిప్యంతరీకరించాం. ‘కడుపులు నింపుతావు’ అనే మూలంలోని స్పష్టమైన రూపకాన్ని సహజంగా నిలిపాం; అనిశ్చిత హెబ్రీ అన్వయాలను పాదసూచికల్లో వెల్లడించాం.
