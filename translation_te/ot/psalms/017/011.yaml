source:
  edition: WLC
  text: אַ֭שֻּׁרֵי/נוּ עַתָּ֣ה סבבו/ני עֵינֵי/הֶ֥ם יָ֝שִׁ֗יתוּ לִ/נְט֥וֹת בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/011.yaml
  text: They have now surrounded our steps[c][b][a]; they set their eyes to cast us down to the ground.
translation:
  language: te
  text: మా అడుగుల వెంట ఇప్పుడు వారు నన్ను చుట్టుముట్టారు[a]; [నన్ను] నేలకు పడదోయాలని వారు తమ చూపును నిలిపారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో అక్షరార్థంగా, ‘మా అడుగులు—ఇప్పుడు వారు నన్ను చుట్టుముట్టారు’ అని ఉంది; ఇక్కడ బహువచనం నుండి ఏకవచనానికి మార్పు జరుగుతుంది.
    reason: textual_ambiguity
  - marker: b
    text: హీబ్రూలో ‘పడదోయడానికి/వంచడానికి’ అనే క్రియకు కర్మ స్పష్టంగా లేదు. సందర్భాన్ని బట్టి [నన్ను] అని పూరించబడింది. మరో విధంగా, ‘వారు తమ కళ్లను నేలవైపు వంచారు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשֻּׁרֵינוּ
  choice: మా అడుగుల వెంట
  rationale: ఈ పదానికి ‘మా అడుగులు/అడుగుజాడలు’ అని అర్థం. తరువాతి క్రియలో ఉన్న ‘నన్ను’ అనే ఏకవచన ప్రత్యయాన్ని నిలుపుతూ, దీనిని క్రియకు నేర కర్మగా కాక సందర్భాన్ని సూచించే పదబంధంగా అనువదించాం.
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: ప్రస్తుతం ఎదురవుతున్న ప్రమాదాన్ని సూచించే సాధారణ కాలవాచక క్రియావిశేషణం.
- source_word: סבבוני
  choice: వారు నన్ను చుట్టుముట్టారు
  rationale: క్రియకు జతైన మొదటి పురుష ఏకవచన ప్రత్యయం స్పష్టంగా ‘నన్ను’ అని ఉంది; మూలంలోని ‘మా’ నుండి ‘నన్ను’కు మార్పును సవరించకుండా నిలిపాం.
- source_word: עֵינֵיהֶם יָשִׁיתוּ
  choice: వారు తమ చూపును నిలిపారు
  rationale: అక్షరార్థంగా ‘వారు తమ కళ్లను ఉంచారు.’ ఆధునిక తెలుగులో సహజంగా ఉండేలా, శత్రువుల స్థిరమైన దృష్టి మరియు ఉద్దేశాన్ని తెలిపే ‘చూపును నిలిపారు’ అని ఇచ్చాం.
- source_word: לִנְטוֹת בָּאָרֶץ
  choice: నన్ను నేలకు వంగదోయాలని
  rationale: נטה అనే క్రియకు వంచడం/వాల్చడం అనే భావం ఉంది. ఈ శత్రుత్వ సందర్భంలో కీర్తనకర్తను నేలకు పడదోయాలనే ఉద్దేశంగా అనువదించాం; అయితే మూలంలో కర్మ స్పష్టంగా లేకపోవడం వల్ల ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: ‘మా అడుగులు’ అనే బహువచన సూచన నుండి ‘నన్ను’ అనే ఏకవచనానికి మార్పు
  choice: మూలంలోని సర్వనామ మార్పును అలాగే నిలపడం
  alternative: ‘మా అడుగులను చుట్టుముట్టారు’ లేదా ‘మమ్మల్ని చుట్టుముట్టారు’ అని సాఫీ చేయడం
  rationale: మసొరా పాఠంలో ‘మా అడుగులు’తో పాటు క్రియపై స్పష్టమైన ‘నన్ను’ ప్రత్యయం ఉంది. దీనిని సమూహార్థంగా సరిచేయడం మూలంలోని కవితాత్మక ఉద్రిక్తతను తొలగిస్తుంది.
- issue: చివరి పదబంధంలో వంచబడేది ఎవరు లేదా ఏమిటి?
  choice: సందర్భానుసారం ‘నన్ను’ అనే కర్మను పాఠ్యంలో పూరించడం
  alternative: ‘తమ కళ్లను నేలవైపు వంచారు’
  rationale: శత్రువులు చుట్టుముట్టిన సందర్భం కీర్తనకర్తను నేలకు వంగదోయాలనే ఉద్దేశానికి మద్దతిస్తుంది; అయినా హీబ్రూ వాక్యంలో కర్మ వ్యక్తంగా లేకపోవడంతో ప్రత్యామ్నాయ నిర్మాణాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కవితా శైలిని పాటించాం. ‘మా … నన్ను’ అనే అసాధారణ మార్పును సహజీకరించకుండా మూలపాఠానికి అనుగుణంగా ఉంచాం; ‘చూపును నిలిపారు’ అనే ప్రయోగం అక్షరార్థ చిత్రాన్ని సహజ తెలుగులో అందిస్తుంది.
