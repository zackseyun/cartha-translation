revisions:
- from: మా అడుగుల వెంట ఇప్పుడు వారు నన్ను చుట్టుముట్టారు[a]; నన్ను నేలకు వంగదోయాలని వారు తమ చూపును నిలిపారు[b].
  to: మా అడుగుల వెంట ఇప్పుడు వారు నన్ను చుట్టుముట్టారు[a]; [నన్ను] నేలకు పడదోయాలని వారు తమ చూపును నిలిపారు[b].
  rationale: The revision keeps the Hebrew’s difficult ‘our … me’ pronoun shift rather than smoothing it into a plural reference. In the final clause it uses idiomatic Telugu for the adversarial aim, while square brackets and the footnote make clear that the singular object is contextually supplied, not explicitly present in the Hebrew.
