id: PSA.17.2
reference: Psalms 17:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִ֭/לְּ/פָנֶי/ךָ מִשְׁפָּטִ֣/י יֵצֵ֑א עֵ֝ינֶ֗י/ךָ תֶּחֱזֶ֥ינָה מֵישָׁרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/002.yaml
  text: May my judgment come forth from before you[b][a]; may your eyes behold what is upright.
translation:
  language: te
  text: నీ సన్నిధి నుండి నా తీర్పు వెలువడుగాక[a]; నీ కళ్లు న్యాయమైనదానిని చూడుగాక[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ సన్నిధి నుండి నాకు న్యాయం కలుగుగాక” లేదా “నీ సన్నిధి నుండి నా నిర్దోషిత్వాన్ని ప్రకటించే తీర్పు వెలువడుగాక.”
    reason: alternative_reading
  - marker: b
    text: లేదా, “సమన్యాయాన్ని” లేదా “సరైనదానిని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּפָנֶיךָ
  choice: నీ సన్నిధి నుండి
  rationale: దేవుని ముఖం ఎదుటనుండి లేదా ఆయన సమక్షం నుండి అనే స్థలసంబంధమైన న్యాయస్థాన చిత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מִשְׁפָּטִי
  choice: నా తీర్పు
  rationale: ఈ పదం తీర్పు, న్యాయం, వ్యాజ్యం లేదా నిర్దోష నిర్ధారణను సూచించగలదు. ‘నా తీర్పు’ మూలంలోని సంక్షిప్తతను, న్యాయసంబంధమైన అనిశ్చితిని కాపాడుతుంది.
- source_word: יֵצֵא
  choice: వెలువడుగాక
  rationale: ‘బయటికి రావడం/వెళ్లడం’ అనే మూలభావాన్ని తీర్పు దేవుని సన్నిధి నుండి జారీ అవుతున్న చిత్రానికి తగిన గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עֵינֶיךָ
  choice: నీ కళ్లు
  rationale: దైవ పరిశీలనను సూచించే స్పష్టమైన మానవరూపక కవితా చిత్రాన్ని అమూర్తీకరించకుండా అలాగే ఉంచుతుంది.
- source_word: תֶּחֱזֶינָה
  choice: చూడుగాక
  rationale: శ్రద్ధగా చూడడం లేదా తిలకించడం అనే భావాన్ని సందర్భంలో సహజంగా అందిస్తూ, సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: מֵישָׁרִים
  choice: న్యాయమైనదాన్ని
  rationale: నిటారుతనం, యథార్థత, సమన్యాయం లేదా సరైనది అనే నైతిక-న్యాయ భావవిస్తృతిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఈ వాక్యాన్ని నిశ్చయ ప్రకటనగా అనువదించాలా, ప్రార్థనాత్మక విన్నపంగా అనువదించాలా
  choice: ‘వెలువడుగాక ... చూడుగాక’ అనే విన్నపం
  alternative: ‘వెలువడుతుంది ... చూస్తాయి’ అనే భవిష్యత్/నిశ్చయ ప్రకటన
  rationale: హీబ్రూ అసంపూర్ణ క్రియారూపాలు సాధారణ భవిష్యత్తును కూడా సూచించగలిగినా, చుట్టుపక్కల ఉన్న ప్రార్థనా సందర్భంలో దేవునికి చేసే విన్నపాలుగా సహజంగా పనిచేస్తాయి. ‘గాక’ రూపం ఈ ప్రార్థనా స్వరాన్ని చూపుతూ, వ్యాకరణం అనుమతించేదానికంటే అధిక నిశ్చయాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తన ప్రార్థనకు తగిన గౌరవప్రదమైన కవితా శైలిని ఉపయోగించాం. ‘సన్నిధి,’ ‘వెలువడుగాక’ వంటి పదాలు మూలంలోని రాజసభ/న్యాయస్థాన చిత్రాన్ని నిలుపుతాయి; వాక్యం సాధారణ పాఠకుడికి అర్థమయ్యేంత సరళంగా ఉంచబడింది.
