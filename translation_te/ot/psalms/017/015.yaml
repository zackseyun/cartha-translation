    నేను మేల్కొన్నప్పుడు[a] నీ స్వరూపంతో[b] తృప్తి చెందుతాను.'
  rationale: The revision removes the explicit “చూసి,” retaining the Hebrew construction in which satisfaction is associated directly with God's likeness. It also adjusts footnote b so that it offers true lexical substitutions for “స్వరూపంతో.” The main text continues to leave the nature of the awakening unspecified.
