  yaml_path: translation/ot/psalms/017/015.yaml
  text: As for me[a], in righteousness I will behold your face; when I awake[b], I will be satisfied with your likeness.
translation:
  language: te
  text: 'నేనైతే నీతిలో నీ ముఖాన్ని దర్శిస్తాను;

    నేను మేల్కొన్నప్పుడు[a] నీ స్వరూపంతో[b] తృప్తి చెందుతాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మేల్కొన్నప్పుడు’ అనేది సాధారణంగా నిద్రనుంచి మేల్కొనడాన్ని గానీ, అంతిమ సమర్థన లేదా పునరుత్థానంలో మేల్కొనడాన్ని గానీ సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘నీ రూపంతో,’ ‘నీ ప్రతిరూపంతో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֶדֶק
  choice: నీతిలో
  rationale: צֶדֶק అంటే సాధారణంగా నీతి లేదా న్యాయం. ఇక్కడ ב ఉపసర్గతో ఉన్న పదబంధాన్ని ‘నీతిలో’ అని ఉంచడం ద్వారా అది కీర్తనకర్త నీతిని సూచిస్తుందా, దేవుని న్యాయపూర్వక సమర్థనను సూచిస్తుందా అనే విషయాన్ని అనవసరంగా నిర్ణయించకుండా హీబ్రూ సంక్షిప్తతను కాపాడుతుంది.
- source_word: אֶחֱזֶה
  choice: దర్శిస్తాను
  rationale: חזה కేవలం చూడడం కంటే శ్రద్ధగా, గ్రహింపుతో చూడడం అనే భావాన్ని కలిగి ఉండవచ్చు. ‘దర్శిస్తాను’ కవితాత్మకమైన, గంభీరమైన భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: פָנֶיךָ
  choice: నీ ముఖాన్ని
  rationale: హీబ్రూలో అక్షరార్థంగా ‘నీ ముఖం’ ఉంది. ‘నీ సన్నిధి’ అనే భావం అంతర్లీనంగా ఉండవచ్చుగానీ, ప్రధాన పాఠ్యంలో స్పష్టమైన మూలరూపాన్ని నిలిపాం.
- source_word: אֶשְׂבְּעָה
  choice: తృప్తి చెందుతాను
  rationale: שׂבע అనే క్రియ నిండడం లేదా తృప్తి చెందడం అని అర్థం. ‘తృప్తి చెందుతాను’ ఆధునిక తెలుగులో సహజంగా ఉండి, మూలంలోని సంపూర్ణ సంతృప్తి భావాన్ని అందిస్తుంది.
- source_word: בְּהָקִיץ
  choice: నేను మేల్కొన్నప్పుడు
  rationale: ב తో కూడిన క్రియానామ రూపం కాలాన్ని సూచిస్తుంది. ‘నేను మేల్కొన్నప్పుడు’ అనేది సాధారణ నిద్రనుంచి మేల్కొనడానికీ, అంతిమ మేల్కొలుపు అనే సాధ్యమైన భావానికీ చోటిస్తుంది.
- source_word: תְּמוּנָתֶךָ
  choice: నీ స్వరూపాన్ని చూసి
  rationale: תְּמוּנָה అంటే రూపం, స్వరూపం లేదా ప్రతిరూపం. తెలుగులో ‘స్వరూపంతో తృప్తి చెందుతాను’ అనడం అసహజంగా ఉండటంతో, సంబంధాన్ని సహజంగా వ్యక్తం చేయడానికి ‘నీ స్వరూపాన్ని చూసి’ అని అనువదించాం; ఇది నిర్దిష్టమైన భౌతిక ఆకారాన్ని బలవంతంగా ఆపాదించదు.
theological_decisions:
- issue: בְּהָקִיץ సాధారణంగా నిద్రనుంచి మేల్కొనడాన్ని సూచిస్తుందా, లేక పునరుత్థానం లేదా మరణానంతర సమర్థన నిరీక్షణను సూచిస్తుందా?
  choice: ప్రధాన పాఠ్యంలో మేల్కొలుపు స్వభావాన్ని నిర్దిష్టం చేయకుండా ‘నేను మేల్కొన్నప్పుడు’ అని ఉంచాం.
  alternative: దీనిని రోజువారీ నిద్రనుంచి మేల్కొనడంగా లేదా అంతిమ సమర్థన/పునరుత్థానంలోని మేల్కొలుపుగా అర్థం చేసుకోవచ్చు.
  rationale: హీబ్రూ పదబంధం ఏ భావాన్ని ఉద్దేశించిందో స్పష్టంగా నిర్దేశించదు. అందువల్ల వేదాంతపరమైన ఉద్వేగాన్ని పరిష్కరించకుండా ప్రధాన పాఠ్యంలో అస్పష్టతను నిలిపి, సాధ్యమైన అర్థాలను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే భాషను వాడాం. ‘దర్శిస్తాను’ ధ్యానపూర్వకంగా చూడడం అనే భావాన్ని ఇస్తుంది; రెండవ పాదంలో సహజమైన తెలుగు వాక్యనిర్మాణం కోసం ‘చూసి’ని స్పష్టీకరించాం. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల వెంట ఉంచాం.
