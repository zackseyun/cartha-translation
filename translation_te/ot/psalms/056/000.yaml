source:
  edition: WLC
  text: לַ/מְנַצֵּ֤חַ עַל י֬וֹנַת אֵ֣לֶם רְ֭חֹקִים לְ/דָוִ֣ד מִכְתָּ֑ם בֶּֽ/אֱחֹ֨ז אֹת֖/וֹ פְלִשְׁתִּ֣ים בְּ/גַֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/000.yaml
  text: 'For the choir director: according to “The Silent Dove of Distant Places.” Of David[a]. A miktam[b], when the Philistines seized him in Gath.'
translation:
  language: te
  text: 'సంగీత నాయకునికి: “దూర ప్రాంతాల మౌన పావురం” అనే రాగం ప్రకారం.[a] దావీదుకు సంబంధించిన ఒక మిక్తాము.[b] ఫిలిష్తీయులు అతణ్ణి గాతులో పట్టుకున్నప్పుడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధాన్ని అక్షరార్థంగా “దూర ప్రాంతాల మౌన పావురం” అని అనువదించవచ్చు; ఇది బహుశా ఒక రాగం లేదా గీతం పేరు. దీని ఖచ్చితమైన అర్థం తెలియదు.
    reason: alternative_reading
  - marker: b
    text: “మిక్తాము” అనేది కీర్తనల శీర్షికల్లో ఉపయోగించిన సాంకేతిక పదం; దాని ఖచ్చితమైన అర్థం తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకునికి
  rationale: కీర్తనల శీర్షికల్లో సంగీత ప్రదర్శనను పర్యవేక్షించే వ్యక్తిని సూచించే సూత్రప్రాయ పదబంధం. ఆధునిక తెలుగులో సహజంగా, విస్తృతార్థంతో ఉంటుంది.
- source_word: עַל
  choice: అనే రాగం ప్రకారం
  rationale: ఇక్కడ తరువాత వచ్చే అస్పష్టమైన సంగీత శీర్షిక లేదా రాగాన్ని పరిచయం చేస్తుందని సందర్భం సూచిస్తుంది.
- source_word: יוֹנַת אֵלֶם רְחֹקִים
  choice: “దూర ప్రాంతాల మౌన పావురం”
  rationale: ఈ పదబంధం బహుశా ఒక రాగం లేదా గీతం పేరు. אֵלֶם లోని మౌనం/మూగతనం భావాన్నీ, רְחֹקִים లోని దూరం భావాన్నీ నిలుపుతూ, దాని అనిశ్చితిని ఉద్ధరణ చిహ్నాలతో సూచించాం.
- source_word: לְדָוִד
  choice: దావీదుకు సంబంధించినది
  rationale: లְ ఉపసర్గ రచయిత, అంకితం, అనుబంధం వంటి భావాలకు వీలు ఇస్తుంది. కేవలం ‘దావీదు రచించినది’ అని నిర్ధారించకుండా మూలంలోని విస్తృతిని కాపాడుతుంది.
- source_word: מִכְתָּם
  choice: మిక్తాము
  rationale: కీర్తనల శీర్షికల్లో కనిపించే, ఖచ్చితమైన అర్థం తెలియని సాంకేతిక పదం కాబట్టి ఊహాత్మకంగా అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: בֶּאֱחֹז אֹתוֹ
  choice: అతణ్ణి ... పట్టుకున్నప్పుడు
  rationale: בְּ తో కూడిన క్రియారూపం సందర్భకాలాన్ని సూచిస్తుంది; אחז లోని పట్టుకోవడం/నిర్బంధించడం భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: פְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ఈ జాతిపేరుకు ప్రామాణిక తెలుగు రూపం.
- source_word: בְּגַת
  choice: గాతులో
  rationale: స్థలాన్ని సూచించే בְּ ఉపసర్గకు సహజమైన తెలుగు స్థానవిభక్తి రూపం.
theological_decisions:
- issue: కీర్తన శీర్షిక స్వభావం
  choice: సంగీత, దావీదు సంబంధిత, చారిత్రక వివరాలతో సహా శీర్షికను వచనంలో భాగంగా అనువదించడం; అస్పష్ట సాంకేతిక పదాన్ని అలాగే ఉంచడం.
  alternative: దీనిని అనువదించని సంపాదకీయ సమాచారంగా చూడడం, లేదా ‘మిక్తాము’కు ‘సువర్ణ కీర్తన’ వంటి ఊహాత్మక అర్థం ఇవ్వడం.
  rationale: హీబ్రూ పాఠంలో ఇది కీర్తన శీర్షికగా ఉంది. మూలంలోని సమాచారాన్ని నిలుపుతూ, అస్పష్ట పదాలకు సిద్ధాంతపరమైన లేదా చారిత్రకమైన అతివ్యాఖ్యానం ఇవ్వకుండా అనువదించాం.
- issue: לְדָוִד యొక్క సంబంధం
  choice: ‘దావీదుకు సంబంధించినది’ అని అనువదించి రచన, అంకితం లేదా అనుబంధం మధ్య ఉన్న మూలభాషా విస్తృతిని నిలుపడం.
  alternative: ‘దావీదు రచించినది’ అని స్పష్టంగా రచయితత్వాన్ని నిర్ణయించడం.
  rationale: హీబ్రూ לְ అనేక సంబంధాలను సూచించగలదు; ఈ శీర్షిక ఒక్కటే వాటిలో ఒకదాన్ని తప్పనిసరిగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన కీర్తన శీర్షిక శైలిని వాడాం. అస్పష్టమైన సంగీత శీర్షికను ఉద్ధరణ చిహ్నాల్లో ఉంచి, ‘మిక్తాము’ను లిప్యంతరీకరించాం. అన్ని పాదటిప్పణి గుర్తులు సంబంధిత ప్రధాన పాఠ్య భాగాల వెంట ఉంచబడ్డాయి.
