  text: In God I will praise the word[a]; in Yahweh I will praise the word.
translation:
  language: te
  text: దేవునిలో నేను వాక్యాన్ని స్తుతిస్తాను[a]; యాహ్వేలో నేను వాక్యాన్ని స్తుతిస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: రెండు పాదాల్లోనూ ‘వాక్యం’కు బదులుగా ‘వాగ్దానం’ అని కూడా అనువదించవచ్చు; హీబ్రూ דָּבָר అనే పదానికి సందర్భాన్ని బట్టి ‘మాట,’ ‘విషయం,’ లేదా ‘వాగ్దానం’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: దేవునిలో
  rationale: בְּ ఉపసర్గను ఇక్కడ దేవునితో సంబంధాన్ని సూచించే ‘లో’గా ఉంచడం ద్వారా రెండవ పాదంలోని בַּיהוָהతో ఉన్న సమాంతర నిర్మాణం నిలుస్తుంది.
- source_word: אֲהַלֵּל
  choice: నేను స్తుతిస్తాను
  rationale: הלל పీయేల్ అసంపూర్ణ రూపం 1 ఏకవచనం ఇక్కడ కీర్తనకర్త సంకల్పాన్ని తెలియజేస్తుంది; అందువల్ల భవిష్యత్/సంకల్ప భావంతో అనువదించబడింది.
- source_word: דָּבָר
  choice: వాక్కును
  rationale: דָּבָר కు ‘మాట,’ ‘విషయం,’ సందర్భానుసారం ‘వాగ్దానం’ అనే అర్థాలు ఉండవచ్చు. మూలంలోని పదరూపాన్ని, రెండు పాదాల పునరుక్తిని కాపాడుతూ ‘వాక్కు’ ఎంచుకోబడింది.
- source_word: בַּיהוָה
  choice: యెహోవాలో
  rationale: בְּ ఉపసర్గకు సమాంతరంగా ‘లో’ వాడబడింది; יהוה అనే దైవనామం తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా నిలిపి, ఆధునిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా తెలిసిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: స్తుతికి కర్మగా דָּבָר భావం
  choice: వాక్కు
  alternative: వాగ్దానం
  rationale: సందర్భంలో దేవుని వాగ్దానం ఉద్దేశించబడి ఉండవచ్చు; అయితే మూలపదంలోని విస్తృత భావాన్ని సంకుచితం చేయకుండా ప్రధాన పాఠంలో ‘వాక్కు’ ఉంచి, ‘వాగ్దానం’ను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తనా కవిత్వానికి తగిన గంభీరతను నిలిపాం. మూలంలోని రెండు సమాంతర పాదాలు, ‘స్తుతిస్తాను’ మరియు ‘వాక్కు’ అనే పునరుక్తులు యథాతథంగా పరిరక్షించబడ్డాయి.
