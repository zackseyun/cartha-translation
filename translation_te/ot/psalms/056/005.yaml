  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే కీర్తన గంభీరతను నిలుపుకునేలా రూపొందించబడింది. మూలంలోని రెండు సమాంతర భాగాలు మరియు శత్రుత్వ భావం కాపాడబడ్డాయి.
