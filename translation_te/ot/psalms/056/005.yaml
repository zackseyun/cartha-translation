source:
  edition: WLC
  text: כָּל הַ֭/יּוֹם דְּבָרַ֣/י יְעַצֵּ֑בוּ עָלַ֖/י כָּל מַחְשְׁבֹתָ֣/ם לָ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/005.yaml
  text: All day long they twist my words[c][b][a]; all their thoughts are against me for evil.
translation:
  language: te
  text: రోజంతా వారు నా మాటలను వక్రీకరిస్తారు[a]; వారి ఆలోచనలన్నీ నాకు విరోధంగా, కీడు చేయడానికే ఉంటాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా మాటలను బాధపెడతారు/గాయపరుస్తారు.” ఇక్కడి హీబ్రూ క్రియ కఠినమైనది; అది బాధ కలిగించడం, హాని చేయడం, లేదా వక్రీకరించడం అనే భావాలను ఇవ్వవచ్చు. ఈ సందర్భంలో మాటలను శత్రుత్వంతో వక్రీకరించడం అనే భావం బాగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారి పథకాలన్నీ నాకు కీడు చేయడానికే ఉన్నాయి.” హీబ్రూ పదం ‘ఆలోచనలు’ లేదా ‘పథకాలు’ అని అర్థమివ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: రోజంతా
  rationale: రోజు పొడవునా నిరంతరంగా జరుగుతున్న చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: דְּבָרַי
  choice: నా మాటలను
  rationale: דָּבָר అనే పదానికి ‘మాటలు,’ ‘విషయాలు,’ ‘వ్యవహారాలు’ అనే అర్థాలు ఉండవచ్చు; ఇక్కడ శత్రువులు వక్రీకరించేది కీర్తనకర్త మాటలేనని సందర్భం సూచిస్తుంది.
- source_word: יְעַצֵּבוּ
  choice: వక్రీకరిస్తారు
  rationale: ఈ క్రియకు ఇక్కడ ‘బాధపెడతారు,’ ‘హాని చేస్తారు,’ లేదా ‘వక్రీకరిస్తారు’ అనే భావాలు సాధ్యమైనవి. ‘నా మాటలను’ అనే కర్మతో కలిసినప్పుడు, శత్రుత్వంతో మాటల అర్థాన్ని మార్చడం అనే భావం సందర్భానికి బాగా సరిపోతుంది.
- source_word: עָלַי
  choice: నాకు విరోధంగా
  rationale: శత్రుత్వ సందర్భంలో ‘నా మీద’ అనే అక్షరార్థం కంటే విరోధ భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּל מַחְשְׁבֹתָם
  choice: వారి ఆలోచనలన్నీ
  rationale: מַחְשָׁבוֹת అంటే ఆలోచనలు, పథకాలు, లేదా కుట్రలు కావచ్చు. ‘ఆలోచనలు’ మూలపద విస్తృతిని కాపాడుతుంది; వాటి హానికర ఉద్దేశాన్ని తరువాతి పదబంధం స్పష్టం చేస్తుంది.
- source_word: לָרָע
  choice: కీడు చేయడానికే
  rationale: ఈ పదబంధం దుష్టమైన లేదా హానికరమైన ఉద్దేశాన్ని సూచిస్తుంది. ‘కీడు’ నైతిక దుష్టత్వం మరియు ఆచరణాత్మక హాని—రెండింటికీ చోటు ఇస్తుంది.
