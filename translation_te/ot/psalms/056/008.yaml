  yaml_path: translation/ot/psalms/056/008.yaml
  text: You have counted my wanderings[a]; put my tears in your bottle—are they not in your book?
translation:
  language: te
  text: 'నా సంచారాలను నీవు లెక్కపెట్టావు;

    నా కన్నీళ్లను నీ తోలుతిత్తిలో[a] ఉంచు—

    అవి నీ గ్రంథంలో లేవా?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తోలుతిత్తి’ అంటే ప్రాచీన కాలంలో ద్రవాలను నిల్వచేయడానికి ఉపయోగించిన జంతుచర్మపు పాత్ర.
    reason: ప్రాచీన పాత్ర స్వరూపాన్ని స్పష్టం చేయడం; దానిని ఆధునిక గాజు సీసాగా అపార్థం చేసుకోకుండా చూడడం.
lexical_decisions:
- source_word: נֹדִי
  choice: నా సంచారాలను
  rationale: נוד అనే మూలపదం తరిమివేయబడిన వ్యక్తి అటూ ఇటూ సంచరించడాన్ని సూచిస్తుంది. కీర్తనకర్త అనుభవించిన అస్థిర సంచారాన్ని స్పష్టంగా ఉంచుతూ, ‘నా దుఃఖాన్ని’ వంటి వివరణాత్మక భావానువాదాన్ని నివారిస్తుంది.
- source_word: סָפַרְתָּה
  choice: నీవు లెక్కపెట్టావు
  rationale: ספר యొక్క ప్రాథమిక భావం లెక్కించడం. దేవుడు కీర్తనకర్త ప్రతి సంచారాన్నీ శ్రద్ధగా గమనించాడనే కవితాత్మక భావాన్ని ఇది సహజంగా తెలియజేస్తుంది.
- source_word: שִׂימָה
  choice: ఉంచు
  rationale: שׂים ఆజ్ఞారూపానికి సహజమైన తెలుగు సమానం. కన్నీళ్లను ఒక పాత్రలో భద్రపరిచే స్పష్టమైన చిత్రాన్ని నిలుపుతుంది.
- source_word: דִמְעָתִי
  choice: నా కన్నీళ్లను
  rationale: హీబ్రూ రూపం ఏకవచన సమూహార్థంలో ఉన్నప్పటికీ, ఆధునిక తెలుగులో ‘నా కన్నీళ్లు’ సహజంగా ఉండి అదే భావాన్ని అందిస్తుంది.
- source_word: בְּנֹאדֶךָ
  choice: నీ తోలుతిత్తిలో
  rationale: נֹאד అనేది ద్రవాలను ఉంచే జంతుచర్మపు తిత్తి. ‘సీసా’ అని అనువదిస్తే ఆధునిక గాజు సీసా భావం కలగవచ్చు; ‘తోలుతిత్తి’ ప్రాచీన వస్తువును కచ్చితంగా తెలియజేస్తుంది.
- source_word: הֲלֹא
  choice: లేవా?
  rationale: הֲלֹא సమ్మతిని ఆశించే అలంకార ప్రశ్నను ప్రవేశపెడుతుంది. దాన్ని నిశ్చయార్థక వాక్యంగా మార్చకుండా ప్రశ్నారూపాన్ని నిలిపింది.
- source_word: בְּסִפְרָתֶךָ
  choice: నీ గ్రంథంలో
  rationale: ఇక్కడ ספרת లిఖితపూర్వక గ్రంథం లేదా నమోదును సూచిస్తుంది. ‘గ్రంథం’ కవితా గాంభీర్యాన్ని, లిఖిత నమోదు చిత్రాన్ని రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: దేవుడు కన్నీళ్లను దాచడం, గ్రంథంలో ఉంచడం అనే మానవరూప చిత్రణ
  choice: కన్నీళ్లను తోలుతిత్తిలో ఉంచడం, అవి దేవుని గ్రంథంలో ఉండడం అనే స్పష్టమైన చిత్రాలను యథాతథంగా నిలుపడం
  alternative: ‘నా బాధలన్నీ నీవు జ్ఞాపకం ఉంచుకున్నావు’ వంటి వివరణాత్మక భావానువాదం
  rationale: మూలవచనం కీర్తనకర్త బాధపై దేవుని వ్యక్తిగత శ్రద్ధను రెండు బలమైన కవితాత్మక చిత్రాల ద్వారా తెలియజేస్తుంది. వాటిని అమూర్తమైన వివరణగా మార్చకుండా ఉంచడం మూలంలోని కవితా, దైవశాస్త్ర బలాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా ఉండే గంభీర కవితా శైలి. ‘సంచారాలు,’ ‘తోలుతిత్తి,’ ‘గ్రంథం’ అనే పదాలు మూలంలోని స్పష్టమైన చిత్రాలను నిలుపుతాయి; అలంకార ప్రశ్నను ప్రశ్నగానే ఉంచింది.
