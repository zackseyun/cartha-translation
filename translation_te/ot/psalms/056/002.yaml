id: PSA.56.2
reference: Psalms 56:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שָׁאֲפ֣וּ שׁ֭וֹרְרַ/י כָּל הַ/יּ֑וֹם כִּֽי רַבִּ֨ים לֹחֲמִ֖ים לִ֣/י מָרֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/002.yaml
  text: My enemies pant after me all day long[a], for many fight against me from on high.
translation:
  language: te
  text: నా శత్రువులు రోజంతా నన్ను ఊపిరి సలపకుండా వెంటాడుతున్నారు; ఎందుకంటే అనేకులు ఉన్నత స్థానం నుండి[a] నాతో పోరాడుతున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఓ మహోన్నతుడా”; చివరి హీబ్రూ పదాన్ని దాడిచేసేవారి ఉన్నత స్థానాన్ని వర్ణించేదిగా కాకుండా దేవునికి సంబోధనగా చదవవచ్చు. కొందరు దానిని “గర్వంగా” అని కూడా అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁאֲפוּ
  choice: మింగివేయాలని ఆరాటపడుతున్నారు
  rationale: ఈ క్రియ ఊపిరి పీలుస్తూ ఆత్రంగా వెంబడించే చిత్రాన్ని సూచించగలదు; శత్రుత్వ సందర్భంలో బలిని మింగివేయాలనే దురాశను వ్యక్తం చేస్తుంది. తెలుగు పాఠకులకు సహజంగా ఉండేలా, దాని తీవ్రమైన వేటాడే భావాన్ని నిలిపింది.
- source_word: שׁוֹרְרַי
  choice: నా శత్రువులు
  rationale: కీర్తనకర్తకు విరోధంగా నిలిచినవారిని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: כָּל הַיּוֹם
  choice: రోజంతా
  rationale: నిరంతర చర్యను తెలిపే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: మొదటి ఫిర్యాదుకు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: רַבִּים
  choice: అనేకులు
  rationale: పోరాడేవారి అధిక సంఖ్యను సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: לֹחֲמִים לִי
  choice: నాతో పోరాడుతున్నారు
  rationale: కీర్తనకర్తకు వ్యతిరేకంగా కొనసాగుతున్న శత్రుత్వ చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מָרוֹם
  choice: ఉన్నత స్థానం నుండి
  rationale: మూలపదంలోని ఎత్తు లేదా ఉన్నత స్థితి అనే ప్రాథమిక చిత్రాన్ని నిలిపి, అది దేవునికి సంబోధనా లేక గర్వంగా అనే భావమా అన్నదాన్ని ప్రధాన పాఠంలో అతిగా నిర్ధారించదు.
theological_decisions:
- issue: מָרוֹם పదానికి అర్థనిర్ణయం
  choice: ఉన్నత స్థానం నుండి
  alternative: మహోన్నతుడా; గర్వంగా
  rationale: వాక్యనిర్మాణం సంక్షిప్తంగా ఉండి స్థలార్థం, దేవునికి సంబోధన, లేదా గర్వభావం అనే పఠనాలకు వీలు కల్పిస్తుంది. ప్రధాన పాఠం ఎత్తు అనే మూలచిత్రాన్ని ఉంచుతుంది; ఇతర ప్రాచీనంగా సాధ్యమైన పఠనాలను పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనా శైలికి తగిన గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే భాష. మూలంలోని వేటాడే చిత్రం మరియు చివరి పదంలోని నిజమైన సందిగ్ధత రెండూ నిలిపివేయబడ్డాయి.
