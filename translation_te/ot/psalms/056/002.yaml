- from: నా శత్రువులు రోజంతా నన్ను మింగివేయాలని ఆరాటపడుతున్నారు; ఎందుకంటే అనేకులు ఉన్నత స్థానం నుండి నాతో పోరాడుతున్నారు.[a]
  to: నా శత్రువులు రోజంతా నన్ను ఊపిరి సలపకుండా వెంటాడుతున్నారు; ఎందుకంటే అనేకులు ఉన్నత స్థానం నుండి[a] నాతో పోరాడుతున్నారు.
  rationale: The revision removes the unsupported ‘devour’ interpretation while retaining the hostile, breathless-pursuit force of the Hebrew verb. It preserves the main-text spatial reading of מָרוֹם and retains both significant alternatives in the footnote, with the anchor moved to the relevant phrase.
