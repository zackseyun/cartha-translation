  choice: వేచి ఉన్న
  rationale: קוה యొక్క ప్రాథమిక భావం వేచి ఉండడం లేదా ఆశతో ఎదురుచూడడం. శత్రుత్వ సందర్భం దీనికి హానికరమైన ఉద్దేశాన్ని ఇస్తున్నా, ప్రధాన పాఠ్యం ‘పొంచి ఉన్నారు’ అని మరింత వ్యాఖ్యానించకుండా మూల క్రియ యొక్క విస్తృతిని కాపాడుతుంది.
