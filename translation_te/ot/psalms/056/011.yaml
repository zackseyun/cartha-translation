source:
  edition: WLC
  text: בֵּֽ/אלֹהִ֣ים בָּ֭טַחְתִּי לֹ֣א אִירָ֑א מַה יַּעֲשֶׂ֖ה אָדָ֣ם לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/011.yaml
  text: In God I have trusted; I will not fear[a]. What can man do to me?
translation:
  language: te
  text: దేవునిపై నేను నమ్మకం ఉంచాను; నేను భయపడను. మనిషి[a] నాకు ఏమి చేయగలడు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక మానవుడు నాకు ఏమి చేయగలడు?” హెబ్రీలో ఏకవచనమైన אָדָם (“మనిషి”) అనే పదం ఉంది; అది ఇక్కడ మానవుణ్ణి ప్రతినిధిగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: దేవునిపై
  rationale: ב ఇక్కడ నమ్మకానికి ఆధారమైన వ్యక్తిని సూచిస్తుంది. తెలుగులో ‘దేవునిపై నమ్మకం ఉంచాను’ అనేది సహజమైన నమ్మక సూత్రప్రయోగం.
- source_word: בָּטַחְתִּי
  choice: నేను నమ్మకం ఉంచాను
  rationale: בטח యొక్క Qal perfect 1cs రూపం స్థిరంగా ఉంచిన నమ్మకాన్ని తెలియజేస్తుంది; భూతకాల రూపం హెబ్రీ క్రియారూపాన్ని నిలుపుతుంది.
- source_word: לֹא אִירָא
  choice: నేను భయపడను
  rationale: לא తో వచ్చిన imperfect 1cs ఇక్కడ దేవునిపై నమ్మకం నుండి పుట్టిన దృఢనిశ్చయాన్ని వ్యక్తం చేస్తుంది. తెలుగులో ‘భయపడను’ వర్తమాన-భవిష్యత్ భావాన్ని సహజంగా కలిగిస్తుంది.
- source_word: מַה יַּעֲשֶׂה
  choice: ఏమి చేయగలడు?
  rationale: מַה అక్షరార్థంగా ‘ఏమి’; అయితే ఈ అలంకారిక ప్రశ్నలో సామర్థ్య భావం అంతర్లీనంగా ఉంది. ‘ఏమి చేయగలడు?’ ఆ ఉద్దేశాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: אָדָם
  choice: మనిషి
  rationale: ఏకవచన אָדָם ఇక్కడ ఒక మానవుణ్ణి ప్రతినిధిగా సూచిస్తూ దేవునికి విరుద్ధంగా మానవ పరిమితిని చూపుతుంది. ‘మనిషి’ ఏకవచనాన్ని, ప్రతినిధి భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: לִי
  choice: నాకు
  rationale: לִי యొక్క ప్రత్యక్ష అర్థం ‘నాకు’. ‘చేయగలడు’తో కలిసినప్పుడు తెలుగులో సహజంగా ‘నాకు ఏమి చేయగలడు?’ అవుతుంది.
theological_decisions:
- issue: ప్రతినిధి ఏకవచనంగా אָדָם అనువాదం
  choice: మనిషి
  alternative: ఒక మానవుడు / మానవజాతి
  rationale: హెబ్రీ పదం ఏకవచనంలో ఉండి ఏ మానవ ప్రత్యర్థినైనా ప్రతినిధిగా సూచిస్తుంది. ‘మనిషి’ మూలంలోని ఏకవచనాన్నీ, దేవునికీ పరిమిత మానవునికీ మధ్యనున్న ఉద్వేగాన్నీ కాపాడుతుంది; ‘మానవజాతి’ మూలంలో లేని సమూహ భావాన్ని కలిగించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. సమాంతర వాక్యాల సంక్షిప్తతను, విశ్వాసం నుంచి పుట్టే నిర్భయతను కాపాడింది.
