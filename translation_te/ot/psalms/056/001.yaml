  variant: modern standard Telugu
source:
  edition: WLC
  text: חָנֵּ֣/נִי אֱ֭לֹהִים כִּֽי שְׁאָפַ֣/נִי אֱנ֑וֹשׁ כָּל הַ֝/יּ֗וֹם לֹחֵ֥ם יִלְחָצֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/001.yaml
  text: Be gracious to me[a], O God, for man pants after me; all day long, fighting, he oppresses me.
translation:
  language: te
  text: 'దేవా, నాపై కృప చూపు!


    ఎందుకంటే మనిషి నన్ను రొప్పుతూ వెంటాడుతున్నాడు[a];


    రోజంతా పోరాడుతూ నన్ను అణచివేస్తున్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నన్ను తొక్కుతున్నాడు,’ ‘నన్ను కొరకబోతున్నాడు,’ లేదా ‘నన్ను మింగివేయాలని చూస్తున్నాడు.’ హీబ్రూ క్రియ శత్రుత్వంతో రొప్పడాన్ని లేదా ఆత్రంగా వెంటపడడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: నాపై కృప చూపు
  rationale: חנן పీయేల్ ఆజ్ఞార్థక రూపం దేవుని అనుగ్రహాన్ని వేడుకుంటుంది. ‘కృప చూపు’ పశ్చాత్తాప భావాన్ని అనవసరంగా చేర్చకుండా ప్రార్థనాత్మక విజ్ఞప్తిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ఇది ప్రత్యక్ష సంబోధన. తెలుగు సంబోధన రూపమైన ‘దేవా’ ప్రార్థనా సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న విజ్ఞప్తికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: שְׁאָפַנִי
  choice: నన్ను పట్టుకోవాలని రొప్పుతూ వెంటపడుతున్నాడు
  rationale: שׁאף శత్రుత్వంతో రొప్పడం, ఆత్రంగా వెంటపడడం అనే సజీవ రూపకాన్ని కలిగి ఉంది. తెలుగు పాఠకునికి అర్థమయ్యేలా ‘పట్టుకోవాలని’ అని స్పష్టం చేస్తూనే ‘రొప్పుతూ వెంటపడుతున్నాడు’ ద్వారా మూలంలోని రూపకాన్ని నిలిపింది.
- source_word: אֱנוֹשׁ
  choice: ఒక మనిషి
  rationale: ఈ ఏకవచన నామవాచకం బలహీనుడైన మర్త్య మానవుణ్ణి సూచించగలదు; సందర్భంలో ఒక మానవ శత్రువు కనిపిస్తున్నందున ‘ఒక మనిషి’ సహజంగా ఉంది.
- source_word: כָּל־הַיּוֹם
  choice: రోజంతా
  rationale: కాలవ్యాప్తిని తెలిపే ఈ పదబంధానికి సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: לֹחֵם
  choice: పోరాడుతూ
  rationale: לחם క్రియలోని కొనసాగుతున్న క్రియావిశేషణాత్మక భాగార్థక భావాన్ని నిలుపుతుంది.
- source_word: יִלְחָצֵנִי
  choice: నన్ను అణచివేస్తున్నాడు
  rationale: לחץ నొక్కడం, పీడించడం, అణచివేయడం అనే భావాలను ఇస్తుంది. శత్రువు కలిగిస్తున్న నిరంతర ఒత్తిడిని ‘అణచివేస్తున్నాడు’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: אֱנוֹשׁ లోని ఏకవచన మానవ సూచన
  choice: ఒక మనిషి
  alternative: ఒక మర్త్యుడు; మానవుడు
  rationale: సందర్భం సాధారణంగా మానవజాతిని కాక ఒక వ్యక్తిగత మానవ శత్రువును చిత్రిస్తుంది. ‘ఒక మనిషి’ కీర్తనకర్తకు వ్యతిరేకంగా నిలిచేది కేవలం మానవుడే అనే అంతర్లీన వ్యత్యాసాన్ని అతిశయోక్తి లేకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవభరితమైన, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని కవితాత్మక పంక్తి విభజనను సాధ్యమైనంతవరకు నిలిపింది.
