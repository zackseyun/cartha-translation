  text: עַל אָ֥וֶן פַּלֶּט לָ֑/מוֹ בְּ֝/אַ֗ף עַמִּ֤ים הוֹרֵ֬ד אֱלֹהִֽים־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/007.yaml
  text: Because of iniquity[a], do not let them escape; in anger bring down the peoples[b], O God.
translation:
  language: te
  text: వారి దోషం కారణంగా వారికి తప్పించుకోవడానికి వీలు ఇవ్వకు[a]; కోపంతో ప్రజలను దిగజేయి, దేవా.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి దోషం కారణంగా వారిని రక్షించకు.” ఈ హెబ్రీ వాక్యభాగం క్లిష్టమైనది; క్రియను ‘తప్పించుకోవడానికి వీలు ఇవ్వు’ అనే భావంలో కాకుండా నేరుగా ‘విడిపించు/రక్షించు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “జనాంగాలను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל אָוֶן
  choice: వారి దుష్టత్వం కారణంగా
  rationale: עַל ఇక్కడ కారణాన్ని సూచిస్తుంది; אָוֶן నైతిక దుష్టత్వాన్ని తెలియజేస్తుంది. సందర్భం స్పష్టత కోసం తెలుగులో ‘వారి’ చేర్చబడింది.
- source_word: פַּלֶּט לָמוֹ
  choice: వారు తప్పించుకోనివ్వకు
  rationale: פלט సాధారణంగా తప్పించుకోవడం లేదా విడిపించడం అనే అర్థాలు కలిగి ఉంది. కీర్తనలోని న్యాయతీర్పు విన్నప సందర్భంలో, వారు తప్పించుకోకుండా చేయమనే ప్రతికూల విన్నపంగా గ్రహించడం సహజం; అయితే హెబ్రీ వాక్యభాగం క్లిష్టమైనందున ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: בְּאַף
  choice: కోపంతో
  rationale: אַף ఇక్కడ కోపం లేదా ఉగ్రతను సూచిస్తుంది. మూలంలో ‘నీ’ స్పష్టంగా లేకపోవడంతో దాన్ని చేర్చలేదు.
- source_word: עַמִּים
  choice: జనసమూహాలను
  rationale: עַמִּים అనేది ‘ప్రజలు/జనాలు’ అనే బహువచనం. ‘జనసమూహాలు’ దాని సమూహాత్మక బహువచన భావాన్ని తెలుగులో స్పష్టంగా ఉంచుతుంది; ‘దేశాలు’ కూడా సందర్భానుసారమైన ప్రత్యామ్నాయం.
- source_word: הוֹרֵד
  choice: కిందికి దించు
  rationale: ירד యొక్క హిఫీల్ ఆజ్ఞారూపం దిగజేయడం లేదా పడగొట్టడం అనే రూపకాన్ని కలిగి ఉంది. ‘కిందికి దించు’ ఆ దిగజార్చే రూపకాన్ని నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ఇది ప్రత్యక్ష సంబోధన; తెలుగు సంబోధన రూపం ‘దేవా’ దానిని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: క్లిష్టమైన హెబ్రీ వాక్యభాగంలోని శాపవిన్నపం మరియు అంతర్లీన ప్రతికూలత
  choice: వారి దుష్టత్వం కారణంగా వారు తప్పించుకోకుండా దేవునికి చేసే విన్నపంగా అనువదించబడింది.
  alternative: ‘దోషం నిమిత్తం వారిని విడిపించకు’ లేదా ‘కీడు ద్వారా వారు తప్పించుకుంటారా?’ అనే విధంగా కూడా క్లిష్టమైన హెబ్రీని అర్థం చేసుకోవచ్చు.
  rationale: פַּלֶּט రూపం స్వతహాగా ‘తప్పించు/విడిపించు’ అని ఉండగలిగినా, కీర్తన సందర్భం మరియు తరువాతి ‘కిందికి దించు’ అనే విన్నపం ప్రతికూల ప్రార్థనను బలపరుస్తాయి. అయినప్పటికీ మూలంలోని అస్పష్టతను పాదసూచికలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనాత్మక కీర్తనకు తగిన గంభీరతతో, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం ఉపయోగించబడింది. మూలంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు కాపాడుతూ, క్లిష్టమైన మొదటి భాగానికి పాదసూచికలో ప్రత్యామ్నాయాన్ని ఇచ్చాం.
