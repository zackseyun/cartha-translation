source:
  edition: WLC
  text: עָלַ֣/י אֱלֹהִ֣ים נְדָרֶ֑י/ךָ אֲשַׁלֵּ֖ם תּוֹדֹ֣ת לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/012.yaml
  text: Your vows are upon me[a], O God[b]; I will render thank offerings to you.
translation:
  language: te
  text: దేవా, నీ మొక్కుబడులు నా మీద ఉన్నాయి[a]; నీకు కృతజ్ఞతా బలులు అర్పిస్తాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నీ మొక్కుబడులు నా మీద ఉన్నాయి.” దీని భావం సాధారణంగా దేవునికి చేసిన, ఆయనకు చెల్లించవలసిన మొక్కుబడులని అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “కృతజ్ఞతలు చెల్లిస్తాను.” హీబ్రూ పదం కృతజ్ఞతా వ్యక్తీకరణలను లేదా కృతజ్ఞతా బలులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלַי
  choice: నా మీద ఉన్నాయి
  rationale: עַל + ప్రథమ పురుష ఏకవచన ప్రత్యయం బాధ్యత తనపై ఉందనే హీబ్రూ రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ఇక్కడ ఇది ప్రత్యక్ష సంబోధన; తెలుగు సంబోధన రూపం భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נְדָרֶיךָ
  choice: నీకు చేయాల్సిన నా మొక్కుబడులు
  rationale: అక్షరార్థంగా ‘నీ మొక్కుబడులు’; సందర్భంలో దేవునికి చేసినవిగా, ఆయనకు చెల్లించవలసిన మొక్కుబడులుగా అర్థం. ప్రధాన వాక్యంలో సహజత కోసం సంబంధాన్ని స్పష్టం చేసి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֲשַׁלֵּם
  choice: అర్పిస్తాను
  rationale: שלם పియేల్ రూపం చెల్లించడం లేదా నెరవేర్చడం అనే భావాన్ని ఇస్తుంది; תּוֹדוֹתను బలులుగా తీసుకున్నప్పుడు తెలుగులో ‘అర్పిస్తాను’ సహజంగా ఉంటుంది.
- source_word: תּוֹדֹת
  choice: కృతజ్ఞతా బలులు
  rationale: ఈ బహువచన నామవాచకం కృతజ్ఞతా వ్యక్తీకరణలను లేదా కృతజ్ఞతా బలులను సూచించగలదు. మొక్కుబడులు, చెల్లింపు అనే సందర్భం బలి భావానికి మద్దతిస్తుంది; ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: לָךְ
  choice: నీకు
  rationale: לְ ఇక్కడ గ్రహీతను సూచిస్తుంది; సందర్భంలోని సంబోధితుడు దేవుడే.
theological_decisions:
- issue: נְדָרֶיךָ లోని ‘నీ మొక్కుబడులు’ అనే రూపం
  choice: ప్రధాన పాఠ్యంలో ‘నీకు చేయాల్సిన నా మొక్కుబడులు’ అని భావాన్ని సహజంగా వ్యక్తం చేయడం
  alternative: ‘నీ మొక్కుబడులు నా మీద ఉన్నాయి’
  rationale: హీబ్రూ రెండవ పురుష ప్రత్యయం అక్షరార్థంగా ‘నీ’ అని ఉన్నప్పటికీ, భావం దేవునికి చేసిన, ఆయనకు చెల్లించవలసిన మొక్కుబడులు. తెలుగు పాఠకుడికి తప్పుదారి పట్టించకుండా భావాన్ని స్పష్టం చేసి, మూలంలోని విశిష్ట రూపాన్ని పాదసూచికలో భద్రపరిచాం.
- issue: תּוֹדֹת యొక్క ఆచార సంబంధమైన లేదా సాధారణ కృతజ్ఞత భావం
  choice: కృతజ్ఞతా బలులు
  alternative: కృతజ్ఞతలు
  rationale: మొక్కుబడులు మరియు చెల్లించడం/నెరవేర్చడం అనే సందర్భం బలి అర్థాన్ని సూచిస్తుంది; అయినా పదానికి విస్తృతమైన కృతజ్ఞతా వ్యక్తీకరణ భావం కూడా ఉండటంతో దాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘మొక్కుబడులు’ వాగ్దానపూర్వక ఆధ్యాత్మిక బాధ్యతను సహజంగా తెలియజేస్తుంది; మూలంలోని అసాధారణ ‘నీ మొక్కుబడులు’ రూపం పాదసూచికలో సంరక్షించబడింది.
