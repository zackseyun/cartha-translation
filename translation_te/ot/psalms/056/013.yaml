source:
  edition: WLC
  text: כִּ֤י הִצַּ֪לְתָּ נַפְשִׁ֡/י מִ/מָּוֶת֮ הֲ/לֹ֥א רַגְלַ֗/י מִ֫/דֶּ֥חִי לְ֭/הִֽתְהַלֵּךְ לִ/פְנֵ֣י אֱלֹהִ֑ים בְּ֝/א֗וֹר הַֽ/חַיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/013.yaml
  text: For you have delivered my soul from death[a]; have you not also kept my feet from stumbling[d][c][b], that I may walk before God in the light of life?
translation:
  language: te
  text: ఎందుకంటే, నీవు నా ప్రాణాన్ని[a] మరణం నుండి విడిపించావు; నేను దేవుని సన్నిధిలో జీవపు వెలుగులో[c] నడవడానికి నా పాదాలను కూడా తడబడకుండా[b] కాపాడలేదా?[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా జీవాన్ని’ లేదా ‘నన్ను.’ హెబ్రీ పదం జీవం, ప్రాణం, లేదా సంపూర్ణ వ్యక్తిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పడిపోకుండా.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘జీవించేవారి వెలుగులో.’
    reason: lexical_alternative
  - marker: d
    text: హెబ్రీలో రెండో భాగంలోని క్రియ అధ్యాహారంగా ఉంది. దీనిని ‘నా పాదాలను పడిపోకుండా కూడా నీవు విడిపించావు కదా?’ అని కూడా అనువదించవచ్చు.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న విశ్వాసానికి లేదా స్తుతికి కారణాన్ని తెలియజేసే అనుసంధాన పదంగా సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הִצַּלְתָּ
  choice: విడిపించావు
  rationale: నצל హిఫీల్ రూపం ప్రమాదం లేదా మరణం నుంచి తప్పించడం, రక్షించడం అనే భావాన్ని ఇస్తుంది; పూర్తయిన రక్షణ కార్యాన్ని ఈ రూపం స్పష్టంగా తెలియజేస్తుంది.
- source_word: נַפְשִׁי
  choice: నా ప్రాణాన్ని
  rationale: נֶפֶשׁ ఇక్కడ జీవం, వ్యక్తి, ప్రాణం అనే పరస్పర సంబంధిత భావాలను కలిగి ఉంది. ‘ప్రాణం’ మరణానికి వ్యతిరేకంగా సహజంగా ఉండి, దీనిని సాంకేతికమైన ఆత్మశాస్త్ర పదంగా కుదించదు.
- source_word: מִמָּוֶת
  choice: మరణం నుండి
  rationale: మరణపు ముప్పు లేదా అధికారంనుంచి విడిపించబడటాన్ని నేరుగా వ్యక్తపరుస్తుంది.
- source_word: הֲלֹא
  choice: కాపాడలేదా?
  rationale: సానుకూల సమాధానాన్ని ఆశించే హెబ్రీ అలంకారప్రశ్నను తెలుగులో నిలుపుతుంది. సందర్భం వల్ల లుప్తమైన క్రియను ‘కాపాడు’గా పూరించింది.
- source_word: רַגְלַי
  choice: నా పాదాలు
  rationale: నడక అనే తరువాతి రూపకంతో అనుసంధానమయ్యే స్పష్టమైన శరీరాంగ చిత్రాన్ని నిలుపుతుంది.
- source_word: מִדֶּחִי
  choice: తడబడకుండా
  rationale: דֶּחִי సూచించే తూలడం, పడిపోవడం అనే భావంలో, పాదాలు మరియు నడక సందర్భానికి ‘తడబడడం’ సహజంగా సరిపోతుంది.
- source_word: לְהִתְהַלֵּךְ
  choice: నడవడానికి
  rationale: לְ సహిత క్రియార్థక రూపం సూచించే ఉద్దేశాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי אֱלֹהִים
  choice: దేవుని సన్నిధిలో
  rationale: అక్షరార్థంగా ‘దేవుని ఎదుట’ అనే భావాన్ని, ఆయన సమక్షంలో జీవించడాన్ని సూచించే సహజ తెలుగు పదబంధంగా అందిస్తుంది.
- source_word: בְּאוֹר הַחַיִּים
  choice: జీవపు వెలుగులో
  rationale: మూలంలోని కవితాత్మకమైన వెలుగు–జీవం చిత్రాన్ని నిలుపుతుంది; ‘జీవించేవారి వెలుగులో’ అనే అర్థసాధ్యతను పాదటిప్పణిలో ఉంచుతుంది.
theological_decisions:
- issue: נַפְשִׁי లోని మానవస్వరూప భావవిస్తృతి
  choice: నా ప్రాణాన్ని
  alternative: నా జీవాన్ని; నన్ను; నా ఆత్మను
  rationale: ఈ పద్యం శరీరానికి వేరైన ‘ఆత్మ’ గురించి సాంకేతిక వాదన చేయదు. ‘ప్రాణం’ జీవం మరియు సంపూర్ణ వ్యక్తి రెండింటినీ సూచించగలిగి, మూలంలోని భావవిస్తృతిని సాధ్యమైనంతవరకు నిలుపుతుంది.
- issue: בְּאוֹר הַחַיִּים యొక్క భావం
  choice: జీవపు వెలుగులో
  alternative: జీవించేవారి వెలుగులో
  rationale: వచనంలోని పదరూపం ‘జీవం’ అనే కవితాత్మక భావాన్ని నేరుగా అనుమతిస్తుంది; సంబంధిత హెబ్రీ నుడికారాన్ని బట్టి ‘జీవించేవారు’ అనే ప్రత్యామ్నాయం కూడా సాధ్యమే కాబట్టి దాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కీర్తనా శైలిని, సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణంతో కలిపాం. హెబ్రీ అలంకారప్రశ్నను నిలిపి, మూలంలో అధ్యాహారంగా ఉన్న క్రియను తెలుగులో స్పష్టత కోసం ‘కాపాడు’గా పూరించాం. ‘ప్రాణం,’ ‘జీవపు వెలుగు’ వంటి పదాలు కవితాత్మకతను కాపాడుతూ అతిగా మతపరమైన సాంకేతిక అర్థాలను రుద్దకుండా ఎంపికయ్యాయి.
