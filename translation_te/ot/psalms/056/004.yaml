  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בֵּ/אלֹהִים֮ אֲהַלֵּ֪ל דְּבָ֫ר֥/וֹ בֵּ/אלֹהִ֣ים בָּ֭טַחְתִּי לֹ֣א אִירָ֑א מַה יַּעֲשֶׂ֖ה בָשָׂ֣ר לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/004.yaml
  text: In God I will praise his word[a]; in God I have trusted; I will not fear[c][b]. What can flesh do to me?
translation:
  language: te
  text: దేవునిలో నేను ఆయన వాక్యాన్ని స్తుతిస్తాను; దేవునిలో నేను నమ్మకం ఉంచాను; నేను భయపడను. నరమాత్రుడు నాకు ఏమి చేయగలడు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నరమాత్రుడు నాకు ఏమి చేస్తాడు?” హీబ్రూలో క్రియ భవిష్య రూపంలో ఉంది; ఈ అలంకార ప్రశ్న మానవుని అశక్తతను కూడా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: దేవునిలో
  rationale: בְּ ఇక్కడ స్తుతి, నమ్మకాలకు ఆధారం లేదా పరిధిని సూచిస్తుంది; సమాంతరమైన రెండు పాదాల్లోనూ ‘దేవునిలో’ మూలంలోని రూపాన్ని నిలుపుతుంది.
- source_word: אֲהַלֵּל
  choice: నేను స్తుతిస్తాను
  rationale: పియేల్ అసంపూర్ణ క్రియ ఇక్కడ భవిష్య భావంతో కూడిన దృఢ సంకల్పాన్ని వ్యక్తం చేస్తుంది.
- source_word: דְּבָרוֹ
  choice: ఆయన వాక్యాన్ని
  rationale: דָּבָר అనే పదానికి ఉన్న ‘మాట/వాక్యం’ అనే విస్తృత భావాన్ని నిలుపుతూ, దానిని ప్రత్యేకంగా ‘వాగ్దానం’గా పరిమితం చేయదు.
- source_word: בָּטַחְתִּי
  choice: నేను నమ్మకం ఉంచాను
  rationale: పూర్త క్రియ గతంలో ఉంచిన నమ్మకాన్ని, దాని ప్రస్తుత ఫలితమైన నిర్భయతతో సహా తెలియజేస్తుంది.
- source_word: לֹא אִירָא
  choice: నేను భయపడను
  rationale: నిషేధంతో ఉన్న అసంపూర్ణ క్రియ కొనసాగుతున్న ధైర్యాన్ని, భయపడననే సంకల్పాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מַה יַּעֲשֶׂה
  choice: ఏమి చేయగలడు?
  rationale: హీబ్రూ రూపం అక్షరార్థంగా ‘ఏమి చేస్తాడు?’ అయినా, ఇది మానవుని అశక్తతను సూచించే అలంకార ప్రశ్న; తెలుగులో ‘ఏమి చేయగలడు?’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בָשָׂר
  choice: నరమాత్రుడు
  rationale: అక్షరార్థం ‘మాంసం’; ఇక్కడ దేవునికి భిన్నంగా బలహీనమైన మానవుణ్ణి సూచించే రూపకాలంకారం. ‘నరమాత్రుడు’ ఆ మానవ బలహీనతను సహజంగా తెలియజేస్తుంది.
- source_word: לִי
  choice: నాకు
  rationale: לְ ప్రత్యయం ఈ సందర్భంలో సహజంగా ‘నాకు’ అని అనువదించబడుతుంది.
theological_decisions:
- issue: దేవునితో పోల్చబడిన בָשָׂר అనే మానవశాస్త్రీయ పదం
  choice: నరమాత్రుడు
  alternative: మాంసం / మానవుడు
  rationale: ‘మాంసం’ అనే అక్షరానువాదం తెలుగులో ఇక్కడ వ్యక్తిని స్పష్టంగా సూచించక అసహజంగా ఉంటుంది. ‘నరమాత్రుడు’ దేవునికి ఎదురుగా ఉన్న బలహీన, పరిమిత మానవుని భావాన్ని నిలుపుతుంది; అదే సమయంలో ఏ ప్రత్యేక సిద్ధాంతార్థాన్నీ చేర్చదు.
- issue: מַה יַּעֲשֶׂה యొక్క భవిష్య రూపం మరియు అలంకార ప్రశ్న
  choice: ఏమి చేయగలడు?
  alternative: ఏమి చేస్తాడు?
  rationale: ప్రశ్న యొక్క ఉద్దేశం నరమాత్రుని పరిమిత శక్తిని ప్రకటించడం. ప్రధాన పాఠంలో సహజమైన సామర్థ్యార్థాన్ని ఇచ్చి, మూలంలోని భవిష్య రూపాన్ని పాదటిప్పణిలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనా గౌరవభావాన్ని నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉండే వాక్యనిర్మాణం. ‘దేవునిలో’ అనే పునరుక్తిని హీబ్రూ సమాంతర నిర్మాణం కోసం ఉద్దేశపూర్వకంగా నిలిపాం. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
