id: PSA.56.9
reference: Psalms 56:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָ֥֨ז יָ֘שׁ֤וּבוּ אוֹיְבַ֣/י אָ֭חוֹר בְּ/י֣וֹם אֶקְרָ֑א זֶה יָ֝דַ֗עְתִּי כִּֽי אֱלֹהִ֥ים לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/009.yaml
  text: Then my enemies will turn back in the day I call. This I know[a], that God is for me.
translation:
  language: te
  text: 'అప్పుడు నేను మొరపెట్టే రోజున నా శత్రువులు వెనుదిరుగుతారు. ఇది నాకు తెలుసు[a]: దేవుడు నా పక్షాన ఉన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దీనివల్ల దేవుడు నా పక్షాన ఉన్నాడని నాకు తెలుసు.”
    reason: זֶה יָדַעְתִּי అనే హీబ్రూ పదబంధాన్ని ‘ఇది నాకు తెలుసు’ అని గానీ, ‘దీనివల్ల నాకు తెలుసు’ అని గానీ అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: కాలక్రమంలో వచ్చే ఫలితాన్ని సూచించే సహజమైన తెలుగు పదం.
- source_word: יָשׁוּבוּ ... אָחוֹר
  choice: వెనుదిరుగుతారు
  rationale: శత్రువులు వెనక్కి తగ్గడం లేదా తిరిగిపోవడం అనే హీబ్రూ సంయుక్త భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אוֹיְבַי
  choice: నా శత్రువులు
  rationale: ప్రత్యక్షమైన స్వామ్య నామపదబంధం.
- source_word: בְּיוֹם אֶקְרָא
  choice: నేను మొరపెట్టే రోజున
  rationale: మూలంలోని నిర్దిష్ట కాలపదబంధాన్ని నిలుపుతూ, ప్రార్థనా సందర్భంలో קרא యొక్క పిలుపు/మొర భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: זֶה יָדַעְתִּי
  choice: నాకు తెలుసు
  rationale: ప్రధాన పఠనంలో ఇది తదుపరి వాక్యవిషయాన్ని తెలిసినదిగా ప్రకటిస్తుంది; זֶה యొక్క సాధనార్థక అవకాశాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: כִּי אֱלֹהִים לִי
  choice: దేవుడు నా పక్షాన ఉన్నాడని
  rationale: శత్రువుల సందర్భంలో לִי దేవుని అనుకూలత, సహాయం అనే భావాన్ని ఇస్తుంది; ఇది స్వామ్యంగా చెప్పడంకంటే సందర్భానికి తగినది.
theological_decisions:
- issue: אֱלֹהִים לִי అనే సంక్షిప్త వాక్యభాగం యొక్క భావం
  choice: దేవుడు నా పక్షాన ఉన్నాడు
  alternative: దేవుడు నావాడు / దేవుడు నాకు చెందినవాడు
  rationale: ప్రార్థనకు ప్రతిస్పందనగా శత్రువులు వెనుదిరిగే సందర్భం దేవుని మద్దతు, అనుకూలతను సూచిస్తుంది; అయినా హీబ్రూ నిర్మాణం సంక్షిప్తమైనదనే విషయాన్ని అతిగా విస్తరించలేదు.
- issue: זֶה יָדַעְתִּי యొక్క సంబంధం
  choice: తదుపరి వాక్యవిషయాన్ని సూచిస్తూ ‘దేవుడు నా పక్షాన ఉన్నాడని నాకు తెలుసు’
  alternative: ‘దీనివల్ల దేవుడు నా పక్షాన ఉన్నాడని నాకు తెలుసు’
  rationale: זֶה ను ప్రత్యక్షంగా ‘ఇది’ అని తీసుకోవచ్చు; సాధనార్థకంగా ‘దీనివల్ల’ అనే పఠనం కూడా నిజమైన అవకాశమైనందున పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కవితాత్మక శైలి. ‘మొరపెట్టే’ అన్నది ప్రార్థనా సందర్భాన్ని సహజంగా తెలియజేస్తుంది; ‘నా పక్షాన’ దేవుని అనుకూలతను మతశాఖాపరమైన అదనపు భావం లేకుండా వ్యక్తం చేస్తుంది.
