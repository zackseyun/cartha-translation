  yaml_path: translation/ot/psalms/056/003.yaml
  text: When I am afraid[a], I will trust in you.
translation:
  language: te
  text: నేను భయపడే వేళ[a], నీలో నమ్మకం ఉంచుతాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థంగా: “నేను భయపడే దినాన, నేను—నీలో నమ్మకం ఉంచుతాను.”'
    reason: హీబ్రూ పాఠంలోని ‘దినం’ అనే పదాన్నీ, స్వతంత్ర ‘నేను’ వల్ల కలిగే ఉద్ఘాటననూ చూపించడానికి.
lexical_decisions:
- source_word: י֥וֹם
  choice: వేళ
  rationale: ఇక్కడ ‘దినం’ అనే నామవాచకం భయం కలిగే సమయాన్ని సూచించే కాలవాచక ప్రయోగంగా ఉంది. ఆధునిక తెలుగులో ‘వేళ’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: אִירָ֑א
  choice: నేను భయపడే
  rationale: Qal imperfect మొదటి పురుష ఏకవచనం ఇక్కడ భక్తిపూర్వక భయం కాక, కీర్తనకర్త అనుభవించే భయాన్ని సూచిస్తుంది. ‘భయపడే’ అనేది కాలవాచక ఉపవాక్యంతో సహజంగా సరిపోతుంది.
- source_word: אֲ֝נִ֗י
  choice: నేను
  rationale: స్వతంత్ర సర్వనామం కర్తను నొక్కిచెబుతుంది. తెలుగులో ప్రధాన వాక్యంలో ‘నేను’ను స్పష్టంగా ఉంచడం ద్వారా ఆ ఉద్ఘాటనను అతిశయోక్తి లేకుండా వ్యక్తం చేశాం.
- source_word: אֵלֶ֥י/ךָ
  choice: నీలో
  rationale: בטחతో వచ్చిన אֶל నమ్మకం ఎవరిమీద కేంద్రీకృతమైందో సూచిస్తుంది. తెలుగులో ‘నీలో నమ్మకం ఉంచడం’ సహజమైన సమానార్థక ప్రయోగం.
- source_word: אֶבְטָֽח
  choice: నమ్మకం ఉంచుతాను
  rationale: בטח అంటే ‘నమ్మడం, విశ్వసించడం.’ ఇక్కడ imperfect రూపం భయానికి ప్రతిస్పందనగా తీసుకున్న సంకల్పాన్ని తెలియజేస్తుంది; ‘నమ్మకం ఉంచుతాను’ ఆ భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: భయానికి, నమ్మకానికి మధ్య సంబంధం
  choice: కీర్తనకర్తకు భయం కలిగినప్పటికీ, దానికి ప్రతిస్పందనగా దేవునిలో నమ్మకం ఉంచాలని సంకల్పిస్తున్నాడు.
  alternative: నమ్మకం భయాన్ని పూర్తిగా తొలగించిందని భావానువాదం చేయడం.
  rationale: హీబ్రూ పాఠం భయానుభవాన్ని, నమ్మాలనే సంకల్పాన్ని పక్కపక్కనే ఉంచుతుంది. భయం అసలే లేదని చెప్పకుండా ఆ ఉద్రిక్తతను అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే కీర్తనకు తగిన గౌరవభరిత శైలిలో ఉంచబడింది. ‘వేళ’ కాలసంబంధమైన హీబ్రూ ప్రయోగాన్ని సహజంగా అందిస్తుంది; పాదంలోని భయం–నమ్మకం ఉద్రిక్తత యథాతథంగా నిలుపబడింది.
