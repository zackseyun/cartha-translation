  variant: modern standard Telugu
source:
  edition: WLC
  text: אוֹמְרָ֤ה לְ/אֵ֥ל סַלְעִ/י֮ לָ/מָ֪ה שְׁכַ֫חְתָּ֥/נִי לָֽ/מָּה קֹדֵ֥ר אֵלֵ֗ךְ בְּ/לַ֣חַץ אוֹיֵֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/009.yaml
  text: I say to God[a], my rock, “Why have you forgotten me? Why do I go about mourning under the oppression of the enemy?”
translation:
  language: te
  text: 'నా బండయైన దేవునికి నేను ఇలా అంటాను:


    “నన్నెందుకు మరచిపోయావు?


    శత్రువు అణచివేతలో

    నేనెందుకు దుఃఖిస్తూ[a] తిరుగుతున్నాను?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విషాదంగా తిరుగుతున్నాను.”
    reason: కֹדֵר అనే పదం దుఃఖించడాన్ని సూచించవచ్చు; అలాగే చీకటిగా లేదా విషాదంగా ఉండే భావాన్ని కూడా సూచించగలదు.
lexical_decisions:
- source_word: אוֹמְרָה
  choice: నేను ఇలా అంటాను
  rationale: ఈ 1వ పురుష ఏకవచన కోహోర్టేటివ్ రూపం సంకల్పాన్ని లేదా తక్షణ మాటను సూచించగలదు. ఇక్కడ దేవునితో నేరుగా చేసే విలాపాన్ని సహజంగా పరిచయం చేయడానికి వర్తమాన రూపాన్ని ఎంచుకున్నాం.
- source_word: לְאֵל
  choice: దేవునితో
  rationale: אֵל ఇక్కడ ప్రత్యేక నామం కాక దేవునికి వాడిన సాధారణ పదం లేదా బిరుదు. אמר తో కూడిన לְ ను తెలుగులో సహజంగా ‘దేవునితో ... అంటాను’ అని అందించాం.
- source_word: סַלְעִי
  choice: నా బండ
  rationale: సֶלַע అంటే బండ లేదా శిల. దేవుడు స్థిరమైన ఆశ్రయం అనే కవితాత్మక రూపకాన్ని వివరణగా మార్చకుండా నిలిపాం.
- source_word: שְׁכַחְתָּנִי
  choice: నన్నెందుకు మరచిపోయావు
  rationale: 2వ పురుష ఏకవచన సంపూర్ణ క్రియకు 1వ పురుష కర్మ ప్రత్యయం జతైంది. ‘విడిచిపెట్టావు’ అని అర్థాన్ని విస్తరించకుండా, మూలంలోని ‘మరచిపోవడం’ అనే తీవ్రమైన విలాప భాషనే ఉంచాం.
- source_word: קֹדֵר
  choice: దుఃఖిస్తూ
  rationale: ఈ పదం చీకటిగా లేదా విషాదంగా ఉండడాన్ని, సందర్భానుసారం దుఃఖించడాన్ని సూచిస్తుంది. విలాప సందర్భంలో సహజమైన తెలుగు కోసం ‘దుఃఖిస్తూ’ ఎంచుకుని, ‘విషాదంగా’ అనే భావ ఛాయను పాదటిప్పణిలో ఉంచాం.
- source_word: אֵלֵךְ
  choice: తిరుగుతున్నాను
  rationale: הלך అంటే వెళ్లడం లేదా నడవడం. ఇక్కడ కొనసాగుతున్న దుఃఖస్థితిని తెలుగులో సహజంగా చూపేందుకు ‘తిరుగుతున్నాను’ అని అనువదించాం; మూలంలో స్పష్టంగా లేని బలవంతపు భావాన్ని చేర్చలేదు.
- source_word: בְּלַחַץ אוֹיֵב
  choice: శత్రువు అణచివేతకు గురై
  rationale: לַחַץ అంటే ఒత్తిడి లేదా అణచివేత. בְּ పరిస్థితి లేదా కారణాన్ని సూచించగలదు. ‘అణచివేతకు గురై’ అనే రూపం ఆ భారమైన పరిస్థితిని సహజంగా తెలియజేస్తుంది; ఏకవచన אוֹיֵב ను ‘శత్రువు’గా ఉంచాం.
theological_decisions:
- issue: దేవునికి వాడిన סַלְעִי అనే రూపకం
  choice: నా బండ
  alternative: నా ఆశ్రయం
  rationale: రూపకాన్ని భావవ్యాఖ్యగా మార్చకుండా, దేవుని స్థిరత్వం మరియు రక్షణను సూచించే బండ చిత్రాన్ని నిలిపాం.
- issue: దేవుడు మరచిపోయాడనే విలాపం
  choice: నన్నెందుకు మరచిపోయావు?
  alternative: నన్నెందుకు విడిచిపెట్టావు?
  rationale: కీర్తనకర్త అనుభవిస్తున్న దేవుని మౌనంపై ఉన్న తీవ్రమైన ఫిర్యాదును సిద్ధాంతపరంగా మృదువుచేయలేదు. అదే సమయంలో ‘విడిచిపెట్టడం’ అనే అదనపు అర్థాన్ని మూలపదంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కవితా శైలిని వాడాం. సమాంతర పాద నిర్మాణాన్ని నిలిపి, దేవునితో నేరుగా చేసే విలాపపు తీవ్రతను తగ్గించలేదు.
