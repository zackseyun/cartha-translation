source:
  edition: WLC
  text: אֱֽלֹהַ֗/י עָלַ/י֮ נַפְשִׁ֪/י תִשְׁתּ֫וֹחָ֥ח עַל כֵּ֗ן אֶ֭זְכָּרְ/ךָ מֵ/אֶ֣רֶץ יַרְדֵּ֑ן וְ֝/חֶרְמוֹנִ֗ים מֵ/הַ֥ר מִצְעָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/006.yaml
  text: My God[a], my soul is cast down within me; therefore I remember you from the land of the Jordan and the Hermons[d][c][b], from Mount Mizar.
translation:
  language: te
  text: నా దేవా, నాలో నా ప్రాణం కుంగిపోయింది; అందుచేత యొర్దాను ప్రాంతం నుండీ, హెర్మోను శిఖరాల[a] నుండీ, మిసారు కొండ నుండీ నిన్ను జ్ఞాపకం చేసుకుంటున్నాను[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం బహువచనంలో ఉంది; అది హెర్మోను పర్వతశ్రేణిని లేదా హెర్మోను శిఖరాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నిన్ను జ్ఞాపకం చేసుకుంటాను.” హీబ్రూ క్రియ సందర్భానుసారం ప్రస్తుత సంకల్పాన్ని లేదా భవిష్యత్ చర్యను సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: “మిసారు కొండ” ఒక స్థలనామం కావచ్చు; లేదా “చిన్న కొండ” అని అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: నా దేవా
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ‘నా దేవుడు’ అనే అర్థం వస్తుంది; సందర్భంలో ఇది ప్రత్యక్ష సంబోధన కావడంతో తెలుగులో సహజమైన సంబోధన రూపం వాడబడింది.
- source_word: עָלַי נַפְשִׁי תִשְׁתּוֹחָח
  choice: నాలో నా ప్రాణం కుంగిపోయింది
  rationale: నֶפֶשׁ‌ను కీర్తనాత్మకంగా ‘నా ప్రాణం’గా నిలిపి, שׁוחח సూచించే వంగిపోవడం లేదా దిగులుతో కుంగడం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַל־כֵּן
  choice: అందుచేత
  rationale: వక్త కుంగిన స్థితికి దేవుణ్ణి జ్ఞాపకం చేసుకోవడాన్ని పర్యవసానంగా కలిపే తార్కిక సంబంధాన్ని నిలుపుతుంది.
- source_word: אֶזְכָּרְךָ
  choice: నిన్ను జ్ఞాపకం చేసుకుంటున్నాను
  rationale: హీబ్రూ అసంపూర్ణ క్రియ సందర్భంలో ప్రస్తుతం కొనసాగుతున్న చర్యను లేదా సంకల్పాన్ని సూచించగలదు; ప్రధాన పాఠ్యంలో సహజమైన వర్తమాన భావం ఎంచుకోబడింది, భవిష్యత్/సంకల్ప భావం పాదటిప్పణిలో ఉంచబడింది.
- source_word: מֵאֶרֶץ יַרְדֵּן
  choice: యొర్దాను ప్రాంతం నుండీ
  rationale: అక్షరార్థమైన ‘యొర్దాను దేశం’ కంటే నది పరిసర భూభాగాన్ని సూచించే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְחֶרְמוֹנִים
  choice: హెర్మోను శిఖరాల నుండీ
  rationale: హీబ్రూలోని అసాధారణ బహువచనాన్ని ఏకవచన స్థలనామంగా సమతలపరచకుండా, హెర్మోను పర్వతశ్రేణి లేదా దాని శిఖరాలు అనే సాధ్యమైన భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: מֵהַר מִצְעָר
  choice: మిసారు కొండ నుండీ
  rationale: సమాంతర భౌగోళిక సూచనల మధ్య దీనిని స్థలనామంగా చదవడం ప్రధాన పాఠ్యానికి తక్కువ వ్యాఖ్యాత్మకమైన ఎంపిక; ‘చిన్న కొండ’ అనే పదార్థ సాధ్యతను పాదటిప్పణిలో ఉంచబడింది.
