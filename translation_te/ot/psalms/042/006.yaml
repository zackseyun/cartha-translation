  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదప్రయోగం. భౌగోళిక పదబంధంలోని పునరుక్త ‘నుండీ’ హీబ్రూ నిర్మాణాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
