  yaml_path: translation/ot/psalms/042/010.yaml
  text: As with a shattering in my bones[a], my adversaries taunt me, saying to me all day long, “Where is your God?”
translation:
  language: te
  text: నా ఎముకలు చితికిపోయినట్టుగా[a], నా విరోధులు రోజంతా నాతో, “నీ దేవుడు ఎక్కడ?” అని అంటూ నన్ను ఎగతాళి చేస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ఎముకల్లో వధవంటి గాయంతో.” ఇక్కడి హెబ్రీ రూపకం క్లిష్టమైనది; అది వధవంటి గాయాన్ని గానీ, లోతైన నలిపివేసే బాధను గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֶצַח
  choice: చితికిపోయినట్టుగా
  rationale: רֶצַח సాధారణంగా హత్య లేదా వధను సూచిస్తుంది; అయితే ‘నా ఎముకల్లో’ అనే కావ్యప్రయోగంలో అది లోతైన, ప్రాణాంతకమైన నలిగిపోవడాన్ని లేదా ఛిద్రమయ్యే బాధను చిత్రిస్తుంది. ‘చితికిపోయినట్టుగా’ అనే పదబంధం హింసాత్మక తీవ్రతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; మూలంలోని క్లిష్టతను పాదటిప్పణి ఉంచుతుంది.
- source_word: בְּעַצְמוֹתַי
  choice: నా ఎముకలు
  rationale: బాధ శరీరపు అంతర్భాగం వరకు చొచ్చుకుపోయిందనే హెబ్రీ చిత్రాన్ని తెలుగులో నిలుపుతుంది. ‘చితికిపోయినట్టుగా’తో కలిపి సహజమైన వాక్యనిర్మాణం కోసం విభక్తి రూపాన్ని సర్దుబాటు చేసింది.
- source_word: חֵרְפוּנִי
  choice: నన్ను నిందిస్తూ
  rationale: חרף అవమానం, నింద, ధిక్కారపూర్వక మాటలను సూచిస్తుంది. వెంట వచ్చే ‘నీ దేవుడు ఎక్కడ?’ అనే ఎద్దేవా సందర్భంలో ‘నిందిస్తూ’ స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో సరిపోతుంది.
- source_word: צוֹרְרָי
  choice: నా విరోధులు
  rationale: కీర్తనకర్తకు శత్రుత్వంగా ఎదురు నిలిచేవారిని సూచించే పదం. ‘విరోధులు’ మూలంలోని విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: בְּאָמְרָם אֵלַי
  choice: నాతో … అని అంటున్నారు
  rationale: మాట కీర్తనకర్తవైపు నేరుగా ఉద్దేశించబడిందనే భావాన్ని సహజమైన తెలుగు ప్రత్యక్ష వాక్యంలో వ్యక్తం చేస్తుంది.
- source_word: כָּל־הַיּוֹם
  choice: రోజంతా
  rationale: మళ్లీ మళ్లీ కొనసాగుతున్న ఎద్దేవాను సంక్షిప్తమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אַיֵּה אֱלֹהֶיךָ
  choice: నీ దేవుడు ఎక్కడ?
  rationale: దేవుని సహాయం లేదా సన్నిధిని సవాలు చేసే విరోధుల నేర ప్రశ్నను ఎలాంటి వివరణ లేదా అదనపు భావం చేర్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: దేవుని గురించి విరోధులు చేసే సవాలు
  choice: నీ దేవుడు ఎక్కడ?
  alternative: మరి నీ దేవుడు ఎక్కడ?
  rationale: మూలంలో లేని ‘మరి’ వంటి అదనపు బలాన్ని చేర్చకుండా, దేవుడు కనిపించకుండా ఉన్నాడనే విలాపంలోని ఉద్రిక్తతను పరిష్కరించకుండా నేర ప్రశ్నగానే ఉంచింది.
- issue: బాధను శారీరక గాయంగా లేదా అంతరంగ వేదనగా అర్థం చేయడం
  choice: రెండింటికీ వీలున్న హింసాత్మక ఎముకల రూపకాన్ని నిలుపడం
  alternative: కేవలం అంతరంగ వేదనగా వివరణాత్మకంగా అనువదించడం
  rationale: హెబ్రీ కావ్యచిత్రం శారీరకంగా నలిగే బాధను ఉపయోగించి లోతైన వేదనను వ్యక్తం చేస్తుంది. అనువాదం దానిని కేవలం మానసిక బాధగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కావ్యశైలిని ఉపయోగించాం. ‘ఎముకలు చితికిపోయినట్టుగా’ అనే బలమైన శరీరరూపకం సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండగా, మూలంలోని అరుదైన רֶצַח ప్రయోగం వల్ల కలిగే సందిగ్ధతను [a] పాదటిప్పణిలో స్పష్టంగా నిలిపాం.
