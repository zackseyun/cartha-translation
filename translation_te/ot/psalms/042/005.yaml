id: PSA.42.5
reference: Psalms 42:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מַה תִּשְׁתּ֬וֹחֲחִ֨י נַפְשִׁ/י֮ וַ/תֶּהֱמִ֪י עָ֫לָ֥/י הוֹחִ֣ילִי לֵֽ֭/אלֹהִים כִּי ע֥וֹד אוֹדֶ֗/נּוּ יְשׁוּע֥וֹת פָּנָֽי/ו־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/005.yaml
  text: Why are you cast down[a], O my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him, the salvation of my countenance and my God.
translation:
  language: te
  text: నా ప్రాణమా, నీవెందుకు కుంగిపోతున్నావు? నాలో నీవెందుకు కలత చెందుతున్నావు? దేవునిపై ఆశ పెట్టుకో; ఎందుకంటే ఆయన సన్నిధి నుండి కలిగే రక్షణను బట్టి నేను ఇంకా ఆయనను స్తుతిస్తాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: కుంగిపోయావు
  rationale: ఈ క్రియ వంగిపోవడం లేదా అణగిపోవడం అనే రూపకంతో తీవ్ర నిరుత్సాహాన్ని సూచిస్తుంది. ‘కుంగిపోయావు’ ఆ రూపకాన్నీ విలాప సందర్భంలోని భావాన్నీ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: נַפְשִׁי
  choice: నా ప్రాణమా
  rationale: కీర్తనలో కవి తన అంతరంగ స్వరూపాన్నే సంబోధిస్తున్నాడు. ‘నా ప్రాణమా’ కవితాత్మక ఆత్మసంభాషణను నిలుపుతుంది; దీనిని సాంకేతిక మానవతత్వ పదంగా నిర్బంధించదు.
- source_word: וַתֶּהֱמִי
  choice: కలత చెందుతున్నావు
  rationale: మూలక్రియ శబ్దం, అల్లకల్లోలం, ఆందోళన వంటి భావాలను కలిగి ఉంది. అంతరంగంలో చెలరేగే అస్థిరతను ‘కలత చెందుతున్నావు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָלַי
  choice: నాలో
  rationale: పదశః ‘నాపై’ అయినా, ఇక్కడ తన ప్రాణంతో మాట్లాడుతున్న కవి అనుభవించే అంతర్గత కలత ఉద్దేశించబడింది. అందుచేత ‘నాలో’ సందర్భానుగుణంగా ఉంది.
- source_word: הוֹחִילִי לֵאלֹהִים
  choice: దేవునిపై ఆశ పెట్టుకో
  rationale: ఈ ఆజ్ఞ దేవుని కోసం నిరీక్షిస్తూ ఆయనపై నమ్మకం ఉంచమని పిలుస్తుంది. ‘ఆశ పెట్టుకో’ నిరీక్షణ, విశ్వాసం రెండింటినీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: עוֹד אוֹדֶנּוּ
  choice: నేను ఇంకా ఆయనను స్తుతిస్తాను
  rationale: ప్రస్తుత దుఃఖం కొనసాగుతున్నప్పటికీ భవిష్యత్తులో స్తుతిస్తాననే దృఢ నిరీక్షణను ‘ఇంకా’ నిలుపుతుంది; ידה ఇక్కడ ఆరాధనా సందర్భంలో ‘స్తుతించు’ అనే అర్థంలో ఉంది.
- source_word: יְשׁוּעוֹת פָּנָיו
  choice: ఆయన సన్నిధి నుండి కలిగే రక్షణ
  rationale: పదశః ‘ఆయన ముఖపు రక్షణలు’ అనే అసాధారణ బహువచన నిర్మాణం. హెబ్రీలో ‘ముఖం’ సన్నిధిని సూచించగలదు; భావాన్ని సహజ తెలుగులో అందిస్తూ, మూల రూపకాన్నీ సంఖ్యలోని అస్పష్టతనూ పాదటిప్పణిలో భద్రపరచాం.
theological_decisions:
- issue: יְשׁוּעוֹת פָּנָיו అనే ముగింపు పదబంధం యొక్క సంబంధం మరియు భావం
  choice: ఆయన సన్నిధి నుండి కలిగే రక్షణను బట్టి
  alternative: పదశః ‘ఆయన ముఖపు రక్షణలు’; లేదా ‘ఆయన ముఖం ఇచ్చే సహాయం’
  rationale: మసొరేటిక్ పాఠంలో ఇక్కడ ‘నా దేవుడు’ అనే మాట లేదు; అది తరువాతి వచనంతో కలిసే పాఠవిభజన సంప్రదాయాలకు సంబంధించినది. అందువల్ల ఇచ్చిన WLC పాఠాన్నే అనుసరించి, దేవుని ముఖం/సన్నిధి నుండి వచ్చే విమోచనగా అనువదించాం. అయితే హెబ్రీ నిర్మాణం అసాధారణంగా ఉండటంతో ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కీర్తనా శైలిని ఉపయోగించాం. ‘నా ప్రాణమా’ అనే సంబోధన కవితాత్మక అంతర్ముఖతను నిలుపుతుంది; మిగతా వాక్య నిర్మాణం సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ఉంచాం.
