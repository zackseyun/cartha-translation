source:
  edition: WLC
  text: צָמְאָ֬ה נַפְשִׁ֨/י לֵ/אלֹהִים֮ לְ/אֵ֪ל חָ֥י מָתַ֥י אָב֑וֹא וְ֝/אֵרָאֶ֗ה פְּנֵ֣י אֱלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/002.yaml
  text: My soul thirsts for God[a], for the living God. When shall I come and appear before God?
translation:
  language: te
  text: నా ప్రాణం దేవునికోసం, సజీవుడైన దేవునికోసం దాహంతో ఉంది. నేను ఎప్పుడు వచ్చి దేవుని సన్నిధిలో హాజరవుతాను?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “దేవుని ముఖం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צָמְאָה
  choice: దాహంతో ఉంది
  rationale: క్రియలోని నిజమైన దాహం అనే సజీవ రూపకాన్ని నిలుపుతూ, సందర్భంలోని కొనసాగుతున్న ఆకాంక్షను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נַפְשִׁי
  choice: నా ప్రాణం
  rationale: נפשׁ ఇక్కడ వ్యక్తి అంతరంగమంతటినీ సూచిస్తుంది. ‘నా ప్రాణం’ హీబ్రూ కవితా నుడికారాన్ని నిలుపుతుంది; కేవలం ‘నేను’ అని సరళీకరించదు.
- source_word: לֵאלֹהִים
  choice: దేవునికోసం
  rationale: దాహం అనే రూపకంతో ל ఉపసర్గ దాహానికి లక్ష్యమైన వ్యక్తిని సూచిస్తుంది; తెలుగులో ‘దేవునికోసం’ సహజంగా ఆ ఆకాంక్షను తెలియజేస్తుంది.
- source_word: לְאֵל חָי
  choice: సజీవుడైన దేవునికోసం
  rationale: אֵל חָי అనే నిర్దిష్టమైన బిరుదును సహజంగా వ్యక్తం చేస్తూ, దేవుడు జీవముగలవాడనే భావాన్ని నిలుపుతుంది.
- source_word: מָתַי
  choice: ఎప్పుడు
  rationale: నెరవేర్పు సమయాన్ని నేరుగా ప్రశ్నించే మూలపదానికి సరళమైన సమానం; ‘ఇంకెంతకాలానికి’ అనే అదనపు విలాప ఛాయను చేర్చదు.
- source_word: אָבוֹא
  choice: నేను ఎప్పుడు వచ్చి
  rationale: ప్రశ్నలో ఎదురుచూస్తున్న భవిష్యత్ రాకను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וְאֵרָאֶה
  choice: కనిపిస్తాను
  rationale: మసొరేటిక్ స్వరప్రయోగంలోని నిఫాల్ రూపానికి అనుగుణంగా ‘కనిపించుట/హాజరగుట’ అనే భావాన్ని నిలుపుతుంది; ‘చూస్తాను’ అనే భిన్న పఠనాన్ని ప్రధాన పాఠ్యంలో స్వీకరించదు.
- source_word: פְּנֵי אֱלֹהִים
  choice: దేవుని సన్నిధిలో
  rationale: అక్షరార్థంగా ‘దేవుని ముఖం’ అయిన ఈ నుడికారం దేవుని సమక్షంలో, ముఖ్యంగా ఆరాధనకు, హాజరవడాన్ని సూచిస్తుంది. ‘సన్నిధిలో’ తెలుగులో ఆ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: פְּנֵי אֱלֹהִים నుడికారపు అనువాదం
  choice: దేవుని సన్నిధిలో
  alternative: దేవుని ముఖం ఎదుట
  rationale: వాక్యం దేవుని సమక్షానికి, బహుశా ఆరాధనలో, చేరాలనే ఆకాంక్షను తెలియజేస్తుంది. ‘సన్నిధిలో’ అనడం దేవుని స్వరూపాన్ని భౌతికంగా చూడటం గురించిన నిర్ణయాన్ని అనవసరంగా రుద్దకుండా నుడికారపు భావాన్ని అందిస్తుంది; అక్షరార్థం పాదసూచికలో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక గౌరవభావాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదప్రయోగం. ‘ప్రాణం’ హీబ్రూ కవితా నుడికారాన్ని, ‘దాహంతో ఉంది’ మూలంలోని స్పష్టమైన రూపకాన్ని కాపాడుతాయి.
