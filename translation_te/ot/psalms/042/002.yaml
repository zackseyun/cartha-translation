- from: నా ప్రాణం దేవునికోసం, సజీవుడైన దేవునికోసం దాహంతో ఉంది. నేను ఎప్పుడు వచ్చి దేవుని సన్నిధిలో కనిపిస్తాను?[a]
  to: నా ప్రాణం దేవునికోసం, సజీవుడైన దేవునికోసం దాహంతో ఉంది. నేను ఎప్పుడు వచ్చి దేవుని సన్నిధిలో హాజరవుతాను?[a]
  rationale: The revision clarifies the Hebrew Niphal verb in natural modern Telugu as appearing or presenting oneself in God's presence. The main text retains the concrete thirst metaphor, the poetic ‘నా ప్రాణం,’ and the idiomatic sense of God’s face/presence. The footnote now accurately preserves the literal lexical alternative.
