id: PSA.42.1
reference: Psalms 42:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כְּ/אַיָּ֗ל תַּעֲרֹ֥ג עַל אֲפִֽיקֵי מָ֑יִם כֵּ֤ן נַפְשִׁ֨/י תַעֲרֹ֖ג אֵלֶ֣י/ךָ אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/001.yaml
  text: As a deer longs for streams of water[a], so my soul longs for you[c][b], O God.
translation:
  language: te
  text: నీటి ప్రవాహాల కోసం జింక ఎంతగా తహతహలాడుతుందో[a], దేవా, నీ కోసం నా ప్రాణం[b] అంతగా తహతహలాడుతోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తీవ్ర దప్పికతో రొప్పుతున్నట్లుగా’ అని కూడా అనువదించవచ్చు; హీబ్రూ క్రియ దప్పికలాంటి తీవ్రమైన ఆకాంక్షను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నా ప్రాణం’ అనే మాటను ‘నా జీవం,’ ‘నా అంతరంగం,’ లేదా ‘నేనే’ అనే భావంలోనూ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/אַיָּל
  choice: జింక ఎంతగా ... ఉంటుందో
  rationale: אַיָּל మగ జింకను ప్రత్యేకంగా సూచించగలిగినా, సాధారణ పాఠకులకు సహజంగా ఉండే ‘జింక’ మూలంలోని ఉపమానాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: תַּעֲרֹג
  choice: తహతహలాడు
  rationale: ఈ క్రియ దప్పికతో కూడిన తీవ్రమైన ఆకాంక్షను వ్యక్తం చేస్తుంది. ‘తహతహలాడు’ శారీరక రొప్పుడుకే పరిమితం కాకుండా ఆ తీవ్రతను సహజమైన తెలుగులో అందిస్తుంది.
- source_word: אֲפִיקֵי מָיִם
  choice: నీటి ప్రవాహాలు
  rationale: ఈ పదబంధం నీరు ప్రవహించే కాలువలు, వాగులు లేదా ప్రవాహాలను సూచించగలదు; ‘నీటి ప్రవాహాలు’ బహువచన చిత్రాన్ని విశాలంగా కాపాడుతుంది.
- source_word: כֵּן
  choice: అంతగా
  rationale: మొదటి అర్ధపాదంలోని ఉపమానానికి రెండవ అర్ధపాదాన్ని సహజమైన తెలుగు పోలిక నిర్మాణంతో అనుసంధానిస్తుంది.
- source_word: נַפְשִׁי
  choice: నా ప్రాణం
  rationale: נֶפֶשׁ జీవం, స్వయం, అంతరంగం అనే విస్తృత భావాలను కలిగి ఉంది. ‘నా ప్రాణం’ కవితాత్మకంగా, సహజంగా ఉండి మొత్తం వ్యక్తిత్వాన్ని సూచించే సామర్థ్యాన్ని నిలుపుతుంది.
- source_word: אֵלֶיךָ
  choice: నీ కోసం
  rationale: అక్షరార్థంగా ‘నీ వైపు/నీ వద్దకు’ అనే దిశాభావం ఉన్నా, ఆకాంక్షను తెలిపే తెలుగు క్రియతో ‘నీ కోసం’ సహజంగా ఉంటుంది.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ప్రత్యక్ష సంబోధనను ఆధునిక, గౌరవప్రదమైన తెలుగు రూపంలో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: נַפְשִׁי అనే పదంలోని మానవ స్వరూప సంబంధమైన విస్తృతి
  choice: నా ప్రాణం
  alternative: నా అంతరంగం / నేనే
  rationale: మూలపదం శరీరానికి వేరైన ఒక భాగాన్ని మాత్రమే తప్పనిసరిగా సూచించదు; జీవం లేదా సంపూర్ణ వ్యక్తిని కూడా సూచించగలదు. ‘నా ప్రాణం’ భక్తి-కవితా ధ్వనిని నిలుపుతూ ఆ విస్తృతిని పూర్తిగా మూసివేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన కవితా శైలి. ఉపమానంలోని తీవ్రతను ‘తహతహలాడు’ ద్వారా, ప్రత్యక్ష ప్రార్థనా సంబోధనను ‘దేవా’ ద్వారా నిలిపింది.
