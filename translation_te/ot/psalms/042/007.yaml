source:
  edition: WLC
  text: תְּהֽוֹם אֶל תְּה֣וֹם ק֭וֹרֵא לְ/ק֣וֹל צִנּוֹרֶ֑י/ךָ כָּֽל מִשְׁבָּרֶ֥י/ךָ וְ֝/גַלֶּ֗י/ךָ עָלַ֥/י עָבָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/007.yaml
  text: Deep calls to deep at the sound of your waterfalls[b][a]; all your breakers and your waves have passed over me.
translation:
  language: te
  text: 'నీ జలపాతాల[a] ఘోష వినబడగా అగాధం అగాధాన్ని పిలుస్తోంది;

    నీ విరిగిపడే అలలన్నీ, నీ తరంగాలన్నీ

    నా మీదుగా దాటిపోయాయి.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ జలమార్గాల’; ఈ హెబ్రీ పదం ప్రవాహనాళాలు లేదా ఉద్ధృత జలధారలను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీ విరిగిపడే అలలన్నీ, నీ ఉప్పొంగే తరంగాలన్నీ నా మీదుగా కొట్టుకొచ్చాయి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהוֹם ... תְּהוֹם
  choice: అగాధం ... అగాధాన్ని
  rationale: תְּהוֹם సూచించే లోతైన జలరాశి లేదా అగాధం అనే భావాన్ని, పునరుక్తితో కూడిన కవితాత్మక బలాన్ని కాపాడుతూ వ్యక్తం చేస్తుంది.
- source_word: קוֹרֵא
  choice: పిలుస్తోంది
  rationale: వర్తమానంలో సజీవంగా జరుగుతున్న కవితాత్మక దృశ్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְקוֹל
  choice: ఘోషకు
  rationale: ఇక్కడి לְקוֹל‌ను జలపాతాల బలమైన శబ్దం వినిపించే సందర్భం లేదా ప్రేరణగా సంక్షిప్తంగా, కవితాత్మకంగా వ్యక్తం చేస్తుంది.
- source_word: צִנּוֹרֶיךָ
  choice: నీ జలపాతాల
  rationale: ఈ పదం జలమార్గాలు, ప్రవాహనాళాలు లేదా ఉద్ధృతంగా పడే నీటిని సూచించవచ్చు. చుట్టూ ఉన్న ఉప్పొంగే జలాల చిత్రణలో ‘జలపాతాలు’ శబ్దాన్నీ శక్తినీ ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; ఇతర సాధ్యార్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: כָּל מִשְׁבָּרֶיךָ
  choice: నీ విరిగిపడే అలలన్నీ
  rationale: מִשְׁבָּרֶיךָ అనేది విరిగి పడే సముద్రపు అలలను సూచిస్తుంది. ‘అన్నీ’ మూలంలోని సంపూర్ణతను నిలుపుతుంది.
- source_word: וְגַלֶּיךָ
  choice: నీ తరంగాలన్నీ
  rationale: גַּל‌కు సాధారణ అర్థమైన అల లేదా తరంగాన్ని సహజంగా వ్యక్తం చేస్తూ, ముందున్న విరిగిపడే అలలతో స్వల్ప పదభేదాన్ని కాపాడుతుంది.
- source_word: עָלַי עָבָרוּ
  choice: నా మీదుగా దాటిపోయాయి
  rationale: జలాలు కీర్తనకర్తను పూర్తిగా ముంచి అతని మీదుగా వెళ్లిన అనుభూతిని, పూర్తయిన క్రియ యొక్క బలంతో తెలియజేస్తుంది.
theological_decisions:
- issue: జలాల యజమాన్యాన్ని దేవునితో అనుసంధానించే ద్వితీయ పురుష ఏకవచన ప్రత్యయాలు
  choice: ‘నీ జలపాతాలు’, ‘నీ ... అలలు’, ‘నీ తరంగాలు’ అని స్పష్టంగా నిలుపడం
  alternative: యజమాన్యాన్ని వదిలి కేవలం ‘జలపాతాలు’, ‘అలలు’ అని అనువదించడం
  rationale: మూలంలోని ప్రతి -ךָ ప్రత్యయం ఈ విపత్తు జలాలను సంబోధించబడుతున్న దేవునితో అనుసంధానిస్తుంది. ఆ ఉద్విగ్నమైన దైవశాస్త్రీయ భావాన్ని మృదువుపరచకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని ఉపయోగించింది. ‘అగాధం అగాధాన్ని’ అనే పునరుక్తి మూలంలోని ధ్వని, సమాంతరతను నిలుపుతుంది. సముద్రపు ఉద్ధృత జలాల చిత్రణ స్పష్టంగా ఉండేలా సాధారణ పదాలను ఎంచుకుంది; అయితే మూలంలోని పదార్థ అనిశ్చితిని పాదసూచికలో భద్రపరిచింది.
