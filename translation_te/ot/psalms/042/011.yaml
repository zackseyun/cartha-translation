source:
  edition: WLC
  text: מַה תִּשְׁתּ֬וֹחֲחִ֨י נַפְשִׁ/י֮ וּֽ/מַה תֶּהֱמִ֪י עָ֫לָ֥/י הוֹחִ֣ילִי לֵֽ֭/אלֹהִים כִּי ע֣וֹד אוֹדֶ֑/נּוּ יְשׁוּעֹ֥ת פָּ֝נַ֗/י וֵֽ/אלֹהָֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/011.yaml
  text: Why are you cast down[a], my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him[b], the salvation of my countenance and my God.
translation:
  language: te
  text: నా ప్రాణమా, నీవెందుకు కుంగిపోయావు? నాలో ఎందుకు కలవరపడుతున్నావు? దేవునికోసం ఆశతో ఎదురుచూడు; నా ముఖానికి రక్షణగా ఉన్న నా దేవుణ్ణి[a] నేను మళ్లీ స్తుతిస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధం అక్షరార్థంగా, “నా ముఖపు రక్షణలు మరియు నా దేవుడు.” దీనిని “నా ముఖాన్ని ఉద్ధరించే సహాయకుడు, నా దేవుడు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: కుంగిపోయావు
  rationale: వంగిపోవడం, దిగులుతో అణగిపోవడం అనే రూపకాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: נַפְשִׁי
  choice: నా ప్రాణమా
  rationale: కీర్తనలో తన అంతరంగాన్నే సంబోధించే కవితాత్మక ప్రయోగాన్ని నిలుపుతుంది.
- source_word: תֶּהֱמִי עָלָי
  choice: నాలో ఎందుకు కలవరపడుతున్నావు
  rationale: మూలంలోని అల్లకల్లోలం లేదా ఘోష భావాన్ని, עָלַי యొక్క సందర్భానుగుణ అంతరంగ అర్థంతో సహజంగా తెలుపుతుంది.
- source_word: הוֹחִילִי לֵאלֹהִים
  choice: దేవునికోసం ఆశతో ఎదురుచూడు
  rationale: యחל హిఫీల్ రూపంలోని ఎదురుచూపు, ఆశాభావం రెండింటినీ నిలుపుతుంది; לְ ను ఆ ఎదురుచూపు యొక్క లక్ష్యంగా వ్యక్తం చేస్తుంది.
- source_word: עוֹד אוֹדֶנּוּ
  choice: నేను మళ్లీ స్తుతిస్తాను
  rationale: ప్రస్తుత దుఃఖం తరువాత పునరుద్ధరించబడే స్తుతిపై నమ్మకాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יְשׁוּעוֹת פָּנַי
  choice: నా ముఖానికి రక్షణయైన
  rationale: బహువచన రూపాన్ని సందర్భానుగుణ సమష్టి భావంగా తీసుకొని, 'నా ముఖం' అనే మూల చిత్రాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది.
- source_word: וֵאלֹהָי
  choice: నా దేవుణ్ణి
  rationale: ఈ పదబంధాన్ని ముందున్న రక్షణ పదంతో కలిసి దేవునికి వర్తించే సమాసార్థంగా సహజ తెలుగులో అమర్చింది.
theological_decisions:
- issue: יְשׁוּעוֹת פָּנַי యొక్క అర్థం
  choice: నా ముఖానికి రక్షణయైన నా దేవుడు
  alternative: నా ముఖాన్ని ఉద్ధరించే సహాయకుడైన నా దేవుడు
  rationale: హీబ్రూ పదబంధం సంక్షిప్తంగా, కొంత అస్పష్టంగా ఉంది. ప్రధాన పాఠం 'ముఖం' మరియు 'రక్షణ' అనే చిత్రాలను నిలుపుతూ, దేవుడే ఆ రక్షణ అని వ్యాకరణ సంబంధాన్ని చూపుతుంది; ముఖం కుంగిన స్థితి నుంచి లేవడం అనే భావాన్ని వివరణగా పాఠ్యంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కీర్తనా శైలిని పాటించాం. ఆత్మసంబోధనలో సాంప్రదాయబద్ధమైనప్పటికీ సులభంగా అర్థమయ్యే ‘నా ప్రాణమా’ను వాడాం. మూలంలోని ముఖం–రక్షణ చిత్రాన్ని పూర్తిగా సవరించకుండా, పాదం అర్థమయ్యేలా వాక్య నిర్మాణాన్ని సహజీకరించాం.
