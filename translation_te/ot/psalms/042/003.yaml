source:
  edition: WLC
  text: הָֽיְתָה לִּ֬/י דִמְעָתִ֣/י לֶ֭חֶם יוֹמָ֣ם וָ/לָ֑יְלָה בֶּ/אֱמֹ֥ר אֵלַ֥/י כָּל הַ֝/יּ֗וֹם אַיֵּ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/003.yaml
  text: My tears have been my bread day and night[a], while they say to me all day long, “Where is your God?”
translation:
  language: te
  text: నా కన్నీళ్లు పగలూ రాత్రీ నాకు రొట్టెగా అయ్యాయి[a]; రోజంతా వారు నాతో, “నీ దేవుడు ఎక్కడ?” అని అంటూనే ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో ‘నా కన్నీరు నాకు రొట్టె అయింది’ అని ఏకవచనంలో ఉంది; హీబ్రూలో ఆ ఏకవచనం సమష్ట్యర్థంలో ‘కన్నీళ్లు’ను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיְתָה לִּי
  choice: నాకు ... అయ్యాయి
  rationale: היה + ל నిర్మాణం వక్తకు ఏదో ఒకటి ఏ స్థితిలో లేదా పాత్రలో ఉందో సూచిస్తుంది. తెలుగులో ‘నాకు ... అయ్యాయి’ అనేది ఆ ఫలితస్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דִמְעָתִי
  choice: నా కన్నీళ్లు
  rationale: హీబ్రూలో రూపపరంగా ఏకవచనమైనా, ఇక్కడ సమష్ట్యర్థంలో వాడబడింది. విలాప సందర్భానికి సహజంగా ఉండే తెలుగు బహువచనం మూల భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לֶחֶם
  choice: ఆహారం
  rationale: לֶחֶם పదానికి ప్రాథమికంగా ‘రొట్టె’ అనే అర్థం ఉన్నా, విస్తృతంగా జీవనాహారం అనే భావమూ ఉంది. కన్నీళ్లే తనకు తిండి అయినట్లు చెప్పే రూపకాన్ని ఆధునిక తెలుగులో సహజంగా నిలపడానికి ‘ఆహారం’ ఎంచుకోబడింది.
- source_word: יוֹמָם וָלָיְלָה
  choice: రాత్రింబగళ్లు
  rationale: ఇది నిరంతర కాలాన్ని సూచించే ద్వంద్వప్రయోగం. ‘రాత్రింబగళ్లు’ తెలుగులో సహజంగా నిరంతరత్వాన్ని తెలియజేస్తుంది; మూలంలోని ‘పగలు-రాత్రి’ క్రమం తెలుగులో స్థిరమైన నుడికారానికి అనుగుణంగా మారింది.
- source_word: בֶּאֱמֹר
  choice: అని అంటూనే ఉన్నారు
  rationale: ב + క్రియానామ రూపం సమకాలీనంగా కొనసాగుతున్న చర్యను సూచిస్తుంది. ‘అంటూనే ఉన్నారు’ కన్నీళ్లతో పాటు సాగిన పునరావృత అపహాస్యాన్ని తెలియజేస్తుంది.
- source_word: אֵלַי
  choice: నాతో
  rationale: మాట వక్తవైపు ఉద్దేశించబడిందని సహజ తెలుగులో ‘నాతో ... అన్నారు’ నిర్మాణం తెలియజేస్తుంది.
- source_word: כָּל הַיּוֹם
  choice: రోజంతా
  rationale: రోజు పొడవునా పునరావృతమయ్యే లేదా కొనసాగే చర్యను సంక్షిప్తమైన ఆధునిక తెలుగు నుడికారం వ్యక్తం చేస్తుంది.
- source_word: אַיֵּה
  choice: ఎక్కడ?
  rationale: దేవుని ప్రత్యక్ష సహాయం కనిపించకపోవడాన్ని ప్రశ్నించే సూటి అపహాస్యాన్ని ఎలాంటి వివరణాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: రెండవ పురుష ఏకవచన స్వామ్యాన్ని నేరుగా నిలుపుతూ, కీర్తనకర్త ఆరాధించే దేవునినే సూచిస్తుంది.
theological_decisions:
- issue: అపహాసకుల ప్రశ్న స్వభావం
  choice: “నీ దేవుడు ఎక్కడ?” అనే ప్రత్యక్ష ప్రశ్నగా అనువదించడం
  alternative: “నీ దేవునికి ఏమైంది?” అని వ్యాఖ్యానాత్మకంగా విస్తరించడం
  rationale: హీబ్రూ మూలం దేవుని ప్రత్యక్ష సహాయం కనిపించకపోవడంలోని ఉద్రిక్తతను ‘ఎక్కడ?’ అనే ప్రశ్న ద్వారానే ఉంచుతుంది. అనువాదం ఆ దైవిక గైర్హాజరీ భావాన్ని పరిష్కరించకుండా, మూలంలోని ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన విలాప శైలి. ‘రాత్రింబగళ్లు’, ‘రోజంతా’, ‘అంటూనే ఉన్నారు’ అనే ప్రయోగాలు నిరంతర వేదనను సహజంగా వ్యక్తం చేస్తాయి.
