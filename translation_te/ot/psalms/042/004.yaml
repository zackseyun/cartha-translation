source:
  edition: WLC
  text: אֵ֤לֶּה אֶזְכְּרָ֨ה וְ/אֶשְׁפְּכָ֬ה עָלַ֨/י נַפְשִׁ֗/י כִּ֤י אֶֽעֱבֹ֨ר בַּ/סָּךְ֮ אֶדַּדֵּ֗/ם עַד בֵּ֥ית אֱלֹ֫הִ֥ים בְּ/קוֹל רִנָּ֥ה וְ/תוֹדָ֗ה הָמ֥וֹן חוֹגֵֽג׀׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/004.yaml
  text: 'These things I remember[a], and I pour out my soul within me: how I used to pass along with the throng, leading them to the house of God with the sound of joyful shouting and thanksgiving[b], a festal multitude.'
translation:
  language: te
  text: 'ఈ సంగతులను నేను జ్ఞాపకం చేసుకొని, నా ప్రాణాన్ని నాలోనే కుమ్మరించుకుంటాను: నేను జనసమూహంతో[a] కలిసి ఎలా సాగుతూ, వారిని దేవుని మందిరం వరకు నడిపించేవాడినో[b]—ఆనంద నినాదాలూ కృతజ్ఞతాస్తుతుల ధ్వనులతో కూడిన పండుగ జనసమూహంతో.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “జనసమూహంతో” అనే చోట “ఊరేగింపు సమూహంలో” అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ పదం בַּסָּךְ క్లిష్టమైనది; అది పండుగకు కూడిన జనసమూహాన్నో, ఊరేగింపు బృందాన్నో సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “నడిపించేవాడినో” అనే చోట “వారితో కలిసి వెళ్లేవాడినో” లేదా “వారికి దారి చూపేవాడినో” అని కూడా అనువదించవచ్చు. హీబ్రూ క్రియ אֶדַּדֵּם అరుదైనది; దాని ఖచ్చితమైన సూక్ష్మభావం అనిశ్చితమైనప్పటికీ, సందర్భం ఇతరులతో కలిసి దేవుని మందిరం వైపు సాగే కదలికను స్పష్టంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה אֶזְכְּרָה
  choice: ఈ విషయాలను నేను జ్ఞాపకం చేసుకుంటున్నాను
  rationale: బహువచన సూచకపదాన్ని నిలిపి, కావ్య సందర్భంలోని ప్రస్తుత స్మరణ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְאֶשְׁפְּכָה עָלַי נַפְשִׁי
  choice: నా అంతరంగాన్ని కుమ్మరిస్తున్నాను
  rationale: అక్షరార్థమైన ‘నా ప్రాణాన్ని నాపై కుమ్మరిస్తున్నాను’ తెలుగులో అసహజం. అంతర్గత భావోద్వేగాన్ని పూర్తిగా వెలిబుచ్చే హీబ్రూ నుడికారాన్ని ‘అంతరంగాన్ని కుమ్మరించు’గా అందించింది.
- source_word: כִּי אֶעֱבֹר בַּסָּךְ
  choice: ఉత్సవ జనసమూహంతో కలిసి నేను వెళ్లి
  rationale: כִּי ఇక్కడ జ్ఞాపకంలోని విషయాన్ని పరిచయం చేస్తుంది. క్లిష్టమైన בַּסָּךְను సందర్భానుసారం యాత్రికుల లేదా ఉత్సవ ఊరేగింపు సమూహంగా గ్రహించింది; అనిశ్చితిని పాదసూచికలో తెలిపింది.
- source_word: אֶדַּדֵּם
  choice: జనసమూహాన్ని ... నడిపించిన
  rationale: అరుదైన క్రియకు నాయకత్వం వహించడం లేదా వారితో వెళ్లడం అనే భావాలు సాధ్యం. ప్రత్యక్ష కర్మ బహువచన ప్రత్యయాన్ని ప్రతిబింబిస్తూ ప్రధాన పాఠంలో ‘నడిపించిన’ను ఎంచుకుంది; ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: עַד בֵּית אֱלֹהִים
  choice: దేవుని మందిరానికి
  rationale: యాత్ర గమ్యాన్ని సహజంగా తెలుపుతుంది. ‘దేవుని ఇల్లు’ సాధ్యమైనా, ఈ సందర్భంలో ఆలయార్థాన్ని సాధారణ తెలుగు పాఠకునికి స్పష్టంగా అందించేందుకు ‘మందిరం’ వాడింది.
- source_word: בְּקוֹל רִנָּה וְתוֹדָה
  choice: ఆనంద నినాదాలూ కృతజ్ఞతాస్తుతులూ మారుమోగుతుండగా
  rationale: קוֹל యొక్క శ్రావ్య భావాన్ని ‘మారుమోగు’ ద్వారా, רִנָּה యొక్క బాహ్య ఆనంద కేకను ‘ఆనంద నినాదాలు’గా, תוֹדָהను కృతజ్ఞతతో కూడిన స్తుతిగా అందించింది.
- source_word: הָמוֹן חוֹגֵג
  choice: పండుగ జరుపుకునే జనసమూహం
  rationale: ‘సమూహం’ మరియు ‘పండుగ ఆచరించడం/జరుపుకోవడం’ అనే రెండు మూలభావాలను సహజమైన తెలుగులో నిలిపింది.
