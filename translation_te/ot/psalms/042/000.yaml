  text: For the choirmaster[a]. A Maskil[b] of the sons of Korah[c].
translation:
  language: te
  text: సంగీత నాయకుని కోసం[a]. కోరహు కుమారుల[c] మస్కీల్[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సంగీత నాయకునికి.’ కీర్తనల శీర్షికల్లోని హీబ్రూ ఉపసర్గను ఈ రెండు విధాలుగా అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘మస్కీల్’ కీర్తనల శీర్షికల్లో కనిపించే సాంకేతిక పదం. దాని ఖచ్చితమైన అర్థం అనిశ్చితం; ‘ధ్యాన గీతం,’ ‘బోధనాత్మక రచన’ వంటి అర్థాలు సూచించబడ్డాయి.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘కోరహు కుమారుల కోసం.’ ఈ శీర్షిక రచయితృత్వాన్ని, వారితో అనుబంధాన్ని లేదా వారు పాడేందుకు ఉద్దేశించబడిందనే భావాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకుని కోసం
  rationale: కీర్తనల శీర్షికల్లో ఈ పదం సంగీత నిర్వహణ బాధ్యత వహించే నాయకుణ్ణి సూచిస్తుంది. ל ఉపసర్గకు ఇక్కడ ఉద్దేశార్థాన్ని ఇచ్చే ‘కోసం’ సహజంగా ఉంది; దిశార్థం కూడా సాధ్యమేనని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: מַשְׂכִּיל
  choice: మస్కీల్
  rationale: ఇది కీర్తన శీర్షికల్లోని సాంకేతిక పదం; ఖచ్చితమైన అర్థం అనిశ్చితం. వివాదాస్పద అర్థాన్ని నిర్ణయించకుండా హీబ్రూ పదాన్ని లిప్యంతరీకరించాం.
- source_word: לִבְנֵי
  choice: కుమారుల
  rationale: శీర్షికల్లో ל ఉపసర్గ రచన, అనుబంధం లేదా ప్రదర్శనకు నియామకం అనే భావాల్లో ఉండవచ్చు. తెలుగు షష్ఠీ సంబంధ రూపం ఈ పరిధిని కొంతవరకు తెరిచి ఉంచుతుంది; ప్రత్యామ్నాయం పాదటిప్పణిలో ఇచ్చాం.
- source_word: קֹרַח
  choice: కోరహు
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: కోరహు కుమారులతో కీర్తనకు ఉన్న సంబంధం
  choice: కోరహు కుమారుల
  alternative: కోరహు కుమారుల కోసం
  rationale: మూలంలోని ל రచయితృత్వం, అనుబంధం లేదా ఉద్దేశిత గాయకులను సూచించవచ్చు. ప్రధాన పాఠం సంబంధాన్ని విస్తృతంగా ఉంచుతుంది; ప్రత్యామ్నాయ పఠనం పాదటిప్పణిలో ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక, గౌరవప్రదమైన తెలుగు. శీర్షికకు తగిన సంక్షిప్త నిర్మాణం వాడాం. అర్థం అనిశ్చితమైన సాంకేతిక పదాన్ని అనువాదంతో అతిగా నిర్ణయించకుండా లిప్యంతరీకరించాం; ప్రతి పాదటిప్పణి గుర్తు సంబంధిత పదం దగ్గరే ఉంచాం.
