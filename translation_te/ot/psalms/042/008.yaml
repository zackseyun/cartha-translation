source:
  edition: WLC
  text: יוֹמָ֤ם יְצַוֶּ֬ה יְהוָ֨ה חַסְדּ֗/וֹ וּ֭/בַ/לַּיְלָה שיר/ה עִמִּ֑/י תְּ֝פִלָּ֗ה לְ/אֵ֣ל חַיָּֽ/י׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/008.yaml
  text: By day Yahweh commands his steadfast love[b][a], and at night his song is with me— a prayer to the God of my life.
translation:
  language: te
  text: 'పగటివేళ యాహ్వే తన స్థిరమైన ప్రేమను ఆజ్ఞాపిస్తాడు;

    రాత్రివేళ ఆయన గీతం[a] నాతో ఉంటుంది—

    నా జీవితానికి దేవుడైనవానికి ప్రార్థన.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనకు ఒక గీతం నాతో ఉంటుంది.” హెబ్రీ పదాన్ని సంబంధార్థ ప్రత్యయం లేకుండా తీసుకుంటే ఈ పఠనం సాధ్యం; ప్రధాన పాఠం “ఆయన గీతం” అనే పఠనాన్ని అనుసరిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹמָם
  choice: పగటివేళ
  rationale: కాలాన్ని సూచించే క్రియావిశేషణంగా ఉన్న హెబ్రీ పదాన్ని, రాత్రివేళ అనే సమాంతర పదబంధానికి సరిపోయే సహజమైన తెలుగులో అందిస్తుంది.
- source_word: יְצַוֶּה
  choice: ఆజ్ఞాపిస్తాడు
  rationale: צוה పియేల్ రూపంలోని బలమైన, సజీవమైన భావాన్ని నిలుపుతుంది; యాహ్వే తన ప్రేమను కార్యరంగంలోకి పంపుతున్నట్లుగా కవితాత్మకంగా చిత్రిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హెబ్రీ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితపరమైన ఉచ్చారణను తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: חַסְדּוֹ
  choice: తన స్థిరమైన ప్రేమను
  rationale: חסד లోని నమ్మకమైన, నిలకడగల ప్రేమ మరియు కరుణ భావాలను సాధారణ ఆధునిక తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: וּבַלַּיְלָה
  choice: రాత్రివేళ
  rationale: పగటివేళ అనే మొదటి కాలపదంతో సహజమైన కవితా సమాంతరాన్ని ఏర్పరుస్తుంది; వావ్ సంధి తెలుగు పంక్తి నిర్మాణంలో అంతర్లీనంగా ఉంది.
- source_word: שירה
  choice: ఆయన గీతం
  rationale: సాంప్రదాయికంగా గుర్తించబడిన మూడవ పురుష ఏకవచన సంబంధార్థాన్ని అనుసరించి ‘ఆయన గీతం’ అని తీసుకుంది; వేరొక వ్యాకరణ పఠనాన్ని పాదసూచికలో నిలిపింది.
- source_word: עִמִּי
  choice: నాతో ఉంటుంది
  rationale: హెబ్రీలో అంతర్లీనంగా ఉన్న అస్తిత్వ భావాన్ని తెలుగులో అవసరమైన క్రియతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תְּפִלָּה
  choice: చేసే ప్రార్థన
  rationale: ముందున్న గీతాన్ని వివరిస్తున్న అనుబంధ భావాన్ని స్పష్టంగా, అయినా సంక్షిప్తంగా తెలుపుతుంది.
- source_word: לְאֵל חַיָּי
  choice: నా జీవపు దేవునికి
  rationale: ‘నా జీవపు దేవుడు’ అనే హెబ్రీ సంబంధ నిర్మాణాన్ని వ్యాఖ్యానాత్మకంగా విప్పకుండా సాధ్యమైనంత దగ్గరగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామపు అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా, Yahweh ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణను ఉపయోగించింది.
- issue: לְאֵל חַיָּי లో חַיָּי భావం
  choice: నా జీవపు దేవునికి
  alternative: నాకు జీవమిచ్చే దేవునికి / జీవముగల దేవునికి
  rationale: ఇక్కడి రూపం ‘సజీవుడైన’ అనే విశేషణం కాదు; మొదటి పురుష ప్రత్యయంతో ‘నా జీవం’ అని అర్థమిచ్చే నామరూపం. అందువల్ల సమీప సందర్భంలోని ‘జీవముగల దేవుడు’ అనే మాటతో సమన్వయపరచలేదు.
- issue: שירה యొక్క వ్యాకరణ పఠనం
  choice: ఆయన గీతం
  alternative: ఆయనకు ఒక గీతం
  rationale: ప్రధాన పాఠం దీనిని దేవునికి చెందిన లేదా దేవుని నుండి వచ్చే గీతంగా తీసుకుంటుంది; ప్రత్యయార్థం లేని పఠనం సాధ్యమనే అస్పష్టతను పాదసూచికలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కవితా శైలిని ఉపయోగించింది. పగలు–రాత్రి సమాంతరాన్ని మూడు చిన్న పంక్తుల్లో నిలిపింది. ‘ఆజ్ఞాపిస్తాడు’ అనే ఉద్దేశపూర్వకంగా బలమైన క్రియ మూలంలోని కవితాత్మక ఉద్వేగాన్ని కాపాడుతుంది; ‘నా జీవపు దేవుడు’ కొద్దిగా అసాధారణమైనా మూలంలోని సంబంధ నిర్మాణం మరియు దాని దైవశాస్త్రపరమైన ఉద్రిక్తతను నిలుపుతుంది.
