  text: מַה בֶּ֥צַע בְּ/דָמִ/י֮ בְּ/רִדְתִּ֪/י אֶ֫ל שָׁ֥חַת הֲ/יוֹדְ/ךָ֥ עָפָ֑ר הֲ/יַגִּ֥יד אֲמִתֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/009.yaml
  text: What profit is there in my blood[c][b][a], in my going down to the pit? Will the dust praise you? Will it declare your faithfulness?
translation:
  language: te
  text: నా రక్తంలో[a] లాభమేముంది—నేను గోతిలోకి[b] దిగిపోతుండగా? ధూళి నిన్ను స్తుతిస్తుందా? అది నీ నమ్మకత్వాన్ని[c] ప్రకటిస్తుందా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా మరణంలో.’ హీబ్రూ అక్షరార్థంగా, ‘నా రక్తంలో’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘సమాధిలోకి.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘నీ సత్యాన్ని.’ హీబ్రూ పదానికి ‘సత్యం,’ ‘నమ్మకత్వం’ అనే రెండు అర్థాలూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה בֶּצַע
  choice: లాభమేముంది
  rationale: లాభం లేదా ప్రయోజనం ఏమిటని ప్రశ్నించే హీబ్రూ నుడికారంలోని సంక్షిప్తమైన అలంకారిక బలాన్ని నిలుపుతుంది.
- source_word: בְּדָמִי
  choice: నా రక్తంలో
  rationale: హీబ్రూలోని స్పష్టమైన ‘నా రక్తంలో’ అనే మరణచిత్రాన్ని వ్యాఖ్యానించి ‘నా మరణంలో’గా మార్చకుండా ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: בְּרִדְתִּי אֶל שָׁחַת
  choice: నేను గోతిలోకి దిగిపోతే
  rationale: మరణం వైపు దిగిపోవడమనే హీబ్రూ కవితాత్మక చిత్రాన్ని సహజమైన ఆధునిక తెలుగు షరతు నిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: שָׁחַת
  choice: గోతి
  rationale: సమాధి లేదా మరణలోకాన్ని సూచించే మూలరూపకాన్ని నిలుపుతుంది; ‘సమాధి’ అనేది సందర్భానుసారమైన వ్యాఖ్యాన ప్రత్యామ్నాయం.
- source_word: הֲיוֹדְךָ עָפָר
  choice: ధూళి నిన్ను స్తుతిస్తుందా
  rationale: ידה అనే క్రియకు కీర్తనల ఆరాధనా సందర్భంలో ‘స్తుతించు’ సహజం; עָפָרను మృత మానవునికి రూపకంగా వ్యాఖ్యానించకుండా ‘ధూళి’గానే ఉంచుతుంది.
- source_word: הֲיַגִּיד
  choice: అది ... ప్రకటిస్తుందా
  rationale: దేవుని గుణాన్ని బహిరంగంగా తెలియజేయడమనే భావాన్ని గంభీరమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: אֲמִתֶּךָ
  choice: నీ నమ్మకత్వాన్ని
  rationale: אמתకు సత్యం, విశ్వసనీయత, నమ్మకత్వం అనే భావాలు ఉన్నాయి; దేవుని స్థిరమైన స్వభావాన్ని ఉద్దేశించే ఈ ప్రార్థనా సందర్భంలో ‘నమ్మకత్వం’ సరిపోతుంది, కాగా ‘సత్యం’ అనే అసలైన సందిగ్ధతను పాదటిప్పణిలో ఉంచుతుంది.
theological_decisions:
- issue: మరణాన్ని స్పష్టంగా వ్యాఖ్యానించాలా, లేక కవితాత్మక చిత్రాలను నిలుపాలా
  choice: ‘రక్తం,’ ‘గోతి,’ ‘ధూళి’ అనే స్పష్టమైన చిత్రాలను ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘మరణం,’ ‘సమాధి,’ ‘మృతులు’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: కీర్తనకర్త మరణిస్తే దేవుణ్ణి స్తుతించి ఆయన నమ్మకత్వాన్ని ప్రకటించలేడనే వాదనను హీబ్రూ సజీవమైన మరణచిత్రాల ద్వారా వ్యక్తపరుస్తుంది. వాటిని నిలపడం వేదాంతపరమైన ఉద్రిక్తతను ముందుగానే పరిష్కరించదు.
- issue: אֲמִתֶּךָ పదంలోని అర్థ వైవిధ్యం
  choice: ప్రధాన పాఠ్యంలో ‘నీ నమ్మకత్వాన్ని’
  alternative: ‘నీ సత్యాన్ని’
  rationale: సందర్భంలో దేవుని స్థిరత్వం, విశ్వసనీయత అనే సంబంధపరమైన భావం బలంగా ఉంది; అయినా ‘సత్యం’ కూడా నిజమైన పదార్థం కాబట్టి పాదటిప్పణిలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తనా కవిత్వానికి తగిన గంభీరతను ఉంచింది. వరుస అలంకారిక ప్రశ్నలు, మరణానికి సంబంధించిన స్పష్టమైన రూపకాలు, మూలంలోని అర్థసందిగ్ధతలు సంరక్షించబడ్డాయి.
