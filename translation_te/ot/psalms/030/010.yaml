id: PSA.30.10
reference: Psalms 30:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שְׁמַע יְהוָ֥ה וְ/חָנֵּ֑/נִי יְ֝הוָה הֱֽיֵה עֹזֵ֥ר לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/010.yaml
  text: Hear[a], O Yahweh, and be gracious to me; O Yahweh, be my helper.
translation:
  language: te
  text: యాహ్వే, విను; నాపై అనుగ్రహం చూపు[a]. యాహ్వే, నాకు సహాయకుడిగా ఉండు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను కరుణించు.” హీబ్రూ క్రియ దైవసహాయం కోసం చేసే విన్నపంలో అనుగ్రహం లేదా కరుణ చూపడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: విను
  rationale: שׁמע అనే క్రియ యొక్క ఏకవచన పుంలింగ ఆజ్ఞారూపం. హీబ్రూలో కర్మ ప్రత్యక్షంగా లేకపోవడంతో, ‘నా మొర విను’ అని పూరించకుండా సంక్షిప్తమైన ప్రార్థనా విన్నపాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: וְחָנֵּנִי
  choice: నన్ను కరుణించు
  rationale: חנן క్రియకు అనుగ్రహం చూపడం, దయ లేదా కరుణ చూపడం అనే భావవ్యాప్తి ఉంది. సహాయం కోసం చేసే ఈ విన్నపంలో ‘కరుణించు’ సహజంగా ఉండి ఆ భావాన్ని తెలియజేస్తుంది; ‘నాపై అనుగ్రహం చూపు’ కూడా సాధ్యమైన అనువాదం.
- source_word: הֱיֵה
  choice: ఉండు
  rationale: היה యొక్క ఆజ్ఞారూపం ఇక్కడ ‘అవు’ అనే మార్పును కాక, ప్రార్థనా విన్నపంలో ఒక పాత్రను స్వీకరించి ఉండమనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: עֹזֵר לִי
  choice: నాకు సహాయకుడిగా
  rationale: עזר అనే క్రియ యొక్క కృదంతరూపం సహాయం చేసే వ్యక్తిని సూచిస్తుంది. ‘నాకు సహాయకుడిగా’ అన్నది לִיని స్పష్టంగా ప్రతిబింబిస్తూ వ్యక్తిగత, కొనసాగుతున్న సహాయ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. తెలుగులో సాధారణ పాఠకులకు విస్తృతంగా పరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణను సూచించే మరో సాధ్యమైన రూపం.
- issue: חנןలోని అనుగ్రహం–కరుణ భావవ్యాప్తి
  choice: నన్ను కరుణించు
  alternative: నాపై అనుగ్రహం చూపు
  rationale: ఆపదలో దైవసహాయం కోరే సందర్భంలో ‘కరుణించు’ సహజమైన తెలుగు. అయితే ఈ క్రియలో కేవలం జాలి మాత్రమే కాక అనుగ్రహపూర్వకమైన ఆదరణ భావమూ ఉండటంతో ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవభరితమైన ప్రార్థనా శైలిని వాడాం. హీబ్రూ వాక్యంలోని సంక్షిప్త ఆజ్ఞారూపాలను సాధ్యమైనంతవరకు నిలిపి, అర్థాన్ని అనవసరంగా విస్తరించలేదు.
