lexical_decisions:
- source_word: וַאֲנִי
  choice: నేనైతే
  rationale: స్వతంత్ర సర్వనామంలోని నొక్కిచెప్పే భావాన్ని, సందర్భంలోని వ్యక్తిగత వ్యత్యాసాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אָמַרְתִּי
  choice: అని అనుకున్నాను
  rationale: హీబ్రూ ‘చెప్పాను’ అని ఉన్నప్పటికీ, తనలో తాను చేసుకున్న నిశ్చయాన్ని ఆధునిక తెలుగులో ‘అనుకున్నాను’ సహజంగా తెలియజేస్తుంది; కాలభావం సాధారణ భూతకాలంగానే నిలుస్తుంది.
- source_word: בְשַׁלְוִי
  choice: నా క్షేమస్థితిలో
  rationale: שַׁלְוָה సూచించే ప్రశాంతత, భద్రత, సుఖక్షేమాలతో కూడిన స్థితిని కేవలం భౌతిక సంపదగా పరిమితం చేయకుండా విస్తృతంగా ఉంచుతుంది.
- source_word: בַּל ... לְעוֹלָם
  choice: ఎన్నటికీ ... పోను
  rationale: కావ్యాత్మక నిషేధంతో ‘ఎప్పటికీ’ అనే కాలవ్యాప్తి కలిసి ఏర్పరచే బలమైన నిషేధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֶמּוֹט
  choice: కదిలిపోను
  rationale: మూలంలోని అస్థిరపరచబడటం లేదా స్థానం నుంచి కదలడం అనే రూపకాన్ని నిలుపుతుంది; ‘తొట్రిల్లను’ కంటే విస్తృతమైన అర్థాన్ని కలిగి ఉంది.
