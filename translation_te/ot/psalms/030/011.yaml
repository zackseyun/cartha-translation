review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly preserves the two parallel reversals: lament becomes dancing, and sackcloth is removed before joy is bestowed. אולם, the final clause renders the specific Hebrew verb אזר (''gird, bind around'') as general clothing. A revision can retain the poetic metaphor while more directly reflecting the source.'
  naturalness: The Telugu is clear and suitably elevated. “గోనెపట్ట” is understandable in context. The revised final line remains natural poetic Telugu while avoiding an overly explanatory phrase such as “వస్త్రంగా ధరింపజేశావు.”
  terminology: “శోకవిలాపం” more precisely represents מִסְפֵּד, a lamentation, than the broader “దుఃఖం.” “నాట్యం,” “గోనెపట్టు,” and “సంతోషం” are suitable modern-standard Telugu choices. No doctrinally loaded terminology is involved.
  issues:
  - severity: low
    issue: The opening noun is rendered broadly as “దుఃఖం.”
    rationale: מִסְפֵּד specifically denotes mourning or lamentation. “శోకవిలాపం” retains this verbal/public expression of grief without becoming unnatural.
  - severity: medium
    issue: The final clause uses “వస్త్రంగా ధరింపజేశావు” for a verb meaning “girded/bound around.”
    rationale: The draft retains the general clothing image but weakens the Hebrew’s more concrete girding metaphor. “సంతోషాన్ని నాకు కట్టావు” is a compact poetic rendering that preserves the image without imposing an interpretive explanation.
  revised_text: నీవు నా శోకవిలాపాన్ని నాకు నాట్యంగా మార్చావు; నా గోనెపట్టను విప్పి, సంతోషాన్ని నాకు కట్టావు.
