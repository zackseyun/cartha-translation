  yaml_path: translation/ot/psalms/030/011.yaml
  text: You turned my mourning into dancing for me; you untied my sackcloth and clothed me with joy.
translation:
  language: te
  text: నీవు నా శోకవిలాపాన్ని నాకు నాట్యంగా మార్చావు; నా గోనెపట్టను విప్పి, సంతోషాన్ని నాకు కట్టావు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִסְפְּדִי
  choice: నా దుఃఖాన్ని
  rationale: ఈ పదం శోకించడం లేదా శోకవిలాపాన్ని సూచిస్తుంది; సహజమైన ఆధునిక తెలుగులో సందర్భార్థాన్ని ‘దుఃఖం’గా వ్యక్తపరిచాం.
- source_word: לְמָחוֹל לִי
  choice: నాకు నాట్యంగా
  rationale: מָחוֹל అంటే నాట్యం; לִי అనే ‘నాకు’ను మూలంలోని వ్యక్తిగత ప్రయోజన భావాన్ని నిలుపుతూ స్పష్టంగా అనువదించాం.
- source_word: פִּתַּחְתָּ שַׂקִּי
  choice: నా గోనెపట్టను విప్పి
  rationale: פּתח ఇక్కడ కట్టిన శోకవస్త్రాన్ని విప్పడం లేదా తొలగించడం అనే భావం ఇస్తుంది; שַׂקִּיని శోక సూచకమైన ‘నా గోనెపట్టు’గా ఉంచాం.
- source_word: וַתְּאַזְּרֵנִי שִׂמְחָה
  choice: నాకు సంతోషాన్ని వస్త్రంగా ధరింపజేశావు
  rationale: אזר యొక్క ప్రాథమిక భావం చుట్టూ కట్టడం లేదా ధరింపజేయడం; ఆనందాన్ని వస్త్రంలా చుట్టిన కవితాత్మక రూపకాన్ని తెలుగులో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కవితా శైలి. శోకవస్త్రం నుంచి సంతోషవస్త్రానికి మార్పు అనే హెబ్రీ సమాంతర రూపకాన్ని నిలుపుతూ, సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఎంచుకున్నాం.
