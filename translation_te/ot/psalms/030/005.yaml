id: PSA.30.5
reference: Psalms 30:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י רֶ֨גַע בְּ/אַפּ/וֹ֮ חַיִּ֪ים בִּ/רְצ֫וֹנ֥/וֹ בָּ֭/עֶרֶב יָלִ֥ין בֶּ֗כִי וְ/לַ/בֹּ֥קֶר רִנָּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/005.yaml
  text: For his anger is for a moment[a]; life is in his favor. Weeping may stay for the night[b], but rejoicing comes in the morning.
translation:
  language: te
  text: ఎందుకంటే, ఆయన కోపం క్షణకాలమే; ఆయన అనుగ్రహంలో జీవం ఉంది. సాయంకాలంలో ఏడుపు రాత్రంతా బస చేస్తుంది[a]; కానీ ఉదయాన ఆనందధ్వని కలుగుతుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏడుపు రాత్రికి అతిథిలా బస చేస్తుంది.” హెబ్రీ క్రియకు రాత్రి బస చేయడం అనే ప్రత్యక్ష అర్థం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “ఆనందధ్వని” అనే పదాన్ని “ఆనందకేక” లేదా “ఉల్లాసగానం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న సందర్భానికి వివరణ లేదా ఆధారం అందించే అనుసంధాన పదంగా సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: רֶגַע בְּאַפּוֹ
  choice: ఆయన కోపం క్షణకాలమే
  rationale: క్రియలేని హెబ్రీ వాక్యాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, దైవకోపపు స్వల్పకాలికతను నిలుపుతుంది.
- source_word: חַיִּים בִּרְצוֹנוֹ
  choice: ఆయన అనుగ్రహంలో జీవం ఉంది
  rationale: חַיִּים ను భావవాచకమైన ‘జీవం’గా, רָצוֹן ను అనుకూలత లేదా కటాక్షం అనే అర్థంలో ‘అనుగ్రహం’గా అందిస్తుంది; హెబ్రీలోని సంక్షిప్త సమాంతరతను కాపాడుతుంది.
- source_word: בָּעֶרֶב יָלִין בֶּכִי
  choice: సాయంకాలం ఏడుపు రాత్రికి బస చేయవచ్చు
  rationale: יָלִין లోని రాత్రి బసచేసే అతిథి అనే వ్యక్తీకరణను నిలుపుతూ, בָּעֶרֶב ను ‘సాయంకాలం’గా స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: וְלַבֹּקֶר רִנָּה
  choice: కానీ ఉదయాన ఆనందధ్వని వస్తుంది
  rationale: సాయంకాలం–ఉదయం వ్యత్యాసాన్ని ‘కానీ’తో తెలియజేస్తూ, רִנָּה లోని వినిపించే ఉల్లాస కేక లేదా గాన భావాన్ని ‘ఆనందధ్వని’గా కాపాడుతుంది.
theological_decisions:
- issue: ‘ఆయన కోపం’, ‘ఆయన అనుగ్రహం’లోని సర్వనామ ప్రత్యయాల సూచ్యం
  choice: సందర్భానుసారం దేవునిని సూచించే ‘ఆయన’
  alternative: సర్వనామ సూచ్యాన్ని వచనంలో పేరుపెట్టి ‘యెహోవా’ అని విస్తరించడం
  rationale: కీర్తన సందర్భం ఈ ప్రత్యయాలను దేవునికి అన్వయిస్తుంది; అయితే మూలంలో లేని దైవనామాన్ని చేర్చకుండా సర్వనామాన్నే ఉంచడం ద్వారా దేవుని కోపం నిజమైనదనీ స్వల్పమైనదనీ, ఆయన అనుగ్రహంలో జీవం ఉందనీ చెప్పే ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి. ‘బస చేయవచ్చు’ అనే వ్యక్తీకరణ మూలంలోని వ్యక్తీకరణాత్మక రూపకాన్ని నిలుపుతుంది; ‘ఆనందధ్వని’ ఏడుపుతో ఉన్న కవితా వ్యత్యాసంతో పాటు רִנָּה యొక్క శ్రావ్య భావాన్ని తెలియజేస్తుంది.
