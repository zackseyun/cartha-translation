- from: ఎందుకంటే, ఆయన కోపం క్షణకాలమే; ఆయన అనుగ్రహంలో జీవం ఉంది. సాయంకాలం ఏడుపు రాత్రికి బస చేయవచ్చు[a]; కానీ ఉదయాన ఆనందధ్వని వస్తుంది[b].
  to: ఎందుకంటే, ఆయన కోపం క్షణకాలమే; ఆయన అనుగ్రహంలో జీవం ఉంది. సాయంకాలంలో ఏడుపు రాత్రంతా బస చేస్తుంది[a]; కానీ ఉదయాన ఆనందధ్వని కలుగుతుంది[b].
  rationale: 'The revision changes only the overnight-weeping clause: it removes unwarranted tentativeness and gives the Hebrew evening/lodging/morning image a natural modern Telugu expression. The remaining wording and both lexical alternatives are retained in substance.'
