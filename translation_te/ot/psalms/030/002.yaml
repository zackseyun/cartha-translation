source:
  edition: WLC
  text: יְהוָ֥ה אֱלֹהָ֑/י שִׁוַּ֥עְתִּי אֵ֝לֶ֗י/ךָ וַ/תִּרְפָּאֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/002.yaml
  text: O Yahweh my God[a], I cried out to you[c][b], and you healed me.
translation:
  language: te
  text: యాహ్వే, నా దేవా[a], సహాయం కోసం నీకు మొరపెట్టాను[b]; నీవు నన్ను స్వస్థపరిచావు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో “YHWH.” దీనిని “యాహ్వే” అని లిప్యంతరీకరిస్తారు; “యెహోవా” ఒక సంప్రదాయ ప్రత్యామ్నాయ రూపం. అనేక అనువాదాలు “ప్రభువు” అని ఇస్తాయి.
    reason: alternative_reading
  - marker: b
    text: లేదా “నేను నీకు మొరపెట్టాను.” హీబ్రూ క్రియలో సహాయం కోసం చేసే అత్యవసర మొర భావం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: “స్వస్థపరిచావు” అనేది శారీరక స్వస్థతను లేదా సందర్భంలో మరింత విస్తృతమైన పునరుద్ధరణను, విడుదలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన YHWHను తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపం ‘యెహోవా’గా ఇచ్చాం; దానిని బిరుదుగా మార్చలేదు.
- source_word: אֱלֹהָי
  choice: నా దేవా
  rationale: మొదటి పురుష ఏకవచన స్వామ్యప్రత్యయాన్ని ‘నా’తో, సంబోధనను సహజమైన తెలుగు రూపమైన ‘దేవా’తో వ్యక్తం చేశాం.
- source_word: שִׁוַּעְתִּי
  choice: సహాయం కోసం ... మొరపెట్టాను
  rationale: שׁוע సాధారణంగా ఆపదలో సహాయం కోరుతూ చేసే తీవ్రమైన మొరను సూచిస్తుంది; ఈ భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా తెలిపే రూపం ఎంచుకున్నాం.
- source_word: אֵלֶיךָ
  choice: నీకు
  rationale: אֶל + ద్వితీయ పురుష ఏకవచన ప్రత్యయం సూచించే దిశను సంక్షిప్తమైన సహజ తెలుగు రూపంలో నిలిపాం.
- source_word: וַתִּרְפָּאֵנִי
  choice: నీవు నన్ను స్వస్థపరిచావు
  rationale: רפא యొక్క ప్రత్యక్ష అర్థమైన స్వస్థపరచడాన్ని నిలిపి, అది శారీరక చికిత్సనో విస్తృత పునరుద్ధరణనో సూచిస్తుందనే సందర్భగత విస్తృతిని మూసివేయలేదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, తెలుగు పాఠకులకు దీర్ఘకాలంగా పరిచితమైన లిప్యంతరీకరణను ప్రధాన పాఠ్యంలో ఉంచాం; ఉచ్చారణకు సంబంధించిన ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- issue: רפא సూచించే స్వస్థత పరిధి
  choice: స్వస్థపరిచావు
  alternative: బాగుచేశావు / పునరుద్ధరించావు
  rationale: ఈ కీర్తన సందర్భంలో శారీరక స్వస్థతతో పాటు విస్తృతమైన పునరుద్ధరణ లేదా విడుదల భావం ఉండవచ్చు. ‘స్వస్థపరిచావు’ మూల క్రియకు సమీపంగా ఉండి ఆ తెరవును కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో భక్తిపూర్వకమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘దేవా’ అనే సంబోధన గౌరవాన్నీ కవితాత్మక గంభీరతనూ నిలుపుతుంది; క్రియారూపాలు ప్రత్యక్షంగా, సహజంగా ఉన్నాయి.
