translation:
  language: te
  text: కీర్తన. ఇంటి[a] ప్రతిష్ఠ కోసం ఒక గీతం. దావీదుకు చెందినది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేవాలయపు’ లేదా ‘రాజభవనపు’; హీబ్రూలో కేవలం ‘ఇంటి’ అని ఉంది.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘దావీదు కోసం’; ‘దావీదు రచించినది’ అనే అర్థం కూడా సాధ్యమే.
    reason: source_ambiguity
lexical_decisions:
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: సంగీత సంబంధమైన కీర్తనను సూచించే ఈ పదానికి ఆధునిక తెలుగు బైబిలు భాషలో సహజమైన, స్థిరమైన పదం ‘కీర్తన’.
- source_word: שִׁיר
  choice: ఒక గీతం
  rationale: హీబ్రూలో ఉన్న రెండు వేర్వేరు గాన ప్రక్రియల సూచనలను కలిపివేయకుండా, రెండవదాన్ని స్పష్టంగా ‘గీతం’గా అనువదించాం.
- source_word: חֲנֻכַּת
  choice: ప్రతిష్ఠ కోసం
  rationale: ఈ నామవాచకం అంకితం లేదా ప్రతిష్ఠను సూచిస్తుంది; శీర్షికలో గీతం ఉపయోగించే సందర్భాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַבַּיִת
  choice: ఇంటి
  rationale: హీబ్రూ పదానికి ప్రాథమిక అర్థం ‘ఇల్లు/గృహం’. దేవాలయం లేదా రాజభవనం అని నిర్దిష్టంగా నిర్ణయించకుండా మూలంలోని విస్తృతార్థాన్ని నిలిపాం.
- source_word: לְדָוִד
  choice: దావీదుకు చెందినది
  rationale: ఈ రూపం రచన, సంబంధం లేదా అంకితం అనే అవకాశాలను పూర్తిగా ఒక్కదానికే పరిమితం చేయకుండా, ‘దావీదు రచించినది’ కంటే మూలంలోని అనిశ్చితిని మెరుగ్గా నిలుపుతుంది.
theological_decisions:
- issue: శీర్షికలో ‘ఇంటి’ సూచన ఏమిటనేది
  choice: ఇంటి
  alternative: దేవాలయం; దావీదు రాజభవనం
  rationale: בַּיִת అనే హీబ్రూ పదం విస్తృతార్థకం; ఈ శీర్షిక దాని సూచనను నిర్దిష్టంగా చెప్పదు. అందువల్ల చారిత్రక లేదా వేదాంతపరమైన నిర్ణయాన్ని అనువాదంలో చేర్చలేదు.
- issue: לְדָוִד పదబంధం తెలిపే సంబంధం
  choice: దావీదుకు చెందినది
  alternative: దావీదు రచించినది; దావీదు కోసం
  rationale: హీబ్రూ ఉపసర్గ రచయితత్వం, సంబంధం లేదా అంకితాన్ని సూచించగలదు. ప్రధాన పాఠంలో విస్తృతమైన సంబంధార్థాన్ని ఉంచి, ప్రత్యామ్నాయాలను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, శీర్షిక స్వభావానికి తగిన చిన్న వాక్యాలతో రూపొందించాం. ‘ఇంటి’ అనే సాధారణ పదం మూలంలోని అస్పష్టతను కాపాడుతుంది; ‘ప్రతిష్ఠ’ గౌరవప్రదమైనదిగా ఉండి సాధారణ పాఠకులకు అర్థమయ్యే పదం.
