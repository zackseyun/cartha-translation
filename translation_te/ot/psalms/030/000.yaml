  source_fidelity: మూల హీబ్రూ శీర్షికలోని మూడు అంశాలు—מִזְמוֹר (‘కీర్తన’), שִׁיר (‘గీతం’), חֲנֻכַּת הַבַּיִת (‘ఇంటి ప్రతిష్ఠ కోసం’), לְדָוִד (‘దావీదుకు చెందినది’)—అన్నీ నిలిచాయి. ‘ఇంటి’ ద్వారా בַּיִת యొక్క ఉద్దేశపూర్వక అస్పష్టత కాపాడబడింది; దానిని దేవాలయం లేదా రాజభవనం అని ప్రధాన పాఠంలో నిర్దిష్టీకరించలేదు. ‘దావీదుకు చెందినది’ లְדָוִד‌లోని రచయితత్వ/సంబంధ/అంకిత భావసాధ్యతలను ఒకే విధంగా నిర్ణయించదు.
