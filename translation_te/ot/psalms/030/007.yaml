source:
  edition: WLC
  text: יְֽהוָ֗ה בִּ/רְצוֹנְ/ךָ֮ הֶעֱמַ֪דְתָּה לְֽ/הַרְרִ֫/י עֹ֥ז הִסְתַּ֥רְתָּ פָנֶ֗י/ךָ הָיִ֥יתִי נִבְהָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/007.yaml
  text: O Yahweh[a], by your favor you made my mountain stand strong; when you hid your face, I was dismayed.
translation:
  language: te
  text: 'యాహ్వే, నీ అనుగ్రహం వల్ల

    నా పర్వతాన్ని బలంగా నిలిపావు.[a]

    నీవు నీ ముఖాన్ని దాచుకున్నావు;

    నేను కలవరపడ్డాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా పర్వతానికి బలాన్ని స్థిరపరిచావు.” హీబ్రూ పదబంధం సంక్షిప్తంగా, క్లిష్టంగా ఉంది; ఇది స్థిరమైన ఐశ్వర్యం లేదా భద్రతకు రూపకంగా కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ ధ్వన్యనుకరణగా ఇచ్చాం; ప్రత్యక్ష సంబోధనను తెలుగు వాక్య నిర్మాణమే స్పష్టం చేస్తుంది.
- source_word: בִּרְצוֹנְךָ
  choice: నీ అనుగ్రహం వల్ల
  rationale: רָצוֹן ఇక్కడ దేవుని అనుకూలత, దయ లేదా సద్భావాన్ని సూచిస్తుంది; בְּ యొక్క సాధనార్థక భావాన్ని ‘వల్ల’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הֶעֱמַדְתָּה
  choice: నిలిపావు
  rationale: עמד హిఫీల్ రూపంలోని ‘నిలబడేలా చేయడం’ అనే కారణార్థక భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: לְהַרְרִי עֹז
  choice: నా పర్వతాన్ని బలంగా
  rationale: క్లిష్టమైన హీబ్రూ నిర్మాణంలో ‘పర్వతం’ అనే మూల కావ్యరూపకాన్ని వ్యాఖ్యానించి తొలగించకుండా ఉంచి, עֹזను విధానార్థకంగా ‘బలంగా’ అని అందించాం.
- source_word: הִסְתַּרְתָּ פָנֶיךָ
  choice: నీవు నీ ముఖాన్ని దాచుకున్నావు
  rationale: దేవుని అనుగ్రహం లేదా సన్నిధి ఉపసంహరణను సూచించే ముఖ్యమైన హీబ్రూ రూపకాన్ని అక్షరార్థానికి దగ్గరగా, తెలుగులో అర్థమయ్యేలా నిలిపాం.
- source_word: נִבְהָל
  choice: కలవరపడ్డాను
  rationale: ఈ నిఫాల్ రూపం కలత, దిగ్భ్రాంతి లేదా భయాన్ని సూచిస్తుంది; సందర్భంలో అతిగా తీవ్రతను చేర్చకుండా భావోద్వేగ కుదుపును ‘కలవరపడ్డాను’ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవ నామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న יהוה అనే ప్రత్యేక దైవ నామాన్ని సాధారణ బిరుదుగా మార్చకుండా ధ్వన్యనుకరణతో నిలిపాం.
- issue: ‘నా పర్వతం’ అనే చిత్రం
  choice: రూపకాన్ని ప్రధాన పాఠంలో యథాతథంగా నిలపడం
  alternative: నా ఐశ్వర్యం; నా భద్రత; నా కోట
  rationale: ‘పర్వతం’ స్థిరత్వం, భద్రత లేదా ఉన్నత స్థితికి రూపకం కావచ్చు; అయితే మూలంలోని కావ్యాత్మక అనిశ్చితిని ఏకైక వ్యాఖ్యానంతో పరిష్కరించలేదు.
- issue: రెండు వాక్యాల కాలసంబంధం
  choice: సముచ్చయం లేకుండా వరుస వాక్యాలుగా ఇవ్వడం
  alternative: ‘నీవు నీ ముఖాన్ని దాచుకున్నప్పుడు నేను కలవరపడ్డాను’
  rationale: హీబ్రూలో స్పష్టమైన ‘ఎప్పుడు’ అనే అనుసంధానం లేదు. సందర్భం కాలసంబంధాన్ని సూచించగలిగినా, ప్రధాన పాఠం మూలంలోని సంక్షిప్త సమీపస్థాపనను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభంగా అర్థమయ్యే కావ్య శైలిని వాడాం. మూలంలోని నాలుగు సంక్షిప్త పాదాల లయను ప్రతిబింబించేలా పాద విభజన చేశాం; సంప్రదాయపరమైన ప్రత్యేక వ్యాఖ్యానాన్ని చేర్చలేదు.
