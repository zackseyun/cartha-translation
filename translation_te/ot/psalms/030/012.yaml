  naturalness: ‘నా మహిమ నీకు స్తుతిగానం చేయడానికి, మౌనంగా ఉండకపోవడానికి’ అనేది సహజమైన పూర్తి వాక్యం కాదు. ‘...చేసి మౌనంగా ఉండకుండునట్లు’ రూపం కీర్తనాత్మక గంభీరతతో పాటు ఆధునిక ప్రామాణిక తెలుగులో ఉద్దేశార్థాన్ని స్పష్టంగా ఇస్తుంది.
