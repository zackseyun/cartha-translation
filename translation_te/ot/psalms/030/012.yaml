  text: so that my glory may sing praise to you and not be silent. O Yahweh my God[a], I will give thanks to you forever.
translation:
  language: te
  text: నా మహిమ నీకు స్తుతిగానం చేసి మౌనంగా ఉండకుండునట్లు. యాహ్వే, నా దేవా, నేను నీకు నిత్యం కృతజ్ఞతలు చెల్లిస్తాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా అంతరంగమంతా నీకు స్తుతిగానం చేయునట్లు”; హీబ్రూలో అక్షరార్థంగా “నా మహిమ.” ఇది కీర్తనకర్త అంతరంగాన్ని, అతని సంపూర్ణ వ్యక్తిత్వాన్ని, లేదా అతని నాలుకను సూచించే కవితాత్మక ప్రయోగం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: చేయడానికి
  rationale: హీబ్రూ పదంలోని ఉద్దేశార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יְזַמֶּרְךָ
  choice: నీకు స్తుతిగానం చేయడానికి
  rationale: זמר పియేల్ రూపంలోని సంగీతంతో కూడిన స్తుతి భావాన్ని నిలుపుతుంది.
- source_word: כָבוֹד
  choice: నా మహిమ
  rationale: మూలంలోని 'మహిమ/ఘనత' అనే కవితాత్మక రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, సూచిత ప్రథమ పురుష సంబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: וְלֹא יִדֹּם
  choice: మౌనంగా ఉండకపోవడానికి
  rationale: గానం చేయడానికి వ్యతిరేక భావంగా ఇక్కడ 'నిశ్శబ్దంగా ఉండడం' కంటే 'మౌనంగా ఉండడం' సహజంగా సరిపోతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: אֱלֹהַי
  choice: నా దేవా
  rationale: ప్రత్యక్ష సంబోధనను తెలుగు సంబోధన రూపంతో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לְעוֹלָם
  choice: నిత్యం
  rationale: నిరంతర కాలవ్యాప్తిని గంభీరమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אוֹדֶךָּ
  choice: నేను నీకు కృతజ్ఞతలు చెల్లిస్తాను
  rationale: ידה హిఫీల్ రూపంలోని కృతజ్ఞతాస్తుతి భావాన్ని కీర్తన సందర్భానికి తగిన విధంగా అందిస్తుంది.
theological_decisions:
- issue: స్తుతి చేసే కర్తగా כָבוֹד యొక్క అర్థం
  choice: ప్రధాన పాఠ్యంలో 'నా మహిమ' అనే అక్షరార్థ రూపకాన్ని నిలుపడం
  alternative: '''నా అంతరంగమంతా'' లేదా ''నా నాలుక'''
  rationale: కవితాత్మక పదానికి ఖచ్చితమైన సూచన వివాదాస్పదంగా ఉన్నందున దానిని ప్రధాన పాఠ్యంలో పరిష్కరించకుండా, సాధ్యమైన భావాలను పాదసూచికలో ఉంచడం మూలంలోని సందిగ్ధతను కాపాడుతుంది.
- issue: יְהוָה అనే దైవ నామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: బిరుదును పెట్టకుండా వ్యక్తిగత దైవ నామాన్ని చూపుతుంది; తెలుగులో సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. మూలంలోని కవితాత్మక 'నా మహిమ' రూపకం ఉద్దేశపూర్వకంగా నిలుపబడింది.
