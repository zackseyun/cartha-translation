  text: אֵלֶ֣י/ךָ יְהוָ֣ה אֶקְרָ֑א וְ/אֶל אֲ֝דֹנָ֗/י אֶתְחַנָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/008.yaml
  text: To you, O LORD, I call, and to my Lord I plead for mercy.
translation:
  language: te
  text: యెహోవా, నేను నీకు మొరపెడుతున్నాను; నా ప్రభువా, కరుణ చూపమని నిన్ను వేడుకొంటున్నాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶקְרָא
  choice: మొరపెట్టాను
  rationale: קרא here denotes calling out directly to God. In the surrounding retrospective narrative, Telugu past tense fits the discourse naturally while retaining the sense of an urgent appeal.
- source_word: אֲדֹנָי
  choice: నా ప్రభువా
  rationale: The form is morphologically associated with ‘my Lord’ and functions here as a divine address. ‘నా ప్రభువా’ follows the supplied audited rendering while remaining natural Telugu.
- source_word: אֶתְחַנָּן
  choice: కరుణ చూపమని నిన్ను వేడుకున్నాను
  rationale: The hitpael of חנן expresses imploring favor or mercy; this wording makes that object of the plea explicit without adding a doctrinal interpretation.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: Uses the established Telugu representation of the divine name and distinguishes it from אֲדֹנָי in the parallel clause.
theological_decisions:
- issue: Distinction between the divine name יהוה and the title אדני
  choice: యెహోవా … నా ప్రభువా
  alternative: ప్రభువా … ప్రభువా
  rationale: Retaining distinct expressions reflects the two different Hebrew forms and avoids flattening the poetic parallelism.
- issue: Whether אדני should be rendered simply ‘Lord’ or ‘my Lord’
  choice: నా ప్రభువా
  alternative: ప్రభువా
  rationale: The possessive rendering preserves the form reflected in the audited consultation text, while not imposing any interpretation beyond direct personal address.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ప్రార్థనా భాషను వాడాం. సందర్భంలోని గతకాల కథన ప్రవాహానికి అనుగుణంగా రెండు క్రియలనూ గతకాలంలో అనువదించాం.
