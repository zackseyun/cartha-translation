source:
  edition: WLC
  text: אֲרוֹמִמְ/ךָ֣ יְ֭הוָה כִּ֣י דִלִּיתָ֑/נִי וְ/לֹא שִׂמַּ֖חְתָּ אֹיְבַ֣/י לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/001.yaml
  text: I will exalt you[a], O Yahweh, because you have drawn me up and have not let my enemies rejoice over me.
translation:
  language: te
  text: 'యాహ్వే, నేను నిన్ను ఉన్నతంగా కీర్తిస్తాను;

    ఎందుకంటే నీవు నన్ను పైకి లాగావు[a],

    నా శత్రువులు నన్నుబట్టి సంతోషించేలా చేయలేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను పైకి లేపావు.” హీబ్రూ క్రియ బావిలోనుండి నీటిని తోడినట్లు ఏదైనా పైకి తీయడాన్ని సజీవంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹמִמְךָ
  choice: నేను నిన్ను ఉన్నతంగా కీర్తిస్తాను
  rationale: רוּם మూలంలోని ‘ఎత్తు/ఉన్నతపరచు’ భావాన్ని నిలుపుతూ, దేవునికి స్తుతి చెల్లించే సందర్భంలో ఆధునిక తెలుగులో సహజంగా అర్థమయ్యేలా అనువదించబడింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: కీర్తించడానికి గల కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: דִלִּיתָנִי
  choice: నీవు నన్ను పైకి తోడావు
  rationale: דלה అనే క్రియ బావి లేదా గుంటలోనుండి ఏదైనా పైకి తోడే సజీవ రూపకాన్ని సూచిస్తుంది. ‘తోడావు’ ఆ రూపకాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: וְלֹא שִׂמַּחְתָּ
  choice: విజయానందం పొందనివ్వలేదు
  rationale: హీబ్రూ క్రియలోని కారణార్థక భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తూ, శత్రువులు కీర్తనకర్త పతనంపై ఆనందించలేదనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: אֹיְבַי
  choice: నా శత్రువులు
  rationale: బహువచన స్వామ్యరూపానికి నేరమైన, సహజమైన తెలుగు అనువాదం.
- source_word: לִי
  choice: నాపై
  rationale: కీర్తనకర్తను ఓడించినందుకు లేదా అతని దుస్థితిని చూసి శత్రువులు పొందే విజయానందాన్ని సూచించే సంబంధార్థాన్ని అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా ఉంచుతుంది. ‘యాహ్వే’ అనేది సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణ.
- issue: శత్రువుల ఆనంద స్వభావం
  choice: నాపై విజయానందం పొందనివ్వలేదు
  alternative: నా విషయమై సంతోషింపజేయలేదు
  rationale: שׂמח యొక్క కారణార్థక నిర్మాణాన్ని నిలుపుతూ, לִי ఇక్కడ శత్రువుల విరోధపూర్వక పైచేయి లేదా విజయాన్ని సూచిస్తుందనే సందర్భాన్ని సహజంగా వ్యక్తం చేస్తుంది; దేవుడు వారి ఆనందానికి నేరుగా కారణమయ్యాడనే అపార్థాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవభరితమైన కీర్తనా శైలి. మూలంలోని పైకి ఎత్తే రెండు సంబంధిత రూపకాలను ‘ఉన్నతంగా’ మరియు ‘పైకి తోడావు’ ద్వారా సాధ్యమైనంతవరకు నిలిపాం.
