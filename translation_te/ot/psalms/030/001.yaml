    reason: lexical_alternative
  revision_rationale: 'The revision makes Yahweh the clear implied subject of both saving actions and renders the Hebrew causative negation naturally: he did not make the enemies rejoice at the psalmist’s expense. It also replaces an awkward person-object use of ‘తోడు’ with the idiomatic ‘పైకి లాగు,’ while the footnote preserves the underlying well-drawing metaphor and the alternative ‘lifted me up.’'
