  text: יְֽהוָ֗ה הֶֽעֱלִ֣יתָ מִן שְׁא֣וֹל נַפְשִׁ֑/י חִ֝יִּיתַ֗/נִי מ/יורדי בֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/003.yaml
  text: O Yahweh[a], you brought up my soul from Sheol[c][b]; you kept me alive from among those going down to the pit.
translation:
  language: te
  text: యాహ్వే[a], షెయోల్[b] నుండి నా ప్రాణాన్ని పైకి తీసుకొచ్చావు; గోతిలోకి దిగిపోతున్నవారిలో చేరనీయకుండా నన్ను సజీవంగా ఉంచావు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యాహ్వే’ అనేది יהוה అనే దేవుని వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ; సాంప్రదాయంగా దీనిని ‘ప్రభువు’ అని కూడా అనువదిస్తారు.
    reason: divine_name
  - marker: b
    text: ‘షెయోల్’ అనేది మృతుల లోకాన్ని సూచించే హీబ్రూ పదం; సందర్భానుసారం ‘సమాధి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘గోతిలోకి దిగిపోతున్నవారి మధ్యనుంచి నన్ను బ్రతికించావు’; మరో విధంగా, ‘నేను గోతిలోకి దిగిపోకుండా నన్ను సజీవంగా ఉంచావు.’
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవిక వ్యక్తినామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: הֶעֱלִיתָ
  choice: పైకి తీసుకొచ్చావు
  rationale: హిఫిల్ రూపంలోని ‘పైకి రప్పించు’ అనే కారణార్థాన్ని, పాతాళం నుంచి పైకి తేవడమనే కవితాత్మక దిశాచిత్రంతో సహా నిలిపింది.
- source_word: מִן שְׁאוֹל
  choice: పాతాళం నుండి
  rationale: שְׁאוֹל‌ను కేవలం భౌతిక సమాధిగా పరిమితం చేయకుండా, మృతుల లోకాన్ని సూచించగల తెలుగు కవితాత్మక పదంతో అనువదించాం.
- source_word: נַפְשִׁי
  choice: నా ప్రాణాన్ని
  rationale: נֶפֶשׁ ఇక్కడ జీవితం, జీవించి ఉన్న వ్యక్తి అనే భావాలను కలిగి ఉంది. ‘నా ప్రాణాన్ని’ సహజమైన తెలుగులో ఆ అర్థవిస్తృతిని నిలుపుతుంది; సాంకేతిక ఆత్మశాస్త్ర భావాన్ని బలవంతంగా రుద్దదు.
- source_word: חִיִּיתַנִי
  choice: నన్ను సజీవంగా ఉంచావు
  rationale: పియేల్ రూపం జీవాన్ని కాపాడడం లేదా తిరిగి చేకూర్చడం రెండింటినీ సూచించగలదు. ప్రధాన పాఠం పునరుత్థానాన్ని అవసరానికి మించి నిర్దిష్టం చేయకుండా జీవరక్షణ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: מִיּוֹרְדֵי בוֹר
  choice: గోతిలోకి దిగిపోతున్నవారిలో నేను చేరకుండా
  rationale: మరణగోతిలోకి దిగేవారి సమూహం నుంచి వేరుచేయబడిన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేసింది. హీబ్రూ నిర్మాణానికి మరింత రూపసామ్యమైన ప్రత్యామ్నాయం పాదటిప్పణిలో ఇచ్చాం.
- source_word: בּוֹר
  choice: గోతి
  rationale: మరణం లేదా సమాధిని సూచించే ‘గోతి’ చిత్రాన్ని రూపకాలంకారంతో సహా నిలిపింది.
theological_decisions:
- issue: ఈ వచనం సంపూర్ణంగా వికసించిన పరలోక లేదా పునరుత్థాన సిద్ధాంతాన్ని స్పష్టంగా బోధిస్తున్నట్లు అనువదించాలా?
  choice: పాతాళం, గోతి అనే హీబ్రూ మరణచిత్రాలను నిలిపి, మరణం లేదా మరణసమీప స్థితి నుంచి విమోచన అనే ఉద్వేగాన్ని అలాగే ఉంచాం.
  alternative: ‘నరకం నుంచి’ లేదా ‘మృతులలోనుంచి పునరుత్థానం చేశావు’ అని మరింత నిర్దిష్టంగా అనువదించడం.
  rationale: మూల వచనం మరణలోక చిత్రాల ద్వారా రక్షణను వర్ణిస్తుంది గాని, ఆ అనుభవానికి తరువాతి సిద్ధాంతపరమైన నిర్వచనాన్ని స్పష్టంగా విధించదు.
- issue: חִיִּיתַנִי מִיּוֹרְדֵי בוֹר అనే వాక్యభాగపు సంబంధం
  choice: ‘గోతిలోకి దిగిపోతున్నవారిలో నేను చేరకుండా నన్ను సజీవంగా ఉంచావు’ అనే నిరోధక భావాన్ని ప్రధాన పాఠంలో ఇచ్చాం.
  alternative: ‘గోతిలోకి దిగిపోతున్నవారి మధ్యనుంచి నన్ను సజీవంగా ఉంచావు/నాకు మళ్లీ జీవం ఇచ్చావు.’
  rationale: హీబ్రూ నిర్మాణం విభజన లేదా నిరోధం రెండింటికీ చోటివ్వగలదు; అందువల్ల ప్రత్యామ్నాయ పఠనాన్ని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, కీర్తనకు తగిన గంభీరమైన కవితాత్మక శైలిలో రూపొందించాం. ‘పాతాళం,’ ‘గోతి’ అనే మూల చిత్రాలను నిలిపి, అస్పష్టతలను పాదటిప్పణుల్లో సూచించాం.
