  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: זַמְּר֣וּ לַ/יהוָ֣ה חֲסִידָ֑י/ו וְ֝/הוֹד֗וּ לְ/זֵ֣כֶר קָדְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/004.yaml
  text: Sing praise to Yahweh[a], you his faithful ones[c][b], and give thanks to the remembrance of his holiness.
translation:
  language: te
  text: యాహ్వేను[a] కీర్తిస్తూ పాడండి, ఆయనకు నమ్మకంగా ఉన్నవారలారా; ఆయన పరిశుద్ధత స్మరణను బట్టి కృతజ్ఞతలు చెల్లించండి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోవా.”
    reason: divine_name_transliteration
  - marker: b
    text: లేదా, “ఆయన పరిశుద్ధత ప్రస్తావనలో కృతజ్ఞతలు చెల్లించండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ
  choice: కీర్తిస్తూ పాడండి
  rationale: ఈ పీయేల్ బహువచన ఆజ్ఞారూపం ఆరాధనలో సంగీతంతో స్తుతించడాన్ని సూచిస్తుంది; ‘కీర్తిస్తూ పాడండి’ సంగీత, స్తుతి భావాలు రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాను
  rationale: హీబ్రూ దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంతో వ్యక్తం చేసింది; ‘పాడండి’తో సహజ తెలుగు కర్మవిభక్తిని వాడింది.
- source_word: חֲסִידָיו
  choice: ఆయన నమ్మకస్తులారా
  rationale: חסיד covenant loyalty, భక్తి, విశ్వసనీయత భావాలను కలిగి ఉంది. సంబోధనను స్పష్టం చేస్తూ, మతపరంగా సంకుచితంగా వినిపించే ‘పరిశుద్ధులారా’ కంటే ‘నమ్మకస్తులారా’ను ప్రధాన పాఠంలో ఎంచుకుంది.
- source_word: וְהוֹדוּ
  choice: కృతజ్ఞతలు చెల్లించండి
  rationale: స్తుతి సందర్భంలో ידה హిఫీల్ రూపం కృతజ్ఞత ప్రకటించడం లేదా స్తుతించడం అని అర్థం; ఇక్కడ సమాంతర నిర్మాణంలో ‘కృతజ్ఞతలు చెల్లించండి’ సహజంగా సరిపోతుంది.
- source_word: לְזֵכֶר
  choice: జ్ఞాపకం చేసుకొని
  rationale: זֵכֶרకు జ్ఞాపకం, స్మరణ, ప్రస్తావన అనే అర్థపరిధి ఉంది. తెలుగు వాక్యంలో దేవుని పరిశుద్ధతను స్మరించే సందర్భంలో కృతజ్ఞత తెలిపే భావాన్ని ‘జ్ఞాపకం చేసుకొని’ సహజంగా అందిస్తుంది; ‘ప్రస్తావన వినగానే’ అనే అవకాశాన్ని పాదసూచికలో నిలిపింది.
- source_word: קָדְשׁוֹ
  choice: ఆయన పరిశుద్ధతను
  rationale: కָדְשׁוֹను నేరుగా ‘ఆయన పరిశుద్ధత’గా అనువదించింది. మూలంలో లేని ‘నామం’ను ప్రధాన పాఠంలో చేర్చలేదు.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని ప్రత్యేక దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా ఉంచింది. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ప్రధాన పాఠంలో వాడి, మూల ఉచ్చారణకు దగ్గరైన ‘యాహ్వే’ను పాదసూచికలో ఇచ్చింది.
- issue: לְזֵכֶר קָדְשׁוֹ యొక్క భావం
  choice: ఆయన పరిశుద్ధతను జ్ఞాపకం చేసుకొని
  alternative: ఆయన పరిశుద్ధత ప్రస్తావన వచ్చినప్పుడు
  rationale: ఈ పదబంధం ‘ఆయన పరిశుద్ధత యొక్క స్మరణ/ప్రస్తావన’ అనే నిజమైన కవితాత్మక సందిగ్ధతను కలిగి ఉంది. ప్రధాన పాఠం స్మరణ భావాన్ని సహజ తెలుగులో ఇస్తుంది; ప్రస్తావన భావాన్ని పాదసూచికలో సంరక్షిస్తుంది. మూలంలో ‘నామం’ లేనందున ‘పరిశుద్ధ నామం’గా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామూహిక ఆరాధనకు తగిన గౌరవభరితమైన సంబోధనను ఉపయోగించింది. హీబ్రూ కవిత్వంలోని రెండు బహువచన ఆజ్ఞలను నిలిపి, అసహజమైన పదానువాదాన్ని నివారించింది.
