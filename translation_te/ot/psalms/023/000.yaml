  text: מִזְמ֥וֹר לְ/דָוִ֑ד יְהוָ֥ה רֹ֝עִ֗/י לֹ֣א אֶחְסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/000.yaml
  text: A psalm of David[a]. Yahweh is my shepherd[c][b]; I will lack nothing.
translation:
  language: te
  text: 'దావీదు కీర్తన.[a]


    యాహ్వే[b] నా కాపరి;


    నాకు ఏ కొదువా ఉండదు.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దావీదు రచించిన కీర్తన’ లేదా ‘దావీదు కోసం కీర్తన’; హెబ్రీలోని లְדָוִד అనే పదబంధం రచయితను, అంకితాన్ని లేదా దావీదుతో సంబంధాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: హెబ్రీలో YHWH అనే దైవనామం. దాని ప్రాచీన ఉచ్చారణను సాధారణంగా ‘యాహ్వే’గా పునర్నిర్మిస్తారు; తెలుగు సంప్రదాయంలో ‘యెహోవా’ రూపం కూడా విస్తృతంగా వాడుకలో ఉంది.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘నేను కొదువపడను’ లేదా ‘నాకు లోటుండదు.’ ఇక్కడ భావం, ‘నాకు అవసరమైనది కొరవడదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: వాద్యసంగీతంతో పాడే గీతాన్ని సూచించే హెబ్రీ పదానికి తెలుగులో సహజంగా, సంప్రదాయబద్ధంగా అర్థమయ్యే పదం.
- source_word: לְדָוִד
  choice: దావీదు కీర్తన
  rationale: లְ ఉపసర్గ రచయితను, అంకితాన్ని లేదా సంబంధాన్ని సూచించగలదు; ప్రధాన పాఠంలో సహజమైన సంప్రదాయ రూపాన్ని ఉంచి, అస్పష్టతను పాదసూచికలో తెలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగు పాఠకులకు సుపరిచితమైన వ్యక్తినామ రూపంలో ఇచ్చాం.
- source_word: רֹעִי
  choice: నా కాపరి
  rationale: గొర్రెల కాపరి రూపకాన్ని స్పష్టంగా నిలిపే సహజమైన తెలుగు పదబంధం.
- source_word: לֹא אֶחְסָר
  choice: నాకు ఏ కొదువా ఉండదు
  rationale: అక్షరార్థంగా ‘నేను కొదువపడను’; తెలుగు సహజ వాడుకలో భావాన్ని సమగ్రంగా, భవిష్యత్ నిశ్చయంతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה యొక్క ప్రతిరూపం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా నిలిపాం; ఉచ్చారణ పునర్నిర్మాణాన్ని పాదసూచికలో తెలియజేశాం.
- issue: לְדָוִד యొక్క సంబంధార్థం
  choice: ప్రధాన పాఠంలో ‘దావీదు కీర్తన’
  alternative: ‘దావీదు రచించిన కీర్తన’ లేదా ‘దావీదు కోసం కీర్తన’
  rationale: హెబ్రీ ఉపసర్గలోని నిజమైన అస్పష్టతను ప్రధాన పాఠంలో అతిగా నిర్ధారించకుండా, ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదజాలం వాడబడింది. కవితా పంక్తి విభజన హెబ్రీ వాక్యంలోని శీర్షిక, రెండు ప్రధాన భావఖండాలను ప్రతిబింబిస్తుంది.
