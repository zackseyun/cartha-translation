  text: בִּ/נְא֣וֹת דֶּ֭שֶׁא יַרְבִּיצֵ֑/נִי עַל מֵ֖י מְנֻח֣וֹת יְנַהֲלֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/002.yaml
  text: In grassy pastures he makes me lie down[a]; beside restful waters he leads me.
translation:
  language: te
  text: పచ్చిక మేతభూముల్లో ఆయన నన్ను పరుండబెడతాడు; విశ్రాంతినిచ్చే జలాల[a] చెంత నన్ను నడిపిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నిశ్చలమైన జలాల చెంత’ లేదా ‘ప్రశాంతమైన జలాల చెంత.’ హీబ్రూ వ్యక్తీకరణ విశ్రాంతి లేదా సేదతో అనుబంధమున్న జలాలను నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְאוֹת דֶּשֶׁא
  choice: పచ్చిక మేతభూముల్లో
  rationale: נְאוֹת అనే పదం మందలు మేసి విశ్రమించడానికి అనువైన మేతస్థలాలను సూచిస్తుంది; דֶּשֶׁא తాజా గడ్డి లేదా పచ్చని వృక్షసంపదను సూచిస్తుంది. ఈ కలయిక కాపరి దృశ్యాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יַרְבִּיצֵנִי
  choice: ఆయన నన్ను పరుండబెడతాడు
  rationale: רבץ హిఫీల్ రూపంలోని కారణార్థాన్ని—పడుకునేలా లేదా విశ్రమించేలా చేయడం—అమూర్తమైన వివరణగా మార్చకుండా నిలుపుతుంది.
- source_word: עַל מֵי
  choice: జలాల చెంత
  rationale: ఈ కవితా సందర్భంలో עַל సమీపాన్ని సూచిస్తుంది. מֵי బహువచన కవితా రూపాన్ని ‘జలాలు’గా నిలిపాం.
- source_word: מְנֻחוֹת
  choice: విశ్రాంతినిచ్చే
  rationale: ఈ పదం నిశ్చలతను మాత్రమే కాక విశ్రాంతి, నెమ్మది, సేదను సూచిస్తుంది. ‘విశ్రాంతినిచ్చే’ అనే రూపం ఆ ప్రధాన భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְנַהֲלֵנִי
  choice: నన్ను నడిపిస్తాడు
  rationale: נהל పీయేల్ రూపం శ్రద్ధతో నడిపించడం లేదా మార్గదర్శనం చేయడం అనే భావాన్ని కలిగి ఉంది; కాపరి ప్రతిమను అదనపు వ్యాఖ్యానం లేకుండా నిలుపుతుంది.
theological_decisions:
- issue: מְנֻחוֹתను సాంప్రదాయంగా ‘నిశ్చలమైన’ అని అనువదించాలా, లేక విశ్రాంతి భావాన్ని ముందుకు తేవాలా
  choice: విశ్రాంతినిచ్చే జలాలు
  alternative: నిశ్చలమైన జలాలు; ప్రశాంతమైన జలాలు
  rationale: హీబ్రూ నామవాచకం నీటి కదలికలేమిని స్పష్టంగా చెప్పడం కంటే విశ్రాంతి లేదా సేదతో అనుబంధాన్ని ప్రధానంగా సూచిస్తుంది. అందువల్ల మూలభాష భావానికి దగ్గరగా ‘విశ్రాంతినిచ్చే’ అని ఎంచుకొని, సాధ్యమైన ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక గౌరవాన్ని మరియు కాపరి దృశ్యాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ‘పరుండబెడతాడు’ కారణార్థాన్ని కాపాడుతుంది; ‘జలాలు’ హీబ్రూ కవితా బహువచనాన్ని ప్రతిబింబిస్తుంది.
