  to: నా ఎదుట, నా శత్రువుల సమక్షంలో నీవు భోజన బల్లను సిద్ధం చేస్తావు[a]; నా తలకు నూనె రాసి నన్ను సేదదీరుస్తావు[b]; నా పానపాత్ర పొంగిపొర్లుతోంది.
