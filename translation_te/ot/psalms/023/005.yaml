source:
  edition: WLC
  text: תַּעֲרֹ֬ךְ לְ/פָנַ֨/י שֻׁלְחָ֗ן נֶ֥גֶד צֹרְרָ֑/י דִּשַּׁ֖נְתָּ בַ/שֶּׁ֥מֶן רֹ֝אשִׁ֗/י כּוֹסִ֥/י רְוָיָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/005.yaml
  text: You set a table before me in the presence of my enemies[a]; you anoint my head with oil[b]; my cup overflows.
translation:
  language: te
  text: నా ఎదుట, నా శత్రువుల సమక్షంలో నీవు భోజన బల్లను సిద్ధం చేస్తావు[a]; నా తలకు నూనె రాసి నన్ను సేదదీరుస్తావు[b]; నా పానపాత్ర పొంగిపొర్లుతోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా ఎదుట భోజన బల్లను అమర్చుతావు.’ హీబ్రూ క్రియకు ‘అమర్చు,’ ‘సిద్ధం చేయు’ అనే అర్థాలు ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో పదశః, ‘నూనెతో నా తలను సమృద్ధిగా చేస్తావు.’ ఇది ఉదారమైన సేదదీర్పు లేదా ఘనమైన ఆతిథ్యాన్ని సూచించే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעֲרֹךְ
  choice: సిద్ధం చేస్తావు
  rationale: ערך అంటే అమర్చడం లేదా సిద్ధం చేయడం. భోజన ఆతిథ్య దృశ్యంలో తెలుగులో ‘భోజన బల్లను సిద్ధం చేస్తావు’ సహజంగా ఉండి మూల భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְפָנַי
  choice: నాకోసం
  rationale: పదశః ‘నా ముందు’ అయినా, బల్లను సిద్ధం చేసే సందర్భంలో ఇది గ్రహీత ప్రయోజనాన్ని కూడా సూచిస్తుంది. సహజమైన తెలుగులో ‘నాకోసం’ ఆ భావాన్ని అందిస్తుంది; ప్రత్యక్ష స్థలార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: שֻׁלְחָן
  choice: భోజన బల్లను
  rationale: שֻׁלְחָן బల్లను సూచిస్తుంది. సందర్భం విందు, ఆతిథ్యానికి సంబంధించినది కాబట్టి ‘భోజన బల్ల’ తెలుగులో ఉద్దేశిత దృశ్యాన్ని స్పష్టం చేస్తుంది.
- source_word: נֶגֶד צֹרְרָי
  choice: నా శత్రువుల ఎదుట
  rationale: נֶגֶד సమక్షం లేదా ఎదురుగా ఉండడాన్ని, צֹרְרָי శత్రుత్వం చూపేవారిని సూచిస్తాయి. ‘నా శత్రువుల ఎదుట’ సంక్షిప్తంగా, సహజంగా రెండింటినీ వ్యక్తపరుస్తుంది.
- source_word: דִּשַּׁנְתָּ בַשֶּׁמֶן רֹאשִׁי
  choice: నా తలకు నూనె రాసి నన్ను ఘనపరుస్తావు
  rationale: דשׁן యొక్క మూలభావం కొవ్వుగా, సమృద్ధిగా చేయడం; తల మరియు నూనెతో కలిసి ఇది ఉదారమైన సత్కారం లేదా సేదదీర్పును సూచిస్తుంది. ‘నూనె రాసి’ దృశ్యాన్ని, ‘ఘనపరుస్తావు’ సందర్భార్థాన్ని తెలియజేస్తాయి; అభిషేకానికి సంబంధించిన తరువాతి సిద్ధాంతార్థాన్ని అనవసరంగా రుద్దవు.
- source_word: כּוֹסִי רְוָיָה
  choice: నా గిన్నె పొంగిపొర్లుతోంది
  rationale: רְוָיָה నిండుదల, సమృద్ధి, సంతృప్తిని సూచించే నామవాచక రూపం. ‘పొంగిపొర్లుతోంది’ తెలుగులో ఆ సమృద్ధిని సజీవంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: తలకు నూనె రాయడం అనే ఆతిథ్య దృశ్యం
  choice: నా తలకు నూనె రాసి నన్ను ఘనపరుస్తావు
  alternative: నా తలకు నూనె అభిషేకిస్తావు; నా తలను నూనెతో సమృద్ధి చేస్తావు
  rationale: ఈ వచనంలో విందు ఇచ్చే యజమాని యొక్క ఉదార ఆతిథ్యం ప్రధాన దృశ్యం. ‘అభిషేకిస్తావు’ అనేది సాధ్యమైన అనువాదమే అయినా, తెలుగులో అది రాజరిక లేదా ఆచారపరమైన ప్రత్యేక భావాన్ని ముందుకు తేవచ్చు. అందుచేత క్రియాత్మక దృశ్యాన్నీ, ఘనమైన సత్కార భావాన్నీ కలిపి ఇచ్చాం.
- issue: హీబ్రూ క్రియల కాలం/దృక్కోణం
  choice: వర్తమాన భావంతో ‘సిద్ధం చేస్తావు… ఘనపరుస్తావు… పొంగిపొర్లుతోంది’
  alternative: భూత లేదా సంపూర్ణ భావంతో ‘సిద్ధం చేశావు… నూనె రాశావు…’
  rationale: కావ్య సందర్భంలో దేవుని సంరక్షణను సజీవంగా, కొనసాగుతున్న వాస్తవంగా చూపేందుకు తెలుగు వర్తమాన-అలవాటు రూపాలు సహజంగా సరిపోతాయి; హీబ్రూ కవిత్వంలోని దృక్కోణాన్ని అతిగా నిర్దిష్టం చేయవు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి. ‘భోజన బల్ల’ ఆతిథ్య దృశ్యాన్ని స్పష్టం చేస్తుంది; ‘గిన్నె’ సాధారణ పాఠకునికి సహజంగా ఉండి పానపాత్ర దృశ్యాన్ని నిలుపుతుంది. ప్రతి పాదంలో రెండవ పురుష ఏకవచన సన్నిహిత సంబోధనను కొనసాగించాం.
