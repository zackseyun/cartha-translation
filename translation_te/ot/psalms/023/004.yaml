id: PSA.23.4
reference: Psalms 23:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: גַּ֤ם כִּֽי אֵלֵ֨ךְ בְּ/גֵ֪יא צַלְמָ֡וֶת לֹא אִ֘ירָ֤א רָ֗ע כִּי אַתָּ֥ה עִמָּדִ֑/י שִׁבְטְ/ךָ֥ וּ֝/מִשְׁעַנְתֶּ֗/ךָ הֵ֣מָּה יְנַֽחֲמֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/004.yaml
  text: Even though I walk through the valley of deep darkness[a], I will fear no evil, for you are with me; your rod and your staff—they comfort me.
translation:
  language: te
  text: నేను గాఢాంధకారపు లోయలో నడిచినా[a], ఏ కీడుకూ భయపడను; ఎందుకంటే నీవు నాకు తోడుగా ఉన్నావు. నీ దండం, నీ కర్ర—అవే నన్ను ఆదరిస్తాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరణఛాయ లోయలో.” హీబ్రూ పదం గాఢాంధకారాన్ని సూచించగలదు; దానిలో మరణానికి సంబంధించిన భావఛాయలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם כִּי
  choice: నడిచినా
  rationale: సందర్భంలోని రాయితీ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి క్రియతో కలిసిన ‘-ఇనా’ రూపాన్ని వాడాం.
- source_word: אֵלֵךְ
  choice: నేను ... నడిచినా
  rationale: అసంపూర్ణ క్రియారూపం ఇక్కడ సజీవమైన సాధారణ లేదా భవిష్యత్ పరిస్థితిని సూచిస్తుంది; ‘నడచు’ కాపరి చిత్రణను నిలుపుతుంది.
- source_word: בְּגֵיא
  choice: లోయలో
  rationale: చలనాన్ని సూచించే క్రియతో ‘లోయలో నడచడం’ ఆధునిక తెలుగులో సహజంగా ఉంది; మరింత నిర్దిష్టమైన ‘కనుమ’ అనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: צַלְמָוֶת
  choice: గాఢాంధకారం
  rationale: ఈ పదం మరణ ఛాయలను సూచించగలిగినా, ప్రధానంగా తీవ్రమైన చీకటిని సూచిస్తుంది. విస్తృతమైన మూలార్థాన్ని ప్రధాన పాఠంలో ఉంచి, సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: לֹא אִירָא רָע
  choice: ఏ కీడుకూ భయపడను
  rationale: רָע యొక్క కీడు, హాని, ప్రమాదం వంటి విస్తృత భావపరిధిని ‘కీడు’ నిలుపుతుంది; నిరాకరణకు ‘ఏ ... కూ’ సహజమైన బలం ఇస్తుంది.
- source_word: כִּי אַתָּה עִמָּדִי
  choice: ఎందుకంటే నీవు నాకు తోడుగా ఉన్నావు
  rationale: భయపడకపోవడానికి కారణాన్ని స్పష్టంగా తెలుపుతూ, దేవుని సన్నిధిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שִׁבְטְךָ
  choice: నీ దండం
  rationale: కాపరి చేతిలో రక్షణకూ నియంత్రణకూ ఉపయోగించే బలమైన సాధనాన్ని ‘దండం’ సూచిస్తుంది; రాజదండం అనే అర్థాన్ని ఇక్కడ ముందుకు తేవదు.
- source_word: וּמִשְׁעַנְתֶּךָ
  choice: నీ కర్ర
  rationale: ఆనుకోవడానికి లేదా నడిపించడానికి ఉపయోగించే కాపరి కర్రను సహజంగా సూచిస్తుంది; ‘దండం’తో ఉన్న భేదాన్ని కూడా నిలుపుతుంది.
- source_word: הֵמָּה
  choice: అవే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను ‘అవే’తోను ముందు దీర్ఘవిరామంతోను నిలిపాం.
- source_word: יְנַחֲמֻנִי
  choice: నన్ను ఆదరిస్తాయి
  rationale: ఈ సందర్భంలో ధైర్యం, భరోసా, ఊరట ఇచ్చే భావాలను ‘ఆదరించు’ సహజంగా కలుపుతుంది.
theological_decisions:
- issue: צַלְמָוֶת అనే ప్రసిద్ధ సంప్రదాయ పదబంధం యొక్క అర్థం
  choice: గాఢాంధకారం
  alternative: మరణఛాయ
  rationale: మూలభాషా పదం తీవ్రమైన చీకటిని విస్తృతంగా సూచించగలదు; దానిని కేవలం మరణానికే పరిమితం చేయలేదు. అయితే మరణ సంబంధిత ఛాయ మరియు ప్రసిద్ధ సంప్రదాయ అనువాదాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితాత్మక శైలిని వాడాం. దేవునితో ప్రత్యక్ష సంభాషణకు గౌరవభరితమైన ఏకవచన ‘నీవు’ రూపం నిలిపాం; హీబ్రూ ఉద్ఘాటనను దీర్ఘవిరామం మరియు ‘అవే’ ద్వారా ప్రతిబింబించాం.
