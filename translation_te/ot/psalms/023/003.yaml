source:
  edition: WLC
  text: נַפְשִׁ֥/י יְשׁוֹבֵ֑ב יַֽנְחֵ֥/נִי בְ/מַעְגְּלֵי צֶ֝֗דֶק לְמַ֣עַן שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/003.yaml
  text: He restores my soul[c][b][a]; he leads me in paths of righteousness for the sake of his name.
translation:
  language: te
  text: ఆయన నా ప్రాణాన్ని పునరుద్ధరిస్తాడు[a]; తన నామం నిమిత్తం[c] నీతి మార్గాల్లో[b] నన్ను నడిపిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నా జీవితాన్ని మళ్లీ చైతన్యపరుస్తాడు,’ ‘నాకు నూతన బలం ఇస్తాడు,’ లేదా ‘నన్ను తిరిగి తీసుకొస్తాడు’ అని కూడా అనువదించవచ్చు. హెబ్రీలోని ‘నా ప్రాణం’ అనే మాట కేవలం శరీరానికి వేరైన ఆత్మనే కాక, వ్యక్తి జీవితం లేదా సంపూర్ణ స్వరూపాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘సరైన మార్గాల్లో’ లేదా ‘న్యాయ మార్గాల్లో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘తన నామం నిమిత్తం’ అంటే తన స్వభావం, ఘనత, కీర్తి లేదా ప్రతిష్ఠ కొరకు—వాటిని కాపాడుటకై—అని భావం.
    reason: cultural_note
lexical_decisions:
- source_word: נַפְשִׁי
  choice: నా ప్రాణాన్ని
  rationale: נֶפֶשׁ ఇక్కడ కేవలం శరీరానికి వేరైన ‘ఆత్మ’ను కాక, వ్యక్తి ప్రాణం లేదా సంపూర్ణ స్వరూపాన్ని సూచించగలదు. ‘ప్రాణం’ తెలుగు కవితా సందర్భంలో ఈ విస్తృత భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: יְשׁוֹבֵב
  choice: పునరుద్ధరిస్తాడు
  rationale: שוב ధాతువు తిరిగి తీసుకురావడం, పునరుద్ధరించడం, మళ్లీ చైతన్యపరచడం అనే భావాలను ఇవ్వగలదు. ‘పునరుద్ధరిస్తాడు’ ఈ ఉద్దేశపూర్వక పునఃస్థాపనను స్పష్టంగా తెలియజేస్తూ మూలంలోని భావవిస్తృతిని కాపాడుతుంది.
- source_word: יַנְחֵנִי
  choice: నన్ను నడిపిస్తాడు
  rationale: נחה యొక్క హిఫీల్ రూపం నడిపించడం లేదా మార్గదర్శనం చేయడం అని అర్థం. ‘నడిపిస్తాడు’ కాపరి రూపకానికి తగిన స్పష్టమైన పదం.
- source_word: בְמַעְגְּלֵי
  choice: మార్గాల్లో
  rationale: מַעְגָּל నడిచే బాట, త్రోవ లేదా జీవన గమనాన్ని సూచిస్తుంది. ‘మార్గాలు’ భౌతిక బాటను, నైతిక జీవన విధానాన్ని రెండింటినీ వ్యక్తం చేయగలదు.
- source_word: צֶדֶק
  choice: నీతి
  rationale: צֶדֶק నీతి, న్యాయం, సరైనదనం అనే సంబంధిత భావాలను కలిగి ఉంది. ‘నీతి మార్గాలు’ నైతికంగా సరైన నడతను ప్రధానంగా చూపుతూ మూలంలోని ధార్మిక బలాన్ని నిలుపుతుంది.
- source_word: לְמַעַן
  choice: నిమిత్తం
  rationale: לְמַעַן ఉద్దేశం లేదా ప్రేరణను సూచిస్తుంది. ‘తన నామం నిమిత్తం’ దేవుడు తన నామ ఘనతను దృష్టిలో ఉంచుకొని నడిపిస్తాడనే భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: שְׁמוֹ
  choice: తన నామం
  rationale: שֵׁם అక్షరార్థంగా పేరు; సందర్భానుసారంగా వ్యక్తిత్వం, ఘనత, కీర్తి అనే భావాలనూ కలిగి ఉంటుంది. లేఖన సంబంధమైన ప్రతిధ్వనిని నిలుపడానికి ‘నామం’ ఉంచబడింది; విస్తృత భావం పాదసూచికలో వివరించబడింది.
theological_decisions:
- issue: ‘నా ప్రాణాన్ని పునరుద్ధరిస్తాడు’ అనే మాట యొక్క భావం
  choice: కాపరి సంరక్షణలో కీర్తనకర్త ప్రాణం లేదా సంపూర్ణ వ్యక్తిత్వం పునరుద్ధరించబడటం
  alternative: ఆయన నాకు నూతన చైతన్యం ఇస్తాడు; ఆయన నన్ను తిరిగి తీసుకొస్తాడు
  rationale: נֶפֶשׁను కేవలం అభౌతిక ఆత్మగా పరిమితం చేయకుండా, జీవితం మరియు సంపూర్ణ వ్యక్తిని కలుపుకునే హెబ్రీ భావాన్ని ‘ప్రాణం’ నిలుపుతుంది. שוב ధాతువులోని పునరుద్ధరణ, చైతన్యప్రాప్తి, తిరిగి రావడం అనే అవకాశాలను పాదసూచిక గుర్తిస్తుంది.
- issue: ‘నీతి మార్గాలు’ అనే పదబంధం యొక్క భావం
  choice: దేవుని మార్గదర్శకత్వంలో నైతికంగా సరైన జీవన మార్గాలు
  alternative: సరైన మార్గాలు; న్యాయ మార్గాలు
  rationale: צֶדֶק నైతిక నీతిని ప్రధానంగా సూచించగలిగినా, సరైన లేదా న్యాయమైన మార్గాలు అనే భావసాధ్యతను పూర్తిగా తొలగించదు. ప్రధాన పాఠం ధార్మిక-నైతిక బలాన్ని నిలుపుతూ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- issue: ‘తన నామం నిమిత్తం’ అనే మాట యొక్క భావం
  choice: దేవుడు తన స్వభావం, ఘనత, కీర్తికి తగినట్లుగా నడిపించడం
  alternative: తన కీర్తి కోసం; తన పేరును బట్టి
  rationale: ‘నామం’ అనే మూల రూపాన్ని నిలుపడం లేఖనంలోని దైవనామ ప్రాధాన్యాన్ని కాపాడుతుంది; అదే సమయంలో అది కేవలం పిలుపుపేరు కాదని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే కవితా గద్యశైలి ఉపయోగించబడింది. ‘ప్రాణం,’ ‘నీతి,’ ‘నామం నిమిత్తం’ వంటి లేఖనపరమైన పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచి, వాటి విస్తృత హెబ్రీ భావాలను పాదసూచికల్లో స్పష్టం చేశాం.
