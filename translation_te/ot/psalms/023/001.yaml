id: PSA.23.1
reference: Psalms 23:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִזְמ֥וֹר לְ/דָוִ֑ד יְהוָ֥ה רֹ֝עִ֗/י לֹ֣א אֶחְסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/001.yaml
  text: A psalm of David[a]. Yahweh is my shepherd[c][b]; I will not lack.
translation:
  language: te
  text: 'దావీదుకు చెందిన కీర్తన[a].


    యాహ్వే[b] నా కాపరి; నాకు కొదువ ఉండదు[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దావీదు రచించిన కీర్తన’ లేదా ‘దావీదు కోసం కీర్తన’ అని కూడా అర్థం కావచ్చు; హీబ్రూ לְדָוִד రచనను, అంకితాన్ని లేదా సంబంధాన్ని సూచించగలదు.
    reason: alternative_reading
  - marker: b
    text: 'హీబ్రూ: YHWH (יהוה); ఇది ఇశ్రాయేలు దేవుని వ్యక్తిగత నామం. అనేక అనువాదాలు సంప్రదాయంగా దీనిని ‘ప్రభువు’ అని అనువదిస్తాయి.'
    reason: lexical_alternative
  - marker: c
    text: ‘నేను కొదువపడను’ లేదా ‘నాకు ఏ లోటూ ఉండదు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: కీర్తన శీర్షికలోని సాహిత్య ప్రక్రియను సూచించే సాధారణమైన, సహజమైన తెలుగు పదం.
- source_word: לְדָוִד
  choice: దావీదుకు చెందిన
  rationale: לְ ఉపసర్గ రచయితను, అంకితాన్ని, స్వామ్యాన్ని లేదా సంబంధాన్ని సూచించగలదు. ‘దావీదుకు చెందిన’ అనే రూపం రచయిత దావీదే అని తేల్చకుండా ఆ విస్తృత సంబంధాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించింది.
- source_word: רֹעִי
  choice: నా కాపరి
  rationale: רעה మూలం నుండి వచ్చిన ఈ రూపం మందను మేపి సంరక్షించే వ్యక్తిని సూచిస్తుంది. ‘నా కాపరి’ మూలంలోని వ్యక్తిగత రూపకాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: לֹא אֶחְסָר
  choice: నాకు కొదువ ఉండదు
  rationale: חסר అంటే కొదువపడడం లేదా అవసరమైనది లేకపోవడం. ఈ అనువాదం నిషేధాన్ని, భవిష్యత్ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాకుండా దైవనామమే ఉంది; అందువల్ల దానిని ‘యాహ్వే’గా ఉంచడం మూలంలోని వ్యక్తిగత నామాన్ని కాపాడుతుంది.
- issue: לְדָוִד శీర్షిక భావం
  choice: దావీదుకు చెందిన
  alternative: దావీదు రచించిన / దావీదు కోసం
  rationale: హీబ్రూ నిర్మాణం రచన, అంకితం, స్వామ్యం లేదా సంబంధం అనే భావాలకు వీలు ఇస్తుంది. ఎంపిక చేసిన రూపం ఏ ఒక్క భావాన్నీ అనవసరంగా ఖరారు చేయదు.
- issue: కాపరి రూపకంలో వాగ్దాన భావం
  choice: నాకు కొదువ ఉండదు
  alternative: నేను కొదువపడను / నాకు ఏ లోటూ ఉండదు
  rationale: హీబ్రూ క్రియకు సందర్భానుసారంగా వర్తమాన నిశ్చయత లేదా భవిష్యత్ విశ్వాసం వినిపించవచ్చు. తెలుగు రూపం కాపరి సంరక్షణపై నమ్మకాన్ని వ్యక్తం చేస్తూ, ఏ నిర్దిష్ట భౌతిక సమృద్ధి సిద్ధాంతాన్నీ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కీర్తనా శైలి వాడబడింది. ‘కీర్తన,’ ‘కాపరి,’ ‘కొదువ’ పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని సంక్షిప్తతను మరియు రూపకాన్ని నిలుపుతాయి.
