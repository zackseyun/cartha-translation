id: PSA.23.6
reference: Psalms 23:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַ֤ךְ ט֤וֹב וָ/חֶ֣סֶד יִ֭רְדְּפוּ/נִי כָּל יְמֵ֣י חַיָּ֑/י וְ/שַׁבְתִּ֥י בְּ/בֵית יְ֝הוָ֗ה לְ/אֹ֣רֶךְ יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/006.yaml
  text: Surely goodness and steadfast love will pursue me all the days of my life[c][b][a], and I will dwell in the house of Yahweh for length of days.
translation:
  language: te
  text: నిశ్చయంగా, మేలు మరియు స్థిరమైన ప్రేమ నా జీవిత దినాలన్నిటిలో నన్ను వెంబడిస్తాయి; నేను యెహోవా మందిరంలో నివసిస్తాను[a] చిరకాలం[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను యెహోవా మందిరానికి తిరిగి వస్తాను.” మసొరెతిక్ పాఠంలోని స్వరచిహ్నాలు “నివసిస్తాను” అనే అర్థానికి మద్దతిస్తాయి; అయితే “తిరిగి వస్తాను” అనేది చాలాకాలంగా ఉన్న ప్రత్యామ్నాయ పఠనం.
    reason: alternative_reading
  - marker: b
    text: లేదా, “ఎప్పటికీ.” హీబ్రూ పదబంధం అక్షరార్థంగా “దీర్ఘమైన రోజుల వరకు” అని ఉంటుంది; అది సుదీర్ఘమైన, కొనసాగుతున్న కాలాన్ని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: నిశ్చయంగా
  rationale: ఇక్కడ ఈ అవ్యయం పరిమితిని కాక, కీర్తన ముగింపులోని దృఢ నమ్మకాన్ని తెలియజేస్తుంది.
- source_word: טוֹב
  choice: మేలు
  rationale: חֶסֶדతో సమాంతరంగా ఉండి, దేవుని మేలుచేసే సంరక్షణను సూచిస్తుంది; ఆధునిక తెలుగులో ‘మేలు’ సహజంగా, విస్తృతార్థంతో ఉంటుంది.
- source_word: חֶסֶד
  choice: నిలకడైన ప్రేమ
  rationale: విశ్వసనీయమైన, దీర్ఘకాలికమైన ప్రేమ భావాన్ని తెలియజేస్తూ, ‘కరుణ’కన్నా మూలపదపు విస్తృతిని మెరుగ్గా కాపాడుతుంది.
- source_word: יִרְדְּפוּנִי
  choice: నన్ను వెంబడిస్తాయి
  rationale: ‘వెంట వస్తాయి’ అనే బలహీన భావానికి బదులు, మేలు మరియు ప్రేమ కీర్తనకర్తను చురుకుగా వెంబడిస్తున్న సజీవ రూపకాన్ని నిలుపుతుంది.
- source_word: כָּל יְמֵי חַיָּי
  choice: నా జీవితకాలమంతా
  rationale: జీవితంలోని రోజులన్నిటినీ సూచించే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో సంపూర్ణంగా వ్యక్తపరుస్తుంది.
- source_word: וְשַׁבְתִּי
  choice: నివసిస్తాను
  rationale: మసొరెతిక్ స్వరచిహ్నాల ప్రకారం ישׁב నుంచి వచ్చిన ‘నివసించు’ అనే అర్థం సందర్భానికి సరిపోతుంది; ‘తిరిగి వస్తాను’ అనే పఠనం పాదసూచికలో ఉంచబడింది.
- source_word: בְּבֵית יְהוָה
  choice: యెహోవా మందిరంలో
  rationale: ‘యెహోవా ఇంటిలో’ అన్న అక్షరార్థం సాధ్యమైనా, ఆరాధనా స్థలాన్ని సూచించే సందర్భంలో ‘మందిరం’ తెలుగులో సహజంగా concrete cultic imageryని అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచుతుంది.
- source_word: לְאֹרֶךְ יָמִים
  choice: చిరకాలం
  rationale: అక్షరార్థంగా ‘దీర్ఘమైన రోజుల వరకు’ అనే కాలవ్యాప్తిని సహజమైన, గంభీరమైన తెలుగులో తెలియజేస్తుంది; అది తప్పనిసరిగా అంతులేని కాలమని ప్రధాన పాఠ్యంలో నిర్ణయించదు.
theological_decisions:
- issue: לְאֹרֶךְ יָמִים సూచించే కాలవ్యాప్తి
  choice: చిరకాలం
  alternative: ఎప్పటికీ
  rationale: మూలంలోని నుడికారం దీర్ఘమైన లేదా కొనసాగుతున్న సహవాసాన్ని సూచిస్తుంది; దానిని స్పష్టంగా అంతులేని కాలంగా నిర్ణయించకుండా ‘చిరకాలం’గా ఉంచి, ‘ఎప్పటికీ’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఇచ్చాం.
- issue: וְשַׁבְתִּי యొక్క అర్థం
  choice: నివసిస్తాను
  alternative: తిరిగి వస్తాను
  rationale: మసొరెతిక్ పాఠపు స్వరచిహ్నాలు ‘నివసిస్తాను’ అనే పఠనాన్ని సమర్థిస్తాయి; సుదీర్ఘ అనువాద సంప్రదాయంలో ఉన్న ‘తిరిగి వస్తాను’ అనే ప్రత్యామ్నాయాన్ని మాత్రం పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కీర్తనా శైలిని అనుసరించాం. ‘వెంబడిస్తాయి’ ద్వారా మూలంలోని సజీవ రూపకాన్ని నిలిపాం. ప్రధాన పాఠ్యాన్ని భారంగా చేయకుండా నిజమైన పాఠభేదం, కాలవ్యాప్తి సంబంధిత అర్థభేదాన్ని పాదసూచికల్లో సంరక్షించాం.
