revisions:
- from: నిశ్చయంగా, మేలు, నిలకడైన ప్రేమ నా జీవితకాలమంతా నన్ను వెంబడిస్తాయి; నేను యెహోవా మందిరంలో చిరకాలం[a][b] నివసిస్తాను.
  to: నిశ్చయంగా, మేలు మరియు స్థిరమైన ప్రేమ నా జీవిత దినాలన్నిటిలో నన్ను వెంబడిస్తాయి; నేను యెహోవా మందిరంలో నివసిస్తాను[a] చిరకాలం[b].
  rationale: 'ప్రధాన సవరణ పాదసూచిక-ఆధారాల స్థానాన్ని మూలపదాలకు సరిగా అనుసంధానించడం: a వְשַׁבְתִּי/‘నివసిస్తాను’కు, b లְאֹרֶךְ יָמִים/‘చిరకాలం’కు. అదనంగా, రెండు కర్తలను ‘మరియు’తో స్పష్టం చేసి, కాలనుడికారాన్ని ‘నా జీవిత దినాలన్నిటిలో’గా మూలానికి మరింత సమీపంగా చేశాం. దీర్ఘకాలం అంతులేనిదే అని ప్రధాన పాఠ్యంలో నిర్ణయించలేదు.'
