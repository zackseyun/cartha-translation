  rationale: The revision removes the unnatural explanatory apposition and replaces ‘secret place’ language with the contextually protective ‘shelter of your presence.’ It also renders the second verb with an idiomatic Telugu expression for deliberate concealment. The verse’s parallelism, the source ambiguity noted in footnote a, singular generic wording, poetic imagery, and all footnote anchors are preserved.
