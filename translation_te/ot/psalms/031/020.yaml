source:
  edition: WLC
  text: תַּסְתִּירֵ֤/ם בְּ/סֵ֥תֶר פָּנֶי/ךָ֮ מֵֽ/רֻכְסֵ֫י אִ֥ישׁ תִּצְפְּנֵ֥/ם בְּ/סֻכָּ֗ה מֵ/רִ֥יב לְשֹׁנֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/020.yaml
  text: You hide them in the shelter of your presence from the schemes of man[b][a]; you conceal them in a shelter from the strife of tongues.
translation:
  language: te
  text: 'మనుష్యుని కుట్రల నుండి[a]

    నీ సన్నిధి ఆశ్రయంలో వారిని దాచుతావు;

    నాలుకల కలహం నుండి[b]

    ఒక ఆశ్రయంలో వారిని దాచి ఉంచుతావు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మనుష్యుని పన్నాగాల నుండి’ లేదా ‘మనుష్యుని శత్రు కూటముల నుండి’ అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ పదం అరుదైనది; దాని ఖచ్చితమైన అర్థం అనిశ్చితం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నాలుకల కలహం నుండి’; అంటే శత్రుత్వపూరితమైన లేదా అపవాదు చేసే మాటల నుండి.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּירֵם
  choice: వారిని దాచుతావు
  rationale: סתר హిఫీల్ రూపం ఎవరినైనా దాగి ఉండేలా చేయడం లేదా దాచిపెట్టడం అనే క్రియాశీల రక్షణను సూచిస్తుంది.
- source_word: בְּסֵתֶר פָּנֶיךָ
  choice: నీ సన్నిధి అనే రహస్య స్థలంలో
  rationale: סֵתֶר యొక్క ‘రహస్య స్థలం/దాగుచోటు’ భావాన్నీ, פָּנִים యొక్క సందర్భోచిత ‘సన్నిధి’ భావాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מֵרֻכְסֵי אִישׁ
  choice: మనుష్యుని కుట్రల నుండి
  rationale: అరుదైన רֻכְסֵי పదం అర్థం అనిశ్చితమైనదైనా, సందర్భంలో శత్రుత్వపూరిత పన్నాగాలు లేదా కూటములను సూచించవచ్చు; ‘కుట్రలు’ ఆ భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది. אִישׁ ఏకవచన రూపాన్ని ‘మనుష్యుడు’గా నిలిపాం.
- source_word: תִּצְפְּנֵם
  choice: వారిని మరుగుపరుస్తావు
  rationale: צפן అంటే దాచడం, భద్రంగా ఉంచడం. మొదటి పాదంలోని ‘దాచుతావు’తో సంబంధాన్ని నిలుపుతూ తెలుగు కవిత్వంలో స్వల్ప వైవిధ్యాన్ని ఇస్తుంది.
- source_word: בְּסֻכָּה
  choice: ఒక ఆశ్రయంలో
  rationale: סֻכָּה అక్షరార్థంగా పందిరి లేదా తాత్కాలిక కప్పు అయినా, ఇక్కడ రక్షణనిచ్చే ఆశ్రయం ప్రధాన భావం.
- source_word: מֵרִיב לְשֹׁנוֹת
  choice: నాలుకల కలహం నుండి
  rationale: רִיב యొక్క కలహం/వివాదం భావాన్నీ, לְשֹׁנוֹת లోని ‘నాలుకలు’ అనే సజీవ రూపకాలంకారాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: אִישׁ యొక్క లింగం మరియు సంఖ్య
  choice: మనుష్యుని
  alternative: మనుషుల / ప్రజల
  rationale: హీబ్రూ పదం పుంలింగ ఏకవచనం; ఇక్కడ అది ప్రతినిధి లేదా సాధారణ అర్థంలో వాడబడినా, మూలంలోని ఏకవచన రూపాన్ని తెలుగులో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గౌరవప్రదమైన కవితా శైలి. ‘సన్నిధి,’ ‘రహస్య స్థలం,’ ‘నాలుకల కలహం’ ద్వారా మూలంలోని సమీపత, రక్షణ, రూపకాలంకారం నిలుపబడ్డాయి.
