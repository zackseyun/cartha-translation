  text: My times are in your hand[a]; rescue me from the hand of my enemies and from my pursuers.
translation:
  language: te
  text: నా కాలాలు నీ చేతిలో ఉన్నాయి[a]; నా శత్రువుల చేతిలోనుండి, నన్ను తరుముతున్నవారి నుండీ నన్ను రక్షించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నాకు నియమించబడిన సమయాలు’ లేదా ‘నా పరిస్థితులు.’ హీబ్రూలోని ‘నా కాలాలు’ అనే మాట ఒకరి జీవితంలోని వివిధ దశలను, సంఘటనలను విస్తృతంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָדְךָ
  choice: నీ చేతిలో ఉన్నాయి
  rationale: దేవుని అధికారం, నియంత్రణ అనే భావాన్ని మితిమీరకుండా తెలిపే హీబ్రూ ‘చేతి’ రూపకాన్ని నిలుపుతుంది; తరువాతి ‘శత్రువుల చేతిలోనుండి’ అనే పదబంధంతో కవితాత్మక సమాంతరతను కూడా కాపాడుతుంది.
- source_word: עִתֹּתָי
  choice: నా కాలాలు
  rationale: జీవితంలోని సమయాలు, ఋతువులు, నియమిత సందర్భాలు, పరిస్థితులు అన్న విస్తృత భావసాధ్యతను కుదించకుండా ఉంచుతుంది.
- source_word: הַצִּילֵנִי
  choice: నన్ను రక్షించు
  rationale: ప్రమాదకరమైన శత్రువుల చేతినుండి విడిపించమనే సందర్భోచితమైన, సహజమైన ఆధునిక తెలుగు వ్యక్తీకరణ.
- source_word: מִיַּד
  choice: చేతిలోనుండి
  rationale: మొదటి పాదంలోని ‘నీ చేతిలో’ అనే రూపకానికి ఉద్దేశపూర్వక ప్రతిధ్వనిని నిలిపి, దేవుని అధికారం మరియు శత్రువుల పట్టుకు మధ్య వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: אֹיְבַי
  choice: నా శత్రువులు
  rationale: వ్యతిరేకుల్ని సూచించే మూలపదానికి నేరమైన, ప్రామాణిక తెలుగు అనువాదం.
- source_word: וּמֵרֹדְפָי
  choice: నన్ను తరుముతున్నవారు
  rationale: కీర్తనకర్తను వెంటాడుతున్నవారనే సజీవ క్రియాత్మక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ‘హింసించేవారు’ అని అనువదించి భావాన్ని అనవసరంగా విస్తరించదు.
theological_decisions:
- issue: ‘నా కాలాలు’ అనే పదబంధపు భావపరిధి
  choice: కీర్తనకర్త జీవితంలోని కాలాలు, సందర్భాలు దేవుని అధికారంలో ఉన్నాయనే విస్తృత సూచన
  alternative: ‘నా విధి’ లేదా కేవలం ‘నాకు నియమించబడిన సమయాలు’
  rationale: హీబ్రూ పదబంధం కవితాత్మకంగా విస్తృతమైనది. ‘విధి’ అని నిర్ణయాత్మకంగా కుదించకుండా, అలాగే కేవలం నియమిత క్షణాలకు పరిమితం చేయకుండా దాని నిజమైన భావవిస్తృతిని అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి. ‘చేతి’ రూపకాన్ని రెండు పాదాల్లోనూ నిలిపి మూలంలోని పదప్రతిధ్వనిని సంరక్షించాం; ‘తరుముతున్నవారు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండే క్రియాత్మక రూపం.
