revisions:
- from: యాహ్వే కోసం నిరీక్షించే[a] వారలారా, మీరందరూ బలంగా ఉండండి; మీ హృదయాలు ధైర్యంగా ఉండనివ్వండి.
  to: బలంగా ఉండండి; మీ హృదయాలు ధైర్యం పొందుగాక, యాహ్వే కోసం నిరీక్షించే[a] వారలారా, మీరందరూ.
  rationale: The revision retains all source-level meanings while replacing an unnatural permissive expression with an idiomatic Telugu jussive-style exhortation. It also restores the imperative-first rhetorical order of the Hebrew. The lexical footnote continues to preserve the legitimate “hope” nuance of יחל.
