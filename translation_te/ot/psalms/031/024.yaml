source:
  edition: WLC
  text: חִ֭זְקוּ וְ/יַאֲמֵ֣ץ לְבַבְ/כֶ֑ם כָּל הַ֝/מְיַחֲלִ֗ים לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/024.yaml
  text: Be strong[a], and let your heart be courageous, all you who wait for Yahweh.
translation:
  language: te
  text: బలంగా ఉండండి; మీ హృదయాలు ధైర్యం పొందుగాక, యాహ్వే కోసం నిరీక్షించే[a] వారలారా, మీరందరూ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యాహ్వేపై ఆశ ఉంచే.’ హెబ్రీ క్రియలో నిరీక్షించడం, ఆశ ఉంచడం అనే రెండు భావాలూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ
  choice: బలంగా ఉండండి
  rationale: חזק అనే క్రియ యొక్క బహువచన ఆజ్ఞారూపాన్ని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְיַאֲמֵץ
  choice: ధైర్యంగా ఉండనివ్వండి
  rationale: మొదటి ఆజ్ఞను అనుసరించే ప్రోత్సాహక భావాన్ని నిలుపుతూ, హృదయం దృఢత పొందాలనే అర్థాన్ని సహజంగా వ్యక్తం చేస్తుంది; ముందున్న ‘బలంగా’ అనే పదాన్ని అనవసరంగా పునరావృతం చేయదు.
- source_word: לְבַבְכֶם
  choice: మీ హృదయాలు
  rationale: לֵבָב ఇక్కడ మనిషి అంతరంగాన్ని, ముఖ్యంగా సంకల్పం మరియు ధైర్యాన్ని సూచిస్తుంది. బహువచన సంబోధనకు తెలుగులో ‘మీ హృదయాలు’ సహజంగా సరిపోతుంది.
- source_word: כָּל
  choice: మీరందరూ
  rationale: సంబోధించబడుతున్న సమూహంలోని వారందరినీ చేర్చే హెబ్రీ పరిమాణార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמְיַחֲלִים
  choice: నిరీక్షించే
  rationale: יחל క్రియలో కాలం గడుపుతూ వేచిచూడటం మాత్రమే కాక, నమ్మకంతో ఆశగా ఎదురుచూడటం కూడా ఉంది. ‘నిరీక్షించే’ ఈ రెండు ఛాయలను తెలుగులో చాలావరకు నిలుపుతుంది; ‘ఆశపెట్టుకునే’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తున్నాం.
- source_word: לַיהוָה
  choice: యాహ్వే కోసం
  rationale: יחלతో వచ్చిన לְ ఎవరిని ఉద్దేశించి నిరీక్షిస్తున్నారో సూచిస్తుంది. ‘కోసం’ తెలుగులో ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది; יהוה అనే ప్రత్యేక దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాకుండా దేవుని ప్రత్యేక నామమైన יהוה నేరుగా ఉంది. అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను నిలుపుతుంది.
- issue: హృదయం ధైర్యపడే వాక్యంలోని కర్త మరియు భావం
  choice: మీ హృదయాలు ధైర్యంగా ఉండనివ్వండి
  alternative: ఆయన మీ హృదయాలను బలపరచుగాక
  rationale: וְיַאֲמֵץ రూపాన్ని దేవుడే అంతర్లీన కర్త అని నిర్బంధంగా నిర్ణయించకుండా, ఆజ్ఞను అనుసరించే ప్రోత్సాహక భావంగా ఇచ్చాం. దీనివల్ల మూలంలోని సంక్షిప్తత మరియు కొంత వ్యాకరణ అనిశ్చితి అతిగా పరిష్కరించబడవు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కవితాత్మక ప్రోత్సాహంగా రూపొందించబడింది. ‘వారలారా’ అనే సంబోధన గంభీరతను ఇస్తూనే సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది; వాక్యక్రమం తెలుగులో సహజంగా ఉండేందుకు సంబోధిత సమూహాన్ని ముందుకు తీసుకొచ్చాం.
