    text: లేదా, ‘యాహ్వేపై ఆశ ఉంచే.’ హెబ్రీ క్రియలో నిరీక్షించడం, ఆశ ఉంచడం అనే రెండు భావాలూ ఉండవచ్చు.
    reason: lexical_alternative
