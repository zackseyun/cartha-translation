source:
  edition: WLC
  text: וְ/לֹ֣א הִ֭סְגַּרְתַּ/נִי בְּ/יַד אוֹיֵ֑ב הֶֽעֱמַ֖דְתָּ בַ/מֶּרְחָ֣ב רַגְלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/008.yaml
  text: and you have not delivered me into the hand of the enemy[b][a]; you have set my feet in a broad place.
translation:
  language: te
  text: శత్రువు చేతికి నన్ను అప్పగించలేదు[a]; విశాలమైన చోట నా పాదాలను నిలిపావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శత్రువు అధికారానికి నన్ను అప్పగించలేదు.’
    reason: lexical_alternative
  - marker: b
    text: ‘విశాలమైన చోట’ అనేది ఇరుకు పరిస్థితి లేదా ఆపద నుంచి లభించిన స్వేచ్ఛ, భద్రత, ఉపశమనాన్ని సూచించే రూపకం.
    reason: cultural_note
lexical_decisions:
- source_word: הִסְגַּרְתַּנִי
  choice: నన్ను అప్పగించలేదు
  rationale: ఇక్కడ סגר హిఫీల్ రూపం ఒకరిని మరొకరి అధీనానికి అప్పగించడం అనే భావాన్ని ఇస్తుంది. ‘అప్పగించలేదు’ ఆధునిక తెలుగులో సహజంగా ఉండి, శత్రువు వశానికి ఒప్పజెప్పకపోవడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּיַד
  choice: చేతికి
  rationale: హీబ్రూ ‘చేతిలో/చేతికి’ అనే నుడికారం ఒకరి అధీనాన్ని సూచిస్తుంది. ‘చేతికి’ అనే రూపం మూలంలోని సజీవ చిత్రాన్ని, అధికార భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: אוֹיֵב
  choice: శత్రువు
  rationale: ఏకవచన రూపం సందర్భంలో ప్రతికూల శక్తిని సాధారణంగా సూచిస్తుంది. ‘శత్రువు’ కీర్తన భాషలో సహజమైన, గంభీరమైన పదం.
- source_word: הֶעֱמַדְתָּ
  choice: నిలిపావు
  rationale: עמד హిఫీల్ రూపం ‘నిలబడేలా చేయడం’ లేదా ‘నిలపడం’ అని అర్థం. ‘నిలిపావు’ మూల క్రియను నేరుగా ప్రతిబింబిస్తూ స్థిరంగా ఉంచిన భావాన్నీ అందిస్తుంది.
- source_word: בַמֶּרְחָב
  choice: విశాలమైన చోట
  rationale: מֶרְחָב ఇరుకు లేదా ఆపదకు విరుద్ధంగా విశాలతను, స్వేచ్ఛను సూచిస్తుంది. ‘విశాలమైన చోట’ రూపకాన్ని వ్యాఖ్యానంగా మార్చకుండా సహజ తెలుగులో నిలుపుతుంది.
- source_word: רַגְלָי
  choice: నా పాదాలను
  rationale: మూలంలోని బహువచనాన్ని కాపాడుతుంది. గంభీరమైన కీర్తన శైలికి ‘పాదాలు’ తగినది.
- source_word: וְלֹא
  choice: '...లేదు'
  rationale: తెలుగు వాక్యనిర్మాణంలో నిషేధాన్ని క్రియాంతంలో సహజంగా వ్యక్తం చేశాం. ముందరి వచనంతో అనుసంధానం సందర్భం ద్వారా స్పష్టమవుతుంది; కృత్రిమంగా ‘మరియు’ చేర్చలేదు.
