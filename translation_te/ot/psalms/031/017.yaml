source:
  edition: WLC
  text: יְֽהוָ֗ה אַל אֵ֭בוֹשָׁה כִּ֣י קְרָאתִ֑י/ךָ יֵבֹ֥שׁוּ רְ֝שָׁעִ֗ים יִדְּמ֥וּ לִ/שְׁאֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/017.yaml
  text: O Yahweh[a], let me not be put to shame, for I call on you; let the wicked be put to shame; let them be silent in Sheol.
translation:
  language: te
  text: 'యాహ్వే,

    నన్ను అవమానపడనివ్వకు,

    ఎందుకంటే నేను నీకు మొరపెట్టుకున్నాను;

    దుష్టులు అవమానపడనివ్వు;

    వారు షియోల్లో మౌనంగా ఉండనివ్వు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారు షియోల్లో నిశ్చలంగా ఉండనివ్వు,” లేదా “వారు మౌనంగా షియోల్‌కు దిగిపోనివ్వు.” హెబ్రీ క్రియ మౌనాన్ని లేదా నిశ్చలతను సూచించగలదు. “షియోల్” అంటే మృతుల లోకం; అది తప్పనిసరిగా “నరకం” అని అర్థం కాదు.
    reason: יִדְּמוּ మరియు לִשְׁאוֹל‌లకు ఉన్న భావ, వ్యాకరణ ప్రత్యామ్నాయాలను మరియు షియోల్ పదం యొక్క సాంస్కృతిక భావాన్ని స్పష్టం చేయడం.
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: אַל אֵבוֹשָׁה
  choice: నన్ను అవమానానికి గురికానివ్వకు
  rationale: אַל‌తో కూడిన ప్రార్థనాత్మక నిషేధ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, בושׁ యొక్క అవమానం పొందే ఫలితార్థాన్ని నిలుపుతుంది.
- source_word: כִּי קְרָאתִיךָ
  choice: నేను నీకు మొరపెట్టుకున్నాను కాబట్టి
  rationale: పూర్తిక్రియా రూపాన్ని గౌరవిస్తూ, దేవునికి చేసే ప్రార్థన లేదా సహాయవిన్నపం అనే קרא భావాన్ని ‘మొరపెట్టుకున్నాను’ సహజంగా తెలియజేస్తుంది.
- source_word: יֵבֹשׁוּ רְשָׁעִים
  choice: దుష్టులు అవమానానికి గురికానివ్వు
  rationale: మొదటి పాదంలోని בושׁతో ఉన్న పదసామ్యాన్ని అదే తెలుగు పదబంధంతో నిలిపి, యుస్సివ్ ప్రార్థన భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: יִדְּמוּ
  choice: మౌనంగా ఉండనివ్వు
  rationale: ఈ క్రియకు సాధ్యమైన ‘మౌనంగా ఉండు’ అనే భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, కారణార్థకమైన ‘మౌనపరచబడనివ్వు’ అనే అదనపు భావాన్ని చేర్చలేదు; ‘నిశ్చలంగా ఉండు’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: לִשְׁאוֹל
  choice: షియోల్లో
  rationale: שְׁאוֹל‌ను ఒక సమాధిగా లేదా నరకంగా పరిమితం చేయకుండా, మృతుల లోకాన్ని సూచించే హెబ్రీ పదంగా లిప్యంతరీకరించింది. ל ఉపసర్గను సందర్భానుసారంగా స్థితిని సూచించే ‘లో’గా అనువదించింది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠ్యంలో ఉన్న వ్యక్తిగత దైవ నామాన్ని స్పష్టంగా నిలుపుతుంది; బిరుదుతో భర్తీ చేయదు.
- issue: שְׁאוֹל యొక్క భావం
  choice: షియోల్
  alternative: సమాధి; మృతుల లోకం
  rationale: ఈ పదాన్ని కేవలం వ్యక్తిగత సమాధిగా గానీ, తరువాతి కాలపు ‘నరకం’ భావంగా గానీ నిర్ణయించకుండా మూలంలోని భావవిస్తృతిని నిలుపుతుంది.
- issue: יִדְּמוּ యొక్క మౌనం లేదా నిశ్చలత
  choice: మౌనంగా ఉండనివ్వు
  alternative: నిశ్చలంగా ఉండనివ్వు; మౌనంగా షియోల్‌కు దిగిపోనివ్వు
  rationale: మరణం, మౌనం, నిశ్చలతల మధ్య ఉన్న కవితాత్మక అస్పష్టతను పూర్తిగా పరిష్కరించకుండా ప్రధాన భావాన్ని సహజంగా అందించి, ఇతర సాధ్యార్థాలను పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనా కవిత్వానికి తగిన గంభీరతతో రచించబడింది. ‘అవమానానికి గురికానివ్వు’ అనే పునరుక్తి హెబ్రీ సమాంతర నిర్మాణాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది. పాద విభజన కీర్తనలోని మూడు ప్రార్థనాత్మక వాక్యభాగాలను స్పష్టంగా చూపుతుంది.
