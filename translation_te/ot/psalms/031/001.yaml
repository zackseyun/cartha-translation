  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/ךָ֖ יְהוָ֣ה חָ֭סִיתִי אַל אֵב֣וֹשָׁה לְ/עוֹלָ֑ם בְּ/צִדְקָתְ/ךָ֥ פַלְּטֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/001.yaml
  text: In you[a], O Yahweh, I have taken refuge; let me never be put to shame. In your righteousness deliver me.
translation:
  language: te
  text: 'యెహోవా, నీలో నేను ఆశ్రయం పొందాను;

    నన్ను ఎన్నటికీ అవమానానికి గురికానివ్వకు.

    నీ నీతిని బట్టి నన్ను విడిపించు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ న్యాయాన్ని బట్టి నన్ను విడిపించు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּךָ
  choice: నీలో
  rationale: హీబ్రూ ఉపసర్గతో కూడిన రూపాన్ని, అలాగే ఆశ్రయ రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: חָסִיתִי
  choice: నేను ఆశ్రయం పొందాను
  rationale: సంపూర్ణమైన లేదా స్థిరపడిన ఆశ్రయస్థితిని, חסה లోని రక్షణస్థల రూపకాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אַל־אֵבוֹשָׁה לְעוֹלָם
  choice: నేను ఎన్నటికీ అవమానం పాలుకానివ్వకు
  rationale: ప్రార్థనాత్మక నిషేధాన్ని, విఫలమైన నిరీక్షణవల్ల కలిగే బహిరంగ అవమాన భావాన్ని, לְעוֹלָם యొక్క సంపూర్ణ ప్రతికూల బలాన్ని నిలుపుతుంది.
- source_word: בְּצִדְקָתְךָ
  choice: నీ నీతిని బట్టి
  rationale: בְּ యొక్క ఆధార లేదా సాధన భావాన్ని సహజంగా తెలియజేస్తూ, צְדָקָה యొక్క విస్తృతమైన నీతి భావాన్ని కాపాడుతుంది.
- source_word: פַלְּטֵנִי
  choice: నన్ను విడిపించు
  rationale: ప్రమాదం నుంచి క్రియాశీలంగా తప్పించి రక్షించాలనే పీయేల్ ఆజ్ఞార్థక భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చలేదు. ఆధునిక ప్రామాణిక తెలుగులో బైబిల్ పాఠకులకు విస్తృతంగా పరిచితమైన రూపం ‘యెహోవా’; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయ లిప్యంతరీకరణ.
- issue: దేవుని రక్షణకార్యానికి ఆధారమైన צִדְקָה
  choice: నీతి
  alternative: న్యాయం
  rationale: ఇక్కడ దేవుని సరిగానూ నమ్మకంగానూ వ్యవహరించే స్వభావం రక్షణకు ఆధారంగా ప్రస్తావించబడింది. ‘నీతి’ ఆ విస్తృతిని నిలుపుతుంది; ‘న్యాయం’ సాధ్యమైనా కొంత సంకుచితమైన భావం.
translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గంభీరమైన ప్రార్థనా శైలి. హీబ్రూ ఆశ్రయ రూపకాన్ని నిలిపి, అసహజమైన పదానువాదాన్ని నివారించింది.
