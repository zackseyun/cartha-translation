  terminology: ‘ఆశ్రయం పొందాను,’ ‘నీతి,’ and ‘విడిపించు’ are appropriate for the psalmic register. ‘నీతి’ suitably renders צִדְקָה, while the footnote preserves ‘న్యాయం’ as a viable lexical alternative.
