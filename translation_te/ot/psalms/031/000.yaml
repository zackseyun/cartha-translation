lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: గాననాయకునికి
  rationale: ఈ శీర్షిక పదం సంగీత ప్రదర్శనను పర్యవేక్షించే వ్యక్తిని సూచిస్తుంది. ‘గాననాయకుడు’ ఆరాధనా సంగీత సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; לַ ఉపసర్గను ‘-కి’గా అనువదించాం.
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: సంగీత సహవాద్యంతో పాడే గీతాన్ని సూచించే ప్రామాణిక కీర్తనల శీర్షిక పదం కావడంతో, తెలుగు బైబిలు సందర్భంలో సహజంగా అర్థమయ్యే ‘కీర్తన’ను ఎంచుకున్నాం.
- source_word: לְדָוִד
  choice: దావీదు
  rationale: ‘దావీదు కీర్తన’ అనే సంబంధ రూపం రచయిత, అనుబంధం, లేదా అంకితం అనే హెబ్రీ భావసాధ్యతలను సాధ్యమైనంత వరకు తెరిచి ఉంచుతుంది; ‘దావీదు రచించిన’ అని ప్రధాన పాఠంలో స్పష్టీకరించడం మూలంలోని సందిగ్ధతను తొలగిస్తుంది.
theological_decisions:
- issue: దావీదుతో కీర్తనకు ఉన్న సంబంధం
  choice: దావీదు కీర్తన
  alternative: దావీదు రచించిన కీర్తన; దావీదు కోసం కీర్తన
  rationale: హెబ్రీ לְדָוִד రచయితత్వాన్ని మాత్రమే తప్పనిసరిగా సూచించదు; అది రచయితత్వం, అనుబంధం, లేదా అంకితాన్ని సూచించవచ్చు. అందువల్ల ప్రధాన పాఠంలో సంబంధాన్ని విస్తృతంగా ఉంచి, ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన కీర్తన శీర్షిక శైలిని ఉపయోగించాం. సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా ‘గాననాయకుడు,’ ‘కీర్తన’ అనే పదాలను ఎంచుకున్నాం.
