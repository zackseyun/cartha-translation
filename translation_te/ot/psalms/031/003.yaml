- from: ఎందుకంటే నీవే నా బండవు, నా కోటవు[a][b]; నీ నామం నిమిత్తం నన్ను నడిపిస్తావు, నాకు దారి చూపిస్తావు[c][d].
  to: నీవే నా శిలవు, నా కోటవు[a][b]; నీ నామం నిమిత్తం నన్ను నడిపిస్తావు, నన్ను మార్గనిర్దేశం చేస్తావు[c][d].
  rationale: The revision replaces the less precise ‘బండ’ with ‘శిల’ to preserve the Hebrew refuge metaphor and adjusts the second verb so that both parallel Hebrew verbs take the psalmist explicitly as their object. The causal opening, emphatic pronoun, fortress image, name idiom, future-like confidence, and grammatical ambiguity footnote are retained.
