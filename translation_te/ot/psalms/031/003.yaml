review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents כִּי as causal, preserves the emphatic ‘you,’ renders מְצוּדָה as ‘fortress,’ retains ‘for your name’s sake,’ and appropriately renders the two imperfect verbs as confident future forms while noting the possible petitionary force. However, ‘బండ’ ordinarily denotes a boulder/stone in modern Telugu and less clearly conveys the Hebrew metaphor of a secure rock or crag (סֶלַע). ‘శిల’ is the more established and suitably poetic equivalent here.
  naturalness: The sentence is generally clear and modern. Replacing ‘బండవు’ with ‘శిలవు’ gives a more natural scriptural-poetic refuge image. ‘నాకు దారి చూపిస్తావు’ is understandable, but ‘నన్ను … మార్గనిర్దేశం చేస్తావు’ keeps both Hebrew verbs explicitly directed to the psalmist and maintains the close poetic parallelism.
  terminology: Use ‘శిల’ for סֶלַע and retain ‘కోట’ for מְצוּדָה. ‘నీ నామం నిమిత్తం’ is a faithful, non-interpretive rendering of לְמַעַן שִׁמְךָ. The paired ‘నడిపిస్తావు’ and ‘మార్గనిర్దేశం చేస్తావు’ preserves the overlapping but distinct guidance vocabulary.
  issues:
  - severity: medium
    issue: ‘నా బండవు’ for סַלְעִי
    rationale: ‘బండ’ can suggest an ordinary boulder rather than the stable rock/crag that functions as a refuge metaphor. ‘నా శిలవు’ more accurately preserves the established biblical image.
  - severity: low
    issue: The second guidance verb is phrased with an indirect object (‘నాకు దారి చూపిస్తావు’)
    rationale: This is intelligible, but the Hebrew has the psalmist as direct object in both verbs. Repeating ‘నన్ను’ with ‘మార్గనిర్దేశం చేస్తావు’ more closely reflects the parallel syntax and remains natural.
