  text: For you are my rock and my fortress[c][b][a]; and for your name’s sake you will lead me and guide me.
translation:
  language: te
  text: నీవే నా శిలవు, నా కోటవు[a][b]; నీ నామం నిమిత్తం నన్ను నడిపిస్తావు, నన్ను మార్గనిర్దేశం చేస్తావు[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీవే నా శిలవు, నా కోటవు కాబట్టి’ అని కూడా అనువదించవచ్చు. హీబ్రూ כִּי కారణాన్ని లేదా వివరణను పరిచయం చేయగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘నా కోటవు’కు బదులుగా ‘నా దుర్గమవు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలోని ఈ రెండు క్రియలు అర్థసామీప్యం గలవి. ‘నడిపిస్తావు’, ‘మార్గనిర్దేశం చేస్తావు’ అనే వేర్వేరు పదాలు వాటి కవితా సమాంతరతను ఒకే పదంలో కలపకుండా నిలుపుతున్నాయి.
    reason: lexical_alternative
  - marker: d
    text: లేదా విన్నపంగా, ‘నన్ను నడిపించు, నన్ను మార్గనిర్దేశం చేయి.’ హీబ్రూ అసంపూర్ణ క్రియారూపాలు ఈ ప్రార్థనా సందర్భంలో నమ్మకంతో కూడిన నిరీక్షణగా లేదా విన్నపంగా అర్థమవవచ్చు.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఈ సందర్భంలో కీర్తనకర్త విన్నపానికి ఆధారాన్ని తెలియజేస్తుంది. కారణార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; వివరణార్థక ఛాయ కూడా సాధ్యమేనని పాదటిప్పణి సూచిస్తుంది.
- source_word: סַלְעִי
  choice: నా బండవు
  rationale: భద్రమైన ఆశ్రయాన్ని సూచించే శిలారూపకాన్ని నేరుగా, తెలుగులో సుపరిచితమైన విధంగా నిలుపుతుంది.
- source_word: מְצוּדָתִי
  choice: నా కోటవు
  rationale: రక్షణనిచ్చే దుర్గస్థల భావాన్ని స్పష్టంగా అందిస్తుంది; ‘దుర్గం’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: אַתָּה
  choice: నీవే
  rationale: హీబ్రూలోని స్వతంత్ర సర్వనామం ఇచ్చే ఉద్ఘాటనను తెలుగు ‘ఏ’ ప్రత్యయంతో సహజంగా నిలుపుతుంది.
- source_word: וּלְמַעַן שִׁמְךָ
  choice: నీ నామం నిమిత్తం
  rationale: దేవుని నామం—ఆయన వెల్లడైన స్వభావం, ఘనత, విశ్వసనీయత—ఆయన చర్యకు ఆధారమని తెలిపే హీబ్రూ నుడికారాన్ని వ్యాఖ్యానించి విస్తరించకుండా నిలుపుతుంది.
- source_word: תַּנְחֵנִי
  choice: నన్ను నడిపిస్తావు
  rationale: దిశ చూపుతూ ముందుకు తీసుకువెళ్లే భావాన్ని అందిస్తుంది. ప్రార్థనా సందర్భంలో అసంపూర్ణ క్రియారూపాన్ని నమ్మకంతో కూడిన భవిష్యత్తుగా అనువదించింది.
- source_word: וּתְנַהֲלֵנִי
  choice: నాకు దారి చూపిస్తావు
  rationale: ముందటి క్రియతో అర్థసామీప్యం ఉన్నప్పటికీ, జాగ్రత్తగా మార్గదర్శనం చేసే ఛాయను ప్రత్యేక పదబంధంతో నిలిపి హీబ్రూ కవితా సమాంతరతను కాపాడుతుంది.
theological_decisions:
- issue: ‘నీ నామం నిమిత్తం’ అనే మాట యొక్క పరిధి
  choice: దేవుని చర్య ఆయన నామంలో వెల్లడయ్యే స్వభావం, ఘనత, విశ్వసనీయతపై ఆధారపడిందని తెలిపే నుడికారాన్ని యథాతథంగా ఉంచడం
