  rationale: మూలపాఠం ‘నామం’ అనే సమృద్ధమైన భావాన్ని ఉంచుతుంది; అనువాదం దానిని ఒకే వివరణకు పరిమితం చేయదు.
- issue: תַּנְחֵנִי మరియు וּתְנַהֲלֵנִי క్రియారూపాల భావం
  choice: 'నమ్మకంతో కూడిన భవిష్యత్తు: ‘నడిపిస్తావు … దారి చూపిస్తావు’'
