source:
  edition: WLC
  text: וַ/אֲנִ֤י עָלֶ֣י/ךָ בָטַ֣חְתִּי יְהוָ֑ה אָ֝מַ֗רְתִּי אֱלֹהַ֥/י אָֽתָּה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/014.yaml
  text: But as for me[a], I trust in you, O Yahweh; I say, “You are my God.”
translation:
  language: te
  text: కాని నేనైతే, యహ్వే, నిన్ను నమ్ముతున్నాను; “నీవు నా దేవుడవు” అని చెబుతున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కాని నేనైతే, యహ్వే, నిన్ను నమ్మాను; ‘నీవు నా దేవుడవు’ అని అన్నాను.” హీబ్రూ పరిపూర్ణ క్రియారూపాలను గతకాలంగా లేదా వర్తమాన సంపూర్ణకాలంగా అనువదించవచ్చు; ఇక్కడ అవి కొనసాగుతున్న నమ్మకాన్ని, ఒప్పుకోలను వ్యక్తపరిచే ప్రస్తుత ప్రకటనలుగా అనువదించబడ్డాయి.
    reason: కాలరూపానికి సంబంధించిన అనువాద ప్రత్యామ్నాయం
lexical_decisions:
- source_word: וַאֲנִי
  choice: కాని నేనైతే
  rationale: సంధికారకమైన וַ తో స్వతంత్ర సర్వనామం אֲנִי కలసి ముందు సందర్భానికి భిన్నంగా కీర్తనకర్తను నొక్కిచెబుతున్నాయి. ‘కాని నేనైతే’ ఈ వ్యతిరేకతను, ఉద్ఘాటనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עָלֶיךָ בָטַחְתִּי
  choice: నిన్ను నమ్ముతున్నాను
  rationale: בטח అనే క్రియ על తో వచ్చినప్పుడు ఎవరిమీదనో ఆధారపడడం, వారిని నమ్మడం అనే భావం ఇస్తుంది. ప్రస్తుత ప్రార్థనలో కొనసాగుతున్న విశ్వాసాన్ని తెలుగులో సహజంగా చెప్పడానికి ‘నిన్ను నమ్ముతున్నాను’ ఎంచుకున్నాం; హీబ్రూ క్రియారూపంలోని గతకాల సాధ్యతను పాదసూచికలో నిలిపాం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוה ను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని సాధారణ లిప్యంతరీకరణగా ‘యహ్వే’ అని ఇచ్చాం.
- source_word: אָמַרְתִּי
  choice: అని అంటున్నాను
  rationale: ఈ ప్రార్థనలో కీర్తనకర్త చేస్తున్న ప్రస్తుత విశ్వాస ప్రకటనగా సహజమైన తెలుగులో ‘అంటున్నాను’ అని ఇచ్చాం. హీబ్రూ పరిపూర్ణ క్రియారూపాన్ని ‘అన్నాను’ అని కూడా అనువదించవచ్చని పాదసూచిక తెలియజేస్తుంది.
- source_word: אֱלֹהַי אָתָּה
  choice: నీవే నా దేవుడు
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో אֱלֹהַי అంటే ‘నా దేవుడు.’ స్పష్టంగా ఉన్న אָתָּה అనే ‘నీవు’ సర్వనామంలోని ఉద్ఘాటనను తెలుగులో ‘నీవే’ ద్వారా సహజంగా నిలిపాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. కాబట్టి దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ నామానికి సమీపమైన ‘యహ్వే’ అనే లిప్యంతరీకరణను వాడాం.
- issue: క్రియారూపాలను ప్రస్తుతకాల ప్రకటనలుగా చూపడం
  choice: నమ్ముతున్నాను; అంటున్నాను
  alternative: నమ్మాను/నమ్మి ఉన్నాను; అన్నాను
  rationale: హీబ్రూ పరిపూర్ణ క్రియారూపాలు గత చర్యను లేదా ప్రస్తుతానికి కొనసాగిన స్థితిని సూచించగలవు. ప్రస్తుత ప్రార్థనా సందర్భంలో కొనసాగుతున్న నమ్మకాన్ని ప్రధాన పాఠంలో చూపించాం; గతకాల పఠనాన్ని పాదసూచికలో ఉంచి అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ప్రార్థనా-కావ్య శైలిని వాడాం. ‘నేనైతే’ మరియు ‘నీవే’ పదాలు మూలంలోని ఉద్ఘాటనను నిలుపుతాయి; వాక్యక్రమం తెలుగులో సహజంగా ఉండేలా దైవనామాన్ని సంబోధన మధ్యలో ఉంచాం.
