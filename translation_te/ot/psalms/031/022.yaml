source:
  edition: WLC
  text: וַ/אֲנִ֤י אָ֘מַ֤רְתִּי בְ/חָפְזִ֗/י נִגְרַזְתִּי֮ מִ/נֶּ֪גֶד עֵ֫ינֶ֥י/ךָ אָכֵ֗ן שָׁ֭מַעְתָּ ק֥וֹל תַּחֲנוּנַ֗/י בְּ/שַׁוְּעִ֥/י אֵלֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/022.yaml
  text: As for me[a], I said in my alarm[b], “I am cut off from before your eyes.” Yet you heard the sound of my pleas when I cried to you for help.
translation:
  language: te
  text: నేనైతే, నా కలవరంలో[a], “నీ కళ్ల ఎదుటినుండి[b] నేను తొలగించబడ్డాను” అని అన్నాను. అయినా, సహాయం కోసం నేను నీకు మొరపెట్టినప్పుడు నీవు నా విన్నపాల స్వరాన్ని విన్నావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా తొందరలో.” హెబ్రీ పదం తొందరను, కలవరాన్ని లేదా భయాందోళనను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీ దృష్టికి దూరంగా.” అక్షరార్థంగా, “నీ కళ్ల ఎదుటినుండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְחָפְזִי
  choice: నా కలవరంలో
  rationale: ఈ సందర్భంలో ఈ పదం కేవలం తొందరను కాక, ఆందోళనతో కూడిన కలవరాన్ని లేదా భయాందోళనను సూచించగలదు. ‘నా కలవరంలో’ అనే రూపం విలాప సందర్భంలోని భావోద్వేగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘నా తొందరలో’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: נִגְרַזְתִּי
  choice: నేను తొలగించబడ్డాను
  rationale: గזר క్రియ యొక్క నిఫ్అల్ రూపం ఇక్కడ వేరుచేయబడటం లేదా తొలగించబడటం అనే భావాన్ని ఇస్తుంది. ప్రత్యక్ష ఉక్తిలో కీర్తనకర్తకు అప్పట్లో కలిగిన భావనను తెలిపేందుకు ఈ రూపం సరిపోతుంది.
- source_word: מִנֶּגֶד עֵינֶיךָ
  choice: నీ కళ్ల ఎదుటి నుండి
  rationale: హెబ్రీలోని ‘నీ కళ్ల ఎదుటి నుండి’ అనే స్పష్టమైన దృశ్యరూపాన్ని నిలుపుతుంది. దీని భావం ‘నీ దృష్టికి దూరంగా’ అని పాదటిప్పణిలో సూచించాం.
- source_word: אָכֵן
  choice: అయినా
  rationale: కీర్తనకర్త భావించిన విసర్జనకు, దేవుడు నిజంగా అతని మొర విన్నాడనే వాస్తవానికి మధ్య ఉన్న బలమైన వ్యత్యాసాన్ని తెలియజేస్తుంది.
- source_word: קוֹל תַּחֲנוּנַי
  choice: నా విన్నపాల స్వరాన్ని
  rationale: קוֹל అనే ‘స్వరం’ భావాన్నీ, תַּחֲנוּנִים అనే కరుణ కోరే విన్నపాల భావాన్నీ రెండింటినీ నిలుపుతుంది; భాష గంభీరంగానూ అర్థవంతంగానూ ఉంటుంది.
- source_word: בְּשַׁוְּעִי אֵלֶיךָ
  choice: సహాయం కోసం నేను నీకు మొరపెట్టినప్పుడు
  rationale: שׁוע సహాయం కోరుతూ మొరపెట్టడాన్ని సూచిస్తుంది. ‘సహాయం కోసం’ అనే మాట హెబ్రీ క్రియలో అంతర్లీనంగా ఉన్న భావాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: దేవుడు విడిచిపెట్టాడనే మానవ అనుభూతి—దేవుడు నిజంగా విన్నాడనే వాస్తవం
  choice: ‘నేను తొలగించబడ్డాను’ అనే కీర్తనకర్త మాటను అతని కలవరంలో పలికిన భావనగా ఉంచి, వెంటనే ‘అయినా ... నీవు ... విన్నావు’ అనే విరుద్ధ వాస్తవాన్ని నిలిపాం.
  alternative: ‘నీవు నన్ను తిరస్కరించావని నేను అనుకున్నాను’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం.
  rationale: హెబ్రీ పాఠం దేవుని సిద్ధాంతపరమైన తిరస్కారాన్ని నేరుగా ప్రకటించదు; కీర్తనకర్త అనుభవించిన దూరత్వాన్ని దృశ్యరూపంలో చెబుతుంది. అందువల్ల మానవ భావనకూ దైవిక ప్రతిస్పందనకూ మధ్య ఉన్న ఉద్వేగాన్ని పరిష్కరించకుండా యథాతథంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన విలాప శైలిని ఉపయోగించాం. ‘నీ కళ్ల ఎదుటి నుండి’ మరియు ‘విన్నపాల స్వరం’ వంటి మూలంలోని దృశ్య, శ్రవ్య రూపాలను సాధ్యమైనంతవరకు నిలిపాం; సహాయార్థక మొర భావాన్ని తెలుగులో స్పష్టంగా తెలిపాం.
