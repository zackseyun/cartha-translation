  yaml_path: translation/ot/psalms/031/004.yaml
  text: Bring me out of this net that they have hidden for me[a], for you are my stronghold.
translation:
  language: te
  text: వారు నా కోసం దాచిపెట్టిన ఈ వలలోనుండి నన్ను బయటకు తీసుకురా[a]; ఎందుకంటే నీవే నా దుర్గం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా కోసం వారు దాచిపెట్టిన వలలోనుండి.” హీబ్రూ దాచిన వల అనే చిత్రాన్ని నిలుపుతుంది; భావార్థంగా దీనిని “వారు నా కోసం పన్నిన ఉచ్చు” అని కూడా చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹצִיאֵנִי
  choice: నన్ను బయటకు తీసుకురా
  rationale: יצא హిఫీల్ రూపం ‘బయటకు రప్పించు/తీసుకురా’ అనే కారణార్థాన్ని ఇస్తుంది. ఈ ఎంపిక తెలుగులో సహజంగా ఉండి మూలంలోని కారణార్థాన్ని నిలుపుతుంది.
- source_word: מֵרֶשֶׁת
  choice: ఈ వలలోనుండి
  rationale: רֶשֶׁת అక్షరార్థంగా ‘వల’; సందర్భంలో అది ఉచ్చుగా పనిచేస్తుంది. ‘వల’ అనే స్పష్టమైన చిత్రాన్ని అనువాదంలో నిలిపాం.
- source_word: זוּ
  choice: ఈ
  rationale: זוּ ఇక్కడ నిర్దేశక లేదా సంబంధార్థ బలాన్ని కలిగి ఉంది. ‘ఈ వల’ అని అనువదించడం నిర్దిష్టమైన వలను సూచిస్తూ సహజమైన తెలుగు నిర్మాణాన్ని ఇస్తుంది.
- source_word: טָמְנוּ לִי
  choice: వారు నా కోసం దాచిపెట్టిన
  rationale: טמן అంటే ‘దాచు/మరుగుపరచు’. వలను ‘పన్నిన’ అని చెప్పడం సహజమైనప్పటికీ, ‘దాచిపెట్టిన’ అనే ఎంపిక మూల క్రియ యొక్క భావాన్ని, రహస్యంగా ఉంచిన ఉచ్చు చిత్రాన్ని కాపాడుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: כִּי విజ్ఞాపనకు కారణాన్ని పరిచయం చేస్తుంది. ఆధునిక తెలుగులో ‘ఎందుకంటే’ ఈ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מָעוּזִּי
  choice: నా దుర్గం
  rationale: מָעוֹז బలం, రక్షణ, కోటబందోబస్తు గల ఆశ్రయాన్ని సూచిస్తుంది. ‘దుర్గం’ రక్షణాత్మక రూపకాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా నిలుపుతుంది.
theological_decisions:
- issue: దేవునికి వాడిన రక్షణాత్మక రూపకం
  choice: నీవే నా దుర్గం
  alternative: నీవే నా ఆశ్రయం / నీవే నా కోట
  rationale: మూలం దేవుణ్ణి రక్షణనిచ్చే బలమైన స్థలంగా చిత్రిస్తుంది. ‘దుర్గం’ సైనిక-రక్షణాత్మక రూపకాన్ని నిలుపుతుంది; ‘ఆశ్రయం’ కొంత మృదువుగా, ‘కోట’ మరింత భౌతిక నిర్మాణంగా వినిపించవచ్చు. ‘నీవే’ వ్యక్తిగత నమ్మకపు ఉద్ఘాటనను సహజ తెలుగులో వ్యక్తపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలిని ఉపయోగించాం. ‘వల’ అనే స్పష్టమైన మూలచిత్రాన్ని, ‘దుర్గం’ అనే రక్షణాత్మక రూపకాన్ని నిలిపాం; ‘ఉచ్చు’ను పాదసూచికలో భావార్థ ప్రత్యామ్నాయంగా ఇచ్చాం.
