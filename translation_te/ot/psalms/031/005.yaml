source:
  edition: WLC
  text: בְּ/יָדְ/ךָ֮ אַפְקִ֪יד ר֫וּחִ֥/י פָּדִ֖יתָה אוֹתִ֥/י יְהוָ֗ה אֵ֣ל אֱמֶֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/005.yaml
  text: Into your hand I commit my spirit; you have redeemed me[a], O Yahweh, God of truth.
translation:
  language: te
  text: 'నీ చేతికి నా ఆత్మను అప్పగిస్తున్నాను;

    యహ్వే, సత్యవంతుడవైన దేవా[a],

    నీవు నన్ను విమోచించావు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నమ్మకమైన దేవా.” హీబ్రూ పదం సత్యం, విశ్వసనీయత లేదా నమ్మకత్వం అనే భావాలను కలిగి ఉండగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָדְךָ
  choice: నీ చేతికి
  rationale: అప్పగించే క్రియతో కలిసి בְּ + ‘చేయి’ దేవుని సంరక్షణకు, అధికారానికి అప్పగించడాన్ని సూచిస్తుంది. తెలుగులో ‘నీ చేతికి’ సహజంగా ఉండి ఆ దిశాత్మక భావాన్ని నిలుపుతుంది.
- source_word: אַפְקִיד
  choice: అప్పగిస్తున్నాను
  rationale: פקד యొక్క హిఫీల్ రూపం ఇక్కడ మరొకరి సంరక్షణకు నమ్మకంగా అప్పగించడాన్ని సూచిస్తుంది. ‘అప్పగిస్తున్నాను’ ఆధునిక తెలుగులో సహజమైనదీ గంభీరమైనదీ.
- source_word: רוּחִי
  choice: నా ఆత్మను
  rationale: רוּחַ అనే పదానికి ఆత్మ, ఊపిరి, ప్రాణం అనే భావాలు ఉండగలవు. ఈ ప్రార్థనా సందర్భంలో వ్యక్తి తన జీవాత్మను దేవునికి అప్పగిస్తున్న భావాన్ని ‘నా ఆత్మను’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: פָּדִיתָה
  choice: నీవు విమోచించావు
  rationale: פדה అంటే విడిపించడం లేదా వెల చెల్లించి రక్షించడం. ‘విమోచించావు’ పూర్తయిన రక్షణ కార్యాన్నీ దాని ఆధ్యాత్మిక గంభీరతనూ నిలుపుతుంది.
- source_word: אוֹתִי
  choice: నన్ను
  rationale: ప్రత్యక్ష కర్మ సర్వనామానికి సరళమైన తెలుగు అనువాదం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ లిప్యంతరీకరణను తెలుగులో అందిస్తుంది.
- source_word: אֵל
  choice: దేవా
  rationale: ఇది యహ్వే అనే దైవనామాన్ని వివరిస్తూ సంబోధనలో ఉంది; అందువల్ల తెలుగు సంబోధన రూపమైన ‘దేవా’ సహజంగా ఉంటుంది.
- source_word: אֱמֶת
  choice: సత్యవంతుడవైన
  rationale: אֱמֶתలో సత్యం, విశ్వసనీయత, నమ్మకత్వం అనే భావాలు ఉన్నాయి. ప్రధాన పాఠంలో ‘సత్యవంతుడవైన’ అనే రూపం సత్యం అనే ప్రత్యక్ష భావాన్ని నిలుపుతుంది; నమ్మకత్వ భావాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’ అని లిప్యంతరీకరించడం మూలపాఠానికి పారదర్శకంగా ఉంటుంది.
- issue: אֵל אֱמֶתలో אֱמֶת యొక్క భావం
  choice: సత్యవంతుడవైన దేవా
  alternative: నమ్మకమైన దేవా; సత్య దేవా
  rationale: ఈ హీబ్రూ పదం సత్యాన్నీ నమ్మకత్వాన్నీ సూచించగలదు. ప్రధాన పాఠం సత్య భావాన్ని ఉంచగా, పాదసూచిక నమ్మకత్వ భావాన్ని సంరక్షిస్తుంది; తద్వారా మూలంలోని భావవిస్తృతి కుదించబడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రార్థనా శైలి వాడబడింది. ఏకవచన ‘చేతి’ మరియు ‘ఆత్మ’ మూలపాఠపు రూపాన్ని దగ్గరగా నిలుపుతాయి; సంబోధనకు ‘దేవా’ వాడబడింది.
