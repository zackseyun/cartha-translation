translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనలోని శాపార్థక కోరికకు తగిన గంభీరతతో అనువదించబడింది. హీబ్రూ వాక్యంలోని ప్రధాన బలాన్ని చివరనున్న ‘మూగబోవుగాక’పై ఉంచేలా తెలుగు పదక్రమం అమర్చబడింది. ‘గర్వంతో, ధిక్కారంతో’ అనే జంట మూలంలోని భావసాంద్రతను నిలుపుతుంది.
