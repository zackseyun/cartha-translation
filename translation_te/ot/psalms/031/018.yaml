  yaml_path: translation/ot/psalms/031/018.yaml
  text: Let lying lips be silenced[d][c][b][a], which speak arrogantly against the righteous with pride and contempt.
translation:
  language: te
  text: నీతిమంతునికి[a] విరోధంగా గర్వంతో, ధిక్కారంతో పొగరుగా మాట్లాడే అబద్ధపు పెదవులు మూగబోవుగాక![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక నీతిమంతునికి’; హీబ్రూ పదం ఏకవచనంలో ఉండి, ఒక వ్యక్తిని గానీ ప్రాతినిధ్యార్థంలో నీతిమంతుణ్ణి గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మౌనంగా చేయబడుగాక’; హీబ్రూ క్రియ మౌనమవడాన్ని లేదా మూగగా చేయబడడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּאָלַמְנָה
  choice: మూగబోవుగాక
  rationale: నిఫాల్ అసంపూర్ణ క్రియ ఇక్కడ కోరిక లేదా శాపార్థక ఆజ్ఞను వ్యక్తం చేస్తుంది. ‘మూగబోవుగాక’ అనేది మౌనమవడం లేదా మాటలాడలేని స్థితికి తేబడడం అనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: שִׂפְתֵי שָׁקֶר
  choice: అబద్ధపు పెదవులు
  rationale: ‘అసత్యపు పెదవులు’ అనే అక్షరార్థాన్ని నిలుపుతూ, మోసపూరితంగా మాట్లాడే భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: הַדֹּבְרוֹת
  choice: మాట్లాడే
  rationale: ‘పెదవులు’తో వ్యాకరణపరంగా అనుసంధానమైన విశేషణాత్మక కృదంత భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: עַל צַדִּיק
  choice: నీతిమంతునికి విరోధంగా
  rationale: עַל ఇక్కడ ప్రతికూల లక్ష్యాన్ని సూచిస్తుంది; צַדִּיק ఏకవచనంలో ఒక నీతిమంతుడిని లేదా ప్రాతినిధ్యార్థంలో నీతిమంతుణ్ణి సూచించగలదు.
- source_word: עָתָק
  choice: దురుసుగా
  rationale: ఈ నామవాచకం పొగరు, ధిక్కారం లేదా హద్దుమీరిన మాటను సూచిస్తుంది. ‘దురుసుగా’ అని క్రియావిశేషణంగా అనువదించడం, తరువాతి ‘గర్వంతో, ధిక్కారంతో’ అనే పదజోడుతో అనవసర పునరుక్తిని తగ్గిస్తూ మాటల అవమానకర స్వభావాన్ని తెలియజేస్తుంది.
- source_word: בְּגַאֲוָה
  choice: గర్వంతో
  rationale: בְּ ఉపసర్గ ఇక్కడ మాట్లాడే తీరును సూచిస్తుంది; ‘గర్వంతో’ మూలంలోని అహంభావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וָבוּז
  choice: ధిక్కారంతో
  rationale: בּוּז లోని తృణీకరణ, తిరస్కారం, అవమాన భావాలను ‘ధిక్కారం’ బలంగా మరియు సహజంగా వ్యక్తం చేస్తుంది.
