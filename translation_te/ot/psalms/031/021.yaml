source:
  edition: WLC
  text: בָּר֥וּךְ יְהוָ֑ה כִּ֥י הִפְלִ֘יא חַסְדּ֥/וֹ לִ֝֗/י בְּ/עִ֣יר מָצֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/021.yaml
  text: Blessed be Yahweh[a], for he has wonderfully shown his steadfast love to me in a fortified city.
translation:
  language: te
  text: యాహ్వే స్తుతింపబడుగాక! ఎందుకంటే కోటగల నగరంలో[a] ఆయన తన నిబద్ధమైన ప్రేమను నాకు అద్భుతంగా చూపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ముట్టడిలో ఉన్న నగరంలో”; ఈ హీబ్రూ పదబంధం కోటగల నగరాన్నిగానీ, ముట్టడికి గురైన నగరాన్నిగానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרוּךְ
  choice: స్తోత్రం కలుగుగాక
  rationale: దేవుని ఉద్దేశించి పలికే స్తుతి ప్రకటనగా ఉన్న నిష్క్రియ కృదంతపు ఆశీర్వాద భావాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: యాహ్వేకు స్తోత్రం చెల్లించడానికి తరువాతి వాక్యం కారణమని స్పష్టంగా, సహజంగా సూచిస్తుంది.
- source_word: הִפְלִיא
  choice: అద్భుతంగా చూపించాడు
  rationale: פלא హిఫీల్ రూపంలోని అసాధారణంగా చేయడం లేదా అద్భుతంగా ప్రత్యక్షపరచడం అనే భావాన్ని, חֶסֶד కర్మగా ఉన్న సందర్భంలో సహజంగా అందిస్తుంది.
- source_word: חַסְדּוֹ
  choice: తన నిబద్ధమైన ప్రేమను
  rationale: חֶסֶד లోని స్థిరమైన, విశ్వసనీయమైన ప్రేమ భావాన్ని ఒకే సిద్ధాంతపరమైన నిర్వచనానికి పరిమితం చేయకుండా తెలియజేస్తుంది.
- source_word: לִי
  choice: నాకు
  rationale: ఆ ప్రేమను పొందిన వ్యక్తిగత గ్రహీతను సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: בְּעִיר מָצוֹר
  choice: కోటగల నగరంలో
  rationale: מָצוֹר సూచించగల రక్షణ ఏర్పాట్లు గల నగరం అనే భావాన్ని ప్రధాన పాఠంలో సహజంగా ఇస్తుంది; ముట్టడిలో ఉన్న నగరం అనే నిజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న ప్రత్యేక దైవనామాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది; ఏ వర్గానికి ప్రత్యేకమైన వ్యాఖ్యానాన్ని జోడించదు.
- issue: בְּעִיר מָצוֹר యొక్క అర్థం
  choice: కోటగల నగరంలో
  alternative: ముట్టడిలో ఉన్న నగరంలో
  rationale: ఈ హీబ్రూ పదబంధం కోటబందోబస్తు గల నగరాన్నీ, ముట్టడికి గురైన నగరాన్నీ సూచించగలదు. ప్రధాన పాఠంలో ఒక సహజ అర్థాన్ని ఎంచుకొని, మరొక నిజమైన అర్థాన్ని పాదటిప్పణిలో ఉంచడం ద్వారా మూలంలోని సందిగ్ధతను పారదర్శకంగా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనా శైలికి తగిన గౌరవప్రదమైన భాషను, సాధారణ పాఠకులకు అర్థమయ్యే సహజ వాక్యనిర్మాణంతో కలిపింది. పాదటిప్పణి గుర్తు సంబంధిత సందిగ్ధ పదబంధం వెంటనే ఉంచబడింది.
