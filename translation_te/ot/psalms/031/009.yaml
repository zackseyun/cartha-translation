review_pass:
  verdict: revise
  source_fidelity: The draft faithfully represents the imperative plea, the divine name, the causal statement of distress, and the poetic sequence of eye, נפשׁ, and belly. ‘నా ప్రాణం’ appropriately preserves the breadth of נפשׁ, and ‘నా కడుపు’ retains the concrete bodily image of בטן.
  naturalness: The final verbless phrase (‘నా ప్రాణం, నా కడుపు కూడా’) is understandable as poetic ellipsis, but supplying the shared predicate makes the Telugu syntax clearer and more natural while retaining the Hebrew poetic parallelism. ‘బాధలో’ communicates the personal distress of צַר לִי more directly than ‘ఆపదలో,’ which can suggest external danger.
  terminology: ‘యాహ్వే’ correctly renders יהוה under the stated policy. ‘నాపై కృప చూపు’ is a suitable rendering of חָנֵּנִי. The footnote alternative for נפשׁ is adjusted from the less idiomatic ‘నా స్వయం’ to the natural Telugu ‘నేను.’
  issues:
  - severity: low
    issue: The last two coordinated nouns lack an explicit shared predicate in Telugu.
    rationale: Hebrew permits the verb to be understood across the sequence, but repeating it after ‘నా ప్రాణమూ నా కడుపూ’ avoids a fragmentary reading in modern standard Telugu.
  - severity: low
    issue: ‘ఆపదలో’ is narrower than the source expression.
    rationale: צַר לִי expresses personal constraint or distress and need not specifically denote danger; ‘బాధలో ఉన్నాను’ is more semantically direct.
  - severity: low
    issue: Footnote b uses ‘నా స్వయం,’ which is not idiomatic modern Telugu.
    rationale: ‘నేను’ gives the possible ‘self’ sense naturally without imposing a narrower interpretation.
