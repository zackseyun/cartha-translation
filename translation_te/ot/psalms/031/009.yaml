  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: חָנֵּ֥/נִי יְהוָה֮ כִּ֤י צַ֫ר לִ֥/י עָשְׁשָׁ֖ה בְ/כַ֥עַס עֵינִ֗/י נַפְשִׁ֥/י וּ/בִטְנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/009.yaml
  text: Be gracious to me[a], O Yahweh, for I am in distress[c][b]; my eye has wasted away with grief—my soul and my belly as well.
translation:
  language: te
  text: యాహ్వే, నాపై కృప చూపు; ఎందుకంటే నేను బాధలో ఉన్నాను. దుఃఖంతో నా కన్ను క్షీణించింది[a]; నా ప్రాణమూ[b] నా కడుపూ[c] క్షీణించాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వ్యాకులతవల్ల నా కన్ను మసకబారింది’ లేదా ‘దుఃఖంతో నా కన్ను బలహీనపడింది.’
    reason: lexical_alternative
  - marker: b
    text: ‘నా ప్రాణం’ అనే మాటను ‘నా జీవితం’ లేదా ‘నేను’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ పదానికి అక్షరార్థం ‘నా కడుపు’; అది విస్తృతంగా అంతర్భాగాలను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: నాపై కృప చూపు
  rationale: חנן ధాతువు అనుగ్రహం లేదా కృప చూపమనే విజ్ఞప్తిని తెలియజేస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండే ఈ రూపం మూలంలోని కృపకోరే భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: כִּי צַר לִי
  choice: ఎందుకంటే నేను ఆపదలో ఉన్నాను
  rationale: כִּי విజ్ఞప్తికి కారణాన్ని పరిచయం చేస్తుంది; צַר לִי వ్యక్తిగత ఇరుకు స్థితి, కష్టం లేదా ఆపదను సూచిస్తుంది.
- source_word: עָשְׁשָׁה
  choice: క్షీణించింది
  rationale: ఈ క్రియ కృశించడం, బలహీనపడడం లేదా విఫలమవడం అనే విస్తృత భావాన్ని కలిగి ఉంది. కన్నుతో సహజంగా జతకడుతూ తీవ్రతను నిలుపడానికి ‘క్షీణించింది’ ఎంచుకోబడింది.
- source_word: בְכַעַס
  choice: దుఃఖంతో
  rationale: כעס కోపం, వ్యాకులత, వేదన లేదా దుఃఖాన్ని సూచించవచ్చు. ఈ విలాప సందర్భంలో ‘దుఃఖంతో’ సహజమైన ఎంపిక; ఇతర సాధ్య భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: עֵינִי
  choice: నా కన్ను
  rationale: హీబ్రూలో ఏకవచనం ఉన్నందున కవితాత్మక ఏకవచనాన్ని తెలుగులోనూ నిలిపాం.
- source_word: נַפְשִׁי
  choice: నా ప్రాణం
  rationale: נפש అనేది ప్రాణం, జీవితం, స్వయం లేదా అంతరాత్మను సూచించగలదు. ‘ప్రాణం’ దాని జీవనాత్మక మరియు అంతరంగ విస్తృతిని పూర్తిగా ఒకే అర్థానికి పరిమితం చేయదు.
- source_word: וּבִטְנִי
  choice: నా కడుపు కూడా
  rationale: בטן యొక్క ప్రత్యక్ష అర్థం కడుపు; సందర్భానుసారంగా అంతరంగ భాగాలను కూడా సూచించవచ్చు. మూలంలోని శరీరరూపకాన్ని నిలుపుతూ విస్తృత అర్థాన్ని పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా తెలుగు లిపిలో సూచించడం మూలరూపాన్ని పారదర్శకంగా నిలుపుతుంది.
- issue: נַפְשִׁי యొక్క మానవశాస్త్రీయ భావం
  choice: నా ప్రాణం
  alternative: నా జీవితం / నా స్వయం / నా ఆత్మ
  rationale: కన్ను, נפש, కడుపు అనే కవితాత్మక వరుసలో ఈ పదం వ్యక్తి జీవం మరియు అంతరంగ స్వరూపం రెండింటినీ తాకుతుంది. ‘ప్రాణం’ ఆ ఉద్రిక్తతను పూర్తిగా పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ప్రార్థనా గాంభీర్యాన్ని నిలుపుతూ సులభమైన వాక్యనిర్మాణం వాడబడింది. డాష్ ద్వారా హీబ్రూ కవిత్వంలోని సంక్షిప్త సమాంతరతను, చివరి రెండు నామాలకు ‘క్షీణించింది’ అనే క్రియ భావపరంగా వర్తించడాన్ని సూచించాం.
