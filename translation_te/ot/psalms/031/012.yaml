source:
  edition: WLC
  text: נִ֭שְׁכַּחְתִּי כְּ/מֵ֣ת מִ/לֵּ֑ב הָ֝יִ֗יתִי כִּ/כְלִ֥י אֹבֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/012.yaml
  text: I am forgotten like a dead man[a], out of mind[b]; I have become like a vessel that is lost.
translation:
  language: te
  text: నేను చనిపోయినవానిలా జ్ఞాపకం నుండి చెరిగిపోయాను[a]; నశించిపోతున్న పాత్రలా అయ్యాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “హృదయం నుండి.” హీబ్రూ వాడుకలో ఇది ఒకరి జ్ఞాపకం లేదా మనస్సు నుండి తొలగిపోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “కనబడకుండా పోయిన పాత్రలా,” లేదా “పాడైపోయిన పాత్రలా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁכַּחְתִּי
  choice: నన్ను మరచిపోయారు
  rationale: నిఫాల్ పరిపూర్ణ క్రియ వక్త మరచిపోబడిన స్థితిని సూచిస్తుంది; తెలుగులో కర్తను పేర్కొనని బహువచన క్రియ సహజంగా కర్మణి భావాన్ని తెలియజేస్తుంది.
- source_word: כְּמֵת
  choice: చనిపోయినవాణ్ణి ...ట్లు
  rationale: כְּ పోలికను, מֵת ఏకవచనంలోని ‘చనిపోయినవాడు’ అనే వ్యక్తిగత చిత్రాన్ని నిలుపుతుంది.
- source_word: מִלֵּב
  choice: హృదయంలోనుండి
  rationale: మూలంలోని ‘హృదయం నుండి’ అనే రూపకాన్ని నిలుపుతూ, జ్ఞాపకం నుండి తొలగిపోవడం అనే హీబ్రూ భావాన్ని సందర్భం తెలియజేయనిస్తుంది.
- source_word: הָיִיתִי
  choice: నేను అయ్యాను
  rationale: కాల్ పరిపూర్ణ రూపంలోని గత మార్పును, దాని ఫలిత స్థితితో సహా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּכְלִי
  choice: పాత్రలా
  rationale: כְּלִי విస్తృతంగా వస్తువు, పనిముట్టు లేదా పాత్రను సూచించగలదు; ఈ కవితా పోలికలో ‘పాత్ర’ సహజమైనదిగా ఉండి మూలాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: אֹבֵד
  choice: నశించిపోతున్న
  rationale: ఈ క్రియావిశేషణ రూపం ‘కనబడకుండా పోయినది,’ ‘నశిస్తున్నది,’ లేదా ‘పాడైపోయినది’ అనే పరిధి కలిగి ఉంది; ‘నశించిపోతున్న’ దాని కొనసాగుతున్న క్రియాభావాన్ని కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని ఉపయోగించాం. ‘హృదయంలోనుండి’ అనే మూల రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని సామెతార్థాన్ని పాదసూచికలో వివరించాం; אֹבֵד లోని అర్థసందిగ్ధతను కూడా పాదసూచికలో కాపాడాం.
