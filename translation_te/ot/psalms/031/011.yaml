source:
  edition: WLC
  text: מִ/כָּל צֹרְרַ֨/י הָיִ֪יתִי חֶרְפָּ֡ה וְ/לִ/שֲׁכֵנַ֨/י מְאֹד֮ וּ/פַ֪חַד לִֽ/מְיֻדָּ֫עָ֥/י רֹאַ֥/י בַּ/ח֑וּץ נָדְד֥וּ מִמֶּֽ/נִּי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/011.yaml
  text: Because of all my enemies I have become a reproach[a], especially to my neighbors, and a terror to my acquaintances[c][b]; those who see me in the street flee from me.
translation:
  language: te
  text: నా శత్రువులందరి కారణంగా నేను ఎగతాళికి గురయ్యాను[a]—నా పొరుగువారికి మరీ ఎక్కువగా; నా పరిచయస్థులకు భయకారణమయ్యాను. బయట నన్ను చూసినవారు[b] నా నుండి పారిపోయారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా శత్రువులందరి వల్ల నేను ఎగతాళికి గురయ్యాను.” ప్రారంభ పదబంధాన్ని కొందరు తులనగా తీసుకొని, “నా శత్రువులందరికంటే ఎక్కువగా” అని అనువదిస్తారు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “బయట.” ఇది బహిరంగ ప్రదేశంలో కనిపించడాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా, “నా నుండి దూరంగా వెళ్లారు,” లేదా “నా నుండి తొలగిపోయారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל צֹרְרַי
  choice: నా శత్రువులందరి కారణంగా
  rationale: מִן ఇక్కడ సందర్భానుసారంగా కారణాన్ని లేదా మూలాన్ని సూచించగలదు. శత్రువుల వల్ల కీర్తనకర్త నిందకు పాత్రుడయ్యాడనే భావం సహజంగా సరిపోతుంది; మూలం లేదా తులనగా గ్రహించే అవకాశాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: הָיִיתִי חֶרְפָּה
  choice: నేను నిందకు పాత్రనయ్యాను
  rationale: היה తో నామవాచకం ఏర్పడిన స్థితిని సూచిస్తుంది. ‘నిందకు పాత్రనయ్యాను’ అనేది అతడు ఇతరుల అవహేళనకు గురయ్యే వ్యక్తిగా మారిన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְלִשֲׁכֵנַי מְאֹד
  choice: ముఖ్యంగా నా పొరుగువారి దృష్టిలో
  rationale: מְאֹד పొరుగువారికి సంబంధించిన అవమానాన్ని బలపరుస్తుంది. ‘ముఖ్యంగా’ అనే రూపం సమీపంలో నివసించేవారి మధ్య అతని అవమానం మరింత తీవ్రమైందనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וּפַחַד לִמְיֻדָּעָי
  choice: నా పరిచయస్థులకు భయకారణమయ్యాను
  rationale: פַּחַד అంటే భయం లేదా భీతి; מְיֻדָּעִים అంటే తప్పనిసరిగా సన్నిహిత మిత్రులు కాకుండా తెలిసినవారు లేదా పరిచయస్థులు. ‘భయకారణమయ్యాను’ మూలంలోని నామవాచక విధేయ భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: רֹאַי בַּחוּץ
  choice: బయట నన్ను చూసినవారు
  rationale: בַּחוּץ అక్షరార్థంగా ‘బయట’ అని అర్థం; సందర్భంలో ప్రజలు తిరిగే బహిరంగ స్థలాన్ని సూచిస్తుంది. మూలంలోని విస్తృత భావాన్ని కాపాడేందుకు ‘బయట’ ఉంచాం.
- source_word: נָדְדוּ מִמֶּנִּי
  choice: నా నుండి పారిపోయారు
  rationale: נָדַד పారిపోవడం, దూరంగా వెళ్లడం, సంచరించడం అనే అర్థాలను కలిగి ఉంటుంది. అతన్ని చూడగానే సామాజికంగా తప్పించుకునే ఈ సందర్భంలో ‘పారిపోయారు’ బలమైన, సహజమైన ఎంపిక; మృదువైన ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చాం.
