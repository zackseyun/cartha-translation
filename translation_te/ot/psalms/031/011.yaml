translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. హెబ్రీ కవిత్వంలోని వరుస సంబంధాలను అర్ధవిరామం, దీర్ఘ విరామచిహ్నంతో నిలిపాం; కారణం/మూలం/తులన మరియు נָדַד క్రియలోని అర్థవిస్తృతిని పాదటిప్పణుల్లో భద్రపరిచాం.
