  rationale: యెహోవాను నమ్ముకోవడంతో చూపిన వ్యత్యాసం విగ్రహాలు లేదా అబద్ధమైన ఆరాధనావస్తువులను సూచిస్తుంది. అయినా హెబ్రీ పదబంధంలోని విస్తృతమైన శూన్యత/నిష్ఫలత భావాన్ని పాదటిప్పణి ద్వారా నిలిపాం.
- issue: perfect క్రియల కాలబలం
  choice: ప్రస్తుత స్థిర వైఖరిగా ‘ద్వేషిస్తాను’, ‘నమ్ముకుంటాను’ అని ఇచ్చాం.
  alternative: ‘ద్వేషించాను’, ‘నమ్ముకున్నాను’ అని గత లేదా సంపూర్ణ భావంతో ఇవ్వవచ్చు.
  rationale: కవితా సందర్భంలో ఈ perfect రూపాలు కీర్తనకర్త యొక్క ఏర్పడిన, కొనసాగుతున్న వైఖరిని వ్యక్తం చేస్తాయి; నిర్దిష్టమైన గత సంఘటనగా పరిమితం చేయలేదు.
