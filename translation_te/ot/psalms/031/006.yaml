    text: లేదా, “శూన్యమైన వ్యర్థాలను కాపాడేవారిని,” “మోసకరమైన వ్యర్థాలను పట్టుకొని ఉండేవారిని.”
    reason: הַשֹּׁמְרִים הַבְלֵי שָׁוְא అనే పదబంధంలో ‘కాపాడు/పాటించు/పట్టుకొని ఉండు’ మరియు ‘శూన్యమైన లేదా మోసకరమైన వ్యర్థాలు’ అనే భావాలు ఉన్నాయి; ‘విగ్రహాలు’ అనేది సందర్భానుసార స్పష్టీకరణ.
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: నేను ద్వేషిస్తాను
  rationale: Qal perfect first-person singular. కీర్తనా కవిత్వంలో ఇది స్థిరమైన ప్రస్తుత వైఖరిని వ్యక్తం చేయగలదు; అందువల్ల సహజమైన తెలుగు వర్తమాన రూపాన్ని వాడాం.
- source_word: הַשֹּׁמְרִים
  choice: పట్టుకొని ఉండేవారు
  rationale: שמר యొక్క ప్రాథమిక భావం కాపాడడం, పాటించడం, గమనించడం. ఈ కర్మతో అది వ్యర్థమైన ఆరాధనావస్తువుల పట్ల కొనసాగించే అనుబంధాన్ని సూచిస్తుంది; అయితే ‘అంటిపెట్టుకొను’ అని మరీ బలంగా వ్యాఖ్యానించకుండా మూలంలోని విస్తృత భావాన్ని నిలిపాం.
- source_word: הַבְלֵי שָׁוְא
  choice: వ్యర్థమైన విగ్రహాలు
  rationale: ఈ పదబంధం శూన్యత, నిష్ఫలత, మోసం అనే భావాలను కలిగిస్తుంది. యెహోవాపై నమ్మకంతో ఉన్న వ్యత్యాసం కారణంగా ఇక్కడ అబద్ధమైన ఆరాధనావస్తువులు ఉద్దేశించబడ్డాయని స్పష్టం చేయడానికి ‘విగ్రహాలు’ వాడాం; మరింత అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וַאֲנִי
  choice: కానీ నేనైతే
  rationale: సంయోజక అవ్యయం మరియు ప్రత్యేక సర్వనామం ముందటి వర్గంతో కీర్తనకర్తను బలంగా వ్యత్యాసపరుస్తాయి.
- source_word: אֶל יְהוָה בָּטָחְתִּי
  choice: యెహోవాను నమ్ముకుంటాను
  rationale: בטח తో אֶל దిశను సూచించినా, ఆధునిక తెలుగులో వ్యక్తిపై విశ్వాసం ఉంచడాన్ని ‘ఆ వ్యక్తిని నమ్ముకొను’ అని సహజంగా చెబుతారు. perfect రూపం స్థిరమైన ప్రస్తుత విశ్వాసాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
theological_decisions:
- issue: הַבְלֵי שָׁוְא యొక్క ఉద్దేశిత వస్తువులు
  choice: ‘వ్యర్థమైన విగ్రహాలు’ అని ప్రధాన పాఠ్యంలో ఇచ్చాం.
