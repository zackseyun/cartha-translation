source:
  edition: WLC
  text: כִּ֤י כָל֪וּ בְ/יָג֡וֹן חַיַּ/י֮ וּ/שְׁנוֹתַ֪/י בַּ/אֲנָ֫חָ֥ה כָּשַׁ֣ל בַּ/עֲוֺנִ֣/י כֹחִ֑/י וַ/עֲצָמַ֥/י עָשֵֽׁשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/010.yaml
  text: For my life is spent with grief[a], and my years with sighing; my strength has failed because of my iniquity[b], and my bones waste away.
translation:
  language: te
  text: 'ఎందుకంటే నా జీవితం దుఃఖంతో కరిగిపోయింది,

    నా సంవత్సరాలు నిట్టూర్పులతో కరిగిపోయాయి;

    నా దోషం వల్ల[a] నా బలం తడబడింది[b],

    నా ఎముకలు క్షీణించిపోయాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా అపరాధం వల్ల”; హీబ్రూ పదం దోషాన్ని, అపరాధాన్ని లేదా దోషపు పర్యవసానాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నా బలం క్షీణించింది”; హీబ్రూ క్రియకు అక్షరార్థంగా “తడబడింది” లేదా “తొట్రిల్లింది” అని అర్థం; ఇక్కడ అది రూపకంగా వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న విలాపానికి కారణాన్ని లేదా వివరణను పరిచయం చేసే హేత్వర్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כָלוּ בְיָגוֹן חַיַּי
  choice: నా జీవితం దుఃఖంలో గడిచిపోయింది
  rationale: כלה అనే క్రియలోని పూర్తిగా అయిపోవడం లేదా వ్యయమైపోవడం అనే భావాన్ని, జీవితం దుఃఖంతో నిండిపోయి గడిచిందనే సహజమైన తెలుగు వ్యక్తీకరణలో నిలుపుతుంది.
- source_word: וּשְׁנוֹתַי בַּאֲנָחָה
  choice: నా సంవత్సరాలు నిట్టూర్పులతో గడిచిపోయాయి
  rationale: మొదటి పాదంలోని క్రియను రెండవ పాదానికి పూరించి, אֲנָחָה లోని నిట్టూర్పు లేదా మూలుగు భావాన్ని కవితాత్మక సమాంతరతతో అందిస్తుంది.
- source_word: כָּשַׁל
  choice: తడబడింది
  rationale: ఈ క్రియకు అక్షరార్థంగా తడబడడం, తొట్రిల్లడం, నిలువలేకపోవడం అనే భావాలున్నాయి; బలాన్ని వ్యక్తీకరించే రూపకాన్ని సూటిగా నిలుపుతుంది.
- source_word: בַּעֲוֺנִי
  choice: నా దోషం వల్ల
  rationale: עָוֹן లో పాపకార్యం, అపరాధభావం లేదా దాని పర్యవసానం అనే అర్థవిస్తృతి ఉంది. ‘దోషం’ నైతిక భావాన్ని నిలుపుతుండగా, ‘వల్ల’ సందర్భంలోని కారణార్థాన్ని తెలియజేస్తుంది.
- source_word: כֹחִי
  choice: నా బలం
  rationale: శారీరక, మానసిక శక్తి క్షీణతకు సరిపోయే సహజమైన సమానార్థకం.
- source_word: וַעֲצָמַי עָשֵׁשׁוּ
  choice: నా ఎముకలు క్షీణించిపోయాయి
  rationale: లోతైన శారీరక క్షీణతను సూచించే ఎముకల దృశ్యరూపాన్ని నిలుపుతూ, వాడిపోవడం లేదా బలహీనపడడం అనే క్రియాభావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: עָוֹן అనే పదంలో పాపం, అపరాధభావం, పర్యవసానం అనే అర్థాల మధ్య ఉన్న ఉద్రిక్తత
  choice: ప్రధాన పాఠ్యంలో ‘నా దోషం వల్ల’
  alternative: ‘నా అపరాధభావం వల్ల’ లేదా ‘నా దోషపు పర్యవసానం వల్ల’
  rationale: ‘దోషం’ నైతిక స్వీయసంబంధాన్ని నిలుపుతుంది; అయితే ఇది ప్రత్యేకమైన శిక్షాసిద్ధాంతాన్ని నిర్బంధంగా ప్రకటించదు. ఇతర సాధ్యార్థాలను పాదటిప్పణి తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలిని ఉపయోగించాం. పాదాల సమాంతరతను నిలిపి, అరుదైన లేదా మతపరంగా భారమైన పదజాలాన్ని నివారించాం. మూలంలోని ‘బలం తడబడింది’ అనే రూపకాన్ని ప్రధాన పాఠ్యంలో ఉంచి, మరింత సహజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
