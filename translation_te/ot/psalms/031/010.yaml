    rationale: כלה portrays life and years as exhausted or consumed, not merely as elapsed. A revision should retain this depletion.
  - severity: medium
    issue: The footnote alternative ‘అపరాధభావం’ is too narrow for עָוֹן.
    rationale: It denotes a feeling of guilt, while the Hebrew may refer to iniquity, guilt/liability, or its consequence. ‘అపరాధం’ preserves the ambiguity better.
