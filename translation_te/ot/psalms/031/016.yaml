source:
  edition: WLC
  text: הָאִ֣ירָ/ה פָ֭נֶי/ךָ עַל עַבְדֶּ֑/ךָ ה֖וֹשִׁיעֵ֣/נִי בְ/חַסְדֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/016.yaml
  text: Make your face shine on your servant[a]; save me in your steadfast love.
translation:
  language: te
  text: నీ సేవకునిపై నీ ముఖాన్ని ప్రకాశింపజేయి; నీ నిబద్ధ ప్రేమచేత[a] నన్ను రక్షించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ నిబద్ధ ప్రేమలో’ లేదా ‘నీ నిబద్ధ ప్రేమ ప్రకారం.’ ఇక్కడి హీబ్రూ ఉపసర్గను పరస్పరం దగ్గరైన ఈ అర్థాల్లో గ్రహించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִירָה
  choice: ప్రకాశింపజేయి
  rationale: אור ధాతువు హిఫిల్ ఆజ్ఞార్థక రూపం; దేవుడు తన ముఖాన్ని ప్రకాశింపజేయాలనే కారణార్థక విన్నపాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: פָנֶיךָ
  choice: నీ ముఖాన్ని
  rationale: హీబ్రూ భాషలోని స్పష్టమైన ‘ముఖం’ అనే రూపకాన్ని నిలుపుతుంది; ఇది దేవుని అనుగ్రహపూర్వక దృష్టిని సూచించినా, దాన్ని భావానువాదంగా మార్చలేదు.
- source_word: עַל
  choice: నీ సేవకునిపై
  rationale: దేవుని అనుగ్రహం సేవకుని వైపు మళ్లడాన్ని సూచించే దిశార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַבְדֶּךָ
  choice: నీ సేవకుడు
  rationale: ప్రార్థనలో దేవునితో ఉన్న సంబంధాన్ని సూచించడానికి ‘సేవకుడు’ సహజమైనది; ఇక్కడ ప్రధానంగా ఉద్దేశించని బానిసత్వ భావాన్ని రుద్దదు.
- source_word: הוֹשִׁיעֵנִי
  choice: నన్ను రక్షించు
  rationale: ישע ధాతువు ఆజ్ఞార్థక రూపంలోని విస్తృతమైన రక్షణ భావాన్ని, ఈ కీర్తనలోని విడిపింపు విన్నపాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: בְחַסְדֶּךָ
  choice: నీ నిబద్ధ ప్రేమచేత
  rationale: חסד లోని నిలకడైన సంబంధ నిష్ఠతో కూడిన ప్రేమను ‘నిబద్ధ ప్రేమ’ తెలియజేస్తుంది. ב ఉపసర్గను ప్రధాన పాఠ్యంలో సాధనార్థకంగా ‘చేత’ అని ఇచ్చి, సమీప ప్రత్యామ్నాయ అర్థాలను పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: חסד పదానికి అనువాదం
  choice: నిబద్ధ ప్రేమ
  alternative: కరుణ; నిలకడైన ప్రేమ
  rationale: ఈ పదం కేవలం భావోద్వేగ ప్రేమ లేదా జాలి కంటే దేవుని స్థిరమైన సంబంధ నిష్ఠను సూచిస్తుంది. ‘నిబద్ధ ప్రేమ’ ఆ భావభారాన్ని ఆధునిక తెలుగులో సులభంగా తెలియజేస్తుంది.
- issue: בְחַסְדֶּךָ లోని ב ఉపసర్గ సంబంధం
  choice: నీ నిబద్ధ ప్రేమచేత
  alternative: నీ నిబద్ధ ప్రేమలో; నీ నిబద్ధ ప్రేమ ప్రకారం
  rationale: సాధనార్థక భావం సందర్భానికి సహజంగా సరిపోతుంది; అయితే హీబ్రూ ఉపసర్గకు ఇక్కడ పరస్పరం దగ్గరైన ఇతర అర్థాలు కూడా సాధ్యమైనందున వాటిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలి. ‘నీ ముఖాన్ని ప్రకాశింపజేయి’ అనే హీబ్రూ రూపకాన్ని వివరణగా మార్చకుండా నిలిపాం; వాక్య నిర్మాణం సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ఉంచాం.
