source:
  edition: WLC
  text: אֶֽהֱב֥וּ אֶת יְהוָ֗ה כָּֽל חֲסִ֫ידָ֥י/ו אֱ֭מוּנִים נֹצֵ֣ר יְהוָ֑ה וּ/מְשַׁלֵּ֥ם עַל יֶ֝֗תֶר עֹשֵׂ֥ה גַאֲוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/023.yaml
  text: Love Yahweh[b][a], all his faithful ones! Yahweh preserves the faithful and fully repays the one who acts proudly.
translation:
  language: te
  text: 'యెహోవాను ప్రేమించండి, ఆయనకు నిబద్ధులైనవారలారా![a]


    యెహోవా నమ్మకమైనవారిని కాపాడుతాడు;

    గర్వంగా ప్రవర్తించేవాడికి పూర్తిగా ప్రతిఫలమిస్తాడు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆయన భక్తులందరూ,’ ‘ఆయన పరిశుద్ధులందరూ,’ లేదా ‘ఆయన విశ్వాసులందరూ.’ హీబ్రూ పదం యెహోవాపట్ల నిబంధన నిబద్ధతతో గుర్తింపబడినవారిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పూర్తిగా తిరిగి చెల్లిస్తాడు’ లేదా ‘అధికంగా ప్రతిఫలమిస్తాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶהֱבוּ
  choice: ప్రేమించండి
  rationale: אהב అనే క్రియ యొక్క పుంలింగ బహువచన ఆజ్ఞారూపం. ఆరాధక సమాజానికి ఇచ్చిన ప్రత్యక్ష పిలుపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో వ్యక్తపరుస్తుంది; సాధారణ బిరుదుతో దైవనామాన్ని కలిపివేయదు.
- source_word: כָּל חֲסִידָיו
  choice: ఆయనకు నిబద్ధులైన వారందరూ
  rationale: חסידיו దేవునితో నిబంధన సంబంధంలో ప్రేమతో, విశ్వాసంతో నిబద్ధంగా ఉండేవారిని సూచిస్తుంది. ‘పరిశుద్ధులు’ అనే పదం తెచ్చే తరువాతి మతపరమైన భావాలను నివారిస్తూ సంబంధపరమైన అర్థాన్ని నిలుపుతుంది.
- source_word: אֱמוּנִים
  choice: నమ్మకమైనవారిని
  rationale: אמן మూలం నుంచి వచ్చిన ఈ బహువచన విశేషణం ఇక్కడ నామవాచకంగా పనిచేసి విశ్వసనీయంగా, స్థిరంగా ఉండేవారిని సూచిస్తుంది.
- source_word: נֹצֵר
  choice: కాపాడుతాడు
  rationale: జాగ్రత్తగా భద్రపరచడం, సంరక్షించడం అనే נצר భావాన్ని కీర్తనలోని దైవిక రక్షణ సందర్భానికి సరిపోయే సహజ తెలుగు క్రియతో వ్యక్తపరుస్తుంది.
- source_word: וּמְשַׁלֵּם עַל יֶתֶר
  choice: పూర్తిగా ప్రతిఫలమిస్తాడు
  rationale: שלם యొక్క ప్రతికారాత్మక భావాన్నీ, יתר ఇచ్చే అధికత లేదా సంపూర్ణతనూ కలిపి తెలియజేస్తుంది. అధికంగా ప్రతిఫలమిస్తాడు అనే ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: עֹשֵׂה גַאֲוָה
  choice: గర్వంగా ప్రవర్తించేవాడికి
  rationale: అక్షరార్థంగా ‘గర్వాన్ని చేసేవాడు.’ తెలుగులో సహజంగా ఉండే విధంగా, అహంకారపూరిత ప్రవర్తన అనే క్రియాశీల భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: חֲסִידָיו అనే నిబంధన-సంబంధ గుర్తింపు పదం
  choice: ఆయనకు నిబద్ధులైన వారందరూ
  alternative: ఆయన భక్తులందరూ; ఆయన పరిశుద్ధులందరూ; ఆయన విశ్వాసులందరూ
  rationale: ఈ పదం యెహోవాపట్ల నిబంధన ప్రేమ, విశ్వాసం, నిబద్ధతతో గుర్తింపబడినవారిని సూచిస్తుంది. ఎంపిక చేసిన పదబంధం తరువాతి కాలపు ప్రత్యేక సంఘపరమైన భావాన్ని దిగుమతి చేయకుండా ఆ సంబంధపరమైన, నైతిక బలాన్ని కాపాడుతుంది.
- issue: దైవిక ప్రతిఫలము లేదా ప్రతికారము
  choice: యెహోవా నమ్మకమైనవారిని కాపాడుతాడు; గర్వంగా ప్రవర్తించేవాడికి పూర్తిగా ప్రతిఫలమిస్తాడు
  alternative: యెహోవా నమ్మకమైనవారిని కాపాడుతాడు; గర్వంగా ప్రవర్తించేవాడికి అధికంగా తిరిగి చెల్లిస్తాడు
  rationale: హీబ్రూ వాక్యం నమ్మకమైనవారికి రక్షణను, గర్విష్ఠుడికి సంపూర్ణ ప్రతికారాన్ని పక్కపక్కనే ఉంచుతుంది. అనువాదం దైవిక సంరక్షణను గానీ తీర్పును గానీ మృదువుచేయకుండా ఈ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా, అయితే కీర్తనకు తగిన గంభీరతతో ఆజ్ఞ, రక్షణ, తీర్పు అనే మూడు భావాలను స్పష్టంగా ఉంచాం. ‘నిబద్ధులైనవారు’ మరియు ‘నమ్మకమైనవారు’ అనే పదాలతో సమీప హీబ్రూ పదాల సంబంధాన్ని చూపుతూ వాటి సూక్ష్మ భేదాన్ని కూడా కాపాడాం.
