id: PSA.31.19
reference: Psalms 31:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מָ֤ה רַֽב טוּבְ/ךָ֮ אֲשֶׁר צָפַ֪נְתָּ לִּֽ/ירֵ֫אֶ֥י/ךָ פָּ֭עַלְתָּ לַ/חֹסִ֣ים בָּ֑/ךְ נֶ֝֗גֶד בְּנֵ֣י אָדָם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/019.yaml
  text: How abundant is your goodness[a], which you have stored up for those who fear you, which you have worked for those who take refuge in you before the sons of man.
translation:
  language: te
  text: నీకు భయపడేవారి కోసం నీవు భద్రపరచి ఉంచిన నీ మేలు ఎంత అపారమైనది! నిన్ను ఆశ్రయించేవారి కోసం మనుష్యుల ఎదుట నీవు దానిని కార్యరూపంలోకి తెచ్చావు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָה רַב
  choice: ఎంత అపారమైనది
  rationale: ఆశ్చర్యాన్ని వ్యక్తం చేసే מָה, విస్తారాన్ని సూచించే רַב రెండింటినీ సహజమైన తెలుగు ఉద్ఘాటనగా అందిస్తుంది.
- source_word: טוּבְךָ
  choice: నీ మేలు
  rationale: טוּב అంటే మంచితనం, మేలు, సమృద్ధిగా ఇచ్చే మంచి అనే భావాలు ఉన్నాయి. ‘నీ మేలు’ సాధారణ పాఠకులకు సహజంగా ఉండి, దాచిపెట్టబడిన దైవిక మంచిని సూచిస్తుంది.
- source_word: צָפַנְתָּ
  choice: నీవు దాచిపెట్టిన
  rationale: ఈ క్రియ దాచడం మాత్రమే కాక, భవిష్యత్తు కోసం భద్రపరచి ఉంచడం అనే భావాన్ని ఇస్తుంది; ‘దాచిపెట్టిన’ ఆ రూపకాన్ని నిలుపుతుంది.
- source_word: לִירֵאֶיךָ
  choice: నీకు భయపడేవారి కోసం
  rationale: దేవునిపట్ల భయభక్తితో కూడిన గౌరవాన్ని సూచించే మూలపదాన్ని ‘భయపడేవారు’ అని నేరుగా నిలుపుతుంది; దీనిని కేవలం భీతిగా లేదా కేవలం గౌరవంగా పరిమితం చేయదు.
- source_word: פָּעַלְתָּ
  choice: నీవు దానిని కార్యరూపంలోకి తెచ్చావు
  rationale: פעל ఏదో ఒకదాన్ని చేసి నెరవేర్చడం లేదా సంభవింపజేయడం అనే క్రియాశీల భావాన్ని కలిగి ఉంది. ‘కార్యరూపంలోకి తెచ్చావు’ దాచిపెట్టిన మేలు బహిరంగంగా అమలైన భావాన్ని ఇస్తుంది.
- source_word: לַחֹסִים בָּךְ
  choice: నిన్ను ఆశ్రయించేవారి కోసం
  rationale: חסה లోని ఆశ్రయం లేదా రక్షణ కోసం చేరే స్పష్టమైన రూపకాన్ని నిలుపుతుంది; నమ్మకం అనే భావం ఇందులో అంతర్లీనంగా ఉంది.
- source_word: נֶגֶד
  choice: ఎదుట
  rationale: బహిరంగ దృశ్యతను సూచించే נגד కు సంక్షిప్తమైన, సహజమైన సమానార్థకం.
- source_word: בְּנֵי אָדָם
  choice: మనుష్యులు
  rationale: అక్షరార్థంగా ‘ఆదాము కుమారులు’ అయిన ఈ హీబ్రూ నానుడి సాధారణంగా మానవులందరినీ సూచిస్తుంది. తెలుగు ప్రధాన పాఠ్యంలో ‘మనుష్యులు’ ఆ ప్రతినిధి భావాన్ని సహజంగా తెలియజేస్తుంది; అక్షరరూపం పాదటిప్పణిలో ఇవ్వబడింది.
theological_decisions:
- issue: בְּנֵי אָדָם అనే మానవజాతిని సూచించే వ్యక్తీకరణ
  choice: మనుష్యుల ఎదుట
  alternative: ఆదాము కుమారుల ఎదుట
  rationale: ఈ హీబ్రూ పదబంధం మగవారిని మాత్రమే కాక సాధారణంగా మానవులను సూచించే సంప్రదాయ వ్యక్తీకరణ. ప్రధాన పాఠ్యంలో సహజమైన సమగ్ర భావాన్ని ఇచ్చి, అక్షరార్థాన్ని పాదటిప్పణిలో నిలిపాం.
- issue: దాచిపెట్టిన మేలు మరియు కార్యరూపంలోకి తెచ్చిన మేలు మధ్య సంబంధం
  choice: ‘దానిని’ ద్వారా ఒకే మేలును రెండు క్రియలతో అనుసంధానించడం
  alternative: రెండు వేర్వేరు మేలులుగా లేదా రెండవ క్రియకు కర్మ లేకుండా అనువదించడం
  rationale: హీబ్రూలో రెండవ క్రియకు స్పష్టమైన కర్మ లేకపోయినా, ముందున్న טוּבְךָ సహజంగా భావిత కర్మగా పనిచేస్తుంది. తెలుగు వాక్య స్పష్టత కోసం ‘దానిని’ చేర్చాం; కొత్త భావాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘మేలు,’ ‘దాచిపెట్టిన,’ ‘ఆశ్రయించేవారు’ వంటి పదాలు కవితాత్మక రూపకాలను సహజంగా నిలుపుతాయి. ఉద్ఘాటనను మొదటి వాక్యంలో స్పష్టంగా చూపించి, హీబ్రూ సమాంతర నిర్మాణాన్ని రెండు అనుసంధానిత వాక్యాలుగా అందించాం.
