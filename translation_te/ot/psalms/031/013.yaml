id: PSA.31.13
reference: Psalms 31:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י שָׁמַ֨עְתִּי דִּבַּ֥ת רַבִּים֮ מָג֪וֹר מִ/סָּ֫בִ֥יב בְּ/הִוָּסְדָ֣/ם יַ֣חַד עָלַ֑/י לָ/קַ֖חַת נַפְשִׁ֣/י זָמָֽמוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/013.yaml
  text: For I have heard the whispering of many—terror on every side!—as they conspired together against me[a], plotting to take my life.
translation:
  language: te
  text: ఎందుకంటే నేను అనేకుల అపనిందను విన్నాను[a]—నలువైపులా భయం! వారు నాకు విరోధంగా కలిసి ఆలోచించినప్పుడు, నా ప్రాణం తీయాలని పన్నాగం పన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అనేకుల గుసగుసలు” లేదా “అనేకుల వదంతి.” హీబ్రూ పదం గుసగుసలు, వదంతి, లేదా అపనిందాత్మక మాటలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి సందర్భంలో కీర్తనకర్త అనుభవిస్తున్న బాధకు కారణాన్ని పరిచయం చేసే వివరణాత్మక సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שָׁמַעְתִּי
  choice: నేను విన్నాను
  rationale: హీబ్రూ సంపూర్ణ క్రియను సందర్భానికి తగిన సహజమైన తెలుగు భూతకాలంతో అందిస్తుంది; విన్నదాని ప్రభావం ప్రస్తుత పరిస్థితిలో కొనసాగుతుందని సందర్భమే తెలియజేస్తుంది.
- source_word: דִּבַּת רַבִּים
  choice: అనేకుల అపనిందలు
  rationale: דִּבָּה అనే నామవాచకం చెడు వదంతి, గుసగుస, అపనింద అనే అర్థాలను కలిగి ఉంటుంది. శత్రుత్వపూరిత సందర్భంలో ‘అపనిందలు’ బలమైన సాధ్యార్థం; ఇతర భావాలను పాదటిప్పణిలో నిలుపుతుంది.
- source_word: מָגוֹר מִסָּבִיב
  choice: చుట్టూ భయమే
  rationale: అన్ని వైపులా ఆవరించిన భయభ్రాంతిని తెలిపే సంక్షిప్త హీబ్రూ నుడికారాన్ని సహజంగా, బలంగా వ్యక్తం చేస్తుంది.
- source_word: בְּהִוָּסְדָם יַחַד עָלַי
  choice: వారు నాకు విరోధంగా కూడి ఆలోచిస్తూ
  rationale: కలిసి సంప్రదించడం లేదా కుట్రపూర్వకంగా ఆలోచించడం అనే భావాన్ని, עָלַי లోని ప్రతికూల సంబంధాన్ని స్పష్టంగా నిలుపుతుంది; చివరి క్రియలోని పన్నాగ భావంతో అనవసర పునరుక్తిని తగ్గిస్తుంది.
- source_word: לָקַחַת נַפְשִׁי
  choice: నా ప్రాణం తీయడానికి
  rationale: נֶפֶשׁ ఇక్కడ అమూర్తమైన ఆత్మను కాక వ్యక్తి ప్రాణాన్ని లేదా జీవితాన్ని సూచిస్తుంది; ప్రాణహరణ బెదిరింపును ఆధునిక తెలుగులో స్పష్టంగా చెబుతుంది.
- source_word: זָמָמוּ
  choice: పన్నాగం పన్నారు
  rationale: ఉద్దేశపూర్వకమైన శత్రుత్వ ప్రణాళికను తెలిపే క్రియాబలాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
