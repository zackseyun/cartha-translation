translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే కీర్తనలోని భయం మరియు శత్రుత్వ తీవ్రతను నిలుపుకునే గౌరవప్రదమైన శైలి. మూలంలోని సంక్షిప్త ఆశ్చర్యోక్తిని ‘చుట్టూ భయమే!’గా ఉంచింది.
