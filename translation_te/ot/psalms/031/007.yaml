source:
  edition: WLC
  text: אָגִ֥ילָה וְ/אֶשְׂמְחָ֗ה בְּ/חַ֫סְדֶּ֥/ךָ אֲשֶׁ֣ר רָ֭אִיתָ אֶת עָנְיִ֑/י יָ֝דַ֗עְתָּ בְּ/צָר֥וֹת נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/007.yaml
  text: I will rejoice and be glad in your steadfast love[a], because you have seen my affliction; you have known the distresses of my soul.
translation:
  language: te
  text: 'నీ అచంచల ప్రేమను బట్టి

    నేను ఉల్లసించి ఆనందిస్తాను;

    ఎందుకంటే నీవు నా బాధను చూశావు,

    నా ప్రాణపు సంకటాలను[a] ఎరిగావు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా జీవితంలోని కష్టాలను,’ లేక ‘నేను అనుభవించిన సంకటాలను.’ హీబ్రూ నెఫెష్ అనే పదం సందర్భాన్ని బట్టి ‘ప్రాణం,’ ‘జీవితం,’ లేదా వ్యక్తినే సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָגִילָה
  choice: నేను ఉల్లసిస్తాను
  rationale: గీల్ ధాతువు నుంచి వచ్చిన ఈ ప్రథమ పురుష కోహోర్టేటివ్ రూపం ఉప్పొంగే ఆనందంతో కూడిన సంకల్పాన్ని వ్యక్తం చేస్తుంది. ‘ఉల్లసిస్తాను’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְאֶשְׂמְחָה
  choice: ఆనందిస్తాను
  rationale: శామఖ్ ధాతువు ఆనందించడం, సంతోషించడం అనే భావాన్ని ఇస్తుంది. ముందున్న ‘ఉల్లసిస్తాను’తో కలిపి కవితాత్మక తీవ్రతను పునరుక్తి లేకుండా వ్యక్తం చేస్తుంది.
- source_word: בְחַסְדֶּךָ
  choice: నీ అచంచల ప్రేమను బట్టి
  rationale: హెసెద్ ప్రేమ, విశ్వసనీయత, నిబద్ధత అనే పరస్పర సంబంధిత భావాలను కలిగి ఉంది. ‘అచంచల ప్రేమ’ దాని నిలకడను, ప్రేమ స్వభావాన్ని సహజంగా తెలియజేస్తుంది; בְ ఉపసర్గ ఇక్కడ ఆనందానికి ఆధారం లేదా కారణాన్ని సూచిస్తున్నందున ‘ను బట్టి’ అని అనువదించబడింది.
- source_word: אֲשֶׁר
  choice: ఎందుకంటే
  rationale: సాధారణంగా సంబంధార్థక అవ్యయమైనా, ఈ సందర్భంలో ఆనందానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: רָאִיתָ אֶת עָנְיִי
  choice: నీవు నా బాధను చూశావు
  rationale: עֳנִי బాధ, దుస్థితి, అణచివేత అనే భావాలను ఇవ్వగలదు. ‘బాధ’ సందర్భానికి తగిన విస్తృత అర్థాన్ని, సంక్షిప్తతను కాపాడుతుంది.
- source_word: יָדַעְתָּ
  choice: ఎరిగావు
  rationale: ידע కేవలం సమాచార జ్ఞానాన్నే కాక గుర్తించడం, వ్యక్తిగతంగా తెలుసుకోవడం అనే భావాలనూ కలిగి ఉంది. ‘ఎరిగావు’ ఈ విస్తృతిని గంభీరమైనప్పటికీ అర్థమయ్యే తెలుగులో నిలుపుతుంది.
- source_word: בְּצָרוֹת נַפְשִׁי
  choice: నా ప్రాణపు సంకటాలను
  rationale: צָרוֹת అనే బహువచనం ఇరుకులు, కష్టాలు, సంకటాలను సూచిస్తుంది; נֶפֶשׁ ప్రాణం, జీవితం లేదా వ్యక్తినే సూచించగలదు. ‘ప్రాణపు సంకటాలు’ వ్యక్తి లోతుగా అనుభవించిన బాధను తెలియజేస్తూ మూలంలోని అర్థవిస్తృతిని కొంతవరకు కాపాడుతుంది.
theological_decisions:
- issue: కీర్తనలో נֶפֶשׁ పదం అనువాదం
  choice: ప్రాణం
  alternative: జీవితం; స్వయం/మొత్తం వ్యక్తి
  rationale: ఈ పదం వేరైన అమూర్త ‘ఆత్మ’ను మాత్రమే తప్పనిసరిగా సూచించదు; జీవితం లేదా సంపూర్ణ వ్యక్తినీ సూచించగలదు. ‘ప్రాణం’ కీర్తనా సందర్భానికి సహజంగా సరిపోతూ ఆ అర్థవిస్తృతిని నిలుపుతుంది. ఇతర సాధ్యార్థాలను పాదటిప్పణి స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కీర్తనా శైలి వాడబడింది. మొదటి రెండు క్రియల కవితాత్మక జంటను, చివరి భాగంలోని బహువచనాన్ని కాపాడుతూ తెలుగు వాక్యనిర్మాణానికి తగిన పాద విభజన చేయబడింది.
