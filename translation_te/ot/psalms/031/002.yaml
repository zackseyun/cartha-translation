translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనా గౌరవాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదాలు వాడబడ్డాయి. సమాంతర కవితా నిర్మాణం కోసం రెండు ఆజ్ఞల మధ్య అర్ధవిరామం ఉంచబడింది; ‘బండ,’ ‘నివాసం’ అనే మూల చిత్రాలు సాధ్యమైనంతవరకు సంరక్షించబడ్డాయి.
