review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the imperative appeal, urgency, rescue, rock/stronghold imagery, and the purpose clause. However, “కోటలాంటి నివాసంగా” (“a dwelling like a fortress”) weakens the Hebrew construct phrase לְבֵית מְצוּדוֹת, which presents the house itself as fortified rather than merely comparable to a fortress.
  naturalness: The Telugu is clear, prayerful, and appropriate for modern standard usage. “కోటబద్ధమైన నివాసంగా” is more exact while remaining natural.
  terminology: “విడిపించు” appropriately distinguishes נצל from the later ישׁע, rendered “రక్షించు.” “బండ” preserves צוּר’s rock image, and “ఆశ్రయ దుర్గమైన” communicates the protective sense of מָעוֹז. The revised wording preserves the house/dwelling imagery of בֵּית while making its fortification explicit.
  issues:
  - severity: medium
    issue: The expression “కోటలాంటి నివాసంగా” uses a comparison (“fort-like dwelling”) for לְבֵית מְצוּדוֹת.
    rationale: The Hebrew describes a house characterized by strongholds/fortification. Rendering it as “కోటబద్ధమైన నివాసంగా” retains the house image and expresses the fortified quality without weakening it into a simile.
  revised_text: నీ చెవిని నా వైపు వంచు; త్వరగా నన్ను విడిపించు. నాకు ఆశ్రయ దుర్గమైన బండగా[a], నన్ను రక్షించడానికి కోటబద్ధమైన నివాసంగా[b] ఉండు.
