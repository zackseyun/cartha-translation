  text: הַטֵּ֤ה אֵלַ֨/י אָזְנְ/ךָ֮ מְהֵרָ֪ה הַצִּ֫ילֵ֥/נִי הֱיֵ֤ה לִ֨/י לְֽ/צוּר מָ֭עוֹז לְ/בֵ֥ית מְצוּד֗וֹת לְ/הוֹשִׁיעֵֽ/נִי׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/002.yaml
  text: Incline your ear to me[a]; quickly rescue me. Be for me a rock of refuge[b], a fortified house to save me.
translation:
  language: te
  text: నీ చెవిని నా వైపు వంచు; త్వరగా నన్ను విడిపించు. నాకు ఆశ్రయ దుర్గమైన బండగా[a], నన్ను రక్షించడానికి కోటబద్ధమైన నివాసంగా[b] ఉండు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బలమైన బండగా.’ హీబ్రూ పదబంధం ‘బండ’ అనే చిత్రంతో బలమైన రక్షణస్థలం లేదా దుర్గం అనే భావాన్ని కలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘కోటగా,’ లేదా మరింత అక్షరార్థంగా ‘కోటల గృహంగా.’ హీబ్రూ పాఠం నివాసస్థల చిత్రాన్ని నిలుపుతూనే అది పటిష్ఠంగా రక్షించబడిన స్థలమని వివరిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטֵּה אֵלַי אָזְנְךָ
  choice: నీ చెవిని నా వైపు వంచు
  rationale: ‘చెవిని వంచడం’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ, శ్రద్ధగా వినాలనే ప్రార్థనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מְהֵרָה
  choice: త్వరగా
  rationale: సహాయం కోసం కీర్తనకర్త వ్యక్తం చేస్తున్న అత్యవసరతను నేరుగా తెలియజేస్తుంది.
- source_word: הַצִּילֵנִי
  choice: నన్ను విడిపించు
  rationale: ప్రమాదం లేదా శత్రువుల చేతిలోనుండి బయటకు తీయడం అనే נצל క్రియ భావాన్ని ఇస్తుంది; చివరి ישׁע క్రియకు వాడిన ‘రక్షించు’తో స్వల్ప పదభేదాన్ని కూడా నిలుపుతుంది.
- source_word: הֱיֵה לִי
  choice: నాకు ... ఉండు
  rationale: హీబ్రూలోని సరళ ఆజ్ఞార్థక రూపాన్నీ, దేవుడు కీర్తనకర్తకు వ్యక్తిగత ఆశ్రయంగా ఉండాలనే సంబంధ భావాన్నీ నిలుపుతుంది.
- source_word: לְצוּר מָעוֹז
  choice: ఆశ్రయ దుర్గమైన బండగా
  rationale: צוּר లోని ‘బండ’ రూపకాన్నీ, מָעוֹז లోని బలమైన రక్షణస్థలం/దుర్గం భావాన్నీ కలిపి ఉంచుతుంది.
- source_word: לְבֵית מְצוּדוֹת
  choice: కోటలాంటి నివాసంగా
  rationale: בֵית లోని ఇల్లు లేదా నివాసస్థలం చిత్రాన్ని పూర్తిగా తొలగించకుండా, מְצוּדוֹת సూచించే బలమైన కోట రక్షణను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לְהוֹשִׁיעֵנִי
  choice: నన్ను రక్షించడానికి
  rationale: לְ ఉపసర్గతో కూడిన క్రియారూపం తెలిపే ఉద్దేశాన్ని నిలుపుతూ, ישׁע యొక్క రక్షణ భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
