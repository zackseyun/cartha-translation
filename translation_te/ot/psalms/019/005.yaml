source:
  edition: WLC
  text: וְ/ה֗וּא כְּ֭/חָתָן יֹצֵ֣א מֵ/חֻפָּת֑/וֹ יָשִׂ֥ישׂ כְּ֝/גִבּ֗וֹר לָ/ר֥וּץ אֹֽרַח׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/005.yaml
  text: And it is like a bridegroom coming out from his wedding chamber[a]; it rejoices like a warrior to run a course.
translation:
  language: te
  text: అది తన పెండ్లి గది[a] నుంచి బయటకు వచ్చే పెండ్లికుమారునిలా ఉంది; మార్గంలో పరుగెత్తడానికి శూరునిలా ఉల్లసిస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన పెండ్లి పందిరి నుంచి,” లేదా “తన వివాహ గది నుంచి.” హీబ్రూ חֻפָּה అనే పదం పెండ్లి పందిరిని లేదా వివాహ గదిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: అది
  rationale: ఈ సర్వనామం ముందటి వచనంలోని సూర్యుణ్ణి సూచిస్తుంది. తెలుగులో సూర్యుని వ్యక్తీకరించినా, ఇక్కడ సహజంగా నపుంసక ఏకవచన సర్వనామం వాడబడింది; వాక్యసంధిని తెలుగులో సహజ ప్రవాహం కోసం ప్రత్యేకంగా అనువదించలేదు.
- source_word: כְּחָתָן
  choice: పెండ్లికుమారునిలా
  rationale: వివాహ సందర్భంలోని వరుణ్ణి స్పష్టంగా సూచిస్తూ, కవితాత్మక గౌరవాన్ని నిలుపుతుంది.
- source_word: יֹצֵא
  choice: బయలుదేరే
  rationale: బయటకు రావడం లేదా వెళ్లడం అనే క్రియార్థాన్ని, హీబ్రూ అసమాపక క్రియారూపంలోని సజీవ దృశ్యాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵחֻפָּתוֹ
  choice: తన పెండ్లి గది నుంచి
  rationale: సందర్భంలో పెండ్లికుమారుడు ఉత్సాహంగా బయటకు వచ్చే దృశ్యాన్ని సహజంగా తెలియజేస్తుంది. חֻפָּה అనే పదానికి పెండ్లి పందిరి అనే అర్థం కూడా ఉండగలదు; దానిని పాదసూచికలో ఉంచాం.
- source_word: יָשִׂישׂ
  choice: ఉల్లసిస్తుంది
  rationale: సాధారణ సంతోషం కంటే ఉప్పొంగే ఆనందాన్ని సూచించే ఈ క్రియకు కవితాత్మకమైనప్పటికీ ఆధునిక పాఠకులకు అర్థమయ్యే సమానార్థకం.
- source_word: כְּגִבּוֹר
  choice: శూరునిలా
  rationale: బలవంతుడైన యోధుడు లేదా పరాక్రమవంతుడు అనే భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: לָרוּץ
  choice: పరుగెత్తడానికి
  rationale: పోటీ అనే అదనపు భావాన్ని చేర్చకుండా רוץ యొక్క ప్రాథమిక అర్థాన్ని నేరుగా అందిస్తుంది.
- source_word: אֹרַח
  choice: మార్గం వెంబడి
  rationale: హీబ్రూలోని మార్గం లేదా బాట అనే రూపకాన్ని నిలుపుతూ, సూర్యుడు ఆకాశంలో ప్రయాణించే సందర్భంలో సహజమైన తెలుగు ప్రయోగాన్ని ఇస్తుంది; మూలంలో లేని స్వామ్యసూచకాన్ని చేర్చలేదు.
