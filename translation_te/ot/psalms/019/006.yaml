  variant: modern standard Telugu
source:
  edition: WLC
  text: מִ/קְצֵ֤ה הַ/שָּׁמַ֨יִם מֽוֹצָא֗/וֹ וּ/תְקוּפָת֥/וֹ עַל קְצוֹתָ֑/ם וְ/אֵ֥ין נִ֝סְתָּ֗ר מֵֽ/חַמָּת/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/006.yaml
  text: Its rising is from one end of the heavens[a], and its circuit to their ends[c][b], and nothing is hidden from its heat.
translation:
  language: te
  text: ఆకాశపు ఒక అంచు నుండి దాని ఉదయం, వాటి అంచుల వరకు దాని పరిభ్రమణం; దాని వేడినుండి దాగినదేదీ లేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקְצֵה הַשָּׁמַיִם
  choice: ఆకాశపు ఒక అంచునుంచి
  rationale: קָצֶה అంటే అంచు లేదా చివర. ఏకవచన రూపం, מִ ఉపసర్గ కలసి ‘ఒక అంచునుంచి’ అనే సహజ భావాన్ని ఇస్తాయి. שָׁמַיִם రూపపరంగా బహువచనమైనా, ఆధునిక ప్రామాణిక తెలుగులో ‘ఆకాశం’ సమగ్ర విస్తృతిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מוֹצָאוֹ
  choice: అది ఉదయిస్తుంది
  rationale: מוֹצָא అంటే బయలుదేరడం లేదా వెలువడడం; సూర్యుని సందర్భంలో ‘ఉదయిస్తుంది’ అనేది స్పష్టమైన, సహజమైన కవితాత్మక ప్రయోగం. ‘బయలుదేరుతుంది’ అనే విస్తృత అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וּתְקוּפָתוֹ
  choice: దాని ప్రదక్షిణ సాగుతుంది
  rationale: תְּקוּפָה చుట్టి రావడం, పరిభ్రమణం లేదా ఆవర్తన మార్గాన్ని సూచించగలదు. ‘ప్రదక్షిణ’ సూర్యుడు ఆకాశమంతటా చుట్టివచ్చే కవితాత్మక చిత్రాన్ని సంక్షిప్తంగా నిలుపుతుంది; ‘సాగుతుంది’ తెలుగులో వాక్యాన్ని సహజం చేస్తుంది.
- source_word: עַל קְצוֹתָם
  choice: వాటి మరో అంచువరకు
  rationale: సందర్భంలో עַל గమ్యం లేదా విస్తృతి భావాన్ని ఇస్తుంది. బహువచన ప్రత్యయం ఆకాశ విస్తృతుల అంచులను సూచిస్తుంది. తెలుగులో ‘మరో’ చేర్చడం ఒక అంచునుంచి ఎదుటి అంచువరకు ఉన్న గమనాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: וְאֵין נִסְתָּר
  choice: దాగినదేదీ లేదు
  rationale: אֵין తో కూడిన నిష్క్రియ భాగధాతువు ఏదీ దాచబడలేదనే అర్థాన్ని ఇస్తుంది. ‘దాగినదేదీ లేదు’ సంక్షిప్తంగా, సహజంగా ఉండి వస్తువులు మరియు జీవులు రెండింటినీ నిర్దిష్టం చేయకుండా ఉంచుతుంది.
- source_word: מֵחַמָּתוֹ
  choice: దాని వేడికి
  rationale: חַמָּה ఇక్కడ సూర్యుని వేడిని సూచిస్తుంది. מִ ఉపసర్గను తెలుగులో ‘వేడికి దాగడం’ అనే సహజ నిర్మాణంతో వ్యక్తం చేశాం. ‘వెచ్చదనం’ మూలంలోని తీవ్రతను తగ్గిస్తుంది.
theological_decisions:
- issue: సూర్యుని వ్యక్తీకరణ స్థాయి
  choice: తెలుగులో లింగనిరపేక్షమైన ‘అది/దాని’ రూపాలు వాడుతూ సూర్యుని కవితాత్మక గమనాన్ని నిలుపడం.
  alternative: హీబ్రూ పుంలింగ ప్రత్యయాలను అనుసరించి ‘అతడు/అతని’ అని బలమైన వ్యక్తీకరణ చేయడం.
  rationale: హీబ్రూలో పుంలింగ ప్రత్యయాలు ‘సూర్యుడు’ అనే పదం వ్యాకరణ లింగాన్ని అనుసరిస్తాయి. తెలుగులో ‘అతడు’ అనడం అనవసరంగా దేవతీకరణ లేదా బలమైన మానవీకరణ భావాన్ని కలిగించవచ్చు. ‘అది/దాని’ సృష్టిగా సూర్యుని చూపుతూ కవితా చిత్రాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తనకు తగిన గంభీర కవితాత్మక శైలిని పాటించాం. ‘ఉదయిస్తుంది,’ ‘ప్రదక్షిణ,’ ‘దాగినదేదీ లేదు’ అనే పదబంధాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి మూలంలోని సమాంతర నిర్మాణాన్ని నిలుపుతాయి.
