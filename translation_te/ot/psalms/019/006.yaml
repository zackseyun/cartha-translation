revisions:
- from: ఆకాశపు ఒక అంచునుంచి అది ఉదయిస్తుంది[a]; వాటి మరో అంచువరకు దాని ప్రదక్షిణ సాగుతుంది[b]. దాని వేడికి దాగినదేదీ లేదు.
  to: ఆకాశపు ఒక అంచు నుండి దాని ఉదయం, వాటి అంచుల వరకు దాని పరిభ్రమణం; దాని వేడినుండి దాగినదేదీ లేదు.
  rationale: The revision removes the ritual coloring of “ప్రదక్షిణ,” avoids adding “మరో,” and renders the final prepositional phrase more directly. Footnote anchors are not required in the revised text because the alternatives are supplied as a complete footnote set for editorial placement; if anchors are retained in publication, place [a] after “ఉదయం” and [b] after “పరిభ్రమణం.”
