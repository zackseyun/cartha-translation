  variant: modern standard Telugu
source:
  edition: WLC
  text: גַּ֤ם מִ/זֵּדִ֨ים חֲשֹׂ֬ךְ עַבְדֶּ֗/ךָ אַֽל יִמְשְׁלוּ בִ֣/י אָ֣ז אֵיתָ֑ם וְ֝/נִקֵּ֗יתִי מִ/פֶּ֥שַֽׁע רָֽב׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/013.yaml
  text: Also keep your servant back from presumptuous sins[a]; do not let them rule over me[d][c][b]. Then I will be blameless and be cleared from great transgression.
translation:
  language: te
  text: ఇంకా, అహంకారపూరిత పాపాల నుండి నీ సేవకుణ్ణి కాపాడు; అవి నన్ను ఏలనివ్వకు. అప్పుడు నేను నిందలేనివాడనై[b], ఘోరమైన అతిక్రమం నుండి నిర్దోషినవుతాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా, “సమగ్రుడిగా” లేదా “యథార్థవంతుడిగా.” ఇక్కడి హెబ్రీ పదానికి సంపూర్ణత, నైతిక సమగ్రత అనే భావాలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: ఈ ప్రార్థనను ముందటి వచనంలోని రహస్య దోషాల విషయంతో సహజంగా అనుసంధానించడం
  rationale: తెలుగులో వాక్యప్రవాహం కోసం ప్రత్యేకంగా ‘కూడా’ అని పెట్టకపోయినా, ముందటి ప్రార్థనకు అదనంగా చెప్పే భావం సందర్భంలో నిలుస్తుంది.
- source_word: מִזֵּדִים
  choice: అహంకారంతో చేసే పాపాలకు
  rationale: ఈ పదం అహంకారులైన వ్యక్తులను గానీ, గర్వంతో లేదా ధిక్కారంతో చేసే పాపాలను గానీ సూచించవచ్చు. ముందటి వచనంలోని దోషాలతో ఉన్న సమాంతరతను బట్టి ప్రధాన పాఠంలో పాపాలను సూచించే భావం తీసుకోబడింది; అహంకారపు ఛాయను కూడా నిలిపింది.
- source_word: חֲשֹׂךְ עַבְדֶּךָ
  choice: నీ సేవకుణ్ణి దూరంగా ఉంచు
  rationale: దేవుడు తన సేవకుణ్ణి అటువంటి పాపాల్లో పడకుండా నిలువరించాలనే ప్రార్థనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אַל יִמְשְׁלוּ בִי
  choice: అవి నన్ను ఏలనీయకు
  rationale: משל עם ב అనే నిర్మాణంలోని ఆధిపత్యం లేదా ఏలుబడి భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אֵיתָם
  choice: నిందలేనివాడిగా
  rationale: నైతిక సమగ్రత లేదా యథార్థతను సూచిస్తుంది; సంపూర్ణ పాపరాహిత్యాన్ని తప్పనిసరిగా సూచించదు.
- source_word: וְנִקֵּיתִי
  choice: నిర్దోషినవుతాను
  rationale: దోషం లేదా అపరాధబాధ్యత నుంచి విడుదల కావడం అనే נקה పదభావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִפֶּשַׁע רָב
  choice: ఘోరమైన అతిక్రమం నుంచి
  rationale: פשע లోని దేవునికి విరోధమైన తిరుగుబాటు/అతిక్రమ భావాన్నీ, רָב తెలిపే తీవ్రతనూ వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: מִזֵּדִים యొక్క సూచన
  choice: అహంకారంతో చేసే పాపాలు
  alternative: అహంకారులు లేదా గర్విష్ఠులైన వ్యక్తులు
  rationale: సమీప సందర్భం దోషాలు, పాపాల గురించే ఉండటం వల్ల నైతిక సమాంతరతకు ఈ పఠనం సరిపోతుంది. అయితే హెబ్రీ పదం వ్యక్తులను కూడా సూచించగల నిజమైన సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
- issue: אֵיתָם యొక్క భావబలం
  choice: నిందలేనివాడిగా
  alternative: సమగ్రుడిగా, యథార్థవంతుడిగా లేదా నిర్దోషిగా
  rationale: ఇది దేవుని ఎదుట నైతిక సమగ్రతను సూచిస్తుంది; సంపూర్ణ పాపరాహిత్య సిద్ధాంతాన్ని అనువాదంలోకి చొప్పించదు.
- issue: పాపం ఏలుబడి చేసే శక్తిగా చిత్రించబడటం
  choice: అవి నన్ను ఏలనీయకు
  alternative: అవి నాపై ఆధిపత్యం చేయనీయకు
  rationale: మూలంలోని వ్యక్తీకరణను, పాపం మనిషిపై అధికారం చెలాయించగలదనే ఉద్రిక్తతను పరిష్కరించకుండా అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనా గౌరవాన్ని నిలుపుతూ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే భాష వాడబడింది. ‘నీ సేవకుడు,’ ‘ఏలనీయకు,’ ‘నిందలేనివాడు’ వంటి పదబంధాలు కీర్తనా శైలిని నిలుపుతాయి; అతిగా ప్రాచీనమైన లేదా సంఘవిశిష్టమైన పదజాలం నివారించబడింది.
