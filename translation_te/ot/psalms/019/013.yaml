revisions:
- from: అహంకారంతో చేసే పాపాలకు[a] నీ సేవకుణ్ణి దూరంగా ఉంచు; అవి నన్ను ఏలనీయకు. అప్పుడు నేను నిందలేనివాడిగా[b] ఉండి, ఘోరమైన అతిక్రమం[c] నుంచి నిర్దోషినవుతాను.
  to: ఇంకా, అహంకారపూరిత పాపాల నుండి నీ సేవకుణ్ణి కాపాడు; అవి నన్ను ఏలనివ్వకు. అప్పుడు నేను నిందలేనివాడనై[b], ఘోరమైన అతిక్రమం నుండి నిర్దోషినవుతాను.
  rationale: The revision restores the additive force of גַּם with “ఇంకా” and uses a concise modern Telugu expression for presumptuous/proud sins. It preserves the disputed referent in footnote a, the moral-integrity nuance of תָּם in footnote b, and the rebellion nuance of פֶּשַׁע in footnote c. Footnote anchors are retained at the corresponding translated expressions.
