source:
  edition: WLC
  text: הַ/שָּׁמַ֗יִם מְֽסַפְּרִ֥ים כְּבֽוֹד אֵ֑ל וּֽ/מַעֲשֵׂ֥ה יָ֝דָ֗י/ו מַגִּ֥יד הָ/רָקִֽיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/001.yaml
  text: The heavens declare the glory of God[b][a], and the expanse proclaims the work of his hands.
translation:
  language: te
  text: ఆకాశాలు దేవుని మహిమను చాటుతున్నాయి; ఆయన చేతుల పనిని ఆకాశ విస్తారం ప్రకటిస్తోంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆకాశమండలం.’ హీబ్రూ రָקִיעַ పదం వ్యాపించి ఉన్న ఆకాశాన్ని లేదా ఆకాశ గుమ్మటాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁמַיִם
  choice: ఆకాశాలు
  rationale: హీబ్రూ బహువచన రూపాన్ని నిలుపుతూ, కేవలం కనిపించే ఆకాశానికే పరిమితం కాని విస్తృతమైన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מְסַפְּרִים
  choice: చాటుతున్నాయి
  rationale: ספר క్రియారూపంలోని ‘వివరించడం/తెలియజేయడం’ అనే భావాన్ని కవితాత్మక వ్యక్తీకరణకు తగిన విధంగా అందిస్తుంది; వర్తమాన కృదంతంలోని కొనసాగుతున్న చర్యను కూడా నిలుపుతుంది.
- source_word: כְּבוֹד
  choice: మహిమ
  rationale: దేవునికి సంబంధించిన כבוד యొక్క ఘనత, వైభవం, గౌరవం అనే భావాలను కలిపి అందించే స్థిరమైన తెలుగు బైబిలు పదం.
- source_word: אֵל
  choice: దేవుడు
  rationale: ఇక్కడ אֵל సృష్టికర్తయైన దేవుణ్ణి సూచించే బిరుదుగా ఉంది; ప్రత్యేక నామంగా లిప్యంతరీకరించాల్సిన అవసరం సందర్భంలో లేదు.
- source_word: וּמַעֲשֵׂה יָדָיו
  choice: ఆయన చేతుల కార్యాన్ని
  rationale: ‘ఆయన చేతుల పని’ అనే మానవరూపకమైన హీబ్రూ చిత్రణను సంక్షిప్తంగా, గౌరవప్రదంగా నిలుపుతుంది.
- source_word: מַגִּיד
  choice: ప్రకటిస్తోంది
  rationale: נגד హిఫీల్ కృదంతంలోని ‘తెలియజేయడం/ప్రకటించడం’ అనే భావాన్ని, మొదటి పాదానికి సమాంతరంగా ఉన్న కొనసాగుతున్న చర్యగా వ్యక్తం చేస్తుంది.
- source_word: הָרָקִיעַ
  choice: ఆకాశ విస్తారం
  rationale: వ్యాపించి ఉన్న ఆకాశం లేదా ఆకాశ గుమ్మటం అనే רָקִיעַ చిత్రాన్ని ఆధునిక పాఠకునికి అర్థమయ్యేలా అందిస్తూ, కేవలం ‘ఆకాశం’ అని సరళీకరించదు.
theological_decisions:
- issue: אֵל పదం బిరుదా, ప్రత్యేక నామమా
  choice: దేవుడు
  alternative: ఏల్
  rationale: ఈ సందర్భంలో సృష్టి ఎవరి మహిమను వెల్లడిస్తుందో తెలిపే సాధారణ దైవబిరుదు ప్రధానంగా ఉంది. ‘ఏల్’ అని లిప్యంతరీకరిస్తే మూలపాఠం తప్పనిసరిగా సూచించని ప్రత్యేక నామ ప్రాధాన్యం కలగవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తన కవిత్వానికి తగిన గౌరవప్రదమైన శైలి. రెండు సమాంతర పాదాల్లోని వర్తమాన కృదంత భావాన్ని ‘చాటుతున్నాయి/ప్రకటిస్తోంది’ ద్వారా నిలిపాం. ‘ఆయన చేతుల కార్యం’ అనే మూల మానవరూపకాన్ని అనువాదంలో ఉంచాం.
