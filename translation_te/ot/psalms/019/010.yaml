  edition: WLC
  text: הַֽ/נֶּחֱמָדִ֗ים מִ֭/זָּהָב וּ/מִ/פַּ֣ז רָ֑ב וּ/מְתוּקִ֥ים מִ֝/דְּבַ֗שׁ וְ/נֹ֣פֶת צוּפִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/010.yaml
  text: They are more desirable than gold[a], even than much fine gold, and sweeter than honey and drippings from the honeycomb.
translation:
  language: te
  text: అవి బంగారం కంటే, ఎంతో మేలిమి బంగారం కంటే కూడా మరింత కోరదగినవి[a]; తేనె కంటే, తేనెపట్టుల నుంచి కారే తేనె కంటే కూడా తియ్యనివి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బంగారం కంటే ... తేనె కంటే, తేనెపట్టుల నుంచి కారే తేనె కంటే తియ్యనివి.” హీబ్రూలో కృదంత రూపాలు తులనాత్మక పదబంధాలతో ఉన్నాయి; చివరి పదబంధాన్ని మరింత అక్షరార్థంగా “పట్టుల కారే తేనె” అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֶּחֱמָדִים
  choice: కోరదగినవి
  rationale: חמד ధాతువు నిఫాల్ కృదంత రూపం; ముందటి వచనంలోని యెహోవా తీర్పులను సూచిస్తూ విలువైనవిగా కోరదగినవని చెబుతుంది. తరువాతి מִן తులనార్థాన్ని అందిస్తుంది.
- source_word: מִזָּהָב
  choice: బంగారం కంటే
  rationale: מִן ఇక్కడ తులనను సూచిస్తుంది; తెలుగులో ‘కంటే’ సహజంగా ఆ సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: וּמִפַּז רָב
  choice: విస్తారమైన మేలిమి బంగారం కంటే కూడా
  rationale: פַּז సాధారణ זָהָב కంటే విశిష్టమైన శుద్ధమైన/మేలిమి బంగారాన్ని సూచిస్తుంది; רָב దాని సమృద్ధిని తెలియజేస్తుంది. ‘కూడా’ క్రమంగా పెరిగే పోలికను స్పష్టం చేస్తుంది.
- source_word: וּמְתוּקִים
  choice: తియ్యనివి
  rationale: తరువాతి מִן వల్ల ఇది తులనాత్మక భావంలో ఉంది; తెలుగులో ‘కంటే ... తియ్యనివి’ సహజ నిర్మాణం.
- source_word: מִדְּבַשׁ
  choice: తేనె కంటే
  rationale: מִן తులనార్థకంగా వాడబడింది; דְּבַשׁ కు సాధారణమైన ఆధునిక తెలుగు పదం ‘తేనె’.
- source_word: וְנֹפֶת צוּפִים
  choice: తేనెపట్టుల నుంచి కారే తేనె కంటే కూడా
  rationale: נֹפֶת కారే లేదా చిందే తేనెను సూచిస్తుంది; צוּפִים తేనెపట్టులు/వాటి గదులను సూచించే అవకాశముంది. ఈ అనువాదం దృశ్యరూపాన్ని నిలుపుతూ తెలుగు పాఠకునికి స్పష్టంగా ఉంటుంది.
