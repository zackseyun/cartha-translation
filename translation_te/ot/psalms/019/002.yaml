id: PSA.19.2
reference: Psalms 19:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: י֣וֹם לְ֭/יוֹם יַבִּ֣יעַֽ אֹ֑מֶר וְ/לַ֥יְלָה לְּ֝/לַ֗יְלָה יְחַוֶּה דָּֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/002.yaml
  text: Day to day pours forth speech[b][a], and night to night reveals knowledge.
translation:
  language: te
  text: పగలు పగలుకు మాటను పొంగిపొర్లిస్తుంది[a]; రాత్రి రాత్రికి జ్ఞానాన్ని తెలియజేస్తుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మాటను ఉచ్చరిస్తుంది”; హెబ్రీ క్రియ కేవలం మాట్లాడడాన్ని కాకుండా, సమృద్ధిగా పొంగి బయటికి రావడాన్ని చిత్రిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “జ్ఞానాన్ని ప్రకటిస్తుంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: י֣וֹם ... לְיוֹם
  choice: పగలు పగలుకు
  rationale: ఒక పగటి నుండి మరొక పగటికి కొనసాగే ప్రకటన భావాన్ని, అలాగే హెబ్రీ కవితా సంక్షిప్తతను నిలుపుతుంది.
- source_word: יַבִּיעַ
  choice: పొంగిపొర్లిస్తుంది
  rationale: హిఫీల్ రూపంలోని సమృద్ధిగా ఉబికి బయటికి రావడం అనే సజీవ రూపకాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֹמֶר
  choice: మాటను
  rationale: ఇక్కడ సాధారణంగా పలికే వ్యక్తీకరణ లేదా సందేశాన్ని సూచిస్తుంది; తెలుగు కవితా సందర్భంలో ‘మాట’ సహజంగా ఉంటుంది.
- source_word: וְלַיְלָה לְּלַיְלָה
  choice: రాత్రి రాత్రికి
  rationale: మొదటి పాదంలోని ‘పగలు పగలుకు’ అనే నిర్మాణానికి సమాంతరంగా ఉండి, ఒక రాత్రి నుండి మరొక రాత్రికి కొనసాగే భావాన్ని కాపాడుతుంది.
- source_word: יְחַוֶּה
  choice: తెలియజేస్తుంది
  rationale: పియేల్ రూపం ‘తెలియజేయడం/ప్రకటించడం’ అనే అర్థాన్ని ఇస్తుంది; సందర్భంలోని ప్రకటన భావాన్ని అతిగా వ్యాఖ్యానించకుండా అందిస్తుంది.
- source_word: דָּעַת
  choice: జ్ఞానాన్ని
  rationale: మూలపదానికి నేరమైన సమానార్థం; మొదటి పాదంలోని ‘మాట’తో ఉన్న భావ సమాంతరతను నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలి. ‘పగలు పగలుకు / రాత్రి రాత్రికి’ అనే సమాంతర నిర్మాణం హెబ్రీ పద్యరూపాన్ని నిలుపుతుంది; ‘పొంగిపొర్లిస్తుంది’ మూలంలోని సజీవ రూపకాన్ని కాపాడుతుంది.
