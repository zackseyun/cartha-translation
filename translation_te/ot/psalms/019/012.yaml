id: PSA.19.12
reference: Psalms 19:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שְׁגִיא֥וֹת מִֽי יָבִ֑ין מִֽ/נִּסְתָּר֥וֹת נַקֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/012.yaml
  text: Who can discern his errors? Clear me from hidden faults[a].
translation:
  language: te
  text: 'తన పొరపాట్లను ఎవరు గ్రహించగలరు?

    దాగివున్న దోషాల నుండి నన్ను నిర్దోషిగా చేయి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రహస్య పాపాల నుండి,’ లేదా ‘దాగివున్న వాటి నుండి.’ హీబ్రూ పదం మాట్లాడుతున్న వ్యక్తికే తెలియని దోషాలను, ఇతరులకు దాచిన దోషాలను, లేదా సాధారణంగా దాగివున్న విషయాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁגִיאוֹת
  choice: పొరపాట్లు
  rationale: ఈ నామవాచకం తప్పిపోవడం వల్ల జరిగే దోషాలను లేదా పాపాలను సూచిస్తుంది. ‘పొరపాట్లు’ సహజమైన ఆధునిక తెలుగు పదం; అవి తప్పనిసరిగా ఉద్దేశపూర్వకమైనవని గానీ కేవలం అనుకోకుండా జరిగినవని గానీ అతిగా నిర్దిష్టం చేయదు.
- source_word: מִי
  choice: ఎవరు
  rationale: అలంకారిక ప్రశ్నను సహజంగా ప్రారంభించే సాధారణ ప్రశ్నార్థక సర్వనామం.
- source_word: יָבִין
  choice: గ్రహించగలరు
  rationale: ఈ క్రియ అర్థం చేసుకోవడం లేదా వివేచించడం అనే భావాన్ని ఇస్తుంది. తన దోషాలన్నిటినీ పూర్తిగా గుర్తించడంలో మానవుని అసమర్థతను ‘గ్రహించగలరు’ తెలియజేస్తుంది.
- source_word: מִנִּסְתָּרוֹת
  choice: దాగివున్న దోషాల నుండి
  rationale: సתר ధాతువునుండి వచ్చిన రూపం ‘దాగినవి’ లేదా ‘రహస్యమైనవి’ అని అర్థమివ్వగలదు. మొదటి పాదంలోని ‘పొరపాట్లు’తో ఉన్న సమాంతరత వల్ల ఇక్కడ నైతిక దోషాలే ప్రధాన భావం; అయితే అవి తనకే తెలియనివా, ఇతరులకు దాచినవా అనే సందిగ్ధతను ఈ అనువాదం నిలుపుతుంది.
- source_word: נַקֵּנִי
  choice: నన్ను నిర్దోషిగా చేయి
  rationale: పియేల్ ఆజ్ఞార్థక రూపమైన ఈ క్రియ నిర్దోషిగా ఎంచడం, దోషవిముక్తుణ్ణి చేయడం లేదా శుద్ధి చేయడం అనే భావాలను కలిగి ఉంటుంది. ‘నిర్దోషిగా చేయి’ న్యాయపరమైన దోషవిముక్తి భావాన్ని స్పష్టంగా ఇస్తూనే సందర్భానికి సహజంగా సరిపోతుంది.
theological_decisions:
- issue: దాగివున్న వాటి స్వభావం
  choice: సందర్భంలోని సమాంతరతను అనుసరించి వాటిని దాగివున్న దోషాలుగా అనువదించడం
  alternative: రహస్య పాపాలు; దాగిన విషయాలు
  rationale: ‘పొరపాట్లు’ అనే మొదటి పాదంతో సమాంతరత నైతిక దోషాలనే బలంగా సూచిస్తుంది. అయినప్పటికీ అవి కీర్తనకర్తకు తెలియకుండా దాగివున్నవా, ఇతరులనుండి రహస్యంగా ఉంచినవా అనే విషయాన్ని మూలపాఠం నిర్ణయించదు; పాదసూచిక ఆ విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక శైలి. అలంకారిక ప్రశ్నను నిలిపి, హీబ్రూ పదబంధంలోని నైతిక భావాన్నీ దాని నిజమైన సందిగ్ధతనూ పాదసూచిక ద్వారా సంరక్షించాం.
