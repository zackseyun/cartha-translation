  yaml_path: translation/ot/psalms/019/004.yaml
  text: Their line has gone out through all the earth[a], and their words to the end of the world. In them he has set a tent for the sun[b],
translation:
  language: te
  text: వాటి కొలతరేఖ భూమి అంతటా విస్తరించింది[a]; వాటి మాటలు లోకపు అంచుల వరకు చేరాయి. వాటిలో సూర్యుని కోసం ఆయన ఒక గుడారం వేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటి స్వరం/ధ్వని భూమి అంతటా వ్యాపించింది.” మసొరెటిక్ హీబ్రూ పాఠంలో “వాటి కొలతరేఖ” అని ఉంది; అయితే కొన్ని ప్రాచీన అనువాదాలు, అనేకమంది వ్యాఖ్యాతలు ఈ కవితా సందర్భంలో దాన్ని “స్వరం” లేదా “ధ్వని” అనే భావంలో అర్థం చేసుకున్నారు.
    reason: alternative_reading
  - marker: b
    text: “వాటిలో” అనేది బహుశా ముందరి వచనంలో పేర్కొన్న ఆకాశాలను సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: קַוָּם
  choice: వాటి కొలతదారం
  rationale: మసొరెటిక్ హీబ్రూ పాఠంలోని קַו (‘కొలతదారం/రేఖ’) అనే స్పష్టమైన పదాన్ని ప్రధాన పాఠంలో నిలుపుతూ, సందర్భానుకూలమైన ‘స్వరం/ధ్వని’ అర్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: יָצָא
  choice: వ్యాపించింది
  rationale: అక్షరార్థంగా ‘బయలుదేరింది’; ఇక్కడ భూమి అంతటికి దాని పరిధి చేరడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִלֵּיהֶם
  choice: వాటి మాటలు
  rationale: ‘మాటలు/పలుకులు’ అనే అర్థాన్ని సరళంగా, ముందరి కవితా పాదానికి సమాంతరంగా అందిస్తుంది.
- source_word: תֵבֵל
  choice: లోకం
  rationale: నివాసిత ప్రపంచాన్ని సూచించే హీబ్రూ పదానికి సహజమైన తెలుగు సమానం.
- source_word: שָׂם
  choice: వేశాడు
  rationale: గుడారాన్ని ‘వేయడం’ అనేది తెలుగులో సహజమైన ప్రయోగం; దేవుడు దానిని ఏర్పాటు చేసిన చర్యను తెలియజేస్తుంది.
- source_word: אֹהֶל
  choice: గుడారం
  rationale: సాధారణ ‘డేరా/గుడారం’ అనే అర్థాన్ని ఇస్తుంది; అవసరం లేని ఆరాధనా సంబంధిత భావాన్ని చేర్చదు.
- source_word: בָּהֶם
  choice: వాటిలో
  rationale: హీబ్రూలోని బహువచన సర్వనామాన్ని యథాతథంగా ఉంచి, దాని పూర్వపదం ఏమిటో ప్రధాన పాఠంలో అతిగా నిర్ధారించదు.
- source_word: לַשֶּׁמֶשׁ
  choice: సూర్యుని కోసం
  rationale: హీబ్రూ విభక్తి సంబంధాన్ని సూటిగా, సహజంగా వ్యక్తం చేస్తుంది.
