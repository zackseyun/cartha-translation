  text: Also[a], your servant is warned by them[b]; in keeping them there is great reward.
translation:
  language: te
  text: అంతేకాదు, నీ సేవకుడు వాటివల్ల హెచ్చరిక పొందుతున్నాడు[a]; వాటిని పాటించడంలో గొప్ప ప్రతిఫలం ఉంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటి ద్వారా జాగ్రత్తపడుతున్నాడు”; హీబ్రూ క్రియకు హెచ్చరించబడటం లేదా హెచ్చరికను గ్రహించి జాగ్రత్తపడటం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
