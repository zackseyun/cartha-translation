id: PSA.19.14
reference: Psalms 19:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יִֽהְי֥וּ לְ/רָצ֨וֹן אִמְרֵי פִ֡/י וְ/הֶגְי֣וֹן לִבִּ֣/י לְ/פָנֶ֑י/ךָ יְ֝הוָ֗ה צוּרִ֥/י וְ/גֹאֲלִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/014.yaml
  text: May the words of my mouth and the meditation of my heart be acceptable before you[a], O Yahweh[b], my rock and my redeemer.
translation:
  language: te
  text: నా నోటి మాటలు, నా హృదయ ధ్యానం నీ సన్నిధిలో[a] అంగీకారయోగ్యమైనవిగా ఉండుగాక, యాహ్వే, నా శిలా, నా విమోచకుడా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ ఎదుట.’ హీబ్రూ పదబంధం అక్షరార్థంగా ‘నీ ముఖం/సన్నిధి ఎదుట’ అని చెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘విమోచకుడు’గా అనువదించిన హీబ్రూ పదం విడిపించే లేదా తిరిగి స్వాధీనం చేసుకునే వ్యక్తిని సూచిస్తుంది; ఇశ్రాయేలు ధర్మశాస్త్రంలో ఇది తరచుగా సమీప బంధువు నిర్వర్తించే బాధ్యతలతో ముడిపడి ఉంటుంది.
    reason: cultural_note
lexical_decisions:
- source_word: יִהְיוּ
  choice: ఉండుగాక
  rationale: ప్రార్థన లేదా ఆకాంక్షను తెలిపే హీబ్రూ అసంపూర్ణ క్రియారూపపు భావాన్ని సహజమైన తెలుగు విధ్యర్థక రూపంతో వ్యక్తం చేస్తుంది.
- source_word: לְרָצוֹן
  choice: అంగీకారయోగ్యంగా
  rationale: దేవుని సమక్షంలో ఆమోదం లేదా అనుగ్రహం పొందదగినదనే భావాన్ని సహజంగా తెలుపుతూ, మూలంలోని ఆరాధనా-ప్రార్థనా ఛాయను నిలుపుతుంది.
- source_word: אִמְרֵי פִי
  choice: నా నోటి మాటలు
  rationale: మాటలనే స్పష్టంగా సూచించే నిర్మాణాన్ని, దాని దృశ్యరూపకాన్ని మార్చకుండా తెలుగులో నేరుగా నిలుపుతుంది.
- source_word: הֶגְיוֹן לִבִּי
  choice: నా హృదయ ధ్యానం
  rationale: הֶגְיוֹן లోని ధ్యానం, మననం, అంతరాలోచన అనే భావవ్యాప్తిని కాపాడుతూ, పలికిన మాటలకు సమాంతరమైన అంతరంగ క్రియను తెలియజేస్తుంది.
- source_word: לְפָנֶיךָ
  choice: నీ సన్నిధిలో
  rationale: అక్షరార్థంగా ‘నీ ముఖం/సన్నిధి ఎదుట’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి సాధారణంగా అంగీకరించబడిన ఉచ్చారణను తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: צוּרִי
  choice: నా శిలా
  rationale: దేవుడు స్థిరమైన రక్షకుడనే కవితాత్మక రూపకాన్ని వివరణగా మార్చకుండా నేరుగా నిలుపుతుంది.
- source_word: וְגֹאֲלִי
  choice: నా విమోచకుడా
  rationale: గאל ధాతువులోని విడిపించడం లేదా తిరిగి స్వాధీనం చేసుకోవడం అనే ప్రధాన భావాన్ని సంక్షిప్తంగా ఇస్తుంది; బంధుత్వ బాధ్యత నేపథ్యాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
theological_decisions:
- issue: יִהְוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని వాడుతున్నందున దానిని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం.
- issue: צוּרִי అనే రూపకం
  choice: నా శిలా
  alternative: నా ఆశ్రయమా / నా రక్షకుడా
  rationale: దేవుని స్థిరత్వం, భద్రతను సూచించే మూల రూపకాన్ని వ్యాఖ్యానించి సంకుచితం చేయకుండా యథాతథంగా కాపాడాం.
- issue: גֹאֲלִי యొక్క విమోచన భావం
  choice: నా విమోచకుడా
  alternative: నా బంధు-విమోచకుడా / నన్ను విడిపించేవాడా
  rationale: ఈ కవితాత్మక సంబోధనలో బంధుత్వ పాత్రను తప్పనిసరిగా నిర్దేశించకుండా, పదంలోని విమోచన భావాన్ని నిలిపి దాని సాంస్కృతిక నేపథ్యాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన ప్రార్థనా-కవితా శైలి పాటించబడింది. ‘నా శిలా, నా విమోచకుడా’ అనే సంబోధనలు మూలంలోని సమాంతర కవితా నిర్మాణాన్ని నిలుపుతాయి.
