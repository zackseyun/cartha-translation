  yaml_path: translation/ot/psalms/019/009.yaml
  text: The fear of Yahweh is pure[a], enduring forever; the judgments of Yahweh are true[d][c][b]; they are altogether righteous.
translation:
  language: te
  text: యెహోవాపట్ల భయభక్తి శుద్ధమైనది[a]; అది ఎప్పటికీ నిలిచి ఉంటుంది[b]. యెహోవా తీర్పులు[c] సత్యమైనవి; అవన్నీ పూర్తిగా నీతియుక్తమైనవి[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిర్మలమైనది.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఎప్పటికీ నిలిచి ఉంటుంది.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘యెహోవా న్యాయనిర్ణయాలు’; ‘యెహోవా నియమాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: హీబ్రూలో, ‘అన్నీ కలిపి నీతియుక్తమైనవి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: యెహోవాపట్ల భయభక్తి
  rationale: హీబ్రూ నిర్మాణం యెహోవాను ఉద్దేశించిన భయాన్ని సూచిస్తుంది; ‘భయభక్తి’ భయాన్నీ భక్తిపూర్వక గౌరవాన్నీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: טְהוֹרָה
  choice: పవిత్రమైనది
  rationale: ఈ పదం శుద్ధతను, కల్మషరాహిత్యాన్ని సూచిస్తుంది. సందర్భంలో ‘పవిత్రమైనది’ సహజంగా ఉండి నైతిక-ఆరాధనా శుద్ధతను తెలియజేస్తుంది; ‘శుద్ధమైనది’ కూడా సాధ్యమే.
- source_word: עוֹמֶדֶת לָעַד
  choice: ఎప్పటికీ నిలిచి ఉంటుంది
  rationale: మూలంలోని ‘ఎప్పటికీ నిలుస్తుంది’ అనే రూపకాన్ని తెలుగులో సహజంగా, దాని శాశ్వతత్వ భావాన్ని కోల్పోకుండా వ్యక్తపరుస్తుంది.
- source_word: מִשְׁפְּטֵי יְהוָה
  choice: యెహోవా తీర్పులు
  rationale: מִשְׁפָּט పదంలోని న్యాయపరమైన భావాన్ని నిలుపుతుంది; సందర్భానుసారం ‘న్యాయనిర్ణయాలు’ లేదా ‘నియమాలు’ అనే అర్థాలు కూడా సాధ్యమే.
- source_word: אֱמֶת
  choice: సత్యమైనవి
  rationale: బహువచన కర్తకు విధేయ విశేషణంగా మూలంలోని ‘సత్యం/నిజం’ భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: צָדְקוּ יַחְדָּו
  choice: అవన్నీ పూర్తిగా న్యాయమైనవి
  rationale: క్రియలోని నీతియుక్తతను ‘న్యాయమైనవి’గా, יַחְדָּו లోని సమష్టి మరియు సంపూర్ణ భావాన్ని ‘అవన్నీ పూర్తిగా’గా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో అందిస్తుంది.
theological_decisions:
- issue: దేవుని ప్రత్యక్ష ప్రకటనను వర్ణించే వరుసలో ‘యెహోవాపట్ల భయం’ అనే పదబంధపు సూచన
  choice: ‘యెహోవాపట్ల భయభక్తి’ అనే హీబ్రూ భావవ్యక్తీకరణను నిలుపడం
  alternative: ‘యెహోవా ఆరాధన’ లేదా ‘యెహోవా మతం’
  rationale: ఇది దేవుని బోధను సూచించే పర్యాయప్రయోగమై ఉండవచ్చుగానీ, మూలంలోని భయం, విస్మయం, భక్తిపూర్వక గౌరవం అనే సమృద్ధమైన భావాలను వ్యాఖ్యానాత్మకంగా కుదించకుండా ఉంచడం మంచిది.
- issue: צָדְקוּ יַחְדָּו యొక్క సమష్టి భావం
  choice: తీర్పులన్నీ సమష్టిగా పూర్తిగా న్యాయమైనవని తెలపడం
  alternative: ప్రతి తీర్పు విడివిడిగా న్యాయమైనదని మాత్రమే తెలపడం
  rationale: יַחְדָּו ‘కలిసి/అన్నీ కలిపి’ అనే భావాన్ని కలిగి ఉంది; అందువల్ల వ్యక్తిగత న్యాయతతో పాటు మొత్తం సమూహపు సంపూర్ణ న్యాయతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ సమాంతర నిర్మాణం రెండు వాక్యాలుగా స్పష్టంగా నిలుపబడింది; ‘భయభక్తి’ ద్వారా భయం మరియు భక్తిపూర్వక గౌరవం రెండూ సంరక్షించబడ్డాయి.
