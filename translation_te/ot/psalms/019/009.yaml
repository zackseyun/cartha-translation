  terminology: ‘యెహోవా’ is a familiar Telugu form of the divine name and is used consistently. ‘భయభక్తి,’ ‘తీర్పులు,’ ‘సత్యమైనవి,’ and ‘నీతియుక్తమైనవి’ are suitable in this poetic and theological register. The lexical-alternative notes are adjusted to correspond to the revised wording and to the Hebrew.
