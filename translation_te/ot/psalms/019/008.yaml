source:
  edition: WLC
  text: פִּקּ֘וּדֵ֤י יְהוָ֣ה יְ֭שָׁרִים מְשַׂמְּחֵי לֵ֑ב מִצְוַ֥ת יְהוָ֥ה בָּ֝רָ֗ה מְאִירַ֥ת עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/008.yaml
  text: The precepts of Yahweh are right[a], rejoicing the heart; the commandment of Yahweh is pure, enlightening the eyes.
translation:
  language: te
  text: 'యాహ్వే ఆదేశాలు సరైనవి, హృదయాన్ని సంతోషపరుస్తాయి;

    యాహ్వే ఆజ్ఞ నిర్మలమైనది[a], కళ్లకు వెలుగునిస్తుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘స్పష్టమైనది.’ హీబ్రూ విశేషణం ప్రధానంగా నిర్మలతను సూచిస్తుంది; దాని ఫలితమైన స్పష్టత అనే భావం, ‘కళ్లకు వెలుగునిస్తుంది’ అనే సమాంతర పాదానికి సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּקּוּדֵי
  choice: ఆదేశాలు
  rationale: ఈ తోరా పదం నియమించి ఇచ్చిన నిర్దేశాలు లేదా బాధ్యతలను సూచిస్తుంది. సమీపంలోని ‘ఆజ్ఞ’తో ఉన్న పదభేదాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ‘ఆదేశాలు’ ఎంచుకున్నాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని లిప్యంతరీకరణగా ‘యాహ్వే’ అని ఇచ్చాం.
- source_word: יְשָׁרִים
  choice: సరైనవి
  rationale: ఇక్కడ ఈ విశేషణం యాహ్వే ఆదేశాల యథార్థతను, నైతిక సముచితత్వాన్ని తెలియజేస్తుంది. ‘సరైనవి’ మూలంలోని ‘నేరుగా/సరిగ్గా ఉన్నవి’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מְשַׂמְּחֵי לֵב
  choice: హృదయాన్ని సంతోషపరుస్తాయి
  rationale: కారణార్థక క్రియాభావాన్ని, ఆ ఆదేశాలు కలిగించే నిరంతర ఫలితాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לֵב
  choice: హృదయం
  rationale: హీబ్రూ భావప్రపంచంలో ఇది ఆలోచన, సంకల్పం సహా అంతరంగాన్ని సూచించగలదు; కవితాత్మక రూపకాన్ని నిలుపుతూ ‘హృదయం’ అని అనువదించాం.
- source_word: מִצְוַת
  choice: ఆజ్ఞ
  rationale: ఏకవచన రూపాన్ని నిలుపుతూ, פִּקּוּדֵי అనే పదానికి ఎంచుకున్న ‘ఆదేశాలు’ నుంచి పదభేదాన్ని కాపాడుతుంది.
- source_word: בָּרָה
  choice: నిర్మలమైనది
  rationale: ఈ విశేషణపు ప్రాథమిక భావం శుద్ధత లేదా కల్మషరాహిత్యం. తరువాతి వెలుగు రూపకాన్ని బట్టి ‘స్పష్టమైనది’ అనే భావం సాధ్యమైనప్పటికీ, దానిని పాదసూచికలో ప్రత్యామ్నాయంగా ఉంచాం.
- source_word: מְאִירַת עֵינָיִם
  choice: కళ్లకు వెలుగునిస్తుంది
  rationale: కారణార్థక భావాన్నీ, కళ్లకు వెలుగు కలిగించే మూలంలోని సజీవ రూపకాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עֵינָיִם
  choice: కళ్లు
  rationale: అవగాహన లేదా జీవచైతన్యానికి రూపకంగా ఉన్న నిర్దిష్ట శరీరాంగ చిత్రాన్ని అమూర్త పదంతో మార్చకుండా నిలుపుకున్నాం.
theological_decisions:
- issue: יְהוָה అనే దైవ నామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠం దైవ నామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించిన ఉచ్చారణకు అనుగుణంగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా గద్యాన్ని ఉపయోగించాం. హీబ్రూ సమాంతర నిర్మాణం, హృదయం–కళ్లు అనే శరీరాంగ రూపకాలు, రెండు తోరా పదాల మధ్య పదభేదం నిలుపబడ్డాయి. పాదసూచిక సూచికను అది వివరిస్తున్న ‘నిర్మలమైనది’ పదం వద్ద ఉంచాం.
