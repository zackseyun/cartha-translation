id: PSA.19.3
reference: Psalms 19:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵֽין אֹ֭מֶר וְ/אֵ֣ין דְּבָרִ֑ים בְּ֝לִ֗י נִשְׁמָ֥ע קוֹלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/003.yaml
  text: There is no speech[a], and there are no words; their voice is not heard.
translation:
  language: te
  text: మాట లేదు, పదాలు లేవు; వాటి స్వరం[a] వినబడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటి ధ్వని.” హీబ్రూ קוֹל అనే పదానికి “స్వరం” లేదా “ధ్వని” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: లేదు / లేవు
  rationale: ఇది ఉనికిని నిరాకరించే పదం. ఏకవచనమైన ‘మాట’తో ‘లేదు,’ బహువచనమైన ‘పదాలు’తో ‘లేవు’ సహజమైన ఆధునిక తెలుగు రూపాలు.
- source_word: אֹמֶר
  choice: మాట
  rationale: ఒక నిర్దిష్ట ఉక్తికన్నా పలికే వ్యక్తీకరణను సూచిస్తుంది. ‘మాట’ సాధారణ పాఠకులకు సహజంగా ఉండి, తరువాతి ‘పదాలు’తో కవితాత్మక సమాంతరతను నిలుపుతుంది.
- source_word: דְּבָרִים
  choice: పదాలు
  rationale: ఈ కవితాత్మక సందర్భంలో సంభాషణకు సంబంధించిన స్పష్టమైన అర్థమే తగినది; ‘పదాలు’ అనేది ‘మాట’తో సమాంతరంగా ఉంటుంది.
- source_word: בְּלִי
  choice: వినబడదు అనే నిరాకరణలో వ్యక్తీకరించబడింది
  rationale: తదుపరి నిష్క్రియ క్రియకు ప్రతికూల పరిస్థితిని తెలియజేస్తుంది. తెలుగులో ‘వినబడదు’ అని చెప్పడం ద్వారా భావం సహజంగా వ్యక్తమవుతుంది.
- source_word: נִשְׁמָע
  choice: వినబడదు
  rationale: שׁמע ధాతువు యొక్క నిష్క్రియ భావాన్ని నేరుగా, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: קוֹלָם
  choice: వాటి స్వరం
  rationale: קוֹל అంటే ‘స్వరం’ లేదా ‘ధ్వని.’ ‘స్వరం’ ఆకాశాల వ్యక్తీకరణాత్మక చిత్రణను నిలుపుతుంది; ‘ధ్వని’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం మూలంలోని అర్థవిస్తృతిని కాపాడుతుంది.
theological_decisions:
- issue: ఆకాశాల సాక్ష్యం మాటలులేని సమాచారమా అనే వ్యాఖ్యానం
  choice: సాధారణంగా పలికే మాట, పదాలు లేవని, వాటి స్వరం వినబడదని అనువదించబడింది.
  alternative: మాటలూ పదాలూ లేకుండానే వాటి స్వరం వ్యాపిస్తుందని ఈ పాదాన్ని అర్థం చేసుకోవచ్చు.
  rationale: హీబ్రూ వాక్యనిర్మాణం అక్షరార్థమైన మాట మరియు వినిపించే పదాల లేమిని తెలిపే పఠనానికి సహజంగా అనుకూలిస్తుంది. సృష్టి దేవుని మహిమను ప్రకటించినా, సాధారణ మానవ భాషలో ప్రకటించదనే కవితాత్మక ఉద్వేగాన్ని ఇది పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సంక్షిప్తంగా, కవితాత్మక సమాంతరతను మరియు గంభీరతను నిలుపుతూ రూపొందించబడింది.
