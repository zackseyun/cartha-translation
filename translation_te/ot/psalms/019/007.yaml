  variant: modern standard Telugu
source:
  edition: WLC
  text: תּ֘וֹרַ֤ת יְהוָ֣ה תְּ֭מִימָה מְשִׁ֣יבַת נָ֑פֶשׁ עֵד֥וּת יְהוָ֥ה נֶ֝אֱמָנָ֗ה מַחְכִּ֥ימַת פֶּֽתִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/007.yaml
  text: The law of Yahweh is perfect[a], restoring the soul; the testimony of Yahweh is trustworthy, making the simple wise.
translation:
  language: te
  text: 'యాహ్వే ధర్మశాస్త్రం పరిపూర్ణమైనది; అది ప్రాణాన్ని పునరుద్ధరిస్తుంది.[a]


    యాహ్వే సాక్ష్యం నమ్మదగినది; అది అనుభవం లేనివారిని జ్ఞానులుగా చేస్తుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రాణాన్ని పునరుజ్జీవింపజేస్తుంది.”
    reason: מְשִׁיבַת נָפֶשׁ అనే హెబ్రీ పదబంధం పునరుద్ధరణతో పాటు పునరుజ్జీవనం అనే సందర్భార్థాన్నీ అనుమతిస్తుంది.
lexical_decisions:
- source_word: תּוֹרַת
  choice: ధర్మశాస్త్రం
  rationale: תּוֹרָה ఇక్కడ యెహోవా వెల్లడించిన బోధనను, నిబంధనాపరమైన అధికారంతో కూడిన ఆదేశాన్ని సూచిస్తుంది. ‘ధర్మశాస్త్రం’ తెలుగు బైబిలు వాడుకలో సహజంగా ఉండి ఆ గంభీరతను నిలుపుతుంది; ‘ఉపదేశం’ కూడా సాధ్యమైన అర్థం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచాం.
- source_word: תְּמִימָה
  choice: పరిపూర్ణమైనది
  rationale: ఈ పదం సంపూర్ణత, లోపరాహిత్యం, సమగ్రత అనే భావాలను ఇస్తుంది. సందర్భంలో ‘పరిపూర్ణమైనది’ ఆ విస్తృత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: מְשִׁיבַת
  choice: పునరుద్ధరిస్తుంది
  rationale: שׁוב ధాతువు తిరిగి తీసుకురావడం లేదా మునుపటి స్థితికి చేర్చడం అనే మూలభావాన్ని కలిగి ఉంది. అందువల్ల ‘పునరుద్ధరిస్తుంది’ను ప్రధాన పాఠంలో ఉంచి, సందర్భానుకూలమైన ‘పునరుజ్జీవింపజేస్తుంది’ను పాదసూచికలో ఇచ్చాం.
- source_word: נָפֶשׁ
  choice: ప్రాణాన్ని
  rationale: נֶפֶשׁ జీవం, వ్యక్తి, అంతరంగ జీవితం వంటి విస్తృత అర్థాలను కలిగి ఉంది. ‘ప్రాణం’ తెలుగులో జీవితం మరియు అంతరంగ వ్యక్తిత్వం రెండింటినీ సూచించగల సహజమైన కవితాత్మక పదం.
- source_word: עֵדוּת
  choice: సాక్ష్యం
  rationale: దేవుని వెల్లడింపబడిన, ధృవీకృత సాక్ష్యాన్ని సూచించే ఈ పదానికి ‘సాక్ష్యం’ ప్రత్యక్షమైన మరియు స్థిరమైన సమానం.
- source_word: נֶאֱמָנָה
  choice: నమ్మదగినది
  rationale: ఈ పదంలోని స్థిరత్వం, విశ్వసనీయత భావాలను ఆధునిక తెలుగులో ‘నమ్మదగినది’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: מַחְכִּימַת
  choice: జ్ఞానులుగా చేస్తుంది
  rationale: హిఫీల్ రూపం జ్ఞానం కలిగించడం లేదా జ్ఞానిగా చేయడం అనే కారణార్థాన్ని సూచిస్తుంది; తెలుగు వాక్యంలో బహువచన సామాన్య వర్గానికి అనుగుణంగా ‘జ్ఞానులుగా చేస్తుంది’ సహజంగా ఉంది.
- source_word: פֶּתִי
  choice: అనుభవం లేనివారిని
  rationale: פֶּתִי నైతికంగా దుష్టుడిని తప్పనిసరిగా సూచించదు; అనుభవం లేని, సులభంగా ప్రభావితమయ్యే వ్యక్తిని సూచిస్తుంది. ‘అనుభవం లేనివారు’ ఈ భావాన్ని అపార్థం లేకుండా అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించే ప్రత్యామ్నాయ లిప్యంతరీకరణ.
- issue: מְשִׁיבַת נָפֶשׁ యొక్క భావం
  choice: ప్రాణాన్ని పునరుద్ధరిస్తుంది
  alternative: ప్రాణాన్ని పునరుజ్జీవింపజేస్తుంది
  rationale: ఈ పదబంధం తిరిగి స్థాపించడం, సేదదీర్చడం లేదా జీవం పోయడం అనే భావాలకు అవకాశం ఇస్తుంది. שׁוב ధాతువు మూలభావాన్ని ప్రధాన పాఠంలో నిలిపి, బలమైన సందర్భార్థమైన ‘పునరుజ్జీవింపజేస్తుంది’ను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా సమాంతరతను నిలిపాం. రెండు అర్ధవాక్యాల్లోనూ ‘అది’ అనే కర్తను స్పష్టంగా చేర్చి సాధారణ పాఠకుడికి ప్రవాహం సులభం చేశాం. ‘పెతి’కి సంప్రదాయ ‘సాధారణులు’ కంటే భావస్పష్టమైన ‘అనుభవం లేనివారు’ను ఎంచుకున్నాం.
