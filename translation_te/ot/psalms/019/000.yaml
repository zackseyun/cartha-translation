translation:
  language: te
  text: సంగీత నాయకునికి. దావీదు కీర్తన[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దావీదు రచించిన కీర్తన’ లేదా ‘దావీదు కోసం కీర్తన’; హెబ్రీ ప్రయోగం రచనను, సంబంధాన్ని, లేదా అంకితాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకునికి
  rationale: కీర్తనల శీర్షికల్లో ఈ పదం సంగీత ప్రదర్శనను పర్యవేక్షించే వ్యక్తిని సూచిస్తుంది. ముందున్న לַ ఉపసర్గను ‘-కి’గా అనువదించడం ఈ శీర్షిక అతనికి నిర్దేశించబడిందనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: ఇది సంగీత సంబంధమైన నిర్దిష్ట సాహిత్య ప్రక్రియను సూచించే ప్రామాణిక పదం. ‘పాట’ కంటే ‘కీర్తన’ మూలపదంలోని ప్రక్రియా భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לְדָוִד
  choice: దావీదు కీర్తన
  rationale: తెలుగులోని ఈ సంక్షిప్త శీర్షికా నిర్మాణం రచన, సంబంధం, లేదా అంకితం అనే అవకాశాల్లో ఒక్కదానికే పరిమితం చేయదు; హెబ్రీ לְ యొక్క భావ విస్తృతిని సాధ్యమైనంతవరకు నిలుపుతుంది.
theological_decisions:
- issue: శీర్షికలో לְדָוִד యొక్క భావం
  choice: దావీదు కీర్తన
  alternative: దావీదు రచించిన కీర్తన; దావీదు కోసం కీర్తన
  rationale: హెబ్రీ నిర్మాణం దావీదుతో రచయితగా, సంబంధిత వ్యక్తిగా, లేదా అంకితం పొందిన వ్యక్తిగా ఉన్న అనుబంధాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో ఒకే భావాన్ని ఖరారు చేయకుండా, ప్రత్యామ్నాయాలను పాదసూచికలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన కీర్తన శీర్షికగా రూపొందించబడింది. ‘సంగీత నాయకుడు’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, ఆరాధనా సంగీత పర్యవేక్షణ సందర్భాన్ని నిలుపుతుంది.
