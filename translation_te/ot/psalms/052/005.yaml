  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తనలోని కవితాత్మక నింద, ప్రత్యక్ష సంబోధన, ‘మింగివేసే’ అనే సజీవ రూపకం నిలిచేలా అనువదించబడింది.
