  text: మోసపు నాలుకా, కబళించే మాటలన్నిటినీ[a] నీవు ప్రేమించావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాశనం చేసే మాటలన్నిటినీ.’
    reason: בָלַע అనే పదంలోని ‘మింగివేయడం/కబళించడం’ అనే రూపకం ఇక్కడ వినాశకరమైన మాటలను సూచిస్తుంది; రూపకాత్మకమైన మరియు భావస్పష్టమైన అనువాదాలు రెండూ సాధ్యమే.
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: నీవు ప్రేమిస్తావు
  rationale: ఇది Qal perfect ద్వితీయ పురుష ఏకవచన రూపం. కవితాత్మక నిందలో స్థిరమైన ప్రవృత్తిని సూచిస్తున్నందున ఆధునిక తెలుగులో వర్తమానకాలం సహజంగా ఆ భావాన్ని అందిస్తుంది; ‘ప్రేమించావు’ కూడా వ్యాకరణపరంగా సాధ్యమే.
- source_word: כָל דִּבְרֵי
  choice: మాటలన్నిటినీ
  rationale: כָל మరియు דִּבְרֵי కలయికలోని సమగ్రతను ‘అన్నిటినీ’ వ్యక్తం చేస్తుంది; సందర్భం పలికిన మాటలకు సంబంధించినది కాబట్టి ‘మాటలు’ సహజమైన ఎంపిక.
- source_word: בָלַע
  choice: మింగివేసే
  rationale: ‘మింగడం, కబళించడం’ అనే మూలరూపకాన్ని నిలిపి, ఆ మాటల వినాశకర ప్రభావాన్ని వ్యాఖ్యానంతో మాత్రమే భర్తీ చేయకుండా వ్యక్తం చేస్తుంది.
- source_word: לְשׁוֹן מִרְמָה
  choice: మోసపు నాలుకా
  rationale: ‘మోసముగల నాలుక’ అనే భావాన్ని సహజమైన తెలుగు సంబోధనగా ఇస్తూ, నాలుక ద్వారా మాటను సూచించే హీబ్రూ రూపకాన్ని నిలుపుతుంది.
