id: PSA.52.9
reference: Psalms 52:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲנִ֤י כְּ/זַ֣יִת רַ֭עֲנָן בְּ/בֵ֣ית אֱלֹהִ֑ים בָּטַ֥חְתִּי בְ/חֶֽסֶד אֱ֝לֹהִ֗ים עוֹלָ֥ם וָ/עֶֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/009.yaml
  text: But as for me[a], I am like a flourishing olive tree in the house of God[b]; I trust in the steadfast love of God forever and ever.
translation:
  language: te
  text: అయితే నేను దేవుని మందిరంలో పచ్చగా వర్ధిల్లే ఒలీవ చెట్టులా[a] ఉన్నాను; దేవుని నిబద్ధ ప్రేమపై[b] యుగయుగాలూ నమ్మకం ఉంచుతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పచ్చని ఒలీవ చెట్టులా” లేదా “తాజాగా ఉన్న ఒలీవ చెట్టులా.” హీబ్రూ విశేషణం సజీవమైన పచ్చదనాన్ని, వర్ధిల్లే స్థితిని నొక్కి చెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: “నిబద్ధ ప్రేమ” అనే మాటకు మూలమైన హీబ్రూ పదం హెసెద్; ఇది తరచుగా దేవుని స్థిరమైన, విశ్వసనీయమైన ప్రేమను సూచిస్తుంది. “కృప,” “కనికరం,” లేదా “ఒడంబడిక ప్రేమ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: అయితే నేను
  rationale: ముందటి సందర్భంలోని దుష్టునికి భిన్నంగా కీర్తనకర్తను చూపే వ్యతిరేక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כְּזַיִת רַעֲנָן
  choice: పచ్చగా వర్ధిల్లే ఒలీవ చెట్టులా
  rationale: כְּ పోలికను సూచిస్తుంది; רַעֲנָן కేవలం రంగును కాక సజీవమైన పచ్చదనాన్ని, వృద్ధిని సూచిస్తుంది.
- source_word: בְּבֵית אֱלֹהִים
  choice: దేవుని మందిరంలో
  rationale: దేవుని నివాసస్థలం లేదా ఆరాధనా స్థలం అనే రూపకాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: בָּטַחְתִּי
  choice: నమ్మకం ఉంచాను
  rationale: హీబ్రూ సంపూర్ణ క్రియ స్థిరపడిన విశ్వాసాన్ని సూచించగలదు; భూతకాల రూపాన్ని నిలిపి, కొనసాగుతున్న ఆధారభావాన్ని తెలుపుతుంది.
- source_word: בְחֶסֶד אֱלֹהִים
  choice: దేవుని నిబద్ధ ప్రేమపై
  rationale: חֶסֶד లోని ప్రేమ, విశ్వసనీయత, నిలకడ అనే భావాలను అతిగా సిద్ధాంతీకరించకుండా సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: עוֹלָם וָעֶד
  choice: యుగయుగాలూ
  rationale: అంతంలేని కాలాన్ని బలంగా తెలిపే జత హీబ్రూ వ్యక్తీకరణకు సహజమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: ఒడంబడిక సంబంధ సందర్భంలో חֶסֶד పదానికి అనువాదం
  choice: నిబద్ధ ప్రేమ
  alternative: కృప; కనికరం; ఒడంబడిక ప్రేమ
  rationale: దేవుని ప్రేమలోని నిలకడను, విశ్వసనీయతను కాపాడుతుంది; అదే సమయంలో ఏకైక మతశాఖకు ప్రత్యేకమైన పరిభాషను రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక గౌరవాన్ని నిలిపి సాధారణ పాఠకులకు సులభంగా ఉండే పదజాలం. “మందిరం” ఆరాధనా స్థల రూపకాన్ని సహజంగా అందిస్తుంది; “నిబద్ధ ప్రేమ” חֶסֶד యొక్క ప్రేమతో కూడిన స్థిర విశ్వసనీయతను నిలుపుతుంది.
