source:
  edition: WLC
  text: גַּם אֵל֮ יִתָּצְ/ךָ֪ לָ֫/נֶ֥צַח יַחְתְּ/ךָ֣ וְ/יִסָּחֲ/ךָ֣ מֵ/אֹ֑הֶל וְ/שֵֽׁרֶשְׁ/ךָ֨ מֵ/אֶ֖רֶץ חַיִּ֣ים סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/006.yaml
  text: But God will also tear you down forever[a]; he will snatch you up and pull you from your tent, and uproot you from the land of the living[c][b]. Selah
translation:
  language: te
  text: కాని దేవుడు కూడా నిన్ను శాశ్వతంగా కూలదోస్తాడు; నిన్ను పట్టుకొని, నీ గుడారం నుండి లాగివేస్తాడు,[a] సజీవుల దేశం నుండి నీ వేరును పెకలిస్తాడు.[b] సెలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నిన్ను పట్టుకొని, నీ గుడారం నుండి లాగివేస్తాడు” అనే మాటలకు “నిన్ను పట్టుకుని తీసుకుపోతాడు” లేదా “నీ నివాసం నుండి తొలగిస్తాడు” అని కూడా అనువదించవచ్చు. “గుడారం” అక్షరార్థ పదం; ఇక్కడ నివాసాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “సజీవుల దేశం నుండి నీ వేరు”; భావం, సజీవుల దేశం నుండి నిన్ను పెకలించడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: కాని ...
  rationale: ఈ సందర్భంలో మునుపటి దుష్టుని ప్రగల్భానికి వ్యతిరేక మలుపును సూచిస్తుంది; హెబ్రీలోని చేర్పు భావం తెలుగులో సందర్భానుసారంగా సహజమైన విరుద్ధార్థక అనుసంధానంతో వ్యక్తమవుతుంది.
- source_word: אֵל
  choice: దేవుడు
  rationale: ఇక్కడ ఇశ్రాయేలు దేవుణ్ణి సూచించే సాధారణ ఏకవచన నామం.
- source_word: יִתָּצְךָ
  choice: నిన్ను ... కూలదోస్తాడు
  rationale: נתץ అనే క్రియ నిర్మాణాన్ని కూల్చివేయడం లేదా పడగొట్టడం అనే బలమైన విధ్వంస చిత్రాన్ని ఇస్తుంది.
- source_word: לָנֶצַח
  choice: శాశ్వతంగా
  rationale: తీర్పు నిలిచిపోయే శాశ్వతత్వాన్ని సహజంగా తెలియజేస్తుంది; కేవలం తీవ్రతగా పరిమితం చేయదు.
- source_word: יַחְתְּךָ
  choice: నిన్ను పట్టుకొని
  rationale: అరుదైన חתה క్రియ బలవంతంగా పట్టుకోవడం లేదా తీసుకుపోవడం అనే భావాన్ని కలిగిస్తుంది; దాని ఖచ్చిత ఛాయ అనిశ్చితమైనందున సరళమైన బలప్రయోగ భావం ఎంచుకోబడింది.
- source_word: וְיִסָּחֲךָ
  choice: పెకలిస్తాడు
  rationale: נסח తొలగించడం, లాగివేయడం, పెకలించడం అనే భావాన్ని ఇస్తుంది; గుడారం నుండి బలవంతంగా తొలగించే చిత్రాన్ని తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: מֵאֹהֶל
  choice: నీ గుడారం నుండి
  rationale: אֹהֶל యొక్క అక్షరార్థమైన ‘గుడారం’ను కాపాడుతుంది; అది నివాసానికి రూపకంగా కూడా ఉండవచ్చు.
- source_word: וְשֵׁרֶשְׁךָ
  choice: నీ వేరును పెకలిస్తాడు
  rationale: హెబ్రీలో ‘నీ వేరు’ అనే నామరూపాన్ని, ముందటి క్రియ ప్రభావం కొనసాగుతున్న కవితా నిర్మాణంగా ఉంచి మూలంలోని వేరు చిత్రాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: מֵאֶרֶץ חַיִּים
  choice: సజీవుల దేశం నుండి
  rationale: మరణానికి విరుద్ధంగా జీవించి ఉన్నవారి లోకాన్ని సూచించే స్థిరమైన హెబ్రీ నుడికారాన్ని సహజంగా అందిస్తుంది.
- source_word: סֶלָה
  choice: సెలా
  rationale: పదం యొక్క ఖచ్చిత కార్యం అనిశ్చితం కాబట్టి అనువదించి ఊహించకుండా లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: לָנֶצַח సూచించే తీర్పు స్వభావం
  choice: శాశ్వతంగా
  alternative: పూర్తిగా / ఒక్కసారిగా పూర్తయ్యేలా
  rationale: హెబ్రీ పదం సహజంగా నిరంతర స్థిరత్వాన్ని సూచిస్తుంది. తీర్పు యొక్క తీవ్రతను ఉంచుతూ, దాని అంతిమ తాత్త్విక స్వభావం గురించి వాక్యం చెప్పేదానికంటే ఎక్కువగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదజాలం. ‘గుడారం,’ ‘వేరు,’ ‘సజీవుల దేశం’ అనే మూల చిత్రాలు నిలుపబడ్డాయి; సెలా లిప్యంతరీకరించబడింది.
