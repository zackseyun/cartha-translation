  variant: modern standard Telugu
source:
  edition: WLC
  text: אוֹדְ/ךָ֣ לְ֭/עוֹלָם כִּ֣י עָשִׂ֑יתָ וַ/אֲקַוֶּ֖ה שִׁמְ/ךָ֥ כִֽי ט֝֗וֹב נֶ֣גֶד חֲסִידֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/010.yaml
  text: I will give thanks to you forever[a], because you have done it; I will wait for your name, for it is good[c][b], in the presence of your faithful ones.
translation:
  language: te
  text: 'నీకు ఎప్పటికీ కృతజ్ఞతలు చెల్లిస్తాను,

    ఎందుకంటే నీవు కార్యం చేశావు;

    నీ నామంపై ఆశ ఉంచుతాను[a],

    ఎందుకంటే అది మంచిది[b]—

    నీ విశ్వాసుల సమక్షంలో.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ నామం కోసం నేను నిరీక్షిస్తాను.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీ నామం మంచిది కాబట్టి.”
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹדְךָ
  choice: నేను నిన్ను స్తుతిస్తాను
  rationale: ידה హిఫిల్ రూపం కృతజ్ఞత చెప్పడం లేదా స్తుతించడం అనే భావాలను కలిగి ఉంది. కీర్తనాశైలికి సహజంగా ఉండి, దేవుని కార్యానికి బహిరంగ ప్రతిస్పందనను తెలిపేందుకు ‘స్తుతిస్తాను’ ఎంచుకున్నాం.
- source_word: לְעוֹלָם
  choice: ఎల్లప్పుడూ
  rationale: నిరంతరమైన, ముగింపులేని కాలవ్యాప్తిని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: כִּי עָשִׂיתָ
  choice: నీవు ఇది చేశావు కాబట్టి
  rationale: మొదటి כִּי కారణాన్ని సూచిస్తుంది. עשהకు మూలంలో ప్రత్యక్ష కర్మ లేకపోయినా, తెలుగు వాక్యానికి సహజత్వం కోసం సందర్భం సూచించే ‘ఇది’ చేర్చబడింది; అది దేవుని నిర్ణాయక కార్యాన్ని నిర్దిష్టంగా నిర్వచించదు.
- source_word: וַאֲקַוֶּה
  choice: నేను నిరీక్షిస్తాను
  rationale: קוהలో నిరీక్షణతో కూడిన ఆశ భావం ఉంది. ‘నిరీక్షిస్తాను’ మూలంలోని వేచియుండే చిత్రాన్ని నిలుపుతుంది; ‘ఆశ ఉంచుతాను’ అనే భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: שִׁמְךָ
  choice: నీ నామం కోసం
  rationale: ‘నామం’ దేవుని వెల్లడైన స్వభావం, ఖ్యాతి, సన్నిధిని సూచించే బైబిలీయ రూపకాన్ని కాపాడుతుంది. కోసం అనే నిర్మాణం హీబ్రూలోని ప్రత్యక్ష సంబంధాన్ని సాధ్యమైనంత దగ్గరగా ఉంచుతుంది.
- source_word: כִּי טוֹב
  choice: ఎందుకంటే అది మంచిది
  rationale: హీబ్రూ వాక్యం సంక్షిప్తంగా ఉండి ‘మంచిది’ దేనిని సూచిస్తుందో స్పష్టంగా విప్పదు. ‘అది’ ఆ సంక్షిప్తతను, స్వల్ప సందిగ్ధతను కాపాడుతుంది.
- source_word: נֶגֶד
  choice: సమక్షంలో
  rationale: ఇతరుల ఎదుట లేదా సన్నిధిలో జరిగే బహిరంగ స్తుతి భావాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: חֲסִידֶיךָ
  choice: నీ విశ్వాసులు
  rationale: חסיד covenant loyalty, devotion భావాలను కలిగి ఉంది. ‘విశ్వాసులు’ సాధారణ పాఠకులకు అర్థమయ్యేలా దేవునికి నమ్మకంగా ఉండే సమాజాన్ని సూచిస్తుంది; తరువాతి మతసాంకేతిక అర్థాలను అనవసరంగా దిగుమతి చేయదు.
theological_decisions:
- issue: וַאֲקַוֶּה שִׁמְךָలో నిరీక్షణ మరియు ఆశ మధ్య సంబంధం
  choice: నీ నామం కోసం నేను నిరీక్షిస్తాను
  alternative: నీ నామంపై ఆశ ఉంచుతాను
  rationale: ముఖ్య పాఠం קוה యొక్క నిరీక్షణ చిత్రాన్ని, שִׁמְךָతో ఉన్న మూల నిర్మాణాన్ని నిలుపుతుంది. అయితే ఈ నిరీక్షణ ఆశతో కూడిన నమ్మకమని ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: טוֹב యొక్క సూచ్యవిషయం
  choice: అది మంచిది
  alternative: నీ నామం మంచిది
  rationale: సమీప సూచ్యవిషయం ‘నీ నామం’ అయినప్పటికీ, హీబ్రూ దాన్ని మళ్లీ స్పష్టంగా పలకదు. ముఖ్య పాఠం ఆ సంక్షిప్తతను కాపాడుతుంది; స్పష్టీకరించిన పఠనాన్ని పాదటిప్పణిలో ఇస్తుంది.
- issue: חֲסִידֶיךָ అనే నిబంధన-సమాజ పదం
  choice: నీ విశ్వాసులు
  alternative: నీ భక్తులు
  rationale: ‘విశ్వాసులు’ దేవునిపట్ల నిబద్ధత, నమ్మకత్వం అనే భావాలను అందుబాటులో ఉంచుతుంది. ‘భక్తులు’ సహజ ప్రత్యామ్నాయం అయినప్పటికీ భక్తి ఆచరణపై ఎక్కువ దృష్టి పడవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కీర్తనాశైలిని వాడాం. పాద విభజన హీబ్రూ భావక్రమాన్ని స్పష్టంగా చూపుతుంది. ‘నామం’, ‘నిరీక్షిస్తాను’, ‘సమక్షంలో’ వంటి పదాలు బైబిలీయ గంభీరతను నిలుపుతూనే సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి.
