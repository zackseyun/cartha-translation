  to: 'నీకు ఎప్పటికీ కృతజ్ఞతలు చెల్లిస్తాను,

    ఎందుకంటే నీవు కార్యం చేశావు;

    నీ నామంపై ఆశ ఉంచుతాను[a],

    ఎందుకంటే అది మంచిది[b]—

    నీ విశ్వాసుల సమక్షంలో.'
  rationale: కోహ్ యొక్క నిరీక్షణ-ఆశ భావాన్ని ఆధునిక తెలుగులో అపార్థం లేకుండా అందించడానికి ప్రధాన పాఠాన్ని “నీ నామంపై ఆశ ఉంచుతాను”గా మార్చాం; మరింత అక్షరానువాదమైన ‘నీ నామం కోసం నేను నిరీక్షిస్తాను’ను పాదటిప్పణిలో నిలిపాం. అలాగే దేవుని కార్యాన్ని బట్టి జరిగే యదా హిఫిల్ స్పందనలో కృతజ్ఞతా భావం స్పష్టంగా ఉండేందుకు “స్తుతిస్తాను” స్థానంలో “కృతజ్ఞతలు చెల్లిస్తాను” వాడాం. טוֹב యొక్క సూచ్యవిషయంపై మూలంలోని సంక్షిప్తతను “అది మంచిది”తో కాపాడి, స్పష్టీకరించిన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
