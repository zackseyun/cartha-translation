revisions:
- from: 'నీవు ఇది చేశావు కాబట్టి,

    నేను నిన్ను ఎల్లప్పుడూ స్తుతిస్తాను;

    నీ నామం కోసం నేను నిరీక్షిస్తాను[a],

    ఎందుకంటే అది మంచిది[b]—

