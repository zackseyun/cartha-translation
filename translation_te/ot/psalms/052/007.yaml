  text: 'The righteous will see and fear[b][a], and they will laugh at him:'
translation:
  language: te
  text: నీతిమంతులు చూసి భయపడతారు[a]; అతనిని చూసి నవ్వుతారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘భయభ్రాంతులవుతారు’; హీబ్రూ పదం భయాన్ని సూచించగలదు, అయితే ఈ సందర్భంలో దేవుని తీర్పు ఎదుట కలిగే భక్తిపూర్వక భయాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతనిని ఎగతాళి చేస్తారు.’ హీబ్రూ క్రియకు ‘నవ్వు’ అని అర్థం; ఈ సందర్భంలో హేళన భావం సూచితమవుతోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִרְאוּ
  choice: చూసి
  rationale: ראה అనే క్రియకు ఉన్న ప్రత్యక్షమైన ‘చూడు’ అనే భావాన్ని నిలుపుతూ, తరువాతి క్రియతో సహజమైన తెలుగు వాక్యప్రవాహంలో కలిపింది.
- source_word: צַדִּיקִים
  choice: నీతిమంతులు
  rationale: బహువచన విశేషణం నామవాచకంగా వాడబడింది; ‘నీతిమంతులు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి నైతిక వర్గాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְיִירָאוּ
  choice: భయపడతారు
  rationale: ירא ఇక్కడ భయం, భక్తిపూర్వక విస్మయం రెండింటి మధ్య ఉన్న భావవిస్తృతిని కలిగి ఉండవచ్చు. ‘భయపడతారు’ తీర్పును చూసిన ప్రతిస్పందనను సహజంగా తెలుపుతుంది; పాదసూచిక విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: וְעָלָיו
  choice: అతన్ని చూసి
  rationale: שׂחק తో కలిసి על ఎగతాళితో కూడిన నవ్వుకు లక్ష్యాన్ని సూచిస్తుంది. తెలుగులో ‘అతన్ని చూసి నవ్వుతారు’ సహజమైన ప్రయోగం.
- source_word: יִשְׂחָקוּ
  choice: నవ్వుతారు
  rationale: שׂחק యొక్క ప్రాథమిక అర్థమైన ‘నవ్వు’ను ప్రధాన పాఠంలో ఉంచింది; సందర్భంలో ఉన్న ఎగతాళి భావాన్ని పాదసూచిక తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుని తీర్పును చూసినప్పుడు కలిగే ‘భయం’ స్వరూపం
  choice: భయపడతారు
  alternative: భక్తిభయంతో ఉంటారు / భయభ్రాంతులవుతారు
  rationale: హీబ్రూ పదం భయభ్రాంతినీ దేవుని తీర్పు ఎదుట కలిగే భక్తిపూర్వక భయాన్నీ సూచించగలదు. ప్రధాన పాఠం ఈ ఉద్రిక్తతను ఒకే అర్థానికి పరిమితం చేయకుండా ఉంచుతుంది.
- issue: తీర్పుపొందిన వ్యక్తిని చూసి నవ్వడం
  choice: నవ్వుతారు
  alternative: ఎగతాళి చేస్తారు
  rationale: హీబ్రూ క్రియ యొక్క ప్రాథమిక అర్థాన్ని ఉంచుతూ, సందర్భం సూచించే హేళనను పాదసూచికలో తెలిపింది; తద్వారా నీతిమంతుల ప్రతిస్పందనపై అవసరానికి మించిన వ్యాఖ్యానాన్ని ప్రధాన పాఠంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కవితా వాక్యనిర్మాణం. హీబ్రూ క్రియల వరుసను సహజ తెలుగులో ‘చూసి …; చూసి …’గా వ్యక్తం చేసింది. ‘దాన్ని’ అనేది ముందరి సందర్భంలోని తీర్పు లేదా పతనాన్ని సూచిస్తుంది; ‘అతన్ని’ తీర్పుపొందిన వ్యక్తిని సూచిస్తుంది.
