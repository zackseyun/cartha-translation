reference: Psalms 52:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּ/ב֤וֹא דּוֹאֵ֣ג הָ/אֲדֹמִי֮ וַ/יַּגֵּ֪ד לְ/שָׁ֫א֥וּל וַ/יֹּ֥אמֶר ל֑/וֹ בָּ֥א דָ֝וִ֗ד אֶל בֵּ֥ית אֲחִימֶֽלֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/001.yaml
  text: when Doeg the Edomite came and told Saul[a], saying to him, “David has come to the house of Ahimelech.”
translation:
  language: te
  text: ఎదోమీయుడైన దోయేగు వచ్చి సౌలుకు తెలియజేస్తూ, “దావీదు అహీమెలెకు ఇంటికి వచ్చాడు” అని అన్నప్పుడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבוֹא
  choice: వచ్చినప్పుడు
  rationale: בְּ ఉపసర్గతో కూడిన בוא క్రియావాచక రూపం కాలసూచక ఉపవాక్యాన్ని ప్రవేశపెడుతుంది; ఆధునిక తెలుగులో ‘వచ్చినప్పుడు’ సహజంగా, ఖచ్చితంగా ఉంది.
- source_word: דּוֹאֵג הָאֲדֹמִי
  choice: ఎదోమీయుడైన దోయేగు
  rationale: జాతి లేదా ప్రాంత సంబంధాన్ని తెలిపే הָאֲדֹמִי పదాన్ని ‘ఎదోమీయుడైన’గా ఇచ్చి, వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וַיַּגֵּד לְשָׁאוּל
  choice: సౌలు దగ్గరకు వచ్చి … అతనికి తెలియజేసినప్పుడు
  rationale: נגד హిఫీల్ రూపానికి ‘తెలియజేయు/నివేదించు’ భావం ఉంది. మూలంలోని לְשָׁאוּלను సహజ తెలుగు వాక్యనిర్మాణంలో సౌలు వద్దకు వచ్చి నివేదించిన భావంతో వ్యక్తం చేశాం.
- source_word: וַיֹּאמֶר לוֹ
  choice: అని అతనికి
  rationale: నివేదికలోని ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే ఈ పదబంధాన్ని తెలుగులో సహజమైన ఉద్ధరణ నిర్మాణంతో ఇచ్చాం; ‘అతనికి’ అనే మాట మూలంలోని לוֹను నిలుపుతుంది.
- source_word: בָּא
  choice: వచ్చాడు
  rationale: Qal perfect పూర్తయిన రాకను సూచిస్తుంది. తెలుగులో సాధారణ భూతకాలమైన ‘వచ్చాడు’ సందర్భానికి సహజం; హీబ్రూ perfectకు నివేదన సమయంలో కొనసాగుతున్న ప్రాసంగికత ఉండవచ్చునన్న భావాన్ని పాదటిప్పణిలో సూచించాం.
- source_word: אֶל בֵּית אֲחִימֶלֶךְ
  choice: అహీమెలెకు ఇంటికి
  rationale: אֶל בֵּית ఇక్కడ అహీమెలెకు నివాసానికి గమనాన్ని సూచిస్తుంది; ‘ఇంటికి’ సాధారణ పాఠకులకు సహజమైన స్థలార్థక అనువాదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఇది కీర్తన శీర్షికలోని కొనసాగింపు భాగం కావడంతో వాక్యం ‘వచ్చినప్పుడు’ అని ముగుస్తుంది. మూలంలో లేని వివరణాత్మక అంశాలను చేర్చలేదు; బָּא యొక్క నివేదిత భూత/వర్తమాన ప్రాసంగికత తెలుగులో సహజ భూతకాలంతో వ్యక్తమైంది.
