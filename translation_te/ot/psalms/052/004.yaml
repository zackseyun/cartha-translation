translation:
  language: te
  text: 'నీవు మంచికంటే చెడును,


    నీతిని పలకడంకంటే అబద్ధాన్ని ఎక్కువగా ప్రేమించావు.[a]


    సెలా'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సరైనది పలకడంకంటే అబద్ధాన్ని.”
    reason: צֶדֶק ఇక్కడ ‘నీతి’ అనే విస్తృత నైతిక భావంతోగానీ, సందర్భానుసారం ‘సరైనది’ అనే భావంతోగానీ అర్థమవవచ్చు.
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: ప్రేమించావు
  rationale: אהב అనే క్రియ యొక్క ఖాల్ పర్ఫెక్ట్ ద్వితీయ పురుష ఏకవచన రూపం; దుష్టుణ్ణి నేరుగా ఉద్దేశించిన కవితాత్మక నిందను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: רָּע
  choice: చెడును
  rationale: טוֹב (‘మంచి’)కు నేరుగా వ్యతిరేకంగా ఉన్న నైతిక అర్థాన్ని కాపాడుతుంది.
- source_word: מִטּוֹב
  choice: మంచికంటే
  rationale: ప్రాధాన్యం లేదా పోలికను సూచించే מן భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: שֶׁקֶר
  choice: అబద్ధాన్ని
  rationale: అసత్యం, మోసం అనే భావపరిధిని ఇక్కడ మాటకు సంబంధించిన నైతిక వ్యతిరేకతలో సహజంగా వ్యక్తపరుస్తుంది; ఏకవచన సామూహిక భావం మూలంలోని నామవాచక స్వభావాన్ని నిలుపుతుంది.
- source_word: מִדַּבֵּר
  choice: పలకడంకంటే
  rationale: మాట్లాడే క్రియతో పాటు מן సూచించే పోలికను తెలుగులో సహజమైన క్రియానామ రూపంతో అందిస్తుంది.
- source_word: צֶדֶק
  choice: నీతి
  rationale: అబద్ధానికి వ్యతిరేకంగా నిజమైన, సరైన, నైతికంగా యథార్థమైన మాటను సూచిస్తుంది; పదంలోని నైతిక-దైవశాస్త్రీయ విస్తృతిని పూర్తిగా కుదించదు.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఈ ఆరాధనా లేదా సంగీత పదం యొక్క ఖచ్చితమైన అర్థం అనిశ్చితమైనందున అనువదించకుండా లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: צֶדֶק యొక్క అనువాదం
  choice: నీతి
  alternative: సరైనది
  rationale: ఈ సందర్భంలో అబద్ధానికి వ్యతిరేకంగా యథార్థమైన మాట ప్రధాన భావమైనప్పటికీ, ‘నీతి’ మూలపదంలోని నైతిక, దైవశాస్త్రీయ విస్తృతిని నిలుపుతుంది. మరింత సాధారణమైన సందర్భార్థాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో కవితాత్మక సమాంతరతను నిలుపుతూ, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి వాడబడింది. ‘సెలా’ అనిశ్చిత సాంకేతిక పదంగా లిప్యంతరీకరించబడింది.
