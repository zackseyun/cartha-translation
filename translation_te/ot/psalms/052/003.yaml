source:
  edition: WLC
  text: הַ֭וּוֹת תַּחְשֹׁ֣ב לְשׁוֹנֶ֑/ךָ כְּ/תַ֥עַר מְ֝לֻטָּ֗שׁ עֹשֵׂ֥ה רְמִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/003.yaml
  text: You devise destruction[a]; your tongue is like a sharpened razor[c][b], working deceit.
translation:
  language: te
  text: నీవు నాశనాన్ని పన్నుతావు; నీ నాలుక పదునైన క్షౌరకత్తిలా ఉంది, మోసం చేస్తూ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మోసం చేస్తూ” అనే పదబంధం నీ నాలుకను వర్ణించవచ్చు; లేదా సంబోధించబడిన వ్యక్తిని మోసం చేసేవాడిగా వర్ణించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַוּוֹת
  choice: నాశనాన్ని
  rationale: హానికరమైన పాడుచేయడాన్ని సూచించే బహువచన నామవాచకాన్ని తెలుగు సహజ శైలిలో సమష్టి ఏకవచనంగా ఇచ్చాం.
- source_word: תַּחְשֹׁב
  choice: పన్నుతున్నావు
  rationale: ఇది కేవలం ఆలోచించడం కాక, ఉద్దేశపూర్వకంగా హానిని పథకం వేయడాన్ని సూచిస్తుంది.
- source_word: לְשׁוֹנֶךָ
  choice: నీ నాలుక
  rationale: మాటను హాని చేసే సాధనంగా చూపే శరీరరూపకాన్ని యథాతథంగా నిలిపాం.
- source_word: כְתַעַר מְלֻטָּשׁ
  choice: పదునుపెట్టిన కత్తిలా
  rationale: תַּעַר అనేది క్షౌరకత్తిని సూచించినా, ఆధునిక తెలుగులో సహజమైన కత్తి-రూపకంతో కోసే పదునును స్పష్టంగా వ్యక్తం చేశాం.
- source_word: עֹשֵׂה רְמִיָּה
  choice: మోసం చేస్తుంది
  rationale: మోసాన్ని క్రియాశీలంగా చేయడం లేదా కలిగించడం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; కర్తగా నాలుకను తీసుకున్న ప్రధాన పఠనాన్ని అనుసరిస్తుంది.
theological_decisions:
- issue: עֹשֵׂה רְמִיָּה అనే పదబంధం ఎవరిని విశేషిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘నీ నాలుక’ను కర్తగా తీసుకున్నాం.
  alternative: ఇది సంబోధించబడిన వ్యక్తిని ‘మోసం చేసేవాడా’ అని విశేషించవచ్చు.
  rationale: హీబ్రూ పురుష ఏకవచన కృదంతం నాలుకకు వ్యాకరణపరంగా సరిపోతుంది; అయినా వ్యక్తికి అన్వయించే అవకాశమూ ఉన్నందున దాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మక రూపకాన్ని నిలుపుతూ, సాధారణ పాఠకులకు స్పష్టంగా ఉండే సంక్షిప్తమైన భాషను ఉపయోగించాం.
