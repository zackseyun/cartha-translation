translation:
  language: te
  text: సంగీత నాయకునికి[a]. దావీదు[c] యొక్క మస్కీల్[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సంగీత నాయకుని కోసం.’
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: మస్కీల్. ఇది బహుశా సంగీత లేదా సాహిత్య సంబంధమైన పదం; ‘బోధనాత్మక కీర్తన’ లేదా ‘ధ్యాన గీతం’ అనే అర్థాలు సాధ్యమే.'
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘దావీదు రచించినది,’ ‘దావీదు కొరకు,’ లేదా ‘దావీదుకు సంబంధించినది.’ హీబ్రూ పదబంధం రచన, అంకితం, స్వామ్యం లేదా సంబంధాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకునికి
  rationale: కీర్తనల శీర్షికల్లో ఈ పదం సంగీత ప్రదర్శనకు నాయకత్వం వహించే వ్యక్తిని సూచిస్తుంది. ‘సంగీత నాయకునికి’ అనేది ఆ ఆరాధనా-సంగీత పాత్రను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; హీబ్రూ ఉపసర్గలోని ‘కొరకు/కు’ భావసాధ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: מַשְׂכִּיל
  choice: మస్కీల్
  rationale: కీర్తన శీర్షికల్లో ఇది బహుశా సంగీత లేదా సాహిత్య ప్రక్రియను సూచించే సాంకేతిక పదం; దాని ఖచ్చితమైన అర్థం అనిశ్చితం. అందువల్ల వివాదాస్పద అర్థాన్ని ప్రధాన పాఠ్యంలో నిర్ణయించకుండా హీబ్రూ పదాన్ని లిప్యంతరీకరించాం.
- source_word: לְדָוִד
  choice: దావీదుకు చెందిన
  rationale: హీబ్రూ לְ ఉపసర్గ రచన, అంకితం, స్వామ్యం లేదా సంబంధాన్ని సూచించగలదు. ‘దావీదుకు చెందిన’ అనే ప్రయోగం రచయిత దావీదే అని ఖచ్చితంగా నిర్ణయించకుండా సంబంధ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: లְדָוִד అనే మాట దావీదు రచయిత అని సూచిస్తుందా, లేక అంకితం/సంబంధాన్ని సూచిస్తుందా?
  choice: దావీదుకు చెందిన
  alternative: దావీదు రచించినది; దావీదు కొరకు; దావీదుకు సంబంధించినది
  rationale: మూల హీబ్రూ రచయితత్వాన్ని మాత్రమే నిస్సందేహంగా ప్రకటించదు. అందువల్ల ప్రధాన పాఠ్యం విస్తృత సంబంధ భావాన్ని ఉంచి, ఇతర సాధ్యమైన అర్థాలను పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన కీర్తన శీర్షిక శైలిని అనుసరించాం. ‘మస్కీల్’ అనే అపరిచిత సాంకేతిక పదాన్ని మూలంలోని అనిశ్చితి నిలిచేలా ఉంచి పాదటిప్పణిలో వివరించాం; ‘దావీదుకు చెందిన’ అనే ప్రయోగం రచయితత్వాన్ని అతిగా నిర్ధారించదు.
