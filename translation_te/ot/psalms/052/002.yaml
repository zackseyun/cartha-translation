id: PSA.52.2
reference: Psalms 52:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מַה תִּתְהַלֵּ֣ל בְּ֭/רָעָה הַ/גִּבּ֑וֹר חֶ֥סֶד אֵ֝֗ל כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/002.yaml
  text: Why do you boast in evil, mighty man? The steadfast love of God endures all day long.
translation:
  language: te
  text: బలవంతుడా, నీవు దుష్టత్వంలో ఎందుకు గొప్పలు చెప్పుకుంటున్నావు? దేవుని నమ్మకమైన ప్రేమ రోజంతా నిలిచి ఉంటుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּתְהַלֵּל
  choice: గొప్పలు చెప్పుకుంటున్నావు
  rationale: హిత్పయేల్ రూపంలోని తనను తాను పొగడుకోవడం లేదా అతిశయించడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּרָעָה
  choice: దుష్టత్వంలో
  rationale: בְ ఉపసర్గను ‘లో’ అనే భావంతో నిలుపుతూ, רָעָהను సాధారణ ‘చెడు’ కంటే నైతిక దుష్టత్వంగా స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַגִּבּוֹר
  choice: బలవంతుడా
  rationale: సంబోధనను నిలుపుతుంది; ఈ పదానికి వీరుడు, శక్తిమంతుడు అనే అర్థాలు సాధ్యమైనప్పటికీ, సందర్భంలోని వ్యంగ్య లేదా సవాలు చేసే ధోరణిని ముందుగానే అతిగా నిర్ధారించదు.
- source_word: חֶסֶד אֵל
  choice: దేవుని నమ్మకమైన ప్రేమ
  rationale: חֶסֶדలోని స్థిరమైన ప్రేమ, విశ్వసనీయత, నిబద్ధత భావాలను సహజంగా సంక్షిప్తీకరిస్తుంది; కేవలం ‘కృప’ అని చేసి పరిధిని పరిమితం చేయదు.
- source_word: כָּל־הַיּוֹם
  choice: రోజంతా
  rationale: అక్షరార్థమైన కాలవ్యాప్తిని సహజ తెలుగులో అందిస్తుంది; సందర్భంలో నిరంతరత్వ భావాన్నీ కలిగిస్తుంది.
theological_decisions:
- issue: חֶסֶד אֵל כָּל־הַיּוֹם అనే క్రియలేని వాక్యభాగం
  choice: దేవుని నమ్మకమైన ప్రేమ రోజంతా నిలిచి ఉంటుంది
  alternative: దేవుని నమ్మకమైన ప్రేమ రోజంతా ఉంటుంది
  rationale: హీబ్రూలో స్పష్టమైన క్రియ లేకపోయినా, తెలుగులో పూర్తి వాక్యానికి అవసరమైన క్రియను మితంగా సమకూర్చింది. ‘నిలిచి ఉంటుంది’ స్థిరత్వాన్ని తెలియజేస్తుంది; ప్రేమ ఎవరిపట్ల ఉందో లేదా అది ఎలా పనిచేస్తుందో అదనంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే సంబోధన మరియు వాక్యనిర్మాణం వాడబడింది. మూలంలోని ప్రశ్న, ప్రత్యక్ష సంబోధన, రెండు వాక్యాల మధ్య ఉన్న నైతిక-దైవిక వ్యత్యాసం నిలుపబడ్డాయి.
