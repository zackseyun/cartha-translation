id: PSA.52.8
reference: Psalms 52:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִנֵּ֤ה הַ/גֶּ֗בֶר לֹ֤א יָשִׂ֥ים אֱלֹהִ֗ים מָֽע֫וּזּ֥/וֹ וַ֭/יִּבְטַח בְּ/רֹ֣ב עָשְׁר֑/וֹ יָ֝עֹ֗ז בְּ/הַוָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/008.yaml
  text: Look[a], this is the man who did not make God his refuge[b], but trusted in the abundance of his riches and sought strength in his destruction.
translation:
  language: te
  text: '“చూడండి! దేవుణ్ణి తన ఆశ్రయంగా[a] చేసుకోకుండా,

    తన అపారమైన సంపదను నమ్ముకొని,

    తన వినాశనంలో[b] బలపడిన మనిషి ఇతడే!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కోటగా,” “బలమైన దుర్గంగా.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదానికి “పతనం,” “దుష్ట కోరిక,” లేదా “వినాశకర పన్నాగాలు” అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: చూడండి!
  rationale: ఒక వ్యక్తిని గమనించమని చూపిస్తూ, అతని పరిస్థితిని పాఠంగా ముందుంచే సూచనాత్మక ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַגֶּבֶר
  choice: మనిషి
  rationale: ఇక్కడ గֶּבֶר వ్యాకరణపరంగా పుంలింగ ఏకవచనంలో ఉండి ఒక నిర్దిష్ట వ్యక్తిని సూచిస్తుంది; దానిలోని ‘బలవంతుడు’ అనే సాధ్యమైన ఛాయను సందర్భం తప్పనిసరిగా ప్రధానార్థం చేయదు.
- source_word: לֹא יָשִׂים אֱלֹהִים מָעוּזוֹ
  choice: దేవుణ్ణి తన ఆశ్రయంగా చేసుకోకుండా
  rationale: שׂים యొక్క ‘దేనినైనా తనకు ఆధారంగా/ఆశ్రయంగా చేసుకోవడం’ అనే భావాన్ని, మָעוֹז యొక్క భద్రతనిచ్చే స్థలం లేదా బలమైన రక్షణ అనే అర్థాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: וַיִּבְטַח
  choice: నమ్ముకొని
  rationale: దేవుణ్ణి ఆశ్రయంగా చేసుకోకపోవడానికి విరుద్ధంగా సంపదపై ఆధారపడటాన్ని తెలుగులో సహజంగా అనుసంధానిస్తుంది.
- source_word: בְּרֹב עָשְׁרוֹ
  choice: తన అపారమైన సంపదను
  rationale: רֹב తెలిపే విస్తారతను, עֹשֶׁר తెలిపే ధనసంపదను కలిపి సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יָעֹז
  choice: బలపడిన
  rationale: ఈ క్రియలోని బలంగా కావడం లేదా బలాన్ని పొందడం అనే భావాన్ని, స్పష్టంగా లేని ఆత్మార్థక భావాన్ని అదనంగా చేర్చకుండా నిలుపుతుంది.
- source_word: בְּהַוָּתוֹ
  choice: తన వినాశనంలో
  rationale: הַוָּה యొక్క వినాశనం/నాశనం అనే సాధ్యమైన అర్థాన్ని ప్రధాన పాఠంలో ఉంచుతుంది; ఈ పదానికి ఉన్న ‘పతనం,’ ‘దుష్ట కోరిక,’ ‘వినాశకర పన్నాగాలు’ వంటి ఇతర సాధ్యార్థాలను పాదసూచికలో భద్రపరుస్తుంది.
theological_decisions:
- issue: הַגֶּבֶר అనే పుంలింగ ఏకవచన నామవాచకం
  choice: మనిషి
  alternative: వ్యక్తి
  rationale: మూలపాఠం వ్యాకరణపరంగా పుంలింగ ఏకవచనంలో ఒక ప్రతినిధి దుష్ట మనిషిని చూపిస్తుంది; లింగసూచనను పూర్తిగా తటస్థీకరించకుండా ‘మనిషి’ అని అనువదించడం సముచితం.
- issue: הַוָּה పదం యొక్క అర్థపరిధి
  choice: వినాశనం
  alternative: పతనం; దుష్ట కోరిక; వినాశకర పన్నాగాలు
  rationale: సంపదపై పెట్టుకున్న తప్పుడు నమ్మకం చివరికి వినాశకరమైనదనే వ్యంగ్య ఉద్వేగాన్ని ‘వినాశనం’ నిలుపుతుంది. అయితే మూలపదం అర్థపరంగా విస్తృతమైనది కనుక ఇతర అర్థాలను పాదసూచికలో చూపించాం; వాటిలో ఒకదాన్ని సిద్ధాంతపరంగా ఖరారు చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తనకు తగిన గంభీరతను నిలిపాం. కవితా పాద విభజన ద్వారా దేవునిపై ఆధారపడకపోవడం, సంపదను నమ్ముకోవడం, వినాశనంలో బలపడడం అనే మూడు భావచలనాలు స్పష్టంగా కనిపిస్తాయి. ప్రతి పాదసూచిక గుర్తును దానికి సంబంధించిన పదం వెంటనే ఉంచాం.
