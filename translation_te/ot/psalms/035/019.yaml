  text: Do not let my enemies falsely rejoice over me[b][a], nor let those who hate me without cause wink the eye.
translation:
  language: te
  text: నా శత్రువులు అబద్ధంగా నాపై సంతోషించనివ్వవద్దు[a]; కారణం లేకుండా నన్ను ద్వేషించేవారు కన్ను గీటనివ్వవద్దు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నా అబద్ధపు శత్రువులు’ లేదా ‘నా శత్రువులు మోసపూరితంగా’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదబంధం సంక్షిప్తంగా ఉండి, శత్రువుల స్వభావాన్ని గానీ వారు ప్రవర్తించే తీరును గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘కన్ను గీటడం’ ఇక్కడ హానికరమైన లేదా కుట్రపూరితమైన సంకేతం; అది ఎగతాళిని లేదా రహస్య శత్రుత్వాన్ని వ్యక్తం చేయవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: אַל ... יִשְׂמְחוּ
  choice: సంతోషించడానికి ... అనుమతించవద్దు
  rationale: నిషేధార్థక אַל మరియు అసంపూర్ణ క్రియ కలసి దేవునికి చేసిన ప్రార్థనాత్మక విన్నపాన్ని వ్యక్తం చేస్తున్నాయి; ఆధునిక తెలుగులో ఈ రూపం సహజంగా ఉంటుంది.
- source_word: לִי
  choice: నాపై
  rationale: అక్షరార్థంగా ‘నాకు/నా విషయంలో’ అయినా, శత్రువులు కీర్తనకర్త పతనాన్ని చూసి ఆనందించే ప్రతికూల సందర్భంలో ‘నాపై’ తగిన భావాన్ని ఇస్తుంది.
- source_word: אֹיְבַי שֶׁקֶר
  choice: అబద్ధంగా ... నా శత్రువులు
  rationale: సంక్షిప్తమైన హీబ్రూ నిర్మాణంలోని సందిగ్ధతను పూర్తిగా తొలగించకుండా, వారి శత్రుత్వం లేదా విజయోత్సాహం అసత్యపూరితమైనదనే ప్రధాన భావాన్ని అందిస్తుంది.
- source_word: שֹׂנְאַי חִנָּם
  choice: కారణం లేకుండా నన్ను ద్వేషించేవారు
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న ద్వేషాన్ని సూచిస్తుంది; חִנָּם ఆ ద్వేషానికి సమర్థనీయ కారణం లేదని తెలుపుతుంది.
- source_word: יִקְרְצוּ עָיִן
  choice: కన్ను గీటడానికి
  rationale: హానికరమైన ఎగతాళి లేదా రహస్య సంకేతాన్ని సూచించే హీబ్రూ దృశ్యరూపాన్ని నిలుపుతుంది; వివరణను పాదసూచికలో ఇస్తుంది.
