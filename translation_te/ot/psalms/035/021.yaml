  yaml_path: translation/ot/psalms/035/021.yaml
  text: They opened their mouths wide against me; they said[a], “Aha, aha! Our eyes have seen it!”
translation:
  language: te
  text: 'వారు నాకు విరోధంగా నోళ్లు పెద్దగా తెరిచి,

    “ఆహా, ఆహా! మా కళ్ళు చూశాయి!” అని అన్నారు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “మా కన్ను చూసింది” అని ఉంది. అక్కడ ఏకవచన “కన్ను” సామూహిక అర్థంలో వాడబడింది.
    reason: హీబ్రూ మూలంలోని ఏకవచన సామూహిక నిర్మాణాన్ని చూపిస్తూ, తెలుగులో సహజమైన బహువచన అనువాదానికి ఆధారాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: וַיַּרְחִיבוּ ... פִּיהֶם
  choice: నోళ్లు పెద్దగా తెరిచి
  rationale: హిఫీల్ రూపంలోని ‘వెడల్పు చేయడం’ అనే స్పష్టమైన చిత్రాన్ని నిలుపుతూ, నోరు తెరిచి శత్రుభావంతో ఎగతాళి చేయడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עָלַי
  choice: నాకు విరోధంగా
  rationale: ఇక్కడ עַל స్థల సంబంధాన్ని కాకుండా శత్రుత్వంతో పలకడాన్ని సూచిస్తుంది.
- source_word: פִּיהֶם
  choice: నోళ్లు
  rationale: హీబ్రూలో ఏకవచన రూపం సమూహార్థకంగా ఉన్నా, బహువచన కర్తతో తెలుగులో పంపిణీ బహువచనం సహజంగా ఉంటుంది.
- source_word: הֶאָח הֶאָח
  choice: ఆహా! ఆహా!
  rationale: దురుద్దేశపూర్వక విజయోత్సాహం లేదా ఎగతాళిని సూచించే పునరుక్త ఆశ్చర్యోక్తిని నిలుపుతుంది.
- source_word: רָאֲתָה עֵינֵינוּ
  choice: మా కన్ను చూసింది
  rationale: ‘మా కన్ను చూసింది’ అనే హీబ్రూ ఏకవచన నిర్మాణాన్ని నిలిపి, వక్తల గర్వోక్తిలోని సామూహిక భావాన్ని పాఠకుడు గ్రహించేలా చేస్తుంది; మూలంలో లేని కర్మను చేర్చలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనలోని శత్రుభావం, ఎగతాళి, పునరుక్తి మరియు మూలంలోని అసాధారణ ఏకవచన నిర్మాణాన్ని గౌరవంగా, అర్థమయ్యే రీతిలో నిలిపింది.
