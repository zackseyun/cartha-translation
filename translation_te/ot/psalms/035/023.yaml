lexical_decisions:
- source_word: הָעִירָה
  choice: మేలుకో
  rationale: עור హిఫీల్ ఆజ్ఞార్థక విన్నపం; దేవుడు క్రియాశీలంగా జోక్యం చేసుకోవాలని కోరే మేల్కొలుపు రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְהָקִיצָה
  choice: లేచి కార్యం చేయి
  rationale: మొదటి మేల్కొలుపు క్రియను బలపరిచే సమాంతర ఆజ్ఞ. తెలుగులో కేవలం పునరుక్తి కాకుండా, మేల్కొని జోక్యం చేసుకోవాలనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְמִשְׁפָּטִי
  choice: నా న్యాయం కోసం
  rationale: מִשְׁפָּט న్యాయం, తీర్పు, న్యాయనిర్ణయం లేదా న్యాయస్థాపనను సూచించగలదు. సందర్భంలోని న్యాయపరమైన విస్తృతిని కాపాడేందుకు ‘న్యాయం’ ఎంచుకోబడింది.
- source_word: אֱלֹהַי
  choice: నా దేవా
  rationale: ప్రత్యక్ష సంబోధనలోని స్వామ్యరూపాన్ని సహజమైన తెలుగు సంబోధనగా అందిస్తుంది.
- source_word: וַאדֹנָי
  choice: నా ప్రభువా
  rationale: దేవునికి ఉపయోగించిన గౌరవబిరుదు; ‘ప్రభువు’ ప్రార్థనా సందర్భానికి తగిన సాధారణ తెలుగు రూపం.
- source_word: לְרִיבִי
  choice: నా వ్యాజ్యం కోసం
  rationale: רִיב న్యాయవివాదం, వాదం లేదా కేసును సూచిస్తుంది. ‘వ్యాజ్యం’ న్యాయపరమైన ఛాయను స్పష్టంగా ఉంచుతుంది; అయితే సాధారణ పాఠకునికి ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
theological_decisions:
- issue: אֱלֹהַי וַאדֹנָי అనే జత సంబోధనలు
  choice: నా దేవా, నా ప్రభువా
  alternative: నా దేవా, నా యజమానా
  rationale: రెండు గౌరవ సంబోధనలను వేరువేరుగా నిలుపుతూ, אדניను దేవుని బిరుదుగా ‘ప్రభువు’ అని అనువదిస్తుంది; కీర్తనలో లేని ప్రత్యేక క్రైస్తవార్థాన్ని చేర్చదు.
- issue: దేవుడు ‘మేలుకోవాలి’ అనే రూపకం
  choice: రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: నాకు సహాయం చేయడానికి రా
  rationale: దైవ నిష్క్రియలా కనిపిస్తున్న పరిస్థితిలో చర్య కోరే కవితాత్మక ఉద్రిక్తతను సద్దుమణిగించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవభరితమైన ప్రత్యక్ష సంబోధన. హీబ్రూ వాక్యంలోని రెండు మేల్కొలుపు ఆజ్ఞలను సహజమైన తెలుగు సమాంతరతతో అందించింది. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో చేర్చబడింది.
