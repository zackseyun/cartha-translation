id: PSA.35.10
reference: Psalms 35:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּ֥ל עַצְמוֹתַ֨/י תֹּאמַרְנָה֮ יְהוָ֗ה מִ֥י כָ֫מ֥וֹ/ךָ מַצִּ֣יל עָ֭נִי מֵ/חָזָ֣ק מִמֶּ֑/נּוּ וְ/עָנִ֥י וְ֝/אֶבְי֗וֹן מִ/גֹּזְלֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/010.yaml
  text: All my bones will say, “O LORD, who is like you, delivering the poor from one stronger than he, and the poor and needy from the one who robs him?”
translation:
  language: te
  text: 'నా ఎముకలన్నీ ఇలా అంటాయి: “యెహోవా, నీవంటి వాడెవడు? బీదవానిని తనకంటే బలవంతుడైనవాని చేతిలోనుండి విడిపించేవాడవు; బీదవానినీ నిరుపేదనూ అతనిని దోచుకునేవాని చేతిలోనుండి విడిపించేవాడవు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עַצְמוֹתַי
  choice: నా ఎముకలన్నీ
  rationale: శరీరమంతటితో, సంపూర్ణ అస్తిత్వంతో స్తుతించడాన్ని సూచించే హీబ్రూ శరీరాంగ రూపకాన్ని యథాతథంగా నిలిపింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని తెలుగు పాఠకులకు సుపరిచితమైన నామరూపంలో అందించింది; సాధారణ బిరుదుతో భర్తీ చేయలేదు.
- source_word: עָנִי
  choice: పేదవాడు
  rationale: ఈ సందర్భంలో బలవంతుడి చేతిలో అణచివేతకు, దోపిడీకి గురయ్యే ఆర్థికంగా లేదా సామాజికంగా బలహీనుడనే ప్రధాన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶבְיוֹן
  choice: నిరుపేద
  rationale: עָנִיతో కలిసివచ్చే ఈ పదంలోని తీవ్రమైన లేమి, అవసర స్థితిని చూపుతూ రెండు హీబ్రూ పదాల మధ్య స్వల్ప భేదాన్ని నిలుపుతుంది.
- source_word: מַצִּיל
  choice: విడిపిస్తావు
  rationale: ప్రమాదకరమైన బలవంతుడు లేదా దోపిడీదారుడి ఆధీనంనుండి రక్షించి బయటకు తేవడమనే క్రియాత్మక భావాన్ని తెలియజేస్తుంది.
- source_word: מִגֹּזְלוֹ
  choice: వారిని దోచుకునేవాని చేతిలోనుండి
  rationale: గזל మూలంలోని దోచుకోవడం లేదా బలవంతంగా లాక్కోవడం అనే భావాన్ని స్పష్టంగా ఉంచుతుంది; తెలుగు వాక్యంలోని రెండు బాధిత నామాలకు అనుగుణంగా సహజమైన బహువచన సర్వనామం వాడింది.
theological_decisions:
- issue: దేవుని అసమానత్వాన్ని తెలిపే ప్రశ్న
  choice: యెహోవా, నీవంటి వాడెవడు?
  alternative: యెహోవా, నీతో సమానుడు ఎవడు?
  rationale: హీబ్రూ מִי כָמוֹךָ యొక్క ప్రత్యక్ష ప్రశ్నారూపాన్ని, దాని స్తుతి మరియు వాక్చాతుర్య బలాన్ని నిలిపింది.
- issue: עָנִי పదంలోని పేదరికం–అణచివేత భావవ్యాప్తి
  choice: పేదవాడు
  alternative: బాధితుడు / దీనుడు
  rationale: తక్షణ సందర్భంలోని దోపిడీ మరియు బలవంతుడికి ఎదురైన బలహీనత కారణంగా ‘పేదవాడు’ ప్రధానార్థంగా సరిపోతుంది; అయితే పదం కేవలం ఆర్థిక స్థితికే పరిమితమని సిద్ధాంతపరంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కీర్తనాశైలిని పాటించింది. మూలంలోని ‘నా ఎముకలన్నీ’ అనే స్పష్టమైన రూపకాన్నీ, ‘పేదవాడు’ అనే పదం రెండుసార్లు వచ్చే సమాంతర పునరుక్తినీ సాధ్యమైనంతవరకు నిలిపింది. ‘వారిని’ అనే బహువచనం తెలుగు వాక్య సహజత్వం కోసం రెండవ భాగంలోని ‘పేదవాణ్ణి, నిరుపేదను’ రెండింటినీ సూచిస్తుంది.
