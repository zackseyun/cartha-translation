source:
  edition: WLC
  text: כִּֽי חִנָּ֣ם טָֽמְנוּ לִ֭/י שַׁ֣חַת רִשְׁתָּ֑/ם חִ֝נָּ֗ם חָפְר֥וּ לְ/נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/007.yaml
  text: For without cause they hid their net's pit for me[d][c][b][a]; without cause they dug it for my life.
translation:
  language: te
  text: ఎందుకంటే, ఎటువంటి కారణం లేకుండానే వారు నన్ను గురిచేసి తమ వలకోసం గొయ్యిని దాచారు[a]; ఎటువంటి కారణం లేకుండానే నా ప్రాణానికి గొయ్యి తవ్వారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో ‘గొయ్యి’ మరియు ‘వారి వల’ అనే మాటలు సన్నిహితంగా కలిసివున్నాయి; వాటి కచ్చితమైన సంబంధం స్పష్టంగా లేదు. ‘వారి వలతో కూడిన గొయ్యిని,’ ‘వారి వల యొక్క గొయ్యిని,’ లేదా ‘వారి వల కోసం గొయ్యిని’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నా నెఫెష్‌కు/కోసం.’ ఇక్కడ హెబ్రీ నెఫెష్ అనే మాట కీర్తనకర్తను లేదా అతని ప్రాణాన్ని సూచిస్తుంది; సంకుచిత అర్థంలో ‘ఆత్మ’ను తప్పనిసరిగా సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఈ వాక్యం చుట్టుపక్కల సందర్భంలో కీర్తనకర్త విజ్ఞాపనకు కారణాన్ని తెలియజేస్తుంది.
- source_word: חִנָּם
  choice: కారణం లేకుండానే
  rationale: న్యాయమైన కారణమేమీ లేకుండా చేసిన శత్రుత్వాన్ని సూచిస్తుంది; హెబ్రీ పునరుక్తిని నిలుపుతూ రెండు భాగాల్లోనూ ఇదే పదబంధాన్ని వాడాం.
- source_word: טָמְנוּ
  choice: దాచిపెట్టారు
  rationale: ఉచ్చును కనబడకుండా దాచిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לִי
  choice: నా కోసం
  rationale: క్రియకు గురి కీర్తనకర్తేనని తెలిపే హెబ్రీ దత్తార్థక రూపాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: שַׁחַת רִשְׁתָּם
  choice: తమ వల ఉన్న గొయ్యి
  rationale: ‘గొయ్యి’కి ‘వల’కి మధ్య ఉన్న సన్నిహితమైన, కాని కచ్చితంగా నిర్ణయించలేని సంబంధాన్ని ఒక సాధ్యమైన సహజ అర్థంతో వ్యక్తం చేస్తుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో నిలిపాం.
- source_word: חָפְרוּ
  choice: గొయ్యి తవ్వారు
  rationale: క్రియ యొక్క స్పష్టమైన భౌతిక చిత్రాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; కర్మను సందర్భం నుంచి స్పష్టం చేశాం.
- source_word: לְנַפְשִׁי
  choice: నా ప్రాణాన్ని తీయడానికి
  rationale: ఇక్కడ נֶפֶשׁ కీర్తనకర్త జీవాన్ని లేదా అతనినే సూచిస్తుంది; సంకుచితమైన తరువాతి కాలపు ‘ఆత్మ’ భావాన్ని దిగుమతి చేయకుండా ప్రాణహాని ఉద్దేశాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: נֶפֶשׁ యొక్క భావం
  choice: ప్రాణం/జీవితం అనే భావంతో అనువదించడం
  alternative: నా ఆత్మ కోసం
  rationale: ఈ వేట-ఉచ్చు సందర్భంలో పదం వ్యక్తి ప్రాణాన్ని లేదా అతని జీవాన్నే సూచిస్తుంది; శరీరానికి వేరైన అమూర్త ఆత్మ అనే ప్రత్యేక సిద్ధాంతార్థం ఇక్కడ అవసరం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కవితాత్మక వచనం. మూలంలోని రెండు సార్లు వచ్చే ‘కారణం లేకుండా’ అనే నైతిక వాదనను నిలిపాం; గొయ్యి–వల సంబంధంలోని నిజమైన అస్పష్టతను ప్రధాన పాఠ్యంలో అతిగా కృత్రిమంగా చేయకుండా, పాదసూచికలో స్పష్టంగా సంరక్షించాం.
