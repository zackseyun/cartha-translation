id: PSA.35.6
reference: Psalms 35:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יְֽהִי דַרְכָּ֗/ם חֹ֥שֶׁךְ וַ/חֲלַקְלַקּ֑וֹת וּ/מַלְאַ֥ךְ יְ֝הוָ֗ה רֹדְפָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/006.yaml
  text: May their way be dark and slippery[a], with the angel of Yahweh pursuing them.
translation:
  language: te
  text: యాహ్వే దూత వారిని తరుముతుండగా, వారి దారి చీకటిగాను జారుడుగాను ఉండుగాక.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి దారి చీకటిగాను జారుడుగాను ఉండుగాక; యాహ్వే దూత వారిని తరుముతూ ఉండుగాక.” హెబ్రీ సంధానపదాన్ని సహవర్తి భావంలో కాకుండా సాధారణంగా “మరియు” అని కూడా గ్రహించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: ఉండుగాక
  rationale: ఇది శాపార్థక కోరికను వ్యక్తం చేసే జుస్సివ్ రూపం. ‘ఉండుగాక’ దాని సంకల్పార్థాన్ని గంభీరమైన, సహజమైన తెలుగు శైలిలో నిలుపుతుంది.
- source_word: דַרְכָּם
  choice: వారి దారి
  rationale: דֶּרֶךְ పదానికి ‘దారి/మార్గం’ అనే అర్థాలున్నాయి. ‘దారి’ ఇక్కడి ప్రమాదకర ప్రయాణ చిత్రాన్ని సహజంగా వ్యక్తం చేస్తూ, రూపకాలంకార భావాన్నీ నిలుపుతుంది.
- source_word: חֹשֶׁךְ
  choice: చీకటిగా
  rationale: హెబ్రీలో నామవాచకమైనా, విధేయ స్థితిని తెలుగులో సహజంగా చెప్పడానికి విశేషణార్థకంగా అనువదించబడింది.
- source_word: וַחֲלַקְלַקּוֹת
  choice: జారుడుగా
  rationale: ఈ బహువచన నామవాచకం జారే ప్రదేశాలు లేదా జారుడుతనాన్ని సూచిస్తుంది. ‘దారి’తో కలిపి ‘జారుడుగా’ అనడం ప్రమాద చిత్రాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: וּמַלְאַךְ יְהוָה
  choice: యాహ్వే దూత ... ఉండగా
  rationale: וְ అనే సంధానపదాన్ని సందర్భానుసార సహవర్తి భావంగా తీసుకుని, దూత తరుముతున్న సమయంలో వారి దారి ప్రమాదకరంగా ఉండాలనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేసింది. సాధారణ సముచ్చయార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ ఆధునిక ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: רֹדְפָם
  choice: వారిని తరుముతుండగా
  rationale: רדף అంటే వెంటపడడం లేదా తరుమడం. ‘తరుము’ శత్రుత్వంతో కూడిన చురుకైన వెంబడింపును సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; వర్తమాన కృదంత భావాన్ని ‘తరుముతుండగా’ నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో దేవుని వ్యక్తిగత నామమే ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: దూత తరుమడం ప్రధాన శాపవాక్యంతో ఉన్న సంబంధం
  choice: సహవర్తి పరిస్థితిగా—‘తరుముతుండగా’
  alternative: సాధారణ సముచ్చయంగా—‘మరియు యాహ్వే దూత వారిని తరుముతూ ఉండుగాక’
  rationale: హెబ్రీలో וְ సాధారణంగా ‘మరియు’ అని ఉండగలిగినా, ఇక్కడ కృదంతంతో కలిసి శాపవాక్యానికి తోడుగా జరిగే పరిస్థితిని సూచించగలదు. ప్రధాన పాఠం సహవర్తి భావాన్ని ఎంచుకుంది; సముచ్చయ పఠనాన్ని పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనలోని శాపార్థక గంభీరతను నిలుపుతూ ‘ఉండుగాక’ వాడబడింది. వాక్యక్రమాన్ని తెలుగులో సహజంగా ఉండేలా సహవర్తి ఉపవాక్యాన్ని ముందుంచారు. ‘చీకటిగాను జారుడుగాను’ అనే జత మూలంలోని సమాంతర ప్రమాద చిత్రాన్ని కాపాడుతుంది.
