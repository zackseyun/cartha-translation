source:
  edition: WLC
  text: וְ/הָ֘רֵ֤ק חֲנִ֣ית וּ֭/סְגֹר לִ/קְרַ֣את רֹדְפָ֑/י אֱמֹ֥ר לְ֝/נַפְשִׁ֗/י יְֽשֻׁעָתֵ֥/ךְ אָֽנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/003.yaml
  text: Draw the spear and block the way against those who pursue me[a]; say to my soul[b], “I am your salvation.”
translation:
  language: te
  text: ఈటెను బయటకు తీయి, నన్ను తరుముతున్నవారి దారిని అడ్డగించు[a]; నా ప్రాణానికి, “నీ రక్షణ నేనే” అని చెప్పు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, וּסְגֹרను ‘అడ్డగించు’ అనే క్రియగా కాక ఆయుధనామంగా తీసుకుంటే, “నన్ను తరుముతున్నవారికి ఎదురుగా ఈటెను, యుద్ధ గొడ్డలిని ఎత్తిపట్టు” అని అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘రక్షణ’కు బదులుగా “విడిపింపు” అని కూడా అనువదించవచ్చు. హెబ్రీ పదం ఒక నిర్దిష్ట అపాయం నుండి విడిపింపును, అలాగే విస్తృతార్థంలో రక్షణను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרֵק
  choice: దూసి
  rationale: హిఫీల్ ఆజ్ఞారూపం ఇక్కడ ఆయుధాన్ని బయటకు తీయడం లేదా ప్రయోగానికి సిద్ధం చేయడం అనే భావాన్ని ఇస్తుంది. ‘ఈటెను దూసి’ అనేది యుద్ధ దృశ్యానికి సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: חֲנִית
  choice: ఈటెను
  rationale: חֲנִיתకు సాధారణ తెలుగు సమానార్థకం ‘ఈటె’; కర్మవిభక్తితో ఆజ్ఞకు సహజంగా జతచేయబడింది.
- source_word: וּסְגֹר
  choice: దారిని మూసివేయి
  rationale: మూలంలో అక్షరార్థంగా ‘మూయి/అడ్డగించు.’ తరుముతున్నవారికి ఎదురుగా వారి మార్గాన్ని అడ్డుకోవడం సందర్భోచిత భావం; తెలుగులో అవసరమైన అంతర్లీన కర్మను స్పష్టం చేస్తుంది.
- source_word: לִקְרַאת
  choice: ఎదురుగా
  rationale: ‘ఎదుర్కొనడానికి/ఎదురుగా’ అనే దిశాత్మక, ప్రతిఘటన భావాలను నిలుపుతుంది.
- source_word: רֹדְפָי
  choice: నన్ను తరుముతున్నవారు
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న శత్రుత్వ చర్యను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֱמֹר
  choice: చెప్పు
  rationale: אמר ఆజ్ఞారూపానికి నేరమైన, అలంకారరహిత సమానార్థకం.
- source_word: לְנַפְשִׁי
  choice: నా ప్రాణంతో
  rationale: נֶפֶשׁకు ప్రాణం, జీవితం, అంతరంగ స్వరూపం అనే భావవిస్తృతి ఉంది. ‘నా ప్రాణంతో’ కేవలం ‘నాతో’ అని సరళీకరించకుండా కవితాత్మక వ్యక్తిగత బలాన్ని నిలుపుతుంది.
- source_word: יְשֻׁעָתֵךְ
  choice: నీ రక్షణను
  rationale: ఇక్కడ దేవుడు సంబోధిస్తున్న ‘ప్రాణం’ వ్యాకరణపరంగా స్త్రీలింగంగా ఉండటంతో హెబ్రీయులో రెండవ పురుష ఏకవచన స్త్రీలింగ ప్రత్యయం ఉంది. ‘రక్షణ’ తక్షణ అపాయం నుండి విడిపింపును, విస్తృతమైన రక్షణ భావాన్ని రెండింటినీ మోయగలదు.
- source_word: אָֽנִי
  choice: నేనే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగు ‘నేనే’ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: సైనిక అపాయం నుండి రక్షణకోసం చేసే ప్రార్థనలో יְשׁוּעָה అనువాదం
  choice: రక్షణ
  alternative: విడుదల
  rationale: సందర్భం తక్షణ శత్రు అపాయం నుండి విడిపింపును సూచించినా, హెబ్రీ పదానికి అంతకంటే విస్తృతమైన రక్షణ భావం కూడా ఉంది. ‘రక్షణ’ ఈ రెండు స్థాయిలను నిలుపుతూ, తరువాతి సిద్ధాంతార్థాన్ని బలవంతంగా చేర్చదు.
- issue: וּסְגֹרను క్రియగా లేదా ఆయుధనామంగా గ్రహించడం
  choice: ‘దారిని మూసివేయి’ అనే క్రియార్థం
  alternative: యుద్ధ గొడ్డలి వంటి ఆయుధనామం
  rationale: మసొరెటిక్ స్వరచిహ్నాలతో ఉన్న పాఠం సాధారణంగా ‘మూయి/అడ్డగించు’ అనే క్రియగా అర్థమవుతుంది. అయితే ఆయుధనామంగా చదివే పురాతనంగా తెలిసిన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో కవితాత్మక గౌరవాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ‘నా ప్రాణంతో’ మూలంలోని נֶפֶשׁ రూపకాన్ని నిలుపుతుంది; ‘నేనే’ אָֽנִי యొక్క ఉద్ఘాటనను ప్రతిబింబిస్తుంది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
