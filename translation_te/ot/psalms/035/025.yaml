  text: אַל יֹאמְר֣וּ בְ֭/לִבָּ/ם הֶאָ֣ח נַפְשֵׁ֑/נוּ אַל יֹ֝אמְר֗וּ בִּֽלַּעֲנֽוּ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/025.yaml
  text: Let them not say in their heart[a], “Aha, our desire!” Let them not say, “We have swallowed him up.”
translation:
  language: te
  text: 'వారు తమ హృదయాల్లో, “ఆహా! మన కోరిక తీరింది!” అని చెప్పుకోనివ్వకు;

    “మేము అతణ్ణి మింగేశాం” అని వారు చెప్పనివ్వకు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל יֹאמְרוּ
  choice: అనుకోనివ్వకు / అననివ్వకు
  rationale: אַל తో కూడిన క్రియ ఇక్కడ దేవునికి చేసే ప్రతికూల విన్నపాన్ని వ్యక్తపరుస్తుంది. మొదటి వాక్యంలో ‘హృదయాల్లో’ అనే సందర్భం వల్ల ‘అనుకోనివ్వకు,’ రెండవ వాక్యంలో ప్రత్యక్ష ప్రగల్భం వల్ల ‘అననివ్వకు’ సహజమైన తెలుగు.
- source_word: בְלִבָּם
  choice: తమ హృదయాల్లో
  rationale: హీబ్రూలో రూపం ఏకవచనంగా ఉన్నా బహువచన కర్తకు సామూహిక అంతరంగ ఆలోచనను సూచిస్తుంది; తెలుగులో ‘తమ హృదయాల్లో’ సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: הֶאָח
  choice: ఆహా!
  rationale: శత్రువుల దురుద్దేశపూర్వక విజయోత్సాహాన్ని తెలిపే ఆశ్చర్యోద్గారం; ‘ఆహా!’ దాని సంక్షిప్త, ఎగతాళితో కూడిన ఉత్సాహాన్ని నిలుపుతుంది.
- source_word: נַפְשֵׁנוּ
  choice: మన కోరిక
  rationale: נֶפֶשׁ ప్రాథమికంగా ప్రాణం/వ్యక్తి అని అర్థమిచ్చినా, ఇక్కడ అంతరంగ వాంఛ లేదా దాని తృప్తిని సూచించే అవకాశం ఎక్కువ. ‘మన కోరిక’ సందర్భానికి స్పష్టంగా ఉండగా, ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఉంచాం.
- source_word: בִּלַּעֲנוּהוּ
  choice: మేము అతణ్ణి మింగేశాం
  rationale: בלע అనే క్రియలోని ‘మింగివేయడం’ అనే సజీవ రూపకాన్ని నిలుపుతూ, శత్రువును పూర్తిగా నాశనం చేశామని వారు చెప్పుకునే ప్రగల్భాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనా గాంభీర్యాన్ని కాపాడుతూ సాధారణ పాఠకులకు సహజంగా ఉండే రూపం. మొదటి ‘చెప్పడం’ అంతరంగంలో జరిగేదని సందర్భానుసారంగా ‘అనుకోవడం’గా వ్యక్తపరచబడింది; రెండవ దఫా ప్రత్యక్ష ప్రగల్భానికి ‘అనడం’ ఉంచబడింది.
