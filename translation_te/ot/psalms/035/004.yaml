review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the hostile-life idiom, the imprecatory force of the Hebrew imperfects, the reversal in 'turn back,' and the two groups of enemies. However, 'అపకీర్తి పొందాలి' normally denotes acquiring a bad reputation/infamy, whereas וְיַחְפְּרוּ here denotes being ashamed, abashed, or disgraced. A closer shame/abasement expression is warranted.
  naturalness: The Telugu is modern and generally fluent. 'నా ప్రాణం తీయాలని ప్రయత్నించేవారు' is slightly more idiomatic and direct than 'నా ప్రాణం తీయాలని వెదకేవారు' while retaining the established hostile idiom. The revised parallel clauses remain suitably solemn for a psalmic prayer.
  terminology: No theological terminology issue arises. The revision retains distinct but overlapping Telugu shame terms for בוש/כלם/חפר without introducing the different concept of lasting infamy.
  issues:
  - severity: medium
    issue: ‘అపకీర్తి పొందాలి’ for וְיַחְפְּרוּ
    rationale: ‘అపకీర్తి’ primarily means ill repute or notoriety. In this context חפר belongs to the immediate semantic sequence of shame, humiliation, and abasement; ‘సిగ్గుపడాలి’ accurately conveys that result.
  - severity: low
    issue: ‘వెదకేవారు’ in the life-seeking idiom
    rationale: It is intelligible, but ‘ప్రయత్నించేవారు’ naturally expresses hostile pursuit of the psalmist’s life in modern Telugu and avoids an awkward literal association with searching for an object.
  revised_text: నా ప్రాణం తీయాలని ప్రయత్నించేవారు సిగ్గుపడి అవమానానికి గురవాలి; నాకు కీడు చేయాలని పన్నేవారు వెనుదిరిగి సిగ్గుపడాలి.
  revised_footnotes: []
  revision_rationale: The text preserves the Hebrew prayer/wish force through ‘-వాలి,’ keeps the parallel enemy descriptions and reversal, and replaces ‘అపకీర్తి’ with a direct shame term that better represents חפר. ‘కీడు చేయాలని పన్నేవారు’ naturally renders those who devise harm against the psalmist.
