revisions:
- from: నా ప్రాణం తీయాలని వెదకేవారు సిగ్గుపడి అవమానానికి గురికావాలి; నాకు హాని తలపెట్టేవారు వెనుదిరిగి అపకీర్తి పొందాలి.
  to: నా ప్రాణం తీయాలని ప్రయత్నించేవారు సిగ్గుపడి అవమానానికి గురవాలి; నాకు కీడు చేయాలని పన్నేవారు వెనుదిరిగి సిగ్గుపడాలి.
  rationale: The text preserves the Hebrew prayer/wish force through ‘-వాలి,’ keeps the parallel enemy descriptions and reversal, and replaces ‘అపకీర్తి’ with a direct shame term that better represents חפר. ‘కీడు చేయాలని పన్నేవారు’ naturally renders those who devise harm against the psalmist.
  reviewer_model: gpt-5.6-terra
