id: PSA.35.4
reference: Psalms 35:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יֵבֹ֣שׁוּ וְ/יִכָּלְמוּ֮ מְבַקְשֵׁ֪י נַ֫פְשִׁ֥/י יִסֹּ֣גוּ אָח֣וֹר וְ/יַחְפְּר֑וּ חֹ֝שְׁבֵ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/004.yaml
  text: Let those who seek my life be put to shame and humiliated[b][a]; let those who devise my harm turn back and be disgraced.
translation:
  language: te
  text: నా ప్రాణం తీయాలని ప్రయత్నించేవారు సిగ్గుపడి అవమానానికి గురవాలి; నాకు కీడు చేయాలని పన్నేవారు వెనుదిరిగి సిగ్గుపడాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: సిగ్గుపడాలి
  rationale: కాల్ రూపంలోని בוש సిగ్గు అనుభవించడం లేదా సిగ్గుపాలు కావడం అనే భావాన్ని ఇస్తుంది. ప్రార్థనా సందర్భంలోని ఆకాంక్షార్థక బలాన్ని తెలుగులో ‘సిగ్గుపడాలి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְיִכָּלְמוּ
  choice: అవమానానికి గురికావాలి
  rationale: నిఫాల్ రూపంలోని כלם అవమానం, పరాభవం అనే ఫలితార్థాన్ని ఇస్తుంది. మొదటి సిగ్గు పదంతో సమాంతరతను నిలుపుతూ దాని తీవ్రతను వేరుగా తెలియజేస్తుంది.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: నా ప్రాణం తీయాలని వెదకేవారు
  rationale: వైరభావ సందర్భంలో נפשׁను ‘వెదకడం’ అనే ప్రయోగం ఒకరి ప్రాణాన్ని తీయాలని ప్రయత్నించడాన్ని సూచిస్తుంది. ‘నా ప్రాణాన్ని వెదకేవారు’ అనే అక్షరార్థపు అసహజతను నివారిస్తూ ఉద్దేశాన్ని స్పష్టం చేస్తుంది.
- source_word: יִסֹּגוּ אָחוֹר
  choice: వెనుదిరగాలి
  rationale: סוג + אָחוֹר వెనక్కి తగ్గడం లేదా పరాజయంతో తిరిగిపోవడం అనే భావాన్ని ఇస్తుంది. ‘వెనుదిరగాలి’ సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: וְיַחְפְּרוּ
  choice: అపకీర్తి పొందాలి
  rationale: ఇక్కడ חפר తవ్వడం అనే అక్షరార్థంలో కాక సిగ్గు లేదా పరాభవం పొందడం అనే అర్థంలో ఉంది. ముందు ఉన్న రెండు సిగ్గు పదాలతో పదభేదాన్ని కాపాడేందుకు ‘అపకీర్తి పొందాలి’ ఎంచుకోబడింది.
- source_word: חֹשְׁבֵי רָעָתִי
  choice: నాకు హాని తలపెట్టేవారు
  rationale: חשב యోచించడం లేదా పన్నడం; רָעָתִי కీర్తనకర్తకు ఉద్దేశించిన కీడు లేదా హానిని సూచిస్తుంది. ‘నాకు హాని తలపెట్టేవారు’ ఈ శత్రుత్వ ఉద్దేశాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: శాపార్థక/ఆకాంక్షార్థక అసంపూర్ణ క్రియల బలం
  choice: క్రియలను ‘...పడాలి/గురికావాలి/వెనుదిరగాలి’ అనే ప్రార్థనాత్మక ఆకాంక్షగా అనువదించడం
  alternative: ‘వారు సిగ్గుపడతారు...’ అనే సూచనాత్మక భవిష్యద్వాక్యంగా అనువదించడం
  rationale: హీబ్రూ అసంపూర్ణ క్రియారూపాలు ఒంటరిగా చూస్తే రెండూ సాధ్యమైనప్పటికీ, దేవునికి చేసే ఈ విజ్ఞాపన సందర్భంలో అవి తీర్పు కోసం కీర్తనకర్త వ్యక్తం చేసే ఆకాంక్షలుగా సహజంగా పనిచేస్తాయి. తెలుగు విధ్యర్థక రూపం ఆ ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే కీర్తనలోని గంభీరమైన ప్రార్థనా స్వరాన్ని నిలుపుతూ అనువదించబడింది. మూలంలోని మూడు పరాభవ పదాలకు ‘సిగ్గు’, ‘అవమానం’, ‘అపకీర్తి’ అనే స్వల్ప భేదాలున్న పదాలు ఉపయోగించబడ్డాయి.
