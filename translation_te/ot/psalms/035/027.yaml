  text: יָרֹ֣נּוּ וְ/יִשְׂמְחוּ֮ חֲפֵצֵ֪י צִ֫דְקִ֥/י וְ/יֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל יְהוָ֑ה הֶ֝/חָפֵ֗ץ שְׁל֣וֹם עַבְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/027.yaml
  text: Let those who delight in my vindication shout for joy and be glad[a]; let them say continually, “May Yahweh be magnified[b], who delights in the peace of his servant.”
translation:
  language: te
  text: నాకు న్యాయం జరగడాన్ని ఇష్టపడేవారు ఆనందంగా హర్షధ్వానాలు చేసి సంతోషించాలి[a]; తన సేవకుని క్షేమంలో ఆనందించే యెహోవా మహిమపరచబడును గాక అని వారు ఎల్లప్పుడూ అనాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా నీతిని ఇష్టపడేవారు” లేదా “నా న్యాయాన్ని ఇష్టపడేవారు.” హెబ్రీ పదం నైతిక నీతిని లేదా న్యాయపరంగా నిర్దోషిగా తేలడాన్ని సూచించగలదు; ఇక్కడ కీర్తనకర్తకు న్యాయం జరగడం అనే భావమే ఎక్కువగా కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “క్షేమం” అనే పదాన్ని “శాంతి,” “సౌఖ్యం” లేదా “సమృద్ధి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרֹנּוּ
  choice: ఆనందంతో కేకలు వేస్తూ
  rationale: רנן ఉల్లాసభరితమైన బహిరంగ ఆనందధ్వనిని సూచిస్తుంది; ఆధునిక తెలుగులో ఈ భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְיִשְׂמְחוּ
  choice: సంతోషించాలి
  rationale: שמח యొక్క ‘సంతోషించు/ఆనందించు’ భావాన్ని మొదటి క్రియతో సమాంతరంగా నిలుపుతుంది.
- source_word: חֲפֵצֵי צִדְקִי
  choice: నాకు న్యాయం జరగాలని కోరుకునేవారు
  rationale: కీర్తనలోని న్యాయవివాద సందర్భంలో צִדְקִי కీర్తనకర్త నిర్దోషిగా తేలి న్యాయం పొందడాన్ని సూచించే అవకాశం ఎక్కువ; חפץ లోని ఇష్టపడటం/కోరుకోవటం భావాన్ని కూడా కాపాడుతుంది.
- source_word: וְיֹאמְרוּ תָמִיד
  choice: వారు ఎల్లప్పుడూ అనాలి
  rationale: కొనసాగుతున్న ఆకాంక్షాత్మక ఆజ్ఞాభావాన్ని, תָמִיד యొక్క నిరంతరతను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: יִגְדַּל יְהוָה
  choice: యెహోవా గొప్పవాడని కొనియాడబడాలి
  rationale: גדל యొక్క జుస్సివ్ స్తుతి సూత్రాన్ని కేవలం ‘యెహోవా గొప్పవాడు’ అనే సూచనార్థక వాక్యంగా మార్చకుండా, ఆయన గొప్పతనం ప్రకటింపబడాలనే ఆకాంక్షగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: הֶחָפֵץ
  choice: కోరుకునే
  rationale: חפץ యొక్క ఇష్టపడటం/ఆనందించటం భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; సందర్భంలో సేవకుని క్షేమం దేవునికి ప్రీతికరమనే భావం ఉంటుంది.
- source_word: שְׁלוֹם
  choice: క్షేమం
  rationale: ఇక్కడ שָׁלוֹם కేవలం ఘర్షణలేని శాంతికన్నా సేవకుని సమగ్ర మేలు, భద్రత, సౌఖ్యాన్ని సూచించగలదు; ‘క్షేమం’ ఆ విస్తృతిని బాగా అందిస్తుంది.
- source_word: עַבְדּוֹ
  choice: తన సేవకుని
  rationale: కీర్తనకర్త దేవునితో కలిగిన సంబంధాన్ని తెలుగులో గౌరవప్రదంగా, సందర్భోచితంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: צִדְקִי పదబంధం యొక్క భావం
  choice: నాకు న్యాయం జరగాలని
  alternative: నా నీతిని / నా న్యాయాన్ని
  rationale: అపవాదులు, విరోధుల నేపథ్యంలో ఇది కీర్తనకర్తకు అనుకూలమైన న్యాయతీర్పు లేదా నిర్దోష నిరూపణను ప్రధానంగా సూచిస్తుంది. అయితే హెబ్రీ పదానికి నైతిక నీతి, న్యాయం అనే విస్తృత భావాలు కూడా ఉండటంతో వాటిని పాదటీపులో ఉంచాం.
- issue: יִגְדַּל అనే జుస్సివ్ స్తుతి ప్రకటన
  choice: గొప్పవాడని కొనియాడబడాలి
  alternative: గొప్పవాడు యెహోవా / యెహోవా మహోన్నతుడు కావాలి
  rationale: దేవుడు స్వభావతః మరింత గొప్పవాడవుతాడనే భావం రాకుండా, ఆయన గొప్పతనం ప్రకటించబడి స్తుతింపబడాలనే హెబ్రీ ఆకాంక్షను నిలుపుతుంది.
- issue: שְׁלוֹם యొక్క విస్తృత భావం
  choice: క్షేమం
  alternative: శాంతి / సమృద్ధి
  rationale: సేవకుని సంపూర్ణ మేలు, సురక్షిత స్థితి, శాంతి అనే విస్తృత అర్థాన్ని ‘క్షేమం’ సహజంగా కలిగి ఉంది; ఇతర సాధ్యార్థాలు పాదటీపులో ఇవ్వబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కీర్తనా శైలిని ఉపయోగించాం. హెబ్రీ సమాంతర నిర్మాణాన్ని నిలుపుతూ అతిగా పాతకాలపు పదజాలాన్ని నివారించాం. రెండు పాదటీపు సూచికలూ సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
