id: PSA.35.17
reference: Psalms 35:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֲדֹנָ/י֮ כַּ/מָּ֪ה תִּ֫רְאֶ֥ה הָשִׁ֣יבָ/ה נַ֭פְשִׁ/י מִ/שֹּׁאֵי/הֶ֑ם מִ֝/כְּפִירִ֗ים יְחִידָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/017.yaml
  text: Lord, how long will you look on? Restore my life from their ravages, my only one from the young lions.
translation:
  language: te
  text: ప్రభువా, ఇంకా ఎంతకాలం చూస్తూ ఉంటావు? వారి దాడుల నుంచి నా ప్రాణాన్ని, యువ సింహాల నుంచి నా ఏకైకమైన ప్రాణాన్ని రక్షించి తీసుకురా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי
  choice: ప్రభువా
  rationale: దైవ సంబోధనను సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు రూపంలో అందిస్తుంది.
- source_word: כַּמָּה תִרְאֶה
  choice: ఎంతకాలం చూస్తూ ఉంటావు?
  rationale: అక్షరార్థంగా ‘ఎంతవరకు/ఎంతకాలం చూస్తావు?’; దేవుడు జోక్యం చేయకుండా చూస్తున్నాడనే విలాప స్వరాన్ని నిలుపుతుంది.
- source_word: הָשִׁיבָה נַפְשִׁי
  choice: నా ప్రాణాన్ని ... తిరిగి రప్పించు
  rationale: נפשׁ ఇక్కడ ప్రమాదంలో ఉన్న వ్యక్తి/జీవప్రాణాన్ని సూచిస్తుంది; ‘ఆత్మ’ కంటే ‘ప్రాణం’ సందర్భానుకూలం. השיב యొక్క తిరిగి పొందే/రక్షించి చేర్చే భావాన్ని ‘తిరిగి రప్పించు’ నిలుపుతుంది.
- source_word: מִשֹּׁאֵיהֶם
  choice: వారి విధ్వంసాల నుంచి
  rationale: అరుదైన שׁאה రూపం నాశనం, విధ్వంసం లేదా పాడుచేయడాన్ని సూచిస్తుంది; మూలంలోని కొంత అస్పష్టతను అతిగా నిర్దిష్టం చేయకుండా ఉంచుతుంది.
- source_word: מִכְּפִירִים
  choice: కొదమ సింహాల నుంచి
  rationale: כפירים అంటే బలమైన యువ సింహాలు; తెలుగు బైబిలు శైలిలో అర్థమయ్యే ‘కొదమ సింహాలు’ను ఎంచుకుంది.
- source_word: יְחִידָתִי
  choice: నా ఏకైక ప్రాణాన్ని
  rationale: ‘నా ఏకైకది/అమూల్యమైనది’ అనే భావం కలిగిన స్త్రీలింగ రూపం; సమాంతరంగా ఉన్న נפשיని తిరిగి సూచిస్తూ ప్రాణం యొక్క ఏకైకత్వం, అమూల్యతను వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: נפשׁ ను ‘ఆత్మ’గా లేదా ‘ప్రాణం/జీవితం’గా అనువదించడం
  choice: ప్రాణం
  alternative: ఆత్మ
  rationale: ఈ సందర్భం శారీరక ప్రమాదం నుంచి రక్షణను కోరుతోంది; ద్వంద్వవాద ధార్మిక అర్థాన్ని అనవసరంగా చేర్చకుండా హీబ్రూ వ్యక్తి-జీవప్రాణ భావాన్ని ‘ప్రాణం’ బాగా అందిస్తుంది.
- issue: יְחִידָתִי యొక్క సూచ్యం
  choice: నా ఏకైక ప్రాణాన్ని
  alternative: నా అమూల్యమైన జీవితాన్ని
  rationale: ‘ఏకైక’ అనే మూల భావాన్ని ప్రత్యక్షంగా నిలుపుతూ, ముందున్న ‘నా ప్రాణం’తో ఉన్న కవితా సమాంతరతను స్పష్టం చేస్తుంది; దానిని కేవలం ‘అమూల్యమైన’గా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; విలాపంలోని నేర సంబోధన, అత్యవసరత, కవితా సమాంతరతను నిలుపుతూ గౌరవప్రదమైన సామాన్య పాఠక భాష వాడబడింది.
