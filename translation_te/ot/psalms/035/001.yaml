  source_fidelity: హీబ్రూ పాఠంలోని శీర్షిక, రెండు ఆజ్ఞారూపాలు (רִיבָה, לְחַם), అలాగే వాటికి సమాంతరంగా ఉన్న ‘నాతో వాదించేవారు/పోరాడేవారు’ అనే కృదంత భావాలను అనువాదం విశ్వసనీయంగా ప్రతిబింబిస్తుంది. ריבలోని న్యాయవివాదం–ప్రతిఘటన అనే ద్వంద్వ ఛాయను ‘వాదించు’ కాపాడుతుంది; మూలంలో లేని ‘నా పక్షం’ వంటి పదాలను ప్రధాన పాఠంలో చేర్చలేదు.
  naturalness: ‘యహ్వే, నాతో వాదించేవారితో వాదించు; / నాతో పోరాడేవారితో పోరాడు’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, గంభీరంగా, సమాంతర కవితా నిర్మాణంతో సహజంగా ఉంది. ‘దావీదు కీర్తన’ కీర్తనల శీర్షికకు సాంప్రదాయబద్ధమైన, అర్థవంతమైన తెలుగు రూపం.
