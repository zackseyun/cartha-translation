source:
  edition: WLC
  text: לְ/דָוִ֨ד רִיבָ֣/ה יְ֭הוָה אֶת יְרִיבַ֑/י לְ֝חַ֗ם אֶת לֹֽחֲמָֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/001.yaml
  text: Of David[a]. Contend, O Yahweh, with those who contend with me[b]; fight against those who fight against me.
translation:
  language: te
  text: 'దావీదు కీర్తన.[a]

    యహ్వే, నాతో వాదించేవారితో వాదించు;

    నాతో పోరాడేవారితో పోరాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘దావీదుకు చెందినది’ లేదా ‘దావీదుకు.’ ఈ శీర్షిక రచనను, సంబంధాన్ని, లేదా అంకితాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: దావీదు కీర్తన
  rationale: కీర్తనల శీర్షికలోని לְדָוִד రచన, సంబంధం, లేదా అంకితం వంటి భావాలకు అవకాశం ఇస్తుంది. సహజమైన తెలుగు శీర్షికగా ‘దావీదు కీర్తన’ను వాడి, దాని విస్తృత భావాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: רִיבָה
  choice: వాదించు
  rationale: ריב న్యాయవివాదంలో వాదించడం, ఒకరి పక్షాన వ్యాజ్యమాడడం, లేదా విస్తృతంగా ప్రతివాదిని ఎదుర్కోవడం అనే భావాలు కలిగి ఉంది. ‘వాదించు’ మూలంలోని న్యాయపరమైన మరియు విరోధాత్మక శక్తిని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ తెలుగు లిప్యంతరీకరణ ‘యహ్వే’గా ఇచ్చాం.
- source_word: אֶת יְרִיבַי
  choice: నాతో వాదించేవారితో
  rationale: ‘నాతో వివాదపడేవారు’ అనే భాగాన్ని సహజమైన సంబంధవాచక పదబంధంగా అనువదించి, ముందున్న רִיבָהతో పదపునరుక్తిని నిలిపాం.
- source_word: לְחַם
  choice: పోరాడు
  rationale: לחם ఇక్కడ యుద్ధం చేయడం లేదా పోరాడడం అనే భావంలో ఉంది. ‘పోరాడు’ స్పష్టమైన, సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: אֶת לֹחֲמָי
  choice: నాతో పోరాడేవారితో
  rationale: క్రియాశీల కృదంతం మరియు ఏకవచన ప్రథమపురుష ప్రత్యయ భావాన్ని సహజమైన తెలుగు సంబంధవాచక పదబంధంగా ఇచ్చి, ఆజ్ఞ–కృదంత పదసామ్యాన్ని నిలిపాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా
  rationale: హీబ్రూ పాఠంలో దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా వ్యక్తినామంగా లిప్యంతరీకరించాం; ‘యహ్వే’ ఆధునిక పండితలోకంలో సాధారణంగా అంగీకరించిన ఉచ్చారణను ప్రతిబింబిస్తుంది.
- issue: ריב యొక్క న్యాయపరమైన భావం
  choice: వాదించు
  alternative: నా పక్షంగా వ్యాజ్యమాడు
  rationale: మూలంలో ‘నా పక్షం/నా వ్యాజ్యం’ అనే నామవాచకం స్పష్టంగా లేదు. అందువల్ల దాన్ని ప్రధాన పాఠంలో చేర్చకుండా, సాధ్యమైన న్యాయస్థాన భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. హీబ్రూలోని సమాంతర నిర్మాణం మరియు ‘వాదించు/వాదించేవారు,’ ‘పోరాడు/పోరాడేవారు’ అనే పదసామ్యాన్ని నిలిపాం.
