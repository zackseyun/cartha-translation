source:
  edition: WLC
  text: בְּ֭/חַנְפֵי לַעֲגֵ֣י מָע֑וֹג חָרֹ֖ק עָלַ֣/י שִׁנֵּֽי/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/016.yaml
  text: Among the godless mockers at a feast[a], they gnash their teeth at me.
translation:
  language: te
  text: విందులో ఎగతాళి చేసే భక్తిహీనుల మధ్య[a], వారు నాపై పళ్లు కొరుకుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రొట్టెముక్క/తినుబండారం కోసం ఎగతాళి చేసే అపవిత్రుల మధ్య’; ఇక్కడ ‘విందులో’గా అనువదించిన హీబ్రూ పదం అరుదైనది, దాని అర్థం అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַנְפֵי
  choice: భక్తిహీనులైన ... మధ్య
  rationale: חנף అనే పదం అపవిత్రులు, భక్తిహీనులు, లేదా కపటులు అనే భావాలను ఇవ్వగలదు. ఇక్కడ శత్రుత్వంతో అపహసించేవారి నైతిక-మతపరమైన చెడును తెలిపేందుకు ‘భక్తిహీనులు’ సహజంగా ఉంది; בְּ ఉపసర్గను సహవాస/స్థానార్థకంగా ‘మధ్య’ అని అనువదించాం.
- source_word: לַעֲגֵי
  choice: అపహాసకులు
  rationale: לעג ధాతువు ఎగతాళి చేయడం, అపహసించడం అనే అర్థం ఇస్తుంది. ‘అపహాసకులు’ శత్రుత్వపూరితమైన ఎగతాళిని గౌరవప్రదమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: מָעוֹג
  choice: విందుబల్ల
  rationale: ఈ అరుదైన పదం అర్థం అనిశ్చితం. విందు లేదా భోజన సందర్భంలోని అపహాస్యంతో దీనికి సంబంధం ఉండవచ్చు; మరికొందరు ‘రొట్టె/పిండి వంట’ లేదా ‘ముద్ద’ అని భావిస్తారు. ప్రధాన పాఠంలో సంభావ్యమైన సామాజిక సందర్భాన్ని ‘విందుబల్ల’గా ఇచ్చి, అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
- source_word: חָרֹק
  choice: కొరుకుతారు
  rationale: חרק ఇక్కడ శత్రుత్వానికి సూచనగా పళ్లు కొరకడం లేదా కరకరలాడించడం అనే భావం ఇస్తుంది. తెలుగులో ‘పళ్లు కొరుకుతారు’ సహజమైన నుడికారం.
- source_word: עָלַי
  choice: నన్ను చూసి
  rationale: పళ్లు కొరకడం అనే నుడికారంతో శత్రుత్వం ఎవరిపట్ల ఉందో సహజ తెలుగులో ‘నన్ను చూసి’ తెలియజేస్తుంది; మరింత అక్షరార్థంగా ‘నాకు విరోధంగా’ అని కూడా చెప్పవచ్చు.
- source_word: שִׁנֵּימוֹ
  choice: పళ్లు
  rationale: మూడవ పురుష బహువచన స్వామ్యప్రత్యయంతో ఉన్న బహువచన రూపం. తెలుగు వాక్యంలో కర్త ‘వారు’ ద్వారా స్వామ్యం స్పష్టమవుతున్నందున ‘తమ పళ్లు’ బదులు సహజంగా ‘పళ్లు’ అని ఇచ్చాం.
