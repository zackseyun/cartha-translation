revisions:
- from: ఎందుకంటే వారు శాంతి మాటలు మాట్లాడరు; దేశంలో ప్రశాంతంగా జీవించేవారికి విరోధంగా మోసపూరితమైన మాటలు పన్నుతారు.[a]
  to: ఎందుకంటే వారు శాంతి మాటలు మాట్లాడరు; దేశంలో ప్రశాంతంగా జీవించేవారికి వ్యతిరేకంగా వారు మోసపు మాటలను కల్పిస్తారు.[a]
  rationale: The revision retains every major source-language element and the draft's intended meaning, while replacing an awkward verb-object pairing with idiomatic Telugu. The footnote continues to mark the uncertainty in רִגְעֵי אֶרֶץ and gives alternatives that function naturally as lexical equivalents.
