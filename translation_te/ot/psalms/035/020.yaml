id: PSA.35.20
reference: Psalms 35:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י לֹ֥א שָׁל֗וֹם יְדַ֫בֵּ֥רוּ וְ/עַ֥ל רִגְעֵי אֶ֑רֶץ דִּבְרֵ֥י מִ֝רְמוֹת יַחֲשֹׁבֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/020.yaml
  text: For they do not speak peace[a], but against the quiet ones of the land they devise deceitful words.
translation:
  language: te
  text: ఎందుకంటే వారు శాంతి మాటలు మాట్లాడరు; దేశంలో ప్రశాంతంగా జీవించేవారికి వ్యతిరేకంగా వారు మోసపు మాటలను కల్పిస్తారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేశంలోని ప్రశాంతులు,” లేదా “దేశంలో నిశ్చింతగా ఉన్నవారు.” ఈ హెబ్రీ పదబంధం ప్రశాంతంగా, శాంతియుతంగా జీవించే ప్రజలను సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న విన్నపానికి లేదా ఫిర్యాదుకు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: לֹא שָׁלוֹם יְדַבֵּרוּ
  choice: వారు శాంతి మాటలు మాట్లాడరు
  rationale: శాంతి లేదా సమాధానాన్ని లక్ష్యంగా చేసుకున్న మాటలు వారు పలకరనే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שָׁלוֹם
  choice: శాంతి
  rationale: శాంతి, క్షేమం అనే విస్తృత భావపరిధిలో ఇక్కడ ప్రధాన అర్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וְעַל
  choice: విరోధంగా
  rationale: వారు శాంతి మాటలు పలకకపోవడానికీ, ప్రశాంత ప్రజలపై కుట్ర చేయడానికీ మధ్యనున్న వ్యతిరేక భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: רִגְעֵי אֶרֶץ
  choice: దేశంలో ప్రశాంతంగా జీవించేవారు
  rationale: దేశంలో నిశ్చింతగా లేదా శాంతియుతంగా జీవించే ప్రజలను సూచించే సంభావ్య భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; అస్పష్టతను పాదసూచికలో నిలుపుతుంది.
- source_word: דִּבְרֵי מִרְמוֹת
  choice: మోసపూరితమైన మాటలు
  rationale: మోసం లేదా వంచనతో కూడిన మాటలను సూచించే హెబ్రీ నిర్మాణాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יַחֲשֹׁבוּן
  choice: పన్నుతారు
  rationale: కేవలం ఆలోచించడం కాక, ఉద్దేశపూర్వకంగా దుష్టమైన మాటలను కల్పించి పథకం వేయడాన్ని సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గంభీరతతో కూడిన సాధారణ వాడుక భాషను ఉపయోగించాం. ‘శాంతి మాటలు’ అనే రూపం మూలంలోని నామవాచక నిర్మాణాన్ని నిలుపుతుంది; అరుదైన רִגְעֵי אֶרֶץ పదబంధంలోని అనిశ్చితిని పాదసూచికలో చూపించాం.
