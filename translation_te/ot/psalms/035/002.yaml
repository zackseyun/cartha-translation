  text: Take hold of shield and buckler[a], and rise up for my help.
translation:
  language: te
  text: 'డాలును, నిలువెత్తు డాలును[a] పట్టుకో;

    నాకు సహాయం చేయడానికి లేచి నిలబడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఇక్కడ డాలును సూచించే రెండు వేర్వేరు పదాలు ఉన్నాయి; రెండవది శరీరంలో ఎక్కువ భాగాన్ని కప్పే ‘పెద్ద డాలు’ కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲזֵק
  choice: పట్టుకో
  rationale: ఈ హిఫిల్ ఆజ్ఞారూపం ఇక్కడ ఆయుధాలను చేతబట్టమనే భావాన్ని ఇస్తుంది. ‘పట్టుకో’ యుద్ధసంబంధమైన స్పష్ట చిత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מָגֵן
  choice: డాలు
  rationale: מָגֵן సాధారణంగా డాలును సూచిస్తుంది. ‘డాలు’ ఆధునిక పాఠకులకు సులభంగా అర్థమయ్యే సహజమైన సైనిక పదం.
- source_word: צִנָּה
  choice: నిలువెత్తు డాలు
  rationale: צִנָּה శరీరంలో ఎక్కువ భాగాన్ని కప్పే పెద్ద డాలును సూచిస్తుంది. మొదటి పదమైన מָגֵן‌తో ఉన్న భేదాన్ని నిలుపుతూ, పరిమాణం మరియు ఉపయోగాన్ని ‘నిలువెత్తు డాలు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְקוּמָה
  choice: లేచి రా
  rationale: קום ఆజ్ఞారూపానికి జోడించిన ה అత్యవసరమైన విన్నపాన్ని బలపరుస్తుంది. ‘లేచి రా’ జోక్యం చేసుకోవాలనే పిలుపును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּעֶזְרָתִי
  choice: నాకు సహాయం చేయడానికి
  rationale: ఈ సందర్భంలో בְּతో కూడిన עֶזְרָה కీర్తనకర్త పక్షాన సహాయం చేసేందుకు చర్యలోకి రావడాన్ని సూచిస్తుంది. ఈ రూపం తెలుగులో సహజంగా ఉండి భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: దేవుని యోధునిగా చిత్రించే రూపకం
  choice: దేవుడు రెండు రకాల డాళ్లను చేతబట్టి కీర్తనకర్తకు సహాయం చేయడానికి లేచివచ్చే యుద్ధ చిత్రాన్ని యథాతథంగా నిలుపడం.
  alternative: దీనిని సాధారణంగా ‘నన్ను కాపాడు’ అనే విన్నపంగా మృదువుగా అనువదించడం.
  rationale: హీబ్రూ పాఠం స్పష్టమైన సైనిక రూపకాన్ని ఉపయోగించి దేవుణ్ణి రక్షించే యోధునిగా చిత్రిస్తుంది. దానిని సాధారణ రక్షణ విన్నపంగా మార్చడం మూలపాఠంలోని సజీవ చిత్రాన్ని కోల్పోయేలా చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ప్రార్థనా శైలిని వాడాం. మూలంలోని ఏకవచన ప్రత్యక్ష ఆజ్ఞారూపాన్ని ‘పట్టుకో’, ‘లేచి రా’గా నిలిపి, యుద్ధ రూపకాన్ని తగ్గించలేదు.
