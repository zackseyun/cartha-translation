source:
  edition: WLC
  text: תְּבוֹאֵ֣/הוּ שׁוֹאָה֮ לֹֽא יֵ֫דָ֥ע וְ/רִשְׁתּ֣/וֹ אֲשֶׁר טָמַ֣ן תִּלְכְּד֑/וֹ בְּ֝/שׁוֹאָ֗ה יִפָּל בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/008.yaml
  text: Let destruction come upon him unawares[a], and let the net that he hid catch him[c][b]; into that very destruction let him fall.
translation:
  language: te
  text: 'అతనికి తెలియకుండానే[a] వినాశనం అతని మీదికి రావాలి;


    అతడు దాచిన వల అతనిని పట్టుకోవాలి;


    ఆ వినాశనంలోనే అతడు పడిపోవాలి.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు ఊహించని వేళ.” హీబ్రూ అక్షరార్థంగా, “వినాశనం అతని మీదికి రావాలి; అతడు ఎరుగడు” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: చివరనున్న స్త్రీలింగ ప్రత్యయం “వినాశనం”ను సూచించవచ్చు; అప్పుడు భావం “ఆ వినాశనంలోనే అతడు పడిపోవాలి.” అది అతడు దాచిన “వల”ను సూచిస్తుందని కూడా అర్థం చేసుకోవచ్చు; అప్పుడు భావం “అతడు ఆ వలలోనే పడిపోవాలి.”
    reason: alternative_reading
lexical_decisions:
- source_word: תְּבוֹאֵהוּ
  choice: అతని మీదికి రావాలి
  rationale: בוא అనే క్రియ యొక్క ‘రావడం’ అనే ప్రాథమిక భావాన్ని నిలుపుతూ, శాపప్రార్థన సందర్భంలోని జుస్సివ్ భావాన్ని సహజమైన తెలుగు విధ్యర్థక రూపంతో వ్యక్తం చేస్తుంది.
- source_word: שׁוֹאָה
  choice: వినాశనం
  rationale: ఈ నామవాచకం విధ్వంసకరమైన నాశనం లేదా ఘోరమైన పాడును సూచిస్తుంది. రెండు చోట్లా ఒకే పదాన్ని వాడడం మూలంలోని పునరుక్తిని నిలుపుతుంది.
- source_word: לֹא יֵדָע
  choice: అతనికి తెలియకుండానే
  rationale: అక్షరార్థమైన ‘అతడు ఎరుగడు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, విపత్తు అతనికి తెలియకుండా రావడాన్ని సూచిస్తుంది.
- source_word: וְרִשְׁתּוֹ אֲשֶׁר טָמַן
  choice: అతడు దాచిన వల
  rationale: ‘అతని వల, అతడు దాచినది’ అనే భావాన్ని తెలుగులో పునరుక్తి లేకుండా సహజంగా అందిస్తుంది; వల అతనిదే అనే సంబంధం కర్త ద్వారా స్పష్టమవుతుంది.
- source_word: תִּלְכְּדוֹ
  choice: అతనినే పట్టుకోవాలి
  rationale: వల సందర్భంలో לכדకు ‘పట్టుకోవడం’ సహజమైన సమానార్థకం. ‘అతనినే’ అనే రూపం తానే పెట్టిన ఉచ్చులో తానే చిక్కే వ్యంగ్య న్యాయాన్ని బలపరుస్తుంది.
- source_word: בְּשׁוֹאָה יִפָּל בָּהּ
  choice: ఆ వినాశనంలోనే అతడు పడిపోవాలి
  rationale: ముందుకు తెచ్చిన בְּשׁוֹאָהను చివరి స్త్రీలింగ సర్వనామ ప్రత్యయం בָּהּ తిరిగి సూచిస్తున్నదనే పఠనాన్ని సహజమైన తెలుగులో ‘ఆ ... లోనే’ అని వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయంగా ఆ ప్రత్యయం ‘వల’ను సూచించే అవకాశాన్ని పాదటిప్పణిలో ఉంచింది.
theological_decisions:
- issue: శాపప్రార్థనలోని జుస్సివ్ స్వరం
  choice: ‘రావాలి / పట్టుకోవాలి / పడిపోవాలి’ అనే కోరిక లేదా ప్రార్థనను తెలిపే రూపాలు
  alternative: భవిష్యద్వాక్యంగా ‘వస్తుంది / పట్టుకుంటుంది / పడిపోతాడు’
  rationale: హీబ్రూ రూపాలు ఈ సందర్భంలో కేవలం ముందస్తు ప్రకటనకన్నా కీర్తనకర్త కోరుతున్న తీర్పును వ్యక్తం చేస్తాయి. తెలుగు విధ్యర్థక రూపాలు ఆ ఉద్వేగాన్ని నిలుపుతాయి; ప్రత్యేక మతసంప్రదాయ వ్యాఖ్యానాన్ని జోడించవు.
- issue: చివరి בָּהּ దేనిని సూచిస్తుంది
  choice: ప్రధాన పాఠంలో ‘వినాశనం’ను సూచించే పునరుక్తి-బలీకరణగా అనువదించడం
  alternative: అతడు దాచిన ‘వల’లోనే అతడు పడిపోవడం
  rationale: שׁוֹאָה మరియు בָּהּ రెండూ స్త్రీలింగ రూపాలు కావడంతో ఈ సంబంధం వ్యాకరణపరంగా సహజం; అయితే ‘వల’ కూడా స్త్రీలింగమే కాబట్టి నిజమైన సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కీర్తనా శైలిని పాటించాం. ‘వినాశనం’ మూలంలోని తీవ్రతను నిలుపుతుంది. మూడు సమాంతర కోరికలను ‘రావాలి—పట్టుకోవాలి—పడిపోవాలి’ అనే లయతో అమర్చాం.
