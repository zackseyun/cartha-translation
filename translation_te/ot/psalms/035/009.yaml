id: PSA.35.9
reference: Psalms 35:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֭/נַפְשִׁ/י תָּגִ֣יל בַּ/יהוָ֑ה תָּ֝שִׂישׂ בִּ/ישׁוּעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/009.yaml
  text: Then my soul will rejoice in Yahweh[b][a]; it will exult in his salvation.
translation:
  language: te
  text: అప్పుడు[a] నా ప్రాణం యాహ్వేను బట్టి ఆనందిస్తుంది; ఆయన రక్షణను బట్టి[b] ఉల్లసిస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మరియు నా ప్రాణం యాహ్వేను బట్టి ఆనందిస్తుంది.’
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘ఆయన ఇచ్చే విడుదలను బట్టి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנַפְשִׁי
  choice: అప్పుడు నా ప్రాణం
  rationale: נֶפֶשׁ ఇక్కడ వ్యక్తి అంతరంగాన్ని లేదా స్వయాన్ని సూచిస్తుంది; కవితా భాషలో ‘నా ప్రాణం’ సహజంగా ఉండి మూలరూపాన్ని నిలుపుతుంది. וְ ను ముందరి వచనంలో ఎదురుచూస్తున్న విమోచన ఫలితంగా ‘అప్పుడు’ అని అనువదించాం.
- source_word: תָּגִיל
  choice: ఆనందిస్తుంది
  rationale: גיל సంతోషంతో ఆనందించడాన్ని సూచిస్తుంది. సమాంతర పాదంలోని మరింత ఉత్సాహభరితమైన תָּשִׂישׂ తో తేడా నిలిచేలా ఈ పదాన్ని ఎంచుకున్నాం.
- source_word: בַּיהוָה
  choice: యాహ్వేను బట్టి
  rationale: ב ఇక్కడ ఆనందానికి ఆధారం లేదా లక్ష్యాన్ని సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు ‘ను బట్టి’ వాడాం; יְהוָה అనే దేవుని నామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: תָּשִׂישׂ
  choice: ఉల్లసిస్తుంది
  rationale: שׂושׂ/שׂישׂ ఉప్పొంగే సంతోషాన్ని తెలియజేస్తుంది. మొదటి పాదంలోని ‘ఆనందిస్తుంది’ కంటే కవితా తీవ్రతను పెంచేందుకు ‘ఉల్లసిస్తుంది’ ఎంచుకున్నాం.
- source_word: בִּישׁוּעָתוֹ
  choice: ఆయన రక్షణను బట్టి
  rationale: יְשׁוּעָה కు ‘రక్షణ’ లేదా ‘విడుదల’ అనే అర్థాలు ఉన్నాయి. శత్రువులనుండి కాపాడబడటం సందర్భంలో ఉన్నప్పటికీ, విస్తృత అర్థాన్ని నిలుపేందుకు ‘రక్షణ’ను ప్రధాన పాఠంలో ఉంచాం; సమాంతర నిర్మాణాన్ని కాపాడేందుకు ב ను ‘ను బట్టి’గా అనువదించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో చతురక్షర దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో మార్చకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు అనుగుణంగా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: יְשׁוּעָה యొక్క పరిధి
  choice: రక్షణ
  alternative: విడుదల
  rationale: ఈ కీర్తనలో శత్రువులనుండి విడిపించబడటం తక్షణ సందర్భం. అయినా మూలపదానికి ఉన్న విస్తృత భావాన్ని సంకుచితం చేయకుండా ‘రక్షణ’ను ప్రధాన పాఠంలో ఉంచి, ‘విడుదల’ను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలిని ఉపయోగించాం. రెండు సమాంతర పాదాల్లో ‘ఆనందిస్తుంది/ఉల్లసిస్తుంది’ అనే తీవ్రతా భేదాన్ని, అలాగే ‘యాహ్వేను బట్టి/ఆయన రక్షణను బట్టి’ అనే నిర్మాణ సమాంతరతను నిలిపాం.
