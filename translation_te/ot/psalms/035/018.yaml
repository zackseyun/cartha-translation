lexical_decisions:
- source_word: א֭וֹדְךָ
  choice: నీకు కృతజ్ఞతలు చెల్లిస్తాను
  rationale: ידה అనే క్రియ హిఫిల్ రూపంలో ఆరాధన సందర్భంలో సాధారణంగా కృతజ్ఞతలు చెప్పడం లేదా స్తుతించడం అనే భావం ఇస్తుంది. రెండవ పాదంలో הלל ‘స్తుతిస్తాను’ అని ఉన్నందున, ఇక్కడ ‘కృతజ్ఞతలు చెల్లిస్తాను’ అని అనువదించడం రెండు క్రియల మధ్య తేడాను నిలుపుతుంది.
- source_word: בְּקָהָל רָב
  choice: పెద్ద సభలో
  rationale: קָהָל కూడివచ్చిన సభను లేదా సమాజాన్ని సూచిస్తుంది; רָב ఇక్కడ దాని విస్తారాన్ని తెలియజేస్తుంది. ‘పెద్ద సభలో’ అనేది సహజమైన ఆధునిక తెలుగు ప్రయోగం, బహిరంగ సమూహం అనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: בְּעַם עָצוּם
  choice: బలమైన ప్రజల మధ్య
  rationale: עַם అంటే ‘ప్రజలు’; עָצוּם బలం, శక్తి లేదా అధిక సంఖ్యను సూచించగలదు. ప్రధాన పాఠంలో ‘బలమైన’ అనే అర్థాన్ని ఉంచి, సంఖ్యాబలాన్ని సూచించే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చి మూలంలోని సందిగ్ధతను కాపాడాం.
- source_word: אֲהַלְלֶךָּ
  choice: నిన్ను స్తుతిస్తాను
  rationale: הלל పియేల్ రూపం సాధారణంగా ‘స్తుతించు’ అని అర్థమిస్తుంది. ఇది మూలానికి నేరుగా సరిపోవడమే కాక మొదటి పాదంలోని కృతజ్ఞతాభావానికి సహజంగా జతకడుతుంది.
