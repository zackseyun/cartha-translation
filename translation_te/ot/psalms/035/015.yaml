- from: కాని నేను తడబడినప్పుడు వారు సంతోషించి కూడుకున్నారు[a]; నాకు వ్యతిరేకంగా దెబ్బకొట్టేవారు కూడుకున్నారు—అది నాకు తెలియదు[b]. వారు నన్ను చీల్చివేస్తూనే ఉన్నారు; ఆపలేదు[c].
  to: కాని నేను తడబడినప్పుడు వారు సంతోషించి కూడుకున్నారు[a]; నాకు వ్యతిరేకంగా దెబ్బకొట్టేవారు కూడుకున్నారు—నాకు తెలియకుండానే[b]. వారు నన్ను చీల్చుతూనే ఉన్నారు; మానలేదు[c].
  rationale: The revision preserves the Hebrew repetition of “gathered,” the lexical uncertainty of נֵכִים, and the unresolved syntax of וְלֹא יָדַעְתִּי. It removes the vague Telugu pronoun “అది,” without deciding whether the psalmist did not know of the gathering or did not know the attackers. The final clause is made more idiomatic while retaining the footnoted “were not silent” alternative.
