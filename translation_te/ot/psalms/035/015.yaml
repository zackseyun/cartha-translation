  yaml_path: translation/ot/psalms/035/015.yaml
  text: But at my stumbling they rejoiced and gathered together[a]; they gathered against me—strangers whom I did not know[d][c][b]. They tore at me and did not stop.
translation:
  language: te
  text: కాని నేను తడబడినప్పుడు వారు సంతోషించి కూడుకున్నారు[a]; నాకు వ్యతిరేకంగా దెబ్బకొట్టేవారు కూడుకున్నారు—నాకు తెలియకుండానే[b]. వారు నన్ను చీల్చుతూనే ఉన్నారు; మానలేదు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేను కుంటుతున్నప్పుడు’ లేదా ‘నేను బలహీనపడినప్పుడు.’ హీబ్రూ పదం శారీరక కుంటితనాన్ని గానీ, విస్తృతంగా బలహీనత లేదా పతన క్షణాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘దెబ్బకొట్టేవారు’ అని అనువదించిన హీబ్రూ పదం అరుదైనది, దాని అర్థం అనిశ్చితం. అది ‘కొట్టేవారు’ అని గానీ, ‘బాధితులు/కుంటివారు’ అని గానీ అర్థమై ఉండవచ్చు. చివరి మాటలను ‘నాకు తెలియని దెబ్బకొట్టేవారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: దాడి నిరంతరమైన మాటల దూషణను సూచిస్తే, ‘వారు చీల్చారు; మౌనంగా ఉండలేదు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְצַלְעִי
  choice: నేను తడబడినప్పుడు
  rationale: צלע శారీరక కుంటితనాన్ని లేదా విస్తృతంగా బలహీనత/పతన క్షణాన్ని సూచించవచ్చు. సందర్భంలో శత్రువులు కీర్తనకర్త కష్టాన్ని చూసి సంతోషిస్తున్నారు కాబట్టి, ఈ ద్వంద్వసంభావ్యతను సహజంగా ఉంచుతుంది.
- source_word: שָׂמְחוּ
  choice: వారు సంతోషించి
  rationale: שמח యొక్క సాధారణ అర్థాన్ని, ఇక్కడి శత్రుత్వపూరిత ఆనందాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְנֶאֱסָפוּ / נֶאֶסְפוּ
  choice: కూడుకున్నారు; ... కూడుకున్నారు
  rationale: హీబ్రూలో אסף క్రియ పునరుక్తిని ప్రభావం కోసం తెలుగులోనూ నిలిపింది.
- source_word: עָלַי
  choice: నాకు వ్యతిరేకంగా
  rationale: అక్షరార్థంగా ‘నాపై’ అయినా, శత్రుత్వ సందర్భంలో ‘నాకు వ్యతిరేకంగా’ సహజమైన అర్థాన్ని ఇస్తుంది.
- source_word: נֵכִים
  choice: దెబ్బకొట్టేవారు
  rationale: అరుదైన, అనిశ్చిత పదాన్ని נכה ‘కొట్టు’తో సంబంధపెట్టి దాడిచేసేవారనే భావంలో అనువదించింది; ఇతర సాధ్యతలను పాదటీకాలో ఉంచింది.
- source_word: וְלֹא יָדַעְתִּי
  choice: అది నాకు తెలియదు
  rationale: వారి కూడిక లేదా కుట్ర గురించి కీర్తనకర్తకు తెలియలేదనే సహజ పఠనాన్ని ఇస్తుంది; ఈ వాక్యభాగం ముందున్న వ్యక్తులను విశేషించే ప్రత్యామ్నాయాన్ని పాదటీకాలో సూచించింది.
- source_word: קָרְעוּ
  choice: వారు నన్ను చీల్చివేస్తూనే ఉన్నారు
  rationale: קרע యొక్క ‘చించు/చీల్చు’ చిత్రాన్ని కాపాడుతూ, వస్తువు అంతర్నిహితంగా ఉన్నందున ‘నన్ను’ సందర్భానుసారంగా తెలిపింది; ఇది శారీరక లేదా మాటల దాడిగా ఉండగల ఉద్రిక్తతను పూర్తిగా పరిష్కరించదు.
- source_word: וְלֹא דָמּוּ
  choice: ఆపలేదు
  rationale: דמם ఇక్కడ ‘మానలేదు/ఆపలేదు’ అని ఉండవచ్చు; ‘మౌనంగా ఉండలేదు’ అనే ప్రత్యామ్నాయం మాటల దాడి పఠనానికి సరిపోతుంది కాబట్టి పాదటీకాలో ఇచ్చింది.
