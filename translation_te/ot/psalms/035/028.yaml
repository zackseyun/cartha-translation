  text: And my tongue will meditate on your righteousness[d][c][b][a], and on your praise all day long.
translation:
  language: te
  text: నా నాలుక నీ నీతిని[a] పలుకుతుంది[b]; రోజంతా నీ స్తుతిని పలుకుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ న్యాయాన్ని.’ ఇక్కడి హీబ్రూ పదం నీతి, న్యాయం—రెండు భావాలనూ సూచించగలదు; ముఖ్యంగా దేవుడు న్యాయంగా సమర్థించే సందర్భంలో.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ధ్యానిస్తుంది,’ ‘మెల్లగా ఉచ్చరిస్తుంది.’ హీబ్రూ క్రియ ధ్యానించడం, మెల్లగా పలకడం లేదా మాటగా వ్యక్తపరచడం అనే భావాలను ఇవ్వగలదు. ఇక్కడ ‘నాలుక’ కర్తగా ఉన్నందున పలకడం ప్రధాన భావంగా కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשׁוֹנִי
  choice: నా నాలుక
  rationale: ‘నా నాలుక’ అనే హీబ్రూ రూపకాన్ని అలాగే ఉంచి, మాటల ద్వారా వ్యక్తపరచడాన్ని సూచిస్తుంది. ప్రారంభంలోని וְ భావం తెలుగు వాక్యసంధిలో సహజంగా అంతర్లీనమైంది.
- source_word: תֶּהְגֶּה
  choice: గూర్చి పలుకుతుంది
  rationale: הגה అనే క్రియకు మెల్లగా పలకడం, ధ్యానించడం, ఉచ్చరించడం అనే భావాలు ఉన్నాయి. కర్త ‘నాలుక’ కావడం వల్ల ఇక్కడ శబ్దంగా పలకడమే ప్రధాన భావం; అయినా ఇతర సాధ్యార్థాలను పాదసూచికలో నిలిపాం.
- source_word: צִדְקֶךָ
  choice: నీ నీతి
  rationale: ఈ పదం దేవుని నీతినీ, న్యాయంగా తీర్పుతీర్చి విడిపించడాన్నీ సూచించగలదు. విస్తృత భావాన్ని కాపాడేందుకు ‘నీతి’ని ప్రధాన పాఠంలో ఉంచాం.
- source_word: כָּל הַיּוֹם
  choice: రోజంతా
  rationale: దినమంతటా నిరంతరంగా అనే కాలవ్యాప్తి భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: תְּהִלָּתֶךָ
  choice: నిన్ను స్తుతిస్తుంది
  rationale: హీబ్రూలో అక్షరార్థంగా ‘నీ స్తుతి’ ఉంది. సాధారణ తెలుగులో ఉద్దేశించిన క్రియను పూరించి ‘నిన్ను స్తుతిస్తుంది’ అని చెప్పడం సహజం; దేవునికి అర్పించే స్తుతి అనే భావం నిలుస్తుంది.
theological_decisions:
- issue: దైవిక సమర్థన సందర్భంలో צִדְקֶךָ అర్థం
  choice: నీ నీతి
  alternative: నీ న్యాయం
  rationale: కీర్తనకర్తను దేవుడు న్యాయంగా సమర్థించడం సందర్భంలో ఉన్నప్పటికీ, హీబ్రూ పదం దేవుని నీతి మరియు న్యాయం రెండింటినీ మోస్తుంది. ప్రధాన పాఠంలో ‘నీతి’ విస్తృతిని కాపాడి, ‘న్యాయం’ను పాదసూచికలో ఇచ్చాం.
- issue: תֶּהְגֶּה క్రియలో ధ్యానం మరియు పలుకుబడి మధ్య ఉద్రిక్తత
  choice: గూర్చి పలుకుతుంది
  alternative: ధ్యానిస్తుంది / మెల్లగా ఉచ్చరిస్తుంది
  rationale: ‘నాలుక’ కర్తగా ఉండటం శబ్దంగా వ్యక్తపరచడాన్ని బలపరుస్తుంది. అయితే క్రియలోని ధ్యానార్థాన్ని పూర్తిగా తొలగించకుండా పాదసూచికలో చూపించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కీర్తనా శైలిని వాడాం. ‘గూర్చి’ స్వల్ప సాహిత్య గంభీరతను ఇస్తూనే సాధారణ పాఠకులకు అర్థమయ్యే రూపం. హీబ్రూ రెండవ పాదంలోని క్రియా లుప్తిని తెలుగులో సహజత కోసం ‘స్తుతిస్తుంది’తో పూరించాం.
