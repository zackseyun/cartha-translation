source:
  edition: WLC
  text: יֵ֘בֹ֤שׁוּ וְ/יַחְפְּר֨וּ יַחְדָּו֮ שְׂמֵחֵ֪י רָעָ֫תִ֥/י יִֽלְבְּשׁוּ בֹ֥שֶׁת וּ/כְלִמָּ֑ה הַֽ/מַּגְדִּילִ֥ים עָלָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/026.yaml
  text: Let those who rejoice at my harm be put to shame and humiliated together[a]; let those who magnify themselves against me be clothed with shame and disgrace.
translation:
  language: te
  text: 'నా ఆపదను బట్టి సంతోషించేవారు అందరూ కలిసి సిగ్గుపడి అవమానపడుగాక;

    నాపై తమను తాము గొప్ప చేసుకొనేవారు[a] సిగ్గును, అవమానాన్ని ధరించుగాక.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాపై తమను తాము హెచ్చించుకొనేవారు,’ లేదా ‘నాకు విరోధంగా గొప్పలు చెప్పుకొనేవారు.’ హీబ్రూ పదబంధం అక్షరార్థంగా ఒకరిపై తమను తాము గొప్ప చేసుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: సిగ్గుపడుగాక
  rationale: ఇది ప్రార్థనాత్మకమైన ఆకాంక్షను తెలిపే అసంపూర్ణ క్రియారూపం; ఆధునిక తెలుగులో ‘సిగ్గుపడుగాక’ ఆ శాపప్రార్థనా బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְיַחְפְּרוּ
  choice: పరాభవం పాలవుగాక
  rationale: ఈ సందర్భంలో חפר సిగ్గు, అవమానం లేదా పరాభవానికి గురికావడాన్ని సూచిస్తుంది; ముందున్న సమానార్థక క్రియతో తేడాను నిలుపుతుంది.
- source_word: יַחְדָּו
  choice: అందరూ కలిసి
  rationale: వారందరికీ ఒకే గతి కలగాలనే సమూహ భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שְׂמֵחֵי רָעָתִי
  choice: నా ఆపదను చూసి సంతోషించేవారు
  rationale: רָעָתִי ఇక్కడ కీర్తనకర్తలోని నైతిక చెడును కాక, అతనికి సంభవించిన కీడు లేదా ఆపదను సూచిస్తుంది; ‘చూసి’ అనేది తెలుగు వాక్యాన్ని సహజం చేస్తుంది.
- source_word: יִלְבְּשׁוּ
  choice: ధరించుగాక
  rationale: సిగ్గు, అవమానం వస్త్రాలవలె వారిని కప్పుకోవాలనే హీబ్రూ రూపకాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: בֹשֶׁת
  choice: సిగ్గు
  rationale: పదానికి సాధారణమైన అర్థాన్ని తీసుకొని, వచనమంతటా ఉన్న సిగ్గు భావాన్ని నిలుపుతుంది.
- source_word: וּכְלִמָּה
  choice: అవమానం
  rationale: בֹשֶׁתతో జతగా వచ్చే సమీపార్థక పదం; ‘సిగ్గు, అవమానం’ సహజమైన తెలుగు జంటగా తీవ్రతను నిలుపుతుంది.
- source_word: הַמַּגְדִּילִים עָלָי
  choice: నాపై తమ్మును తాము గొప్పచేసుకొనేవారు
  rationale: హీబ్రూలోని ‘ఒకరిపై తమను గొప్పచేసుకోవడం’ అనే రూపాన్ని దగ్గరగా నిలుపుతూ, అహంకారపూరిత స్వీయోన్నతిని సూచిస్తుంది; అది మాటలలోని ప్రగల్భాలకు మాత్రమే పరిమితం కాదు.
