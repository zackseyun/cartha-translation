  to: 'నా ఆపదను బట్టి సంతోషించేవారు అందరూ కలిసి సిగ్గుపడి అవమానపడుగాక;

    నాపై తమను తాము గొప్ప చేసుకొనేవారు[a] సిగ్గును, అవమానాన్ని ధరించుగాక.'
  rationale: The revision removes an unsupported ‘seeing’ nuance, improves the first petition’s idiomatic Telugu, and corrects the reflexive form. It preserves the Hebrew parallelism, imprecatory/prayerful force, and the metaphorical clothing of shame and disgrace. The footnote continues to present alternatives without narrowing the source expression to speech alone.
