source:
  edition: WLC
  text: לְ/דָוִ֨ד רִיבָ֣/ה יְ֭הוָה אֶת יְרִיבַ֑/י לְ֝חַ֗ם אֶת לֹֽחֲמָֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/000.yaml
  text: Of David[a]. Contend, Yahweh, with those who contend with me[b]; fight against those who fight against me.
translation:
  language: te
  text: 'దావీదుకు చెందినది.[a]


    యెహ్వే,[b] నాతో తలపడేవారితో తలపడు;[c]

    నాతో యుద్ధం చేసేవారితో యుద్ధం చేయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధాన్ని ‘దావీదు రచించినది,’ ‘దావీదుకు అంకితమైనది’ లేదా ‘దావీదుకు సంబంధించినది’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: source_ambiguity
  - marker: b
    text: దైవనామమైన יהוה (YHWH). సంప్రదాయ తెలుగు రూపం ‘యెహోవా’; కొన్ని అనువాదాలు దీనిని ‘ప్రభువు’ అని సూచిస్తాయి.
    reason: divine_name
  - marker: c
    text: ‘తలపడు’ అని అనువదించిన హీబ్రూ క్రియకు ‘నా వ్యాజ్యాన్ని వాదించు’ అనే న్యాయపరమైన భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: దావీదుకు చెందినది
  rationale: לְ అనే ఉపసర్గ సంబంధం, రచయితత్వం, అంకితం వంటి భావాలను సూచించగలదు. ‘దావీదు రచించినది’ అని ఖచ్చితంగా నిర్ధారించకుండా మూలంలోని సంక్షిప్తతను, అస్పష్టతను నిలిపింది.
- source_word: רִיבָה ... אֶת־יְרִיבַי
  choice: నాతో వాదించేవారితో వాదించు
  rationale: ריב అనే ధాతువులో సాధారణంగా తలపడటం లేదా వాదించడం అనే భావంతో పాటు న్యాయస్థానంలో వ్యాజ్యం వాదించే భావమూ ఉంది. ప్రధాన పాఠం విస్తృత భావాన్ని ఉంచుతుంది; న్యాయపరమైన భావాన్ని పాదసూచిక తెలియజేస్తుంది.
- source_word: לְחַם אֶת־לֹחֲמָי
  choice: నాతో యుద్ధం చేసేవారితో యుద్ధం చేయి
  rationale: לחם ధాతువు సూచించే ప్రత్యక్ష పోరాట భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, ముందరి పాదంతో ఉన్న సమాంతర నిర్మాణాన్ని నిలిపింది.
- source_word: יְהוָה
  choice: యెహ్వే
  rationale: దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, మూలంలోని ప్రత్యేక నామాన్ని ఆధునికంగా ఆమోదయోగ్యమైన రూపంలో లిప్యంతరీకరించింది.
theological_decisions:
- issue: దైవనామం יְהוָה యొక్క అనువాదం
  choice: యెహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని స్పష్టంగా నిలిపేందుకు ‘యెహ్వే’ వాడబడింది. ‘ప్రభువు’ బిరుదుగా మారుస్తుంది; ‘యెహోవా’ సంప్రదాయ రూపమైనప్పటికీ మూల ఉచ్చారణకు తక్కువ సమీపంగా ఉంటుంది.
- issue: కీర్తన శీర్షికలో రచయితత్వం
  choice: దావీదుకు చెందినది
  alternative: దావీదు రచించిన కీర్తన
  rationale: לְדָוִד రచయితత్వాన్ని సూచించవచ్చు, కానీ వ్యాకరణపరంగా అది ఒక్కటే సాధ్యమైన అర్థం కాదు. అందువల్ల రచయితత్వాన్ని సిద్ధాంతపరంగా ఖరారు చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, నేరుగా దేవునికి చేసే విజ్ఞప్తి శైలిని వాడాం. మూలంలోని రెండు సమాంతర ఆజ్ఞార్థక పాదాలను, వాటి పదపునరుక్తిని సాధ్యమైనంతవరకు నిలిపాం.
