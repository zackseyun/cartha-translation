source:
  edition: WLC
  text: יִֽהְי֗וּ כְּ/מֹ֥ץ לִ/פְנֵי ר֑וּחַ וּ/מַלְאַ֖ךְ יְהוָ֣ה דּוֹחֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/005.yaml
  text: May they be like chaff before the wind[a], with the angel of Yahweh driving them away.
translation:
  language: te
  text: వారు గాలికి కొట్టుకుపోయే పొట్టులా ఉండుగాక, యాహ్వే దూత వారిని తరిమివేస్తుండగా.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు గాలి ముందున్న పొట్టులా ఉండుగాక, యాహ్వే దూత వారిని తరిమివేస్తూ ఉండగా.” హీబ్రూ సంధికారకాన్ని సాధారణంగా “మరియు” అని కూడా అర్థం చేసుకోవచ్చు; చివరి పదానికి “తరిమివేస్తూ” లేదా “తోసివేస్తూ” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: అగుదురు గాక
  rationale: సందర్భంలోని శాపప్రార్థనాత్మక భావాన్ని సాధారణ భవిష్యత్తుగా కాక, కీర్తనకర్త విన్నపంగా వ్యక్తం చేస్తుంది.
- source_word: כְּמֹץ
  choice: ఎగిరిపోయే పొట్టులా
  rationale: మֹץ ధాన్యం నూర్చినప్పుడు వేరై గాలికి తేలికగా ఎగిరిపోయే పొట్టును సూచిస్తుంది; తెలుగు పాఠకునికి దృశ్యం సహజంగా అర్థమయ్యేలా ‘ఎగిరిపోయే’ అని స్పష్టం చేయబడింది.
- source_word: לִפְנֵי רוּחַ
  choice: గాలికి
  rationale: అక్షరార్థంగా ‘గాలి ముందు’; తెలుగులో పొట్టు గాలికి కొట్టుకుపోయే దృశ్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּמַלְאַךְ יְהוָה
  choice: యెహోవా దూత
  rationale: מַלְאָךְ అనే పదానికి దూత లేదా దేవదూత అనే అర్థాలు ఉండగలవు. ఈ స్థిరమైన బైబిలీయ పదబంధంలో అతీంద్రియ దూత భావం సహజమైనదైనా, ‘దూత’ మూలపదంలోని విస్తృతిని కాపాడుతుంది. וְ ను సమన్వయ సంబంధంగా ప్రతిబింబిస్తుంది.
- source_word: דּוֹחֶה
  choice: తరిమివేయును గాక
  rationale: דחה బలవంతంగా తోసివేయడం లేదా తరిమివేయడం అనే భావాన్ని ఇస్తుంది. ముందు క్రియలోని శాపప్రార్థనాత్మక భావం సమాంతర పాదానికీ వర్తించేలా తెలుగులో వ్యక్తం చేయబడింది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే దైవనామ రూపమైన ‘యెహోవా’ను ఉపయోగిస్తూ, మూలంలోని ప్రత్యేక నామాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది.
- issue: מַלְאַךְ יְהוָה యొక్క స్వరూపం
  choice: యెహోవా దూత
  alternative: యెహోవా దేవదూత
  rationale: ‘దూత’ మూలపదపు అర్థాన్ని నిలుపుతుంది; ఈ వ్యక్తి ఖచ్చితమైన స్వరూపం లేదా గుర్తింపు గురించి వచనం చెప్పనిదాన్ని అనువాదం చేర్చదు.
- issue: రెండవ పాదంలోని క్రియాభావం
  choice: తరిమివేయును గాక
  alternative: తరిమివేస్తూ
  rationale: హీబ్రూలో דּוֹחֶה కృదంతమైనప్పటికీ, మొత్తం వాక్యంలోని ప్రార్థనాత్మక శాపభావాన్ని తెలుగులో స్పష్టంగా కొనసాగిస్తుంది. కృదంత నిర్మాణాన్ని ప్రతిబింబించే ప్రత్యామ్నాయం పాదాల సంబంధాన్ని వేరుగా వినిపించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కీర్తనా శైలిని నిలుపుతూ, ‘గాక’ రూపంతో శాపప్రార్థనాత్మక స్వరాన్ని వ్యక్తం చేశాం. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదం చివర ఉంచబడింది.
