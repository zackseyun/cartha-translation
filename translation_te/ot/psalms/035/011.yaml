  text: Violent witnesses rise up[a]; they ask me about things I do not know.
translation:
  language: te
  text: దౌర్జన్యపు సాక్షులు లేచి నిలుస్తున్నారు[a]; నాకు తెలియని విషయాల గురించి వారు నన్ను ప్రశ్నిస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
