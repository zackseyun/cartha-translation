    text: లేదా, ‘అబద్ధ సాక్షులు,’ ‘దురుద్దేశపూర్వక సాక్షులు’; హీబ్రూలో అక్షరార్థం, ‘హింసకు చెందిన సాక్షులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְקוּמוּן
  choice: లేచి నిలబడుతున్నారు
  rationale: קום అనే క్రియ ఇక్కడ విరోధ సాక్షులు ముందుకు వచ్చి సాక్ష్యం చెప్పడానికి నిలబడడాన్ని సూచిస్తుంది. ‘లేచి నిలబడుతున్నారు’ అనే ప్రయోగం దాని సజీవమైన న్యాయస్థాన సంబంధ భావాన్ని నిలుపుతుంది.
- source_word: עֵדֵי חָמָס
  choice: హింసాత్మక సాక్షులు
  rationale: ఈ పదబంధానికి అక్షరార్థం ‘హింసకు చెందిన సాక్షులు.’ חָמָס హింసతోపాటు అన్యాయం, హానికరమైన దుర్మార్గాన్ని కూడా సూచించగలదు. ‘హింసాత్మక సాక్షులు’ మూలంలోని సంక్షిప్తతను, విస్తృత భావాన్ని కాపాడుతుంది; ‘అబద్ధ సాక్షులు’ అనేది సాధ్యమైనదైనా మరింత నిర్దిష్టమైన వ్యాఖ్యానం.
- source_word: אֲשֶׁר לֹא יָדַעְתִּי
  choice: నాకు తెలియని విషయాల గురించి
  rationale: హీబ్రూలో సంబంధవాచక ఉపవాక్యానికి స్పష్టమైన కర్మ లేదు. సహజమైన తెలుగుకోసం ‘విషయాలు’ కనిష్ఠంగా పూరించబడింది; ఆరోపణలకు సంబంధించిన విషయాలు తనకు తెలియవని కీర్తనకర్త చెప్పే భావం నిలిచింది.
- source_word: יִשְׁאָלוּנִי
  choice: నన్ను ప్రశ్నిస్తున్నారు
  rationale: שׁאל అంటే అడగడం, విచారించడం లేదా కోరడం. విరోధపూరిత న్యాయ సందర్భంలో ‘ప్రశ్నిస్తున్నారు’ స్పష్టంగా, మితంగా ఉంది; ‘విచారణ చేస్తున్నారు’ అనడం మూలక్రియకన్నా బలమైన భావాన్ని కలిగించవచ్చు.
