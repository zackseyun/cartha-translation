translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. న్యాయస్థాన నేపథ్యాన్ని సూచించేందుకు ‘లేచి నిలబడుతున్నారు,’ ‘ప్రశ్నిస్తున్నారు’ అనే పదప్రయోగాలు ఎంచుకోబడ్డాయి; మూలంలోని חָמָס పదానికి ఉన్న హింస/అన్యాయం అనే భావవిస్తృతిని పాదటిప్పణిలో నిలిపాం.
