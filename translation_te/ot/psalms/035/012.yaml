  text: They repay me evil for good[b][a], bereavement to my soul.
translation:
  language: te
  text: 'మేలుకు ప్రతిగా వారు నాకు కీడు చేస్తున్నారు;

    నా ప్రాణాన్ని శోకాకులం చేస్తున్నారు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నా ప్రాణానికి వియోగం/నష్టం.” “శోకాకులం” అని అనువదించిన హీబ్రూ పదం సాధారణంగా మరణం వల్ల కలిగే వియోగాన్ని లేదా తీవ్రమైన నష్టాన్ని సూచిస్తుంది. “ప్రాణం” అని అనువదించిన పదానికి “జీవితం,” “స్వయం,” లేదా “నేను” అనే అర్థాలు కూడా ఉండవచ్చు; అందువల్ల “నా జీవితానికి నష్టం” లేదా “నాకు వియోగం” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלְּמוּנִי
  choice: వారు నాకు … చేస్తున్నారు
  rationale: పీయేల్ రూపం ప్రతిఫలంగా తిరిగి చేయడం అనే భావాన్ని ఇస్తుంది. తెలుగులో తరువాతి ‘మేలుకు ప్రతిగా … కీడు’ అనే నిర్మాణంతో కలిపి చెప్పడం సహజంగా ఉంటుంది.
- source_word: רָעָה
  choice: కీడు
  rationale: ఇది నైతిక చెడును, హానిని రెండింటినీ సూచించగలదు; ‘కీడు’ ఈ రెండు భావాలనూ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: תַּחַת
  choice: ప్రతిగా
  rationale: మార్పిడి లేదా బదులు చేయడం అనే భావాన్ని స్పష్టంగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: טוֹבָה
  choice: నేను చేసిన మేలు
  rationale: హీబ్రూలోని ‘మేలు’ భావాన్ని నిలుపుతూ, తెలుగులో ఎవరు మేలు చేశారో సందర్భానుసారంగా స్పష్టతనిస్తుంది.
- source_word: שְׁכוֹל
  choice: వియోగం
  rationale: ఈ పదం సాధారణంగా ప్రియమైనవారిని కోల్పోవడం వల్ల కలిగే వియోగాన్ని సూచిస్తుంది. ‘వియోగం’ దాని తీవ్రతను నిలుపుతూ, ఇక్కడ అక్షరార్థంగా సంతాననష్టం అని అతిగా నిర్దిష్టం చేయదు.
- source_word: לְנַפְשִׁי
  choice: నా ప్రాణానికి
  rationale: נֶפֶשׁ అనే పదానికి ప్రాణం, జీవితం, స్వయం అనే అర్థపరిధి ఉంది. ‘నా ప్రాణానికి’ కవితాత్మక బలాన్ని, మూలంలోని భావసాంద్రతను నిలుపుతుంది.
theological_decisions:
- issue: שְׁכוֹל לְנַפְשִׁי అనే క్రియలేని పదబంధానికి ముందు వాక్యంతో ఉన్న సంబంధం
  choice: ‘నా ప్రాణానికి వియోగాన్ని కలిగిస్తున్నారు’ అని ముందు వాక్యంలోని కర్తను కొనసాగించడం
  alternative: ‘నా ప్రాణానికి వియోగం’ అనే క్రియలేని పదబంధంగా ఉంచడం
  rationale: హీబ్రూ సంబంధాన్ని పూర్తిగా స్పష్టపరచకపోయినా, తెలుగులో అర్థవంతమైన వాక్యంగా ఉండేందుకు కనిష్ఠంగా క్రియను పూరించాం; మూలంలోని పదార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన సంక్షిప్తమైన గంభీర శైలిని ఉపయోగించాం. ‘వియోగం’ అనే పదం నష్టం కంటే శోకభరితమైన మూలభావాన్ని బలంగా నిలుపుతుంది; పాదసూచిక మూలంలోని క్రియలేని నిర్మాణం మరియు נֶפֶשׁ పదపు విస్తృత అర్థపరిధిని తెలియజేస్తుంది.
