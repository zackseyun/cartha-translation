  rationale: The revision removes an unsupported explicit subject, renders the Hebrew exchange idiom directly, and replaces “వియోగం” with a Telugu expression that better reflects bereavement-like devastation. It retains a supplied verb for idiomatic Telugu while the footnote preserves the Hebrew nominal expression and the lexical breadth of נֶפֶשׁ.
