id: PSA.35.22
reference: Psalms 35:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רָאִ֣יתָה יְ֭הוָה אַֽל תֶּחֱרַ֑שׁ אֲ֝דֹנָ֗/י אֲל תִּרְחַ֥ק מִמֶּֽ/נִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/022.yaml
  text: You have seen[a], O Yahweh; do not be silent. O Lord, do not be far from me.
translation:
  language: te
  text: 'యహ్వే, నీవు చూశావు;

    మౌనంగా ఉండకు[a].

    ప్రభువా, నాకు దూరంగా ఉండకు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “మౌనంగా కొనసాగవద్దు.”'
    reason: హీబ్రూ క్రియ మౌనంగా ఉండడాన్ని సూచిస్తుంది; సందర్భంలో స్పందించకుండా ఉండడం లేదా జోక్యం చేసుకోకపోవడం అనే భావం కూడా ఉండవచ్చు.
lexical_decisions:
- source_word: רָאִיתָה
  choice: నీవు చూశావు
  rationale: ראה అనే క్రియ యొక్క ఖాల్ సంపూర్ణరూపం, ద్వితీయ పురుష ఏకవచనం. దేవుడు ఇప్పటికే పరిస్థితిని చూశాడనే విన్నపానికి ఆధారాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: אַל תֶּחֱרַשׁ
  choice: మౌనంగా ఉండకు
  rationale: חרשׁ ఇక్కడ ‘మౌనంగా ఉండు’ అనే భావంలో ఉంది. సందర్భంలో స్పందించకుండా లేదా చర్య తీసుకోకుండా ఉండవద్దనే అంతర్భావం ఉన్నా, మూలంలోని మౌన రూపకాన్ని నిలిపాం.
- source_word: אֲדֹנָי
  choice: ప్రభువా
  rationale: దేవునికి ఉపయోగించిన ‘ప్రభువు’ అనే బిరుదును సంబోధన రూపంలో ఇచ్చాం; దీనిని యహ్వే అనే వ్యక్తినామం నుండి స్పష్టంగా వేరు చేశాం.
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: నాకు దూరంగా ఉండకు
  rationale: רחק మరియు מן కలయికలోని స్థలసంబంధమైన, అనుబంధసంబంధమైన రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని ఉపయోగిస్తున్నందున దాన్ని బిరుదుగా మార్చలేదు. ‘యహ్వే’ హీబ్రూ నామానికి ‘యెహోవా’ కంటే దగ్గరైన సాధారణ లిప్యంతరీకరణ.
- issue: దేవుని మౌనం అనే వాక్యభావం
  choice: మౌనంగా ఉండకు
  alternative: స్పందించకుండా ఉండకు / చర్య తీసుకోకుండా ఉండకు
  rationale: కవి దేవుని జోక్యాన్ని వేడుకుంటున్నప్పటికీ, మూలం నేరుగా ‘మౌనం’ అనే రూపకాన్నే వాడుతుంది. దాని ధార్మిక ఉద్వేగాన్ని వివరణతో పరిమితం చేయకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన ప్రార్థనా శైలిని ఉపయోగించాం. రెండు దైవసంబోధనలను ‘యహ్వే’ మరియు ‘ప్రభువా’గా వేరు చేసి, హీబ్రూ సమాంతర నిర్మాణాన్ని నిలిపాం.
