  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲנִ֤י בַּ/חֲלוֹתָ֡/ם לְב֬וּשִׁ/י שָׂ֗ק עִנֵּ֣יתִי בַ/צּ֣וֹם נַפְשִׁ֑/י וּ֝/תְפִלָּתִ֗/י עַל חֵיקִ֥/י תָשֽׁוּב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/013.yaml
  text: But as for me[a], when they were sick, my clothing was sackcloth; I humbled myself with fasting[c][b], and my prayer returned to my own bosom.
translation:
  language: te
  text: అయితే వారు అనారోగ్యంగా ఉన్నప్పుడు, నేను గోనెవస్త్రం ధరించాను[a]; ఉపవాసంతో నన్ను నేను దీనపరచుకున్నాను[b]; నా ప్రార్థన నా ఒడికే తిరిగి వచ్చింది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గోనెవస్త్రం ముతకైన దుఃఖవస్త్రం; అది శోకం, వేదన లేదా పశ్చాత్తాపాన్ని వ్యక్తం చేసేది.
    reason: cultural_note
  - marker: b
    text: అక్షరార్థంగా, “ఉపవాసంతో నా ప్రాణాన్ని బాధించుకున్నాను.” ఇది ఉపవాసం ద్వారా తనను తాను దీనపరచుకోవడాన్ని తెలిపే హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: ఈ హీబ్రూ నుడికారం అస్పష్టమైనది. “నా ప్రార్థన జవాబు పొందక తిరిగి వచ్చింది” లేదా “నా ప్రార్థన ప్రయోజనం నాకే తిరిగి వచ్చింది” అనే భావాలు ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּחֲלוֹתָם
  choice: వారు జబ్బుపడినప్పుడు
  rationale: ב plus infinitive construct with the 3mp suffix expresses the time when they were sick; this is natural modern Telugu.
- source_word: לְבוּשִׁי שָׂק
  choice: నేను గోనెపట్టను వస్త్రంగా ధరించాను
  rationale: The Hebrew literally says that the psalmist's clothing was sackcloth. An active Telugu expression is clearer while retaining the mourning garment.
- source_word: עִנֵּיתִי בַצּוֹם נַפְשִׁי
  choice: ఉపవాసంతో నన్ను నేను తగ్గించుకున్నాను
  rationale: The collocation means afflicting or humbling oneself through fasting. This rendering communicates the Hebrew idiom naturally without reducing it merely to physical pain.
- source_word: עַל חֵיקִי תָשׁוּב
  choice: నా ప్రార్థన నా ఒడికే తిరిగి వచ్చింది
  rationale: חיק can denote bosom or lap, and שוב means return. The concrete image is retained because the idiom's precise implication is uncertain.
theological_decisions:
- issue: ‘నా ప్రార్థన నా ఒడికే తిరిగి వచ్చింది’ అనే వాక్యభాగం అర్థం
  choice: హీబ్రూ రూపకాన్ని ప్రధాన పాఠ్యంలో యథాతథంగా ఉంచడం
  alternative: నా ప్రార్థన జవాబు పొందక తిరిగి వచ్చింది; లేదా దాని ప్రయోజనం నాకే తిరిగి వచ్చింది
  rationale: ఈ హీబ్రూ నుడికారానికి ఖచ్చితమైన భావం స్పష్టంగా లేదు. అది ప్రార్థన ఫలించలేదని గానీ, దాని మేలు ప్రార్థించినవానికే తిరిగివచ్చిందని గానీ సూచించవచ్చు; అందువల్ల ప్రధాన పాఠ్యం ఏ ఒక్క వివరణనూ నిర్బంధంగా ఎంచుకోదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘ఒడికే తిరిగి వచ్చింది’ అనే రూపకం మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను కాపాడుతుంది; గోనెపట్టకు సంబంధించిన సాంస్కృతిక నేపథ్యాన్ని పాదటిప్పణిలో వివరించాం.
