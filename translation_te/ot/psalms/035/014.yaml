translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గంభీరతతోనూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే విధంగానూ అనువదించబడింది. హీబ్రూ వాక్యంలోని రెండు పోలికలు—స్నేహితుడు/సహోదరుడు మరియు తల్లికోసం దుఃఖించేవాడు—వేరువేరుగా నిలుపబడ్డాయి; కֹדֵר ను రెండవ పోలికలో కలిపివేయకుండా ప్రత్యేకమైన దిగులు-చిత్రంగా అనువదించాం.
