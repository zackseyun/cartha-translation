  naturalness: ‘అతడు నా స్నేహితుడో నా సహోదరుడో అయినట్లుగా నేను మెలిగాను’ అనేది ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది. ‘తల్లికోసం దుఃఖించేవానిలా, దిగులుతో వంగిపోయాను’ కీర్తనకు తగిన గంభీరమైన, సహజమైన ప్రయోగం.
