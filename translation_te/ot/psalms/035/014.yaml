  text: כְּ/רֵֽעַ כְּ/אָ֣ח לִ֭/י הִתְהַלָּ֑כְתִּי כַּ/אֲבֶל אֵ֝֗ם קֹדֵ֥ר שַׁחֽוֹתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/014.yaml
  text: I walked about as though he were my friend[a], as though he were my brother; I bowed down in gloom[c][b], like one mourning for a mother.
translation:
  language: te
  text: అతడు నా స్నేహితుడో నా సహోదరుడో అయినట్లుగా నేను మెలిగాను[a]; తల్లికోసం దుఃఖించేవానిలా[b], దిగులుతో వంగిపోయాను[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “స్నేహితునిలా, నాకు సహోదరునిలా నేను తిరిగాను.” హీబ్రూ వాక్యం గాఢమైన వ్యక్తిగత సాన్నిహిత్యాన్ని వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “తల్లి కోసం దుఃఖించేవానిలా.” ఇక్కడ తల్లి ఎవరిదో హీబ్రూ ప్రత్యేకంగా చెప్పదు.
    reason: ambiguity
  - marker: c
    text: “దిగులుతో” అనే మాటకు వెనుకనున్న హీబ్రూ పదం అక్షరార్థంగా “చీకటిపడి” లేదా “మసకబారి” అని అర్థమివ్వగలదు; శోకంతో కృంగిపోయిన రూపానికి ఇది ఒక చిత్రాత్మక వ్యక్తీకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרֵעַ כְּאָח לִי
  choice: అతడు నాకు స్నేహితుడిలా, సహోదరుడిలా ఉన్నట్లు
  rationale: రֵעַ అంటే ‘స్నేహితుడు/సహచరుడు,’ אָח అంటే ‘సహోదరుడు.’ రెండింటి ముందు ఉన్న כְּ పోలికను సూచిస్తుంది. హీబ్రూలో కర్తను స్పష్టంగా చెప్పకపోయినా, సందర్భానుసారంగా ‘అతడు ... ఉన్నట్లు’ అని తెలుగులో సహజంగా వ్యక్తం చేయబడింది; לִי లోని సన్నిహిత సంబంధ భావం ‘నాకు’ ద్వారా నిలుపబడింది.
- source_word: הִתְהַלָּכְתִּי
  choice: నేను మెలిగాను
  rationale: ఈ హిత్పయేల్ రూపం కేవలం నడకనే కాక ప్రవర్తించిన తీరును కూడా సూచించగలదు. ఈ సందర్భంలో స్నేహితుడు లేదా సహోదరుడిపట్ల చూపిన ఆత్మీయ ప్రవర్తనను ‘మెలిగాను’ సహజంగా తెలియజేస్తుంది.
- source_word: כַּאֲבֶל אֵם
  choice: తల్లికోసం దుఃఖించేవానిలా
  rationale: అక్షరార్థంగా ఇది ‘తల్లికోసం దుఃఖించే వ్యక్తిలా.’ אֲבֶל దుఃఖించేవాడిని లేదా శోకస్థితిని సూచిస్తుంది; אֵם ‘తల్లి.’ ఈ పదబంధాన్ని కֹדֵר నుండి వేరైన పోలికగా ఉంచడం హీబ్రూ కవితా నిర్మాణాన్ని కాపాడుతుంది.
- source_word: קֹדֵר
  choice: దిగులుతో
  rationale: קדר యొక్క మూలచిత్రం చీకటిపడడం లేదా మసకబారడం; శోకసందర్భంలో అది దిగులుతో కృంగిన రూపాన్ని సూచిస్తుంది. ‘దిగులుతో’ ఆధునిక తెలుగులో భావాన్ని స్పష్టంగా అందిస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: שַׁחוֹתִי
  choice: వంగిపోయాను
  rationale: ఈ క్రియ దుఃఖంతో శరీరం కుంగి వంగిన భంగిమను సూచిస్తుంది. ‘వంగిపోయాను’ ఆ శారీరక చిత్రాన్నీ, అంతరంగ కృంగుదలనూ నిలుపుతుంది.
