source:
  edition: WLC
  text: שָׁפְטֵ֣/נִי כְ֭/צִדְקְ/ךָ יְהוָ֥ה אֱלֹהָ֗/י וְ/אַל יִשְׂמְחוּ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/024.yaml
  text: Vindicate me according to your righteousness[a], O Yahweh my God, and do not let them rejoice over me.
translation:
  language: te
  text: యాహ్వే, నా దేవా, నీ నీతిని[a] బట్టి నాకు న్యాయం తీర్చు; వారు నాపై ఆనందించనివ్వకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ న్యాయాన్ని.”
    reason: צדק అనే పదం ఈ సందర్భంలో ‘నీతి’తో పాటు ‘న్యాయం’ అనే భావాన్నీ ఇవ్వగలదు.
lexical_decisions:
- source_word: שָׁפְטֵנִי
  choice: నాకు న్యాయం తీర్చు
  rationale: వ్యక్తిని కర్మగా తీసుకున్న שׁפט అనే ఆజ్ఞారూపం, ఈ విజ్ఞాపన సందర్భంలో కేవలం తటస్థంగా పరిశీలించమని కాక కీర్తనకర్త పక్షాన న్యాయమైన తీర్పు ఇవ్వమని కోరుతోంది. ‘నాకు న్యాయం తీర్చు’ న్యాయస్థాన సంబంధమైన భావాన్నీ విజ్ఞాపన స్వరాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כְצִדְקְךָ
  choice: నీ నీతిని బట్టి
  rationale: צדק దేవుని నీతిగల స్వభావాన్నీ న్యాయ ప్రమాణాన్నీ సూచించగలదు. ‘నీ నీతిని బట్టి’ మూలపదపు విస్తృతమైన నైతిక, దైవశాస్త్ర సంబంధమైన బరువును నిలుపుతుంది; ‘నీ న్యాయాన్ని బట్టి’ అనేది సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితుల లిప్యంతరీకరణకు అనుగుణంగా తెలుగులో ‘యాహ్వే’ అని ఇచ్చాం.
- source_word: אֱלֹהָי
  choice: నా దేవా
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయాన్ని నిలుపుతూ, ప్రత్యక్ష సంబోధనకు సహజమైన తెలుగు రూపాన్ని వాడాం.
- source_word: וְאַל יִשְׂמְחוּ
  choice: వారు … ఆనందించనివ్వకు
  rationale: אַלతో కూడిన అసంపూర్ణ క్రియ నిషేధ విజ్ఞాపనను వ్యక్తం చేస్తుంది. దేవునికి చేసిన అభ్యర్థనగా తెలుగులో ‘ఆనందించనివ్వకు’ సహజంగా ఉంటుంది.
- source_word: לִי
  choice: నాపై
  rationale: విరోధులు కీర్తనకర్త దుస్థితిని బట్టి హర్షించే సందర్భంలో לִי శత్రుత్వపూర్వక ఆనందాన్ని సూచిస్తుంది. ‘నాపై’ ఈ సంబంధాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలవచనంలో దైవనామం ప్రత్యక్షంగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా నిలిపి, సాధారణ పండితుల పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించాం.
- issue: צִדְקְךָను ‘నీతి’గా లేదా ‘న్యాయం’గా ఇవ్వడం
  choice: నీ నీతి
  alternative: నీ న్యాయం
  rationale: ఈ పదం న్యాయవిచారణ భావాన్ని కలిగి ఉన్నప్పటికీ, దేవుని నీతిగల స్వభావం మరియు ప్రమాణం అనే విస్తృత భావాన్ని కూడా మోస్తుంది. అందువల్ల ప్రధాన పాఠంలో ‘నీతి’ని ఉంచి, ‘న్యాయం’ను పాదటిప్పణిలో ప్రత్యామ్నాయంగా ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రార్థనా శైలిని వాడాం. ‘నాకు న్యాయం తీర్చు’ న్యాయవిచారణ భావాన్ని సామాన్య పాఠకులకు సహజంగా అందిస్తుంది; ‘నాపై ఆనందించనివ్వకు’ శత్రువుల హర్షాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
