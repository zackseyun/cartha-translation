  rationale: 'The revision improves idiomatic Telugu while preserving every source element: the urgent imperative (חוּשָׁה), the plea for the psalmist’s help (לְעֶזְרָתִי), the divine address (אֲדֹנָי), and the closing confession “my salvation” (תְּשׁוּעָתִי). The footnote retains the more formally literal alternative for the imperative.'
