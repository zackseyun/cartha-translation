lexical_decisions:
- source_word: חוּשָׁה
  choice: త్వరపడు
  rationale: ఆజ్ఞార్థక రూపంలోని అత్యవసర విన్నపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לְעֶזְרָתִי
  choice: నా సహాయానికి
  rationale: మూలంలోని ‘నా సహాయం కోసం/నా సహాయానికి’ అనే నామవాచక నిర్మాణాన్ని తెలుగులో స్పష్టంగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: אֲדֹנָי
  choice: ప్రభువా
  rationale: దేవునికి వాడిన ప్రామాణిక సంబోధన బిరుదును గౌరవప్రదమైన తెలుగు సంబోధన రూపంలో అందిస్తుంది.
- source_word: תְּשׁוּעָתִי
  choice: నా రక్షణ
  rationale: ‘రక్షణ/విడుదల’ అనే నామవాచక భావాన్ని వ్యక్తిగా మార్చకుండా నిలుపుతుంది; సందర్భంలో దేవుడే కీర్తనకర్త రక్షణ అని సూచిస్తుంది.
theological_decisions:
- issue: אֲדֹנָי అనే దైవిక బిరుదు అనువాదం
  choice: ప్రభువా
  alternative: నా ప్రభువా
  rationale: ఇక్కడ ఈ రూపం సాధారణ దైవిక బిరుదుగా పనిచేస్తుంది. మూలంలో ప్రత్యేకంగా ముందుకు తేవని స్వామ్యభావాన్ని తెలుగులో అదనంగా చేర్చకుండా ‘ప్రభువా’ అని అనువదించాం.
- issue: תְּשׁוּעָתִי లో దేవుణ్ణి ‘నా రక్షణ’గా పేర్కొనడం
  choice: నా రక్షణ అయిన ప్రభువా
  alternative: నన్ను రక్షించేవాడవైన ప్రభువా
  rationale: మూలంలోని భావవాచక నామాన్ని కార్యసాధక వ్యక్తిగా మార్చకుండా, దేవుడే కీర్తనకర్త రక్షణ అనే బలమైన రూపకాన్ని నిలిపాం. తెలుగు సహజత్వం కోసం దీనిని ‘ప్రభువా’తో అన్వయించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనకు తగిన గౌరవప్రదమైన మరియు అత్యవసర స్వరాన్ని ఉపయోగించాం. ‘నా రక్షణ’ అనే మూల రూపకాన్ని సహజమైన అన్వయంతో నిలిపాం.
