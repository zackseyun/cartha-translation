id: PSA.38.3
reference: Psalms 38:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵין מְתֹ֣ם בִּ֭/בְשָׂרִ/י מִ/פְּנֵ֣י זַעְמֶ֑/ךָ אֵין שָׁל֥וֹם בַּ֝/עֲצָמַ֗/י מִ/פְּנֵ֥י חַטָּאתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/003.yaml
  text: There is no soundness in my flesh because of your indignation[b][a]; there is no peace in my bones because of my sin.
translation:
  language: te
  text: నీ ఆగ్రహం కారణంగా నా శరీరంలో ఆరోగ్యం లేదు[a]; నా పాపం కారణంగా నా ఎముకల్లో క్షేమం లేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సంపూర్ణత లేదు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘శాంతి లేదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מְתֹם
  choice: ఆరోగ్యం
  rationale: ఈ శారీరక విలాప సందర్భంలో సంపూర్ణమైన లేదా దృఢమైన స్థితి అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఆరోగ్యం’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: בִּבְשָׂרִי
  choice: నా శరీరంలో
  rationale: בשר అక్షరార్థంగా ‘మాంసం’; అయితే ఇక్కడ బాధకు గురైన దేహాన్ని సూచిస్తున్నందున ‘నా శరీరంలో’ సాధారణ తెలుగు పాఠకునికి సహజంగా ఉంటుంది.
- source_word: מִפְּנֵי
  choice: కారణంగా
  rationale: రెండు వాక్యభాగాల్లోనూ ఈ పూర్వప్రత్యయం కారణాన్ని సూచిస్తుంది; ‘కారణంగా’ దానిని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: זַעְמֶךָ
  choice: నీ ఆగ్రహం
  rationale: זעם తీవ్రమైన కోపం లేదా రోషాన్ని సూచిస్తుంది. ‘ఆగ్రహం’ దైవ అసంతృప్తి తీవ్రతను సహజంగా నిలుపుతుంది; ‘ఉగ్రకోపం’ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: שָׁלוֹם
  choice: క్షేమం
  rationale: శָׁלוֹם ఇక్కడ కేవలం విరోధం లేని శాంతికన్నా శారీరక సమగ్ర సౌఖ్యం లేదా క్షేమాన్ని సూచిస్తుంది. ఎముకల సందర్భంలో ‘క్షేమం’ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בַּעֲצָמַי
  choice: నా ఎముకల్లో
  rationale: హీబ్రూ పదంలోని స్పష్టమైన శారీరక చిత్రణను, లోతైన బాధను కవితాత్మకంగా నిలుపుతుంది.
- source_word: חַטָּאתִי
  choice: నా పాపం
  rationale: కీర్తనకర్త బాధకు కారణంగా పేర్కొన్న అతని పాపాన్ని సరళంగా, నేరుగా అనువదిస్తుంది.
theological_decisions:
- issue: దైవ ఆగ్రహం, కీర్తనకర్త పాపం, అతని శారీరక బాధ మధ్య సంబంధం
  choice: కీర్తనకర్త శారీరక దుస్థితి దేవుని ఆగ్రహం కారణంగా, తన పాపం కారణంగా ఉందని వచనం చెప్పినట్టుగానే రెండు కారణ వాక్యాలను నిలిపాం.
  alternative: ఇది సమస్త బాధకు వర్తించే సిద్ధాంత ప్రకటన కాకుండా, దేవునికి దూరమైనట్లు కీర్తనకర్త అనుభవించిన స్థితికి కవితాత్మక వర్ణనగా కూడా చదవవచ్చు.
  rationale: హీబ్రూ పాఠం ఈ సంబంధం ఎలా పనిచేస్తుందో మరింత వివరించదు. అందువల్ల అనువాదం దైవ ఆగ్రహాన్నీ వ్యక్తిగత పాపాన్నీ తగ్గించకుండా, వాటి మధ్య ఉన్న వేదాంత ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కవితాత్మక శైలి. మూలంలోని సమాంతర నిర్మాణం, శరీరం–ఎముకలు అనే దేహ చిత్రణ, రెండు కారణ వాక్యాలు నిలుపబడ్డాయి.
