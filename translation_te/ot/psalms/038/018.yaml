id: PSA.38.18
reference: Psalms 38:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי עֲוֺנִ֥/י אַגִּ֑יד אֶ֝דְאַ֗ג מֵֽ/חַטָּאתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/018.yaml
  text: For I confess my iniquity[b][a]; I am anxious because of my sin.
translation:
  language: te
  text: ఎందుకంటే నా దోషాన్ని నేను ఒప్పుకుంటాను[a]; నా పాపం కారణంగా నేను కలవరపడుతున్నాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా దోషాన్ని నేను తెలియజేస్తాను.’ హీబ్రూ క్రియకు అక్షరార్థంగా ‘తెలియజేయడం’ లేదా ‘ప్రకటించడం’ అని అర్థం; పశ్చాత్తాప సందర్భాన్ని బట్టి ప్రధాన పాఠంలో ‘ఒప్పుకుంటాను’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా పాపం గురించి నేను ఆందోళన చెందుతున్నాను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి మాటకు కారణాన్ని లేదా వివరణను పరిచయం చేసే అనుసంధాన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עֲוֺנִי
  choice: నా దోషాన్ని
  rationale: עָוֹן తప్పుచేయడం, దానివల్ల కలిగే అపరాధభారం—రెండింటినీ సూచించగలదు. ‘దోషం’ ఈ నైతిక భారాన్ని సాధారణ ఆధునిక తెలుగులో మోస్తుంది.
- source_word: אַגִּיד
  choice: నేను ఒప్పుకుంటాను
  rationale: נגד హిఫీల్ రూపానికి ప్రాథమికంగా ‘తెలియజేయడం/ప్రకటించడం’ అనే అర్థం ఉంది; వ్యక్తిగత దోషం విషయమైన ఈ పశ్చాత్తాప సందర్భంలో ‘ఒప్పుకుంటాను’ సహజంగా సరిపోతుంది. మూలంలోని విస్తృత అర్థాన్ని పాదటిప్పణి నిలుపుతుంది.
- source_word: אֶדְאַג
  choice: నేను కలవరపడుతున్నాను
  rationale: דאג ఆందోళనతో కూడిన అంతరంగ వ్యాకులతను సూచిస్తుంది. ‘కలవరపడుతున్నాను’ ప్రస్తుత అంతరంగ బాధను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מֵחַטָּאתִי
  choice: నా పాపం కారణంగా
  rationale: ఇక్కడ מִן కారణాన్ని లేదా సందర్భాన్ని సూచిస్తుంది; ‘కారణంగా’ ఆ సంబంధాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: חַטָּאתִי
  choice: నా పాపం
  rationale: חַטָּאת‌కు నేరుగా, సాధారణంగా సరిపడే తెలుగు పదం ‘పాపం’.
theological_decisions:
- issue: పశ్చాత్తాప కీర్తనలో దోషాన్ని తెలియజేయడం మరియు అంతరంగ కలవరానికి మధ్య సంబంధం
  choice: వ్యక్తిగత దోషాన్ని ఒప్పుకోవడం, తన పాపం కారణంగా కలవరపడడం అని అనువదించబడింది.
  alternative: ‘నా దోషాన్ని నేను ప్రకటిస్తాను; నా పాపం గురించి ఆందోళన చెందుతున్నాను’ అని మరింత పదక్షరంగా అనువదించవచ్చు.
  rationale: హీబ్రూ వాక్యం కీర్తనకర్త తన దోషాన్ని తెలియజేస్తున్నాడనీ తన పాపం కారణంగా వ్యాకులపడుతున్నాడనీ చెబుతుంది. ‘ఒప్పుకుంటాను’ పశ్చాత్తాప సందర్భాన్ని ప్రతిబింబిస్తుంది; అయితే పశ్చాత్తాపం గురించి వాక్యంలో లేని విస్తృత సిద్ధాంతాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే కీర్తనకు తగిన గంభీరతతో. ‘దోషం’ మరియు ‘పాపం’ అనే మూలంలోని రెండు వేరు పదాలను వేరుగా నిలిపింది.
