source:
  edition: WLC
  text: כִּֽי חִ֭צֶּי/ךָ נִ֣חֲתוּ בִ֑/י וַ/תִּנְחַ֖ת עָלַ֣/י יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/002.yaml
  text: For your arrows have sunk into me[b][a], and your hand has come down on me.
translation:
  language: te
  text: ఎందుకంటే నీ బాణాలు నాలోకి దిగిపోయాయి[a]; నీ చేయి[b] నాపై దిగివచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాలో గుచ్చుకున్నాయి’ లేదా ‘నన్ను కొట్టాయి.’ హెబ్రీ క్రియకు అక్షరార్థంగా ‘దిగాయి’ అనే భావం ఉంది; ఇక్కడ అది కీర్తనకర్తలో బాణాలు దిగిపోయిన చిత్రాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో ‘నీ చేయి’ అనే చిత్రం ఉంది. ఇది దేవుని క్రియాశీల శక్తిని సూచించవచ్చు; ఇక్కడ అది కీర్తనకర్తపై వచ్చిన బాధను చిత్రిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: విలాపానికి కారణాన్ని పరిచయం చేసే హేత్వర్థాన్ని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: חִצֶּיךָ
  choice: నీ బాణాలు
  rationale: దైవిక బాధను యుద్ధరూపకంతో వ్యక్తం చేసే హెబ్రీ బహువచనాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: נִחֲתוּ בִי
  choice: నాలోకి దిగాయి
  rationale: נחת అనే క్రియలోని ‘దిగడం’ భావాన్ని, బాణాలు కవిలోకి దిగి నిలిచిన సందర్భోచిత చిత్రాన్ని కాపాడుతుంది; ‘గుచ్చుకున్నాయి’ అని అనువదించడం సాధ్యమైనా అది కొంత వివరణాత్మకం.
- source_word: וַתִּנְחַת עָלַי
  choice: నాపై దిగివచ్చింది
  rationale: మొదటి పాదంలోని అదే נחת మూలక్రియను ‘దిగు’ అనే పదంతో ప్రతిధ్వనింపజేస్తూ, పై నుంచి పడే బరువు లేదా ఒత్తిడి చిత్రాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יָדֶךָ
  choice: నీ చెయ్యి
  rationale: దేవుని క్రియాశీల శక్తిని సూచించే మానవరూప చిత్రాన్ని అభిప్రాయాత్మక పదంతో భర్తీ చేయకుండా నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: దేవుని కార్యానికి ఉపయోగించిన మానవరూప భాష
  choice: ‘నీ చెయ్యి’ అనే రూపకాన్ని యథాతథంగా ఉంచడం
  alternative: నీ శక్తి / నీ తీర్పు
  rationale: మూలపాఠం స్పష్టీకరించకుండా ఉంచిన దైవిక కార్యం, బాధ లేదా శిక్షణ మధ్యనున్న భావ ఉద్రిక్తతను అనువాదం ముందుగానే పరిష్కరించకూడదు.
- issue: దైవిక బాణాల ప్రభావాన్ని వివరించే క్రియ
  choice: ‘నాలోకి దిగాయి’ అని మూలక్రియలోని దిగుదల భావాన్ని నిలుపడం
  alternative: నన్ను గుచ్చాయి / నన్ను తాకాయి
  rationale: సందర్భం గుచ్చుకోవడాన్ని సూచించినా, హెబ్రీ క్రియ స్వయంగా ప్రధానంగా ‘దిగడం’ అనే భావాన్ని ఇస్తుంది; అందువల్ల ప్రధాన పాఠంలో ఆ అస్పష్టతను కాపాడి ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కవితా శైలి వాడబడింది. రెండు పాదాల్లోనూ נחת మూలంలోని ‘దిగు’ చిత్రాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, ‘చెయ్యి’ అనే సజీవ మానవరూప రూపకాన్ని వ్యాఖ్యానంతో భర్తీ చేయలేదు.
