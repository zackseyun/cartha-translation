revisions:
- from: నా ప్రియులూ నా స్నేహితులూ నా బాధకు దూరంగా నిలుస్తున్నారు[a]; నా దగ్గరి బంధువులు దూరంగా నిలిచారు.
  to: నన్ను ప్రేమించేవారూ నా స్నేహితులూ నా బాధకు దూరంగా నిలుస్తున్నారు[a]; నా దగ్గరి బంధువులు దూరంగా నిలుస్తున్నారు.
  rationale: The revision removes the misleading completed-past sense from the second colon and restores the Hebrew poetic parallelism with present-state wording. It also makes the first expression more directly faithful to the Hebrew participle while retaining the draft’s broad, non-overinterpreted rendering of the affliction.
