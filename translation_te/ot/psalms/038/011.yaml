translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక గౌరవాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే రీతిలో అనువదించబడింది. మొదటి పాదంలోని కొనసాగుతున్న క్రియను, రెండవ పాదంలోని సంపూర్ణ క్రియను వేర్వేరుగా చూపించాం. ‘దగ్గరి బంధువులు’లో సమీపత్వం మరియు కుటుంబసంబంధం రెండూ ప్రతిఫలిస్తాయి.
