source:
  edition: WLC
  text: אֹֽהֲבַ֨/י וְ/רֵעַ֗/י מִ/נֶּ֣גֶד נִגְעִ֣/י יַעֲמֹ֑דוּ וּ֝/קְרוֹבַ֗/י מֵ/רָחֹ֥ק עָמָֽדוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/011.yaml
  text: My loved ones and my friends stand apart from my affliction[c][b][a], and my close kin stand far away.
translation:
  language: te
  text: నన్ను ప్రేమించేవారూ నా స్నేహితులూ నా బాధకు దూరంగా నిలుస్తున్నారు[a]; నా దగ్గరి బంధువులు దూరంగా నిలుస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నా బాధకు ఎదురుగా నిలుస్తున్నారు’ అని కూడా అనువదించవచ్చు. ‘బాధ’కు ఉపయోగించిన హీబ్రూ పదం ‘పీడ,’ ‘దెబ్బ,’ ‘గాయం,’ లేదా వ్యాధివంటి బాధను కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֲבַי
  choice: నా ప్రియులు
  rationale: ఈ రూపం కీర్తనకర్తను ప్రేమించేవారిని సూచిస్తుంది. ‘నా ప్రియులు’ అనేది ప్రేమతో కూడిన సన్నిహిత సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది; శృంగారార్థానికే పరిమితం కాదు.
- source_word: וְרֵעַי
  choice: నా స్నేహితులు
  rationale: רֵעַ స్నేహితుడు, సహచరుడు అనే భావాలను కలిగి ఉంది. సమాంతర నిర్మాణంలో ‘స్నేహితులు’ స్పష్టమైన, సహజమైన ఎంపిక.
- source_word: מִנֶּגֶד
  choice: దూరంగా
  rationale: ఈ పదానికి ‘ఎదురుగా,’ ‘ముందు,’ ‘దూరంగా’ అనే స్థలసంబంధ భావాలు ఉండవచ్చు. ఇక్కడ సామాజికంగా వెనక్కి తొలగి నిలబడే సందర్భంలో ‘దూరంగా’ సహజంగా ఉంటుంది; ‘ఎదురుగా’ అనే ప్రత్యక్ష స్థలచిత్రాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: נִגְעִי
  choice: నా బాధ
  rationale: נֶגַע దెబ్బ, గాయం, వ్యాధివంటి పీడ, బాధను సూచించగలదు. ఈ కీర్తనలోని శారీరక వేదన సందర్భాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘బాధ’ విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: יַעֲמֹדוּ
  choice: నిలుస్తున్నారు
  rationale: עמד ఒక స్థానం తీసుకొని నిలవడాన్ని సూచిస్తుంది. అపూర్ణ క్రియారూపం కొనసాగుతున్న దృశ్యాన్ని చూపే వర్తమాన రూపంతో సహజంగా అనువదించబడింది.
- source_word: וּקְרוֹבַי
  choice: నా దగ్గరి బంధువులు
  rationale: קָרוֹב సమీపంలోని వ్యక్తిని, ముఖ్యంగా దగ్గరి బంధువును సూచించగలదు. ‘దగ్గరి బంధువులు’ కుటుంబసంబంధ సంభావ్యతను, సమీపత్వ పదప్రయోగాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: מֵרָחֹק
  choice: దూరంగా
  rationale: ఈ పదబంధం స్పష్టంగా భౌతిక లేదా సామాజిక దూరాన్ని తెలియజేస్తుంది. ‘దూరంగా’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: עָמָדוּ
  choice: నిలిచారు
  rationale: ఇది సంపూర్ణ క్రియారూపం కనుక ‘నిలిచారు’ అని అనువదించాం. మొదటి పాదంలోని అపూర్ణ రూపంతో ఉన్న కాలభేదాన్ని తెలుగులోనూ కాపాడాం.
