  language: te
  text: దావీదు కీర్తన[b]; జ్ఞాపకార్థంగా[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘జ్ఞాపకంగా,’ లేదా ‘జ్ఞాపకం చేయడానికి.’ హీబ్రూ ఉద్దేశవాచక పదబంధం సంక్షిప్తంగా ఉంది; ఇది స్మారక లేదా ఆరాధనా విధిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘దావీదు కీర్తన’ అనే మాటను ‘దావీదు రచించిన కీర్తన,’ ‘దావీదు కోసం కీర్తన,’ లేదా ‘దావీదుకు చెందిన కీర్తన’ అని కూడా అర్థం చేసుకోవచ్చు. హీబ్రూ శీర్షిక సూత్రం రచయితత్వాన్ని, సంబంధాన్ని లేదా అంకితాన్ని సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: కీర్తనల శీర్షికల్లో ఈ హీబ్రూ పదం సంగీతంతో కూడిన ఆరాధనా గీతాన్ని సూచిస్తుంది. ఆధునిక తెలుగు బైబిలు భాషలో ‘కీర్తన’ సహజమైన, స్థిరపడిన ప్రక్రియా పదం.
- source_word: לְדָוִד
  choice: దావీదు కీర్తన
  rationale: హీబ్రూ לְ ఉపసర్గ రచయితను, సంబంధాన్ని, అంకితాన్ని లేదా చెందినదనాన్ని సూచించవచ్చు. తెలుగు సమాసరూపమైన ‘దావీదు కీర్తన’ ఈ అవకాశాల్లో ఒక్కదానినే ఖచ్చితంగా నిర్ధారించకుండా సంక్షిప్తంగా ఉంటుంది.
- source_word: לְהַזְכִּיר
  choice: జ్ఞాపకార్థంగా
  rationale: זכר ధాతువు హిఫీల్ క్రియార్థక నామరూపం ఇక్కడ శీర్షికలో ఉద్దేశాన్ని సూచిస్తుంది. ‘జ్ఞాపకార్థంగా’ అనేది దేవుడు జ్ఞాపకం చేసుకోవడమా, ఆరాధకుడు జ్ఞాపకం చేసుకోవడమా, లేక ఆచార సంబంధమైన స్మరణా అనే విషయాన్ని అనవసరంగా నిర్ధారించదు.
theological_decisions:
- issue: לְדָוִד అనే శీర్షిక పదబంధం దావీదు రచయితనే అని స్పష్టంగా నిర్ధారిస్తుందా?
  choice: ‘దావీదు కీర్తన’ అని ఉంచి సంబంధంలోని విస్తృతిని నిలుపుకోవడం
  alternative: ‘దావీదు రచించిన కీర్తన’ లేదా ‘దావీదు కోసం కీర్తన’
  rationale: మూలంలోని לְ అనేక సంబంధాలను వ్యక్తం చేయగలదు. రచయితత్వం లేదా అంకితాన్ని మాత్రమే నిర్బంధంగా ఎంచుకోవడం మూలంలో ఉన్న నిజమైన సందిగ్ధతను తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన కీర్తన శీర్షిక శైలిని ఉపయోగించాం. ‘జ్ఞాపకార్థంగా’ గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి మూలంలోని ఆచారపరమైన అనిశ్చితిని నిలుపుతుంది.
