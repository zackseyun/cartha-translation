  yaml_path: translation/ot/psalms/038/005.yaml
  text: My wounds stink and fester because of my foolishness[a].
translation:
  language: te
  text: నా మూర్ఖత్వం వల్ల నా గాయాలు దుర్వాసన వెదజల్లుతూ కుళ్లిపోతున్నాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా అవివేకం వల్ల నా దెబ్బమచ్చలు దుర్వాసన వెదజల్లి కుళ్లిపోయాయి.’
    reason: חַבּוּרֹתָי అనే పదానికి ‘దెబ్బమచ్చలు’ అనే అర్థం కూడా ఉంది; నָמַקּוּకు ‘కుళ్లిపోయాయి’ అనే పూర్తయిన స్థితిని సూచించే అనువాదం కూడా సాధ్యమే.
lexical_decisions:
- source_word: הִבְאִישׁוּ
  choice: దుర్వాసన కొడుతూ
  rationale: ఈ హిఫిల్ రూపం దుర్వాసన రావడం లేదా అసహ్యమైన వాసన కలగడం అనే భావాన్ని ఇస్తుంది. సందర్భంలోని శారీరక తీవ్రతను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: נָמַקּוּ
  choice: కుళ్లిపోతున్నాయి
  rationale: ఈ క్రియ క్షీణించడం, కుళ్లడం అనే భావాలను సూచిస్తుంది. గాయాల సందర్భంలో ‘కుళ్లిపోతున్నాయి’ కొనసాగుతున్న చెడిపోవడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: חַבּוּרֹתָי
  choice: నా గాయాలు
  rationale: ఈ నామవాచకానికి దెబ్బమచ్చలు, వాతలు, గాయాలు వంటి అర్థాలు ఉన్నాయి. దుర్వాసన మరియు కుళ్లడం అనే క్రియలతో కలిసి ఉన్నందున ‘గాయాలు’ సందర్భానికి అత్యంత సహజంగా సరిపోతుంది.
- source_word: מִפְּנֵי
  choice: వల్ల
  rationale: ఇక్కడ ఈ విభక్తి కారణాన్ని సూచిస్తుంది. ‘వల్ల’ ఆ కారణ సంబంధాన్ని సంక్షిప్తంగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: אִוַּלְתִּי
  choice: నా మూర్ఖత్వం
  rationale: ఈ పదం నైతిక ఛాయ కలిగిన అవివేకం లేదా మూర్ఖత్వాన్ని సూచిస్తుంది. ‘నా మూర్ఖత్వం’ కీర్తనకర్త తన బాధ్యతను ఒప్పుకుంటున్న భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: బాధకు మూర్ఖత్వంతో ఉన్న కారణ సంబంధం
  choice: నా మూర్ఖత్వం వల్ల
  alternative: నా అవివేకం కారణంగా
  rationale: హీబ్రూ పాఠం కీర్తనకర్త స్థితిని అతని సొంత మూర్ఖత్వంతో నేరుగా అనుసంధానిస్తుంది. అయితే ఈ వాక్యాన్ని సమస్త బాధలకు వర్తించే సిద్ధాంతంగా విస్తరించకుండా, ఈ వచనంలోని కారణ సంబంధాన్నే అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే కీర్తనలోని శారీరక అసహ్యతను మరియు స్వీయనింద భావాన్ని తగ్గించకుండా గౌరవప్రదమైన శైలి వాడబడింది.
