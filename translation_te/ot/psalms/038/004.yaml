    text: లేదా, ‘నా దోషభారం’; హీబ్రూ పదం దోషాలనూ, వాటివల్ల కలిగే అపరాధస్థితిని లేదా బాధ్యతనూ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: విలాపానికి కారణాన్ని పరిచయం చేసే వివరణాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עֲוֺנֹתַי
  choice: నా దోషాలు
  rationale: עָוֹן సూచించగల నైతిక అపరాధాల భావాన్ని ప్రధాన పాఠంలో ఉంచుతుంది; దోషభారం లేదా అపరాధస్థితి అనే భావసాధ్యతను పాదటిప్పణిలో నిలుపుతుంది.
- source_word: עָבְרוּ רֹאשִׁי
  choice: నా తలపైగా పొంగిపోయాయి
  rationale: తలను మించి పైకి ఎగసిన నీటి వంటి సజీవ హీబ్రూ రూపకాన్ని తెలుగులో స్పష్టంగా కాపాడుతుంది.
- source_word: כְּמַשָּׂא כָבֵד
  choice: బరువైన భారంలా
  rationale: మోయవలసిన బరువు అనే భౌతిక రూపకాన్ని సహజంగా నిలుపుతుంది.
- source_word: יִכְבְּדוּ מִמֶּנִּי
  choice: అవి నేను మోయలేనంత బరువుగా ఉన్నాయి
  rationale: మూలంలోని ‘నాకంటే బరువైనవి/నాకు మించినవి’ అనే భావాన్ని, ముందు వచ్చిన భారపు రూపకంతో అనుసంధానిస్తూ స్పష్టమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పశ్చాత్తాప సందర్భంలో עָוֹן పదానికి ఉన్న అర్థవ్యాప్తి
  choice: ప్రధాన పాఠంలో నైతిక అపరాధాలను సూచించే ‘దోషాలు’
  alternative: ‘దోషభారం’ లేదా ‘అపరాధస్థితి’—అపరాధం వల్ల కలిగే బాధ్యతను లేదా ఫలితాన్ని నొక్కిచెప్పడం
  rationale: ఈ వాక్యం కీర్తనకర్త దోషాలను ముంచెత్తే నీటిగానూ మోయలేని భారంగానూ చిత్రిస్తుంది. עָוֹן అపరాధాన్నీ దాని వల్ల కలిగే దోషభారాన్నీ సూచించగలదు కాబట్టి, ప్రధాన పాఠంలో అపరాధార్థాన్ని ఉంచి ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కవితా శైలి. నీరు తలపైకి పొంగే రూపకాన్నీ, మోయలేని భారపు రూపకాన్నీ రెండింటినీ నిలుపుకుంది.
