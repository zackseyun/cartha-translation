  text: For my iniquities have gone over my head; like a heavy burden[a], they are too heavy for me.
translation:
  language: te
  text: ఎందుకంటే నా దోషాలు[a] నా తలమీదికి ఎగసిపోయాయి; బరువైన భారంలా అవి నాకు భరించలేనంత భారంగా ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
