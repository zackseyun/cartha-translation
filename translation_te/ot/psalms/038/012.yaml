  to: నా ప్రాణం తీయాలని చూసేవారు ఉచ్చులు పన్నారు[a]; నాకు కీడు చేయాలని చూసేవారు నాశనకరమైన మాటలు పలుకుతారు[b]; వారు రోజంతా మోసపు మాటలు మాట్లాడుతూనే ఉంటారు[c].
