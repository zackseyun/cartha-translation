  text: וַ/יְנַקְשׁ֤וּ מְבַקְשֵׁ֬י נַפְשִׁ֗/י וְ/דֹרְשֵׁ֣י רָ֭עָתִ/י דִּבְּר֣וּ הַוּ֑וֹת וּ֝/מִרְמ֗וֹת כָּל הַ/יּ֥וֹם יֶהְגּֽוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/012.yaml
  text: Those who seek my life set traps[a], and those who seek my harm speak destruction[d][c][b]; all day long they mutter deceit.
translation:
  language: te
  text: నా ప్రాణం తీయాలని చూసేవారు ఉచ్చులు పన్నారు[a]; నాకు కీడు చేయాలని చూసేవారు నాశనకరమైన మాటలు పలుకుతారు[b]; వారు రోజంతా మోసపు మాటలు మాట్లాడుతూనే ఉంటారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఉచ్చులు వేశారు.’ హీబ్రూ క్రియలో ఉచ్చు పెట్టి చిక్కించాలనే భావచిత్రం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నాశనకరమైన మాటలు’ అనే హీబ్రూ పదబంధాన్ని ‘నాశనం కలిగించే సంగతులు’ లేదా ‘వినాశం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ఈ క్రియకు ‘మెల్లగా పలుకుతారు,’ ‘గొణుగుతారు,’ లేదా ‘మననం చేస్తారు’ అనే అర్థాలు కూడా ఉండవచ్చు; ఇక్కడ అది రోజంతా కొనసాగే మోసపూరిత పలుకులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַקְשׁוּ
  choice: ఉచ్చులు పన్నారు
  rationale: נקשׁ క్రియలో ఉచ్చు పెట్టి చిక్కించాలనే దృశ్యం ఉంది. ‘ఉచ్చులు పన్నారు’ సహజమైన ఆధునిక తెలుగులో ఆ శత్రుభావంతో కూడిన పొంచి పట్టుకునే భావాన్ని నిలుపుతుంది.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: నా ప్రాణం తీయాలని చూసేవారు
  rationale: శత్రుత్వ సందర్భంలో נפשׁను వెదకడం అంటే సాధారణంగా ఒకరి ప్రాణాన్ని తీయడానికి ప్రయత్నించడం; కేవలం ‘ఆత్మను వెదకడం’ కాదు.
- source_word: וְדֹרְשֵׁי רָעָתִי
  choice: నాకు కీడు చేయాలని చూసేవారు
  rationale: ఈ పదబంధం వక్తకు హాని లేదా అపాయం కలిగించేందుకు ప్రయత్నించడాన్ని సూచిస్తుంది. ఎంపిక వ్యక్తిగత దురుద్దేశాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: דִּבְּרוּ הַוּוֹת
  choice: వినాశకరమైన మాటలు పలుకుతున్నారు
  rationale: הַוּוֹת వినాశం, అపాయం లేదా వినాశకరమైన పన్నాగాలను సూచించగలదు. ‘వినాశకరమైన మాటలు’ హానికరమైన పలుకుల బలాన్ని ఉంచుతూ, నేరుగా ‘కుట్రలు పన్నారు’ అని అతివ్యాఖ్యానం చేయదు.
- source_word: וּמִרְמוֹת
  choice: మోసపు మాటలు
  rationale: מִרְמוֹת మోసం లేదా వంచనను సూచిస్తుంది. ‘మోసపు మాటలు’ అనే రూపం తరువాతి הגה క్రియతో తెలుగులో సహజంగా కలుస్తుంది.
- source_word: כָּל הַיּוֹם
  choice: రోజంతా
  rationale: నిరంతర కార్యకలాపాన్ని తెలిపే ఈ కాలపదబంధానికి సహజమైన సంక్షిప్త తెలుగు సమానం.
- source_word: יֶהְגּוּ
  choice: గొణుగుతున్నారు
  rationale: הגה గొణగడం, మెల్లగా పలకడం, ధ్యానించడం లేదా మననం చేయడం అనే అర్థాలను కలిగి ఉంటుంది. మోసం అనే కర్మతో ఉన్న ఈ శత్రుభావ సందర్భంలో ‘గొణుగుతున్నారు’ రహస్యంగా, నిరంతరం పలికే భావాన్ని నిలుపుతుంది; ‘కుట్ర పన్నుతున్నారు’ అనే అధిక వ్యాఖ్యానాన్ని నివారిస్తుంది.
