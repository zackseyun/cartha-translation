  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన కీర్తనాశైలిని అనుసరించాం. హీబ్రూ సమాంతర నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపి, అసహజమైన పదక్షర అనువాదాన్ని నివారించాం.
