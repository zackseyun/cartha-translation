  yaml_path: translation/ot/psalms/038/001.yaml
  text: O Yahweh[a], do not rebuke me in your anger[c][b], nor discipline me in your wrath.
translation:
  language: te
  text: 'యాహ్వే[a], నీ కోపంలో నన్ను గద్దించకు[b];

    నీ ఉగ్రకోపంలో నన్ను శిక్షించకు[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: יהוה (YHWH); సాంప్రదాయంగా ‘యెహోవా’ అని కూడా లిప్యంతరీకరిస్తారు.'
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘మందలించకు’ లేదా ‘సరిదిద్దకు.’
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడి హీబ్రూ పదానికి దండన ద్వారా క్రమపరచడం లేదా సరిదిద్దడం అనే భావం కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామం YHWHను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు లిపిలో దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: אַל
  choice: చేయకు
  rationale: తదనంతర క్రియలతో కలిసి వినయపూర్వకమైన నిషేధ విన్నపాన్ని తెలియజేస్తుంది; ఆధునిక తెలుగులో ‘చేయకు’ సహజంగా ఉంది.
- source_word: בְּקֶצְפְּךָ
  choice: నీ కోపంతో
  rationale: קֶצֶף దైవ అసంతృప్తితో కూడిన కోపాన్ని సూచిస్తుంది. హీబ్రూ בְּ సంబంధాన్ని తెలుగులో సహజమైన విధంగా ‘తో’ అని వ్యక్తపరిచాం.
- source_word: תוֹכִיחֵנִי
  choice: నన్ను గద్దించకు
  rationale: יכח హిఫిల్ రూపం ఇక్కడ తప్పును ఎత్తిచూపి మందలించడం లేదా సరిదిద్దడం అనే భావాన్ని కలిగి ఉంది. ‘గద్దించు’ మొదటి భావాన్ని స్పష్టంగా ఉంచి, తరువాతి יסרతో ఉన్న కవితా సమాంతరతను కాపాడుతుంది.
- source_word: וּבַחֲמָתְךָ
  choice: నీ ఉగ్రకోపంతో
  rationale: חֵמָה సాధారణ కోపం కంటే తీవ్రమైన ఆగ్రహం లేదా ఉగ్రతను సూచిస్తుంది. ముందున్న నిషేధం రెండో పాదానికీ వర్తిస్తున్నందున తెలుగులో వేరుగా ‘మరియు’ చేర్చకుండా సమాంతర నిర్మాణం ఉంచాం.
- source_word: תְיַסְּרֵנִי
  choice: నన్ను శిక్షించకు
  rationale: יסר పియేల్ రూపం దండన ద్వారా క్రమపరచడం, శిక్షణ ఇవ్వడం, సరిదిద్దడం వంటి పరిధిని కలిగి ఉంది. ‘శిక్షించు’ ఆధునిక పాఠకునికి సహజంగా ఉండగా, దాని సరిదిద్దే భావాన్ని పాదటిప్పణిలో సూచించాం.
theological_decisions:
- issue: יְהוָה అనే దైవ నామాన్ని ఎలా అందించాలి
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాకుండా దైవ వ్యక్తిగత నామమే ఉంది. అందువల్ల దానిని ‘ప్రభువు’గా మార్చకుండా లిప్యంతరీకరించాం; ప్రత్యామ్నాయ సాంప్రదాయ లిప్యంతరీకరణను పాదటిప్పణిలో ఉంచాం.
- issue: కీర్తనకర్త అసలు శిక్షణనే తిరస్కరిస్తున్నాడా, లేక కోపంలో జరిగే శిక్షణనేనా
  choice: ‘నీ కోపంతో… నీ ఉగ్రకోపంతో’ అనే పరిమితిని రెండు క్రియలతోనూ స్పష్టంగా ఉంచడం
  alternative: ‘నన్ను గద్దించకు; నన్ను శిక్షించకు’ అని కోపానికి సంబంధించిన పరిమితిని బలహీనపరచడం
  rationale: హీబ్రూ వాక్యనిర్మాణం గద్దింపును, శిక్షణను పూర్తిగా నిరాకరించకుండా, అవి దైవ కోపం లేదా ఉగ్రతలో జరగకూడదని విన్నవిస్తుంది. ఈ ధార్మిక ఉద్వేగాన్ని అనువాదం పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలిని ఉపయోగించాం. ‘కోపం/ఉగ్రకోపం’ మరియు ‘గద్దించు/శిక్షించు’ అనే సమాంతర పదజంటలు హీబ్రూ కవితా నిర్మాణాన్ని స్పష్టంగా ప్రతిబింబిస్తాయి; పురాతన క్రియాంతాలను నివారించాం.
