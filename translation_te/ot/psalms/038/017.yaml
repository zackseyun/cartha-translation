  yaml_path: translation/ot/psalms/038/017.yaml
  text: For I am ready to fall, and my pain is always before me.
translation:
  language: te
  text: ఎందుకంటే నేను పడిపోవడానికి దగ్గరగా ఉన్నాను[a]; నా వేదన ఎల్లప్పుడూ నా ఎదుట ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, కుంటడానికి లేదా తడబడడానికి దగ్గరగా ఉన్నాను.
    reason: హీబ్రూ לְצֶלַע పదంలోని కుంటడం/తడబడడం అనే సంబంధిత భావాన్ని, ప్రధాన పాఠంలోని సందర్భానుగుణమైన ‘పడిపోవడం’తో పాటు, తెలియజేయడానికి.
lexical_decisions:
- source_word: לְצֶלַע
  choice: పడిపోవడానికి
  rationale: צלע ఇక్కడ కుంటడం, తడబడడం లేదా పడిపోవడం అనే భావపరిధిని కలిగి ఉంది. సందర్భంలో సమీపిస్తున్న పతనాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేయడానికి ‘పడిపోవడానికి’ ఎంచుకున్నాం; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: נָכוֹן
  choice: సిద్ధంగా ఉన్నాను
  rationale: ‘స్థిరపరచబడిన, సిద్ధమైన’ అనే మూలభావాన్ని నిలుపుతూ, ప్రమాదం వెంటనే సంభవించబోతోందనే వాక్యభావాన్ని తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מַכְאוֹבִי
  choice: నా నొప్పి
  rationale: శారీరక లేదా మానసిక వేదన రెండింటికీ తెరిచి ఉండే సరళమైన సమానార్థక పదం.
- source_word: נֶגְדִּי תָמִיד
  choice: ఎల్లప్పుడూ నా ఎదుటే ఉంది
  rationale: ‘నిరంతరం నా ముందే’ అనే హీబ్రూ రూపకాన్ని అనవసరంగా వివరణాత్మకం చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: కీర్తనకర్త స్థితి స్వచ్ఛంద సిద్ధతనా లేక సమీపిస్తున్న పతనమా
  choice: మూలంలోని ‘సిద్ధంగా’ అనే రూపాన్ని నిలుపుతూ ‘పడిపోవడానికి సిద్ధంగా ఉన్నాను’ అని అనువదించడం
  alternative: ‘నేను పడిపోవడానికి దగ్గరగా ఉన్నాను’
  rationale: ప్రత్యామ్నాయం ఉద్దేశాన్ని సహజంగా వివరిస్తుంది గాని נָכוֹן యొక్క పదరూపాన్ని కొంత సడలిస్తుంది. ఎంపిక చేసిన రూపం మూలంలోని ఉద్విగ్నతను, అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన కీర్తనా శైలిని ఉపయోగించాం. ‘నా ఎదుటే’ అనే రూపం మూలంలోని దృశ్యరూపకాన్ని సహజంగా నిలుపుతుంది.
