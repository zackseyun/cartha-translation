  to: 'ఎందుకంటే నేను ఇలా అన్నాను: “వారు నన్నుబట్టి సంతోషించకుండునట్లు; నా కాలు జారినప్పుడు వారు నాపై విర్రవీగుతారు.”'
  rationale: The revision renders פן with a Telugu prevention/apprehension construction, clarifies that the opponents rejoice over the psalmist, and renders ‘magnify themselves against me’ with an idiomatic modern Telugu expression. The compact, somewhat elliptical quoted construction reflects the Hebrew poetic syntax without adding interpretation.
