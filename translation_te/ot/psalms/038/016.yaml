source:
  edition: WLC
  text: כִּֽי אָ֭מַרְתִּי פֶּן יִשְׂמְחוּ לִ֑/י בְּ/מ֥וֹט רַ֝גְלִ֗/י עָלַ֥/י הִגְדִּֽילוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/016.yaml
  text: For I said, “Otherwise they would rejoice over me; when my foot slips, they boast against me.”
translation:
  language: te
  text: 'ఎందుకంటే నేను ఇలా అన్నాను: “వారు నన్నుబట్టి సంతోషించకుండునట్లు; నా కాలు జారినప్పుడు వారు నాపై విర్రవీగుతారు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּן
  choice: లేకపోతే
  rationale: ఇక్కడ ఈ పదం భయపడుతున్న లేదా నివారించదలచిన పరిణామాన్ని సూచిస్తుంది; సందర్భంలో ‘లేకపోతే’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: יִשְׂמְחוּ לִי
  choice: వారు నన్ను చూసి సంతోషిస్తారు
  rationale: శత్రువులు కీర్తనకర్తకు కలిగే అపజయాన్ని చూసి సంతోషించడమే భావం; ‘నన్ను చూసి’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: בְּמוֹט רַגְלִי
  choice: నా కాలు జారినప్పుడు
  rationale: హీబ్రూ రూపకాన్ని అలాగే నిలిపి, పతనం లేదా అపజయాన్ని సూచించే సహజమైన తెలుగు వ్యక్తీకరణగా అనువదించబడింది.
- source_word: עָלַי הִגְדִּילוּ
  choice: నా మీద గొప్పలు చెప్పుకుంటారు
  rationale: పదబద్ధంగా ‘నాపై తమను గొప్ప చేసుకుంటారు’; సందర్భంలో శత్రువులు అతని అపజయంపై అతిశయంగా ప్రవర్తించడం లేదా ప్రగల్భాలు పలకడం అనే భావాన్ని ఇది స్పష్టంగా ఇస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ సహజమైన శైలి పాటించబడింది. హీబ్రూ వాక్యంలోని కారణసూచక నిర్మాణం, సంభావ్య పరిణామం, ‘కాలు జారడం’ అనే రూపకం నిలుపబడ్డాయి.
