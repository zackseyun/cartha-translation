  text: I am bent and bowed down very low[a]; all day long I go about mourning.
translation:
  language: te
  text: 'నేను వంగిపోయాను, ఎంతో కుంగిపోయాను;

    రోజంతా శోకంతో[a] తిరుగుతున్నాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మ్లానంగా’ లేదా ‘చీకటిలో ఉన్నవాడిలా’; హీబ్రూ పదం శోకంతో పాటు చీకటి, విషాదం అనే చిత్రణను కూడా కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲוֵיתִי
  choice: వంగిపోయాను
  rationale: עוה అనే మూలపదం వంగిపోవడం, మెలికపడడం, రూపం చెడిపోవడం అనే భావాలను ఇస్తుంది. తరువాతి సమాంతర క్రియతో కలిసి శారీరక, మానసిక క్షీణతను సహజమైన ఆధునిక తెలుగులో తెలియజేయడానికి ‘వంగిపోయాను’ ఎంచుకున్నాం.
- source_word: שַׁחֹתִי
  choice: కుంగిపోయాను
  rationale: שׁחח అనే మూలపదం వంగడం లేదా కిందికి దిగిపోవడం అని సూచిస్తుంది. ‘కుంగిపోయాను’ శరీరం వాలిపోవడాన్నీ అంతరంగం అణగిపోవడాన్నీ సూచిస్తూ మొదటి క్రియతో ఉన్న భావతీవ్రతను నిలుపుతుంది.
- source_word: עַד מְאֹד
  choice: ఎంతో
  rationale: ముందున్న క్రియను బలంగా తీవ్రపరిచే పదబంధం. ‘ఎంతో’ సహజమైన తెలుగులో ఆ అధిక తీవ్రతను వ్యక్తం చేస్తుంది.
- source_word: כָּל הַיּוֹם
  choice: రోజంతా
  rationale: రోజు మొత్తాన్ని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: קֹדֵר
  choice: శోకంతో
  rationale: קדר నుంచి వచ్చిన ఈ పదం చీకటిగా లేదా విషాదంగా ఉండడం, శోకించడం అనే పరస్పర సంబంధిత భావాలను కలిగి ఉంది. ఈ విలాప సందర్భంలో ‘శోకంతో’ ప్రధాన అనుభవాన్ని స్పష్టంగా తెలియజేస్తుంది; చీకటి లేదా మ్లానత చిత్రణను పాదటిప్పణిలో నిలిపాం.
- source_word: הִלָּכְתִּי
  choice: తిరుగుతున్నాను
  rationale: הלך ఇక్కడ కేవలం నడకనే కాక, రోజంతా ఒక స్థితిలో సంచరించడం లేదా జీవించడం అనే భావాన్ని ఇస్తుంది. విలాపంలోని కొనసాగుతున్న స్థితిని సహజంగా తెలియజేయడానికి ‘తిరుగుతున్నాను’ వాడాం.
