id: PSA.38.15
reference: Psalms 38:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי לְ/ךָ֣ יְהוָ֣ה הוֹחָ֑לְתִּי אַתָּ֥ה תַ֝עֲנֶ֗ה אֲדֹנָ֥/י אֱלֹהָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/015.yaml
  text: For I wait for you[a], O Yahweh; you will answer[c][b], O Lord my God.
translation:
  language: te
  text: ఎందుకంటే, యాహ్వే, నీ కోసం నేను నిరీక్షిస్తున్నాను[a]; ప్రభువా, నా దేవా, నీవే జవాబిస్తావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిరీక్షిస్తున్నాను’ అనే హీబ్రూ క్రియకు ‘ఆశిస్తున్నాను,’ ‘నిరీక్షించాను,’ లేదా ‘ఆశతో ఎదురుచూస్తున్నాను’ అనే భావం కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న సందర్భంలోని మాటకు కారణాన్ని పరిచయం చేస్తుంది; కారణార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְךָ
  choice: నీ కోసమే
  rationale: יחל క్రియతో ఎదురు చూసే లేదా ఆశగా నిరీక్షించే వ్యక్తిని לְ సూచిస్తుంది; ‘ఏ’ ద్వారా స్వతంత్ర సర్వనామంలోని కేంద్రీకరణ కూడా సహజంగా ప్రతిఫలిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంలో లిప్యంతరీకరించాం; బిరుదుతో భర్తీ చేయలేదు.
- source_word: הוֹחָלְתִּי
  choice: నేను నిరీక్షిస్తున్నాను
  rationale: יחל హిఫీల్ రూపం ఆశతో వేచియుండడం అనే భావాన్ని కలిగి ఉంది. సంపూర్ణ క్రియారూపం సూచించే స్థిరమైన వైఖరిని తెలుగులో వర్తమాన నిరంతర రూపం సహజంగా తెలియజేస్తుంది.
- source_word: אַתָּה
  choice: నీవే
  rationale: హీబ్రూలో విడిగా వచ్చిన సర్వనామంలోని ఉద్ఘాటనను తెలుగు ‘ఏ’ ప్రత్యయం స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: תַעֲנֶה
  choice: జవాబిస్తావు
  rationale: ענה అంటే ఇక్కడ జవాబివ్వడం లేదా స్పందించడం. హీబ్రూలో కర్మ స్పష్టంగా లేకపోవడంతో ‘నాకు’ అని చేర్చలేదు.
- source_word: אֲדֹנָי
  choice: నా ప్రభువా
  rationale: దైవసంబోధనను గౌరవప్రదమైన తెలుగు సంబోధనగా ఇచ్చాం. రూపంలోని ప్రథమపురుష సంబంధాన్ని ‘నా’తో వ్యక్తం చేయడం ఈ సమాంతర సంబోధనలో సహజంగా ఉంది.
- source_word: אֱלֹהָי
  choice: నా దేవా
  rationale: ప్రథమపురుష ఏకవచన ప్రత్యయాన్ని నిలుపుతూ ప్రత్యక్ష సంబోధనను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה దైవనామాన్ని ఎలా అందించాలి
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: ఇది ‘ప్రభువు’ అనే బిరుదు కాదు, వ్యక్తిగత దైవనామం. తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, మరొక సాధ్యమైన లిప్యంతరీకరణను పాదటిప్పణిలో తెలిపాం.
- issue: תַעֲנֶהలో కర్మను సరఫరా చేయాలా
  choice: కర్మను చేర్చకుండా ‘జవాబిస్తావు’
  alternative: ‘నాకు జవాబిస్తావు’
  rationale: సందర్భం ‘నాకు’ అనే భావాన్ని సూచించగలిగినా హీబ్రూ వాక్యంలో కర్మ లేదు; అందువల్ల దానిని పాఠ్యంలో స్పష్టీకరించకుండా మూలంలోని సంక్షిప్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కీర్తనాశైలిని పాటించాం. సంబోధనలకు ‘యెహోవా’, ‘నా ప్రభువా, నా దేవా’ అనే సహజ రూపాలు వాడాం; హీబ్రూ ఉద్ఘాటనను ‘నీ కోసమే’, ‘నీవే’ ద్వారా నిలిపాం.
