- from: ఎందుకంటే యెహోవా, నీ కోసమే నేను నిరీక్షిస్తున్నాను[a]; నా ప్రభువా, నా దేవా, నీవే జవాబిస్తావు.
  to: ఎందుకంటే, యాహ్వే, నీ కోసం నేను నిరీక్షిస్తున్నాను[a]; ప్రభువా, నా దేవా, నీవే జవాబిస్తావు.
  rationale: The revision aligns the rendering of יהוה with the project’s Yahweh policy, removes unwarranted emphasis from the prepositional phrase, and distinguishes the conventional title אֲדֹנָי from the explicitly possessive ‘my God.’ The present Telugu verbal form is retained as a natural poetic expression of ongoing hopeful waiting, while the footnote notes the perfect-form alternative.
