  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి. అర్ధవిరామం కవితా సమాంతరత్వాన్ని చూపుతుంది; దీర్ఘరేఖ రెండో పాదంలోని ఆకస్మిక తృతీయ పురుష మార్పును పాఠకుడికి స్పష్టంగా సూచిస్తుంది.
