source:
  edition: WLC
  text: וַ/אֲנִ֣י כְ֭/חֵרֵשׁ לֹ֣א אֶשְׁמָ֑ע וּ֝/כְ/אִלֵּ֗ם לֹ֣א יִפְתַּח פִּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/013.yaml
  text: But I[a], like a deaf man, do not hear; and like a mute man[b], I do not open my mouth.
translation:
  language: te
  text: 'కాని నేను చెవిటివానిలా వినను;

    మూగవానిలా—అతడు తన నోరు తెరవడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో మొదటి పాదంలోని ‘నేను వినను’ అనే ప్రథమ పురుష రూపం నుంచి రెండో పాదంలో ‘అతడు తన నోరు తెరవడు’ అనే తృతీయ పురుష రూపానికి మార్పు ఉంది. ఇది మూగవాని గురించిన పోలికను కొనసాగిస్తున్నట్లు అర్థం చేసుకోవచ్చు. భావసామ్యాన్ని బట్టి ‘మూగవానిలా నేను నా నోరు తెరవను’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: కాని నేను
  rationale: సందర్భంలో శత్రువుల మాటలకు కీర్తనకర్త చూపిన వైఖరితో వ్యత్యాసాన్ని וַאֲנִי సూచిస్తుంది; అందువల్ల ‘కాని నేను’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: כְחֵרֵשׁ
  choice: చెవిటివానిలా
  rationale: כְ పోలికను సూచిస్తుంది; חֵרֵשׁ వినలేని వ్యక్తిని సూచిస్తుంది. ఈ ఎంపిక ఏకవచన పోలికను నిలుపుతుంది.
- source_word: לֹא אֶשְׁמָע
  choice: వినను
  rationale: שׁמע యొక్క ప్రాథమిక అర్థం ‘విను’. ఇక్కడ స్పందించకపోవడం అంతర్లీనంగా ఉన్నప్పటికీ, మూలంలోని శ్రవణ రూపకాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: וּכְאִלֵּם
  choice: మూగవానిలా
  rationale: אִלֵּם మాట్లాడలేని వ్యక్తిని సూచిస్తుంది; ఇది ముందటి ‘చెవిటివానిలా’ అనే పోలికకు సమాంతరంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: לֹא יִפְתַּח פִּיו
  choice: అతడు తన నోరు తెరవడు
  rationale: హీబ్రూ రెండో పాదంలో మూడవ పురుష ఏకవచనానికి మారి, ‘అతని నోరు’ అని చెబుతుంది. ఈ అనువాదం ఆ వ్యక్తి మార్పును, ‘నోరు తెరవడు’ అనే మూల నుడికారాన్ని నిలుపుతుంది.
