  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַל תַּֽעַזְבֵ֥/נִי יְהוָ֑ה אֱ֝לֹהַ֗/י אַל תִּרְחַ֥ק מִמֶּֽ/נִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/021.yaml
  text: Do not forsake me[a], O Yahweh my God; do not be far from me.
translation:
  language: te
  text: 'యాహ్వే, నన్ను విడిచిపెట్టవద్దు;

    నా దేవా, నా నుండి దూరంగా ఉండవద్దు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל
  choice: వద్దు
  rationale: జస్సివ్/అసంపూర్ణ క్రియతో వచ్చిన నిషేధార్థక అవ్యయం; ప్రార్థనలోని ప్రత్యక్ష విన్నపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: תַּעַזְבֵנִי
  choice: నన్ను విడిచిపెట్టవద్దు
  rationale: עזב అంటే ‘విడిచిపెట్టు, త్యజించు.’ ‘విడిచిపెట్టవద్దు’ విలాపంలోని గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామం יהוהను తెలుగులో విస్తృతంగా గుర్తించదగిన నామరూపమైన ‘యెహోవా’గా లిప్యంతరీకరించింది; బిరుదుతో భర్తీ చేయలేదు.
- source_word: אֱלֹהַי
  choice: నా దేవా
  rationale: మొదటి పురుష ఏకవచన స్వామ్యప్రత్యయం కలిగిన సంబోధన ‘నా దేవా’; దైవనామంతో పాటు వ్యక్తిగత విన్నపాన్ని నిలుపుతుంది.
- source_word: תִּרְחַק
  choice: దూరంగా ఉండవద్దు
  rationale: רחק అంటే ‘దూరంగా ఉండు/అవు.’ ఉద్దేశపూర్వకంగా తొలగిపోవడం వంటి అదనపు భావాన్ని చేర్చకుండా మూలంలోని స్థితిని సహజంగా తెలుపుతుంది.
- source_word: מִמֶּנִּי
  choice: నాకు
  rationale: తెలుగులో ‘నాకు దూరంగా’ అనేది ‘నా నుండి దూరంగా’ కంటే సహజమైన ప్రయోగం; సంబంధార్థాన్ని యథాతథంగా అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నామరూపంగానే ఉంచింది. ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపం; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించే ప్రత్యామ్నాయ లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనా-విలాపానికి తగిన గంభీరతతో, అయినా సాధారణ పాఠకుడికి స్పష్టంగా ఉండే సంక్షిప్త సమాంతర వాక్య నిర్మాణం. హీబ్రూ రెండు ప్రత్యక్ష నిషేధ విన్నపాల సమాంతరతను నిలిపింది.
