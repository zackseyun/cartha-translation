source:
  edition: WLC
  text: וּ/מְשַׁלְּמֵ֣י רָ֭עָה תַּ֣חַת טוֹבָ֑ה יִ֝שְׂטְנ֗וּ/נִי תַּ֣חַת רדופ/י טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/020.yaml
  text: And those who repay evil for good oppose me[a], because I pursue what is good.
translation:
  language: te
  text: 'మేలుకు ప్రతిగా కీడు చేసే వారు,

    నేను మేలును అనుసరిస్తున్నందుకు నన్ను ఎదిరిస్తున్నారు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “నేను మేలును అనుసరిస్తున్న దానికి ప్రతిగా వారు నన్ను ఎదిరిస్తున్నారు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְשַׁלְּמֵי
  choice: చేసే వారు
  rationale: שׁלם అనే క్రియ యొక్క కర్తృవాచక రూపం ప్రతిగా తిరిగి చేయడాన్ని సూచిస్తుంది. ‘మేలుకు ప్రతిగా కీడు చేసే వారు’ అనే మొత్తం పదబంధంలో ఈ పరస్పర ప్రతిఫల భావం సహజమైన తెలుగులో స్పష్టంగా నిలుస్తుంది.
- source_word: רָעָה
  choice: కీడు
  rationale: ‘మేలు’కు వ్యతిరేకంగా నైతికంగానూ కార్యపరంగానూ చెడును సూచించడానికి ‘కీడు’ సహజంగా సరిపోతుంది.
- source_word: תַּחַת
  choice: ప్రతిగా / …నందుకు
  rationale: మొదటి సందర్భంలో మార్పిడి లేదా ప్రతిఫల భావాన్ని ‘ప్రతిగా’ నేరుగా వ్యక్తం చేస్తుంది. రెండవ సందర్భంలో అదే సంబంధాన్ని సహజమైన తెలుగులో కారణార్థకంగా ‘…నందుకు’ అని అందించాం; అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: טוֹבָה
  choice: మేలు
  rationale: చేసిన లేదా పొందిన మంచిని సూచించే నామవాచకం. ‘కీడు—మేలు’ అనే సంక్షిప్త వ్యతిరేకతను ఇది నిలుపుతుంది.
- source_word: יִשְׂטְנוּנִי
  choice: నన్ను ఎదిరిస్తున్నారు
  rationale: שׂטן అనే క్రియలోని విరోధించడం లేదా ప్రత్యర్థిగా నిలవడం అనే భావాన్ని, న్యాయస్థాన ఆరోపణకే పరిమితం చేయకుండా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: רְדֹפִי
  choice: నేను … అనుసరిస్తున్నందుకు
  rationale: רדף యొక్క మూలభావం వెంబడించడం లేదా అనుసరించడం. ఇక్కడ మేలును చురుకుగా కోరుతూ దాని మార్గంలో నడవడాన్ని ‘అనుసరించడం’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: טוֹב
  choice: మేలును
  rationale: విశేషణం ఇక్కడ నామవాచకార్థంలో వాడబడింది. ‘మేలును’ దాని సంక్షిప్తతను, నైతిక భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: రెండవ תַּחַת పదబంధం యొక్క సంబంధం
  choice: నేను మేలును అనుసరిస్తున్నందుకు
  alternative: నేను మేలును అనుసరిస్తున్న దానికి ప్రతిగా
  rationale: ఈ పదబంధం వారి విరోధం కీర్తనకర్త మేలును అనుసరించడంతో ముడిపడి ఉందని తెలియజేస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన కారణార్థక తెలుగు వాడి, హెబ్రీ పదనిర్మాణంలోని ప్రతిఫల భావాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కవితాత్మక శైలిని పాటించాం. ‘కీడు—మేలు’ వ్యతిరేకతను, విరోధం మరియు మేలును చురుకుగా అనుసరించడం అనే భావాలను సంక్షిప్తంగా నిలిపాం.
