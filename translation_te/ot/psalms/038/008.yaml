revisions:
- from: నేను సొమ్మసిల్లి, పూర్తిగా నలిగిపోయాను; నా హృదయపు మూలుగును బట్టి నేను గర్జిస్తున్నాను.
  to: నేను బలహీనమై, అత్యంతంగా నలిగిపోయాను; నా హృదయపు మూలుగు వల్ల నేను గర్జించాను.
  rationale: The revision preserves the Hebrew's emphatic physical and inward anguish, corrects “completely” to an intensity expression, improves modern Telugu flow, and retains the deliberately strong “roar” image found in both the Hebrew and the English POB audit text.
