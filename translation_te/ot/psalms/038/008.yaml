  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనలోని తీవ్రమైన శారీరక-అంతరంగ వేదనను గౌరవప్రదంగా మరియు స్పష్టంగా వ్యక్తం చేశాం. ‘గర్జిస్తున్నాను’ అనే బలమైన చిత్రాన్ని మృదువుచేయలేదు.
