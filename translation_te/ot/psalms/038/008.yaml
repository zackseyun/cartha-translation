  text: I am faint and utterly crushed; I roar because of the groaning of my heart.
translation:
  language: te
  text: నేను బలహీనమై, అత్యంతంగా నలిగిపోయాను; నా హృదయపు మూలుగు వల్ల నేను గర్జించాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְפוּגוֹתִי
  choice: నేను సొమ్మసిల్లి
  rationale: ఈ రూపం బలహీనపడటం, శక్తి క్షీణించడం అనే భావాన్ని వ్యక్తం చేస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ‘సొమ్మసిల్లి’ ఎంచుకున్నాం.
- source_word: וְנִדְכֵּיתִי עַד־מְאֹד
  choice: పూర్తిగా నలిగిపోయాను
  rationale: ‘అత్యంతగా అణగదొక్కబడటం/కృంగిపోవటం’ అనే తీవ్రమైన భావాన్ని నిలుపుతుంది.
- source_word: שָׁאַגְתִּי
  choice: నేను గర్జిస్తున్నాను
  rationale: ఈ క్రియ సాధారణ మూలుగుకన్నా బలమైన, సింహగర్జనలాంటి వేదనారావాన్ని సూచిస్తుంది; ఆ తీవ్రతను తగ్గించకుండా అనువదించాం.
- source_word: מִנַּהֲמַת לִבִּי
  choice: నా హృదయపు మూలుగును బట్టి
  rationale: מִן కారణార్థకంగా ‘వల్ల/బట్టి’ అని, נַהֲמָה అంతరంగ మూలుగు లేదా గుభాళింపును సూచించేదిగా తీసుకున్నాం; హృదయానికే ఆ మూలుగును ఆపాదించే మూలపాఠ్య రూపకాన్ని నిలిపాం.
