  yaml_path: translation/ot/psalms/038/014.yaml
  text: And I became like a man who does not hear[a], and in whose mouth there are no reproofs.
translation:
  language: te
  text: వినని మనిషివలె నేను అయ్యాను; అతని నోటిలో ఎటువంటి ప్రతివాదాలూ లేవు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గద్దింపులు,’ ‘వాదనలు,’ లేదా ‘జవాబులు.’ హీబ్రూ పదం మాటలతో చేసే దిద్దుబాట్లను లేదా ఎదిరించి చెప్పే ప్రత్యుత్తరాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: నేను ... అయ్యాను
  rationale: היה యొక్క వయిక్టోల్ రూపం సందర్భంలోని పోలికను ముందుకు తీసుకెళ్తుంది; ‘అయ్యాను’ అనేది స్థితిలోకి వచ్చిన భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: כְּאִישׁ
  choice: మనిషిలా
  rationale: אִישׁ పుంలింగ ఏకవచనాన్ని, పోలికను సంక్షిప్తంగా మరియు సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֲשֶׁר לֹא שֹׁמֵעַ
  choice: వినని
  rationale: שׁמע యొక్క ప్రత్యక్ష అర్థమైన ‘విను’ను నిలుపుతూ, మూలంలో లేని అసమర్థత భావాన్ని చేర్చదు.
- source_word: וְאֵין בְּפִיו
  choice: నా నోటిలో ... ఏవీ లేవు
  rationale: హీబ్రూ వాక్యంలో ‘అతని నోటిలో’ అన్నది పోల్చబడుతున్న వ్యక్తిని సూచిస్తుంది; తెలుగులో వక్తతో పోలిక స్పష్టంగా ఉండేందుకు మొదటి పురుషంలో సహజంగా వ్యక్తీకరించబడింది, నోటి రూపకాన్ని మాత్రం నిలిపింది.
- source_word: תּוֹכָחוֹת
  choice: ప్రతివాదాలు
  rationale: ఈ బహువచన పదం గద్దింపులు, వాదనలు లేదా ప్రత్యుత్తరాలను సూచించగలదు. నిందించేవారి ఎదుట మౌనంగా ఉండే సందర్భంలో ‘ప్రతివాదాలు’ స్పందనాత్మక వాదన భావాన్ని చక్కగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన కవితా వాక్యంగా రూపొందించబడింది. ‘వినని’ మరియు ‘నోటిలో’ అనే మూల రూపకాలు నిలుపబడ్డాయి; תּוֹכָחוֹת యొక్క సందర్భానుకూల భావానికి ‘ప్రతివాదాలు’ ఎంచుకొని, దాని నిజమైన పదార్థ విస్తృతిని పాదసూచికలో తెలిపాం.
