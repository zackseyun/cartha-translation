id: PSA.38.19
reference: Psalms 38:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְֽ֭/אֹיְבַ/י חַיִּ֣ים עָצֵ֑מוּ וְ/רַבּ֖וּ שֹׂנְאַ֣/י שָֽׁקֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/019.yaml
  text: And my enemies are alive and strong[a], and those who hate me falsely are many.
translation:
  language: te
  text: 'నా శత్రువులు సజీవంగా, బలంగా ఉన్నారు;

    అబద్ధంగా[a] నన్ను ద్వేషించేవారు చాలామంది ఉన్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కారణం లేకుండా నన్ను ద్వేషించేవారు.’ שָׁקֶר అనే హీబ్రూ పదానికి అక్షరార్థంగా ‘అబద్ధం/అసత్యం’ అని అర్థం; అది వారి ద్వేషం అబద్ధమైనదని గానీ, దానికి ఆధారం లేదని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבַי
  choice: నా శత్రువులు
  rationale: వ్యక్తిగతంగా కీర్తనకర్తకు విరోధులైనవారిని సూచించే నామవాచకానికి ఇది నేరమైన, సహజమైన తెలుగు అనువాదం.
- source_word: חַיִּים
  choice: సజీవంగా ఉండి
  rationale: శత్రువులు ‘జీవించి ఉన్నారు’ అనే హీబ్రూ విశేషణ భావాన్ని నిలుపుతూ, కీర్తనకర్త బలహీన స్థితికి వారిని వ్యతిరేకంగా చూపుతుంది.
- source_word: עָצֵמוּ
  choice: బలంగా ఉన్నారు
  rationale: బలపడడం లేదా శక్తిమంతులుగా ఉండడం అనే భావాన్ని సందర్భానుసారంగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: רַבּוּ
  choice: అనేకమంది
  rationale: వారి సంఖ్య అధికమైందనే ఫిర్యాదును సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: שֹׂנְאַי
  choice: నన్ను ద్వేషించేవారు
  rationale: నామవాచకంగా పనిచేస్తున్న హీబ్రూ కృదంతంలోని క్రియాత్మక భావాన్ని కాపాడుతుంది.
- source_word: שָׁקֶר
  choice: అబద్ధంగా
  rationale: ‘అబద్ధం/అసత్యం’ అనే నామవాచకం ఇక్కడ క్రియావిశేషణ భావంలో ఉండవచ్చు; వారి ద్వేషంలోని అసత్యాన్ని నేరుగా వ్యక్తం చేస్తుంది, అయితే ‘కారణం లేకుండా’ అనే భావమూ సాధ్యమే.
theological_decisions:
- issue: שָׁקֶר వారి ద్వేషం అబద్ధమైనదని సూచిస్తుందా, లేక కారణరహితమని సూచిస్తుందా?
  choice: అబద్ధంగా నన్ను ద్వేషించేవారు
  alternative: కారణం లేకుండా నన్ను ద్వేషించేవారు
  rationale: మూలపదంలోని ‘అబద్ధం/అసత్యం’ అనే ప్రాథమిక భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సందర్భానుసారమైన ‘కారణం లేకుండా’ అనే అర్థాన్ని పాదసూచికలో ఇచ్చి నిజమైన అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కవితా వాక్యనిర్మాణం వాడబడింది. హీబ్రూ సమాంతర నిర్మాణాన్ని రెండు పాదాలుగా నిలిపి, שָׁקֶר లోని అర్థసందిగ్ధతను పాదసూచికలో సంరక్షించాం.
