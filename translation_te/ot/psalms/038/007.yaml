source:
  edition: WLC
  text: כִּֽי כְ֭סָלַ/י מָלְא֣וּ נִקְלֶ֑ה וְ/אֵ֥ין מְ֝תֹ֗ם בִּ/בְשָׂרִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/007.yaml
  text: For my loins are filled with burning[b][a], and there is no soundness in my flesh.
translation:
  language: te
  text: ఎందుకంటే నా నడుము భాగమంతా మంటతో నిండిపోయింది[a]; నా శరీరంలో ఆరోగ్యంగా ఉన్న చోటే లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మంట” అని అనువదించిన హీబ్రూ పదం అర్థం కష్టమైనది; దీనిని “వాపు” లేదా “దహనం” అని కూడా అర్థం చేసుకోవచ్చు. “నడుము భాగం” అనే పదం పక్కలు లేదా తుంటి పరిసరాలను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న విలాపానికి కారణాన్ని పరిచయం చేసే వివరణాత్మక సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כְסָלַי
  choice: నా నడుము భాగమంతా
  rationale: ఈ పదం నడుము, పక్కలు, తుంటి పరిసరాలతో కూడిన మధ్య/కింది దేహభాగాన్ని సూచించగలదు; తెలుగు పాఠకులకు సహజంగా ఉండేలా, ఒకే అవయవానికి అతిగా పరిమితం చేయకుండా అనువదించబడింది.
- source_word: מָלְאוּ
  choice: నిండిపోయింది
  rationale: పూర్తిగా ఆవరించిన ఫలితస్థితిని సహజమైన తెలుగు క్రియారూపంలో వ్యక్తం చేస్తుంది.
- source_word: נִקְלֶה
  choice: మంట
  rationale: సందిగ్ధమైన ఈ పదం సందర్భంలో దహనం లేదా వాపుతో కూడిన శారీరక బాధను సూచించే అవకాశం ఉంది; మూలంలో స్పష్టంగా లేని ‘పుండ్లు’ను చేర్చకుండా ‘మంట’గా ఉంచడం అర్థసంభావ్యతను కాపాడుతుంది.
- source_word: וְאֵין מְתֹם
  choice: ఆరోగ్యంగా ఉన్న చోటే లేదు
  rationale: శరీరంలో ఏ భాగమూ క్షేమంగా లేదా చెక్కుచెదరకుండా లేదనే అర్థాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: בִּבְשָׂרִי
  choice: నా శరీరంలో
  rationale: ఇక్కడ శారీరక బాధే సందర్భం; తెలుగు భాషలో ‘నా మాంసంలో’ కంటే ‘నా శరీరంలో’ సహజంగా, అపార్థం లేకుండా ఉంటుంది.
theological_decisions:
- issue: బְּשָׂרִי అనే పదానికి ఈ శారీరక విలాపంలో ఉన్న అర్థం
  choice: అక్షరార్థమైన ‘నా శరీరంలో’
  alternative: ‘నా మాంసంలో’ లేదా రూపకాలంకారమైన మానవ స్వభావం
  rationale: నడుము భాగం, మంట, ఆరోగ్యలేమి అన్నీ శారీరక వేదనను వర్ణిస్తున్నాయి; ఇక్కడ ప్రత్యేకమైన మానవశాస్త్రీయ లేదా నైతిక భావాన్ని ప్రవేశపెట్టడానికి ఆధారం లేదు.
- issue: נִקְלֶה యొక్క కష్టమైన అర్థం
  choice: మంట
  alternative: వాపు, మండే పుండ్లు, హీనత్వం
  rationale: శరీరబాధ సందర్భం భౌతిక దహనం/వాపు భావానికి మద్దతిస్తుంది. అయితే మూలపదం ‘పుండ్లు’ అని స్పష్టంగా చెప్పదు; అందువల్ల ఆ వివరాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే భాష వాడబడింది. హీబ్రూ వాక్యంలోని శారీరక తీవ్రతను నిలుపుతూ, సందిగ్ధమైన נִקְלֶה లో లేని ‘పుండ్లు’ వంటి నిర్దిష్ట వైద్య వివరాన్ని చేర్చలేదు.
