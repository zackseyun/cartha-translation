  yaml_path: translation/ot/psalms/038/010.yaml
  text: My heart throbs[a]; my strength has left me[b], and the light of my eyes—even they are not with me.
translation:
  language: te
  text: నా హృదయం దడదడలాడుతోంది; నా బలం నన్ను విడిచిపోయింది; నా కళ్ల వెలుగు[a] కూడా నాతో లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా కళ్లలోని వెలుగు’; ఈ హీబ్రూ ప్రయోగం చూపునే గాని, కళ్లలో కనిపించే కాంతిని లేదా జీవకళను గాని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי
  choice: నా హృదయం
  rationale: శారీరక బాధ, జీవశక్తి క్షీణత సందర్భంలో לֵב‌ను సహజమైన, కవితాత్మకమైన ‘హృదయం’గా అనువదించాం.
- source_word: סְחַרְחַר
  choice: దడదడలాడుతోంది
  rationale: ఈ పదం తిరుగుడు లేదా కలత భావాన్ని సూచిస్తుంది; ఇక్కడ బలం క్షీణించడం, కళ్ల వెలుగు పోవడం అనే శారీరక సందర్భంలో గుండె అస్థిరంగా కొట్టుకోవడాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: עֲזָבַנִי כֹחִי
  choice: నా బలం నన్ను విడిచిపోయింది
  rationale: עזב యొక్క ‘విడిచిపోవు’ భావాన్ని నిలుపుతూ, כֹּחַను శారీరక బలంగా స్పష్టంగా అందిస్తుంది.
- source_word: וְאוֹר עֵינַי
  choice: నా కళ్ల వెలుగు
  rationale: హీబ్రూ కవితాత్మక రూపకాన్ని నిలుపుతుంది; ఇది చూపునైనా, కళ్లలో కనిపించే కాంతి లేదా జీవకళనైనా సూచించగలదు.
- source_word: גַּם הֵם אֵין אִתִּי
  choice: కూడా నాకు లేకపోయింది
  rationale: హీబ్రూలో బహువచన సర్వనామం ‘కళ్లు’ను సూచించినా, తెలుగులో ‘కళ్ల వెలుగు’ ఏకవచన భావంగా సహజంగా వస్తుంది. ‘కూడా’ గַּם యొక్క ఉద్ఘాటనను నిలుపుతుంది; ‘నాకు లేకపోయింది’ אֵין אִתִּי యొక్క భావాన్ని సహజంగా అందిస్తుంది.
