  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֲֽדֹנָ/י נֶגְדְּ/ךָ֥ כָל תַּאֲוָתִ֑/י וְ֝/אַנְחָתִ֗/י מִמְּ/ךָ֥ לֹא נִסְתָּֽרָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/009.yaml
  text: Lord[a], all my desire is before you[b], and my groaning is not hidden from you.
translation:
  language: te
  text: ప్రభువా, నా కోరిక అంతా[a] నీ ఎదుట ఉంది; నా మూలుగు[b] నీకు దాగి లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా ఆరాటమంతా.’
    reason: תַּאֲוָה అనే పదం ఈ విలాప సందర్భంలో ‘కోరిక’తో పాటు లోతైన ‘ఆరాటం’ లేదా ‘ఆశ’ను కూడా సూచించగలదు.
  - marker: b
    text: లేదా, ‘నా నిట్టూర్పు.’
    reason: אֲנָחָה బాధను వ్యక్తపరిచే ‘మూలుగు’ లేదా ‘నిట్టూర్పు’ అనే రెండింటినీ సూచించగలదు.
lexical_decisions:
- source_word: אֲדֹנָי
  choice: ప్రభువా
  rationale: దేవుణ్ణి నేరుగా సంబోధించే బిరుదు. మూలంలో యెహోవా అనే దైవనామం కాక אֲדֹנָי ఉన్నందున, ఆధునిక తెలుగులో సహజమైన సంబోధన రూపమైన ‘ప్రభువా’ను వాడాం.
- source_word: נֶגְדְּךָ
  choice: నీ ఎదుటే
  rationale: ఒకరి సన్నిధిలో లేదా దృష్టికి బహిర్గతంగా ఉండడాన్ని సూచిస్తుంది. ‘నీ ఎదుటే’ అనే రూపం దేవునికి కీర్తనకర్త కోరిక పూర్తిగా తెలిసి ఉందనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כָל תַּאֲוָתִי
  choice: నా కోరిక అంతా
  rationale: כָל సూచించే సంపూర్ణతను నిలుపుతూ, ఏకవచనమైన תַּאֲוָתִיకు అనుగుణంగా ‘నా కోరిక అంతా’ అని అనువదించాం. విలాప సందర్భంలో ఇది తీవ్రమైన ఆశ లేదా ఆరాటాన్ని సూచిస్తుంది.
- source_word: וְאַנְחָתִי
  choice: నా మూలుగు
  rationale: బాధలోనుంచి వెలువడే లోతైన నిట్టూర్పు లేదా మూలుగును ఈ పదం సూచించగలదు. విలాప తీవ్రతను నిలుపడానికి ‘మూలుగు’ను ఎంచుకున్నాం.
- source_word: מִמְּךָ לֹא נִסְתָּרָה
  choice: నీకు మరుగుగా లేదు
  rationale: దేవుని నుండి అది దాచబడలేదనే నిషేధార్థక నిష్క్రియ స్థితిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: אֲדֹנָי అనే దైవ సంబోధనను యెహోవా అనే దైవనామం నుండి వేరుగా చూపడం
  choice: ప్రభువా
  alternative: యెహోవా
  rationale: మూలపాఠంలో ఇక్కడ చతురక్షర దైవనామమైన יהוה కాక אֲדֹנָי ఉంది. అందువల్ల దైవనామాన్ని దిగుమతి చేయకుండా ప్రభుత్వ బిరుదునే అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనా-విలాప గాంభీర్యాన్ని నిలుపుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే సంక్షిప్త వాక్య నిర్మాణం వాడబడింది. ‘ఎదుటే’లోని ఉద్ఘాటన దేవుని దృష్టికి ఏదీ దాగి లేదనే సమాంతర భావాన్ని బలపరుస్తుంది.
