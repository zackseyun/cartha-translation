review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the direct address אֲדֹנָי as “ప్రభువా,” retains the totality of כָּל, and correctly conveys that the psalmist’s desire is in God’s presence and that his groaning is not concealed from God. The added emphasis in “ఎదుటే” is not required by the Hebrew, and the final expression can be made more idiomatic while preserving the passive sense.
  naturalness: “నా మూలుగు నీకు మరుగుగా లేదు” is understandable but not natural modern standard Telugu. “నా మూలుగు నీకు దాగి లేదు” is idiomatic and clearly expresses that it is not hidden from God. Removing the extra emphatic particle from “నీ ఎదుటే” yields a closer, smoother rendering.
  terminology: “ప్రభువా” appropriately distinguishes אֲדֹנָי, a title, from the divine name YHWH. “కోరిక” and “మూలుగు” fit the lament register; the supplied alternatives “ఆరాటం” and “నిట్టూర్పు” are defensible lexical alternatives.
  issues:
  - severity: low
    issue: Unnecessary emphasis in “నీ ఎదుటే”
    rationale: The Hebrew נֶגְדְּךָ means “before you/in your presence” but does not itself add an explicit emphatic particle. “నీ ఎదుట” is both sufficient and closer.
  - severity: medium
    issue: Awkward expression “నీకు మరుగుగా లేదు”
    rationale: This is less idiomatic in contemporary Telugu and can sound as though the groaning is not obscure rather than not concealed. “నీకు దాగి లేదు” naturally communicates the source’s ‘is not hidden from you.’
  revised_text: ప్రభువా, నా కోరిక అంతా[a] నీ ఎదుట ఉంది; నా మూలుగు[b] నీకు దాగి లేదు.
  revised_footnotes:
