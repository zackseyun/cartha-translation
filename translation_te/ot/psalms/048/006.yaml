  text: רְ֭עָדָה אֲחָזָ֣תַ/ם שָׁ֑ם חִ֝֗יל כַּ/יּוֹלֵֽדָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/006.yaml
  text: Trembling seized them there[a], anguish like a woman in labor.
translation:
  language: te
  text: అక్కడ వణుకు వారిని పట్టుకుంది; ప్రసవవేదనలో ఉన్న స్త్రీ వలె వారికి వేదన[a] కలిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రసవవేదనలో ఉన్న స్త్రీలా మెలికలు తిరిగే బాధ”; హీబ్రూ חִיל అనే పదం తీవ్రమైన బాధతో పాటు దానివల్ల కలిగే మెలికలు తిరగడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְעָדָה
  choice: వణుకు
  rationale: శరీరం వణకడం లేదా కంపించడాన్ని సూచించే నామవాచకం; భయాన్ని మాత్రమే కాక స్పష్టమైన శారీరక చిత్రాన్ని కూడా నిలుపుతుంది.
- source_word: אֲחָזָתַם
  choice: వారిని పట్టుకుంది
  rationale: אחז అనే క్రియలోని ‘పట్టుకోవడం, బిగిగా స్వాధీనపరచుకోవడం’ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; స్త్రీలింగ ఏకవచన క్రియ ‘వణుకు’తో అన్వయిస్తుంది.
- source_word: שָׁם
  choice: అక్కడ
  rationale: స్థలాన్ని సూచించే క్రియావిశేషణానికి నేరుగా, సహజంగా సరిపోతుంది.
- source_word: חִיל
  choice: వేదన
  rationale: ఈ నామవాచకం తీవ్రమైన బాధ, పురిటినొప్పి, బాధతో మెలికలు తిరగడం వంటి భావాలను సూచించగలదు; తరువాతి ప్రసవ ఉపమానంతో కలిపి ‘వేదన’ విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: כַּיּוֹלֵדָה
  choice: ప్రసవిస్తున్న స్త్రీకి కలిగే వేదనవంటి
  rationale: ילד ధాతువు నుంచి వచ్చిన స్త్రీలింగ కృదంతం ప్రసవ ప్రక్రియలో ఉన్న స్త్రీని సూచిస్తుంది; తెలుగు వాక్యంలో ఉపమానం స్పష్టంగా, సహజంగా వినిపించేలా రెండవ ‘వేదన’తో అనుసంధానించబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని రెండు భాగాల తీవ్రతను నిలుపుతూ, חִיל యొక్క శారీరక-భావోద్వేగ విస్తృతిని పాదసూచికలో భద్రపరచింది.
