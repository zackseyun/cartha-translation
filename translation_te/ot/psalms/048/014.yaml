source:
  edition: WLC
  text: כִּ֤י זֶ֨ה אֱלֹהִ֣ים אֱ֭לֹהֵי/נוּ עוֹלָ֣ם וָ/עֶ֑ד ה֖וּא יְנַהֲגֵ֣/נוּ עַל מֽוּת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/014.yaml
  text: For this God is our God forever and ever; he will guide us beyond death.
translation:
  language: te
  text: 'ఎందుకంటే ఈ దేవుడే యుగయుగాలకు మన దేవుడు;

    మరణానికీ ఆవల ఆయనే మనలను నడిపిస్తాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: చివరి హీబ్రూ పదబంధం అర్థం అనిశ్చితం. దీనిని “మరణం వరకు” లేదా, వేరే పదవిభజన ప్రకారం, “ఎల్లప్పుడూ” అని కూడా అనువదిస్తారు.
    reason: עַל־מוּתకు సంబంధించిన నిజమైన పాఠార్థ, పదవిభజన అనిశ్చితిని పాఠకునికి తెలియజేయడానికి.
lexical_decisions:
- source_word: כִּי זֶה אֱלֹהִים
  choice: ఎందుకంటే ఈ దేవుడే
  rationale: כִּי కారణసూచకంగా ఉంది; זֶה אֱלֹהִיםను సహజమైన తెలుగులో చూపుతూ ‘ఏ’ నిశ్చయార్థక ప్రత్యయంతో గుర్తింపు బలాన్ని నిలిపింది.
- source_word: אֱלֹהֵינוּ עוֹלָם וָעֶד
  choice: యుగయుగాలకు మన దేవుడు
  rationale: עוֹלָם וָעֶד యొక్క నిరంతర, శాశ్వత కాలభావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הוּא יְנַהֲגֵנוּ
  choice: ఆయనే మనలను నడిపిస్తాడు
  rationale: הוּא యొక్క ఉద్ఘాటనను ‘ఆయనే’ నిలుపుతుంది; יְנַהֲגֵנוּకు మార్గనిర్దేశం, నడిపింపు భావమున్న సరళమైన సమానార్థకం వాడబడింది.
- source_word: עַל־מוּת
  choice: మరణానికీ ఆవల
  rationale: మసొరెటిక్ విభజన ప్రకారం ‘మరణం’తో సంబంధమున్న క్లిష్ట పదబంధాన్ని ఆంగ్ల సంప్రదింపు పాఠంతో అనుగుణంగా, మరణాన్ని దాటి కొనసాగే నడిపింపుగా అందిస్తుంది; పాఠార్థ అనిశ్చితిని పాదటిప్పణిలో వెల్లడించింది.
theological_decisions:
- issue: దేవుని నడిపింపు మరణానంతరమూ కొనసాగుతుందా అనే చివరి పదబంధపు భావం
  choice: మరణానికీ ఆవల ఆయనే మనలను నడిపిస్తాడు
  alternative: ఆయనే మరణం వరకు మనలను నడిపిస్తాడు; లేదా, ఆయనే మనలను ఎల్లప్పుడూ నడిపిస్తాడు
  rationale: עַל־מוּת అత్యంత క్లిష్టమైన పాఠం. మసొరెటిక్ పదవిభజన ‘మరణం’ను సూచించగలదు; అయితే దాని సంబంధార్థం, అలాగే ప్రత్యామ్నాయ పదవిభజన/పాఠసంప్రదాయాలు వివిధ అనువాదాలకు దారితీశాయి. ప్రధాన పాఠం ఇచ్చిన మూలాధార-సంప్రదింపు నిర్ణయాన్ని అనుసరిస్తూ, ప్రత్యామ్నాయాలను గమనికలో ఉంచి అనిశ్చితిని దాచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గౌరవభరితమైన, సులభంగా గ్రహించగల శైలి. సమాంతర వాక్యనిర్మాణం మరియు ‘ఈ దేవుడే/ఆయనే’ అనే ఉద్ఘాటన నిలుపబడ్డాయి.
