id: PSA.48.9
reference: Psalms 48:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: דִּמִּ֣ינוּ אֱלֹהִ֣ים חַסְדֶּ֑/ךָ בְּ֝/קֶ֗רֶב הֵיכָלֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/009.yaml
  text: We have reflected on your steadfast love[a], O God, in the midst of your temple.
translation:
  language: te
  text: 'దేవా, నీ ఆలయం మధ్యలో

    నీ స్థిరమైన ప్రేమను మేము ధ్యానించాము.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆలోచించాము,” “మననం చేశాము.” హీబ్రూ క్రియకు ఏదైనా విషయాన్ని లోతుగా తలపోయడం లేదా పరిశీలించడం అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּמִּינוּ
  choice: మేము ధ్యానించాము
  rationale: పీయేల్ సంపూర్ణ క్రియ ఇక్కడ ఆలోచించడం, మననం చేయడం అనే భావాన్ని ఇస్తుంది. ఆరాధనా సందర్భంలో ‘ధ్యానించాము’ సహజంగా ఉండి, మూలంలోని లోతైన మనన భావాన్ని నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: సందర్భంలో ఇది దేవునికి నేరుగా చేసే సంబోధన. తెలుగు సంబోధన రూపమైన ‘దేవా’ దానిని స్పష్టంగా, ప్రార్థనాత్మకంగా తెలియజేస్తుంది.
- source_word: חַסְדֶּךָ
  choice: నీ స్థిరమైన ప్రేమను
  rationale: חֶסֶד దేవుని నమ్మకమైన, నిలకడగల సంబంధ ప్రేమను సూచిస్తుంది. ‘స్థిరమైన ప్రేమ’ దానిని కేవలం కనికరానికి పరిమితం చేయకుండా సరళమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּקֶרֶב
  choice: మధ్యలో
  rationale: ఈ పదబంధం ఒక స్థలపు లోపల లేదా నడుమ ఉన్న స్థానాన్ని సూచిస్తుంది. ‘మధ్యలో’ సంక్షిప్తంగా, సహజంగా ఆ ప్రాదేశిక భావాన్ని నిలుపుతుంది.
- source_word: הֵיכָלֶךָ
  choice: నీ ఆలయం
  rationale: הֵיכָל అనే పదానికి రాజభవనం అనే అర్థం కూడా ఉన్నప్పటికీ, కీర్తనలోని ఆరాధనా సందర్భంలో దేవుని ఆలయమే ఉద్దేశిత అర్థం.
theological_decisions:
- issue: חֶסֶד ద్వారా వ్యక్తమయ్యే దేవుని గుణం
  choice: స్థిరమైన ప్రేమ
  alternative: కరుణ; నిబంధన ప్రేమ; ప్రేమపూర్వక విశ్వసనీయత
  rationale: ఈ ఎంపిక ప్రేమతో పాటు దాని నిలకడను, నమ్మకత్వాన్ని కూడా వ్యక్తం చేస్తుంది; భావాన్ని కేవలం కనికరానికి కుదించదు, అలాగే ప్రధాన పాఠ్యంలో సాంకేతిక వేదాంత పదాన్ని చేర్చదు.
- issue: אֱלֹהִים సంబోధనా లేక ప్రస్తావనా
  choice: నేర సంబోధనగా ‘దేవా’
  alternative: ప్రస్తావనగా ‘దేవుడు’
  rationale: వాక్యం ప్రార్థన లేదా గీతంలో దేవునితో నేరుగా మాట్లాడుతున్నట్లు సహజంగా చదవబడుతుంది. తెలుగు విభక్తి రూపం ఈ సంబోధనను అదనపు భావం చేర్చకుండా స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన కీర్తనా శైలి. మూలంలోని సంబోధనను మొదట ఉంచి, తెలుగు పదక్రమానికి అనుగుణంగా రెండు కవితా పాదాలుగా అమర్చాం.
