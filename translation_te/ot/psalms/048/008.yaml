source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר שָׁמַ֨עְנוּ כֵּ֤ן רָאִ֗ינוּ בְּ/עִיר יְהוָ֣ה צְ֭בָאוֹת בְּ/עִ֣יר אֱלֹהֵ֑י/נוּ אֱלֹ֘הִ֤ים יְכוֹנְנֶ֖/הָ עַד עוֹלָ֣ם סֶֽלָה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/008.yaml
  text: 'Just as we have heard[a], so we have seen in the city of Yahweh of hosts, in the city of our God: God will establish her forever. Selah'
translation:
  language: te
  text: 'మనం విన్నట్టుగానే,

    సైన్యాలకు అధిపతియైన యహ్వే నగరంలో,

    మన దేవుని నగరంలో చూశాం:

    దేవుడు దానిని[a] శాశ్వతంగా స్థిరపరుస్తాడు.

    సెలా'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘దానిని’కి సంబంధించిన ప్రత్యయం స్త్రీలింగంలో ఉంది. అది ‘నగరం’ను సూచిస్తూ, నగరాన్ని కవితాత్మకంగా స్త్రీగా వ్యక్తీకరిస్తుంది.
    reason: మూలభాషలోని వ్యాకరణ లింగం మరియు కవితాత్మక వ్యక్తీకరణ తెలుగులో ప్రధాన పాఠ్యం ద్వారా పూర్తిగా కనిపించవు.
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: విన్నట్టుగానే ... చూశాం
  rationale: హీబ్రూ ‘ఎలాగైతే... అలాగే...’ అనే పరస్పర సంబంధాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: שָׁמַעְנוּ / רָאִינוּ
  choice: మనం విన్నాం / చూశాం
  rationale: రెండూ ప్రథమ పురుష బహువచన సంపూర్ణ క్రియలు; నివేదికగా విన్నదానికీ ప్రత్యక్షంగా చూసినదానికీ ఉన్న సమాంతరతను కాపాడుతుంది. సందర్భంలోని అనుభవపూర్వక భావాన్ని తెలపడానికి ‘ఇప్పుడు’ చేర్చబడింది.
- source_word: יְהוָה צְבָאוֹת
  choice: సైన్యాలకు అధిపతియైన యహ్వే
  rationale: దైవ నామాన్ని ‘యహ్వే’గా లిప్యంతరీకరిస్తూ, צְבָאוֹת అనే బిరుదు సూచించే సైన్యాలపై అధికారాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది; ‘సైన్యాలు’ అనే విస్తృత పదాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: בְּעִיר ... בְּעִיר
  choice: నగరంలో ... నగరంలో
  rationale: בְּ యొక్క స్థానార్థాన్నీ, ‘నగరం’ అనే పదపు కవితాత్మక పునరుక్తినీ నిలుపుతుంది.
- source_word: אֱלֹהֵינוּ / אֱלֹהִים
  choice: మన దేవుడు / దేవుడు
  rationale: మొదటి రూపంలోని ప్రథమ పురుష బహువచన స్వామ్య ప్రత్యయాన్ని ‘మన’తో వ్యక్తం చేసి, తరువాత స్వతంత్రంగా వచ్చిన אֱלֹהִים‌ను ‘దేవుడు’గా అనువదిస్తుంది.
- source_word: יְכוֹנְנֶהָ
  choice: దానిని స్థిరపరుస్తాడు
  rationale: כון ధాతువులోని స్థాపించడం, దృఢంగా నిలపడం అనే భావాన్ని ఇస్తుంది. స్త్రీలింగ ఏకవచన ప్రత్యయం నగరాన్ని సూచిస్తుంది; తెలుగులో నగరానికి సహజంగా వాడే ‘దానిని’ ఎంచుకొని, హీబ్రూ వ్యక్తీకరణను పాదసూచికలో తెలిపాం.
- source_word: עַד עוֹלָם
  choice: శాశ్వతంగా
  rationale: నిరంతర నిలకడను ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఈ పదం యొక్క ఖచ్చితమైన కార్యం అనిశ్చితమైనందున వ్యాఖ్యాత్మక అర్థాన్ని రుద్దకుండా లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవ నామమే ఉంది. దాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధ్యమైన ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించాం.
- issue: יְכוֹנְנֶהָ లోని స్త్రీలింగ ప్రత్యయం సూచించేది
  choice: నగరాన్ని సూచించే ‘దానిని’
  alternative: నగరాన్ని స్త్రీగా వ్యక్తీకరిస్తూ ‘ఆమెను’
  rationale: స్త్రీలింగ ఏకవచన ప్రత్యయానికి అత్యంత సహజమైన పూర్వపదం ‘నగరం’. అయితే తెలుగులో నగరాన్ని ‘ఆమె’ అనడం ప్రధాన పాఠ్యంలో అసహజంగా ఉండడంతో ‘దానిని’ వాడి, మూలంలోని స్త్రీ వ్యక్తీకరణను పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తన కవిత్వానికి తగిన గౌరవభరితమైన, కానీ సాధారణ పాఠకులకు స్పష్టమైన శైలి. పునరుక్తి మరియు పాద విభజన కవితా సమాంతరతను నిలుపుతాయి.
