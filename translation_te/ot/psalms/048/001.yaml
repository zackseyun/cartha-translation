source:
  edition: WLC
  text: גָּ֘ד֤וֹל יְהוָ֣ה וּ/מְהֻלָּ֣ל מְאֹ֑ד בְּ/עִ֥יר אֱ֝לֹהֵ֗י/נוּ הַר קָדְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/001.yaml
  text: Great is Yahweh[a], and greatly to be praised, in the city of our God, his holy mountain.
translation:
  language: te
  text: యాహ్వే గొప్పవాడు, ఎంతో స్తుతించదగినవాడు[a], మన దేవుని పట్టణమైన ఆయన పరిశుద్ధ పర్వతంలో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎంతో స్తుతింపబడినవాడు.” హీబ్రూ పాసివ్ పార్టిసిపిల్‌ను అక్షరార్థంగా “స్తుతింపబడినవాడు” అని, లేదా భావానుసారంగా “స్తుతించదగినవాడు” అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל
  choice: గొప్పవాడు
  rationale: వాక్యారంభంలోని విధేయ విశేషణ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; కేవలం శక్తి అనే అర్థానికి పరిమితం చేయదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: וּמְהֻלָּל מְאֹד
  choice: ఆయన ఎంతో స్తుతించదగినవాడు
  rationale: הלל ధాతువులోని పాసివ్ పార్టిసిపిల్‌ను, מְאֹד ఇచ్చే తీవ్రతతో కలిపి, ప్రశంసకు అత్యంత అర్హుడనే విధేయ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּעִיר אֱלֹהֵינוּ
  choice: మన దేవుని పట్టణంలో
  rationale: בְּ యొక్క స్థానార్థాన్ని, అలాగే אֱלֹהֵינוּలోని సమూహ సంబంధబోధక భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: הַר קָדְשׁוֹ
  choice: ఆయన పరిశుద్ధ పర్వతంపై
  rationale: కావ్య సమాంతర స్థానవాచక భావాన్ని సహజ తెలుగులో చూపుతుంది; 'పరిశుద్ధతగల పర్వతం' అనే కఠిన నిర్మాణాన్ని నివారిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతోంది. అందువల్ల దానిని బిరుదైన 'ప్రభువు'తో భర్తీ చేయకుండా, మూల ఉచ్చారణకు దగ్గరైన 'యాహ్వే'గా లిప్యంతరీకరించాం.
- issue: מְהֻלָּל యొక్క భావం
  choice: స్తుతించదగినవాడు
  alternative: ఎంతో స్తుతించబడుతున్నవాడు
  rationale: పాసివ్ పార్టిసిపిల్ ప్రశంస పొందుతున్న స్థితినీ, ప్రశంసకు అర్హతనూ సూచించగలదు. ప్రధాన పాఠంలో సహజమైన అర్హత భావాన్ని ఎంచుకుని, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
- issue: הַר קָדְשׁוֹ యొక్క వాక్య సంబంధం
  choice: పట్టణంతో సమాంతరమైన స్థాన సూచనగా డాష్‌ల మధ్య ఉంచడం
  alternative: మన దేవుని పట్టణమైన ఆయన పరిశుద్ధ పర్వతంలో
  rationale: రెండవ పదబంధానికి ప్రత్యేక స్థానవాచక ఉపసర్గ లేకపోవడం వల్ల అది అనుబంధ వివరణగా లేదా కావ్య సమాంతర స్థాన సూచనగా చదవవచ్చు. డాష్‌లు ఈ సన్నిహిత సంబంధాన్ని చూపుతూ, పట్టణం మరియు పర్వతం పూర్తిగా ఒకటేనని అతిగా నిర్ణయించవు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనాత్మక గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదజాలం వాడాం. మూలంలోని ముందస్తు విధేయ నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపి, స్థానపదబంధాల మధ్య ఉన్న కవితాత్మక సంబంధాన్ని డాష్‌తో సూచించాం.
