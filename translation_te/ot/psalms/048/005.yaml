- from: వారు చూశారు; అంతట ఆశ్చర్యచకితులయ్యారు; భయభ్రాంతులయ్యారు; ఆతురంగా పారిపోయారు.[a]
  to: వారు చూశారు; కాబట్టి విస్మయపడ్డారు; కలవరపడ్డారు; ఆతురంగా పారిపోయారు.[a]
  rationale: 'The revision improves the rendering of the resultative connective and smooths two expressions into natural modern Telugu, while preserving the Hebrew’s compact progression: seeing, astonishment, alarm, and urgent departure. The lexical-alternative footnote remains appropriate and is retained unchanged in substance.'
