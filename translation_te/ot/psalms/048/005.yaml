source:
  edition: WLC
  text: הֵ֣מָּה רָ֭אוּ כֵּ֣ן תָּמָ֑הוּ נִבְהֲל֥וּ נֶחְפָּֽזוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/005.yaml
  text: They saw[a], and so they were astonished; they were terrified; they fled in haste.
translation:
  language: te
  text: వారు చూశారు; కాబట్టి విస్మయపడ్డారు; కలవరపడ్డారు; ఆతురంగా పారిపోయారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తొందరగా వెళ్లిపోయారు,’ ‘హడావిడిగా పారిపోయారు.’ హీబ్రూ క్రియ ఒత్తిడి లేదా భయంతో కూడిన అత్యవసర తొందరను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: వారు
  rationale: ఇది నొక్కిచెప్పే స్వతంత్ర తృతీయ పురుష బహువచన సర్వనామం. తెలుగు సందర్భంలో సహజమైన ‘వారు’ సరిపోతుంది; ప్రత్యేకంగా ‘వారే’ అని అనువదిస్తే మూలంలో ఉన్నదానికంటే అధిక వ్యత్యాసార్థం కలగవచ్చు.
- source_word: רָאוּ
  choice: చూశారు
  rationale: ראה అనే సాధారణ ‘చూచుట’ క్రియ యొక్క సరళమైన, సందర్భోచిత అనువాదం.
- source_word: כֵּן
  choice: అంతట
  rationale: వారు చూసినదానికి వెంటనే కలిగిన ప్రతిస్పందనను అనుసంధానిస్తుంది. ‘అంతట’ కాలక్రమ మరియు ఫలిత భావాలను సహజంగా మోస్తుంది; వాటిలో ఒక్కదానిని మాత్రమే నిర్బంధంగా నిర్ణయించదు.
- source_word: תָּמָהוּ
  choice: ఆశ్చర్యచకితులయ్యారు
  rationale: ఆశ్చర్యం లేదా విస్మయాన్ని సూచించే క్రియ. ఇక్కడ సానుకూలమైన అద్భుతభావమో ప్రతికూలమైన దిగ్భ్రాంతో అని అతిగా నిర్ణయించకుండా, తీవ్రమైన ఆశ్చర్యాన్ని తెలియజేస్తుంది.
- source_word: נִבְהֲלוּ
  choice: భయభ్రాంతులయ్యారు
  rationale: కలవరపడటం, బెదరిపోవటం, భయపడటం అనే తీవ్ర భావాన్ని సూచిస్తుంది. తరువాతి ఆతుర పారిపోవటంతో కూడిన క్రమంలో ఈ పదబంధం తగిన బలాన్ని ఇస్తుంది.
- source_word: נֶחְפָּזוּ
  choice: ఆతురంగా పారిపోయారు
  rationale: ఒత్తిడి లేదా భయంతో కూడిన తొందరపాటు కదలికను సూచిస్తుంది. సందర్భం పారిపోవటాన్ని బలంగా సూచించినా, క్రియ యొక్క ప్రధాన భావమైన ఆతుర తొందరను ‘ఆతురంగా’ నిలుపుతుంది.
