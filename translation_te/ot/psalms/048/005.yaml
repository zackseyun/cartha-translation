translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గంభీరతతో కూడిన సంక్షిప్త సమాంతర వాక్య నిర్మాణం వాడబడింది. వరుస క్రియల వేగాన్ని సెమికోలన్లు నిలుపుతున్నాయి.
