  yaml_path: translation/ot/psalms/048/003.yaml
  text: God is known in her citadels as a stronghold[a][b].
translation:
  language: te
  text: దాని కోటభవనాల్లో దేవుడు దుర్గముగా తెలిసివున్నాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాని రాజభవనాల్లో.’ హీబ్రూ పదం ఘనమైన నివాస భవనాలను లేదా రక్షణగల నిర్మాణాలను సూచించగలదు; ఇక్కడ నగర భద్రత నేపథ్యంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆశ్రయంగా’ లేదా ‘కోటగా.’ హీబ్రూ పదం రక్షణనిచ్చే ఎత్తైన సురక్షిత స్థలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ కీర్తన సందర్భంలో రూపం వ్యాకరణపరంగా బహువచనమైనా, ఇశ్రాయేలు దేవుణ్ణి సూచించే ఏకవచన దైవనామంగా వాడబడింది.
- source_word: בְּאַרְמְנוֹתֶיהָ
  choice: దాని కోటభవనాల్లో
  rationale: אַרְמְנוֹת అనే పదం రాజభవనాలను లేదా రక్షణగల ఘన నిర్మాణాలను సూచించగలదు. సీయోను భద్రత ప్రధానమైన ఈ సందర్భంలో ‘కోటభవనాలు’ వైభవం, రక్షణ అనే రెండు భావాలనూ నిలుపుతుంది; స్త్రీలింగ ఏకవచన ప్రత్యయం నగరాన్ని సూచిస్తుంది.
- source_word: נוֹדַע
  choice: ప్రసిద్ధుడు
  rationale: ידע యొక్క నిఫ్అల్ రూపానికి ‘తెలిసినవాడు/ప్రసిద్ధుడు’ అనే స్థితిని తెలిపే భావం ఉంది. ‘ప్రసిద్ధుడు’ తెలుగు కవితా వాక్యంలో సహజంగా ఉండి, దేవుడు తనను తాను వెల్లడించుకున్నాడనే అదనపు భావాన్ని చేర్చదు.
- source_word: לְמִשְׂגָּב
  choice: దుర్గంగా
  rationale: מִשְׂגָּב ఎత్తైన, సురక్షితమైన ఆశ్రయస్థలాన్ని సూచిస్తుంది. ‘దుర్గంగా’ రక్షణ, భద్రతల రూపకాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘దాని కోటభవనాలు’లోని స్త్రీలింగ ప్రత్యయం ఎవరిని సూచిస్తుంది?
  choice: ఈ కీర్తనలో స్త్రీలింగంగా వ్యక్తీకరించబడిన సీయోను నగరాన్ని సూచిస్తుంది.
  alternative: దేశాన్ని లేదా సమాజాన్ని సాధారణంగా సూచించవచ్చు.
  rationale: తక్షణ సందర్భం దేవుని నగరమైన సీయోను కొండపైనే కేంద్రీకృతమై ఉంది; కాబట్టి స్త్రీలింగ ఏకవచన ప్రత్యయం నగరానికే చెందడం అత్యంత సహజం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన కీర్తనా శైలిని అనుసరించాం. ‘కోటభవనాలు’ మూలపదంలోని రాజవైభవం–రక్షణ అనే ద్వంద్వ భావాన్ని ఉంచుతుంది; ‘ప్రసిద్ధుడు’ నిఫ్అల్ రూపంలోని నిజమైన స్థితి/నిష్క్రియాత్మక సందిగ్ధతను అతిగా విప్పకుండా సహజంగా అందిస్తుంది.
