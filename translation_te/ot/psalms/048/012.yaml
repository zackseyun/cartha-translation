  source_fidelity: 'హీబ్రూ మూలంలోని మూడు బహువచన ఆజ్ఞలను పాఠ్యం కచ్చితంగా ప్రతిబింబిస్తుంది: סֹבּוּకు “సీయోను చుట్టూ నడవండి,” וְהַקִּיפוּהָకు “దాని చుట్టూ తిరగండి,” సִפְרוּ מִגְדָּלֶיהָకు “దాని బురుజులను లెక్కించండి.” రెండు సమీపార్థక చుట్టూ-కదలిక ఆజ్ఞలను అనవసరంగా కలపకుండా నిలుపుతుంది. నగరాన్ని సూచించే స్త్రీలింగ ప్రత్యయాన్ని తెలుగులో సహజమైన నపుంసక “దాని”తో అనువదించడం సముచితం.'
