  yaml_path: translation/ot/psalms/048/007.yaml
  text: With an east wind you shatter the ships of Tarshish[a].
translation:
  language: te
  text: తూర్పు గాలితో నీవు తర్షీషు ఓడలను[a] ఛిన్నాభిన్నం చేస్తావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తర్షీషుకు వెళ్లే ఓడలు’ లేదా ‘తర్షీషుతో సంబంధమున్న ఓడలు.’ ఈ పదబంధం తర్షీషుతో అనుబంధమున్న సముద్ర వాణిజ్య ఓడలను, విస్తృతంగా పెద్ద సముద్రయాన ఓడలను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/רוּחַ קָדִים
  choice: తూర్పుగాలితో
  rationale: רוּחַ కָדִים సముద్ర దృశ్యంలో విధ్వంసకరమైన తూర్పుగాలిని సూచిస్తుంది; בְּ సాధనార్థకంగా ఉన్నందున ‘-తో’ అని అనువదించాం.
- source_word: תְּשַׁבֵּר
  choice: నీవు ... ముక్కలు చేస్తావు
  rationale: שׁבר పియేల్ రూపం బలంగా పగులగొట్టడం లేదా ఛిన్నాభిన్నం చేయడం అనే భావాన్ని ఇస్తుంది. ద్వితీయ పురుష ఏకవచనాన్ని దేవునికి నేర సంబోధనగా నిలిపాం.
- source_word: אֳנִיּוֹת
  choice: ఓడలను
  rationale: ఈ బహువచన నామవాచకానికి సహజమైన ఆధునిక తెలుగు పదం ‘ఓడలు’.
- source_word: תַּרְשִׁישׁ
  choice: తర్షీషు
  rationale: స్థలనామాన్ని తెలుగు లిపిలో ధ్వన్యనుసారంగా ఇచ్చాం; ఈ పదబంధానికి ఉన్న విస్తృత నౌకా సంబంధ అర్థసంభావ్యతను పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: ద్వితీయ పురుష క్రియకు సంబోధితుడు
  choice: దేవునికి నేర సంబోధన—‘నీవు ... చేస్తావు’
  alternative: కర్తను స్పష్టంగా చూపని సాధారణ వాక్యం
  rationale: תְּשַׁבֵּר ద్వితీయ పురుష ఏకవచన రూపం; కీర్తన సందర్భంలో దేవునికి నేర సంబోధనగా తీసుకోవడం కవితా బలాన్ని, వ్యాకరణ రూపాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి. ‘ముక్కలు చేస్తావు’ బలమైన విధ్వంస భావాన్ని సాధారణ పాఠకుడికి స్పష్టంగా అందిస్తుంది; తర్షీషు సంబంధిత పదబంధంలోని సందిగ్ధతను పాదసూచికలో కాపాడాం.
