  verdict: revise
  source_fidelity: The draft correctly renders בְּרוּחַ קָדִים instrumentally as “తూర్పు గాలితో,” preserves the second-person singular address in תְּשַׁבֵּר as “నీవు,” and retains Tarshish as a proper name. A stronger Telugu verb is preferable for the Piel sense of violently breaking ships apart.
  naturalness: “తూర్పు గాలితో” is more naturally written as two words. “ముక్కలు చేస్తావు” is understandable, but “ఛిన్నాభిన్నం చేస్తావు” is more idiomatic in elevated modern Telugu for ships being shattered and suits the psalm’s poetic register.
  terminology: “ఓడలు” is a suitable modern term for ships. “తర్షీషు” is an appropriate Telugu transliteration. The footnote should distinguish the interpretive alternatives rather than repeat the main-text wording without clarification.
  issues:
  - severity: low
    issue: Compound spacing
    rationale: Modern Telugu orthography and ordinary reading favor “తూర్పు గాలితో” rather than the closed compound “తూర్పుగాలితో.”
  - severity: medium
    issue: Verb force and idiom
    rationale: “ముక్కలు చేస్తావు” is less idiomatic for the violent breaking of ships. “ఛిన్నాభిన్నం చేస్తావు” better represents the intensive force of the Piel תְּשַׁבֵּר without adding meaning.
  - severity: low
    issue: Footnote alternative is not clearly differentiated
    rationale: The footnote’s “తర్షీషు ఓడలను” repeats the main wording. It should explicitly identify the alternative sense of ships belonging to/associated with Tarshish, while retaining the possibility of ships bound for Tarshish.
