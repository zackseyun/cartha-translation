    text: లేదా “కోరహు కుమారుల కొరకు.” కీర్తనల శీర్షికల్లోని హీబ్రూ లְ ఉపసర్గ అనుబంధం, రచన, అంకితం లేదా గానప్రదర్శన సందర్భాన్ని సూచించగలదు.
