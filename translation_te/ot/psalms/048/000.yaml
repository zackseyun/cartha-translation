lexical_decisions:
- source_word: שִׁיר
  choice: గీతం
  rationale: ఇది పాటను సూచించే సాధారణ హీబ్రూ నామవాచకం. కీర్తన శీర్షికలో సహజమైన, గౌరవప్రదమైన తెలుగు పదంగా ‘గీతం’ సరిపోతుంది.
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: సంగీత ప్రదర్శనతో సంబంధమున్న ఈ పదం కీర్తనల శీర్షికల్లో ప్రత్యేక ప్రక్రియాపదంగా వాడబడుతుంది. שִׁיר నుండి దాని భేదాన్ని నిలుపుటకు ‘కీర్తన’గా అనువదించబడింది.
- source_word: לִבְנֵי
  choice: కుమారుల
  rationale: హీబ్రూ לְ ఉపసర్గ శీర్షికల్లో రచన, అనుబంధం, అంకితం లేదా ప్రదర్శన సందర్భాన్ని సూచించవచ్చు. తెలుగు షష్ఠీ సంబంధం ఈ అర్థాన్ని అతిగా నిర్ధారించకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: קֹרַח
  choice: కోరహు
  rationale: వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: לִבְנֵי קֹרַח అనే శీర్షిక పదబంధం యొక్క సంబంధార్థం
  choice: కోరహు కుమారుల
  alternative: కోరహు కుమారుల కొరకు
  rationale: לְ ఉపసర్గకు ఇక్కడ విస్తృతార్థం ఉంది; అది రచయితలను, వారితో అనుబంధాన్ని, వారికి అంకితాన్ని లేదా వారి ప్రదర్శన సందర్భాన్ని సూచించవచ్చు. ప్రధాన పాఠం ఒక్క అవకాశాన్ని నిర్ణయించకుండా సంబంధాన్ని సహజంగా ఉంచుతుంది; పాదసూచిక ప్రత్యామ్నాయాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన కీర్తన శీర్షికగా రూపొందించబడింది. שִׁיר మరియు מִזְמוֹר అనే రెండు ప్రక్రియాపదాలను వరుసగా ‘గీతం’, ‘కీర్తన’గా వేరు చేసి నిలుపుకుంది. హీబ్రూ పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, సహజ తెలుగు సంబంధ నిర్మాణాన్ని ఉపయోగించింది.
