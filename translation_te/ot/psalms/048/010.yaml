  terminology: “దేవా,” “పేరు,” “స్తుతి,” “కుడిచేయి,” and “నీతి” are appropriate in a dignified modern Telugu psalm register. The footnote appropriately preserves “న్యాయం” as an alternative for צֶדֶק.
