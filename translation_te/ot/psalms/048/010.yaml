id: PSA.48.10
reference: Psalms 48:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כְּ/שִׁמְ/ךָ֤ אֱלֹהִ֗ים כֵּ֣ן תְּ֭הִלָּתְ/ךָ עַל קַצְוֵי אֶ֑רֶץ צֶ֝֗דֶק מָלְאָ֥ה יְמִינֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/010.yaml
  text: As your name[a], O God, so your praise reaches to the ends of the earth[b]; your right hand is full of righteousness.
translation:
  language: te
  text: దేవా, నీ పేరు వలెనే నీ స్తుతి కూడా భూమి అంచుల వరకు వ్యాపించింది[a]; నీ కుడిచేయి నీతితో నిండి ఉంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ స్తుతి భూమి అంచుల మీద ఉంది.” హీబ్రూ ఉపసర్గకు అక్షరార్థంగా “మీద/పైన” అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “న్యాయంతో.” హీబ్రూ צֶדֶק అనే పదం ‘నీతి’ లేదా ‘న్యాయం’ అని అర్థమివ్వగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּשִׁמְךָ ... כֵּן תְּהִלָּתְךָ
  choice: నీ పేరు వలెనే, నీ స్తుతి
  rationale: כְּ...כֵּן అనే ‘ఎలాగో/అలాగే’ పోలికను తెలుగులో సహజంగా నిలుపుతుంది. ‘పేరు’ అనే స్పష్టమైన రూపకాన్ని ‘ప్రఖ్యాతి’గా విప్పకుండా యథాతథంగా ఉంచుతుంది.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: సందర్భంలోని ప్రత్యక్ష సంబోధనను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תְּהִלָּתְךָ
  choice: నీ స్తుతి
  rationale: ‘స్తుతి’ మూలపదానికి నేరమైన అర్థం; దేవునికి కలిగే కీర్తి అనే భావసంభావ్యతను కూడా మూసివేయదు.
- source_word: עַל קַצְוֵי אֶרֶץ
  choice: భూమి అంచుల వరకు వ్యాపించింది
  rationale: עַל అక్షరార్థంగా ‘మీద/పైన’ అయినప్పటికీ, ఇక్కడ స్తుతి విస్తరించే పరిధిని సహజ తెలుగులో తెలియజేస్తుంది. మరింత అక్షరార్థ రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: צֶדֶק
  choice: నీతి
  rationale: צֶדֶק లోని నైతిక సత్ప్రవర్తన భావాన్ని సంక్షిప్తంగా అందిస్తుంది; ‘న్యాయం’ కూడా సాధ్యమైనందున పాదటిప్పణిలో నిలుపబడింది.
- source_word: מָלְאָה יְמִינֶךָ
  choice: నీ కుడిచేయి నీతితో నిండివుంది
  rationale: స్త్రీలింగ సంపూర్ణ క్రియ సూచించే ప్రస్తుత ఫలితస్థితిని సహజంగా వ్యక్తం చేస్తూ, ‘కుడిచేయి’ అనే బైబిలీయ చిత్రాన్ని అలాగే ఉంచుతుంది.
theological_decisions:
- issue: దేవుని కుడిచేయిని వర్ణించే צֶדֶק పదం
  choice: నీతి
  alternative: న్యాయం
  rationale: హీబ్రూ పదం నైతిక నీతినీ న్యాయపరమైన న్యాయాన్నీ సూచించగలదు. ప్రధాన పాఠ్యంలో ‘నీతి’ని ఎంచుకుని, సందర్భానికి సముచితమైన ‘న్యాయం’ భావాన్ని పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదజాలం వాడబడింది. హీబ్రూ పోలిక, ‘పేరు,’ ‘కుడిచేయి’ అనే కవితాత్మక చిత్రాలు సంరక్షించబడ్డాయి.
