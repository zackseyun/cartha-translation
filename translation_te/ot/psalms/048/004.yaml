lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: ఎందుకంటే ఇదిగో
  rationale: כִּי యొక్క వివరణాత్మక/కారణసూచక భావాన్నీ, הִנֵּה యొక్క దృష్టిని ఆకర్షించే బలాన్నీ నిలుపుతుంది.
- source_word: נוֹעֲדוּ
