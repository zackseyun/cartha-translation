  yaml_path: translation/ot/psalms/048/011.yaml
  text: Let Mount Zion rejoice[a]; let the daughters of Judah be glad because of your judgments.
translation:
  language: te
  text: సీయోను పర్వతం సంతోషించుగాక; నీ తీర్పుల కారణంగా యూదా కుమార్తెలు[a] ఆనందించుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదా పట్టణాలు/గ్రామాలు”; “కుమార్తెలు” అనే పదం కవితాత్మకంగా అనుబంధ పట్టణాలను లేదా నివాసాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂמַח
  choice: సంతోషించుగాక
  rationale: שׂמח అనే క్రియ యొక్క కవితాత్మక, అభిలాషాత్మక భావాన్ని సహజమైన తెలుగు ఆశీర్వచన/ఆహ్వాన రూపంలో వ్యక్తపరుస్తుంది.
- source_word: הַר צִיּוֹן
  choice: సీయోను పర్వతం
  rationale: స్థలసంబంధమైన పర్వత రూపకాన్ని, సీయోను అనే పేరును స్పష్టంగా నిలుపుతుంది.
- source_word: תָּגֵלְנָה
  choice: ఆనందించుగాక
  rationale: גיל లోని ఉల్లాసభరితమైన ఆనంద భావాన్ని తెలియజేస్తూ, ముందున్న సమానార్థక క్రియతో సహజమైన కవితాత్మక వైవిధ్యాన్ని ఉంచుతుంది.
- source_word: בְּנוֹת יְהוּדָה
  choice: యూదా కుమార్తెలు
  rationale: హీబ్రూ పదబంధంలోని అక్షరార్థ చిత్రాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; అది యూదాలోని పట్టణాలు లేదా గ్రామాలను కవితాత్మకంగా సూచించే అవకాశం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: לְמַעַן
  choice: బట్టి
  rationale: ఈ సందర్భంలో ఆనందానికి కారణాన్ని సూచించే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מִשְׁפָּטֶיךָ
  choice: నీ తీర్పులు
  rationale: מִשְׁפָּט యొక్క న్యాయనిర్ణయాలు లేదా తీర్పు కార్యాలు అనే భావాన్ని నిలుపుతుంది; సందర్భంలో నియమాలకన్నా దేవుని న్యాయపాలనా కార్యాలే ప్రధానంగా కనిపిస్తాయి.
theological_decisions:
- issue: מִשְׁפָּטֶיךָ యొక్క సందర్భార్థం
  choice: నీ తీర్పులు
  alternative: నీ న్యాయం; నీ శాసనాలు
  rationale: ఈ కీర్తన పరిసర సందర్భం దేవుడు రాజుగా, న్యాయాధిపతిగా చేసిన నిర్ణాయక కార్యాలను స్తుతిస్తుంది. ‘తీర్పులు’ అనే అనువాదం దానిని అతిగా నిర్దిష్టం చేయకుండా న్యాయపరమైన బహువచనాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కవితాత్మక శైలి. ‘సంతోషించుగాక/ఆనందించుగాక’ రూపాలు హీబ్రూ అసంపూర్ణ క్రియలలోని అభిలాషాత్మక లేదా ఆహ్వాన భావాన్ని ప్రతిబింబిస్తాయి; ప్రధాన పాఠ్యం అక్షరార్థ చిత్రాన్ని నిలుపుతూ, భౌగోళిక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో అందిస్తుంది.
