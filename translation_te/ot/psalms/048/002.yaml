source:
  edition: WLC
  text: יְפֵ֥ה נוֹף֮ מְשׂ֪וֹשׂ כָּל הָ֫/אָ֥רֶץ הַר צִ֭יּוֹן יַרְכְּתֵ֣י צָפ֑וֹן קִ֝רְיַ֗ת מֶ֣לֶךְ רָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/002.yaml
  text: Beautiful in elevation[a], the joy of all the earth, is Mount Zion, in the far north, the city of the great King.
translation:
  language: te
  text: ఎత్తులో సుందరమైనది, భూమంతటికీ ఆనందమైనది సీయోను పర్వతం—ఉత్తరపు సుదూర ప్రాంతాల్లోనున్న మహారాజు నగరం.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְפֵה נוֹף
  choice: ఎత్తైన అందంతో
  rationale: יְפֵהను ‘అందమైన’ అనే మూల్యాంకన భావంతోనూ, కఠినమైన נוֹףను ఎత్తు/ఉన్నత స్థితిని సూచించేదిగానూ తీసుకొని, రెండింటినీ సహజమైన తెలుగు పదబంధంగా అందిస్తుంది.
- source_word: מְשׂוֹשׂ כָּל הָאָרֶץ
  choice: భూమంతటికీ ఆనందకారణంగా
  rationale: מְשׂוֹשׂలోని ఆనందం/హర్షకారణం భావాన్ని సహజంగా వ్యక్తం చేస్తూ, כָּל הָאָרֶץ యొక్క విశ్వవ్యాప్త పరిధిని ‘భూమంతటికీ’గా నిలుపుతుంది.
- source_word: הַר צִיּוֹן
  choice: సీయోను పర్వతం
  rationale: స్థలనామాన్నీ సాధారణ నామవాచకాన్నీ ఆధునిక ప్రామాణిక తెలుగు బైబిలు శైలిలో స్పష్టంగా అందిస్తుంది.
- source_word: יַרְכְּתֵי צָפוֹן
  choice: ఉత్తరపు సుదూర ప్రాంతాల్లో
  rationale: ‘ఉత్తరపు అంత్య/దూర భాగాలు’ అనే హీబ్రూ పదబంధపు ప్రాథమిక భావాన్ని నిలుపుతూ, దాని భౌగోళిక లేదా సాఫోను-సంబంధిత కవితాత్మక ప్రతిధ్వనిని తేల్చివేయదు.
- source_word: קִרְיַת מֶלֶךְ רָב
  choice: మహారాజు నగరం
  rationale: నిర్మాణ సంబంధాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది; ‘మహారాజు’ సందర్భంలో పరమాధికార రాజును సూచించినా, మూలంలో లేని వివరణను చేర్చదు.
theological_decisions:
- issue: יַרְכְּתֵי צָפוֹן పదబంధం సీయోను పర్వతంతో గల సంబంధం
  choice: ప్రధాన పాఠ్యంలో ‘ఉత్తరపు సుదూర ప్రాంతాల్లో’ అని భౌగోళికంగా వినిపించే, కానీ విస్తృత కవితాత్మక సూచనకు కూడా వీలిచ్చే అనువాదం
  alternative: ‘ఉత్తరపు వాలులపై’ లేదా ‘సాఫోను యొక్క అంతర్భాగాల్లో’
  rationale: హీబ్రూ పదబంధం సాధారణ భౌగోళిక వర్ణనకూ, ఉత్తరం/సాఫోనుతో ముడిపడిన దైవపర్వత చిత్రణకూ అవకాశం ఇస్తుంది. ఏ ఒక్క అర్థాన్నీ సిద్ధాంతపరంగా బలవంతంగా నిర్ణయించకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా ధోరణిని ఉంచి, సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఎంచుకున్నాం. డాష్ ద్వారా ‘సీయోను పర్వతం’ మరియు ‘మహారాజు నగరం’ మధ్య సమానాధికార సంబంధాన్ని స్పష్టం చేశాం.
