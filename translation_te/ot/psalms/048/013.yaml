  text: Set your heart on her rampart[a]; pass through her citadels[b], so that you may tell the next generation.
translation:
  language: te
  text: 'ఆమె ప్రాకారంపై[a] మీ మనసు పెట్టండి;


    ఆమె దుర్గాలను జాగ్రత్తగా పరిశీలించండి[b].


    రాబోయే తరానికి తెలియజేయడానికి ఇలా చేయండి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆమె వెలుపలి గోడపై.’ హీబ్రూ పదం నగర రక్షణ కట్టడాన్ని విస్తృతంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘దుర్గాలు’ అనే పదానికి బదులుగా ‘రాజభవనాలు’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం రాజభవనాలను లేదా పటిష్ఠమైన కోట కట్టడాలను సూచించగలదు; ఇక్కడ నగర రక్షణ వ్యవస్థను పరిశీలించే సందర్భం ‘దుర్గాలు’ అనే అనువాదానికి మద్దతిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיתוּ לִבְּכֶם
  choice: మీ మనసు నిలపండి
  rationale: ఈ పదబంధం అక్షరార్థంగా ‘మీ హృదయాన్ని ఉంచండి’ అని ఉన్నా, ఇక్కడ శ్రద్ధను ఒకదానిపై కేంద్రీకరించమనే భావం. ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ‘మనసు నిలపండి’ అని అనువదించబడింది; మూలంలోని అంతరంగ శ్రద్ధ భావం కూడా నిలిచింది.
- source_word: לְחֵילָה
  choice: ఆమె ప్రాకారంపై
  rationale: חֵיל నగర సందర్భంలో రక్షణ కట్టడాన్ని, ముఖ్యంగా ప్రాకారం లేదా వెలుపలి గోడను సూచిస్తుంది. సీయోను నగరాన్ని స్త్రీలింగంలో వ్యక్తీకరించిన మూలరూపాన్ని ‘ఆమె’ ద్వారా నిలిపాం.
- source_word: פַּסְּגוּ
  choice: గుండా నడవండి
  rationale: అరుదైన ఈ ఆజ్ఞారూపం నగర కట్టడాల మధ్యగా వెళ్లి వాటిని పరిశీలించే భౌతిక చర్యను సూచించవచ్చు. కేవలం మానసికంగా ‘పరిశీలించండి’ అని నిర్ణయించకుండా, సందర్భానికి సరిపోయే ప్రయాణ భావాన్ని నిలిపాం.
- source_word: אַרְמְנוֹתֶיהָ
  choice: ఆమె దుర్గాలు
  rationale: אַרְמוֹן రాజభవనాలను లేదా పటిష్ఠమైన కోట కట్టడాలను సూచించగలదు. ప్రాకారాన్ని పరిశీలించే సైనిక-నగర సందర్భంలో ‘దుర్గాలు’ సరిపోతుంది; ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: לְמַעַן תְּסַפְּרוּ
  choice: అప్పుడు … మీరు వాటి గురించి వివరించగలరు
  rationale: לְמַעַן ఉద్దేశాన్ని తెలియజేస్తుంది; ספר పియేల్ రూపం చెప్పడం లేదా వివరంగా వర్ణించడం అనే భావం ఇస్తుంది. మునుపటి ఆజ్ఞలకు సహజ ఫలిత-ఉద్దేశ సంబంధం కనిపించేలా తెలుగులో నిర్మించాం.
- source_word: לְדוֹר אַחֲרוֹן
  choice: రాబోయే తరానికి
  rationale: అక్షరార్థంగా ‘తరువాతి/అనంతర తరం’ అని అర్థం. అది తప్పనిసరిగా వెంటనే వచ్చే ఒక్క తరమేనని పరిమితం చేయకుండా ‘రాబోయే తరం’ అని అనువదించాం.
