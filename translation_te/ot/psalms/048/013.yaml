  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదజాలం వాడబడింది. సీయోనును స్త్రీలింగంలో వ్యక్తీకరించే హీబ్రూ రూపాన్ని ‘ఆమె’ ద్వారా నిలిపాం. మూలంలోని మూడు ఆజ్ఞ/ఉద్దేశ భాగాలను చదవడానికి సులభంగా మూడు పంక్తులుగా అమర్చాం.
