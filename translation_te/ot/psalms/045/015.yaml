source:
  edition: WLC
  text: תּ֭וּבַלְנָה בִּ/שְׂמָחֹ֣ת וָ/גִ֑יל תְּ֝בֹאֶ֗ינָה בְּ/הֵ֣יכַל מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/015.yaml
  text: They will be led with gladness and rejoicing[b][a]; they will enter the palace of the king.
translation:
  language: te
  text: వారు సంతోషంతో, ఉల్లాసంతో నడిపించబడతారు; రాజు యొక్క రాజభవనంలోకి[a] ప్రవేశిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రాజభవనం’ అని అనువదించిన హీబ్రూ పదానికి ‘సభామందిరం’ లేదా ఇతర సందర్భాల్లో ‘దేవాలయం’ అనే అర్థాలు కూడా ఉండవచ్చు; ఇక్కడ రాజవివాహ సందర్భానికి ‘రాజభవనం’ సరిపోతుంది.
    reason: cultural_note
lexical_decisions:
- source_word: תּוּבַלְנָה
  choice: నడిపించబడతారు
  rationale: యבל ధాతువు హోఫల్ రూపం నడిపించబడడం లేదా తీసుకురాబడడం అనే నిష్క్రియార్థాన్ని ఇస్తుంది. వివాహ ఊరేగింపు సందర్భంలో ‘నడిపించబడతారు’ సహజంగా ఉండి ఊరేగింపు భావాన్ని నిలుపుతుంది.
- source_word: בִּשְׂמָחֹת
  choice: సంతోషంతో
  rationale: ב ఉపసర్గతో కూడిన బహువచన నామవాచకం ఇక్కడ విధానాన్ని లేదా తోడుగా ఉన్న భావాన్ని సూచిస్తుంది. తెలుగు సహజ వాడుకలో సమిష్టి ఉత్సవభావాన్ని ‘సంతోషంతో’ తెలియజేస్తుంది.
- source_word: וָגִיל
  choice: ఉల్లాసంతో
  rationale: גיל ఉప్పొంగే ఆనందాన్ని సూచిస్తుంది. ముందున్న ‘సంతోషం’తో భేదాన్ని నిలుపుతూ ‘ఉల్లాసం’ ఈ తీవ్రతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תְּבֹאֶינָה
  choice: ప్రవేశిస్తారు
  rationale: בוא ధాతువు భవనానికి సంబంధించిన ఈ సందర్భంలో లోపలికి రావడం అనే భావాన్ని కలిగిస్తుంది; అందువల్ల ‘ప్రవేశిస్తారు’ స్పష్టమైన, సహజమైన ఎంపిక.
- source_word: בְּהֵיכַל
  choice: రాజభవనంలోకి
  rationale: הֵיכָל అనే పదానికి రాజభవనం, సభామందిరం, లేదా ఇతర సందర్భాల్లో దేవాలయం అనే అర్థాలు ఉండవచ్చు. ఈ రాజవివాహ సందర్భంలో ‘రాజభవనం’ అత్యంత అనుకూలం; ב ఉపసర్గ గమ్యాన్ని సూచిస్తున్నందున ‘లోకి’ వాడబడింది.
- source_word: מֶלֶךְ
  choice: రాజు
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదం లేకపోయినా, సందర్భంలోని నిర్దిష్ట రాజునే నిర్మాణబంధం సూచిస్తుంది. తెలుగులో ‘రాజు రాజభవనం’ అనే సంబంధ నిర్మాణం సహజంగా ఉంది.
theological_decisions:
- issue: స్త్రీలింగ బహువచన క్రియల కర్త
  choice: ‘వారు’ అని ఉంచి, ముందరి సందర్భంలోని వధువు వెంట వచ్చే స్త్రీలను సూచించనివ్వడం
  alternative: ఊరేగింపులోని స్త్రీలు అని సాధారణంగా స్పష్టీకరించడం
  rationale: హీబ్రూ క్రియారూపాలు స్త్రీలింగ బహువచనాన్ని చూపుతాయి; ముందరి వచనం వధువు వెంట వచ్చే కన్యలను ప్రస్తావిస్తుంది. అయినా ఈ వచనంలో కర్తను పేరుతో తిరిగి చెప్పలేదు కాబట్టి అనువాదం ‘వారు’ అని ఉంచి సందర్భానికి మించిన నిర్దిష్టీకరణ చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. సమాంతరమైన ‘సంతోషంతో, ఉల్లాసంతో’ అనే పదజంట మూలంలోని రెండు ఆనందపదాల భేదాన్ని నిలుపుతుంది. పాదటీపు గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
