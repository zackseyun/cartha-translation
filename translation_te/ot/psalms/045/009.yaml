source:
  edition: WLC
  text: בְּנ֣וֹת מְ֭לָכִים בְּ/יִקְּרוֹתֶ֑י/ךָ נִצְּבָ֥ה שֵׁגַ֥ל לִֽ֝/ימִינְ/ךָ֗ בְּ/כֶ֣תֶם אוֹפִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/009.yaml
  text: Daughters of kings are among your honored women[b][a]; at your right hand stands the queen in gold of Ophir.
translation:
  language: te
  text: రాజుల కుమార్తెలు నీ గౌరవనీయ స్త్రీల మధ్య ఉన్నారు[a]; నీ కుడివైపున ఓఫీరు మేలిమి బంగారంతో[b] అలంకరించుకొని రాణి నిలిచింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ అమూల్యమైనవారిలో,’ లేదా ‘నీ గొప్ప స్త్రీల మధ్య.’ ఈ హీబ్రూ పదబంధం అర్థం నిర్ధారించడం కష్టం.
    reason: lexical_alternative
  - marker: b
    text: ‘ఓఫీరు మేలిమి బంగారం’ అంటే ఓఫీరు అనే ప్రాంతంతో సంబంధమున్న ఉన్నతమైన బంగారం. పాత నిబంధనలో ఆ ప్రాంతం సంపదకు, బంగారానికి ప్రసిద్ధి చెందింది.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנוֹת מְלָכִים
  choice: రాజుల కుమార్తెలు
  rationale: హీబ్రూ నిర్మాణాన్ని, రాజసభ దృశ్యాన్ని స్పష్టంగా నిలుపుతుంది; ‘రాకుమార్తెలు’ సహజమైన ప్రత్యామ్నాయమైనా మూలంలోని ‘రాజుల కుమార్తెలు’ అనే చిత్రాన్ని కుదించకుండా ఉంచాం.
- source_word: בְּיִקְּרוֹתֶיךָ
  choice: నీ ఘనత పొందిన స్త్రీలలో
  rationale: ఈ క్లిష్టమైన రూపం יקר (‘విలువైన, ఘనతగల’) నుంచి వచ్చినదిగా గ్రహించి, సందర్భంలోని రాజసభ స్త్రీలను సూచించే భావాన్ని వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయ అర్థాలను పాదసూచికలో నిలిపాం.
- source_word: נִצְּבָה
  choice: నిలిచింది
  rationale: నిఫాల్ సంపూర్ణ క్రియ ఇక్కడ కవితాత్మక దృశ్యాన్ని వర్ణిస్తుంది; తెలుగు భూతరూపం ఆమె తన స్థానంలో నిలిచిన స్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: שֵׁגַל
  choice: రాణి
  rationale: ఈ నామవాచకం రాజుని సహచరి లేదా రాణిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘రాణి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: לִימִינְךָ
  choice: నీ కుడివైపున
  rationale: హీబ్రూ స్థానసూచక పదబంధానికి సహజమైన తెలుగు సమానార్థకం; గౌరవస్థానమైన రాజసభ చిత్రాన్ని నిలుపుతుంది.
- source_word: בְּכֶתֶם אוֹפִיר
  choice: ఓఫీరు బంగారంతో అలంకరించుకున్న
  rationale: כֶּתֶם శ్రేష్ఠమైన బంగారాన్ని సూచిస్తుంది; בְ అనే ఉపసర్గ ఇక్కడ ధరించిన అలంకారాన్ని సూచించగలదు. తెలుగులో అర్థం సహజంగా ఉండేందుకు ‘అలంకరించుకున్న’ అని స్పష్టం చేశాం.
