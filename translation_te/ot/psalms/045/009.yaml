translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక శైలి వాడబడింది. క్లిష్టమైన בְּיִקְּרוֹתֶיךָ పదబంధంలోని అనిశ్చితిని ప్రధాన పాఠంలో ఒక సందర్భోచిత ఎంపికతో, పాదసూచికలో ప్రత్యామ్నాయాలతో భద్రపరిచాం. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠంలో ఉంచబడ్డాయి.
