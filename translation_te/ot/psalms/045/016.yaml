revisions:
- from: నీ పితరులకు బదులుగా నీ కుమారులు వస్తారు; భూమియంతటా[a] వారిని అధిపతులుగా నియమిస్తావు.
  to: నీ పితరుల స్థానంలో నీ కుమారులు ఉంటారు; భూమియంతటా[a] వారిని అధిపతులుగా నియమిస్తావు.
  rationale: The revision replaces “వస్తారు” with “స్థానంలో ... ఉంటారు,” preserving the Hebrew verb’s stative/future sense while making the dynastic substitution expressed by תַּחַת explicit. The second clause and the lexical-alternative footnote accurately retain the source’s ambiguity regarding הארץ.
