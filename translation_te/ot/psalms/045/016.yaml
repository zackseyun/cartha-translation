  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: תַּ֣חַת אֲ֭בֹתֶי/ךָ יִהְי֣וּ בָנֶ֑י/ךָ תְּשִׁיתֵ֥/מוֹ לְ֝/שָׂרִ֗ים בְּ/כָל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/016.yaml
  text: In place of your fathers will be your sons[b][a]; you will appoint them as princes in all the earth.
translation:
  language: te
  text: నీ పితరుల స్థానంలో నీ కుమారులు ఉంటారు; భూమియంతటా[a] వారిని అధిపతులుగా నియమిస్తావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేశమంతటా.’ హీబ్రూ אֶרֶץ సందర్భాన్ని బట్టి ‘భూమి’ లేదా ‘దేశం’ అని అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: బదులుగా
  rationale: ఇక్కడ ఈ పదం స్థలాన్ని కాక, వంశపారంపర్య క్రమంలో ఒకరి స్థానాన్ని మరొకరు చేపట్టడాన్ని సూచిస్తుంది.
- source_word: אֲבֹתֶיךָ
  choice: నీ పితరులు
  rationale: మూలంలోని ‘తండ్రులు’ అనే భావాన్ని, రాజవంశ పూర్వీకుల అర్థసూచనతో సహా, గంభీరమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: יִהְיוּ בָנֶיךָ
  choice: నీ కుమారులు వస్తారు
  rationale: అక్షరార్థంగా ‘నీ కుమారులు ఉంటారు’; అయితే ‘పితరులకు బదులుగా’ అనే వారసత్వ సందర్భంలో ‘వస్తారు’ అనేది వారి స్థానాన్ని కుమారులు చేపడతారనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: תְּשִׁיתֵמוֹ
  choice: వారిని నియమిస్తావు
  rationale: שׁית యొక్క ‘ఉంచు/నిలుపు’ భావం, పాలక పదవిలో ఉంచే ఈ సందర్భంలో ‘నియమించు’గా సహజంగా వ్యక్తమవుతుంది.
- source_word: לְשָׂרִים
  choice: అధిపతులుగా
  rationale: שָׂרִים అంటే రాజకుమారులు, నాయకులు లేదా పాలకులు కావచ్చు. ఇక్కడ ‘అధిపతులు’ రాజసంబంధమైన పాలన భావాన్ని స్పష్టంగా ఇస్తూ, వారు తప్పనిసరిగా రాజు కుమారులే అనే పునరుక్తిని నివారిస్తుంది.
- source_word: בְּכָל הָאָרֶץ
  choice: భూమియంతటా
  rationale: אֶרֶץ అనే పదానికి ‘భూమి’ లేదా ‘దేశం’ అనే రెండు అర్థాలు సాధ్యమే. కీర్తనలోని విస్తృత రాజాధికార భాషకు ‘భూమియంతటా’ సరిపోతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: రాజసంబంధమైన లేదా మెస్సీయసంబంధమైన సందర్భంలో הָאָרֶץ పరిధి
  choice: భూమియంతటా
  alternative: దేశమంతటా
  rationale: హీబ్రూ పదం విశ్వవ్యాప్త పరిధిని గానీ ఒక నిర్దిష్ట దేశాన్ని గానీ సూచించగలదు. కీర్తనలోని ఉన్నతమైన రాజభాషకు విశాల అర్థాన్ని ప్రధాన పాఠంలో ఎంచుకున్నప్పటికీ, తరువాతి సిద్ధాంతపరమైన వ్యాఖ్యానాన్ని బలవంతంగా చొప్పించకుండా మరో సాధ్యమైన అర్థాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన రాజసభా ధోరణి పాటించబడింది. ‘పితరులు,’ ‘కుమారులు,’ ‘అధిపతులు’ అనే పదాలు వంశపారంపర్య రాజ్యాధికార భావాన్ని స్పష్టంగా నిలుపుతాయి.
