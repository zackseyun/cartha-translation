  text: Listen[a], daughter, and see; incline your ear, and forget your people and your father's house.
translation:
  language: te
  text: కుమార్తె, విను[a], చూడు; నీ చెవిని ఒగ్గు; నీ ప్రజలను, నీ తండ్రి ఇంటిని మరచిపో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆలకించు’.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעִי
  choice: విను
  rationale: שׁמע క్రియ యొక్క స్త్రీలింగ ఏకవచన ఆజ్ఞారూపం. ‘విను’ శ్రద్ధగా ఆలకించాలనే పిలుపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בַת
  choice: కుమారీ
  rationale: స్త్రీని నేరుగా సంబోధించే పదం. ఈ వివాహ సందర్భంలో ‘కుమారీ’ సహజమైన గౌరవపూర్వక సంబోధన; బంధుత్వాన్ని అనవసరంగా నిర్ధారించే ‘కుమార్తె’ కంటే సందర్భోచితం.
- source_word: וּרְאִי
  choice: చూడు
  rationale: ראה క్రియ యొక్క స్త్రీలింగ ఏకవచన ఆజ్ఞారూపం. ‘చూడు’ దాని ప్రత్యక్ష అర్థాన్ని, ఆజ్ఞల వరుసను నిలుపుతుంది.
- source_word: וְהַטִּי אָזְנֵךְ
  choice: చెవి ఒగ్గు
  rationale: అక్షరార్థంగా చెవిని వంచి శ్రద్ధగా వినడాన్ని సూచించే హీబ్రూ రూపకాన్ని, తెలుగులో అర్థమయ్యే సంక్షిప్త రూపంలో నిలుపుతుంది.
- source_word: וְשִׁכְחִי
  choice: మరచిపో
  rationale: שׁכח క్రియ యొక్క స్త్రీలింగ ఏకవచన ఆజ్ఞారూపం. మూలంలోని బలమైన ప్రత్యక్ష ఆజ్ఞను ‘విడిచిపెట్టు’ వంటి మృదువైన వివరణగా మార్చకుండా ఉంచుతుంది.
- source_word: עַמֵּךְ
  choice: నీ ప్రజలను
  rationale: עם ఇక్కడ ఆమెకు చెందిన జాతి లేదా సామాజిక సమూహాన్ని సూచిస్తుంది. ‘నీ ప్రజలు’ సరళమైన ప్రత్యక్ష సమానం.
- source_word: וּבֵית אָבִיךְ
  choice: నీ తండ్రి ఇంటివారిని
  rationale: בית אב అనేది తండ్రి వంశపు కుటుంబ గృహాన్ని లేదా కుటుంబ సమూహాన్ని సూచించే హీబ్రూ నానుడి. ‘ఇంటివారు’ ఇక్కడ భవనాన్ని మాత్రమే కాక కుటుంబ గృహాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: వధువుకు ఇచ్చిన ప్రబోధం యొక్క బలం
  choice: తన పుట్టింటి కుటుంబం, ప్రజల కంటే రాజవివాహ బంధానికి ప్రథమ నిబద్ధత ఇవ్వాలని వధువుకు చేసిన ప్రత్యక్ష పిలుపుగా అనువదించడం.
  alternative: నిబద్ధత మార్పును ప్రత్యేకంగా నొక్కకుండా, శ్రద్ధగా వినమనే సాధారణ జ్ఞానోపదేశ పిలుపుగా అనువదించడం.
  rationale: ‘నీ ప్రజలను, నీ తండ్రి ఇంటివారిని మరచిపో’ అనే చివరి ఆజ్ఞ వివాహ సందర్భంలో నిర్ణయాత్మక సంబంధ పునర్ముఖీకరణను సహజంగా సూచిస్తుంది. తరువాతి సిద్ధాంతార్థాలను చేర్చకుండా మూలంలోని ఉద్వేగాన్ని నిలిపాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవపూర్వక కవితా శైలి. వరుస ఆజ్ఞల సంక్షిప్తతను, ‘చెవి ఒగ్గు’ అనే మూల రూపకాన్ని కాపాడింది.
