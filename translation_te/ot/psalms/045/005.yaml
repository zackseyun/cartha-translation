source:
  edition: WLC
  text: חִצֶּ֗י/ךָ שְׁנ֫וּנִ֥ים עַ֭מִּים תַּחְתֶּ֣י/ךָ יִפְּל֑וּ בְּ֝/לֵ֗ב אוֹיְבֵ֥י הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/005.yaml
  text: Your arrows are sharp[a]; peoples fall beneath you; they are in the heart of the king’s enemies.
translation:
  language: te
  text: నీ బాణాలు పదునైనవి[a]; ప్రజలు నీ కింద పడిపోతారు; అవి రాజు శత్రువుల హృదయాలలో ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ కవితాభాష చాలా సంక్షిప్తంగా ఉంది. మరింత అక్షరార్థంగా: “నీ బాణాలు పదునైనవి—ప్రజలు నీ కింద పడిపోతారు—రాజు శత్రువుల హృదయంలో.” చివరి పదబంధంలో క్రియ స్పష్టంగా లేదు; సందర్భానుసారం బాణాలు రాజు శత్రువుల హృదయాలలో ఉన్నట్లు అర్థం చేసుకోవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִצֶּיךָ
  choice: నీ బాణాలు
  rationale: חֵץ అనే పదానికి సహజమైన ఆధునిక తెలుగు సమానార్థం ‘బాణం’; ద్వితీయ పురుష ఏకవచన ప్రత్యయం ‘నీ’గా నిలుపబడింది.
- source_word: שְׁנוּנִים
  choice: పదునైనవి
  rationale: ‘పదునైనవి/పదును పెట్టబడినవి’ అనే విశేషణార్థాన్ని సహజమైన విధేయ నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: עַמִּים
  choice: జనాలు
  rationale: బహువచనమైన ‘ప్రజలు/జనసమూహాలు’ అనే భావాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది; ‘దేశాలు’ అని పరిమితం చేయదు.
- source_word: תַּחְתֶּיךָ
  choice: నీ పాదాల కింద
  rationale: అక్షరార్థమైన ‘నీ కింద’ను యుద్ధం మరియు జయానికి సంబంధించిన తెలుగు నుడికారంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִפְּלוּ
  choice: పడిపోతారు
  rationale: అసంపూర్ణ క్రియకు సందర్భానుగుణమైన భవిష్యత్/సజీవ కవితాత్మక భావాన్ని ఇస్తుంది.
- source_word: בְּלֵב
  choice: హృదయాల్లో ఉన్నాయి
  rationale: హీబ్రూలోని ‘హృదయంలో’ అనే సంక్షిప్త స్థితివాచక నిర్మాణాన్ని నిలుపుతూ, బాణాలు శత్రువుల హృదయాల్లో ఉన్నాయనే సహజంగా గ్రహించదగిన భావాన్ని అందిస్తుంది; ‘చీల్చుతాయి’ వంటి క్రియను మూలంలో లేకుండానే చేర్చదు.
- source_word: אוֹיְבֵי הַמֶּלֶךְ
  choice: రాజు శత్రువుల
  rationale: ‘రాజు యొక్క శత్రువులు’ అనే సంబంధ నిర్మాణాన్ని యథాతథంగా నిలుపుతుంది; దానిని ‘నీ శత్రువులు’గా సమన్వయపరచదు.
theological_decisions:
- issue: రాజకీర్తనలో ‘రాజు’ ఎవరిని సూచిస్తున్నాడు?
  choice: అనువాదంలో ‘రాజు’ అనే మూలపదాన్నే నిలుపడం
  alternative: రాజును నేరుగా మెస్సీయగా గుర్తిస్తూ అనువదించడం
  rationale: ఈ కీర్తనకు మెస్సీయ సంబంధమైన అన్వయం ఉండవచ్చు; అయినా హీబ్రూ పాఠం ఇక్కడ కేవలం ‘రాజు’ అని చెబుతుంది. అనువాదం ఆ చారిత్రక-కవితాత్మక పదాన్ని నిలుపుతూ వ్యాఖ్యానాన్ని పాఠకునికి వదిలివేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలి. మూలంలోని సంక్షిప్తతను ప్రధాన పాఠంలో సాధ్యమైనంతవరకు నిలిపి, దాని వ్యాకరణ అస్పష్టతను పాదసూచికలో స్పష్టంగా తెలిపింది.
