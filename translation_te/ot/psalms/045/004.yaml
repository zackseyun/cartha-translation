id: PSA.45.4
reference: Psalms 45:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/הֲדָ֬רְ/ךָ֨ צְלַ֬ח רְכַ֗ב עַֽל דְּבַר אֱ֭מֶת וְ/עַנְוָה צֶ֑דֶק וְ/תוֹרְ/ךָ֖ נוֹרָא֣וֹת יְמִינֶֽ/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/004.yaml
  text: In your majesty ride on victoriously for the cause of truth and meekness and righteousness[b][a]; let your right hand teach you awesome deeds.
translation:
  language: te
  text: నీ మహిమతో విజయవంతంగా స్వారీ చేస్తూ ముందుకు సాగు—సత్యం, వినయం, నీతి కోసం[a]; నీ కుడిచేయి నీకు భయవిస్మయకరమైన కార్యాలను నేర్పుగాక[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సత్యం కోసం, వినయంతో కూడిన నీతి కోసం.’ హీబ్రూ పదబంధం సంక్షిప్తంగా ఉంది; ‘వినయం,’ ‘నీతి’ అనే వేర్వేరు అంశాలుగానూ, ఒకదానితో ఒకటి అనుసంధానమైన పదబంధంగానూ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘నీ కుడిచేయి నీకు భయవిస్మయకరమైన కార్యాలను నేర్పుతుంది.’
    reason: grammatical_alternative
lexical_decisions:
- source_word: וַהֲדָרְךָ
  choice: నీ మహిమతో
  rationale: הָדָר అనే పదం మహిమ, వైభవం, ఘనత అనే భావాలను ఇస్తుంది. హీబ్రూలో సాధనార్థక విభక్తి స్పష్టంగా లేకపోయినా, తరువాతి ఆజ్ఞలతో సహజంగా కలిసే సందర్భార్థాన్ని ‘నీ మహిమతో’ తెలియజేస్తుంది.
- source_word: צְלַח רְכַב
  choice: విజయవంతంగా ముందుకు సాగుతూ స్వారీ చేయి
  rationale: צְלַח విజయవంతంగా సాగడం లేదా వర్ధిల్లడం అనే భావాన్ని, רְכַב స్వారీ చేయడం అనే భావాన్ని ఇస్తాయి. రాజసైనిక దృశ్యాన్ని, విజయపూర్వక ముందడుగును రెండింటినీ ఈ అనువాదం నిలుపుతుంది.
- source_word: עַל דְּבַר אֱמֶת
  choice: సత్యం ... కోసం
  rationale: דְּבַר ఇక్కడ మాట అనే అర్థం కంటే విషయం లేదా పక్షం/కారణం అనే భావంలో ఉంది. అందువల్ల రాజు సత్యం పక్షాన ముందుకు సాగుతున్న భావాన్ని ‘సత్యం కోసం’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְעַנְוָה צֶדֶק
  choice: వినయం, నీతి
  rationale: עַנְוָה ‘వినయం/సాత్వికత,’ צֶדֶק ‘నీతి/న్యాయం.’ హీబ్రూ నిర్మాణం సంక్షిప్తంగా ఉండి పరస్పర సంబంధం అస్పష్టంగా ఉంది. ప్రధాన పాఠంలో సమన్వయ శ్రేణిగా అనువదించి, ‘వినయంతో కూడిన నీతి’ అనే సాధ్యమైన పఠనాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְתוֹרְךָ
  choice: నీకు ... నేర్పుగాక
  rationale: ירה హిఫీల్ రూపం ‘నేర్పడం, చూపించడం, దారితీయడం’ అని అర్థమిస్తుంది. ముందున్న ఆజ్ఞల కొనసాగింపుగా ఆశీర్వాదాత్మక/ఆజ్ఞార్థక భావాన్ని ‘నేర్పుగాక’ నిలుపుతుంది; భవిష్యదర్థ పఠనం పాదసూచికలో ఉంది.
- source_word: נוֹרָאוֹת
  choice: భయవిస్మయాలు కలిగించే కార్యాలు
  rationale: ఈ పదం భయం, విస్మయం, గాఢమైన సంభ్రమం కలిగించే విషయాలు లేదా కార్యాలను సూచిస్తుంది. ‘భయంకరమైనవి’ మాత్రమే అనడం వల్ల వచ్చే ప్రతికూల పరిమితిని తప్పిస్తూ, మూలంలోని భయం-విస్మయం రెండింటినీ నిలుపుతుంది.
- source_word: יְמִינֶךָ
  choice: నీ కుడిచేయి
  rationale: శక్తి, నైపుణ్యం, విజయకార్యాలకు సంబంధించిన రాజసైనిక కవితా చిత్రాన్ని యథాతథంగా నిలుపడానికి అక్షరార్థంగా అనువదించాం.
theological_decisions:
- issue: తరువాత మెస్సీయ సంబంధంగా చదవబడిన కీర్తనలోని రాజయోధుని చిత్రం
  choice: వచనంలోని తక్షణ రాజసంబోధనను నిలుపుతూ, అనువాదంలో ప్రత్యక్ష మెస్సీయ గుర్తింపును చేర్చలేదు.
  alternative: వచనాన్నే నేరుగా మెస్సీయను సూచించేలా విస్తరించడం.
  rationale: ఈ కీర్తనకు విస్తృత గ్రంథసంపుట సంబంధమైన మెస్సీయ ప్రాధాన్యం ఉన్నప్పటికీ, ఈ వచనం కవితాత్మక రాజభాషలో రాజును సంబోధిస్తుంది. మూలంలోని చారిత్రక-సాహిత్య భావాన్ని నిలిపితే తదుపరి ధార్మిక అన్వయానికి స్థలం ఉంటుంది.
- issue: וְעַנְוָה צֶדֶק పదబంధ నిర్మాణం
  choice: ‘వినయం, నీతి’ అనే సమన్వయ శ్రేణిని ప్రధాన పాఠంలో ఉంచాం.
  alternative: ‘వినయంతో కూడిన నీతి’ లేదా ‘నీతి యొక్క వినయం.’
  rationale: హీబ్రూ పదబంధం సంక్షిప్తమూ సందిగ్ధమూ. పదాలను ఒకే గుణవాచక సమాసంగా నిర్బంధించకుండా రెండింటినీ స్పష్టంగా నిలిపి, ప్రత్యామ్నాయ సంబంధాన్ని పాదసూచికలో తెలిపాం.
- issue: וְתוֹרְךָ యొక్క విధి
  choice: ముందున్న ఆజ్ఞలకు అనుసంధానంగా ‘నేర్పుగాక’ అని అనువదించాం.
  alternative: ‘నీ కుడిచేయి నీకు భయవిస్మయాలు కలిగించే కార్యాలను నేర్పుతుంది.’
  rationale: రూపం భవిష్యదర్థాన్ని అనుమతించినా, వరుస ఆజ్ఞల సందర్భంలో సంకల్పార్థక/ఆశీర్వాదాత్మక పఠనం సహజం. వ్యాకరణపరమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా స్వరం ఉంచాం. ‘స్వారీ చేయి,’ ‘కుడిచేయి’ వంటి రాజసైనిక చిత్రాలను నిలిపి, సాధారణ పాఠకుడికి అర్థమయ్యే పదజాలాన్ని వాడాం. ‘భయవిస్మయాలు కలిగించే’ అనే ప్రయోగం נוֹרָאוֹת లోని భయం మరియు సంభ్రమం రెండింటినీ తెలియజేస్తుంది.
