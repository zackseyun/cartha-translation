  to: నీ మహిమతో విజయవంతంగా స్వారీ చేస్తూ ముందుకు సాగు—సత్యం, వినయం, నీతి కోసం[a]; నీ కుడిచేయి నీకు భయవిస్మయకరమైన కార్యాలను నేర్పుగాక[b].
  rationale: సవరణలు అర్థాన్ని మార్చవు. మొదటి సవరణ హీబ్రూలోని విజయవంతమైన ప్రయాణం మరియు స్వారీ అనే జత ఆజ్ఞలను తెలుగులో సహజంగా కలుపుతుంది. రెండవది నוֹרָאוֹתలోని భయానక-విస్మయకర భావాన్ని కవితాత్మకంగా, సంక్షిప్తంగా నిలుపుతుంది. సందిగ్ధమైన వినయం–నీతి సంబంధాన్ని పరిష్కరించకుండా ప్రధాన పాఠం మరియు పాదసూచికలో భద్రపరచబడింది.
