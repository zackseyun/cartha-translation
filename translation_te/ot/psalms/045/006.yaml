base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/006.yaml
  text: Your throne[a], O God, is forever and ever[b]; the scepter of your kingdom is a scepter of uprightness.
translation:
  language: te
  text: దేవా, నీ సింహాసనం[a] యుగయుగాల వరకు నిలిచి ఉంటుంది; నీ రాజ్యపు రాజదండం నీతియుక్తమైన రాజదండం.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ సింహాసనం దేవుడే, యుగయుగాల వరకు,” లేదా, “నీ దైవిక సింహాసనం యుగయుగాల వరకు నిలిచి ఉంటుంది.” హెబ్రూ వాక్యనిర్మాణాన్ని ఎలా అర్థం చేసుకోవాలనే విషయంలో భిన్నాభిప్రాయాలు ఉన్నాయి; ప్రధాన పాఠం ‘దేవా’ అనే సంబోధన పఠనాన్ని అనుసరిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, “నీతియుక్తమైన రాజదండమే నీ రాజ్యపు రాజదండం.”
    reason: previous_rendering
lexical_decisions:
- source_word: כִּסְאֲךָ
  choice: నీ సింహాసనం
  rationale: כִּסֵּא రాజు కూర్చునే అధికార పీఠాన్ని సూచిస్తుంది. ఈ రాజకీర్తన సందర్భంలో ‘సింహాసనం’ సహజమైన, నిర్దిష్టమైన తెలుగు సమానం.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ఇక్కడ אֱלֹהִים‌ను సంబోధనగా గ్రహించడం హెబ్రూ వాక్యనిర్మాణానికి సహజంగా సరిపోతుంది; కీర్తనలోని ప్రత్యక్ష సంబోధన శైలినీ నిలుపుతుంది. ఇతర సాధ్యమైన పఠనాలను పాదసూచికలో ఉంచాం.
- source_word: עוֹלָם וָעֶד
  choice: యుగయుగాల వరకు
  rationale: ఈ పదజంట అంతంలేని, నిరంతర కాలాన్ని ఉద్ఘాటిస్తుంది. ‘యుగయుగాల వరకు’ ఆ భావాన్ని సహజమైన కీర్తనా భాషలో తెలియజేస్తుంది.
- source_word: שֵׁבֶט
  choice: రాజదండం
  rationale: రాజసంబంధ సందర్భంలో שֵׁבֶט సాధారణ కర్రను కాక పాలకుని అధికారాన్ని సూచించే రాజదండాన్ని సూచిస్తుంది.
- source_word: מִישֹׁר
  choice: న్యాయవర్తనగల
  rationale: מִישֹׁר నైతికంగా నిటారుతనం, యథార్థత, సమన్యాయాన్ని సూచిస్తుంది. ‘న్యాయవర్తనగల’ అనే పదం దాని నైతిక భావాన్ని నిలుపుతూ అతిగా న్యాయశాస్త్రార్థాన్ని రుద్దదు.
- source_word: שֵׁבֶט מַלְכוּתֶךָ
  choice: నీ రాజ్యపు రాజదండం
  rationale: ఈ రూపం హెబ్రూలోని సంబంధ నిర్మాణాన్ని కాపాడి, రాజ్యాధికారాన్ని సూచించే సహజమైన తెలుగు పదబంధంగా ఉంటుంది.
theological_decisions:
- issue: మొదటి పాదంలో אֱלֹהִים పదపు వాక్యనిర్మాణ, దైవశాస్త్ర భావం
  choice: 'సంబోధన పఠనం: ‘దేవా, నీ సింహాసనం యుగయుగాల వరకు నిలిచి ఉంటుంది’'
  alternative: 'విధేయ పఠనం: ‘నీ సింహాసనం యుగయుగాల వరకు దేవుడే’; గుణవాచక పఠనం: ‘నీ దైవిక సింహాసనం యుగయుగాల వరకు నిలిచి ఉంటుంది’'
  rationale: హెబ్రూ వాక్యనిర్మాణంపై భిన్నాభిప్రాయాలు ఉన్నప్పటికీ, సందర్భంలో సంబోధన పఠనం సహజంగా ఉంటుంది; ప్రాచీన స్వీకరణలోనూ హెబ్రీయులు 1:8లోని వినియోగంలోనూ ఇది ప్రతిఫలిస్తుంది. అయినా వచనంలోని నిజమైన అస్పష్టతను తొలగించకుండా ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, కీర్తనకు తగిన గంభీరతతో అనువదించాం. ‘సింహాసనం,’ ‘రాజదండం,’ ‘యుగయుగాల వరకు’ వంటి సుపరిచితమైన రాజసంబంధ, కవితాత్మక పదాలను వాడాం; హెబ్రూ నామవాక్యాలను తెలుగులో సహజంగా చేయడానికి అవసరమైన చోట ‘నిలిచి ఉంటుంది’ అనే క్రియను పూరించాం.
