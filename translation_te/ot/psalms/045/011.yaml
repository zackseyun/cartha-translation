revisions:
- from: రాజు నీ సౌందర్యాన్ని కోరుకుంటాడు[a]; ఎందుకంటే అతడే నీ ప్రభువు. అతనికి సాష్టాంగపడు[b].
  to: రాజు నీ సౌందర్యాన్ని కోరుకుంటాడు[a]; అతడు నీ ప్రభువు గనుక, అతనికి వంగి నమస్కరించు[b].
  rationale: The revision retains the defensible future sense of the imperfect and the explicit causal basis for the command. It changes only the final imperative to a modern, physically concrete Telugu expression that corresponds closely to “bow down” and does not impose a specifically ritual or doctrinal interpretation. Footnote b is adjusted to match the revised wording and retain the interpretive alternatives.
