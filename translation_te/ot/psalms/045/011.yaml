review_pass:
  verdict: revise
  source_fidelity: The future rendering of וְיִתְאָו as “కోరుకుంటాడు” is defensible, and footnote a appropriately preserves its possible volitional nuance. “నీ సౌందర్యాన్ని,” “నీ ప్రభువు,” and the causal connection accurately represent the Hebrew. The imperative וְהִשְׁתַּחֲוִי calls for an act of bowing/prostration before him; the current “సాష్టాంగపడు” can be heard as a specifically ritual full prostration and is less neutral than the Hebrew requires in this royal setting.
  naturalness: The draft is generally natural modern Telugu, but “అతనికి సాష్టాంగపడు” is somewhat marked and can imply religious ritual. “అతనికి వంగి నమస్కరించు” is clear, idiomatic, and preserves the bodily act without deciding its religious character.
  terminology: “ప్రభువు” suitably conveys אֲדֹנַיִךְ as a royal-marital title without capitalizing or identifying the king with God. Replacing “సాష్టాంగపడు” avoids over-specifying the reverence while retaining the Hebrew action.
  issues:
  - severity: medium
    issue: ‘సాష్టాంగపడు’ over-specifies the bowing command.
    rationale: While it can denote prostration, in contemporary Telugu it commonly carries a strongly devotional or ritual sense and may suggest a more specific posture than the Hebrew necessarily demands. The psalm’s immediate royal-court setting calls for a rendering that leaves courtly homage and religious reverence open.
  revised_text: రాజు నీ సౌందర్యాన్ని కోరుకుంటాడు[a]; అతడు నీ ప్రభువు గనుక, అతనికి వంగి నమస్కరించు[b].
