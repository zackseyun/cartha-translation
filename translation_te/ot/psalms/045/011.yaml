source:
  edition: WLC
  text: וְ/יִתְאָ֣ו הַ/מֶּ֣לֶךְ יָפְיֵ֑/ךְ כִּי ה֥וּא אֲ֝דֹנַ֗יִ/ךְ וְ/הִשְׁתַּֽחֲוִי לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/011.yaml
  text: and the king will desire your beauty[a], for he is your lord[b]; bow down to him.
translation:
  language: te
  text: రాజు నీ సౌందర్యాన్ని కోరుకుంటాడు[a]; అతడు నీ ప్రభువు గనుక, అతనికి వంగి నమస్కరించు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రాజు నీ సౌందర్యాన్ని కోరుకోవాలి’ లేదా ‘కోరుకొనుగాక’; హీబ్రూ రూపాన్ని భవిష్యత్ ప్రకటనగానూ, కోరికను వ్యక్తం చేసే మాటగానూ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతనికి గౌరవంగా నమస్కరించు’ లేదా ‘అతనికి విధేయత చూపు’; ఈ క్రియ ఉన్నతాధికారి ఎదుట గౌరవంతో వంగడాన్ని సూచించవచ్చు—అది రాజసభాపరమైనదైనా, మతపరమైనదైనా కావచ్చు. కొందరు ‘అతన్ని ఆరాధించు’ అని కూడా అనువదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִתְאָו
  choice: కోరుకుంటాడు
  rationale: Hitpael imperfect 3ms రూపాన్ని సందర్భానుసారంగా సాధారణ భవిష్యత్ ప్రకటనగా అనువదించాం. దీనిలో కోరిక లేదా ఆకాంక్ష భావం ఉంది; ఆజ్ఞార్థక భావాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చలేదు.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: నిర్దిష్ట నామవాచకానికి సహజమైన ప్రత్యక్ష అనువాదం.
- source_word: יָפְיֵךְ
  choice: నీ సౌందర్యాన్ని
  rationale: స్త్రీ ఏకవచన ద్వితీయ పురుష ప్రత్యయంతో ఉన్న ‘సౌందర్యం’ అనే భావాన్ని నేరుగా, గౌరవప్రదంగా తెలిపింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: తరువాతి వాక్యం ముందటి మాటకు కారణాన్ని ఇస్తున్నందున స్పష్టమైన కారణార్థక అనుసంధానం.
- source_word: הוּא
  choice: అతడే
  rationale: హీబ్రూ స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగు ‘ఏ’ ద్వారా నిలిపాం.
- source_word: אֲדֹנַיִךְ
  choice: నీ ప్రభువు
  rationale: ఇది దైవనామం కాదు; రాజు లేదా భర్తకు సంబంధించిన అధికారసూచక సంబోధన. ‘యజమాని’ కంటే ‘ప్రభువు’ ఈ రాజవివాహ కవితా సందర్భంలో గౌరవప్రదంగా, సహజంగా ఉంది.
- source_word: וְהִשְׁתַּחֲוִי
  choice: సాష్టాంగపడు
  rationale: తనను తాను వంచుకొని నమస్కరించే శారీరక చర్యను సూచిస్తుంది. ఇది రాజసభాపరమైన విధేయతకా, మతపరమైన ఆరాధనకా అన్నదాన్ని నిర్ణయించకుండా ఉంచుతుంది.
- source_word: לוֹ
  choice: అతనికి
  rationale: పూర్వప్రత్యయం మరియు తృతీయ పురుష ఏకవచన ప్రత్యయానికి సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: וְהִשְׁתַּחֲוִי לּוֹ అనే మాటకు స్పష్టంగా మతపరమైన భాష వాడాలా?
  choice: అతనికి సాష్టాంగపడు
  alternative: అతనికి విధేయతతో నమస్కరించు; అతన్ని ఆరాధించు
  rationale: హీబ్రూ క్రియ దేవుని ఎదుటగానీ, మానవ అధికారి ఎదుటగానీ వంగడాన్ని సూచించగలదు. ‘ఆరాధించు’ అని అనువదిస్తే మూలపాఠం తప్పనిసరిగా చెప్పని మతపరమైన అర్థాన్ని నిర్ణయించినట్లవుతుంది. ప్రధాన పాఠ్యం చర్యను తెలిపి, దాని రాజసభాపరమైన లేదా మతపరమైన స్వభావాన్ని తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గౌరవప్రదమైన కవితా శైలిని వాడాం. ‘అతడే’ ద్వారా హీబ్రూ ఉద్ఘాటనను నిలిపాం. ‘సాష్టాంగపడు’ అనే పదం శారీరకంగా వంగి నమస్కరించే చర్యను స్పష్టంగా తెలిపినా, దానిని తప్పనిసరిగా మతపరమైన ఆరాధనగా నిర్ణయించదు.
