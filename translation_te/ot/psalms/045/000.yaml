  yaml_path: translation/ot/psalms/045/000.yaml
  text: 'For the choirmaster: according to “Lilies.” Of the sons of Korah[a]. A Maskil[c][b]. A song of loves.'
translation:
  language: te
  text: సంగీత నిర్దేశకునికి; “షోషన్నీమ్”[a] ప్రకారం. కోరహు కుమారులది. మస్కీల్‌[b]. ప్రేమల గీతం.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీయులో షోషన్నీమ్; అక్షరార్థం “కలువలు.” ఇది బహుశా ఒక రాగం లేదా సంగీత పద్ధతి పేరు.
    reason: lexical_alternative
  - marker: b
    text: మస్కీల్ అనేది కీర్తనల శీర్షికల్లో కనిపించే సాంకేతిక పదం; ఇది ధ్యానాత్మకమైన లేదా బోధాత్మకమైన రచనను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా “ప్రేమగీతం.” హెబ్రీయులో అక్షరార్థంగా “ప్రేమల గీతం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నిర్దేశకునికి
  rationale: కీర్తనల శీర్షికల్లో ఈ పదం సంగీత నిర్వహణకు బాధ్యుడైన వ్యక్తిని సూచిస్తుంది; ‘సంగీత నిర్దేశకుడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, గాయకబృందానికే అర్థాన్ని పరిమితం చేయదు.
- source_word: עַל שֹׁשַׁנִּים
  choice: “షోషన్నీమ్” ప్రకారం
  rationale: עַל ఇక్కడ రాగం, సంగీత పద్ధతి లేదా వాద్య సూచనను పరిచయం చేయవచ్చు. שֹׁשַׁנִּים అక్షరార్థంగా ‘కలువలు’; అయితే శీర్షికలో దాని సాంకేతిక భావం అనిశ్చితమైనందున లిప్యంతరీకరణను ప్రధాన పాఠ్యంలో ఉంచి, అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: לִבְנֵי קֹרַח
  choice: కోరహు కుమారులది
  rationale: לְ కర్తృత్వం, అంకితం లేదా అనుబంధాన్ని సూచించవచ్చు. ‘కుమారులది’ ఈ సంబంధాన్ని అతిగా నిర్ధారించకుండా సంక్షిప్తంగా నిలుపుతుంది.
- source_word: מַשְׂכִּיל
  choice: మస్కీల్‌
  rationale: ఇది కీర్తన శీర్షికల్లోని సాంకేతిక పదం; ఖచ్చిత భావం తెలియనందున ‘బోధగీతం’ లేదా ‘ధ్యానగీతం’ అని నిర్ణయించకుండా లిప్యంతరీకరించాం.
- source_word: שִׁיר יְדִידֹת
  choice: ప్రేమల గీతం
  rationale: שִׁיר అంటే ‘గీతం’; יְדִידֹת బహువచన రూపాన్ని ‘ప్రేమల’గా నిలిపి, అసాధారణమైన హెబ్రీయ వ్యక్తీకరణలోని కవితాత్మక సందిగ్ధతను కాపాడాం.
