source:
  edition: WLC
  text: חֲגֽוֹר חַרְבְּ/ךָ֣ עַל יָרֵ֣ךְ גִּבּ֑וֹר ה֝וֹדְ/ךָ֗ וַ/הֲדָרֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/003.yaml
  text: Strap your sword on your thigh[a], mighty warrior[b], in your splendor and your majesty.
translation:
  language: te
  text: శూరుడా, నీ వైభవంతోను మహిమతోను నీ ఖడ్గాన్ని నీ తొడకు కట్టుకో.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో చివరి పదబంధం, “నీ వైభవం మరియు నీ మహిమ,” సంక్షిప్త కావ్యనిర్మాణంలో ఉంది. దీనిని “నీ వైభవంతోను మహిమతోను” అని క్రియకు అనుసంధానించవచ్చు; లేదా ఆజ్ఞకు తోడైన ప్రత్యేక రాజసమైన పదబంధంగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲגוֹר
  choice: కట్టుకో
  rationale: חגר అనే ఆజ్ఞారూపం ఆయుధాన్ని నడుముకు లేదా తొడ వద్ద బిగించుకోవడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘కట్టుకో’ సహజంగా ఉండి, ఆ క్రియ యొక్క స్పష్టమైన దృశ్యాన్ని నిలుపుతుంది.
- source_word: חַרְבְּךָ
  choice: నీ ఖడ్గాన్ని
  rationale: రెండవ పురుష ఏకవచన స్వామ్యప్రత్యయం కలిగిన ప్రత్యక్ష కర్మ. కవితాత్మకమైన యుద్ధ సందర్భంలో ‘ఖడ్గం’ గంభీరంగా, స్పష్టంగా సరిపోతుంది.
- source_word: עַל יָרֵךְ
  choice: నీ తొడకు
  rationale: హీబ్రూ పదబంధంలోని శరీరస్థానాన్ని యథాతథంగా నిలుపుతుంది; ‘నీ ప్రక్కన’ అని సాధారణీకరించలేదు.
- source_word: גִּבּוֹר
  choice: శూరుడా
  rationale: సంబోధనగా ఉన్న גִּבּוֹר బలవంతుడైన యోధుణ్ణి సూచిస్తుంది. ‘శూరుడా’ సంక్షిప్తంగా, సహజంగా, కవితాత్మకంగా యుద్ధ భావాన్ని అందిస్తుంది.
- source_word: הוֹדְךָ
  choice: నీ వైభవంతో
  rationale: రాజసంబంధమైన ప్రకాశం, ఘనత అనే భావాన్ని ‘వైభవం’ తెలియజేస్తుంది; తరువాతి הדר పదంతో ఉన్న సమాంతరత్వంలోనూ భేదాన్ని నిలుపుతుంది.
- source_word: וַהֲדָרֶךָ
  choice: నీ మహిమతో
  rationale: הדר యొక్క రాజోచిత మహత్తు, ఘనత భావాన్ని ‘మహిమ’ సహజంగా వ్యక్తపరుస్తుంది; הוֹדకు వాడిన ‘వైభవం’తో కలిపి ఉన్నతమైన కవితా స్వరాన్ని కాపాడుతుంది.
theological_decisions:
- issue: 45వ కీర్తనలో రాజసంబంధమైన లేదా మెస్సీయసంబంధమైన సంబోధన
  choice: వచనాన్ని ఒక రాజయోధునికి చేసిన ప్రత్యక్ష సంబోధనగా అనువదించడం; మెస్సీయ గుర్తింపును పద్యంలో స్పష్టంగా చేర్చకపోవడం.
  alternative: తరువాతి గ్రంథసంబంధ వినియోగం వెలుగులో ఈ సంబోధనను ప్రత్యక్షంగా మెస్సీయకు వర్తింపజేసేలా అనువదించడం.
  rationale: హీబ్రూ వచనం స్వయంగా శూరుడైన రాజపాత్రను సంబోధిస్తుంది గాని, ఈ వాక్యంలో అతణ్ణి మెస్సీయగా స్పష్టంగా గుర్తించదు. అందువల్ల తక్షణ రాజసంబంధ భావాన్ని నిలిపి, విస్తృత ధార్మిక అన్వయాన్ని పాఠకుడికి వదిలింది.
- issue: הוֹדְךָ וַהֲדָרֶךָ యొక్క వాక్యనిర్మాణ సంబంధం
  choice: ‘నీ వైభవంతో, నీ మహిమతో’ అని క్రియకు అనుసంధానించడం.
  alternative: ‘నీ వైభవం, నీ మహిమ’ అని శూరునికి లేదా ఖడ్గానికి సమానాధికార పదబంధంగా తీసుకోవడం.
  rationale: హీబ్రూ కవితా నిర్మాణం కొంత సంక్షిప్తంగా ఉండి సంబంధంలో స్వల్ప సందిగ్ధతను అనుమతిస్తుంది. ప్రధాన పాఠంలో సాధనార్థక/పరిస్థిత్యర్థక అనుసంధానం సహజంగా ఉంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తనకు తగిన గంభీర కవితా ధోరణి ఉంచబడింది. ‘శూరుడా’, ‘ఖడ్గం’, ‘వైభవం’, ‘మహిమ’ అనే పదాలు రాజసమైన యుద్ధ దృశ్యాన్ని సాధారణ పాఠకుడికి అర్థమయ్యే రీతిలో అందిస్తాయి.
