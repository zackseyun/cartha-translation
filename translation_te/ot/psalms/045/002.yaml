  terminology: “కృప” is a defensible rendering of חֵן, while the footnote appropriately preserves “అనుగ్రహం” and “మనోహరత” and notes the possible sense of gracious speech. “దేవుడు” and “ఆశీర్వదించాడు” faithfully render the selected syntactic reading without importing later verse material or doctrinal interpretation.
