id: PSA.45.2
reference: Psalms 45:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יָפְיָפִ֡יתָ מִ/בְּנֵ֬י אָדָ֗ם ה֣וּצַק חֵ֭ן בְּ/שְׂפְתוֹתֶ֑י/ךָ עַל כֵּ֤ן בֵּֽרַכְ/ךָ֖ אֱלֹהִ֣ים לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/002.yaml
  text: You are more beautiful than the sons of men[a]; grace is poured upon your lips[c][b]; therefore God has blessed you forever.
translation:
  language: te
  text: నీవు ఇతర మనుష్యులకంటే మరింత సుందరుడవు[a]; నీ పెదవులపై కృప[b] కుమ్మరించబడింది; అందుచేత దేవుడు నిన్ను శాశ్వతంగా ఆశీర్వదించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘మనుష్యుని కుమారులకంటే’; ఇది రాజును ఇతర మానవులతో పోల్చే హీబ్రూ కవితా ప్రయోగం.
    reason: cultural_note
  - marker: b
    text: లేదా ‘అనుగ్రహం,’ ‘మనోహరత’; ఇక్కడ కృపగల మాటల భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָפְיָפִיתָ
  choice: అతి సుందరుడవు
  rationale: יפה నుండి వచ్చిన ఈ కవితాత్మక తీవ్రరూపం అసాధారణమైన, ఇతరులను మించిన సౌందర్యాన్ని సూచిస్తుంది. పురుష రాజును సంబోధిస్తున్నందున పురుషలింగ రూపం వాడబడింది.
- source_word: מִבְּנֵי אָדָם
  choice: మనుష్యులందరికంటే
  rationale: అక్షరార్థంగా ‘మనుష్యుని కుమారులకంటే’. ఆధునిక తెలుగులో సహజంగా ఉండేలా, రాజును ఇతర మానవులందరితో పోల్చే భావాన్ని ఇచ్చింది; దీనికి సంబంధించిన అక్షరార్థ కవితా రూపాన్ని పాదసూచికలో ఉంచింది.
- source_word: הוּצַק
  choice: కుమ్మరించబడింది
  rationale: יצק యొక్క కర్మణి సంపూర్ణ రూపం. ‘కుమ్మరించబడింది’ మూలంలోని సమృద్ధిగా పోయడం అనే సజీవ రూపకాన్నీ, పూర్తయిన క్రియ భావాన్నీ నిలుపుతుంది.
- source_word: חֵן
  choice: కృప
  rationale: חֵן అనేది కృప, అనుగ్రహం, మనోహరత అనే అర్థాలను కలిగి ఉంటుంది. పెదవులతో సంబంధం ఉన్నందున కృపగల లేదా మనోహరమైన మాట అనే విస్తృత భావాన్ని నిలుపుతూ ‘కృప’ను ఎంచుకుంది.
- source_word: בְּשְׂפְתוֹתֶיךָ
  choice: నీ పెదవులపై
  rationale: హీబ్రూ ఉపసర్గకు అక్షరార్థంగా ‘లో/తో’ అనే పరిధి ఉన్నా, కుమ్మరించే రూపకంతో తెలుగులో ‘పెదవులపై’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: עַל כֵּן
  choice: అందుచేత
  rationale: ముందటి వర్ణనను దేవుని ఆశీర్వాదంతో అనుసంధానించే కారణార్థక సంబంధాన్ని గంభీరమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בֵּרַכְךָ אֱלֹהִים
  choice: దేవుడు నిన్ను ఆశీర్వదించాడు
  rationale: క్రియ మూడవ పురుష ఏకవచన సంపూర్ణరూపం, రెండవ పురుష ఏకవచన ప్రత్యయం కలది; אֱלֹהִיםను కర్తగా తీసుకోవడం ఈ వాక్యంలోని అత్యంత సహజమైన వాక్యనిర్మాణం.
- source_word: לְעוֹלָם
  choice: శాశ్వతంగా
  rationale: నిరంతరమైన కాలవ్యాప్తిని సూచిస్తుంది; ‘శాశ్వతంగా’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, కీర్తన శైలికి తగినట్టుగా ఉంటుంది.
theological_decisions:
- issue: చివరి ఉపవాక్యంలో אֱלֹהִים కర్తనా (‘దేవుడు నిన్ను ఆశీర్వదించాడు’), లేక సంబోధనా (‘ఓ దేవా’)?
  choice: '‘దేవుడు’ అనే కర్తగా అనువదించబడింది: ‘అందుచేత దేవుడు నిన్ను శాశ్వతంగా ఆశీర్వదించాడు.’'
  alternative: ‘ఓ దేవా’ అనే సంబోధనగా తీసుకోవడం; లేదా తరువాతి వచనంలోని మాటలను ఇక్కడికి చేర్చి ‘నీ దేవుడు నిన్ను ఆశీర్వదించాడు’ అని అనువదించడం.
  rationale: ఈ వచనాన్ని స్వతంత్రంగా పరిశీలిస్తే, אֱלֹהִיםను בֵּרַכְךָ క్రియకు కర్తగా తీసుకోవడమే అత్యంత సహజమైన హీబ్రూ వాక్యనిర్మాణం. తరువాతి వచనంలోని పదాలను ఇక్కడికి దిగుమతి చేయకుండా, మెస్సీయ సంబంధమైన వ్యాఖ్యానాన్ని మూలవచనం చెప్పేదానికంటే ఎక్కువగా బలవంతం చేయకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యే సహజమైన వాక్యనిర్మాణంతో పాటు కీర్తనకు తగిన గౌరవప్రదమైన కవితా శైలి. పురుష రాజును ఉద్దేశించిన మూలంలోని లింగసూచన నిలుపబడింది; అస్పష్టమైన חֵן భావపరిధి పాదసూచికలో సంరక్షించబడింది.
