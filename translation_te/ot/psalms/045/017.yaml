id: PSA.45.17
reference: Psalms 45:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַזְכִּ֣ירָה שִׁ֭מְ/ךָ בְּ/כָל דֹּ֣ר וָ/דֹ֑ר עַל כֵּ֥ן עַמִּ֥ים יְ֝הוֹדֻ֗/ךָ לְ/עֹלָ֥ם וָ/עֶֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/017.yaml
  text: I will cause your name to be remembered in every generation[b][a]; therefore the peoples will praise you forever and ever.
translation:
  language: te
  text: ప్రతి తరంలో నీ పేరు జ్ఞాపకం ఉండేలా చేస్తాను[a]; అందుచేత జనజాతులు నిన్ను సదాకాలం స్తుతిస్తారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ పేరును ప్రస్తావిస్తాను,’ లేదా ‘నీ పేరును జ్ఞాపకం చేసుకుంటాను.’ హెబ్రీయ క్రియ కారణార్థక రూపంలో ఉండటం వల్ల క్రియాశీలంగా జ్ఞాపకం నిలిపే భావం ప్రధానంగా కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నీకు కృతజ్ఞతలు చెల్లిస్తారు.’ హెబ్రీయ క్రియ ఆరాధనా సందర్భాల్లో స్తుతి లేదా కృతజ్ఞత అనే రెండు భావాలనూ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַזְכִּירָה
  choice: జ్ఞాపకం ఉండేలా చేస్తాను
  rationale: זכר అనే ధాతువు హిఫీల్ రూపంలో ఉన్నందున కేవలం వ్యక్తిగతంగా జ్ఞాపకం చేసుకోవడం కాక, పేరు తరతరాలకు స్మరించబడేలా చేయడం అనే కారణార్థక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שִׁמְךָ
  choice: నీ పేరు
  rationale: మూలంలోని ప్రత్యక్ష సంబోధనను యథాతథంగా ఉంచుతుంది; ఇక్కడ ‘పేరు’ కీర్తి, ఖ్యాతి, స్మారక గుర్తింపు అనే విస్తృత భావాలను కూడా మోస్తుంది.
- source_word: בְּכָל דֹּר וָדֹר
  choice: ప్రతి తరంలో
  rationale: అక్షరార్థంగా ‘ప్రతి తరం తరంలో’ అనే హెబ్రీయ ఇడియమ్ వరుసగా వచ్చే అన్ని తరాలను సూచిస్తుంది; ‘ప్రతి తరంలో’ దాని పంపిణీ భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: עַל כֵּן
  choice: అందుచేత
  rationale: ముందటి ప్రకటననుంచి వచ్చే ఫలితాన్ని సూచించే అధికారిక అన్వయాన్ని నిలుపుతుంది.
- source_word: עַמִּים
  choice: జనజాతులు
  rationale: హెబ్రీయ బహువచనం అనేక ప్రజాసమూహాలను లేదా జాతులను సూచిస్తుంది; ‘జనజాతులు’ ఆ బహువచనాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: יְהוֹדֻךָ
  choice: నిన్ను స్తుతిస్తారు
  rationale: కీర్తనల ఆరాధనా సందర్భంలో ידה స్తుతి లేదా కృతజ్ఞతను సూచించగలదు; ఇక్కడ ‘స్తుతిస్తారు’ సహజమైన ప్రధాన భావం.
- source_word: לְעוֹלָם וָעֶד
  choice: సదాకాలం
  rationale: ఈ జత పదబంధం అంతంలేని కాలాన్ని బలంగా సూచిస్తుంది; ‘సదాకాలం’ ఆధునిక, గంభీరమైన తెలుగులో ఆ నిరంతర భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: ఈ రాజవివాహ కీర్తనలో ద్వితీయ పురుష సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: ‘నీ/నిన్ను’ అనే ప్రత్యక్ష సంబోధనను ఉంచి, అది ఎవరిని సూచిస్తుందో అనువాదంలో నిర్దిష్టం చేయలేదు.
  alternative: దావీదు వంశపు రాజుకు సంబోధన; లేదా అంతిమంగా మెస్సీయలో నెరవేరే సూచనాత్మక/మెస్సీయ సంబంధ సంబోధన.
  rationale: వచనం స్వయంగా ప్రత్యక్షంగా ‘నీవు’ అని సంబోధిస్తుంది. కీర్తన 45 యొక్క విస్తృత సందర్భం భిన్న ధార్మిక పఠనాలకు అవకాశం ఇచ్చినా, ఈ వచనాన్ని అనువదించేటప్పుడు వాటిలో ఒకదానిని నిర్ణయించాల్సిన అవసరం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలి. కారణార్థక క్రియాభావం, అనేక జనజాతుల బహువచనం, ప్రత్యక్ష సంబోధన, నిరంతర కాలభావం నిలుపబడ్డాయి. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
