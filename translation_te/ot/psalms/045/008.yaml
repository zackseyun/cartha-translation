  variant: modern standard Telugu
source:
  edition: WLC
  text: מֹר וַ/אֲהָל֣וֹת קְ֭צִיעוֹת כָּל בִּגְדֹתֶ֑י/ךָ מִֽן הֵ֥יכְלֵי שֵׁ֝֗ן מִנִּ֥י שִׂמְּחֽוּ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/008.yaml
  text: All your garments are fragrant with myrrh[a], aloes, and cassia; from ivory palaces[e][d][c][b], stringed instruments have made you glad.
translation:
  language: te
  text: నీ వస్త్రాలన్నీ బోళం[a], అగరు[b], కాసియా బెరడు[c] సువాసనలతో పరిమళిస్తున్నాయి; దంతంతో అలంకరించిన రాజభవనాల నుండి[d] తంతివాద్యాలు నిన్ను సంతోషపరిచాయి[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “బోళం” అనేది సువాసనగల చెట్టు జిగురు.
    reason: lexical_clarification
  - marker: b
    text: ఇది కలబంద కాదు; పరిమళం ఇచ్చే అగరు చెక్క.
    reason: lexical_clarification
  - marker: c
    text: కాసియా చెట్టు నుండి లభించే సువాసనగల బెరడు.
    reason: lexical_clarification
  - marker: d
    text: అక్షరార్థంగా “దంతపు రాజభవనాల నుండి”; “దంతపు మందిరాల నుండి” లేదా “దంతంతో అలంకరించిన మందిరాల నుండి” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: e
    text: “నిన్ను సంతోషపరిచాయి” అనే క్రియకు కర్త హీబ్రూ వాక్యంలో స్పష్టంగా లేదు. “సంగీతం,” “సంగీతకారులు,” లేదా సంప్రదాయంగా “తంతివాద్యాలు” అని అర్థం చేసుకోవచ్చు. ఈ భాగంలోని “నుండి” అనే భావానికి “వాటి నుండి,” “వాటి లోనుండి,” లేదా “వాటి కారణంగా” అనే భిన్నమైన సూక్ష్మార్థాలు కూడా ప్రతిపాదించబడ్డాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: מֹר
  choice: బోళం
  rationale: సుగంధభరితమైన myrrh జిగురుకు తెలుగు బైబిలు వాడుకలో స్థిరపడిన, సంక్షిప్తమైన పేరు.
- source_word: וַאֲהָלוֹת
  choice: అగరు
  rationale: ఇక్కడ ఆధునిక కలబంద మొక్క కాదు, పరిమళం ఇచ్చే అగరు చెక్క ఉద్దేశించబడింది.
- source_word: קְצִיעוֹת
  choice: కాసియా పట్ట
  rationale: ఇది సువాసనగల cassia చెట్టు బెరడు; సాధారణ దాల్చినచెక్కతో పూర్తిగా సమానం చేయకుండా పదార్థాన్ని స్పష్టపరుస్తుంది.
- source_word: כָּל בִּגְדֹתֶיךָ
  choice: నీ వస్త్రాలన్నీ ... సువాసనలతో పరిమళిస్తున్నాయి
  rationale: హీబ్రూ క్రియలేని వాక్యభాగంలో సుగంధ ద్రవ్యాలు, వస్త్రాలు పక్కపక్కన ఉన్నాయి. వస్త్రాలు ఆ సువాసనలను వెదజల్లుతున్నాయనే సహజ భావాన్ని తెలుగులో స్పష్టంగా తెలిపింది.
- source_word: מִן הֵיכְלֵי שֵׁן
  choice: దంతపు రాజభవనాల నుండి
  rationale: రాజవివాహ సందర్భంలో הֵיכָל కు ‘రాజభవనం’ తగినది; שֵׁן అక్షరార్థంగా ‘పంటి దంతం,’ ఇక్కడ కళాత్మకంగా వాడిన దంతాన్ని సూచిస్తుంది.
- source_word: מִנִּי שִׂמְּחוּךָ
  choice: తంతివాద్యాలు నిన్ను సంతోషపరిచాయి
  rationale: వాక్యనిర్మాణం క్లిష్టమైనది. מִנִּי ని తంతులు లేదా తంతివాద్యాలతో అనుసంధానించే సంప్రదాయ అవగాహనను ప్రధాన పాఠంలో ఉంచి, హీబ్రూలో కర్త స్పష్టంగా లేకపోవడాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: 45వ కీర్తనలోని రాజసంబంధమైన లేదా మెస్సీయసంబంధమైన నేపథ్యం
  choice: ఈ వచనాన్ని దాని ప్రత్యక్ష రాజవివాహ సందర్భంలో అనువదించడం
  alternative: తరువాతి గ్రంథసంబంధ వినియోగాన్ని బట్టి మెస్సీయను మరింత ప్రత్యక్షంగా సూచించే పదజాలం చేర్చడం
  rationale: ఈ వచనం రాజవైభవం, పరిమళ వస్త్రాలు, ఉత్సవానందాన్ని వర్ణిస్తుంది. హీబ్రూ పాఠం ఇక్కడ స్పష్టంగా చెప్పని క్రైస్తవ రూపకాలంకారాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే కవితాత్మక శైలి వాడబడింది. అరుదైన సుగంధ పదార్థాలకు సంక్షిప్త పాదసూచికలు ఇచ్చాం. హీబ్రూ వాక్యంలోని చివరి భాగానికి ఉన్న నిజమైన వ్యాకరణ అనిశ్చితిని తొలగించకుండా ప్రధాన పాఠాన్ని సహజంగా ఉంచాం.
