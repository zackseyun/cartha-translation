  source_fidelity: సుగంధ ద్రవ్యాల జాబితా, వస్త్రాల పరిమళ భావం, రాజసందర్భం సరిగానే ఉన్నాయి. చివరి క్రియ హీబ్రూలో బహువచనమైనా కర్తను చెప్పలేదు; ప్రధాన పాఠంలోని “తంతివాద్యాలు” సంప్రదాయ వ్యాఖ్యానమే కనుక పాదసూచికలో ఆ అనిశ్చితి స్పష్టంగా ఉండాలి. “దంతపు రాజభవనాలు” కంటే దంతంతో అలంకరించిన రాజభవనాలు అనే తెలుగు ప్రయోగం שֵׁן యొక్క ఉద్దేశిత ‘ivory’ భావాన్ని మరింత సహజంగా తెలియజేస్తుంది.
  naturalness: “కాసియా పట్ట” ఆధునిక ప్రామాణిక తెలుగులో అస్పష్టంగా, అసహజంగా ఉంది; “కాసియా బెరడు” స్పష్టమైన, సాధారణమైన పదబంధం. “దంతంతో అలంకరించిన రాజభవనాలు” కూడా “దంతపు రాజభవనాలు” కంటే సహజమైనది.
