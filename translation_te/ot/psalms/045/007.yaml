reference: Psalms 45:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָהַ֣בְתָּ צֶּדֶק֮ וַ/תִּשְׂנָ֫א רֶ֥שַׁע עַל כֵּ֤ן מְשָׁחֲ/ךָ֡ אֱלֹהִ֣ים אֱ֭לֹהֶי/ךָ שֶׁ֥מֶן שָׂשׂ֗וֹן מֵֽ/חֲבֵרֶֽי/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/007.yaml
  text: You have loved righteousness and hated wickedness[a]; therefore God, your God[b], has anointed you with the oil of gladness beyond your companions.
translation:
  language: te
  text: నీవు నీతిని ప్రేమించి దుష్టత్వాన్ని ద్వేషించావు; అందుచేత దేవుడు, నీ దేవుడు,[a] నీ సహచరులకంటే మిన్నగా ఆనందతైలంతో నిన్ను అభిషేకించాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అందుచేత, ఓ దేవా, నీ దేవుడు నీ సహచరులకంటే మిన్నగా ఆనందతైలంతో నిన్ను అభిషేకించాడు.” మొదటి “దేవుడు” అనే పదాన్ని క్రియకు కర్తగా కాక సంబోధనగా కూడా చదవవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ఈ వచనం హెబ్రీయులు 1:9లో ఉటంకించబడింది.
    reason: cross_reference
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: ప్రేమించావు
  rationale: Qal perfect ద్వితీయ పురుష ఏకవచనం; రాజును నేరుగా సంబోధించే కవితా వాక్యాన్ని సహజమైన ఆధునిక తెలుగులో గతకాల క్రియగా నిలుపుతుంది.
- source_word: צֶּדֶק
  choice: నీతి
  rationale: న్యాయమైనది, సరిగా ఉన్నది అనే నైతిక భావాన్ని సంక్షిప్తంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
- source_word: וַתִּשְׂנָא
  choice: ద్వేషించావు
  rationale: ముందటి ద్వితీయ పురుష క్రియతో సమాంతరంగా ఉండి, మూలంలోని స్పష్టమైన నైతిక వ్యతిరేకతను నిలుపుతుంది.
- source_word: רֶשַׁע
  choice: దుష్టత్వం
  rationale: అపరాధం లేదా చెడు ప్రవర్తన అనే నైతిక భావాన్ని ‘నీతి’కి విరుద్ధంగా స్పష్టంగా చూపుతుంది.
- source_word: עַל כֵּן
  choice: అందుచేత
  rationale: ముందు చెప్పిన స్వభావం ఆధారంగా వచ్చే ఫలితాన్ని తెలిపే సహజమైన నిర్ధారణాత్మక సంధానం.
- source_word: מְשָׁחֲךָ
  choice: నిన్ను అభిషేకించాడు
  rationale: Qal perfect తృతీయ పురుష ఏకవచనం, ద్వితీయ పురుష ప్రత్యయం; రాజప్రతిష్ఠ మరియు ప్రత్యేక నియామక భావాన్ని ‘అభిషేకించాడు’ నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ప్రధాన పాఠ్యంలో దీనిని ‘అభిషేకించాడు’ అనే క్రియకు కర్తగా తీసుకున్నారు; సంబోధనగా చదివే నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచారు.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: ద్వితీయ పురుష ఏకవచన స్వామ్యార్థాన్ని నేరుగా వ్యక్తం చేస్తూ, ముందటి ‘దేవుడు’కు వివరణాత్మక సమానాధికార పదబంధంగా పనిచేస్తుంది.
- source_word: שֶׁמֶן שָׂשׂוֹן
  choice: ఆనందతైలం
  rationale: ఆనందం లేదా ఉత్సవంతో సంబంధమున్న అభిషేక తైలాన్ని కవితాత్మకంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מֵחֲבֵרֶיךָ
  choice: నీ సహచరులకంటే మిన్నగా
  rationale: מִן యొక్క తులనార్థాన్ని స్పష్టంగా తెలియజేస్తూ, సంబోధితుడు తన సహచరులను మించిన స్థానం పొందినట్లు చూపుతుంది.
theological_decisions:
- issue: אֱלֹהִים పదం కర్తనా, సంబోధనా అనే వాక్యనిర్మాణ సందిగ్ధత
  choice: మొదటి אֱלֹהִיםను కర్తగా తీసుకుని ‘దేవుడు, నీ దేవుడు, ... నిన్ను అభిషేకించాడు’ అని అనువదించడం
  alternative: మొదటి אֱלֹהִיםను సంబోధనగా తీసుకుని ‘ఓ దేవా, నీ దేవుడు ... నిన్ను అభిషేకించాడు’ అని చదవడం
  rationale: ఈ వచనంలోని క్రియావాక్యానికి కర్తగా చదవడం సహజమైనప్పటికీ, హీబ్రూ వాక్యనిర్మాణం సంబోధన పఠనాన్నీ అనుమతిస్తుంది. ముఖ్యమైన ఈ భాషాత్మక, ధార్మిక ఉద్రిక్తతను పరిష్కరించినట్టు చేయకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో స్పష్టంగా నిలిపారు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, కీర్తనా కవిత్వానికి తగిన గంభీరతను నిలుపుతుంది. ‘నీతి—దుష్టత్వం,’ ‘ఆనందతైలం,’ ‘అభిషేకించాడు’ వంటి పదాలతో మూలంలోని నైతిక వ్యతిరేకత, రాజసంబంధ దృశ్యం కాపాడబడ్డాయి.
