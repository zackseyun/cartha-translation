source:
  edition: WLC
  text: כָּל כְּבוּדָּ֣ה בַת מֶ֣לֶךְ פְּנִ֑ימָה מִֽ/מִּשְׁבְּצ֖וֹת זָהָ֣ב לְבוּשָֽׁ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/013.yaml
  text: All glorious is the king’s daughter within[b][a]; her clothing is of woven gold.
translation:
  language: te
  text: 'రాజు కుమార్తె లోపల సర్వమహిమగలదై ఉంది[a];

    ఆమె వస్త్రం బంగారు అల్లికలతో ఉంది[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజు కుమార్తె అంతరంగంలో సర్వమహిమగలది.” “లోపల” అనేది ఆమె అంతరంగ సౌందర్యాన్నిగానీ, రాజభవనం లేదా అంతఃపురంలో ఆమె ఉండడాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆమె వస్త్రం బంగారంతో పొదగబడింది,” లేదా “బంగారు దారంతో అలంకారంగా కుట్టబడింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל כְּבוּדָּה
  choice: సర్వవైభవంతో ఉంది
  rationale: כָּל ఇక్కడ బలవాచకంగా పనిచేస్తూ, כְּבוּדָּה సూచించే సంపూర్ణ శోభను తెలియజేస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా ‘సర్వవైభవంతో ఉంది’ అని అనువదించబడింది.
- source_word: בַת מֶלֶךְ
  choice: రాజు కుమార్తె
  rationale: హీబ్రూ రాజాస్థాన సంబంధమైన పదబంధాన్ని నేరుగా నిలుపుతుంది; ‘రాకుమారి’ కూడా సాధ్యమే గాని మూలంలోని బంధసూచనను అంత స్పష్టంగా చూపదు.
- source_word: פְּנִימָה
  choice: లోపల
  rationale: ఈ క్రియావిశేషణం ‘లోపల/అంతర్భాగంలో’ అని అర్థమిస్తుంది. రాజభవనం లేదా గదిలో ఉండడాన్నీ, అంతరంగ శోభనూ సూచించే అవకాశాన్ని ‘లోపల’ కొంతవరకు తెరిచి ఉంచుతుంది.
- source_word: מִמִּשְׁבְּצוֹת זָהָב
  choice: బంగారు అల్లికలతో
  rationale: מִשְׁבְּצוֹת చెక్కిన, పొదిగిన, గళ్లుగా చేసిన లేదా అల్లిన అలంకార పనిని సూచించవచ్చు. వస్త్ర సందర్భంలో ‘బంగారు అల్లికలు’ సహజమైన ఎంపిక; ఇతర సాధ్యార్థాలు పాదసూచికలో ఉంచబడ్డాయి.
- source_word: לְבוּשָׁהּ
  choice: ఆమె వస్త్రం
  rationale: ఆమె ధరించిన దుస్తును సూచిస్తుంది. తెలుగు కవితా సందర్భంలో ‘వస్త్రం’ గౌరవప్రదంగా, సహజంగా ఉంటుంది; ఒక నిర్దిష్ట వస్త్ర రకాన్ని అనవసరంగా నిర్ణయించదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గౌరవప్రదమైన కవితా ధోరణి పాటించబడింది. ‘లోపల’ అనే సంక్షిప్త పదం మూలంలోని స్థలసంబంధ లేదా అంతరంగసంబంధ సందిగ్ధతను నిలుపుతుంది; పాదసూచిక దాని పరిధిని వివరిస్తుంది.
