revisions:
- from: ఎంబ్రాయిడరీ చేసిన వస్త్రాలు ధరించిన ఆమెను రాజు దగ్గరికి నడిపిస్తారు[a]; ఆమె వెనుక వచ్చే కన్యలను[b], ఆమె సహచరులను, నీ దగ్గరికి తీసుకొస్తారు[c].
  to: అలంకార కుట్టుపనిగల వస్త్రాలలో ఆమె రాజు వద్దకు తీసుకురాబడుతోంది[a]; ఆమె వెనుక ఆమె సహచరులైన కన్యలు[b] నీ దగ్గరికి తీసుకురాబడుతున్నారు[c].
  rationale: The revision makes the virgins explicitly appositional to the bride’s companions, retains the Masoretic feminine-singular shift in “నీ దగ్గరికి,” and uses explicit Telugu passives to reflect the two Hebrew passive verbal forms. It also replaces the English borrowing with a clear modern Telugu expression for embroidered textile work.
