  yaml_path: translation/ot/psalms/045/014.yaml
  text: In embroidered garments she is led to the king[a]; virgins behind her, her companions[c][b], are brought to you.
translation:
  language: te
  text: అలంకార కుట్టుపనిగల వస్త్రాలలో ఆమె రాజు వద్దకు తీసుకురాబడుతోంది[a]; ఆమె వెనుక ఆమె సహచరులైన కన్యలు[b] నీ దగ్గరికి తీసుకురాబడుతున్నారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అలంకార కుట్టుపనిలో ఆమెను రాజు వద్దకు తీసుకురాబడుతోంది.”
    reason: lexical_alternative
  - marker: b
    text: “కన్యలు” అనే పదాన్ని “పెళ్లికాని యువతులు” అని కూడా అనువదించవచ్చు; అయితే హీబ్రూ పదం కన్యత్వాన్ని మరింత నిర్దిష్టంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: “నీ దగ్గరికి” అనే మాట హీబ్రూలోని స్త్రీలింగ ఏకవచన సంబోధనను అనుసరిస్తుంది; ఇక్కడ మాట నేరుగా వధువు వైపు మళ్లినట్లు కనిపిస్తుంది. కొన్ని అనువాదాలు దీన్ని రాజును ఉద్దేశించినట్లుగా సాఫీ చేస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: לִרְקָמוֹת
  choice: ఎంబ్రాయిడరీ చేసిన వస్త్రాలు ధరించిన
  rationale: רְקָמוֹת అలంకార కుట్టుపనిగల లేదా రంగురంగుల నేయబడిన వస్త్రపనిని సూచిస్తుంది. వివాహ ఊరేగింపు సందర్భంలో తెలుగులో సహజంగా ఉండేందుకు ‘వస్త్రాలు’ను స్పష్టీకరించి, לִ ఉపసర్గను వేషధారణను తెలిపే భావంగా అనువదించాం.
- source_word: תּוּבַל
  choice: నడిపిస్తారు
  rationale: יבל యొక్క హోఫల్ రూపం ‘తీసుకురాబడుతుంది/నడిపించబడుతుంది’ అనే నిష్క్రియ భావాన్ని ఇస్తుంది. తెలుగు వాక్యనిర్మాణంలో అనిర్దిష్ట కర్తతో ‘నడిపిస్తారు’ సహజంగా ఉండి, వివాహ ఊరేగింపు భావాన్ని నిలుపుతుంది.
- source_word: לַמֶּלֶךְ
  choice: రాజు దగ్గరికి
  rationale: ל దిశను సూచిస్తుంది. ఆధునిక తెలుగులో ‘రాజు దగ్గరికి’ గమ్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּתוּלוֹת
  choice: కన్యలను
  rationale: ఈ పదం ప్రత్యేకంగా వివాహం కాని కన్యలను సూచిస్తుంది; వివాహ సందర్భంలో వధువు వెంట వచ్చే యువతులు అనే భావం ఉన్నప్పటికీ, మూలపదంలోని నిర్దిష్టతను ‘కన్యలు’ నిలుపుతుంది.
- source_word: אַחֲרֶיהָ
  choice: ఆమె వెనుక వచ్చే
  rationale: ఊరేగింపు సందర్భంలో ‘ఆమె వెనుక’ అనే స్థల/క్రమ భావాన్ని సహజంగా వ్యక్తపరుస్తుంది; ‘వచ్చే’ను జోడించడం procession యొక్క కదలికను స్పష్టం చేస్తుంది.
- source_word: רֵעוֹתֶיהָ
  choice: ఆమె సహచరులను
  rationale: రֵעוֹתֶיהָ స్నేహితులు లేదా సహచరులను సూచిస్తుంది. వారి అధికారిక పాత్రను అతిగా నిర్దేశించకుండా సంబంధ భావాన్ని ‘సహచరులు’ నిలుపుతుంది.
- source_word: מוּבָאוֹת
  choice: తీసుకొస్తారు
  rationale: בוא యొక్క హోఫల్ స్త్రీలింగ బహువచన రూపం ‘తీసుకురాబడుతున్నారు’ అనే భావం ఇస్తుంది. తెలుగులో సహజమైన అనిర్దిష్ట కర్త నిర్మాణాన్ని వాడి, ముందున్న ‘నడిపిస్తారు’ అనే పదం పునరావృతం కాకుండా చేశాం.
- source_word: לָךְ
  choice: నీ దగ్గరికి
  rationale: ఇది రెండవ పురుష స్త్రీలింగ ఏకవచనం. మసొరేటిక్ పాఠంలోని వధువును నేరుగా సంబోధించే ఆకస్మిక మార్పును సరిచేయకుండా యథాతథంగా నిలిపాం.
theological_decisions:
- issue: చివరి לָךְ లో సంబోధిత వ్యక్తి మార్పు
  choice: స్త్రీలింగ ఏకవచన రెండవ పురుషాన్ని ‘నీ దగ్గరికి’గా నిలుపుతూ, వధువుకు ప్రత్యక్ష సంబోధనగా ఉంచడం.
  alternative: దానిని రాజును సూచించేదిగా ‘అతని దగ్గరికి/రాజు దగ్గరికి’ అని మార్చడం, లేదా ‘ఆమెతో పాటు’ అని సాఫీ చేయడం.
  rationale: మసొరేటిక్ పాఠంలో స్పష్టంగా 2fs ప్రత్యయం ఉంది. ఇది మూడవ పురుషంలో వధువు గురించిన వర్ణన నుంచి ఆమెకు ప్రత్యక్ష సంబోధనకు మారుతుంది. మూలపాఠంలోని కవితాత్మక ఉద్రిక్తతను పరిష్కరించకుండా కాపాడటం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కవితాత్మక శైలితో రూపొందించాం. ‘ఎంబ్రాయిడరీ’ సాధారణ ఆధునిక వాడుకలో స్పష్టంగా ఉన్నందున ఉపయోగించాం; మరింత సాంప్రదాయిక ప్రత్యామ్నాయం ‘అల్లిక పనిగల వస్త్రాలు’. నిష్క్రియ క్రియలను తెలుగులో సహజమైన అనిర్దిష్ట కర్త బహువచన రూపాలతో వ్యక్తపరిచాం.
