  text: And the daughter of Tyre will come with a gift[b][a]; the rich among the people will seek your favor.
translation:
  language: te
  text: తూరు కుమార్తె కానుకతో[a] వస్తుంది[c]; ప్రజలలోని ధనవంతులు నీ అనుగ్రహాన్ని[b] వేడుకుంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కానుకతో’ అనే మాటను ‘అర్పణతో,’ ‘కప్పంతో,’ లేదా ‘కప్పం తీసుకువచ్చి’ అని కూడా అనువదించవచ్చు. హెబ్రీయ మిన్‌హా సందర్భానుసారం కానుకను, కప్పాన్ని, లేదా అర్పణను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నీ ముఖాన్ని వేడుకుంటారు.’ ఇది నీ దయను లేదా అనుకూలతను కోరడాన్ని సూచించే హెబ్రీయ నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: ‘వస్తుంది’ అనే క్రియ హెబ్రీయ మూలపాఠంలో స్పష్టంగా లేదు; వాక్యంలోని భావాన్ని తెలుగులో పూర్తిచేయడానికి సందర్భానుసారంగా చేర్చబడింది.
    reason: supplied_word
lexical_decisions:
- source_word: וּ/בַת צֹר
  choice: తూరు నగరపు కుమార్తె
  rationale: స్థల నామంతో వచ్చిన ‘కుమార్తె’ అనే హెబ్రీయ రూపకం తూరు నగరాన్ని లేదా దాని ప్రజలను స్త్రీగా వ్యక్తీకరిస్తుంది. రూపకాన్ని నిలుపుతూ తెలుగులో సంబంధాన్ని స్పష్టంచేయడానికి ‘నగరపు’ చేర్చబడింది.
- source_word: בְּמִנְחָה
  choice: కానుకతో
  rationale: מִנְחָה సందర్భానుసారం కానుక, కప్పం, లేదా అర్పణ అని అర్థమవుతుంది. రాజసభ సందర్భంలో ‘కానుక’ సహజంగా ఉండి, ఆరాధన సంబంధమైన అర్థాన్ని అనవసరంగా రుద్దదు.
- source_word: פָּנַיִךְ יְחַלּוּ
  choice: నీ అనుగ్రహాన్ని వేడుకుంటారు
  rationale: అక్షరార్థంగా ‘నీ ముఖాన్ని వేడుకుంటారు’ అనే ఈ హెబ్రీయ నుడికారం ఒకరి దయ లేదా అనుకూలతను అభ్యర్థించడాన్ని సూచిస్తుంది. ‘అనుగ్రహాన్ని వేడుకుంటారు’ అర్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; రెండవ పురుష ఏకవచన స్త్రీ సంబోధన తెలుగులో సందర్భానుగుణంగా ‘నీ’లో నిలిచింది.
- source_word: עֲשִׁירֵי עָם
  choice: ప్రజల్లోని ధనవంతులు
  rationale: ఈ నిర్మాణం ఒక ప్రజాసమూహంలోని సంపన్నులను లేదా ప్రముఖ ధనికులను సూచిస్తుంది. ‘ప్రజల్లోని ధనవంతులు’ నిర్దిష్ట జాతిని మూలపాఠం కంటే ఎక్కువగా నిర్ధారించకుండా సహజంగా వ్యక్తపరుస్తుంది.
