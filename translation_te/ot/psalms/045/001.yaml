  variant: modern standard Telugu
source:
  edition: WLC
  text: רָ֘חַ֤שׁ לִבִּ֨/י דָּ֘בָ֤ר ט֗וֹב אֹמֵ֣ר אָ֭נִי מַעֲשַׂ֣/י לְ/מֶ֑לֶךְ לְ֝שׁוֹנִ֗/י עֵ֤ט סוֹפֵ֬ר מָהִֽיר׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/001.yaml
  text: My heart overflows with a good word[a]; I say[c][b], “My work is for the king.” My tongue is the pen of a skillful scribe.
translation:
  language: te
  text: నా హృదయం ఒక మంచి మాటతో ఉప్పొంగుతోంది[a]; “నా కృతి రాజు కోసం[b]” అని నేను చెబుతున్నాను. నా నాలుక నైపుణ్యమున్న లేఖకుని కలం[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మనోహరమైన ఇతివృత్తంతో,” లేదా “ఉదాత్తమైన విషయంతో.” హీబ్రూ పదబంధం పలికే మాటలను గానీ, వాటి విషయాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “రాజును గురించి,” లేదా “రాజుకు.” ఇక్కడి సంబంధబోధక రూపం అంకితాన్ని, విషయాన్ని, లేదా నేరుగా సంబోధించడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా “సిద్ధంగా ఉన్న లేఖకుని కలం,” లేదా “వేగంగా రాసే లేఖకుని కలం.” హీబ్రూ విశేషణం నేర్పుతో పాటు వేగాన్ని లేదా సంసిద్ధతను కూడా నొక్కి చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָחַשׁ
  choice: ఉప్పొంగుతోంది
  rationale: హృదయంలో కదలి, బుడగలెత్తినట్లు మాటగా వెలువడే కవితాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לִבִּי
  choice: నా హృదయం
  rationale: ఆలోచనలకూ భావోద్వేగాలకూ కేంద్రంగా ఉన్న అంతరంగాన్ని సూచించే మూలభాష రూపకాన్ని నిలుపుతుంది.
- source_word: דָּבָר טוֹב
  choice: ఒక మంచి మాట
  rationale: דָּבָר అనే పదంలోని ‘మాట/విషయం’ అనే విస్తృతిని పూర్తిగా సంకుచితం చేయకుండా, హీబ్రూ పదరూపానికి దగ్గరగా ఉండే సహజమైన అనువాదం.
- source_word: אֹמֵר אֲנִי
  choice: అని నేను చెబుతున్నాను
  rationale: కవితను పఠిస్తున్నాడా లేక ప్రకటిస్తున్నాడా అని అదనంగా నిర్ణయించకుండా సాధారణ వాక్కు భావాన్ని నిలుపుతుంది.
- source_word: מַעֲשַׂי
  choice: నా కృతి
  rationale: ఈ సాహిత్య సందర్భంలో కవి రూపొందించిన రచనను సూచిస్తుంది; ‘పనులు’ లేదా ‘కార్యాలు’ కంటే ‘కృతి’ కవితా సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: לְמֶלֶךְ
  choice: రాజు కోసం
  rationale: לְ అనే సంబంధబోధక రూపం ఇక్కడ అంకితం లేదా ఉద్దేశాన్ని సూచించగలదు; ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఉంచాం.
- source_word: לְשׁוֹנִי
  choice: నా నాలుక
  rationale: వాక్కును ‘నాలుక’గా చిత్రించే మూలంలోని శరీరాంగ రూపకాన్ని నిలుపుతుంది.
- source_word: עֵט
  choice: కలం
  rationale: ప్రాచీన రచనా సాధనాన్ని ఆధునిక పాఠకుడికి సహజంగా అర్థమయ్యే పదంతో సూచిస్తుంది.
- source_word: סוֹפֵר
  choice: లేఖకుడు
  rationale: శిక్షణ పొందిన వృత్తిపరమైన రచయిత అనే ప్రాచీన సాహిత్య సందర్భాన్ని నిలుపుతుంది.
- source_word: מָהִיר
  choice: నైపుణ్యంగల
  rationale: ఈ విశేషణం వేగం, సంసిద్ధత, అభ్యాసంతో వచ్చిన నేర్పు అనే భావాలను కలిగి ఉండగలదు; సందర్భంలో ప్రవాహంగా రాసే సామర్థ్యాన్ని ‘నైపుణ్యంగల’ సహజంగా తెలియజేస్తుంది.
