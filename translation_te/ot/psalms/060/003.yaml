base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/003.yaml
  text: You have shown your people hard things[a]; you have made us drink wine of staggering.
translation:
  language: te
  text: నీ ప్రజలకు కఠినమైన అనుభవాలను కలిగించావు; తూలిపోయేలా చేసే ద్రాక్షారసాన్ని[a] మాకు తాగించావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తూలేలా చేసే ద్రాక్షారసం”; ఈ పదానికి మత్తుతో తూలడం, అస్థిరపడడం, దిక్కుతోచకపోవడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְאִיתָה
  choice: అనుభవాలను కలిగించావు
  rationale: హిఫీల్ రూపానికి అక్షరార్థంగా ‘చూపించావు’ అని అనువదించవచ్చు; అయితే ఈ సందర్భంలో దేవుడు తన ప్రజలు కఠిన పరిస్థితులను అనుభవించేలా చేశాడనే భావం ఉంది. ఆధునిక తెలుగులో ఆ సందర్భార్థాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עַמְּךָ
  choice: నీ ప్రజలకు
  rationale: నిబంధన సంబంధ సందర్భంలో עַם దేవునికి చెందిన ప్రజలను సూచిస్తుంది; ‘నీ ప్రజలు’ సహజమైన, సందర్భోచితమైన రూపం.
- source_word: קָשָׁה
  choice: కఠినమైన అనుభవాలను
  rationale: ‘కఠినమైనది/కఠినమైన సంగతులు’ అనే విశేషణాత్మక భావం ఇక్కడ తీవ్రమైన అనుభవాలను సూచిస్తుంది. ‘అనుభవాలు’ సందర్భార్థాన్ని స్పష్టం చేస్తుంది, కానీ వాటి స్వభావాన్ని మరీ నిర్దిష్టం చేయదు.
- source_word: הִשְׁקִיתָנוּ
  choice: మాకు తాగించావు
  rationale: שקה హిఫీల్ రూపంలోని ‘తాగించు/త్రాగడానికి ఇవ్వు’ అనే కారణార్థాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: יַיִן
  choice: ద్రాక్షారసం
  rationale: יַיִן యొక్క సాధారణ అర్థం మద్యం కలిగిన ద్రాక్షారసం; ఇక్కడ అది రూపకంగా వాడబడినా, మూల చిత్రాన్ని అనువాదంలో నిలుపుతున్నాం.
- source_word: תַּרְעֵלָה
  choice: తూలిపోయేలా చేసే
  rationale: ఈ నామవాచకం తూలడం, మత్తుతో అస్థిరపడడం, దిక్కుతోచకపోవడం వంటి భావాలను కలిగి ఉంది. సాపేక్ష వాక్యరూపం ఆధునిక తెలుగులో సహజంగా ఉండి, ద్రాక్షారస రూపకంలోని అనుభవ ఫలితాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ‘ద్రాక్షారసం’ అనే రూపకం యొక్క భావం
  choice: దేవుడు తన ప్రజలకు తీవ్రమైన అస్థిరత లేదా తీర్పు అనుభవాన్ని కలిగించాడనే రూపకాన్ని యథాతథంగా ఉంచడం
  alternative: అక్షరార్థంగా దేవుడు వారికి ద్రాక్షారసం తాగించాడని తీసుకోవడం; లేదా రూపకాన్ని పూర్తిగా ‘బాధ’ అని మార్చడం
  rationale: మొదటి పాదంలోని కఠిన అనుభవాలతో ఉన్న సమాంతరత, తూలింపజేసే ద్రాక్షారసం అనే బైబిలీయ చిత్రం—ఇవి రూపకార్థాన్ని బలపరుస్తాయి. అనువాదం దానిని వివరణాత్మక పదంతో భర్తీ చేయకుండా చిత్రాన్నే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీర శైలి. హీబ్రూ రూపకాన్ని నిలుపుతూ, ‘చూపించావు’ అనే అసహజ సందర్భ ప్రయోగానికి బదులుగా అనుభవార్థాన్ని సహజంగా వ్యక్తపరిచాం.
