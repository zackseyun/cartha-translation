id: PSA.60.6
reference: Psalms 60:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֱלֹהִ֤ים דִּבֶּ֥ר בְּ/קָדְשׁ֗/וֹ אֶ֫עְלֹ֥זָה אֲחַלְּקָ֥ה שְׁכֶ֑ם וְ/עֵ֖מֶק סֻכּ֣וֹת אֲמַדֵּֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/006.yaml
  text: 'God has spoken in his holiness: “I will exult[a]; I will divide up Shechem[b], and measure out the Valley of Succoth.”'
translation:
  language: te
  text: 'దేవుడు తన పరిశుద్ధతలో[a] ఇలా పలికాడు: “నేను ఉల్లసిస్తాను[b]; షెకెమును పంచుతాను, సుక్కోతు లోయను కొలుస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన పరిశుద్ధ స్థలంలో,” లేదా “తన పరిశుద్ధతను బట్టి.” ఈ హెబ్రీ పదబంధం దేవుని పరిశుద్ధ స్వభావాన్ని గానీ, ఆయన పరిశుద్ధ సన్నిధి ఉన్న పరిధిని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “నేను ఉల్లసిస్తాను” అనేది దేవుని ప్రకటనలో భాగం కాకుండా, దేవుని మాటకు కీర్తనకర్త ఇచ్చిన ప్రతిస్పందన అని కూడా కొందరు అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఏకవచన క్రియతో వచ్చినందున ఇశ్రాయేలు దేవుడినే సూచిస్తుంది; అందువల్ల తెలుగులో ఏకవచనం సహజం.
- source_word: דִּבֶּר
  choice: ఇలా పలికాడు
  rationale: పూర్తయిన దైవోక్తిని తెలియజేస్తుంది. ప్రత్యక్ష వాక్యాన్ని సహజంగా పరిచయం చేయడానికి ‘ఇలా’ చేర్చబడింది.
- source_word: בְּקָדְשׁוֹ
  choice: తన పరిశుద్ధతలో
  rationale: హెబ్రీ పదబంధంలోని సంక్షిప్తతను, దేవుని పరిశుద్ధ స్వభావం లేదా పరిశుద్ధ సన్నిధి అనే భావపరిధిని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: אֶעְלֹזָה
  choice: నేను ఉల్లసిస్తాను
  rationale: విజయోత్సాహంతో కూడిన ఆనందాన్ని తెలిపే క్రియ; ఆధునిక గౌరవప్రదమైన తెలుగులో ‘ఉల్లసిస్తాను’ ఆ భావాన్ని నిలుపుతుంది.
- source_word: אֲחַלְּקָה
  choice: పంచుతాను
  rationale: భూభాగాన్ని విభజించి కేటాయించే సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שְׁכֶם
  choice: షెకెము
  rationale: స్థలనామాన్ని తెలుగు లిపిలో మూల ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించింది.
- source_word: וְעֵמֶק סֻכּוֹת
  choice: సుక్కోతు లోయ
  rationale: సుక్కోతుతో సంబంధమున్న భౌగోళిక లోయను సూచించే నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אֲמַדֵּד
  choice: కొలిచి పంచుతాను
  rationale: అక్షరార్థమైన కొలత చిత్రాన్ని నిలుపుతూ, భూభాగాన్ని కొలిచి కేటాయించే సందర్భార్థాన్ని తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: మాట్లాడేవారి మార్పు మరియు ప్రత్యక్ష వాక్యపు పరిధి
  choice: ‘నేను ఉల్లసిస్తాను’ మొదలైన ప్రథమ పురుష క్రియలను దేవుని ప్రత్యక్ష ప్రకటనలో భాగంగా అనువదించడం
  alternative: ‘నేను ఉల్లసిస్తాను’ అనేది దేవుని మాటకు కీర్తనకర్త ఇచ్చిన ప్రతిస్పందనగా గ్రహించడం
  rationale: షెకెమును పంచడం, సుక్కోతు లోయను కొలవడం అనే భూస్వామ్య భాష దేవుని సార్వభౌమ అధికారాన్ని సూచిస్తూ దైవోక్తి కొనసాగింపుగా సహజంగా సరిపోతుంది. అయితే హెబ్రీ వాక్యనిర్మాణంలో కీర్తనకర్త మాటగా తీసుకునే అవకాశం ఉన్నందున దానిని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. స్థలనామాలు తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడ్డాయి; మూలంలోని వక్త మార్పు సందిగ్ధత పాదసూచికలో భద్రపరచబడింది.
