source:
  edition: WLC
  text: אֱ֭לֹהִים זְנַחְתָּ֣/נוּ פְרַצְתָּ֑/נוּ אָ֝נַ֗פְתָּ תְּשׁ֣וֹבֵ֥ב לָֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/001.yaml
  text: God[a], you have rejected us; you have broken us through; you have been angry[b]. Restore us.
translation:
  language: te
  text: దేవా, నీవు మమ్మల్ని తిరస్కరించావు; మమ్మల్ని ఛేదించావు; మాపై కోపించావు. మమ్మల్ని పునరుద్ధరించు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మా వైపు మళ్లీ తిరుగు.” హీబ్రూ పదబంధాన్ని ప్రజలను పునరుద్ధరించమనే విన్నపంగానూ, దేవుడు మళ్లీ మా వైపు తిరిగి రావాలనే విన్నపంగానూ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ఇది ప్రత్యక్ష సంబోధన. ఆధునిక ప్రామాణిక తెలుగులో ‘దేవా’ సహజంగా సంబోధన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: זְנַחְתָּנוּ
  choice: నీవు మమ్మల్ని తిరస్కరించావు
  rationale: זנח లోని విడిచిపెట్టడం లేదా తోసివేయడం అనే భావాన్ని ‘తిరస్కరించావు’ స్పష్టంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: פְרַצְתָּנוּ
  choice: మమ్మల్ని ఛేదించావు
  rationale: פרץ లోని అడ్డును పగులగొట్టి చీలిక చేయడం అనే బలమైన చిత్రాన్ని ‘ఛేదించావు’ నిలుపుతుంది. ‘చెదరగొట్టావు’ కంటే ఇది మూలంలోని breach imageryకి దగ్గరగా ఉంటుంది.
- source_word: אָ֝נַפְתָּ
  choice: మాపై కోపించావు
  rationale: ఈ క్రియ దేవుని కోపాన్ని సూచిస్తుంది. తెలుగులో సంబంధాన్ని సహజంగా తెలియజేయడానికి ‘మాపై’ చేర్చబడింది; భావాన్ని ‘ఉగ్రంగా రగిలావు’ వంటి అతిశయంతో పెంచలేదు.
- source_word: תְּשׁוֹבֵב לָנוּ
  choice: మమ్మల్ని పునరుద్ధరించు
  rationale: తీర్పు వల్ల ఏర్పడిన విరుగుడును దేవుడు వెనక్కి తిప్పి ప్రజలను మళ్లీ నిలబెట్టాలనే విన్నపంగా ఇది సహజంగా చదవబడుతుంది. అయితే దేవుడు ప్రజలవైపు తిరిగి రావాలనే భావం కూడా హీబ్రూలో సాధ్యమైనందున దాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: תְּשׁוֹבֵב לָנוּ అనే చివరి విన్నపం యొక్క భావం
  choice: తీర్పు అనంతరం దేవుడు తన ప్రజలను పునరుద్ధరించాలనే విన్నపం
  alternative: దేవుడు మళ్లీ తన ప్రజలవైపు తిరగాలనే విన్నపం
  rationale: హీబ్రూ రూపం ప్రజల స్థితిని పునరుద్ధరించడాన్నీ, దేవుడు వారివైపు తిరిగి రావడాన్నీ సూచించగలదు. ప్రధాన పాఠంలో సందర్భానుకూలమైన ‘పునరుద్ధరించు’ను ఎంచుకుని, నిజమైన సంబంధాత్మక ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గౌరవప్రదమైన, నేరుగా దేవుణ్ణి సంబోధించే శైలి. వరుస క్రియల తీవ్రతను అర్థవంతమైన చిన్న వాక్యఖండాలతో నిలిపి, మూలంలోని తీర్పు–పునరుద్ధరణ ఉద్వేగాన్ని కాపాడాం.
