lexical_decisions:
- source_word: לְמַעַן
  choice: …బడేలా
  rationale: ఉద్దేశాన్ని లేదా ఆశించిన ఫలితాన్ని తెలిపే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יֵחָלְצוּן
  choice: విడిపించబడేలా
  rationale: חלץ నిఫాల్ రూపం ప్రమాదం లేదా చిక్కు నుండి బయటకు తీయబడటం, రక్షించబడటం అనే భావాన్ని ఇస్తుంది. ‘విడిపించబడటం’ ఆ భావాన్ని అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: יְדִידֶיךָ
  choice: నీ ప్రియులు
  rationale: రెండవ పురుష ఏకవచన స్వామ్యప్రత్యయంతో ఉన్న బహువచనాన్ని, ప్రేమాభిమాన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הוֹשִׁיעָה
  choice: రక్షించు
  rationale: ישע హిఫీల్ ఆజ్ఞార్థక రూపంలోని నేరమైన రక్షణ విజ్ఞప్తిని సహజమైన ప్రార్థనా భాషలో అందిస్తుంది.
- source_word: יְמִינְךָ
  choice: నీ కుడిచేతితో
  rationale: దేవుని శక్తివంతమైన రక్షణ కార్యాన్ని సూచించే మానవరూపక చిత్రాన్ని, సాధనార్థక భావంతో యథాతథంగా నిలుపుతుంది.
- source_word: וַעֲנֵנוּ
  choice: మాకు జవాబివ్వు
  rationale: WLCలోని ועננו రూపం మొదటి పురుష బహువచన కర్మప్రత్యయాన్ని కలిగి ఉండి ‘మాకు జవాబివ్వు’ అని అర్థమిస్తుంది.
theological_decisions:
- issue: దేవుని కుడిచేయి అనే చిత్రం
  choice: ‘నీ కుడిచేతితో’ అనే మానవరూపక వ్యక్తీకరణను నిలుపుట
  alternative: ‘నీ శక్తితో’ అని భావానువాదం చేయుట
  rationale: మూలంలోని కవితాత్మకమైన, దైవ రక్షణశక్తిని సూచించే చిత్రాన్ని భావసారంగా మార్చకుండా కాపాడుతుంది.
- issue: చివరి క్రియలోని కర్మప్రత్యయం
  choice: ‘మాకు జవాబివ్వు’ అనే బహువచనం
  alternative: ‘నాకు జవాబివ్వు’ అనే ఏకవచనం
  rationale: ఇచ్చిన WLC పాఠం ועננו బహువచనాన్ని సమర్థిస్తుంది. అయితే సమాంతరమైన కీర్తన 108:7లో ఏకవచన పాఠం ఉండటంతో దానిని పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవభరితమైన నేర సంబోధన. హీబ్రూ వాక్యంలోని ఉద్దేశ సంబంధం, బహువచన ‘ప్రియులు,’ కుడిచేయి రూపకం, చివరి బహువచన విజ్ఞప్తి నిలుపబడ్డాయి.
