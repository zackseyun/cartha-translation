  text: So that your beloved ones may be delivered[b][a], save with your right hand and answer me.
translation:
  language: te
  text: నీకు ప్రియమైనవారు విడిపించబడేలా[a], నీ కుడిచేతితో రక్షించు; మాకు జవాబివ్వు.[b]
  philosophy: optimal-equivalence
  footnotes:
