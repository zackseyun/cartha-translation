language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לַ֭/מְנַצֵּחַ עַל שׁוּשַׁ֣ן עֵד֑וּת מִכְתָּ֖ם לְ/דָוִ֣ד לְ/לַמֵּֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/000.yaml
  text: 'For the choirmaster: according to “Lily of Testimony.”[a] A miktam[b] of David[c], for teaching when he fought against Aram-naharaim and Aram-zobah, and Joab returned and struck down twelve thousand of Edom in the Valley of Salt.'
translation:
  language: te
  text: 'సంగీత నాయకునికి: “సాక్ష్యపు లిల్లీ” ప్రకారం.[a] దావీదుకు సంబంధించిన మిక్తాం,[b][c] బోధన కొరకు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సాక్ష్యపు లిల్లీ అనే రాగం ప్రకారం.” హెబ్రీలో ఇది బహుశా సంగీత లేదా ఆరాధనా శీర్షిక; దాని ఖచ్చితమైన అర్థం తెలియదు.
    reason: lexical_alternative
  - marker: b
    text: “మిక్తాం” అనేది అర్థం ఖచ్చితంగా తెలియని హెబ్రీ ప్రక్రియా పదం. కొందరు దీనిని సంగీత లేదా సాహిత్య సూచనగా భావిస్తారు.
    reason: lexical_alternative
  - marker: c
    text: “దావీదుకు సంబంధించిన” అనే మాటకు “దావీదు రచించిన” లేదా “దావీదు కోసం” అనే అర్థాలు కూడా ఉండవచ్చు. హెబ్రీ నిర్మాణం రచయితృత్వం, సంబంధం, లేదా అంకితాన్ని సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకునికి
  rationale: కీర్తనల శీర్షికల్లో ఈ పదం సంగీత నిర్వహణకు బాధ్యత వహించే నాయకుణ్ణి సూచిస్తుంది. ఈ అనువాదం ఆ ఆరాధనా సందర్భపు విధిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עַל
  choice: ప్రకారం
  rationale: ఇక్కడ ఇది ఒక రాగం, గానం చేసే తీరు, లేదా ఆరాధనా అమరికను పరిచయం చేసి ఉండవచ్చు. ‘ప్రకారం’ అనే పదం దాని సాంకేతిక అర్థాన్ని అతిగా నిర్ధారించకుండా ఉంచుతుంది.
- source_word: שׁוּשַׁן עֵדוּת
  choice: “సాక్ష్యపు కలువ”
  rationale: ఇది బహుశా సంగీత లేదా ఆరాధనా శీర్షిక. దాని ఖచ్చిత సూచన తెలియనందున శీర్షికలా ఉటంకిస్తూ మూలంలోని రూపకాన్ని నిలిపాం.
- source_word: מִכְתָּם
  choice: మిక్తాం
  rationale: ఈ హెబ్రీ ప్రక్రియా లేదా సంగీత పదానికి ఖచ్చితమైన అర్థం తెలియదు. ఊహాత్మకంగా అనువదించకుండా లిప్యంతరీకరించడం మూలంలోని అనిశ్చితిని కాపాడుతుంది.
- source_word: לְדָוִד
  choice: దావీదుకు సంబంధించినది
  rationale: హెబ్రీ ‘లె’ సంబంధం, రచయితృత్వం, అంకితం వంటి భావాలను సూచించగలదు. ఈ రూపం వాటిలో ఒక్కదాన్నే ఖచ్చితంగా నిర్ణయించదు.
- source_word: לְלַמֵּד
  choice: బోధించడానికి
  rationale: మూలంలోని ఉద్దేశార్థక క్రియారూపాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
