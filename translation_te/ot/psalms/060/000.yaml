translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన కీర్తన శీర్షికగా రూపొందించాం. అందించిన WLC మూలపాఠం לְלַמֵּד వరకు మాత్రమే ఉన్నందున, ఆ తరువాత ఇంగ్లీషు సంప్రదింపుపాఠంలో కనిపించే చారిత్రక సందర్భాన్ని ఈ ముసాయిదాలో చేర్చలేదు.
