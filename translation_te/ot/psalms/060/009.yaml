translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా ప్రశ్నారూపాన్ని వాడాం. రెండు పాదాల సమాంతరతను నిలుపుతూ, ‘తీసుకెళ్తారు/నడిపిస్తారు’ అనే స్వల్ప పదభేదంతో మూలంలోని వేర్వేరు క్రియలను ప్రతిబింబించాం.
