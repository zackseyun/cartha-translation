source:
  edition: WLC
  text: מִ֣י יֹ֭בִלֵ/נִי עִ֣יר מָצ֑וֹר מִ֖י נָחַ֣/נִי עַד אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/009.yaml
  text: Who will bring me to the fortified city? Who will lead me as far as Edom?[a]
translation:
  language: te
  text: కోటగల పట్టణానికి నన్ను ఎవరు తీసుకెళ్తారు? ఎదోము వరకు నన్ను ఎవరు నడిపిస్తారు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కోటగల పట్టణానికి నన్ను ఎవరు నడిపిస్తారు? ఎదోము వరకు నన్ను నడిపించినవారు ఎవరు?” హీబ్రూ క్రియారూపాలు కాలం, దృక్కోణంలో స్వల్ప భిన్న అర్థాలకు వీలు కల్పిస్తాయి; ప్రధాన పాఠం మాత్రం రెండు భవిష్యదర్థక ప్రశ్నలుగా ఉన్న కవితా సమాంతరతను నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: ఎవరు
  rationale: అలంకారిక ప్రశ్నను ప్రారంభించే ప్రశ్నార్థక సర్వనామం; తెలుగులో సహజంగా ‘ఎవరు’.
- source_word: יֹבִלֵנִי
  choice: నన్ను తీసుకెళ్తారు
  rationale: יבל అనే ధాతువు హిఫీల్ రూపంలో ఒకరిని గమ్యస్థానానికి తీసుకెళ్లడం లేదా నడిపించడం అనే భావాన్ని ఇస్తుంది; తరువాత వచ్చే స్థలపదబంధానికి ‘తీసుకెళ్తారు’ సహజంగా సరిపోతుంది.
- source_word: עִיר מָצוֹר
  choice: కోటగల పట్టణం
  rationale: కోటబందోబస్తు లేదా దుర్గరక్షణ కలిగిన పట్టణాన్ని సూచించే సమాసం; ముట్టడిలో ఉన్న పట్టణమని కాక, రక్షణగల బలమైన పట్టణమనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: נָחַנִי
  choice: నన్ను నడిపిస్తారు
  rationale: נחה అంటే నడిపించడం లేదా మార్గం చూపడం. రూపం భూతార్థాన్ని అనుమతించినా, కవితా సమాంతరతలో ముందుచూపుగల ప్రశ్నగా అనువదించడం సహజం.
- source_word: עַד אֱדוֹם
  choice: ఎదోము వరకు
  rationale: עַד గమ్యపు హద్దు లేదా చేరే చివరను సూచిస్తుంది; ‘వరకు’ ఆ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: אֱדוֹם
  choice: ఎదోము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సుపరిచితమైన బైబిలు లిప్యంతరీకరణతో ఇచ్చాం.
