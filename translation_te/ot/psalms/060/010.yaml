id: PSA.60.10
reference: Psalms 60:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ/לֹֽא אַתָּ֣ה אֱלֹהִ֣ים זְנַחְתָּ֑/נוּ וְֽ/לֹא תֵצֵ֥א אֱ֝לֹהִ֗ים בְּ/צִבְאוֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/010.yaml
  text: Have you not[a], O God, rejected us, and do you not go out, O God[c][b], with our armies?
translation:
  language: te
  text: దేవా, నీవు మమ్మల్ని తిరస్కరించావు కదా? దేవా, నీవు మా సైన్యాలతో బయలుదేరవు కదా?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלֹא
  choice: నీవే కాదా?
  rationale: హֲלֹא సమ్మతిని ఆశించే అలంకారప్రశ్నను ప్రవేశపెడుతుంది. తెలుగు సహజ వాక్యనిర్మాణంలో ‘నీవే కాదా?’ దాని ప్రశ్నార్థకతను, אַתָּה లోని ఉద్ఘాటనను రెండింటినీ వ్యక్తం చేస్తుంది.
- source_word: אַתָּה
  choice: నీవే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగు ‘ఏ’ ప్రత్యయంతో సహజంగా నిలిపింది.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ఇక్కడ ఇది ప్రత్యక్ష సంబోధన. హీబ్రూలో రెండుసార్లు ఉన్నందున తెలుగులోనూ రెండు ఉపవాక్యాల్లో పునరావృతం చేయబడింది.
- source_word: זְנַחְתָּנוּ
  choice: మమ్మల్ని తిరస్కరించింది
  rationale: זנח అంటే తిరస్కరించడం లేదా త్రోసివేయడం. ‘తిరస్కరించింది’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, దేవుని చర్యను మృదువుగా మార్చకుండా నేరుగా తెలియజేస్తుంది.
- source_word: וְלֹא
  choice: లేదు
  rationale: వావ్‌తో కూడిన నిరాకరణ రెండవ ఉపవాక్యాన్ని మొదటిదానికి కలుపుతుంది. మసొరా విరామచిహ్నం మొదటి ఉపవాక్యం తరువాత ప్రధాన విరామాన్ని సూచిస్తున్నందున, రెండవదాన్ని సహజ తెలుగు నిరాకరణ ప్రకటనగా ఇచ్చాం; ప్రశ్నార్థక పఠనాన్ని పాదసూచికలో ఉంచాం.
- source_word: תֵצֵא
  choice: బయలుదేరడం
  rationale: క్రియకు అక్షరార్థంగా ‘బయలుదేరు’ అనే భావం ఉంది. సైన్యాల సందర్భంలో యుద్ధానికి వెళ్లడాన్ని సూచించినా, మూలంలోని రూపకాన్ని ప్రధాన పాఠంలో నిలిపాం.
- source_word: בְּצִבְאוֹתֵינוּ
  choice: మా సైన్యాలతో
  rationale: ఇక్కడ צבאות సైనిక దళాలను సూచిస్తుంది; בְּ సహచర్య భావాన్ని ‘తో’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: విలాపంలో దేవుడు తన ప్రజలను తిరస్కరించినట్లు చెప్పడం
  choice: దేవుడే వారిని తిరస్కరించాడని, వారి సైన్యాలతో బయలుదేరడం లేదని నేరుగా ఉంచడం
  alternative: ‘మేము తిరస్కరించబడటానికి అనుమతించావు’ లేదా ‘మమ్మల్ని తిరస్కరించినట్లు అనిపించింది’ అని మృదువుగా చెప్పడం
  rationale: హీబ్రూ వాక్యం ఈ చర్యలను నేరుగా దేవునికే ఆపాదిస్తుంది. విలాపంలో ఉన్న వేదాంత ఉద్రిక్తతను అనువాదం పరిష్కరించకుండా నిలిపింది.
- issue: రెండవ ఉపవాక్యం ప్రశ్నా, ప్రకటననా
  choice: మసొరా ప్రధాన విరామాన్ని అనుసరించి నిరాకరణ ప్రకటనగా ప్రధాన పాఠంలో ఇవ్వడం
  alternative: మొదటి הֲלֹא పరిధిని రెండవ ఉపవాక్యానికి విస్తరించి ‘నీవు బయలుదేరవు కదా?’ అనే ప్రశ్నగా చదవడం
  rationale: זְנַחְתָּנוּ తరువాత ఉన్న అత్నాహ్ మొదటి ప్రశ్నను ముగించినట్లు చదవడానికి మద్దతిస్తుంది; అయితే సంయుక్త అలంకారప్రశ్నగా చదవడం కూడా సాధ్యమే కాబట్టి పాదసూచికలో భద్రపరచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనా గాంభీర్యాన్ని నిలిపే సరళమైన సంబోధన మరియు సహజమైన వాక్యనిర్మాణం ఉపయోగించబడ్డాయి. ‘దేవా’ అనే పునరుక్తి మూలపాఠాన్ని అనుసరిస్తుంది; ప్రాచీనంగా వినిపించే పదాలను నివారించాం.
