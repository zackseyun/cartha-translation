  terminology: “దేవా,” “తిరస్కరించావు,” “సైన్యాలతో,” and “బయలుదేరవు” are appropriate modern-standard Telugu choices. “బయలుదేరు” retains the literal military-going-out image without imposing an interpretive equivalent.
