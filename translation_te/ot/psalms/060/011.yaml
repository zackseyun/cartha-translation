source:
  edition: WLC
  text: הָֽבָ/ה לָּ֣/נוּ עֶזְרָ֣ת מִ/צָּ֑ר וְ֝/שָׁ֗וְא תְּשׁוּעַ֥ת אָדָם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/011.yaml
  text: Give us help against the adversary[c][b][a], for the salvation of man is vain.
translation:
  language: te
  text: శత్రువుకు వ్యతిరేకంగా మాకు సహాయం అనుగ్రహించు[a]; మానవుని రక్షణ వ్యర్థమే[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆపదనుండి మాకు సహాయం అనుగ్రహించు.” హీబ్రూ צַר అనే పదానికి “శత్రువు” లేదా “కష్టం/ఆపద” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “రక్షణ”కు బదులుగా “విమోచన” లేదా “విజయం” అని కూడా అనువదించవచ్చు. “మానవుడు” ఇక్కడ సాధారణంగా మానవజాతిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: అనుగ్రహించు
  rationale: ప్రార్థనలో దేవుణ్ణి వేడుకొనే ఆజ్ఞార్థక రూపం; తెలుగు భక్తికావ్య శైలిలో సహజమైన, గౌరవప్రదమైన విన్నపాన్ని వ్యక్తం చేస్తుంది.
- source_word: לָּנוּ
  choice: మాకు
  rationale: ప్రథమ పురుష బహువచన పరోక్ష కర్మను నేరుగా వ్యక్తం చేస్తుంది.
- source_word: עֶזְרַת
  choice: సహాయం
  rationale: ‘సహాయం/తోడు’ అనే సాధారణ అర్థాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: מִצָּר
  choice: శత్రువుకు ఎదురుగా
  rationale: צַר అనే పదానికి ‘శత్రువు’ లేదా ‘కష్టం’ అనే అర్థాలు సాధ్యం. కీర్తనలోని యుద్ధ సందర్భం వల్ల వ్యక్తిగత శత్రువు అనే భావాన్ని ప్రధాన పాఠంలో ఎంచుకున్నాం; מִן‌ను ‘సహాయం’తో కలిపి సహజమైన తెలుగులో ‘ఎదురుగా’ అని ఇచ్చాం.
- source_word: וְשָׁוְא
  choice: వ్యర్థమే
  rationale: שָׁוְא సూచించే శూన్యత, నిష్ఫలత భావాన్ని సంక్షిప్తమైన కవితా వాక్యంగా వ్యక్తం చేస్తుంది; וְ ఇక్కడ సందర్భానుసారంగా రెండు వాక్యభాగాల మధ్య కారణాత్మక సంబంధాన్ని విరామచిహ్నం ద్వారా చూపుతుంది.
- source_word: תְּשׁוּעַת
  choice: రక్షణ
  rationale: ఈ పదం రక్షణ, విమోచన, విజయం అనే భావాలను కలిగి ఉంది. ‘రక్షణ’ మూలపద విస్తృతిని కాపాడుతూ యుద్ధసందర్భంలోని విడిపింపునకూ సరిపోతుంది.
- source_word: אָדָם
  choice: మానవుని
  rationale: ఇక్కడ ఒక నిర్దిష్ట పురుషుడిని కాక దేవునికి భిన్నంగా మానవజాతిని సాధారణంగా సూచిస్తుంది. ‘మానవుని’ కవితా సంక్షిప్తతతో ఆ సామాన్యార్థాన్ని అందిస్తుంది.
theological_decisions:
- issue: దైవ సహాయానికి విరుద్ధంగా మానవ రక్షణ యొక్క నిష్ఫలత
  choice: తక్షణ సందర్భంలో శత్రువుకు ఎదురుగా దేవుని సహాయం అవసరమనీ, మానవుడు కలిగించే రక్షణ నిష్ఫలమనీ తెలిపే వ్యత్యాసాన్ని నిలిపాం.
  alternative: మానవ ప్రయత్నమంతా అన్ని సందర్భాల్లో వ్యర్థమనే విస్తృత సిద్ధాంత ప్రకటనగా చదవడం.
  rationale: హీబ్రూ వాక్యం దేవునికి చేసే విన్నపాన్ని మానవ రక్షణ అసమర్థతతో ఎదురెదురుగా ఉంచుతుంది; దాని పరిధిని మూలంలో లేనంతగా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనా కీర్తనకు తగిన గౌరవప్రదమైన కవితా శైలిని ఉపయోగించాం. పదప్రయోగం సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచి, צַר మరియు תְּשׁוּעָה పదాల నిజమైన అర్థవైవిధ్యాన్ని పాదటిప్పణుల్లో కాపాడాం.
