revisions:
- from: శత్రువుకు ఎదురుగా మాకు సహాయం అనుగ్రహించు[a]; మానవుని రక్షణ వ్యర్థమే[b].
  to: శత్రువుకు వ్యతిరేకంగా మాకు సహాయం అనుగ్రహించు[a]; మానవుని రక్షణ వ్యర్థమే[b].
  rationale: The revision makes the adversative force of מִן with the personal sense of צַר explicit, while preserving the footnoted “distress” alternative. It retains the concise poetic contrast and does not extend the statement beyond the psalm’s immediate contrast between God’s help and human deliverance.
