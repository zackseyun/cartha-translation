source:
  edition: WLC
  text: בֵּֽ/אלֹהִ֥ים נַעֲשֶׂה חָ֑יִל וְ֝/ה֗וּא יָב֥וּס צָרֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/012.yaml
  text: With God we will do valiantly[b][a], and he will trample our adversaries.
translation:
  language: te
  text: దేవునితో[a] మనం పరాక్రమం చూపుతాం; ఆయనే మన విరోధులను తొక్కివేస్తాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని ద్వారా మనం పరాక్రమం చూపుతాం.” హీబ్రూ ఉపసర్గ దేవునితో సహచర్యాన్ని లేదా ఆయనను సాధనంగా/సహాయంగా పొందడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆయనే మన శత్రువులను కాలికింద తొక్కుతాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: దేవునితో
  rationale: בְּ ఉపసర్గ ఇక్కడ దేవునితో సన్నిహిత సహకారాన్ని లేదా దేవుని ద్వారా లభించే సహాయాన్ని సూచించవచ్చు. ‘దేవునితో’ అనేది ఆధారపడే భావాన్ని సహజంగా తెలియజేస్తూ, సాధనార్థాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: נַעֲשֶׂה חָיִל
  choice: మనం పరాక్రమం చూపుతాం
  rationale: עשה חיל అనే హీబ్రూ నుడికారం బలంగా కార్యం చేయడం, శౌర్యం ప్రదర్శించడం అనే భావాన్ని ఇస్తుంది. తెలుగులో ‘పరాక్రమం చూపుతాం’ సహజంగా, సంక్షిప్తంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: וְהוּא
  choice: ఆయనే
  rationale: స్వతంత్ర సర్వనామం దేవుని నిర్ణాయక కార్యాన్ని నొక్కి చెబుతుంది. ‘ఆయనే’ ఆ ఉద్ఘాటనను నిలుపుతుంది; ముందు భాగంలోని మానవ కార్యాన్ని తొలగించదు.
- source_word: יָבוּס
  choice: తొక్కివేస్తాడు
  rationale: בוס అనే క్రియ కాలికింద తొక్కే సజీవమైన యుద్ధ చిత్రాన్ని ఇస్తుంది. ‘తొక్కివేస్తాడు’ ఆ చిత్రాన్ని వ్యాఖ్యానాత్మకంగా ‘నాశనం చేస్తాడు’ అని మార్చకుండా నిలుపుతుంది.
- source_word: צָרֵינוּ
  choice: మన విరోధులను
  rationale: צָרֵינוּ అంటే మనకు విరోధంగా నిలిచేవారు లేదా శత్రువులు. ‘విరోధులు’ మూలపదంలోని విస్తృత భావాన్ని, సందర్భంలోని పోరాట స్వరాన్ని రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: విజయంలో మానవ కార్యం మరియు దేవుని కార్యం
  choice: ప్రజలు దేవునితో పరాక్రమం చూపుతారు; అయితే విరోధులను తొక్కివేసే నిర్ణాయక కార్యం దేవునిదే.
  alternative: కేవలం మానవ విజయాన్నే లేదా కేవలం దేవుని కార్యాన్నే నొక్కి చెప్పడం.
  rationale: హీబ్రూ వాక్యం ‘మనం’ చేసే కార్యాన్నీ, ‘ఆయనే’ చేసే నిర్ణాయక కార్యాన్నీ పక్కపక్కనే ఉంచుతుంది. అనువాదం ఈ రెండింటి మధ్య ఉన్న భావ ఉద్వేగాన్ని పరిష్కరించకుండా అలాగే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక శైలి ఉపయోగించబడింది. ‘పరాక్రమం చూపుతాం’ హీబ్రూ నుడికారాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది; ‘తొక్కివేస్తాడు’ మూలంలోని యుద్ధ చిత్రాన్ని నిలుపుతుంది.
