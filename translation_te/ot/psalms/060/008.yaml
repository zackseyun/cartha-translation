revisions:
- from: 'మోయాబు నా కడుగుకొనే పాత్ర[a];

    ఎదోము మీద నా పాదరక్షను విసురుతాను;

    ఫిలిష్తియా, నాకోసం విజయనాదం చేయి![b]'
  to: 'మోయాబు నా కడుగునీటి పాత్ర[a];

    ఎదోము మీద నా పాదరక్షను విసురుతాను;

