source:
  edition: WLC
  text: מוֹאָ֤ב סִ֬יר רַחְצִ֗/י עַל אֱ֭דוֹם אַשְׁלִ֣יךְ נַעֲלִ֑/י עָ֝לַ֗/י פְּלֶ֣שֶׁת הִתְרֹעָֽעִֽי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/008.yaml
  text: Moab is my washbasin[a]; on Edom I cast my sandal; over Philistia[b], shout in triumph for me.
translation:
  language: te
  text: 'మోయాబు నా కడుగునీటి పాత్ర[a];

    ఎదోము మీద నా పాదరక్షను విసురుతాను;

    ఫిలిష్తియా, నాపై జయధ్వని చేయి![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కడుగునీటి పాత్ర’ను సంప్రదాయంగా ‘కడుగు కుండ’ అని కూడా అనువదిస్తారు. ఈ చిత్రం అవమానాన్ని, అధీనతను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీ రూపం క్లిష్టమైనది. మసొరెటిక్ పాఠాన్ని అక్షరార్థంగా తీసుకుంటే, ఫిలిష్తియాను ఉద్దేశించి ‘నాపై జయధ్వని చేయి’ అనే ఆజ్ఞగా అర్థమవుతుంది. సంప్రదాయ అనువాదంలో దీన్ని ‘ఫిలిష్తియా మీద నేను విజయనాదం చేస్తాను’ అని కూడా గ్రహిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: סִיר רַחְצִי
  choice: నా కడుగుకొనే పాత్ర
  rationale: סִיר అనేది పాత్ర లేదా గిన్నెను సూచిస్తుంది; רַחְצִי దాని కడుగుటకు సంబంధించిన ఉపయోగాన్ని తెలియజేస్తుంది. ఆధునిక తెలుగులో ‘కడుగుకొనే పాత్ర’ సహజంగా ఉండి, అవమానకరమైన అధీనతను సూచించే రూపకాన్ని నిలుపుతుంది.
- source_word: אַשְׁלִיךְ נַעֲלִי
  choice: నా పాదరక్షను విసురుతాను
  rationale: Hiphil రూపమైన אַשְׁלִיךְ ‘విసరడం’ అనే క్రియను, נַעַל పాదానికి ధరించే వస్తువును సూచిస్తాయి. ‘పాదరక్ష’ ప్రాచీన సందర్భాన్ని అనవసరంగా ఆధునికీకరించకుండా గౌరవప్రదమైన కవితా శైలిని కాపాడుతుంది.
- source_word: עַל אֱדוֹם
  choice: ఎదోము మీద
  rationale: עַל యొక్క ప్రత్యక్ష స్థానార్థాన్ని నిలిపి, ఎదోము మీద పాదరక్షను విసరడం ద్వారా ఆధిపత్యాన్ని ప్రకటించే చిత్రాన్ని కాపాడుతుంది.
- source_word: עָלַי פְּלֶשֶׁת
  choice: ఫిలిష్తియా, నాకోసం
  rationale: עָלַי లోని మొదటి పురుష ఏకవచన ప్రత్యయాన్ని ‘నాకోసం’గా వ్యక్తం చేశాం. ఈ పదబంధం క్లిష్టమైనది; అందువల్ల దాని భావాన్ని అతిగా నిర్దిష్టం చేయకుండా, తరువాతి ఆజ్ఞార్థక క్రియతో సహజంగా కలిపాం.
- source_word: הִתְרֹעָעִי
  choice: విజయనాదం చేయి
  rationale: רוע మూలం బిగ్గరగా నినదించడాన్ని, యుద్ధ లేదా విజయ సందర్భంలో జయధ్వని చేయడాన్ని సూచించగలదు. స్త్రీలింగ ఏకవచన ఆజ్ఞార్థక రూపం ఫిలిష్తియాను నేరుగా సంబోధిస్తుంది; సందర్భంలోని వ్యంగ్యభరిత అధీనతను ఈ ఎంపిక నిలుపుతుంది.
- source_word: מוֹאָב / אֱדוֹם / פְּלֶשֶׁת
  choice: మోయాబు / ఎదోము / ఫిలిష్తియా
  rationale: ఇవి దేశాలు లేదా ప్రాంతాల పేర్లు. మూలభాషా రూపాలకు దగ్గరగా, ఆధునిక తెలుగు పాఠకులకు పలకడానికి సులభంగా లిప్యంతరీకరించబడ్డాయి.
theological_decisions:
- issue: ఫిలిష్తియాను ఉద్దేశించిన הִתְרֹעָעִי ఆజ్ఞ యొక్క భావం
  choice: ‘ఫిలిష్తియా, నాకోసం విజయనాదం చేయి!’—మసొరెటిక్ పాఠంలోని స్త్రీలింగ ఏకవచన ఆజ్ఞను నిలుపుతూ, అధీనతను సూచించే వ్యంగ్య ఆజ్ఞగా అనువదించడం
  alternative: ‘ఫిలిష్తియా మీద నేను విజయనాదం చేస్తాను’—సంప్రదాయ అనువాదం; సమాంతర వచనం ఆధారంగా క్రియను మొదటి పురుష ప్రకటనగా గ్రహించడం
  rationale: మసొరెటిక్ స్వరచిహ్నాల ప్రకారం క్రియ ఫిలిష్తియాను ఉద్దేశించిన స్త్రీలింగ ఏకవచన ఆజ్ఞ. చుట్టుపక్కల వాక్యాలు శత్రు దేశాలపై దేవుని ఆధిపత్యాన్ని ప్రకటిస్తున్నందున ఇది స్వతంత్ర ఆనందానికి పిలుపు కంటే వ్యంగ్యభరితమైన అధీనతా సూత్రంగా ఉండవచ్చు. అయినా హెబ్రీ రూపం క్లిష్టమైనది కాబట్టి సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కవితా శైలి ఉపయోగించబడింది. సమాంతర పాద నిర్మాణాన్ని కాపాడి, మూలంలోని జాతులపై ఆధిపత్యాన్ని ప్రకటించే బలమైన రూపకాలను మృదువుపరచలేదు. క్లిష్టమైన చివరి పాదంలో మసొరెటిక్ పాఠానికి ప్రాధాన్యం ఇచ్చి, నిజమైన పాఠ్య సందిగ్ధతను పాదసూచికలో స్పష్టంగా ఉంచాం.
