translation:
  language: te
  text: నిన్ను భయపడేవారికి నీవు ఒక పతాకాన్ని ఇచ్చావు—సత్యం నిమిత్తం అది ఎత్తబడటానికి[a]. సెలా[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రదర్శించబడటానికి,’ ‘వారు సమకూడటానికి,’ లేదా బహుశా ‘పారిపోవటానికి’ అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ క్రియ క్లిష్టమైనది; దాని అర్థంపై భిన్నాభిప్రాయాలు ఉన్నాయి. అలాగే కֹשֶׁט అనే పదానికి సాధారణంగా ‘సత్యం’ లేదా ‘సత్యనిష్ఠ’ అని అర్థం; కొన్ని ప్రాచీన అనువాదాలు, వ్యాఖ్యాన సంప్రదాయాలు ఈ పాదాన్ని భిన్నంగా అర్థం చేసుకొని ‘విల్లు నిమిత్తం’ వంటి పఠనాన్ని సూచిస్తాయి.
    reason: lexical_alternative_and_alternative_reading
  - marker: b
    text: ‘సెలా’ అనేది ఖచ్చితమైన అర్థం తెలియని హీబ్రూ ఆరాధనా లేదా సంగీత సూచిక.
    reason: cultural_liturgical_term
