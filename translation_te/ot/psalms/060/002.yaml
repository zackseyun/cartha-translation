  text: You have shaken the earth; you have split it open. Heal its fractures[a], for it is tottering.
translation:
  language: te
  text: 'నీవు భూమిని[a] కంపింపజేశావు;

    దాన్ని చీల్చివేశావు.

    అది తూలిపోతోంది కాబట్టి

    దాని పగుళ్లను మాన్పు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేశాన్ని.’ హీబ్రూ אֶרֶץ అనే పదం మొత్తం భూమినిగానీ, ఒక నిర్దిష్ట దేశాన్నిగానీ సూచించవచ్చు; ఈ కవితాత్మక సందర్భంలో రెండు భావాలూ సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְעַשְׁתָּה
  choice: కంపింపజేశావు
  rationale: רעש అనే ధాతువు హిఫీల్ రూపంలో ‘కంపించేలా చేశావు’ అనే కారణార్థాన్ని ఇస్తుంది. ‘కంపింపజేశావు’ భూకంప దృశ్యాన్ని, కారణార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אֶרֶץ
  choice: భూమిని
  rationale: אֶרֶץ అనే పదానికి ‘భూమి’ లేదా ‘దేశం’ అనే రెండు అర్థాలు సాధ్యమే. ఇక్కడ చీలికలు, తూలడం అనే కవితాత్మక దృశ్యానికి ‘భూమి’ సహజంగా సరిపోతుంది; ‘దేశం’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: פְּצַמְתָּהּ
  choice: దాన్ని చీల్చివేశావు
  rationale: ఈ క్రియ విరగగొట్టడం లేదా చీల్చడం అనే భావాన్ని ఇస్తుంది. తరువాత వచ్చే పగుళ్ల దృశ్యంతో ‘చీల్చివేశావు’ బలంగా అనుసంధానమవుతుంది.
- source_word: רְפָה
  choice: మాన్పు
  rationale: רפא సాధారణంగా ‘స్వస్థపరచు’ లేదా ‘మాన్పు’ అని అర్థం. భూమి పగుళ్లను వ్యక్తీకరించి చెప్పే కవితాత్మక రూపకాన్ని ‘మాన్పు’ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שְׁבָרֶיהָ
  choice: దాని పగుళ్లను
  rationale: שֶׁבֶר విరిగిన చోటు, చీలిక లేదా పగులు అనే భావాలను సూచిస్తుంది. భూకంప దృశ్యంలో ‘పగుళ్లు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: כִי
  choice: కాబట్టి
  rationale: ఇది ప్రార్థనకు కారణాన్ని పరిచయం చేస్తుంది. తెలుగు వాక్యక్రమంలో కారణాన్ని ముందుంచి ‘కాబట్టి’ అనడం సహజంగా ఉంటుంది.
- source_word: מָטָה
  choice: తూలిపోతోంది
  rationale: ఈ క్రియ వంగడం, స్థిరత్వం కోల్పోవడం, తూలడం అనే భావాన్ని ఇస్తుంది. ‘తూలిపోతోంది’ కొనసాగుతున్న అస్థిరతను వ్యక్తం చేస్తుంది; పూర్తిగా కూలిపోయిందనే భావాన్ని రుద్దదు.
