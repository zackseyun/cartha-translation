  variant: modern standard Telugu
source:
  edition: WLC
  text: לִ֤/י גִלְעָ֨ד וְ/לִ֬/י מְנַשֶּׁ֗ה וְ֭/אֶפְרַיִם מָע֣וֹז רֹאשִׁ֑/י יְ֝הוּדָ֗ה מְחֹֽקְקִ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/007.yaml
  text: Gilead is mine[a], and Manasseh is mine; Ephraim is the stronghold of my head[b]; Judah is my scepter.
translation:
  language: te
  text: గిలాదు నాది, మనష్షే నాది; ఎఫ్రాయిము నా తలకు కోట; యూదా నా రాజదండం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదా నా శాసనకర్త” లేదా “యూదా నా పాలకదండం.” హీబ్రూ పదం శాసనం చేసే వ్యక్తినిగానీ, పాలనకు చిహ్నమైన దండం లేదా రాజదండాన్నిగానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: לִי
  choice: నాది
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో కూడిన ఉపసర్గ స్వామ్యాన్ని సూచిస్తుంది; తెలుగులో ‘నాది’ సహజంగా, సూటిగా ఉంది.
- source_word: גִלְעָד
  choice: గిలాదు
  rationale: స్థలనామాన్ని ప్రామాణిక తెలుగు బైబిలు రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: מְנַשֶּׁה
  choice: మనష్షే
  rationale: గోత్ర/ప్రాంత నామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: אֶפְרַיִם
  choice: ఎఫ్రాయిము
  rationale: గోత్రనామాన్ని ఆధునిక తెలుగు పాఠకులకు గుర్తుపట్టదగిన రూపంలో లిప్యంతరీకరించాం.
- source_word: מָעוֹז
  choice: కోట
  rationale: ఈ పదం బలం లేదా రక్షణనిచ్చే దుర్గాన్ని సూచిస్తుంది; రాజసైనిక చిత్రణను ‘కోట’ సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: רֹאשִׁי
  choice: నా తలకు
  rationale: ‘నా తల’ అనే మూల చిత్రాన్ని నిలుపుతూ, ఎఫ్రాయిము తలకు రక్షణగా ఉన్నదనే సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מְחֹקְקִי
  choice: నా రాజదండం
  rationale: పదం ఆజ్ఞాపించే పాలకుణ్ణి లేదా పాలనకు చిహ్నమైన దండాన్ని సూచించగలదు. సందర్భంలోని రాజరిక చిత్రణలో ‘రాజదండం’ స్పష్టంగా, సహజంగా సరిపోతుంది.
theological_decisions:
- issue: מְחֹקְקִי అనే పదంలోని రాజరిక చిత్రణ
  choice: నా రాజదండం
  alternative: నా శాసనకర్త; నా పాలకదండం
  rationale: వచనం గోత్రాలకు సైనిక, రాజరిక పాత్రలను రూపకాలుగా ఇస్తుంది. ‘రాజదండం’ యూదాను రాజాధికారపు చిహ్నంగా చూపుతుంది; అయితే వ్యక్తిగత శాసనకర్త అనే అర్థం కూడా పదానికి సాధ్యమైనందున పాదటిప్పణిలో నిలిపాం.
- issue: מָעוֹז רֹאשִׁי అనే సంక్షిప్త రూపకం
  choice: నా తలకు కోట
  alternative: నా తల కోట; నా తలకు బలం
  rationale: హీబ్రూ నిర్మాణం ‘నా తల యొక్క కోట/బలమైన ఆశ్రయం’ అనే గాఢమైన రూపకాన్ని ఇస్తుంది. తెలుగులో ‘నా తలకు కోట’ తల అనే చిత్రాన్ని తొలగించకుండా రక్షణ భావాన్ని సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన కవితా శైలిని ఉపయోగించాం. హీబ్రూ సమాంతర నిర్మాణం, స్వామ్య ప్రకటనలు, సైనిక-రాజరిక రూపకాలను సాధ్యమైనంత స్పష్టంగా నిలిపాం.
