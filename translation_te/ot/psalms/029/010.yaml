source:
  edition: WLC
  text: יְ֭הוָה לַ/מַּבּ֣וּל יָשָׁ֑ב וַ/יֵּ֥שֶׁב יְ֝הוָ֗ה מֶ֣לֶךְ לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/010.yaml
  text: Yahweh sat enthroned over the flood[a]; Yahweh sits enthroned as King forever.
translation:
  language: te
  text: యెహోవా జలప్రళయంపై సింహాసనంపై ఆసీనుడై కూర్చున్నాడు[a]; యెహోవా శాశ్వతంగా రాజుగా సింహాసనంపై ఆసీనుడై ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నోవహు కాలపు మహాజలప్రళయంపై’; ఈ పదం ప్రత్యేకంగా ఆ జలప్రళయాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన య్హ్వ్హ్‌ను ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం; సాధారణ బిరుదుతో దానిని భర్తీ చేయలేదు.
- source_word: לַמַּבּוּל
  choice: జలప్రళయంపై
  rationale: מַבּוּל అంటే ప్రళయం లేదా మహాజలప్రళయం. ל ఉపసర్గను ఇక్కడ సింహాసనాధిపత్యాన్ని సూచించే స్థానార్థక సంబంధంగా తీసుకొని ‘పై’ అని అనువదించాం.
- source_word: יָשָׁב
  choice: సింహాసనాసీనుడయ్యాడు
  rationale: మూలార్థం ‘కూర్చున్నాడు’; అయితే రాజరిక సందర్భంలో సింహాసనంపై ఆసీనుడై పాలించడం అనే భావం ఉంది. పరిపూర్ణ క్రియ యొక్క గతకాల స్వరాన్ని కూడా నిలిపాం.
- source_word: וַיֵּשֶׁב
  choice: సింహాసనాసీనుడై ఉన్నాడు
  rationale: మొదటి పాదంలోని కూర్చోవడం అనే రూపకాన్ని కొనసాగిస్తూ, לְעוֹלָם‌తో కలిగే నిరంతర రాజ్యపాలన భావాన్ని సహజమైన తెలుగు స్థితివాచక రూపంలో వ్యక్తం చేశాం.
- source_word: מֶלֶךְ
  choice: రాజుగా
  rationale: ఇది యెహోవా యొక్క రాజస్థితిని తెలిపే విధేయ నామవాచకం; అందువల్ల సహజ తెలుగులో ‘రాజుగా’ అని ఇచ్చాం.
- source_word: לְעוֹלָם
  choice: శాశ్వతంగా
  rationale: నిరంతరమైన, అంతంలేని కాలాన్ని సూచించే స్పష్టమైన ఆధునిక తెలుగు పదాన్ని ఎంచుకున్నాం.
theological_decisions:
- issue: מַבּוּל అనేది ప్రత్యేకంగా నోవహు కాలపు జలప్రళయాన్నా, లేక సాధారణ ప్రళయజలాలు లేదా తుఫాను జలాలనూ సూచిస్తుందా?
  choice: ప్రధాన పాఠంలో ‘జలప్రళయం’ అని మాత్రమే ఇచ్చి, నోవహును స్పష్టంగా చేర్చలేదు.
  alternative: ‘ఆ జలప్రళయం’—ప్రత్యేకంగా నోవహు కాలపు జలప్రళయాన్ని సూచించవచ్చు.
  rationale: ఈ నామవాచకం ఆదికాండంలోని మహాజలప్రళయాన్ని గుర్తుచేయగలదు; అయితే కీర్తన 29 యొక్క తక్షణ సందర్భం తుఫానులో దేవుని ప్రత్యక్షత. అందువల్ల ప్రధాన పాఠం రెండింటికీ వీలు కల్పిస్తుంది; పాదటిప్పణి ప్రత్యేక సూచన సాధ్యతను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కీర్తనా శైలిని పాటించాం. ‘సింహాసనాసీనుడు’ కొంత ఉన్నత శైలిలో ఉన్నప్పటికీ, రాజరిక దృశ్యాన్ని సంక్షిప్తంగా, స్పష్టంగా అందిస్తుంది. రెండు పాదాల్లోని యెహోవా నామపునరుక్తిని నిలిపాం.
