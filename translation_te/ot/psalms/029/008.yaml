source:
  edition: WLC
  text: ק֣וֹל יְ֭הוָה יָחִ֣יל מִדְבָּ֑ר יָחִ֥יל יְ֝הוָ֗ה מִדְבַּ֥ר קָדֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/008.yaml
  text: The voice of Yahweh shakes the wilderness[a]; Yahweh shakes the wilderness of Kadesh.
translation:
  language: te
  text: 'యాహ్వే స్వరం అరణ్యాన్ని కంపింపజేస్తుంది[a];

    యాహ్వే కాదేషు అరణ్యాన్ని కంపింపజేస్తాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అరణ్యాన్ని వణికిస్తుంది’; లేదా, ‘అరణ్యం మెలికలు తిరిగేలా చేస్తుంది.’
    reason: హీబ్రూ హిఫీల్ క్రియకు వణికించడం లేదా మెలికలు తిరిగేలా చేయడం అనే ప్రత్యామ్నాయ భావాలు ఉన్నాయి.
lexical_decisions:
- source_word: ק֣וֹל
  choice: స్వరం
  rationale: కోల్ అనే పదానికి ‘స్వరం’ అని ఇవ్వడం వల్ల 29వ కీర్తనలో పునరావృతమయ్యే వ్యక్తిగతమైన, కవితాత్మకమైన పల్లవి నిలుస్తుంది; ‘శబ్దం’ కంటే ఇది యెహోవా క్రియాశీల పలుకును మరింత స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: יָחִיל
  choice: కంపింపజేస్తుంది / కంపింపజేస్తాడు
  rationale: חול పదం హిఫీల్ రూపంలో కంపించేలా చేయడం, వణికించడం లేదా మెలికలు తిరిగేలా చేయడం అనే భావాలు కలిగి ఉంది. అరణ్యం కర్మగా ఉన్న ఈ సందర్భంలో ‘కంపింపజేయడం’ సహజంగా, బలంగా ఉంటుంది; క్రియకు ఉన్న ప్రత్యామ్నాయ చిత్రణను పాదసూచికలో ఉంచాం.
- source_word: מִדְבָּר
  choice: అరణ్యం
  rationale: మిద్బార్ అనేది కేవలం ఇసుక ఎడారినే కాక జనావాసం లేదా సాగు లేని విశాల ప్రదేశాన్ని సూచించగలదు; అందువల్ల ‘అరణ్యం’ విస్తృత భౌగోళిక భావాన్ని కాపాడుతుంది.
- source_word: מִדְבַּר קָדֵשׁ
  choice: కాదేషు అరణ్యం
  rationale: హీబ్రూ సమాస సంబంధాన్ని తెలుగులో సహజమైన ‘కాదేషు అరణ్యం’గా ఇచ్చాం. కాదేషు స్థలనామం కావున అనువదించకుండా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో బిరుదు కాక దైవనామమే ఉంది. కాబట్టి దానిని ‘ప్రభువు’గా మార్చకుండా వ్యక్తినామంగా నిలిపాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’ను ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గంభీరమైన కవితా శైలిని వాడాం. మొదటి పాదంలో కర్త ‘స్వరం’ కావడంతో ‘కంపింపజేస్తుంది’, రెండవ పాదంలో కర్త ‘యెహోవా’ కావడంతో ‘కంపింపజేస్తాడు’ అని తెలుగు వ్యాకరణానుసారం భేదం చూపాం; హీబ్రూ పునరుక్తి, సమాంతర నిర్మాణం నిలిపాం.
