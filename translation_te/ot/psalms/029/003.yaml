  text: ק֥וֹל יְהוָ֗ה עַל הַ֫/מָּ֥יִם אֵֽל הַ/כָּב֥וֹד הִרְעִ֑ים יְ֝הוָ֗ה עַל מַ֥יִם רַבִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/003.yaml
  text: The voice of Yahweh is over the waters[a]; the God of glory thunders[b], Yahweh is over many waters.
translation:
  language: te
  text: యాహ్వే స్వరం జలాలపై ఉంది; మహిమగల దేవుడు[a] ఉరుముతున్నాడు,[b] అనేక జలాలపై యాహ్వే ఉన్నాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘మహిమ యొక్క దేవుడు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఉరిమాడు.’ హెబ్రీ క్రియను పూర్తయిన చర్యగా కూడా అనువదించవచ్చు.
    reason: verbal_aspect
  - marker: c
    text: హెబ్రీలో అక్షరార్థంగా, ‘అనేక జలాలపై యాహ్వే’; స్పష్టత కోసం ‘ఉన్నాడు’ చేర్చబడింది.
