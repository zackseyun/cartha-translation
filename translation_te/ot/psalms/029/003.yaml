lexical_decisions:
- source_word: קוֹל
  choice: స్వరం
  rationale: కీర్తన అంతటా పునరావృతమయ్యే ‘యాహ్వే స్వరం’ అనే వ్యక్తిగత, కవితాత్మక రూపకాన్ని నిలుపుతుంది; కేవలం ‘శబ్దం’ అని అనువదిస్తే ఆ భావబలం తగ్గుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- source_word: עַל הַמָּיִם
  choice: జలాలపై
  rationale: סערతుఫాను దృశ్యంలో నీళ్లకు పైన లేదా వాటిమీద వ్యాపించే స్వరాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֵל הַכָּבוֹד
  choice: మహిమగల దేవుడు
  rationale: అక్షరార్థమైన ‘మహిమ యొక్క దేవుడు’ అనే హెబ్రీ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; మూల నిర్మాణాన్ని పాదసూచికలో ఉంచింది.
- source_word: הִרְעִים
  choice: ఉరుముతున్నాడు
  rationale: רעם ధాతువు యొక్క ‘ఉరుము’ భావాన్ని స్పష్టంగా నిలుపుతూ, కీర్తనలో సాగుతున్న సజీవ వర్ణనకు తెలుగు వర్తమాన రూపం సరిపోతుంది.
- source_word: מַיִם רַבִּים
  choice: మహా జలాలు
  rationale: విస్తారమైన లేదా అపారమైన జలాలను సూచించే హెబ్రీ కవితా ప్రయోగాన్ని సంక్షిప్తంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉన్నందున దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించింది.
- issue: ఉరుమును దేవుని స్వరంగా చిత్రించే కవితాత్మక రూపకం
  choice: ‘స్వరం’ మరియు ‘ఉరుముతున్నాడు’ రెండింటినీ నిలుపడం
  alternative: ‘యాహ్వే ఉరుము జలాలపై ఉంది’ అని ఒకే వాతావరణ వర్ణనగా మార్చడం
  rationale: కీర్తన ఉరుమును యాహ్వే స్వరంతో ఉద్దేశపూర్వకంగా అనుసంధానిస్తుంది; దాని విధానాన్ని అదనంగా వివరించకుండా ఆ దైవిక-కవితాత్మక ఉద్వేగాన్ని నిలుపుతుంది.
- issue: చివరి నామవాచక వాక్యంలో క్రియ లేకపోవడం
  choice: తెలుగులో స్పష్టత కోసం ‘ఉన్నాడు’ చేర్చడం
  alternative: ‘మహా జలాలపై యాహ్వే’
  rationale: మసొరా విరామచిహ్నాలు చివరి భాగాన్ని ప్రత్యేక సమాంతర వాక్యంగా చదవడానికి అనుకూలిస్తాయి; చేర్చిన క్రియను పాదసూచికలో స్పష్టం చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తనా కవిత్వానికి తగిన గంభీరతను నిలిపింది. ‘జలాలు,’ ‘మహిమ,’ ‘ఉరుముతున్నాడు’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యే సాహిత్య రిజిస్టర్‌లో ఉన్నాయి; వాక్యంలోని మూడు సమాంతర భాగాలు నిలుపబడ్డాయి.
