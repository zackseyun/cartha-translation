  text: A psalm of David. Ascribe to Yahweh[a], O sons of God, ascribe to Yahweh glory and strength.
translation:
  language: te
  text: 'దావీదు కీర్తన.


    యాహ్వేకు ఆపాదించండి, దేవుని కుమారులారా;

    యాహ్వేకు మహిమను, బలాన్ని ఆపాదించండి.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: దావీదు కీర్తన
  rationale: కీర్తన శీర్షికకు సహజమైన తెలుగు రూపం. לְ ఉపసర్గ సూచించగల రచన, సంబంధం లేదా అంకితం అనే భావాల్లో ఒక్కదానిని స్పష్టంగా నిర్ణయించకుండా సంక్షిప్తంగా ఉంచుతుంది.
- source_word: הָבוּ
  choice: ఆపాదించండి
  rationale: ఇక్కడ భౌతికంగా ఇవ్వడం కాక, యాహ్వేకు చెందిన మహిమను, బలాన్ని గుర్తించి ప్రకటించడం భావం. ‘ఆపాదించండి’ ఆ కవితాత్మక ఆజ్ఞను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హెబ్రీ మూలంలోని దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించింది.
- source_word: בְּנֵי אֵלִים
  choice: దేవుని కుమారులారా
  rationale: హెబ్రీ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ సంబోధనను సహజమైన తెలుగులో అందిస్తుంది. אֵלִים అర్థంలోని అనిశ్చితిని పాదటిప్పణి వివరిస్తుంది.
- source_word: כָּבוֹד וָעֹז
  choice: మహిమను, బలాన్ని
  rationale: రెండు నామపదాల కవితాత్మక సమాంతరతను, సాధారణ బైబిలు పదజాలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠ్యంలో ఉన్న ఒడంబడిక నామాన్ని ప్రత్యక్షంగా చూపడానికి ‘యాహ్వే’ వాడబడింది; దానిని ఒక బిరుదుగా మార్చలేదు.
- issue: בְּנֵי אֵלִים ఎవరిని సూచిస్తుంది
  choice: దేవుని కుమారులారా
  alternative: దేవతల కుమారులారా; పరలోక జీవులారా
  rationale: ఈ పదబంధం బహుశా పరలోక సభలోని జీవులను సూచించినా, אֵלִים రూపం వల్ల ఉన్న పదార్థ సంబంధమైన అనిశ్చితిని ప్రధాన పాఠ్యం పూర్తిగా పరిష్కరించదు; ప్రత్యామ్నాయాలు పాదటిప్పణిలో ఇవ్వబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని వాడింది. మూలంలోని పునరుక్తిని నిలిపింది; అర్థాన్ని సిద్ధాంతపరంగా విస్తరించకుండా సాధారణ పాఠకుడికి అర్థమయ్యే పదాలను ఎంచుకుంది.
