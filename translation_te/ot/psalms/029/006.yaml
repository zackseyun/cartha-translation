translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితా గాంభీర్యాన్ని నిలుపుకుంటూనే సాధారణ పాఠకులకు స్పష్టంగా ఉండే నిర్మాణం వాడాం. హీబ్రూ వాక్యంలోని ముందస్తు బహువచన సర్వనామాన్ని యథాతథంగా ఉంచితే తెలుగులో అస్పష్టత కలగవచ్చు కాబట్టి, రెండు సమాంతర పాదాల్లో స్థలనామాలను ప్రత్యక్ష కర్మలుగా చూపాం. ‘గంతులు వేయిస్తాడు’ కారక క్రియను, జీవంతమైన కవితా చిత్రాన్ని రెండింటినీ కాపాడుతుంది.
