source:
  edition: WLC
  text: וַ/יַּרְקִידֵ֥/ם כְּמוֹ עֵ֑גֶל לְבָנ֥וֹן וְ֝/שִׂרְיֹ֗ן כְּמ֣וֹ בֶן רְאֵמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/006.yaml
  text: He makes Lebanon skip like a calf[c][b][a], and Sirion like a young wild ox.
translation:
  language: te
  text: ఆయన లెబానోనును దూడలా గంతులు వేయిస్తాడు; సిర్యోనును[a] అడవి ఎద్దు పిల్లలా[b] గంతులు వేయిస్తాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సిర్యోను అనేది హెర్మోను పర్వతానికి మరో పేరు.
    reason: cross_reference
  - marker: b
    text: లేదా, “ఎద్దు పిల్లలా.” హీబ్రూ పదబంధానికి అక్షరార్థం “అడవి ఎద్దుల కుమారునిలా”; ఇది అడవి ఎద్దు పిల్లను సూచించే జాతీయ ప్రయోగం.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఆయన వాటిని దూడలా గంతులు వేయిస్తాడు—లెబానోనును, సిర్యోనును అడవి ఎద్దు పిల్లలా.” హీబ్రూలో మొదట “వాటిని” అనే బహువచన సర్వనామం వచ్చి, తరువాత లెబానోను, సిర్యోను పేర్లు వస్తాయి.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיַּרְקִידֵם
  choice: గంతులు వేయిస్తాడు
  rationale: רקד హిఫీల్ రూపం ‘గంతులు వేయించడం/ఎగిరేలా చేయడం’ అనే కారక భావాన్ని ఇస్తుంది. దూడ, అడవి ఎద్దు పిల్ల ఉపమానాలకు ‘గంతులు వేయిస్తాడు’ సహజంగా సరిపోతుంది. హీబ్రూలోని బహువచన కర్మప్రత్యయాన్ని కవితా సమాంతరతలో లెబానోను, సిర్యోను అనే పేర్లతో స్పష్టం చేశాం.
- source_word: כְּמוֹ עֵגֶל
  choice: దూడలా
  rationale: עֵגֶל సాధారణంగా దూడను లేదా చిన్న వయస్సు గల గోవును సూచిస్తుంది; చురుకుగా గంతులు వేసే చిత్రాన్ని ‘దూడలా’ సహజంగా అందిస్తుంది.
- source_word: לְבָנוֹן
  choice: లెబానోను
  rationale: మూలంలోని స్థలనామాన్ని తెలుగు లిప్యంతరీకరణలో నిలిపాం.
- source_word: וְשִׂרְיֹן
  choice: సిర్యోనును
  rationale: మూలపాఠం హెర్మోనుకు వాడిన సిర్యోను అనే పేరునే కలిగి ఉంది; దానిని అనువదించకుండా లిప్యంతరీకరించి, గుర్తింపును పాదటిప్పణిలో ఇచ్చాం.
- source_word: כְּמוֹ בֶן רְאֵמִים
  choice: అడవి ఎద్దు పిల్లలా
  rationale: בֶן ఇక్కడ ‘పిల్ల/యువ జంతువు’ అనే జాతీయ ప్రయోగం. רְאֵם ప్రస్తుత నిఘంటు ఏకాభిప్రాయం ప్రకారం అడవి ఎద్దును సూచిస్తుంది. ఈ పదబంధం మూలంలోని యౌవన భావాన్నీ జంతు గుర్తింపునూ కాపాడుతుంది.
