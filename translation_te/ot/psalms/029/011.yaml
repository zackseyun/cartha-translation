source:
  edition: WLC
  text: יְֽהוָ֗ה עֹ֭ז לְ/עַמּ֣/וֹ יִתֵּ֑ן יְהוָ֓ה יְבָרֵ֖ךְ אֶת עַמּ֣/וֹ בַ/שָּׁלֽוֹם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/011.yaml
  text: Yahweh gives strength to his people[b][a]; Yahweh blesses his people with peace.
translation:
  language: te
  text: యాహ్వే తన ప్రజలకు బలాన్ని ఇస్తాడు[a]; యాహ్వే తన ప్రజలను శాంతితో[b] దీవిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అసంపూర్ణ క్రియారూపాలను భవిష్యత్ భావంతో కూడా అర్థం చేసుకోవచ్చు: “యాహ్వే తన ప్రజలకు బలాన్ని ఇస్తాడు; యాహ్వే తన ప్రజలను శాంతితో దీవిస్తాడు.”'
    reason: alternative_reading
  - marker: b
    text: “శాంతి” అని అనువదించిన హీబ్రూ పదం షాలోమ్; దీనిలో సంపూర్ణ క్షేమం, సౌఖ్యం అనే భావాలు కూడా ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: עֹז
  choice: బలం
  rationale: ఈ నామవాచకం బలం, శక్తి అనే భావాన్ని ఇస్తుంది; ‘ఇస్తాడు’ అనే క్రియతో ‘బలం’ సహజంగా ఉండి కీర్తనలోని దైవశక్తి అంశాన్ని నిలుపుతుంది.
- source_word: לְעַמּוֹ
  choice: తన ప్రజలకు
  rationale: לְ ఇక్కడ పరోక్ష కర్మను సూచిస్తుంది; మూడవ పురుష కర్తను సహజ తెలుగులో తిరిగి సూచించేందుకు ‘తన’ వాడాం.
- source_word: יִתֵּן
  choice: ఇస్తాడు
  rationale: హీబ్రూ అసంపూర్ణ క్రియకు భవిష్యత్ భావం సాధ్యమైనా, కవితాత్మక ముగింపులో దేవుని లక్షణాత్మక కార్యాన్ని ప్రకటించే వర్తమానార్థం సహజంగా సరిపోతుంది.
- source_word: יְבָרֵךְ
  choice: దీవిస్తాడు
  rationale: మొదటి పాదానికి సమాంతరంగా దేవుడు తన ప్రజల పట్ల చేసే కార్యాన్ని నిశ్చయంగా ప్రకటించే రూపాన్ని ఎంచుకున్నాం; భవిష్యత్ భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: אֶת עַמּוֹ
  choice: తన ప్రజలను
  rationale: ప్రత్యక్ష కర్మసూచకంతో వచ్చిన పదబంధాన్ని ప్రత్యక్ష కర్మగా అనువదించాం; హీబ్రూ సమాంతరతను నిలుపేందుకు ‘తన ప్రజలు’ అనే మాటను పునరావృతం చేశాం.
- source_word: בַשָּׁלוֹם
  choice: శాంతితో
  rationale: שָׁלוֹם యొక్క ప్రధాన భావం శాంతి; దీనిలో సంపూర్ణ క్షేమం, సుభిక్షం అనే విస్తృత భావాలు కూడా ఉన్నందున వాటిని పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో మార్చకుండా నిలిపాం. తెలుగు బైబిలు వాడుకలో సాధారణ పాఠకులకు బాగా పరిచయమైన రూపం ‘యెహోవా’; మూల ఉచ్చారణకు దగ్గరగా భావించే ‘యాహ్వే’ కూడా సాధ్యమైన లిప్యంతరీకరణ.
- issue: יִתֵּן / יְבָרֵךְ క్రియల కాల/భావ విలువ
  choice: 'వర్తమాన లక్షణాత్మక ప్రకటన: ‘ఇస్తాడు ... దీవిస్తాడు’'
  alternative: 'భవిష్యత్ నిశ్చయార్థం: ‘ఇస్తాడు/ఇవ్వనున్నాడు ... దీవిస్తాడు/దీవించనున్నాడు’; లేదా ఆశీర్వాద ఆకాంక్ష'
  rationale: ఈ కవితాత్మక ముగింపులో అసంపూర్ణ క్రియారూపాలు దేవుని నిరంతర లేదా లక్షణాత్మక కార్యాన్ని నిశ్చయంగా ప్రకటించగలవు. భవిష్యత్ భావం నిజమైన ప్రత్యామ్నాయం కాబట్టి పాదసూచికలో ఇచ్చాం; ఆకాంక్షార్థం వ్యాకరణపరంగా సాధ్యమైనా సందర్భంలో ప్రకటనార్థం బలంగా కనిపిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రకటన శైలిని వాడాం. హీబ్రూ రెండు పాదాల సమాంతరతను ‘యెహోవా తన ప్రజలకు/తన ప్రజలను’ అనే పునరుక్తితో నిలిపాం. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠంలో ఉన్నాయి.
