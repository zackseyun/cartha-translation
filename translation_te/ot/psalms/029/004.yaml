id: PSA.29.4
reference: Psalms 29:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: קוֹל יְהוָ֥ה בַּ/כֹּ֑חַ ק֥וֹל יְ֝הוָ֗ה בֶּ/הָדָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/004.yaml
  text: The voice of Yahweh is powerful[b][a]; the voice of Yahweh is majestic.
translation:
  language: te
  text: యాహ్వే[a] స్వరం శక్తిమంతమైనది[b]; యాహ్వే స్వరం మహిమాన్వితమైనది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో YHWH; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘యాహ్వే స్వరం శక్తితో ఉంది; యాహ్వే స్వరం వైభవంతో ఉంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: స్వరం
  rationale: ఈ పదానికి ‘స్వరం’ లేదా ‘శబ్దం’ అనే అర్థాలు రావచ్చు. ఈ కీర్తనలో పునరావృతమయ్యే సూత్రంలో వ్యక్తిగతంగా, క్రియాశీలంగా వినిపించే యాహ్వే ఉచ్చారణను నిలుపుకోవడానికి ‘స్వరం’ అనేది తగినది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామం YHWHను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ శాస్త్రీయ ఉచ్చారణకు అనుగుణంగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- source_word: בַּכֹּחַ
  choice: శక్తిమంతమైనది
  rationale: בְּ ఉపసర్గతో కూడిన ‘శక్తి’ అనే నామవాచక నిర్మాణం ‘శక్తితో/శక్తిలో’ అని కూడా అనువదించవచ్చు. ప్రధాన పాఠంలో సహజమైన ఆధునిక తెలుగు కోసం దాని వివరణాత్మక భావాన్ని ‘శక్తిమంతమైనది’గా ఇచ్చి, మూల నిర్మాణాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: הָדָר
  choice: మహిమాన్వితమైనది
  rationale: הָדָרకు మహిమ, వైభవం, రాజసమైన శోభ అనే భావాలున్నాయి. కీర్తనలోని రాజోచిత దైవప్రత్యక్ష స్వరానికి ‘మహిమాన్వితమైనది’ సహజంగా సరిపోతుంది; ‘వైభవంతో ఉంది’ అనే నిర్మాణాత్మక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో సూచించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా ఇవ్వడం మూలపాఠాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: בְּ + నామవాచక నిర్మాణాల భావం
  choice: శక్తిమంతమైనది; మహిమాన్వితమైనది
  alternative: శక్తితో ఉంది; వైభవంతో ఉంది
  rationale: ఈ ఉపసర్గ నిర్మాణాలు వివరణాత్మకంగానో, ‘తో/లో’ అనే భావంతోనో గ్రహించవచ్చు. ప్రధాన పాఠంలో సహజమైన తెలుగు విశేషణ రూపాలను ఎంచుకుని, నిజమైన వ్యాకరణ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా వాక్యనిర్మాణం వాడాం. రెండు సమాంతర పాదాల్లో ‘యాహ్వే స్వరం’ అనే పునరుక్తిని నిలుపుకున్నాం.
