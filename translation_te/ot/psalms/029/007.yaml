  edition: WLC
  text: קוֹל יְהוָ֥ה חֹצֵ֗ב לַהֲב֥וֹת אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/007.yaml
  text: The voice of Yahweh hews out flames of fire[a].
translation:
  language: te
  text: యాహ్వే స్వరం అగ్నిజ్వాలలను చెక్కుచున్నది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అగ్ని మెరుపులు”; కీర్తనలోని తుఫాను-దైవప్రత్యక్షత చిత్రణలో ఇది మెరుపులను సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: స్వరం
  rationale: ‘స్వరం’ అనే పదం మూలంలోని ‘గొంతు/ధ్వని’ భావాన్ని సహజంగా అందిస్తూ, కీర్తన అంతటా పునరావృతమయ్యే యెహోవా శక్తిమంతమైన పలుకును నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపుపొందిన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా అందించాం.
- source_word: חֹצֵב
  choice: చీల్చి వెలువరించును
  rationale: ఈ క్రియకు ‘చెక్కడం, నరికి విడదీయడం, చీల్చి తీయడం’ అనే బలమైన భౌతిక భావం ఉంది. అగ్నిజ్వాలలు మెరుపులవలె చీలి వెలువడే కవితాత్మక చిత్రాన్ని తెలుగులో సహజంగా నిలపడానికి ఈ పదబంధం ఎంచుకున్నాం.
- source_word: לַהֲבוֹת
  choice: జ్వాలలను
  rationale: బహువచన నామవాచకానికి ప్రత్యక్ష అర్థం ‘జ్వాలలు’; తుఫాను సందర్భంలో ఇది అగ్నివంటి మెరుపులను సూచించవచ్చు, అయితే ఆ సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో నిర్బంధించలేదు.
- source_word: אֵשׁ
  choice: అగ్ని
  rationale: మూలపదానికి నేరమైన అర్థం ‘అగ్ని’. ‘అగ్నిజ్వాలలు’ అనే సమాసం హెబ్రీలోని బలమైన ‘అగ్ని జ్వాలలు’ చిత్రాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: తుఫాను-దైవప్రత్యక్షత చిత్రంలో దైవ కార్యసాధకత్వాన్ని నిలుపుతూ, దానిని ఆధునిక వాతావరణ వివరణగా అతిగా నిర్దిష్టం చేయకపోవడం
  choice: ‘యెహోవా స్వరం అగ్నిజ్వాలలను చీల్చి వెలువరించును’ అని సజీవమైన కవితాత్మక చిత్రాన్ని ప్రధాన పాఠ్యంలో ఉంచడం.
  alternative: ‘యెహోవా స్వరం అగ్నిమెరుపులను విరజిమ్మును’ అని మెరుపును స్పష్టంగా పేర్కొనడం.
  rationale: మూలంలో ‘జ్వాలలు’ అనే concrete చిత్రం ఉంది; కీర్తన తుఫాను సందర్భం కారణంగా మెరుపు భావం సంభావ్యమైనా, దానినే ఏకైక అర్థంగా ప్రధాన పాఠ్యంలో నిర్ణయించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తనా కవిత్వానికి తగిన గంభీరత కోసం ‘వెలువరించును’ రూపాన్ని వాడాం. ‘చీల్చి వెలువరించును’ మూలక్రియ యొక్క దృశ్యబలాన్ని, అలాగే జ్వాలలు/మెరుపులపై ఉన్న ఉద్దేశపూర్వక భావవిస్తృతిని కాపాడుతుంది.
