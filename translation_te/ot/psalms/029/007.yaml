revisions:
- from: యెహోవా స్వరం అగ్నిజ్వాలలను చీల్చి వెలువరించును[a].
  to: యాహ్వే స్వరం అగ్నిజ్వాలలను చెక్కుచున్నది[a].
  rationale: The revision retains the Hebrew's concrete and unusual image—Yahweh's voice 'hewing' flames of fire—without adding an explicit result or making lightning the sole main-text meaning. The footnote preserves the plausible storm-contextual sense. The divine name is aligned with the source-oriented POB rendering policy.
  reviewer_model: gpt-5.6-terra
