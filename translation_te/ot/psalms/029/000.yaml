source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד הָב֣וּ לַֽ֭/יהוָה בְּנֵ֣י אֵלִ֑ים הָב֥וּ לַ֝/יהוָ֗ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/000.yaml
  text: A psalm of David. Ascribe to Yahweh[a], sons of the mighty, ascribe to Yahweh glory and strength.
translation:
  language: te
  text: 'దావీదు కీర్తన.


    దేవపుత్రులారా[a], యెహోవాకు ఆపాదించండి;

    మహిమను, బలాన్ని యెహోవాకు ఆపాదించండి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బలవంతుల కుమారులారా’; భావానువాదంగా ‘పరలోక జీవులారా.’ ఈ హెబ్రీ పదబంధం బహుశా పరలోక సభ సభ్యులను సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: దావీదు కీర్తన
  rationale: లְ అనే సంబంధ సూచకానికి ‘దావీదుకు చెందిన/దావీదు రచించిన’ అనే విస్తృత భావాన్ని సహజమైన తెలుగు శీర్షికలో ఉంచుతుంది; రచయితత్వాన్ని అవసరానికి మించి వివరించదు.
- source_word: הָבוּ
  choice: ఆపాదించండి
  rationale: ఇక్కడ ‘ఇవ్వండి’ అనే అక్షరార్థం కంటే, మహిమ మరియు బలం యెహోవావని గుర్తించి ప్రకటించాలనే ఆరాధనా భావాన్ని ‘ఆపాదించండి’ స్పష్టంగా తెలియజేస్తుంది; మూలంలోని పునరుక్తిని కూడా నిలుపుతుంది.
- source_word: בְּנֵי אֵלִים
  choice: దేవపుత్రులారా
  rationale: పదబంధంలోని ‘కుమారులు’ రూపకాన్ని నిలుపుతూ, సంబోధనను స్పష్టంగా చూపుతుంది. ఇది పరలోక సభలోని జీవులను సూచించే అవకాశం ఉన్నప్పటికీ, మూలంలోని పదబంధాన్ని ప్రధాన పాఠ్యంలో సూటిగా ఉంచి ప్రత్యామ్నాయ భావాలను పాదసూచికలో తెలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలోని దేవుని ప్రత్యేక నామమైన నాలుగు అక్షరాల నామాన్ని సాధారణ బిరుదుతో మార్చకుండా తెలుగు సంప్రదాయ లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: כָּבוֹד וָעֹז
  choice: మహిమను, బలాన్ని
  rationale: రెండు నామవాచకాలనూ విడిగా, వాటి సాధారణ అర్థాలతో అనువదించి మూలంలోని జంట భావాన్ని నిలిపాం.
theological_decisions:
- issue: בְּנֵי אֵלִים ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘దేవపుత్రులారా’
  alternative: ‘బలవంతుల కుమారులారా’ లేదా ‘పరలోక జీవులారా’
  rationale: ఈ పదబంధం దేవుని పరలోక సభ సభ్యులను సూచించే అవకాశం ఎక్కువ. అయినా ‘పరలోక జీవులు’ అనేది వివరణాత్మక అనువాదం; ‘బలవంతుల కుమారులు’ మరో సాధ్యమైన పదార్థం. అందువల్ల మూలంలోని నిజమైన అస్పష్టతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కీర్తనా శైలిని వాడాం. మూలంలోని రెండుసార్ల ఆజ్ఞను, ‘యెహోవా’ నామాన్ని, ‘మహిమ—బలం’ జంటను నిలిపాం. ‘ఆపాదించండి’ కొద్దిగా ఉన్నత శైలికి చెందినదైనా, ‘మహిమను, బలాన్ని’ యెహోవావిగా గుర్తించాలనే భావాన్ని ‘ఇవ్వండి’ కంటే స్పష్టంగా తెలియజేస్తుంది.
