source:
  edition: WLC
  text: ק֣וֹל יְ֭הוָה שֹׁבֵ֣ר אֲרָזִ֑ים וַ/יְשַׁבֵּ֥ר יְ֝הוָ֗ה אֶת אַרְזֵ֥י הַ/לְּבָנֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/005.yaml
  text: The voice of Yahweh breaks cedars[b][a]; Yahweh shatters the cedars of Lebanon.
translation:
  language: te
  text: యాహ్వే స్వరం[a] దేవదారు వృక్షాలను విరగగొడుతుంది; యాహ్వే లెబానోనులోని దేవదారు వృక్షాలను చిన్నాభిన్నం చేస్తాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే శబ్దం.” హీబ్రూ קוֹל అనే పదానికి “స్వరం” లేదా “శబ్దం” అనే అర్థాలు ఉండవచ్చు. ఈ కీర్తనలో యాహ్వే యొక్క వ్యక్తిగతమైన, ఉరుమువంటి పలుకును చిత్రించే పునరుక్తిని నిలుపుకోవడానికి “స్వరం” అని అనువదించాం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలపాఠం రెండు భాగాల్లోనూ “విరగగొట్టు” అనే ఒకే ధాతువును ఉపయోగిస్తుంది. రెండవ భాగంలో ఆ ధాతువు పియేల్ రూపంలో ఉంది; దాని తీవ్రతను, కవితాత్మక సమాంతరతను తెలియజేయడానికి ఇక్కడ “చిన్నాభిన్నం చేస్తాడు” అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל יְהוָה
  choice: యాహ్వే స్వరం
  rationale: קוֹל అనే పదానికి ‘స్వరం’ లేదా ‘శబ్దం’ అనే అర్థాలు ఉండవచ్చు. కీర్తన అంతటా పునరావృతమయ్యే వ్యక్తిగతమైన, ఉరుమువంటి దైవిక పలుకును నిలుపుకోవడానికి ‘స్వరం’ ఎంచుకోబడింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు అనుగుణంగా తెలుగులో ‘యాహ్వే’ అని లిప్యంతరీకరించబడింది.
- source_word: שֹׁבֵר
  choice: విరగగొడుతుంది
  rationale: Qal కృదంతం ఇక్కడ సజీవమైన వర్తమాన కార్యాన్ని తెలియజేస్తుంది. ‘విరగగొడుతుంది’ అనేది దేవదారు వృక్షాలపై స్వరం చూపే బలాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲרָזִים
  choice: దేవదారు వృక్షాలను
  rationale: బహువచన నామవాచకం cedar చెట్లను సాధారణంగా సూచిస్తుంది; తెలుగులో స్పష్టత కోసం ‘వృక్షాలు’ చేర్చబడింది.
- source_word: וַיְשַׁבֵּר
  choice: చిన్నాభిన్నం చేస్తాడు
  rationale: మూలంలో ముందటి క్రియకే చెందిన שבר ధాతువు మరింత బలమైన రూపంలో పునరావృతమవుతుంది. ‘చిన్నాభిన్నం చేస్తాడు’ అనే ప్రయోగం ఆ కవితాత్మక తీవ్రతను సహజమైన తెలుగులో ప్రతిబింబిస్తుంది; దీనిని గతకాలంగా కాక సమాంతర వర్తమాన కార్యంగా అనువదించాం.
- source_word: אֶת אַרְזֵי הַלְּבָנוֹן
  choice: లెబానోను దేవదారు వృక్షాలను
  rationale: ఈ నిర్మాణం లెబానోనుతో ప్రసిద్ధిగా అనుబంధించబడిన దేవదారు వృక్షాలను సూచిస్తుంది. తెలుగు వాక్యక్రమానికి అనుగుణంగా సహజంగా అమర్చబడింది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: వచనంలో బిరుదు కాక దేవుని వ్యక్తిగత నామమైన יהוה నేరుగా ఉంది. అందువల్ల దానిని ‘ప్రభువు’ అని మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలపాఠాన్ని స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా ధోరణి పాటించబడింది. ‘స్వరం’, ‘విరగగొడుతుంది’, ‘చిన్నాభిన్నం చేస్తాడు’ అనే పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని సమాంతరతను మరియు పెరుగుతున్న తీవ్రతను నిలుపుతాయి.
