  variant: modern standard Telugu
source:
  edition: WLC
  text: הָב֣וּ לַֽ֭/יהוָה כְּב֣וֹד שְׁמ֑/וֹ הִשְׁתַּחֲו֥וּ לַ֝/יהוָ֗ה בְּ/הַדְרַת קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/002.yaml
  text: Ascribe to Yahweh the glory of his name[a]; worship Yahweh in holy splendor.
translation:
  language: te
  text: యాహ్వేకు ఆయన నామ మహిమను చెల్లించండి; పరిశుద్ధ శోభలో[a] యాహ్వేను ఆరాధించండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరిశుద్ధత యొక్క శోభలో’; మరో విధంగా, ‘పరిశుద్ధ వస్త్రధారణతో.’
    reason: హీబ్రూ בְּהַדְרַת קֹדֶשׁ అనే పదబంధం ఒక గుణాన్ని లేదా ఆరాధనా వస్త్రధారణను సూచించగలదు; మూలంలోని నిజమైన అస్పష్టతను తెలియజేయడానికి ప్రత్యామ్నాయాలను ఇచ్చాం.
lexical_decisions:
- source_word: הָבוּ
  choice: చెల్లించండి
  rationale: ఇది బహువచన ఆజ్ఞ. ఇక్కడ భౌతికంగా ఏదైనా ఇవ్వడం కంటే యాహ్వేకు మహిమను అర్పించడం లేదా ఆయనకు చెందవలసిన ఘనతను ప్రకటించడం అనే ఆరాధనా భావం ఉంది. ‘చెల్లించండి’ ఆ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: ל అనే ఉపసర్గ ఆజ్ఞకు పరోక్ష కర్మను సూచిస్తుంది. יְהוָה అనే దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- source_word: כְּבוֹד שְׁמוֹ
  choice: ఆయన నామ మహిమను
  rationale: హీబ్రూ నిర్మాణంలోని ‘ఆయన నామపు మహిమ’ అనే సన్నిహిత అర్థాన్ని నిలుపుతూ, దేవుని వెల్లడైన గుర్తింపు మరియు కీర్తితో ముడిపడిన మహిమను సూచిస్తుంది. ‘తగిన’ అని చేర్చి భావాన్ని మరీ స్పష్టీకరించకుండా మూలంలోని సంక్షిప్తతను కాపాడాం.
- source_word: הִשְׁתַּחֲווּ
  choice: ఆరాధించండి
  rationale: మూల క్రియకు శరీరాన్ని వంచి సాష్టాంగపడటం అనే ప్రత్యక్ష భావం ఉన్నప్పటికీ, యాహ్వేను ఉద్దేశించిన ఈ ఆరాధనా సందర్భంలో ‘ఆరాధించండి’ సహజంగా ఉద్దేశాన్ని తెలియజేస్తుంది.
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: పరిశుద్ధ శోభలో
  rationale: ఈ కఠినమైన కవితా పదబంధం ‘పరిశుద్ధత యొక్క శోభలో’ లేదా ‘పరిశుద్ధ వస్త్రధారణతో’ అని అర్థమవవచ్చు. ‘పరిశుద్ధ శోభలో’ దాని కవితాత్మకతను, ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం చతురక్షర దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు అనుగుణంగా ‘యాహ్వే’ అని ఇచ్చాం.
- issue: בְּהַדְרַת קֹדֶשׁ యొక్క భావం
  choice: పరిశుద్ధ శోభలో
  alternative: పరిశుద్ధత యొక్క శోభలో; పరిశుద్ధ వస్త్రధారణతో
  rationale: ఈ పదబంధం పరిశుద్ధత అనే గుణాన్ని, ఆరాధనా వైభవాన్ని, లేదా పవిత్ర వస్త్రధారణను సూచించవచ్చు. ప్రధాన పాఠం ఏ ఒక్క అర్థానికీ పరిమితం కాకుండా కవితాత్మకమైన విస్తృతిని నిలుపుతుంది; ప్రత్యామ్నాయాలను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ఆరాధనా శైలిని ఉపయోగించాం. బహువచన ఆజ్ఞలకు గౌరవప్రదమైన ‘-ండి’ రూపాన్ని వాడాం. సమాంతర కవితా నిర్మాణాన్ని అర్ధవిరామంతో నిలిపాం.
