base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/009.yaml
  text: The voice of Yahweh makes the deer give birth and strips the forests bare[a], and in his temple all say[b], “Glory!”
translation:
  language: te
  text: 'యెహోవా స్వరం ఆడజింకలు ప్రసవించేలా చేస్తుంది,

    అడవులను బట్టబయలు చేస్తుంది.[a]


    ఆయన ఆలయంలో[b] ఉన్నవారందరూ, “మహిమ!” అంటారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆడజింకలు మెలికలు తిరిగేలా చేస్తుంది,” లేదా “ఆడజింకలు ప్రసవవేదనతో మెలికలు తిరిగేలా చేస్తుంది.”
    reason: lexical_alternative
  - marker: b
    text: “ఆలయం” అని అనువదించిన హీబ్రూ పదానికి “రాజభవనం” అనే అర్థం కూడా రావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ק֤וֹל יְהוָ֨ה
  choice: యెహోవా స్వరం
  rationale: దైవనామాన్ని వ్యక్తినామంగానే ఉంచి, హీబ్రూ సమాస నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేసింది.
- source_word: יְחוֹלֵ֣ל
  choice: ఈనేటట్లు చేస్తుంది
  rationale: חול అనే క్రియ ప్రసవవేదనతో మెలికలు తిరగడాన్ని లేదా ప్రసవించడాన్ని సూచించగలదు. ఆడజింకలతో ఉన్న ఈ ప్రయోగంలో ప్రసవార్థం సహజంగా సరిపోతుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: אַיָּלוֹת֮
  choice: ఆడజింకలు
  rationale: హీబ్రూ పదంలోని స్త్రీలింగ నిర్దిష్టతను తెలుగులో స్పష్టంగా నిలిపింది.
- source_word: וַֽיֶּחֱשֹׂ֪ף יְעָ֫ר֥וֹת
  choice: అడవులను బోడిగా చేస్తుంది
  rationale: חשׂף లోని ‘కప్పును తొలగించి బయటపడేలా చేయడం’ అనే బలమైన భావాన్ని తుఫాను సందర్భానికి సరిపోయే సహజమైన తెలుగు నుడికారంతో తెలిపింది.
- source_word: וּבְהֵיכָלוֹ
  choice: ఆయన ఆలయంలో
  rationale: కీర్తనలోని ఆరాధనా సందర్భం వల్ల ‘ఆలయం’ ప్రధాన పాఠంగా తీసుకుంది; ‘రాజభవనం’ అనే నిజమైన పదార్థ అవకాశాన్ని పాదసూచికలో నిలిపింది.
- source_word: כֻּלּוֹ אֹמֵר
  choice: ఉన్నవారందరూ … అంటారు
  rationale: ఏకవచన రూపంలోని సమష్టి/వితరణ భావాన్ని తెలుగులో సహజమైన బహువచన వాక్యంగా వ్యక్తం చేస్తూ, אֹמֵר అనే సాధారణ ‘చెప్పు’ క్రియకు దగ్గరగా ఉంది.
- source_word: כָּבֽוֹד
  choice: మహిమ!
  rationale: ఆరాధనలోని ఏకపద జయధ్వని స్వరూపాన్ని ఆశ్చర్యార్థక చిహ్నంతో నిలిపింది.
theological_decisions:
- issue: הֵיכָל అనే పదం యెహోవాకు సంబంధించి సూచించే స్థలం
  choice: ఆలయం
  alternative: రాజభవనం
  rationale: ‘మహిమ!’ అనే ఆరాధనా ప్రకటన ‘ఆలయం’ అనే భావానికి మద్దతిస్తుంది. అయితే ఈ కీర్తన యెహోవా రాజరికాన్ని కూడా ప్రముఖంగా చూపుతుంది; అందువల్ల ‘రాజభవనం’ అనే సాధ్యార్థాన్ని తొలగించకుండా పాదసూచికలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడింది. సమాంతర కవితా నిర్మాణాన్ని రెండు పంక్తులుగా నిలిపి, దైవ స్వరపు ప్రభావాన్ని వర్తమాన కాలంలో సజీవంగా వ్యక్తం చేసింది.
