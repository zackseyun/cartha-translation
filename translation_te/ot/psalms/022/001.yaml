source:
  edition: WLC
  text: אֵלִ֣/י אֵ֭לִ/י לָ/מָ֣ה עֲזַבְתָּ֑/נִי רָח֥וֹק מִֽ֝/ישׁוּעָתִ֗/י דִּבְרֵ֥י שַׁאֲגָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/001.yaml
  text: My God[a], my God[c][b], why have you forsaken me? Far from my salvation are the words of my roaring.
translation:
  language: te
  text: నా దేవా, నా దేవా, నన్నెందుకు విడిచిపెట్టావు? నా రక్షణ నుండి నా గర్జన మాటలు దూరంగా ఉన్నాయి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రక్షణ’ అనే పదానికి ‘విమోచనం’ లేదా ‘సహాయం’ అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఈ అర్ధపాదంలోని హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా ఉంది. దీనిని, “నా గర్జన మాటల నుండి నన్ను రక్షించడానికి నీవెందుకు దూరంగా ఉన్నావు?” అనే విస్తృత పఠనంగా కూడా అర్థం చేసుకోవచ్చు. ‘గర్జన’ ఇక్కడ తీవ్రమైన వేదనతో కూడిన ఆర్తనాదాన్ని సూచిస్తుంది.
    reason: syntactic_and_lexical_alternative
lexical_decisions:
- source_word: אֵלִי אֵלִי
  choice: నా దేవా, నా దేవా
  rationale: సంబోధనను, ‘నా’ అనే సంబంధాన్ని, వేదనతో కూడిన పునరుక్తిని యథాతథంగా నిలుపుతుంది.
- source_word: לָמָה
  choice: ఎందుకు
  rationale: కారణాన్ని ప్రశ్నించే సహజమైన ఆధునిక తెలుగు రూపం; విలాపంలోని తీవ్రతను కాపాడుతుంది.
- source_word: עֲזַבְתָּנִי
  choice: నన్నెందుకు విడిచిపెట్టావు
  rationale: עָזַב అనే క్రియలోని విడిచిపెట్టడం/త్యజించడం అనే గంభీర భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: רָחוֹק מִישׁוּעָתִי
  choice: నా రక్షణకు దూరంగా ఉన్నాయి
  rationale: హీబ్రూ వాక్యంలోని సంక్షిప్తమైన విధేయ నిర్మాణాన్ని అనవసరంగా ప్రశ్నగా మార్చకుండా నిలుపుతుంది. יְשׁוּעָה ఇక్కడ ప్రమాదం నుంచి రక్షణ లేదా విమోచనను సూచించగలదు.
- source_word: דִּבְרֵי שַׁאֲגָתִי
  choice: నా గర్జన మాటలు
  rationale: ‘నా గర్జనకు చెందిన మాటలు’ అనే నిర్మాణాన్ని సంక్షిప్తంగా అందిస్తూ, שְׁאָגָה లోని జంతువు గర్జనను తలపించే తీవ్రమైన వేదనా చిత్రాన్ని కాపాడుతుంది.
theological_decisions:
- issue: మెస్సీయ సంబంధ ప్రాధాన్యం గల కీర్తనలో יְשׁוּעָה అనువాదం
  choice: నా రక్షణ
  alternative: నా విమోచనం / నాకు సహాయం
  rationale: ఈ సందర్భంలో కీర్తనకర్త ఆశించే ప్రత్యక్ష రక్షణ ప్రధానమైనది. ‘రక్షణ’ విస్తృతమైన తెలుగు పదం; తరువాతి సిద్ధాంతార్థాన్ని బలవంతంగా చొప్పించదు. ఇతర న్యాయమైన భావాలను పాదసూచికలో ఉంచాం.
- issue: చివరి అర్ధపాదంలోని సంక్షిప్త వాక్యనిర్మాణం
  choice: నా గర్జన మాటలు నా రక్షణకు దూరంగా ఉన్నాయి
  alternative: నన్ను రక్షించడానికి, నా ఆర్తనాదపు మాటలు వినడానికి నీవెందుకు దూరంగా ఉన్నావు?
  rationale: హీబ్రూలో రెండవ ప్రశ్నార్థక పదమూ, స్పష్టమైన ‘నీవు’ కర్తయూ లేవు. అందువల్ల మూలంలోని అసాధారణమైన, ఉద్విగ్నమైన నిర్మాణాన్ని ప్రధాన పాఠంలో నిలిపి, విస్తరించి అర్థం చెప్పే సాధ్యమైన పఠనాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన విలాప శైలిని ఉపయోగించాం. ‘నా దేవా’ అనే సహజ సంబోధన, ‘విడిచిపెట్టావు’ అనే స్పష్టమైన క్రియను ఎంచుకున్నాం. చివరి అర్ధపాదం తెలుగులో కొంత అసాధారణంగా వినిపించినా, మూల హీబ్రూలోని నిజమైన సంక్షిప్తతను మరియు అర్థసందిగ్ధతను ఉద్దేశపూర్వకంగా నిలిపాం.
