source:
  edition: WLC
  text: לַ֭/מְנַצֵּחַ עַל אַיֶּ֥לֶת הַ/שַּׁ֗חַר מִזְמ֥וֹר לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/000.yaml
  text: 'For the choirmaster: according to The Doe of the Dawn[a]. A psalm of David[b].'
translation:
  language: te
  text: 'సంగీత నాయకునికి: “ఉదయకాలపు ఆడజింక”[a] ప్రకారం. దావీదు కీర్తన[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వేకువలోని ఆడజింక.” ఈ హీబ్రూ పదబంధం బహుశా ఒక బాణీ లేదా సంగీత అమరిక పేరు.
    reason: lexical_alternative
  - marker: b
    text: “దావీదు కీర్తన” అనే హీబ్రూ శీర్షిక ఆయన రచనను, దావీదుతో సంబంధాన్ని, ఆయనకు చెందిన సంకలనాన్ని, లేదా ఆయనకు అంకితాన్ని సూచించవచ్చు; వీటిలో దేనిని ఉద్దేశిస్తుందో హీబ్రూ పాఠ్యం మరింత నిర్దిష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకునికి
  rationale: కీర్తనల శీర్షికల్లో ఈ పదం సంగీత ప్రదర్శనకు నాయకత్వం వహించే వ్యక్తిని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా, దాని సంగీతపరమైన విధిని స్పష్టంగా నిలుపుతుంది.
- source_word: עַל
  choice: ప్రకారం
  rationale: ఇక్కడ ఇది రాగం, బాణీ లేదా ప్రదర్శన సూచనను పరిచయం చేసే అవకాశం ఉంది. మరింత నిర్దిష్టమైన ‘ఈ బాణీలో’ అని చెప్పకుండా మూలంలోని కొంత అనిశ్చితిని నిలుపుతుంది.
- source_word: אַיֶּלֶת הַשַּׁחַר
  choice: “ఉదయకాలపు ఆడజింక”
  rationale: אַיֶּלֶת స్త్రీలింగ ఏకవచనాన్ని ‘ఆడజింక’ ప్రతిబింబిస్తుంది. ఉల్లేఖన చిహ్నాలు దీనిని బహుశా బాణీ లేదా సంగీత అమరిక పేరుగా గుర్తిస్తాయి.
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: సంగీత సహిత గీతాన్ని సూచించే ఈ పదానికి ‘కీర్తన’ సాధారణమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: לְדָוִד
  choice: దావీదు కీర్తన
  rationale: తెలుగు కీర్తన శీర్షికలో ఇది సహజమైన రూపం. అయితే హెబ్రీయ లְ రచన, సంబంధం, సంకలనం లేదా అంకితం వంటి విస్తృత సంబంధాన్ని సూచించగలదనే అనిశ్చితిని పాదటిప్పణి స్పష్టం చేస్తుంది.
theological_decisions:
- issue: אַיֶּלֶת הַשַּׁחַר అనే పదబంధ వివరణ
  choice: కీర్తన ప్రధాన భాగంగా కాక సంగీత బాణీ లేదా అమరిక పేరుగా చూపడం
  alternative: కీర్తన భావంతో ముడిపడిన ప్రతీకాత్మక శీర్షికగా అర్థం చేసుకోవడం
  rationale: עַל తో ప్రారంభమయ్యే కీర్తన శీర్షిక నిర్మాణంలో ఇది ప్రదర్శన లేదా బాణీ సూచనగా ఉండే అవకాశం ఎక్కువ. అయినా దానిని ఖచ్చితంగా బాణీ అని ప్రధాన పాఠ్యంలో చేర్చకుండా ఉల్లేఖన చిహ్నాలు, పాదటిప్పణి ద్వారా జాగ్రత్తగా సూచించబడింది.
- issue: לְדָוִד యొక్క భావం
  choice: ‘దావీదు కీర్తన’ అనే విస్తృత సంబంధార్థక శీర్షిక
  alternative: ‘దావీదు రచించిన కీర్తన’ లేదా ‘దావీదు కోసం కీర్తన’
  rationale: కీర్తన శీర్షికల్లో לְ రచయితను మాత్రమే కాక సంబంధం, అంకితం లేదా సంకలనాన్ని కూడా సూచించవచ్చు. ప్రధాన పాఠ్యం సహజంగా ఉండేలా ఉంచి, మరీ నిర్దిష్టమైన రచయితార్థాన్ని పాదటిప్పణిలో నిర్బంధించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శీర్షికా శైలి. ‘గాన నాయకుడు’ కంటే విస్తృత సంగీత విధిని సూచించేందుకు ‘సంగీత నాయకుడు’ వాడబడింది. బాణీ పేరు కావచ్చనే భావాన్ని ఉల్లేఖన చిహ్నాలు సూచిస్తాయి; మూలంలోని అనిశ్చితి పాదటిప్పణుల్లో నిలుపబడింది.
