translation:
  language: te
  text: అనేక ఎద్దులు నన్ను చుట్టుముట్టాయి; బాషానుకు చెందిన బలశాలులైన ఎద్దులు నన్ను ఆవరించాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סְבָבוּנִי
  choice: నన్ను చుట్టుముట్టాయి
  rationale: סבב అనే క్రియ చుట్టూ చేరి ముట్టడించిన భావాన్ని ఇస్తుంది. హెబ్రీ పరిపూర్ణ క్రియారూపం వక్త ఇప్పటికే చుట్టుముట్టబడ్డ స్థితిని సూచిస్తున్నందున భూతకాల రూపాన్ని వాడాం.
- source_word: פָּרִים
  choice: ఎద్దులు
  rationale: פַּר అనే పదానికి ఎద్దు లేదా యవ్వన ఎద్దు అనే అర్థం ఉంది. ఇక్కడ బెదిరించే జంతు రూపకాన్ని సహజంగా నిలుపుతుంది.
- source_word: רַבִּים
  choice: అనేక
  rationale: ఎద్దుల సంఖ్య అధికమని తెలిపే స్పష్టమైన పరిమాణవాచకం; కవితా గంభీరతకు అనువైన రూపం.
- source_word: אַבִּירֵי
  choice: బలమైన ఎద్దులు
  rationale: אַבִּיר బలవంతులు లేదా శక్తిమంతులను సూచిస్తుంది. ముందు ఉన్న ఎద్దుల రూపకానికి అన్వయించి, అంతర్లీన నామవాచకాన్ని తెలుగులో స్పష్టంగా తెలిపాం.
- source_word: בָשָׁן
  choice: బాషాను
  rationale: స్థలనామాన్ని ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణలో నిలిపాం.
- source_word: כִּתְּרוּנִי
  choice: నన్ను ఆవరించాయి
  rationale: כתר ఇక్కడ చుట్టుముట్టడం లేదా ఆవరించడం అనే అర్థం ఇస్తుంది. మొదటి పాదంతో సమాంతరతను నిలుపుతూ పదప్రయోగంలో స్వల్ప వైవిధ్యం ఇచ్చాం.
theological_decisions:
- issue: శత్రువులను ఎద్దులుగా చిత్రించే జంతు రూపకం
  choice: ప్రధాన పాఠ్యంలో ‘ఎద్దులు’ అనే రూపకాన్ని నేరుగా నిలిపాం.
  alternative: ‘అనేక శత్రువులు నన్ను చుట్టుముట్టారు’ అని వివరణాత్మకంగా అనువదించడం.
  rationale: హెబ్రీ పాఠ్యం విరోధులను నేరుగా శత్రువులని చెప్పకుండా, బెదిరించే ఎద్దుల రూపంలో చిత్రిస్తుంది. దాన్ని వివరించి చదును చేయకుండా కవితా శక్తి మరియు వ్యాఖ్యాన స్వేచ్ఛను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తన కవిత్వానికి తగిన గంభీర శైలిని వాడాం. రెండు పాదాల సమాంతర నిర్మాణాన్ని, జంతు రూపకాన్ని నిలిపాం; హెబ్రీ క్రియారూపాల పూర్తయిన చర్య భావాన్ని తెలుగులో భూతకాలంతో వ్యక్తం చేశాం.
