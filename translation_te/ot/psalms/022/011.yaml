  text: Do not be far from me[a], for trouble is near, for there is no helper.
translation:
  language: te
  text: 'నాకు దూరంగా ఉండవద్దు;

    ఎందుకంటే ఆపద[a] దగ్గరగా ఉంది;

    ఎందుకంటే సహాయం చేసేవాడు ఎవరూ లేడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సంకటం.’ హీబ్రూ నామవాచకం ఆపద, సంకటం, బాధ అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: నాకు దూరంగా ఉండవద్దు
  rationale: రחק అనే క్రియలోని స్థలసంబంధ రూపకాన్ని అలాగే ఉంచుతూ, אַל తో వ్యక్తమయ్యే వేడుకోలును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. ‘నన్ను విడిచిపెట్టవద్దు’ అని అనువదిస్తే మూలంలో లేని మరింత బలమైన భావాన్ని చేర్చినట్లవుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: విన్నపానికి కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టంగా చూపిస్తుంది. హీబ్రూ కవితలో రెండుసార్లు వచ్చిన నిర్మాణాన్ని తెలుగులోనూ పునరావృతం చేసింది.
- source_word: צָרָה
  choice: ఆపద
  rationale: ఈ నామవాచకం కష్టం, సంకటస్థితి, బాధ లేదా విపత్తును సూచించగలదు. ‘ఆపద’ తక్షణ ప్రమాదం మరియు ఇబ్బంది అనే విస్తృత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: קְרוֹבָה
  choice: దగ్గరగా ఉంది
  rationale: విశేషణం విధేయంగా వాడబడి ఆపద సమీపంలో ఉందనే తక్షణత్వాన్ని తెలియజేస్తుంది. ‘దగ్గరగా ఉంది’ సాధారణ పాఠకులకు సహజమైన తెలుగు.
- source_word: אֵין עוֹזֵר
  choice: సహాయం చేసేవాడు ఎవరూ లేడు
  rationale: אֵין లోని ఉనికి నిరాకరణను, עוֹזֵר అనే కర్తృవాచక అసమాపక క్రియలోని వ్యక్తిగత ‘సహాయం చేసే వ్యక్తి’ భావాన్ని కాపాడుతుంది; అమూర్తమైన ‘సహాయం లేదు’ అనే భావానికి కుదించదు.
theological_decisions:
- issue: విలాపంలో దేవుని దూరం గురించిన భాష
  choice: ‘నాకు దూరంగా ఉండవద్దు’ అని స్థలసంబంధ రూపకంగానే అనువదించడం
  alternative: ‘నన్ను విడిచిపెట్టవద్దు’
  rationale: హీబ్రూ రחק + מן దేవుడు దూరంగా ఉండకూడదనే విన్నపాన్ని వ్యక్తం చేస్తుంది. ‘విడిచిపెట్టవద్దు’ అనేది పరిత్యాగం గురించిన మరింత బలమైన దైవశాస్త్ర భావాన్ని చేర్చవచ్చు; అందువల్ల మూలంలోని ఉద్విగ్నతను పరిష్కరించకుండా అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కవితా శైలిని వాడాం. హీబ్రూలోని రెండు కారణవాచక వాక్యాల సమాంతర నిర్మాణాన్ని ‘ఎందుకంటే’ అనే పదాన్ని పునరావృతం చేసి నిలిపాం.
