source:
  edition: WLC
  text: יְחַלְּק֣וּ בְגָדַ֣/י לָ/הֶ֑ם וְ/עַל לְ֝בוּשִׁ֗/י יַפִּ֥ילוּ גוֹרָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/018.yaml
  text: They divide my garments among themselves[a], and for my clothing they cast lots.
translation:
  language: te
  text: వారు నా వస్త్రాలను తమలో తాము పంచుకుంటున్నారు[a]; నా దుస్తుల కోసం చీట్లు వేస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యేసు సిలువవేయబడిన సందర్భాన్ని వర్ణించే సువార్త వృత్తాంతాల్లో ఈ పాదం ప్రతిధ్వనిస్తుంది; మత్తయి 27:35; మార్కు 15:24; లూకా 23:34; యోహాను 19:24 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: יְחַלְּקוּ
  choice: పంచుకుంటున్నారు
  rationale: חלק యొక్క పియేల్ అసంపూర్ణ రూపం. కవితలో కళ్లముందు జరుగుతున్నట్టుగా చూపే క్రియను సహజమైన తెలుగు వర్తమాన కాలంతో వ్యక్తం చేస్తుంది.
- source_word: בְגָדַי
  choice: నా వస్త్రాలను
  rationale: בגד అంటే వస్త్రాలు లేదా బట్టలు. ‘వస్త్రాలు’ కీర్తనకు తగిన గంభీరమైన, అయినా సులభంగా అర్థమయ్యే పదం; రెండో వస్త్రపదంతో ఉన్న సమాంతరతలో స్వల్ప భేదాన్ని నిలుపుతుంది.
- source_word: לָהֶם
  choice: తమలో తాము
  rationale: అక్షరార్థంగా ‘వారికోసం/వారికి’ అయినా, ‘పంచుకోవడం’ అనే క్రియతో ఇది ఆ గుంపు పరస్పరం తమ మధ్య పంచుకోవడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְבוּשִׁי
  choice: నా దుస్తుల కోసం
  rationale: לבוש సాధారణంగా దుస్తులు లేదా ధరించే వస్త్రాన్ని సూచిస్తుంది. ‘దుస్తులు’ మొదటి పాదంలోని ‘వస్త్రాలు’తో సమాంతరతను నిలుపుతూ, మూలంలో తప్పనిసరిగా లేని ‘అంగీ’ వంటి నిర్దిష్టతను చేర్చదు.
- source_word: יַפִּילוּ
  choice: వేస్తున్నారు
  rationale: נפל యొక్క హిఫీల్ రూపం גורלతో కలిసి ‘చీట్లు వేయడం’ అనే స్థిర ప్రయోగాన్ని ఏర్పరుస్తుంది; తెలుగు సహజ ప్రయోగాన్ని అనుసరించింది.
- source_word: גוֹרָל
  choice: చీట్లు
  rationale: גורל కేటాయింపు లేదా నిర్ణయం కోసం ఉపయోగించే lot‌ను సూచిస్తుంది. తెలుగులో ‘చీట్లు వేయడం’ సహజమైన స్థిర ప్రయోగం.
theological_decisions:
- issue: మెస్సీయ సంబంధ ప్రతిధ్వని మరియు కొత్త నిబంధనలో అన్వయం
  choice: కీర్తనలోని కవితాత్మక వర్ణనగా హెబ్రీ పాఠాన్ని నేరుగా అనువదించి, సిలువవేతకు సంబంధించిన స్పష్టమైన పదాలను ప్రధాన పాఠంలో చేర్చలేదు.
  alternative: యేసు సిలువవేతలో నెరవేర్పును ప్రధాన పాఠంలోనే ముందుకు తెచ్చే సంప్రదాయ ప్రభావిత అనువాదం.
  rationale: శ్రమవృత్తాంతాలు ఈ పాదాన్ని ప్రతిధ్వనింపజేస్తాయి; అయితే ప్రధాన అనువాదం హెబ్రీ మూలపాఠాన్నే ప్రతిబింబించాలి. కానోనిక సందర్భంలోని మెస్సీయ సంబంధాన్ని పాదటిప్పణి ద్వారా చూపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి. హెబ్రీ సమాంతర నిర్మాణాన్ని ‘వస్త్రాలు/దుస్తులు’ అనే రెండు సమీపార్థక పదాలతో నిలిపి, రెండు క్రియలనూ దృశ్యమాన వర్తమాన కాలంలో అందించింది.
