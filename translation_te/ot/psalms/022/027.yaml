source:
  edition: WLC
  text: יִזְכְּר֤וּ וְ/יָשֻׁ֣בוּ אֶל יְ֭הוָה כָּל אַפְסֵי אָ֑רֶץ וְ/יִֽשְׁתַּחֲו֥וּ לְ֝/פָנֶ֗י/ךָ כָּֽל מִשְׁפְּח֥וֹת גּוֹיִֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/027.yaml
  text: All the ends of the earth will remember and return to Yahweh[b][a], and all the families of the nations will bow down before you.
translation:
  language: te
  text: 'భూమి అంచులలోని వారందరూ జ్ఞాపకం చేసుకొని యాహ్వే[a] వైపుకు తిరుగుతారు;

    జనాంగాల కుటుంబాలన్నీ నీ సన్నిధిలో సాగిలపడతాయి[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యాహ్వే’ అనేది హీబ్రూ దైవనామమైన YHWH. దీనిని ‘యెహోవా’ అని కూడా పలుకుతారు; అనేక అనువాదాలు ‘ప్రభువు’ అని ఇస్తాయి.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘నీ సన్నిధిలో ఆరాధిస్తాయి.’ హీబ్రూ క్రియ అక్షరార్థంగా సాగిలపడడాన్ని సూచిస్తుంది; అది తరచుగా ఆరాధనా చర్యగా ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְכְּרוּ
  choice: జ్ఞాపకం చేసుకొని
  rationale: זכר అనే క్రియ యొక్క సాధారణ అర్థమైన ‘జ్ఞాపకం చేసుకోవడం’ను నిలుపుతుంది. ఈ సందర్భంలోని భవిష్యత్ దృశ్యాన్ని ప్రధాన క్రియతో కలిసి సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; హీబ్రూలో జ్ఞాపకం చేసుకునే విషయం స్పష్టంగా చెప్పబడనందున తెలుగులోనూ దానిని చేర్చలేదు.
- source_word: וְיָשֻׁבוּ אֶל יְהוָה
  choice: యాహ్వే వైపు తిరుగుతారు
  rationale: שוב యొక్క ‘తిరుగు/తిరిగి రా’ అనే దిశాత్మక భావాన్ని אֶל తో కలిపి వ్యక్తపరుస్తుంది. ‘పశ్చాత్తాపపడతారు’ అని అనువదిస్తే మూలంలో స్పష్టంగా లేని అంతరంగిక భావాన్ని అధికంగా నిర్దేశించినట్టవుతుంది.
- source_word: כָּל אַפְסֵי אָרֶץ
  choice: భూమి అంచులన్నిటిలో ఉన్నవారు
  rationale: ‘భూమి అంచులన్నీ’ అనే హీబ్రూ భౌగోళిక నుడికారంలోని సార్వత్రిక పరిధిని నిలుపుతూ, జ్ఞాపకం చేసుకొని తిరిగేది అక్కడి ప్రజలేనని తెలుగులో సహజంగా స్పష్టం చేస్తుంది.
- source_word: וְיִשְׁתַּחֲווּ
  choice: సాగిలపడతాయి
  rationale: ఈ క్రియ సూచించే శరీరాన్ని వంచి నమస్కరించే స్పష్టమైన చర్యను నిలుపుతుంది. సందర్భంలో ఆరాధన భావం ఉన్నప్పటికీ, దానిని మాత్రమే పదంలోకి నేరుగా చేర్చి అర్థాన్ని సంకుచితం చేయదు.
- source_word: לְפָנֶיךָ
  choice: నీ సన్నిధిలో
  rationale: అక్షరార్థంగా ‘నీ ముఖం ఎదుట’ అనే భావానికి సహజమైన, గౌరవప్రదమైన తెలుగు సమానం; దేవునికి ఉన్న ప్రత్యక్ష సంబోధనను ఏకవచనంలో నిలుపుతుంది.
- source_word: כָּל מִשְׁפְּחוֹת גּוֹיִם
  choice: జనాల కుటుంబాలన్నీ
  rationale: מִשְׁפְּחוֹת యొక్క కుటుంబ/వంశ సమూహ భావాన్ని అందుబాటులో ఉన్న భాషలో వ్యక్తపరుస్తుంది; גּוֹיִם ను తరువాతి కాలపు సాంకేతిక అర్థమైన ‘అన్యజనులు’గా పరిమితం చేయకుండా ‘జనాలు’గా ఇస్తుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించింది. పాఠకులకు పరిచితమైన ఇతర రూపాలను పాదసూచికలో తెలియజేసింది.
- issue: וְיִשְׁתַּחֲווּ ను ఆరాధనగా స్పష్టీకరించాలా
  choice: సాగిలపడతాయి
  alternative: ఆరాధిస్తాయి
  rationale: మూల క్రియలోని శారీరకంగా వంగి నమస్కరించే చిత్రాన్ని ప్రధాన పాఠంలో ఉంచి, దాని ఆరాధనా భావాన్ని పాదసూచిక ద్వారా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ కీర్తనా గౌరవాన్ని నిలిపే శైలి వాడబడింది. హీబ్రూ వాక్యంలోని భౌగోళిక నుడికారాన్ని తెలుగులో సహజం చేయడానికి ‘ఉన్నవారు’ చేర్చబడింది. మొదటి పాదంలో క్రియలు పుంలింగ బహువచనంగా, రెండవ పాదంలో ‘కుటుంబాలు’కు అనుగుణంగా నపుంసక బహువచన క్రియ వాడబడింది.
