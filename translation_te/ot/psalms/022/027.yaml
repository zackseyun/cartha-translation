- from: 'భూమి అంచులన్నిటిలో ఉన్నవారు జ్ఞాపకం చేసుకొని యాహ్వే[a] వైపు తిరుగుతారు;

    జనాల కుటుంబాలన్నీ నీ సన్నిధిలో సాగిలపడతాయి[b].'
  to: 'భూమి అంచులలోని వారందరూ జ్ఞాపకం చేసుకొని యాహ్వే[a] వైపుకు తిరుగుతారు;

    జనాంగాల కుటుంబాలన్నీ నీ సన్నిధిలో సాగిలపడతాయి[b].'
  rationale: The revision improves idiomatic modern Telugu and gives a more precise equivalent for ‘the families of the nations,’ while retaining the source text’s universal scope, direct address to God, future sense, and the distinction between physical bowing and the interpretive term ‘worship.’ Footnote markers remain correctly anchored to యాహ్వే and సాగిలపడతాయి.
