source:
  edition: WLC
  text: יָ֘בֵ֤שׁ כַּ/חֶ֨רֶשׂ כֹּחִ֗/י וּ֭/לְשׁוֹנִ/י מֻדְבָּ֣ק מַלְקוֹחָ֑/י וְֽ/לַ/עֲפַר מָ֥וֶת תִּשְׁפְּתֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/015.yaml
  text: My strength is dried up like a potsherd[a], and my tongue sticks to my jaws; you lay me in the dust of death.
translation:
  language: te
  text: 'నా బలం పెంకులా ఎండిపోయింది,

    నా నాలుక నా దవడలకు అంటుకుపోయింది;[a]

    నీవు నన్ను మరణపు ధూళిలో ఉంచుతావు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా నాలుక నా అంగిలికి అంటుకుపోయింది.” నోటిలోని ఏ భాగాన్ని సూచిస్తుందో హీబ్రూ పదానికి ఖచ్చితమైన అర్థం అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבֵשׁ
  choice: ఎండిపోయింది
  rationale: ఎండిపోవడం లేదా వాడిపోవడం అనే స్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כַּחֶרֶשׂ
  choice: పెంకులా
  rationale: మట్టి పాత్ర పెంకు అనే పొడి, పెళుసైన చిత్రాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: כֹּחִי
  choice: నా బలం
  rationale: ఇక్కడ శారీరక శక్తి లేదా జీవసత్తువ ఉద్దేశించబడింది.
- source_word: וּלְשׁוֹנִי
  choice: నా నాలుక
  rationale: శరీర భాగానికి సంబంధించిన సూటి సూచనను అలాగే ఉంచుతుంది.
- source_word: מֻדְבָּק
  choice: అంటుకుపోయింది
  rationale: అంటుకొని ఉండేలా చేయబడిన స్థితిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מַלְקוֹחָי
  choice: నా దవడలకు
  rationale: అనిశ్చితమైన నోటి భాగానికి సాధ్యమైన అర్థంగా దవడలను ప్రధాన పాఠంలో ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: וְלַעֲפַר
  choice: ధూళిలో
  rationale: ఉంచడం అనే క్రియతో కలిసి గమ్యస్థానం లేదా ఉంచబడిన స్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: מָוֶת
  choice: మరణధూళి
  rationale: ‘మరణపు ధూళి’ అనే హీబ్రూ కవితాత్మక సంబంధాన్ని తెలుగు సమాసరూపంలో నిలుపుతుంది; ‘సమాధి’ అని అతివ్యాఖ్యానించదు.
- source_word: תִּשְׁפְּתֵנִי
  choice: నీవు నన్ను ... ఉంచుతున్నావు
  rationale: ద్వితీయ పురుష ఏకవచన కర్తను, ప్రథమ పురుష ఏకవచన కర్మను స్పష్టంగా నిలిపి, కొనసాగుతున్న తీవ్రమైన అనుభవానికి సరిపోయే తెలుగు రూపాన్ని వాడుతుంది.
theological_decisions:
- issue: చివరి వాక్యభాగంలోని కర్తృత్వం
  choice: 'దేవునికి ప్రత్యక్ష సంబోధన: ‘నీవు నన్ను మరణధూళిలో ఉంచుతున్నావు.’'
  alternative: ‘నేను మరణధూళిలో ఉంచబడ్డాను’ వంటి కర్తను పేర్కొనని ఫలితార్థక వాక్యం.
  rationale: హీబ్రూ క్రియ ద్వితీయ పురుష పుంలింగ ఏకవచనంలో ఉండి, ప్రథమ పురుష ఏకవచన కర్మను కలిగివుంది. అందువల్ల దేవునికి ప్రత్యక్ష సంబోధన సహజమైనది. శత్రువుల మానవ చర్యలతో దేవుని కర్తృత్వం ఎలా సంబంధించిందో వివరించకుండా కీర్తనలోని వేదాంతపరమైన ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే కీర్తన కవితాత్మక గాంభీర్యం మరియు మూలంలోని శారీరక తీవ్రత నిలిచేలా రూపొందించబడింది.
