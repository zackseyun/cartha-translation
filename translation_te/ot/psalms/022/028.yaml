  source_fidelity: మూల హెబ్రీలోని לַיהוָה (‘యాహ్వేదే/యాహ్వేకు చెందింది’) మరియు הַמְּלוּכָה (‘రాజ్యాధికారం/రాజరికం/పాలన’) భావాన్ని పాఠం సరిగా గ్రహించింది. అయితే యెహోవా స్థానంలో యాహ్వే వాడటం నిర్దేశిత దైవనామ విధానానికీ ఆడిట్ ట్రయిల్‌కీ సరిపోతుంది. ‘ఆయనే’, ‘-కే’ కలయిక మూలంలో అవసరం లేని ప్రత్యేక ఉద్ఘాటనను కలిగిస్తుంది; దాన్ని తొలగించడం మంచిది. גּוֹיִם‌కు ‘దేశాలు’ అనేది ‘జనాలు’ కంటే ‘nations’ అర్థాన్ని మరింత స్పష్టంగా ఇస్తుంది.
