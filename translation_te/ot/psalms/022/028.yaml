id: PSA.22.28
reference: Psalms 22:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י לַ֭/יהוָה הַ/מְּלוּכָ֑ה וּ֝/מֹשֵׁ֗ל בַּ/גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/028.yaml
  text: For the kingdom belongs to Yahweh[b][a], and he rules over the nations.
translation:
  language: te
  text: ఎందుకంటే రాజ్యాధికారం యాహ్వేదే[a]; ఆయన దేశాలపై పరిపాలిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజరికం యాహ్వేదే,” లేదా “పాలన యాహ్వేదే.” హెబ్రీ పదం రాజ్యాధికారం, రాజరికం, లేదా పాలన అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న స్తుతి లేదా పిలుపుకు కారణాన్ని పరిచయం చేసే హేత్వర్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాకే చెందుతుంది
  rationale: לְ సూచించే స్వామ్య సంబంధాన్ని తెలుగులో ‘చెందుతుంది’తో స్పష్టంగా తెలిపి, ‘కే’ ద్వారా హెబ్రీ వాక్యంలోని ముందుంచిన దైవనామానికి ఉన్న ఉద్ఘాటనను నిలుపుతుంది.
- source_word: הַמְּלוּכָה
  choice: రాజ్యాధికారం
  rationale: ఈ నామవాచకం రాజరికం, రాజ్యపాలన, రాజాధికారం అనే భావాలను కలిగి ఉంది. ‘రాజ్యాధికారం’ అనేది కేవలం భూభాగం అనే అపార్థాన్ని తగ్గిస్తూ రాజుగా పాలించే హక్కు, అధికారం అనే సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: וּמֹשֵׁל
  choice: ఆయనే ... పరిపాలిస్తాడు
  rationale: Qal కర్తరి వర్తమాన క్రియారూపం నిరంతరమైన సాధారణ సత్యాన్ని సూచిస్తుంది. గౌరవార్థక ఏకవచనంతో సహజ తెలుగు వాక్యాన్ని నిర్మించింది.
- source_word: בַּגּוֹיִם
  choice: జనాలపై
  rationale: משׁל తో వచ్చిన בְ పాలనకు లోబడిన వారిని సూచిస్తుంది; גּוֹיִם ఇక్కడ అన్ని జనాలను లేదా దేశజనాలను విస్తృతంగా సూచిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో ఉన్న ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుతో మార్చకుండా తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచింది; ఖచ్చిత ఉచ్చారణపై ఉన్న అనిశ్చితిని సిద్ధాంతపరంగా పరిష్కరించినట్లు చూపదు.
- issue: מְלוּכָה యొక్క భావపరిధి
  choice: రాజ్యాధికారం
  alternative: రాజ్యం; రాజరికం; పరిపాలన
  rationale: దేవుని సార్వభౌమ పాలనను వ్యక్తం చేస్తూ, ఈ పదం సూచించగల రాజరికం/పాలన/అధికారం మధ్య ఉన్న భావ విస్తృతిని ప్రధాన పాఠంలో సాధ్యమైనంతవరకు నిలుపుతుంది; ప్రత్యామ్నాయాలను పాదసూచనలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గంభీరతతోను సాధారణ పాఠకులకు అర్థమయ్యే సహజ వాక్యనిర్మాణంతోను రూపొందించబడింది. దైవనామానికి గౌరవార్థక క్రియారూపం వాడబడింది.
