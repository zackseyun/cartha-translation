  text: A seed will serve him; it will be proclaimed about the Lord to the generation.
translation:
  language: te
  text: 'సంతానం ఆయనను సేవిస్తుంది;

    ప్రభువు గురించి ఒక తరానికి తెలియజేయబడుతుంది.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶרַע
  choice: ఒక సంతానం
  rationale: మూలపదానికి ‘విత్తనం’, ‘సంతానం’, ‘వంశం’ అనే పరిధి ఉంది. ఇక్కడ భావవాచక సమూహార్థాన్ని పూర్తిగా విప్పకుండా, మూలంలోని ఏకవచన రూపాన్నీ దాని ఉద్దేశపూర్వక అస్పష్టతనూ నిలుపుతూ ‘ఒక సంతానం’ అని అనువదించాం.
- source_word: יַעַבְדֶנּוּ
  choice: ఆయనను సేవిస్తుంది
  rationale: క్రియకు ‘సేవించు/ఆరాధనతో సేవించు’ అనే అర్థం ఉంది; ప్రత్యయానికి సహజమైన పురుష ఏకవచన సూచనను ‘ఆయనను’గా ఉంచాం.
- source_word: יְסֻפַּר
  choice: ప్రకటించబడుతుంది
  rationale: ఇది పుయల్ అపూర్ణక్రియ; ‘చెప్పబడుతుంది/వివరించబడుతుంది/ప్రకటించబడుతుంది’ అనే భావాన్ని ఇస్తుంది. కీర్తనలోని బహిరంగ తరతరాల ప్రకటన సందర్భానికి ‘ప్రకటించబడుతుంది’ సహజంగా సరిపోతుంది.
- source_word: לַאדֹנָי
  choice: ప్రభువు గురించి
  rationale: לְ సంబంధార్థకంగా ‘గురించి/సంబంధించి’ అనే భావాన్ని ఇక్కడ సూచించగలదు. אֲדֹנָי అనే దైవపదాన్ని ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా ‘ప్రభువు’గా ఇచ్చాం.
- source_word: לַדּוֹר
  choice: రాబోయే తరానికి
  rationale: నిర్దిష్ట ‘తరానికి’ అన్న మూలరూపాన్ని ఉంచుతూ, సందర్భంలో తరువాతి తరాన్ని సూచించే భావాన్ని సహజ తెలుగులో ‘రాబోయే’ అని స్పష్టం చేశాం.
theological_decisions:
- issue: זֶרַע సామూహికమా, ఏక వ్యక్తిని సూచిస్తుందా?
  choice: ఒక సంతానం
  alternative: వంశస్థులు / భావితరం
  rationale: హీబ్రూ ఏకవచన సామూహిక నామవాచకం ఒక వంశాన్నీ లేదా సంతానాన్నీ సూచించగలదు. ఏక వ్యక్తి లేదా బహువచన సమూహం అని సిద్ధాంతపరంగా ముందే నిర్ణయించకుండా మూలంలోని ఉద్రిక్తతను నిలిపాం.
- issue: יְסֻפַּר క్రియకు అంతర్లీన కర్త
  choice: కర్తను పేర్కొనని కర్మణి రూపం
  alternative: వారు ప్రకటిస్తారు / ఆ సంతానం ప్రకటిస్తుంది
  rationale: మూలంలో క్రియ కర్మణి రూపంలో ఉండి ప్రకటించేవారు ఎవరో చెప్పదు. అందువల్ల ‘ప్రకటించబడుతుంది’ అని ఉంచి సంతానమే కర్త అని జోడించలేదు.
- issue: לַאדֹנָי యొక్క సంబంధం
  choice: ప్రభువు గురించి
  alternative: ప్రభువుకు
  rationale: ఈ సందర్భంలో తరువాతి తరానికి తెలియజేయబడే విషయం ప్రభువు గురించినదిగా గ్రహించడం వాక్యనిర్మాణానికీ తదుపరి వచనానికీ సరిపోతుంది; అయినా לְ యొక్క సాధారణ దత్తార్థాన్ని అనువాదంలో సిద్ధాంతపరంగా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కీర్తనా శైలి. మూలంలోని రెండు కర్మణి/అస్పష్ట సంబంధాలను సాధ్యమైనంత వరకు నిలిపి, సాధారణ పాఠకునికి సహజంగా వినిపించే వాక్య నిర్మాణం ఉపయోగించబడింది.
