source:
  edition: WLC
  text: הַצִּ֣ילָ/ה מֵ/חֶ֣רֶב נַפְשִׁ֑/י מִ/יַּד כֶּ֝֗לֶב יְחִידָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/020.yaml
  text: Deliver my life from the sword[c][b][a], my only one from the power of the dog.
translation:
  language: te
  text: 'ఖడ్గం నుండి నా ప్రాణాన్ని[a],

    కుక్క వశం[b] నుండి నా ఒక్క ప్రాణాన్ని[c] రక్షించు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నా ఆత్మను’ లేదా ‘నన్ను’ అని కూడా అనువదించవచ్చు. హీబ్రూ נֶפֶשׁ సందర్భాన్ని బట్టి ప్రాణం, వ్యక్తి లేదా ఆత్మను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘కుక్క చేతి నుండి’; ఇక్కడ ‘చెయ్యి’ అధికారం, పట్టు లేదా నియంత్రణకు నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: ‘నాకున్న ఏకైకదాన్ని’ లేదా ‘నా అమూల్య ప్రాణాన్ని’ అని కూడా అనువదించవచ్చు. హీబ్రూ יְחִידָתִי అక్షరార్థంగా ‘నా ఏకైకది’ అని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילָה
  choice: రక్షించు
  rationale: నצל క్రియ ఇక్కడ అత్యవసర సహాయం కోరే ఆజ్ఞార్థక విన్నపం. ‘రక్షించు’ ప్రాణాపాయం నుండి విడిపించాలనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מֵחֶרֶב
  choice: ఖడ్గం నుండి
  rationale: מן విభక్తి ప్రమాదం నుండి వేరుచేసి కాపాడటాన్ని సూచిస్తుంది. నిర్దిష్టమైన ఒక ఆయుధాన్ని తప్పనిసరిగా సూచించకుండా, ప్రాణాంతక ముప్పుకు ప్రతీకగా ఉన్న ఏకవచన రూపాన్ని ‘ఖడ్గం’ నిలుపుతుంది.
- source_word: נַפְשִׁי
  choice: నా ప్రాణాన్ని
  rationale: נפש ఈ సందర్భంలో శరీరానికి వేరైన ఆత్మ అనే సాంకేతిక భావం కంటే, ప్రమాదంలో ఉన్న జీవితం లేదా వ్యక్తినే సూచిస్తుంది. ఖడ్గం వల్ల కలిగే ప్రాణాపాయానికి సమాంతరంగా ‘ప్రాణం’ సహజంగా సరిపోతుంది.
- source_word: מִיַּד
  choice: వశం నుండి
  rationale: అక్షరార్థంగా ‘చేతి నుండి’ అయినా, יד ఇక్కడ అధికారం, పట్టు, నియంత్రణ అనే నుడికార భావంలో ఉంది. ‘వశం నుండి’ ఆ భావాన్ని స్పష్టంగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: כֶּלֶב
  choice: కుక్క
  rationale: హీబ్రూ పదం ఏకవచనంలో ఉంది. ఇది శత్రువుకు రూపకంగా ఉండవచ్చుగాని, అలా వివరణను వాక్యంలో చేర్చకుండా మూలంలోని సజీవ చిత్రాన్ని, ఏకవచనాన్ని నిలిపాం.
- source_word: יְחִידָתִי
  choice: నా ఒక్క ప్రాణాన్ని
  rationale: יחידה అక్షరార్థంగా ‘నా ఏకైకది’ అనే భావం ఇస్తుంది; נַפְשִׁיతో ఉన్న కవితా సమాంతరతలో అది వక్తకు ఉన్న ఒక్క ప్రాణాన్ని సూచిస్తుంది. ‘నా ఒక్క ప్రాణం’ ప్రత్యేకతను నిలుపుతూ తెలుగులో అర్థవంతంగా ఉంటుంది; ‘అమూల్య ప్రాణం’ మూలంలో స్పష్టంగా లేని విలువ-భావాన్ని జోడించవచ్చు.
theological_decisions:
- issue: విలాప సందర్భంలో נַפְשִׁי యొక్క మానవ స్వభావ సంబంధ అర్థం
  choice: ‘నా ఆత్మను’ అని కాకుండా ‘నా ప్రాణాన్ని’ అని అనువదించడం
  alternative: నా ఆత్మను
  rationale: ఈ వాక్యం ప్రాణాంతక శత్రువుల నుండి రక్షణ కోరే విన్నపం. ఇక్కడ హీబ్రూ పదం సహజంగా వక్త జీవితం లేదా వ్యక్తినే సూచిస్తుంది. ‘ప్రాణం’ అని అనువదించడం సందర్భంలోని అత్యవసరతను నిలుపుతూ, మూలం చెప్పనంత నిర్దిష్టమైన శరీర–ఆత్మ విభజనను దిగుమతి చేయదు.
- issue: יְחִידָתִיలోని ప్రత్యేకత మరియు విలువ భావం
  choice: ‘నా ఒక్క ప్రాణాన్ని’
  alternative: ‘నా ఏకైకదాన్ని’ లేదా ‘నా అమూల్య ప్రాణాన్ని’
  rationale: మూలంలోని ‘ఒక్కటే/ఏకైకమైనది’ అనే భావాన్ని స్పష్టంగా ఉంచి, ‘అమూల్యమైనది’ అనే సాధ్యమైన కానీ నిర్బంధం కాని భావాన్ని ప్రధాన పాఠ్యంలో నిర్ణయాత్మకంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనా విలాపానికి తగిన గంభీరమైనప్పటికీ సామాన్య పాఠకులకు స్పష్టమైన శైలి వాడబడింది. హీబ్రూ కవిత్వంలోని రెండు సమాంతర భాగాలను ఒకే ‘రక్షించు’ క్రియతో అనుసంధానించి మూల నిర్మాణాన్ని నిలిపాం. ‘కుక్క’ అనే ఏకవచన రూపకాన్ని వివరణతో భర్తీ చేయలేదు.
