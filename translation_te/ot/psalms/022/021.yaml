  text: ה֭וֹשִׁיעֵ/נִי מִ/פִּ֣י אַרְיֵ֑ה וּ/מִ/קַּרְנֵ֖י רֵמִ֣ים עֲנִיתָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/021.yaml
  text: Save me from the mouth of the lion[b][a], and from the horns of the wild oxen—you have answered me.
translation:
  language: te
  text: 'సింహం నోటినుండి నన్ను రక్షించు;

    అడవి ఎద్దుల[a] కొమ్ములనుండి—నీవు నాకు జవాబిచ్చావు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అడవి వృషభాలు’ లేదా ‘ఆరోక్స్‌లు’; హీబ్రూ పదం బలమైన అడవి గోజాతి జంతువును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: చివరి మాటను ప్రార్థనకు జవాబు లభించిందనే ఆకస్మిక ప్రకటనగా—‘నీవు నాకు జవాబిచ్చావు’—గ్రహించవచ్చు. ఇది మొర నుంచి ధైర్యానికి వచ్చే మలుపును సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹשִׁיעֵנִי
  choice: నన్ను రక్షించు
  rationale: ישׁע ధాతువు హిఫీల్ ఆజ్ఞారూపం, ఏకవచన ప్రథమ పురుష కర్మప్రత్యయంతో, విడిపించమనే ప్రత్యక్షమైన మొరను తెలియజేస్తుంది. ‘రక్షించు’ ఆధునిక తెలుగులో సహజంగా ఉండి దాని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: מִפִּי
  choice: నోటినుండి
  rationale: హీబ్రూ పదబంధానికి అక్షరార్థం ‘నోటినుండి.’ ‘దవడలనుండి’ అని భావానువాదం చేయకుండా మూలంలోని స్పష్టమైన కావ్యచిత్రాన్ని నిలిపింది.
- source_word: אַרְיֵה
  choice: సింహం
  rationale: నిర్దిష్ట ఉపపదం లేని ఏకవచన నామవాచకం. తెలుగులో ఈ అపాయచిత్రానికి ‘సింహం’ సహజంగా, సాధారణార్థకంగానూ వినిపిస్తుంది.
- source_word: וּמִקַּרְנֵי
  choice: అడవి ఎద్దుల కొమ్ములనుండి
  rationale: సంయోజక అవ్యయం, విభక్తిపూర్వకం కలసి రెండవ అపాయం నుంచి రక్షణ అనే భావాన్ని కొనసాగిస్తాయి. మూలంలోని స్పష్టమైన ‘కొమ్ములు’ అనే చిత్రాన్ని యథాతథంగా నిలిపింది.
- source_word: רֵמִים
  choice: అడవి ఎద్దులు
  rationale: ఈ పదం బలమైన అడవి గోజాతి జంతువులను సూచిస్తుంది; సంప్రదాయంలోని ‘ఏకశృంగి’ భావం కాదు. ‘అడవి ఎద్దులు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, ‘ఆరోక్స్’ కంటే సులభగ్రాహ్యం.
- source_word: עֲנִיתָנִי
  choice: నీవు నాకు జవాబిచ్చావు
  rationale: ענה ధాతువు కాల్ సంపూర్ణరూపం, ద్వితీయ పురుష ఏకవచనం, ప్రథమ పురుష కర్మప్రత్యయంతో, సాధారణంగా ‘నీవు నాకు జవాబిచ్చావు’ అని అర్థం. మొర నుంచి ధైర్యప్రకటనకు కలిగే ఆకస్మిక మలుపును తెలుగులోనూ నిలిపింది.
theological_decisions:
- issue: עֲנִיתָנִי అనేది కొనసాగుతున్న మొరగా గ్రహించాలా, లేక ప్రార్థనకు జవాబు లభించిందనే ప్రకటనగా గ్రహించాలా
  choice: ‘నీవు నాకు జవాబిచ్చావు’ అనే ప్రకటన
  alternative: కొమ్ములనుండి రక్షించి నాకు జవాబివ్వు అనే కొనసాగుతున్న మొరగా గ్రహించడం
  rationale: హీబ్రూ రూపం ఆజ్ఞార్థకం కాదు, సంపూర్ణ క్రియారూపం. కీర్తనలో మొర నుంచి నమ్మకం, స్తుతి వైపు వచ్చే సాహిత్య మలుపుకు ఈ ఆకస్మిక ప్రకటన సరిపోతుంది. అయితే వాక్యనిర్మాణంలోని ఆకస్మికత వల్ల కలిగే వ్యాఖ్యాన ఉద్రిక్తతను పాదటిప్పణి సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా శైలి. ‘నోరు,’ ‘కొమ్ములు’ అనే మూల చిత్రాలను నిలిపి, అరుదైన జంతుశాస్త్రీయ పదాన్ని ప్రధాన పాఠ్యంలో నివారించింది. ఎమ్ డాష్ ద్వారా చివరి ప్రకటనలోని ఆకస్మిక మలుపును చూపింది.
