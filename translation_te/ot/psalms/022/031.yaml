source:
  edition: WLC
  text: יָ֭בֹאוּ וְ/יַגִּ֣ידוּ צִדְקָת֑/וֹ לְ/עַ֥ם נ֝וֹלָ֗ד כִּ֣י עָשָֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/031.yaml
  text: They will come and declare his righteousness to a people yet to be born[c][b][a], that he has done it.
translation:
  language: te
  text: వారు వచ్చి, ఇంకా పుట్టని ప్రజలకు ఆయన నీతిని[a] ప్రకటిస్తారు[b]—ఆయన దానిని చేశాడని.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆయన న్యాయాన్ని.’ హీబ్రూ పదం విస్తృతార్థంలో నీతిని సూచిస్తుంది; అందులో న్యాయమైన, రక్షణకరమైన కార్యం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పుట్టబోయే ప్రజలకు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘ఎందుకంటే ఆయన దానిని చేశాడు.’ హీబ్రూ చివరి వాక్యభాగం సంక్షిప్తంగా ఉంది; దాన్ని ప్రకటించబడే విషయంగానైనా, ప్రకటనకు కారణంగానైనా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: יָבֹאוּ
  choice: వారు వచ్చి
  rationale: בוא క్రియ యొక్క ఖల్ అసంపూర్ణ రూపం భవిష్య కార్యాన్ని సూచిస్తుంది. తరువాతి సమాపక క్రియతో కలిసి తెలుగులో సహజంగా ఉండేందుకు ‘వారు వచ్చి ... ప్రకటిస్తారు’ అని ఇచ్చాం.
- source_word: וְיַגִּידוּ
  choice: ప్రకటిస్తారు
  rationale: נגד యొక్క హిఫిల్ రూపం తెలియజేయడం లేదా బహిరంగంగా ప్రకటించడం అనే భావాన్ని ఇస్తుంది. కీర్తనలోని సాక్ష్యప్రకటన ధోరణికి ‘ప్రకటిస్తారు’ సరిపోతుంది.
- source_word: צִדְקָתוֹ
  choice: ఆయన నీతిని
  rationale: צדקה నీతి, న్యాయం, అలాగే నీతితో కూడిన రక్షణకార్యాన్ని సూచించగలదు. భావవిస్తృతిని నిలుపుతూ ప్రధాన పాఠంలో ‘నీతి’ని ఉంచాం; ‘న్యాయం’ను పాదటిప్పణిలో ఇచ్చాం.
- source_word: לְעַם
  choice: ప్రజలకు
  rationale: ל ప్రకటనను అందుకునేవారిని సూచిస్తుంది. עַם ఇక్కడ సమూహార్థక ఏకవచనమైనందున ఆధునిక తెలుగులో సహజమైన ‘ప్రజలకు’ వాడాం.
- source_word: נוֹלָד
  choice: ఇంకా పుట్టని
  rationale: ילד యొక్క నిష్క్రియ కృదంతం రాబోయే తరాన్ని సూచిస్తుంది. ‘ఇంకా పుట్టని’ ఆ భవిష్య భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כִּי
  choice: అని
  rationale: כִּי ఇక్కడ ప్రకటించబడే విషయాన్ని పరిచయం చేస్తున్నదిగా గ్రహించాం. అయితే కారణార్థకంగా కూడా చదవవచ్చు; ఆ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: עָשָׂה
  choice: ఆయనే దానిని చేశాడు
  rationale: עשה యొక్క ఖల్ సంపూర్ణ రూపం ‘చేశాడు’ అని అర్థం. హీబ్రూలో కర్మ స్పష్టంగా చెప్పబడలేదు; తెలుగులో వాక్యం సహజంగా ఉండేందుకు ‘దానిని’ చేర్చాం. ‘ఆయనే’ చివరి ప్రకటనలోని సంక్షిప్త, నిర్ణాయక బలాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఈ కీర్తనలో צִדְקָתוֹ యొక్క భావం
  choice: ప్రధాన పాఠంలో ‘ఆయన నీతి’
  alternative: ‘ఆయన న్యాయం’ లేదా ‘ఆయన రక్షణకరమైన నీతి’
  rationale: హీబ్రూ పదం నైతిక నీతినీ, న్యాయాన్నీ, దేవుని నీతియుక్త రక్షణకార్యాన్నీ సూచించగలదు. ఒకే ప్రత్యేక భావానికి పరిమితం చేయకుండా ప్రధాన పాఠంలో విస్తృతమైన ‘నీతి’ని ఉంచాం.
- issue: చివరి వాక్యభాగమైన כִּי עָשָׂה యొక్క సంబంధం
  choice: 'ప్రకటనలోని విషయంగా: ‘ఆయనే దానిని చేశాడని’'
  alternative: 'కారణార్థకంగా: ‘ఎందుకంటే ఆయనే దానిని చేశాడు’'
  rationale: చివరి భాగం హీబ్రూలో అత్యంత సంక్షిప్తంగా ఉంది. సందర్భంలో అది భవిష్య తరాలు ప్రకటించే విషయంగా చదవడం అనుకూలం; అయినా కారణార్థక పఠనం వ్యాకరణపరంగా సాధ్యమే కాబట్టి పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘వారు వచ్చి ... ప్రకటిస్తారు’ అనే నిర్మాణం హీబ్రూ క్రియల భవిష్య దిశను నిలుపుతుంది. చివరి వాక్యంలోని సంక్షిప్తతను కాపాడుతూ, అస్పష్టతను పాదటిప్పణిలో స్పష్టంగా నమోదు చేశాం.
