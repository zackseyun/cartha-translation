source:
  edition: WLC
  text: מֵ֥/אִתְּ/ךָ֗ תְֽהִלָּ֫תִ֥/י בְּ/קָהָ֥ל רָ֑ב נְדָרַ֥/י אֲ֝שַׁלֵּ֗ם נֶ֣גֶד יְרֵאָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/025.yaml
  text: From you comes my praise in the great assembly[a]; I will pay my vows before those who fear him.
translation:
  language: te
  text: మహాసభలో నా స్తుతి నీ నుంచే వస్తుంది; ఆయనకు[a] భయపడేవారి ఎదుట నా మొక్కుబడులను చెల్లిస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఇక్కడ “ఆయనకు భయపడేవారు” అని ఉంది. ముందున్న ప్రత్యక్ష సంబోధనకు అనుగుణంగా కొందరు అనువాదాలు “నీకు భయపడేవారు” అని చేస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאִתְּךָ
  choice: నీ నుంచే వస్తుంది
  rationale: מֵאֵת ఉపసర్గతో కూడిన ద్వితీయ పురుష ఏకవచన ప్రత్యయం మూలాన్ని సూచిస్తుంది. సహజమైన తెలుగు వాక్యనిర్మాణం కోసం ‘వస్తుంది’ను చేర్చి, స్తుతి దేవుని నుంచే ఉద్భవిస్తుందనే భావాన్ని నిలిపింది.
- source_word: תְהִלָּתִי
  choice: నా స్తుతి
  rationale: ఈ నామవాచకం స్తుతి లేదా కృతజ్ఞతాభివ్యక్తిని సూచిస్తుంది. మూలంలో స్పష్టంగా లేని గీతం లేదా బలి భావాన్ని చేర్చకుండా నేరుగా అనువదించింది.
- source_word: בְּקָהָל רָב
  choice: మహాసభలో
  rationale: קָהָל కూడివచ్చిన సమాజాన్ని సూచిస్తుంది; רָב ఇక్కడ దాని గొప్పతనాన్ని లేదా విస్తృత పరిమాణాన్ని తెలిపే విశేషణం. ‘మహాసభ’ సంక్షిప్తంగా, గౌరవప్రదంగా ఉంది.
- source_word: נְדָרַי
  choice: నా మొక్కుబడులను
  rationale: దేవునికి చేసిన ప్రతిజ్ఞలను సూచించే బహువచన నామవాచకం. ఆధునిక తెలుగు ఆరాధనా సందర్భంలో ‘మొక్కుబడులు’ సహజంగా అర్థమవుతుంది.
- source_word: אֲשַׁלֵּם
  choice: చెల్లిస్తాను
  rationale: పియేల్ రూపంలోని שׁלם, మొక్కుబడులతో వాడినప్పుడు వాటిని చెల్లించడం లేదా నెరవేర్చడం అనే భావాన్ని ఇస్తుంది. ‘చెల్లిస్తాను’ మూలంలోని సాధారణ సంయోగాన్ని నిలుపుతుంది.
- source_word: נֶגֶד
  choice: ఎదుట
  rationale: సాక్షాత్తు సమక్షం లేదా కనిపించే స్థితిని సూచించే సంక్షిప్తమైన సహజ తెలుగు పదం.
- source_word: יְרֵאָיו
  choice: ఆయనకు భయపడేవారి
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న కృదంతం ‘ఆయనకు భయపడేవారు’ అని అర్థం. ‘భయపడు’ దేవునిపట్ల భక్తిపూర్వక భయమనే బైబిలీయ ఉద్వేగాన్ని ‘గౌరవించు’ కంటే స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘నీ’ అనే ద్వితీయ పురుష సంబోధన నుంచి ‘ఆయనకు భయపడేవారు’ అనే తృతీయ పురుష సూచనకు మార్పు
  choice: మసొరేటిక్ పాఠంలోని మార్పును యథాతథంగా నిలిపి, ‘నీ నుంచే ... ఆయనకు భయపడేవారి’ అని అనువదించడం
  alternative: వ్యక్తి సూచనను ఏకరీతిగా చేసి, ‘నీకు భయపడేవారి’ అని అనువదించడం
  rationale: హీబ్రూ పాఠం ప్రత్యక్ష సంబోధన నుంచి తృతీయ పురుష సూచనకు మారుతుంది. సందర్భంలో రెండూ దేవునినే సూచించినా, మూలంలోని శైలీ ఉద్వేగాన్ని సవరించకుండా కాపాడడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తన కవిత్వానికి తగిన గౌరవప్రదమైన, సంక్షిప్తమైన శైలి. ‘మహాసభ’, ‘స్తుతి’, ‘మొక్కుబడులు’ వంటి సాధారణ బైబిలీయ పదాలను ఉపయోగించింది. మూలంలో ఉన్న ద్వితీయ పురుషం నుంచి తృతీయ పురుషానికి మార్పును పాఠంలోనే నిలిపింది.
