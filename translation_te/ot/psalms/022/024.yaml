language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י לֹֽא בָזָ֨ה וְ/לֹ֪א שִׁקַּ֡ץ עֱנ֬וּת עָנִ֗י וְ/לֹא הִסְתִּ֣יר פָּנָ֣י/ו מִמֶּ֑/נּוּ וּֽ/בְ/שַׁוְּע֖/וֹ אֵלָ֣י/ו שָׁמֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/024.yaml
  text: For he has not despised or abhorred the affliction of the afflicted[a], and he has not hidden his face from him; but when he cried to him, he heard.
translation:
  language: te
  text: ఎందుకంటే ఆయన బాధితుని బాధను తృణీకరించలేదు, అసహ్యించుకోలేదు[a]; అతని నుండి తన ముఖాన్ని దాచుకోలేదు. అతడు ఆయనకు మొరపెట్టినప్పుడు ఆయన విన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పేదవాని దుస్థితిని’ లేదా ‘బాధితుని అవమానస్థితిని.’
    reason: עֱנוּת עָנִי అనే పదబంధంలోని ‘బాధ/దుస్థితి/అవమానస్థితి’ మరియు ‘బాధితుడు/పేదవాడు’ అనే సాధ్యమైన భావాలను సూచించడానికి.
lexical_decisions:
- source_word: בָזָה
  choice: తృణీకరించలేదు
  rationale: అవహేళనతో అలక్ష్యం చేయడం అనే భావాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שִׁקַּץ
  choice: అసహ్యించుకోలేదు
  rationale: ముందటి క్రియకంటే బలమైన, ఏవగింపుతో తిరస్కరించే భావాన్ని నిలుపుతుంది.
- source_word: עֱנוּת
  choice: బాధ
  rationale: పీడన లేదా దుఃఖస్థితిని అతిగా నిర్దిష్టం చేయకుండా సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: עָנִי
  choice: బాధితుడు
  rationale: ఆర్థిక పేదరికానికే పరిమితం చేయకుండా, కీర్తన సందర్భంలోని పీడితుని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: הִסְתִּיר פָּנָיו
  choice: తన ముఖాన్ని దాచుకోలేదు
  rationale: అనుగ్రహపూర్వక శ్రద్ధను లేదా సన్నిధిని ఉపసంహరించుకోవడాన్ని సూచించే హీబ్రూ రూపకాన్ని నిలుపుతుంది.
- source_word: מִמֶּנּוּ
  choice: అతనికి
  rationale: తెలుగులో ‘అతని నుండి తన ముఖాన్ని దాచుకోలేదు’ కంటే సహజంగా ఉండి, అదే సంబంధాన్ని వ్యక్తపరుస్తుంది.
- source_word: בְשַׁוְּעוֹ
  choice: అతడు తనకు మొరపెట్టినప్పుడు
  rationale: సహాయం కోసం అత్యవసరంగా చేసే మొర అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֵלָיו
  choice: తనకు
  rationale: సందర్భంలో దేవుణ్ణి సూచించే హీబ్రూ సర్వనామాన్ని దైవనామంతో విస్తరించకుండా నిలుపుతుంది.
- source_word: שָׁמֵעַ
  choice: విన్నాడు
  rationale: ‘జవాబిచ్చాడు’ అనే అదనపు వ్యాఖ్యానాన్ని చేర్చకుండా మూల క్రియ యొక్క ప్రాథమిక అర్థాన్ని కాపాడుతుంది.
theological_decisions:
- issue: బాధితుని సూచన
  choice: ఏకవచన బాధితుడు అనే రూపాన్ని ఉంచి, అది కీర్తనకర్త అనుభవానికీ విస్తృత సత్యానికీ సరిపడేలా అనువదించబడింది.
  alternative: దీనిని ప్రత్యేకంగా మెస్సీయకు మాత్రమే సంబంధించిన సూచనగా లేదా ఏ పేద వ్యక్తికైనా వర్తించే పూర్తిగా సాధారణ ప్రకటనగా నిర్దిష్టం చేయడం.
  rationale: హీబ్రూ ఏకవచన రూపాలు కీర్తనలోని వ్యక్తిగత అనుభవానికీ విస్తృత అన్వయానికీ చోటిస్తాయి; అనువాదం ఈ ఉద్దేశపూర్వక విస్తృతిని సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ముఖాన్ని దాచుకోవడం’ అనే బైబిలీయ రూపకం నిలుపబడింది; రెండు నిరాకరణ క్రియల తీవ్రతా క్రమం ‘తృణీకరించలేదు, అసహ్యించుకోలేదు’ ద్వారా వ్యక్తమైంది. పాదసూచి గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
