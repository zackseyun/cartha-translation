revisions:
- from: ఎందుకంటే ఆయన బాధితుని బాధను తృణీకరించలేదు, అసహ్యించుకోలేదు[a]; అతనికి తన ముఖాన్ని దాచుకోలేదు. అతడు తనకు మొరపెట్టినప్పుడు ఆయన విన్నాడు.
  to: ఎందుకంటే ఆయన బాధితుని బాధను తృణీకరించలేదు, అసహ్యించుకోలేదు[a]; అతని నుండి తన ముఖాన్ని దాచుకోలేదు. అతడు ఆయనకు మొరపెట్టినప్పుడు ఆయన విన్నాడు.
  rationale: The revision corrects the direction of the face-hiding idiom (‘from him’) and resolves Telugu pronominal ambiguity in the final clause. It otherwise preserves the draft’s source-faithful wording, its singular referent, and its non-sectarian ambiguity.
