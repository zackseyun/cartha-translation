  text: Upon you I was cast from the womb[b][a]; from my mother's belly you have been my God.
translation:
  language: te
  text: గర్భం నుంచే నేను నీ మీద వేయబడ్డాను; నా తల్లి కడుపు నుంచే నీవు నా దేవుడవు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా తల్లి గర్భం నుంచే నీవు నా దేవుడిగా ఉన్నావు.” చివరి హెబ్రీ వాక్యం అక్షరార్థంగా “నా దేవుడు నీవు”; అది ప్రస్తుత ప్రకటనగానో, పుట్టుకనుంచి కొనసాగుతున్న సంబంధంగానో అర్థమవవచ్చు. అలాగే ఇక్కడ “కడుపు”కు వాడిన హెబ్రీ పదాన్ని “గర్భం” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: עָלֶיךָ
  choice: నీ మీద
  rationale: עַל ఉపసర్గలోని ఆధారపడే భావాన్ని, తరువాతి ‘వేయబడ్డాను’ అనే రూపకంతో సహా నేరుగా నిలుపుతుంది.
- source_word: הָשְׁלַכְתִּי
  choice: నేను వేయబడ్డాను
  rationale: హోఫాల్ రూపంలోని క్రియను కర్మణి భావంతో అందించి, దేవుని సంరక్షణకు అప్పగించబడినట్టు అతిగా వ్యాఖ్యానించకుండా మూలంలోని సజీవ రూపకాన్ని కాపాడుతుంది.
- source_word: מֵרָחֶם
  choice: గర్భం నుంచే
  rationale: רֶחֶם యొక్క నిర్దిష్టమైన ‘గర్భం’ అనే అర్థాన్ని నిలుపుతుంది; מִן మరియు సందర్భం తెలిపే ఆరంభకాల భావాన్ని ‘నుంచే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מִבֶּטֶן אִמִּי
  choice: నా తల్లి కడుపు నుంచే
  rationale: בֶּטֶן ను ‘కడుపు’గా అనువదించడం ముందటి רֶחֶם (‘గర్భం’)తో ఉన్న హెబ్రీ పదవైవిధ్యాన్ని నిలుపుతుంది; తెలుగులో ఇది కవితాత్మక సందర్భంలో అర్థవంతంగా ఉంటుంది.
- source_word: אֵלִי
  choice: నా దేవుడు
  rationale: אֵל కు ప్రథమ పురుష ఏకవచన ప్రత్యయం కలిగిన వ్యక్తిగత సంబంధ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: אָתָּה
  choice: నీవు ... దేవుడవు
  rationale: హెబ్రీ నామవాచక వాక్యంలోని ‘నీవే/నీవు నా దేవుడు’ భావాన్ని వర్తమాన రూపంలో ఉంచి, మూలంలో స్పష్టంగా లేని కాలాన్ని ప్రధాన పాఠ్యంలో అదనంగా నిర్ణయించదు.
theological_decisions:
- issue: చివరి క్రియారహిత వాక్యంలో కాలాన్ని పూరించడం
  choice: నీవు నా దేవుడవు
  alternative: నీవు నా దేవుడిగా ఉన్నావు
  rationale: אֵלִי אָתָּה అక్షరార్థంగా ‘నా దేవుడు నీవు’ అనే క్రియారహిత వాక్యం. సందర్భం పుట్టుకనుంచి కొనసాగుతున్న సంబంధాన్ని సూచించినా, మూలం కాలాన్ని వ్యాకరణపరంగా నిర్దేశించదు. అందువల్ల ప్రధాన పాఠ్యంలో సహజమైన వర్తమాన రూపాన్ని ఉంచి, కొనసాగింపు భావాన్ని పాదటిప్పణిలో తెలియజేశారు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని వాడాం. ‘నీ మీద వేయబడ్డాను’ అనే అసాధారణమైనా స్పష్టమైన రూపాన్ని ఉద్దేశపూర్వకంగా నిలిపి, మూలంలోని రూపకాన్ని వ్యాఖ్యానాత్మకంగా ‘నీకు అప్పగించబడ్డాను’గా మార్చలేదు. ‘గర్భం’ మరియు ‘కడుపు’ ద్వారా హెబ్రీలోని రెండు వేరు పదాల వ్యత్యాసాన్ని కాపాడాం.
