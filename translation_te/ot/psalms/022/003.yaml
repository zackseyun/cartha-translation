  text: Yet you are holy[a], enthroned on the praises of Israel.
translation:
  language: te
  text: అయినా నీవు పరిశుద్ధుడవు; ఇశ్రాయేలు స్తుతులపై సింహాసనాసీనుడవై ఉన్నావు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలు స్తుతులలో నివసిస్తున్నావు.” హీబ్రూ కృదంతానికి “కూర్చోవడం” లేదా “నివసించడం” అనే భావాలు ఉండవచ్చు; ఈ కావ్య సందర్భంలో “సింహాసనాసీనుడవై ఉండడం” అనే రాజసంబంధమైన భావం చక్కగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: అయినా నీవు
  rationale: ముందున్న విలాపానికి భిన్నంగా దేవుని స్థిరమైన పరిశుద్ధతను చూపే వ్యతిరేక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, స్వతంత్ర ద్వితీయ పురుష సర్వనామాన్నీ నిలుపుతుంది.
- source_word: קָדוֹשׁ
  choice: పరిశుద్ధుడవు
  rationale: దేవుని పరిశుద్ధతను సూచించే ప్రామాణికమైన, సహజమైన తెలుగు పదం; కేవలం ‘ప్రత్యేకపరచబడినవాడు’ అనే పరిమిత భావానికి కుదించదు.
- source_word: יֹשֵׁב
  choice: సింహాసనాసీనుడవై ఉన్నావు
  rationale: ఈ కృదంతానికి అక్షరార్థంగా ‘కూర్చున్న/నివసిస్తున్న’ అనే భావాలు ఉన్నా, దేవుని గురించి వాడిన ఈ కావ్య సందర్భంలో రాజుగా ఆసీనుడై ఉండే చిత్రణను స్పష్టంగా నిలుపుతుంది.
- source_word: תְּהִלּוֹת
  choice: స్తుతులు
  rationale: హీబ్రూ బహువచనాన్ని నిలుపుతూ, పలుమార్లు వ్యక్తమయ్యే స్తుతులను సహజంగా సూచిస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన రూపంలో వ్యక్తినామాన్ని లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: יֹשֵׁב תְּהִלּוֹת יִשְׂרָאֵל అనే పదబంధం భావం
  choice: దేవుడు ఇశ్రాయేలు స్తుతులపై సింహాసనాసీనుడై ఉన్నట్లు రాజసంబంధమైన కావ్యచిత్రణ
  alternative: దేవుడు ఇశ్రాయేలు స్తుతులలో నివసిస్తున్నాడు
  rationale: హీబ్రూ కృదంతం ‘కూర్చోవడం/నివసించడం’ అనే రెండు భావాలకు వీలు కల్పిస్తుంది. ప్రధాన పాఠం రాజసంబంధమైన చిత్రణను నిలుపుతుంది; పాదసూచిక నిజమైన మరో సాధ్యార్థాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కావ్య శైలిని వాడాం. ‘సింహాసనాసీనుడు’ అనే పదం రాజసంబంధమైన రూపకాన్ని కాపాడుతుంది; ప్రత్యామ్నాయమైన ‘నివసించడం’ పాదసూచికలో ఉంచబడింది.
