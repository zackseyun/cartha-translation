  text: I will declare your name to my brothers[a]; in the midst of the assembly I will praise you.
translation:
  language: te
  text: 'నీ నామాన్ని నా సహోదరులకు[a] ప్రకటిస్తాను;

    సభ మధ్యలో నిన్ను స్తుతిస్తాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సందర్భంలో కుటుంబ సంబోధన సమావేషకంగా ఉద్దేశించబడితే, ‘నా సహోదర సహోదరీలకు.’ హెబ్రీ మూలంలో అక్షరార్థంగా ‘నా సహోదరులకు’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפְּרָה
  choice: ప్రకటిస్తాను
  rationale: פיעל రూపంలోని ספר ఇక్కడ తెలియజేయడం లేదా ప్రకటించడం అనే భావాన్ని ఇస్తుంది. తరువాతి పాదంలోని బహిరంగ స్తుతికి సమాంతరంగా ‘ప్రకటిస్తాను’ సహజంగా సరిపోతుంది.
- source_word: שִׁמְךָ
  choice: నీ నామాన్ని
  rationale: దేవుని వెల్లడైన స్వభావం, కీర్తి అనే విస్తృత భావం కలిగిన హెబ్రీయుల ‘నామం’ అనే రూపకాన్ని నిలుపుతుంది.
- source_word: לְאֶחָי
  choice: నా సహోదరులకు
  rationale: మూలంలోని పుంలింగ బహువచన బంధుత్వపదాన్ని ఖచ్చితంగా నిలుపుతుంది. ఆధునిక గౌరవప్రద తెలుగు శైలిలో ‘సహోదరులు’ అనేది ‘సోదరులు’ కంటే కొద్దిగా కావ్యోచితంగా కూడా సరిపోతుంది.
- source_word: בְּתוֹךְ
  choice: మధ్యలో
  rationale: సమూహం నడుమ జరిగే బహిరంగ ప్రకటన అనే స్థలార్థాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: קָהָל
  choice: సభ
  rationale: సమకూడిన సమూహాన్ని సూచించే קהל కు ‘సభ’ స్పష్టమైన, సహజమైన తెలుగు పదం; తరువాతి కాలపు ప్రత్యేక సంఘవ్యవస్థ భావాన్ని అనవసరంగా చేర్చదు.
- source_word: אֲהַלְלֶךָּ
  choice: నిన్ను స్తుతిస్తాను
  rationale: פיעל రూపంలోని הלל కు నేరుగా ‘స్తుతించు’ అనే అర్థం సరిపోతుంది; మూలంలో స్పష్టంగా లేని గానభావాన్ని చేర్చదు.
theological_decisions:
- issue: బహిరంగ ఆరాధన సందర్భంలోని పుంలింగ బహువచన బంధుత్వపదం
  choice: నా సహోదరులకు
  alternative: నా సహోదర సహోదరీలకు
  rationale: హెబ్రీ మూలం అక్షరార్థంగా పుంలింగ బహువచనమైన ‘నా సహోదరులకు’ అని చెబుతుంది. సందర్భంలో అది విస్తృత కుటుంబ లేదా సమాజార్థంలో సమావేషకంగా గ్రహించబడవచ్చు; అయితే ఆ విస్తరణను ప్రధాన పాఠ్యంలో చేర్చకుండా పాదటిప్పణిలో సూచించడం మూలరూపాన్నీ సందర్భసాధ్యతనూ రెండింటినీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తనకు తగిన గౌరవప్రదమైన, స్వల్ప కావ్యాత్మక శైలి. పాదాల సమాంతర నిర్మాణాన్ని నిలిపి, అనవసర వివరణాత్మక విస్తరణను నివారించాం.
