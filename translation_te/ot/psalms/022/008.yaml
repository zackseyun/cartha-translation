revisions:
- from: “నిన్ను నీవు యాహ్వేకు అప్పగించుకో[a]! ఆయన ఇతన్ని రక్షించుగాక! ఇతన్ని విడిపించుగాక! ఎందుకంటే ఆయన ఇతనిలో ఆనందిస్తున్నాడు కదా!”
  to: “నిన్ను నీవు యాహ్వేకు అప్పగించుకో! ఆయన ఇతన్ని రక్షించుగాక! ఇతన్ని విడిపించుగాక! ఎందుకంటే ఆయన ఇతనిని చూసి సంతోషిస్తున్నాడు!”
  rationale: 'The revision retains the source text''s deliberate person shift: the sufferer is addressed directly in the imperative, then referred to in the third person in the mocking challenge. It replaces the less idiomatic final Telugu expression with a natural equivalent for Yahweh''s taking pleasure in the person, and removes an unmarked rhetorical particle. The existing footnote remains accurate and its anchor is retained.'
