source:
  edition: WLC
  text: גֹּ֣ל אֶל יְהוָ֣ה יְפַלְּטֵ֑/הוּ יַ֝צִּילֵ֗/הוּ כִּ֘י חָ֥פֵֽץ בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/008.yaml
  text: “Commit yourself to Yahweh; let him rescue him; let him deliver him[a], since he delights in him!”
translation:
  language: te
  text: “నిన్ను నీవు యాహ్వేకు అప్పగించుకో! ఆయన ఇతన్ని రక్షించుగాక! ఇతన్ని విడిపించుగాక! ఎందుకంటే ఆయన ఇతనిని చూసి సంతోషిస్తున్నాడు!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֹּל אֶל
  choice: నిన్ను నీవు … అప్పగించుకో
  rationale: גֹּל అనే ఆజ్ఞారూపానికి అక్షరార్థం ‘దొర్లించు’; అయితే యాహ్వే వైపు దొర్లించడం అనే ఈ నుడికారంలో తనను లేదా తన వ్యవహారాన్ని ఆయనకు అప్పగించడం భావం ఉంది. తరువాతి మూడవ పురుష సర్వనామాలతో ఉన్న ఎగతాళి ధోరణిని అలాగే ఉంచుతూ, ప్రారంభంలోని ప్రత్యక్ష సంబోధనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని వ్యక్తిగత నామరూపాన్ని తెలుగులో లిప్యంతరీకరించింది.
- source_word: יְפַלְּטֵהוּ
  choice: ఆయన ఇతన్ని రక్షించుగాక
  rationale: פלט పియేల్ రూపం ప్రమాదం నుండి తప్పించడం లేదా రక్షించడం అనే భావాన్ని ఇస్తుంది. మూడవ పురుష ప్రత్యయాన్ని ‘ఇతన్ని’గా స్పష్టంగా చూపించి, ఎగతాళి చేస్తున్నవారి ముందున్న బాధితుణ్ణి సూచించింది.
- source_word: יַצִּילֵהוּ
  choice: ఇతన్ని విడిపించుగాక
  rationale: נצל హిఫీల్ రూపం విడిపించడం లేదా ప్రమాదం నుండి బయటకు తీయడం అనే భావం ఇస్తుంది. ముందున్న ‘రక్షించు’తో సమాంతరతను ఉంచుతూనే పదభేదాన్ని కాపాడింది.
- source_word: כִּי חָפֵץ בּוֹ
  choice: ఎందుకంటే ఆయన ఇతనిలో ఆనందిస్తున్నాడు కదా
  rationale: כִּי యొక్క కారణార్థాన్ని ‘ఎందుకంటే’తో, חפץ ב యొక్క ‘ఒకరిలో ఆనందించు/సంతోషించు’ భావాన్ని ‘ఇతనిలో ఆనందిస్తున్నాడు’తో వ్యక్తం చేసింది. ‘కదా’ వాక్యంలోని హేళనాత్మక సవాలు సహజంగా వినిపించడానికి తోడ్పడుతుంది.
theological_decisions:
- issue: ప్రారంభ ఆజ్ఞ మరియు తరువాతి మూడవ పురుష సూచనలు
  choice: మొదట బాధితుణ్ణి నేరుగా సంబోధిస్తూ ‘నిన్ను నీవు … అప్పగించుకో’ అని, తరువాత అతని గురించి ‘ఇతన్ని’ అని మూడవ పురుషంలో కొనసాగించడం
  alternative: మొత్తం వాక్యాన్ని మూడవ పురుషంలో ‘ఇతన్ని యాహ్వేకు అప్పగించండి’ అని చేయడం
  rationale: మసొరేటిక్ పాఠంలోని גֹּל రెండవ పురుష ఏకవచన ఆజ్ఞ; అయితే తరువాతి రెండు క్రియలకు మూడవ పురుష కర్మప్రత్యయాలు ఉన్నాయి. ఈ ఆకస్మిక వ్యక్తి మార్పును సరిచేయకుండా ఉంచడం మూలపాఠంలోని హేళనాత్మక నాటకీయతను, నిజమైన వ్యాకరణ ఉద్రిక్తతను కాపాడుతుంది.
- issue: חָפֵץ בּוֹ లో సంబంధ భావం
  choice: ‘ఆయన ఇతనిలో ఆనందిస్తున్నాడు’
  alternative: ‘ఆయనకు ఇతనంటే ఇష్టం’
  rationale: ‘ఆనందిస్తున్నాడు’ అనే రూపం חפץ యొక్క ప్రీతి/ఆనంద భావాన్ని, בּוֹ యొక్క ‘అతనిలో’ నిర్మాణాన్ని మరింత సమీపంగా నిలుపుతుంది; దాన్ని కేవలం సాధారణ ఇష్టంగా పలుచన చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కావ్యోచిత ప్రత్యక్ష వాక్యంగా రూపొందించబడింది. ‘రక్షించుగాక/విడిపించుగాక’ రూపాలు హేళనలోని సవాలు లేదా వ్యంగ్య అనుమతిని తెలియజేస్తాయి. ‘ఇతన్ని’ అనేది మాట్లాడేవారి ఎదుట ఉన్న బాధితుణ్ణి సూచించి, రెండవ పురుషం నుండి మూడవ పురుషానికి మూలపాఠంలో ఉన్న మార్పును స్పష్టంగా నిలుపుతుంది.
