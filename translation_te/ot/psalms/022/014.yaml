  yaml_path: translation/ot/psalms/022/014.yaml
  text: I am poured out like water[a], and all my bones are out of joint; my heart has become like wax, melted within me.
translation:
  language: te
  text: నేను నీళ్లలా కుమ్మరించబడ్డాను; నా ఎముకలన్నీ విడిపోయాయి. నా హృదయం మైనంలా అయింది; అది నా అంతర్భాగాల్లో[a] కరిగిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నా అంతర్భాగాల మధ్య.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמַּיִם
  choice: నీళ్లలా
  rationale: כ ఉపసర్గ సూచించే పోలికను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: נִשְׁפַּכְתִּי
  choice: నేను కుమ్మరించబడ్డాను
  rationale: నిఫాల్ రూపంలోని కర్మణి భావాన్ని, పూర్తిగా ఒలికిపోయిన స్థితిని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְהִתְפָּרְדוּ כָּל עַצְמוֹתַי
  choice: నా ఎముకలన్నీ కీళ్లనుండి విడిపోయాయి
  rationale: פרד యొక్క విడిపోవడం అనే ప్రాథమిక భావాన్ని ఎముకల సందర్భంలో సహజంగా తెలియజేస్తుంది; ‘కీళ్లనుండి’ అనేది సందర్భానుగుణంగా అంతర్లీనమైన భావాన్ని స్పష్టం చేస్తుంది.
- source_word: הָיָה לִבִּי כַּדּוֹנָג
  choice: నా హృదయం మైనంలా అయింది
  rationale: ఫలిత స్థితిని సూచించే הָיָה భావాన్నీ, మైనపు ఉపమానాన్నీ నేరుగా నిలుపుతుంది.
- source_word: נָמֵס
  choice: కరిగిపోయింది
  rationale: మైనం అనే ఉపమానానికి సరిపోయే מסס యొక్క ‘కరుగు’ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בְּתוֹךְ מֵעָי
  choice: నా అంతరంగంలో
  rationale: מֵעִים అనే శరీరాంతర్భాగాల పదానికి ఉన్న అంతర్గత, విసెరల్ భావాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది; మరింత అక్షరార్థ రూపం పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: అంతర్గత వేదనకు సంబంధించిన శరీరాత్మక వ్యక్తీకరణ
  choice: నా అంతరంగంలో
  alternative: నా కడుపులోని అంతర్భాగాల్లో
  rationale: హీబ్రూ పదంలోని శరీరాత్మక తీవ్రతను పూర్తిగా ఆధ్యాత్మికీకరించకుండా, ప్రధాన పాఠ్యంలో సహజమైన తెలుగు వాడి, అక్షరార్థాన్ని పాదసూచికలో కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తన కవిత్వానికి తగిన గంభీరతతో, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. మూలంలోని మూడు శరీరాత్మక చిత్రాలు—కుమ్మరించబడటం, ఎముకలు విడిపోవటం, హృదయం మైనంలా కరగటం—కాపాడబడ్డాయి.
