  text: All who see me mock me[a]; they open wide the lip[b]; they shake the head.
translation:
  language: te
  text: నన్ను చూసేవారంతా నన్ను ఎగతాళి చేస్తున్నారు; పెదవి విరుస్తున్నారు[a]; తల ఊపుతున్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధం అక్షరార్థంగా పెదవిని తెరవడం లేదా చాచడం వంటి భావాన్ని ఇస్తుంది; ఇది ధిక్కారాన్ని చూపే ముఖసంజ్ఞ. ‘పెదవి చాచి వెక్కిరిస్తున్నారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘తల ఆడిస్తున్నారు’ అని కూడా అనువదించవచ్చు. ఇది హేళనను తెలిపే సంజ్ఞ; సువార్తల శ్రమవృత్తాంతాల్లో కూడా ఈ సంజ్ఞ ప్రతిధ్వనిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: כָּל רֹאַי
  choice: నన్ను చూసేవారంతా
  rationale: כָּל అనే సమగ్రతను, רֹאַי అనే ‘నన్ను చూసేవారు’ అనే కృదంత భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יַלְעִגוּ לִי
  choice: నన్ను ఎగతాళి చేస్తున్నారు
  rationale: לעג యొక్క అపహాస్యపూర్వకమైన హేళన భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; కీర్తనలోని సజీవ విలాప స్వరానికి వర్తమాన కొనసాగింపు రూపం సరిపోతుంది.
- source_word: יַפְטִירוּ בְשָׂפָה
  choice: పెదవి విరుస్తున్నారు
  rationale: హీబ్రూ పదబంధంలోని పెదవి-సంబంధిత శారీరక చిత్రాన్ని కాపాడుతూ, ధిక్కారాన్ని తెలిపే సహజమైన తెలుగు ప్రయోగాన్ని ఉపయోగిస్తుంది. క్రియ యొక్క ఖచ్చితమైన కదలిక అనిశ్చితమైనందున ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: יָנִיעוּ רֹאשׁ
  choice: తల ఊపుతున్నారు
  rationale: తలను కదిలించడం ద్వారా హేళన లేదా తిరస్కారం చూపే హీబ్రూ సంజ్ఞకు సహజమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: తరువాతి క్రైస్తవ వ్యాఖ్యానంలో మెస్సీయకు అన్వయం
  choice: వచనాన్ని మొదట బాధపడుతున్న కీర్తనకర్త మాటలుగానే అనువదించడం
  alternative: సువార్తల శ్రమవృత్తాంతాల్లో ఈ సంజ్ఞకు ఉన్న ప్రతిధ్వనిని ప్రధాన వచనంలోనే స్పష్టంగా చూపించడం
  rationale: హీబ్రూ వచనం స్వయంగా బాధపడుతున్న వక్తకు ఎదురైన అపహాస్యాన్ని వర్ణిస్తుంది. తరువాతి గ్రంథ సంబంధాన్ని అనువాద పదాల్లో ముందుగానే చేర్చకుండా, అవసరమైన చోట పాదటిప్పణిలో మాత్రమే సూచించడం మూలపాఠానికి న్యాయం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సరళంగా, అయితే కీర్తన విలాపానికి తగిన గంభీరతతో ఉంది. సమాంతర క్రియలకు కొనసాగింపు వర్తమాన రూపాన్ని ఉపయోగించి దృశ్యాన్ని సజీవంగా ఉంచింది.
