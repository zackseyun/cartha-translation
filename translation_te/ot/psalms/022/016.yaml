id: PSA.22.16
reference: Psalms 22:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֥י סְבָב֗וּ/נִי כְּלָ֫בִ֥ים עֲדַ֣ת מְ֭רֵעִים הִקִּיפ֑וּ/נִי כָּ֝/אֲרִ֗י יָדַ֥/י וְ/רַגְלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/016.yaml
  text: For dogs have surrounded me[a]; a company of evildoers has encircled me[b]; like a lion are my hands and my feet.
translation:
  language: te
  text: 'ఎందుకంటే కుక్కలు నన్ను చుట్టుముట్టాయి;

    దుష్టుల గుంపు నన్ను ఆవరించింది;

    సింహంలా—నా చేతులు, నా పాదాలు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన పాఠసాక్ష్యాల ఆధారంగా—మృత సముద్ర గ్రంథప్రతులు మరియు సెప్టుయజింటుతో సహా—దీనిని “వారు నా చేతులను, నా పాదాలను పొడిచారు” (లేదా “తవ్వారు”) అని చదువుతారు. మసొరెటిక్ పాఠంలో ఉన్న “సింహంలా—నా చేతులు, నా పాదాలు” అనే పదబంధం వాక్యనిర్మాణపరంగా కఠినమైనది.
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఈ విలాపానికి కారణాన్ని లేదా వివరణను పరిచయం చేసే సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: סְבָבוּנִי
  choice: నన్ను చుట్టుముట్టాయి
  rationale: סבב అనే క్రియలోని ‘చుట్టుముట్టు, చుట్టూ చేరి ఉండు’ అనే భావాన్ని, సందర్భంలో కొనసాగుతున్న ఫలితంతో కూడిన పూర్తయిన శత్రుత్వ చర్యగా వ్యక్తం చేస్తుంది.
- source_word: כְּלָבִים
  choice: కుక్కలు
  rationale: శత్రువులకు రూపకంగా వాడినప్పటికీ, మూలంలోని బలమైన చిత్రాన్ని వ్యాఖ్యానంగా మార్చకుండా యథాతథంగా ఉంచుతుంది.
- source_word: עֲדַת מְרֵעִים
  choice: దుష్టుల గుంపు
  rationale: עֲדָהలోని సమూహ భావాన్నీ, מְרֵעִיםలోని చెడు చేసేవారు అనే భావాన్నీ సాధారణ పాఠకులకు సహజంగా అందిస్తుంది.
- source_word: הִקִּיפוּנִי
  choice: నన్ను ఆవరించింది
  rationale: ముందున్న ‘చుట్టుముట్టాయి’తో సమాంతరతను నిలిపి, అదే పదాన్ని పునరావృతం చేయకుండా చుట్టూ మూసివేయడం అనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: כָּאֲרִי
  choice: సింహంలా
  rationale: మసొరెటిక్ పాఠంలోని ‘సింహంలా’ అనే పదరూపాన్ని ప్రధాన పాఠంలో నిలిపింది. దాని తరువాత క్రియ లేకపోవడం వల్ల కలిగే వాక్యనిర్మాణ కఠినతను డాష్ ద్వారా కనిపించేలా ఉంచి, ఊహించిన చర్యను చేర్చలేదు.
- source_word: יָדַי וְרַגְלָי
  choice: నా చేతులు, నా పాదాలు
  rationale: శరీర భాగాలను నేరుగా అనువదిస్తూ, ముందున్న కఠినమైన క్రియారహిత పదబంధంతో వాటి సంబంధాన్ని ఉద్దేశపూర్వకంగా పూర్తిగా నిర్ధారించదు.
theological_decisions:
- issue: כָּאֲרִי అనే మసొరెటిక్ పాఠానికీ, ప్రాచీన సాక్ష్యాల్లో కనిపించే ‘వారు పొడిచారు/తవ్వారు’ అనే పాఠానికీ మధ్య ఉన్న పాఠభేదం
  choice: ప్రధాన పాఠంలో ‘సింహంలా’
  alternative: ‘వారు నా చేతులను, నా పాదాలను పొడిచారు’ లేదా ‘తవ్వారు’
  rationale: అందుబాటులో ఉన్న వచనాధారాల్లో మసొరెటిక్ పాఠం కఠినమైనదైనా దాన్ని సులభతరం చేసి ఒక క్రైస్తవ వ్యాఖ్యానాన్ని ప్రధాన పాఠంలో ప్రవేశపెట్టలేదు. అయితే ప్రత్యామ్నాయ పఠనం ప్రాచీనమైనదీ, పాఠవిమర్శాపరంగా మరియు దైవశాస్త్రపరంగా ప్రాముఖ్యమైనదీ కావడంతో దాన్ని పాదసూచికలో స్పష్టంగా నమోదు చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గంభీరతతో సంక్షిప్త కవితా పంక్తులు వాడబడ్డాయి. మూలంలోని రూపకాలు అలాగే ఉంచబడ్డాయి. చివరి క్రియారహిత పదబంధంలోని నిజమైన అస్పష్టతను సహజంగా తొలగించకుండా డాష్‌తో సూచించబడింది.
