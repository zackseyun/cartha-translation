id: PSA.22.26
reference: Psalms 22:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יֹאכְל֬וּ עֲנָוִ֨ים וְ/יִשְׂבָּ֗עוּ יְהַֽלְל֣וּ יְ֭הוָה דֹּ֣רְשָׁ֑י/ו יְחִ֖י לְבַבְ/כֶ֣ם לָ/עַֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/026.yaml
  text: The afflicted will eat and be satisfied[a]; those who seek him will praise Yahweh[c][b]. May your hearts live forever.
translation:
  language: te
  text: దీనులు తిని తృప్తి పొందుతారు[a][c]; ఆయనను వెదికేవారు యహ్వేను స్తుతిస్తారు. మీ హృదయం ఎప్పటికీ జీవించుగాక![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దీనులు’ అనే పదాన్ని ‘బాధపడినవారు,’ ‘అణగారినవారు,’ ‘పేదవారు’ లేదా ‘వినయస్థులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'హెబ్రీలో అక్షరార్థంగా ‘మీ హృదయం’ అని ఉంది: ‘హృదయం’ ఏకవచనం, ‘మీ’ మాత్రం బహువచనం. ఇది సంబోధించబడిన సమాజపు అంతరంగ జీవాన్ని సూచించే సమష్టి ఏకవచనం కావచ్చు.'
    reason: lexical_alternative
  - marker: c
    text: ఈ కీర్తన సందర్భంలో తినడం బలి లేదా మొక్కుబడి విందును సూచిస్తుండవచ్చు; అయితే ఈ వచనం దానిని స్పష్టంగా చెప్పదు.
    reason: cultural_note
lexical_decisions:
- source_word: עֲנָוִים
  choice: దీనులు
  rationale: ఈ పదం బాధలకు గురైనవారు, అణగారినవారు, పేదవారు, వినయస్థులు అనే భావాలను సందర్భానుసారంగా సూచించగలదు. కీర్తనలోని బాధనుంచి విమోచనకు సాగే సందర్భంలో ‘దీనులు’ ఆ సామాజిక, అనుభవపూర్వక భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: יֹאכְלוּ וְיִשְׂבָּעוּ
  choice: తిని తృప్తి పొందుతారు
  rationale: రెండు క్రియల భవిష్యత్ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; తినడాన్ని రూపకంగా మార్చకుండా, సమృద్ధిగా తృప్తి చెందే భావాన్ని నిలుపుతుంది.
- source_word: יְהַלְלוּ
  choice: స్తుతిస్తారు
  rationale: పియేల్ క్రియలోని స్తుతి, ఆరాధన స్పందనను సూటిగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, హెబ్రీ వ్యక్తిగత నామానికి తెలుగు లిప్యంతరీకరణగా ఉంచింది.
- source_word: דֹּרְשָׁיו
  choice: ఆయనను వెదికేవారు
  rationale: దైవాన్ని నిరంతరం ఆశ్రయిస్తూ వెదికే వారి భావాన్ని సహజంగా తెలిపి, ప్రత్యయానికి ముందున్న యహ్వేనే సూచనగా నిలుపుతుంది.
- source_word: יְחִי
  choice: జీవించుగాక
  rationale: ఈ సందర్భంలోని జస్సివ్ ఆశీర్వాద లేదా ఆకాంక్ష భావాన్ని తెలుగులోని ఆశీర్వచన రూపంతో వ్యక్తం చేస్తుంది.
- source_word: לְבַבְכֶם
  choice: మీ హృదయాలు
  rationale: హెబ్రీలో ‘హృదయం’ ఏకవచనమైనా, ప్రత్యయం బహువచన సమూహాన్ని ఉద్దేశిస్తుంది. తెలుగులో సహజమైన బహువచనం సమాజంలోని వారి అంతరంగ జీవాన్ని తెలియజేస్తుంది.
- source_word: לָעַד
  choice: ఎప్పటికీ
  rationale: అంతంలేని లేదా నిరంతర కాలవ్యాప్తిని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: చివరి వాక్యంలో సంబోధన మరియు ‘హృదయం’ సంఖ్య
  choice: ‘మీ హృదయాలు ఎప్పటికీ జీవించుగాక’ అని రెండవ పురుష బహువచన సంబోధనను, ఆశీర్వచన భావాన్ని నిలుపడం
  alternative: ‘మీ హృదయం ఎప్పటికీ జీవించుగాక’ అనే హెబ్రీ సమష్టి ఏకవచనాన్ని యథాతథంగా ఉంచడం
  rationale: హెబ్రీ నామవాచకం ఏకవచనమైనా దానికి రెండవ పురుష బహువచన ప్రత్యయం ఉంది; అది సమూహాన్ని ఉద్దేశించిన సమష్టి ఏకవచనం. తెలుగులో బహువచనం సహజంగా ఉండి, ఆరాధక సమాజానికి నేరుగా పలికే ఆశీర్వాదాన్ని కాపాడుతుంది.
- issue: తినడం యొక్క స్వభావం
  choice: తినడం, తృప్తి పొందడం అని మాత్రమే ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: బలి లేదా మొక్కుబడి విందులో తిని తృప్తి పొందడం అని స్పష్టీకరించడం
  rationale: విస్తృత సందర్భం బలి సంబంధమైన విందును సూచించవచ్చు; అయితే ఈ వచనం దానిని స్పష్టంగా చెప్పదు. అందువల్ల వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన ఆరాధనా శైలిని వాడాం. ‘జీవించుగాక’ ఆశీర్వచన స్వరాన్ని నిలుపుతుంది; ‘యహ్వే’ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరిస్తుంది.
