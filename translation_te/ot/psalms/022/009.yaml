  to: ఎందుకంటే, గర్భం నుండి నన్ను బయటికి తీసినవాడివి నీవే; నా తల్లి రొమ్ముల దగ్గర నన్ను భద్రంగా ఉంచినవాడివి నీవే.[a]
  rationale: The revision preserves the source structure, emphasis, and concrete maternal-nursing image while using ‘భద్రంగా’ for the chosen sense of God-given security. The alternative ‘నమ్మకం’ reading remains in the footnote, preserving the lexical ambiguity without making a doctrinal determination.
