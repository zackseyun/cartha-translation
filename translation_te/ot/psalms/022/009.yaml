  yaml_path: translation/ot/psalms/022/009.yaml
  text: For you are the one who brought me out from the womb[a], making me secure at my mother’s breasts.
translation:
  language: te
  text: ఎందుకంటే, గర్భం నుండి నన్ను బయటికి తీసినవాడివి నీవే; నా తల్లి రొమ్ముల దగ్గర నన్ను భద్రంగా ఉంచినవాడివి నీవే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా తల్లి రొమ్ముల దగ్గర నాకు నమ్మకం కలిగించినవాడివి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న విన్నపం లేదా స్తుతికి కారణాన్ని పరిచయం చేస్తుంది; కీర్తనలోని తార్కిక ప్రవాహాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אַתָּה
  choice: నీవే
  rationale: హెబ్రీలోని స్పష్ట సర్వనామపు ఉద్ఘాటనను నిలుపుతూ, కార్యం చేసినవాడు దేవుడే అని తెలియజేస్తుంది.
- source_word: גֹחִי
  choice: నన్ను బయటికి రప్పించినవాడివి
  rationale: ప్రసవ సందర్భంలో గర్భం నుండి బయటికి వచ్చేలా చేయడం అనే స్పష్టమైన జనన చిత్రాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: מִבָּטֶן
  choice: గర్భంలోనుండి
  rationale: మూలంలోని విభక్తి సంబంధాన్నీ, జనన సందర్భాన్నీ నేరుగా వ్యక్తపరుస్తుంది.
- source_word: מַבְטִיחִי
  choice: నన్ను నిశ్చింతగా ఉంచినవాడివి
  rationale: హిఫిల్ రూపానికి భద్రత లేదా నమ్మకం కలిగించడం అనే భావవ్యాప్తి ఉంది. పాలుతాగే శిశువు సందర్భంలో చైతన్యపూర్వక విశ్వాసాన్ని బలవంతంగా ఆపాదించకుండా, దేవుడు కలిగించిన భద్రతను ఈ ఎంపిక సహజంగా తెలియజేస్తుంది.
- source_word: עַל
  choice: దగ్గర
  rationale: తల్లి రొమ్ముల వద్ద పాలుతాగే సందర్భాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తూ మూలంలోని స్థాన సంబంధాన్ని నిలుపుతుంది.
- source_word: שְׁדֵי
  choice: రొమ్ములు
  rationale: హెబ్రీ నామవాచకంలోని నిర్దిష్ట శరీరార్థాన్ని అనవసరమైన సభ్యోక్తి లేకుండా ఆధునిక ప్రామాణిక తెలుగులో అందిస్తుంది.
- source_word: אִמִּי
  choice: నా తల్లి
  rationale: మొదటి పురుష ఏకవచన స్వామ్య ప్రత్యయాన్ని సహజ తెలుగు నిర్మాణంలో నిలుపుతుంది.
theological_decisions:
- issue: מַבְטִיחִי అనే పదాన్ని శిశువు యొక్క స్పష్టమైన ‘నమ్మకం’గా అనువదించాలా, లేక విస్తృతమైన భద్రత/నిశ్చింతగా అనువదించాలా
  choice: నన్ను నిశ్చింతగా ఉంచినవాడివి
  alternative: నాకు నమ్మకం కలిగించినవాడివి
  rationale: వచనం జననం నుంచీ, తల్లి రొమ్ముల దగ్గర ఉన్న శిశుదశలోనూ దేవుని సంరక్షణను వర్ణిస్తుంది. అందువల్ల అభివృద్ధి చెందిన చైతన్యపూర్వక శిశు విశ్వాసం అనే సిద్ధాంత నిర్ణయాన్ని చొప్పించకుండా భద్రత, నిశ్చింత అనే concrete భావాన్ని ప్రధాన పాఠ్యంలో ఉంచాం. ‘నమ్మకం కలిగించడం’ పదపరంగా సాధ్యమైన, సంప్రదాయబద్ధమైన అర్థం కాబట్టి పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగానూ, కీర్తనకు తగిన గౌరవప్రద శైలిలోనూ ఉంది. ‘నీవే’ పునరుక్తి హెబ్రీలోని ఉద్ఘాటనను తెలుగులో స్పష్టంగా నిలుపుతుంది.
