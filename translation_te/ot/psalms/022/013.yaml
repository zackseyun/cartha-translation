  naturalness: ‘చీల్చివేస్తూ గర్జించే సింహంలా వారు నాపై నోరు తెరిచారు’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, కవితాత్మక తీవ్రతతో ఉంది. ‘నోరు’ ఏకవచనం సందర్భంలో సమూహార్థంగా అర్థమవుతుంది; సింహ ఉపమానం వల్ల సాధారణ ‘నోరు తెరవడం’ అనే ప్రయోగానికి ఇక్కడ ఉద్దేశించిన శత్రుత్వ భావం స్పష్టమవుతుంది.
