  yaml_path: translation/ot/psalms/022/013.yaml
  text: They open their mouth against me like a tearing and roaring lion[a].
translation:
  language: te
  text: చీల్చివేస్తూ గర్జించే సింహంలా వారు నాపై నోరు తెరిచారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు నాపై తమ నోరు తెరిచారు—చీల్చివేస్తూ గర్జించే సింహం.” హీబ్రూలో ‘లా’ అనే స్పష్టమైన పోలిక పదం లేకుండానే సింహపు చిత్రం సంక్షిప్తంగా ఇవ్వబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּצוּ
  choice: తెరిచారు
  rationale: פצה అంటే ‘వెడల్పుగా తెరవడం.’ హీబ్రూ పరిపూర్ణ క్రియారూపాన్ని తెలుగులో సహజంగా భూతకాలంలో అనువదించాం; సందర్భంలోని బెదిరింపు భావం మొత్తం వాక్యం ద్వారా స్పష్టమవుతుంది.
- source_word: עָלַי
  choice: నాపై
  rationale: עַל ఇక్కడ శత్రుత్వంతో తనవైపు నోరు తెరవడాన్ని సూచిస్తుంది; ‘నాపై’ సంక్షిప్తంగా, సహజంగా ఆ విరోధ దిశను తెలియజేస్తుంది.
- source_word: פִּיהֶם
  choice: వారు ... నోరు
  rationale: మూలంలో ‘నోరు’ ఏకవచనంలో ఉండి బహువచన ప్రత్యయాన్ని కలిగి ఉంది. తెలుగు వాక్యనిర్మాణంలో ‘వారు నోరు తెరిచారు’ ఆ సమూహ ఏకవచన రూపాన్ని సహజంగా నిలుపుతుంది.
- source_word: אַרְיֵה
  choice: సింహంలా
  rationale: మూలంలో స్పష్టమైన ఉపమాన అవ్యయం లేకపోయినా, ‘సింహం’ అనే సంక్షిప్త సమానాధికార రూపకం సందర్భంలో పోలికగా పనిచేస్తుంది. ప్రధాన పాఠంలో ‘లా’ చేర్చడం తెలుగులో భావాన్ని స్పష్టంగా, సహజంగా చేస్తుంది; మూలంలోని సంక్షిప్త నిర్మాణాన్ని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: טֹרֵף
  choice: చీల్చివేస్తూ
  rationale: טרף యొక్క క్రియావిశేషణ రూపం సింహం ఎరను హింసాత్మకంగా చీల్చే చర్యను సూచిస్తుంది. ‘చీల్చివేస్తూ’ ఆధునిక తెలుగులో సజీవంగా, స్పష్టంగా ఉంది.
- source_word: וְשֹׁאֵג
  choice: గర్జించే
  rationale: שׁאג సింహపు గర్జనకు వాడే సాధారణ క్రియ. ‘గర్జించే’ దాని ప్రత్యక్షమైన, సహజమైన తెలుగు సమానం.
