  text: אֱֽלֹהַ֗/י אֶקְרָ֣א י֭וֹמָם וְ/לֹ֣א תַעֲנֶ֑ה וְ֝/לַ֗יְלָה וְֽ/לֹא דֽוּמִיָּ֥ה לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/002.yaml
  text: My God[a], I cry out by day, but you do not answer, and by night[b], but I have no rest.
translation:
  language: te
  text: నా దేవా, పగటివేళ నేను మొరపెడుతున్నాను, కానీ నీవు జవాబివ్వడం లేదు; రాత్రివేళ నాకు నిశ్శబ్దం లేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాకు విశ్రాంతి లేదు.” హీబ్రూలో అక్షరార్థంగా, “నాకు నిశ్శబ్దం లేదు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: నా దేవా
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న ప్రత్యక్ష సంబోధనను సహజమైన తెలుగు సంబోధన రూపంలో వ్యక్తం చేస్తుంది.
- source_word: אֶקְרָא
  choice: నేను మొరపెడుతున్నాను
  rationale: విలాప సందర్భంలో קרא సాధారణంగా పిలవడం కంటే ఆర్తిగా దేవునికి మొరపెట్టడాన్ని సూచిస్తుంది.
- source_word: יוֹמָם
  choice: పగలంతా
  rationale: పగటివేళ జరుగుతున్న నిరంతర మొరను తెలుగులో సహజంగా తెలియజేస్తూ, తరువాతి ‘రాత్రివేళ’తో సమాంతరతను నిలుపుతుంది.
- source_word: וְלֹא תַעֲנֶה
  choice: కాని నీవు జవాబివ్వడం లేదు
  rationale: హీబ్రూ సంధి ఇక్కడ ఫిర్యాదులోని వ్యతిరేక భావాన్ని కలిగి ఉంది; ‘కాని’ దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְלַיְלָה
  choice: రాత్రివేళ కూడా
  rationale: పగలు–రాత్రి సమాంతరతను స్పష్టంగా ఉంచుతుంది; ‘కూడా’ రాత్రిలోనూ మొర కొనసాగుతోందనే ఎలిప్టికల్ భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וְלֹא דֽוּמִיָּה לִי
  choice: నాకు మౌనమే లేదు
  rationale: דומיה యొక్క ప్రాథమిక ‘మౌనం/నిశ్శబ్దం’ చిత్రాన్ని కాపాడుతుంది; ‘విశ్రాంతి లేదు’ అనే భావవ్యాఖ్యను ప్రధాన పాఠ్యంలోకి తేవదు.
theological_decisions:
- issue: చివరి పదబంధం וְלֹא דֽוּמִיָּה לִי యొక్క అర్థం
  choice: కీర్తనకర్తకు మౌనం లేదని పేర్కొనడం
  alternative: నాకు విశ్రాంతి లేదు
  rationale: דומיה యొక్క సాధారణ అర్థం మౌనం లేదా నిశ్శబ్దం. దీనిని ‘జవాబు లేదు’గా మార్చడం పగటి వాక్యాన్ని అనవసరంగా పునరుక్తి చేస్తుంది; ‘విశ్రాంతి లేదు’ సాధ్యమైన సందర్భార్థమైనా మరింత వ్యాఖ్యాత్మకం. మూలంలోని కవితాత్మక ఉద్వేగాన్ని ప్రధాన పాఠ్యం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన విలాప శైలి. ‘నా దేవా’ ప్రత్యక్ష సంబోధనను, ‘మొరపెడుతున్నాను’ ఆర్తిని, అర్ధవిరామం పగలు–రాత్రి కవితా సమాంతరతను స్పష్టంగా చూపుతాయి.
