revisions:
- from: నా దేవా, పగలంతా నేను మొరపెడుతున్నాను, కాని నీవు జవాబివ్వడం లేదు; రాత్రివేళ కూడా నాకు మౌనమే లేదు.[a]
  to: నా దేవా, పగటివేళ నేను మొరపెడుతున్నాను, కానీ నీవు జవాబివ్వడం లేదు; రాత్రివేళ నాకు నిశ్శబ్దం లేదు.[a]
  rationale: The revision preserves the Hebrew poetic contrast of day and night and its deliberately spare final statement, while using natural modern Telugu. It does not resolve the final phrase interpretively as 'rest' in the main text; that viable contextual rendering remains in the footnote.
