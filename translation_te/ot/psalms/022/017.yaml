source:
  edition: WLC
  text: אֲסַפֵּ֥ר כָּל עַצְמוֹתָ֑/י הֵ֥מָּה יַ֝בִּ֗יטוּ יִרְאוּ בִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/017.yaml
  text: I can count all my bones[a]; they look[b], they stare at me.
translation:
  language: te
  text: నా ఎముకలన్నిటినీ నేను లెక్కించగలను[a]; వారు చూస్తారు; నన్ను తేరి చూస్తారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ఎముకలన్నిటినీ నేను లెక్కిస్తాను.” హీబ్రూ క్రియకు “లెక్కించు,” “మళ్లీ చెప్పు,” లేదా “వివరించు” అనే అర్థాలు ఉండవచ్చు; అయితే “నా ఎముకలన్నిటినీ” అనే కర్మతో ఇక్కడ ఒక్కొక్కటిగా లెక్కించడం అనే అర్థమే ఎక్కువగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూలో చూడడాన్ని తెలిపే రెండు క్రియలు ఉద్ఘాటన కోసం జతగా ఉన్నాయి: “వారు చూస్తారు; వారు నన్ను చూస్తారు.” “తేరి చూస్తారు” రెండవ క్రియలోని నిలకడైన చూపు భావాన్ని తెలుగులో వ్యక్తం చేస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפֵּר
  choice: నేను లెక్కించగలను
  rationale: פיעל రూపంలోని ספרకు ‘లెక్కించు’ లేదా ‘వివరించు’ అనే అర్థాలు ఉండవచ్చు. ‘నా ఎముకలన్నిటినీ’ అనే కర్మతో ఇక్కడ ఒక్కొక్కటిగా లెక్కించగల స్థితి భావం సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: כָּל
  choice: అన్నిటినీ
  rationale: హీబ్రూలోని సంపూర్ణత భావాన్ని సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: עַצְמוֹתָי
  choice: నా ఎముకలు
  rationale: మూలంలోని స్పష్టమైన శారీరక చిత్రణను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా యథాతథంగా ఉంచుతుంది.
- source_word: הֵמָּה
  choice: వారు
  rationale: స్వతంత్ర సర్వనామం చూసేవారిని స్పష్టంగా, కొంత ఉద్ఘాటనతో సూచిస్తుంది.
- source_word: יַבִּיטוּ
  choice: తదేకంగా చూస్తూ
  rationale: ఈ క్రియ శ్రద్ధగా లేదా నిలకడగా చూడడాన్ని సూచిస్తుంది; తరువాతి ראו క్రియతో కలిసిన తీవ్రతను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יִרְאוּ
  choice: ఉంటారు
  rationale: ముందున్న ‘చూస్తూ’తో కలిసి జతగా వచ్చిన రెండు దర్శన క్రియల నిరంతర, గాఢ దృష్టి భావాన్ని తెలుగులో ఒక సహజ క్రియాబంధంగా అందిస్తుంది; రెండవ క్రియ ప్రత్యేక పదంగా కనిపించకపోయినా దాని బలాన్ని ‘తదేకంగా’ మరియు కొనసాగింపు రూపం మోస్తాయి.
- source_word: בִי
  choice: నన్ను
  rationale: చూడడం అనే తెలుగు క్రియతో సహజంగా ద్వితీయా విభక్తి వాడి, వారి చూపు వక్తమీదే నిలిచిందని తెలియజేస్తుంది.
theological_decisions:
- issue: క్రైస్తవ సంప్రదాయంలోని మెస్సీయ సంబంధ అన్వయం
  choice: సిలువవేతనానికి ప్రత్యేకమైన పదాలను చేర్చకుండా హీబ్రూ విలాప కవిత్వ భావానుసారం అనువదించడం
  alternative: క్రీస్తు శ్రమలను మరింత ప్రత్యక్షంగా సూచించే సంప్రదాయాధారిత పదప్రయోగం
  rationale: కీర్తన 22కు క్రైస్తవ అన్వయంలో గాఢ ప్రాముఖ్యత ఉన్నప్పటికీ, ఈ వాక్యంలోని హీబ్రూ పాఠం కనిపిస్తున్న శారీరక క్షీణతను, చూస్తున్నవారి గాఢ దృష్టిని వర్ణిస్తుంది. అదనపు క్రూసిఫిక్షన్ పదజాలం లేకుండా అనువదించడం మూలపాఠాన్ని కాపాడి, విస్తృత గ్రంథసంబంధ అన్వయానికి స్థలం ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు స్పష్టంగా, అయితే కీర్తనకు తగిన గంభీరతతో రూపకల్పన చేయబడింది. ‘తదేకంగా చూస్తూ ఉంటారు’ అనే సహజ తెలుగు క్రియాబంధం హీబ్రూలోని జత దర్శన క్రియల ఉద్ఘాటనను మోస్తుంది.
