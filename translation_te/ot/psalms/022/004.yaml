translation:
  language: te
  text: 'నీయందు మా పితరులు[a] నమ్మకం ఉంచారు;

    వారు నమ్మకం ఉంచారు, నీవు వారిని విడిపించావు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మా పూర్వీకులు.’ హీబ్రూలో అక్షరార్థంగా ‘మా తండ్రులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּךָ
  choice: నిన్ను
  rationale: בְּ ప్రత్యయం నమ్మకానికి వ్యక్తిగత లక్ష్యాన్ని సూచిస్తుంది. తెలుగులో ‘నమ్ముకొను’ క్రియతో ‘నిన్ను’ సహజంగా ఉండి, మూలంలో లేని ‘నిన్నే’ అనే ప్రత్యేకతను చేర్చదు.
- source_word: בָּטְחוּ
  choice: నమ్ముకున్నారు
  rationale: בטח అనేది భరోసాతో నమ్మడం లేదా ఆధారపడడాన్ని సూచిస్తుంది. ‘నమ్ముకున్నారు’ సహజమైన ఆధునిక తెలుగు రూపం; రెండు చోట్లా అదే రూపాన్ని ఉంచడం ద్వారా హీబ్రూ పునరుక్తి నిలుస్తుంది.
- source_word: אֲבֹתֵינוּ
  choice: మా పితరులు
  rationale: ఈ పదం అక్షరార్థంగా ‘మా తండ్రులు’; సందర్భంలో గత తరాల పితరులను సూచిస్తుంది. ‘మా పితరులు’ మూలంలోని పురుషలింగ బంధుత్వ పదాన్ని నిలుపుతూ, చారిత్రక వంశపారంపర్య భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַתְּפַלְּטֵמוֹ
  choice: నీవు వారిని విడిపించావు
  rationale: פלט అంటే విడిపించడం, రక్షించడం లేదా తప్పించేటట్లు చేయడం. ‘విడిపించావు’ రక్షణ భావాన్ని స్పష్టంగా తెలియజేస్తూ, రక్షణ జరిగిన విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: אֲבֹתֵינוּ అనే పదంలోని చారిత్రక, ప్రతినిధ్య భావం
  choice: మా పితరులు
  alternative: మా పూర్వీకులు
  rationale: హీబ్రూ మూలం వ్యాకరణపరంగా పురుషలింగ బహువచన బంధుత్వ పదాన్ని ఉపయోగిస్తుంది. ప్రధాన పాఠంలో దాన్ని ‘పితరులు’గా నిలిపి, విస్తృత వంశపారంపర్య అర్థమైన ‘పూర్వీకులు’ను పాదసూచికలో ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తనకు తగిన గౌరవప్రద శైలి పాటించబడింది. హీబ్రూలోని ‘నమ్ముకున్నారు’ అనే పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం.
