source:
  edition: WLC
  text: אֵלֶ֣י/ךָ זָעֲק֣וּ וְ/נִמְלָ֑טוּ בְּ/ךָ֖ בָטְח֣וּ וְ/לֹא בֽוֹשׁוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/005.yaml
  text: To you they cried out and were delivered[b][a]; in you they trusted and were not put to shame.
translation:
  language: te
  text: నీకు మొరపెట్టుకొని వారు విడిపించబడ్డారు[a]; నిన్ను నమ్ముకొని వారు అవమానానికి గురికాలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తప్పించుకున్నారు’ లేదా ‘రక్షించబడ్డారు.’ హీబ్రూ క్రియ తప్పించుకోవడం లేదా విడిపించబడడం అనే రెండు భావాలనూ సూచించగలదు; ఇక్కడ దేవునికి చేసిన మొరకు లభించిన రక్షణను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘సిగ్గుపడలేదు’ లేదా ‘నిరాశ చెందలేదు.’ హీబ్రూ పదబంధం దేవునిపై నమ్మకం ఉంచినవారు చివరికి పరాభవం పొందలేదనే భావాన్ని తరచుగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶיךָ
  choice: నీకు
  rationale: אֶל దిశను సూచిస్తుంది; దేవుని వైపు సహాయం కోసం మొరపెట్టుకోవడాన్ని ఆధునిక తెలుగులో సహజంగా ‘నీకు’ తెలియజేస్తుంది.
- source_word: זָעֲקוּ
  choice: మొరపెట్టుకొని
  rationale: זעק ఆపదలో సహాయం కోసం చేసే తీవ్రమైన కేకను సూచిస్తుంది. ‘మొరపెట్టుకొని’ ప్రార్థనా సందర్భంలో ఆ తీవ్రతను సహజంగా నిలుపుతుంది.
- source_word: וְנִמְלָטוּ
  choice: విడిపించబడ్డారు
  rationale: מלט నిఫల్ రూపం ‘తప్పించుకోవడం’ లేదా ‘విడిపించబడడం’ అనే భావాలను కలిగి ఉంటుంది. దేవునికి చేసిన మొరకు వచ్చిన ఫలితాన్ని ఇక్కడ కర్మణి రూపం స్పష్టంగా వ్యక్తం చేస్తుంది; అయితే దేవుని కర్తృత్వాన్ని మూలపాఠం కంటే అధికంగా పేర్కొనదు.
- source_word: בְּךָ
  choice: నిన్ను
  rationale: בטח తో వచ్చిన ב విశ్వాసానికి ఆధారమైన వ్యక్తిని సూచిస్తుంది. తెలుగులో ‘నిన్ను నమ్మడం’ సహజమైన ప్రయోగం.
- source_word: בָטְחוּ
  choice: నమ్ముకొని
  rationale: בטח అంటే నమ్మడం లేదా ఆధారపడడం. ‘నమ్ముకొని’ అనే రూపం తరువాతి ఫలితంతో సంబంధాన్ని సహజంగా చూపుతుంది.
- source_word: וְלֹא בֹשׁוּ
  choice: అవమానానికి గురికాలేదు
  rationale: בוש ఇక్కడ నమ్మకం విఫలమై పరాభవం చెందడం లేదా సిగ్గుపడే స్థితికి రావడం అనే గౌరవ-అవమాన భావాన్ని కలిగి ఉంది. ఈ అనువాదం దానిని కేవలం అంతర్గత సిగ్గు భావంగా పరిమితం చేయదు.
theological_decisions:
- issue: נִמְלָטוּ సూచించే రక్షణ స్వభావం
  choice: మొరకు ప్రతిస్పందనగా విడిపించబడడం
  alternative: తామే తప్పించుకోవడం
  rationale: వారు దేవునికి మొరపెట్టుకోవడం, ఆ తరువాత విడిపించబడడం అనే వాక్యక్రమం దైవ సహాయాన్ని సూచిస్తుంది. అయినా మూలపాఠంలో కర్త స్పష్టంగా చెప్పబడనందున అనువాదం ‘దేవుడు’ అనే కర్తను చేర్చదు.
- issue: בֹשׁוּ లోని గౌరవ-అవమాన భావం
  choice: అవమానానికి గురికాలేదు
  alternative: సిగ్గుపడలేదు; నిరాశ చెందలేదు
  rationale: దేవునిపై ఉంచిన నమ్మకం విఫలమై వారు పరాభవం పొందలేదనే ఫలితార్థాన్ని ఇది నిలుపుతుంది; దానిని కేవలం భావోద్వేగ సిగ్గుగా లేదా నిరాశగా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కీర్తనాశైలిని ఉపయోగించాం. రెండు సమాంతర భాగాల్లో ‘-కొని’ నిర్మాణం ద్వారా మొర/నమ్మకం మరియు వాటి ఫలితాల సంబంధాన్ని నిలిపాం.
