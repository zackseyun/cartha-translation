source:
  edition: WLC
  text: אָכְל֬וּ וַ/יִּֽשְׁתַּחֲוּ֨וּ כָּֽל דִּשְׁנֵי אֶ֗רֶץ לְ/פָנָ֣י/ו יִ֭כְרְעוּ כָּל יוֹרְדֵ֣י עָפָ֑ר וְ֝/נַפְשׁ֗/וֹ לֹ֣א חִיָּֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/029.yaml
  text: All the prosperous of the earth will eat and bow down[c][b][a]; before him all who go down to the dust will kneel—even he who could not keep himself alive.
translation:
  language: te
  text: భూమిపై సుసంపన్నులందరూ తిని సాగిలపడతారు[a]; ఆయన సన్నిధిలో ధూళిలోకి దిగిపోయే వారందరూ మోకరిల్లుతారు[b]—తన ప్రాణాన్ని తానే నిలుపుకోలేనివాడు కూడా.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “భూమిలోని బలిసినవారందరూ.” ఇది బాగా తిని వర్ధిల్లుతున్నవారిని లేదా సుసంపన్నులను సూచించే నుడికారం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ధూళికి దిగివెళ్లే వారందరూ.” ఇక్కడ “ధూళి” మర్త్యత్వానికీ మరణానికీ హీబ్రూ ప్రతీక.
    reason: lexical_alternative
  - marker: c
    text: చివరి హీబ్రూ పదబంధం క్లిష్టమైనది. అక్షరార్థంగా, “అతడు తన ప్రాణాన్ని సజీవంగా నిలుపలేదు.” దీనిని సాధారణంగా “తన ప్రాణాన్ని తానే నిలుపుకోలేనివాడు కూడా” అని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: אָכְלוּ
  choice: తింటారు
  rationale: ఇది ఖచ్చిత రూపంలో ఉన్నప్పటికీ, కీర్తనలోని ముందుచూపుగల కవితా సందర్భంలో తరువాతి ఆరాధనా క్రియలతో కలిసి భవిష్యదర్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: సాగిలపడతారు
  rationale: ఈ క్రియ శరీరంతో వంగి సాష్టాంగపడే చిత్రాన్ని సూచిస్తూ, సందర్భంలోని ఆరాధనా భావాన్ని కూడా నిలుపుతుంది.
- source_word: כָּל דִּשְׁנֵי אֶרֶץ
  choice: భూమిపై సుసంపన్నులందరూ
  rationale: దీని అక్షరార్థం ‘భూమిలోని బలిసినవారందరూ’; ఇక్కడ బాగా తిని వర్ధిల్లుతున్న లేదా సంపన్నులైనవారిని సూచించే నుడికారంగా గ్రహించబడింది.
- source_word: לְפָנָיו
  choice: ఆయన సన్నిధిలో
  rationale: దేవుని ఎదుట లేదా ఆయన సమక్షంలో అనే సంబంధాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יִכְרְעוּ
  choice: మోకరిల్లుతారు
  rationale: మోకాళ్లు వంచడం అనే ప్రత్యేక శారీరక చిత్రాన్ని నిలుపుతూ, ముందున్న ‘సాగిలపడతారు’ అనే క్రియతో కవితాత్మక సమాంతరాన్ని కాపాడుతుంది.
- source_word: כָּל יוֹרְדֵי עָפָר
  choice: ధూళిలోకి దిగిపోయే వారందరూ
  rationale: మరణం, మర్త్యత్వం అనే హీబ్రూ చిత్రాన్ని ‘సమాధి’ అని నేరుగా వ్యాఖ్యానించకుండా ‘ధూళి’ రూపంలోనే నిలుపుతుంది.
- source_word: וְנַפְשׁוֹ לֹא חִיָּה
  choice: తన ప్రాణాన్ని తానే నిలుపుకోలేనివాడు కూడా
  rationale: క్లిష్టమైన హీబ్రూ వాక్యనిర్మాణాన్ని సహజమైన తెలుగులో అందిస్తూ, తన జీవాన్ని కాపాడుకోలేని వ్యక్తిని సూచించే సాధారణ అవగాహనను వ్యక్తం చేస్తుంది; అసలు పాఠంలోని క్లిష్టతను పాదసూచికలో తెలియజేస్తుంది.
theological_decisions:
- issue: చివరి పదబంధం וְנַפְשׁוֹ לֹא חִיָּה యొక్క వ్యాఖ్యానం
  choice: తన ప్రాణాన్ని తానే నిలుపుకోలేని వ్యక్తిని సూచిస్తుంది
  alternative: ‘అతడు తన ప్రాణాన్ని సజీవంగా నిలుపలేదు’ లేదా కర్తను నిర్దిష్టంగా చెప్పని వాక్యంగా గ్రహించవచ్చు
  rationale: హీబ్రూ వాక్యం సంక్షిప్తంగా, క్లిష్టంగా ఉంది. సందర్భం సుసంపన్నులనూ మరణానికి దిగిపోతున్నవారినీ పక్కపక్కన ఉంచుతుంది. ఎంపిక చేసిన అనువాదం అందరూ ఆయన ఎదుట మోకరిల్లుతారనే భావాన్ని తెలియజేస్తుంది; అంతకుమించిన సిద్ధాంత నిర్ణయాన్ని పాఠంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కీర్తనా శైలి వాడబడింది. ‘సాగిలపడతారు,’ ‘మోకరిల్లుతారు’ అనే వేర్వేరు క్రియల ద్వారా అసలు హీబ్రూలోని రెండు శారీరక ఆరాధనా చిత్రాలు నిలుపబడ్డాయి; ‘ధూళి’ అనే మరణ ప్రతీకను వ్యాఖ్యానించి తొలగించలేదు.
