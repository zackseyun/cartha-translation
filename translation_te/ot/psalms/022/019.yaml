id: PSA.22.19
reference: Psalms 22:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתָּ֣ה יְ֭הוָה אַל תִּרְחָ֑ק אֱ֝יָלוּתִ֗/י לְ/עֶזְרָ֥תִ/י חֽוּשָׁ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/019.yaml
  text: But you[a], O Yahweh, do not be far away; O my strength[b], hurry to help me.
translation:
  language: te
  text: అయితే నీవు, యాహ్వే, దూరంగా ఉండవద్దు; నా బలమా,[a] నా సహాయానికి త్వరపడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదానికి ఇక్కడ “నా బలం” అనే భావం సముచితం. కొందరు దీనిని “నా సహాయం” అని, లేదా—ఈ సందర్భంలో తక్కువ సంభావ్యతతో—ఆడజింకకు సంబంధించిన అక్షరార్థంలో అర్థం చేసుకున్నారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: అయితే నీవు
  rationale: ముందటి ఆపదస్థితికి విరుద్ధంగా దేవునివైపు మళ్లే బలమైన వ్యత్యాసాన్ని సంధి మరియు స్వతంత్ర సర్వనామం సూచిస్తున్నాయి.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలోని దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన రూపంలో లిప్యంతరీకరించాం.
- source_word: אַל־תִּרְחָק
  choice: దూరంగా ఉండవద్దు
  rationale: నిషేధార్థక విజ్ఞాపనలోని ప్రత్యక్షతను, רחק అనే క్రియ యొక్క ‘దూరంగా ఉండు’ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֱיָלוּתִי
  choice: నా బలమా
  rationale: సందర్భంలో దేవుణ్ణి తన బలంగా సంబోధిస్తున్న భావం అత్యంత సముచితం; పదరూపానికి సంబంధించిన ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: לְעֶזְרָתִי
  choice: నాకు సహాయం చేయడానికి
  rationale: ‘నా సహాయానికి’ అనే అక్షరార్థ దిశ/ఉద్దేశ భావాన్ని సహజమైన తెలుగు క్రియారూపంలో వ్యక్తం చేస్తుంది.
- source_word: חוּשָׁה
  choice: త్వరగా రా
  rationale: ఆజ్ఞారూపంలోని అత్యవసరతను తెలియజేస్తుంది; సందర్భం దేవుడు సహాయానికి సమీపించాలని కోరుతున్నందున తెలుగులో ‘రా’ను స్పష్టీకరించడం సహజం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం బిరుదును కాకుండా చతురక్షర దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది; కాబట్టి వ్యక్తిగత నామాన్ని తెలుగులో గుర్తించదగిన లిప్యంతరీకరణతో నిలిపాం.
- issue: אֱיָלוּתִי యొక్క భావం
  choice: నా బలమా
  alternative: నా సహాయమా; నా లేడీ/జింకా
  rationale: సహాయం కోసం చేసే విజ్ఞాపనలో ‘నా బలం’ అనే సంబోధన సందర్భానికి సరిపోతుంది. అయినప్పటికీ అరుదైన పదరూపం వల్ల కలిగే నిజమైన నిఘంటు అనిశ్చితిని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనాత్మక గౌరవాన్ని నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉండే వాక్యనిర్మాణం. మూలంలోని వ్యత్యాసం, ప్రత్యక్ష విజ్ఞాపన, అత్యవసరత భద్రపరచబడ్డాయి.
