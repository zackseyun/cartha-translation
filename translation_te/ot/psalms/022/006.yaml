  text: But I am a worm and not a man[c][b][a], scorned by mankind and despised by the people.
translation:
  language: te
  text: 'కాని నేను పురుగును, మనిషిని కాను;

    మానవుల నిందకు గురైనవాణ్ణి,[a]

    ప్రజలచేత తృణీకరించబడినవాణ్ణి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “మానవుల నింద.” అంటే, మానవుల నిందకు లక్ష్యమైనవాణ్ణి.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: కాని నేను
  rationale: వావ్ సాధారణంగా ‘మరియు’ అని అర్థమిచ్చినా, ముందున్న నమ్మకపు మాటలకు ఇక్కడ గట్టి వ్యత్యాసాన్ని చూపుతోంది. אָנֹכִי నొక్కిచెప్పే ‘నేను’.
- source_word: תוֹלַעַת
  choice: పురుగును
  rationale: అత్యంత దీనస్థితి, అవమానం అనే రూపకాన్ని సహజంగా నిలుపుతుంది; పురుగు జాతిని అనవసరంగా నిర్దిష్టపరచదు.
- source_word: וְלֹא אִישׁ
  choice: మనిషిని కాను
  rationale: తనకు మానవ గౌరవమే లేదన్నట్లుగా అనుభవిస్తున్న వక్త యొక్క తీవ్ర వ్యత్యాసాన్ని, ఏ పురుషలింగ పరిమితినీ మోపకుండా తెలుపుతుంది.
- source_word: חֶרְפַּת אָדָם
  choice: మానవుల నిందకు గురైనవాణ్ణి
  rationale: חֶרְפָּה లోని నింద, అవమానం, అపహాస్యం భావాన్ని తెలియజేస్తూ, אָדָם ను ఇక్కడ సమష్టిగా మానవులని గ్రహిస్తుంది. తెలుగు వాక్యంలో వక్త నిందకు లక్ష్యమయ్యాడనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּבְזוּי עָם
  choice: ప్రజలచేత తృణీకరించబడినవాణ్ణి
  rationale: బహిరంగంగా హీనంగా ఎంచబడి తిరస్కరించబడిన స్థితిని తెలియజేస్తుంది; עָם లోని సమష్టి ప్రజాభావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: క్రైస్తవ వ్యాఖ్యానంలో మెస్సీయ సంబంధమైన అన్వయం
  choice: వచనాన్ని హెబ్రీ కవిత్వంలోని అవమానిత వక్త మాటలుగానే అనువదించడం
  alternative: క్రీస్తును స్పష్టంగా సూచించే వివరణాత్మక పదాలను అనువాదంలో చేర్చడం
  rationale: కీర్తన 22కు నూతన నిబంధనలోనూ క్రైస్తవ సంప్రదాయంలోనూ మెస్సీయ సంబంధమైన ప్రాముఖ్యత ఉన్నా, ఈ వచనం స్వయంగా వక్త అనుభవించిన తీవ్రమైన అవమానాన్ని రూపకాలతో చెబుతుంది. మూలపాఠంలో లేని క్రీస్తు-సంబంధ పదాలను చేర్చకుండా ఆ సంబంధాన్ని విస్తృత సందర్భం ద్వారా గ్రహించనివ్వాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన కవితా శైలిని వాడాం. ‘గురైనవాణ్ణి/తృణీకరించబడినవాణ్ణి’ అనే సమాంతర నిర్మాణం హెబ్రీ పాదాల భావసామ్యాన్ని స్పష్టంగా వినిపిస్తుంది.
