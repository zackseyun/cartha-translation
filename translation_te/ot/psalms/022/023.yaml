base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/023.yaml
  text: You who fear Yahweh[a], praise him! All offspring of Jacob, honor him! Stand in awe of him, all offspring of Israel!
translation:
  language: te
  text: 'యహ్వేకు భయపడేవారలారా, ఆయనను స్తుతించండి!


    యాకోబు సంతానమంతా, ఆయనను ఘనపరచండి!


    ఇశ్రాయేలు సంతానమంతా, ఆయన పట్ల భయభక్తితో వణకండి![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనకు భయపడండి” లేదా “ఆయనను భక్తితో గౌరవించండి.” హెబ్రీ క్రియ భయంతో కూడిన భక్తిగౌరవాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי יְהוָה
  choice: యహ్వేకు భయపడేవారలారా
  rationale: ఇది యహ్వే పట్ల భయభక్తులు గలవారిని సూచించే నిర్మాణం. తరువాత వచ్చే బహువచన ఆజ్ఞల వల్ల ప్రత్యక్ష సంబోధన స్పష్టంగా ఉంది; అందువల్ల సంబోధనార్థకమైన ‘వారలారా’ను వాడాం.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ లిప్యంతరీకరణను తెలుగులో ఇచ్చాం.
- source_word: הַלְלוּהוּ
  choice: ఆయనను స్తుతించండి
  rationale: ఇది మూడవ పురుష ఏకవచన కర్మప్రత్యయం గల బహువచన ఆజ్ఞ. ఆ ప్రత్యయం ముందున్న యహ్వేను సూచిస్తుంది.
- source_word: כָּל זֶרַע יַעֲקֹב
  choice: యాకోబు సంతానమంతా
  rationale: זֶרַע ఇక్కడ సమూహార్థకంగా యాకోబు సంతతిని సూచిస్తుంది. ‘సంతానమంతా’ ఆ సమూహ భావాన్నీ כָּל యొక్క సమగ్రతనూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כַּבְּדֻהוּ
  choice: ఆయనను ఘనపరచండి
  rationale: כבד యొక్క పీయేల్ ఆజ్ఞారూపం ఇక్కడ దేవునికి తగిన ఘనత ఇవ్వమనే పిలుపు. ‘ఘనపరచండి’ ఆరాధనా సందర్భంలో సహజంగానూ సంక్షిప్తంగానూ ఉంది.
- source_word: וְגוּרוּ מִמֶּנּוּ
  choice: ఆయనకు భయభక్తులతో వణకండి
  rationale: גור దేవుని ఎదుట భయంతో కూడిన భక్తిగౌరవాన్ని వ్యక్తం చేస్తుంది. ‘భయభక్తులతో వణకండి’ ఆ తీవ్రతను నిలుపుతూ, మొదటి పాదంలోని సాధారణ లక్షణవర్ణనతో ఉన్న భేదాన్ని కూడా చూపుతుంది.
- source_word: כָּל זֶרַע יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సంతానమంతా
  rationale: ముందటి ‘యాకోబు సంతానమంతా’ అనే సమాంతర పాదానికి అనుగుణంగా సమూహార్థకమైన זֶרַעను ఒకే విధంగా అనువదించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా లిప్యంతరీకరించడం మూలపాఠ భేదాన్ని నిలుపుతుంది.
- issue: וְגוּרוּ מִמֶּנּוּలోని భయభక్తి తీవ్రత
  choice: ఆయనకు భయభక్తులతో వణకండి
  alternative: ఆయనకు భయపడండి; ఆయనను భక్తితో గౌరవించండి
  rationale: ఈ క్రియ కేవలం గౌరవాన్నే కాక భయంతో కూడిన విస్మయభక్తిని కూడా మోస్తుంది. ఎంపిక చేసిన రూపం ఆ ఉద్వేగాన్నీ, స్తుతి మరియు భయం మధ్య ఉన్న కీర్తనాత్మక ఉద్రిక్తతనూ తగ్గించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కీర్తనా శైలిని వాడాం. మూడు ఆజ్ఞల సమాంతర నిర్మాణాన్ని, ‘యాకోబు/ఇశ్రాయేలు సంతానం’ అనే కవితాత్మక సమాంతరతను నిలిపాం.
