source:
  edition: WLC
  text: לֹ֣א עַל זְ֭בָחֶי/ךָ אוֹכִיחֶ֑/ךָ וְ/עוֹלֹתֶ֖י/ךָ לְ/נֶגְדִּ֣/י תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/008.yaml
  text: I do not rebuke you for your sacrifices[a]; your burnt offerings are continually before me.
translation:
  language: te
  text: నీ బలులనుబట్టి నేను నిన్ను మందలించను[a]; నీ దహనబలులు ఎల్లప్పుడూ నా ఎదుట ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ బలుల విషయమై నేను నిన్ను గద్దించను.”
    reason: יכח మరియు עַל కలయికలోని ‘మందలించడం/గద్దించడం,’ ‘కారణంగా/విషయమై’ అనే సమీప అర్థ ప్రత్యామ్నాయాలను చూపిస్తుంది.
lexical_decisions:
- source_word: לֹא עַל זְבָחֶיךָ
  choice: నీ బలులనుబట్టి ... లేదు
  rationale: עַל ఇక్కడ మందలింపుకు కారణం లేదా ఆధారాన్ని సూచిస్తుంది. ‘నీ బలులనుబట్టి’ అనే రూపం బలులు అర్పించకపోవడమే దేవుని అభియోగమని చెప్పడం లేదనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אוֹכִיחֶךָ
  choice: నేను నిన్ను మందలించడం లేదు
  rationale: יכח హిఫిల్ రూపం ఈ సందర్భంలో న్యాయస్థాన సంబంధమైన ‘నిందారోపణ’ కంటే ‘మందలించడం/గద్దించడం’ అనే భావాన్ని ఇస్తుంది. తెలుగు వర్తమాన నిరాకరణ సందర్భంలోని కొనసాగుతున్న దైవిక ప్రకటనకు సహజంగా సరిపోతుంది.
- source_word: זְבָחֶיךָ
  choice: నీ బలులు
  rationale: זֶבַח సాధారణంగా బలిని, తరచుగా జంతుబలిని సూచిస్తుంది. ‘బలులు’ విస్తృత ఆరాధనా భావాన్ని అనవసరంగా కుదించదు.
- source_word: וְעוֹלֹתֶיךָ
  choice: నీ దహనబలులు
  rationale: עוֹלָה పూర్తిగా దహనం చేసే ప్రత్యేక బలిని సూచించే సాంకేతిక పదం; ‘దహనబలులు’ ఆధునిక తెలుగు బైబిలు వాడుకలో స్పష్టమైన సమానం.
- source_word: לְנֶגְדִּי
  choice: నా ఎదుటే
  rationale: దేవుని సన్నిధిలో లేదా దృష్టిలో ఉండటాన్ని సూచిస్తుంది. ‘ఎదుటే’ లోని ఉద్ఘాటన బలులు ఆయనకు నిరంతరం కనిపిస్తున్నాయనే సందర్భ భావాన్ని బలపరుస్తుంది.
- source_word: תָמִיד
  choice: ఎల్లప్పుడూ
  rationale: నిరంతరత లేదా క్రమంగా కొనసాగడాన్ని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
theological_decisions:
- issue: ఇశ్రాయేలు బలుల వ్యవస్థతో ఈ వచనానికి ఉన్న సంబంధం
  choice: బలులు లేకపోవడం కారణంగా దేవుడు మందలించడం లేదని వచనం చెబుతుంది; బలులన్నీ స్వతహాగా చెల్లవని తిరస్కరించడం లేదు.
  alternative: ఈ వచనం బలుల వ్యవస్థనే పూర్తిగా తిరస్కరిస్తోంది.
  rationale: రెండవ పాదం దహనబలులు ఎల్లప్పుడూ దేవుని ఎదుట ఉన్నాయని చెబుతుంది. కాబట్టి సమస్య ఆచారాల లేమి కాదని, పరిసర వచనాల్లో వెల్లడయ్యే మరింత లోతైన ఆరాధనా సమస్య అని సూచిస్తుంది.
translation_notes:
  register: సామాన్య పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. ‘దహనబలులు’ అనే ఆరాధనా సాంకేతిక పదాన్ని ఖచ్చితత్వం కోసం నిలిపి, మిగతా వాక్యాన్ని సహజమైన కానీ గంభీరమైన శైలిలో నిర్మించాం.
