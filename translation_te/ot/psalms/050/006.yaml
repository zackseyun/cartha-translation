translation:
  language: te
  text: ఆకాశాలు ఆయన నీతిని ప్రకటిస్తాయి[a]; ఎందుకంటే దేవుడే న్యాయాధిపతి. సెలా
  philosophy: optimal-equivalence
  footnotes:
