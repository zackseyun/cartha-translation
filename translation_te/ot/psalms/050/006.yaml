    text: లేదా, ‘ఆయన న్యాయాన్ని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּידוּ
  choice: ప్రకటిస్తాయి
  rationale: హిఫిల్ రూపం బహిరంగంగా తెలియజేయడం లేదా చాటడం అనే భావాన్ని ఇస్తుంది; ‘ప్రకటిస్తాయి’ కవితాత్మకమైన, గంభీరమైన ప్రకటన భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: שָׁמַיִם
  choice: ఆకాశాలు
  rationale: హీబ్రూ బహువచన రూపాన్ని కీర్తనలోని ఉన్నత కవితా శైలికి తగిన విధంగా నిలుపుతుంది.
- source_word: צִדְקוֹ
  choice: ఆయన నీతిని
  rationale: צדק దేవుని నైతిక యథార్థతను, న్యాయసమ్మతతను సూచించగలదు. ‘నీతి’ విస్తృత భావాన్ని నిలుపుతుంది; ‘న్యాయం’ అనే సందర్భోచిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు కారణాన్ని పరిచయం చేసే హీబ్రూ సంబంధాన్ని స్పష్టమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపపరంగా బహువచనంలా ఉన్నప్పటికీ, వాక్యంలోని విధేయపదం మరియు సర్వనామం ఏకవచన భావాన్ని స్పష్టం చేస్తున్నాయి.
- source_word: שֹׁפֵט
  choice: న్యాయాధిపతి
  rationale: ఇక్కడ కృదంతం నామవాచక విధేయంగా పనిచేస్తోంది; ‘న్యాయాధిపతి’ ఆ నామవాచక బలాన్ని నిలుపుతుంది.
- source_word: הוּא
  choice: దేవుడే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగు ‘-ఏ’ ప్రత్యయం సహజంగా తెలియజేస్తుంది.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఈ ఆరాధనా లేదా సంగీత సూచిక యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం కనుక అనువదించకుండా లిప్యంతరీకరించాం.
theological_decisions:
- issue: దైవిక తీర్పుతో సంబంధంలో צדק పదానికి అనువాదం
  choice: ఆయన నీతి
  alternative: ఆయన న్యాయం
  rationale: ‘నీతి’ దేవుని నైతిక యథార్థతతో పాటు ఆయన తీర్పు న్యాయసమ్మతతను కూడా కలిగి ఉండే విస్తృత భావాన్ని నిలుపుతుంది. తీర్పు సందర్భంలో ‘న్యాయం’ కూడా నిజమైన భావసాధ్యత కాబట్టి దాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తన కవిత్వానికి తగిన గంభీరతతో అనువదించబడింది. ‘దేవుడే’ ద్వారా హీబ్రూ సర్వనామ ఉద్ఘాటనను సహజంగా నిలిపాం; ‘సెలా’ను దాని అర్థం అనిశ్చితమైనందున లిప్యంతరీకరించాం.
