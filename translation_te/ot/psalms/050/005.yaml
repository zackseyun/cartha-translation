id: PSA.50.5
reference: Psalms 50:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִסְפוּ לִ֥/י חֲסִידָ֑/י כֹּרְתֵ֖י בְרִיתִ֣/י עֲלֵי זָֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/005.yaml
  text: Gather to me my faithful ones[a], those who make my covenant by sacrifice.
translation:
  language: te
  text: '“బలి అర్పణతో నాతో నిబంధన చేసుకునే నా విశ్వాసపాత్రులను[a]

    నా దగ్గరకు సమకూర్చండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “బలి మీద నా నిబంధనను కోసేవారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִסְפוּ
  choice: సమకూర్చండి
  rationale: ఇది אסף ధాతువు Qal బహువచన ఆజ్ఞారూపం. ‘సమకూర్చండి’ అనే పదం అనేక మందిని ఒకరి సన్నిధికి చేర్చాలనే ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לִי
  choice: నా దగ్గరకు
  rationale: לִי అంటే ‘నా వద్దకు/నా కోసం’ అని ఉండవచ్చు. ఈ సమాహ్వాన సందర్భంలో దేవుని సన్నిధికి చేర్చడం అనే దిశాభావాన్ని ‘నా దగ్గరకు’ స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: חֲסִידָי
  choice: నా విశ్వాసపాత్రులను
  rationale: חסיד అనే పదం భక్తితో కూడిన నిబంధన విశ్వసనీయతను సూచిస్తుంది. ‘విశ్వాసపాత్రులు’ ఆ సంబంధపరమైన నిబద్ధతను తెలియజేస్తుంది; తరువాతి కాలంలోని సాంకేతిక మతార్థాలను అనవసరంగా చేర్చదు.
- source_word: כֹּרְתֵי בְרִיתִי
  choice: నాతో నిబంధన చేసుకునే
  rationale: హీబ్రూలో అక్షరార్థంగా ‘నా నిబంధనను కోసేవారు’ అనే జాతీయ ప్రయోగం ఉంది. తెలుగులో ‘నిబంధన చేసుకోవడం’ సహజమైన సమానార్థక ప్రయోగం. మొదటి పురుష సంబంధాన్ని సహజ తెలుగులో ‘నాతో’ అని వ్యక్తం చేశాం; అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: עֲלֵי זָבַח
  choice: బలి అర్పణతో
  rationale: על ఇక్కడ నిబంధన చేయడానికీ బలి ఆచారానికీ ఉన్న సంబంధాన్ని సూచిస్తుంది. ‘బలి అర్పణతో’ సాధన లేదా ఆచారసంబంధ భావాన్ని సహజంగా తెలియజేస్తూ, కేవలం ‘బలి మీద’ అన్న అస్పష్టతను నివారిస్తుంది.
theological_decisions:
- issue: నిబంధన సందర్భంలో חֲסִידָי భావం
  choice: నా విశ్వాసపాత్రులను
  alternative: నా పరిశుద్ధులను; నా భక్తులను
  rationale: ఈ పదం దేవునితో నిబంధన సంబంధంలో నమ్మకంగా ఉండేవారిని సూచిస్తుంది. ‘విశ్వాసపాత్రులు’ నిబంధన నిబద్ధతను కాపాడుతుంది; ‘పరిశుద్ధులు’ అనే పదానికి తరువాత ఏర్పడిన సాంకేతిక మతార్థాన్ని ఇక్కడ రుద్దదు.
- issue: ‘నిబంధనను కోయడం’ అనే హీబ్రూ జాతీయ ప్రయోగం
  choice: నాతో నిబంధన చేసుకునే
  alternative: బలి మీద నా నిబంధనను కోసేవారు
  rationale: ప్రధాన వాక్యంలో అర్థమయ్యే తెలుగు జాతీయ ప్రయోగాన్ని వాడి, బలి ద్వారా నిబంధన చేయడమనే భావాన్ని నిలిపాం. హీబ్రూ రూపకాన్ని పాదసూచికలో ఇచ్చి మూలంలోని భాషాపరమైన ప్రత్యేకతను భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయితే కీర్తనలోని గంభీరమైన దైవిక సమాహ్వాన స్వరాన్ని నిలిపే విధంగా రూపొందించబడింది.
