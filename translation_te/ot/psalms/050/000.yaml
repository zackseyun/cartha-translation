base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/000.yaml
  text: A psalm of Asaph. God[a], God, Yahweh, has spoken and called the earth from the rising of the sun to its setting.
translation:
  language: te
  text: ఆసాఫు కీర్తన. దేవుడు[a], దేవుడు, యెహోవా మాట్లాడాడు; సూర్యోదయం మొదలుకొని సూర్యాస్తమయం వరకు భూమిని పిలిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు, దేవుడు, ప్రభువు”; మరికొందరు ఈ ఆరంభ దైవనామాలను “దేవతలకు దేవుడైన యెహోవా” అని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: ఆసాఫు కీర్తన
  rationale: The Hebrew may indicate a psalm belonging to, by, or associated with Asaph; the concise Telugu heading preserves that association without specifying authorship.
- source_word: אֵל אֱלֹהִים יְהוָה
  choice: దేవుడు, దేవుడు, యెహోవా
  rationale: The three divine designations are retained in sequence rather than harmonized into a single interpretive title; the footnote records the principal syntactic alternative.
- source_word: דִּבֶּר וַיִּקְרָא אָרֶץ
  choice: మాట్లాడాడు; ... భూమిని పిలిచాడు
  rationale: Uses ordinary modern Telugu while retaining both coordinated Hebrew actions and the earth as the object of the call.
- source_word: מִמִּזְרַח שֶׁמֶשׁ עַד מְבֹאוֹ
  choice: సూర్యోదయం మొదలుకొని సూర్యాస్తమయం వరకు
  rationale: A natural Telugu expression conveying the Hebrew merism from the sun's rising to its going down, indicating the whole earth.
theological_decisions:
- issue: The syntax and force of אֵל אֱלֹהִים יְהוָה
  choice: దేవుడు, దేవుడు, యెహోవా
  alternative: దేవతలకు దేవుడైన యెహోవా / దేవుడు, దేవుడు, ప్రభువు
  rationale: The Hebrew title sequence is grammatically open to more than one construal. The main text preserves its formal sequence, while the note acknowledges the common construct reading without making it definitive.
translation_notes:
  register: Modern standard Telugu in a dignified but accessible biblical register. The divine name is transliterated as “యెహోవా,” and the genuine ambiguity in the opening title sequence is preserved through a footnote.
