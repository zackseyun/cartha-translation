  text: Offer to God a sacrifice of thanksgiving[a], and fulfill your vows to the Most High.
translation:
  language: te
  text: 'దేవునికి కృతజ్ఞతా బలి[a] అర్పించు;

    సర్వోన్నతునికి నీ మొక్కుబడులు చెల్లించు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కృతజ్ఞతనే దేవునికి బలిగా అర్పించు.” ఇక్కడి హీబ్రూ పదం కృతజ్ఞతను లేదా కృతజ్ఞతార్పణ బలిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבַח
  choice: బలి అర్పించు
  rationale: זבח అనే ఆజ్ఞార్థక క్రియలోని బలిసంబంధ భావాన్ని తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לֵאלֹהִים
  choice: దేవునికి
  rationale: ל ఉపసర్గ ఇక్కడ బలి ఎవరికి అర్పించబడుతుందో సూచిస్తుంది.
- source_word: תּוֹדָה
  choice: కృతజ్ఞతా బలి
  rationale: תודה కృతజ్ఞతను లేదా కృతజ్ఞతార్పణ బలిని సూచించగలదు; ఈ ఎంపిక కృతజ్ఞతా భావాన్నీ బలి సందర్భాన్నీ నిలుపుతుంది.
- source_word: וְשַׁלֵּם
  choice: చెల్లించు
  rationale: మొక్కుబడుల సందర్భంలో שלם వాటిని నెరవేర్చడం లేదా చెల్లించడం అనే భావం ఇస్తుంది; ‘మొక్కుబడులు చెల్లించు’ ఆధునిక తెలుగులో సహజమైన ప్రయోగం.
- source_word: לְעֶלְיוֹן
  choice: సర్వోన్నతునికి
  rationale: עֶלְיוֹן అనే దైవ బిరుదును లిప్యంతరీకరించకుండా దాని అర్థంతో అనువదిస్తుంది.
- source_word: נְדָרֶיךָ
  choice: నీ మొక్కుబడులు
  rationale: బహువచన నామవాచకంలోని ద్వితీయ పురుష ఏకవచన ప్రత్యయాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: זבח మరియు תודה కలిసిన బలిసంబంధ వ్యక్తీకరణ
  choice: కృతజ్ఞతా బలి అర్పించు
  alternative: కృతజ్ఞతనే బలిగా అర్పించు; కృతజ్ఞతార్పణ అర్పించు
  rationale: హీబ్రూ పదబంధం కృతజ్ఞతను బలిగా అర్పించడాన్నో, ఒక కృతజ్ఞతార్పణ బలినో సూచించవచ్చు. ప్రధాన పాఠం రెండు కోణాలనూ సాధ్యమైనంతవరకు నిలుపుతుంది; పాదసూచిక నిజమైన పదార్థ సందిగ్ధతను తెలియజేస్తుంది.
- issue: עֶלְיוֹן అనే దైవ బిరుదు
  choice: సర్వోన్నతుడు
  alternative: ఎల్యోను
  rationale: ఇది దేవుని బిరుదుగా ‘అత్యున్నతుడు’ అనే అర్థాన్ని ఇస్తుంది; అర్థానువాదం సాధారణ పాఠకునికి భావాన్ని నేరుగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకునికి అర్థమయ్యే శైలి. ఏకవచన ఆజ్ఞారూపాన్ని నిలిపి, కవితా సమాంతరత కోసం రెండు పాదాలుగా అమర్చబడింది.
