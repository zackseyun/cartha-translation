source:
  edition: WLC
  text: כִּי לִ֥/י כָל חַיְת/וֹ יָ֑עַר בְּ֝הֵמ֗וֹת בְּ/הַרְרֵי אָֽלֶף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/010.yaml
  text: For every wild animal of the forest is mine[b][a], the cattle on a thousand hills.
translation:
  language: te
  text: 'ఎందుకంటే అడవిలోని ప్రతి మృగం నాదే;

    వెయ్యి కొండల మీదున్న పశువులూ[a] నావే.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వెయ్యి పర్వతాల మీదున్న పెద్ద జంతువులూ’ అని కూడా అనువదించవచ్చు. హీబ్రూ בְּהֵמוֹת అనే పదం పశువులనే కాక పెద్ద జంతువులను విస్తృతంగా సూచించగలదు; הַרְרֵי అంటే ‘కొండలు’ లేదా ‘పర్వతాలు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని ప్రకటనకు కారణాన్ని పరిచయం చేసే అనుసంధాన పదంగా సహజంగా ఉంది.
- source_word: לִי
  choice: నాదే
  rationale: దేవుని యాజమాన్యాన్ని తెలుగులో సహజమైన స్వామ్య విధేయంతో వ్యక్తం చేస్తుంది; నొక్కిచెప్పే భావాన్ని ‘ఏ’ నిలుపుతుంది.
- source_word: כָל חַיְתוֹ יָעַר
  choice: అడవిలోని ప్రతి మృగం
  rationale: ఏకవచన సమూహార్థక నిర్మాణంలోని పంపిణీ భావాన్ని ‘ప్రతి’ స్పష్టంగా చూపుతుంది; חַיָּה ఇక్కడ అడవి జంతువును సూచిస్తుంది.
- source_word: בְּהֵמוֹת
  choice: పశువులు
  rationale: ఈ పదం పెద్ద భూజంతువులను విస్తృతంగా సూచించగలిగినా, అడవి మృగాలకు సమాంతరంగా ఇక్కడ పశువులు అనే అర్థం సందర్భోచితం. దాని విస్తృత సాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: בְּהַרְרֵי אָלֶף
  choice: వెయ్యి కొండల మీదున్న
  rationale: సంఖ్యను యథాతథంగా నిలుపుతూ, జంతువుల స్థలాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది. הַר పర్వతం లేదా కొండ అనే రెండర్థాలు కలిగి ఉండవచ్చు.
theological_decisions:
- issue: దైవ యాజమాన్య చిత్రణ యొక్క పరిధి
  choice: అడవి మృగాలనూ కొండలపైని పశువులనూ పేర్కొంటూ సమస్త జంతుజాలంపై దేవుని యాజమాన్యాన్ని కవితాత్మకంగా ప్రకటించడం
  alternative: సరిగ్గా వెయ్యి కొండలపై ఉన్న పశువులకే పరిమితమైన అక్షరార్థ ప్రకటన
  rationale: ‘వెయ్యి కొండలు’ అనే మూల చిత్రాన్ని అలాగే ఉంచడం ద్వారా సమృద్ధి మరియు సమగ్ర యాజమాన్య భావం నిలుస్తుంది; సంఖ్యను ‘లెక్కలేనన్ని’ అని వ్యాఖ్యానాత్మకంగా మార్చలేదు.
- issue: రెండు కవితా భాగాల వ్యాకరణ సంబంధం
  choice: అర్ధవిరామంతో సమాంతర పంక్తులుగా చూపి, రెండవ భాగంలో ‘నావే’ని భావపూరణగా చేర్చడం
  alternative: రెండవ నామవాచక పదబంధాన్ని మొదటిదానికి కేవలం వివరణాత్మక అనుబంధంగా చూపడం
  rationale: హీబ్రూలో రెండవ భాగంలో క్రియాత్మక స్వామ్యపదం అంతర్భావంగా ఉంది. తెలుగులో దాన్ని పునరుక్తి చేయడం రెండు వర్గాలపై ఒకే యాజమాన్య ప్రకటనను స్పష్టం చేస్తుంది; మూలంలో లేని ‘మరియు’ని చేర్చకుండా కవితా సమాంతరతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన కవితా శైలి. రెండు హీబ్రూ భాగాల సమాంతరతను పంక్తి విభజన, అర్ధవిరామం, ‘నాదే/నావే’ పునరుక్తితో చూపించాం.
