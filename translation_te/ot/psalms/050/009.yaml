source:
  edition: WLC
  text: לֹא אֶקַּ֣ח מִ/בֵּיתְ/ךָ֣ פָ֑ר מִ֝/מִּכְלְאֹתֶ֗י/ךָ עַתּוּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/009.yaml
  text: I will not take a bull from your house[a], or goats from your pens.
translation:
  language: te
  text: 'నీ ఇంటి నుండి ఎద్దును నేను తీసుకోను;

    నీ పశువుల దొడ్ల నుండి మగ మేకలను[a] తీసుకోను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మేకపోతులను.’ హీబ్రూ పదం ప్రత్యేకంగా మగ మేకలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶקַּח
  choice: నేను తీసుకోను
  rationale: לקח అనే క్రియ యొక్క Qal అసంపూర్ణ ప్రథమ పురుష ఏకవచన రూపం לֹאతో కలిసి దేవుని నిరాకరణాత్మక ప్రకటనను సూచిస్తుంది; తెలుగులో ‘నేను తీసుకోను’ సహజంగా, దృఢంగా ఉంది.
- source_word: מִבֵּיתְךָ
  choice: నీ ఇంటి నుండి
  rationale: בַּיִת ఇక్కడ కుటుంబ సభ్యులను కాకుండా ఆరాధకుని ఇల్లు లేదా ఆస్తి పరిధిని సూచిస్తుంది; స్థలసంబంధ రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: פָר
  choice: ఎద్దును
  rationale: פָר బలి సందర్భంలో మగ పశువును, సాధారణంగా ఎద్దును సూచిస్తుంది; ‘ఎద్దు’ ఆధునిక తెలుగులో స్పష్టమైన సమానార్థకం.
- source_word: מִמִּכְלְאֹתֶיךָ
  choice: నీ పశువుల దొడ్ల నుండి
  rationale: מִכְלָאָה పశువులను ఉంచే చుట్టుముట్టిన స్థలం లేదా దొడ్డిని సూచిస్తుంది; ఏ జంతువుల దొడ్లో స్పష్టంచేయడానికి ‘పశువుల దొడ్లు’ సహజమైన ఆధునిక ప్రయోగం.
- source_word: עַתּוּדִים
  choice: మగ మేకలను
  rationale: עַתּוּדִים ప్రత్యేకంగా మగ మేకలను సూచిస్తుంది; మూలంలోని లింగవిశిష్టతను ప్రధాన పాఠ్యంలోనే నిలిపాము.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా ప్రకటనగా అనువదించబడింది. హీబ్రూ సమాంతర నిర్మాణాన్ని నిలుపుతూ, రెండవ పాదంలో సందర్భానికి అవసరమైన క్రియను తెలుగులో పునరుక్తి చేశాము.
