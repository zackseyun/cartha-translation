  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కవితా శైలి. ‘నోరు—నాలుక’ సమాంతరతను, అలాగే రెండో పాదంలోని ‘జతచేయు/అంటించు’ అనే మూలరూపంలోని అస్పష్టతను ప్రధాన పాఠం మరియు పాదసూచనలో నిలిపాం.
