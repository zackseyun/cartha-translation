review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the mouth/tongue parallelism and the basic senses of releasing speech toward evil and attaching the tongue to deceit. However, the main Telugu phrasing is somewhat calqued: ‘నోటిని చెడుకు వదులుతావు’ is not idiomatic enough in this speech context, and the second colon is clearer with a stronger Telugu expression for binding/attaching to deceit.'
  naturalness: A modest revision makes the poetic accusation natural in modern standard Telugu while retaining the Hebrew imagery. ‘చెడును పలకడానికి నీ నోటికి స్వేచ్ఛనిస్తావు’ clearly conveys giving one’s mouth free rein for evil speech; ‘మోసానికి కట్టిపెడతావు’ naturally conveys deliberate attachment to deceit.
  terminology: ‘చెడు’ and ‘మోసం’ are suitable, broad equivalents for רָעָה and מִרְמָה. ‘నోరు’ and ‘నాలుక’ should remain literal to preserve the Hebrew poetic parallelism.
  issues:
  - severity: medium
    issue: The phrase ‘నీ నోటిని చెడుకు వదులుతావు’ is semantically understandable but unnatural Telugu.
    rationale: Telugu normally specifies the speech-function here or uses an expression such as giving the mouth freedom. The revision does so without narrowing the moral sense of ‘evil.’
  - severity: low
    issue: ‘నీ నాలుకను మోసానికి జతచేస్తావు’ is grammatically possible but sounds mechanically translated.
    rationale: ‘కట్టిపెడతావు’ gives an idiomatic poetic expression of the Hiphil sense of making the tongue adhere/be bound to deceit.
  revised_text: చెడును పలకడానికి నీ నోటికి స్వేచ్ఛనిస్తావు[a]; నీ నాలుకను మోసానికి కట్టిపెడతావు[b].
