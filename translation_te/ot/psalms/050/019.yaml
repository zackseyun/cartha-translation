lexical_decisions:
- source_word: פִּיךָ
  choice: నీ నోటిని
  rationale: శరీరభాగాన్ని సూచించే మూలరూపాన్ని నిలుపుతూ, మాటను సూచించే హీబ్రూ రూపకాన్ని మరియు ‘నీ నాలుక’తో ఉన్న సమాంతరతను కాపాడుతుంది.
- source_word: שָׁלַחְתָּ
  choice: వదులుతావు
  rationale: ‘పంపు/విడిచిపెట్టు’ అనే మూలభావం ఇక్కడ నోటికి స్వేచ్ఛనిచ్చి చెడు మాటలు పలకడం అనే అర్థాన్ని ఇస్తుంది; తెలుగు కవితా వాక్యంలో సహజంగా ఉంటుంది.
- source_word: בְרָעָה
  choice: చెడుకు
  rationale: בְ ఉపసర్గలోని దిశ లేదా లక్ష్య భావాన్ని సంక్షిప్తంగా ఉంచి, కేవలం హానిని కాక నైతిక చెడును సూచిస్తుంది.
- source_word: וּלְשׁוֹנְךָ
  choice: నీ నాలుకను
  rationale: ‘నోరు’తో ఉన్న కవితా సమాంతరతను మరియు మూలంలోని స్పష్టమైన శరీరభాగ రూపకాన్ని నిలుపుతుంది.
- source_word: תַּצְמִיד
  choice: జతచేస్తావు
  rationale: צמד హిఫీల్ రూపంలోని ‘కలిపించు/అంటించు’ అనే causative భావాన్ని నేరుగా వ్యక్తపరుస్తుంది; నాలుకను మోసంతో అనుసంధానించే క్రియాశీల చర్యను చూపుతుంది.
- source_word: מִרְמָה
  choice: మోసానికి
  rationale: మాటల సందర్భంలో deception/deceit అనే విస్తృత భావానికి సాధారణమైన, సహజమైన ఆధునిక తెలుగు పదం.
