id: PSA.50.22
reference: Psalms 50:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בִּֽינוּ נָ֣א זֹ֭את שֹׁכְחֵ֣י אֱל֑וֹהַּ פֶּן אֶ֝טְרֹ֗ף וְ/אֵ֣ין מַצִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/022.yaml
  text: Understand this[a], please, you who forget God, lest I tear you apart, and there be no one to rescue.
translation:
  language: te
  text: దేవుణ్ణి మరచిపోయేవారలారా, దయచేసి దీన్ని గ్రహించండి; లేకపోతే నేను మిమ్మల్ని చీల్చివేస్తాను, రక్షించేవారెవరూ ఉండరు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “నేను చీల్చివేస్తాను; రక్షించేవారెవరూ ఉండరు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּֽינוּ
  choice: గ్రహించండి
  rationale: בין క్రియ యొక్క బహువచన ఆజ్ఞారూపం వివేచించి అర్థం చేసుకోవాలని పిలుస్తుంది. ‘గ్రహించండి’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ పిలుపు బలాన్ని నిలుపుతుంది.
- source_word: נָא
  choice: దయచేసి
  rationale: ఈ అవ్యయం కేవలం కాలసూచన కాక, విజ్ఞాపనతో కూడిన అత్యవసర ప్రేరణను తెలియజేస్తుంది.
- source_word: זֹאת
  choice: దీన్ని
  rationale: ముందున్న దైవిక హెచ్చరికను సూచించే నిర్దేశక సర్వనామం; ‘హెచ్చరిక’ వంటి వివరణను చేర్చకుండా మూలంలోని సంక్షిప్తతను కాపాడుతుంది.
- source_word: שֹׁכְחֵי אֱל֑וֹהַּ
  choice: దేవుణ్ణి మరచిపోయేవారలారా
  rationale: కర్తరి కృదంతం సంబోధనగా వాడబడింది. తెలుగు సంబోధన రూపం కొనసాగుతున్న స్వభావాన్ని, ప్రత్యక్ష పిలుపును సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֱל֑וֹהַּ
  choice: దేవుణ్ణి
  rationale: సాధారణ ఏకవచన దైవనామం; మూలంలో లేని విశేషణాన్ని జోడించలేదు.
- source_word: פֶּן
  choice: లేకపోతే
  rationale: ప్రతికూల పరిణామాన్ని హెచ్చరించే సంధానార్థం. ఆధునిక తెలుగులో ‘లేకపోతే’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: אֶ֝טְרֹ֗ף
  choice: నేను మిమ్మల్ని చీల్చివేస్తాను
  rationale: טרף వేటమృగం ఎరను చీల్చే బలమైన రూపకాన్ని సూచిస్తుంది. సందర్భంలో అంతర్లీనంగా ఉన్న కర్మను తెలుగులో ‘మిమ్మల్ని’ అని స్పష్టపరచడం సహజం.
- source_word: וְ/אֵ֣ין מַצִּֽיל
  choice: రక్షించేవాడెవడూ ఉండడు
  rationale: నిషేధాత్మక అస్తిత్వ నిర్మాణం మరియు נצל హిఫీల్ కృదంతం కలసి రక్షకుడు ఎవరూ లేరనే భావాన్ని వ్యక్తం చేస్తాయి.
theological_decisions:
- issue: אֶטְרֹף లోని దైవిక తీర్పు రూపకం
  choice: దేవుడు ‘నేను మిమ్మల్ని చీల్చివేస్తాను’ అని నేరుగా పలికే వేటమృగ రూపకాన్ని నిలుపడం.
  alternative: ‘నేను మిమ్మల్ని నాశనం చేస్తాను’ లేదా ‘పట్టుకుంటాను’ అని రూపకాన్ని మృదుపరచడం.
  rationale: హీబ్రూ పదం ఎరను చీల్చే సజీవమైన, తీవ్రమైన దృశ్యాన్ని ఇస్తుంది. దాన్ని సాధారణ ‘నాశనం’గా మార్చడం హెచ్చరిక తీవ్రతను తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన హెచ్చరిక స్వరం, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. మూలంలోని ప్రత్యక్ష సంబోధనను, విజ్ఞాపనను, తీర్పు రూపక తీవ్రతను నిలిపింది.
