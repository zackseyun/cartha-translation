- from: దొంగను చూసినప్పుడు, నీవు అతణ్ణి మెచ్చుకున్నావు[a]; వ్యభిచారులతో నీ వంతు ఉండేది[b].
  to: దొంగను చూసినట్లయితే, నీవు అతనిని ఆమోదించావు[a]; వ్యభిచారులతో నీ భాగం ఉండేది[b].
  rationale: The revision restores the conditional force of אִם, uses ‘ఆమోదించావు’ for the favorable/accepting sense of רצה, and slightly improves the naturalness of the preserved ‘portion’ metaphor. No doctrinal or interpretive expansion has been introduced.
