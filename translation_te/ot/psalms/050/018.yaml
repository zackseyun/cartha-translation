source:
  edition: WLC
  text: אִם רָאִ֣יתָ גַ֭נָּב וַ/תִּ֣רֶץ עִמּ֑/וֹ וְ/עִ֖ם מְנָאֲפִ֣ים חֶלְקֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/018.yaml
  text: If you saw a thief[a], you were pleased with him[b], and your portion was with adulterers.
translation:
  language: te
  text: దొంగను చూసినట్లయితే, నీవు అతనిని ఆమోదించావు[a]; వ్యభిచారులతో నీ భాగం ఉండేది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతనిపట్ల సంతోషించావు’ లేదా ‘అతనిని మెచ్చుకున్నావు.’ హీబ్రూ క్రియ అనుకూలతను, అంగీకారాన్ని లేదా సంతోషాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘వ్యభిచారులతో నీ భాగం ఉండేది.’ ఇది వారితో తనను కలుపుకొని, వారి సహవాసంలో పాలుపంచుకోవడాన్ని సూచిస్తుంది.
    reason: idiom_explanation
lexical_decisions:
- source_word: אִם רָאִיתָ
  choice: చూసినప్పుడు
  rationale: אִם సాధారణంగా షరతును సూచించినా, ఇక్కడ గత ప్రవర్తనను నిందాపూర్వకంగా ఉదాహరించే సందర్భంలో ‘చూసినప్పుడు’ అనే కాలసూచక ప్రయోగం సహజమైన తెలుగు భావాన్ని ఇస్తుంది.
- source_word: גַנָּב
  choice: దొంగను
  rationale: גנב అంటే ఇతరులది దొంగిలించే వ్యక్తి; ‘దొంగ’ నేరుగా, సాధారణంగా అర్థమయ్యే సమానార్థకం.
- source_word: וַתִּרֶץ עִמּוֹ
  choice: అతణ్ణి మెచ్చుకున్నావు
  rationale: רצה ఇక్కడ సంతోషించడం, అనుకూలంగా చూడడం లేదా ఆమోదించడం అనే భావాన్ని ఇస్తుంది. ‘మెచ్చుకున్నావు’ ఆ అనుకూలతను సంక్షిప్తంగా వ్యక్తం చేస్తుంది; కేవలం అతనితో వెళ్లినట్టు చెప్పదు.
- source_word: מְנָאֲפִים
  choice: వ్యభిచారులతో
  rationale: క్రియావిశేషణాత్మక రూపం ఇక్కడ వ్యభిచారం చేసే వారిని వ్యక్తులుగా సూచిస్తుంది; ‘వ్యభిచారులు’ సంక్షిప్తమైన, గౌరవప్రదమైన ఆధునిక పదం.
- source_word: חֶלְקֶךָ
  choice: నీ వంతు ఉండేది
  rationale: חלק అంటే వంతు, భాగం లేదా వాటా. ఇక్కడ అది వ్యభిచారులతో తనను కలుపుకొని వారి సహవాసంలో పాలుపంచుకోవడాన్ని సూచించే రూపకం; అనువాదం ఆ రూపకాన్ని నిలుపుతుంది.
