review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders ‘thief,’ the approving/favorable sense of וַתִּרֶץ עִמּוֹ, and the ‘portion/share’ metaphor with adulterers. However, ‘చూసినప్పుడు’ changes the explicit conditional particle אִם (‘if’) into a temporal ‘when.’ A conditional Telugu construction should be retained.
  naturalness: The wording is generally clear and modern. ‘నీ వంతు ఉండేది’ is understandable but slightly less idiomatic for the Hebrew metaphor than ‘నీ భాగం ... ఉండేది.’ ‘అతనిని ఆమోదించావు’ is a more precise modern expression of favorable acceptance than ‘మెచ్చుకున్నావు,’ which can suggest mere admiration.
  terminology: ‘దొంగ,’ ‘వ్యభిచారులు,’ and ‘భాగం’ are appropriate modern-standard Telugu terms. The footnotes correctly explain the lexical range and the idiomatic force, with anchors placed on the relevant expressions.
  issues:
  - severity: medium
    issue: Conditional force of אִם is not retained.
    rationale: ‘చూసినప్పుడు’ means ‘when/upon seeing,’ whereas אִם explicitly introduces a condition or case (‘if’). ‘చూసినట్లయితే’ preserves the source wording without making an unwarranted interpretive change.
  - severity: low
    issue: ‘మెచ్చుకున్నావు’ can be weaker or more admiring than the favorable-acceptance sense of רצה.
    rationale: In this accusatory context, ‘అతనిని ఆమోదించావు’ more directly conveys approval/acceptance while remaining natural Telugu.
  revised_text: దొంగను చూసినట్లయితే, నీవు అతనిని ఆమోదించావు[a]; వ్యభిచారులతో నీ భాగం ఉండేది[b].
