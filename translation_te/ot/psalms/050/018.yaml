  register: ఆధునిక ప్రామాణిక తెలుగులో నిందాపూర్వక కవితా స్వరాన్ని నిలిపి, సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఉపయోగించాం. రెండో పాదంలోని హీబ్రూ రూపకాన్ని ప్రధాన పాఠ్యంలో అలాగే ఉంచి పాదటిప్పణిలో వివరించాం.
