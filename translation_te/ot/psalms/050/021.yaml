id: PSA.50.21
reference: Psalms 50:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֤לֶּה עָשִׂ֨יתָ וְֽ/הֶחֱרַ֗שְׁתִּי דִּמִּ֗יתָ הֱֽיוֹת אֶֽהְיֶ֥ה כָמ֑וֹ/ךָ אוֹכִיחֲ/ךָ֖ וְ/אֶֽעֶרְכָ֣ה לְ/עֵינֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/021.yaml
  text: You did these things[a], and I kept silent; you thought that I was altogether like you[b]. I will rebuke you and set the case before your eyes.
translation:
  language: te
  text: నీవు ఇవన్నీ చేశావు, నేను మౌనంగా ఉన్నాను. నేను నీలాగే ఉంటానని నీవు అనుకున్నావు.[a] నేను నిన్ను గద్దించి, నీ కళ్ల ఎదుట క్రమంగా ఉంచుతాను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను నీలాగే ఉన్నానని నీవు అనుకున్నావు.” హీబ్రూ నిర్మాణాన్ని కాలభావంలో కొద్దిగా భిన్నంగా వ్యక్తం చేయవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీ కళ్ల ఎదుట దానిని క్రమంగా ఉంచుతాను.” హీబ్రూలో దేనిని ఉంచుతాడో స్పష్టంగా చెప్పలేదు; సందర్భంలో అది అతని పనులు లేదా అతనిమీదున్న ఆరోపణలు కావచ్చు.
    reason: implicit_object
lexical_decisions:
- source_word: אֵלֶּה עָשִׂיתָ
  choice: నీవు ఇవన్నీ చేశావు
  rationale: బహువచన సూచన సర్వనామం ముందటి వచనాల్లో పేర్కొన్న అపరాధాలను తిరిగి సూచిస్తుంది; ‘ఇవన్నీ’ ఆధునిక తెలుగులో సహజంగా ఆ అనుసంధానాన్ని తెలియజేస్తుంది.
- source_word: וְהֶחֱרַשְׁתִּי
  choice: అయినా నేను మౌనంగా ఉన్నాను
  rationale: హీబ్రూ సంధిని సందర్భానుగుణమైన వ్యతిరేక భావంతో ‘అయినా’గా వ్యక్తం చేశాం. క్రియ దేవుడు కొంతకాలం స్పందించకుండా మౌనంగా ఉండడాన్ని సూచిస్తుంది; అది సమ్మతి అని పాఠ్యం చెప్పదు.
- source_word: דִּמִּיתָ
  choice: నీవు అనుకున్నావు
  rationale: ఇక్కడ דמה ఒక తప్పుడు మానసిక అంచనా లేదా ఊహను సూచిస్తుంది. సాధారణ ఆధునిక తెలుగులో ‘అనుకున్నావు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: הֱיוֹת אֶהְיֶה כָמוֹךָ
  choice: నేను కూడా నీలాంటివాడినేనని
  rationale: ఇన్ఫినిటివ్‌తో కూడిన ఇంపర్ఫెక్ట్, అనుకున్న విషయాన్ని తెలియజేస్తుంది. ‘కూడా’ మరియు ‘-నే’ తాను దేవునితో ఒకే రకమైనవాడనన్న వక్తి యొక్క తప్పుడు సమీకరణానికి తగిన ఉద్ఘాటన ఇస్తాయి; కాలసంబంధమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אוֹכִיחֲךָ
  choice: నేను నిన్ను గద్దించి
  rationale: יכח హిఫిల్ రూపం నైతికంగా మందలించడం, తప్పును ఎదుటపెట్టడం అనే భావాన్ని కలిగి ఉంది. ‘గద్దించు’ సందర్భానికి తగిన బరువును కలిగి ఉండి, న్యాయపరమైన ‘దోషిగా నిర్ధారించు’ అనే అధిక వ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: וְאֶעֶרְכָה לְעֵינֶיךָ
  choice: నీ కళ్ల ఎదుట వాటిని వరుసగా ఉంచుతాను
  rationale: ערך యొక్క ప్రాథమిక భావం ‘క్రమపరచు/వరుసగా పెట్టు’. హీబ్రూలో కర్మ స్పష్టంగా చెప్పబడలేదు; సందర్భాన్ని బట్టి ‘వాటిని’ అని చేర్చి, ఆరోపణలను బహిరంగంగా అతని ఎదుట ఉంచే భావాన్ని సహజ తెలుగులో వ్యక్తం చేశాం.
theological_decisions:
- issue: దేవుని మౌనం—సమ్మతా, తాత్కాలిక సహనమా
  choice: మౌనం తరువాత వచ్చే గద్దింపుతో దానికి దేవుని ఆమోదం లేదని పాఠ్య క్రమమే చూపేలా అనువదించాం.
  alternative: ‘నేను మౌనంగా ఉన్నాను’ అనే మాటను మాత్రమే ఉంచి, దాని స్వభావాన్ని పూర్తిగా నిర్దిష్టం చేయకుండా చదవవచ్చు.
  rationale: మూలపాఠ్యం మౌనానికి కారణాన్ని ప్రత్యక్షంగా పేర్కొనదు. కాబట్టి ప్రధాన పాఠ్యంలో ‘సహించాను’ అని అర్థాన్ని విస్తరించలేదు; తరువాతి గద్దింపు దాని నైతిక అర్థాన్ని తెలియజేయనిచ్చాం.
- issue: దేవుడు మనిషిలాంటివాడని తప్పుడు ఊహ
  choice: ‘నేను కూడా నీలాంటివాడినేనని’ అని వర్తమాన/స్థితి భావంతో ఇచ్చాం.
  alternative: ‘నేను నీలాంటివాడిని అవుతానని’ లేదా ‘నీలాంటివాడిగా ఉంటానని’ అనువదించవచ్చు.
  rationale: హీబ్రూ నిర్మాణం కాలభావాన్ని తెలుగులో ఒకే విధంగా నిర్బంధించదు. సందర్భంలో ప్రధానంగా ఉన్నది కాలం కాదు, దేవుని స్వభావాన్ని తన స్వభావంతో సమానపరిచిన తప్పుడు ఊహ; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో సంరక్షించాం.
- issue: ఆరోపణలను క్రమంగా ఎదుట ఉంచే న్యాయసంబంధ ఛాయ
  choice: ‘వాటిని వరుసగా ఉంచుతాను’ అని మూల క్రియ యొక్క దృశ్యరూపాన్ని నిలిపాం.
  alternative: ‘నీ మీదున్న ఆరోపణను నీ కళ్ల ఎదుట ఉంచుతాను’ అని న్యాయసంబంధ భావాన్ని స్పష్టం చేయవచ్చు.
  rationale: సందర్భంలో న్యాయవిచారణ ఛాయ ఉన్నప్పటికీ, హీబ్రూ వాక్యంలో కర్మ వ్యక్తంగా లేదు. అందువల్ల ‘కేసు/ఆరోపణ’ అని ప్రధాన పాఠ్యంలో నిర్దిష్టం చేయకుండా నిజమైన అనిశ్చితిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సామాన్య పాఠకులకు సులభమైన శైలిని వాడాం. దేవునికి ఏకవచన సంబోధనను మూలంలోని 2ms రూపానికి అనుగుణంగా ఉంచాం. ‘మౌనంగా ఉన్నాను,’ ‘గద్దించి,’ ‘నీ కళ్ల ఎదుట’ వంటి పదబంధాలు కవితాత్మక గౌరవాన్ని నిలుపుతాయి; ‘కేసు’ వంటి ఆధునిక న్యాయపదాన్ని ప్రధాన పాఠ్యంలో నివారించి మూలంలోని అంతర్లీన కర్మను పాదటిప్పణిలో వివరించాం.
