id: PSA.50.11
reference: Psalms 50:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יָ֭דַעְתִּי כָּל ע֣וֹף הָרִ֑ים וְ/זִ֥יז שָׂ֝דַ֗י עִמָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/011.yaml
  text: I know every bird of the mountains[b][a], and the creatures of the field are with me.
translation:
  language: te
  text: పర్వతాల్లోని ప్రతి పక్షి నాకు తెలుసు; నా పొలంలోని జీవులు[a] నాతో ఉన్నాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా పొలంలో సంచరించేవి,” లేదా “నా పొలంలోని అడవి జంతువులు.” ఇక్కడి హెబ్రీ పదం זִיז అర్థనిర్ణయం కష్టమైనది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నావే.” హెబ్రీలో మరింత అక్షరార్థంగా “నాతో ఉన్నాయి” అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: నాకు తెలుసు
  rationale: ידע యొక్క Qal perfect ప్రథమ పురుష ఏకవచన రూపం ఇక్కడ స్థిరమైన, సమగ్రమైన జ్ఞానాన్ని తెలుపుతుంది; అందువల్ల సహజమైన తెలుగు వర్తమాన స్థితి ప్రయోగం ఎంచుకోబడింది.
- source_word: כָּל עוֹף
  choice: ప్రతి పక్షి
  rationale: ఏకవచన సమూహార్థక నామంతో ఉన్న כָּל యొక్క పంపిణీ భావాన్ని ‘ప్రతి’ స్పష్టంగా తెలియజేస్తుంది; עוֹף ఇక్కడ సహజంగా ‘పక్షి’ అని అనువదించబడింది.
- source_word: הָרִים
  choice: పర్వతాల్లోని
  rationale: మూలంలోని బహువచన పర్వత ప్రాంత భావాన్ని సహజమైన ఆధునిక తెలుగు సంబంధ ప్రయోగంతో నిలిపింది.
- source_word: זִיז
  choice: జీవులు
  rationale: ఇది అర్థనిర్ణయం కష్టమైన హెబ్రీ పదం. బహిరంగ ప్రదేశంలో సంచరించే లేదా కదిలే జీవులను సూచించవచ్చు; జాతిని అతిగా నిర్దిష్టం చేయకుండా ‘జీవులు’ విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: שָׂדַי
  choice: పొలంలోని
  rationale: కవితా సమాంతరంలో שׂדה సూచించే పొలం లేదా బహిరంగ గ్రామీణ ప్రదేశాన్ని సాధారణ పాఠకునికి సహజంగా అందిస్తుంది.
- source_word: עִמָּדִי
  choice: నాతో ఉన్నాయి
  rationale: ‘నాతో/నా సమీపంలో’ అనే మూలార్థాన్ని నేరుగా నిలిపి, సందర్భంలో సూచితమయ్యే స్వామ్య భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టీకరించకుండా ఉంచింది.
theological_decisions:
- issue: עִמָּדִי లో దైవిక స్వామ్య సూచన
  choice: నాతో ఉన్నాయి
  alternative: నావే
  rationale: సందర్భం సృష్టిపై దేవుని సార్వభౌమ సంబంధాన్ని సూచించినా, హెబ్రీ వచనం నేరుగా ‘నావే’ అని చెప్పదు. కాబట్టి మూలంలోని సంబంధ ప్రయోగాన్ని నిలిపి, స్వామ్య భావాన్ని పాఠకుడు సందర్భం ద్వారా గ్రహించేలా ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన కవితా వాక్య నిర్మాణం వాడబడింది. ‘జీవులు’ అనే విస్తృత పదం మూలంలోని క్లిష్టమైన זִיז ను అతిగా నిర్దిష్టం చేయకుండా ఉంచుతుంది; రెండు నిజమైన ప్రత్యామ్నాయాలు పాదటిప్పణుల్లో ఇవ్వబడ్డాయి.
