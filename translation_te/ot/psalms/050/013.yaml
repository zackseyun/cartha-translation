source:
  edition: WLC
  text: הַֽ֭/אוֹכַל בְּשַׂ֣ר אַבִּירִ֑ים וְ/דַ֖ם עַתּוּדִ֣ים אֶשְׁתֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/013.yaml
  text: Do I eat the flesh of bulls[a], or drink the blood of goats?
translation:
  language: te
  text: నేను ఎద్దుల మాంసం తింటానా, లేక మగ మేకల రక్తం తాగుతానా?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאוֹכַל
  choice: నేను ... తింటానా?
  rationale: ప్రశ్నార్థక కణంతో కూడిన ప్రథమ పురుష ఏకవచన క్రియ ఇది అలంకారిక ప్రశ్న అని తెలియజేస్తుంది; ఆధునిక తెలుగులో ఈ రూపం సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: בְּשַׂר
  choice: మాంసం
  rationale: బలి సందర్భంలోని శరీర మాంసాన్ని స్పష్టంగా, సాధారణ పాఠకులకు సహజంగా సూచిస్తుంది.
- source_word: אַבִּירִים
  choice: ఎద్దుల
  rationale: పదానికి సాధారణంగా ‘బలవంతులు’ అనే భావం ఉన్నా, బలి, మాంసం, మగ మేకల రక్తం అనే సందర్భంలో ఇది బలమైన మగ పశువులను—ఎద్దులను—సూచిస్తుంది.
- source_word: וְדַם
  choice: మగ మేకల రక్తం
  rationale: హీబ్రూ సంధి అక్షరార్థంగా ‘మరియు’; అయితే సమాంతర అలంకారిక ప్రశ్నలను తెలుగులో విడివిడిగా ఉంచడం సహజంగా ఉండి, భావసంబంధాన్ని కాపాడుతుంది.
- source_word: עַתּוּדִים
  choice: మగ మేకల
  rationale: ఈ పదం ప్రత్యేకంగా మగ మేకలను సూచిస్తుంది; మూలంలోని నిర్దిష్టతను తెలుగులో సహజంగానే నిలుపుతుంది.
- source_word: אֶשְׁתֶּה
  choice: తాగుతానా?
  rationale: మొదటి భాగంలోని అలంకారిక ప్రశ్నను కొనసాగించే ప్రథమ పురుష ఏకవచన క్రియ; తెలుగు ప్రశ్నారూపం దాని బలాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుని గురించి మానవరూప బలి-భోజన భాష
  choice: మాంసం తినడం, రక్తం తాగడం అనే స్పష్టమైన అలంకారిక ప్రశ్నలను యథాతథంగా నిలుపడం
  alternative: ‘మీ బలులు నాకు అవసరమా?’ అని భావానువాదం చేయడం
  rationale: దేవుడు బలుల ఆహారంపై ఆధారపడడు అనే భావాన్ని మూలం స్పష్టమైన బలి-భోజన చిత్రాల ద్వారా వ్యక్తపరుస్తుంది; వాటిని సారాంశంగా మార్చకుండా నిలుపడం వచనంలోని దైవశాస్త్రీయ బలాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన అలంకారిక ప్రశ్నలుగా అనువదించబడింది. మూలంలోని ‘మగ మేకలు’ అనే నిర్దిష్టత ప్రధాన పాఠ్యంలోనే ఉంచినందున పాదటిప్పణి అవసరం లేదు.
