id: PSA.50.16
reference: Psalms 50:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לָ֤/רָשָׁ֨ע אָ֘מַ֤ר אֱלֹהִ֗ים מַה לְּ֭/ךָ לְ/סַפֵּ֣ר חֻקָּ֑/י וַ/תִּשָּׂ֖א בְרִיתִ֣/י עֲלֵי פִֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/016.yaml
  text: But to the wicked God says[b][a], “What right do you have to recount my statutes and to take my covenant on your lips?”
translation:
  language: te
  text: 'అయితే దుష్టునితో దేవుడు ఇలా అంటున్నాడు: “నా శాసనాలను ప్రకటించడానికి, నా నిబంధనను నీ పెదవులతో పలకడానికి నీకేం హక్కు ఉంది?[a][b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా మరింత అక్షరార్థంగా, “నా శాసనాలను చెప్పడంలో నీకేమి పని?”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “నా నిబంధనను నీ నోటిమీద ఎత్తుకోవడానికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָרָשָׁע
  choice: అయితే దుష్టునితో
  rationale: וְ అనే సంధి ముందున్న సందర్భానికి వ్యత్యాసాన్ని సూచిస్తుంది; לָרָשָׁע సంబోధనకు లక్ష్యమైన దుష్టుణ్ణి సూచిస్తుంది. ‘అయితే దుష్టునితో’ ఆధునిక తెలుగులో ఈ వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אָמַר אֱלֹהִים
  choice: దేవుడు ఇలా అంటున్నాడు
  rationale: హీబ్రూలో రూపం భూతకాలమైనప్పటికీ, కవితాత్మక ప్రత్యక్ష వాక్య పరిచయంలో వర్తమాన సజీవతను కలిగిస్తుంది. ‘ఇలా అంటున్నాడు’ ఆ ప్రకటనను సహజంగా పరిచయం చేస్తుంది.
- source_word: מַה לְּךָ
  choice: నీకేం హక్కు ఉంది?
  rationale: ఈ హీబ్రూ నుడికారం సమాచారం అడగడం కాదు; ఆ వ్యక్తి అర్హతను లేదా నైతిక అధికారాన్ని సవాలు చేస్తుంది. ‘నీకేం హక్కు ఉంది?’ ఆ గద్దింపు భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לְסַפֵּר
  choice: వివరించడానికి
  rationale: సָפַר ఇక్కడ దేవుని శాసనాలను మాటల్లో ప్రకటించడం లేదా పఠించడం అనే భావం కలిగి ఉంది. ‘వివరించడానికి’ సాధారణ పాఠకునికి సహజంగా ఉండి, బహిరంగంగా చెప్పే భావాన్ని నిలుపుతుంది.
- source_word: חֻקָּי
  choice: నా శాసనాలను
  rationale: חֹק దేవుడు నిర్దేశించిన నియమాలు లేదా విధులను సూచించే న్యాయపరమైన పదం. ‘శాసనాలు’ దాని అధికారిక, నిబంధనాత్మక ఛాయను నిలుపుతుంది.
- source_word: וַתִּשָּׂא
  choice: ఉంచుకోవడానికి
  rationale: నָשָׂא యొక్క మౌలిక భావం ‘ఎత్తడం/మోయడం.’ ‘నిబంధన’ను ‘నోటిమీద’ ఉంచడం అనే సందర్భంలో అది మాటల్లో చేపట్టడాన్ని సూచిస్తుంది. తెలుగులో ‘పెదవులపై ఉంచుకోవడం’ మూల రూపకాన్ని సహజంగా నిలుపుతుంది.
- source_word: בְרִיתִי
  choice: నా నిబంధనను
  rationale: בְּרִיתకు ‘నిబంధన’ స్థిరమైన తెలుగు బైబిలు పదం; దేవుడు తన ప్రజలతో ఏర్పరచిన సంబంధపు గంభీరతను, ప్రామాణికతను నిలుపుతుంది.
- source_word: עֲלֵי פִיךָ
  choice: నీ పెదవులపై
  rationale: అక్షరార్థంగా ‘నీ నోటిమీద.’ మాట్లాడే సందర్భంలో ‘నీ పెదవులపై’ సహజమైన తెలుగు రూపకంగా ఉండి మూల చిత్రాన్ని కాపాడుతుంది.
theological_decisions:
- issue: దుష్టునిపై గద్దింపు స్వభావం
  choice: దుష్టుడు దేవుని శాసనాలను ప్రకటించడానికి, ఆయన నిబంధనను మాటల్లో చేపట్టడానికి కలిగిన నైతిక హక్కును దేవుడు సవాలు చేస్తున్నాడు.
  alternative: దుష్టుడు దేవుని నిబంధనను ఏ సందర్భంలోనూ నోటితో ప్రస్తావించకూడదనే సంపూర్ణ నిషేధం.
  rationale: מַה לְּךָ అనే నుడికారం అతని హక్కు లేదా అర్హతను ప్రశ్నిస్తుంది. సందర్భంలో ప్రధానంగా కపటత్వం, జీవనానికి మాటలకు మధ్య ఉన్న విరుద్ధత గద్దింపబడుతున్నాయి; దేవుని విషయాలను ప్రస్తావించడంపై నిర్బంధరహిత నిషేధం విధించబడడం కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ కవితలోని ప్రత్యక్ష గద్దింపును, న్యాయ-నిబంధన పదజాలాన్ని, ‘నోటిమీద మోయడం’ అనే రూపకాన్ని ప్రధాన పాఠ్యంలో సహజీకరించి, అక్షరార్థ రూపాలను పాదసూచికల్లో ఇచ్చాం.
