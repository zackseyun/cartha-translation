translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. సమాంతర వాక్యనిర్మాణం, సన్నిహిత కుటుంబబంధంపై ఉన్న ఉద్ఘాటన, అలాగే ‘కూర్చొని’ అనే హీబ్రూ దృశ్యరూపం నిలుపబడ్డాయి.
