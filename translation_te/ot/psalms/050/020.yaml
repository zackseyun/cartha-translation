  text: You sit and speak against your brother[a]; you slander your own mother's son.
translation:
  language: te
  text: 'నీవు కూర్చొని నీ సహోదరునికి విరోధంగా మాట్లాడుతావు;

    నీ సొంత తల్లి కుమారునిపై అపనింద మోపుతావు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ సొంత తల్లి కుమారునిపై నింద వేస్తావు.” హీబ్రూలో అక్షరార్థంగా, “నీవు దోఫీ ఇస్తావు/పెడతావు” అని ఉంది; ఇక్కడ దోఫీ అనేది నింద, దోషారోపణ, లేదా అపఖ్యాతి కలిగించే మాటను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּשֵׁב
  choice: నీవు కూర్చొని
  rationale: ישׁב అనే క్రియలోని ‘కూర్చోవు’ అనే స్పష్టమైన భావాన్నీ, వెంట వచ్చే మాటల చర్యకు ముందున్న హీబ్రూ వాక్యబలాన్నీ నిలుపుతుంది.
- source_word: בְּאָחִיךָ תְדַבֵּר
  choice: నీ సహోదరునికి విరోధంగా మాట్లాడుతావు
  rationale: వైరభావంతో మాట్లాడే ఈ సందర్భంలో דברతో కూడిన ב ప్రత్యర్థక భావాన్ని ఇస్తుంది. ‘విరోధంగా’ ఆ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְּבֶן אִמְּךָ
  choice: నీ సొంత తల్లి కుమారునిపై
  rationale: ‘నీ తల్లి కుమారుడు’ అనే సమీప రక్తసంబంధాన్ని తెలిపే హీబ్రూ వ్యక్తీకరణను నిలుపుతూ, ‘సొంత’ దాని ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: תִּתֶּן דֹּפִי
  choice: అపనింద మోపుతావు
  rationale: అక్షరార్థంగా ‘దోషారోపణ/అపఖ్యాతి పెట్టడం’ అనే ఈ హీబ్రూ నుడికారాన్ని, వ్యక్తిపై నిందారోపణ చేసే భావంతో సహజమైన తెలుగులో అందిస్తుంది.
