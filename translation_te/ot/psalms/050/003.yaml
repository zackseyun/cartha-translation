  yaml_path: translation/ot/psalms/050/003.yaml
  text: Our God comes and does not keep silent[a]; a fire devours before him[b], and around him it storms violently.
translation:
  language: te
  text: 'మన దేవుడు వస్తున్నాడు; ఆయన మౌనంగా ఉండడు.[a]

    ఆయన ముందు అగ్ని దహిస్తుంది;

    ఆయన చుట్టూ తుపాను ప్రచండంగా రేగుతుంది.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మన దేవుడు వస్తాడు; ఆయన మౌనంగా ఉండడు.” ఈ కవితా సందర్భంలో హీబ్రూ అసంపూర్ణ క్రియారూపాలకు భవిష్యత్ భావం ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “ఆయన చుట్టూ మహా తుపాను చెలరేగుతుంది,” లేదా “ఆయన చుట్టూ అంతా అత్యంత తుపానుమయంగా ఉంటుంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבֹא
  choice: వస్తున్నాడు
  rationale: בוא అనే క్రియ యొక్క అసంపూర్ణ రూపం ఈ కవితా సందర్భంలో వర్తమాన దృశ్యసజీవతను లేదా భవిష్యత్ భావాన్ని తెలియజేయగలదు. ప్రధాన పాఠంలో దేవుని ప్రత్యక్షతను సజీవంగా చూపేందుకు ‘వస్తున్నాడు’ అని అనువదించాం; భవిష్యత్ పఠనాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אֱלֹהֵינוּ
  choice: మన దేవుడు
  rationale: మొదటి పురుష బహువచన ప్రత్యయంతో ఉన్న రూపానికి సహజమైన, నేరమైన తెలుగు అనువాదం.
- source_word: וְאַל יֶחֱרַשׁ
  choice: ఆయన మౌనంగా ఉండడు
  rationale: חרשׁ ఇక్కడ మౌనంగా ఉండడాన్ని సూచిస్తుంది. אַל సాధారణంగా నిషేధార్థక లేదా జస్సివ్ భావం కలిగించినా, ఈ కవితా వాక్యంలో దేవుని రాకతో కూడిన నిశ్చిత కార్యాన్ని తెలిపే ప్రకటనగా సహజంగా అర్థమవుతుంది.
- source_word: אֵשׁ לְפָנָיו תֹאכֵל
  choice: ఆయన ముందు అగ్ని దహిస్తుంది
  rationale: אכל అనే క్రియ అగ్ని కర్తగా ఉన్నప్పుడు ‘దహించు, భస్మం చేయు’ అనే భావం ఇస్తుంది. ‘ఆయన ముందు’ అనేది spatial imageryని సహజంగా నిలుపుతుంది.
- source_word: וּסְבִיבָיו
  choice: ఆయన చుట్టూ
  rationale: మూలంలోని స్థలసంబంధ భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: נִשְׂעֲרָה מְאֹד
  choice: తుపాను ప్రచండంగా రేగుతుంది
  rationale: נִשְׂעֲרָה తీవ్రమైన తుపాను లేదా సుడిగాలి రేగడాన్ని సూచిస్తుంది; מְאֹד దాని తీవ్రతను బలపరుస్తుంది. తెలుగులో సహజంగా ఉండేందుకు అంతర్లీన తుపాను భావాన్ని నామవాచకంగా వ్యక్తపరిచాం.
theological_decisions:
- issue: ఈ వచనం తీర్పు సందర్భంలో దేవుని ప్రత్యక్షతను చిత్రిస్తుంది; అయితే దానికి ప్రత్యేక క్రైస్తవశాస్త్రీయ లేదా సంఘపరమైన వివరణను మూలపాఠం స్పష్టంగా జోడించదు.
  choice: దేవుడు రావడం, మౌనంగా ఉండకపోవడం, అగ్ని మరియు తుపాను అనే ప్రత్యక్షతా చిత్రాలను నేరుగా నిలుపడం.
  alternative: దీనిని అంతిమ తీర్పుకు సంబంధించిన నిర్దిష్ట ప్రవచనంగా లేదా క్రీస్తుకు సంబంధించిన ప్రత్యక్ష సూచనగా విస్తరించడం.
  rationale: మూల హీబ్రూ దేవుని మహిమాన్వితమైన, తీర్పుతో కూడిన రాకను బలంగా చిత్రిస్తుంది. అనువాదం ఆ దైవశాస్త్రీయ బరువును నిలుపుతూ, వచనంలో స్పష్టంగా లేని తరువాతి సిద్ధాంత నిర్ధారణలను చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, కీర్తనకు తగిన గంభీరమైన కవితా ధోరణి పాటించబడింది. వర్తమాన దృశ్యసజీవతను ప్రధాన పాఠంలో ఉంచి, భవిష్యత్ కాల సాధ్యతను పాదటిప్పణిలో సంరక్షించాం.
