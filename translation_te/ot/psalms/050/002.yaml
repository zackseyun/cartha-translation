id: PSA.50.2
reference: Psalms 50:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִ/צִּיּ֥וֹן מִכְלַל יֹ֗פִי אֱלֹהִ֥ים הוֹפִֽיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/002.yaml
  text: From Zion[a], the perfection of beauty, God shines forth.
translation:
  language: te
  text: సౌందర్య సంపూర్ణతయైన సీయోనునుండి[a] దేవుడు ప్రకాశిస్తున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సౌందర్య సంపూర్ణతయైన సీయోనునుండి దేవుడు ప్రకాశించాడు’; లేదా, ‘సీయోనునుండి దేవుడు పరిపూర్ణ సౌందర్యంతో ప్రకాశిస్తున్నాడు.’
    reason: హీబ్రూ సంపూర్ణ క్రియ భూతార్థాన్ని కలిగి ఉండవచ్చు; అలాగే ‘సౌందర్య సంపూర్ణత’ సీయోనును వర్ణిస్తుందా, దేవుడు ప్రకాశించే విధానాన్ని వర్ణిస్తుందా అనే వ్యాకరణ సందిగ్ధత ఉంది.
lexical_decisions:
- source_word: מִ/צִּיּוֹן
  choice: సీయోనులోనుండి
  rationale: מִן మూలాన్ని లేదా ఆరంభస్థానాన్ని సూచిస్తుంది; దేవుని ప్రకాశ ప్రత్యక్షత సీయోనులోనుండి వెలువడుతున్న భావాన్ని ఈ రూపం సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מִכְלַל יֹפִי
  choice: పరిపూర్ణ సౌందర్యమైన సీయోను
  rationale: מִכְלַל అనే నిర్మాణరూప నామవాచకం సంపూర్ణతను, יֹפִי సౌందర్యాన్ని సూచిస్తాయి. ఈ పదబంధాన్ని సీయోనుకు సమానాధికరణంగా తీసుకొని, అది సౌందర్యానికి సంపూర్ణ రూపమని తెలిపేలా అనువదించబడింది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: హీబ్రూ క్రియ ఏకవచనంలో ఉన్నందున ఇక్కడ אֱלֹהִים ఏకవచనార్థంలో ఉంది.
- source_word: הוֹפִיעַ
  choice: ప్రకాశిస్తున్నాడు
  rationale: ఈ హిఫీల్ క్రియ ప్రకాశిస్తూ ప్రత్యక్షమవడం లేదా తేజస్సుతో వెలుగొందడం అనే భావాలను కలిగి ఉంది. కవితాత్మక సజీవతను నిలుపుటకు వర్తమాన రూపం వాడబడింది; హీబ్రూ సంపూర్ణ క్రియారూపాన్ని భూత/పూర్ణ వర్తమాన భావంలో కూడా గ్రహించవచ్చు.
theological_decisions:
- issue: ‘పరిపూర్ణ సౌందర్యం’ అనే పదబంధానికి సీయోనుతోనా, దేవునితోనా సంబంధం?
  choice: దాన్ని సీయోనును వివరిస్తున్న సమానాధికరణ పదబంధంగా అనువదించడం
  alternative: ‘సీయోనులోనుండి దేవుడు పరిపూర్ణ సౌందర్యంతో ప్రకాశిస్తున్నాడు’ అని దేవుని ప్రకాశ విధానాన్ని తెలిపే క్రియావిశేషణ భావంగా అనువదించడం
  rationale: హీబ్రూ పదక్రమం ‘సీయోను’ తరువాత వచ్చిన నిర్మాణ పదబంధాన్ని సీయోనుకు సమానాధికరణంగా చదవడానికి ఎక్కువగా అనుకూలిస్తుంది. అయినా క్రియావిశేషణ సంబంధం సాధ్యమే కనుక దాన్ని పాదసూచికలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితాత్మక శైలి. సమానాధికరణ సంబంధం తెలుగులో స్పష్టంగా ఉండేందుకు ‘సీయోను’ను రెండోసారి పేర్కొనబడింది; మూలంలోని ప్రకాశ ప్రతిమను ‘ప్రకాశిస్తున్నాడు’తో నిలుపబడింది.
