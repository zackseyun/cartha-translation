review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the conditional, the refusal to inform the addressee, and God's possession of the world and what fills it. However, «నీతో చెప్పను» normally means “I will speak with you,” whereas לֹא אֹמַר לָךְ means “I would not tell/say to you.”
  naturalness: «నేను ఆకలిగొన్నా» is possible but can sound concessive (“even if I am hungry”). «ఒకవేళ నేను ఆకలితో ఉంటే» makes the hypothetical condition clear in natural modern Telugu. «దానిలో నిండియున్నదంతా» is understandable but somewhat literary and less direct than “all that fills it.”
  terminology: «లోకం» is an appropriate rendering of תֵבֵל. «దానిని నింపిన సమస్తమూ» clearly represents מְלֹאָהּ without adding theological interpretation. «నావే» appropriately expresses the emphatic divine possession marked by לִי.
  issues:
  - severity: medium
    issue: The phrase «నీతో చెప్పను» does not precisely render the indirect object לָךְ.
    rationale: In modern Telugu it ordinarily suggests conversing with someone. «నీకు చెప్పను» directly means “I would not tell you.”
  - severity: low
    issue: The draft does not retain the lexical-alternative footnote corresponding to the English POB audit trail.
    rationale: A Telugu footnote anchored to «లోకం» can preserve the viable sense “inhabited world” and the expanded sense of its fullness.
  revised_text: ఒకవేళ నేను ఆకలితో ఉంటే, నీకు చెప్పను; ఎందుకంటే లోకమూ[a] దానిని నింపిన సమస్తమూ నావే.
