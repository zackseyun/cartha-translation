source:
  edition: WLC
  text: אִם אֶ֭רְעַב לֹא אֹ֣מַר לָ֑/ךְ כִּי לִ֥/י תֵ֝בֵ֗ל וּ/מְלֹאָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/012.yaml
  text: If I were hungry[a], I would not tell you, for the world and its fullness are mine.
translation:
  language: te
  text: ఒకవేళ నేను ఆకలితో ఉంటే, నీకు చెప్పను; ఎందుకంటే లోకమూ[a] దానిని నింపిన సమస్తమూ నావే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నివసించబడిన ప్రపంచం మరియు దానిని నింపిన సమస్తం.”
    reason: తֵבֵל‌కు “నివసించబడిన ప్రపంచం” అనే నిఘంటు సంబంధమైన అర్థాన్ని, అలాగే మְלֹאָהּ యొక్క విస్తృత భావాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: אִם אֶרְעַב
  choice: నేను ఆకలిగొన్నా
  rationale: אִם తో కూడిన అసంపూర్ణ క్రియ ఇక్కడ ఊహాత్మక షరతును సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఆకలిగొన్నా’ ఆ షరతును సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది; దేవుడు నిజంగా ఆకలితో ఉన్నాడని ప్రకటించదు.
- source_word: לֹא אֹמַר לָךְ
  choice: నీతో చెప్పను
  rationale: אמר యొక్క ప్రాథమిక భావమైన ‘చెప్పు’ను నిలుపుతూ, לָךְ ను సహజమైన తెలుగు ప్రయోగంలో ‘నీతో’గా ఇచ్చాం. షరతుకు అనుగుణంగా ‘చెప్పను’ ఫలిత వాక్యంగా పనిచేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి మాటకు కారణాన్ని పరిచయం చేసే ప్రయోగం కావడంతో స్పష్టమైన ఆధునిక తెలుగు కారణసంధి వాడాం.
- source_word: תֵבֵל
  choice: లోకం
  rationale: תֵבֵל నివాసయోగ్యమైన లేదా వ్యవస్థితమైన ప్రపంచాన్ని సూచించగలదు. సందర్భంలో సహజమైన, విస్తృతమైన సమానార్థకంగా ‘లోకం’ సరిపోతుంది.
- source_word: וּמְלֹאָהּ
  choice: దానిలో నిండియున్నదంతా
  rationale: అక్షరార్థమైన ‘దాని నిండుదనం’ కంటే, లోకాన్ని నింపిన సమస్తాన్ని సూచించే హీబ్రూ కవితా భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: לִי
  choice: నాదే
  rationale: స్వామ్యాన్ని తెలిపే לִי కి ‘నాదే’ సహజంగా సరిపోతుంది; ‘-ఏ’ సందర్భంలోని దైవ స్వామ్య ఉద్ఘాటనను వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: బలుల సందర్భంలో దేవుని స్వయంసమృద్ధి
  choice: ఆకలి కలిగితే అన్న ఊహాత్మక పరిస్థితిగా అనువదించి, దేవుడు మానవుల సమర్పణలపై ఆధారపడడని సూచించాం.
  alternative: ‘నేను ఆకలిగొంటే నీతో చెప్పను’ అనే మరింత పదక్షర భవిష్యదర్థ పఠనం.
  rationale: చుట్టుపక్కల వచనాలు దేవుడు బలులను ఆహార అవసరంగా కోరుతున్నాడనే భావాన్ని ఖండిస్తాయి. అయితే తాత్విక పదజాలాన్ని వచనంలో చేర్చకుండా, మూలంలోని షరతు మరియు కారణాన్ని మాత్రమే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకునికి స్పష్టంగా ఉండేలా, కవితాత్మక గౌరవభావాన్ని కాపాడుతూ సంక్షిప్తంగా రూపొందించబడింది. ‘దానిలో నిండియున్నదంతా’ మూలంలోని מְלֹאָהּ భావాన్ని సహజ తెలుగులో విప్పి చెబుతుంది.
