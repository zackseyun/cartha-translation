source:
  edition: WLC
  text: שִׁמְעָ֤/ה עַמִּ֨/י וַ/אֲדַבֵּ֗רָה יִ֭שְׂרָאֵל וְ/אָעִ֣ידָה בָּ֑/ךְ אֱלֹהִ֖ים אֱלֹהֶ֣י/ךָ אָנֹֽכִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/007.yaml
  text: 'Hear[a], my people, and I will speak; O Israel, and I will testify against you: I am God, your God.'
translation:
  language: te
  text: నా ప్రజలారా, వినండి, నేను మాట్లాడతాను; ఇశ్రాయేలూ, నీకు వ్యతిరేకంగా సాక్ష్యమిస్తాను[a]. నేనే దేవుడను, నీ దేవుడను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీకు వ్యతిరేకంగా సాక్షిగా నిలుస్తాను.” హీబ్రూ క్రియకు న్యాయపరమైన సాక్ష్యార్థం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעָה
  choice: వినండి
  rationale: శ్రద్ధగా వినమని పిలిచే ఆజ్ఞ. ‘నా ప్రజలారా’ అనే సమూహ సంబోధనతో సహజమైన ఆధునిక తెలుగులో గౌరవ/బహువచన రూపం వాడబడింది; న్యాయపరమైన గంభీర స్వరం నిలిచింది.
- source_word: עַמִּי
  choice: నా ప్రజలారా
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న నిబంధన-సంబంధ సూచన. ప్రత్యక్ష సంబోధనను తెలుగులో సహజంగా తెలియజేయడానికి ‘-ఆరా’ రూపం వాడబడింది.
- source_word: וַאֲדַבֵּרָה
  choice: నేను మాట్లాడతాను
  rationale: ఆజ్ఞ తరువాత వచ్చే ప్రథమ పురుష కోహోర్టేటివ్ రూపం. సంకల్పంతో కూడిన తదుపరి చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలూ
  rationale: పేరును లిప్యంతరీకరించి, ప్రత్యక్ష సంబోధనను ‘-ఊ’తో స్పష్టంచేసింది.
- source_word: וְאָעִידָה בָּךְ
  choice: నీకు వ్యతిరేకంగా సాక్ష్యమిస్తాను
  rationale: హిఫిల్ క్రియకు ఇక్కడ న్యాయస్థాన సంబంధమైన సాక్ష్యార్థం ఉంది; בְּ ప్రత్యయంతో కూడిన సందర్భం ప్రతికూల దిశను సూచిస్తుంది. ‘హెచ్చరిస్తాను’ అనడం ఈ న్యాయపరమైన బలాన్ని తగ్గిస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుణ్ణి
  rationale: రూపపరంగా బహువచనమైనా ఇక్కడ వక్తను సూచించే ఏకవచన భావం; తెలుగు విధేయ నామవాచక నిర్మాణానికి అనుగుణంగా ద్వితీయా రూపం సహజంగా ఉంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుణ్ణి
  rationale: ద్వితీయ పురుష ఏకవచన ప్రత్యయాన్ని, దేవుడు-ఇశ్రాయేలు మధ్య నిబంధన సంబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: אָנֹכִי
  choice: నేనే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగు ‘నేనే’ స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: אֱלֹהִים אֱלֹהֶיךָ אָנֹכִי అనే దైవ స్వీయ-గుర్తింపు
  choice: నేనే దేవుణ్ణి, నీ దేవుణ్ణి
  alternative: దేవుణ్ణి—నీ దేవుణ్ణి—నేనే
  rationale: హీబ్రూలో ఇది క్రియలేని, ఉద్ఘాటనతో కూడిన స్వీయ-గుర్తింపు వాక్యం. ఎంపిక చేసిన తెలుగు రూపం దేవత్వాన్నీ నిబంధన సంబంధాన్నీ స్పష్టంగా నిలుపుతూ, చివరి אָנֹכִי ఉద్ఘాటనను ‘నేనే’ ద్వారా సహజ తెలుగు వాక్యారంభంలో వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయ/నిబంధన స్వరం ఉంచబడింది. ‘నా ప్రజలారా’తో సహజ సమూహ సంబోధన, ‘ఇశ్రాయేలూ’తో ఏకవచన ప్రత్యక్ష సంబోధన వేరు చేయబడ్డాయి. అర్థానికి సంబంధించిన పాదటిప్పణి గుర్తు సంబంధిత ‘సాక్ష్యమిస్తాను’ పదబంధం వద్ద ఉంచబడింది.
