id: PSA.50.4
reference: Psalms 50:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יִקְרָ֣א אֶל הַ/שָּׁמַ֣יִם מֵ/עָ֑ל וְ/אֶל הָ֝/אָ֗רֶץ לָ/דִ֥ין עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/004.yaml
  text: 'He calls to the heavens above and to the earth[a], that he may judge his people:'
translation:
  language: te
  text: 'ఆయన పైనున్న ఆకాశాలనూ భూమినీ పిలుస్తాడు,

    తన ప్రజలకు తీర్పు తీర్చడానికి:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִקְרָא
  choice: పిలుస్తాడు
  rationale: קרא అనే క్రియకు ‘పిలుచు’ లేదా ‘సమకూరమని పిలుచు’ అనే అర్థాలు ఉన్నాయి. న్యాయసందర్భంలోని సమన్ల భావాన్ని అతిగా నిర్దిష్టం చేయకుండా, సహజమైన తెలుగు కోసం ‘పిలుస్తాడు’ అని అనువదించాం.
- source_word: אֶל הַשָּׁמַיִם מֵעָל
  choice: పైనున్న ఆకాశాలను
  rationale: מֵעָל ఇక్కడ ‘ఆకాశాలు’ను విశేషించే క్రియావిశేషణ భావంలో ఉంది. కవితాత్మకమైన విశ్వవ్యాప్త పరిధిని నిలుపుతూ ‘పైనున్న ఆకాశాలను’ అని ఇచ్చాం.
- source_word: וְאֶל הָאָרֶץ
  choice: భూమిని
  rationale: ‘ఆకాశాలు’తో సమాంతరంగా ఉన్నందున הָאָרֶץ ఇక్కడ ఒక ప్రాంతాన్ని కాక విశ్వంలోని భూమిని సూచిస్తుంది; తెలుగులో సంయోజక సంబంధం కామాతో సహజంగా వ్యక్తమవుతుంది.
- source_word: לָדִין
  choice: తీర్పు తీర్చడానికి
  rationale: ל తో కూడిన דין క్రియారూపం ఉద్దేశాన్ని తెలియజేస్తుంది. ‘తీర్పు తీర్చడానికి’ ఆ ఉద్దేశ సంబంధాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: עַמּוֹ
  choice: తన ప్రజలకు
  rationale: עַמּוֹ అంటే ‘అతని ప్రజలు.’ వాక్యకర్తతో తిరిగి సంబంధం చూపే ఆధునిక తెలుగు వాడుకలో ‘తన ప్రజలు’ సహజం; דין తో తీర్పు పొందేవారిని సూచించడానికి ‘ప్రజలకు’ వాడాం.
theological_decisions:
- issue: అంతర్లీన కర్త ఎవరు?
  choice: ‘ఆయన’ అనే పురుష ఏకవచన సర్వనామాన్ని ఉంచడం
  alternative: వచనంలో ‘దేవుడు’ అని స్పష్టంగా చేర్చడం
  rationale: హీబ్రూ క్రియ మూడవ పురుష ఏకవచనంలో ఉన్నా, ఈ వచనంలో కర్త పేరు ప్రత్యక్షంగా లేదు. సందర్భం దేవుణ్ణి సూచిస్తుంది; అయినా మూలవచనంలో లేని పేరును చేర్చకుండా ‘ఆయన’ అని ఉంచాం.
- issue: ఆకాశం, భూమి పాత్ర
  choice: వాటిని ఆయన పిలుస్తాడనే విస్తృత భావాన్ని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: న్యాయసభకు సాక్షులుగా వాటిని సమన్లు చేస్తాడని స్పష్టీకరించడం
  rationale: న్యాయసందర్భం ‘సమన్లు చేయడం’ అనే ఛాయను సమర్థించినా, వచనం వాటి నిర్దిష్ట పాత్రను చెప్పదు. అందువల్ల ఆ న్యాయపరమైన భావఛాయను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనకు తగిన గంభీరమైన కవితాత్మక శైలిని వాడాం. హీబ్రూ పదక్రమంలోని ఉద్దేశ భాగాన్ని ముందుంచి తెలుగు ప్రవాహాన్ని సహజంగా చేశాం; ‘ఆకాశాలు’ అనే బహువచనాన్ని మూలానికి అనుగుణంగా నిలిపాం.
