- source_word: שָׂנֵאתָ
  choice: ద్వేషిస్తున్నావు
  rationale: హీబ్రూ Qal perfect 2ms ఇక్కడ ఒకసారి జరిగిన గత చర్యకన్నా వ్యక్తిని లక్షణీకరించే నిరంతర వైఖరిని ఆరోపిస్తోంది; అందుకే సహజమైన తెలుగు వర్తమాన రూపం వాడాం.
- source_word: מוּסָר
  choice: శిక్షణను
  rationale: ఈ పదం బోధతో పాటు సరిదిద్దే, నైతికంగా తీర్చిదిద్దే భావాన్ని కలిగి ఉంది. ‘శిక్షణ’ విస్తృత భావాన్ని సహజంగా అందిస్తుంది; ‘దిద్దుబాటు,’ ‘ఉపదేశం,’ ‘గద్దింపు’ వంటి ఛాయలను పాదసూచికలో పేర్కొన్నాం.
- source_word: וַתַּשְׁלֵךְ
  choice: విసిరివేస్తున్నావు
  rationale: మూలంలోని విసరడం/పారవేయడం అనే సజీవ దృశ్యరూపాన్ని నిలిపి, ఉద్దేశపూర్వక తిరస్కారాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: דְּבָרַי
  choice: నా మాటలను
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న బహువచన నామానికి నేరమైన, వ్యాఖ్యాన విస్తరణ లేని అనువాదం.
- source_word: אַחֲרֶיךָ
  choice: నీ వెనుకకు
  rationale: ‘నీ వెనుక’ అనే మూల దృశ్యాన్ని నిలుపుతూ, మాటలను పట్టించుకోకుండా పారవేయడాన్ని సూచిస్తుంది; రహస్యంగా చేయడం అనే తప్పుదోవ పట్టించే భావాన్ని చేర్చదు.
