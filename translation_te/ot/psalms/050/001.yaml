  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֵ֤ל אֱֽלֹהִ֡ים יְֽהוָ֗ה דִּבֶּ֥ר וַ/יִּקְרָא אָ֑רֶץ מִ/מִּזְרַח שֶׁ֝֗מֶשׁ עַד מְבֹאֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/001.yaml
  text: A psalm of Asaph. The Mighty One[a], God, Yahweh, has spoken and called the earth from the rising of the sun to its setting.
translation:
  language: te
  text: 'ఆసాపు కీర్తన.


    శక్తిమంతుడు, దేవుడు, యహ్వే[a] పలికాడు;


    సూర్యోదయం నుండి సూర్యాస్తమయం వరకు


    భూమిని పిలిచాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ దైవనామాల వరుసను ‘దేవుడు, దేవుడు, యహ్వే’ అని కూడా అనువదించవచ్చు; కొందరు ‘దేవతల దేవుడైన యహ్వే’ అని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: కీర్తనల శీర్షికల్లో కనిపించే ఈ గానప్రక్రియ పదానికి తెలుగులో స్థిరపడిన, సహజమైన సమానార్థకం.
- source_word: לְאָסָף
  choice: ఆసాఫు కీర్తన
  rationale: לְ అనేది రచయితను, సంబంధాన్ని లేదా సంకలనానికి చెందినదనాన్ని సూచించవచ్చు. సంక్షిప్తమైన ఈ రూపం ఆ సంబంధాన్ని అతిగా నిర్ధారించకుండా సహజంగా తెలియజేస్తుంది.
- source_word: אֵל
  choice: శక్తిమంతుడు
  rationale: తరువాత వచ్చే אֱלֹהִים, יהוה పదాలనుంచి దీనిని వేరుగా చూపిస్తూ, אֵל లోని బలం/శక్తి భావాన్ని నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: יהוה అనే ఏకవచన దైవనామంతోను, ఏకవచన క్రియలతోను ఉన్నందున ఇక్కడ ఇశ్రాయేలు దేవుడే ఉద్దేశించబడ్డాడు.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణను ఉపయోగించింది.
- source_word: דִּבֶּר
  choice: మాట్లాడాడు
  rationale: పూర్తయిన చర్యను సూటిగా తెలియజేస్తూ, తరువాతి పిలుపుకు పునాది వేస్తుంది.
- source_word: וַיִּקְרָא
  choice: పిలిచాడు
  rationale: మాట్లాడటం తరువాత భూమిని సమకూర్చే పిలుపును కథన క్రమంలో సహజంగా తెలియజేస్తుంది; న్యాయసభ భావాన్ని అనవసరంగా విస్తరించదు.
- source_word: אָרֶץ
  choice: భూమిని
  rationale: సూర్యోదయం నుండి సూర్యాస్తమయం వరకు అనే విశ్వవ్యాప్త పరిధి కారణంగా ‘దేశం’ కంటే ‘భూమి’ తగినది.
- source_word: מִמִּזְרַח שֶׁמֶשׁ
  choice: సూర్యోదయం నుండి
  rationale: మూలంలోని సూర్యుడు ఉదయించే దృశ్యాన్ని సంక్షిప్తంగా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עַד מְבֹאוֹ
  choice: సూర్యాస్తమయం వరకు
  rationale: పుంలింగ ఏకవచన ప్రత్యయం సూర్యుణ్ణి సూచిస్తుంది. ఈ రూపం మొత్తం దిక్పరిధిని సూచించే కవితాత్మక జంటను స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: אֵל אֱלֹהִים יְהוָה అనే మూడు దైవసూచకాల అనువాదం
  choice: శక్తిమంతుడు, దేవుడు, యహ్వే
  alternative: ‘దేవుడు, దేవుడు, యహ్వే’ లేదా ‘దేవతల దేవుడైన యహ్వే’
  rationale: హీబ్రూ పాఠంలో మూడు దైవసూచకాలు వరుసగా ఉన్నాయి. אֵל ను ప్రత్యేకంగా ‘శక్తిమంతుడు’ అని ఇవ్వడం వాక్యంలోని గంభీరమైన క్రమాన్ని, పదభేదాన్ని నిలుపుతుంది. అయితే మొదటి రెండు పదాల వ్యాకరణ సంబంధాన్ని వేరుగా అర్థం చేసుకునే అవకాశం ఉన్నందున ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని వాడింది. చిన్న పాదాల అమరిక హీబ్రూ కవిత్వంలోని ప్రకటనను, సూర్యోదయం–సూర్యాస్తమయం అనే సమగ్ర పరిధిని స్పష్టంగా వినిపిస్తుంది.
