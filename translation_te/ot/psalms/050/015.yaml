source:
  edition: WLC
  text: וּ֭/קְרָאֵ/נִי בְּ/י֣וֹם צָרָ֑ה אֲ֝חַלֶּצְ/ךָ֗ וּֽ/תְכַבְּדֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/015.yaml
  text: And call on me in the day of distress; I will deliver you[a], and you will honor me.
translation:
  language: te
  text: కష్టకాలంలో నాకు మొరపెట్టు; నేను నిన్ను విడిపిస్తాను, నీవు నన్ను ఘనపరుస్తావు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీవు నన్ను మహిమపరుస్తావు.’ హీబ్రూ క్రియకు ‘ఘనపరచు’ లేదా ‘మహిమపరచు’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאֵנִי
  choice: నాకు మొరపెట్టు
  rationale: ఇక్కడ קרא దేవుని సహాయం కోసం పిలవడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘మొరపెట్టు’ ప్రార్థనాత్మక పిలుపును సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: בְּיוֹם צָרָה
  choice: కష్టకాలంలో
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘కష్టం కలిగిన దినంలో’ అని ఉన్నా, ‘కష్టకాలంలో’ దాని కాలసూచక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֲחַלֶּצְךָ
  choice: నేను నిన్ను విడిపిస్తాను
  rationale: חלץ యొక్క పియేల్ రూపం ప్రమాదం లేదా కష్టం నుండి విడిపించడం, రక్షించడం అనే అర్థాన్ని ఇస్తుంది. ‘విడిపిస్తాను’ మూలంలోని విమోచన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּתְכַבְּדֵנִי
  choice: నీవు నన్ను ఘనపరుస్తావు
  rationale: כבד యొక్క పియేల్ రూపం గౌరవించడం లేదా మహిమపరచడం అని అర్థమవుతుంది. దేవునికి తగిన ఘనత చెల్లించడాన్ని ‘ఘనపరుస్తావు’ సహజంగా వ్యక్తం చేస్తూ, సంబంధిత అర్థవిస్తృతిని నిలుపుతుంది.
theological_decisions:
- issue: దైవిక విమోచనకు మానవుని ప్రతిస్పందన
  choice: నీవు నన్ను ఘనపరుస్తావు
  alternative: నీవు నన్ను మహిమపరుస్తావు
  rationale: మూలపదం రక్షించబడిన వ్యక్తి దేవునికి గౌరవం లేదా మహిమ చెల్లించడాన్ని సూచిస్తుంది. ‘ఘనపరుస్తావు’ విస్తృతమైన భావాన్ని నిలుపుతుంది; ‘మహిమపరుస్తావు’ కూడా సాధ్యమైన అనువాదం కాబట్టి పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, కీర్తనకు తగిన గంభీరతతో సంక్షిప్త కవితాత్మక వాక్యనిర్మాణం వాడబడింది.
