source:
  edition: WLC
  text: זֹבֵ֥חַ תּוֹדָ֗ה יְֽכַ֫בְּדָ֥/נְנִי וְ/שָׂ֥ם דֶּ֑רֶךְ אַ֝רְאֶ֗/נּוּ בְּ/יֵ֣שַׁע אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/023.yaml
  text: Whoever offers a sacrifice of thanksgiving honors me[c][b][a], and to the one who orders his way I will show the salvation of God.
translation:
  language: te
  text: కృతజ్ఞతాబలి అర్పించేవాడు నన్ను ఘనపరుస్తాడు[a]; తన మార్గాన్ని సక్రమంగా ఉంచేవాడికి దేవుని రక్షణను నేను చూపిస్తాను[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కృతజ్ఞతార్పణ’; హీబ్రూ పదం బలి రూపంలో వ్యక్తమయ్యే కృతజ్ఞతను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘తన మార్గాన్ని సక్రమంగా ఉంచేవాడికి’; ‘తన నడవడిని సరిచేసుకునేవాడికి’ లేదా ‘మార్గాన్ని సిద్ధపరచేవాడికి’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: c
    text: ‘దేవుని విమోచనను’ లేదా ‘దేవుని విజయాన్ని’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹבֵחַ
  choice: అర్పించేవాడు
  rationale: Qal క్రియావిశేషణ రూపం వ్యక్తిని సూచిస్తోంది; బలి సందర్భంలో ‘అర్పించేవాడు’ సహజమైన ఆధునిక తెలుగు.
- source_word: תּוֹדָה
  choice: కృతజ్ఞతాబలి
  rationale: ఇది కేవలం మాటల కృతజ్ఞత కాకుండా బలి రూపంలో వ్యక్తమయ్యే కృతజ్ఞతను సూచిస్తుంది; సమాసరూపం ఆ రెండు భావాలనూ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: יְכַבְּדַנְנִי
  choice: నన్ను ఘనపరుస్తాడు
  rationale: Piel రూపంలోని כבד ఇక్కడ గౌరవించడం లేదా మహిమపరచడం అనే భావం ఇస్తుంది; ‘ఘనపరుస్తాడు’ ఆరాధనా సందర్భానికి తగినదిగా, స్పష్టంగా ఉంది.
- source_word: וְשָׂם דֶּרֶךְ
  choice: తన నడవడిని సరిచేసుకునేవాడికి
  rationale: సంక్షిప్తమైన హీబ్రూ నుడికారం అక్షరార్థంగా ‘మార్గాన్ని అమర్చేవాడు’; సందర్భంలో జీవన ప్రవర్తనను సక్రమంగా ఉంచడం ప్రధాన భావం. తెలుగు సహజత్వం కోసం ‘నడవడి’ వాడినా, ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: אַרְאֶנּוּ
  choice: నేను చూపిస్తాను
  rationale: ראה యొక్క Hiphil రూపం ‘చూడనిచ్చుట/చూపుట’ అని అర్థం; 3వ పురుష ఏకవచన ప్రత్యయం ప్రయోజిత వ్యక్తిని సూచిస్తుంది.
- source_word: בְּיֵשַׁע אֱלֹהִים
  choice: దేవుని రక్షణను
  rationale: יֵשַׁע కు రక్షణ, విమోచన, విజయం అనే అర్థపరిధి ఉంది; ఈ కీర్తన సందర్భంలో ‘రక్షణ’ అత్యంత సహజమైనది. בְ ను చూపబడే విషయాన్ని పరిచయం చేసే నుడికార నిర్మాణంగా గ్రహించాం.
theological_decisions:
- issue: וְשָׂם דֶּרֶךְ అనే రెండవ పాదభాగపు అర్థం
  choice: తన జీవన నడవడిని సరిచేసుకునే వ్యక్తికి ఇచ్చిన వాగ్దానంగా అనువదించడం
  alternative: ‘మార్గాన్ని సిద్ధపరచేవాడికి’ లేదా అక్షరార్థంగా ‘మార్గాన్ని అమర్చేవాడికి’
  rationale: ప్రధాన సందర్భార్థం సక్రమమైన ప్రవర్తనను సూచించినా, హీబ్రూ నిర్మాణం సంక్షిప్తంగా ఉండి ‘మార్గం’ రూపకాన్ని కలిగి ఉంది. అనువాదంలో నైతిక భావాన్ని సహజంగా తెలిపి, సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం; దీని మీద అదనపు సిద్ధాంత నిర్ధారణను మోపలేదు.
- issue: יֵשַׁע אֱלֹהִים యొక్క భావపరిధి
  choice: దేవుని రక్షణ
  alternative: దేవుని విమోచన లేదా దేవుని విజయం
  rationale: ‘రక్షణ’ విస్తృతమైన మూలార్థాన్ని నిలుపుతుంది; సందర్భానుసారం విమోచన లేదా విజయ భావం కూడా సాధ్యమని పాదటిప్పణిలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘కృతజ్ఞతాబలి’ ద్వారా ఆరాధనా-బలి భావం, ‘నడవడి’ ద్వారా జీవన ప్రవర్తన భావం సహజంగా వ్యక్తమయ్యాయి. మూలంలోని సంక్షిప్తత వల్ల ఉన్న ప్రత్యామ్నాయ అర్థాలను పాదటిప్పణుల్లో భద్రపరిచాం.
