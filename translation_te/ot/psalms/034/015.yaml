revisions:
- from: 'యెహోవా కన్నులు నీతిమంతులవైపు ఉన్నాయి;

    ఆయన చెవులు సహాయం కోసం వారు పెట్టే మొరవైపు[a] ఉన్నాయి.'
  to: 'యాహ్వే కన్నులు నీతిమంతుల వైపు ఉన్నాయి;

    ఆయన చెవులు వారి సహాయార్థ మొర వైపు ఉన్నాయి.[a]'
  rationale: The revision aligns the divine name with the source-based POB policy, preserves the Hebrew anthropomorphic imagery and two-colon parallelism, and uses a more natural concise Telugu expression for the distress-cry. The footnote remains anchored to the phrase translated from שַׁוְעָתָם and presents a legitimate lexical alternative without resolving it interpretively.
