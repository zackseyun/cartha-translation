id: PSA.34.15
reference: Psalms 34:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עֵינֵ֣י יְ֭הוָה אֶל צַדִּיקִ֑ים וְ֝/אָזְנָ֗י/ו אֶל שַׁוְעָתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/015.yaml
  text: The eyes of Yahweh are toward the righteous[a], and his ears toward their cry for help.
translation:
  language: te
  text: 'యాహ్వే కన్నులు నీతిమంతుల వైపు ఉన్నాయి;

    ఆయన చెవులు వారి సహాయార్థ మొర వైపు ఉన్నాయి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి ఆర్తనాదం వైపు.” హెబ్రీ పదం ఆపదలోనుంచి వెలువడే సహాయార్థ కేకను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי
  choice: కన్నులు
  rationale: మూలంలోని బహువచన శరీరరూపకాన్ని నిలుపుతూ, దేవుని శ్రద్ధగల దృష్టిని కవితాత్మకంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందించింది.
- source_word: אֶל
  choice: వైపు
  rationale: దృష్టి లేదా శ్రద్ధ ఒకరి దిశగా ఉండడాన్ని సూచించే మూలంలోని దిశార్థాన్ని రెండు పాదాల్లోనూ సహజంగా నిలుపుతుంది.
- source_word: צַדִּיקִים
  choice: నీతిమంతులు
  rationale: నామవాచకంగా వాడిన బహువచన విశేషణానికి సహజమైన తెలుగు సమానం; నైతిక, నిబంధనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: וְאָזְנָיו
  choice: ఆయన చెవులు
  rationale: ‘కన్నులు’తో ఉన్న సమాంతరతను, మూలంలోని బహువచన శరీరరూపకాన్ని కాపాడుతుంది.
- source_word: שַׁוְעָתָם
  choice: సహాయం కోసం వారు పెట్టే మొర
  rationale: ఇది సాధారణ కేకను కాక, ఆపదలోనుంచి సహాయం కోరుతూ చేసే మొరను సూచిస్తుంది; ఆధునిక తెలుగులో భావం స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: వచనంలో ఉన్న వ్యక్తిగత దైవ నామాన్ని ఒక బిరుదుతో భర్తీ చేయకుండా నిలుపుతుంది.
- issue: దేవుని గ్రహణశక్తిని తెలిపే శరీరరూపక భాష
  choice: ‘కన్నులు’, ‘చెవులు’ అనే రూపకాలను యథాతథంగా నిలుపడం
  alternative: ‘దేవుడు చూస్తున్నాడు’, ‘దేవుడు వింటున్నాడు’ అని వివరణాత్మకంగా అనువదించడం
  rationale: మూలంలోని సజీవమైన కవితా చిత్రాన్ని, రెండు పాదాల సమాంతరతను కాపాడి, అంతర్లీన భావాన్ని అనవసరంగా విప్పి చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కవితా శైలి వాడబడింది. హెబ్రీ సమాంతర నిర్మాణాన్ని నిలుపడానికి రెండు పాదాల్లోనూ ‘వైపు’ అనే దిశార్థ రూపం ఉంచబడింది.
