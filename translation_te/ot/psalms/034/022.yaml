source:
  edition: WLC
  text: פּוֹדֶ֣ה יְ֭הוָה נֶ֣פֶשׁ עֲבָדָ֑י/ו וְ/לֹ֥א יֶ֝אְשְׁמ֗וּ כָּֽל הַ/חֹסִ֥ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/022.yaml
  text: Yahweh redeems the life of his servants[b][a], and none of those who take refuge in him will be held guilty.
translation:
  language: te
  text: 'యాహ్వే తన సేవకుల ప్రాణాన్ని[a] విమోచిస్తాడు;

    ఆయనను ఆశ్రయించే వారిలో ఎవ్వరూ దోషులుగా తేలరు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “జీవితాన్ని”; హీబ్రూ పదం సజీవ వ్యక్తిని లేదా జీవాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అపరాధబాధ్యతకు లోనుకారు,” “ఖండించబడరు.” హీబ్రూ క్రియలో న్యాయపరమైన దోషభావం ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: פּוֹדֶה
  choice: విమోచిస్తాడు
  rationale: פדה పదంలోని విడిపించడం, వెల చెల్లించి రక్షించడం అనే భావపరిధిని ‘విమోచిస్తాడు’ సహజంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: נֶפֶשׁ
  choice: ప్రాణం
  rationale: ఇక్కడ ఈ పదం కేవలం అమూర్తమైన ‘ఆత్మ’ను కాక, జీవాన్ని లేదా సజీవ వ్యక్తిని సూచిస్తుంది; తెలుగు సందర్భంలో ‘ప్రాణం’ ఈ విస్తృత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: עֲבָדָיו
  choice: తన సేవకులు
  rationale: కీర్తన సందర్భంలో దేవునికి సేవచేసేవారనే సంబంధాన్ని ‘సేవకులు’ స్పష్టంగా, గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
- source_word: יֶאְשְׁמוּ
  choice: దోషులుగా తేలరు
  rationale: אשם క్రియలోని న్యాయపరమైన దోషం లేదా అపరాధబాధ్యత భావాన్ని నిలుపుతూ, ‘శిక్షించబడరు’ లేదా అంతిమ తీర్పు వంటి మరింత నిర్దిష్ట అర్థాన్ని రుద్దకుండా ఉంటుంది.
- source_word: הַחֹסִים בּוֹ
  choice: ఆయనను ఆశ్రయించే వారు
  rationale: חסה పదంలోని శరణు లేదా రక్షణస్థలం కోరే రూపకాన్ని సాధారణ ‘నమ్మకం’ కంటే ఖచ్చితంగా నిలుపుతుంది.
theological_decisions:
- issue: నֶפֶשׁ అనే పదం రక్షణ సందర్భంలో సూచించే అర్థం
  choice: ‘ప్రాణం’ అని అనువదించాం.
  alternative: ‘ఆత్మ’ లేదా ‘జీవితం’
  rationale: హీబ్రూ పదం మొత్తం సజీవ వ్యక్తిని లేదా జీవాన్ని సూచించగలదు. ‘ప్రాణం’ అన్నది దేహానికి భిన్నమైన అమూర్త భాగం మాత్రమే అనే ద్వైతార్థాన్ని అనవసరంగా రుద్దదు; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: יֶאְשְׁמוּ క్రియ యొక్క న్యాయపరమైన బలం
  choice: ‘దోషులుగా తేలరు’ అని అనువదించాం.
  alternative: ‘అపరాధబాధ్యతకు లోనుకారు’ లేదా ‘ఖండించబడరు’
  rationale: మూలక్రియ దోషం, అపరాధబాధ్యత అనే న్యాయపరమైన భావాన్ని కలిగి ఉంది. ఎంపిక చేసిన పదబంధం ఆ భావాన్ని నిలుపుతూ, దీనిని తప్పనిసరిగా అంతిమ తీర్పుకు మాత్రమే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కీర్తనా శైలి. సమాంతర వాక్యనిర్మాణాన్ని నిలిపి, దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం; పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో వరుసగా [a], [b]గా ఉన్నాయి.
