  text: Taste and see that Yahweh is good[a]; blessed is the man who takes refuge in him.
translation:
  language: te
  text: 'యాహ్వే మంచివాడని రుచి చూసి చూడండి;


    ఆయనలో ఆశ్రయం పొందే మనిషి[a] ధన్యుడు.'
  philosophy: optimal-equivalence
  footnotes:
