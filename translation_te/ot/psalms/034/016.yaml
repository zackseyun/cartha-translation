id: PSA.34.16
reference: Psalms 34:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: פְּנֵ֣י יְ֭הוָה בְּ/עֹ֣שֵׂי רָ֑ע לְ/הַכְרִ֖ית מֵ/אֶ֣רֶץ זִכְרָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/016.yaml
  text: The face of Yahweh is against those who do evil[b][a], to cut off the memory of them from the earth.
translation:
  language: te
  text: యెహోవా ముఖం చెడు చేసేవారికి విరోధంగా ఉంది; వారి జ్ఞాపకాన్ని భూమి నుండి తొలగించివేయడానికి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘భూమి నుండి’ అనే మాటకు, సందర్భాన్ని మరింత స్థానికంగా అర్థం చేసుకుంటే, ‘దేశం నుండి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנֵי
  choice: ముఖం
  rationale: హీబ్రూ పదానికి అక్షరార్థంగా ‘ముఖం’ అని అర్థం. ఇక్కడ అది వ్యక్తిగత సన్నిధి, వైఖరి, క్రియాశీల వ్యతిరేకతను సూచిస్తుంది; మూలంలోని సజీవమైన దైవిక రూపకాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ప్రతిలిపి చేయబడింది.
- source_word: בְּעֹשֵׂי רָע
  choice: చెడు చేసేవారికి ... విరోధంగా
  rationale: బְּ ఉపసర్గం ఈ సందర్భంలో శత్రుత్వపూర్వక దిశను వ్యక్తం చేస్తుంది. ‘చెడు చేసేవారు’ అనే రూపం హీబ్రూ కృదంత భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לְהַכְרִית
  choice: లేకుండా చేయడానికి
  rationale: כרת హిఫీల్ క్రియ ఇక్కడ పూర్తిగా తొలగించడాన్ని, అంతం చేయడాన్ని సూచిస్తుంది. జ్ఞాపకంతో కలిపి ‘జ్ఞాపకం లేకుండా చేయడం’ తెలుగులో సహజంగా ఉండి, ఉద్దేశ భావాన్ని నిలుపుతుంది.
- source_word: מֵאֶרֶץ
  choice: భూమిలో
  rationale: אֶרֶץ అనే పదానికి ‘దేశం’ లేదా ‘భూమి’ అనే అర్థాలు ఉన్నాయి. ఈ జ్ఞానకీర్తనలోని సాధారణ ప్రకటనకు విస్తృతమైన ‘భూమి’ సరిపోతుంది; ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: זִכְרָם
  choice: వారి జ్ఞాపకం
  rationale: హీబ్రూ నామవాచకానికి ‘జ్ఞాపకం/స్మరణ’ అనే భావం ఉంది. ‘వారి జ్ఞాపకం’ మూలంలోని ప్రత్యయార్థాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ‘యెహోవా ముఖం’ అనే దైవిక వ్యతిరేకతను తెలిపే ప్రయోగం
  choice: యెహోవా క్రియాశీల వ్యతిరేకతను తెలిపే ‘ముఖం’ అనే మానవరూప వర్ణనను నిలుపడం
  alternative: ‘యెహోవా చెడు చేసేవారికి విరోధంగా ఉన్నాడు’ అని రూపకాన్ని విప్పి చెప్పడం
  rationale: మూల హీబ్రూ దైవిక వైఖరిని శరీరరూప భాషలో వ్యక్తం చేస్తుంది. ‘ముఖం’ను నిలపడం దేవునికి భౌతిక శరీరం ఉందని నిర్ధారించకుండా, కవితాత్మక మరియు ధార్మిక బలాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కవితాత్మక శైలి. మూలంలోని ‘ముఖం’ రూపకం నిలుపబడింది. వాక్యాంతంలోని ఉద్దేశ భావాన్ని స్పష్టంగా ఉంచేందుకు అర్ధవిరామం వాడబడింది.
