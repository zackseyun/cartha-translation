source:
  edition: WLC
  text: כְּ֭פִירִים רָשׁ֣וּ וְ/רָעֵ֑בוּ וְ/דֹרְשֵׁ֥י יְ֝הוָ֗ה לֹא יַחְסְר֥וּ כָל טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/010.yaml
  text: Young lions suffer want and hunger[a], but those who seek Yahweh lack no good thing.
translation:
  language: te
  text: యువ సింహాలు లేమిలో పడి ఆకలిగొంటాయి[a]; కానీ యాహ్వేను వెదికేవారికి ఏ మేలూ కొదువ ఉండదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యువ సింహాలు పేదలై ఆకలిగొంటాయి.’ హీబ్రూ క్రియ లేమిలో ఉండడాన్ని లేదా పేదలుగా మారడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפִירִים
  choice: యువ సింహాలు
  rationale: ఈ నామవాచకం సాధారణంగా సింహాలను కాక, బలంగా ఎదిగిన యువ సింహాలను సూచిస్తుంది. సమృద్ధిగా ఆహారం సంపాదించగలవిగా కనిపించే జంతువులకే కొదువ కలగవచ్చనే కవితాత్మక వ్యత్యాసాన్ని ఇది నిలుపుతుంది.
- source_word: רָשׁוּ
  choice: లేమికి గురై
  rationale: ఈ క్రియ లేమిలో ఉండడం లేదా పేదరికంలోకి రావడం అనే భావాలను ఇవ్వగలదు. ‘లేమికి గురై’ ప్రధాన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, ‘ఆకలిగొంటాయి’తో అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: וְרָעֵבוּ
  choice: ఆకలిగొంటాయి
  rationale: మూల క్రియ ఆకలితో ఉండడాన్ని సూచిస్తుంది. ఈ రూపం తెలుగు కవితాత్మక వాక్యానికి సంక్షిప్తంగా, సహజంగా సరిపోతుంది.
- source_word: וְדֹרְשֵׁי יְהוָה
  choice: కానీ యాహ్వేను వెదికేవారికి
  rationale: కృదంత నిర్మాణం యాహ్వేను వెదకడం తమ స్వభావంగా కలిగినవారిని సూచిస్తుంది. ‘వెదికేవారు’ సాధారణ ఆధునిక తెలుగులో ఆ నిరంతర లక్షణాన్ని నిలుపుతుంది; వ్యత్యాసాన్ని స్పష్టం చేయడానికి సంధిని ‘కానీ’గా ఇచ్చాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, వ్యక్తిగత నామంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: לֹא יַחְסְרוּ
  choice: కొదువ ఉండదు
  rationale: ఇక్కడ అసంపూర్ణ క్రియారూపం సామెతాత్మకమైన సాధారణ హామీని వ్యక్తం చేస్తుంది. ‘కొదువ ఉండదు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כָל טוֹב
  choice: ఏ మేలూ
  rationale: ఈ పదబంధం ‘ఏ మంచి విషయమూ’ లేదా ‘సమస్త మేలు’ అనే సమగ్ర భావాన్ని ఇస్తుంది. నిషేధంతో కలిసి ‘ఏ మేలూ కొదువ ఉండదు’ తెలుగులో సహజంగా ఉంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో దైవనామమే ప్రత్యక్షంగా ఉంది. దానిని ఒక బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని వ్యక్తిగత నామాన్ని నిలుపుతుంది.
- issue: ‘ఏ మేలూ కొదువ ఉండదు’ అనే హామీ స్వరూపం
  choice: మూలంలోని సంపూర్ణమైన సామెతాత్మక ప్రకటనను యథాతథంగా నిలుపడం
  alternative: భౌతిక అవసరాలకు లేదా ఆధ్యాత్మిక మేలుకే పరిమితం చేసి వివరణాత్మకంగా అనువదించడం
  rationale: כָל טוֹב అనే మాట విస్తృతంగానే ఉంది. వచనం స్వయంగా ‘మేలు’ను ఒక నిర్దిష్ట వర్గానికి పరిమితం చేయదు; అందువల్ల అనువాదం ఆ వేదాంతపరమైన ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తనా కవిత్వానికి తగిన సంక్షిప్తమైన గంభీర శైలిని వాడాం. ‘లేమికి గురై—ఆకలిగొంటాయి’ మరియు ‘ఏ మేలూ కొదువ ఉండదు’ అనే సమతుల్య నిర్మాణాలు మూలంలోని వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతాయి.
