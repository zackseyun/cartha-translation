  yaml_path: translation/ot/psalms/034/006.yaml
  text: This poor man cried out[a], and Yahweh heard[b], and saved him from all his troubles.
translation:
  language: te
  text: ఈ దీనుడు[a] మొరపెట్టాడు; యాహ్వే విన్నాడు, అతని కష్టాలన్నిటి నుండి అతన్ని రక్షించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పేదవాడు,’ ‘బాధితుడు,’ లేదా ‘అణకువగలవాడు’ అని కూడా అనువదించవచ్చు. హీబ్రూ עָנִי పదానికి పేదరికం, బాధ, దీనస్థితి అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘విడిపించాడు’ లేదా ‘కాపాడాడు’ అని కూడా అనువదించవచ్చు. ఈ క్రియ ఆపద లేదా బాధ నుండి రక్షించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: ఈ
  rationale: సూచనార్థకమైన זֶה ఇక్కడ మాట్లాడుతున్న వ్యక్తిని ప్రత్యక్షంగా చూపిస్తుంది; తెలుగులో ‘ఈ’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: עָנִי
  choice: దీనుడు
  rationale: ఈ పదానికి పేదవాడు, బాధలో ఉన్నవాడు, అణకువగలవాడు అనే భావపరిధి ఉంది. ‘దీనుడు’ ఆ భావాలను సాధ్యమైనంతవరకు కలిపి ఉంచుతూ కీర్తన శైలికి తగినదిగా ఉంది.
- source_word: קָרָא
  choice: మొరపెట్టాడు
  rationale: ఆపదలో దేవునికి చేసిన అత్యవసర పిలుపును సూచించడానికి సాధారణమైన ‘పిలిచాడు’ కంటే ‘మొరపెట్టాడు’ సందర్భానికి మరింత సరిపోతుంది.
- source_word: יהוה
  choice: యాహ్వే
  rationale: హీబ్రూ మూలంలో ఉన్న దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించింది.
- source_word: שָׁמֵעַ
  choice: విన్నాడు
  rationale: సాక్ష్యరూప గతకాల వర్ణనలో దేవుడు మొరను విన్నాడనే సరళమైన భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִכָּל צָרוֹתָיו
  choice: అతని కష్టాలన్నిటి నుండి
  rationale: మూలంలోని ‘అతని సమస్త కష్టాల నుండి’ అనే సంపూర్ణతను, వ్యక్తిని సూచించే ప్రత్యయాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הוֹשִׁיעוֹ
  choice: అతన్ని రక్షించాడు
  rationale: ישׁע అనే క్రియలోని ఆపదనుండి కాపాడటం లేదా విడిపించడం అనే భావాన్ని అందిస్తూ, విస్తృతమైన బైబిలు రక్షణ పదజాలంతో సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. దానిని సాధారణ బిరుదుగా మార్చకుండా ‘యాహ్వే’గా ఇవ్వడం వ్యక్తిగత నామాన్ని నిలుపుతుంది.
- issue: עָנִי యొక్క పురుష ఏకవచన, ప్రతినిధి భావం
  choice: దీనుడు
  alternative: దీనుడైన వ్యక్తి / బాధితుడు
  rationale: ఇది మొదట కీర్తనకర్తను సూచించగల పురుష ఏకవచనం; అదే సమయంలో బాధలో ఉన్నవారికి ప్రతినిధిగా కూడా వినిపిస్తుంది. ‘దీనుడు’ ఈ రెండు అవకాశాలను మూసివేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవభరితమైన కీర్తన శైలి ఉపయోగించబడింది. ‘దీనుడు,’ ‘మొరపెట్టాడు,’ ‘రక్షించాడు’ అనే పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని కవితాత్మక సాంద్రతను నిలుపుతాయి.
