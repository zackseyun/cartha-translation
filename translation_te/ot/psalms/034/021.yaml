id: PSA.34.21
reference: Psalms 34:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: תְּמוֹתֵ֣ת רָשָׁ֣ע רָעָ֑ה וְ/שֹׂנְאֵ֖י צַדִּ֣יק יֶאְשָֽׁמוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/021.yaml
  text: Evil will put the wicked to death[a], and those who hate the righteous will be held guilty.
translation:
  language: te
  text: దుష్టుణ్ణి చెడు చంపుతుంది[a]; నీతిమంతుణ్ణి ద్వేషించేవారు దోషులుగా తీర్చబడతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విపత్తు దుష్టుణ్ణి చంపుతుంది.” హెబ్రీ పదానికి “చెడు,” “హాని,” లేదా “విపత్తు/ఆపద” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּמוֹתֵת
  choice: చంపుతుంది
  rationale: מות ధాతువు హిఫిల్ రూపంలో ఉండి, చెడు దుష్టుని మరణానికి కారణమవుతుందని తెలియజేస్తుంది. తెలుగులో ‘చంపుతుంది’ సహజంగా ఉండి ఆ causative భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: רָשָׁע
  choice: దుష్టుణ్ణి
  rationale: ఏకవచన విశేషణం నామవాచకంగా వాడబడింది. ‘దుష్టుణ్ణి’ ప్రతినిధి ఏకవచనాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: רָעָה
  choice: చెడు
  rationale: ఈ పదానికి నైతిక చెడు, హాని, విపత్తు అనే అర్థాలు ఉండవచ్చు. ‘చెడు’ మూలంలోని సంక్షిప్తతను, ఉద్దేశపూర్వక ద్వంద్వార్థాన్ని కాపాడుతుంది; ‘విపత్తు’ అనే సందర్భోచిత ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: שֹׂנְאֵי
  choice: ద్వేషించేవారు
  rationale: వర్తమాన కృదంత బహువచన భావాన్ని తెలుగులో సహజమైన సంబంధార్థక రూపంతో వ్యక్తం చేస్తుంది; కొనసాగుతున్న లక్షణాన్నీ సూచిస్తుంది.
- source_word: צַדִּיק
  choice: నీతిమంతుణ్ణి
  rationale: నామవాచకంగా వాడిన ఏకవచన విశేషణం. ‘నీతిమంతుణ్ణి’ మూలంలోని ప్రతినిధి ఏకవచనాన్ని, వ్యక్తిని సూచించే భావాన్ని నిలుపుతుంది.
- source_word: יֶאְשָׁמוּ
  choice: దోషులుగా తీర్చబడతారు
  rationale: אשם ఇక్కడ అపరాధ బాధ్యతకు లోనవడం లేదా దోషులుగా నిర్ధారించబడడం అనే న్యాయపరమైన భావాన్ని కలిగి ఉంది. ఈ అనువాదం దోషబాధ్యతను స్పష్టంగా తెలియజేస్తూ, మూలం చెప్పినదానికంటే ఎక్కువ శిక్షాభావాన్ని చేర్చదు.
theological_decisions:
- issue: רָעָה అనే పదాన్ని నైతిక ‘చెడు’గా అనువదించాలా, పరిస్థితిజన్య ‘విపత్తు’గా అనువదించాలా
  choice: చెడు
  alternative: విపత్తు; ఆపద
  rationale: వాక్యంలో רָעָה దుష్టుణ్ణి చంపే కర్తగా వ్యక్తీకరించబడింది. ‘చెడు’ హెబ్రీ పదంలోని నైతిక భావాన్నీ, దుష్టుని చెడే అతని నాశనానికి దారితీస్తుందనే వ్యంగ్య సంబంధాన్నీ నిలుపుతుంది. ‘విపత్తు’ కూడా సందర్భానికి సాధ్యమైన అర్థం కాబట్టి పాదసూచికలో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ సహజమైన శైలి వాడబడింది. సమాంతర వాక్య నిర్మాణం, ప్రతినిధి ఏకవచనం, మూలంలోని నైతిక-విపత్తు ద్వంద్వార్థం కాపాడబడ్డాయి.
