source:
  edition: WLC
  text: דָּרַ֣שְׁתִּי אֶת יְהוָ֣ה וְ/עָנָ֑/נִי וּ/מִ/כָּל מְ֝גוּרוֹתַ֗/י הִצִּילָֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/004.yaml
  text: I sought Yahweh[a], and he answered me; he delivered me from all my fears.
translation:
  language: te
  text: నేను యాహ్వేను వెదికాను; ఆయన నాకు జవాబిచ్చాడు. నా భయాలన్నిటి నుండి[a] ఆయన నన్ను విడిపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేను భయపడిన వాటన్నిటి నుండి’; లేదా, ‘నా భీతులన్నిటి నుండి.’
    reason: מְגוּרוֹתַי అనే పదం భయాలను, భయపెట్టే విషయాలను, లేదా మరింత బలమైన ‘భీతులను’ సూచించగల నిఘంటు విస్తృతిని కలిగి ఉంది.
lexical_decisions:
- source_word: דָּרַשְׁתִּי
  choice: నేను వెదికాను
  rationale: ఈ సందర్భంలో דרשׁ అనేది కేవలం ప్రశ్నించడం కాదు; ప్రార్థనలో, ఆధారపడుతూ దేవుని ఆశ్రయించి వెదకడాన్ని సూచిస్తుంది. ‘వెదికాను’ సంక్షిప్తంగా, సహజంగా కీర్తనకర్త సాక్ష్యానికి సరిపోతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ లిప్యంతరీకరణకు అనుగుణంగా ‘యాహ్వే’ అని ఇచ్చాం.
- source_word: וְעָנָנִי
  choice: ఆయన నాకు జవాబిచ్చాడు
  rationale: ענהకు ఏకవచన ప్రథమ పురుష ప్రత్యయం చేరిన ఈ రూపం ‘నాకు జవాబిచ్చాడు’ అని సహజంగా అర్థమిస్తుంది; కర్త యాహ్వే అని తెలుగులో స్పష్టంగా చూపించాం.
- source_word: מִכָּל
  choice: అన్నిటి నుండి
  rationale: מן + כל నిర్మాణం పేర్కొన్న వర్గంలోని ప్రతిదానినుంచి సంపూర్ణ విముక్తిని తెలియజేస్తుంది.
- source_word: מְגוּרוֹתַי
  choice: నా భయాలన్నిటి నుండి
  rationale: ఈ సందర్భంలో מגורות నివాసస్థలాలను కాక, భయాన్ని లేదా భయపెట్టే వాటిని సూచిస్తుంది. ‘నా భయాలు’ ఆధునిక తెలుగులో సహజమైనది; అయితే ‘నేను భయపడిన వాటన్నీ’ అనే వస్తునిష్ఠ భావం కూడా సాధ్యమే కాబట్టి పాదటిప్పణిలో ఉంచాం.
- source_word: הִצִּילָנִי
  choice: ఆయన నన్ను విడిపించాడు
  rationale: Hiphil రూపంలోని נצל ప్రమాదం లేదా భయం నుంచి తప్పించి విముక్తి చేయడాన్ని సూచిస్తుంది. ‘విడిపించాడు’ శారీరక రక్షణకే అర్థాన్ని పరిమితం చేయకుండా విస్తృత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవ నామం יהוהను ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: హీబ్రూ పాఠంలో దైవ నామం నేరుగా ఉంది. దానిని బిరుదైన ‘ప్రభువు’తో మార్చకుండా వ్యక్తిగత నామంగా నిలుపుతూ ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
- issue: מְגוּרוֹתַי భావం—అంతర్గత భయాలా, భయపెట్టిన విషయాలా
  choice: నా భయాలన్నిటి నుండి
  alternative: నేను భయపడిన వాటన్నిటి నుండి; నా భీతులన్నిటి నుండి
  rationale: నామవాచకం భయాలను గానీ భయానికి కారణమైన వాటిని గానీ సూచించగలదు. ప్రధాన పాఠంలో సహజమైన విస్తృత పదాన్ని వాడి, నిజమైన నిఘంటు అస్పష్టతను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన కీర్తనా శైలిని పాటించాం. హీబ్రూ వాక్యంలోని సాక్ష్యరూప సరళతను నిలుపుతూ రెండు సహజ తెలుగు వాక్యాలుగా విభజించాం. పాదటిప్పణి సూచికను అది వివరిస్తున్న ‘భయాలన్నిటి నుండి’ అన్న పదబంధానికే జతచేశాం.
