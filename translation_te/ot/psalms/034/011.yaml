  text: לְֽכוּ בָ֭נִים שִׁמְעוּ לִ֑/י יִֽרְאַ֥ת יְ֝הוָ֗ה אֲלַמֶּדְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/011.yaml
  text: Come[a], children, listen to me[b]; I will teach you the fear of Yahweh.
translation:
  language: te
  text: రండి, పిల్లలారా[a], నా మాట వినండి; యాహ్వే పట్ల భయాన్ని[b] మీకు నేర్పుతాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో పదశః ‘కుమారులారా’; ఇక్కడ జ్ఞానబోధను నేర్చుకునేవారిని సాధారణంగా సంబోధిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘యాహ్వే పట్ల భయం’ అనేది జ్ఞానసాహిత్య వ్యక్తీకరణ; ఇందులో భయం మాత్రమే కాక భక్తిపూర్వక విస్మయం, గౌరవం, విధేయత కూడా ఇమిడి ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: రండి
  rationale: הלך అనే క్రియ సాధారణంగా ‘వెళ్లు/నడుచు’ అని అర్థమిచ్చినా, ఇక్కడ ప్రత్యక్ష పిలుపులో ఆహ్వానార్థకంగా ఉంది; అందువల్ల సహజమైన తెలుగులో ‘రండి’ సరైనది.
- source_word: בָנִים
  choice: పిల్లలారా
  rationale: పదశః ‘కుమారులారా’; అయితే జ్ఞానసాహిత్య బోధనా సందర్భంలో ఇది శిష్యులను లేదా యువ అభ్యాసకులను ఉద్దేశించే సంబోధనగా పనిచేస్తుంది. ‘పిల్లలారా’ బోధనా స్వరాన్ని నిలుపుతూ అనవసరంగా పురుషులకు మాత్రమే పరిమితం చేయదు.
- source_word: שִׁמְעוּ לִי
  choice: నా మాట వినండి
  rationale: ఈ పదబంధం కేవలం శబ్దాన్ని వినడమే కాక శ్రద్ధగా ఆలకించి అనుసరించాలనే పిలుపును సూచిస్తుంది; ఆధునిక తెలుగులో ‘నా మాట వినండి’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יִרְאַת יְהוָה
  choice: యెహోవా పట్ల భయం
  rationale: జ్ఞానసాహిత్యంలో ప్రాముఖ్యమైన ఈ పదబంధంలోని ‘భయం’ అనే భావాన్ని కేవలం ‘భక్తి’గా మృదువుచేయకుండా నిలుపుతుంది; అదే సమయంలో ‘పట్ల’ అనే రూపం సహజమైన తెలుగు సంబంధాన్ని చూపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించింది.
- source_word: אֲלַמֶּדְכֶם
  choice: మీకు నేర్పుతాను
  rationale: పీయేల్ అసంపూర్ణ క్రియారూపం ఈ సందర్భంలో వక్త సంకల్పాన్ని తెలియజేస్తుంది; ‘మీకు నేర్పుతాను’ దానిని సూటిగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יִרְאַת יְהוָה అనే జ్ఞానసాహిత్య పదబంధం
  choice: యెహోవా పట్ల భయం
  alternative: యెహోవా పట్ల భయభక్తులు
  rationale: ‘భయభక్తులు’ సహజమైన మతపరమైన తెలుగు అయినా, అది יִרְאָה లోని నిజమైన భయం, విస్మయం, గౌరవం, విధేయతల మధ్యనున్న ఉద్వేగాన్ని ముందుగానే మృదువుచేయవచ్చు. ప్రధాన పాఠంలో ‘భయం’ను నిలిపి, దాని విస్తృత భావపరిధిని పాదసూచికలో వివరిస్తుంది.
- issue: יְהוָה దైవనామ అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా తెలుగులో పరిచితమైన లిప్యంతరీకరణతో అందించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన బోధనా శైలి. ‘పిల్లలారా’ అనే సంబోధన గురువు-శిష్య సందర్భాన్ని సహజంగా నిలుపుతుంది; ‘భయం’ అనే పదం మూలంలోని ధార్మిక ఉద్వేగాన్ని ఉద్దేశపూర్వకంగా కాపాడుతుంది.
