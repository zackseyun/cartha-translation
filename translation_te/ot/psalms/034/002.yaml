source:
  edition: WLC
  text: בַּ֭/יהוָה תִּתְהַלֵּ֣ל נַפְשִׁ֑/י יִשְׁמְע֖וּ עֲנָוִ֣ים וְ/יִשְׂמָֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/002.yaml
  text: In Yahweh my soul will boast[b][a]; the humble will hear and rejoice.
translation:
  language: te
  text: యాహ్వేలో[a] నా ప్రాణం గొప్పగా చెప్పుకొంటుంది; దీనులు[b] విని ఆనందిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో దేవుని ప్రత్యేక నామం יהוה (యాహ్వే) ఉంది.
    reason: divine_name
  - marker: b
    text: లేదా ‘వినయంగలవారు,’ ‘సాత్వికులు,’ లేదా ‘బాధితులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיהוָה
  choice: యాహ్వేలో
  rationale: בְּ ఉపసర్గ ఇక్కడ అతిశయానికి ఆధారం లేదా పరిధిని సూచిస్తుంది. దేవుని వ్యక్తిగత నామమైన יהוהను ‘యాహ్వే’గా లిప్యంతరీకరించి, మూలంలోని ‘లో’ భావాన్ని నిలిపాం.
- source_word: תִּתְהַלֵּל
  choice: అతిశయిస్తుంది
  rationale: הלל ధాతువు హిత్పయేల్ రూపంలో ఇక్కడ ‘తన ఘనతను చెప్పుకోవడం/అతిశయించడం’ అనే భావం ఇస్తుంది; సాధారణ ‘స్తుతించడం’ కాదు. అసంపూర్ణ క్రియారూపంలోని ప్రకటనాత్మక లేదా కొనసాగుతున్న భావాన్ని తెలుగు వర్తమాన-భవిష్యత్ సందర్భానికి సహజంగా ఉండే ‘అతిశయిస్తుంది’తో వ్యక్తం చేశాం.
- source_word: נַפְשִׁי
  choice: నా ప్రాణం
  rationale: נפשׁ ఇక్కడ సంపూర్ణ వ్యక్తిని సూచించగలిగినా, కీర్తనలోని కవితాత్మక మానవ అంతరంగ వ్యక్తీకరణను నిలుపుటకు ‘నా ప్రాణం’ అని అనువదించాం.
- source_word: יִשְׁמְעוּ
  choice: విని
  rationale: שׁמע యొక్క సాధారణ అర్థం ‘వినడం’. తరువాతి క్రియతో సహజమైన తెలుగు క్రమాన్ని ఏర్పరచడానికి ‘విని’ అనే సంయుక్త క్రియారూపం వాడాం.
- source_word: עֲנָוִים
  choice: దీనులు
  rationale: ఈ పదం వినయంగలవారు, సాత్వికులు, బాధితులు లేదా అణగారినవారు అనే పరస్పరం మిళితమైన భావాలను కలిగి ఉంది. ‘దీనులు’ సామాజిక అల్పస్థితినీ వినయ స్వభావాన్నీ కొంతవరకు కలిపి ఉంచుతుంది.
- source_word: וְיִשְׂמָחוּ
  choice: సంతోషిస్తారు
  rationale: שׂמח అంటే సంతోషించడం లేదా ఆనందించడం. వినడం వల్ల కలిగే ప్రతిస్పందనను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘సంతోషిస్తారు’ అని అనువదించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాక దేవుని ప్రత్యేక నామమైన יהוה ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని నామాన్ని ప్రత్యక్షంగా నిలుపుతుంది.
- issue: అతిశయానికి అంశం మరియు ఆధారం
  choice: యాహ్వేలో నా ప్రాణం అతిశయిస్తుంది
  alternative: నేను యాహ్వేను స్తుతిస్తాను
  rationale: హిత్పయేల్ క్రియలోని ‘అతిశయించడం’ అనే భావాన్నీ, בְּ సూచించే యాహ్వేలోనే ఉన్న ఆధారాన్నీ నిలిపాం. దీనిని కేవలం ‘స్తుతి’గా మార్చితే మూలంలోని ఉద్దేశపూర్వక భావ ఉద్వేగం తగ్గిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా చదవదగినప్పటికీ కీర్తనాత్మక గంభీరతను నిలిపాం. ‘నా ప్రాణం’ అనే రూపం మూలంలోని కవితాత్మక వ్యక్తీకరణను కాపాడుతుంది; ‘దీనులు’ అనే పదానికి ఉన్న అర్థవిస్తృతిని పాదసూచికలో తెలిపాం.
