  yaml_path: translation/ot/psalms/034/017.yaml
  text: They cried out[a], and Yahweh heard, and delivered them from all their troubles.
translation:
  language: te
  text: వారు మొరపెట్టుకున్నారు, అప్పుడు యాహ్వే[a] విన్నాడు; వారి సమస్త కష్టాలనుండి వారిని విడిపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: YHWH (יהוה), దేవుని వ్యక్తిగత నామం; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: దైవనామపు రూపం మరియు సంప్రదాయ ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: צָעֲקוּ
  choice: వారు మొరపెట్టుకున్నారు
  rationale: Qal perfect 3cp; సహాయం కోసం చేసిన అత్యవసరమైన కేకను ‘మొరపెట్టుకున్నారు’ సహజంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన రూపంలో వ్యక్తిగత నామంగా ఉంచుతుంది.
- source_word: שָׁמֵעַ
  choice: విన్నాడు
  rationale: రూపపరంగా participle అయినప్పటికీ, చుట్టూ ఉన్న perfect క్రియలతో కూడిన కవితాత్మక వరుసలో గతకాల స్పందనగా సహజంగా పనిచేస్తుంది.
- source_word: מִכָּל
  choice: అన్నిటి నుంచి
  rationale: מן + כָּל వారి కష్టాల సమగ్రత నుంచి విడిపించడాన్ని సూచిస్తుంది.
- source_word: צָרוֹתָם
  choice: వారి కష్టాలు
  rationale: צָרוֹת బాధలు, ఇబ్బందులు, కష్టాలు అనే పరిధిని కలిగి ఉంది; ‘కష్టాలు’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: הִצִּילָם
  choice: వారిని విడిపించాడు
  rationale: נצל Hiphil ప్రమాదం లేదా కష్టం నుంచి తప్పించడం/రక్షించడం అనే భావం ఇస్తుంది; ‘విడిపించాడు’ సందర్భానికి తగిన విస్తృత అర్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. బిరుదైన ‘ప్రభువు’తో దాన్ని భర్తీ చేయకుండా వ్యక్తిగత నామాన్ని నిలుపుతూ, తెలుగులో సంప్రదాయంగా సుపరిచితమైన ‘యెహోవా’ రూపాన్ని వాడాం; సంభావ్య ఉచ్చారణను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కీర్తనాశైలిని ఉపయోగించాం. హీబ్రూ క్రియల వరుసను స్పష్టంగా నిలుపడానికి అర్ధవిరామాలు వాడాం; మూలంలో ప్రత్యక్ష కర్మను పేర్కొనని ‘విన్నాడు’ అనే రూపాన్ని అలాగే ఉంచాం.
