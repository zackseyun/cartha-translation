source:
  edition: WLC
  text: ס֣וּר מֵ֭/רָע וַ/עֲשֵׂה ט֑וֹב בַּקֵּ֖שׁ שָׁל֣וֹם וְ/רָדְפֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/014.yaml
  text: Turn away from evil and do good[a]; seek peace and pursue it.
translation:
  language: te
  text: చెడును విడిచిపెట్టు; మేలు చేయి; శాంతిని[a] వెదుకు, దానిని వెంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శాంతి’కి వాడిన హీబ్రూ పదం షాలోమ్; అది కలహం లేకపోవడమే కాకుండా సంపూర్ణత, క్షేమం లేదా సౌఖ్యం అనే భావాలను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּר מֵרָע
  choice: చెడును విడిచిపెట్టి
  rationale: סוּר అనే ఆజ్ఞ చెడు నుండి తొలగిపోవడం లేదా దాన్ని విడిచిపెట్టడం అనే క్రియాశీల నైతిక మళ్లింపును సూచిస్తుంది; మִן విభక్తి వేరుపడటాన్ని తెలియజేస్తుంది.
- source_word: וַעֲשֵׂה טוֹב
  choice: మేలు చేయి
  rationale: హీబ్రూ వాక్యంలోని చెడు–మేలు వ్యత్యాసాన్ని సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בַּקֵּשׁ
  choice: వెదకి
  rationale: పీయేల్ ఆజ్ఞారూపం ఉద్దేశపూర్వకమైన, శ్రద్ధగల అన్వేషణను సూచిస్తుంది; ‘వెదకి’ ఈ ఆజ్ఞను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שָׁלוֹם
  choice: శాంతి
  rationale: ఇక్కడ ప్రధానార్థంగా శాంతి సరిపోతుంది; అయితే హీబ్రూ పదం సంపూర్ణ క్షేమం, సౌఖ్యం వంటి విస్తృత భావాలనూ కలిగి ఉంది, వాటిని పాదటిప్పణిలో ఉంచాం.
- source_word: וְרָדְפֵהוּ
  choice: దానిని వెంటాడు
  rationale: רדף క్రియలోని చురుకైన, పట్టుదలగల అనుసరణ భావాన్ని ‘వెంటాడు’ నిలుపుతుంది; పురుష ఏకవచన ప్రత్యయం ముందున్న ‘శాంతి’ని సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జ్ఞానోపదేశ శైలిని ఉపయోగించాం. సమాంతర ఆజ్ఞల లయను, చివరి క్రియలోని చురుకుదనాన్ని నిలిపాం. పాదటిప్పణి సూచికను సంబంధిత ‘శాంతి’ భావానికి అనుసంధానిస్తూ వాక్యాంతంలో ఉంచాం.
