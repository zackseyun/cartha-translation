source:
  edition: WLC
  text: מִֽי הָ֭/אִישׁ הֶ/חָפֵ֣ץ חַיִּ֑ים אֹהֵ֥ב יָ֝מִ֗ים לִ/רְא֥וֹת טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/012.yaml
  text: Who is the man who delights in life[b][a], loving days to see good?
translation:
  language: te
  text: జీవితాన్ని కోరుతూ, మేలు చూడటానికి రోజులను ఇష్టపడే మనిషి[a] ఎవడు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వ్యక్తి’ / ‘ఎవరైనా’; హెబ్రీలో ‘మనిషి’ అనే పదం సాధారణ ప్రతినిధిక ఏకవచనంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: ఎవడు?
  rationale: ఇది జ్ఞానోపదేశ శైలిలోని అలంకారిక ప్రశ్న. ‘ఎవడు?’ అనే రూపం ఏకవచనంలోని הָאִישׁతో సహజంగా సరిపోతుంది.
- source_word: הָאִישׁ
  choice: మనిషి[a]
  rationale: నిర్దిష్ట పుంలింగ ఏకవచన రూపాన్ని నిలుపుతూ, సందర్భంలోని ప్రతినిధికమైన సాధారణ భావాన్ని ‘మనిషి’ తెలియజేస్తుంది.
- source_word: הֶחָפֵץ
  choice: కోరుతూ
  rationale: חפץ బలమైన కోరికను లేదా ఇష్టాన్ని సూచిస్తుంది. తెలుగు వాక్య ప్రవాహంలో ‘జీవితాన్ని కోరుతూ’ సహజంగా ఉంటుంది.
- source_word: חַיִּים
  choice: జీవితాన్ని
  rationale: రూపపరంగా బహువచనమైనా, ఈ హెబ్రీ పదం సాధారణంగా ‘జీవితం’ అనే సమష్టి భావంలో వాడబడుతుంది.
- source_word: אֹהֵב
  choice: ఇష్టపడే
  rationale: అక్షరార్థంగా ‘ప్రేమించే’ అయినా, రోజులు జీవించాలనే కోరికను తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘ఇష్టపడే’ అనువైనది.
- source_word: יָמִים
  choice: ఎక్కువ రోజులు జీవించడాన్ని
  rationale: ‘రోజులను ప్రేమించడం’ అనే హెబ్రీ ప్రయోగం దీర్ఘకాలం జీవించాలనే కోరికను సూచిస్తుంది. ‘రోజులు’ అనే మూల చిత్రాన్ని ఉంచుతూ తెలుగులో అర్థవంతంగా చెప్పబడింది.
- source_word: לִרְאוֹת
  choice: చూడాలని[b]
  rationale: ראה యొక్క ప్రత్యక్ష అర్థమైన ‘చూడడం’ను నిలిపి, ఉద్దేశాన్ని తెలిపే తెలుగు నిర్మాణం వాడబడింది; ‘అనుభవించడం’ అనే భావం పాదసూచికలో ఇవ్వబడింది.
- source_word: טוֹב
  choice: మేలు
  rationale: మేలు, శ్రేయస్సు, మంచిదైనది వంటి విస్తృత భావాలకు వీలిచ్చే మూలపదపు ఉద్దేశపూర్వక విశాలతను ఇది కాపాడుతుంది.
theological_decisions:
- issue: సాధారణ ప్రతినిధిక పుంలింగ ప్రయోగం
  choice: మనిషి
  alternative: వ్యక్తి / ఎవరైనా
  rationale: హెబ్రీలో వ్యాకరణపరంగా పుంలింగ ఏకవచనం ఉన్నప్పటికీ, సందర్భంలో అది సాధారణ ప్రతినిధిక భావాన్ని కలిగి ఉంది. మూలరూపాన్ని ప్రతిబింబించడానికి ‘మనిషి’ని ఉంచి, దాని సాధారణ వర్తింపును పాదసూచికలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జ్ఞానోపదేశ కీర్తనకు తగిన గంభీరమైన కానీ సులభంగా అర్థమయ్యే ప్రశ్నారూపం వాడబడింది. హెబ్రీ సమాంతర భావాన్ని కాపాడుతూ, ‘రోజులను ప్రేమించడం’ అనే నేరుగా అనువదిస్తే అసహజమైన ప్రయోగాన్ని ‘ఎక్కువ రోజులు జీవించడాన్ని ఇష్టపడే’ అని సహజీకరించాం.
