source:
  edition: WLC
  text: קָר֣וֹב יְ֭הוָה לְ/נִשְׁבְּרֵי לֵ֑ב וְֽ/אֶת דַּכְּאֵי ר֥וּחַ יוֹשִֽׁיעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/018.yaml
  text: Yahweh is near to the brokenhearted[a], and he saves those crushed in spirit.
translation:
  language: te
  text: యాహ్వే హృదయం విరిగినవారికి దగ్గరగా ఉంటాడు; ఆత్మలో నలిగినవారిని ఆయన రక్షిస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అణగారిన ఆత్మగలవారిని.” హీబ్రూ పదబంధం అంతరంగంగా నలిగినవారిని లేదా వినమ్రపరచబడినవారిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרוֹב
  choice: సమీపంగా ఉంటాడు
  rationale: విధేయ విశేషణమైన ‘సమీపుడు/దగ్గరగా ఉన్నవాడు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, స్థలసంబంధమైన మరియు సంబంధసంబంధమైన భావసూచనలను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే దాని లిప్యంతరీకరణతో అందించింది.
- source_word: לְנִשְׁבְּרֵי לֵב
  choice: హృదయం విరిగినవారికి
  rationale: అక్షరార్థంగా ‘హృదయంలో విరిగినవారు’ అనే రూపకాన్ని సహజంగా, అంతరంగ విధ్వంస భావాన్ని కోల్పోకుండా వ్యక్తం చేస్తుంది.
- source_word: וְאֶת
  choice: ; ... వారిని
  rationale: אֵת ప్రత్యక్ష కర్మను సూచిస్తుంది; తెలుగులో విభక్తి ద్వారా దాని వ్యాకరణ పాత్రను వ్యక్తం చేసి, וְను రెండు సమాంతర వాక్యభాగాలను కలిపే విరామంతో సహజంగా ప్రతిబింబించింది.
- source_word: דַּכְּאֵי רוּחַ
  choice: ఆత్మలో నలిగినవారిని
  rationale: דכאలోని నలిపివేయబడిన, కుంగదీయబడిన తీవ్ర భావాన్ని నిలుపుతుంది; దానిని తప్పనిసరిగా పశ్చాత్తాప భావంగా పరిమితం చేయదు.
- source_word: יוֹשִׁיעַ
  choice: ఆయన రక్షిస్తాడు
  rationale: ישׁע హిఫీల్ రూపంలోని రక్షించడం/విడిపించడం అనే అర్థాన్ని, విస్తృత బైబిలీయ రక్షణ పదజాలంతో అనుసంధానం నిలిచేలా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. తెలుగులో సంప్రదాయంగా స్థిరపడిన ‘యెహోవా’ రూపాన్ని ఉపయోగించింది; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయ లిప్యంతరీకరణ.
- issue: דַּכְּאֵי רוּחַ భావసూక్ష్మత
  choice: ఆత్మలో నలిగినవారు
  alternative: వినమ్ర ఆత్మగలవారు / పశ్చాత్తాపంతో కుంగినవారు
  rationale: ఈ పదబంధం అంతరంగంగా నలిగిపోవడం లేదా అణగిపోవడాన్ని సూచించగలదు. సందర్భం తప్పనిసరిగా పశ్చాత్తాపాన్నే నిర్దేశించనందున, విస్తృతమైన బాధా-వినయ భావాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితాత్మక శైలిని ఉపయోగించింది. ‘హృదయం విరిగినవారు,’ ‘ఆత్మలో నలిగినవారు’ అనే సమాంతర రూపకాలను నిలిపి, సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఎంచుకుంది.
