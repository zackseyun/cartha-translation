id: PSA.34.5
reference: Psalms 34:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הִבִּ֣יטוּ אֵלָ֣י/ו וְ/נָהָ֑רוּ וּ֝/פְנֵי/הֶ֗ם אַל יֶחְפָּֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/005.yaml
  text: They looked to him and were radiant[b][a], and their faces were not put to shame.
translation:
  language: te
  text: వారు ఆయనవైపు[a] చూశారు, ప్రకాశించారు[b]; వారి ముఖాలు సిగ్గుపడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పఠన సంప్రదాయంలో ఇక్కడ ‘ఆయనవైపు,’ ‘నావైపు’ అనే రెండు పఠనాలు ఉన్నాయి. సందర్భాన్ని బట్టి ప్రధాన పాఠంలో ‘ఆయనవైపు’ అని అనువదించాం.
    reason: textual_variant
  - marker: b
    text: లేదా ‘వెలిగిపోయారు.’ ఇక్కడి హీబ్రూ క్రియ వెలుగు లేదా ముఖకాంతిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבִּיטוּ
  choice: చూశారు
  rationale: నבט హిఫిల్ రూపం ఒకరి వైపు చూడడం లేదా దృష్టి నిలపడం అనే భావాన్ని ఇస్తుంది. ‘చూశారు’ ఆధునిక తెలుగులో సహజంగా ఉండి, మూలంలో లేని తీవ్రతను అదనంగా చేర్చదు.
- source_word: אֵלָי/ו
  choice: ఆయనవైపు
  rationale: సందర్భంలో ప్రజలు యెహోవావైపు చూస్తున్నారని మూడవ పురుష పఠనం సహజంగా సూచిస్తుంది. అయితే ‘నావైపు’ అనే ప్రథమ పురుష పఠనాన్ని పాఠభేదంగా పాదటిప్పణిలో నిలిపాం.
- source_word: וְנָהָרוּ
  choice: ప్రకాశించారు
  rationale: ఈ సందర్భంలో נהר క్రియ ముఖకాంతి లేదా వెలుగును సూచిస్తుంది. ‘ప్రకాశించారు’ కవితాత్మక బింబాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וּפְנֵיהֶם
  choice: వారి ముఖాలు
  rationale: హీబ్రూ భాషలోని స్పష్టమైన ‘ముఖాలు’ అనే బింబాన్ని భావార్థంగా మార్చకుండా అలాగే ఉంచుతుంది.
- source_word: אַל יֶחְפָּרוּ
  choice: సిగ్గుపడలేదు
  rationale: ఈ పంక్తిలో అవమానం లేదా అపకీర్తి పాలుకాకపోవడం అనే ఫలితాన్ని తెలుపుతుంది. ముందున్న సంపూర్ణ క్రియలతో కవితాత్మక సమాంతరాన్ని నిలుపుతూ సహజమైన తెలుగు భూతకాల రూపం వాడబడింది.
theological_decisions:
- issue: אֵלָי/ו లోని పఠన భేదం
  choice: ఆయనవైపు
  alternative: నావైపు
  rationale: కీర్తన సందర్భంలో ప్రజలు యెహోవావైపు చూడటం మూడవ పురుష పఠనానికి బలం ఇస్తుంది. అయినా ప్రథమ పురుష పఠనం వక్త దృక్కోణాన్ని మార్చుతుంది కాబట్టి దాన్ని తొలగించకుండా పాదటిప్పణిలో భద్రపరిచాం.
- issue: אַל יֶחְפָּרוּ యొక్క కాలం మరియు విధి
  choice: సిగ్గుపడలేదు
  alternative: సిగ్గుపడకుందురుగాక / సిగ్గుపడరు
  rationale: אַל తో కూడిన అసంపూర్ణ క్రియకు విధ్యర్థక ఛాయ ఉండగలిగినా, ఇక్కడ ముందున్న సంపూర్ణ క్రియలతో సమాంతరంగా అనుభవించిన ఫలితాన్ని చెప్పే పఠనం సందర్భోచితం. ప్రత్యామ్నాయ విధ్యర్థక లేదా భవిష్యత్ భావాన్ని ప్రధాన పాఠంలో బలవంతంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కవితా శైలి వాడబడింది. హీబ్రూ వాక్యంలోని బహువచన కర్తను ‘వారు’ అని స్పష్టం చేసి, ‘ముఖాలు’ అనే concrete imageryని నిలిపాం.
