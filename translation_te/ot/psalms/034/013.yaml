source:
  edition: WLC
  text: נְצֹ֣ר לְשׁוֹנְ/ךָ֣ מֵ/רָ֑ע וּ֝/שְׂפָתֶ֗י/ךָ מִ/דַּבֵּ֥ר מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/013.yaml
  text: Guard your tongue from evil[a], and your lips from speaking deceit.
translation:
  language: te
  text: 'నీ నాలుకను చెడు పలకకుండా కాపాడుకో,[a]

    నీ పెదవులను వంచన పలకకుండా కాపాడుకో.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ నాలుకను చెడు నుండి, నీ పెదవులను వంచన పలకడం నుండి కాపాడుకో.”
    reason: ‘నుండి’ అనే మూలభాషా నిర్మాణాన్ని మరింత అక్షరార్థంగా చూపించే ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: נְצֹר
  choice: కాపాడుకో
  rationale: ఈ ఆజ్ఞారూప క్రియకు కాపాడటం, అదుపులో ఉంచడం, జాగ్రత్తగా చూసుకోవడం అనే భావాలు ఉన్నాయి. మాటలను నియంత్రించుకోవాలనే నైతిక పిలుపును సహజమైన ఆధునిక తెలుగులో ‘కాపాడుకో’ తెలియజేస్తుంది.
- source_word: לְשׁוֹנְךָ
  choice: నీ నాలుకను
  rationale: మాటకు అవయవాన్ని ప్రతీకగా వాడిన హీబ్రూ కవితా చిత్రాన్ని నేరుగా నిలుపుతుంది; తెలుగులోనూ ఇది సులభంగా అర్థమవుతుంది.
- source_word: מֵרָע
  choice: చెడు పలకకుండా
  rationale: అక్షరార్థంగా ‘చెడునుండి’ అయినప్పటికీ, నాలుకకు సంబంధించిన సందర్భంలో ఉద్దేశం చెడు మాట పలకకుండా ఉండటమే. ‘చెడు’ అనే పదం רַע లోని నైతిక బలాన్ని నిలుపుతుంది.
- source_word: וּשְׂפָתֶיךָ
  choice: నీ పెదవులను
  rationale: ‘నాలుక’తో సమాంతరంగా ఉన్న శరీరావయవ చిత్రణను, హీబ్రూ కవితా నిర్మాణాన్ని నిలుపుతుంది.
- source_word: מִדַּבֵּר
  choice: మాట్లాడకుండా
  rationale: మూలంలోని ‘మాట్లాడటం నుండి’ అనే భావాన్ని సహజమైన తెలుగు నిషేధార్థక నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: מִרְמָה
  choice: మోసం
  rationale: ఈ పదం వంచన, కపటం, మోసపూరిత మాటను సూచిస్తుంది. ‘మోసం మాట్లాడటం’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, మాటల సందర్భాన్ని నిలుపుతుంది.
