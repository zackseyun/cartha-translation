review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the two imperative clauses, the concrete parallelism of ‘tongue’ and ‘lips,’ and the ethical sense of רַע. However, ‘మోసం మాట్లాడకుండా’ is not idiomatic Telugu for deceptive speech and weakens the specific sense of מִרְמָה.
  naturalness: ‘నీ నాలుకను చెడు పలకకుండా కాపాడుకో’ is understandable and natural enough in modern Telugu. Replacing ‘మోసం మాట్లాడకుండా’ with ‘వంచన పలకకుండా’ produces a more fluent, literary-neutral parallel line suitable for a psalm.
  terminology: ‘వంచన’ accurately conveys מִרְמָה (deceit, guile, deceptive speech). ‘కాపాడుకో’ is an acceptable modern rendering of נְצֹר in this speech-restraint context.
  issues:
  - severity: medium
    issue: ‘మోసం మాట్లాడకుండా’ is an unnatural collocation.
    rationale: Modern Telugu normally uses ‘వంచన పలకడం,’ ‘కపటంగా మాట్లాడడం,’ or comparable wording for deceptive speech. ‘వంచన పలకకుండా’ also preserves the concise poetic parallelism of the Hebrew.
