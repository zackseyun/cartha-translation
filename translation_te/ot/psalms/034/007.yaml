  text: The angel of Yahweh encamps around those who fear him[a], and rescues them.
translation:
  language: te
  text: 'యెహోవా దేవదూత యెహోవాకు భయపడేవారి చుట్టూ శిబిరం వేసి,

    వారిని రక్షిస్తాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెహోవా దూత.’ హీబ్రూ מַלְאָךְ అనే పదానికి ‘దూత’ లేదా ‘దేవదూత’ అనే అర్థాలు ఉండవచ్చు; ఇక్కడ ‘దేవదూత’ అనే భావం ఎక్కువ సంభావ్యమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹנֶה
  choice: మకాం వేసి
  rationale: חנה అనే క్రియారూపం శిబిరం వేయడం లేదా మకాం వేయడం అనే భావాన్ని ఇస్తుంది. ఈ ఎంపిక రక్షణ కోసం చుట్టూ నిలిచే సైనిక దృశ్యాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מַלְאַךְ יְהוָה
  choice: యెహోవా దూత
  rationale: מַלְאַךְకు ‘దూత’ లేదా ‘దేవదూత’ అనే అర్థాలు ఉండవచ్చు. ఈ పదబంధంలో అతీంద్రియ దూత భావం సహజమైనదైనా, ‘దూత’ అనే తెలుగు పదం మూలంలోని పదార్థ విస్తృతిని కాపాడుతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని ఒక బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా అందించింది.
- source_word: סָבִיב
  choice: చుట్టూ
  rationale: చుట్టుముట్టిన స్థానాన్ని, దానిలోని రక్షణాత్మక దృశ్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לִירֵאָיו
  choice: తనకు భయపడేవారి
  rationale: దేవునిపట్ల భయభక్తులతో ఉండేవారిని సూచిస్తుంది. ‘భయపడు’ అనే బైబిలు ప్రయోగం భయం మరియు భక్తిపూర్వక గౌరవం రెండింటి మధ్య ఉన్న భావ విస్తృతిని నిలుపుతుంది.
- source_word: וַיְחַלְּצֵם
  choice: వారిని రక్షిస్తాడు
  rationale: חלץ ఈ సందర్భంలో ప్రమాదం నుండి విడిపించడం లేదా కాపాడడం అనే అర్థం ఇస్తుంది. ‘రక్షిస్తాడు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, ముందున్న రక్షణాత్మక దృశ్యానికి సరిపోతుంది.
theological_decisions:
- issue: מַלְאַךְ יְהוָהను సాధారణ ‘దూత’గా, ‘దేవదూత’గా, లేక ఒక ప్రత్యేక దైవ ప్రత్యక్షతగా అర్థం చేయాలా?
  choice: ‘యెహోవా దూత’ అని అనువదించి, అతని మరింత నిర్దిష్టమైన గుర్తింపును నిర్ణయించకుండా ఉంచడం.
  alternative: ‘యెహోవా దేవదూత’; లేదా దైవ ప్రత్యక్షత/క్రీస్తు ప్రత్యక్షత అని స్పష్టీకరించడం.
  rationale: హీబ్రూ పదం దూత లేదా దేవదూతను సూచించగలదు; సందర్భం అతీంద్రియ భావానికి అనుకూలమైనా, ఈ వచనం ఆ దూత యొక్క అంతిమ గుర్తింపును స్పష్టంగా నిర్ణయించదు. అందువల్ల theological tensionను అలాగే ఉంచాం.
- issue: దైవనామం יְהוָהను బిరుదుగా అనువదించాలా లేదా పేరుగా లిప్యంతరీకరించాలా?
  choice: ‘యెహోవా’ అనే వ్యక్తిగత నామరూపం.
  alternative: ‘ప్రభువు’.
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని వాడాం. కవితాత్మక సమాంతరత కోసం రెండు పాదాలుగా అమర్చాం. ‘మకాం వేసి’ అనే ప్రయోగం నిరంతర రక్షణాత్మక సమీపాన్ని చూపుతుంది; తెలుగు వాక్యసహజత్వం కోసం సమాపక క్రియను రెండో పాదంలో ఉంచాం.
