source:
  edition: WLC
  text: רַ֭בּוֹת רָע֣וֹת צַדִּ֑יק וּ֝/מִ/כֻּלָּ֗/ם יַצִּילֶ֥/נּוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/019.yaml
  text: Many are the afflictions of the righteous man[b][a], but Yahweh delivers him out of them all.
translation:
  language: te
  text: నీతిమంతునికి కలిగే కష్టాలు అనేకం[a][b]; అయితే వాటన్నిటిలోనుండి యాహ్వే అతన్ని విడిపిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీతిమంతుని కీడులు/ఆపదలు అనేకం.” హీబ్రూ పదం కీడులు, కష్టాలు లేదా విపత్తులను సూచించగలదు; ఇక్కడ నీతిమంతునికి ఎదురయ్యే బాధలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “నీతిమంతుడు” పుంలింగ ఏకవచనంలో ఉంది; అది ప్రతినిధిగా నీతిగల ఏ వ్యక్తినైనా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוֹת
  choice: అనేకం
  rationale: వాక్యారంభంలోని బహుత్వ ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: רָעוֹת
  choice: కష్టాలు
  rationale: ఈ సందర్భంలో నీతిమంతునికి సంభవించి, వాటినుండి అతడు రక్షించబడే ఆపదలు లేదా బాధలను సూచిస్తుంది; నైతిక దుష్టత్వాన్ని సూచించదు.
- source_word: צַדִּיק
  choice: నీతిమంతుడు
  rationale: హీబ్రూలోని ఏకవచన విశేషణ నామవాచకంగా వాడబడింది. తెలుగు రూపం ఏకవచనాన్ని కాపాడుతూ, ప్రతినిధిగానూ అర్థమవుతుంది.
- source_word: וּמִכֻּלָּם
  choice: అయితే వాటన్నిటిలోనుండి
  rationale: וְ యొక్క సందర్భానుగుణ వ్యతిరేక భావాన్ని ‘అయితే’ తెలియజేస్తుంది; כֻּלָּם లోని సమగ్రతను ‘వాటన్నిటి’ కాపాడుతుంది.
- source_word: יַצִּילֶנּוּ
  choice: అతన్ని విడిపిస్తాడు
  rationale: נצל హిఫీల్ రూపంలోని రక్షించడం లేదా విడిపించడం అనే భావాన్ని స్పష్టమైన సాధారణ తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యనుకరణగా అందిస్తుంది.
theological_decisions:
- issue: צַדִּיק లోని ప్రతినిధి పుంలింగ ఏకవచనం
  choice: నీతిమంతుడు
  alternative: నీతిమంతులు / నీతిగల వ్యక్తి
  rationale: మూలంలోని ఏకవచన రూపాన్ని నిలుపుతూ, అది సాధారణంగా ప్రతి నీతిమంతునికీ వర్తించగల ప్రతినిధి ప్రయోగమని పాదటిప్పణిలో స్పష్టం చేశాం.
- issue: రָעוֹת యొక్క భావపరిధి
  choice: కష్టాలు
  alternative: కీడులు / ఆపదలు
  rationale: మూలపదంలోని విస్తృత భావాన్ని పూర్తిగా తొలగించకుండా, ఈ సందర్భంలో నీతిమంతునికి ఎదురయ్యే బాధలు, ఆపదలు అనే అర్థాన్ని సహజంగా తెలియజేస్తుంది.
- issue: יְהוָה యొక్క అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం ఉన్నందున దానిని బిరుదుగా మార్చకుండా ధ్వన్యనుకరణతో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని ‘అనేకం—అన్నిటిలోనుండి’ అనే భావవ్యతిరేకతను స్పష్టంగా నిలిపాం; దైవనామాన్ని ‘యాహ్వే’గా ఉంచాం.
