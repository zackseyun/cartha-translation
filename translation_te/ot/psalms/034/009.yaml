  text: Fear Yahweh[a], his holy ones[b], for those who fear him lack nothing.
translation:
  language: te
  text: యాహ్వేకు భయపడండి, ఆయన పరిశుద్ధులారా[a]; ఎందుకంటే ఆయనకు భయపడేవారికి ఏ కొదువా ఉండదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనకు ప్రత్యేకింపబడినవారలారా.” హీబ్రూలో అక్షరార్థంగా “ఆయన పరిశుద్ధులారా.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారికి అవసరమైనదేదీ లోటు ఉండదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְר֣אוּ
  choice: భయపడండి
  rationale: ఇది ירא ధాతువు నుంచి వచ్చిన ద్వితీయ పురుష బహువచన ఆజ్ఞార్థకం. ‘భయపడండి’ మూలంలోని భయం, భక్తి, గౌరవం కలిసిన భావాన్ని నేరుగా నిలుపుతుంది; ‘భక్తితో గౌరవించండి’ అనడం భయ భావాన్ని తగ్గిస్తుంది.
- source_word: אֶת יְהוָה
  choice: యెహోవాకు
  rationale: יְהוָה అనే దైవనామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం. ‘భయపడు’ క్రియతో సహజమైన తెలుగు ప్రయోగం కోసం ‘-కు’ విభక్తి వాడాం.
- source_word: קְדֹשָׁיו
  choice: ఆయన పరిశుద్ధులారా
  rationale: పుంలింగ బహువచన విశేషణం నామవాచకంగా, తృతీయ పురుష ఏకవచన సంబంధ ప్రత్యయంతో ఉంది. సంబోధనను స్పష్టంగా చూపిస్తూ, దేవునికి ప్రత్యేకింపబడిన ప్రజలు అనే భావాన్ని నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఆజ్ఞకు కారణాన్ని పరిచయం చేస్తుంది. ఆధునిక తెలుగులో వివరణాత్మక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֵין מַחְסוֹר
  choice: ఏ కొదువా ఉండదు
  rationale: కొరత లేకపోవడాన్ని తెలిపే హీబ్రూ నుడికారాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לִירֵאָיו
  choice: ఆయనకు భయపడేవారికి
  rationale: לְ పూర్వప్రత్యయం, ירא బహువచన కృదంతం, తృతీయ పురుష ఏకవచన సంబంధ ప్రత్యయాన్ని సహజ తెలుగు నామీకృత క్రియారూపంగా ఇచ్చాం. మొదటి ఆజ్ఞలోని ‘భయపడు’ పదబంధాన్ని మళ్లీ ఉంచి మూలంలోని పదసంబంధాన్ని కాపాడాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠం సాధారణ బిరుదు కాకుండా చతురక్షర దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దైవనామాన్ని ‘ప్రభువు’గా మార్చకుండా, తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో ఉంచాం.
- issue: ‘భయపడడం’లో భయం–భక్తి భావసమ్మేళనం
  choice: భయపడండి / భయపడేవారు
  alternative: భక్తితో గౌరవించండి / గౌరవించేవారు
  rationale: మూలంలోని ירא పదాన్ని రెండు చోట్ల ఒకే తెలుగు మూలపదంతో ప్రతిబింబించాం. ఇది భక్తిపూర్వక గౌరవాన్ని కలిగి ఉండగలిగినా, కేవలం ‘గౌరవం’గా అనువదించి మూలంలోని నిజమైన భయ భావాన్ని తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గౌరవప్రదమైన సంబోధన. మూలంలోని ఆజ్ఞ, కారణసంబంధం, అలాగే ירא పదపు పునరుక్తి నిలుపబడ్డాయి. ‘పరిశుద్ధులు’ అనే సంఘసంబంధ సాంకేతిక అర్థానికి మాత్రమే పరిమితం కాకుండా మూలంలోని ‘దేవునికి ప్రత్యేకింపబడినవారు’ అనే విస్తృత భావాన్ని పాదటిప్పణి సూచిస్తుంది.
