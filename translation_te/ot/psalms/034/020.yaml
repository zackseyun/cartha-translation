source:
  edition: WLC
  text: שֹׁמֵ֥ר כָּל עַצְמוֹתָ֑י/ו אַחַ֥ת מֵ֝/הֵ֗נָּה לֹ֣א נִשְׁבָּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/020.yaml
  text: He keeps all his bones[b][a]; not one of them is broken.
translation:
  language: te
  text: ఆయన అతని ఎముకలన్నిటినీ కాపాడుతాడు[a]; వాటిలో ఒక్కటి కూడా విరగదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కాపలా కాస్తాడు” లేదా “సంరక్షిస్తాడు.”
    reason: lexical_alternative
  - marker: b
    text: యేసు సిలువవేయబడిన సందర్భంలో యోహాను 19:36 ఈ వాక్యాన్ని ఉదహరిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: שֹׁמֵר
  choice: కాపాడుతాడు
  rationale: שׁמר అనే ధాతువు ఇక్కడ కాపలా కాయడం, భద్రంగా ఉంచడం, సంరక్షించడం అనే భావాన్ని ఇస్తుంది. సందర్భంలోని రక్షణ భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘కాపాడుతాడు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: כָּל עַצְמוֹתָיו
  choice: అతని ఎముకలన్నిటినీ
  rationale: כָּל మొత్తం సమూహాన్ని సూచిస్తుంది; עַצְמוֹתָיו అంటే మూడవ పురుష ఏకవచన సంబంధప్రత్యయంతో ‘అతని ఎముకలు.’ తెలుగు పదక్రమంలో ‘ఎముకలన్నిటినీ’ సహజంగా ఉంటుంది.
- source_word: אַחַת מֵהֵנָּה
  choice: వాటిలో ఒక్కటి కూడా
  rationale: స్త్రీలింగ ‘ఒక్కటి’ అనే పదం ముందు చెప్పిన ఎముకలలో ఒకదానిని సూచిస్తుంది; מן భాగార్థకంగా ‘వాటిలో’ అని అనువదించబడింది. నిషేధంతో కలిసి ‘ఒక్కటి కూడా’ సహజమైన తెలుగు ప్రయోగం.
- source_word: לֹא נִשְׁבָּרָה
  choice: విరగదు
  rationale: שׁבר నిఫాల్ రూపం ‘విరగడం/విరగబడడం’ను సూచిస్తుంది. కీర్తనలోని సాధారణ రక్షణ ప్రకటనకు తెలుగులో ‘విరగదు’ సహజంగా సరిపోతుంది; ఇది కర్తరి రూపంలో ఉన్నా అకర్మక భావాన్ని సరిగ్గా తెలియజేస్తుంది.
theological_decisions:
- issue: ఏకవచన సంబంధప్రత్యయాల సూచిత వ్యక్తి
  choice: కీర్తన తక్షణ సందర్భంలోని నీతిమంతుని సూచిస్తూ ‘అతని’ అని అనువదించబడింది; కాపాడే కర్తను ‘ఆయన’గా ఉంచాం.
  alternative: ‘నీతిమంతుని ఎముకలు’ అని మరింత స్పష్టంగా చెప్పడం, లేదా యోహాను 19:36 వెలుగులో ప్రధాన పాఠంలోనే క్రీస్తును ప్రత్యక్షంగా సూచించడం.
  rationale: హీబ్రూ పాఠంలో సంబంధప్రత్యయం పురుష ఏకవచనంలో ఉంది; తక్షణ సందర్భం యెహోవా విడిపించే నీతిమంతుని గురించి మాట్లాడుతుంది. ప్రధాన పాఠం ఆ ప్రత్యక్ష అర్థాన్ని నిలుపుతూ, తరువాతి క్రీస్తుసంబంధ అన్వయాన్ని పాదసూచికలో తెలియజేస్తుంది.
- issue: נִשְׁבָּרָה క్రియారూపపు కాల/దృక్కోణ భావం
  choice: కావ్యంలోని సాధారణ రక్షణ ప్రకటనగా ‘విరగదు’ అని అనువదించబడింది.
  alternative: రూపాన్ని గత లేదా ఫలితస్థితి భావంతో ‘విరగలేదు’ అని అనువదించడం.
  rationale: హీబ్రూ పరిపూర్ణ క్రియారూపం పూర్తయిన స్థితిని సూచించగలిగినా, ఈ సామెతసదృశ కవితా సందర్భంలో సాధారణ సత్యం లేదా నిశ్చిత ఫలితాన్ని తెలుగులో ‘విరగదు’ సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కవితా వాక్యరచన వాడబడింది. ‘ఆయన/అతని’ అనే భేదం కాపాడే దేవునినీ, కాపాడబడే నీతిమంతునినీ వేరుగా గుర్తించడానికి సహాయపడుతుంది.
