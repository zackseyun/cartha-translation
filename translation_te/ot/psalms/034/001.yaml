  text: אֲבָרֲכָ֣ה אֶת יְהוָ֣ה בְּ/כָל עֵ֑ת תָּ֝מִ֗יד תְּֽהִלָּת֥/וֹ בְּ/פִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/001.yaml
  text: I will bless Yahweh at all times[a]; his praise will continually be in my mouth.
translation:
  language: te
  text: 'నేను అన్ని వేళలా యాహ్వేను[a] కొనియాడుతాను;

    ఆయన స్తుతి నిరంతరం నా నోట ఉంటుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “YHWH”; దీనిని “యాహ్వే” అని లిప్యంతరీకరిస్తారు.'
    reason: దైవనామపు హీబ్రూ రూపాన్ని, పాఠంలో ఉపయోగించిన లిప్యంతరీకరణను స్పష్టంగా తెలియజేయడం.
lexical_decisions:
- source_word: אֲבָרֲכָה
  choice: కొనియాడుతాను
  rationale: ברך క్రియ యొక్క ప్రథమ పురుష ఏకవచన సంకల్పార్థక రూపం ఇది. దేవుని ఉద్దేశించి వాడిన సందర్భంలో ‘కొనియాడుతాను’ అనేది ఆశీర్వదించడం అనే మూలభావాన్ని సహజమైన తెలుగు ఆరాధనా భాషలో వ్యక్తం చేస్తూ, దృఢ సంకల్పాన్ని కూడా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు అనుగుణంగా వ్యక్తినామంగా లిప్యంతరీకరించాం.
- source_word: בְּכָל עֵת
  choice: అన్ని వేళలా
  rationale: కాలమంతటినీ ఆవరించే నిరంతరత్వాన్ని తెలిపే హీబ్రూ ప్రయోగానికి సహజమైన, సమీపమైన తెలుగు రూపం.
- source_word: תָּמִיד
  choice: నిరంతరం
  rationale: స్తుతి ఎడతెగకుండా కొనసాగుతుందనే భావాన్ని తెలియజేస్తుంది; మొదటి పాదంలోని కాలవ్యాప్తిని సహజంగా బలపరుస్తుంది.
- source_word: תְּהִלָּתוֹ
  choice: ఆయన స్తుతి
  rationale: మూడవ పురుష పుంలింగ ఏకవచన ప్రత్యయంతో ఉన్న תהלהకు నేరమైన అర్థం. ఇది ఆయనను గూర్చిన లేదా ఆయనకు అర్పించే స్తుతి అనే సహజంగా నిలిచే భావాన్ని అనవసరంగా సంకుచితం చేయదు.
- source_word: בְּפִי
  choice: నా నోట
  rationale: మాటగా వెలువడే స్తుతిని సూచించే హీబ్రూ శరీరాంగ చిత్రణను తెలుగులో నేరుగా, సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాకుండా చతురక్షర దైవనామమే ఉంది. అందువల్ల దానిని వ్యక్తినామంగా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలరూపాన్ని స్పష్టంగా నిలుపుతుంది; ఇతర ప్రసిద్ధ రూపాలను పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కవితా శైలి. రెండు సమాంతర పాదాలను నిలిపి, ‘కొనియాడుతాను’ ద్వారా సంకల్పభావాన్ని మరియు ‘నా నోట’ ద్వారా మూలంలోని స్పష్టమైన రూపకాన్ని కాపాడాం.
