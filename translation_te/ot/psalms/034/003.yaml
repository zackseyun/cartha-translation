  edition: WLC
  text: גַּדְּל֣וּ לַ/יהוָ֣ה אִתִּ֑/י וּ/נְרוֹמְמָ֖ה שְׁמ֣/וֹ יַחְדָּֽו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/003.yaml
  text: Magnify Yahweh with me[a], and let us exalt his name together.
translation:
  language: te
  text: నాతో కలిసి యాహ్వేను మహిమపరచండి[a]; ఆయన నామాన్ని మనము కలిసి ఘనపరుద్దాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: ‘YHWH’ (יהוה); ఇక్కడ ‘యాహ్వే’గా లిప్యంతరీకరించబడింది.'
    reason: దైవనామపు హీబ్రూ మూలరూపం మరియు ఈ అనువాదంలో వాడిన లిప్యంతరీకరణను తెలియజేయడం.
lexical_decisions:
- source_word: גַּדְּלוּ
  choice: మహిమపరచండి
  rationale: גדל ధాతువు పియేల్ ఆజ్ఞార్థక బహువచన రూపంలో ఉండి, స్తుతిలో యెహోవా గొప్పతనాన్ని ప్రకటించమనే పిలుపును ఇస్తుంది. ‘మహిమపరచండి’ అనేది భౌతికంగా పెద్దదిగా చేయడం అనే అపార్థాన్ని నివారిస్తూ ఆ స్తుతి భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవాను
  rationale: హీబ్రూ పాఠంలో దేవుని ప్రత్యేక నామమైన יהוה నేరుగా ఉంది. తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఉపయోగించి ఆ వ్యక్తిగత నామాన్ని నిలుపుకున్నాం.
- source_word: אִתִּי
  choice: నాతో కలిసి
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న ఈ పదం స్తుతిలో కీర్తనకర్తతో పాటు పాల్గొనమనే అర్థాన్ని ఇస్తుంది; ‘నాతో కలిసి’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: וּנְרוֹמְמָה
  choice: ఘనపరుద్దాం
  rationale: רום ధాతువు మొదటి పురుష బహువచన కోహోర్టేటివ్ రూపం సంయుక్త ఆహ్వానాన్ని వ్యక్తం చేస్తుంది. ‘ఘనపరుద్దాం’ ఆ సంకల్పాత్మక పిలుపును సహజంగా అందిస్తుంది.
- source_word: שְׁמוֹ
  choice: ఆయన నామాన్ని
  rationale: ‘నామం’ అనే మూల రూపాన్ని నిలుపుతూ, అది దేవుని వెల్లడైన వ్యక్తిత్వం మరియు కీర్తిని సూచించే స్తుతి భాషగా ఉండనిచ్చాం.
- source_word: יַחְדָּו
  choice: మనమందరం కలిసి
  rationale: ఈ క్రియావిశేషణం ఐక్యంగా లేదా సమష్టిగా చేసే కార్యాన్ని సూచిస్తుంది. కోహోర్టేటివ్‌లో అంతర్భూతమైన బహువచనాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేయడానికి ‘మనమందరం కలిసి’ అని అనువదించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని చతురక్షర దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగానే ఉంచాం. ‘యెహోవా’ అనేది తెలుగు బైబిల్ పాఠకులకు విస్తృతంగా పరిచితమైన రూపం; ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరగా భావించబడే ప్రత్యామ్నాయ లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సమూహ ఆరాధనకు తగిన గౌరవప్రదమైన ఆహ్వాన శైలిని ఉపయోగించాం. మొదటి పాదంలోని బహువచన ఆజ్ఞను ‘మహిమపరచండి’తో, రెండో పాదంలోని కోహోర్టేటివ్‌ను ‘ఘనపరుద్దాం’తో వేరు చేసి చూపించాం.
