  yaml_path: translation/ot/psalms/034/000.yaml
  text: Of David[a], when he changed his behavior before Abimelech, and he drove him away, and he went away.
translation:
  language: te
  text: దావీదుకు చెందిన కీర్తన.[a] అతడు అబీమెలెకు సమక్షంలో తన ప్రవర్తనను మార్చుకున్నప్పుడు, అబీమెలెకు అతణ్ణి తరిమివేశాడు; అతడు వెళ్లిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 సమూయేలు 21:10–15లో ఈ రాజు ‘ఆకీషు’గా గుర్తించబడ్డాడు. ఇక్కడి ‘అబీమెలెకు’ అతని మరో పేరు గానీ, రాజ బిరుదు గానీ అయి ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: దావీదుకు చెందిన కీర్తన
  rationale: కీర్తన శీర్షికల్లో వ్యక్తి పేరుకు ముందు వచ్చే לְ రచన, సంబంధం లేదా అంకితం వంటి భావాలకు వీలు కల్పిస్తుంది. ‘దావీదు రచించినది’ అని కుదించకుండా సంబంధార్థక అస్పష్టతను కాపాడటానికి ఈ రూపం ఎంచుకున్నాం; తెలుగులో శీర్షికగా సహజంగా ఉండేందుకు ‘కీర్తన’ను పూరించాం.
- source_word: בְּשַׁנּוֹתוֹ
  choice: అతడు ... మార్చుకున్నప్పుడు
  rationale: בְ + క్రియార్థక నామరూపం ఇక్కడ కాలార్థాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘మార్చుకున్నప్పుడు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: טַעְמוֹ
  choice: తన ప్రవర్తనను
  rationale: ఈ పదానికి రుచి, వివేచన, బుద్ధి అనే మూలార్థ పరిధి ఉన్నా, ఈ సందర్భంలోని ప్రయోగం బయటికి కనిపించే తీరు లేదా ప్రవర్తనను సూచిస్తుంది. ‘మతిస్థిమితం’ అని అనువదిస్తే అవసరానికి మించిన వ్యాఖ్యానం అవుతుంది.
- source_word: לִפְנֵי אֲבִימֶלֶךְ
  choice: అబీమెలెకు సమక్షంలో
  rationale: ‘ముందు/సన్నిధిలో’ అనే భావాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיְגָרֲשֵׁהוּ
  choice: అబీమెలెకు అతణ్ణి తరిమివేశాడు
  rationale: క్రియకు ‘తరిమివేయు/బయటకు పంపు’ అనే అర్థం ఉంది. హీబ్రూలోని సర్వనామ సూచనను సందర్భానుసారం స్పష్టంచేయడానికి కర్తగా అబీమెలెకును మళ్లీ పేర్కొన్నాం; וַ సాధారణ కథన క్రమాన్ని సూచిస్తున్నందున ఉద్దేశార్థక ‘అందువల్ల’ లేదా ‘తద్వారా’ను చేర్చలేదు.
- source_word: וַיֵּלַךְ
  choice: అతడు వెళ్లిపోయాడు
  rationale: సాధారణ ‘వెళ్లాడు’ అనే అర్థాన్ని, తరిమివేత తరువాతి సందర్భానికి సరిపోయే సహజ తెలుగు రూపంలో ఇచ్చాం; ఇక్కడ కర్త దావీదు.
- source_word: אֲבִימֶלֶךְ
  choice: అబీమెలెకు
  rationale: హీబ్రూ మూలపాఠంలోని పేరునే ప్రధాన పాఠ్యంలో లిప్యంతరీకరించాం. 1 సమూయేలు 21లోని ఆకీషుతో సంబంధాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: అబీమెలెకు చారిత్రక గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో హీబ్రూ మూలపాఠంలో ఉన్న ‘అబీమెలెకు’ పేరునే ఉంచడం
  alternative: గాతు రాజైన ఆకీషుతో అబీమెలెకును గుర్తించి, ప్రధాన పాఠ్యంలో ‘ఆకీషు’ అని వ్రాయడం
  rationale: మూలభాషకు ప్రాధాన్యమిస్తూ పేరును సమన్వయపరచి మార్చలేదు. 1 సమూయేలు 21:10–15తో ఉన్న చారిత్రక సంబంధాన్ని పాదసూచికలో తెలియజేయడం ద్వారా పాఠ్య భేదాన్ని, ఉద్రిక్తతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తన శీర్షికకు తగిన గౌరవప్రదమైన కానీ సులభంగా అర్థమయ్యే శైలిని అనుసరించాం. హీబ్రూ వరుస వాక్యాలను తెలుగులో స్పష్టత కోసం అర్ధవిరామంతో అనుసంధానించాం; సర్వనామాల సందిగ్ధతను సందర్భానుసారం పరిమితంగా స్పష్టంచేశాం.
