  text: My heart writhes within me[a], and the terrors of death have fallen upon me.
translation:
  language: te
  text: నా హృదయం నాలో వేదనతో మెలికలు తిరుగుతోంది[a]; మరణ భయాలు నాపై పడ్డాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా హృదయం నాలో వణుకుతోంది.’ హీబ్రూ క్రియ వేదనతో మెలికలు తిరగడం, వణకడం, లేదా తీవ్ర వ్యాకులత చెందడం అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי
  choice: నా హృదయం
  rationale: לֵב ఇక్కడ ఆలోచన, భావోద్వేగాల అంతరంగ కేంద్రాన్ని సూచిస్తుంది; ‘హృదయం’ సహజమైనదీ, శరీరానుభూతితో కూడిన కవితా బలాన్ని నిలుపుకునేదీ.
- source_word: יָחִיל
  choice: వేదనతో కొట్టుకుంటోంది
  rationale: חול/חיל రూపమైన ఈ క్రియ వేదనతో మెలికలు తిరగడం, వణకడం, తీవ్ర వ్యాకులత చెందడం వంటి భావాలను కలిగి ఉంటుంది. ‘వేదనతో కొట్టుకుంటోంది’ హృదయానికి సంబంధించి తెలుగులో సహజంగా ఉండి, తీవ్రమైన అంతరంగ కలవరాన్ని తెలియజేస్తుంది.
- source_word: בְּקִרְבִּי
  choice: నాలోనే
  rationale: קֶרֶב ప్రత్యయంతో వ్యక్తి అంతర్భాగాన్ని సూచిస్తుంది; ‘నాలోనే’ సంక్షిప్తంగా, సహజంగా ఆ అంతరంగ భావాన్ని అందిస్తుంది.
- source_word: אֵימוֹת
  choice: భయాలు
  rationale: אֵימָה బహువచనం తీవ్రమైన భయానక అనుభూతులను సూచిస్తుంది. ‘భయాలు’ బహువచనాన్ని నిలుపుతూ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: מָוֶת
  choice: మరణ
  rationale: אֵימוֹת మָוֶת అనే సంబంధాన్ని ‘మరణ భయాలు’గా అనువదించడం సహజం; భయం మరణం వల్లనా, మరణం గురించినదా అనే మూలంలోని విస్తృత సంబంధాన్ని అతిగా నిర్ధారించదు.
- source_word: נָפְלוּ
  choice: విరుచుకుపడ్డాయి
  rationale: నేరుగా ‘పడ్డాయి’ అనవచ్చు; సందర్భంలో భయాలు అకస్మాత్తుగా వచ్చి కమ్ముకున్న తీవ్రతను ‘విరుచుకుపడ్డాయి’ సహజ తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: עָלָי
  choice: నాపై
  rationale: עַל మొదటి పురుష ప్రత్యయానికి నేరమైన, సహజమైన తెలుగు సమానం ‘నాపై’.
