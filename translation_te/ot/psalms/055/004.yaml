  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైన కీర్తన కవితా ధోరణిని కాపాడుతూ సామాన్య పాఠకులకు సహజంగా రూపొందించబడింది. మూలంలోని క్రియకు ఉన్న భావవిస్తృతిని ప్రధాన పాఠంలో సందర్భోచితంగా వ్యక్తం చేసి, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
