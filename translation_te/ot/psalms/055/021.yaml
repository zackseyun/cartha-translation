id: PSA.55.21
reference: Psalms 55:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: חָלְק֤וּ מַחְמָאֹ֣ת פִּי/ו֮ וּֽ/קֲרָב לִ֫בּ֥/וֹ רַכּ֖וּ דְבָרָ֥י/ו מִ/שֶּׁ֗מֶן וְ/הֵ֣מָּה פְתִחֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/021.yaml
  text: The words of his mouth are smooth[a], but his heart is war; his words are softer than oil[b], yet they are drawn swords.
translation:
  language: te
  text: 'అతని నోటి మాటలు వెన్నలా నునుపుగా ఉన్నాయి[a], కానీ అతని హృదయంలో యుద్ధం ఉంది;

    అతని మాటలు నూనె కంటే మెత్తనివి, అయినా అవి వెలికితీసిన కత్తులు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని నోటినుండి ముఖస్తుతి మాటలు వస్తాయి.’ హీబ్రూ ప్రయోగం అరుదైనది; అది మరింత నిర్దిష్టంగా వెన్నవంటి నునుపైన మాటలను లేదా ముఖస్తుతిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఒరనుండి బయటకు తీసిన కత్తులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלְקוּ מַחְמָאֹת פִּיו
  choice: అతని నోటి మాటలు వెన్నలా నునుపుగా ఉన్నాయి
  rationale: అరుదైన హీబ్రూ ప్రయోగం వెన్నవంటి నునుపుదనాన్ని లేదా ముఖస్తుతితో కూడిన మృదువైన మాటలను సూచిస్తుంది. ‘వెన్నలా నునుపుగా’ అనే రూపం మూలంలోని దృశ్యాన్ని ఉంచుతూ ఆధునిక తెలుగులో అర్థమయ్యేలా చేస్తుంది.
- source_word: וּקֲרָב לִבּוֹ
  choice: కానీ అతని హృదయంలో యుద్ధం ఉంది
  rationale: קְרָב అనేది ‘యుద్ధం/పోరాటం’ అనే నామవాచకం. బయటికి నునుపైన మాటలకు, లోపల ఉన్న శత్రుత్వానికి మధ్య వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: רַכּוּ דְבָרָיו מִשֶּׁמֶן
  choice: అతని మాటలు నూనె కంటే మెత్తనివి
  rationale: తులనాత్మక నిర్మాణాన్ని, నూనె అనే ఇంద్రియాత్మక రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: וְהֵמָּה פְתִחוֹת
  choice: అయినా అవి దూసిన కత్తులు
  rationale: פְתִחוֹת ఇక్కడ బయటికి తీసిన లేదా ఒరనుండి తీసిన ఆయుధాలను సూచించే అరుదైన ప్రయోగంగా అర్థం చేసుకోవచ్చు. ‘దూసిన కత్తులు’ మాటల వెనుకనున్న సిద్ధమైన హింసను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా స్వరాన్ని ఉంచుతూ, సాధారణ పాఠకులకు అర్థమయ్యే పదాలను వాడాం. రెండు పాదాల వ్యత్యాస నిర్మాణాన్ని నిలిపాం.
