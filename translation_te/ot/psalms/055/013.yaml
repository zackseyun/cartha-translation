id: PSA.55.13
reference: Psalms 55:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתָּ֣ה אֱנ֣וֹשׁ כְּ/עֶרְכִּ֑/י אַ֝לּוּפִ֗/י וּ/מְיֻדָּֽעִ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/013.yaml
  text: But you—a man as my equal[a], my companion, and my familiar friend.
translation:
  language: te
  text: కానీ నువ్వు—నాతో సమానుడవైన మనిషివి, నా సన్నిహిత సహచరుడివి[a], నాకు ఆత్మీయ మిత్రుడివి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా మార్గదర్శివి’; హీబ్రూ పదం సన్నిహిత సహచరుణ్ణి లేదా నాయకత్వం వహించే వ్యక్తిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: కానీ నువ్వు
  rationale: ముందటి సందర్భంలోని శత్రువుతో ఈ వ్యక్తిని వ్యత్యాసపరుస్తూ నేరుగా సంబోధిస్తున్నందున, וְ యొక్క సందర్భానుసారమైన వ్యతిరేక భావాన్ని ‘కానీ’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֱנוֹשׁ
  choice: మనిషివి
  rationale: ఇక్కడ పదం మానవుని బలహీనతకన్నా, తనతో సన్నిహితంగా ఉన్న తోటి మనిషి చేసిన ద్రోహాన్ని ప్రధానంగా సూచిస్తుంది.
- source_word: כְּעֶרְכִּי
  choice: నాతో సమానుడవైన
  rationale: עֵרֶךְ నుండి వచ్చిన ఈ రూపం సమాన స్థాయి లేదా సరితూగే స్థానాన్ని సూచిస్తుంది; తెలుగు వాక్యంలో ‘నాతో సమానుడవైన’ ఆ సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אַלּוּפִי
  choice: నా సన్నిహిత సహచరుడివి
  rationale: ఈ పదం సన్నిహిత సహచరుణ్ణి లేదా నాయకుడు/మార్గదర్శిని సూచించగలదు. సమాంతరంగా ఉన్న ‘ఆత్మీయ మిత్రుడు’ అనే భావాన్ని బట్టి ఇక్కడ సహచర్య భావానికి ప్రాధాన్యం ఇచ్చి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: וּמְיֻדָּעִי
  choice: నాకు ఆత్మీయ మిత్రుడివి
  rationale: ידע మూలం నుండి వచ్చిన ఈ రూపం కేవలం పరిచయస్థుణ్ణి కాక, బాగా తెలిసిన సన్నిహిత వ్యక్తిని సూచిస్తుంది; ‘ఆత్మీయ మిత్రుడు’ విలాపంలోని భావోద్వేగ తీవ్రతను సహజ తెలుగులో అందిస్తుంది.
