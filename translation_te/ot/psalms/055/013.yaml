  naturalness: ‘నాతో సమానుడవైన మనిషివి, నా సన్నిహిత సహచరుడివి, నాకు ఆత్మీయ మిత్రుడివి’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, వ్యక్తిగత విలాపానికి తగిన సన్నిహిత సంబోధనగా ఉంది. జోడించిన క్రియారూపాలు హీబ్రూ నామవాచక నిర్మాణాన్ని తెలుగులో సులభగ్రాహ్యంగా చేస్తాయి.
