  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైనప్పటికీ వ్యక్తిగత విలాపానికి తగిన సన్నిహిత ఏకవచన సంబోధనను ఉపయోగించాం. హీబ్రూ నామవాచక వాక్య నిర్మాణాన్ని తెలుగులో సహజంగా చేయడానికి ‘వైన/వి’ రూపాలను చేర్చాం.
