source:
  edition: WLC
  text: וְ/אַתָּ֤ה אֱלֹהִ֨ים תּוֹרִדֵ֬/ם לִ/בְאֵ֬ר שַׁ֗חַת אַנְשֵׁ֤י דָמִ֣ים וּ֭/מִרְמָה לֹא יֶחֱצ֣וּ יְמֵי/הֶ֑ם וַ֝/אֲנִ֗י אֶבְטַח בָּֽ/ךְ׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/023.yaml
  text: But you[a], God, will bring them down to the pit of destruction; men of bloodshed and deceit will not live out half their days[b], but I will trust in you.
translation:
  language: te
  text: కానీ దేవా, నీవు వారిని వినాశనపు గోతిలోకి దింపుతావు[a]. రక్తపాతానికీ మోసానికీ పాల్పడేవారు తమ దినాలలో సగం జీవించకముందే మరణిస్తారు[b]. కానీ నేను నిన్ను నమ్ముతాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘క్షయపు గోతిలోకి,’ ‘సమాధి గోతిలోకి,’ లేదా కేవలం ‘గోతిలోకి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘తమ దినాలలో సగానికి చేరరు.’ ఇది వారి జీవితం అకాలంగా ముగుస్తుందనే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרִדֵם
  choice: వారిని దింపుతావు
  rationale: ירד అనే క్రియ యొక్క హిఫీల్ రూపం ‘కిందికి వెళ్లేలా చేయడం’ అనే కారణార్థాన్ని ఇస్తుంది. ‘దింపుతావు’ ఆ కారణార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది; తీర్పు ఎలా అమలవుతుందో అదనంగా ఊహించదు.
- source_word: לִבְאֵר שַׁחַת
  choice: వినాశనపు గోతిలోకి
  rationale: בְּאֵר అంటే ‘గోతి/బావి’; שַׁחַת అంటే ‘గోతి, వినాశనం, క్షయం’ కావచ్చు. ‘వినాశనపు గోతి’ మరణం లేదా దైవిక తీర్పును సూచించే బలమైన రూపకాన్ని నిలుపుతూ, దానిని ఒక నిర్దిష్ట పరలోక సిద్ధాంతంగా మార్చదు.
- source_word: אַנְשֵׁי דָמִים וּמִרְמָה
  choice: రక్తపాతానికీ మోసానికీ పాల్పడేవారు
  rationale: అక్షరార్థంగా ‘రక్తాల మనుషులు మరియు మోసం.’ ఇది హింసకు, రక్తాపరాధానికి, వంచనకు పాల్పడే వ్యక్తులను సూచిస్తుంది. ఎంచుకున్న రూపం ఆధునిక తెలుగులో సహజంగా ఉండి రెండు లక్షణాలనూ స్పష్టంగా ఉంచుతుంది.
- source_word: לֹא יֶחֱצוּ יְמֵיהֶם
  choice: తమ ఆయుష్షులో సగం కూడా జీవించరు
  rationale: חצה అంటే ‘సగం చేయడం/విభజించడం.’ ఇక్కడ వారి జీవితం అకాలంగా ముగుస్తుందనే నుడికారార్థం ఉంది. తెలుగు రూపం ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది; అక్షరార్థాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: וַאֲנִי אֶבְטַח בָּךְ
  choice: కానీ నేను నిన్ను నమ్ముకుంటాను
  rationale: 'וַאֲנִי లోని సర్వనామం ఉద్ఘాటనతో ఉంది: ‘కానీ/నా విషయానికొస్తే, నేను.’ దుష్టుల గతికి కీర్తనకర్త వైఖరికి మధ్యనున్న వ్యత్యాసాన్ని ‘కానీ నేను’ నిలుపుతుంది; ‘నమ్ముకుంటాను’ దేవునిపై ఆధారపడే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.'
theological_decisions:
- issue: ‘వినాశనపు గోతి’ అనే తీర్పు రూపకం యొక్క స్వభావం
  choice: దైవిక తీర్పు వల్ల కలిగే మరణం లేదా వినాశనాన్ని సూచించే సజీవ రూపకంగా అనువదించబడింది; ‘నరకం’ వంటి తరువాతి కాలానికి చెందిన నిర్దిష్ట సిద్ధాంతపదం వాడలేదు.
  alternative: సమాధి; షియోల్; క్షయం
  rationale: ఈ సందర్భంలోని హీబ్రూ రూపకం బలమైనదే అయినా, ఒక నిర్దిష్ట పరలోక స్థలాన్ని తప్పనిసరిగా సూచించేంత ఖచ్చితంగా లేదు. అందువల్ల న్యాయతీర్పు మరియు మరణానికి సంబంధించిన బలాన్ని నిలుపుతూ సిద్ధాంతపరమైన అతివ్యాఖ్యానాన్ని నివారించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. దైవ సంబోధనలో ‘దేవా, నీవు’ అని, విశ్వాస ప్రకటనలో సహజమైన ‘నిన్ను నమ్ముకుంటాను’ అని వాడాం. మూలంలోని వ్యత్యాసాన్ని చూపేందుకు ఆరంభంలోను ముగింపులోను ‘కానీ’ నిలిపాం.
