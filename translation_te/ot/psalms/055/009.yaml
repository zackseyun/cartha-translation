id: PSA.55.9
reference: Psalms 55:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בַּלַּ֣ע אֲ֭דֹנָ/י פַּלַּ֣ג לְשׁוֹנָ֑/ם כִּֽי רָאִ֨יתִי חָמָ֖ס וְ/רִ֣יב בָּ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/009.yaml
  text: Confuse them[a], Lord; divide their speech[b], for I have seen violence and strife in the city.
translation:
  language: te
  text: ప్రభువా, వారిని తికమకపరచు[a]; వారి మాటను విభజించు[b]. ఎందుకంటే పట్టణంలో హింసను, కలహాన్ని నేను చూశాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువా, వారిని మింగివేయి” లేదా “వారిని నాశనం చేయి.” హీబ్రూ క్రియకు అక్షరార్థంగా విధ్వంసక భావం ఉండవచ్చు; అయితే ఇక్కడ వారి యోచనలను తికమకతో భగ్నం చేయడం అనే భావం కూడా ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “వారి నాలుకను విభజించు”; అంటే వారు ఒకరినొకరు అర్థం చేసుకోకుండా లేదా కలసి మాట్లాడలేకుండా చేయడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּע
  choice: కలవరపరచు
  rationale: ఈ క్రియకు అక్షరార్థంగా ‘మింగివేయు’ అనే విధ్వంసక భావం ఉండవచ్చు. అయితే వెంటనే వచ్చే ‘వారి నాలుకను విభజించు’ అనే సమాంతర వాక్యభాగం దృష్ట్యా, వారి పరస్పర సంభాషణను చెదరగొట్టి వారి యోచనలను భగ్నం చేయాలనే భావంలో ‘కలవరపరచు’ సహజంగా సరిపోతుంది. అక్షరార్థ అవకాశాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אֲדֹנָי
  choice: ప్రభువా
  rationale: ఇది దేవునికి వాడిన ‘ప్రభువు’ అనే బిరుదు; సంబోధనలో ఉన్నందున తెలుగులో ‘ప్రభువా’ అని అనువదించాం.
- source_word: פַּלַּג
  choice: విభజించు
  rationale: ఆజ్ఞార్థక క్రియకు ‘విభజించు/చీల్చు’ అనే అర్థం ఉంది. మూలంలోని రూపకాన్ని నిలుపుతూ ‘విభజించు’ అని ఇచ్చాం.
- source_word: לְשׁוֹנָם
  choice: వారి మాటను
  rationale: అక్షరార్థం ‘వారి నాలుకను’; సందర్భంలో నాలుక మాట లేదా భాషకు రూపకం. ఆధునిక తెలుగులో ఉద్దేశాన్ని స్పష్టంగా తెలిపేందుకు ‘వారి మాటను’ అని ఇచ్చి, అక్షరార్థాన్ని పాదటిప్పణిలో నమోదు చేశాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ప్రార్థనకు కారణాన్ని పరిచయం చేసే సంధిగా స్పష్టమైన ఆధునిక తెలుగు రూపం.
- source_word: רָאִיתִי
  choice: నేను చూశాను
  rationale: హీబ్రూ సంపూర్ణ క్రియను సహజమైన తెలుగు భూతకాల రూపంతో అందించాం; కీర్తనకర్త ప్రత్యక్షంగా గమనించిన పరిస్థితిని ఇది సూచిస్తుంది.
- source_word: חָמָס
  choice: హింసను
  rationale: ఈ పదం హింస, క్రూరత్వం లేదా హింసాత్మక దుర్మార్గాన్ని సూచిస్తుంది; ఇక్కడ ‘హింస’ అత్యంత స్పష్టమైన ఎంపిక.
- source_word: וְרִיב
  choice: కలహాన్ని
  rationale: వివాదం, పోరు, కలహం అనే భావాలలో, ‘హింస’తో సహజమైన కవితా జోడీగా ‘కలహం’ సరిపోతుంది.
- source_word: בָּעִיר
  choice: పట్టణంలో
  rationale: నిర్దిష్ట పట్టణాన్ని సూచించే సరళమైన స్థలవాచక పదబంధం.
theological_decisions:
- issue: ప్రారంభ ఆజ్ఞార్థక క్రియ בַּלַּע ను తరువాతి ‘వారి నాలుకను విభజించు’ అనే మాటతో కలిపి ఎలా అర్థం చేసుకోవాలి
  choice: శత్రువులను కలవరపరచి వారి సమన్వయాన్ని చెదరగొట్టమనే ప్రార్థనగా ప్రధాన పాఠ్యంలో ఇవ్వడం
  alternative: ‘వారిని మింగివేయి’ లేదా ‘వారిని నాశనం చేయి’ అనే విధ్వంసక భావం
  rationale: తరువాతి సమాంతర వాక్యభాగం సంభాషణ, పరస్పర అవగాహన చెదరిపోవడాన్ని బలంగా సూచిస్తుంది; బాబెలు సంఘటనను తలపించే ప్రతిధ్వని ఉండవచ్చు. అయినా మూలక్రియలోని అక్షరార్థ విధ్వంసక భావం నిజమైన ప్రత్యామ్నాయం కాబట్టి దాన్ని పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కవితా-ప్రార్థనా శైలిని అనుసరించాం. ‘కలవరపరచు’ ద్వారా సందర్భసంబంధ భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టపరుస్తూనే, ‘మింగివేయు/నాశనం చేయు’ అనే మూలపదంలోని కఠినమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం. ‘వారి మాటను విభజించు’ కొంత రూపకాలంకార స్వరాన్ని ఉద్దేశపూర్వకంగా కాపాడుతుంది.
