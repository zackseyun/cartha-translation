id: PSA.55.18
reference: Psalms 55:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: פָּ֘דָ֤ה בְ/שָׁל֣וֹם נַ֭פְשִׁ/י מִ/קֲּרָב לִ֑/י כִּֽי בְ֝/רַבִּ֗ים הָי֥וּ עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/018.yaml
  text: He has redeemed my soul in peace from the battle against me[a], for many were with me.
translation:
  language: te
  text: 'నాకు వ్యతిరేకంగా జరిగిన పోరాటం నుండి

    ఆయన నా ప్రాణాన్ని శాంతిగా విమోచించాడు;

    ఎందుకంటే అనేకులు నాతో ఉన్నారు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకంటే అనేకులు నాకు వ్యతిరేకంగా ఉన్నారు.” హెబ్రీలో అక్షరార్థంగా “ఎందుకంటే అనేకులు నాతో ఉన్నారు” అని ఉంది; సందర్భానుసారంగా ఇది అనేకమంది ప్రత్యర్థులను సూచించే నుడికారంగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: פָּדָה
  choice: విమోచించాడు
  rationale: ఈ క్రియ వెల చెల్లించి విడిపించడం, రక్షించి విమోచించడం అనే భావాలను కలిగి ఉంది. ‘విమోచించాడు’ మూలంలోని బలమైన రక్షణ భావాన్ని, పూర్తయిన కార్యాన్ని నిలుపుతుంది.
- source_word: בְשָׁלוֹם
  choice: శాంతిగా
  rationale: שָׁלוֹם శాంతి, క్షేమం, సంపూర్ణ సుఖస్థితి అనే విస్తృత భావాలను కలిగి ఉంది. ‘శాంతిగా’ మూలానికి సమీపంగా ఉండి, భావాన్ని కేవలం భద్రతకే పరిమితం చేయదు.
- source_word: נַפְשִׁי
  choice: నా ప్రాణాన్ని
  rationale: נֶפֶשׁ ప్రాణం, జీవితం, వ్యక్తి అనే అర్థాలను ఇవ్వగలదు. తెలుగు కవితా భాషలో ‘నా ప్రాణాన్ని’ సహజంగా ఉండి, మూలంలోని వ్యక్తిగత జీవస్వరూప భావాన్ని నిలుపుతుంది.
- source_word: מִקֲּרָב לִי
  choice: నాకు వ్యతిరేకంగా జరిగిన పోరాటం నుండి
  rationale: קְרָב యుద్ధం లేదా పోరాటాన్ని సూచిస్తుంది. సందర్భంలో לִי ప్రతికూల సంబంధాన్ని తెలుపుతున్నందున ‘నాకు వ్యతిరేకంగా జరిగిన’ అని స్పష్టంగా అనువదించబడింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు కారణం లేదా వివరణను పరిచయం చేసే బలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְרַבִּים הָיוּ
  choice: అనేకులు ఉన్నారు
  rationale: ఈ పదబంధం సంఖ్యాపరమైన అధికత్వాన్ని సూచిస్తుంది. ‘అనేకులు ఉన్నారు’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: עִמָּדִי
  choice: నాతో
  rationale: עִם యొక్క ప్రత్యక్ష అర్థం ‘తో’. పోరాట సందర్భం వల్ల ‘నాకు వ్యతిరేకంగా’ అనే అర్థం సాధ్యమైనప్పటికీ, ప్రధాన పాఠం మూలంలోని ‘నాతో’ అనే పదాన్ని, దాని ఉద్దేశపూర్వక సందిగ్ధతను నిలుపుతుంది.
theological_decisions:
- issue: చివరి ఉపవాక్యం בְרַבִּים הָיוּ עִמָּדִי యొక్క అర్థం
  choice: ఎందుకంటే అనేకులు నాతో ఉన్నారు
  alternative: ఎందుకంటే అనేకులు నాకు వ్యతిరేకంగా ఉన్నారు
  rationale: עִמָּדִי యొక్క సాధారణ అర్థం ‘నాతో’. అయితే సంఘర్షణ సందర్భంలో ఇది అనేకమంది ప్రత్యర్థులను సూచించే సందర్భోచిత వాడుకగా గ్రహించవచ్చు. ప్రధాన పాఠం హెబ్రీ పదప్రయోగంలోని ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది; ప్రత్యామ్నాయ భావం పాదటిప్పణిలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలి ఉపయోగించబడింది. మూలంలోని మూడు భావఖండాలను పంక్తులుగా అమర్చి, చివరి ఉపవాక్యంలోని నిజమైన సందిగ్ధతను ప్రధాన పాఠం మరియు పాదటిప్పణి ద్వారా నిలుపుకున్నాం.
