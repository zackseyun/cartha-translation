  text: 'For the choirmaster: with stringed instruments. A Maskil[a] of David[b].'
translation:
  language: te
  text: సంగీత నిర్దేశకునికి; తంతివాద్యాలతో. దావీదుకు చెందిన[b] మస్కీల్[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బోధాత్మక కీర్తన’ లేదా ‘ధ్యానగీతం’; కీర్తనల శీర్షికల్లో ‘మస్కీల్’ అనే పదానికి ఖచ్చితమైన అర్థం తెలియదు.
    reason: lexical_alternative
  - marker: b
