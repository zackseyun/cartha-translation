lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నిర్దేశకునికి
  rationale: కీర్తన శీర్షికల్లో ఈ పదం సంగీత నిర్వహణ బాధ్యతగల నాయకుణ్ణి సూచిస్తుంది. ‘సంగీత నిర్దేశకుడు’ ఆధునిక, సహజ తెలుగు; ל ఉపసర్గను ‘-కి’తో నిలిపింది.
- source_word: בִּנְגִינֹת
  choice: తంతివాద్యాలతో
  rationale: ఈ సందర్భంలో נְגִינֹת తంతివాద్య సహవాద్యాన్ని సూచిస్తుంది; ‘-తో’ అనే రూపం సహవాద్య భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מַשְׂכִּיל
  choice: మస్కీల్
  rationale: కీర్తన శీర్షికల్లో ఇది సాంకేతిక లేదా ప్రక్రియా పదం; ఖచ్చితమైన అర్థం అనిశ్చితం. అందువల్ల ప్రధాన పాఠ్యంలో లిప్యంతరీకరించి, సాధ్యమైన అర్థాలను పాదసూచికలో ఇచ్చాం.
- source_word: לְדָוִד
  choice: దావీదుకు చెందిన
  rationale: לְ అనే ఉపసర్గ కర్తృత్వం, సంబంధం, అంకితం లేదా సంకలన సంబంధాన్ని సూచించగలదు. ‘దావీదుకు చెందిన’ ఈ విస్తృత సంబంధార్థాన్ని కాపాడుతుంది; ‘దావీదు రచించిన’ అని నిర్దిష్టం చేయదు.
theological_decisions:
- issue: శీర్షికలో לְדָוִד సూచించే దావీదుతో సంబంధం
  choice: దావీదుకు చెందిన
  alternative: దావీదు రచించిన; దావీదు కోసం
  rationale: హీబ్రూ నిర్మాణం ప్రత్యక్ష కర్తృత్వాన్ని మాత్రమే తప్పనిసరిగా సూచించదు. ఎంపిక చేసిన రూపం కర్తృత్వం, అనుబంధం లేదా అంకితం మధ్యనున్న అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తన శీర్షికకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. [a] ‘మస్కీల్’కు, [b] ‘దావీదుకు చెందిన’కు వర్తిస్తాయి; వరుసగా ఉన్నప్పటికీ రెండూ తమ వివరణ పొందే వాక్యభాగం చివర ఉంచబడ్డాయి.
