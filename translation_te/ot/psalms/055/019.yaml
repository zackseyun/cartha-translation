source:
  edition: WLC
  text: יִשְׁמַ֤ע אֵ֨ל וְֽ/יַעֲנֵ/ם֮ וְ/יֹ֤שֵׁ֥ב קֶ֗דֶם סֶ֥לָה אֲשֶׁ֤ר אֵ֣ין חֲלִיפ֣וֹת לָ֑/מוֹ וְ/לֹ֖א יָרְא֣וּ אֱלֹהִֽים׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/019.yaml
  text: God will hear and answer them—he who sits enthroned from of old (Selah)—because they have no changes[c][b][a], and they do not fear God.
translation:
  language: te
  text: పూర్వకాలం నుంచే సింహాసనాసీనుడై ఉన్న దేవుడు విని, వారిని అణచివేస్తాడు.[a] సెలా.[c] ఎందుకంటే వారికి ఎలాంటి మార్పులూ లేవు[b], వారు దేవునికి భయపడరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “వారికి జవాబిస్తాడు.” హీబ్రూ క్రియకు ఈ అర్థం రావచ్చు; అయితే ఈ సందర్భంలో వారిని తగ్గించడం లేదా బాధించడం అనే తీర్పు భావమూ ఉండవచ్చు.'
    reason: alternative_reading
  - marker: b
    text: 'లేదా: “వారికి ఎలాంటి తారుమారులూ లేవు,” లేదా “వారిలో మార్పు లేదు.” హీబ్రూ పదబంధం క్లిష్టమైనది; నిరాటంకమైన పరిస్థితి వారిలో నిర్లక్ష్యాన్ని పెంచిందని ఇది సూచించవచ్చు.'
    reason: lexical_alternative
  - marker: c
    text: 'హీబ్రూ వాక్య నిర్మాణాన్ని ఇలా కూడా కలిపి చదవవచ్చు: “దేవుడు విని వారిని అణచివేస్తాడు—పూర్వకాలం నుంచే ఆసీనుడై ఉన్నవాడు—సెలా—ఎందుకంటే…”'
    reason: syntactic_alternative
lexical_decisions:
- source_word: יִשְׁמַע
  choice: విని
  rationale: שׁמע అనే క్రియ ఇక్కడ కీర్తనకర్తకున్న నమ్మకాన్ని వ్యక్తం చేస్తుంది. తరువాతి సమాపక క్రియతో సహజంగా కలిసేలా తెలుగులో అసమాపక రూపం వాడబడింది.
- source_word: אֵל
  choice: దేవుడు
  rationale: ఇది దేవునికి వాడే సాధారణ కవితాత్మక బిరుదు; ఆధునిక తెలుగులో సహజమైన సమానార్థకం ‘దేవుడు’.
- source_word: וְיַעֲנֵם
  choice: వారిని అణచివేస్తాడు
  rationale: ענה రూపం ఈ సందర్భంలో శత్రువులపై దేవుడు తీర్పు తీర్చి వారిని తగ్గించడం లేదా బాధించడం అనే భావాన్ని ఇవ్వవచ్చు. ‘జవాబిస్తాడు’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: וְיֹשֵׁב קֶדֶם
  choice: పూర్వకాలం నుంచే సింహాసనాసీనుడై ఉన్న
  rationale: ישׁב దేవుని గురించి వచ్చినప్పుడు కూర్చోవడం మాత్రమే కాక రాజుగా ఆసీనుడై పరిపాలించడాన్ని సూచించగలదు; קדם ప్రాచీనకాలాన్ని సూచిస్తుంది.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఈ పదం యొక్క ఖచ్చితమైన అర్థం లేదా ఆరాధనా సంబంధమైన పని అనిశ్చితంగా ఉన్నందున అనువదించకుండా లిప్యంతరీకరించబడింది.
- source_word: אֲשֶׁר אֵין חֲלִיפוֹת לָמוֹ
  choice: వారికి ఎలాంటి మార్పులూ ఎదురుకావు
  rationale: חֲלִיפוֹת పరిస్థితుల్లో వచ్చే మార్పులు, తారుమారులు లేదా ఎదురుదెబ్బలను సూచించవచ్చు. మూలంలోని క్లిష్టతను పాదటిప్పణిలో తెలియజేస్తూ, తెలుగులో సహజమైన విస్తృత భావాన్ని ప్రధాన పాఠ్యంలో ఉంచాం.
- source_word: וְלֹא יָרְאוּ אֱלֹהִים
  choice: వారు దేవునికి భయపడరు
  rationale: ఇక్కడ ‘భయపడడం’ అంటే దేవునిపట్ల భక్తిపూర్వక భయం, గౌరవం కలిగి ఆయనకు జవాబుదారులమని గుర్తించడం. మూలంలోని స్థిరమైన వైఖరిని వర్తమాన కాలంలో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ענה అనే రెండవ క్రియ యొక్క భావం
  choice: దేవుడు తీర్పులో వారిని అణచివేస్తాడు
  alternative: దేవుడు వారికి జవాబిస్తాడు
  rationale: చుట్టుపక్కల సందర్భం దుష్టులపై దేవుని తీర్పును గురించి ఉండటం వల్ల శిక్షాత్మక భావం ప్రధాన పాఠ్యంలో ఉంచబడింది. అయితే హీబ్రూ రూపానికి ‘జవాబివ్వడం’ అనే సహజమైన అర్థమూ సాధ్యమే కాబట్టి దాన్ని పాదటిప్పణిలో సంరక్షించాం.
- issue: మార్పులు లేకపోవడం అనే క్లిష్టమైన వాక్యభాగం
  choice: వారి పరిస్థితుల్లో మార్పులు లేదా ఎదురుదెబ్బలు లేకపోవడం
  alternative: వారిలో స్వభావపరమైన మార్పు లేకపోవడం
  rationale: חֲלִיפוֹת సాధారణంగా మార్పులు లేదా తారుమారులను సూచిస్తుంది. సుఖంగా, నిరాటంకంగా ఉండటం దేవుని భయం లేకపోవడానికి దారితీసిందనే సందర్భానుకూల భావాన్ని తీసుకున్నాం; వ్యక్తిగత స్వభావం మారదనే భావాన్ని బలవంతంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కీర్తనా శైలిని పాటించాం. ‘సింహాసనాసీనుడు’ కొద్దిగా ఉన్నత శైలికి చెందిన పదమైనా, దేవుని ప్రాచీన రాజాధికార భావాన్ని సంక్షిప్తంగా మరియు స్పష్టంగా తెలియజేస్తుంది. క్లిష్టమైన హీబ్రూ వాక్య నిర్మాణాన్ని తెలుగులో చదవడానికి సహజంగా పునర్వ్యవస్థీకరించాం; అసలు పాఠ్యంలోని ముఖ్యమైన అర్థసందిగ్ధతలను పాదటిప్పణుల్లో నిలిపాం.
