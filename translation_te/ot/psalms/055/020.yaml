  text: שָׁלַ֣ח יָ֭דָי/ו בִּ/שְׁלֹמָ֗י/ו חִלֵּ֥ל בְּרִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/020.yaml
  text: He stretched out his hands against those at peace with him[b][a]; he profaned his covenant.
translation:
  language: te
  text: అతడు తనతో శాంతియుత సంబంధంలో ఉన్నవారిమీద తన చేతులు చాచాడు[a]; తన నిబంధనను అపవిత్రం చేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తన స్నేహితులమీద తన చేతులు చాచాడు,’ లేక ‘తన మిత్రులమీద తన చేతులు చాచాడు.’ హీబ్రూ పదబంధం అతనితో శాంతియుత సంబంధంలో ఉన్నవారిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తన నిబంధనను ఉల్లంఘించాడు.’ హీబ్రూ క్రియకు మరింత అక్షరార్థంగా ‘అపవిత్రం చేశాడు’ లేదా ‘అపవిత్రమైనదిగా పరిగణించాడు’ అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח יָדָיו
  choice: చేతులు చాచాడు
  rationale: మూలంలోని ‘తన చేతులను చాచాడు’ అనే స్పష్టమైన రూపకాన్ని నిలుపుతూ, సందర్భంలోని శత్రుత్వ భావాన్ని ‘వారిమీద’ ద్వారా సహజంగా వ్యక్తం చేస్తుంది. మసొరెటిక్ పాఠంలోని బహువచన రూపానికి అనుగుణంగా ‘చేతులు’ వాడబడింది.
- source_word: בִּשְׁלֹמָיו
  choice: తనతో సమాధానంగా ఉన్నవారిమీద
  rationale: ఇది కేవలం స్నేహితులను లేదా రాజకీయ మిత్రులను మాత్రమే సూచించకుండా, అతనితో శాంతియుత సంబంధంలో ఉన్న వ్యక్తులనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: חִלֵּל
  choice: అపవిత్రపరిచాడు
  rationale: పీయేల్ క్రియలోని అపవిత్రం చేయడం, పవిత్రతను భంగపరచడం అనే బలమైన నైతిక భావాన్ని నిలుపుతుంది; ‘ఉల్లంఘించాడు’ అనేది సందర్భానుసారమైన ప్రత్యామ్నాయం.
- source_word: בְּרִיתוֹ
  choice: తన నిబంధనను
  rationale: బెరీత్‌కు సాధారణమైన నిబంధన/ఒడంబడిక భావాన్ని నిలుపుతూ, అది ప్రత్యేకంగా దేవుని నిబంధనే అని పాఠంలో లేని వివరాన్ని చేర్చదు.
theological_decisions:
- issue: నిబంధన స్వభావం
  choice: ‘తన నిబంధనను అపవిత్రపరిచాడు’ అని అనువదించడం
  alternative: ‘తన ఒప్పందాన్ని ఉల్లంఘించాడు’ అని అనువదించడం
  rationale: సందర్భం ఒక ద్రోహపూరిత సహచరుని గురించి ఉన్నప్పటికీ, మూలంలోని నిబంధనాత్మక మరియు నైతిక తీవ్రతను ఈ ఎంపిక నిలుపుతుంది; దీన్ని దేవునితో చేసిన నిబంధనగా ప్రత్యేకంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. ‘సమాధానంగా ఉన్నవారు’ సంబంధపరమైన శాంతి భావాన్ని నిలుపుతుంది; ‘నిబంధన’ మరియు ‘అపవిత్రపరిచాడు’ మూలంలోని గంభీర నైతిక పదజాలాన్ని కాపాడుతాయి.
