id: PSA.55.6
reference: Psalms 55:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אֹמַ֗ר מִֽי יִתֶּן לִּ֣/י אֵ֭בֶר כַּ/יּוֹנָ֗ה אָע֥וּפָה וְ/אֶשְׁכֹּֽנָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/006.yaml
  text: And I said[a], “Who will give me wings like a dove? I would fly away and dwell.”
translation:
  language: te
  text: 'నేను ఇలా అన్నాను[a]:


    “పావురంలాంటి రెక్కలు నాకు ఎవరు ఇస్తారు?


    నేను ఎగిరిపోయి నివసించేవాణ్ణి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, భావాన్ని మరింత సహజంగా చెప్పాలంటే: “పావురంలాంటి రెక్కలు నాకు ఉంటే ఎంత బాగుండేది! నేను ఎగిరిపోయి విశ్రమించేవాణ్ణి.”'
    reason: మూలంలోని ప్రశ్నారూపం కోరికను వ్యక్తం చేసే నుడికారంగా కూడా అర్థమవుతుంది; అలాగే ‘నివసించు’ అనే క్రియ ఈ సందర్భంలో విశ్రాంతి పొందడాన్ని సూచించవచ్చు.
lexical_decisions:
- source_word: וָאֹמַר
  choice: అప్పుడు నేను ఇలా అన్నాను
  rationale: אמר క్రియారూపం ముందున్న భావప్రవాహానికి అనుసంధానంగా కీర్తనకర్త మాటలను పరిచయం చేస్తుంది. ‘అప్పుడు’ సహజమైన తెలుగు క్రమాన్ని తెలియజేస్తుంది; ‘ఇలా’ తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: מִי יִתֶּן לִּי
  choice: నాకు ఎవరు ఇస్తారు?
  rationale: హీబ్రూ ప్రశ్నారూపాన్ని నిలుపుతూ, దానిలోని తీవ్రమైన కోరికను సందర్భమే వ్యక్తం చేసేలా అనువదించబడింది. మరింత స్వేచ్ఛాయుతమైన కోరికరూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: אֵבֶר
  choice: రెక్కలు
  rationale: మూలంలో ఏకవచన రూపం ఉన్నా, ఎగరడానికి ఉపయోగించే రెక్కలను సమష్టిగా సూచిస్తుంది; ఆధునిక తెలుగులో బహువచనం సహజం.
- source_word: כַּיּוֹנָה
  choice: పావురంలాంటి
  rationale: כְּ ఉపసర్గ సూచించే పోలికను సంక్షిప్తమైన, సహజమైన తెలుగు సమాసరూపంలో నిలుపుతుంది.
- source_word: אָעוּפָה
  choice: నేను ఎగిరిపోయి
  rationale: కోహోర్టేటివ్ రూపంలోని కోరికభావాన్ని తరువాతి ‘నివసించేవాణ్ణి’తో కలిసి తెలుగులో వ్యక్తం చేస్తుంది; ‘ఎగిరిపోయి’ కష్టస్థితి నుంచి దూరంగా వెళ్లే సందర్భార్థాన్నీ అందిస్తుంది.
- source_word: וְאֶשְׁכֹּנָה
  choice: నివసించేవాణ్ణి
  rationale: שכן యొక్క ప్రాథమిక అర్థమైన ‘నివసించు, స్థిరపడు’ను కాపాడుతూ, అవాస్తవ కోరికకు తగిన తెలుగు క్రియారూపాన్ని వాడింది. ‘విశ్రమించేవాణ్ణి’ సందర్భార్థపరంగా సాధ్యమైన ప్రత్యామ్నాయం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన కవితా శైలి. ప్రధాన పాఠం హీబ్రూ ప్రశ్నారూపాన్నీ ‘నివసించు’ అనే ప్రాథమిక పదార్థాన్నీ నిలుపుతుంది; నుడికారాత్మక కోరికభావం పాదటిప్పణిలో ఇవ్వబడింది.
