id: PSA.55.22
reference: Psalms 55:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הַשְׁלֵ֤ךְ עַל יְהוָ֨ה יְהָבְ/ךָ֮ וְ/ה֪וּא יְכַ֫לְכְּלֶ֥/ךָ לֹא יִתֵּ֖ן לְ/עוֹלָ֥ם מ֗וֹט לַ/צַּדִּֽיק־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/022.yaml
  text: Cast your burden on Yahweh[a], and he will sustain you[b]; he will never allow the righteous to be shaken.
translation:
  language: te
  text: నీ భారాన్ని యాహ్వే మీద వేయి[a]; ఆయన నిన్ను ఆదుకుంటాడు. నీతిమంతుడు[b] ఎన్నటికీ తొట్రిల్లిపోవడానికి ఆయన అనుమతించడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీ వంతు,’ ‘నీ చింత,’ లేదా బహుశా ‘ఆయన నీకు ఇచ్చినది’ అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ నామవాచకం అరుదైనది; ఒక వ్యక్తిపై మోపబడిన దానిని విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘నీతిమంతుడు’ పుంలింగ ఏకవచనంలో ఉంది; ఇది సాధారణ లేదా ప్రతినిధి అర్థంలో వాడబడివుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁלֵךְ
  choice: వేయి
  rationale: שלך అనే క్రియ యొక్క ఆజ్ఞారూపం ‘విసరడం/వేయడం’ అనే సజీవ రూపకాన్ని వ్యక్తం చేస్తుంది. తెలుగులో ‘మీద వేయి’ సహజంగా ఉండి మూలంలోని బలాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ప్రతిలిపి చేయబడింది.
- source_word: יְהָבְךָ
  choice: నీ భారం
  rationale: ఇది అరుదైన నామవాచకం; ఒక వ్యక్తిపై మోపబడినది—భారం, వంతు, చింత లేదా అతనికి ఇవ్వబడినది—అనే విస్తృత భావం ఉండవచ్చు. సందర్భంలో ‘భారం’ సహజంగా సరిపోతుంది; ఇతర అవకాశాలు పాదసూచికలో నిలుపబడ్డాయి.
- source_word: יְכַלְכְּלֶךָ
  choice: ఆయన నిన్ను ఆదుకుంటాడు
  rationale: כלכל పోషించడం, నిలబెట్టడం, ఆధారం ఇవ్వడం అనే భావాలను కలిగి ఉంది. ‘ఆదుకుంటాడు’ అనేది సరఫరా మరియు ఆధారం రెండింటినీ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לֹא יִתֵּן לְעוֹלָם
  choice: ఎన్నటికీ ... అనుమతించడు
  rationale: నిరాకరణ, נתן, לְעוֹלָם కలసి శాశ్వతంగా అనుమతించకపోవడం అనే ప్రయోగార్థాన్ని ఇస్తాయి. ఈ తెలుగు రూపం మూలార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: מוֹט
  choice: తొట్రిల్లిపోవడానికి
  rationale: מוֹט అస్థిరపడడం, జారడం లేదా తూలిపోవడం అనే రూపకాన్ని సూచిస్తుంది. ‘తొట్రిల్లిపోవడం’ స్థిరత్వం కోల్పోయే భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: לַצַּדִּיק
  choice: నీతిమంతుడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న పుంలింగ ఏకవచన విశేషణం నామవాచకంగా వాడబడింది. తెలుగు ఏకవచన పుంలింగ రూపం మూల వ్యాకరణాన్ని నిలుపుతూ ప్రతినిధి భావాన్నీ అనుమతిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: వచనంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన దైవనామ రూపం ‘యెహోవా’గా ఇచ్చాం.
- issue: לַצַּדִּיק యొక్క లింగం మరియు ప్రతినిధి ప్రయోగం
  choice: నీతిమంతుడు
  alternative: నీతిమంతులు; నీతిగల వ్యక్తి
  rationale: హీబ్రూలో ఇది పుంలింగ ఏకవచనం, అయితే సాధారణంగా నీతిమంతుడైన ఎవరినైనా సూచించే ప్రతినిధి ప్రయోగం కావచ్చు. మూలంలోని ఏకవచన రూపాన్ని మార్చకుండా ‘నీతిమంతుడు’గా ఉంచాం.
- issue: నీతిమంతుడు తొట్రిల్లనివ్వనన్న వాగ్దానం యొక్క పరిధి
  choice: ఎన్నటికీ తొట్రిల్లిపోవడానికి ఆయన అనుమతించడు
  alternative: ఎన్నటికీ పూర్తిగా కూలిపోనివ్వడు
  rationale: మూలం ‘מוֹט’ అనే అస్థిరత రూపకాన్నే ఉపయోగిస్తుంది; అది జీవితంలో ఎలాంటి కష్టం లేదా తాత్కాలిక కలత ఉండదని తప్పనిసరిగా చెప్పదు. అందువల్ల రూపకంలోని ఉద్రిక్తతను వివరణతో పరిమితం చేయకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కవితాత్మక శైలి. ఆజ్ఞలో ఏకవచన సంబోధనను, దైవనామాన్ని, నీతిమంతుని ఏకవచన ప్రతినిధి రూపాన్ని నిలుపుకున్నాం. ప్రధాన పాఠంలోని [a] గుర్తు పాదసూచికతో సరిపోలుతుంది.
