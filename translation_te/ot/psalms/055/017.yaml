  yaml_path: translation/ot/psalms/055/017.yaml
  text: Evening[a], morning, and noon I complain and groan[c][b], and he hears my voice.
translation:
  language: te
  text: సాయంకాలం, ఉదయం, మధ్యాహ్నం నేను విలపిస్తాను, మూలుగుతాను; ఆయన నా స్వరం వింటాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేను ధ్యానిస్తూ మూలుగుతాను.’ ఇక్కడి హీబ్రూ క్రియకు ‘మాట్లాడు,’ ‘ధ్యానించు,’ లేదా ‘విలపించు’ అనే అర్థాలు రావచ్చు; ఈ విలాప సందర్భంలో ‘విలపించు’ అనే భావం ఎక్కువగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలం అక్షరార్థంగా ‘ఆయన నా స్వరం వింటాడు’ అని మాత్రమే చెబుతుంది. కర్త పేరు చెప్పబడలేదు; పరిసర సందర్భంలో ‘ఆయన’ దేవుణ్ణి సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרֶב וָבֹקֶר וְצָהֳרַיִם
  choice: సాయంకాలం, ఉదయం, మధ్యాహ్నం
  rationale: మూడు కాలనామాలను సమాంతరమైన, లయబద్ధమైన జాబితాగా ఉంచి హీబ్రూ కవితా నిర్మాణాన్ని నిలిపింది.
- source_word: אָשִׂיחָה
  choice: నేను మొరపెట్టి
  rationale: שׂיח ధ్యానించడం, మాట్లాడడం, మనోవేదన వెలిబుచ్చడం అనే అర్థాలను కలిగి ఉంటుంది. ఈ విలాప సందర్భంలో తరువాతి 'మూలుగుతాను'తో కలిపి వేదనతో మొరపెట్టుకోవడం సహజమైన అర్థం.
- source_word: וְאֶהֱמֶה
  choice: మూలుగుతాను
  rationale: המה ఇక్కడ కలతతో వినిపించే మూలుగు లేదా రోదనధ్వనిని సూచిస్తుంది; 'మూలుగుతాను' విలాప స్వరాన్ని అతిశయింపకుండా వ్యక్తం చేస్తుంది.
- source_word: וַיִּשְׁמַע
  choice: ఆయన ... వింటాడు
  rationale: కవితా సందర్భంలో ఈ రూపం నమ్మకంతో చెప్పే వర్తమాన లేదా అలవాటైన కార్యంగా సహజంగా అర్థమవుతుంది.
- source_word: קוֹלִי
  choice: నా స్వరం
  rationale: קוֹל ప్రార్థన సందర్భంలో వ్యక్తిగతంగా వినిపించే 'స్వరం'ను సూచిస్తుంది; మూలంలోని స్పష్టమైన నామవాచకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: וַיִּשְׁמַע క్రియలో అంతర్లీనంగా ఉన్న కర్త
  choice: '''ఆయన'' అని ఉంచి, దేవుని నామాన్ని ప్రధాన వచనంలో చేర్చలేదు'
  alternative: '''యెహోవా నా స్వరం వింటాడు'' లేదా ''దేవుడు నా స్వరం వింటాడు'''
  rationale: హీబ్రూలో కర్త మూడవ పురుష ఏకవచనంగా అంతర్లీనంగా ఉంది; పరిసర సందర్భం అది దేవుణ్ణి సూచిస్తుందని తెలుపుతుంది, కానీ ఈ వాక్యంలో దైవనామం లేదు. అందువల్ల మూలంలో లేని పదాన్ని చేర్చకుండా అసలు అస్పష్టతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కవితా శైలిని ఉపయోగించింది. కాలసూచకాల త్రయం సమాంతరంగా ఉంచబడింది; విలాప స్వరం మరియు దేవునిపై నమ్మకం రెండూ నిలిపివేయబడ్డాయి.
