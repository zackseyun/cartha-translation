  yaml_path: translation/ot/psalms/055/015.yaml
  text: Let death come upon them[a]; let them go down alive to Sheol, for evil is in their dwelling[d][c][b], in their midst.
translation:
  language: te
  text: మరణం వారిమీదికి వచ్చుగాక[a]; వారు సజీవులుగానే షెయోల్‌లోకి దిగిపోవుగాక[b], ఎందుకంటే వారి నివాసంలో[c], వారి మధ్య[d] దుష్టత్వం ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వినాశాలు వారిమీదికి వచ్చుగాక,” “మరణం అకస్మాత్తుగా వారిమీదికి వచ్చుగాక,” లేదా ఇలాంటి భావం. ఇక్కడి మొదటి హీబ్రూ పదం క్లిష్టమైనది; దాని ఖచ్చితమైన భావఛాయ అనిశ్చితం.
    reason: textual_variant
  - marker: b
    text: '‘షెయోల్’ అనేది మృతుల లోకాన్ని సూచించే హీబ్రూ పదం; మరో అనువాదం: “సమాధి.”'
    reason: lexical_alternative
  - marker: c
    text: లేదా, “వారి నివాసస్థలంలో”; “వారి పరదేశ నివాసంలో” అనే భావమూ సాధ్యం.
    reason: lexical_alternative
  - marker: d
    text: లేదా, “వారిలోపల” లేదా “వారి నడుమ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ישימות
  choice: మరణం వచ్చుగాక
  rationale: ఆరంభ హీబ్రూ పదరూపం క్లిష్టమైనది. తరువాతి పాదంలోని షెయోలులోకి దిగిపోవడం అనే భావంతో సమాంతరంగా, మరణం వారిమీదికి రావాలనే శాపోక్తిని ప్రధాన పాఠంలో ఉంచి, అనిశ్చితిని పాదటిప్పణిలో తెలిపాం.
- source_word: עָלֵימוֹ
  choice: వారిమీదికి
  rationale: హీబ్రూ విభక్తి ప్రయోగంలోని ‘వారిమీద’ అనే దిశాత్మక భావాన్ని సహజమైన తెలుగు కవితా ప్రయోగంగా అందిస్తుంది.
- source_word: יֵרְדוּ
  choice: దిగిపోవుగాక
  rationale: ఈ శాపోక్తి సందర్భంలోని సంకల్పార్థక భావాన్ని నిలుపుతూ, కిందికి వెళ్లే దృశ్యాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: שְׁאוֹל
  choice: షెయోలు
  rationale: ‘నరకం’ వంటి తరువాతి సిద్ధాంతార్థాన్ని దిగుమతి చేయకుండా, మృతుల లోకాన్ని సూచించే హీబ్రూ పదం యొక్క విస్తృత భావపరిధిని కాపాడేందుకు లిప్యంతరీకరించాం.
- source_word: חַיִּים
  choice: సజీవులుగానే
  rationale: వారు ఇంకా బతికుండగానే షెయోలులోకి దిగుతారనే క్రియావిశేషణ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న శాపోక్తికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: רָעוֹת
  choice: దుష్టత్వం
  rationale: ఇక్కడ కీడు లేదా విపత్తులకన్నా నైతిక చెడును సూచించే సమష్టి భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בִּמְגוּרָם
  choice: వారి నివాసాల్లో
  rationale: వారి నివాసస్థలాల్లో దుష్టత్వం ఉందనే స్థానార్థాన్ని తెలియజేస్తుంది; ‘వారి పరదేశ నివాసంలో’ అనే సాధ్యార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: בְּקִרְבָּם
  choice: వారి మధ్య
  rationale: సమాజం నడుమ అనే భావానికి సరిపోతుంది; ‘వారిలోపల’ అనే అంతరార్థం కూడా సాధ్యమని పాదటిప్పణి సూచిస్తుంది.
theological_decisions:
- issue: שְׁאוֹל యొక్క స్వభావం
  choice: ప్రధాన పాఠంలో ‘షెయోలు’ అని ఉంచడం
  alternative: ‘సమాధి’ లేదా ‘మృతుల లోకం’
  rationale: హీబ్రూ బైబిలులోని కవితాత్మక, ధార్మిక భావపరిధిని నిలుపుతూ, దాన్ని ‘నరకం’గా ముందే నిర్ణయించకుండా ఉండేందుకు మూలపదాన్ని లిప్యంతరీకరించాం.
- issue: ఆరంభ శాపోక్తి యొక్క క్లిష్ట పాఠం
  choice: ‘మరణం వారిమీదికి వచ్చుగాక’
  alternative: ‘వినాశాలు వారిమీదికి వచ్చుగాక’ లేదా ‘మరణం అకస్మాత్తుగా వారిమీదికి వచ్చుగాక’
  rationale: ישימות అనే రూపం అస్పష్టమైనది. తరువాతి పాదంతో ఉన్న సమాంతరత మరణాన్ని ప్రధాన భావంగా సమర్థించినా, అకస్మాత్తుతనం లేదా వినాశం అనే సూక్ష్మార్థాన్ని ఖచ్చితంగా నిర్ణయించలేం; అందుకే ప్రత్యామ్నాయాలను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా శైలిని ఉపయోగించాం. ‘వచ్చుగాక,’ ‘దిగిపోవుగాక’ రూపాలు కీర్తనలోని శాపోక్తి స్వరాన్ని నిలుపుతాయి. ‘షెయోలు’ పాఠకులకు అపరిచితం కావచ్చునని పాదటిప్పణిలో అర్థాన్ని వివరించాం.
