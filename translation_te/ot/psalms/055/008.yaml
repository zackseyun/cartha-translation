  yaml_path: translation/ot/psalms/055/008.yaml
  text: I would hasten to a refuge for myself from the rushing wind[a], from the storm.
translation:
  language: te
  text: నేను నాకు ఆశ్రయమయ్యే చోటికి త్వరగా వెళ్లిపోవాలని కోరుకుంటాను[a]—ఉద్ధృతంగా వీచే గాలి నుండి, తుఫాను నుండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేను త్వరగా తప్పించుకుంటాను,’ లేదా ‘నేను ఆశ్రయానికి త్వరగా వెళ్లాలి.’ హీబ్రూ రూపం తొందరతో కూడిన వ్యక్తిగత సంకల్పాన్ని లేదా కోరికను వ్యక్తపరుస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִישָׁה
  choice: త్వరపడతాను
  rationale: חוּשׁ ధాతువు తొందరను సూచిస్తుంది. ఈ సందర్భంలోని మొదటి పురుష సంకల్పార్థక రూపం వ్యక్తిగత కోరికను లేదా దృఢ సంకల్పాన్ని తెలియజేస్తుంది; తెలుగు ప్రధాన పాఠ్యంలో సహజంగా ఉండేలా ‘త్వరపడతాను’ అని ఇచ్చి, దాని భావవ్యాప్తిని పాదసూచికలో ఉంచాం.
- source_word: מִפְלָט לִי
  choice: నాకు ఆశ్రయమైన చోటికి
  rationale: מִפְלָט తప్పించుకునే స్థలాన్ని లేదా ఆశ్రయాన్ని సూచిస్తుంది; לִי వ్యక్తిగత ప్రయోజన భావాన్ని జోడిస్తుంది. ‘నాకు ఆశ్రయమైన చోటికి’ అనేది గమ్యస్థాన భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מֵרוּחַ סֹעָה
  choice: విరుచుకుపడే గాలి నుండి
  rationale: רוּחַ ఇక్కడ తరువాతి తుఫాను చిత్రణతో కలిసి వాతావరణ సంబంధమైన ‘గాలి’ని సూచిస్తుంది. סֹעָה దాని ఉద్ధృతమైన, హింసాత్మక కదలికను వర్ణిస్తుంది; ‘విరుచుకుపడే’ ఆ తీవ్రతను సహజంగా అందిస్తుంది.
- source_word: מִסָּעַר
  choice: తుఫాను నుండి
  rationale: סַעַר అంటే తుఫాను లేదా పెనుతుఫాను. మూలంలోని పునరుక్త מִן ఉపసర్గను ప్రతిబింబిస్తూ ‘నుండి’ని రెండవసారి నిలిపి, సమాంతర నిర్మాణాన్ని కాపాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, కీర్తనకు తగిన గౌరవప్రదమైన శైలి వాడబడింది. డాష్ ద్వారా మూలంలోని ‘ఆశ్రయం’ మరియు దేనినుండి ఆశ్రయం కోరుతున్నాడో తెలిపే సమాంతర భాగాల సంబంధం స్పష్టంగా ఉంచబడింది.
