  yaml_path: translation/ot/psalms/055/002.yaml
  text: Pay attention to me and answer me[a]; I am restless in my complaint[b], and I moan.
translation:
  language: te
  text: నన్ను ఆలకించి నాకు జవాబివ్వు; నా ఫిర్యాదులో[b] నేను అశాంతిగా ఉన్నాను[a], మూలుగుతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా ఫిర్యాదుతో అశాంతిగా తిరుగుతున్నాను.’ హీబ్రూ క్రియ వేదనలో కలిగే చంచల సంచారాన్ని లేదా తీవ్ర కలవరాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఫిర్యాదు’ అనే పదాన్ని ‘ధ్యానం’ లేదా ‘మననం’ అని కూడా అనువదించవచ్చు; ఇక్కడ విలాప సందర్భం ‘ఫిర్యాదు’ అనే భావానికి అనుకూలంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה לִּי
  choice: నా మాట ఆలకించి
  rationale: קשׁב అనే ఆజ్ఞారూపం శ్రద్ధగా వినమని చేసే అత్యవసర విజ్ఞప్తి. తెలుగులో ‘నా మాట ఆలకించి’ సహజంగా, గౌరవప్రదంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: וַעֲנֵנִי
  choice: నాకు జవాబివ్వు
  rationale: ענה ఇక్కడ ప్రార్థనకు సమాధానమివ్వడం లేదా స్పందించడం అనే ప్రత్యక్ష భావాన్ని ఇస్తుంది.
- source_word: אָרִיד
  choice: నేను అశాంతిగా ఉన్నాను
  rationale: ఈ క్రియ దుఃఖం వల్ల కలిగిన చంచలతను లేదా అటూ ఇటూ తిరిగే స్థితిని సూచించగలదు. ప్రధాన పాఠంలో సహజమైన తెలుగు కోసం ‘అశాంతిగా ఉన్నాను’ ఎంచుకోబడింది; సంచరించే భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: בְּשִׂיחִי
  choice: నా ఫిర్యాదులో
  rationale: שׂיח ధ్యానం, మననం, లేదా వేదనతో కూడిన మొర/ఫిర్యాదు అని అర్థమవవచ్చు. ఈ విలాప సందర్భంలో ‘ఫిర్యాదు’ అనుకూలమైనప్పటికీ, నిజమైన పదార్థ వైవిధ్యాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְאָהִימָה
  choice: మూలుగుతున్నాను
  rationale: המה శబ్దం చేయడం, గొణగడం, మూలుగడం వంటి అర్థాలను ఇస్తుంది. విలాప సందర్భంలోని వినిపించే వేదనను ‘మూలుగుతున్నాను’ స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలి వాడబడింది. మూలంలోని అత్యవసర విజ్ఞప్తి, అంతరంగ కలవరం, వినిపించే వేదన నిలుపబడ్డాయి. ప్రతి పాదసూచిక సూచిక ప్రధాన పాఠంలో చేర్చబడింది.
