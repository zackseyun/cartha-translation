source:
  edition: WLC
  text: הַוּ֥וֹת בְּ/קִרְבָּ֑/הּ וְֽ/לֹא יָמִ֥ישׁ מֵ֝/רְחֹבָ֗/הּ תֹּ֣ךְ וּ/מִרְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/011.yaml
  text: Destruction is within her[b][a]; oppression and deceit do not depart from her square.
translation:
  language: te
  text: వినాశకరమైన కీడులు[a] దాని మధ్య ఉన్నాయి; దాని బహిరంగ కూడలి[b] నుండి అణచివేత, మోసం తొలగిపోవు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వినాశాలు.” హీబ్రూ నామవాచకం బహువచనంలో ఉండి, నాశనకరమైన కార్యాలు, విపత్తులు లేదా కీడులను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దాని వీధుల నుండి.” హీబ్రూ పదం నగరంలోని బహిరంగ ప్రదేశాన్ని లేదా ప్రజలు కూడే చౌకును మరింత ప్రత్యేకంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַוּוֹת
  choice: వినాశకరమైన కీడులు
  rationale: మూలంలోని బహువచనాన్ని నిలుపుతూ, నగరంలో వ్యాపించిన నాశనకరమైన కార్యాలు లేదా కీడులు అనే విస్తృత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּקִרְבָּהּ
  choice: దాని మధ్య
  rationale: అక్షరార్థమైన ‘దాని మధ్యలో’ అనే స్థలార్థాన్ని సంక్షిప్తంగా నిలుపుతుంది; తెలుగులో నగరాన్ని ‘దాని’ అని సూచించడం సహజం.
- source_word: יָמִישׁ
  choice: తొలగిపోవు
  rationale: అక్కడి నుండి దూరం కావు లేదా విడిచిపోవు అనే నిరంతర ఉనికి భావాన్ని తెలుపుతుంది. హీబ్రూలో క్రియ ఏకవచనమైనప్పటికీ, జతగా ఉన్న రెండు కీడులను తెలుగులో సహజంగా బహువచన క్రియతో అనుసంధానించాం.
- source_word: מֵרְחֹבָהּ
  choice: దాని బహిరంగ కూడలి నుండి
  rationale: רְחוֹב సాధారణ వీధికన్నా నగరంలోని తెరచిన ప్రజాస్థలం లేదా కూడలిని సూచించగలదు; ‘బహిరంగ కూడలి’ ఆ పట్టణ సందర్భాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: תֹּךְ
  choice: అణచివేత
  rationale: ఈ నామవాచకం పీడన, దోపిడీ లేదా బలవంతపు అన్యాయాన్ని సూచించగలదు. సామాజిక దుర్మార్గాల సందర్భంలో ‘అణచివేత’ సహజమైన విస్తృత పదం.
- source_word: וּמִרְמָה
  choice: మోసం
  rationale: మోసపూరిత ప్రవర్తన, వంచన లేదా కపటాన్ని సూచించే సాధారణ భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
