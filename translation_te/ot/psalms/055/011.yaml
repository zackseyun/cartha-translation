  register: ఆధునిక ప్రామాణిక తెలుగు; కీర్తనకు తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు స్పష్టంగా ఉండే పదజాలం. నగరానికి సంబంధించిన హీబ్రూ స్త్రీలింగ ప్రత్యయాన్ని తెలుగులో అసహజమైన స్త్రీ సర్వనామంతో కాక ‘దాని’తో వ్యక్తం చేశాం.
