translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన శైలి. నగరానికి హీబ్రూలో ఉన్న స్త్రీలింగ వ్యక్తీకరణను తెలుగులో అసహజమైన లింగసూచనతో బలవంతం చేయకుండా ‘దాని’ ద్వారా నిలిపాం; బహువచన కర్తను సందర్భం కంటే మించి గుర్తించలేదు.
