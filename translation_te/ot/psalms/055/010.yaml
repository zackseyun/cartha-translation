source:
  edition: WLC
  text: יוֹמָ֤ם וָ/לַ֗יְלָה יְסוֹבְבֻ֥/הָ עַל חוֹמֹתֶ֑י/הָ וְ/אָ֖וֶן וְ/עָמָ֣ל בְּ/קִרְבָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/010.yaml
  text: Day and night they go around her on her walls[b][a], and trouble and misery are within her.
translation:
  language: te
  text: పగలూ రాత్రీ అవి దాని ప్రాకారాల మీద తిరుగుతుంటాయి[a]; దాని మధ్యలో కీడు, బాధ ఉన్నాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అవి దాన్ని దాని ప్రాకారాల చుట్టూ చుట్టుముడతాయి.” హీబ్రూ క్రియ చుట్టూ తిరగడాన్నీ, చుట్టుముట్టడాన్నీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: “కీడు, బాధ” అనే మాటలను “దుష్టత్వం, అణచివేత” లేదా “అన్యాయం, కష్టం” అని కూడా అనువదించవచ్చు. హీబ్రూ పదాలు నైతిక చెడునూ, అది కలిగించే బాధనూ సూచించగలవు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹמָם וָלַיְלָה
  choice: పగలూ రాత్రీ
  rationale: నిరంతరంగా కొనసాగే చర్యను సూచించే సహజమైన తెలుగు కాలజంట.
- source_word: יְסוֹבְבֻהָ
  choice: అవి దాని చుట్టూ తిరుగుతుంటాయి
  rationale: סבב అనే క్రియలో చుట్టూ తిరగడం, చుట్టుముట్టడం అనే రెండు భావాలూ ఉన్నాయి. బహువచన కర్తను సందర్భానుసారంగా నిర్దిష్టం చేయకుండా ‘అవి’ అని ఉంచి, కొనసాగుతున్న కదలికను ‘తిరుగుతుంటాయి’ తెలియజేస్తుంది.
- source_word: עַל חוֹמֹתֶיהָ
  choice: దాని ప్రాకారాల మీద
  rationale: עַל యొక్క సాధారణ అర్థమైన ‘మీద’ను నేరుగా నిలుపుతూ, స్త్రీలింగంగా వ్యక్తీకరించబడిన నగరాన్ని తెలుగులో సహజంగా ‘దాని’ అని సూచిస్తుంది.
- source_word: אָוֶן
  choice: కీడు
  rationale: ఈ పదం దుష్టత్వం, అపకారం, దాని వల్ల కలిగే కష్టాన్ని సూచించగలదు. ‘కీడు’ నైతిక చెడును, హానికర ఫలితాన్ని రెండింటినీ పూర్తిగా ఒకదానికే పరిమితం చేయకుండా వ్యక్తపరుస్తుంది.
- source_word: עָמָל
  choice: బాధ
  rationale: ఈ పదం కష్టం, దుఃఖం, అణచివేతతో కూడిన బాధ లేదా హానికరమైన కార్యాన్ని సూచించగలదు. ‘బాధ’ నగరంలోని దురవస్థను సహజంగా తెలియజేస్తూ אָוֶןకు వాడిన పదంతో భేదాన్ని ఉంచుతుంది.
- source_word: בְּקִרְבָּהּ
  choice: దాని మధ్యలో
  rationale: మూలంలోని ‘ఆమె మధ్యలో’ అనే భావాన్ని, నగరాన్ని సూచించే ఆధునిక సహజ తెలుగులో వ్యక్తపరుస్తుంది.
