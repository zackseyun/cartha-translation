  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన శైలి. మూలంలోని సమాంతర నిర్మాణం, ‘కప్పివేయడం’ అనే రూపకం నిలుపబడ్డాయి; פַּלָּצוּת పదంలోని భీతి/వణుకు అర్థవిస్తృతిని పాదసూచికలో చూపించాం.
