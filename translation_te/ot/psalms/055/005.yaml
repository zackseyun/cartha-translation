lexical_decisions:
- source_word: יִרְאָה
  choice: భయం
  rationale: ఈ నామవాచకం భయం లేదా బెదురు అనే భావాన్ని సూచిస్తుంది; సందర్భంలో ‘భయం’ నేరుగా, సహజంగా ఉంది.
- source_word: וָרַעַד
  choice: వణుకు
  rationale: భయంతో కలిగే శారీరక కంపనాన్ని సూచిస్తుంది; ‘భయం, వణుకు’ అనే జోడీ మూలంలోని భావోద్వేగ, శారీరక పార్శ్వాలను నిలుపుతుంది.
- source_word: יָבֹא בִי
  choice: నాపైకి వస్తున్నాయి
  rationale: అక్షరార్థంగా ‘నాలోకి వస్తుంది’; అనుభవం వక్తను ఆవహిస్తున్న భావాన్ని సహజ తెలుగులో ‘నాపైకి వస్తున్నాయి’గా వ్యక్తం చేసింది.
- source_word: וַתְכַסֵּנִי
  choice: నన్ను కప్పివేస్తోంది
  rationale: כסה అనే ధాతువు ‘కప్పు’ అని అర్థం; ‘ముంచెత్తుతోంది’ వంటి వివరణాత్మక అనువాదం బదులు మూలంలోని కప్పే రూపకాన్ని నిలిపింది.
- source_word: פַּלָּצוּת
  choice: భయభ్రాంతి
  rationale: తీవ్రమైన భీతి, దిగ్భ్రాంతి లేదా ఒళ్లు జలదరించే వణుకును సూచిస్తుంది; ‘భయభ్రాంతి’ తీవ్రతను సహజంగా తెలియజేస్తూ కప్పే రూపకంతో సరిపోతుంది.
