  text: כִּ֤י לֹֽא אוֹיֵ֥ב יְחָֽרְפֵ֗/נִי וְ/אֶ֫שָּׂ֥א לֹֽא מְ֭שַׂנְאִ/י עָלַ֣/י הִגְדִּ֑יל וְ/אֶסָּתֵ֥ר מִמֶּֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/012.yaml
  text: For it is not an enemy who taunts me—then I could bear it[b][a]; it is not one who hates me who has magnified himself against me—then I could hide from him.
translation:
  language: te
  text: ఎందుకంటే నన్ను దూషిస్తున్నవాడు[a] శత్రువు కాదు—అలా అయితే నేను దాన్ని భరించగలిగేవాణ్ణి; నాకు విరోధంగా తనను తాను గొప్ప చేసుకున్నవాడు[b] నన్ను ద్వేషించేవాడు కాదు—అలా అయితే నేను అతని నుండి దాగుకొనగలిగేవాణ్ణి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నన్ను నిందిస్తున్నవాడు,’ ‘నన్ను అవమానిస్తున్నవాడు.’ హీబ్రూ క్రియ హేళనతో కూడిన మాటల దాడిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నాకు విరోధంగా తనను తాను గొప్పగా చేసుకున్నవాడు’; అంటే, ‘నా పట్ల అహంకారంగా ప్రవర్తించినవాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న విలాపానికి కారణం లేదా వివరణను పరిచయం చేసే సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אוֹיֵב
  choice: శత్రువు
  rationale: విరోధి లేదా శత్రువు అనే సాధారణ అర్థాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: יְחָרְפֵנִי
  choice: నన్ను దూషిస్తున్నవాడు
  rationale: חרף లోని అవమానకరమైన మాటలతో నిందించడం లేదా హేళన చేయడం అనే బలాన్ని నిలుపుతుంది.
- source_word: וְאֶשָּׂא
  choice: అలా అయితే నేను దాన్ని భరించగలిగేవాణ్ణి
  rationale: נשׂא ఇక్కడ ‘భరించు/సహించు’ అనే ప్రయోగార్థంలో ఉంది. సందర్భంలోని వాస్తవవిరుద్ధ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘అలా అయితే’ మరియు సామర్థ్యరూపం వాడబడ్డాయి; ‘దాన్ని’ అనేది దూషణను సూచించే సహజంగా పూరించిన కర్మ.
- source_word: מְשַׂנְאִי
  choice: నన్ను ద్వేషించేవాడు
  rationale: కృదంత రూపంలోని వ్యక్తిగత భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: עָלַי
  choice: నాకు విరోధంగా
  rationale: తరువాతి క్రియతో కలిసి స్థలార్థం కన్నా శత్రుత్వపూర్వకమైన ఎదిరింపును సూచిస్తుంది.
- source_word: הִגְדִּיל
  choice: తనను తాను గొప్ప చేసుకున్నవాడు
  rationale: ‘గొప్పగా చేసుకోవడం’ అనే హీబ్రూ ప్రయోగాన్ని సాధ్యమైనంత దగ్గరగా ఉంచుతూ, సందర్భంలోని అహంకారపూర్వక స్వీయోన్నతిని తెలియజేస్తుంది.
- source_word: וְאֶסָּתֵר
  choice: అలా అయితే నేను దాక్కోగలిగేవాణ్ణి
  rationale: నిఫాల్ రూపంలోని తనను తాను దాచుకోవడం అనే భావాన్ని, సమాంతర వాస్తవవిరుద్ధ నిర్మాణంతో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִמֶּנּוּ
  choice: అతని నుండి
  rationale: హీబ్రూ పూర్వప్రత్యయ-సర్వనామ పదబంధాన్ని నేరుగా, సహజంగా అనువదిస్తుంది.
