  yaml_path: translation/ot/psalms/055/016.yaml
  text: As for me[a], I call to God, and Yahweh will save me.
translation:
  language: te
  text: 'నేనైతే దేవునికి మొరపెడతాను;

    యాహ్వే నన్ను రక్షిస్తాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲנִי
  choice: నేనైతే
  rationale: వాక్యారంభంలో ప్రత్యేకంగా వచ్చిన సర్వనామంలోని ఉద్ఘాటనను, సందర్భంలోని వ్యత్యాస భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶל־אֱלֹהִים
  choice: దేవునికి
  rationale: אֶל ప్రార్థన లేదా మొర ఎవరిని ఉద్దేశించి ఉందో సూచిస్తుంది; אֱלֹהִים ఇక్కడ ఏకవచన భావంలో నిజ దేవుణ్ణి సూచిస్తుంది.
- source_word: אֶקְרָא
  choice: మొరపెడతాను
  rationale: קרא యొక్క ప్రాథమిక భావం ‘పిలుచుట’; ఈ ప్రార్థనా సందర్భంలో ‘మొరపెడతాను’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది. అసంపూర్ణ క్రియారూపంలోని వర్తమాన లేదా భవిష్యత్ ఛాయను తెలుగు రూపం సందర్భానుసారం తెరిచి ఉంచుతుంది.
- source_word: וַיהוָה
  choice: యాహ్వే
  rationale: సంయోజకాన్ని తెలుగు కవితా ప్రవాహంలో ప్రత్యేక పదంగా చూపాల్సిన అవసరం లేదు; יְהוָה అనే దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం.
- source_word: יוֹשִׁיעֵנִי
  choice: నన్ను రక్షిస్తాడు
  rationale: ישׁע హిఫిల్ రూపం ‘రక్షించుట, విడిపించుట’ అని అర్థం. ఇక్కడి అసంపూర్ణ క్రియారూపం కీర్తనకర్త యొక్క ముందుచూపుగల నమ్మకాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: హీబ్రూ పాఠంలో నాలుగు అక్షరాల దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా, ఆధునిక పండిత వాడుకకు అనుగుణంగా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలపాఠ భేదాన్ని నిలుపుతుంది.
- issue: రక్షణ క్రియ యొక్క కాలభావం
  choice: నన్ను రక్షిస్తాడు
  alternative: నన్ను రక్షిస్తున్నాడు; నన్ను విడిపిస్తాడు
  rationale: יוֹשִׁיעֵנִי లోని అసంపూర్ణ రూపం సందర్భంలో భవిష్యత్తుపై నమ్మకాన్ని సూచించగలదు. ‘రక్షిస్తాడు’ ఆ విశ్వాసాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; క్రియలో లేని అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కీర్తనా శైలి. మొదటి పాదంలోని ‘నేనైతే’ వ్యత్యాస ఉద్ఘాటనను నిలుపుతుంది; రెండో పాదం ధైర్యవిశ్వాసాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
