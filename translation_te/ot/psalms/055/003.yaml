source:
  edition: WLC
  text: מִ/קּ֤וֹל אוֹיֵ֗ב מִ/פְּנֵ֣י עָקַ֣ת רָשָׁ֑ע כִּי יָמִ֥יטוּ עָלַ֥/י אָ֝֗וֶן וּ/בְ/אַ֥ף יִשְׂטְמֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/003.yaml
  text: Because of the voice of the enemy[a], because of the oppression of the wicked; for they cast trouble upon me[b], and in anger they hate me.
translation:
  language: te
  text: 'శత్రువు స్వరం వల్ల,

    దుష్టుని పీడన వల్ల;

    ఎందుకంటే వారు నా మీద కీడును మోపుతున్నారు[a],

    కోపంతో నన్ను ద్వేషిస్తున్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కీడు’ అని అనువదించిన హీబ్రూ పదానికి ‘బాధ,’ ‘హాని,’ లేదా ‘చెడు’ అనే అర్థాలు కూడా ఉండవచ్చు; అందువల్ల ఈ వాక్యాన్ని ‘వారు నా మీద బాధను పడవేస్తున్నారు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל אוֹיֵב
  choice: శత్రువు స్వరం వల్ల
  rationale: מִן‌ను ఈ విలాప సందర్భంలో కారణార్థకంగా ‘వల్ల’ అని అనువదించాం. קוֹל యొక్క స్పష్టమైన శ్రవణ రూపకాన్ని ‘స్వరం’ నిలుపుతుంది; אוֹיֵב ఏకవచనాన్ని కూడా అలాగే ఉంచాం.
- source_word: מִפְּנֵי עָקַת רָשָׁע
  choice: దుష్టుని పీడన వల్ల
  rationale: מִפְּנֵי ఇక్కడ కారణాన్ని సూచిస్తుంది. עָקָה ఒత్తిడి, బాధ లేదా అణచివేతను సూచించగలదు; శత్రుత్వపూర్వకంగా కలిగించే బాధను సహజమైన తెలుగులో ‘పీడన’గా ఇచ్చాం.
- source_word: יָמִיטוּ עָלַי אָוֶן
  choice: వారు నా మీద కీడును మోపుతున్నారు
  rationale: హిఫిల్ రూపమైన יָמִיטוּ ఏదో ఒకదాన్ని ఒకరిపై పడేలా చేయడం లేదా మోపడం అనే భావాన్ని ఇస్తుంది. אָוֶן‌లోని కీడు/బాధ/దుష్టత్వం అనే అర్థవిస్తృతిని ‘కీడు’ కొంతవరకు నిలుపుతుంది.
- source_word: וּבְאַף יִשְׂטְמוּנִי
  choice: కోపంతో నన్ను ద్వేషిస్తున్నారు
  rationale: אַף ఇక్కడ ‘కోపం’ అనే నానుడి అర్థంలో ఉంది. שׂטם తీవ్రమైన శత్రుత్వం లేదా ద్వేషాన్ని సూచిస్తుంది; సూటిగా, సహజంగా ‘ద్వేషిస్తున్నారు’ అని ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, విలాప కవిత్వానికి తగిన గంభీరతతో నాలుగు చిన్న పాదాలుగా ఇచ్చాం. ‘స్వరం,’ ‘పీడన,’ ‘కీడు’ వంటి సాధారణంగా అర్థమయ్యే పదాలతో మూలంలోని సమాంతర నిర్మాణం, శత్రుత్వ తీవ్రత నిలుపబడ్డాయి.
