  edition: WLC
  text: הַאֲזִ֣ינָ/ה אֱ֭לֹהִים תְּפִלָּתִ֑/י וְ/אַל תִּ֝תְעַלַּ֗ם מִ/תְּחִנָּתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/001.yaml
  text: Give ear[a], O God, to my prayer, and do not hide yourself from my supplication.
translation:
  language: te
  text: 'దేవా, నా ప్రార్థనను ఆలకించు;

    నా వేడుకోలు నుండి నిన్ను నీవు దాచుకోకు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా వేడుకోలును పట్టించుకోకుండా ఉండకు.” హెబ్రీ క్రియ అక్షరార్థంగా తనను తాను దాచుకోవడాన్ని సూచిస్తుంది; ఇక్కడ అది ప్రార్థనను వినడానికి నిరాకరించడం అనే భావాన్ని వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: ఆలకించు
  rationale: אזן క్రియకు శ్రద్ధగా చెవియొగ్గి వినడం అనే భావం ఉంది. ‘ఆలకించు’ ఆ శ్రద్ధాపూర్వక వినికిడిని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవా
  rationale: ఇది ఇశ్రాయేలు దేవునికి నేరుగా చేసిన సంబోధన. హెబ్రీ పాఠంలో ఒడంబడిక నామం లేదు; అందువల్ల సంబోధన రూపమైన ‘దేవా’ సరైనది.
- source_word: תְּפִלָּתִי
  choice: నా ప్రార్థనను
  rationale: תְּפִלָּה అనేది ప్రార్థనకు వాడే సాధారణ పదం. ‘నా ప్రార్థనను’ స్పష్టమైన, సహజమైన సమానార్థక రూపం.
- source_word: וְאַל
  choice: …కు
  rationale: וְ conjunction రెండవ విజ్ఞప్తిని మొదటిదానికి జతచేస్తుంది; కవితా పాద విభజనలో తెలుగులో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండా సమన్వయం సహజంగా వ్యక్తమవుతుంది. אַל నిషేధం ‘మరుగుచేసుకోకు’లో నిలుపబడింది.
- source_word: תִּתְעַלַּם
  choice: నిన్ను నీవు మరుగుచేసుకోకు
  rationale: עלם యొక్క ఆత్మనేపద రూపం తనను తాను దాచుకోవడం లేదా అందుబాటులో లేకుండా చేసుకోవడం అనే రూపకాన్ని కలిగి ఉంది. ‘మరుగుచేసుకోకు’ ఆ సంబంధాత్మక రూపకాన్ని ‘పట్టించుకోకు’ వంటి వ్యాఖ్యానాత్మక అనువాదం కంటే నేరుగా కాపాడుతుంది.
- source_word: מִתְּחִנָּתִי
  choice: నా వేడుకోలుకు
  rationale: תְּחִנָּה అనుగ్రహం లేదా కరుణ కోసం చేసే ఆర్తమైన విజ్ఞప్తిని సూచిస్తుంది. ‘వేడుకోలు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి ఆ ఆర్తిని తెలియజేస్తుంది; హెబ్రీ מִן సూచించే సంబంధాన్ని తెలుగులో సహజంగా దత్తివిభక్తితో వ్యక్తం చేశాం.
