  yaml_path: translation/ot/psalms/055/007.yaml
  text: Look[a], I would wander far away; I would lodge in the wilderness[c][b]. Selah
translation:
  language: te
  text: ఇదిగో, నేను దూరంగా వెళ్లి సంచరించేవాణ్ణి[a]; అరణ్యంలో రాత్రి బస చేసేవాణ్ణి[b]. సెలాహ్[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేను చాలా దూరం పారిపోయేవాణ్ణి.’ హీబ్రూలో దూరమవడాన్ని తెలిపే క్రియతో సంచరించడం లేదా పారిపోవడం అనే భావమున్న ధాతువు నుండి వచ్చిన క్రియారూపం కలిసివుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అరణ్యంలో రాత్రి గడిపేవాణ్ణి.’
    reason: lexical_alternative
  - marker: c
    text: ‘సెలాహ్’ అనే పదాన్ని సంప్రదాయంగా అనువదించకుండా ఉంచుతారు. దాని ఖచ్చితమైన అర్థం తెలియదు; అది సంగీత లేదా ఆరాధనా సూచన కావచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: తరువాతి మాటపై తక్షణ శ్రద్ధను ఆకర్షించే హీబ్రూ ప్రయోగాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אַרְחִיק נְדֹד
  choice: నేను దూరంగా సంచరిస్తూ వెళ్లిపోయేవాణ్ణి
  rationale: רחק యొక్క దూరమవడం అనే భావాన్నీ, נדד యొక్క సంచారం లేదా పారిపోవడం అనే చలన భావాన్నీ కలిపి చూపుతుంది; మూలంలోని అస్పష్టతను పూర్తిగా ‘పారిపోవడం’గా పరిమితం చేయదు.
- source_word: אָלִין
  choice: రాత్రి బస చేసేవాణ్ణి
  rationale: לון/לין సాధారణంగా రాత్రి గడపడం లేదా బస చేయడం అని సూచిస్తుంది. తెలుగులో ‘రాత్రి బస చేయడం’ ఆ నిర్దిష్ట భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: מִדְבָּר కేవలం ఇసుక ఎడారినే కాక జనావాసం లేని అడవి లేదా బీడు ప్రదేశాన్నీ సూచించగలదు; ‘అరణ్యం’ విస్తృత భావాన్ని ఇస్తుంది.
- source_word: סֶלָה
  choice: సెలాహ్
  rationale: ఈ పదం యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం కాబట్టి ఊహాత్మకంగా అనువదించకుండా లిప్యంతరీకరించబడింది.
