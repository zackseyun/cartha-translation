    issue: The phrase “సంచరిస్తూ వెళ్లిపోయేవాణ్ణి” can imply complete departure rather than movement away for wandering or flight.
    rationale: אַרְחִיק with נְדֹד expresses going far away in restless wandering/flight. Recasting it as “దూరంగా వెళ్లి సంచరించేవాణ్ణి” more transparently represents both components.
  - severity: low
    issue: Footnote b's alternative “అరణ్యంలో ఉండిపోయేవాణ్ణి” is less precise than the source's overnight sense.
    rationale: אָלִין specifically concerns lodging or spending the night. The alternative should preserve that temporal element.
