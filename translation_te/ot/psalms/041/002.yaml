source:
  edition: WLC
  text: יְהוָ֤ה יִשְׁמְרֵ֣/הוּ וִֽ֭/יחַיֵּ/הוּ יאשר בָּ/אָ֑רֶץ וְ/אַֽל תִּ֝תְּנֵ֗/הוּ בְּ/נֶ֣פֶשׁ אֹיְבָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/002.yaml
  text: Yahweh will keep him and preserve his life[a]; he will be blessed in the land[d][c][b], and may you not give him over to the desire of his enemies.
translation:
  language: te
  text: యాహ్వే అతన్ని కాపాడి సజీవంగా ఉంచుతాడు[a]; దేశంలో అతడు ధన్యుడని పిలువబడతాడు[b]. అతని శత్రువుల కోరికకు[c] అతన్ని అప్పగించవద్దు[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని ప్రాణాన్ని నిలుపుతాడు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దేశంలో అతడు ధన్యుడవుతాడు.” హీబ్రూ క్రియకు ‘ధన్యుడని పిలువబడడం’ లేదా మరింత సాధారణంగా ‘ధన్యుడవడం’ అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: 'హీబ్రూ: “అతని శత్రువుల కోరికకు”; దీనిని “అతని శత్రువుల చిత్తానికి” అని కూడా అనువదించవచ్చు.'
    reason: lexical_alternative
  - marker: d
    text: ఇక్కడ వాక్యం యాహ్వే గురించిన ప్రకటన నుంచి యాహ్వేను నేరుగా ఉద్దేశించిన ప్రార్థనకు మారుతుంది.
    reason: discourse_shift
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: יִשְׁמְרֵהוּ
  choice: అతన్ని కాపాడి
  rationale: שׁמר అనే క్రియలోని కాపాడడం, సంరక్షించడం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; తరువాతి క్రియతో కలిసి ఒకే కర్తకు సంబంధించిన భవిష్యత్ కార్యంగా చదవబడుతుంది.
- source_word: וִיחַיֵּהוּ
  choice: సజీవంగా ఉంచుతాడు
  rationale: חיה పియేల్ రూపం ఇక్కడ ‘బతికించి ఉంచడం/ప్రాణాన్ని నిలపడం’ అనే భావాన్ని ఇస్తుంది. ‘సజీవంగా ఉంచుతాడు’ మూలానికి సమీపంగా ఉండి తెలుగులో స్పష్టంగా ఉంది.
- source_word: יְאֻשַּׁר / יאשר
  choice: ధన్యుడవుతాడు
  rationale: ఈ రూపం ‘ధన్యుడిగా ఉండడం’ లేదా ‘ధన్యుడని పిలువబడడం’ అనే భావాలకు వీలు ఇస్తుంది. ప్రధాన పాఠంలో సహజమైన ‘ధన్యుడవుతాడు’ను ఉంచి, మరింత ప్రకటనాత్మకమైన భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: בָּאָרֶץ
  choice: దేశంలో
  rationale: אֶרֶץ ఇక్కడ భూమి, దేశం, లేదా నివసించే ప్రాంతాన్ని సూచించగలదు. సందర్భంలో ‘దేశంలో’ సహజంగా ఉండి, ప్రపంచమంతటినీ తప్పనిసరిగా సూచించదు.
- source_word: וְאַל־תִּתְּנֵהוּ
  choice: అతన్ని అప్పగించవద్దు
  rationale: אַל తో కూడిన రెండవ పురుష ఏకవచన క్రియ నేరుగా యాహ్వేను ఉద్దేశించిన నిషేధాత్మక ప్రార్థన. ‘అప్పగించవద్దు’ ఆ సంబోధనా మార్పును, ప్రార్థనా బలాన్ని నిలుపుతుంది.
- source_word: בְּנֶפֶשׁ
  choice: కోరికకు
  rationale: נֶפֶשׁ ఈ ప్రయోగంలో ‘ఆత్మ’ కంటే కోరిక, అభిలాష, లేదా చిత్తం అనే భావాన్ని ఇస్తుంది.
- source_word: אֹיְבָיו
  choice: అతని శత్రువుల
  rationale: אויב యొక్క సాధారణ, స్పష్టమైన తెలుగు సమానార్థకం ‘శత్రువులు’.
theological_decisions:
- issue: మూడవ పురుష ప్రకటన నుంచి దేవునికి చేసే రెండవ పురుష ప్రార్థనకు మార్పు
  choice: మొదటి రెండు వాక్యభాగాలను యాహ్వే గురించి నమ్మకపూర్వక ప్రకటనగా, చివరి భాగాన్ని ఆయనను నేరుగా ఉద్దేశించిన ‘అప్పగించవద్దు’ అనే ప్రార్థనగా అనువదించాం.
  alternative: వచనమంతటినీ మూడవ పురుషంలో ‘ఆయన అతన్ని అప్పగించడు’ అని సాఫీ చేయడం.
  rationale: תִּתְּנֵהוּ రెండవ పురుష ఏకవచన రూపం. మూలంలోని ఆకస్మిక సంబోధనా మార్పును తొలగించకుండా ఉంచడం అవసరం.
- issue: יְאֻשַּׁר యొక్క ఆశీర్వాద భావం
  choice: ప్రధాన పాఠంలో ‘ధన్యుడవుతాడు’ అని అనువదించాం.
  alternative: ‘ధన్యుడని పిలువబడతాడు’ అని అనువదించడం.
  rationale: హీబ్రూ రూపం ధన్యస్థితిని లేదా ఇతరులు ధన్యుడని ప్రకటించడాన్ని సూచించగలదు. ప్రధాన పాఠం సహజంగా ఉండేలా చేసి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం; దానికి నిర్దిష్ట సిద్ధాంతార్థాన్ని జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని అనుసరించాం. ‘యాహ్వే’ అనే వ్యక్తినామాన్ని నిలిపాం. చివరి వాక్యంలో రెండవ పురుష ప్రార్థన స్పష్టంగా కనిపించేలా చేశాం; అనవసరమైన ప్రాచీన క్రియారూపాలను ఉపయోగించలేదు.
