id: PSA.41.10
reference: Psalms 41:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַתָּ֤ה יְהוָ֗ה חָנֵּ֥/נִי וַ/הֲקִימֵ֑/נִי וַֽ/אֲשַׁלְּמָ֥ה לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/010.yaml
  text: But you[a], O Yahweh, be gracious to me and raise me up, that I may repay them.
translation:
  language: te
  text: కాని నీవు, యాహ్వే, నాపై కృప చూపి నన్ను లేవనెత్తు; నేను వారికి ప్రతిఫలం చెల్లించేలా.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను వారికి ప్రతిఫలం చెల్లిస్తాను.” హీబ్రూ వావ్‌తో కూడిన కోహోర్టేటివ్‌ను ఈ వినతుల ఉద్దేశం లేదా ఫలితంగా, లేక వాటి తరువాత వ్యక్తమయ్యే సంకల్పంగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: అయితే ... నీవు
  rationale: స్వతంత్ర సర్వనామంతో కూడిన సంధి, ముందుగా చెప్పిన శత్రువులు మరియు ద్రోహి మిత్రునికి భిన్నంగా యెహోవాను ఉద్దేశించే వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణతో వ్యక్తిగత నామంగా ఉంచింది.
- source_word: חָנֵּנִי
  choice: నాపై కృప చూపి
  rationale: חנן అనే ధాతువు కృపాపూర్వక అనుగ్రహాన్ని వేడుకోవడాన్ని సూచిస్తుంది; ఈ ఎంపిక దానిని కేవలం జాలిగా పరిమితం చేయదు.
- source_word: וַהֲקִימֵנִי
  choice: నన్ను లేవనెత్తు
  rationale: קום హిఫీల్ రూపంలోని ‘లేచేలా చేయు/నిలబెట్టు’ అనే సాక్షాత్ రూపకాన్ని నిలుపుతుంది; అనారోగ్యం లేదా అణచివేత నుండి పునరుద్ధరణ భావానికీ అవకాశం ఇస్తుంది.
- source_word: וַאֲשַׁלְּמָה
  choice: అప్పుడు నేను ... ప్రతిఫలం చెల్లిస్తాను
  rationale: שלם పియేల్ రూపం తిరిగి చెల్లించడం లేదా ప్రతిఫలం ఇవ్వడం అనే భావం కలిగి ఉంది. వావ్‌తో కూడిన కోహోర్టేటివ్‌ను ఇక్కడ వినతుల తరువాతి ఫలితం/సంకల్పంగా సహజ తెలుగులో వ్యక్తం చేసింది; ఉద్దేశార్థం కూడా సాధ్యమని పాదటిప్పణి తెలిపింది.
- source_word: לָהֶם
  choice: వారికి
  rationale: ל ఉపసర్గ ప్రతిఫలం అందుకునే పరోక్ష కర్మను సూచిస్తుంది; ‘వారికి ప్రతిఫలం చెల్లిస్తాను’ సహజమైన తెలుగు నిర్మాణం.
theological_decisions:
- issue: కీర్తనకర్త కోరుతున్న ప్రతిఫలాన్ని శాపాత్మక భావం తగ్గేలా మృదువుగా అనువదించాలా?
  choice: వారికి ప్రతిఫలం చెల్లిస్తాను
  alternative: వారికి తగినట్లు వ్యవహరిస్తాను; వారి విషయంలో నాకు న్యాయం చేస్తాను
  rationale: שלם నేరుగా తిరిగి చెల్లించడం లేదా ప్రతిఫలం ఇవ్వడాన్ని సూచిస్తుంది. దానిని మృదువుగా మార్చడం మూలపాఠంలోని న్యాయాత్మక ఉద్రిక్తతను తగ్గిస్తుంది. అయితే ప్రతిఫలం ఏ రూపంలో ఉంటుందో వాక్యం నిర్దిష్టంగా చెప్పదు.
- issue: కోహోర్టేటివ్‌ను ఉద్దేశంగా తీసుకోవాలా, తరువాతి సంకల్పంగా తీసుకోవాలా?
  choice: 'ఫలితం/సంకల్పం: ‘అప్పుడు నేను ... చెల్లిస్తాను’'
  alternative: 'ఉద్దేశం: ‘నేను ... చెల్లించేలా’'
  rationale: వావ్‌తో కూడిన కోహోర్టేటివ్ ఈ సందర్భంలో వినతుల తరువాతి ఉద్దేశం, ఫలితం లేదా సంకల్పాన్ని సూచించగలదు. ప్రధాన పాఠంలో సహజమైన ఫలితం/సంకల్ప భావాన్ని తీసుకుని, నిజమైన వ్యాకరణ సందిగ్ధతను పాదటిప్పణిలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవభరితమైన ప్రార్థనా శైలిని వాడింది. ‘లేవనెత్తు’ అనే సాక్షాత్ రూపకాన్ని, ‘ప్రతిఫలం చెల్లిస్తాను’ అనే న్యాయాత్మక భావాన్ని మృదువుచేయకుండా నిలిపింది.
