id: PSA.41.13
reference: Psalms 41:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בָּ֘ר֤וּךְ יְהוָ֨ה אֱלֹ֘הֵ֤י יִשְׂרָאֵ֗ל מֵֽ֭/הָ/עוֹלָם וְ/עַ֥ד הָ/עוֹלָ֗ם אָ֘מֵ֥ן וְ/אָמֵֽן׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/013.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. Amen and Amen.
translation:
  language: te
  text: ఇశ్రాయేలు దేవుడైన యహ్వే అనాదికాలము నుండి అనంతకాలము వరకు[a] స్తుతింపబడుగాక! ఆమేన్, ఆమేన్.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిత్యత్వము నుండి నిత్యత్వము వరకు.” హెబ్రీ వ్యక్తీకరణ హద్దులేని కాలవ్యాప్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: స్తుతింపబడుగాక
  rationale: ఇది స్తోత్రాంత ఆశీర్వాద సూత్రంలో వాడిన నిష్క్రియార్థక కృదంతం. అక్షరార్థమైన ‘ధన్యుడు’ కంటే ‘స్తుతింపబడుగాక’ తెలుగులో సహజంగా ఉండి, ఆరాధనాత్మక బలాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో సాధారణమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: ‘ఇశ్రాయేలు దేవుడు’ అనే సంబంధాన్ని తెలుగులో వాక్యంతో సహజంగా కలిపే విశేషణ నిర్మాణంగా ఇచ్చాం.
- source_word: מֵהָעוֹלָם וְעַד הָעוֹלָם
  choice: నిత్యకాలం నుండి నిత్యకాలం వరకు
  rationale: రెండు వైపులా హద్దులేని కాలవ్యాప్తిని సూచించే ‘నుండి … వరకు’ నిర్మాణాన్ని నిలుపుతూ, గంభీరమైన తెలుగులో అనువదించాం.
- source_word: אָמֵן וְאָמֵן
  choice: ఆమేన్, ఆమేన్
  rationale: సభాపరమైన బలమైన సమ్మతిని తెలిపే పునరుక్తిని కుదించకుండా యథాతథంగా నిలిపాం; తెలుగులో సహజ విరామం కోసం కామా వాడాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: בָּרוּךְ యొక్క స్తోత్రార్థక భావం
  choice: స్తుతింపబడుగాక
  alternative: ధన్యుడు
  rationale: హెబ్రీ రూపం వ్యాకరణపరంగా కృదంతమైనప్పటికీ, ఇక్కడ అది స్తోత్ర సూత్రంగా పనిచేస్తుంది. తెలుగు ఆరాధనా భాషలో ‘స్తుతింపబడుగాక’ ఆ కార్యాన్ని సహజంగా వ్యక్తం చేస్తుంది; దేవుడు ఆశీర్వాదం పొందాల్సినవాడనే అపార్థాన్ని కూడా నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామూహిక ఆరాధనకు తగిన గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలిని వాడాం. కీర్తన ముగింపులోని స్తోత్ర స్వరాన్నీ, రెండుసార్లు పలికే ‘ఆమేన్’ బలాన్నీ నిలిపాం.
