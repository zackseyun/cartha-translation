id: PSA.41.1
reference: Psalms 41:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַ֭שְׁרֵי מַשְׂכִּ֣יל אֶל דָּ֑ל בְּ/י֥וֹם רָ֝עָ֗ה יְֽמַלְּטֵ֥/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/001.yaml
  text: Blessed is the one who considers the poor[c][b][a]; in the day of trouble Yahweh will deliver him.
translation:
  language: te
  text: దీనుని[b] పట్ల వివేకంతో వ్యవహరించేవాడు[a] ధన్యుడు! ఆపద రోజున[c] యహ్వే అతణ్ణి విడిపిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దీనుని గురించి శ్రద్ధగా ఆలోచించేవాడు.’ హెబ్రీ క్రియ వివేకంతో గమనించడం లేదా అతని పట్ల జ్ఞానయుక్తంగా వ్యవహరించడం అనే రెండు భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పేదవాని,’ ‘బలహీనుని,’ ‘అవసరంలో ఉన్నవాని.’
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా ‘చెడు రోజున’; ఇక్కడ ‘చెడు’ అనేది నైతిక దుష్టత్వాన్ని కాక ఆపదను లేదా కష్టాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: ధన్యుడు
  rationale: జ్ఞానసాహిత్యంలోని ధన్యతా ప్రకటనకు తగిన గంభీరతను నిలుపుతూ, కేవలం భావోద్వేగపరమైన ‘సంతోషవంతుడు’ అనే అర్థానికి పరిమితం కాకుండా ఉంటుంది.
- source_word: מַשְׂכִּיל אֶל
  choice: పట్ల వివేకంతో వ్యవహరించేవాడు
  rationale: హిఫిల్ రూపం వివేకంతో గమనించడం, శ్రద్ధ చూపడం లేదా జ్ఞానయుక్తంగా ప్రవర్తించడం అనే భావాలను కలిగి ఉంది. ‘పట్ల’ అనేది אֶל సూచించే దిశాభావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: דָּל
  choice: దీనుని
  rationale: ఈ పదం పేదరికంతో పాటు బలహీనత, నిస్సహాయత, సామాజిక దుర్బలతను కూడా సూచించగలదు. ‘దీనుడు’ ఈ విస్తృత భావపరిధిని తెలుగులో సంక్షిప్తంగా అందిస్తుంది.
- source_word: בְּיוֹם רָעָה
  choice: ఆపద రోజున
  rationale: ఇక్కడ רָעָה నైతిక చెడును కాక విపత్తు లేదా కష్టకాలాన్ని సూచిస్తుంది. ‘ఆపద రోజు’ మూలంలోని ‘రోజు’ రూపకాన్ని నిలుపుతుంది.
- source_word: יְמַלְּטֵהוּ
  choice: అతణ్ణి విడిపిస్తాడు
  rationale: מלט పియేల్ రూపం ప్రమాదం లేదా కష్టం నుంచి రక్షించి తప్పించడం అనే భావాన్ని ఇస్తుంది. ‘విడిపిస్తాడు’ సహజమైనదిగా ఉండి వాగ్దాన బలాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హెబ్రీ చతురక్షర నామానికి తెలుగు లిప్యంతరీకరణను ఉపయోగించింది.
theological_decisions:
- issue: వాగ్దానంలోని ఏకవచన పుంలింగ సూచన
  choice: ‘వ్యవహరించేవాడు … అతణ్ణి’ అనే ప్రతినిధి ఏకవచనాన్ని నిలుపడం
  alternative: ‘వ్యవహరించేవారు … వారిని’ అని బహువచనం చేయడం
  rationale: హెబ్రీ పాఠంలో వ్యక్తి ఏకవచనంలోను, కర్మ ప్రత్యయం పుంలింగ ఏకవచనంలోను ఉన్నాయి. తెలుగు అనువాదం వాటిని బహువచనంగా మార్చకుండా మూలరూపాన్ని నిలుపుతుంది.
- issue: ధన్యతా ప్రకటనలోని వాగ్దాన స్వభావం
  choice: విడిపిస్తాడనే ప్రకటనను వివరణాత్మక పరిమితులు చేర్చకుండా నేరుగా అనువదించడం
  alternative: దీనిని కేవలం సాధారణ సూత్రంగా మృదువుచేయడం లేదా ప్రతి సందర్భానికీ యాంత్రిక హామీగా విస్తరించడం
  rationale: కీర్తనలోని ధన్యతా, జ్ఞానసాహిత్య స్వరాన్ని అలాగే ఉంచి, సంపద సిద్ధాంతాన్నిగానీ వ్యాఖ్యాత్మక మినహాయింపులనుగానీ పాఠంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, సామాన్య పాఠకులకు అర్థమయ్యేలా, కీర్తనకు తగిన గంభీరతతో రూపొందించబడింది. ‘దీనుడు’ మరియు ‘వివేకంతో వ్యవహరించడం’ అనే పదబంధాలు మూలంలోని సామాజిక దుర్బలతను, ఆలోచనతో కూడిన కార్యశీల శ్రద్ధను రెండింటినీ నిలుపుతాయి.
