  yaml_path: translation/ot/psalms/041/009.yaml
  text: Even my close friend[a], in whom I trusted, who ate my bread[d][c][b], has lifted up his heel against me.
translation:
  language: te
  text: నేను నమ్మిన నా సన్నిహిత మిత్రుడు కూడా—నా రొట్టె తిన్నవాడు—నాకు విరోధంగా తన మడమను ఎత్తాడు.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘నా సమాధానపు మనిషి’; అంటే నాతో శాంతిగా ఉన్న సన్నిహితుడు లేదా నమ్మకమైన మిత్రుడు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా రొట్టె పంచుకున్నవాడు.’ హెబ్రీలో అక్షరార్థంగా, ‘నా రొట్టె తిన్నవాడు’; ఇది భోజన సహవాసాన్నీ నమ్మకాన్నీ సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘నాకు విరోధంగా మడమను గొప్పదిగా చేశాడు.’ ఇది ద్రోహపూరితమైన లేదా శత్రుత్వ చర్యను సూచించే హెబ్రీ నుడికారం.
    reason: lexical_alternative
  - marker: d
    text: యేసుకు యూదా చేసిన ద్రోహానికి సంబంధించి యోహాను 13:18లో ఈ వాక్యం ఉదహరించబడింది.
    reason: cross_reference
lexical_decisions:
- source_word: גַּם
  choice: వాడే
  rationale: సన్నిహితుడు సైతం ద్రోహం చేశాడనే ఆశ్చర్యకరమైన, బలమైన చేర్పును సహజమైన తెలుగు వాక్యనిర్మాణంలో ‘వాడే’ తెలియజేస్తుంది.
- source_word: אִישׁ שְׁלוֹמִי
  choice: నా ప్రాణస్నేహితుడు
  rationale: అక్షరార్థంగా ‘నా సమాధానపు మనిషి’; నాతో శాంతిగా ఉండి, నమ్మకమైన సన్నిహితుడైన వ్యక్తి అనే నుడికార భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר בָּטַחְתִּי בוֹ
  choice: నేను నమ్మిన
  rationale: ఒక వ్యక్తిపై ఉంచిన విశ్వాసాన్ని తెలిపే בָּטַח בְּ భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: אוֹכֵל לַחְמִי
  choice: నా రొట్టె తిన్నవాడు
  rationale: భోజన సహవాసం, ఆదరణ, నమ్మకం అనే నేపథ్యాన్ని సూచించే స్పష్టమైన హెబ్రీయ చిత్రాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: הִגְדִּיל עָלַי עָקֵב
  choice: నాకు విరోధంగా తన మడమ ఎత్తాడు
  rationale: అక్షరార్థ రూపకాన్ని నిలుపుతూ, עָלַי యొక్క ప్రతికూల భావాన్ని ‘విరోధంగా’ స్పష్టం చేస్తుంది; ద్రోహపూరిత లేదా శత్రుత్వ చర్య అనే నుడికారార్థాన్ని పాదటిప్పణి వివరిస్తుంది.
theological_decisions:
- issue: యోహాను 13:18లో ఈ వాక్యానికి ఉన్న క్రీస్తు సంబంధ అన్వయం
  choice: ప్రధాన పాఠాన్ని కీర్తనకర్త తన నమ్మకస్థుని చేత పొందిన ద్రోహం అనే తక్షణ సందర్భంలో అనువదించడం
  alternative: కొత్త నిబంధనలోని యూదా ద్రోహాన్ని ప్రధాన పాఠంలోనే స్పష్టంగా సూచించేలా అనువదించడం
  rationale: హెబ్రీ పాఠపు మొదటి సందర్భాన్ని కాపాడుతూ, తరువాతి గ్రంథాంతర అన్వయాన్ని పాదటిప్పణిలో తెలియజేస్తుంది; దీనివల్ల మూలపాఠంలో లేని ప్రత్యేక క్రీస్తు సంబంధ వ్యాఖ్యానం ప్రధాన వాక్యంలోకి రాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘నా రొట్టె తిన్నవాడు,’ ‘తన మడమ ఎత్తాడు’ అనే స్పష్టమైన మూలభాషా చిత్రాలను నిలిపి, వాటి నుడికార భావాలను పాదటిప్పణుల్లో వివరించాం.
