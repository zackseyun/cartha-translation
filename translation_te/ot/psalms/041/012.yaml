source:
  edition: WLC
  text: וַ/אֲנִ֗י בְּ֭/תֻמִּ/י תָּמַ֣כְתָּ בִּ֑/י וַ/תַּצִּיבֵ֖/נִי לְ/פָנֶ֣י/ךָ לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/012.yaml
  text: But as for me[a], in my integrity you have upheld me[b], and you have set me before your face forever.
translation:
  language: te
  text: అయితే నా విషయానికి వస్తే, నా యథార్థతలో[a] నీవు నన్ను నిలబెట్టావు; నన్ను ఎప్పటికీ నీ సన్నిధిలో[b] నిలిపావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా నిర్దోషమైన నడవడిలో”; లేదా “నా యథార్థతను బట్టి.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “నీ ముఖం ఎదుట”; అంటే “నీ సన్నిధిలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: అయితే నేను
  rationale: స్వతంత్ర సర్వనామంతో కూడిన సంధి పూర్వ సందర్భానికి భిన్నమైన, వ్యతిరేక మలుపును సూచిస్తుంది.
- source_word: בְּתֻמִּי
  choice: నా యథార్థతలో ఉండగా
  rationale: תֻּם సంపూర్ణ నిర్దోషిత్వం కంటే నైతిక నిష్కపటత, సమగ్రత, యథార్థతను సూచిస్తుంది. בְּ యొక్క సందర్భార్థాన్ని కారణంగా ఖచ్చితంగా నిర్ణయించకుండా పరిస్థితిగా నిలుపుతుంది.
- source_word: תָּמַכְתָּ בִּי
  choice: నీవు నన్ను ఆదరించావు
  rationale: תמך בְּ ఒకరిని పట్టుకొని నిలబెట్టడం లేదా మద్దతివ్వడం అనే భావాన్ని ఇస్తుంది; 'ఆదరించావు' తెలుగు కీర్తనల శైలిలో సహజంగా ఆ నిలబెట్టే సహాయాన్ని తెలియజేస్తుంది.
- source_word: וַתַּצִּיבֵנִי
  choice: నన్ను ... నిలిపావు
  rationale: నצב హిఫీల్ రూపం నిలబెట్టడం, ఉంచడం, స్థిరపరచడం అనే భావం కలిగి ఉంది; 'నిలిపావు' ప్రత్యక్షమైన సహజ అనువాదం.
- source_word: לְפָנֶיךָ
  choice: నీ సన్నిధిలో
  rationale: అక్షరార్థంగా 'నీ ముఖం ఎదుట'; హీబ్రూ ప్రయోగంలో ఇది ఒకరి సన్నిధిని సూచిస్తుంది. ప్రధాన పాఠంలో సహజ తెలుగు ఇచ్చి, అక్షర రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: לְעוֹלָם
  choice: ఎప్పటికీ
  rationale: עוֹלָם ఇక్కడ నిరంతరమైన, శాశ్వత కాలవ్యాప్తిని సూచిస్తుంది; 'ఎప్పటికీ' ఆధునిక తెలుగులో సహజం.
theological_decisions:
- issue: కీర్తనకర్త చెప్పుకొనే תֻּם యొక్క భావం
  choice: యథార్థత లేదా నిష్కపటమైన నడవడి; సంపూర్ణ పాపరాహిత్యం కాదు
  alternative: సంపూర్ణ నిర్దోషిత్వం లేదా నైతిక పరిపూర్ణత వల్ల దేవుని అనుగ్రహాన్ని సంపాదించడం
  rationale: హీబ్రూ పదం వ్యక్తి నడవడిలోని సమగ్రతను సూచించగలదు. 'యథార్థత' అనే పదం పాఠంలోని నైతిక వాదనను నిలుపుతూ, పాపరాహిత్యమో పుణ్యఫల సిద్ధాంతమో చేర్చదు.
- issue: בְּתֻמִּי లోని בְּ సంబంధం
  choice: ప్రధాన పాఠంలో పరిస్థితి/స్థితి భావాన్ని నిలుపడం
  alternative: '''నా యథార్థత కారణంగా'' అని స్పష్టమైన కారణార్థం ఇవ్వడం'
  rationale: ఉపసర్గ కారణార్థాన్ని అనుమతించినా దానికే పరిమితం కాదు. మూలంలోని సందిగ్ధతను పాదసూచికలో ప్రత్యామ్నాయంతో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కీర్తనా శైలిని పాటించాం. 'యథార్థత' నైతిక సమగ్రతను తెలియజేస్తూ సంపూర్ణ పాపరాహిత్యాన్ని సూచించదు. రెండు పాదసూచిక సూచికలూ ప్రధాన పాఠంలో చేర్చబడ్డాయి.
