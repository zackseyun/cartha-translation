source:
  edition: WLC
  text: אוֹיְבַ֗/י יֹאמְר֣וּ רַ֣ע לִ֑/י מָתַ֥י יָ֝מ֗וּת וְ/אָבַ֥ד שְׁמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/005.yaml
  text: 'My enemies say evil against me: “When will he die and his name perish?”[a][b]'
translation:
  language: te
  text: 'నా శత్రువులు నాకు విరోధంగా చెడు మాటలు అంటారు:


    “ఇతడు ఎప్పుడు చనిపోతాడు, ఇతని పేరు నశిస్తుంది?” అంటారు.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాకు హాని కలిగించే మాటలు అంటారు.” హీబ్రూ పదబంధం అక్షరార్థంగా కీర్తనకర్తకు వ్యతిరేకంగా లేదా అతని మీద ‘చెడు’ మాట్లాడడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “ఇతని పేరు నశించడం” అంటే కేవలం పలికే పేరు లేకపోవడం మాత్రమే కాక, అతని కీర్తి లేదా జ్ఞాపకం చెరిగిపోవడం కూడా కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹיְבַי
  choice: నా శత్రువులు
  rationale: బహువచన నామవాచకానికి ప్రథమ పురుష ఏకవచన ప్రత్యయం ఉంది; ఆధునిక తెలుగులో సహజంగా, విరోధ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: יֹאמְרוּ
  choice: మాట్లాడుతూ ... అంటారు
  rationale: కావ్య సందర్భంలోని అసంపూర్ణ క్రియ వర్తమాన లేదా సాధారణంగా కొనసాగే చర్యను సూచించగలదు; తెలుగులో ఈ నిర్మాణం శత్రువుల దుష్టమైన మాటలతో పాటు ప్రత్యక్ష వాక్యాన్ని సహజంగా కలుపుతుంది.
- source_word: רַע לִי
  choice: నా గురించి చెడుగా
  rationale: రַע అనే పదంలోని ‘చెడు’ భావాన్ని నిలుపుతూ, לִי సూచించే కీర్తిహానికరమైన దిశను ఈ సందర్భంలో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; హాని కలిగించే మాటలు అనే భావం కూడా సాధ్యమే.
- source_word: מָתַי
  choice: ఎప్పుడు
  rationale: మూలంలోని ప్రశ్నార్థక క్రియావిశేషణానికి నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: יָמוּת
  choice: చనిపోతాడు
  rationale: ‘ఎప్పుడు’ తరువాత వచ్చే అసంపూర్ణ క్రియను భవిష్యత్ ప్రశ్నగా అందిస్తుంది; దీనిని ఆశీర్వాదార్థక లేదా ఆజ్ఞార్థక రూపంగా అతిగా నిర్ధారించదు.
- source_word: וְאָבַד שְׁמוֹ
  choice: ఇతని పేరు ఎప్పుడు అంతరించిపోతుంది
  rationale: మూలంలోని ‘పేరు’ను నిలుపుతూ אָבַד యొక్క నశించడం/కనుమరుగవడం భావాన్ని వ్యక్తం చేస్తుంది. తెలుగులో సమాంతర ప్రశ్నగా ‘ఎప్పుడు’ను పునరుక్తి చేయడం భావాన్ని మార్చకుండా స్పష్టతనిస్తుంది.
theological_decisions:
- issue: ‘పేరు అంతరించిపోవడం’ యొక్క పరిధి
  choice: ప్రధాన పాఠంలో ‘పేరు’ అనే రూపకాన్ని యథాతథంగా నిలిపాం.
  alternative: ‘జ్ఞాపకం చెరిగిపోవడం’ లేదా ‘కీర్తి నశించడం’ అని స్పష్టీకరించడం.
  rationale: హీబ్రూ שֵׁם పేరు మాత్రమే కాక కీర్తి లేదా జ్ఞాపకాన్ని కూడా సూచించవచ్చు. ప్రధాన పాఠంలో ఆ బహుఅర్థతను కాపాడి, వివరణను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కవితా వచనం. ‘నా గురించి చెడుగా’ సాధారణ పాఠకులకు స్పష్టంగా ఉండగా, మూలంలోని నైతిక ‘చెడు’ భావాన్ని నిలుపుతుంది. ప్రత్యక్ష వాక్యంలో ‘ఇతడు/ఇతని’ శత్రువుల దూరీకరణ భావాన్ని సహజంగా తెలియజేస్తుంది.
