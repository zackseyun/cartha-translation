source:
  edition: WLC
  text: בְּ/זֹ֣את יָ֭דַעְתִּי כִּֽי חָפַ֣צְתָּ בִּ֑/י כִּ֤י לֹֽא יָרִ֖יעַ אֹיְבִ֣/י עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/011.yaml
  text: 'By this I know that you delight in me: because my enemy does not triumph over me[a][b].'
translation:
  language: te
  text: దీనివల్ల నీవు నాపట్ల సంతోషంగా ఉన్నావని[a] నాకు తెలుసు; ఎందుకంటే నా శత్రువు నాపై విజయనాదం చేయడం లేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీవు నాయందు ఆనందిస్తున్నావు,’ ‘నీవు నాపట్ల ప్రసన్నంగా ఉన్నావు,’ లేదా ‘నీవు నన్ను అనుగ్రహిస్తున్నావు.’ హీబ్రూ క్రియ ఒకరిలో ఆనందించడం లేదా వారిపట్ల ప్రసన్నత కలిగి ఉండడం అనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా శత్రువు నాపై జయోత్సాహంతో కేక వేయడం లేదు,’ లేదా భావానువాదంగా, ‘నా శత్రువు నాపై విజయం సాధించడం లేదు.’ హీబ్రూ క్రియ అక్షరార్థంగా నాదం చేయడాన్ని, ఇక్కడ బహుశా విజయనాదాన్ని, సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֹאת
  choice: దీనివల్ల
  rationale: בְּ ఉపసర్గతో కూడిన זֹאת, కీర్తనకర్త తనకు తెలిసిన విషయానికి ఆధారాన్ని లేదా నిదర్శనాన్ని సూచిస్తుంది. ‘దీనివల్ల’ ఆ సాక్ష్యార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יָדַעְתִּי
  choice: నాకు తెలుసు
  rationale: రూపపరంగా ఇది పరిపూర్ణ క్రియ అయినా, సందర్భంలో ప్రస్తుతం తనకు ఉన్న నిశ్చయజ్ఞానాన్ని సూచిస్తుంది. అందువల్ల తెలుగు వర్తమాన ప్రయోగం సహజంగా ఉంటుంది.
- source_word: חָפַצְתָּ בִּי
  choice: నీవు నన్ను చూసి ఆనందిస్తున్నావు
  rationale: חפץ అనే క్రియ ఒకరిలో ఆనందించడం, సంతోషించడం లేదా వారిపట్ల ప్రసన్నంగా ఉండడం అనే భావాన్ని ఇస్తుంది. ఈ అనువాదం ఆ ఆనంద భావాన్ని నిలుపుతూ, దానిలో అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: రెండవ כִּי ముందున్న ప్రకటనకు కారణం లేదా నిదర్శనం తెలుపుతుంది; ‘ఎందుకంటే’ వాక్యంలోని తార్కిక సంబంధాన్ని స్పష్టంగా చూపిస్తుంది.
- source_word: לֹא יָרִיעַ
  choice: విజయనాదం చేయడం లేదు
  rationale: רוע హిఫీల్ రూపం ఇక్కడ విజయోత్సాహంతో చేసే కేక లేదా నాదాన్ని సూచిస్తుంది. ‘విజయనాదం చేయడం లేదు’ శ్రావ్యమైన మూలరూపకాన్ని నిలుపుతుంది.
- source_word: אֹיְבִי
  choice: నా శత్రువు
  rationale: ఏకవచన నామవాచకాన్నీ ప్రథమ పురుష ఏకవచన ప్రత్యయాన్నీ యథాతథంగా నిలుపుతుంది.
- source_word: עָלָי
  choice: నాపై
  rationale: విజయనాద సందర్భంలో עַל, కీర్తనకర్త ఓటమిపై శత్రువు ఉల్లసించడాన్ని సూచిస్తుంది; ‘నాపై’ ఈ సంబంధాన్ని సంక్షిప్తంగా కాపాడుతుంది.
theological_decisions:
- issue: శత్రువు జయించకపోవడం దేవుని ప్రసన్నతకు నిదర్శనమా?
  choice: శత్రువు తనపై విజయనాదం చేయకపోవడాన్ని దేవుడు తనను చూసి ఆనందిస్తున్నాడనే నిదర్శనంగా కీర్తనకర్త గ్రహిస్తున్నట్లు అనువదించబడింది.
  alternative: దీనిని దేవుడు కీర్తనకర్తను నీతిమంతుడిగా తీర్పు తీర్చాడనే మరింత బలమైన ప్రకటనగా అనువదించవచ్చు.
  rationale: హీబ్రూ పాఠం దేవుని ఆనందానికీ శత్రువు విజయనాదం చేయలేకపోవడానికీ సంబంధం పెడుతుంది; అయితే దేవుని ఆనందానికి ఆధారం ఏమిటో వివరించదు. కాబట్టి అనువాదం ఆ సంబంధాన్ని మాత్రమే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘విజయనాదం’ ద్వారా మూలంలోని శ్రావ్య రూపకం నిలుపబడింది; ‘నన్ను చూసి ఆనందిస్తున్నావు’ సాధారణ పాఠకునికి అర్థమయ్యేలా חפץ ב భావాన్ని వ్యక్తం చేస్తుంది.
