id: PSA.41.4
reference: Psalms 41:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֲֽנִי אָ֭מַרְתִּי יְהוָ֣ה חָנֵּ֑/נִי רְפָאָ֥/ה נַ֝פְשִׁ֗/י כִּי חָטָ֥אתִי לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/004.yaml
  text: As for me[a], I said, “O Yahweh, be gracious to me; heal my soul, for I have sinned against you.”
translation:
  language: te
  text: నేనైతే, “యాహ్వే, నాపై కృప చూపు; నా ప్రాణాన్ని[a] స్వస్థపరచు, ఎందుకంటే నేను నీకు విరోధంగా పాపం చేశాను” అని అన్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా జీవితాన్ని”; లేదా “నన్ను.” హీబ్రూ పదం “ప్రాణం,” “జీవితం,” లేదా “వ్యక్తి” అని కూడా అర్థమివ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: నేనైతే
  rationale: ప్రత్యేకంగా ఉంచిన స్వతంత్ర సర్వనామంలోని స్వల్ప ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אָמַרְתִּי
  choice: అని అన్నాను
  rationale: ఈ సందర్భంలో కర్త చెప్పిన ప్రార్థనను గతకాలంలో నివేదించే కాలరూపాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: బిరుదుతో భర్తీ చేయకుండా హీబ్రూ దైవనామాన్ని తెలుగు లిపిలో లిప్యంతరీకరిస్తుంది.
- source_word: חָנֵּנִי
  choice: నాపై కృప చూపు
  rationale: కృపతో అనుగ్రహించాలనే విజ్ఞాపనను వ్యక్తం చేస్తూ, భావాన్ని కేవలం జాలికి పరిమితం చేయదు.
- source_word: רְפָאָה
  choice: స్వస్థపరచు
  rationale: స్వస్థత కలిగించు అనే మూలార్థాన్ని నిలుపుతూ, అది శారీరకమా ఆంతరికమా అని ముందుగానే నిర్ణయించదు.
- source_word: נַפְשִׁי
  choice: నా ప్రాణాన్ని
  rationale: נפש అనే పదంలోని ప్రాణం, జీవితం, స్వయం, వ్యక్తి అనే విస్తృత భావపరిధిని సాధ్యమైనంతవరకు నిలుపుతుంది; ప్రత్యామ్నాయాలను పాదసూచికలో తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న విజ్ఞాపనకు కారణాన్ని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో పరిచయం చేస్తుంది.
- source_word: חָטָאתִי
  choice: పాపం చేశాను
  rationale: గతంలో జరిగిన పాపాన్ని ప్రస్తుత ఒప్పుకోలుగా చెప్పే హీబ్రూ సంపూర్ణ క్రియారూపానికి సహజమైన తెలుగు రూపం.
- source_word: לָךְ
  choice: నీకు విరోధంగా
  rationale: పాపం వల్ల అవమానించబడిన సంబంధపక్షాన్ని తెలుగులో స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా నిలుపుతుంది.
- issue: “నా ప్రాణాన్ని స్వస్థపరచు” అనే మాట యొక్క పరిధి
  choice: నా ప్రాణాన్ని స్వస్థపరచు
  alternative: నన్ను స్వస్థపరచు; నా జీవితాన్ని స్వస్థపరచు
  rationale: హీబ్రూ נפש అంతరంగం, జీవితం లేదా సంపూర్ణ వ్యక్తిని సూచించగలదు. అనువాదం స్వస్థతను కేవలం శారీరకమైనదిగా గానీ ఆధ్యాత్మికమైనదిగా గానీ పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనకు తగిన గౌరవభరితమైన సరళ శైలి వాడబడింది. “నేనైతే” మూలంలోని ఉద్ఘాటనను నిలుపుతుంది; “యాహ్వే” దైవనామాన్ని నేరుగా లిప్యంతరీకరిస్తుంది.
