  yaml_path: translation/ot/psalms/041/007.yaml
  text: Together all who hate me whisper against me[b][a]; against me they devise evil for me.
translation:
  language: te
  text: నన్ను ద్వేషించేవారందరూ కలిసి నాకు విరోధంగా[a] గుసగుసలాడుతున్నారు; నాకు కీడు చేయాలని నా మీద[a] యోచిస్తున్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా గురించి.’ రెండు చోట్లా ఉన్న హీబ్రూ విభక్తి శత్రుత్వ దిశనుగానీ, మాటల లేదా ఆలోచనల విషయాన్నిగానీ సూచించవచ్చు; సందర్భానికి ‘నాకు విరోధంగా/నా మీద’ బాగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, ‘నా మీద నాకు కీడు ఆలోచిస్తున్నారు.’ హీబ్రూలో ఆలోచించడం లేదా పథకం వేయడం అనే క్రియ ‘కీడు’తో కలిసి శత్రుత్వపూర్వక ఉద్దేశాన్ని వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: ఏకమై
  rationale: వ్యతిరేకులు సమష్టిగా, పరస్పరం కలిసికట్టుగా వ్యవహరిస్తున్నారనే క్రియావిశేషణ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עָלַי
  choice: నాకు విరోధంగా / నా మీద
  rationale: ఈ శత్రుత్వ సందర్భంలో עַל కేవలం ‘నా గురించి’ అనే విషయార్థం కంటే ప్రతికూల దిశను సూచిస్తుంది. రెండు occurrences లో తెలుగు సహజత్వం కోసం సమానార్థక రూపాలు వాడబడ్డాయి.
- source_word: יִתְלַחֲשׁוּ
  choice: గుసగుసలాడుతున్నారు
  rationale: లחשׁ హిత్పయేల్ రూపం వారు తమలో తాము మెల్లగా మాట్లాడుకోవడాన్ని సూచిస్తుంది; ‘కుట్ర చేస్తున్నారు’ అని ఈ క్రియలోనే అధిక వ్యాఖ్యానం చేర్చకుండా దాని శ్రవ్య చిత్రాన్ని నిలుపుతుంది.
- source_word: כָּל שֹׂנְאַי
  choice: నన్ను ద్వేషించేవారందరూ
  rationale: ‘నన్ను ద్వేషించేవారు’ అనే క్రియాత్మక భావాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: יַחְשְׁבוּ
  choice: పన్నాగం పన్నుతున్నారు
  rationale: חשב ఇక్కడ ఆలోచించడం లేదా పథకం వేయడం అనే భావంలో, רָעָהతో కలిసి ఉద్దేశపూర్వకమైన హానికర ప్రణాళికను సూచిస్తుంది.
- source_word: רָעָה
  choice: కీడు
  rationale: నైతిక చెడుతో పాటు తలపెట్టిన హానిని కూడా సూచించగల విస్తృతమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: לִי
  choice: నాకు … చేయాలని
  rationale: లక్ష్యవ్యక్తిని సూచించే ‘నాకు’ అనే భావాన్ని నిలుపుతూ, తెలుగులో హాని చేయాలనే ఉద్దేశాన్ని సహజంగా వ్యక్తం చేస్తుంది.
