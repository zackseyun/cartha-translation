translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘గుసగుసలాడుతున్నారు’ మూలంలోని చిత్రాన్ని నిలుపుతుంది; ‘పన్నాగం పన్నుతున్నారు’ సమాంతర పాదంలోని ఉద్దేశపూర్వక హానిని సహజంగా వ్యక్తం చేస్తుంది. [a], [b] సూచికలు రెండూ ప్రధాన పాఠ్యంలో ఉన్నాయి.
