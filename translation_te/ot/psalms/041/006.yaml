source:
  edition: WLC
  text: וְ/אִם בָּ֤א לִ/רְא֨וֹת שָׁ֤וְא יְדַבֵּ֗ר לִבּ֗/וֹ יִקְבָּץ אָ֥וֶן ל֑/וֹ יֵצֵ֖א לַ/ח֣וּץ יְדַבֵּֽר־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/006.yaml
  text: And if he comes to see me[a], he speaks falsehood; his heart gathers wickedness to itself; when he goes out to the street[c][b], he speaks it.
translation:
  language: te
  text: 'అతడు నన్ను చూడటానికి వస్తే[a], అసత్యం పలుకుతాడు;


    అతని హృదయం తనలోనే దుష్టతను పోగుచేసుకుంటుంది;


    అతడు బయటికి వెళ్లి దానిని చెబుతాడు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘చూడటానికి’; సందర్భాన్ని బట్టి ‘నన్ను’ చేర్చబడింది.
    reason: lexical_alternative
  - marker: b
    text: చివరి మాటలను ‘అతడు బయటికి వెళ్లి మాట్లాడతాడు’ అని కూడా అనువదించవచ్చు. ‘దానిని’ అనే కర్మ మూలంలో వ్యక్తంగా లేదు; సందర్భం నుండి గ్రహించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם בָּא
  choice: అతడు ... వస్తే
  rationale: וְאִם యొక్క షరతు భావాన్ని సహజమైన తెలుగులో క్రియాంతంలోని ‘వస్తే’ తెలియజేస్తుంది; ముందటి వచనంతో ఉన్న అనుసంధానం సందర్భంలో స్పష్టంగా ఉండటంతో విడిగా ‘మరియు’ చేర్చలేదు.
- source_word: לִרְאוֹת
  choice: నన్ను చూడటానికి
  rationale: మూలంలో అక్షరార్థంగా ‘చూడటానికి’; కీర్తనకర్తనే చూడటానికి వస్తున్నాడని సందర్భం సూచిస్తున్నందున సహజమైన తెలుగుకోసం ‘నన్ను’ చేర్చబడింది.
- source_word: שָׁוְא יְדַבֵּר
  choice: అబద్ధమే మాట్లాడతాడు
  rationale: שָׁוְא అబద్ధం, మోసం, వ్యర్థత అనే భావాలను కలిగి ఉంటుంది. శత్రుత్వపూరితమైన మాటల సందర్భంలో ‘అబద్ధం’ ప్రధాన భావాన్ని స్పష్టంగా అందిస్తుంది; ‘-ఏ’ అతని మాటల అసత్య స్వభావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִבּוֹ
  choice: అతని హృదయం
  rationale: హీబ్రూ మానవశాస్త్ర పదాన్ని నిలుపుతూ, అంతరంగ ఆలోచనలు మరియు ఉద్దేశాల కేంద్రం అనే భావాన్ని కాపాడుతుంది.
- source_word: יִקְבָּץ אָוֶן לוֹ
  choice: తనలో దుష్టతను పోగుచేసుకుంటుంది
  rationale: קבץ యొక్క ‘పోగుచేయు’ చిత్రాన్ని నిలుపుతుంది. אָוֶן ఇక్కడ కీడు లేదా దుష్ట ఉద్దేశాన్ని సూచిస్తుంది. לוֹ ను హృదయంలో జరిగే అంతర్గత సమీకరణగా ‘తనలో’తో వ్యక్తం చేశాం.
- source_word: יֵצֵא לַחוּץ
  choice: అతడు బయటికి వెళ్లి
  rationale: לַחוּץ కు నేరమైన అర్థం ‘బయటికి’. మూలంలో లేని ‘వీధికి’ అనే నిర్దిష్టతను చేర్చకుండా స్థలాంతర భావాన్ని నిలిపాం.
- source_word: יְדַבֵּר
  choice: దానిని ప్రచారం చేస్తాడు
  rationale: రెండవ דבר బయట ఇతరులకు చెప్పడాన్ని సూచిస్తుంది. ‘దానిని’ అనేది అంతరంగంలో పోగుచేసుకున్న హానికరమైన విషయాన్ని సూచించే సందర్భానుసార పూరకం; ‘ప్రచారం చేస్తాడు’ బయటకు వెళ్లి దాన్ని వ్యాప్తి చేసే భావాన్ని సహజ తెలుగులో అందిస్తుంది.
