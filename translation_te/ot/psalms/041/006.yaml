  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే కీర్తనకు తగిన గంభీరతతో రూపొందించబడింది. హీబ్రూ పాదాల క్రమం, ‘హృదయం’ అనే రూపకం, అంతరంగంలో పోగుచేసుకొని బయట పలికే గమనక్రమం నిలుపబడ్డాయి.
