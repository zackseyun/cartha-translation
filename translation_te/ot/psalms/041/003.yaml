source:
  edition: WLC
  text: יְֽהוָ֗ה יִ֭סְעָדֶ/נּוּ עַל עֶ֣רֶשׂ דְּוָ֑י כָּל מִ֝שְׁכָּב֗/וֹ הָפַ֥כְתָּ בְ/חָלְיֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/003.yaml
  text: Yahweh will sustain him on his sickbed[a]; in his illness you restore his whole bed.
translation:
  language: te
  text: యాహ్వే అతనికి రోగశయ్యపై ఆసరా ఇస్తాడు; అతని అనారోగ్యంలో అతని శయ్య మొత్తాన్ని నీవు మార్చుతావు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని అనారోగ్యంలో అతని శయ్య మొత్తాన్ని నీవు తిప్పుతావు.” హీబ్రూ క్రియకు అక్షరార్థంగా “తిప్పు/తలకిందులు చేయు” అనే భావం ఉంది; ఇక్కడ అది రోగిని శ్రద్ధగా చూసుకోవడం లేదా అతని స్థితిని పునరుద్ధరించడం అనే భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో వ్యక్తిగత నామంగా నిలిపింది.
- source_word: יִסְעָדֶנּוּ
  choice: అతణ్ణి ... ఆదరిస్తాడు
  rationale: סעד బలహీనుడిని నిలబెట్టడం, ఆసరా ఇవ్వడం, పోషించడం అనే భావాన్ని ఇస్తుంది. అనారోగ్య సందర్భంలో ‘ఆదరిస్తాడు’ సహజంగా ఉండి శారీరక సహాయాన్నీ సంరక్షణనూ సూచిస్తుంది.
- source_word: עַל עֶרֶשׂ דְּוָי
  choice: అనారోగ్యపు మంచంపై
  rationale: עֶרֶשׂ ‘మంచం/శయ్య,’ דְּוָי ‘అనారోగ్యం’; మూలంలోని నిర్మాణాన్ని స్పష్టమైన ఆధునిక తెలుగులో నిలిపింది.
- source_word: כָּל מִשְׁכָּבוֹ
  choice: అతని పడకనంతటినీ
  rationale: כָּל యొక్క సంపూర్ణత భావాన్ని నిలుపుతూ, మునుపటి ‘మంచం’కు సమాంతరంగా మִשְׁכָּב యొక్క పడుకునే స్థల భావాన్ని అందిస్తుంది.
- source_word: הָפַכְתָּ
  choice: మార్చివేస్తావు
  rationale: הפך యొక్క ప్రాథమిక ‘తిప్పు/మార్చు’ భావాన్ని అస్పష్టతతో సహా నిలుపుతుంది; ‘స్వస్థపరుస్తావు’ అని భావాన్ని ముందుగానే నిర్ణయించదు.
- source_word: בְחָלְיוֹ
  choice: అతని అనారోగ్యంలో
  rationale: בְּ సందర్భాన్ని సూచిస్తుంది; חֳלִי అనారోగ్యాన్ని సూచిస్తుంది. సరళమైన సందర్భార్థ అనువాదం.
theological_decisions:
- issue: వచనంలో సంబోధన మార్పు
  choice: ‘యెహోవా ... ఆదరిస్తాడు’ అనే మూడవ పురుషం నుంచి ‘నీవు మార్చివేస్తావు’ అనే రెండవ పురుష సంబోధనకు మార్పును నిలిపాం.
  alternative: వచనమంతటినీ మూడవ పురుషంలో సాఫీ చేయడం.
  rationale: హీబ్రూ కవిత్వంలో దేవుని గురించి చెప్పడం నుంచి ఆయనను నేరుగా సంబోధించడానికి మార్పు ఉంది; దాన్ని నిలపడం ప్రార్థనా స్వరాన్నీ మూల నిర్మాణాన్నీ కాపాడుతుంది.
- issue: הָפַכְתָּ యొక్క అర్థం
  choice: ‘మార్చివేస్తావు’ అని అనువదించి విస్తృతమైన ‘తిప్పు/మార్చు’ భావాన్ని నిలిపాం.
  alternative: ‘పునరుద్ధరిస్తావు’ లేదా ‘స్వస్థపరుస్తావు.’
  rationale: సందర్భం దయతో కూడిన సంరక్షణ లేదా పునరుద్ధరణను సూచించవచ్చు; అయినా క్రియ స్వయంగా ‘తిప్పడం/మార్చడం’ అనే భావం కలది. అందువల్ల ప్రధాన పాఠ్యంలో దానిని అతిగా నిర్దిష్టం చేయకుండా, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కవితా శైలి. మూలంలోని సమాంతరతను ‘మంచం/పడక’తో, మూడవ పురుషం నుంచి రెండవ పురుషానికి వచ్చే సంబోధన మార్పును యథాతథంగా నిలిపింది. ప్రధాన పాఠ్యం הפך యొక్క నిజమైన అర్థ అస్పష్టతను అతిగా పరిష్కరించదు.
