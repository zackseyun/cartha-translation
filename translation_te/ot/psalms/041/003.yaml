review_pass:
  verdict: revise
  source_fidelity: The draft preserves the Hebrew’s third-person to second-person shift and retains the deliberately difficult הָפַכְתָּ wording without making healing explicit in the main text. However, ‘ఆదరిస్తాడు’ primarily denotes comforting rather than supporting/sustaining, and ‘యెహోవా’ does not follow the audit trail’s specified rendering of יהוה as ‘Yahweh.’
  naturalness: The verse is generally understandable, but ‘అతని పడకనంతటినీ మార్చివేస్తావు’ is somewhat cumbersome. ‘శయ్య మొత్తాన్ని ... మార్చుతావు’ is more natural while still retaining the broad turn/change sense.
  terminology: Render the divine name as ‘యాహ్వే,’ corresponding to the source/audit’s ‘Yahweh.’ Use ‘రోగశయ్య’ for the illness-bed and ‘ఆసరా ఇస్తాడు’ for יסעד, which communicates sustaining support without reducing it to emotional consolation.
  issues:
  - severity: medium
    issue: The divine name is rendered ‘యెహోవా.’
    rationale: The stated source and English POB lexical decision explicitly render יהוה as ‘Yahweh.’ In Telugu transliteration this should be ‘యాహ్వే,’ rather than the distinct traditional form ‘యెహోవా.’
  - severity: medium
    issue: ‘ఆదరిస్తాడు’ is used for יִסְעָדֶנּוּ.
    rationale: Though it can imply care, ‘ఆదరించు’ most naturally means comfort/consolation. The Hebrew here denotes support or sustaining a weakened person; ‘ఆసరా ఇస్తాడు’ represents this more accurately.
  - severity: low
    issue: The main wording for the second colon is slightly awkward.
    rationale: ‘పడకనంతటినీ మార్చివేస్తావు’ is intelligible, but ‘శయ్య మొత్తాన్ని నీవు మార్చుతావు’ reads more naturally in modern standard Telugu while preserving the lexical openness of הפך.
  revised_text: యాహ్వే అతనికి రోగశయ్యపై ఆసరా ఇస్తాడు; అతని అనారోగ్యంలో అతని శయ్య మొత్తాన్ని నీవు మార్చుతావు.[a]
