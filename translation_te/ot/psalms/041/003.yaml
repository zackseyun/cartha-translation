revisions:
- from: యెహోవా అతణ్ణి అనారోగ్యపు మంచంపై ఆదరిస్తాడు; అతని అనారోగ్యంలో అతని పడకనంతటినీ నీవు మార్చివేస్తావు.[a]
  to: యాహ్వే అతనికి రోగశయ్యపై ఆసరా ఇస్తాడు; అతని అనారోగ్యంలో అతని శయ్య మొత్తాన్ని నీవు మార్చుతావు.[a]
  rationale: The revision aligns the divine name with the supplied source/audit policy, gives יסעד its sustaining sense, and improves Telugu idiom. The second colon intentionally remains broad (‘మార్చుతావు’), with the literal turning sense and the likely care/restoration idiom set out in the footnote; this avoids resolving a debated idiom beyond the Hebrew evidence.
