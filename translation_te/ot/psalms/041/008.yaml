id: PSA.41.8
reference: Psalms 41:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: דְּֽבַר בְּ֭לִיַּעַל יָצ֣וּק בּ֑/וֹ וַ/אֲשֶׁ֥ר שָׁ֝כַ֗ב לֹא יוֹסִ֥יף לָ/קֽוּם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/008.yaml
  text: A wicked thing is poured out upon him; now that he lies down[a], he will rise no more.
translation:
  language: te
  text: దుష్టమైనది ఒకటి అతని మీద కుమ్మరించబడింది[a]; అతడు పడుకున్నాక ఇక లేవడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నీచమైన విషయం అతనిపై స్థిరపడింది” అని గానీ, “ఒక దుష్ట ఆరోపణ అతని మీద మోపబడింది” అని గానీ అనువదించవచ్చు. ఈ హీబ్రూ వ్యక్తీకరణ క్లిష్టమైనది; అది ప్రాణాంతకమైన వ్యాధిని లేదా నాశనకరమైన ఆరోపణను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר בְּלִיַּעַל
  choice: దుష్టమైన ఒక విషయం
  rationale: ఈ సంక్షిప్తమైన హీబ్రూ పదబంధం వినాశకరమైన వ్యాధిని గానీ, దుష్ట ఆరోపణను గానీ సూచించవచ్చు. “విషయం” అనే సాధారణ పదం ఆ రెండు అవకాశాల మధ్యనున్న అస్పష్టతను నిలుపుతుంది; בְּלִיַּעַל లోని చెడు, హానికర భావాన్ని “దుష్టమైన” తెలియజేస్తుంది.
- source_word: יָצוּק
  choice: కుమ్మరించబడింది
  rationale: మూలపదంలోని పోయడం లేదా కుమ్మరించడం అనే దృశ్యరూపాన్ని నిలుపుతూ, ఏదో హానికరమైనది అతని మీదికి వచ్చిందనే భావాన్ని వ్యక్తం చేస్తుంది. “మోపబడింది” అని అనువదిస్తే ఆరోపణ అనే అర్థానికే మొగ్గు చూపే ప్రమాదం ఉంది.
- source_word: בּוֹ
  choice: అతని మీద
  rationale: ఈ క్రియతో కలిసి, ఏదో ఒకటి అతనిపైకి కుమ్మరించబడిందనే సహజమైన తెలుగు భావాన్ని ఇస్తుంది.
- source_word: וַאֲשֶׁר שָׁכַב
  choice: అతడు పడుకున్నాక
  rationale: שָׁכַב యొక్క ‘పడుకోవడం’ అనే ప్రత్యక్ష దృశ్యాన్ని నిలుపుతుంది. సందర్భంలో ఇది మంచానపడడం లేదా కూలిపోవడం కావచ్చు; అనువాదం దానిని స్పష్టీకరించి మూలంలోని విస్తృతిని తగ్గించదు.
- source_word: לֹא יוֹסִיף לָקוּם
  choice: ఇక లేవడు
  rationale: మళ్లీ లేవకపోవడం లేదా కోలుకోకపోవడం అనే హీబ్రూ నుడికార భావాన్ని సంక్షిప్తంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: వాక్యంలోని దృశ్యానికి అర్థం
  choice: హానికరమైన వ్యాధి లేదా స్థితి, దుష్ట ఆరోపణ—ఈ రెండింటి మధ్యనున్న అస్పష్టతను ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: “ఒక భయంకరమైన వ్యాధి అతనికి అంటుకుంది” లేదా “ఒక దుష్ట ఆరోపణ అతని మీద మోపబడింది” అని ఒకే అర్థాన్ని ఎంచుకోవడం
  rationale: హీబ్రూ పదబంధం క్లిష్టమైనది, సంక్షిప్తమైనది. సందర్భం దుర్మార్గులు బాధితుని గురించి చెప్పే మాటలను చూపుతున్నప్పటికీ, వారు వ్యాధిని సూచిస్తున్నారా లేక నాశనకరమైన ఆరోపణను మోపుతున్నారా అనేది ఖచ్చితంగా నిర్ణయించలేం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కీర్తన శైలిని అనుసరించాం. “ఇక లేవడు” సాధారణ పాఠకుడికి స్పష్టంగా ఉండి, మరణం లేదా కోలుకోలేని స్థితి అనే సందర్భార్థాన్ని అతిగా వివరించకుండా నిలుపుతుంది.
