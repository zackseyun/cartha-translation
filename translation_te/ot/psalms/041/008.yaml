  to: దుష్టమైనది ఒకటి అతని మీద కుమ్మరించబడింది[a]; అతడు పడుకున్నాక ఇక లేవడు.
  rationale: The revision makes only a safe Telugu idiomatic adjustment, replacing the unnatural “దుష్టమైన ఒక విషయం” with “దుష్టమైనది ఒకటి.” It preserves the source’s compact ambiguity between a harmful condition and a destructive accusation, retains the poured-upon image, and leaves the footnote anchor and alternatives intact.
