  - marker: a
    text: లేదా ‘దావీదు రచించిన కీర్తన’ లేదా ‘దావీదు కోసం కీర్తన’; హెబ్రీ శీర్షిక రచనను, సంబంధాన్ని లేదా అంకితాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నిర్దేశకునికి
  rationale: కీర్తనల శీర్షికల్లో ఈ పదం సంగీత ప్రదర్శనను పర్యవేక్షించే వ్యక్తిని సూచిస్తుంది. ‘సంగీత నిర్దేశకుడు’ అనే పదబంధం మూలంలోని పర్యవేక్షణ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: ఇది సంగీతంతో పాడే పవిత్ర గీతాన్ని సూచించే ప్రామాణిక శీర్షికా పదం; కీర్తనల గ్రంథ సందర్భంలో ‘కీర్తన’ సహజమైన, స్థిరపడిన తెలుగు సమానం.
- source_word: לְדָוִד
  choice: దావీదు కీర్తన
  rationale: హెబ్రీ ఉపసర్గ לְ రచన, సంబంధం, అంకితం వంటి భావాలను సూచించగలదు. తెలుగు షష్ఠీ సంబంధ నిర్మాణమైన ‘దావీదు కీర్తన’ వాటిలో ఒక్కదానికే పరిమితం చేయకుండా మూలంలోని విస్తృత భావాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
theological_decisions:
- issue: దావీదుకు సంబంధించిన శీర్షికను ఎలా అర్థం చేసుకోవాలి
  choice: దావీదు కీర్తన
  alternative: దావీదు రచించిన కీర్తన; దావీదు కోసం కీర్తన
  rationale: మూలంలోని לְדָוִד రచయితను, సంబంధాన్ని లేదా అంకితాన్ని సూచించవచ్చు. ప్రధాన పాఠం ఈ సందిగ్ధతను పరిష్కరించకుండా ఉంచుతుంది; స్పష్టమైన ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. కీర్తన శీర్షికకు తగిన సంక్షిప్త నిర్మాణాన్ని నిలిపి, లְדָוִדలోని నిజమైన భావసందిగ్ధతను పాదసూచికతో పరిరక్షించాం.
