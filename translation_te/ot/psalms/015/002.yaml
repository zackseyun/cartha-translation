  text: He who walks blamelessly[a], and does what is right[b], and speaks truth in his heart.
translation:
  language: te
  text: యథార్థతతో నడిచేవాడు[a], నీతిని ఆచరించేవాడు[b], తన హృదయంలో సత్యం చెప్పేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నిందకు తావులేని విధంగా నడిచేవాడు.’ హీబ్రూ పదం సంపూర్ణ పాపరాహిత్యాన్ని కాకుండా, ప్రవర్తనలో సమగ్రతను లేదా యథార్థతను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘న్యాయం చేసేవాడు,’ ‘సరైనది చేసేవాడు.’ హీబ్రూ పదానికి నీతి, న్యాయం, సరైనది అనే భావాలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: నడవడి గలవాడు
  rationale: הלך అనే క్రియారూపం ఇక్కడ జీవన విధానాన్ని సూచించే రూపక ప్రయోగం. తెలుగులో ‘నడవడి గలవాడు’ సహజంగా ఉండి ఆ భావాన్ని నిలుపుతుంది.
- source_word: תָּמִים
  choice: నిందలేని
  rationale: ఈ పదం సంపూర్ణ పాపరాహిత్యాన్ని తప్పనిసరిగా సూచించకుండా, ప్రవర్తనలో సమగ్రతను, యథార్థతను సూచిస్తుంది.
- source_word: וּפֹעֵל
  choice: ఆచరించేవాడు
  rationale: פעל ఇక్కడ చేయడం లేదా ఆచరణలో పెట్టడం అనే నిరంతర జీవన ప్రవర్తనను తెలియజేస్తుంది.
- source_word: צֶדֶק
  choice: నీతిని
  rationale: צדק నీతి, న్యాయం, సరైనది అనే భావాలను మోయగలదు. ఈ నైతిక సందర్భంలో ‘నీతిని ఆచరించడం’ సహజమైనదిగా, మూలంలోని నామవాచక నిర్మాణానికి సమీపంగా ఉంది.
- source_word: וְדֹבֵר
  choice: పలికేవాడు
  rationale: דבר యొక్క ‘మాట్లాడటం/పలకడం’ అనే సూటి అర్థాన్ని, మూడు సమాంతర వర్ణనల లయను నిలుపుతుంది.
- source_word: אֱמֶת
  choice: సత్యం
  rationale: אמת నమ్మకత్వం అనే విస్తృత భావాన్ని కలిగి ఉన్నా, ‘పలుకు’తో కలిసినప్పుడు సత్యవచనమే ప్రధాన భావం.
- source_word: בִּלְבָבוֹ
  choice: తన హృదయంలో
  rationale: హీబ్రూ పదబంధంలోని ‘హృదయంలో’ అనే అంతరంగ భావాన్ని యథాతథంగా నిలిపి, బాహ్య మాటలకే పరిమితం కాని అంతరంగ సత్యనిష్ఠను సూచిస్తుంది.
theological_decisions:
- issue: పుంలింగ ఏకవచన ప్రతినిధి ప్రయోగం
  choice: గలవాడు … ఆచరించేవాడు … పలికేవాడు
  alternative: ఎవరైతే … వారు
