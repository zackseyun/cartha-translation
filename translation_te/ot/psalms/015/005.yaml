    issue: The phrase ‘వడ్డీకి ఇవ్వడు’ leaves the lending sense somewhat implicit.
    rationale: The Hebrew expression refers to giving money as a loan at interest. ‘వడ్డీకి అప్పు ఇవ్వడు’ makes this relationship clear in idiomatic Telugu while retaining the broad sense of interest.
  - severity: low
    issue: ‘నిర్దోషికి విరోధంగా’ is less natural than the standard Telugu legal-moral phrasing.
    rationale: ‘నిర్దోషికి వ్యతిరేకంగా’ conveys the sense of accepting a bribe to act against an innocent person more idiomatically.
