  variant: modern standard Telugu
source:
  edition: WLC
  text: כַּסְפּ֤/וֹ לֹא נָתַ֣ן בְּ/נֶשֶׁךְ֮ וְ/שֹׁ֥חַד עַל נָקִ֗י לֹ֥א לָ֫קָ֥ח עֹֽשֵׂה אֵ֑לֶּה לֹ֖א יִמּ֣וֹט לְ/עוֹלָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/005.yaml
  text: He does not lend his money at interest[a], and does not take a bribe against the innocent[b]. The one who does these things will never be shaken.
translation:
  language: te
  text: తన డబ్బును వడ్డీకి అప్పు ఇవ్వడు[a]; నిర్దోషికి వ్యతిరేకంగా లంచం తీసుకోడు. వీటిని చేసేవాడు ఎన్నటికీ కదిలిపోడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అప్పుపై వడ్డీ వసూలు చేయడు.’ ఇక్కడి హీబ్రూ పదం అప్పుపై విధించే వడ్డీని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఎప్పటికీ తొట్రిల్లడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפּוֹ
  choice: తన డబ్బును
  rationale: כֶּסֶף యొక్క అక్షరార్థం ‘వెండి’; అయితే అప్పు, వడ్డీ సందర్భంలో ఆధునిక తెలుగులో ‘డబ్బు’ సహజంగా ఆర్థిక భావాన్ని తెలియజేస్తుంది.
- source_word: נָתַן בְּנֶשֶׁךְ
  choice: వడ్డీకి ఇవ్వడు
  rationale: నిర్మాణం అప్పుగా ఇచ్చి వడ్డీ వసూలు చేయడాన్ని సూచిస్తుంది. ‘వడ్డీకి ఇవ్వడం’ సాధారణ పాఠకులకు సహజంగా ఉండి, దానిని కేవలం అధిక లేదా అక్రమ వడ్డీకి పరిమితం చేయదు.
- source_word: שֹׁחַד
  choice: లంచం
  rationale: న్యాయాన్ని వక్రీకరించడానికి స్వీకరించే ప్రతిఫలాన్ని సూచించే ప్రామాణిక ఆధునిక తెలుగు పదం.
- source_word: עַל נָקִי
  choice: నిర్దోషికి విరోధంగా
  rationale: נָקִי అపరాధంలేని వ్యక్తిని సూచిస్తుంది; עַל ఇక్కడ లంచం తీసుకోవడం ఆ వ్యక్తికి వ్యతిరేకంగా జరిగే భావాన్ని నిలుపుతుంది.
- source_word: עֹשֵׂה אֵלֶּה
  choice: వీటిని చేసేవాడు
  rationale: హీబ్రూ కృదంతం ఈ క్రియలతో లక్షణీకరించబడే ఏ వ్యక్తినైనా ఏకవచనంలో సూచిస్తుంది.
- source_word: לֹא יִמּוֹט לְעוֹלָם
  choice: ఎన్నటికీ కదిలిపోడు
  rationale: מוֹט లోని స్థిరత్వం కోల్పోవడం లేదా కదిలించబడడం అనే రూపకాన్ని, לְעוֹלָם తో కూడిన బలమైన కాలనిరాకరణను సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: వడ్డీ తీసుకోవడంపై నైతిక పరిధి
  choice: נֶשֶׁךְ ను ‘వడ్డీ’గా అనువదించడం
  alternative: ‘అధిక వడ్డీ’ లేదా ‘అక్రమ వడ్డీ’
  rationale: మూలపదం అప్పుపై విధించే వడ్డీని సూచిస్తుంది. దానిని కేవలం దోపిడీ స్థాయి లేదా చట్టవిరుద్ధ వడ్డీకి పరిమితం చేయడం మూలంలో లేని తరువాతి ఆర్థిక నిర్వచనాన్ని చేర్చవచ్చు.
- issue: చివరి వాగ్దానంలోని స్థిరత్వ రూపకం
  choice: ‘ఎన్నటికీ కదిలిపోడు’
  alternative: ‘ఎప్పటికీ తొట్రిల్లడు’
  rationale: పదశః కదలిక/అస్థిరత రూపకాన్ని నిలుపుతూ, ఇది శారీరక కదలిక మాత్రమే కాక స్థిరమైన భద్రతను సూచించే కవితాత్మక ప్రకటనగా ఉండే తెరచిన భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన కవితాత్మక శైలి. హీబ్రూ వాక్యంలోని ఏకవచన నైతిక వ్యక్తి చిత్రణను, న్యాయసంబంధ సందర్భాన్ని, చివరి స్థిరత్వ రూపకాన్ని నిలిపింది.
