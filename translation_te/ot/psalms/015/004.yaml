id: PSA.15.4
reference: Psalms 15:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: נִבְזֶ֤ה בְּֽ/עֵ֘ינָ֤י/ו נִמְאָ֗ס וְ/אֶת יִרְאֵ֣י יְהוָ֣ה יְכַבֵּ֑ד נִשְׁבַּ֥ע לְ֝/הָרַ֗ע וְ/לֹ֣א יָמִֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/004.yaml
  text: In his eyes a despised person is rejected[a], but he honors those who fear Yahweh[b]; he swears to his own harm and does not change.
translation:
  language: te
  text: అతని దృష్టిలో తృణీకరించబడినవాడు తిరస్కరించబడినవాడు[a]; అయితే యాహ్వేకు భయపడేవారిని అతడు ఘనపరుస్తాడు. తనకే హాని కలిగేలా ప్రమాణం చేసినా[b], అతడు మాట మార్చడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, సంప్రదాయంగా: “నీచుడు అతని దృష్టిలో తృణీకరించబడతాడు.” హెబ్రీ వాక్యభాగం చాలా సంక్షిప్తంగా ఉంది; దగ్గరి సంబంధమున్న ఒకటి కంటే ఎక్కువ విధాలుగా దానిని అనువదించవచ్చు.'
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “హాని కలిగేలా ప్రమాణం చేసి, మార్చడు.” హాని ఎవరికని హెబ్రీ స్పష్టంగా చెప్పదు; ఆ ప్రమాణం తనకే నష్టం కలిగించినా దాన్ని నిలబెట్టుకుంటాడని సాధారణంగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְזֶה
  choice: తృణీకరించబడినవాడు
  rationale: ఈ నిష్క్రియాత్మక విశేషణ రూపం ఇతరుల దృష్టిలో తృణీకరణకు గురైన వ్యక్తిని సూచిస్తుంది. నైతికంగా ‘నీచుడు’ అని ముందే నిర్ణయించకుండా హెబ్రీ రూపాన్ని నిలుపుతుంది.
- source_word: בְּעֵינָיו
  choice: అతని దృష్టిలో
  rationale: మూలంలోని ‘అతని కళ్లలో’ అనే అంచనా లేదా విలువ నిర్ణయాన్ని తెలిపే నుడికారానికి సహజమైన తెలుగు రూపం.
- source_word: נִמְאָס
  choice: తిరస్కృతుడు
  rationale: అంగీకరించబడకపోవడం లేదా తిరస్కారానికి గురికావడం అనే అర్థాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; ముందున్న ‘తృణీకరించబడినవాడు’తో అనవసర పునరుక్తిని తగ్గిస్తుంది.
- source_word: יִרְאֵי יְהוָה
  choice: యాహ్వేకు భయపడేవారు
  rationale: యాహ్వే పట్ల భక్తిపూర్వక భయంతో జీవించేవారిని సూచించే నిబంధనా వ్యక్తీకరణ. ‘భయపడు’ అనే మూలభావాన్ని మృదువుపరచకుండా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: יְכַבֵּד
  choice: ఘనపరుస్తాడు
  rationale: כבד పీయేల్ రూపం ఇక్కడ గౌరవించడం, విలువైనవారిగా చూడడం అనే అర్థం ఇస్తుంది; ‘ఘనపరుస్తాడు’ ప్రస్తుత సందర్భంలో సహజమైనది.
- source_word: נִשְׁבַּע
  choice: ప్రమాణం చేసినా
  rationale: వచనం వ్యక్తి స్థిర స్వభావాన్ని వర్ణిస్తోంది. తరువాతి క్రియతో సహజంగా అనుసంధానించేందుకు తెలుగులో concessive నిర్మాణం వాడబడింది.
- source_word: לְהָרַע
  choice: తనకే హాని కలిగేలా
  rationale: మూలపదబంధం సంక్షిప్తంగా ‘హాని కలిగేలా’ అని ఉంది. సాధారణంగా ప్రమాణం చేసిన వ్యక్తికే నష్టం వచ్చినా దాన్ని నిలబెట్టుకోవడంగా అర్థం చేసుకుంటారు; ‘తనకే’ అనే అంతర్భావాన్ని స్పష్టంచేసింది.
- source_word: יָמִר
  choice: మాట మార్చడు
  rationale: హిఫీల్ రూపం మార్చడం లేదా బదలాయించడం అని అర్థం. ప్రమాణం అనే అంతర్భావిత కర్మను తెలుగులో సహజంగా ‘మాట మార్చడు’ అని తెలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలభేదాన్ని కాపాడుతుంది.
- issue: נִבְזֶה בְּעֵינָיו נִמְאָס అనే సంక్షిప్తమైన క్లాజు అర్థం
  choice: అతని దృష్టిలో తృణీకరించబడినవాడు తిరస్కృతుడు
  alternative: నీచుడు అతని దృష్టిలో తృణీకరించబడతాడు
  rationale: రెండు హెబ్రీ రూపాల నిష్క్రియాత్మక స్వరూపాన్ని ప్రధాన పాఠంలో సాధ్యమైనంతవరకు నిలిపి, వ్యక్తిని నేరుగా నైతికంగా ‘నీచుడు’గా వర్గీకరించలేదు. సంప్రదాయ నైతిక పఠనాన్ని పాదటిప్పణిలో ఉంచి మూలంలోని సందిగ్ధతను కాపాడింది.
- issue: לְהָרַע లో హాని ఎవరికి కలుగుతుందనే అంతర్భావం
  choice: ప్రమాణం చేసినవానికే హాని కలిగినా దాన్ని మార్చకపోవడం
  alternative: హాని చేయడానికి ప్రమాణం చేసి దాన్ని మార్చకపోవడం
  rationale: హెబ్రీ పదబంధం కర్మను స్పష్టంగా చెప్పదు. కీర్తనలోని నీతిమంతుని స్వభావ వర్ణనకు అనుగుణమైన సాధారణ అర్థాన్ని ప్రధాన పాఠంలో స్వీకరించి, అక్షరార్థపు అస్పష్టతను పాదటిప్పణిలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మొదటి క్లాజులోని హెబ్రీ సంక్షిప్తత, నిష్క్రియాత్మక రూపాలు సాధ్యమైనంతవరకు నిలుపబడ్డాయి. రెండవ వాక్యంలో తెలుగు సహజత్వం కోసం ‘ప్రమాణం చేసినా … మాట మార్చడు’ అనే నిర్మాణం వాడబడింది.
