source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְ֭הֹוָה מִי יָג֣וּר בְּ/אָהֳלֶ֑/ךָ מִֽי יִ֝שְׁכֹּ֗ן בְּ/הַ֣ר קָדְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/000.yaml
  text: A psalm of David[a]. Yahweh[b], who may dwell in your tent? Who may live on your holy mountain?
translation:
  language: te
  text: 'దావీదు కీర్తన.[a]


    యెహోవా, నీ గుడారంలో ఎవరు తాత్కాలికంగా నివసించగలరు?[b]


    నీ పరిశుద్ధ పర్వతంపై ఎవరు స్థిరంగా నివసించగలరు?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దావీదు రచించిన కీర్తన,’ ‘దావీదుకు చెందిన కీర్తన,’ లేదా ‘దావీదుకు అంకితమైన కీర్తన’; హీబ్రూ శీర్షిక రచనను, సంబంధాన్ని లేదా అంకితాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూలో అక్షరార్థం ‘గుడారం’; ఇది దేవుని నివాసస్థలమైన పరిశుద్ధ గుడారాన్ని సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: దావీదు కీర్తన
  rationale: సహజమైన తెలుగు శీర్షికగా ఉంది; לְ ఉపసర్గ సూచించగల రచన, సంబంధం లేదా అంకితం అనే భావాలను పాదటిప్పణిలో నిలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని సాధారణ తెలుగు బైబిలు వాడుకలో గుర్తించదగిన రూపంలో ప్రత్యక్షంగా ఉంచుతుంది.
- source_word: יָגוּר
  choice: నివసించగలరు
  rationale: గుడారంలో అతిథిగా లేదా తాత్కాలిక నివాసిగా ఉండటం అనే మూలభావాన్ని ప్రశ్న యొక్క సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּאָהֳלֶךָ
  choice: నీ గుడారంలో
  rationale: ‘గుడారం’ అనే ప్రత్యక్ష రూపకాన్ని నిలిపి, అది దేవుని పరిశుద్ధస్థలాన్ని సూచించవచ్చని పాదటిప్పణిలో తెలిపాం.
- source_word: יִשְׁכֹּן
  choice: స్థిరంగా ఉండగలరు
  rationale: మొదటి క్రియతో ఉన్న సమాంతరతను కాపాడుతూనే, స్థిరనివాస భావాన్ని స్పష్టంగా చూపుతుంది.
- source_word: בְּהַר קָדְשֶׁךָ
  choice: నీ పరిశుద్ధ పర్వతంపై
  rationale: మూలంలోని స్వామ్యసూచనను, పరిశుద్ధతను, పర్వత రూపకాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: దేవుని గుడారంలో నివసించడం అనే భాష
  choice: రూపకాన్ని ‘నీ గుడారంలో’ అని యథాతథంగా నిలిపాం
  alternative: ‘నీ పరిశుద్ధస్థలంలో’ అని అర్థాన్ని విప్పి అనువదించడం
  rationale: మూలంలోని గుడార రూపకం దేవుని సన్నిధి మరియు ఆలయ సంబంధాన్ని సూచించినా, దానిని అనువాదంలో ఒక్క అర్థానికి పరిమితం చేయలేదు.
- issue: ప్రవేశానికి అర్హతను ప్రశ్నించే క్రియల భావం
  choice: ‘నివసించగలరు / స్థిరంగా ఉండగలరు’
  alternative: ‘నివసించడానికి ఎవరు అర్హులు’
  rationale: ‘అర్హులు’ అనే భావం సందర్భంలో అంతర్లీనంగా ఉన్నా, హీబ్రూ ప్రశ్నలో ప్రత్యక్షంగా లేనందున దానిని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. దేవునికి సంబోధనలో ఏకవచన ‘నీ’ను ఉంచి, ప్రశ్నలో అనిర్దిష్ట వ్యక్తిని గౌరవబహువచన క్రియలతో సహజంగా వ్యక్తం చేశాం.
