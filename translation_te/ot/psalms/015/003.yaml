  edition: WLC
  text: לֹֽא רָגַ֨ל עַל לְשֹׁנ֗/וֹ לֹא עָשָׂ֣ה לְ/רֵעֵ֣/הוּ רָעָ֑ה וְ֝/חֶרְפָּ֗ה לֹא נָשָׂ֥א עַל קְרֹֽב/וֹ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/003.yaml
  text: He does not slander with his tongue[a], does not do evil to his neighbor[c][b], and does not bear reproach against his close one.
translation:
  language: te
  text: తన నాలుకతో అపనిందలు చెప్పడు[a]; తన పొరుగువానికి కీడు చేయడు[b]; తన సన్నిహితునిపై నింద మోపడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తన నాలుకతో చాడీలు చెబుతూ తిరగడు.’
    reason: lexical_alternative
  - marker: b
    text: ‘పొరుగువాడు’ అని అనువదించిన హీబ్రూ పదానికి ‘స్నేహితుడు’ లేదా ‘సహచరుడు’ అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘సన్నిహితుడు’ అని అనువదించిన హీబ్రూ పదం బంధువును, దగ్గరి సహచరుణ్ణి, లేదా తన సమాజంలో దగ్గరగా ఉన్న వ్యక్తిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָגַל עַל לְשֹׁנוֹ
  choice: తన నాలుకతో అపనిందలు చెప్పడు
  rationale: ఈ ప్రయోగం ఇతరులకు వ్యతిరేకంగా చెడ్డ మాటలు ప్రచారం చేయడాన్ని, అంటే అపనింద లేదా చాడీలు చెప్పడాన్ని సూచిస్తుంది. ‘నాలుకతో’ అనే రూపం మూలంలోని స్పష్టమైన శరీరాంగ చిత్రణను నిలుపుతుంది.
- source_word: עָשָׂה ... רָעָה
  choice: కీడు చేయడు
  rationale: రָעָה ఇక్కడ నైతిక చెడు, అన్యాయం, హాని అనే విస్తృత భావాన్ని కలిగి ఉంది. సహజమైన ఆధునిక తెలుగులో ‘కీడు చేయడు’ ఆ విస్తృతిని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לְרֵעֵהוּ
  choice: తన పొరుగువానికి
  rationale: רֵעַ స్నేహితుడు, సహచరుడు, లేదా సమాజంలోని తోటి వ్యక్తిని సూచించవచ్చు. ఈ నైతిక సందర్భంలో ‘పొరుగువాడు’ దాని విస్తృత సామాజిక పరిధిని తెలియజేస్తుంది.
- source_word: חֶרְפָּה
  choice: నిందను
  rationale: ఈ పదం అవమానం, నింద, తిరస్కారంతో కూడిన మాట అనే భావాలను కలిగి ఉంది. సందర్భంలోని మాటల ద్వారా కలిగే సామాజిక అవమానాన్ని ‘నింద’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: נָשָׂא ... עַל
  choice: వ్యతిరేకంగా ... మోపడు
  rationale: נָשָׂא యొక్క ప్రాథమిక ‘ఎత్తు/మోయు’ భావాన్ని ‘మోపడు’ నిలుపుతుంది; עַל‌తో కలిసి ఇది మరొకరిపై నిందను మోపడం లేదా వారి మీద నిందను చేపట్టడం అనే భావాన్ని ఇస్తుంది.
- source_word: קְרֹבוֹ
  choice: తన సన్నిహితునికి
  rationale: קָרוֹב దగ్గరగా ఉన్నవాడు, బంధువు, లేదా సన్నిహిత సహచరుడిని సూచించవచ్చు. ‘సన్నిహితుడు’ రక్తసంబంధానికి మాత్రమే పరిమితం చేయకుండా సంబంధపు దగ్గరితనాన్ని నిలుపుతుంది.
