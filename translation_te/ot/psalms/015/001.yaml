source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְ֭הֹוָה מִי יָג֣וּר בְּ/אָהֳלֶ֑/ךָ מִֽי יִ֝שְׁכֹּ֗ן בְּ/הַ֣ר קָדְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/001.yaml
  text: A psalm of David[a]. O Yahweh[b], who may sojourn in your tent? Who may dwell on your holy mountain?
translation:
  language: te
  text: 'దావీదు కీర్తన.[a]


    యాహ్వే, ఎవరు నీ గుడారంలో[b] బస చేయగలరు?


    ఎవరు నీ పరిశుద్ధ పర్వతంపై నివసించగలరు?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దావీదు రచించిన కీర్తన,’ లేదా ‘దావీదుకు అంకితమైన కీర్తన.’ హీబ్రూ శీర్షిక రచనను, సంబంధాన్ని లేదా అంకితాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘పవిత్ర గుడారంలో.’ హీబ్రూలో అక్షరార్థంగా ‘గుడారం’ అని ఉంది; ఇక్కడ అది దేవుని నివాసమైన పరిశుద్ధస్థలాన్ని సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: కీర్తనల గ్రంథంలోని ఈ శీర్షిక పదానికి సహజమైన, స్థిరపడిన తెలుగు సమానార్థకం.
- source_word: לְדָוִד
  choice: దావీదు కీర్తన
  rationale: తెలుగులో సహజమైన శీర్షికగా ఉండటంతో పాటు, హీబ్రూ לְ సూచించగల రచన, సంబంధం, అంకితం అనే అవకాశాల్లో ఒక్కదానినే ఖచ్చితంగా నిర్ణయించదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: יָגוּר
  choice: బస చేయగలవాడు
  rationale: גור లోని పరదేశిగా లేదా అతిథిగా కొంతకాలం ఉండే భావాన్ని ‘నివసించు’ కంటే ‘బస చేయు’ సహజంగా తెలియజేస్తుంది; తరువాతి పాదంలోని שׁכן తో ఉన్న భేదాన్ని కూడా నిలుపుతుంది.
- source_word: בְּאָהֳלֶךָ
  choice: నీ గుడారంలో
  rationale: אֹהֶל యొక్క ప్రత్యక్షమైన దృశ్యార్థాన్ని నిలుపుతూ, దేవుని పరిశుద్ధస్థలాన్ని సూచించే సందర్భార్థానికీ అవకాశం ఇస్తుంది.
- source_word: יִשְׁכֹּן
  choice: నివసించగలవాడు
  rationale: שׁכן సూచించే స్థిరంగా నివసించే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, మొదటి పాదంలోని ‘బస చేయు’తో సమాంతర భేదాన్ని నిలుపుతుంది.
- source_word: בְּהַר קָדְשֶׁךָ
  choice: నీ పరిశుద్ధ పర్వతంపై
  rationale: హీబ్రూ నిర్మాణానికి నమ్మకంగా ఉండే సహజ తెలుగు రూపం; הַר ను ‘కొండ’గా తగ్గించకుండా ‘పర్వతం’గా అనువదించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా కాపాడుతుంది.
- issue: לְדָוִד లోని సంబంధం
  choice: దావీదు కీర్తన
  alternative: దావీదు రచించిన కీర్తన; దావీదుకు అంకితమైన కీర్తన
  rationale: హీబ్రూ ఉపసర్గ రచయిత, సంబంధం లేదా అంకితం అనే భావాలను సూచించవచ్చు; ప్రధాన పాఠం వాటిలో ఒక్కదానినే నిర్బంధంగా ఎంచుకోదు.
- issue: గుడారం యొక్క పరిశుద్ధస్థల సూచన
  choice: గుడారం
  alternative: ప్రత్యక్ష గుడారం; నివాసస్థలం
  rationale: మూలంలోని concrete image ను నిలుపుతూ, అది దేవుని పరిశుద్ధస్థలాన్ని సూచిస్తుందనే సందర్భార్థాన్ని పాఠకుడు గ్రహించేందుకు వీలు కల్పిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కవితా శైలిని ఉపయోగించాం. రెండు ప్రశ్నల సమాంతర నిర్మాణాన్ని, ‘బస చేయు/నివసించు’ అనే మూలపాఠంలోని సూక్ష్మ భేదాన్ని నిలిపాం. మూల సూచనలో tent-కు సంబంధించిన [b] గుర్తు దైవనామం వద్ద కనిపించిన అసంగతిని సరిచేసి ‘గుడారం’ వద్ద ఉంచాం.
