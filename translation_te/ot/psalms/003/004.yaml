  text: With my voice I cry to Yahweh[a], and he answers me from his holy mountain[b]. Selah
translation:
  language: te
  text: 'నా స్వరంతో యహ్వేకు మొరపెడతాను;


    ఆయన తన పరిశుద్ధ పర్వతం[b] నుండి నాకు జవాబిస్తాడు[a].


    సెలా'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన తన పరిశుద్ధ పర్వతం నుండి నాకు జవాబిచ్చాడు.” సందర్భాన్ని బట్టి హెబ్రీ క్రియను భూతకాలంలో కూడా అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “పరిశుద్ధ కొండ.” హెబ్రీ పదానికి ప్రాథమిక అర్థం ‘పర్వతం’; ఇక్కడ అది బహుశా సీయోనును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֭וֹלִי
  choice: నా స్వరంతో
  rationale: ‘నా స్వరం’ అనే నామవాచక భావాన్నీ, ప్రార్థనను స్వరంతో చేస్తున్న సాధనార్థాన్నీ కాపాడుతుంది; హెబ్రీ వాక్యంలోని ముందుంచడాన్ని కూడా ప్రతిబింబిస్తుంది.
- source_word: אֶל
  choice: కు
  rationale: ప్రార్థన యహ్వే వైపు ఉద్దేశించబడిందనే దిశార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: אֶקְרָא
  choice: మొరపెడతాను
  rationale: కీర్తనలోని ఆపద సందర్భానికి తగినట్లుగా ప్రార్థనలో బిగ్గరగా పిలిచే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיַּעֲנֵנִי
  choice: నాకు జవాబిస్తాడు
  rationale: కీర్తనకర్త నమ్మకాన్ని సజీవ వర్తమానంలో వ్యక్తం చేస్తుంది; భూతకాల అనువాదం కూడా సాధ్యమే కాబట్టి పాదసూచికలో ఉంచబడింది.
- source_word: מֵהַר קָדְשׁוֹ
  choice: తన పరిశుద్ధ పర్వతం నుండి
  rationale: הַר అనే పదానికి ప్రాథమికమైన ‘పర్వతం’ అర్థాన్ని కాపాడుతూ, దేవునికి చెందిన పరిశుద్ధ స్థలాన్ని సహజంగా సూచిస్తుంది.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఈ పదం యొక్క ఖచ్చితమైన విధి అనిశ్చితమైనందున వ్యాఖ్యానాత్మక అర్థాన్ని రుద్దకుండా లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా లేదా ‘ప్రభువు’
  rationale: హెబ్రీ మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; దానిని బిరుదుగా మార్చకుండా ‘యహ్వే’ అని లిప్యంతరీకరించడం మూలపాఠానికి దగ్గరగా ఉంటుంది.
- issue: וַיַּעֲנֵנִי క్రియ యొక్క కాలభావం
  choice: వర్తమానం—‘జవాబిస్తాడు’
  alternative: భూతకాలం—‘జవాబిచ్చాడు’
  rationale: హెబ్రీ కవిత్వంలో ఈ రూపం సందర్భానుసారం గత సంఘటనగా గానీ, సజీవమైన లేదా లక్షణాత్మక చర్యగా గానీ గ్రహించవచ్చు. ప్రధాన పాఠం వర్తమాన నమ్మకాన్ని చూపుతుంది; భూతకాల అవకాశాన్ని పాదసూచికలో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. హెబ్రీ కవితా పంక్తుల సమాంతరతను నిలుపుతూ సహజమైన తెలుగు పదక్రమం పాటించబడింది; ‘సెలా’ అనువదించకుండా ఉంచబడింది.
