  text: Salvation belongs to Yahweh[a]; your blessing be on your people[b]. Selah
translation:
  language: te
  text: రక్షణ యాహ్వేదే; నీ ప్రజలపై నీ ఆశీర్వాదం[a]. సెలా[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యభాగంలో క్రియ లేదు; దీనిని “నీ ప్రజలపై నీ ఆశీర్వాదం ఉంది” అనే ప్రకటనగానీ, “నీ ప్రజలపై నీ ఆశీర్వాదం ఉండుగాక” అనే ప్రార్థనగానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “సెలా” బహుశా ఆరాధనా లేదా సంగీత సూచన; దాని ఖచ్చితమైన అర్థం తెలియదు.
    reason: cultural_note
lexical_decisions:
- source_word: לַיהוָה
  choice: యాహ్వేదే
  rationale: లְ ఉపసర్గ ఇక్కడ సంబంధం లేదా స్వామ్యాన్ని సూచిస్తుంది. అందువల్ల రక్షణ యాహ్వేకు చెందినదని తెలిపే భావాన్ని సహజమైన తెలుగులో ‘యాహ్వేదే’ అని అందించాం.
- source_word: הַיְשׁוּעָה
  choice: రక్షణ
  rationale: ఈ నామవాచకం కాపాడటం, విడిపించడం అనే భావాలను సూచిస్తుంది. ‘రక్షణ’ తక్షణ విమోచన భావంతో పాటు విస్తృతమైన ధార్మిక ప్రతిధ్వనినీ నిలుపుతుంది.
- source_word: עַל
  choice: పై
  rationale: ఆశీర్వాదం ప్రజలపై నిలిచి ఉండటం అనే సంబంధాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עַמְּךָ
  choice: నీ ప్రజలు
  rationale: దేవునితో సంబంధమున్న సమాజాన్ని సూచించే עַם పదానికి ‘ప్రజలు’ సహజమైన, విస్తృతమైన అనువాదం.
- source_word: בִרְכָתֶךָ
  choice: నీ ఆశీర్వాదం
  rationale: בְּרָכָה పదానికి నేరమైన సమానార్థకం ‘ఆశీర్వాదం’; ‘అనుగ్రహం’ కంటే ఇది మూలపద పరిధిని మెరుగ్గా నిలుపుతుంది.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఈ పదం యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం; ఇది బహుశా ఆరాధనా లేదా సంగీత సూచన. ఊహాత్మకంగా అనువదించకుండా లిప్యంతరీకరించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో దేవుని ప్రత్యేక నిబంధన నామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: రెండవ క్రియారహిత వాక్యభాగం యొక్క భావం
  choice: నీ ప్రజలపై నీ ఆశీర్వాదం ఉండుగాక
  alternative: నీ ఆశీర్వాదం నీ ప్రజలపై ఉంది
  rationale: హీబ్రూ వాక్యభాగంలో క్రియ లేదు; అది ప్రార్థనగానూ ప్రకటనగానూ అర్థమవుతుంది. కీర్తన సందర్భంలోని ప్రార్థనా స్వరాన్ని ప్రధాన పాఠంలో సహజంగా వ్యక్తపరచి, ప్రకటనాత్మక పఠనాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కీర్తనా శైలిని వాడాం. ‘యాహ్వేదే’ అనే సంక్షిప్త నిర్మాణం స్వామ్య భావాన్ని బలంగా, సహజంగా తెలియజేస్తుంది. పాదసూచిక గుర్తులు రెండూ ప్రధాన పాఠంలో సంబంధిత పదబంధాల వద్ద ఉంచబడ్డాయి.
