source:
  edition: WLC
  text: יְ֭הוָה מָֽה רַבּ֣וּ צָרָ֑/י רַ֝בִּ֗ים קָמִ֥ים עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/001.yaml
  text: O Yahweh[a], how many are my adversaries! Many are rising up against me.
translation:
  language: te
  text: యాహ్వే[a], నా విరోధులు ఎంతగా పెరిగిపోయారు! నాకు విరోధంగా లేస్తున్నవారు ఎందరో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: ‘యాహ్వే’; ఇది దేవుని ప్రత్యేక నామం.'
    reason: దైవనామానికి వివరణ
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: מָה רַבּוּ
  choice: ఎంతగా పెరిగిపోయారు
  rationale: מָה ఇక్కడ ప్రశ్నార్థకం కాక ఆశ్చర్యార్థకంగా ఉంది; רבה యొక్క సంపూర్ణ క్రియారూపం విరోధుల సంఖ్య విపరీతంగా పెరిగిన స్థితిని సూచిస్తుంది.
- source_word: צָרָי
  choice: నా విరోధులు
  rationale: ఈ పదం కీర్తనకర్తకు శత్రుత్వంగా ఎదురు నిలిచేవారిని సూచిస్తుంది; ‘విరోధులు’ సైనిక సందర్భాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: רַבִּים
  choice: ఎందరో
  rationale: వాక్యారంభంలోని బహుత్వ ఉద్ఘాటనను సహజమైన, సంక్షిప్తమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: קָמִים עָלָי
  choice: నాకు విరోధంగా లేస్తున్నవారు
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న చర్యను తెలియజేస్తుంది; קום తో עַל కలిసినప్పుడు శత్రుత్వంగా ఎదురు నిలవడం అనే భావం వస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; విలాపంలోని ఆశ్చర్యం, విరోధుల పెరుగుదల, కొనసాగుతున్న శత్రుత్వ చర్య స్పష్టంగా ఉండేలా సహజమైనప్పటికీ గంభీరమైన శైలి వాడబడింది.
