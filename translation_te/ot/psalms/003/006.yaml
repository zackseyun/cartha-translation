  yaml_path: translation/ot/psalms/003/006.yaml
  text: I will not fear myriads of people who have set themselves all around me[a].
translation:
  language: te
  text: నా చుట్టూ మోహరించిన పదివేలకొద్దీ ప్రజలకు నేను భయపడను[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అన్ని వైపులా నాకు విరోధంగా మోహరించిన పదివేలకొద్దీ ప్రజలు.”
    reason: עָלָי అనే పదానికి ‘నా మీద/నాకు విరోధంగా’ అనే భావం ఉండవచ్చు; ఈ ప్రత్యామ్నాయం శత్రుత్వాన్ని మరింత స్పష్టంగా చూపుతుంది.
lexical_decisions:
- source_word: לֹא אִירָא
  choice: నేను భయపడను
  rationale: నిషేధంతో కూడిన అసంపూర్ణ క్రియ సందర్భంలో నమ్మకంతో కూడిన దృఢనిశ్చయాన్ని వ్యక్తం చేస్తుంది; ఆధునిక తెలుగులో ఈ రూపం సహజంగా ఉంది.
- source_word: מֵרִבְבוֹת עָם
  choice: అసంఖ్యాక ప్రజలకు
  rationale: רבבות అత్యంత పెద్ద సంఖ్యను, అక్షరార్థంగా ‘పదివేలల’ను సూచిస్తుంది. ‘అసంఖ్యాక’ విస్తారమైన జనసమూహ భావాన్ని సహజంగా తెలియజేస్తుంది; ירא తరువాతి מִן‌ను తెలుగులో భయానికి కారణం/విషయాన్ని సూచించే ‘కు’తో వ్యక్తం చేశాం.
- source_word: סָבִיב
  choice: నా చుట్టూ
  rationale: అన్ని వైపులా చుట్టుముట్టిన స్థలచిత్రాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: שָׁתוּ
  choice: మోహరించిన
  rationale: ‘పెట్టారు/నిలిపారు’ అనే మూలభావం ఈ శత్రుత్వ సందర్భంలో తమను తాము అమర్చుకొని నిలిచిన జనసమూహాన్ని సూచిస్తుంది; ‘మోహరించిన’ సైనికసదృశ స్థానబద్ధతను సహజంగా తెలియజేస్తుంది.
- source_word: עָלָי
  choice: నా చుట్టూ
  rationale: సָבִיב‌తో కలిసి ఇది కీర్తనకర్తను చుట్టుముట్టిన దృశ్యాన్ని ఇస్తుంది; అయితే ‘నాకు విరోధంగా’ అనే శత్రుత్వ ఛాయ కూడా సాధ్యమైనందున దానిని పాదటిప్పణిలో నిలిపాం.
