  yaml_path: translation/ot/psalms/003/002.yaml
  text: Many are saying of me[c][b][a], “There is no salvation for him in God.” Selah
translation:
  language: te
  text: 'అనేకులు నా గురించి ఇలా అంటున్నారు: “దేవునిలో అతనికి రక్షణ లేదు.”[a] సెలా.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రక్షణ’ అనే పదాన్ని ‘విడుదల’ అని కూడా అనువదించవచ్చు. ‘దేవునిలో’ అనే మాటను సందర్భానుసారం ‘దేవుని నుండి’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘సెలా’ బహుశా సంగీతానికి లేదా ఆరాధనా విధానానికి సంబంధించిన పదం; దాని ఖచ్చితమైన అర్థం తెలియదు.
    reason: cultural_note
lexical_decisions:
- source_word: רַבִּים
  choice: అనేకులు
  rationale: విశేషణం ఇక్కడ నామవాచకంగా వాడబడి, అనేకమంది వ్యక్తులను సూచిస్తోంది. ‘అనేకులు’ సంక్షిప్తంగా, సహజంగా ఆ అనిశ్చిత బహువచన భావాన్ని నిలుపుతుంది.
- source_word: אֹמְרִים
  choice: ఇలా అంటున్నారు
  rationale: హీబ్రూ వర్తమాన క్రియావిశేషణ రూపం కొనసాగుతున్న లేదా పదేపదే జరుగుతున్న మాటను సూచిస్తుంది; ‘అంటున్నారు’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: לְנַפְשִׁי
  choice: నన్ను గురించి
  rationale: అక్షరార్థంగా ‘నా ప్రాణానికి/నా ఆత్మకు’; అయితే נֶפֶשׁ ఇక్కడ వ్యక్తిని లేదా స్వయాన్ని సూచించే హీబ్రూ నుడికారం. ‘నన్ను గురించి’ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֵין
  choice: లేదు
  rationale: ఇది అస్తిత్వ నిరాకరణ. తెలుగు వాక్య నిర్మాణంలో ‘లేదు’ సహజమైన సమానార్థకం.
- source_word: יְשׁוּעָתָה
  choice: రక్షణ
  rationale: ישׁע మూలం నుంచి వచ్చిన ఈ పదం విడిపింపు, కాపాడటం, రక్షణ అనే భావాలను కలిగి ఉంది. ‘రక్షణ’ తక్షణ అపాయం నుంచి కాపాడబడటమనే భావంతోపాటు కీర్తనలలోని విస్తృత దైవశాస్త్రీయ ప్రతిధ్వనిని కూడా నిలుపుతుంది.
- source_word: לּוֹ
  choice: అతనికి
  rationale: శత్రువులు కీర్తనకర్తను మూడవ పురుషంలో ప్రస్తావిస్తున్నారు; ‘అతనికి’ మూలంలోని సూచనను నేరుగా నిలుపుతుంది.
- source_word: בֵאלֹהִים
  choice: దేవునిలో
  rationale: בְּ ఉపసర్గానికి ప్రాథమికంగా ‘లో’ అనే అర్థం ఉంది. ‘దేవునిలో’ మూలరూపాన్ని, అలాగే దేవునియందు రక్షణ లభించదనే శత్రువుల వాదనను సంరక్షిస్తుంది; ‘దేవుని నుండి’ అనేది సాధ్యమైన భావవ్యాఖ్య అయినా మరింత వివరణాత్మకం.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఈ పదం యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం. ఊహాత్మక అర్థాన్ని చేర్చకుండా లిప్యంతరీకరించడం మూలానికి పారదర్శకంగా ఉంటుంది.
theological_decisions:
- issue: יְשׁוּעָה పదాన్ని ‘విడుదల’గా లేదా ‘రక్షణ’గా అనువదించాలా
  choice: రక్షణ
  alternative: విడుదల; సహాయం
  rationale: సందర్భంలో ప్రత్యక్షమైన అపాయం నుంచి కాపాడటం ప్రధాన భావమైనప్పటికీ, ‘రక్షణ’ దానిని కలిగి ఉండి కీర్తనలలో పదానికి ఉన్న విస్తృత దైవశాస్త్రీయ బరువును కూడా అతిశయోక్తి లేకుండా నిలుపుతుంది.
- issue: לְנַפְשִׁי అనే నుడికారాన్ని అక్షరార్థంగా ఉంచాలా లేక భావానువాదం చేయాలా
  choice: నన్ను గురించి
  alternative: నా ప్రాణానికి; నా ఆత్మతో
  rationale: נֶפֶשׁ ఇక్కడ సంపూర్ణ వ్యక్తిని సూచిస్తుంది. అక్షరార్థ అనువాదం ఆధునిక తెలుగు పాఠకునికి అంతరంగం లేదా ఆత్మను మాత్రమే ఉద్దేశించినట్లు తప్పుదారి పట్టించవచ్చు.
- issue: בֵאלֹהִים లోని ఉపసర్గను ఎలా ప్రతిబింబించాలి
  choice: దేవునిలో
  alternative: దేవుని నుండి; దేవునియందు
  rationale: ‘దేవునిలో’ హీబ్రూ ఉపసర్గకు దగ్గరగా ఉండి, ఉద్దేశపూర్వకంగా ఉన్న సంబంధార్థపు విస్తృతిని కాపాడుతుంది. ‘దేవుని నుండి’ రక్షణ మూలాన్ని స్పష్టం చేస్తుంది గాని మూలంలో లేని దిశార్థాన్ని బలపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా కీర్తనకు తగిన గంభీరతతో రూపొందించబడింది. ‘నన్ను గురించి’ హీబ్రూ నుడికారాన్ని సహజంగా అందిస్తుంది; ‘దేవునిలో’ మూలంలోని భావసందిగ్ధతను ఉద్దేశపూర్వకంగా నిలుపుతుంది.
