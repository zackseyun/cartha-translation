  text: I lay down and slept[a]; I awoke[b], because Yahweh sustains me.
translation:
  language: te
  text: 'నేను పడుకొని నిద్రపోయాను;

    నేను మేల్కొన్నాను,

    ఎందుకంటే యాహ్వే నన్ను నిలబెడుతున్నాడు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా, ‘నన్ను ఆదుకుంటున్నాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכַבְתִּי
  choice: నేను పడుకొని
  rationale: שׁכב అనే క్రియ ఇక్కడ ‘పడుకోవడం’ అనే సాధారణ అర్థాన్ని ఇస్తుంది. తరువాతి ‘నిద్రపోయాను’తో సహజంగా కలిసేలా తెలుగు సంయుక్త క్రియారూపం వాడబడింది.
- source_word: וָאִישָׁנָה
  choice: నిద్రపోయాను
  rationale: ישׁן అంటే ‘నిద్రపోవడం.’ సంక్షిప్తమైన కవితా క్రమాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: הֱקִיצוֹתִי
  choice: నేను మేల్కొన్నాను
  rationale: קיץ అనే క్రియకు ‘మేల్కొను’ అనే అర్థం. ఇక్కడ కీర్తనకర్త తానే నిద్రనుంచి మేల్కొన్నాడనే అకర్మక భావం ఉంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: కీర్తనకర్త సురక్షితంగా మేల్కొనడానికి కారణాన్ని పరిచయం చేసే కారణార్థక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితుల ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: יִסְמְכֵנִי
  choice: నన్ను నిలబెడుతున్నాడు
  rationale: סמך అంటే ‘ఆధారమివ్వడం, నిలబెట్టడం, సంరక్షించడం.’ అసంపూర్ణ క్రియారూపంలోని కొనసాగుతున్న దైవిక ఆధార భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని ఒక బిరుదుగా మార్చకుండా పేరుగానే ఉంచడం మూలానికి దగ్గరగా ఉంటుంది; ‘యాహ్వే’ హీబ్రూ నామానికి విస్తృతంగా అంగీకరించబడిన ఉచ్చారణను ప్రతిబింబిస్తుంది.
- issue: יִסְמְכֵנִי లోని దైవిక ఆధార భావం
  choice: నన్ను నిలబెడుతున్నాడు
  alternative: నాకు అండగా ఉన్నాడు; నన్ను ఆదుకుంటున్నాడు
  rationale: క్రియలోని ‘ఆధారమిచ్చి నిలబెట్టడం’ అనే రూపకాన్ని నిలుపుతూ, అది శారీరకమా ఆత్మీయమా అని అవసరానికి మించి నిర్దిష్టం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అదే సమయంలో కీర్తనలోని సంక్షిప్తమైన గంభీర కవితా ధోరణిని నిలుపుతూ అనువదించబడింది. వరుస చర్యలను చూపేందుకు మొదటి పాదంలో సహజమైన సంయుక్త నిర్మాణం వాడబడింది.
