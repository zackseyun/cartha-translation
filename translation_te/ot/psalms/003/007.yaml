source:
  edition: WLC
  text: ק֘וּמָ֤/ה יְהוָ֨ה הוֹשִׁ֘יעֵ֤/נִי אֱלֹהַ֗/י כִּֽי הִכִּ֣יתָ אֶת כָּל אֹיְבַ֣/י לֶ֑חִי שִׁנֵּ֖י רְשָׁעִ֣ים שִׁבַּֽרְתָּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/007.yaml
  text: Rise up[a], O Yahweh; save me, my God. For you have struck all my enemies on the cheek; you have broken the teeth of the wicked.
translation:
  language: te
  text: యెహోవా, లేచి రా; నా దేవా, నన్ను రక్షించు. ఎందుకంటే నీవు నా శత్రువులందరినీ చెంపపై కొట్టావు[a]; దుష్టుల పళ్లు విరగ్గొట్టావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చెంపపై’ అనే మాటకు ‘దవడపై’ అని కూడా అర్థం కావచ్చు. ‘కొట్టావు,’ ‘విరగ్గొట్టావు’ అనే హీబ్రూ క్రియలు పూర్తయిన చర్యను సూచించవచ్చు; కవితాత్మక సందర్భంలో నిశ్చయంగా జరిగే లేదా దేవుడు సాధారణంగా చేసే కార్యాన్ని కూడా సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמָה
  choice: లేచి రా
  rationale: קום ధాతువు యొక్క ఆజ్ఞార్థక రూపం. దేవుడు జోక్యం చేసుకోవాలనే సజీవమైన విజ్ఞప్తిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరంగా వాడుకలో ఉన్న లిప్యంతరీకరణతో అందించింది.
- source_word: הוֹשִׁיעֵנִי
  choice: నన్ను రక్షించు
  rationale: ישׁע యొక్క హిఫీల్ ఆజ్ఞార్థక రూపం మరియు ఏకవచన ప్రథమ పురుష ప్రత్యయం. తక్షణ విమోచనతో పాటు విస్తృతమైన రక్షణ భావాన్నీ నిలుపుతుంది.
- source_word: אֱלֹהַי
  choice: నా దేవా
  rationale: సంబోధనలోని వ్యక్తిగత అనుబంధాన్ని సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: విజ్ఞప్తికి ఆధారాన్ని తెలిపే కారణార్థక లేదా వివరణాత్మక సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הִכִּיתָ
  choice: కొట్టావు
  rationale: హీబ్రూ పరిపూర్ణ క్రియను పూర్తయిన చర్యగా నేరుగా అందిస్తుంది; కవితాత్మక సందర్భంలో నిశ్చయార్థక భావం సాధ్యమైనప్పటికీ దానిని పాఠ్యంలో ఏకపక్షంగా నిర్ణయించదు.
- source_word: אֶת כָּל אֹיְבַי
  choice: నా శత్రువులందరినీ
  rationale: ప్రత్యక్ష కర్మను మరియు 'అందరు' అనే సమగ్ర భావాన్ని పారదర్శకంగా నిలుపుతుంది.
- source_word: לֶחִי
  choice: చెంపపై
  rationale: לֶחִי అనేది చెంప లేదా దవడను సూచించగలదు. 'చెంపపై కొట్టావు' తెలుగులో సహజంగా ఉండి అవమానం మరియు ఓటమి చిత్రాన్ని నిలుపుతుంది; 'దవడపై' అనే సాధ్యతను పాదసూచికలో ఉంచింది.
- source_word: שִׁנֵּי רְשָׁעִים
  choice: దుష్టుల పళ్లు
  rationale: శరీర సంబంధమైన మూల చిత్రణను మృదుపరచకుండా, నామవాచకంగా వాడిన బహువచన విశేషణాన్ని సమూహార్థకంగా అందిస్తుంది.
- source_word: שִׁבַּרְתָּ
  choice: విరగ్గొట్టావు
  rationale: పళ్లను పూర్తిగా పనికిరాకుండా చేయడాన్ని సూచించే బలమైన, సహజమైన తెలుగు క్రియ; హీబ్రూ పరిపూర్ణ రూపాన్ని పూర్తయిన చర్యగా అందిస్తుంది.
theological_decisions:
- issue: ప్రార్థనా సందర్భంలో הִכִּיתָ, שִׁבַּרְתָּ అనే హీబ్రూ పరిపూర్ణ క్రియల కాలార్థం
  choice: 'భూత/పూర్తి భావం: ‘కొట్టావు ... విరగ్గొట్టావు’'
  alternative: 'నిశ్చయార్థక లేదా లక్షణార్థక వర్తమానం: ‘కొడతావు ... విరగ్గొడతావు’'
  rationale: రెండు క్రియల రూపాలు వ్యాకరణపరంగా పరిపూర్ణమైనవి కాబట్టి ప్రధాన పాఠ్యంలో పూర్తయిన చర్యను చూపడం మూలానికి సన్నిహితం. కవితాత్మక ప్రార్థనలో అవి నిశ్చయంగా జరగబోయే లేదా దేవుని సాధారణ కార్యాన్ని సూచించే అవకాశం ఉన్నందున ఆ ఉద్వేగాన్ని పాదసూచికలో గుర్తించింది.
- issue: శత్రువులపై హింసాత్మక శరీర చిత్రణ
  choice: చెంపపై కొట్టడం, పళ్లు విరగ్గొట్టడం అనే స్పష్టమైన చిత్రణను నిలుపడం
  alternative: ‘దుష్టులను ఓడించావు’ వంటి సారాంశ పరాభవ భాష
  rationale: మూలపాఠం అవమానాన్ని, దుష్టుల హాని చేసే శక్తిని నిర్మూలించడాన్ని సజీవమైన శరీర చిత్రాలతో చెబుతుంది. వాటిని మృదుపరచడం మూల కవిత్వాన్ని మరియు దాని ఉద్రేకాన్ని కోల్పోయేలా చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలిని వాడింది. ‘లేచి రా’ ప్రత్యక్ష విజ్ఞప్తి యొక్క ఉత్సాహాన్ని నిలుపుతుంది; ‘యెహోవా’ తెలుగు బైబిలు వాడుకలో పరిచితమైన దైవనామ రూపం. మూలంలోని కఠిన చిత్రణను సారాంశంగా మార్చలేదు.
