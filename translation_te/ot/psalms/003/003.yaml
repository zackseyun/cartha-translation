source:
  edition: WLC
  text: וְ/אַתָּ֣ה יְ֭הוָה מָגֵ֣ן בַּעֲדִ֑/י כְּ֝בוֹדִ֗/י וּ/מֵרִ֥ים רֹאשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/003.yaml
  text: But you[a], O Yahweh, are a shield around me, my glory[b], and the one who lifts up my head.
translation:
  language: te
  text: కానీ యాహ్వే, నీవు నా చుట్టూ డాలువై ఉన్నావు[a]; నీవే నా మహిమ, నా తలను పైకెత్తేవాడవు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాకు డాలువై’ లేదా ‘నా పక్షాన డాలువై.’ హీబ్రూ ఉపసర్గ ఒకరి మేలు కోసం లేదా పక్షాన కలిగే రక్షణను సూచించగలదు; ఇక్కడ చుట్టూ కాపాడే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘నా తలను పైకెత్తడం’ అనేది గౌరవాన్ని, ధైర్యాన్ని లేదా సమర్థనను తిరిగి కలిగించడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: అయితే … నీవు
  rationale: ముందటి వచనాల్లోని ఆపదకు బలమైన వ్యత్యాసాన్ని సూచిస్తూ, స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో మార్చకుండా, దాని సాధారణ ధ్వన్యంతరీకరణను తెలుగులో ఇస్తుంది.
- source_word: מָגֵן
  choice: డాలు
  rationale: శత్రువుల దాడి నుంచి రక్షించే ఆయుధమనే మూలపదపు స్పష్టమైన రూపకాన్ని నిలుపుతుంది.
- source_word: בַּעֲדִי
  choice: నా చుట్టూ
  rationale: ఈ విభక్తి ‘నా కోసం/నా పక్షంగా’ అనే అర్థాన్నీ ఇవ్వగలదు; అయితే ‘డాలు’తో కలిసిన సందర్భంలో చుట్టుముట్టే రక్షణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כְּבוֹדִי
  choice: నా మహిమ
  rationale: ‘మహిమ, ఘనత, గౌరవం’ అనే అర్థవిస్తృతిని కలిగిన కవితాత్మక పదాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וּ/מֵרִים
  choice: పైకెత్తేవాడవు
  rationale: హీబ్రూ క్రియావిశేషణ రూపం సూచించే నిరంతరమైన లేదా లక్షణాత్మకమైన కార్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: רֹאשִׁי
  choice: నా తలను
  rationale: గౌరవం, ధైర్యం లేదా నిర్దోషిత్వ పునరుద్ధరణను సూచించగల హీబ్రూ నుడికారంలోని దృశ్యరూపాన్ని యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది; ‘యాహ్వే’ దానికి సాధారణంగా అంగీకరించిన ధ్వన్యంతరీకరణను నిలుపుతుంది.
- issue: ‘నా తలను పైకెత్తేవాడు’ అనే నుడికారం
  choice: ముఖ్య పాఠంలో దృశ్యరూపాన్ని నిలుపడం
  alternative: నా గౌరవాన్ని పునరుద్ధరించేవాడవు
  rationale: ఈ రూపకం గౌరవం, ధైర్యం, సమర్థన వంటి పరస్పర సంబంధిత భావాలను మోస్తుంది; వాటిలో ఒక్కదానికే పాఠాన్ని పరిమితం చేయకుండా వివరణను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరమైన కీర్తనాశైలితో రూపొందించబడింది. ‘డాలు,’ ‘మహిమ,’ ‘తలను పైకెత్తడం’ అనే కవితాత్మక మూలచిత్రాలు నిలుపబడ్డాయి; సంభావ్య అర్థవిస్తృతిని పాదసూచికల్లో తెలిపాం.
