  edition: WLC
  text: מִזְמ֥וֹר לְ/דָוִ֑ד בְּ֝/בָרְח֗/וֹ מִ/פְּנֵ֤י אַבְשָׁל֬וֹם בְּנֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/000.yaml
  text: A psalm of David[a], when he fled from Absalom his son.
translation:
  language: te
  text: దావీదుకు చెందిన కీర్తన.[a] అతడు తన కుమారుడైన అబ్షాలోము నుండి పారిపోయినప్పుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దావీదు రచించిన కీర్తన,’ లేదా ‘దావీదు కోసం కీర్తన’; హీబ్రూ శీర్షిక రచయితత్వాన్ని, అంకితాన్ని లేదా అనుబంధాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: సంగీతాత్మక కవితా రచనను సూచించే శీర్షికా పదం; కీర్తనల గ్రంథ సందర్భంలో స్థిరపడిన, సహజమైన తెలుగు సమానార్థకం.
- source_word: לְדָוִד
  choice: దావీదుకు చెందిన
  rationale: לְ అనే ఉపసర్గ రచయితను, అంకితాన్ని, స్వామ్యాన్ని లేదా అనుబంధాన్ని సూచించగలదు. ‘దావీదుకు చెందిన’ అనేది ఒక్క భావానికే పరిమితం చేయకుండా ఆ విస్తృతిని నిలుపుతుంది.
- source_word: בְּבָרְחוֹ
  choice: అతడు ... పారిపోయినప్పుడు
  rationale: בְּ + ప్రత్యయంతో కూడిన infinitive construct ఇక్కడ కాలార్థాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘పారిపోయినప్పుడు’ సహజంగా ఉంటుంది.
- source_word: מִפְּנֵי
  choice: నుండి
  rationale: అక్షరార్థంగా ‘సన్నిధి నుండి/ముఖం ఎదుటనుండి’; పారిపోవడం అనే సందర్భంలో ‘నుండి’ సహజమైన భావానువాదం.
- source_word: אַבְשָׁלוֹם
  choice: అబ్షాలోము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో గుర్తించదగిన సంప్రదాయ రూపానికి సమీపంగా లిప్యంతరీకరించింది.
- source_word: בְּנוֹ
  choice: తన కుమారుడైన
  rationale: మూడవ పురుష ఏకవచన సంబంధాన్ని తెలుపుతుంది. ‘తన’ అనే రూపం పారిపోయిన దావీదుతో సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: దావీదు సంబంధిత శీర్షిక భావం
  choice: ‘దావీదుకు చెందిన’ అని అనువదించి సంబంధార్థక అస్పష్టతను నిలిపాం.
  alternative: ‘దావీదు రచించినది’ లేదా ‘దావీదు కోసం’
  rationale: కీర్తన శీర్షికలలో לְ రచయితత్వం, అంకితం, స్వామ్యం లేదా అనుబంధాన్ని సూచించవచ్చు. మూలపాఠం ఒక్క భావాన్ని నిర్బంధించదు కాబట్టి రచయితత్వాన్ని ఖచ్చితంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కీర్తన శీర్షికకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘దావీదుకు చెందిన’ అనే నిర్మాణం కొంత విస్తృతమైన సంబంధార్థాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది.
