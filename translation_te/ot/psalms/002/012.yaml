- from: కుమారుని[b] ముద్దుపెట్టండి[a]; లేకపోతే ఆయన కోపిస్తాడు, మీరు దారిలోనే నశిస్తారు. ఎందుకంటే ఆయన కోపం త్వరగా రగులుతుంది[c]. ఆయనను ఆశ్రయించే వారందరూ ధన్యులు.
