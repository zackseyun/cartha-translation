id: PSA.2.12
reference: Psalms 2:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: נַשְּׁקוּ בַ֡ר פֶּן יֶאֱנַ֤ף וְ/תֹ֬אבְדוּ דֶ֗רֶךְ כִּֽי יִבְעַ֣ר כִּ/מְעַ֣ט אַפּ֑/וֹ אַ֝שְׁרֵ֗י כָּל ח֥וֹסֵי בֽ/וֹ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/012.yaml
  text: Kiss the son[a], lest he be angry and you perish in the way, for his anger burns quickly[c][b]. Blessed are all who take refuge in him.
translation:
  language: te
  text: కుమారుని[b] ముద్దుపెట్టండి[a]; లేకపోతే ఆయన కోపిస్తాడు, మీరు దారిలో నశిస్తారు. ఎందుకంటే ఆయన కోపం త్వరగా రగులుతుంది[c]. ఆయనను ఆశ్రయించే వారందరూ ధన్యులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కుమారునికి ఘనత చెల్లించండి.” ఈ క్రియకు అక్షరార్థం “ముద్దుపెట్టండి”; రాజసంబంధ సందర్భంలో అది విధేయతను లేదా ఘనతను చూపే చర్యను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడున్న హీబ్రూ పదం బార్ అసాధారణమైనది. 7వ వచనానికి అనుగుణంగా సాధారణంగా దీనిని “కుమారుడు” అని అర్థం చేసుకుంటారు; అయితే “పవిత్రత” లేదా “నిష్కపటంగా” వంటి ఇతర అర్థాలూ ప్రతిపాదించబడ్డాయి.
    reason: alternative_reading
  - marker: c
    text: లేదా, “ఎందుకంటే ఆయన కోపం కొద్దిగా రగిలినా”; లేదా, “ఎందుకంటే ఆయన కోపం కొద్దిసేపట్లో రగులుతుంది.” హీబ్రూ ప్రయోగం సంక్షిప్తంగా ఉండి, ఆకస్మికతను గానీ స్వల్పతను గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַשְּׁקוּ
  choice: ముద్దుపెట్టండి
  rationale: ఈ బహువచన ఆజ్ఞారూప క్రియకు ప్రాథమిక అర్థం ‘ముద్దుపెట్టండి.’ రాజసంబంధ సందర్భంలో ఇది విధేయతను లేదా ఘనతను ప్రకటించే చర్యను సూచించవచ్చు; అయినా హీబ్రూ కవితా చిత్రాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: בַר
  choice: కుమారుని
  rationale: ఈ అరుదైన పదం 2:7లోని రాజకుమారుని నేపథ్యంతో బాగా సరిపోతుంది. అయితే దీనిని ‘పవిత్రత’ లేదా ‘నిష్కపటంగా’ అని అర్థం చేసుకునే ప్రతిపాదనలు ఉన్నందున ఆ అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: פֶּן
  choice: లేకపోతే
  rationale: ఆజ్ఞను పాటించకపోతే కలిగే ప్రతికూల ఫలితాన్ని ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: יֶאֱנַף
  choice: ఆయన కోపిస్తాడు
  rationale: క్రియలోని వ్యక్తిగత కర్తను స్పష్టంగా ఉంచుతూ కోపాన్ని నేరుగా వ్యక్తం చేస్తుంది; ‘ఆయన’ ఎవరిని సూచిస్తుందో పాఠ్యంలోని సహజ సంబంధాన్ని బలవంతంగా పరిష్కరించదు.
- source_word: וְתֹאבְדוּ דֶרֶךְ
  choice: మీరు దారిలోనే నశిస్తారు
  rationale: హీబ్రూలో విభక్తి సూచకం లేని సంక్షిప్త కవితా ప్రయోగాన్ని ‘దారిలోనే’ సహజంగా వ్యక్తం చేస్తుంది; నాశనం ఎలా జరుగుతుందో అదనంగా నిర్దిష్టం చేయదు.
- source_word: כִּי יִבְעַר כִּמְעַט אַפּוֹ
  choice: ఎందుకంటే ఆయన కోపం త్వరగా రగులుతుంది
  rationale: יבערలోని అగ్ని రూపకాన్ని ‘రగులుతుంది’ ద్వారా నిలిపి, כמעטను అకస్మాత్తుగా లేదా త్వరలో సంభవించడాన్ని సూచించేలా అనువదించాం. ‘కొద్దిగా రగిలినా’ అనే భావసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: אַשְׁרֵי
  choice: ధన్యులు
  rationale: కీర్తనలలోని శుభప్రకటన సూత్రానికి తగిన, గౌరవప్రదమైన మరియు సాధారణ ఆధునిక తెలుగు పదం.
- source_word: חֹסֵי בוֹ
  choice: ఆయనను ఆశ్రయించే వారు
  rationale: חסהలోని రక్షణ కోసం శరణు పొందే భావాన్ని ‘ఆశ్రయించే’ సహజంగా తెలియజేస్తుంది; దానిని కేవలం మానసిక నమ్మకంగా కుదించదు.
theological_decisions:
- issue: కీర్తనలు 2:12లో בַר అనే పదం యొక్క గుర్తింపు
  choice: 2:7లోని రాజకుమారుని భాషతో కొనసాగింపుగా ‘కుమారుని’ అని అనువదించాం.
  alternative: ‘పవిత్రత,’ ‘నిష్కపటంగా’ వంటి అర్థాలు, లేదా పరిష్కరించడం కష్టమైన పాఠ్యప్రయోగంగా పరిగణించడం.
  rationale: కీర్తన యొక్క తక్షణ రాజసంబంధ సాహిత్య సందర్భం కుమారుడనే అర్థానికి బలమైన మద్దతిస్తుంది. అయితే ఈ పదం అసాధారణమైనది కాబట్టి ఇతర అర్థసాధ్యతలను పాదసూచికలో స్పష్టంగా ఇచ్చి, తరువాతి సిద్ధాంత నిర్ధారణలను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- issue: ‘ఆయన’ అనే సర్వనామం సూచించే వ్యక్తి
  choice: హీబ్రూ వాక్యంలోని పురుష ఏకవచన సూచనను ‘ఆయన’గా నిలిపాం.
  alternative: దానిని స్పష్టంగా ‘కుమారుడు’ లేదా ‘యెహోవా’ అని విప్పి చెప్పడం.
  rationale: సందర్భంలో సూచనను వివిధ రీతుల్లో అనుసంధానించే అవకాశం ఉన్నందున, మూలంలోని సంక్షిప్తతను కాపాడి ఏ గుర్తింపునూ అనువాదంలో బలవంతంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కవితా శైలిని ఉపయోగించాం. ‘ముద్దుపెట్టండి,’ ‘రగులుతుంది,’ ‘ఆశ్రయించే’ వంటి సులభంగా అర్థమయ్యే పదాలతో మూలంలోని రాజసంబంధ చిత్రం, అగ్ని రూపకం, శరణు భావం నిలిపాం. సందిగ్ధమైన బార్ పదాన్నీ, కోపం రగిలే కాలం లేదా పరిమాణానికి సంబంధించిన సంక్షిప్త హీబ్రూ ప్రయోగాన్నీ పాదసూచికలతో పారదర్శకంగా ఉంచాం.
