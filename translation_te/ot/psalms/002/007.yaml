source:
  edition: WLC
  text: אֲסַפְּרָ֗ה אֶֽ֫ל חֹ֥ק יְֽהוָ֗ה אָמַ֘ר אֵלַ֥/י בְּנִ֥/י אַ֑תָּה אֲ֝נִ֗י הַ/יּ֥וֹם יְלִדְתִּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/007.yaml
  text: 'I will declare the decree of Yahweh: He said to me[a], “You are my Son[b]; today I have begotten you.”'
translation:
  language: te
  text: 'యెహోవా నిర్ణయాన్ని నేను ప్రకటిస్తాను:


    ఆయన నాతో ఇలా అన్నాడు,


    “నీవు నా కుమారుడివి;


    నేడు నేను నిన్ను కన్నాను[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా, “నేడు నేను నీకు తండ్రినయ్యాను.” హీబ్రూ మరింత అక్షరార్థంగా జనన/కనుట అనే భాషను ఉపయోగిస్తుంది; అది రాజాభిషేకం లేదా దత్తపుత్రత్వ భావాన్ని సూచించవచ్చు. ప్రధాన పాఠం ఆ రూపకాన్ని అలాగే ఉంచుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפְּרָה
  choice: నేను ప్రకటిస్తాను
  rationale: ఈ రూపం గంభీరమైన ప్రకటనను పరిచయం చేస్తుంది. ‘చెబుతాను’ కంటే ‘ప్రకటిస్తాను’ రాజసభా సందర్భంలోని అధికారిక స్వరాన్ని సహజంగా అందిస్తుంది.
- source_word: אֶל חֹק
  choice: నిర్ణయాన్ని
  rationale: సందర్భంలో חֹק సాధారణ శాసనం కంటే యెహోవా స్థిరపరచిన అధికారిక రాజనిర్ణయాన్ని సూచిస్తుంది. తెలుగులో క్రియకు ప్రత్యక్ష కర్మగా అనువదించడం సహజం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో అందించబడింది.
- source_word: אָמַר אֵלַי
  choice: ఆయన నాతో ఇలా అన్నాడు
  rationale: కర్త ముందున్న యెహోవాయే. ఉటంకించబోయే మాటలను సహజంగా పరిచయం చేయడానికి ‘ఇలా’ చేర్చబడింది.
- source_word: בְּנִי אַתָּה
  choice: నీవు నా కుమారుడివి
  rationale: హీబ్రూ వాక్యంలోని పుత్రత్వ ప్రకటనను నేరుగా, గంభీరంగా అందిస్తుంది. తెలుగులో పెద్ద/చిన్న అక్షరాల భేదం లేకపోవడం వల్ల రాజ-మెస్సీయ సంబంధిత భావాన్ని అక్షరరూపంతో ప్రత్యేకంగా సూచించలేదు.
- source_word: הַיּוֹם
  choice: నేడు
  rationale: కాలప్రాధాన్యాన్ని సంక్షిప్తంగా, గంభీరమైన కవితా శైలిలో కాపాడుతుంది.
- source_word: יְלִדְתִּיךָ
  choice: నేను నిన్ను కన్నాను
  rationale: ילד లోని కనడం/జన్మనివ్వడం అనే రూపకాన్ని వ్యాఖ్యానంతో పరిష్కరించకుండా నేరుగా నిలుపుతుంది. ‘నిన్ను నా కుమారునిగా చేసుకున్నాను’ వంటి వివరణాత్మక అనువాదం కంటే ఇది మూలంలోని ఉద్దేశపూర్వక ఉద్రిక్తతను కాపాడుతుంది.
theological_decisions:
- issue: בְּנִי లోని రాజపుత్రత్వం మరియు మెస్సీయ ప్రాధాన్యం
  choice: ‘నీవు నా కుమారుడివి’ అని అనువదించడం
  alternative: ‘నీవు నా పుత్రుడివి’
  rationale: తక్షణ సందర్భం దావీదు వంశపు రాజును సూచిస్తుండగా, విస్తృత గ్రంథసందర్భంలో ఈ వాక్యానికి మెస్సీయ ప్రాధాన్యం కూడా ఉంది. ‘కుమారుడు’ సహజమైన ఆధునిక తెలుగు; హీబ్రూలో లేని అక్షరభేదాన్ని తెలుగులో కృత్రిమంగా చేర్చదు.
- issue: ‘నేడు నేను నిన్ను కన్నాను’ అనే మాట యొక్క భావం
  choice: కనడం అనే మూలభాషా రూపకాన్ని అలాగే ఉంచడం
  alternative: ‘నేడు నేను నీకు తండ్రినయ్యాను’ లేదా ‘నేడు నిన్ను నా కుమారునిగా చేసుకున్నాను’
  rationale: ఈ మాట రాజాభిషేకం, నిబంధనాపరమైన దత్తత, లేదా మెస్సీయ నెరవేర్పుతో ఎలా సంబంధించిందో అనువాదమే తేల్చివేయదు. మూలంలోని జననభాషను నిలిపి, నిజమైన వ్యాఖ్యాన విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు, గంభీరమైన కవితా-రాజప్రకటన శైలి. సాధారణ పాఠకులకు అర్థమయ్యే పదాలను వాడుతూ, మూలంలోని సమాంతర పాద నిర్మాణం మరియు ధార్మిక ఉద్రిక్తతను కాపాడింది.
