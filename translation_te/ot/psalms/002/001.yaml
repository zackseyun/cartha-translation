source:
  edition: WLC
  text: לָ֭/מָּה רָגְשׁ֣וּ גוֹיִ֑ם וּ֝/לְאֻמִּ֗ים יֶהְגּוּ רִֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/001.yaml
  text: Why do the nations rage[a], and the peoples plot in vain?
translation:
  language: te
  text: దేశాలు ఎందుకు కల్లోలపడుతున్నాయి, జనసమూహాలు వ్యర్థమైనదాన్ని పన్నుతున్నాయి[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శూన్యమైనదాన్ని మననం చేస్తున్నాయి,’ ‘వ్యర్థమైనదాన్ని గొణుగుతున్నాయి.’ సంప్రదాయంగా, ‘వ్యర్థంగా పన్నాగాలు పన్నుతున్నాయి.’ హీబ్రూ క్రియ గొణగడం లేదా మననం చేయడంతోపాటు యోచించడం, పన్నడం అనే భావాన్నీ ఇవ్వగలదు; నామవాచకం శూన్యతను, వ్యర్థతను లేదా నిష్ఫలమైనదాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: ఎందుకు
  rationale: కారణాన్ని ప్రశ్నించే అలంకారిక ప్రశ్నను సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: רָגְשׁוּ
  choice: రగులుతున్నాయి
  rationale: సమూహాలు కలవరంతో, శత్రుభావంతో ఉప్పొంగడాన్ని సూచిస్తుంది. సందర్భంలోని తిరుగుబాటు తీవ్రతను తెలియజేస్తూనే ‘కుట్ర చేస్తున్నాయి’ అనే మరింత వ్యాఖ్యానాత్మక అర్థాన్ని ప్రధాన పాఠ్యంలోకి తేవదు.
- source_word: גוֹיִם
  choice: దేశాలు
  rationale: ఇక్కడ రాజకీయ జనసమూహాలు లేదా రాజ్యాలకు చెందిన ప్రజలను సూచిస్తుంది. ‘అన్యజనులు’ అనడం మూలంలో స్పష్టంగా లేని తరువాతి మతపరమైన భేదాన్ని దిగుమతి చేసే అవకాశం ఉంది.
- source_word: לְאֻמִּים
  choice: జనసమూహాలు
  rationale: ‘దేశాలు’కు సమాంతరమైనప్పటికీ వేరైన బహువచన సమూహార్థాన్ని నిలుపుతుంది; తెలుగు సమాంతర కవిత్వంలో సహజంగా ఉంటుంది.
- source_word: יֶהְגּוּ
  choice: పన్నాగాలు పన్నుతున్నాయి
  rationale: క్రియకు గొణగడం, మననం చేయడం, యోచించడం లేదా పన్నడం అనే అర్థపరిధి ఉంది. శత్రుత్వపూరిత రాజకీయ సందర్భంలో ‘పన్నాగాలు పన్నడం’ సహజంగా ఉద్దేశాన్ని తెలియజేస్తుంది; విస్తృత అర్థపరిధిని పాదటిప్పణిలో ఉంచాం.
- source_word: רִיק
  choice: వ్యర్థమైన
  rationale: శూన్యత, నిష్ఫలత, పనికిరానితనం అనే భావాన్ని తెలుపుతుంది. సహజమైన తెలుగుకోసం ‘పన్నాగాలు’ను విశేషించేలా ఇచ్చినా, మూలంలోని నామవాచక భావాన్ని పాదటిప్పణిలో వెల్లడించాం.
