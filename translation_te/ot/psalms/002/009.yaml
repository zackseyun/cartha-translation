id: PSA.2.9
reference: Psalms 2:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: תְּ֭רֹעֵ/ם בְּ/שֵׁ֣בֶט בַּרְזֶ֑ל כִּ/כְלִ֖י יוֹצֵ֣ר תְּנַפְּצֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/009.yaml
  text: You will break them with an iron scepter[b][a]; like a potter’s vessel you will shatter them.
translation:
  language: te
  text: ఇనుప రాజదండంతో[b] నీవు వారిని విరగగొడతావు[a]; కుమ్మరి పాత్రను పగులగొట్టినట్లుగా వారిని ముక్కలు చేస్తావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, కొన్ని ప్రాచీన అనువాదాల్లో ప్రతిబింబించి ప్రకటన గ్రంథంలోనూ ప్రతిధ్వనించే ప్రత్యామ్నాయ పాఠసంప్రదాయం ప్రకారం: “ఇనుప రాజదండంతో నీవు వారిని మేపుతావు” లేదా “ఇనుప రాజదండంతో నీవు వారిని పాలిస్తావు.”'
    reason: alternative_reading
  - marker: b
    text: “రాజదండం” అనే పదాన్ని “దండం” లేదా “కర్ర” అని కూడా అనువదించవచ్చు; హీబ్రూ పదం అధికారాన్ని సూచించే దండాన్నీ, క్రమశిక్షణ లేదా శిక్ష విధించే సాధనాన్నీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרֹעֵם
  choice: నీవు వారిని విరగగొడతావు
  rationale: మసొరా పాఠంలోని స్వరచిహ్నాలు, అలాగే తరువాతి ‘ముక్కలుచేస్తావు’ అనే సమాంతర క్రియ, ఇక్కడ విధ్వంసక తీర్పును సూచించే ‘విరగగొట్టు’ అనే అర్థానికే బలమిస్తున్నాయి. అయితే ప్రాచీన అనువాద సంప్రదాయంలో కనిపించే ‘మేపు/పాలించు’ అనే పఠనాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְּשֵׁבֶט
  choice: రాజదండంతో
  rationale: שֵׁבֶט అంటే దండం, కర్ర, లేదా రాజదండం కావచ్చు. రెండవ కీర్తనలోని రాజసందర్భంలో ‘రాజదండం’ అధికారాన్ని స్పష్టంగా తెలియజేస్తూ తీర్పు సాధనమనే చిత్రాన్ని కూడా నిలుపుతుంది.
- source_word: בַּרְזֶל
  choice: ఇనుప
  rationale: ఇది పదార్థాన్ని సూచించే సూటి పదం; రాజదండపు బలాన్ని, తీర్పు తీవ్రతను తెలియజేస్తుంది.
- source_word: כִּכְלִי יוֹצֵר
  choice: కుమ్మరి పాత్రను ...ట్లు
  rationale: כְּלִי విస్తృతంగా వస్తువు లేదా పాత్రను సూచిస్తుంది; יוֹצֵר తో కలిసి వచ్చినప్పుడు కుమ్మరి చేసిన మట్టి పాత్ర అనే భావం సహజం. తెలుగులో ‘కుమ్మరి పాత్ర’ సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: תְּנַפְּצֵם
  choice: వారిని ముక్కలుచేస్తావు
  rationale: ఈ క్రియ బలంగా కొట్టి పూర్తిగా పగులగొట్టడాన్ని సూచిస్తుంది. ‘ముక్కలుచేస్తావు’ కుమ్మరి పాత్ర ఉపమానానికి సహజంగా సరిపోతూ క్రియ తీవ్రతను నిలుపుతుంది.
theological_decisions:
- issue: మొదటి క్రియ రాజపాలనను సూచిస్తుందా, లేక విధ్వంసక తీర్పును సూచిస్తుందా?
  choice: 'విధ్వంసక తీర్పు: ‘విరగగొడతావు’'
  alternative: 'రాజపాలన: ‘మేపుతావు’ లేదా ‘పాలిస్తావు’'
  rationale: మసొరా పాఠ స్వరచిహ్నాలు, ‘ముక్కలుచేస్తావు’ అనే సమాంతర వాక్యభాగం విధ్వంసక తీర్పు భావానికి బలమిస్తాయి. కొన్ని ప్రాచీన అనువాదాలు, ప్రకటన గ్రంథంలోని ప్రతిధ్వనులు ‘మేపు/పాలించు’ అనే సంప్రదాయాన్ని ప్రతిబింబిస్తాయి; అందువల్ల దానిని ప్రధాన పాఠంలో ఎంచుకోకుండా పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కవితా ధోరణిని పాటించాం. ‘రాజదండం’ రాజసందర్భాన్ని స్పష్టం చేస్తుంది; ‘విరగగొడతావు’ మరియు ‘ముక్కలుచేస్తావు’ అనే సమాంతర పదాలు మూలంలోని విధ్వంసక తీర్పు చిత్రాన్ని సహజంగా నిలుపుతాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
