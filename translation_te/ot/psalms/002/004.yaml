  text: The one enthroned in the heavens laughs[a]; the Lord mocks them.
translation:
  language: te
  text: ఆకాశాల్లో కూర్చున్నవాడు నవ్వుతాడు[a]; ప్రభువు వారిని ఎగతాళి చేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆకాశాల్లో సింహాసనాసీనుడైనవాడు నవ్వుతాడు; ప్రభువు వారిని అపహసిస్తాడు.”
    reason: יוֹשֵׁב కు సందర్భానుసారమైన రాజస భావంతో ‘సింహాసనాసీనుడైనవాడు’ అనే వ్యాఖ్యాత్మక ప్రత్యామ్నాయం సాధ్యమే; יִלְעַג కు ‘అపహసిస్తాడు’ సమీప పదప్రయోగం.
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: సింహాసనాసీనుడైనవాడు
  rationale: ఈ కృదంతానికి అక్షరార్థంగా ‘కూర్చున్నవాడు’ అనే భావం ఉన్నా, రాజులు తిరుగుబాటు చేసే ఈ కీర్తన సందర్భంలో దేవుని సార్వభౌమ రాజాధికారాన్ని సూచించే భావం కూడా ఉంది. ‘సింహాసనాసీనుడైనవాడు’ ఆ రాజస భావాన్ని సహజమైన తెలుగు కవితా శైలిలో వ్యక్తపరుస్తుంది.
- source_word: בַּשָּׁמַיִם
  choice: ఆకాశమండలాల్లో
  rationale: హీబ్రూ పదం బహువచన రూపంలో ఉంది. ‘ఆకాశమండలాల్లో’ ఆ రూపాన్ని, ఉన్నతమైన కీర్తనా శైలిని నిలుపుతుంది; కేవలం భౌతికమైన ‘ఆకాశంలో’ కంటే ఇక్కడ విస్తృతంగా సరిపోతుంది.
- source_word: יִשְׂחָק
  choice: నవ్వుతాడు
  rationale: ఈ కవితా సందర్భంలో అసంపూర్ణ క్రియను సజీవమైన వర్తమాన భావంతో అనువదించవచ్చు. ఎగతాళి భావాన్ని తదుపరి క్రియ స్పష్టం చేస్తుంది కాబట్టి, ఇక్కడ మూలపదపు సరళమైన భావమైన ‘నవ్వుతాడు’ నిలుపబడింది.
- source_word: אֲדֹנָי
  choice: ప్రభువు
  rationale: ఇది దేవుని వ్యక్తిగత నామం YHWH కాదు, ‘ప్రభువు/అధిపతి’ అనే బిరుదు. ఉన్నతమైనా సహజమైన ఆధునిక తెలుగులో ‘ప్రభువు’ సరైన అనువాదం.
- source_word: יִלְעַג
  choice: ఎగతాళి చేస్తాడు
  rationale: ఈ క్రియ అపహాస్యం చేయడం, హేళన చేయడం అనే భావాన్ని ఇస్తుంది. ‘ఎగతాళి చేస్తాడు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి, మూలంలోని బలాన్ని నిలుపుతుంది.
- source_word: לָמוֹ
  choice: వారిని
  rationale: ఈ సర్వనామం ముందరి వచనాల్లోని తిరుగుబాటు చేసే జనాలను, పాలకులను సూచిస్తుంది. తెలుగులో ‘వారిని ఎగతాళి చేస్తాడు’ సహజమైన ప్రయోగం.
theological_decisions:
- issue: దేవుని రాజసమైన, మానవరూపక చిత్రణ
  choice: ‘సింహాసనాసీనుడైనవాడు’ అని రాజాధికార భావాన్ని వ్యక్తపరుస్తూ, ‘నవ్వుతాడు’, ‘ఎగతాళి చేస్తాడు’ అనే సజీవ మానవరూపక క్రియలను యథాతథంగా నిలుపడం.
  alternative: ‘ఆకాశమండలాల్లో కూర్చున్నవాడు నవ్వుతాడు; ప్రభువు వారిని అపహసిస్తాడు.’
  rationale: తిరుగుబాటు చేసే పాలకులపై దేవుని సార్వభౌమ ఆధిపత్యాన్ని వచనం చిత్రిస్తుంది. రాజసమైన సూచనను తగ్గించకూడదు; అలాగే దేవుని ప్రతిస్పందనను అమూర్తమైన వివరణగా మార్చి, మూలంలోని ఉద్దేశపూర్వకమైన మానవరూపక ఉద్రిక్తతను తొలగించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా, కీర్తనకు తగిన గంభీరమైన కవితా శైలి ఉపయోగించబడింది. ‘ఆకాశమండలాల్లో’ మరియు ‘సింహాసనాసీనుడైనవాడు’ ఉన్నత శైలిని నిలుపుతాయి; వాక్య నిర్మాణం మాత్రం సంక్షిప్తంగా, స్పష్టంగా ఉంది.
