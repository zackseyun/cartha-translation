id: PSA.2.8
reference: Psalms 2:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שְׁאַ֤ל מִמֶּ֗/נִּי וְ/אֶתְּנָ֣ה ג֭וֹיִם נַחֲלָתֶ֑/ךָ וַ֝/אֲחֻזָּתְ/ךָ֗ אַפְסֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/008.yaml
  text: Ask of me[a], and I will give the nations as your inheritance, and the ends of the earth as your possession.
translation:
  language: te
  text: నన్ను కోరుము; జనములను నీ వారసత్వంగా, భూమి అంచులను[a] నీ స్వాస్థ్యంగా నీకు ఇస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘భూమి సుదూర ప్రాంతాలను.’
    reason: אַפְסֵי אָרֶץ అనే నుడికారానికి అర్థాన్ని మరింత స్పష్టంగా చెప్పే ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: שְׁאַל מִמֶּנִּי
  choice: నన్ను అడుగు
  rationale: שְׁאַל అనేది రెండవ పురుష ఏకవచన ఆజ్ఞార్థకం; מִמֶּנִּי అడగబడే వ్యక్తిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘నన్ను అడుగు’ సహజంగా ఉండి, నేరుగా చేయబడిన అభ్యర్థన ఆజ్ఞను స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְאֶתְּנָה
  choice: నీకిస్తాను
  rationale: ఆజ్ఞార్థకం తరువాత వచ్చిన נתן క్రియలోని సంకల్ప/వాగ్దాన భావాన్ని తెలుగులో సహజమైన భవిష్యత్ వాగ్దానంగా వ్యక్తం చేస్తుంది.
- source_word: גּוֹיִם
  choice: జనాలను
  rationale: ఇక్కడ పదం వివిధ ప్రజలను లేదా దేశజనాలను సూచిస్తుంది. ‘జనాలను’ అంతర్జాతీయ విస్తృతిని నిలుపుతూ, తరువాతి కాలపు యూదేతరులు అనే ప్రత్యేక భావాన్ని అనవసరంగా చేర్చదు.
- source_word: נַחֲלָתֶךָ
  choice: నీ వారసత్వ సంపదగా
  rationale: נַחֲלָה వారసత్వంగా లేదా కేటాయింపుగా లభించే స్వాస్థ్యాన్ని సూచిస్తుంది. ‘వారసత్వ సంపద’ సాధారణ పాఠకునికి స్పష్టంగా ఉండి, బహుమతిగా ఇచ్చే స్థిరమైన హక్కును తెలియజేస్తుంది.
- source_word: וַאֲחֻזָּתְךָ
  choice: నీ స్వాధీనంగా
  rationale: אֲחֻזָּה స్వాధీన ఆస్తి లేదా ఆధీనంలో ఉన్న భాగాన్ని సూచిస్తుంది. ‘స్వాధీనం’ మొదటి సమాంతర పదమైన ‘వారసత్వ సంపద’తో తేడాను నిలుపుతుంది.
- source_word: אַפְסֵי אָרֶץ
  choice: భూమి అంచులను
  rationale: ఈ పదబంధం భూమి యొక్క అత్యంత దూరమైన హద్దులు లేదా ప్రాంతాలను సూచించే హీబ్రూ నుడికారం. ‘భూమి అంచులు’ తెలుగులో సంక్షిప్తంగా, గంభీరంగా, అర్థవంతంగా ఉంటుంది.
theological_decisions:
- issue: రాజసంబంధమైన లేదా మెస్సీయసంబంధమైన వాగ్దాన పరిధి
  choice: దేవుడు సంబోధిత రాజు/కుమారునికి జనాలపై, భూమి అంతటిపై అధికారం వాగ్దానం చేస్తున్నట్లుగా మూలవాక్యాన్ని నేరుగా అనువదించడం
  alternative: వాక్యంలోనే క్రీస్తు లేదా మెస్సీయను స్పష్టంగా పేర్కొనే వివరణాత్మక అనువాదం
  rationale: కీర్తన 2కు క్రైస్తవ సంప్రదాయంలో మెస్సీయసంబంధమైన అన్వయం ఉన్నప్పటికీ, ఈ వచనంలోని హీబ్రూ స్వయంగా సంబోధిత కుమారుడు/రాజుకు ప్రపంచవ్యాప్త స్వాధీనాన్ని వాగ్దానం చేస్తుంది. అందువల్ల తరువాతి కానోనికల్ అన్వయాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా మూలంలోని వ్యాఖ్యాన విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకునికి అర్థమయ్యేలా, అయితే కీర్తనకు తగిన గంభీరతతో రూపొందించబడింది. ‘వారసత్వ సంపద’ మరియు ‘స్వాధీనం’ అనే పదాలు హీబ్రూ సమాంతర నిర్మాణంలోని సంబంధితమైనా భిన్నమైన భావాలను నిలుపుతాయి. మూలంలోని రెండవ పురుష ఏకవచన సంబోధన తెలుగులో సహజంగా వ్యక్తమైంది.
