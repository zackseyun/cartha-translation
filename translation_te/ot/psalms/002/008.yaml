revisions:
- from: నన్ను అడుగు; జనాలను నీ వారసత్వ సంపదగా, భూమి అంచులను[a] నీ స్వాధీనంగా నీకు ఇస్తాను.
  to: నన్ను కోరుము; జనములను నీ వారసత్వంగా, భూమి అంచులను[a] నీ స్వాస్థ్యంగా నీకు ఇస్తాను.
  rationale: 'సవరణ హీబ్రూ సమాంతర నిర్మాణాన్ని మరింత సన్నిహితంగా నిలుపుతుంది: ‘జనములు—వారసత్వం’ మరియు ‘భూమి అంచులు—స్వాస్థ్యం.’ ‘కోరుము’ మִמֶּנִּיతో కూడిన అభ్యర్థన భావాన్ని గంభీరంగా వ్యక్తం చేస్తుంది; ‘స్వాస్థ్యం’ అֲחֻזָּה యొక్క స్వాధీన ఆస్తి భావాన్ని అందిస్తుంది. పాదటిప్పణి మూల నుడికారంలోని సముచిత ప్రత్యామ్నాయాన్ని యథాతథంగా నిలుపుతుంది.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T09:50:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'మూల హీబ్రూ భావం మొత్తంగా సరిగ్గానే ఉంది: దేవుడు సంబోధితునికి జనములను వారసత్వంగా, భూమి అంచులను స్వాస్థ్యంగా ఇస్తానని వాగ్దానం చేస్తున్నాడు. అయితే ‘నన్ను అడుగు’ కంటే ‘నన్ను అడుగు’లో వ్యక్తిని కర్మగా చూపే స్వల్ప అస్పష్టత ఉంది; మִמֶּנִּי యొక్క ‘నా దగ్గర/నన్ను అడుగు’ భావాన్ని ‘నన్ను కోరుము’ అనడం స్పష్టంగా, కీర్తనకు తగిన రీతిలో ఉంటుంది. ముఖ్యంగా ‘నీ స్వాధీనంగా నీకు ఇస్తాను’ అనేది పునరుక్తి, అలాగే אֲחֻזָּתְךָలోని ‘స్వాస్థ్యం/సొత్తు’ భావంకంటే ‘స్వాధీనం’ స్థితి భావాన్ని ఎక్కువగా సూచిస్తుంది.'
  naturalness: ప్రస్తుత వాక్యం అర్థమవుతుంది; కానీ ‘నీ స్వాధీనంగా నీకు ఇస్తాను’ సహజమైన తెలుగు ప్రవాహాన్ని తగ్గిస్తుంది. ‘నీ స్వాస్థ్యంగా’ అనేది నַחֲלָהకు ‘వారసత్వంగా’తో ఏర్పడే కవితాత్మక సమాంతరతను, అֲחֻזָּהకు చెందిన స్వాధీన-ఆస్తి భావాన్ని మరింత సహజంగా తెలియజేస్తుంది. ‘భూమి అంచులను’ ఆధునిక ప్రామాణిక తెలుగులో సహజమే.
  terminology: ‘జనాలను’ గּוֹיִםకు ఆమోదయోగ్యమైన అనువాదం; సందర్భంలోని అంతర్జాతీయ పరిధిని కొంత స్పష్టంగా చేయడానికి ‘జనములను’ వాడవచ్చు, కాని అది తప్పనిసరి కాదు. ‘వారసత్వ సంపదగా’లో ‘సంపద’ మూలంలో లేని అదనపు నువ్వెన్సును ఇస్తుంది; ‘వారసత్వంగా’ మూలానికి దగ్గరగా ఉంటుంది. అֲחֻזָּהకు ‘స్వాస్థ్యంగా’ తగిన, గంభీరమైన పదం. పాదటిప్పణి గుర్తు సరైన పదబంధానికే అమర్చబడి ఉంది.
  issues:
  - severity: medium
    issue: ‘నీ స్వాధీనంగా నీకు ఇస్తాను’ అనే పునరుక్తి మరియు పదార్థ సూక్ష్మభేదం
    rationale: హీబ్రూలో ‘భూమి అంచులు’కు ‘నీ అֲחֻזָּה’ అని నామవాచక సమాంతరం ఉంది. ‘స్వాధీనం’ తెలుగులో ఆధిపత్యం పొందిన స్థితిని సూచించగలదు; ‘స్వాస్థ్యం’ స్వాధీన ఆస్తి/సొత్తు భావాన్ని మరింత నేరుగా అందిస్తుంది. ‘నీకు’ అనేది ఇప్పటికే ‘నీ’లో వ్యక్తమైన సంబంధాన్ని అనవసరంగా పునరావృతం చేస్తుంది.
  - severity: low
    issue: ‘వారసత్వ సంపదగా’లో ‘సంపద’ అదనం
    rationale: నַחֲלָה ప్రధానంగా వారసత్వం, స్వాస్థ్యం, లేదా కేటాయించిన భాగం. ‘సంపద’ తప్పు కాదు, కానీ మూలంలోని సంక్షిప్త సమాంతరతకు అవసరం లేని వివరణను జోడిస్తుంది.
