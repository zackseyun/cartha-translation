  text: יִ֥תְיַצְּב֨וּ מַלְכֵי אֶ֗רֶץ וְ/רוֹזְנִ֥ים נֽוֹסְדוּ יָ֑חַד עַל יְ֝הוָה וְ/עַל מְשִׁיחֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/002.yaml
  text: The kings of the earth take their stand[b][a], and rulers gather together against Yahweh and against his Anointed.
translation:
  language: te
  text: భూమి రాజులు నిలబడుతున్నారు; పాలకులు కలిసి యాహ్వేకూ ఆయన అభిషిక్తునికీ విరోధంగా కూడుతున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కూడుతున్నారు” అనే మాటను “కలిసి సమావేశమవుతున్నారు” లేదా “కలిసి సమాలోచన చేస్తున్నారు” అని కూడా అనువదించవచ్చు. హీబ్రూ పదబంధం విరోధంగా సమన్వయంతో చేసే ఉమ్మడి చర్యను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצְּבוּ
  choice: తమ స్థానాలు చేపడుతున్నారు
  rationale: హిత్పయేల్ రూపం ఉద్దేశపూర్వకంగా తమను తాము నిలబెట్టుకోవడం లేదా స్థానాలు చేపట్టడం అనే భావాన్ని ఇస్తుంది; సందర్భంలోని ప్రతిఘటనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מַלְכֵי אֶרֶץ
  choice: భూమి రాజులు
  rationale: ఈ కీర్తనలో స్థానిక దేశం కంటే విశ్వవ్యాప్త రాజకీయ పరిధి ఉద్దేశించబడింది; అందువల్ల ‘భూమి’ తగినది.
- source_word: רוֹזְנִים
  choice: పాలకులు
  rationale: ఈ పదం ఉన్నతాధికారులు లేదా రాజకీయ నాయకులను సూచిస్తుంది; ‘పాలకులు’ ఆధునికంగా, విస్తృతార్థంతో ఉంది.
- source_word: נוֹסְדוּ יָחַד
  choice: ఏకమవుతున్నారు
  rationale: వ్యతిరేకతలో సమన్వయంతో కూడిన ఉమ్మడి చర్యను సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది; ‘కుట్ర చేస్తున్నారు’ అనే మరింత బలమైన వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలోకి తేవదు.
- source_word: עַל
  choice: విరోధంగా
  rationale: ఈ శత్రుత్వ సందర్భంలో ఉపసర్గ ప్రతికూల సంబంధాన్ని సూచిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో వ్యక్తిగత నామంగా ఉంచుతుంది.
- source_word: מְשִׁיחוֹ
  choice: ఆయన అభిషిక్తుడు
  rationale: హీబ్రూ పదానికి నేరమైన అర్థం ‘ఆయన అభిషేకించినవాడు/అభిషిక్తుడు’; తక్షణ దావీదు రాజసంబంధ సూచనను, విస్తృత మెస్సీయ సంబంధ అవకాశాన్ని రెండింటినీ ముందుగానే పరిమితం చేయకుండా కాపాడుతుంది.
theological_decisions:
- issue: מְשִׁיחוֹ పదంలోని రాజసంబంధ మరియు మెస్సీయ సంబంధ భావం
  choice: ఆయన అభిషిక్తుడు
  alternative: ఆయన మెస్సీయ
  rationale: ‘అభిషిక్తుడు’ మూలపదానికి దగ్గరగా ఉండి, చారిత్రక రాజును సూచించే తక్షణ భావాన్నీ, విస్తృత మెస్సీయ సంబంధ పఠనాన్నీ నిలుపుతుంది; ప్రధాన పాఠ్యం ఒకదానినే బలవంతంగా నిర్ణయించదు.
- issue: יהוה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: బిరుదైన ‘ప్రభువు’కు బదులుగా మూలంలోని వ్యక్తిగత దైవనామాన్ని నిలుపుతుంది; ‘యెహోవా’ సాధారణ తెలుగు బైబిల్ పాఠకులకు సుపరిచితమైన రూపం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కీర్తన శైలిని ఉంచుతూ, సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఎంచుకున్నాం. వాక్యంలోని సమాంతర నిర్మాణాన్ని కాపాడి, ‘కుట్ర’ వంటి అధిక వ్యాఖ్యానభారం గల పదాన్ని నివారించాం.
