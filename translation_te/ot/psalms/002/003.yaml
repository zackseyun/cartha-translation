translation:
  language: te
  text: '“వారి సంకెళ్లను తెంచివేద్దాం;

    వారి తాళ్లను మన నుండి దూరంగా పారవేద్దాం.”[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వారి సంకెళ్లను’ అనే చోట ‘వారి బంధనాలను’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘వారి తాళ్లను’ అనే చోట ‘వారి త్రాళ్లను’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: రెండవ పాదాన్ని ‘వారి తాళ్లను మన నుండి విసిరివేద్దాం’ అని కూడా అనువదించవచ్చు.
    reason: previous_rendering
lexical_decisions:
- source_word: נְנַתְּקָה
  choice: తెంచివేద్దాం
  rationale: మొదటి పురుష బహువచన సంకల్పార్థక రూపాన్ని సహజమైన తెలుగు ఉద్బోధగా వ్యక్తపరుస్తుంది; బంధాన్ని బలవంతంగా విడదీయడం అనే క్రియాభావాన్ని నిలుపుతుంది.
- source_word: מֹוסְרוֹתֵימוֹ
  choice: వారి సంకెళ్లను
  rationale: నియంత్రించే బంధనాల స్పష్టమైన భౌతిక రూపకాన్ని ఆధునిక పాఠకునికి సులభంగా తెలియజేస్తుంది; ‘బంధాలను’ అనే విస్తృత ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וְנַשְׁלִיכָה
  choice: విసిరివేద్దాం
  rationale: రెండవ సంకల్పార్థక క్రియలోని బలమైన తిరస్కారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מִמֶּנּוּ
  choice: మన మీదనుండి
  rationale: వక్తలు తమపై ఉన్న బంధనాలను తొలగించుకోవాలనే దృశ్యాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది; మూలంలోని ‘మన నుండి’ అనే భావాన్ని సహజీకరిస్తుంది.
- source_word: עֲבֹתֵימוֹ
  choice: వారి తాళ్లను
  rationale: మందమైన తాళ్లు లేదా బలమైన త్రాళ్లు అనే భౌతిక బంధన చిత్రాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవిక లేదా రాజసంబంధ అధికారాన్ని బంధనాలుగా చిత్రించే రూపకం
  choice: ‘సంకెళ్లు’, ‘తాళ్లు’ అనే స్పష్టమైన భౌతిక రూపకాలనే ఉంచడం
  alternative: ‘బంధాలు’, ‘త్రాళ్లు’ వంటి పదాలను వాడడం లేదా వాటిని అణచివేతగా వ్యాఖ్యానించడం
  rationale: సందర్భంలో జనాలు యెహోవాను, ఆయన అభిషిక్తుణ్ణి ఎదిరిస్తున్నప్పటికీ, ఈ వాక్యం వారి మాటలను రూపకంగా మాత్రమే అందిస్తుంది. ఆ బంధాలు న్యాయమైనవా అణచివేసేవా అని అనువాదంలో తీర్పు చెప్పకుండా మూలంలోని ధార్మిక ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కవితాత్మకమైనప్పటికీ సామాన్య పాఠకునికి స్పష్టంగా ఉండే ఉద్బోధాత్మక శైలి. రెండు బహువచన సంకల్పార్థక క్రియలను ‘-వేద్దాం’ రూపంతో సమాంతరంగా ఉంచాం.
