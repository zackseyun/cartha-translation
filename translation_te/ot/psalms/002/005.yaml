source:
  edition: WLC
  text: אָ֤ז יְדַבֵּ֣ר אֵלֵ֣י/מוֹ בְ/אַפּ֑/וֹ וּֽ/בַ/חֲרוֹנ֥/וֹ יְבַהֲלֵֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/005.yaml
  text: Then he will speak to them in his anger[a], and in his burning wrath he will terrify them.
translation:
  language: te
  text: అప్పుడు ఆయన తన కోపంలో వారితో మాట్లాడతాడు; తన మండే కోపంలో వారిని భయభ్రాంతులకు గురిచేస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన కోపపు వేడిలో వారిని కలవరపరుస్తాడు.”
    reason: חָרוֹןకు ‘కోపపు వేడి’ మరియు בהלకు ‘కలవరపరచడం’ అనే సాధ్యమైన అర్థాలను చూపే ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: తిరుగుబాటుకు దేవుని ప్రతిస్పందనగా వచ్చే తదుపరి చర్యను సూచించే కాలవాచక క్రియావిశేషణం; కీర్తనలోని క్రమాన్ని సహజంగా నిలుపుతుంది.
- source_word: יְדַבֵּר
  choice: మాట్లాడతాడు
  rationale: דבר యొక్క పియేల్ అసంపూర్ణ రూపం; సందర్భంలో దేవుడు తరువాత చేయబోయే ప్రతిస్పందనను తెలియజేస్తుంది.
- source_word: אֵלֵימוֹ
  choice: వారితో
  rationale: మునుపటి వచనాల్లోని తిరుగుబాటు చేసే రాజులు, పాలకులను సూచించే బహువచన ప్రత్యయం; తెలుగులో ‘వారితో మాట్లాడతాడు’ సహజ ప్రయోగం.
- source_word: בְאַפּוֹ
  choice: తన కోపంతో
  rationale: אַף అక్షరార్థంగా ‘ముక్కు’తో సంబంధమున్నా, ఇక్కడ కోపాన్ని సూచించే హీబ్రూ నుడికారం; భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וּבַחֲרוֹנוֹ
  choice: తన మండే ఉగ్రతతో
  rationale: חָרוֹןలోని మండుతున్న కోపం అనే తీవ్రతను నిలుపుతూ, ముందున్న אַף కంటే బలమైన భావాన్ని వ్యక్తపరుస్తుంది.
- source_word: יְבַהֲלֵמוֹ
  choice: వారిని భయభ్రాంతులకు గురిచేస్తాడు
  rationale: בהל పియేల్ రూపం ఆకస్మిక భయం, కలవరం లేదా దిగ్భ్రాంతిని కలిగించడాన్ని సూచిస్తుంది; ఈ సందర్భంలోని బలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుని కోపాన్ని మానవ భావోద్వేగ భాషలో వర్ణించడం
  choice: ‘తన కోపంతో’, ‘తన మండే ఉగ్రతతో’ అనే బలమైన భాషను నిలుపడం
  alternative: ‘తన అసంతృప్తితో వారిని గద్దిస్తాడు’ అని మృదువుగా అనువదించడం
  rationale: మూలపాఠం తిరుగుబాటుకు దేవుని వ్యక్తిగత న్యాయవ్యతిరేకతను బలమైన తీర్పు భాషలో వ్యక్తపరుస్తుంది. దానిని తగ్గించకుండా, అదనపు సిద్ధాంతార్థాన్ని చేర్చకుండా నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ సమాంతర నిర్మాణం మరియు కోపం నుంచి మండే ఉగ్రతకు పెరిగే తీవ్రత సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
