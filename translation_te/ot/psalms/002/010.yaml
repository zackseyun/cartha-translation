revisions:
- from: కాబట్టి ఇప్పుడు, రాజులారా, వివేకంతో నడుచుకోండి; భూమికి న్యాయాధిపతులారా, ఉపదేశాన్ని స్వీకరించండి[a].
  to: కాబట్టి, ఇప్పుడు రాజులారా, వివేకంతో నడుచుకోండి; భూమిలోని న్యాయాధిపతులారా, బోధను స్వీకరించండి[a].
  rationale: The revision corrects the Telugu case relationship in the second vocative and uses “బోధను స్వీకరించండి” for a natural, suitably broad rendering of the instruction/correction imperative. The footnote remains anchored to that imperative and preserves the relevant lexical ambiguity.
