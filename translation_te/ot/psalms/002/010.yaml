id: PSA.2.10
reference: Psalms 2:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֭/עַתָּה מְלָכִ֣ים הַשְׂכִּ֑ילוּ הִ֝וָּסְר֗וּ שֹׁ֣פְטֵי אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/010.yaml
  text: So now[a], O kings, be wise; be warned, O judges of the earth.
translation:
  language: te
  text: కాబట్టి, ఇప్పుడు రాజులారా, వివేకంతో నడుచుకోండి; భూమిలోని న్యాయాధిపతులారా, బోధను స్వీకరించండి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హెచ్చరికను స్వీకరించండి,’ ‘దిద్దుబాటును అంగీకరించండి.’ హీబ్రూ క్రియ బోధ, క్రమశిక్షణ లేదా మందలింపును స్వీకరించడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: ముందటి ప్రకటన నుంచి ఈ హెచ్చరికకు వచ్చే నిర్ధారణాత్మక మలుపును ‘కాబట్టి’ తెలియజేస్తుంది; ‘ఇప్పుడు’ కాలసూచక భావాన్ని నిలుపుతుంది.
- source_word: מְלָכִים
  choice: రాజులారా
  rationale: తెలుగులో సంబోధన విభక్తి ప్రత్యక్ష సంబోధనను సహజంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
- source_word: הַשְׂכִּילוּ
  choice: వివేకంతో నడుచుకోండి
  rationale: שכל హిఫీల్ ఆజ్ఞారూపం కార్యరూపం దాల్చే వివేకాన్ని సూచిస్తుంది. కేవలం జ్ఞానం కలిగి ఉండడంకన్నా వివేకపూర్వకంగా ప్రవర్తించాలనే పిలుపును ఈ రూపం సహజంగా తెలియజేస్తుంది.
- source_word: הִוָּסְרוּ
  choice: ఉపదేశాన్ని స్వీకరించండి
  rationale: יסר నిఫాల్ ఆజ్ఞారూపం ఉపదేశం, క్రమశిక్షణ లేదా దిద్దుబాటును పొందడం/అంగీకరించడం అనే విస్తృత భావాన్ని కలిగి ఉంది. ఈ ఎంపిక దాని స్వీకరణ భావాన్ని నిలుపుతూ, కేవలం హెచ్చరికకే అర్థాన్ని పరిమితం చేయదు.
- source_word: שֹׁפְטֵי אָרֶץ
  choice: భూమికి న్యాయాధిపతులారా
  rationale: కీర్తన 2లోని అంతర్జాతీయ పరిధిని బట్టి אָרֶץను ‘భూమి’గా అనువదించాం. שֹׁפְטֵי అనే న్యాయాధికార భావాన్ని సాధారణమైన ‘పాలకులు’గా మార్చకుండా ‘న్యాయాధిపతులు’గా నిలిపాం.
