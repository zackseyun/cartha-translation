translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ కీర్తనా కవిత్వానికి తగిన గంభీర సంబోధనను ఉపయోగించాం. సమాంతర పాద నిర్మాణాన్ని నిలిపి, హీబ్రూ ఆజ్ఞారూపాల ఉద్బోధక బలాన్ని గౌరవించాం.
