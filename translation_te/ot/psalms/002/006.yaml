lexical_decisions:
- source_word: וַאֲנִי
  choice: కాని నేనైతే
  rationale: స్వతంత్ర సర్వనామం సందర్భంలో ఉద్ఘాటనను, జనాల తిరుగుబాటుకు యెహోవా చర్యకు మధ్య వ్యతిరేకతను తెలియజేస్తుంది.
- source_word: נָסַכְתִּי
  choice: ప్రతిష్ఠించాను
  rationale: ఇక్కడ రాజును అధికార స్థానంలో నియమించి నిలపడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; అభిషేక కర్మ అనే సన్నని అర్థాన్ని బలవంతంగా చేర్చదు.
- source_word: מַלְכִּי
  choice: నా రాజును
  rationale: ప్రథమ పురుష ఏకవచన స్వామ్య ప్రత్యయాన్ని నేరుగా ప్రతిబింబిస్తుంది; అనువాదంలో అదనపు క్రైస్తవ వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: עַל צִיּוֹן
  choice: సీయోనులో
  rationale: ఇక్కడ עַל రాజు స్థాపించబడిన స్థలాన్ని సూచిస్తుంది. తెలుగులో నగరనామంతో ‘లో’ సహజంగా ఉంటుంది; తరువాతి ‘పర్వతంపై’ అనే సమానార్థక భాగం భౌగోళిక భావాన్ని స్పష్టం చేస్తుంది.
- source_word: הַר קָדְשִׁי
  choice: నా పవిత్ర పర్వతంపై
  rationale: హీబ్రూ నిర్మాణంలోని స్వామ్యాన్ని, పవిత్రతను, הַר యొక్క ‘పర్వతం’ అనే ప్రాథమిక భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: נָסַכְתִּי అనే క్రియను అభిషేక కర్మగా అనువదించాలా, రాజ ప్రతిష్ఠాపనగా అనువదించాలా
  choice: రాజ ప్రతిష్ఠాపన — ‘ప్రతిష్ఠించాను’
  alternative: ‘నియమించాను’ లేదా ‘అభిషేకించాను’
  rationale: సందర్భం తిరుగుబాటు చేసే భూరాజులకు ప్రతిగా దేవుడు తన రాజును సీయోనులో అధికార స్థానంలో నిలపడం గురించి చెబుతుంది. ‘ప్రతిష్ఠించాను’ రాజ నియామక/సింహాసనారోహణ భావాన్ని నిలుపుతూ, సాధారణంగా అభిషేకానికి వాడే వేరొక హీబ్రూ క్రియ భావాన్ని అనవసరంగా దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘సీయోను’ అనే ప్రాచుర్యంలో ఉన్న బైబిలు స్థలనామ రూపాన్ని వాడింది.
