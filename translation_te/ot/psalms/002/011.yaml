id: PSA.2.11
reference: Psalms 2:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עִבְד֣וּ אֶת יְהוָ֣ה בְּ/יִרְאָ֑ה וְ֝/גִ֗ילוּ בִּ/רְעָדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/011.yaml
  text: Serve Yahweh with fear[b][a], and rejoice with trembling.
translation:
  language: te
  text: యెహోవాను భయంతో సేవించండి[a]; వణుకుతో ఆనందించండి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘భక్తిపూర్వక గౌరవంతో’; హీబ్రూ పదం దేవుని ఎదుట కలిగే విస్మయభరిత గౌరవాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఉల్లసించండి’.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְדוּ
  choice: సేవించండి
  rationale: עבד అనే బహువచన ఆజ్ఞారూపం ఇక్కడ యెహోవాకు విధేయతతో చేసే విస్తృత సేవను సూచిస్తుంది. ‘ఆరాధించండి’ అని అనువదిస్తే భావం కేవలం ఆరాధనా క్రియలకు పరిమితమయ్యే అవకాశం ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో అందించాం.
- source_word: בְּיִרְאָה
  choice: భయంతో
  rationale: יִרְאָהకు భయం, విస్మయం, భక్తిపూర్వక గౌరవం అనే భావవ్యాప్తి ఉంది. కీర్తనలోని బలమైన హెచ్చరిక స్వరాన్ని నిలుపుతూ ప్రత్యక్షమైన ‘భయంతో’ను ఎంచుకున్నాం.
- source_word: וְגִילוּ
  choice: ఆనందించండి
  rationale: גיל ఉల్లాసంగా సంతోషించడాన్ని లేదా ఆనందోత్సాహాన్ని సూచిస్తుంది. ‘ఆనందించండి’ సహజమైన ఆధునిక తెలుగు ఆజ్ఞారూపం.
- source_word: בִּרְעָדָה
  choice: వణుకుతో
  rationale: רְעָדָה భయం లేదా విస్మయం వల్ల కలిగే వణుకును సూచిస్తుంది. ‘వణుకుతో’ ఆనందం–భయం మధ్య మూలపాఠంలోని ఉద్దేశపూర్వక ఉద్రిక్తతను నిలుపుతుంది.
theological_decisions:
- issue: భయంతో సేవించడానికీ వణుకుతో ఆనందించడానికీ మధ్య ఉన్న ఉద్రిక్తత
  choice: 'రెండు ఆజ్ఞలనూ వాటి సహజ ఉద్రిక్తతతోనే ఉంచడం: ‘భయంతో సేవించండి; వణుకుతో ఆనందించండి.’'
  alternative: భక్తిపూర్వక ఆనందం వైపు భావాన్ని సున్నితపరచడం లేదా భయభ్రాంతి వైపు మాత్రమే మళ్లించడం.
  rationale: హీబ్రూ పాఠం భయాన్నీ ఆనందాన్నీ వివరణ లేకుండా పక్కపక్కనే ఉంచుతుంది. అందువల్ల ఒక భావాన్ని మరొకదిలో కలపకుండా రెండింటినీ స్పష్టంగా నిలిపాం.
- issue: יהוה దైవనామాన్ని తెలుగులో అందించడం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: ఇది వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయదు; అదే సమయంలో ఆధునిక తెలుగు బైబిలు పాఠకులకు అత్యంత పరిచితమైన లిప్యంతరీకరణను ఉపయోగిస్తుంది.
translation_notes:
  register: సామాన్య ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు వాడాం. సంక్షిప్త కవితా సమాంతరత్వాన్ని, అలాగే భయం–ఆనందం మధ్య ఉన్న విరుద్ధ భావసమ్మేళనాన్ని నిలిపాం.
