source:
  edition: WLC
  text: עָלָ֣ה אֱ֭לֹהִים בִּ/תְרוּעָ֑ה יְ֝הֹוָ֗ה בְּ/ק֣וֹל שׁוֹפָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/005.yaml
  text: God has gone up with a shout[a]; Yahweh[b], with the sound of a trumpet.
translation:
  language: te
  text: దేవుడు నినాదంతో పైకి వెళ్లాడు[a]; యాహ్వే బూర ధ్వనితో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పైకి ఎక్కాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: పైకి ఎక్కాడు
  rationale: ఈ క్రియకు ‘పైకి వెళ్లు/ఎక్కు’ అనే అర్థం ఉంది. హీబ్రూ కవిత్వంలోని పూర్తయిన చర్యను సహజమైన తెలుగులో తెలియజేస్తూ, తరువాతి కాలపు ప్రత్యేక ఆరోహణ సిద్ధాంతాన్ని వాక్యంలోకి చేర్చదు.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: సమాంతర పాదంలోని యెహోవాను సూచిస్తున్నందున ఇక్కడ ఏకవచనమైన ‘దేవుడు’ సరైనది.
- source_word: בִּתְרוּעָה
  choice: నినాదంతో
  rationale: ఈ పదం ఆరాధనలోనో విజయ సందర్భంలోనో వినిపించే బిగ్గర కేక లేదా సామూహిక నినాదాన్ని సూచించగలదు. ‘నినాదంతో’ దాని విస్తృత భావాన్ని నిలుపుతుంది; ఆనందం లేదా యుద్ధం అనే ఒకే సందర్భానికి పరిమితం చేయదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించింది.
- source_word: בְּקוֹל
  choice: ధ్వనితో
  rationale: షోఫార్‌కు సంబంధించిన శ్రవణ చిత్రాన్ని సహజమైన తెలుగు పదబంధంలో తెలియజేస్తుంది.
- source_word: שׁוֹפָר
  choice: బూర
  rationale: కొమ్ముతో చేసిన సంకేత లేదా ఆరాధనా వాద్యాన్ని సాధారణ పాఠకులకు అర్థమయ్యేలా ‘బూర’గా అనువదించి, దాని నిర్దిష్ట సాంస్కృతిక స్వరూపాన్ని పాదటిప్పణిలో తెలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. కాబట్టి దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా ఉంచడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: దేవుడు పైకి వెళ్లడాన్ని సూచించే భాష
  choice: పైకి ఎక్కాడు
  alternative: ఆరోహణమయ్యాడు
  rationale: కీర్తనలోని రాజరిక లేదా సింహాసనారోహణ చిత్రాన్ని నిలుపుతూ, తరువాతి క్రైస్తవ ఆరోహణ భావాన్ని అనువాదమే నిర్బంధించకుండా సాధారణ క్రియను ఎంచుకుంది.
- issue: రెండవ పాదంలో క్రియ లోపం
  choice: పైకి ఎక్కాడు అని పునరుక్తం
  alternative: క్రియను వదలి అర్థగర్భిత సమాంతర పాదంగా ఉంచడం
  rationale: హీబ్రూలో మొదటి పాదంలోని క్రియ రెండవ పాదానికీ వర్తిస్తుంది. తెలుగులో భావం స్పష్టంగా, సహజంగా ఉండేందుకు క్రియను పునరుక్తం చేసింది; రెండు వేర్వేరు చర్యలను సూచించడం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కవితాత్మక గౌరవాన్ని నిలుపుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదాలను వాడాం. రెండు సమాంతర పాదాల్లో క్రియను స్పష్టంగా పునరుక్తం చేశాం.
