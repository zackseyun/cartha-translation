  edition: WLC
  text: יַדְבֵּ֣ר עַמִּ֣ים תַּחְתֵּ֑י/נוּ וּ֝/לְאֻמִּ֗ים תַּ֣חַת רַגְלֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/003.yaml
  text: He subdues peoples under us[a], and nations under our feet.
translation:
  language: te
  text: ఆయన ప్రజలను మన కింద, జనాలను మన పాదాల కింద అణచివేస్తాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రజలను మనకు లోబరుస్తాడు.’ ఇక్కడి హీబ్రూ క్రియకు ‘మాట్లాడడం’ అనే భావం కాక, లోబరచడం లేదా అణచివేయడం అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַדְבֵּר
  choice: అణచివేస్తాడు
  rationale: ఇక్కడ హిఫీల్ రూపంలోని క్రియకు, ‘ప్రజలను’ అనే కర్మతోను ‘మన పాదాల కింద’ అనే సమాంతర వాక్యభాగంతోను కలిపి చూసినప్పుడు, ‘మాట్లాడుతాడు’ అనే అర్థం కాక ‘లోబరచడం/అణచివేయడం’ అనే కారణార్థక భావం ఉంది.
- source_word: עַמִּים
  choice: ప్రజలను
  rationale: עם బహువచనం వేర్వేరు ప్రజాసమూహాలను సూచిస్తుంది. ‘ప్రజలను’ అనే పదం సహజంగా ఉండి, తరువాతి לְאֻמִּיםకు ఎంచుకున్న ‘జనాలను’ అనే పదంతో స్వల్ప పదభేదాన్ని నిలుపుతుంది.
- source_word: תַּחְתֵּינוּ
  choice: మన కింద
  rationale: תחתకు జతైన ప్రథమ పురుష బహువచన ప్రత్యయం ఇక్కడ అధీనతను తెలిపే స్థలరూపకాన్ని వ్యక్తం చేస్తుంది. ‘మన కింద’ మూలంలోని సంక్షిప్తతను, సమాంతరతను కాపాడుతుంది.
- source_word: וּלְאֻמִּים
  choice: జనాలను
  rationale: לְאֻמִּים ప్రజలను లేదా జనసమూహాలను సూచిస్తుంది. ‘జనాలను’ అని అనువదించడం మొదటి వాక్యభాగంలోని עַמִּים (‘ప్రజలను’)తో ఉన్న కవితాత్మక పదభేదాన్ని నిలుపుతుంది.
- source_word: תַּחַת רַגְלֵינוּ
  choice: మన పాదాల కింద
  rationale: ఇది జయాన్ని లేదా లోబరచడాన్ని తెలిపే స్పష్టమైన రూపకం. ‘మన పాదాల కింద’ మూలచిత్రాన్ని, రాజసంబంధమైన కీర్తన స్వరాన్ని నిలుపుతుంది.
theological_decisions:
- issue: జయభాషలో సామూహిక స్వరం మరియు కార్యనిర్వహణ
  choice: దేవుడే తన ప్రజల పక్షంగా కార్యం చేస్తూ ఇతర ప్రజలను ‘మన’ కింద అణచివేస్తున్నాడనే పఠనాన్ని నిలిపాం.
  alternative: ఇశ్రాయేలు సైనిక విజయాన్ని గురించి సాధారణ రాజసంబంధ ప్రకటనగా చదవడం.
  rationale: సమీప సందర్భం రాజత్వాన్నీ విజయాన్నీ దేవునికే ఆపాదిస్తుంది. అనువాదం ప్రథమ పురుష బహువచనమైన ‘మన’ను, జయానికి సంబంధించిన రూపకాన్ని మెత్తబరచకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కవితా శైలిని ఉపయోగించాం. రెండు సమాంతర వాక్యభాగాల్లోని ‘మన కింద / మన పాదాల కింద’ అనే రూపకాన్ని నిలుపుతూ, మూలంలోని עַמִּים మరియు לְאֻמִּים మధ్య స్వల్ప పదభేదాన్ని ‘ప్రజలు / జనాలు’ ద్వారా ప్రతిబింబించాం.
