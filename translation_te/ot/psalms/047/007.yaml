id: PSA.47.7
reference: Psalms 47:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י מֶ֖לֶךְ כָּל הָ/אָ֥רֶץ אֱלֹהִ֗ים זַמְּר֥וּ מַשְׂכִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/007.yaml
  text: For God is the King of all the earth[a]; sing a psalm with understanding.
translation:
  language: te
  text: ఎందుకంటే దేవుడు భూమి అంతటికీ రాజు; వివేకంతో కీర్తన పాడండి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నైపుణ్యంగా పాడండి”; లేదా “మస్కీల్ పాడండి.” “మస్కీల్” అనేది ఒక సంగీత లేదా సాహిత్య ప్రక్రియకు సంబంధించిన పదం కావచ్చు.
    reason: מַשְׂכִּיל అనే హీబ్రూ పదం అవగాహన, నైపుణ్యం లేదా ఒక కీర్తన ప్రక్రియను సూచించవచ్చు.
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి స్తుతి పిలుపుకు కారణాన్ని తెలిపే హీబ్రూ సంధాన పదంలోని కారణార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֶלֶךְ כָּל הָאָרֶץ
  choice: భూమి అంతటికీ రాజు
  rationale: దేవుని రాజత్వం భూమి మొత్తాన్ని ఆవరించిందనే విశ్వవ్యాప్త పరిధిని నిలుపుతుంది; తెలుగులో సహజంగా ఉంటుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఇక్కడ వ్యాకరణపరంగా ఏకవచన భావంతో ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది.
- source_word: זַמְּרוּ
  choice: కీర్తన పాడండి
  rationale: బహువచన ఆజ్ఞారూపంలోని సంగీత స్తుతి భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: מַשְׂכִּיל
  choice: వివేకంతో
  rationale: ఈ పదానికి అవగాహనతో లేదా నైపుణ్యంగా పాడటం అనే క్రియావిశేషణార్థం ఉండవచ్చు; అలాగే ఇది ఒక సంగీత లేదా సాహిత్య ప్రక్రియ పేరు కూడా కావచ్చు. ప్రధాన పాఠంలో అర్థవంతమైన సహజ తెలుగు రూపాన్ని ఇచ్చి, నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: దేవుని రాజత్వ పరిధి
  choice: దేవుడు భూమి అంతటికీ రాజు
  alternative: దేవుడు దేశమంతటికీ రాజు
  rationale: הָאָרֶץ సందర్భంలో భూమి మొత్తాన్ని సూచించడం సహజం; వాక్యంలోని విశ్వవ్యాప్త భావాన్ని ఒక దేశానికి పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. కారణార్థక ఆరంభం, విశ్వవ్యాప్త రాజత్వం, బహువచన ఆజ్ఞ నిలుపబడ్డాయి; చివరి పదంలోని భాషాపరమైన సందిగ్ధత పాదసూచికలో స్పష్టంగా ఇవ్వబడింది.
