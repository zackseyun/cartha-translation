  edition: WLC
  text: זַמְּר֣וּ אֱלֹהִ֣ים זַמֵּ֑רוּ זַמְּר֖וּ לְ/מַלְכֵּ֣/נוּ זַמֵּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/006.yaml
  text: Sing praises to God[a], sing praises; sing praises to our King, sing praises.
translation:
  language: te
  text: 'దేవునికి స్తుతులు పాడండి[a], స్తుతులు పాడండి;

    మన రాజుకు స్తుతులు పాడండి, స్తుతులు పాడండి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవునికి సంగీతంతో స్తుతి చేయండి … మన రాజుకు సంగీతంతో స్తుతి చేయండి.’ హెబ్రీ క్రియ కేవలం పాడడమే కాకుండా, విస్తృతంగా సంగీతంతో చేసే స్తుతిని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ / זַמֵּרוּ
  choice: స్తుతిగీతాలు పాడండి
  rationale: ఈ ఆజ్ఞారూప క్రియ ఆరాధన సందర్భంలో సంగీతంతో కూడిన స్తుతిని సూచిస్తుంది. ‘స్తుతిగీతాలు పాడండి’ అనేది కేవలం ‘పాడండి’ కంటే ఆరాధనా భావాన్ని స్పష్టంగా తెలియజేస్తూ, హెబ్రీ పదంలోని విస్తృత సంగీతార్థాన్ని పాదసూచికలో నిలుపుతుంది. మూలంలోని నాలుగుసార్ల పునరుక్తిని తెలుగులోనూ కాపాడాం.
- source_word: אֱלֹהִים
  choice: దేవునికి
  rationale: ఇక్కడ ఈ పదం ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది; לְ ఉపసర్గతో కలిసి స్తుతి ఎవరికి అర్పించాలో తెలిపే సహజ తెలుగు రూపం ‘దేవునికి’.
- source_word: לְמַלְכֵּנוּ
  choice: మన రాజుకు
  rationale: ‘మన రాజు’ అనే రూపం מלךְతో కూడిన ప్రథమ పురుష బహువచన సంబంధప్రత్యయాన్ని నేరుగా వ్యక్తం చేస్తుంది; ‘-కు’ స్తుతి ఆ రాజుకు ఉద్దేశించబడిందని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవిక రాజత్వ బిరుదు
  choice: మన రాజుకు
  alternative: మన రాజైన దేవునికి
  rationale: సమీప సందర్భంలో రాజు దేవుడేనని స్పష్టమైనప్పటికీ, మూలపాఠం ఈ పాదంలో ‘మన రాజు’ అని మాత్రమే చెబుతుంది. అందువల్ల వివరణాత్మక పదాలను చేర్చకుండా మూలంలోని సంక్షిప్తతను, దైవిక రాజత్వ భావాన్ని నిలిపాం. తెలుగులో సాధారణ నామాలకు పెద్ద అక్షర భేదం లేకపోవడం వల్ల బిరుదు భావం సందర్భం ద్వారా వ్యక్తమవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామూహిక ఆరాధనకు తగిన గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం వాడబడింది. మూలంలోని కవితాత్మక నాలుగుసార్ల పునరుక్తి నిలుపబడింది; విరామచిహ్నాలు రెండు సమాంతర పాదాలను స్పష్టంగా చూపుతాయి.
