source:
  edition: WLC
  text: כִּֽי יְהוָ֣ה עֶלְי֣וֹן נוֹרָ֑א מֶ֥לֶךְ גָּ֝דוֹל עַל כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/002.yaml
  text: For Yahweh Most High is to be feared[a], a great King over all the earth.
translation:
  language: te
  text: ఎందుకంటే సర్వోన్నతుడైన యహ్వే భయభక్తులను కలిగించేవాడు[a]; ఆయన సమస్త భూమిపై గొప్ప రాజు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “భయంకరుడు,” “విస్మయం కలిగించేవాడు.” హీబ్రూ పదం గౌరవపూర్వక భయాన్నీ విస్మయాన్నీ కలిగించే వ్యక్తిని వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న స్తుతికి కారణాన్ని పరిచయం చేసే హేత్వర్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరిస్తుంది.
- source_word: עֶלְיוֹן
  choice: సర్వోన్నతుడైన
  rationale: దేవుని అత్యున్నత స్థానాన్ని తెలిపే బిరుదు భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: נוֹרָא
  choice: భయభక్తులకు పాత్రుడు
  rationale: ఈ పదంలోని భయం, విస్మయం, గౌరవం కలిసిన భావాన్ని కేవలం భీతిగా పరిమితం చేయకుండా వ్యక్తం చేస్తుంది.
- source_word: מֶלֶךְ גָּדוֹל
  choice: గొప్ప రాజు
  rationale: రాజరికపు రూపకాన్ని, మహోన్నత స్థానాన్ని నేరుగా నిలుపుతుంది.
- source_word: עַל כָּל הָאָרֶץ
  choice: భూమంతటిమీద
  rationale: ఈ రాజ్యాభిషేక కీర్తన సందర్భంలో స్థానిక దేశం కంటే విశ్వవ్యాప్త పరిపాలనను సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవ నామాన్ని బిరుదుగా మార్చకుండా ఉంచుతుంది.
- issue: נוֹרָא పదంలోని భయం–విస్మయ భావం
  choice: భయభక్తులకు పాత్రుడు
  alternative: భయంకరుడు; విస్మయం కలిగించేవాడు
  rationale: ఆరాధనా సందర్భంలోని గౌరవపూర్వక భయాన్ని కాపాడుతూ, కేవలం భీతిని లేదా సాధారణ ఆశ్చర్యాన్ని మాత్రమే సూచించకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, కీర్తనకు తగిన గంభీరతతో రూపొందించబడింది. రెండో పాదంలో తెలుగులో సహజ ప్రవాహం కోసం అంతర్నిహిత కర్తను “ఆయన”గా వ్యక్తం చేశాం.
