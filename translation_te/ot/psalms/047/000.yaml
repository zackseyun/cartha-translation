lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: సంగీత నాయకునికి
  rationale: కీర్తనల శీర్షికల్లో ఈ పదం సంగీత నిర్వహణ బాధ్యత వహించే నాయకుణ్ణి సూచిస్తుంది. లָ ఉపసర్గలోని ‘కు/కొరకు’ భావాన్ని ‘కి’ సహజంగా తెలియజేస్తుంది; ‘గాననాయకుడు’ కంటే ‘సంగీత నాయకుడు’ విస్తృతమైన సంగీతపాత్రను కాపాడుతుంది.
- source_word: לִבְנֵי קֹרַח
  choice: కోరహు కుమారుల
  rationale: శీర్షికల్లో לְ ఉపసర్గ సంబంధం, అంకితం లేదా కర్తృత్వాన్ని సూచించవచ్చు. తెలుగు షష్ఠీ రూపమైన ‘కుమారుల’ సంబంధాన్ని సహజంగా తెలియజేస్తూ కర్తృత్వాన్ని నిర్బంధంగా నిర్ణయించదు.
- source_word: קֹרַח
  choice: కోరహు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపానికి సమీపంగా లిప్యంతరీకరించింది.
- source_word: מִזְמוֹר
  choice: కీర్తన
  rationale: ఈ పదం వాద్యసంగీతంతో పాడే కీర్తన అనే సాహిత్య-ఆరాధనా ప్రక్రియను సూచిస్తుంది; తెలుగులో ‘కీర్తన’ సహజమైన, స్థిరపడిన సమానార్థకం.
