  text: מָלַ֣ךְ אֱ֭לֹהִים עַל גּוֹיִ֑ם אֱ֝לֹהִ֗ים יָשַׁ֤ב עַל כִּסֵּ֬א קָדְשֽׁ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/008.yaml
  text: God reigns over the nations[a]; God sits on his holy throne.
translation:
  language: te
  text: 'దేవుడు జనాంగాలపై రాజ్యమేలుతున్నాడు[a];

    దేవుడు తన పరిశుద్ధ సింహాసనంపై ఆసీనుడై ఉన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు జనాంగాలపై రాజయ్యాడు; దేవుడు తన పరిశుద్ధ సింహాసనంపై ఆసీనుడయ్యాడు.” హీబ్రూ సంపూర్ణ క్రియారూపాలు ఆయన పాలన స్థాపించబడినదనే భావాన్ని నొక్కిచెప్పవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: מָלַךְ
  choice: రాజ్యమేలుతున్నాడు
  rationale: హీబ్రూ కతల్ రూపం కవితాత్మక ప్రకటనలో ప్రస్తుతం కొనసాగుతున్న రాజరిక స్థితిని సూచించగలదు. ‘రాజ్యమేలుతున్నాడు’ దేవుని రాజత్వాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఇక్కడ బహువచన రూపం ఇశ్రాయేలు యొక్క ఏకైక దేవుణ్ణి సూచిస్తుంది. రెండు పాదాల్లోనూ ఉన్న పునరుక్తిని భావబలానికి అలాగే ఉంచాం.
- source_word: עַל
  choice: పై
  rationale: రాజ్యాధికార సందర్భంలో ఇది స్థలాన్ని మాత్రమే కాకుండా పాలనను, ఆధిపత్యాన్ని సూచిస్తుంది.
- source_word: גּוֹיִם
  choice: జనాంగాలు
  rationale: ఇది వివిధ ప్రజాసమూహాలను సమష్టిగా సూచిస్తుంది. ‘అన్యజనులు’ అనడం ఈ సందర్భం కోరని తరువాతి మతపరమైన భావసూచనలను తీసుకురావచ్చు.
- source_word: יָשַׁב
  choice: ఆసీనుడై ఉన్నాడు
  rationale: మూల క్రియ ‘కూర్చోవడం’ అనే దృశ్యాన్ని ఇస్తుంది; సింహాసన సందర్భంలో ‘ఆసీనుడై ఉన్నాడు’ ఆ దృశ్యాన్నీ రాజరిక భావాన్నీ సహజంగా నిలుపుతుంది.
- source_word: כִּסֵּא
  choice: సింహాసనం
  rationale: రాజరిక, దైవిక సందర్భంలో సాధారణ ‘ఆసనం’ కంటే ‘సింహాసనం’ సరైన అర్థాన్ని ఇస్తుంది.
- source_word: קָדְשׁוֹ
  choice: తన పరిశుద్ధ
  rationale: అక్షరార్థంగా ‘ఆయన పరిశుద్ధత యొక్క సింహాసనం’ అనే నిర్మాణం తెలుగులో సహజంగా ‘తన పరిశుద్ధ సింహాసనం’ అవుతుంది.
theological_decisions:
- issue: హీబ్రూ కవిత్వంలోని సంపూర్ణ క్రియారూపాలు వ్యక్తపరచే దైవిక రాజత్వం
  choice: 'ప్రస్తుత ప్రకటనగా: ‘దేవుడు ... రాజ్యమేలుతున్నాడు; దేవుడు ... ఆసీనుడై ఉన్నాడు.’'
  alternative: 'స్థాపనను నొక్కిచెప్పే విధంగా: ‘దేవుడు జనాంగాలపై రాజయ్యాడు; దేవుడు తన పరిశుద్ధ సింహాసనంపై ఆసీనుడయ్యాడు.’'
  rationale: ఈ కీర్తన దేవుని ప్రస్తుత సార్వత్రిక రాజత్వాన్ని ఉత్సవ ప్రకటనగా కీర్తిస్తుంది. వర్తమాన రూపం కొనసాగుతున్న వాస్తవాన్ని తెలుగులో సహజంగా అందిస్తుంది; అయితే రాజ్యస్థాపనను సూచించే సంపూర్ణ భావం కూడా వ్యాకరణపరంగా సాధ్యమే కాబట్టి పాదసూచికలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, కీర్తనా శైలికి తగిన గౌరవభరితమైన పదజాలం. రెండు సమాంతర పాదాల్లో ‘దేవుడు’ అనే పునరుక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది.
