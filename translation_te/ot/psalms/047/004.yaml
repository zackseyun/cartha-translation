  text: He chooses for us our inheritance[a], the pride of Jacob, whom he loves[c][b]. Selah
translation:
  language: te
  text: ఆయన మన కొరకు మన స్వాస్థ్యాన్ని, తాను ప్రేమించే యాకోబు మహిమను, ఎంచుకుంటాడు.[a][b] సెలా.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఎంచుకుంటాడు’ అనే క్రియను ‘ఎంచుకోనున్నాడు’ అనే భవిష్యదర్థంలో కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: '‘తాను ప్రేమించే’ అనే సంబంధవాక్యం యాకోబును కాకుండా స్వాస్థ్యాన్ని లేదా భూమిని సూచించవచ్చు: ‘తాను ప్రేమించే యాకోబు మహిమను.’'
    reason: alternative_reading
  - marker: c
    text: ‘సెలా’ అనేది అర్థం నిర్ధారించలేని హెబ్రీ ఆరాధనా లేదా సంగీత పదం; సంప్రదాయంగా దీనిని అనువదించకుండా ఉంచుతారు.
    reason: cultural_note
lexical_decisions:
- source_word: יִבְחַר
  choice: ఎంచుకుంటాడు
  rationale: בָּחַר క్రియ యొక్క ఖల్ అసంపూర్ణ రూపం ఇక్కడ దేవుని కొనసాగుతున్న లేదా సాధారణ కార్యాన్ని సూచించగలదు. కీర్తన సందర్భంలో వర్తమానార్థకమైన ‘ఎంచుకుంటాడు’ సహజంగా ఉంది; భవిష్యదర్థం కూడా సాధ్యమని పాదటిప్పణిలో ఉంచాం.
- source_word: לָנוּ
  choice: మనకొరకు
  rationale: ל ఉపసర్గ ప్రయోజనం లేదా పక్షాన్ని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘మనకొరకు’ స్పష్టంగా, గౌరవప్రదంగా ఉంది.
- source_word: נַחֲלָתֵנוּ
  choice: మన స్వాస్థ్యాన్ని
  rationale: נַחֲלָה వారసత్వంగా లేదా వంతుగా లభించిన ఆస్తిని, ముఖ్యంగా నిబంధన భూమిని, సూచించగలదు. ‘స్వాస్థ్యం’ ఆ వంతు/వారసత్వ భావాన్ని నిలుపుతుంది.
- source_word: גְּאוֹן
  choice: మహిమను
  rationale: ఈ పదానికి గర్వం, ఘనత, ఔన్నత్యం, మహిమ అనే అర్థాలు ఉన్నాయి. ఇక్కడ సానుకూలంగా యాకోబుకు చెందిన శ్రేష్ఠమైన స్వాస్థ్యాన్ని సూచిస్తున్నందున ‘మహిమ’ సహజంగా ఉంది; ప్రతికూల అహంకార భావాన్ని అనవసరంగా రప్పించదు.
- source_word: יַעֲקֹב
  choice: యాకోబు
  rationale: మూలంలోని వ్యక్తి/సమూహ నామాన్ని వ్యాఖ్యానాత్మకంగా ‘ఇశ్రాయేలు’గా మార్చకుండా యథాతథంగా లిప్యంతరీకరించాం.
- source_word: אֲשֶׁר אָהֵב
  choice: తాను ప్రేమించే
  rationale: పూర్తి క్రియ ఇక్కడ కొనసాగుతున్న స్థితిని సూచించగలదు. ‘ప్రేమించే’ దేవుని యాకోబుపట్ల నిలిచియున్న ప్రేమను సహజ తెలుగులో తెలియజేస్తుంది. సంబంధవాక్యం స్వాస్థ్యం/భూమిని కూడా సూచించే అవకాశం పాదటిప్పణిలో భద్రపరచబడింది.
- source_word: סֶלָה
  choice: సెలా
  rationale: ఈ ఆరాధనా లేదా సంగీత పదం యొక్క ఖచ్చితమైన అర్థం తెలియదు; అందువల్ల అనిశ్చితిని తొలగించకుండా లిప్యంతరీకరించాం.
theological_decisions:
- issue: ‘తాను ప్రేమించే’ అనే సంబంధవాక్యపు పూర్వపదం
  choice: ఈ సంబంధవాక్యం ‘యాకోబు’ను సూచించేలా ప్రధాన పాఠ్యంలో అమర్చాం.
  alternative: ఇది స్వాస్థ్యం లేదా భూమిని సూచిస్తూ, ‘తాను ప్రేమించే యాకోబు మహిమ’ అనే భావాన్ని ఇవ్వవచ్చు.
  rationale: సమీపంలోని వ్యక్తిగత పూర్వపదమైన యాకోబుతో ఈ వాక్యం సహజంగా అనుసంధానమవుతుంది; దేవుడు యాకోబును ప్రేమించాడనే బైబిలీయ భాషకూ ఇది సరిపోతుంది. అయినా హెబ్రీ వాక్యనిర్మాణంలోని నిజమైన ద్వంద్వార్థాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కీర్తనా శైలిని ఉపయోగించాం. ఎమ్ డాష్‌లతో ‘యాకోబు మహిమ’ను ‘మన స్వాస్థ్యం’కు వివరణాత్మక సమానాంతరంగా చూపించాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
