source:
  edition: WLC
  text: נְדִ֘יבֵ֤י עַמִּ֨ים נֶאֱסָ֗פוּ עַם֮ אֱלֹהֵ֪י אַבְרָ֫הָ֥ם כִּ֣י לֵֽ֭/אלֹהִים מָֽגִנֵּי אֶ֗רֶץ מְאֹ֣ד נַעֲלָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/009.yaml
  text: The nobles of the peoples have gathered as the people of the God of Abraham[a], for the shields of the earth belong to God[b]; he is greatly exalted.
translation:
  language: te
  text: జనజాతుల ప్రముఖులు అబ్రాహాము దేవుని ప్రజలతో సమకూడారు[a]; ఎందుకంటే భూమి కవచాలు దేవునివే[b]; ఆయన ఎంతో ఉన్నతంగా హెచ్చింపబడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అబ్రాహాము దేవుని ప్రజలుగా సమకూడారు.” హెబ్రీ పదబంధం వారితో సన్నిహిత సంబంధాన్ని లేదా వారితో ఒకే ప్రజగా గుర్తింపును సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “భూమి కవచాలు” అనేది అక్షరార్థం; ఇది భూమి పాలకులను లేదా రక్షకులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְדִיבֵי
  choice: ప్రముఖులు
  rationale: ఈ పదం సాధారణంగా ఉన్నత హోదా గలవారిని, ఘనులను లేదా అధిపతులను సూచిస్తుంది. ‘ప్రముఖులు’ ఆధునిక తెలుగులో సహజంగా ఉండి, వారి సామాజిక ప్రాధాన్యాన్ని తెలియజేస్తుంది.
- source_word: עַמִּים
  choice: జనజాతుల
  rationale: బహువచనంలోని విభిన్న ప్రజా సమూహాలను సూచించడానికి ‘జనజాతులు’ అనేది రాజకీయ దేశాలకే పరిమితం కాని విస్తృత పదం.
- source_word: נֶאֱסָפוּ
  choice: సమకూడారు
  rationale: నిఫాల్ రూపం ఇక్కడ వారు ఒకచోట చేరడాన్ని సూచిస్తుంది; ‘సమకూడారు’ కీర్తన శైలికి తగిన సహజ తెలుగు.
- source_word: עַם אֱלֹהֵי אַבְרָהָם
  choice: అబ్రాహాము దేవుని ప్రజలుగా
  rationale: సంక్షిప్తమైన హెబ్రీ నిర్మాణం ప్రముఖులు అబ్రాహాము దేవుని ప్రజలతో గుర్తింపుపొందినట్లు భావించడానికి వీలిస్తుంది. ‘ప్రజలుగా’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘ప్రజలతో కలిసి’ అనే సాధ్యమైన పఠనాన్ని పాదటీపులో ఉంచాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు కారణం లేదా ఆధారం తెలియజేసే సంబంధాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֵאלֹהִים
  choice: దేవునివే
  rationale: לְ ఉపసర్గ ఇక్కడ స్వామ్యాన్ని సూచిస్తుంది; ‘దేవునివే’ ఆ సంబంధాన్ని సంక్షిప్తంగా, బలంగా తెలియజేస్తుంది.
- source_word: מָגִנֵּי אֶרֶץ
  choice: భూమి కవచాలు
  rationale: అక్షరార్థ చిత్రాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది. ఇది పాలకులు లేదా రక్షకులకు రూపకంగా ఉండవచ్చు; ఆ వివరణను పాదటీపులో ఇచ్చాం.
- source_word: מְאֹד נַעֲלָה
  choice: ఆయన ఎంతో ఉన్నతంగా హెచ్చింపబడ్డాడు
  rationale: ముందున్న దేవుడే అంతర్లీన కర్తగా తీసుకుని, నిఫాల్ రూపంలోని ‘అత్యంత ఉన్నతుడిగా చేయబడటం/ఉండటం’ అనే స్తుతి భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: సమకూడిన జనజాతుల ప్రముఖులకు అబ్రాహాము దేవుని ప్రజలతో ఉన్న సంబంధం
  choice: వారు అబ్రాహాము దేవుని ప్రజలుగా సమకూడారు
  alternative: వారు అబ్రాహాము దేవుని ప్రజలతో కలిసి సమకూడారు
  rationale: హెబ్రీ వాక్యనిర్మాణం సంక్షిప్తంగా ఉండి, గుర్తింపు లేదా సన్నిహిత సహవాసం అనే రెండు భావాలకు అవకాశం ఇస్తుంది. కీర్తనలో దేవుని సార్వత్రిక రాజ్యాధికారం దృష్ట్యా ప్రధాన పాఠ్యం గుర్తింపు భావాన్ని ఇస్తుంది; ప్రత్యామ్నాయాన్ని పాదటీపులో ఉంచి సందిగ్ధతను కాపాడాం.
- issue: ‘భూమి కవచాలు’ అనే రూపకం
  choice: రూపక చిత్రాన్ని యథాతథంగా ఉంచడం
  alternative: భూమి పాలకులు లేదా రక్షకులు
  rationale: ఈ మాట పాలకులను లేదా ప్రజలను కాపాడేవారిని సూచించే అవకాశం ఉన్నా, మూలంలోని స్పష్టమైన కవచ రూపకాన్ని ప్రధాన పాఠ్యంలో తొలగించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కీర్తన శైలిని పాటించాం. ‘సమకూడారు,’ ‘దేవునివే,’ ‘హెచ్చింపబడ్డాడు’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండగా, మూలంలోని కవితాత్మక గంభీరతను నిలుపుతాయి. పాదటీపు సూచికలు ప్రధాన పాఠ్యంలో సంబంధిత సందిగ్ధ భాగాల వెంట ఉంచబడ్డాయి.
