id: PSA.47.1
reference: Psalms 47:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּֽל הָ֭/עַמִּים תִּקְעוּ כָ֑ף הָרִ֥יעוּ לֵ֝/אלֹהִ֗ים בְּ/ק֣וֹל רִנָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/001.yaml
  text: Clap your hands[a], all peoples[b]; shout to God with a voice of joy.
translation:
  language: te
  text: సమస్త జనులారా[a], చప్పట్లు కొట్టండి; ఆనంద స్వరంతో[b] దేవునికి జయధ్వానం చేయండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సమస్త జనాంగాలారా.’ హీబ్రూ పదం జాతి లేదా సామూహిక అర్థంలో ‘జనులు’ అనీ, విస్తృతంగా ‘జనాంగాలు’ అనీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఉల్లాస ధ్వనితో’ లేదా ‘ఆనందభరితమైన స్వరంతో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעַמִּים
  choice: సమస్త జనులారా
  rationale: כָּל הָעַמִּים అనేది ప్రజాసమూహాలన్నిటినీ ఉద్దేశించే సంబోధన. ‘జనులు’ అనే బహువచనం దాని జాతి/సామూహిక భావాన్ని కాపాడుతుంది; ‘దేశాలు’ అనే రాజకీయ భావానికి మాత్రమే పరిమితం చేయదు.
- source_word: תִּקְעוּ כָף
  choice: చప్పట్లు కొట్టండి
  rationale: అరచేతిని కొట్టడాన్ని సూచించే హీబ్రూ నుడికారానికి ఆధునిక తెలుగులో సహజమైన సమానార్థక ఆజ్ఞ ఇది. సంబోధితులు అనేకులు కావడం వల్ల తెలుగు వాడుకకు అనుగుణంగా బహువచన భావం వ్యక్తమవుతుంది.
- source_word: הָרִיעוּ
  choice: జయధ్వానం చేయండి
  rationale: ఈ హిఫీల్ ఆజ్ఞ బిగ్గరగా ఉల్లాసపూర్వకమైన ప్రశంసా ధ్వని చేయడాన్ని సూచిస్తుంది. ‘జయధ్వానం చేయండి’ అనేది సందర్భంలోని సంతోషభరితమైన రాజాభినందన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֵאלֹהִים
  choice: దేవునికి
  rationale: ל ఉపసర్గ ఇక్కడ ప్రశంసా ధ్వని ఎవరివైపు ఉద్దేశించబడిందో సూచిస్తుంది; అందువల్ల ‘దేవునికి’ సూటిగా సరిపోతుంది.
- source_word: בְּקוֹל רִנָּה
  choice: ఆనంద స్వరంతో
  rationale: קוֹל అంటే స్వరం/ధ్వని; רִנָּה ఉల్లాసం, ఆనంద కేక లేదా సంతోష గానం అనే భావాలను కలిగి ఉంది. ‘ఆనంద స్వరంతో’ మూలంలోని శ్రావ్య చిత్రణను, సంతోష భావాన్ని సంక్షిప్తంగా కాపాడుతుంది.
theological_decisions:
- issue: పిలుపు ఎవరిని ఉద్దేశించింది
  choice: ఈ వాక్యం సమస్త జనులను విశ్వవ్యాప్తంగా దేవుణ్ణి స్తుతించమని పిలుస్తుంది.
  alternative: ఇది అలంకారికంగా ఇశ్రాయేలు చుట్టుపక్కల జనాంగాలను మాత్రమే ఉద్దేశిస్తుందని చదవడం.
  rationale: హీబ్రూ పాఠం స్పష్టంగా ‘సమస్త జనులు’ అని చెబుతుంది. కీర్తనలోని దేవుని రాజత్వ సందర్భం కూడా ఆయనను అంగీకరించాలనే విశ్వవ్యాప్త పిలుపుకు మద్దతిస్తుంది; ఇది పాఠ్యాధారిత నిర్ణయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, అయినా కీర్తనా పిలుపుకు తగిన గౌరవప్రదమైన శైలిలో అనువదించబడింది. ‘జనులారా’ అనే సంబోధన, సమాంతర ఆజ్ఞలు, ధ్వని సంబంధ పదచిత్రం నిలుపబడ్డాయి.
