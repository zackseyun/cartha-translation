id: 1KI.11.22
reference: 1 Kings 11:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר ל֣/וֹ פַרְעֹ֗ה כִּ֠י מָה אַתָּ֤ה חָסֵר֙ עִמִּ֔/י וְ/הִנְּ/ךָ֥ מְבַקֵּ֖שׁ לָ/לֶ֣כֶת אֶל אַרְצֶ֑/ךָ וַ/יֹּ֣אמֶר לֹ֔א כִּ֥י שַׁלֵּ֖חַ תְּשַׁלְּחֵֽ/נִי־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/022.yaml
  text: Then Pharaoh said to him[a], “But what do you lack with me, that you are seeking to go to your own land?” And he said, “Nothing, but please let me go.”
translation:
  language: te
  text: అప్పుడు ఫరో అతనితో, “నా దగ్గర నీకు ఏ కొదువ ఉందని నీవు నీ దేశానికి వెళ్లాలని కోరుతున్నావు?” అన్నాడు. అందుకు అతడు, “ఏమీ లేదు; కాని నన్ను తప్పక పంపించండి[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో, “పంపించు, నన్ను పంపించు” అని ఒకే క్రియను ఉద్ఘాటనార్థకంగా వాడారు; అందువల్ల అభ్యర్థనకు బలం వస్తుంది.
    reason: హీబ్రూ క్రియారూపంలోని infinitive absolute + finite verb ఉద్ఘాటనను వివరిస్తుంది.
lexical_decisions:
- source_word: כִּי מָה אַתָּה חָסֵר עִמִּי
  choice: నా దగ్గర నీకేమి కొదువ ఉంది?
  rationale: כִּי ప్రశ్నను పరిచయం చేస్తుంది; חָסֵר ‘కొదువగా ఉండడం’ అనే భావాన్ని, עִמִּי ఫరోతో ఉన్న స్థితిని సూచిస్తాయి. ఆధునిక తెలుగులో సహజమైన ప్రత్యక్ష ప్రశ్నగా అనువదించబడింది.
- source_word: וְהִנְּךָ מְבַקֵּשׁ לָלֶכֶת אֶל אַרְצֶךָ
  choice: నీ దేశానికి వెళ్లాలని ఎందుకు కోరుతున్నావు?
  rationale: మూలంలోని ఆశ్చర్యం/దృష్టి ఆకర్షణతో కూడిన ప్రశ్నార్థక సంబంధాన్ని తెలుగులో ‘ఎందుకు’ ద్వారా సహజంగా వ్యక్తం చేసింది; הלך కేవలం ‘వెళ్లు’ అని ఉన్నందున ‘తిరిగి వెళ్లు’ అని విస్తరించలేదు.
- source_word: לֹא
  choice: ఏమీ లేదు
  rationale: ఇది ముందున్న ‘ఏమి కొదువ’ అనే ప్రశ్నకు సంక్షిప్త ప్రతికూల సమాధానం. తెలుగులో అంతర్లీన భావాన్ని స్పష్టంగా తెలిపే సహజ రూపం.
- source_word: כִּי שַׁלֵּחַ תְּשַׁלְּחֵנִי
  choice: అయినా నన్ను తప్పక పంపించివేయండి
  rationale: כִּי సమాధానంలోని మలుపును ‘అయినా’గా చూపుతుంది. שַׁלֵּחַ תְּשַׁלְּחֵנִיలోని infinitive absolute + finite verb నిర్మాణపు బలాన్ని ‘తప్పక’ నిలుపుతుంది; ఫరోతో మాటల సందర్భానికి గౌరవార్థక ఆజ్ఞారూపం వాడబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి వాడబడింది. ఫరోను ఉద్దేశించిన మాటలో గౌరవార్థక బహువచన క్రియను ఉంచి, మూలంలోని ఉద్ఘాటనను ప్రధాన పాఠ్యంలోనే ‘తప్పక’ ద్వారా నిలిపాం.
