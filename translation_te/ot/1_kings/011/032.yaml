id: 1KI.11.32
reference: 1 Kings 11:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/שֵּׁ֥בֶט הָ/אֶחָ֖ד יִֽהְיֶה לּ֑/וֹ לְמַ֣עַן עַבְדִּ֣/י דָוִ֗ד וּ/לְמַ֨עַן֙ יְר֣וּשָׁלִַ֔ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי בָ֔/הּ מִ/כֹּ֖ל שִׁבְטֵ֥י יִשְׂרָאֵֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/032.yaml
  text: But one tribe will remain his[a], for the sake of my servant David and for the sake of Jerusalem, the city that I have chosen from all the tribes of Israel.
translation:
  language: te
  text: అయితే ఒక గోత్రం మాత్రం నా సేవకుడైన దావీదు కోసం, ఇశ్రాయేలు గోత్రాలన్నిటిలోనుండి నేను ఎన్నుకున్న పట్టణమైన యెరూషలేము కోసం అతనిదిగా ఉంటుంది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “ఒక గోత్రం.” ముఖ్యంగా యెరూషలేము ఉన్న ప్రదేశాన్ని బట్టి, బెన్యామీను యూదాతో కలిసివున్నట్లు దీనిని తరచుగా అర్థం చేసుకుంటారు. అయితే మూలపాఠం స్వయంగా “ఒక గోత్రం” అని చెబుతుంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַשֵּׁבֶט הָאֶחָד
  choice: అయితే ఒక గోత్రం
  rationale: שֵׁבֶט ఇక్కడ దండం లేదా రాజదండం కాకుండా గోత్ర సమూహాన్ని సూచిస్తుంది. ముందున్న రాజ్య విభజనకు వ్యతిరేక భావాన్ని וְ ఇక్కడ తెలియజేస్తున్నందున ‘అయితే’ అని అనువదించాం.
- source_word: יִהְיֶה לּוֹ
  choice: అతనిదిగా ఉంటుంది
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘అతనికి ఉంటుంది/అతనిదై ఉంటుంది’ అని చెబుతుంది. సందర్భంలో నిలిచి ఉండే స్వాధీనాన్ని సూచించినా, మూలంలోని సరళతను కాపాడేందుకు ‘అతనిదిగా ఉంటుంది’ ఎంచుకున్నాం.
- source_word: לְמַעַן
  choice: నిమిత్తమూ
  rationale: దావీదు పట్ల, యెరూషలేము పట్ల దేవునికున్న గౌరవం లేదా ఉద్దేశపూర్వక కారణాన్ని సహజమైన, గంభీరమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עַבְדִּי דָוִד
  choice: నా సేవకుడైన దావీదు
  rationale: రాజసంబంధమైన, నిబంధనాత్మక గౌరవ బిరుదును సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: יְרוּשָׁלִַם הָעִיר
  choice: పట్టణమైన యెరూషలేము
  rationale: యెరూషలేమును దేవుడు ఎన్నుకున్న పట్టణంగా గుర్తించే సామానాధికరణ నిర్మాణాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר בָּחַרְתִּי בָהּ
  choice: నేను ఎన్నుకున్న
  rationale: దేవుడు గతంలో చేసిన ఎంపికను నేరుగా తెలియజేస్తుంది; హీబ్రూలోని בָהּ భావం తెలుగులో సంబంధ వాక్య నిర్మాణంలో సహజంగా ఇమిడిపోతుంది.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాలన్నిటిలోనుండి
  rationale: ఒక పెద్ద సమూహంలోనుండి జరిగిన ఎంపికను מִן సూచిస్తున్నందున ఈ రూపం మూలార్థాన్ని స్పష్టంగా కాపాడుతుంది.
theological_decisions:
- issue: ‘ఒక గోత్రం’ అనే మాటకు, యూదా-బెన్యామీను రెండూ రెహబాము ఆధీనంలో ఉన్నట్లు సూచించే ఇతర వచనాలకు మధ్యనున్న సంఖ్యాపరమైన ఉద్రిక్తత
  choice: హీబ్రూ మూలంలో ఉన్నట్లే ‘ఒక గోత్రం’ అని అనువదించడం
  alternative: బెన్యామీనును యూదాలో చేర్చిన అలంకార ప్రయోగంగా వివరించడం, లేదా ప్రధాన పాఠ్యంలో ‘ఒక రాజ్యం’/‘రెండు గోత్రాలు’ అని సమన్వయపరచడం
  rationale: మూలపాఠం స్పష్టంగా ‘ఒక గోత్రం’ అంటుంది. ఇతర వచనాలతో సమన్వయాన్ని అనువాదంలోనే బలవంతంగా చేర్చకుండా, నిజమైన పాఠ్య ఉద్రిక్తతను గమనికకు వదిలాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్యానికి తగిన గంభీరతతో రూపొందించాం. ‘నిమిత్తమూ’ అనే రూపం పునరుక్త సమాంతర నిర్మాణాన్ని నిలుపుతుంది. హీబ్రూ వాక్యంలో క్రియ ఒక్కసారి ఉన్నప్పటికీ, తెలుగులో మొదటి భాగం అసంపూర్ణంగా అనిపించకుండా మరియు సూచ్యార్థం స్పష్టంగా ఉండేందుకు ‘అది అతనిదిగా ఉంటుంది’ అని చివర పునరుద్ఘాటించాం.
