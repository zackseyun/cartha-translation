  naturalness: The proposed revised sentence is fluent modern standard Telugu, retains an appropriately formal biblical register, and avoids the draft’s redundant repetition.
  terminology: గోత్రం, నా సేవకుడైన దావీదు, యెరూషలేము, and ఎన్నుకున్న are suitable. “కోసం” is natural modern Telugu for לְמַעַן in this context and preserves the parallel motivations without imposing a doctrinal interpretation.
  issues:
