  to: అయితే ఒక గోత్రం మాత్రం నా సేవకుడైన దావీదు కోసం, ఇశ్రాయేలు గోత్రాలన్నిటిలోనుండి నేను ఎన్నుకున్న పట్టణమైన యెరూషలేము కోసం అతనిదిగా ఉంటుంది[a].
