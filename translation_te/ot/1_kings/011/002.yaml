  text: from the nations about which Yahweh had said to the sons of Israel[a], “You shall not go in among them, and they shall not come in among you; surely they will turn your heart after their gods”—to these Solomon clung in love.
translation:
  language: te
  text: యెహోవా ఇశ్రాయేలు కుమారులతో[a] ఏ జనాల గురించి, “మీరు వారి మధ్యకు వెళ్లకూడదు; వారు మీ మధ్యకు రాకూడదు. వారు తప్పకుండా మీ హృదయాన్ని తమ దేవుళ్ల వైపు తిప్పుతారు” అని చెప్పాడో, ఆ జనాలనే సొలొమోను ప్రేమతో అంటిపెట్టుకొని ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'సందర్భాన్ని మరింత స్పష్టంగా చెప్పాలంటే: “మీరు వారితో వివాహ సంబంధాలు పెట్టుకోకూడదు; వారూ మీతో పెట్టుకోకూడదు.” హీబ్రూలో అక్షరార్థంగా, “మీరు వారి మధ్యకు వెళ్లకూడదు; వారు మీ మధ్యకు రాకూడదు” అని ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַגּוֹיִם
  choice: ఆ జనాలకు చెందిన స్త్రీలను
  rationale: ఈ పదబంధం మునుపటి వచనంలో పేర్కొన్న విదేశీ స్త్రీలకు సంబంధించి వారి జనాలను సూచిస్తుంది. తెలుగు వాక్యం స్వతంత్రంగా సహజంగా ఉండేందుకు సందర్భంలో అంతర్లీనమైన ‘స్త్రీలను’ స్పష్టంచేశాం; అయితే జనాలనే మూల సూచనగా నిలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపంలో ఇచ్చాం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులతో
  rationale: హీబ్రూ పదబంధంలోని పుంలింగ బహువచన రూపాన్ని, ఒడంబడిక ప్రజలను సమష్టిగా సూచించే సంప్రదాయ ప్రయోగాన్ని నిలిపాం.
- source_word: לֹא תָבֹאוּ בָהֶם וְהֵם לֹא יָבֹאוּ בָכֶם
  choice: మీరు వారి మధ్యకు వెళ్లకూడదు; వారు మీ మధ్యకు రాకూడదు
  rationale: בוא + בְ యొక్క సాధారణ ‘మధ్యకు వెళ్లడం/రావడం’ భావాన్ని, రెండు భాగాల సమాంతర నిర్మాణాన్ని కాపాడాం. సందర్భంలోని వివాహ భావాన్ని పాదటీపులో వివరించాం.
- source_word: אָכֵן
  choice: తప్పకుండా
  rationale: హెచ్చరికలోని నిశ్చయాన్ని, ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יַטּוּ אֶת לְבַבְכֶם
  choice: మీ హృదయాన్ని … వైపు తిప్పుతారు
  rationale: נטה హిఫీల్ రూపంలోని ‘మళ్లించడం/తిప్పడం’ అనే రూపకాన్ని నిలిపాం; సమష్టిని ఉద్దేశించిన ఏకవచన ‘హృదయం’ను అనుసరించాం.
- source_word: אַחֲרֵי אֱלֹהֵיהֶם
  choice: తమ దేవుళ్ల వైపు
  rationale: భక్తి, అనుసరణ దిశను తెలుగులో సహజంగా తెలిపే రూపం; ‘దేవుళ్లు’ బహువచనాన్ని నిలిపింది.
- source_word: בָּהֶם דָּבַק שְׁלֹמֹה לְאַהֲבָה
  choice: ఆ జనాలకు చెందిన స్త్రీలను సొలొమోను ప్రేమతో హత్తుకొని ఉన్నాడు
  rationale: דבק లోని బలమైన అనుబంధాన్ని ‘హత్తుకొని ఉన్నాడు’గా, לְאַהֲבָה లోని ప్రేమ భావాన్ని ‘ప్రేమతో’గా తెలిపాం. పుంలింగ సర్వనామం వ్యాకరణరీత్యా జనాలను తిరిగి సూచించినా, సందర్భరీత్యా వారి స్త్రీలతో సొలొమోను కలిగిన అనుబంధమే ఉద్దేశం.
theological_decisions:
- issue: నిషేధం వివాహ సంబంధాల గురించని ప్రధాన పాఠ్యంలో నేరుగా చెప్పాలా?
  choice: హీబ్రూ సాధారణ ప్రయోగమైన ‘వారి మధ్యకు వెళ్లకూడదు / మీ మధ్యకు రాకూడదు’ను ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘వారితో వివాహ సంబంధాలు పెట్టుకోకూడదు; వారూ మీతో పెట్టుకోకూడదు’ అని స్పష్టంగా అనువదించడం
  rationale: సందర్భం వివాహాన్ని సూచించినా, ఈ వచనంలోని హీబ్రూ మాటలు మరింత సాధారణంగా ఉన్నాయి. అందువల్ల మూలంలోని విస్తృతతను ప్రధాన పాఠ్యంలో కాపాడి, సందర్భార్థాన్ని పాదటీపులో ఇచ్చాం.
- issue: בָּהֶם యొక్క సూచితార్థం
  choice: జనాలను ప్రస్తావిస్తూ, సందర్భంలోని ఆ జనాలకు చెందిన స్త్రీలను స్పష్టంచేయడం
  alternative: ‘వారినే సొలొమోను ప్రేమతో హత్తుకొని ఉన్నాడు’ అని లింగ-సందర్భ అస్పష్టతను యథాతథంగా ఉంచడం
  rationale: హీబ్రూలో సర్వనామం ‘జనాలు’ అనే వ్యాకరణ పూర్వపదాన్ని అనుసరిస్తుంది; అయితే 11:1–2 సందర్భంలో సొలొమోను ప్రేమతో అంటిపెట్టుకున్నది ఆ జనాల స్త్రీలనే. తెలుగులో తప్పుదారి పట్టించే భావం రాకుండా సందర్భ సంబంధాన్ని వ్యక్తం చేశాం.
- issue: ‘ఇశ్రాయేలు కుమారులు’ అనే లింగరూపం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలోని בְּנֵי అనే పుంలింగ బహువచన రూపాన్ని పారదర్శకంగా నిలిపాం; ఇది ఇక్కడ ఒడంబడిక సమాజాన్ని సమష్టిగా సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని సమాంతర నిషేధం, ‘హృదయం’ రూపకం, హెచ్చరికలోని ఉద్ఘాటన నిలిపబడ్డాయి.
