revisions:
- from: అతనికి రాజకుమార్తెలైన భార్యలు ఏడు వందల మంది, ఉపపత్నులు మూడు వందల మంది ఉన్నారు; అతని భార్యలు అతని హృదయాన్ని దారి మళ్లించారు.[a]
  to: అతనికి రాజకుమార్తెలైన[a] ఏడు వందల మంది భార్యలు, మూడు వందల మంది ఉపపత్నులు ఉన్నారు; అతని భార్యలు అతని హృదయాన్ని తిప్పివేశారు.
  rationale: The revision retains the source’s apposition—wives characterized as שָׂרוֹת—while adding a footnote that preserves its legitimate broader sense. It replaces the unnecessary verb-focused note with the source’s more significant lexical ambiguity. ‘తిప్పివేశారు’ conveys that his wives caused his heart to turn, without adding a denominational interpretation or explicitly supplying what it turned away from.
  reviewer_model: gpt-5.6-terra
