id: 1KI.11.3
reference: 1 Kings 11:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִי ל֣/וֹ נָשִׁ֗ים שָׂרוֹת֙ שְׁבַ֣ע מֵא֔וֹת וּ/פִֽלַגְשִׁ֖ים שְׁלֹ֣שׁ מֵא֑וֹת וַ/יַּטּ֥וּ נָשָׁ֖י/ו אֶת לִבּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/003.yaml
  text: He had seven hundred wives[a], princesses, and three hundred concubines; and his wives turned away his heart.
translation:
  language: te
  text: అతనికి రాజకుమార్తెలైన[a] ఏడు వందల మంది భార్యలు, మూడు వందల మంది ఉపపత్నులు ఉన్నారు; అతని భార్యలు అతని హృదయాన్ని తిప్పివేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఉన్నత హోదాగల స్త్రీలు.
    reason: శָׂרוֹת అనే హీబ్రూ పదం ‘రాజకుమార్తెలు’ అనే అర్థాన్ని ఇవ్వవచ్చు; విస్తృతంగా ఉన్నత వంశానికి లేదా ఉన్నత హోదాకు చెందిన స్త్రీలను కూడా సూచించవచ్చు.
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: అతనికి ... ఉన్నారు
  rationale: היה + ל అనే హీబ్రూ ప్రయోగం స్వాధీనాన్ని సూచిస్తుంది; తెలుగులో వ్యక్తులను లెక్కించేటప్పుడు ‘అతనికి ... ఉన్నారు’ సహజంగా ఉంటుంది.
- source_word: נָשִׁים
  choice: భార్యలు
  rationale: రాజవివాహాల సందర్భంలో ఇది సాధారణంగా స్త్రీలను కాక భార్యలను సూచిస్తుంది.
- source_word: שָׂרוֹת
  choice: రాజకుమార్తెలైన
  rationale: ఈ పదం ఉన్నత హోదా గల స్త్రీలను సూచిస్తుంది; సొలొమోను రాజకీయ వివాహాల సందర్భంలో ‘రాజకుమార్తెలైన’ సరిపోతుంది, అయితే ‘ఉన్నత వంశానికి చెందిన’ అనే విస్తృత అర్థం కూడా సాధ్యమే.
- source_word: שְׁבַע מֵאוֹת
  choice: ఏడు వందల మంది
  rationale: మూలంలోని సంఖ్యను నేరుగా, వ్యక్తులకు సహజమైన తెలుగు లెక్కింపు రూపంలో ఇచ్చింది.
- source_word: וּפִלַגְשִׁים
  choice: ఉపపత్నులు
  rationale: పూర్తి భార్య హోదా కంటే తక్కువ సామాజిక లేదా వైవాహిక హోదా కలిగిన గుర్తింపు పొందిన భాగస్వాములను సూచించే సంప్రదాయ తెలుగు పదం.
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: మూడు వందల మంది
  rationale: మూలంలోని సంఖ్యను నేరుగా అనువదించింది.
- source_word: וַיַּטּוּ
  choice: దారి మళ్లించారు
  rationale: נטה యొక్క దిశ మార్చే భావాన్ని నిలుపుతూ, తరువాతి వచనంలోని మతపరమైన విశ్వాసభ్రంశాన్ని ముందుగానే అతిగా వ్యాఖ్యానించకుండా తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: נָשָׁיו
  choice: అతని భార్యలు
  rationale: చివరి వాక్యభాగంలోని కర్తను మూలం ప్రకారం స్పష్టంగా ఉంచింది.
- source_word: אֶת לִבּוֹ
  choice: అతని హృదయాన్ని
  rationale: ‘హృదయం’ అనే పదం భావోద్వేగంతోపాటు అంతరంగం, సంకల్పం, నిబద్ధత అనే హీబ్రూ భావవ్యాప్తిని నిలుపుతుంది.
theological_decisions:
- issue: ‘అతని హృదయం’ అనే మాట యొక్క భావం
  choice: సొలొమోను అంతరంగం, సంకల్పం, నిబద్ధత దారి మళ్లించబడినట్లు అర్థాన్ని తెరిచి ఉంచడం
  alternative: అతని భావోద్వేగ ప్రేమ మాత్రమే మారిందని స్పష్టీకరించడం
  rationale: హీబ్రూ భావనలో హృదయం భావోద్వేగాలకే పరిమితం కాక ఆలోచన, సంకల్పం, విధేయతను కూడా కలిగి ఉంటుంది; అందువల్ల మూల రూపకాన్ని అలాగే ఉంచడం theological tensionను సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఉపపత్నులు’ బైబిలు సందర్భానికి తగిన నిర్దిష్ట పదం. ‘రాజకుమార్తెలైన భార్యలు’ ద్వారా שָׂרוֹת ను נָשִׁים తో అన్వయించి, ఏడు వందల సంఖ్య ఆ భార్యలకే చెందుతుందని స్పష్టంగా ఉంచబడింది.
