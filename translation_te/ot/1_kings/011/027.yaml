  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. హీబ్రూ జాతీయమైన ‘చేయి ఎత్తు’ ప్రధాన పాఠ్యంలో నిలుపబడింది; దాని భావానువాదం పాదసూచికలో ఇవ్వబడింది. ‘మిల్లో’ యొక్క ఖచ్చిత స్వరూపం అనిశ్చితమైనందున పేరుగా ఉంచి వివరణను పాదసూచికకు పరిమితం చేశాం.
