source:
  edition: WLC
  text: וְ/זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר הֵרִ֥ים יָ֖ד בַּ/מֶּ֑לֶךְ שְׁלֹמֹה֙ בָּנָ֣ה אֶת הַ/מִּלּ֔וֹא סָגַ֕ר אֶת פֶּ֕רֶץ עִ֖יר דָּוִ֥ד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/027.yaml
  text: 'And this was the reason why he raised his hand against the king: Solomon had built the Millo and closed up the breach of the city of David his father[a][b].'
translation:
  language: te
  text: అతడు రాజుకు వ్యతిరేకంగా చేయి ఎత్తిన కారణం ఇదే:[a] సొలొమోను మిల్లోను[b] నిర్మించి, తన తండ్రియైన దావీదు పట్టణంలోని గండిని మూసివేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత భావానువాదంగా, “అతడు రాజుపై తిరుగుబాటు చేసిన కారణం ఇదే” అని అనువదించవచ్చు. హీబ్రూ జాతీయం అక్షరార్థంగా “అతడు రాజుకు వ్యతిరేకంగా చేయి ఎత్తాడు” అని ఉంది.
    reason: alternative_reading
  - marker: b
    text: “మిల్లో” అనేది యెరూషలేములోని పేరుగల కోట నిర్మాణం లేదా మెట్లవలె అమర్చిన మట్టిపూరక నిర్మాణం అయి ఉండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר
  choice: కారణం
  rationale: మూలపదానికి ‘విషయం/సంగతి’ అనే అక్షరార్థం ఉన్నా, ఈ వాక్యనిర్మాణంలో అది యెరోబాము చర్యకు వివరణను పరిచయం చేస్తుంది. అందువల్ల ఆధునిక తెలుగులో ‘కారణం’ సహజంగా, సందర్భానుగుణంగా ఉంది.
- source_word: הֵרִים יָד
  choice: చేయి ఎత్తడానికి
  rationale: ‘చేయి ఎత్తు’ అనే హీబ్రూ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, దాని శత్రుత్వం లేదా తిరుగుబాటు భావాన్ని సందర్భం ద్వారా గ్రహించగలిగేలా అనువదించబడింది.
- source_word: בַּמֶּלֶךְ
  choice: రాజుకు వ్యతిరేకంగా
  rationale: ముందున్న జాతీయంతో కలిసినప్పుడు ఈ విభక్తి రాజును లక్ష్యంగా చేసుకున్న విరోధ చర్యను సూచిస్తుంది. హీబ్రూలో ఉన్నట్లే ఇక్కడ సొలొమోను పేరును ముందుగానే చేర్చకుండా ‘రాజు’ అని ఉంచబడింది.
- source_word: הַמִּלּוֹא
  choice: మిల్లో
  rationale: ఇది యెరూషలేములోని నిర్దిష్ట నిర్మాణం లేదా స్థలానికి సంబంధించిన పేరు కావచ్చు. దాని ఖచ్చిత నిర్మాణ స్వభావం అనిశ్చితమైనందున ఊహాత్మక అర్థాన్ని ప్రధాన పాఠ్యంలో పెట్టకుండా లిప్యంతరీకరించబడింది.
- source_word: סָגַר
  choice: మూసివేశాడు
  rationale: క్రియ యొక్క ప్రాథమిక అర్థం ‘మూయడం’. గండికి సంబంధించి ‘మూసివేశాడు’ మూల చిత్రాన్ని కాపాడుతూ తెలుగులో స్పష్టంగా ఉంది.
- source_word: פֶּרֶץ
  choice: గండి
  rationale: కోటగోడ లేదా రక్షణ నిర్మాణంలో ఏర్పడిన తెగిన భాగం లేదా ఖాళీని ‘గండి’ సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: עִיר דָּוִד
  choice: దావీదు పట్టణం
  rationale: దావీదుతో సంబంధమున్న యెరూషలేము కోటప్రాంతానికి వాడే స్థిరమైన స్థలనామాన్ని తెలుగులో సహజమైన రూపంలో అందిస్తుంది.
- source_word: אָבִיו
  choice: తన తండ్రియైన
  rationale: ఇది సొలొమోనుకు దావీదుతో ఉన్న సంబంధాన్ని సూచిస్తుంది. ‘తన తండ్రియైన’ అనే రూపం సంబంధిత వ్యక్తి సొలొమోనేనని స్పష్టంగా తెలియజేస్తుంది.
