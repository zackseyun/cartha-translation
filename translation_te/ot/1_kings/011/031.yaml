source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ לְ/יָֽרָבְעָ֔ם קַח לְ/ךָ֖ עֲשָׂרָ֣ה קְרָעִ֑ים כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֨י קֹרֵ֤עַ אֶת הַ/מַּמְלָכָה֙ מִ/יַּ֣ד שְׁלֹמֹ֔ה וְ/נָתַתִּ֣י לְ/ךָ֔ אֵ֖ת עֲשָׂרָ֥ה הַ/שְּׁבָטִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/031.yaml
  text: 'And he said to Jeroboam[a], “Take for yourself ten pieces, for this is what Yahweh, the God of Israel, says: ‘Look, I am tearing the kingdom out of the hand of Solomon, and I will give you ten tribes.’”'
translation:
  language: te
  text: 'అతడు యెరోబాముతో ఇలా అన్నాడు: “నీ కోసం పది ముక్కలు[a] తీసుకో. ఎందుకంటే ఇశ్రాయేలు దేవుడైన యాహ్వే ఇలా అంటున్నాడు: ‘చూడు, నేను సొలొమోను చేతిలో నుంచి రాజ్యాన్ని చింపివేస్తున్నాను; పది గోత్రాలను నీకు ఇస్తాను.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చింపిన పది ముక్కలు.” హిబ్రూ నామవాచకం చింపడం వల్ల ఏర్పడిన ముక్కలను సూచిస్తుంది; ఇది అహీయా వస్త్రంతో చేసిన సంకేతాత్మక చర్యకు సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לְךָ
  choice: నీ కోసం ... తీసుకో
  rationale: ఆజ్ఞారూపమైన ‘తీసుకో’తో పాటు לְךָలోని వ్యక్తిగత భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘నీ కోసం’ అని నిలిపింది.
- source_word: קְרָעִים
  choice: ముక్కలు
  rationale: ఈ నామవాచకం చింపడం వల్ల ఏర్పడిన వస్త్రపు ముక్కలను సూచిస్తుంది. ప్రధాన పాఠంలో ‘ముక్కలు’ సహజంగా ఉంది; మూలపదంలోని ‘చింపిన’ భావాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
- source_word: כִּי כֹה אָמַר
  choice: ఎందుకంటే ... ఇలా అంటున్నాడు
  rationale: కారణసూచకమైన כִּיని, ప్రవచన ప్రకటన సూత్రమైన כֹה אָמַרను స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవిక నామమైన టెట్రాగ్రామాటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన తెలుగులో తెలిపే ప్రామాణిక రూపం.
- source_word: הִנְנִי
  choice: చూడు, నేను
  rationale: శ్రద్ధను ఆకర్షిస్తూ వెంటనే జరగబోయే లేదా సజీవంగా చిత్రించిన చర్యను సూచించే హిబ్రూ ప్రయోగాన్ని ప్రాచీన శైలికి పోకుండా వ్యక్తపరుస్తుంది.
- source_word: קֹרֵעַ
  choice: చింపివేస్తున్నాను
  rationale: హిబ్రూ కృదంతంలోని సజీవమైన, కొనసాగుతున్న లేదా ఆసన్న చర్య భావాన్ని వర్తమాన ప్రగతిశీల రూపంతో నిలిపింది.
- source_word: הַמַּמְלָכָה
  choice: రాజ్యం
  rationale: రాజకీయ రాజ్యాన్ని నేరుగా, సహజంగా సూచిస్తుంది.
- source_word: מִיַּד שְׁלֹמֹה
  choice: సొలొమోను చేతిలో నుంచి
  rationale: అధికారం లేదా స్వాధీనం నుంచి తొలగించడాన్ని తెలిపే హిబ్రూ ‘చేతి’ రూపకాన్ని నిలిపింది.
- source_word: וְנָתַתִּי לְךָ
  choice: నీకు ఇస్తాను
  rationale: భవిష్యత్ ఫలితాన్ని, పరోక్ష కర్మను సహజమైన తెలుగు పదక్రమంలో వ్యక్తపరుస్తుంది.
- source_word: עֲשָׂרָה הַשְּׁבָטִים
  choice: పది గోత్రాలు
  rationale: సంఖ్యతో కూడిన నిర్దిష్ట గోత్ర సమూహాన్ని సహజమైన తెలుగులో సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవిక నామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవిక నామమే ఉన్నందున దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ప్రవచన ప్రకటనలోని ప్రత్యక్షతను ‘ఇలా అంటున్నాడు,’ ‘చూడు’ అనే రూపాలు నిలుపుతున్నాయి; ‘చేతిలో నుంచి’ అనే మూల రూపకం ఉద్దేశపూర్వకంగా భద్రపరచబడింది.
