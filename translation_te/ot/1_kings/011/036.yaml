review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the contrast, the preservation of one tribal unit, the purposive clause, the lamp metaphor, the enduring temporal expression, the divine-presence idiom, and Jerusalem as the chosen city where God places his name. The order of the Jerusalem phrase is permissible, but recasting the sentence makes the Hebrew purpose relation and the attachment of the city clause clearer.
  naturalness: The current sentence is understandable, but its heavily fronted Jerusalem description interrupts the main clause. “నా సమక్షంలో” is a more direct formal-modern equivalent for “before me” than “నా సన్నిధిలో” here. The footnote’s “రాజసాన్నిధ్యం” is not idiomatic Telugu and can be stated more clearly without adding doctrine.
  terminology: “గోత్రం,” “దీపం,” “నా సేవకుడైన దావీదు,” and “నా పేరు అక్కడ ఉంచడానికి” are appropriate. The note retains the lexical alternative “వెలుగు” and identifies the dynastic force of the metaphor without making that interpretation replace the text.
  issues:
  - severity: low
    issue: Clause order slightly obscures the purpose construction.
    rationale: Placing the full Jerusalem apposition before the purpose predicate is grammatical, but a more linear ordering better reflects that God gives the tribe so that David may have a lamp before him in the chosen city.
  - severity: low
    issue: Footnote wording “రాజసాన్నిధ్యం” is awkward.
    rationale: It is not a natural way to express an enduring royal presence or dynasty in Telugu; “కొనసాగే రాజవంశపు ఉనికి” is clearer while remaining explanatory.
  revised_text: అయితే అతని కుమారునికి ఒక గోత్రాన్ని ఇస్తాను[a], తద్వారా నా సేవకుడైన దావీదుకు నేను నా పేరు అక్కడ ఉంచడానికి నా కోసం ఎన్నుకున్న పట్టణమైన యెరూషలేములో నా సమక్షంలో ఎల్లప్పుడూ ఒక దీపం ఉండేలా చేస్తాను.
