  text: וְ/לִ/בְנ֖/וֹ אֶתֵּ֣ן שֵֽׁבֶט אֶחָ֑ד לְמַ֣עַן הֱיֽוֹת נִ֣יר לְ/דָֽוִיד עַ֠בְדִּ/י כָּֽל הַ/יָּמִ֤ים לְ/פָנַ/י֙ בִּ/יר֣וּשָׁלִַ֔ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי לִ֔/י לָ/שׂ֥וּם שְׁמִ֖/י שָֽׁם־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/036.yaml
  text: But to his son I will give one tribe[a], so that David my servant may always have a lamp before me in Jerusalem, the city that I have chosen for myself to put my name there.
translation:
  language: te
  text: అయితే అతని కుమారునికి ఒక గోత్రాన్ని ఇస్తాను[a], తద్వారా నా సేవకుడైన దావీదుకు నేను నా పేరు అక్కడ ఉంచడానికి నా కోసం ఎన్నుకున్న పట్టణమైన యెరూషలేములో నా సమక్షంలో ఎల్లప్పుడూ ఒక దీపం ఉండేలా చేస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వెలుగు.’ ఇక్కడ ‘దీపం’ అనేది దావీదు వంశం లేదా కొనసాగుతున్న రాజవంశపు ఉనికిని సూచించే రూపకం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנוֹ
  choice: అయితే అతని కుమారునికి
  rationale: ముందటి వాక్యంలోని రాజ్య విభజనకు విరుద్ధంగా, కుమారునికి ఒక భాగం మిగిల్చే భావాన్ని సంధిపదం ఇక్కడ సూచిస్తుంది.
- source_word: שֵׁבֶט אֶחָד
  choice: ఒక గోత్రాన్ని
  rationale: రాజ్యం విభజించబడుతున్న ఈ సందర్భంలో שֵׁבֶט అంటే రాజదండం కంటే గోత్రపరమైన, రాజకీయ విభాగం.
- source_word: לְמַעַן הֱיוֹת
  choice: ఉండేలా చేస్తాను
  rationale: హీబ్రూ నిర్మాణంలోని ఉద్దేశార్థాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: נִיר
  choice: దీపం
  rationale: దావీదు వంశం లేదా రాజసాన్నిధ్యం కొనసాగడాన్ని సూచించే స్పష్టమైన రూపకాన్ని ‘దీపం’ నిలుపుతుంది.
- source_word: לְדָוִיד עַבְדִּי
  choice: నా సేవకుడైన దావీదుకు
  rationale: స్వామ్య సంబంధాన్నీ గౌరవపూర్వక విశేషణాన్నీ సహజమైన తెలుగు క్రమంలో వ్యక్తం చేస్తుంది.
- source_word: כָּל הַיָּמִים
  choice: ఎల్లప్పుడూ
  rationale: కొనసాగుతూ ఉండే కాలభావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לְפָנַי
  choice: నా సన్నిధిలో
  rationale: దేవుని ఎదుట లేదా ఆయన దృష్టిలో కొనసాగడమనే హీబ్రూ నుడికారాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בָּחַרְתִּי לִי
  choice: నా కోసం ఎన్నుకున్న
  rationale: లִי లోని ‘నా కోసం’ అనే ప్రతిఫలార్థాన్ని వదలకుండా నిలుపుతుంది.
- source_word: לָשׂוּם שְׁמִי שָׁם
  choice: నా పేరు అక్కడ ఉంచడానికి
  rationale: ద్వితీయోపదేశకాండ సంబంధిత చరిత్రలోని ప్రాముఖ్యమైన ‘పేరు ఉంచడం’ అనే ఆలయ నుడికారాన్ని వివరణగా మార్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: נִיר లోని దావీదు వంశ రూపకం
  choice: దీపం—దావీదు వంశం లేదా రాజసాన్నిధ్యం కొనసాగడాన్ని సూచించే రూపకం
  alternative: వెలుగు—మరింత సాధారణమైన రూపకం
  rationale: ‘దీపం’ అనే స్పష్టమైన రూపకాన్ని ప్రధాన పాఠ్యంలో ఉంచడం ద్వారా దావీదు వంశ కొనసాగింపు అనే భావాన్ని వ్యాఖ్యానంగా విప్పకుండా పాఠకునికి అందిస్తుంది.
- issue: ‘నా పేరు అక్కడ ఉంచడానికి’ అనే ఆలయ సంబంధిత భాష
  choice: హీబ్రూ ‘పేరు’ నుడికారాన్ని అలాగే నిలుపడం
  alternative: ‘నా సన్నిధిని అక్కడ స్థాపించడానికి’ లేదా ‘అక్కడ ఆరాధించబడడానికి’ అని వివరణాత్మకంగా అనువదించడం
  rationale: మూలంలోని ధార్మిక నుడికారాన్నీ దాని అంతర్గత ఉద్వేగాన్నీ నిలుపుతూ, దాన్ని దేవుని నివాసం లేదా ఆరాధన అనే ఒకే వ్యాఖ్యానంగా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గంభీరమైన బైబిలు శైలి. హీబ్రూ వాక్యంలోని ఉద్దేశార్థం, దావీదు వంశ రూపకం, ‘నా పేరు ఉంచడం’ అనే ఆలయ నుడికారం సంరక్షించబడ్డాయి.
