id: 1KI.11.11
reference: 1 Kings 11:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה לִ/שְׁלֹמֹ֗ה יַ֚עַן אֲשֶׁ֣ר הָֽיְתָה זֹּ֣את עִמָּ֔/ךְ וְ/לֹ֤א שָׁמַ֨רְתָּ֙ בְּרִיתִ֣/י וְ/חֻקֹּתַ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי עָלֶ֑י/ךָ קָרֹ֨עַ אֶקְרַ֤ע אֶת הַ/מַּמְלָכָה֙ מֵֽ/עָלֶ֔י/ךָ וּ/נְתַתִּ֖י/הָ לְ/עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/011.yaml
  text: So Yahweh said to Solomon[a], “Because this has been with you, and you have not kept my covenant and my statutes that I commanded you, I will surely tear the kingdom away from you and give it to your servant.”
translation:
  language: te
  text: 'అప్పుడు యాహ్వే సొలొమోనుతో ఇలా అన్నాడు: “నీవు ఇలా ప్రవర్తించినందున[a], నేను నీకు ఆజ్ఞాపించిన నా నిబంధనను, నా కట్టడలను నీవు పాటించలేదు కాబట్టి, నేను రాజ్యాన్ని తప్పకుండా నీ నుండి చీల్చివేసి నీ సేవకునికి ఇస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఇది నీతో ఉంది.” ఈ సంక్షిప్త హీబ్రూ ప్రయోగం సొలొమోను స్థిరమైన ప్రవర్తనను లేదా పరిస్థితిని సూచించవచ్చు.
    reason: హీబ్రూ మూలంలోని సంక్షిప్తమైన, కొంత సందిగ్ధమైన ప్రయోగానికి అక్షరార్థ ప్రత్యామ్నాయాన్ని చూపడం.
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: יַעַן אֲשֶׁר הָיְתָה זֹּאת עִמָּךְ
  choice: నీవు ఇలా ప్రవర్తిస్తూ ... అందుచేత
  rationale: ఇది తీర్పుకు కారణాన్ని తెలిపే, అక్షరార్థంగా ‘ఇది నీతో ఉంది’ అనే సంక్షిప్త హీబ్రూ ప్రయోగం. సందర్భంలో సొలొమోను స్థిరపడిన ప్రవర్తనను సూచిస్తుందని సహజ తెలుగులో వ్యక్తం చేశాం; అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: שָׁמַרְתָּ
  choice: పాటించలేదు
  rationale: నిబంధనకు, కట్టడలకు రెండింటికీ సరిపోయే సహజమైన ఒడంబడిక సంబంధిత క్రియ.
- source_word: בְּרִיתִי
  choice: నా నిబంధనను
  rationale: בְּרִית్ యొక్క ధార్మిక, న్యాయపరమైన బరువును నిలుపుకునే ప్రామాణిక తెలుగు పదం.
- source_word: חֻקֹּתַי
  choice: నా కట్టడలను
  rationale: దైవికంగా నియమించిన శాసనాలు లేదా నియమాలు అనే భావాన్ని గంభీరమైన, అర్థమయ్యే తెలుగులో తెలియజేస్తుంది.
- source_word: צִוִּיתִי עָלֶיךָ
  choice: నేను నీకు ఆజ్ఞాపించిన
  rationale: హీబ్రూ సంబంధాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: קָרֹעַ אֶקְרַע
  choice: నేను తప్పకుండా ... చీల్చివేసి
  rationale: క్రియానామం మరియు సమాపక క్రియ కలయికలోని గాఢ నిశ్చయాన్ని ‘తప్పకుండా’ ద్వారా నిలిపాం; ‘చీల్చివేయడం’ అనే మూల రూపకాన్ని కూడా కాపాడాం.
- source_word: הַמַּמְלָכָה
  choice: రాజ్యాన్ని
  rationale: సొలొమోను పాలించే రాజ్యం లేదా రాజాధికార పరిధిని సహజంగా సూచిస్తుంది.
- source_word: מֵעָלֶיךָ
  choice: నీ దగ్గర నుండి
  rationale: సొలొమోను ఆధీనంలోనుండి రాజ్యం తొలగించబడుతుందనే భావాన్ని సహజ తెలుగులో ఇస్తుంది.
- source_word: לְעַבְדֶּךָ
  choice: నీ సేవకునికి
  rationale: ఇక్కడ עֶבֶד రాజుకు లోబడిన అధికారిని సూచిస్తుంది; ‘బానిస’ కంటే ‘సేవకుడు’ రాజసభా సందర్భానికి తగినది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ఉంది. దానిని బిరుదుగా మార్చకుండా, తెలుగు పాఠకులకు విస్తృతంగా తెలిసిన లిప్యంతరీకరణను వాడాం.
- issue: הָיְתָה זֹּאת עִמָּךְ అనే సందిగ్ధ ప్రయోగం
  choice: నీవు ఇలా ప్రవర్తిస్తూ
  alternative: ఇది నీతో ఉంది; ఇది నీ స్థితిగా ఉంది
  rationale: తక్షణ సందర్భం సొలొమోను మతభ్రష్ట ప్రవర్తనను సూచిస్తుంది. ప్రధాన పాఠంలో భావాన్ని సహజంగా తెలిపినా, హీబ్రూ ప్రయోగంలోని సంక్షిప్తతను మరియు సాధ్యమైన స్థితి-కేంద్రీకృత భావాన్ని పాదసూచికలో కాపాడాం.
- issue: קָרֹעַ אֶקְרַע లోని బలమైన నిశ్చయం
  choice: తప్పకుండా ... చీల్చివేస్తాను
  alternative: నిశ్చయంగా తీసివేస్తాను
  rationale: తీర్పు యొక్క నిశ్చయాన్నీ, రాజ్యాన్ని ‘చీల్చడం’ అనే సందర్భపరంగా ముఖ్యమైన రూపకాన్నీ రెండింటినీ నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే రాజాజ్ఞ మరియు దైవతీర్పుకు తగిన గంభీరతతో రూపొందించబడింది. ‘నిబంధన’, ‘కట్టడలు’, ‘చీల్చివేయడం’ వంటి మూలపాఠానికి ముఖ్యమైన పదాలు నిలుపబడ్డాయి.
