  text: יַ֣עַן אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַ/יִּֽשְׁתַּחֲווּ֮ לְ/עַשְׁתֹּרֶת֮ אֱלֹהֵ֣י צִֽדֹנִין֒ לִ/כְמוֹשׁ֙ אֱלֹהֵ֣י מוֹאָ֔ב וּ/לְ/מִלְכֹּ֖ם אֱלֹהֵ֣י בְנֵֽי עַמּ֑וֹן וְ/לֹֽא הָלְכ֣וּ בִ/דְרָכַ֗/י לַ/עֲשׂ֨וֹת הַ/יָּשָׁ֧ר בְּ/עֵינַ֛/י וְ/חֻקֹּתַ֥/י וּ/מִשְׁפָּטַ֖/י כְּ/דָוִ֥ד אָבִֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/033.yaml
  text: because they have forsaken me and bowed down to Ashtoreth[a], the god of the Sidonians, to Chemosh, the god of Moab, and to Milcom, the god of the Ammonites, and have not walked in my ways, to do what is right in my eyes and my statutes and my judgments[d][c][b], like David his father.
translation:
  language: te
  text: ఎందుకంటే, వారు నన్ను విడిచిపెట్టి, సీదోనీయుల దేవుడైన అష్తోరెతుకు[a], మోయాబు దేవుడైన కెమోషుకు, అమ్మోనీయుల దేవుడైన మిల్కోముకు[b] వంగి నమస్కరించారు. నా దృష్టికి సరైనదాన్ని చేయడంలోను, నా కట్టడలను, నా న్యాయవిధులను పాటించడంలోను, అతని పూర్వికుడైన దావీదులాగా వారు నా మార్గాల్లో నడవలేదు.[d][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధం అక్షరార్థంగా “సీదోనీయుల దేవుడు” అని ఉంది; అయితే అష్తోరెతు స్త్రీ దేవతగా భావించబడుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ హీబ్రూ పాఠంలో “మిల్కోము” అని ఉంది; కొందరు ఈ పేరును మోలెకుతో అనుసంధానిస్తారు.
    reason: alternative_reading
  - marker: c
    text: ఇక్కడ “అతని తండ్రి” అనే పదం దావీదును తక్షణ జీవశాస్త్రీయ తండ్రిగా కాకుండా రాజవంశ పూర్వికునిగా సూచిస్తుంది.
    reason: cultural_note
  - marker: d
    text: 'మరింత అక్షరార్థంగా: “నా దృష్టికి సరైనదాన్ని, నా కట్టడలను, నా న్యాయవిధులను చేయడానికి వారు నా మార్గాల్లో నడవలేదు.”'
    reason: previous_rendering
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: ఎందుకంటే
  rationale: రాజ్య విభజనకు కారణాన్ని పరిచయం చేసే సహజమైన ఆధునిక తెలుగు causal expression.
- source_word: עֲזָבוּנִי
  choice: నన్ను విడిచిపెట్టి
  rationale: దేవునితో నిబంధన సంబంధాన్ని త్యజించిన గంభీరతను సందర్భంలో తెలియజేస్తుంది.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: వంగి నమస్కరించారు
  rationale: ఆరాధనలో శరీరాన్ని వంచే మూల భావాన్నీ, విగ్రహారాధన సందర్భాన్నీ నిలుపుతుంది.
- source_word: לְעַשְׁתֹּרֶת
  choice: అష్తోరెతుకు
  rationale: హీబ్రూ నామరూపాన్ని తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵי צִדֹנִין
  choice: సీదోనీయుల దేవత
  rationale: అష్తోరెతు స్త్రీ దేవత కావడం వల్ల సహజ తెలుగులో లింగాన్ని స్పష్టం చేసింది; హీబ్రూ పదబంధపు అక్షరార్థాన్ని పాదసూచికలో నిలిపింది.
- source_word: לִכְמוֹשׁ
  choice: కెమోషుకు
  rationale: సరైన పేరును మూల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- source_word: וּלְמִלְכֹּם
  choice: మిల్కోముకు
  rationale: మసొరెటిక్ పాఠంలోని పేరునే అనుసరించింది; మోలెకుతో అనుబంధాన్ని పాదసూచికలో తెలిపింది.
- source_word: וְלֹא הָלְכוּ בִדְרָכַי
  choice: వారు నా మార్గాల్లో నడవలేదు
  rationale: నిబంధన విధేయతను తెలిపే హీబ్రూ రూపకాన్ని సహజంగా నిలిపింది.
- source_word: לַעֲשׂוֹת הַיָּשָׁר בְּעֵינַי וְחֻקֹּתַי וּמִשְׁפָּטַי
  choice: నా దృష్టికి సరైనదాన్ని చేయడంలోను, నా కట్టడలను, నా న్యాయవిధులను పాటించడంలోను
  rationale: ఒకే హీబ్రూ క్రియ మూడు అంశాలను పాలించినప్పటికీ, తెలుగులో చట్టపరమైన అంశాలకు ‘పాటించడం’ సహజంగా ఉండటంతో అర్థాన్ని స్పష్టంగా వ్యక్తం చేసింది.
- source_word: כְדָוִד אָבִיו
  choice: అతని పూర్వికుడైన దావీదులాగా
  rationale: ‘తండ్రి’ ఇక్కడ తక్షణ జీవశాస్త్రీయ తండ్రి కాదు, వంశ పూర్వికుడు అనే సందర్భార్థాన్ని సహజ తెలుగులో తెలిపింది.
theological_decisions:
- issue: అష్తోరెతుతో ఉన్న אֱלֹהֵי పదబంధంలో వ్యాకరణ రూపం మరియు దేవత లింగం
  choice: సీదోనీయుల దేవత
  alternative: సీదోనీయుల దేవుడు
  rationale: అష్తోరెతు స్త్రీ దేవత అనే సూచనను సహజ తెలుగులో ప్రధాన పాఠంలో తెలిపింది; హీబ్రూ పదబంధం అక్షరార్థంగా ‘దేవుడు’ అని ఉండే ఉద్రిక్తతను పాదసూచికలో భద్రపరిచింది.
- issue: מִלְכֹּם అనే దేవుని పేరు
  choice: మిల్కోము
  alternative: మోలెకు
  rationale: WLC/MT పాఠంలోని రూపాన్నే ప్రధాన పాఠంలో ఉంచి, తెలిసిన సంప్రదాయ అనుబంధాన్ని పాదసూచికకు పరిమితం చేసింది.
- issue: כְדָוִד אָבִיו లో אָבִיו యొక్క సంబంధం
  choice: అతని పూర్వికుడైన దావీదు
  alternative: అతని తండ్రి దావీదు
  rationale: సందర్భంలో సూచించబడిన వ్యక్తికి దావీదు వంశపూర్వికుడు; ‘తండ్రి’ అనే సెమిటిక్ వంశపదాన్ని అక్షరార్థంగా ఇస్తే ఆధునిక పాఠకుడికి తప్పుదారి పట్టే అవకాశం ఉంది.
- issue: לַעֲשׂוֹת మరియు తరువాతి మూడు అంశాల సంబంధం
  choice: సరైనదాన్ని చేయడం, కట్టడలను మరియు న్యాయవిధులను పాటించడం
  alternative: నా దృష్టికి సరైనదాన్ని, నా కట్టడలను, నా న్యాయవిధులను చేయడం
  rationale: మూలంలో ఒకే క్రియ పాలించే నిర్మాణాన్ని అర్థపరంగా కాపాడుతూ, తెలుగులో అసహజమైన ‘కట్టడలను చేయడం’ను నివారించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. దేవతల పేర్లు మూల హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి. నిబంధన సంబంధమైన ‘నా మార్గాల్లో నడవడం’ అనే రూపకం నిలుపబడింది.
