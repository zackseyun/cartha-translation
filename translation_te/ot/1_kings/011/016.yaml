source:
  edition: WLC
  text: כִּ֣י שֵׁ֧שֶׁת חֳדָשִׁ֛ים יָֽשַׁב שָׁ֥ם יוֹאָ֖ב וְ/כָל יִשְׂרָאֵ֑ל עַד הִכְרִ֥ית כָּל זָכָ֖ר בֶּ/אֱדֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/016.yaml
  text: For Joab and all Israel had remained there six months[b][a], until he had cut off every male in Edom.
translation:
  language: te
  text: ఎందుకంటే యోవాబు మరియు ఇశ్రాయేలీయులందరూ[a], యోవాబు ఎదోములోని ప్రతి మగవానిని నిర్మూలించేవరకు[b], అక్కడ ఆరు నెలలు ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఇశ్రాయేలీయులందరూ” అనేది దేశంలోని ప్రతి వ్యక్తిని కాక, యోవాబుతో ఉన్న ఇశ్రాయేలు సైన్యాన్ని సూచించే అవకాశం ఉంది.
    reason: cultural_note
  - marker: b
    text: లేదా “నరికివేసేవరకు” లేదా “తుడిచిపెట్టేవరకు.” హీబ్రూ క్రియకు అక్షరార్థంగా “నరికివేయడం” అనే భావం ఉంది; ఇక్కడ అది జనసమూహాన్ని పూర్తిగా తొలగించడాన్ని సూచించే నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా నేపథ్య వివరణను పరిచయం చేసే సంధానార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שֵׁשֶׁת חֳדָשִׁים
  choice: ఆరు నెలలు
  rationale: కాలవ్యవధిని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: יָשַׁב שָׁם
  choice: అక్కడ ... ఉన్నారు
  rationale: సైనిక సందర్భంలో స్థిరనివాసం కంటే కొంతకాలం అక్కడ కొనసాగి ఉండడాన్ని సూచిస్తుంది.
- source_word: יוֹאָב וְכָל יִשְׂרָאֵל
  choice: యోవాబు, ఇశ్రాయేలీయులందరూ
  rationale: సామూహికమైన ‘ఇశ్రాయేలు అంతా’ అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది; సందర్భంలో ఇది యోవాబుతో ఉన్న ఇశ్రాయేలు సైన్యాన్ని సూచించే అవకాశం ఉంది.
- source_word: עַד
  choice: నిర్మూలించేంతవరకు
  rationale: చర్య కొనసాగిన అంతిమ కాలబిందువును స్పష్టంగా తెలియజేస్తుంది.
- source_word: הִכְרִית
  choice: నిర్మూలించే
  rationale: హిఫిల్ రూపంలోని ‘తొలగించు/నరికివేయు’ అనే జనసమూహ నిర్మూలనార్థక ప్రయోగాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּל זָכָר
  choice: ప్రతి మగవాణ్ణి
  rationale: వయోజన పురుషులకే పరిమితం చేయకుండా, זָכָר అనే ‘male’ పదానికి లింగపరంగా ఖచ్చితమైన అర్థాన్ని ఇస్తుంది.
- source_word: בֶּאֱדוֹם
  choice: ఎదోములోని
  rationale: చర్య ఎదోము ప్రాంతంలో జరిగినదనే స్థానార్థక ב భావాన్ని వ్యక్తం చేస్తుంది.
