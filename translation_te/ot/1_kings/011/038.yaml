  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם תִּשְׁמַע֮ אֶת כָּל אֲשֶׁ֣ר אֲצַוֶּ/ךָ֒ וְ/הָלַכְתָּ֣ בִ/דְרָכַ֗/י וְ/עָשִׂ֨יתָ הַ/יָּשָׁ֤ר בְּ/עֵינַ/י֙ לִ/שְׁמ֤וֹר חֻקּוֹתַ/י֙ וּ/מִצְוֺתַ֔/י כַּ/אֲשֶׁ֥ר עָשָׂ֖ה דָּוִ֣ד עַבְדִּ֑/י וְ/הָיִ֣יתִי עִמָּ֗/ךְ וּ/בָנִ֨יתִי לְ/ךָ֤ בַֽיִת נֶאֱמָן֙ כַּ/אֲשֶׁ֣ר בָּנִ֣יתִי לְ/דָוִ֔ד וְ/נָתַתִּ֥י לְ/ךָ֖ אֶת יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/038.yaml
  text: And it shall be[a], if you listen to all that I command you, and walk in my ways, and do what is right in my eyes by keeping my statutes and my commandments, as David my servant did, then I will be with you and build for you a faithful house, just as I built for David, and I will give Israel to you.
translation:
  language: te
  text: '“అప్పుడు ఇలా జరుగుతుంది: నేను నీకు ఆజ్ఞాపించే వాటన్నిటినీ నీవు విని, నా మార్గాల్లో నడుస్తూ, నా సేవకుడైన దావీదు చేసినట్లుగా నా నియమాలను, నా ఆజ్ఞలను పాటించి, నా దృష్టికి సరైనదాన్ని చేస్తే, నేను నీకు తోడుగా ఉండి, దావీదు కోసం కట్టినట్లే నీకూ స్థిరమైన గృహాన్ని[a] కడతాను; ఇశ్రాయేలును నీకు ఇస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నమ్మదగిన గృహాన్ని,” “నిలిచే గృహాన్ని.” ఇక్కడ “గృహం” అంటే స్థిరంగా కొనసాగే రాజవంశం.
    reason: నֶאֱמָן అనే పదం నమ్మదగినది, స్థిరమైనది, నిలిచేది అనే భావాలను కలిగి ఉంది; ‘గృహం’ ఇక్కడ భవనాన్ని కాక రాజవంశాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: విని
  rationale: ఈ క్రియకు వినడం, శ్రద్ధగా ఆలకించడం, విధేయత చూపడం అనే భావపరిధి ఉంది. తరువాతి విధేయతా క్రియలు సందర్భాన్ని స్పష్టం చేస్తున్నందున, మూలంలోని శ్రవణ రూపకాన్ని నిలుపుతూ ‘విని’ అని అనువదించబడింది.
- source_word: וְהָלַכְתָּ בִדְרָכַי
  choice: నా మార్గాల్లో నడుస్తూ
  rationale: ఒడంబడిక సంబంధమైన జీవన విధానాన్ని సూచించే మూల రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הַיָּשָׁר בְּעֵינַי
  choice: నా దృష్టికి సరైనది
  rationale: దేవుని నిర్ణయ ప్రమాణం ప్రకారం న్యాయమైనదాన్ని చేయడం అనే భావాన్ని, ‘నా కళ్లలో’ అనే అసహజ అక్షరానువాదం లేకుండా వ్యక్తం చేస్తుంది.
- source_word: לִשְׁמֹר חֻקּוֹתַי וּמִצְוֺתַי
  choice: నా కట్టడలను, నా ఆజ్ఞలను పాటించి
  rationale: లక్ష్యంకన్నా విధానాన్ని సూచించే సంబంధాన్ని ‘పాటించి’ స్పష్టం చేస్తుంది; రెండు న్యాయపర పదాల మధ్య ఉన్న భేదాన్ని కూడా నిలుపుతుంది.
- source_word: עַבְדִּי
  choice: నా సేవకుడైన
  rationale: రాజైన దావీదు దేవునికి చేసే ఒడంబడిక సేవను సూచించే గౌరవపూర్వక పదంగా ‘సేవకుడు’ సందర్భానికి సరిపోతుంది.
- source_word: בַיִת נֶאֱמָן
  choice: స్థిరమైన గృహం
  rationale: נֶאֱמָן లోని దృఢత్వం, నిశ్చితత్వం, నిలకడ భావాలను ‘స్థిరమైన’ తెలియజేస్తుంది. ‘గృహం’ అనే బైబిలీయ రూపకాన్ని నిలుపుతూ, అది రాజవంశాన్ని సూచిస్తుందని పాదటీపు వివరిస్తుంది.
- source_word: וְנָתַתִּי לְךָ אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును నీకు ఇస్తాను
  rationale: ఇశ్రాయేలు దేవుడు అనుగ్రహించే ప్రత్యక్ష కర్మగా ఉన్న మూల వాక్య నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: వాగ్దానంలోని ‘గృహం’ అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘గృహం’ రూపకాన్ని ఉంచి, అది స్థిరమైన రాజవంశాన్ని సూచిస్తుందని పాదటీపులో స్పష్టం చేయడం
  alternative: దాన్ని భౌతిక ఇల్లు లేదా రాజభవనంగా మాత్రమే అర్థం చేసుకోవడం; లేక ప్రధాన పాఠ్యంలో నేరుగా ‘రాజవంశం’ అని మార్చడం
  rationale: దావీదుకు కట్టిన గృహంతో చేసిన పోలిక రాజవంశ వాగ్దానాన్ని సూచిస్తుంది. అయితే ‘గృహం’ అనే మూల రూపకం దావీదు వాగ్దానంతో ఉన్న అంతర్గ్రంథ సంబంధాన్ని కాపాడుతుంది.
- issue: వాగ్దానపు షరతుగల స్వభావం
  choice: యెరొబాము విధేయతపై ఆధారపడిన నిజమైన షరతుగల వాగ్దానంగా అనువదించడం
  alternative: షరతులేని అనుగ్రహంగా చదవడం
  rationale: హీబ్రూ אִם (‘చేస్తే’) మరియు దాని తరువాత వచ్చే విధేయతా వాక్యాలు వాగ్దానాన్ని స్పష్టంగా షరతుతో ముడిపెడతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘నా మార్గాల్లో నడుస్తూ’ మరియు ‘గృహం కడతాను’ వంటి ప్రధాన బైబిలీయ రూపకాలు నిలుపబడ్డాయి; క్లిష్టమైన వంశార్థం పాదటీపులో వివరించబడింది.
