  to: '“అప్పుడు ఇలా జరుగుతుంది: నేను నీకు ఆజ్ఞాపించే వాటన్నిటినీ నీవు విని, నా మార్గాల్లో నడుస్తూ, నా సేవకుడైన దావీదు చేసినట్లుగా నా నియమాలను, నా ఆజ్ఞలను పాటించి, నా దృష్టికి సరైనదాన్ని చేస్తే, నేను నీకు తోడుగా ఉండి, దావీదు కోసం కట్టినట్లే నీకూ స్థిరమైన గృహాన్ని[a] కడతాను; ఇశ్రాయేలును నీకు ఇస్తాను.”'
  rationale: 'The revision makes only safe lexical and syntactic improvements: it restores the verse’s introductory conditional formula, replaces an ambiguous modern Telugu term for statutes with ‘నియమాలు,’ makes ‘what is right’ the explicit object of ‘do,’ and expresses ‘for David’ unambiguously. The main-text metaphor and the footnote’s restrained dynastic clarification are retained.'
