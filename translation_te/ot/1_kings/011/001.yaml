id: 1KI.11.1
reference: 1 Kings 11:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה אָהַ֞ב נָשִׁ֧ים נָכְרִיּ֛וֹת רַבּ֖וֹת וְ/אֶת בַּת פַּרְעֹ֑ה מוֹאֲבִיּ֤וֹת עַמֳּנִיּוֹת֙ אֲדֹ֣מִיֹּ֔ת צֵדְנִיֹּ֖ת חִתִּיֹּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/001.yaml
  text: 'King Solomon loved many foreign women[a], including Pharaoh’s daughter: Moabite, Ammonite, Edomite, Sidonian, and Hittite women.'
translation:
  language: te
  text: రాజైన సొలొమో ఫరో కుమార్తెను కూడా, మోయాబీయ, అమ్మోనీయ, ఎదోమీయ, సీదోనీయ, హిత్తీయ స్త్రీలైన అనేక విదేశీ స్త్రీలను[a] ప్రేమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అనేక విదేశీ భార్యలను.” హెబ్రీ పాఠంలో “అనేక విదేశీ స్త్రీలను” అని ఉంది; సందర్భాన్ని బట్టి వీరు సొలొమో వివాహం చేసుకున్న లేదా సహచర్య సంబంధం కలిగిన స్త్రీలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ שְׁלֹמֹה
  choice: రాజు సొలొమో
  rationale: వాక్యారంభంలోని וְ కథనాన్ని కొనసాగిస్తుంది; తెలుగులో ప్రత్యేక సంధానపదం లేకుండానే ఆ కొనసాగింపు సహజంగా వ్యక్తమవుతుంది. הַמֶּלֶךְ అనే బిరుదును ‘రాజు’గా, పేరును ప్రామాణిక తెలుగు రూపమైన ‘సొలొమో’గా ఇచ్చాం.
- source_word: אָהַב
  choice: ప్రేమించాడు
  rationale: మూల క్రియకు సాధారణమైన, బలాన్ని తగ్గించని అర్థం ‘ప్రేమించాడు.’ తరువాతి వచనాల్లో ఈ అనురాగం ఆధ్యాత్మికంగా ప్రాముఖ్యమైనదవుతుంది.
- source_word: נָשִׁים נָכְרִיּוֹת רַבּוֹת
  choice: అనేకమంది విదేశీ స్త్రీలను
  rationale: נָשִׁים అంటే నేరుగా ‘స్త్రీలు’; נָכְרִיּוֹת ఇతర ప్రజలకు లేదా దేశాలకు చెందినవారని సూచిస్తుంది; רַבּוֹת అంటే ‘అనేకమంది.’ సందర్భంలో వారు భార్యలు లేదా ఉపపత్నులు అయినా, ప్రధాన పాఠం మూలంలోని విస్తృత పదమైన ‘స్త్రీలు’నే ఉంచుతుంది.
- source_word: וְאֶת בַּת פַּרְעֹה
  choice: వారిలో ఫరో కుమార్తెతోపాటు
  rationale: ఫరో కుమార్తెను సొలొమో ప్రేమించిన విదేశీ స్త్రీలలో చేర్చే సహజ వాక్యసంబంధాన్ని తెలుగులో స్పష్టంగా, సులభంగా వ్యక్తపరుస్తుంది.
- source_word: מוֹאֲבִיּוֹת עַמֳּנִיּוֹת אֲדֹמִיֹּת צֵדְנִיֹּת חִתִּיֹּת
  choice: మోయాబు, అమ్మోను, ఎదోము, సీదోను, హిత్తీ స్త్రీలు
  rationale: జాతి లేదా ప్రాంత సంబంధ విశేషణాలను తెలుగులో సులభంగా గుర్తించగల ప్రామాణిక పేర్లతో ఇచ్చాం. צֵדְנִיֹּתను విస్తృతమైన ‘ఫీనీషీయులు’గా కాక, మూలంలోని నిర్దిష్టతను కాపాడుతూ ‘సీదోను’గా అనువదించాం.
theological_decisions:
- issue: נָשִׁיםను ‘స్త్రీలు’గా అనువదించాలా, ‘భార్యలు’గా అనువదించాలా
  choice: స్త్రీలు
  alternative: భార్యలు
  rationale: హెబ్రీ పాఠంలో ఉన్న పదం నేరుగా ‘స్త్రీలు’ అని అర్థమిస్తుంది. వివాహ లేదా సహచర్య సంబంధం సందర్భం ద్వారా తెలుస్తున్నా, మూలం కంటే భావాన్ని సంకుచితం చేయకుండా ప్రధాన పాఠంలో ‘స్త్రీలు’ను ఉంచి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
- issue: ఫరో కుమార్తె ‘విదేశీ స్త్రీల’లో భాగమా, లేక వేరుగా పేర్కొన్న వర్గమా
  choice: విదేశీ స్త్రీలలో చేర్చబడింది
  alternative: విదేశీ స్త్రీల నుండి వేరుగా అదనంగా పేర్కొనబడింది
  rationale: వాక్యనిర్మాణం ఆమెను సొలొమో ప్రేమించిన స్త్రీల సమూహానికి అదనంగా పేర్కొంటుంది; సందర్భపరంగా ఆమె కూడా విదేశీయురాలే. ‘వారిలో ... తోపాటు’ అనే రూపం ఈ సహజ సంబంధాన్ని చూపుతుంది, అయితే హెబ్రీ సంధాన నిర్మాణం వల్ల సాధ్యమైన వేరొక పఠనాన్ని పూర్తిగా సిద్ధాంతీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలిని ఉపయోగించాం. పొడవైన హెబ్రీ వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి జాబితా సంబంధాన్ని స్పష్టంచేశాం; మూలంలో లేని కాలసూచక ‘ఇప్పుడు’ వంటి పదాన్ని చేర్చలేదు.
