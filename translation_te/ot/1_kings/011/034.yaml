revisions:
- from: అయితే అతని చేతిలోనుండి రాజ్యమంతటినీ నేను తీసుకోను. నేను ఎన్నుకున్న నా సేవకుడైన దావీదు నా ఆజ్ఞలను, నా కట్టడలను పాటించాడు కాబట్టి, అతని నిమిత్తం సొలొమోనును అతని జీవితకాలమంతా పాలకునిగా ఉంచుతాను.
  to: అయితే అతని చేతిలోనుండి రాజ్యమంతటినీ నేను తీసుకోను. నేను ఎన్నుకున్న నా సేవకుడైన దావీదు నా ఆజ్ఞలను, నా కట్టడలను పాటించాడు కాబట్టి, అతని నిమిత్తం సొలొమోనును అతని జీవితకాలమంతా పాలకునిగా నియమిస్తాను.
  rationale: A limited lexical revision replaces “ఉంచుతాను” with “నియమిస్తాను” to reflect the appointive sense of the Hebrew verb. The source’s distinction between a ruler/prince and a king remains represented by “పాలకుడు,” and the draft’s clear contextual identification of Solomon is retained.
