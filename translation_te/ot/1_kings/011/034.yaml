id: 1KI.11.34
reference: 1 Kings 11:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹֽא אֶקַּ֥ח אֶת כָּל הַ/מַּמְלָכָ֖ה מִ/יָּד֑/וֹ כִּ֣י נָשִׂ֣יא אֲשִׁתֶ֗/נּוּ כֹּ֚ל יְמֵ֣י חַיָּ֔י/ו לְמַ֨עַן דָּוִ֤ד עַבְדִּ/י֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי אֹת֔/וֹ אֲשֶׁ֥ר שָׁמַ֖ר מִצְוֺתַ֥/י וְ/חֻקֹּתָֽ/י־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/034.yaml
  text: But I will not take the whole kingdom out of his hand, because I will make him ruler all the days of his life, for the sake of David my servant, whom I chose, who kept my commandments and my statutes.
translation:
  language: te
  text: అయితే అతని చేతిలోనుండి రాజ్యమంతటినీ నేను తీసుకోను. నేను ఎన్నుకున్న నా సేవకుడైన దావీదు నా ఆజ్ఞలను, నా కట్టడలను పాటించాడు కాబట్టి, అతని నిమిత్తం సొలొమోనును అతని జీవితకాలమంతా పాలకునిగా నియమిస్తాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשִׂיא
  choice: పాలకుడు
  rationale: ఈ సందర్భంలో రాజ్యంపై అధికారమున్న వ్యక్తిని సూచిస్తుంది. ‘అధిపతి’ లేదా ‘ప్రభువు’ కంటే సాధారణ ఆధునిక తెలుగు పాఠకులకు ‘పాలకుడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: אֲשִׁתֶּנּוּ
  choice: ఉంచుతాను
  rationale: שים అనే క్రియకు ప్రాథమికంగా ‘పెట్టడం/నియమించడం/ఉంచడం’ అనే భావాలు ఉన్నాయి. సొలొమోను జీవితకాలమంతా అధికారంలో కొనసాగుతాడనే సందర్భార్థాన్ని ‘పాలకునిగా ఉంచుతాను’ సహజంగా తెలియజేస్తుంది.
- source_word: מִצְוֺתַי וְחֻקֹּתָי
  choice: నా ఆజ్ఞలను, నా కట్టడలను
  rationale: రెండు వేర్వేరు హీబ్రూ న్యాయపదాల సమాంతరతను నిలుపుతూ, గౌరవప్రదమైన తెలుగు పదజాలాన్ని ఉపయోగిస్తుంది.
- source_word: לְמַעַן דָּוִד עַבְדִּי
  choice: నా సేవకుడైన దావీదు ... నిమిత్తం
  rationale: ‘దావీదు నిమిత్తం/దావీదును బట్టి’ అనే కారణార్థాన్ని నిలుపుతుంది; తెలుగు వాక్యప్రవాహం కోసం సంబంధిత ఉపవాక్యంతో కలిపి అమర్చబడింది.
theological_decisions:
- issue: దావీదు ఆజ్ఞలను, కట్టడలను పాటించాడనే సంపూర్ణంగా వినిపించే ప్రకటన
  choice: మూలంలోని నిర్బంధంలేని ప్రకటనను యథాతథంగా నిలుపడం
  alternative: ‘సాధారణంగా పాటించాడు’ లేదా ‘నమ్మకంగా పాటించాడు’ అని వివరణాత్మకంగా మార్చడం
  rationale: ఈ వచనం దావీదు జీవితంలోని ఇతర సంఘటనలతో ఎలా సమన్వయమవుతుందో అనువాదంలోనే పరిష్కరించకుండా, హీబ్రూ వచనంలోని ధార్మిక ఉద్వేగాన్ని నిలిపింది.
- issue: నָשִׂיא పదానికి రాజు/అధిపతి/పాలకుడు అనే ప్రత్యామ్నాయాలు
  choice: పాలకుడు
  alternative: అధిపతి
  rationale: సొలొమోను రాజుగానే కొనసాగుతున్నప్పటికీ మూలం מֶלֶךְ (‘రాజు’) అనకుండా נָשִׂיא అంటుంది. అందువల్ల ‘రాజు’ అని సమీకరించకుండా, అధికారపాత్రను సూచించే ‘పాలకుడు’ ఎంచుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే రాజ్య సంబంధిత మరియు నిబంధన సంబంధిత భాషలో గౌరవప్రదమైన ధోరణి నిలుపబడింది. ముందున్న సందర్భం ద్వారా ‘అతడు’ సొలొమోను అని తెలిసినా, రెండవ వాక్యంలో తెలుగు స్పష్టత కోసం పేరును ఉపయోగించాం.
