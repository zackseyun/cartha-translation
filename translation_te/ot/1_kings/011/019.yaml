  yaml_path: translation/ot/1_kings/011/019.yaml
  text: Hadad found great favor in Pharaoh’s eyes[a], and he gave him as a wife the sister of his own wife[b], the sister of Tahpenes the queen mother.
translation:
  language: te
  text: హదదుకు ఫరో దృష్టిలో ఎంతో అనుగ్రహం కలిగింది. ఫరో తన భార్య సోదరిని[a]—రాజమాత తహ్పెనేసు సోదరిని—అతనికి భార్యగా ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలోని ‘అతని భార్య’ అనే పదబంధం సాధారణంగా ఫరో భార్యను సూచిస్తుంది. తక్కువ సంభావ్యతతో, అది హదదు భార్యను సూచిస్తున్నదని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְצָא ... חֵן בְּעֵינֵי ... מְאֹד
  choice: దృష్టిలో ఎంతో అనుగ్రహం పొందాడు
  rationale: ‘ఒకరి కళ్లలో అనుగ్రహం పొందడం’ అనే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతూ, מְאֹד ఇచ్చే తీవ్రతను ‘ఎంతో’తో వ్యక్తం చేసింది.
- source_word: פַרְעֹה
  choice: ఫరో
  rationale: ఈజిప్టు రాజబిరుదుకు తెలుగులో విస్తృతంగా వాడే రూపం.
- source_word: וַיִּתֶּן לוֹ אִשָּׁה
  choice: అతనికి భార్యగా ఇచ్చాడు
  rationale: ఆ స్త్రీని హదదుకు వివాహంలో ఇచ్చాడనే భావాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶת אֲחוֹת אִשְׁתּוֹ
  choice: తన భార్య సోదరిని
  rationale: ప్రధాన పఠనం ప్రకారం కర్తయైన ఫరో భార్యను సూచించేలా సహజ తెలుగు ప్రతిబింబక సర్వనామాన్ని వాడింది; మూలంలోని సాధ్యమైన సర్వనామ సందిగ్ధతను పాదసూచికలో తెలిపింది.
- source_word: אֲחוֹת תַּחְפְּנֵיס
  choice: తహ్పెనేసు సోదరిని
  rationale: ముందున్న ‘తన భార్య సోదరిని’ అనే మాటకు సమానాధికార వివరణగా ఉంచి, ఆ భార్య తహ్పెనేసు అని ప్రధాన సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: תַּחְפְּנֵיס
  choice: తహ్పెనేసు
  rationale: హీబ్రూ వ్యక్తినామానికి సహజమైన తెలుగు లిప్యంతరీకరణ.
- source_word: הַגְּבִירָה
  choice: రాజమాత
  rationale: ఉన్నతస్థాయి రాజకుటుంబ స్త్రీకి వాడే బిరుదుకు సందర్భోచితమైన సంక్షిప్త తెలుగు రూపం; బిరుదు యొక్క విస్తృత అర్థపరిధిని పాదసూచికలో నిలిపింది.
theological_decisions:
- issue: ‘తన భార్య’లోని సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: ఫరోను సూచిస్తున్నదిగా ప్రధాన పాఠ్యంలో అనువదించబడింది.
  alternative: అది హదదును సూచిస్తే, ఫరో హదదు భార్య సోదరిని అతనికి ఇచ్చాడనే అర్థం వస్తుంది.
  rationale: వాక్యంలో భార్యను ఇచ్చే కర్త ఫరో కావడం, వెంటనే వచ్చే ‘తహ్పెనేసు సోదరి’ అనే వివరణ—ఈ రెండూ ఫరోనే సూచనగా గ్రహించడానికి బలమిస్తాయి; అయినా హీబ్రూ రూపంలోని వ్యాకరణపరమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- issue: הַגְּבִירָה బిరుదు యొక్క ఖచ్చిత భావం
  choice: రాజమాత
  alternative: ప్రధాన రాజకుటుంబ స్త్రీ; రాణి
  rationale: ఈ బిరుదు రాజసభలో అత్యున్నత స్థానమున్న స్త్రీని సూచిస్తుంది. అనేక బైబిలు సందర్భాల్లో ‘రాజమాత’ సరిపోతుంది; అయితే ఈజిప్టు రాజసభలో ఖచ్చిత పదవి నిర్ధారితం కానందున ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘దృష్టిలో ... అనుగ్రహం పొందాడు’ అనే రూపం హీబ్రూ నుడికారాన్ని గుర్తించగలిగేంతగా నిలుపుతుంది; సర్వనామం మరియు రాజబిరుదులోని నిజమైన సందిగ్ధతలు పాదసూచికల్లో సంరక్షించబడ్డాయి.
