translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. వ్యక్తి పేర్లు సాధారణ తెలుగు బైబిలు రూపాలకు అనుగుణంగా ‘సొలొమోను,’ ‘యరొబాము,’ ‘షీషకు’ అని, Egypt‌ను ‘ఐగుప్తు’ అని ఇచ్చాం. హెబ్రీ వాక్యక్రమం సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగులో అసహజమైన నామవాచక నిర్మాణాన్ని చివరలో సహజ క్రియారూపంగా మార్చాం.
