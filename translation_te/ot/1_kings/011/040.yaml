id: 1KI.11.40
reference: 1 Kings 11:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְבַקֵּ֥שׁ שְׁלֹמֹ֖ה לְ/הָמִ֣ית אֶת יָרָבְעָ֑ם וַ/יָּ֣קָם יָרָבְעָ֗ם וַ/יִּבְרַ֤ח מִצְרַ֨יִם֙ אֶל שִׁישַׁ֣ק מֶֽלֶךְ מִצְרַ֔יִם וַ/יְהִ֥י בְ/מִצְרַ֖יִם עַד מ֥וֹת שְׁלֹמֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/040.yaml
  text: Then Solomon sought to put Jeroboam to death[a], but Jeroboam arose and fled to Egypt, to Shishak king of Egypt[b], and he was in Egypt until the death of Solomon.
translation:
  language: te
  text: అప్పుడు సొలొమోను యరొబామును చంపడానికి ప్రయత్నించాడు. అయితే యరొబాము లేచి ఐగుప్తుకు పారిపోయి, ఐగుప్తు రాజైన షీషకు వద్దకు వెళ్లాడు; అతడు సొలొమోను మరణం వరకు ఐగుప్తులో ఉన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: ప్రయత్నించాడు
  rationale: בקש ఇక్కడ ఒక కార్యాన్ని చేయడానికి ప్రయత్నించడం లేదా పూనుకోవడం అనే భావాన్ని ఇస్తుంది; ఉద్దేశాన్ని తెలియజేస్తూ అది నెరవేరిందని సూచించదు.
- source_word: לְהָמִית
  choice: చంపాలని
  rationale: מות హిఫీల్ రూపం ‘చనిపోయేలా చేయడం’ అనే కారణార్థక భావాన్ని కలిగి ఉంది. ఆధునిక తెలుగులో ‘చంపాలని’ సహజంగా, స్పష్టంగా ఉంటుంది; మరింత విధివంతమైన ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום కథనంలో నిర్ణయాత్మక చర్యకు మార్పును సూచిస్తుంది. ‘లేచి’ హెబ్రీ క్రమాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: וַיִּבְרַח
  choice: పారిపోయాడు
  rationale: ברח ప్రమాదం నుంచి పారిపోవడాన్ని సూచిస్తుంది; రాజు ప్రాణహాని తలపెట్టిన సందర్భానికి ఇది సరిపోతుంది.
- source_word: מִצְרַיִם ... אֶל שִׁישַׁק מֶלֶךְ מִצְרַיִם
  choice: ఐగుప్తుకు, ఐగుప్తు రాజైన షీషకు దగ్గరికి
  rationale: మొదటి పదం దేశాన్ని గమ్యస్థానంగా, తరువాతి אֶל షీషకును ఆశ్రయించిన నిర్దిష్ట వ్యక్తిగా చూపుతుంది. హెబ్రీలోని ‘ఐగుప్తు’ పునరుక్తిని నిలుపుకుంది.
- source_word: וַיְהִי בְמִצְרַיִם
  choice: అతడు ఐగుప్తులోనే ఉన్నాడు
  rationale: היה + స్థలం అక్షరార్థంగా ‘అక్కడ ఉన్నాడు.’ ‘లోనే’ తరువాత వచ్చే కాలపరిమితితో కలిసి అతడు అక్కడే కొనసాగి ఉన్న భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עַד מוֹת שְׁלֹמֹה
  choice: సొలొమోను చనిపోయే వరకు
  rationale: హెబ్రీ నామవాచక నిర్మాణం అక్షరార్థంగా ‘సొలొమోను మరణం వరకు’; తెలుగులో క్రియారూపం మరింత సహజంగా ఉండి అదే కాలసరిహద్దును స్పష్టంగా తెలుపుతుంది.
