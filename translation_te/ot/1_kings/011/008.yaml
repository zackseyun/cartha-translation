  text: And so he did for all his foreign wives[a], who were burning incense and sacrificing to their gods.
translation:
  language: te
  text: తన విదేశీయ భార్యలందరికోసం కూడా అతడు అలాగే చేశాడు[a]. వారు తమ దేవుళ్లకు ధూపం వేస్తూ బలులు అర్పించేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన విదేశీయ భార్యలందరి విషయంలోనూ అతడు అలాగే చేశాడు.” అతడు చేసిన నిర్దిష్ట కార్యాన్ని హీబ్రూ ఇక్కడ చెప్పకుండా మునుపటి వచనాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  choice: అలాగే
  rationale: మునుపటి వచనంలో చెప్పిన కార్యం ఇతర భార్యల విషయంలోనూ జరిగిందని సూచించే అనుసంధానాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עָשָׂה
  choice: చేశాడు
  rationale: హీబ్రూ క్రియ విస్తృతార్థకమైనది; నిర్దిష్ట కార్యాన్ని ఈ వచనం చెప్పకుండా మునుపటి వచనానికి వదిలేస్తుంది. అందువల్ల ఆ అధ్యాహారాన్ని అలాగే ఉంచుతుంది.
- source_word: לְכָל נָשָׁיו הַנָּכְרִיּוֹת
  choice: తన విదేశీయులైన భార్యలందరి కోసం
  rationale: לְ ఉపసర్గ యొక్క ప్రయోజనార్థాన్ని ‘కోసం’ తెలియజేస్తుంది; נָשָׁיו సందర్భంలో భార్యలను, הַנָּכְרִיּוֹת ఇశ్రాయేలీయేతర మూలాన్ని సూచిస్తుంది.
- source_word: מַקְטִירוֹת
  choice: ధూపం వేస్తూ
  rationale: ఆరాధనా సందర్భంలో קטר హిఫీల్ రూపం ధూపం లేదా పొగ అర్పించడాన్ని సూచిస్తుంది; స్త్రీలింగ బహువచన కృదంత భావాన్ని కొనసాగుతున్న చర్యగా ఉంచుతుంది.
- source_word: וּמְזַבְּחוֹת
  choice: బలులు అర్పించేవారు
  rationale: זבח బలి అర్పించే ఆరాధనా చర్యను సూచిస్తుంది. తెలుగులో సహజమైన వాక్యనిర్మాణంతో అలవాటుగా లేదా కొనసాగుతూ జరిగిన చర్యను తెలియజేస్తుంది.
- source_word: לֵאלֹהֵיהֶן
  choice: తమ దేవుళ్లకు
  rationale: స్త్రీలింగ బహువచన ప్రత్యయాన్ని ‘తమ’గా, బహువచన దేవతలను ‘దేవుళ్లు’గా స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: מַקְטִירוֹת וּמְזַבְּחוֹת అనే కృదంతాల కర్త
  choice: విదేశీయులైన భార్యలే ధూపం వేస్తూ బలులు అర్పించేవారని అనువదించడం
  alternative: సొలొమోను నిర్మించిన పూజాస్థలాలకు సంబంధించిన ఆరాధనా కార్యకలాపంగా సడలించి అర్థం చేసుకోవడం
  rationale: స్త్రీలింగ బహువచన కృదంతాలు ‘విదేశీయులైన అతని భార్యలు’ అనే పదబంధంతో నేరుగా సరిపోతాయి; కాబట్టి చర్యను సొలొమోనుకు మార్చకుండా వ్యాకరణ సంబంధాన్ని నిలుపుతుంది.
- issue: సొలొమోను ఏమి ‘చేశాడు’ అనే అధ్యాహారం
  choice: ‘చేశాడు’ అని మాత్రమే ఉంచి నిర్దిష్ట కార్యాన్ని మునుపటి వచనం ద్వారా గ్రహింపజేయడం
  alternative: ‘వారందరి కోసం ఉన్నత స్థలాలు కట్టించాడు’ లేదా ‘అదే చేశాడు’ అని వివరించడం
  rationale: మూల హీబ్రూ నిర్దిష్ట కర్మను వ్యక్తం చేయకుండా సందర్భంపై ఆధారపడుతుంది. అనువాదం అదనపు వివరాన్ని చేర్చకుండా ఆ అధ్యాహారాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘అలాగే...చేశాడు’ అనే నిర్మాణం మూలంలోని అధ్యాహారాన్ని నిలుపుతుంది; ‘ధూపం వేస్తూ బలులు అర్పించేవారు’ స్త్రీలింగ బహువచన కృదంతాల కొనసాగుతున్న లేదా అలవాటైన ఆరాధనా చర్యను తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
