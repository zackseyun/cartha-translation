  text: Then Ahijah took hold of the new cloak that was on him and tore it into twelve pieces[a].
translation:
  language: te
  text: అప్పుడు అహీయా అతని మీద ఉన్న కొత్త పైవస్త్రాన్ని పట్టుకొని, దానిని పన్నెండు ముక్కలుగా చింపాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు ధరించినది.” హీబ్రూలో అక్షరార్థంగా, “అతని మీద ఉన్నది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפֹּשׂ
  choice: పట్టుకొని
  rationale: వస్త్రాన్ని భౌతికంగా పట్టుకోవడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; హింసాత్మక భావాన్ని అనవసరంగా పెంచదు.
- source_word: שַׂלְמָה
  choice: పైవస్త్రం
  rationale: ఇది శరీరంపై ధరించే బయటి వస్త్రాన్ని సూచిస్తుంది. ‘పైవస్త్రం’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి, కథలో దాన్ని చింపే చర్యకు సరిపోతుంది.
- source_word: הַחֲדָשָׁה
  choice: కొత్త
  rationale: మూలంలోని విశేషణానికి నేరమైన సమానార్థకం; కథనపరంగా ముఖ్యమైన ఈ వివరాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר עָלָיו
  choice: తన మీద ఉన్న
  rationale: అక్షరార్థమైన ‘అతని మీద ఉన్న’ అనే భావాన్ని సహజమైన తెలుగులో ఇస్తూ, ప్రస్తుత కర్త అయిన అహీయాతో సంబంధాన్ని సూచిస్తుంది. ‘ధరించుకున్న’ అనేది సాధ్యమైన భావానువాదం.
- source_word: וַיִּקְרָעֶהָ
  choice: దాన్ని ... చింపాడు
  rationale: క్రియలోని స్త్రీలింగ ఏకవచన కర్మప్రత్యయాన్ని ‘దాన్ని’తో స్పష్టంగా ప్రతిబింబిస్తూ, చింపే చర్యను నేరుగా తెలియజేస్తుంది.
- source_word: שְׁנֵים עָשָׂר קְרָעִים
  choice: పన్నెండు ముక్కలుగా
  rationale: అక్షరార్థంగా ‘పన్నెండు చింపబడిన భాగాలు’ అనే ఫలితాన్ని తెలుగులో సహజంగా తెలియజేస్తూ సంఖ్యను, సూచనాత్మక చర్యను నిలుపుతుంది.
