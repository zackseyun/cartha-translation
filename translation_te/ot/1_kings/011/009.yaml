revisions:
- from: యెహోవా సొలొమోను మీద కోపగించుకున్నాడు. ఎందుకంటే, రెండుసార్లు అతనికి ప్రత్యక్షమైన ఇశ్రాయేలు దేవుడైన యెహోవా నుండి అతని హృదయం తొలగిపోయింది.
  to: సొలొమోనుపై యాహ్వే కోపించాడు, ఎందుకంటే అతని హృదయం అతనికి రెండుసార్లు ప్రత్యక్షమైన ఇశ్రాయేలు దేవుడైన యాహ్వే నుండి మళ్లిపోయింది.
  rationale: The revision aligns the rendering of the Tetragrammaton with the POB policy and replaces an ambiguous Telugu expression with one that naturally retains the Hebrew metaphor of the heart turning away. It preserves the source’s scope and sequence without adding doctrinal interpretation.
