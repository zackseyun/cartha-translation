id: 1KI.11.9
reference: 1 Kings 11:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתְאַנַּ֥ף יְהוָ֖ה בִּ/שְׁלֹמֹ֑ה כִּֽי נָטָ֣ה לְבָב֗/וֹ מֵ/עִ֤ם יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/נִּרְאָ֥ה אֵלָ֖י/ו פַּעֲמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/009.yaml
  text: And Yahweh became angry with Solomon, because his heart had turned away from Yahweh, the God of Israel, who had appeared to him twice.
translation:
  language: te
  text: సొలొమోనుపై యాహ్వే కోపించాడు, ఎందుకంటే అతని హృదయం అతనికి రెండుసార్లు ప్రత్యక్షమైన ఇశ్రాయేలు దేవుడైన యాహ్వే నుండి మళ్లిపోయింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְאַנַּף
  choice: కోపగించుకున్నాడు
  rationale: హిత్పయేల్ రూపం కోపం వ్యక్తమవడాన్ని లేదా కలగడాన్ని సూచిస్తుంది. ‘కోపగించుకున్నాడు’ అనేది తీవ్రతను అతిశయింపకుండా సహజమైన ఆధునిక తెలుగు వ్యక్తీకరణ.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా స్థిరపడిన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచింది.
- source_word: בִּשְׁלֹמֹה
  choice: సొలొమోను మీద
  rationale: కోపాన్ని సూచించే క్రియతో בְ వ్యతిరేక దిశను సూచిస్తుంది; తెలుగులో ‘మీద కోపగించుకోవడం’ సహజమైన ప్రయోగం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: యెహోవా కోపానికి కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: נָטָה לְבָבוֹ
  choice: అతని హృదయం తొలగిపోయింది
  rationale: హృదయం మొగ్గడం లేదా తిరగడం అనే మూలరూపకాన్ని సాధ్యమైనంతగా నిలుపుతూ, విధేయతనుంచి వైదొలగిన భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: מֵעִם
  choice: నుండి
  rationale: సంబంధం లేదా విధేయత నుంచి విడిపోవడాన్ని సూచిస్తుంది; ‘తొలగిపోయింది’తో కలిసి మూలంలోని వియోగ భావాన్ని అందిస్తుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: నిర్మాణ సంబంధాన్ని సహజ తెలుగు విశేషణ రూపంలో చూపిస్తూ, యెహోవాను ఇశ్రాయేలు దేవునిగా గుర్తిస్తుంది.
- source_word: הַנִּרְאָה אֵלָיו
  choice: అతనికి ప్రత్యక్షమైన
  rationale: ఆర్టికల్‌తో ఉన్న నిఫాల్ కృదంతాన్ని యెహోవాను విశేషించే సహజ తెలుగు సంబంధార్థక రూపంగా అనువదించింది.
- source_word: פַּעֲמָיִם
  choice: రెండుసార్లు
  rationale: ద్వివచన రూపానికి సంక్షిప్తమైన, సహజమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చలేదు; లక్ష్యభాషలో విస్తృతంగా గుర్తింపుపొందిన లిప్యంతరీకరణను ఉపయోగించింది.
- issue: దేవుని కోపాన్ని వ్యక్తపరిచే మానవానురూప భాష
  choice: కోపగించుకున్నాడు
  alternative: కోపంగా ఉన్నాడు
  rationale: సొలొమోను వైదొలగినందుకు దేవుడు కోపాన్ని వ్యక్తం చేసినట్లు వచనం నేరుగా చెబుతుంది. దానిని ‘అసంతృప్తి’గా మృదూకరించకుండా, ‘మహా ఆగ్రహించాడు’గా తీవ్రత పెంచకుండా ఉంచింది.
- issue: ‘హృదయం’ అనే అంతరంగ విధేయత రూపకం
  choice: అతని హృదయం తొలగిపోయింది
  alternative: అతడు విధేయతను విడిచిపెట్టాడు
  rationale: ప్రవర్తనను మాత్రమే చెప్పకుండా, మూలంలోని לֵב (‘హృదయం’) పదాన్ని నిలిపి, సొలొమోను అంతరంగ మొగ్గు మరియు నిబద్ధతలో వచ్చిన మార్పును సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గంభీరమైన వచన శైలిని కాపాడింది. కారణ వాక్యాన్ని ప్రత్యేక వాక్యంగా ఉంచడం తెలుగులో సహజ పఠనాన్ని ఇస్తుంది. మూలంలోని సంబంధార్థక భాగం ఏ యెహోవాను సూచిస్తుందో స్పష్టంగా ఉండేందుకు ‘రెండుసార్లు అతనికి ప్రత్యక్షమైన ఇశ్రాయేలు దేవుడైన యెహోవా’ అనే క్రమాన్ని వాడింది.
