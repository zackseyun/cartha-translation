translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. ‘ఫరో ఇల్లు’ అనే మూల రూపకాన్ని నిలిపి, అది రాజభవనం లేదా రాజ కుటుంబ పరివారాన్ని సూచించగల విస్తృతిని సంకుచితం చేయలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
