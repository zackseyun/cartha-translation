  text: וַ/תֵּ֨לֶד ל֜/וֹ אֲח֣וֹת תַּחְפְּנֵ֗יס אֵ֚ת גְּנֻבַ֣ת בְּנ֔/וֹ וַ/תִּגְמְלֵ֣/הוּ תַחְפְּנֵ֔ס בְּ/ת֖וֹךְ בֵּ֣ית פַּרְעֹ֑ה וַ/יְהִ֤י גְנֻבַת֙ בֵּ֣ית פַּרְעֹ֔ה בְּ/ת֖וֹךְ בְּנֵ֥י פַרְעֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/020.yaml
  text: And the sister of Tahpenes bore him Genubath his son[a], and Tahpenes weaned him within Pharaoh’s house[b]; and Genubath was in Pharaoh’s house among the sons of Pharaoh.
translation:
  language: te
  text: తహ్పెనేసు సహోదరి అతనికి గెనుబతు అనే కుమారుణ్ణి కనింది[a]. తహ్పెనేసు ఫరో ఇంటిలో అతనికి పాలుతాగడం మాన్పించింది[b]. గెనుబతు ఫరో ఇంటిలో ఫరో కుమారుల మధ్య ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తహ్పెనేసు సహోదరి అతనికి అతని కుమారుడైన గెనుబతును కనింది” అని కూడా అనువదించవచ్చు. హీబ్రూ పదక్రమాన్ని తెలుగులో ఈ రెండు విధాలుగా వ్యక్తం చేయవచ్చు; భావం మారదు.
    reason: lexical_alternative
  - marker: b
    text: “పాలుతాగడం మాన్పించింది” అంటే ఆ బిడ్డ పాలు తాగే దశను ముగింపజేసిందని అర్థం. ఆ తర్వాత అతడు ఫరో ఇంటిలోనే ఉన్నాడు.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּלֶד לוֹ
  choice: అతనికి … కనింది
  rationale: יָלַד క్రియతో కూడిన לוֹ హదదుకు ఆమె కుమారుణ్ణి కన్నదనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా ‘అతనికి … కనింది’ అని అనువదించాం.
- source_word: אֲחוֹת תַּחְפְּנֵיס
  choice: తహ్పెనేసు సహోదరి
  rationale: హీబ్రూ సమాస సంబంధాన్ని నేరుగా, గౌరవప్రదమైన కథనశైలిలో తెలియజేస్తుంది.
- source_word: גְּנֻבַת
  choice: గెనుబతు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: בְּנוֹ
  choice: అతని కుమారుడైన
  rationale: ప్రత్యయం హదదును సూచిస్తూ గెనుబతు అతని కుమారుడని స్పష్టంగా చెబుతుంది; ఈ బంధాన్ని అనువాదంలో నిలిపాం.
- source_word: וַתִּגְמְלֵהוּ
  choice: అతనికి పాలు మాన్పించింది
  rationale: ఈ సందర్భంలో גמל శిశువు తల్లిపాలు తాగే దశ ముగియడాన్ని సూచిస్తుంది; ‘పెంచింది’ అనే విస్తృతార్థం కంటే ఇది మూలానికి దగ్గరగా ఉంది.
- source_word: בְּתוֹךְ בֵּית פַּרְעֹה
  choice: ఫరో ఇంటిలోనే
  rationale: ఈ పదబంధం రాజభవనంలోని నివాసాన్నీ రాజ కుటుంబ పరివారాన్నీ సూచించగలదు. ‘ఇంటిలోనే’ స్థల భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: וַיְהִי
  choice: ఉండేవాడు
  rationale: కథన సారాంశంలో గెనుబతు ఫరో ఇంటిలో, రాజ కుమారుల మధ్య కొనసాగి ఉండడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּתוֹךְ בְּנֵי פַרְעֹה
  choice: ఫరో కుమారుల మధ్య
  rationale: בְּנֵי అనే పురుష బహువచనాన్ని ‘కుమారులు’గా నిలిపి, రాజ కుటుంబంలో అతని స్థానాన్ని తెలియజేస్తుంది.
