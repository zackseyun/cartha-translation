id: 1KI.11.15
reference: 1 Kings 11:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּֽ/הְי֤וֹת דָּוִד֙ אֶת אֱד֔וֹם בַּ/עֲל֗וֹת יוֹאָב֙ שַׂ֣ר הַ/צָּבָ֔א לְ/קַבֵּ֖ר אֶת הַ/חֲלָלִ֑ים וַ/יַּ֥ךְ כָּל זָכָ֖ר בֶּ/אֱדֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/015.yaml
  text: And it happened[a], when David was in Edom, when Joab the commander of the army had gone up to bury the slain[b], that he struck down every male in Edom—
translation:
  language: te
  text: ఇలా జరిగింది:[a] దావీదు ఎదోములో ఉన్నప్పుడు,[b] సైన్యాధిపతి యోవాబు చంపబడినవారిని పాతిపెట్టడానికి పైకి వెళ్లినప్పుడు, అతడు ఎదోములోని ప్రతి మగవాణ్ణి హతమార్చాడు—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఇది నేపథ్య వివరణను ప్రారంభించడానికి ఉపయోగించే సాధారణ కథన సూత్రం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థంగా “దావీదు ఎదోముతో ఉన్నప్పుడు” అని ఉంది. ఈ సైనిక సందర్భంలో అది దావీదు ఎదోములో ఉండడం లేదా ఎదోముపై దండయాత్ర చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: అప్పుడు ఇలా జరిగింది
  rationale: ఇది నేపథ్య వివరణను ప్రవేశపెట్టే సాధారణ హీబ్రూ కథన సూత్రం. తెలుగులో సహజమైన కథన ప్రవాహాన్ని ఇస్తూనే దాని పరిచయ స్వభావాన్ని నిలుపుతుంది.
- source_word: בִּהְיוֹת דָּוִד אֶת אֱדוֹם
  choice: దావీదు ఎదోములో ఉన్నప్పుడు
  rationale: ב తో కూడిన היה infinitive construct కాలసూచక ఉపవాక్యాన్ని ఏర్పరుస్తుంది. אֶת אֱדוֹם అసాధారణంగా ఉన్నందున, సైనిక సందర్భంలో దావీదు ఎదోములో ఉన్నాడనే అర్థాన్ని ప్రధాన పాఠ్యంలో సహజంగా వ్యక్తపరచి, అక్షరార్థ అస్పష్టతను పాదసూచికలో ఉంచాం.
- source_word: בַּעֲלוֹת יוֹאָב
  choice: యోవాబు ... పైకి వెళ్లి
  rationale: עלה యొక్క ప్రాథమిక దిశార్థమైన ‘పైకి వెళ్లడం’ను నిలుపుతూ, గత కథనంలోని అనుసంధాన చర్యగా సహజమైన తెలుగు రూపాన్ని వాడాం.
- source_word: שַׂר הַצָּבָא
  choice: సైన్యాధిపతి
  rationale: ఆధునిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన సైనిక పదవి; మూలంలోని అధికారిక భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: לְקַבֵּר
  choice: పాతిపెట్టడానికి
  rationale: యోవాబు పైకి వెళ్లిన ఉద్దేశాన్ని తెలిపే purpose infinitiveను నేరుగా వ్యక్తపరుస్తుంది.
- source_word: הַחֲלָלִים
  choice: చంపబడినవారు
  rationale: యుద్ధంలో హతమైనవారిని సూచించే పదం. సాధారణ ‘చనిపోయినవారు’ కంటే హింసాత్మక మరణ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וַיַּךְ
  choice: హతమార్చాడు
  rationale: ఈ సైనిక సందర్భంలో נכה ప్రాణాంతకంగా కొట్టడం లేదా చంపడం అనే అర్థం ఇస్తుంది. ‘హతమార్చాడు’ హింసను తగ్గించకుండా సహజంగా తెలియజేస్తుంది.
- source_word: כָּל זָכָר
  choice: ప్రతి మగవాణ్ణి
  rationale: זָכָר ప్రత్యేకంగా పురుష లింగాన్ని సూచిస్తుంది. ‘ప్రతి’ మూలంలోని సమగ్రతను నిలుపుతుంది.
- source_word: בֶּאֱדוֹם
  choice: ఎదోములోని
  rationale: ב యొక్క స్థానార్థాన్ని తెలుగులో సహజంగా అందిస్తూ, మూలం చెప్పిన పరిధిని విస్తరించదు.
theological_decisions:
- issue: తీవ్రమైన చారిత్రక హింసను మృదువుగా చేయాలా, విస్తరించాలా
  choice: ఎదోములోని ప్రతి మగవాణ్ణి హతమార్చాడనే ప్రత్యక్ష ప్రకటనను నిలుపడం
  alternative: ‘ఎదోమీయులను ఓడించాడు’ అని మృదువుగా చెప్పడం, లేదా సంపూర్ణ నిర్మూలనగా ప్రధాన పాఠ్యంలో విస్తరించడం
  rationale: మూలం తీవ్రమైన సైనిక హింసను నేరుగా నివేదిస్తుంది. అనువాదం దానిని సభ్యోక్తిగా మార్చకూడదు; అదే సమయంలో వచనం చెప్పినదానికంటే మించి సిద్ధాంతపరమైన లేదా చారిత్రక వివరణను చేర్చకూడదు.
- issue: וַיַּךְ లోని కర్తను గుర్తించడం
  choice: సమీప కర్త అయిన యోవాబునే ‘హతమార్చాడు’ అనే క్రియకు కర్తగా సహజ వాక్య నిర్మాణంలో చూపడం
  alternative: దావీదును కర్తగా స్పష్టీకరించడం లేదా అస్పష్టమైన బహువచన కర్తను చేర్చడం
  rationale: హీబ్రూ వాక్య నిర్మాణంలో సైన్యాధిపతి యోవాబు సమీప ఏకవచన కర్త. అయితే మూలంలో పేరు మళ్లీ చెప్పబడనందున అనవసర వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన కథన శైలిని వాడాం. ‘సైన్యాధిపతి,’ ‘హతమార్చాడు’ వంటి పదాలు అర్థస్పష్టతను, చారిత్రక గంభీరతను నిలుపుతాయి. వాక్యం తరువాతి వచనంలో కొనసాగుతుందని సూచించడానికి చివర దీర్ఘ గీతను ఉంచాం.
