  naturalness: ‘అరాము మీద రాజ్యపాలన చేశాడు’ అర్థవంతమైనప్పటికీ కొద్దిగా భారంగా ఉంది. ‘అరాము మీద రాజుగా పరిపాలించాడు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, అలాగే מלך యొక్క రాజత్వ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది. ‘అసహ్యించుకున్నాడు’ కוץ యొక్క బలమైన ఏవగింపు/విరక్తి భావానికి తగినదే.
