  text: וַ/יְהִ֨י שָׂטָ֤ן לְ/יִשְׂרָאֵל֙ כָּל יְמֵ֣י שְׁלֹמֹ֔ה וְ/אֶת הָ/רָעָ֖ה אֲשֶׁ֣ר הֲדָ֑ד וַ/יָּ֨קָץ֙ בְּ/יִשְׂרָאֵ֔ל וַ/יִּמְלֹ֖ךְ עַל אֲרָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/025.yaml
  text: And he was an adversary to Israel all the days of Solomon[a], along with the harm that Hadad caused. And he loathed Israel and reigned over Aram.
translation:
  language: te
  text: అతడు సొలొమోను కాలమంతా ఇశ్రాయేలుకు విరోధిగా ఉన్నాడు, హదదు కలిగించిన హానితోపాటు.[a] అతడు ఇశ్రాయేలును అసహ్యించుకొని, అరాము మీద రాజుగా పరిపాలించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హదదు కలిగించిన హానికి అదనంగా.” హెబ్రీయ వాక్యభాగం సంక్షిప్తంగా ఉండి అర్థనిర్ణయానికి క్లిష్టంగా ఉంది; హదదు కలిగించిన హానికి అదనంగా ఈ విరోధి తలెత్తాడనే భావం కూడా కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂטָן
  choice: విరోధి
  rationale: ఈ చారిత్రక సందర్భంలో ఇది మానవ రాజకీయ ప్రత్యర్థిని సూచిస్తుంది; తరువాతి కాలంలోని ‘సాతాను’ అనే ప్రత్యేక నామ భావాన్ని దిగుమతి చేయదు.
- source_word: לְיִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు
  rationale: שָׂטָןతో వచ్చిన לְ వ్యతిరేకతకు గురైన పక్షాన్ని సూచిస్తుంది; ‘విరోధి’ అనే పదమే ఆ ప్రతికూల భావాన్ని స్పష్టం చేస్తుంది.
- source_word: כָּל יְמֵי שְׁלֹמֹה
  choice: సొలొమోను జీవించిన కాలమంతా
  rationale: హెబ్రీయ temporal expression‌ను సహజమైన ఆధునిక తెలుగులో అందిస్తూ, అతని జీవితకాలం/పాలనకాలమంతటినీ సూచించే భావాన్ని నిలుపుతుంది.
- source_word: וְאֶת הָרָעָה אֲשֶׁר הֲדָד
  choice: హదదు కలిగించిన హానితోపాటు
  rationale: ఈ వాక్యభాగం సంక్షిప్తంగా, వ్యాకరణపరంగా క్లిష్టంగా ఉంది. רָעָהను నైతిక దుష్టత్వంగా కాక ఇశ్రాయేలుకు కలిగిన హానిగా తీసుకొని, additive సంబంధాన్ని ‘తోపాటు’తో చూపించింది.
- source_word: רָעָה
  choice: హాని
  rationale: ఇక్కడ భావం నైతిక ‘చెడు’ కంటే శత్రుత్వం వల్ల కలిగిన నష్టం లేదా కీడుకు దగ్గరగా ఉంది.
- source_word: וַיָּקָץ
  choice: అసహ్యించుకున్నాడు
  rationale: קוץ ఇక్కడ తీవ్రమైన అయిష్టత, ఏవగింపు లేదా ద్వేషపూరిత విరక్తిని సూచిస్తుంది; ‘అసహ్యించుకున్నాడు’ సాధారణ పాఠకులకు సహజంగా ఉండి బలమైన భావాన్ని కాపాడుతుంది.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలును
  rationale: קוץతో בְ అసహ్యానికి గురైన కర్మను సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో ప్రత్యక్ష కర్మగా ఇవ్వడం సహజం.
- source_word: וַיִּמְלֹךְ עַל אֲרָם
  choice: అరాము మీద రాజ్యపాలన చేశాడు
  rationale: అరాము అనే ప్రాచీన స్వనామాన్ని నిలుపుతుంది; מלך యొక్క రాజుగా పాలించడమనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: שָׂטָןను ‘సాతాను’ అనే ప్రత్యేక నామంగా అనువదించాలా?
  choice: మానవ ‘విరోధి’
  alternative: సాతాను
  rationale: సందర్భం సొలొమోనుకు, ఇశ్రాయేలుకు ఎదిరించిన రాజకీయ ప్రత్యర్థుల గురించి ఉంది. ఇక్కడ ఈ పదం సాధారణ నామవాచకం; దాన్ని ‘సాతాను’గా ఇవ్వడం పాఠ్యంలో లేని తరువాతి దయ్యశాస్త్ర భావాన్ని చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని క్లిష్టమైన additive clause‌ను ప్రధాన పాఠ్యంలో సహజంగా ఇచ్చి, దాని అనిశ్చితిని పాదటీకలో నిలిపాం.
