  text: וַ/יִּשְׁכַּ֤ב שְׁלֹמֹה֙ עִם אֲבֹתָ֔י/ו וַ/יִּ֨קָּבֵ֔ר בְּ/עִ֖יר דָּוִ֣ד אָבִ֑י/ו וַ/יִּמְלֹ֛ךְ רְחַבְעָ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/043.yaml
  text: And Solomon slept with his fathers and was buried in the city of David his father[a], and Rehoboam his son reigned in his place.
translation:
  language: te
  text: సొలొమోను తన పితరులతో నిద్రించాడు[a]. అతడు తన తండ్రియైన దావీదు పట్టణంలో సమాధి చేయబడ్డాడు. అతని కుమారుడు రెహబాము అతని స్థానంలో రాజ్యమేలాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తన పితరులతో నిద్రించాడు’ అనేది మరణించి తన పూర్వీకులతో చేరడాన్ని సూచించే సంప్రదాయ హీబ్రూ నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: నిద్రించాడు
  rationale: ‘తన పితరులతో నిద్రించడం’ అనే హీబ్రూ రాజవంశీయ మరణవార్త సూత్రంలోని రూపకాన్ని నిలుపుతుంది; కేవలం ‘చనిపోయాడు’ అని వివరణాత్మకంగా మార్చదు.
- source_word: עִם אֲבֹתָיו
  choice: తన పితరులతో
  rationale: హీబ్రూ పదబంధంలోని వంశపారంపర్య భావాన్నీ, సంప్రదాయ మరణవార్త శైలినీ కాపాడుతుంది. ఆధునిక పాఠకునికి అర్థం స్పష్టమయ్యేలా పాదసూచిక ఇచ్చాం.
- source_word: וַיִּקָּבֵר
  choice: సమాధి చేయబడ్డాడు
  rationale: నిఫల్ క్రియారూపంలోని కర్మణి భావాన్ని సహజమైన తెలుగు పదప్రయోగంతో తెలియజేస్తుంది.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: తన తండ్రియైన దావీదు పట్టణంలో
  rationale: సమాధి స్థలాన్ని ‘దావీదు పట్టణం’గా గుర్తిస్తూ, దావీదు సొలొమోను తండ్రి అనే మూలపాఠంలోని వంశీయ ప్రాధాన్యాన్ని కూడా నిలుపుతుంది.
- source_word: וַיִּמְלֹךְ
  choice: రాజ్యమేలాడు
  rationale: రాజవంశ వారసత్వ ప్రకటనకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన తెలుగు ప్రయోగం.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: కాలక్రమాన్ని మాత్రమే సూచించే ‘అతని తర్వాత’ కంటే, రాజ్యాధికారంలో వారసుడిగా అతని స్థానాన్ని చేపట్టిన భావాన్ని సరిగ్గా తెలియజేస్తుంది.
