source:
  edition: WLC
  text: רַ֤ק אֶת כָּל הַ/מַּמְלָכָה֙ לֹ֣א אֶקְרָ֔ע שֵׁ֥בֶט אֶחָ֖ד אֶתֵּ֣ן לִ/בְנֶ֑/ךָ לְמַ֨עַן֙ דָּוִ֣ד עַבְדִּ֔/י וּ/לְמַ֥עַן יְרוּשָׁלִַ֖ם אֲשֶׁ֥ר בָּחָֽרְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/013.yaml
  text: Yet I will not tear away the whole kingdom; I will give one tribe to your son[a], for the sake of David my servant and for the sake of Jerusalem, which I have chosen.
translation:
  language: te
  text: అయినా[a] రాజ్యమంతటినీ నేను చీల్చివేయను; నా సేవకుడైన దావీదు నిమిత్తమూ, నేను ఎన్నుకున్న యెరూషలేము నిమిత్తమూ ఒక గోత్రాన్ని నీ కుమారునికి ఇస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అయితే, రాజ్యమంతటినీ నేను చీల్చివేయను.”
    reason: రַק అనే పదం వ్యతిరేక పరిమితిని ‘అయినా’ అని లేదా ‘అయితే’ అనే మలుపు/పరిమితి భావంతో వ్యక్తం చేయవచ్చు.
lexical_decisions:
- source_word: רַק
  choice: అయినా
  rationale: ముందు ప్రకటించిన తీర్పుకు ఒక పరిమితిని సూచించే వ్యతిరేక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘మాత్రం’ అనే అర్థసంభావ్యతను పాదసూచికలో నిలిపాం.
- source_word: כָּל הַמַּמְלָכָה
  choice: రాజ్యమంతటినీ
  rationale: כָּל తెలిపే సంపూర్ణతను సహజమైన తెలుగు ప్రయోగంలో నిలుపుతుంది.
- source_word: אֶקְרָע
  choice: చీల్చివేయను
  rationale: קָרַע లోని ‘చీల్చు’ అనే సజీవ రూపకాన్ని నిలుపుతూ, రాజ్యాన్ని తొలగించే భావాన్ని సందర్భానుకూలంగా తెలియజేస్తుంది.
- source_word: שֵׁבֶט אֶחָד
  choice: ఒక గోత్రాన్ని
  rationale: ఈ రాజ్యవిభజన సందర్భంలో שֵׁבֶט దండం లేదా రాజదండం కాక ఇశ్రాయేలు గోత్రాన్ని సూచిస్తుంది.
- source_word: אֶתֵּן לִבְנֶךָ
  choice: నీ కుమారునికి ఇస్తాను
  rationale: మూలంలోని సరళమైన భవిష్యత్ దానార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: לְמַעַן דָּוִד עַבְדִּי
  choice: నా సేవకుడైన దావీదు నిమిత్తమూ
  rationale: దావీదుపట్ల దేవుని పరిగణనను తెలిపే ఉద్దేశ్య/హేతు భావాన్ని అతిగా వ్యాఖ్యానించకుండా అందిస్తుంది.
- source_word: וּלְמַעַן יְרוּשָׁלַם
  choice: యెరూషలేము నిమిత్తమూ
  rationale: ముందటి לְמַעַן పదబంధంతో ఉన్న సమాంతరతను ‘నిమిత్తమూ’ అనే పునరుక్తితో నిలుపుతుంది.
- source_word: אֲשֶׁר בָּחָרְתִּי
  choice: నేను ఎన్నుకున్న
  rationale: దేవుడు గతంలో చేసిన స్థిరమైన ఎంపికను సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ఒక గోత్రాన్ని నిలిపి ఉంచడానికి కారణం
  choice: దావీదు మరియు ఎన్నుకోబడిన యెరూషలేము—ఈ రెండింటి నిమిత్తమే రాజ్యం పూర్తిగా తీసివేయబడదని సమాంతరంగా ఉంచడం
  alternative: ఈ నిలుపుదల కేవలం దావీదు నిబంధన కారణంగానో, ప్రధానంగా ఆలయనగరం కారణంగానో వివరించడం
  rationale: హీబ్రూ పాఠం రెండు కారణాలను సమాంతరంగా ఇస్తుంది. వాటిలో ఒకదానిని మరొకదానిలో కలపకుండా, అదనపు సిద్ధాంత యంత్రాంగాన్ని దిగుమతి చేయకుండా అనువాదం రెండింటినీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని చీల్చడం అనే రూపకాన్నీ, దావీదు–యెరూషలేము కారణాల సమాంతరతనూ కాపాడాం. పాదసూచిక సూచికను అది వివరిస్తున్న ప్రారంభ పదం వద్ద ఉంచాం.
