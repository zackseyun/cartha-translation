source:
  edition: WLC
  text: וַ/יָּ֨קֶם אֱלֹהִ֥ים ל/וֹ֙ שָׂטָ֔ן אֶת רְז֖וֹן בֶּן אֶלְיָדָ֑ע אֲשֶׁ֣ר בָּרַ֗ח מֵ/אֵ֛ת הֲדַדְעֶ֥זֶר מֶֽלֶךְ צוֹבָ֖ה אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/023.yaml
  text: And God raised up for him an adversary[a], Rezon son of Eliada, who had fled from Hadadezer king of Zobah, his master.
translation:
  language: te
  text: దేవుడు అతనికి విరోధిగా, సోబా రాజైన హదదెజెరు దగ్గరనుండి పారిపోయిన, తన యజమాని అయిన ఎల్యాదా కుమారుడు రెజోనును లేపాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: సాతాన్; ఇక్కడ ఇది ‘విరోధి’ లేదా ‘ప్రత్యర్థి’ అనే అర్థమున్న సాధారణ నామవాచకం, ‘సాతాను’ అనే వ్యక్తినామం కాదు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: లేపాడు
  rationale: హిఫీల్ రూపం ఒక వ్యక్తిని ఎదిరించడానికి ఉద్భవింపజేయడం లేదా రంగంలోకి తీసుకురావడం అనే భావాన్ని ఇస్తుంది; ‘లేపాడు’ దానిని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: ఈ కథన సందర్భంలో ఇశ్రాయేలు దేవుడే ఉద్దేశించబడ్డాడు.
- source_word: לוֹ
  choice: అతనికి
  rationale: לְ ఉపసర్గపు రూపాన్ని అధికారికంగా నిలుపుతూ, తరువాతి ‘విరోధిగా’ అనే పదం అది సొలొమోనుకు వ్యతిరేకమైన సంబంధమని స్పష్టం చేస్తుంది.
- source_word: שָׂטָן
  choice: విరోధిగా
  rationale: ఇక్కడ ఇది మానవ రాజకీయ ప్రత్యర్థిని సూచించే సాధారణ నామవాచకం; ‘సాతాను’ అనే వ్యక్తినామం కాదు.
- source_word: רְזוֹן בֶּן אֶלְיָדָע
  choice: ఎల్యాదా కుమారుడైన రెజోను
  rationale: తెలుగులో సహజమైన పుత్రసంబంధ నిర్మాణంతో వ్యక్తినామాలను లిప్యంతరీకరించాం.
- source_word: אֲשֶׁר בָּרַח
  choice: పారిపోయినవాడు
  rationale: రెజోను లేపబడటానికి ముందు జరిగిన నేపథ్య చర్యను తెలుగు సంబంధవాచక నిర్మాణంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מֵאֵת הֲדַדְעֶזֶר
  choice: హదదెజెరు దగ్గరనుండి
  rationale: ఒక వ్యక్తి సేవ లేదా సన్నిధి నుండి విడిపోవడాన్ని సూచించే מֵאֵת భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֶלֶךְ צוֹבָה
  choice: సోబా రాజు
  rationale: హీబ్రూ సమాస నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: אֲדֹנָיו
  choice: తన యజమాని
  rationale: రాజకీయ-సేవక సంబంధంలో ఆధీనతను స్పష్టంగా తెలియజేస్తూ, దైవ బిరుదుతో గందరగోళాన్ని నివారిస్తుంది.
theological_decisions:
- issue: שָׂטָן పదానికి ఈ సందర్భంలోని అర్థం
  choice: సాధారణ నామవాచకంగా ‘విరోధి’
  alternative: ‘సాతాను’ అనే వ్యక్తినామం
  rationale: ఈ వచనం ఎల్యాదా కుమారుడైన రెజోను అనే మానవ రాజకీయ ప్రత్యర్థిని వివరిస్తుంది. వ్యక్తినామంగా అనువదిస్తే మూలపాఠంలో లేని దయ్యశాస్త్ర సంబంధ భావం చేరుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే కథన శైలి. ‘అతనికి విరోధిగా’ అనే నిర్మాణం לוֹ యొక్క రూపాన్ని మరియు సందర్భంలోని వ్యతిరేక భావాన్ని రెండింటినీ నిలుపుతుంది.
