  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י לְ/עֵת֙ זִקְנַ֣ת שְׁלֹמֹ֔ה נָשָׁי/ו֙ הִטּ֣וּ אֶת לְבָב֔/וֹ אַחֲרֵ֖י אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹא הָיָ֨ה לְבָב֤/וֹ שָׁלֵם֙ עִם יְהוָ֣ה אֱלֹהָ֔י/ו כִּ/לְבַ֖ב דָּוִ֥יד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/004.yaml
  text: And when Solomon was old[a], his wives turned his heart after other gods, and his heart was not fully devoted to Yahweh his God, like the heart of David his father.
translation:
  language: te
  text: సొలొమోను వృద్ధుడైనప్పుడు, అతని భార్యలు అతని హృదయాన్ని ఇతర దేవుళ్లవైపు మళ్లించారు. అతని హృదయం తన తండ్రి దావీదు హృదయంలా తన దేవుడైన యహ్వే పట్ల సంపూర్ణంగా నిబద్ధమై లేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తన దేవుడైన యహ్వేతో అతని హృదయం సంపూర్ణంగా లేదు.”
    reason: שָׁלֵם అనే హీబ్రూ పదంలోని ‘సంపూర్ణమైన/పూర్ణమైన’ రూపకాన్ని చూపించే పదార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: לְעֵת זִקְנַת שְׁלֹמֹה
  choice: సొలొమోను వృద్ధుడైనప్పుడు
  rationale: హీబ్రూ పదబంధంలోని కాలార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘సొలొమోను వృద్ధాప్య కాలంలో’ కంటే ఇది సులభంగా చదవబడుతుంది.
- source_word: נָשָׁיו
  choice: అతని భార్యలు
  rationale: బహువచన స్వామ్యరూపాన్ని నేరుగా, ఎటువంటి సాధారణీకరణ లేకుండా అనువదిస్తుంది.
- source_word: הִטּוּ אֶת־לְבָבוֹ
  choice: అతని హృదయాన్ని ... మళ్లించారు
  rationale: נטה హిఫీల్ రూపంలోని ‘తిరిగేలా చేయడం/మళ్లించడం’ అనే భావాన్ని, హృదయ రూపకాన్ని నిలుపుతూ సహజమైన తెలుగులో అందిస్తుంది.
- source_word: אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లవైపు
  rationale: వేరే దేవతలను అనుసరించే దిశగా హృదయం మళ్లిందనే భావాన్ని సహజంగా తెలియజేస్తుంది; ‘విదేశీ దేవుళ్లు’ అని జాతిపరమైన భావాన్ని చేర్చదు.
- source_word: לְבָבוֹ
  choice: అతని హృదయం
  rationale: హీబ్రూ వాడుకలో సంకల్పం, ఆలోచన, విశ్వాసనిబద్ధతను కలిగిన అంతరంగాన్ని సూచించే బైబిలు రూపకాన్ని నిలుపుతుంది.
- source_word: שָׁלֵם עִם יְהוָה אֱלֹהָיו
  choice: తన దేవుడైన యహ్వే పట్ల సంపూర్ణంగా నిబద్ధమై లేదు
  rationale: ‘యహ్వేతో సంపూర్ణమైన హృదయం’ అనే అక్షరార్థ రూపం తెలుగులో అసహజంగా ఉండే కారణంగా, విభజనలేని ఒడంబడిక విశ్వాసనిబద్ధతను స్పష్టంగా, అతిగా వ్యాఖ్యానించకుండా వ్యక్తం చేస్తుంది.
- source_word: כִּלְבַב דָּוִיד אָבִיו
  choice: తన తండ్రి దావీదు హృదయంలా
  rationale: పోలిక వ్యక్తుల మధ్య మాత్రమే కాక వారి హృదయాల మధ్య ఉందని హీబ్రూ వాక్యం స్పష్టంగా చెబుతున్నందున ‘హృదయం’ అనే పదాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి ఆధునిక తెలుగు లిప్యంతరీకరణగా ఇస్తుంది.
theological_decisions:
- issue: שָׁלֵם అనే పదం సొలొమోను హృదయానికి వర్తించే విధానం
  choice: సంపూర్ణంగా నిబద్ధమై లేదు
  alternative: యహ్వేతో సంపూర్ణంగా లేదు
  rationale: అక్షరార్థంలోని ‘సంపూర్ణ/పూర్ణ హృదయం’ భావాన్ని పాదటిప్పణిలో ఉంచి, ప్రధాన పాఠ్యంలో దేవునిపట్ల విభజనలేని ఒడంబడిక నిబద్ధత అనే సందర్భార్థాన్ని సహజమైన తెలుగులో ఇస్తుంది. ఇది దావీదు వైఫల్యాలు మరియు అతని ప్రాథమిక విశ్వాసనిబద్ధత మధ్య ఉన్న వేదాంత ఉద్రిక్తతను తొలగించదు.
- issue: ‘ఇతర దేవుళ్లు’ అనే ప్రస్తావన
  choice: ఇతర దేవుళ్లు
  alternative: విదేశీ దేవుళ్లు
  rationale: אֱלֹהִים אֲחֵרִים అనే ప్రామాణిక హీబ్రూ పదబంధాన్ని నేరుగా అందిస్తుంది; విగ్రహారాధనను కేవలం జాతి లేదా విదేశీయతకు సంబంధించిన విషయంగా మార్చదు.
- issue: దైవనామం יהוה
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘హృదయం’ అనే బైబిలు రూపకం, ‘ఇతర దేవుళ్లు’ అనే నేరమైన పదబంధం, యహ్వే అనే దైవనామం నిలుపబడ్డాయి. ప్రధాన పాఠ్యంలో సహజత్వం కోసం రెండు వాక్యాలుగా విభజించబడింది.
