base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/017.yaml
  text: Hadad fled to Egypt[a], he and some Edomite men from among his father's servants with him[b]; and Hadad was a young boy.
translation:
  language: te
  text: హదదు తన తండ్రి సేవకులలోని కొందరు ఎదోమీయులతో కలిసి ఈజిప్టుకు[a] పారిపోయాడు; హదదు అప్పటికి చిన్న బాలుడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, “ఈజిప్టుకు రావడానికి.” గమ్యస్థానానికి చేరడాన్ని సూచించేందుకు హీబ్రూలో “రా” అనే క్రియను వాడవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “చిన్నవాడు” లేదా “పిన్నవాడు” అని కూడా అనువదించవచ్చు. హీబ్రూ పదబంధం హదదు అప్పటికి ఇంకా చిన్న వయస్సులో ఉన్నాడని నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: పారిపోయాడు
  rationale: ברח అనే క్రియ ఇక్కడ ప్రమాదం నుంచి తప్పించుకొని పారిపోవడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘పారిపోయాడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: אֲדַד
  choice: హదదు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: הוּא וַאֲנָשִׁים אֲדֹמִיִּים
  choice: అతనితోపాటు ... కొందరు ఎదోము పురుషులు కూడా
  rationale: స్వతంత్ర సర్వనామం హదదును అతని సహచరులతో కలిపి ప్రాధాన్యంగా చూపుతుంది. అనిర్దిష్ట బహువచనాన్ని సహజ తెలుగులో ‘కొందరు’తో వ్యక్తం చేశాం.
- source_word: מֵעַבְדֵי אָבִיו
  choice: అతని తండ్రి సేవకుల్లో కొందరు
  rationale: מן యొక్క విభాగార్థాన్ని ‘సేవకుల్లో కొందరు’ తెలియజేస్తుంది; עבדకు ఈ సందర్భంలో ‘సేవకులు’ సూటిగా సరిపోతుంది.
- source_word: אִתּוֹ
  choice: అతనితోపాటు
  rationale: ఎదోము పురుషులు హదదుతో కలిసి వెళ్లారనే సహచర్యాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: לָבוֹא מִצְרָיִם
  choice: ఈజిప్టుకు వెళ్లడానికి
  rationale: మూలంలోని בוא ‘రావడం/చేరడం’ అనే క్రియను పూర్తిగా తొలగించకుండా, కథకుడి దృష్టికోణానికి సహజమైన తెలుగు గమనక్రియ ‘వెళ్లడానికి’తో ఉద్దేశాన్ని వ్యక్తం చేశాం.
- source_word: נַעַר קָטָן
  choice: చాలా చిన్నవాడు
  rationale: נער קטן హదదు ఇంకా చాలా పిన్నవాడని నొక్కి చెబుతుంది. ‘చిన్న బాలుడు’ కంటే ‘చాలా చిన్నవాడు’ ఆధునిక తెలుగు కథనంలో సహజంగా ఉంది; ఖచ్చితమైన వయస్సును నిర్దేశించదు.
