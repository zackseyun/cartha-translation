translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. పొడవైన హీబ్రూ సమన్వయ వాక్యాన్ని పఠనసౌలభ్యం కోసం మూడు తెలుగు వాక్యాలుగా విభజించాం; సమాచార క్రమం, సహచర్యం, గమ్యం, హదదు పిన్నవాడనే ముగింపు అన్నీ నిలుపుకున్నాం.
