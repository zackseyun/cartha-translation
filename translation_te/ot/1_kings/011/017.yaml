revisions:
- from: హదదు ఈజిప్టుకు వెళ్లడానికి[a] పారిపోయాడు. అతనితోపాటు అతని తండ్రి సేవకుల్లో కొందరు ఎదోము పురుషులు కూడా వెళ్లారు. అప్పుడు హదదు చాలా చిన్నవాడు[b].
  to: హదదు తన తండ్రి సేవకులలోని కొందరు ఎదోమీయులతో కలిసి ఈజిప్టుకు[a] పారిపోయాడు; హదదు అప్పటికి చిన్న బాలుడు[b].
  rationale: The revision keeps the single flight event intact by stating that Hadad fled together with some Edomites from among his father’s servants. It uses the natural ethnonym ‘ఎదోమీయులు’ and renders נער קטן as ‘చిన్న బాలుడు,’ preserving the age emphasis without specifying an unsupported age or adding excessive intensification. Both footnote anchors remain attached to their relevant expressions.
