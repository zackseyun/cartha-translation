source:
  edition: WLC
  text: וְ/אֹתְ/ךָ֣ אֶקַּ֔ח וּ/מָ֣לַכְתָּ֔ בְּ/כֹ֥ל אֲשֶׁר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וְ/הָיִ֥יתָ מֶּ֖לֶךְ עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/037.yaml
  text: And I will take you[a], and you shall reign over all that your soul desires, and you shall be king over Israel.
translation:
  language: te
  text: నేను నిన్ను తీసుకుంటాను; నీ ప్రాణం కోరుకునే సమస్తం మీద నీవు పరిపాలిస్తావు[a], ఇశ్రాయేలు మీద నీవు రాజుగా ఉంటావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నీవు కోరుకునే సమస్తం మీద”; అక్షరార్థంగా: “నీ ప్రాణం కోరుకునే సమస్తం మీద.”'
    reason: נֶפֶשׁ కలిగిన హీబ్రూ నుడికారానికి సహజమైన తెలుగు ప్రత్యామ్నాయాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: אֶקַּח
  choice: నేను నిన్ను తీసుకుంటాను
  rationale: לקח అనే క్రియకు ప్రాథమికంగా ‘తీసుకొను’ అనే అర్థం ఉంది. ఇక్కడ దైవిక నియామక భావం సందర్భంలో ఉన్నప్పటికీ, ‘ఎన్నుకుంటాను’ అని వ్యాఖ్యానాత్మకంగా కుదించకుండా మూలంలోని స్పష్టమైన క్రియాబలాన్ని నిలుపుతుంది.
- source_word: וּמָלַכְתָּ
  choice: నీవు పరిపాలిస్తావు
  rationale: מלך రాజుగా అధికారాన్ని నిర్వహించడాన్ని సూచిస్తుంది; కేవలం రాజవడం మాత్రమే కాదు. ఆధునిక తెలుగులో ‘పరిపాలిస్తావు’ ఆ క్రియాత్మక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בְּכֹל אֲשֶׁר
  choice: అంతటిమీద
  rationale: מלך తో వచ్చిన ב ఇక్కడ పరిపాలన పరిధిని సూచిస్తుంది. ‘అంతటిమీద’ ఆ విస్తృతిని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: תְּאַוֶּה נַפְשֶׁךָ
  choice: నీ ప్రాణం కోరేది
  rationale: హీబ్రూ వాక్యం అక్షరార్థంగా ‘నీ నెఫెష్ కోరేది’ అని ఉంది. ‘ప్రాణం’ మూలంలోని మానవ అంతరంగ సూచనను నిలుపుతూ, ‘నీవు కోరేది’ అని పూర్తిగా సులభీకరించకుండా ఉంటుంది.
- source_word: וְהָיִיתָ מֶּלֶךְ
  choice: నీవు రాజుగా ఉంటావు
  rationale: היה + నామవాచకం ఇక్కడ కలిగే హోదాను ప్రకటిస్తుంది. ‘రాజుగా ఉంటావు’ అధికారిక స్థితిని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుమీద
  rationale: రాజ్యాధికార సందర్భంలో עַל ప్రజలపై లేదా దేశంపై అధికారాన్ని సూచిస్తుంది; తెలుగులో ‘మీద’ దానికి సహజ సమానం.
theological_decisions:
- issue: נֶפֶשׁ అనే మానవశాస్త్ర సంబంధ పదబంధం
  choice: ‘నీ ప్రాణం కోరేది’ అని మూల రూపకాన్ని నిలుపడం
  alternative: ‘నీవు కోరేదంతా’ లేదా ‘నీ హృదయం కోరేదంతా’
  rationale: ఈ వచనం ‘ప్రాణం’ గురించి సాంకేతిక సిద్ధాంతాన్ని బోధించడం లేదు; అయినప్పటికీ నెఫెష్ అనే మూలపదాన్ని పూర్తిగా తొలగించడం లేదా ‘హృదయం’గా మార్చడం అనవసర వ్యాఖ్యానం అవుతుంది. ప్రధాన పాఠ్యంలో మూల రూపాన్ని ఉంచి, పాదసూచికలో సహజ ప్రత్యామ్నాయాన్ని ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘పరిపాలిస్తావు’ క్రియ రాజ్యాధికార నిర్వహణను సహజంగా తెలియజేస్తుంది; ‘నీ ప్రాణం కోరేది’ మూలంలోని నుడికారాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది.
