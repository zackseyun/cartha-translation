  source_fidelity: 'మూల హీబ్రూలోని రెండు రాజత్వ ప్రకటనలను ముసాయిదా మొత్తంగా ప్రతిబింబిస్తుంది: దేవుడు అతనిని తీసుకుంటాడు, అతడు తన נֶפֶשׁ కోరిన సమస్తంపై పరిపాలిస్తాడు, ఇశ్రాయేలుపై రాజుగా ఉంటాడు. అయితే ‘నీ ప్రాణం కోరేదంతటిమీద’ అనే రూపం ఆధునిక తెలుగులో కొంత అసహజంగా ఉండి, కోరబడే విషయాలు మరియు వాటిపై అధికారము మధ్య సంబంధాన్ని స్పష్టంగా చెప్పదు.'
