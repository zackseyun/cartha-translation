source:
  edition: WLC
  text: וַֽ/אעַנֶּ֛ה אֶת זֶ֥רַע דָּוִ֖ד לְמַ֣עַן זֹ֑את אַ֖ךְ לֹ֥א כָל הַ/יָּמִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/039.yaml
  text: And I will afflict the offspring of David because of this[a], but not forever.
translation:
  language: te
  text: దీని కారణంగా నేను దావీదు సంతతిని బాధిస్తాను; అయితే ఎల్లకాలం కాదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘అన్ని దినాలపాటు కాదు.’
    reason: హెబ్రీ మూలంలోని కాలసంబంధ పదచిత్రాన్ని చూపించే అక్షరార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: וַאעַנֶּה
  choice: నేను బాధిస్తాను
  rationale: ענה అనే ధాతువు పియేల్ రూపంలో ఇక్కడ బాధకు లేదా అవమానానికి గురిచేయడం అనే భావాన్ని ఇస్తుంది. తీర్పు సందర్భానికి ‘బాధిస్తాను’ సహజంగా సరిపోతుంది; ‘అణచివేస్తాను’ అనడం సామాజిక పీడన భావాన్ని అతిగా నిర్దిష్టం చేస్తుంది.
- source_word: זֶרַע דָּוִד
  choice: దావీదు సంతతిని
  rationale: זֶרַע సమూహార్థక ఏకవచనం. ఆధునిక తెలుగులో ‘సంతతి’ ఆ సమూహ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: לְמַעַן זֹאת
  choice: దీని కారణంగా
  rationale: ఈ పదబంధం ముందున్న అపరాధాన్ని సూచిస్తూ బాధకు కారణాన్ని తెలియజేస్తుంది. ‘దీని కారణంగా’ స్పష్టమైన, సహజమైన తెలుగు ప్రయోగం.
- source_word: אַךְ
  choice: అయితే
  rationale: ముందు ప్రకటించిన తీర్పుకు పరిమితి విధించే వ్యతిరేక సంబంధాన్ని సూచిస్తుంది. ‘అయితే’ ఈ సందర్భంలో గౌరవప్రదంగా, సహజంగా ఉంది.
- source_word: לֹא כָל הַיָּמִים
  choice: ఎల్లకాలం కాదు
  rationale: అక్షరార్థంగా ‘అన్ని దినాలు కాదు’; సందర్భంలో బాధ శాశ్వతం కాదనే కాలపరిమితిని సూచిస్తుంది. ‘ఎల్లకాలం కాదు’ సహజమైన తెలుగులో అదే భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: దావీదు సంతతిపై తీర్పు కొనసాగే కాలం
  choice: తీర్పు నిజమైనదే, కానీ ఎల్లకాలం కొనసాగదు.
  alternative: ‘అన్ని దినాలపాటు కాదు’ అని మరింత అక్షరార్థంగా అనువదించవచ్చు.
  rationale: హెబ్రీ వాక్యం బాధకు స్పష్టమైన కాలపరిమితి పెడుతుంది. దావీదు వాగ్దానానికి సంబంధించిన మరింత భావాన్ని ఈ వచనంలోకి దిగుమతి చేయకుండా, తీర్పు మరియు దాని పరిమితి రెండింటినీ అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన గ్రంథశైలిలో రూపొందించబడింది. ‘సంతతి’ సమూహార్థాన్ని, ‘ఎల్లకాలం కాదు’ సహజమైన కాలపరిమితిని నిలుపుతాయి.
