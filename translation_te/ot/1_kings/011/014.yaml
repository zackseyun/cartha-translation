id: 1KI.11.14
reference: 1 Kings 11:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֨קֶם יְהוָ֤ה שָׂטָן֙ לִ/שְׁלֹמֹ֔ה אֵ֖ת הֲדַ֣ד הָ/אֲדֹמִ֑י מִ/זֶּ֧רַע הַ/מֶּ֛לֶךְ ה֖וּא בֶּ/אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/014.yaml
  text: Then Yahweh raised up an adversary against Solomon[a], Hadad the Edomite; he was of the royal line in Edom.
translation:
  language: te
  text: అప్పుడు యెహోవా సొలొమోనుకు విరోధిగా[a] ఎదోమీయుడైన హదదును లేవనెత్తాడు; అతడు ఎదోములోని రాజవంశానికి చెందినవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో שָׂטָן (సాతాన్); ఇక్కడ దాని అర్థం ‘విరోధి’ లేదా ‘ప్రత్యర్థి,’ ‘సాతాను’ అనే వ్యక్తినామం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: లేపాడు
  rationale: קום హిఫీల్ రూపం ఒక వ్యక్తిని ఎదిరించడానికి ఉద్భవింపజేయడం లేదా నిలబెట్టడం అనే భావాన్ని ఇస్తుంది. ‘లేపాడు’ దైవిక చర్యను సహజంగా వ్యక్తపరుస్తూ, అధికారిక నియామకం అనే అదనపు భావాన్ని చేర్చదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తింపుపొందిన ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: שָׂטָן
  choice: విరోధిగా
  rationale: ఈ సందర్భంలో ఇది సాతాను అనే వ్యక్తినామం కాదు; ఎదిరించేవాడు లేదా ప్రత్యర్థి అనే సాధారణ నామవాచకం. తెలుగు వాక్యనిర్మాణంలో ‘విరోధిగా’ ఆ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִשְׁלֹמֹה
  choice: సొలొమోనుకు
  rationale: שָׂטָןతో వచ్చిన לְ ప్రత్యర్థిత్వం ఎవరి పట్ల ఉందో సూచిస్తుంది. ‘సొలొమోనుకు విరోధిగా’ అనేది తెలుగులో సహజమైన నిర్మాణం.
- source_word: הֲדַד הָאֲדֹמִי
  choice: ఎదోమీయుడైన హదదును
  rationale: వ్యక్తినామాన్ని లిప్యంతరీకరించి, జాతి/ప్రాంత సంబంధ విశేషణాన్ని సహజమైన తెలుగు రూపంలో ఇచ్చాం.
- source_word: מִזֶּרַע הַמֶּלֶךְ
  choice: రాజవంశానికి చెందినవాడు
  rationale: అక్షరార్థంగా ‘రాజు సంతానం నుండి’; ఇది రాజవంశీయ మూలాన్ని సూచించే నుడికారం. ఎంపిక చేసిన రూపం వంశపారంపర్య భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: הוּא בֶּאֱדוֹם
  choice: ఎదోములోని
  rationale: ముందున్న రాజవంశ సంబంధాన్ని ఎదోముతో అనుసంధానించేలా తీసుకున్నాం. హెబ్రీ వాక్యంలోని సంక్షిప్తతను సహజ తెలుగులో ‘ఎదోములోని రాజవంశం’గా వ్యక్తపరిచాం.
theological_decisions:
- issue: ఈ వచనంలో שָׂטָן అర్థం
  choice: సాధారణ నామవాచకం—‘విరోధి’
  alternative: ‘సాతాను’ అనే వ్యక్తినామం
  rationale: వాక్యనిర్మాణం, సందర్భం రెండూ హదదనే మానవ రాజకీయ ప్రత్యర్థిని సూచిస్తున్నాయి. కాబట్టి తరువాతి కాలపు దయ్య సంబంధ భావాన్ని ఈ వచనంలోకి దిగుమతి చేయకుండా సాధారణ నామవాచక భావాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించాం. ‘విరోధిగా’ అనే రూపం మూలంలోని సంబంధాన్ని స్పష్టపరుస్తుంది; ‘రాజవంశానికి చెందినవాడు’ అనే రూపం వంశపారంపర్య నుడికారాన్ని సాధారణ పాఠకులకు అర్థమయ్యేలా అందిస్తుంది.
