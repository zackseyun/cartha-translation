  text: וַ/יָּקֻ֨מוּ֙ מִ/מִּדְיָ֔ן וַ/יָּבֹ֖אוּ פָּארָ֑ן וַ/יִּקְחוּ֩ אֲנָשִׁ֨ים עִמָּ֜/ם מִ/פָּארָ֗ן וַ/יָּבֹ֤אוּ מִצְרַ֨יִם֙ אֶל פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם וַ/יִּתֶּן ל֣/וֹ בַ֗יִת וְ/לֶ֨חֶם֙ אָ֣מַר ל֔/וֹ וְ/אֶ֖רֶץ נָ֥תַן לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/018.yaml
  text: They arose from Midian and came to Paran[a], and they took men with them from Paran, and they came to Egypt, to Pharaoh king of Egypt, and he gave him a house and assigned him food, and gave him land.
translation:
  language: te
  text: వారు మిద్యాను నుండి బయలుదేరి పారానుకు వచ్చారు. పారాను నుండి పురుషులను తమతో తీసుకొని ఐగుప్తుకు, ఐగుప్తు రాజైన ఫరో దగ్గరకు వచ్చారు. ఫరో అతనికి ఒక ఇల్లు ఇచ్చి, ఆహారం కేటాయించి,[a] భూమిని ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠం అక్షరార్థంగా, “రొట్టె—అతడు అతనికి చెప్పాడు.” ఇక్కడ ఫరో అతనికి ఆహారాన్ని ఏర్పాటు చేయమని ఆదేశించాడని లేదా ఆహారాన్ని కేటాయించాడని భావం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ מִמִּדְיָן
  choice: వారు మిద్యాను నుండి బయలుదేరి
  rationale: קום అనే క్రియ ప్రయాణ కథనంలో ‘లేచి’ అనే అక్షరార్థం కంటే ‘బయలుదేరు’ అనే సహజ భావాన్ని ఇస్తుంది.
- source_word: פָּארָן
  choice: పారాను
  rationale: స్థలనామాన్ని ఆధునిక ప్రామాణిక తెలుగు బైబిలు శైలికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וַיִּקְחוּ אֲנָשִׁים עִמָּם מִפָּארָן
  choice: పారాను నుండి కొందరు పురుషులను తమతో తీసుకొని
  rationale: אֲנָשִׁים అనే పుంలింగ బహువచనాన్ని ‘పురుషులు’గా ఖచ్చితంగా ఉంచాం; తెలుగులో సహజత కోసం ‘కొందరు’ చేర్చాం.
- source_word: מִצְרַיִם
  choice: ఐగుప్తు
  rationale: ఈ ప్రాచీన దేశనామానికి తెలుగులో విస్తృతంగా స్థిరపడిన రూపాన్ని వాడాం.
- source_word: אֶל פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: ఐగుప్తు రాజైన ఫరో దగ్గరకు
  rationale: హీబ్రూ సమానాధికార నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో ఇచ్చాం.
- source_word: וַיִּתֶּן לוֹ בַיִת
  choice: ఫరో అతనికి ఒక ఇల్లు ఇచ్చి
  rationale: మునుపటి వాక్యంలోని ఫరోనే కర్త అని తెలుగులో స్పష్టంగా చేశాం; בַיִת ను దాని సాధారణ అర్థమైన ‘ఇల్లు’గా ఉంచాం.
- source_word: וְלֶחֶם אָמַר לוֹ
  choice: ఆహారం అందించాలని ఆదేశించి
  rationale: అక్షరార్థంగా అసాధారణమైన ‘రొట్టె అతనికి చెప్పాడు’ అనే పాఠం సందర్భంలో ఆహార సరఫరాను ఆదేశించడం అనే భావాన్ని సూచిస్తుంది; לֶחֶם యొక్క విస్తృత భావాన్ని ‘ఆహారం’గా ఇచ్చాం.
- source_word: וְאֶרֶץ נָתַן לוֹ
  choice: భూమి ఇచ్చాడు
  rationale: אֶרֶץ ఇక్కడ దేశమంతటిని కాక, ఫరో అతనికి అనుగ్రహించిన భూమిని సూచించడం సహజం.
