  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి పాటించాం. హీబ్రూ కథన క్రమాన్ని నిలుపుతూ, అస్పష్టమైన ఆహార సంబంధ పదబంధాన్ని పాదసూచికలో వెల్లడించాం.
