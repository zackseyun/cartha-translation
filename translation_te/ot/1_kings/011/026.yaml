  text: וְ/יָרָבְעָם֩ בֶּן נְבָ֨ט אֶפְרָתִ֜י מִן הַ/צְּרֵדָ֗ה וְ/שֵׁ֤ם אִמּ/וֹ֙ צְרוּעָה֙ אִשָּׁ֣ה אַלְמָנָ֔ה עֶ֖בֶד לִ/שְׁלֹמֹ֑ה וַ/יָּ֥רֶם יָ֖ד בַּ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/026.yaml
  text: Jeroboam son of Nebat[a], an Ephraimite from Zeredah—his mother's name was Zeruah, a widow—was a servant of Solomon[c][b], and he raised his hand against the king.
translation:
  language: te
  text: నెబాతు కుమారుడైన యెరోబాము సెరేదాకు చెందిన ఎఫ్రాయిమీయుడు[a]. అతని తల్లి పేరు సెరూయా; ఆమె విధవరాలు[b]. అతడు సొలొమోనుకు సేవకుడు. అతడు రాజుకు వ్యతిరేకంగా చేయి ఎత్తాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎఫ్రాతీయుడు.’ అయితే ఇక్కడ ‘ఎఫ్రాయిమీయుడు’ అనే అర్థమే ఎక్కువగా సంభవిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘ఒక స్త్రీ, ఒక విధవరాలు.’
    reason: source_form
  - marker: c
    text: లేదా, ‘అతడు రాజుపై తిరుగుబాటు చేశాడు.’ హీబ్రూలో అక్షరార్థంగా, ‘అతడు రాజుకు వ్యతిరేకంగా తన చేయి ఎత్తాడు.’
    reason: idiom
lexical_decisions:
- source_word: אֶפְרָתִי
  choice: ఎఫ్రాయిమీయుడు
  rationale: రాజుల గ్రంథంలోని ఈ సందర్భంలో ఇది ఎఫ్రాయిము గోత్రానికి చెందినవాడనే భావాన్ని అత్యంత సహజంగా సూచిస్తుంది. అయితే ‘ఎఫ్రాతీయుడు’ అనే రూపసంబంధ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: הַצְּרֵדָה
  choice: సెరేదా
  rationale: స్థలనామాన్ని ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: צְרוּעָה
  choice: సెరూయా
  rationale: వ్యక్తి పేరును అనువదించకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: אִשָּׁה אַלְמָנָה
  choice: విధవరాలు
  rationale: హీబ్రూలో ‘స్త్రీ, విధవరాలు’ అనే రెండు పదాలు ఉన్నాయి. తెలుగులో ‘విధవరాలు’ అన్న పదమే స్త్రీత్వాన్ని స్పష్టంగా తెలియజేస్తుంది; మూలంలోని పదబంధ విస్తారాన్ని పాదటిప్పణిలో పేర్కొన్నాం.
- source_word: עֶבֶד
  choice: సేవకుడు
  rationale: సొలొమోను రాజపాలన కింద యెరోబాము ఉన్న స్థానాన్ని ఈ సందర్భంలో ‘సేవకుడు’ సహజంగా తెలియజేస్తుంది. ‘బానిస’ అనే అర్థం సాధ్యమైనా, ఇక్కడ బానిసత్వం ప్రధానాంశం కాదు.
- source_word: וַיָּרֶם יָד בַּמֶּלֶךְ
  choice: అతడు రాజుకు ఎదిరిగా చేయి ఎత్తాడు
  rationale: హీబ్రూ జాతీయాన్ని రూపకంతో సహా నిలుపుతూ, శత్రుత్వం లేదా తిరుగుబాటు భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְ
  choice: వాక్య నిర్మాణం ద్వారా అనుసంధానం
  rationale: ప్రారంభ వావ్‌ను ప్రత్యేకంగా ‘ఇప్పుడు’ అని అనువదించలేదు; అది కాలసూచక పదం కాదు. తెలుగు కథన ప్రవాహంలో వాక్య అనుసంధానం ద్వారానే దాని పని వ్యక్తమవుతుంది.
theological_decisions:
- issue: రాజుకు ఎదిరిగా చేయి ఎత్తడం అనే పదబంధం తిరుగుబాటునే నేరుగా సూచిస్తుందా?
  choice: రూపకాన్ని నిలుపుతూ ‘రాజుకు ఎదిరిగా చేయి ఎత్తాడు’
  alternative: ‘రాజుపై తిరుగుబాటు చేశాడు’
  rationale: మూలంలోని చర్యాత్మక రూపకం శత్రుత్వం లేదా తిరుగుబాటును సూచించినా, దానిని ఒక్క నిర్దిష్ట వ్యాఖ్యానంగా కుదించకుండా మూలంలోని భావ విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. పొడవైన హీబ్రూ సమన్వయ వాక్యాన్ని స్పష్టత కోసం నాలుగు చిన్న వాక్యాలుగా విభజించాం; సంబంధాలు, పేర్లు, రూపకం యథాతథంగా నిలిపాం.
