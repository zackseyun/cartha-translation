  yaml_path: translation/ot/1_kings/011/042.yaml
  text: And the days that Solomon reigned in Jerusalem over all Israel were forty years.
translation:
  language: te
  text: సొలొమోను యెరూషలేములో ఇశ్రాయేలంతటిమీద రాజుగా పరిపాలించిన కాలం నలభై సంవత్సరాలు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הַ/יָּמִים אֲשֶׁר
  choice: కాలం
  rationale: ‘అతడు పరిపాలించిన రోజులు’ అనే హీబ్రూ కాలవ్యవధి నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా ‘పరిపాలించిన కాలం’ అని వ్యక్తం చేస్తుంది.
- source_word: מָלַךְ
  choice: రాజుగా పరిపాలించిన
  rationale: Qal క్రియ ఇక్కడ రాజ్యాధికారం నిర్వహించడాన్ని సూచిస్తుంది; ‘రాజుగా పరిపాలించిన’ అనేది అర్థాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: שְׁלֹמֹה
  choice: సొలొమోను
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపం.
- source_word: בִ/ירוּשָׁלִַם
  choice: యెరూషలేములో
  rationale: בְ ఇక్కడ స్థలార్థకం; ‘లో’ దాని సహజ తెలుగు సమానం.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలంతటిమీద
  rationale: עַל రాజాధికార పరిధిని, כָּל సమస్త ఇశ్రాయేలును సూచిస్తాయి; ఈ రూపం రెండింటినీ నిలుపుతుంది.
- source_word: אַרְבָּעִים שָׁנָה
  choice: నలభై సంవత్సరాలు
  rationale: రాజ్యపాలన వ్యవధిని తెలిపే సంఖ్యా-నామవాచక పదబంధానికి నేరమైన తెలుగు అనువాదం.
