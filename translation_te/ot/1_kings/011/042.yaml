translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన రాజవంశ సారాంశ శైలి. ఆరంభ వావ్‌ను ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండా, తెలుగు కథన ప్రవాహంలో సహజంగా ఉంచబడింది; హీబ్రూ ‘రోజులు’ నుడికారం ‘కాలం’గా అనువదించబడింది.
