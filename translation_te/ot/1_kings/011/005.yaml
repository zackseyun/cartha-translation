  naturalness: వాక్యం ఆధునిక ప్రామాణిక తెలుగులో సులభంగా చదవబడుతుంది. రెండు భాగాల్లో ‘అనుసరించాడు’ పునరావృతం హీబ్రూ సమాంతర నిర్మాణాన్నీ, తెలుగులోని స్పష్టతనూ నిలుపుతుంది. సెమికోలన్ కూడా రెండు దేవతల గురించిన సమాంతర వాక్యభాగాలను చక్కగా వేరుచేస్తుంది.
