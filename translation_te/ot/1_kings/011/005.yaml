id: 1KI.11.5
reference: 1 Kings 11:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ שְׁלֹמֹ֔ה אַחֲרֵ֣י עַשְׁתֹּ֔רֶת אֱלֹהֵ֖י צִדֹנִ֑ים וְ/אַחֲרֵ֣י מִלְכֹּ֔ם שִׁקֻּ֖ץ עַמֹּנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/005.yaml
  text: Solomon went after Ashtoreth[a], the god of the Sidonians, and after Milcom[c][b], the abomination of the Ammonites.
translation:
  language: te
  text: సొలొమోను సీదోనీయుల దేవతయైన అష్తోరెతు[a]ను అనుసరించాడు; అమ్మోనీయుల హేయమైన దేవుడైన మిల్కోము[b]ను కూడా అనుసరించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అష్తార్తె’ అని కూడా పిలుస్తారు; ఇది ఈ దేవత పేరుకు విస్తృతంగా తెలిసిన రూపం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠం ఇక్కడ ‘మిల్కోము’ అని ఉంది. కొందరు ఇతనిని మోలెకుతో అనుసంధానిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ ... אַחֲרֵי
  choice: అనుసరించాడు
  rationale: ఇక్కడి హీబ్రూ నుడికారం భౌతికంగా వెనుక వెళ్లడాన్ని కాక, భక్తి లేదా విధేయతతో ఒక దేవతను అనుసరించడాన్ని సూచిస్తుంది. ‘అనుసరించాడు’ ఆ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, నేరుగా ‘పూజించాడు’ అని విస్తరించదు.
- source_word: עַשְׁתֹּרֶת
  choice: అష్తోరెతు
  rationale: హీబ్రూ పాఠంలోని నామరూపాన్ని తెలుగు లిపిలో సమీపంగా లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵי צִדֹנִים
  choice: సీదోనీయుల దేవత
  rationale: אֱלֹהֵי రూపం పదశః ‘దేవుడు/దేవత’ లేదా ‘దేవుళ్లు’ అనే పరిధిని కలిగి ఉన్నా, ఇక్కడ ఏకవచన స్త్రీ దేవత అష్తోరెతుకు సమానాధికరణంగా ఉంది. తెలుగులో ‘దేవత’ ఆ సూచ్యాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִלְכֹּם
  choice: మిల్కోము
  rationale: మసొరెటిక్ పాఠం ఇక్కడ ‘మిల్కోము’ అని చదువుతుంది; ‘మోలెకు’తో సాధ్యమైన సంబంధాన్ని ప్రధాన పాఠంలో కలపలేదు.
- source_word: שִׁקֻּץ עַמֹּנִים
  choice: అమ్మోనీయుల హేయమైన దేవుడు
  rationale: שִׁקֻּץ బలమైన తిరస్కారార్థక పదం; ఈ సందర్భంలో అది అమ్మోనీయుల దేవుడైన మిల్కోమును సూచిస్తుంది. ‘హేయమైన దేవుడు’ ఆధునిక తెలుగులో అర్థవంతంగా ఆ ప్రతికూల మూల్యాంకనాన్ని నిలుపుతుంది.
theological_decisions:
- issue: సొలొమోను చేసినది విగ్రహారాధన అని ప్రధాన పాఠంలో నేరుగా చెప్పాలా
  choice: ‘అనుసరించాడు’ అనే హీబ్రూ నుడికారానికి సమీపమైన వ్యక్తీకరణను ఉంచడం
  alternative: ‘పూజించాడు’
  rationale: సందర్భం విగ్రహారాధనను స్పష్టం చేసినా, ఈ వచనం ‘వెనుక వెళ్లాడు/అనుసరించాడు’ అనే నుడికారాన్నే వాడుతుంది. అనువాదం దానిని విస్తరించకుండా భక్తి-విధేయత భావాన్ని నిలుపుతుంది.
- issue: אֱלֹהֵי צִדֹנִים ను లింగనిర్దిష్టంగా అనువదించాలా
  choice: ‘సీదోనీయుల దేవత’
  alternative: ‘సీదోనీయుల దేవుడు’ లేదా ‘సీదోనీయుల దేవుళ్లు’
  rationale: పదరూపంలోని సంఖ్యా/లింగ అస్పష్టతను గుర్తించినప్పటికీ, అష్తోరెతు అనే ఏకవచన స్త్రీ దేవతతో ఉన్న సమానాధికరణం వల్ల తెలుగులో ‘దేవత’ సహజమైన సందర్భార్థం. మూలరూపపు విస్తృతిని పాదటిప్పణిలో నమోదు చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. పేర్లను హీబ్రూ రూపాలకు సమీపంగా లిప్యంతరీకరించాం; ‘అనుసరించాడు’ అనే పునరుక్తి మూలంలోని సమాంతర నిర్మాణాన్ని సహజంగా నిలుపుతుంది.
