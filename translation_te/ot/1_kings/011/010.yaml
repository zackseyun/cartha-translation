  text: and had commanded him concerning this matter[a], not to go after other gods, but he did not keep what Yahweh had commanded.
translation:
  language: te
  text: యెహోవా అతనికి ఈ విషయం గురించి—ఇతర దేవుళ్లను అనుసరించకూడదని[a]—ఆజ్ఞాపించాడు; కానీ యెహోవా ఆజ్ఞాపించిన దానిని అతడు పాటించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఇతర దేవుళ్ల వెనుక వెళ్లకూడదని.” ఇది ఇతర దేవతలవైపు తిరిగి వాటిని ఆరాధించడాన్ని సూచించే సాధారణ ఒడంబడికకు సంబంధించిన నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וְצִוָּה אֵלָיו
  choice: ఆయన అతనికి ఆజ్ఞాపించాడు
  rationale: హీబ్రూ క్రియకు సహజమైన ఆధునిక తెలుగు రూపం; సందర్భం ద్వారా కర్త యెహోవా, గ్రహీత సొలొమోను అని స్పష్టమవుతుంది.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: ఈ విషయం గురించి
  rationale: דבר ఇక్కడ కేవలం ‘మాట’ను కాక, ముందుగా ప్రస్తావించిన విషయాన్ని సూచిస్తుంది.
- source_word: לְבִלְתִּי לֶכֶת אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లను అనుసరించకూడదని
  rationale: ‘వారి వెనుక వెళ్లడం’ అనే హీబ్రూ నిబంధనాత్మక నుడికారంలోని విధేయత/ఆరాధన భావాన్ని సహజమైన తెలుగులో ‘అనుసరించడం’గా వ్యక్తపరుస్తుంది.
- source_word: וְלֹא שָׁמַר
  choice: అయినా ... పాటించలేదు
  rationale: וְ ఇక్కడ ముందున్న ఆజ్ఞకు విరుద్ధమైన సొలొమోను ప్రవర్తనను చూపుతుంది; שמר ఆజ్ఞ సందర్భంలో ‘పాటించు’ అని సహజంగా వస్తుంది.
- source_word: אֵת אֲשֶׁר צִוָּה יְהוָה
  choice: యెహోవా ఆజ్ఞాపించినదాన్ని
  rationale: హీబ్రూ సంబంధవాక్యాన్ని సంక్షిప్తంగా, అర్థవంతంగా తెలుగులో అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన దైవనామ రూపం; మూలంలోని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయదు.
theological_decisions:
- issue: ఇతర దేవుళ్ల ‘వెనుక వెళ్లడం’ అనే నుడికారం
  choice: ఇతర దేవుళ్లను అనుసరించడం
  alternative: ఇతర దేవుళ్ల వెనుక వెళ్లడం
  rationale: మూల నుడికారంలోని ఇతర దేవతలవైపు తిరిగి వారికి విధేయత/ఆరాధన చూపే భావాన్ని తెలియజేస్తూ, తెలుగులో అపార్థం కలిగించే కేవలం భౌతికంగా వెంబడించే భావాన్ని నివారిస్తుంది; వివరాన్ని పాదసూచికలో ఉంచుతుంది.
- issue: יְהוָה దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని దైవనామాన్ని పేరుగానే ఉంచుతూ, ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా పరిచితమైన రూపాన్ని ఎంచుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఆజ్ఞకు అవిధేయత మధ్య ఉన్న వ్యత్యాసాన్ని ‘అయినా’ స్పష్టం చేస్తుంది. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో సంబంధిత నుడికారం వెంట ఉంచబడింది.
