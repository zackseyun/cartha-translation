id: 1KI.11.12
reference: 1 Kings 11:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַךְ בְּ/יָמֶ֨י/ךָ֙ לֹ֣א אֶעֱשֶׂ֔/נָּה לְמַ֖עַן דָּוִ֣ד אָבִ֑י/ךָ מִ/יַּ֥ד בִּנְ/ךָ֖ אֶקְרָעֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/012.yaml
  text: Nevertheless[a], in your days I will not do it, for the sake of David your father[b]; from the hand of your son I will tear it away.
translation:
  language: te
  text: అయినప్పటికీ, నీ తండ్రియైన దావీదు నిమిత్తం నీ కాలంలో నేను దాన్ని[a] చేయను; నీ కుమారుని చేతిలోనుండి[b] దాన్ని చీల్చివేస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ముందటి వచనంలో ప్రకటించినట్లుగా రాజ్యాన్ని చీల్చివేయడం.
    reason: cross_reference
  - marker: b
    text: లేదా, ‘నీ కుమారుని అధీనంలోనుండి.’ హీబ్రూ నుడికారం అక్షరార్థంగా ‘నీ కుమారుని చేతిలోనుండి’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: అయితే
  rationale: ముందటి వచనంలో ప్రకటించిన తీర్పుకు ఇక్కడ పరిమితిని, వ్యతిరేక మలుపును సూచిస్తుంది. ఆధునిక తెలుగులో ‘అయితే’ ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּיָמֶיךָ
  choice: నీ రోజుల్లో
  rationale: హీబ్రూ కాలసూచక నుడికారాన్ని నిలుపుతూ, సొలొమోను జీవించి పరిపాలించే కాలాన్ని సూచిస్తుంది.
- source_word: לֹא אֶעֱשֶׂנָּה
  choice: నేను దాన్ని చేయను
  rationale: స్త్రీలింగ ప్రత్యయంతో సూచించబడిన విషయం ముందటి సందర్భంలోని రాజ్యాన్ని చీల్చివేసే చర్య. సందర్భాన్ని మించి స్పష్టీకరించకుండా అన్వయాన్ని నిలుపుతుంది.
- source_word: לְמַעַן דָּוִד אָבִיךָ
  choice: నీ తండ్రి దావీదు నిమిత్తం
  rationale: దావీదు పట్ల చూపబడుతున్న గౌరవం లేదా అనుగ్రహాన్ని కేవలం కారణార్థంగా కుదించకుండా వ్యక్తం చేస్తుంది.
- source_word: מִיַּד בִּנְךָ
  choice: నీ కుమారుని చేతినుండి
  rationale: ‘చేతినుండి’ అనే హీబ్రూ రూపకాన్ని నిలుపుతుంది; అది అతని అధికారం లేదా స్వాధీనంలోనుండి తీసివేయడాన్ని సూచిస్తుంది.
- source_word: אֶקְרָעֶנָּה
  choice: దాన్ని చీల్చివేస్తాను
  rationale: קָרַע యొక్క ‘చీల్చు/చింపివేయు’ భావాన్ని, రాజ్యం విభజింపబడే సందర్భంలోని బలమైన రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: సొలొమోనుపై ప్రకటించిన తీర్పు వాయిదా పడటం
  choice: రాజ్యాన్ని చీల్చివేసే తీర్పు సొలొమోను రోజుల్లో అమలు కాదని, అతని కుమారుని అధీనంలోనుండి రాజ్యం చీల్చివేయబడుతుందని అనువదించబడింది.
  alternative: ‘నీ జీవితకాలంలో నేను అలా చేయను; నీ కుమారుని అధీనంలోనుండి దాన్ని చీల్చివేస్తాను’ అని మరింత వివరణాత్మకంగా అనువదించవచ్చు.
  rationale: హీబ్రూ వాక్యం కర్మను స్పష్టంగా మళ్లీ చెప్పకుండా ముందటి సందర్భంపై ఆధారపడుతుంది. అనువాదం ఆ అనిశ్చిత సూచనను నిలుపుతూ, దావీదు నిమిత్తం తీర్పు వాయిదా పడిన భావాన్ని అదనపు సిద్ధాంత వివరణ లేకుండా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘నీ రోజుల్లో,’ ‘నిమిత్తం,’ ‘చేతినుండి’ అనే పదబంధాలు మూలంలోని కాలసూచన, దావీదు పట్ల చూపిన పరిగణన, అధికారం నుండి తొలగింపు అనే రూపకాలను నిలుపుతాయి.
