id: 1KI.11.24
reference: 1 Kings 11:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְבֹּ֤ץ עָלָי/ו֙ אֲנָשִׁ֔ים וַ/יְהִ֣י שַׂר גְּד֔וּד בַּ/הֲרֹ֥ג דָּוִ֖ד אֹתָ֑/ם וַ/יֵּלְכ֤וּ דַמֶּ֨שֶׂק֙ וַ/יֵּ֣שְׁבוּ בָ֔/הּ וַֽ/יִּמְלְכ֖וּ בְּ/דַמָּֽשֶׂק־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/024.yaml
  text: He gathered men to himself and became commander of a band when David killed them. They went to Damascus[a], settled there, and reigned in Damascus.
translation:
  language: te
  text: అతడు తన చుట్టూ మనుష్యులను సమకూర్చుకొని, దావీదు వారిని చంపినప్పుడు ఒక దళానికి అధిపతి అయ్యాడు. వారు దమస్కుకు వెళ్లి[a], అక్కడ స్థిరపడి, దమస్కులో రాజ్యమేలారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'వచనం చివరి భాగమంతటా హీబ్రూలో బహువచన క్రియలే ఉన్నాయి: ‘వారు వెళ్లారు ... స్థిరపడ్డారు ... రాజ్యమేలారు.’ సందర్భం రెజోనుపై కేంద్రీకృతమై ఉన్నందున కొన్ని అనువాదాలు వీటిని ‘అతడు’ అని ఏకవచనంగా సవరించాయి.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ עָלָיו אֲנָשִׁים
  choice: అతడు తన చుట్టూ మనుష్యులను సమకూర్చుకొని
  rationale: קבץ తో עַל మరియు సర్వనామ ప్రత్యయం కలిసిన ఈ ప్రయోగం, తన చుట్టూ అనుచరులను సమీకరించుకోవడాన్ని సూచిస్తుంది. తెలుగు సహజత్వంతో పాటు ఆ దిశాత్మక భావాన్ని నిలుపుతుంది.
- source_word: אֲנָשִׁים
  choice: మనుష్యులను
  rationale: ఇది పుంలింగ బహువచనం; సైనిక సందర్భంలో అతనితో చేరిన పురుషులను సూచిస్తుంది. ‘మనుష్యులు’ మూలంలోని లింగసూచనను నిలుపుతుంది.
- source_word: שַׂר גְּדוּד
  choice: ఒక దళానికి అధిపతి
  rationale: שַׂר నాయకుడు లేదా అధిపతి; גְּדוּד ఒక సైనిక దళం లేదా బృందం. ‘దళం’ అనేది దోపిడీ స్వభావాన్ని అనవసరంగా చేర్చకుండా తటస్థంగా ఉంటుంది.
- source_word: בַּהֲרֹג דָּוִד אֹתָם
  choice: దావీదు వారిని చంపినప్పుడు
  rationale: ב + క్రియానామ రూపం ఇక్కడ కాలసంబంధ పరిస్థితిని, ‘చంపినప్పుడు’ అనే భావాన్ని తెలియజేస్తుంది. ‘వారిని’ మూలంలోని బహువచన కర్మను నిలుపుతుంది.
- source_word: וַיֵּלְכוּ דַמֶּשֶׂק
  choice: వారు దమస్కుకు వెళ్లి
  rationale: మూలంలో బహువచన క్రియ ఉంది; గమ్యస్థాన దిశను ‘దమస్కుకు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: అక్కడ స్థిరపడి
  rationale: ישב నివాసం ఏర్పరచుకొని ఉండడాన్ని సూచించగలదు. ‘స్థిరపడి’ దమస్కులో నివసించడం ప్రారంభించిన భావాన్ని సహజంగా ఇస్తుంది.
- source_word: וַיִּמְלְכוּ בְּדַמָּשֶׂק
  choice: దమస్కులో రాజ్యమేలారు
  rationale: מלך యొక్క ప్రాథమిక భావం రాజుగా పరిపాలించడం లేదా రాజ్యమేలడం. మూలంలోని బహువచనాన్ని ‘రాజ్యమేలారు’గా అలాగే నిలిపాం.
theological_decisions:
- issue: రెజోనుపై కథనం కేంద్రీకృతమైనప్పటికీ చివరి భాగంలో బహువచన క్రియారూపాలు ఉండటం
  choice: ‘వారు ... వెళ్లి ... స్థిరపడి ... రాజ్యమేలారు’ అని బహువచనాన్ని నిలుపడం
  alternative: రెజోనును అంతర్లీన కర్తగా తీసుకొని ‘అతడు ... వెళ్లి ... స్థిరపడి ... రాజ్యమేలాడు’ అని ఏకవచనంగా సవరించడం
  rationale: హీబ్రూ పాఠంలో చివరి మూడు క్రియలు స్పష్టంగా బహువచనంలో ఉన్నాయి. సందర్భాన్ని బట్టి ఏకవచనంగా సులభీకరించకుండా, మూలపాఠంలోని కథన ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని బహువచన అస్పష్టతను పాదసూచికతో నిలిపాం; గְּדוּדకు దోపిడీ భావాన్ని అదనంగా చేర్చకుండా ‘దళం’ అనే తటస్థ పదం వాడాం.
