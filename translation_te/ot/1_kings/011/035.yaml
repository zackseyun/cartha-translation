base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/035.yaml
  text: But I will take the kingdom from the hand of his son and give it to you[b][a], the ten tribes.
translation:
  language: te
  text: అయితే అతని కుమారుని చేతిలోనుండి[a] రాజ్యాన్ని తీసుకొని, పది గోత్రాలను నీకు ఇస్తాను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతని కుమారుని చేతిలోనుండి’ అనేది అతని కుమారుని అధికారం లేదా ఆధీనంలోనుండి రాజ్యాన్ని తొలగించడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
  - marker: b
    text: 'అక్షరార్థంగా: ‘మరియు నేను వాటిని నీకు ఇస్తాను—పది గోత్రాలను.’ ‘పది గోత్రాలను’ అనే పదబంధం ఇవ్వబడే రాజ్యభాగాన్ని నిర్దిష్టం చేస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: అయితే ... తీసుకొని
  rationale: ప్రవచన సందర్భంలో సంధితో కూడిన సంపూర్ణ క్రియ భవిష్యత్ కార్యాన్ని సూచిస్తుంది. ముందున్న మాటతో వ్యత్యాసాన్ని చూపడానికి וְ ను ‘అయితే’గా అనువదించాం; לקח యొక్క ‘తీసుకోవడం’ అనే ప్రాథమిక భావాన్ని నిలిపాం.
- source_word: הַמְּלוּכָה
  choice: రాజ్యాన్ని
  rationale: ఇక్కడ ఇది సొలొమోను వంశాధీనంలో ఉన్న రాజ్యాధికార పరిధిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘రాజ్యం’ సహజంగా, సందర్భోచితంగా ఉంది.
- source_word: מִיַּד בְּנוֹ
  choice: అతని కుమారుని చేతిలోనుండి
  rationale: మూలంలోని ‘చేతిలోనుండి’ అనే స్వాధీనత/నియంత్రణ రూపకాన్ని నిలిపాం. సందర్భంలో ‘అతని కుమారుడు’ సొలొమోను కుమారుణ్ణి సూచిస్తుంది.
- source_word: וּנְתַתִּיהָ לְּךָ
  choice: దాన్ని నీకు ఇస్తాను
  rationale: స్త్రీలింగ ప్రత్యయం ‘రాజ్యం’ను తిరిగి సూచిస్తుంది. తెలుగులో భవిష్యత్ అర్థాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేశాం.
- source_word: אֵת עֲשֶׂרֶת הַשְּׁבָטִים
  choice: అంటే, పది గోత్రాలను
  rationale: ఈ పదబంధం ఇవ్వబడే రాజ్యం ఏ భాగంతో కూడిందో అనువర్తనంగా నిర్దిష్టం చేస్తుంది. ‘అంటే’ మూలంలోని వివరణాత్మక సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది; రాజ్యం మొత్తమంతా ఇవ్వబడుతుందనే అపార్థాన్ని నివారిస్తుంది.
