id: 1KI.11.21
reference: 1 Kings 11:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/הֲדַ֞ד שָׁמַ֣ע בְּ/מִצְרַ֗יִם כִּֽי שָׁכַ֤ב דָּוִד֙ עִם אֲבֹתָ֔י/ו וְ/כִי מֵ֖ת יוֹאָ֣ב שַֽׂר הַ/צָּבָ֑א וַ/יֹּ֤אמֶר הֲדַד֙ אֶל פַּרְעֹ֔ה שַׁלְּחֵ֖/נִי וְ/אֵלֵ֥ךְ אֶל אַרְצִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/021.yaml
  text: When Hadad heard in Egypt that David had lain down with his fathers and that Joab[a], the commander of the army, was dead, Hadad said to Pharaoh, “Send me away[b], so that I may go to my own land.”
translation:
  language: te
  text: హదదు ఐగుప్తులో ఉన్నప్పుడు, దావీదు తన పితరులతో శయనించాడనీ[a], సైన్యాధిపతి యోవాబు చనిపోయాడనీ విన్నాడు. అప్పుడు హదదు ఫరోతో, “నేను నా దేశానికి వెళ్లేలా నన్ను పంపించు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇది మరణాన్ని సూచించే హెబ్రీ నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: విన్నాడు
  rationale: వార్త అందిందనే సందర్భార్థాన్ని సహజంగా కలిగిస్తూ, హెబ్రీ మూలంలోని సాధారణ ‘విను’ భావాన్ని నిలుపుతుంది.
- source_word: שָׁכַב ... עִם אֲבֹתָיו
  choice: తన పితరులతో శయనించాడు
  rationale: ఇది మరణాన్ని సూచించే ప్రాచీన హెబ్రీ నానుడి. కేవలం ‘చనిపోయాడు’ అని సమతలపరచకుండా మూలంలోని రాజవంశీయ మరణసూత్రపు రూపకాన్ని నిలుపుతుంది.
- source_word: מֵת
  choice: చనిపోయాడు
  rationale: యోవాబు మరణించిన స్థితిని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది; ‘మరణించాడు’ కూడా సాధ్యమే.
- source_word: שַׂר הַצָּבָא
  choice: సైన్యాధిపతి
  rationale: సైన్యానికి నాయకత్వం వహించే అధికారిని సంక్షిప్తమైన, ప్రామాణిక ఆధునిక తెలుగు పదంతో సూచిస్తుంది.
- source_word: שַׁלְּחֵנִי
  choice: నన్ను పంపించు
  rationale: ఫరో తనను వెళ్లనివ్వాలని లేదా పంపివేయాలని హదదు చేసిన విజ్ఞప్తిని మూలానికి దగ్గరగా వ్యక్తం చేస్తుంది.
- source_word: וְאֵלֵךְ
  choice: నేను ... వెళ్లేలా
  rationale: ఆజ్ఞార్థక క్రియ తరువాత వచ్చే ఉద్దేశం లేదా కోరుకున్న ఫలితాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: אַרְצִי
  choice: నా దేశం
  rationale: అక్షరార్థమైన ‘నా భూమి’ కంటే ఇక్కడ హదదు స్వదేశాన్ని సూచించే ‘నా దేశం’ సందర్భానికి సహజంగా సరిపోతుంది.
theological_decisions:
- issue: దావీదు మరణాన్ని తెలిపే నానుడి
  choice: తన పితరులతో శయనించాడు
  alternative: చనిపోయాడు
  rationale: మరణార్థం స్పష్టమయ్యేలా పాదటిప్పణి ఇస్తూనే, మూలంలోని సంప్రదాయ నానుడి మరియు దాని రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథనశైలి. మూలంలోని మరణనానుడిని పాఠ్యంలో ఉంచి పాదటిప్పణిలో వివరించాం. వావ్ కథన క్రమాన్ని ఈ సందర్భంలో సహజంగా చూపేందుకు రెండో వాక్యంలో ‘అప్పుడు’ వాడాం; మూలంలో ప్రత్యేకమైన ‘ఇప్పుడు’ పదం లేదు.
