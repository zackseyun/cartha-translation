source:
  edition: WLC
  text: וְ/הָ/אִ֥ישׁ יָרָבְעָ֖ם גִּבּ֣וֹר חָ֑יִל וַ/יַּ֨רְא שְׁלֹמֹ֜ה אֶת הַ/נַּ֗עַר כִּֽי עֹשֵׂ֤ה מְלָאכָה֙ ה֔וּא וַ/יַּפְקֵ֣ד אֹת֔/וֹ לְ/כָל סֵ֖בֶל בֵּ֥ית יוֹסֵֽף־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/028.yaml
  text: The man Jeroboam was a mighty man of valor[a], and Solomon saw that the young man was industrious[b], so he appointed him over all the labor force of the house of Joseph.
translation:
  language: te
  text: యెరోబాము పరాక్రమశాలి[a]. అతడు కష్టపడి పనిచేసే యువకుడని సొలొమోను గమనించి, యోసేపు వంశస్థుల[b] వెట్టిచాకిరి అంతటికీ అతణ్ణి పర్యవేక్షకునిగా నియమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సమర్థుడు,’ ‘శూరుడు.’ హీబ్రూ పదబంధం బలం, శౌర్యం లేదా విశిష్ట సామర్థ్యాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘యోసేపు వంశస్థులు’ అంటే యోసేపు సంతానంగా ఏర్పడిన గోత్రాలు, ముఖ్యంగా ఎఫ్రాయిము, మనష్షే గోత్రాలు.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָאִישׁ יָרָבְעָם
  choice: యెరోబాము
  rationale: తెలుగులో సహజమైన పరిచయ వాక్యంగా వ్యక్తిపేరును నేరుగా ఉంచాం; హీబ్రూ וְ కథనాన్ని కొనసాగిస్తుంది, הָאִישׁ ఇక్కడ యెరోబామును సూచిస్తుంది.
- source_word: גִּבּוֹר חָיִל
  choice: పరాక్రమశాలి
  rationale: ఈ హీబ్రూ పదబంధం బలం, శౌర్యం, విశిష్ట సామర్థ్యం అనే విస్తృత భావాలను కలిగి ఉంది. యుద్ధ సందర్భం కానందున ‘పరాక్రమశాలి’ ఆ భావవిస్తృతిని సంక్షిప్తంగా నిలుపుతుంది; ప్రత్యామ్నాయాలు పాదసూచికలో ఇచ్చాం.
- source_word: וַיַּרְא
  choice: గమనించి
  rationale: ראה ప్రాథమికంగా ‘చూచుట’; ఇక్కడ సొలొమోను యువకుని పనితీరును గుర్తించాడనే సందర్భార్థాన్ని సహజ తెలుగులో ‘గమనించి’ వ్యక్తం చేస్తుంది.
- source_word: הַנַּעַר
  choice: యువకుడు
  rationale: נַעַר బాలుడు, యువకుడు లేదా సేవకుడు కావచ్చు. పరిపాలనా బాధ్యత పొందగల వయస్సు, సందర్భం దృష్ట్యా ‘యువకుడు’ సముచితం.
- source_word: כִּי עֹשֵׂה מְלָאכָה הוּא
  choice: అతడు కష్టపడి పనిచేసే యువకుడని
  rationale: అక్షరార్థంగా ‘అతడు పని చేసేవాడు/పని చేస్తున్నవాడు.’ నియామకానికి కారణమైన శ్రద్ధ, పనితత్వాన్ని ఆధునిక తెలుగులో ‘కష్టపడి పనిచేసే’ అని సహజంగా తెలిపాం.
- source_word: וַיַּפְקֵד אֹתוֹ
  choice: అతణ్ణి అధికారిగా నియమించాడు
  rationale: פקד హిఫిల్ రూపం నియమించడం లేదా బాధ్యతలో ఉంచడం అని సూచిస్తుంది. తెలుగులో బాధ్యత స్వభావాన్ని స్పష్టంగా తెలిపేందుకు ‘అధికారిగా నియమించాడు’ అన్నాం.
- source_word: לְכָל סֵבֶל
  choice: వెట్టిచాకిరి అంతటికీ
  rationale: סֵבֶל భారమోయించే రాజసేవను, corvée విధానంలోని నిర్బంధ శ్రమను సూచిస్తుంది. ‘వెట్టిచాకిరి’ దాని సామాజిక-రాజకీయ భావాన్ని సాధారణ తెలుగు పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: בֵּית יוֹסֵף
  choice: యోసేపు వంశస్థులు
  rationale: ‘యోసేపు ఇంటివారు’ అనే హీబ్రూ గోత్రపరమైన నుడికారాన్ని సహజ తెలుగులో ‘యోసేపు వంశస్థులు’గా ఇచ్చాం; ప్రత్యేక సూచనను పాదసూచికలో వివరించాం.
