source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֧י שְׁלֹמֹ֛ה וְ/כָל אֲשֶׁ֥ר עָשָׂ֖ה וְ/חָכְמָת֑/וֹ הֲ/לֽוֹא הֵ֣ם כְּתֻבִ֔ים עַל סֵ֖פֶר דִּבְרֵ֥י שְׁלֹמֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/041.yaml
  text: The rest of the acts of Solomon[a], and all that he did, and his wisdom—are they not written in the Book of the Acts of Solomon?
translation:
  language: te
  text: సొలొమోను మిగిలిన కార్యాలు[a], అతడు చేసినదంతా, అతని జ్ఞానం—ఇవన్నీ ‘సొలొమోను కార్యాల గ్రంథం’లో రాయబడి ఉన్నాయి కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సొలొమోను దినవృత్తాంతాలు.’ హీబ్రూ పదబంధానికి అక్షరార్థం ‘సొలొమోను మాటలు లేదా విషయాలు’; ఇక్కడ అది అతని కార్యాల నమోదును సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי שְׁלֹמֹה
  choice: సొలొమోను చేసిన మిగిలిన కార్యాలు
  rationale: రాజుల పాలన సంగ్రహాల సందర్భంలో דִּבְרֵי అనేది కేవలం ‘మాటలు’ కాక, రాజుకు సంబంధించిన కార్యాలు లేదా వ్యవహారాలను సూచిస్తుంది. సహజమైన తెలుగులో సంబంధాన్ని స్పష్టంగా చూపడానికి ‘చేసిన’ చేర్చబడింది.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: అతడు చేసినదంతా
  rationale: עשה అనే విస్తృతార్థక క్రియను అనవసరంగా ప్రత్యేకీకరించకుండా, సంబంధవాచక వాక్యాన్ని సహజంగా అందిస్తుంది.
- source_word: וְחָכְמָתוֹ
  choice: అతని జ్ఞానం
  rationale: సర్వనామ ప్రత్యయంతో ఉన్న నామవాచకానికి నేరమైన, సహజమైన అనువాదం.
- source_word: הֲלוֹא הֵם כְּתֻבִים
  choice: ఇవన్నీ … రాయబడి ఉన్నాయి కదా?
  rationale: అంగీకార సమాధానాన్ని ఆశించే హీబ్రూ అలంకారప్రశ్నను తెలుగులో సహజమైన ‘కదా?’ నిర్మాణంతో నిలుపుతుంది. బహువచన הֵם భావాన్ని ‘ఇవన్నీ’ స్పష్టం చేస్తుంది.
- source_word: עַל סֵפֶר
  choice: గ్రంథంలో
  rationale: అక్షరార్థంగా ‘గ్రంథం/చుట్టపై’ అయినప్పటికీ, లిఖిత ఆధారాన్ని ఉదహరించే సందర్భంలో తెలుగు వాడుకకు ‘గ్రంథంలో’ సహజంగా సరిపోతుంది.
- source_word: סֵפֶר דִּבְרֵי שְׁלֹמֹה
  choice: ‘సొలొమోను కార్యాల గ్రంథం’
  rationale: ఇది సొలొమోను పాలనకు సంబంధించిన విషయాలు లేదా కార్యాల నమోదును సూచించే గ్రంథశీర్షికగా కనిపిస్తుంది. ‘కార్యాలు’ సందర్భోచితంగా ఉండి, ‘దినవృత్తాంతాలు’ అనే ప్రత్యామ్నాయానికి మించిన హీబ్రూ పారదర్శకతను కాపాడుతుంది.
