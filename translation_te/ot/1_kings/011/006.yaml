  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ שְׁלֹמֹ֛ה הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וְ/לֹ֥א מִלֵּ֛א אַחֲרֵ֥י יְהוָ֖ה כְּ/דָוִ֥ד אָבִֽי/ו׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/006.yaml
  text: So Solomon did what was evil in the eyes of Yahweh[a], and he did not fully follow Yahweh, as David his father had done.
translation:
  language: te
  text: కాబట్టి సొలొమోను యాహ్వే దృష్టిలో చెడైనది చేశాడు; తన తండ్రి దావీదు యాహ్వేను సంపూర్ణంగా అనుసరించినట్లుగా అతడు అనుసరించలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యాహ్వే వెంబడి పూర్తిగా నడవలేదు,’ లేదా ‘యాహ్వేకు పూర్తిగా నిబద్ధుడై ఉండలేదు.’ హీబ్రూ నుడికారం అసంపూర్ణ విశ్వాసనిష్ఠను లేదా విధేయతను వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేశాడు
  rationale: עשה అనే సాధారణ క్రియ ఇక్కడ సొలొమోను ప్రవర్తనను తెలియజేస్తుంది. ‘చెడైనది చేశాడు’ అనేది హీబ్రూ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: הָרַע
  choice: చెడైనది
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న విశేషణం ఇక్కడ నామవాచకార్థంలో ‘చెడైనది’ అని అర్థమిస్తుంది; ఇది సాధారణ లోపం కంటే నైతిక చెడును సూచిస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో
  rationale: ‘కళ్లలో’ అనే హీబ్రూ మూలరూపాన్ని తెలుగులో యథాతథంగా ఉంచడం అసహజంగా ఉండవచ్చు. ‘దృష్టిలో’ అనేది దేవుని మూల్యాంకనాన్ని తెలిపే సహజమైన సమానార్థక నుడికారం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: מִלֵּא אַחֲרֵי
  choice: సంపూర్ణంగా అనుసరించలేదు
  rationale: ఈ హీబ్రూ నుడికారం పూర్తిగా వెంబడించడం, సంపూర్ణ విధేయత లేదా నిబద్ధతతో అనుసరించడం అనే భావాన్ని ఇస్తుంది. ‘సంపూర్ణంగా అనుసరించలేదు’ అనేది అంతరంగ భక్తికి మాత్రమే పరిమితం చేయకుండా ఆ విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: כְּדָוִד אָבִיו
  choice: తన తండ్రి దావీదులా
  rationale: హీబ్రూలోని సంక్షిప్త పోలికను సహజమైన తెలుగులో ఇస్తూ, దావీదు చూపిన అనుసరణే పోలికకు ఆధారమని సందర్భం ద్వారా స్పష్టమవుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా ఉంచాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: מִלֵּא אַחֲרֵי יְהוָה లో సొలొమోను వైఫల్యపు స్థాయి
  choice: యెహోవాను సంపూర్ణంగా అనుసరించలేదు
  alternative: యెహోవాపట్ల సంపూర్ణ నిబద్ధత చూపలేదు
  rationale: ఈ వాక్యభాగం అసంపూర్ణ అనుసరణను తెలియజేస్తుంది. ఇది అంతరంగ నిబద్ధతను కూడా సూచించగలిగినా, ఈ ఒక్క ఉపవాక్యమే సంపూర్ణ మతభ్రష్టత్వాన్ని స్పష్టంగా ప్రకటించినట్లు బలపరచకుండా మూలంలోని ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవభరితమైన బైబిలు శైలిని నిలిపాం. ‘దృష్టిలో’ మరియు ‘సంపూర్ణంగా అనుసరించలేదు’ అనే రూపాలు సహజత్వం, మూలనిబద్ధత రెండింటినీ సమతుల్యం చేస్తాయి.
