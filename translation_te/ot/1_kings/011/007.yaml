  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָז֩ יִבְנֶ֨ה שְׁלֹמֹ֜ה בָּמָ֗ה לִ/כְמוֹשׁ֙ שִׁקֻּ֣ץ מוֹאָ֔ב בָּ/הָ֕ר אֲשֶׁ֖ר עַל פְּנֵ֣י יְרוּשָׁלִָ֑ם וּ/לְ/מֹ֕לֶךְ שִׁקֻּ֖ץ בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/007.yaml
  text: Then Solomon built a high place for Chemosh[a], the abomination of Moab, on the mountain that is opposite Jerusalem, and for Molech, the abomination of the Ammonites.
translation:
  language: te
  text: అప్పుడు సొలొమోను యెరూషలేముకు ఎదురుగా ఉన్న కొండమీద మోయాబీయుల హేయదేవుడైన కెమోషుకు, అమ్మోనీయుల హేయదేవుడైన మోలెకుకు[a] ఒక ఉన్నతస్థలాన్ని కట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మిల్కోముకు.” ఇక్కడి హీబ్రూ రూపాన్ని సంప్రదాయంగా “మోలెకు” అని చదువుతారు; అయితే కొందరు దీనిని అమ్మోనీయుల దేవత మిల్కోముతో సంబంధపరుస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: కథన క్రమంలో తదుపరి సంఘటనను సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: יִבְנֶה
  choice: కట్టించాడు
  rationale: రాజైన సొలొమోను ఆ ఆరాధనా స్థలాలను నిర్మింపజేశాడనే సహజమైన తెలుగు భావాన్ని ఇస్తుంది; కథన సందర్భంలో భూతకాలాన్ని సూచిస్తుంది.
- source_word: בָּמָה
  choice: ఉన్నతస్థలం
  rationale: ఆరాధనకు సంబంధించిన ఎత్తైన స్థలం అనే సాంకేతిక భావాన్ని సాధ్యమైనంత సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לִכְמוֹשׁ
  choice: కెమోషుకు
  rationale: లామెద్ సమర్పణ లేదా అంకితాన్ని సూచిస్తుంది; దేవత పేరును లిప్యంతరీకరించాం.
- source_word: שִׁקֻּץ מוֹאָב
  choice: మోయాబీయుల హేయదేవుడు
  rationale: שִׁקֻּץ లోని బలమైన నిందార్థాన్ని ‘హేయ’ నిలుపుతుంది; సందర్భంలో ఇది దేవతను సూచిస్తున్నందున ‘దేవుడు’ అని స్పష్టం చేయడం సహజమైన తెలుగును ఇస్తుంది.
- source_word: בָּהָר אֲשֶׁר עַל־פְּנֵי יְרוּשָׁלִָם
  choice: యెరూషలేముకు ఎదురుగా ఉన్న కొండమీద
  rationale: הַר ను సందర్భానుకూలంగా ‘కొండ’గా, עַל־פְּנֵי ను మరింత నిర్దిష్టమైన భౌగోళిక గుర్తింపును చేర్చకుండా ‘ఎదురుగా’గా అనువదించాం.
- source_word: וּלְמֹלֶךְ
  choice: మోలెకుకు
  rationale: మసొరెటిక్ పాఠంలోని స్వరాంకిత రూపాన్ని ప్రధాన పాఠంలో అనుసరించాం; మిల్కోము అనే సంబంధిత పఠనాన్ని పాదసూచికలో ఉంచాం.
- source_word: שִׁקֻּץ בְּנֵי עַמּוֹן
  choice: అమ్మోనీయుల హేయదేవుడు
  rationale: మొదటి సమాంతర పదబంధంతో అనుసరణను నిలుపుతూ, בְּנֵי עַמּוֹן ను సహజమైన జాతినామమైన ‘అమ్మోనీయులు’గా ఇచ్చాం.
theological_decisions:
- issue: అన్యదేవతలకు వాడిన నిందార్థక సంబోధన
  choice: రెండు చోట్లా ‘హేయదేవుడు’
  alternative: ‘హేయమైనది’ లేదా ‘అసహ్యమైన దేవుడు’
  rationale: హీబ్రూ వచనమే ఈ దేవతలపై ప్రతికూలమైన ధార్మిక తీర్పును వ్యక్తం చేస్తుంది. ‘హేయదేవుడు’ ఆ బలాన్ని నిలుపుతూ తెలుగులో సూచిత వ్యక్తిని స్పష్టం చేస్తుంది.
- issue: מֹלֶךְ గుర్తింపు
  choice: ప్రధాన పాఠంలో ‘మోలెకు’
  alternative: ‘మిల్కోము’
  rationale: మసొరెటిక్ స్వరాంకనం ‘మోలెకు’కు మద్దతిస్తుంది; సంబంధిత పాఠాల ఆధారంగా ‘మిల్కోము’ అనే గుర్తింపు చర్చనీయమైనందున దాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలి. ‘ఉన్నతస్థలం’ ఆరాధనా స్థలానికి సంబంధించిన సాంకేతిక పదంగా వాడబడింది. సమాంతర నిర్మాణాన్ని స్పష్టంగా చూపడానికి రెండవ భాగంలో ‘ఒక ఉన్నతస్థలాన్ని’ పునరుక్తి చేశాం; ఇది తెలుగులో వాక్యార్థాన్ని స్పష్టం చేస్తుంది.
