source:
  edition: WLC
  text: וַֽ/יְהִי֙ בָּ/עֵ֣ת הַ/הִ֔יא וְ/יָֽרָבְעָ֖ם יָצָ֣א מִ/ירוּשָׁלִָ֑ם וַ/יִּמְצָ֣א אֹת֡/וֹ אֲחִיָּה֩ הַ/שִּׁילֹנִ֨י הַ/נָּבִ֜יא בַּ/דֶּ֗רֶךְ וְ/ה֤וּא מִתְכַּסֶּה֙ בְּ/שַׂלְמָ֣ה חֲדָשָׁ֔ה וּ/שְׁנֵי/הֶ֥ם לְ/בַדָּ֖/ם בַּ/שָּׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/029.yaml
  text: And at that time[a], when Jeroboam went out from Jerusalem, Ahijah the Shilonite, the prophet, found him on the road. Now he had wrapped himself in a new cloak, and the two of them were alone in the open field.
translation:
  language: te
  text: ఆ సమయంలో యెరోబాము యెరూషలేము నుండి బయలుదేరినప్పుడు, షిలోనీయుడైన ప్రవక్త అహీయా దారిలో అతనిని కలిశాడు. అతడు[a] కొత్త పైవస్త్రం కప్పుకొని ఉన్నాడు; వారిద్దరూ పొలంలో ఒంటరిగా ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతడు’ ప్రధానంగా అహీయాను సూచిస్తున్నట్లు కనిపిస్తుంది; అయితే హెబ్రూ వాక్య నిర్మాణంలో ఇది యెరోబామును సూచించే అవకాశమూ ఉంది.
    reason: referential_ambiguity
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִיא
  choice: ఆ సమయంలో
  rationale: హెబ్రూ కథన సూత్రంలోని కాలసూచనను సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; ‘ఇలా జరిగింది’ అని విడిగా చేర్చకపోయినా వాక్య నిర్మాణం కథనం ముందుకు సాగుతున్న భావాన్ని నిలుపుతుంది.
- source_word: יָצָא מִירוּשָׁלָם
  choice: యెరూషలేము నుండి బయలుదేరి వెళ్లగా
  rationale: יָצָא లోని ‘బయటకు వెళ్లడం’ అనే దిశాభావాన్ని నిలుపుతూ, తరువాతి సంఘటనకు నేపథ్యంగా సహజంగా కలుపుతుంది.
- source_word: וַיִּמְצָא אֹתוֹ
  choice: అతనిని కలిశాడు
  rationale: מָצָא యొక్క ప్రాథమిక భావం ‘కనుగొను’ అయినా, ఇక్కడ దారిలో ఎదురైన వ్యక్తిని సూచిస్తున్నందున ‘కలిశాడు’ తెలుగులో సహజంగా సందర్భార్థాన్ని ఇస్తుంది.
- source_word: אֲחִיָּה הַשִּׁילֹנִי הַנָּבִיא
  choice: షిలోనీయుడైన ప్రవక్త అహీయా
  rationale: వ్యక్తి పేరు, షిలోతో అతని సంబంధం, ప్రవక్త అనే గుర్తింపును స్పష్టమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: בַּדֶּרֶךְ
  choice: దారిలో
  rationale: స్థలసూచకమైన హెబ్రూ పదబంధానికి సంక్షిప్తమైన, సహజమైన తెలుగు సమానం.
- source_word: וְהוּא מִתְכַּסֶּה
  choice: అతడు కొత్త అంగీ కప్పుకొని ఉన్నాడు
  rationale: హిత్పయేల్ రూపంలోని స్వయంగా కప్పుకున్న స్థితిని ‘కప్పుకొని ఉన్నాడు’ సహజంగా వ్యక్తపరుస్తుంది. సర్వనామ సూచనలోని సాధ్యమైన అస్పష్టతను ప్రధాన పాఠంలో అలాగే ఉంచింది.
- source_word: בְּשַׂלְמָה חֲדָשָׁה
  choice: కొత్త అంగీ
  rationale: שַׂלְמָה ఒక బయటి వస్త్రాన్ని సూచిస్తుంది; తరువాతి వచనంలోని చింపివేతకు సరిపోయేలా ‘అంగీ’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: וּשְׁנֵיהֶם לְבַדָּם בַּשָּׂדֶה
  choice: వారిద్దరూ పొలంలో ఒంటరిగా ఉన్నారు
  rationale: ఇద్దరు మాత్రమే అక్కడ ఉన్నారనే ఉద్ఘాటనను, ‘పొలం’ అనే ప్రాథమిక స్థలార్థాన్ని అదనపు వివరణ లేకుండా నిలుపుతుంది.
theological_decisions:
- issue: וְהוּא (‘అతడు’) ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో ‘అతడు’ అనే అస్పష్ట సర్వనామాన్ని నిలుపడం
  alternative: ‘అహీయా’ అని పేరును పునరుక్తి చేసి సూచనను నిర్ణయించడం
  rationale: హెబ్రూ వ్యాకరణంలో సమీప కర్త అహీయా అయినప్పటికీ, సర్వనామం యెరోబామును సూచిస్తుందని చదివే అవకాశం పూర్తిగా తొలగిపోదు. అందువల్ల పాఠం స్వయంగా నిర్ణయించని విషయాన్ని అనువాదం నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. అతిగా గ్రాంథికమైన పదాలను నివారించి, పేర్లు మరియు ప్రదేశనామాలకు తెలుగు బైబిలు వాడుకలో పరిచితమైన రూపాలు ఉపయోగించబడ్డాయి.
