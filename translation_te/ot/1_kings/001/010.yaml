source:
  edition: WLC
  text: וְֽ/אֶת נָתָן֩ הַ/נָּבִ֨יא וּ/בְנָיָ֜הוּ וְ/אֶת הַ/גִּבּוֹרִ֛ים וְ/אֶת שְׁלֹמֹ֥ה אָחִ֖י/ו לֹ֥א קָרָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/010.yaml
  text: But he did not invite Nathan the prophet[a], Benaiah, the mighty men, or Solomon his brother.
translation:
  language: te
  text: అయితే ప్రవక్త నాతానును,[a] బెనాయాను, పరాక్రమశాలులను, తన సహోదరుడైన సొలొమోనును అతడు ఆహ్వానించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రవక్త నాతానును, బెనాయాను, పరాక్రమశాలులను, తన సహోదరుడైన సొలొమోనును అతడు పిలవలేదు.” హీబ్రూ క్రియకు అక్షరార్థం “పిలుచు”; ఇక్కడ అది అదోనీయా విందుకు ఆహ్వానించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: అయితే …ను
  rationale: సంధి మునుపటి వచనంలోని ఆహ్వానితులకూ ఇక్కడ విడిచిపెట్టబడినవారికీ మధ్య ఉన్న వ్యత్యాసాన్ని సూచిస్తుంది; אֶת ప్రత్యక్ష కర్మ సూచికను తెలుగులో ‘ను’ విభక్తితో వ్యక్తం చేశాం.
- source_word: נָתָן הַנָּבִיא
  choice: ప్రవక్త నాతాను
  rationale: బిరుదును సహజమైన తెలుగు క్రమంలో పేరుకు ముందు ఉంచి, వ్యక్తినామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וּבְנָיָהוּ
  choice: బెనాయా
  rationale: వ్యక్తినామాన్ని హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం; ఉపసర్గ సంధి జాబితా నిర్మాణంలో ఇమిడిపోయింది.
- source_word: הַגִּבּוֹרִים
  choice: పరాక్రమశాలులు
  rationale: ఈ రాజసైనిక సందర్భంలో పదం శౌర్యవంతులైన ప్రముఖ యోధులను సూచిస్తుంది; ‘పరాక్రమశాలులు’ గౌరవప్రదంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: שְׁלֹמֹה אָחִיו
  choice: తన సహోదరుడైన సొలొమోను
  rationale: సందర్భంలో సర్వనామం అదోనీయాను సూచిస్తుంది. తెలుగు సహజత్వం కోసం బంధుత్వాన్ని పేరుకు ముందు ఉంచినా మూలంలోని సంబంధాన్ని స్పష్టంగా నిలిపాం.
- source_word: לֹא קָרָא
  choice: ఆహ్వానించలేదు
  rationale: קרא ప్రాథమికంగా ‘పిలుచు’ అయినా, విందు సందర్భంలో ఇక్కడ ఉద్దేశించిన చర్య ‘ఆహ్వానించు’; ప్రధాన పాఠ్యంలో సందర్భోచిత అర్థాన్ని ఇచ్చి, అక్షరార్థాన్ని పాదటిప్పణిలో నిలిపాం.
