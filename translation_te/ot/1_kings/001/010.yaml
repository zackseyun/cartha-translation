translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. జాబితా నిర్మాణాన్ని నిలిపి, చివరలో కర్తను ఉంచడం ద్వారా హీబ్రూ వాక్యంలోని నిరాకరణాత్మక ముగింపును సాధ్యమైనంతవరకు ప్రతిబింబించాం.
