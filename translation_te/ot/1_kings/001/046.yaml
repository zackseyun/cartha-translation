  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: అంతేకాదు
  rationale: ముందటి సమాచారానికి మరో ముఖ్యమైన విషయాన్ని జోడించే సంధానార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יָשַׁב
  choice: కూర్చున్నాడు
  rationale: హీబ్రూ సంపూర్ణ క్రియ యొక్క సందర్భానుసారమైన పూర్తయిన చర్యను సూటిగా తెలియజేస్తుంది; రాజుగా ఆసీనుడయ్యాడనే భావాన్ని పాఠకుడు సందర్భం ద్వారా గ్రహించగలడు.
- source_word: כִּסֵּא הַמְּלוּכָה
  choice: రాజసింహాసనం
  rationale: అక్షరార్థంగా ‘రాజ్యాధికారపు సింహాసనం’; తెలుగులో ‘రాజసింహాసనం’ అదే భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
