  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְבַקְשׁוּ֙ נַעֲרָ֣ה יָפָ֔ה בְּ/כֹ֖ל גְּב֣וּל יִשְׂרָאֵ֑ל וַֽ/יִּמְצְא֗וּ אֶת אֲבִישַׁג֙ הַ/שּׁ֣וּנַמִּ֔ית וַ/יָּבִ֥אוּ אֹתָ֖/הּ לַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/003.yaml
  text: So they searched throughout all the territory of Israel for a beautiful young woman[b][a], and they found Abishag the Shunammite and brought her to the king.
translation:
  language: te
  text: కాబట్టి వారు ఇశ్రాయేలు ప్రాంతమంతటా అందమైన ఒక యువతి కోసం వెదికారు. షూనేమీయురాలైన[a] అబీషగును కనుగొని, ఆమెను రాజు దగ్గరికి తీసుకొచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, షూనేము పట్టణానికి చెందిన స్త్రీ.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבַקְשׁוּ
  choice: వారు ... వెదికారు
  rationale: בקשׁ ఇక్కడ ఉద్దేశపూర్వకంగా వెదకడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వెదికారు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: נַעֲרָה יָפָה
  choice: అందమైన ఒక యువతి
  rationale: נַעֲרָה వివాహయోగ్య వయసులోని యువ స్త్రీని సూచించగలదు; ‘యువతి’ అనేది ‘బాలిక’ కంటే సందర్భోచితమైనది. יָפָהను నేరుగా ‘అందమైన’గా అనువదించాం.
- source_word: בְּכֹל גְּבוּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రాంతమంతటా
  rationale: גְּבוּל ఇక్కడ సరిహద్దు రేఖలను మాత్రమే కాక దేశ విస్తీర్ణాన్ని సూచిస్తుంది; ‘ప్రాంతమంతటా’ మొత్తం దేశంలో జరిగిన వెదుకులాటను సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּמְצְאוּ
  choice: కనుగొని
  rationale: מצא అనే సాధారణ కథన క్రియకు ‘కనుగొన్నారు’ భావం ఉంది; తరువాతి క్రియతో తెలుగు కథన ప్రవాహం కోసం ‘కనుగొని’గా అనుసంధానించాం.
- source_word: אֲבִישַׁג הַשּׁוּנַמִּית
  choice: షూనేమీయురాలైన అబీషగు
  rationale: వ్యక్తి పేరును ‘అబీషగు’గా లిప్యంతరీకరించాం. הַשּׁוּנַמִּית అనేది షూనేము పట్టణానికి చెందిన స్త్రీని సూచించే జాతివాచకం; తెలుగులో ‘షూనేమీయురాలు’గా సహజంగా వ్యక్తమవుతుంది.
- source_word: וַיָּבִאוּ אֹתָהּ לַמֶּלֶךְ
  choice: ఆమెను రాజు దగ్గరికి తీసుకొచ్చారు
  rationale: హిఫీల్ రూపంలోని בוא ఇక్కడ ‘తీసుకురావడం’ను సూచిస్తుంది; לַמֶּלֶךְ గమ్యాన్ని తెలియజేస్తుంది. ‘రాజు దగ్గరికి’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
