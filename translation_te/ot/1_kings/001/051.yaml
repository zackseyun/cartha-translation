id: 1KI.1.51
reference: 1 Kings 1:51
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֻּגַּ֤ד לִ/שְׁלֹמֹה֙ לֵ/אמֹ֔ר הִנֵּה֙ אֲדֹ֣נִיָּ֔הוּ יָרֵ֖א אֶת הַ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה וְ֠/הִנֵּה אָחַ֞ז בְּ/קַרְנ֤וֹת הַ/מִּזְבֵּ֨חַ֙ לֵ/אמֹ֔ר יִשָּֽׁבַֽע לִ֤/י כַ/יּוֹם֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה אִם יָמִ֥ית אֶת עַבְדּ֖/וֹ בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/051.yaml
  text: And it was reported to Solomon, saying, “Look, Adonijah fears King Solomon, and look, he has taken hold of the horns of the altar, saying, ‘Let King Solomon swear to me today that he will not put his servant to death with the sword.’”
translation:
  language: te
  text: 'సొలొమోనుకు ఇలా తెలియజేయబడింది: “ఇదిగో, అదోనీయా రాజైన సొలొమోనుకు భయపడుతున్నాడు. ఇదిగో, అతడు బలిపీఠపు కొమ్ములను పట్టుకొని, ‘రాజైన సొలొమోను ఈ రోజే నాకు ప్రమాణం చేయాలి: తన సేవకుడైన నన్ను కత్తితో చంపనని’ అంటున్నాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: తెలియజేయబడింది
  rationale: హీబ్రూ నిష్క్రియ రూపాన్ని నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వార్త తెలియజేయబడిన భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: వార్తలోని తక్షణతను, శ్రద్ధాకర్షణను నిలుపుతుంది; మూలంలోని రెండుసార్ల వినియోగాన్ని అనుసరించి రెండుసార్లు ఉంచబడింది.
- source_word: יָרֵא אֶת
  choice: భయపడుతున్నాడు
  rationale: ఈ సందర్భంలో యָרֵא రాజభక్తికన్నా సొలొమోను నుంచి తనకు కలిగే ప్రమాదం పట్ల అదోనీయా భయాన్ని సూచిస్తుంది.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: బలిపీఠపు కొమ్ములు
  rationale: బలిపీఠం మూలల వద్ద ఉన్న కొమ్ములవంటి పొడవులను సూచించే స్పష్టమైన, సాంప్రదాయిక పదబంధం.
- source_word: יִשָּׁבַע לִי כַיּוֹם
  choice: ఈ రోజే నాకు ప్రమాణం చేయాలి
  rationale: విన్నపంలోని అత్యవసరతను తెలియజేస్తూ, ‘నాకు’ మరియు ‘ఈ రోజు’ అనే మూలాంశాలను నిలుపుతుంది.
- source_word: אִם יָמִית אֶת עַבְדּוֹ בֶּחָרֶב
  choice: తన సేవకుణ్ణి కత్తితో చంపనని
  rationale: హీబ్రూ ప్రమాణ వాక్యంలోని אִם ప్రతికూల ఉద్దేశాన్ని తెలుగులో సహజమైన ‘చంపనని’ రూపంలో తెలియజేస్తుంది; ‘తన సేవకుడు’ అనేది అదోనీయా స్వీయ-నమ్ర సంబోధనను నిలుపుతుంది.
theological_decisions:
- issue: బలిపీఠపు కొమ్ములను పట్టుకోవడం యొక్క భావం
  choice: చర్యను వ్యాఖ్యానం లేకుండా యథాతథంగా అనువదించడం
  alternative: దీనిని నేరుగా ‘ఆశ్రయం కోరాడు’ అని వివరణాత్మకంగా అనువదించడం
  rationale: వచనం చర్యను మాత్రమే చెబుతుంది; దాని న్యాయపరమైన లేదా ఆచారపరమైన ప్రభావాన్ని అనువాదంలో నిర్ణయించకుండా మూలంలోని కథన ఉద్వేగాన్ని నిలుపుతుంది.
- issue: ‘తన సేవకుడు’ అనే స్వీయసూచన
  choice: తన సేవకుణ్ణి
  alternative: నన్ను
  rationale: అదోనీయా తనను రాజుకు లోబడిన సేవకునిగా పేర్కొనే రాజకీయ-వినయపూర్వక భాషను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘ఇదిగో’ అనే పదాన్ని మూలంలోని రెండు הִנֵּה రూపాలకు అనుగుణంగా పునరావృతం చేసి వాక్యంలోని ఆందోళన, తక్షణత నిలుపబడింది. ఉల్లేఖనాల స్థరాలు స్పష్టంగా అమర్చబడ్డాయి.
