revisions:
- from: 'సొలొమోనుకు ఇలా తెలియజేయబడింది: “ఇదిగో, అదోనీయా రాజైన సొలొమోనుకు భయపడుతున్నాడు. ఇదిగో, అతడు బలిపీఠపు కొమ్ములను పట్టుకొని, ‘రాజైన సొలొమోను తన సేవకుణ్ణి కత్తితో చంపనని ఈ రోజే నాకు ప్రమాణం చేయాలి’ అంటున్నాడు.”'
  to: 'సొలొమోనుకు ఇలా తెలియజేయబడింది: “ఇదిగో, అదోనీయా రాజైన సొలొమోనుకు భయపడుతున్నాడు. ఇదిగో, అతడు బలిపీఠపు కొమ్ములను పట్టుకొని, ‘రాజైన సొలొమోను ఈ రోజే నాకు ప్రమాణం చేయాలి: తన సేవకుడైన నన్ను కత్తితో చంపనని’ అంటున్నాడు.”'
