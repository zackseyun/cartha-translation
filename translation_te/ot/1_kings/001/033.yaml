id: 1KI.1.33
reference: 1 Kings 1:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ לָ/הֶ֗ם קְח֤וּ עִמָּ/כֶם֙ אֶת עַבְדֵ֣י אֲדֹנֵי/כֶ֔ם וְ/הִרְכַּבְתֶּם֙ אֶת שְׁלֹמֹ֣ה בְנִ֔/י עַל הַ/פִּרְדָּ֖ה אֲשֶׁר לִ֑/י וְ/הוֹרַדְתֶּ֥ם אֹת֖/וֹ אֶל גִּחֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/033.yaml
  text: And the king said to them[a], “Take with you the servants of your lord, and have my son Solomon ride on the mule that is mine, and bring him down to Gihon.”
translation:
  language: te
  text: 'అప్పుడు రాజు వారితో ఇలా అన్నాడు: “మీ ప్రభువు సేవకులను మీ వెంట తీసుకొని, నా కుమారుడైన సొలొమోనును నాకు చెందిన కంచరగాడిద మీద ఎక్కించి[a], అతణ్ణి గీహోనుకు కిందికి తీసుకువెళ్లండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా కుమారుడైన సొలొమోను నాకు చెందిన కంచరగాడిద మీద స్వారీ చేసేలా చేయండి.” హెబ్రీ క్రియ కారణార్థక రూపంలో ఉంది; సేవకులు సొలొమోనును దానిమీద ఎక్కించాలనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: సేవకులను
  rationale: రాజాస్థాన సందర్భంలో ఈ పదం రాజు అధీనంలోని పరిచారకులు లేదా అధికారులను సూచిస్తుంది; బానిసత్వ స్థితిని అనవసరంగా నిర్దేశించకుండా ‘సేవకులు’ సహజంగా ఉంది.
- source_word: אֲדֹנֵיכֶם
  choice: మీ ప్రభువు
  rationale: రాజు తనను తాను గౌరవార్థకంగా మూడవ పురుషలో సూచిస్తున్న రాజాస్థాన ప్రయోగాన్ని ఇది నిలుపుతుంది.
- source_word: וְהִרְכַּבְתֶּם
  choice: ఎక్కించి
  rationale: 'హెబ్రీ హిఫీల్ రూపంలోని కారణార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది: వారు సొలొమోనును గాడిద మీద ఎక్కించాలి.'
- source_word: הַפִּרְדָּה
  choice: కంచరగాడిద
  rationale: פִּרְדָּה అంటే mule; దాని వ్యాకరణ లింగాన్ని తెలుగులో ప్రత్యేకంగా చెప్పాల్సిన సందర్భం లేదు.
- source_word: אֲשֶׁר לִי
  choice: నాకు చెందిన
  rationale: ఆ కంచరగాడిద ప్రత్యేకంగా రాజుకు చెందినదనే సంబంధ వాక్యపు నొక్కింపును నిలుపుతుంది; ఇది రాజాధికార సూచనగా కూడా సందర్భంలో ప్రాముఖ్యమైనది.
- source_word: וְהוֹרַדְתֶּם
  choice: దిగువకు తీసుకువెళ్లండి
  rationale: హిఫీల్ రూపంలోని ‘దిగేలా చేయడం’ అనే అర్థాన్నీ, గీహోనుకు వెళ్లే భౌగోళిక దిగువ దిశనూ నిలుపుతుంది.
- source_word: גִּחוֹן
  choice: గీహోను
  rationale: స్థలనామాన్ని అనువదించకుండా ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בְנִי
  choice: నా కుమారుడైన
  rationale: రాజుతో సొలొమోనుకు ఉన్న స్పష్టమైన పుత్ర సంబంధాన్ని నిలుపుతుంది.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: అప్పుడు రాజు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపే భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘అప్పుడు’ వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజాస్థాన సందర్భానికి తగిన గౌరవభరితమైన శైలిని ఉపయోగించాం. ఆజ్ఞల బహువచన భావాన్ని నిలుపుతూ, హెబ్రీ వాక్యంలోని రాజు తనను ‘మీ ప్రభువు’గా పేర్కొనే మూడవ పురుష ప్రయోగాన్ని మార్చలేదు.
