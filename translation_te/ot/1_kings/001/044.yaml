translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవదగిన కథన శైలి. జాబితాలోని బిరుదులు, వంశసూచన స్పష్టంగా ఉండేలా తెలుగు వాక్యక్రమం ఉపయోగించబడింది.
