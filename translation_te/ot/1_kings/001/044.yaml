source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח אִתּֽ/וֹ הַ֠/מֶּלֶךְ אֶת צָד֨וֹק הַ/כֹּהֵ֜ן וְ/אֶת נָתָ֣ן הַ/נָּבִ֗יא וּ/בְנָיָ֨הוּ֙ בֶּן יְה֣וֹיָדָ֔ע וְ/הַ/כְּרֵתִ֖י וְ/הַ/פְּלֵתִ֑י וַ/יַּרְכִּ֣בוּ אֹת֔/וֹ עַ֖ל פִּרְדַּ֥ת הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/044.yaml
  text: And the king sent with him Zadok the priest[a], Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and the Pelethites; and they mounted him on the king’s mule.
translation:
  language: te
  text: రాజు అతనితోపాటు యాజకుడైన సాదోకును, ప్రవక్తయైన నాతానును, యెహోయాదా కుమారుడు బెనాయాను, కెరేతీయులను, పెలేతీయులను పంపించాడు. వారు అతనిని రాజు కంచరగాడిదపై[a] ఎక్కించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం ‘ఆడ కంచరగాడిద’ను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אִתּוֹ הַמֶּלֶךְ
  choice: రాజు అతనితోపాటు ... పంపించాడు
  rationale: హీబ్రూ కథన భూతకాలాన్ని సహజమైన ఆధునిక తెలుగు వాక్యక్రమంలో ఇచ్చి, אִתּוֹ లోని సహచర్య భావాన్ని ‘అతనితోపాటు’గా నిలిపాం.
- source_word: צָדוֹק הַכֹּהֵן
  choice: యాజకుడైన సాదోకు
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించి, హీబ్రూ పదవిని సహజమైన తెలుగు విశేషణ నిర్మాణంలో అనువదించాం.
- source_word: נָתָן הַנָּבִיא
  choice: ప్రవక్తయైన నాతాను
  rationale: పేరును లిప్యంతరీకరించి, נָבִיא ను సాధారణంగా అర్థమయ్యే ‘ప్రవక్త’గా అనువదించాం.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: యెహోయాదా కుమారుడు బెనాయా
  rationale: హీబ్రూ వంశసూచక నిర్మాణాన్ని సహజమైన తెలుగు క్రమంలో ఇచ్చాం.
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: కెరేతీయులను, పెలేతీయులను
  rationale: ఇవి గుంపుల పేర్లు కాబట్టి వ్యాఖ్యానాత్మక అర్థాన్ని రుద్దకుండా లిప్యంతరీకరించాం; హీబ్రూలో ఏకవచన సమూహనామాలుగా ఉన్నా తెలుగులో సహజంగా బహువచనం వాడాం.
- source_word: וַיַּרְכִּבוּ אֹתוֹ
  choice: వారు అతనిని ... ఎక్కించారు
  rationale: רכב హిఫీల్ రూపంలోని కారణార్థాన్ని ‘ఎక్కించారు’ స్పష్టంగా నిలుపుతుంది.
- source_word: עַל פִּרְדַּת הַמֶּלֶךְ
  choice: రాజు కంచరగాడిదపై
  rationale: స్వామ్య సంబంధాన్ని సంక్షిప్తంగా నిలిపి, פִּרְדָּה కు సాధారణ ఆధునిక తెలుగు పదమైన ‘కంచరగాడిద’ను వాడాం; దాని స్త్రీలింగ ప్రత్యేకతను పాదసూచికలో తెలిపాం.
