source:
  edition: WLC
  text: וְ/אַתָּה֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ עֵינֵ֥י כָל יִשְׂרָאֵ֖ל עָלֶ֑י/ךָ לְ/הַגִּ֣יד לָ/הֶ֔ם מִ֗י יֵשֵׁ֛ב עַל כִּסֵּ֥א אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ אַחֲרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/020.yaml
  text: And you[a], my lord the king, the eyes of all Israel are on you[b], to tell them who will sit on the throne of my lord the king after him.
translation:
  language: te
  text: అయితే నా ప్రభువైన రాజా, నా ప్రభువైన రాజు సింహాసనంపై ఆయన తరువాత ఎవరు కూర్చుంటారో వారికీ తెలియజేయడానికి ఇశ్రాయేలీయులందరి కళ్లూ మీ వైపే ఉన్నాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజా / నా ప్రభువైన రాజు
  rationale: మొదటి సందర్భంలో ఇది రాజును నేరుగా సంబోధించే గౌరవపూర్వక పదబంధం కాబట్టి ‘రాజా’ అని, సింహాసనాన్ని సూచించే రెండో సందర్భంలో వాక్య నిర్మాణానికి తగినట్లు ‘రాజు’ అని అనువదించాం. ‘నా ప్రభువు’ అనే విధేయతాభావాన్ని కూడా నిలిపాం.
- source_word: עֵינֵי כָל יִשְׂרָאֵל עָלֶיךָ
  choice: ఇశ్రాయేలీయులందరి కళ్లూ మీ మీదే ఉన్నాయి
  rationale: మూలంలోని ‘కళ్లు ... మీద ఉన్నాయి’ అనే సజీవ రూపకాన్ని నిలుపుతూ, రాజు నిర్ణయం కోసం ప్రజలంతా ఎదురుచూస్తున్నారనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְהַגִּיד לָהֶם
  choice: తమకు తెలియజేయాలని
  rationale: హిఫీల్ రూపంలోని ‘తెలియజేయడం/ప్రకటించడం’ అనే కారణార్థక భావాన్ని సందర్భానికి తగిన సాధారణ తెలుగులో అందిస్తుంది.
- source_word: מִי יֵשֵׁב
  choice: ఎవరు కూర్చుంటారో
  rationale: సింహాసన సందర్భంలో ישב రాజ్య వారసునిగా సింహాసనాసీనుడు కావడాన్ని సూచిస్తుంది; మూలంలోని ‘కూర్చోవడం’ రూపాన్ని సహజంగా నిలిపాం.
- source_word: עַל כִּסֵּא
  choice: సింహాసనం మీద
  rationale: כִּסֵּא కు ప్రత్యక్షమైన అర్థం ‘సింహాసనం’; עַל ను సహజంగా ‘మీద’ అని అనువదించాం.
- source_word: אַחֲרָיו
  choice: ఆయన ... తరువాత
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయాన్ని సాధారణ కాలసూచకంగా మార్చకుండా, దావీదును సూచించే వ్యక్తిగత సర్వనామంగా నిలిపాం; గౌరవార్థక తెలుగులో ‘ఆయన’ వాడాం.
theological_decisions:
- issue: אַחֲרָיו లోని సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: ‘ఆయన తరువాత’—అంటే ప్రస్తుతం సంబోధించబడుతున్న రాజైన దావీదు తరువాత
  alternative: ‘ఆ తరువాత’ లేదా కేవలం ‘తరువాత’
  rationale: హీబ్రూ రూపంలో మూడవ పురుష పుంలింగ ఏకవచన ప్రత్యయం స్పష్టంగా ఉంది. సందర్భంలో రాజ్య వారసత్వమే అంశం కనుక అది దావీదును సూచిస్తుంది; అయినా వివరణను ప్రధాన వాక్యంలో చేర్చకుండా మూలంలోని సర్వనామ రూపాన్నే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవపూర్వక రాజసభా శైలిని ఉపయోగించాం. వాక్యం సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచుతూ, మూలంలోని ‘అందరి కళ్లూ మీ మీదే ఉన్నాయి’ అనే రూపకాన్నీ, రెండవ పురుష సంబోధన నుంచి మూడవ పురుష సూచనకు మారే నిర్మాణాన్నీ సాధ్యమైనంతవరకు కాపాడాం.
