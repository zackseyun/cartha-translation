id: 1KI.1.4
reference: 1 Kings 1:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַֽ/נַּעֲרָ֖ה יָפָ֣ה עַד מְאֹ֑ד וַ/תְּהִ֨י לַ/מֶּ֤לֶךְ סֹכֶ֨נֶת֙ וַ/תְּשָׁ֣רְתֵ֔/הוּ וְ/הַ/מֶּ֖לֶךְ לֹ֥א יְדָעָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/004.yaml
  text: The young woman was very beautiful[a], and she became the king’s attendant and served him, but the king did not know her.
translation:
  language: te
  text: ఆ యువతి ఎంతో అందంగా ఉండేది. ఆమె రాజుకు పరిచారికగా మారి అతనికి సేవ చేసింది; అయితే రాజు ఆమెను ఎరుగలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ‘ఆమెతో లైంగిక సంబంధం పెట్టుకోలేదు.’ ఇక్కడ హీబ్రూ భాషలోని ‘ఎరుగుట’ అనే మాట లైంగిక సంబంధానికి సభ్యోక్తిగా వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: ఆ యువతి
  rationale: నַעֲרָה యౌవనస్థురాలైన స్త్రీని సూచిస్తుంది. ‘యువతి’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, ‘బాలిక’కున్న అతి చిన్న వయస్సు భావాన్నీ, ప్రాచీన శైలినీ నివారిస్తుంది.
- source_word: יָפָה עַד מְאֹד
  choice: ఎంతో అందంగా ఉండేది
  rationale: ఈ పదబంధం ఆమె అందాన్ని బలంగా ఉద్ఘాటిస్తుంది. ‘ఎంతో అందంగా’ సహజమైన తెలుగులో ఆ తీవ్రతను నిలుపుతుంది.
- source_word: סֹכֶנֶת
  choice: పరిచారికగా
  rationale: రాజుకు తోడుగా ఉండి అవసరాలు చూసే సేవా పాత్రను ఈ సందర్భంలో సూచిస్తుంది. ‘పరిచారిక’ వైద్యసేవను లేదా శృంగార సంబంధాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: וַתְּשָׁרְתֵהוּ
  choice: అతనికి సేవ చేసింది
  rationale: שרת ఇక్కడ వ్యక్తిగతంగా సేవ చేయడాన్ని సూచిస్తుంది. ఈ అనువాదం స్పష్టంగా, సహజంగా ఉండి మతపరమైన ప్రత్యేకార్థాన్ని చేర్చదు.
- source_word: יְדָעָהּ
  choice: ఆమెను ఎరుగలేదు
  rationale: ידע ఇక్కడ లైంగిక సంబంధానికి సభ్యోక్తిగా వాడబడింది. ‘ఎరుగలేదు’ మూలంలోని ‘తెలుసుకోవడం’ అనే రూపకాన్ని నిలుపుతుంది; ఉద్దేశించిన లైంగిక భావాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
theological_decisions:
- issue: కథనంలో లైంగిక సంబంధాన్ని తెలిపే సభ్యోక్తి
  choice: ప్రధాన పాఠ్యంలో ‘ఆమెను ఎరుగలేదు’ అనే మూలభాషా సభ్యోక్తిని ఉంచి, పాదసూచికలో దాని భావాన్ని వివరించడం.
  alternative: ‘ఆమెతో లైంగిక సంబంధం పెట్టుకోలేదు’ లేదా ‘ఆమెతో శయనించలేదు.’
  rationale: ఇది హీబ్రూ పాఠ్యంలోని సాహిత్య రూపాన్ని, దాని ఉద్దేశపూర్వక సభ్యోక్తిని కాపాడుతూ, దావీదు అబీషగుతో లైంగికంగా కలవలేదనే కథనార్థాన్ని పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని వరుస క్రియలను తెలుగులో సులభంగా చదవదగిన రెండు వాక్యాలుగా అమర్చాం; ‘అయితే’ ద్వారా చివరి విరుద్ధ భావాన్ని నిలిపాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘ఎరుగలేదు’ తరువాత ఉంచాం.
