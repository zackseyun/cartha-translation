source:
  edition: WLC
  text: וּ/מָשַׁ֣ח אֹת֣/וֹ שָׁ֠ם צָד֨וֹק הַ/כֹּהֵ֜ן וְ/נָתָ֧ן הַ/נָּבִ֛יא לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וּ/תְקַעְתֶּם֙ בַּ/שּׁוֹפָ֔ר וַ/אֲמַרְתֶּ֕ם יְחִ֖י הַ/מֶּ֥לֶךְ שְׁלֹמֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/034.yaml
  text: There Zadok the priest and Nathan the prophet shall anoint him king over Israel[a], and you shall blow the trumpet and say, ‘Long live King Solomon!’
translation:
  language: te
  text: అక్కడ యాజకుడైన సాదోకు, ప్రవక్తయైన నాతాను అతన్ని ఇశ్రాయేలుమీద రాజుగా అభిషేకించాలి. తరువాత మీరు కొమ్ముబూరను[a] ఊది, ‘సొలొమోను రాజు చిరకాలం జీవించుగాక!’ అని చెప్పాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: షోఫార్—బహిరంగ సంకేతం లేదా ప్రకటన కోసం ఉపయోగించే కొమ్ముబూర; సంప్రదాయ అనువాదాల్లో ‘బూర’ అని కూడా అనువదిస్తారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁח
  choice: అభిషేకించాలి
  rationale: ఈ ఆదేశాల వరుసలో సంయోజకాక్షరంతో వచ్చిన Qal perfect ఆజ్ఞార్థక భావాన్ని కలిగిస్తుంది. ఆధునిక తెలుగులో ‘అభిషేకించాలి’ ఆ నిర్దేశాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שָׁם
  choice: అక్కడ
  rationale: ఇది ముందుగా పేర్కొన్న ప్రదేశాన్ని సూచించే స్థానవాచక క్రియావిశేషణం.
- source_word: צָדוֹק הַכֹּהֵן
  choice: యాజకుడైన సాదోకు
  rationale: పేరును తెలుగు లిపిలో ధ్వన్యంతరీకరించి, כֹּהֵן‌ను సాధారణంగా అర్థమయ్యే ‘యాజకుడు’గా అనువదించాం.
- source_word: וְנָתָן הַנָּבִיא
  choice: ప్రవక్తయైన నాతాను
  rationale: రెండవ అభిషేకకర్తను మొదటివారితో సమన్వయపరుస్తుంది; נָבִיאకు స్థిరమైన తెలుగు పదం ‘ప్రవక్త’.
- source_word: לְמֶלֶךְ
  choice: రాజుగా
  rationale: లామెద్ ఇక్కడ అభిషేకం ఫలితంగా లభించే పదవిని సూచిస్తుంది; ‘రాజుగా’ ఆ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుమీద
  rationale: రాజపదవితో వాడిన עַל ప్రజలమీద పరిపాలనా అధికారాన్ని సూచిస్తుంది.
- source_word: וּתְקַעְתֶּם בַּשּׁוֹפָר
  choice: మీరు కొమ్ముబూరను ఊది
  rationale: שׁוֹפָר సాధారణ లోహపు బాకా కాక, సంకేతం లేదా బహిరంగ ప్రకటన కోసం ఉపయోగించే కొమ్ముతో చేసిన బూర. ‘కొమ్ముబూర’ మూలపదార్థాన్ని సహజ తెలుగులో కాపాడుతుంది.
- source_word: וַאֲמַרְתֶּם
  choice: అని చెప్పాలి
  rationale: ద్వితీయ పురుష బహువచన ఆదేశాల వరుసను కొనసాగిస్తుంది; తెలుగు వాక్య నిర్మాణంలో ఉద్ధరణ తర్వాత ‘అని చెప్పాలి’ సహజంగా ఉంటుంది.
- source_word: יְחִי
  choice: చిరకాలం జీవించాలి
  rationale: חיה యొక్క జస్సివ్ రూపం ఇక్కడ రాజును స్తుతిస్తూ పలికే ఆకాంక్షాత్మక నినాదం. ‘చిరకాలం జీవించాలి’ ఆ భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో అందిస్తుంది.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: సొలొమోను రాజు
  rationale: రాజును ఉద్దేశించిన నినాదంలో పేరు-బిరుదు కలయికను సహజ తెలుగు క్రమంలో ఇచ్చాం.
