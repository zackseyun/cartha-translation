translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ రాజసభ సందర్భానికి తగిన గౌరవపూర్వక శైలిని ఉపయోగించాం. వరుసగా ఉన్న రెండు శారీరక గౌరవచర్యలను ‘వంగి’ మరియు ‘సాష్టాంగ నమస్కారం చేసింది’ అని వేరు చేసి చూపించాం. మూలంలోని నుడికారానికి సంబంధించిన పాదసూచిక గుర్తును అది అనువదించబడిన ప్రశ్న దగ్గర ఉంచాం.
