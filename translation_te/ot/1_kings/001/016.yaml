  edition: WLC
  text: וַ/תִּקֹּ֣ד בַּת שֶׁ֔בַע וַ/תִּשְׁתַּ֖חוּ לַ/מֶּ֑לֶךְ וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ מַה לָּֽ/ךְ־־׃
base_translation:
