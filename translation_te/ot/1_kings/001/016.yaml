  yaml_path: translation/ot/1_kings/001/016.yaml
  text: Bathsheba bowed down and prostrated herself before the king[a], and the king said, “What do you want?”
translation:
  language: te
  text: బత్షెబా వంగి, రాజు ఎదుట సాష్టాంగ నమస్కారం చేసింది. అప్పుడు రాజు, “నీకు ఏమి కావాలి?[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “నీకు ఏమి?” ఇది సందర్భానుసారంగా “నీకు ఏమి కావాలి?” లేదా “నిన్ను బాధిస్తున్నది ఏమిటి?” అనే అర్థాన్నిచ్చే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקֹּד
  choice: వంగి
  rationale: קָדַד శరీరాన్ని వంచి వినయాన్ని చూపే చర్యను సూచిస్తుంది. మోకరించిందని అనవసరంగా నిర్దిష్టం చేయకుండా, తరువాతి మరింత గాఢమైన నమస్కార చర్యతో భేదాన్ని నిలుపుతుంది.
- source_word: בַּת שֶׁבַע
  choice: బత్షెబ
  rationale: హెబ్రీ వ్యక్తినామాన్ని తెలుగులో సుపరిచితమైన బైబిలు రూపంలో లిప్యంతరీకరించాం.
- source_word: וַתִּשְׁתַּחוּ
  choice: సాష్టాంగ నమస్కారం చేసింది
  rationale: שׁחה రూపం రాజు ఎదుట లోతుగా వంగి లేదా నేలపై పడి గౌరవం చూపడాన్ని సూచిస్తుంది. ముందున్న సాధారణంగా వంగే చర్యకంటే దీనిలోని తీవ్రతను ఈ ప్రయోగం నిలుపుతుంది.
- source_word: לַמֶּלֶךְ
  choice: రాజు ఎదుట
  rationale: గౌరవపూర్వకంగా నమస్కరించే సందర్భంలో ל సూచించే దిశ లేదా సంబంధాన్ని సహజమైన తెలుగులో ‘ఎదుట’ అని వ్యక్తపరచాం.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: అప్పుడు రాజు … అన్నాడు
  rationale: హెబ్రీ కథన క్రమాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తూ, ‘చెప్పాడు’ అనే మూలార్థాన్ని ప్రశ్నార్థక ప్రత్యక్ష వాక్యంతో కలిపాం.
- source_word: מַה לָּךְ
  choice: నీకు ఏమి కావాలి?
  rationale: అక్షరార్థంగా ‘నీకు ఏమి?’ అనే ఈ హెబ్రీ నుడికారం సందర్భంలో ఆమె అభ్యర్థన లేదా ఆందోళన ఏమిటని మర్యాదగా విచారిస్తుంది. ‘నీకు ఏమి కావాలి?’ ఆధునిక తెలుగులో సహజంగా ఉండి రాజసభ సందర్భానికి సరిపోతుంది.
