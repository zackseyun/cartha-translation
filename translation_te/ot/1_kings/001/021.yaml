    issue: Personal-name form and additive suffix
    rationale: ‘సొలొమోనూ’ can be read as the name plus the additive suffix, but ‘సొలొమోను’ is the clearer standard Telugu form of Solomon. Expressing ‘also’ separately avoids ambiguity while retaining the coordinated emphasis.
