source:
  edition: WLC
  text: וְ/הָיָ֕ה כִּ/שְׁכַ֥ב אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ עִם אֲבֹתָ֑י/ו וְ/הָיִ֗יתִי אֲנִ֛י וּ/בְנִ֥/י שְׁלֹמֹ֖ה חַטָּאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/021.yaml
  text: And when my lord the king lies down with his fathers[a], I and my son Solomon will be counted as offenders.
translation:
  language: te
  text: నా ప్రభువైన రాజు తన పితరులతో నిద్రించినప్పుడు, నేనూ నా కుమారుడైన సొలొమోను కూడా అపరాధులుగా పరిగణించబడతాం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పాపులు.” హీబ్రూ పదం దోషులుగా లేదా శిక్షకు పాత్రులుగా భావించబడేవారిని సూచించగలదు; ఇక్కడ సందర్భం సాధారణ నైతిక వర్ణనకంటే న్యాయ-రాజకీయ హోదాను సూచిస్తోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: పరిగణించబడతాం
  rationale: ఈ నిర్మాణం బత్షెబ ఆందోళనకు కలిగే భవిష్యత్ ఫలితాన్ని పరిచయం చేస్తుంది; తెలుగులో వాక్యాంత భవిష్యత్ క్రియ ద్వారా ఇది సహజంగా వ్యక్తమవుతుంది.
- source_word: כִּשְׁכַב ... עִם אֲבֹתָיו
  choice: తన పితరులతో నిద్రించినప్పుడు
  rationale: మరణాన్ని సూచించే హీబ్రూ నానుడి చిత్రాన్ని నిలుపుతూ, సందర్భంలో అర్థమయ్యే గౌరవప్రదమైన తెలుగు ప్రయోగం.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజు
  rationale: దావీదును ఉద్దేశించిన రాజసభా గౌరవభావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְהָיִיתִי אֲנִי
  choice: నేనూ ... పరిగణించబడతాం
  rationale: సరళంగా ‘అవుతాం’ అనడం కంటే, ఇక్కడ సూచితమైన సామాజిక-న్యాయపరమైన హోదాను ‘పరిగణించబడతాం’ స్పష్టం చేస్తుంది.
- source_word: וּבְנִי שְׁלֹמֹה
  choice: నా కుమారుడు సొలొమోనూ
  rationale: బంధాన్ని, వ్యక్తి పేరును రెండింటినీ సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: חַטָּאִים
  choice: అపరాధులు
  rationale: ఈ రాజ్యవారసత్వ సందర్భంలో శిక్షకు పాత్రులుగా లేదా దోషులుగా చూడబడే న్యాయ-రాజకీయ భావాన్ని తెలియజేస్తుంది; సాధారణ నైతిక వర్ణనకే పరిమితం చేయదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజసభా గౌరవాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. మరణాన్ని సూచించే మూలభాషా నానుడిని ఉద్దేశపూర్వకంగా నిలుపుకుంది.
