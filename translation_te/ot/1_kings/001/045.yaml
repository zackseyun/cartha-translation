translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. మూలంలోని వరుస ఘటనలను రెండు వాక్యాలుగా విభజించి స్పష్టత పెంచినా, భావక్రమాన్ని కాపాడాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచాం.
