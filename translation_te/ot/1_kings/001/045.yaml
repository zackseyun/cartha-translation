base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/045.yaml
  text: And Zadok the priest and Nathan the prophet have anointed him king at Gihon[a], and they have come up from there rejoicing, and the city is in an uproar. That is the sound that you heard.
translation:
  language: te
  text: యాజకుడైన సాదోకు, ప్రవక్తయైన నాతాను గీహోను దగ్గర అతనిని రాజుగా అభిషేకించారు. వారు అక్కడి నుంచి ఆనందిస్తూ పైకి వచ్చారు; పట్టణం కోలాహలంతో మారుమోగింది.[a] మీరు విన్న శబ్దం అదే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పట్టణం కలవరపడింది,” లేక “పట్టణం కోలాహలంతో నిండిపోయింది.” హీబ్రూ క్రియ శబ్దంతో కూడిన కలకలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְשְׁחוּ אֹתוֹ
  choice: అతనిని ... అభిషేకించారు
  rationale: రాజపదవికి నియమించే సందర్భంలో משׁח నూనెతో అభిషేకించడాన్ని సూచిస్తుంది. తెలుగు సందర్భంలో సాధారణ భూతకాలం జరిగిన కార్యాన్నీ దాని ప్రస్తుత ఫలితాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: צָדוֹק הַכֹּהֵן
  choice: యాజకుడైన సాదోకు
  rationale: వ్యక్తి పేరును తెలుగు ధ్వన్యనుసారంగా రాసి, כהן అనే పదాన్ని స్థిరమైన సాధారణ పదమైన ‘యాజకుడు’గా అనువదించాం.
- source_word: נָתָן הַנָּבִיא
  choice: ప్రవక్తయైన నాతాను
  rationale: వ్యక్తి పేరును తెలుగు ధ్వన్యనుసారంగా రాసి, נביא యొక్క సూటి అర్థాన్ని ‘ప్రవక్త’గా ఇచ్చాం.
- source_word: לְמֶלֶךְ
  choice: రాజుగా
  rationale: לְ ఇక్కడ అతడు ఏ పదవికి అభిషేకించబడ్డాడో సూచిస్తుంది; ‘రాజుగా’ సహజమైన, స్పష్టమైన తెలుగు.
- source_word: בְּגִחוֹן
  choice: గీహోను దగ్గర
  rationale: స్థలనామాన్ని ధ్వన్యనుసారంగా ఉంచి, అభిషేకం జరిగిన ప్రదేశాన్ని సహజ తెలుగులో తెలియజేయడానికి ‘దగ్గర’ వాడాం.
- source_word: וַיַּעֲלוּ מִשָּׁם
  choice: వారు అక్కడి నుంచి ... పైకి వచ్చారు
  rationale: עלה లోని ఎక్కి రావడం అనే దిశాభావాన్ని కాపాడుతూ, పట్టణం వైపు వచ్చిన సందర్భాన్ని ‘పైకి వచ్చారు’గా వ్యక్తం చేశాం.
- source_word: שְׂמֵחִים
  choice: ఆనందిస్తూ
  rationale: వారు పైకి వచ్చిన తీరును తెలిపే ఈ రూపానికి ‘ఆనందిస్తూ’ సహజంగా సరిపోతుంది.
- source_word: וַתֵּהֹם הַקִּרְיָה
  choice: పట్టణమంతా కోలాహలంతో మారుమోగింది
  rationale: הום శబ్దభరితమైన కలకలం లేదా కదలికను సూచిస్తుంది. ‘కోలాహలంతో మారుమోగింది’ శబ్దాన్నీ పట్టణవ్యాప్త ఉద్వేగాన్నీ నిలుపుతుంది; ప్రత్యామ్నాయ భావాలను పాదసూచికలో ఇచ్చాం.
- source_word: הוּא הַקּוֹל אֲשֶׁר שְׁמַעְתֶּם
  choice: మీరు విన్న శబ్దం అదే
  rationale: הוּא కు ఇక్కడ నిర్దేశక బలం ఉంది; קול ను విస్తృతమైన ‘శబ్దం’గా అనువదించడం ముందున్న కోలాహలానికి సహజంగా అనుసంధానిస్తుంది.
