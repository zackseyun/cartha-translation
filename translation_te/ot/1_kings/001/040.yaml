id: 1KI.1.40
reference: 1 Kings 1:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעֲל֤וּ כָל הָ/עָם֙ אַֽחֲרָ֔י/ו וְ/הָ/עָם֙ מְחַלְּלִ֣ים בַּ/חֲלִלִ֔ים וּ/שְׂמֵחִ֖ים שִׂמְחָ֣ה גְדוֹלָ֑ה וַ/תִּבָּקַ֥ע הָ/אָ֖רֶץ בְּ/קוֹלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/040.yaml
  text: And all the people went up after him[a], and the people were playing flutes and rejoicing with great joy[b], and the earth split apart at their sound.
translation:
  language: te
  text: ప్రజలందరూ అతని వెనుకగా పైకి వెళ్లారు; ప్రజలు పిల్లనగ్రోవులు వాయిస్తూ[a], గొప్ప ఆనందంతో సంతోషించారు. వారి శబ్దానికి నేల చీలిపోయింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వేణువు వంటి గొట్టపు వాద్యాలు వాయిస్తూ”; హెబ్రీ పదం వేణువు తరహా గాలి వాద్యాలను విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “నేల చీలిపోయింది” అనేది వేడుక శబ్దం ఎంత ప్రబలంగా ఉందో తెలిపే అతిశయోక్తి కావచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: పైకి వెళ్లారు
  rationale: עלה అనే క్రియలోని ‘ఎక్కడం/పైకి వెళ్లడం’ అనే స్థలసంబంధ భావాన్ని సందర్భానికి సహజంగా నిలుపుతుంది.
- source_word: כָל הָעָם
  choice: ప్రజలందరూ
  rationale: సమూహాన్ని సూచించే כָל הָעָםకు సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: אַחֲרָיו
  choice: అతని వెనుకగా
  rationale: ఊరేగింపులో అతనిని అనుసరించారనే భావాన్ని, కేవలం కాలార్థకమైన ‘తర్వాత’ అనే అపార్థం లేకుండా వ్యక్తం చేస్తుంది.
- source_word: מְחַלְּלִים בַּחֲלִלִים
  choice: పిల్లనగ్రోవులు వాయిస్తూ
  rationale: חלילים సూచించే వేణువు తరహా గాలి వాద్యాలకు తెలుగులో సులభంగా అర్థమయ్యే పదాన్ని ఉపయోగించింది; వాద్యపు ఖచ్చిత స్వరూపంపై ఉన్న విస్తృతిని పాదటిప్పణిలో ఉంచింది.
- source_word: וּשְׂמֵחִים שִׂמְחָה גְדוֹלָה
  choice: మహా ఆనందంతో సంతోషిస్తూ
  rationale: సమాన మూలపదాల పునరుక్తితో హెబ్రీ పాఠం ఇచ్చే ఉద్ఘాటనను తెలుగులో సాధ్యమైనంత వరకు నిలుపుతుంది.
- source_word: וַתִּבָּקַע הָאָרֶץ
  choice: నేల చీలిపోయింది
  rationale: בקע యొక్క స్పష్టమైన ‘చీలిపోవడం’ చిత్రాన్ని క్రియాశీల రూపంలో నిలుపుతూ, ఈ సందర్భంలో הָאָרֶץకు సహజమైన ‘నేల’ను ఎంచుకుంది.
- source_word: בְּקוֹלָם
  choice: వారి శబ్దానికి
  rationale: קוֹלలో ప్రజల స్వరాలూ వాద్యధ్వనులూ రెండూ ఇమిడేలా ‘శబ్దం’ను వాడింది; בְּను ఇక్కడ శబ్దంతో అనుసంధానాన్ని తెలిపే సహజ తెలుగు రూపంలో ఇచ్చింది.
