revisions:
- from: ప్రజలందరూ అతని వెనుకగా పైకి వెళ్లారు. ప్రజలు పిల్లనగ్రోవులు వాయిస్తూ[a], మహా ఆనందంతో సంతోషిస్తూ వెళ్లారు. వారి శబ్దానికి నేల చీలిపోయింది[b].
  to: ప్రజలందరూ అతని వెనుకగా పైకి వెళ్లారు; ప్రజలు పిల్లనగ్రోవులు వాయిస్తూ[a], గొప్ప ఆనందంతో సంతోషించారు. వారి శబ్దానికి నేల చీలిపోయింది[b].
  rationale: The revision removes the supplied repeated motion verb and joins the opening clauses to reflect the Hebrew’s coordinated narration. It retains the explicit upward movement, procession behind Solomon, flute-playing, emphatic great rejoicing, and the dramatic imagery of the earth splitting at the celebrants’ sound. Footnote anchors and content are retained.
