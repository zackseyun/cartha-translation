translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హెబ్రీ వాక్యంలోని వరుస క్రియలను చిన్న తెలుగు వాక్యాలుగా విభజించి సహజ ప్రవాహం కల్పించాం; అయితే ‘పైకి వెళ్లారు,’ ఆనందపు ఉద్ఘాటన, నేల చీలిన vivid రూపకం నిలుపబడ్డాయి.
