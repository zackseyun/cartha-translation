source:
  edition: WLC
  text: וְ/לִ֣/י אֲנִֽי עַ֠בְדֶּ/ךָ וּ/לְ/צָדֹ֨ק הַ/כֹּהֵ֜ן וְ/לִ/בְנָיָ֧הוּ בֶן יְהוֹיָדָ֛ע וְ/לִ/שְׁלֹמֹ֥ה עַבְדְּ/ךָ֖ לֹ֥א קָרָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/026.yaml
  text: But me—your servant—and Zadok the priest[a], and Benaiah son of Jehoiada, and Solomon your servant, he did not call.
translation:
  language: te
  text: కానీ నీ సేవకుడనైన నన్నూ, యాజకుడైన సాదోకునూ, యెహోయాదా కుమారుడైన బెనాయానూ, నీ సేవకుడైన సొలొమోనునూ అతడు పిలవలేదు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆహ్వానించలేదు.’ ఇక్కడి హీబ్రూ క్రియకు పిలవడం, రప్పించడం, ఆహ్వానించడం అనే అర్థాలు రావచ్చు; సందర్భంలో అదోనీయా ఏర్పాటు చేసిన బలి విందుకు ‘ఆహ్వానించలేదు’ అనే భావం సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִי אֲנִי עַבְּדֶךָ
  choice: కానీ నీ సేవకుడినైన నన్నూ
  rationale: ముందుగా పిలువబడినవారితో ఉన్న వ్యత్యాసాన్ని ‘కానీ’ తెలియజేస్తుంది; స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను ‘నన్నూ’ నిలుపుతుంది; ‘నీ సేవకుడు’ రాజసభలోని వినయపూర్వక సంబోధనను కాపాడుతుంది.
- source_word: וּלְצָדֹק הַכֹּהֵן
  choice: యాజకుడైన సాదోకునూ
  rationale: నిర్దిష్ట పదవిని సహజమైన తెలుగు సంబంధ నిర్మాణంలో ఇచ్చి, వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: וְלִבְנָיָהוּ בֶן־יְהוֹיָדָע
  choice: యెహోయాదా కుమారుడైన బెనాయానూ
  rationale: హీబ్రూ వంశసూచక నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో అందించింది.
- source_word: וְלִשְׁלֹמֹה עַבְדְּךָ
  choice: నీ సేవకుడైన సొలొమోనునూ
  rationale: సొలొమోను రాజుతో కలిగిన సంబంధాన్ని తెలిపే రాజసభా వినయపదాన్ని పునరుక్తితో సహా నిలిపింది.
- source_word: לֹא קָרָא
  choice: అతడు పిలవలేదు
  rationale: קרא యొక్క ప్రాథమిక విస్తృతార్థమైన ‘పిలుచుట’ను కాపాడుతుంది; సందర్భంలో ఇది విందుకు ఆహ్వానించడాన్ని సూచించగలిగినా, తెలుగు ‘పిలవలేదు’ ఆ అర్థాన్నీ సహజంగా మోయగలదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన రాజసభా శైలిని నిలిపి, ముందుకు తెచ్చిన కర్మల జాబితా వల్ల కలిగే ఉద్ఘాటనను సహజంగా వ్యక్తం చేసింది.
