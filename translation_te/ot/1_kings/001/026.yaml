  source_fidelity: 'The draft accurately represents the emphatic, contrastive list in the Hebrew: Nathan includes himself (''I, your servant''), Zadok the priest, Benaiah son of Jehoiada, and Solomon, and says that Adonijah did not call them. ‘పిలవలేదు’ suitably retains the broad sense of קָרָא while allowing the banquet-context implication of invitation.'
