  terminology: 'The established Telugu biblical forms and titles are suitable: ‘యాజకుడు,’ ‘సాదోకు,’ ‘బెనాయా,’ ‘యెహోయాదా,’ and ‘సొలొమోను.’ The repeated ‘నీ సేవకుడు’ rightly preserves the deferential court idiom. The footnote accurately explains the lexical range without forcing ‘invite’ into the main text.'
