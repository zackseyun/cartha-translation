  text: וַ/עֲלִיתֶ֣ם אַחֲרָ֗י/ו וּ/בָא֙ וְ/יָשַׁ֣ב עַל כִּסְאִ֔/י וְ/ה֥וּא יִמְלֹ֖ךְ תַּחְתָּ֑/י וְ/אֹת֤/וֹ צִוִּ֨יתִי֙ לִֽ/הְי֣וֹת נָגִ֔יד עַל יִשְׂרָאֵ֖ל וְ/עַל יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/035.yaml
  text: Then you shall go up after him[a], and he shall come and sit on my throne, and he shall reign in my place; and I have appointed him to be ruler over Israel and over Judah.
translation:
  language: te
  text: తర్వాత మీరు అతని వెనుకగా పైకి వెళ్లండి. అతడు వచ్చి నా సింహాసనం మీద కూర్చుంటాడు; నా స్థానంలో అతడే రాజ్యమేలుతాడు. ఇశ్రాయేలు మీదా యూదా మీదా పాలకుడిగా ఉండేందుకు అతన్నే నేను నియమించాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలు మీదా యూదా మీదా నాయకుడిగా ఉండమని అతనికి నేను ఆజ్ఞాపించాను.” హీబ్రూ క్రియకు సాధారణంగా “ఆజ్ఞాపించు” అని అర్థం; נָגִיד అనే పదాన్ని “నాయకుడు” లేదా “అధిపతి” అని కూడా అనువదించవచ్చు.
    reason: צִוִּיתִי మరియు נָגִיד పదాలకు సాధ్యమైన అర్థవికల్పాలను నిలుపుటకు.
lexical_decisions:
- source_word: וַעֲלִיתֶם אַחֲרָיו
  choice: మీరు అతని వెనుకగా పైకి రండి
  rationale: עלה అనే క్రియలోని ‘పైకి వెళ్లడం/రావడం’ అనే దిశాభావాన్ని నిలుపుతూ, אַחֲרָיו రాజ ఊరేగింపులో అతని వెనుక అనుసరించడాన్ని సూచించేలా అనువదించబడింది.
- source_word: וּבָא וְיָשַׁב עַל־כִּסְאִי
  choice: అతడు వచ్చి నా సింహాసనం మీద కూర్చుంటాడు
  rationale: בוא యొక్క సాధారణమైన ‘రావడం’ అనే అర్థాన్ని, ישב על כסא లోని సింహాసనారోహణ చిత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וְהוּא יִמְלֹךְ תַּחְתָּי
  choice: నా స్థానంలో అతడే రాజ్యమేలుతాడు
  rationale: תַּחְתָּי ఇక్కడ రాజపదవిలో స్థానభర్తృత్వాన్ని సూచిస్తుంది; ‘నా స్థానంలో’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది. హీబ్రూలోని స్వతంత్ర సర్వనామమైన וְהוּא ఇచ్చే ఉద్ఘాటనను ‘అతడే’ ప్రతిబింబిస్తుంది.
- source_word: צִוִּיתִי
  choice: నేను నియమించాను
  rationale: צוה సాధారణంగా ‘ఆజ్ఞాపించు’ అని అర్థమిచ్చినా, ఈ సందర్భంలో సొలొమోనును అధికార పదవికి నిర్దేశించే కార్యబలాన్ని ‘నియమించాను’ సహజంగా వ్యక్తం చేస్తుంది; మూలపదానికి సాధ్యమైన ‘ఆజ్ఞాపించాను’ అర్థం పాదసూచికలో నిలుపబడింది.
- source_word: לִהְיוֹת נָגִיד
  choice: పాలకుడిగా ఉండేందుకు
  rationale: נָגִיד నాయకుడు, అధిపతి లేదా పాలకుడు అనే భావాలను కలిగి ఉంటుంది. సమీపంలోని מלך (‘రాజ్యమేలు’)తో దీనిని కలిపివేయకుండా ‘పాలకుడు’ అనే ప్రత్యేక పదాన్ని వాడాం.
- source_word: עַל־יִשְׂרָאֵל וְעַל־יְהוּדָה
  choice: ఇశ్రాయేలు మీదా యూదా మీదా
  rationale: రెండుసార్లు వచ్చిన עַל ను తెలుగులో ‘మీదా ... మీదా’ అని ప్రతిబింబించి, రెండు రాజకీయ సమూహాల మీద అధికారాన్ని విడివిడిగా సూచించాం.
theological_decisions:
- issue: నָגִיד అనే రాజాధికార పదానికి מלך తో ఉన్న సంబంధం
  choice: מלך ను ‘రాజ్యమేలు’ అని, נָגִיד ను ‘పాలకుడు’ అని వేర్వేరుగా అనువదించడం
  alternative: నָגִיד ను ‘రాజకుమారుడు’ లేదా ‘నాయకుడు’ అని అనువదించడం
  rationale: వచనం రాజ్యమేలడానికీ నియమిత నాయకత్వ పదవికీ వేర్వేరు హీబ్రూ పదాలను వాడుతుంది. రెండింటినీ ఒకే పదంతో సమతలపరచకుండా వాటి పదభేదాన్ని నిలిపాం; ఏ ప్రత్యేక మతశాఖా వ్యాఖ్యానాన్నీ ఇందులో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. రాజ ఊరేగింపు, సింహాసనారోహణ, రాజ్య వారసత్వం అనే క్రమాన్ని సహజంగా ఉంచుతూ మూలంలోని కీలక పదభేదాలు కాపాడబడ్డాయి.
