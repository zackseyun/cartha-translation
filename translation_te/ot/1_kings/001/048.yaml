id: 1KI.1.48
reference: 1 Kings 1:48
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/גַם כָּ֖כָה אָמַ֣ר הַ/מֶּ֑לֶךְ בָּר֨וּךְ יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אֲשֶׁ֨ר נָתַ֥ן הַ/יּ֛וֹם יֹשֵׁ֥ב עַל כִּסְאִ֖/י וְ/עֵינַ֥/י רֹאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/048.yaml
  text: 'And the king also said thus: ‘Blessed be Yahweh[a], the God of Israel, who today has given one to sit on my throne, and my eyes see it.’'
translation:
  language: te
  text: 'రాజు ఇంకా ఇలా అన్నాడు: “నేడు నా సింహాసనంపై కూర్చునే ఒకరిని ఇచ్చి, నా కళ్లు దానిని చూస్తున్న ఇశ్రాయేలు దేవుడైన యాహ్వే స్తుతింపబడుగాక!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם כָּכָה אָמַר הַמֶּלֶךְ
  choice: రాజు ఇంకా ఇలా అన్నాడు
  rationale: וְגַם యొక్క అదనపు భావాన్ని ‘ఇంకా’ తెలియజేస్తుంది; כָּכָה తరువాత వచ్చే మాటలను సూచిస్తున్నందున సహజమైన తెలుగు వాక్యనిర్మాణంలో ‘ఇలా’ అని అనువదించాం.
- source_word: בָּרוּךְ
  choice: స్తుతింపబడుగాక
  rationale: దేవుణ్ణి స్తుతించే ఆశీర్వాద సూత్రానికి తగిన గౌరవభరితమైన తెలుగు ప్రయోగం; కేవలం శుభం కోరుతున్న భావం రాకుండా దేవుని మహిమను ప్రకటిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: హీబ్రూ సంయుక్త పదబంధాన్ని స్పష్టంగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר נָתַן הַיּוֹם יֹשֵׁב
  choice: నేడు ... కూర్చునే వానిని అనుగ్రహించి
  rationale: נתן యొక్క సాధారణ ‘ఇవ్వు/అనుగ్రహించు’ భావాన్ని నిలుపుతూ, substantival participle יֹשֵׁב ను వ్యక్తిగా చూపిస్తుంది; వచనంలో లేని సొలొమోను పేరును చేర్చలేదు.
- source_word: עַל כִּסְאִי
  choice: నా సింహాసనంపై
  rationale: రాజ్యాధికార సందర్భంలో כִּסֵּא కు సహజమైన సమానార్థకం ‘సింహాసనం’.
- source_word: וְעֵינַי רֹאוֹת
  choice: నా కళ్లతోనే అది చూసేలా చేసిన
  rationale: దావీదు ఈ సంఘటనను స్వయంగా చూశాడనే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది. హీబ్రూలో ‘చూచుట’ అనే క్రియకు కర్మ స్పష్టంగా లేదు; ప్రధాన పాఠంలో సందర్భానుసారంగా ‘అది’ చేర్చబడింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా, తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం.
- issue: יֹשֵׁב యొక్క కాల/ఫలిత భావం
  choice: కూర్చునే వానిని
  alternative: కూర్చున్న వానిని
  rationale: హీబ్రూ participle ‘కూర్చున్నవాడు’ లేదా సందర్భంలో ‘కూర్చునేలా నియమించబడినవాడు’ అనే రెండింటికీ అవకాశం ఇస్తుంది. ప్రధాన పాఠం రాజ్యాధికార ప్రసాదం అనే సందర్భోచిత ఫలిత భావాన్ని చూపుతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే రాజవాక్యానికి మరియు స్తోత్రసూత్రానికి తగిన గౌరవభరిత శైలిలో రూపొందించబడింది. ‘వానిని’ వంటి రూపం స్వల్పంగా సాహిత్యగౌరవాన్ని కలిగి ఉన్నప్పటికీ ప్రస్తుత తెలుగు పాఠకులకు సులభంగా గ్రాహ్యం.
