    reason: יֹשֵׁב అనే participle ను ‘కూర్చునే ఒకరు’ లేదా ‘కూర్చున్న ఒకరు’గా అర్థం చేసుకునే అవకాశం ఉంది. అలాగే רֹאוֹת క్రియకు మూలపాఠంలో చెప్పబడని కర్మను సందర్భం ఆధారంగా ప్రధాన పాఠంలో చేర్చాం.
