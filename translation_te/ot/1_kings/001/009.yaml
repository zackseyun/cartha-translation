revisions:
- from: అదోనీయా ఏన్‌రోగేలు పక్కన ఉన్న జోహెలెతు రాయి దగ్గర గొర్రెలను, పశువులను, కొవ్వించిన పశువులను బలిగా అర్పించాడు. తన సహోదరులైన రాజు కుమారులందరినీ, రాజు సేవకులైన యూదా పురుషులందరినీ విందుకు ఆహ్వానించాడు.[a]
  to: అదోనీయా ఏన్-రోగేలు పక్కన ఉన్న జోహెలెతు రాయి దగ్గర గొర్రెలను, పశువులను, కొవ్వించిన పశువులను బలిగా అర్పించాడు. అతడు తన సోదరులైన రాజు కుమారులందరినీ, యూదా పురుషులందరినీ, రాజు సేవకులందరినీ ఆహ్వానించాడు.[a]
