source:
  edition: WLC
  text: וַ/יִּזְבַּ֣ח אֲדֹנִיָּ֗הוּ צֹ֤אן וּ/בָקָר֙ וּ/מְרִ֔יא עִ֚ם אֶ֣בֶן הַזֹּחֶ֔לֶת אֲשֶׁר אֵ֖צֶל עֵ֣ין רֹגֵ֑ל וַ/יִּקְרָ֗א אֶת כָּל אֶחָי/ו֙ בְּנֵ֣י הַ/מֶּ֔לֶךְ וּ/לְ/כָל אַנְשֵׁ֥י יְהוּדָ֖ה עַבְדֵ֥י הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/009.yaml
  text: Adonijah sacrificed sheep[a], cattle, and fattened animals by the stone of Zoheleth, which is beside En-rogel, and he invited all his brothers, the king’s sons, and all the men of Judah[e][d][c][b], the king’s servants.
translation:
  language: te
  text: అదోనీయా ఏన్-రోగేలు పక్కన ఉన్న జోహెలెతు రాయి దగ్గర గొర్రెలను, పశువులను, కొవ్వించిన పశువులను బలిగా అర్పించాడు. అతడు తన సోదరులైన రాజు కుమారులందరినీ, యూదా పురుషులందరినీ, రాజు సేవకులందరినీ ఆహ్వానించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “రాజు సేవకులు” అనేది రాజ పరిచారకులను లేదా అధికారులను సూచించవచ్చు. “ఆహ్వానించాడు” అనే పదాన్ని “పిలిచాడు” లేదా “సమ్మనించాడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: బలిగా అర్పించాడు
  rationale: זבח ఇక్కడ బలి విందు కోసం జరిగిన ఆచారబద్ధమైన వధను సూచిస్తుంది; కేవలం ‘వధించాడు’ అనడం దాని ఆరాధనాపరమైన, రాజకీయ ప్రాముఖ్యతను తగ్గిస్తుంది.
- source_word: צֹאן
  choice: గొర్రెలను
  rationale: ఈ పదం గొర్రెలు, మేకలు వంటి చిన్న పశువులను సమష్టిగా సూచించగలిగినా, బలిపశువుల జాబితాలో ‘గొర్రెలు’ సహజమైన ప్రాతినిధ్య అనువాదం.
- source_word: וּבָקָר
  choice: పశువులను
  rationale: బోవైన్ జాతి మందను సూచించే విస్తృత పదం; తెలుగులో ‘పశువులు’ సందర్భానుసారంగా సహజంగా ఉంది.
- source_word: וּמְרִיא
  choice: కొవ్వించిన పశువులను
  rationale: ప్రత్యేక విందు కోసం బాగా మేపి కొవ్వించిన పశువులను సూచిస్తుంది; మూలంలో దూడలు అని నిర్దిష్టంగా లేనందున విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: עִם אֶבֶן הַזֹּחֶלֶת
  choice: జోహెలెతు రాయి దగ్గర
  rationale: עִם ఇక్కడ స్థలార్థకంగా వాడబడింది. జోహెలెతు స్థలనామం కావడంతో అనువదించకుండా లిప్యంతరీకరించబడింది.
- source_word: עֵין רֹגֵל
  choice: ఏన్‌రోగేలు
  rationale: ప్రసిద్ధ స్థలనామంగా లిప్యంతరీకరించబడింది.
- source_word: וַיִּקְרָא
  choice: విందుకు ఆహ్వానించాడు
  rationale: బలి విందు సందర్భంలో కేవలం పిలవడం కాక, హాజరు కావాలని ఆహ్వానించడం అనే భావాన్ని సందర్భం స్పష్టం చేస్తుంది.
- source_word: אֶת כָּל אֶחָיו בְּנֵי הַמֶּלֶךְ
  choice: తన సహోదరులైన రాజు కుమారులందరినీ
  rationale: ‘రాజు కుమారులు’ అనేది ‘తన సహోదరులు’ అనే పదబంధాన్ని వివరిస్తున్న సమానాధికార పదబంధం; తెలుగు వాక్యంలో ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אַנְשֵׁי יְהוּדָה
  choice: యూదా పురుషులందరినీ
  rationale: హీబ్రూ పదం స్పష్టంగా పురుషులను సూచిస్తుంది; దానిని లింగతటస్థంగా మార్చకుండా మూలార్థం నిలుపబడింది.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: రాజు సేవకులైన
  rationale: עבדים అనే పదానికి ప్రత్యక్ష అర్థం ‘సేవకులు’; రాజసభ సందర్భంలో అధికారులు లేదా పరిచారకులు కూడా కావచ్చనే విస్తృతిని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: אַנְשֵׁי יְהוּדָה లోని లింగసూచక భాష
  choice: యూదా పురుషులు
  alternative: యూదా ప్రజలు
  rationale: మూల హీబ్రూ వ్యాకరణపరంగానూ అర్థపరంగానూ పురుషలింగాన్ని సూచిస్తుంది. విస్తృత సామాజిక వర్గాన్ని ఉద్దేశించి ఉండవచ్చుగానీ, అనువాదంలో ఆ అవకాశాన్ని ఖచ్చితార్థంగా చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని సమానాధికార సంబంధాలను తెలుగులో ‘అయిన’ నిర్మాణంతో స్పష్టం చేశాం. అస్పష్టమైన מְרִיא ను ‘దూడలు’ అని సంకుచితం చేయకుండా ‘కొవ్వించిన పశువులు’గా ఉంచాం.
