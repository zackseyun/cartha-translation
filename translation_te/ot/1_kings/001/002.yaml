source:
  edition: WLC
  text: וַ/יֹּ֧אמְרוּ ל֣/וֹ עֲבָדָ֗י/ו יְבַקְשׁ֞וּ לַ/אדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ נַעֲרָ֣ה בְתוּלָ֔ה וְ/עָֽמְדָה֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ וּ/תְהִי ל֖/וֹ סֹכֶ֑נֶת וְ/שָׁכְבָ֣ה בְ/חֵיקֶ֔/ךָ וְ/חַ֖ם לַ/אדֹנִ֥/י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/002.yaml
  text: So his servants said to him[a], “Let them seek for my lord the king a young virgin woman, and let her attend the king and be his caregiver, and let her lie in your bosom[c][b], so that my lord the king may be warm.”
translation:
  language: te
  text: అప్పుడు అతని సేవకులు అతనితో, “నా ప్రభువైన రాజుకోసం కన్యయైన ఒక యువతిని వెదకనివ్వండి. ఆమె రాజు సన్నిధిలో ఉండి ఆయనకు సేవచేయాలి[a]; ఆమె ఆయన సంరక్షణ చూసే పరిచారికగా[b] ఉండాలి. ఆమె నీ ఒడిలో[c] పడుకోవాలి; అప్పుడు నా ప్రభువైన రాజుకు వెచ్చదనం కలుగుతుంది” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆమె రాజు ఎదుట నిలబడాలి.’ హీబ్రూ నుడికారం ఒకరి సన్నిధిలో సేవకు సిద్ధంగా ఉండడాన్ని లేదా వారికి పరిచర్య చేయడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆయన సంరక్షణ చూసే పరిచారిక’కు బదులుగా ‘పరిచారిక’ లేదా ‘సేవిక’ అని కూడా అనువదించవచ్చు. అరుదైన ఈ హీబ్రూ పదం మరొకరికి సేవచేసే లేదా శ్రద్ధ వహించే వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా ‘నీ ఒడిలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: అతని సేవకులు
  rationale: రాజసభ సందర్భంలో ఇది రాజుకు సేవచేసే పరిచారకులు లేదా అధికారులను సూచించగలదు. బానిసత్వాన్ని అనవసరంగా ముందుకు తేవకుండా సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: יְבַקְשׁוּ
  choice: వెదకనివ్వండి
  rationale: మూడవ పురుష బహువచన క్రియలోని ప్రతిపాదనాత్మక భావాన్ని నిలుపుతూ, ‘వారు వెదకాలి’ అనే సూచనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజుకోసం
  rationale: రాజసభలోని గౌరవసూచక సంబోధనను, మొదటి పురుష స్వామ్యార్థంతో సహా నిలుపుతుంది.
- source_word: נַעֲרָה בְתוּלָה
  choice: కన్యయైన ఒక యువతి
  rationale: נַעֲרָה లోని యౌవన భావాన్నీ, בְתוּלָה లోని కన్యత్వాన్నీ రెండింటినీ సహజంగా స్పష్టం చేస్తుంది.
- source_word: וְעָמְדָה לִפְנֵי הַמֶּלֶךְ
  choice: రాజు సన్నిధిలో ఉండి ఆయనకు సేవచేయాలి
  rationale: అక్షరార్థమైన ‘రాజు ఎదుట నిలబడాలి’ అనే రూపకాన్ని, రాజసభలో సేవకు సిద్ధంగా ఉండే నుడికారార్థంతో కలిపి అందిస్తుంది.
- source_word: סֹכֶנֶת
  choice: సంరక్షకురాలు
  rationale: అరుదైన ఈ పదం మరొకరికి సేవచేసి, శ్రద్ధ వహించే స్త్రీని సూచిస్తుంది. సందర్భంలోని వృద్ధ రాజు సంరక్షణకు ఇది సరిపోతుంది; పదంలో స్పష్టంగా లేని లైంగిక భావాన్ని చేర్చదు.
- source_word: וְשָׁכְבָה בְחֵיקֶךָ
  choice: ఆమె నీ ఒడిలో పడుకోవాలి
  rationale: חֵיק సూచించే ఒడి లేదా వక్షస్థల సమీపతను, వెచ్చదనం కలిగించే శారీరక సాన్నిహిత్యంతో సహా నిలుపుతుంది.
- source_word: וְחַם
  choice: అప్పుడు నా ప్రభువైన రాజుకు వెచ్చదనం కలుగుతుంది
  rationale: ముందు ప్రతిపాదించిన చర్యల ఉద్దేశిత ఫలితాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
