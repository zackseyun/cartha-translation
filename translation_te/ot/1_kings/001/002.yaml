translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కథన శైలిని ఉపయోగించాం. రాజసభ సంబోధనలోని ‘నా ప్రభువైన రాజు’ అనే రూపాన్ని నిలిపి, అరుదైన పదాలు మరియు హీబ్రూ నుడికారానికి సంబంధించిన నిజమైన ప్రత్యామ్నాయాలను పాదటిప్పణుల్లో ఇచ్చాం.
