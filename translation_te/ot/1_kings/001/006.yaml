translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ప్రత్యక్ష ప్రశ్నలో సహజమైన ఏకవచన సంబోధనను ఉంచాం; మూలంలోని עֲצָבוֹ పదానికి ఉన్న భావవ్యాప్తిని పాదసూచికలో నిలిపాం.
