base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/006.yaml
  text: His father had never displeased him at any time by saying[a], “Why have you done thus?” He was also very handsome[b], and his mother had borne him after Absalom.
translation:
  language: te
  text: అతని తండ్రి, “నువ్వు ఇలా ఎందుకు చేశావు?” అని చెప్పి అతనికి ఎన్నడూ[b] బాధ కలిగించలేదు[a]. అతను చూడటానికి ఎంతో అందగాడు. అతని తల్లి అతన్ని అబ్షాలోము తర్వాత కన్నది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతనికి మనస్తాపం కలిగించలేదు,” “అతన్ని గద్దించలేదు.” హీబ్రూ క్రియ నొప్పి, దుఃఖం లేదా చికాకు కలిగించడాన్ని సూచించగలదు. ఇక్కడ దావీదు అదోనీయాను అదుపుచేయకపోవడం లేదా నిలదీయకపోవడం సందర్భంలోని భావం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “అతని దినాలనుండి”; అంటే అతని జీవితంలో ఏ సమయంలోనూ.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָבוֹ
  choice: అతన్ని … బాధపెట్టలేదు
  rationale: ఈ క్రియకు నొప్పించడం, దుఃఖపెట్టడం లేదా మనస్తాపం కలిగించడం అనే భావాలు ఉన్నాయి. తరువాత వచ్చే ప్రశ్నను బట్టి, తండ్రి అదోనీయాను ప్రశ్నించి నియంత్రించకపోవడం ఇక్కడ ఉద్దేశం. ప్రధాన పాఠంలో మూలంలోని విస్తృత భావాన్ని నిలుపుతూ, పాదసూచికలో సందర్భానుగుణ ప్రత్యామ్నాయాలను ఇచ్చాం.
- source_word: מִיָּמָיו
  choice: ఎన్నడూ
  rationale: అక్షరార్థంగా ‘అతని దినాలనుండి’; సందర్భంలో అతని జీవితంలో ఏ సమయంలోనూ అలా చేయలేదనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לֵאמֹר
  choice: అని అడిగి
  rationale: తండ్రి పలకని ప్రశ్నలోని మాటలను పరిచయం చేస్తుంది. తెలుగులో ప్రశ్నకు ‘అని అడిగి’ సహజంగా సరిపోతుంది.
- source_word: מַדּוּעַ כָּכָה עָשִׂיתָ
  choice: నువ్వు ఇలా ఎందుకు చేశావు?
  rationale: ככה లోని ‘ఇలా’ అనే భావాన్ని నిలుపుతూ, తండ్రి నేరుగా ప్రశ్నించే మాటను సహజమైన తెలుగులో అందిస్తుంది.
- source_word: טוֹב תֹּאַר מְאֹד
  choice: చూడటానికి ఎంతో అందగాడు
  rationale: ఈ పదబంధం శారీరక రూపాన్ని సూచిస్తుంది. పురుషుని రూపసౌందర్యాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְאֹתוֹ יָלְדָה
  choice: అతన్ని అతని తల్లి కన్నది
  rationale: హీబ్రూలో స్త్రీలింగ ఏకవచన కర్త క్రియలో అంతర్లీనంగా ఉంది. తెలుగులో కర్తను స్పష్టపరచడానికి సందర్భానుసారంగా ‘అతని తల్లి’ అని చెప్పాం.
- source_word: אַחֲרֵי אַבְשָׁלוֹם
  choice: అబ్షాలోము తర్వాత
  rationale: 'ఇది సహజంగా జనన క్రమాన్ని సూచిస్తుంది: అదోనీయా అబ్షాలోము తర్వాత పుట్టాడు. మూలంలోని సంక్షిప్తతను నిలుపుతుంది.'
