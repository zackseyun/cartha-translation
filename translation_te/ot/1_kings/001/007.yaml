translation_notes:
  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. రాజకీయ సంప్రదింపు మరియు మద్దతు అనే సందర్భార్థం స్పష్టంగా ఉండేలా చూసినా, ‘సహాయం’ అనే మూల క్రియ యొక్క విస్తృత భావాన్ని ప్రధాన వాక్యంలో నిలిపాం.
