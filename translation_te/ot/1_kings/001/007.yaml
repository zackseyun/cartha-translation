  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּהְי֣וּ דְבָרָ֔י/ו עִ֚ם יוֹאָ֣ב בֶּן צְרוּיָ֔ה וְ/עִ֖ם אֶבְיָתָ֣ר הַ/כֹּהֵ֑ן וַֽ/יַּעְזְר֔וּ אַחֲרֵ֖י אֲדֹנִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/007.yaml
  text: And he conferred with Joab son of Zeruiah and with Abiathar the priest[a], and they helped Adonijah.
translation:
  language: te
  text: అతడు సెరూయా కుమారుడైన యోవాబుతో, యాజకుడైన అబ్యాతారుతో సంప్రదించాడు. వారు అదోనీయాకు సహాయం చేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వారు అదోనీయా వెనుక సహాయం చేశారు”; అంటే, వారు అతనికి మద్దతిచ్చారు లేదా అతని పక్షాన నిలిచారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבָרָיו עִם
  choice: సంప్రదించాడు
  rationale: ‘అతని మాటలు ... తో ఉండెను’ అనే హీబ్రూ ప్రయోగం ఈ రాజకీయ సందర్భంలో సంభాషణ లేదా సంప్రదింపును సూచిస్తుంది. దాని భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘సంప్రదించాడు’ అని వ్యక్తం చేశాం.
- source_word: יוֹאָב בֶּן צְרוּיָה
  choice: సెరూయా కుమారుడైన యోవాబు
  rationale: వ్యక్తి పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, తండ్రి/తల్లి సంబంధాన్ని తెలిపే హీబ్రూ నిర్మాణాన్ని నిలిపాం.
- source_word: אֶבְיָתָר הַכֹּהֵן
  choice: యాజకుడైన అబ్యాతారు
  rationale: నిర్దిష్టమైన అధికార హోదాను సహజమైన తెలుగు విశేషణ నిర్మాణంతో అనువదించాం.
- source_word: וַיַּעְזְרוּ
  choice: వారు సహాయం చేశారు
  rationale: עזר అనే క్రియకు ‘సహాయం చేయు, తోడ్పడు, మద్దతివ్వు’ అనే అర్థాలున్నాయి. మూల క్రియకు దగ్గరగా ఉండేందుకు ‘సహాయం చేశారు’ ఎంచుకున్నాం; రాజకీయ మద్దతు భావాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: אַחֲרֵי אֲדֹנִיָּה
  choice: అదోనీయాకు
  rationale: אַחֲרֵי అక్షరార్థంగా ‘వెనుక/తరువాత’ అయినా, ఇక్కడ ఒకరి పక్షాన్ని అనుసరించడం లేదా వారికి మద్దతివ్వడం అనే నుడికార భావం ఉంది. సహజ తెలుగులో క్రియకు అనుగుణంగా ‘అదోనీయాకు’ అని ఇచ్చి, అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
