source:
  edition: WLC
  text: וַ/יִּשָּׁבַ֥ע הַ/מֶּ֖לֶךְ וַ/יֹּאמַ֑ר חַי יְהוָ֕ה אֲשֶׁר פָּדָ֥ה אֶת נַפְשִׁ֖/י מִ/כָּל צָרָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/029.yaml
  text: And the king swore and said[a], “As Yahweh lives, who has redeemed my life from every distress,”
translation:
  language: te
  text: 'రాజు ప్రమాణం చేసి ఇలా అన్నాడు: “ప్రతి ఆపదనుండి నా ప్రాణాన్ని[a] విమోచించిన యాహ్వే జీవముతోడు,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ఆత్మను.” హీబ్రూ పదమైన నెఫెష్‌కు ఆత్మ, వ్యక్తి, లేదా ప్రాణం అనే అర్థాలు రావచ్చు; ఇక్కడ ఆపదనుండి కాపాడబడిన దావీదు ప్రాణాన్నే ఇది అత్యంత సహజంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: ప్రమాణం చేసి
  rationale: నిఫాల్ రూపంలోని שׁבע ప్రమాణం చేయడాన్ని సూచిస్తుంది; కథన ప్రవాహంలో ఇది సహజమైన, సంక్షిప్తమైన తెలుగు ప్రయోగం.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: హీబ్రూలో వ్యక్తిపేరు కాక బిరుదే ఉన్నందున ‘దావీదు’ అని స్పష్టీకరించకుండా ‘రాజు’ అని ఉంచాం.
- source_word: וַיֹּאמַר
  choice: ఇలా అన్నాడు
  rationale: אמר అనే సాధారణ మాటల పరిచయ క్రియను అదనపు వాక్చాతుర్య బలం చేర్చకుండా సహజమైన తెలుగులో ఇచ్చాం.
- source_word: חַי יְהוָה
  choice: యాహ్వే జీవం తోడు
  rationale: ఇది స్థిరమైన ప్రమాణ సూత్రం. ‘యాహ్వే జీవం తోడు’ దాని ప్రమాణ స్వభావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: פָּדָה
  choice: విమోచించిన
  rationale: פדהలోని విడిపించడం లేదా విమోచించడం అనే బలమైన భావాన్ని ‘విమోచించిన’ నిలుపుతుంది.
- source_word: נַפְשִׁי
  choice: నా ప్రాణాన్ని
  rationale: ఇక్కడ נֶפֶשׁ ప్రమాదం నుండి కాపాడబడిన దావీదు ప్రాణాన్ని లేదా జీవాన్ని సూచిస్తుంది; వేరుగా ఉండే అభౌతిక ఆత్మ అనే అర్థాన్ని బలవంతంగా రుద్దదు.
- source_word: מִכָּל צָרָה
  choice: ప్రతి ఆపదనుండి
  rationale: כָּלతో కూడిన ఏకవచన צָרָה అన్ని రకాల కష్టాలు లేదా ఆపదలను సమగ్రంగా సూచిస్తుంది; ఈ భావాన్ని ప్రస్తుత తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా, సాధారణంగా ఆమోదించబడిన ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- issue: ఈ సందర్భంలో נַפְשִׁי అర్థం
  choice: నా ప్రాణాన్ని
  alternative: నా ఆత్మను; నన్ను
  rationale: వాక్యసందర్భం దావీదు ఎదుర్కొన్న ఆపదల నుండి అతని జీవితం కాపాడబడటాన్ని సూచిస్తుంది. అందువల్ల తరువాతి కాలపు శరీర–ఆత్మ ద్వైత భావాన్ని చొప్పించకుండా సందర్భార్థాన్ని ఎంచుకున్నాం.
- issue: חַי יְהוָה అనే ప్రమాణ సూత్రం
  choice: యాహ్వే జీవం తోడు
  alternative: యాహ్వే సజీవుడై ఉన్నంత నిశ్చయంగా
  rationale: ప్రమాణ సూత్రాన్ని వివరణాత్మక వాక్యంగా మార్చకుండా దాని సంక్షిప్తతను, గంభీరతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని వాడాం. ప్రమాణ సూత్రానికి కొద్దిగా గంభీరమైన ‘జీవం తోడు’ ప్రయోగాన్ని ఉంచాం. వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున ముగింపులో కామా ఉంచాం.
