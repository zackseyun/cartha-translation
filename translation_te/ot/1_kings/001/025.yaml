source:
  edition: WLC
  text: כִּ֣י יָרַ֣ד הַ/יּ֗וֹם וַ֠/יִּזְבַּח שׁ֥וֹר וּֽ/מְרִיא וְ/צֹאן֮ לָ/רֹב֒ וַ/יִּקְרָא֩ לְ/כָל בְּנֵ֨י הַ/מֶּ֜לֶךְ וּ/לְ/שָׂרֵ֤י הַ/צָּבָא֙ וּ/לְ/אֶבְיָתָ֣ר הַ/כֹּהֵ֔ן וְ/הִנָּ֛/ם אֹכְלִ֥ים וְ/שֹׁתִ֖ים לְ/פָנָ֑י/ו וַ/יֹּ֣אמְר֔וּ יְחִ֖י הַ/מֶּ֥לֶךְ אֲדֹנִיָּֽהוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/025.yaml
  text: For he has gone down today and sacrificed oxen[a], fattened calves, and sheep in abundance, and he has invited all the king’s sons, the commanders of the army, and Abiathar the priest. And look, they are eating and drinking before him, and they are saying[b], ‘Long live King Adonijah!’
translation:
  language: te
  text: ఎందుకంటే అతడు ఈ రోజు దిగివెళ్లి[a], ఎద్దులను, కొవ్వబెట్టిన పశువులను, గొర్రెలను సమృద్ధిగా బలిగా అర్పించాడు. రాజు కుమారులందరినీ, సైన్యాధిపతులనూ, యాజకుడైన అబ్యాతారునూ ఆహ్వానించాడు. ఇదిగో, వారు అతని సమక్షంలో తింటూ తాగుతూ, “అదోనీయా రాజు చిరకాలం జీవించాలి!”[b] అని అంటున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ఈ రోజు దిగివెళ్లాడు.” సందర్భాన్ని బట్టి హీబ్రూ క్రియను “దిగివచ్చాడు” అని కూడా అనువదించవచ్చు; అది ‘దిగు’ అనే దిశాభావాన్ని నిలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ జయధ్వనిని మరింత అక్షరార్థంగా, “అదోనీయా రాజు జీవించాలి!” అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి హెచ్చరికకు లేదా నివేదికకు కారణాన్ని వివరించే అనుసంధాన పదంగా సహజంగా ఉంది.
- source_word: יָרַד הַיּוֹם
  choice: ఈ రోజు దిగివెళ్లి
  rationale: יָרַד లోని దిశాసూచకమైన ‘దిగు’ భావాన్ని నిలుపుతూ, తరువాతి క్రియతో సహజమైన తెలుగు వాక్యనిర్మాణంలో కలిపింది.
- source_word: וַיִּזְבַּח
  choice: బలి అర్పించాడు
  rationale: ఈ విందు సందర్భంలో ఉన్న ఆచారపరమైన బలివధ భావాన్ని కేవలం ‘వధించాడు’ అనకుండా స్పష్టంగా తెలియజేస్తుంది.
- source_word: שׁוֹר וּמְרִיא וְצֹאן
  choice: ఎద్దులను, కొవ్వబెట్టిన పశువులను, గొర్రెలను
  rationale: మూడు పశువర్గాల మధ్య తేడాను నిలిపింది; מְרִיא వయస్సును నిర్దిష్టం చేయకుండా కొవ్వబెట్టిన పశువును సూచిస్తుంది.
- source_word: לָרֹב
  choice: విస్తారంగా
  rationale: బలి అర్పించిన పశువుల అధిక పరిమాణాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּקְרָא
  choice: పిలిపించాడు
  rationale: לְ తో వచ్చిన קרא ఇక్కడ విందుకు వ్యక్తులను పిలవడం లేదా రప్పించడం అనే భావం ఇస్తుంది.
- source_word: שָׂרֵי הַצָּבָא
  choice: సైన్యాధిపతులు
  rationale: సైన్యానికి చెందిన నాయకులు లేదా అధికారులను సంక్షిప్తమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: וְהִנָּם
  choice: ఇదిగో
  rationale: ప్రస్తుతం జరుగుతున్న దృశ్యంపై శ్రద్ధ నిలిపే హీబ్రూ ఉద్ఘాటనను గౌరవప్రదంగా, సహజంగా అందిస్తుంది.
- source_word: לְפָנָיו
  choice: అతని సమక్షంలో
  rationale: అక్షరార్థమైన ‘అతని ఎదుట’ అనే భావాన్ని ఈ రాజవిందు సందర్భానికి తగిన సహజ తెలుగులో ఇస్తుంది.
- source_word: יְחִי הַמֶּלֶךְ אֲדֹנִיָּהוּ
  choice: అదోనీయా రాజు చిరకాలం జీవించాలి!
  rationale: రాజును అంగీకరిస్తూ పలికే హీబ్రూ జయధ్వనిని ఆధునిక తెలుగులో అర్థవంతంగా, ఘనంగా అందిస్తుంది.
theological_decisions:
- issue: అదోనీయాను ‘రాజు’గా సంబోధించడం
  choice: జనులు పలికిన జయధ్వనిలో ‘అదోనీయా రాజు’ అని యథాతథంగా ఉంచడం
  alternative: అదోనీయా రాజుగా చట్టబద్ధంగా స్థిరపడ్డాడనే భావం రాకుండా సంబోధనను మృదువుగా మార్చడం
  rationale: వచనం వారి రాజకీయ ప్రకటనను నివేదిస్తుంది; దాని చట్టబద్ధతపై కథనం ఇక్కడ తీర్పు చెప్పదు. అందువల్ల మూలంలోని ఉద్రిక్తతను అలాగే నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇదిగో’ ద్వారా హీబ్రూ దృశ్యోద్ఘాటనను నిలిపి, అతిగా ప్రాచీనంగా వినిపించే పదజాలాన్ని నివారించాం.
