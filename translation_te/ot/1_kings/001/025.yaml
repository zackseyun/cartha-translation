  to: ఎందుకంటే అతడు ఈ రోజు దిగివెళ్లి[a], ఎద్దులను, కొవ్వబెట్టిన పశువులను, గొర్రెలను సమృద్ధిగా బలిగా అర్పించాడు. రాజు కుమారులందరినీ, సైన్యాధిపతులనూ, యాజకుడైన అబ్యాతారునూ ఆహ్వానించాడు. ఇదిగో, వారు అతని సమక్షంలో తింటూ తాగుతూ, “అదోనీయా రాజు చిరకాలం జీవించాలి!”[b] అని అంటున్నారు.
  rationale: The revision corrects the literalizing footnote so that the personal name remains linked with ‘king,’ not as a separate vocative. It also makes the Telugu sacrificial construction explicit and changes ‘పిలిపించాడు’ to the banquet-appropriate ‘ఆహ్వానించాడు,’ without adding to the source’s meaning.
