source:
  edition: WLC
  text: וַ/יִּקַּח֩ צָד֨וֹק הַ/כֹּהֵ֜ן אֶת קֶ֤רֶן הַ/שֶּׁ֨מֶן֙ מִן הָ/אֹ֔הֶל וַ/יִּמְשַׁ֖ח אֶת שְׁלֹמֹ֑ה וַֽ/יִּתְקְעוּ֙ בַּ/שּׁוֹפָ֔ר וַ/יֹּֽאמְרוּ֙ כָּל הָ/עָ֔ם יְחִ֖י הַ/מֶּ֥לֶךְ שְׁלֹמֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/039.yaml
  text: Then Zadok the priest took the horn of oil from the tent and anointed Solomon[a]. Then they blew the ram’s horn, and all the people said[b], “Long live King Solomon!”
translation:
  language: te
  text: అప్పుడు యాజకుడైన సాదోకు గుడారం నుండి నూనె కొమ్మును తీసుకొని సొలొమోనును అభిషేకించాడు. తరువాత వారు బూరను ఊదారు[a]. ప్రజలందరూ, “సొలొమోను రాజు చిరకాలం జీవించుగాక!” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో షోఫార్; సాధారణంగా పొట్టేలు కొమ్ముతో చేసిన బూర.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకొని
  rationale: לקח క్రియ యొక్క వరుస కథనరూపాన్ని సహజమైన తెలుగు వాక్యప్రవాహంలో చూపుతుంది.
- source_word: צָדוֹק הַכֹּהֵן
  choice: యాజకుడైన సాదోకు
  rationale: పేరును తెలుగు లిప్యంతరీకరణలో ఉంచి, הכהן అనే బిరుదును సహజమైన విశేషణ నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: קֶרֶן הַשֶּׁמֶן
  choice: నూనె కొమ్మును
  rationale: קֶרֶן యొక్క స్పష్టమైన ‘కొమ్ము’ చిత్రాన్ని నిలుపుతూ, అభిషేక నూనె ఉంచిన పాత్రను మూలానికి దగ్గరగా తెలియజేస్తుంది.
- source_word: מִן הָאֹהֶל
  choice: గుడారం నుండి
  rationale: אֹהֶל అనే సాధారణ పదాన్ని ‘గుడారం’గా అనువదించి, మూలంలో లేని మరింత సాంకేతికమైన ‘ప్రత్యక్ష గుడారం’ అనే నిర్దిష్టతను ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: וַיִּמְשַׁח
  choice: అభిషేకించాడు
  rationale: משׁח సూచించే ఆచారపూర్వక రాజాభిషేకానికి ప్రామాణికమైన, సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָר
  choice: వారు బూరను ఊదారు
  rationale: שׁוֹפָר ఒక కొమ్ముతో చేసిన ఊదే వాద్యం; ‘బూర’ సహజమైన తెలుగు పదం. దాని నిర్మాణాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: כָּל הָעָם
  choice: ప్రజలందరూ
  rationale: సామూహిక ప్రజా హర్షధ్వనిని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְחִי הַמֶּלֶךְ שְׁלֹמֹה
  choice: సొలొమోను రాజు చిరకాలం జీవించుగాక!
  rationale: జస్సివ్ రూపంలోని రాజపరమైన శుభాకాంక్షను గౌరవప్రదమైన సహజ తెలుగు నినాదంగా అందిస్తుంది.
- source_word: וַיֹּאמְרוּ
  choice: అని కేకలు వేశారు
  rationale: అక్షరార్థంగా ‘అన్నారు’; ప్రజలందరి రాజాభినందన సందర్భంలో తెలుగు సహజత్వం కోసం ‘కేకలు వేశారు’ అని వ్యక్తీకరించబడింది, ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
theological_decisions:
- issue: రాజాభిషేక సందర్భంలో הָאֹהֶל యొక్క నిర్దిష్టత
  choice: గుడారం
  alternative: ప్రత్యక్ష గుడారం; పవిత్ర గుడారం
  rationale: హీబ్రూ పాఠ్యంలో నిర్దిష్ట ఉపపదంతో కూడిన సాధారణ నామవాచకం ‘గుడారం’ మాత్రమే ఉంది. అది ఆరాధనా గుడారాన్ని సూచించే అవకాశం ఉన్నా, ప్రధాన పాఠ్యం మూలంలోని నిర్దిష్టత స్థాయిని మించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. రాజాభిషేకానికి సంబంధించిన ‘అభిషేకించాడు’ అనే స్థిరమైన పదాన్ని నిలిపి, సాధారణ పాఠకునికి అర్థమయ్యే పదక్రమం వాడబడింది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
