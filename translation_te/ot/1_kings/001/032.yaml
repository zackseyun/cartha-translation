  text: וַ/יֹּ֣אמֶר הַ/מֶּ֣לֶךְ דָּוִ֗ד קִרְאוּ לִ֞/י לְ/צָד֤וֹק הַ/כֹּהֵן֙ וּ/לְ/נָתָ֣ן הַ/נָּבִ֔יא וְ/לִ/בְנָיָ֖הוּ בֶּן יְהוֹיָדָ֑ע וַ/יָּבֹ֖אוּ לִ/פְנֵ֥י הַ/מֶּֽלֶךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/032.yaml
  text: Then King David said, “Call Zadok the priest, Nathan the prophet, and Benaiah son of Jehoiada to me.” And they came before the king.
translation:
  language: te
  text: అప్పుడు దావీదు రాజు, “యాజకుడైన సాదోకును, ప్రవక్తయైన నాతానును, యెహోయాదా కుమారుడైన బెనాయాను నా దగ్గరికి పిలవండి” అని చెప్పాడు. వారు రాజు సన్నిధికి వచ్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... చెప్పాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ క్రమానుగత భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: దావీదు రాజు
  rationale: దావీదును రాజబిరుదుతో గుర్తించే సమాసార్థక నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: קִרְאוּ לִי
  choice: నా దగ్గరికి పిలవండి
  rationale: బహువచన ఆజ్ఞారూపమైన קרא మరియు לִי కలిసి, పేర్కొన్నవారిని మాట్లాడుతున్న వ్యక్తి వద్దకు రప్పించాలనే ఆజ్ఞను సూచిస్తాయి.
- source_word: לְצָדוֹק הַכֹּהֵן
  choice: యాజకుడైన సాదోకును
  rationale: పేరును లిప్యంతరీకరించి, definite office title‌ను తెలుగులో సహజమైన విశేషణ నిర్మాణంతో వ్యక్తం చేసింది.
- source_word: וּלְנָתָן הַנָּבִיא
  choice: ప్రవక్తయైన నాతానును
  rationale: వ్యక్తిపేరుతో పాటు అతని నిర్దిష్ట పరిచర్య బిరుదును స్పష్టంగా నిలుపుతుంది.
- source_word: וְלִבְנָיָהוּ בֶּן יְהוֹיָדָע
  choice: యెహోయాదా కుమారుడైన బెనాయాను
  rationale: హీబ్రూ వంశపరిచయాన్ని తెలుగులో సహజమైన పదక్రమంలో అందిస్తూ రెండు పేర్లను లిప్యంతరీకరించింది.
- source_word: וַיָּבֹאוּ
  choice: వారు ... వచ్చారు
  rationale: బహువచన క్రియను సందర్భంలోని ముగ్గురు వ్యక్తులకు అన్వయించి, కథన క్రమాన్ని సహజంగా కొనసాగిస్తుంది.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: రాజు సన్నిధికి
  rationale: లִפְנֵי యొక్క రాజసభా సందర్భంలోని ‘రాజు ఎదుటికి/సమక్షానికి’ అనే భావాన్ని గౌరవప్రదమైన, సహజ తెలుగు ప్రయోగంతో అందిస్తుంది.
