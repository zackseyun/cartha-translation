  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, రాజసభా సందర్భానికి తగిన గౌరవప్రదమైన శైలి. పేర్లకు సాధారణ తెలుగు బైబిలు లిప్యంతరీకరణ రూపాలు ఉపయోగించబడ్డాయి.
