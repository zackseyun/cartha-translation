id: 1KI.1.27
reference: 1 Kings 1:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִ֗ם מֵ/אֵת֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ נִהְיָ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/לֹ֤א הוֹדַ֨עְתָּ֙ אֶֽת עבדי/ך מִ֗י יֵשֵׁ֛ב עַל כִּסֵּ֥א אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ אַחֲרָֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/027.yaml
  text: If this thing has come from my lord the king[a], have you not made known to your servants who will sit on the throne of my lord the king after him?
translation:
  language: te
  text: ఈ విషయం[a] నా ప్రభువైన రాజు నుండే వచ్చి ఉంటే, నా ప్రభువైన రాజు తరువాత ఆయన సింహాసనంపై ఎవరు కూర్చుంటారో మీ సేవకులకు తెలియజేయలేదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ సంగతి”; “ఈ వ్యవహారం.”
    reason: దావార్ (דָּבָר) అనే పదానికి ఈ సందర్భంలో సాధ్యమైన సహజ తెలుగు ప్రత్యామ్నాయాలను సూచించడానికి.
lexical_decisions:
- source_word: אִם
  choice: జరిగి ఉంటే
  rationale: హెబ్రీలోని షరతు లేదా సూటిగా నిలదీసే ప్రశ్న ధోరణిని అతిగా నిర్ణయించకుండా సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: מֵאֵת ... נִהְיָה
  choice: నుంచే జరిగి ఉంటే
  rationale: ఈ చర్య లేదా నిర్ణయం రాజు వద్ద నుంచే ఉద్భవించిందా, ఆయన అనుమతితోనే జరిగిందా అనే మూలం/అధికార భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజు
  rationale: రాజసభలో రాజును గౌరవపూర్వకంగా సంబోధించే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: הַדָּבָר הַזֶּה
  choice: ఈ విషయం
  rationale: דבר ఇక్కడ నివేదించబడిన రాజకార్యం లేదా నిర్ణయాన్ని సూచిస్తుంది; ‘విషయం’ విస్తృతార్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: וְלֹא הוֹדַעְתָּ
  choice: తెలియజేయలేదా?
  rationale: ידע హిఫీల్ రూపంలోని ‘తెలిసేలా చేయడం/తెలియజేయడం’ అనే భావాన్నీ, సందర్భంలోని ప్రశ్నార్థక నిలదీతనూ నిలుపుతుంది.
- source_word: עֲבָדֶיךָ
  choice: నీ సేవకులకు
  rationale: ఇది రాజసభ అధికారుల వినయపూర్వక స్వీయసూచన; ఈ సందర్భంలో బానిసత్వం కంటే రాజుకు లోబడిన సేవను సూచిస్తుంది.
- source_word: מִי יֵשֵׁב עַל כִּסֵּא
  choice: ఎవరు ... సింహాసనం మీద కూర్చుంటారో
  rationale: ‘పాలిస్తారు’ అని భావానువాదం చేయకుండా, మూలంలోని కూర్చోవడం మరియు సింహాసన ప్రతీకను నిలుపుతుంది.
- source_word: אַחֲרָיו
  choice: ఆయన ... తరువాత
  rationale: ప్రస్తుత రాజు తరువాతి వారసత్వాన్ని నేరుగా సూచిస్తుంది; ‘ఆయన స్థానంలో’ అనే వివరణాత్మక విస్తరణను నివారిస్తుంది.
theological_decisions:
- issue: రాజసభ సందర్భంలో עבד పదం
  choice: సేవకులు
  alternative: బానిసలు
  rationale: ఇక్కడ ఈ పదం రాజు ఎదుట అధికారుల వినయపూర్వక స్వీయసూచనగా ఉంది; వ్యక్తుల చట్టబద్ధ బానిస స్థితిని ప్రధానంగా చెప్పడం లేదు.
- issue: రాజు నుండి విషయం జరగడం అనే భావం
  choice: రాజు నుంచే జరిగి ఉంటే
  alternative: రాజే ఆజ్ఞాపించి ఉంటే
  rationale: מֵאֵת ... נִהְיָה మూలం లేదా అధికారాన్ని సూచించగలదు. ‘ఆజ్ఞాపించాడు’ అని స్పష్టీకరిస్తే మూలంలో ఉన్న భావవ్యాప్తి అనవసరంగా కుదించబడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన రాజసభ ధోరణి వాడబడింది. ప్రశ్నలోని షరతు రూపం, నిలదీసే స్వరం, సింహాసన వారసత్వ ప్రతీక నిలుపబడ్డాయి. పాదసూచిక గుర్తు అది వివరిస్తున్న ‘విషయం’ పదానికే జతచేయబడింది.
