id: 1KI.1.19
reference: 1 Kings 1:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֠/יִּזְבַּח שׁ֥וֹר וּֽ/מְרִיא וְ/צֹאן֮ לָ/רֹב֒ וַ/יִּקְרָא֙ לְ/כָל בְּנֵ֣י הַ/מֶּ֔לֶךְ וּ/לְ/אֶבְיָתָר֙ הַ/כֹּהֵ֔ן וּ/לְ/יֹאָ֖ב שַׂ֣ר הַ/צָּבָ֑א וְ/לִ/שְׁלֹמֹ֥ה עַבְדְּ/ךָ֖ לֹ֥א קָרָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/019.yaml
  text: And he sacrificed oxen[a], fattened cattle, and sheep in abundance, and he invited all the king’s sons, Abiathar the priest, and Joab the commander of the army[b]; but he did not invite Solomon your servant.
translation:
  language: te
  text: అతడు ఎద్దులను, కొవ్వబెట్టిన పశువులను, గొర్రెలను[a] విస్తారంగా బలిగా అర్పించి, రాజు కుమారులందరినీ, యాజకుడైన అబ్యాతారును, సైన్యాధిపతియైన యోవాబును ఆహ్వానించాడు[b]. అయితే మీ సేవకుడైన సొలొమోనును అతడు ఆహ్వానించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గొర్రెలు’ అని అనువదించిన హీబ్రూ పదం మేకలతో సహా మందలోని చిన్న పశువులను విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: మూలపదానికి అక్షరార్థంగా ‘పిలిచాడు’ లేదా ‘రమ్మని పిలిచాడు’ అని కూడా అనువదించవచ్చు; బలి విందుకు హాజరయ్యే సందర్భం కావడంతో ఇక్కడ ‘ఆహ్వానించాడు’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: బలిగా అర్పించి
  rationale: זבח ఇక్కడ సాధారణంగా జంతువులను వధించడం కాక, బలి కోసం వధించి అర్పించడాన్ని సూచిస్తుంది.
- source_word: שׁוֹר
  choice: ఎద్దులను
  rationale: బలికి ఉపయోగించే గోవర్గ జంతువులను సూచించే సమూహార్థక పదంగా సహజమైన తెలుగు రూపం.
- source_word: מְרִיא
  choice: కొవ్వబెట్టిన పశువులను
  rationale: ప్రత్యేకంగా మేపి కొవ్వబెట్టిన పశువుల వర్గాన్ని సూచిస్తుంది; హీబ్రూలో ఏకవచన రూపం ఉన్నా జాబితాలో సమూహార్థం ఉంది.
- source_word: צֹאן
  choice: గొర్రెలను
  rationale: సందర్భంలో సహజమైన సాధారణ అనువాదం; ఈ హీబ్రూ పదం మేకలను కూడా కలుపుకొనే విస్తృత మందజంతువుల అర్థం కలిగి ఉండవచ్చని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: לָרֹב
  choice: విస్తారంగా
  rationale: బలి జంతువులు చాలా పెద్ద సంఖ్యలో ఉన్నాయనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּקְרָא ... לֹא קָרָא
  choice: ఆహ్వానించాడు ... ఆహ్వానించలేదు
  rationale: קרא మౌలికంగా ‘పిలిచాడు’ అయినా, బలి విందుకు హాజరుకావాలని పిలిచిన ఈ సందర్భంలో ‘ఆహ్వానించాడు’ సామాజిక ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది; రెండు సందర్భాల్లోనూ ఒకే పదాన్ని నిలిపాం.
- source_word: לְכָל בְּנֵי הַמֶּלֶךְ
  choice: రాజు కుమారులందరినీ
  rationale: హీబ్రూ వాక్యభాగంలోని పురుష సంతాన సూచనను అలాగే ఉంచుతూ సహజ తెలుగు పదక్రమాన్ని వాడుతుంది.
- source_word: אֶבְיָתָר הַכֹּהֵן
  choice: యాజకుడైన అబ్యాతారును
  rationale: పేరును లిప్యంతరీకరించి, అధికారిక పాత్రను తెలుగులో అనువదించింది.
- source_word: יֹאָב שַׂר הַצָּבָא
  choice: సైన్యాధిపతియైన యోవాబును
  rationale: שַׂר הַצָּבָא సూచించే సైనిక నాయకత్వ హోదాను స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וְלִשְׁלֹמֹה עַבְדְּךָ
  choice: అయితే మీ సేవకుడైన సొలొమోనును
  rationale: దావీదు సమక్షంలో బత్షెబ సొలొమోనును ‘మీ సేవకుడు’ అని వినయంగా పేర్కొన్న భావాన్ని నిలుపుతుంది; ముందు ఆహ్వానించబడిన వారితో వ్యత్యాసాన్ని ‘అయితే’ స్పష్టం చేస్తుంది.
