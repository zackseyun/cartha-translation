  terminology: ‘బలిగా అర్పించి,’ ‘యాజకుడైన,’ ‘సైన్యాధిపతియైన,’ మరియు పేర్ల లిప్యంతరీకరణలు సందర్భానుకూలంగా ఉన్నాయి. צֹאן యొక్క విస్తృత అర్థాన్ని పాదటిప్పణి సముచితంగా తెలియజేస్తుంది. పాదటిప్పణి గుర్తులు సంబంధిత పదాల వద్ద సరిగ్గా ఉంచబడ్డాయి.
