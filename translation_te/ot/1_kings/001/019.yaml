translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలిని అనుసరించాం. హీబ్రూ రెండవ పురుష ఏకవచనాన్ని రాజును ఉద్దేశించిన తెలుగు గౌరవప్రయోగంగా ‘మీ’ అని వ్యక్తపరిచాం. ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదటిప్పణి గుర్తులు వాటి పదాలకు సరిపోని చోట్ల ఉన్నందున, మూలభాష ఆధారంగా [a]ను ‘గొర్రెలను’ వద్ద, [b]ను ‘ఆహ్వానించాడు’ వద్ద ఉంచాం.
