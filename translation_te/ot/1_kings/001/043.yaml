source:
  edition: WLC
  text: וַ/יַּ֨עַן֙ יוֹנָתָ֔ן וַ/יֹּ֖אמֶר לַ/אֲדֹנִיָּ֑הוּ אֲבָ֕ל אֲדֹנֵ֥י/נוּ הַ/מֶּֽלֶךְ דָּוִ֖ד הִמְלִ֥יךְ אֶת שְׁלֹמֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/043.yaml
  text: Jonathan answered and said to Adonijah[a], “On the contrary, our lord King David has made Solomon king.”
translation:
  language: te
  text: 'యోనాతాను అదోనీయాకు జవాబిచ్చి ఇలా అన్నాడు: “అలా కాదు![a] మన ప్రభువైన రాజు దావీదు సొలొమోనును రాజుగా నియమించాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కాని మన ప్రభువైన రాజు దావీదు సొలొమోనును రాజుగా నియమించాడు.” హీబ్రూ అబాల్ పదాన్ని సాధారణంగా “కాని” అని అనువదించవచ్చు; ఇక్కడ అది ముందున్న ఊహను సరిదిద్దే బలమైన భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: ఇలా జవాబిచ్చాడు
  rationale: హీబ్రూ భాషలోని రెండు సంభాషణా క్రియల భావాన్ని సహజమైన ఆధునిక తెలుగులో ఒకే ప్రయోగంతో అందిస్తుంది; ఇది ప్రత్యుత్తరాన్ని పరిచయం చేసే కథన సూత్రాన్ని నిలుపుతుంది.
- source_word: לַאֲדֹנִיָּהוּ
  choice: అదోనీయాకు
  rationale: ל ఉపసర్గను తెలుగు సంప్రదాన విభక్తితో వ్యక్తం చేసి, వ్యక్తి పేరును సాధారణ తెలుగు రూపంలో ఇచ్చాం.
- source_word: אֲבָל
  choice: అలా కాదు!
  rationale: ఇక్కడ ఈ పదం కేవలం ‘కాని’ అనే అనుసంధానం కాకుండా, అదోనీయా ఊహను బలంగా సరిదిద్దే భావాన్ని కలిగి ఉంది.
- source_word: אֲדֹנֵינוּ הַמֶּלֶךְ דָּוִד
  choice: మన ప్రభువైన దావీదు రాజు
  rationale: రాజసభ సందర్భంలోని ‘మన ప్రభువు’ అనే గౌరవార్థక భావాన్ని, దావీదుకు ఉన్న రాజ బిరుదుతో సహజమైన తెలుగు క్రమంలో కలిపాం.
- source_word: הִמְלִיךְ
  choice: రాజుగా నియమించాడు
  rationale: מלך హిఫీల్ రూపం ఒకరిని రాజుగా చేయడం లేదా రాజ్యాధికారంలో నిలపడం అనే causative భావాన్ని ఇస్తుంది. ‘అభిషేకించాడు’ అనడం మూల క్రియకన్నా ప్రత్యేకమైన కార్యాన్ని చేర్చుతుంది.
- source_word: אֶת שְׁלֹמֹה
  choice: సొలొమోనును
  rationale: אֵת ప్రత్యక్ష కర్మ సూచికకు ప్రత్యేక పదం అవసరం లేదు; తెలుగు కర్మ విభక్తి ద్వారా సంబంధాన్ని వ్యక్తం చేశాం.
theological_decisions:
- issue: సొలొమోను రాజుగా చేయడంలో దావీదు పాత్ర
  choice: రాజుగా నియమించాడు
  alternative: రాజుగా అభిషేకించాడు
  rationale: వాక్యం దావీదు సొలొమోనును రాజ్యాధికారంలో నిలిపాడని చెబుతుంది; ఈ క్రియ ఒక్కటే అభిషేక విధిని స్పష్టంగా సూచించదు. అందువల్ల మూలంలోని విస్తృత భావాన్ని నిలుపుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించాం. రాజసభ సందర్భానికి తగిన ‘ప్రభువు’ అనే పదాన్ని ఉంచి, హీబ్రూ సంభాషణా సూత్రాన్ని తెలుగులో భారంగా కాకుండా సంక్షిప్తంగా వ్యక్తం చేశాం.
