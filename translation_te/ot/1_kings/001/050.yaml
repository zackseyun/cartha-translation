id: 1KI.1.50
reference: 1 Kings 1:50
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲדֹ֣נִיָּ֔הוּ יָרֵ֖א מִ/פְּנֵ֣י שְׁלֹמֹ֑ה וַ/יָּ֣קָם וַ/יֵּ֔לֶךְ וַֽ/יַּחֲזֵ֖ק בְּ/קַרְנ֥וֹת הַ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/050.yaml
  text: And Adonijah was afraid because of Solomon[a], so he arose and went and took hold of the horns of the altar.
translation:
  language: te
  text: అదోనీయా సొలొమోను కారణంగా భయపడి, లేచి వెళ్లి బలిపీఠపు కొమ్ములను పట్టుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: బలిపీఠపు కొమ్ములను పట్టుకోవడం ఆశ్రయం లేదా కరుణ కోరే చర్యగా ఉండేది.
    reason: cultural_note
lexical_decisions:
- source_word: יָרֵא מִפְּנֵי שְׁלֹמֹה
  choice: సొలొమోను కారణంగా భయపడ్డాడు
  rationale: יָרֵאతో కూడిన מִפְּנֵי ఇక్కడ భయానికి కారణాన్ని లేదా విషయాన్ని సూచిస్తుంది. ఈ అనువాదం దానిని స్థలార్థంగా కాకుండా సహజమైన కారణార్థంలో తెలియజేస్తుంది.
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: అతడు లేచి వెళ్లి
  rationale: హీబ్రూ కథనంలోని వరుస చర్యలను ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: וַיַּחֲזֵק
  choice: పట్టుకున్నాడు
  rationale: బలిపీఠపు కొమ్ములను ఆశ్రయార్థంగా పట్టుకున్న చర్యను నేరుగా తెలియజేస్తుంది; హింసాత్మకంగా స్వాధీనం చేసుకున్నాడనే అదనపు భావాన్ని చేర్చదు.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: బలిపీఠపు కొమ్ములు
  rationale: బలిపీఠం మూలల వద్ద పైకి పొడుచుకొచ్చిన భాగాలకు సంబంధించిన మూలభాషలోని ఆరాధనా పరిభాషను అక్షరార్థంగా నిలుపుతుంది.
- source_word: אֲדֹנִיָּהוּ
  choice: అదోనీయా
  rationale: వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించింది.
theological_decisions:
- issue: బలిపీఠపు కొమ్ములను పట్టుకోవడంలోని ఆశ్రయ లేదా కరుణాభ్యర్థన భావం
  choice: ప్రధాన పాఠ్యంలో శారీరక చర్యను మాత్రమే నేరుగా అనువదించి, దాని సాంస్కృతిక భావాన్ని పాదసూచికలో వివరించడం
  alternative: “ఆశ్రయం కోసం బలిపీఠం దగ్గరకు పారిపోయాడు” అని వివరణాత్మకంగా అనువదించడం
  rationale: మూలపాఠ్యం అతడు చేసిన చర్యను చెబుతుంది గాని దాని న్యాయపరమైన లేదా సంకేతార్థాన్ని స్పష్టంగా నిర్వచించదు. అందువల్ల అంతర్లీన భావాన్ని ప్రధాన పాఠ్యంలో నిర్ధారించకుండా, పాదసూచికలో నేపథ్యంగా అందించడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘బలిపీఠపు కొమ్ములు’ అనే ఆరాధనా సంబంధిత రూపకాన్ని పారాఫ్రేజ్ చేయకుండా నిలుపుకొని, అవసరమైన సాంస్కృతిక వివరణను పాదసూచికలో ఇచ్చాం.
