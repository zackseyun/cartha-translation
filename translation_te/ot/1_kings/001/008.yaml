source:
  edition: WLC
  text: וְ/צָד֣וֹק הַ֠/כֹּהֵן וּ/בְנָיָ֨הוּ בֶן יְהוֹיָדָ֜ע וְ/נָתָ֤ן הַ/נָּבִיא֙ וְ/שִׁמְעִ֣י וְ/רֵעִ֔י וְ/הַ/גִּבּוֹרִ֖ים אֲשֶׁ֣ר לְ/דָוִ֑ד לֹ֥א הָי֖וּ עִם אֲדֹנִיָּֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/008.yaml
  text: But Zadok the priest[a], Benaiah son of Jehoiada, Nathan the prophet, Shimei, Rei, and the mighty men who belonged to David were not with Adonijah.
translation:
  language: te
  text: కానీ యాజకుడైన సాదోకు, యెహోయాదా కుమారుడైన బెనాయా, ప్రవక్తయైన నాతాను, షిమీ, రేయీ, దావీదుకు చెందిన పరాక్రమశాలులు[a] అదోనీయాతో లేరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దావీదు పరాక్రమశాలులు.’ హీబ్రూ పదబంధానికి అక్షరార్థం ‘దావీదుకు చెందిన పరాక్రమశాలులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/צָד֣וֹק הַ֠/כֹּהֵן
  choice: కానీ యాజకుడైన సాదోకు
  rationale: ముందటి వచనంలోని అదోనీయా అనుచరుల జాబితాతో ఉన్న వ్యత్యాసాన్ని వְ సందర్భానుసారంగా ‘కానీ’ అని వ్యక్తం చేశాం. כֹּהֵןను సాధారణ, ఖచ్చితమైన పదమైన ‘యాజకుడు’గా అనువదించాం.
- source_word: וּ/בְנָיָ֨הוּ בֶן יְהוֹיָדָ֜ע
  choice: యెహోయాదా కుమారుడైన బెనాయా
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని సహజమైన తెలుగు క్రమంలో ఉంచి, రెండు వ్యక్తినామాలను తెలుగు బైబిలు సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וְ/נָתָ֤ן הַ/נָּבִיא֙
  choice: ప్రవక్తయైన నాతాను
  rationale: הַנָּבִיא అనే పదవిని ‘ప్రవక్త’గా నిలుపుతూ తెలుగులో సహజమైన విశేషణ నిర్మాణాన్ని వాడాం.
- source_word: וְ/שִׁמְעִ֣י וְ/רֵעִ֔י
  choice: షిమీ, రేయీ
  rationale: ఇవి వ్యక్తినామాలు; జాబితాలో ప్రతి సంధికారకాన్ని పునరావృతం చేయకుండా సహజమైన తెలుగు విరామచిహ్నాలతో ఇచ్చాం.
- source_word: וְ/הַ/גִּבּוֹרִ֖ים אֲשֶׁ֣ר לְ/דָוִ֑ד
  choice: దావీదుకు చెందిన పరాక్రమశాలులు
  rationale: גִּבּוֹרִים యోధబలాన్ని సూచిస్తుంది; ‘పరాక్రమశాలులు’ దాని విస్తృత భావాన్ని నిలుపుతుంది. אֲשֶׁר לְדָוִדలోని సంబంధాన్ని ‘దావీదుకు చెందిన’ అని స్పష్టంగా, కానీ అతి వ్యాఖ్యానం లేకుండా తెలిపాం.
- source_word: לֹ֥א הָי֖וּ עִם אֲדֹנִיָּֽהוּ
  choice: అదోనీయాతో లేరు
  rationale: హీబ్రూలోని సరళమైన ‘అతనితో లేరు’ అనే నిర్మాణాన్ని నిలిపాం; రాజకీయంగా మద్దతివ్వలేదనే సందర్భార్థాన్ని వాక్యంలో అదనంగా చేర్చలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. పేర్లను తెలుగు బైబిలు వాడుకకు దగ్గరగా లిప్యంతరీకరించాం; మూలంలోని జాబితా నిర్మాణం, వ్యత్యాసం, ‘తో లేరు’ అనే నియంత్రిత భావవ్యక్తీకరణను కాపాడాం.
