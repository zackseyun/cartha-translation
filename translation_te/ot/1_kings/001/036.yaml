source:
  edition: WLC
  text: וַ/יַּ֨עַן בְּנָיָ֧הוּ בֶן יְהֽוֹיָדָ֛ע אֶת הַ/מֶּ֖לֶךְ וַ/יֹּ֣אמֶר אָמֵ֑ן כֵּ֚ן יֹאמַ֣ר יְהוָ֔ה אֱלֹהֵ֖י אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/036.yaml
  text: Benaiah son of Jehoiada answered the king and said[a], “Amen! May Yahweh, the God of my lord the king, say so.”
translation:
  language: te
  text: 'యెహోయాదా కుమారుడు బెనాయా రాజుకు జవాబిచ్చి ఇలా అన్నాడు: “ఆమేన్! నా ప్రభువైన రాజు యొక్క దేవుడైన యహ్వే అలాగే చెప్పుగాక[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమేన్! నా ప్రభువైన రాజు యొక్క దేవుడైన యహ్వే అట్లే చెప్పుగాక.” హీబ్రూ క్రియను అక్షరార్థంగా ‘చెప్పు’ అని అనువదించవచ్చు; ఇక్కడ రాజు సంకల్పాన్ని దేవుడు ధృవీకరించడం లేదా స్థిరపరచడం అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: జవాబిస్తూ ... అన్నాడు
  rationale: హీబ్రూ కథనంలోని ‘జవాబిచ్చి చెప్పాడు’ అనే ద్వంద్వ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు సంభాషణా రూపంలో వ్యక్తం చేస్తుంది.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: యెహోయాదా కుమారుడు బెనాయా
  rationale: హీబ్రూ వ్యక్తినామాలను తెలుగు లిపిలో ధ్వన్యనుకరణ చేసి, వంశసంబంధాన్ని సహజ తెలుగు క్రమంలో ఉంచింది.
- source_word: אָמֵן
  choice: ఆమేన్!
  rationale: సమ్మతి మరియు ఆకాంక్ష రెండింటినీ తెలిపే మూలపదపు ఆరాధనా-ప్రయోగ బలాన్ని నిలుపుతుంది.
- source_word: כֵּן יֹאמַר
  choice: కూడా అలాగే చెప్పుగాక
  rationale: సందర్భంలో ఇది సాధారణ భవిష్యత్తు వాక్యం కాక, రాజు తెలిపిన సంకల్పాన్ని దేవుడు ధృవీకరించాలనే ఆకాంక్ష. ‘చెప్పుగాక’ ఆ ఆశీర్వాదాత్మక భావాన్ని నిలుపుతుంది; ‘కూడా అలాగే’ రాజు పలికిన మాటకు యహ్వే సమ్మతి పలకాలనే సంబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు ధ్వన్యనుకరణలో అందిస్తుంది.
- source_word: אֱלֹהֵי אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజు దేవుడైన
  rationale: ‘నా ప్రభువు, రాజు’ అనే సభామర్యాద భావాన్నీ, అతని దేవుడు అనే సంబంధాన్నీ సంక్షిప్తంగా మరియు సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది; అందువల్ల దానిని బిరుదుగా మార్చకుండా ధ్వన్యనుకరణ చేయబడింది.
- issue: יֹאמַר యొక్క భావం
  choice: చెప్పుగాక
  alternative: చెబుతాడు
  rationale: ‘ఆమేన్’ తరువాతి సందర్భం దీనిని సాధారణ భవిష్యత్తుగా కాక, దేవుని ధృవీకరణ కోరే ఆకాంక్షాత్మక ప్రయోగంగా సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ రాజసభ సందర్భానికి తగిన గౌరవపూర్వక, గంభీర శైలి పాటించబడింది. ‘ఆమేన్,’ ‘యహ్వే’ వంటి మూలపాఠానికి ముఖ్యమైన పదాలు నిలుపబడ్డాయి.
