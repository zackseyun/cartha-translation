  yaml_path: translation/ot/1_kings/001/001.yaml
  text: King David was old[a], advanced in days; and they covered him with garments, but he could not get warm.
translation:
  language: te
  text: దావీదు రాజు వృద్ధుడు, బాగా వయసు మళ్లినవాడు[a]. వారు ఆయనను వస్త్రాలతో కప్పారు, కానీ ఆయనకు వెచ్చదనం కలగలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘దినాలలోకి వచ్చాడు’; ఇది బాగా వయసు మళ్లినవాడని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ דָּוִד
  choice: దావీదు రాజు
  rationale: తెలుగులో సహజమైన బిరుదు–పేరు క్రమాన్ని అనుసరించి, מֶלֶךְ‌ను ‘రాజు’గా, דָּוִד‌ను ప్రామాణిక తెలుగు నామరూపమైన ‘దావీదు’గా ఇచ్చాం. ఆరంభంలోని וְ‌ను ప్రత్యేక కాలసూచక పదంగా విస్తరించలేదు.
- source_word: זָקֵן
  choice: వృద్ధుడై
  rationale: దావీదు ముసలితనాన్ని నేరుగా, గౌరవప్రదమైన ఆధునిక తెలుగు శైలిలో తెలియజేస్తుంది.
- source_word: בָּא בַּיָּמִים
  choice: వయసు మళ్లినవాడయ్యాడు[a]
  rationale: ‘దినాల్లో ప్రవేశించాడు’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థక రూపం; బాగా వృద్ధాప్యానికి చేరిన భావాన్ని వ్యక్తం చేస్తూ మూలంలోని రెండవ వయోవర్ణనను నిలుపుతుంది.
- source_word: וַיְכַסֻּהוּ בַּבְּגָדִים
  choice: వారు ఆయనను వస్త్రాలతో కప్పారు
  rationale: కర్తను మూలంలోని అనిర్దిష్ట బహువచనంగానే ‘వారు’ అని ఉంచి, בְּגָדִים‌ను ఊహాత్మకంగా ‘దుప్పట్లు’ అనకుండా సాధారణ అర్థమైన ‘వస్త్రాలు’గా అనువదించాం.
- source_word: וְלֹא יִחַם לוֹ
  choice: అయినా ఆయనకు వెచ్చదనం కలగలేదు
  rationale: חם సూచించే వెచ్చబడటాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. ముందటి ప్రయత్నం ఫలించలేదనే సందర్భోచిత వ్యత్యాసాన్ని ‘అయినా’ తెలియజేస్తుంది.
