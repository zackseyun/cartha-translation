  register: ఆధునిక ప్రామాణిక తెలుగు; రాజవృత్తాంతానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని వృద్ధాప్యాన్ని తెలిపే రెండు సమీప పదబంధాలనూ తొలగించకుండా నిలిపాం.
