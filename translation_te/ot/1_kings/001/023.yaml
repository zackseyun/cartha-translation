review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the report concerning Nathan, his coming before the king, and his deeply deferential act. However, “సాష్టాంగ నమస్కారం” conventionally specifies an eight-limbed prostration, whereas the Hebrew specifically describes bowing with his face to the ground. A more direct rendering preserves that stated gesture without adding that culturally specific detail.
  naturalness: The Telugu is clear and suitably formal for a royal-court setting. “రాజు ఎదుటకు” is slightly more idiomatic than “రాజు సమక్షంలోకి,” and the revised final clause is natural while retaining the concrete posture in the source.
  terminology: “నాతాను ప్రవక్త” is the standard Telugu biblical form. “ఇదిగో” appropriately renders הִנֵּה. Replacing “సాష్టాంగ నమస్కారం” avoids importing a more narrowly defined ritual term than the Hebrew warrants.
  issues:
  - severity: medium
    issue: “సాష్టాంగ నమస్కారం” adds a specific eight-limbed form of prostration.
    rationale: וַיִּשְׁתַּחוּ ... עַל־אַפָּיו אָרְצָה describes bowing/prostrating with the face to the ground, but does not specify the full bodily form denoted by “సాష్టాంగ.”
  revised_text: అప్పుడు వారు రాజుతో, “ఇదిగో, నాతాను ప్రవక్త వచ్చాడు” అని చెప్పారు. అతడు రాజు ఎదుటకు వచ్చి, ముఖం నేలకు తగిలేలా రాజుకు నమస్కరించాడు.
