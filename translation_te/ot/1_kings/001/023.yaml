  text: And they told the king, saying, “Look, Nathan the prophet is here.” And he came before the king and bowed down to the king with his face to the ground.
translation:
  language: te
  text: అప్పుడు వారు రాజుతో, “ఇదిగో, నాతాను ప్రవక్త వచ్చాడు” అని చెప్పారు. అతడు రాజు ఎదుటకు వచ్చి, ముఖం నేలకు తగిలేలా రాజుకు నమస్కరించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: సమక్షంలోకి వచ్చిన వ్యక్తిని గమనింపజేసే హీబ్రూ సూచనార్థక పదానికి సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: וַיִּשְׁתַּחוּ
  choice: సాష్టాంగ నమస్కారం చేశాడు
  rationale: రాజు ఎదుట గౌరవంతో నేలకు వంగి నమస్కరించే చర్యను సందర్భానుకూలంగా వ్యక్తపరుస్తుంది.
- source_word: עַל־אַפָּיו אָרְצָה
  choice: నేలవరకు ముఖం వంచి
  rationale: ముఖం నేలవైపు ఉండేంతగా వంగిన భంగిమను మూలపాఠానికి దగ్గరగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
