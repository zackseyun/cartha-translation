id: 1KI.1.5
reference: 1 Kings 1:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲדֹנִיָּ֧ה בֶן חַגִּ֛ית מִתְנַשֵּׂ֥א לֵ/אמֹ֖ר אֲנִ֣י אֶמְלֹ֑ךְ וַ/יַּ֣עַשׂ ל֗/וֹ רֶ֚כֶב וּ/פָ֣רָשִׁ֔ים וַ/חֲמִשִּׁ֥ים אִ֖ישׁ רָצִ֥ים לְ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/005.yaml
  text: Adonijah the son of Haggith exalted himself[a], saying, “I will reign.” So he made for himself a chariot, horsemen[b], and fifty men running before him.
translation:
  language: te
  text: హగ్గీతు కుమారుడైన అదోనీయా తనను తాను గొప్ప చేసుకుంటూ[a], “నేను రాజ్యమేలుతాను[b]” అని అన్నాడు. అతడు తన కోసం ఒక రథాన్ని, గుర్రపు రౌతులను, తన ముందు పరుగెత్తే యాభై మంది పురుషులను ఏర్పాటు చేసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తనను తాను పైకి లేపుకుంటూ,” లేదా “తనను తాను గొప్పవాడిగా చేసుకుంటూ.” హీబ్రూ క్రియలో తనను తానే హెచ్చించుకునే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నేను రాజునవుతాను.”
    reason: alternative_reading
lexical_decisions:
- source_word: מִתְנַשֵּׂא
  choice: తనను తాను గొప్ప చేసుకుంటూ
  rationale: హిత్పయేల్ రూపంలోని ఆత్మోన్నతి, స్వీయప్రచారం అనే ప్రతికూల ఛాయను సహజమైన తెలుగులో నిలుపుతుంది; వర్తమాన కృదంత రూపం చర్య కొనసాగుతున్న భావాన్ని కూడా ప్రతిబింబిస్తుంది.
- source_word: לֵאמֹר אֲנִי אֶמְלֹךְ
  choice: “నేను రాజ్యమేలుతాను” అని అన్నాడు
  rationale: מלך క్రియ యొక్క రాజుగా పాలించడం అనే క్రియాత్మక భావాన్ని ‘రాజ్యమేలుతాను’ నేరుగా నిలుపుతుంది. ‘నేను రాజునవుతాను’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וַיַּעַשׂ לוֹ
  choice: అతడు తన కోసం ... ఏర్పాటు చేసుకున్నాడు
  rationale: עשה అక్షరార్థంగా ‘చేశాడు’ అయినప్పటికీ, రథం మరియు రాజపరివారాన్ని సిద్ధం చేసుకున్న సందర్భంలో ‘ఏర్పాటు చేసుకున్నాడు’ సహజంగా ఉండి, వాటిని ఏ విధంగా సంపాదించాడో అనవసరంగా నిర్ణయించదు.
- source_word: רֶכֶב
  choice: ఒక రథం
  rationale: హీబ్రూ ఏకవచనాన్ని నిలుపుతూ, సందర్భంలోని రాజవాహనాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: פָרָשִׁים
  choice: గుర్రపు రౌతులు
  rationale: రాజ ఊరేగింపులో గుర్రాలపై వెళ్లే పరివారాన్ని సూచించే సహజమైన తెలుగు పదబంధం; సాంకేతిక సైనిక పదమైన ‘అశ్వదళం’ కంటే మూలంలోని బహువచన వ్యక్తులను స్పష్టంగా చూపుతుంది.
- source_word: חֲמִשִּׁים אִישׁ
  choice: యాభై మంది పురుషులు
  rationale: אִישׁ లోని పురుషలింగ సూచనను నిలుపుతుంది; సంఖ్యతో సహజమైన తెలుగు నిర్మాణాన్ని ఉపయోగిస్తుంది.
- source_word: רָצִים לְפָנָיו
  choice: తన ముందు పరుగెత్తే
  rationale: అతని ముందుగా పరుగెత్తే రాజపరివార సేవకుల పనిని కృదంత రూపంలో సంక్షిప్తంగా, చిత్రాత్మకంగా నిలుపుతుంది.
theological_decisions:
- issue: అదోనీయా చర్యను చిత్రించే విధానం
  choice: ‘తనను తాను గొప్ప చేసుకుంటూ’ అని అనువదించడం
  alternative: ‘తనను తాను రాజుగా నిలబెట్టుకుంటూ’ లేదా ‘తనను తాను పైకి లేపుకుంటూ’
  rationale: మూలంలోని ఆత్మోన్నతి పట్ల అంతర్లీన విమర్శను నిలుపుతుంది; అయితే అతడు అప్పటికే తనను రాజుగా ప్రకటించుకున్నాడని క్రియలోనే అదనంగా చేర్చదు.
- issue: రాజ్యాధికార దావా
  choice: ‘నేను రాజ్యమేలుతాను’
  alternative: ‘నేను రాజునవుతాను’
  rationale: מלך క్రియలోని ‘పాలించు/రాజ్యమేలు’ భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, స్థితిని సూచించే సమానార్థక పఠనాన్ని పాదటిప్పణిలో ఇస్తుంది.
- issue: రాజపరివారంలోని లింగ సూచన
  choice: ‘యాభై మంది పురుషులు’
  alternative: ‘యాభై మంది’ లేదా ‘యాభై మంది పరుగెత్తేవారు’
  rationale: హీబ్రూ אִישׁ లో స్పష్టంగా ఉన్న పురుష సూచనను తొలగించకుండా అనువదిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘రాజ్యమేలు’ సాధారణ పాఠకులకు అర్థమయ్యే సాహిత్య గౌరవాన్ని కలిగి ఉంది. పాదటిప్పణి సూచికలు సంబంధిత పదబంధాల వెంటనే ఉంచబడ్డాయి.
