  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר הָיָ֤ה יְהוָה֙ עִם אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כֵּ֖ן יהי עִם שְׁלֹמֹ֑ה וִֽ/יגַדֵּל֙ אֶת כִּסְא֔/וֹ מִ֨/כִּסֵּ֔א אֲדֹנִ֖/י הַ/מֶּ֥לֶךְ דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/037.yaml
  text: Just as Yahweh has been with my lord the king[a], so may he be with Solomon and make his throne greater than the throne of my lord King David.
translation:
  language: te
  text: యాహ్వే నా ప్రభువైన రాజుతో ఉన్నట్లే, సొలొమోనుతో కూడా ఉండి[a], అతని సింహాసనాన్ని నా ప్రభువైన రాజైన దావీదు సింహాసనం కంటే గొప్పదిగా చేయుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే సొలొమోనుతో కూడా ఉండుగాక.” హీబ్రూలో “ఉండుగాక” అనే క్రియకు కర్త ప్రత్యక్షంగా పేర్కొనబడలేదు; అది ముందటి భాగంలోని యాహ్వేను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన వ్యక్తినామ రూపం ‘యెహోవా’గా అందించాం.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: ఉన్నట్లే ... కూడా
  rationale: మొదటి భాగంలోని దావీదుతో దేవుని సన్నిధిని, రెండవ భాగంలోని సొలొమోనుకు కోరుతున్న సన్నిధితో పోల్చే హీబ్రూ సహసంబంధ నిర్మాణాన్ని సహజమైన తెలుగులో నిలిపింది.
- source_word: הָיָה ... עִם
  choice: తోడుగా ఉన్నట్లే
  rationale: దేవుని సన్నిధి, సహాయం అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, దావీదుతో ఆయన ఉన్న వాస్తవాన్ని సూచిస్తుంది.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజు
  rationale: రాజసభలోని గౌరవసూచక సంబోధనను, స్వామ్యసూచక ‘నా’తో సహా నిలిపింది.
- source_word: יהי
  choice: తోడుగా ఉండి ... చేయుగాక
  rationale: హీబ్రూ ఆశీర్వాదార్థక జస్సివ్ భావాన్ని ‘చేయుగాక’తో వ్యక్తం చేశాం; అంతర్నిహిత కర్త పూర్వ భాగంలోని యెహోవానే.
- source_word: וִיגַדֵּל
  choice: గొప్పదిగా చేయుగాక
  rationale: హిఫిల్ రూపంలోని కారణార్థక ‘గొప్పగా చేయు’ భావాన్ని, సింహాసనాల మధ్య పోలికతో సహా స్పష్టంగా అందిస్తుంది.
- source_word: כִּסְאוֹ
  choice: అతని సింహాసనం
  rationale: రాజ్యం లేదా పరిపాలనగా విపులీకరించకుండా, మూలంలోని స్పష్టమైన సింహాసన రూపకాన్ని నిలిపింది.
- source_word: מִכִּסֵּא
  choice: సింహాసనం కంటే
  rationale: מן సూచించే తులనార్థాన్ని తెలుగులో సహజమైన ‘కంటే’తో వ్యక్తం చేసింది.
- source_word: אֲדֹנִי הַמֶּלֶךְ דָּוִד
  choice: నా ప్రభువైన దావీదు రాజు
  rationale: దావీదు పట్ల వక్త చూపే విధేయ గౌరవాన్ని నిలుపుతూ, తెలుగులో సహజమైన నామ-బిరుదు క్రమాన్ని వాడింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
- issue: יהי లో అంతర్నిహిత కర్త
  choice: యెహోవానే కర్తగా సందర్భానుసారంగా ఉంచడం
  alternative: ‘యెహోవా సొలొమోనుకు కూడా తోడుగా ఉండుగాక’ అని పేరును మళ్లీ స్పష్టంగా పేర్కొనడం
  rationale: హీబ్రూలో కర్త ప్రత్యేకంగా పునరుక్తం కాలేదు; అది ముందున్న యెహోవాను సూచిస్తుంది. ప్రధాన పాఠం ఈ అంతర్నిహిత సంబంధాన్ని నిలుపుతుంది; పాదటిప్పణి స్పష్టమైన ప్రత్యామ్నాయాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజసభకు తగిన గౌరవభరితమైన కాని సాధారణ పాఠకుడికి సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘సింహాసనం’ అనే మూల రూపకాన్ని నిలిపి, ఆశీర్వాదార్థాన్ని ‘చేయుగాక’తో వ్యక్తం చేశాం.
