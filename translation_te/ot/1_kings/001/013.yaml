id: 1KI.1.13
reference: 1 Kings 1:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לְכִ֞י וּ/בֹ֣אִי אֶל הַ/מֶּ֣לֶךְ דָּוִ֗ד וְ/אָמַ֤רְתְּ אֵלָי/ו֙ הֲ/לֹֽא אַתָּ֞ה אֲדֹנִ֣/י הַ/מֶּ֗לֶךְ נִשְׁבַּ֤עְתָּ לַ/אֲמָֽתְ/ךָ֙ לֵ/אמֹ֔ר כִּֽי שְׁלֹמֹ֤ה בְנֵ/ךְ֙ יִמְלֹ֣ךְ אַחֲרַ֔/י וְ/ה֖וּא יֵשֵׁ֣ב עַל כִּסְאִ֑/י וּ/מַדּ֖וּעַ מָלַ֥ךְ אֲדֹנִיָֽהוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/013.yaml
  text: Please go in to King David and say to him[a], ‘My lord the king, did you not swear to your servant, saying, “Solomon your son shall reign after me, and he shall sit on my throne”? Why then has Adonijah become king?’
translation:
  language: te
  text: 'నీవు రాజు దావీదు సమక్షంలోకి వెళ్లి, ఆయనతో ఇలా చెప్పు: “నా ప్రభువైన రాజా, ‘నీ కుమారుడైన సొలొమోను నా తర్వాత రాజ్యమేలుతాడు; అతడు నా సింహాసనం మీద కూర్చుంటాడు’ అని నీ దాసురాలైన నాతో[a] నీవు ప్రమాణం చేయలేదా? మరి అదోనీయా ఎందుకు రాజయ్యాడు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం ప్రత్యేకంగా స్త్రీలింగంలో ఉంది. రాజు ఎదుట బత్షెబ తనను తాను వినయంగా ‘నీ దాసురాలు’ అని పేర్కొంటోంది.
    reason: lexical_clarification
lexical_decisions:
- source_word: לְכִי וּבֹאִי
  choice: దగ్గరికి వెళ్లి
  rationale: స్త్రీ ఏకవచనంలోని వరుస ఆజ్ఞారూపాలు ‘వెళ్లు, లోపలికి ప్రవేశించు’ అనే భావాన్ని ఇస్తాయి. తెలుగు సహజ వాక్యనిర్మాణంలో రాజును సమీపించి లోపలికి వెళ్లడాన్ని ‘దగ్గరికి వెళ్లి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶל הַמֶּלֶךְ דָּוִד
  choice: రాజైన దావీదు దగ్గరికి
  rationale: హీబ్రూ పదక్రమంలోని బిరుదు-పేరును ఆధునిక తెలుగులో సహజంగా, గౌరవంగా వ్యక్తపరుస్తుంది.
- source_word: וְאָמַרְתְּ אֵלָיו
  choice: ఆయనతో ఇలా చెప్పు
  rationale: హీబ్రూ అనుక్రమ రూపానికి తెలుగులో సహజమైన ఆజ్ఞార్థ కొనసాగింపు; ‘ఆయన’ రాజుకు తగిన గౌరవ సూచకం.
- source_word: הֲלֹא
  choice: చేయలేదా?
  rationale: అంగీకారాన్ని ఆశించే అలంకార ప్రశ్నను తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజా
  rationale: ఇది దేవుని నామం కాదు, మానవ రాజుకు చెప్పే సభామర్యాదగల సంబోధన. ‘ప్రభువు’ గౌరవార్థాన్ని కాపాడుతుంది.
- source_word: נִשְׁבַּעְתָּ
  choice: ప్రమాణం చేయలేదా
  rationale: సాధారణ వాగ్దానం కంటే గంభీరమైన ప్రమాణార్థాన్ని సరిగ్గా తెలియజేస్తుంది.
- source_word: לַאֲמָתְךָ
  choice: నీ దాసురాలినైన నాకు
  rationale: మూలంలోని నామవాచకం స్త్రీలింగంలో ఉంది; బత్షెబ తనను రాజు ఎదుట వినయంగా సూచించుకునే భావాన్ని తెలుగులో ప్రత్యక్షంగా కాపాడుతుంది.
- source_word: לֵאמֹר כִּי
  choice: అని
  rationale: ప్రమాణంలోని మాటలను పరిచయం చేసే సహజ తెలుగు నిర్మాణం. ఇక్కడ כִּי కి అనవసరంగా ‘నిశ్చయంగా’ అనే ఉద్ఘాటనను చేర్చలేదు.
- source_word: שְׁלֹמֹה בְנֵךְ
  choice: నీ కుమారుడైన సొలొమోను
  rationale: సంబంధాన్ని స్పష్టంగా, ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: יִמְלֹךְ אַחֲרַי
  choice: నా తర్వాత రాజ్యమేలుతాడు
  rationale: రాజ్యాధికారాన్ని మరియు వారసత్వ క్రమాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי
  choice: అతడే నా సింహాసనం మీద కూర్చుంటాడు
  rationale: హీబ్రూలోని స్వతంత్ర సర్వనామం ఇచ్చే ప్రాధాన్యాన్ని ‘అతడే’ ద్వారా, సింహాసనారోహణ భాషను యథాతథంగా కాపాడుతుంది.
- source_word: וּמַדּוּעַ מָלַךְ אֲדֹנִיָהוּ
  choice: మరి అదోనీయా ఎందుకు రాజయ్యాడు?
  rationale: ముందున్న ప్రమాణం ఆధారంగా లేవనెత్తిన పర్యవసాన ప్రశ్నను ‘మరి’ సహజంగా తెలియజేస్తుంది; సంపూర్ణ క్రియ రాజుగా ఏర్పడిన ప్రస్తుత పరిస్థితిని సూచిస్తుంది.
