translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజసభకు తగిన గౌరవభావాన్ని ఉంచుతూ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం. మూలంలోని స్త్రీలింగ స్వీయసూచనను ప్రధాన పాఠ్యంలోనే నిలిపి, పాదటిప్పణిలో దాని సందర్భాన్ని వివరించాం.
