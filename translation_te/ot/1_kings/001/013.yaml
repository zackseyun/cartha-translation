revisions:
- from: 'నీవు రాజైన దావీదు దగ్గరికి వెళ్లి, ఆయనతో ఇలా చెప్పు: “నా ప్రభువైన రాజా, ‘నీ కుమారుడైన సొలొమోను నా తర్వాత రాజ్యమేలుతాడు; అతడే నా సింహాసనం మీద కూర్చుంటాడు’ అని నీ దాసురాలినైన నాకు[a] నీవు ప్రమాణం చేయలేదా? మరి అదోనీయా ఎందుకు రాజయ్యాడు?”'
  to: 'నీవు రాజు దావీదు సమక్షంలోకి వెళ్లి, ఆయనతో ఇలా చెప్పు: “నా ప్రభువైన రాజా, ‘నీ కుమారుడైన సొలొమోను నా తర్వాత రాజ్యమేలుతాడు; అతడు నా సింహాసనం మీద కూర్చుంటాడు’ అని నీ దాసురాలైన నాతో[a] నీవు ప్రమాణం చేయలేదా? మరి అదోనీయా ఎందుకు రాజయ్యాడు?”'
  rationale: The revision preserves the meaning and rhetorical force of the source while restoring the opening movement into the king's presence, making the feminine self-reference idiomatic in Telugu, and avoiding unnecessary contrastive emphasis on Solomon.
