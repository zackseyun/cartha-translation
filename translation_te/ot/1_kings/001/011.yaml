reference: 1 Kings 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר נָתָ֗ן אֶל בַּת שֶׁ֤בַע אֵם שְׁלֹמֹה֙ לֵ/אמֹ֔ר הֲ/ל֣וֹא שָׁמַ֔עַתְּ כִּ֥י מָלַ֖ךְ אֲדֹנִיָּ֣הוּ בֶן חַגִּ֑ית וַ/אֲדֹנֵ֥י/נוּ דָוִ֖ד לֹ֥א יָדָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/011.yaml
  text: Then Nathan said to Bathsheba[a], Solomon’s mother, “Have you not heard that Adonijah son of Haggith has become king, and our lord David does not know it?”
translation:
  language: te
  text: 'అప్పుడు నాతాను సొలొమోను తల్లి బత్షెబతో ఇలా అన్నాడు: “హగ్గీతు కుమారుడు అదోనీయా రాజయ్యాడని[a], మన ప్రభువైన దావీదుకు అది తెలియదని నీవు వినలేదా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తనను తానే రాజుగా చేసుకున్నాడు.” హీబ్రూ పదానికి అక్షరార్థంగా “రాజయ్యాడు/ఏలాడు” అని భావం. సందర్భం అతడు తనను తానే హెచ్చించుకున్నాడని సూచించవచ్చు, కాని ఇక్కడి పదప్రయోగం దానిని స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: בַּת שֶׁבַע אֵם שְׁלֹמֹה
  choice: సొలొమోను తల్లి బత్షెబతో
  rationale: బత్షెబను సొలొమోను తల్లిగా గుర్తించే మూలంలోని సంబంధాన్ని సహజ తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: לֵאמֹר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ వాక్యారంభ సూత్రంలోని భావాన్ని నేరుగా ‘చెప్పుతూ’ అని భారంగా చేయకుండా, ప్రత్యక్ష సంభాషణకు సహజమైన తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: הֲלוֹא שָׁמַעַתְּ
  choice: నీవు వినలేదా?
  rationale: సమ్మతిని ఆశించే అలంకార ప్రశ్న స్వరాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: מָלַךְ
  choice: రాజయ్యాడు
  rationale: క్రియలోని రాజుగా కావడం/ఏలడం అనే ఘటనాత్మక భావాన్ని సంక్షిప్తంగా ఇస్తుంది; ‘తనను తానే రాజుగా చేసుకున్నాడు’ అనే సందర్భసూచిత భావాన్ని మూలపదంలో స్పష్టంగా లేనందున ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: אֲדֹנִיָּהוּ בֶן חַגִּית
  choice: హగ్గీతు కుమారుడు అదోనీయా
  rationale: వ్యక్తి పేర్లను తెలుగు లిపిలో లిప్యంతరీకరించి, పుత్ర సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וַאֲדֹנֵינוּ דָוִד
  choice: మన ప్రభువైన దావీదు
  rationale: దావీదుకు వర్తించే మానవ రాజసభ గౌరవ బిరుదును నిలుపుతుంది; ‘ప్రభువు’ ఇక్కడ దేవుని నామం కాదు, మానవ అధిపతికి గౌరవసూచకం.
- source_word: לֹא יָדָע
  choice: ఆ సంగతి తెలియదు
  rationale: హీబ్రూలో అంతర్నిహితంగా ఉన్న కర్మను తెలుగులో ‘ఆ సంగతి’గా స్పష్టం చేసి, వర్తమాన ప్రాసంగికతను సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దావీదుకు వాడిన אֲדֹנֵינוּ పదం
  choice: మన ప్రభువైన దావీదు
  alternative: మన యజమానియైన దావీదు
  rationale: ఇది రాజైన దావీదుకు ఇచ్చిన మానవ గౌరవ బిరుదు; దైవ నామం కాదు. ‘ప్రభువు’ రాజసభ గౌరవాన్ని నిలుపుతుండగా సందర్భం మానవ సూచనను స్పష్టం చేస్తుంది.
- issue: מָלַךְ లో స్వయంఘోషణ భావం
  choice: రాజయ్యాడు
  alternative: తనను తానే రాజుగా చేసుకున్నాడు
  rationale: సందర్భం అదోనీయా స్వయంగా అధికారం చేపట్టాడని సూచించినా, ఈ హీబ్రూ క్రియ స్వయంఘోషణను స్పష్టంగా చెప్పదు. అందువల్ల ఆ వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చకుండా ప్రత్యామ్నాయంగా పాదటిప్పణిలో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. పేర్లు సాంప్రదాయ తెలుగు బైబిలు రూపాలకు సమీపంగా ఉంచబడ్డాయి; అలంకార ప్రశ్న స్వరం నిలుపబడింది.
