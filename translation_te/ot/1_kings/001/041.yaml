translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి పాటించబడింది. మూలంలోని కాలసంబంధ అనిశ్చితిని ప్రధాన పాఠ్యం మరియు పాదసూచిక ద్వారా నిలుపుకున్నాం; ‘షోఫార్’ అనే సాంస్కృతిక పదార్థాన్ని పాఠ్యంలో ‘బూర’గా, పాదసూచికలో వివరణతో ఇచ్చాం.
