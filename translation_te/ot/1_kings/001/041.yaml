  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע אֲדֹנִיָּ֗הוּ וְ/כָל הַ/קְּרֻאִים֙ אֲשֶׁ֣ר אִתּ֔/וֹ וְ/הֵ֖ם כִּלּ֣וּ לֶ/אֱכֹ֑ל וַ/יִּשְׁמַ֤ע יוֹאָב֙ אֶת ק֣וֹל הַ/שּׁוֹפָ֔ר וַ/יֹּ֕אמֶר מַדּ֥וּעַ קֽוֹל הַ/קִּרְיָ֖ה הוֹמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/041.yaml
  text: Adonijah and all the invited guests who were with him heard it as they finished eating[a]. And when Joab heard the sound of the trumpet, he said[b], “Why is the sound of the city in an uproar?”
translation:
  language: te
  text: అదోనీయా, అతనితో ఉన్న ఆహ్వానితులందరూ భోజనం ముగిస్తున్న సమయంలో ఆ శబ్దం విన్నారు.[a] యోవాబు బూర శబ్దం విని,[b] “పట్టణం ఎందుకు ఇలా కోలాహలంగా ఉంది?” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారు భోజనం ముగించగానే.” ఈ హీబ్రూ వాక్యభాగం భోజనం ముగుస్తున్న సమయాన్నిగానీ, అది ముగిసిన వెంటనే వచ్చిన క్షణాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: షోఫార్—ప్రజలకు సంకేతాలు ఇవ్వడానికి ఉపయోగించే కొమ్ముతో చేసిన బూర.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ఆ శబ్దం విన్నారు
  rationale: క్రియకు మూలార్థం ‘విన్నారు.’ సందర్భంలో ముందుగా వినిపించిన వేడుక శబ్దాన్ని సూచించేందుకు తెలుగులో సహజంగా ‘ఆ శబ్దం’ అని స్పష్టంచేశాం.
- source_word: הַקְּרֻאִים
  choice: ఆహ్వానితులందరూ
  rationale: קרא ధాతువు యొక్క కర్మణి కృదంతం; విందు సందర్భంలో ‘ఆహ్వానితులు’ సహజమైన, నిర్దిష్టమైన అర్థాన్ని ఇస్తుంది.
- source_word: וְהֵם כִּלּוּ לֶאֱכֹל
  choice: భోజనం ముగిస్తున్న సమయంలో
  rationale: వారు శబ్దం విన్న సమయాన్ని ఈ వాక్యభాగం సూచిస్తుంది. భోజనం అప్పుడే ముగుస్తున్న భావాన్ని నిలుపుతూ, అది పూర్తయిన క్షణమనే ప్రత్యామ్నాయ అవగాహనను పాదసూచికలో ఇచ్చాం.
- source_word: קוֹל הַשּׁוֹפָר
  choice: బూర శబ్దం
  rationale: שׁוֹפָר ప్రజా సంకేతాల కోసం ఊదే కొమ్ము వాద్యం. ఆధునిక తెలుగులో సందర్భానికి సహజంగా ‘బూర’ అని అనువదించాం; సాంస్కృతిక వివరాన్ని పాదసూచికలో ఉంచాం.
- source_word: מַדּוּעַ
  choice: ఎందుకు
  rationale: నేర ప్రశ్నార్థక పదానికి సంక్షిప్తమైన సహజ తెలుగు సమానం.
- source_word: קוֹל הַקִּרְיָה הוֹמָה
  choice: పట్టణంలో ఈ కలకల శబ్దం
  rationale: కִרְיָה అంటే పట్టణం; הוֹמָה శబ్దభరితమైన అలజడి లేదా కోలాహలాన్ని తెలియజేస్తుంది. ‘పట్టణంలో ఈ కలకల శబ్దం’ తెలుగు ప్రశ్నలో సహజంగా ఉండి మూల భావాన్ని నిలుపుతుంది.
- source_word: אֲדֹנִיָּהוּ
  choice: అదోనీయా
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: יוֹאָב
  choice: యోవాబు
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
