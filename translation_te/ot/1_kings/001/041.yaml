  to: అదోనీయా, అతనితో ఉన్న ఆహ్వానితులందరూ భోజనం ముగిస్తున్న సమయంలో ఆ శబ్దం విన్నారు.[a] యోవాబు బూర శబ్దం విని,[b] “పట్టణం ఎందుకు ఇలా కోలాహలంగా ఉంది?” అని అడిగాడు.
