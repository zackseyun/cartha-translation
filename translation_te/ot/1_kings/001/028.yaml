translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. రాజసభ సందర్భాన్ని చూపడానికి ‘సన్నిధికి’ వాడినా, వాక్యాన్ని అతిగా ప్రాచీనంగా చేయలేదు. మూలంలోని రెండు సార్లు వచ్చే ‘రాజు ఎదుట/సన్నిధిలో’ భావాన్ని ఉద్దేశపూర్వకంగా నిలిపింది.
