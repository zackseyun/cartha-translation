  yaml_path: translation/ot/1_kings/001/028.yaml
  text: Then King David answered and said[a], “Call Bathsheba to me.” So she came before the king and stood before the king.
translation:
  language: te
  text: అప్పుడు దావీదు రాజు జవాబిచ్చి ఇలా అన్నాడు,[a] “బత్షెబాను నా దగ్గరకు పిలవండి.” ఆమె రాజు ఎదుటకు వచ్చి, రాజు ఎదుట నిలబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రతిస్పందించి.” హీబ్రూ కథనంలో “జవాబిచ్చాడు” అనే సూత్రప్రయోగం తరచుగా మాటను పరిచయం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: జవాబిస్తూ
  rationale: ענה అనే క్రియ ఇక్కడ కథనంలో మాటను పరిచయం చేసే సాంప్రదాయ సూత్రంగా ఉంది. ప్రత్యక్ష ప్రశ్న లేకపోయినా, ‘జవాబిస్తూ’ మూలంలోని భావాన్ని నిలుపుతుంది.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: దావీదు రాజు
  rationale: పేరు, బిరుదు కలయికను సహజమైన ఆధునిక తెలుగు క్రమంలో అందిస్తుంది.
- source_word: וַיֹּאמֶר
  choice: అన్నాడు
  rationale: אמר అనే సాధారణ వాక్కు క్రియకు సందర్భానుకూలమైన సహజ తెలుగు రూపం.
- source_word: קִרְאוּ לִי
  choice: నా దగ్గరికి పిలవండి
  rationale: קרא + ל లోని పిలిపించడం లేదా తన వద్దకు రప్పించడం అనే భావాన్ని అతిగా అధికారికం చేయకుండా వ్యక్తపరుస్తుంది.
- source_word: לְבַת שָׁבַע
  choice: బత్షెబను
  rationale: వ్యక్తి పేరును తెలుగులో సాధారణ బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చి, కర్మవిభక్తిని జోడించింది.
- source_word: וַתָּבֹא לִפְנֵי הַמֶּלֶךְ
  choice: ఆమె రాజు సన్నిధికి వచ్చింది
  rationale: בוא + לפני లోని రాజు సమక్షంలోకి రావడం అనే సభామర్యాద భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַתַּעֲמֹד לִפְנֵי הַמֶּלֶךְ
  choice: రాజు ఎదుట నిలబడింది
  rationale: עמד యొక్క ‘నిలబడింది’ అనే అర్థాన్ని, అలాగే మూలంలోని ‘రాజు ఎదుట’ పునరుక్తిని నిలుపుతుంది.
