  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి. బత్షెబను ఉద్దేశించిన ఏకవచన అనౌపచారిక ‘నువ్వు’ను సందర్భానుగుణంగా వాడింది. అయితే [b] పాదసూచికకు ప్రధాన పాఠ్యంలో సూచిక అవసరం.
