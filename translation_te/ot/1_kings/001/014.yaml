source:
  edition: WLC
  text: הִנֵּ֗ה עוֹדָ֛/ךְ מְדַבֶּ֥רֶת שָׁ֖ם עִם הַ/מֶּ֑לֶךְ וַ/אֲנִי֙ אָב֣וֹא אַחֲרַ֔יִ/ךְ וּ/מִלֵּאתִ֖י אֶת דְּבָרָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/014.yaml
  text: Look[a], while you are still speaking there with the king, I will come in after you and confirm your words.
translation:
  language: te
  text: ఇదిగో[a], నువ్వు ఇంకా అక్కడ రాజుతో మాట్లాడుతుండగానే, నేను నీ తర్వాత లోపలికి వచ్చి నీ మాటలను ధ్రువపరుస్తాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చూడు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “నీ మాటలను పూర్తి చేస్తాను” లేదా “నువ్వు చెప్పినదాన్ని వివరాలతో బలపరుస్తాను.” హీబ్రూ పదబంధం మరొకరి మాటలకు అదనపు, నిర్ధారక వివరాలు చేర్చడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: తదుపరి కార్యాచరణ సమయంపై దృష్టి నిలిపే సూచనార్థక అవ్యయంగా, ఆధునిక తెలుగులో సహజమైన తక్షణతను వ్యక్తం చేస్తుంది.
- source_word: עוֹדָךְ מְדַבֶּרֶת
  choice: నువ్వు ... ఇంకా మాట్లాడుతుండగానే
  rationale: రెండవ పురుష ఏకవచన స్త్రీలింగ సూచనతో కూడిన కొనసాగుతున్న చర్యను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: שָׁם עִם הַמֶּלֶךְ
  choice: అక్కడ రాజుతో
  rationale: స్థల సూచనను, עִם యొక్క సాధారణ సహవాచక భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: וַאֲנִי אָבוֹא אַחֲרַיִךְ
  choice: నేను నీ వెనుక లోపలికి వచ్చి
  rationale: రాజు సన్నిధిలోకి ప్రవేశించే రాజప్రాసాద సందర్భాన్ని సహజంగా వ్యక్తం చేస్తూ, బత్షెబ తర్వాత నాతాను వస్తాడనే క్రమాన్ని కాపాడుతుంది.
- source_word: וּמִלֵּאתִי אֶת דְּבָרָיִךְ
  choice: నీ మాటలను ధ్రువపరుస్తాను
  rationale: మరొకరి మాటలకు సమర్థనగా అదనపు వివరాలు చెప్పి వాటిని బలపరచడం అనే సందర్భానుగుణ భావాన్ని ఇస్తుంది; మూలంలోని ‘నింపడం/పూర్తిచేయడం’ అనే రూపకార్థాన్ని పాదసూచికలో నిలుపుతుంది.
