source:
  edition: WLC
  text: וְ/גַם בָּ֜אוּ עַבְדֵ֣י הַ/מֶּ֗לֶךְ לְ֠/בָרֵךְ אֶת אֲדֹנֵ֜י/נוּ הַ/מֶּ֣לֶךְ דָּוִד֮ לֵ/אמֹר֒ יֵיטֵ֨ב אלהי/ך אֶת שֵׁ֤ם שְׁלֹמֹה֙ מִ/שְּׁמֶ֔/ךָ וִֽ/יגַדֵּ֥ל אֶת כִּסְא֖/וֹ מִ/כִּסְאֶ֑/ךָ וַ/יִּשְׁתַּ֥חוּ הַ/מֶּ֖לֶךְ עַל הַ/מִּשְׁכָּֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/047.yaml
  text: And the king’s servants also came to bless our lord King David[a], saying, ‘May your God make Solomon’s name better than your name[b], and may he make his throne greater than your throne.’ And the king bowed himself on the bed.
translation:
  language: te
  text: రాజు సేవకులు కూడా మన ప్రభువైన దావీదు రాజును ఆశీర్వదించడానికి వచ్చి, “నీ దేవుడు సొలొమోను పేరు నీ పేరుకంటే మేలుగా ఉండునట్లు చేయుగాక[b]; అతని సింహాసనాన్ని నీ సింహాసనం కంటే గొప్పదిగా చేయుగాక” అన్నారు. అప్పుడు రాజు మంచం మీద వంగి నమస్కరించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజు మంచం మీద ఆరాధించాడు.” ఇక్కడి హీబ్రూ క్రియ సందర్భాన్ని బట్టి ‘వంగి నమస్కరించడం’ లేదా ‘ఆరాధించడం’ అనే అర్థాలను ఇవ్వగలదు.
    reason: alternative_reading
  - marker: b
    text: ఇక్కడ “పేరు” అంటే కీర్తి లేదా ప్రఖ్యాతి అనే భావం కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: కూడా
  rationale: మునుపటి సమాచారానికి దీనిని జోడించే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: రాజు సేవకులు
  rationale: రాజసభ సందర్భంలో ఇది రాజు పరిచారకులు లేదా అధికారులను విస్తృతంగా సూచించగలదు; ‘సేవకులు’ మూలపద పరిధిని కాపాడుతుంది.
- source_word: לְבָרֵךְ
  choice: ఆశీర్వదించడానికి
  rationale: ఇక్కడ పలికినది సాధారణ అభినందన మాత్రమే కాక, దావీదుపై పలికిన అధికారిక దీవెన.
- source_word: אֲדֹנֵינוּ הַמֶּלֶךְ דָּוִד
  choice: మన ప్రభువైన దావీదు రాజు
  rationale: రాజుకు ఇచ్చే గౌరవసూచక సంబోధనను ఆధునిక, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: יֵיטֵב ... אֶת שֵׁם שְׁלֹמֹה מִשְּׁמֶךָ
  choice: సొలొమోను పేరును నీ పేరుకంటే మరింత మేలైనదిగా చేయుగాక
  rationale: యיטב యొక్క causative భావాన్నీ, מן సూచించే పోలికనూ నిలుపుతూ ‘పేరు’ అనే మూలరూపకాన్ని అలాగే ఉంచుతుంది.
- source_word: וִיגַדֵּל אֶת כִּסְאוֹ מִכִּסְאֶךָ
  choice: అతని సింహాసనాన్ని నీ సింహాసనం కంటే గొప్పదిగా చేయుగాక
  rationale: రాజ్యాధికారాన్ని సూచించే ‘సింహాసనం’ రూపకాన్నీ, తులనాత్మక నిర్మాణాన్నీ నేరుగా కాపాడుతుంది.
- source_word: וַיִּשְׁתַּחוּ הַמֶּלֶךְ
  choice: రాజు ... వంగి నమస్కరించాడు
  rationale: క్రియలోని శారీరకంగా వంగడం లేదా సాష్టాంగపడడం అనే భావాన్ని వ్యక్తం చేస్తూ, దేవుణ్ణి ఆరాధించాడని ప్రధాన పాఠంలో స్పష్టంగా నిర్ణయించదు.
- source_word: עַל הַמִּשְׁכָּב
  choice: మంచం మీద
  rationale: హీబ్రూ పదబంధాన్ని సహజంగా, అదనపు స్వామ్యసూచన చేర్చకుండా అనువదిస్తుంది.
theological_decisions:
- issue: וַיִּשְׁתַּחוּ అనేది వంగి నమస్కరించడమా లేక దేవుణ్ణి ఆరాధించడమా
  choice: ప్రధాన పాఠంలో ‘వంగి నమస్కరించాడు’
  alternative: ‘దేవుణ్ణి ఆరాధించాడు’
  rationale: హీబ్రూ క్రియ గౌరవంతో వంగడాన్నీ ఆరాధించడాన్నీ సూచించగలదు. ఈ వాక్యంలో ఆ చర్య ఎవరికి ఉద్దేశించబడిందో స్పష్టంగా చెప్పలేదు; కాబట్టి ప్రధాన పాఠం శారీరక చర్యను చూపి, ఆరాధన భావాన్ని పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. దీవెనలోని ‘చేయుగాక’ రూపం సందర్భానికి తగిన ఔన్నత్యాన్ని ఇస్తుంది. ప్రధాన పాఠంలో మూలంలోని ‘పేరు,’ ‘సింహాసనం’ రూపకాలు నిలుపబడ్డాయి; వంగడం/ఆరాధించడం అనే అస్పష్టత పాదసూచికతో సంరక్షించబడింది.
