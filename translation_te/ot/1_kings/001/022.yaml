translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ రాజసభా సందర్భానికి తగిన గౌరవప్రదమైన శైలిని వాడాం. ‘ఇదిగో’ ద్వారా మూలంలోని తక్షణ దృష్టి-ఆహ్వానాన్ని నిలిపి, దాని ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
