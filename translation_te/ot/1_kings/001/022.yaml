  text: וְ/הִנֵּ֛ה עוֹדֶ֥/נָּה מְדַבֶּ֖רֶת עִם הַ/מֶּ֑לֶךְ וְ/נָתָ֥ן הַ/נָּבִ֖יא בָּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/022.yaml
  text: And behold[a], while she was still speaking with the king, Nathan the prophet came in.
translation:
  language: te
  text: ఇదిగో[a], ఆమె ఇంకా రాజుతో మాట్లాడుతుండగానే నాతాను ప్రవక్త లోపలికి వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చూడండి”; ఈ హీబ్రూ సంభాషణా సూచిక దృశ్యంలో అకస్మాత్తుగా జరిగిన కొత్త పరిణామంపై దృష్టి నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: దృశ్యంలో అకస్మాత్తుగా జరిగే కొత్త పరిణామంపై దృష్టి నిలిపే హీబ్రూ సంభాషణా సూచికను సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: עוֹדֶנָּה מְדַבֶּרֶת
  choice: ఆమె ఇంకా ... మాట్లాడుతుండగానే
  rationale: స్త్రీలింగ కర్త కొనసాగిస్తూ ఉన్న క్రియను, అదే సమయంలో మరొక సంఘటన జరిగిందనే కాలసంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עִם הַמֶּלֶךְ
  choice: రాజుతో
  rationale: עִם యొక్క ప్రాథమిక అర్థమైన ‘తో’ను నిలుపుతూ, రాజుతో నేరుగా సంభాషిస్తున్న సందర్భాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְנָתָן הַנָּבִיא
  choice: నాతాను ప్రవక్త
  rationale: వ్యక్తినామాన్ని తెలుగు లిప్యంతరీకరణలో ఇచ్చి, అతని పాత్రను తెలిపే బిరుదును సహజమైన అన్వయంతో ఉంచుతుంది.
- source_word: בָּא
  choice: లోపలికి వచ్చాడు
  rationale: రాజసన్నిధిలోకి వచ్చిన భావాన్ని సందర్భానుసారంగా స్పష్టం చేస్తుంది; మూలంలోని ‘వచ్చాడు/ప్రవేశించాడు’ అనే అర్థపరిధికి అనుగుణంగా ఉంది.
