id: 1KI.1.17
reference: 1 Kings 1:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר ל֗/וֹ אֲדֹנִ/י֙ אַתָּ֨ה נִשְׁבַּ֜עְתָּ בַּֽ/יהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לַֽ/אֲמָתֶ֔/ךָ כִּֽי שְׁלֹמֹ֥ה בְנֵ֖/ךְ יִמְלֹ֣ךְ אַחֲרָ֑/י וְ/ה֖וּא יֵשֵׁ֥ב עַל כִּסְאִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/017.yaml
  text: She said to him, “My lord, you swore by the LORD your God to your female servant, ‘Surely Solomon your son will reign after me, and he will sit on my throne.’”
translation:
  language: te
  text: 'ఆమె అతనితో ఇలా అంది: “నా ప్రభువా, నీ దేవుడైన యెహోవా తోడు, ‘నీ కుమారుడైన సొలొమోను నా తరువాత రాజవుతాడు; అతడు నా సింహాసనం మీద కూర్చుంటాడు’ అని నీవు నీ దాసియైన నాకు ప్రమాణం చేశావు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיהוָה
  choice: యెహోవా పేరట
  rationale: దేవుని వ్యక్తిగత నామాన్ని నిలుపుతూ, ‘ఒకరి తోడు ప్రమాణం చేయడం’ అనే హీబ్రూ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַאֲמָתֶךָ
  choice: నీ దాసినైన నాకు
  rationale: మాట్లాడుతున్న స్త్రీ తనను తాను వినయంగా సూచించే ‘నీ దాసి’ అనే భావాన్ని, ప్రమాణం ఎవరికి చేయబడిందో స్పష్టంగా తెలుగులో తెలియజేస్తుంది.
- source_word: כִּי
  choice: అని
  rationale: ఇక్కడ ప్రమాణంలోని మాటలను పరిచయం చేసే సంధిగా గ్రహించబడింది; ప్రమాణ స్వభావమే నిశ్చయాన్ని తెలియజేస్తుంది కాబట్టి మూలంలో వివాదాస్పదంగా ఉండగల అదనపు బలప్రయోగాన్ని చేర్చలేదు.
- source_word: וְהוּא
  choice: అతడే
  rationale: సొలొమోనే సింహాసనం మీద కూర్చుంటాడనే హీబ్రూ సర్వనామంలోని ఉద్ఘాటనను నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో మార్చకుండా తెలుగులో సుపరిచితమైన రూపంలో ఉంచింది; ఏ ప్రత్యేక మతశాఖ వ్యాఖ్యానాన్నీ చేర్చదు.
- issue: כִּי లో నిశ్చయార్థక బలం
  choice: ప్రమాణ వాక్యాన్ని పరిచయం చేసే ‘అని’
  alternative: ‘నిశ్చయంగా’ అని స్పష్టంగా చేర్చడం
  rationale: ఈ సందర్భంలో כִּי ప్రమాణ విషయాన్ని పరిచయం చేయగలదు. ‘నిశ్చయంగా’ సాధ్యమైన భావమే అయినా తప్పనిసరి కాదు; అందువల్ల మూలంలోని సంభావ్య అస్పష్టతను అతిగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజసభ సందర్భానికి తగిన గౌరవభరితమైన సంబోధనను, సాధారణ పాఠకులకు సహజంగా ఉండే వాక్యనిర్మాణాన్ని ఉపయోగించింది.
