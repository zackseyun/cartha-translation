- from: అప్పుడు యాజకుడైన సాదోకు, ప్రవక్తయైన నాతాను, యెహోయాదా కుమారుడు బెనాయా, కెరేతీయులు, పెలేతీయులు కిందికి వెళ్లారు. వారు సొలొమోనును దావీదు రాజు ఆడకంచర గాడిద[a] మీద ఎక్కించి, గీహోనుకు తీసుకువెళ్లారు.
