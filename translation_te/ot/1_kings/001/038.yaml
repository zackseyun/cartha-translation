translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. పొడవైన హీబ్రూ వాక్యాన్ని పఠన సౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించాం. సమూహనామాలను అర్థానువాదం చేయకుండా నిలిపి, సందిగ్ధమైన వారి విధిని ప్రధాన పాఠ్యంలో నిర్ణయించలేదు.
