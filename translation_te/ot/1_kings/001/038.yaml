source:
  edition: WLC
  text: וַ/יֵּ֣רֶד צָד֣וֹק הַ֠/כֹּהֵן וְ/נָתָ֨ן הַ/נָּבִ֜יא וּ/בְנָיָ֣הוּ בֶן יְהוֹיָדָ֗ע וְ/הַ/כְּרֵתִי֙ וְ/הַ/פְּלֵתִ֔י וַ/יַּרְכִּ֨בוּ֙ אֶת שְׁלֹמֹ֔ה עַל פִּרְדַּ֖ת הַ/מֶּ֣לֶךְ דָּוִ֑ד וַ/יֹּלִ֥כוּ אֹת֖/וֹ עַל גִּחֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/038.yaml
  text: So Zadok the priest[a], Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and the Pelethites went down and had Solomon ride on King David’s mule[c][b], and they brought him to Gihon.
translation:
  language: te
  text: అప్పుడు యాజకుడైన సాదోకు, ప్రవక్తయైన నాతాను, యెహోయాదా కుమారుడు బెనాయా, కెరేతీయులు, పెలేతీయులు కిందికి వెళ్లారు. వారు సొలొమోనును రాజైన దావీదు కంచర గాడిదపై ఎక్కించి, గీహోనుకు తీసుకువెళ్లారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో, “రాజైన దావీదు కంచర గాడిద.” “కంచర గాడిద” అనే హీబ్రూ నామవాచకం స్త్రీలింగ రూపంలో ఉంది; అది ఆడ కంచర గాడిదను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: కిందికి వెళ్లారు
  rationale: ירד అనే క్రియలోని దిగువ దిశను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ఏకవచన క్రియ ఉన్నప్పటికీ సంయుక్త కర్తకు తెలుగు బహువచనం సహజం.
- source_word: הַכֹּהֵן
  choice: యాజకుడైన
  rationale: כהןకు ప్రామాణిక తెలుగు పదం; సాదోకు పేరుతో విశేషణ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַנָּבִיא
  choice: ప్రవక్తయైన
  rationale: נביאకు ప్రామాణికమైన, సాధారణంగా అర్థమయ్యే అనువాదం.
- source_word: בֶן יְהוֹיָדָע
  choice: యెహోయాదా కుమారుడు
  rationale: హీబ్రూ పితృనామ సంబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: కెరేతీయులు, పెలేతీయులు
  rationale: హీబ్రూలో ఉన్న సమూహనామాలనే లిప్యంతరీకరించింది; వారి సంభావ్య విధిని ‘రాజ అంగరక్షకులు’ అని ప్రధాన పాఠ్యంలో నిర్ధారించలేదు.
- source_word: וַיַּרְכִּבוּ
  choice: ఎక్కించి
  rationale: רכב హిఫీల్ రూపంలోని ‘ఎక్కేలా చేయడం’ అనే కారణార్థాన్ని సంక్షిప్తంగా, సహజంగా తెలుపుతుంది.
- source_word: פִּרְדַּת
  choice: ఆడకంచర గాడిద
  rationale: పదం కంచర గాడిదను సూచించడమే కాక వ్యాకరణపరంగా స్త్రీలింగ రూపంలో ఉంది; తెలుగు పదబంధం ఆ వివరాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: దావీదు రాజు
  rationale: నిర్మాణ శ్రేణిలోని స్వామ్యార్థం తరువాత వచ్చే ‘మీద’తో కలిసి ‘దావీదు రాజుకు చెందిన’ అనే భావాన్ని సహజ తెలుగులో ఇస్తుంది.
- source_word: וַיֹּלִכוּ אֹתוֹ
  choice: తీసుకువెళ్లారు
  rationale: הלך హిఫీల్‌లోని ‘వెళ్లేలా చేయడం/తీసుకుపోవడం’ భావాన్ని ఇక్కడి ఊరేగింపు సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַל גִּחוֹן
  choice: గీహోనుకు
  rationale: చలన గమ్యాన్ని సూచించే ఈ సందర్భంలో עלను తెలుగు గమ్య విభక్తితో సహజంగా అనువదించింది.
