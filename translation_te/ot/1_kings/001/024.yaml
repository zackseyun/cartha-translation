translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన రాజాస్థాన సంబోధనను ఉపయోగించాం. మూలంలోని ప్రశ్నార్థక భావం, వారసత్వ భాష, సింహాసన రూపకం నిలుపబడ్డాయి.
