source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ נָתָן֒ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ אַתָּ֣ה אָמַ֔רְתָּ אֲדֹנִיָּ֖הוּ יִמְלֹ֣ךְ אַחֲרָ֑/י וְ/ה֖וּא יֵשֵׁ֥ב עַל כִּסְאִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/024.yaml
  text: Then Nathan said[a], “My lord the king, have you said, ‘Adonijah will reign after me, and he will sit on my throne’?”
translation:
  language: te
  text: అప్పుడు నాతాను, “నా ప్రభువైన రాజా, ‘నా తరువాత అదోనీయా రాజవుతాడు; అతడు నా సింహాసనం మీద కూర్చుంటాడు’ అని మీరు చెప్పారా?[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు చెప్పినట్లా?” ప్రశ్నలోని హీబ్రూ పర్ఫెక్ట్‌ను తెలుగులో సాధారణ భూతకాలంగానో, ప్రస్తుతానికి సంబంధించిన పూర్తయిన చర్యగానో వ్యక్తం చేయవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజా
  rationale: దావీదును ఉద్దేశించిన రాజాస్థాన గౌరవ సంబోధనలోని ‘నా ప్రభువు’ భావాన్నీ రాజబిరుదునూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אַתָּה אָמַרְתָּ
  choice: మీరు చెప్పారా?
  rationale: ప్రశ్నలోని హీబ్రూ పర్ఫెక్ట్, దావీదు నిజంగా అలాంటి ప్రకటన చేశాడా అని అడుగుతోంది. తెలుగులో సాధారణ భూతకాల ప్రశ్న సహజంగా ఈ భావాన్ని ఇస్తుంది; ‘మీరు చెప్పి ఉన్నారా?’ కూడా సాధ్యమే కాని తక్కువ సహజం.
- source_word: אֲדֹנִיָּהוּ
  choice: అదోనీయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: יִמְלֹךְ
  choice: రాజవుతాడు
  rationale: ఈ వారసత్వ సందర్భంలో క్రియకు ‘రాజుగా పరిపాలిస్తాడు/రాజవుతాడు’ అనే భావం ఉంది. ‘రాజవుతాడు’ సాధారణ పాఠకునికి సహజంగా ఉండి రాజ్యాధికార స్వీకరణను స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַחֲרָי
  choice: నా తరువాత
  rationale: వారసత్వ క్రమాన్ని తెలిపే సంక్షిప్త హీబ్రూ పదబంధాన్ని అదనపు వివరణ లేకుండా నేరుగా నిలుపుతుంది.
- source_word: וְהוּא יֵשֵׁב עַל־כִּסְאִי
  choice: అతడే నా సింహాసనం మీద కూర్చుంటాడు
  rationale: హీబ్రూలోని స్పష్టమైన సర్వనామం הוּא కు ఉన్న ఉద్ఘాటనను ‘అతడే’ ద్వారా, రాజవారసత్వ రూపకాన్ని ‘నా సింహాసనం మీద కూర్చుంటాడు’ ద్వారా నిలుపుతుంది.
