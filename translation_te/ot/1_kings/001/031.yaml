  text: וַ/תִּקֹּ֨ד בַּת שֶׁ֤בַע אַפַּ֨יִם֙ אֶ֔רֶץ וַ/תִּשְׁתַּ֖חוּ לַ/מֶּ֑לֶךְ וַ/תֹּ֕אמֶר יְחִ֗י אֲדֹנִ֛/י הַ/מֶּ֥לֶךְ דָּוִ֖ד לְ/עֹלָֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/031.yaml
  text: Then Bathsheba bowed with her face to the ground and prostrated herself before the king[a], and said, “May my lord King David live forever.”
translation:
  language: te
  text: అప్పుడు బత్షెబ ముఖం నేలకు తగిలేలా వంగి, రాజు ఎదుట సాష్టాంగ నమస్కారం చేసి, “నా ప్రభువైన దావీదు రాజు కలకాలం జీవించాలి!” అని చెప్పింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקֹּד
  choice: తలవంచి
  rationale: קָדַד శరీరాన్ని లోతుగా వంచడాన్ని సూచిస్తుంది. తరువాతి క్రియతో భేదాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ‘తలవంచి’ అని అనువదించాం.
- source_word: אַפַּיִם אֶרֶץ
  choice: నేలవరకు
  rationale: అక్షరార్థంగా ‘ముఖం/ముక్కు నేలకు’ అనే భావమున్న ఈ హీబ్రూ నుడికారాన్ని, లోతైన వినయభంగిమను తెలిపే సహజ తెలుగు రూపంలో ఇచ్చాం.
- source_word: וַתִּשְׁתַּחוּ
  choice: సాష్టాంగపడి
  rationale: שׁחה ఇక్కడ రాజు ఎదుట భక్తిపూర్వకంగా పూర్తిగా వంగి నమస్కరించడాన్ని సూచిస్తుంది. ముందున్న קָדַד కంటే తీవ్రతను స్పష్టంగా చూపేందుకు ఈ పదాన్ని ఎంచుకున్నాం.
- source_word: לַמֶּלֶךְ
  choice: రాజు ఎదుట
  rationale: ఉపసర్గ అక్షరార్థంగా ‘రాజుకు’ అయినా, నమస్కార భంగిమ సందర్భంలో తెలుగులో ‘రాజు ఎదుట’ సహజంగా ఉంటుంది.
- source_word: יְחִי
  choice: జీవించాలి
  rationale: ఈ జస్సివ్ రూపం కోరిక లేదా ఆశీర్వచనాన్ని వ్యక్తపరుస్తుంది; ‘జీవించాలి’ ఆ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: אֲדֹנִי
  choice: నా ప్రభువు
  rationale: రాజును గౌరవంగా సంబోధించే బిరుదును ‘నా ప్రభువు’ స్పష్టంగా, మర్యాదపూర్వకంగా అందిస్తుంది.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: దావీదు రాజు
  rationale: హీబ్రూలోని బిరుదు, పేరును తెలుగులో సహజమైన క్రమంలో ఉంచాం.
- source_word: לְעֹלָם
  choice: కలకాలం
  rationale: రాజకీయ జయజయధ్వని లేదా ఆశీర్వచన సందర్భంలో עוֹלָם తెలిపే నిరంతర కాలభావాన్ని ‘కలకాలం’ సహజంగా వ్యక్తపరుస్తుంది.
