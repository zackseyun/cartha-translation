    rationale: 'మూలంలో “మరి ఇప్పుడు/ఇప్పుడు” అనే పదం రెండు చోట్ల ఉంది: అదోనీయా రాజయ్యాడనే వార్తకు ముందు, రాజుకు తెలియదనే ప్రత్యక్ష సంబోధనకు ముందు. రెండవ ఉద్ఘాటనను తొలగించడం మూల వాక్య నిర్మాణంలోని పునరుక్తి మరియు తక్షణతను తగ్గిస్తుంది.'
