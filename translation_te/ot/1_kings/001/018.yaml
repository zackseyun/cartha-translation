source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִנֵּ֥ה אֲדֹנִיָּ֖ה מָלָ֑ךְ וְ/עַתָּ֛ה אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ לֹ֥א יָדָֽעְתָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/018.yaml
  text: And now, look, Adonijah has become king, and now, my lord the king, you do not know it.
translation:
  language: te
  text: ఇప్పుడు, ఇదిగో, అదోనీయా రాజయ్యాడు; ఇప్పుడు, నా ప్రభువైన రాజా, మీకు ఇది తెలియదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: సందర్భంలోని తక్షణ పరిస్థితిని సూచించే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: הִנֵּה
  choice: చూడండి
  rationale: శ్రోత దృష్టిని ఆశ్చర్యకరమైన ప్రస్తుత పరిణామంపై నిలిపే హీబ్రూ సూచనాత్మక పదం యొక్క బలాన్ని నిలుపుతుంది.
- source_word: מָלָךְ
  choice: రాజయ్యాడు
  rationale: అదోనీయా రాజత్వాన్ని స్వీకరించిన లేదా ప్రకటించుకున్న ప్రస్తుత పరిణామాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది; అతని రాజత్వానికి చట్టబద్ధతను అదనంగా నిర్ధారించదు.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజా
  rationale: రాజును నేరుగా సంబోధించే గౌరవార్థక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לֹא יָדָעְתָּ
  choice: మీకు తెలియదు
  rationale: మూలంలోని ప్రత్యక్ష నిరాకరణను అలాగే ఉంచుతూ గౌరవ సంబోధనకు తగిన బహువచన రూపాన్ని వాడుతుంది.
theological_decisions:
- issue: అదోనీయా రాజత్వపు చట్టబద్ధత
  choice: రాజయ్యాడు
  alternative: తానే రాజునని ప్రకటించుకున్నాడు
  rationale: మూలంలోని מָלָךְ సరళంగా ‘రాజయ్యాడు/పాలించాడు’ అని చెబుతుంది. సందర్భం అతని చర్యపై సందేహం కలిగించినా, ఈ వాక్యంలోనే వివరణాత్మక పదాలను చేర్చి ఆ సందేహాన్ని పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; బత్షెబ రాజుతో గౌరవంగా మాట్లాడుతున్నందున ‘చూడండి’, ‘మీకు’ అనే గౌరవ రూపాలు వాడబడ్డాయి. రెండవ וְעַתָּהను తెలుగులో మళ్లీ అనువదిస్తే వాక్యం కృత్రిమంగా అనిపించేందున, దాని సంభాషణాత్మక మార్పు భావాన్ని వాక్య విరామం ద్వారా వ్యక్తం చేశాం.
