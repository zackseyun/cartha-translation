translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని, రాజసభ సందర్భానికి తగిన గౌరవప్రద స్వరాన్ని ఉపయోగించాం. మూలంలోని వరుస క్రియలను తెలుగులో చదవడానికి సులభంగా రెండు వాక్యాలుగా అమర్చాం; స్థలసూచక పదబంధంలోని అస్పష్టతను పాదసూచికలో నిలిపాం.
