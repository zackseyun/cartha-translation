base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/053.yaml
  text: Then King Solomon sent[a], and they brought him down from the altar. And he came and bowed down to King Solomon, and Solomon said to him, “Go to your house.”
translation:
  language: te
  text: అప్పుడు సొలొమోను రాజు పంపగా, వారు అదోనీయాను బలిపీఠం మీద నుండి దింపారు.[a] అతడు వచ్చి సొలొమోను రాజుకు వంగి నమస్కరించాడు. అప్పుడు సొలొమోను అతనితో, “నీ ఇంటికి వెళ్లు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు అతణ్ణి బలిపీఠం పైనుండి కిందికి తీసుకువచ్చారు.” హీబ్రూలో అక్షరార్థంగా, “వారు అతణ్ణి బలిపీఠం పైనుండి కిందికి వచ్చేలా చేశారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: మనుషులను పంపించాడు
  rationale: שׁלח అంటే ‘పంపించడం.’ హీబ్రూలో కర్మ స్పష్టంగా లేకపోయినా, తరువాతి బహువచన క్రియను బట్టి పంపబడిన మనుషులను తెలుగులో సహజంగా వ్యక్తపరిచాం.
- source_word: וַיֹּרִדֻהוּ
  choice: వారు అదోనీయాను ... కిందికి తీసుకొచ్చారు
  rationale: ירד యొక్క కారణార్థక రూపం పేరు చెప్పని బహువచన కర్తలు అతణ్ణి కిందికి వచ్చేలా చేశారని సూచిస్తుంది. సందర్భం స్పష్టత కోసం ‘అదోనీయాను’ అని పేర్కొన్నాం.
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: బలిపీఠం దగ్గర నుండి
  rationale: מֵעַל అక్షరార్థంగా ‘పైనుండి/దగ్గరనుండి’ అనే పరిధిని కలిగి ఉంది. ముందటి సందర్భంలో అదోనీయా బలిపీఠపు కొమ్ములను పట్టుకున్నందున, అతడు బలిపీఠం మీద నిలిచాడని అనవసరంగా నిర్ధారించకుండా ‘దగ్గర నుండి’ అని ఇచ్చాం.
- source_word: וַיִּשְׁתַּחוּ
  choice: వంగి నమస్కరించాడు
  rationale: שׁחה గౌరవసూచకంగా వంగడం లేదా సాష్టాంగపడడాన్ని సూచించగలదు. పూర్తి సాష్టాంగాన్ని నిర్బంధించకుండా సహజమైన, గౌరవప్రదమైన తెలుగు వాడాం.
- source_word: לֵךְ לְבֵיתֶךָ
  choice: నీ ఇంటికి వెళ్లు
  rationale: ఆజ్ఞార్థక క్రియను, గమ్యస్థానాన్ని నేరుగా నిలుపుతూ రాజు ఇచ్చిన అధికారిక పంపివేత భావాన్ని సంరక్షిస్తుంది.
