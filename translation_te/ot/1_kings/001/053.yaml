  to: అప్పుడు సొలొమోను రాజు పంపగా, వారు అదోనీయాను బలిపీఠం మీద నుండి దింపారు.[a] అతడు వచ్చి సొలొమోను రాజుకు వంగి నమస్కరించాడు. అప్పుడు సొలొమోను అతనితో, “నీ ఇంటికి వెళ్లు” అన్నాడు.
