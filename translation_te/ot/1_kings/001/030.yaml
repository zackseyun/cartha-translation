source:
  edition: WLC
  text: כִּ֡י כַּ/אֲשֶׁר֩ נִשְׁבַּ֨עְתִּי לָ֜/ךְ בַּ/יהוָ֨ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר כִּֽי שְׁלֹמֹ֤ה בְנֵ/ךְ֙ יִמְלֹ֣ךְ אַחֲרַ֔/י וְ/ה֛וּא יֵשֵׁ֥ב עַל כִּסְאִ֖/י תַּחְתָּ֑/י כִּ֛י כֵּ֥ן אֶעֱשֶׂ֖ה הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/030.yaml
  text: As I swore to you by Yahweh[a], the God of Israel, saying, ‘Surely Solomon your son will reign after me[b], and he will sit on my throne in my place,’ so I will do this today.
translation:
  language: te
  text: “ఇశ్రాయేలు దేవుడైన యాహ్వే[a] తోడు అని నేను నీకు ప్రమాణం చేసి, ‘నీ కుమారుడైన సొలొమోను నా తరువాత రాజ్యమేలుతాడు; అతడు నా స్థానంలో నా సింహాసనంపై కూర్చుంటాడు’ అని చెప్పినట్లుగానే, ఈ రోజునే నేను అలాగే చేస్తాను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో దేవుని వ్యక్తిగత నామం יהוה (YHWH); ఇక్కడ “యాహ్వే” అని లిప్యంతరీకరించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כַּאֲשֶׁר
  choice: చెప్పిన ప్రకారమే
  rationale: ముందు చేసిన ప్రమాణానికి, ఇప్పుడు చేయబోయే కార్యానికి మధ్య ఉన్న ‘ఎలాగైతే… అలాగే’ సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: נִשְׁבַּעְתִּי לָךְ
  choice: నీకు ప్రమాణం చేస్తూ
  rationale: ముందు చేసిన ప్రమాణాన్ని సూచిస్తూ, ప్రధాన వాక్యంతో సహజంగా అనుసంధానిస్తుంది.
- source_word: בַּיהוָה
  choice: యెహోవా తోడు అని
  rationale: בְּ ద్వారా సూచితమైన ప్రమాణాధారాన్ని తెలుగులో సహజమైన ప్రమాణ ప్రయోగంతో వ్యక్తం చేస్తూ, దైవనామాన్ని లిప్యంతరీకరిస్తుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: మూలంలోని సంబంధ నిర్మాణాన్ని సహజమైన తెలుగు విశేషణ వాక్యభాగంగా అందిస్తుంది.
- source_word: שְׁלֹמֹה בְנֵךְ
  choice: నీ కుమారుడైన సొలొమోను
  rationale: తెలుగు పదక్రమానికి అనుగుణంగా బంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: יִמְלֹךְ אַחֲרַי
  choice: నా తరువాత రాజుగా పరిపాలిస్తాడు
  rationale: מלך లోని ‘రాజుగా ఉండడం/పరిపాలించడం’ అనే భావాన్ని, వారసత్వ క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי תַּחְתָּי
  choice: అతడే నా స్థానంలో నా సింహాసనం మీద కూర్చుంటాడు
  rationale: הוּא యొక్క ఉద్ఘాటనను ‘అతడే’తో, రాజ్య వారసత్వం మరియు תַּחְתָּי యొక్క స్థానాపన్న భావాన్ని ‘నా స్థానంలో’తో నిలుపుతుంది.
- source_word: כִּי כֵן אֶעֱשֶׂה הַיּוֹם הַזֶּה
  choice: ఈ రోజే నేను చేస్తాను
  rationale: తక్షణ నెరవేర్పును ‘ఈ రోజే’ అనే ఉద్ఘాటనతో సహజంగా వ్యక్తం చేస్తుంది; చేయబోయే కార్యం పూర్వసందర్భం నుంచి స్పష్టమవుతుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని సాధారణ బిరుదుతో మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో లిప్యంతరీకరించింది.
- issue: תַּחְתָּי యొక్క రాజ్య వారసత్వ భావం
  choice: నా స్థానంలో
  alternative: నా తరువాత
  rationale: ముందటి ‘నా తరువాత’ అనే కాలక్రమ భావాన్ని అనవసరంగా పునరావృతం చేయకుండా, సింహాసనంపై దావీదు స్థానాన్ని సొలొమోను స్వీకరించే స్థానాపన్న భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజసంబంధమైన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే వాక్యనిర్మాణం. ప్రమాణ సూత్రాన్ని తెలుగులో సహజమైన ‘తోడు అని’ ప్రయోగంతో అందించింది.
