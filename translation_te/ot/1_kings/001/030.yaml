- from: “నేను ఇశ్రాయేలు దేవుడైన యెహోవా[a] తోడు అని నీకు ప్రమాణం చేస్తూ, ‘నీ కుమారుడైన సొలొమోను నా తరువాత రాజుగా పరిపాలిస్తాడు; అతడే నా స్థానంలో నా సింహాసనం మీద కూర్చుంటాడు’ అని చెప్పిన ప్రకారమే, ఈ రోజే నేను చేస్తాను.”
  to: “ఇశ్రాయేలు దేవుడైన యాహ్వే[a] తోడు అని నేను నీకు ప్రమాణం చేసి, ‘నీ కుమారుడైన సొలొమోను నా తరువాత రాజ్యమేలుతాడు; అతడు నా స్థానంలో నా సింహాసనంపై కూర్చుంటాడు’ అని చెప్పినట్లుగానే, ఈ రోజునే నేను అలాగే చేస్తాను.”
  rationale: The revision corrects the tense of David’s earlier oath, follows the project’s Yahweh rendering, and expresses the Hebrew comparative structure clearly in modern standard Telugu. It avoids overemphasizing the ordinary pronoun הוּא and preserves the royal succession language without interpretive expansion.
