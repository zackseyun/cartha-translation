source:
  edition: WLC
  text: עוֹדֶ֣/נּוּ מְדַבֵּ֔ר וְ/הִנֵּ֧ה יוֹנָתָ֛ן בֶּן אֶבְיָתָ֥ר הַ/כֹּהֵ֖ן בָּ֑א וַ/יֹּ֤אמֶר אֲדֹנִיָּ֨הוּ֙ בֹּ֔א כִּ֣י אִ֥ישׁ חַ֛יִל אַ֖תָּה וְ/ט֥וֹב תְּבַשֵּֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/042.yaml
  text: While he was still speaking[a], behold, Jonathan son of Abiathar the priest came. And Adonijah said, “Come in, for you are a worthy man and bring good news.”
translation:
  language: te
  text: అతడు ఇంకా మాట్లాడుతుండగానే, ఇదిగో, యాజకుడైన అబ్యాతారు కుమారుడు యోనాతాను వచ్చాడు. అదోనీయా అతనితో, “లోపలికి రా; ఎందుకంటే నువ్వు సమర్థుడివి[a], శుభవార్తే తెస్తావు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పరాక్రమవంతుడివి,” “యోగ్యుడివి,” “గౌరవనీయుడివి.” హీబ్రూ పదబంధం (אִישׁ חַיִל) సందర్భానుసారంగా శౌర్యం, సామర్థ్యం లేదా సామాజిక గౌరవాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר
  choice: అతడు ఇంకా మాట్లాడుతుండగానే
  rationale: కొనసాగుతున్న మాటల మధ్యనే తదుపరి సంఘటన జరిగిందనే కాలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: అకస్మాత్తుగా లేదా గమనించదగిన రీతిలో జరిగిన పరిణామంపై దృష్టి నిలిపే హీబ్రూ సంభాషణా సూచిక యొక్క సజీవతను నిలుపుతుంది.
- source_word: יוֹנָתָן
  choice: యోనాతాను
  rationale: హీబ్రూ వ్యక్తినామానికి ప్రాచుర్యంలో ఉన్న తెలుగు బైబిలు రూపం.
- source_word: בֶּן אֶבְיָתָר הַכֹּהֵן
  choice: యాజకుడైన అబ్యాతారు కుమారుడు
  rationale: ‘యాజకుడు’ అనే బిరుదు సహజంగా అబ్యాతారునే విశేషిస్తుందని స్పష్టంగా చూపుతూ నిర్మాణ సంబంధాన్ని కాపాడుతుంది.
- source_word: בָּא
  choice: వచ్చాడు
  rationale: కథనంలోని సంఘటనను నేరుగా, సజీవంగా తెలిపే సరళమైన భూతకాల రూపం.
- source_word: בֹּא
  choice: లోపలికి రా
  rationale: సమావేశ స్థలంలోకి ప్రవేశించమనే సందర్భోచిత ఆహ్వానాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: ;
  rationale: ఇక్కడి కారణార్థక సంబంధాన్ని తెలుగులో తప్పనిసరిగా ‘ఎందుకంటే’ అని పలకకుండా, విరామచిహ్నం ద్వారా సహజమైన ప్రత్యక్ష సంభాషణగా వ్యక్తం చేయవచ్చు.
- source_word: אִישׁ חַיִל
  choice: సమర్థుడివి
  rationale: ఈ పదబంధం శౌర్యం, సామర్థ్యం, యోగ్యత లేదా సామాజిక గౌరవాన్ని సూచించగలదు. ఇక్కడ విశ్వసనీయమైన వార్తాహరుడిగా యోనాతానును అదోనీయా భావిస్తున్న సందర్భంలో ‘సమర్థుడు’ అతిగా నిర్దిష్టీకరించకుండా సరిపోతుంది.
- source_word: וְטוֹב תְּבַשֵּׂר
  choice: శుభవార్త తెస్తావు
  rationale: అనుకూలమైన వార్తను ప్రకటిస్తాడనే అదోనీయా నిరీక్షణను సహజమైన తెలుగు ప్రయోగంతో తెలియజేస్తుంది.
