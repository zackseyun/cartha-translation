  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇదిగో’ ద్వారా మూలంలోని ఆకస్మిక దృష్టి సూచన నిలుపబడింది; אִישׁ חַיִל లోని అర్థ విస్తృతిని ప్రధాన పాఠంలో ‘సమర్థుడివి’గా, పాదటిప్పణిలో ప్రత్యామ్నాయాలతో కాపాడాం.
