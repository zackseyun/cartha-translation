  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన న్యాయసంబంధ స్వరం. మూలంలోని షరతు నిర్మాణం, ‘వెంట్రుక నేలపై పడటం’ అనే రూపకం, ‘చెడు అతనిలో కనబడటం’ అనే ఉద్దేశపూర్వక అస్పష్టత నిలుపబడ్డాయి.
