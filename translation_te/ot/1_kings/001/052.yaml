id: 1KI.1.52
reference: 1 Kings 1:52
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֔ה אִ֚ם יִהְיֶ֣ה לְ/בֶן חַ֔יִל לֹֽא יִפֹּ֥ל מִ/שַּׂעֲרָת֖/וֹ אָ֑רְצָ/ה וְ/אִם רָעָ֥ה תִמָּצֵא ב֖/וֹ וָ/מֵֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/052.yaml
  text: And Solomon said[a], “If he proves to be a worthy man, not one of his hairs will fall to the ground; but if evil is found in him[b], he shall die.”
translation:
  language: te
  text: అప్పుడు సొలొమోను, “అతడు యోగ్యుడైతే[a], అతని వెంట్రుకలో ఒక్కటి కూడా నేలపై పడదు[b]. కానీ అతనిలో చెడు కనబడితే, అతడు చనిపోతాడు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పరాక్రమపు కుమారుడు.” ఈ హీబ్రూ నానుడి సందర్భాన్ని బట్టి యోగ్యత, సామర్థ్యం లేదా పరాక్రమం గల వ్యక్తిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “అతని వెంట్రుకలో ఒక్కటి కూడా నేలపై పడదు” అనేది అతనికి ఏ హానీ కలగదని అర్థమిచ్చే హీబ్రూ నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן־חַיִל
  choice: యోగ్యుడిగా
  rationale: అక్షరార్థంగా ‘బలపరాక్రమాల కుమారుడు’; ఇక్కడ సైనిక వీరత్వం కంటే నమ్మదగిన, సత్ప్రవర్తనగల వ్యక్తిగా ఉండటాన్ని సూచించే హీబ్రూ నానుడి.
- source_word: יִהְיֶה
  choice: ప్రవర్తిస్తే
  rationale: సాధారణంగా ‘ఉంటే/అయితే’; ఈ షరతులో భవిష్యత్తులో అతడు తన స్వభావాన్ని ప్రవర్తన ద్వారా చూపించడమే భావం. తెలుగులో సహజంగా ఉండేందుకు ‘ప్రవర్తిస్తే’ అని అనువదించాం.
- source_word: מִשַּׂעֲרָתוֹ
  choice: అతని వెంట్రుకల్లో ఒక్కటి
  rationale: హీబ్రూలో సమష్టివాచకంగా ‘అతని వెంట్రుక’; తెలుగులో ఒక్క వెంట్రుక కూడా హాని పొందదనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא יִפֹּל ... אָרְצָה
  choice: నేలపై పడదు
  rationale: పూర్తిగా క్షేమంగా ఉంటాడనే నానుడిని, మూలంలోని స్పష్టమైన చిత్రాన్ని నిలుపుతూ అనువదించాం.
- source_word: רָעָה
  choice: చెడు
  rationale: నైతిక దుష్టత్వం లేదా తప్పును సూచించే విస్తృత పదం; ఒక నిర్దిష్ట నేరానికి భావాన్ని కుదించదు.
- source_word: תִמָּצֵא בוֹ
  choice: అతనిలో ... కనబడితే
  rationale: చెడు అతనికి చెందినదిగా బయటపడటాన్ని సూచించే మూలంలోని నిష్క్రియ నిర్మాణాన్ని దగ్గరగా నిలుపుతుంది.
- source_word: וָמֵת
  choice: అతడు చనిపోతాడు
  rationale: చెడు కనబడితే కలిగే ప్రాణదండనాత్మక పరిణామాన్ని గంభీరంగా తెలుపుతుంది; ఇది కేవలం అంచనా లేక అధికారిక తీర్పు అనే దానిని అతిగా నిర్ధారించదు.
