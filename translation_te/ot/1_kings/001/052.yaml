  source_fidelity: షరతు నిర్మాణం, వెంట్రుక నేలపై పడకపోవడం అనే సంపూర్ణ రక్షణ నానుడి, చెడు అతనిలో కనబడడం, మరణ పరిణామం అన్నీ ముసాయిదాలో సరిగ్గా ప్రతిబింబించబడ్డాయి. అయితే יִהְיֶה/בֶן־חַיִל కు ‘యోగ్యుడిగా ప్రవర్తిస్తే’ అనడం ప్రవర్తనను మూలం కంటే స్పష్టంగా జోడిస్తోంది; ‘యోగ్యుడైతే’ మూలంలోని వ్యక్తిత్వ-మూల్యాంకనాన్ని మరింత దగ్గరగా ఉంచుతుంది.
