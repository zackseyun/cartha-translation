  yaml_path: translation/ot/1_kings/001/015.yaml
  text: So Bathsheba went in to the king in the chamber[a]. Now the king was very old[b], and Abishag the Shunammite was attending the king.
translation:
  language: te
  text: బత్షెబ రాజు ఉన్న గదిలోకి[a] వెళ్లింది. రాజు చాలా వృద్ధుడై ఉన్నాడు; షూనేమీయురాలైన అబీషగు రాజుకు సేవ చేస్తూ ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రాజు ఉన్న గదిలోకి ప్రవేశించింది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: వెళ్లింది
  rationale: בוא యొక్క వయ్యిక్తోల్ కథనాన్ని ముందుకు నడిపిస్తుంది. బత్షెబ రాజు ఉన్న వ్యక్తిగత గదిలోకి ప్రవేశించడాన్ని సహజమైన తెలుగులో ‘వెళ్లింది’ అని వ్యక్తపరచాం.
- source_word: בַת־שֶׁבַע
  choice: బత్షెబ
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: אֶל־הַמֶּלֶךְ הַחַדְרָה
  choice: రాజు ఉన్న అంతఃపుర గదిలోకి
  rationale: אֶל చలనాన్ని, חֶדֶר లోపలి లేదా వ్యక్తిగత గదిని, దిశాసూచక ה ఆ గదిలోకి ప్రవేశాన్ని సూచిస్తాయి. తెలుగులో సంబంధాన్ని స్పష్టంగా, సహజంగా తెలిపేందుకు ‘రాజు ఉన్న’ అని వాక్యనిర్మాణంలో వ్యక్తపరచాం.
- source_word: וְהַמֶּלֶךְ זָקֵן מְאֹד
  choice: రాజు చాలా వృద్ధుడై ఉన్నాడు
  rationale: ఈ వాక్యభాగం నేపథ్య సమాచారాన్ని ఇస్తుంది. זָקֵן מְאֹד ను గౌరవప్రదమైన ఆధునిక తెలుగులో ‘చాలా వృద్ధుడై ఉన్నాడు’గా అనువదించాం.
- source_word: וַאֲבִישַׁג הַשּׁוּנַמִּית
  choice: షూనేమీయురాలైన అబీషగు
  rationale: అబీషగు అనే పేరును లిప్యంతరీకరించి, షూనేము ప్రాంతానికి చెందిన స్త్రీని సూచించే gentilic ను తెలుగులో ‘షూనేమీయురాలు’గా ఇచ్చాం.
- source_word: מְשָׁרַת
  choice: పరిచర్య చేస్తూ ఉంది
  rationale: పార్టిసిపిల్ కొనసాగుతున్న సేవను సూచిస్తుంది. వృద్ధ రాజుకు అందిస్తున్న వ్యక్తిగత సంరక్షణతో కూడిన రాజసేవ భావాన్ని ‘పరిచర్య చేస్తూ ఉంది’ సహజంగా అందిస్తుంది; మతపరమైన ప్రత్యేకార్థాన్ని బలవంతంగా చేర్చదు.
