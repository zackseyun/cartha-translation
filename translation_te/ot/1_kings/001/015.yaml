revisions:
- from: కాబట్టి బత్షెబ రాజు ఉన్న అంతఃపుర గదిలోకి[a] వెళ్లింది. రాజు చాలా వృద్ధుడై ఉన్నాడు; షూనేమీయురాలైన అబీషగు రాజుకు పరిచర్య చేస్తూ ఉంది.
  to: బత్షెబ రాజు ఉన్న గదిలోకి[a] వెళ్లింది. రాజు చాలా వృద్ధుడై ఉన్నాడు; షూనేమీయురాలైన అబీషగు రాజుకు సేవ చేస్తూ ఉంది.
  rationale: The revision removes the causal implication of ‘కాబట్టి’ and replaces the over-specific ‘అంతఃపుర గది’ with ‘గది,’ preserving the Hebrew’s unelaborated reference to the king’s room. It also uses an ordinary modern term for Abishag’s continuing service. The footnote anchor remains correctly attached to the clause concerning entry into the room.
