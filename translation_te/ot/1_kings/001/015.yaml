  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘అంతఃపుర గది’ రాజు వ్యక్తిగత లోపలి గది అనే సందర్భార్థాన్ని అందిస్తుంది; పాదటిప్పణిలో మరింత సాధారణమైన ప్రత్యామ్నాయం ఇచ్చాం.
