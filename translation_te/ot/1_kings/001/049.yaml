  yaml_path: translation/ot/1_kings/001/049.yaml
  text: Then all Adonijah’s invited guests trembled and rose[a], and each man went his way.
translation:
  language: te
  text: అప్పుడు అదోనీయా ఆహ్వానించిన వారందరూ భయంతో వణికి లేచి, ఒక్కొక్కరూ తమ తమ దారిన వెళ్లిపోయారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “ఒక్కొక్కడు తన దారికి”; అంటే వారు ఒక్కొక్కరుగా చెదరిపోయారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֶרְדוּ
  choice: భయంతో వణికి
  rationale: חרד భయం లేదా కలవరంతో వణకడాన్ని సూచిస్తుంది. ‘భయంతో వణికి’ అనే ప్రయోగం శారీరక ప్రతిస్పందననూ దాని కారణాన్నీ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיָּקֻמוּ
  choice: లేచి
  rationale: קום ఇక్కడ కూర్చున్న స్థితి నుండి లేచి వెళ్లడానికి సిద్ధపడటాన్ని సూచిస్తుంది; వరుస క్రియలతో ‘లేచి’ సహజంగా సరిపోతుంది.
- source_word: כָּל הַקְּרֻאִים אֲשֶׁר לַאֲדֹנִיָּהוּ
  choice: అదోనీయా ఆహ్వానించిన వారందరూ
  rationale: הַקְּרֻאִים అంటే ‘ఆహ్వానించబడినవారు.’ సందర్భంలో వారు అదోనీయా విందుకు వచ్చిన అతిథులు; తెలుగులో క్రియాత్మక నిర్మాణం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וַיֵּלְכוּ
  choice: వెళ్లిపోయారు
  rationale: הלך యొక్క ప్రాథమిక భావం ‘వెళ్లడం.’ ఈ సందర్భంలో సభ చెదిరిపోయి వారు అక్కడి నుండి వెళ్లిన భావాన్ని ‘వెళ్లిపోయారు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אִישׁ לְדַרְכּוֹ
  choice: ఒక్కొక్కరూ తమ తమ దారిన
  rationale: అక్షరార్థంగా ‘ఒక్కొక్కడు తన దారికి’ అనే పంపిణీ భావం ఉంది. ‘ఒక్కొక్కరూ తమ తమ దారిన’ వారంతా విడివిడిగా చెదరిపోయారనే హెబ్రీ నుడికారాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. హెబ్రీ క్రియల వరుసను తెలుగు సహజ ప్రవాహానికి అనుగుణంగా ‘వణికి లేచి… వెళ్లిపోయారు’గా రూపొందించాం; పంపిణీ భావాన్ని ‘ఒక్కొక్కరూ తమ తమ’తో నిలిపాం.
