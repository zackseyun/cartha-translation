translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన పరిపాలనా శైలిని ఉపయోగించాం. మూలంలోని సంక్షిప్త అధికారుల జాబితా స్వరూపాన్ని కాపాడుతూ, ‘గృహం’ అనే పదంలోని రాజగృహం/రాజకుటుంబ పరిపాలన అస్పష్టతను పాదటిప్పణిలో నిలిపాం.
