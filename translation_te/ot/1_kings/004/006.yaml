base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/006.yaml
  text: and Ahishar was over the household[b][a], and Adoniram son of Abda was over the forced labor.
translation:
  language: te
  text: అహీషారు రాజగృహ నిర్వహణకు అధికారిగా ఉన్నాడు[a]. అబ్దా కుమారుడైన అదోనీరాము నిర్బంధ శ్రమకు అధికారిగా ఉన్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘గృహంపై.’ ఇది రాజగృహం లేదా రాజకుటుంబ వ్యవహారాల పర్యవేక్షణను సూచించే ఆస్థాన హోదా కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘శ్రమ విధింపుకు.’ హీబ్రూ పదం ప్రభుత్వం నిర్బంధంగా విధించిన శ్రమసేవను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחִישָׁר
  choice: అహీషారు
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం; జాబితా శైలిలోని వావ్ సంధిని ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండా సహజ తెలుగు వాక్యక్రమంతో తెలిపాం.
- source_word: עַל הַבָּיִת
  choice: రాజగృహ నిర్వహణకు అధికారిగా
  rationale: అక్షరార్థంగా ‘ఆ గృహంపై’ అయినా, రాజాస్థాన అధికారుల జాబితాలో ఇది రాజగృహం లేదా రాజకుటుంబ వ్యవహారాల పర్యవేక్షణను సూచించే హోదా. భౌతిక భవనానికే పరిమితం చేయకుండా పరిపాలనా భావాన్ని వ్యక్తం చేశాం.
- source_word: וַאֲדֹנִירָם
  choice: అదోనీరాము
  rationale: వ్యక్తి పేరును తెలుగులో లిప్యంతరీకరించాం; సంధికారకాన్ని సహజ తెలుగు వాక్య విభజనలో అంతర్భావంగా ఉంచాం.
- source_word: בֶּן עַבְדָּא
  choice: అబ్దా కుమారుడైన
  rationale: అధికారిని అతని తండ్రి పేరుతో గుర్తించే సాధారణ వంశసంబంధ పదబంధంగా అనువదించాం.
- source_word: עַל הַמַּס
  choice: నిర్బంధ శ్రమకు అధికారిగా
  rationale: మַס ఇక్కడ సాధారణ పన్నును కాక, రాజ్యం విధించిన తప్పనిసరి శ్రమసేవను సూచిస్తుంది. ‘నిర్బంధ శ్రమ’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి మూలంలోని బలవంతపు స్వభావాన్ని నిలుపుతుంది.
