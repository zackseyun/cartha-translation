translation:
  language: te
  text: అరుబ్బోతులో బెన్-హెసెదు[a]; సోకో మరియు హెఫెరు దేశమంతా అతని ఆధీనంలో ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “అరుబ్బోతులో హెసెదు కుమారుడు; సోకో మరియు హెఫెరు దేశమంతా అతనికి చెందాయి.”
    reason: בֶּן־חֶסֶד అనే పదబంధాన్ని వ్యక్తిపేరుగా లేదా ‘హెసెదు కుమారుడు’ అనే పితృనామంగా అర్థం చేసుకునే అవకాశం ఉంది.
lexical_decisions:
- source_word: בֶּן חֶסֶד
  choice: బెన్-హెసెదు
  rationale: ఈ పరిపాలనా అధికారుల జాబితాలో ఈ పదబంధం వ్యక్తిపేరులా పనిచేస్తోంది. అయితే ‘హెసెదు కుమారుడు’ అనే అక్షరార్థ అవకాశం పాదసూచికలో నిలుపబడింది.
- source_word: בָּאֲרֻבּוֹת
  choice: అరుబ్బోతులో
  rationale: ఉపసర్గ בְּ ఇక్కడ స్థలార్థకమైన ‘లో’ అనే భావాన్ని ఇస్తుంది; స్థలపేరు లిప్యంతరీకరించబడింది.
- source_word: לֹו
  choice: అతని పరిధిలో ఉన్నాయి
  rationale: జిల్లాల పరిపాలనా జాబితా సందర్భంలో ఈ పదం ఆ అధికారికి అప్పగించబడిన భూభాగాన్ని సూచిస్తుంది. సహజమైన తెలుగులో పరిపాలనా భావాన్ని వ్యక్తం చేస్తూనే యాజమాన్యాన్ని అతిగా నిర్ధారించకుండా ఈ రూపం ఎంచుకోబడింది.
- source_word: שֹׂכֹה
  choice: శోకో
  rationale: హీబ్రూ స్థలపేరు ధ్వనికి దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: וְכָל אֶרֶץ חֵפֶר
  choice: హెఫెరు ప్రాంతమంతా
  rationale: אֶרֶץ ఇక్కడ భూమండలాన్ని కాక ఒక ప్రాంతాన్ని సూచిస్తుంది; כָל భావాన్ని ‘అంతా’ నిలుపుతుంది.
