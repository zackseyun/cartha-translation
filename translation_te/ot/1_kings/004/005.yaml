  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/עֲזַרְיָ֥הוּ בֶן נָתָ֖ן עַל הַ/נִּצָּבִ֑ים וְ/זָב֧וּד בֶּן נָתָ֛ן כֹּהֵ֖ן רֵעֶ֥ה הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/005.yaml
  text: Azariahu son of Nathan was over the governors[a], and Zabud son of Nathan was priest and the king’s friend.
translation:
  language: te
  text: నాతాను కుమారుడు అజర్యాహు ప్రాంతాధికారుల బాధ్యత వహించేవాడు. నాతాను కుమారుడు జాబూదు యాజకుడిగాను[a] రాజుకు స్నేహితుడిగాను ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఈ రాజాస్థాన సందర్భంలో, ‘ప్రధాన మంత్రి’ లేదా ‘రాజ సలహాదారు’ అని అర్థం కావచ్చు.
    reason: כֹּהֵן అనే పదానికి ఈ సందర్భంలో సాధ్యమైన రాజాస్థాన-పరిపాలనా అర్థాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: עֲזַרְיָהוּ
  choice: అజర్యాహు
  rationale: హీబ్రూ పేరులోని -యాహు ముగింపును నిలుపుతూ తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: בֶן נָתָן
  choice: నాతాను కుమారుడు
  rationale: వంశ లేదా కుటుంబ సంబంధాన్ని తెలిపే సహజమైన తెలుగు రూపం.
- source_word: עַל הַנִּצָּבִים
  choice: ప్రాంతాధికారుల పర్యవేక్షకుడిగా
  rationale: עַל అధికారాన్ని లేదా పర్యవేక్షణను సూచిస్తుంది; נִצָּבִים సొలొమోను పరిపాలనా సందర్భంలో నియమిత ప్రాంతాధికారులను సూచిస్తుంది.
- source_word: זָבוּד
  choice: జాబూదు
  rationale: హీబ్రూ వ్యక్తిపేరుకు తెలుగు లిప్యంతరీకరణ.
- source_word: כֹּהֵן
  choice: యాజకుడిగా
  rationale: పదానికి సాధారణమైన ప్రత్యక్ష అర్థం ‘యాజకుడు’; రాజాస్థాన సందర్భంలో ఉన్న ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: רֵעֶה הַמֶּלֶךְ
  choice: రాజుకు స్నేహితుడిగా
  rationale: అక్షరార్థాన్ని సహజమైన తెలుగులో అందిస్తుంది; ఇది రాజుకు సన్నిహిత విశ్వాసపాత్రుడనే అధికారిక భావాన్ని కూడా కలిగి ఉండవచ్చు.
theological_decisions:
- issue: రాజాస్థాన పరిపాలనా సందర్భంలో כֹּהֵן అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘యాజకుడు’
  alternative: ‘ప్రధాన మంత్రి’ లేదా ‘రాజ సలహాదారు’
  rationale: హీబ్రూ పదపు సాధారణ అర్థాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భం సూచించగల రాజాస్థాన పదవి భావాన్ని పాదసూచికలో ఇచ్చాం; ఏ ప్రత్యేక సిద్ధాంత వ్యాఖ్యానాన్నీ పాఠ్యంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పరిపాలనా జాబితాకు తగిన గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలి. రెండు హీబ్రూ ఖండాలను తెలుగులో సహజంగా రెండు వాక్యాలుగా ఇచ్చాం; జాబూదుకు వర్తించే రెండు పాత్రలను ‘యాజకుడిగా, రాజుకు స్నేహితుడిగా’ అని సమాంతరంగా ఉంచాం.
