translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పరిపాలనా జాబితా స్వరూపాన్ని నిలుపుతూ సంక్షిప్తమైన గౌరవప్రద శైలిని ఉపయోగించాం. మొదటి నామవాచక వాక్యంలోని హీబ్రూ సంక్షిప్తతను తెలుగు పఠనసౌలభ్యం కోసం పూర్తి వాక్యంగా మలిచాం. స్థలనామాలు, వ్యక్తినామాలు సాధారణ బైబిల్ తెలుగు రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి.
