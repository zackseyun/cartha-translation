source:
  edition: WLC
  text: בֶּן גֶּ֖בֶר בְּ/רָמֹ֣ת גִּלְעָ֑ד ל֡/וֹ חַוֺּת֩ יָאִ֨יר בֶּן מְנַשֶּׁ֜ה אֲשֶׁ֣ר בַּ/גִּלְעָ֗ד ל֚/וֹ חֶ֤בֶל אַרְגֹּב֙ אֲשֶׁ֣ר בַּ/בָּשָׁ֔ן שִׁשִּׁים֙ עָרִ֣ים גְּדֹל֔וֹת חוֹמָ֖ה וּ/בְרִ֥יחַ נְחֹֽשֶׁת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/013.yaml
  text: 'Ben-geber[a], in Ramoth-gilead—to him belonged the villages of Jair son of Manasseh, which are in Gilead; to him belonged the region of Argob[b], which is in Bashan: sixty large cities with walls and bronze bars.'
translation:
  language: te
  text: రామోతు-గిలాదులో బెన్-గెబెరు అధికారి. గిలాదులో ఉన్న మనష్షే కుమారుడైన యాయీరు గ్రామాలు[a] అతని ఆధీనంలో ఉండేవి. బాషానులో ఉన్న అర్గోబు ప్రాంతం[b] కూడా అతని ఆధీనంలో ఉండేది—అందులో ప్రాకారాలు, కంచు అడ్డగడియలు గల అరవై పెద్ద పట్టణాలు ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యాయీరు గుడారపు నివాసాలు’; లేదా పేరును లిప్యంతరీకరిస్తే ‘హవ్వోత్-యాయీరు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అర్గోబు జిల్లా’ లేదా ‘అర్గోబు భూభాగం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן גֶּבֶר
  choice: బెన్-గెబెరు
  rationale: ఈ పరిపాలనా అధికారుల జాబితాలో ఇది ఒక వ్యక్తి పేరులా పనిచేస్తోంది. అందువల్ల ‘గెబెరు కుమారుడు’ అని అర్థానువాదం చేయకుండా పేరుగా లిప్యంతరీకరించబడింది.
- source_word: בְּרָמֹת גִּלְעָד
  choice: రామోతు-గిలాదులో
  rationale: ב ఇక్కడ స్థలాన్ని సూచిస్తుంది; సంయుక్త స్థలనామాన్ని తెలుగులో సహజంగా లిప్యంతరీకరించాం.
- source_word: לֹו
  choice: అతని ఆధీనంలో ఉండేవి / ఉండేది
  rationale: ఈ జాబితా సందర్భంలో לו స్వాధీనతతోపాటు అప్పగించబడిన పరిపాలనా పరిధిని సూచించగలదు. ‘అతని ఆధీనంలో’ అనే పదబంధం ఆ పరిపాలనా భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: חַוֺּת יָאִיר
  choice: యాయీరు గ్రామాలు
  rationale: חַוֺּת అనేది నివాస సముదాయాలు లేదా గ్రామాలను సూచిస్తుంది. సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ‘గ్రామాలు’ అని అనువదించి, మరింత అక్షరార్థ ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
- source_word: אֲשֶׁר בַּגִּלְעָד
  choice: గిలాదులో ఉన్న
  rationale: ఈ సంబంధవాచక వాక్యభాగం యాయీరు గ్రామాల భౌగోళిక స్థానాన్ని తెలుపుతుంది.
- source_word: חֶבֶל אַרְגֹּב
  choice: అర్గోబు ప్రాంతం
  rationale: חֶבֶל ఇక్కడ కొలవబడిన భూభాగం, జిల్లా లేదా ప్రాంతాన్ని సూచిస్తుంది. ‘ప్రాంతం’ ఆధునిక తెలుగులో సహజమైన విస్తృత పదం.
- source_word: אֲשֶׁר בַּבָּשָׁן
  choice: బాషానులో ఉన్న
  rationale: ఈ వాక్యభాగం అర్గోబు ప్రాంతం ఉన్న భౌగోళిక స్థానాన్ని సూచిస్తుంది.
- source_word: שִׁשִּׁים עָרִים גְּדֹלוֹת
  choice: అరవై పెద్ద పట్టణాలు
  rationale: גְּדֹלוֹת పరిమాణం లేదా ప్రాముఖ్యతను సూచించవచ్చు. ‘పెద్ద’ ఆ రెండు భావాలకు తగిన సహజ తెలుగు పదం.
- source_word: חוֹמָה
  choice: ప్రాకారాలు గల
  rationale: ఈ పదం పట్టణాల రక్షణ గోడను సూచిస్తుంది. అరవై పట్టణాలను సమష్టిగా వర్ణిస్తున్నందున తెలుగులో బహువచనం సహజంగా ఉంది.
- source_word: וּבְרִיחַ נְחֹשֶׁת
  choice: కంచు అడ్డగడియలు గల
  rationale: בְרִיחַ ద్వారాన్ని బిగించే అడ్డగడియ లేదా గడియను సూచిస్తుంది, ద్వారాన్ని కాదు. ‘కంచు అడ్డగడియలు’ మూలంలోని కోట రక్షణ చిత్రాన్ని నిలుపుతుంది.
