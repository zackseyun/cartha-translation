id: 1KI.4.3
reference: 1 Kings 4:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֱלִיחֹ֧רֶף וַ/אֲחִיָּ֛ה בְּנֵ֥י שִׁישָׁ֖א סֹפְרִ֑ים יְהוֹשָׁפָ֥ט בֶּן אֲחִיל֖וּד הַ/מַּזְכִּֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/003.yaml
  text: Elihoreph and Ahijah[a], the sons of Shisha, were secretaries[c][b]; Jehoshaphat the son of Ahilud was the recorder.
translation:
  language: te
  text: షీషా[a] కుమారులైన ఎలీహోరెపు, అహీయా రాజలేఖకులు[b]; అహీలూదు కుమారుడైన యెహోషాపాతు రాజసభ నమోదుల అధికారి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ పాఠంలో “షీషా కుమారులు.” 2 సమూయేలు 8:17లోని సమాంతర వచనంలో దీనికి సంబంధిత నామరూపం “షవ్షా”గా ఉంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, “లేఖకులు.” హెబ్రీ పదం రాజసభలో రచన, పత్రాల నిర్వహణ బాధ్యతలు కలిగిన అధికారులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “జ్ఞాపకాధికారి,” “వృత్తాంతకర్త.” ఈ రాజసభ అధికారి నమోదులను భద్రపరచి, విషయాలను రాజు దృష్టికి తెచ్చేవాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלִיחֹרֶף וַאֲחִיָּה
  choice: ఎలీహోరెపు, అహీయా
  rationale: వ్యక్తుల పేర్లను హెబ్రీ ఉచ్చారణకు దగ్గరగా, తెలుగులో సహజంగా లిప్యంతరీకరించాం; సంయోజకాన్ని తెలుగు జాబితా నిర్మాణంలో సహజంగా వ్యక్తపరిచాం.
- source_word: בְּנֵי שִׁישָׁא
  choice: షీషా కుమారులైన
  rationale: మసొరెటిక్ పాఠంలోని బంధుత్వ సూచనను నేరుగా నిలిపి, పేరును ప్రస్తుత వచనంలోని రూపానుసారంగా లిప్యంతరీకరించాం.
- source_word: סֹפְרִים
  choice: రాజలేఖకులు
  rationale: ఇక్కడ సాధారణ లేఖకులు కాక రాజసభలో రచనా, పత్రాల నిర్వహణ బాధ్యతగల అధికారుల భావం ఉంది. తరువాతి ప్రత్యేక పదవితో గందరగోళం రాకుండా ఈ ఎంపిక చేశాం.
- source_word: יְהוֹשָׁפָט בֶּן אֲחִילוּד
  choice: అహీలూదు కుమారుడు యెహోషాపాతు
  rationale: తెలుగు సహజ నామక్రమంలో పితృసంబంధాన్ని స్పష్టంగా అందించాం; వ్యక్తి పేర్లను లిప్యంతరీకరించాం.
- source_word: הַמַּזְכִּיר
  choice: రాజ్యవృత్తాంతాల అధికారి
  rationale: రాజసభ విషయాలను నమోదు చేసి, అవసరమైన సంగతులను రాజు దృష్టికి తెచ్చే ప్రత్యేక అధికారిని సూచిస్తుంది. ఆధునిక పాఠకునికి పదవి స్వభావం అర్థమయ్యేలా అనువదించాం.
