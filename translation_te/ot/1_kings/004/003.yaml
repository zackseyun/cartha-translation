translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే పరిపాలనా పదజాలాన్ని వాడాం. రెండు హెబ్రీ పదవుల మధ్య తేడాను నిలిపేందుకు סֹפְרִים ను ‘రాజలేఖకులు,’ הַמַּזְכִּיר ను ‘రాజ్యవృత్తాంతాల అధికారి’గా వేరు చేశాం. ఇంగ్లీషు సంప్రదింపుపాఠంలోని మొదటి పాదటిప్పణి గుర్తు స్థానభ్రంశంతో ఉన్నందున, ప్రస్తుత హెబ్రీ పాఠం స్పష్టంగా ‘షీషా కుమారులు’ అని చదివే విషయాన్ని ప్రధాన పాఠంలోనే అనువదించి, అవసరం లేని సమాంతర నామరూప గమనికను చేర్చలేదు.
