id: 1KI.4.2
reference: 1 Kings 4:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֥לֶּה הַ/שָּׂרִ֖ים אֲשֶׁר ל֑/וֹ עֲזַרְיָ֥הוּ בֶן צָד֖וֹק הַ/כֹּהֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/002.yaml
  text: 'And these were the officials who were his: Azariah son of Zadok[a], the priest[b];'
translation:
  language: te
  text: 'ఇవి అతనికి ఉన్న అధికారులు: సాదోకు కుమారుడైన అజర్యా, యాజకుడు[a];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో, “సాదోకు కుమారుడు అజర్యా, యాజకుడు.” ఇక్కడ “యాజకుడు” అనేది అజర్యాను సూచిస్తుందని కొందరు, సాదోకును సూచిస్తుందని మరికొందరు అర్థం చేసుకుంటారు. మూలపాఠం “ప్రధాన యాజకుడు” అని స్పష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: వీరు
  rationale: ఈ పదబంధం తరువాత వచ్చే అధికారుల జాబితాను పరిచయం చేస్తుంది. తెలుగు జాబితా-ప్రారంభంలో ‘వీరు’ సహజంగా ఉంటుంది; వాక్యసంధి భావం సందర్భంలో స్పష్టమవుతుంది.
- source_word: הַשָּׂרִים
  choice: అధికారులు
  rationale: ఈ పరిపాలనా సందర్భంలో שָׂרִים రాజ్యంలోని ఉన్నతస్థాయి పాలకులను లేదా నిర్వాహకులను సూచిస్తుంది. ‘అధికారులు’ వంశపారంపర్య రాజకుమారులు అనే భావాన్ని అనవసరంగా కలిగించకుండా పదార్థాన్ని అందిస్తుంది.
- source_word: אֲשֶׁר לוֹ
  choice: అతనికి ఉన్న
  rationale: ఈ సంబంధవాచక పదబంధం వారు సొలొమోను పరిపాలనకు చెందినవారని సూచిస్తుంది. వారి నిర్దిష్ట విధిని అదనంగా నిర్ణయించకుండా స్వామ్య/అనుబంధ భావాన్ని నిలుపుతుంది.
- source_word: עֲזַרְיָהוּ
  choice: అజర్యా
  rationale: హీబ్రూ వ్యక్తినామానికి సహజమైన తెలుగు లిప్యంతరీకరణ.
- source_word: בֶן צָדוֹק
  choice: సాదోకు కుమారుడైన
  rationale: సాధారణ పితృసంబంధ నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַכֹּהֵן
  choice: యాజకుడు
  rationale: హీబ్రూ పదం నిర్దిష్ట ఏకవచనంలో ‘యాజకుడు’ అని మాత్రమే చెబుతుంది; ‘ప్రధాన యాజకుడు’ అని విస్తరించదు.
theological_decisions:
- issue: ‘యాజకుడు’ అనే అన్వయపదం అజర్యాను సూచిస్తుందా, సాదోకును సూచిస్తుందా
  choice: మూలంలోని పదక్రమాన్ని అనుసరించి ‘సాదోకు కుమారుడైన అజర్యా, యాజకుడు’ అని ఉంచి, సందిగ్ధతను పాదసూచికలో తెలియజేయడం
  alternative: ‘యాజకుడైన సాదోకు కుమారుడు అజర్యా’ లేదా ‘ప్రధాన యాజకుడైన అజర్యా’
  rationale: హీబ్రూ వాక్యనిర్మాణంలో ‘యాజకుడు’ అనేది అజర్యాకు బిరుదుగా ఉండవచ్చు లేదా సాదోకును గుర్తించవచ్చు. అంతేకాక మూలపాఠంలో ‘ప్రధాన యాజకుడు’ అనే పదం లేదు; కాబట్టి ఏ భావాన్నీ ప్రధాన వాక్యంలో బలవంతంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే పరిపాలనా పదజాలం వాడబడింది. మూలంలోని సంక్షిప్త జాబితా శైలి మరియు అన్వయ సందిగ్ధత నిలుపబడ్డాయి.
