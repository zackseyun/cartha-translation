id: 1KI.4.1
reference: 1 Kings 4:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְהִי֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה מֶ֖לֶךְ עַל כָּל יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/001.yaml
  text: King Solomon was king over all Israel.
translation:
  language: te
  text: రాజైన సొలొమోను ఇశ్రాయేలు అంతటిమీద రాజుగా ఉన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ఉన్నాడు
  rationale: ఇక్కడ היה రూపం కొత్త విభాగాన్ని ప్రారంభించే కథన సంధిగా పనిచేస్తూ, ప్రధానంగా సొలొమోను రాజుగా ఉన్న స్థితిని తెలియజేస్తుంది. తెలుగులో ప్రత్యేకంగా ‘అప్పుడు’ లేదా ‘ఇప్పుడు’ చేర్చకుండా సహజమైన భూతకాల విధేయంతో ఆ భావం వ్యక్తమవుతుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజైన
  rationale: నిర్దిష్ట నామవాచకం వ్యక్తినామానికి సమానాధికార విశేషణంగా వచ్చి ‘రాజైన సొలొమోను’ అనే బిరుదు భావాన్ని ఇస్తుంది.
- source_word: שְׁלֹמֹה
  choice: సొలొమోను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: מֶלֶךְ
  choice: రాజుగా
  rationale: రెండోసారి వచ్చిన מלך విధేయ నామవాచకం; ‘పరిపాలించాడు’ అనే క్రియారూపం కన్నా మూలంలోని నామవాచక నిర్మాణాన్ని నిలుపుతుంది.
- source_word: עַל
  choice: మీద
  rationale: రాజాధికార సందర్భంలో ప్రజలపై అధికారాన్ని సూచిస్తుంది; ‘ఇశ్రాయేలు అంతటిమీద’ సహజమైన తెలుగు ప్రయోగం.
- source_word: כָּל
  choice: అంతటి
  rationale: ఇశ్రాయేలు సమగ్రతను సూచించే పరిమాణ పదం; విభక్తి సంధితో ‘అంతటిమీద’గా ఇవ్వబడింది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: తెలుగు బైబిలు సంప్రదాయంలో ప్రాచుర్యమున్న జాతీయ నామరూపం.
theological_decisions:
- issue: מלך పదం రెండుసార్లు రావడం
  choice: ‘రాజైన సొలొమోను ... రాజుగా ఉన్నాడు’ అని రెండు సందర్భాలనూ ప్రతిబింబించడం
  alternative: ‘సొలొమోను ఇశ్రాయేలు అంతటినీ పరిపాలించాడు’
  rationale: మొదటి מלך బిరుదుగా, రెండవది విధేయ నామవాచకంగా ఉంది. రెండింటినీ నిలుపడం సొలొమోను సమస్త ఇశ్రాయేలుపై స్థిరపడిన రాజత్వాన్ని మూలానికి దగ్గరగా వ్యక్తం చేస్తుంది; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా గౌరవప్రదమైన గ్రంథశైలితో అనువదించబడింది. మూలంలోని పునరుక్తిని తెలుగులో సహజంగా నిలిపేందుకు ‘రాజైన ... రాజుగా’ నిర్మాణం వాడబడింది.
