translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని వాడాం. వచనం అధికారుల జాబితాలో భాగమైనందున జాబితా స్వరూపాన్ని నిలుపుతూ డాష్, అర్థవిరామ చిహ్నాలను ఉపయోగించాం. మూలంలోని చివరి పదబంధపు నిజమైన అస్పష్టతను ప్రధాన పాఠ్యంలో అక్షరార్థంగా ఉంచి, ప్రత్యామ్నాయ పరిపాలనా భావాన్ని పాదటిప్పణిలో నమోదు చేశాం.
