  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: גֶּ֥בֶר בֶּן אֻרִ֖י בְּ/אֶ֣רֶץ גִּלְעָ֑ד אֶ֜רֶץ סִיח֣וֹן מֶ֣לֶךְ הָ/אֱמֹרִ֗י וְ/עֹג֙ מֶ֣לֶךְ הַ/בָּשָׁ֔ן וּ/נְצִ֥יב אֶחָ֖ד אֲשֶׁ֥ר בָּ/אָֽרֶץ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/019.yaml
  text: Geber son of Uri[a], in the land of Gilead, the land of Sihon king of the Amorites and of Og king of Bashan; and he was the only governor who was in the land.
translation:
  language: te
  text: ఊరి కుమారుడు గెబెరు—గిలాదు దేశంలో, అనగా అమోరీయుల రాజైన సీహోను, బాషాను రాజైన ఓగుల దేశంలో ఉన్న ఏకైక అధికారి ఇతడే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ దేశానికి అధికారిగా ఉన్న ఏకైక వ్యక్తి ఇతడే.” హీబ్రూ పదబంధం అక్షరార్థంగా “ఆ దేశంలో ఉన్న” అని ఉంటుంది; అయితే కొందరు దాన్ని పరిపాలనా భావంలో అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר
  choice: గెబెరు
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן אֻרִי
  choice: ఊరి కుమారుడు
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: בְּאֶרֶץ גִּלְעָד
  choice: గిలాదు దేశంలో
  rationale: אֶרֶץ అనే ‘దేశం/భూభాగం’ భావాన్ని నిలుపుతూ, తరువాతి సమానాధికార వివరణతో హీబ్రూ నిర్మాణాన్ని ప్రతిబింబిస్తుంది.
- source_word: אֶרֶץ סִיחוֹן מֶלֶךְ הָאֱמֹרִי וְעֹג מֶלֶךְ הַבָּשָׁן
  choice: అంటే అమోరీయుల రాజైన సీహోను దేశంలోను, బాషాను రాజైన ఓగు దేశంలోను
  rationale: ఈ పదబంధం గిలాదు ప్రాంతాన్ని ఆ ఇద్దరు రాజుల పూర్వ భూభాగాల ద్వారా మరింత నిర్దిష్టంగా గుర్తిస్తుంది; తెలుగులో సంబంధాన్ని స్పష్టంచేయడానికి ‘అంటే’ వాడాం.
- source_word: נְצִיב
  choice: అధికారి
  rationale: 1 రాజులు 4లోని పరిపాలనా సందర్భంలో నియమిత ప్రాంతీయ అధికారిని సూచిస్తుంది; ‘అధికారి’ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే విస్తృత పదం.
- source_word: אֶחָד
  choice: ఏకైక
  rationale: ఒక్కడే ఉన్నాడనే హీబ్రూ సంఖ్యాపదంలోని ఉద్ఘాటనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: ఆ దేశంలో ఉన్న
  rationale: హీబ్రూలోని בְּ (‘లో’) అనే ఉపసర్గను నేరుగా నిలుపుతుంది; పరిపాలనా అర్థమైన ‘దేశం మీద/దేశానికి’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఇస్తుంది.
