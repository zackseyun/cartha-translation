base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/004.yaml
  text: Benaiah son of Jehoiada was over the army[a], and Zadok and Abiathar were priests.
translation:
  language: te
  text: యెహోయాదా కుమారుడైన బెనాయా సైన్యానికి అధిపతిగా ఉన్నాడు; సాదోకు, అబ్యాతారు యాజకులుగా ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, כֹּהֲנִים అనే పదాన్ని ఇక్కడ రాజసభ పరిపాలనకు సంబంధించిన విస్తృత అర్థంలో గ్రహిస్తే, “ప్రధాన అధికారులు” లేదా “ముఖ్య పాలనాధికారులు.”
    reason: alternative_reading
lexical_decisions:
- source_word: עַל הַצָּבָא
  choice: సైన్యానికి అధిపతిగా ఉన్నాడు
  rationale: עַל అనే పూర్వప్రత్యయం ఇక్కడ బాధ్యత లేదా అధికారాన్ని సూచిస్తుంది. హెబ్రీ పాఠంలో లేని నిర్దిష్ట సైనిక హోదాను చేర్చకుండా, సహజమైన ఆధునిక తెలుగులో ఈ భావాన్ని తెలియజేస్తుంది.
- source_word: הַצָּבָא
  choice: సైన్యం
  rationale: ఈ సందర్భంలో צָבָא వ్యవస్థీకృత సైనిక బలగాన్ని సూచిస్తుంది; కాబట్టి ‘సైన్యం’ స్పష్టమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: כֹּהֲנִים
  choice: యాజకులు
  rationale: ఈ పదానికి సాధారణమైన, ప్రధానమైన అర్థం ‘యాజకులు.’ సాదోకు, అబ్యాతారు ఇతర చోట్ల కూడా యాజకులుగా గుర్తించబడినందున ఇదే పాఠాధారిత అనువాదం.
- source_word: בְנָיָהוּ
  choice: బెనాయా
  rationale: హెబ్రీ వ్యక్తిపేరును తెలుగులో సహజంగా లిప్యంతరీకరించాం.
- source_word: יְהוֹיָדָע
  choice: యెహోయాదా
  rationale: హెబ్రీ వ్యక్తిపేరును తెలుగులో సహజంగా లిప్యంతరీకరించాం.
- source_word: צָדוֹק
  choice: సాదోకు
  rationale: హెబ్రీ వ్యక్తిపేరును తెలుగులో సహజంగా లిప్యంతరీకరించాం.
- source_word: אֶבְיָתָר
  choice: అబ్యాతారు
  rationale: హెబ్రీ వ్యక్తిపేరును తెలుగులో సహజంగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: రాజసభ అధికారుల జాబితా సందర్భం కారణంగా כֹּהֲנִים అనే పదాన్ని ఆరాధనాపరమైన అర్థం కాకుండా ‘ప్రధాన అధికారులు’ అని అనువదించాలా?
  choice: యాజకులు
  alternative: ప్రధాన అధికారులు / ముఖ్య పాలనాధికారులు
  rationale: ఈ హెబ్రీ పదానికి సాధారణ అర్థం ‘యాజకులు’; అంతేకాక సాదోకు, అబ్యాతారు యాజకులుగా ప్రసిద్ధులు. అందువల్ల సందర్భం పేరిట ఊహాత్మకమైన పరిపాలనా అర్థాన్ని ప్రధాన పాఠంలో పెట్టకుండా, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో ఉంది. ‘అధిపతిగా’ అనేది అధికార బాధ్యతను తెలియజేస్తుంది, కానీ పాఠంలో లేని నిర్దిష్ట సైనిక బిరుదును చేర్చదు. పాదసూచిక గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
