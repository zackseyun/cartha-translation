  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని ఉపమానం, కొనసాగుతున్న సుఖసంతోష స్థితి రెండూ నిలుపబడ్డాయి.
