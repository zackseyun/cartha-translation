lexical_decisions:
- source_word: יְהוֹשָׁפָט
  choice: యెహోషాపాతు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా, తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశసంబంధాన్ని తెలిపే సాధారణ హీబ్రూ పదానికి సహజమైన తెలుగు సమానార్థకం; ఈ పరిపాలనా జాబితాలో తండ్రి పేరును సూచిస్తుంది.
- source_word: פָּרוּחַ
  choice: పారూవహు
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి సమీపంగా తెలుగులో లిప్యంతరీకరించాం; చివరి ח ధ్వనిని తెలుగు పఠనానికి అనుకూలంగా ‘హు’తో సూచించాం.
- source_word: בְּ/יִשָׂשכָר
  choice: ఇశ్శాఖారులో
  rationale: בְ ఉపసర్గానికి ప్రాథమికమైన ‘లో’ భావాన్ని నిలిపి, అధికారి సేవ చేసిన గోత్రప్రాంతాన్ని సహజంగా సూచిస్తుంది; పరిపాలనా అర్థాన్ని స్పష్టంచేసే ‘ఇశ్శాఖారుపై’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
