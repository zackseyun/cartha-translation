  source_fidelity: హీబ్రూ వాక్యంలోని వ్యక్తిపేరు, పితృనామ సూచన, మరియు בְ ('లో/లోని')తో కూడిన ఇశ్శాఖారు ప్రాంత-సూచనను ముసాయిదా మొత్తంగా నిలుపుతుంది. అయితే פָּרוּחַ పేరులోని హీబ్రూ רוּחַ ధ్వనిక్రమానికి ‘పారూవహు’ సరిపోదు; అది అదనపు ‘వ’ను చేర్చుతుంది.
