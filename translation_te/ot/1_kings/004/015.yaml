translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా పరిపాలనా సందర్భాన్ని ప్రధాన వాక్యంలో స్వల్పంగా వెల్లడించాం. వ్యక్తి పేర్లను గౌరవప్రదమైన తెలుగు బైబిలు శైలిలో లిప్యంతరీకరించాం; హీబ్రూ వాక్యంలోని సంక్షిప్త జాబితా ధోరణిని నిలిపేందుకు వాక్యాన్ని మితంగా ఉంచాం.
