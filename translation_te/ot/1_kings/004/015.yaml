source:
  edition: WLC
  text: אֲחִימַ֖עַץ בְּ/נַפְתָּלִ֑י גַּם ה֗וּא לָקַ֛ח אֶת בָּשְׂמַ֥ת בַּת שְׁלֹמֹ֖ה לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/015.yaml
  text: Ahimaaz[a], in Naphtali; he too took Basemath, the daughter of Solomon[b], as a wife.
translation:
  language: te
  text: నఫ్తాలి ప్రాంతంలో[a] అహీమయసు అధికారి; ఇతడూ సొలొమోను కుమార్తె బాసెమతును వివాహం చేసుకున్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నఫ్తాలిపై అధికారి” లేదా “నఫ్తాలికి అధికారి”; ఇక్కడి హీబ్రూ ఉపసర్గ ఈ అధికారుల జాబితాలో అహీమయసుకు అప్పగించిన ప్రాంతాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ అక్షరార్థం: “సొలొమోను కుమార్తె బాసెమతును భార్యగా తీసుకున్నాడు”; ఇది ఆమెను వివాహం చేసుకున్నాడని తెలిపే సాధారణ నుడికారం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִימַעַץ
  choice: అహీమయస్సు
  rationale: హీబ్రూ వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు నామరూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בְּנַפְתָּלִי
  choice: నఫ్తాలి ప్రాంతంలో అధికారి
  rationale: ఈ పరిపాలనా అధికారుల జాబితాలో בְ భౌగోళిక అధికార పరిధిని సూచిస్తుంది. తెలుగులో కేవలం ‘నఫ్తాలిలో’ అంటే నివాసస్థలంగా అపార్థం కావచ్చు కాబట్టి, సందర్భం సూచించే ‘ప్రాంతంలో అధికారి’ అని స్పష్టం చేశాం; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: גַּם הוּא
  choice: అతడు కూడా
  rationale: ముందు పేర్కొన్న అధికారులతో ఇతనిని కలిపే హీబ్రూ పదబంధంలోని అదనపు ఉద్ఘాటనను సహజమైన తెలుగులో నిలిపాం.
- source_word: לָקַח ... לְאִשָּׁה
  choice: భార్యగా చేసుకున్నాడు
  rationale: అక్షరార్థంగా ‘భార్యగా తీసుకున్నాడు’ అయిన ఈ ప్రామాణిక హీబ్రూ వివాహ నుడికారాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో ‘భార్యగా చేసుకున్నాడు’ అని అనువదించాం; మూల నుడికారాన్ని పాదసూచికలో తెలిపాం.
- source_word: בָּשְׂמַת
  choice: బాశెమతు
  rationale: హీబ్రూ స్త్రీ పేరును తెలుగు ధ్వని, నామరూప సంప్రదాయాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בַּת שְׁלֹמֹה
  choice: సొలొమోను కుమార్తె
  rationale: హీబ్రూ నిర్మాణ సంబంధాన్ని నేరుగా, సహజమైన తెలుగులో వ్యక్తపరిచాం.
