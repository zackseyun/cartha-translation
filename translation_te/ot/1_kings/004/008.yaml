base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/008.yaml
  text: 'And these were their names: Ben-hur[a], in the hill country of Ephraim;'
translation:
  language: te
  text: 'వారి పేర్లు ఇవి: ఎఫ్రాయిము కొండప్రాంతంలో బెన్‌హూరు[a];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, దీనిని వ్యక్తినామంగా కాక పితృనామంగా తీసుకుంటే, ‘హూరు కుమారుడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: వారి పేర్లు ఇవి
  rationale: హీబ్రూ వాక్యం క్రియలేనిది; ఆధునిక తెలుగులో జాబితాను సహజంగా పరిచయం చేస్తూ దాని సరళమైన భావాన్ని నిలుపుతుంది. ప్రారంభ וְ సందర్భంలో జాబితా కొనసాగింపును సూచించినా, తెలుగులో ప్రత్యేకంగా ‘మరియు’ చేర్చడం అసహజంగా ఉంటుంది.
- source_word: בֶּן חוּר
  choice: బెన్‌హూరు
  rationale: అధికారుల జాబితాలో దీనిని వ్యక్తినామంగా లిప్యంతరీకరించాం; అయితే ‘హూరు కుమారుడు’ అనే పితృనామార్థం కూడా సాధ్యమే కాబట్టి పాదసూచికలో ఉంచాం.
- source_word: בְּהַר אֶפְרָיִם
  choice: ఎఫ్రాయిము కొండప్రాంతంలో
  rationale: ఇక్కడ הַר ఒకే కొండను కాక ఎఫ్రాయిము ఉన్నత భూభాగాన్ని సూచించే ప్రాదేశిక ప్రయోగం; ‘కొండప్రాంతం’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: సాధారణ ఆధునిక ప్రామాణిక తెలుగులో, పరిపాలనా జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. హీబ్రూలోని పేరుపరమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
