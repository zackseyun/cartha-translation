source:
  edition: WLC
  text: וְ/לִ/שְׁלֹמֹ֞ה שְׁנֵים עָשָׂ֤ר נִצָּבִים֙ עַל כָּל יִשְׂרָאֵ֔ל וְ/כִלְכְּל֥וּ אֶת הַ/מֶּ֖לֶךְ וְ/אֶת בֵּית֑/וֹ חֹ֧דֶשׁ בַּ/שָּׁנָ֛ה יִהְיֶ֥ה עַל אחד לְ/כַלְכֵּֽל־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/007.yaml
  text: And Solomon had twelve deputies over all Israel[a], and they provided for the king and his household; each one had to provide for one month in the year.
translation:
  language: te
  text: సొలొమోనుకు ఇశ్రాయేలంతటిమీద పన్నెండుమంది నియమిత అధికారులు[a] ఉండేవారు. వారు రాజుకు, అతని రాజగృహానికి కావలసిన సరఫరాలను సమకూర్చేవారు. సంవత్సరంలో ఒక్కొక్కరు తమ వంతు వచ్చినప్పుడు ఒక నెలపాటు వాటిని సమకూర్చే బాధ్యత వహించేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పరిపాలకులు,’ ‘పాలనాధికారులు,’ ‘అధికారులు.’ హీబ్రూ పదం విస్తృతంగా నియమిత పరిపాలనా బాధ్యతగల వ్యక్తులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁלֹמֹה
  choice: సొలొమోనుకు ... ఉండేవారు
  rationale: లామెద్ ఇక్కడ స్వామ్యార్థక దత్తివుగా ఉంది; ఆధునిక తెలుగులో ‘సొలొమోనుకు ... ఉండేవారు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: שְׁנֵים עָשָׂר
  choice: పన్నెండుమంది
  rationale: వ్యక్తులను లెక్కిస్తున్నందున తెలుగు వ్యక్తివాచక సంఖ్యారూపం వాడబడింది.
- source_word: נִצָּבִים
  choice: నియమిత అధికారులు
  rationale: ఈ పదం ఒక బాధ్యతకు నియమించబడిన పరిపాలకులను విస్తృతంగా సూచిస్తుంది; వారి హోదాను అతిగా నిర్దిష్టం చేయకుండా సందర్భానుగుణ భావాన్ని ఇస్తుంది.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలంతటిమీద
  rationale: עַל ఇక్కడ పరిపాలనా అధికారాన్ని లేదా బాధ్యతా పరిధిని సూచిస్తుంది; ‘మీద’ మూలంలోని భావాన్ని నిలుపుతుంది.
- source_word: וְכִלְכְּלוּ
  choice: కావలసిన సరఫరాలను సమకూర్చేవారు
  rationale: כלכל ఇక్కడ రాజాస్థానానికి అవసరమైన ఆహారం మరియు ఇతర సామగ్రిని సమకూర్చడాన్ని సూచిస్తుంది; ‘పోషించేవారు’ కంటే సందర్భం స్పష్టంగా ఉంటుంది.
- source_word: אֶת הַמֶּלֶךְ וְאֶת בֵּיתוֹ
  choice: రాజుకు, అతని గృహస్థులకు
  rationale: בֵּיתוֹ ఇక్కడ భవనం కంటే రాజు ఇంటివారిని లేదా రాజగృహ వ్యవస్థను సూచిస్తుంది; ‘గృహస్థులు’ ఆ మానవ సమూహ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חֹדֶשׁ בַּשָּׁנָה יִהְיֶה עַל אֶחָד
  choice: సంవత్సరంలో ఒక్కొక్క నెలకు ఒక్కొక్కరు ... బాధ్యత వహించేవారు
  rationale: అక్షరార్థంగా ‘సంవత్సరంలో ఒక నెల ఒక్కనిమీద ఉండేది’; పన్నెండుమంది వంతులవారీగా నెల చొప్పున బాధ్యత వహించారనే పంపిణీ భావాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: לְכַלְכֵּל
  choice: వాటిని సమకూర్చే
  rationale: ముందున్న כלכל క్రియతో పదార్థ సమన్వయం పాటిస్తూ, పునరుక్తిని భారంగా చేయకుండా ‘వాటిని’ అనే సూచన వాడబడింది.
