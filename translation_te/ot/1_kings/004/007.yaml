  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. పరిపాలనా హోదాను అతిగా నిర్దిష్టం చేయకుండా, సరఫరా బాధ్యతను సందర్భానుగుణంగా స్పష్టం చేసింది.
