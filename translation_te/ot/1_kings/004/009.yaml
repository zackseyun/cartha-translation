  language: en
  yaml_path: translation/ot/1_kings/004/009.yaml
  text: Ben-deker[a], in Makaz, in Shaalbim, in Beth-shemesh, and in Elon-beth-hanan.
translation:
  language: te
  text: బెన్-దెకెరు[a] మాకాజులో, షయల్బీములో, బేత్-షెమెషులో, ఏలోన్-బేత్-హానానులో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, ‘దెకెరు కుమారుడు’; ఇక్కడ హీబ్రూ నామరూపాన్ని వ్యక్తి గుర్తింపుగా ‘బెన్-దెకెరు’ అని ఉంచాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן דֶּקֶר
  choice: బెన్‌-దెకెరు
  rationale: పరిపాలనా అధికారుల ఈ జాబితాలో ఇది కేవలం ‘దెకెరు కుమారుడు’ అనే వర్ణనగా కాక, వ్యక్తిని గుర్తించే నామరూపంగా పనిచేస్తోంది. అందువల్ల హీబ్రూ నామరూపాన్ని లిప్యంతరీకరించాం.
- source_word: בְּ/מָקַץ
  choice: మాకసులో
  rationale: בְ ఉపసర్గ ఇక్కడ అధికారితో సంబంధమున్న ప్రాంతాన్ని స్థానార్థకంగా సూచిస్తోంది; సందర్భం నుంచి ‘మీద అధికారిగా’ అని చేర్చకుండా నేరుగా ‘లో’ అని అనువదించాం.
- source_word: וּ/בְ/שַׁעַלְבִים
  choice: షయల్బీములో
  rationale: సంయోజకంతో కూడిన స్థానార్థక ఉపసర్గను సహజమైన తెలుగు జాబితా నిర్మాణంలో ‘లో’ విభక్తితో చూపించాం; స్థలనామాన్ని లిప్యంతరీకరించాం.
- source_word: וּ/בֵית שָׁמֶשׁ
  choice: బేత్‌షెమెషులో
  rationale: ఉపసర్గ పదంలో మళ్లీ ప్రత్యక్షంగా లేకపోయినా, ముందటి స్థానార్థక వరుస ఇక్కడ కొనసాగుతుంది. స్థలనామాన్ని అర్థానువాదం చేయకుండా లిప్యంతరీకరించాం.
- source_word: וְ/אֵילֹון בֵּית חָנָן
  choice: ఏలోన్‌-బేత్‌-హానానులో
  rationale: పట్టణాల జాబితాలో దీనిని సమాస స్థలనామంగా తీసుకున్నాం. ముందటి పదాల నుంచి కొనసాగుతున్న స్థానార్థాన్ని తెలుగులో ‘లో’ విభక్తితో వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన పరిపాలనా జాబితా శైలిని నిలిపాం. మూలంలో క్రియ లేని నిర్మాణాన్ని అలాగే ఉంచి, స్థలనామాలకు సహజమైన ‘లో’ విభక్తిని వాడాం.
