lexical_decisions:
- source_word: בַּֽעֲנָא
  choice: బయనా
  rationale: వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగు లిప్యంతరీకరణ చేయబడింది.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశసంబంధాన్ని తెలిపే సాధారణ హీబ్రూ నిర్మాణానికి సహజమైన తెలుగు సమానం.
- source_word: חוּשָׁי
  choice: హూషై
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: בְּ/אָשֵׁר
  choice: ఆషేరు ప్రాంతంలో
  rationale: בְ అనే ఉపసర్గ ప్రాథమికంగా ‘లో’ అని అర్థం ఇస్తుంది; అధికారుల జాబితా సందర్భంలో ఇది అతనికి అప్పగించిన భూభాగాన్ని సూచిస్తుంది. తెలుగులో స్పష్టత కోసం ‘ప్రాంతం’ చేర్చబడింది.
- source_word: וּ/בְעָלֽוֹת
  choice: బయాలోతులోను
  rationale: ఈ రూపాన్ని రెండవ స్థలనామమైన ‘బయాలోతు’గా తీసుకున్నాం. హీబ్రూలో ఉపసర్గ మళ్లీ లేకపోయినా, తెలుగులో రెండు ప్రాంతాల సమాంతర సంబంధాన్ని సహజంగా చూపడానికి ‘లోను’ వాడబడింది; పాఠ్య-భౌగోళిక అనిశ్చితిని పాదసూచికలో నిలిపాం.
