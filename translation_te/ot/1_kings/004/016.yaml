  register: ఆధునిక ప్రామాణిక తెలుగులో, పరిపాలనా జాబితికి తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలి. స్థలనామాల మధ్య సంబంధం తెలుగులో సహజంగా ఉండేందుకు సమాంతర విభక్తి ప్రయోగించబడింది.
