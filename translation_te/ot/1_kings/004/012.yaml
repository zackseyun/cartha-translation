id: 1KI.4.12
reference: 1 Kings 4:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בַּֽעֲנָא֙ בֶּן אֲחִיל֔וּד תַּעְנַ֖ךְ וּ/מְגִדּ֑וֹ וְ/כָל בֵּ֣ית שְׁאָ֡ן אֲשֶׁר֩ אֵ֨צֶל צָרְתַ֜נָ/ה מִ/תַּ֣חַת לְ/יִזְרְעֶ֗אל מִ/בֵּ֤ית שְׁאָן֙ עַ֚ד אָבֵ֣ל מְחוֹלָ֔ה עַ֖ד מֵ/עֵ֥בֶר לְ/יָקְמֳעָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/012.yaml
  text: 'Baana son of Ahilud: Taanach and Megiddo[a], and all Beth-shean, which is beside Zarethan below Jezreel, from Beth-shean to Abel-meholah, as far as beyond Jokmeam.'
translation:
  language: te
  text: 'అహీలూదు కుమారుడు బానా: తానాకు, మెగిద్దో, అలాగే సారెతాను పక్కన, యెజ్రెయేలు దిగువన ఉన్న బేత్-షెయాను ప్రాంతమంతా; బేత్-షెయాను మొదలుకొని ఆబేల్-మెహోలా వరకు, యొక్మెయాముకు అవతల వరకు[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యొక్మెయాముకు అవతల ఉన్న ప్రాంతం వరకు.” హీబ్రూ సరిహద్దు వ్యక్తీకరణ సంక్షిప్తంగా ఉండి, దాని నిర్మాణం కొంత క్లిష్టంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּֽעֲנָא֙ בֶּן אֲחִיל֔וּד
  choice: అహీలూదు కుమారుడు బయనా
  rationale: వ్యక్తుల పేర్లను అనువదించకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: תַּעְנַ֖ךְ וּ/מְגִדּ֑וֹ
  choice: తానాకు, మెగిద్దో
  rationale: ఈ స్థలపేర్లను హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం; జాబితాలోని అనుసంధానాన్ని తెలుగులో సహజమైన విరామచిహ్నంతో చూపించాం.
- source_word: וְ/כָל בֵּ֣ית שְׁאָ֡ן
  choice: బేత్-షెయాను ప్రాంతమంతా
  rationale: స్థలపేరుతో వచ్చిన כָל ఇక్కడ ఆ పట్టణంతో అనుబంధమైన మొత్తం ప్రాంతాన్ని సూచిస్తుంది; ‘ప్రాంతమంతా’ అనే రూపం ఆ పరిపాలనా-భౌగోళిక భావాన్ని స్పష్టం చేస్తుంది.
- source_word: אֲשֶׁר֩ אֵ֨צֶל צָרְתַ֜נָ/ה
  choice: సారెతాను పక్కన ఉన్న
  rationale: אֵצֶל అనే పదంలోని ‘పక్కన/దగ్గర’ అనే స్థాన సంబంధాన్ని, దూరాన్ని అతిగా నిర్దేశించకుండా ‘పక్కన’గా ఇచ్చాం.
- source_word: מִ/תַּ֣חַת לְ/יִזְרְעֶ֗אל
  choice: యెజ్రెయేలు దిగువన
  rationale: ఈ పదబంధం భౌగోళికంగా తక్కువ ఎత్తులో ఉన్న స్థానాన్ని సూచించగలదు. దిశను ఊహించి ‘దక్షిణాన’ అని చెప్పకుండా మూలంలోని స్థలాకృతి భావాన్ని నిలిపాం.
- source_word: מִ/בֵּ֤ית שְׁאָן֙ עַ֚ד אָבֵ֣ל מְחוֹלָ֔ה
  choice: బేత్-షెయాను మొదలుకొని ఆబేల్-మెహోలా వరకు
  rationale: מִן...עַד సరిహద్దు విస్తృతిని సూచిస్తుంది; తెలుగులో సహజంగా ‘మొదలుకొని ... వరకు’ అని ఇచ్చాం.
- source_word: עַ֖ד מֵ/עֵ֥בֶר לְ/יָקְמֳעָֽם
  choice: యొక్మెయాముకు అవతల వరకు[a]
  rationale: మూలంలోని సంక్షిప్తమైన, కొంత క్లిష్టమైన సరిహద్దు వ్యక్తీకరణను విస్తరించి వ్యాఖ్యానించకుండా ‘అవతల వరకు’గా నిలిపాం; సాఫీగా చదివే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: רשימת הנציבים המשתמעת מן ההקשר
  choice: బయనా పరిధిలో ... ఉన్నాయి
  rationale: ఈ వచనం అధికారులూ వారి పరిధులూ ఉన్న జాబితాలో భాగం. హీబ్రూలో సంక్షిప్తంగా ఉన్న నామవాచక జాబితాను తెలుగులో పూర్తి, సహజ వాక్యంగా చేయడానికి సందర్భం సూచించే ‘పరిధిలో ... ఉన్నాయి’ చేర్చాం.
