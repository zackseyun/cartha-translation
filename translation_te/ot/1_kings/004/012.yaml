translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన భాషను ఉపయోగించాం. స్థలపేర్లను హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం. అధికార పరిధుల జాబితా అనే సందర్భాన్ని తెలుగులో సహజ వాక్య నిర్మాణంతో వ్యక్తం చేశాం; చివరి సరిహద్దు పదబంధంలోని నిజమైన అస్పష్టతను పాదసూచికలో నిలిపాం.
