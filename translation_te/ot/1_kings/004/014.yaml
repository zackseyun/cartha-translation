  rationale: స్థలనామానికి దిశను సూచించే ప్రత్యయం ఉన్నప్పటికీ, ఈ పరిపాలనా జాబితా సందర్భంలో మహనయీము కేంద్రంగా ఉన్న ప్రాంతీయ బాధ్యత లేదా స్థానం ఉద్దేశించబడినట్లు కనిపిస్తుంది; అందువల్ల ప్రధాన పాఠంలో సహజమైన స్థానార్థక రూపాన్ని వాడాం.
