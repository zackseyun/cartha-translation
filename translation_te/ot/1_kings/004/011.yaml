translation:
  language: te
  text: బెన్-అబీనాదాబు దోరు నాఫాతు అంతటికి అధికారిగా ఉన్నాడు; సొలొమోను కుమార్తె తాఫతు అతని భార్య.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אֲבִינָדָב
  choice: అబీనాదాబు కుమారుడు
  rationale: ఇక్కడ בֶּן‌ను వ్యక్తిపేరులో భాగంగా లిప్యంతరీకరించకుండా, సహజమైన తెలుగు వంశసంబంధ పదబంధంగా అనువదించాం.
- source_word: כָּל נָפַת דֹּאר
  choice: దోరు నాఫాతు ప్రాంతమంతటిమీద
  rationale: נָפַת అనే అరుదైన పరిపాలనా/భౌగోళిక పదానికి ‘ఎత్తైన ప్రాంతం’ అనే సాధ్యార్థం ఉన్నప్పటికీ, ఇది దోరుకు సంబంధించిన ప్రాంతనామం లేదా జిల్లాసూచక పదం కావచ్చు; అసలులోని అనిశ్చితిని నిలుపుటకు ‘నాఫాతు’ అని లిప్యంతరీకరించి ‘ప్రాంతం’తో స్పష్టం చేశాం.
- source_word: טָפַת
  choice: తాఫతు
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగులో ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: הָיְתָה לּוֹ לְאִשָּׁה
  choice: అతని భార్య
  rationale: హీబ్రూ స్వామ్య-స్థితి నిర్మాణాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరంగా, సాధారణ పాఠకులకు సులభంగా రూపొందించబడింది. ముందరి వచనాల నుంచి కొనసాగుతున్న అధికారుల జాబితా సందర్భాన్ని తెలుపుటకు ‘అధికారిగా ఉన్నాడు’ అని పూరించబడింది; ఇది హీబ్రూ జాబితా నిర్మాణంలో అధ్యాహారమైన భావం.
