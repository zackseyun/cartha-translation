id: 1KI.18.35
reference: 1 Kings 18:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּלְכ֣וּ הַ/מַּ֔יִם סָבִ֖יב לַ/מִּזְבֵּ֑חַ וְ/גַ֥ם אֶת הַ/תְּעָלָ֖ה מִלֵּא מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/035.yaml
  text: And the water went all around the altar[b][a], and it also filled the trench with water.
translation:
  language: te
  text: నీరు బలిపీఠం చుట్టూ ప్రవహించింది; మరియు అతడు కందకాన్ని[a] కూడా నీళ్లతో నింపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కాలువను,’ ‘గోతిని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: ప్రవహించాయి
  rationale: మూల క్రియ అక్షరార్థంగా ‘వెళ్లాయి’ అని ఉన్నా, నీళ్లు కర్తగా ఉన్న ఈ సందర్భంలో వాటి ప్రవాహాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ప్రవహించాయి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הַמַּיִם
  choice: నీళ్లు
  rationale: తెలుగులో సాధారణంగా వాడే సహజ బహువచన రూపం; హీబ్రూ పదార్థాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: סָבִיב לַמִּזְבֵּחַ
  choice: బలిపీఠం చుట్టూ
  rationale: బలిపీఠం పరిసరమంతా నీళ్లు ప్రవహించాయనే స్థలార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְגַם
  choice: కూడా
  rationale: రెండవ చర్యను మొదటి దానికి జోడించి ఉద్ఘాటించే మూలపాఠ భావాన్ని నిలుపుతుంది.
- source_word: אֶת־הַתְּעָלָה
  choice: కందకాన్ని
  rationale: బలిపీఠం చుట్టూ తవ్విన గోతిని సూచించడానికి ‘కందకం’ స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
- source_word: מִלֵּא
  choice: అతడు ... నింపాడు
  rationale: హీబ్రూ క్రియ పుంలింగ ఏకవచనంలో ఉంది; కర్త ప్రత్యక్షంగా లేకపోయినా సందర్భంలో ఏలీయాను సూచించే ‘అతడు’ను తెలుగులో స్పష్టత కోసం చేర్చాం.
- source_word: מָיִם
  choice: నీళ్లతో
  rationale: ‘నింపాడు’ అనే తెలుగు క్రియతో సాధనార్థక విభక్తి సహజంగా అవసరం.
theological_decisions:
- issue: మִלֵּא క్రియకు కర్త ఎవరు?
  choice: ‘అతడు ... నింపాడు’ అని అనువదించి, సందర్భంలోని ఏలీయాను అంతర్నిహిత కర్తగా ఉంచడం
  alternative: ‘కందకం కూడా నీళ్లతో నిండింది’ లేదా ‘నీళ్లు కందకాన్ని నింపాయి’
  rationale: మూలంలోని מִלֵּא పుంలింగ ఏకవచన క్రియ; ‘నీళ్లు’ అనే బహువచన నామవాచకంతో సాధారణ వ్యాకరణ సమన్వయం లేదు. అందువల్ల అంతర్నిహిత మానవ కర్తను ప్రధాన పాఠంలో నిలిపాం; అయితే కొన్ని అనువాదాలు నీళ్లనే భావకర్తగా తీసుకునే అవకాశాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘వెళ్లాయి’ అనే కఠిన అక్షరానువాదం బదులు నీటి కదలికకు సహజమైన ‘ప్రవహించాయి’ ఎంచుకోబడింది. మూలంలోని అంతర్నిహిత కర్తను ‘అతడు’గా వ్యక్తం చేసి, ప్రత్యామ్నాయ అవగాహనను పాదటిప్పణిలో భద్రపరిచాం.
