base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/026.yaml
  text: So they took the bull that had been given to them[a], prepared it, and called on the name of Baal from morning until noon, saying, “O Baal, answer us!” But there was no voice, and no one answered. And they limped around the altar that had been made.
translation:
  language: te
  text: కాబట్టి వారు తమకు ఇవ్వబడిన ఎద్దును తీసుకొని సిద్ధం చేశారు. ఉదయం నుంచి మధ్యాహ్నం వరకు, “బయలూ, మాకు జవాబివ్వు!” అని అంటూ బయలు పేరున మొరపెట్టుకున్నారు. అయితే ఏ స్వరమూ వినిపించలేదు; ఎవరూ జవాబివ్వలేదు. వారు చేయబడిన ఆ బలిపీఠం చుట్టూ కుంటుతూ తిరిగారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కుంటుతూ తిరిగారు” అని అనువదించిన హీబ్రూ క్రియను “నాట్యం చేశారు” లేదా “గెంతారు” అని కూడా అనువదించవచ్చు. ఇది కుంటడం లేదా గెంతడం వంటి ఆచారపరమైన కదలికను సూచించే అవకాశం ఉంది; 21వ వచనంలో ఏలీయా ఉపయోగించిన అదే ధాతువును ఉద్దేశపూర్వకంగా ప్రతిధ్వనింపజేయవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ אֶת הַפָּר
  choice: ఎద్దును తీసుకొని
  rationale: לקח యొక్క సాధారణ కథనార్థమైన ‘తీసుకొను’ను నిలుపుతుంది; פַּר బలికి ఉపయోగించే ఎద్దును సూచిస్తుంది.
- source_word: אֲשֶׁר נָתַן לָהֶם
  choice: తమకు ఇవ్వబడిన
  rationale: ముందటి వచనంలో ఏలీయా వారికి ఇచ్చిన ఎద్దును సూచిస్తుంది; తెలుగు సహజత్వం కోసం కర్మణి రూపం వాడబడింది.
- source_word: וַיַּעֲשׂוּ
  choice: సిద్ధం చేశారు
  rationale: బలి సందర్భంలో ఇది ఎద్దును బలికి సిద్ధం చేయడాన్ని సూచించే సంక్షిప్త ప్రయోగం; ‘అర్పించారు’ అనడం సందర్భాన్ని మించిపోతుంది.
- source_word: וַיִּקְרְאוּ בְשֵׁם הַבַּעַל
  choice: బయలు పేరున మొరపెట్టుకున్నారు
  rationale: קרא בשם అనే ఆరాధనా సందర్భపు ప్రార్థనా ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵהַבֹּקֶר וְעַד הַצָּהֳרַיִם
  choice: ఉదయం నుంచి మధ్యాహ్నం వరకు
  rationale: కాలవ్యవధిని స్పష్టంగా, సహజంగా తెలుపుతుంది.
- source_word: הַבַּעַל עֲנֵנוּ
  choice: బయలూ, మాకు జవాబివ్వు!
  rationale: ప్రత్యక్ష సంబోధనను, ప్రార్థనలోని ענה యొక్క ‘జవాబివ్వు’ అర్థాన్ని నిలుపుతుంది.
- source_word: וְאֵין קוֹל וְאֵין עֹנֶה
  choice: ఏ స్వరమూ వినిపించలేదు; జవాబిచ్చేవాడూ లేడు
  rationale: హీబ్రూలోని రెండు భాగాల బలమైన నిరాకరణను నిలుపుతూ తెలుగులో సహజంగా వినిపిస్తుంది.
- source_word: וַיְפַסְּחוּ
  choice: కుంటుతూ గెంతారు
  rationale: ఈ క్రియలో ఉండగల కుంటడం/గెంతడం అనే ఆచారపరమైన కదలికను ఉద్దేశపూర్వకంగా కొంత విస్తృతంగా నిలుపుతుంది; 21వ వచనంలోని అదే ధాతువుతో ఉన్న సాహిత్య సంబంధాన్ని పూర్తిగా చెరపదు.
- source_word: עַל הַמִּזְבֵּחַ
  choice: బలిపీఠం చుట్టూ
  rationale: ఈ ఆచార కదలిక సందర్భంలో עַל‌ను బలిపీఠం మీద అని కాక, దాని చుట్టూ లేదా దాని వద్ద కదలడంగా గ్రహించడం సందర్భోచితం.
- source_word: אֲשֶׁר עָשָׂה
  choice: తాము చేసిన
  rationale: మసొరేటిక్ పాఠంలో క్రియ ఏకవచనంగా ఉన్నా, స్పష్టమైన కర్త పేర్కొనబడలేదు. సమూహాన్ని సమష్టి కర్తగా తీసుకొని తెలుగులో సహజంగా అనువదించబడింది; పాఠభేద/అర్థసందిగ్ధతను గమనికలో సూచించవచ్చు.
theological_decisions:
- issue: బయలు పేరున పిలిచే ప్రయోగం
  choice: బయలు పేరున మొరపెట్టుకున్నారు
  alternative: బయలును ఆహ్వానించారు
  rationale: దేవతను సంబోధించే మూలభాషా ప్రయోగాన్ని నిలుపుతుంది; దానికి చెల్లుబాటు లేదా శక్తి ఉందని అనువాదం ద్వారా సూచించదు.
- issue: וַיְפַסְּחוּ యొక్క ఆచార కదలిక
  choice: కుంటుతూ గెంతారు
  alternative: నాట్యం చేశారు
  rationale: సాధారణ ‘నాట్యం’గా సాఫీ చేయకుండా, కుంటడం లేదా గెంతడం అనే సంభావ్య భావాన్ని మరియు 21వ వచనంతో ఉన్న వ్యంగ్యభరిత ధాతుసంబంధాన్ని నిలుపుతుంది.
- issue: אֲשֶׁר עָשָׂה లోని అనిర్దిష్ట కర్త
  choice: తాము చేసిన
  alternative: చేయబడిన
  rationale: మూలంలో కర్త స్పష్టంగా లేకపోవడంతో ఏలీయా లేదా మరొక నిర్దిష్ట వ్యక్తిని చేర్చలేదు. సమూహాన్ని సమష్టిగా సూచించే పఠనం సందర్భానికి సరిపోతుంది, అయితే వ్యాకరణ ఉద్రిక్తతను పూర్తిగా పరిష్కరించినట్లు ప్రకటించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి. ‘బయలూ’ ప్రత్యక్ష సంబోధనకు సహజమైన రూపం. ‘కుంటుతూ గెంతారు’ కొద్దిగా అసాధారణంగా వినిపించినా మూలంలోని పదప్రయోగం, ఆచార కదలిక, సాహిత్య వ్యంగ్యాన్ని కాపాడేందుకు ఉద్దేశపూర్వకంగా ఎంచుకోబడింది.
