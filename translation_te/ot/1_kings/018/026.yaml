  rationale: The revision removes the unsupported plural subject from the ambiguous altar clause by using a passive construction. It also avoids conflating distinct lexical alternatives for וַיְפַסְּחוּ in the main text, while preserving them in the anchored footnote and retaining the likely wordplay with verse 21. Minor wording is smoothed for modern standard Telugu without changing the meaning.
