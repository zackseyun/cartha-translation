  source_fidelity: హీబ్రూ పాఠంలోని ఆజ్ఞ, ‘వారిలో ఒక్కడూ తప్పించుకోకూడదు’ అనే సమగ్ర నిషేధం, పట్టుకోవడం, ఏలీయా వారిని కీషోను నహల్‌కు కిందికి తీసుకువెళ్లడం, అక్కడ వధించడం—అన్నీ ముసాయిదాలో విశ్వసనీయంగా ప్రతిఫలించాయి. అయితే ‘కీషోను వాగు దగ్గరికి’ అనేది నహల్‌కు చేరకుండా కేవలం సమీపానికి తీసుకెళ్లిన భావాన్ని కలిగించవచ్చు; ‘వద్దకు’ మూలంలోని గమ్యస్థాన భావాన్ని మరింత ఖచ్చితంగా ఇస్తుంది.
