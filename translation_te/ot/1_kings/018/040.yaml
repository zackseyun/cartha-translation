  text: וַ/יֹּאמֶר֩ אֵלִיָּ֨הוּ לָ/הֶ֜ם תִּפְשׂ֣וּ אֶת נְבִיאֵ֣י הַ/בַּ֗עַל אִ֛ישׁ אַל יִמָּלֵ֥ט מֵ/הֶ֖ם וַֽ/יִּתְפְּשׂ֑וּ/ם וַ/יּוֹרִדֵ֤/ם אֵלִיָּ֨הוּ֙ אֶל נַ֣חַל קִישׁ֔וֹן וַ/יִּשְׁחָטֵ֖/ם שָֽׁם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/040.yaml
  text: Then Elijah said to them[a], “Seize the prophets of Baal; let not one of them escape.” And they seized them[b], and Elijah brought them down to the Kishon Wadi and slaughtered them there.
translation:
  language: te
  text: అప్పుడు ఏలీయా వారితో, “బయలు ప్రవక్తలను పట్టుకోండి; వారిలో ఒక్కడు కూడా తప్పించుకోనివ్వకండి[a]” అన్నాడు. వారు వారిని పట్టుకున్నారు. ఏలీయా వారిని కీషోను వాగు[b] వద్దకు దింపి, అక్కడ వారిని వధించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో అక్షరార్థంగా: “వారిలో ఒక పురుషుడు తప్పించుకోకూడదు.” ఇది “వారిలో ఒక్కడు కూడా తప్పించుకోకూడదు” అనే భావమిచ్చే ప్రయోగం.'
    reason: lexical_alternative
  - marker: b
    text: లేదా “కీషోను నీటివాగు.” హీబ్రూ నహల్ అనే పదం వాగు, వాగు మార్గం, లేదా కాలానుగుణంగా నీరు ప్రవహించే లోయను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְשׂוּ / וַיִּתְפְּשׂוּם
  choice: పట్టుకోండి / పట్టుకున్నారు
  rationale: תפשׂ బలవంతంగా అదుపులోకి తీసుకోవడాన్ని సూచిస్తుంది. సందర్భంలో ‘పట్టుకోండి’ సహజమైన, అత్యవసరతను నిలుపుకునే తెలుగు; ఆజ్ఞలోను దాని అమలులోను ఒకే క్రియను ఉంచాం.
- source_word: נְבִיאֵי הַבַּעַל
  choice: బయలు ప్రవక్తలు
  rationale: హీబ్రూ సమాసాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తూ ఆ గుంపు గుర్తింపును యథాతథంగా ఉంచుతుంది.
- source_word: אִישׁ אַל יִמָּלֵט מֵהֶם
  choice: వారిలో ఒక్కడు కూడా తప్పించుకోనివ్వకండి
  rationale: అక్షరార్థంగా పురుష ఏకవచనం ఉన్నప్పటికీ ఇది పంపిణీయ భావంతో ‘వారిలో ఒక్క వ్యక్తి కూడా’ అని అర్థమిచ్చే హీబ్రూ ప్రయోగం. తెలుగు వాక్యం ఆ బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: וַיּוֹרִדֵם
  choice: వారిని ... దగ్గరికి దింపి
  rationale: ירד హిఫీల్ రూపంలోని ‘కిందికి తీసుకెళ్లడం’ అనే కారణార్థాన్ని ‘దింపి’ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: נַחַל קִישׁוֹן
  choice: కీషోను వాగు
  rationale: נַחַל ప్రవహించే వాగునూ, కాలానుగుణంగా నీరు ప్రవహించే వాగు మార్గాన్నీ సూచించవచ్చు. ‘వాగు’ ఆధునిక తెలుగులో సహజంగా ఉండి భౌగోళిక పదంలోని విస్తృతిని చాలావరకు నిలుపుతుంది.
- source_word: וַיִּשְׁחָטֵם
  choice: వారిని వధించాడు
  rationale: שׁחט సాధారణ ‘చంపడం’ కంటే వధించడం అనే తీవ్రమైన అర్థం కలిగిన క్రియ. ‘వధించాడు’ హింసాత్మక చర్యను మెత్తబరచకుండా, విధానాన్ని అనవసరంగా విపులీకరించకుండా తెలుపుతుంది.
- source_word: שָׁם
  choice: అక్కడ
  rationale: సాధారణ స్థలవాచక క్రియావిశేషణానికి నేర సమానార్థకం.
theological_decisions:
- issue: బయలు ప్రవక్తలపై జరిగిన హింసాత్మక చర్యను ఎలా అనువదించాలి
  choice: ఏలీయా వారిని ‘వధించాడు’ అని నేరుగా అనువదించడం
  alternative: ‘మరణశిక్ష అమలు చేశాడు’ లేదా ‘చంపాడు’ అని మెత్తగా చెప్పడం; లేక ఈ వచనంలో లేని దైవ ఆదేశాన్ని చేర్చడం
  rationale: హీబ్రూ పాఠం పట్టుకోవడాన్నీ వధించడాన్నీ స్పష్టంగా వర్ణిస్తుంది. అందువల్ల హింస తీవ్రతను తగ్గించకుండా, అదే సమయంలో పాఠంలో లేని నైతిక లేదా దైవశాస్త్ర వ్యాఖ్యను చేర్చకుండా అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరత కలిగిన కథన శైలి వాడాం. ‘బయలు,’ ‘కీషోను’ అనే రూపాలు తెలుగు బైబిలు పాఠకులకు పరిచితమైన నామరూపాలకు అనుగుణంగా ఉన్నాయి. హింసను మెత్తబరచలేదు; హీబ్రూలో లేని వివరణను కూడా జోడించలేదు.
