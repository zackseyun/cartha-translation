  text: So Obadiah went to meet Ahab and told him[a], and Ahab went to meet Elijah.
translation:
  language: te
  text: ఓబద్యా అహాబును కలవడానికి వెళ్లి అతనికి చెప్పాడు[a]; అహాబు ఏలీయాను కలవడానికి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతనికి నివేదించాడు.’ హీబ్రూ క్రియకు ‘చెప్పాడు,’ ‘నివేదించాడు,’ లేదా ‘తెలియజేశాడు’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: వెళ్లి / వెళ్లాడు
  rationale: הלך క్రియ యొక్క వయిక్తోల్ రూపం ఇక్కడ కథనాన్ని ముందుకు నడిపిస్తూ సాధారణ గమనాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సందర్భానుసారంగా ‘వెళ్లి’, ‘వెళ్లాడు’ సహజంగా ఉంటాయి.
- source_word: עֹבַדְיָהוּ
  choice: ఓబద్యా
  rationale: హీబ్రూ వ్యక్తినామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: לִקְרַאת
  choice: కలుసుకోవడానికి
  rationale: ఒక వ్యక్తివైపు వెళ్లి అతనిని ఎదుర్కొని కలుసుకోవడాన్ని ఈ నిర్మాణం సూచిస్తుంది; ‘కలుసుకోవడానికి’ ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אַחְאָב
  choice: అహాబు
  rationale: హీబ్రూ వ్యక్తినామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: וַיַּגֶּד לוֹ
  choice: అతనికి విషయం తెలియజేశాడు
  rationale: נגד హిఫీల్ రూపానికి ‘తెలియజేయు, నివేదించు, చెప్పు’ అనే అర్థాలు ఉన్నాయి. హీబ్రూ వాక్యంలో తెలిపిన విషయం ప్రత్యక్షంగా పేర్కొనబడలేదు; తెలుగులో ‘విషయం’ అనేది సందర్భసూచకంగా ఉండి దాని వివరాలను అదనంగా నిర్దేశించదు.
- source_word: וַיֵּלֶךְ אַחְאָב
  choice: అప్పుడు అహాబు ... వెళ్లాడు
  rationale: పునరావృత వయిక్తోల్ తదుపరి సంఘటనను సూచిస్తుంది; ‘అప్పుడు’ తెలుగు కథన క్రమాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֵלִיָּהוּ
  choice: ఏలీయా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు బైబిలు వాడుకలో సుపరిచితమైన లిప్యంతరీకరణ.
