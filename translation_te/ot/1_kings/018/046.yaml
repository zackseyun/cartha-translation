source:
  edition: WLC
  text: וְ/יַד יְהוָ֗ה הָֽיְתָה֙ אֶל אֵ֣לִיָּ֔הוּ וַ/יְשַׁנֵּ֖ס מָתְנָ֑י/ו וַ/יָּ֨רָץ֙ לִ/פְנֵ֣י אַחְאָ֔ב עַד בֹּאֲ/כָ֖ה יִזְרְעֶֽאלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/046.yaml
  text: And the hand of Yahweh was on Elijah[b][a], and he tucked up his loins and ran ahead of Ahab as far as the entrance to Jezreel.
translation:
  language: te
  text: యెహోవా హస్తం ఏలీయాపై ఉండగా[a], అతడు పరుగెత్తడానికి తన వస్త్రాన్ని నడుముకు బిగించుకొని[b], అహాబు ముందు యిజ్రెయేలు ప్రవేశం వరకు పరుగెత్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సాంప్రదాయికంగా, “యెహోవా హస్తం ఏలీయా మీదికి వచ్చింది” అని అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అతడు తన నడుమును కట్టుకున్నాడు”; అంటే, పరుగెత్తడానికి తన వస్త్రాన్ని పైకెత్తి నడుముకు బిగించుకున్నాడు.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచింది.
- source_word: וְיָד יְהוָה הָיְתָה אֶל
  choice: యెహోవా హస్తం ... మీద ఉంది
  rationale: హీబ్రూలోని ‘ఉంది’ అనే క్రియను, దైవిక శక్తినివ్వడం లేదా ప్రభావాన్ని సూచించే రూపకాన్ని వివరణతో పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: וַיְשַׁנֵּס מָתְנָיו
  choice: పరుగెత్తడానికి తన వస్త్రాన్ని నడుముకు బిగించుకొని
  rationale: అక్షరార్థంగా నడుమును బిగించుకోవడం అనే నుడికారంలో, పరుగుకు అడ్డురాకుండా వస్త్రాన్ని పైకెత్తి బిగించే సాంస్కృతిక చర్యను సహజమైన ఆధునిక తెలుగులో స్పష్టం చేస్తుంది.
- source_word: וַיָּרָץ לִפְנֵי
  choice: ముందు ... పరుగెత్తాడు
  rationale: అహాబుకు ముందుగా లేదా అతని ఎదుట పరుగెత్తిన స్థలసంబంధ భావాన్ని నిలుపుతుంది; రాజసేవకు సంబంధించిన ప్రత్యేక అర్థాన్ని అనవసరంగా చేర్చదు.
- source_word: עַד בֹּאֲכָה
  choice: ప్రవేశస్థలం వరకు
  rationale: స్థలనామంతో వచ్చిన ఈ నిర్మాణం ఆ పట్టణానికి చేరే ప్రదేశాన్ని లేదా ప్రవేశాన్ని సూచిస్తుంది.
- source_word: יִזְרְעֶאלָה
  choice: యిజ్రెయేలు
  rationale: తెలుగులో సుపరిచితమైన బైబిలు స్థలనామ రూపాన్ని ఉపయోగించింది.
theological_decisions:
- issue: ఏలీయాపై యెహోవా హస్తం ఉండడం యొక్క స్వభావం
  choice: దైవిక కార్యశక్తిని సూచించే ‘యెహోవా హస్తం ఏలీయా మీద ఉంది’ అనే రూపకాన్ని అలాగే ఉంచడం
  alternative: యెహోవా ఏలీయాకు అద్భుతమైన శక్తినిచ్చాడు; లేదా ప్రవచన ప్రేరణ ఏలీయాపైకి వచ్చింది
  rationale: హీబ్రూ నుడికారం దైవిక కార్యాన్ని సూచిస్తుంది గాని, అది అద్భుతమైన శారీరక బలమా, ప్రవచన ప్రేరణా, లేక రెండూనా అనేది నిర్దిష్టంగా చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘హస్తం’ అనే బైబిలు రూపకాన్ని నిలిపి, వస్త్రం బిగించుకునే ప్రాచీన ఆచారాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా తెలిపింది.
