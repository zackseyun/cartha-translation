    rationale: '[a] వాస్తవానికి וַיִּתְנַבְּאוּకు సంబంధించినది కాబట్టి అది ఆ పదం తర్వాత రావాలి; [b] עַד לַעֲלוֹת הַמִּנְחָהకు సంబంధించినది కాబట్టి ‘ధాన్యార్పణ అర్పించే సమయం’ తర్వాత రావాలి. ప్రస్తుతం [b] పాదటీపు అనాథగా ఉంది.'
