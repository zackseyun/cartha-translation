id: 1KI.18.29
reference: 1 Kings 18:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְהִי֙ כַּ/עֲבֹ֣ר הַֽ/צָּהֳרַ֔יִם וַ/יִּֽתְנַבְּא֔וּ עַ֖ד לַ/עֲל֣וֹת הַ/מִּנְחָ֑ה וְ/אֵֽין ק֥וֹל וְ/אֵין עֹנֶ֖ה וְ/אֵ֥ין קָֽשֶׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/029.yaml
  text: And it happened[a], when noon had passed, that they kept prophesying until the offering up of the grain offering, but there was no voice, no one answering[b], and no one paying attention.
translation:
  language: te
  text: అప్పుడు మధ్యాహ్నం గడిచిన తరువాత, ధాన్యార్పణ అర్పించే సమయం వరకు[b] వారు ప్రవచిస్తూనే ఉన్నారు[a]. అయితే ఏ స్వరమూ వినిపించలేదు; జవాబిచ్చేవారెవరూ లేరు, ఆలకించేవారెవరూ లేరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు ఆవేశంతో ఊగిపోయారు.” ఇక్కడ హీబ్రూలో ప్రవచించడానికి సాధారణంగా వాడే క్రియనే ఉపయోగించారు; ఈ సందర్భంలో అది బయలు ప్రవక్తల ఆవేశపూరిత ప్రవర్తనను వర్ణిస్తోంది.
    reason: lexical_alternative
  - marker: b
    text: “ధాన్యార్పణ అర్పించే సమయం” అనే మాటను నిత్య సాయంకాల అర్పణ సమయం అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: సహజ తెలుగు కథన క్రమంలో ప్రత్యేక పదబంధం లేకుండా వ్యక్తీకరించబడింది
  rationale: ఈ వయిఖ్తోల్ రూపం కథలో తదుపరి దశను పరిచయం చేస్తుంది. తెలుగులో ‘ఇలా జరిగింది’ అని చేర్చడం అనవసరంగా భారంగా ఉండేందున వాక్యక్రమం ద్వారానే దాని కథన విధిని తెలియజేశాం.
- source_word: כַּעֲבֹר הַצָּהֳרַיִם
  choice: మధ్యాహ్నం గడిచిన తరువాత
  rationale: כ తో కూడిన క్రియానామ రూపం కాలక్రమాన్ని సూచిస్తుంది; మధ్యాహ్న సమయం దాటిపోయిందనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּתְנַבְּאוּ
  choice: వారు ప్రవచిస్తూనే ఉన్నారు
  rationale: נבא హిత్పయేల్ రూపం ఇక్కడ బయలు ప్రవక్తల నిరంతర ఆవేశపూరిత చర్యను సూచిస్తుంది. ‘ప్రవచించారు’ అనే మూలార్థ సంబంధాన్ని నిలిపి, కొనసాగుతున్న చర్యను ‘-స్తూనే ఉన్నారు’తో వ్యక్తం చేశాం; మరింత వ్యాఖ్యానాత్మక ప్రత్యామ్నాయాన్ని పాదటీపులో ఉంచాం.
- source_word: עַד לַעֲלוֹת הַמִּנְחָה
  choice: ధాన్యార్పణ అర్పించే సమయం వరకు
  rationale: ఈ పదబంధం అక్షరార్థంగా మిన్హా అర్పించబడే వరకు అని చెబుతుంది. מִנְחָה సాధారణంగా ధాన్యార్పణను సూచిస్తుంది; ఇది సాయంకాలపు క్రమమైన అర్పణ సమయాన్ని కూడా సూచించవచ్చనే అవకాశాన్ని పాదటీపులో నిలిపాం.
- source_word: וְאֵין קוֹל
  choice: ఏ స్వరమూ వినిపించలేదు
  rationale: קוֹל అంటే స్వరం లేదా శబ్దం. దేవత నుంచి ఆశించిన ప్రత్యుత్తర సందర్భంలో ‘స్వరం’ తగినది; సహజ తెలుగు కోసం ‘వినిపించలేదు’ చేర్చబడింది.
- source_word: וְאֵין עֹנֶה
  choice: జవాబిచ్చేవాడూ లేడు
  rationale: పార్టిసిపిల్ రూపం జవాబిచ్చే వ్యక్తి ఎవరూ లేరనే నిరంతర స్థితిని తెలియజేస్తుంది.
- source_word: וְאֵין קָשֶׁב
  choice: పట్టించుకునేవాడూ లేడు
  rationale: קָשֶׁב శ్రద్ధ చూపడం లేదా ఆలకించడాన్ని సూచిస్తుంది. ఇక్కడ ఎవరూ వింటున్న సూచన కూడా లేదనే ముగింపు తీవ్రతను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: బయలు ప్రవక్తల ఆవేశపూరిత చర్యను ఎలా అనువదించాలి
  choice: వారు ప్రవచిస్తూనే ఉన్నారు
  alternative: వారు ఆవేశంతో ఊగిపోయారు
  rationale: హీబ్రూ పదం ప్రవచించడానికి వాడే సాధారణ క్రియే అయినప్పటికీ, సందర్భంలో అది అన్యదేవత ప్రవక్తల ఆవేశపూరిత ప్రవర్తనను సూచిస్తుంది. ప్రధాన పాఠంలో మూలపద సంబంధాన్నీ కథనంలోని వ్యంగ్యాన్నీ నిలిపి, వ్యాఖ్యానాత్మక అర్థాన్ని పాదటీపులో ఇచ్చాం.
- issue: מִנְחָה ను అర్పణ రకంగా లేదా దినకాల సూచనగా అర్థం చేసుకోవడం
  choice: ధాన్యార్పణ అర్పించే సమయం
  alternative: క్రమంగా అర్పించే సాయంకాలపు అర్పణ సమయం
  rationale: మూలపాఠంలో ‘సాయంకాలం’ స్పష్టంగా లేదు. కాబట్టి ప్రధాన పాఠం ధాన్యార్పణ అనే ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది; సందర్భానుసార కాలసూచక అర్థాన్ని పాదటీపులో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ప్రవచిస్తూనే ఉన్నారు’ మూలంలోని పదసంబంధాన్నీ కొనసాగుతున్న చర్యనూ నిలుపుతుంది. సమాంతర నిరాకరణలను ‘వినిపించలేదు; ... లేడు, ... లేడు’గా ఉంచి హీబ్రూ వాక్యంలోని పెరుగుతున్న తీవ్రతను ప్రతిబింబించాం.
