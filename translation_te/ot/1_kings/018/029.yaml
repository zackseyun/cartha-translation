revisions:
- from: 'మధ్యాహ్నం గడిచిన తరువాత, ధాన్యార్పణ అర్పించే సమయం వరకు వారు ప్రవచిస్తూనే ఉన్నారు[a]. అయితే ఏ స్వరమూ వినిపించలేదు; జవాబిచ్చేవాడూ లేడు, పట్టించుకునేవాడూ లేడు.


    [a] లేదా, “వారు ఆవేశంతో ఊగిపోయారు.” ఇక్కడ హీబ్రూ భాషలో ప్రవచించడానికి సాధారణంగా వాడే క్రియనే ఉపయోగించారు; ఈ సందర్భంలో అది బయలు ప్రవక్తల ఆవేశపూరిత ప్రవర్తనను వర్ణిస్తోంది.


    [b] “ధాన్యార్పణ అర్పించే సమయం” అనే మాటను క్రమంగా అర్పించే సాయంకాలపు అర్పణ సమయం అని కూడా అర్థం చేసుకోవచ్చు.'
  to: అప్పుడు మధ్యాహ్నం గడిచిన తరువాత, ధాన్యార్పణ అర్పించే సమయం వరకు[b] వారు ప్రవచిస్తూనే ఉన్నారు[a]. అయితే ఏ స్వరమూ వినిపించలేదు; జవాబిచ్చేవారెవరూ లేరు, ఆలకించేవారెవరూ లేరు.
  rationale: 'పాదటీపు చిహ్నాలను వాటి సంబంధిత పదబంధాల వద్ద ఉంచి నిర్మాణ లోపాన్ని సరిచేశాం: [a] ‘ప్రవచిస్తూనే ఉన్నారు’కు, [b] ‘ధాన్యార్పణ అర్పించే సమయం’కు. మూల కథన సంధిని ‘అప్పుడు’తో చేర్చాం. చివరి రెండు నిరాకరణలను సహజ తెలుగు బహువచన-సామాన్య ప్రయోగంతో సవరించినప్పటికీ, మూలంలోని ‘ఎవ్వరూ జవాబివ్వలేదు; ఎవ్వరూ ఆలకించలేదు’ అనే అర్థం మారలేదు.'
