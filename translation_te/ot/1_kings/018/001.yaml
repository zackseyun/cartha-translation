id: 1KI.18.1
reference: 1 Kings 18:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִי֙ יָמִ֣ים רַבִּ֔ים וּ/דְבַר יְהוָ֗ה הָיָה֙ אֶל אֵ֣לִיָּ֔הוּ בַּ/שָּׁנָ֥ה הַ/שְּׁלִישִׁ֖ית לֵ/אמֹ֑ר לֵ֚ךְ הֵרָאֵ֣ה אֶל אַחְאָ֔ב וְ/אֶתְּנָ֥ה מָטָ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/001.yaml
  text: And it happened after many days that the word of Yahweh came to Elijah in the third year[a], saying, “Go, show yourself to Ahab, and I will give rain upon the face of the land.”
translation:
  language: te
  text: 'చాలా రోజుల తరువాత, మూడవ సంవత్సరంలో యాహ్వే వాక్కు ఏలీయాకు వచ్చింది: “వెళ్లి అహాబుకు కనబడు. నేను నేల మీద వర్షం కురిపిస్తాను[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నేల ముఖం మీద వర్షం ఇస్తాను.”
    reason: మూల హీబ్రూలోని נתן (‘ఇవ్వు’) మరియు עַל־פְּנֵי הָאֲדָמָה (‘నేల ముఖం మీద’) అనే పదప్రయోగాలను తెలియజేయడానికి.
lexical_decisions:
- source_word: וַיְהִי יָמִים רַבִּים
  choice: చాలా రోజుల తరువాత
  rationale: హీబ్రూ కథన ప్రవాహాన్ని, దీర్ఘకాలం గడిచిందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וּדְבַר יְהוָה הָיָה אֶל
  choice: యాహ్వే వాక్కు ... వచ్చింది
  rationale: ప్రవక్తకు దేవుని ప్రకటన చేరడాన్ని సూచించే ప్రామాణిక హీబ్రూ సూత్రాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: בַּשָּׁנָה הַשְּׁלִישִׁית
  choice: మూడవ సంవత్సరంలో
  rationale: కాలాన్ని సూచించే హీబ్రూ పదబంధానికి నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: הֵרָאֵה אֶל אַחְאָב
  choice: అహాబుకు కనబడు
  rationale: నిఫాల్ ఆజ్ఞారూపంలోని ‘నిన్ను నీవు కనిపించేలా చేసుకో’ అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְאֶתְּנָה מָטָר
  choice: నేను ... వర్షం కురిపిస్తాను
  rationale: హీబ్రూలో అక్షరార్థంగా ‘వర్షం ఇస్తాను’ ఉన్నప్పటికీ, వర్షాన్ని నేలపై కలిగించడాన్ని తెలుగులో ‘కురిపిస్తాను’ అని చెప్పడం సహజం; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: నేల మీద
  rationale: ‘నేల ముఖం మీద’ అనే హీబ్రూ నుడికారాన్ని సందర్భానుకూలమైన సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉన్నందున దాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
- issue: వర్షాన్ని దేవుడు ‘ఇవ్వడం’ అనే రూపకం
  choice: ప్రధాన పాఠంలో ‘వర్షం కురిపిస్తాను’; పాదసూచికలో అక్షరార్థం
  alternative: ‘వర్షం ఇస్తాను’
  rationale: దేవుడే వర్షానికి మూలమనే భావాన్ని నిలుపుతూ, ఆధునిక తెలుగులో అసహజత రాకుండా చేశాం; మూలంలోని ‘ఇవ్వడం’ అనే రూపకాన్ని పాదసూచిక ద్వారా పారదర్శకంగా తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ప్రవచన సూత్రంలోని ‘వాక్కు వచ్చింది’ అనే నిర్మాణం నిలుపబడింది; ప్రత్యక్ష వాక్యంలో సంక్షిప్త ఆజ్ఞారూపాలు ఉపయోగించబడ్డాయి.
