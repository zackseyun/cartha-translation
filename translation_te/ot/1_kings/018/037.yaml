translation:
  language: te
  text: “యాహ్వే, నాకు జవాబివ్వు; నాకు జవాబివ్వు. ఈ ప్రజలు నీవే, యాహ్వే, దేవుడవని[a], నీవే వారి హృదయాన్ని వెనక్కి తిప్పావని[b] తెలుసుకునేలా జవాబివ్వు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవే, యాహ్వే, ఆ దేవుడవని.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “వారి హృదయం” అని ఏకవచనంలో ఉంది; ఇది ప్రజలందరినీ ఒక సమూహంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנֵנִי
  choice: నాకు జవాబివ్వు
  rationale: ప్రార్థనా సందర్భంలో దేవుడు కార్యం ద్వారా స్పందించాలని కోరే భావం ఉంది. పునరుక్తిని మూలపాఠంలోని ఉద్ఘాటన కోసం యథాతథంగా నిలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: וְיֵדְעוּ
  choice: అప్పుడు ... తెలుసుకుంటారు
  rationale: వావ్‌తో కూడిన అసంపూర్ణ క్రియ ఇక్కడ ఏలీయా ప్రార్థనకు ఉద్దేశించిన ఫలితాన్ని తెలియజేస్తుంది; తెలుగులో ‘అప్పుడు ... తెలుసుకుంటారు’ సహజంగా ఆ ప్రయోజన-ఫలిత సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: הָעָם הַזֶּה
  choice: ఈ ప్రజలు
  rationale: עם సమూహవాచక ఏకవచనమైనా, ఆధునిక సహజ తెలుగులో ‘ఈ ప్రజలు’ స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: כִּי אַתָּה יְהוָה הָאֱלֹהִים
  choice: నీవే, యెహోవా, దేవుడవని
  rationale: బయలుకు విరుద్ధంగా యెహోవాయే నిజమైన దేవుడని గుర్తించే ఉద్ఘాటనను ‘నీవే’ ద్వారా నిలిపాం. האלהים లోని నిర్దిష్ట ఉపపదాన్ని ‘ఆ దేవుడు’గా కూడా ప్రతిబింబించవచ్చు; ఆ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: הֲסִבֹּתָ
  choice: తిప్పావని
  rationale: సבב హిఫిల్ రూపంలోని కారణకర్తృత్వాన్ని నిలుపుతూ, దేవుడే తిరుగుదలకు కారకుడని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶת לִבָּם
  choice: వారి హృదయాన్ని
  rationale: మూలంలోని ఏకవచన ‘హృదయం’ ప్రజలందరినీ ఒక సమూహంగా సూచిస్తుంది; దాని సంఖ్యను ప్రధాన పాఠంలో నిలిపాం.
- source_word: אֲחֹרַנִּית
  choice: వెనక్కి
  rationale: తిరుగు లేదా పునరాగమన భావాన్ని అదనపు వివరణ లేకుండా సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ప్రజల తిరుగుదలలో దేవుని కార్యం
  choice: నీవే వారి హృదయాన్ని వెనక్కి తిప్పావని
  alternative: నీవే వారి హృదయాన్ని తిరిగి నీ వైపు మళ్లిస్తున్నావని
  rationale: పూర్తిక్రియను పూర్తయిన దైవకార్యంగా అనువదించి, ప్రజల తిరుగుదలలో దేవుని బలమైన కారణకర్తృత్వాన్ని తగ్గించలేదు. అయితే ‘వెనక్కి’ ఏ దిశకు అన్నది మూలంలో స్పష్టీకరించబడనందున ప్రధాన పాఠంలో ‘నీ వైపు’ అని చేర్చలేదు.
- issue: הָאֱלֹהִים లోని నిర్దిష్టత
  choice: దేవుడవని
  alternative: ఆ దేవుడవని
  rationale: తెలుగులో ‘నీవే ... దేవుడవని’ విరుద్ధతను సహజంగా తెలియజేస్తుంది; హీబ్రూ నిర్దిష్ట ఉపపదాన్ని మరింత ప్రత్యక్షంగా చూపే రూపాన్ని పాదటిప్పణిలో నిలిపాం.
