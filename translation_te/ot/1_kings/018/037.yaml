  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనకు తగిన గంభీరతతో రూపొందించబడింది. మూలపాఠంలోని రెండుసార్ల ‘నాకు జవాబివ్వు’ పునరుక్తి, దైవనామం, సమూహవాచక ఏకవచన ‘హృదయం,’ అలాగే దేవుని కారణకర్తృత్వం నిలుపబడ్డాయి.
