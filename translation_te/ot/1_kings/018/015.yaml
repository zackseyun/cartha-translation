source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אֵֽלִיָּ֔הוּ חַ֚י יְהוָ֣ה צְבָא֔וֹת אֲשֶׁ֥ר עָמַ֖דְתִּי לְ/פָנָ֑י/ו כִּ֥י הַ/יּ֖וֹם אֵרָאֶ֥ה אֵלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/015.yaml
  text: And Elijah said[a], “As Yahweh of hosts lives, before whom I stand, today I will surely present myself to him.”
translation:
  language: te
  text: 'ఏలీయా ఇలా అన్నాడు: “నేను ఎవరి సన్నిధిలో నిలబడి ఉన్నానో, ఆ సేనల యాహ్వే జీవం తోడు, ఈ రోజే నేను తప్పకుండా అతని ఎదుట ప్రత్యక్షమవుతాను[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతనికి కనబడతాను” / “అతనికి తనను తాను చూపించుకొంటాను.” హీబ్రూ క్రియకు ‘కనబడడం,’ ‘ప్రత్యక్షమవడం,’ లేదా ‘తనను తాను చూపించుకోవడం’ అనే భావాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: యాహ్వే జీవం తోడు
  rationale: ఇది హీబ్రూలోని గంభీరమైన ప్రమాణ సూత్రం. తెలుగు భాషలో ప్రమాణ భావాన్ని సహజంగా, గౌరవప్రదంగా తెలియజేయడానికి ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: צְבָאוֹת
  choice: సైన్యాల
  rationale: ఈ పదం సైనిక లేదా పరలోక సమూహాలకు సంబంధించిన విస్తృత భావాన్ని కలిగి ఉండగలదు. దానిని ఒకే రకమైన సైన్యాలకు పరిమితం చేయకుండా సంక్షిప్తంగా అనువదించాం.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: నేను ఎవరి సన్నిధిలో నిలబడుతున్నానో
  rationale: మూలంలోని ‘ఎదుట నిలబడడం’ అనే దృశ్యరూపాన్ని నిలుపుతూ, దేవుని సమక్షంలో సేవకు సిద్ధంగా ఉండే ప్రవక్త భావాన్ని పాఠకుడు గ్రహించగల సహజమైన తెలుగు వాక్యంగా ఇచ్చాం.
- source_word: כִּי הַיּוֹם
  choice: ఈ రోజే
  rationale: కాలపరమైన నొక్కిచెప్పడాన్ని ‘ఈ రోజే’ తెలియజేస్తుంది; ప్రమాణంలోని నిశ్చయాన్ని వాక్యంలోని ‘తప్పకుండా’ మరింత స్పష్టం చేస్తుంది.
- source_word: אֵרָאֶה אֵלָיו
  choice: నేను తప్పకుండా అతనికి కనబడతాను
  rationale: ראה క్రియ నిఫాల్ రూపం ‘కనబడడం,’ ‘ప్రత్యక్షమవడం,’ లేదా సందర్భానుసారంగా ‘తన్ను తాను చూపించుకోవడం’ అనే భావాలు ఇవ్వగలదు. ‘కనబడతాను’ మూలంలోని రూపాన్ని, కొంత భావసందిగ్ధతను కాపాడుతుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: ఇక్కడ మూలపాఠంలో దేవుని వ్యక్తిగత నామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుగా మార్చకుండా, ఆధునికంగా విస్తృతంగా అంగీకరించిన ‘యాహ్వే’ లిప్యంతరీకరణతో ఇచ్చాం.
- issue: ‘ఆయన సన్నిధిలో నిలబడడం’ అనే ప్రవక్త సంబంధమైన భాష
  choice: నేను ఎవరి సన్నిధిలో నిలబడుతున్నానో
  alternative: నేను ఎవరిని సేవిస్తున్నానో
  rationale: ఈ పదబంధంలో సేవ భావం అంతర్లీనంగా ఉండవచ్చు; అయితే దానిని మాత్రమే ప్రధానార్థంగా నిర్ణయించకుండా, మూలంలోని రాజసభ/సన్నిధి దృశ్యరూపాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను కాపాడే శైలిని ఉపయోగించాం. ప్రమాణ సూత్రంలో ‘జీవం తోడు’ అనే సుపరిచితమైన తెలుగు ప్రయోగాన్ని ఉంచాం; ‘సన్నిధిలో నిలబడుతున్నానో’ ద్వారా మూలంలోని ప్రవక్తీయ రాజసభ దృశ్యాన్ని నిలిపాం.
