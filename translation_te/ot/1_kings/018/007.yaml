id: 1KI.18.7
reference: 1 Kings 18:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֤י עֹבַדְיָ֨הוּ֙ בַּ/דֶּ֔רֶךְ וְ/הִנֵּ֥ה אֵלִיָּ֖הוּ לִ/קְרָאת֑/וֹ וַ/יַּכִּרֵ֨/הוּ֙ וַ/יִּפֹּ֣ל עַל פָּנָ֔י/ו וַ/יֹּ֕אמֶר הַ/אַתָּ֥ה זֶ֖ה אֲדֹנִ֥/י אֵלִיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/007.yaml
  text: As Obadiah was on the way, behold, Elijah came to meet him. When he recognized him, he fell on his face and said, “Is that you, my lord Elijah?”
translation:
  language: te
  text: ఓబద్యా దారిలో వెళ్తుండగా, ఇదిగో, ఏలీయా అతనిని కలవడానికి వచ్చాడు. ఓబద్యా అతనిని గుర్తుపట్టి, ముఖం నేలకు ఆనించి పడిపోయి, “నా ప్రభువైన ఏలీయా, మీరేనా?” అని అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: అకస్మాత్తుగా ఏలీయా కనిపించిన దృశ్యాన్ని సూచించే హీబ్రూ పదంలోని సజీవతను నిలుపుతుంది.
- source_word: לִקְרָאתוֹ
  choice: అతనికి ఎదురుగా వచ్చాడు
  rationale: ఏలీయా ఓబద్యాను కలిసే దిశగా రావడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: సాష్టాంగపడి
  rationale: ముఖం నేలకు ఆనేటట్లు పడడం ద్వారా గౌరవం చూపిన క్రియను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הַאַתָּה זֶה
  choice: మీరు నిజంగా మీరేనా?
  rationale: గుర్తించిన తరువాత నిర్ధారణ కోరే హీబ్రూ ప్రశ్నలోని ఆశ్చర్యాన్ని, గౌరవ సంబోధనను తెలుగులో సహజంగా అందిస్తుంది.
- source_word: אֲדֹנִי
  choice: నా ప్రభువైన
  rationale: ఇక్కడ దేవుని నామం కాకుండా ఏలీయాకు గౌరవంగా వాడిన మానవ సంబోధన; అందువల్ల సాధారణ రూపంలో అనువదించబడింది.
theological_decisions:
- issue: אֲדֹנִי అనే గౌరవ సంబోధన
  choice: నా ప్రభువైన ఏలీయా
  alternative: నా యజమానివైన ఏలీయా
  rationale: హీబ్రూలో ఇది ఏలీయాకు చూపిన గౌరవాన్ని సూచిస్తుంది; దైవనామంగా చదవకుండా మూలంలోని గౌరవార్థక భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవవాచక బహువచనం వాడబడింది. కథన శైలి సులభంగా, గంభీరంగా ఉంచబడింది; ‘ఇదిగో’ ద్వారా మూలంలోని దృశ్యాత్మక ఆకస్మికత నిలుపబడింది.
