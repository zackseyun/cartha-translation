translation:
  language: te
  text: 'ఇప్పుడు నువ్వు, ‘వెళ్లి, నీ యజమానికి ఇలా చెప్పు: “ఇదిగో, ఏలీయా ఇక్కడ ఉన్నాడు”’ అంటున్నావు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: సందర్భంలోని సంభాషణ కొనసాగింపును తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; వాక్యారంభ ‘మరి’ అవసరం లేకుండానే భావం స్పష్టంగా ఉంది.
- source_word: לַאדֹנֶיךָ
  choice: నీ యజమానితో
  rationale: אָדוֹן ఇక్కడ ఓబద్యా సేవచేసే మానవ అధిపతిని సూచిస్తుంది; అందువల్ల ‘ప్రభువు’ కంటే ‘యజమాని’ సందర్భోచితం.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: హిన్నే యొక్క దృష్టి ఆకర్షించే, ప్రత్యక్షంగా చూపించే బలాన్ని సహజమైన తెలుగు ప్రయోగంతో నిలుపుతుంది.
- source_word: אֵלִיָּהוּ
  choice: ఏలీయా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన రూపం.
