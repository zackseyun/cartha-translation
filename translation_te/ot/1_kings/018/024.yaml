source:
  edition: WLC
  text: וּ/קְרָאתֶ֞ם בְּ/שֵׁ֣ם אֱלֹֽהֵי/כֶ֗ם וַֽ/אֲנִי֙ אֶקְרָ֣א בְ/שֵׁם יְהוָ֔ה וְ/הָיָ֧ה הָ/אֱלֹהִ֛ים אֲשֶׁר יַעֲנֶ֥ה בָ/אֵ֖שׁ ה֣וּא הָ/אֱלֹהִ֑ים וַ/יַּ֧עַן כָּל הָ/עָ֛ם וַ/יֹּאמְר֖וּ ט֥וֹב הַ/דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/024.yaml
  text: Then call on the name of your god[a], and I will call on the name of Yahweh; and the God who answers by fire, he is God." And all the people answered and said[b], "The word is good.
translation:
  language: te
  text: మీరు మీ దేవుని[a] పేరున మొరపెట్టుకోండి; నేను యాహ్వే పేరున మొరపెట్టుకుంటాను. అగ్నితో జవాబిచ్చే దేవుడే దేవుడు.” అప్పుడు ప్రజలందరూ, “ఈ మాట[b] మంచిది” అని జవాబిచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ దేవుళ్ల పేరున.” אֱלֹהֵיכֶם అనే హీబ్రూ రూపాన్ని ఇక్కడ నిజమైన బహువచనంగా కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ఈ ప్రతిపాదన మంచిది” లేదా “ఈ విషయం మంచిది” అని కూడా అనువదించవచ్చు. హీబ్రూ דָּבָר అనే పదానికి ‘మాట,’ ‘విషయం,’ ‘ప్రతిపాదన’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם בְּשֵׁם
  choice: పేరున మొరపెట్టుకోండి
  rationale: దేవతను పేరుపెట్టి ప్రార్థనాపూర్వకంగా పిలిచే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהֵיכֶם
  choice: మీ దేవుని
  rationale: రూపపరంగా బహువచనానికి అవకాశం ఉన్నా, సందర్భంలో బయలును ఒక దేవతగా ఉద్దేశించడం వల్ల ఏకవచనం ప్రధాన పాఠంలో సరిపోతుంది; బహువచన అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: הָאֱלֹהִים אֲשֶׁר יַעֲנֶה בָאֵשׁ
  choice: అగ్నితో జవాబిచ్చే దేవుడు
  rationale: בָאֵשׁ లోని సాధనార్థక భావాన్ని ‘అగ్నితో’ సహజంగా అందిస్తుంది; పోటీలో ఏ దేవత జవాబిస్తుందో అన్న భావాన్ని నిలుపుతుంది.
- source_word: הוּא הָאֱלֹהִים
  choice: దేవుడే దేవుడు
  rationale: హీబ్రూలోని ఉద్ఘాటనను తెలుగు ‘-ఏ’ ద్వారా నిలిపి, ‘నిజమైన’ వంటి వివరణాత్మక పదాన్ని చేర్చలేదు.
- source_word: טוֹב הַדָּבָר
  choice: ఈ మాట మంచిది
  rationale: דָּבָר యొక్క ‘మాట’ అనే ప్రాథమిక భావాన్ని నిలుపుతూ, ఏలీయా ప్రతిపాదించిన పరీక్షను సందర్భానుసారంగా సూచించడానికి ‘ఈ’ వాడాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామమే ఉన్నందున దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
- issue: אֱלֹהֵיכֶם ఏకవచనమా బహువచనమా
  choice: మీ దేవుని
  alternative: మీ దేవుళ్ల పేరున
  rationale: ఈ పోటీలో బయలు అనే ఒక దేవత ప్రధానంగా ఉద్దేశించబడింది; అయితే హీబ్రూ రూపం బహువచనంగా కూడా అర్థమయ్యే అవకాశాన్ని పాదసూచికలో వెల్లడించాం.
- issue: הוּא הָאֱלֹהִים లోని నిర్ణాయక వాక్యం
  choice: దేవుడే దేవుడు
  alternative: అతడే నిజమైన దేవుడు
  rationale: మూలంలోని ఉద్ఘాటనను నిలుపుతూ, స్పష్టీకరణ కోసం ‘నిజమైన’ అనే మూలంలో లేని పదాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మొరపెట్టుకోండి’ ఆరాధనా సందర్భంలోని పిలుపును తెలియజేస్తుంది; ‘దేవుడే దేవుడు’ మూలంలోని సంక్షిప్తమైన ఉద్ఘాటనను కాపాడుతుంది.
