  yaml_path: translation/ot/1_kings/018/002.yaml
  text: So Elijah went to show himself to Ahab[b][a]. Now the famine was severe in Samaria.
translation:
  language: te
  text: కాబట్టి ఏలీయా అహాబుకు కనిపించడానికి[a] వెళ్లాడు. ఆ సమయంలో షోమ్రోనులో కరవు తీవ్రంగా ఉంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అహాబు ఎదుట ప్రత్యక్షం కావడానికి’ లేదా ‘అహాబుకు తనను తాను కనబరచుకోవడానికి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘షోమ్రోనులో కరవు అతి తీవ్రంగా ఉంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: కాబట్టి ... వెళ్లాడు
  rationale: వావ్-కాన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తూ, మునుపటి ఆజ్ఞకు ఏలీయా స్పందించిన ఫలిత భావాన్ని సూచిస్తుంది; తెలుగులో ‘కాబట్టి’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֵלִיָּהוּ
  choice: ఏలీయా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: לְהֵרָאוֹת אֶל אַחְאָב
  choice: అహాబుకు కనిపించడానికి
  rationale: ראה అనే ధాతువు నిఫాల్ రూపంలో ‘కనిపించడం/తన్ను కనబరచుకోవడం’ అనే భావం ఉంది. తెలుగు సందర్భంలో ‘కనిపించడానికి’ సహజంగా ఉండి మూలంలోని భావాన్ని నిలుపుతుంది.
- source_word: וְהָרָעָב
  choice: ఆ సమయంలో ... కరవు
  rationale: ఇక్కడ వావ్ తరువాతి చర్యను కాక నేపథ్య పరిస్థితిని పరిచయం చేస్తుంది; ‘ఆ సమయంలో’ ఆ సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חָזָק
  choice: తీవ్రంగా ఉంది
  rationale: ‘బలంగా’ అనే ప్రాథమిక భావం కరవుతో కలిసినప్పుడు దాని తీవ్రతను సూచిస్తుంది; ఆధునిక తెలుగులో ‘తీవ్రంగా ఉంది’ సహజమైన ప్రయోగం.
- source_word: בְּשֹׁמְרוֹן
  choice: షోమ్రోనులో
  rationale: בְ స్థానాన్ని సూచిస్తుంది. షోమ్రోను ఇక్కడ నగరాన్నో దాని పరిసర ప్రాంతాన్నో సూచించవచ్చు; మూలంలోని విస్తృతతను అలాగే ఉంచాం.
