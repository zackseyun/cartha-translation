source:
  edition: WLC
  text: וַ/יַּרְא֙ כָּל הָ/עָ֔ם וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶ֑ם וַ/יֹּ֣אמְר֔וּ יְהוָה֙ ה֣וּא הָ/אֱלֹהִ֔ים יְהוָ֖ה ה֥וּא הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/039.yaml
  text: When all the people saw it[a], they fell on their faces and said, “Yahweh, he is God! Yahweh, he is God!”
translation:
  language: te
  text: ప్రజలందరూ అది చూసి, ముఖాలు నేలకు ఆనించి పడిపోయారు. అప్పుడు వారు, “యాహ్వే, ఆయనే దేవుడు[a]! యాహ్వే, ఆయనే దేవుడు!” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: “యాహ్వే, ఆయనే ఆ దేవుడు!” ఇక్కడ “ఆ దేవుడు”లోని నిర్దిష్టత బయలుకు భిన్నంగా యాహ్వేయే నిజమైన దేవుడని ఉద్ఘాటిస్తుంది; తెలుగులో “దేవుడు” సహజంగా ఉంటుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא כָּל־הָעָם
  choice: ప్రజలందరూ అది చూసి
  rationale: וַיַּרְא అంటే ‘చూశారు.’ ముందరి సందర్భంలోని అగ్ని దిగివచ్చిన సంఘటనను సూచించే కర్మ హీబ్రూలో అంతర్లీనంగా ఉంది; సహజమైన తెలుగుకోసం ‘అది’ అని వ్యక్తం చేశాం.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: సాష్టాంగపడి
  rationale: ముఖాలు నేలకు తగిలేలా పడిపోవడాన్ని సూచించే హీబ్రూ నుడికారానికి ఇది సహజమైన, గౌరవభరితమైన తెలుగు సమానం; ఆరాధనాత్మక శరీరభంగిమను తెలియజేస్తుంది.
- source_word: וַיֹּאמְרוּ
  choice: అని అన్నారు
  rationale: మూలంలోని సాధారణ మాటల క్రియ శబ్దస్థాయిని స్వయంగా నిర్దేశించదు; అందువల్ల ‘అన్నారు’ అనే నియంత్రిత అనువాదం ఎంచుకున్నాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: הוּא
  choice: యే
  rationale: హీబ్రూలోని స్పష్టమైన సర్వనామం ఇచ్చే ఉద్ఘాటనను తెలుగులో సహజంగా ‘యే’ అనే నిశ్చయార్థక ప్రత్యయంతో నిలిపాం.
- source_word: הָאֱלֹהִים
  choice: దేవుడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ఈ పదం బయలుకు విరుద్ధంగా యెహోవానే నిజమైన దేవుడని గుర్తిస్తుంది. తెలుగులో విధేయపదంగా ‘దేవుడు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: יְהוָה הוּא הָאֱלֹהִים
  choice: యెహోవాయే దేవుడు!
  rationale: ‘యే’ ద్వారా మూలంలోని సర్వనామ ఉద్ఘాటనను, ఆశ్చర్యార్థక చిహ్నం ద్వారా సందర్భంలోని పరాకాష్ఠ ప్రకటనను నిలిపాం; పునరుక్తిని యథాతథంగా ఉంచాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతోంది. బిరుదైన ‘ప్రభువు’తో దాన్ని భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా గుర్తుపట్టదగిన ‘యెహోవా’ రూపాన్ని వాడాం.
- issue: הָאֱלֹהִים లోని నిర్దిష్టత
  choice: యెహోవాయే దేవుడు
  alternative: యెహోవాయే ఆ దేవుడు
  rationale: ఉపపదం బయలుకు విరుద్ధంగా యెహోవానే నిజమైన దేవుడని గుర్తిస్తుంది. ‘ఆ దేవుడు’ తెలుగులో అసహజంగా లేదా ముందే పేర్కొన్న ఒక దేవతను సూచించినట్లు వినిపించవచ్చు; ‘యే’ ప్రత్యేకతను, ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవభరితమైన వాక్యనిర్మాణం వాడాం. ‘సాష్టాంగపడి’ సాధారణ పాఠకులకు తెలిసిన ఆరాధనాత్మక పదం; మూలంలోని రెండుసార్ల ప్రకటనను నిలిపాం.
