  text: וַ/יִּגַּ֨שׁ אֵלִיָּ֜הוּ אֶל כָּל הָ/עָ֗ם וַ/יֹּ֨אמֶר֙ עַד מָתַ֞י אַתֶּ֣ם פֹּסְחִים֮ עַל שְׁתֵּ֣י הַ/סְּעִפִּים֒ אִם יְהוָ֤ה הָֽ/אֱלֹהִים֙ לְכ֣וּ אַחֲרָ֔י/ו וְ/אִם הַ/בַּ֖עַל לְכ֣וּ אַחֲרָ֑י/ו וְ/לֹֽא עָנ֥וּ הָ/עָ֛ם אֹת֖/וֹ דָּבָֽר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/021.yaml
  text: Then Elijah came near to all the people and said[a], “How long will you keep limping between two opinions? If Yahweh is God, follow him; but if Baal, follow him.” But the people did not answer him a word.
translation:
  language: te
  text: 'అప్పుడు ఏలీయా ప్రజలందరి దగ్గరకు వచ్చి ఇలా అన్నాడు: “మీరు రెండు కొమ్మలపై ఎంతకాలం కుంటుకుంటూ ఉంటారు?[a] యాహ్వే దేవుడైతే ఆయనను అనుసరించండి; బయలు దేవుడైతే అతనిని అనుసరించండి.” అయితే ప్రజలు అతనికి ఒక్క మాట కూడా జవాబివ్వలేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రెండు అభిప్రాయాల మధ్య తడబడుతూ’ అని కూడా అర్థం చేసుకోవచ్చు. హెబ్రీయ పదాలు అక్షరార్థంగా రెండు కొమ్మలు లేదా చీలికలపై కుంటుకుంటూ ఉండడాన్ని సూచిస్తాయి; ఇది విభజిత విధేయతకు రూపకంగా ఉండవచ్చు.
    reason: మూలంలోని నిర్దిష్టం కాని, సజీవమైన రూపకాన్ని ప్రధాన పాఠంలో నిలిపి, సంప్రదాయ భావానువాదాన్ని పాదటిప్పణిలో సూచించడం.
lexical_decisions:
- source_word: וַיִּגַּשׁ אֵלִיָּהוּ אֶל כָּל הָעָם
  choice: ఏలీయా ప్రజలందరి దగ్గరకు వచ్చి
  rationale: נגשׁ సూచించే సమీపించడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, כָּל הָעָם లోని సమగ్రతను ‘ప్రజలందరు’ అని నిలుపుతుంది.
- source_word: עַד מָתַי
  choice: ఎంతకాలం
  rationale: కాలపరమైన ప్రవక్తీయ సవాలును తెలుగులో సహజంగా, నేరుగా తెలియజేస్తుంది.
- source_word: פֹּסְחִים עַל שְׁתֵּי הַסְּעִפִּים
  choice: రెండు కొమ్మల మధ్య ... కుంటుతూ ఉంటారు
  rationale: פֹּסְחִים లోని కుంటడం/కుంటుకుంటూ నడవడం అనే సజీవ రూపకాన్ని, סְעִפִּים లోని కొమ్మలు లేదా చీలికలు అనే concrete చిత్రాన్ని నిలుపుతుంది; విభజిత విధేయత అనే అర్థాన్ని ప్రధాన వాక్యంలోనే పూర్తిగా విప్పి చెప్పదు.
- source_word: אִם יְהוָה הָאֱלֹהִים
  choice: యాహ్వే దేవుడైతే
  rationale: దైవనామమైన יהוה ను ‘యాహ్వే’గా లిప్యంతరీకరిస్తూ, హెబ్రీయ predicate నిర్మాణాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: לְכוּ אַחֲרָיו
  choice: ఆయనను అనుసరించండి / వానిని అనుసరించండి
  rationale: ‘వెనుక వెళ్లండి’ అనే హెబ్రీయ నుడికారంలో ఉన్న విధేయత, అనుసరణ భావాన్ని స్పష్టమైన తెలుగులో తెలియజేస్తుంది. యాహ్వేకు గౌరవసూచక సర్వనామం, బయలుకు సాధారణ సర్వనామం వాడటం తెలుగు శైలికి అనుగుణం.
- source_word: וְלֹא עָנוּ הָעָם אֹתוֹ דָּבָר
  choice: అయితే ప్రజలు అతనికి ఒక్క మాట కూడా జవాబివ్వలేదు
  rationale: ప్రజల సంపూర్ణ మౌనాన్ని తెలిపే హెబ్రీయ నుడికారాన్ని సహజంగా నిలుపుతుంది; సందర్భంలోని వ్యతిరేక మలుపును ‘అయితే’ సూచిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రత్యక్షంగా లిప్యంతరీకరించబడింది.
- issue: פֹּסְחִים עַל שְׁתֵּי הַסְּעִפִּים లోని విభజిత విధేయత రూపకం
  choice: రెండు కొమ్మల మధ్య కుంటుతూ
  alternative: రెండు అభిప్రాయాల మధ్య తడబడుతూ
  rationale: హెబ్రీయంలోని అసాధారణమైన concrete రూపకాన్ని ప్రధాన పాఠంలో నిలిపి, దాని భావవ్యాప్తిని పాదటిప్పణిలో వివరిస్తుంది; అందువల్ల మూలంలోని ఉద్దేశపూర్వక ఉద్రిక్తతను ఒకే వ్యాఖ్యానంగా కుదించదు.
- issue: బయలు వాక్యంలో లుప్తమైన predicate
  choice: బయలు దేవుడైతే
  alternative: బయలు అయితే
  rationale: రెండవ షరతులో హెబ్రీయంలో వదిలివేయబడిన ‘దేవుడు’ అనే predicate మొదటి షరతు నుంచి సహజంగా గ్రహించబడుతుంది; తెలుగులో స్పష్టత కోసం దానిని పునరుక్తి చేశారు, కాని భావాన్ని విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా నేరుగా, గంభీరంగా రూపొందించబడింది. ప్రవక్తీయ సవాలులోని పదును, ప్రజల మౌనంలోని బలాన్ని నిలిపింది.
