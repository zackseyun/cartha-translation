id: 1KI.18.8
reference: 1 Kings 18:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר ל֖/וֹ אָ֑נִי לֵ֛ךְ אֱמֹ֥ר לַ/אדֹנֶ֖י/ךָ הִנֵּ֥ה אֵלִיָּֽהוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/008.yaml
  text: And he said to him[a], “I am he. Go, say to your master, ‘Look, Elijah is here.’”
translation:
  language: te
  text: 'అతడు అతనితో ఇలా అన్నాడు: “నేనే.[a] వెళ్లి నీ యజమానికి, ‘ఇదిగో, ఏలీయా ఇక్కడ ఉన్నాడు’ అని చెప్పు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను అతడనే.” హీబ్రూలో ఉద్ఘాటిత “నేను” అనే సర్వనామం మాత్రమే ఉంది; ఇక్కడ అది తనను తాను గుర్తించుకునే భావంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לֹו
  choice: అతడు అతనితో … అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది; לֹו మాట ఎవరిని ఉద్దేశించిందో సూచిస్తుంది.
- source_word: אָנִי
  choice: నేనే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను, సందర్భంలోని స్వీయ గుర్తింపును సంక్షిప్తంగా కాపాడుతుంది; హీబ్రూలో స్పష్టమైన విధేయ పదం లేదు.
- source_word: לֵךְ אֱמֹר
  choice: నీవు వెళ్లి … చెప్పు
  rationale: రెండు ఆజ్ఞార్థక క్రియలను సహజమైన ఆధునిక తెలుగు క్రమంలో అందిస్తుంది.
- source_word: לַאדֹנֶיךָ
  choice: నీ యజమానితో
  rationale: ఇక్కడ సూచించబడింది ఓబద్యా యొక్క మానవ అధికారి అహాబు; ‘ప్రభువు’ అనే దైవ బిరుదుతో గందరగోళం రాకుండా ‘యజమాని’ సరిపోతుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: తరువాతి ప్రకటనపై దృష్టి నిలిపే హీబ్రూ సూచనార్థక అవ్యయ బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: אֵלִיָּהוּ
  choice: ఏలీయా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: మానవ అధికారి కోసం אָדוֹן పదం అనువాదం
  choice: యజమాని
  alternative: ప్రభువు
  rationale: సందర్భంలో ఇది అహాబును, అంటే ఓబద్యా యొక్క భూలోక అధికారిని సూచిస్తుంది. ‘యజమాని’ సామాజిక సంబంధాన్ని తెలియజేస్తూ దేవునికి వాడే ‘ప్రభువు’ బిరుదుతో అయోమయాన్ని నివారిస్తుంది.
- issue: אָנִי లోని స్వీయ గుర్తింపు
  choice: నేనే
  alternative: నేను అతడనే / అది నేనే
  rationale: హీబ్రూ కేవలం ఉద్ఘాటిత ‘నేను’ అనే సర్వనామాన్నే ఉంచుతుంది. ‘నేనే’ ఆ సంక్షిప్తతను, ఉద్ఘాటనను కాపాడి, అదనపు విధేయాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘నేనే’ ద్వారా మూలంలోని సంక్షిప్త ఉద్ఘాటనను నిలిపి, పాదటిప్పణిలో సహజమైన ప్రత్యామ్నాయాన్ని ఇచ్చాం. ‘ఇదిగో’ మూలంలోని దృష్టి ఆకర్షణను కాపాడుతుంది.
