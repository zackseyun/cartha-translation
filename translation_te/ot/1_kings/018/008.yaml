  to: 'అతడు అతనితో ఇలా అన్నాడు: “నేనే.[a] వెళ్లి నీ యజమానికి, ‘ఇదిగో, ఏలీయా ఇక్కడ ఉన్నాడు’ అని చెప్పు.”'
  rationale: The revision retains the source's compact emphatic self-identification and all narrative content, while replacing “నీ యజమానితో” with the idiomatic recipient form “నీ యజమానికి.” The footnote alternative is adjusted to a natural Telugu expression of the supplied self-identifying predicate while explicitly noting that the Hebrew has only the emphatic pronoun.
