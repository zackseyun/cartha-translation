review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the narrative speech, emphatic self-identification (אָנִי), the paired imperatives, the human superior denoted by אַדֹנֶיךָ, the deictic force of הִנֵּה, and the name Elijah. “నేనే” appropriately preserves the Hebrew's terse, emphatic self-identification without supplying an unwarranted predicate.
  naturalness: 'The main needed improvement is case marking: Telugu normally says “నీ యజమానికి ... చెప్పు,” not “నీ యజమానితో ... చెప్పు,” when conveying a message to someone. Adding “ఇలా అన్నాడు:” gives a fluent modern Telugu narrative introduction to direct speech.'
  terminology: “యజమాని” is appropriate for Obadiah's human master, Ahab, and avoids confusion with a divine title. “ఏలీయా” is an established Telugu biblical form. “ఇదిగో” naturally represents הִנֵּה.
  issues:
  - severity: medium
    issue: “నీ యజమానితో ... అని చెప్పు” uses an unnatural/less precise postposition for the addressee of the reported message.
    rationale: 'For “say/tell to your master,” modern standard Telugu idiom uses the dative: “నీ యజమానికి ... చెప్పు.” “తో” primarily means “with” and can blur the intended directional sense.'
