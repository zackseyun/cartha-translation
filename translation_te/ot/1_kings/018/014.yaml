source:
  edition: WLC
  text: וְ/עַתָּה֙ אַתָּ֣ה אֹמֵ֔ר לֵ֛ךְ אֱמֹ֥ר לַֽ/אדֹנֶ֖י/ךָ הִנֵּ֣ה אֵלִיָּ֑הוּ וַ/הֲרָגָֽ/נִי׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/014.yaml
  text: And now you are saying, ‘Go, tell your lord, “Look, Elijah is here,”’ and he will kill me.’
translation:
  language: te
  text: ఇప్పుడు నువ్వు, ‘వెళ్లి నీ యజమానికి, “ఇదిగో, ఏలీయా ఇక్కడ ఉన్నాడు” అని చెప్పు’ అని అంటున్నావు; అతడు నన్ను చంపుతాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడేమో
  rationale: సందర్భంలోని వ్యతిరేకతను, ఓబద్యా వ్యక్తం చేస్తున్న ఆందోళనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לַאדֹנֶיךָ
  choice: నీ యజమానితో
  rationale: ఇక్కడ אָדוֹן మానవ అధిపతిని, అంటే అహాబును సూచిస్తుంది; దైవనామంగా అనువదించకూడదు.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: ఎలీయా ప్రత్యక్షంగా ఇక్కడ ఉన్నాడనే దృష్టి ఆకర్షణను నిలుపుతుంది.
- source_word: וַהֲרָגָנִי
  choice: అతడు నన్ను చంపేస్తాడు
  rationale: వావ్‌తో అనుసంధానమైన ఫలితాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; సందర్భానుసారం కర్త అహాబు అని స్పష్టమవుతుంది.
theological_decisions:
- issue: וַהֲרָגָנִי లోని కర్త
  choice: అతడు
  alternative: నువ్వు
  rationale: సందర్భం ప్రకారం ఓబద్యాను చంపే వ్యక్తి అతని యజమాని అహాబు; హీబ్రూ క్రియ కూడా మూడవ పురుష ఏకవచన రూపంలో ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంభాషణలోని భయం, నిందార్థక వ్యతిరేకత నిలిచేలా సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది.
