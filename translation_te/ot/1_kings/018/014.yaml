review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the human referent of ‘your lord’ as Ahab and correctly renders the final verb with Ahab as its third-person singular subject. However, ‘నీ యజమానితో’ means ‘with your master,’ whereas Hebrew לַאדֹנֶיךָ requires a dative sense, ‘to your master.’
  naturalness: The dialogue is generally natural modern Telugu. Replacing the comitative postposition with the dative and using a semicolon makes the quoted command and Obadiah’s feared consequence read clearly.
  terminology: ‘యజమాని’ is appropriate here for the human master/lord, and ‘ఏలీయా’ is the standard Telugu form of Elijah. ‘ఇదిగో’ suitably represents הִנֵּה.
  issues:
  - severity: high
    issue: నీ యజమానితో
    rationale: This postposition is comitative (‘with your master’), not the required indirect-object/dative meaning (‘to your master’). It changes the sense of the command.
  - severity: low
    issue: అతడు నన్ను చంపేస్తాడు
    rationale: ‘చంపేస్తాడు’ is understandable but adds a slightly more emphatic colloquial nuance than the plain Hebrew ‘he will kill me.’ ‘చంపుతాడు’ is more neutral while retaining the sense.
  revised_text: ఇప్పుడు నువ్వు, ‘వెళ్లి నీ యజమానికి, “ఇదిగో, ఏలీయా ఇక్కడ ఉన్నాడు” అని చెప్పు’ అని అంటున్నావు; అతడు నన్ను చంపుతాడు.
  revised_footnotes: []
  revision_rationale: The revision corrects the dative relation required by לַאדֹנֶיךָ, preserves the nested quotation and the attention-getting force of הִנֵּה, and retains the contextually clear third-person subject in the final clause. No footnote is necessary because the referent is explicit from the immediate context and no textual ambiguity is introduced.
