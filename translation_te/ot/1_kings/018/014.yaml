revisions:
- from: ఇప్పుడేమో నువ్వు, ‘వెళ్లి నీ యజమానితో, “ఇదిగో, ఏలీయా ఇక్కడ ఉన్నాడు” అని చెప్పు’ అంటున్నావు. అతడు నన్ను చంపేస్తాడు.
  to: ఇప్పుడు నువ్వు, ‘వెళ్లి నీ యజమానికి, “ఇదిగో, ఏలీయా ఇక్కడ ఉన్నాడు” అని చెప్పు’ అని అంటున్నావు; అతడు నన్ను చంపుతాడు.
  rationale: The revision corrects the dative relation required by לַאדֹנֶיךָ, preserves the nested quotation and the attention-getting force of הִנֵּה, and retains the contextually clear third-person subject in the final clause. No footnote is necessary because the referent is explicit from the immediate context and no textual ambiguity is introduced.
  reviewer_model: gpt-5.6-terra
