  to: 'అప్పుడు అతడు ఇలా అన్నాడు: “ఇశ్రాయేలును కష్టపెట్టింది నేను కాదు; ఇశ్రాయేలును కష్టపెట్టింది నువ్వూ నీ తండ్రి ఇంటివారే[a]. ఎందుకంటే మీరు యెహోవా ఆజ్ఞలను విడిచిపెట్టి, బయలుల[b] వెంట వెళ్లారు.”'
