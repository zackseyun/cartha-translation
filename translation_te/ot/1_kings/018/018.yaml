id: 1KI.18.18
reference: 1 Kings 18:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לֹ֤א עָכַ֨רְתִּי֙ אֶת יִשְׂרָאֵ֔ל כִּ֥י אִם אַתָּ֖ה וּ/בֵ֣ית אָבִ֑י/ךָ בַּֽ/עֲזָבְ/כֶם֙ אֶת מִצְוֺ֣ת יְהוָ֔ה וַ/תֵּ֖לֶךְ אַחֲרֵ֥י הַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/018.yaml
  text: And he said[a], “I have not troubled Israel, but you and your father's house have[c][b], because you have forsaken the commandments of Yahweh and have gone after the Baals.”
translation:
  language: te
  text: 'అప్పుడు అతడు ఇలా అన్నాడు: “ఇశ్రాయేలును కష్టపెట్టింది నేను కాదు; ఇశ్రాయేలును కష్టపెట్టింది నువ్వూ నీ తండ్రి ఇంటివారే[a]. ఎందుకంటే మీరు యెహోవా ఆజ్ఞలను విడిచిపెట్టి, బయలుల[b] వెంట వెళ్లారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నువ్వూ నీ తండ్రి ఇల్లూ.” ఇక్కడ ‘ఇల్లు’ అనేది కుటుంబాన్ని లేదా వంశాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: 'హీబ్రూలో ఇది బహువచనం: “బయలులు”; వివిధ ప్రాంతాల్లో ఆరాధించబడిన బయలు రూపాలను లేదా ప్రతిరూపాలను సూచించవచ్చు.'
    reason: cultural_note
lexical_decisions:
- source_word: עָכַרְתִּי
  choice: కష్టానికి గురిచేసింది
  rationale: ఈ సందర్భంలో క్రియ ఒక సమాజంపై కష్టం లేదా విపత్తు తీసుకురావడాన్ని సూచిస్తుంది. ముందటి వచనంలోని ఆరోపణతో ఉన్న సంబంధాన్ని ఈ ప్రయోగం సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כִּי אִם
  choice: కాదు; ... ఏ
  rationale: ఏలీయా ఆరోపణను తిరస్కరించి, దానిని అహాబు మరియు అతని వంశంవైపు మళ్లిస్తున్న వ్యతిరేక భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּבֵית אָבִיךָ
  choice: నీ తండ్రి ఇంటివారు
  rationale: హీబ్రూ నుడికారం కుటుంబం మాత్రమే కాక వంశపరమైన లేదా రాజవంశ బాధ్యతను కూడా సూచించగలదు; ‘తండ్రి ఇంటివారు’ ఆ భావాన్ని నిలుపుతుంది.
- source_word: בַּעֲזָבְכֶם
  choice: ఎందుకంటే మీరు ... విడిచిపెట్టి
  rationale: బేత్ ఉపసర్గతో కూడిన క్రియానామం ఇక్కడ కారణాన్ని తెలియజేస్తుంది; బహువచన సంబోధనను ‘మీరు’ ద్వారా స్పష్టంగా ఉంచాం.
- source_word: מִצְוֺת
  choice: ఆజ్ఞలను
  rationale: దేవుని నిబంధనాపరమైన అధికారంతో కూడిన ఆదేశాల భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన వ్యక్తినామ రూపంలో అందిస్తుంది.
- source_word: וַתֵּלֶךְ אַחֲרֵי
  choice: వెంట వెళ్లారు
  rationale: ఆరాధనాత్మక విధేయతలో ఇతర దేవతలను అనుసరించడాన్ని సూచించే మూలభాషా రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הַבְּעָלִים
  choice: బయలులు
  rationale: హీబ్రూలోని స్పష్టమైన బహువచనాన్ని కాపాడి, బయలు ఆరాధనకు సంబంధించిన వివిధ స్థానిక రూపాలను ఏకవచనంగా చదివేయకుండా ఉంచుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో ఇచ్చాం.
- issue: הַבְּעָלִים యొక్క బహువచనం
  choice: బయలులు
  alternative: బయలు; బయలు విగ్రహాలు
  rationale: మూలంలోని బహువచనాన్ని కాపాడడం ద్వారా వివిధ స్థానిక బయలు ఆరాధనా రూపాలు లేదా ప్రతిరూపాల సూచనను నిలుపుతున్నాం; ‘విగ్రహాలు’ అనే పదాన్ని మూలంలో లేనందున ప్రధాన వాక్యంలో చేర్చలేదు.
- issue: ఆరోపణలోని బహువచన బాధ్యత
  choice: మీరు ... విడిచిపెట్టి ... వెళ్లారు
  alternative: నువ్వు ... విడిచిపెట్టి ... వెళ్లావు
  rationale: בַּעֲזָבְכֶם బహువచన రూపం అహాబు మరియు అతని తండ్రి ఇంటివారిని కలిపి ఉద్దేశిస్తుంది; దాన్ని తెలుగులో బహువచనంతో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కానీ సాధారణ పాఠకులకు సులభమైన వాక్యనిర్మాణం వాడబడింది. రాజుతో ఏలీయా నేరుగా మాట్లాడుతున్న ఘాటును ‘నువ్వు’ ద్వారా నిలిపి, వెంటనే వచ్చే హీబ్రూ బహువచనాన్ని ‘మీరు’ ద్వారా వంశ సమూహంపై విస్తరించాం. మూలంలోని వరుస వావ్‌ను తెలుగులో సహజంగా ‘అప్పుడు’గా అందించాం.
