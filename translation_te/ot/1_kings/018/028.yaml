  text: וַֽ/יִּקְרְאוּ֙ בְּ/ק֣וֹל גָּד֔וֹל וַ/יִּתְגֹּֽדְדוּ֙ כְּ/מִשְׁפָּטָ֔/ם בַּ/חֲרָב֖וֹת וּ/בָֽ/רְמָחִ֑ים עַד שְׁפָךְ דָּ֖ם עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/028.yaml
  text: So they cried out with a loud voice and cut themselves according to their custom with swords and spears until the blood gushed out on them[a][b].
translation:
  language: te
  text: వారు బిగ్గరగా కేకలు వేశారు. తమ ఆచారం ప్రకారం[b] కత్తులతోనూ ఈటెలతోనూ తమను తాము కోసుకున్నారు[a], రక్తం వారి మీద కారేంతవరకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమకు తాము గాట్లు పెట్టుకున్నారు.” హీబ్రూ పదం ఆచారపరంగా శరీరాన్ని కోసుకొని గాయపరచుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “తమ ఆచారం ప్రకారం” అనే మాటను “తమ పద్ధతి ప్రకారం” లేదా “తమ వాడుక చొప్పున” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרְאוּ בְּקוֹל גָּדוֹל
  choice: బిగ్గరగా కేకలు వేస్తూ
  rationale: బయలును ఆర్తిగా పిలుస్తున్న సందర్భంలో קרא సాధారణంగా ‘పిలవడం’ కంటే గట్టిగా మొరపెట్టడం లేదా కేకలు వేయడం అనే భావాన్ని ఇస్తుంది. తెలుగు సహజత్వం కోసం రెండు హీబ్రూ పదబంధాలను కలిపి అనువదించాం.
- source_word: וַיִּתְגֹּדְדוּ
  choice: తమను తాము కోసుకున్నారు
  rationale: ప్రతిబింబార్థక క్రియ ఆచారపరమైన స్వీయ గాయపరచుకోవడాన్ని సూచిస్తుంది. ఈ అనువాదం చర్యను స్పష్టంగా తెలుపుతుంది; ‘గాట్లు పెట్టుకున్నారు’ కూడా సాధ్యమే.
- source_word: כְּמִשְׁפָּטָם
  choice: తమ ఆచారం ప్రకారం
  rationale: ఈ సందర్భంలో מִשְׁפָּט న్యాయతీర్పును కాక, వారు అనుసరించే స్థిరమైన ఆచార పద్ధతిని సూచిస్తుంది.
- source_word: בַּחֲרָבוֹת וּבָרְמָחִים
  choice: కత్తులతోనూ ఈటెలతోనూ
  rationale: בְּ సాధనార్థకంగా ఉంది. חֶרֶבకు ‘కత్తి’, רֹמַחకు ఆధునిక తెలుగులో సహజమైన ‘ఈటె’ ఎంచుకున్నాం.
- source_word: עַד שְׁפָךְ דָּם עֲלֵיהֶם
  choice: రక్తం వారి మీద కారేంతవరకు
  rationale: שׁפךְ యొక్క పోయడం/కారడం చిత్రాన్ని అతిశయింపకుండా నిలుపుతుంది. עֲלֵיהֶםను ‘వారి మీద’గా ప్రత్యక్షంగా ఉంచాం.
