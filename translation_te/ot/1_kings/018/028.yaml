  source_fidelity: The draft accurately represents the loud crying, customary self-laceration with swords and spears, and the extent that blood flowed upon them. However, the participial wording “కేకలు వేస్తూ” can make the two Hebrew wayyiqtol actions sound merely simultaneous rather than presenting the narrative sequence. The added “అలా చేశారు” is not represented in the Hebrew and is unnecessary.
  naturalness: The Telugu is generally clear and modern. Two finite clauses improve narrative flow, and placing “రక్తం వారి మీద కారేంతవరకు” directly with “తమను తాము కోసుకున్నారు” avoids the slightly cumbersome final explanatory clause.
  terminology: “తమ ఆచారం ప్రకారం,” “కత్తులతోనూ ఈటెలతోనూ,” and “తమను తాము కోసుకున్నారు” are accurate, natural modern-standard Telugu renderings. The footnote alternative “గాట్లు పెట్టుకున్నారు” appropriately conveys the ritual self-laceration without forcing a stronger interpretation.
