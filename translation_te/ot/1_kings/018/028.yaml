translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే వచనంలోని ఆచారపరమైన హింసను మృదువుచేయకుండా గౌరవప్రదమైన కథన శైలిని పాటించాం.
