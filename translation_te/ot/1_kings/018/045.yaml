source:
  edition: WLC
  text: וַ/יְהִ֣י עַד כֹּ֣ה וְ/עַד כֹּ֗ה וְ/הַ/שָּׁמַ֨יִם֙ הִֽתְקַדְּרוּ֙ עָבִ֣ים וְ/ר֔וּחַ וַ/יְהִ֖י גֶּ֣שֶׁם גָּד֑וֹל וַ/יִּרְכַּ֥ב אַחְאָ֖ב וַ/יֵּ֥לֶךְ יִזְרְעֶֽאלָ/ה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/045.yaml
  text: And in a little while[a], the sky grew black with clouds and wind, and there was a heavy rain[c][b]. Then Ahab mounted his chariot and went to Jezreel.
translation:
  language: te
  text: కొద్దిసేపటిలోనే[a] ఆకాశం మేఘాలతో, గాలితో నల్లబడింది; భారీ వర్షం కురిసింది. అహాబు రథమెక్కి యెజ్రెయేలుకు వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీ నుడికారం అక్షరార్థంగా, “ఇలా, అలా అయ్యేంతవరకు”; భావం: “ఈలోగా” లేదా “కొద్దిసేపటిలో.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עַד כֹּה וְעַד כֹּה
  choice: కొద్దిసేపటిలోనే
  rationale: ఈ హెబ్రీ కాలసూచక నుడికారం స్వల్ప సమయం గడిచిందని సూచిస్తుంది; తెలుగులో సహజంగా, సంక్షిప్తంగా ఈ భావాన్ని తెలియజేస్తుంది.
- source_word: הַשָּׁמַיִם
  choice: ఆకాశం
  rationale: వాతావరణ సందర్భంలో కనిపించే ఆకాశాన్ని సూచించే సహజ ఆధునిక తెలుగు పదం.
- source_word: הִתְקַדְּרוּ
  choice: నల్లబడింది
  rationale: మేఘాల వల్ల ఆకాశం చీకటిగా, మసకగా మారడాన్ని సజీవంగా తెలియజేస్తుంది.
- source_word: עָבִים וְרוּחַ
  choice: మేఘాలతో, గాలితో
  rationale: ఆకాశం చీకటిపడటానికి తోడైన మేఘాలు, గాలి రెండింటినీ మూలపాఠం క్రమంలో నిలుపుతుంది.
- source_word: וַיְהִי גֶּשֶׁם גָּדוֹל
  choice: భారీ వర్షం కురిసింది
  rationale: అక్షరార్థంగా ‘గొప్ప వర్షం’; వాతావరణ సందర్భంలో తీవ్రంగా కురిసిన వర్షాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּרְכַּב
  choice: రథమెక్కి
  rationale: క్రియకు మూలపాఠంలో కర్మ స్పష్టంగా లేకపోయినా, రాజు ప్రయాణించే కథాసందర్భంలో సూచితమైన రథాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יִזְרְעֶאלָה
  choice: యెజ్రెయేలుకు
  rationale: దిశను సూచించే హెబ్రీ ప్రత్యయాన్ని తెలుగులో గమ్యార్థక విభక్తితో స్పష్టంగా అందిస్తుంది.
