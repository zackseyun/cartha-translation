- from: అహాబు ఏలీయాను చూసినప్పుడు, అతనితో, “ఇశ్రాయేలును కష్టాల్లోకి నెట్టేవాడివి నువ్వేనా?[a]” అని అడిగాడు.
  to: అహాబు ఏలీయాను చూసినప్పుడు, అతనితో ఇలా అన్నాడు, “ఇశ్రాయేలుకు కష్టం కలిగించేవాడివి నువ్వేనా[a]?”
