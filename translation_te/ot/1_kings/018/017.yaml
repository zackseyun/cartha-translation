  yaml_path: translation/ot/1_kings/018/017.yaml
  text: And when Ahab saw Elijah[a], Ahab said to him, “Is that you, troubler of Israel?”
translation:
  language: te
  text: అహాబు ఏలీయాను చూసినప్పుడు, అతనితో ఇలా అన్నాడు, “ఇశ్రాయేలుకు కష్టం కలిగించేవాడివి నువ్వేనా[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలును కలవరపెట్టేవాడివి నువ్వేనా?” లేదా, “ఇశ్రాయేలుపై విపత్తు తెచ్చేవాడివి నువ్వేనా?”
    reason: עֹכֵר అనే పదం కష్టం, కలత లేదా విపత్తు కలిగించే వానిని సూచించవచ్చు.
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: చూసినప్పుడు
  rationale: వావ్-క్రమ కథన అనుసంధానంతో కూడిన כ + క్రియానామ రూపం ఇక్కడ కాలసంబంధ పరిస్థితిని తెలియజేస్తుంది. ఆధునిక తెలుగులో ‘చూసినప్పుడు’ సహజంగా ఆ భావాన్ని అందిస్తుంది; ప్రత్యేకంగా ‘అప్పుడు జరిగింది’ అనడం అవసరం లేదు.
- source_word: אַחְאָב
  choice: అహాబు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన రూపం.
- source_word: אֵלִיָּהוּ
  choice: ఏలీయా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో విస్తృతంగా వాడుకలో ఉన్న రూపం.
- source_word: וַיֹּאמֶר ... אֵלָיו
  choice: అతనితో ... అని అడిగాడు
  rationale: אָמַר సాధారణంగా ‘అన్నాడు’; అయితే ప్రత్యక్ష ప్రశ్నను పరిచయం చేస్తున్న ఈ సందర్భంలో ‘అని అడిగాడు’ సహజమైన తెలుగు. אֵלָיו యొక్క సంబంధం ‘అతనితో’ ద్వారా వ్యక్తమైంది.
- source_word: הַאַתָּה זֶה
  choice: నువ్వేనా?
  rationale: ప్రశ్నార్థక ה, స్వతంత్ర సర్వనామం, సూచకపదం కలసి చూపే సూటి, ఎదుర్కొనే ఉద్ఘాటనను తెలుగు ‘నువ్వేనా?’ సహజంగా మోస్తుంది.
- source_word: עֹכֵר יִשְׂרָאֵל
  choice: ఇశ్రాయేలును కష్టాల్లోకి నెట్టేవాడివి
  rationale: עכר అనే కృదంతం కష్టం, కలత లేదా విపత్తు కలిగించే వ్యక్తిని సూచిస్తుంది. తెలుగులో అరుదైన నామరూపం కంటే ఈ క్రియాత్మక వ్యక్తీకరణ అహాబు ఆరోపణను స్పష్టంగా, సహజంగా అందిస్తుంది; ‘విపత్తు’ అనే మరింత తీవ్రమైన అర్థసంభావ్యతను పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: అహాబు చేసిన ఆరోపణ యొక్క స్వరం, దాని కథన స్థితి
  choice: ఏలీయా ఇశ్రాయేలును కష్టాల్లోకి నెట్టాడనే అహాబు సూటి ఆరోపణగా అనువదించడం
  alternative: ‘ఇశ్రాయేలును నాశనం చేసేవాడివి’ లేదా ‘ఇశ్రాయేలుపై విపత్తు తెచ్చేవాడివి’
  rationale: వాక్యం అహాబు దృష్టిలోని నిందను నివేదిస్తుంది; దానిని కథకుడి సమర్థనగా చూపదు. עכר యొక్క అర్థపరిధిని మించకుండా ఆరోపణను నిలుపుతూ, దాని సత్యాసత్యాలను తదుపరి సందర్భం వెల్లడించేందుకు వదిలింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి, కానీ అహాబు యొక్క ప్రత్యక్ష, నిందారోపణ స్వరాన్ని ‘నువ్వేనా?’ ద్వారా నిలిపింది. వాక్యారంభంలోని హీబ్రూ కథన అనుసంధానాన్ని తెలుగులో కృత్రిమమైన ‘మరియు జరిగింది’ రూపంతో కాక, సహజ కాలవాక్యంతో వ్యక్తం చేసింది.
