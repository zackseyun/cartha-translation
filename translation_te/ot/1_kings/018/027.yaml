id: 1KI.18.27
reference: 1 Kings 18:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֨י בַֽ/צָּהֳרַ֜יִם וַ/יְהַתֵּ֧ל בָּ/הֶ֣ם אֵלִיָּ֗הוּ וַ/יֹּ֨אמֶר֙ קִרְא֤וּ בְ/קוֹל גָּדוֹל֙ כִּֽי אֱלֹהִ֣ים ה֔וּא כִּ֣י שִׂ֧יחַ וְ/כִֽי שִׂ֛יג ל֖/וֹ וְ/כִֽי דֶ֣רֶךְ ל֑/וֹ אוּלַ֛י יָשֵׁ֥ן ה֖וּא וְ/יִקָֽץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/027.yaml
  text: And it happened at noon that Elijah mocked them and said[a], “Cry out with a loud voice, for he is a god. For he is musing, or he has gone aside, or he is on a journey. Perhaps he is sleeping and will awake.”
translation:
  language: te
  text: 'మధ్యాహ్నం వేళ ఏలీయా వారిని ఎగతాళి చేస్తూ ఇలా అన్నాడు: “గట్టిగా కేకలు వేయండి! అతడు ఒక దేవుడు కదా! బహుశా అతడు ఆలోచనలో మునిగిపోయాడేమో, లేదా పక్కకు వెళ్లాడేమో[a], లేదా ప్రయాణంలో ఉన్నాడేమో. ఒకవేళ అతడు నిద్రపోతున్నాడేమో; మేల్కొంటాడేమో.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విసర్జనకు వెళ్లాడేమో.” హీబ్రూ ప్రయోగం బహుశా ఒక సభ్యోక్తి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַצָּהֳרַיִם
  choice: మధ్యాహ్నం వేళ
  rationale: హీబ్రూ కథన సంధిని తెలుగులో సహజంగా ఉంచుతూ, కాలసూచనను స్పష్టంగా ముందుకు తెస్తుంది; కృత్రిమమైన ‘అప్పుడు ఇలా జరిగింది’ అవసరం లేదు.
- source_word: וַיְהַתֵּל בָּהֶם
  choice: వారిని ఎగతాళి చేస్తూ
  rationale: ఈ క్రియలోని అవహేళనతో కూడిన అపహాస్య భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: קִרְאוּ בְקוֹל גָּדוֹל
  choice: గట్టిగా కేకలు వేయండి
  rationale: ఆజ్ఞార్థక బలాన్నీ, పెద్ద స్వరంతో పిలవాలనే భావాన్నీ సహజమైన తెలుగులో అందిస్తుంది.
- source_word: כִּי אֱלֹהִים הוּא
  choice: అతడు ఒక దేవుడు కదా
  rationale: బయలును ఉద్దేశించిన వ్యంగ్యోక్తి ఇది; ‘ఒక దేవుడు’ అనడం ఇశ్రాయేలు దేవునితో అతణ్ని సమీకరించదు. ‘కదా’ వ్యంగ్య స్వరాన్ని తెలుగులో వినిపిస్తుంది.
- source_word: שִׂיחַ
  choice: ఆలోచనలో మునిగిపోయాడేమో
  rationale: లోలోపల ఆలోచించడం లేదా ధ్యాసలో ఉండడం అనే సంభావ్య అర్థాన్ని అతిగా నిర్దిష్టం చేయకుండా తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: שִׂיג לוֹ
  choice: పక్కకు వెళ్లాడేమో
  rationale: అరుదైన, బహుశా శరీర విసర్జనను సూచించే సభ్యోక్తిని ప్రధాన పాఠ్యంలో సభ్యోక్తిగానే నిలుపుతుంది; సంభావ్య స్పష్టార్థాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: דֶרֶךְ לוֹ
  choice: ప్రయాణంలో ఉన్నాడేమో
  rationale: అతడు దారిలో లేదా ప్రయాణంలో ఉన్నాడనే హీబ్రూ నామవాచక ప్రయోగానికి సహజమైన తెలుగు సమానం.
- source_word: אוּלַי יָשֵׁן הוּא וְיִקָץ
  choice: ఒకవేళ అతడు నిద్రపోతున్నాడేమో; అప్పుడు మేల్కొంటాడు
  rationale: నిద్రలో ఉండవచ్చనే వ్యంగ్య సంభావనను, తరువాత అతడు మేల్కొంటాడనే అకర్మక క్రియను అనవసరంగా ‘లేపాలి’ అని మార్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: బయలును సూచించే אֱלֹהִים పదం
  choice: ఒక దేవుడు
  alternative: దేవుడు
  rationale: ఇది బయలు ప్రవక్తలను ఎగతాళి చేస్తూ చెప్పిన మాట; ఇశ్రాయేలు దేవుని గురించి చేసిన ఒప్పుకోలు కాదు. అనిర్దిష్ట రూపం వ్యంగ్యాన్ని, సందర్భభేదాన్ని రెండింటినీ కాపాడుతుంది.
- issue: שִׂיג לוֹ అనే సభ్యోక్తి
  choice: పక్కకు వెళ్లాడు
  alternative: మలవిసర్జనకు వెళ్లాడు
  rationale: మూలంలోని పరోక్షతను ప్రధాన పాఠ్యంలో కాపాడి, దాని సంభావ్య శరీర విసర్జనార్థాన్ని పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే కథన గాంభీర్యం మరియు ఏలీయా వ్యంగ్య స్వరం నిలిచేలా రూపొందించబడింది. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
