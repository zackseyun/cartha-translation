  to: 'మధ్యాహ్నం వేళ ఏలీయా వారిని ఎగతాళి చేస్తూ ఇలా అన్నాడు: “గట్టిగా కేకలు వేయండి! అతడు ఒక దేవుడు కదా! బహుశా అతడు ఆలోచనలో మునిగిపోయాడేమో, లేదా పక్కకు వెళ్లాడేమో[a], లేదా ప్రయాణంలో ఉన్నాడేమో. ఒకవేళ అతడు నిద్రపోతున్నాడేమో; మేల్కొంటాడేమో.”'
