source:
  edition: WLC
  text: וַ/תִּפֹּ֣ל אֵשׁ יְהוָ֗ה וַ/תֹּ֤אכַל אֶת הָֽ/עֹלָה֙ וְ/אֶת הָ֣/עֵצִ֔ים וְ/אֶת הָ/אֲבָנִ֖ים וְ/אֶת הֶ/עָפָ֑ר וְ/אֶת הַ/מַּ֥יִם אֲשֶׁר בַּ/תְּעָלָ֖ה לִחֵֽכָה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/038.yaml
  text: Then the fire of Yahweh fell and consumed the burnt offering[a], the wood, the stones, the dust, and licked up the water that was in the trench.
translation:
  language: te
  text: అప్పుడు యాహ్వే అగ్ని పడింది; అది దహనబలిని, కట్టెలను, రాళ్లను, ధూళిని దహించివేసి, కందకంలో ఉన్న నీటిని నాకివేసింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే నుండి అగ్ని.” హీబ్రూ పదబంధాన్ని అగ్ని యొక్క దైవిక మూలాన్ని నొక్కిచెప్పేదిగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשׁ יְהוָה
  choice: యాహ్వే అగ్ని
  rationale: హీబ్రూ పదబంధం అగ్ని యాహ్వేతో నేరుగా సంబంధమున్నదని తెలియజేస్తుంది. ‘యాహ్వే అగ్ని’ ఆ దైవిక సంబంధాన్ని, నాటకీయతను నిలుపుతుంది.
- source_word: וַתִּפֹּל
  choice: దిగిపడి
  rationale: נפל యొక్క ‘పడింది’ అనే మూలచిత్రాన్ని నిలుపుతూ, పై నుండి వచ్చిన అగ్ని అనే సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַתֹּאכַל
  choice: దహించివేసి
  rationale: మూల క్రియ అక్షరార్థంగా ‘తినింది’ అయినా, అగ్ని విషయంలో ‘దహించివేసింది’ సహజమైన తెలుగు ప్రయోగం; పూర్తిగా నాశనం చేసిన భావాన్ని ఇస్తుంది.
- source_word: הָעֹלָה
  choice: దహనబలి
  rationale: బలిగా పూర్తిగా కాల్చి అర్పించే ఆచారపరమైన అర్పణను సూచించే స్పష్టమైన పదం.
- source_word: הָעֵצִים
  choice: కట్టెలు
  rationale: బలిపీఠంపై అమర్చిన కాల్చే కలపను సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָאֲבָנִים
  choice: రాళ్లు
  rationale: మూలపదానికి నేరమైన అనువాదం; అగ్ని తీవ్రతను అలాగే నిలుపుతుంది.
- source_word: הֶעָפָר
  choice: ధూళి
  rationale: עפר సూచించే పొడి మట్టి లేదా దుమ్ము భావాన్ని సజీవంగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: לִחֵכָה
  choice: నాకివేసింది
  rationale: ‘నాకు’ అనే మూలచిత్రాన్ని నిలుపుతూ, అగ్ని నీటిని పూర్తిగా తొలగించిన దృశ్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַמַּיִם אֲשֶׁר בַּתְּעָלָה
  choice: కందకంలో ఉన్న నీరు
  rationale: బలిపీఠం చుట్టూ తవ్విన గోతిని ‘కందకం’ స్పష్టంగా సూచిస్తుంది.
- source_word: וַ
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి సంఘటనను ఆధునిక తెలుగులో సహజంగా ముందుకు నడిపిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా, ‘Yahweh’కు సమీపమైన తెలుగు లిప్యంతరీకరణతో వ్యక్తం చేస్తుంది.
- issue: אֵשׁ יְהוָה లో సంబంధ భావం
  choice: యాహ్వే అగ్ని
  alternative: యాహ్వే నుండి వచ్చిన అగ్ని
  rationale: అగ్ని యొక్క దైవిక మూలం సందర్భంలో సాధ్యమైనప్పటికీ, హీబ్రూ పదబంధం సంబంధాన్ని సంక్షిప్తంగా ఉంచుతుంది; ప్రధాన పాఠం దానిని విస్తరించి నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘దిగిపడి’ మరియు ‘నాకివేసింది’ మూలంలోని సజీవ దృశ్యాలను నిలుపుతాయి.
