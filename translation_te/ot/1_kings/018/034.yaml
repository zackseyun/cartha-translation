id: 1KI.18.34
reference: 1 Kings 18:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר מִלְא֨וּ אַרְבָּעָ֤ה כַדִּים֙ מַ֔יִם וְ/יִֽצְק֥וּ עַל הָ/עֹלָ֖ה וְ/עַל הָ/עֵצִ֑ים וַ/יֹּ֤אמֶר שְׁנוּ֙ וַ/יִּשְׁנ֔וּ וַ/יֹּ֥אמֶר שַׁלֵּ֖שׁוּ וַ/יְשַׁלֵּֽשׁוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/034.yaml
  text: Then he said[a], “Fill four jars with water and pour it on the burnt offering and on the wood.” Then he said, “Do it a second time,” and they did it a second time. Then he said, “Do it a third time,” and they did it a third time.
translation:
  language: te
  text: అప్పుడు అతడు, “నీళ్లతో నాలుగు కుండలు[a] నింపి, దహనబలి మీదా కట్టెల మీదా పోయండి” అన్నాడు. తరువాత, “రెండోసారి కూడా అలాగే చేయండి” అన్నాడు; వారు రెండోసారి అలాగే చేశారు. మళ్లీ, “మూడోసారి కూడా అలాగే చేయండి” అన్నాడు; వారు మూడోసారి అలాగే చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాలుగు నీటి పాత్రలు”; హెబ్రీ పదం ద్రవాలను మోసే పాత్రను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు అతడు ... అన్నాడు
  rationale: వావ్-కాన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ క్రమానుసార భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִלְאוּ אַרְבָּעָה כַדִּים מַיִם
  choice: నాలుగు కుండల నిండా నీళ్లు నింపి
  rationale: כַּדִּים ద్రవాలను మోసే కుండలు లేదా బానల వంటి పాత్రలను సూచిస్తుంది. ‘కుండలు’ సాధారణ పాఠకులకు సహజమైన పదం; ‘నాలుగు కుండల నిండా’ నీటి పరిమాణాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְיִצְקוּ
  choice: పోయండి
  rationale: ముందున్న బహువచన ఆజ్ఞను కొనసాగించే ఆజ్ఞారూపంగా తీసుకుని, తెలుగులో సహజమైన బహువచన గౌరవ/సామూహిక ఆజ్ఞగా అనువదించబడింది.
- source_word: עַל הָעֹלָה
  choice: దహనబలి మీద
  rationale: עֹלָה ఇశ్రాయేలీయుల బలివిధానంలోని పూర్తిగా దహనం చేసే బలిని సూచించే స్థిరమైన పదం; ‘దహనబలి’ సంక్షిప్తంగా, స్పష్టంగా ఉంటుంది.
- source_word: וְעַל הָעֵצִים
  choice: కట్టెల మీదా
  rationale: సందర్భంలో עֵצִים బలిపీఠంపై అమర్చిన కట్టెలను సూచిస్తుంది; ‘కట్టెలు’ ఆధునిక తెలుగులో సహజమైన నిర్దిష్ట పదం.
- source_word: שְׁנוּ / וַיִּשְׁנוּ
  choice: రెండోసారి కూడా అలాగే చేయండి / వారు రెండోసారి అలాగే చేశారు
  rationale: שנה ఇక్కడ చర్యను పునరావృతం చేయడాన్ని సూచిస్తుంది. లెక్కించిన పునరావృతిని నిలుపుతూ, ముందటి చర్య మొత్తాన్ని ‘అలాగే’ ద్వారా సహజంగా సూచించాం.
- source_word: שַׁלֵּשׁוּ / וַיְשַׁלֵּשׁוּ
  choice: మూడోసారి కూడా అలాగే చేయండి / వారు మూడోసారి అలాగే చేశారు
  rationale: మూడవసారి చర్య చేయాలని ఇచ్చిన ఆజ్ఞను, దాని అమలును హెబ్రీ క్రమానికి అనుగుణంగా స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: עֹלָה అనే బలిపదం అనువాదం
  choice: దహనబలి
  alternative: సర్వాంగ దహనబలి
  rationale: మూలపదం పూర్తిగా అగ్నికి అర్పించే బలిని సూచించినా, ఈ వచనంలో లేని వివరణాత్మక భావాన్ని అదనంగా చేర్చకుండా స్థిరమైన, అర్థవంతమైన ‘దహనబలి’ని వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన కథనశైలి వాడబడింది. పునరావృత ఆజ్ఞల లెక్కింపు, కథన క్రమం, బలిపదం అన్నీ మూలానికి దగ్గరగా నిలుపబడ్డాయి.
