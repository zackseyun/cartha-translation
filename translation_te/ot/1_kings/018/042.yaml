  yaml_path: translation/ot/1_kings/018/042.yaml
  text: So Ahab went up to eat and to drink[a], but Elijah went up to the top of Carmel[c][b], and he bent down to the ground and put his face between his knees.
translation:
  language: te
  text: అహాబు తినడానికి, తాగడానికి పైకి వెళ్లాడు; అయితే ఏలీయా కర్మెలు శిఖరానికి వెళ్లాడు[a]. అతడు నేలవైపు వంగి తన ముఖాన్ని తన మోకాళ్ల మధ్య పెట్టుకున్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కర్మెలు పైభాగానికి,’ ‘కర్మెలు శిఖరానికి,’ లేదా ‘కర్మెలు పర్వత శిఖరానికి’ అని కూడా అనువదించవచ్చు. ఇక్కడ హీబ్రూ పాఠ్యంలో ‘పర్వతం’ అనే పదం లేదు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ హీబ్రూ పాఠ్యం ఏలీయా శరీర భంగిమను మాత్రమే వర్ణిస్తుంది. విస్తృత సందర్భం ప్రార్థనను సూచించినప్పటికీ, ఈ వచనం దానిని స్పష్టంగా చెప్పదు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲלֶה
  choice: పైకి వెళ్లాడు
  rationale: עלה అనే సాధారణ దిశాసూచక క్రియకు సహజమైన తెలుగు రూపం; సందర్భంలోని ఎత్తైన ప్రదేశానికి వెళ్లడాన్ని నిలుపుతుంది.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: తిని తాగడానికి
  rationale: రెండు క్రియారూపాలు ఉద్దేశాన్ని సూచిస్తున్నాయి; ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: וְאֵלִיָּהוּ
  choice: అయితే ఏలీయా
  rationale: హీబ్రూ సంధి అక్షరార్థంగా ‘మరియు’; ఇక్కడ అహాబు, ఏలీయా చేసిన భిన్న క్రియల మధ్య సందర్భసిద్ధమైన వ్యత్యాసాన్ని ‘అయితే’ వ్యక్తం చేస్తుంది.
- source_word: עָלָה אֶל רֹאשׁ הַכַּרְמֶל
  choice: కర్మెలు శిఖరానికి ఎక్కి
  rationale: רֹאשׁ అక్షరార్థంగా ‘తల,’ ఇక్కడ ఎత్తైన ప్రదేశపు శిఖరం. ‘పర్వతం’ మూలంలో స్పష్టంగా లేకపోవడంతో ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: וַיִּגְהַר אַרְצָה
  choice: నేలవైపు వంగి
  rationale: అరుదైన גהר క్రియ తెలిపే కిందికి వంగిన శరీర భంగిమను, ఆరాధన లేదా ప్రార్థనగా ముందుగానే వ్యాఖ్యానించకుండా తెలియజేస్తుంది.
- source_word: וַיָּשֶׂם פָּנָיו בֵּין בִּרְכָּיו
  choice: తన ముఖాన్ని మోకాళ్ల మధ్య పెట్టుకున్నాడు
  rationale: ఏలీయా శరీర భంగిమను మూలంలోని మూర్తమైన వర్ణనకు దగ్గరగా, సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ఏలీయా భంగిమను ప్రధాన పాఠ్యంలో ప్రార్థనగా స్పష్టంగా వ్యాఖ్యానించాలా?
  choice: శరీర భంగిమను మాత్రమే వర్ణించడం
  alternative: ‘ప్రార్థనలో వంగాడు’ లేదా ‘మోకాళ్ల మధ్య ముఖం పెట్టుకొని ప్రార్థించాడు’
  rationale: విస్తృత సందర్భం ప్రార్థనను సూచించవచ్చు; అయితే ఈ వచనం స్వయంగా శరీర భంగిమనే చెబుతుంది. అందువల్ల మూలం చెప్పనిదాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా గౌరవప్రదమైన కథన శైలి. వ్యత్యాసాన్ని సహజంగా చూపేందుకు ‘అయితే’ వాడబడింది; మూలంలోని భంగిమకు ప్రార్థన అనే వ్యాఖ్యానాన్ని జోడించలేదు.
