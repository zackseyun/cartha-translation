source:
  edition: WLC
  text: וְ/הָיָ֞ה אֲנִ֣י אֵלֵ֣ךְ מֵ/אִתָּ֗/ךְ וְ/ר֨וּחַ יְהוָ֤ה יִֽשָּׂאֲ/ךָ֙ עַ֚ל אֲשֶׁ֣ר לֹֽא אֵדָ֔ע וּ/בָ֨אתִי לְ/הַגִּ֧יד לְ/אַחְאָ֛ב וְ/לֹ֥א יִֽמְצָאֲ/ךָ֖ וַ/הֲרָגָ֑/נִי וְ/עַבְדְּ/ךָ֛ יָרֵ֥א אֶת יְהוָ֖ה מִ/נְּעֻרָֽ/י׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/012.yaml
  text: And when I go away from you[a], the Spirit of Yahweh may carry you where I do not know. Then when I come and tell Ahab and he does not find you, he will kill me—though your servant has feared Yahweh from my youth.
translation:
  language: te
  text: నేను మిమ్మల్ని విడిచి వెళ్లగానే, యెహోవా ఆత్మ[a] నాకు తెలియని చోటికి మిమ్మల్ని తీసుకుపోవచ్చు. నేను వెళ్లి అహాబుకు చెప్పినప్పుడు అతడు మిమ్మల్ని కనుగొనకపోతే, నన్ను చంపుతాడు. మీ సేవకుడైన నేను నా బాల్యం నుంచే యెహోవాకు భయపడుతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెహోవా గాలి’; హీబ్రూ רוּחַ అనే పదానికి ‘ఆత్మ,’ ‘గాలి,’ లేదా ‘శ్వాస’ అనే అర్థాలు ఉండవచ్చు. ఈ సందర్భంలో ‘ఆత్మ’ ప్రధానంగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אֲנִי אֵלֵךְ מֵאִתָּךְ
  choice: నేను మిమ్మల్ని విడిచి వెళ్లగానే
  rationale: భవిష్యత్తులో సంభవించవచ్చని ఓబద్యా భయపడుతున్న సంఘటనల క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: רוּחַ יְהוָה
  choice: యెహోవా ఆత్మ
  rationale: ప్రవక్తను దైవిక శక్తితో మరొక చోటికి తీసుకుపోవడమే సందర్భానికి ప్రధానంగా సరిపోతుంది; רוּחַ లోని ‘గాలి’ అనే సాధ్యార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: יִשָּׂאֲךָ
  choice: మిమ్మల్ని తీసుకుపోవచ్చు
  rationale: נשא యొక్క మోయడం/తీసుకుపోవడం భావాన్ని తెలుపుతూ, ఓబద్యా వ్యక్తం చేస్తున్న అనిశ్చిత భయాన్ని ‘వచ్చు’తో సహజంగా ప్రతిబింబిస్తుంది.
- source_word: עַל אֲשֶׁר לֹא אֵדָע
  choice: నాకు తెలియని చోటికి
  rationale: తెలియని గమ్యస్థానాన్ని సూచించే హీబ్రూ వాక్యభావానికి స్పష్టమైన ఆధునిక తెలుగు రూపం.
- source_word: וּבָאתִי לְהַגִּיד לְאַחְאָב
  choice: నేను వెళ్లి అహాబుకు చెప్పినప్పుడు
  rationale: ఓబద్యా ఏలీయా దగ్గరనుంచి అహాబు వద్దకు వెళ్లి సమాచారం అందించే వరుస చర్యను సందర్భానుసారంగా వ్యక్తం చేస్తుంది.
- source_word: וַהֲרָגָנִי
  choice: నన్ను చంపేస్తాడు
  rationale: ఓబద్యా భయపడుతున్న ప్రత్యక్ష పరిణామాన్ని సాధారణ, బలమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְעַבְדְּךָ
  choice: మీ సేవకుడినైన నేను
  rationale: ఇది బానిసత్వాన్ని నొక్కిచెప్పడం కంటే ఏలీయాతో మాట్లాడే వినయపూర్వక స్వీయసూచన.
- source_word: יָרֵא אֶת יְהוָה מִנְּעֻרָי
  choice: నా బాల్యం నుంచే యెహోవాకు భయపడుతూ ఉన్నాను
  rationale: దేవునిపట్ల భక్తిపూర్వక భయం బాల్యం నుంచి ఇప్పటివరకు కొనసాగుతోందనే భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో అందిస్తుంది.
theological_decisions:
- issue: רוּחַ יְהוָה యొక్క అర్థం
  choice: యెహోవా ఆత్మ
  alternative: యెహోవా గాలి
  rationale: దైవిక కార్యశక్తి ఏలీయాను తరలించవచ్చనే ప్రవక్తా సందర్భంలో ‘ఆత్మ’ ప్రధానార్థంగా సరిపోతుంది; అయితే మూలపదంలోని నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో కాపాడాం.
- issue: יְהוָה దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా ప్రతిబింబిస్తుంది.
- issue: יָרֵא అనే భక్తిపూర్వక భయం
  choice: యెహోవాకు భయపడుతూ ఉన్నాను
  alternative: యెహోవాను గౌరవిస్తూ ఉన్నాను
  rationale: ‘భయం’ మరియు ‘భక్తి/గౌరవం’ మధ్య ఉన్న బైబిలీయ ఉద్వేగాన్ని కేవలం గౌరవంగా సడలించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన సంబోధనను ఉపయోగించాం. వాక్యం సాధారణ పాఠకులకు సహజంగా ఉండేలా చేసి, దైవనామం మరియు భక్తిపూర్వక ‘భయం’ వంటి మూలపాఠ అంశాలను యథాతథంగా నిలిపాం.
