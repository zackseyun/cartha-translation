source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אַחְאָב֙ אֶל עֹ֣בַדְיָ֔הוּ לֵ֤ךְ בָּ/אָ֨רֶץ֙ אֶל כָּל מַעְיְנֵ֣י הַ/מַּ֔יִם וְ/אֶ֖ל כָּל הַ/נְּחָלִ֑ים אוּלַ֣י נִמְצָ֣א חָצִ֗יר וּ/נְחַיֶּה֙ ס֣וּס וָ/פֶ֔רֶד וְ/ל֥וֹא נַכְרִ֖ית מֵ/הַ/בְּהֵמָֽה־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/005.yaml
  text: And Ahab said to Obadiah[a], “Go through the land to all the springs of water and to all the wadis. Perhaps we may find grass and keep horse and mule alive[b], so that we do not have to cut off some of the livestock.”
translation:
  language: te
  text: 'అహాబు ఓబద్యాతో, “దేశమంతా తిరిగి, నీటి ఊటలన్నిటి దగ్గరికీ, వాగులన్నిటి దగ్గరికీ[a] వెళ్లు. బహుశా గడ్డి దొరికి, గుర్రాలనూ కంచర గాడిదలనూ బతికించుకోగలమేమో; అప్పుడు పశుసంపదలో కొన్నిటిని తొలగించాల్సిన అవసరం రాకపోవచ్చు[b]” అన్నాడు.


    [a] ఇక్కడి హీబ్రూ పదం కాలానుగుణంగా నీరు ప్రవహించే వాగును, వాగు పాయను, లేదా నీటి ప్రవాహాన్ని సూచించవచ్చు.


    [b] అక్షరార్థంగా, “పశుసంపదలో నుండి తెగగొట్టకుండా.” మేత సరిపోకపోవడం వల్ల పశుసంపదలో కొంతను తొలగించాల్సి రావడాన్ని ఈ మాట సూచిస్తుండవచ్చు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ పదం కాలానుగుణంగా నీరు ప్రవహించే వాగును, వాగు పాయను, లేదా నీటి ప్రవాహాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “పశుసంపదలో నుండి తెగగొట్టకుండా.” మేత సరిపోకపోవడం వల్ల పశుసంపదలో కొంతను తొలగించాల్సి రావడాన్ని ఈ మాట సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאָרֶץ
  choice: దేశమంతా తిరిగి
  rationale: వెళ్లడం అనే క్రియతో కలిసిన ב ఇక్కడ ఒక ప్రాంతమంతటా సంచరించి వెదకడాన్ని సూచిస్తుంది; కేవలం ‘దేశంలో’ అనడం కంటే సందర్భాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מַעְיְנֵי הַמַּיִם
  choice: నీటి ఊటలన్నిటి దగ్గరికీ
  rationale: సహజంగా ఉబికి వచ్చే నీటి వనరులనే హీబ్రూ పదబంధం స్పష్టంగా సూచిస్తుంది.
- source_word: הַנְּחָלִים
  choice: వాగులన్నిటి దగ్గరికీ
  rationale: נחל శాశ్వత ప్రవాహాన్నే కాక కాలానుగుణ వాగు లేదా వాగు పాయను కూడా సూచించగలదు. తెలుగు పాఠకులకు ‘వాగులు’ సహజంగా ఉండి, కరువు సందర్భానికీ సరిపోతుంది; విస్తృతార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: אוּלַי נִמְצָא
  choice: బహుశా ... దొరికి ... బతికించుకోగలమేమో
  rationale: ‘బహుశా’ మరియు ‘ఏమో’ అనేవి ఫలితం పట్ల ఉన్న అనిశ్చితినీ, ప్రథమ పురుష బహువచనంలోని ఉమ్మడి ఆశనూ నిలుపుతాయి.
- source_word: חָצִיר
  choice: గడ్డి
  rationale: ఇక్కడ జంతువులకు మేతగా పనికివచ్చే పచ్చికను సూచిస్తుంది. ‘ఎండు గడ్డి’ అని అనడం మూలంలో లేని భావాన్ని చేర్చుతుంది.
- source_word: וּנְחַיֶּה
  choice: బతికించుకోగలమేమో
  rationale: హిఫీల్ రూపం ‘బతికించడం, ప్రాణాలతో కాపాడడం’ అనే కారక భావాన్ని ఇస్తుంది; తెలుగు వాక్యంలో ఉద్దేశాన్ని సహజంగా తెలుపుతుంది.
- source_word: סוּס וָפֶרֶד
  choice: గుర్రాలనూ కంచరగాడిదలనూ
  rationale: హీబ్రూలో ఏకవచన రూపాలు జాతులను సమష్టిగా సూచిస్తున్నాయి. తెలుగులో సహజమైన సమష్టి బహువచనం వాడబడింది.
- source_word: וְלֹא נַכְרִית מֵהַבְּהֵמָה
  choice: పశుసంపదలో కొన్నిటిని తొలగించాల్సిన అవసరం రాకపోవచ్చు
  rationale: כרת లోని ‘తెగగొట్టు/తొలగించు’ రూపకాన్ని ‘తొలగించు’ కొంతవరకు నిలుపుతుంది; מן ను భాగార్థకంగా గ్రహించి ‘కొన్నిటిని’ అన్నాం. ఇది చంపడమేనని అనవసరంగా ఖరారు చేయకుండా పశువుల సంఖ్య తగ్గించాల్సిన సందర్భాన్ని తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. రాజు సేవకునితో మాట్లాడుతున్నందున ఏకవచన ఆజ్ఞ ‘వెళ్లు’ నిలుపబడింది. భౌగోళిక పదానికి అరుదైన విదేశీ పదం వాడకుండా ‘వాగులు’ ఎంచుకొని, దాని విస్తృత హీబ్రూ భావాన్ని పాదసూచికలో వివరించాం. మూలంలోని అనిశ్చితిని ‘బహుశా…ఏమో’ ద్వారా, చివరి పదబంధంలోని రూపకాన్నీ భాగార్థాన్నీ ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా కాపాడాం.
