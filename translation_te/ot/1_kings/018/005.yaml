    [a] ఇక్కడి హీబ్రూ పదం కాలానుగుణంగా నీరు ప్రవహించే వాగును, వాగు పాయను, లేదా నీటి ప్రవాహాన్ని సూచించవచ్చు.


    [b] అక్షరార్థంగా, “పశుసంపదలో నుండి తెగగొట్టకుండా.” మేత సరిపోకపోవడం వల్ల పశుసంపదలో కొంతను తొలగించాల్సి రావడాన్ని ఈ మాట సూచిస్తుండవచ్చు.'
