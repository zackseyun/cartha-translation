language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלִיָּ֨הוּ֙ לְ/אַחְאָ֔ב עֲלֵ֖ה אֱכֹ֣ל וּ/שְׁתֵ֑ה כִּי ק֖וֹל הֲמ֥וֹן הַ/גָּֽשֶׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/041.yaml
  text: And Elijah said to Ahab[a], “Go up, eat and drink, for there is the sound of the abundance of rain.”
translation:
  language: te
  text: అప్పుడు ఏలీయా అహాబుతో, “పైకి వెళ్లి, తిని తాగు; ఎందుకంటే గొప్ప వర్షపు శబ్దం వినిపిస్తోంది[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “వర్షపు కోలాహల ధ్వని.” హీబ్రూ పదబంధం వర్షపు ఘోషను లేదా సమృద్ధిని సూచించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘అప్పుడు’ సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: אֵלִיָּהוּ לְאַחְאָב
  choice: ఏలీయా అహాబుతో
  rationale: వ్యక్తి పేర్లను ప్రామాణిక తెలుగు బైబిలు రూపాల్లో ఇచ్చి, לְ సూచించే సంభాషణ లక్ష్యాన్ని ‘తో’ ద్వారా సహజంగా వ్యక్తం చేశాం.
- source_word: עֲלֵה
  choice: పైకి వెళ్లి
  rationale: ఆజ్ఞారూపంలోని עלה స్థలపరమైన ‘ఎక్కు/పైకి వెళ్లు’ భావాన్ని కలిగి ఉంది; సందర్భంలో ‘పైకి వెళ్లి’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: אֱכֹל וּשְׁתֵה
  choice: భోజనం చేసి, తాగు
  rationale: రెండు ఆజ్ఞలను నేరుగా నిలుపుతూ, ఆధునిక గౌరవప్రద తెలుగులో సహజమైన పదబంధాన్ని ఎంచుకున్నాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఏలీయా ఇచ్చిన ఆజ్ఞకు కారణాన్ని పరిచయం చేసే హేత్వర్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: קוֹל הֲמוֹן הַגָּשֶׁם
  choice: భారీ వర్షపు ఘోష వినిపిస్తోంది
  rationale: קוֹל అంటే శబ్దం; הֲמוֹן ఇక్కడ ఘోష, గర్జన లేదా విస్తారతను సూచించగలదు. ‘భారీ వర్షపు ఘోష’ మూలంలోని సంక్షిప్తమైన, సజీవమైన చిత్రాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని వర్షపు శబ్దం/విస్తారత అనే భావసాంద్రతను ప్రధాన పాఠ్యం మరియు పాదసూచికలో నిలిపాం.
