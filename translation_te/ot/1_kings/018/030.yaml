source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלִיָּ֤הוּ לְ/כָל הָ/עָם֙ גְּשׁ֣וּ אֵלַ֔/י וַ/יִּגְּשׁ֥וּ כָל הָ/עָ֖ם אֵלָ֑י/ו וַ/יְרַפֵּ֛א אֶת מִזְבַּ֥ח יְהוָ֖ה הֶ/הָרֽוּס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/030.yaml
  text: Then Elijah said to all the people[a], “Come near to me.” So all the people came near to him, and he repaired the altar of Yahweh that had been torn down.
translation:
  language: te
  text: 'అప్పుడు ఏలీయా ప్రజలందరితో ఇలా అన్నాడు: “నా దగ్గరకు రండి.” ప్రజలందరూ అతని దగ్గరకు వచ్చారు. అప్పుడు అతడు ధ్వంసం చేయబడిన యాహ్వే బలిపీఠాన్ని మరమ్మతు చేశాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పునరుద్ధరించాడు”; హెబ్రూ క్రియకు అక్షరార్థం “స్వస్థపరచాడు.”
    reason: వַיְרַפֵּא క్రియకు సందర్భానుసారమైన “మరమ్మతు చేశాడు” అనే అనువాదంతో పాటు, దాని అక్షరార్థమైన రూపకాన్ని మరియు “పునరుద్ధరించాడు” అనే సాధ్యమైన ప్రత్యామ్నాయాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: גְּשׁוּ
  choice: నా దగ్గరకు రండి
  rationale: ఇక్కడ נגשׁ ఆజ్ఞారూపం ప్రజలు ఏలీయాకు భౌతికంగా దగ్గరకు రావాలని పిలుస్తోంది. ‘నా దగ్గరకు రండి’ ఆధునిక తెలుగులో సహజంగా ఉండి దిశాభావాన్ని నిలుపుతుంది.
- source_word: וַיִּגְּשׁוּ
  choice: అతని దగ్గరకు వచ్చారు
  rationale: ఏలీయా ఇచ్చిన ఆజ్ఞ నెరవేరినట్లు చూపేందుకు ముందటి పదబంధంతో భావసామ్యాన్ని నిలిపింది.
- source_word: וַיְרַפֵּא
  choice: బాగుచేశాడు
  rationale: רפא అనే క్రియకు అక్షరార్థం ‘స్వస్థపరచు’; అయితే బలిపీఠం కర్మగా ఉన్నప్పుడు దానిని తిరిగి సరిచేయడం అనే భావం వస్తుంది. ‘బాగుచేశాడు’ ఈ రూపకాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִזְבַּח יְהוָה
  choice: యాహ్వే బలిపీఠం
  rationale: హెబ్రూ నిర్మాణ సంబంధాన్ని తెలుగులో సహజమైన స్వామ్య నిర్మాణంతో వ్యక్తం చేసింది; దైవనామాన్ని బిరుదుతో భర్తీ చేయలేదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: మూలపాఠంలోని చతురక్షర దైవనామాన్ని వ్యక్తిగత నామంగా లిప్యంతరీకరించింది.
- source_word: הֶהָרוּס
  choice: కూలగొట్టబడిన
  rationale: הרס నిష్క్రియాత్మక కృదంతం ముందుగా పడగొట్టబడిన లేదా ధ్వంసం చేయబడిన స్థితిని సూచిస్తుంది. ‘కూలగొట్టబడిన’ ఉద్దేశపూర్వక విధ్వంస భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ ఆ క్రమాన్ని సహజమైన ఆధునిక తెలుగు కథనశైలిలో తెలియజేస్తుంది.
- source_word: כָל הָעָם
  choice: ప్రజలందరూ / ప్రజలందరితో
  rationale: సమూహాన్ని సంపూర్ణంగా సూచించే హెబ్రూ పదబంధానికి సహజమైన తెలుగు రూపం; విభక్తి ప్రకారం రూపాంతరం చేసింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: వచనంలో సాధారణ బిరుదు కాకుండా చతురక్షర దైవనామమే ఉంది. అందువల్ల దాన్ని ‘ప్రభువు’గా మార్చకుండా, మూలంలోని వ్యక్తిగత నామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించడం జరిగింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. చిన్న వాక్యాలతో ఆజ్ఞ–ప్రతిస్పందన క్రమాన్ని స్పష్టంగా ఉంచి, మూలంలోని ‘దగ్గరకు రావడం’ అనే పదపునరావృతిని భావపరంగా నిలిపాం.
