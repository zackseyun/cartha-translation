source:
  edition: WLC
  text: וְ/יִתְּנוּ לָ֜/נוּ שְׁנַ֣יִם פָּרִ֗ים וְ/יִבְחֲר֣וּ לָ/הֶם֩ הַ/פָּ֨ר הָ/אֶחָ֜ד וִֽ/ינַתְּחֻ֗/הוּ וְ/יָשִׂ֨ימוּ֙ עַל הָ֣/עֵצִ֔ים וְ/אֵ֖שׁ לֹ֣א יָשִׂ֑ימוּ וַ/אֲנִ֞י אֶעֱשֶׂ֣ה אֶת הַ/פָּ֣ר הָ/אֶחָ֗ד וְ/נָֽתַתִּי֙ עַל הָ֣/עֵצִ֔ים וְ/אֵ֖שׁ לֹ֥א אָשִֽׂים־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/023.yaml
  text: Let them give us two bulls[a], and let them choose one bull for themselves, cut it into pieces, and place it on the wood, but put no fire under it. And I will prepare the other bull and place it on the wood, and I will put no fire under it.
translation:
  language: te
  text: వారు మనకు రెండు ఎద్దులను ఇవ్వాలి. వాటిలో ఒక ఎద్దును తమ కోసం ఎంచుకొని, దాన్ని ముక్కలుగా కోసి, కట్టెల మీద ఉంచాలి; అయితే నిప్పు పెట్టకూడదు.[a] నేను మరో ఎద్దును సిద్ధం చేసి, కట్టెల మీద ఉంచుతాను; నిప్పు పెట్టను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థం, “నిప్పు పెట్టకూడదు.” బలి కట్టెలపై ఉంచబడే సందర్భాన్ని బట్టి, నిప్పు బలికింద ఉన్న కట్టెలకు పెట్టకూడదనే అర్థం సూచించబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתְּנוּ לָנוּ
  choice: వారు మనకు ... ఇవ్వాలి
  rationale: సంయోజక వావుతో వచ్చిన అసంపూర్ణ క్రియ ఇక్కడ ప్రతిపాదన లేదా సవాలు భావాన్ని వ్యక్తం చేస్తుంది. ఆధునిక తెలుగులో ‘ఇవ్వాలి’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: שְׁנַיִם פָּרִים
  choice: రెండు ఎద్దులను
  rationale: פַּר బలుల సందర్భంలో మందలోని మగ పశువును సూచిస్తుంది. తెలుగులో ‘ఎద్దు’ సాధారణ పాఠకునికి స్పష్టమైన, సహజమైన పదం; మూలంలో స్పష్టంగా లేని వయస్సును చేర్చలేదు.
- source_word: וְיִבְחֲרוּ לָהֶם הַפָּר הָאֶחָד
  choice: వాటిలో ఒక ఎద్దును తమ కోసం ఎంచుకొని
  rationale: בחר అంటే ఎంచుకోవడం; לָהֶם వారి పక్షాన లేదా తమ కోసం ఎంచుకోవడాన్ని సూచిస్తుంది. రెండు ఎద్దుల్లో ఒకటి అనే సంబంధాన్ని ‘వాటిలో’ సహజంగా స్పష్టం చేస్తుంది.
- source_word: וִינַתְּחֻהוּ
  choice: దాన్ని ముక్కలుగా కోసి
  rationale: נתח బలి సిద్ధీకరణలో జంతువును భాగాలుగా విభజించడాన్ని సూచిస్తుంది. ‘ముక్కలుగా కోసి’ నిర్దిష్ట సంఖ్య లేదా విధానాన్ని అనవసరంగా చేర్చదు.
- source_word: וְיָשִׂימוּ עַל־הָעֵצִים
  choice: కట్టెల మీద ఉంచాలి
  rationale: שׂים అంటే పెట్టడం లేదా ఉంచడం; עֵצִים ఇక్కడ బలిపీఠంపై పేర్చిన ఇంధన కట్టెలను సూచిస్తుంది. ‘కట్టెల మీద ఉంచాలి’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: וְאֵשׁ לֹא יָשִׂימוּ
  choice: నిప్పు పెట్టకూడదు
  rationale: హీబ్రూ వాక్యం అక్షరార్థంగా ‘నిప్పు పెట్టకూడదు’ అని మాత్రమే చెబుతుంది. తెలుగులో ఇదే సహజంగా ఉండడంతో ‘కింద’ వంటి సందర్భానుగత పదాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: וַאֲנִי אֶעֱשֶׂה אֶת־הַפָּר הָאֶחָד
  choice: నేను మరో ఎద్దును సిద్ధం చేసి
  rationale: బలి సందర్భంలో עשה జంతువును సిద్ధం చేయడాన్ని సూచిస్తుంది. మొదటి ఎద్దు వారికి కేటాయించబడినందున הַפָּר הָאֶחָדను తెలుగులో ‘మరో ఎద్దు’ అని సహజంగా అనువదించాం.
- source_word: וְנָתַתִּי עַל־הָעֵצִים
  choice: కట్టెల మీద ఉంచుతాను
  rationale: נתן ఇక్కడ పెట్టడం లేదా ఉంచడం అనే అర్థంలో ఉంది. ముందరి చర్యతో సమాంతరతను నిలుపుతూ ‘ఉంచుతాను’ అని అనువదించాం.
- source_word: וְאֵשׁ לֹא אָשִׂים
  choice: నిప్పు మాత్రం పెట్టను
  rationale: ముందటి నిషేధంతో సమాంతరంగా, ఏలీయా కూడా నిప్పు పెట్టడని మూలం చెబుతుంది. ‘మాత్రం’ వ్యత్యాసాన్ని సహజంగా చూపుతుంది; కొత్త భావాన్ని చేర్చదు.
theological_decisions:
- issue: బలి సిద్ధీకరణను వర్ణించే భాషలో తరువాతి సిద్ధాంత వర్గాలను చేర్చకుండా ఉండడం
  choice: ‘ముక్కలుగా కోసి,’ ‘కట్టెల మీద ఉంచాలి,’ ‘నిప్పు పెట్టకూడదు’ వంటి ప్రత్యక్ష చర్యల భాషను ఉపయోగించడం
  alternative: అంతటా ‘అర్పించాలి,’ ‘క్రమంగా పేర్చాలి’ వంటి సాంకేతిక ఆరాధనా పదజాలాన్ని ఉపయోగించడం
  rationale: ఈ వచనం కర్మేలు పర్వతంపై జరగబోయే పరీక్షకు సంబంధించిన ఆచరణాత్మక ఏర్పాటును వర్ణిస్తుంది; బలి సిద్ధాంతాన్ని వివరిస్తుండదు. కాబట్టి మూలంలోని స్పష్టమైన చర్యలకే అనువాదం పరిమితమైంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ప్రతిపాదనాత్మక హీబ్రూ క్రియలను తెలుగులో సహజమైన విధి రూపాలతో అందించాం. మూలంలో లేని ‘కింద’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా, సందర్భార్థాన్ని పాదటిప్పణిలో వివరించాం.
