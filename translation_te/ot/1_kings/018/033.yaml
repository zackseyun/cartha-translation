translation:
  language: te
  text: అప్పుడు అతడు కట్టెలను క్రమంగా పేర్చి, కోడెను ముక్కలుగా కోసి, కట్టెల మీద ఉంచాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  choice: క్రమంగా పేర్చి
  rationale: ערך ఇక్కడ బలిపీఠంపై కట్టెలను తగిన క్రమంలో అమర్చడాన్ని సూచిస్తుంది. ‘క్రమంగా పేర్చి’ అనేది ఆ ఉద్దేశపూర్వక ఏర్పాటును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הָעֵצִים
  choice: కట్టెలను
  rationale: హీబ్రూలో బహువచన రూపం ఉన్నా, సందర్భంలో ఇవి బలికి ఉపయోగించే కట్టెలు. తెలుగు వాడుకలో ‘కట్టెలు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וַיְנַתַּח
  choice: ముక్కలుగా కోసి
  rationale: נתח బలి జంతువును భాగాలుగా విభజించడాన్ని సూచిస్తుంది. ‘ముక్కలుగా కోసి’ మూలార్థాన్ని స్పష్టంగా అందిస్తుంది; అవసరంలేని సాంకేతిక లేదా కఠిన పదజాలాన్ని నివారిస్తుంది.
- source_word: הַפָּר
  choice: ఎద్దును
  rationale: פַּר బలి సందర్భంలో మగ పశువును సూచిస్తుంది. ఆధునిక సాధారణ తెలుగులో ‘ఎద్దు’ నేరుగా అర్థమయ్యే సముచిత పదం; ఈ వచనం ఒక్కటే దాని వయస్సును ప్రత్యేకంగా చెప్పదు.
- source_word: וַיָּשֶׂם
  choice: ఉంచాడు
  rationale: שׂים యొక్క సాధారణ స్థలార్థాన్ని ‘ఉంచాడు’ సహజంగా తెలియజేస్తుంది; కర్మకాండ సంబంధమైన చర్యకు కూడా ఇది తగినది.
- source_word: עַל הָעֵצִים
  choice: కట్టెల మీద
  rationale: עַל ఇక్కడ స్పష్టమైన స్థల సంబంధాన్ని తెలియజేస్తుంది. ‘కట్టెల మీద’ ఆధునిక తెలుగులో సహజమైన రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ వరుస క్రియల ప్రవాహాన్ని తెలుగులో ‘పేర్చి… కోసి… ఉంచాడు’ అనే సహజ క్రమంతో నిలిపాం.
