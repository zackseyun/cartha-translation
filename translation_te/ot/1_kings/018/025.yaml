id: 1KI.18.25
reference: 1 Kings 18:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלִיָּ֜הוּ לִ/נְבִיאֵ֣י הַ/בַּ֗עַל בַּחֲר֨וּ לָ/כֶ֜ם הַ/פָּ֤ר הָֽ/אֶחָד֙ וַ/עֲשׂ֣וּ רִאשֹׁנָ֔ה כִּ֥י אַתֶּ֖ם הָ/רַבִּ֑ים וְ/קִרְאוּ֙ בְּ/שֵׁ֣ם אֱלֹהֵי/כֶ֔ם וְ/אֵ֖שׁ לֹ֥א תָשִֽׂימוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/025.yaml
  text: Then Elijah said to the prophets of Baal[a], “Choose one bull for yourselves and prepare it first, because you are many; then call on the name of your god[b], but put no fire under it.”
translation:
  language: te
  text: అప్పుడు ఏలీయా బయలు ప్రవక్తలతో, “మీ కోసం ఒక ఎద్దును ఎంచుకొని, ముందుగా దాన్ని సిద్ధం చేయండి; ఎందుకంటే మీరు చాలామంది. తరువాత మీ దేవుని పేరున మొరపెట్టుకోండి[a]. అయితే నిప్పు పెట్టవద్దు[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘మీ దేవుని పేరున పిలవండి’; ఈ నుడికారం ఆ దేవుణ్ణి ఉద్దేశించి మొరపెట్టుకోవడం లేదా వేడుకోవడం అని అర్థం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ కేవలం ‘నిప్పు పెట్టవద్దు’ అని చెబుతుంది; బలి కింద నిప్పు పెట్టవద్దనే భావం సందర్భం ద్వారా తెలుస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לִנְבִיאֵי הַבַּעַל
  choice: బయలు ప్రవక్తలతో
  rationale: నిర్మాణ సంబంధాన్ని తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בַּחֲרוּ לָכֶם הַפָּר הָאֶחָד
  choice: మీ కోసం ఒక ఎద్దును ఎంచుకొని
  rationale: ముందటి సందర్భంలో చెప్పిన రెండు ఎద్దుల్లో ఒకదాన్ని సూచిస్తుంది; לָכֶם భావాన్ని ‘మీ కోసం’ నిలుపుతుంది.
- source_word: וַעֲשׂוּ
  choice: దాన్ని సిద్ధం చేయండి
  rationale: బలి సందర్భంలో జంతువును బలికి సిద్ధం చేయడమే ఉద్దేశం; ‘అర్పించండి’ అనడం మూలం కంటే ఎక్కువ అర్థాన్ని చేర్చుతుంది.
- source_word: רִאשֹׁנָה
  choice: ముందుగా
  rationale: కార్యక్రమంలో వారు మొదట చేయాలని తెలిపే క్రియావిశేషణ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: כִּי אַתֶּם הָרַבִּים
  choice: ఎందుకంటే మీరు చాలామంది
  rationale: వారు ముందుగా చేయవలసిన కారణాన్ని నేరుగా తెలుపుతూ వారి సంఖ్యాధిక్యాన్ని నిలుపుతుంది.
- source_word: וְקִרְאוּ בְּשֵׁם אֱלֹהֵיכֶם
  choice: తరువాత మీ దేవుని పేరున మొరపెట్టుకోండి
  rationale: קרא בשם అనే నుడికారానికి దేవుణ్ణి ఉద్దేశించి పిలవడం లేదా వేడుకోవడం అనే భావం ఉంది; ‘పేరున’ మూలంలోని שםను నిలుపుతుంది.
- source_word: וְאֵשׁ לֹא תָשִׂימוּ
  choice: అయితే నిప్పు పెట్టవద్దు
  rationale: హీబ్రూ వాక్యం నిప్పు ఎక్కడ పెట్టకూడదో స్పష్టంగా చెప్పదు; బలి సందర్భంలో అర్థమయ్యే అంశాన్ని ప్రధాన పాఠంలో అదనంగా చేర్చకుండా మూలంలోని సంక్షిప్తతను నిలుపుతుంది.
theological_decisions:
- issue: אֱלֹהֵיכֶם అనే రూపం బయలును సూచించడం
  choice: మీ దేవుని
  alternative: మీ దేవుళ్ల
  rationale: אֱלֹהִים రూపపరంగా బహువచనంగా ఉండగలిగినా, తక్షణ సందర్భంలో సూచించబడేది ఏకవచనంలోని బయలు; అందువల్ల ‘మీ దేవుని’ సందర్భానికి సరిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ఆజ్ఞలు, క్రమం, కారణవాక్యం స్పష్టంగా ఉంచబడ్డాయి; బలి సందర్భంలో సూచితమైన ‘కింద’ అనే మాటను ప్రధాన పాఠంలో చేర్చకుండా పాదటిప్పణిలో వివరించబడింది.
