source:
  edition: WLC
  text: וַ/יִּבְנֶ֧ה אֶת הָ/אֲבָנִ֛ים מִזְבֵּ֖חַ בְּ/שֵׁ֣ם יְהוָ֑ה וַ/יַּ֣עַשׂ תְּעָלָ֗ה כְּ/בֵית֙ סָאתַ֣יִם זֶ֔רַע סָבִ֖יב לַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/032.yaml
  text: And with the stones he built an altar in the name of Yahweh[a], and he made a trench around the altar, like the capacity for two seahs of seed.
translation:
  language: te
  text: ఆ రాళ్లతో అతడు యాహ్వే నామంలో ఒక బలిపీఠాన్ని కట్టాడు. ఆ బలిపీఠం చుట్టూ రెండు సేయాల విత్తనం పట్టేంత పరిమాణంలో[a] ఒక కందకం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధం అక్షరార్థంగా ‘రెండు సేయాల విత్తనపు కొలత/స్థలం వలె’ అని ఉంది. ఇది కందకం పరిమాణాన్ని లేదా అది పట్టగల సామర్థ్యాన్ని సూచించే ప్రాచీన కొలతా ప్రయోగం కావచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּבְנֶה אֶת־הָאֲבָנִים מִזְבֵּחַ
  choice: ఆ రాళ్లతో అతడు ... ఒక బలిపీఠాన్ని కట్టాడు
  rationale: హీబ్రూ వాక్యంలోని ‘రాళ్లను బలిపీఠంగా కట్టాడు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ముందు వచనం ఆధారంగా ‘తిరిగి కట్టాడు’ అని అదనపు అర్థం చేర్చదు.
- source_word: בְּשֵׁם יְהוָה
  choice: యాహ్వే నామంలో
  rationale: בְּשֵׁם యొక్క సహజమైన ‘నామంలో’ అనే భావాన్ని నిలుపుతూ, దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరిస్తుంది.
- source_word: וַיַּעַשׂ תְּעָלָה
  choice: ఒక కందకం చేశాడు
  rationale: תְּעָלָה బలిపీఠం చుట్టూ చేసిన కందకం లేదా కాలువను సూచిస్తుంది. ‘కందకం’ ఈ సందర్భంలో స్పష్టంగా, సహజంగా ఉంటుంది; క్రియలో లేని విధానాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘చేశాడు’ అని ఉంచబడింది.
- source_word: כְּבֵית סָאתַיִם זֶרַע
  choice: రెండు సేయాల విత్తనం పట్టేంత పరిమాణంలో
  rationale: కష్టమైన, సంక్షిప్తమైన హీబ్రూ కొలతా ప్రయోగాన్ని తెలుగులో అర్థమయ్యేలా అందిస్తూ, ప్రాచీన ‘సేయా’ కొలమానాన్ని నిలుపుతుంది. ఇది కందకం పరిమాణం లేదా సామర్థ్యాన్ని సూచిస్తుందనే సందర్భోచిత భావాన్ని ఇస్తుంది; అనిశ్చితిని పాదటిప్పణిలో తెలియజేస్తుంది.
- source_word: סָבִיב לַמִּזְבֵּחַ
  choice: ఆ బలిపీఠం చుట్టూ
  rationale: బలిపీఠాన్ని ఆవరించిన స్థానాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ప్రాచీన కొలమానం ‘సేయా’ నిలుపబడి, అస్పష్టమైన హీబ్రూ ప్రయోగం పాదటిప్పణిలో వివరించబడింది.
