  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֵלִיָּ֗הוּ שְׁתֵּ֤ים עֶשְׂרֵה֙ אֲבָנִ֔ים כְּ/מִסְפַּ֖ר שִׁבְטֵ֣י בְנֵֽי יַעֲקֹ֑ב אֲשֶׁר֩ הָיָ֨ה דְבַר יְהוָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר יִשְׂרָאֵ֖ל יִהְיֶ֥ה שְׁמֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/031.yaml
  text: And Elijah took twelve stones[a], according to the number of the tribes of the sons of Jacob, to whom the word of Yahweh had come, saying[b], “Israel shall be your name.”
translation:
  language: te
  text: ఏలీయా యాకోబు కుమారుల[a] గోత్రాల సంఖ్య ప్రకారం పన్నెండు రాళ్లను తీసుకున్నాడు. యాకోబునకు యహ్వే వాక్కు వచ్చి, “ఇశ్రాయేలు నీ పేరు అవుతుంది” అని పలికింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో అక్షరార్థంగా “యాకోబు కుమారులు.” సందర్భంలో ఇది యాకోబు సంతానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇది యాకోబుకు “ఇశ్రాయేలు నీ పేరు అవుతుంది” అని ప్రకటించిన ఆదికాండం 32:28; 35:10లోని సంఘటనలను గుర్తుచేస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకున్నాడు
  rationale: לקח అనే సాధారణ కథన క్రియను సందర్భానికి తగిన సహజమైన తెలుగు క్రియగా అనువదిస్తుంది.
- source_word: אֵלִיָּהוּ
  choice: ఏలీయా
  rationale: ఈ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
- source_word: שְׁתֵּים עֶשְׂרֵה אֲבָנִים
  choice: పన్నెండు రాళ్లు
  rationale: సంఖ్యను, నామవాచకాన్ని నేరుగా మరియు సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כְּמִסְפַּר
  choice: సంఖ్య ప్రకారం
  rationale: כְּ యొక్క పోలిక/అనురూపత భావాన్ని, מִסְפָּר యొక్క సంఖ్య భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: שִׁבְטֵי בְנֵי יַעֲקֹב
  choice: యాకోబు కుమారుల గోత్రాలు
  rationale: గోత్ర సంబంధమైన భావాన్నీ, బెనేయ్ యాకోబ్ అనే మూలంలోని కుటుంబపరమైన పదబంధాన్నీ కాపాడుతుంది.
- source_word: אֲשֶׁר הָיָה דְבַר יְהוָה אֵלָיו
  choice: ఆ యాకోబుకు యహ్వే వాక్కు వచ్చి
  rationale: సంబంధ వాక్యం యాకోబునే సూచిస్తుందని సందర్భం తెలియజేస్తుంది; ‘వాక్కు వచ్చింది’ అనే దైవసందేశ సూత్రాన్ని నిలుపుతూ తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో సూచిస్తుంది.
- source_word: יִשְׂרָאֵל יִהְיֶה שְׁמֶךָ
  choice: ఇశ్రాయేలు నీ పేరు అవుతుంది
  rationale: మూలంలోని ‘ఇశ్రాయేలు’ అనే పదానికి ఉన్న ఆరంభ ప్రాధాన్యాన్ని నిలుపుతూ సహజమైన తెలుగు వాక్యంగా ఉంటుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో దైవనామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా పేరుగానే లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: సంబంధ వాక్యం ఎవరిని సూచిస్తుంది
  choice: యాకోబును సూచిస్తుంది
  alternative: యాకోబు కుమారులను లేదా గోత్రాలను సూచిస్తుందని అస్పష్టంగా ఉంచడం
  rationale: ఏకవచన సర్వనామం אֵלָיו మరియు ‘నీ పేరు’ అనే ఏకవచన సంబోధన యాకోబునే సూచిస్తాయి; ఇది అతనికి ఇశ్రాయేలు అని పేరు పెట్టిన సంఘటనను స్మరింపజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. హీబ్రూ సంబంధ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండో వాక్యంగా ఇచ్చాం; అయినా దాని సూచన, దైవవాక్య సూత్రం, ‘ఇశ్రాయేలు’పై ఉన్న పదక్రమ ప్రాధాన్యం నిలుపబడ్డాయి.
