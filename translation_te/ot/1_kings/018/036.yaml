  text: וַ/יְהִ֣י בַּ/עֲל֣וֹת הַ/מִּנְחָ֗ה וַ/יִּגַּ֞שׁ אֵלִיָּ֣הוּ הַ/נָּבִיא֮ וַ/יֹּאמַר֒ יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָם֙ יִצְחָ֣ק וְ/יִשְׂרָאֵ֔ל הַ/יּ֣וֹם יִוָּדַ֗ע כִּֽי אַתָּ֧ה אֱלֹהִ֛ים בְּ/יִשְׂרָאֵ֖ל וַ/אֲנִ֣י עַבְדֶּ֑/ךָ ו/ב/דברי/ך עָשִׂ֔יתִי אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/036.yaml
  text: And it happened[a], at the offering up of the grain offering, that Elijah the prophet came near and said, “O Yahweh, God of Abraham, Isaac, and Israel, let it be known today that you are God in Israel, and that I am your servant[b], and that by your word I have done all these things.”
translation:
  language: te
  text: 'ధాన్యార్పణం అర్పించే సమయానికి, ప్రవక్త ఏలీయా సమీపించి ఇలా అన్నాడు: “అబ్రాహాము, ఇస్సాకు, ఇశ్రాయేలు[a] దేవుడవైన యాహ్వే, ఈ రోజు తెలిసేలా చేయి: నీవు ఇశ్రాయేలులో దేవుడవని, నేను నీ సేవకుణ్ణని, నీ మాట ప్రకారం[b] నేను ఈ కార్యాలన్నీ చేశానని.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠ్యంలో ఇక్కడ ‘యాకోబు’ కాక ‘ఇశ్రాయేలు’ అని ఉంది.
    reason: alternative_reading
  - marker: b
    text: లేదా “నీ మాటచేత”; “నీ ఆజ్ఞ ప్రకారం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלוֹת הַמִּנְחָה
  choice: ధాన్యార్పణను అర్పించే సమయం వచ్చినప్పుడు
  rationale: מִנְחָהను దాని ప్రాథమిక బలిసంబంధ అర్థమైన ‘ధాన్యార్పణ’గా అనువదించి, עֲלוֹתలోని అర్పణ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; పాఠ్యంలో లేని ‘సాయంకాల’ాన్ని చేర్చదు.
- source_word: וַיִּגַּשׁ
  choice: ముందుకు వచ్చి
  rationale: నגשׁ సూచించే సమీపించడం లేదా దగ్గరకు రావడం అనే స్పష్టమైన కదలికను, ప్రార్థనకు ముందున్న గంభీర సందర్భానికి తగిన సహజ తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ శాస్త్రీయ ఉచ్చారణకు దగ్గరైన రూపంలో లిప్యంతరీకరిస్తుంది.
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל
  choice: అబ్రాహాము, ఇస్సాకు, ఇశ్రాయేలు దేవుడు
  rationale: హీబ్రూ పాఠ్యంలో ‘యాకోబు’ కాక ‘ఇశ్రాయేలు’ ఉన్నందున దానిని యథాతథంగా నిలుపుతుంది.
- source_word: הַיּוֹם יִוָּדַע
  choice: ఈ రోజు తెలిసేలా చేయి
  rationale: నిఫల్ అసంపూర్ణ క్రియ ఇక్కడ ప్రార్థనాత్మక అభ్యర్థనగా పనిచేస్తుంది; ఈ రూపం ఆ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהִים בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో నీవే దేవుడు
  rationale: בְּ ఉపసర్గ యొక్క సూటి స్థానార్థాన్ని ‘లో’తో నిలుపుతూ, నీవే అనే నిర్మాణం వాక్యంలోని విరుద్ధతను సహజంగా స్పష్టం చేస్తుంది.
- source_word: עַבְדֶּךָ
  choice: నీ సేవకుడు
  rationale: ప్రవక్తగా దేవుని ఆజ్ఞను నిర్వర్తించే సందర్భంలో עבדకు ‘సేవకుడు’ సహజమైనది; బానిసత్వాన్ని అనవసరంగా ముందుకు తేవదు.
- source_word: וּבִדְבָרֶךָ
  choice: నీ మాట ప్రకారమే
  rationale: בְּ + דברలోని ప్రమాణం లేదా ఆధార భావాన్ని సహజంగా తెలియజేస్తుంది; సాధనార్థమైన ‘నీ మాటచేత’ అనే సాధ్యార్థాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: עָשִׂיתִי אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: నేను ఈ పనులన్నీ చేశాను
  rationale: דברים ఇక్కడ పలికిన మాటలు కాక కార్యాలు లేదా సంగతులను సూచిస్తుంది; పూర్తయిన విధేయతను సాధారణ తెలుగు భూతకాలంతో స్పష్టంగా చెబుతుంది.
theological_decisions:
- issue: יהוה అనే నిబంధన నామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం దైవ నామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని బిరుదుతో మార్చకుండా వ్యక్తిగత నామంగా నిలుపుతుంది.
- issue: పితరుల వరుసలో ‘ఇశ్రాయేలు’ అనే పఠనం
  choice: అబ్రాహాము, ఇస్సాకు, ఇశ్రాయేలు దేవుడు
  alternative: అబ్రాహాము, ఇస్సాకు, యాకోబు దేవుడు
  rationale: ఈ వచనంలోని హీబ్రూ పాఠ్యం స్పష్టంగా יִשְׂרָאֵל అని చదువుతుంది. పరిచితమైన సూత్రానికి సరిపడేలా ‘యాకోబు’గా మార్చడం మూలపాఠ్యాన్ని సమన్వయపరచడమే అవుతుంది.
- issue: וּבִדְבָרֶךָలోని సంబంధం
  choice: నీ మాట ప్రకారమే
  alternative: నీ మాటచేతనే / నీ ఆజ్ఞ మేరకు
  rationale: హీబ్రూ בְּ ఇక్కడ ప్రమాణం, ఆధారం లేదా సాధన భావాలను అనుమతిస్తుంది. ప్రధాన పాఠ్యం విధేయత భావాన్ని సహజంగా ఇస్తూ, సాధనార్థక అవకాశాన్ని పాదసూచికలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రార్థనా శైలిని ఉపయోగించాం. మూలంలోని పునరుక్తి భావాన్ని అతిగా భారంగా చేయకుండా, సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణాన్ని ఎంచుకున్నాం. దైవ నామాన్ని ‘యాహ్వే’గా నిలిపి, మూలంలో లేని ‘సాయంకాల’ం వంటి సందర్భానుమానాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
