id: 1KI.18.10
reference: 1 Kings 18:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: חַ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ אִם יֶשׁ גּ֤וֹי וּ/מַמְלָכָה֙ אֲ֠שֶׁר לֹֽא שָׁלַ֨ח אֲדֹנִ֥/י שָׁם֙ לְ/בַקֶּשְׁ/ךָ֔ וְ/אָמְר֖וּ אָ֑יִן וְ/הִשְׁבִּ֤יעַ אֶת הַ/מַּמְלָכָה֙ וְ/אֶת הַ/גּ֔וֹי כִּ֖י לֹ֥א יִמְצָאֶֽ/כָּה׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/010.yaml
  text: As Yahweh your God lives, there is no nation or kingdom where my lord has not sent to seek you. When they said, ‘He is not here,’ he made the kingdom and the nation swear that they could not find you.
translation:
  language: te
  text: “నీ దేవుడైన యాహ్వే జీవముతోడు, నిన్ను వెదకడానికి నా ప్రభువు పంపని జాతిగానీ రాజ్యంగానీ లేదు. ‘అతడు అక్కడ లేడు’ అని వారు చెప్పినప్పుడు, నిన్ను కనుగొనలేదని అతడు ఆ రాజ్యాన్నీ ఆ జాతినీ ప్రమాణం చేయించాడు.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యాహ్వే జీవంతోడు
  rationale: హీబ్రూ ప్రమాణ సూత్రంలోని దేవుని జీవాన్ని ఆధారంగా చేసుకునే గంభీర ప్రమాణ భావాన్ని సహజమైన తెలుగు వాడుకలో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరిస్తుంది.
- source_word: אִם יֶשׁ ... אֲשֶׁר לֹא
  choice: '... లేదు'
  rationale: ప్రమాణ సందర్భంలో אִם సాధారణ షరతుగా కాక బలమైన నిరాకరణాత్మక ఉద్ఘాటనగా పనిచేస్తోంది; అందువల్ల తెలుగులో నిశ్చయార్థకంగా అనువదించబడింది.
- source_word: גּוֹי וּמַמְלָכָה
  choice: జాతిగానీ రాజ్యంగానీ
  rationale: రాజకీయ-భౌగోళిక సమాంతర జంటను సహజమైన తెలుగు నిరాకరణ నిర్మాణంలో నిలుపుతుంది.
- source_word: שָׁלַח ... לְבַקֶּשְׁךָ
  choice: నిన్ను వెదకడానికి ... మనుషులను పంపని
  rationale: ‘పంపాడు—వెదకడానికి’ అనే మూల క్రియాక్రమాన్ని నిలుపుతూ, తెలుగులో చర్యను సహజంగా అర్థమయ్యేలా పంపబడిన మనుషులను స్పష్టీకరిస్తుంది.
- source_word: אֲדֹנִי
  choice: నా యజమాని
  rationale: ఇక్కడ ఓబద్యా రాజైన అహాబును గౌరవపూర్వకంగా సూచిస్తున్నాడు; ఇది దేవునికి సంబంధించిన సంబోధన కాదు.
- source_word: וְאָמְרוּ אָיִן
  choice: ‘అతడు ఇక్కడ లేడు’ అని వారు చెప్పినప్పుడు
  rationale: אָיִן లో అంతర్లీనంగా ఉన్న ఏలీయా అనే పురుష ఏకవచన సూచనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְהִשְׁבִּיעַ
  choice: ప్రమాణం చేయించాడు
  rationale: שבע హిఫీల్ రూపంలోని ‘ప్రమాణం చేయించు’ అనే causative భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: כִּי לֹא יִמְצָאֶךָ
  choice: నీవు దొరకలేదని
  rationale: ప్రమాణపు విషయాన్ని తెలిపే כִּי ని ‘అని’తో, గత అన్వేషణ ఫలితాన్ని సహజమైన తెలుగు కర్మణి నిర్మాణంతో వ్యక్తం చేస్తుంది; మూలంలోని కర్త అస్పష్టతను అనవసరంగా పరిష్కరించదు.
theological_decisions:
- issue: యְהוָה దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: హీబ్రూ వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా ధ్వన్యనుసారంగా అందిస్తుంది.
- issue: ప్రమాణ సూత్రం యొక్క బలం
  choice: నీ దేవుడైన యాహ్వే జీవంతోడు
  alternative: నీ దేవుడైన యాహ్వే జీవిస్తున్నాడు
  rationale: ఇది కేవలం దేవుడు జీవిస్తున్నాడనే ప్రకటన కాదు; ఆయన జీవాన్ని సాక్షిగా చేసుకున్న గంభీర ప్రమాణం. ఎంపిక చేసిన రూపం ఆ వాక్ప్రయోగ బలాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. రాజసభ సంబంధమైన అֲדֹנִי కి ‘నా యజమాని’ వాడబడింది. మూలంలోని దీర్ఘ వాక్య నిర్మాణాన్ని రెండు వాక్యాలుగా విభజించి స్పష్టత పెంచినా, భావక్రమం మరియు ప్రమాణ తీవ్రత నిలుపబడ్డాయి.
