  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని సంక్షిప్తతను నిలిపి, సందర్భం వల్ల మాత్రమే స్పష్టమయ్యే పునరావృత చర్యను పాదటిప్పణిలో వివరించాం.
