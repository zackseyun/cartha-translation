  text: וַ/יֹּ֣אמֶר אֶֽל נַעֲר֗/וֹ עֲלֵֽה נָא֙ הַבֵּ֣ט דֶּֽרֶךְ יָ֔ם וַ/יַּ֨עַל֙ וַ/יַּבֵּ֔ט וַ/יֹּ֖אמֶר אֵ֣ין מְא֑וּמָה וַ/יֹּ֕אמֶר שֻׁ֖ב שֶׁ֥בַע פְּעָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/043.yaml
  text: Then he said to his servant[a], “Please go up and look toward the sea.” So he went up and looked, and said, “There is nothing.” Then he said[c][b], “Go back seven times.”
translation:
  language: te
  text: అప్పుడు అతడు తన సేవకునితో[a], “దయచేసి పైకి వెళ్లి సముద్రం వైపు చూడు” అన్నాడు. సేవకుడు పైకి వెళ్లి చూసి, “ఏమీ లేదు” అన్నాడు. అప్పుడు అతడు, “ఏడుసార్లు తిరిగి వెళ్లు[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన యువ పరిచారకునితో.”
    reason: lexical_alternative
  - marker: b
    text: అంటే, వెళ్లి మళ్లీ చూసే పనిని మొత్తం ఏడుసార్లు చేయమని.
    reason: cultural_note
lexical_decisions:
- source_word: נַעֲרוֹ
  choice: తన సేవకునితో
  rationale: נַעַר అనే పదానికి యువకుడు, పరిచారకుడు, సేవకుడు అనే అర్థాలు ఉండవచ్చు. ఇక్కడ ఏలీయా తన ఆధీనంలో సహాయం చేస్తున్న వ్యక్తికి ఆదేశిస్తున్నందున ‘సేవకుడు’ సందర్భానికి సహజంగా సరిపోతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: עֲלֵה נָא
  choice: దయచేసి పైకి వెళ్లు
  rationale: עֲלֵה పైకి వెళ్లమనే ఆజ్ఞ; נָא ఆ ఆజ్ఞను వినయపూర్వకంగా లేదా అభ్యర్థనాత్మకంగా చేస్తుంది. ‘దయచేసి’ ఈ స్వరాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַבֵּט דֶּרֶךְ יָם
  choice: సముద్రం వైపు చూడు
  rationale: הבט అంటే ‘చూడు’; דרך ים ఇక్కడ సముద్రం ఉన్న దిశను సూచిస్తుంది. ‘సముద్రం వైపు చూడు’ సహజమైన, మూలానికి నమ్మకమైన తెలుగు.
- source_word: אֵין מְאוּמָה
  choice: ఏమీ లేదు
  rationale: ఈ పదబంధం ఏదీ కనిపించడం లేదనే సంపూర్ణ నిరాకరణను తెలియజేస్తుంది. ‘ఏమీ లేదు’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: שֻׁב
  choice: తిరిగి వెళ్లు
  rationale: שׁוּב సాధారణంగా ‘తిరుగు’ లేదా ‘తిరిగి వెళ్లు’ అని అర్థం. ఇక్కడ సేవకుడు మళ్లీ వెళ్లి చూడాలనే భావం సందర్భం ద్వారా తెలుస్తుంది.
- source_word: שֶׁבַע פְּעָמִים
  choice: ఏడుసార్లు
  rationale: పునరావృత చర్యను సూచించే నేరమైన సంఖ్యావాచక పదబంధం; తెలుగులో ‘ఏడుసార్లు’ సహజం.
