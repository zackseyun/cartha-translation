id: 1KI.18.22
reference: 1 Kings 18:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלִיָּ֨הוּ֙ אֶל הָ/עָ֔ם אֲנִ֞י נוֹתַ֧רְתִּי נָבִ֛יא לַ/יהוָ֖ה לְ/בַדִּ֑/י וּ/נְבִיאֵ֣י הַ/בַּ֔עַל אַרְבַּע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/022.yaml
  text: Then Elijah said to the people[a], “I, I alone, am left as a prophet of Yahweh, but the prophets of Baal are four hundred and fifty men.”
translation:
  language: te
  text: అప్పుడు ఏలీయా ప్రజలతో, “యెహోవా ప్రవక్తగా నేను ఒక్కడినే మిగిలి ఉన్నాను[a]. అయితే బయలు ప్రవక్తలు నాలుగు వందల యాభై మంది ఉన్నారు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ ఎదురు నిలుపులో ఏలీయా బహిరంగంగా ఉన్న తన స్థితిని ఇలా చెబుతున్నాడు. అయితే కథనంలోని ఇతర చోట్ల ఓబద్యా దాచిన ఇతర ప్రవక్తలు ప్రస్తావించబడ్డారు (1 రాజులు 18:4, 13).
    reason: ఏలీయా మాటను మార్చకుండా లేదా సమన్వయపరచకుండా, సమీప కథనంలో కనిపించే ఉద్రిక్తతను వివరిస్తుంది.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు ... అన్నాడు’ దాని క్రమబలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֵלִיָּהוּ
  choice: ఏలీయా
  rationale: వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపంలో ఇచ్చాం.
- source_word: אֶל הָעָם
  choice: ప్రజలతో
  rationale: ఇక్కడ עָם సమకూడిన ఇశ్రాయేలు ప్రజలను సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో ‘ప్రజలతో ... అన్నాడు’ సహజంగా ఉంటుంది.
- source_word: אֲנִי
  choice: నేను—నేను ఒక్కడినే
  rationale: హీబ్రూలో స్పష్టంగా ఉన్న సర్వనామం, לְבַדִּיతో కలిసి ఏలీయా తన ఒంటరితనాన్ని నొక్కి చెప్పే భావాన్ని ఇస్తుంది; దాన్ని తెలుగులో పునరుక్తి ద్వారా నిలిపాం.
- source_word: נוֹתַרְתִּי
  choice: మిగిలివున్నాను
  rationale: క్రియ మిగిలి ఉండడం లేదా విడిచిపెట్టబడి ఉండడం అనే ప్రస్తుత స్థితిని సూచిస్తుంది; ‘మిగిలివున్నాను’ రెండింటికీ సమీపంగా, సహజంగా ఉంది.
- source_word: נָבִיא לַיהוָה
  choice: యెహోవాకు ప్రవక్తగా
  rationale: లామెద్ సంబంధం యెహోవాకు చెందినవాడిగా, ఆయన తరఫున పలికే ప్రవక్తగా ఏలీయాను గుర్తిస్తుంది; తెలుగు విభక్తి ఈ సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో మార్చకుండా, తెలుగులో స్థిరపడిన వ్యక్తినామ రూపం ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: וּנְבִיאֵי הַבַּעַל
  choice: అయితే బయలు ప్రవక్తలు
  rationale: వావ్ ఇక్కడ ఏలీయా ఒక్కడే ఉండటానికి, బయలు ప్రవక్తలు అనేకమంది ఉండటానికి మధ్య వ్యత్యాసాన్ని సూచిస్తుంది; ‘అయితే’ ఆ వ్యతిరేక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים אִישׁ
  choice: నాలుగు వందల యాభై మంది
  rationale: హీబ్రూ సంఖ్యను పూర్తిగా పదాల్లో ఇచ్చి, אִישׁ సూచించే వ్యక్తుల లెక్కను తెలుగు ‘మంది’తో సహజంగా నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దాన్ని బిరుదైన ‘ప్రభువు’గా మార్చకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న ‘యెహోవా’ రూపంలో ఉంచడం మూలభేదాన్ని కాపాడుతుంది.
- issue: తానే మిగిలిన ఏకైక ప్రవక్తనని ఏలీయా చెప్పడం
  choice: నేను—నేను ఒక్కడినే—మిగిలివున్నాను
  alternative: నేను ఒక్కడినే యెహోవా ప్రవక్తగా మిగిలాను
  rationale: 1 రాజులు 18:4, 13లో దాచబడిన ఇతర ప్రవక్తలు ప్రస్తావించబడినా, ఈ వచనంలోని ఏలీయా మాటను సమన్వయపరచి మార్చలేదు. స్పష్ట సర్వనామం కలిగించే ఉద్ఘాటనను, కథనంలోని ఉద్రిక్తతను యథాతథంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గంభీరమైన వచనశైలిని నిలిపాం. ‘బయలు’, ‘ఏలీయా’, ‘యెహోవా’ అనే ప్రాచుర్యంలో ఉన్న బైబిలు నామరూపాలను వాడాం; మూలంలోని ఉద్ఘాటన కోసం డాష్‌లతో పునరుక్తిని చూపించాం.
