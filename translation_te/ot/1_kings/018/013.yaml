reference: 1 Kings 18:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ/לֹֽא הֻגַּ֤ד לַֽ/אדֹנִ/י֙ אֵ֣ת אֲשֶׁר עָשִׂ֔יתִי בַּ/הֲרֹ֣ג אִיזֶ֔בֶל אֵ֖ת נְבִיאֵ֣י יְהוָ֑ה וָ/אַחְבִּא֩ מִ/נְּבִיאֵ֨י יְהוָ֜ה מֵ֣אָה אִ֗ישׁ חֲמִשִּׁ֨ים חֲמִשִּׁ֥ים אִישׁ֙ בַּ/מְּעָרָ֔ה וָ/אֲכַלְכְּלֵ֖/ם לֶ֥חֶם וָ/מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/013.yaml
  text: Has it not been told to my lord what I did when Jezebel was killing the prophets of Yahweh—how I hid a hundred of the prophets of Yahweh[a], fifty men in each cave, and provided them with bread and water?
translation:
  language: te
  text: యెజెబెలు యాహ్వే ప్రవక్తలను చంపుతున్నప్పుడు నేను చేసినది—యాహ్వే ప్రవక్తల్లోని వందమందిని[a] గుహలో యాభైమంది చొప్పున దాచిపెట్టి, వారికి రొట్టెను, నీటిని అందించిన సంగతి—నా ప్రభువుకు తెలియజేయబడలేదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “యాహ్వే ప్రవక్తల్లో వందమంది పురుషులను, యాభై యాభైమందిగా గుహలో” అని ఉంది. పునరుక్తి వారిని యాభైమంది చొప్పున విభజించడాన్ని సూచిస్తుంది. దీనిని “ప్రతి గుహలో యాభైమంది” లేదా “గుహల్లో రెండు యాభైమంది గుంపులు” అని కూడా అర్థం చేసుకోవచ్చు; గుహల సంఖ్యను పాఠ్యం స్పష్టంగా చెప్పదు.
    reason: హెబ్రీ పంపిణీ నిర్మాణం మరియు ఏకవచన ‘గుహ’ వలన ఏర్పడే వివరణాత్మక అస్పష్టతను కాపాడడం.
lexical_decisions:
- source_word: הֲלֹא הֻגַּד
  choice: తెలియజేయబడలేదా?
  rationale: సానుకూల సమాధానాన్ని ఆశించే అలంకారిక ప్రశ్నను, హెబ్రీ నిష్క్రియ నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לַאדֹנִי
  choice: నా ప్రభువుకు
  rationale: ఇది ఏలీయాకు గౌరవపూర్వక సంబోధన; దైవ బిరుదుగా కాదు. ‘ప్రభువు’ గౌరవ స్వరాన్ని నిలుపుతుంది.
- source_word: בַּהֲרֹג אִיזֶבֶל
  choice: యెజెబెలు ... చంపుతున్నప్పుడు
  rationale: కాలార్థక infinitive construct కొనసాగుతున్న హత్యల మధ్య ఓబద్యా చేసిన కార్యాన్ని సూచిస్తుంది.
- source_word: נְבִיאֵי יְהוָה
  choice: యాహ్వే ప్రవక్తలు
  rationale: దైవనామమైన יהוהను ‘యాహ్వే’గా ప్రత్యక్షంగా లిప్యంతరీకరించి, construct సంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מִנְּבִיאֵי יְהוָה מֵאָה אִישׁ
  choice: యాహ్వే ప్రవక్తల్లో వందమందిని
  rationale: מן యొక్క భాగార్థాన్ని ‘ప్రవక్తల్లో’తో, אִישׁ సహా వ్యక్తుల సంఖ్యను ‘వందమందిని’తో సహజంగా తెలియజేస్తుంది.
- source_word: חֲמִשִּׁים חֲמִשִּׁים אִישׁ בַּמְּעָרָה
  choice: ఒక్కో గుహలో యాభైమంది చొప్పున
  rationale: పదపునరుక్తి తెలిపే పంపిణీ భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది; గుహల సంఖ్యను పాఠ్యం ప్రత్యక్షంగా చెప్పదు.
- source_word: וָאֲכַלְכְּלֵם לֶחֶם וָמָיִם
  choice: వారికి రొట్టె, నీళ్లు అందించిన
  rationale: כלכל యొక్క పోషించడం/సమకూర్చడం భావాన్ని, పేర్కొన్న సాధారణ సరఫరాలతో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ఒడంబడిక నామం ప్రత్యక్షంగా ఉంది; దాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా ఉంచడం మూలభేదాన్ని కాపాడుతుంది.
- issue: אדני అనే మానవ గౌరవ సంబోధన
  choice: నా ప్రభువుకు
  alternative: నా యజమానికి
  rationale: ఇక్కడ ఓబద్యా ఏలీయాను గౌరవంగా సంబోధిస్తున్నాడు; ఇది יהוהకు ఉపయోగించిన దైవనామం కాదని సందర్భం స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్య నిర్మాణం. దీర్ఘ హెబ్రీ ప్రశ్నను తెలుగులో సహజత కోసం ప్రారంభం, ముగింపులో ప్రశ్నార్థక పునరుద్ఘాటనతో అమర్చాం; భావం మారలేదు.
