    text: లేదా, “ఇశ్రాయేలీయులందరికీ.” హీబ్రూ మూలపాఠంలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులందరికీ” అని ఉంది.
    reason: lexical_alternative
  revision_rationale: The revision removes an unwarranted causal connector, restores the Hebrew destination sense of אֶל (“to”), and uses a more standard-register expression for the communication Ahab sent. The familial expression “sons of Israel” and its idiomatic alternative remain preserved.
