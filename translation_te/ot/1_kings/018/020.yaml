revisions:
- from: కాబట్టి అహాబు ఇశ్రాయేలు కుమారులందరికీ[a] కబురు పంపి, ప్రవక్తలను కర్మెలు పర్వతం దగ్గర సమకూర్చాడు.
  to: అప్పుడు అహాబు ఇశ్రాయేలు కుమారులందరికీ[a] సందేశం పంపి, ప్రవక్తలను కర్మెలు పర్వతానికి సమకూర్చాడు.
