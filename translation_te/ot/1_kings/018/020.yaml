review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly identifies Ahab, all the sons of Israel, the prophets, and Mount Carmel. However, “కర్మెలు పర్వతం దగ్గర” means “near/by Mount Carmel,” whereas Hebrew אֶל requires movement to a destination: “to Mount Carmel.” Also, “కాబట్టి” introduces a causal inference not expressed by the narrative waw.'
  naturalness: “సందేశం పంపి” is clear, modern standard Telugu for sending a communication in this context. “కర్మెలు పర్వతానికి సమకూర్చాడు” is natural and accurately expresses assembling the prophets at the stated destination.
  terminology: “అహాబు,” “ఇశ్రాయేలు కుమారులు,” “ప్రవక్తలు,” and “కర్మెలు పర్వతం” are suitable. The footnote appropriately supplies the idiomatic collective alternative “ఇశ్రాయేలీయులందరికీ.”
  issues:
  - severity: medium
    issue: “కాబట్టి” adds causation.
    rationale: The Hebrew conjunction וַ־ here advances the narrative (“and/so”), without explicitly marking the preceding statement as the cause. “అప్పుడు” is a suitable non-causal Telugu narrative connector.
  - severity: high
    issue: “కర్మెలు పర్వతం దగ్గర” weakens the destination.
    rationale: Hebrew אֶל הַר הַכַּרְמֶל means “to Mount Carmel,” not merely “near Mount Carmel.” The Telugu should use the dative destination form “కర్మెలు పర్వతానికి.”},{
  - severity: low
    issue: “కబురు” is somewhat colloquial for this formal narrative register.
    rationale: “సందేశం” retains the contextual implication of sending a communication while fitting modern standard Telugu biblical prose more consistently.
  revised_text: అప్పుడు అహాబు ఇశ్రాయేలు కుమారులందరికీ[a] సందేశం పంపి, ప్రవక్తలను కర్మెలు పర్వతానికి సమకూర్చాడు.
  revised_footnotes:
