  text: וַ/יִּשְׁלַ֥ח אַחְאָ֖ב בְּ/כָל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּקְבֹּ֥ץ אֶת הַ/נְּבִיאִ֖ים אֶל הַ֥ר הַ/כַּרְמֶֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/020.yaml
  text: So Ahab sent to all the sons of Israel and gathered the prophets to Mount Carmel[a].
translation:
  language: te
  text: అప్పుడు అహాబు ఇశ్రాయేలు కుమారులందరికీ[a] సందేశం పంపి, ప్రవక్తలను కర్మెలు పర్వతానికి సమకూర్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులందరికీ.” హీబ్రూ మూలపాఠంలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులందరికీ” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: కబురు పంపి
  rationale: שׁלח యొక్క ప్రాథమిక భావం ‘పంపు.’ ఇక్కడ రాజు ఇశ్రాయేలు ప్రజలందరికీ సమాచారాన్ని పంపాడనే సందర్భార్థాన్ని సహజమైన తెలుగులో ‘కబురు పంపి’ తెలియజేస్తుంది; ‘పిలిపించి’ అనడం మూలంలో ఉన్నదానికంటే ఎక్కువ వ్యాఖ్యానాత్మకం.
- source_word: בְּכָל בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులందరికీ
  rationale: בְּ ఇక్కడ సందేశం అందుకునేవారిని సూచిస్తుంది. בְּנֵי יִשְׂרָאֵל అనే కుటుంబ సంబంధిత మూలవ్యక్తీకరణను ప్రధాన పాఠ్యంలో నిలిపి, సహజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וַיִּקְבֹּץ
  choice: సమకూర్చాడు
  rationale: קבץ అంటే ‘కూడగట్టు/సమకూర్చు.’ ప్రవక్తలను ఒక నిర్దిష్ట ప్రదేశంలో కూడగట్టిన చర్యను ‘సమకూర్చాడు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַנְּבִיאִים
  choice: ప్రవక్తలను
  rationale: נביאים కు ప్రామాణికమైన, సాధారణ తెలుగు సమానార్థకం ‘ప్రవక్తలు.’
- source_word: אֶל הַר הַכַּרְמֶל
  choice: కర్మెలు పర్వతం దగ్గర
  rationale: אֶל గమ్యాన్ని సూచిస్తుంది; కర్మెలు పర్వతం వద్ద సమకూర్చడాన్ని ఆధునిక తెలుగులో ‘దగ్గర’ సహజంగా తెలియజేస్తుంది.
