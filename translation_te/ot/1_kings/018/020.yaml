translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని ‘ఇశ్రాయేలు కుమారులు’ అనే రూపాన్ని నిలిపి, సాధారణ ప్రజాసూచక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
