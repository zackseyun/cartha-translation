id: 1KI.18.9
reference: 1 Kings 18:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מֶ֣ה חָטָ֑אתִי כִּֽי אַתָּ֞ה נֹתֵ֧ן אֶֽת עַבְדְּ/ךָ֛ בְּ/יַד אַחְאָ֖ב לַ/הֲמִיתֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/009.yaml
  text: And he said[a], “What have I sinned, that you are giving your servant into Ahab’s hand to put me to death?”
translation:
  language: te
  text: అప్పుడు అతడు, “నేనేం పాపం చేశానని నీవు నీ సేవకుణ్ణి అహాబు చేతికి నన్ను చంపడానికి అప్పగిస్తున్నావు?” అని అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు అతడు ... అని అన్నాడు
  rationale: హీబ్రూ కథనంలోని wayyiqtol రూపం ఓబద్యా జవాబును పరిచయం చేస్తుంది. ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా క్రమాన్ని సూచిస్తుంది.
- source_word: מֶה חָטָאתִי
  choice: నేను ఏ పాపం చేశానని
  rationale: מֶה మరియు חטא కలయిక ‘నేను చేసిన పాపమేమిటి?’ అనే ఫిర్యాదు భావాన్ని ఇస్తుంది. ‘పాపం’ అనేది మూలంలోని నైతిక, ధార్మిక బలాన్ని నిలుపుతుంది.
- source_word: כִּי אַתָּה נֹתֵן
  choice: నీవు ... అప్పగిస్తున్నావు
  rationale: כִּי ఇక్కడ ఫిర్యాదుకు కారణం లేదా విషయాన్ని పరిచయం చేస్తుంది; తెలుగు ‘అని’ నిర్మాణం దానిని సహజంగా వ్యక్తం చేస్తుంది. వర్తమాన కృదంతమైన נֹתֵן లోని తక్షణ/సమీప భావాన్ని ‘అప్పగిస్తున్నావు’ నిలుపుతుంది.
- source_word: עַבְדְּךָ
  choice: నీ సేవకుణ్ణి
  rationale: ఉన్నతునితో వినయపూర్వకంగా తనను తాను సూచించుకునే సందర్భంలో ‘నీ సేవకుడు’ సహజమైనది; ‘దాసుడు’ అనే ఎంపిక ఇక్కడ బానిస స్థితిని అనవసరంగా ముందుకు తెచ్చే అవకాశం ఉంది.
- source_word: בְּיַד אַחְאָב
  choice: అహాబు చేతికి
  rationale: ‘చేతిలో/చేతికి’ అనే హీబ్రూ నుడికారం అధికారానికి లేదా అదుపుకు అప్పగించడాన్ని సూచిస్తుంది. తెలుగు ‘అహాబు చేతికి అప్పగించు’ ఆ రూపకాన్ని, భావాన్ని రెండింటినీ సహజంగా నిలుపుతుంది.
- source_word: לַהֲמִיתֵנִי
  choice: చంపించడానికి
  rationale: מות యొక్క హిఫిల్ రూపం ‘చనిపోయేలా చేయడం’ అనే కారణార్థక భావాన్ని కలిగి ఉంది. ఇక్కడ అహాబు చేతికి అప్పగించడం ద్వారా తనను చంపేలా చేయడమే ఉద్దేశమని ‘చంపించడానికి’ సంక్షిప్తంగా, సహజంగా తెలుపుతుంది.
