translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు స్పష్టమైన కథన శైలి. మూలంలోని ‘పాపం’ అనే నైతిక-ధార్మిక పదాన్ని నిలుపుతూ, ‘అహాబు చేతికి అప్పగించడం’ అనే హీబ్రూ రూపకాన్ని సహజ తెలుగు నుడికారంతో అందించాం.
