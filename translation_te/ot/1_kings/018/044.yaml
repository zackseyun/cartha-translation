translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి వాడబడింది. మొదటి ‘అతడు’ హీబ్రూ వచనంలోని సూచనను అలాగే ఉంచుతుంది; రెండవ మాట చెప్పేవాడు సందర్భానుసారం ఏలీయా కాబట్టి తెలుగులో స్పష్టత కోసం అతని పేరు చేర్చబడింది. అహాబు రాజుతో ఉద్దేశించిన మాటల్లో గౌరవ బహువచనం వాడబడింది.
