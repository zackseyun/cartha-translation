  text: וַֽ/יְהִי֙ בַּ/שְּׁבִעִ֔ית וַ/יֹּ֗אמֶר הִנֵּה עָ֛ב קְטַנָּ֥ה כְּ/כַף אִ֖ישׁ עֹלָ֣ה מִ/יָּ֑ם וַ/יֹּ֗אמֶר עֲלֵ֨ה אֱמֹ֤ר אֶל אַחְאָב֙ אֱסֹ֣ר וָ/רֵ֔ד וְ/לֹ֥א יַעַצָרְ/כָ֖ה הַ/גָּֽשֶׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/044.yaml
  text: And it happened on the seventh time that he said[a], “Look, a small cloud, like a man’s palm, is rising from the sea.” Then he said, “Go up, say to Ahab, ‘Harness your chariot and go down[c][b], so that the rain does not stop you.’”
translation:
  language: te
  text: 'ఏడోసారి అతడు, “ఇదిగో, మనిషి అరచేయంత[a] చిన్న మేఘం సముద్రం నుండి పైకి వస్తోంది” అన్నాడు. అప్పుడు ఏలీయా, “పైకి వెళ్లి అహాబుతో ఇలా చెప్పు: ‘రథానికి గుర్రాలను కట్టించి[b] కిందికి వెళ్లండి; లేకపోతే వర్షం మిమ్మల్ని అడ్డుకుంటుంది[c]’” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మనిషి అరచేయి పరిమాణంలో.”
    reason: lexical_alternative
  - marker: b
    text: “రథానికి గుర్రాలను కట్టించడం” అంటే ప్రయాణం కోసం గుర్రాలను రథానికి జోడించి సిద్ధం చేయించడం.
    reason: cultural_note
  - marker: c
    text: లేదా “వర్షం మిమ్మల్ని నిలిపివేస్తుంది,” “వర్షం మిమ్మల్ని ఆలస్యం చేస్తుంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּשְּׁבִעִית
  choice: ఏడోసారి
  rationale: మునుపటి వచనాల్లో సేవకుడు పదేపదే వెళ్లి చూసిన సందర్భాన్ని బట్టి ఇది ఏడవ సందర్భాన్ని సూచిస్తుంది. తెలుగు కథనంలో ‘ఏడోసారి’ సహజంగా ఉంది; וַיְהִי యొక్క కథన కొనసాగింపును విడిగా అనువదించాల్సిన అవసరం లేదు.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: కనిపిస్తున్న దానివైపు వెంటనే దృష్టి మళ్లించే హీబ్రూ సూచనార్థక అవ్యయానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: עָב קְטַנָּה
  choice: చిన్న మేఘం
  rationale: నామవాచక పదబంధానికి సూటిగా, సహజంగా ఉన్న అనువాదం.
- source_word: כְּכַף אִישׁ
  choice: మనిషి అరచేయంత
  rationale: כַּף అరచేయిని లేదా చేతి లోపలి భాగాన్ని సూచిస్తుంది. సందర్భంలో మేఘం పరిమాణంతో పోలిక ఉన్నందున తెలుగు ‘అరచేయంత’ ఆ భావాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: עֹלָה מִיָּם
  choice: సముద్రం నుండి పైకి వస్తోంది
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న దృశ్య చర్యను తెలియజేస్తుంది; ‘పైకి వస్తోంది’ ఆ కదలికను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עֲלֵה
  choice: పైకి వెళ్లి
  rationale: ఆజ్ఞలోని దిశాసూచక భావాన్ని నిలుపుతుంది.
- source_word: אֱמֹר אֶל אַחְאָב
  choice: అహాబుతో ఇలా చెప్పు
  rationale: ప్రత్యక్ష సందేశాన్ని పరిచయం చేసే సహజ తెలుగు రూపం.
- source_word: אֱסֹר
  choice: రథాన్ని కట్టించుకొని
  rationale: אָסַר యొక్క ప్రాథమిక భావం కట్టడం. ఈ సందర్భంలో ప్రయాణానికి రథానికి గుర్రాలను కట్టడాన్ని సూచిస్తుంది; తెలుగులో రాజే స్వయంగా కాక సేవకులతో చేయించుకునే భావానికి ‘కట్టించుకొని’ సరిపోతుంది.
- source_word: וָרֵד
  choice: కిందికి వెళ్లండి
  rationale: కర్మేలు పర్వతం నుండి దిగే దిశను నిలుపుతుంది. రాజుతో చెప్పే సందేశం కావడంతో గౌరవ బహువచనం సహజంగా ఉంది.
- source_word: וְלֹא יַעַצָרְכָה הַגָּשֶׁם
  choice: లేకపోతే వర్షం మిమ్మల్ని అడ్డుకుంటుంది
  rationale: עצר ఇక్కడ అడ్డుకోవడం, నిలిపివేయడం లేదా ప్రయాణాన్ని ఆలస్యం చేయడం అనే భావాన్ని కలిగి ఉంది. హెచ్చరిక స్వరాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, వర్షం ఎలా అడ్డుకుంటుందో అనవసరంగా నిర్ధారించదు.
