  edition: WLC
  text: וַֽ/יְחַלְּק֥וּ לָ/הֶ֛ם אֶת הָ/אָ֖רֶץ לַֽ/עֲבָר בָּ֑/הּ אַחְאָ֞ב הָלַ֨ךְ בְּ/דֶ֤רֶךְ אֶחָד֙ לְ/בַדּ֔/וֹ וְ/עֹֽבַדְיָ֛הוּ הָלַ֥ךְ בְּ/דֶרֶךְ אֶחָ֖ד לְ/בַדּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/006.yaml
  text: 'So they divided the land between themselves to pass through it: Ahab went one way by himself[a], and Obadiah went another way by himself.'
translation:
  language: te
  text: దానిలో ప్రయాణించడానికి వారు దేశాన్ని తమ మధ్య పంచుకున్నారు. అహాబు ఒక దారిలో ఒంటరిగా వెళ్లాడు; ఓబద్యా మరొక దారిలో ఒంటరిగా వెళ్లాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ మూలంలో ఇద్దరి విషయంలోనూ అక్షరార్థంగా “ఒక దారిలో” అనే మాటే పునరుక్తమవుతుంది: “అహాబు ఒక దారిలో ఒంటరిగా వెళ్లాడు; ఓబద్యా ఒక దారిలో ఒంటరిగా వెళ్లాడు.” వేర్వేరు మార్గాల్లో వెళ్లారనే భావం సహజమైన తెలుగులో స్పష్టంగా ఉండేందుకు రెండవ చోట “మరొక దారిలో” అని అనువదించాం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלְּקוּ לָהֶם
  choice: వారు దేశాన్ని తమ మధ్య పంచుకొని
  rationale: పీయేల్ క్రియ క్రియాశీలంగా విభజించడాన్ని సూచిస్తుంది; לָהֶם సందర్భంలో ఇద్దరి మధ్య ప్రాంతాన్ని పంచుకోవడాన్ని తెలియజేస్తుంది.
- source_word: אֶת הָאָרֶץ
  choice: దేశాన్ని
  rationale: ఇక్కడ אֶרֶץ వారు వెదకబోయే ప్రాంతాన్ని సూచిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘దేశం’ సహజంగా, విస్తృతార్థంతో సరిపోతుంది.
- source_word: לַעֲבָר בָּהּ
  choice: దానిలో సంచరించడానికి
  rationale: עבר తో בָּהּ ఆ ప్రాంతమంతటిలో ప్రయాణించడాన్ని సూచిస్తుంది. ‘సంచరించడానికి’ అనేది సందర్భానుసారంగా సహజమైన ప్రయోజనార్థక రూపం.
- source_word: הָלַךְ
  choice: వెళ్లాడు
  rationale: మార్గవివరణలో הלך కు ‘వెళ్లాడు’ సహజమైన తెలుగు సమానార్థకం; నడకకే పరిమితం చేయదు.
- source_word: בְּדֶרֶךְ אֶחָד
  choice: ఒక దారిలో / మరొక దారిలో
  rationale: హీబ్రూ రెండు ఉపవాక్యాల్లోనూ ‘ఒక దారి’ అని పునరుక్తి చేస్తుంది. తెలుగులో వారి వేర్వేరు మార్గాల భావాన్ని సహజంగా వ్యక్తం చేయడానికి రెండవదాన్ని ‘మరొక దారిలో’గా ఇచ్చాం; మూలరూపాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: לְבַדּוֹ
  choice: ఒంటరిగా
  rationale: ప్రతి వ్యక్తి ఇతరుని నుండి విడిగా వెళ్లాడనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: עֹבַדְיָהוּ
  choice: ఓబద్యా
  rationale: హీబ్రూ వ్యక్తినామాన్ని ప్రామాణిక తెలుగు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
