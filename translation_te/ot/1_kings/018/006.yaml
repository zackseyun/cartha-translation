  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథనశైలి. హీబ్రూ సమాంతర నిర్మాణంలోని భావాన్ని నిలుపుతూ, తెలుగులో అసహజమైన పునరుక్తిని పాదటిప్పణి సహాయంతో నిర్వహించాం.
