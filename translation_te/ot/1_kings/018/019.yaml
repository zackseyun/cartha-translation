source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁלַ֨ח קְבֹ֥ץ אֵלַ֛/י אֶת כָּל יִשְׂרָאֵ֖ל אֶל הַ֣ר הַ/כַּרְמֶ֑ל וְ/אֶת נְבִיאֵ֨י הַ/בַּ֜עַל אַרְבַּ֧ע מֵא֣וֹת וַ/חֲמִשִּׁ֗ים וּ/נְבִיאֵ֤י הָֽ/אֲשֵׁרָה֙ אַרְבַּ֣ע מֵא֔וֹת אֹכְלֵ֖י שֻׁלְחַ֥ן אִיזָֽבֶל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/019.yaml
  text: Now send and gather to me all Israel at Mount Carmel[a], along with the prophets of Baal, four hundred and fifty, and the prophets of Asherah, four hundred[c][b], who eat at Jezebel’s table.
translation:
  language: te
  text: ఇప్పుడు నీవు పంపి, ఇశ్రాయేలీయులందరినీ కర్మెలు కొండపై[a] నా దగ్గరకు సమకూర్చు. బయలు ప్రవక్తలైన నాలుగువందల యాభై మందినీ, యెజెబెలు బల్ల వద్ద భోజనం చేసేవారైన అషేరా[c] ప్రవక్తలైన నాలుగువందల మందినీ సమకూర్చు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కర్మెలు కొండకు.’ హీబ్రూ విభక్తి సమకూడే స్థలం వైపు కదలికను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘యెజెబెలు బల్ల వద్ద భోజనం చేసేవారు’ అనేది వారు ఆమె రాజపోషణలో ఉండేవారని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘అషేరా’ కనాను ప్రాంతంలో పూజించబడిన దేవత పేరు. కొన్ని సందర్భాల్లో ఇదే పదం ఆమెకు సంబంధించిన ఆరాధనా వస్తువును కూడా సూచిస్తుంది; ఇక్కడ ‘బయలు ప్రవక్తలు’ అనే సమాంతర ప్రయోగం దేవతనే సూచించే అర్థానికి మద్దతు ఇస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: కాబట్టి ఇప్పుడు
  rationale: సందర్భంలో ఏలీయా వెంటనే చేయవలసిన ఆజ్ఞను ప్రవేశపెట్టే సంధాన–కాల సూచకంగా ఉంది; తెలుగు వాక్యప్రవాహంలో ‘కాబట్టి ఇప్పుడు’ సహజంగా ఆ బలాన్ని అందిస్తుంది.
- source_word: שְׁלַח קְבֹץ
  choice: మనుష్యులను పంపి… సమకూర్చు
  rationale: మొదటి క్రియ పంపే చర్యను, రెండవది దాని ఉద్దేశమైన సమకూర్చడాన్ని సూచిస్తుంది. తెలుగులో కర్మను భావగర్భితంగా చేర్చి రెండు ఆజ్ఞల సంబంధాన్ని స్పష్టంగా ఉంచింది.
- source_word: אֵלַי
  choice: నా దగ్గరికి
  rationale: ఏలీయా వైపు దిశను నేరుగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరినీ
  rationale: ఇది జాతీయ సమూహాన్ని సూచించే విస్తృత ప్రయోగం. తెలుగులో వ్యక్తుల సమాహారంగా సహజంగా వినిపిస్తూ మూలంలోని సంపూర్ణతను నిలుపుతుంది.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: కర్మెలు కొండకు
  rationale: אֶל కదలిక లేదా గమ్యాన్ని సూచిస్తుంది; అందువల్ల స్థలార్థక ‘వద్ద’ కంటే దిశార్థక ‘కు’ మూలానికి దగ్గరగా ఉంది.
- source_word: נְבִיאֵי הַבַּעַל
  choice: బయలు ప్రవక్తలను
  rationale: బయలుతో అనుబంధితులైన ప్రవక్తలను సూచించే నిర్మాణాన్ని సంక్షిప్తంగా, సంప్రదాయానికి మాత్రమే పరిమితం కాని సహజ తెలుగులో ఇస్తుంది.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים
  choice: నాలుగువందల యాభై మందిని
  rationale: వ్యక్తులను లెక్కిస్తున్నందున ‘మంది’తో సంఖ్యను అక్షరరూపంలో ఇచ్చింది.
- source_word: נְבִיאֵי הָאֲשֵׁרָה
  choice: అషేరా ప్రవక్తలను
  rationale: బయలు ప్రవక్తలతో ఉన్న సమాంతర నిర్మాణం కారణంగా అషేరాను దేవత పేరుగా లిప్యంతరీకరించింది; ఆరాధనా వస్తువు అని ప్రధాన పాఠ్యంలో నిర్ణయించలేదు.
- source_word: אַרְבַּע מֵאוֹת
  choice: నాలుగువందల మందిని
  rationale: వ్యక్తుల సంఖ్యను సహజమైన తెలుగు లెక్కింపు రూపంలో ఇచ్చింది.
- source_word: אֹכְלֵי שֻׁלְחַן אִיזָבֶל
  choice: యెజెబెలు బల్ల దగ్గర భోజనం చేసేవారు
  rationale: పదబంధంలోని భోజన దృశ్యాన్ని నిలుపుతూ, యెజెబెలు పోషణలో ఉన్నారనే అంతర్లీన రాజపోషణ భావాన్ని అతిగా వివరణ చేయకుండా ఉంచుతుంది.
theological_decisions:
- issue: ఈ వచనంలో אֲשֵׁרָה అర్థం
  choice: దేవత పేరుగా ‘అషేరా’
  alternative: అషేరా దేవతకు సంబంధించిన ఆరాధనా స్తంభం లేదా వస్తువు
  rationale: ‘బయలు ప్రవక్తలు’ అనే సమాంతర పదబంధం ఇక్కడ వ్యక్తీకృత దేవతను సూచించడానికి బలమైన ఆధారం. అయినప్పటికీ పదానికి ఇతర సందర్భాల్లో ఆరాధనా వస్తువు అనే అర్థం ఉండవచ్చని పాదటీపులో తెలియజేసి అస్పష్టతను దాచలేదు.
- issue: ‘ఇశ్రాయేలీయులందరూ’ అనే మాట పరిధి
  choice: జాతి మొత్తాన్ని సూచించే సామూహిక వ్యక్తీకరణగా నిలుపడం
  alternative: ప్రతి ఒక్క ఇశ్రాయేలీయుడు మినహాయింపులేకుండా వ్యక్తిగతంగా హాజరవ్వాలని స్పష్టీకరించడం
  rationale: మూలపాఠ్యం జాతీయ సమూహాన్ని విస్తృతంగా పిలుస్తుంది; అది ప్రతినిధిత్వమా లేక ప్రతి వ్యక్తి హాజరా అన్నదాన్ని అనువాదం అదనంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ఆజ్ఞ యొక్క తక్షణతను నిలిపి, పొడవైన హీబ్రూ వాక్యాన్ని తెలుగులో స్పష్టత కోసం మూడు వాక్యాలుగా విభజించాం. వ్యక్తి పేర్లను ‘ఏలీయా’ అని ప్రధాన పాఠ్యంలో చేర్చకుండా మూలంలోని ‘నా దగ్గరికి’ అనే మొదటి పురుష రూపాన్ని నిలిపాం.
