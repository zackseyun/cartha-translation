  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִי֙ בְּ/הַכְרִ֣ית אִיזֶ֔בֶל אֵ֖ת נְבִיאֵ֣י יְהוָ֑ה וַ/יִּקַּ֨ח עֹבַדְיָ֜הוּ מֵאָ֣ה נְבִאִ֗ים וַֽ/יַּחְבִּיאֵ֞/ם חֲמִשִּׁ֥ים אִישׁ֙ בַּ/מְּעָרָ֔ה וְ/כִלְכְּלָ֖/ם לֶ֥חֶם וָ/מָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/004.yaml
  text: When Jezebel was cutting off the prophets of Yahweh[a], Obadiah took a hundred prophets and hid them, fifty men to a cave[b], and provided them with bread and water.
translation:
  language: te
  text: యెజెబెలు యాహ్వే ప్రవక్తలను నిర్మూలిస్తున్నప్పుడు[a], ఓబద్యా వందమంది ప్రవక్తలను తీసుకొని, వారిని గుహకు యాభై మంది చొప్పున[b] దాచిపెట్టి, వారికి రొట్టెను, నీళ్లను సమకూర్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిర్మూలిస్తున్నప్పుడు’ అని అనువదించిన హీబ్రూ పదానికి మరింత అక్షరార్థంగా ‘నరికివేస్తున్నప్పుడు’ లేదా ‘తొలగిస్తున్నప్పుడు’ అని అర్థం; ఇక్కడ అది ప్రవక్తలను చంపడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘గుహలో యాభై మంది.’ అతడు వారిని యాభైమంది చొప్పున గుంపులుగా, బహుశా వేర్వేరు గుహల్లో, దాచాడని హీబ్రూ వాక్యం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּהַכְרִית
  choice: నిర్మూలిస్తున్నప్పుడు
  rationale: היה తో కూడిన infinitive construct కాలసంబంధ నేపథ్యాన్ని సూచిస్తుంది. כרת యొక్క హిఫిల్ రూపానికి అక్షరార్థంగా ‘నరికివేయడం/తొలగించడం’ అనే భావం ఉన్నా, ఇక్కడ ప్రవక్తలను చంపి నిర్మూలించడాన్ని సూచిస్తుంది. ‘నిర్మూలిస్తున్నప్పుడు’ ఆ సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; అక్షరార్థ చిత్రాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אִיזֶבֶל
  choice: యెజెబెలు
  rationale: వ్యక్తి పేరును ప్రాచుర్యంలో ఉన్న తెలుగు రూపంలో లిప్యంతరీకరించాం.
- source_word: נְבִיאֵי יְהוָה
  choice: యాహ్వే ప్రవక్తలను
  rationale: హీబ్రూ construct chain‌ను సహజమైన తెలుగు సంబంధ నిర్మాణంతో అనువదించాం; దైవనామాన్ని బిరుదుగా మార్చకుండా పేరుగానే ఉంచాం.
- source_word: וַיִּקַּח עֹבַדְיָהוּ
  choice: ఓబద్యా ... తన వెంట తీసుకెళ్లి
  rationale: לקח యొక్క ప్రాథమిక భావమైన ‘తీసుకోవడం’ను నిలుపుతూ, ఈ సందర్భంలో ప్రవక్తలను తన సంరక్షణలోకి తీసుకొని దాచడానికి తీసుకెళ్లాడనే చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: מֵאָה נְבִאִים
  choice: వందమంది ప్రవక్తలను
  rationale: సంఖ్యను, వ్యక్తులను సూచించే తెలుగు లెక్కింపు రూపంతో నేరుగా అనువదించాం.
- source_word: וַיַּחְבִּיאֵם
  choice: వారిని దాచిపెట్టి
  rationale: חבא హిఫిల్ రూపం ‘దాచడం/కనిపించకుండా ఉంచడం’ అని అర్థం; ‘దాచిపెట్టి’ వరుస చర్యలను సహజంగా కలుపుతుంది.
- source_word: חֲמִשִּׁים אִישׁ בַּמְּעָרָה
  choice: గుహకు యాభై మంది చొప్పున
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘గుహలో యాభై మంది’ అని ఉన్నా, వందమందిని యాభైమంది గుంపులుగా గుహల్లో దాచాడనే పంపిణీ భావం సందర్భంలో బలంగా సూచితమవుతుంది. ‘గుహకు ... చొప్పున’ దాన్ని సంక్షిప్తంగా తెలుపుతుంది; రూపపరమైన అస్పష్టతను పాదటిప్పణిలో నమోదు చేశాం.
- source_word: וְכִלְכְּלָם
  choice: అందిస్తూ వారిని పోషించాడు
  rationale: כלכל యొక్క ఈ రూపం నిరంతరం సమకూర్చి పోషించడం అనే భావాన్ని ఇస్తుంది. తరువాత వచ్చే రొట్టె, నీరు రెండింటినీ కలుపుకునేలా ‘అందిస్తూ వారిని పోషించాడు’ అని అనువదించాం.
- source_word: לֶחֶם וָמָיִם
  choice: రొట్టె, నీళ్లు
  rationale: మూలంలోని రెండు స్పష్టమైన జీవనావసరాలను సాధారణ ఆధునిక తెలుగులో నేరుగా ఉంచాం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ ఉచ్చారణకు సమీపమైన ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: యెజెబెలు చర్య తీవ్రత
  choice: ప్రవక్తలను నిర్మూలిస్తున్నప్పుడు
  alternative: ప్రవక్తలను నరికివేస్తున్నప్పుడు / చంపుతున్నప్పుడు
  rationale: כרת లోని ‘నరికివేయడం’ అనే రూపకాన్ని తెలుగులో యాంత్రికంగా ఉంచితే అసహజంగా ఉండవచ్చు; ‘నిర్మూలించడం’ హింసాత్మక తొలగింపును తెలియజేస్తూనే, ఒక్క చర్యకు మించి సాగుతున్న పీడన భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని వాడాం. ‘నీళ్లు’ వంటి సహజ రూపాన్ని ఉపయోగించగా, ‘నిర్మూలించడం,’ ‘పోషించడం’ వంటి పదాలతో వాక్యానికి తగిన గాంభీర్యాన్ని నిలిపాం.
