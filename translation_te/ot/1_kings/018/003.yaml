id: 1KI.18.3
reference: 1 Kings 18:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֣א אַחְאָ֔ב אֶל עֹבַדְיָ֖הוּ אֲשֶׁ֣ר עַל הַ/בָּ֑יִת וְ/עֹבַדְיָ֗הוּ הָיָ֥ה יָרֵ֛א אֶת יְהוָ֖ה מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/003.yaml
  text: And Ahab called Obadiah[a], who was over the household. Now Obadiah feared Yahweh greatly.
translation:
  language: te
  text: అహాబు రాజగృహాన్ని పర్యవేక్షిస్తున్న ఓబద్యాను[a] పిలిచాడు. ఓబద్యా యహ్వేకు ఎంతో భయపడేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజభవన వ్యవహారాల బాధ్యత వహిస్తున్న.” హీబ్రూలో అక్షరార్థంగా “ఇంటి మీద ఉన్న” అని ఉంది; ఇది రాజగృహ వ్యవహారాలను పర్యవేక్షించే ఉన్నత అధికారిని సూచించే పదబంధం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל
  choice: పిలిచాడు
  rationale: קרא + אֶל ఇక్కడ ఓబద్యాను తన దగ్గరకు పిలవడాన్ని సూచిస్తుంది. రాజాజ్ఞ సందర్భంలో ‘పిలిపించాడు’ అనవచ్చుగానీ, హీబ్రూ క్రియ స్వయంగా ఆ బలమైన భావాన్ని తప్పనిసరి చేయదు.
- source_word: עֹבַדְיָהוּ
  choice: ఓబద్యా
  rationale: హీబ్రూ వ్యక్తి పేరును ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: రాజగృహ బాధ్యతలో ఉన్న
  rationale: అక్షరార్థంగా ‘ఇంటి మీద ఉన్న’ అనే ఈ రాజాస్థాన పదబంధం, రాజు గృహం లేదా దాని వ్యవహారాలను పర్యవేక్షించే ఉన్నత అధికారిని సూచిస్తుంది. ‘రాజగృహ బాధ్యతలో ఉన్న’ అనే రూపం బాధ్యతను స్పష్టంగా తెలియజేస్తూ בית యొక్క గృహసంబంధ భావాన్ని నిలుపుతుంది.
- source_word: הָיָה יָרֵא
  choice: భయపడేవాడు
  rationale: ఈ నిర్మాణం ఓబద్యా స్వభావంగా, నిరంతరం యహ్వేకు భయభక్తులు కలిగినవాడని తెలియజేస్తుంది. తెలుగు అలవాటుసూచక రూపం ఆ స్థిర లక్షణాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יָרֵא אֶת יְהוָה
  choice: యహ్వేకు ... భయపడేవాడు
  rationale: దేవుని విషయంగా ירא భయంతో కూడిన భక్తి, గౌరవాన్ని సూచిస్తుంది. ‘భయపడేవాడు’ మూలపదంలోని ఉద్వేగాన్ని మృదువుచేయకుండా నిలుపుతుంది.
- source_word: מְאֹד
  choice: ఎంతో
  rationale: ఈ క్రియావిశేషణం ఓబద్యా భయభక్తి తీవ్రతను బలపరుస్తుంది; ‘ఎంతో’ ఆధునిక తెలుగులో సహజంగా, గంభీరంగా ఉంటుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాకుండా నాలుగు అక్షరాల దైవనామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించిన ఉచ్చారణకు దగ్గరగా ‘యహ్వే’ అని లిప్యంతరీకరించాం.
- issue: יָרֵא అనే పదంలోని భయం–భక్తి ఉద్వేగం
  choice: భయపడేవాడు
  alternative: భక్తితో గౌరవించేవాడు
  rationale: సందర్భంలో భక్తిపూర్వక గౌరవం అంతర్భాగమైనప్పటికీ, కేవలం ‘గౌరవించేవాడు’ అని అనువదిస్తే హీబ్రూ పదంలోని నిజమైన భయ భావం తగ్గిపోతుంది. అందువల్ల మూలంలోని theological tensionను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘రాజగృహం’ పరిపాలనా సంస్థ మరియు రాజు ఇంటివారనే విస్తృత భావాన్ని ఇస్తుంది; ‘రాజభవనం’ అనే మరింత స్థలసూచక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
