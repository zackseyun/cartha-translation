translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. భౌగోళిక పరిధిని ‘మొదలుకొని ... వరకు, ఇంకా ... వరకు’ అని వ్యక్తం చేసి మూలంలోని విస్తృతిని నిలిపాం; నిరంతర పాలనకు ‘పరిపాలిస్తున్నాడు,’ సమకాలిక అధీన చర్యలకు ‘చెల్లిస్తూ’ వాడాం.
