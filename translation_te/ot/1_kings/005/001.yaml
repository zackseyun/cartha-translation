id: 1KI.5.1
reference: 1 Kings 5:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/שְׁלֹמֹ֗ה הָיָ֤ה מוֹשֵׁל֙ בְּ/כָל הַ/מַּמְלָכ֔וֹת מִן הַ/נָּהָר֙ אֶ֣רֶץ פְּלִשְׁתִּ֔ים וְ/עַ֖ד גְּב֣וּל מִצְרָ֑יִם מַגִּשִׁ֥ים מִנְחָ֛ה וְ/עֹבְדִ֥ים אֶת שְׁלֹמֹ֖ה כָּל יְמֵ֥י חַיָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/001.yaml
  text: And Solomon was ruling over all the kingdoms from the River to the land of the Philistines and as far as the border of Egypt[b][a]. They were bringing tribute and serving Solomon all the days of his life.
translation:
  language: te
  text: సొలొమోను నది[a] నుండి ఫిలిష్తీయుల దేశం వరకు, ఇంకా ఐగుప్తు సరిహద్దు వరకు ఉన్న రాజ్యాలన్నిటి మీద పరిపాలించేవాడు. వారు సొలొమోనుకు కప్పం[b] చెల్లించేవారు, అతని జీవితకాలమంతా అతనికి సేవ చేసేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే యూఫ్రటీసు నది.
    reason: cross_reference
  - marker: b
    text: లేదా ‘కానుకలు.’ హీబ్రూ పదం మిన్హా కానుక, అర్పణ లేదా కప్పాన్ని సూచించగలదు; ఇక్కడి రాజకీయ సందర్భం ‘కప్పం’ అనే అర్థానికి అనుకూలంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשֵׁל
  choice: పరిపాలిస్తున్నాడు
  rationale: היה + కర్తరి కృదంతం గతకాలంలో కొనసాగుతున్న పాలనను సూచిస్తుంది; తెలుగులో ఈ రూపం ఆ నిరంతర భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּכָל הַמַּמְלָכוֹת
  choice: రాజ్యాలన్నిటి మీద
  rationale: משלతో వచ్చిన בְ ఇక్కడ ఆధిపత్యాన్ని సూచిస్తుంది; బహువచనం అనేక అధీన రాజ్యాలను నిలుపుతుంది.
- source_word: מִן הַנָּהָר
  choice: నది మొదలుకొని
  rationale: భౌగోళిక సందర్భంలో ఇది యూఫ్రటీసుకు సంప్రదాయ సంక్షిప్త నామం; మూలంలోని ‘నది’ని ప్రధాన పాఠ్యంలో ఉంచి గుర్తింపును పాదటిప్పణిలో ఇచ్చాం.
- source_word: אֶרֶץ פְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల దేశం
  rationale: హీబ్రూ సమాసపదబంధాన్ని స్పష్టంగా, సహజమైన తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: וְעַד גְּבוּל מִצְרָיִם
  choice: ఇంకా ఐగుప్తు సరిహద్దు వరకు
  rationale: ప్రాంత విస్తృతి ఐగుప్తు సరిహద్దు దాకా చేరిందనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מַגִּשִׁים מִנְחָה
  choice: కప్పం చెల్లిస్తూ
  rationale: מִנְחָה కానుక, అర్పణ లేదా కప్పం అనే అర్థాలు కలిగి ఉండగలదు; అధీన రాజ్యాల రాజకీయ సందర్భంలో ‘కప్పం’ సముచితం.
- source_word: וְעֹבְדִים אֶת שְׁלֹמֹה
  choice: అతనికి సేవచేశారు
  rationale: ఉన్నతాధికారికి చేసే సేవ లేదా లోబడిన స్థితిని సూచిస్తుంది; బలవంతపు శ్రమ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: כָּל יְמֵי חַיָּיו
  choice: అతని జీవితకాలమంతా
  rationale: హీబ్రూ నుడికారంలోని సంపూర్ణ కాలవ్యాప్తిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
