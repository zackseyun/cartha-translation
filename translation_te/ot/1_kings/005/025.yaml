source:
  edition: WLC
  text: וּ/שְׁלֹמֹה֩ נָתַ֨ן לְ/חִירָ֜ם עֶשְׂרִים֩ אֶ֨לֶף כֹּ֤ר חִטִּים֙ מַכֹּ֣לֶת לְ/בֵית֔/וֹ וְ/עֶשְׂרִ֥ים כֹּ֖ר שֶׁ֣מֶן כָּתִ֑ית כֹּֽה יִתֵּ֧ן שְׁלֹמֹ֛ה לְ/חִירָ֖ם שָׁנָ֥ה בְ/שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/025.yaml
  text: And Solomon gave Hiram twenty thousand cors of wheat as food for his household[a], and twenty cors of beaten oil[b]. Thus Solomon would give to Hiram year by year.
translation:
  language: te
  text: సొలొమోను హీరాముకు అతని ఇంటివారి ఆహారం కోసం[a] ఇరవై వేల కోర్లు గోధుమలను, ఇరవై కోర్లు నూరి తీసిన నూనెను[b] ఇచ్చాడు. ఈ విధంగా సొలొమోను హీరాముకు ఏటేటా ఇస్తూ వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని రాజగృహానికి సరఫరాగా.’ హెబ్రీయ పదబంధం హీరాము రాజగృహానికి అందించిన ఆహారాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘నూరి తీసిన నూనె’ అంటే ఒలీవ పండ్లను నూరడం లేదా కొట్టడం ద్వారా తీసిన నాణ్యమైన నూనె; తరువాత పిండే విధానంతో తీసిన నూనెకు భిన్నమైనది.
    reason: cultural_note
lexical_decisions:
- source_word: נָתַן / יִתֵּן
  choice: ఇచ్చాడు / ఇస్తూ వచ్చాడు
  rationale: మొదటి క్రియ పూర్తయిన ఏర్పాటును సూచిస్తుండగా, כֹּה మరియు ‘ఏటేటా’తో కూడిన రెండవ క్రియ గతంలో క్రమంగా పునరావృతమైన ఆచరణను సూచిస్తుంది.
- source_word: כֹּר
  choice: కోర్లు
  rationale: ఇది ప్రాచీన కాలంలోని నిర్దిష్ట ఘన/ద్రవ పరిమాణ ప్రమాణం. అస్పష్టమైన ‘కొలతలు’కు బదులు మూల ప్రమాణం పేరును లిప్యంతరీకరించడం ఖచ్చితత్వాన్ని కాపాడుతుంది.
- source_word: חִטִּים
  choice: గోధుమలు
  rationale: ఈ పదం సాధారణ ధాన్యాన్ని కాక ప్రత్యేకంగా గోధుమలను సూచిస్తుంది.
- source_word: מַכֹּלֶת לְבֵיתוֹ
  choice: అతని ఇంటివారి ఆహారం కోసం
  rationale: מַכֹּלֶת అంటే ఆహారం లేదా సరఫరా; לְבֵיתוֹ ఇక్కడ హీరాము రాజగృహానికి చెందినవారిని సూచించే అవకాశం ఉంది. సహజమైన తెలుగులో అర్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: שֶׁמֶן כָּתִית
  choice: దంచి తీసిన నూనె
  rationale: כָּתִית నూనెను నూరడం లేదా దంచడం ద్వారా తీసినదని సూచిస్తుంది. మూలంలో ‘ఒలీవ’ స్పష్టంగా లేనందున ప్రధాన పాఠ్యంలో దాన్ని చేర్చలేదు.
- source_word: כֹּה
  choice: ఈ విధంగా
  rationale: ఇది ముందుగా చెప్పిన పరిమాణాలను తరువాతి వార్షిక ఆచరణతో అనుసంధానిస్తూ విధానాన్ని సూచిస్తుంది.
- source_word: שָׁנָה בְשָׁנָה
  choice: ఏటేటా
  rationale: ఈ హెబ్రీయ విధానం ప్రతి సంవత్సరం క్రమంగా పునరావృతం కావడాన్ని సూచిస్తుంది; ‘ఏటేటా’ సహజమైన, సంక్షిప్తమైన తెలుగు రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ప్రాచీన ప్రమాణమైన ‘కోరు’ను నిలుపుకొని, దాని బహువచనంగా ‘కోర్లు’ వాడాం. చారిత్రక కథనంలోని పునరావృత గత చర్యను ‘ఇస్తూ వచ్చాడు’గా వ్యక్తం చేశాం.
