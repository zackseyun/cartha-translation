- from: కొవ్వబెట్టిన పది పశువులు, మేత మేసిన ఇరవై పశువులు, వంద గొర్రెలు, మేకలు[a]; ఇవిగాక జింకలు, దుప్పులు, అడవి జింకలు[b], కొవ్వబెట్టిన పక్షులు[c].
