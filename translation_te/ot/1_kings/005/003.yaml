  text: עֲשָׂרָ֨ה בָקָ֜ר בְּרִאִ֗ים וְ/עֶשְׂרִ֥ים בָּקָ֛ר רְעִ֖י וּ/מֵ֣אָה צֹ֑אן לְ֠/בַד מֵֽ/אַיָּ֤ל וּ/צְבִי֙ וְ/יַחְמ֔וּר וּ/בַרְבֻּרִ֖ים אֲבוּסִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/003.yaml
  text: ten fattened cattle[a], and twenty pasture-fed cattle, and a hundred sheep[c][b], besides deer and gazelles and roebucks and fattened fowl.
translation:
  language: te
  text: కొవ్వబెట్టిన పది పశువులు, పచ్చిక మేసే ఇరవై పశువులు, వంద గొర్రెలు[c]; ఇవిగాక జింకలు, దుప్పులు, మరో జింకజాతి జంతువులు[a], కొవ్వబెట్టిన పక్షులు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: יַחְמוּר సూచించే జంతువు ఏదో ఖచ్చితంగా తెలియదు; ‘ఫాలో జింకలు’ లేదా ‘రో జింకలు’ అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: בַרְבֻּרִים సూచించే పక్షిజాతి ఖచ్చితంగా తెలియదు; ‘కొవ్వబెట్టిన బాతులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: צֹאן అనే పదం గొర్రెలను మాత్రమే కాక, గొర్రెలు-మేకలతో కూడిన చిన్న పశువుల మందను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָקָר בְּרִאִים
  choice: కొవ్వబెట్టిన పశువులు
  rationale: בקר సమూహార్థకంగా పెద్ద పశువులను సూచిస్తుంది; בְּרִאִים అవి బాగా మేపబడి కొవ్వినవని తెలియజేస్తుంది. ఆహార సరఫరా సందర్భంలో ఈ అనువాదం సహజంగా ఉంటుంది.
- source_word: בָקָר רְעִי
  choice: మేత మేసిన పశువులు
  rationale: רְעִי మేత మేయడం లేదా పచ్చికబయల్లో పెరగడాన్ని సూచిస్తుంది; ముందు పేర్కొన్న ప్రత్యేకంగా కొవ్వబెట్టిన పశువులతో ఉన్న వ్యత్యాసాన్ని ఇది నిలుపుతుంది.
- source_word: צֹאן
  choice: గొర్రెలు, మేకలు
  rationale: צֹאן సాధారణంగా గొర్రెలు, మేకలతో కూడిన చిన్న పశువుల మందను సూచించగలదు. తెలుగులో కేవలం ‘గొర్రెలు’ అని సంకుచితం చేయకుండా భావ పరిధిని స్పష్టంగా ఉంచాం.
- source_word: לְבַד
  choice: ఇవిగాక
  rationale: ముందటి ప్రధాన జాబితికి అదనంగా వచ్చిన వాటిని సంక్షిప్తంగా, సహజంగా పరిచయం చేస్తుంది.
- source_word: אַיָּל
  choice: జింకలు
  rationale: ఈ పదం జింకను, కొన్నిసార్లు ప్రత్యేకంగా మగ జింకను సూచిస్తుంది; ఈ ఆహార జాబితాలో సాధారణ వర్గపదం సరిపోతుంది.
- source_word: צְבִי
  choice: దుప్పులు
  rationale: צְבִי సాధారణంగా గజెల్‌ను సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘దుప్పి’ అందుబాటులో ఉన్న సహజ సమీప పదం.
- source_word: יַחְמוּר
  choice: అడవి జింకలు
  rationale: ఈ జంతువు యొక్క ఖచ్చితమైన జాతి వివాదాస్పదం. ప్రధాన పాఠ్యంలో అతిగా నిర్దిష్టీకరించని విస్తృత పదాన్ని వాడి, అనిశ్చితిని పాదసూచికలో తెలిపాం.
- source_word: בַרְבֻּרִים אֲבוּסִים
  choice: కొవ్వబెట్టిన పక్షులు
  rationale: అవి ఆహారం పెట్టి కొవ్వబెట్టిన పక్షులని పదబంధం సూచిస్తుంది; ఖచ్చితమైన పక్షిజాతి తెలియనందున ‘బాతులు’ లేదా ‘బాతుగూళ్లు’ వంటి అతినిర్దిష్ట పదాన్ని ప్రధాన పాఠ్యంలో నివారించాం.
