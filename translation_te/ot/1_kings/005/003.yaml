translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన జాబితా శైలిని ఉపయోగించాం. హెబ్రీలోని వరుస నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపి, జంతుజాతుల విషయంలో ఉన్న నిజమైన నిఘంటు అనిశ్చితిని పాదసూచికల్లో భద్రపరిచాం.
