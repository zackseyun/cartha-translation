  text: וַ/יֵּשֶׁב֩ יְהוּדָ֨ה וְ/יִשְׂרָאֵ֜ל לָ/בֶ֗טַח אִ֣ישׁ תַּ֤חַת גַּפְנ/וֹ֙ וְ/תַ֣חַת תְּאֵֽנָת֔/וֹ מִ/דָּ֖ן וְ/עַד בְּאֵ֣ר שָׁ֑בַע כֹּ֖ל יְמֵ֥י שְׁלֹמֹֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/005.yaml
  text: And Judah and Israel lived in safety[a], each man under his vine and under his fig tree, from Dan to Beer-sheba[b], all the days of Solomon.
translation:
  language: te
  text: సొలొమోను కాలమంతా, దాను నుండి బెయేర్షెబా వరకు యూదా, ఇశ్రాయేలు ప్రజలు సురక్షితంగా నివసించారు; ప్రతి పురుషుడు[a] తన ద్రాక్షావల్లి కింద, తన అంజూరపు చెట్టు కింద[b] ఉండేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతి ఒక్కరూ.” హీబ్రూ పాఠంలో పుంలింగ ఏకవచనమైన “పురుషుడు” అనే పదం ఒక్కొక్కరిని సూచించే విధంగా వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: “తన ద్రాక్షావల్లి కింద, తన అంజూరపు చెట్టు కింద” ఉండడం దేశంలో శాంతి, భద్రత, సమృద్ధి ఉన్నాయని సూచించే సంప్రదాయ రూపకం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: నివసించారు / ఉండేవాడు
  rationale: మూల క్రియకు ‘కూర్చున్నాడు’ అనే అక్షరార్థం ఉన్నప్పటికీ, לָבֶטַחతో కూడిన ఈ సందర్భంలో స్థిరంగా, క్షేమంగా నివసించడమే భావం. తెలుగు వాక్య నిర్మాణంలో సామూహిక అంశానికీ, పంపిణీ అర్థంలోని వ్యక్తికీ సహజంగా సరిపడేలా ఈ రెండు రూపాలు వాడబడ్డాయి.
- source_word: יְהוּדָה וְיִשְׂרָאֵל
  choice: యూదావారు, ఇశ్రాయేలువారు
  rationale: హీబ్రూలో పేరుపొందిన రెండు రాజకీయ-ప్రజా సమూహాలను సాధారణీకరించకుండా నిలుపుతూ, అవి నివసించాయని తెలుగులో సహజంగా చెప్పడానికి ‘వారు’ రూపం ఎంచుకోబడింది.
- source_word: לָבֶטַח
  choice: సురక్షితంగా
  rationale: భయం లేదా దాడి లేకుండా క్షేమంగా నివసించే స్థితిని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אִישׁ
  choice: ప్రతి పురుషుడు
  rationale: మూలంలో పుంలింగ ఏకవచనమైన ‘మనిషి/పురుషుడు’ పంపిణీ అర్థంలో ఉంది. దాని వ్యాకరణ రూపాన్ని నిలుపుతూ ‘ప్రతి పురుషుడు’ అని అనువదించబడింది.
- source_word: תַּחַת גַּפְנוֹ וְתַחַת תְּאֵנָתוֹ
  choice: తన ద్రాక్షతీగ కింద, తన అంజూరపు చెట్టు కింద
  rationale: శాంతి, భద్రత, సమృద్ధిని సూచించే మూల రూపకాన్ని వివరణగా మార్చకుండా యథాతథంగా నిలుపుతుంది.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: దాను మొదలుకొని బెయేర్షెబా వరకు
  rationale: దేశపు ఉత్తర-దక్షిణ విస్తీర్ణమంతటినీ సూచించే భౌగోళిక జంటను స్థలపేర్లతోనే నిలుపుతుంది.
- source_word: כֹּל יְמֵי שְׁלֹמֹה
  choice: సొలొమోను కాలమంతా
  rationale: ఈ స్థితి సొలొమోను పాలనా కాలమంతా కొనసాగిందనే వ్యవధిని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: పంపిణీ అర్థంలోని పుంలింగ אִישׁ అనువాదం
  choice: ప్రతి పురుషుడు
  alternative: ప్రతి ఒక్కరూ
  rationale: మూలంలోని పుంలింగ ఏకవచన రూపాన్ని చెరపకుండా ఉంచుతుంది; అదే సమయంలో అది ఒక్క వ్యక్తిని కాక ప్రజలలో ఒక్కొక్కరిని సూచిస్తోందని పాదటిప్పణి వివరిస్తుంది.
- issue: ‘తన ద్రాక్షతీగ కింద, తన అంజూరపు చెట్టు కింద’ అనే సమృద్ధి రూపకం
  choice: ప్రధాన పాఠ్యంలో మూల చిత్రణను నిలుపడం
  alternative: శాంతి, భద్రత, సమృద్ధితో జీవించాడు అని భావానువాదం చేయడం
  rationale: ఈ సాంస్కృతిక రూపకంలోని సాహిత్య, అంతర్వచన బలాన్ని నిలుపుతూ, దాని భావాన్ని పాదటిప్పణిలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. పొడవైన హీబ్రూ వాక్యాన్ని మూడు అనుసంధానిత తెలుగు వాక్యాలుగా విభజించినా, దాని భౌగోళిక విస్తృతి, వ్యక్తిగత భద్రతా చిత్రం, కాలవ్యవధి అన్నీ నిలుపబడ్డాయి.
