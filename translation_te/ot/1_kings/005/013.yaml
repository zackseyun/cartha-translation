  text: וַ/יְדַבֵּר֮ עַל הָֽ/עֵצִים֒ מִן הָ/אֶ֨רֶז֙ אֲשֶׁ֣ר בַּ/לְּבָנ֔וֹן וְ/עַד֙ הָ/אֵז֔וֹב אֲשֶׁ֥ר יֹצֵ֖א בַּ/קִּ֑יר וַ/יְדַבֵּר֙ עַל הַ/בְּהֵמָ֣ה וְ/עַל הָ/ע֔וֹף וְ/עַל הָ/רֶ֖מֶשׂ וְ/עַל הַ/דָּגִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/013.yaml
  text: He spoke about the trees[a], from the cedar that is in Lebanon to the hyssop that grows out of the wall; he also spoke about the animals and the birds and the creeping things and the fish.
translation:
  language: te
  text: అతడు చెట్ల గురించి మాట్లాడాడు—లెబానోనులోని దేవదారు చెట్టు మొదలుకొని గోడలోనుంచి మొలిచే హిస్సోపు[a] వరకు. అలాగే జంతువుల గురించి, పక్షుల గురించి, నేలపై పాకే జీవుల గురించి, చేపల గురించి కూడా మాట్లాడాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక చిన్న సుగంధ మొక్క.’ హెబ్రీ אֵזוֹב అనే మొక్కను ఖచ్చితంగా గుర్తించడం అనిశ్చితం; ‘హిస్సోపు’ అనేది సాంప్రదాయ అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר עַל
  choice: గురించి మాట్లాడాడు
  rationale: דבר తో עַל కలిసినప్పుడు ఒక విషయం గురించి మాట్లాడడం అనే భావం వస్తుంది. సాంకేతికంగా బోధించాడు లేదా వర్ణించాడు అని అధికంగా నిర్ధారించకుండా మూలార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הָעֵצִים
  choice: చెట్లు
  rationale: ఇక్కడ దేవదారు నుంచి హిస్సోపు వరకు వృక్షజాతుల పరిధిని సూచిస్తున్నందున ‘చెట్లు’ సందర్భానికి సరిపోతుంది; అయితే చివరి అంచుగా చిన్న మొక్క ఉండడం వల్ల హెబ్రీ వర్గీకరణ విస్తృతి అలాగే నిలుస్తుంది.
- source_word: הָאֶרֶז אֲשֶׁר בַּלְּבָנוֹן
  choice: లెబానోనులోని దేవదారు చెట్టు
  rationale: אֶרֶז లెబానోనుతో ప్రసిద్ధిగా అనుసంధానమైన దేవదారును సూచిస్తుంది. సంబంధవాక్యాన్ని తెలుగులో సహజమైన విశేషణ నిర్మాణంగా మార్చాం.
- source_word: מִן ... וְעַד
  choice: మొదలుకొని ... వరకు
  rationale: గొప్ప దేవదారు నుంచి చిన్న గోడమొక్క వరకు ఉన్న సమగ్ర పరిధిని సూచించే హెబ్రీ నిర్మాణాన్ని సహజంగా నిలుపుతుంది.
- source_word: הָאֵזוֹב
  choice: హిస్సోపు
  rationale: సాంప్రదాయ అనువాదాన్ని ప్రధాన పాఠ్యంలో ఉంచాం; ఖచ్చితమైన వృక్షశాస్త్రీయ గుర్తింపు అనిశ్చితమైనందున దానిని పాదసూచికలో తెలిపాం.
- source_word: יֹצֵא בַּקִּיר
  choice: గోడలోనుంచి మొలిచే
  rationale: పదశః ‘గోడలోనుంచి బయటకు వచ్చేది’; వృక్ష సందర్భంలో ‘మొలిచే’ అనేది చిత్రణను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הַבְּהֵמָה
  choice: జంతువులు
  rationale: పక్షులు, పాకే జీవులు, చేపలతో కూడిన వర్గాల జాబితాలో ఇది పశువులకు మాత్రమే పరిమితం కాని విస్తృత జంతువర్గాన్ని సూచించడం సముచితం.
- source_word: הָעוֹף
  choice: పక్షులు
  rationale: ఎగిరే జీవులను సూచించగల పదమైనా, ఈ వర్గీకరణ సందర్భంలో ‘పక్షులు’ సహజమైన సాధారణ అర్థం.
- source_word: הָרֶמֶשׂ
  choice: నేలపై పాకే జీవులు
  rationale: ‘సరీసృపాలు’ అని పరిమితం చేయకుండా, పాకే లేదా ప్రాకే జీవుల విస్తృత హెబ్రీ వర్గాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַדָּגִים
  choice: చేపలు
  rationale: సాధారణ జీవవర్గ జాబితాలోని דָּגִים కు సహజమైన తెలుగు బహువచనం.
