source:
  edition: WLC
  text: וְ/כִלְכְּלוּ֩ הַ/נִּצָּבִ֨ים הָ/אֵ֜לֶּה אֶת הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה וְ/אֵ֧ת כָּל הַ/קָּרֵ֛ב אֶל שֻׁלְחַ֥ן הַ/מֶּֽלֶךְ שְׁלֹמֹ֖ה אִ֣ישׁ חָדְשׁ֑/וֹ לֹ֥א יְעַדְּר֖וּ דָּבָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/007.yaml
  text: These deputies provided for King Solomon and for all who came near the table of King Solomon[a], each in his month[b]; they lacked nothing.
translation:
  language: te
  text: ఈ నియమిత అధికారులు[a] రాజైన సొలొమోనుకు, రాజైన సొలొమోను బల్ల దగ్గరకు వచ్చేవారందరికీ[b] అవసరమైనవి సమకూర్చారు. ప్రతి ఒక్కరూ తన నెలలో[c] బాధ్యత వహించారు; వారికి దేనికీ కొరత లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నియమిత అధికారులు’ అనే మాటకు ‘ప్రతినిధులు,’ ‘పరిపాలకులు’ లేదా ‘అధికారులు’ అని కూడా అనువదించవచ్చు. హీబ్రూ పదం జిల్లాలపై నియమించబడిన పరిపాలకులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “రాజైన సొలొమోను బల్ల దగ్గరకు వచ్చేవారందరికీ.” ఇది రాజభోజన బల్లకు ప్రవేశం ఉన్నవారిని సూచించే ప్రయోగం.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “ప్రతి ఒక్కరూ తన నెలలో”; అంటే అధికారులు నెలవారీ వంతుల ప్రకారం సరఫరా బాధ్యత వహించారు.
    reason: clarification
lexical_decisions:
- source_word: וְכִלְכְּלוּ
  choice: కావలసిన సరఫరాలు సమకూర్చేవారు
  rationale: פיעל రూపంలోని כלכל ఇక్కడ రాజసంబంధ పరిపాలనా సందర్భంలో అవసరమైన ఆహారం, పోషణ సామగ్రి మొదలైనవాటిని సమకూర్చడాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో సహజంగా ఉండేలా, అవసరానికి మించి విధానాన్ని నిర్దిష్టం చేయకుండా ఈ పదబంధాన్ని ఎంచుకున్నాం.
- source_word: הַנִּצָּבִים
  choice: నియమిత అధికారులు
  rationale: ఈ పదం జిల్లాలపై నియమించబడిన, రాజుకు ప్రతినిధులుగా పరిపాలనా బాధ్యత నిర్వహించే అధికారులను సూచిస్తుంది. ‘అధికారులు’ మాత్రమే అన్నదానికంటే ‘నియమిత అధికారులు’ మూలంలోని నియామక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְאֵת כָּל הַקָּרֵב אֶל שֻׁלְחַן הַמֶּלֶךְ שְׁלֹמֹה
  choice: రాజైన సొలొమోను బల్ల దగ్గరకు వచ్చే వారందరికీ
  rationale: הַקָּרֵב అనే కృదంతం ‘దగ్గరకు వచ్చేవారు’ అనే మూల చిత్రాన్ని నిలుపుతుంది. సందర్భంలో ఇది రాజభోజన బల్లకు ప్రవేశం ఉన్నవారిని లేదా అక్కడ భోజనం చేసేవారిని సూచించవచ్చు; అనువాదం ఆ రెండు భావాల మధ్య ఉన్న విస్తృతిని కాపాడుతుంది.
- source_word: אִישׁ חָדְשׁוֹ
  choice: ఒక్కొక్కరు తమ తమ నెలలో బాధ్యత వహించేవారు
  rationale: అక్షరార్థంగా ‘ఒక్కొక్కరు తన నెలలో’ అనే ఈ ప్రయోగం అధికారుల నెలవారీ వంతును సూచిస్తుంది. తెలుగులో ఆ పరిపాలనా భావం సహజంగా అర్థమయ్యేలా ‘బాధ్యత వహించేవారు’ అని వ్యక్తం చేశాం.
- source_word: לֹא יְעַדְּרוּ דָּבָר
  choice: వారు దేనికీ లోటు రానివ్వలేదు
  rationale: עדר ఇక్కడ ఏదైనా లేకపోవడం లేదా కొరతపడడం అనే భావాన్ని ఇస్తుంది. అవసరమైన సరఫరాల్లో ఏదీ లోటు కాలేదనే ఫలితాన్ని ఈ తెలుగు రూపం సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, అయితే రాజపరిపాలనా సందర్భానికి తగిన గౌరవప్రదమైన శైలిలో అనువదించబడింది. హీబ్రూ మూలంలోని రాజబల్ల చిత్రం నిలుపబడింది; నెలవారీ వంతు భావం సహజమైన తెలుగులో స్పష్టం చేయబడింది.
