  text: And Solomon had seventy thousand burden-bearers[a], and eighty thousand stonecutters in the mountains.
translation:
  language: te
  text: సొలొమోనుకు బరువులు మోసేవారు డెబ్బై వేల మంది, కొండ ప్రాంతంలో రాళ్లను చెక్కేవారు ఎనభై వేల మంది ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: సొలొమోనుకు ... ఉన్నారు
  rationale: היה + ל నిర్మాణం ఉనికితో కూడిన స్వామ్యాన్ని సూచిస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో ‘సొలొమోనుకు ... ఉన్నారు’ అని చెప్పడం మూల భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: שִׁבְעִים אֶלֶף
  choice: డెబ్బై వేల మంది
  rationale: సంఖ్యను నేరుగా అనువదించి, వ్యక్తులను లెక్కిస్తున్నందున సహజమైన తెలుగు కోసం ‘మంది’ చేర్చబడింది.
- source_word: נֹשֵׂא סַבָּל
  choice: బరువులు మోసేవారు
  rationale: నామవాచకార్థ participle ‘మోసేవారు’ మరియు ‘బరువు/లోడు’ అనే పదాల కలయికను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; సాధారణ కూలీలకంటే వారి ప్రత్యేక పనిని నిలుపుతుంది.
- source_word: וּשְׁמֹנִים אֶלֶף
  choice: ఎనభై వేల మంది
  rationale: సంఖ్యను నేరుగా అనువదించి, వ్యక్తుల సూచనకు ‘మంది’ చేర్చబడింది.
- source_word: חֹצֵב
  choice: రాళ్లు తొలిచేవారు
  rationale: חצב అంటే రాయిని కోయడం లేదా తవ్వి వెలికితీయడం. నిర్మాణ సందర్భంలో ‘రాళ్లు తొలిచేవారు’ అనేది అంతర్లీన కర్మను స్పష్టపరుస్తూ గనిపని భావాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: בָּהָר
  choice: కొండ ప్రాంతంలో
  rationale: ఏకవచన הַר ఇక్కడ భౌగోళికంగా సమూహార్థంలో ఉండవచ్చు. ‘కొండ ప్రాంతంలో’ అనేది ఆ స్థలార్థాన్ని సహజంగా అందిస్తూ, తప్పనిసరిగా ఒకే నిర్దిష్ట కొండ అని నిర్ణయించదు.
