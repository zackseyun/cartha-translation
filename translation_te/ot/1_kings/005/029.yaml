translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే పదజాలం. హెబ్రీ వాక్యంలోని సంఖ్యలు, రెండు కార్మిక వర్గాలు, భౌగోళిక సూచన అన్నీ నిలుపబడ్డాయి.
