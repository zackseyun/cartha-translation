  text: But now Yahweh my God has given me rest on every side[b][a]; there is neither adversary nor evil occurrence.
translation:
  language: te
  text: కానీ ఇప్పుడు నా దేవుడైన యహ్వే చుట్టుపక్కల నుండీ నాకు విశ్రాంతి కలిగించాడు; విరోధి[a] లేడు, హానికరమైన సంఘటన[b] ఏదీ లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రత్యర్థి.” ఇక్కడి హీబ్రూ పదం שָׂטָן సాధారణ నామవాచకం; అది తప్పనిసరిగా “సాతాను” అనే వ్యక్తినామం కాదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “దుర్ఘటన,” “విపత్తు,” లేదా “ఆపద.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: కానీ ఇప్పుడు
  rationale: మునుపటి పరిస్థితులకు ఇప్పటి స్థితికి మధ్య ఉన్న వ్యత్యాసాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הֵנִיחַ ... לִי
  choice: నాకు ... విశ్రాంతి కలిగించాడు
  rationale: נוח అనే ధాతువు హిఫీల్ రూపంలోని కారణార్థాన్ని నిలుపుతూ, లִי సూచించే లబ్ధిదారుని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ నాలుగు అక్షరాల నామానికి తెలుగు లిప్యంతరీకరణగా ఉంచుతుంది.
- source_word: אֱלֹהַי
  choice: నా దేవుడైన
  rationale: మొదటి పురుష ఏకవచన స్వామ్యార్థాన్ని తెలుగులో సహజంగా, యహ్వేతో ఉన్న సంబంధాన్ని స్పష్టంగా తెలియజేసేలా అందిస్తుంది.
- source_word: מִסָּבִיב
  choice: అన్ని వైపులా
  rationale: చుట్టుపక్కల ఉన్న బెదిరింపులన్నిటి నుండి లభించిన విశ్రాంతిని సూచించే సహజమైన తెలుగు వ్యక్తీకరణ.
- source_word: שָׂטָן
  choice: విరోధి
  rationale: ఇక్కడ ఈ పదం వ్యక్తినామంగా కాక రాజకీయ లేదా సైనిక ప్రతిపక్షిని సూచించే సాధారణ నామవాచకంగా ఉంది.
- source_word: פֶּגַע רָע
  choice: కీడు కలిగించే సంఘటన
  rationale: హానికరమైన ఘటన, విపత్తు లేదా దురదృష్టం అనే విస్తృత భావాన్ని నిలుపుతుంది; దానిని కేవలం నైతిక కీడుగా గానీ ప్రకృతి విపత్తుగా గానీ పరిమితం చేయదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా ప్రత్యక్షంగా సూచిస్తుంది.
- issue: שָׂטָן వ్యక్తినామమా, సాధారణ నామవాచకమా
  choice: విరోధి అనే సాధారణ నామవాచకం
  alternative: సాతాను అనే వ్యక్తినామం
  rationale: తక్షణ సందర్భం రాజకీయ శాంతి, ప్రతిఘటన లేకపోవడం గురించి మాట్లాడుతోంది; వ్యక్తిగత దుష్టాత్మను ఈ వాక్యం నిర్దేశించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం. హీబ్రూ వాక్యంలోని రెండు నిరాకరణలను స్పష్టంగా ఉంచి, פֶּגַע רָע యొక్క విస్తృత భావాన్ని ప్రధాన పాఠం మరియు పాదటిప్పణి ద్వారా కాపాడింది.
