source:
  edition: WLC
  text: וַ/יְהִ֣י לִ/שְׁלֹמֹ֗ה אַרְבָּעִ֥ים אֶ֛לֶף אֻרְוֺ֥ת סוּסִ֖ים לְ/מֶרְכָּב֑/וֹ וּ/שְׁנֵים עָשָׂ֥ר אֶ֖לֶף פָּרָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/006.yaml
  text: And Solomon had forty thousand stalls of horses for his chariots[a], and twelve thousand horsemen.
translation:
  language: te
  text: సొలొమోనుకు తన రథాల కోసం నలభై వేల గుర్రపు కొట్టాలు[a] ఉండేవి; పన్నెండు వేల గుర్రపు రౌతులు ఉండేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గుర్రాల శాలలు.” హెబ్రీ పదం మరింత నిర్దిష్టంగా గుర్రాలను ఉంచే విడివిడి కొట్టాలను లేదా వాటికి మేత పెట్టే స్థలాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: సొలొమోనుకు ... ఉండేవి/ఉండేవారు
  rationale: ‘ఉండడం + לְ స్వామి’ అనే హెబ్రీ నుడికారంలో స్వామ్య భావం ఉంది. తెలుగులో ‘సొలొమోనుకు ... ఉండేవి/ఉండేవారు’ అని చెప్పడం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אַרְבָּעִים אֶלֶף
  choice: నలభై వేల
  rationale: మూలంలోని సంఖ్యను నేరుగా అనువదించింది.
- source_word: אֻרְוֺת
  choice: గుర్రపు కొట్టాలు
  rationale: ఈ పదం సాధారణంగా మొత్తం అశ్వశాల భవనాన్ని కాక, గుర్రాలను విడివిడిగా ఉంచే లేదా వాటికి మేత పెట్టే కొట్టాలను సూచిస్తుంది. ‘కొట్టాలు’ ఆధునిక సాధారణ తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: סוּסִים
  choice: గుర్రపు
  rationale: ‘గుర్రాలు’ అనే నామవాచకాన్ని ‘కొట్టాలు’తో సహజంగా కలపడానికి తెలుగులో విశేషణ రూపంగా వాడింది.
- source_word: לְמֶרְכָּבוֹ
  choice: తన రథాల కోసం
  rationale: ఏకవచన రూపం ఇక్కడ సొలొమోను రథబలాన్ని సమష్టిగా సూచిస్తుంది. ‘తన’ అనే పదం ప్రత్యయ సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף
  choice: పన్నెండు వేల
  rationale: మూలంలోని సంఖ్యా పదబంధాన్ని నేరుగా అనువదించింది.
- source_word: פָּרָשִׁים
  choice: గుర్రపు రౌతులు
  rationale: ఈ పదం సాధారణంగా గుర్రాలపై స్వారీ చేసే సైనికులను సూచిస్తుంది. ‘గుర్రపు రౌతులు’ ఆ సైనిక భావాన్ని తెలుగులో సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన స్వామ్య నిర్మాణం వాడబడింది. జడవాచకమైన ‘కొట్టాలు’కు, వ్యక్తులను సూచించే ‘రౌతులు’కు తగిన వేర్వేరు క్రియారూపాలు ఇవ్వడానికి వాక్యాన్ని అర్థవిరామంతో రెండు సమాంతర భాగాలుగా నిర్మించాం. భాష సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, వచన గంభీరతను నిలుపుతుంది.
