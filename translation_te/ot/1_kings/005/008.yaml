source:
  edition: WLC
  text: וְ/הַ/שְּׂעֹרִ֣ים וְ/הַ/תֶּ֔בֶן לַ/סּוּסִ֖ים וְ/לָ/רָ֑כֶשׁ יָבִ֗אוּ אֶל הַ/מָּקוֹם֙ אֲשֶׁ֣ר יִֽהְיֶה שָּׁ֔ם אִ֖ישׁ כְּ/מִשְׁפָּטֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/008.yaml
  text: And the barley and the straw for the horses and the steeds were brought to the place where each man was[b][a], according to his duty.
translation:
  language: te
  text: గుర్రాలకు, ప్రత్యేక స్వారీ జంతువులకు[a] యవలను, ఎండుగడ్డిని వారు ప్రతి వ్యక్తి[b] ఉన్న చోటుకు, అతనికి నిర్దేశించిన విధానం ప్రకారం తీసుకువచ్చేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘స్వారీ గుర్రాల కోసం’; హెబ్రీ పదం ప్రత్యేకంగా ఎంపిక చేసిన స్వారీ జంతువులను సూచించవచ్చు; వాటిలో కంచరగాడిదలు లేదా రథపు గుర్రాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో, ‘ఒక్కొక్క మనిషి’; ఇక్కడ ప్రతి బాధ్యతగల వ్యక్తిని విడివిడిగా సూచించే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׂעֹרִים
  choice: యవలను
  rationale: ఈ సరఫరా సందర్భంలో שְׂעֹרִים జంతువుల మేతగా ఉపయోగించే యవలను సూచిస్తుంది.
- source_word: וְהַתֶּבֶן
  choice: గడ్డిని
  rationale: תֶּבֶן ధాన్యపు ఎండు కాండాలు లేదా పశుగ్రాసంగా వాడే గడ్డిని సూచిస్తుంది; ఆధునిక సాధారణ తెలుగులో ‘గడ్డి’ సహజంగా అర్థమవుతుంది.
- source_word: לַסּוּסִים
  choice: గుర్రాల కోసం
  rationale: ఉపసర్గతో కూడిన סוּסִיםకు నేరమైన, సహజమైన అనువాదం.
- source_word: וְלָרָכֶשׁ
  choice: శ్రేష్ఠమైన స్వారీ జంతువుల కోసం
  rationale: רֶכֶשׁ రాజసంబంధ సందర్భాల్లో ప్రత్యేకంగా ఎంపిక చేసిన స్వారీ జంతువులను సూచించవచ్చు; జాతిని ఖచ్చితంగా నిర్ణయించకుండా భావాన్ని నిలుపుతుంది.
- source_word: יָבִיאוּ
  choice: తీసుకొచ్చేవారు
  rationale: క్రియ రూపం క్రియాశీల బహువచనం; పరిపాలనా సరఫరా క్రమంలో పునరావృత చర్యను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶל־הַמָּקוֹם אֲשֶׁר יִהְיֶה שָּׁם אִישׁ
  choice: ప్రతి ఒక్కరు తాము ఉన్న చోటికి
  rationale: אִישׁను పంపిణీయ అర్థంలో తీసుకొని, ప్రతి బాధ్యతగల వ్యక్తి ఉన్న ప్రదేశానికి సరఫరా చేరిందనే భావాన్ని సహజంగా తెలుపుతుంది.
- source_word: כְּמִשְׁפָּטוֹ
  choice: తమకు నిర్దేశించిన ప్రకారం
  rationale: ఇక్కడ מִשְׁפָּט న్యాయతీర్పు కంటే నిర్ణయించబడిన విధి, వాటా లేదా క్రమాన్ని సూచిస్తుంది; వీటిలో ఒక్కదానికే అతిగా పరిమితం కాకుండా పరిపాలనా భావాన్ని నిలుపుతుంది.
