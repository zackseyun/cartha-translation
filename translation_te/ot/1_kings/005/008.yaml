revisions:
- from: గుర్రాల కోసం, శ్రేష్ఠమైన స్వారీ జంతువుల కోసం[a] యవలను, గడ్డిని, ప్రతి ఒక్కరు[b] తాము ఉన్న చోటికి తమకు నిర్దేశించిన ప్రకారం తీసుకొచ్చేవారు.
  to: గుర్రాలకు, ప్రత్యేక స్వారీ జంతువులకు[a] యవలను, ఎండుగడ్డిని వారు ప్రతి వ్యక్తి[b] ఉన్న చోటుకు, అతనికి నిర్దేశించిన విధానం ప్రకారం తీసుకువచ్చేవారు.
  rationale: ఎండుగడ్డి ద్వారా తֶבֶן యొక్క ‘straw’ అర్థాన్ని స్పష్టంగా చేశాము. ప్రతి వ్యక్తి ఉన్న చోటుకు అని మార్చి, సరఫరా తెచ్చినవారికీ సరఫరా అందుకొనే బాధ్యతగల వ్యక్తులకీ మధ్య ఉన్న భేదాన్ని స్పష్టపరచాము. రֶכֶשׁకు సంబంధించి వివాదాస్పద జాతి-గుర్తింపును ప్రధాన పాఠంలో నివారించి, ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఉంచాము.
  reviewer_model: gpt-5.6-terra
