translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే నిర్మాణ పదజాలం వాడబడింది. హీబ్రూ వాక్యంలోని రాళ్ల మూడు వరుస వర్ణనలను డాష్‌ల మధ్య పునరుక్తితో నిలిపి, తెలుగులో సహజంగా చదవబడేలా చేశాం.
