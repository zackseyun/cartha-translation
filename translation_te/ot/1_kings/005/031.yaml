revisions:
- from: అప్పుడు రాజు ఆజ్ఞాపించాడు; వారు ఆ గృహానికి[b] పునాది వేయడానికి భారీ రాళ్లను—విలువైన, చెక్కి సిద్ధం చేసిన రాళ్లను[a]—గనుల నుండి వెలికితీశారు.
  to: అప్పుడు రాజు ఆజ్ఞాపించాడు; వారు ఆ గృహానికి[b] పునాది వేయడానికి పెద్ద రాళ్లను, విలువైన రాళ్లను, చెక్కిన రాళ్లను[a] తీయించారు.
  rationale: The revision removes the unsupported explicit reference to mines, renders the size adjective more precisely as “పెద్ద,” and presents all three Hebrew stone descriptions as a parallel series. “తీయించారు” retains the causative/extractive force of וַיַּסִּעוּ without overcommitting to a specific extraction site or method.
