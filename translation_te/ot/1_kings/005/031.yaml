id: 1KI.5.31
reference: 1 Kings 5:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ וַ/יַּסִּעוּ֩ אֲבָנִ֨ים גְּדֹל֜וֹת אֲבָנִ֧ים יְקָר֛וֹת לְ/יַסֵּ֥ד הַ/בָּ֖יִת אַבְנֵ֥י גָזִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/031.yaml
  text: Then the king commanded[a], and they quarried great stones, costly stones, cut stones[b], to lay the foundation of the house.
translation:
  language: te
  text: అప్పుడు రాజు ఆజ్ఞాపించాడు; వారు ఆ గృహానికి[b] పునాది వేయడానికి పెద్ద రాళ్లను, విలువైన రాళ్లను, చెక్కిన రాళ్లను[a] తీయించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తయారుచేసిన రాళ్లు.’
    reason: lexical_alternative
  - marker: b
    text: అంటే ఆలయం; హీబ్రూ మూలంలో ‘గృహం’ అని ఉంది.
    reason: contextual_clarification
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: అప్పుడు రాజు ఆజ్ఞాపించాడు
  rationale: వావ్-క్రమకథన రూపం తదుపరి చర్యను సూచిస్తుంది. ‘అప్పుడు’ కథన పురోగతిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘ఆజ్ఞాపించాడు’ צוה యొక్క ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది.
- source_word: וַיַּסִּעוּ
  choice: వారు ... గనుల నుండి వెలికితీశారు
  rationale: נסע యొక్క causative రూపం సాధారణంగా కదిలించడం లేదా పెకలించడం అనే భావాన్ని కలిగిస్తుంది. నిర్మాణానికి రాళ్లు సమకూర్చే సందర్భంలో వాటిని రాతిగని నుండి వెలికితీయడం ఉద్దేశిత భావం; ‘గనుల నుండి’ అనేది తెలుగులో ఆ భావాన్ని స్పష్టం చేసే సందర్భానుగుణ పూరకం.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: భారీ రాళ్లు
  rationale: ఇక్కడ ‘భారీ’ రాళ్ల గొప్ప పరిమాణాన్ని, నిర్మాణ సందర్భానికి తగిన బరువును సహజంగా తెలియజేస్తుంది.
- source_word: אֲבָנִים יְקָרוֹת
  choice: విలువైన రాళ్లు
  rationale: יקר విలువైనవి లేదా ఖరీదైనవి అనే భావం ఇస్తుంది. ‘విలువైన’ అనేది ఇవి రత్నాలని అనవసరంగా సూచించకుండా వాటి అధిక నాణ్యత లేదా వ్యయాన్ని తెలియజేస్తుంది.
- source_word: לְיַסֵּד
  choice: పునాది వేయడానికి
  rationale: నిర్మాణ సందర్భంలో יסד పునాది స్థాపించడాన్ని సూచిస్తుంది; ‘పునాది వేయడం’ ప్రస్తుత తెలుగులో సహజమైన నిర్మాణ ప్రయోగం.
- source_word: הַבַּיִת
  choice: ఆ గృహం
  rationale: మూలంలోని ‘గృహం’ అనే పదప్రయోగాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భంలో అది ఆలయాన్ని సూచిస్తుందని పాదసూచికలో స్పష్టం చేశాం.
- source_word: אַבְנֵי גָזִית
  choice: చెక్కి సిద్ధం చేసిన రాళ్లు
  rationale: גזית రాతిగని నుండి తీసిన తరువాత చెక్కి లేదా మలిచి నిర్మాణానికి సిద్ధం చేసిన రాళ్లను సూచిస్తుంది. ఈ పదబంధం ఆధునిక పాఠకులకు స్పష్టంగా ఉండి, ‘చెక్కిన రాళ్లు’ అనే సంక్షిప్త ప్రత్యామ్నాయ భావాన్నీ పాదసూచికలో ఇస్తుంది.
