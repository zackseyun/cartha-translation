base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/015.yaml
  text: Then Hiram king of Tyre sent his servants to Solomon[a], because he had heard that they had anointed him king in place of his father, for Hiram had always loved David.
translation:
  language: te
  text: తూరు రాజైన హీరాము తన సేవకులను సొలొమోను దగ్గరికి పంపించాడు. ఎందుకంటే, అతని తండ్రి స్థానంలో అతన్ని రాజుగా అభిషేకించారని హీరాము విన్నాడు. హీరాము దావీదును ఎల్లప్పుడూ ప్రేమించేవాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హీరాము దావీదుకు అన్ని రోజులూ స్నేహితుడిగా ఉండేవాడు.” హెబ్రీ వాక్యం అక్షరార్థంగా, “హీరాము దావీదును అన్ని రోజులూ ప్రేమించేవాడు” అని ఉంది; ఇది చాలాకాలం కొనసాగిన అనుకూల సంబంధాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపించాడు
  rationale: שלח అనే సాధారణ కథన క్రియను ఆధునిక తెలుగు కథన శైలిలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חִירָם מֶלֶךְ צֹר
  choice: తూరు రాజైన హీరాము
  rationale: వ్యక్తి పేరు, రాజపదవి, రాజ్యం అనే సమాచారాన్ని సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: עֲבָדָיו
  choice: తన సేవకులను
  rationale: עבד అనే పదం సేవకులు, రాజోద్యోగులు లేదా ప్రతినిధులు అనే విస్తృత భావం కలిగి ఉండవచ్చు; సందర్భాన్ని అతిగా నిర్దిష్టం చేయకుండా 'సేవకులు' ఆ విస్తృతిని కాపాడుతుంది.
- source_word: אֶל שְׁלֹמֹה
  choice: సొలొమోను దగ్గరికి
  rationale: אֶל సూచించే గమ్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; హెబ్రీలో లేని ప్రత్యేక ఉద్దేశాన్ని చేర్చదు.
- source_word: כִּי שָׁמַע
  choice: ఎందుకంటే ... విన్నాడు
  rationale: ముందటి చర్యకు కారణాన్ని తెలిపే כִּי భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: מָשְׁחוּ לְמֶלֶךְ
  choice: రాజుగా అభిషేకించారని
  rationale: రాజ్యసంబంధ సందర్భంలో משׁח అంటే నూనెతో అభిషేకించి రాజుగా నియమించడం; 'అభిషేకించారని' మూలంలోని అనిశ్చిత బహువచన కర్తను అలాగే ఉంచుతుంది.
- source_word: תַּחַת אָבִיהוּ
  choice: అతని తండ్రి స్థానంలో
  rationale: రాజ్య వారసత్వంలో תחת సూచించే స్థానభర్తీ లేదా వారసత్వ భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: כִּי אֹהֵב הָיָה חִירָם לְדָוִד כָּל הַיָּמִים
  choice: హీరాము దావీదును ఎల్లప్పుడూ ప్రేమిస్తూ ఉండేవాడు
  rationale: אֹהֵב + היה లోని నిరంతర అనుకూల అనుబంధాన్ని, כָּל הַיָּמִים లోని కొనసాగింపును కాపాడుతుంది; దానిని కేవలం రాజకీయ స్నేహంగా పరిమితం చేయదు.
