translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన కథన శైలి. పొడవైన హెబ్రీ వాక్యాన్ని స్పష్టత కోసం మూడు తెలుగు వాక్యాలుగా విభజించాం. రాజుల గ్రంథాలలో సాధారణంగా వినిపించే పేరురూపాలైన 'హీరాము', 'సొలొమోను', 'దావీదు' ఉపయోగించాం.
