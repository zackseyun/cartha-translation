source:
  edition: WLC
  text: אַתָּ֨ה יָדַ֜עְתָּ אֶת דָּוִ֣ד אָבִ֗/י כִּ֣י לֹ֤א יָכֹל֙ לִ/בְנ֣וֹת בַּ֗יִת לְ/שֵׁם֙ יְהוָ֣ה אֱלֹהָ֔י/ו מִ/פְּנֵ֥י הַ/מִּלְחָמָ֖ה אֲשֶׁ֣ר סְבָבֻ֑/הוּ עַ֤ד תֵּת יְהוָה֙ אֹתָ֔/ם תַּ֖חַת כַּפּ֥וֹת רגל/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/017.yaml
  text: You know that David my father could not build a house for the name of Yahweh his God because of the warfare that surrounded him[a], until Yahweh put them under the soles of his feet.
translation:
  language: te
  text: “యాహ్వే వారిని అతని అరికాళ్ల కింద ఉంచేవరకు, నా తండ్రియైన దావీదు తనను చుట్టుముట్టిన యుద్ధాల కారణంగా తన దేవుడైన యాహ్వే నామం కొరకు ఒక ఇల్లు కట్టలేకపోయాడని నీకు తెలుసు.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అతని అరికాళ్ల కింద’ అని మరింత పూర్తిగా ఉంది; ఇది సంపూర్ణ లోబరచడాన్ని సూచించే రూపకం.
    reason: మూలంలోని ‘పాదాల అరికాళ్లు’ అనే పూర్తి రూపకాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: אַתָּה יָדַעְתָּ
  choice: నీకు తెలుసు
  rationale: ప్రత్యక్ష సంబోధనలోని Qal perfect వర్తమాన జ్ఞానాన్ని సూచిస్తుంది; ప్రత్యేక సర్వనామంలోని స్వల్ప ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగు వాక్య నిర్మాణంలో తెలిపింది.
- source_word: בַּיִת
  choice: ఒక మందిరం
  rationale: మూలపదానికి ప్రాథమికంగా ‘ఇల్లు’ అనే అర్థం ఉన్నా, ఇక్కడ నిర్మించబోయేది యెహోవా ఆరాధనా మందిరమే. ‘మందిరం’ సాధారణ పాఠకుడికి ఉద్దేశిత భావాన్ని సహజంగా తెలియజేస్తుంది; నిర్దిష్ట ఉపపదం లేనందున ‘ఒక’ను ఉంచింది.
- source_word: לְשֵׁם יְהוָה אֱלֹהָיו
  choice: తన దేవుడైన యెహోవా నామం కోసం
  rationale: ‘నామం కోసం’ అనే నిబంధనాత్మక మూలభాషా నుడికారాన్ని ‘మహిమ కోసం’ వంటి వివరణాత్మక పదబంధంగా మార్చకుండా నిలిపింది.
- source_word: מִפְּנֵי הַמִּלְחָמָה אֲשֶׁר סְבָבֻהוּ
  choice: తనను చుట్టుముట్టిన యుద్ధాల కారణంగా
  rationale: ఏకవచన నామవాచకంతో పాటు బహువచన క్రియ ఉన్న అసాధారణ మూల నిర్మాణాన్ని, దావీదును చుట్టుముట్టిన నిరంతర పోరాటాల భావంగా సహజమైన తెలుగులో అందించింది.
- source_word: עַד תֵּת יְהוָה אֹתָם
  choice: యెహోవా అతని శత్రువులను ... ఉంచేవరకు
  rationale: మూలంలోని బహువచన సర్వనామానికి స్పష్టమైన పూర్వపదం లేకపోయినా, పాదాల కింద ఉంచడం అనే జయాపజయ నుడికారం దావీదు శత్రువులను సూచిస్తుంది. అస్పష్టమైన ‘వారిని’ కంటే సందర్భబద్ధమైన ‘అతని శత్రువులను’ సాధారణ పాఠకుడికి స్పష్టంగా ఉంటుంది.
- source_word: תַּחַת כַּפּוֹת רַגְלוֹ
  choice: అతని అరికాళ్ల కింద
  rationale: כַּפּוֹת అనే పదంలోని ‘అరికాళ్లు’ అనే నిర్దిష్ట శరీరభాగాన్ని, లోబరచడాన్ని సూచించే సంపూర్ణ మూలచిత్రంతో సహా నిలిపింది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో బిరుదు కాకుండా చతురక్షర దైవనామం నేరుగా ఉంది. ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపం వ్యక్తిగత దైవనామాన్ని నిలుపుతుంది.
- issue: యెహోవా ఎవరి శత్రువులను లోబరచాడు?
  choice: దావీదు శత్రువులను
  alternative: వారిని / వాటిని
  rationale: మూలంలోని אֹתָם (‘వారిని’)కు స్పష్టమైన పూర్వపదం లేకపోవడం కొంత వ్యాకరణ అస్పష్టతను కలిగిస్తుంది. అయినా ‘అరికాళ్ల కింద ఉంచడం’ అనే జయసూచక రూపకం, చుట్టుముట్టిన యుద్ధ సందర్భం కలిపి శత్రువులనే సూచిస్తాయి; ఇది కొత్త సిద్ధాంతార్థాన్ని చేర్చకుండా సందర్భాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘నామం కోసం’ మరియు ‘అరికాళ్ల కింద’ వంటి ప్రధాన హీబ్రూ నుడికారాలను నిలిపి, యుద్ధసందర్భంలోని అస్పష్ట బహువచన సర్వనామాన్ని సందర్భానుసారంగా ‘అతని శత్రువులను’ అని స్పష్టం చేసింది.
