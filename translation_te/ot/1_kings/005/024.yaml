source:
  edition: WLC
  text: וַ/יְהִ֨י חִיר֜וֹם נֹתֵ֣ן לִ/שְׁלֹמֹ֗ה עֲצֵ֧י אֲרָזִ֛ים וַ/עֲצֵ֥י בְרוֹשִׁ֖ים כָּל חֶפְצֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/024.yaml
  text: And Hiram was giving Solomon cedar timber and cypress timber[a], according to all his desire.
translation:
  language: te
  text: హీరాము సొలొమోను కోరినంత మేరకు దేవదారు కలపను, సరళవృక్షపు కలపను[a] సొలొమోనుకు ఇస్తూ వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సైప్రస్ వృక్షపు కలపను” లేదా “జునిపర్ వృక్షపు కలపను”; సంప్రదాయంగా “ఫిర్ వృక్షపు కలపను” అని కూడా అంటారు. హీబ్రూ పదమైన బెరోషీమ్ ఏ వృక్షజాతిని సూచిస్తుందో ఖచ్చితంగా తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... נֹתֵן
  choice: ఇస్తూ వచ్చాడు
  rationale: היה తో కూడిన కర్తరి రూపం గతకాలంలో కొనసాగిన లేదా అలవాటుగా జరిగిన కార్యాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఇస్తూ వచ్చాడు’ ఆ కొనసాగింపు భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: חִירוֹם
  choice: హీరాము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: לִשְׁלֹמֹה
  choice: సొలొమోనుకు
  rationale: לְ అనే దత్తార్థక విభక్తి భావాన్ని తెలుగులో ‘కు’ ద్వారా స్పష్టంగా వ్యక్తం చేశాం.
- source_word: עֲצֵי אֲרָזִים
  choice: దేవదారు కలపను
  rationale: నిర్మాణ సామగ్రి సందర్భంలో עֵץ పదం జీవించి ఉన్న చెట్లకంటే కలపను సూచిస్తుంది; אֶרֶז సాధారణంగా దేవదారు వృక్షాన్ని సూచిస్తుంది.
- source_word: וַעֲצֵי בְרוֹשִׁים
  choice: సరళవృక్షపు కలపను
  rationale: בְּרוֹשׁ ఒక నిర్మాణానికి ఉపయోగించే శంకువృక్షాన్ని సూచిస్తుంది; దాని ఖచ్చితమైన జాతి అనిశ్చితమైనందున ప్రధాన పాఠంలో విస్తృతంగా తెలిసిన సంప్రదాయ తెలుగు పదాన్ని ఉంచి, ప్రత్యామ్నాయాలను పాదసూచికలో తెలిపాం.
- source_word: כָּל־חֶפְצוֹ
  choice: అతడు కోరినంత
  rationale: ఈ పదబంధం సొలొమోను కోరిక లేదా అభ్యర్థన యొక్క పూర్తి పరిమాణాన్ని సూచిస్తుంది. ‘అతడు కోరినంత’ మూలార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
