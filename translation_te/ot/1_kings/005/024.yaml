revisions:
- from: హీరాము సొలొమోనుకు అతడు కోరినంత దేవదారు కలపను, సరళవృక్షపు కలపను[a] ఇస్తూ వచ్చాడు.
  to: హీరాము సొలొమోను కోరినంత మేరకు దేవదారు కలపను, సరళవృక్షపు కలపను[a] సొలొమోనుకు ఇస్తూ వచ్చాడు.
  rationale: The revision explicitly identifies Solomon as the one whose desire/request is in view, while retaining the durative supply sense and the construction-material sense of both timber terms. The footnote is expanded to retain the acknowledged uncertainty of beroshim without asserting a disputed tree identification as certain.
