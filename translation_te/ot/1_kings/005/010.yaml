translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని రెండు తులనలను ఒకే క్రియతో అనుసంధానించి, ‘మించిపోయింది’ ద్వారా తులనార్థక מן యొక్క భావం స్పష్టంగా నిలుపబడింది.
