  text: And Solomon’s wisdom surpassed the wisdom of all the people of the east and all the wisdom of Egypt[a].
translation:
  language: te
  text: సొలొమోను జ్ఞానం తూర్పు ప్రాంత ప్రజలందరి జ్ఞానాన్ని, ఐగుప్తు జ్ఞానమంతటినీ మించిపోయింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా “తూర్పు కుమారులు”; ఇది తూర్పు ప్రాంత ప్రజలను సూచించే హీబ్రూ నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶב
  choice: మించిపోయింది
  rationale: רבה అనే క్రియకు తరువాత తులనార్థక מן రావడం వల్ల, ఇక్కడ పరిమాణం పెరిగిందనే భావం కంటే శ్రేష్ఠతలో అధిగమించిందనే భావం ఉంది.
- source_word: חָכְמַת
  choice: జ్ఞానం
  rationale: ఈ సందర్భంలో חָכְמָה వివేకం, విద్య, మేధోప్రావీణ్యం వంటి విస్తృత భావాన్ని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘జ్ఞానం’ సహజమైన సమానార్థకం.
- source_word: שְׁלֹמֹה
  choice: సొలొమోను
  rationale: వ్యక్తి పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
- source_word: כָּל בְּנֵי קֶדֶם
  choice: తూర్పు ప్రాంత ప్రజలందరి
  rationale: బְּנֵי קֶדֶם అక్షరార్థంగా ‘తూర్పు కుమారులు’ అయినా, ఇది ఒక ప్రాంతంలోని ప్రజలను సూచించే హీబ్రూ నానుడి. ‘తూర్పు ప్రాంత ప్రజలు’ అర్థాన్ని సహజంగా తెలియజేస్తుంది; כָּל యొక్క సమగ్రతను ‘అందరి’ నిలుపుతుంది.
- source_word: וּמִכֹּל חָכְמַת מִצְרָיִם
  choice: ఐగుప్తు జ్ఞానమంతటినీ
  rationale: రెండవ తులన కూడా అదే క్రియపై ఆధారపడుతుంది. כֹּל యొక్క సమగ్ర భావాన్ని ‘జ్ఞానమంతటినీ’ వ్యక్తం చేస్తుంది.
- source_word: מִצְרָיִם
  choice: ఐగుప్తు
  rationale: స్థలనామానికి తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపం.
