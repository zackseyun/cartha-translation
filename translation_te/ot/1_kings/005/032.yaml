id: 1KI.5.32
reference: 1 Kings 5:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּפְסְל֞וּ בֹּנֵ֧י שְׁלֹמֹ֛ה וּ/בֹנֵ֥י חִיר֖וֹם וְ/הַ/גִּבְלִ֑ים וַ/יָּכִ֛ינוּ הָ/עֵצִ֥ים וְ/הָ/אֲבָנִ֖ים לִ/בְנ֥וֹת הַ/בָּֽיִת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/032.yaml
  text: So Solomon’s builders[a], Hiram’s builders[b], and the men of Gebal cut and prepared the timber and the stones to build the house.
translation:
  language: te
  text: సొలొమోను నిర్మాణ పనివారు, హీరాము నిర్మాణ పనివారు, గెబలు వాసులు[a] కలపను, రాళ్లను చెక్కి, మందిరాన్ని[b] కట్టడానికి సిద్ధం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గెబలీయులు’; అంటే గెబలు (బిబ్లోసు) నుండి వచ్చిన పనివారు.
    reason: lexical_alternative
  - marker: b
    text: అంటే యెహోవా మందిరం, దేవాలయం.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּפְסְלוּ
  choice: చెక్కి
  rationale: פסל ఇక్కడ నిర్మాణ సామగ్రిని కోయడం లేదా తగిన ఆకారంలో చెక్కడం అనే భావాన్ని ఇస్తుంది. ‘చెక్కి’ అనేది కలపకూ రాళ్లకూ వర్తించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: בֹּנֵי שְׁלֹמֹה
  choice: సొలొమోను నిర్మాణ పనివారు
  rationale: ఇక్కడ בֹּנֵי అనేది ‘కట్టేవారు’ అనే వృత్తిపరమైన భావంలో ఉంది. ‘నిర్మాణ పనివారు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, సందర్భంలోని పనిని సరిగ్గా తెలియజేస్తుంది.
- source_word: וּבֹנֵי חִירוֹם
  choice: హీరాము నిర్మాణ పనివారు
  rationale: ముందున్న సమాంతర పదబంధంతో సమరూపతను నిలుపుతూ ఇదే పదప్రయోగం చేయబడింది.
- source_word: וְהַגִּבְלִים
  choice: గెబలు ప్రాంతంవారు
  rationale: ఈ జాతివాచక పదం గెబలు (బిబ్లోసు) నుండి వచ్చినవారిని సూచిస్తుంది. అపరిచితమైన ‘గెబలీయులు’ కంటే ఈ రూపం ఆధునిక పాఠకులకు వెంటనే అర్థమవుతుంది.
- source_word: וַיָּכִינוּ
  choice: సిద్ధం చేశారు
  rationale: כון హిఫీల్ రూపానికి ‘సిద్ధపరచడం’ లేదా ‘సిద్ధం చేయడం’ ప్రధాన భావం; నిర్మాణ సందర్భంలో ఈ అనువాదం సహజంగా ఉంటుంది.
- source_word: הָעֵצִים
  choice: కలపను
  rationale: నిర్మాణానికి ఉపయోగించే wood అనే భావాన్ని తెలుగులో ‘కలప’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְהָאֲבָנִים
  choice: రాళ్లను
  rationale: హీబ్రూ పాఠం సాధారణంగా ‘రాళ్లు’ అనే అంటుంది; ‘రాతి దిమ్మలు’ వంటి అదనపు నిర్దిష్టతను చేర్చలేదు.
- source_word: לִבְנוֹת הַבָּיִת
  choice: ఆ మందిరాన్ని కట్టడానికి
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినప్పటికీ, ఈ సందర్భంలో యెహోవా మందిరాన్ని సూచిస్తుంది. తెలుగులో ‘ఆ మందిరం’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తూ నిర్దిష్ట సూచనను నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే నిర్మాణం ఉపయోగించబడింది. హీబ్రూలోని రెండు వరుస క్రియలను తెలుగులో సహజంగా కలపడానికి ‘చెక్కి ... సిద్ధం చేశారు’ అని ఇచ్చాం; రెండు చర్యలూ నిలుపబడ్డాయి. వ్యక్తుల పేర్లకు సాధారణ తెలుగు బైబిలు రూపాలైన ‘సొలొమోను’, ‘హీరాము’ ఉపయోగించబడ్డాయి.
