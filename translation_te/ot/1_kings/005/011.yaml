source:
  edition: WLC
  text: וַ/יֶּחְכַּם֮ מִ/כָּל הָֽ/אָדָם֒ מֵ/אֵיתָ֣ן הָ/אֶזְרָחִ֗י וְ/הֵימָ֧ן וְ/כַלְכֹּ֛ל וְ/דַרְדַּ֖ע בְּנֵ֣י מָח֑וֹל וַ/יְהִֽי שְׁמ֥/וֹ בְ/כָֽל הַ/גּוֹיִ֖ם סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/011.yaml
  text: He was wiser than every man—than Ethan the Ezrahite[a], and Heman, Kalkol, and Darda[c][b], the sons of Mahol—and his name was in all the surrounding nations.
translation:
  language: te
  text: అతడు మనుష్యులందరికంటే, ఎజ్రాహీయుడైన ఏతాను, హేమాను, కల్కోలు, దర్దా—మాహోలు కుమారులకంటే—ఎక్కువ జ్ఞానవంతుడు. అతని పేరు చుట్టుపక్కల దేశాలన్నిటిలోనూ ప్రసిద్ధి చెందింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: అక్షరార్థంగా, “అతని పేరు చుట్టుపక్కల ఉన్న అన్ని దేశాల్లో ఉండేది”; ఇక్కడ “పేరు” అంటే కీర్తి లేదా ఖ్యాతి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחְכַּם מִכָּל הָאָדָם
  choice: మనుష్యులందరికంటే ఎక్కువ జ్ఞానవంతుడు
  rationale: חכם తో కూడిన מן తులనాత్మక నిర్మాణం జ్ఞానంలో ఆధిక్యాన్ని తెలియజేస్తుంది. האדם సమస్త మానవాళిని సూచించగల సమూహార్థక పదం; తరువాత పురుష జ్ఞానుల పేర్లు వచ్చినా, పోలిక పరిధి విస్తృతంగా ఉండే అవకాశాన్ని తెలుగు సహజంగా నిలుపుతుంది.
- source_word: מֵאֵיתָן הָאֶזְרָחִי
  choice: ఎజ్రాహీయుడైన ఏతాను
  rationale: האזרחי ఇక్కడ వ్యక్తి పేరుతో వచ్చిన వంశ/సమూహ గుర్తింపుగా గ్రహించి, అనిశ్చిత వ్యుత్పత్తిని అర్థానువాదం చేయకుండా లిప్యంతరీకరించాం.
- source_word: וְהֵימָן וְכַלְכֹּל וְדַרְדַּע
  choice: హేమాను, కల్కోలు, దర్దా
  rationale: వ్యక్తినామాలను హీబ్రూ రూపాలకు దగ్గరగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: בְּנֵי מָחוֹל
  choice: మహోలు కుమారులు
  rationale: ఈ నిర్మాణానికి సహజమైన వంశసంబంధ అర్థాన్ని తీసుకున్నాం; ‘నృత్యపు కుమారులు’ లేదా వృత్తిగణ సభ్యులు వంటి ఊహాత్మక అర్థాలను పాఠ్యంలోకి తేలేదు.
- source_word: וַיְהִי שְׁמוֹ בְכָל הַגּוֹיִם סָבִיב
  choice: అతని పేరు చుట్టుపక్కల ఉన్న అన్ని దేశాల్లో ప్రసిద్ధమైంది
  rationale: ‘అతని పేరు ... ఉండెను’ అనే హీబ్రూ నుడికారం సందర్భంలో కీర్తి వ్యాపించడాన్ని సూచిస్తుంది. తెలుగులో అర్థం స్పష్టంగా ఉండేందుకు ‘ప్రసిద్ధమైంది’ అని సహజీకరించాం.
theological_decisions:
- issue: הָאָדָם యొక్క పోలిక పరిధి
  choice: మనుష్యులందరికంటే
  alternative: ప్రతి పురుషునికంటే
  rationale: אָדָם ఏకవచన రూపంలో ఉన్నా సమూహార్థంగా ‘మానవులు/మానవాళి’ని సూచించగలదు. వెంటనే పురుష జ్ఞానుల పేర్లు రావడం సంకుచిత అర్థానికి మద్దతివ్వగలిగినా దాన్ని తప్పనిసరి చేయదు; అందువల్ల విస్తృతమైన సహజ తెలుగు రూపాన్ని ఎంచుకున్నాం.
- issue: ‘అతని పేరు’ అనే హీబ్రూ నుడికారం
  choice: అతని పేరు ... ప్రసిద్ధమైంది
  alternative: అతని పేరు ... ఉండింది
  rationale: ఇక్కడ ‘పేరు’ అనేది కీర్తి లేదా ఖ్యాతిని సూచిస్తుంది. మతపరమైన అదనపు భావాన్ని చేర్చకుండా తెలుగు పాఠకునికి ఉద్దేశం స్పష్టంగా తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. పేర్లను మూల హీబ్రూకు దగ్గరగా లిప్యంతరీకరించాం; అనిశ్చిత వంశపదానికి పాదటిప్పణి ఇచ్చాం.
