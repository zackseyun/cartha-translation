revisions:
- from: అతడు మనుష్యులందరికంటే—ఎజ్రాహీయుడైన ఏతాను[a], హేమాను, కల్కోలు, దర్దా అనే మహోలు కుమారులకంటే—ఎక్కువ జ్ఞానవంతుడు. అతని పేరు చుట్టుపక్కల ఉన్న అన్ని దేశాల్లో ప్రసిద్ధమైంది[b].
  to: అతడు మనుష్యులందరికంటే, ఎజ్రాహీయుడైన ఏతాను, హేమాను, కల్కోలు, దర్దా—మాహోలు కుమారులకంటే—ఎక్కువ జ్ఞానవంతుడు. అతని పేరు చుట్టుపక్కల దేశాలన్నిటిలోనూ ప్రసిద్ధి చెందింది[b].
  rationale: The revision resolves the appositional ambiguity by marking “మాహోలు కుమారులు” as the collective designation for the four preceding names. It also uses the more direct transliteration “మాహోలు” and smooths the final location phrase. The rendering of renown remains a natural Telugu expression of the Hebrew idiom, with its literal form documented in the footnote.
  reviewer_model: gpt-5.6-terra
