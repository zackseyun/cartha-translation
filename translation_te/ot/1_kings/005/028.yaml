  text: He sent them to Lebanon[a], ten thousand a month in shifts; they would be in Lebanon one month and two months at home[c][b], and Adoniram was over the forced labor.
translation:
  language: te
  text: అతడు వారిని వంతులవారీగా నెలకు పదివేలమంది చొప్పున లెబానోనుకు పంపాడు. వారు ఒక నెల లెబానోనులో, రెండు నెలలు తమ ఇళ్లలో[a] ఉండేవారు. నిర్బంధ శ్రమకు[b] అదోనీరాము అధికారిగా ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘అతని ఇంటిలో’; ఇక్కడ ప్రతి పనివాడు తన ఇంటిలో రెండు నెలలు గడిపాడనే భావం.
    reason: lexical_alternative
  - marker: b
    text: ‘శ్రమ విధింపు’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం రాజ్యం విధించిన తప్పనిసరి సేవను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵם
  choice: అతడు వారిని పంపాడు
  rationale: שלח క్రియకు 3వ పురుష బహువచన కర్మప్రత్యయం ఉంది; సాధారణ కథనశైలిలో అర్థాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: לְבָנוֹנָה
  choice: లెబానోనుకు
  rationale: స్థలనామానికి ఉన్న దిశాసూచక అంత్యం లెబానోను వైపు కదలికను సూచిస్తుంది; తెలుగులో చతుర్థీ విభక్తి సహజం.
- source_word: עֲשֶׂרֶת אֲלָפִים בַּחֹדֶשׁ
  choice: నెలకు పదివేలమంది చొప్పున
  rationale: సందర్భంలో בַּחֹדֶשׁ పంపిణీ భావంలో ఉంది. వ్యక్తుల సంఖ్య అని స్పష్టం చేయడానికి ‘మంది’ వాడబడింది.
- source_word: חֲלִיפוֹת
  choice: వంతులవారీగా
  rationale: ఈ నామవాచకం మారుమారుగా జరిగే క్రమాన్ని లేదా బృందాల మార్పిడిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వంతులవారీగా’ సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: חֹדֶשׁ יִהְיוּ בַלְּבָנוֹן
  choice: వారు ఒక నెల లెబానోనులో ఉండేవారు
  rationale: ఏకవచన ‘నెల’ ఇక్కడ కాలవ్యవధిగా ఉంది; తరువాతి ‘రెండు నెలలు’తో సమాంతరత కోసం తెలుగులో ‘ఒక’ చేర్చడం అవసరం.
- source_word: שְׁנַיִם חֳדָשִׁים בְּבֵיתוֹ
  choice: రెండు నెలలు తమ ఇళ్లలో
  rationale: అక్షరార్థంగా ‘అతని ఇంటిలో’ అయినా, ఏకవచన ప్రత్యయం సమూహంలోని ప్రతి కార్మికుని ఇంటిని సూచిస్తుంది. తెలుగులో ‘తమ ఇళ్లలో’ ఈ పంపిణీ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַאֲדֹנִירָם
  choice: అదోనీరాము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించింది.
- source_word: עַל הַמַּס
  choice: నిర్బంధ శ్రమకు అధికారిగా
  rationale: מַס ఇక్కడ ప్రభుత్వం విధించిన తప్పనిసరి శ్రమను సూచిస్తుంది; ‘నిర్బంధ శ్రమ’ దాని బలవంతపు స్వభావాన్ని అస్పష్టం చేయదు.
