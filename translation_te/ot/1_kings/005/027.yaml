  source_fidelity: సవరించిన పాఠం מַס ను నగదు పన్నుగా కాక, ఇశ్రాయేలు ప్రజలనుండి విధించిన తప్పనిసరి శ్రమదళంగా స్పష్టంగా అనువదిస్తుంది. וַיַּעַל యొక్క పరిపాలనా సందర్భంలోని ‘విధించు/సమీకరించు’ భావం, מִכָּל־יִשְׂרָאֵל యొక్క సమగ్రత, అలాగే ముప్పై వేల పురుషుల సంఖ్య అన్నీ నిలుస్తాయి.
