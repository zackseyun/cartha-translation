    text: లేదా, “ఇశ్రాయేలీయులందరిలోనుండి శ్రమదళాన్ని విధించాడు.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదం מַס ఇక్కడ ప్రధానంగా డబ్బు పన్నును కాక, తప్పనిసరిగా చేయవలసిన శ్రమసేవను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: సమీకరించాడు
  rationale: העלה అనే హిఫీల్ క్రియకు מַס తో కూడిన ఈ పరిపాలనా సందర్భంలో నిర్బంధ శ్రమకు మనుషులను నియమించడం లేదా సమీకరించడం అనే భావం ఉంది. ఆధునిక తెలుగులో ‘సమీకరించాడు’ సహజంగా ఉండగా, బలవంతపు స్వభావాన్ని తదుపరి పదబంధం స్పష్టం చేస్తుంది.
- source_word: מַס
  choice: బలవంతపు పనికోసం మనుషులు
  rationale: ఇక్కడ מַס ప్రధానంగా డబ్బు పన్నును కాక, పాలకుడు విధించిన తప్పనిసరి శ్రమసేవను సూచిస్తుంది. సాంకేతిక పదం వాడకుండా ఈ భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరిలోనుండి
  rationale: ఈ పనివారిని ఇశ్రాయేలు ప్రజల సమూహమంతటిలోనుండి తీసుకున్నారని సూచిస్తుంది; భూభాగం కంటే ప్రజలను ఉద్దేశించిన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיְהִי הַמַּס
  choice: అలా సమీకరించబడినవారు
  rationale: హీబ్రూ వాక్యం ఆ నిర్బంధ శ్రమదళం పరిమాణాన్ని పరిచయం చేస్తుంది. తెలుగులో వ్యక్తులను లెక్కించే తరువాతి ‘మంది’తో సహజంగా అనుసంధానమయ్యే రూపం.
- source_word: שְׁלֹשִׁים אֶלֶף אִישׁ
  choice: ముప్పై వేల మంది
  rationale: אִישׁ లెక్కించబడిన మానవ శ్రమికులను సూచిస్తుంది. తెలుగులో ‘మంది’ మానవుల సంఖ్యకు సహజమైన వర్గసూచకం; సందర్భం వీరు రాజు పనికి సమీకరించిన శ్రమికులని స్పష్టం చేస్తుంది.
