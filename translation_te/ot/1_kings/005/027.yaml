translation:
  language: te
  text: సొలొమోను రాజు ఇశ్రాయేలీయులందరిలోనుండి తప్పనిసరి శ్రమదళాన్ని సమీకరించాడు[a][b]. ఆ శ్రమదళంలో ముప్పై వేల మంది పురుషులు ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
