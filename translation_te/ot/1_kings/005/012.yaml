translation:
  language: te
  text: అతడు మూడు వేల సామెతలు[a] పలికాడు; అతనికి వెయ్యి ఐదు పాటలు ఉండేవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మూడు వేల సూక్తులు’ లేదా ‘మూడు వేల ఉపమానాలు’; హీబ్రూ מָשָׁל అనే పదానికి ‘సామెత’ కంటే విస్తృతమైన అర్థపరిధి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: పలికాడు
  rationale: పియేల్ రూపంలోని דבר ఇక్కడ ‘మాట్లాడు/పలుకు’ అనే ప్రత్యక్ష అర్థాన్ని ఇస్తుంది. ‘రచించాడు’ అనేది సందర్భం నుంచి ఊహించవచ్చు గాని క్రియలో స్పష్టంగా లేదు.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: మూడు వేల
  rationale: సంఖ్యను సహజమైన తెలుగు సంఖ్యా నిర్మాణంలో నేరుగా అందిస్తుంది.
- source_word: מָשָׁל
  choice: సామెతలు
  rationale: ఏకవచన రూపం సంఖ్య తరువాత లెక్కించదగిన సమూహార్థంలో ఉంది. సొలొమోను జ్ఞానసంప్రదాయం సందర్భంలో ‘సామెతలు’ ప్రధాన అర్థాన్ని సహజంగా అందిస్తుంది; విస్తృత అర్థపరిధిని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: וַיְהִי
  choice: వెయ్యిన్ని అయిదు
  rationale: సంఖ్యా వాక్యంలో היה మొత్తం సంఖ్యను సూచించే అస్తిత్వ/అనుసంధాన క్రియ. తెలుగులో ప్రత్యేకంగా ‘ఉండెను’ అని చేర్చకుండా సంఖ్యను విధేయంగా ఉంచడం సహజం.
- source_word: שִׁירוֹ
  choice: అతని పాటలు
  rationale: హీబ్రూలో ఏకవచన రూపానికి సర్వనామ ప్రత్యయం ఉన్నప్పటికీ, సంఖ్యతో కలిసి సమూహార్థం కలుగుతుంది; తెలుగులో బహువచనం అవసరం.
- source_word: חֲמִשָּׁה וָאָלֶף
  choice: వెయ్యిన్ని అయిదు
  rationale: హీబ్రూ పదక్రమం అక్షరార్థంగా ‘ఐదు మరియు వెయ్యి.’ ఖచ్చితమైన 1,005 సంఖ్యను సహజమైన ఆధునిక తెలుగు రూపంలో అందిస్తుంది.
