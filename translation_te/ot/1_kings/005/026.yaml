  naturalness: ‘హీరాముకూ సొలొమోనుకూ మధ్య’ అనేది ప్రస్తుత ‘హీరాముకు సొలొమోనుకు మధ్య’ కంటే ఆధునిక ప్రామాణిక తెలుగులో మరింత సహజమైన సముచ్చయ రూపం. ‘తాను సొలొమోనుకు చెప్పినట్లే అతనికి’ అనే క్రమం హీబ్రూలోని ముందటి దైవవాక్యాన్ని, దాని గ్రహీతను స్పష్టంగా తెలియజేస్తుంది.
