source:
  edition: WLC
  text: וַ/יהוָ֗ה נָתַ֤ן חָכְמָה֙ לִ/שְׁלֹמֹ֔ה כַּ/אֲשֶׁ֖ר דִּבֶּר ל֑/וֹ וַ/יְהִ֣י שָׁלֹ֗ם בֵּ֤ין חִירָם֙ וּ/בֵ֣ין שְׁלֹמֹ֔ה וַ/יִּכְרְת֥וּ בְרִ֖ית שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/026.yaml
  text: And Yahweh gave wisdom to Solomon[a], just as he had spoken to him. And there was peace between Hiram and Solomon[b], and the two of them made a covenant.
translation:
  language: te
  text: యాహ్వే తాను సొలొమోనుకు చెప్పినట్లే[a] అతనికి జ్ఞానాన్ని ఇచ్చాడు. హీరాముకూ సొలొమోనుకూ మధ్య శాంతి నెలకొంది; వారిద్దరూ ఒక నిబంధన చేసుకున్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సొలొమోనుకు తాను వాగ్దానం చేసినట్లే.” హీబ్రూ క్రియకు అక్షరార్థం “చెప్పాడు”; ఈ సందర్భంలో అది యాహ్వే ముందుగా సొలొమోనుతో చెప్పిన మాటను సూచిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “నిబంధనను కోశారు”; ఇది నిబంధన చేసుకోవడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో ‘Yahweh’కు సమీపమైన లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: נָתַן חָכְמָה
  choice: జ్ఞానాన్ని ఇచ్చాడు
  rationale: ‘జ్ఞానం ఇచ్చాడు’ అనే హీబ్రూ భావాన్ని సరళంగా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: సొలొమోనుతో తాను చెప్పినట్లే
  rationale: דִּבֶּר యొక్క ప్రాథమిక అర్థమైన ‘చెప్పాడు/మాట్లాడాడు’ను నిలుపుతూ, సర్వనామ సూచన తెలుగులో స్పష్టంగా ఉండేలా సొలొమోను పేరును పునరుక్తి చేశాం.
- source_word: וַיְהִי שָׁלֹם
  choice: శాంతి నెలకొంది
  rationale: ఇద్దరు రాజుల మధ్య శాంతియుత సంబంధం ఏర్పడిందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיִּכְרְתוּ בְרִית
  choice: ఒక నిబంధన చేసుకున్నారు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘నిబంధనను కోశారు’ అనే నుడికారం ఉంది; తెలుగులో దాని అర్థాన్ని సహజంగా అందించడంతో పాటు కీలక పదమైన ‘నిబంధన’ను నిలిపాం.
- source_word: שְׁנֵיהֶם
  choice: వారిద్దరూ
  rationale: ఒప్పందంలో హీరాము, సొలొమోను ఇద్దరి పరస్పర భాగస్వామ్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
- issue: בְרִית ను రాజకీయ ‘ఒప్పందం’గా ఇవ్వాలా, ‘నిబంధన’గా ఇవ్వాలా
  choice: నిబంధన
  alternative: ఒప్పందం / సంధి
  rationale: సందర్భం రాజుల మధ్య రాజకీయ సంబంధమైనప్పటికీ, మూలంలో సాధారణ నిబంధనా పదమే ఉంది. అందువల్ల దాని వేదాంతపరమైన, పదకోశపరమైన అనుసంధానాన్ని కోల్పోకుండా ‘నిబంధన’ను నిలిపాం.
- issue: דִּבֶּר ను ‘చెప్పాడు’గా ఇవ్వాలా, ‘వాగ్దానం చేశాడు’గా అర్థవిస్తరణ చేయాలా
  choice: చెప్పినట్లే
  alternative: వాగ్దానం చేసినట్లే
  rationale: సందర్భంలో ముందటి మాట వాగ్దానాన్ని సూచించవచ్చును; అయినా హీబ్రూ క్రియ నేరుగా ‘మాట్లాడు/చెప్పు’ అని ఉంది. ఆ అర్థవిస్తరణను పాదసూచికలో మాత్రమే తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడాం. ‘యాహ్వే,’ ‘జ్ఞానం,’ ‘నిబంధన’ వంటి మూలపాఠానికి కీలకమైన పదాలను నిలిపాం. ఆంగ్ల సంప్రదింపు పాఠంలో పాదసూచికల గుర్తులు వాటి విషయాలకు సరిపోని స్థానాల్లో ఉన్నందున, మూల హీబ్రూ ఆధారంగా [a]ను ‘చెప్పినట్లే’ తరువాతి వాక్యభాగానికి, [b]ను ‘నిబంధన చేసుకున్నారు’ తరువాత ఉంచాం.
