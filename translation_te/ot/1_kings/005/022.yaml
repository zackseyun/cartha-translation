source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח חִירָם֙ אֶל שְׁלֹמֹ֣ה לֵ/אמֹ֔ר שָׁמַ֕עְתִּי אֵ֥ת אֲשֶׁר שָׁלַ֖חְתָּ אֵלָ֑/י אֲנִ֤י אֶֽעֱשֶׂה֙ אֶת כָּל חֶפְצְ/ךָ֔ בַּ/עֲצֵ֥י אֲרָזִ֖ים וּ/בַ/עֲצֵ֥י בְרוֹשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/022.yaml
  text: Then Hiram sent to Solomon[a], saying, “I have heard what you sent to me[b]. I will do all your desire concerning cedar timber and cypress timber.”
translation:
  language: te
  text: 'అప్పుడు హీరాము సొలొమోనుకు వర్తమానం పంపి ఇలా చెప్పాడు: “నీవు నాకు పంపిన సందేశం నేను విన్నాను. దేవదారు కలప, సైప్రస్[a] కలప విషయంలో నీ కోరిక ప్రకారం అన్నీ చేస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ בְּרוֹשִׁים సూచించే చెట్టు జాతి ఖచ్చితంగా తెలియదు; దీనిని ‘జూనిపర్’ లేదా ‘ఫర్’ అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: అప్పుడు ... వర్తమానం పంపిస్తూ
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది. సందర్భంలో పంపింది సందేశమని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: חִירָם
  choice: హీరాము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో లిప్యంతరీకరించాం.
- source_word: לֵאמֹר
  choice: అని చెప్పాడు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగు కథనశైలిలో వ్యక్తం చేస్తుంది.
- source_word: שָׁמַעְתִּי
  choice: నేను విన్నాను
  rationale: పూర్తయిన క్రియను, హీరాము సొలొమోను సందేశాన్ని స్వీకరించి గ్రహించిన భావంతో సరళంగా వ్యక్తం చేస్తుంది.
- source_word: אֵת אֲשֶׁר שָׁלַחְתָּ אֵלַי
  choice: నీవు నాకు పంపిన సందేశం
  rationale: అక్షరార్థంగా ‘నీవు నాకు పంపినది’; సందర్భంలో అది సందేశమని స్పష్టపరుస్తుంది, అయితే దాన్ని ‘విన్నపం’గా మరీ సంకుచితం చేయదు.
- source_word: אֶעֱשֶׂה
  choice: నెరవేరుస్తాను
  rationale: అక్షరార్థం ‘చేస్తాను’. ‘నీ కోరిక’తో కలిసి తెలుగులో ‘నెరవేరుస్తాను’ సహజంగా ఉండి, హీరాము ఇచ్చిన సమగ్ర హామీని తెలియజేస్తుంది.
- source_word: כָּל חֶפְצְךָ
  choice: నీ కోరికంతా
  rationale: חֵפֶץ సూచించే కోరిక లేదా అభిలాష భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: בַּעֲצֵי אֲרָזִים
  choice: దేవదారు కలప విషయంలో
  rationale: ב ఇక్కడ కార్యపరిధిని సూచిస్తుంది. నిర్మాణ సందర్భానికి ‘కలప’ సరిపోతుంది.
- source_word: וּבַעֲצֵי בְרוֹשִׁים
  choice: సరళదారు కలప
  rationale: בְּרוֹשִׁים చెట్టు జాతి ఖచ్చితంగా తెలియదు. ‘సరళదారు’ ఒక సాధ్యమైన, తెలుగులో అర్థమయ్యే ప్రతిపాదన; అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా రాజసంబంధమైన కథనానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని సాధారణ హామీని సహజమైన తెలుగు పదబంధంతో అందించాం.
