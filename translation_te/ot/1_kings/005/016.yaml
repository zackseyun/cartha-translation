  text: Then Solomon sent to Hiram[a], saying[b],
translation:
  language: te
  text: 'అప్పుడు[a] సొలొమోను హీరాముకు[b] ఇలా సందేశం పంపాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు.” హీబ్రూ కథన సంధిపదాన్ని సందర్భానుసారంగా “మరియు” లేదా “అప్పుడు” అని అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: మరికొన్ని వచనాల్లో ఈ పేరు “హూరాము” అనే రూపంలో ఉంటుంది; ఇక్కడి హీబ్రూ రూపం “హీరాము.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: అప్పుడు … కబురు పంపాడు
  rationale: שׁלח క్రియకు ‘పంపాడు’ ప్రాథమిక భావం. వావ్ వరుస కథన చర్యను సూచిస్తున్నందున ఆధునిక తెలుగులో సహజమైన ‘అప్పుడు’ వాడబడింది; మాటలతో కూడిన సందేశం పంపడాన్ని సందర్భానుసారంగా ‘కబురు పంపాడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: שְׁלֹמֹה
  choice: సొలొమోను
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: אֶל
  choice: హీరాముకు
  rationale: గ్రహీతవైపు దిశను సూచించే אֶל భావాన్ని తెలుగు చతుర్థీ విభక్తి ‘-కు’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: חִירָם
  choice: హీరాము
  rationale: ఈ వచనంలోని חִירָם రూపాన్ని అనుసరించిన తెలుగు లిప్యంతరీకరణ; ఇతర చోట్ల కనిపించే ‘హూరాము’ రూపాన్ని ఇక్కడ ప్రధాన పాఠ్యంలోకి తీసుకురాలేదు.
- source_word: לֵאמֹר
  choice: 'ఇలా … :'
  rationale: తదుపరి ప్రత్యక్ష సందేశాన్ని పరిచయం చేసే לֵאמֹר కార్యాన్ని తెలుగులో ‘ఇలా’ మరియు ద్విబిందువు సహజంగా నిర్వహిస్తాయి; ‘అని చెప్పుతూ’ అనే కృత్రిమ నిర్మాణాన్ని నివారిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని వరుస కథన భావాన్ని ‘అప్పుడు’తో, సందేశ పరిచయాన్ని ‘ఇలా … :’తో వ్యక్తపరచాం. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదాల వెంట ఉంచాం.
