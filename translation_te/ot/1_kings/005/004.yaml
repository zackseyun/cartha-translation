source:
  edition: WLC
  text: כִּי ה֞וּא רֹדֶ֣ה בְּ/כָל עֵ֣בֶר הַ/נָּהָ֗ר מִ/תִּפְסַח֙ וְ/עַד עַזָּ֔ה בְּ/כָל מַלְכֵ֖י עֵ֣בֶר הַ/נָּהָ֑ר וְ/שָׁל֗וֹם הָ֥יָה ל֛/וֹ מִ/כָּל עֲבָרָ֖י/ו מִ/סָּבִֽיב־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/004.yaml
  text: For he was ruling over all the region beyond the River[a], from Tiphsah to Gaza, over all the kings beyond the River[b]; and he had peace on all sides around him.
translation:
  language: te
  text: ఎందుకంటే అతడు నది అవతల ఉన్న ప్రాంతమంతటినీ—తిఫ్సహు నుండి గాజా వరకు—మరియు నది అవతల ఉన్న రాజులందరినీ ఏలేవాడు.[a] అతనికి చుట్టుపక్కల అన్నివైపులా శాంతి ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే యూఫ్రటీసు నది.
    reason: cultural_note
lexical_decisions:
- source_word: רֹדֶה
  choice: ఏలుతూ ... పాలించేవాడు
  rationale: రֹדֶה అనే కృదంతం కొనసాగుతున్న అధికారాన్ని సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు మొదటి భూభాగ సంబంధాన్ని ‘ఏలుతూ’ అని, రాజులపై ఆధిపత్యాన్ని ‘పాలించేవాడు’ అని వ్యక్తం చేశాం.
- source_word: בְּכָל עֵבֶר הַנָּהָר
  choice: నది అవతల ఉన్న ప్రాంతమంతటినీ
  rationale: עֵבֶר הַנָּהָר భౌగోళిక ప్రాంతాన్ని సూచించే స్థిర ప్రయోగం. మూలంలోని ‘నది’ అనే సాధారణ నామాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సహజ తెలుగుకోసం ‘ప్రాంతం’ చేర్చాం.
- source_word: הַנָּהָר
  choice: నది
  rationale: హీబ్రూలో ‘ఆ నది’ అనే నిర్దిష్ట సాధారణ నామం ఉంది; సందర్భంలో అది యూఫ్రటీసు నదిని సూచిస్తుంది. మూల రూపాన్ని పాఠ్యంలో ఉంచి పాదసూచికలో వివరణ ఇచ్చాం.
- source_word: מִתִּפְסַח וְעַד עַזָּה
  choice: తిఫ్సహు నుండి గాజా వరకు
  rationale: సొలొమోను పాలన విస్తృతిని తెలిపే భౌగోళిక పరిధిని సూటిగా అనువదించాం.
- source_word: בְּכָל מַלְכֵי עֵבֶר הַנָּהָר
  choice: నది అవతల ఉన్న రాజులందరినీ పాలించేవాడు
  rationale: בְּ ఇక్కడ రాజులపై ఆధిపత్యాన్ని సూచిస్తుంది. ‘పాలించేవాడు’ రాజకీయ అధికార భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: וְשָׁלוֹם הָיָה לוֹ
  choice: అతనికి ... శాంతి ఉండేది
  rationale: שָׁלוֹם ఇక్కడ వ్యక్తిగత ప్రశాంతతకన్నా రాజకీయ శాంతి, భద్రతలను సూచిస్తుంది; ‘శాంతి ఉండేది’ సందర్భానికి సరిపోతుంది.
- source_word: מִכָּל עֲבָרָיו מִסָּבִיב
  choice: అతని చుట్టూ అన్ని వైపులా
  rationale: మూలంలోని చుట్టుపక్కల అన్ని దిక్కుల భావాన్ని, ‘పొరుగువారు’ వంటి అధిక వ్యాఖ్యానం లేకుండా సహజ తెలుగులో వ్యక్తం చేశాం.
