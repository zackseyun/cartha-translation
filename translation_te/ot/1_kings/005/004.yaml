  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే రాజవృత్తాంతానికి తగిన గౌరవప్రదమైన శైలిలో అనువదించాం. ఇంగ్లీషు పాఠంలోని [b] గమనిక తిఫ్సహు ఆంగ్ల అక్షరక్రమానికే సంబంధించినదిగా, తెలుగులో ఉపయోగకరమైన ప్రత్యామ్నాయం ఇవ్వనందున చేర్చలేదు.
