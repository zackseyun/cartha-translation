translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. రాజుల మధ్య ఏర్పాటును ప్రతిబింబించే విధంగా ఆజ్ఞాత్మకతను అతిశయింపకుండా ‘నెరవేర్చాలి’ అని అనువదించబడింది. మూలంలోని కలపకు సంబంధించిన బహువచన సర్వనామాలను ‘వాటిని’గా నిలుపుతూ, ముందు వచనంపై ఆధారపడే సూచనను విప్పి చెప్పలేదు.
