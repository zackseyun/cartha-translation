  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עֲ֠בָדַ/י יֹרִ֨דוּ מִן הַ/לְּבָנ֜וֹן יָ֗מָּ/ה וַ֠/אֲנִי אֲשִׂימֵ֨/ם דֹּבְר֤וֹת בַּ/יָּם֙ עַֽד הַ/מָּק֞וֹם אֲשֶׁר תִּשְׁלַ֥ח אֵלַ֛/י וְ/נִפַּצְתִּ֥י/ם שָׁ֖ם וְ/אַתָּ֣ה תִשָּׂ֑א וְ/אַתָּה֙ תַּעֲשֶׂ֣ה אֶת חֶפְצִ֔/י לָ/תֵ֖ת לֶ֥חֶם בֵּיתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/023.yaml
  text: My servants will bring them down from Lebanon to the sea[a], and I will make them into rafts on the sea to the place that you direct me, and I will break them apart there, and you will carry them away[b]. And you shall do what I desire by giving food for my household.
translation:
  language: te
  text: నా సేవకులు వాటిని లెబానోను నుండి సముద్రానికి దింపుతారు. నీవు నాకు తెలియజేసే స్థలానికి సముద్రం మీద వాటిని తెప్పలుగా[a] చేస్తాను. అక్కడ వాటిని విడదీస్తాను; నీవు వాటిని తీసుకెళ్తావు. నా ఇంటివారికి ఆహారం[b] సమకూర్చి నా కోరికను నెరవేరుస్తావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, కలప తెప్పలుగా.
    reason: ‘తెప్పలు’ అనేది రవాణా కోసం కలప దుంగలను కలిపి చేసిన తెప్పలను సూచిస్తుంది.
  - marker: b
    text: అక్షరార్థంగా, “నా ఇంటికి రొట్టె.” ఇక్కడ “రొట్టె” అంటే ఆహారం లేదా సరఫరాలు కావచ్చు.
    reason: హీబ్రూ రూపకప్రయోగాన్ని చూపిస్తూ, సందర్భంలోని విస్తృతార్థాన్ని కూడా తెలియజేస్తుంది.
lexical_decisions:
- source_word: עֲבָדַי
  choice: నా సేవకులు
  rationale: రాజ పరిపాలనా సందర్భంలో హీరాము ఆధీనంలో పనిచేసేవారిని సూచిస్తుంది; వారి చట్టపరమైన స్థితిని అనవసరంగా నిర్ధారించకుండా ‘సేవకులు’ మూలపద విస్తృతిని నిలుపుతుంది.
- source_word: יֹרִדוּ ... יָמָּה
  choice: సముద్రం దగ్గరికి దింపుతారు
  rationale: హిఫిల్ రూపంలోని కారణార్థాన్ని ‘దింపుతారు’ తెలియజేస్తుంది; יָמָּה ఇక్కడ సముద్రం వైపు లేదా సముద్ర తీరానికి అనే గమ్యార్థాన్ని కలిగిస్తుంది.
- source_word: אֲשִׂימֵם דֹּבְרוֹת בַּיָּם
  choice: సముద్రం మీద వాటిని తెప్పలుగా చేస్తాను
  rationale: కలపను నీటిమీద తరలించడానికి తెప్పలుగా అమర్చే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘మీద’ తేలియాడే దృశ్యాన్ని నిలుపుతుంది.
- source_word: עַד הַמָּקוֹם אֲשֶׁר תִּשְׁלַח אֵלַי
  choice: నీవు నాకు తెలియజేసే స్థలం వరకు
  rationale: שׁלח యొక్క ప్రాథమిక ‘పంపు’ భావాన్ని, ఈ సందర్భంలో గమ్యస్థానం గురించి సందేశం లేదా ఆదేశం పంపడంగా అర్థం చేసుకుని అనువదించింది; ఎవరు ఎవరి దగ్గరకు వెళ్తారో అదనంగా చేర్చలేదు.
- source_word: וְנִפַּצְתִּים
  choice: వాటిని విడదీస్తాను
  rationale: తెప్పలుగా అమర్చిన కలపను గమ్యస్థానంలో విడదీయడమే సందర్భోచిత భావం; ‘పగలగొడతాను’ అనే అపార్థాన్ని నివారిస్తూ క్రియలోని విభజన భావాన్ని నిలుపుతుంది.
- source_word: תִשָּׂא
  choice: వాటిని తీసుకెళ్తావు
  rationale: נשא లోని ఎత్తడం, మోయడం, తీసుకెళ్లడం అనే విస్తృత భావాల్లో, విడదీసిన కలపను అక్కడి నుండి తరలించే సందర్భానికి ఇది సహజంగా సరిపోతుంది.
- source_word: תַּעֲשֶׂה אֶת חֶפְצִי
  choice: నా కోరికను నెరవేర్చాలి
  rationale: అక్షరార్థంగా ‘నా కోరికను చేయాలి’; ఆధునిక తెలుగులో ‘కోరికను నెరవేర్చాలి’ సహజంగా ఉండి అభ్యర్థన యొక్క వ్యక్తిగత స్వరాన్ని నిలుపుతుంది.
- source_word: לָתֵת לֶחֶם בֵּיתִי
  choice: నా ఇంటివారికి ఆహారం సమకూర్చి
  rationale: לֶחֶם అక్షరార్థంగా ‘రొట్టె’ అయినా, ఇక్కడ రాజగృహానికి కావలసిన ఆహారం లేదా సరఫరాలకు విస్తృతార్థంగా వాడబడింది; בֵּיתִי ని భవనం కాక ఇంటివారిగా సందర్భానుసారంగా తెలిపింది.
