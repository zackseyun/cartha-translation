source:
  edition: WLC
  text: וְ/הִנְ/נִ֣י אֹמֵ֔ר לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֖ם יְהוָ֣ה אֱלֹהָ֑/י כַּ/אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֗ה אֶל דָּוִ֤ד אָבִ/י֙ לֵ/אמֹ֔ר בִּנְ/ךָ֗ אֲשֶׁ֨ר אֶתֵּ֤ן תַּחְתֶּ֨י/ךָ֙ עַל כִּסְאֶ֔/ךָ הֽוּא יִבְנֶ֥ה הַ/בַּ֖יִת לִ/שְׁמִֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/019.yaml
  text: And behold[a], I intend to build a house for the name of Yahweh my God, just as Yahweh spoke to David my father, saying, ‘Your son, whom I will set in your place on your throne[c][b], he will build the house for my name.’
translation:
  language: te
  text: 'ఇదిగో, నా దేవుడైన యెహోవా నామం కోసం ఒక భవనాన్ని[a] కట్టాలని నేను సంకల్పించాను. యెహోవా నా తండ్రి దావీదుతో చెప్పినట్టే: ‘నీ స్థానంలో, నీ సింహాసనంపై నేను నియమించే నీ కుమారుడే నా నామం కోసం ఆ భవనాన్ని కడతాడు.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మందిరాన్ని’; హెబ్రీలో అక్షరార్థంగా ‘ఒక ఇల్లు కట్టాలని.’ ఇక్కడ ఉద్దేశం యెహోవా మందిరం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנְנִי אֹמֵר
  choice: ఇదిగో, ... నేను సంకల్పించాను
  rationale: הִנְנִי యొక్క అవధాన సూచనను ‘ఇదిగో’ నిలుపుతుంది; אֹמֵר + నిర్మాణార్థక క్రియారూపం సందర్భంలో మాట చెప్పడంకన్నా ప్రస్తుత సంకల్పాన్ని సూచిస్తుంది.
- source_word: לִבְנוֹת בַּיִת
  choice: ఒక మందిరాన్ని కట్టాలని
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఇక్కడ యెహోవా ఆరాధనకు నిర్మించే ఆలయమే ఉద్దేశం. ఆధునిక తెలుగులో ‘మందిరం’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: לְשֵׁם יְהוָה אֱלֹהָי
  choice: నా దేవుడైన యెహోవా నామం కోసం
  rationale: ‘నామం కోసం’ అనే హెబ్రీ ఆలయ సూత్రాన్ని గౌరవం కోసం అని విప్పి చెప్పకుండా నిలుపుతూ, అంకితం మరియు సన్నిధికి సంబంధించిన భావగాంభీర్యాన్ని కాపాడుతుంది.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: యెహోవా ... చెప్పినట్టే
  rationale: సొలొమోను సంకల్పానికి ముందటి దైవ వాగ్దానంతో ఉన్న సూటి అనురూపతను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: אֶל דָּוִד אָבִי
  choice: నా తండ్రి దావీదుతో
  rationale: హెబ్రీ సంబంధబోధక రూపాన్ని సహజమైన ఆధునిక తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: אֲשֶׁר אֶתֵּן תַּחְתֶּיךָ
  choice: నీ స్థానంలో ... నేను నియమించే
  rationale: అక్షరార్థంగా ‘నీ స్థానంలో నేను ఉంచే/ఇచ్చే’; రాజ్య వారసత్వ సందర్భంలో ‘నియమించే’ భావాన్ని స్పష్టంగా ఇస్తుంది, కాగా ప్రత్యామ్నాయ అక్షరార్థం పాదసూచికలో నిలుపబడింది.
- source_word: עַל כִּסְאֶךָ
  choice: నీ సింహాసనం మీద
  rationale: రాజ్య వారసత్వం మరియు పాలనను సూచించే హెబ్రీ రాజసంబంధ నుడికారానికి నేరమైన తెలుగు సమానం.
- source_word: הוּא
  choice: నీ కుమారుడే
  rationale: హెబ్రీలోని బలప్రయోగ సర్వనామాన్ని తెలుగు ‘-ఏ’ నిశ్చయార్థక ప్రత్యయంతో సహజంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో నిలిపింది.
- issue: לְשֵׁם అనే ఆలయ సూత్రం
  choice: నామం కోసం
  alternative: నామాన్ని ఘనపరచడానికి
  rationale: ఈ పదబంధాన్ని కేవలం ఘనపరచడమనే భావానికి పరిమితం చేయకుండా, అంకితం మరియు దైవసన్నిధికి సంబంధించిన మూలభాషా ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘నామం కోసం’ అనే మూలభాషా ఆలయ నుడికారాన్ని ఉద్దేశపూర్వకంగా నిలిపింది; హెబ్రీలోని బలప్రయోగాన్ని ‘కుమారుడే’ ద్వారా వ్యక్తం చేసింది.
