id: 1KI.5.21
reference: 1 Kings 5:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/שְׁמֹ֧עַ חִירָ֛ם אֶת דִּבְרֵ֥י שְׁלֹמֹ֖ה וַ/יִּשְׂמַ֣ח מְאֹ֑ד וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ הַ/יּ֔וֹם אֲשֶׁ֨ר נָתַ֤ן לְ/דָוִד֙ בֵּ֣ן חָכָ֔ם עַל הָ/עָ֥ם הָ/רָ֖ב הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/021.yaml
  text: And when Hiram heard the words of Solomon, he rejoiced greatly and said, “Blessed be the LORD today, who has given David a wise son over this great people.”
translation:
  language: te
  text: హీరాము సొలొమోను మాటలు విన్నప్పుడు ఎంతో సంతోషించి, “దావీదుకు ఈ విశాలమైన ప్రజాసమూహానికి నాయకుడిగా జ్ఞానవంతుడైన కుమారుణ్ణి ఇచ్చిన యెహోవా ఈ రోజు స్తుతింపబడునుగాక!” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: విన్నప్పుడు
  rationale: హీబ్రూ కాలసంబంధ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు ఉపవాక్యంగా వ్యక్తం చేస్తుంది.
- source_word: דִּבְרֵי שְׁלֹמֹה
  choice: సొలొమోను మాటలు
  rationale: דברים అనే పదం ఇక్కడ సందేశం లేదా ప్రతిపాదన అనే భావంలో ఉన్నప్పటికీ, మూలంలోని విస్తృతార్థాన్ని నిలుపుతూ సహజంగా ఉంది.
- source_word: וַיִּשְׂמַח מְאֹד
  choice: ఎంతో సంతోషించి
  rationale: מְאֹד యొక్క తీవ్రతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: בָּרוּךְ יְהוָה הַיּוֹם
  choice: యెహోవా ఈ రోజు స్తుతించబడాలి
  rationale: בָּרוּךְ అనే ఆశీర్వాద-స్తుతి ప్రకటనను తెలుగులో అర్థవంతంగా అందిస్తూ, הַיּוֹם ను యెహోవా నామంతో అనవసరంగా కలపకుండా ఉంచుతుంది.
- source_word: בֵּן חָכָם
  choice: జ్ఞానవంతుడైన కుమారుణ్ణి
  rationale: חָכָם యొక్క ప్రత్యక్ష భావాన్ని గౌరవప్రదమైన సాధారణ తెలుగులో ఇస్తుంది.
- source_word: עַל הָעָם הָרָב הַזֶּה
  choice: ఈ గొప్ప ప్రజలపై పరిపాలించడానికి
  rationale: עַל యొక్క అధికార/పాలనా సంబంధాన్ని సందర్భానుసారంగా స్పష్టం చేస్తుంది; רַב ఇక్కడ జనసంఖ్యా విస్తారాన్ని సూచించినా, ‘గొప్ప ప్రజలు’ మూలంలోని భావ విస్తృతిని నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: తెలుగు బైబిల్ పాఠకులకు సుపరిచితమైన దైవనామ రూపాన్ని వాడి, మూలంలో ఉన్న వ్యక్తిగత నామాన్ని సాధారణ బిరుదుగా మార్చలేదు.
- issue: בָּרוּךְ అనే పదబంధం దేవుని గురించి పలికినప్పుడు దాని అర్థం
  choice: స్తుతించబడాలి
  alternative: ధన్యుడు
  rationale: దేవునికి మానవులు శుభం కలిగించాలని సూచించకుండా, ఇది దేవునికి అర్పించే స్తుతి ప్రకటన అని సహజ తెలుగులో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలి. హీరాము పలికిన మాటలకు సహజమైన ప్రత్యక్ష సంభాషణను ఉపయోగించాం.
