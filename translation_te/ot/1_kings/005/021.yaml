revisions:
- from: హీరాము సొలొమోను మాటలు విన్నప్పుడు ఎంతో సంతోషించి, “దావీదుకు ఈ గొప్ప ప్రజలపై పరిపాలించడానికి జ్ఞానవంతుడైన కుమారుణ్ణి ఇచ్చిన యెహోవా ఈ రోజు స్తుతించబడాలి!” అన్నాడు.
  to: హీరాము సొలొమోను మాటలు విన్నప్పుడు ఎంతో సంతోషించి, “దావీదుకు ఈ విశాలమైన ప్రజాసమూహానికి నాయకుడిగా జ్ఞానవంతుడైన కుమారుణ్ణి ఇచ్చిన యెహోవా ఈ రోజు స్తుతింపబడునుగాక!” అన్నాడు.
  rationale: The revision removes the unsupported purposive wording ‘పరిపాలించడానికి,’ renders the scope of the people more faithfully, and uses an idiomatic Telugu blessing formula. No footnotes are required because the text does not contain a disputed reading or an anchor requiring explanation.
