id: 1KI.5.9
reference: 1 Kings 5:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתֵּן֩ אֱלֹהִ֨ים חָכְמָ֧ה לִ/שְׁלֹמֹ֛ה וּ/תְבוּנָ֖ה הַרְבֵּ֣ה מְאֹ֑ד וְ/רֹ֣חַב לֵ֔ב כַּ/ח֕וֹל אֲשֶׁ֖ר עַל שְׂפַ֥ת הַ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/009.yaml
  text: And God gave Solomon wisdom and very great understanding[a], and breadth of heart like the sand that is on the seashore.
translation:
  language: te
  text: దేవుడు సొలొమోనుకు జ్ఞానాన్ని, అత్యంత గొప్ప వివేచనను, సముద్రతీరాన ఉన్న ఇసుకవలె హృదయ విశాలతను[a] ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘హృదయ విశాలత.’ హీబ్రూలో ‘హృదయం’ మనస్సు, అవగాహన లేదా అంతరంగ సామర్థ్యాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ఇచ్చాడు
  rationale: נתן క్రియకు సందర్భానుకూలమైన సరళమైన సమానార్థకం; దేవుడు కర్తగా ఉన్నందున ఏకవచన పుంలింగ క్రియ వాడబడింది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపంలో బహువచనమైనా, ఇక్కడ ఏకవచన క్రియతో ఇశ్రాయేలు దేవుణ్ణి సూచిస్తోంది.
- source_word: חָכְמָה
  choice: జ్ఞానం
  rationale: సొలొమోను సందర్భంలో ప్రాయోగికమైన, రాజపాలనకు సంబంధించిన జ్ఞానాన్ని సహా విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: לִשְׁלֹמֹה
  choice: సొలొమోనుకు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపానికి సంప్రదాన విభక్తి జోడించబడింది.
- source_word: וּתְבוּנָה הַרְבֵּה מְאֹד
  choice: అత్యంత గొప్ప వివేచనను
  rationale: תְבוּנָה లోని గ్రహింపు, విచక్షణ భావాలను ‘వివేచన’ సహజంగా తెలియజేస్తుంది; הַרְבֵּה מְאֹד తీవ్రతను ‘అత్యంత గొప్ప’గా వ్యక్తపరుస్తుంది.
- source_word: וְרֹחַב לֵב
  choice: విశాలమైన హృదయాన్ని
  rationale: మూలంలోని ‘హృదయ విశాలత’ రూపకాన్ని నిలుపుతూ తెలుగులో సహజమైన విశేషణ నిర్మాణాన్ని వాడింది; ఇక్కడ ‘హృదయం’ మనస్సు, అవగాహన, అంతరంగ సామర్థ్యాన్ని కూడా సూచిస్తుంది.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם
  choice: సముద్రతీరంలోని ఇసుకవలె
  rationale: హీబ్రూ ఉపమానాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా, అర్థనిష్ఠగా అందిస్తుంది.
theological_decisions:
- issue: וְרֹחַב לֵב లోని మానవ అంతరంగానికి సంబంధించిన హీబ్రూ నుడికారం
  choice: ప్రధాన పాఠంలో ‘విశాలమైన హృదయం’ అని రూపకాన్ని నిలుపడం
  alternative: ‘విశాలమైన మనస్సు’ లేదా ‘అపారమైన అవగాహన’
  rationale: לֵב అనే పదం భావోద్వేగాలకే పరిమితం కాక బుద్ధి, అవగాహన, అంతరంగ సామర్థ్యాన్ని కూడా సూచిస్తుంది. ‘హృదయం’ మూల రూపకాన్ని కాపాడుతుంది; పాదటిప్పణి దాని విస్తృత భావాన్ని స్పష్టం చేస్తుంది, ఏకైక వ్యాఖ్యానానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని మూడు వరాలను సమాంతర కర్మలుగా ఉంచి, చివరి రూపకాన్ని మూలానికి దగ్గరగా నిలిపింది.
