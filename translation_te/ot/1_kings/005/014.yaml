  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా రూపొందించాం. హీబ్రూ వాక్యంలోని సంక్షిప్తత వల్ల రాజులు సందర్శకులను పంపారా లేక వారు రాజుల ప్రాంతాల నుండి వచ్చారా అనే అస్పష్టతను ప్రధాన పాఠం మరియు పాదటిప్పణిలో నిలిపాం.
