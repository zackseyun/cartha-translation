  text: וַ/יָּבֹ֨אוּ֙ מִ/כָּל הָ֣/עַמִּ֔ים לִ/שְׁמֹ֕עַ אֵ֖ת חָכְמַ֣ת שְׁלֹמֹ֑ה מֵ/אֵת֙ כָּל מַלְכֵ֣י הָ/אָ֔רֶץ אֲשֶׁ֥ר שָׁמְע֖וּ אֶת חָכְמָתֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/014.yaml
  text: And people from all the peoples came to hear the wisdom of Solomon[b][a], from all the kings of the earth who had heard of his wisdom.
translation:
  language: te
  text: అన్ని ప్రజాసమూహాల నుండి ప్రజలు[a] సొలొమోను జ్ఞానాన్ని వినడానికి వచ్చారు. అతని జ్ఞానం గురించి విన్న భూమిమీదనున్న రాజులందరి నుండి వారు వచ్చారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అన్ని దేశాల నుండి.’ హీబ్రూ పదం עַמִּים బహువచనంలో ఉండి ‘ప్రజాసమూహాలు’ లేదా ‘దేశాలు’ అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘భూమిమీదనున్న రాజులందరి నుండి’ అని ఉంది. సొలొమోను జ్ఞానం గురించి విన్న రాజుల ప్రాంతాల నుండి ఈ ప్రజలు వచ్చారని, లేదా ఆ రాజులు వారిని పంపారని ఇది సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: వచ్చారు
  rationale: కథన క్రమాన్ని కొనసాగించే wayyiqtol రూపాన్ని సహజమైన భూతకాల క్రియగా అనువదించాం.
- source_word: מִכָּל הָעַמִּים
  choice: అన్ని జనాల నుండి ప్రజలు
  rationale: עַמִּים అనే బహువచనం వేర్వేరు ప్రజాసమూహాలను సూచిస్తుంది. ‘జనాలు’ మూలంలోని బహువచన భావాన్ని నిలుపుతుంది; వాక్యంలో అంతర్లీనంగా ఉన్న మానవ కర్తను తెలుగులో స్పష్టత కోసం ‘ప్రజలు’ అని వ్యక్తపరిచాం.
- source_word: לִשְׁמֹעַ
  choice: వినడానికి
  rationale: రావడానికి గల ఉద్దేశాన్ని తెలిపే క్రియారూపాన్ని తెలుగులో సహజంగా ఉద్దేశార్థక రూపంలో ఇచ్చాం.
- source_word: חָכְמַת שְׁלֹמֹה
  choice: సొలొమోను జ్ఞానాన్ని
  rationale: హీబ్రూ సమాసంలోని స్వామ్యసంబంధాన్ని సహజమైన తెలుగు రూపంలో నేరుగా నిలిపాం.
- source_word: מֵאֵת כָּל מַלְכֵי הָאָרֶץ
  choice: భూమి మీదున్న రాజులందరి దగ్గర నుండి
  rationale: מֵאֵת సూచించే మూలం లేదా పంపినవారి భావాన్ని అతిగా నిర్ధారించకుండా, హీబ్రూలోని సంక్షిప్త నిర్మాణాన్ని దగ్గరగా నిలిపాం.
- source_word: אֲשֶׁר שָׁמְעוּ אֶת חָכְמָתוֹ
  choice: అతని జ్ఞానం గురించి విన్న
  rationale: ఇక్కడ ప్రత్యక్షంగా జ్ఞానవాక్యాలను వినడం కంటే సొలొమోను జ్ఞానం గురించిన పేరు లేదా వార్త వినడమే సందర్భార్థం; ‘గురించి విన్న’ ఆధునిక తెలుగులో సహజంగా ఉంది.
