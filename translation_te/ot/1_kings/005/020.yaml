  to: ఇప్పుడు లెబానోను నుండి దేవదారు చెట్లను నా కోసం నరికించమని ఆజ్ఞాపించు. నా సేవకులు నీ సేవకులతో కలిసి ఉండనివ్వు. నీవు చెప్పినదంతటికీ అనుగుణంగా నీ సేవకుల జీతాన్ని నీకు ఇస్తాను. ఎందుకంటే, మాలో ఏ మనిషికీ[a] సీదోనీయుల్లా చెట్లు[b] నరకడం తెలియదని నీకు తెలుసు.
