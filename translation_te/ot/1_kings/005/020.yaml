  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి ఉపయోగించబడింది. రాజు చేసే నేరమైన అభ్యర్థనను ‘ఆజ్ఞాపించు’ ద్వారా, పని మరియు జీతానికి సంబంధించిన భాషను సాధారణ పాఠకుడికి స్పష్టంగా ఉంచాం.
