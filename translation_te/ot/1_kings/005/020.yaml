  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֡ה צַוֵּה֩ וְ/יִכְרְתוּ לִ֨/י אֲרָזִ֜ים מִן הַ/לְּבָנ֗וֹן וַֽ/עֲבָדַ/י֙ יִהְי֣וּ עִם עֲבָדֶ֔י/ךָ וּ/שְׂכַ֤ר עֲבָדֶ֨י/ךָ֙ אֶתֵּ֣ן לְ/ךָ֔ כְּ/כֹ֖ל אֲשֶׁ֣ר תֹּאמֵ֑ר כִּ֣י אַתָּ֣ה יָדַ֗עְתָּ כִּ֣י אֵ֥ין בָּ֛/נוּ אִ֛ישׁ יֹדֵ֥עַ לִ/כְרָת עֵצִ֖ים כַּ/צִּדֹנִֽים־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/020.yaml
  text: Now command that cedars from Lebanon be cut for me[a], and let my servants be with your servants, and I will give you the wages of your servants according to all that you say[b]; for you know that among us there is no man who knows how to cut timber like the Sidonians.
translation:
  language: te
  text: ఇప్పుడు లెబానోను నుండి దేవదారు చెట్లను నా కోసం నరికించమని ఆజ్ఞాపించు. నా సేవకులు నీ సేవకులతో కలిసి ఉండనివ్వు. నీవు చెప్పినదంతటికీ అనుగుణంగా నీ సేవకుల జీతాన్ని నీకు ఇస్తాను. ఎందుకంటే, మాలో ఏ మనిషికీ[a] సీదోనీయుల్లా చెట్లు[b] నరకడం తెలియదని నీకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘మాలో మనిషి లేడు.’ ఇది సీదోనీయులతో పోల్చదగిన నైపుణ్యం తమవారిలో ఎవరికీ లేదని చెప్పే ప్రయోగం; సమాజంలోని స్త్రీపురుషుల పాత్రల గురించి చేసే సాధారణ ప్రకటన కాదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘కలప నరకడం.’ హీబ్రూ పదానికి అక్షరార్థంగా ‘చెట్లు’ లేదా ‘కలప’ అని అర్థం; సందర్భం కలప కోసం చెట్లు నరికే పనిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: అభ్యర్థనను ప్రవేశపెట్టే సంభాషణా సూచకాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: צַוֵּה וְיִכְרְתוּ לִי
  choice: నా కోసం నరికించమని ఆజ్ఞాపించు
  rationale: ఆజ్ఞ తరువాత వచ్చే అభ్యర్థనాత్మక నిర్మాణాన్ని తెలుగులో సహజమైన కారణార్థక రూపంతో అందిస్తుంది; రాజసంబంధమైన అభ్యర్థనలోని సూటితనాన్ని నిలుపుతుంది.
- source_word: אֲרָזִים מִן הַלְּבָנוֹן
  choice: లెబానోనులోని దేవదారు చెట్లు
  rationale: చెట్ల రకాన్నీ వాటి మూలస్థానాన్నీ స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַעֲבָדַי יִהְיוּ עִם עֲבָדֶיךָ
  choice: నా సేవకులు నీ సేవకులతో కలిసి ఉంటారు
  rationale: రెండుసార్లు వచ్చిన עבד పదానికి ఒకే విధంగా ‘సేవకులు’ అని అనువదించి, ఉమ్మడి పనివ్యవస్థను తెలియజేస్తుంది.
- source_word: וּשְׂכַר עֲבָדֶיךָ אֶתֵּן לְךָ
  choice: నీ సేవకుల జీతాన్ని ... నీకు ఇస్తాను
  rationale: שׂכר ఇక్కడ శ్రమకు ఇచ్చే జీతం లేదా ప్రతిఫలాన్ని సూచిస్తుంది; బహుమతిని కాదు.
- source_word: כְּכֹל אֲשֶׁר תֹּאמֵר
  choice: నీవు చెప్పిన ప్రకారమంతా
  rationale: ఖరారు చేసే షరతుల విస్తృతిని, సంబోధితుడు చెప్పే మొత్తానికి అనుగుణతను నిలుపుతుంది.
- source_word: אֵין בָּנוּ אִישׁ
  choice: మాలో ఏ మనిషికీ ... తెలియదు
  rationale: אישׁ యొక్క ‘మనిషి’ భావాన్ని ఉంచుతూ, ఈ నైపుణ్యం గల వ్యక్తి తమలో ఎవరూ లేరనే హీబ్రూ భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: יֹדֵעַ לִכְרָת עֵצִים
  choice: చెట్లు నరకడం తెలుసు
  rationale: నైపుణ్యాన్ని సూచించే నిర్మాణాన్ని స్పష్టంగా వ్యక్తం చేస్తూ, עצים యొక్క ప్రాథమిక ‘చెట్లు’ అర్థాన్ని నిలుపుతుంది.
- source_word: כַּצִּדֹנִים
  choice: సీదోనీయుల్లా
  rationale: చెట్లు నరికే విషయంలో సీదోనీయుల నైపుణ్యంతో నేరుగా చేసిన పోలికను సంక్షిప్తంగా నిలుపుతుంది.
