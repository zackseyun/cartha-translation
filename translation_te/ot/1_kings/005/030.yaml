  variant: modern standard Telugu
source:
  edition: WLC
  text: לְ֠/בַד מִ/שָּׂרֵ֨י הַ/נִּצָּבִ֤ים לִ/שְׁלֹמֹה֙ אֲשֶׁ֣ר עַל הַ/מְּלָאכָ֔ה שְׁלֹ֥שֶׁת אֲלָפִ֖ים וּ/שְׁלֹ֣שׁ מֵא֑וֹת הָ/רֹדִ֣ים בָּ/עָ֔ם הָ/עֹשִׂ֖ים בַּ/מְּלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/030.yaml
  text: besides Solomon’s chief deputies who were over the work[a], three thousand three hundred[c][b], who ruled over the people doing the work.
translation:
  language: te
  text: ఇవిగాక, పనికి బాధ్యులుగా ఉన్న సొలొమోను నియమిత ప్రధాన అధికారులు[a] మూడు వేల మూడు వందల మంది. వారు పని చేస్తున్న ప్రజల[c] మీద అధికారం చెలాయించారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రధాన పర్యవేక్షకులు’ లేదా ‘ముఖ్య అధికారులు.’ ఇక్కడి హీబ్రూ పరిపాలనా పదాలు హోదా, పర్యవేక్షణ అనే రెండు భావాలనూ కలిగి ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: ‘అధికారం చెలాయించారు’ అని అనువదించిన క్రియ అధికారాన్ని వినియోగించడాన్ని సూచించగలదు; ఈ సందర్భంలో అది పనివారిపై పర్యవేక్షణాధికారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో ‘ప్రజలు’ అని ఉంది; ఇక్కడ అది ఈ నిర్మాణ పనిలో నిమగ్నమైన శ్రామికులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד
  choice: ఇవిగాక
  rationale: ముందు పేర్కొన్నవారికి అదనంగా మరొక వర్గాన్ని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: שָּׂרֵי הַנִּצָּבִים לִשְׁלֹמֹה
  choice: సొలొమోను నియమిత ప్రధాన అధికారులు
  rationale: שׂרי హోదా లేదా నాయకత్వాన్ని, הַנִּצָּבִים నియమించబడి బాధ్యతలో ఉంచబడిన అధికారులను సూచిస్తాయి. కలిపి అనువదించడం పరిపాలనా హోదా, పర్యవేక్షణ అనే రెండు భావాలనూ తెలియజేస్తుంది.
- source_word: אֲשֶׁר עַל הַמְּלָאכָה
  choice: పనికి బాధ్యులుగా ఉన్న
  rationale: עַל ఇక్కడ పనిపై అధికారమూ పర్యవేక్షణ బాధ్యతా ఉన్నదని సూచిస్తుంది; తెలుగు వాక్యంలో సహజంగా ఉండేలా ‘బాధ్యులుగా’ అని అనువదించబడింది.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּשְׁלֹשׁ מֵאוֹת
  choice: మూడు వేల మూడు వందల మంది
  rationale: హీబ్రూ సంఖ్యను పదరూపంలో ఉంచి, వ్యక్తుల సంఖ్య కావడంతో ‘మంది’ చేర్చబడింది.
- source_word: הָרֹדִים
  choice: అధికారం చెలాయించారు
  rationale: רדה అనే క్రియ అధికారాన్ని వినియోగించడం లేదా ఏలడం అనే బలమైన భావాన్ని కలిగి ఉంది. శ్రమ నిర్వహణ సందర్భంలో కేవలం ‘పర్యవేక్షించారు’ కంటే మూలపద బలాన్ని ఇది మెరుగ్గా నిలుపుతుంది.
- source_word: בָּעָם
  choice: ప్రజల మీద
  rationale: మూలంలో సాధారణ పదమైన ‘ప్రజలు’ ఉంది; సందర్భంలో వారు పనివారైనా, ప్రధాన పాఠ్యంలో మూలపద విస్తృతిని నిలుపుకుంది.
- source_word: הָעֹשִׂים בַּמְּלָאכָה
  choice: పని చేస్తున్న
  rationale: పనిలో నిమగ్నమైన ప్రజలను గుర్తించే హీబ్రూ కృదంత వాక్యభాగానికి సూటిగా, సహజంగా సరిపోతుంది.
