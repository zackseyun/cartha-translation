translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. హీబ్రూ పరిపాలనా పదాల హోదా–పర్యవేక్షణ భావసమ్మేళనాన్ని ప్రధాన పాఠ్యం మరియు పాదసూచికలో నిలిపి, בָּעָם అనే విస్తృత పదాన్ని ‘ప్రజలు’గానే ఉంచాం. హీబ్రూ ఒక్క వాక్య నిర్మాణాన్ని తెలుగు స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం.
