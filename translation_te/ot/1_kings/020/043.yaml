  yaml_path: translation/ot/1_kings/020/043.yaml
  text: So the king of Israel went to his house sullen and angry[a], and he came to Samaria.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు రాజు అసంతృప్తితో, కోపంగా తన ఇంటికి వెళ్లాడు; అతడు సమరయకు చేరాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ముఖం మాడ్చుకొని, కోపంగా.’ హెబ్రీలోని సַר וְזָעֵף అనే జంట పదాలు అసంతృప్తి లేదా సణుగుడు స్వభావాన్నీ, కోపం లేదా చికాకునీ సూచిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: వెళ్లి
  rationale: הלך యొక్క సాధారణ కథన క్రియను సహజమైన తెలుగు కథన ప్రవాహంలో ‘వెళ్లి’ అని అనువదించాం.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: కర్తను స్పష్టంగా గుర్తించే సహజమైన తెలుగు నిర్మాణం.
- source_word: עַל בֵּיתוֹ
  choice: తన ఇంటికి
  rationale: చలన క్రియతో עַל ఇక్కడ గమ్యాన్ని సూచిస్తుంది. రాజభవనం అని ప్రత్యేకంగా అర్థం చేర్చకుండా హెబ్రీయులోని ‘ఇల్లు’ రూపాన్ని నిలిపాం.
- source_word: סַר
  choice: దిగులుతో
  rationale: זָעֵף తో జతగా ఇది లోపల అణచుకున్న అసంతృప్తి లేదా ముఖం మాడ్చుకున్న స్థితిని సూచిస్తుంది; సాధారణ పాఠకులకు సహజంగా ఉండేలా ‘దిగులుతో’ ఎంచుకున్నాం.
- source_word: וְזָעֵף
  choice: కోపంగా
  rationale: చికాకు, ఆగ్రహం కలిగిన స్థితిని స్పష్టంగా వ్యక్తపరుస్తుంది; జతపదాల ద్వంద్వ వర్ణనను నిలుపుతుంది.
- source_word: וַיָּבֹא
  choice: చేరుకున్నాడు
  rationale: בוא యొక్క గమ్యస్థానానికి రావడం అనే భావాన్ని తెలుగు ప్రయాణ కథనంలో సహజంగా తెలియజేస్తుంది.
- source_word: שֹׁמְרוֹנָה
  choice: సమరయకు
  rationale: దిశార్థక ה ను తెలుగులో గమ్యవాచక ‘కు’తో వ్యక్తపరచాం.
