translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని రెండు భావపదాలను విడివిడిగా నిలిపి, రాజ నివాసాన్ని ‘రాజభవనం’గా అతిగా నిర్దిష్టం చేయలేదు.
