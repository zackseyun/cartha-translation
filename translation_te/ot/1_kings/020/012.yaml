source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/שְׁמֹ֨עַ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וְ/ה֥וּא שֹׁתֶ֛ה ה֥וּא וְ/הַ/מְּלָכִ֖ים בַּ/סֻּכּ֑וֹת וַ/יֹּ֤אמֶר אֶל עֲבָדָי/ו֙ שִׂ֔ימוּ וַ/יָּשִׂ֖ימוּ עַל הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/012.yaml
  text: And when he heard this word[a], while he and the kings were drinking in the booths, he said to his servants[c][b], “Take your positions.” So they took their positions against the city.
translation:
  language: te
  text: అతడు ఈ మాట[a] విన్నప్పుడు, అతడూ ఆ రాజులూ పందిళ్లలో[b] తాగుతూ ఉన్నారు. అతడు తన సేవకులతో, “స్థానాలు చేపట్టండి!”[c] అన్నాడు. అప్పుడు వారు పట్టణానికి ఎదురుగా తమ స్థానాలు చేపట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఈ సందేశం” లేదా “ఈ విషయం.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “తాత్కాలిక ఆశ్రయాల్లో” లేదా “గుడారాల్లో.”
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ ఆజ్ఞ అక్షరార్థంగా “పెట్టండి!” అనే అత్యంత సంక్షిప్త సైనిక ఆజ్ఞ; ఇక్కడ దాని భావం పట్టణానికి ఎదురుగా స్థానాలు చేపట్టమని.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר הַזֶּה
  choice: ఈ మాట
  rationale: דבר అనే పదానికి ‘మాట,’ ‘సందేశం,’ ‘విషయం’ అనే అర్థాలు ఉన్నాయి. ఇక్కడ అహాబు పంపిన జవాబును సూచిస్తున్నప్పటికీ, మూలంలోని విస్తృతార్థాన్ని నిలుపుకోవడానికి ‘ఈ మాట’ అని అనువదించాం.
- source_word: שֹׁתֶה הוּא וְהַמְּלָכִים
  choice: అతడూ ఆ రాజులూ ... మద్యం తాగుతూ ఉన్నారు
  rationale: వర్తమాన కృదంతం ఆ సమయంలో కొనసాగుతున్న చర్యను తెలియజేస్తుంది. హీబ్రూ వాక్య నిర్మాణాన్ని సహజమైన తెలుగు బహువచన రూపంలో వ్యక్తం చేశాం; సందర్భం విందు/మద్యపానాన్ని సూచిస్తున్నందున ‘మద్యం’ అని స్పష్టం చేశాం.
- source_word: בַּסֻּכּוֹת
  choice: పందిళ్లలో
  rationale: סֻכּוֹת తాత్కాలిక ఆశ్రయాలు, గుడారాలవంటి పందిళ్లు అనే భావాన్ని ఇస్తుంది. రాజుల శిబిర సందర్భంలో ‘పందిళ్లు’ సహజంగా ఉండి, శాశ్వత భవనాల భావాన్ని కలిగించదు.
- source_word: שִׂימוּ
  choice: స్థానాలు చేపట్టండి
  rationale: శׂים అక్షరార్థంగా ‘పెట్టండి/నిలపండి’ అనే సంక్షిప్త ఆజ్ఞ. ఇక్కడ అది సైనిక ఆజ్ఞగా ఉన్నందున ‘స్థానాలు చేపట్టండి’ అని ఇచ్చాం; దాడి ప్రారంభించమని మూలంలో లేని వివరాన్ని చేర్చలేదు.
- source_word: וַיָּשִׂימוּ עַל הָעִיר
  choice: వారు పట్టణానికి ఎదురుగా తమ స్థానాలు చేపట్టారు
  rationale: హీబ్రూ పదబంధం సంక్షిప్తంగా, కొంత అధ్యాహారంగా ఉంది. על ఇక్కడ పట్టణానికి వ్యతిరేకంగా సైనికంగా మోహరించడాన్ని సూచిస్తుంది; అనువాదం ఆ భావాన్ని నిలుపుతూ ముట్టడి పరికరాలు వంటి అదనపు వివరాలను చేర్చదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని పునరుక్తిని సహజ తెలుగు వాక్య నిర్మాణంగా మార్చినా, చర్యల క్రమం, కొనసాగుతున్న మద్యపానం, సంక్షిప్త సైనిక ఆజ్ఞ, పట్టణానికి వ్యతిరేకమైన మోహరింపు అన్నీ నిలుపుకున్నాం.
