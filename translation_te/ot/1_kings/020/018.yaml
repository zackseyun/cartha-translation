review_pass:
  verdict: revise
  source_fidelity: The draft retains the two conditional alternatives, the repeated command, and the instruction to take them alive. However, the Telugu concessive forms “వచ్చినా” read more naturally as “even if they came out,” whereas Hebrew אִם introduces straightforward conditional alternatives (“if”). “బయలుదేరి వచ్చినా” also adds an unnecessary compound motion nuance; יָצָאוּ simply means “went/came out.”
  naturalness: The register is clear and modern. Recasting the conditions with “బయటికి వచ్చి ఉంటే” makes the conditional sense more idiomatic and exact in Telugu.
  terminology: “శాంతి కోసమై,” “యుద్ధం కోసమై,” “సజీవంగా,” and “పట్టుకోండి” accurately convey the relevant Hebrew expressions and the military-command register. No theological terminology is involved.
  issues:
  - severity: medium
    issue: Concessive conditional wording
    rationale: “వచ్చినా” commonly carries a concessive sense (“even if”), while אִם in both clauses sets out ordinary conditional alternatives. “వచ్చి ఉంటే” preserves the source relation more precisely.
  - severity: low
    issue: Added compound-motion nuance
    rationale: “బయలుదేరి వచ్చినా” can imply both setting out and arriving. The source only states that they went/came out, so “బయటికి వచ్చి ఉంటే” is more direct.
  revised_text: 'అతడు ఇలా అన్నాడు: “వారు శాంతి కోసమై బయటికి వచ్చి ఉంటే, వారిని సజీవంగా పట్టుకోండి; వారు యుద్ధం కోసమై బయటికి వచ్చి ఉంటే, వారిని సజీవంగా పట్టుకోండి.”[a]'
