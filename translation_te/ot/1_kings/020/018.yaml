id: 1KI.20.18
reference: 1 Kings 20:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֛אמֶר אִם לְ/שָׁל֥וֹם יָצָ֖אוּ תִּפְשׂ֣וּ/ם חַיִּ֑ים וְ/אִ֧ם לְ/מִלְחָמָ֛ה יָצָ֖אוּ חַיִּ֥ים תִּפְשֽׂוּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/018.yaml
  text: And he said[a], “If they have come out for peace, seize them alive; and if they have come out for battle, seize them alive.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “వారు శాంతి కోసమై బయటికి వచ్చి ఉంటే, వారిని సజీవంగా పట్టుకోండి; వారు యుద్ధం కోసమై బయటికి వచ్చి ఉంటే, వారిని సజీవంగా పట్టుకోండి.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు శాంతియుతంగా బయటికి వచ్చి ఉంటే … యుద్ధానికి బయటికి వచ్చి ఉంటే.”
    reason: לְשָׁלוֹם మరియు לְמִלְחָמָה అనే పదబంధాలను ఉద్దేశంగా (“శాంతి కోసమై/యుద్ధం కోసమై”) లేదా విధంగా/గమ్యంగా (“శాంతియుతంగా/యుద్ధానికి”) అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు అతడు ఇలా అన్నాడు
  rationale: కథనంలోని wayyiqtol రూపాన్ని సహజమైన తెలుగు కథన ప్రవాహంలో చూపిస్తూ, ప్రత్యక్ష సంభాషణను పరిచయం చేస్తుంది.
- source_word: אִם
  choice: వచ్చినా
  rationale: రెండు సాధ్య పరిస్థితులను సూచించే షరతును తెలుగులో సహజమైన ‘-ఇనా’ నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: לְשָׁלוֹם
  choice: శాంతి కోసం
  rationale: లְ + שָׁלוֹם సూచించే శాంతియుత ఉద్దేశాన్ని రూపపరంగా దగ్గరగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: יָצָאוּ
  choice: బయలుదేరి వచ్చినా
  rationale: పట్టణం నుండి బయటకు వచ్చి ఎదురుగా కనిపిస్తున్న వారిని వక్త దృష్టికోణం నుంచి సూచిస్తుంది; కేవలం ‘బయలుదేరారు’ కంటే గమనదిశను స్పష్టం చేస్తుంది.
- source_word: תִּפְשׂוּם
  choice: వారిని పట్టుకోండి
  rationale: సైనిక సందర్భంలోని పట్టుకోవడం లేదా బంధించడం అనే ఆజ్ఞార్థాన్ని సాధారణ ఆధునిక తెలుగులో బలంగా తెలియజేస్తుంది.
- source_word: חַיִּים
  choice: సజీవంగా
  rationale: వారిని ఏ స్థితిలో పట్టుకోవాలో తెలిపే క్రియావిశేషణార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְאִם
  choice: …వచ్చినా
  rationale: రెండవ ప్రత్యామ్నాయ పరిస్థితిని మొదటిదానితో సమాంతరంగా ఉంచుతుంది; హెబ్రీయులో లేని అదనపు విరోధ భావాన్ని చేర్చదు.
- source_word: לְמִלְחָמָה
  choice: యుద్ధం కోసం
  rationale: మొదటి భాగంలోని ‘శాంతి కోసం’కు సమాంతరంగా, యుద్ధ ఉద్దేశాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: חַיִּים תִּפְשׂוּם
  choice: వారిని సజీవంగా పట్టుకోండి
  rationale: హెబ్రీయులోని పదక్రమ భేదాన్ని తెలుగులో కృత్రిమంగా అనుకరించకుండా, పునరుక్త ఆజ్ఞ యొక్క వాక్చాతుర్య బలాన్ని నిలుపుతుంది.
