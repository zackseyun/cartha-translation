revisions:
- from: 'అప్పుడు అతడు ఇలా అన్నాడు: “వారు శాంతి కోసం బయలుదేరి వచ్చినా, వారిని సజీవంగా పట్టుకోండి; యుద్ధం కోసం బయలుదేరి వచ్చినా, వారిని సజీవంగా పట్టుకోండి.”[a]'
  to: 'అతడు ఇలా అన్నాడు: “వారు శాంతి కోసమై బయటికి వచ్చి ఉంటే, వారిని సజీవంగా పట్టుకోండి; వారు యుద్ధం కోసమై బయటికి వచ్చి ఉంటే, వారిని సజీవంగా పట్టుకోండి.”[a]'
  rationale: The revision preserves the Hebrew’s two parallel conditional clauses and its deliberate repetition of “seize them alive,” while replacing concessive and overly compound motion wording with direct, natural Telugu conditionals. The footnote continues to preserve the lexical/syntactic alternative without resolving it beyond the source.
