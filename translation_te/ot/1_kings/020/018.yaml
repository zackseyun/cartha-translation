translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగానూ సాధారణ పాఠకులకు సులభంగానూ ఉంది. రెండు పరిస్థితుల్లోనూ ఒకే ఆజ్ఞను పునరావృతం చేసి మూలంలోని వాక్చాతుర్య బలాన్ని నిలిపింది. పాదసూచిక గుర్తును సంబంధిత వాక్యాంతంలో ఉంచింది.
