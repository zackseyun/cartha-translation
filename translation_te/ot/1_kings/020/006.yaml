  text: כִּ֣י אִם כָּ/עֵ֣ת מָחָ֗ר אֶשְׁלַ֤ח אֶת עֲבָדַ/י֙ אֵלֶ֔י/ךָ וְ/חִפְּשׂוּ֙ אֶת בֵּ֣יתְ/ךָ֔ וְ/אֵ֖ת בָּתֵּ֣י עֲבָדֶ֑י/ךָ וְ/הָיָה֙ כָּל מַחְמַ֣ד עֵינֶ֔י/ךָ יָשִׂ֥ימוּ בְ/יָדָ֖/ם וְ/לָקָֽחוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/006.yaml
  text: No[a], but about this time tomorrow I will send my servants to you, and they will search your house and the houses of your servants; and whatever is desirable in your eyes[b], they will put into their hands and take away.
translation:
  language: te
  text: “కాదు; రేపు ఇంచుమించు ఇదే సమయానికి నా సేవకులను నీ దగ్గరికి పంపిస్తాను. వారు నీ ఇంటినీ, నీ సేవకుల ఇళ్లనూ సోదా చేస్తారు. నీ కంటికి ప్రియమైనదంతా[a] తమ చేతుల్లోకి తీసుకొని[b] తీసుకుపోతారు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ దృష్టిలో విలువైనదంతా,” అంటే నువ్వు ఎంతో విలువైనదిగా భావించేదంతా.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో “తమ చేతుల్లో పెడతారు మరియు తీసుకుంటారు”; ఈ నుడికారం స్వాధీనం చేసుకొని తీసుకుపోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: కాదు;
  rationale: ముందు అంగీకరించిన పరిమితిని తిరస్కరించి బెదిరింపును మరింత తీవ్రం చేసే వ్యతిరేక భావాన్ని సందర్భానుసారంగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָּעֵת מָחָר
  choice: రేపు ఇంచుమించు ఇదే సమయానికి
  rationale: మరుసటి రోజు సుమారు ఇదే వేళ అనే కాలసూచక నుడికారాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עֲבָדַי
  choice: నా సేవకులను
  rationale: ఇక్కడ రాజు అధికారికంగా పంపే పరివారాన్ని లేదా ప్రతినిధులను సూచిస్తుంది; వారి బానిస హోదా ప్రధానాంశం కాదు.
- source_word: וְחִפְּשׂוּ
  choice: సోదా చేస్తారు
  rationale: ఇళ్లను క్షుణ్ణంగా వెదికి పరిశీలించే భావాన్ని తెలుపుతుంది; మూలంలో స్పష్టంగా లేని హింసాత్మక భావాన్ని అదనంగా చేర్చదు.
- source_word: בֵּיתְךָ ... בָּתֵּי עֲבָדֶיךָ
  choice: నీ ఇంటినీ, నీ సేవకుల ఇళ్లనూ
  rationale: בַּיִת‌కు ‘ఇల్లు’ లేదా ‘రాజభవనం’ అనే భావాలు ఉండవచ్చు. ‘ఇల్లు’ అనే ఎంపిక మూలంలోని సమాంతర నిర్మాణాన్ని, కొంత అర్థవిస్తృతిని నిలుపుతుంది.
- source_word: כָּל מַחְמַד עֵינֶיךָ
  choice: నీ కంటికి ప్రియమైనదంతా
  rationale: ఒకరికి విలువైనది, మనోహరమైనది, కోరదగినది అనే హెబ్రీ నుడికారాన్ని తెలుగులో అర్థమయ్యేలా, దాని దృశ్యరూపాన్ని నిలుపుతూ అందిస్తుంది.
- source_word: יָשִׂימוּ בְיָדָם
  choice: తమ చేతుల్లో పెట్టుకొని
  rationale: అక్షరార్థమైన ‘తమ చేతిలో పెట్టు’ అనే క్రమాన్ని నిలుపుతూ, స్వాధీనం చేసుకునే సందర్భార్థాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וְלָקָחוּ
  choice: తీసుకుపోతారు
  rationale: వస్తువులను స్వాధీనం చేసుకొని అక్కడి నుంచి తరలించడాన్ని సందర్భానుసారంగా స్పష్టం చేస్తుంది.
