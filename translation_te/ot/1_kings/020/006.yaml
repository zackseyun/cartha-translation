translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘నీ ఇల్లు’ అనే రూపం ‘రాజభవనం’ అనే సాధ్యమైన సందర్భార్థాన్ని నిర్బంధంగా నిర్ణయించకుండా మూలంలోని పదప్రయోగాన్ని నిలుపుతుంది. పాదసూచిక గుర్తులు అవి వివరిస్తున్న పదబంధాల వెంట ఉంచబడ్డాయి.
