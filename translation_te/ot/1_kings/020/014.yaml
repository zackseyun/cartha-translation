  text: וַ/יֹּ֤אמֶר אַחְאָב֙ בְּ/מִ֔י וַ/יֹּ֨אמֶר֙ כֹּֽה אָמַ֣ר יְהוָ֔ה בְּ/נַעֲרֵ֖י שָׂרֵ֣י הַ/מְּדִינ֑וֹת וַ/יֹּ֛אמֶר מִֽי יֶאְסֹ֥ר הַ/מִּלְחָמָ֖ה וַ/יֹּ֥אמֶר אָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/014.yaml
  text: 'And Ahab said[a], “By whom?” And he said, “Thus says Yahweh: By the young men of the provincial officials.” Then he said, “Who will begin the battle?” And he said, “You.”'
translation:
  language: te
  text: 'అహాబు, “ఎవరి ద్వారా?” అని అడిగాడు. అతడు, “యాహ్వే ఇలా అంటున్నాడు: ‘ప్రాంతాల అధికారుల యువకుల ద్వారా[a],’” అని జవాబిచ్చాడు. అప్పుడు అహాబు, “యుద్ధాన్ని ఎవరు ప్రారంభిస్తారు?” అని అడిగాడు. అతడు, “మీరే,” అని జవాబిచ్చాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రాంతాల అధికారుల సేవకుల ద్వారా” లేదా “ప్రాంతాల అధికారుల పరిచారకుల ద్వారా.” “యువకులు” అని అనువదించిన హీబ్రూ పదం అధికారుల సేవలో ఉన్న సహాయకులను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִי
  choice: ఎవరి ద్వారా?
  rationale: בְּ ఉపసర్గ ఇక్కడ కార్యాన్ని నిర్వహించే వ్యక్తిని లేదా సాధనాన్ని సూచిస్తుంది. ‘ఎవరి ద్వారా?’ అనే రూపం ఆ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כֹּה אָמַר יְהוָה
  choice: యెహోవా ఇలా అంటున్నాడు
  rationale: ప్రవక్త ద్వారా వచ్చే దైవ సందేశ సూత్రాన్ని గంభీరంగా, ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలంలోని దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: בְּנַעֲרֵי
  choice: యువకుల ద్వారా
  rationale: נַעַר పదపు ప్రాథమిక వయోసూచక భావాన్ని ప్రధాన పాఠంలో నిలుపుతూ, సందర్భానుసారమైన ‘సేవకులు/పరిచారకులు’ అనే భావాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: ప్రాంతాల అధికారులు
  rationale: שָׂרִים అనే పరిపాలనా నాయకుల భావాన్నీ, מְדִינוֹת అనే పరిపాలనా ప్రాంతాల భావాన్నీ హోదాను అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
- source_word: מִי יֶאְסֹר הַמִּלְחָמָה
  choice: యుద్ధాన్ని ఎవరు ప్రారంభిస్తారు?
  rationale: אָסַר యొక్క అక్షరార్థం ‘కట్టు’; అయితే యుద్ధంతో కలిసిన ఈ నుడికారంలో పోరాటాన్ని మొదలుపెట్టడం అనే భావం వస్తుంది.
- source_word: אָתָּה
  choice: నువ్వే
  rationale: హీబ్రూ స్వతంత్ర సర్వనామంలోని నొక్కిచెప్పే బలాన్ని తెలుగు ‘-ఏ’ ప్రత్యయం సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: వచనంలో ఉన్న చతురక్షర దైవనామాన్ని వ్యక్తిగత నామంగానే నిలుపుతుంది; సాధారణ బిరుదుతో భర్తీ చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంభాషణ సహజంగా ఉండేలా ‘అడిగాడు/జవాబిచ్చాడు’ వాడబడింది. దైవ సందేశ సూత్రానికి తగిన గంభీరతను నిలిపి, పరిపాలనా మరియు సైనిక హోదాలను మూలం కంటే అధికంగా నిర్దిష్టం చేయలేదు.
