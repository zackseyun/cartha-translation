id: 1KI.20.23
reference: 1 Kings 20:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַבְדֵ֨י מֶֽלֶךְ אֲרָ֜ם אָמְר֣וּ אֵלָ֗י/ו אֱלֹהֵ֤י הָרִים֙ אֱלֹ֣הֵי/הֶ֔ם עַל כֵּ֖ן חָזְק֣וּ מִמֶּ֑/נּוּ וְ/אוּלָ֗ם נִלָּחֵ֤ם אִתָּ/ם֙ בַּ/מִּישׁ֔וֹר אִם לֹ֥א נֶחֱזַ֖ק מֵ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/023.yaml
  text: And the servants of the king of Aram said to him[a], “Their gods are gods of the hills; therefore they were stronger than we were. But if we fight against them on the plain, surely we will be stronger than they are.”
translation:
  language: te
  text: 'అరాము రాజు సేవకులు అతనితో ఇలా అన్నారు: “వారి దేవుళ్లు[a] కొండల దేవుళ్లు; అందుకే వారు మనకంటే బలవంతులుగా ఉన్నారు. అయితే మనం సమతల ప్రాంతంలో వారితో యుద్ధం చేస్తే, తప్పకుండా మనం వారికంటే బలవంతులమవుతాం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి దేవుడు కొండల దేవుడు…” హెబ్రీలో బహువచన రూపాలు (“దేవుళ్లు”) ఉన్నాయి; అవి ఇశ్రాయేలు దేవుని గురించి అరామీయులు తమ బహుదేవతా దృక్కోణంలో మాట్లాడిన తీరును ప్రతిబింబిస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי
  choice: సేవకులు
  rationale: రాజసభ సందర్భంలో ఈ పదం అధికారులను కూడా సూచించవచ్చు; అయితే మూలపదానికి నేరుగా సరిపోయే ‘సేవకులు’ సహజంగా ఉంది, నిర్దిష్ట అధికార హోదాను అనవసరంగా జోడించదు.
- source_word: אֲרָם
  choice: అరాము
  rationale: తరువాతి కాలపు భౌగోళిక పేరు ‘సిరియా’కు బదులు మూలంలోని ప్రాచీన నామాన్ని నిలుపుతుంది.
- source_word: אֱלֹהֵי הָרִים / אֱלֹהֵיהֶם
  choice: కొండల దేవుళ్లు / వారి దేవుళ్లు
  rationale: అరామీయుల బహుదేవతా దృక్కోణంలో పలికిన మాటలుగా హెబ్రీ బహువచన రూపాలను నిలుపుతుంది; ఇది కథకుని ధార్మిక ప్రకటన కాదు.
- source_word: עַל כֵּן
  choice: అందుకే
  rationale: కారణ-ఫలిత సంబంధాన్ని ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: חָזְקוּ מִמֶּנּוּ
  choice: వారు మనకంటే బలవంతులయ్యారు
  rationale: חזק తో מן కలిసిన తులనాత్మక భావాన్ని నిలుపుతూ, తరువాతి వాక్యంలోని పదపునరుక్తితో అనుసంధానిస్తుంది.
- source_word: וְאוּלָם
  choice: అయితే
  rationale: ముందటి వివరణకూ ప్రతిపాదిత కొత్త యుద్ధ వ్యూహానికీ మధ్య వ్యత్యాసాన్ని సహజంగా చూపుతుంది.
- source_word: נִלָּחֵם אִתָּם
  choice: మనం వారితో యుద్ధం చేస్తే
  rationale: సందర్భంలోని ప్రతిపాదనాత్మక భావాన్ని తెలుగులో షరతు వాక్యంగా సహజంగా అందిస్తుంది.
- source_word: בַּמִּישׁוֹר
  choice: మైదానంలో
  rationale: సమతల భూభాగాన్ని సూచించి ‘కొండలు’తో ఉన్న భౌగోళిక వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אִם לֹא
  choice: తప్పకుండా
  rationale: ఇక్కడ అక్షరార్థ నిషేధ షరతుకంటే బలమైన నిశ్చయోక్తిగా పనిచేసే హెబ్రీ ప్రయోగాన్ని వ్యక్తం చేస్తుంది.
- source_word: נֶחֱזַק מֵהֶם
  choice: మనం వారికంటే బలవంతులమవుతాం
  rationale: ముందటి חזק ప్రయోగంతో పదసామ్యాన్ని నిలుపుతూ తులనాత్మక బలాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు దేవుణ్ణి గురించి అరామీయులు చేసిన వర్ణన
  choice: వారి దేవుళ్లు కొండల దేవుళ్లు
  alternative: వారి దేవుడు కొండల దేవుడు
  rationale: ఈ మాటలు అరామీయుల బహుదేవతా అపార్థాన్ని నివేదిస్తున్నాయి, కథకుని ధార్మిక నిర్ధారణను కాదు. బహువచనాన్ని నిలపడం మూలంలోని ఉద్రిక్తతను, కథనంలోని వ్యంగ్యాన్ని సరిదిద్దకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘అరాము’, ‘సేవకులు’, ‘మైదానం’ వంటి పదాలు మూలానికి సన్నిహితంగా ఉండడంతో పాటు సాధారణ పాఠకులకు స్పష్టంగా ఉంటాయి.
