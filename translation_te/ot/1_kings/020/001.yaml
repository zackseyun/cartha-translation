revisions:
- from: అరాము రాజైన బెన్హదదు తన సైన్యమంతటినీ సమకూర్చాడు.[a] అతనితో ముప్పై ఇద్దరు రాజులు, గుర్రాలు, రథాలు ఉన్నాయి. తరువాత అతడు బయలుదేరి సమరయను ముట్టడించి, దానితో యుద్ధం చేశాడు.[b]
  to: అరాము రాజైన బెన్-హదదు తన సైన్యమంతటినీ సమకూర్చాడు; అతనితో ఉన్న ముప్పై ఇద్దరు రాజులతో, గుర్రాలతో, రథాలతో సమార్య మీదికి వెళ్లి దానిని ముట్టడించి దానిపై యుద్ధం చేశాడు.[a][b]
  rationale: 'సవరించిన పాఠం హీబ్రూ కథన క్రమాన్ని, బెన్హదదుతో కూడిన రాజులు మరియు సైనిక వనరుల సహచర్యాన్ని, అలాగే సమార్య మీదికి వెళ్లిన దిశాత్మక కదలికను స్పష్టంగా నిలుపుతుంది. పాదసూచిక గుర్తులు రెండూ ప్రధాన పాఠ్యంలో ఉన్నాయి: a ప్రారంభ అనుసంధానకానికి, b ‘అరాము’ స్థలనామానికి జతచేయబడ్డాయి.'
