reference: 1 Kings 20:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בֶן הֲדַ֣ד מֶֽלֶךְ אֲרָ֗ם קָבַץ֙ אֶת כָּל חֵיל֔/וֹ וּ/שְׁלֹשִׁ֨ים וּ/שְׁנַ֥יִם מֶ֛לֶךְ אִתּ֖/וֹ וְ/ס֣וּס וָ/רָ֑כֶב וַ/יַּ֗עַל וַ/יָּ֨צַר֙ עַל שֹׁ֣מְר֔וֹן וַ/יִּלָּ֖חֶם בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/001.yaml
  text: Ben-hadad king of Aram gathered all his army[a], and thirty-two kings with him, and horses and chariots[b]; then he went up and besieged Samaria and fought against it.
translation:
  language: te
  text: అరాము రాజైన బెన్-హదదు తన సైన్యమంతటినీ సమకూర్చాడు; అతనితో ఉన్న ముప్పై ఇద్దరు రాజులతో, గుర్రాలతో, రథాలతో సమార్య మీదికి వెళ్లి దానిని ముట్టడించి దానిపై యుద్ధం చేశాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు అరాము రాజైన బెన్-హదదు …” హీబ్రూ మూలంలో ప్రారంభ అనుసంధానకం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “అరాము” అనేది హీబ్రూ స్థలనామం; సంప్రదాయంగా దీనిని “సిరియా” అని అనువదించారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בֶן הֲדַד
  choice: బెన్హదదు
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం. ప్రారంభ ו అనేది కథన అనుసంధానకం; తెలుగులో విడిగా ‘మరియు’ అని పెట్టకుండా సహజ కథన ప్రవాహంలో వ్యక్తమైంది.
- source_word: מֶלֶךְ אֲרָם
  choice: అరాము రాజు
  rationale: తరువాతి ‘సిరియా’ అనే సంప్రదాయ భౌగోళిక పేరుకు బదులు హీబ్రూ స్థలనామమైన אֲרָם ను నేరుగా ‘అరాము’గా ఇచ్చాం.
- source_word: קָבַץ אֶת כָּל חֵילוֹ
  choice: తన సైన్యమంతటినీ సమకూర్చాడు
  rationale: קבץ అంటే సమకూర్చడం లేదా సమావేశపరచడం; חַיִל ఈ సైనిక సందర్భంలో ‘సైన్యం’ అనే సమష్టి అర్థాన్ని ఇస్తుంది.
- source_word: וּשְׁלֹשִׁים וּשְׁנַיִם מֶלֶךְ אִתּוֹ
  choice: అతనితో ముప్పై ఇద్దరు రాజులు
  rationale: ఆ రాజులు బెన్హదదుతో కలిసి ఉన్న మిత్రపాలకులని తెలిపే సహచర్య భావాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో నిలిపాం.
- source_word: וְסוּס וָרָכֶב
  choice: గుర్రాలు, రథాలు
  rationale: హీబ్రూలో ఏకవచన సమష్టి పదాలు ఉన్నా, తెలుగులో సైనిక వనరులను సహజంగా బహువచనంలో పేర్కొన్నాం.
- source_word: וַיַּעַל
  choice: తరువాత అతడు బయలుదేరి
  rationale: עלה యొక్క ప్రాథమిక భావం ‘పైకి వెళ్లడం’; ఇక్కడ నగరంపై సైనికంగా కదలివెళ్లడాన్ని సహజ తెలుగులో ‘బయలుదేరి’ అని ఇచ్చాం. ‘తరువాత’ వరుస కథనాన్ని సూచిస్తుంది.
- source_word: וַיָּצַר עַל שֹׁמְרוֹן
  choice: సమరయను ముట్టడించి
  rationale: צור על సైనిక సందర్భంలో ఒక పట్టణాన్ని చుట్టుముట్టి ముట్టడించడం అనే అర్థం ఇస్తుంది.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: దానితో యుద్ధం చేశాడు
  rationale: לחם ב అనే నిర్మాణం లక్ష్యానికి వ్యతిరేకంగా యుద్ధం చేయడాన్ని సూచిస్తుంది. ‘దానితో’ అనే రూపం నగరాన్ని సూచించే హీబ్రూ స్త్రీలింగ సర్వనామాన్ని తెలుగులో సహజంగా ప్రతిబింబిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి వాడాం. హీబ్రూ వరుస క్రియలను తెలుగులో చిన్న, సహజ వాక్యాలుగా అమర్చాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
