translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ రాజసభా సందర్భానికి తగిన గౌరవప్రదమైన శైలి వాడబడింది. హీబ్రూ నుడికారానికి పదపదార్థ అనువాదం చేయకుండా దాని అనిశ్చిత విస్తృతిని ‘ఏవేవో పనుల్లో’ ద్వారా నిలిపాం; న్యాయపరమైన పదజాలాన్ని స్పష్టంగా ఉంచాం.
