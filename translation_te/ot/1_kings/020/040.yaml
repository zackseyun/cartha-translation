source:
  edition: WLC
  text: וַ/יְהִ֣י עַבְדְּ/ךָ֗ עֹשֵׂ֥ה הֵ֛נָּה וָ/הֵ֖נָּה וְ/ה֣וּא אֵינֶ֑/נּוּ וַ/יֹּ֨אמֶר אֵלָ֧י/ו מֶֽלֶךְ יִשְׂרָאֵ֛ל כֵּ֥ן מִשְׁפָּטֶ֖/ךָ אַתָּ֥ה חָרָֽצְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/040.yaml
  text: And as your servant was busy here and there[a], he was gone. Then the king of Israel said to him, “So shall your judgment be[c][b]; you yourself have decided it.”
translation:
  language: te
  text: నీ సేవకుడు అటూ ఇటూ పనులు చేస్తూ ఉండగా[a], అతడు అక్కడ లేడు[b]. అప్పుడు ఇశ్రాయేలు రాజు అతనితో, “నీ తీర్పు ఇదే[c]; దాన్ని నీవే నిర్ణయించుకున్నావు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరొక విధంగా: “ఇదీ అదీ చేస్తూ ఉండగా.” ఈ హీబ్రూ నుడికారం వివిధ పనుల్లో లేదా దిశల్లో నిమగ్నమై ఉండడాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: 'అక్షరార్థంగా: “అతడు లేడు”; అంటే కాపలాలో ఉంచబడిన వ్యక్తి ఇక అక్కడ లేడు.'
    reason: lexical_alternative
  - marker: c
    text: “తీర్పు” అనే మాటకు ఇక్కడ “శిక్షా నిర్ణయం” లేదా “న్యాయనిర్ణయం” అనే భావం కూడా ఉండవచ్చు. ఆ వ్యక్తి చెప్పిన ప్రమాణాన్నే రాజు అతనికి వర్తింపజేస్తున్నాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ
  choice: నీ సేవకుడు
  rationale: రాజుతో వినయపూర్వకంగా తనను తాను సూచించుకునే సంబోధన; ఈ సందర్భంలో ‘నీ దాసుడు’ కంటే ఆధునిక తెలుగులో సహజంగా రాజసభ వినయాన్ని వ్యక్తం చేస్తుంది.
- source_word: עֹשֵׂה הֵנָּה וָהֵנָּה
  choice: ఏవేవో పనుల్లో నిమగ్నమై ఉండగా
  rationale: అటూ ఇటూ వివిధ పనులతో ఆక్రమింపబడి ఉండడాన్ని తెలిపే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; నిర్దిష్ట పనులను మూలం పేర్కొనకపోవడాన్ని నిలుపుతుంది.
- source_word: וְהוּא אֵינֶנּוּ
  choice: అతడు కనిపించకుండా పోయాడు
  rationale: అక్షరార్థంగా ‘అతడు లేడు’; కాపలాలో ఉన్న వ్యక్తి ఇక అక్కడ లేడనే సందర్భార్థాన్ని, అతడు ఎలా వెళ్లాడో అదనంగా నిర్దేశించకుండా తెలియజేస్తుంది.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: హీబ్రూ బిరుదు నిర్మాణానికి నేరుగా సరిపోయే ప్రామాణిక తెలుగు రూపం.
- source_word: כֵּן מִשְׁפָּטֶךָ
  choice: నీకు అదే తీర్పు
  rationale: రాజు ప్రకటించే న్యాయనిర్ణయపు భావాన్ని సహజమైన, గంభీరమైన తెలుగులో ఇస్తుంది.
- source_word: אַתָּה חָרָצְתָּ
  choice: దాన్ని నీవే నిర్ణయించుకున్నావు
  rationale: స్పష్టంగా ఉన్న אַתָּה యొక్క నొక్కిచెప్పే భావాన్ని ‘నీవే’ నిలుపుతుంది; חרץ యొక్క నిర్ణయించడం అనే న్యాయసంబంధ భావాన్ని వ్యక్తం చేస్తూ, ఆ తీర్పు అతనికే వర్తిస్తుందనే సందర్భాన్ని తెలుపుతుంది.
