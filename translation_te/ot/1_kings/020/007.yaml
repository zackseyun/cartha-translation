id: 1KI.20.7
reference: 1 Kings 20:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֤א מֶֽלֶךְ יִשְׂרָאֵל֙ לְ/כָל זִקְנֵ֣י הָ/אָ֔רֶץ וַ/יֹּ֨אמֶר֙ דְּעֽוּ נָ֣א וּ/רְא֔וּ כִּ֥י רָעָ֖ה זֶ֣ה מְבַקֵּ֑שׁ כִּֽי שָׁלַ֨ח אֵלַ֜/י לְ/נָשַׁ֤/י וּ/לְ/בָנַ/י֙ וּ/לְ/כַסְפִּ֣/י וְ/לִ/זְהָבִ֔/י וְ/לֹ֥א מָנַ֖עְתִּי מִמֶּֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/007.yaml
  text: Then the king of Israel called all the elders of the land and said, “Please know and see that this man is seeking trouble, for he sent to me for my wives, my sons, my silver, and my gold, and I did not withhold them from him.”
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు రాజు దేశంలోని పెద్దలందరినీ పిలిపించి, “దయచేసి గమనించి చూడండి—ఇతడు కీడునే కోరుతున్నాడు. అతడు నా భార్యలను, నా కుమారులను, నా వెండిని, నా బంగారాన్ని అడిగాడు; నేను వాటిని అతనికి ఇవ్వకుండా ఉంచలేదు” అని అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זִקְנֵי הָאָרֶץ
  choice: దేశంలోని పెద్దలు
  rationale: ఇది దేశపు సమాజ, పాలనా నాయకులను సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే రూపం.
- source_word: רָעָה זֶה מְבַקֵּשׁ
  choice: ఇతడు కీడు చేయాలని చూస్తున్నాడు
  rationale: רָעָה అనే పదంలోని ‘కీడు/హాని’ భావాన్ని నిలుపుతూ, מְבַקֵּשׁ యొక్క ఉద్దేశపూర్వక ప్రయత్న భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ‘కలహం’ అని మాత్రమే పరిమితం చేయదు.
- source_word: שָׁלַח אֵלַי לְנָשַׁי וּלְבָנַי וּלְכַסְפִּי וְלִזְהָבִי
  choice: నా భార్యలను, నా కుమారులను, నా వెండిని, నా బంగారాన్ని అడుగుతూ ఇతడు నాకు కబురు పంపాడు
  rationale: שָׁלַח אֵלַי యొక్క సందేశం పంపే భావాన్ని, לְ శ్రేణి సందర్భానుసారంగా అడిగిన వస్తువులు/వ్యక్తులను సూచించే భావాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: וְלֹא מָנַעְתִּי מִמֶּנּוּ
  choice: నేను వాటిని అతనికి ఇవ్వకుండా ఉంచలేదు
  rationale: ‘అతని నుండి నిలిపివేయలేదు’ అనే మూలపాఠ నిర్మాణాన్ని తెలుగులో అర్థవంతంగా, సహజంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: רָעָה యొక్క భావపరిధి
  choice: కీడు
  alternative: కలహం / ఇబ్బంది
  rationale: హీబ్రూ పదం నైతిక కీడు, హాని, విపత్తు వంటి విస్తృత భావాలను కలిగి ఉంది. సందర్భంలో రాజు బెన్‌హదదు ఉద్దేశాన్ని దుష్టమైనదిగా గుర్తిస్తున్నందున ‘కీడు’ ఆ విస్తృతిని మెరుగ్గా నిలుపుతుంది; ప్రత్యేక సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజసభ సందర్భానికి తగిన గౌరవప్రదమైన, కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘దయచేసి గమనించి చూడండి’ ద్వారా דְּעוּ־נָא וּרְאוּ లోని విజ్ఞప్తి మరియు ద్వంద్వ ఆజ్ఞ భావాలు నిలుపబడ్డాయి.
