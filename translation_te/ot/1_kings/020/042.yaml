source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה יַ֛עַן שִׁלַּ֥חְתָּ אֶת אִישׁ חֶרְמִ֖/י מִ/יָּ֑ד וְ/הָיְתָ֤ה נַפְשְׁ/ךָ֙ תַּ֣חַת נַפְשׁ֔/וֹ וְ/עַמְּ/ךָ֖ תַּ֥חַת עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/042.yaml
  text: 'And he said to him[a], “Thus says Yahweh: Because you have let go from your hand the man I had devoted to destruction, your life shall be for his life, and your people for his people.”'
translation:
  language: te
  text: 'అప్పుడు అతడు అతనితో ఇలా అన్నాడు: “యెహోవా ఇలా చెబుతున్నాడు: ‘నేను నాశనానికి అంకితం చేసిన మనిషిని నీవు నీ చేతిలోనుండి విడిచిపెట్టావు కాబట్టి, అతని ప్రాణానికి బదులుగా నీ ప్రాణం పోతుంది; అతని ప్రజలకు బదులుగా నీ ప్రజలు పోతారు.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నేను నాశనానికి అంకితం చేసిన మనిషి” అనే మాటకు “నా నిషేధం కింద ఉన్న మనిషి” అని కూడా అనువదించవచ్చు. ఇక్కడి హెబ్రీ పదం దైవిక తీర్పు కింద నాశనానికి ప్రత్యేకింపబడిన వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని తెలుగు బైబిలు పఠనంలో సుపరిచితమైన రూపంలో వ్యక్తపరుస్తూ, సాధారణ బిరుదుతో భర్తీ చేయలేదు.
- source_word: יַעַן
  choice: కాబట్టి
  rationale: ముందున్న చర్యే తరువాత ప్రకటించే తీర్పుకు కారణమని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שִׁלַּחְתָּ ... מִיָּד
  choice: నీవు నీ చేతిలోనుండి విడిచిపెట్టావు
  rationale: బందీని తన అధీనంనుండి విడుదల చేయడాన్ని సూచించే హెబ్రీయ క్రియను, ‘చేతిలోనుండి’ అనే అధీన/నియంత్రణ నుడికారాన్ని కాపాడుతూ అనువదిస్తుంది; మూలంలో లేని ‘తప్పించుకొనేలా చేశావు’ అనే భావాన్ని చేర్చదు.
- source_word: אִישׁ חֶרְמִי
  choice: నేను నాశనానికి అంకితం చేసిన మనిషి
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయాన్ని ‘నేను’తో స్పష్టపరుస్తూ, חֵרֶם పదంలోని దైవిక తీర్పు కింద నాశనానికి ప్రత్యేకింపబడిన భావాన్ని నిలుపుతుంది.
- source_word: נַפְשְׁךָ תַּחַת נַפְשׁוֹ
  choice: అతని ప్రాణానికి బదులుగా నీ ప్రాణం
  rationale: נֶפֶשׁ ఇక్కడ ‘ఆత్మ’ కంటే జీవితం/ప్రాణాన్ని సూచిస్తుంది; תַּחַת లోని ప్రతిస్థాపన భావాన్ని ‘బదులుగా’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְעַמְּךָ תַּחַת עַמּוֹ
  choice: అతని ప్రజలకు బదులుగా నీ ప్రజలు
  rationale: ముందటి ప్రాణం-ప్రాణం వాక్యభాగంతో ఉన్న సమాంతర నిర్మాణాన్ని, ప్రతిస్థాపనాత్మక తీర్పును కాపాడుతుంది.
- source_word: כֹּה אָמַר
  choice: ఇలా చెబుతున్నాడు
  rationale: ప్రవక్తీయ సందేశ సూత్రాన్ని గౌరవప్రదమైన, ప్రస్తుత తెలుగు ప్రయోగంలో అందిస్తుంది.
theological_decisions:
- issue: తీర్పు ప్రకటనలో חֵרֶם పదజాలం
  choice: నేను నాశనానికి అంకితం చేసిన
  alternative: నా నిషేధం కింద ఉన్న / నేను నాశనానికి నిర్ణయించిన
  rationale: ఇది కేవలం వ్యక్తిగత శత్రుత్వం లేదా సాధారణ మరణశిక్ష కాదు; దైవిక తీర్పు కింద నాశనానికి ప్రత్యేకింపబడిన స్థితిని సూచిస్తుంది. ‘అంకితం చేసిన’ ఆ ప్రత్యేకింపు భావాన్ని ఉంచుతుంది; ‘నాశనానికి’ దాని సందర్భోచిత గమ్యాన్ని స్పష్టం చేస్తుంది.
- issue: תַּחַת ద్వారా వ్యక్తమైన తీర్పు సంబంధం
  choice: బదులుగా
  alternative: స్థానంలో
  rationale: రాజు విడిచిపెట్టిన వ్యక్తి ప్రాణం మరియు ప్రజలకు ప్రతిగా రాజు ప్రాణం, ప్రజలు తీర్పుకు లోనవుతారని తెలియజేస్తుంది; దీనిని సిద్ధాంతపరంగా మరింత వివరించకుండా మూలంలోని గట్టి సమాంతరతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రవక్తీయ శైలి ఉపయోగించబడింది. ‘నీ చేతిలోనుండి’ అనే హెబ్రీ నుడికారాన్ని అర్థమయ్యే విధంగా అలాగే ఉంచాం. తీర్పు వాక్యానికి తగిన నిశ్చిత భావం కోసం ‘పోవాలి’ వాడాం; వాక్య సమాంతరతను కాపాడాం. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
