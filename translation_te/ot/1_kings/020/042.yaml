revisions:
- from: 'అప్పుడు అతడు అతనితో ఇలా అన్నాడు: “యెహోవా ఇలా చెబుతున్నాడు: ‘నేను నాశనానికి అంకితం చేసిన మనిషిని నీవు నీ చేతిలోనుండి విడిచిపెట్టావు కాబట్టి, అతని ప్రాణానికి బదులుగా నీ ప్రాణం, అతని ప్రజలకు బదులుగా నీ ప్రజలు పోవాలి.’”[a]'
  to: 'అప్పుడు అతడు అతనితో ఇలా అన్నాడు: “యెహోవా ఇలా చెబుతున్నాడు: ‘నేను నాశనానికి అంకితం చేసిన మనిషిని నీవు నీ చేతిలోనుండి విడిచిపెట్టావు కాబట్టి, అతని ప్రాణానికి బదులుగా నీ ప్రాణం పోతుంది; అతని ప్రజలకు బదులుగా నీ ప్రజలు పోతారు.’”[a]'
  rationale: తీర్పు వాక్యంలోని భవిష్యత్ ఫలితాన్ని తెలుగులో స్పష్టంగా వ్యక్తపరచడానికి మాత్రమే ‘పోవాలి’ని ‘పోతుంది/పోతారు’గా మార్చాం. మిగతా పదజాలం మూలార్థం, ప్రవక్తీయ రిజిస్టర్, మరియు పాదసూచికలోని חֵרֶם ప్రత్యామ్నాయాన్ని సరిగా నిలుపుతోంది.
  reviewer_model: gpt-5.6-terra
