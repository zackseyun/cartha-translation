  text: וַ/יֵּ֨לֶךְ֙ הַ/נָּבִ֔יא וַ/יַּעֲמֹ֥ד לַ/מֶּ֖לֶךְ עַל הַ/דָּ֑רֶךְ וַ/יִּתְחַפֵּ֥שׂ בָּ/אֲפֵ֖ר עַל עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/038.yaml
  text: So the prophet went and stood by the road for the king[a], and disguised himself with a bandage over his eyes.
translation:
  language: te
  text: అప్పుడు ఆ ప్రవక్త వెళ్లి, రాజు కోసం దారి పక్కన నిలబడ్డాడు. అతడు తన కళ్లపై కట్టు[a] వేసుకొని మారువేషం వేసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధాన్ని సాధారణ అర్థంలో అనువదిస్తే, “తన కళ్లపై బూడిదతో” అని వస్తుంది. అయితే ఈ సందర్భంలో అది మారువేషం కోసం కళ్లపై ఉంచుకున్న కట్టు లేదా పట్టీని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: అప్పుడు ... వెళ్లి
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ సహజంగా సంఘటనల క్రమాన్ని తెలియజేస్తుంది.
- source_word: הַנָּבִיא
  choice: ఆ ప్రవక్త
  rationale: నిర్దిష్ట నామవాచకాన్ని, ముందే ప్రస్తావించబడిన ప్రవక్తను సూచించే సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וַיַּעֲמֹד
  choice: నిలబడ్డాడు
  rationale: మూలంలోని సాధారణ క్రియను అనవసరమైన వ్యాఖ్యానం లేకుండా సహజంగా అనువదిస్తుంది.
- source_word: לַמֶּלֶךְ
  choice: రాజు కోసం
  rationale: రాజు వచ్చే దారిలో అతన్ని ఎదుర్కొనే ఉద్దేశంతో ప్రవక్త నిలబడిన సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל הַדָּרֶךְ
  choice: దారి పక్కన
  rationale: ఇక్కడ עַל అనేది దారికి ఆనుకొని లేదా దారి వద్ద నిలబడటాన్ని సూచించగలదు; తెలుగులో ఈ దృశ్యానికి ‘దారి పక్కన’ సహజంగా ఉంటుంది.
- source_word: וַיִּתְחַפֵּשׂ
  choice: మారువేషం వేసుకున్నాడు
  rationale: హిత్పయేల్ రూపం తనను గుర్తుపట్టకుండా చేసుకోవడం లేదా మారువేషం ధరించడాన్ని సూచిస్తుంది.
- source_word: בָּאֲפֵר
  choice: ఒక కట్టు
  rationale: మసొరా స్వరచిహ్నాల ప్రకారం ఈ పదానికి సాధారణ అర్థం ‘బూడిద’; అయితే కళ్ల మీద ఉంచడం, తరువాత దానిని తొలగించడం అనే సందర్భం దానిని ముఖాన్ని కప్పే కట్టు లేదా పట్టీగా అర్థం చేసుకునే అవకాశాన్ని బలపరుస్తుంది. పాఠంలోని సందిగ్ధతను పాదసూచికలో నిలిపి, ప్రధాన వాక్యంలో సందర్భానికి సరిపోయే అర్థాన్ని ఇచ్చాం.
- source_word: עַל עֵינָיו
  choice: తన కళ్ల మీద
  rationale: స్థానాన్ని సూచించే మూలపదబంధాన్ని సహజమైన తెలుగులో నేరుగా అందిస్తుంది.
