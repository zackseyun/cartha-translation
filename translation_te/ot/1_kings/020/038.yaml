translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. వివాదాస్పదమైన בָּאֲפֵר అర్థాన్ని ప్రధాన పాఠంలో సందర్భానుగుణంగా ఇచ్చి, హీబ్రూ అక్షరార్థాన్ని పాదసూచికలో స్పష్టంగా నిలిపాం.
