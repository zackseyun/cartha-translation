id: 1KI.20.4
reference: 1 Kings 20:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֤עַן מֶֽלֶךְ יִשְׂרָאֵל֙ וַ/יֹּ֔אמֶר כִּ/דְבָרְ/ךָ֖ אֲדֹנִ֣/י הַ/מֶּ֑לֶךְ לְ/ךָ֥ אֲנִ֖י וְ/כָל אֲשֶׁר לִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/004.yaml
  text: The king of Israel answered and said[a], “According to your word, my lord the king, I am yours, and all that is mine.”
translation:
  language: te
  text: 'అప్పుడు ఇశ్రాయేలు రాజు ఇలా జవాబిచ్చాడు: “నీ మాట ప్రకారమే, నా ప్రభువైన రాజా; నేను నీ వాడిని, నాకున్నదంతా నీదే.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా ప్రభువైన రాజా, నీవు చెప్పినట్టే; నేను నీకు చెందినవాడిని, నాకున్నదంతా నీదే.”
    reason: כִּדְבָרְךָ మరియు לְךָ אֲנִי యొక్క మరింత వివరణాత్మకమైన సహజ తెలుగు ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: ఇలా జవాబిచ్చాడు
  rationale: హీబ్రూ కథనంలో సమాధానాన్ని పరిచయం చేసే జంట క్రియలను సహజమైన ఆధునిక తెలుగులో ఒకే మాటల పరిచయంగా అందిస్తుంది; జవాబు భావాన్ని నిలుపుతుంది.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּדְבָרְךָ
  choice: నీ మాట ప్రకారమే
  rationale: כְּ మరియు דָּבָר యొక్క రూపాన్ని సమీపంగా అనుసరిస్తూ, అంగీకారం మరియు విధేయతతో కూడిన సూత్రబద్ధ స్వరాన్ని కాపాడుతుంది.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజా
  rationale: మానవ రాజుకు చేసే గౌరవపూర్వక సంబోధనగా אדניని చూపిస్తుంది; దైవనామార్థాన్ని సూచించకుండా స్వామ్యసూచక భావాన్నీ రాజబిరుదునూ నిలుపుతుంది.
- source_word: לְךָ אֲנִי
  choice: నేను నీవే
  rationale: దాత్యర్థక సర్వనామం వ్యక్తం చేసే అధీనత లేదా స్వామ్యాన్ని సంక్షిప్తంగా నిలుపుతుంది; తరువాతి సమాంతర వాక్యంతో కలిపి ‘నేనూ ... నీవే’గా సహజంగా ఉంటుంది.
- source_word: וְכָל אֲשֶׁר לִי
  choice: నాకున్నదంతా
  rationale: వ్యక్తికి చెందిన సమస్తాన్ని విస్తృతంగా సూచించే హీబ్రూ భావాన్ని సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: మానవ రాజును ఉద్దేశించిన אֲדֹנִי అనువాదం
  choice: నా ప్రభువైన
  alternative: నా యజమానివైన
  rationale: ఇక్కడ సంబోధించబడేది బెన్హదదు అనే మానవ రాజు. కాబట్టి పదాన్ని దైవబిరుదుగా కాక రాజసభకు తగిన గౌరవసూచక సంబోధనగా అనువదించాం.
- issue: לְךָ אֲנִי లోని అధీనత లేదా స్వామ్య భావం
  choice: నేనూ ... నీవే
  alternative: నేను నీకు చెందినవాడిని
  rationale: హీబ్రూ మాటలోని సంక్షిప్తతను, రాజు లొంగుబాటును నిలుపుతూ, అది కేవలం సహకారమా లేక సంపూర్ణ అధీనతా అనే భావవ్యాప్తిని అవసరానికి మించి నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజసభ గౌరవభావం మరియు లొంగుబాటు స్వరాన్ని కాపాడేలా గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే పదప్రయోగం. ప్రధాన పాఠంలో హీబ్రూ సంక్షిప్త సమాంతర నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపాం.
