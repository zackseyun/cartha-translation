source:
  edition: WLC
  text: וַ/יֵּצְא֗וּ נַעֲרֵ֛י שָׂרֵ֥י הַ/מְּדִינ֖וֹת בָּ/רִֽאשֹׁנָ֑ה וַ/יִּשְׁלַ֣ח בֶּן הֲדַ֗ד וַ/יַּגִּ֤ידוּ ל/וֹ֙ לֵ/אמֹ֔ר אֲנָשִׁ֕ים יָצְא֖וּ מִ/שֹּׁמְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/017.yaml
  text: Then the young men of the commanders of the provinces went out first[a], and Ben-hadad sent, and they reported to him, saying, “Men have come out from Samaria.”
translation:
  language: te
  text: అప్పుడు ప్రాంతాల అధిపతుల యువకులు ముందుగా బయలుదేరారు. బెన్-హదదు పంపించాడు; వారు అతనికి, “షోమ్రోను నుండి మనుష్యులు బయలుదేరారు” అని తెలియజేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַעֲרֵי
  choice: యువకులు
  rationale: נַעַר అనే పదానికి యువకుడు, సేవకుడు, పరిచారకుడు అనే అర్థాలు రావచ్చు. ఇక్కడ దాని ప్రాథమిక అర్థాన్ని నిలుపుతూ, సైనిక సందర్భానికి సహజంగా ఉండే ‘యువకులు’ వాడబడింది.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: ప్రాంతాల అధిపతులు
  rationale: שָׂרִים అనేది అధిపతులు, అధికారులు లేదా సేనాధికారులను సూచించగలదు; מְדִינוֹת పరిపాలనా ప్రాంతాలను సూచిస్తుంది. సందర్భాన్ని అతిగా సైనికీకరించకుండా నిర్మాణాన్ని దగ్గరగా నిలుపుతుంది.
- source_word: בָּרִאשֹׁנָה
  choice: ముందుగా
  rationale: క్రమంలో వీరే మొదట బయలుదేరారని సూచిస్తుంది; ‘మొదటి దళంగా’ వంటి అదనపు సైనిక వివరణను చేర్చదు.
- source_word: וַיִּשְׁלַח
  choice: మనుష్యులను పంపించాడు
  rationale: హీబ్రూలో క్రియకు కర్మ స్పష్టంగా లేదు. తరువాత నివేదిక అందినందున పంపబడినవారు మనుష్యులని తెలుగులో సహజంగా వ్యక్తం చేయబడింది; వారు ప్రత్యేకంగా గూఢచారులని మూలపాఠం చెప్పదు.
- source_word: וַיַּגִּידוּ לוֹ לֵאמֹר
  choice: వారు అతనికి … అని తెలియజేశారు
  rationale: నివేదికను పరిచయం చేసే హీబ్రూ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲנָשִׁים
  choice: కొందరు మనుష్యులు
  rationale: అనిర్దిష్ట బహువచనాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, పురుషులను సూచించే మూలపద భావాన్ని నిలుపుతుంది.
- source_word: יָצְאוּ מִשֹּׁמְרוֹן
  choice: షోమ్రోను నుండి … బయలుదేరారు
  rationale: నగరం నుండి బయటికి రావడం అనే పూర్తయిన చర్యను నేరుగా వ్యక్తం చేస్తుంది.
- source_word: בֶּן הֲדַד
  choice: బెన్-హదదు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ధ్వన్యనుసారంగా లిప్యంతరీకరించింది.
