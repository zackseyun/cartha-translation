id: 1KI.20.13
reference: 1 Kings 20:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה נָבִ֣יא אֶחָ֗ד נִגַּשׁ֮ אֶל אַחְאָ֣ב מֶֽלֶךְ יִשְׂרָאֵל֒ וַ/יֹּ֗אמֶר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הְֽ/רָאִ֔יתָ אֵ֛ת כָּל הֶ/הָמ֥וֹן הַ/גָּד֖וֹל הַ/זֶּ֑ה הִנְ/נִ֨י נֹתְנ֤/וֹ בְ/יָֽדְ/ךָ֙ הַ/יּ֔וֹם וְ/יָדַעְתָּ֖ כִּֽי אֲנִ֥י יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/013.yaml
  text: 'And behold[a], a certain prophet came near to Ahab king of Israel and said, “Thus says Yahweh: Have you seen all this great multitude? Behold, I am giving it into your hand today, and you shall know that I am Yahweh.”'
translation:
  language: te
  text: 'ఇదిగో, ఒక ప్రవక్త ఇశ్రాయేలు రాజైన అహాబు దగ్గరకు వచ్చి ఇలా అన్నాడు: “యాహ్వే ఇలా అంటున్నాడు: ‘ఈ గొప్ప జనసమూహమంతటినీ[a] చూశావా? ఇదిగో, ఈ రోజే దాన్ని నీ చేతికి అప్పగిస్తున్నాను; నేనే యాహ్వే అని నీవు తెలుసుకుంటావు.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఈ విస్తారమైన సైన్యమంతటినీ,” “ఈ పెద్ద గుంపంతటినీ.” హీబ్రూ పదం పెద్ద జనసమూహాన్ని లేదా దండును సూచించగలదు; ఇక్కడ అది శత్రు సైన్యాన్ని సూచిస్తోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: కథనంలో అకస్మాత్తుగా ప్రవక్త ప్రత్యక్షమవడాన్ని, పాఠకుని దృష్టిని ఆకర్షించే హీబ్రూ సూచక పదపు బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: נָבִיא אֶחָד
  choice: ఒక ప్రవక్త
  rationale: అక్షరార్థంగా ‘ఒక ప్రవక్త’; ఇక్కడ పేరు చెప్పని వ్యక్తిని పరిచయం చేస్తోంది. ‘ఒకానొక ప్రవక్త’ కంటే ‘ఒక ప్రవక్త’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: נִגַּשׁ אֶל
  choice: దగ్గరకు వచ్చి
  rationale: ‘సమీపించు’ అనే మూల భావాన్ని సాధారణ పాఠకులకు సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: כֹּה אָמַר יְהוָה
  choice: యాహ్వే ఇలా అంటున్నాడు
  rationale: ప్రవక్త ద్వారా వచ్చే దైవసందేశపు సాంప్రదాయ సూత్రాన్ని వర్తమాన బలంతో తెలుగులో సహజంగా అందిస్తుంది.
- source_word: הֲרָאִיתָ
  choice: చూశావా?
  rationale: ప్రశ్నార్థక హేతో కూడిన సంపూర్ణ క్రియను, అహాబు ఎదుట ఇప్పటికే కనిపిస్తున్న సైనిక బలాన్ని సూచించే సహజ ప్రశ్నగా అనువదిస్తుంది.
- source_word: כָּל הֶהָמוֹן הַגָּדוֹל הַזֶּה
  choice: ఈ గొప్ప జనసమూహమంతటినీ
  rationale: הָמוֹן అనే పదం పెద్ద గుంపు లేదా సమూహాన్ని సూచిస్తుంది. సందర్భంలో అది శత్రు సైన్యమే అయినా, ప్రధాన పాఠ్యంలో దానిని మరీ నిర్దిష్టం చేయకుండా హీబ్రూ పదపు విస్తృతిని నిలిపింది.
- source_word: הִנְנִי נֹתְנוֹ
  choice: ఇదిగో, ... దాన్ని ... అప్పగిస్తున్నాను
  rationale: హీబ్రూలోని ఉద్ఘాటనను, వెంటనే లేదా నిశ్చయంగా జరగబోయే దైవకార్యాన్ని నిలుపుతుంది. ‘అప్పగిస్తున్నాను’ అనేది ఈ సైనిక సందర్భంలో ‘ఇవ్వడం’ యొక్క భావాన్ని సహజంగా తెలుపుతుంది.
- source_word: בְיָדְךָ
  choice: నీ చేతికి
  rationale: ఎవరినైనా మరొకరి అధికారానికి అప్పగించడాన్ని సూచించే హీబ్రూ నుడికారాన్ని తెలుగులో కూడా అర్థమయ్యే సమాన నుడికారంతో నిలుపుతుంది.
- source_word: וְיָדַעְתָּ כִּי אֲנִי יְהוָה
  choice: నేనే యాహ్వే అని నీవు తెలుసుకుంటావు
  rationale: దైవ విమోచన కార్యం ద్వారా అహాబు యాహ్వే ఎవరో గుర్తించే ఫలితాన్ని వ్యక్తం చేస్తుంది; ‘నేనే’ ద్వారా אֲנִי లోని వ్యక్తిగత ఉద్ఘాటన నిలుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠ్యంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునికంగా విస్తృతంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- issue: וְיָדַעְתָּ כִּי אֲנִי יְהוָה అనే గుర్తింపు సూత్రపు భావం
  choice: దైవకార్యం ద్వారా అహాబు యాహ్వేను గుర్తిస్తాడనే ప్రకటన
  alternative: యాహ్వే సార్వభౌమత్వాన్ని సంపూర్ణంగా, అనుభవపూర్వకంగా అంగీకరిస్తాడనే విస్తృత భావం
  rationale: ‘తెలుసుకుంటావు’ అనే మూలపాఠ్య పదాన్ని నిలిపి, అహాబు విశ్వాసం లేదా సంపూర్ణ విధేయత గురించి పాఠ్యంలో లేని నిర్ణయాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకులకు సులభమైన శైలి. ప్రవక్త సందేశంలోని గంభీరత కోసం ప్రత్యక్ష వాక్య నిర్మాణం, ‘ఇదిగో’ అనే దృష్ట్యాకర్షక పదం నిలిపివేయబడ్డాయి.
