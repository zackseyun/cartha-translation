  to: వీరు వారికి ఎదురుగా ఏడు రోజులపాటు శిబిరాలు వేసుకున్నారు. ఏడవ రోజున యుద్ధం సమీపించింది; ఇశ్రాయేలు కుమారులు[a] ఒక్క రోజులో అరాము వారి లక్షమంది కాలినడక సైనికులను[c] కొట్టి పడగొట్టారు[b].
