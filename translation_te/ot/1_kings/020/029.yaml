source:
  edition: WLC
  text: וַֽ/יַּחֲנ֧וּ אֵ֦לֶּה נֹ֥כַח אֵ֖לֶּה שִׁבְעַ֣ת יָמִ֑ים וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י וַ/תִּקְרַב֙ הַ/מִּלְחָמָ֔ה וַ/יַּכּ֨וּ בְנֵֽי יִשְׂרָאֵ֧ל אֶת אֲרָ֛ם מֵאָה אֶ֥לֶף רַגְלִ֖י בְּ/י֥וֹם אֶחָֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/029.yaml
  text: And these camped opposite those for seven days[a]. Then on the seventh day the battle drew near[c][b], and the sons of Israel struck down Aram—one hundred thousand foot soldiers in one day.
translation:
  language: te
  text: వీరు వారికి ఎదురుగా ఏడు రోజులపాటు శిబిరాలు వేసుకున్నారు. ఏడవ రోజున యుద్ధం సమీపించింది; ఇశ్రాయేలు కుమారులు[a] ఒక్క రోజులో అరాము వారి లక్షమంది కాలినడక సైనికులను[c] కొట్టి పడగొట్టారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలీయులు.” హెబ్రీలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “అరామీయులు.” హెబ్రీలోని “అరాము” అనే పేరు అరామీయుల రాజ్యాన్ని లేదా ప్రజలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా “కాల్బలం.” హెబ్రీలో అక్షరార్థంగా కాలినడకన పోరాడే దళాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: శిబిరాలు వేసుకున్నారు
  rationale: חנה అంటే శిబిరం ఏర్పాటు చేసుకోవడం. ఆధునిక తెలుగులో సహజంగా, సైనిక సందర్భానికి తగినట్లుగా ఉంది.
- source_word: אֵלֶּה נֹכַח אֵלֶּה
  choice: వీరు వారికి ఎదురుగా
  rationale: నֹכַח సూచించే ముఖాముఖి స్థలస్థితిని, హెబ్రీ వాక్యంలోని సంక్షిప్తమైన రెండు పక్షాల వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: שִׁבְעַת יָמִים
  choice: ఏడు రోజులపాటు
  rationale: కాలవ్యవధిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: ఏడవ రోజున
  rationale: హెబ్రీ కథన సూత్రాన్ని అనవసరంగా పదేపదే అనువదించకుండా కాలసూచనను స్పష్టంగా ఉంచుతుంది.
- source_word: וַתִּקְרַב הַמִּלְחָמָה
  choice: యుద్ధం మొదలైంది
  rationale: קרב యొక్క మూలార్థం ‘దగ్గరకు రావడం’; ఈ యుద్ధ సందర్భంలో రెండు సేనలు తలపడి పోరు ఆరంభమైన భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וַיַּכּוּ
  choice: హతమార్చారు
  rationale: נכה అంటే కొట్టడం లేదా దెబ్బతీయడం; ఇక్కడ లక్షమంది సైనికులపై జరిగిన యుద్ధఫలితాన్ని బట్టి ప్రాణాంతక భావం సందర్భంలో స్పష్టంగా ఉంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: ‘ఇశ్రాయేలు కుమారులు’ అనే హెబ్రీ పురుష బహువచన రూపాన్ని, ఇక్కడి యోధుల సందర్భాన్ని నిలుపుతుంది.
- source_word: אֲרָם
  choice: అరాము
  rationale: తరువాతి కాలపు భౌగోళిక పేరు ‘సిరియా’ను చేర్చకుండా హెబ్రీ నామాన్ని నిలుపుతుంది; సందర్భంలో ఇది అరాము ప్రజలను లేదా రాజ్యాన్ని సూచించవచ్చు.
- source_word: מֵאָה אֶלֶף
  choice: లక్షమందిని
  rationale: మానవ సైనికుల సంఖ్యను తెలుగులో సహజమైన సంఖ్యారూపంతో తెలియజేస్తుంది.
- source_word: רַגְלִי
  choice: కాల్బలానికి చెందిన
  rationale: కాలినడకన పోరాడే సైనికులను సూచించే సైనిక పదార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בְּיוֹם אֶחָד
  choice: ఒక్క రోజులోనే
  rationale: సంహారం పూర్తయిన కాలవ్యవధిని, אֶחָד లోని సంఖ్యాప్రాధాన్యాన్ని సహజంగా బలపరుస్తుంది.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל లోని పురుషవాచక రూపం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు
  rationale: మూలంలోని అక్షరార్థ పురుషవాచకాన్ని, యుద్ధంలో పాల్గొన్న సైనికుల సందర్భాన్ని నిలుపుతూ, ప్రత్యామ్నాయ సహజ రూపాన్ని పాదసూచికలో ఇస్తుంది.
- issue: אֲרָם ను స్థలనామంగా లేదా ప్రజలనామంగా అర్థం చేసుకోవడం
  choice: అరాము
  alternative: అరామీయులు
  rationale: మూలంలోని నామాన్ని యథాతథంగా ఉంచి, అది రాజ్యాన్నో ప్రజలనో సూచించగల సందర్భసిద్ధమైన సందిగ్ధతను పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలి వాడబడింది. ‘శిబిరాలు వేసుకున్నారు,’ ‘కాల్బలం’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి సైనిక సందర్భాన్ని నిలుపుతాయి. పాదసూచిక గుర్తులు అవి వివరిస్తున్న పదాల వెంటనే ఉంచబడ్డాయి.
