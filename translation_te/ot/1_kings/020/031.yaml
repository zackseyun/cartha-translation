id: 1KI.20.31
reference: 1 Kings 20:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָי/ו֮ עֲבָדָי/ו֒ הִנֵּֽה נָ֣א שָׁמַ֔עְנוּ כִּ֗י מַלְכֵי֙ בֵּ֣ית יִשְׂרָאֵ֔ל כִּֽי מַלְכֵ֥י חֶ֖סֶד הֵ֑ם נָשִׂ֣ימָה נָּא֩ שַׂקִּ֨ים בְּ/מָתְנֵ֜י/נוּ וַ/חֲבָלִ֣ים בְּ/רֹאשֵׁ֗/נוּ וְ/נֵצֵא֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל אוּלַ֖י יְחַיֶּ֥ה אֶת נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/031.yaml
  text: And his servants said to him, “Look, please, we have heard that the kings of the house of Israel are merciful kings. Please let us put sackcloth around our waists and ropes on our heads, and let us go out to the king of Israel; perhaps he will let you live.”
translation:
  language: te
  text: 'అప్పుడు అతని సేవకులు అతనితో ఇలా అన్నారు: “ఇదిగో, దయచేసి వినండి: ఇశ్రాయేలు వంశపు రాజులు దయగల రాజులని మేము విన్నాం. దయచేసి, మన నడుములకు గోనెపట్టలు కట్టుకొని, మన తలలపై తాళ్లు వేసుకొని ఇశ్రాయేలు రాజు దగ్గరికి వెళ్దాం. బహుశా అతడు నీ ప్రాణాన్ని కాపాడవచ్చు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְכֵי בֵית יִשְׂרָאֵל
  choice: ఇశ్రాయేలు వంశపు రాజులు
  rationale: בֵּית యొక్క రాజవంశ/రాజ్యవంశ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מַלְכֵי חֶסֶד
  choice: దయగల రాజులు
  rationale: חֶסֶד ఇక్కడ శత్రువుపట్ల కరుణ లేదా దయ చూపే స్వభావాన్ని సూచిస్తుంది; నిబంధనాత్మక ప్రత్యేకార్థాన్ని బలవంతంగా చేర్చదు.
- source_word: שַׂקִּים בְּמָתְנֵינוּ
  choice: మన నడుములకు గోనెపట్టలు కట్టుకొని
  rationale: అవమానం, శోకం లేదా లొంగుబాటును సూచించే sackclothను సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: וַחֲבָלִים בְּרֹאשֵׁנוּ
  choice: మన తలలపై తాళ్లు వేసుకొని
  rationale: హీబ్రూ శరీరస్థానాన్ని యథాతథంగా ఉంచి, దీని సంకేతార్థాన్ని పాఠ్యంలో ఊహించి వివరించదు.
- source_word: יְחַיֶּה אֶת נַפְשֶׁךָ
  choice: నీ ప్రాణాన్ని కాపాడవచ్చు
  rationale: పదశః ‘నీ ప్రాణాన్ని బ్రతికించవచ్చు’; సందర్భంలో చంపకుండా విడిచిపెట్టడం అనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: חֶסֶד యొక్క భావపరిధి
  choice: దయగల
  alternative: కృపగల / విశ్వసనీయ ప్రేమగల
  rationale: ఈ సందర్భం ఓడిపోయిన శత్రురాజుపట్ల కనికరం చూపుతారనే విన్నపం గురించి; ప్రత్యేక నిబంధనాత్మక భావాన్ని దిగుమతి చేయలేదు.
- issue: తాళ్ల సంకేతార్థం
  choice: సంకేతాన్ని వివరణ లేకుండా ప్రత్యక్షంగా అనువదించడం
  alternative: లొంగుబాటుకు సూచనగా తాళ్లు
  rationale: మూలపాఠ్యం తాళ్ల అర్థాన్ని స్పష్టంగా వివరించదు; అందువల్ల నిజమైన చారిత్రక అస్పష్టతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సామాన్య పాఠకులకు సులభమైన వాక్యనిర్మాణం. נָא పునరావృతాన్ని తెలుగులో అసహజంగా రెండుసార్లు పలకకుండా ‘ఇదిగో’ మరియు ‘దయచేసి’ ద్వారా విన్నప స్వరాన్ని నిలిపాం. ఎటువంటి పాదసూచికలు అవసరం లేదు.
