  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה עֲשֵׂ֑ה הָסֵ֤ר הַ/מְּלָכִים֙ אִ֣ישׁ מִ/מְּקֹמ֔/וֹ וְ/שִׂ֥ים פַּח֖וֹת תַּחְתֵּי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/024.yaml
  text: 'And do this thing: remove the kings[a], each from his place, and put governors in their place.'
translation:
  language: te
  text: 'నీవు ఈ పని చేయి: ప్రతి రాజును అతని స్థానం నుండి తొలగించి, వారి స్థానంలో ప్రాంత పాలకులను నియమించు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת הַדָּבָר הַזֶּה עֲשֵׂה
  choice: నీవు ఈ పని చేయి
  rationale: ముందుకు తెచ్చిన కర్మతో కూడిన ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; דָּבָר ఇక్కడ మాటకన్నా పని లేదా చర్యను సూచిస్తుంది.
- source_word: הָסֵר
  choice: తొలగించి
  rationale: హిఫీల్ ఆజ్ఞారూపంలోని ‘తొలగించు’ అనే కారణార్థాన్ని నిలుపుతుంది; వారిని పూర్తిగా పదవీచ్యుతులను చేశాడా లేక సైనిక స్థానాల నుంచే మార్చాడా అని అనవసరంగా నిర్ణయించదు.
- source_word: הַמְּלָכִים אִישׁ מִמְּקֹמוֹ
  choice: రాజుల్లో ప్రతి ఒక్కరినీ అతని స్థానం నుండి
  rationale: బహువచనమైన ‘రాజులు’తో పాటు אִישׁ యొక్క విభజనాత్మక భావాన్ని స్పష్టంగా చూపుతుంది; מָקוֹם యొక్క స్థలం లేదా నియమిత స్థానం అనే విస్తృతిని ‘స్థానం’ నిలుపుతుంది.
- source_word: וְשִׂים
  choice: నియమించు
  rationale: שים అక్షరార్థంగా ‘పెట్టు/ఉంచు’ అయినా, అధికారులుగా ప్రత్యామ్నాయ వ్యక్తులను ఏర్పాటు చేసే ఈ పరిపాలనా సందర్భంలో ‘నియమించు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: פַּחוֹת
  choice: అధిపతులను
  rationale: ఈ పదం నియమిత పరిపాలనా అధికారులను లేదా ప్రాంత పాలకులను సూచిస్తుంది. ‘అధిపతులు’ సైనిక హోదాకే పరిమితం చేయకుండా సందర్భానికి సరిపోతుంది.
- source_word: תַּחְתֵּיהֶם
  choice: వారి స్థానంలో
  rationale: అక్షరార్థంగా ‘వారి కింద’ అనే రూపం ఉన్నప్పటికీ, ఇక్కడ ప్రత్యామ్నాయంగా నియమించడమే సందర్భోచిత భావం.
