translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞా వాక్య నిర్మాణం వాడబడింది. ‘రాజుల్లో ప్రతి ఒక్కరినీ’ అనే రూపం మూలంలోని బహువచనంతో కూడిన విభజనాత్మక భావాన్ని కాపాడుతుంది.
