source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֗/וֹ כֹּ֚ה אָמַ֣ר בֶּן הֲדַ֔ד כַּסְפְּ/ךָ֥ וּֽ/זְהָבְ/ךָ֖ לִֽ/י ה֑וּא וְ/נָשֶׁ֧י/ךָ וּ/בָנֶ֛י/ךָ הַ/טּוֹבִ֖ים לִ/י הֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/003.yaml
  text: 'And he said to him[a], “Thus says Ben-hadad: Your silver and your gold are mine; your wives and your sons, the best, are mine.”'
translation:
  language: te
  text: 'అతడు అతనితో ఇలా అన్నాడు: “బెన్-హదదు ఇలా చెబుతున్నాడు: ‘నీ వెండి, నీ బంగారం నావే; నీ భార్యలూ, నీ శ్రేష్ఠమైన కుమారులూ నావారే.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: అతడు అతనితో ఇలా అన్నాడు
  rationale: אמר యొక్క సాధారణ కథన ప్రయోగాన్ని, ל־ సూచించే పరోక్ష కర్మను సహజమైన తెలుగు కథన శైలిలో వ్యక్తం చేస్తుంది.
- source_word: כֹּה אָמַר
  choice: ఇలా చెబుతున్నాడు
  rationale: దూత అధికారికంగా ఒకరి మాటను తెలియజేసే సూత్రాన్ని ఆధునిక తెలుగులో సహజంగా, వర్తమాన ప్రకటన బలంతో అందిస్తుంది.
- source_word: בֶּן הֲדַד
  choice: బెన్-హదదు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు లిపిలో ధ్వన్యనుసారంగా రాస్తుంది.
- source_word: כַּסְפְּךָ וּזְהָבְךָ
  choice: నీ వెండి, నీ బంగారం
  rationale: כֶּסֶף అనే నిర్దిష్ట విలువైన లోహాన్ని సాధారణ ‘డబ్బు’గా మార్చకుండా మూలంలోని జతను నిలుపుతుంది.
- source_word: לִי הוּא
  choice: నావే
  rationale: రెండు వస్తువులపై చేసిన స్వామ్య ప్రకటనను సహజమైన తెలుగు బహువచన భావంతో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וְנָשֶׁיךָ
  choice: నీ భార్యలు
  rationale: కుటుంబ సంబంధ సందర్భంలో נָשִׁים అంటే సాధారణంగా స్త్రీలు కాక భార్యలు.
- source_word: וּבָנֶיךָ
  choice: నీ కుమారులు
  rationale: בָּנִים యొక్క లింగనిర్దిష్ట అర్థాన్ని ‘పిల్లలు’గా సాధారణీకరించకుండా నిలుపుతుంది.
- source_word: הַטּוֹבִים
  choice: శ్రేష్ఠమైనవారు
  rationale: ఈ స్వాధీనపరచుకునే సందర్భంలో ‘మంచివారు’ అనే నైతిక భావం కంటే ‘అత్యుత్తములు/ఎంపికైనవారు’ అనే గుణాత్మక భావాన్ని సహజంగా అందిస్తుంది; విశేషణం ఎవరిని విశేషిస్తుందో ఉన్న నిర్మాణాత్మక అనిశ్చితిని పాదసూచికలో నిలుపుతుంది.
- source_word: לִי הֵם
  choice: నావారే
  rationale: వ్యక్తులపై చేసిన స్వామ్య ప్రకటనను తెలుగులో మానవులకు తగిన రూపంతో అందించి, హీబ్రూలోని పునరుక్తి బలాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి వాడబడింది. ప్రత్యక్ష సందేశంలోని అధికారిక స్వరాన్ని ‘ఇలా చెబుతున్నాడు’తో, స్వామ్య ప్రకటనలోని పునరుక్తి బలాన్ని ‘నావే/నావారే’తో నిలుపుకున్నాం.
