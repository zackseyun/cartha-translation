translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘సిరియా’ అనే తరువాతి సంప్రదాయ పేరుకు బదులు హెబ్రీయు proper name ‘అరాము’ నిలుపబడింది; మూలంలోని పునరుక్త దెబ్బ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేశారు.
