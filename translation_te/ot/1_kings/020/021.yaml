id: 1KI.20.21
reference: 1 Kings 20:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּצֵא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יַּ֥ךְ אֶת הַ/סּ֖וּס וְ/אֶת הָ/רָ֑כֶב וְ/הִכָּ֥ה בַ/אֲרָ֖ם מַכָּ֥ה גְדוֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/021.yaml
  text: Then the king of Israel went out and struck the horses and the chariots[a], and inflicted a great blow on Aram.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు రాజు బయలుదేరి గుర్రాలనూ రథాలనూ దెబ్బతీశాడు; అరాముపై భారీ దెబ్బ కొట్టాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: బయలుదేరి
  rationale: יצא అనే క్రియ కథన సందర్భంలో ‘బయలుదేరాడు’ అనే సహజ అర్థాన్ని ఇస్తుంది; సైనికంగా ‘దండెత్తాడు’ అని ప్రత్యేకతను జోడించదు.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: కర్తను గుర్తించే నిర్మాణ పదబంధానికి సహజమైన తెలుగు రూపం.
- source_word: וַיַּךְ
  choice: దెబ్బతీశాడు
  rationale: נכה యొక్క ‘కొట్టు/దెబ్బతీయు’ అనే విస్తృత అర్థాన్ని నిలుపుతూ, ఇక్కడ ఫలితాన్ని ‘ఓడించాడు’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: הַסּוּס
  choice: గుర్రాలను
  rationale: రూపరీత్యా ఏకవచనమైనా, సైనిక సందర్భంలో ఇది గుర్రాలను సమష్టిగా సూచిస్తుంది; తెలుగులో బహువచనం భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: הָרָכֶב
  choice: రథాలను
  rationale: సైనిక కథనంలో רכב రథదళాన్ని సమష్టిగా సూచించగలదు; సాధారణ పాఠకునికి ‘రథాలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: וְהִכָּה
  choice: దెబ్బ కొట్టాడు
  rationale: మూలంలోని నכה క్రియకు సంబంధించిన బలమైన భావాన్ని, దాని సమానమూలక కర్మ מַכָּהతో కలిసి సహజ తెలుగు నుడికారంగా అందిస్తుంది.
- source_word: בַאֲרָם
  choice: అరాముకు
  rationale: మూలంలోని అరాము అనే పేరును నిలుపుతుంది; సందర్భానుసారం ఇది రాజ్యాన్నిగానీ దాని సైన్యాన్నిగానీ సూచించవచ్చు.
- source_word: מַכָּה גְדוֹלָה
  choice: ఘోరమైన దెబ్బ
  rationale: ‘గొప్ప/పెద్ద దెబ్బ’ అనే మూల రూపకాన్ని సహజ తెలుగులో బలంగా అందిస్తుంది; హతుల సంఖ్యను పేర్కొనకుండా తీవ్రమైన సైనిక నష్టాన్ని సూచిస్తుంది.
