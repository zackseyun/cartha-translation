source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֗/וֹ יַ֚עַן אֲשֶׁ֤ר לֹֽא שָׁמַ֨עְתָּ֙ בְּ/ק֣וֹל יְהוָ֔ה הִנְּ/ךָ֤ הוֹלֵךְ֙ מֵֽ/אִתִּ֔/י וְ/הִכְּ/ךָ֖ הָ/אַרְיֵ֑ה וַ/יֵּ֨לֶךְ֙ מֵֽ/אֶצְל֔/וֹ וַ/יִּמְצָאֵ֥/הוּ הָ/אַרְיֵ֖ה וַ/יַּכֵּֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/036.yaml
  text: Then he said to him, “Because you have not listened to the voice of the LORD, look, when you depart from me, the lion will strike you down.” And when he departed from him, the lion found him and struck him down.
translation:
  language: te
  text: అప్పుడు అతడు అతనితో, “నీవు యెహోవా మాట వినలేదు కాబట్టి, ఇదిగో, నీవు నా దగ్గరనుంచి వెళ్లినప్పుడు సింహం నిన్ను చంపుతుంది” అన్నాడు. అతడు అతని దగ్గరనుంచి వెళ్లినప్పుడు, సింహం అతన్ని కనుగొని చంపింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַעְתָּ בְּקוֹל יְהוָה
  choice: యెహోవా మాట వినలేదు
  rationale: హీబ్రూ ప్రయోగం కేవలం శబ్దాన్ని వినడమే కాక మాటకు లోబడడాన్ని సూచిస్తుంది; సహజమైన తెలుగులో ‘మాట వినడం’ ఈ రెండు భావాలనూ మోస్తుంది.
- source_word: הִנְּךָ
  choice: ఇదిగో
  rationale: రాబోయే తీర్పుపై శ్రద్ధ నిలిపే హీబ్రూ సూచక పదాన్ని ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: הִכְּךָ / וַיַּכֵּהוּ
  choice: నిన్ను చంపుతుంది / అతన్ని చంపింది
  rationale: נכה మూలానికి ‘కొట్టు’ అనే ప్రాథమిక అర్థం ఉన్నా, ఇక్కడ సింహం దాడి యొక్క ప్రాణాంతక ఫలితాన్ని సందర్భం సూచిస్తుంది; ఆధునిక తెలుగులో ‘చంపు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וַיִּמְצָאֵהוּ
  choice: అతనికి ఎదురై
  rationale: అక్షరార్థంగా ‘అతన్ని కనుగొంది’; ఈ సందర్భంలో సింహం అతనిని ఎదుర్కొన్నదనే భావాన్ని సహజమైన కథన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה ప్రతిరూపణ
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో నిలుపుతుంది.
- issue: ప్రవచనాత్మక తీర్పు యొక్క నిశ్చితత్వం
  choice: సింహం నిన్ను చంపుతుంది
  alternative: సింహం నిన్ను కొడుతుంది
  rationale: హీబ్రూ వాక్యం తీర్పును నేరుగా ప్రకటిస్తుంది; తరువాతి సంఘటన దాని ప్రాణాంతక స్వభావాన్ని సందర్భపరంగా నిర్ధారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కథనశైలి, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని కారణం–తీర్పు–నెరవేర్పు క్రమం నిలుపబడింది.
