source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ אֵלָ֛י/ו כָּל הַ/זְּקֵנִ֖ים וְ/כָל הָ/עָ֑ם אַל תִּשְׁמַ֖ע וְ/ל֥וֹא תֹאבֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/008.yaml
  text: Then all the elders and all the people said to him[a], “Do not listen, and do not consent.”
translation:
  language: te
  text: అప్పుడు పెద్దలందరూ, ప్రజలందరూ అతనితో, “వినవద్దు, ఒప్పుకోవద్దు” అన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతని మాట వినవద్దు, అంగీకరించవద్దు.” హీబ్రూ క్రియలకు వినడం/విధేయత చూపడం (שׁמע), ఇష్టపడడం/సమ్మతించడం (אבה) అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: అప్పుడు ... అన్నారు
  rationale: వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ దాని క్రమానుసార భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֵלָיו
  choice: అతనితో
  rationale: హీబ్రూ పాఠంలో పేరు కాక సర్వనామమే ఉంది; సందర్భంలోని రాజును సూచించినా, మూలంలోని సర్వనామాన్ని నిలుపుతుంది.
- source_word: כָּל הַזְּקֵנִים
  choice: పెద్దలందరూ
  rationale: ఇక్కడ זְקֵנִים కేవలం వృద్ధులను కాక సమాజ నాయకులను సూచిస్తుంది; ‘పెద్దలు’ తెలుగులో సహజమైన సందర్భోచిత పదం.
- source_word: וְכָל הָעָם
  choice: ప్రజలందరూ
  rationale: పెద్దలతోపాటు ఉన్న విస్తృత ప్రజాసమూహాన్ని עָם సూచిస్తుంది.
- source_word: אַל תִּשְׁמַע
  choice: వినవద్దు
  rationale: שׁמע పదానికి వినడం లేదా విధేయత చూపడం అనే భావాలు ఉండవచ్చు; ‘వినవద్దు’ మూలంలోని విస్తృతిని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: וְלֹא תֹאבֶה
  choice: ఒప్పుకోవద్దు
  rationale: אבה ఇక్కడ కోరడం, సమ్మతించడం లేదా అంగీకరించడం అనే భావాన్ని ఇస్తుంది; రాజకీయ డిమాండుకు స్పందించే సందర్భంలో ‘ఒప్పుకోవద్దు’ సహజంగా సరిపోతుంది.
