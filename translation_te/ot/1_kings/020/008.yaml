translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని రెండు నిషేధ ఆజ్ఞల సంక్షిప్తతను నిలిపి, పదాల భావ విస్తృతిని పాదటిప్పణిలో సూచించాం.
