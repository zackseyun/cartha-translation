  text: וַ/יִּגַּ֞שׁ אִ֣ישׁ הָ/אֱלֹהִ֗ים וַ/יֹּאמֶר֮ אֶל מֶ֣לֶךְ יִשְׂרָאֵל֒ וַ/יֹּ֜אמֶר כֹּֽה אָמַ֣ר יְהוָ֗ה יַ֠עַן אֲשֶׁ֨ר אָמְר֤וּ אֲרָם֙ אֱלֹהֵ֤י הָרִים֙ יְהוָ֔ה וְ/לֹֽא אֱלֹהֵ֥י עֲמָקִ֖ים ה֑וּא וְ֠/נָתַתִּי אֶת כָּל הֶ/הָמ֨וֹן הַ/גָּ֤דוֹל הַ/זֶּה֙ בְּ/יָדֶ֔/ךָ וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/028.yaml
  text: 'Then the man of God came near and said to the king of Israel[a], “Thus says Yahweh: Because Aram has said, ‘Yahweh is a god of the mountains, but he is not a god of the valleys,’ I will give all this great multitude into your hand[c][b], and you shall know that I am Yahweh.”'
translation:
  language: te
  text: 'దేవుని మనిషి సమీపించి ఇశ్రాయేలు రాజుతో ఇలా అన్నాడు: “యెహోవా ఇలా అంటున్నాడు: అరాము, ‘యెహోవా పర్వతాల దేవుడు గానీ, లోయల దేవుడు కాదు’ అని అన్నందున[a][b], ఈ గొప్ప జనసమూహమంతటినీ నీ చేతికి అప్పగిస్తాను; అప్పుడు నేను యెహోవానని మీరు తెలుసుకుంటారు.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అరాము” అనేది హీబ్రూ పేరు; కొన్ని అనువాదాల్లో సంప్రదాయంగా “సిరియా” అని ఉంటుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా “కొండల దేవుడు … మైదానాల దేవుడు కాదు.” హీబ్రూ పదాలు ఎత్తైన భూభాగాన్నీ లోతట్టు ప్రాంతాలనూ పరస్పరం వ్యతిరేకంగా చూపుతున్నాయి.
    reason: lexical_alternative
  - marker: c
    text: “మీరు తెలుసుకుంటారు” అనే హీబ్రూ క్రియ బహువచనంలో ఉంది. సందేశం రాజుకు చెప్పబడినా, ఈ మాట ఇశ్రాయేలు ప్రజలను సమష్టిగా ఉద్దేశిస్తుంది.
    reason: grammar_clarification
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: ఇది సందర్భంలో నిర్దిష్టమైన ప్రవక్తీయ బిరుదు; సరళమైన తెలుగు రూపం మూలంలోని భావాన్ని నిలుపుతుంది.
- source_word: וַיִּגַּשׁ
  choice: దగ్గరకు వచ్చి
  rationale: נגשׁ సూచించే సమీపించడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כֹּה אָמַר יְהוָה
  choice: యెహోవా ఇలా అంటున్నాడు
  rationale: ప్రవక్తీయ సందేశ సూత్రాన్ని సహజంగాను గంభీరంగాను అందిస్తుంది.
- source_word: אֲרָם
  choice: అరాము వారు
  rationale: మూలంలోని ప్రాచీన నామమైన ‘అరాము’ను నిలుపుతూ, దానికి జతైన బహువచన క్రియను తెలుగులో స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: אֱלֹהֵי הָרִים ... וְלֹא אֱלֹהֵי עֲמָקִים
  choice: పర్వతాల దేవుడు, లోయల దేవుడు కాడు
  rationale: భూభాగంలోని ఎత్తైన ప్రదేశాలు–లోతట్టు ప్రదేశాలు అనే మూల వ్యత్యాసాన్ని నేరుగా నిలుపుతుంది; అరామీయుల పరిమిత దేవతాభావన కూడా సందర్భంలో స్పష్టమవుతుంది.
- source_word: כָּל הֶהָמוֹן הַגָּדוֹל הַזֶּה
  choice: ఈ గొప్ప జనసమూహమంతటినీ
  rationale: הָמוֹן యొక్క ‘పెద్ద సమూహం/జనసందోహం’ అనే విస్తృత అర్థాన్ని నిలుపుతుంది; సైనిక సందర్భం వాక్య పరిసరాల ద్వారా తెలుస్తుంది.
- source_word: בְּיָדֶךָ
  choice: నీ చేతికి అప్పగిస్తాను
  rationale: విజయం లేదా ఆధీనంలోకి ఇవ్వడాన్ని సూచించే హీబ్రూ ‘చేతికి ఇవ్వడం’ అనే రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וִידַעְתֶּם
  choice: మీరు తెలుసుకుంటారు
  rationale: మూలంలోని రెండవ పురుష బహువచనాన్ని తెలుగులో స్పష్టంగా చూపి, ఫలితం రాజుకే కాక ఇశ్రాయేలీయులకు వర్తిస్తుందని సూచిస్తుంది.
- source_word: כִּי אֲנִי יְהוָה
  choice: నేను యెహోవానని
  rationale: దైవ స్వీయ-గుర్తింపు సూత్రాన్నీ, యెహోవా అనే వ్యక్తిగత నామాన్నీ నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: యెహోవా అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో יהוה అనే వ్యక్తిగత దైవనామం ఉంది; దానిని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: అరామీయుల స్థానిక దేవతాభావన
  choice: “పర్వతాల దేవుడు, లోయల దేవుడు కాడు” అనే వారి మాటను నేరుగా ఉంచడం
  alternative: “పర్వత ప్రాంతానికే పరిమితమైన ఒక దేవుడు” అని వివరణాత్మకంగా విస్తరించడం
  rationale: మూలంలోని వ్యత్యాసాన్ని అలాగే ఉంచడం ద్వారా వారి తప్పు భావన స్పష్టమవుతుంది; పాఠ్యంలో లేని వివరణను చేర్చకుండా దైవ సార్వభౌమత్వంపై ఉన్న ఉద్రిక్తతను కాపాడుతుంది.
- issue: וִידַעְתֶּם లోని సంబోధన సంఖ్య
  choice: బహువచనం—“మీరు తెలుసుకుంటారు”
  alternative: ఏకవచనం—“నీవు తెలుసుకుంటావు”
  rationale: మాట రాజుతో చెప్పబడుతున్నప్పటికీ హీబ్రూ క్రియ బహువచనంలో ఉంది; అందువల్ల జ్ఞానం ఇశ్రాయేలు సమూహానికి విస్తరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్య నిర్మాణం వాడబడింది. ప్రవక్తీయ ప్రకటన ధోరణి నిలుపబడింది. మూలంలోని ‘అన్నాడు’ అనే పునరుక్తిని తెలుగులో అసహజంగా కాకుండా ఒకే పరిచయ వాక్యంగా సమన్వయపరిచాం. “నీ చేతికి” అనే ఏకవచన రూపం రాజును ఉద్దేశిస్తే, “మీరు” అనే బహువచనం ఇశ్రాయేలు సమూహాన్ని ఉద్దేశిస్తుందని పాఠ్యంలోనూ పాదసూచికలోనూ భేదం నిలుపబడింది.
