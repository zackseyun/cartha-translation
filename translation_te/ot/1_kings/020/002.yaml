lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: అతడు … పంపాడు
  rationale: వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపే గతకాల క్రియను సూచిస్తుంది. తెలుగులో సహజమైన కథన శైలికి అనుగుణంగా ‘పంపాడు’ అని అనువదించాం.
- source_word: מַלְאָכִים
  choice: దూతలను
  rationale: రాజకీయ, సైనిక సందర్భంలో ఇది సందేశంతో పంపబడిన మానవ ప్రతినిధులను సూచిస్తుంది; పరలోక దూతలను కాదు.
- source_word: אֶל
  choice: దగ్గరికి
  rationale: పంపబడిన దూతలు చేరవలసిన వ్యక్తిగా అహాబును సూచించే గమ్యార్థాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אַחְאָב
  choice: అహాబు
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన వ్యక్తినామ రూపం.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజైన
  rationale: అహాబు పదవిని తెలిపే హీబ్రూ సమాసాన్ని తెలుగులో సహజమైన విశేషణ రూపంలో వ్యక్తపరుస్తుంది.
- source_word: הָעִירָה
  choice: పట్టణంలోకి
  rationale: ‘పట్టణం’ అనే పదానికి జోడించిన దిశాసూచక ה గమనాన్ని సూచిస్తుంది. ‘పట్టణంలోకి’ ఆ గమన భావాన్ని సహజంగా నిలుపుతుంది; ‘పట్టణానికి’ కూడా సాధ్యమైన అనువాదం.
