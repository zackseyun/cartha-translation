base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/020.yaml
  text: And each man struck down his man[a], and Aram fled, and Israel pursued them[b]. But Ben-hadad king of Aram escaped on a horse with horsemen.
translation:
  language: te
  text: ప్రతి యోధుడు తన ఎదుటివానిని కొట్టాడు[a]. అరాము పారిపోయింది, ఇశ్రాయేలు వారిని వెంబడించింది. అరాము రాజైన బెన్హదదు గుర్రం మీద గుర్రపు రౌతులతో తప్పించుకున్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ప్రతి మనిషి తన మనిషిని కొట్టాడు.” అంటే ప్రతి యోధుడు తన ఎదుటి మనిషిని కొట్టాడు. ఈ క్రియ తప్పనిసరిగా మరణాన్ని సూచించదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “గుర్రం మీద, గుర్రపు రౌతులతో తప్పించుకున్నాడు.” హీబ్రూ వాక్యనిర్మాణం బెన్హదదు గుర్రంపై పారిపోతూ గుర్రపు రౌతులతో ఉన్నాడని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: హతమార్చాడు
  rationale: נכה యుద్ధ సందర్భంలో బలంగా కొట్టి పడగొట్టడం లేదా ఓడించడం అనే భావాన్ని ఇస్తుంది. తెలుగు యుద్ధవర్ణనలో ‘హతమార్చాడు’ సహజంగా ఉన్నా, మరణాన్ని స్పష్టీకరించే స్వల్ప అర్థనిర్ణయం ఇందులో ఉందని పాదసూచికలో సూచించబడింది.
- source_word: אִישׁ אִישׁוֹ
  choice: ప్రతి యోధుడు తనకు ఎదురుగా ఉన్నవాణ్ణి
  rationale: అక్షరార్థంగా ‘ప్రతి మనిషి తన మనిషిని’; సందర్భంలో ప్రతి యోధుడు తన ఎదుటి ప్రత్యర్థిపై దాడి చేశాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֲרָם
  choice: అరామీయులు
  rationale: ఇక్కడ దేశనామమైన ‘అరాము’ పారిపోయిన సైన్యాన్ని సూచిస్తుంది. తెలుగులో వ్యక్తుల సమూహాన్ని కర్తగా చూపడానికి ‘అరామీయులు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וַיָּנֻסוּ
  choice: పారిపోగా
  rationale: యుద్ధరంగం నుంచి భయంతో లేదా ఓటమితో పారిపోవడాన్ని నేరుగా వ్యక్తం చేస్తుంది; తరువాతి వెంబడింపుతో వాక్యసంబంధం సహజంగా ఉంటుంది.
- source_word: וַיִּרְדְּפֵם
  choice: వారిని తరిమారు
  rationale: רדף అనే సైనిక వెంబడింపు భావానికి ‘తరిమారు’ సాధారణ పాఠకులకు సహజమైన తెలుగు రూపం.
- source_word: וַיִּמָּלֵט
  choice: తప్పించుకున్నాడు
  rationale: ప్రమాదం నుంచి బయటపడటం అనే సందర్భోచిత భావాన్ని, అనవసరమైన దైవశాస్త్రీయ సూచన లేకుండా తెలియజేస్తుంది.
- source_word: בֶּן הֲדַד
  choice: బెన్హదదు
  rationale: వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుకరణలో అందించింది.
- source_word: עַל סוּס
  choice: గుర్రం మీద
  rationale: ఏకవచనమైన סוּסను నేరుగా ప్రతిబింబిస్తూ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: וּפָרָשִׁים
  choice: కొందరు గుర్రపు రౌతులతో కలిసి
  rationale: פָרָשִׁים అంటే గుర్రాలపై స్వారీ చేసే యోధులు. ‘కలిసి’ అనే పదం ו conjunctionను సహవాసంగా అర్థం చేసుకుంటుంది; ఈ నిర్మాణంలోని ప్రత్యామ్నాయ అవగాహన పాదసూచికలో నిలుపబడింది.
