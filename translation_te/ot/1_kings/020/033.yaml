translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘శకునం’ మూల క్రియలోని భావాన్ని కాపాడుతుంది; పాఠకుడు దానిని ఆచారబద్ధమైన మంత్రవిద్యగా మాత్రమే అర్థం చేసుకోకుండా సందర్భాన్ని పాదటీపు వివరిస్తుంది. మూలంలోని అస్పష్టమైన וַיַּחְלְטוּ הֲמִמֶּנּוּ పదబంధాన్ని ప్రధాన పాఠ్యంలో సహజంగా స్పష్టం చేసినప్పటికీ దాని కఠినతను పాదటీపులో నిలిపింది.
