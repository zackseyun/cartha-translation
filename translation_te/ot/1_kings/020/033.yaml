  text: וְ/הָ/אֲנָשִׁים֩ יְנַחֲשׁ֨וּ וַֽ/יְמַהֲר֜וּ וַ/יַּחְלְט֣וּ הֲ/מִמֶּ֗/נּוּ וַ/יֹּֽאמְרוּ֙ אָחִ֣י/ךָ בֶן הֲדַ֔ד וַ/יֹּ֖אמֶר בֹּ֣אוּ קָחֻ֑/הוּ וַ/יֵּצֵ֤א אֵלָי/ו֙ בֶּן הֲדַ֔ד וַֽ/יַּעֲלֵ֖/הוּ עַל הַ/מֶּרְכָּבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/033.yaml
  text: The men were watching for an omen[a], and they quickly seized on it from him and said, “Ben-hadad is your brother.” And he said, “Come, take him.” Then Ben-hadad came out to him[c][b], and he had him come up into the chariot.
translation:
  language: te
  text: ఆ మనుషులు ఏదైనా శకునాన్ని గమనించవచ్చేమోనని జాగ్రత్తగా చూస్తూ ఉన్నారు[a]. అతని మాటను వారు వెంటనే అందిపుచ్చుకొని[b], “బెన్‌హదదు నీ సహోదరుడు” అన్నారు. అప్పుడు అతడు, “రండి, అతన్ని తీసుకురండి” అన్నాడు. బెన్‌హదదు అతని దగ్గరకు బయటికి వచ్చాడు; అతడు బెన్‌హదదును రథం ఎక్కించాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “శకునంగా తీసుకుంటూ ఉన్నారు.” హీబ్రూ క్రియ శకునం చూడడాన్ని లేదా శకునం కోసం వెదకడాన్ని సూచించవచ్చు; ఇక్కడ వారు ఆహాబు మాటల్లో తమకు అనుకూలమైన సూచన కోసం అప్రమత్తంగా ఉన్నారనే భావం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “అతని మాటను వెంటనే అందిపుచ్చుకొని” అని అనువదించిన హీబ్రూ పదబంధం అర్థం కఠినమైనది. ఆహాబు పలికిన “సహోదరుడు” అనే మాటను వారు తమకు అనుకూలమైన ఒప్పుకోలుగా వెంటనే పట్టుకున్నారనే భావం.
    reason: lexical_alternative
  - marker: c
    text: 'లేదా “అతన్ని రథం మీదికి తీసుకువచ్చాడు.” హీబ్రూ క్రియ కారణార్థక రూపంలో ఉంది: ఆహాబు బెన్‌హదదు రథం ఎక్కేలా చేశాడు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְנַחֲשׁוּ
  choice: ఏదైనా శకునం దొరుకుతుందేమోనని గమనిస్తూ ఉన్నారు
  rationale: నחשׁ అనే క్రియలోని శకునాన్ని వెదకడం లేదా అనుకూల సంకేతాన్ని పట్టుకోవడం అనే భావాన్ని నిలుపుతూ, ఇక్కడ ఆ మనుషులు ఆహాబు మాటల్లో అనుకూల సూచన కోసం అప్రమత్తంగా ఉన్న సందర్భాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיְמַהֲרוּ
  choice: వెంటనే
  rationale: వారు అనుకూలంగా భావించిన మాటపై ఆలస్యం చేయకుండా స్పందించిన వేగాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיַּחְלְטוּ הֲמִמֶּנּוּ
  choice: అతని నోటినుంచి వచ్చిన ఆ మాటను వారు వెంటనే పట్టుకొని
  rationale: కఠినమైన హీబ్రూ పదబంధంలోని, ఆహాబు పలికిన మాటను తమకు అనుకూలమైన నిర్ణాయక సంకేతంగా వెంటనే అందిపుచ్చుకున్న భావాన్ని స్పష్టంగా తెలియజేస్తుంది; సందర్భం సూచించే అంతర్లీన కర్మను ‘ఆ మాటను’గా వ్యక్తం చేసింది.
- source_word: אָחִיךָ
  choice: నీ సహోదరుడు
  rationale: దౌత్యపరమైన మర్యాద లేదా కల్పిత బంధుత్వాన్ని సూచించే మూలంలోని ‘నీ సహోదరుడు’ అనే అర్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: בֹּאוּ קָחֻהוּ
  choice: వెళ్లి, అతన్ని తీసుకురండి
  rationale: సందర్భంలో సేవకులు వెళ్లి బెన్‌హదదును ఆహాబు సమక్షానికి తీసుకురావాలనే భావం ఉంది. హీబ్రూ బహువచన ఆజ్ఞలను తెలుగులో సహజంగా ప్రతిబింబిస్తుంది.
- source_word: וַיַּעֲלֵהוּ עַל הַמֶּרְכָּבָה
  choice: అతడు బెన్‌హదదును రథం ఎక్కించాడు
  rationale: עלה హిఫిల్ రూపంలోని కారణార్థక భావాన్ని, భౌతికంగా ఎత్తాడని సూచించకుండా, సహజమైన తెలుగులో ‘ఎక్కించాడు’గా నిలుపుతుంది.
- source_word: הַמֶּרְכָּבָה
  choice: రథం
  rationale: మూలంలో నిర్దిష్ట ఉపపదం మాత్రమే ఉంది; ‘అతని రథం’ అనే స్వామ్యాన్ని అనవసరంగా చేర్చకుండా సందర్భానుగుణంగా అనువదించింది.
