translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘యువకులు’ అనే పదంలోని నిజమైన పదార్థ సందిగ్ధతను పాదసూచిక ద్వారా నిలిపాం; పాలనా-సైనిక నేపథ్యాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘ప్రాంతాల అధిపతులు’ అని అనువదించాం.
