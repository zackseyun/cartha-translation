source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ יָצְא֣וּ מִן הָ/עִ֔יר נַעֲרֵ֖י שָׂרֵ֣י הַ/מְּדִינ֑וֹת וְ/הַ/חַ֖יִל אֲשֶׁ֥ר אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/019.yaml
  text: 'These went out from the city: the young men of the commanders of the provinces[a], and the army that was behind them.'
translation:
  language: te
  text: 'పట్టణం నుండి బయలుదేరినవారు వీరే: ప్రాంతాల అధిపతుల యువకులు[a], వారి వెనుక ఉన్న సైన్యం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రాంతాల అధిపతుల సేవకులు/పరిచారకులు.’ నַעֲרֵי అనే హీబ్రూ పదం యువకులను గానీ వ్యక్తిగత సేవకులు లేదా పరిచారకులను గానీ సూచించవచ్చు; ఈ సందర్భంలో రెండు భావాలూ కలిసి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: వీరే
  rationale: మునుపటి వచనంలో లెక్కించబడిన సమూహాన్ని సూచించే బహువచన సర్వనామం; తెలుగు వాక్యంలో ‘వీరే’ దాని సూచనాబలాన్ని సహజంగా నిలుపుతుంది.
- source_word: יָצְאוּ מִן־הָעִיר
  choice: పట్టణం నుండి బయలుదేరినవారు
  rationale: వారు పట్టణాన్ని విడిచి బయటకు వచ్చిన కదలికను నేరుగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; మూలంలో లేని ప్రత్యేక సైనిక భావాన్ని జోడించదు.
- source_word: נַעֲרֵי
  choice: యువకులు
  rationale: నַעַר అనే పదానికి యువకులు, సేవకులు లేదా పరిచారకులు అనే భావాలు ఉండవచ్చు. ప్రధాన పాఠంలో ప్రాథమిక వయోసూచక భావాన్ని ఉంచి, సందర్భానికి సాధ్యమైన సేవకులు/పరిచారకులు అనే అర్థాన్ని పాదసూచికలో సంరక్షించాం.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: ప్రాంతాల అధిపతులు
  rationale: స్మిఖూత్ నిర్మాణాన్ని ‘ప్రాంతాల అధిపతులు’గా ప్రతిబింబిస్తుంది. שַׂר ఇక్కడ పాలనా లేదా సైనిక నాయకత్వాన్ని సూచించగలదు; ‘అధిపతులు’ ఆ పరిధిని అనవసరంగా కుదించదు.
- source_word: וְהַחַיִל
  choice: సైన్యం
  rationale: ఈ యుద్ధ సందర్భంలో חַיִל అనేది వారితో కూడిన సైనిక బలగాన్ని సూచిస్తుంది; ‘సైన్యం’ సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన పదం.
- source_word: אֲשֶׁר אַחֲרֵיהֶם
  choice: వారి వెనుక ఉన్న
  rationale: సైన్యం ఆ యువకుల వెనుక స్థానంలో లేదా వారిని అనుసరిస్తూ ఉందనే మూలపాఠ భావాన్ని నేరుగా నిలుపుతుంది.
