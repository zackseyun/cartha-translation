translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. సైనిక సందర్భాన్ని చూపేందుకు ‘సమీకరించి లెక్కించాడు’ అని అనువదించగా, మూలంలో లేని ‘సైన్యం’ లేదా ‘సైనికులు’ వంటి నిర్దిష్ట పదాలు చేర్చలేదు.
