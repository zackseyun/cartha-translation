id: 1KI.20.15
reference: 1 Kings 20:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּפְקֹ֗ד אֶֽת נַעֲרֵי֙ שָׂרֵ֣י הַ/מְּדִינ֔וֹת וַ/יִּהְי֕וּ מָאתַ֖יִם שְׁנַ֣יִם וּ/שְׁלֹשִׁ֑ים וְ/אַחֲרֵי/הֶ֗ם פָּקַ֧ד אֶת כָּל הָ/עָ֛ם כָּל בְּנֵ֥י יִשְׂרָאֵ֖ל שִׁבְעַ֥ת אֲלָפִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/015.yaml
  text: So he mustered the young men of the provincial commanders[a], and they were two hundred and thirty-two; and after them he mustered all the people, all the sons of Israel, seven thousand.
translation:
  language: te
  text: అప్పుడు అతడు ప్రాంతాల అధిపతుల యువకులను సమీకరించి లెక్కించాడు; వారు రెండువందల ముప్పై ఇద్దరు. వారి తర్వాత ప్రజలందరినీ, అంటే ఇశ్రాయేలు కుమారులందరినీ[a], సమీకరించి లెక్కించాడు; వారు ఏడువేల మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలీయులందరినీ.” హెబ్రీలో అక్షరార్థంగా “ఇశ్రాయేలు కుమారులందరినీ” అని ఉంది; ఇది ఇశ్రాయేలు ప్రజలను సూచించే పురుషలింగ కుటుంబ పదబంధం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד / פָּקַד
  choice: సమీకరించి లెక్కించాడు
  rationale: సైనిక సందర్భంలో ఈ క్రియ కేవలం లెక్కించడమే కాక, దళాలను సమీకరించి పరిశీలించడాన్ని సూచిస్తుంది; రెండు భావాలనూ సహజమైన తెలుగులో కలిపి వ్యక్తం చేసింది.
- source_word: נַעֲרֵי
  choice: యువకులను
  rationale: ఈ పదానికి సేవకులు లేదా పరిచారకులు అనే అర్థాలు కూడా ఉండవచ్చు; ఇక్కడ సామాజిక హోదాను అతిగా నిర్దిష్టం చేయకుండా ప్రాథమిక అర్థమైన ‘యువకులు’ నిలుపబడింది.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: ప్రాంతాల అధిపతుల
  rationale: שַׂר నాయకుడు లేదా అధికారి అనే విస్తృత అర్థం కలిగి ఉంది; מְדִינָה పరిపాలనా ప్రాంతాన్ని సూచిస్తుంది. ‘ప్రాంతాల అధిపతులు’ ఈ రెండింటినీ సహజంగా అందిస్తుంది.
- source_word: מָאתַיִם שְׁנַיִם וּשְׁלֹשִׁים
  choice: రెండువందల ముప్పై ఇద్దరు
  rationale: వ్యక్తులను లెక్కిస్తున్నందున ఆధునిక తెలుగులో సహజమైన వ్యక్తివాచక సంఖ్యారూపం వాడబడింది.
- source_word: וְאַחֲרֵיהֶם
  choice: వారి తర్వాత
  rationale: మొదటి గుంపు తరువాత రెండవ గుంపును సమీకరించిన క్రమాన్ని హెబ్రీ పదబంధానికి దగ్గరగా నిలుపుతుంది.
- source_word: כָּל הָעָם כָּל בְּנֵי יִשְׂרָאֵל
  choice: ప్రజలందరినీ, అంటే ఇశ్రాయేలు కుమారులందరినీ
  rationale: మూలంలోని ‘ప్రజలందరూ’ మరియు దానిని విశదీకరించే ‘ఇశ్రాయేలు కుమారులందరూ’ అనే రెండు పదబంధాలనూ నిలిపి, వాటి సంబంధాన్ని తెలుగులో స్పష్టం చేసింది.
- source_word: שִׁבְעַת אֲלָפִים
  choice: ఏడువేల మంది
  rationale: సంఖ్యను యథాతథంగా అందిస్తూ, వ్యక్తులను సూచించేందుకు సహజమైన ‘మంది’ చేర్చబడింది.
