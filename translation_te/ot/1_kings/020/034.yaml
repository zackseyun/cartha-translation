  to: అప్పుడు అతడు అతనితో, “నా తండ్రి నీ తండ్రి దగ్గర నుండి తీసుకున్న పట్టణాలను నేను తిరిగి ఇస్తాను. నా తండ్రి సమరయలో ఏర్పాటు చేసినట్లే, నీవు దమస్కులో నీ కోసం వీధులను[a] ఏర్పాటు చేసుకోవచ్చు” అన్నాడు. అప్పుడు అహాబు, “నేనైతే ఈ ఒప్పందం కింద[b] నిన్ను వెళ్లనిస్తాను” అన్నాడు. అహాబు అతనితో ఒప్పందం చేసుకొని[c], అతన్ని వెళ్లనిచ్చాడు.
