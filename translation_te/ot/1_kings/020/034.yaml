  revision_rationale: సవరణ మూలంలోని שָׂםకు అనుగుణంగా సమరయలో తండ్రి చేసిన ఏర్పాటును ఆత్మార్థకత లేకుండా వ్యక్తపరుస్తుంది. రాజకీయ సందర్భానికి తగిన కొద్దిగా గంభీరమైన క్రియారూపాన్ని ఉపయోగించి, విడుదల ఒప్పందం కింద జరుగుతుందనే భావాన్ని సహజ తెలుగులో తెలిపింది. పాదసూచికలు మూల పదాల అర్థవిస్తృతిని మరియు నుడికారాన్ని నిలుపుతాయి.
