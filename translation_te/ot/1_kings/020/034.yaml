source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֡י/ו הֶ/עָרִ֣ים אֲשֶׁר לָֽקַח אָבִ/י֩ מֵ/אֵ֨ת אָבִ֜י/ךָ אָשִׁ֗יב וְ֠/חוּצוֹת תָּשִׂ֨ים לְ/ךָ֤ בְ/דַמֶּ֨שֶׂק֙ כַּ/אֲשֶׁר שָׂ֤ם אָבִ/י֙ בְּ/שֹׁ֣מְר֔וֹן וַ/אֲנִ֖י בַּ/בְּרִ֣ית אֲשַׁלְּחֶ֑/ךָּ וַ/יִּכְרָת ל֥/וֹ בְרִ֖ית וַֽ/יְשַׁלְּחֵֽ/הוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/034.yaml
  text: Then he said to him[a], “The cities that my father took from your father I will restore, and you may establish streets for yourself in Damascus, as my father established them in Samaria.” And I, in the treaty[c][b], will let you go.” So he made a treaty with him and let him go.
translation:
  language: te
  text: అప్పుడు అతడు అతనితో, “నా తండ్రి నీ తండ్రి దగ్గర నుండి తీసుకున్న పట్టణాలను నేను తిరిగి ఇస్తాను. నా తండ్రి సమరయలో ఏర్పాటు చేసినట్లే, నీవు దమస్కులో నీ కోసం వీధులను[a] ఏర్పాటు చేసుకోవచ్చు” అన్నాడు. అప్పుడు అహాబు, “నేనైతే ఈ ఒప్పందం కింద[b] నిన్ను వెళ్లనిస్తాను” అన్నాడు. అహాబు అతనితో ఒప్పందం చేసుకొని[c], అతన్ని వెళ్లనిచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వాణిజ్య ప్రదేశాలను’ లేదా ‘ప్రత్యేక ప్రాంతాలను.’ హీబ్రూ పదానికి అక్షరార్థంగా ‘వీధులు/బహిరంగ ప్రదేశాలు’ అని అర్థం; ఇక్కడ ఒప్పందం ద్వారా మంజూరైన వ్యాపార ప్రాంతాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఈ నిబంధనతో నిన్ను వెళ్లనిస్తాను.’ ఇక్కడ ‘ఒప్పందం’గా అనువదించిన హీబ్రూ పదాన్ని ‘నిబంధన’ లేదా ‘ఒడంబడిక’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
  - marker: c
    text: అక్షరార్థంగా, ‘అతనితో ఒక నిబంధనను కోశాడు.’ ఇది బద్ధమైన ఒప్పందాన్ని అధికారికంగా కుదుర్చుకోవడానికి ఉపయోగించే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: הֶעָרִים
  choice: పట్టణాలను
  rationale: עִיר అనేది పట్టణం లేదా నగరాన్ని సూచిస్తుంది. రాజుల మధ్య భూభాగాల పునరప్పగింత సందర్భంలో ‘పట్టణాలు’ సహజంగా, విస్తృతంగా సరిపోతుంది.
- source_word: לָקַח ... אָשִׁיב
  choice: తీసుకున్న ... తిరిగి ఇచ్చేస్తాను
  rationale: ఈ క్రియాజంట స్వాధీనం చేసుకోవడం, దాన్ని తిరిగి అప్పగించడం అనే భావాలను తెలియజేస్తుంది; ఆధునిక తెలుగులో ఈ రూపం స్పష్టంగా ఉంది.
- source_word: וְחוּצוֹת
  choice: వీధులను
  rationale: חוּצוֹת యొక్క ప్రత్యక్ష భావం వీధులు లేదా బహిరంగ ప్రదేశాలు. ఒప్పంద సందర్భంలో వాణిజ్య ప్రాంతాలను సూచించే అవకాశం ఉన్నందున ఆ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: תָּשִׂים לְךָ בְדַמֶּשֶׂק
  choice: దమస్కులో నీ కోసం ... ఏర్పాటు చేసుకోవచ్చు
  rationale: שׂים ఇక్కడ స్థాపించడం లేదా ఏర్పాటు చేయడం అనే భావం ఇస్తుంది. రాజనీతికంగా మంజూరైన పట్టణ హక్కులను ‘ఏర్పాటు చేసుకోవచ్చు’ సహజంగా తెలియజేస్తుంది.
- source_word: כַּאֲשֶׁר שָׂם אָבִי בְּשֹׁמְרוֹן
  choice: నా తండ్రి సమరయలో ఏర్పాటు చేసుకున్నట్లే
  rationale: ముందున్న חוּצוֹת‌ను తెలుగులో మళ్లీ పలకకుండానే పోలిక స్పష్టంగా ఉంటుంది; ఆత్మార్థక రూపం తన కోసం ఏర్పాటుచేసుకున్న ప్రాంతాల భావాన్ని అందిస్తుంది.
- source_word: בַּבְּרִית
  choice: ఈ ఒప్పందం ప్రకారం
  rationale: రాజుల మధ్య రాజకీయ ఒడంబడిక సందర్భంలో ‘ఒప్పందం’ స్పష్టమైన ఆధునిక పదం. בְּ ఉపసర్గను ఈ సందర్భంలో ‘ప్రకారం’గా వ్యక్తం చేయడం విడుదలకు ఒప్పందమే ఆధారమని తెలియజేస్తుంది.
- source_word: אֲשַׁלְּחֶךָּ
  choice: నిన్ను వెళ్లనిస్తాను
  rationale: ఒప్పందం అనంతరం బందీ రాజును విడుదల చేయడాన్ని ఈ సహజ తెలుగు ప్రయోగం తెలియజేస్తుంది.
- source_word: וַיִּכְרָת לוֹ בְרִית
  choice: అతనితో ఒప్పందం చేసుకొని
  rationale: כרת ברית అనే హీబ్రూ నుడికారానికి తెలుగులో సహజ సమానార్థకం ‘ఒప్పందం చేసుకోవడం’; ‘కోయడం’ను యథాతథంగా అనువదించడం తెలుగులో అపార్థం కలిగిస్తుంది.
- source_word: וַיְשַׁלְּחֵהוּ
  choice: అతన్ని వెళ్లనిచ్చాడు
  rationale: ముందు చేసిన వాగ్దానం నెరవేరిందని అదే భావవ్యక్తీకరణతో చూపుతుంది.
theological_decisions:
- issue: రాజుల మధ్య రాజకీయ సందర్భంలో בְּרִית అనువాదం
  choice: ఒప్పందం
  alternative: నిబంధన; ఒడంబడిక
  rationale: ఈ సందర్భం దేవునికి మనుషులకు మధ్య నిబంధన గురించి కాకుండా రెండు రాజ్యాల మధ్య కుదిరిన రాజకీయ ఒప్పందం గురించి ఉంది. అయినా మూలపదానికి ‘నిబంధన/ఒడంబడిక’ అనే విస్తృత భావం ఉన్నదని పాదసూచికలో నిలిపాం.
- issue: וַאֲנִי వద్ద వక్త మార్పు
  choice: ‘అప్పుడు అహాబు’ అని వక్తను స్పష్టం చేయడం
  alternative: వక్త పేరును చేర్చకుండా ‘నేనైతే’ అని మాత్రమే ఉంచడం
  rationale: మొదటి మాటలు బెన్హదదువి, విడుదల చేసే అధికారం గల తదుపరి వక్త అహాబు అని కథాసందర్భం సూచిస్తుంది. తెలుగులో అయోమయం రాకుండా పేరును చేర్చాం; మాటల భావాన్ని మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘దమస్కు,’ ‘సమరయ’ వంటి స్థలనామాలకు తెలుగు బైబిలు వాడుకలో పరిచిత రూపాలను ఉంచాం. మూలంలోని రాజనీతిక సందర్భాన్ని సహజంగా తెలియజేస్తూనే חוּצוֹת మరియు בְּרִית పదాల నిజమైన అర్థవిస్తృతిని పాదసూచికల్లో భద్రపరిచాం.
