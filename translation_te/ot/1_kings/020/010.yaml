  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח אֵלָי/ו֙ בֶּן הֲדַ֔ד וַ/יֹּ֕אמֶר כֹּֽה יַעֲשׂ֥וּ/ן לִ֛/י אֱלֹהִ֖ים וְ/כֹ֣ה יוֹסִ֑פוּ אִם יִשְׂפֹּק֙ עֲפַ֣ר שֹׁמְר֔וֹן לִ/שְׁעָלִ֕ים לְ/כָל הָ/עָ֖ם אֲשֶׁ֥ר בְּ/רַגְלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/010.yaml
  text: Ben-hadad sent to him and said[a], “May the gods do so to me, and more also, if the dust of Samaria will be enough for handfuls for all the people who are at my feet.”
translation:
  language: te
  text: 'బెన్‌హదదు అతని దగ్గరికి వర్తమానం పంపి ఇలా అన్నాడు: “దేవతలు నాకు అలాగే చేయాలి, అంతకంటే ఎక్కువ కూడా చేయాలి—షోమ్రోను ధూళి నా వెంట ఉన్న ప్రజలందరికీ ఒక్కొక్క పిడికెడు చొప్పున[a] కూడా సరిపోతే!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలోని అరుదైన పదం అక్షరార్థంగా ‘చేతి గుంటలు’ అని కూడా అర్థమవవచ్చు. భావం ఏమిటంటే, తన వెంట ఉన్న ప్రతి ఒక్కరికీ ఒక పిడికెడు చొప్పున ఇవ్వడానికి కూడా షోమ్రోను ధూళి సరిపోదని బెన్‌హదదు ప్రగల్భాలు పలుకుతున్నాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אֵלָיו
  choice: అతని దగ్గరికి వర్తమానం పంపి
  rationale: దౌత్యసందర్భంలో שׁלח אֶל అంటే ఒకరి దగ్గరికి సందేశం పంపడం. హెబ్రీలో సందేశం అనే కర్మ స్పష్టంగా లేకపోయినా, తెలుగులో కేవలం ‘పంపి’ అంటే ఎవరిని లేదా దేనిని పంపాడో అసంపూర్ణంగా ఉంటుంది; అందువల్ల సందర్భార్థాన్ని సహజంగా తెలిపేలా ‘వర్తమానం’ చేర్చబడింది.
- source_word: בֶּן הֲדַד
  choice: బెన్‌హదదు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: כֹּה יַעֲשׂוּן לִי אֱלֹהִים וְכֹה יוֹסִפוּ
  choice: దేవతలు నాకు తగిన శిక్ష విధించి, దానికంటే ఇంకా ఎక్కువ చేయాలి
  rationale: ఇది తన మాట నెరవేరకపోతే తనపై శాపాన్ని ఆహ్వానించే ప్రమాణ సూత్రం. ‘ఇలా చేసి, ఇంకా ఎక్కువ చేయాలి’ అనే అక్షరార్థం తెలుగులో సూచనలేనిదిగా ఉండటంతో, దాని శాపార్థాన్ని స్పష్టంగా తెలియజేసింది; ‘దేవతలు’ బహువచనాన్ని నిలిపింది.
- source_word: אִם
  choice: సరిపోతే
  rationale: 'ప్రమాణ వాక్యంలో אִם షరతును ప్రవేశపెడుతుంది: చెప్పినది జరిగితే వక్తకు శాపం కలగాలని భావం. తెలుగు షరతు రూపం ఆ నిర్మాణాన్నీ అతిశయోక్తినీ నిలుపుతుంది.'
- source_word: יִשְׂפֹּק
  choice: సరిపోతే
  rationale: ספק ఇక్కడ ‘చాలుట, సరిపోవుట’ అనే భావం ఇస్తుంది.
- source_word: עֲפַר שֹׁמְרוֹן
  choice: షోమ్రోను ధూళి
  rationale: సమార్య పట్టణపు ధూళి అనే నిర్మాణ సంబంధాన్ని నేరుగా నిలిపింది.
- source_word: לִשְׁעָלִים
  choice: ఒక్కొక్క పిడికెడు చొప్పున
  rationale: ఈ అరుదైన పదం ఇక్కడ చేతి గుంటలో పట్టే పరిమాణం లేదా పిడికెడు అనే సంప్రదాయ, సందర్భానుకూల అర్థంలో తీసుకోబడింది. ప్రతి అనుచరునికి ఒక పిడికెడు కూడా దొరకదనే ప్రగల్భాన్ని సహజ తెలుగులో తెలిపింది.
- source_word: לְכָל הָעָם אֲשֶׁר בְּרַגְלָי
  choice: నా వెంట ఉన్న ప్రజలందరికీ
  rationale: అక్షరార్థమైన ‘నా పాదాల దగ్గర ఉన్న’ అనేది అతని వెంట ఉండి అతని ఆధీనంలో నడిచే సైనిక సమూహానికి సంబంధించిన హెబ్రీ నుడికారం. ‘నా వెంట ఉన్న’ రూపం దాని సైనిక అనుచర భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: అన్యజన రాజు ప్రమాణంలో אֱלֹהִים అనువాదం
  choice: దేవతలు
  alternative: దేవుడు
  rationale: వక్త ఇశ్రాయేలీయుడు కాని బెన్‌హదదు; క్రియ బహువచన రూపంలో ఉంది. కాబట్టి అతని దేవతలను సూచించే బహువచనమే కథన సందర్భానికీ వ్యాకరణానికీ తగినది.
- issue: ప్రమాణంలోని షరతు మరియు శాపార్థం
  choice: షోమ్రోను ధూళి సరిపోతే తనను దేవతలు శిక్షించాలని తెలిపే ప్రమాణంగా అనువదించడం
  alternative: షోమ్రోను ధూళి తప్పక సరిపోదని నేరుగా ప్రకటనగా మార్చడం
  rationale: మూలంలోని אִם షరతు నిర్మాణాన్ని నిలిపి, దానిలో అంతర్లీనంగా ఉన్న స్వశాప ప్రమాణాన్ని తెలుగులో గ్రాహ్యంగా చేసింది; ప్రగల్భాన్ని నేరుగా వివరణాత్మక ప్రకటనగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలి వాడబడింది. ‘నా వెంట ఉన్న’ ద్వారా హెబ్రీ నుడికారాన్ని సహజంగా వ్యక్తం చేసింది; అరుదైన לִשְׁעָלִים పదంలోని ‘చేతి గుంట/పిడికెడు’ భావం పాదసూచికలో భద్రపరచబడింది.
