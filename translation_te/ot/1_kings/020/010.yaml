  rationale: ప్రమాణంలోని శాపార్థాన్ని స్పష్టపరుస్తూనే, మూలం చెప్పని ‘శిక్ష’ను తొలగించాం. షరతు వాక్యాన్ని ప్రమాణసూత్రం తర్వాత ఉంచి హెబ్రీ క్రమాన్ని ప్రతిబింబించాం. లִשְׁעָלִים యొక్క అనిశ్చిత/అరుదైన పదార్థాన్ని పాదసూచికలో భద్రపరచి, పాఠ్యంలో సందర్భానుకూలమైన ‘పిడికెడు’ను ఉంచాం.
