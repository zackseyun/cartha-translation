source:
  edition: WLC
  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל הָתְפָּקְדוּ֙ וְ/כָלְכְּל֔וּ וַ/יֵּלְכ֖וּ לִ/קְרָאתָ֑/ם וַ/יַּחֲנ֨וּ בְנֵֽי יִשְׂרָאֵ֜ל נֶגְדָּ֗/ם כִּ/שְׁנֵי֙ חֲשִׂפֵ֣י עִזִּ֔ים וַ/אֲרָ֖ם מִלְא֥וּ אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/027.yaml
  text: And the sons of Israel were mustered and supplied[a], and they went to meet them. The sons of Israel camped opposite them like two little flocks of goats[c][b], but Aram filled the land.
translation:
  language: te
  text: ఇశ్రాయేలీయులు సమీకరించబడి, అవసరమైన సరఫరాలతో సిద్ధపరచబడ్డారు[a]. వారు అరామీయులను ఎదుర్కోవడానికి బయలుదేరారు. ఇశ్రాయేలీయులు వారికి ఎదురుగా రెండు చిన్న మేకల మందల్లా[b] మకాం వేశారు; అయితే అరామీయులు దేశమంతా నింపారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లెక్కించబడి, పోషించబడ్డారు” లేదా “సరఫరాలు అందించబడ్డారు.” మూలంలోని రెండు క్రియలు యుద్ధం కోసం సైనికులను సమీకరించడం లేదా లెక్కించడం, వారికి అవసరమైన ఆహారసామగ్రి లేదా సరఫరాలు సమకూర్చడం అనే భావాలను సూచిస్తాయి.
    reason: మొదటి రెండు హీబ్రూ క్రియల ప్రత్యామ్నాయ అర్థాలను, వాటి కర్మణి భావాన్ని తెలియజేస్తుంది.
  - marker: b
    text: హీబ్రూ వ్యక్తీకరణ అరుదైనది; అక్షరార్థంగా “మేకల రెండు చిన్న గుంపుల్లా.” విస్తారమైన అరాము సైన్యంతో పోలిస్తే ఇశ్రాయేలు సైన్యం ఎంతో చిన్నదిగా కనిపించిందని ఇది సూచిస్తుంది.
    reason: అరుదైన హీబ్రూ పదబంధంలోని రూపకాన్ని, దాని వ్యత్యాస ప్రభావాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: הָתְפָּקְדוּ
  choice: సైన్యంగా సమీకరించి
  rationale: హిత్పయేల్ రూపం ఇక్కడ యుద్ధం కోసం సైనికులను లెక్కించి సమీకరించడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ఈ ప్రయోగం ఎంచుకున్నాం.
- source_word: וְכָלְכְּלוּ
  choice: వారికి అవసరమైన సరఫరాలు అందించారు
  rationale: כלכל ఇక్కడ యుద్ధయాత్రకు కావలసిన ఆహారం లేదా సామగ్రితో సిద్ధపరచడాన్ని సూచిస్తుంది. కర్త స్పష్టంగా లేకపోవడాన్ని తెలుగు బహువచన క్రియతో అలాగే ఉంచాం.
- source_word: לִקְרָאתָם
  choice: అరామీయులను ఎదుర్కోవడానికి
  rationale: సైనిక సందర్భంలో 'కలుసుకోవడానికి' కంటే ప్రత్యర్థిని ఎదుర్కొనే భావం సహజంగా వ్యక్తమవుతుంది.
- source_word: נֶגְדָּם
  choice: వారికి ఎదురుగా
  rationale: రెండు సైన్యాల శిబిరాలు పరస్పరం ఎదురెదురుగా ఉన్న స్థానాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: כִּשְׁנֵי חֲשִׂפֵי עִזִּים
  choice: రెండు చిన్న మేకల మందల్లా
  rationale: అరుదైన חֲשִׂפֵי పదం చిన్నగా విడిపోయిన గుంపులను సూచిస్తున్నట్లు సందర్భం తెలియజేస్తుంది; అరామీయుల విస్తార సైన్యంతో వ్యత్యాసాన్ని సహజమైన తెలుగులో నిలిపాం.
- source_word: וַאֲרָם מִלְאוּ אֶת־הָאָרֶץ
  choice: అయితే అరామీయులు దేశమంతా నిండిపోయారు
  rationale: భూమిని నింపినంత విస్తారమైన అరామీయుల సైన్యాన్ని మూలపాఠ చిత్రణకు దగ్గరగా వ్యక్తం చేస్తుంది; 'అయితే' ముందున్న చిన్న ఇశ్రాయేలు గుంపులతో వ్యత్యాసాన్ని చూపుతుంది.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: అక్షరార్థమైన 'ఇశ్రాయేలు కుమారులు' తెలుగులో పురుషులను మాత్రమే సూచించే అపార్థం కలిగించవచ్చు; సమస్త ఇశ్రాయేలు సమాజాన్ని సూచించే సహజ సమానార్థకాన్ని వాడాం.
