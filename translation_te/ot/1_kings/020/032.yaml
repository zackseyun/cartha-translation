source:
  edition: WLC
  text: וַ/יַּחְגְּרוּ֩ שַׂקִּ֨ים בְּ/מָתְנֵי/הֶ֜ם וַ/חֲבָלִ֣ים בְּ/רָאשֵׁי/הֶ֗ם וַ/יָּבֹ֨אוּ֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יֹּ֣אמְר֔וּ עַבְדְּ/ךָ֧ בֶן הֲדַ֛ד אָמַ֖ר תְּחִֽי נָ֣א נַפְשִׁ֑/י וַ/יֹּ֛אמֶר הַ/עוֹדֶ֥/נּוּ חַ֖י אָחִ֥/י הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/032.yaml
  text: So they tied sackcloth around their waists and ropes on their heads[a], and they came to the king of Israel and said, “Your servant Ben-hadad says, ‘Please let me live.’” And he said[b], “Is he still alive? He is my brother.”
translation:
  language: te
  text: అప్పుడు వారు తమ నడుములకు గోనెపట్టలు కట్టుకొని, తమ తలలపై తాళ్లు వేసుకొని, ఇశ్రాయేలు రాజు దగ్గరకు వచ్చి, “మీ సేవకుడైన బెన్హదదు, ‘దయచేసి నన్ను బతకనివ్వండి’[a] అని అంటున్నాడు” అన్నారు. అందుకు అతడు, “అతడు ఇంకా బతికే ఉన్నాడా? అతడు నా సోదరుడు”[b] అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దయచేసి నా ప్రాణాన్ని కాపాడండి.” అక్షరార్థంగా, “దయచేసి నా ప్రాణం జీవించుగాక.”
    reason: lexical_alternative
  - marker: b
    text: “నా సోదరుడు” అనేది నిజమైన కుటుంబ బంధాన్ని కాకుండా రాజకీయ లేదా ఒడంబడిక సంబంధమైన సోదరభావాన్ని సూచించే అవకాశం ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּחְגְּרוּ
  choice: కట్టుకొని
  rationale: חגר అనే క్రియలోని చుట్టుకొని బిగించుకునే భౌతిక చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שַׂקִּים
  choice: గోనెపట్టలు
  rationale: దుఃఖం, అవమానం, లొంగుబాటు సూచించే ముతక వస్త్రాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: בְּמָתְנֵיהֶם
  choice: తమ నడుములకు
  rationale: מָתְנַיִם అనే పదానికి సందర్భానుకూలమైన, సాధారణ ఆధునిక తెలుగు సమానం.
- source_word: וַחֲבָלִים
  choice: తాళ్లు
  rationale: חֲבָלִים సూచించే తాడు లేదా తాళ్లను సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּרָאשֵׁיהֶם
  choice: తమ తలలపై
  rationale: తాళ్లు ఎలా అమర్చారో మూలపాఠం ఖచ్చితంగా చెప్పదు; అందువల్ల ‘పై’ అనే విస్తృత భావాన్ని ఉంచి అనవసర వివరణను నివారిస్తుంది.
- source_word: עַבְדְּךָ
  choice: మీ సేవకుడైన
  rationale: రాజకీయ వినయపూర్వక సంభాషణలో עבד ఇక్కడ బానిసత్వాన్ని ప్రత్యేకంగా ముందుకు తేవకుండా సేవకుని స్థితిని సూచిస్తుంది; రాజును ఉద్దేశించిన గౌరవప్రయోగంగా ‘మీ’ వాడబడింది.
- source_word: בֶן הֲדַד
  choice: బెన్హదదు
  rationale: వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న రూపానికి దగ్గరగా లిప్యంతరీకరించింది.
- source_word: תְּחִי נָא נַפְשִׁי
  choice: దయచేసి నన్ను బతకనివ్వండి
  rationale: అక్షరార్థంగా ‘దయచేసి నా ప్రాణం జీవించుగాక’ అనే ఈ హీబ్రూ నుడికారంలోని ప్రాణరక్షణ విన్నపాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַעוֹדֶנּוּ חַי
  choice: అతడు ఇంకా బతికే ఉన్నాడా?
  rationale: עוד మరియు חַי కలిపి అతడు ఇప్పటికీ సజీవంగా ఉన్నాడా అనే ప్రశ్నను సహజంగా వ్యక్తపరుస్తాయి.
- source_word: אָחִי הוּא
  choice: అతడు నా సోదరుడు
  rationale: ఆחי అనే సాధారణ బంధుత్వ పదాన్ని నేరుగా ఉంచి, అది నిజమైన కుటుంబ బంధమా లేక రాజకీయ సోదరభావమా అనే సందర్భगत సందిగ్ధతను కాపాడుతుంది.
theological_decisions:
- issue: అహాబు పలికిన ‘నా సోదరుడు’ అనే మాట యొక్క అర్థం
  choice: బంధుత్వ పదాన్ని నేరుగా ‘అతడు నా సోదరుడు’ అని ఉంచడం
  alternative: ‘అతడు నా మిత్రరాజు’ లేదా ‘అతడు నాకు సోదరునివంటివాడు’
  rationale: సందర్భంలో ఇది రాజకీయ లేదా ఒడంబడిక సంబంధమైన సోదరభావాన్ని సూచించే అవకాశం ఉన్నా, హీబ్రూ పాఠం సాధారణ బంధుత్వ పదమైన אָחִי నే వాడుతుంది. దాని భావాన్ని అనువాదంలోనే తీర్మానించకుండా మూలపాఠంలోని ఉద్వేగం, సందిగ్ధత నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథనశైలి వాడబడింది. రాజును ఉద్దేశించిన మాటల్లో మర్యాదార్థక బహువచనం ఉపయోగించబడింది. మూలంలోని స్పష్టమైన దృశ్యరూపాలు నిలుపబడ్డాయి; రాజకీయ ‘సోదరత్వం’ యొక్క భావాన్ని ప్రధాన పాఠంలో వివరణాత్మకంగా మార్చలేదు.
