  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ క్రియాపునరుక్తిని ప్రధాన వాక్యంలో అసహజంగా చేయకుండా పాదసూచికలో సంరక్షించాం.
