source:
  edition: WLC
  text: וַ/יִּמְצָא֙ אִ֣ישׁ אַחֵ֔ר וַ/יֹּ֖אמֶר הַכֵּ֣י/נִי נָ֑א וַ/יַּכֵּ֥/הוּ הָ/אִ֖ישׁ הַכֵּ֥ה וּ/פָצֹֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/037.yaml
  text: Then he found another man and said[a], “Please strike me.” So the man struck him and wounded him.
translation:
  language: te
  text: అప్పుడు అతడు మరొక మనిషిని కనుగొని, “దయచేసి నన్ను కొట్టు” అన్నాడు. ఆ మనిషి అతన్ని కొట్టి[a] గాయపరిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ‘కొట్టు’ అనే క్రియ నొక్కిచెప్పడానికి పునరుక్తమైంది; అక్షరార్థంగా, “ఆ మనిషి అతన్ని కొట్టాడు—కొడుతూ గాయపరిచాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא
  choice: అప్పుడు అతడు ... కనుగొని
  rationale: కథనాన్ని ముందుకు నడిపించే wayyiqtol రూపాన్ని సహజమైన తెలుగు క్రమసూచక పదమైన ‘అప్పుడు’తో వ్యక్తపరుస్తుంది; מצא యొక్క ‘కనుగొను’ అనే ప్రాథమిక భావాన్ని నిలుపుతుంది.
- source_word: אִישׁ אַחֵר
  choice: మరొక మనిషిని
  rationale: אִישׁ అనే ఏకవచన పుంలింగ నామాన్ని, אַחֵר అనే ‘మరొక’ భావంతో నేరుగా మరియు సహజంగా అందిస్తుంది.
- source_word: וַיֹּאמֶר
  choice: అని అడిగాడు
  rationale: సందర్భంలో పలికిన మాట ఒక అభ్యర్థన కావడంతో, తెలుగు భాషలో సహజంగా ‘అడిగాడు’ అని ఇచ్చాం; మాటల విషయాన్ని మార్చలేదు.
- source_word: הַכֵּינִי נָא
  choice: దయచేసి నన్ను కొట్టు
  rationale: נכה ఆజ్ఞారూపం మరియు ఏకవచన ప్రథమపురుష కర్మప్రత్యయాన్ని ‘నన్ను కొట్టు’గా, నָא లోని వినయపూర్వక అభ్యర్థనను ‘దయచేసి’గా వ్యక్తపరుస్తుంది.
- source_word: וַיַּכֵּהוּ הָאִישׁ
  choice: ఆ మనిషి అతన్ని కొట్టి
  rationale: కర్త అయిన నిర్దిష్ట ‘ఆ మనిషి’ని స్పష్టంగా ఉంచి, కర్మప్రత్యయంలోని ‘అతన్ని’ భావాన్ని నిలుపుతుంది; తెలుగు వాక్యక్రమానికి అనుగుణంగా క్రియను అనుసంధాన రూపంలో ఇస్తుంది.
- source_word: הַכֵּה וּפָצֹעַ
  choice: కొట్టి గాయపరిచాడు
  rationale: హీబ్రూలో ‘కొట్టు’ క్రియ పునరుక్తి తీవ్రతను సూచిస్తుండగా, פצע గాయం కలిగిన ఫలితాన్ని తెలియజేస్తుంది. ప్రధాన వాక్యంలో సహజమైన తెలుగు రూపాన్ని ఇచ్చి, పునరుక్తిని పాదసూచికలో తెలిపాం.
