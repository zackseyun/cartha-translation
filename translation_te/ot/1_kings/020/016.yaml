  text: וַ/יֵּצְא֖וּ בַּֽ/צָּהֳרָ֑יִם וּ/בֶן הֲדַד֩ שֹׁתֶ֨ה שִׁכּ֜וֹר בַּ/סֻּכּ֗וֹת ה֧וּא וְ/הַ/מְּלָכִ֛ים שְׁלֹשִֽׁים וּ/שְׁנַ֥יִם מֶ֖לֶךְ עֹזֵ֥ר אֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/016.yaml
  text: They went out at noon[a], while Ben-hadad was drinking himself drunk in the booths, he and the thirty-two kings who were helping him.
translation:
  language: te
  text: వారు మధ్యాహ్నం బయలుదేరారు. ఆ సమయంలో బెన్-హదదు, అతనికి సహాయం చేస్తున్న ముప్పై ఇద్దరు రాజులతో కలిసి, తాత్కాలిక పందిళ్లలో[a] మత్తెక్కేలా తాగుతున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆశ్రయాల్లో’ లేదా ‘గుడారాల్లో.’ హెబ్రూలో అక్షరార్థంగా ‘పందిళ్లలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: వారు బయలుదేరారు
  rationale: יצא అనే క్రియ యొక్క సాధారణ కథనార్థాన్ని, పట్టణం నుంచి సైనికులు బయటకు కదిలిన సందర్భానికి తగిన సహజమైన తెలుగులో అందిస్తుంది.
- source_word: בַּצָּהֳרָיִם
  choice: మధ్యాహ్న సమయంలో
  rationale: రోజు నడిమి సమయాన్ని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: וּבֶן הֲדַד
  choice: ఆ సమయంలో బెన్-హదదు
  rationale: వావ్‌ను కేవలం ‘మరియు’ అని కాకుండా, మొదటి చర్య జరుగుతున్నప్పటి సమాంతర పరిస్థితిని తెలిపే సందర్భార్థంలో అనువదిస్తుంది.
- source_word: שֹׁתֶה שִׁכּוֹר
  choice: తాగుతూ మత్తులో ఉన్నాడు
  rationale: కొనసాగుతున్న తాగే చర్యనూ, దాని ఫలితమైన మత్తు స్థితినీ నిలుపుతుంది; మూలంలో లేని పానీయాన్ని పేర్కొనదు.
- source_word: בַּסֻּכּוֹת
  choice: పందిళ్లలో
  rationale: סֻכּוֹת సూచించే తాత్కాలిక ఆశ్రయాల స్పష్టమైన రూపకాన్ని నిలుపుతూ, తెలుగులో అర్థమయ్యే పదాన్ని ఉపయోగిస్తుంది.
- source_word: הוּא וְהַמְּלָכִים שְׁלֹשִׁים וּשְׁנַיִם
  choice: ముప్పై ఇద్దరు రాజులతో కలిసి
  rationale: బెన్-హదదుతో ఆ రాజుల సహవాసాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: עֹזֵר אֹתוֹ
  choice: తనకు సహాయం చేస్తున్న
  rationale: కొనసాగుతున్న సహాయాన్ని తెలిపే కృదంత భావాన్ని నిలుపుతుంది; ‘తనకు’ అనే రూపం బెన్-హదదునే సూచిస్తుంది.
