  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హెబ్రూ వాక్యంలోని సమకాలీన పరిస్థితిని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా అందించాం; మూలంలోని భావ సంబంధం యథాతథంగా ఉంది.
