id: 1KI.20.11
reference: 1 Kings 20:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֤עַן מֶֽלֶךְ יִשְׂרָאֵל֙ וַ/יֹּ֣אמֶר דַּבְּר֔וּ אַל יִתְהַלֵּ֥ל חֹגֵ֖ר כִּ/מְפַתֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/011.yaml
  text: And the king of Israel answered and said[a], “Tell him, ‘Let not the one who girds on his armor boast like the one who takes it off.’”
translation:
  language: te
  text: 'ఇశ్రాయేలు రాజు జవాబిచ్చి ఇలా అన్నాడు: “అతనికి ఇలా చెప్పండి: ‘యుద్ధ సామగ్రిని కట్టుకునేవాడు, దాన్ని విప్పేవాడిలా గొప్పలు చెప్పుకోకూడదు.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “కట్టుకునేవాడు విప్పేవాడిలా గొప్పలు చెప్పుకోకూడదు.” ఏమి కట్టుకుంటాడో లేదా విప్పుతాడో మూలంలో స్పష్టంగా లేదు; యుద్ధ సందర్భంలో అది యుద్ధ సామగ్రిని సూచిస్తుంది. ఈ సామెత యుద్ధానికి సిద్ధమవుతున్న వ్యక్తిని, యుద్ధం ముగిసిన తరువాత సామగ్రిని విప్పుతున్న వ్యక్తితో పోలుస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן מֶלֶךְ יִשְׂרָאֵל וַיֹּאמֶר
  choice: ఇశ్రాయేలు రాజు జవాబిస్తూ ... అన్నాడు
  rationale: హీబ్రూ సంభాషణ సూత్రంలోని ‘జవాబిచ్చి చెప్పాడు’ అనే ద్వంద్వ ప్రకటనను సహజమైన ఆధునిక తెలుగులో ‘జవాబిస్తూ ... అన్నాడు’గా అందిస్తుంది; జవాబు భావాన్నీ, మాట పలికిన కార్యాన్నీ నిలుపుతుంది.
- source_word: דַּבְּרוּ
  choice: అతనితో ఇలా చెప్పండి
  rationale: ఇది బహువచన ఆజ్ఞ; సందర్భంలో రాజదూతలను ఉద్దేశించింది. హీబ్రూలో వ్యక్తంగా లేని పరోక్ష కర్మను సందర్భానుసారం ‘అతనితో’ అని స్పష్టం చేసింది.
- source_word: אַל יִתְהַלֵּל
  choice: గొప్పలు చెప్పుకోకూడదు
  rationale: హిత్పయేల్ రూపం తనను తాను గొప్పగా చెప్పుకోవడం అనే భావాన్ని ఇస్తుంది. సామెతలోని హెచ్చరికకు సహజమైన తెలుగు నిషేధ రూపం.
- source_word: חֹגֵר
  choice: యుద్ధ సామగ్రిని కట్టుకునేవాడు
  rationale: అక్షరార్థంగా ‘కట్టుకునేవాడు.’ యుద్ధ సందర్భంలో కవచం, ఆయుధబెల్టు మొదలైన సామగ్రిని ధరించి యుద్ధానికి సిద్ధమవుతున్న వ్యక్తిని సూచిస్తుంది; మూలంలో వస్తువు స్పష్టంగా లేకపోవడాన్ని పాదటీపులో తెలియజేస్తుంది.
- source_word: כִּמְפַתֵּחַ
  choice: దాన్ని విప్పేవాడిలా
  rationale: פתח ఇక్కడ కట్టుకున్నదాన్ని సడలించడం లేదా విప్పడం అనే అర్థంలో ఉంది. חֹגֵרతో ఉన్న ఉద్దేశపూర్వక వ్యతిరేకతను, యుద్ధం ముగిసిన తరువాత సామగ్రిని విప్పే దృశ్యాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సామెత ధోరణి. ‘యుద్ధ సామగ్రి’ అనే పదబంధం మూలంలోని సూచిత సైనిక వస్తువును స్పష్టం చేస్తుంది; పాదటీపు అక్షరార్థంలోని సంక్షిప్తతను సంరక్షిస్తుంది.
