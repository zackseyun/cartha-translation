revisions:
- from: నీవు కూడా, నీ దగ్గర నాశనమైన సైన్యానికి సమానమైన సైన్యాన్ని సమకూర్చుకో; గుర్రానికి గుర్రాన్ని, రథానికి రథాన్ని సమకూర్చుకో. అప్పుడు మనం మైదానంలో వారితో యుద్ధం చేద్దాం. తప్పకుండా మనం వారికంటే బలంగా ఉంటాం.” అతడు వారి మాట విని, అలాగే చేశాడు.
