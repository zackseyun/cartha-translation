source:
  edition: WLC
  text: וְ/אַתָּ֣ה תִֽמְנֶה לְ/ךָ֣ חַ֡יִל כַּ/חַיִל֩ הַ/נֹּפֵ֨ל מֵ/אוֹתָ֜/ךְ וְ/ס֣וּס כַּ/סּ֣וּס וְ/רֶ֣כֶב כָּ/רֶ֗כֶב וְ/נִֽלָּחֲמָ֤ה אוֹתָ/ם֙ בַּ/מִּישׁ֔וֹר אִם לֹ֥א נֶחֱזַ֖ק מֵ/הֶ֑ם וַ/יִּשְׁמַ֥ע לְ/קֹלָ֖/ם וַ/יַּ֥עַשׂ כֵּֽן־׀׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/025.yaml
  text: And you, muster for yourself an army like the army that fell from you, and horse for horse and chariot for chariot; then let us fight against them on the plain. Surely we will be stronger than they are.” So he listened to their voice and did so.
translation:
  language: te
  text: నీవు నీకోసం, నీ వద్దనుండి నశించిన సైన్యానికి సమానమైన సైన్యాన్ని సమీకరించుకో; గుర్రానికి గుర్రాన్ని, రథానికి రథాన్ని కూడా సమీకరించుకో. అప్పుడు మనం సమతల ప్రదేశంలో వారితో యుద్ధం చేద్దాం. నిశ్చయంగా మనం వారికంటే బలవంతులమవుతాం.” అతడు వారి మాట విని, అలాగే చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִמְנֶה
  choice: సమకూర్చుకో
  rationale: ఈ సందర్భంలో సైన్యాన్ని ‘లెక్కించు/నియమించు’ అనే మూలభావం, కోల్పోయిన బలగాలకు సమానంగా మళ్లీ సమీకరించుకోవాలనే సైనిక ఆదేశాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘సమకూర్చుకో’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: חַיִל
  choice: సైన్యం
  rationale: ఇక్కడ యుద్ధంలో నాశనమైన సైనిక బలగాన్ని సూచిస్తున్నందున ‘సైన్యం’ సరైన సందర్భార్థం.
- source_word: הַנֹּפֵל מֵאוֹתָךְ
  choice: నీ దగ్గర నాశనమైన
  rationale: పదశః ‘నీ నుండి పడిపోయిన’ అని ఉన్నా, యుద్ధ సందర్భంలో రాజు కోల్పోయిన/నాశనమైన సైన్యాన్ని సూచిస్తుంది. ‘నీ దగ్గర’ అనేది מֵאוֹתָךְ యొక్క సంబంధ భావాన్ని నిలుపుతుంది.
- source_word: סוּס כַּסּוּס וְרֶכֶב כָּרֶכֶב
  choice: గుర్రానికి గుర్రాన్ని, రథానికి రథాన్ని
  rationale: కోల్పోయిన ప్రతి గుర్రం, రథానికి సమానంగా భర్తీ చేయాలనే కొలమాన భావాన్ని, హెబ్రీ సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: בַּמִּישׁוֹר
  choice: మైదానంలో
  rationale: సమతల ప్రదేశం లేదా మైదానం అనే భౌగోళిక భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אִם לֹא נֶחֱזַק מֵהֶם
  choice: తప్పకుండా మనం వారికంటే బలంగా ఉంటాం
  rationale: హెబ్రీ ప్రమాణాత్మక/దృఢ నిశ్చయ నిర్మాణమైన אִם־לֹא ను తెలుగులో సహజమైన బలమైన నిశ్చయవాక్యంగా అందిస్తుంది.
- source_word: וַיִּשְׁמַע לְקוֹלָם
  choice: అతడు వారి మాట విని
  rationale: ‘వారి స్వరాన్ని విన్నాడు’ అనే పదశః రూపం ఇక్కడ వారి సలహాను ఆలకించి అంగీకరించాడనే అర్థంలో ఉంది; ‘వారి మాట విని’ సహజమైన తెలుగు నుడికారం.
