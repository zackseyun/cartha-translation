translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన రాజదౌత్య స్వరాన్ని నిలిపాం. ప్రత్యక్ష సంభాషణను స్పష్టంగా ఉంచుతూ, మూలంలోని ‘పంపినదంతా’ అనే స్వల్ప అస్పష్టతను వ్యాఖ్యానాత్మకంగా ‘కోరినదంతా’ లేదా ‘ఆజ్ఞాపించినదంతా’గా మార్చలేదు.
