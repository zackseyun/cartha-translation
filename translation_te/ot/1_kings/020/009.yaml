  text: וַ/יֹּ֜אמֶר לְ/מַלְאֲכֵ֣י בֶן הֲדַ֗ד אִמְר֞וּ לַֽ/אדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ כֹּל֩ אֲשֶׁר שָׁלַ֨חְתָּ אֶל עַבְדְּ/ךָ֤ בָ/רִֽאשֹׁנָה֙ אֶעֱשֶׂ֔ה וְ/הַ/דָּבָ֣ר הַ/זֶּ֔ה לֹ֥א אוּכַ֖ל לַ/עֲשׂ֑וֹת וַ/יֵּֽלְכוּ֙ הַ/מַּלְאָכִ֔ים וַ/יְשִׁבֻ֖/הוּ דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/009.yaml
  text: So he said to the messengers of Ben-hadad[a], “Say to my lord the king, ‘All that you sent to your servant the first time, I will do; but this thing I cannot do.’” And the messengers went and brought back word to him.
translation:
  language: te
  text: 'అతడు బెన్హదదు దూతలతో ఇలా అన్నాడు: “నా ప్రభువైన రాజుకు ఇలా చెప్పండి: ‘మొదటిసారి మీరు మీ సేవకునికి పంపినదంతా నేను చేస్తాను. అయితే ఈ విషయం[a] నేను చేయలేను.’” అప్పుడు ఆ దూతలు వెళ్లి అతనికి జవాబు తెలియజేశారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఈ సంగతి”; ఇక్కడ వాడిన హెబ్రీ పదానికి “విషయం,” “సంగతి,” లేదా “మాట/సందేశం” అనే అర్థాలు సందర్భానుసారంగా రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאֲכֵי
  choice: దూతలు
  rationale: రాజకీయ సందర్భంలో ఇది అతీంద్రియ దూతలను కాక రాజు పంపిన సందేశవాహకులను సూచిస్తుంది; తెలుగులో ‘దూతలు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: בֶן הֲדַד
  choice: బెన్హదదు
  rationale: వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు దగ్గరగా, తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో లిప్యంతరీకరించాం.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజుతో
  rationale: ఇది రాజసభలో గౌరవాన్ని, విధేయతను తెలిపే సంబోధన; ‘ప్రభువు’ ఇక్కడ దైవార్థంలో కాక రాజుకు ఇచ్చే గౌరవ బిరుదుగా ఉంది.
- source_word: כֹּל אֲשֶׁר שָׁלַחְתָּ
  choice: మీరు మీ సేవకునికి పంపినదంతా
  rationale: మూలంలోని ‘పంపు’ అనే క్రియను నిలిపి ఉంచాం; సందర్భంలో అది ముందుగా పంపిన అభ్యర్థన లేదా ఆజ్ఞను సూచించినా, ‘కోరినదంతా’ అని వ్యాఖ్యానాత్మకంగా మార్చలేదు.
- source_word: עַבְדְּךָ
  choice: మీ సేవకునికి
  rationale: రాజకీయ సంభాషణలో ఇది వినయపూర్వకమైన స్వీయ ప్రస్తావన; ‘బానిస’ కంటే ‘సేవకుడు’ దౌత్య సందర్భానికి తగినది.
- source_word: בָרִאשֹׁנָה
  choice: మొదటిసారి
  rationale: బెన్హదదు ముందుగా పంపిన సందేశాన్ని ఇది సూచిస్తుంది; ‘మొదటిసారి’ ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: וְהַדָּבָר הַזֶּה
  choice: అయితే ఈ విషయం
  rationale: דָּבָר పదానికి ‘విషయం,’ ‘సంగతి,’ ‘మాట/సందేశం’ వంటి అర్థాలు రావచ్చు. ఇక్కడ కొత్తగా చేసిన డిమాండును సూచించేందుకు ‘విషయం’ సహజంగా ఉంది; ‘డిమాండు’ అని అనువదించడం మూలం కంటే ఎక్కువ వ్యాఖ్యానాత్మకం అవుతుంది.
- source_word: לֹא אוּכַל לַעֲשׂוֹת
  choice: నేను చేయలేను
  rationale: సామర్థ్యలేమి లేదా అంగీకరించలేని స్థితిని తెలిపే మూల వాక్యానికి ఇది నేరుగా, సహజంగా సరిపోతుంది.
- source_word: וַיְשִׁבֻהוּ דָּבָר
  choice: అతనికి జవాబు తెలియజేశారు
  rationale: ‘మాటను తిరిగి తీసుకువెళ్లడం’ అనే హెబ్రీ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో జవాబు అందజేయడంగా వ్యక్తం చేశాం.
