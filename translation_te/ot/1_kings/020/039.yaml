- from: 'రాజు అటుగా వెళ్తుండగా, అతడు రాజును బిగ్గరగా పిలిచి ఇలా అన్నాడు: “నీ సేవకుడినైన నేను యుద్ధం మధ్యలోకి వెళ్లాను. అప్పుడు ఒక మనిషి పక్కకు వచ్చి, మరొక మనిషిని నా దగ్గరకు తీసుకొచ్చి, ‘ఈ మనిషికి కాపలా కాయి. ఇతడు ఏమాత్రం కనిపించకుండా పోయినా[a], ఇతని ప్రాణానికి బదులుగా నీ ప్రాణం ఇవ్వాలి[b]; లేకపోతే ఒక తలాంతు[c] వెండిని తూచి ఇవ్వాలి’ అని చెప్పాడు.”'
  to: 'రాజు అటుగా వెళ్తుండగా, అతడు రాజును బిగ్గరగా పిలిచి ఇలా అన్నాడు: “నీ సేవకుడినైన నేను యుద్ధం మధ్యలోకి వెళ్లాను. అప్పుడు ఒక మనిషి పక్కకు వచ్చి, మరొక మనిషిని నా దగ్గరకు తీసుకొచ్చి, ‘ఈ మనిషికి కాపలా కాయి. ఇతడు ఏమాత్రం కనిపించకుండా పోయినా[a], ఇతని ప్రాణానికి బదులుగా నీ ప్రాణం ఇవ్వాలి[b]; లేకపోతే ఒక తలాంతు[c] వెండిని తూచి ఇవ్వాలి’ అని చెప్పాడు.”'
  rationale: పాఠ్యానువాదం ఇప్పటికే మూలానికి నమ్మకంగా, సహజంగా ఉన్నందున దానిలో మార్పు చేయలేదు. పాదటిప్పణి aలోని హీబ్రూ వ్యాకరణ వివరణను మాత్రమే సాంకేతికంగా ఖచ్చితమైనదిగా సవరించాం. అన్ని పాదటిప్పణి గుర్తులు తమ తమ పదాలకు సరిగ్గా అనుసంధానంగా ఉన్నాయి.
