source:
  edition: WLC
  text: וַ/יְהִ֤י הַ/מֶּ֨לֶךְ֙ עֹבֵ֔ר וְ/ה֖וּא צָעַ֣ק אֶל הַ/מֶּ֑לֶךְ וַ/יֹּ֜אמֶר עַבְדְּ/ךָ֣ יָצָ֣א בְ/קֶֽרֶב הַ/מִּלְחָמָ֗ה וְ/הִנֵּֽה אִ֨ישׁ סָ֜ר וַ/יָּבֵ֧א אֵלַ֣/י אִ֗ישׁ וַ/יֹּ֨אמֶר֙ שְׁמֹר֙ אֶת הָ/אִ֣ישׁ הַ/זֶּ֔ה אִם הִפָּקֵד֙ יִפָּקֵ֔ד וְ/הָיְתָ֤ה נַפְשְׁ/ךָ֙ תַּ֣חַת נַפְשׁ֔/וֹ א֥וֹ כִכַּר כֶּ֖סֶף תִּשְׁקֽוֹל־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/039.yaml
  text: As the king was passing by[a], he cried out to the king and said, “Your servant went out into the midst of the battle, and behold, a man turned aside and brought a man to me and said, ‘Guard this man. If he is ever missing, then your life shall be for his life[b], or you shall weigh out a talent of silver.’”
translation:
  language: te
  text: 'రాజు అటుగా వెళ్తుండగా, అతడు రాజును బిగ్గరగా పిలిచి ఇలా అన్నాడు: “నీ సేవకుడినైన నేను యుద్ధం మధ్యలోకి వెళ్లాను. అప్పుడు ఒక మనిషి పక్కకు వచ్చి, మరొక మనిషిని నా దగ్గరకు తీసుకొచ్చి, ‘ఈ మనిషికి కాపలా కాయి. ఇతడు ఏమాత్రం కనిపించకుండా పోయినా[a], ఇతని ప్రాణానికి బదులుగా నీ ప్రాణం ఇవ్వాలి[b]; లేకపోతే ఒక తలాంతు[c] వెండిని తూచి ఇవ్వాలి’ అని చెప్పాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇతడు తప్పక తప్పిపోయినా” / “ఇతని ఆచూకీ ఏ విధంగానైనా తెలియకుండా పోయినా.” హీబ్రూలో అదే ధాతువు యొక్క ధాతురూపం (infinitive absolute), క్రియారూపంతో కలిసి వచ్చి భావాన్ని బలంగా నొక్కి చెబుతున్నాయి.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఇతని ప్రాణం స్థానంలో నీ ప్రాణం.” ఇది ప్రతిస్థాపనను తెలిపే చట్టపరమైన సూత్రం.
    reason: lexical_alternative
  - marker: c
    text: తలాంతు అనేది పురాతన కాలంలో ఉపయోగించిన పెద్ద బరువు కొలత.
    reason: historical_measure
lexical_decisions:
- source_word: עֹבֵר
  choice: అటుగా వెళ్తుండగా
  rationale: వַיְהִי తో వచ్చిన కృదంతం నేపథ్యంలో కొనసాగుతున్న చర్యను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ కాలవ్యాప్తిని సహజంగా తెలియజేస్తుంది.
- source_word: צָעַק אֶל־הַמֶּלֶךְ
  choice: రాజును బిగ్గరగా పిలిచి
  rationale: క్రియ గట్టిగా, అత్యవసరంగా పిలవడాన్ని సూచిస్తుంది; ‘మొరపెట్టాడు’ అని భావాన్ని మరీ నిర్దిష్టం చేయకుండా ధ్వని తీవ్రతను నిలుపుతుంది.
- source_word: עַבְדְּךָ
  choice: నీ సేవకుడినైన నేను
  rationale: రాజుతో మాట్లాడేటప్పుడు ఇది వినయపూర్వకమైన ప్రథమపురుష రాజాస్థాన ప్రయోగం; తెలుగులో సహజంగా అర్థమయ్యేలా వ్యక్తిని స్పష్టం చేసింది.
- source_word: בְּקֶרֶב הַמִּלְחָמָה
  choice: యుద్ధం మధ్యలోకి
  rationale: קֶרֶב యుద్ధం నడిమధ్యను, పోరాటం తీవ్రంగా జరుగుతున్న ప్రదేశాన్ని సూచిస్తుంది.
- source_word: וְהִנֵּה
  choice: అప్పుడు
  rationale: హీబ్రూ కథనంలో అకస్మాత్తుగా ఎదురైన దృశ్యాన్ని ముందుకు తెచ్చే కణాన్ని ఆధునిక సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אִישׁ סָר
  choice: ఒక మనిషి పక్కకు వచ్చి
  rationale: סוּר యొక్క ‘పక్కకు తిరుగు/తొలుగు’ భావాన్ని ఉంచుతూ, మాట్లాడేవాని వైపు అతడు వచ్చిన సందర్భానికి సరిపోయే సహజ తెలుగు ప్రయోగం.
- source_word: וַיָּבֵא אֵלַי אִישׁ
  choice: మరొక మనిషిని నా దగ్గరకు తీసుకొచ్చి
  rationale: మొదటి మనిషి వేరొక మనిషిని మాట్లాడేవాని సంరక్షణకు అప్పగించాడని వాక్య నిర్మాణం స్పష్టం చేస్తుంది.
- source_word: שְׁמֹר
  choice: కాపలా కాయి
  rationale: ఇది సాధారణంగా చూడమనే మాట కాక, అదుపులో ఉంచి సంరక్షించాలనే సైనిక బాధ్యతను సూచిస్తుంది.
- source_word: אִם הִפָּקֵד יִפָּקֵד
  choice: ఇతడు ఏమాత్రం కనిపించకుండా పోయినా
  rationale: నిఫాల్ infinitive absolute తో finite verb కలయిక కనిపించకుండా పోవడాన్ని బలంగా నొక్కి చెబుతుంది; ‘ఏమాత్రం’ ఆ ఉద్ఘాటనను తెలుగులో అందిస్తుంది.
- source_word: נַפְשְׁךָ תַּחַת נַפְשׁוֹ
  choice: ఇతని ప్రాణానికి బదులుగా నీ ప్రాణం ఇవ్వాలి
  rationale: נֶפֶשׁ ఇక్కడ ‘ప్రాణం/జీవితం’; תַּחַת చట్టపరమైన ప్రతిస్థాపన లేదా మార్పిడిని సూచిస్తుంది.
- source_word: כִּכַּר כֶּסֶף
  choice: ఒక తలాంతు వెండి
  rationale: כִּכַּר ఒక పురాతన బరువు కొలత; సంప్రదాయంగా గుర్తించదగిన ‘తలాంతు’ రూపాన్ని నిలుపుకుంది.
- source_word: תִּשְׁקוֹל
  choice: తూచి ఇవ్వాలి
  rationale: వెండిని నాణేలుగా కాక బరువు ప్రకారం చెల్లించే దృశ్యాన్ని క్రియ యొక్క అక్షరార్థానికి దగ్గరగా నిలుపుతుంది.
theological_decisions:
- issue: నַפְשְׁךָ תַּחַת נַפְשׁוֹ అనే ప్రతిస్థాపన సూత్రం
  choice: ఇతని ప్రాణానికి బదులుగా నీ ప్రాణం ఇవ్వాలి
  alternative: ఇతని ప్రాణం పోతే నీ ప్రాణం పోతుంది
  rationale: మూలంలోని చట్టపరమైన ‘ఒక ప్రాణం స్థానంలో మరో ప్రాణం’ అనే నిర్మాణాన్ని నిలిపి, దానిపై అదనపు సిద్ధాంతార్థాన్ని మోపకుండా అనువదించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కథన శైలిని ఉపయోగించింది. రాజాస్థాన వినయాన్ని ‘నీ సేవకుడినైన నేను’ ద్వారా, సైనిక సంరక్షణ భావాన్ని ‘కాపలా కాయి’ ద్వారా నిలిపింది. మూలంలోని ఉద్ఘాటన, ప్రతిస్థాపన సూత్రం, వెండిని బరువుతో చెల్లించే దృశ్యం పాదటిప్పణులతో సహా సంరక్షించబడ్డాయి.
