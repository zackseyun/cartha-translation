    reason: historical_measure
  revision_rationale: పాఠ్యానువాదం ఇప్పటికే మూలానికి నమ్మకంగా, సహజంగా ఉన్నందున దానిలో మార్పు చేయలేదు. పాదటిప్పణి aలోని హీబ్రూ వ్యాకరణ వివరణను మాత్రమే సాంకేతికంగా ఖచ్చితమైనదిగా సవరించాం. అన్ని పాదటిప్పణి గుర్తులు తమ తమ పదాలకు సరిగ్గా అనుసంధానంగా ఉన్నాయి.
