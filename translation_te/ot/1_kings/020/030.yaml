id: 1KI.20.30
reference: 1 Kings 20:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּנֻ֨סוּ הַ/נּוֹתָרִ֥ים אֲפֵקָ/ה֮ אֶל הָ/עִיר֒ וַ/תִּפֹּל֙ הַ/חוֹמָ֔ה עַל עֶשְׂרִ֨ים וְ/שִׁבְעָ֥ה אֶ֛לֶף אִ֖ישׁ הַ/נּוֹתָרִ֑ים וּ/בֶן הֲדַ֣ד נָ֔ס וַ/יָּבֹ֥א אֶל הָ/עִ֖יר חֶ֥דֶר בְּ/חָֽדֶר׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/030.yaml
  text: The survivors fled to Aphek[a], into the city, and the wall fell on twenty-seven thousand of the remaining men. Ben-hadad also fled and entered the city, into an inner room.
translation:
  language: te
  text: మిగిలినవారు ఆఫేకు పట్టణంలోకి పారిపోయారు. అప్పుడు ప్రాకారం మిగిలిన ఇరవై ఏడు వేలమంది పురుషుల మీద పడింది. బెన్‌హదదు కూడా పారిపోయి పట్టణంలోకి వెళ్లి, లోపలి గదిలోకి[a] ప్రవేశించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: “గదిలోని గదిలోకి”; అంటే లోపలి గది లేదా అత్యంత లోపలి గది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתָרִים
  choice: మిగిలినవారు / మిగిలిన
  rationale: యుద్ధం తర్వాత ప్రాణాలతో మిగిలినవారిని సూచిస్తుంది. మొదటి సందర్భంలో నామవాచకంగా ‘మిగిలినవారు,’ రెండవ సందర్భంలో పురుషులను విశేషించేలా ‘మిగిలిన’ అని సహజంగా అనువదించాం.
- source_word: אֲפֵקָה
  choice: ఆఫేకుకు
  rationale: స్థలనామానికి జతైన దిశార్థక ה, ఆఫేకు వైపు జరిగిన కదలికను సూచిస్తుంది.
- source_word: הָעִיר
  choice: పట్టణం
  rationale: עירకు సహజమైన తెలుగు సమానం. కథనంలోని కదలికను నిలుపుతూ రెండు సందర్భాల్లోనూ అనువదించాం.
- source_word: וַתִּפֹּל הַחוֹמָה
  choice: ప్రాకారం ... పడింది
  rationale: నిర్దిష్ట ఉపపదం ఉన్నందున నగర ప్రాకారాన్ని సూచించే నిర్దిష్ట భావాన్ని ‘ప్రాకారం’ నిలుపుతుంది; ఎంత భాగం పడిందో మూలపాఠం నిర్దిష్టంగా చెప్పదు.
- source_word: עַל עֶשְׂרִים וְשִׁבְעָה אֶלֶף אִישׁ
  choice: ఇరవై ఏడు వేలమంది పురుషుల మీద
  rationale: సంఖ్యను సహజమైన తెలుగు క్రమంలో ఇచ్చి, యుద్ధ సందర్భంలోని אישకు లింగసూచకమైన ‘పురుషులు’ వాడాం.
- source_word: וּבֶן הֲדַד נָס
  choice: బెన్‌హదదు కూడా పారిపోయి
  rationale: ప్రారంభంలోని నూస్ మూలంతో ఉన్న పదబంధ సంబంధాన్ని ‘పారిపోయి’ నిలుపుతుంది; ו సందర్భంలో సమాంతర చర్యను తెలుగులో సహజంగా ‘కూడా’ తెలియజేస్తుంది.
- source_word: חֶדֶר בְּחָדֶר
  choice: లోపలి గదిలోకి
  rationale: అక్షరార్థంగా ‘గదిలోని గది’; మరింత అంతర్భాగంలో ఉన్న గదిని సూచించే నుడికారంగా భావించి సహజమైన తెలుగులో ఇచ్చాం. అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలో లేని ‘దాక్కున్నాడు’ వంటి భావాన్ని చేర్చకుండా, ‘ప్రవేశించాడు’ అని క్రియను స్పష్టంగా నిలిపాం.
