source:
  edition: WLC
  text: וְ/אִ֨ישׁ אֶחָ֜ד מִ/בְּנֵ֣י הַ/נְּבִיאִ֗ים אָמַ֧ר אֶל רֵעֵ֛/הוּ בִּ/דְבַ֥ר יְהוָ֖ה הַכֵּ֣י/נִי נָ֑א וַ/יְמָאֵ֥ן הָ/אִ֖ישׁ לְ/הַכֹּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/035.yaml
  text: A certain man from the sons of the prophets said to his companion by the word of Yahweh[b][a], “Please strike me.” But the man refused to strike him.
translation:
  language: te
  text: ప్రవక్తల కుమారుల్లో ఒకడు[a] యాహ్వే వాక్కు ప్రకారం[b] తన సహచరునితో, “దయచేసి నన్ను కొట్టు” అన్నాడు. అయితే ఆ వ్యక్తి అతనిని కొట్టడానికి నిరాకరించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రవక్తల సమూహానికి చెందిన ఒకడు,” లేదా “ప్రవక్తల శిష్యుల్లో ఒకడు.” హీబ్రూలో అక్షరార్థంగా “ప్రవక్తల కుమారుల్లో ఒకడు”; ఇది ప్రవక్తల సమూహాన్ని సూచించే సాధారణ ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “యాహ్వే ఆజ్ఞ ప్రకారం,” లేదా “యాహ్వే వాక్కుచేత.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֶחָד
  choice: ఒకడు
  rationale: కథనంలో ఒక వ్యక్తిని పరిచయం చేసే హీబ్రూ ప్రయోగాన్ని సహజమైన తెలుగు రూపంలో అందిస్తుంది; וְ యొక్క కథన అనుసంధానాన్ని ప్రత్యేకంగా ‘అప్పుడు’ అని అధికంగా వ్యక్తం చేయలేదు.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: ప్రవక్తల కుమారుల్లో
  rationale: హీబ్రూ రూపక ప్రయోగాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, అది ప్రవక్తల సమూహాన్ని లేదా శిష్యులను సూచించవచ్చని పాదసూచికలో తెలిపింది.
- source_word: רֵעֵהוּ
  choice: తన తోటి వ్యక్తితో
  rationale: ‘స్నేహితుడు’ అని భావోద్వేగ సాన్నిహిత్యాన్ని అధికంగా సూచించకుండా, సహచరుడు లేదా తోటి వ్యక్తి అనే విస్తృత అర్థాన్ని కాపాడుతుంది.
- source_word: בִּדְבַר יְהוָה
  choice: యెహోవా వాక్కు ప్రకారం
  rationale: ప్రవచన అధికారాన్ని లేదా ఆజ్ఞను తెలిపే హీబ్రూ ప్రయోగాన్ని సహజమైన తెలుగులో అందిస్తూ, ‘ఆజ్ఞ ప్రకారం’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యమున్న లిప్యంతరీకరణతో అందించింది.
- source_word: הַכֵּינִי נָא
  choice: దయచేసి నన్ను కొట్టు
  rationale: נכה యొక్క ప్రాథమిక అర్థమైన ‘కొట్టు’ను నిలుపుతుంది; తరువాతి వచనంలోని గాయపరిచే ఫలితాన్ని ముందుగానే ఈ వచనంలో చేర్చదు. נָא ను ‘దయచేసి’గా వ్యక్తం చేసింది.
- source_word: וַיְמָאֵן
  choice: నిరాకరించాడు
  rationale: కేవలం సంశయం లేదా అయిష్టత కాకుండా స్పష్టమైన తిరస్కారాన్ని తెలియజేస్తుంది.
- source_word: לְהַכֹּתוֹ
  choice: అతణ్ణి కొట్టడానికి
  rationale: ముందటి ఆజ్ఞలోని נכה తో పదసామ్యాన్ని నిలుపుతూ, ‘గాయపరచడానికి’ అనే బలమైన ఫలితాన్ని ముందుగా దిగుమతి చేయదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; అందువల్ల దానిని బిరుదుగా మార్చకుండా తెలుగు పాఠకులకు పరిచితమైన ‘యెహోవా’ రూపంలో ఇచ్చింది.
- issue: בְּנֵי הַנְּבִיאִים ప్రయోగం ఎంత వ్యాఖ్యాత్మకంగా అనువదించాలి
  choice: ప్రవక్తల కుమారులు
  alternative: ప్రవక్తల సమూహం / ప్రవక్తల శిష్యులు
  rationale: ఇది ప్రవచన సమూహం లేదా శిష్యవర్గాన్ని సూచించే స్థిర ప్రయోగం కావచ్చు; అయినా సామాజిక నిర్మాణాన్ని నిర్దిష్టంగా తీర్మానించకుండా హీబ్రూ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, ప్రత్యామ్నాయాలను పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ప్రవక్తల కుమారులు’ అనే మూలభాషా రూపకాన్ని పారదర్శకత కోసం నిలిపి, దాని సాధ్యమైన సామూహిక లేదా శిష్యార్థాలను పాదసూచికలో ఇచ్చాం. పాదసూచిక గుర్తులు అవి వివరిస్తున్న పదబంధాల వెంట క్రమంగా ఉంచబడ్డాయి.
