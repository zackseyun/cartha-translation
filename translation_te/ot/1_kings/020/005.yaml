  text: וַ/יָּשֻׁ֨בוּ֙ הַ/מַּלְאָכִ֔ים וַ/יֹּ֣אמְר֔וּ כֹּֽה אָמַ֥ר בֶּן הֲדַ֖ד לֵ/אמֹ֑ר כִּֽי שָׁלַ֤חְתִּי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר כַּסְפְּ/ךָ֧ וּ/זְהָבְ/ךָ֛ וְ/נָשֶׁ֥י/ךָ וּ/בָנֶ֖י/ךָ לִ֥/י תִתֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/005.yaml
  text: 'The messengers returned and said[a], “Thus says Ben-hadad: ‘Though I sent to you, saying, “You shall give me your silver and your gold and your wives and your sons,”’”'
translation:
  language: te
  text: 'అప్పుడు దూతలు తిరిగి వచ్చి ఇలా చెప్పారు[a]: “బెన్‌హదదు ఇలా అంటున్నాడు: ‘నేను నీకు, “నీ వెండిని, నీ బంగారాన్ని, నీ భార్యలను, నీ కుమారులను నాకు ఇవ్వాలి” అని సందేశం పంపినప్పటికీ—’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “ఎందుకంటే నేను నీకు ఇలా చెప్పడానికి పంపాను: ‘నీ వెండిని, నీ బంగారాన్ని, నీ భార్యలను, నీ కుమారులను నాకు ఇవ్వాలి.’” హీబ్రూ పదం כִּי (కీ)కి అనేక అర్థాలు ఉండవచ్చు. తరువాతి వచనంలో డిమాండు మరింత తీవ్రమవుతున్నందున, ఇక్కడ దాన్ని రాయితీ భావంలో (“అప్పటికీ”) అనువదించాం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ הַמַּלְאָכִים
  choice: అప్పుడు దూతలు తిరిగి వచ్చి
  rationale: సంఘటనల క్రమాన్ని సూచించే వావ్‌ను సహజమైన తెలుగు కథనంలో ‘అప్పుడు’గా వ్యక్తం చేశాం. రాజకీయ సందర్భంలో מַלְאָכִים మానవ దూతలను సూచిస్తుంది.
- source_word: וַיֹּאמְרוּ
  choice: ఇలా చెప్పారు
  rationale: బహువచన కర్తకు సరిపోయే సహజమైన ఆధునిక తెలుగు రూపం; తరువాతి ప్రత్యక్ష వాక్యాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: כֹּה אָמַר
  choice: ఇలా అంటున్నాడు
  rationale: ప్రామాణిక దూత-ప్రకటన సూత్రాన్ని సహజ తెలుగులో వర్తమాన కాలంతో అందిస్తుంది.
- source_word: בֶּן הֲדַד
  choice: బెన్‌హదదు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: כִּי
  choice: అప్పటికీ
  rationale: తదుపరి వచనంలో పూర్తయ్యే డిమాండు తీవ్రత పెరుగుదల దృష్ట్యా దీనిని concessive భావంలో తీసుకున్నాం; అయితే మూలంలోని బహుఅర్థకతను పాదటిప్పణిలో నిలిపాం.
- source_word: שָׁלַחְתִּי אֵלֶיךָ לֵאמֹר
  choice: నేను నీకు వర్తమానం పంపి ... అని చెప్పాను
  rationale: ‘పంపాను’ అనే క్రియకు తెలుగులో అవసరమైన భావకర్మను ‘వర్తమానం’గా స్పష్టం చేస్తూ, పూర్వపు సందేశాన్ని సూచించే అర్థాన్ని సహజంగా అందిస్తుంది.
- source_word: כַּסְפְּךָ וּזְהָבְךָ
  choice: నీ వెండిని, నీ బంగారాన్ని
  rationale: విలువైన లోహాలుగా ఉన్న నిర్దిష్ట పదార్థార్థాన్ని నిలిపింది.
- source_word: וְנָשֶׁיךָ וּבָנֶיךָ
  choice: నీ భార్యలను, నీ కుమారులను
  rationale: సందర్భానుసారంగా נָשִׁיםకు ‘భార్యలు’, בָּנִיםకు లింగ-నిర్దిష్టమైన ‘కుమారులు’ సరైనవి.
- source_word: לִי תִתֵּן
  choice: నాకు అప్పగించాలని
  rationale: ఇది సాధారణ బహుమతి కాక బలవంతపు రాజాజ్ఞ/డిమాండు కాబట్టి ‘ఇవ్వాలి’ కంటే ‘అప్పగించాలి’ సందర్భబలాన్ని సహజంగా తెలియజేస్తుంది.
