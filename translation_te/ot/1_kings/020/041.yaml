source:
  edition: WLC
  text: וַ/יְמַהֵ֕ר וַ/יָּ֨סַר֙ אֶת הָ֣/אֲפֵ֔ר מ/על עֵינָ֑י/ו וַ/יַּכֵּ֤ר אֹת/וֹ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל כִּ֥י מֵֽ/הַ/נְּבִאִ֖ים הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/041.yaml
  text: Then he quickly removed the bandage from over his eyes[a], and the king of Israel recognized him, that he was one of the prophets.
translation:
  language: te
  text: అప్పుడు అతడు త్వరగా తన కళ్ల మీద ఉన్న కట్టును తీసివేశాడు[a]. అతడు ప్రవక్తల్లో ఒకడని ఇశ్రాయేలు రాజు గుర్తుపట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదమైన הָאֲפֵר‌ను సంప్రదాయంగా కొందరు ‘బూడిద’ అని అర్థం చేసుకున్నారు. అయితే ఈ సందర్భంలో అది మారువేషం కోసం కళ్ల మీద ఉంచుకున్న ఆవరణను లేదా కట్టును సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: అప్పుడు అతడు త్వరగా
  rationale: מהר అనే క్రియలో తొందరగా చేయడం అనే భావం ఉంది; కథన క్రమాన్ని וַ సూచిస్తున్నందున ‘అప్పుడు’ అని అనువదించాం.
- source_word: וַיָּסַר
  choice: తీసివేశాడు
  rationale: ఇక్కడ ఈ క్రియ ఒక వస్తువును దాని స్థానంనుంచి తొలగించడాన్ని సూచిస్తుంది; తెలుగులో ‘తీసివేశాడు’ సహజంగా ఉంది.
- source_word: הָאֲפֵר
  choice: కట్టును
  rationale: אֵפֶר సాధారణంగా ‘బూడిద’ అని అర్థమిచ్చినా, ఈ సందర్భంలో కళ్ల మీద మారువేషంగా ఉంచుకున్న ఆవరణను సూచించే అవకాశం ఎక్కువ. ‘కట్టు’ దాని సందర్భోచిత పనిని సహజంగా తెలియజేస్తుంది; పదసంబంధమైన అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: מֵעַל עֵינָיו
  choice: తన కళ్ల మీద ఉన్న
  rationale: מֵעַל అనే సంయుక్త విభక్తి కళ్లపై లేదా కళ్ల మీద ఉన్న స్థానం నుంచి తొలగించడాన్ని సూచిస్తుంది.
- source_word: וַיַּכֵּר אֹתוֹ
  choice: గుర్తుపట్టాడు
  rationale: హిఫిల్ రూపంలోని נכר ఇక్కడ ఒక వ్యక్తిని గుర్తించడం అనే అర్థం ఇస్తుంది; ‘గుర్తుపట్టాడు’ ఆధునిక తెలుగులో సహజమైన కథన పదం.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: మూలంలోని సమాస సంబంధాన్ని సూటిగా, సహజమైన తెలుగు పదక్రమంలో నిలిపాం.
- source_word: כִּי
  choice: అని
  rationale: ఇక్కడ כִּי కారణాన్ని కాకుండా రాజు గుర్తించిన విషయాన్ని పరిచయం చేస్తుంది; తెలుగు పరోక్ష వాక్యంలో ‘అని’ దీనిని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מֵהַנְּבִאִים
  choice: ప్రవక్తల్లో ఒకడు
  rationale: מן ఇక్కడ సమూహంలోని సభ్యత్వాన్ని సూచిస్తుంది; అందువల్ల ‘ప్రవక్తల్లో ఒకడు’ సహజమైన భాగార్థక అనువాదం.
- source_word: הוּא
  choice: ఒకడని
  rationale: హీబ్రూలో ఇది క్రియలేని నామవాక్యం; తెలుగు పరోక్ష వాక్య నిర్మాణంలో లింగం, ఏకవచనం, గుర్తించిన విషయం ‘ఒకడని’ ద్వారా సహజంగా వ్యక్తమవుతాయి.
