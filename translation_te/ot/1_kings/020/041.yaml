  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని వేగం, చర్యల క్రమం, గుర్తింపు అనే భావాలను నిలిపి, הָאֲפֵר పదంలోని నిజమైన పదార్థ అనిశ్చితిని పాదసూచికలో వెల్లడించాం.
