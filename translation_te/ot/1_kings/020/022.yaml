  to: 'అప్పుడు ప్రవక్త ఇశ్రాయేలు రాజు దగ్గరకు వచ్చి అతనితో ఇలా అన్నాడు: “నీవు వెళ్లి నిన్ను బలపరచుకో. తెలుసుకో, నీవు ఏమి చేయాలో[a] చూడు. ఎందుకంటే సంవత్సరం తిరిగే కాలంలో[b] అరాము రాజు నీ మీదికి దండెత్తి వస్తాడు.”'
  rationale: Only the middle command sequence is revised, changing the interpretive “జాగ్రత్తగా ఆలోచించు” to “నీవు ఏమి చేయాలో చూడు.” This preserves the Hebrew’s paired imperatives, “know” and “see,” while retaining the contextual sense expressed by the footnote. All other wording and both footnote anchors remain valid.
