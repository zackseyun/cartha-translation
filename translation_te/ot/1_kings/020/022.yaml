source:
  edition: WLC
  text: וַ/יִּגַּ֤שׁ הַ/נָּבִיא֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יֹּ֤אמֶר ל/וֹ֙ לֵ֣ךְ הִתְחַזַּ֔ק וְ/דַ֥ע וּ/רְאֵ֖ה אֵ֣ת אֲשֶֽׁר תַּעֲשֶׂ֑ה כִּ֚י לִ/תְשׁוּבַ֣ת הַ/שָּׁנָ֔ה מֶ֥לֶךְ אֲרָ֖ם עֹלֶ֥ה עָלֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/022.yaml
  text: Then the prophet came near to the king of Israel and said to him[a], “Go, strengthen yourself, and know and see what you should do[c][b], because at the turn of the year the king of Aram will come up against you.”
translation:
  language: te
  text: 'అప్పుడు ప్రవక్త ఇశ్రాయేలు రాజు దగ్గరకు వచ్చి అతనితో ఇలా అన్నాడు: “నీవు వెళ్లి నిన్ను బలపరచుకో. తెలుసుకో, నీవు ఏమి చేయాలో[a] చూడు. ఎందుకంటే సంవత్సరం తిరిగే కాలంలో[b] అరాము రాజు నీ మీదికి దండెత్తి వస్తాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు ఏమి చేస్తావో.” హీబ్రూ క్రియారూపం అక్షరార్థంగా భవిష్యత్తును సూచిస్తుంది; అయితే ఇక్కడ రాజు ఏం చేయాలో ఆలోచించి సిద్ధపడాలనే భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “సంవత్సరం తిరిగే కాలం” అనేది హీబ్రూ నుడికారం. ఇది సాధారణంగా సైనిక దండయాత్రలు మళ్లీ మొదలయ్యే కాలాన్ని సూచిస్తుంది; కొందరు దీనిని “వచ్చే వసంతకాలంలో” అని అనువదిస్తారు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: దగ్గరకు వచ్చి
  rationale: נגשׁ అనే క్రియలోని సమీపించడం అనే భావాన్ని సహజమైన తెలుగు కథన శైలిలో నిలుపుతుంది.
- source_word: הִתְחַזַּק
  choice: నిన్ను బలపరచుకో
  rationale: హిత్పయేల్ ఆజ్ఞారూపంలోని ఆత్మవాచక బలాన్ని నిలుపుతూ, రాబోయే యుద్ధానికి తనను తాను సిద్ధం చేసుకోవాలనే భావాన్ని తెలియజేస్తుంది.
- source_word: וְדַע וּרְאֵה
  choice: తెలుసుకొని జాగ్రత్తగా ఆలోచించు
  rationale: హీబ్రూలోని ‘తెలుసుకో, చూడు’ అనే జంట ఆజ్ఞలను తెలుగులో యాంత్రికంగా కాకుండా, పరిస్థితిని గ్రహించి ఏం చేయాలో పరిశీలించమనే సహజ భావంతో అందిస్తుంది.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: నీవు ఏమి చేయాలో
  rationale: రూపం అక్షరార్థంగా భవిష్యత్తును సూచించగలిగినా, సందర్భంలో తగిన చర్యను నిర్ణయించమనే ఆచరణాత్మక భావం ప్రధానంగా ఉంది; ప్రత్యామ్నాయాన్ని పాదటీపులో ఉంచాం.
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: సంవత్సరం తిరిగే కాలంలో
  rationale: సంవత్సరం ‘తిరిగి రావడం/మలుపు తిరగడం’ అనే హీబ్రూ కాలసూచక నుడికారాన్ని కాపాడుతుంది; దాని సాంస్కృతిక భావాన్ని పాదటీపు వివరిస్తుంది.
- source_word: מֶלֶךְ אֲרָם
  choice: అరాము రాజు
  rationale: తరువాతి కాలపు ‘సిరియా’ అనే పేరుకు బదులుగా హీబ్రూ స్థలనామమైన אֲרָם ను నేరుగా ప్రతిబింబిస్తుంది.
- source_word: עֹלֶה עָלֶיךָ
  choice: నీ మీదికి దండెత్తి వస్తాడు
  rationale: సైనిక సందర్భంలో עלה על అంటే ఎదిరిగా సైన్యంతో రావడం; ‘దండెత్తి వస్తాడు’ ఆ ముప్పును సహజమైన తెలుగులో తెలియజేస్తూ భవిష్యదర్థాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. రాజును ఉద్దేశించిన ఏకవచనాన్ని స్పష్టంగా చూపేందుకు ‘నీవు’ వాడాం. హీబ్రూ పదజంటలను పూర్తిగా యాంత్రికంగా అనువదించకుండా వాటి సమిష్టి ఆచరణాత్మక భావాన్ని సహజంగా వ్యక్తం చేశాం; నిజమైన వ్యాకరణ సందిగ్ధతను పాదటీపులో నిలిపాం.
