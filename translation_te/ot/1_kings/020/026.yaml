translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలి. మూలంలోని కాలనుడికారాన్ని, ‘అరాము’ అనే సూచనలోని రాజ్యం/ప్రజలు అనే సందిగ్ధతను, అలాగే ‘తో/వ్యతిరేకంగా’ అనే సంబంధాన్ని పాదటిప్పణులతో నిలుపుకుంది.
