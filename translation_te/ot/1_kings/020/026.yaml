- from: సంవత్సరం తిరిగి వచ్చినప్పుడు[a], బెన్హదదు అరామును[b] సమీకరించి, ఇశ్రాయేలుతో[c] యుద్ధం చేయడానికి ఆఫేకుకు వెళ్లాడు.
  to: సంవత్సరం మళ్లీ వచ్చినప్పుడు[a], బెన్-హదదు అరాము సైన్యాన్ని[b] సమీకరించి, ఇశ్రాయేలుతో[c] యుద్ధానికి ఆఫేకుకు పైకి వెళ్లాడు.
