  text: וַֽ/יְהִי֙ לִ/תְשׁוּבַ֣ת הַ/שָּׁנָ֔ה וַ/יִּפְקֹ֥ד בֶּן הֲדַ֖ד אֶת אֲרָ֑ם וַ/יַּ֣עַל אֲפֵ֔קָ/ה לַ/מִּלְחָמָ֖ה עִם יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/026.yaml
  text: At the turn of the year[c][b][a], Ben-hadad mustered Aram and went up to Aphek for battle with Israel.
translation:
  language: te
  text: సంవత్సరం మళ్లీ వచ్చినప్పుడు[a], బెన్-హదదు అరాము సైన్యాన్ని[b] సమీకరించి, ఇశ్రాయేలుతో[c] యుద్ధానికి ఆఫేకుకు పైకి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘సంవత్సరం తిరిగి వచ్చినప్పుడు.’ ఇది వార్షిక చక్రం మళ్లీ వచ్చిన సమయాన్ని సూచించే నుడికారం; కొందరు దీనిని ‘వసంతకాలంలో’ అని అనువదిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘అరామును.’ ‘అరాము’ రాజ్యాన్ని, దాని ప్రజలను, లేదా దాని సైన్యాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ఇశ్రాయేలుకు వ్యతిరేకంగా.’ హీబ్రూలో అక్షరార్థంగా ‘తో’; ఇక్కడ అది యుద్ధ సందర్భంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: సంవత్సరం తిరిగి వచ్చినప్పుడు
  rationale: హీబ్రూ నుడికారంలోని ‘సంవత్సరం తిరిగి రావడం’ అనే రూపాన్ని సహజమైన తెలుగులో నిలుపుతుంది; అది ప్రత్యేకంగా వసంతకాలమే అని నిర్ధారించదు.
- source_word: וַיִּפְקֹד
  choice: సమీకరించి
  rationale: సైనిక సందర్భంలో פקד సైన్యాన్ని కూడగట్టడం లేదా సమీక్షించడం అనే భావం ఇస్తుంది; ‘సమీకరించి’ సాధారణ పాఠకునికి సహజంగా ఉండి సైనిక భావాన్ని అందిస్తుంది.
- source_word: אֶת אֲרָם
  choice: అరామును
  rationale: మూలంలో ఉన్న రాజ్యం/ప్రజల పేరు ‘అరాము’నే ఉంచుతుంది; సందర్భంలో అది అరాము సైన్యాన్ని సూచించవచ్చు.
- source_word: וַיַּעַל
  choice: వెళ్లాడు
  rationale: עלה అక్షరార్థంగా ‘పైకి వెళ్లాడు’; తెలుగులో గమ్యస్థానానికి వెళ్లడాన్ని సహజంగా చెప్పేందుకు ‘వెళ్లాడు’ వాడబడింది, దిశ లేదా భౌగోళిక ఎత్తును అనవసరంగా నిర్దిష్టం చేయలేదు.
- source_word: אֲפֵקָה
  choice: ఆఫేకుకు
  rationale: స్థలనామానికి జతైన దిశాసూచక రూపం ఆఫేకు వైపు కదలికను తెలియజేస్తుంది.
- source_word: לַמִּלְחָמָה
  choice: యుద్ధం చేయడానికి
  rationale: తక్షణ సైనిక సందర్భంలో ‘యుద్ధం కోసం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עִם יִשְׂרָאֵל
  choice: ఇశ్రాయేలుతో
  rationale: హీబ్రూ עִם అక్షరార్థమైన ‘తో’ను నిలుపుతుంది; యుద్ధ సందర్భంలో దీని భావం ‘ఇశ్రాయేలుకు వ్యతిరేకంగా’ అని ఉంటుంది.
