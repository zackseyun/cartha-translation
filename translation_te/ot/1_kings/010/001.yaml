id: 1KI.10.1
reference: 1 Kings 10:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מַֽלְכַּת שְׁבָ֗א שֹׁמַ֛עַת אֶת שֵׁ֥מַע שְׁלֹמֹ֖ה לְ/שֵׁ֣ם יְהוָ֑ה וַ/תָּבֹ֥א לְ/נַסֹּת֖/וֹ בְּ/חִידֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/001.yaml
  text: The queen of Sheba heard of Solomon’s fame concerning the name of Yahweh[b][a], and she came to test him with riddles.
translation:
  language: te
  text: షెబా రాణి యాహ్వే నామంతో సంబంధమున్న సొలొమోను కీర్తి గురించి విని[a], పొడుపుకథలతో[b] అతన్ని పరీక్షించడానికి వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే నామానికి సంబంధించి సొలొమోను గురించిన వార్తను విని.” హీబ్రూ పదబంధం సంక్షిప్తంగా ఉంది; సొలొమోను కీర్తి యాహ్వే నామంతో లేదా ప్రతిష్ఠతో అనుసంధానమై ఉందని ఇది సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “కఠినమైన ప్రశ్నలతో.” హీబ్రూ పదం మరింత అక్షరార్థంగా పొడుపుకథలు లేదా గూఢార్థపు మాటలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מַֽלְכַּת שְׁבָא
  choice: షెబా రాణి
  rationale: వావ్ కథన కొనసాగింపును సూచిస్తుంది; తెలుగులో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండానే సహజమైన కథన ప్రవాహం నిలుస్తుంది. స్థలనామాన్ని ‘షెబా’గా లిప్యంతరీకరించాం.
- source_word: שֹׁמַעַת
  choice: విని
  rationale: కథన సందర్భంలో ఈ కృదంతం తరువాతి చర్యకు నేపథ్యమైన వినికిడిని సూచిస్తుంది; ‘విని’ సహజమైన తెలుగు అనుసంధానం.
- source_word: אֶת שֵׁמַע שְׁלֹמֹה
  choice: సొలొమోను కీర్తి గురించి
  rationale: שֵׁמַע అంటే వార్త, వినికిడి లేదా కీర్తి. దూరదేశపు రాణి విని పరిశీలించడానికి రావడం అనే సందర్భంలో ‘కీర్తి’ తగినది.
- source_word: לְ/שֵׁם יְהוָה
  choice: యాహ్వే నామంతో సంబంధమున్న
  rationale: לְ అనే సంబంధార్థక ప్రయోగాన్ని కారణం లేదా ఉద్దేశంగా ఖచ్చితపరచకుండా, యాహ్వే నామంతో సొలొమోను కీర్తికి ఉన్న అనుబంధాన్ని నిలుపుతుంది.
- source_word: וַ/תָּבֹא
  choice: వచ్చింది
  rationale: కథనాన్ని ముందుకు నడిపే సాధారణ భూతకాల చర్యగా సహజమైన తెలుగులో ఇచ్చాం.
- source_word: לְ/נַסֹּת֖/וֹ
  choice: అతన్ని పరీక్షించడానికి
  rationale: נסה ఇక్కడ అతని జ్ఞానాన్ని పరీక్షించడం అనే భావాన్ని ఇస్తుంది.
- source_word: בְּ/חִידֽוֹת
  choice: పొడుపుకథలతో
  rationale: חִידוֹת కు ప్రాథమికంగా పొడుపుకథలు లేదా గూఢార్థపు ప్రశ్నలు అనే అర్థం ఉంది; ‘పొడుపుకథలు’ మూలపదానికి సమీపమైన సహజ తెలుగు రూపం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామమైన చతురక్షర నామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: సొలొమోను కీర్తికి యాహ్వే నామంతో ఉన్న సంబంధం
  choice: యాహ్వే నామంతో సంబంధమున్న సొలొమోను కీర్తి
  alternative: యాహ్వే నామం కారణంగా వచ్చిన సొలొమోను కీర్తి
  rationale: హీబ్రూ לְשֵׁם יְהוָה సంక్షిప్తంగా, అర్థసందిగ్ధంగా ఉంది. కారణం, ఉద్దేశం లేదా ఖచ్చితమైన ధార్మిక వివరణను రుద్దకుండా సంబంధాన్ని మాత్రమే ప్రధాన పాఠంలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘నామంతో సంబంధమున్న’ అనే నిర్మాణం మూలంలోని ఉద్దేశపూర్వక సంక్షిప్తతను, అర్థసందిగ్ధతను కాపాడుతుంది; ‘పొడుపుకథలు’ సాధారణ పాఠకులకు అర్థమయ్యే ప్రత్యక్ష పదం.
