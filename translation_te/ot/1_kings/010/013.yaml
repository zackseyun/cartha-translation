id: 1KI.10.13
reference: 1 Kings 10:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/מֶּ֨לֶךְ שְׁלֹמֹ֜ה נָתַ֣ן לְ/מַֽלְכַּת שְׁבָ֗א אֶת כָּל חֶפְצָ/הּ֙ אֲשֶׁ֣ר שָׁאָ֔לָה מִ/לְּ/בַד֙ אֲשֶׁ֣ר נָֽתַן לָ֔/הּ כְּ/יַ֖ד הַ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה וַ/תֵּ֛פֶן וַ/תֵּ֥לֶךְ לְ/אַרְצָ֖/הּ הִ֥יא וַ/עֲבָדֶֽי/הָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/013.yaml
  text: And King Solomon gave the queen of Sheba all that she desired[a], whatever she asked, besides what he gave her according to the hand of King Solomon. Then she turned and went to her own land, she and her servants.
translation:
  language: te
  text: సొలొమోను రాజు షెబా రాణి కోరుకున్నదంతా—ఆమె అడిగినదేదైనా—ఆమెకు ఇచ్చాడు. సొలొమోను రాజు తన స్థోమతకు తగినట్లుగా ఆమెకు ఇచ్చిన వాటికి అదనంగా కూడా ఆయన ఆమెకు ఇచ్చాడు.[a] ఆ తర్వాత ఆమె వెనుదిరిగి, తన సేవకులతో కలిసి తన దేశానికి వెళ్లింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థంగా: “సొలొమోను రాజు చేతికి తగినట్లుగా.” ఇది అతని స్థోమత, సామర్థ్యం లేదా ఔదార్యాన్ని సూచించే హీబ్రూ నుడికారం.'
    reason: నుడికారానికి అక్షరార్థం మరియు సాధ్యార్థ పరిధిని తెలియజేయడం
lexical_decisions:
- source_word: נָתַן
  choice: ఇచ్చాడు
  rationale: రెండు సందర్భాల్లోనూ సాధారణమైన ‘ఇవ్వడం’ అనే అర్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: מַלְכַּת שְׁבָא
  choice: షెబా రాణి
  rationale: స్థల నామంతో కూడిన రాజబిరుదును ఆధునిక ప్రామాణిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: כָּל חֶפְצָהּ אֲשֶׁר שָׁאָלָה
  choice: కోరుకున్నదంతా—ఆమె అడిగినదేదైనా
  rationale: ‘కోరిక’ మరియు ‘అడగడం’ అనే సమీపార్థకమైనప్పటికీ వేర్వేరు రెండు హీబ్రూ వ్యక్తీకరణలను కుదించకుండా నిలుపుతుంది.
- source_word: מִלְּבַד
  choice: అంతేకాక
  rationale: ముందు చెప్పిన దానికంటే అదనంగా ఇచ్చాడనే భావాన్ని సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: כְּיַד הַמֶּלֶךְ שְׁלֹמֹה
  choice: సొలొమోను రాజు తన స్థోమతకు తగినట్లుగా
  rationale: అక్షరార్థంగా ‘సొలొమోను రాజు చేతికి తగినట్లు’; ఇక్కడ ‘చేయి’ అతని వనరులు, సామర్థ్యం లేదా ఔదార్యాన్ని సూచించే నుడికారం. ‘స్థోమత’ ఈ విస్తృత భావాన్ని అతిగా నిర్దిష్టం చేయకుండా సహజంగా తెలియజేస్తుంది.
- source_word: וַתֵּפֶן וַתֵּלֶךְ לְאַרְצָהּ
  choice: తన దేశానికి తిరిగి వెళ్లిపోయింది
  rationale: ‘తిరిగి/మళ్లి వెళ్లింది’ అనే ప్రయాణ ముగింపు భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; రెండు హీబ్రూ క్రియలను తెలుగులో కృత్రిమంగా విడదీయదు.
- source_word: הִיא וַעֲבָדֶיהָ
  choice: ఆమె తన సేవకులతో కలిసి
  rationale: రాణితో ప్రయాణించిన పరివారాన్ని సూచించే సందర్భంలో עֲבָדִיםకు నేరుగా సరిపోయే సాధారణ పదం ‘సేవకులు’.
theological_decisions:
- issue: כְּיַד הַמֶּלֶךְ שְׁלֹמֹה అనే నుడికారపు అర్థం
  choice: సొలొమోను రాజు తన స్థోమతకు తగినట్లుగా
  alternative: సొలొమోను రాజు చేతికి తగినట్లుగా; సొలొమోను రాజు ఔదార్యానికి తగినట్లుగా
  rationale: ‘చేయి’ అనే అక్షరానువాదం తెలుగులో భావాన్ని స్పష్టం చేయదు; ‘ఔదార్యం’ ఒక్కదానికే పరిమితం చేస్తే సామర్థ్యం లేదా వనరులు అనే సాధ్యార్థాలు కనుమరుగవుతాయి. ‘స్థోమత’ మూలంలోని అర్థవిస్తృతిని మెరుగ్గా కాపాడుతుంది.
- issue: עֲבָדֶיהָ అనే పదం రాజసభ సందర్భంలో
  choice: తన సేవకులతో కలిసి
  alternative: తన పరివారంతో కలిసి; తన దాసులతో కలిసి
  rationale: ఈ వాక్యం వారి ఖచ్చితమైన సామాజిక స్థితిని నిర్ధారించదు. ‘సేవకులు’ అనేది మూలపదానికి విస్తృతమైన, తటస్థమైన సమానార్థకం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలోని పునరుక్తి భావాన్ని నిలుపుతూ, హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో సహజంగా అనువదించి అక్షరార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
