  yaml_path: translation/ot/1_kings/010/004.yaml
  text: When the queen of Sheba saw all the wisdom of Solomon and the house that he had built,[a]
translation:
  language: te
  text: షెబా రాణి సొలొమోను జ్ఞానమంతటినీ, అతడు కట్టిన గృహాన్నీ[a] చూసినప్పుడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతడు కట్టిన రాజభవనాన్నీ.’ ఇక్కడ ‘గృహం’ అనే హీబ్రూ పదం సందర్భానుసారం రాజనివాసాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: చూసినప్పుడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తూనే, ఈ వచనం తరువాతి వచనంలో కొనసాగే వాక్యానికి ఉపవాక్యంగా పనిచేస్తుంది; అందువల్ల ‘చూసినప్పుడు’ సహజంగా ఉంటుంది.
- source_word: מַלְכַּת שְׁבָא
  choice: షెబ దేశపు రాణి
  rationale: షెబకు చెందిన పాలకురాలిని సూచించే నిర్మాణ సంబంధ పదబంధం. ఆధునిక తెలుగు పాఠకులకు స్థలసంబంధం స్పష్టంగా ఉండేందుకు ‘దేశపు’ చేర్చబడింది.
- source_word: אֵת
  choice: '[ప్రత్యక్ష కర్మ సూచకం; విడిగా అనువదించలేదు]'
  rationale: ఇది నిర్దిష్ట ప్రత్యక్ష కర్మను గుర్తించే వ్యాకరణ సూచకం; తెలుగులో దీనికి ప్రత్యేక పదం అవసరం లేదు.
- source_word: כָּל חָכְמַת שְׁלֹמֹה
  choice: సొలొమోను జ్ఞానమంతటినీ
  rationale: כָּל పదం సొలొమోను జ్ఞానపు సంపూర్ణతను సూచిస్తుంది; ‘జ్ఞానమంతటినీ’ ఆ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְהַבַּיִת
  choice: గృహాన్నీ
  rationale: בַּיִת యొక్క ప్రాథమిక అర్థం ‘ఇల్లు/గృహం.’ రాజసందర్భంలో ఇది రాజభవనాన్ని సూచించే అవకాశం ఉన్నా, మూలపదానికి పారదర్శకంగా ఉండేందుకు ‘గృహం’ వాడి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: אֲשֶׁר בָּנָה
  choice: అతడు కట్టించిన
  rationale: సొలొమోను రాజుగా నిర్మాణం చేయించిన భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ఇది గృహాన్ని విశేషించే సంబంధ ఉపవాక్యం.
