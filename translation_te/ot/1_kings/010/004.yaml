  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. తరువాతి వచనంలో వాక్యం కొనసాగుతుందని తెలియజేయడానికి చివర కామా ఉంచబడింది.
