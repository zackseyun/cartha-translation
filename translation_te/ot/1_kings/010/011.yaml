id: 1KI.10.11
reference: 1 Kings 10:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/גַם֙ אֳנִ֣י חִירָ֔ם אֲשֶׁר נָשָׂ֥א זָהָ֖ב מֵ/אוֹפִ֑יר הֵבִ֨יא מֵ/אֹפִ֜יר עֲצֵ֧י אַלְמֻגִּ֛ים הַרְבֵּ֥ה מְאֹ֖ד וְ/אֶ֥בֶן יְקָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/011.yaml
  text: Also[a], Hiram’s fleet, which carried gold from Ophir[b], brought from Ophir a very great quantity of almug wood and precious stones.
translation:
  language: te
  text: అంతేకాక, ఓఫీరు నుండి బంగారం మోసుకొచ్చిన హీరాము నౌకాసమూహం[a], ఓఫీరు నుండి అత్యధిక పరిమాణంలో అల్ముగ్ కలప[b], విలువైన రాళ్లను తీసుకొచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హెబ్రీలో “ఓడ” అనే పదం ఏకవచనంలో ఉంది; అది హీరాముకు చెందిన ఓడను లేదా అతని సముద్ర రవాణా వ్యవస్థను సమష్టిగా సూచించి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “అల్ముగ్ కలప”ను “అల్గుమ్ కలప” అని కూడా అనువదించవచ్చు; అది ఏ చెట్టు జాతికి చెందినదో ఖచ్చితంగా తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: అంతేకాక
  rationale: ముందటి వృత్తాంతానికి అదనపు సమాచారాన్ని జోడించే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֳנִי חִירָם
  choice: హీరాము ఓడల సమూహం
  rationale: אֳנִי వ్యాకరణపరంగా ఏకవచనమైనా, సందర్భంలో హీరాముకు చెందిన సముద్ర రవాణా వ్యవస్థను సమష్టిగా సూచించవచ్చు; ఈ అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
- source_word: אֲשֶׁר נָשָׂא זָהָב
  choice: బంగారం మోసుకొచ్చిన
  rationale: נשׂא యొక్క ‘మోయు/తీసుకురావు’ భావాన్ని సముద్ర సరుకు సందర్భానికి తగిన సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵאוֹפִיר
  choice: ఓఫీరు నుండి
  rationale: స్థలనామాన్నీ దానికి ముందు ఉన్న ‘నుండి’ అనే సంబంధాన్నీ నేరుగా నిలుపుతుంది.
- source_word: הֵבִיא
  choice: తీసుకొచ్చింది
  rationale: בוא హిఫీల్ రూపంలోని ‘తీసుకురావడం’ అనే సాధారణ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: עֲצֵי אַלְמֻגִּים
  choice: అల్ముగ్ కలప
  rationale: చెట్టు జాతి ఖచ్చితంగా తెలియనందున ప్రత్యేక వృక్షశాస్త్రీయ గుర్తింపును రుద్దకుండా హెబ్రీ పదానికి దగ్గరైన రూపాన్ని వాడింది.
- source_word: הַרְבֵּה מְאֹד
  choice: అత్యధిక పరిమాణంలో
  rationale: ‘చాలా విస్తారంగా’ అనే గాఢతను తెలుగులో సహజంగా, బలంగా వ్యక్తం చేస్తుంది.
- source_word: וְאֶבֶן יְקָרָה
  choice: విలువైన రాళ్లను
  rationale: హెబ్రీ ఏకవచనం సమష్టి భావంలో ఉండవచ్చు; సరుకు జాబితా సందర్భంలో తెలుగు బహువచనం సహజంగా ఉంటుంది.
