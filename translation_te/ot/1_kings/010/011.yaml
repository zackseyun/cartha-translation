  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే చారిత్రక వృత్తాంతానికి తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. మూలంలోని సమష్టి ఏకవచనం, కలప జాతి అనిశ్చితి పాదటిప్పణుల్లో సంరక్షించబడ్డాయి.
