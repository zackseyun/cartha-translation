source:
  edition: WLC
  text: וְ/כָ֨ל הָ/אָ֔רֶץ מְבַקְשִׁ֖ים אֶת פְּנֵ֣י שְׁלֹמֹ֑ה לִ/שְׁמֹ֨עַ֙ אֶת חָכְמָת֔/וֹ אֲשֶׁר נָתַ֥ן אֱלֹהִ֖ים בְּ/לִבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/024.yaml
  text: And all the earth sought the presence of Solomon[a], to hear his wisdom that God had put in his heart.
translation:
  language: te
  text: భూమి అంతటివారు దేవుడు సొలొమోను హృదయంలో ఉంచిన జ్ఞానాన్ని వినడానికి అతని సన్నిధిని కోరారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “సొలొమోను ముఖాన్ని కోరారు”; అంటే అతని సమక్షాన్ని లేదా అతనితో భేటీ అయ్యే అవకాశాన్ని కోరారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  choice: భూమి అంతటివారు
  rationale: అక్షరార్థంగా ‘భూమి అంతా’; రాజసంబంధమైన ఈ సందర్భంలో తెలిసిన ప్రపంచంలోని ప్రజలను సూచించే విస్తృత సమష్టి ప్రయోగం. తెలుగులో వ్యక్తులను స్పష్టంగా తెలియజేయడానికి ‘వారు’ చేర్చబడింది.
- source_word: מְבַקְשִׁים
  choice: కోరారు
  rationale: హీబ్రూ కృదంతం కొనసాగుతున్న లేదా అలవాటైన చర్యను సూచిస్తుంది; కథన సారాంశంలో తెలుగు సాధారణ భూతకాలం సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: אֶת־פְּנֵי שְׁלֹמֹה
  choice: సొలొమోను సన్నిధిని
  rationale: అక్షరార్థంగా ‘సొలొమోను ముఖాన్ని’; ఇది అతని సమక్షాన్ని లేదా దర్శనావకాశాన్ని కోరడాన్ని సూచించే జాతీయం. ‘సన్నిధి’ మూల రూపకాన్ని కొంత నిలుపుతూ సహజంగా ఉంటుంది.
- source_word: לִשְׁמֹעַ
  choice: వినడానికి
  rationale: ఉద్దేశాన్ని తెలిపే క్రియారూపాన్ని నేరుగా, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: חָכְמָתוֹ
  choice: అతని జ్ఞానాన్ని
  rationale: హీబ్రూలోని ఏకవచన స్వామ్య ప్రత్యయాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: אֲשֶׁר נָתַן אֱלֹהִים בְּלִבּוֹ
  choice: దేవుడు సొలొమోను హృదయంలో ఉంచిన
  rationale: נָתַן ప్రాథమికంగా ‘ఇచ్చాడు’; ‘హృదయంలో’ అనే అనుబంధంతో తెలుగులో ‘ఉంచిన’ సహజంగా ఉండి, జ్ఞానం దేవుని ప్రసాదమనే భావాన్ని నిలుపుతుంది. అస్పష్టత నివారించేందుకు ‘అతని’ బదులు ‘సొలొమోను’ పునరుక్తమైంది.
theological_decisions:
- issue: אֱלֹהִים పదానికి అనువాదం
  choice: దేవుడు
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో దేవుని నిబంధన నామమైన יהוה కాక אֱלֹהִים ఉంది; అందువల్ల పదభేదాన్ని కాపాడుతూ ‘దేవుడు’ అని అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణంతో పాటు ‘హృదయం,’ ‘సన్నిధి’ వంటి మూలపాఠ రూపకాలు నిలుపబడ్డాయి.
