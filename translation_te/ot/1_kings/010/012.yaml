source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ הַ֠/מֶּלֶךְ אֶת עֲצֵ֨י הָ/אַלְמֻגִּ֜ים מִסְעָ֤ד לְ/בֵית יְהוָה֙ וּ/לְ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/כִנֹּר֥וֹת וּ/נְבָלִ֖ים לַ/שָּׁרִ֑ים לֹ֣א בָֽא כֵ֞ן עֲצֵ֤י אַלְמֻגִּים֙ וְ/לֹ֣א נִרְאָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/012.yaml
  text: The king made the almug wood into supports for the house of Yahweh and for the king’s house[a], and lyres and harps for the singers. Never before had such almug wood come[b], nor has any been seen to this day.
translation:
  language: te
  text: రాజు ఆ అల్ముగ్ కలపతో యాహ్వే మందిరానికీ రాజభవనానికీ ఆధారాలను[a], గాయకుల కోసం వీణలను, స్వరమండలాలను చేయించాడు. అంతటి అల్ముగ్ కలప ఇంతకు ముందు ఎన్నడూ రాలేదు; నేటివరకు అలాంటిది కనిపించలేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆధారాలు’ అని అనువదించిన హెబ్రీ పదం అరుదైనది. అది మెట్లు, కటకటాలు లేదా ఇతర నిర్మాణ భాగాలను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘అల్ముగ్’ ఏ వృక్షజాతిని సూచిస్తుందో ఖచ్చితంగా తెలియదు. సమాంతర వృత్తాంతంలో దాని పేరు ‘అల్గుమ్’ అనే భిన్న రూపంలో కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצֵי הָאַלְמֻגִּים
  choice: అల్ముగ్ కలప
  rationale: ఖచ్చితమైన వృక్షజాతి తెలియనందున ఊహాత్మక ఆధునిక సమానార్థాన్ని ఇవ్వకుండా హెబ్రీ పేరును లిప్యంతరీకరించి, సమూహార్థాన్ని సహజమైన తెలుగు ‘కలప’తో వ్యక్తం చేశాం.
- source_word: מִסְעָד
  choice: ఆధార నిర్మాణాలు
  rationale: ఈ అరుదైన నామవాచకానికి మెట్లు, కటకటాలు లేదా ఇతర నిర్మాణ ఆధారాలు అనే అర్థాలు సాధ్యం. ఏ ఒక్క నిర్దిష్ట రూపానికీ పరిమితం కాకుండా సాధారణ నిర్మాణార్థాన్ని ఎంచుకున్నాం.
- source_word: לְבֵית יְהוָה
  choice: యెహోవా మందిరానికి
  rationale: హెబ్రీలో అక్షరార్థంగా ‘యెహోవా గృహం’; సందర్భంలో అది దేవాలయాన్ని సూచిస్తున్నందున ఆధునిక తెలుగులో స్పష్టమైన ‘మందిరం’ వాడాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: וּלְבֵית הַמֶּלֶךְ
  choice: రాజభవనానికి
  rationale: అక్షరార్థం ‘రాజు గృహం’; ఈ సందర్భంలో సహజమైన తెలుగు పదం ‘రాజభవనం’.
- source_word: וְכִנֹּרוֹת
  choice: వీణలు
  rationale: כִּנּוֹר ఒక తంతివాద్యం; ఖచ్చిత ఆధునిక వాద్యంతో సమీకరించడం కష్టమైనందున సుపరిచితమైన సాధారణ తెలుగు వాద్యపదాన్ని వాడాం.
- source_word: וּנְבָלִים
  choice: స్వరమండలాలు
  rationale: נֵבֶל‌ను כִּנּוֹר‌కు భిన్నమైన తంతివాద్యంగా చూపేందుకు తెలుగులో వేరొక సంప్రదాయ వాద్యపదాన్ని ఎంచుకున్నాం; ఖచ్చిత గుర్తింపు అనిశ్చితం.
- source_word: לַשָּׁרִים
  choice: గాయకుల కోసం
  rationale: שׁיר ధాతువుకు చెందిన రూపం కావడంతో విస్తృతమైన ‘సంగీతకారులు’ కంటే ‘గాయకులు’ మూలానికి దగ్గరగా ఉంది.
- source_word: לֹא בָא כֵן
  choice: అంతటి ... ఇంతకు ముందు ఎన్నడూ రాలేదు
  rationale: ఆ కలప దిగుమతి లేదా రాక అపూర్వమని తెలిపే హెబ్రీ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేసింది.
- source_word: וְלֹא נִרְאָה עַד הַיּוֹם הַזֶּה
  choice: ఈ రోజు వరకూ అలాంటిది కనిపించలేదు
  rationale: కథకుని కాలం వరకు కొనసాగుతున్న స్థితిని తెలుగులో స్పష్టంగా, మూలంలోని అనిర్దిష్ట సూచనను నిలుపుతూ తెలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. అరుదైన కలపపేరు లిప్యంతరీకరించబడింది; అనిశ్చిత నిర్మాణపదాన్ని ప్రధాన పాఠంలో విస్తృతార్థంతో ఇచ్చి పాదటిప్పణిలో ప్రత్యామ్నాయాలను చూపించాం.
