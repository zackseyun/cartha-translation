source:
  edition: WLC
  text: וְ֠/כֹל כְּלֵ֞י מַשְׁקֵ֨ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ זָהָ֔ב וְ/כֹ֗ל כְּלֵ֛י בֵּֽית יַ֥עַר הַ/לְּבָנ֖וֹן זָהָ֣ב סָג֑וּר אֵ֣ין כֶּ֗סֶף לֹ֥א נֶחְשָׁ֛ב בִּ/ימֵ֥י שְׁלֹמֹ֖ה לִ/מְאֽוּמָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/021.yaml
  text: All King Solomon’s drinking vessels were gold[a], and all the vessels of the House of the Forest of Lebanon were pure gold[b]. Silver was not considered anything in the days of Solomon.
translation:
  language: te
  text: సొలొమోను రాజు పానపాత్రలన్నీ బంగారంతో చేసినవి. లెబానోను అరణ్య భవనంలోని పాత్రలన్నీ మేలిమి బంగారంతో చేసినవి.[a] సొలొమోను కాలంలో వెండిని ఏ విలువైనదిగానూ పరిగణించలేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శుద్ధి చేసిన బంగారం.”
    reason: זָהָב סָגוּר అనే పదబంధం బంగారం యొక్క శుద్ధత లేదా ఉన్నత నాణ్యతను సూచిస్తుంది; ‘శుద్ధి చేసిన బంగారం’ సాధ్యమైన ప్రత్యామ్నాయ అనువాదం.
  - marker: b
    text: లేదా, “సొలొమోను కాలంలో వెండి దేనికీ విలువైనదిగా పరిగణించబడలేదు.”
    reason: לֹא נֶחְשָׁב לִמְאוּמָה అనే నుడికారం వెండిని ఏ విలువగానూ లేదా ప్రాముఖ్యంగానూ ఎంచలేదనే భావాన్ని వ్యక్తం చేస్తుంది.
lexical_decisions:
- source_word: כְּלֵי מַשְׁקֵה
  choice: పానపాత్రలు
  rationale: כְּלֵי అనే విస్తృత పదానికి మַשְׁקֵה పానానికి సంబంధించినవని నిర్దేశిస్తుంది. ‘పానపాత్రలు’ అనేది కేవలం గిన్నెలు లేదా కప్పులు అని పరిధిని అనవసరంగా కుదించకుండా సహజంగా అర్థాన్ని తెలియజేస్తుంది.
- source_word: זָהָב
  choice: బంగారం
  rationale: మూలంలోని సాధారణ లోహపదాన్ని నేరుగా అనువదించి, వచనంలో దాని పునరుక్తిని నిలిపింది.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: లెబానోను అరణ్య భవనం
  rationale: ఇది ఒక నిర్దిష్ట రాజభవనానికి పేరువలె వాడిన పదబంధం. ‘అరణ్య భవనం’ మూలంలోని ‘అరణ్యపు ఇల్లు/భవనం’ అనే నిర్మాణాన్ని కాపాడుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: זָהָב סָגוּר
  choice: మేలిమి బంగారం
  rationale: סָגוּר ఇక్కడ అత్యున్నత నాణ్యతగల, శుద్ధి చేసిన బంగారాన్ని సూచిస్తుంది. ‘మేలిమి బంగారం’ సహజమైన తెలుగు ప్రయోగం; ‘ఘన బంగారం’ అని అనువదిస్తే నాణ్యతకన్నా నిర్మాణ స్వభావాన్ని అతిగా నిర్దేశించే అవకాశం ఉంది.
- source_word: לֹא נֶחְשָׁב ... לִמְאוּמָה
  choice: అసలు లెక్కలోకే తీసుకోలేదు
  rationale: ఈ సందర్భంలో חשׁב విలువ కట్టడం లేదా ప్రాధాన్యంగా పరిగణించడం అనే భావాన్ని ఇస్తుంది. తెలుగు నుడికారమైన ఈ అనువాదం వెండి లేకపోయిందని కాక, దానికి విలువ ఇవ్వలేదని స్పష్టం చేస్తుంది.
- source_word: בִּימֵי שְׁלֹמֹה
  choice: సొలొమోను కాలంలో
  rationale: కాలసూచక హెబ్రీయ పదబంధాన్ని ఆధునిక తెలుగులో సహజంగా, కథనశైలికి తగినట్లు అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. నిర్దిష్ట భవననామ స్వభావాన్ని ‘లెబానోను అరణ్య భవనం’లో నిలిపాం. రెండు పాదాల్లోని ‘చేసినవే’ పునరుక్తి రాజసంపదపై మూలంలోని ఉద్ఘాటనను ప్రతిబింబిస్తుంది. సంప్రదింపుల ఆంగ్లపాఠంలోని పాదసూచికల స్థానాలు వాటి విషయంతో సరిపోలకపోవడంతో, మూలభాష ఆధారంగా [a]ను זָהָב סָגוּר తరువాత, [b]ను వెండి గురించిన వాక్యం తరువాత ఉంచాం.
