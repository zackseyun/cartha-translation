  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. జాబితాను స్పష్టంగా చూపేందుకు విరామచిహ్నాలు వాడాం; మూలంలోని వార్షిక పునరావృత భావాన్ని ‘ఏటేటా’తో నిలిపాం.
