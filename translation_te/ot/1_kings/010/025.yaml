  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הֵ֣מָּה מְבִאִ֣ים אִ֣ישׁ מִנְחָת֡/וֹ כְּלֵ֣י כֶסֶף֩ וּ/כְלֵ֨י זָהָ֤ב וּ/שְׂלָמוֹת֙ וְ/נֵ֣שֶׁק וּ/בְשָׂמִ֔ים סוּסִ֖ים וּ/פְרָדִ֑ים דְּבַר שָׁנָ֖ה בְּ/שָׁנָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/025.yaml
  text: 'And they were bringing[a], each man his tribute: articles of silver, articles of gold, garments, weapons, spices, horses, and mules[c][b], year by year.'
translation:
  language: te
  text: వారిలో ప్రతి ఒక్కరూ తమ కప్పాన్ని[a]—వెండి వస్తువులు, బంగారు వస్తువులు, వస్త్రాలు[b], ఆయుధాలు[c], సుగంధ ద్రవ్యాలు, గుర్రాలు, కంచర గాడిదలు—ఏటేటా తీసుకొచ్చేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తమ కానుకను’ లేదా ‘తమ బహుమానాన్ని.’ మిన్హా (מִנְחָה) అనే హీబ్రూ పదానికి కానుక, అర్పణ, లేదా కప్పం అనే అర్థాలు ఉండవచ్చు; ఇక్కడ రాజసందర్భాన్ని బట్టి ‘కప్పం’ అని అనువదించాం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పైవస్త్రాలు’ లేదా ‘అంగీలు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘కవచ సామగ్రి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבִאִים
  choice: తీసుకొచ్చేవారు
  rationale: హీబ్రూ కృదంత రూపం సందర్భంలో పునరావృతమయ్యే అలవాటు చర్యను సూచిస్తుంది; తెలుగు అలవాటార్థక భూతకాల రూపం దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אִישׁ מִנְחָתוֹ
  choice: ప్రతి ఒక్కరూ తమ కప్పాన్ని
  rationale: אִישׁ ఇక్కడ పంపిణీయ అర్థంలో ‘ప్రతి ఒక్కరూ’; రాజసందర్భంలో מִנְחָה రాజుకు సమర్పించే కానుక లేదా కప్పాన్ని సూచిస్తుంది. రాజకీయ భావాన్ని నిలుపడానికి ‘కప్పం’ ఎంచుకున్నాం.
- source_word: כְּלֵי כֶסֶף
  choice: వెండి వస్తువులు
  rationale: כְּלִי పాత్ర, వస్తువు, పరికరం వంటి విస్తృత అర్థం కలది; నిర్దిష్ట రకం చెప్పనందున ‘వస్తువులు’ ఆ విస్తృతిని నిలుపుతుంది.
- source_word: וּכְלֵי זָהָב
  choice: బంగారు వస్తువులు
  rationale: వెండి వస్తువులతో ఉన్న సమాంతర నిర్మాణాన్ని, పదార్థంతో చేసిన వస్తువుల విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: שְׂלָמוֹת
  choice: వస్త్రాలు
  rationale: ఈ పదం పైవస్త్రాలు లేదా అంగీలను సూచించవచ్చు; ప్రధాన పాఠ్యంలో సహజమైన విస్తృత పదాన్ని ఉపయోగించి, నిర్దిష్ట ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: נֵשֶׁק
  choice: ఆయుధాలు
  rationale: సైనిక సామగ్రిని సూచించే పదం; ఆధునిక తెలుగులో స్పష్టమైన సాధారణ ఎంపిక. ‘కవచ సామగ్రి’ కూడా సాధ్యమే.
- source_word: בְשָׂמִים
  choice: సుగంధ ద్రవ్యాలు
  rationale: వ్యాపారం లేదా కప్పం సందర్భంలో తెచ్చే పరిమళభరిత పదార్థాలను సహజంగా, తగిన విస్తృతితో తెలియజేస్తుంది.
- source_word: סוּסִים
  choice: గుర్రాలు
  rationale: మూలపదానికి ప్రామాణిక తెలుగు అర్థం.
- source_word: פְרָדִים
  choice: కంచర గాడిదలు
  rationale: గుర్రం-గాడిద సంకరజాతి జంతువులను సూచించే ప్రామాణిక, అర్థమయ్యే తెలుగు పదబంధం.
- source_word: דְּבַר שָׁנָה בְּשָׁנָה
  choice: ఏటేటా
  rationale: ప్రతి సంవత్సరం క్రమంగా పునరావృతమయ్యే చర్యను తెలిపే హీబ్రూ నుడికారానికి సహజమైన తెలుగు రూపం.
