  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘మాటలు’ అనే పదాన్ని ప్రధాన పాఠంలో ఉంచి, దాని విస్తృత అర్థసాధ్యతను పాదటిప్పణిలో సంరక్షించాం.
