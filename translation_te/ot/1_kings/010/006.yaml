source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל הַ/מֶּ֔לֶךְ אֱמֶת֙ הָיָ֣ה הַ/דָּבָ֔ר אֲשֶׁ֥ר שָׁמַ֖עְתִּי בְּ/אַרְצִ֑/י עַל דְּבָרֶ֖י/ךָ וְ/עַל חָכְמָתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/006.yaml
  text: Then she said to the king[a], “The report that I heard in my own land about your words and your wisdom was true.”
translation:
  language: te
  text: 'అప్పుడు ఆమె రాజుతో ఇలా చెప్పింది: “మీ మాటల గురించి, మీ జ్ఞానం గురించి నా దేశంలో నేను విన్న వార్త నిజమే.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మీ మాటలు” అనే హీబ్రూ పదబంధాన్ని “మీ విషయాలు” లేదా “మీ కార్యాలు” అని కూడా అర్థం చేసుకోవచ్చు. అది మీకు సంబంధించిన సంగతులను విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అప్పుడు ఆమె ... చెప్పింది
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ దాని క్రమబద్ధ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֶל־הַמֶּלֶךְ
  choice: రాజుతో
  rationale: హీబ్రూ దిశాసూచక నిర్మాణాన్ని తెలుగులో సహజంగా ‘రాజుతో ... చెప్పింది’ అని వ్యక్తపరుస్తుంది.
- source_word: אֱמֶת הָיָה הַדָּבָר
  choice: విన్న వార్త నిజమే
  rationale: דָּבָר ఇక్కడ ఆమె విన్న సమాచారాన్ని సూచిస్తుంది; ‘వార్త’ సందర్భానికి సరిపోతుంది. אֱמֶת విధేయార్థంలో ఉండగా ‘నిజమే’ సహజంగా, నొక్కిచెప్పే భావంతో ఉంటుంది.
- source_word: אֲשֶׁר שָׁמַעְתִּי בְּאַרְצִי
  choice: నా దేశంలో నేను విన్న
  rationale: సంబంధవాచక నిర్మాణాన్ని, మొదటి పురుష ఏకవచన స్వామ్యార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: עַל־דְּבָרֶיךָ
  choice: నీ మాటల గురించి
  rationale: דְּבָרֶיךָ యొక్క ప్రాథమిక అర్థమైన ‘నీ మాటలు’ను నిలుపుతుంది; సందర్భంలో ఇది రాజుకు సంబంధించిన విషయాలు లేదా కార్యాలను విస్తృతంగా సూచించే అవకాశాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וְעַל־חָכְמָתֶךָ
  choice: నీ జ్ఞానం గురించి
  rationale: మూలంలోని సమన్వయ నిర్మాణాన్ని పునరావృత ‘గురించి’తో స్పష్టంగా నిలుపుతుంది.
