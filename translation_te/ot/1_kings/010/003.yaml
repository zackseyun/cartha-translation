id: 1KI.10.3
reference: 1 Kings 10:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּגֶּד לָ֥/הּ שְׁלֹמֹ֖ה אֶת כָּל דְּבָרֶ֑י/הָ לֹֽא הָיָ֤ה דָּבָר֙ נֶעְלָ֣ם מִן הַ/מֶּ֔לֶךְ אֲשֶׁ֧ר לֹ֦א הִגִּ֖יד לָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/003.yaml
  text: And Solomon answered all her questions[a]; there was nothing hidden from the king that he did not tell her.
translation:
  language: te
  text: సొలొమోను ఆమె ప్రశ్నలన్నిటికీ[a] జవాబిచ్చాడు. రాజుకు దాగి ఉన్న విషయం ఏదీ లేదు; అతడు ఆమెకు చెప్పనిది ఏదీ లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “సొలొమోను ఆమె విషయాలన్నిటినీ ఆమెకు తెలియజేశాడు.” హీబ్రూ పదాలను “ఆమె మాటలు/విషయాలు” అని కూడా అనువదించవచ్చు; అయితే సందర్భంలో అవి రాణి అడిగిన ప్రశ్నలను సూచిస్తున్నాయి.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: జవాబిచ్చాడు
  rationale: נגד సాధారణంగా ‘తెలియజేయు/చెప్పు’ అని అర్థమిచ్చినా, రాణి కఠినమైన ప్రశ్నలతో సొలొమోనును పరీక్షిస్తున్న సందర్భంలో ఇది ఆమె విచారణలకు అతడు ఇచ్చిన సమాధానాలను సూచిస్తుంది.
- source_word: דְּבָרֶיהָ
  choice: ఆమె ప్రశ్నలన్నిటికీ
  rationale: דבר అనే పదానికి ‘మాట, విషయం’ వంటి విస్తృత అర్థాలున్నాయి. 1వ వచనంలోని కఠిన ప్రశ్నల సందర్భం ఇక్కడ ‘ప్రశ్నలు’ అనే భావాన్ని సమర్థిస్తుంది; విభక్తి నిర్మాణం సహజమైన తెలుగుకోసం ‘ప్రశ్నలన్నిటికీ’గా ఇచ్చబడింది.
- source_word: לֹא הָיָה דָּבָר נֶעְלָם
  choice: మరుగైన విషయం ఏదీ లేదు
  rationale: ఈ పదబంధం ఏ విషయమూ సొలొమోనుకు దాగి లేదా అతని అవగాహనకు అందకుండా ఉండలేదనే హీబ్రూ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: נֶעְלָם
  choice: మరుగైన
  rationale: עלם ధాతువు నిఫాల్ రూపం ‘దాచబడినది/మరుగైనది’ అనే భావాన్నిస్తుంది. ‘మరుగైన’ అనేది హీబ్రూ రూపకాన్ని నిలుపుతూ గౌరవప్రదమైన ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: מִן־הַמֶּלֶךְ
  choice: రాజుకు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘రాజునుండి దాగిన’ అనే నిర్మాణం ఉంది; తెలుగులో ‘రాజుకు మరుగైన’ అనడం అదే సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר לֹא הִגִּיד לָהּ
  choice: అతడు ఆమెకు వివరించలేనిదేదీ లేదు
  rationale: సాపేక్ష ఉపవాక్యం రాజుకు తెలియని లేదా రాణికి వెల్లడించలేని విషయం ఏదీ లేదని స్పష్టం చేస్తుంది. పూర్వార్థంలోని ‘జవాబిచ్చాడు’తో అనవసర పునరుక్తి రాకుండా, נגד యొక్క చెప్పి తెలియజేసే భావాన్ని ‘వివరించు’ ద్వారా వ్యక్తం చేసింది.
