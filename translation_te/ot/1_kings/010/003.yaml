translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, రాజదర్బారు కథనానికి తగిన గౌరవప్రదమైన శైలి పాటించబడింది. మొదటి వాక్యంలో సందర్భానుగుణ అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, హీబ్రూ పదబంధంలోని విస్తృతతను పాదటిప్పణిలో సంరక్షించాం.
