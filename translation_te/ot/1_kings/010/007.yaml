id: 1KI.10.7
reference: 1 Kings 10:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹֽא הֶאֱמַ֣נְתִּי לַ/דְּבָרִ֗ים עַ֤ד אֲשֶׁר בָּ֨אתִי֙ וַ/תִּרְאֶ֣ינָה עֵינַ֔/י וְ/הִנֵּ֥ה לֹֽא הֻגַּד לִ֖/י הַ/חֵ֑צִי הוֹסַ֤פְתָּ חָכְמָה֙ וָ/ט֔וֹב אֶל הַ/שְּׁמוּעָ֖ה אֲשֶׁ֥ר שָׁמָֽעְתִּי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/007.yaml
  text: But I did not believe the reports until I came and my own eyes saw it; and behold[a], not even half was told to me. You have surpassed the report that I heard in wisdom and prosperity.
translation:
  language: te
  text: కాని నేను వచ్చి నా కళ్లతో చూసేవరకు ఆ వార్తలను నమ్మలేదు. ఇదిగో, నాకు సగమైనా చెప్పబడలేదు! నేను విన్న వార్తకన్నా నీవు జ్ఞానంలోను శ్రేయస్సులోను మించిపోయావు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘జ్ఞానంలోను సంపదలోను.’ హీబ్రూ טוֹב అనే పదం సాధారణ శ్రేయస్సు లేదా వర్ధిల్లుదలను సూచించగలదు; ఈ సందర్భంలో సొలొమోను వైభవంలో భాగమైన సంపద కూడా దానిలో ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: నమ్మలేదు
  rationale: ఇక్కడ אמן హిఫీల్ రూపం విన్న విషయాలను నిజమైనవిగా అంగీకరించడాన్ని సూచిస్తుంది; ‘నమ్మలేదు’ సహజంగా, సూటిగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: לַדְּבָרִים
  choice: ఆ వార్తలను
  rationale: పదశః ‘మాటలు/విషయాలు’ అయినా, సందర్భంలో సొలొమోను గురించి ఆమె విన్న సమాచారాన్ని సూచిస్తుంది; అందువల్ల ‘వార్తలు’ సముచితం.
- source_word: וַתִּרְאֶינָה עֵינַי
  choice: నా కళ్లతో చూసేవరకు
  rationale: ‘నా కళ్లు చూశాయి’ అనే హీబ్రూ ప్రయోగంలోని ప్రత్యక్ష అనుభవానికి ఇచ్చిన ప్రాధాన్యాన్ని సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: ఆశ్చర్యాన్నీ, తరువాత చెప్పబోయే విషయంపై దృష్టినీ సూచించే హీబ్రూ సంభాషణా చిహ్నానికి దగ్గరైన తెలుగు రూపం.
- source_word: לֹא הֻגַּד לִי הַחֵצִי
  choice: నాకు చెప్పినది సగమైనా కాదు
  rationale: తాను విన్న సమాచారం వాస్తవ గొప్పతనంలో సగాన్ని కూడా తెలియజేయలేదనే అతిశయోక్తితో కూడిన భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הוֹסַפְתָּ
  choice: మించిపోయావు
  rationale: אֶל తో కూడిన ఈ తులనాత్మక నిర్మాణంలో יסף కేవలం ‘చేర్చడం’ కాక, విన్న వార్తకు మించి ఉండడాన్ని సూచిస్తుంది.
- source_word: חָכְמָה וָטוֹב
  choice: జ్ఞానంలోను శ్రేయస్సులోను
  rationale: חָכְמָה ‘జ్ఞానం’; טוֹב ఇక్కడ రాజసంబంధమైన వర్ధిల్లుదల, మేలు, సమృద్ధిని విస్తృతంగా సూచించగలదు. ‘శ్రేయస్సు’ దానిని కేవలం ధనానికి పరిమితం చేయదు.
- source_word: אֶל הַשְּׁמוּעָה אֲשֶׁר שָׁמָעְתִּי
  choice: నేను విన్న వార్తకన్నా
  rationale: שְׁמוּעָה విన్న నివేదిక లేదా వార్తను సూచిస్తుంది; తులనాత్మక సంబంధాన్ని తెలుగులో ‘కన్నా’ స్పష్టంగా తెలియజేస్తుంది.
