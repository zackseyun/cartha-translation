translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ఇదిగో’ ద్వారా మూలంలోని ఆశ్చర్య ధ్వని నిలుపబడింది; ‘శ్రేయస్సు’ ద్వారా טוֹב పదంలోని విస్తృత భావం కాపాడబడింది.
