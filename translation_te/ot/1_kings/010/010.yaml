source:
  edition: WLC
  text: וַ/תִּתֵּ֨ן לַ/מֶּ֜לֶךְ מֵאָ֥ה וְ/עֶשְׂרִ֣ים כִּכַּ֣ר זָהָ֗ב וּ/בְשָׂמִ֛ים הַרְבֵּ֥ה מְאֹ֖ד וְ/אֶ֣בֶן יְקָרָ֑ה לֹא בָא֩ כַ/בֹּ֨שֶׂם הַ/ה֥וּא עוֹד֙ לָ/רֹ֔ב אֲשֶׁר נָתְנָ֥ה מַֽלְכַּת שְׁבָ֖א לַ/מֶּ֥לֶךְ שְׁלֹמֹֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/010.yaml
  text: And she gave the king one hundred and twenty talents of gold[a], and a very great quantity of spices, and precious stones. Never again did such an abundance of spices come as those that the queen of Sheba gave to King Solomon.
translation:
  language: te
  text: ఆమె రాజుకు నూట ఇరవై తలాంతుల బంగారాన్ని, అత్యధిక పరిమాణంలో సుగంధ ద్రవ్యాలను, విలువైన రాళ్లను ఇచ్చింది. షేబా రాణి సొలొమోను రాజుకు ఇచ్చినంత సమృద్ధిగా సుగంధ ద్రవ్యాలు[a] మళ్లీ ఎన్నడూ రాలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పోలిక వాక్యంలో ‘సుగంధ ద్రవ్యం’ అనే హీబ్రూ పదం ఏకవచనంలో ఉంది (‘ఆ సుగంధ ద్రవ్యంలాంటిది’); అయితే అది ఇక్కడ సమూహార్థకంగా వాడబడినట్లు కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: ఆమె ... ఇచ్చింది
  rationale: వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపిస్తుంది; తెలుగులో సహజమైన కథన క్రమానికి సాధారణ భూతకాల రూపం సరిపోతుంది.
- source_word: מֵאָה וְעֶשְׂרִים כִּכַּר זָהָב
  choice: నూట ఇరవై తలాంతుల బంగారాన్ని
  rationale: כִּכָּר ప్రాచీన బరువు ప్రమాణం; నిర్ధారణలేని ఆధునిక బరువు మార్పిడికి బదులు సంప్రదాయ ప్రమాణపదమైన ‘తలాంతు’ను నిలిపాం.
- source_word: וּבְשָׂמִים הַרְבֵּה מְאֹד
  choice: ఎంతో విస్తారమైన సుగంధ ద్రవ్యాలను
  rationale: בְשָׂמִים సువాసనగల ద్రవ్యాలను సూచిస్తుంది; הַרְבֵּה מְאֹד వాటి అత్యధిక పరిమాణాన్ని బలంగా తెలియజేస్తుంది.
- source_word: וְאֶבֶן יְקָרָה
  choice: విలువైన రాళ్లను
  rationale: మూలంలో ఏకవచనం ఉన్నా, కానుకల జాబితాలో అది సమూహార్థకంగా వాడబడినట్లు కనిపిస్తుంది; అందువల్ల తెలుగులో సహజమైన బహువచనం వాడాం.
- source_word: לֹא בָא ... עוֹד
  choice: మళ్లీ ఎన్నడూ రాలేదు
  rationale: בוא ఇక్కడ వస్తువులు రావడం లేదా తీసుకురాబడడాన్ని సూచిస్తుంది; ప్రతికూల రూపంతో עוֹד కలసి ‘మళ్లీ ఎన్నడూ’ అనే భావాన్ని ఇస్తుంది.
- source_word: כַבֹּשֶׂם הַהוּא ... לָרֹב
  choice: అంత విస్తారంగా అలాంటి సుగంధ ద్రవ్యాలు
  rationale: ఏకవచన בֹּשֶׂם ఇక్కడ సమూహార్థకంగా ఉండవచ్చు; לָרֹב పరిమాణ విస్తారాన్ని తెలియజేస్తుంది. ఈ రెండింటినీ సహజమైన తెలుగు పోలికగా వ్యక్తపరిచాం.
- source_word: מַלְכַּת שְׁבָא
  choice: షేబా రాణి
  rationale: స్థలనామాన్ని మూల హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించి, బిరుదును సహజ తెలుగు క్రమంలో ఉంచాం.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: సొలొమోను రాజుకు
  rationale: బిరుదు-పేరు కలయికను తెలుగులో సహజమైన పేరు-బిరుదు క్రమంలో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. ప్రాచీన కొలమానమైన ‘తలాంతు’ నిలుపబడింది; హీబ్రూ ఏకవచనాల సమూహార్థ వినియోగం అవసరమైన చోట సహజ తెలుగు బహువచనంగా వ్యక్తమైంది.
