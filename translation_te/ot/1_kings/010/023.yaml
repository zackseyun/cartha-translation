translation:
  language: te
  text: ఆ విధంగా సొలొమోను రాజు సంపదలో, జ్ఞానంలో భూమిమీద ఉన్న రాజులందరినీ మించిపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదానుసారంగా: “సొలొమోను రాజు సంపదలో, జ్ఞానంలో భూమిమీద ఉన్న రాజులందరికంటే గొప్పవాడయ్యాడు.”'
    reason: וַיִּגְדַּל క్రియలోని ‘గొప్పవాడయ్యాడు’ అనే మరింత రూపసామ్యమైన ప్రత్యామ్నాయాన్ని చూపించేందుకు.
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: మించిపోయాడు
  rationale: גדל అనే క్రియ מִן‌తో కూడిన తులనాత్మక నిర్మాణంలో ఇతరులకంటే గొప్పవాడవడం లేదా గొప్పగా ఉండడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘మించిపోయాడు’ ఆ తులనను సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: సొలొమోను రాజు
  rationale: హీబ్రూ పదబంధంలోని రాజబిరుదు, వ్యక్తిపేరు రెండింటినీ నిలుపుతూ తెలుగులో సహజమైన నామక్రమాన్ని అనుసరిస్తుంది.
- source_word: מִכֹּל מַלְכֵי הָאָרֶץ
  choice: భూమిమీద ఉన్న రాజులందరినీ
  rationale: אֶרֶץ‌కు ‘దేశం’ లేదా ‘భూమి’ అనే అర్థాలు ఉండవచ్చు. అంతర్జాతీయ రాజులతో చేసే ఈ విస్తృత పోలికలో ‘భూమి’ అనేది సందర్భానికి తగినది; ‘భూమిమీద ఉన్న’ అనే రూపం తెలుగులో సహజంగా ఉంటుంది.
- source_word: לְעֹשֶׁר
  choice: సంపదలో
  rationale: עֹשֶׁר భౌతిక సంపదను సూచిస్తుంది. తులనాత్మక వాక్యనిర్మాణంలో ‘సంపదలో’ స్పష్టమైన ఆధునిక తెలుగు.
- source_word: וּלְחָכְמָה
  choice: జ్ఞానంలో
  rationale: חָכְמָה ఇక్కడ జ్ఞానాన్ని సూచిస్తుంది. సమాంతరతను స్పష్టంగా ఉంచేందుకు తెలుగులో ‘లో’ విభక్తిని రెండవ నామవాచకంతోనూ ఉపయోగించాం.
- source_word: וַ
  choice: ఆ విధంగా
  rationale: వావ్ కథనాన్ని ముందుకు నడిపించడమే కాక, ముందున్న వివరణకు సారాంశం లేదా ఫలిత భావాన్ని ఇక్కడ కలిగిస్తుంది. ‘ఆ విధంగా’ ఆ సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
