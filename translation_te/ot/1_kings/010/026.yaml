  text: וַ/יֶּאֱסֹ֣ף שְׁלֹמֹה֮ רֶ֣כֶב וּ/פָרָשִׁים֒ וַ/יְהִי ל֗/וֹ אֶ֤לֶף וְ/אַרְבַּע מֵאוֹת֙ רֶ֔כֶב וּ/שְׁנֵים עָשָׂ֥ר אֶ֖לֶף פָּֽרָשִׁ֑ים וַ/יַּנְחֵ/ם֙ בְּ/עָרֵ֣י הָ/רֶ֔כֶב וְ/עִם הַ/מֶּ֖לֶךְ בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/026.yaml
  text: Solomon gathered chariots and horsemen[a], and he had 1,400 chariots and 12,000 horsemen, and he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: te
  text: సొలొమోను రథాలను, గుర్రపు రౌతులను[a] సమకూర్చుకున్నాడు. అతనికి 1,400 రథాలు, 12,000 మంది గుర్రపు రౌతులు ఉండేవారు. వాటన్నిటినీ రథాల పట్టణాల్లోను, యెరూషలేములో రాజు వద్దను ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అశ్విక దళాన్ని’; హెబ్రీ పదం మరింత అక్షరార్థంగా గుర్రాలపై స్వారీ చేసేవారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: సమకూర్చుకున్నాడు
  rationale: אסף ఇక్కడ సైనిక వనరులను కూడబెట్టడం లేదా సమకూర్చుకోవడం అనే భావాన్ని ఇస్తుంది. తెలుగు వాడుకలో ‘సమకూర్చుకున్నాడు’ సహజంగా ఉండి, సొలొమోను తన అధీనంలో వాటిని కూడబెట్టిన భావాన్ని తెలియజేస్తుంది.
- source_word: רֶכֶב
  choice: రథాలు
  rationale: ఏకవచన రూపం సమూహార్థకంగా వాడబడినా, తరువాత సంఖ్యతో లెక్కించబడినందున తెలుగులో బహువచనమైన ‘రథాలు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: פָרָשִׁים
  choice: గుర్రపు రౌతులు
  rationale: ఈ నామవాచకం సాధారణంగా గుర్రాలపై స్వారీ చేసే వారిని సూచిస్తుంది; గుర్రాలను మాత్రమే కాదు. ‘గుర్రపు రౌతులు’ వ్యక్తులను స్పష్టంగా సూచిస్తూ మూలపద భావాన్ని నిలుపుతుంది.
- source_word: וַיְהִי לוֹ
  choice: అతనికి … ఉండేవారు/ఉండేవి
  rationale: ఈ హెబ్రీయ ఇడియమ్ స్వామ్యాన్ని సూచిస్తుంది. తెలుగులో ‘అతనికి … ఉండేవి/ఉండేవారు’ సహజమైన సమానార్థక నిర్మాణం.
- source_word: אֶלֶף וְאַרְבַּע מֵאוֹת רֶכֶב
  choice: 1,400 రథాలు
  rationale: సంఖ్యను ఆధునిక పాఠకులకు సులభంగా కనిపించే అంకెలలో నేరుగా అందించింది.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף פָּרָשִׁים
  choice: 12,000 మంది గుర్రపు రౌతులు
  rationale: సంఖ్యను నేరుగా అనువదించి, వ్యక్తులను లెక్కించేందుకు తెలుగులో సహజమైన ‘మంది’ని చేర్చింది.
- source_word: וַיַּנְחֵם
  choice: వారిని … ఉంచాడు
  rationale: Hiphil రూపం ఉంచడం లేదా ఒకచోట నిలిపి ఉంచడం అనే భావాన్ని ఇస్తుంది. సైనిక సందర్భంలో ‘ఉంచాడు’ సహజంగా ఉండి, మూలంలో లేనంత ప్రత్యేకమైన మోహరింపు భావాన్ని జోడించదు.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: రథాల పట్టణాల్లో
  rationale: రథ దళాలతో సంబంధమున్న నియమిత పట్టణాలను సూచించే సంక్షిప్తమైన, మూలనిర్మాణానికి సమీపమైన అనువాదం.
- source_word: וְעִם הַמֶּלֶךְ בִּירוּשָׁלָם
  choice: యెరూషలేములో రాజు దగ్గరను
  rationale: కొంతమందిని యెరూషలేములో రాజుతో ఉంచిన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘రాజు’ అనే మూడవ పురుష సూచనను మూలంలాగే నిలుపుతుంది.
