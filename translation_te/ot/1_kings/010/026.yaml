  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘గుర్రపు రౌతులు’ అనే పదబంధం మూలంలోని mounted riders భావాన్ని కాపాడుతుంది; ప్రత్యామ్నాయ సమూహార్థక పదాన్ని పాదసూచికలో ఇచ్చాం.
