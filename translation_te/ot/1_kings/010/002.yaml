translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘హృదయంలో ఉన్నదంతా’ అనే బైబిలీయ నుడికారాన్ని నిలిపి, అసలు భాషలోని భావ విస్తృతిని పాదటిప్పణిలో సంరక్షించాం.
