id: 1KI.10.2
reference: 1 Kings 10:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תָּבֹ֣א יְרוּשָׁלְַ֗מָ/ה בְּ/חַיִל֮ כָּבֵ֣ד מְאֹד֒ גְּ֠מַלִּים נֹשְׂאִ֨ים בְּשָׂמִ֧ים וְ/זָהָ֛ב רַב מְאֹ֖ד וְ/אֶ֣בֶן יְקָרָ֑ה וַ/תָּבֹא֙ אֶל שְׁלֹמֹ֔ה וַ/תְּדַבֵּ֣ר אֵלָ֔י/ו אֵ֛ת כָּל אֲשֶׁ֥ר הָיָ֖ה עִם לְבָבָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/002.yaml
  text: She came to Jerusalem with a very great retinue[a], with camels carrying spices and very much gold and precious stones. She came to Solomon and spoke with him about all that was in her heart.
translation:
  language: te
  text: ఆమె భారీ పరివారంతో[a] యెరూషలేముకు వచ్చింది. సుగంధ ద్రవ్యాలు, ఎంతో బంగారం, విలువైన రాళ్లు మోస్తున్న ఒంటెలు ఆమెతో ఉన్నాయి. ఆమె సొలొమోను వద్దకు వచ్చి, తన హృదయంలో ఉన్నదంతా అతనితో చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చాలా పెద్ద అనుచర బృందంతో’; అక్షరార్థంగా, ‘అత్యంత గొప్ప సంపదతో/బలంతో.’ హీబ్రూ పదం సంపదను, బలాన్ని, లేదా పెద్ద సమూహాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַיִל כָּבֵד מְאֹד
  choice: చాలా పెద్ద పరివారంతో
  rationale: חַיִל అనే పదానికి సంపద, బలం, సైన్యం, పెద్ద సమూహం అనే భావాలు ఉన్నాయి. రాజసంబంధమైన ఈ ప్రయాణ సందర్భంలో ఆమె వెంట వచ్చిన గొప్ప పరివారాన్ని సూచించడం సహజం; పదంలోని విస్తృత భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: גְּמַלִּים נֹשְׂאִים בְּשָׂמִים
  choice: సుగంధ ద్రవ్యాలు ... మోసుకొస్తున్న ఒంటెలు
  rationale: నిరంతర వర్ణనాత్మక కృదంత భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְזָהָב רַב מְאֹד
  choice: విస్తారమైన బంగారం
  rationale: רַב מְאֹד సూచించే అత్యధిక పరిమాణాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וְאֶבֶן יְקָרָה
  choice: విలువైన రాళ్లు
  rationale: హీబ్రూ ఏకవచనం ఇక్కడ సమూహార్థకంగా వాడబడింది; తెలుగులో బహువచనం సహజం.
- source_word: וַתָּבֹא אֶל שְׁלֹמֹה
  choice: ఆమె సొలొమోను దగ్గరికి వచ్చింది
  rationale: మొదట యెరూషలేముకు చేరడం, తరువాత సొలొమోనును సమీపించడం అనే కథన దశలను సూచించే పునరుక్త క్రియను నిలుపుతుంది.
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: అతనితో మాట్లాడింది
  rationale: אֶל సాధారణంగా ‘తో/కు’ అని అనువదించవచ్చు; ఈ సందర్భంలో ‘అతనితో మాట్లాడింది’ సహజంగా ఉండి పరస్పర సంభాషణను అతిగా నిర్దేశించదు.
- source_word: אֵת כָּל אֲשֶׁר הָיָה עִם לְבָבָהּ
  choice: తన హృదయంలో ఉన్నదంతా
  rationale: ఆమె అంతరంగంలోని ఆలోచనలు, ప్రశ్నలు, ఆందోళనలన్నిటిని సూచించే హీబ్రూ నుడికారాన్ని గౌరవప్రదంగా, సూటిగా నిలుపుతుంది.
