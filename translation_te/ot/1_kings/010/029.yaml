translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాణిజ్య పదజాలం వాడబడింది. ‘దిగుమతి,’ ‘ఎగుమతి’ పదాలు సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తాయి; అక్షరార్థ చలన భావం పాదసూచికలో నిలుపబడింది. ‘వారి’ అనే సర్వనామానికి మూలపాఠ్యంలో ఉన్న సూచనాత్మక అస్పష్టతను పరిష్కరించకుండా ఉంచాం.
