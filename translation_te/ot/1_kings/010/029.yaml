id: 1KI.10.29
reference: 1 Kings 10:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ֠/תַּעֲלֶה וַ/תֵּצֵ֨א מֶרְכָּבָ֤ה מִ/מִּצְרַ֨יִם֙ בְּ/שֵׁ֣שׁ מֵא֣וֹת כֶּ֔סֶף וְ/ס֖וּס בַּ/חֲמִשִּׁ֣ים וּ/מֵאָ֑ה וְ֠/כֵן לְ/כָל מַלְכֵ֧י הַ/חִתִּ֛ים וּ/לְ/מַלְכֵ֥י אֲרָ֖ם בְּ/יָדָ֥/ם יֹצִֽאוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/029.yaml
  text: And a chariot was imported from Egypt for six hundred shekels of silver[a], and a horse for a hundred and fifty[c][b]; and so they exported them to all the kings of the Hittites and to the kings of Aram by their hand.
translation:
  language: te
  text: ఈజిప్టు నుండి ఒక రథాన్ని ఆరు వందల వెండి షెకెలులకు[a], ఒక గుర్రాన్ని నూట యాభై వెండి షెకెలులకు దిగుమతి చేసేవారు[b]. అలాగే హిత్తీయుల రాజులందరికీ, అరాము రాజులకూ వాటిని వారి ద్వారా[c] ఎగుమతి చేసేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘ఆరు వందల వెండికి’ అని ఉంది; ‘షెకెలులు’ అనే బరువు/ధర ప్రమాణం సందర్భం నుంచి గ్రహించబడింది.
    reason: implicit_unit
  - marker: b
    text: లేదా, ‘ఈజిప్టు నుండి పైకి తీసుకురాబడి ... బయటికి పంపేవారు.’ హీబ్రూలో వాణిజ్య సందర్భంలో దిగుమతి, ఎగుమతిని సూచించే చలన క్రియలు వాడబడ్డాయి.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా ‘వారి చేతి ద్వారా’; అంటే వారి ద్వారా లేదా వారి ప్రతినిధుల ద్వారా.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲלֶה וַתֵּצֵא
  choice: దిగుమతి అయ్యేవి
  rationale: ఈ క్రియల అక్షరార్థాలు ‘పైకి వచ్చేది’, ‘బయటికి వచ్చేది.’ అయితే ఈజిప్టు నుంచి రథాలు, గుర్రాలు తీసుకువచ్చే వాణిజ్య సందర్భంలో అవి దిగుమతిని సూచిస్తాయి. తెలుగు వాక్యంలో వస్తువులనే కర్తలుగా ఉంచేందుకు కర్మణి రూపం వాడబడింది.
- source_word: מֶרְכָּבָה
  choice: ఒక రథం
  rationale: ఏకవచన రూపం ఒక్కో రథానికి నిర్ణయించిన ధరను సూచిస్తుంది.
- source_word: בְּשֵׁשׁ מֵאוֹת כֶּסֶף
  choice: ఆరు వందల వెండి షెకెలులకు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఆరు వందల వెండికి’ ఉంది; ధరకు సంబంధించిన ప్రమాణాన్ని స్పష్టం చేయడానికి సందర్భానుసారంగా ‘షెకెలులు’ చేర్చబడింది.
- source_word: וְסוּס
  choice: ఒక గుర్రం
  rationale: మూలపదం సాధారణంగా ‘గుర్రం’ అని మాత్రమే చెబుతుంది; యుద్ధ గుర్రం అని మరింత నిర్దిష్టం చేయలేదు.
- source_word: בַּחֲמִשִּׁים וּמֵאָה
  choice: నూట యాభై వెండి షెకెలులకు
  rationale: ఇది ఒక్కో గుర్రం ధర. సహజమైన తెలుగు సంఖ్యాక్రమం వాడబడింది; ముందటి ధరలోని ‘వెండి’ అనే భావం ఇక్కడ స్పష్టత కోసం పునరుక్తం చేయబడింది.
- source_word: וְכֵן
  choice: అలాగే
  rationale: ధరల వివరాల నుంచి అదే వస్తువుల తదుపరి వాణిజ్య పంపిణీకి కొనసాగింపును సూచిస్తుంది.
- source_word: לְכָל מַלְכֵי הַחִתִּים
  choice: హిత్తీయుల రాజులందరికీ
  rationale: లామెద్ ఇక్కడ వాణిజ్య వస్తువులను పొందినవారిని సూచిస్తుంది; జాతి-రాజకీయ నామం యథాతథంగా నిలుపబడింది.
- source_word: וּלְמַלְכֵי אֲרָם
  choice: అరాము రాజులకూ
  rationale: ‘అరాము’ హీబ్రూ స్థలనామాన్ని నిలుపుతుంది; సంప్రదాయబద్ధమైన కానీ వ్యాఖ్యానాత్మకమైన ‘సిరియా’ను వాడలేదు.
- source_word: בְּיָדָם
  choice: వారి ద్వారానే
  rationale: అక్షరార్థంగా ‘వారి చేతి ద్వారా’ అనే ఈ నుడికారం మధ్యవర్తిత్వం లేదా ప్రతినిధిత్వాన్ని సూచిస్తుంది. ‘వారి’ అనే సర్వనామంలోని మూలపాఠ్య అస్పష్టత నిలుపబడింది.
- source_word: יֹצִאוּ
  choice: ఎగుమతి చేసేవారు
  rationale: హిఫీల్ రూపానికి ‘బయటికి వెళ్లేలా చేశారు’ అనే కారణార్థం ఉంది; ఈ వాణిజ్య సందర్భంలో ‘ఎగుమతి చేసేవారు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
