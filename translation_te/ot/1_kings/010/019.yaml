source:
  edition: WLC
  text: שֵׁ֧שׁ מַעֲל֣וֹת לַ/כִּסֵּ֗ה וְ/רֹאשׁ עָגֹ֤ל לַ/כִּסֵּה֙ מֵ/אַֽחֲרָ֔י/ו וְ/יָדֹ֛ת מִ/זֶּ֥ה וּ/מִ/זֶּ֖ה אֶל מְק֣וֹם הַ/שָּׁ֑בֶת וּ/שְׁנַ֣יִם אֲרָי֔וֹת עֹמְדִ֖ים אֵ֥צֶל הַ/יָּדֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/019.yaml
  text: The throne had six steps[a], and the throne had a rounded top at its back, and armrests on this side and on that beside the seat[b], and two lions standing beside the armrests.
translation:
  language: te
  text: ఆ సింహాసనానికి ఆరు మెట్లు ఉండేవి. సింహాసనం వెనుక భాగంలో గుండ్రని పైభాగం[a] ఉండేది. ఆసనానికి[b] ఇరువైపులా చేతివాలులు ఉండేవి; ఆ చేతివాలుల పక్కన రెండు సింహాలు నిలబడి ఉండేవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘గుండ్రని తల.’ ఇది సింహాసనం వెనుక ఉన్న గుండ్రని పైభాగాన్ని లేదా తల ఆనించే భాగాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘కూర్చునే స్థలం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלוֹת
  choice: మెట్లు
  rationale: సింహాసన నిర్మాణ సందర్భంలో పైకి ఎక్కడానికి ఏర్పాటు చేసిన మెట్లను సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజమైన, స్పష్టమైన పదం.
- source_word: לַכִּסֵּה
  choice: ఆ సింహాసనానికి
  rationale: ఇక్కడ ל ఉపసర్గ సింహాసన నిర్మాణానికి చెందిన మెట్లను సూచిస్తుంది. తెలుగులో ‘ఆ సింహాసనానికి ఆరు మెట్లు’ అనడం సహజం.
- source_word: רֹאשׁ עָגֹל
  choice: గుండ్రని పైభాగం
  rationale: అక్షరార్థంగా ‘గుండ్రని తల/పైభాగం.’ ఇది తల ఆనించే భాగమేనని మూలపాఠం నిర్దిష్టంగా చెప్పనందున ‘గుండ్రని పైభాగం’ అని అనువదించి అస్పష్టతను నిలిపాం.
- source_word: מֵאַחֲרָיו
  choice: వెనుక భాగంలో
  rationale: గుండ్రని పైభాగం సింహాసనం వెనుకవైపు ఉన్నదని తెలిపే స్థానార్థక పదబంధం.
- source_word: יָדֹת
  choice: చేతివాలులు
  rationale: అక్షరార్థంగా ‘చేతులు’ అయినా, ఆసన సామగ్రి సందర్భంలో చేతులు ఆనించుకునే పక్క భాగాలను సూచిస్తుంది. ‘చేతివాలులు’ సాధారణ తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: מִזֶּה וּמִזֶּה
  choice: ఇరువైపులా
  rationale: ఒకవైపు, మరొకవైపు అనే ద్విపార్శ్వ అమరికను సహజమైన సంక్షిప్త తెలుగులో తెలియజేస్తుంది.
- source_word: אֶל מְקוֹם הַשָּׁבֶת
  choice: ఆసనానికి
  rationale: అక్షరార్థంగా ‘కూర్చునే స్థలం దగ్గర/వైపు.’ సందర్భంలో చేతివాలులు కూర్చునే భాగానికి ఇరువైపులా ఉన్నాయని సహజంగా తెలియజేయడానికి ‘ఆసనానికి’ ఎంచుకున్నాం.
- source_word: אֲרָיוֹת
  choice: సింహాలు
  rationale: సింహాసనం వద్ద ఉన్న సింహ ఆకృతులను సూచించే సాధారణ బహువచన నామవాచకం.
- source_word: עֹמְדִים
  choice: నిలబడి ఉండేవి
  rationale: నిలిచిన స్థితిలో ఉన్న సింహ ఆకృతుల దృశ్యాన్ని పాల్గొనే క్రియారూపానికి అనుగుణంగా తెలియజేస్తుంది.
- source_word: אֵצֶל הַיָּדוֹת
  choice: చేతివాలుల పక్కన
  rationale: రెండు సింహాలు సింహాసనపు చేతివాలులకు ఆనుకొని లేదా సమీపంలో ఉన్నాయని స్పష్టంగా తెలియజేస్తుంది.
