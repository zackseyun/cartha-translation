id: 1KI.10.9
reference: 1 Kings 10:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּר֔וּךְ אֲשֶׁר֙ חָפֵ֣ץ בְּ/ךָ֔ לְ/תִתְּ/ךָ֖ עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל בְּ/אַהֲבַ֨ת יְהוָ֤ה אֶת יִשְׂרָאֵל֙ לְ/עֹלָ֔ם וַ/יְשִֽׂימְ/ךָ֣ לְ/מֶ֔לֶךְ לַ/עֲשׂ֥וֹת מִשְׁפָּ֖ט וּ/צְדָקָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/009.yaml
  text: Blessed be Yahweh your God[a], who delighted in you to set you on the throne of Israel. Because Yahweh loved Israel forever, he has made you king to administer justice and righteousness.
translation:
  language: te
  text: నిన్ను ఇశ్రాయేలు సింహాసనంపై కూర్చోబెట్టడానికి నీపై సంతోషించిన నీ దేవుడైన యాహ్వే స్తుతింపబడుగాక! ఇశ్రాయేలు పట్ల యాహ్వేకు ఉన్న శాశ్వతమైన ప్రేమనుబట్టి[a], న్యాయాన్నీ నీతినీ జరిగించడానికి ఆయన నిన్ను రాజుగా నియమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే ఇశ్రాయేలును ఎప్పటికీ ప్రేమిస్తున్నందున.” హీబ్రూ వాక్యంలో ‘ప్రేమ’ నామవాచకంగా ఉంది; ఈ పదబంధాన్ని కారణార్థంలో అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי ... בָּרוּךְ
  choice: స్తుతింపబడుగాక
  rationale: జస్సివ్ ఆశీర్వాద సూత్రంలోని ఆకాంక్షార్థాన్ని సహజమైన, గౌరవప్రదమైన తెలుగు భాషలో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: రెండవ పురుష ఏకవచన సంబంధ ప్రత్యయాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר חָפֵץ בְּךָ
  choice: నిన్ను ఇష్టపడిన
  rationale: חפץ ב యొక్క అనుగ్రహపూర్వక ఇష్టం లేదా సంతోషాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְתִתְּךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: నిన్ను ఇశ్రాయేలు సింహాసనం మీద కూర్చోబెట్టడానికి
  rationale: రాజ్యాధికారానికి నియమించడాన్ని సింహాసన ప్రతిమతోనే నిలుపుతుంది.
- source_word: בְּאַהֲבַת יְהוָה אֶת יִשְׂרָאֵל לְעֹלָם
  choice: ఇశ్రాయేలు పట్ల యెహోవాకు ఉన్న శాశ్వతమైన ప్రేమనుబట్టి
  rationale: అమూర్త నామవాచకమైన אַהֲבָהను నామవాచకంగానే ఉంచి, בְּ యొక్క సందర్భోచిత కారణార్థాన్ని తెలుపుతుంది; לְעֹלָםను ‘శాశ్వతమైన’గా ప్రతిబింబిస్తుంది.
- source_word: וַיְשִׂימְךָ לְמֶלֶךְ
  choice: ఆయన నిన్ను రాజుగా నియమించాడు
  rationale: שׂים + ל యొక్క రాజ నియామక భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: לַעֲשׂוֹת מִשְׁפָּט וּצְדָקָה
  choice: న్యాయాన్నీ నీతినీ జరిగించడానికి
  rationale: రాజు నిర్వహించవలసిన న్యాయపాలనను సూచిస్తూ, משפט మరియు צדקה మధ్యనున్న భావభేదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవ నామాన్ని బిరుదుగా మార్చకుండా ఉంచుతూ, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన రూపాన్ని ఎంచుకుంది.
- issue: בְּאַהֲבַת יְהוָה యొక్క వ్యాకరణ భావం
  choice: యెహోవాకు ఉన్న శాశ్వతమైన ప్రేమనుబట్టి
  alternative: యెహోవా ఇశ్రాయేలును శాశ్వతంగా ప్రేమించాడు గనుక
  rationale: ప్రేమను సూచించే హీబ్రూ నామవాచక నిర్మాణాన్ని నిలుపుతూ, בְּ యొక్క కారణార్థాన్ని వ్యక్తం చేస్తుంది; క్రియారూపంలో కాలాన్ని అనవసరంగా నిర్ధారించదు.
- issue: מִשְׁפָּט וּצְדָקָה జంట పదాలు
  choice: న్యాయాన్నీ నీతినీ
  alternative: న్యాయాన్నీ ధర్మాన్నీ
  rationale: రాజపాలనలో న్యాయ తీర్పు మరియు నైతిక సదాచారం అనే పరస్పర సంబంధిత కాని వేర్వేరు భావాలను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘స్తుతింపబడుగాక’ ఆశీర్వాద సూత్రపు ఉన్నత స్వరాన్ని నిలుపుతుంది; మిగిలిన వాక్యం సహజమైన ఆధునిక వాక్యనిర్మాణాన్ని అనుసరిస్తుంది.
