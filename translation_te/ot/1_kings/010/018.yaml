  text: Then the king made a great ivory throne and overlaid it with refined gold[a].
translation:
  language: te
  text: తరువాత రాజు ఏనుగుదంతపు గొప్ప సింహాసనాన్ని చేయించి, దానికి మేలిమి బంగారం[a] పొదిగించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘శుద్ధమైన బంగారం,’ లేదా ‘నాణ్యమైన బంగారం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: తరువాత ... చేయించి
  rationale: Wayyiqtol కథన క్రమాన్ని ముందుకు తీసుకెళ్తుంది; రాజు స్వయంగా తయారు చేశాడనే భావం రాకుండా, రాజాజ్ఞతో చేయించాడనే సహజ తెలుగు ప్రయోగం ఎంచుకున్నాం.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: సందర్భంలో సొలొమోనును సూచించే నిర్దిష్ట నామవాచకం; తెలుగులో సహజంగా ‘రాజు’ సరిపోతుంది.
- source_word: כִּסֵּא
  choice: సింహాసనం
  rationale: రాజసందర్భంలో సాధారణ ఆసనం కంటే ‘సింహాసనం’ ఖచ్చితమైన సమానార్థకం.
- source_word: שֵׁן
  choice: దంతంతో
  rationale: పదానికి మూలార్థం ‘పంటి/దంతం’; వస్తు పదార్థంగా ఇక్కడ ఏనుగు దంతాన్ని, అంటే ivoryని సూచిస్తుంది.
- source_word: גָּדוֹל
  choice: గొప్ప
  rationale: పరిమాణంతో పాటు వైభవాన్నీ సూచించే అవకాశం నిలుపుతుంది.
- source_word: וַיְצַפֵּהוּ
  choice: దానికి ... పొదిగించాడు
  rationale: צפה ఇక్కడ ఒక పదార్థంతో కప్పడం లేదా పూత వేయడం అనే శిల్పకార్యాన్ని సూచిస్తుంది; ‘పొదిగించాడు’ రాజు చేయించిన కార్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: זָהָב
  choice: బంగారం
  rationale: సందర్భంలో నేరుగా సూచించిన పదార్థం.
- source_word: מוּפָז
  choice: మేలిమి
  rationale: అత్యుత్తమ నాణ్యతగల, శుద్ధి చేసిన బంగారం అనే భావాన్ని సహజ ఆధునిక తెలుగులో తెలియజేస్తుంది; పదంలోని ఖచ్చిత న్యూయాన్స్ అనిశ్చితిని పాదటిప్పణిలో ఉంచాం.
