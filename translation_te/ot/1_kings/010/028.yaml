source:
  edition: WLC
  text: וּ/מוֹצָ֧א הַ/סּוּסִ֛ים אֲשֶׁ֥ר לִ/שְׁלֹמֹ֖ה מִ/מִּצְרָ֑יִם וּ/מִ/קְוֵ֕ה סֹחֲרֵ֣י הַ/מֶּ֔לֶךְ יִקְח֥וּ מִ/קְוֵ֖ה בִּ/מְחִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/028.yaml
  text: And the importation of the horses that belonged to Solomon was from Egypt and Kue[b][a]; the king’s merchants would obtain them from Kue at a price.
translation:
  language: te
  text: సొలొమోనుకు చెందిన గుర్రాలు ఐగుప్తు నుంచీ కూవే నుంచీ దిగుమతి చేయబడేవి.[a] రాజు వ్యాపారులు వాటిని కూవే నుండి ధర చెల్లించి సమకూర్చేవారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ పదం מִקְוֶה/מִקְוֵה అర్థం అనిశ్చితం. అది బహుశా కిలికియాలోని ‘కూవే’ అనే స్థలనామం కావచ్చు; లేదా ‘మంద,’ ‘సమూహం’ వంటి అర్థమిచ్చే సాధారణ నామవాచకం కావచ్చు.
    reason: cultural_note
  - marker: b
    text: 'కష్టమైన హీబ్రూ పాఠాన్ని మరో విధంగా చదివితే: “మంద నుంచీ; రాజు వ్యాపారులు ఒక మందను ధర చెల్లించి తీసుకొనేవారు” అని అనువదించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא
  choice: దిగుమతి
  rationale: ఈ నామవాచకానికి ‘బయలుదేరడం,’ ‘మూలం’ అనే అర్థాలు ఉన్నా, సొలొమోను కోసం ఇతర ప్రాంతాల నుండి గుర్రాలు వచ్చే వాణిజ్య సందర్భంలో ‘దిగుమతి’ సహజంగా దిశను తెలియజేస్తుంది.
- source_word: הַסּוּסִים אֲשֶׁר לִשְׁלֹמֹה
  choice: సొలొమోనుకు చెందిన గుర్రాలు
  rationale: లామెద్ అక్షరార్థంగా ‘సొలొమోను కోసం’ అని ఉండవచ్చు; ఇక్కడ అతని ఆధీనంలోని లేదా అతని కోసం సమకూర్చిన గుర్రాలను సూచిస్తున్నందున ఈ రూపం సహజంగా ఉంది.
- source_word: מִמִּצְרָיִם
  choice: ఐగుప్తు నుండి
  rationale: ప్రామాణిక తెలుగు బైబిలు భౌగోళిక నామరూపాన్ని నిలిపింది.
- source_word: וּמִקְוֵה / מִקְוֵה
  choice: కూవే నుండి
  rationale: కష్టమైన מִקְוֵה పదాన్ని, ఐగుప్తుతోపాటు మరో మూలప్రాంతాన్ని సూచించే కిలికియాలోని స్థలనామంగా ప్రధాన పాఠ్యంలో తీసుకున్నాం; సాధారణ నామవాచక పఠనాన్ని పాదసూచికలో ఉంచాం.
- source_word: סֹחֲרֵי הַמֶּלֶךְ
  choice: రాజు వర్తకులు
  rationale: రాజసేవలో వాణిజ్యం నిర్వహించే వారిని ఆధునిక, గౌరవప్రదమైన తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: יִקְחוּ
  choice: తెచ్చేవారు
  rationale: לקח అక్షరార్థంగా ‘తీసుకొనేవారు’; దిగుమతి సందర్భంలో ‘తెచ్చేవారు’ సహజంగా ఉంది. ధర చెల్లింపు వాక్యభాగమే కొనుగోలు భావాన్ని స్పష్టం చేస్తుంది.
- source_word: בִּמְחִיר
  choice: వెల చెల్లించి
  rationale: వాణిజ్య లావాదేవీని సహజమైన తెలుగులో తెలియజేస్తూ, నిర్దిష్ట స్థిరధర ఉందని అదనంగా సూచించదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. భౌగోళిక పఠనాన్ని ప్రధాన పాఠ్యంలో ఉంచి, హీబ్రూ పదంలోని నిజమైన అనిశ్చితిని రెండు పాదసూచికల్లో స్పష్టంగా కాపాడాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
