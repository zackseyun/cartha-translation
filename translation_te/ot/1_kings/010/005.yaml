revisions:
- from: ఆయన బల్లమీది ఆహారాన్ని, ఆయన సేవకులు కూర్చునే క్రమాన్ని, ఆయన పరిచారకులు నిలబడి సేవచేసే తీరును, వారి వస్త్రాలను, ఆయనకు పానపాత్రలు అందించేవారిని, యాహ్వే మందిరంలో ఆయన అర్పించే దహనబలిని[a] చూసినప్పుడు, ఆమెకు ఊపిరే లేకపోయింది.
  to: ఆయన బల్లమీది ఆహారాన్ని, ఆయన సేవకులు కూర్చునే క్రమాన్ని, ఆయన పరిచారకులు నిలబడి సేవచేసే తీరును, వారి వస్త్రాలను, ఆయనకు పానపాత్రలు అందించేవారిని, యాహ్వే మందిరంలో ఆయన అర్పించే దహనబలిని[a] చూసినప్పుడు, ఆమెలో ఇక ఊపిరి మిగలలేదు.
  rationale: ప్రధాన పఠనాన్ని లేదా జాబితా నిర్మాణాన్ని మార్చకుండా, చివరి హీబ్రూ నుడికారం తెలుగులో అనవసరమైన మరణార్థాన్ని కలిగించకుండా సవరించాం. వివాదాస్పదమైన עֹלָתוֹ పఠనానికి సంబంధించిన ప్రత్యామ్నాయాన్ని పాదసూచికలో మరింత నేరుగా వ్యక్తపరిచాం.
