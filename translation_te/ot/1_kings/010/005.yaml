id: 1KI.10.5
reference: 1 Kings 10:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מַאֲכַ֣ל שֻׁלְחָנ֡/וֹ וּ/מוֹשַׁ֣ב עֲבָדָי/ו֩ וּ/מַעֲמַ֨ד משרת/ו וּ/מַלְבֻּֽשֵׁי/הֶם֙ וּ/מַשְׁקָ֔י/ו וְ/עֹ֣לָת֔/וֹ אֲשֶׁ֥ר יַעֲלֶ֖ה בֵּ֣ית יְהוָ֑ה וְ/לֹא הָ֥יָה בָ֛/הּ ע֖וֹד רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/005.yaml
  text: the food of his table[a], the seating of his servants, the attendance of his ministers, their clothing, his cupbearers, and his burnt offering that he offered at the house of Yahweh, there was no more breath in her.
translation:
  language: te
  text: ఆయన బల్లమీది ఆహారాన్ని, ఆయన సేవకులు కూర్చునే క్రమాన్ని, ఆయన పరిచారకులు నిలబడి సేవచేసే తీరును, వారి వస్త్రాలను, ఆయనకు పానపాత్రలు అందించేవారిని, యాహ్వే మందిరంలో ఆయన అర్పించే దహనబలిని[a] చూసినప్పుడు, ఆమెలో ఇక ఊపిరి మిగలలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే మందిరానికి ఆయన ఎక్కి వెళ్లడం”; ఇది ఆయన ఎక్కి వెళ్లిన మెట్ల మార్గాన్ని లేదా ఊరేగింపును సూచించవచ్చు.
    reason: עֹלָתוֹ అనే వ్యంజన పాఠాన్ని ‘దహనబలి’గానే కాక ‘ఎక్కడం/పైకి వెళ్లడం’ అనే అర్థంలోనూ గ్రహించే అవకాశం ఉంది.
lexical_decisions:
- source_word: מַאֲכַל שֻׁלְחָנוֹ
  choice: ఆయన బల్లమీది ఆహారం
  rationale: మַאֲכַל అంటే తినే ఆహారం లేదా భోజన ఏర్పాటు. ఈ ఎంపిక హీబ్రూ పదచిత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מוֹשַׁב עֲבָדָיו
  choice: ఆయన సేవకులు కూర్చునే క్రమం
  rationale: מוֹשָׁבకు కూర్చోవడం, కూర్చునే స్థానం లేదా ఏర్పాటు అనే భావాలు ఉన్నాయి. రాజసభలో వారి క్రమబద్ధమైన స్థానవ్యవస్థను ఈ రూపం స్పష్టంగా తెలియజేస్తుంది.
- source_word: מַעֲמַד מְשָׁרְתָיו
  choice: ఆయన పరిచారకులు నిలబడి సేవచేసే తీరు
  rationale: מַעֲמָדలోని ‘నిలబడడం/నియమిత స్థానంలో ఉండడం’ అనే దృశ్యాన్ని, מְשָׁרְתָיוలోని అధికారిక సేవ భావాన్ని రెండింటినీ ఇది నిలుపుతుంది.
- source_word: מַלְבֻּשֵׁיהֶם
  choice: వారి వస్త్రాలు
  rationale: పదానికి నేరుగా వస్త్రాలు లేదా దుస్తులు అని అర్థం; ‘వస్త్రాలు’ గౌరవప్రదంగానూ సాధారణ పాఠకులకు స్పష్టంగానూ ఉంటుంది.
- source_word: מַשְׁקָיו
  choice: ఆయనకు పానపాత్రలు అందించేవారు
  rationale: రాజసభ సందర్భంలో ఇది పానీయాలు వడ్డించే అధికారులను, అంటే cupbearersను సూచిస్తుంది. తెలుగులో వారి విధిని తెలిపే రూపం సహజంగా ఉంటుంది.
- source_word: עֹלָתוֹ אֲשֶׁר יַעֲלֶה בֵּית יְהוָה
  choice: యాహ్వే మందిరంలో ఆయన అర్పించే దహనబలి
  rationale: మసొరెటిక్ స్వరచిహ్నాలు עֹלָהను ‘దహనబలి’గా సూచిస్తున్నాయి. ‘మందిరం’ ఇక్కడ దేవాలయాన్ని సహజ తెలుగులో తెలియజేస్తుంది; భిన్న పఠనాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְלֹא הָיָה בָּהּ עוֹד רוּחַ
  choice: ఆమెకు ఊపిరే లేకపోయింది
  rationale: רוּחַ యొక్క ‘ఊపిరి’ అనే స్పష్టమైన చిత్రాన్ని నిలుపుతూ, ఆమె విస్మయంతో ఉక్కిరిబిక్కిరైన భావాన్ని అతిగా వివరణ చేయకుండా సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: హీబ్రూ పాఠంలో ఉన్న వ్యక్తిగత నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’ ఉచ్చారణకు దగ్గరైన తెలుగు రూపాన్ని వాడాం.
- issue: עֹלָתוֹ అనే పదం యొక్క అర్థం
  choice: ఆయన అర్పించే దహనబలి
  alternative: యాహ్వే మందిరానికి ఆయన ఎక్కి వెళ్లే మార్గం లేదా ప్రస్థానం
  rationale: మసొరెటిక్ పాఠంలోని స్వరచిహ్నాలు ‘దహనబలి’ అనే ప్రధాన పఠనానికి మద్దతిస్తాయి. అయితే వ్యంజన పాఠం ‘ఎక్కడం/ఎక్కి వెళ్లడం’గా అర్థం చేసుకునే అవకాశమున్నందున ఆ నిజమైన సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని వాడాం. రాజసభ జాబితాలో సేవకులు, పరిచారకులు అనే పదాలను వేరు చేసి మూలంలోని పాత్రభేదాన్ని నిలిపాం. ముందరి వాక్యంలో ఉన్న ‘చూసింది’ అనే క్రియ ఈ జాబితాను వ్యాకరణపరంగా నియంత్రిస్తున్నందున తెలుగులో ‘చూసినప్పుడు’ అని స్పష్టపరిచాం.
