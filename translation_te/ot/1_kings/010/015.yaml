id: 1KI.10.15
reference: 1 Kings 10:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לְ/בַד֙ מֵ/אַנְשֵׁ֣י הַ/תָּרִ֔ים וּ/מִסְחַ֖ר הָ/רֹכְלִ֑ים וְ/כָל מַלְכֵ֥י הָ/עֶ֖רֶב וּ/פַח֥וֹת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/015.yaml
  text: besides what came from the traveling merchants and from the trade of the merchants[c][b][a], and from all the kings of Arabia and the governors of the land.
translation:
  language: te
  text: ఇవికాక, సంచరించే వ్యాపారుల నుండి[a], వర్తకుల వాణిజ్యం నుండి, అరేబియా రాజులందరి నుండి[b], దేశంలోని ప్రాంతీయ పాలకుల నుండి[c] వచ్చిన ఆదాయం కూడా ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రయాణించే మనుషుల నుండి వచ్చినది.’ ఈ హీబ్రూ పదబంధం క్లిష్టమైనది; సాధారణంగా సంచార వర్తకులను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మిశ్రిత ప్రజల రాజులందరి నుండి.’ హీబ్రూ పదానికి కొన్ని సందర్భాల్లో ఈ అర్థం ఉండవచ్చు; ఇక్కడ ‘అరేబియా’ అనేది ఎక్కువగా సరిపోతుంది.
    reason: alternative_reading
  - marker: c
    text: లేదా, ‘ప్రాంతీయ పాలకులు’ లేదా ‘సత్రపులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד
  choice: అంతేకాక … వేరుగా ఉంది
  rationale: ముందటి వచనంలో చెప్పిన వార్షిక బంగారు మొత్తానికి అదనంగా వచ్చిన ఆదాయ వనరులను ఈ పదం పరిచయం చేస్తుంది.
- source_word: מֵאַנְשֵׁי הַתָּרִים
  choice: సంచార వ్యాపారుల ద్వారా వచ్చినది
  rationale: ఈ హీబ్రూ పదబంధం క్లిష్టమైనది. వాణిజ్య సందర్భంలో తిరుగుతూ వ్యాపారం చేసేవారిని సూచించడం అత్యంత సంభావ్యం; ఆదాయ మూలాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘ద్వారా వచ్చినది’ అని అనువదించబడింది.
- source_word: וּמִסְחַר הָרֹכְלִים
  choice: వర్తకుల వ్యాపారం ద్వారా వచ్చినది
  rationale: מִסְחַר వాణిజ్యం లేదా వ్యాపార లావాదేవీలను, רֹכְלִים వ్యాపారులను సూచిస్తాయి. ‘వర్తకుల వ్యాపారం’ రాజ్య ఆర్థిక సందర్భానికి సరిపోతుంది.
- source_word: וְכָל מַלְכֵי הָעֶרֶב
  choice: అరేబియా రాజులందరి నుండి
  rationale: ఈ భౌగోళిక-రాజకీయ జాబితాలో עֶרֶב అరేబియా లేదా అరబ్బు ప్రజలను సూచించే అవకాశం ఎక్కువ. ఇతర సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וּפַחוֹת הָאָרֶץ
  choice: దేశపు పాలకుల నుండి
  rationale: פַּחוֹת పై అధికారానికి లోబడిన ప్రాంతీయ పాలకులు లేదా గవర్నర్లను సూచిస్తుంది. ‘పాలకులు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి, కాలపరంగా మరీ నిర్దిష్టమైన ‘సత్రపులు’ అనే పదాన్ని నివారిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. అసలు వాక్యం 14వ వచనంపై ఆధారపడిన జాబితా భాగం కావడంతో, తెలుగులో భావం పూర్తిగా వినిపించేందుకు ‘వచ్చినదీ … వేరుగా ఉంది’ అనే నిర్మాణం ఉపయోగించబడింది. క్లిష్టమైన הַתָּרִים మరియు ద్వంద్వార్థక עֶרֶב పదాల అనిశ్చితి పాదసూచికల్లో నిలుపబడింది.
