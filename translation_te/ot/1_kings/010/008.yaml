  text: Blessed are your men; blessed are these your servants, who stand before you continually and hear your wisdom.
translation:
  language: te
  text: నీ మనుషులు ధన్యులు! నిరంతరం నీ ఎదుట నిలిచి నీ జ్ఞానాన్ని వినే ఈ నీ సేవకులు ధన్యులు!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: ధన్యులు
  rationale: ఆశించదగిన శ్రేయస్సు, భాగ్యస్థితిని తెలిపే హెబ్రీ ఆశీర్వచన భావాన్ని గౌరవప్రదంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲנָשֶׁיךָ
  choice: నీ మనుషులు
  rationale: మూలంలోని పురుష బహువచనాన్ని సాధ్యమైనంత నేరుగా నిలుపుతూ, రాజుకు చెందిన పరివారం లేదా సభికులను సందర్భానుసారంగా సూచిస్తుంది.
- source_word: עֲבָדֶיךָ
  choice: నీ సేవకులు
  rationale: రాజసభ సందర్భంలో బానిసత్వాన్ని ప్రత్యేకంగా ముందుకు తేవకుండా, రాజుకు సేవచేసే పరిచారకులు లేదా అధికారులను సహజంగా సూచిస్తుంది.
- source_word: אֵלֶּה
  choice: ఈ
  rationale: సమీప సూచక సర్వనామమైన హెబ్రీ పదం యొక్క భావాన్ని నిలుపుతుంది.
- source_word: הָעֹמְדִים לְפָנֶיךָ
  choice: నీ ఎదుట నిలిచి
  rationale: రాజు సమక్షంలో నిలిచి సేవచేయడమనే మూలంలోని స్పష్టమైన దృశ్యాన్ని వ్యాఖ్యానించి విస్తరించకుండా కాపాడుతుంది.
- source_word: תָּמִיד
  choice: నిరంతరం
  rationale: వారి క్రమమైన, కొనసాగుతున్న రాజసభ హాజరును సూచిస్తుంది; కాలపరంగా అతిశయోక్తి చేయకుండా మూల భావాన్ని అందిస్తుంది.
- source_word: הַשֹּׁמְעִים
  choice: వినే
  rationale: ముందున్న కృదంత వర్ణనతో సహజంగా అనుసంధానమై, వారు జ్ఞానాన్ని వినేవారని నేరుగా తెలియజేస్తుంది.
- source_word: חָכְמָתֶךָ
  choice: నీ జ్ఞానాన్ని
  rationale: మూలంలోని సరళమైన ప్రత్యక్ష కర్మను అదనపు వివరణ లేకుండా నిలుపుతుంది.
