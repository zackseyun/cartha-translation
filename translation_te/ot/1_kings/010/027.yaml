translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని రెండు సమృద్ధి పోలికలను సమాంతరంగా ఉంచింది. భౌగోళిక నామాన్ని నిలిపి వివరణను పాదసూచికలో ఇచ్చింది; రెండు పాదసూచిక గుర్తులూ ప్రధాన పాఠ్యంలో ఉన్నాయి.
