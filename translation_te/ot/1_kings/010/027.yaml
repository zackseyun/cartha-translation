source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן הַ/מֶּ֧לֶךְ אֶת הַ/כֶּ֛סֶף בִּ/ירוּשָׁלִַ֖ם כָּ/אֲבָנִ֑ים וְ/אֵ֣ת הָ/אֲרָזִ֗ים נָתַ֛ן כַּ/שִּׁקְמִ֥ים אֲשֶׁר בַּ/שְּׁפֵלָ֖ה לָ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/027.yaml
  text: The king made silver as common in Jerusalem as stones[b][a], and he made cedars as plentiful as the sycamore trees that are in the Shephelah.
translation:
  language: te
  text: రాజు యెరూషలేములో వెండిని రాళ్లంత విరివిగా చేశాడు; షెఫేలాలో విస్తారంగా ఉన్న సికమోరు అంజూరపు చెట్లంత[a] దేవదారు చెట్లను విరివిగా చేశాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం సికమోరు అంజూరపు చెట్లను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘షెఫేలా’ అనేది యూదా కొండప్రాంతానికి, తీర మైదానానికి మధ్యనున్న పాదభూమి ప్రాంతం; దీనిని ‘లోతట్టు ప్రాంతం’ అని కూడా అనువదించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: విరివిగా చేశాడు / విస్తారంగా చేశాడు
  rationale: נתן అనే క్రియకు అక్షరార్థంగా ‘ఇచ్చాడు/ఉంచాడు’ అని అర్థమైనా, ఈ పోలికలలో రాజు వాటిని అత్యంత సమృద్ధిగా అందుబాటులోకి తెచ్చాడనే భావం ఉంది. తెలుగు సహజత్వం కోసం ‘చేశాడు’తో పరిమాణార్థక పదాలు వాడబడ్డాయి.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: మూలంలో ‘రాజు’ అనే నిర్దిష్ట నామవాచకమే ఉంది; సందర్భంలో సొలొమోను అయినా ఈ వచనంలో పేరు చేర్చలేదు.
- source_word: הַכֶּסֶף
  choice: వెండి
  rationale: ఇక్కడ వెండి ఒక పదార్థం లేదా సంపదగా సామాన్యార్థంలో ఉంది; తెలుగులో సహజమైన ఏకవచన పదార్థనామం వాడబడింది.
- source_word: בִּירוּשָׁלִַם
  choice: యెరూషలేములో
  rationale: స్థలార్థక ఉపసర్గను సహజమైన తెలుగు విభక్తితో అనువదించింది.
- source_word: כָּאֲבָנִים
  choice: రాళ్లంత
  rationale: כ పోలికను సూచిస్తుంది. ‘రాళ్లంత విరివిగా’ అనేది సమృద్ధి మరియు సాధారణ లభ్యత అనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הָאֲרָזִים
  choice: దేవదారు మానులు
  rationale: אֲרָזִים దేవదారు వృక్షాలు లేదా వాటి కలపను సూచించవచ్చు. రాజసంబంధ నిర్మాణ సామగ్రి సందర్భంలో ‘మానులు’ అనడం కలప భావాన్ని స్పష్టం చేస్తూనే వృక్షసంబంధ మూలార్థాన్ని నిలుపుతుంది.
- source_word: כַּשִּׁקְמִים
  choice: మేడిచెట్లంత
  rationale: שקמים లెవాంతు ప్రాంతపు sycamore fig trees‌ను సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు దగ్గరైన వృక్షనామంగా ‘మేడిచెట్లు’ వాడి, ఖచ్చితమైన వృక్ష గుర్తింపును పాదసూచికలో తెలిపింది.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: షెఫేలాలోని
  rationale: שפלה యూదా కొండప్రాంతానికి, తీర మైదానానికి మధ్యనున్న నిర్దిష్ట భౌగోళిక ప్రాంతం. సాధారణ ‘లోతట్టు ప్రాంతం’గా మార్చకుండా పేరును లిప్యంతరీకరించింది.
- source_word: לָרֹב
  choice: విస్తారంగా
  rationale: ఈ పదబంధం అత్యధిక పరిమాణాన్ని సూచిస్తుంది. ముందు పోలికతో కలిసి ‘విస్తారంగా’ సహజమైన తెలుగు సమృద్ధి భావాన్ని ఇస్తుంది.
