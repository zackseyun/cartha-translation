id: 1KI.10.20
reference: 1 Kings 10:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/שְׁנֵ֧ים עָשָׂ֣ר אֲרָיִ֗ים עֹמְדִ֥ים שָׁ֛ם עַל שֵׁ֥שׁ הַֽ/מַּעֲל֖וֹת מִ/זֶּ֣ה וּ/מִ/זֶּ֑ה לֹֽא נַעֲשָׂ֥ה כֵ֖ן לְ/כָל מַמְלָכֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/020.yaml
  text: And twelve lions were standing there on the six steps[a], on this side and on that side[b]; nothing like it had been made in any kingdom.
translation:
  language: te
  text: అక్కడ ఆరు మెట్ల మీద[a]—ఇటువైపునా అటువైపునా—పన్నెండు సింహాలు నిలబడి ఉన్నాయి. ఏ రాజ్యంలోనూ ఇలాంటిది చేయబడలేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆరు మెట్ల వద్ద.”
    reason: עַל అనే విభక్తి సందర్భానుసారం మెట్ల ‘మీద’ లేదా వాటి ‘వద్ద/వెంబడి’ ఉన్న అమరికను సూచించవచ్చు.
  - marker: b
    text: పదశః, “రాజ్యాలన్నిటికీ ఇలా చేయబడలేదు.”
    reason: హెబ్రీలో לְכָל מַמְלָכוֹת బహువచన రూపంలో ఉంది; నిషేధ సందర్భంలో దాని సహజ భావం ‘ఏ రాజ్యంలోనూ’.
lexical_decisions:
- source_word: וּשְׁנֵים עָשָׂר אֲרָיִים
  choice: పన్నెండు సింహాలు
  rationale: సింహాసనం చుట్టూ అమర్చిన సింహపు ఆకృతులను సూచించే సరళమైన బహువచన నామవాచకం; సంఖ్యను సహజమైన తెలుగు పదక్రమంలో నామవాచకానికి ముందు ఉంచాం.
- source_word: עֹמְדִים שָׁם
  choice: అక్కడ ... నిలబడి ఉన్నాయి
  rationale: బహువచన కర్తరి అసమాపక క్రియ వర్ణనాత్మకంగా వాటి స్థితిని చూపుతుంది; ‘నిలబడి ఉన్నాయి’ ఆ దృశ్యభావాన్ని నిలుపుతుంది, ‘అక్కడ’ మునుపటి సింహాసన సందర్భాన్ని సూచిస్తుంది.
- source_word: עַל שֵׁשׁ הַמַּעֲלוֹת
  choice: ఆరు మెట్ల మీద
  rationale: מַעֲלוֹת సింహాసనానికి ఎక్కే మెట్లను సూచిస్తుంది; עַל యొక్క సాధారణ స్థలార్థాన్ని ‘మీద’గా ఇచ్చాం, అయితే సందర్భంలో ‘వద్ద/వెంబడి’ అనే భావం కూడా సాధ్యమే.
- source_word: מִזֶּה וּמִזֶּה
  choice: ఇటువైపునా అటువైపునా
  rationale: రెండు వైపులా సమానంగా అమర్చిన స్థానాన్ని తెలిపే జంట ప్రయోగం; తెలుగు సహజత్వంతో పాటు హెబ్రీ సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: לֹא נַעֲשָׂה כֵן
  choice: ఇలాంటిది చేయబడలేదు
  rationale: నిఫాల్ సంపూర్ణక్రియతో కూడిన כֵן, పోల్చదగిన ఇటువంటి నిర్మాణం మరొకటి చేయబడలేదనే భావాన్ని ఇస్తుంది.
- source_word: לְכָל מַמְלָכוֹת
  choice: ఏ రాజ్యంలోనూ
  rationale: నిషేధ వాక్యంలో כָלతో కూడిన బహువచనం పంపిణీ భావంలో ‘ఏ రాజ్యంలోనూ’ అని సహజంగా వ్యక్తమవుతుంది; హెబ్రీలోని לְను పదశః తీసుకుంటే ‘ఏ రాజ్యానికీ’ అని కూడా అనువదించవచ్చు.
