  register: ఆధునిక ప్రామాణిక, గౌరవప్రదమైన తెలుగు. ‘డాలు’ సాధారణ పాఠకులకు అర్థమయ్యే ఆయుధపదం; ‘పెద్ద’ అనే విశేషణం హీబ్రూ పదభేదాన్ని నిలుపుతుంది. బంగారాన్ని సాగగొట్టి పలుచగా చేసిన విధానాన్ని సహజమైన పదబంధంతో వ్యక్తం చేశాం. మూలంలో లేని బరువు ప్రమాణాన్ని పాఠ్యంలో స్పష్టత కోసం చేర్చి పాదసూచికలో వెల్లడించాం.
