source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ הַ/מֶּ֧לֶךְ שְׁלֹמֹ֛ה מָאתַ֥יִם צִנָּ֖ה זָהָ֣ב שָׁח֑וּט שֵׁשׁ מֵא֣וֹת זָהָ֔ב יַעֲלֶ֖ה עַל הַ/צִּנָּ֥ה הָ/אֶחָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/016.yaml
  text: King Solomon made two hundred large shields of beaten gold[b][a]; six hundred shekels of gold went onto each shield.
translation:
  language: te
  text: సొలొమోను రాజు కొట్టి పలుచగా చేసిన బంగారంతో రెండువందల పెద్ద డాళ్లు[a] చేశాడు. ఒక్కొక్క డాలుకు ఆరువందల షెకెలుల[b] బంగారం పట్టింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ పదం పెద్ద డాలును సూచిస్తుంది; తరువాతి వచనంలో చిన్న రకపు డాలుకు వేరొక పదం వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: మూలంలో అక్షరార్థంగా, “ఒక డాలుపైకి ఆరువందల బంగారం ఎక్కింది.” బరువు ప్రమాణం మూలపాఠంలో పేర్కొనబడలేదు; సందర్భానుసారం “షెకెలులు” అని గ్రహించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేయించాడు
  rationale: రాజు స్వయంగా తయారుచేశాడనే అర్థం కంటే తన ఆధ్వర్యంలో తయారు చేయించాడనే సహజమైన రాజసభా సందర్భాన్ని తెలుగులో వ్యక్తం చేస్తుంది; మూలంలోని ‘చేశాడు’ అనే విస్తృత causative-compatible భావాన్ని కాపాడుతుంది.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: సొలొమోను రాజు
  rationale: ఆధునిక ప్రామాణిక తెలుగులో పేరు తరువాత బిరుదు ఉంచడం సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: מָאתַיִם צִנָּה
  choice: రెండువందల పెద్ద డాళ్లు
  rationale: צִנָּה సాధారణంగా శరీరాన్ని ఎక్కువగా కప్పే పెద్ద డాలును సూచిస్తుంది; తదుపరి వచనంలోని చిన్న రకపు డాళ్లతో ఉన్న పదభేదాన్ని నిలుపుతుంది.
- source_word: זָהָב שָׁחוּט
  choice: సాగగొట్టి పలుచగా చేసిన బంగారం
  rationale: שָׁחוּט ఇక్కడ బంగారాన్ని కొట్టి లేదా సాగగొట్టి పలుచగా చేసిన పనితీరును సూచిస్తుంది. కేవలం ‘ముతక బంగారం’ వంటి అపార్థాన్ని నివారిస్తూ ప్రక్రియను స్పష్టంగా తెలియజేస్తుంది.
- source_word: שֵׁשׁ מֵאוֹת זָהָב
  choice: ఆరువందల తులాల బంగారం
  rationale: హీబ్రూలో బరువు ప్రమాణం వ్యక్తంగా లేదు. సందర్భానుసారం షెకెల్ ప్రమాణం ఉద్దేశించబడింది; తెలుగు బైబిలు పాఠకులకు పరిచితమైన ‘తులం’ పదాన్ని వాడి, అది మూలంలో అంతర్లీనంగా ఉన్నదని పాదసూచికలో తెలిపింది.
- source_word: יַעֲלֶה עַל
  choice: పట్టింది
  rationale: అక్షరార్థంగా ‘దానిమీదికి ఎక్కింది’ అయినా, ఒక వస్తువుకు అంత పదార్థం వినియోగించబడిందనే భావాన్ని తెలుగులో ‘పట్టింది’ సహజంగా తెలియజేస్తుంది.
- source_word: הַצִּנָּה הָאֶחָת
  choice: ఒక్కొక్క డాలుకు
  rationale: అక్షరార్థంలోని ‘ఒక డాలుకు’ ఇక్కడ పంపిణీ భావంలో ప్రతి డాలును సూచిస్తుంది; ‘ఒక్కొక్క’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
