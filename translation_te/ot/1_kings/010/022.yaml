source:
  edition: WLC
  text: כִּי֩ אֳנִ֨י תַרְשִׁ֤ישׁ לַ/מֶּ֨לֶךְ֙ בַּ/יָּ֔ם עִ֖ם אֳנִ֣י חִירָ֑ם אַחַת֩ לְ/שָׁלֹ֨שׁ שָׁנִ֜ים תָּב֣וֹא אֳנִ֣י תַרְשִׁ֗ישׁ נֹֽשְׂאֵת֙ זָהָ֣ב וָ/כֶ֔סֶף שֶׁנְהַבִּ֥ים וְ/קֹפִ֖ים וְ/תֻכִּיִּֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/022.yaml
  text: For the king had ships of Tarshish at sea with Hiram’s ships. Once every three years the ships of Tarshish would come, carrying gold and silver, ivory, apes, and peacocks.
translation:
  language: te
  text: ఎందుకంటే సముద్రంలో రాజుకు హీరాము ఓడలతో పాటు తర్షీషు ఓడలు ఉండేవి. మూడు సంవత్సరాలకు ఒకసారి తర్షీషు ఓడలు బంగారం, వెండి, ఏనుగుదంతాలు, కోతులు, నెమళ్లను మోసుకొని వచ్చేవి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֳנִי תַרְשִׁישׁ
  choice: తర్షీషు ఓడలు
  rationale: ఇది ఒక నిర్దిష్ట రకపు లేదా తర్షీషుతో సంబంధమున్న సముద్రయాన ఓడలను సూచించే సంప్రదాయ పదబంధం; గమ్యస్థానాన్ని మాత్రమే అని నిర్ణయించకుండా మూలంలోని నిర్మాణాన్ని నిలుపుతుంది.
- source_word: עִם אֳנִי חִירָם
  choice: హీరాము ఓడలతో పాటు
  rationale: עִם అనే సహచర్య భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; రెండు సమూహాలను తప్పనిసరిగా ఒకే నౌకాదళంగా విలీనం చేయదు.
- source_word: שֶׁנְהַבִּים
  choice: దంతాలు
  rationale: ఈ బహువచన రూపం ఏనుగుదంతాలు లేదా దంతంతో చేసిన వస్తువులను సూచించవచ్చు; ‘దంతాలు’ మూలంలోని రూపాన్ని, వస్తు స్వభావాన్ని నేరుగా నిలుపుతుంది.
- source_word: קֹפִים
  choice: కోతులు
  rationale: పదానికి సాధారణంగా అంగీకరించబడిన అర్థం.
- source_word: תֻכִּיִּים
  choice: నెమళ్లు
  rationale: సంప్రదాయంగా ‘నెమళ్లు’ అని అర్థం చేసుకుంటారు; పదం సూచించే జంతువు పూర్తిగా నిశ్చితం కాకపోయినా, పాఠకులకు తెలిసిన ప్రధాన అనువాదాన్ని ఎంచుకున్నాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘తర్షీషు ఓడలు’ అనే మూలపదబంధం అలాగే నిలుపబడింది; ‘హీరాము ఓడలతో పాటు’ అని అనువదించడం ద్వారా మూలంలోని సహచర్య భావం కాపాడబడింది.
