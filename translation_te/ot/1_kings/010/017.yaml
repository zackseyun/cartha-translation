  text: וּ/שְׁלֹשׁ מֵא֤וֹת מָֽגִנִּים֙ זָהָ֣ב שָׁח֔וּט שְׁלֹ֤שֶׁת מָנִים֙ זָהָ֔ב יַעֲלֶ֖ה עַל הַ/מָּגֵ֣ן הָ/אֶחָ֑ת וַ/יִּתְּנֵ֣/ם הַ/מֶּ֔לֶךְ בֵּ֖ית יַ֥עַר הַ/לְּבָנֽוֹן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/017.yaml
  text: and three hundred shields of beaten gold[a]; three minas of gold went onto each shield[c][b]. And the king put them in the House of the Forest of Lebanon.
translation:
  language: te
  text: ఇంకా అతడు సుత్తితో పలుచగా చేసిన బంగారంతో[a] మూడు వందల డాళ్లు చేయించాడు. ఒక్కొక్క డాలుకు మూడు మానాల[b] బంగారం పట్టింది. రాజు వాటిని ‘లెబానోను అరణ్య భవనం’లో[c] ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కొట్టి పలుచగా చేసిన బంగారంతో.’
    reason: lexical_alternative
  - marker: b
    text: ‘మానా’ ఒక ప్రాచీన బరువు ప్రమాణం. హీబ్రూలో అక్షరార్థంగా, ‘ఆ ఒక్క డాలు మీదికి మూడు మానాల బంగారం ఎక్కింది’ అని ఉంది; అంటే ప్రతి డాలుకు అంత బంగారం అమర్చబడింది.
    reason: lexical_alternative
  - marker: c
    text: ‘లెబానోను అరణ్య భవనం’ అనేది సొలొమోను రాజప్రాసాద సముదాయానికి సంబంధించిన పేరుగల రాజభవనం లేదా ఆయుధాగారం (1 రాజులు 7:2 చూడండి).
    reason: cross_reference
lexical_decisions:
- source_word: מָגִנִּים
  choice: డాళ్లు
  rationale: మునుపటి వచనంలోని చిన్న కవచాలకంటే పెద్ద రక్షణ కవచాలను సూచించే מָגֵןకు ఆధునిక ప్రామాణిక తెలుగులో సహజమైన పదం.
- source_word: זָהָב שָׁחוּט
  choice: సుత్తితో పలుచగా చేసిన బంగారం
  rationale: బంగారాన్ని కొట్టి లేదా సుత్తితో పలుచని రేకులుగా చేసిన తయారీ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: שְׁלֹשֶׁת מָנִים
  choice: మూడు మానాలు
  rationale: מָנֶה అనే ప్రాచీన బరువు ప్రమాణాన్ని అనువదించకుండా తెలుగు లిపిలో ఉంచి, దాని స్వరూపాన్ని కాపాడింది.
- source_word: יַעֲלֶה עַל
  choice: పట్టింది
  rationale: అక్షరార్థంగా ‘పైకి ఎక్కింది’ అనే హీబ్రూ ప్రయోగం, ప్రతి డాలుకు పూతగా లేదా పొరగా ఉపయోగించిన బంగారం పరిమాణాన్ని సూచిస్తుంది; తెలుగులో ‘పట్టింది’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: הַמָּגֵן הָאֶחָת
  choice: ఒక్కొక్క డాలుకు
  rationale: అక్షరార్థ ఏకవచనమైన ‘ఆ ఒక్క డాలుకు’ ఇక్కడ విభజనార్థకంగా ఉండటంతో ‘ఒక్కొక్క’ అని సహజంగా తెలిపింది.
- source_word: וַיִּתְּנֵם
  choice: ఉంచాడు
  rationale: ఈ సందర్భంలో נתן ఒక ప్రదేశంలో వాటిని పెట్టడం లేదా ఉంచడం అనే భావం ఇస్తుంది.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: లెబానోను అరణ్య భవనం
  rationale: ఇది సొలొమోను రాజప్రాసాద సముదాయానికి సంబంధించిన ప్రత్యేక భవన నామం; ‘భవనం’ తెలుగులో సహజంగా ఉండగా, హీబ్రూ పేరులోని అరణ్య భావాన్ని నిలుపుతుంది.
