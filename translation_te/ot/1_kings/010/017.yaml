translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని వరుసను సాధ్యమైనంతవరకు నిలుపుతూ, ‘యַעֲלֶה עַל’ ప్రయోగాన్ని తెలుగులో సహజమైన ‘పట్టింది’గా అందించాం. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
