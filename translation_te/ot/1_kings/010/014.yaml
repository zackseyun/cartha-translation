id: 1KI.10.14
reference: 1 Kings 10:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְהִי֙ מִשְׁקַ֣ל הַ/זָּהָ֔ב אֲשֶׁר בָּ֥א לִ/שְׁלֹמֹ֖ה בְּ/שָׁנָ֣ה אֶחָ֑ת שֵׁ֥שׁ מֵא֛וֹת שִׁשִּׁ֥ים וָ/שֵׁ֖שׁ כִּכַּ֥ר זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/014.yaml
  text: The weight of the gold that came to Solomon in one year was six hundred sixty-six talents of gold,[a]
translation:
  language: te
  text: ఒక సంవత్సరంలో సొలొమోనుకు వచ్చిన బంగారం బరువు ఆరువందల అరవై ఆరు తలాంతుల బంగారం ఉండేది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: తలాంతు అనేది పెద్ద బరువు ప్రమాణం. ఈ వచనం ఒక సంవత్సరంలో వచ్చిన మొత్తాన్ని ఆధునిక ప్రమాణాల్లోకి మార్చకుండా, ప్రాచీన ప్రమాణంలోనే తెలియజేస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: ఉంది (తెలుగులో సహజ వాక్య నిర్మాణంలో అంతర్భూతం)
  rationale: היה క్రియ వాక్యంలోని లెక్కను తెలియజేస్తుంది. ప్రత్యేకంగా ‘అప్పుడు’ లేదా ‘జరిగింది’ అని చేర్చకుండా, ఆధునిక తెలుగులో నామవాచక వాక్యంగా సహజంగా వ్యక్తమవుతుంది.
- source_word: מִשְׁקַל
  choice: బరువు
  rationale: లెక్కల సందర్భంలో ఈ నామవాచకం బరువు లేదా తూకాన్ని సూచిస్తుంది; ‘బరువు’ సూటిగా, సహజంగా ఉంది.
- source_word: הַזָּהָב ... זָהָב
  choice: బంగారం ... (తలాంతులు)
  rationale: మొదటి పదం వస్తువును స్పష్టంగా గుర్తిస్తుంది. తలాంతు స్వయంగా బరువు ప్రమాణమని పాదసూచిక వివరిస్తున్నందున, చివర ‘బంగారం’ను మళ్లీ పలకకపోయినా తెలుగులో అర్థం స్పష్టంగా ఉంటుంది.
- source_word: אֲשֶׁר בָּא לִשְׁלֹמֹה
  choice: సొలొమోనుకు వచ్చిన
  rationale: בוא + ל అనే నిర్మాణం సొలొమోనుకు చేరినదాన్ని సూచిస్తుంది. ‘తీసుకురాబడిన’ అని అనువదిస్తే మూలంలో లేని కర్తృత్వాన్ని నిర్దిష్టం చేసినట్లవుతుంది.
- source_word: בְּשָׁנָה אֶחָת
  choice: ఒక సంవత్సరంలో
  rationale: ఒక సంవత్సరకాల వ్యవధిలో వచ్చిన మొత్తాన్ని సూటిగా తెలియజేస్తుంది.
- source_word: שֵׁשׁ מֵאוֹת שִׁשִּׁים וָשֵׁשׁ
  choice: ఆరువందల అరవై ఆరు
  rationale: హీబ్రూ సంఖ్యకు నేరమైన, ఆధునిక తెలుగు రూపం.
- source_word: כִּכַּר
  choice: తలాంతులు
  rationale: ఇది ప్రాచీన పెద్ద బరువు ప్రమాణం. ఆధునిక ప్రమాణంలోకి ఊహాత్మకంగా మార్చకుండా, బైబిలు వాడుకలో పరిచితమైన ‘తలాంతు’ను నిలుపుకుంది.
