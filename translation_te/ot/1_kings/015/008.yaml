translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే రాజవంశ చరిత్రకు తగిన గౌరవప్రదమైన శైలి. మూలంలోని మరణ నుడికారాన్ని నిలిపి, అవసరమైన సాంస్కృతిక వివరణను పాదసూచికలో ఇచ్చాం. అబీయాము అనే మూలపాఠ నామరూపాన్ని అనువాదంలో నేరుగా నిలిపినందున దానికి ప్రత్యేక పాదసూచిక అవసరం లేదు.
