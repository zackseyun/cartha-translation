base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/008.yaml
  text: And Abijam lay down with his fathers[a], and they buried him in the city of David[b]. Then Asa his son became king in his place.
translation:
  language: te
  text: అబీయాము తన పితరులతో కూడ నిద్రించాడు[a]. అతనిని దావీదు పట్టణంలో పాతిపెట్టారు. అతని కుమారుడైన ఆసా అతని స్థానంలో రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తన పితరులతో కూడ నిద్రించాడు’ అనేది మరణాన్ని సూచించే సంప్రదాయ హెబ్రీ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: తన పితరులతో కూడ నిద్రించాడు
  rationale: మరణాన్ని సూచించే సంప్రదాయ హెబ్రీ నుడికారంలోని రూపకాన్ని నిలుపుతుంది. తెలుగులో ఇది గౌరవప్రదంగా, అర్థమయ్యే విధంగా ఉంది; కేవలం ‘చనిపోయాడు’ అని అనువదిస్తే మూలంలోని రూపకం పోతుంది.
- source_word: אֲבִיָּם
  choice: అబీయాము
  rationale: ఈ వచనంలోని హెబ్రీ నామరూపం అబీయామ్‌ను లిప్యంతరీకరించి నిలిపింది; సంబంధిత కొన్ని వచనాల్లో కనిపించే అబీయా రూపాన్ని ఇక్కడికి మార్చలేదు.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: అతనిని ... పాతిపెట్టారు
  rationale: మూలంలోని క్రియ బహువచన కర్తృవాచకంలో ఉంది. కర్తలను ఊహించి చేర్చకుండా తెలుగులో సహజమైన అనిర్దిష్ట బహువచనాన్ని వాడింది.
- source_word: בְּעִיר דָּוִד
  choice: దావీదు పట్టణంలో
  rationale: స్థిరమైన స్థలనామ భావాన్ని సహజమైన తెలుగు షష్ఠీ నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: రాజ్యపాలన కొనసాగింపుకన్నా సింహాసనారోహణను సూచించే ఈ సందర్భంలోని ఆరంభార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אָסָא בְנוֹ
  choice: అతని కుమారుడైన ఆసా
  rationale: సంబంధాన్ని స్పష్టంగా ఉంచుతూ ఆధునిక తెలుగులో సహజమైన పదక్రమాన్ని అనుసరిస్తుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: రాజవంశ వారసత్వ సూత్రంలో పదవిని చేపట్టడం అనే భావాన్ని ఖచ్చితంగా తెలియజేస్తుంది.
