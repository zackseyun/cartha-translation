source:
  edition: WLC
  text: אֲשֶׁ֨ר עָשָׂ֥ה דָוִ֛ד אֶת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וְ/לֹֽא סָ֞ר מִ/כֹּ֣ל אֲשֶׁר צִוָּ֗/הוּ כֹּ֚ל יְמֵ֣י חַיָּ֔י/ו רַ֕ק בִּ/דְבַ֖ר אוּרִיָּ֥ה הַ/חִתִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/005.yaml
  text: because David had done what was right in the eyes of Yahweh and had not turned aside from anything that he had commanded him all the days of his life[a], except in the matter of Uriah the Hittite.
translation:
  language: te
  text: ఎందుకంటే దావీదు యెహోవా దృష్టిలో సరైనది చేశాడు; తన జీవితకాలమంతా యెహోవా తనకు ఆజ్ఞాపించిన దేనినుంచీ తొలగిపోలేదు—హిత్తీయుడైన ఊరియా విషయంలో[a] తప్ప.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హిత్తీయుడైన ఊరియా సంగతి తప్ప.’
    reason: בִּדְבַר అనే ప్రయోగాన్ని తెలుగులో ‘విషయంలో’ లేదా ‘సంగతి’ అని సహజంగా వ్యక్తం చేయవచ్చు.
lexical_decisions:
- source_word: אֲשֶׁר
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని ప్రకటనకు ఈ వాక్యం కారణాన్ని తెలియజేస్తోంది; అందువల్ల సందర్భానుసారమైన కారణార్థాన్ని స్పష్టంగా వ్యక్తం చేసింది.
- source_word: עָשָׂה ... אֶת הַיָּשָׁר
  choice: సరైనది చేశాడు
  rationale: ‘సరైనది చేయడం’ అనే హీబ్రూ నైతిక మూల్యాంకన నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపింది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టికి
  rationale: ‘యెహోవా కళ్లలో’ అనే హీబ్రూ రూపకానికి దగ్గరగా ఉండి, తెలుగులో సహజంగా వినిపించే మూల్యాంకన ప్రయోగం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని సాధారణ తెలుగు లిప్యంతరీకరణలో ప్రత్యక్షంగా ఉంచింది.
- source_word: וְלֹא סָר
  choice: తొలగిపోలేదు
  rationale: ఆజ్ఞాపించిన మార్గం నుంచి పక్కకు మళ్లకపోవడాన్ని సూచించే סור భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: מִכֹּל אֲשֶׁר צִוָּהוּ
  choice: యెహోవా తనకు ఆజ్ఞాపించిన దేనినుంచీ
  rationale: ‘ఆయన అతనికి’ అనే సర్వనామాల అస్పష్టత తెలుగులో గందరగోళం కలిగించగలందున, ఆజ్ఞాపించినవాడు యెహోవా అని సందర్భానుసారంగా స్పష్టం చేస్తూ כֹּל యొక్క సంపూర్ణతను ‘దేనినుంచీ’లో నిలిపింది.
- source_word: כֹּל יְמֵי חַיָּיו
  choice: తన జీవితకాలమంతా
  rationale: మొత్తం జీవితకాలాన్ని సూచించే హీబ్రూ కాలవ్యక్తీకరణకు సహజమైన తెలుగు రూపం.
- source_word: רַק
  choice: తప్ప
  rationale: ముందటి విస్తృత ప్రశంసకు ఏకైక మినహాయింపును సూటిగా సూచిస్తుంది.
- source_word: בִּדְבַר אוּרִיָּה
  choice: ఊరియా విషయంలో
  rationale: דבר ఇక్కడ ‘విషయం/సంగతి’ అనే భావంలో ఉంది; ఎంపిక చేసిన రూపం మూలార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אוּרִיָּה הַחִתִּי
  choice: హిత్తీయుడైన ఊరియా
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించి, జాతి గుర్తింపును నేరుగా అనువదించింది.
theological_decisions:
- issue: దావీదు చేసిన ఇతర పాపాలు తెలిసినప్పటికీ అతని విధేయతపై వచనం ఇచ్చే విస్తృత ప్రశంస
  choice: వచనంలోని విస్తృత ప్రశంసను, అది చెప్పే స్పష్టమైన ఒక్క మినహాయింపుతో యథాతథంగా నిలుపడం
  alternative: ‘సాధారణంగా నమ్మకంగా ఉన్నాడు’ అని సడలించడం లేదా పశ్చాత్తాపం గురించి వివరణ చేర్చడం
  rationale: మూలవచనం ఉంచిన ఉద్వేగాన్ని అనువాదం పరిష్కరించకూడదు; పశ్చాత్తాపం లేదా నిబంధనాపరమైన విశ్వాసం వంటి వివరణలను వచనంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన శైలిని పాటించింది. దీర్ఘ వాక్యంలోని ప్రశంస మరియు మినహాయింపును స్పష్టంగా వేరు చేయడానికి అర్ధవిరామం, దీర్ఘ విరామచిహ్నం వాడింది.
