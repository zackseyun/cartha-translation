source:
  edition: WLC
  text: כִּ֚י לְמַ֣עַן דָּוִ֔ד נָתַן֩ יְהוָ֨ה אֱלֹהָ֥י/ו ל֛/וֹ נִ֖יר בִּ/ירוּשָׁלִָ֑ם לְ/הָקִ֤ים אֶת בְּנ/וֹ֙ אַחֲרָ֔י/ו וּֽ/לְ/הַעֲמִ֖יד אֶת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/004.yaml
  text: Nevertheless[a], for David’s sake Yahweh his God gave him a lamp in Jerusalem, to raise up his son after him and to establish Jerusalem.
translation:
  language: te
  text: అయినప్పటికీ, దావీదు నిమిత్తం అతని దేవుడైన యెహోవా యెరూషలేములో అతనికి ఒక దీపాన్ని[a] ఇచ్చాడు—అతని తరువాత అతని కుమారుణ్ణి నిలబెట్టడానికి, యెరూషలేమును స్థిరపరచడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వెలుగు’ అని కూడా అనువదించవచ్చు. ‘యెరూషలేములో అతనికి ఒక దీపాన్ని ఇచ్చాడు’ అనే మాట అక్కడ దావీదు రాజవంశాన్ని కొనసాగించడాన్ని సూచించే రూపకం.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: అయినప్పటికీ
  rationale: మునుపటి వచనంలో చెప్పిన అబీయాము పాపానికి విరుద్ధంగా, దావీదు నిమిత్తం దేవుడు అతని రాజవంశాన్ని పూర్తిగా తొలగించలేదనే రాయితీభావాన్ని సందర్భం తెలియజేస్తుంది.
- source_word: לְמַעַן דָּוִד
  choice: దావీదు నిమిత్తం
  rationale: ఒక వ్యక్తిని బట్టి లేదా అతని ఖాతరుకు చర్య చేయడాన్ని సూచించే హీబ్రూ ప్రయోగాన్ని సహజమైన తెలుగు రూపంలో అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: אֱלֹהָיו
  choice: అతని దేవుడైన
  rationale: సందర్భంలోని రాజును సూచించే స్వామ్యసంబంధాన్ని నిలుపుతుంది; పేరును చేర్చి సూచనను అతిగా నిర్దిష్టం చేయదు.
- source_word: נִיר
  choice: దీపం
  rationale: ఈ పదంలోని స్పష్టమైన రూపకాన్ని నిలుపుతుంది; ఇక్కడ అది దావీదు రాజవంశం కొనసాగడాన్ని సూచిస్తుంది.
- source_word: בִּירוּשָׁלָם
  choice: యెరూషలేములో
  rationale: స్థానార్థక ב ఉపసర్గను సహజమైన తెలుగు స్థానవిభక్తితో అనువదిస్తుంది.
- source_word: לְהָקִים אֶת בְּנוֹ אַחֲרָיו
  choice: అతని తరువాత అతని కుమారుణ్ణి నిలబెట్టడానికి
  rationale: కుమారుడు తండ్రి తరువాత వారసుడిగా వచ్చేటట్లు చేయడాన్ని తెలిపే రాజవంశీయ భావాన్ని, మూలంలోని ‘నిలబెట్టు’ రూపానికి దగ్గరగా ఉంచుతుంది.
- source_word: וּלְהַעֲמִיד אֶת יְרוּשָׁלָם
  choice: యెరూషలేమును స్థిరంగా నిలిపి ఉంచడానికి
  rationale: నగరాన్ని రాజకేంద్రంగా నిలబెట్టడం లేదా కొనసాగించడం అనే causative భావాన్ని వ్యక్తం చేస్తూ, మూలపాఠం నగరాన్నే పేర్కొన్న విధానాన్ని కాపాడుతుంది.
theological_decisions:
- issue: נִיר అనే రూపకం దావీదు నిబంధనతో కలిగిన సంబంధం
  choice: ప్రధాన పాఠంలో ‘దీపం’ అనే రూపకాన్ని నిలుపడం
  alternative: రాజవంశం; వంశపారంపర్యం; వెలుగు
  rationale: రూపకాన్ని ‘రాజవంశం’ అని విప్పి చెప్పకుండా, దావీదు వంశం కొనసాగింపుతో ఉన్న అంతర్వచన సంబంధాన్ని కాపాడుతుంది; వివరణను పాదసూచికలో ఇస్తుంది.
- issue: ‘అతని దేవుడు’లోని సర్వనామ సూచన
  choice: సందర్భంలోని అబీయాము/ప్రస్తుత రాజును సూచించేలా, పేరును చేర్చకుండా అనువదించడం
  alternative: దావీదును సూచిస్తుందని స్పష్టీకరించడం
  rationale: సమీప సందర్భం ప్రస్తుత రాజును సూచిస్తుంది; అయినా మూలంలోని సర్వనామాన్ని అలాగే ఉంచడం వల్ల అనువాదం అవసరానికి మించి వ్యాఖ్యానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘దీపం’ అనే మూల రూపకాన్ని ప్రధాన పాఠంలో ఉంచి, దాని రాజవంశీయ భావాన్ని పాదసూచికలో వివరించాం. రెండు హీబ్రూ ఉద్దేశార్థక క్రియారూపాలను తెలుగులో సమాంతరంగా ‘-డానికి’ రూపాలతో అందించాం.
