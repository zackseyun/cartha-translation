id: 1KI.15.34
reference: 1 Kings 15:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֨לֶךְ֙ בְּ/דֶ֣רֶךְ יָרָבְעָ֔ם וּ֨/בְ/חַטָּאת֔/וֹ אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/034.yaml
  text: He did what was evil in the eyes of Yahweh and walked in the way of Jeroboam and in his sin by which he caused Israel to sin.
translation:
  language: te
  text: అతడు యాహ్వే దృష్టిలో చెడ్డది చేశాడు; యెరోబాము మార్గంలోను, ఇశ్రాయేలును పాపం చేయించిన అతని పాపంలోను నడిచాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: చెడ్డది చేశాడు
  rationale: రాజుల గ్రంథంలో తరచుగా వచ్చే ‘చెడ్డది చేయడం’ అనే దైవిక మూల్యాంకన సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో
  rationale: హీబ్రూ ‘కళ్లలో’ అనే రూపకానికి తెలుగులో సహజంగా సమానమైన ‘దృష్టిలో’ను ఉపయోగించి, దేవుని మూల్యాంకన భావాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన చతురక్షర నామాన్ని తెలుగు బైబిలు వాడుకలో గుర్తించదగిన వ్యక్తినామ రూపంలో అందిస్తుంది.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ יָרָבְעָם
  choice: యెరోబాము నడిచిన మార్గంలో ... నడిచాడు
  rationale: ప్రవర్తనా విధానాన్ని సూచించే ‘మార్గంలో నడవడం’ అనే మూలభాష రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וּבְחַטָּאתוֹ
  choice: అతని పాపంలో
  rationale: ఏకవచన నామవాచకాన్ని, యెరోబాముకు సంబంధించిన ప్రత్యయాన్ని యథాతథంగా కాపాడుతుంది.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును పాపం చేయించిన
  rationale: חטא హిఫిల్ రూపంలోని కారణార్థాన్ని—ఇశ్రాయేలు పాపం చేసేలా అతడు కారణమయ్యాడనే భావాన్ని—స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా వ్యక్తినామంగా ఉంచుతూ, సాధారణ తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపాన్ని ఎంచుకుంది.
- issue: యెరోబాము పాపానికి ఇశ్రాయేలు పాపంతో ఉన్న కారణ సంబంధం
  choice: ఇశ్రాయేలును పాపం చేయించిన అతని పాపం
  alternative: ఇశ్రాయేలును పాపంలో నడిపించిన అతని పాపం
  rationale: హీబ్రూ క్రియలోని ప్రత్యక్ష కారణార్థాన్ని నిలుపుతుంది; అతని ప్రభావాన్ని కేవలం ఆదర్శంగా లేదా ప్రేరణగా మాత్రమే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజుల గ్రంథంలోని తీర్పు సూత్రానికి తగిన గంభీరతను ఉంచుతూ, మూలంలోని ‘మార్గంలో నడవడం’ రూపకాన్ని కాపాడింది. పొడవైన సమన్వయ వాక్యాన్ని రెండు వాక్యాలుగా విభజించి పఠన సౌలభ్యం కల్పించినా భావ సంబంధం యథాతథంగా ఉంది.
