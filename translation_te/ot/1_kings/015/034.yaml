revisions:
- from: అతడు యెహోవా దృష్టిలో చెడ్డది చేశాడు. యెరోబాము నడిచిన మార్గంలో, ఇశ్రాయేలును పాపం చేయించిన అతని పాపంలో నడిచాడు.
  to: అతడు యాహ్వే దృష్టిలో చెడ్డది చేశాడు; యెరోబాము మార్గంలోను, ఇశ్రాయేలును పాపం చేయించిన అతని పాపంలోను నడిచాడు.
  rationale: 'The revision aligns the divine name with the stated project policy, preserves the Hebrew evaluative and conduct formulas, and retains the causative force that Jeroboam caused Israel to sin. No footnote is needed: the antecedent of ''అతని'' is clear from the immediately preceding reference to Jeroboam, and the source text does not present a textual ambiguity requiring annotation.'
