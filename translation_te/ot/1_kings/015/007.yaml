revisions:
- from: అబీయాము[a] చేసిన ఇతర కార్యాలన్నీ యూదా రాజుల దినవృత్తాంతాల గ్రంథంలో రాయబడి ఉన్నాయి కదా? అబీయాముకు యరొబాముకు మధ్య యుద్ధం జరిగింది.
  to: అబీయాము[a] యొక్క మిగిలిన కార్యాలూ, అతడు చేసినదంతా యూదా రాజుల దినవృత్తాంతాల గ్రంథంలో రాయబడి ఉన్నాయి కదా? అబీయాము మరియు యరొబాముల మధ్య యుద్ధం జరిగింది.
