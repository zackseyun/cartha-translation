translation_notes:
  register: 'ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక శైలిని ఉపయోగించాం. మూలంలోని అలంకారప్రశ్నను నిలిపాం. అందించిన ఆంగ్ల పాఠంలోని [b] గుర్తు దాని పాదసూచిక విషయంతో సరిపోలలేదు: గుర్తు ‘అతడు చేసినదంతా’ వద్ద ఉండగా పాదసూచిక గ్రంథశీర్షికకు ‘రాజుల వార్షిక వృత్తాంతాలు’ అనే ప్రత్యామ్నాయాన్ని తెలిపింది. అందువల్ల నిరాధారమైన [b] గుర్తును ప్రధాన పాఠంలో చేర్చలేదు.'
