base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/007.yaml
  text: The rest of the acts of Abijam[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah? And there was war between Abijam and Jeroboam.
translation:
  language: te
  text: అబీయాము[a] యొక్క మిగిలిన కార్యాలూ, అతడు చేసినదంతా యూదా రాజుల దినవృత్తాంతాల గ్రంథంలో రాయబడి ఉన్నాయి కదా? అబీయాము మరియు యరొబాముల మధ్య యుద్ధం జరిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని సమాంతర లేదా సంబంధిత వాక్యభాగాల్లో ఇతని పేరు అబీయా అని ఉంది; ఇక్కడి హీబ్రూ పాఠంలో అబీయాము అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי אֲבִיָּם וְכָל אֲשֶׁר עָשָׂה
  choice: అబీయాము చేసిన ఇతర కార్యాలన్నీ
  rationale: రాజవృత్తాంతాల ముగింపు సూత్రంలో דִּבְרֵי అనేది మాటలకన్నా కార్యాలు, సంఘటనలను సూచిస్తుంది. తెలుగు సహజత్వం కోసం ‘మిగిలిన కార్యాలు, అతడు చేసినదంతా’ అనే పునరుక్తిని ఒకే సమగ్ర పదబంధంగా వ్యక్తపరిచాం.
- source_word: אֲבִיָּם
  choice: అబీయాము
  rationale: ఇక్కడి మసొరెటిక్ పాఠంలోని పేరును ‘అబీయా’గా సమన్వయపరచకుండా నేరుగా లిప్యంతరీకరించాం.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: రాయబడి ఉన్నాయి కదా?
  rationale: హీబ్రూ అలంకారప్రశ్న రూపాన్నీ, తెలిసిన విషయాన్ని ధృవీకరించే దాని భావాన్నీ సహజమైన ఆధునిక తెలుగులో నిలిపింది.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: యూదా రాజుల దినవృత్తాంతాల గ్రంథం
  rationale: ఇది రాజులకు సంబంధించిన అధికారిక చారిత్రక నమోదుల గ్రంథశీర్షిక. ‘దినవృత్తాంతాలు’ మూలంలోని కాలక్రమ నమోదుల భావాన్ని అందిస్తుంది.
- source_word: וּמִלְחָמָה הָיְתָה בֵּין אֲבִיָּם וּבֵין יָרָבְעָם
  choice: అబీయాముకు యరొబాముకు మధ్య యుద్ధం జరిగింది
  rationale: అస్తిత్వార్థక హీబ్రూ వాక్యాన్ని వ్యవధి లేదా నిరంతరత్వాన్ని అదనంగా చేర్చకుండా నేరుగా అనువదించాం.
- source_word: יָרָבְעָם
  choice: యరొబాము
  rationale: హీబ్రూ వ్యక్తినామానికి ప్రామాణికమైన తెలుగు లిప్యంతరీకరణ.
