  to: తన తండ్రి తనకు ముందు చేసిన పాపాలన్నిటిలో అతడు నడిచాడు[a]. తన దేవుడైన యహ్వే[c] పట్ల అతని హృదయం తన తండ్రి దావీదు హృదయంలా పూర్తిగా నమ్మకంగా లేదు[b].
