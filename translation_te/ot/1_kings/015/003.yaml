  text: וַ/יֵּ֕לֶךְ בְּ/כָל חַטֹּ֥אות אָבִ֖י/ו אֲשֶׁר עָשָׂ֣ה לְ/פָנָ֑י/ו וְ/לֹא הָיָ֨ה לְבָב֤/וֹ שָׁלֵם֙ עִם יְהוָ֣ה אֱלֹהָ֔י/ו כִּ/לְבַ֖ב דָּוִ֥ד אָבִֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/003.yaml
  text: He walked in all the sins of his father that he had committed before him[a], and his heart was not wholly devoted to Yahweh his God[c][b], like the heart of David his father.
translation:
  language: te
  text: తన తండ్రి తనకు ముందు చేసిన పాపాలన్నిటిలో అతడు నడిచాడు[a]. తన దేవుడైన యహ్వే[c] పట్ల అతని హృదయం తన తండ్రి దావీదు హృదయంలా పూర్తిగా నమ్మకంగా లేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తనకు ముందు’ అనే హీబ్రూ మాటకు ‘అతని సమక్షంలో’ లేదా ‘అతనికంటే ముందుగా’ అనే భావాలు రావచ్చు; తండ్రి పాపాలు అతడు అనుసరించిన మాదిరిగా అతని ఎదుట నిలిచాయని కూడా ఈ మాట సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'మరో విధంగా: ‘తన దేవుడైన యహ్వే పట్ల అతని హృదయం పూర్తిగా విధేయంగా లేదు.’'
    reason: alternative_reading
  - marker: c
    text: హీబ్రూలో YHWH అనే దైవనామం; దీనిని సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל חַטֹּאות
  choice: పాపాలన్నిటిలో నడిచాడు
  rationale: הלך + בְּ అనే హీబ్రూ నైతిక నడవడి ప్రయోగాన్ని నిలుపుతూ, అతడు ఆ పాపపు ప్రవర్తననే కొనసాగించాడనే భావాన్ని తెలియజేస్తుంది.
- source_word: אֲשֶׁר עָשָׂה לְפָנָיו
  choice: తనకు ముందు చేసిన
  rationale: ఈ సంబంధవాచక భాగం తండ్రి చేసిన పాపాలను సూచిస్తుంది. ‘తనకు ముందు’ కాలపరమైన ముందుదనాన్ని ప్రధానంగా తెలియజేస్తూనే, అవి కుమారుని ఎదుట ఉన్న మాదిరిగా నిలిచాయనే సాధ్యమైన ఛాయను పూర్తిగా తొలగించదు.
- source_word: לְבָבוֹ
  choice: అతని హృదయం
  rationale: לֵבָב సంకల్పం, అంతరంగం, విధేయతలను కలిపి సూచిస్తుంది; ‘హృదయం’ ఈ విస్తృత భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: שָׁלֵם עִם
  choice: పట్ల సంపూర్ణంగా
  rationale: ఇక్కడ שָׁלֵם పాపరహిత పరిపూర్ణతకన్నా విభజనలేని విధేయత లేదా సంపూర్ణ అంకితభావాన్ని సూచిస్తుంది. ‘సంపూర్ణంగా’ మూలంలోని రూపకాన్ని, దాని కొంత విస్తృతతను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన YHWHను బిరుదుతో మార్చకుండా, దాని సాధారణ పాండిత్యపూర్వక ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: כִּלְבַב דָּוִד אָבִיו
  choice: తన తండ్రి దావీదు హృదయంలా
  rationale: పోలిక వ్యక్తుల మధ్య మాత్రమే కాక వారి హృదయాల మధ్య ఉందనే హీబ్రూ ఉద్ఘాటనను స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘అతని హృదయం సంపూర్ణంగా లేదు’ అనే మాట అర్థం
  choice: యహ్వే పట్ల అతని అంతరంగ విధేయత అవిభక్తంగా లేదా సంపూర్ణంగా లేదు
  alternative: యహ్వే పట్ల అతని హృదయం పరిపూర్ణంగా లేదు
  rationale: దావీదుతో చేసిన పోలిక నిబంధనపరమైన విధేయతను అంచనా వేస్తుంది; ఇది సంపూర్ణ పాపరాహిత్యాన్ని ప్రకటించడం కాదు. అయినా మూలంలోని ‘సంపూర్ణ హృదయం’ అనే భావతీవ్రతను ప్రధాన పాఠంలో నిలిపాం.
- issue: יְהוָה దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలానికి పారదర్శకంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘పాపాలలో నడవడం’, ‘హృదయం సంపూర్ణంగా ఉండడం’ అనే హీబ్రూ రూపకాలను భావస్పష్టతతో నిలిపి, సందిగ్ధతలకు పాదసూచికలు ఇచ్చాం.
