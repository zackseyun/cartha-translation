  text: And there was war between Asa and Baasha king of Israel all their days[a].
translation:
  language: te
  text: ఆసాకూ ఇశ్రాయేలు రాజైన బయెషాకూ మధ్య వారి దినాలన్నిటిలోనూ[a] యుద్ధం ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారి కాలమంతా’ లేదా ‘వారు జీవించిన దినాలన్నిటిలోనూ.’ హీబ్రూ నుడికారానికి అక్షరార్థం ‘వారి దినాలన్నీ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִלְחָמָה הָיְתָה
  choice: యుద్ధం ఉండేది
  rationale: מִלְחָמָה ‘యుద్ధం’ అని, היה యొక్క అస్తిత్వ నిర్మాణాన్ని ‘ఉండేది’ అని అనువదించడం ద్వారా, మూలంలోని నిరంతర శత్రుత్వ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేసింది; ‘కొనసాగింది’ అనే భావాన్ని అనవసరంగా పదంలో చేర్చలేదు.
- source_word: בֵּין אָסָא וּ/בֵין בַּעְשָׁא
  choice: ఆసాకు ... బయెషాకు మధ్య
  rationale: జతగా వచ్చిన בֵּין ... וּבֵין ఇద్దరి మధ్య పరస్పర విరోధాన్ని సూచిస్తుంది. తెలుగులో ‘ఆసాకు ... బయెషాకు మధ్య’ సహజమైన నిర్మాణం.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజైన
  rationale: ఈ నిర్మాణం బయెషా యొక్క రాజపదవిని తెలియజేస్తుంది. తెలుగులో సంబంధార్థక ‘రాజైన’ ద్వారా పేరుతో సహజంగా అనుసంధానించబడింది.
- source_word: כָּל יְמֵי/הֶם
  choice: వారి దినాలన్నిటిలోనూ
  rationale: హీబ్రూ నుడికారాన్ని దగ్గరగా నిలుపుతూ, అది వారి జీవితకాలాన్నా లేక సందర్భానుసారంగా వారి పరిపాలనా కాలాన్నా సూచిస్తుందనే స్వల్ప అనిశ్చితిని పరిష్కరించకుండా ఉంచింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. వ్యక్తినామాలకు సాధారణ తెలుగు రూపాలైన ‘ఆసా,’ ‘బయెషా’ ఉపయోగించబడ్డాయి; మూలంలోని కాలవ్యాప్తి నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని ప్రత్యామ్నాయ అర్థాలను పాదసూచికలో ఇచ్చాం.
