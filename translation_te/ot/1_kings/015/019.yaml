  text: בְּרִית֙ בֵּינִ֣/י וּ/בֵינֶ֔/ךָ בֵּ֥ין אָבִ֖/י וּ/בֵ֣ין אָבִ֑י/ךָ הִנֵּה֩ שָׁלַ֨חְתִּֽי לְ/ךָ֥ שֹׁ֨חַד֙ כֶּ֣סֶף וְ/זָהָ֔ב לֵ֣ךְ הָפֵ֗רָ/ה אֶת בְּרִֽיתְ/ךָ֙ אֶת בַּעְשָׁ֣א מֶֽלֶךְ יִשְׂרָאֵ֔ל וְ/יַעֲלֶ֖ה מֵ/עָלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/019.yaml
  text: There is a covenant between me and you, between my father and your father. Look, I have sent you a bribe of silver and gold. Go, break your covenant with Baasha king of Israel, so that he may withdraw from me.
translation:
  language: te
  text: “నాకూ నీకూ, నా తండ్రికీ నీ తండ్రికీ మధ్య ఒడంబడిక ఉంది. ఇదిగో, నేను నీకు వెండి బంగారాన్ని లంచంగా పంపాను. నీవు వెళ్లి ఇశ్రాయేలు రాజైన బయషాతో నీకున్న ఒడంబడికను భంగం చేయి; అప్పుడు అతడు నా మీద దాడి చేయడం మాని వెనక్కి తగ్గిపోతాడు.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרִית
  choice: ఒడంబడిక
  rationale: వ్యక్తులు, రాజులు లేదా రాజ్యాల మధ్య కుదిరే బంధపూర్వక ఒప్పందాన్ని తెలిపే స్థిరమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: שֹׁחַד
  choice: లంచం
  rationale: ఈ పదం సాధారణంగా నిర్ణయాన్ని ప్రభావితం చేయడానికి ఇచ్చే ప్రతిఫలాన్ని సూచిస్తుంది; ఇక్కడ వెండిబంగారాలు ఒడంబడికను భంగం చేయించేందుకు పంపబడినందున ‘లంచం’ మూలపదంలోని ప్రతికూల భావాన్ని నిలుపుతుంది.
- source_word: הָפֵרָה
  choice: భంగం చేయి
  rationale: హిఫీల్ ఆజ్ఞారూపం ఒడంబడికను రద్దు చేయడం లేదా ఉల్లంఘించడం అనే బలమైన భావాన్ని ఇస్తుంది.
- source_word: וְיַעֲלֶה מֵעָלָי
  choice: అతడు నా మీద నుంచి వెనక్కి వెళ్లిపోతాడు
  rationale: అక్షరార్థంలోని ‘నా మీద నుంచి పైకి వెళ్లడం’ అనే హీబ్రూ ప్రయోగాన్ని సహజ తెలుగులో, బయషా తన సైనిక ఒత్తిడిని తొలగించుకోవడం అనే సందర్భార్థంతో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: రాజకీయ కానుకకు నైతిక విలువను సూచించే అనువాదం
  choice: లంచం
  alternative: కానుక
  rationale: שֹׁחַד అనే మూలపదం నిష్పాక్షికమైన కానుకకన్నా ప్రలోభపెట్టే లేదా ప్రభావితం చేసే చెల్లింపును సూచిస్తుంది. వాక్యంలోని చర్యను నైతికంగా మృదువుపరచకుండా మూలంలోని ఉద్వేగాన్ని నిలుపుతుంది.
- issue: ‘నా తండ్రి’ అనే పునరుక్తి
  choice: నా తండ్రికీ నీ తండ్రికీ మధ్య
  alternative: మా పూర్వీకుల మధ్య
  rationale: మూలంలో ఉన్న ఏకవచన ‘తండ్రి’ పదాలను సాధారణీకరించకుండా యథాతథ సంబంధాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన రాజదౌత్య వాక్యశైలి. మూలంలోని మూడు ఆజ్ఞాత్మక భాగాలు—‘ఇదిగో’, ‘వెళ్లి’, ‘భంగం చేయి’—స్పష్టంగా నిలుపబడ్డాయి.
