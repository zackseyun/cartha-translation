source:
  edition: WLC
  text: וַ/יַּעֲבֵ֥ר הַ/קְּדֵשִׁ֖ים מִן הָ/אָ֑רֶץ וַ/יָּ֨סַר֙ אֶת כָּל הַ/גִּלֻּלִ֔ים אֲשֶׁ֥ר עָשׂ֖וּ אֲבֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/012.yaml
  text: He removed the male cult prostitutes from the land[d][c][b][a], and he took away all the idols that his fathers had made.
translation:
  language: te
  text: అతడు దేశం నుండి పూజా వేశ్యావృత్తిలో ఉన్న పురుషులను[b] వెళ్లగొట్టాడు[a]. తన పితరులు[d] చేసిన అసహ్య విగ్రహాలన్నిటినీ[c] తొలగించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తొలగించాడు.” మూలభాషలోని క్రియ ఒక స్థలం నుంచి వెళ్లిపోయేలా చేయడం, తొలగించడం లేదా బహిష్కరించడం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదం קְדֵשִׁים అక్షరార్థ రూపంలో “ప్రతిష్ఠితులు” అని ఉంటుంది; ఇక్కడ అది నిషిద్ధ ఆరాధనా సంబంధమైన లైంగిక ఆచారంతో అనుబంధమున్న పురుషులను సూచిస్తుంది. వారి ఖచ్చితమైన పాత్రను “పురుష ఆలయ వేశ్యలు” అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
  - marker: c
    text: “అసహ్య విగ్రహాలు” అనే హీబ్రూ పదం తీవ్ర అవహేళనతో కూడినది; దానికి “మలంలాంటి విగ్రహాలు” అనే ధిక్కార ఛాయ కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: లేదా, “పూర్వీకులు.” హీబ్రూలో “పితరులు” అనేది ముందటి తరాల వారిని సూచించే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: వెళ్లగొట్టాడు
  rationale: హిఫీల్ రూపం ఇక్కడ ఒక స్థలం నుంచి తొలగించడం లేదా వెళ్లిపోయేలా చేయడం అనే భావాన్ని ఇస్తుంది. వ్యక్తులను ఉద్దేశించినందున ‘వెళ్లగొట్టాడు’ సహజంగా ఉండి, క్రియలోని బలాన్ని నిలుపుతుంది.
- source_word: הַקְּדֵשִׁים
  choice: పూజా వ్యభిచారంలో పాల్గొనే పురుషులను
  rationale: ఈ పురుష బహువచన పదం అక్షరార్థంగా ‘ప్రతిష్ఠితులు’ అనే రూపం కలిగినప్పటికీ, ఈ సందర్భంలో నిషిద్ధ ఆరాధనా సంబంధమైన లైంగిక ఆచారంతో అనుబంధమున్న పురుషులను సూచిస్తుంది. వారి నిర్దిష్ట పాత్రపై పదం చెప్పేదానికంటే ఎక్కువగా నిర్ణయించకుండా ఈ అనువాదం భావాన్ని స్పష్టం చేస్తుంది.
- source_word: מִן הָאָרֶץ
  choice: దేశం నుంచి
  rationale: ఇక్కడ הָאָרֶץ యూదా రాజ్య భూభాగాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘దేశం నుంచి’ సహజంగా ఉండి మూలంలోని ప్రాదేశిక భావాన్ని నిలుపుతుంది.
- source_word: וַיָּסַר
  choice: తొలగించాడు
  rationale: హిఫీల్ రూపంలో ఈ క్రియకు తొలగించడం, పక్కకు చేయడం అనే భావం ఉంది. విగ్రహాల నిర్మూలనను తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּל הַגִּלֻּלִים
  choice: అసహ్య విగ్రహాలన్నిటినీ
  rationale: גִּלּוּלִים అనేది విగ్రహాలకు వాడిన తీవ్ర అవహేళనాత్మక పదం. కేవలం ‘విగ్రహాలు’ అని దాని ధిక్కార ఛాయను పోగొట్టకుండా, అసహజమైన అక్షరానువాదాన్ని తప్పించేందుకు ‘అసహ్య విగ్రహాలు’ అని ఇచ్చాం.
- source_word: אֲשֶׁר עָשׂוּ אֲבֹתָיו
  choice: తన పితరులు చేసిన
  rationale: אֲבֹתָיו అనే పురుష బహువచనం అతని తండ్రులను లేదా మునుపటి తరాల పితరులను సూచించే వంశపారంపర్య ప్రయోగం. ‘పితరులు’ మూలానికి దగ్గరగా ఉండి తెలుగులో పూర్వీకుల భావాన్నీ అందిస్తుంది.
theological_decisions:
- issue: הַקְּדֵשִׁים యొక్క ఆరాధనా-లైంగిక సూచన
  choice: పూజా వ్యభిచారంలో పాల్గొనే పురుషులు
  alternative: ప్రతిష్ఠిత పురుషులు / పురుష ఆలయ వేశ్యలు
  rationale: పదరూపంలోని ‘ప్రతిష్ఠితులు’ అనే వ్యుత్పత్తిని ప్రధాన పాఠంలో పెట్టడం సందర్భార్థాన్ని మరుగుపరుస్తుంది; ‘పురుష ఆలయ వేశ్యలు’ అనడం వారి పాత్రను మూలపదం నిర్ధారించేదానికంటే సంకుచితం చేయవచ్చు. అందువల్ల ఆరాధనా సంబంధమైన నిషిద్ధ లైంగిక ఆచారంతో వారి అనుబంధాన్ని తెలిపి, నిర్దిష్ట సంస్థాగత పాత్రను నిర్ణయించలేదు.
- issue: אֲבֹתָיו యొక్క వంశపారంపర్య భావం
  choice: తన పితరులు
  alternative: తన పూర్వీకులు
  rationale: మూలంలోని పురుష రూపాన్ని, రాజవంశానికి చెందిన ముందటి తరాల సూచనను ‘పితరులు’ నిలుపుతుంది. ఇది కేవలం తక్షణ తండ్రినే కాక పూర్వ తరాల వారినీ సూచించగల తెలుగు పదం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘పూజా వ్యభిచారం’ అనే పదబంధం సాధారణ పాఠకునికి సందర్భాన్ని స్పష్టం చేస్తూనే, הַקְּדֵשִׁים యొక్క ఖచ్చితమైన సామాజిక లేదా ఆలయపాత్రపై ఉన్న అనిశ్చితిని పాదటిప్పణిలో నిలుపుతుంది. రెండు హీబ్రూ క్రియల భేదాన్ని ‘వెళ్లగొట్టాడు’ మరియు ‘తొలగించాడు’తో చూపించాం.
