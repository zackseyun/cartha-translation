id: 1KI.15.10
reference: 1 Kings 15:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַרְבָּעִ֤ים וְ/אַחַת֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ מַעֲכָ֖ה בַּת אֲבִישָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/010.yaml
  text: He reigned forty-one years in Jerusalem[b][a], and his mother’s name was Maacah daughter of Abishalom.
translation:
  language: te
  text: అతడు యెరూషలేములో నలభై ఒక్క సంవత్సరాలు రాజుగా పరిపాలించాడు. అతని తల్లి పేరు మయకా; ఆమె అబీషాలోము[a] కుమార్తె[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ నామరూపం ‘అబీషాలోము’; దీనిని ‘అబ్షాలోము’ అని కూడా పేర్కొంటారు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘కుమార్తె’; వంశావళి సందర్భాల్లో ఈ పదం మరింత దూరపు స్త్రీ వంశస్థురాలిని కూడా సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַרְבָּעִים וְאַחַת שָׁנָה
  choice: నలభై ఒక్క సంవత్సరాలు
  rationale: హీబ్రూ నిర్మాణం అక్షరార్థంగా ‘నలభై మరియు ఒక సంవత్సరం’ అని ఉన్నా, ఆధునిక తెలుగులో సహజమైన సంఖ్యా ప్రయోగం ‘నలభై ఒక్క సంవత్సరాలు.’
- source_word: מָלַךְ
  choice: రాజుగా పరిపాలించాడు
  rationale: ఈ సందర్భంలో క్రియ రాజ్యాధికారాన్ని ఎంతకాలం నిర్వహించాడో సూచిస్తుంది; పట్టాభిషేకాన్ని కాదు. ‘రాజుగా పరిపాలించాడు’ అనే రూపం భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: בְּ ఉపసర్గ స్థలాన్ని సూచిస్తుంది; తెలుగులో ‘యెరూషలేములో’ సహజమైన స్థానవాచక రూపం.
- source_word: וְשֵׁם אִמּוֹ
  choice: అతని తల్లి పేరు
  rationale: ‘అతని తల్లి పేరు’ అనే తెలుగు నిర్మాణం హీబ్రూ సంబంధార్థాన్ని నష్టం లేకుండా సహజంగా అందిస్తుంది.
- source_word: מַעֲכָה
  choice: మయకా
  rationale: వ్యక్తి పేరును అనువదించకుండా, తెలుగులో స్థిరపడిన బైబిలు నామరూపానికి అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: בַּת
  choice: కుమార్తె
  rationale: పదానికి ప్రత్యక్షమైన అర్థం ‘కుమార్తె.’ వంశావళి సందర్భాల్లో ఇది మరింత దూరపు స్త్రీ సంతతిని కూడా సూచించగలిగినా, ఆ వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చి సందిగ్ధతను పరిష్కరించలేదు.
- source_word: אֲבִישָׁלוֹם
  choice: అబీషాలోము
  rationale: ఇక్కడి హీబ్రూ నామరూపం אֲבִישָׁלוֹםను నేరుగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణను ఉపయోగించాం.
theological_decisions:
- issue: మయకాకు అబీషాలోముతో ఉన్న వంశసంబంధం
  choice: ప్రధాన పాఠ్యంలో ‘అబీషాలోము కుమార్తె’ అని ఉంచడం
  alternative: ‘అబీషాలోము మనుమరాలు’ లేదా ‘అబీషాలోము వంశస్థురాలు’
  rationale: హీబ్రూ పాఠ్యం స్పష్టంగా בַּת (‘కుమార్తె’) అని చెబుతుంది. ఇతర వంశావళి వివరాలతో పోల్చినప్పుడు విస్తృత వంశసంబంధం సాధ్యమైనా, అనువాదం ఆ చారిత్రక ప్రశ్నను మౌనంగా పరిష్కరించకుండా ప్రత్యక్ష పదాన్ని నిలుపుతుంది; విస్తృత భావసాధ్యతను పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘రాజుగా పరిపాలించాడు’ అనే ప్రయోగం రాజ్యపాలన కాలాన్ని స్పష్టం చేస్తుంది. మూలంలోని వంశసంబంధ ఉద్రిక్తతను ప్రధాన పాఠ్యంలో పరిష్కరించకుండా పాదసూచికలో భద్రపరిచాం.
