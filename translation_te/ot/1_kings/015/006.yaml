source:
  edition: WLC
  text: וּ/מִלְחָמָ֨ה הָיְתָ֧ה בֵין רְחַבְעָ֛ם וּ/בֵ֥ין יָרָבְעָ֖ם כָּל יְמֵ֥י חַיָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/006.yaml
  text: And there was war between Rehoboam and Jeroboam all the days of his life[a].
translation:
  language: te
  text: రెహబాము, యెరోబాము మధ్య అతని జీవితకాలమంతా యుద్ధం జరిగింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రెహబాము జీవితకాలమంతా.’ పరిసర సందర్భం, పాఠ్య సంబంధమైన చర్చల దృష్ట్యా, ఈ సర్వనామం అబీయామును సూచిస్తుందని కొందరు వ్యాఖ్యాతలు అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִלְחָמָה
  choice: యుద్ధం
  rationale: מִלְחָמָה అనే పదానికి ‘యుద్ధం’ లేదా ‘పోరాటం’ అనే అర్థాలున్నాయి. ఈ సందర్భంలో ఏకవచన భావాన్ని సహజంగా తెలియజేయడానికి ‘యుద్ధం’ ఎంచుకోబడింది; వాక్యారంభంలోని וּ కథన సంబంధాన్ని తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని చెప్పకుండానే సహజ వాక్యక్రమం ద్వారా నిలుపుతుంది.
- source_word: הָיְתָה
  choice: జరిగింది
  rationale: היה క్రియ ఇక్కడ యుద్ధం ఉనికిలో ఉండడాన్ని తెలియజేస్తుంది. తెలుగులో ‘యుద్ధం జరిగింది’ అనేది సహజమైన అస్తిత్వార్థక ప్రయోగం; క్రియ స్వయంగా ‘కొనసాగింది’ అని తప్పనిసరిగా సూచించదు.
- source_word: בֵין ... וּ/בֵין
  choice: రెహబాము, యెరోబాము మధ్య
  rationale: జతగా వచ్చిన పూర్వప్రత్యయాలు పోరాటంలోని రెండు పక్షాలను సూచిస్తాయి. తెలుగులో ఇద్దరి పేర్ల తరువాత ‘మధ్య’ ఉంచడం సహజంగా అదే సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: רְחַבְעָם
  choice: రెహబాము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: יָרָבְעָם
  choice: యెరోబాము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: כָּל יְמֵי
  choice: జీవితకాలమంతా
  rationale: ‘అన్ని దినాలు’ అనే హీబ్రూ నుడికారం ఒక వ్యక్తి జీవించిన మొత్తం కాలాన్ని సూచిస్తుంది. ‘జీవితకాలమంతా’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఆ వ్యవధిని తెలియజేస్తుంది.
- source_word: חַיָּיו
  choice: అతని జీవితకాలం
  rationale: పుంలింగ ఏకవచన స్వామ్యప్రత్యయాన్ని ‘అతని’గా ఉంచి, అది ఎవరిని సూచిస్తుందో ప్రధాన పాఠ్యంలో నిర్ణయించకుండా మూలంలోని సందిగ్ధతను కాపాడాం.
theological_decisions:
- issue: ‘అతని జీవితకాలమంతా’లోని సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘అతని’ అని మాత్రమే అనువదించి, పూర్వపదాన్ని నిర్దిష్టంగా చెప్పలేదు.
  alternative: ‘రెహబాము జీవితకాలమంతా’; సందర్భం మరియు పాఠ్య చర్చ ఆధారంగా ‘అబీయాము జీవితకాలమంతా’ అని కూడా కొందరు అర్థం చేసుకుంటారు.
  rationale: హీబ్రూ ప్రత్యయం పుంలింగ ఏకవచనంలో ‘అతని’ అని మాత్రమే ఉంది; ఈ ఉపవాక్యంలో అది ఎవరిని సూచిస్తుందో స్పష్టంగా పేర్కొనలేదు. పాఠ్యంలోని నిజమైన సందిగ్ధతను పరిష్కరించకుండా నిలుపుతూ ప్రత్యామ్నాయ అవగాహనలను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని సర్వనామ సందిగ్ధతను ప్రధాన పాఠ్యంలో నిలిపి, వివరణను పాదసూచికకు పరిమితం చేశాం.
