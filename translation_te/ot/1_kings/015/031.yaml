  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన చారిత్రక శైలి ఉపయోగించబడింది. మూలంలోని అలంకారప్రశ్నను ‘కదా?’తో సహజంగా నిలిపి, రాజవంశ చరిత్ర మూలగ్రంథం విషయంలో ఉండే భావసంభావ్యతను పాదసూచికలో కాపాడాం.
