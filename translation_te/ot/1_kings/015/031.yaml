source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י נָדָ֖ב וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/031.yaml
  text: The rest of the acts of Nadab[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: te
  text: నాదాబు గురించిన మిగిలిన విషయాలు, అతడు చేసినదంతా, ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథంలో[a] రాసి ఉన్నాయి కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలు రాజుల చారిత్రక నమోదుల గ్రంథంలో.” హీబ్రూ పదబంధం రాజుల పాలనకు సంబంధించిన అధికారిక చరిత్ర లేదా వార్షిక నమోదులను సూచిస్తుంది; ఇది బైబిలులోని దినవృత్తాంతములు గ్రంథాన్నే తప్పనిసరిగా సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי נָדָב
  choice: నాదాబు గురించిన మిగిలిన విషయాలు
  rationale: יֶתֶר అంటే ‘మిగిలినవి’; דִּבְרֵי ఇక్కడ మాటలు మాత్రమే కాక రాజు పాలనకు సంబంధించిన విషయాలు లేదా కార్యాల నమోదు అనే విస్తృత భావం కలిగి ఉంది. తరువాత వచ్చే ‘అతడు చేసినదంతా’తో ఉన్న మూలపాఠపు సూత్రబద్ధమైన పునరుక్తిని నిలుపుతుంది.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: అతడు చేసినదంతా
  rationale: సాపేక్ష వాక్యాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా అందిస్తుంది; ‘అంతా’ మూలంలోని כָּל భావాన్ని నిలుపుతుంది.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: రాసి ఉన్నాయి కదా?
  rationale: הֲלֹא సానుకూల సమాధానాన్ని ఆశించే అలంకారప్రశ్న. తెలుగు ‘కదా?’ దాని భావాన్ని సహజంగా తెలియజేస్తుంది; ‘రాసి ఉన్నాయి’ כְּתוּבִים యొక్క లిఖిత నమోదు భావాన్ని కాపాడుతుంది.
- source_word: עַל סֵפֶר
  choice: గ్రంథంలో
  rationale: అక్షరార్థంగా ‘గ్రంథం/చుట్టపై’ అయినా, ఒక లిఖిత ఆధారంలో నమోదు చేయబడిందనే భావానికి తెలుగులో ‘గ్రంథంలో’ సహజంగా ఉంటుంది.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథం
  rationale: דִּבְרֵי הַיָּמִים రాజులకు సంబంధించిన కాలక్రమ లేదా వార్షిక నమోదులను సూచిస్తుంది. ‘దినవృత్తాంతాలు’ ఆ చారిత్రక నమోదు భావాన్ని ఇస్తుంది; ఇది బైబిలులోని దినవృత్తాంతములు గ్రంథాన్నే తప్పనిసరిగా సూచించదని పాదసూచిక స్పష్టం చేస్తుంది.
