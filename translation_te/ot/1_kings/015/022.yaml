source:
  edition: WLC
  text: וְ/הַ/מֶּ֨לֶךְ אָסָ֜א הִשְׁמִ֤יעַ אֶת כָּל יְהוּדָה֙ אֵ֣ין נָקִ֔י וַ/יִּשְׂא֞וּ אֶת אַבְנֵ֤י הָֽ/רָמָה֙ וְ/אֶת עֵצֶ֔י/הָ אֲשֶׁ֥ר בָּנָ֖ה בַּעְשָׁ֑א וַ/יִּ֤בֶן בָּ/ם֙ הַ/מֶּ֣לֶךְ אָסָ֔א אֶת גֶּ֥בַע בִּנְיָמִ֖ן וְ/אֶת הַ/מִּצְפָּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/022.yaml
  text: Then King Asa summoned all Judah—no one was exempt—and they carried away the stones of Ramah and its timber[a], with which Baasha had built[c][b], and King Asa built with them Geba of Benjamin and Mizpah.
translation:
  language: te
  text: అప్పుడు ఆసా రాజు యూదాలోని వారందరినీ పనికి పిలిపించాడు—ఎవరికీ మినహాయింపు లేదు[a]. వారు రామా రాళ్లను, దాని కలపను మోసుకుపోయారు; వాటితో బయెషా రామాను నిర్మించాడు[b]. ఆసా రాజు వాటితో బెన్యామీనులోని గెబాను, మిస్పాను నిర్మించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యం అక్షరార్థంగా, ‘మినహాయించబడినవాడు ఎవరూ లేడు.’ అంటే ఈ పనినుంచి ఎవరికీ మినహాయింపు ఇవ్వలేదు.
    reason: lexical_alternative
  - marker: b
    text: ‘వాటితో బయెషా రామాను నిర్మించాడు’ అనే మాట, రాళ్లను మరియు కలపను బయెషా రామాను బలపరచడానికి ఉపయోగించాడని సూచిస్తుంది.
    reason: referent_clarification
lexical_decisions:
- source_word: הִשְׁמִיעַ
  choice: పనికి పిలిపించాడు
  rationale: హిఫీల్ రూపం అక్షరార్థంగా ‘వినిపించాడు’ అయినా, ఈ సందర్భంలో యూదా ప్రజలందరికీ రాజాజ్ఞ ప్రకటించి నిర్బంధ శ్రమకు సమీకరించడాన్ని సూచిస్తుంది. ‘పనికి పిలిపించాడు’ సందర్భబలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֵין נָקִי
  choice: ఒక్కరికీ మినహాయింపు లేదు
  rationale: ఇక్కడ נָקִי నైతిక నిర్దోషిత్వాన్ని కాకుండా విధి లేదా శ్రమనుంచి విడుదలను సూచిస్తుంది.
- source_word: וַיִּשְׂאוּ
  choice: మోసుకుపోయారు
  rationale: రామాలోని నిర్మాణ సామగ్రిని అక్కడి నుంచి తీసి మరొకచోట ఉపయోగించేందుకు తరలించిన భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: אַבְנֵי הָרָמָה
  choice: రామాలోని రాళ్లు
  rationale: నిర్మాణ స్థలమైన రామాతో రాళ్ల సంబంధాన్ని ఆధునిక తెలుగులో సహజంగా తెలుపుతుంది.
- source_word: עֵצֶיהָ
  choice: దాని కలప
  rationale: బహువచన హీబ్రూ పదం ఇక్కడ నిర్మాణానికి ఉపయోగించిన చెక్క సామగ్రిని సూచిస్తుంది; ‘కలప’ ఆ భావానికి సహజమైన తెలుగు పదం.
- source_word: אֲשֶׁר בָּנָה בַּעְשָׁא
  choice: వాటితోనే బయెషా రామాను కట్టించాడు
  rationale: సంబంధవాక్యం రాళ్లు, కలప రెండింటినీ బయెషా రామా నిర్మాణానికి ఉపయోగించిన సామగ్రిగా సూచిస్తుంది. హీబ్రూలో కర్మ స్పష్టంగా లేకపోయినా సందర్భం వల్ల ‘రామాను’ చేర్చడం అపార్థాన్ని నివారిస్తుంది.
- source_word: וַיִּבֶן בָּם
  choice: వాటితో ... కట్టించాడు
  rationale: בָּם రాళ్లు, కలప అనే సామగ్రిని తిరిగి సూచిస్తుంది. రాజు స్వయంగా శ్రమించాడనే భావం రాకుండా రాజకార్య సందర్భంలో ‘కట్టించాడు’ వాడబడింది.
- source_word: גֶּבַע בִּנְיָמִן
  choice: బెన్యామీనులోని గెబ
  rationale: గెబ పట్టణం బెన్యామీను ప్రాంతానికి చెందినదని హీబ్రూ పదబంధం సూచిస్తుంది; తెలుగులో స్థానసంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַמִּצְפָּה
  choice: మిస్పా
  rationale: నిర్దిష్ట సూచకంతో ఉన్న హీబ్రూ స్థలనామాన్ని తెలుగులో సాధారణ స్థలనామ రూపంలో లిప్యంతరీకరించింది.
