translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు స్పష్టంగా, అయితే చారిత్రక వర్ణనకు తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. రాజు ఆజ్ఞతో జరిగిన ప్రజాశ్రమాన్ని తెలియజేయడానికి ‘పనికి పిలిపించాడు,’ నిర్మాణాన్ని ఆదేశించిన రాజసందర్భాన్ని తెలియజేయడానికి ‘కట్టించాడు’ ఎంచుకున్నాం. స్థలనామాలు గెబ, మిస్పా, రామా; వ్యక్తినామం బయెషా రూపాల్లో ఇచ్చాం.
