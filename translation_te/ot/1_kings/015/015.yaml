id: 1KI.15.15
reference: 1 Kings 15:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֵא֙ אֶת קָדְשֵׁ֣י אָבִ֔י/ו ו/קדש/ו בֵּ֣ית יְהוָ֑ה כֶּ֥סֶף וְ/זָהָ֖ב וְ/כֵלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/015.yaml
  text: And he brought into the house of Yahweh the holy things of his father and his own holy things[a], silver and gold and vessels.
translation:
  language: te
  text: అతడు తన తండ్రికి చెందిన పవిత్ర వస్తువులను, తన సొంత పవిత్ర వస్తువులను[a]—వెండి, బంగారం, పాత్రలను—యాహ్వే మందిరంలోకి తీసుకొచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన తండ్రి ప్రతిష్ఠించిన వస్తువులను, తాను ప్రతిష్ఠించిన వస్తువులను.”
    reason: కָדְשֵׁי אָבִיו మరియు קָדְשׁוֹ అనే పదబంధాలు స్వామ్యంలోని పవిత్ర వస్తువులను లేదా వారు ప్రతిష్ఠించిన వస్తువులను సూచించగలవు.
lexical_decisions:
- source_word: וַיָּבֵא
  choice: తీసుకొచ్చాడు
  rationale: בוא ధాతువు హిఫీల్ రూపం ఇక్కడ ‘తీసుకొచ్చాడు/లోపలికి తెచ్చాడు’ అని అర్థం. గమ్యస్థానం స్పష్టంగా ఉన్నందున సహజమైన తెలుగు రూపమైన ‘తీసుకొచ్చాడు’ ఎంచుకున్నాం.
- source_word: קָדְשֵׁי אָבִיו
  choice: తన తండ్రికి చెందిన పవిత్ర వస్తువులు
  rationale: קדשׁ బహువచన నిర్మాణం ఇక్కడ పవిత్రంగా వేరుచేయబడిన లేదా ప్రతిష్ఠించబడిన వస్తువులను సూచిస్తుంది. మూలంలోని స్వామ్య నిర్మాణాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, క్రియాత్మక అర్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: וְקָדְשׁוֹ
  choice: తన సొంత పవిత్ర వస్తువులు
  rationale: ఏకవచన నామవాచకం మూడవ పురుష ఏకవచన ప్రత్యయంతో సమూహార్థంలో ఉంది. ముందు పదబంధంతో సమాంతరతను నిలుపడానికి ‘తన సొంత పవిత్ర వస్తువులు’ అని అనువదించాం.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: అక్షరార్థంగా ‘యెహోవా గృహం’; ఈ సందర్భంలో దేవాలయాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండేందుకు ‘మందిరం’ వాడాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో సూచించాం.
- source_word: כֶּסֶף וְזָהָב וְכֵלִים
  choice: వెండి, బంగారం, పాత్రలు
  rationale: ఇవి ముందున్న పవిత్ర వస్తువుల వివరాలుగా వస్తాయి. כלים దేవాలయ సందర్భంలో పాత్రలు, ఉపకరణాలు, ఇతర సామగ్రిని సూచించగలదు; ‘పాత్రలు’ సంక్షిప్తమైన సంప్రదాయ తెలుగు ఎంపిక.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠ్యంలో ఉన్న ప్రత్యేక దైవనామాన్ని బిరుదుగా మార్చకుండా పేరుగా నిలిపాం.
- issue: ‘పవిత్ర వస్తువులు’ అనే స్వామ్య నిర్మాణం
  choice: తండ్రికి చెందినవి మరియు అతనికి చెందినవి
  alternative: తండ్రి ప్రతిష్ఠించినవి మరియు అతడు ప్రతిష్ఠించినవి
  rationale: హీబ్రూ రూపం స్వామ్యాన్ని నేరుగా వ్యక్తం చేస్తుంది; అవి ఆయా వ్యక్తులు ప్రతిష్ఠించిన కానుకలనే సందర్భం సూచించవచ్చు. ప్రధాన పాఠ్యం రూపాన్ని నిలుపుతూ ఆ అర్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. మూలంలోని సమాంతరతను నిలుపుతూ, వెండి–బంగారం–పాత్రలు అనే వివరణను డాష్‌లతో స్పష్టపరిచాం.
