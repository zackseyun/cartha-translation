  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/בָּמ֖וֹת לֹא סָ֑רוּ רַ֣ק לְבַב אָסָ֗א הָיָ֥ה שָׁלֵ֛ם עִם יְהוָ֖ה כָּל יָמָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/014.yaml
  text: But the high places were not removed; nevertheless[a], Asa’s heart was wholly devoted to Yahweh all his days.
translation:
  language: te
  text: కానీ ఉన్నత స్థలాలు తొలగించబడలేదు. అయినప్పటికీ, ఆసా హృదయం అతని జీవితకాలమంతా యెహోవా పట్ల సంపూర్ణంగా నిబద్ధమై ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆసా హృదయం అతని జీవితకాలమంతా యెహోవాతో అవిభక్తంగా ఉంది.” హెబ్రీలో అక్షరార్థంగా, “ఆసా హృదయం యెహోవాతో సంపూర్ణంగా ఉంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּמוֹת
  choice: ఉన్నత స్థలాలు
  rationale: బామోత్ అనేది స్థానిక ఆరాధనా స్థలాలను సూచించే స్థిరమైన బైబిలు పదం; మూలంలోని రూపకాన్ని, ఆరాధనా సందర్భాన్ని కాపాడుతుంది.
- source_word: לֹא סָרוּ
  choice: తొలగించబడలేదు
  rationale: ఉన్నత స్థలాలు సంస్కరణలో నిర్మూలించబడలేదనే సందర్భానుసార అర్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: רַק
  choice: అయినప్పటికీ
  rationale: ఉన్నత స్థలాలు తొలగించబడకపోవడం మరియు ఆసా హృదయనిబద్ధతపై ప్రశంస మధ్యనున్న concessive contrastను స్పష్టంగా కాపాడుతుంది.
- source_word: לְבַב אָסָא
  choice: ఆసా హృదయం
  rationale: హృదయం ఇక్కడ అంతరంగ వ్యక్తిత్వం, సంకల్పం, విధేయతను సూచిస్తుంది; మూలంలోని నిర్మాణాన్ని సహజంగా అందిస్తుంది.
- source_word: שָׁלֵם
  choice: సంపూర్ణంగా నిలిచింది
  rationale: పాపరహిత పరిపూర్ణతను సూచించకుండా, విభజింపబడని సంపూర్ణ నిబద్ధతను తెలియజేస్తుంది; 'with Yahweh' అనే మూల నిర్మాణానికి కూడా అనుకూలంగా ఉంటుంది.
- source_word: עִם יְהוָה
  choice: యెహోవా పట్ల
  rationale: עִם అక్షరార్థంగా 'తో' అయినా, హృదయ నిబద్ధతను తెలుగులో సహజంగా వ్యక్తం చేయడానికి 'పట్ల' వాడబడింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణతో వ్యక్తిగత నామంగా కాపాడుతుంది.
- source_word: כָּל יָמָיו
  choice: అతని జీవితకాలమంతా
  rationale: హెబ్రీయుల కాలవ్యాప్తిని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఉన్నత స్థలాలు మిగిలి ఉన్నప్పటికీ ఆసా హృదయం שָׁלֵם అని చెప్పడం
  choice: ఆసా యొక్క మౌలికమైన, అవిభక్త నిబంధనా నిబద్ధతను ధృవీకరించడం
  alternative: ఆసా అన్ని విషయాల్లో పాపరహితుడు లేదా అతని సంస్కరణ పూర్తిగా లోపరహితమైనదని ప్రకటించడం
  rationale: తొలగించబడని ఉన్నత స్థలాల ప్రస్తావనతోపాటే అతని సంపూర్ణ హృదయాన్ని ధృవీకరించడం వల్ల, వాక్యం సంపూర్ణ నైతిక పరిపూర్ణతను కాకుండా ప్రాథమిక విధేయతను సూచిస్తుంది. అనువాదం ఈ ఉద్రిక్తతను తగ్గించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. 'ఉన్నత స్థలాలు' అనే బైబిలు సాంస్కృతిక పదాన్ని నిలిపి, שָׁלֵם యొక్క అక్షరార్థం మరియు భావార్థాన్ని పాదటిప్పణిలో భద్రపరచాం.
