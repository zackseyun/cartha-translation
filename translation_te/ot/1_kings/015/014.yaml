  to: కానీ ఉన్నత స్థలాలు తొలగించబడలేదు. అయినప్పటికీ, ఆసా హృదయం అతని జీవితకాలమంతా యెహోవా పట్ల సంపూర్ణంగా నిబద్ధమై ఉంది.[a]
