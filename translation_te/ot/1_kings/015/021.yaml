  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְהִי֙ כִּ/שְׁמֹ֣עַ בַּעְשָׁ֔א וַ/יֶּחְדַּ֕ל מִ/בְּנ֖וֹת אֶת הָֽ/רָמָ֑ה וַ/יֵּ֖שֶׁב בְּ/תִרְצָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/021.yaml
  text: And when Baasha heard of it[a], he stopped building Ramah and remained in Tirzah.
translation:
  language: te
  text: బయెషా ఆ సంగతి విన్నప్పుడు, రామాను కట్టడం మానివేసి తిర్సాలో ఉండిపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తిర్సాలో నివసించాడు.”
    reason: ישׁב అనే హెబ్రీ క్రియ ఇక్కడ ‘ఉండిపోయాడు’ లేదా ‘నివసించాడు’ అనే భావాలను ఇవ్వగలదు.
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: ఆ సంగతి విన్నప్పుడు
  rationale: ఈ హెబ్రీ కథన నిర్మాణం కాలసూచక ఉపవాక్యాన్ని పరిచయం చేస్తుంది. ముందటి సందర్భంలో చెప్పిన విషయమే వినబడిన సమాచారంగా సూచితమవుతున్నందున, ఆధునిక తెలుగులో సహజంగా ‘ఆ సంగతి’ అని పూరించబడింది.
- source_word: בַּעְשָׁא
  choice: బయెషా
  rationale: వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וַיֶּחְדַּל מִבְּנוֹת
  choice: కట్టించడం మానేసి
  rationale: חדל + מן మరియు క్రియార్థక నామరూపం ఒక పనిని చేయడం నిలిపివేయడాన్ని సూచిస్తాయి. రాజు స్వయంగా నిర్మించాడని కాక, తన ఆధ్వర్యంలో పని జరిపించాడనే సందర్భార్థాన్ని సహజ తెలుగులో ‘కట్టించడం మానేసి’ వ్యక్తం చేస్తుంది.
- source_word: אֶת הָרָמָה
  choice: రామాను
  rationale: ఇక్కడ הָרָמָה స్థల నామం; తెలుగులో కర్మవిభక్తితో ‘రామాను’ అని ఇచ్చాం.
- source_word: וַיֵּשֶׁב
  choice: ఉండిపోయాడు
  rationale: ישׁב అనే పదానికి కూర్చోవడం, నివసించడం, ఉండడం వంటి అర్థాలున్నాయి. నిర్మాణం ఆపిన తరువాత తిర్సాలోనే ఉన్నాడనే కథన సందర్భాన్ని ‘ఉండిపోయాడు’ సహజంగా తెలియజేస్తుంది; ‘నివసించాడు’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְּתִרְצָה
  choice: తిర్సాలో
  rationale: స్థల నామాన్ని తెలుగులో లిప్యంతరీకరించి, בְּ ఉపసర్గాన్ని ‘లో’తో వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన కథన శైలిని అనుసరించాం. హెబ్రీ వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా దాని కాలసంబంధాన్ని, చర్యల క్రమాన్ని సహజ తెలుగులో నిలిపాం.
