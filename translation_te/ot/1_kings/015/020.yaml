source:
  edition: WLC
  text: וַ/יִּשְׁמַ֨ע בֶּן הֲדַ֜ד אֶל הַ/מֶּ֣לֶךְ אָסָ֗א וַ֠/יִּשְׁלַח אֶת שָׂרֵ֨י הַ/חֲיָלִ֤ים אֲשֶׁר ל/וֹ֙ עַל עָרֵ֣י יִשְׂרָאֵ֔ל וַ/יַּךְ֙ אֶת עִיּ֣וֹן וְ/אֶת דָּ֔ן וְ/אֵ֖ת אָבֵ֣ל בֵּֽית מַעֲכָ֑ה וְ/אֵת֙ כָּל כִּנְר֔וֹת עַ֖ל כָּל אֶ֥רֶץ נַפְתָּלִֽי־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/020.yaml
  text: Ben-hadad listened to King Asa and sent the commanders of the armies that were his against the cities of Israel[a], and he struck Ijon, Dan, Abel-beth-maacah, and all Chinneroth[b], against all the land of Naphtali.
translation:
  language: te
  text: బెన్-హదదు రాజైన ఆసా మాట విన్నాడు[a]; తన సైన్యాధిపతులను ఇశ్రాయేలు పట్టణాలపైకి పంపాడు. అతడు ఇయోను, దాను, ఆబేలు-బేత్-మయాకా, కిన్నెరోతు అంతటినీ, నఫ్తాలి దేశమంతటిమీదా దాడి చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రాజైన ఆసా మాటకు సమ్మతించి.’ ఈ హీబ్రూ ప్రయోగం ఒకరి మాటను అనుకూలంగా విని, దానికి అనుగుణంగా చర్య తీసుకోవడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע ... אֶל
  choice: మాట విని
  rationale: ఈ హీబ్రూ ప్రయోగం కేవలం వినడమే కాక, అనుకూలంగా ఆలకించి అభ్యర్థనకు అనుగుణంగా చర్య తీసుకోవడాన్ని సందర్భంలో సూచిస్తుంది. ‘ఆజ్ఞాపాలించాడు’ అంటే ఆసాకు బెన్హదదుపై ఉన్న అధికారాన్ని మూలపాఠం కంటే ఎక్కువగా సూచించే ప్రమాదం ఉంది.
- source_word: שָׂרֵי הַחֲיָלִים אֲשֶׁר לוֹ
  choice: తన సైన్యాల అధిపతులను
  rationale: సైనిక సందర్భంలో שָׂרֵי నాయకులను లేదా అధిపతులను, חֲיָלִים సైన్యాలను సూచిస్తాయి; אֲשֶׁר לוֹ తెలిపే స్వాధీన లేదా ఆధీన సంబంధాన్ని సహజమైన తెలుగులో ‘తన’ వ్యక్తం చేస్తుంది.
- source_word: עַל עָרֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పట్టణాల మీదికి
  rationale: שׁלח తో వచ్చిన עַל ఇక్కడ సైన్యాన్ని శత్రు లక్ష్యాల మీదికి పంపడాన్ని సూచిస్తుంది.
- source_word: וַיַּךְ
  choice: దాడి చేశాడు
  rationale: נכה కొట్టడం, దాడి చేయడం, ఓడించడం వంటి విస్తృతార్థం గల క్రియ. పట్టణాలు, ప్రాంతాలు లక్ష్యాలైన ఈ సైనిక సందర్భంలో ‘దాడి చేశాడు’ సహజంగా ఉంటుంది; ‘ఓడించాడు’ అని ఫలితాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: עִיּוֹן
  choice: ఈయోను
  rationale: హీబ్రూ స్థలనామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: אָבֵל בֵּית מַעֲכָה
  choice: ఆబేలు-బేత్-మయకా
  rationale: సంయుక్త హీబ్రూ స్థలనామాన్ని గుర్తించడానికి హైఫన్లతో తెలుగు లిప్యంతరీకరణ చేయబడింది.
- source_word: כָּל כִּנְרוֹת
  choice: కిన్నెరోతు ప్రాంతమంతటితోపాటు
  rationale: కిన్నెరోతు ఇక్కడ సాధారణ నామవాచకమైన ‘వీణలు’ కాదు, ఒక స్థలనామం. כָּל తో కలిసి అది ఆ పేరుగల ప్రాంతమంతటిని సూచించే అవకాశం ఉంది.
- source_word: עַל כָּל אֶרֶץ נַפְתָּלִי
  choice: నఫ్తాలి దేశమంతటి మీద
  rationale: చివరి עַל సైనిక చర్య విస్తరించిన విస్తృత భూభాగాన్ని సూచిస్తున్నట్లు అనువదించబడింది. అదే సమయంలో ముందు చెప్పిన కిన్నెరోతును ఈ ప్రాంతంతో కలిపే జాబితా సంబంధం ‘తోపాటు’ ద్వారా సహజంగా వ్యక్తమైంది.
