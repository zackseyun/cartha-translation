translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే వాక్య నిర్మాణం వాడబడింది. వ్యక్తి, గోత్ర, స్థలనామాలు తెలుగు బైబిలు పఠనానికి అనుకూలంగా లిప్యంతరీకరించబడ్డాయి. హీబ్రూలో ఏకవచన కర్త కొనసాగుతున్నందున రెండో వాక్యంలో ‘అతడు’ ఉంచబడింది; దాడి సైన్యాధిపతుల ద్వారా జరిగినదని ముందరి వాక్యం స్పష్టం చేస్తుంది.
