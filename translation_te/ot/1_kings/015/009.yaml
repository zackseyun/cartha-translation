  text: In the twentieth year of Jeroboam king of Israel[b][a], Asa became king over Judah.
translation:
  language: te
  text: ఇశ్రాయేలు రాజైన యెరోబాము పాలనలో ఇరవయ్యవ సంవత్సరంలో, ఆసా యూదాకు రాజయ్యాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యూదా రాజుగా పరిపాలించడం ప్రారంభించాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת עֶשְׂרִים
  choice: ఇరవయ్యవ సంవత్సరంలో
  rationale: ఇది రాజుల పాలన సంవత్సరాన్ని తెలిపే సాధారణ కాలసూచక సూత్రం. וְ అనే కథన సంధిని తెలుగులో విడిగా ‘మరియు’ అని అనువదించకుండా సహజమైన కాలవాక్యంగా ఇచ్చాం; עֶשְׂרִים రూపం సంఖ్యావాచకమైనా సందర్భంలో క్రమసంఖ్యార్థం కలిగి ఉంది.
- source_word: לְ/יָרָבְעָם מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజైన యెరోబాము పాలనలో
  rationale: לְ ఇక్కడ యెరోబాము పాలనను సంవత్సర గణనకు ఆధారంగా చూపుతుంది. ‘పాలనలో’ అనేది ఆధునిక తెలుగులో ఈ రాజ్యకాల సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מָלַךְ
  choice: రాజయ్యాడు
  rationale: రాజుల కాలవివరాల సూత్రంలో ఈ క్రియ సాధారణంగా పాలన ప్రారంభాన్ని, అంటే సింహాసనారోహణాన్ని సూచిస్తుంది. ‘రాజయ్యాడు’ ఆ భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אָסָא
  choice: ఆసా
  rationale: హీబ్రూ వ్యక్తినామానికి స్థిరమైన తెలుగు లిప్యంతరీకరణ.
- source_word: מֶלֶךְ יְהוּדָה
  choice: యూదాకు రాజయ్యాడు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘యూదా రాజు’ అని ఉన్నా, מָלַךְతో కలిపి ఇది యూదా రాజ్యంపై ఆసా రాజుగా పాలన ప్రారంభించాడని తెలుపుతుంది. తెలుగులో ‘యూదాకు రాజయ్యాడు’ సహజంగా ఉంది.
