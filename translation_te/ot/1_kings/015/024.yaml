  yaml_path: translation/ot/1_kings/015/024.yaml
  text: And Asa slept with his fathers and was buried with his fathers in the city of David his father[b][a], and Jehoshaphat his son reigned in his place.
translation:
  language: te
  text: ఆసా తన పితరులతో నిద్రించాడు[a] మరియు తన పితరులతోపాటు తన పితరుడైన దావీదు పట్టణంలో సమాధి చేయబడ్డాడు.[b] అతని కుమారుడు యెహోషాపాతు అతని స్థానంలో రాజ్యమేలాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన పూర్వీకులతో.” హీబ్రూ అక్షరార్థంగా “తన పితరులతో” అని చెబుతుంది; ఇది మరణం, సమాధి గురించి రాజవంశ చరిత్రల్లో వాడే స్థిరమైన ప్రయోగం.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “పితరుడైన దావీదు” అంటే ఆసా తక్షణ తండ్రి అని కాదు; అతని రాజవంశ పూర్వీకుడైన దావీదు అని అర్థం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: నిద్రించి
  rationale: రాజుల గ్రంథంలోని మరణవార్తలకు ప్రత్యేకమైన ‘పితరులతో నిద్రించడం’ అనే హీబ్రూ సూత్రప్రయోగాన్ని నిలుపుతుంది; సందర్భం మరణార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: עִם אֲבֹתָיו
  choice: తన పితరులతో
  rationale: హీబ్రూలోని ‘తండ్రులు/పితరులు’ అనే వంశపారంపర్య భావాన్ని, రాజవంశ సంబంధాన్ని కాపాడుతుంది; ఆధునిక తెలుగులో ‘పితరులు’ పూర్వీకులను సహజంగా సూచిస్తుంది.
- source_word: וַיִּקָּבֵר
  choice: సమాధి చేయబడ్డాడు
  rationale: నిఫాల్ క్రియలోని కర్మణి అర్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: తన పితరుడైన దావీదు పట్టణంలో
  rationale: దావీదును ఆసా తక్షణ తండ్రిగా కాక రాజవంశ పూర్వీకునిగా సూచించే హీబ్రూ సంబంధాన్ని స్పష్టంగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וַיִּמְלֹךְ
  choice: రాజ్యమేలాడు
  rationale: రాజ్య వారసత్వ ప్రకటనకు తగిన, స్థిరమైన తెలుగు ప్రయోగం.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: కేవలం కాలానంతర్యాన్ని కాక, రాజుగా అతని స్థానాన్ని స్వీకరించిన భావాన్ని ఖచ్చితంగా తెలియజేస్తుంది.
