  text: Baasha put him to death in the third year of Asa king of Judah[a], and reigned in his place.
translation:
  language: te
  text: యూదా రాజైన ఆసా పరిపాలనలో మూడవ సంవత్సరంలో బయెషా అతణ్ణి హతమార్చాడు[a]; అతని స్థానంలో రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతణ్ణి మరణింపజేశాడు.’ హీబ్రూ క్రియ కారక రూపంలో ఉంది; అక్షరార్థంగా ‘అతడు చనిపోయేలా చేశాడు’ అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמִתֵהוּ
  choice: అతణ్ణి చంపించాడు
  rationale: מות ధాతువు హిఫీల్ రూపంలో ‘చనిపోయేలా చేశాడు/చంపించాడు’ అనే కారక భావాన్ని ఇస్తుంది. ‘చంపించాడు’ ఆ కారక బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בַעְשָׁא
  choice: బయెషా
  rationale: వ్యక్తి పేరును తెలుగులో ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: בִּשְׁנַת שָׁלֹשׁ לְאָסָא מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన ఆసా పరిపాలనలోని మూడో సంవత్సరంలో
  rationale: రాజ్యపాలన సంవత్సరాన్ని సూచించే హీబ్రూ కాలసూత్రాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: ఈ సందర్భంలో מלך అనేది ముందున్న రాజు స్థానాన్ని చేపట్టి రాజుగా పాలించడం మొదలుపెట్టడాన్ని సూచిస్తుంది; తరువాతి תַּחְתָּיוతో ‘రాజయ్యాడు’ సహజంగా సరిపోతుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: రాజ్య వారసత్వంలో ఒకరి స్థానాన్ని మరొకరు చేపట్టడం అనే భావాన్ని నేరుగా తెలియజేస్తుంది.
