translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని రాజకీయ కుట్ర, గోత్ర సంబంధం, ముట్టడి నేపథ్యం స్పష్టంగా ఉంచబడ్డాయి. ప్రధాన వాక్యంలోని సంఘటనల క్రమాన్ని తెలుగులో సహజంగా చేయడానికి కుట్రను మొదటి వాక్యంగా, ముట్టడి నేపథ్యాన్ని రెండవ వాక్యపు ఉపవాక్యంగా అమర్చాం. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉన్నాయి.
