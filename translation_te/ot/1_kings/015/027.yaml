  text: וַ/יִּקְשֹׁ֨ר עָלָ֜י/ו בַּעְשָׁ֤א בֶן אֲחִיָּה֙ לְ/בֵ֣ית יִשָּׂשכָ֔ר וַ/יַּכֵּ֣/הוּ בַעְשָׁ֔א בְּ/גִבְּת֖וֹן אֲשֶׁ֣ר לַ/פְּלִשְׁתִּ֑ים וְ/נָדָב֙ וְ/כָל יִשְׂרָאֵ֔ל צָרִ֖ים עַֽל גִּבְּתֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/027.yaml
  text: Then Baasha son of Ahijah[a], of the house of Issachar, conspired against him, and Baasha struck him down at Gibbethon, which belonged to the Philistines[c][b], while Nadab and all Israel were besieging Gibbethon.
translation:
  language: te
  text: ఇశ్శాఖారు వంశానికి చెందిన అహీయా కుమారుడు బయెషా నాదాబుకు వ్యతిరేకంగా కుట్ర పన్నాడు[a]. నాదాబు, ఇశ్రాయేలీయులందరూ ఫిలిష్తీయులకు చెందిన[c] గిబ్బెతోనును ముట్టడిస్తుండగా, బయెషా గిబ్బెతోనులో అతణ్ణి హతమార్చాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతనికి వ్యతిరేకంగా పన్నాగం పన్నాడు’ / ‘అతనికి వ్యతిరేకంగా కుట్ర ఏర్పరచాడు.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘అతణ్ణి కొట్టాడు’; ఈ సందర్భంలో దాని భావం ‘అతణ్ణి చంపాడు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ఫిలిష్తీయుల అధీనంలో ఉన్న.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: అతనికి వ్యతిరేకంగా కుట్ర పన్నాడు
  rationale: קשר על రాజకీయ కుట్రను సూచిస్తుంది; ఆధునిక తెలుగులో ‘వ్యతిరేకంగా కుట్ర పన్నాడు’ సహజంగా, స్పష్టంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: అహీయా కుమారుడు బయెషా
  rationale: తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా తండ్రి పేరు, కుమారుని పేరుకు ముందు ఉంచబడింది; పేర్లు హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడ్డాయి.
- source_word: לְבֵית יִשָּׂשכָר
  choice: ఇశ్శాఖారు వంశానికి చెందిన
  rationale: ఇక్కడ בֵּית కుటుంబ/గోత్ర వంశసంబంధాన్ని సూచిస్తుంది; ‘వంశానికి చెందిన’ సాధారణ ఆధునిక తెలుగులో సహజమైన రూపం.
- source_word: וַיַּכֵּהוּ
  choice: అతణ్ణి హతమార్చాడు
  rationale: נכה అక్షరార్థంగా ‘కొట్టాడు’; ఈ రాజహత్య సందర్భంలో దెబ్బ ప్రాణాంతకమని కథనం స్పష్టం చేస్తుంది. ‘హతమార్చాడు’ ఫలితాన్ని సహజ తెలుగులో తెలియజేస్తుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: בְּגִבְּתוֹן
  choice: గిబ్బెతోనులో
  rationale: పట్టణం వద్ద జరుగుతున్న ముట్టడి నేపథ్యాన్ని తెలుగులో సహజంగా సూచించే స్థానవాచక రూపం.
- source_word: אֲשֶׁר לַפְּלִשְׁתִּים
  choice: ఫిలిష్తీయుల అధీనంలో ఉన్న
  rationale: లామెద్ నిర్మాణం స్వామ్యాన్ని లేదా నియంత్రణను సూచించగలదు. యుద్ధ సందర్భంలో ‘అధీనంలో ఉన్న’ నగరంపై వారి నియంత్రణను తెలియజేస్తూ మూలంలోని సాధ్యమైన భావాన్ని నిలుపుతుంది.
- source_word: וְנָדָב וְכָל יִשְׂרָאֵל
  choice: నాదాబు, ఇశ్రాయేలీయులందరూ ... ముట్టడిస్తుండగా
  rationale: వావ్ ఇక్కడ ప్రధాన చర్యకు నేపథ్యంగా కొనసాగుతున్న పరిస్థితిని పరిచయం చేస్తుంది; ‘ఉండగా’ ఆ సందర్భార్థాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: צָרִים עַל גִּבְּתוֹן
  choice: గిబ్బెతోనును ముట్టడిస్తుండగా
  rationale: צור על సైనిక సందర్భంలో పట్టణాన్ని ముట్టడించడాన్ని సూచిస్తుంది; కృదంత రూపంలోని కొనసాగుతున్న చర్యను ‘ముట్టడిస్తుండగా’ నిలుపుతుంది.
