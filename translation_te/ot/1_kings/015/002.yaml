id: 1KI.15.2
reference: 1 Kings 15:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שָׁלֹ֣שׁ שָׁנִ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ מַעֲכָ֖ה בַּת אֲבִישָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/002.yaml
  text: He reigned three years in Jerusalem[b][a], and his mother’s name was Maacah daughter of Abishalom.
translation:
  language: te
  text: అతడు యెరూషలేములో మూడు సంవత్సరాలు పరిపాలించాడు; అతని తల్లి పేరు మయకా, ఆమె అబీషాలోము[b] కుమార్తె[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వంశావళి వాడుకలో ‘కుమార్తె’ అనే పదం కొన్నిసార్లు ‘స్త్రీ వంశస్థురాలు’ అనే విస్తృత అర్థాన్ని కూడా ఇవ్వవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ఇక్కడ హీబ్రూ నామరూపం ‘అబీషాలోము’; ఇదే పేరు ఇతర సందర్భాల్లో ‘అబ్షాలోము’ అనే రూపంలో కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֹשׁ שָׁנִים
  choice: మూడు సంవత్సరాలు
  rationale: సంఖ్యావాచకంతో కూడిన బహువచన నామవాచకం రాజ్యపాలన కాలవ్యవధిని తెలియజేస్తుంది; తెలుగులో ఇది సహజమైన రూపం.
- source_word: מָלַךְ
  choice: రాజ్యపాలన చేశాడు
  rationale: ఇక్కడ Qal క్రియ రాజుగా పాలించడాన్ని సూచిస్తుంది; సింహాసనారోహణను కాదు.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: בְ ఉపసర్గ స్థలాన్ని సూచిస్తుంది; ‘యెరూషలేములో’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: וְשֵׁם אִמּוֹ
  choice: అతని తల్లి పేరు
  rationale: రాజుల గ్రంథంలోని సాధారణ రాజవంశీయ సూత్రాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: מַעֲכָה
  choice: మయకా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుకరణలో ప్రతిబింబిస్తుంది.
- source_word: בַּת
  choice: కుమార్తె
  rationale: పదానికి ప్రత్యక్ష అర్థం ‘కుమార్తె’; వంశావళి సందర్భంలో విస్తృత అర్థం ఉండే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֲבִישָׁלוֹם
  choice: అబీషాలోము
  rationale: ఇక్కడి హీబ్రూ నామరూపం אֲבִישָׁלוֹםను ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
theological_decisions:
- issue: వంశావళి వ్యక్తీకరణ בַּת אֲבִישָׁלוֹם
  choice: ప్రధాన పాఠ్యంలో ‘అబీషాలోము కుమార్తె’ అని ప్రత్యక్ష బంధుత్వ పదాన్ని నిలుపుకోవడం
  alternative: అబీషాలోము వంశస్థురాలు/మనవరాలు
  rationale: హీబ్రూ పాఠ్యం నేరుగా ‘కుమార్తె’ అంటుంది. విస్తృత వంశసంబంధ అర్థం సాధ్యమైనప్పటికీ, దానిని ప్రధాన పాఠ్యంలో నిర్ణయించకుండా పాదసూచికలో తెలియజేయడం మూలంలోని ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. రాజుల గ్రంథంలోని సంక్షిప్త రాజ్యపాలన సమాచార సూత్రాన్ని నిలుపుతూ, ‘రాజ్యపాలన చేశాడు’ అనే సాధారణ పాఠకులకు స్పష్టమైన ప్రయోగాన్ని వాడాం.
