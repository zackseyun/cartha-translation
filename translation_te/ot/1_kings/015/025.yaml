translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా ఉండేలా, రాజుల కాలగణనకు తగిన గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని సింహాసనారోహణ మరియు పాలనాకాలం మధ్య క్రియాత్మక భేదాన్ని నిలిపాం.
