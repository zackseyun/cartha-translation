  text: וְ/נָדָ֣ב בֶּן יָרָבְעָ֗ם מָלַךְ֙ עַל יִשְׂרָאֵ֔ל בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ עַל יִשְׂרָאֵ֖ל שְׁנָתָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/025.yaml
  text: Nadab son of Jeroboam became king over Israel in the second year of Asa king of Judah, and he reigned over Israel two years.
translation:
  language: te
  text: యరొబాము కుమారుడైన నాదాబు, యూదా రాజైన ఆసా పాలనలో రెండవ సంవత్సరంలో ఇశ్రాయేలుకు రాజయ్యాడు; అతడు ఇశ్రాయేలును రెండు సంవత్సరాలు పాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/נָדָב בֶּן יָרָבְעָם
  choice: యరొబాము కుమారుడైన నాదాబు
  rationale: וְ కథన క్రమాన్ని కొనసాగించే సంధి; తెలుగులో వాక్యారంభంలో ప్రత్యేకంగా ‘అప్పుడు’ అని చేర్చకుండా సహజ క్రమంతో వ్యక్తం చేశాం. తండ్రి-కొడుకు సంబంధాన్ని ఆధునిక సహజ తెలుగులో తెలిపాం.
- source_word: מָלַךְ עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు రాజయ్యాడు
  rationale: మొదటి מָלַךְ సింహాసనారోహణను సూచిస్తుంది; అందువల్ల కాలవ్యవధిని సూచించే ‘పాలించాడు’ కాకుండా ‘రాజయ్యాడు’ అని అనువదించాం.
- source_word: בִּ/שְׁנַת שְׁתַּיִם לְ/אָסָא מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన ఆసా పాలనలో రెండవ సంవత్సరంలో
  rationale: రాజుల కాలగణన సూత్రాన్ని సహజ తెలుగులో స్పష్టంగా వ్యక్తం చేస్తూ, ‘రెండు’ అనే హీబ్రూ గణనను సందర్భానుసారంగా ‘రెండవ సంవత్సరం’గా ఇచ్చాం.
- source_word: וַ/יִּמְלֹךְ עַל יִשְׂרָאֵל
  choice: అతడు ఇశ్రాయేలును ... పాలించాడు
  rationale: ఇక్కడ క్రియ తరువాత పరిపాలనా కాలవ్యవధి వస్తుంది కాబట్టి, సింహాసనారోహణకు భిన్నంగా ‘పాలించాడు’ అని ఇచ్చాం.
- source_word: שְׁנָתָיִם
  choice: రెండు సంవత్సరాలు
  rationale: ద్వివచన రూపం నాదాబు పరిపాలించిన కాలాన్ని నేరుగా రెండు సంవత్సరాలుగా తెలియజేస్తుంది.
