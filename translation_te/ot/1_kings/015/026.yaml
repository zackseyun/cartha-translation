id: 1KI.15.26
reference: 1 Kings 15:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֨לֶךְ֙ בְּ/דֶ֣רֶךְ אָבִ֔י/ו וּ֨/בְ/חַטָּאת֔/וֹ אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/026.yaml
  text: He did what was evil in the sight of Yahweh and walked in the way of his father and in his sin with which he caused Israel to sin.
translation:
  language: te
  text: అతడు యాహ్వే దృష్టిలో చెడ్డది చేశాడు; తన తండ్రి మార్గంలోను, ఇశ్రాయేలును పాపం చేయించిన అతని పాపంలోను నడిచాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: చెడ్డది చేసి
  rationale: రాజుల గ్రంథంలోని స్థిరమైన నైతిక అంచనా సూత్రాన్ని సంక్షిప్తంగా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో
  rationale: హీబ్రూ భాషలోని ‘కళ్లలో’ అనే అంచనా నుడికారానికి సహజమైన ఆధునిక తెలుగు సమానం; దేవుని వ్యక్తిగత నామాన్ని కూడా నిలుపుతుంది.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ אָבִיו
  choice: తన తండ్రి మార్గంలో నడిచాడు
  rationale: ప్రవర్తనను మార్గంలో నడవడంతో పోల్చే మూలభాష రూపకాన్ని తెలుగులో స్పష్టంగా కాపాడుతుంది.
- source_word: וּבְחַטָּאתוֹ
  choice: అతని పాపంలోనూ
  rationale: ఏకవచన నామవాచకాన్నీ, మూడవ పురుష ప్రత్యయాన్నీ విస్తరించకుండా నిలుపుతుంది; సందర్భంలో అది తండ్రి పాపాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును పాపం చేయించిన
  rationale: חטא యొక్క హిఫీల్ కారణార్థక రూపాన్ని నేరుగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో ఉన్న దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించదగిన రూపంలో ఉంచింది.
- issue: ‘అతని పాపం’లోని సర్వనామ సూచన
  choice: అతని పాపం
  alternative: తన తండ్రి పాపం
  rationale: సందర్భం తండ్రి పాపాన్ని బలంగా సూచించినా, హీబ్రూలో ఉన్న సంక్షిప్త సర్వనామ రూపాన్ని విప్పి చెప్పకుండా ఉంచడం ద్వారా మూలంలోని సూచనా నిర్మాణాన్ని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘మార్గంలో నడిచాడు’ అనే బైబిలీయ నైతిక రూపకాన్ని సహజంగా నిలిపింది; ‘లోనూ’ పునరుక్తి రెండు అనుసంధానిత ప్రవర్తనా రంగాలను స్పష్టపరుస్తుంది.
