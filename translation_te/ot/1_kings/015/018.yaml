source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אָ֠סָא אֶת כָּל הַ/כֶּ֨סֶף וְ/הַ/זָּהָ֜ב הַֽ/נּוֹתָרִ֣ים בְּ/אוֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֽוֹצְרוֹת֙ בֵּ֣ית מלך וַֽ/יִּתְּנֵ֖/ם בְּ/יַד עֲבָדָ֑י/ו וַ/יִּשְׁלָחֵ֞/ם הַ/מֶּ֣לֶךְ אָסָ֗א אֶל בֶּן הֲ֠דַד בֶּן טַבְרִמֹּ֤ן בֶּן חֶזְיוֹן֙ מֶ֣לֶךְ אֲרָ֔ם הַ/יֹּשֵׁ֥ב בְּ/דַמֶּ֖שֶׂק לֵ/אמֹֽר־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/018.yaml
  text: Then Asa took all the silver and the gold that remained in the treasuries of the house of Yahweh and in the treasuries of the king’s house[a], and put them into the hand of his servants. Then King Asa sent them to Ben-hadad son of Tabrimmon, son of Hezion, king of Aram, who lived in Damascus, saying[b],
translation:
  language: te
  text: 'అప్పుడు ఆసా యాహ్వే మందిర ఖజానాల్లోను రాజభవన ఖజానాల్లోను మిగిలివున్న వెండి బంగారమంతా తీసి, వాటిని తన సేవకుల చేతికి అప్పగించాడు. తరువాత ఆసా రాజు వాటిని దమస్కులో నివసిస్తున్న అరాము[a] రాజు, టబ్రిమ్మోను కుమారుడూ హెజ్యోను మనుమడూ అయిన బెన్-హదదుకు పంపించి ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ‘అరాము’; సంప్రదాయ అనువాదాల్లో ‘సిరియా’ అని కూడా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: అప్పుడు ఆసా ... తీసి
  rationale: వావ్-కన్సెక్యూటివ్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘అప్పుడు’ సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: כָּל הַכֶּסֶף וְהַזָּהָב הַנּוֹתָרִים
  choice: మిగిలివున్న వెండి బంగారమంతా
  rationale: כָּל యొక్క సంపూర్ణ భావాన్నీ, הַנּוֹתָרִים యొక్క మిగిలి ఉన్నదనే భావాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בְּאֹצְרוֹת בֵּית יְהוָה
  choice: యాహ్వే మందిర ఖజానాల్లో
  rationale: בֵּית יְהוָה సందర్భంలో దేవాలయాన్ని సూచిస్తుంది; אֹצְרוֹת విలువైన లోహాలు నిల్వచేసే ఖజానాలు. దైవనామం יְהוָהను ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: וְאֶת אֹצְרוֹת בֵּית מלך
  choice: రాజభవన ఖజానాల్లో
  rationale: అక్షరార్థంగా ‘రాజు ఇంటి ఖజానాలు’; సందర్భంలో రాజప్రాసాదాన్ని సూచిస్తున్నందున ‘రాజభవనం’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: וַיִּתְּנֵם בְּיַד עֲבָדָיו
  choice: వాటిని తన సేవకుల చేతికి అప్పగించాడు
  rationale: ‘చేతిలో పెట్టడం’ అనే హీబ్రూ నుడికారానికి అధీనంలో ఉంచడం లేదా అప్పగించడం అనే భావం ఉంది; తెలుగు నుడికారాన్ని కొంత నిలుపుతూ అర్థాన్ని స్పష్టం చేస్తుంది.
- source_word: וַיִּשְׁלָחֵם
  choice: వాటిని ... పంపిస్తూ
  rationale: కర్మప్రత్యయం వెండి బంగారాన్ని సూచిస్తుంది. తరువాతి వచనంలోని ప్రత్యక్ష మాటకు לֵאמֹר అనుసంధానమవుతున్నందున ‘పంపిస్తూ ఇలా అన్నాడు’ సహజంగా ఉంటుంది.
- source_word: בֶּן הֲדַד בֶּן טַבְרִמֹּן בֶּן חֶזְיוֹן
  choice: హెజ్యోను కుమారుడు టబ్రిమ్మోను కుమారుడైన బెన్హదదు
  rationale: తెలుగులో వంశపరంపర సంబంధం అసందిగ్ధంగా ఉండేందుకు పూర్వీకుని నుంచి ప్రధాన వ్యక్తివరకు సహజ క్రమంలో ఇచ్చాం; పేర్లను హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: מֶלֶךְ אֲרָם
  choice: అరాము రాజు
  rationale: తరువాతి కాలపు ‘సిరియా’కు బదులుగా హీబ్రూ చారిత్రక-భౌగోళిక నామమైన אֲרָםను నిలుపుతుంది.
- source_word: הַיֹּשֵׁב בְּדַמֶּשֶׂק
  choice: దమస్కులో నివసిస్తున్న
  rationale: יָשַׁב యొక్క నివాస భావాన్ని ప్రస్తుత కృదంత రూపంలో సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לֵאמֹר
  choice: 'పంపిస్తూ ఇలా అన్నాడు:'
  rationale: తరువాతి వచనంలోని ప్రత్యక్ష సందేశాన్ని పరిచయం చేసే హీబ్రూ రూపాన్ని తెలుగులో సహజంగా అనుసంధానిస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో వ్యక్తిగత దైవనామమైన టెట్రాగ్రామటన్ ప్రత్యక్షంగా ఉంది; బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలభాషా ఆధారాన్ని కాపాడుతుంది.
- issue: אֲרָם భౌగోళిక నామం
  choice: అరాము
  alternative: సిరియా
  rationale: మూలంలోని ప్రాచీన చారిత్రక నామాన్ని నిలుపుతుంది; తరువాతి కాలపు సంప్రదాయ సమానార్థక నామాన్ని పాఠ్యంలోకి దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. ‘రాజు ఇల్లు’ అనే అక్షరార్థానికి బదులుగా సందర్భానుగుణంగా ‘రాజభవనం’ వాడాం. ప్రత్యక్ష సంభాషణ తదుపరి వచనంలో కొనసాగుతుందని చివరలో ద్విబిందువు ఉంచాం.
