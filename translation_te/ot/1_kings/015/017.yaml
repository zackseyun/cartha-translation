source:
  edition: WLC
  text: וַ/יַּ֨עַל בַּעְשָׁ֤א מֶֽלֶךְ יִשְׂרָאֵל֙ עַל יְהוּדָ֔ה וַ/יִּ֖בֶן אֶת הָ/רָמָ֑ה לְ/בִלְתִּ֗י תֵּ֚ת יֹצֵ֣א וָ/בָ֔א לְ/אָסָ֖א מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/017.yaml
  text: Then Baasha king of Israel went up against Judah and built Ramah[b][a], so as not to allow anyone to go out or come in to Asa king of Judah.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు రాజైన బయెషా యూదాపైకి దండెత్తి వెళ్లి, రామాను నిర్మించాడు[a], ఆసా, యూదా రాజు, వద్దకు ఎవరూ వెళ్లడానికీ రావడానికీ వీలు లేకుండా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రామాను కోటగా బలపరిచాడు.” హీబ్రూ క్రియకు అక్షరార్థం “నిర్మించాడు”; అయితే సందర్భం సైనిక రక్షణ నిర్మాణాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “వెళ్లడం, రావడం” అనే హీబ్రూ జంటపదం సాధారణ రాకపోకలను లేదా ప్రవేశాన్ని సూచిస్తుంది. బయెషా ఆసాకు సంబంధించిన రాకపోకలను అడ్డుకోవాలని చూశాడన్నది భావం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל ... עַל־יְהוּדָה
  choice: యూదాకు వ్యతిరేకంగా దండెత్తి వచ్చి
  rationale: సైనిక సందర్భంలో עלה తో עַל శత్రుత్వపూర్వకంగా ముందుకు రావడాన్ని సూచిస్తుంది; తెలుగు సహజత్వానికి ‘దండెత్తి వచ్చి’ అనువైనది.
- source_word: בַּעְשָׁא מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజైన బయెషా
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, రాజపదవిని సహజమైన సంబంధక రూపంలో ఇచ్చాం.
- source_word: וַיִּבֶן אֶת־הָרָמָה
  choice: రామాను నిర్మించాడు
  rationale: בנה యొక్క ప్రాథమిక అర్థం ‘నిర్మించు’; సందర్భం కోటబలపరచడాన్ని సూచించినా, మూలపాఠంలో ఆ భావం స్పష్టంగా లేకపోవడంతో ప్రధాన పాఠంలో విస్తరించలేదు.
- source_word: לְבִלְתִּי תֵּת
  choice: ఎవరూ ... వెళ్లకుండా ... రాకుండా
  rationale: నిరోధక ఉద్దేశాన్ని తెలుగులో సహజంగా తెలిపే నిషేధార్థక నిర్మాణం; ‘ఎవరూ’ అనేది మూలంలోని వ్యక్తీకరించని కర్తను సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: יֹצֵא וָבָא
  choice: వెళ్లకుండా ... రాకుండా
  rationale: అక్షరార్థంగా ‘బయటికి వెళ్లడం, లోపలికి రావడం’; ఇక్కడ రాకపోకలు లేదా ప్రవేశాన్ని అడ్డుకోవడం అనే జంట భావాన్ని సహజ తెలుగులో నిలిపాం.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన ఆసా దగ్గరికి
  rationale: לְ సంబంధం లేదా దిశను సూచిస్తుంది. దిగ్బంధం ఆసాతో సంబంధమున్న రాకపోకలను అడ్డుకోవడమేనని, మూలానికి దగ్గరగా ‘ఆసా దగ్గరికి’ అని ఇచ్చాం.
