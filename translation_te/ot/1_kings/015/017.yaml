  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే చారిత్రక వర్ణనకు తగిన గౌరవప్రదమైన శైలి. మూలంలోని ‘నిర్మించాడు’ అనే పదాన్ని ప్రధాన పాఠంలో నిలిపి, సైనిక కోటబలపరిచే సాధ్యార్థాన్ని పాదటిప్పణిలో ఉంచాం.
