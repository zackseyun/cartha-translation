translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక వచనశైలి. రాజ్యారోహణకు ‘రాజై’, పాలన వ్యవధికి ‘పాలించాడు’ వాడి మూలంలోని సందర్భభేదాన్ని నిలిపాం.
