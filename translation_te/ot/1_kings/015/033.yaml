revisions:
- from: యూదా రాజైన ఆసా పాలనలో మూడో సంవత్సరంలో, అహీయా కుమారుడు బయెషా తిర్సాలో ఇశ్రాయేలంతటికీ రాజై, ఇరవై నాలుగు సంవత్సరాలు పాలించాడు.
  to: యూదా రాజైన ఆసా పాలన మూడవ సంవత్సరంలో, అహీయా కుమారుడైన బయెషా తిర్సాలో ఇశ్రాయేలు అంతటిపై రాజయ్యాడు; అతడు ఇరవై నాలుగు సంవత్సరాలు పాలించాడు.
