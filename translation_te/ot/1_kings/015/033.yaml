  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בִּ/שְׁנַ֣ת שָׁלֹ֔שׁ לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ בַּעְשָׁ֨א בֶן אֲחִיָּ֤ה עַל כָּל יִשְׂרָאֵל֙ בְּ/תִרְצָ֔ה עֶשְׂרִ֥ים וְ/אַרְבַּ֖ע שָׁנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/033.yaml
  text: In the third year of Asa king of Judah, Baasha son of Ahijah became king over all Israel in Tirzah, and he reigned twenty-four years.
translation:
  language: te
  text: యూదా రాజైన ఆసా పాలన మూడవ సంవత్సరంలో, అహీయా కుమారుడైన బయెషా తిర్సాలో ఇశ్రాయేలు అంతటిపై రాజయ్యాడు; అతడు ఇరవై నాలుగు సంవత్సరాలు పాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת שָׁלֹשׁ
  choice: మూడో సంవత్సరంలో
  rationale: కాలాన్ని సూచించే בְּతో కూడిన రాజ్యపాలన-సంవత్సర సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לְ/אָסָא מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన ఆసా పాలనలో
  rationale: లామెద్ ఆసా రాజ్యపాలన సంవత్సరాన్ని ఆధారంగా చేసుకున్న కాలసూచనను తెలియజేస్తుంది; తెలుగులో ‘పాలనలో’ అని స్పష్టం చేయడం సహజం.
- source_word: מָלַךְ
  choice: రాజై
  rationale: ఇక్కడ క్రియ రాజ్యాధికార స్వీకరణను సూచిస్తుంది; తరువాత వచ్చే పాలనాకాలంతో అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: అహీయా కుమారుడు బయెషా
  rationale: హీబ్రూ పితృనామ సంబంధాన్ని సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది; పేర్లు మూలభాష ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడ్డాయి.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలంతటికీ
  rationale: עַל తో מָלַךְ కలయిక ప్రజలపై పరిపాలనను సూచిస్తుంది; ‘అంతటికీ’ మూలంలోని כָּל భావాన్ని నిలుపుతుంది.
- source_word: בְּ/תִרְצָה
  choice: తిర్సాలో
  rationale: స్థలాన్ని సూచించే בְּను తెలుగులో సహజమైన స్థానవిభక్తితో అనువదిస్తుంది.
- source_word: עֶשְׂרִים וְאַרְבַּע שָׁנָה
  choice: ఇరవై నాలుగు సంవత్సరాలు
  rationale: బయెషా పాలన వ్యవధిని మూలంలోని సంఖ్యకు నేరుగా అనుగుణంగా తెలియజేస్తుంది.
