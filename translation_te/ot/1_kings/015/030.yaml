language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַל חַטֹּ֤אות יָרָבְעָם֙ אֲשֶׁ֣ר חָטָ֔א וַ/אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵ֑ל בְּ/כַעְס֕/וֹ אֲשֶׁ֣ר הִכְעִ֔יס אֶת יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/030.yaml
  text: because of the sins of Jeroboam that he committed and by which he caused Israel to sin[a], and because of his provocation by which he provoked Yahweh, the God of Israel.
translation:
  language: te
  text: యరొబాము తాను చేసిన పాపాల కారణంగా, అతడు ఇశ్రాయేలును పాపం చేయించిన కారణంగా, తన రెచ్చగొట్టడం ద్వారా ఇశ్రాయేలు దేవుడైన యాహ్వేకు కోపం పుట్టించిన కారణంగా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל חַטֹּאות יָרָבְעָם
  choice: యరొబాము పాపాల కారణంగా
  rationale: עַל ఇక్కడ ముందుగా చెప్పిన తీర్పుకు కారణాన్ని సూచిస్తుంది; חַטֹּאות బహువచనాన్ని ‘పాపాలు’గా నేరుగా నిలుపుతుంది.
- source_word: אֲשֶׁר חָטָא וַאֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: తాను చేసినవీ, ఇశ్రాయేలుతో చేయించినవీ అయిన
  rationale: חטא క్రియను ‘చేసిన’గా, దాని హిఫీల్ రూపమైన הֶחֱטִיא యొక్క కారణార్థక బలాన్ని ‘ఇశ్రాయేలుతో చేయించిన’గా వ్యక్తం చేస్తుంది; తద్వారా యరొబాము స్వయంగా పాపం చేయడమూ, ఇశ్రాయేలును పాపం చేయించడమూ రెండూ నిలుస్తాయి.
- source_word: בְּכַעְסוֹ
  choice: అతని రెచ్చగొట్టే ప్రవర్తన కారణంగా
  rationale: כַּעַס కోపం లేదా కోపం పుట్టించే రెచ్చగొట్టడాన్ని సూచించగలదు. తరువాతి הִכְעִיסతో ఉన్న పదసంబంధాన్ని బట్టి ప్రధాన పాఠ్యంలో దేవునికి కోపం పుట్టించే ప్రవర్తన అనే భావాన్ని ఎంచుకున్నాం; ‘అతని కోపం’ అనే నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: הִכְעִיס
  choice: కోపం పుట్టించిన
  rationale: హిఫీల్ క్రియలోని ‘కోపానికి రేపడం’ అనే కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరంగా వినియోగంలో ఉన్న ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: హీబ్రూ సమాసంలోని సంబంధాన్ని సహజమైన తెలుగులో పారదర్శకంగా నిలుపుతుంది.
theological_decisions:
- issue: యరొబాము ఇశ్రాయేలును పాపం చేయించిన విధానంలోని కారణార్థం
  choice: ఇశ్రాయేలుతో చేయించినవీ
  alternative: ఇశ్రాయేలును పాపంలోకి నడిపించినవీ
  rationale: హీబ్రూ హిఫీల్ రూపం అతడు ఇశ్రాయేలు పాపానికి కారణమయ్యాడని చెబుతుంది గాని, అది ఎలా జరిగిందో ఈ వాక్యంలో నిర్దిష్టం చేయదు; అందువల్ల ‘నడిపించాడు’ వంటి విధానాన్ని పాఠ్యంలో చేర్చలేదు.
- issue: בְּכַעְסוֹలో కోపమా లేక రెచ్చగొట్టడమా
  choice: అతని రెచ్చగొట్టే ప్రవర్తన
  alternative: అతని కోపం
  rationale: రెండు భావాలూ పదానికి సాధ్యమే. వెంటనే వచ్చే ‘కోపం పుట్టించిన’ అనే క్రియతో పదసంబంధం ఉన్నందున ప్రధాన పాఠ్యంలో ‘రెచ్చగొట్టే ప్రవర్తన’ను ఎంచుకుని, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: יְהוָה దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది; దాన్ని బిరుదుగా మార్చకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించాం. మూలవాక్యం ముందటి వాక్యానికి అనుసంధానమైన కారణవాచక భాగం; తెలుగులో స్వతంత్ర వచనంగా స్పష్టత కోసం ‘ఇదంతా జరిగింది’ అని సందర్భసిద్ధమైన ముగింపును చేర్చాం. ‘తాను చేసినవీ, ఇశ్రాయేలుతో చేయించినవీ’ అనే సమాంతర నిర్మాణం మూలంలోని రెండు సంబంధవాచక ఉపవాక్యాలను నిలుపుతుంది.
