- from: తాను చేసినవీ, ఇశ్రాయేలుతో చేయించినవీ అయిన యరొబాము పాపాల కారణంగా, ఇశ్రాయేలు దేవుడైన యెహోవాకు కోపం పుట్టించిన అతని రెచ్చగొట్టే ప్రవర్తన[a] కారణంగా ఇదంతా జరిగింది.
