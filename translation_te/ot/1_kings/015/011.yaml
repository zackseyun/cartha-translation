reference: 1 Kings 15:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ אָסָ֛א הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/דָוִ֖ד אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/011.yaml
  text: Asa did what was right in the eyes of Yahweh[a], as David his father had done.
translation:
  language: te
  text: ఆసా తన తండ్రియైన దావీదులాగే యహ్వే దృష్టిలో సరైనది చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన పూర్వికుడైన దావీదులాగే.” ఇక్కడ “తండ్రి” అనేది ఆసా తక్షణ జనకుణ్ణి కాక, అతని రాజవంశ పూర్వికుణ్ణి సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేశాడు
  rationale: עשה అనే క్రియకు సాధారణంగా ‘చేయు’ అనే అర్థం ఉంది. రాజును నైతికంగా అంచనా వేసే ఈ సూత్రబద్ధ వాక్యంలో ‘సరైనది చేశాడు’ అనేది సహజమైన తెలుగు ప్రయోగం.
- source_word: אָסָא
  choice: ఆసా
  rationale: వ్యక్తి పేరును తెలుగులో ప్రామాణికంగా లిప్యంతరీకరించాం.
- source_word: הַיָּשָׁר
  choice: సరైనది
  rationale: יָשָׁר అంటే ‘సూటిగా ఉన్నది, సరైనది, యథార్థమైనది.’ ఈ నిర్మాణంలో ‘సరైనది’ అనేది నైతిక మూల్యాంకనాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּעֵינֵי
  choice: దృష్టికి
  rationale: అక్షరార్థంగా ‘కళ్లలో’ అనే హెబ్రీయ రూపకం ఒకరి అంచనా లేదా దృక్కోణాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘దృష్టికి’ అదే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా లిప్యంతరీకరించాం.
- source_word: כְּדָוִד
  choice: దావీదులాగే
  rationale: כְּ అనే ఉపసర్గ పోలికను సూచిస్తుంది. ‘దావీదులాగే’ తెలుగులో ఆ పోలికను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: אָבִיו
  choice: తన తండ్రి
  rationale: אָבִיו అక్షరార్థంగా ‘అతని తండ్రి’; ఇక్కడ అది తక్షణ జనకుని కాక రాజవంశ పూర్వికుణ్ణి సూచిస్తుంది. మూలంలోని వంశపారంపర్య భాషను ప్రధాన పాఠ్యంలో నిలిపి, వివరణను పాదటిప్పణిలో ఇచ్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: హెబ్రీ పాఠ్యంలో వ్యక్తిగత దైవనామమే ఉంది. కాబట్టి దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలపాఠ్యానికి నిబద్ధంగా ఉంటుంది.
- issue: ‘దావీదు అతని తండ్రి’ అనే వంశపారంపర్య ప్రయోగం
  choice: ప్రధాన పాఠ్యంలో ‘తన తండ్రి దావీదు’ అని ఉంచడం
  alternative: తన పూర్వికుడైన దావీదు
  rationale: ఆసాకు దావీదు తక్షణ తండ్రి కాదు; హెబ్రీలో ‘తండ్రి’ అనే పదం వంశపూర్వికుణ్ణి కూడా సూచించగలదు. మూలంలోని పదప్రయోగాన్ని నిలిపి, అపార్థం రాకుండా పాదటిప్పణి జోడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హెబ్రీ మూలంలోని రాజసంబంధ నైతిక మూల్యాంకనాన్ని, దైవనామాన్ని, వంశపారంపర్య ‘తండ్రి’ ప్రయోగాన్ని కాపాడుతూ అవసరమైన వివరణను పాదటిప్పణిలో ఇచ్చాం.
