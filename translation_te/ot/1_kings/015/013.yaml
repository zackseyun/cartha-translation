  terminology: “రాజమాత” appropriately represents the royal office. “అషేరా” preserves the source ambiguity between the deity and a cult symbol, and the footnotes explain this well. “అసహ్యకరమైన ప్రతిమ” is a defensible contextual rendering, while the footnote retains the uncertainty about the object.
