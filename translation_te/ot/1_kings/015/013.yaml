  text: וְ/גַ֣ם אֶת מַעֲכָ֣ה אִמּ֗/וֹ וַ/יְסִרֶ֨/הָ֙ מִ/גְּבִירָ֔ה אֲשֶׁר עָשְׂתָ֥ה מִפְלֶ֖צֶת לָ/אֲשֵׁרָ֑ה וַ/יִּכְרֹ֤ת אָסָא֙ אֶת מִפְלַצְתָּ֔/הּ וַ/יִּשְׂרֹ֖ף בְּ/נַ֥חַל קִדְרֽוֹן׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/013.yaml
  text: He also removed Maacah his mother from being queen mother[a], because she had made an abominable image for Asherah[c][b]. Asa cut down her image and burned it in the Kidron Valley.
translation:
  language: te
  text: అంతేకాక, ఆసా తన తల్లి మయకాను రాజమాత పదవి నుండి తొలగించాడు[a]. ఎందుకంటే ఆమె అషేరా కోసం ఒక అసహ్యకరమైన ప్రతిమను[b][c] చేసింది. ఆసా ఆమె ప్రతిమను నరికివేసి, కిద్రోను లోయలో దాన్ని కాల్చివేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అతని తల్లి.’ రాజవంశ వాడుకలో ఈ మాట కొన్నిసార్లు అమ్మమ్మను లేదా మరొక స్త్రీ పూర్వికురాలిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అసహ్యమైన వస్తువు,’ ‘భయంకరమైన వస్తువు.’ ఈ ఆరాధనా వస్తువు ఖచ్చితంగా ఎలాంటిదో తెలియదు.
    reason: lexical_alternative
  - marker: c
    text: ‘అషేరా’ అనేది అషేరా అనే దేవతను లేదా ఆమె ఆరాధనా చిహ్నాన్ని సూచించవచ్చు; రెండవదాన్ని కొన్నిసార్లు ‘అషేరా స్తంభం’ అని అనువదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: అంతేకాక
  rationale: మునుపటి సంస్కరణ చర్యలకు దీనిని జోడించే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מַעֲכָה אִמּוֹ
  choice: తన తల్లి మయకాను
  rationale: హీబ్రూ పాఠంలోని ‘అతని తల్లి’ అనే మాటను ప్రధాన పాఠంలో నిలుపుతుంది; రాజవంశ వాడుకలో ఇది అమ్మమ్మను లేదా మరొక స్త్రీ పూర్వికురాలిని కూడా సూచించవచ్చనే అంశాన్ని పాదసూచికలో ఉంచింది.
- source_word: וַיְסִרֶהָ מִגְּבִירָה
  choice: రాజమాత పదవి నుండి తొలగించాడు
  rationale: క్రియలోని పదవి నుంచి తొలగించే భావాన్ని, గెవీరా సూచించే రాజదర్బారు హోదాను స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר עָשְׂתָה
  choice: ఎందుకంటే ఆమె ... చేయించింది
  rationale: ఇక్కడ సంబంధవాచక నిర్మాణం ఆమె తొలగింపుకు కారణాన్ని తెలియజేస్తుంది. రాజమాత స్వయంగా తయారు చేసిందని కాక, తయారుచేయించిందనే సహజ సాధక భావానికి తెలుగు రూపం అనుకూలంగా ఉంది.
- source_word: מִפְלֶצֶת
  choice: ఒక అసహ్యకరమైన ప్రతిమను
  rationale: ఆరాధనా వస్తువు పట్ల హీబ్రూ పదంలోని తీవ్రమైన వికర్షణను తెలియజేస్తూ, దాని ఖచ్చితమైన ఆకారాన్ని అతిగా నిర్ధారించదు.
- source_word: לָאֲשֵׁרָה
  choice: అషేరా కోసం
  rationale: అషేరా దేవతనో ఆమె ఆరాధనా చిహ్నాన్నో సూచించగల హీబ్రూ సందిగ్ధతను లిప్యంతరీకరణ ద్వారా నిలుపుతుంది.
- source_word: וַיִּכְרֹת ... אֶת מִפְלַצְתָּהּ
  choice: ఆమె ప్రతిమను నరికివేసి
  rationale: כרת అనే క్రియలోని ‘నరికివేయడం’ అనే స్పష్టమైన భౌతిక భావాన్ని నిలుపుతుంది.
- source_word: וַיִּשְׂרֹף
  choice: దాన్ని కాల్చివేశాడు
  rationale: కాల్చడం అనే క్రియను నేరుగా, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: בְּנַחַל קִדְרוֹן
  choice: కిద్రోను లోయలో
  rationale: נחל సూచించగల వాగులోయ లేదా కనుమ భావాన్ని, ప్రసిద్ధ భౌగోళిక ప్రదేశానికి సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: אֲשֵׁרָה పదం యొక్క సూచితం
  choice: ‘అషేరా’ అని నిర్దిష్టీకరించకుండా ఉంచడం
  alternative: ‘అషేరా దేవత’ లేదా ‘అషేరా స్తంభం/ఆరాధనా చిహ్నం’
  rationale: ఈ పదం దేవతను గానీ ఆమె ఆరాధనా చిహ్నాన్ని గానీ సూచించవచ్చు. వాక్యంలో తయారుచేసిన మరో వస్తువు ప్రత్యేకంగా ప్రస్తావించబడినందున, ఏదో ఒక అర్థాన్ని నిర్ణయించడం మూలపాఠపు సందిగ్ధతను తొలగిస్తుంది.
- issue: מִפְלֶצֶת యొక్క ఖచ్చిత స్వరూపం
  choice: ‘అసహ్యకరమైన ప్రతిమ’
  alternative: ‘భయంకరమైన వస్తువు’ లేదా ‘అశ్లీల ప్రతిమ’
  rationale: ప్రతికూల మూల్యాంకనాన్ని నిలుపుతూ, ఆ ఆరాధనా వస్తువు రూపం లేదా అశ్లీల స్వభావాన్ని నిరాధారంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘రాజమాత పదవి’ ద్వారా సంస్థాగత హోదా స్పష్టమవుతుంది. అషేరా గురించి మూలపాఠంలోని నిజమైన సందిగ్ధతను ప్రధాన పాఠం మరియు పాదసూచికల్లో నిలిపాం.
