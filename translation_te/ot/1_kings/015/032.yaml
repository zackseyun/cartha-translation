  text: And there was war between Asa and Baasha king of Israel all their days[a].
translation:
  language: te
  text: ఆసాకు, ఇశ్రాయేలు రాజైన బయెషాకు మధ్య వారి జీవితకాలమంతా యుద్ధం కొనసాగింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో అక్షరార్థంగా, “వారి రోజులన్నీ.”
    reason: హీబ్రూ నుడికారానికి అక్షరార్థ ప్రత్యామ్నాయాన్ని నమోదు చేయడం.
lexical_decisions:
- source_word: וּ/מִלְחָמָה הָיְתָה
  choice: యుద్ధం కొనసాగింది
  rationale: ఈ సందర్భంలో היה అనే క్రియతో కూడిన వాక్యం యుద్ధస్థితి వారి కాలమంతా నెలకొని ఉన్నదని తెలుగులో సహజంగా తెలియజేస్తుంది. పదశః ‘యుద్ధం ఉండింది’ కంటే ఇది ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది; అయితే కొత్త సంఘటనలు నిరంతరం జరిగాయని ప్రత్యేకంగా చెప్పదు.
- source_word: בֵּין אָסָא וּ/בֵין בַּעְשָׁא
  choice: ఆసాకు ... బయెషాకు మధ్య
  rationale: పునరుక్తమైన בֵּין ... וּבֵין నిర్మాణాన్ని సహజ తెలుగు సహసంబంధ రూపమైన ‘...కు ...కు మధ్య’గా అనువదించింది.
- source_word: בַּעְשָׁא
  choice: బయెషా
  rationale: హీబ్రూ వ్యక్తినామం בַּעְשָׁאను మూల ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజైన
  rationale: బయెషాను గుర్తించే సమాసపదబంధాన్ని తెలుగులో సహజమైన విశేషణ రూపంలో ఇచ్చింది.
- source_word: כָּל יְמֵי/הֶם
  choice: వారి జీవితకాలమంతా
  rationale: పదశః ‘వారి రోజులన్నీ’; ఇక్కడ ‘రోజులు’ జీవితకాలాన్ని సూచించే హీబ్రూ నుడికారం. సాధారణ ఆధునిక తెలుగు పాఠకునికి అర్థం స్పష్టంగా ఉండేందుకు ‘జీవితకాలమంతా’ అని ఇచ్చింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని నిరంతర విరోధ స్థితిని నిలుపుతూ, అసహజమైన పదశః వాక్యనిర్మాణాన్ని నివారించింది.
