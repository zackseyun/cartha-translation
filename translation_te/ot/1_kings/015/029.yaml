id: 1KI.15.29
reference: 1 Kings 15:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י כְ/מָלְכ֗/וֹ הִכָּה֙ אֶת כָּל בֵּ֣ית יָרָבְעָ֔ם לֹֽא הִשְׁאִ֧יר כָּל נְשָׁמָ֛ה לְ/יָרָבְעָ֖ם עַד הִשְׁמִד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַד עַבְדּ֖/וֹ אֲחִיָּ֥ה הַ/שִּׁילֹנִֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/029.yaml
  text: And when he became king[a], he struck down all the house of Jeroboam. He did not leave to Jeroboam a single living thing, until he had destroyed him[b], according to the word of Yahweh that he had spoken by the hand of his servant Ahijah the Shilonite.
translation:
  language: te
  text: అతడు రాజైనప్పుడు యెరోబాము వంశమంతటినీ హతమార్చాడు. యెరోబాము వంశంలో ప్రాణమున్న ఒక్కరినీ మిగల్చకుండా[a], ఆ వంశాన్ని పూర్తిగా నిర్మూలించాడు[b]. యాహ్వే తన సేవకుడైన షిలోనీయుడైన అహీయా ద్వారా పలికిన మాట ప్రకారం అతడు ఇలా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఏ ఊపిరినీ మిగల్చలేదు”; అంటే సజీవంగా ఒక్కరినీ వదల్లేదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదరూపాన్ని “అతణ్ణి నాశనం చేసేంతవరకు” అని కూడా అనువదించవచ్చు; ఇక్కడ “అతణ్ణి” యెరోబామును అతని వంశానికి ప్రతినిధిగా సూచించవచ్చు. అది యెరోబాము వంశాన్ని సామూహికంగా కూడా సూచించవచ్చు.
    reason: referential_ambiguity
lexical_decisions:
- source_word: וַיְהִי כְמָלְכוֹ
  choice: అతడు రాజైనప్పుడు
  rationale: హీబ్రూ కథన సూత్రాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా వ్యక్తం చేస్తుంది; రాజ్యాధికారం చేపట్టిన సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הִכָּה
  choice: హతమార్చాడు
  rationale: రాజవంశ నిర్మూలన సందర్భంలో ‘కొట్టాడు’ కంటే మరణానికి గురిచేశాడనే భావాన్ని సహజంగా, తగిన తీవ్రతతో తెలియజేస్తుంది.
- source_word: אֶת כָּל בֵּית יָרָבְעָם
  choice: యెరోబాము వంశమంతటినీ
  rationale: రాజకీయ-కుటుంబార్థం గల ‘ఇల్లు’ అనే హీబ్రూ ప్రయోగాన్ని ఆధునిక తెలుగు పాఠకునికి స్పష్టమైన ‘వంశం’గా అందిస్తుంది.
- source_word: לֹא הִשְׁאִיר כָּל נְשָׁמָה
  choice: ప్రాణమున్న ఒక్కరినీ మిగల్చకుండా
  rationale: నְשָׁמָהలోని శ్వాస/ప్రాణ భావాన్ని నిలుపుతూ, ఎవరూ సజీవంగా మిగలలేదనే నానుడి అర్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עַד הִשְׁמִידוֹ
  choice: ఆ వంశాన్ని పూర్తిగా నాశనం చేశాడు
  rationale: ‘నాశనం చేసేంతవరకు’ అనే హీబ్రూ ఫలితాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది. ఏకవచన పుంలింగ ప్రత్యయం కలిగించే సూచనాసందిగ్ధతను పాదసూచికలో నిలుపుతుంది.
- source_word: כִּדְבַר יְהוָה
  choice: యెహోవా పలికిన మాట ప్రకారమే
  rationale: దైవవాక్య నెరవేర్పు సూత్రాన్ని స్పష్టంగా ఉంచి, יְהוָה అనే వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకలో గుర్తించదగిన ‘యెహోవా’గా లిప్యంతరీకరిస్తుంది.
- source_word: אֲשֶׁר דִּבֶּר בְּיַד עַבְדּוֹ
  choice: తన సేవకుడు ... ద్వారా ... పలికిన
  rationale: ‘చేతి ద్వారా’ అనే హీబ్రూ ప్రవచన మధ్యవర్తిత్వ నానుడిని ఆధునిక తెలుగులో సహజమైన ‘ద్వారా’తో వ్యక్తం చేస్తుంది.
- source_word: אֲחִיָּה הַשִּׁילֹנִי
  choice: షిలోనీయుడైన ... అహీయా
  rationale: వ్యక్తి పేరును, షిలో ప్రాంతానికి చెందినవాడనే విశేషణాన్ని తెలుగు ధ్వనులకు అనుగుణంగా లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో బిరుదు కాక దేవుని వ్యక్తినామమైన చతురక్షర నామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన రూపంలో లిప్యంతరీకరించాం.
- issue: עַד הִשְׁמִידוֹలోని ఏకవచన ప్రత్యయం ఎవరిని/దేనిని సూచిస్తుంది
  choice: ప్రధాన పాఠంలో యెరోబాము వంశాన్ని సామూహికంగా సూచించేదిగా అనువదించడం
  alternative: ‘అతణ్ణి నాశనం చేసేంతవరకు’ అని యెరోబామును వ్యాకరణపరంగా సూచించడం
  rationale: సందర్భం యెరోబాము రాజవంశ నిర్మూలన గురించి చెబుతుంది; అయితే హీబ్రూలోని పుంలింగ ఏకవచన రూపాన్ని పూర్తిగా మూసివేయకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథనశైలిని వాడాం. ‘వంశం,’ ‘హతమార్చాడు,’ ‘ద్వారా’ వంటి సాధారణంగా అర్థమయ్యే పదాలతో రాజవంశ నిర్మూలనను స్పష్టంగా చెప్పాం; మూలంలోని శ్వాస-చిత్రణను, ఏకవచన ప్రత్యయ సందిగ్ధతను పాదసూచికల్లో భద్రపరిచాం.
