revisions:
- from: అతడు రాజైనప్పుడు యెరోబాము వంశమంతటినీ హతమార్చాడు. యెరోబాము వంశంలో ప్రాణమున్న ఒక్కరినీ మిగల్చకుండా[a], ఆ వంశాన్ని పూర్తిగా నాశనం చేశాడు[b]. షిలోనీయుడైన తన సేవకుడు అహీయా ద్వారా యెహోవా పలికిన మాట ప్రకారమే ఇది జరిగింది.
  to: అతడు రాజైనప్పుడు యెరోబాము వంశమంతటినీ హతమార్చాడు. యెరోబాము వంశంలో ప్రాణమున్న ఒక్కరినీ మిగల్చకుండా[a], ఆ వంశాన్ని పూర్తిగా నిర్మూలించాడు[b]. యాహ్వే తన సేవకుడైన షిలోనీయుడైన అహీయా ద్వారా పలికిన మాట ప్రకారం అతడు ఇలా చేశాడు.
  rationale: చివరి నెరవేర్పు-సూత్రాన్ని కర్తృకంగా మార్చి, బాషా చేసిన చర్యకు యెహోవా వాక్యంతో ఉన్న సంబంధాన్ని తిరిగి స్పష్టం చేశాం. עַד הִשְׁמִידוֹ యొక్క సామూహిక అర్థాన్ని ప్రధాన పాఠంలో ఉంచి, పుంలింగ ఏకవచన సూచనను పాదసూచికలో భద్రపరిచాం. దైవనామాన్ని ఆంగ్ల POB ఆడిట్ నిర్ణయానికి అనుగుణంగా ‘యాహ్వే’గా మార్చాం.
