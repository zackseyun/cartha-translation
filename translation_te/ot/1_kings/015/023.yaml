  text: וְ/יֶ֣תֶר כָּל דִּבְרֵֽי אָ֠סָא וְ/כָל גְּב֨וּרָת֜/וֹ וְ/כָל אֲשֶׁ֣ר עָשָׂ֗ה וְ/הֶֽ/עָרִים֙ אֲשֶׁ֣ר בָּנָ֔ה הֲ/לֹֽא הֵ֣מָּה כְתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֣י יְהוּדָ֑ה רַ֚ק לְ/עֵ֣ת זִקְנָת֔/וֹ חָלָ֖ה אֶת רַגְלָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/023.yaml
  text: The rest of all the acts of Asa[a], and all his might, and all that he did[b], and the cities that he built—are they not written in the Book of the Chronicles of the Kings of Judah? Yet in the time of his old age he became diseased in his feet.
translation:
  language: te
  text: ఆసా చేసిన మిగిలిన కార్యాలన్నీ, అతని పరాక్రమమంతా, అతడు చేసినదంతా, అతడు నిర్మించిన పట్టణాలు—ఇవన్నీ యూదా రాజుల దినవృత్తాంతాల గ్రంథంలో రాయబడి ఉన్నాయి కదా? అయితే అతని ముసలితనంలో అతని పాదాలకు వ్యాధి వచ్చింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదాన్ని “కాళ్లు” అని కూడా అనువదించవచ్చు. మూలపాఠం వ్యాధి ఏమిటో నిర్దిష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר כָּל דִּבְרֵי אָסָא
  choice: ఆసా చేసిన మిగిలిన కార్యాలన్నీ
  rationale: రాజుల పాలనాసారాంశాల్లో דִּבְרֵי అనేది మాటలను కాకుండా కార్యాలు, సంఘటనలు అనే విస్తృత భావాన్ని ఇస్తుంది. వాక్యారంభంలోని וְకు తెలుగులో ప్రత్యేకంగా ‘ఇప్పుడు’ అని చేర్చకుండా సహజమైన సంధానాన్ని ఉంచాం.
- source_word: וְכָל גְּבוּרָתוֹ
  choice: అతని పరాక్రమమంతా
  rationale: גְּבוּרָה బలం, శౌర్యం లేదా పరాక్రమాన్ని సూచించగలదు. తరువాతి ‘అతడు చేసినదంతా’ అనే మాటతో కలిసిపోకుండా నామవాచక భావాన్ని నిలిపాం.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: అతడు చేసినదంతా
  rationale: మూలంలోని విస్తృతమైన సంబంధవాచక వాక్యభాగాన్ని నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: וְהֶעָרִים אֲשֶׁר בָּנָה
  choice: అతడు నిర్మించిన పట్టణాలు
  rationale: בָּנָה అంటే నిర్మించడం. సందర్భంలో కోటబందీ భావం ఉండవచ్చుగాని మూలపాఠం దానిని స్పష్టంగా చెప్పనందున దాన్ని చేర్చలేదు.
- source_word: הֲלֹא הֵמָּה כְתוּבִים
  choice: ఇవన్నీ ... రాయబడి ఉన్నాయి కదా?
  rationale: హీబ్రూలోని అలంకారప్రశ్న రూపాన్నీ, కర్మణి ప్రయోగాన్నీ సహజమైన తెలుగు ప్రశ్నాంతం ‘కదా?’తో నిలిపాం.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: యూదా రాజుల దినవృత్తాంతాల గ్రంథంలో
  rationale: ఇది రాజులకు సంబంధించిన అధికారిక చరిత్ర/వార్షిక నమోదు గ్రంథాన్ని సూచించే స్థిరమైన రాజవృత్తాంత సూత్రం.
- source_word: רַק לְעֵת זִקְנָתוֹ
  choice: అయితే అతని ముసలితనంలో
  rationale: רַק ఇక్కడ పరిమితి లేదా మినహాయింపు భావంతో కొత్త గమనికను ప్రవేశపెడుతుంది; ‘అయితే’ ఆ వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: חָלָה אֶת רַגְלָיו
  choice: అతని పాదాలకు వ్యాధి వచ్చింది
  rationale: మూలం ప్రభావితమైన శరీరభాగాన్ని చెబుతుంది గాని వ్యాధి ఏమిటో నిర్దిష్టంగా చెప్పదు. అందువల్ల నిర్ధారణను ఊహించకుండా సాధారణ వ్యాధి భావాన్ని ఉంచాం.
