  yaml_path: translation/ot/1_kings/015/001.yaml
  text: In the eighteenth year of King Jeroboam son of Nebat[a], Abijam became king over Judah.
translation:
  language: te
  text: నెబాతు కుమారుడైన యెరోబాము రాజు పరిపాలనలోని పద్దెనిమిదవ సంవత్సరంలో అబీయాము[a] యూదాను పాలించే రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: “అబీయాము”; ఇదే రాజును ఇతర వాక్యభాగాల్లో “అబీయా” అని పిలుస్తారు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת
  choice: సంవత్సరంలో
  rationale: ఇది రాజుల పాలనకాలాన్ని సూచించే సాధారణ హీబ్రూ కాలనిర్ణయ సూత్రం. ఆరంభంలోని וּను విడిగా ‘మరియు’ అని అనువదించకుండా, సహజమైన తెలుగు వాక్య నిర్మాణంలో కాలసూచనగా అందించాం.
- source_word: שְׁמֹנֶה עֶשְׂרֵה
  choice: పద్దెనిమిదవ
  rationale: రాజు పాలనలోని సంవత్సరాన్ని లెక్కించే సందర్భం కాబట్టి తెలుగులో క్రమసంఖ్య సహజంగా ఉంటుంది.
- source_word: לַ/מֶּלֶךְ יָרָבְעָם בֶּן נְבָט
  choice: నెబాతు కుమారుడైన యెరోబాము రాజు పరిపాలనలో
  rationale: హీబ్రూ రాజ్యసంవత్సర కాలసూచనను స్పష్టమైన, సహజమైన తెలుగులో వ్యక్తపరుస్తూ తండ్రి పేరుతో కూడిన గుర్తింపును నిలిపాం.
- source_word: מָלַךְ
  choice: రాజయ్యాడు
  rationale: ఈ పట్టాభిషేక సమాచారంలో క్రియ రాజ్యాధికారం చేపట్టిన క్షణాన్ని సూచిస్తుంది; ‘పాలించాడు’ అనేది మొత్తం పాలనాకాలాన్ని సూచించే అవకాశం ఉన్నందున ‘రాజయ్యాడు’ ఎంచుకున్నాం.
- source_word: אֲבִיָּם
  choice: అబీయాము
  rationale: మసోరా పాఠంలోని ప్రత్యేక నామరూపాన్ని ప్రతిబింబించాం; ఇతర చోట్ల కనిపించే ‘అబీయా’ రూపాన్ని ప్రధాన పాఠ్యంలో కలపలేదు.
- source_word: עַל יְהוּדָה
  choice: యూదాపై
  rationale: עַל అనే ఉపసర్గ ఇక్కడ యూదాపై రాజ్యాధికారాన్ని సూచిస్తుంది; ‘యూదాపై’ మూలానికి సన్నిహితంగాను తెలుగులో సహజంగాను ఉంది.
