translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన చారిత్రక వచనశైలిని ఉపయోగించాం. మూలంలోని రాజ్యసంవత్సర సూత్రాన్ని సహజ తెలుగు క్రమంలో అమర్చాం; పాఠభేదం కాకపోయినా నామరూప భేదాన్ని పాదసూచికలో వెల్లడించాం.
