  text: Then Yahweh appeared to Solomon a second time[a], as he had appeared to him at Gibeon.
translation:
  language: te
  text: అప్పుడు యాహ్వే సొలొమోనుకు రెండోసారి ప్రత్యక్షమయ్యాడు, గిబియోనులో అతనికి ప్రత్యక్షమైనట్లే.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרָא
  choice: ప్రత్యక్షమయ్యాడు
  rationale: ראה ధాతువు నిఫాల్ రూపం ఇక్కడ దేవుడు తనను ప్రత్యక్షపరచుకున్న సందర్భాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘ప్రత్యక్షమయ్యాడు’ సహజమైనదీ, మూలంలోని భావాన్ని నేరుగా తెలిపేదీ.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన వ్యక్తినామ రూపమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: שֵׁנִית
  choice: రెండోసారి
  rationale: ఈ క్రియావిశేషణం క్రమంలో ఇది రెండవ ప్రత్యక్షత అని స్పష్టంగా సూచిస్తుంది. ‘మళ్లీ’ కంటే ‘రెండోసారి’ మూలంలోని సంఖ్యాత్మక స్పష్టతను నిలుపుతుంది.
- source_word: כַּאֲשֶׁר
  choice: ప్రత్యక్షమైనట్లే
  rationale: మునుపటి గిబియోను ప్రత్యక్షతతో పోలికను సహజమైన తెలుగు తులనాత్మక నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: נִרְאָה
  choice: ప్రత్యక్షమైన
  rationale: ఇదీ ראה ధాతువు నిఫాల్ రూపమే. తెలుగు సందర్భం దీనిని ముందుగా జరిగిన సంఘటనగా సహజంగానే తెలియజేస్తుంది.
- source_word: אֵלָיו
  choice: అతనికి
  rationale: אֶל + సర్వనామ ప్రత్యయం ఇక్కడ సంబంధాత్మక దిశను సూచిస్తుంది; ‘అతనికి’ దానిని అతివ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
- source_word: בְּגִבְעוֹן
  choice: గిబియోనులో
  rationale: בְ ఉపసర్గ సూచించే స్థలాన్ని తెలుగులో సహజమైన స్థానవిభక్తితో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. బిరుదైన ‘ప్రభువు’తో దాన్ని భర్తీ చేయకుండా పేరుగానే ఉంచడం మూలపాఠానికి దగ్గరగా ఉంటుంది.
- issue: దైవ ప్రత్యక్షతను తెలిపే נִרְאָה భావం
  choice: ప్రత్యక్షమయ్యాడు
  alternative: కనిపించాడు / తనను వెల్లడించుకున్నాడు
  rationale: ‘ప్రత్యక్షమయ్యాడు’ దర్శనీయ లేదా స్పష్టమైన దైవ ప్రత్యక్షతను తెలియజేస్తూనే, అది ఏ రూపంలో జరిగిందో మూలం చెప్పనిదాన్ని అదనంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు సులభమైన శైలిని అనుసరించాం. మూలంలోని రెండవ ప్రత్యక్షత అనే నిర్దిష్టతను ప్రధాన పాఠంలో ఉంచి, సహజ ప్రత్యామ్నాయమైన ‘మళ్లీ’ని పాదటిప్పణిలో ఇచ్చాం.
