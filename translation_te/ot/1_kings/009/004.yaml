  edition: WLC
  text: וְ/אַתָּ֞ה אִם תֵּלֵ֣ךְ לְ/פָנַ֗/י כַּ/אֲשֶׁ֨ר הָלַ֜ךְ דָּוִ֤ד אָבִ֨י/ךָ֙ בְּ/תָם לֵבָ֣ב וּ/בְ/יֹ֔שֶׁר לַ/עֲשׂ֕וֹת כְּ/כֹ֖ל אֲשֶׁ֣ר צִוִּיתִ֑י/ךָ חֻקַּ֥/י וּ/מִשְׁפָּטַ֖/י תִּשְׁמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/004.yaml
  text: And as for you[a], if you walk before me as David your father walked, with integrity of heart and with uprightness, doing according to all that I have commanded you, and if you keep my statutes and my judgments[b],
translation:
  language: te
  text: నీవైతే, నీ తండ్రి దావీదు నడుచుకున్నట్లుగా హృదయ సమగ్రతతో[a], నిజాయితీతో నా సన్నిధిలో నడుచుకుంటూ, నేను నీకు ఆజ్ఞాపించినదంతా చేసి, నా కట్టడాలను, నా న్యాయవిధులను[b] పాటిస్తే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సంపూర్ణ హృదయంతో.” హీబ్రూ పదం పాపరహిత స్థితిని తప్పనిసరిగా సూచించదు; హృదయపూర్వక సమగ్రతను, నిబద్ధతను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నా శాసనాలను, నా న్యాయవిధులను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: నీవైతే
  rationale: ప్రత్యక్ష సంబోధనలోని స్వల్ప ఉద్ఘాటనను, ముందున్న సందర్భంతో వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תֵּלֵךְ לְפָנַי
  choice: నా సన్నిధిలో నడుచుకుంటూ
  rationale: దేవుని సమక్షంలో జీవించడం, ప్రవర్తించడం అనే నిబంధనాత్మక రూపకాన్ని నిలుపుతుంది; కేవలం శారీరక నడకగా అపార్థం కాకుండా ‘నడుచుకుంటూ’ సహజంగా ఉంది.
- source_word: כַּאֲשֶׁר הָלַךְ דָּוִד אָבִיךָ
  choice: నీ తండ్రి దావీదు నా సన్నిధిలో నడుచుకున్నట్లుగా
  rationale: దావీదు జీవన విధానంతో చేయబడిన పోలికను, ముందున్న ‘నడుచు’ క్రియతో సమాంతరతను కాపాడుతుంది.
- source_word: בְּתָם לֵבָב
  choice: హృదయ సమగ్రతతో
  rationale: తప్పులేని సంపూర్ణతకన్నా హృదయపూర్వకమైన సంపూర్ణ నిబద్ధత, చిత్తశుద్ధి అనే భావాన్ని ‘సమగ్రత’ తెలియజేస్తుంది.
- source_word: וּבְיֹשֶׁר
  choice: యథార్థతతో
  rationale: నైతిక సూటితనం, నిజాయితీతో కూడిన ప్రవర్తన అనే భావాన్ని గౌరవప్రదమైన, అర్థమయ్యే తెలుగులో అందిస్తుంది.
- source_word: לַעֲשׂוֹת כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: నేను నీకు ఆజ్ఞాపించినదంతా చేసి
  rationale: ఆజ్ఞాపించిన సమస్తాన్ని ఆచరించాలనే సమగ్ర భావాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో నిలుపుతుంది.
- source_word: חֻקַּי
  choice: నా కట్టడలను
  rationale: నిబంధనాత్మక, స్థిరమైన ఆదేశాలను సూచిస్తూ, తరువాతి משפטים పదంతో ఉన్న పదభేదాన్ని కాపాడుతుంది.
- source_word: וּמִשְׁפָּטַי
  choice: నా న్యాయవిధులను
  rationale: న్యాయపరమైన నిర్ణయాలు లేదా విధులను సూచించే మూలపద భావాన్ని నిలుపుతూ ‘కట్టడలు’ నుంచి వేరుగా ఉంచుతుంది.
- source_word: תִּשְׁמֹר
  choice: పాటిస్తే
  rationale: నిబంధన సందర్భంలో ‘కాపాడు/గమనించు’ అనే మూలభావం ఆజ్ఞలను ఆచరించి అనుసరించడాన్ని సూచిస్తుంది; తెలుగులో ‘పాటిస్తే’ సహజం.
theological_decisions:
- issue: దావీదు మాదిరి స్వభావాన్ని ఎలా వర్ణించాలి
  choice: ‘హృదయ సమగ్రతతో, యథార్థతతో’ అని అనువదించడం
  alternative: ‘నిర్దోషమైన హృదయంతో’ అని అనువదించడం
  rationale: ఈ వాక్యం దావీదును నిబంధనకు నమ్మకమైన ఆదర్శంగా చూపుతుంది; అతడు ఏ పాపమూ చేయని పరిపూర్ణుడు అని చెప్పదు. ‘సమగ్రత’ ప్రశంసాత్మక భావాన్ని ఉంచుతూ పాపరహిత పరిపూర్ణతను అనవసరంగా దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ షరతు వాక్యం తదుపరి వచనంలో పూర్తవుతున్నందున చివర కామాను ఉంచాం. ‘నా సన్నిధిలో నడుచు’ అనే బైబిలీయ రూపకాన్ని సహజ తెలుగు క్రియారూపంతో నిలిపాం.
