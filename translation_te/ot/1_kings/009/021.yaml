source:
  edition: WLC
  text: בְּנֵי/הֶ֗ם אֲשֶׁ֨ר נֹתְר֤וּ אַחֲרֵי/הֶם֙ בָּ/אָ֔רֶץ אֲשֶׁ֧ר לֹֽא יָכְל֛וּ בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/הַֽחֲרִימָ֑/ם וַ/יַּעֲלֵ֤/ם שְׁלֹמֹה֙ לְ/מַס עֹבֵ֔ד עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/021.yaml
  text: their children who were left after them in the land[a], whom the sons of Israel had not been able to devote to destruction—Solomon conscripted them for forced labor, to this day.
translation:
  language: te
  text: వారి తరువాత దేశంలో మిగిలిపోయిన వారి సంతతివారిని—ఇశ్రాయేలీయులు నిర్మూలనకు అంకితం చేయలేకపోయిన వారిని[a]—సొలొమోను నేటివరకు బలవంతపు శ్రమకు నియమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘నిర్మూలనకు అంకితం చేయడం’; ప్రత్యామ్నాయంగా, ‘నిషేధం కింద ఉంచడం’ లేదా ‘పూర్తిగా నిర్మూలించడం.’ ఈ క్రియ ప్రజలను లేదా వస్తువులను חֵרֶם కింద ఉంచడాన్ని సూచిస్తుంది—అంటే తీర్పు కోసం తిరుగులేని విధంగా అంకితం చేయడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵיהֶם
  choice: వారి సంతతివారిని
  rationale: బహువచనంలోని בֵּן ఇక్కడ కేవలం కుమారులను కాక, మునుపటి తరాల తరువాత మిగిలిన వారి సంతతిని సూచిస్తుంది. ‘సంతతివారు’ లింగపరంగా అనవసరమైన పరిమితిని కలిగించదు.
- source_word: נֹתְרוּ אַחֲרֵיהֶם
  choice: వారి తరువాత మిగిలిన
  rationale: ఈ పదబంధం ముందు తరాల తరువాత దేశంలో మిగిలి ఉన్నవారనే ఫలితాత్మక, కాలసంబంధ భావాన్ని నిలుపుతుంది.
- source_word: בָּאָרֶץ
  choice: దేశంలో
  rationale: ఈ చారిత్రక సందర్భంలో אֶרֶץ కనాను/ఇశ్రాయేలు దేశాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘దేశం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: לֹא יָכְלוּ ... לְהַחֲרִימָם
  choice: నిర్మూలనకు అంకితం చేయలేకపోయిన
  rationale: החרים లో నాశనం చేయడం మాత్రమే కాక, తీర్పు కింద తిరుగులేని విధంగా అంకితం చేయడం అనే భావమూ ఉంది. ఈ అనువాదం రెండు పార్శ్వాలనూ నిలుపుతుంది.
- source_word: וַיַּעֲלֵם
  choice: నియమించాడు
  rationale: לְמַס עֹבֵד తో కలిసిన హిఫిల్ రూపం వారిని అధికారికంగా నిర్బంధ శ్రమకు పెట్టడం లేదా నియమించడం అనే పరిపాలనా చర్యను తెలియజేస్తుంది.
- source_word: לְמַס עֹבֵד
  choice: వెట్టిచాకిరి చేసే వారిగా
  rationale: מַס עֹבֵד బలవంతంగా విధించే శ్రమసేవను సూచిస్తుంది. ‘వెట్టిచాకిరి’ సాధారణ తెలుగు పాఠకులకు స్పష్టంగా ఉండి, వారి చట్టపరమైన స్థితిని ‘బానిసలు’ అని అతిగా నిర్ధారించదు.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటివరకు
  rationale: హీబ్రూ కాలసూచక సూత్రానికి సహజమైన, సంక్షిప్త తెలుగు సమానం.
theological_decisions:
- issue: ఆక్రమణ/తీర్పు సందర్భంలో החרים పదం అనువాదం
  choice: నిర్మూలనకు అంకితం చేయడం
  alternative: పూర్తిగా నిర్మూలించడం; నిషేధానికి గురిచేయడం
  rationale: మూలపదంలో నాశనమూ, దేవుని తీర్పుకు తిరుగులేని విధంగా అప్పగించడమూ మిళితమై ఉన్నాయి. ఎంపిక చేసిన రూపం దానిని కేవలం సైనిక హత్యగా తగ్గించకుండా, సాంకేతిక పదజాలంతో మరుగుపరచకుండా ఆ ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. మూలంలోని పొడవైన సంబంధవాక్యాన్ని స్పష్టత కోసం ‘అంటే’తో అనుసంధానించాం; అయితే భావసంబంధాన్ని మార్చలేదు. ‘ఇశ్రాయేలు కుమారులు’ అనే పదక్షర రూపానికి బదులుగా సహజమైన ‘ఇశ్రాయేలీయులు’ వాడాం.
