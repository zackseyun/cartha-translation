source:
  edition: WLC
  text: וַ/יְהִי֙ כְּ/כַלּ֣וֹת שְׁלֹמֹ֔ה לִ/בְנ֥וֹת אֶת בֵּית יְהוָ֖ה וְ/אֶת בֵּ֣ית הַ/מֶּ֑לֶךְ וְ/אֵת֙ כָּל חֵ֣שֶׁק שְׁלֹמֹ֔ה אֲשֶׁ֥ר חָפֵ֖ץ לַ/עֲשֽׂוֹת־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/001.yaml
  text: And it happened[a], when Solomon had finished building the house of Yahweh and the king’s house, and all that Solomon desired to make,
translation:
  language: te
  text: 'సొలొమోను యాహ్వే మందిరాన్నీ రాజభవనాన్నీ కట్టడం, తాను చేయాలని కోరుకున్నదంతా[a] చేయడం ముగించినప్పుడు, ఇలా జరిగింది:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సొలొమోను కోరిక అంతా”; లేదా, “సొలొమోను చేయాలని కోరుకున్న ప్రతి కార్యం.”
    reason: హీబ్రూ כָּל־חֵשֶׁק (‘అన్ని కోరిక/కోరుకున్నది’) పదబంధంలోని నామవాచక మరియు ప్రాజెక్టు-సంబంధిత సాధ్యార్థాలను నిలుపుతుంది.
lexical_decisions:
- source_word: וַיְהִי
  choice: ఇలా జరిగింది
  rationale: కొత్త కథన ఘట్టాన్ని పరిచయం చేసే హీబ్రూ వయిక్తోల్ రూపాన్ని సహజమైన ఆధునిక తెలుగులో చూపుతుంది.
- source_word: כְּכַלּוֹת
  choice: ముగించినప్పుడు
  rationale: כְּ తో కూడిన infinitive construct కాలసంబంధ పరిస్థితిని సూచిస్తుంది; తెలుగులో ‘ముగించినప్పుడు’ సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: לִבְנוֹת
  choice: కట్టించడం
  rationale: సొలొమోను స్వయంగా కట్టాడని కాక అతని ఆధ్వర్యంలో నిర్మాణం పూర్తయిందనే సహజ భావాన్ని తెలుగులో అందిస్తుంది.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఈ సందర్భంలో దేవాలయాన్ని సూచిస్తుంది; ‘మందిరం’ సాధారణ తెలుగు పాఠకునికి స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుగా మార్చకుండా తెలుగులో విస్తృతంగా పరిచితమైన రూపంలో ఉంచుతుంది.
- source_word: בֵּית הַמֶּלֶךְ
  choice: రాజభవనం
  rationale: అక్షరార్థం ‘రాజు ఇల్లు’; సందర్భానుసారంగా రాజు నివాస భవనాన్ని సహజ తెలుగులో ‘రాజభవనం’ అంటారు.
- source_word: כָּל חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָפֵץ לַעֲשׂוֹת
  choice: తాను చేయాలని కోరుకున్నదంతటినీ
  rationale: חֵשֶׁק మరియు חָפֵץ లోని కోరిక భావాన్ని నిలుపుతూ, నిర్మాణాలు లేదా కార్యాలు అని అనవసరంగా నిర్దిష్టం చేయకుండా సహజంగా అనువదిస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నిలుపుతుంది; ఆధునిక తెలుగు బైబిలు పాఠకులకు ‘యెహోవా’ రూపం విస్తృతంగా పరిచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యం తదుపరి వచనంలో పూర్తయ్యే నిర్మాణాన్ని తెలుగులో సూచించేందుకు చివర ద్విబిందువు వాడబడింది.
