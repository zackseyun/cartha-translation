  to: 'సొలొమోను యాహ్వే మందిరాన్నీ రాజభవనాన్నీ కట్టడం, తాను చేయాలని కోరుకున్నదంతా[a] చేయడం ముగించినప్పుడు, ఇలా జరిగింది:'
