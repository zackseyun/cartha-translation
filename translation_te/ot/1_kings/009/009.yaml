id: 1KI.9.9
reference: 1 Kings 9:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אָמְר֗וּ עַל֩ אֲשֶׁ֨ר עָזְב֜וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֗ם אֲשֶׁ֨ר הוֹצִ֣יא אֶת אֲבֹתָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יַּחֲזִ֨קוּ֙ בֵּ/אלֹהִ֣ים אֲחֵרִ֔ים ו/ישתחו לָ/הֶ֖ם וַ/יַּעַבְדֻ֑/ם עַל כֵּ֗ן הֵבִ֤יא יְהוָה֙ עֲלֵי/הֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/009.yaml
  text: And they will say[a], ‘Because they abandoned Yahweh their God, who brought their fathers out of the land of Egypt, and they held fast to other gods and bowed down to them and served them[c][b], therefore Yahweh brought all this disaster on them.’
translation:
  language: te
  text: 'అప్పుడు వారు ఇలా చెబుతారు: ‘ఎందుకంటే, ఐగుప్తు దేశం నుండి తమ పితరులను[a] బయటకు తీసుకొచ్చిన తమ దేవుడైన యాహ్వేను వారు విడిచిపెట్టి, ఇతర దేవుళ్లను అంటిపెట్టుకొని[b], వాటికి సాగిలపడి, వాటిని సేవించారు. అందుకే యాహ్వే ఈ విపత్తంతటినీ[c] వారి మీదికి రప్పించాడు.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పూర్వీకులను.” హీబ్రూ మూలంలో అక్షరార్థంగా “పితరులను” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఇతర దేవుళ్లను గట్టిగా పట్టుకున్నారు.”
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో అక్షరార్థంగా “ఈ కీడంతటినీ.” ఇక్కడ ఆ పదం నైతిక దుష్టత్వాన్ని కాక, తీర్పుగా వచ్చిన అనర్థాన్ని లేదా విపత్తును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: అప్పుడు వారు ఇలా చెబుతారు
  rationale: ముందటి వచనంలోని ప్రశ్నకు ప్రజలు చెప్పే సమాధానాన్ని సూచించే భవిష్యత్ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַל אֲשֶׁר
  choice: ఎందుకంటే
  rationale: తీర్పుకు కారణాన్ని పరిచయం చేసే హీబ్రూ పదబంధానికి సహజమైన కారణార్థక అనువాదం.
- source_word: עָזְבוּ
  choice: విడిచిపెట్టి
  rationale: యాహ్వే పట్ల నిబంధనా విశ్వాసాన్ని త్యజించిన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵיהֶם
  choice: తమ దేవుడైన
  rationale: ఇక్కడ బహువచన రూపం ఇశ్రాయేలు దేవుడైన యాహ్వేను ఏకవచనంలో సూచిస్తుంది; కర్తతో సంబంధాన్ని తెలుగులో ‘తమ’ సహజంగా చూపుతుంది.
- source_word: הוֹצִיא ... מֵאֶרֶץ מִצְרַיִם
  choice: ఐగుప్తు దేశం నుండి ... బయటకు తీసుకొచ్చిన
  rationale: నిర్గమన సూత్రవాక్యాన్ని మూలానికి దగ్గరగా, స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֲבֹתָם
  choice: తమ పితరులను
  rationale: హీబ్రూలోని పురుషలింగ పూర్వీకుల పదాన్ని నిలుపుతూ, బైబిలు సందర్భానికి తగిన గౌరవప్రదమైన తెలుగు వాడుకను ఎంచుకుంది.
- source_word: וַיַּחֲזִקוּ בֵּאלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లను అంటిపెట్టుకొని
  rationale: חזק ב యొక్క గట్టిగా పట్టుకోవడం లేదా నిష్ఠగా హత్తుకోవడం అనే భావాన్ని, విగ్రహారాధనా విధేయతను ముందుగానే కేవలం ‘ఆరాధించారు’గా మార్చకుండా వ్యక్తం చేస్తుంది.
- source_word: וישתחו לָהֶם
  choice: వాటికి సాగిలపడి
  rationale: శారీరకంగా వంగి నమస్కరించే క్రియను నిలుపుతుంది; తరువాతి ‘సేవించారు’తో ఉన్న పదభేదాన్ని కాపాడుతుంది.
- source_word: וַיַּעַבְדֻם
  choice: వాటిని సేవించారు
  rationale: విగ్రహారాధనా సందర్భంలోని మతపరమైన సేవను తెలుపుతూ, ముందున్న సాగిలపడటంతో కలిపివేయదు.
- source_word: עַל כֵּן
  choice: అందుకే
  rationale: కారణం నుండి పరిణామానికి మార్పును సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הֵבִיא ... אֵת כָּל הָרָעָה הַזֹּאת
  choice: ఈ విపత్తంతటినీ ... మీదికి రప్పించాడు
  rationale: רָעָה ఇక్కడ నైతిక దుష్టత్వం కాక తీర్పుగా వచ్చిన అనర్థాన్ని సూచిస్తుంది; ‘విపత్తు’ ఆ సందర్భార్థాన్ని స్పష్టంగా ఇస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత నిబంధనా నామాన్ని నేరుగా ఉపయోగిస్తుంది; కాబట్టి దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం జరిగింది.
- issue: אֲבֹתָם లోని లింగసూచక పూర్వీకుల పదం
  choice: తమ పితరులను
  alternative: తమ పూర్వీకులను
  rationale: మూలంలోని పురుషలింగ రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; విస్తృత పూర్వీకుల భావం సాధ్యమని పాదటిప్పణి తెలియజేస్తుంది.
- issue: רָעָה యొక్క సందర్భార్థం
  choice: విపత్తు
  alternative: కీడు
  rationale: ఇక్కడ దేవుడు తీసుకొచ్చిన న్యాయతీర్పు సంబంధమైన అనర్థమే ఉద్దేశం; నైతిక దుష్టత్వాన్ని దేవునికి ఆపాదిస్తున్నట్టు అనిపించకుండా సందర్భార్థాన్ని ఇస్తుంది, కాగా అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడింది. నిర్గమన సూత్రవాక్యం, మూడు విగ్రహారాధనా క్రియల క్రమం, కారణం–తీర్పు నిర్మాణం నిలుపబడ్డాయి. దైవ నామం ‘యాహ్వే’గా లిప్యంతరీకరించబడింది; నిజమైన పదార్థ ప్రత్యామ్నాయాలు పాదటిప్పణుల్లో ఉంచబడ్డాయి.
