  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఈ వచనం ముందటి వాక్యంలోని క్రియను కొనసాగించే జాబితా అయినప్పటికీ, స్వతంత్రంగా చదవదగినట్లుగా ‘కట్టించాడు’ జోడించబడింది. ‘గుర్రపు రౌతులు’ అనే రూపం రథదళం–అశ్వదళం మధ్య మూలభాషలోని భేదాన్ని నిలుపుతుంది.
