source:
  edition: WLC
  text: וְ/אֵ֨ת כָּל עָרֵ֤י הַֽ/מִּסְכְּנוֹת֙ אֲשֶׁ֣ר הָי֣וּ לִ/שְׁלֹמֹ֔ה וְ/אֵת֙ עָרֵ֣י הָ/רֶ֔כֶב וְ/אֵ֖ת עָרֵ֣י הַ/פָּרָשִׁ֑ים וְ/אֵ֣ת חֵ֣שֶׁק שְׁלֹמֹ֗ה אֲשֶׁ֤ר חָשַׁק֙ לִ/בְנ֤וֹת בִּ/ירוּשָׁלִַ֨ם֙ וּ/בַ/לְּבָנ֔וֹן וּ/בְ/כֹ֖ל אֶ֥רֶץ מֶמְשַׁלְתּֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/019.yaml
  text: also all the storage cities that belonged to Solomon[a], the chariot cities, the horsemen's cities, and whatever Solomon desired to build in Jerusalem, in Lebanon[c][b], and in all the land of his dominion.
translation:
  language: te
  text: సొలొమోనుకు చెందిన నిల్వ పట్టణాలన్నిటినీ[a], రథాల పట్టణాలను, అశ్వికుల పట్టణాలను[b], అలాగే యెరూషలేములో, లెబానోనులో, తన అధీనంలోని సమస్త భూభాగంలో సొలొమోను కట్టాలని కోరుకున్నవన్నిటినీ[c] కట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ధాన్యాగార పట్టణాలు,’ ‘సరఫరా పట్టణాలు.’ హీబ్రూ పదబంధం నిల్వలు లేదా సరఫరాల కోసం నియమించిన పట్టణాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘అశ్వికుల పట్టణాలు.’ హీబ్రూ పదం గుర్రాలనే కాక, మరింత నిర్దిష్టంగా గుర్రపు దళంలోని రౌతులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘సొలొమోను కోరుకున్న కోరికను, అతడు కట్టాలని కోరుకున్నది.’ ఒకే ధాతువుతో ఏర్పడిన ఈ హీబ్రూ పదప్రయోగం అతని బలమైన కోరికను ఉద్ఘాటిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמִּסְכְּנוֹת
  choice: నిల్వ పట్టణాలు
  rationale: ఈ పదబంధం వస్తువులు లేదా సరఫరాలు నిల్వచేయడానికి నియమించిన పట్టణాలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘నిల్వ పట్టణాలు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: אֲשֶׁר הָיוּ לִשְׁלֹמֹה
  choice: సొలొమోనుకు చెందిన
  rationale: హీబ్రూ నిర్మాణంలోని స్వామ్య లేదా కేటాయింపు భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עָרֵי הָרֶכֶב
  choice: రథాల పట్టణాలు
  rationale: రథదళాలు లేదా వాటి సంబంధిత సదుపాయాల కోసం ఏర్పాటు చేసిన పట్టణాలనే భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: עָרֵי הַפָּרָשִׁים
  choice: గుర్రపు రౌతుల పట్టణాలు
  rationale: פָּרָשִׁים సాధారణంగా గుర్రాలకంటే గుర్రమెక్కి పోరాడే రౌతులను సూచిస్తుంది; ‘గుర్రపు రౌతులు’ ఆ వ్యత్యాసాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָשַׁק
  choice: సొలొమోను తాను కోరుకున్నవన్నీ
  rationale: మూలంలోని ఒకే ధాతువుతో ఏర్పడిన నామవాచక-క్రియ పదప్రయోగాన్ని తెలుగులో సహజంగా కొంత ప్రతిబింబిస్తూ, దాని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: לִבְנוֹת
  choice: కట్టించాడు
  rationale: ఈ వాక్యం మునుపటి క్రియపై ఆధారపడిన కర్మల జాబితాగా ఉన్నందున, రాజు చేపట్టించిన నిర్మాణ కార్యాలను తెలుగులో సంపూర్ణ వాక్యంగా సహజంగా తెలియజేయడానికి కారణార్థక రూపం వాడబడింది.
- source_word: בִּירוּשָׁלִַם וּבַלְּבָנוֹן
  choice: యెరూషలేములో, లెబానోనులో
  rationale: రెండు ప్రదేశాలనూ సూటిగా స్థానార్థకంగా అనువదిస్తుంది; లెబానోను ఇక్కడ నిర్మాణ కార్యకలాపాలు జరిగిన ప్రాంతంగా గ్రహించబడుతుంది.
- source_word: בְּכֹל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: తన పరిపాలన కింద ఉన్న దేశమంతటిలో
  rationale: మూలంలోని భూభాగ భావాన్నీ, రాజాధికార భావాన్నీ ఆధునిక తెలుగులో స్పష్టంగా కలిపి తెలియజేస్తుంది.
