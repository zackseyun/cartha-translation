source:
  edition: WLC
  text: אֵ֣לֶּה שָׂרֵ֣י הַ/נִּצָּבִ֗ים אֲשֶׁ֤ר עַל הַ/מְּלָאכָה֙ לִ/שְׁלֹמֹ֔ה חֲמִשִּׁ֖ים וַ/חֲמֵ֣שׁ מֵא֑וֹת הָ/רֹדִ֣ים בָּ/עָ֔ם הָ/עֹשִׂ֖ים בַּ/מְּלָאכָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/023.yaml
  text: 'These were the chief officers of the deputies who were over the work for Solomon: five hundred and fifty[b][a], ruling over the people who were doing the work.'
translation:
  language: te
  text: సొలొమోను కోసం జరిగే పనికి పర్యవేక్షకులుగా నియమించబడిన అధికారుల[a] ప్రధానులు వీరే—ఐదువందల యాభై మంది. పని చేస్తున్న ప్రజలపై వారు అధికారం చెలాయించేవారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నియమిత పర్యవేక్షకుల”; హీబ్రూ పదం నియమించబడిన అధికారులను లేదా ఇతరులపై ఉంచబడినవారిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పని చేస్తున్న ప్రజలను పర్యవేక్షించేవారు”; ఇక్కడి హీబ్రూ క్రియ పరిపాలించడం, బాధ్యత వహించడం లేదా అధికారం చెలాయించడం అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַנִּצָּבִים
  choice: నియమించబడిన అధికారుల ప్రధానులు
  rationale: ఈ నిర్మాణం ‘నియమిత అధికారుల/పర్యవేక్షకుల ప్రధానులు’ అనే అధికార వ్యవస్థను సూచిస్తుంది. ‘అధికారుల ప్రధానులు’ పరిపాలనా సందర్భానికి సహజంగా సరిపోతూ, సైనిక భావాన్ని అనవసరంగా కలిగించదు.
- source_word: אֲשֶׁר עַל הַמְּלָאכָה לִשְׁלֹמֹה
  choice: సొలొమోను కోసం జరిగే పనికి పర్యవేక్షకులుగా
  rationale: ‘పనిమీద ఉన్నవారు’ అనే హీబ్రూ భావాన్ని ఆధునిక తెలుగులో సహజంగా ‘పనికి పర్యవేక్షకులుగా’ అని వ్యక్తం చేసింది; לִשְׁלֹמֹה లోని సేవా/సంబంధ భావాన్ని ‘సొలొమోను కోసం’ నిలుపుతుంది.
- source_word: חֲמִשִּׁים וַחֲמֵשׁ מֵאוֹת
  choice: ఐదువందల యాభై మంది
  rationale: హీబ్రూ సంఖ్యకు స్పష్టమైన, సాధారణ తెలుగు రూపం; వ్యక్తులను లెక్కిస్తున్నందున ‘మంది’ చేర్చబడింది.
- source_word: הָרֹדִים
  choice: అధికారం చెలాయించేవారు
  rationale: רדה అనే క్రియలోని పరిపాలించడం, అధికారం కలిగి ఉండడం అనే బలమైన భావాన్ని నిలుపుతుంది; కేవలం ‘పర్యవేక్షించేవారు’ కంటే మూలపదానికి దగ్గరగా ఉంది.
- source_word: בָּעָם הָעֹשִׂים בַּמְּלָאכָה
  choice: పని చేస్తున్న ప్రజలపై
  rationale: עָם ను సంకుచితం చేసి ‘కూలీలు’ అని చేయకుండా ‘ప్రజలు’గా ఉంచి, తరువాతి కృదంత వాక్యభాగం వారిని పని చేస్తున్నవారిగా నిర్దిష్టం చేయనిచ్చింది.
