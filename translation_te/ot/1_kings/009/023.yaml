  source_fidelity: The Telugu preserves the Hebrew administrative hierarchy in שָׂרֵי הַנִּצָּבִים as “నియమించబడిన అధికారుల ప్రధానులు,” retains their relation to Solomon’s work, gives the number accurately, and represents הָרֹדִים with the appropriately strong “అధికారం చెలాయించేవారు.” “పని చేస్తున్న ప్రజలు” preserves עָם without prematurely narrowing it to forced laborers or laborers.
  naturalness: 'The wording is clear, modern standard Telugu, and suits an administrative narrative. The division into two sentences is natural and does not obscure the referent: the 550 chief officials exercised authority over the people doing the work.'
