translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే పరిపాలనా పదజాలం వాడబడింది. హీబ్రూ వాక్యంలోని అధికార శ్రేణి మరియు רדה క్రియలోని బలాన్ని నిలుపుతూ, అసహజమైన పదానుపద నిర్మాణాన్ని నివారించాం.
