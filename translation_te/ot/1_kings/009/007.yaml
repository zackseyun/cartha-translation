source:
  edition: WLC
  text: וְ/הִכְרַתִּ֣י אֶת יִשְׂרָאֵ֗ל מֵ/עַ֨ל פְּנֵ֤י הָ/אֲדָמָה֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם וְ/אֶת הַ/בַּ֨יִת֙ אֲשֶׁ֣ר הִקְדַּ֣שְׁתִּי לִ/שְׁמִ֔/י אֲשַׁלַּ֖ח מֵ/עַ֣ל פָּנָ֑/י וְ/הָיָ֧ה יִשְׂרָאֵ֛ל לְ/מָשָׁ֥ל וְ/לִ/שְׁנִינָ֖ה בְּ/כָל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/007.yaml
  text: then I will cut off Israel from the face of the land that I have given them[a], and the house that I have consecrated for my name I will cast out from before my face[d][c][b], and Israel will become a proverb and a taunt among all peoples.
translation:
  language: te
  text: అప్పుడు నేను ఇశ్రాయేలును వారికి ఇచ్చిన దేశం మీదనుండి నరికివేస్తాను. నా నామం కొరకు నేను ప్రతిష్ఠించిన మందిరాన్ని[a] నా సన్నిధి నుండి తొలగిస్తాను[b]. ఇశ్రాయేలు సమస్త ప్రజల మధ్య సామెతగా, ఎగతాళి మాటగా[c] మారుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘ఇల్లు’; ఇక్కడ దేవాలయం ఉద్దేశించబడింది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నా ముఖం ఎదుటనుండి పంపివేస్తాను.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘నిందామాటగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: నిర్మూలిస్తాను
  rationale: హిఫీల్ రూపంలోని כרת ఇక్కడ తొలగించడం లేదా నరికివేయడం అనే తీర్పు భావాన్ని వ్యక్తం చేస్తుంది. తెలుగులో ‘నిర్మూలిస్తాను’ తీవ్రతను నిలుపుతుంది; అయితే సందర్భం దేశం నుండి తొలగింపును సూచిస్తున్నందున సంపూర్ణ జాతి వినాశనాన్ని తప్పనిసరిగా నిర్ధారించదు.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: దేశం మీదనుండి
  rationale: అక్షరార్థంలోని ‘నేల ముఖం మీదనుండి’ అనే చిత్రణ తెలుగులో అసహజంగా ఉంటుంది. తరువాతి సంబంధ వాక్యం ఇది ఇశ్రాయేలుకు ఇచ్చిన దేశమని స్పష్టం చేస్తుంది కాబట్టి సహజమైన రూపాన్ని ఎంచుకున్నాం.
- source_word: הַבַּיִת
  choice: ఈ మందిరాన్ని
  rationale: హీబ్రూలో ‘ఇల్లు’ ఉన్నప్పటికీ సందర్భంలో సొలొమోను నిర్మించిన దేవాలయమే ఉద్దేశం. ఆధునిక తెలుగు పాఠకునికి ‘మందిరం’ స్పష్టంగా, సహజంగా ఉంటుంది; మూలపదాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: הִקְדַּשְׁתִּי
  choice: ప్రతిష్ఠించిన
  rationale: קדשׁ హిఫీల్ దేవుని నామం కోసం పవిత్రంగా ప్రత్యేకపరచడాన్ని సూచిస్తుంది. భవనానికి సంబంధించి ‘ప్రతిష్ఠించిన’ సహజమైన, గౌరవప్రదమైన తెలుగు.
- source_word: לִשְׁמִי
  choice: నా నామం కోసం
  rationale: రాజులు గ్రంథంలో ముఖ్యమైన ‘నా నామం కోసం’ అనే హీబ్రూ నుడికారాన్ని వివరణాత్మకంగా మార్చకుండా నిలిపాం.
- source_word: אֲשַׁלַּח מֵעַל פָּנָי
  choice: నా సన్నిధి నుండి తొలగిస్తాను
  rationale: שׁלח అంటే పంపివేయడం లేదా తొలగించడం; ‘నా ముఖం ఎదుటనుండి’ అనే నుడికారం దేవుని సన్నిధి లేదా ఆమోదం నుండి తొలగింపును సూచిస్తుంది. తెలుగు సహజత్వం కోసం భావసమాన రూపం వాడాం.
- source_word: לְמָשָׁל וְלִשְׁנִינָה
  choice: సామెతగా, ఎగతాళి మాటగా
  rationale: మొదటి పదం ఉదాహరణగా చెప్పబడే సామెతను, రెండవది అపహాస్యంగా పలికే మాటను సూచిస్తుంది. రెండు పదాల మధ్య తేడాను తెలుగులో నిలిపాం.
- source_word: בְּכָל הָעַמִּים
  choice: సమస్త ప్రజల మధ్య
  rationale: עַמִּים అనేక జాతుల లేదా ప్రజాసమూహాల భావాన్ని ఇస్తుంది; ‘ప్రజల మధ్య’ ఆధునిక జాతీయ రాజ్యాల భావాన్ని అనవసరంగా రుద్దదు.
theological_decisions:
- issue: ఒడంబడిక తీర్పు సంపూర్ణ వినాశనమా, దేశం నుండి తొలగింపా?
  choice: ఇశ్రాయేలును ... దేశం మీదనుండి నిర్మూలిస్తాను
  alternative: ఇశ్రాయేలును ... దేశం నుండి నరికివేస్తాను
  rationale: כרת యొక్క తీవ్ర తీర్పు భావాన్ని నిలుపుతూ, ‘దేశం మీదనుండి’ అనే పరిధి దాన్ని భూభాగం నుండి తొలగింపుతో అనుసంధానిస్తుంది. జాతి సంపూర్ణంగా అంతమవుతుందని పాఠం చెప్పనిదాన్ని అనువాదం జోడించదు.
- issue: הַבַּיִת ను అక్షరార్థంగా ‘ఇల్లు’ అనాలా, సందర్భానుసారం ‘మందిరం’ అనాలా?
  choice: మందిరం
  alternative: ఇల్లు
  rationale: మూలంలో ‘ఇల్లు’ ఉన్నప్పటికీ ఈ సందర్భంలో దేవాలయమే స్పష్టమైన సూచ్యార్థం. ప్రధాన పాఠంలో స్పష్టతను, పాదటిప్పణిలో మూలరూపాన్ని సంరక్షించాం.
- issue: దేవుని ‘ముఖం’ అనే మానవరూపకాన్ని ఎలా అందించాలి?
  choice: నా సన్నిధి నుండి
  alternative: నా ముఖం ఎదుటనుండి
  rationale: తెలుగులో ‘నా ముఖం ఎదుటనుండి’ కృత్రిమంగా, కొంత అస్పష్టంగా ఉంటుంది. ‘సన్నిధి’ నుడికారపు భావాన్ని సహజంగా తెలియజేస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని తీర్పు తీవ్రతను నిలుపుతూ, తెలుగులో అసహజమైన శరీరరూపకాలను అవసరమైన చోట సహజ నుడికారంతో అందించాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
