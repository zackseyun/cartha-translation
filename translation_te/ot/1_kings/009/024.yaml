  edition: WLC
  text: אַ֣ךְ בַּת פַּרְעֹ֗ה עָֽלְתָה֙ מֵ/עִ֣יר דָּוִ֔ד אֶל בֵּיתָ֖/הּ אֲשֶׁ֣ר בָּֽנָה לָ֑/הּ אָ֖ז בָּנָ֥ה אֶת הַ/מִּלּֽוֹא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/024.yaml
  text: But Pharaoh’s daughter went up from the City of David to her house that he had built for her[a]; then he built the Millo.
translation:
  language: te
  text: అయితే ఫరో కుమార్తె దావీదు నగరం నుండి సొలొమోను ఆమె కోసం కట్టిన ఇంటికి పైకి వెళ్లింది. ఆ తర్వాత అతడు మిల్లోను[a] కట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పూడిక నిర్మాణం’ లేదా ‘మెట్లలాంటి మట్టినిర్మాణాలు.’ హీబ్రూ ‘మిల్లో’ బహుశా కోటరక్షణకు సంబంధించిన పూడికను లేదా ఆధారంగా ఉండే మట్టినిర్మాణాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: అయితే
  rationale: ఈ సందర్భంలో చుట్టుపక్కల కథనానికి భేదం లేదా మలుపు సూచించే అవ్యయంగా సహజమైన తెలుగులో ఇచ్చాం.
- source_word: בַּת פַּרְעֹה
  choice: ఫరో కుమార్తె
  rationale: హీబ్రూ సంబంధబంధాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָלְתָה
  choice: వెళ్లింది
  rationale: మూలంలో అక్షరార్థంగా ‘పైకి వెళ్లింది’ ఉన్నప్పటికీ, దావీదు నగరం నుండి ఆమె ఇంటికి జరిగిన స్థలమార్పును సహజ తెలుగులో తెలిపాం; భౌగోళిక ఎత్తు ఇక్కడ నిర్ధారితం కాదు.
- source_word: מֵעִיר דָּוִד
  choice: దావీదు నగరం నుండి
  rationale: స్థలనామాన్ని అలాగే నిలుపుతూ מן ఉపసర్గను ‘నుండి’గా అనువదించాం.
- source_word: אֶל בֵּיתָהּ
  choice: ఆమె కోసం కట్టించిన ఇంటికి
  rationale: בַּיִת‌ను వ్యాఖ్యానాత్మకమైన ‘రాజభవనం’గా కాక ‘ఇల్లు’గా ఉంచాం; గమ్యాన్ని తెలుగులో ‘ఇంటికి’తో తెలిపాం.
- source_word: אֲשֶׁר בָּנָה לָהּ
  choice: సొలొమోను ఆమె కోసం కట్టించిన
  rationale: హీబ్రూలో కర్త అంతర్లీనంగా ఉన్నా సందర్భం సొలొమోనును సూచిస్తుంది; తెలుగులో అస్పష్టత రాకుండా పేరు చేర్చాం. రాజు ఇతరులచేత నిర్మింపజేయడాన్ని సహజంగా ‘కట్టించిన’ అని ఇచ్చాం.
- source_word: אָז
  choice: ఆ తర్వాత
  rationale: కథనంలోని కాలక్రమాన్ని సహజ తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: בָּנָה
  choice: అతడు ... కట్టించాడు
  rationale: సాధారణ నిర్మాణ క్రియను రాజసంబంధ సందర్భంలో సహజమైన causative రూపంతో ఇచ్చాం; ‘కట్టించడం మొదలుపెట్టాడు’ అనే అదనపు భావాన్ని చేర్చలేదు.
- source_word: הַמִּלּוֹא
  choice: మిల్లోను
  rationale: దాని ఖచ్చితమైన నిర్మాణ స్వరూపం వివాదాస్పదం కనుక ఊహాత్మక అర్థాన్ని ప్రధాన పాఠ్యంలో పెట్టకుండా సాంకేతిక స్థలనామాన్ని లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన కథనశైలి. వివాదాస్పద సాంకేతిక పదాన్ని లిప్యంతరీకరించి అడుగుసూచనలో సాధ్యమైన అర్థాలు ఇచ్చాం.
