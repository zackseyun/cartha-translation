translation_notes:
  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. మూలంలోని సంక్షిప్త కథన శైలిని, పదక్రమాన్ని సాధ్యమైనంతవరకు కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యే రూపం వాడబడింది.
