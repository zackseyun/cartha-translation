  yaml_path: translation/ot/1_kings/009/014.yaml
  text: And Hiram sent to the king one hundred and twenty talents of gold[a][b].
translation:
  language: te
  text: హీరాము రాజుకు నూట ఇరవై తలాంతుల బంగారాన్ని[a][b] పంపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: తలాంతు అనేది పెద్ద తూకపు ప్రమాణం; ఇక్కడ నూట ఇరవై తలాంతుల బరువుగల బంగారం అని భావం.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘సొలొమోను రాజుకు’; హీబ్రూ మూలంలో కేవలం ‘రాజుకు’ అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపించాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తూ సాధారణ భూతకాల భావాన్ని ఇస్తుంది; సందర్భంలో ఇది సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: חִירָם
  choice: హీరాము
  rationale: హీబ్రూ పేరును తెలుగులో సుపరిచితమైన బైబిలు నామరూపానికి దగ్గరగా లిప్యంతరీకరించింది.
- source_word: לַמֶּלֶךְ
  choice: రాజుకు
  rationale: హీబ్రూలో ఉన్న నిర్దిష్టమైన ‘రాజుకు’ అనే పదబంధాన్ని కాపాడుతుంది; సందర్భం సొలొమోనును సూచించినా ప్రధాన వాక్యంలో పేరు చేర్చలేదు.
- source_word: מֵאָה וְעֶשְׂרִים
  choice: నూట ఇరవై
  rationale: సంఖ్యకు స్పష్టమైన, సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: כִּכַּר
  choice: తలాంతులు
  rationale: పురాతన భారీ తూకపు ప్రమాణానికి సంప్రదాయ బైబిలు పదాన్ని వాడి, సంఖ్యకు అనుగుణంగా బహువచనం ఇచ్చింది.
- source_word: זָהָב
  choice: బంగారం
  rationale: హీబ్రూ నామవాచకానికి సాధారణ ఆధునిక తెలుగు సమానార్థకం; తలాంతులలో కొలవబడిన పదార్థాన్ని సూచిస్తుంది.
