revisions:
- from: అప్పుడు నీ తండ్రి దావీదుతో, ‘ఇశ్రాయేలు సింహాసనం మీద నుండి నీ వంశానికి చెందిన పురుషుడు తొలగిపోడు’ అని నేను చెప్పినట్లే, ఇశ్రాయేలు మీద నీ రాజ్య సింహాసనాన్ని శాశ్వతంగా స్థిరపరుస్తాను.
  to: అప్పుడు నేను నీ రాజ్యపు సింహాసనాన్ని ఇశ్రాయేలుపై శాశ్వతంగా స్థిరపరుస్తాను; నీ తండ్రియైన దావీదు గురించి నేను చెప్పినట్లుగా, ‘నీ వంశానికి చెందిన ఒక పురుషుడు కూడా ఇశ్రాయేలు సింహాసనం మీద నుండి తొలగిపోడు’ అని చెప్పాను.
  rationale: The revision corrects the relational sense of ‘concerning David,’ retains the source’s establishment promise and enduring temporal expression, and renders the final negated assurance idiomatically while preserving its ‘cut off/from the throne’ imagery. No footnote is needed because the wording can carry the source sense without an explanatory gloss.
