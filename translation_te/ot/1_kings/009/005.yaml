id: 1KI.9.5
reference: 1 Kings 9:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/הֲקִ֨מֹתִ֜י אֶת כִּסֵּ֧א מַֽמְלַכְתְּ/ךָ֛ עַל יִשְׂרָאֵ֖ל לְ/עֹלָ֑ם כַּ/אֲשֶׁ֣ר דִּבַּ֗רְתִּי עַל דָּוִ֤ד אָבִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹֽא יִכָּרֵ֤ת לְ/ךָ֙ אִ֔ישׁ מֵ/עַ֖ל כִּסֵּ֥א יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/005.yaml
  text: then I will establish the throne of your kingdom over Israel forever, just as I spoke concerning David your father, saying, ‘A man of yours will not be cut off from the throne of Israel.’
translation:
  language: te
  text: అప్పుడు నేను నీ రాజ్యపు సింహాసనాన్ని ఇశ్రాయేలుపై శాశ్వతంగా స్థిరపరుస్తాను; నీ తండ్రియైన దావీదు గురించి నేను చెప్పినట్లుగా, ‘నీ వంశానికి చెందిన ఒక పురుషుడు కూడా ఇశ్రాయేలు సింహాసనం మీద నుండి తొలగిపోడు’ అని చెప్పాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: స్థిరపరుస్తాను
  rationale: హిఫీల్ రూపంలోని ‘నిలబెట్టడం/స్థాపించడం’ అనే భావాన్ని రాజ్య సింహాసనం సందర్భంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: כִּסֵּא מַמְלַכְתְּךָ
  choice: నీ రాజ్య సింహాసనం
  rationale: ‘నీ రాజ్యానికి చెందిన సింహాసనం’ అనే మూలపదబంధాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా నిలుపుతుంది.
- source_word: לְעֹלָם
  choice: శాశ్వతంగా
  rationale: కాలపరమైన దీర్ఘస్థితి లేదా నిత్యత్వాన్ని సూచించే మూలపదాన్ని వ్యాఖ్యానాత్మక పరిమితి లేకుండా అనువదిస్తుంది.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  choice: నీ వంశానికి చెందిన పురుషుడు తొలగిపోడు
  rationale: ‘నీకు చెందిన పురుషుడు తెగగొట్టబడడు/లేకుండా పోడు’ అనే హీబ్రూ నిర్మాణాన్ని తెలుగులో అర్థవంతంగా అందిస్తూ, రాజవంశ వారసత్వ సూచనను స్పష్టం చేస్తుంది.
- source_word: מֵעַל כִּסֵּא יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సింహాసనం మీద నుండి
  rationale: מֵעַל లోని ‘మీద నుండి’ అనే స్థానిక భావాన్ని కాపాడుతుంది; కేవలం ‘సింహాసనం మీద’ అని సులభీకరించదు.
theological_decisions:
- issue: దావీదీయ రాజవంశ వాగ్దానంలోని షరతు మరియు ‘శాశ్వతం’ యొక్క పరిధి
  choice: ‘శాశ్వతంగా’ అని నేరుగా ఉంచడం
  alternative: ‘ఎల్లకాలం’ లేదా చారిత్రక రాజవంశ కాలానికి పరిమితం చేసే వివరణ
  rationale: ఈ వచనంలోని לְעֹלָם ను వ్యాఖ్యానంతో పరిమితం చేయకుండా, దాని సహజమైన బలాన్ని మరియు సందర్భంలోని theological tension‌ను నిలుపుతుంది.
- issue: לֹא יִכָּרֵת לְךָ אִישׁ యొక్క రూపకం
  choice: ‘నీ వంశానికి చెందిన పురుషుడు తొలగిపోడు’
  alternative: ‘నీకు సింహాసనంపై కూర్చునే వారసుడు లేకుండా పోడు’
  rationale: మూలంలోని ‘తొలగించబడటం/తెగిపోవడం’ భావాన్ని నిలుపుతూ, ‘కూర్చునే వారసుడు’ అనే విస్తృత వివరణను ప్రధాన పాఠ్యంలోకి దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే రాజవాగ్దానానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని వాక్యక్రమాన్ని తెలుగులో సహజంగా మార్చినా, వాగ్దానం, దావీదుతో చెప్పిన మాట, సింహాసనం ‘మీద నుండి’ తొలగిపోకపోవడం అనే అంశాలు కాపాడబడ్డాయి.
