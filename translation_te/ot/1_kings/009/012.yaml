  yaml_path: translation/ot/1_kings/009/012.yaml
  text: So Hiram went out from Tyre to see the cities that Solomon had given him[a], but they were not pleasing in his eyes.
translation:
  language: te
  text: హీరాము తూరు నుండి బయలుదేరి, సొలొమోను తనకు ఇచ్చిన పట్టణాలను చూడడానికి వెళ్లాడు. అయితే అవి అతని దృష్టికి నచ్చలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అవి అతనికి నచ్చలేదు.” హీబ్రూలో అక్షరార్థంగా, “అవి అతని కళ్లలో సరైనవిగా లేవు”; సందర్భంలో, అవి అతనికి ఆమోదయోగ్యంగా లేవని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: బయలుదేరి ... వెళ్లాడు
  rationale: יצא అనే క్రియలో బయటకు వెళ్లడం/బయలుదేరడం అనే దిశాభావం ఉంది. తెలుగు కథనశైలిలో ‘బయలుదేరి ... వెళ్లాడు’ సహజంగా ఉండి ఆ భావాన్ని నిలుపుతుంది.
- source_word: מִצֹּר
  choice: తూరు నుండి
  rationale: מן మూలస్థానాన్ని సూచిస్తుంది; ‘తూరు నుండి’ భౌగోళిక బయలుదేరే స్థలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לִרְאוֹת
  choice: చూడడానికి
  rationale: ראה యొక్క సాధారణ అర్థం ‘చూడడం’. సందర్భంలో పరిశీలన భావం ఉండవచ్చుగానీ, మూలంలోని విస్తృతమైన అర్థాన్ని సంకుచితం చేయకుండా ‘చూడడానికి’ ఎంచుకోబడింది.
- source_word: הֶעָרִים
  choice: పట్టణాలను
  rationale: עיר పట్టణం లేదా నగరం అనే అర్థాలు కలిగి ఉంది. ఈ భౌగోళిక సందర్భంలో ఆధునిక తెలుగులో ‘పట్టణాలు’ సహజంగా ఉంది.
- source_word: אֲשֶׁר נָתַן לוֹ שְׁלֹמֹה
  choice: సొలొమోను తనకు ఇచ్చిన
  rationale: సంబంధ వాక్యం పట్టణాలను గుర్తిస్తుంది. ‘తనకు’ అనేది హీరామును స్పష్టంగా సూచిస్తూ తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉంటుంది; ఇచ్చిన కార్యం చూడటానికి ముందే జరిగింది.
- source_word: וְלֹא יָשְׁרוּ בְּעֵינָיו
  choice: అయితే అవి అతని దృష్టికి నచ్చలేదు
  rationale: ישר בעיני అనేది ఒకరి దృష్టిలో ఆమోదయోగ్యంగా లేదా సంతృప్తికరంగా ఉండడాన్ని తెలిపే నుడికారం. ‘అతని దృష్టికి నచ్చలేదు’ ఆ నుడికారంలోని దృష్టి-రూపకాన్ని కొంత నిలుపుతూ, నైతికంగా ‘సరైనవి కావు’ అనే అనవసర భావాన్ని నివారిస్తుంది.
