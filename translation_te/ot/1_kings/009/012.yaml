translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. హీబ్రూ నుడికారంలోని భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా అందిస్తూ, దాని అక్షరరూపాన్ని పాదటిప్పణిలో భద్రపరచాం. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
