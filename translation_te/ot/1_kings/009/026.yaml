source:
  edition: WLC
  text: וָ/אֳנִ֡י עָשָׂה֩ הַ/מֶּ֨לֶךְ שְׁלֹמֹ֜ה בְּ/עֶצְיֽוֹן גֶּ֨בֶר אֲשֶׁ֧ר אֶת אֵל֛וֹת עַל שְׂפַ֥ת יַם ס֖וּף בְּ/אֶ֥רֶץ אֱדֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/026.yaml
  text: King Solomon also built a fleet of ships at Ezion-geber[a], which is beside Eloth on the shore of the Red Sea, in the land of Edom.
translation:
  language: te
  text: సొలొమోను రాజు ఎదోము దేశంలో, ఎర్ర సముద్రం[a] ఒడ్డున ఏలోతు పక్కన ఉన్న ఎజ్యోను-గెబెరులో నౌకాదళాన్ని కూడా నిర్మించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: ‘రెల్ల సముద్రం’; సంప్రదాయంగా ‘ఎర్ర సముద్రం’ అని అనువదిస్తారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֳנִי
  choice: ఓడల సమూహాన్ని కూడా
  rationale: אֳנִי ఇక్కడ ఒక ఓడను మాత్రమే కాక, సందర్భానుసారంగా ఓడల సమూహాన్ని సూచిస్తుంది. వావ్ సంధానార్థాన్ని సహజమైన తెలుగులో ‘కూడా’ తెలియజేస్తుంది.
- source_word: עָשָׂה
  choice: నిర్మించాడు
  rationale: ఈ క్రియ సాధారణంగా ‘చేశాడు’ అని అర్థమైనా, ఓడల సందర్భంలో ‘నిర్మించాడు’ అనేది స్పష్టమైన, సహజమైన తెలుగు ప్రయోగం.
- source_word: בְּעֶצְיוֹן גֶּבֶר
  choice: ఎసోన్గెబెరులో
  rationale: స్థలనామాన్ని తెలుగు లిపిలో ధ్వన్యనుకరణ చేసి, בְּ ఉపసర్గను స్థానార్థక ‘లో’తో వ్యక్తం చేశాం.
- source_word: אֲשֶׁר אֶת אֵלוֹת
  choice: ఏలోతు పక్కన ఉన్న
  rationale: ఈ నిర్మాణం రెండు ప్రదేశాల సాన్నిహిత్యాన్ని సూచిస్తుంది; ‘పక్కన ఉన్న’ అనేది మూలంలోని సంబంధాన్ని సహజంగా, అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
- source_word: עַל שְׂפַת יַם סוּף
  choice: ఎర్ర సముద్రం ఒడ్డున
  rationale: שְׂפַת పదానికి ఇక్కడ ‘ఒడ్డు/తీరం’ అనే భావం. יַם סוּף‌కు సంప్రదాయంగా, ఈ భౌగోళిక సందర్భంలో సులభంగా గుర్తించదగిన ‘ఎర్ర సముద్రం’ వాడి, అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: ఎదోము దేశంలో
  rationale: ‘దేశం/భూభాగం’ అనే మూలపదాన్ని నిలుపుతూ భౌగోళిక ప్రాధాన్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
