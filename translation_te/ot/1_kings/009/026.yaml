translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. తెలుగు వాక్యప్రవాహం సహజంగా ఉండేందుకు భౌగోళిక వివరాలను ప్రధాన క్రియకు ముందు అమర్చాం; మూలంలోని అన్ని స్థలసంబంధ వివరాలను నిలిపాం.
