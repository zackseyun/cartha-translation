  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר מָ֚ה הֶ/עָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁר נָתַ֥תָּה לִּ֖/י אָחִ֑/י וַ/יִּקְרָ֤א לָ/הֶם֙ אֶ֣רֶץ כָּב֔וּל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/013.yaml
  text: And he said[a], “What are these cities that you have given me, my brother?” So he called them the land of Cabul to this day.
translation:
  language: te
  text: అతడు, “నా సహోదరా, నీవు నాకు ఇచ్చిన ఈ పట్టణాలు ఎలాంటివి?” అన్నాడు. అప్పుడు అతడు వాటికి ‘కాబూలు దేశం’[a] అని పేరు పెట్టాడు; ఆ పేరుతో వాటిని నేటివరకు పిలుస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కాబూలు’ బహుశా ఒక స్థలనామం. అయితే హీబ్రూలో ఇది అవమానార్థక పదక్రీడను కూడా సూచించవచ్చు; ‘పనికిరానిది’ లేదా ‘కట్టుబడినది/పరిమితమైనది’ వంటి భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הֶעָרִים הָאֵלֶּה
  choice: ఈ పట్టణాలు ఎలాంటివి?
  rationale: מָה ఇక్కడ కేవలం గుర్తింపును అడగకుండా, పట్టణాల స్వభావం గురించి అసంతృప్తితో కూడిన ప్రశ్నను వ్యక్తం చేస్తుంది. ‘ఎలాంటివి?’ అనే తెలుగు ప్రయోగం ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: אֲשֶׁר נָתַתָּה לִּי
  choice: నువ్వు నాకు ఇచ్చిన
  rationale: పూర్తయిన కార్యాన్ని ప్రత్యక్ష సంభాషణలో సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘నాకు’ అనే సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: אָחִי
  choice: నా సహోదరా
  rationale: మూలంలోని స్వామ్య ప్రత్యయాన్నీ, రాజుల మధ్య ఉన్న దౌత్యపరమైన సంబోధననూ యథాతథంగా కాపాడుతుంది.
- source_word: וַיִּקְרָא לָהֶם
  choice: వాటికి ... అని పేరు పెట్టాడు
  rationale: קרא + ל నిర్మాణం ఇక్కడ పేరు పెట్టడాన్ని సూచిస్తుంది. తెలుగులో ‘వాటికి ... అని పేరు పెట్టాడు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: אֶרֶץ כָּבוּל
  choice: కాబూలు దేశం
  rationale: כָּבוּל ను ప్రధాన పాఠ్యంలో స్థలనామంగా లిప్యంతరీకరించాం; సాధ్యమైన అవమానార్థక పదక్రీడను పాదసూచికలో ఉంచాం. אֶרֶץ కు ‘దేశం’ సందర్భోచితమైన రూపం.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటివరకు ఆ పేరు అలాగే ఉంది
  rationale: హీబ్రూ కాలసూచక సూత్రాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, కొనసాగుతున్నది ఆ పేరేనని సందర్భానుసారంగా స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజదౌత్య సంబోధనకు గౌరవభరితమైన ‘సహోదరా’ను, అసంతృప్తి వ్యక్తమయ్యే ప్రశ్నకు సహజమైన ‘ఎలాంటివి?’ను ఉపయోగించాం. స్థలనామంలోని అనిశ్చితిని ప్రధాన పాఠ్యంలో పరిష్కరించకుండా పాదసూచికలో నిలిపాం.
