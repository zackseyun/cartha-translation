  text: כָּל הָ֠/עָם הַ/נּוֹתָ֨ר מִן הָ/אֱמֹרִ֜י הַ/חִתִּ֤י הַ/פְּרִזִּי֙ הַ/חִוִּ֣י וְ/הַ/יְבוּסִ֔י אֲשֶׁ֛ר לֹֽא מִ/בְּנֵ֥י יִשְׂרָאֵ֖ל הֵֽמָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/020.yaml
  text: All the people who remained of the Amorites[a], the Hittites, the Perizzites, the Hivites, and the Jebusites, who were not of the sons of Israel—
translation:
  language: te
  text: అమోరీయులు, హిత్తీయులు, పెరిజ్జీయులు, హివ్వీయులు, యెబూసీయులలో మిగిలి ఉన్న ప్రజలందరూ, వారు ఇశ్రాయేలు కుమారులలోనివారు కారు[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “వారు ఇశ్రాయేలీయులు కారు.” హీబ్రూ అక్షరార్థం: “వారు ఇశ్రాయేలు కుమారులలోనివారు కారు.”'
    reason: మూలంలోని מִבְּנֵי יִשְׂרָאֵלకు అక్షరార్థ రూపాన్నీ, సహజమైన సమూహార్థ ప్రత్యామ్నాయాన్నీ చూపించడానికి.
lexical_decisions:
- source_word: כָּל הָעָם הַנּוֹתָר
  choice: మిగిలిన ప్రజలందరూ
  rationale: హీబ్రూ సమూహార్థక ఏకవచనమైన עָםను సహజమైన తెలుగు బహువచన భావంతో అనువదించి, כָּל యొక్క సమగ్రతను ‘అందరూ’ ద్వారా తెలిపాం.
- source_word: מִן הָאֱמֹרִי הַחִתִּי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: అమోరీయులు, హిత్తీయులు, పెరిజ్జీయులు, హివ్వీయులు, యెబూసీయులలో
  rationale: מִן ఇక్కడ జాబితాలోని జనసమూహాల నుంచి మిగిలినవారిని సూచిస్తుంది; తెలుగులో ‘వారిలో’ భావం సహజంగా ఉంటుంది. జాతినామాలను ప్రామాణిక తెలుగు బైబిలు రూపాలకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: אֲשֶׁר לֹא מִבְּנֵי יִשְׂרָאֵל הֵמָּה
  choice: వారు ఇశ్రాయేలు కుమారులకు చెందినవారు కారు
  rationale: హీబ్రూ వాక్యంలోని బలపరిచే స్వతంత్ర సర్వనామం הֵמָּהను ‘వారు’గా వ్యక్తపరిచాం. מִן యొక్క వంశ/సమూహ సంబంధ భావాన్ని సహజ తెలుగులో ‘చెందినవారు కారు’గా ఇచ్చాం; בְּנֵי יִשְׂרָאֵל యొక్క రూపాన్ని ‘ఇశ్రాయేలు కుమారులు’గా నిలిపాం.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל అనే లింగసూచక ఒడంబడిక పదబంధం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు / ఇశ్రాయేలు సంతతి
  rationale: మూలంలో ఉన్న ‘కుమారులు’ అనే రూపాన్ని ప్రధాన పాఠంలో పారదర్శకంగా నిలిపాం. అయితే సందర్భంలో ఇది ఇశ్రాయేలు ప్రజాసమూహాన్ని సూచిస్తుందని పాదటిప్పణిలో స్పష్టం చేశాం; ఏ ప్రత్యేక సిద్ధాంతార్థాన్నీ చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభంగా అర్థమయ్యే శైలి. వాక్యం తదుపరి వచనంలో కొనసాగుతుందనే భావాన్ని చివరి దీర్ఘ విరామచిహ్నంతో నిలిపాం; ప్రధాన పాఠంలోని [a] గుర్తు పాదటిప్పణికి సరిపోతుంది.
