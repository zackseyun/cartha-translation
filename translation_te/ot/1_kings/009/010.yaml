source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קְצֵה֙ עֶשְׂרִ֣ים שָׁנָ֔ה אֲשֶׁר בָּנָ֥ה שְׁלֹמֹ֖ה אֶת שְׁנֵ֣י הַ/בָּתִּ֑ים אֶת בֵּ֥ית יְהוָ֖ה וְ/אֶת בֵּ֥ית הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/010.yaml
  text: And it happened at the end of twenty years[b][a], in which Solomon had built the two houses—the house of Yahweh and the king's house—
translation:
  language: te
  text: సొలొమోను ఆ రెండు గృహాలను[b]—యహ్వే గృహాన్ని, రాజు గృహాన్ని—నిర్మించిన ఇరవై సంవత్సరాలు ముగిసినప్పుడు[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇరవై సంవత్సరాల తరువాత.’ హీబ్రూ నుడికారం ఇరవై సంవత్సరాల కాలం పూర్తయినదాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో ‘ఆ రెండు గృహాలు’; అవి యహ్వే గృహం, రాజు గృహం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ముగిసినప్పుడు—
  rationale: హీబ్రూ కథన సంధిని తెలుగులో సహజమైన కాలవాచక ఉపవాక్యంగా మలిచాం. వాక్యం తరువాతి వచనంలో కొనసాగుతుందని చివరి దీర్ఘవిరామం సూచిస్తుంది; విడిగా ‘అప్పుడు జరిగింది’ అని పెట్టడం తెలుగులో కృత్రిమంగా ఉంటుంది.
- source_word: מִקְצֵה עֶשְׂרִים שָׁנָה
  choice: ఇరవై సంవత్సరాలు ముగిసినప్పుడు
  rationale: ఇరవై సంవత్సరాల కాలం పూర్తయిన బిందువును తెలిపే హీబ్రూ నుడికారాన్ని సహజంగా, మూలానికి దగ్గరగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר בָּנָה שְׁלֹמֹה
  choice: సొలొమోను … నిర్మించిన
  rationale: సంబంధవాచక ఉపవాక్యాన్ని ఇరవై సంవత్సరాల కాలంతో అనుసంధానిస్తూ, తెలుగు వాక్యక్రమానికి తగినట్లు ముందుంచాం. ‘నిర్మించిన’ రెండు పెద్ద కట్టడాల సందర్భంలో గౌరవప్రదమైన ఆధునిక పదం.
- source_word: שְׁנֵי הַבָּתִּים
  choice: ఆ రెండు గృహాలను
  rationale: בַּיִת అనే పదంలోని ‘ఇల్లు/గృహం’ భావాన్ని, తరువాత వచ్చే రెండు సమాంతర గుర్తింపులతో సహా నిలుపుతుంది. ‘గృహం’ ఈ రాజసమైన సందర్భంలో ‘ఇల్లు’ కంటే తగినది.
- source_word: בֵּית יְהוָה
  choice: యెహోవా గృహాన్ని
  rationale: ‘యెహోవా గృహం’ అని మూలంలోని పదబంధాన్ని నేరుగా నిలుపుతుంది; ‘దేవాలయం’ అని సందర్భార్థాన్ని మాత్రమే పెట్టదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో ఇస్తుంది.
- source_word: בֵּית הַמֶּלֶךְ
  choice: రాజు గృహాన్ని
  rationale: ‘రాజభవనం’ అనే సందర్భానుగుణ పదం సాధ్యమైనా, ‘యెహోవా గృహం’తో మూలంలోని పదసామ్యాన్ని కాపాడేందుకు ‘రాజు గృహం’ ఎంచుకున్నాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా తెలుగు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణతో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘గృహం’ అనే పదాన్ని రెండుచోట్లా ఉంచి హీబ్రూలోని పదసామ్యాన్ని కాపాడాం. మూలవాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున చివర దీర్ఘవిరామం ఉంచాం.
