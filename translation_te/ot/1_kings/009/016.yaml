  register: ఆధునిక ప్రామాణిక తెలుగు; చారిత్రక వర్ణనకు తగిన గౌరవప్రదమైన, సూటి శైలి. ‘పెళ్లి కానుక’ ప్రధాన పాఠ్యంలో సహజంగా ఉండగా, ‘కట్నం’ అనే సాధ్యమైన సాంకేతిక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
