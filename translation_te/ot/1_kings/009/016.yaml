  variant: modern standard Telugu
source:
  edition: WLC
  text: פַּרְעֹ֨ה מֶֽלֶךְ מִצְרַ֜יִם עָלָ֗ה וַ/יִּלְכֹּ֤ד אֶת גֶּ֨זֶר֙ וַ/יִּשְׂרְפָ֣/הּ בָּ/אֵ֔שׁ וְ/אֶת הַֽ/כְּנַעֲנִ֛י הַ/יֹּשֵׁ֥ב בָּ/עִ֖יר הָרָ֑ג וַֽ/יִּתְּנָ/הּ֙ שִׁלֻּחִ֔ים לְ/בִתּ֖/וֹ אֵ֥שֶׁת שְׁלֹמֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/016.yaml
  text: Pharaoh king of Egypt had gone up and captured Gezer and burned it with fire[a], and he killed the Canaanites who lived in the city, and gave it as a dowry to his daughter, Solomon’s wife.
translation:
  language: te
  text: ఈజిప్టు రాజైన ఫరో గెజెరుకు వెళ్లి దానిని స్వాధీనం చేసుకొని, అగ్నితో కాల్చివేశాడు. ఆ పట్టణంలో నివసిస్తున్న కనానీయులను చంపి, దానిని తన కుమార్తెకు, సొలొమోను భార్యకు, పెళ్లి కానుకగా[a] ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కట్నంగా.” హీబ్రూ పదం వివాహానికి సంబంధించిన కానుకను సూచిస్తుంది; దాని ఖచ్చితమైన సామాజిక భావం ‘కట్నం’ అనే అర్థంతో కొంతవరకు కలిసివుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: మీదికి వెళ్లి
  rationale: సైనిక దండయాత్ర సందర్భంలోని ‘పైకి వెళ్లడం/దాడికి వెళ్లడం’ అనే హీబ్రూ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּלְכֹּד
  choice: స్వాధీనం చేసుకొని
  rationale: పట్టణాన్ని సైనికంగా పట్టుకున్నాడనే לכד పదార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּשְׂרְפָהּ בָּאֵשׁ
  choice: దాన్ని అగ్నితో కాల్చివేశాడు
  rationale: హీబ్రూలో స్పష్టంగా ఉన్న ‘అగ్నితో’ అనే బలపరిచే వ్యక్తీకరణను నిలుపుతుంది.
- source_word: הַכְּנַעֲנִי הַיֹּשֵׁב בָּעִיר
  choice: ఆ పట్టణంలో నివసిస్తున్న కనానీయులను
  rationale: వ్యాకరణపరంగా ఏకవచనమైన సమూహవాచకాన్ని తెలుగులో సహజమైన బహువచనంగా ఇచ్చి, పట్టణ నివాసులనే సూచనను కాపాడుతుంది.
- source_word: הָרָג
  choice: చంపి
  rationale: అలంకారం లేకుండా הרג యొక్క ప్రత్యక్ష అర్థాన్ని ఇస్తుంది.
- source_word: וַיִּתְּנָהּ
  choice: దాన్ని … ఇచ్చాడు
  rationale: స్త్రీలింగ ప్రత్యయం గెజెరు పట్టణాన్ని సూచిస్తుందని తెలుగులో సర్వనామ సంబంధంతో నిలుపుతుంది.
- source_word: שִׁלֻּחִים
  choice: పెళ్లి కానుకగా
  rationale: వివాహ సందర్భంలో ఇచ్చే బహుమతి అనే భావాన్ని సాధారణ పాఠకులకు అర్థమయ్యేలా ఇస్తూ, నిర్దిష్ట సామాజిక వ్యవస్థను అనవసరంగా నిర్ణయించదు.
- source_word: לְבִתּוֹ אֵשֶׁת שְׁלֹמֹה
  choice: తన కుమార్తెకు—సొలొమోను భార్యకు—
  rationale: ఆ కుమార్తెను సొలొమోను భార్యగా గుర్తించే అన్వయాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
