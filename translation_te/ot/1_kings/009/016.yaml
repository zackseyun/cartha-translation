- from: ఈజిప్టు రాజైన ఫరో గెజెరు మీదికి వెళ్లి దాన్ని స్వాధీనం చేసుకొని, దాన్ని అగ్నితో కాల్చివేశాడు. ఆ పట్టణంలో నివసిస్తున్న కనానీయులను చంపి, దాన్ని తన కుమార్తెకు—సొలొమోను భార్యకు—పెళ్లి కానుకగా[a] ఇచ్చాడు.
  to: ఈజిప్టు రాజైన ఫరో గెజెరుకు వెళ్లి దానిని స్వాధీనం చేసుకొని, అగ్నితో కాల్చివేశాడు. ఆ పట్టణంలో నివసిస్తున్న కనానీయులను చంపి, దానిని తన కుమార్తెకు, సొలొమోను భార్యకు, పెళ్లి కానుకగా[a] ఇచ్చాడు.
  rationale: సవరణలు శైలిగతమైనవి మాత్రమే. మూలంలోని సంఘటనల క్రమం, గెజెరు అనే స్త్రీలింగ పట్టణనామాన్ని సూచించే సర్వనామం, కనానీయుల సమూహవాచక భావం, మరియు శిల్లుఖీమ్‌కు సంబంధించిన వివాహ-కానుక అర్థసందిగ్ధత అన్నీ నిలుపబడ్డాయి. పాదటిప్పణి గుర్తు సరైన పదమైన ‘పెళ్లి కానుకగా’కు జతచేయబడింది.
