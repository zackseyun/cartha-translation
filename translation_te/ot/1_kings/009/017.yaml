lexical_decisions:
- source_word: וַיִּבֶן
  choice: కట్టించాడు
  rationale: בנה అనే క్రియకు ప్రాథమిక అర్థం ‘కట్టు/నిర్మించు.’ రాజు చేపట్టించిన నిర్మాణ కార్యాన్ని సహజమైన తెలుగులో తెలియజేయడానికి ప్రేరణార్థక రూపమైన ‘కట్టించాడు’ వాడబడింది; ‘బలపరిచాడు’ లేదా ‘మళ్లీ కట్టించాడు’ అనే సందర్భసాధ్య భావాలను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: שְׁלֹמֹה
  choice: సొలొమోను
  rationale: వ్యక్తి పేరుకు తెలుగులో విస్తృతంగా స్థిరపడిన లిప్యంతరీకరణ.
- source_word: גָּזֶר
  choice: గెజెరు
  rationale: స్థలపేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా, తెలుగు విభక్తి కలపడానికి అనుకూలంగా లిప్యంతరీకరించాం.
- source_word: בֵּית חֹרֹן תַּחְתּוֹן
  choice: దిగువ బేత్-హోరోను
  rationale: תַּחְתּוֹן ఈ పేరుగల రెండు ప్రదేశాల్లో దిగువనున్నదాన్ని సూచిస్తుంది. సహజమైన తెలుగు పదక్రమంలో ‘దిగువ’ను పేరుకు ముందు ఉంచాం.
- source_word: אֶת / וְאֶת
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇవి ప్రత్యక్ష కర్మ సూచకాలు; తెలుగు వాక్యనిర్మాణంలో ‘-ను’ విభక్తి ద్వారా వాటి వ్యాకరణ విధి వ్యక్తమైంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. రాజు స్వయంగా నిర్మించాడనే కంటే నిర్మాణాన్ని చేపట్టించాడనే సహజ రాజకార్య భావం కోసం ‘కట్టించాడు’ ఎంచుకున్నాం. స్థలపేర్లను స్థిరమైన తెలుగు బైబిలు శైలికి అనుగుణంగా లిప్యంతరీకరించాం.
