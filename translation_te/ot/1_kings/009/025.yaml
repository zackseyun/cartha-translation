  - severity: medium
    issue: “బలులను ధూపంగా కాల్చాడు” is semantically and idiomatically problematic.
    rationale: It conflates incense with sacrificial material. A natural main rendering may say “ధూపం వేశాడు,” with a footnote retaining the broader possibility of making an offering smoke.
