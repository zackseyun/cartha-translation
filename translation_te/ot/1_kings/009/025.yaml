source:
  edition: WLC
  text: וְ/הֶעֱלָ֣ה שְׁלֹמֹ֡ה שָׁלֹשׁ֩ פְּעָמִ֨ים בַּ/שָּׁנָ֜ה עֹל֣וֹת וּ/שְׁלָמִ֗ים עַל הַ/מִּזְבֵּ֨חַ֙ אֲשֶׁ֣ר בָּנָ֣ה לַ/יהוָ֔ה וְ/הַקְטֵ֣יר אִתּ֔/וֹ אֲשֶׁ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ/שִׁלַּ֖ם אֶת הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/025.yaml
  text: And Solomon offered up burnt offerings and peace offerings on the altar that he had built for Yahweh three times a year[a], and he burned incense with it before Yahweh[b]. Thus he completed the house.
translation:
  language: te
  text: సొలొమోను సంవత్సరానికి మూడుసార్లు యెహోవా కోసం తాను కట్టించిన బలిపీఠం మీద దహనబలులను, సమాధానబలులను అర్పించాడు. అతడు దానితో యెహోవా సన్నిధిలో ధూపం వేశాడు[a]. ఈ విధంగా అతడు మందిరాన్ని[b] పూర్తి చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు దానితో బలులను పొగగా కాల్చాడు.” హీబ్రూ క్రియ ధూపం వేయడాన్ని గానీ, మరింత విస్తృతంగా బలిని పొగగా కాల్చడాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “ఇల్లు”; ఇక్కడ అది దేవాలయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱלָה
  choice: అర్పించాడు
  rationale: עלה హిఫీల్ రూపం బలుల సందర్భంలో ‘బలిగా అర్పించు’ అనే భావాన్ని ఇస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘అర్పించాడు’ ఆ ఆరాధనా భావాన్ని స్పష్టంగా తెలియజేస్తుంది; కార్యాన్ని స్వయంగా చేశాడా లేక చేయించాడా అనే ప్రశ్నను ఇది బలవంతంగా తేల్చదు.
- source_word: עֹלוֹת
  choice: దహనబలులు
  rationale: బలిపీఠంపై పూర్తిగా కాల్చబడే బలులకు తెలుగులో స్థిరంగా, స్పష్టంగా వినిపించే పదం.
- source_word: שְׁלָמִים
  choice: సమాధానబలులు
  rationale: సహవాసం, క్షేమం, శాంతి భావాలు గల ఈ బలి వర్గానికి పరిచితమైన బైబిలు పదం; మూలపదంలోని భావపరిధిని పూర్తిగా ఒకే అర్థానికి కుదించదు.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: సంవత్సరానికి మూడుసార్లు
  rationale: హీబ్రూ కాలసూచక పదబంధానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: עַל הַמִּזְבֵּחַ אֲשֶׁר בָּנָה לַיהוָה
  choice: యెహోవా కోసం తాను కట్టించిన బలిపీఠం మీద
  rationale: లַיהוָהను ‘యెహోవా కోసం’గా చూపి బలిపీఠపు అంకితభావాన్ని నిలుపుతుంది. రాజనిర్మాణ సందర్భంలో ‘కట్టించిన’ సహజమైనదిగా ఉండి, సొలొమోను స్వయంగా నిర్మాణశ్రమ చేశాడని అనవసరంగా సూచించదు.
- source_word: וְהַקְטֵיר אִתּוֹ
  choice: దానితోపాటు బలులను ధూపంగా కాల్చాడు
  rationale: קטר కేవలం సుగంధధూపం వేయడానికే కాక బలులను పొగగా పైకి ఎగసేలా కాల్చడానికీ వాడవచ్చు. ‘బలులను ధూపంగా కాల్చాడు’ విస్తృత బలిసంబంధ భావాన్ని ప్రధాన పాఠ్యంలో ఉంచుతుంది; אִתּוֹలోని సంబంధాన్ని ‘దానితోపాటు’గా జాగ్రత్తగా ప్రతిబింబిస్తుంది.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: యెహోవా సన్నిధిలో
  rationale: ‘యెహోవా ఎదుట’ అనే మూలభావానికి సహజమైన, గౌరవప్రదమైన తెలుగు రూపం; వాక్యనిర్మాణంలోని క్లిష్ట సంబంధాన్ని అతిగా నిర్ధారించదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో లిప్యంతరీకరించింది.
- source_word: וְשִׁלַּם אֶת הַבָּיִת
  choice: ఈ విధంగా అతడు మందిరాన్ని పూర్తి చేశాడు
  rationale: שלם పియేల్ రూపంలోని ‘పూర్తి చేయు’ భావాన్ని నిలుపుతుంది. הַבָּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఈ సందర్భంలో దేవాలయాన్ని సూచిస్తున్నందున ప్రధాన పాఠ్యంలో సహజమైన ‘మందిరం’ వాడి, అక్షరార్థాన్ని పాదటిప్పణిలో తెలిపింది.
theological_decisions:
- issue: సొలొమోను బలులను స్వయంగా అర్పించాడా లేక యాజకుల ద్వారా అర్పింపజేశాడా
  choice: వాక్యంలో చర్యలను సొలొమోనుకే ఆపాదిస్తూ ‘అర్పించాడు’ అని ఉంచడం
  alternative: ‘అర్పింపజేశాడు’ అని స్పష్టంగా యాజకుల ద్వారా చేయించాడని చెప్పడం
  rationale: హీబ్రూ రాజసారాంశ శైలిలో చర్యలు రాజుకే ఆపాదించబడ్డాయి; అవి ప్రత్యక్షంగా చేశాడా, తన అధికారంలో చేయించాడా అనేది వచనం స్పష్టంగా తేల్చదు. అనువాదం ఈ ఉద్రిక్తతను నిలుపుతుంది.
- issue: וְהַקְטֵיר యొక్క ఆరాధనా చర్య
  choice: విస్తృత బలిసంబంధ భావంతో ‘బలులను ధూపంగా కాల్చాడు’
  alternative: ప్రత్యేకంగా ‘ధూపం వేశాడు’
  rationale: קטר యొక్క అర్థపరిధి సుగంధధూపం వేయడాన్ని మాత్రమే కాక బలి పదార్థాన్ని పొగగా కాల్చడాన్ని కూడా కలిగి ఉంటుంది. సందర్భంలో ఏది ఖచ్చితమో తేల్చకుండా ప్రధాన భావాన్ని విస్తృతంగా ఉంచి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చింది.
translation_notes:
  register: సులభంగా అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగు, అయితే ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన శైలి. ‘దహనబలులు,’ ‘సమాధానబలులు,’ ‘బలిపీఠం,’ ‘సన్నిధి’ వంటి పరిచిత బైబిలు పదాలను నిలిపి, క్లిష్టమైన హీబ్రూ వాక్య సంబంధాన్ని సహజమైన తెలుగు క్రమంలో అమర్చాం. ప్రతి పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
