source:
  edition: WLC
  text: וְ/זֶ֨ה דְבַר הַ/מַּ֜ס אֲשֶֽׁר הֶעֱלָ֣ה הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה לִ/בְנוֹת֩ אֶת בֵּ֨ית יְהוָ֤ה וְ/אֶת בֵּית/וֹ֙ וְ/אֶת הַ/מִּלּ֔וֹא וְ/אֵ֖ת חוֹמַ֣ת יְרוּשָׁלִָ֑ם וְ/אֶת חָצֹ֥ר וְ/אֶת מְגִדּ֖וֹ וְ/אֶת גָּֽזֶר־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/015.yaml
  text: This is the account of the forced labor that King Solomon levied to build the house of Yahweh[a], his own house, the Millo, the wall of Jerusalem, Hazor, Megiddo[b], and Gezer.
translation:
  language: te
  text: యాహ్వే మందిరాన్ని, తన భవనాన్ని, మిల్లోను[b], యెరూషలేము ప్రాకారాన్ని, హాసోరును, మెగిద్దోను, గెజెరును నిర్మించడానికి సొలొమోను రాజు విధించిన నిర్బంధ శ్రమ[a] గురించిన వివరమిది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిర్బంధ శ్రమ’ అంటే నగదు పన్ను కాదు; రాజ్య పనుల కోసం ప్రజలపై విధించిన తప్పనిసరి శ్రమ. దీన్ని ‘శ్రమ విధింపు’ లేదా ‘వెట్టి పని’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘మిల్లో’ బహుశా యెరూషలేములోని ప్రసిద్ధ రక్షణ నిర్మాణం లేదా మట్టితో నింపి చేసిన మెట్లవంటి నిర్మాణం. ఈ హీబ్రూ పదానికి ‘నింపుడు’ అనే భావం ఉండవచ్చు; కానీ అది ఏ నిర్మాణాన్ని సూచిస్తుందో ఖచ్చితంగా తెలియదు.
    reason: cultural_note
lexical_decisions:
- source_word: דְבַר
  choice: వివరం
  rationale: דְבַר הַמַּס అనే నిర్మాణం ఇక్కడ శ్రమ విధింపు గురించిన వివరణాత్మక నివేదికను పరిచయం చేస్తుంది. అందువల్ల సహజమైన ఆధునిక తెలుగులో ‘గురించిన వివరమిది’ అని అనువదించాం.
- source_word: הַמַּס
  choice: నిర్బంధ శ్రమ
  rationale: ఈ నిర్మాణ సందర్భంలో מַס నగదు పన్ను కాదు; రాజ్య నిర్మాణ పనుల కోసం తప్పనిసరిగా సమకూర్చిన శ్రమను సూచిస్తుంది. ‘నిర్బంధ శ్రమ’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, సాంకేతిక పదాన్ని నివారిస్తుంది.
- source_word: הֶעֱלָה
  choice: విధించిన
  rationale: עלה ధాతువు హిఫీల్ రూపంలో ఇక్కడ శ్రమ విధింపును లేదా సమీకరణను సూచిస్తుంది. ‘విధించిన’ పరిపాలనా భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לִבְנוֹת
  choice: నిర్మించడానికి
  rationale: ఈ క్రియారూపం ప్రయోజనాన్ని తెలియజేస్తుంది; తెలుగులో ‘నిర్మించడానికి’ నేరుగా, సహజంగా ఉంటుంది.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే మందిరం
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా, దేవునికి సంబంధించిన ఈ నిర్మాణ సందర్భంలో ‘మందిరం’ సహజమైన, గౌరవప్రదమైన తెలుగు. יְהוָה అనే వ్యక్తిగత దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: בֵּיתוֹ
  choice: తన సొంత భవనం
  rationale: ఇది సొలొమోను రాజనివాస సముదాయాన్ని సూచిస్తుంది. ‘తన సొంత భవనం’ యాహ్వే మందిరంతో ఉన్న వ్యత్యాసాన్ని నిలుపుతూ, మూలంలోని స్వామ్య భావాన్ని కాపాడుతుంది.
- source_word: הַמִּלּוֹא
  choice: మిల్లో
  rationale: ఇది యెరూషలేములోని ఒక నిర్దిష్ట నిర్మాణం లేదా భూఆకృతి పేరు. దాని ఖచ్చిత స్వరూపం అనిశ్చితమైనందున అర్థాన్ని ఊహించి అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: חוֹמַת יְרוּשָׁלִָם
  choice: యెరూషలేము ప్రాకారం
  rationale: నగర రక్షణ గోడను సూచించే సహజమైన తెలుగు పదబంధం.
- source_word: חָצֹר
  choice: హాసోరు
  rationale: స్థలనామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: מְגִדּוֹ
  choice: మెగిద్దో
  rationale: స్థలనామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: גָּזֶר
  choice: గెజెరు
  rationale: స్థలనామానికి తెలుగు లిప్యంతరీకరణ.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలవచనంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. దాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించిన ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని ఇచ్చాం.
- issue: בֵּית יְהוָה లో בַּיִת అనువాదం
  choice: యాహ్వే మందిరం
  alternative: యాహ్వే గృహం
  rationale: ‘గృహం’ మూలానికి మరింత అక్షరానుసారమైనదైనా, ఈ నిర్మాణ సందర్భంలో తెలుగు పాఠకులకు అది నివాసగృహంగా అపార్థమయ్యే అవకాశం ఉంది. ‘మందిరం’ సూచిత పవిత్ర నిర్మాణాన్ని సహజంగా తెలియజేస్తుంది; అయితే దైవనామంతో దాని సంబంధాన్ని యథాతథంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యక్రమాన్ని ఉపయోగించాం. రాజనిర్మాణ పరిపాలనా సందర్భానికి తగిన గంభీరతను ఉంచుతూ, ‘కోర్వే’ వంటి సాంకేతిక పదాలను నివారించాం. మూలంలోని జాబితా క్రమాన్ని అలాగే నిలిపి, ‘మిల్లో’ స్వరూపం విషయంలోని అనిశ్చితిని పాదసూచికలో కాపాడాం.
