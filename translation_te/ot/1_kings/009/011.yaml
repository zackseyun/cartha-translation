source:
  edition: WLC
  text: חִירָ֣ם מֶֽלֶךְ צֹ֠ר נִשָּׂ֨א אֶת שְׁלֹמֹ֜ה בַּ/עֲצֵי֩ אֲרָזִ֨ים וּ/בַ/עֲצֵ֧י בְרוֹשִׁ֛ים וּ/בַ/זָּהָ֖ב לְ/כָל חֶפְצ֑/וֹ אָ֡ז יִתֵּן֩ הַ/מֶּ֨לֶךְ שְׁלֹמֹ֤ה לְ/חִירָם֙ עֶשְׂרִ֣ים עִ֔יר בְּ/אֶ֖רֶץ הַ/גָּלִֽיל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/011.yaml
  text: Hiram king of Tyre had supplied Solomon with cedar timber[a], cypress timber, and gold, according to all his desire; then King Solomon gave Hiram twenty cities in the land of Galilee.
translation:
  language: te
  text: తూరు రాజైన హీరాము సొలొమోనుకు అతడు కోరినదంతా—దేవదారు కలపను, సైప్రస్ కలపను[a], బంగారాన్ని—సమకూర్చాడు. అప్పుడు సొలొమోను రాజు గలిలయ దేశంలో ఇరవై పట్టణాలను హీరాముకు ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘జునిపర్,’ ‘ఫిర్,’ లేదా మరొక శంకువృక్ష జాతి; హీబ్రూ బేరోష్ అనే పదం సూచించే ఖచ్చితమైన చెట్టు జాతి అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשָּׂא
  choice: సమకూర్చాడు
  rationale: ఈ నిర్మాణంలో సాధారణమైన ‘మోయు/భరించు’ అనే అర్థం కాకుండా, హీరాము సొలొమోనుకు కావలసిన సామగ్రిని అందించాడనే సందర్భోచిత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בַּעֲצֵי אֲרָזִים
  choice: దేవదారు కలపను
  rationale: עֵץ చెట్టు జాతి పేరుతో వచ్చినప్పుడు ఇక్కడ నిర్మాణానికి ఉపయోగించే కలపను సూచిస్తుంది; אֶרֶז సాధారణంగా దేవదారుగా గుర్తించబడుతుంది.
- source_word: וּבַעֲצֵי בְרוֹשִׁים
  choice: సరళవృక్షపు కలపను
  rationale: בְּרוֹשׁ సూచించే ఖచ్చితమైన చెట్టు జాతి అనిశ్చితం. తెలుగులో గౌరవప్రదమైన సాధారణ అనువాదంగా ‘సరళవృక్షం’ వాడి, అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
- source_word: וּבַזָּהָב
  choice: బంగారాన్ని
  rationale: మూలంలోని పదార్థనామానికి నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: לְכָל חֶפְצוֹ
  choice: కోరినదంతటికి తగినట్లుగా
  rationale: సొలొమోను అభిలషించిన మేరకు హీరాము సమకూర్చాడనే సంపూర్ణతను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אָז יִתֵּן
  choice: అప్పుడు ... ఇచ్చాడు
  rationale: אָז కాలక్రమ సూచిక; రూపపరంగా అపూర్ణక్రియ అయిన יִתֵּן ఇక్కడ కథనంలోని గత సంఘటనను సూచిస్తుంది.
- source_word: עֶשְׂרִים עִיר
  choice: ఇరవై పట్టణాలను
  rationale: עִיר నగరం లేదా పట్టణం అనే అర్థాలను కలిగి ఉంది; ఈ ప్రాంతీయ సందర్భంలో ‘పట్టణాలు’ సహజమైన తెలుగు.
- source_word: בְּאֶרֶץ הַגָּלִיל
  choice: గలిలయ ప్రాంతంలో
  rationale: אֶרֶץ ఇక్కడ భూభాగం లేదా ప్రాంతం అనే భావాన్ని ఇస్తుంది; ‘ప్రాంతం’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: חִירָם ... שְׁלֹמֹה ... צֹר ... הַגָּלִיל
  choice: హీరాము ... సొలొమోను ... తూరు ... గలిలయ
  rationale: తెలుగు బైబిలు పాఠకులకు పరిచితమైన, మూలధ్వనులకు తగిన ప్రామాణిక నామరూపాలు.
