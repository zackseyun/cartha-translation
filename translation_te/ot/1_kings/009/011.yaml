translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మొదటి ఉపవాక్యంలోని నేపథ్య కార్యాన్ని తెలుగు సందర్భంలో సహజమైన గతకాలంతో వ్యక్తం చేసి, ప్రధాన కార్యాన్ని ‘అప్పుడు’తో అనుసంధానించాం.
