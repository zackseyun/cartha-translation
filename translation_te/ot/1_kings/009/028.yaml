  text: וַ/יָּבֹ֣אוּ אוֹפִ֔ירָ/ה וַ/יִּקְח֤וּ מִ/שָּׁם֙ זָהָ֔ב אַרְבַּע מֵא֥וֹת וְ/עֶשְׂרִ֖ים כִּכָּ֑ר וַ/יָּבִ֖אוּ אֶל הַ/מֶּ֥לֶךְ שְׁלֹמֹֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/028.yaml
  text: They went to Ophir and took from there four hundred and twenty talents of gold[a], and brought it to King Solomon.
translation:
  language: te
  text: వారు ఓఫీరుకు వెళ్లి[b], అక్కడి నుండి నాలుగు వందల ఇరవై తలాంతుల[a] బంగారాన్ని తీసుకొని సొలొమోను రాజు వద్దకు తీసుకువచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: తలాంతు ప్రాచీన బరువు ప్రమాణం; దాని ఖచ్చితమైన బరువు కాలాన్ని, ప్రాంతాన్ని బట్టి మారేది.
    reason: ప్రాచీన బరువు ప్రమాణాన్ని వివరిస్తూ, నిర్ధిష్ట ఆధునిక సమానాన్ని సూచించడం వల్ల కలిగే తప్పుడు ఖచ్చితత్వాన్ని నివారించడం.
  - marker: b
    text: లేదా, “ఓఫీరుకు చేరారు.” హీబ్రూ క్రియను సందర్భాన్ని బట్టి “వెళ్లారు” లేదా “చేరారు” అని అనువదించవచ్చు.
    reason: וַיָּבֹאוּ అనే గమనక్రియకు ఉన్న సముచితమైన అనువాద ప్రత్యామ్నాయాన్ని నమోదు చేయడం.
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: వెళ్లి
  rationale: בוא సాధారణంగా ‘వచ్చు/చేరు’ అని అర్థమవుతుంది; అయితే ఓఫీరు వైపు ప్రయాణాన్ని తెలిపే కథన దృష్టికోణంలో ఆధునిక తెలుగులో ‘వెళ్లి’ సహజంగా ఉంది. మూలంలోని సాధ్యమైన ‘చేరి’ భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אוֹפִירָה
  choice: ఓఫీరుకు
  rationale: ఓఫీరు అనే స్థలనామానికి ఉన్న దిశాసూచక ה భావాన్ని తెలుగు విభక్తి ‘కు’ ద్వారా వ్యక్తం చేశాం.
- source_word: וַיִּקְחוּ מִשָּׁם
  choice: అక్కడి నుండి … తీసుకొని
  rationale: לקח యొక్క సాధారణ అర్థం ‘తీసుకొను’; מִשָּׁם లోని ‘నుండి’ భావాన్ని స్పష్టంగా నిలిపాం.
- source_word: זָהָב אַרְבַּע מֵאוֹת וְעֶשְׂרִים כִּכָּר
  choice: నాలుగు వందల ఇరవై తలాంతుల బంగారాన్ని
  rationale: సంఖ్యను యథాతథంగా ఉంచి, כִּכָּר అనే ప్రాచీన బరువు ప్రమాణానికి తెలుగులో ప్రాచుర్యంలో ఉన్న ‘తలాంతు’ పదాన్ని వాడాం.
- source_word: וַיָּבִאוּ
  choice: తీసుకువచ్చారు
  rationale: בוא యొక్క హిఫిల్ రూపం ఇక్కడ బంగారాన్ని రాజు వద్దకు ‘తీసుకురావడం’ అనే కారణార్థక గమనాన్ని సూచిస్తుంది.
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: సొలొమోను రాజు దగ్గరికి
  rationale: వ్యక్తి వద్దకు వస్తువును తీసుకురావడాన్ని ఆధునిక తెలుగులో సహజంగా తెలిపే నిర్మాణం; రాజబిరుదు మరియు పేరును రెండింటినీ నిలిపాం.
