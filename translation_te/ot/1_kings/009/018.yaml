    reason: textual_variant
lexical_decisions:
- source_word: וְ/אֶת
  choice: -ను
  rationale: אֵת నిర్దిష్ట ప్రత్యక్ష కర్మను సూచిస్తుంది; తెలుగులో దానికి సహజంగా కర్మవిభక్తి ‘-ను’ వాడబడింది. జాబితాలోని సమన్వయం విరామచిహ్నంతో వ్యక్తమవుతుంది.
- source_word: בַּעֲלָת
  choice: బయలాతు
  rationale: ఇది స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: תמר
  choice: తామారు
  rationale: WLC ప్రధాన పాఠంలోని תמר అక్షరరూపాన్నే అనుసరించి స్థలనామంగా లిప్యంతరీకరించబడింది; సమాంతర పాఠంలోని ‘తద్మోరు’ పాదసూచికలో ఉంచబడింది.
- source_word: בַּ/מִּדְבָּר
  choice: అరణ్యంలో
  rationale: מִדְבָּר జనావాసం తక్కువగా ఉన్న అరణ్య/ఎడారి ప్రాంతాన్ని సూచిస్తుంది. సాధారణ బైబిలు భాషకు అనుగుణంగా ‘అరణ్యం’ ఎంచుకోబడింది.
- source_word: בָּ/אָֽרֶץ
  choice: దేశంలోని
  rationale: אֶרֶץ ఇక్కడ విస్తృత భౌగోళిక ప్రాంతాన్ని సూచిస్తుంది. తెలుగులో ‘దేశంలోని అరణ్యం’ అనే నిర్మాణం రెండు స్థానవాచక పదాల సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, స్థలనామాలను గౌరవప్రదమైన బైబిలు శైలికి అనుగుణంగా లిప్యంతరీకరించాం. ఇది ముందరి వాక్యంలో మొదలైన కర్మల జాబితా కావడంతో హీబ్రూలోని ప్రత్యక్ష కర్మ సూచనను తెలుగు ‘-ను’తో నిలిపాం. పాదసూచిక గుర్తును సంబంధిత ‘తామారు’ తర్వాత ఉంచాం.
