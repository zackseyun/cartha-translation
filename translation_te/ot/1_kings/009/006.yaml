- from: అయితే మీరు గాని మీ కుమారులు గాని నన్ను అనుసరించడం మానేసి[a], నేను మీ ముందుంచిన నా ఆజ్ఞలను, నా కట్టడలను పాటించకుండా, వెళ్లి ఇతర దేవుళ్లను సేవించి వారికి సాష్టాంగపడితే,
  to: అయితే మీరు గాని మీ కుమారులు గాని నన్ను అనుసరించడం మానేసి[a], నేను మీ ముందుంచిన నా ఆజ్ఞలను, నా విధులను పాటించకుండా, వెళ్లి ఇతర దేవుళ్లను సేవించి వారికి సాగిలపడి నమస్కరిస్తే,
  rationale: హెబ్రీ חֻקּוֹתַיకు ఉన్న న్యాయ-నిబంధన అర్థాన్ని స్పష్టంగా చేయడానికి ‘కట్టడలను’ స్థానంలో ‘విధులను’ ఉంచాం. అలాగే הִשְׁתַּחֲוִיתֶם యొక్క భౌతిక నమస్కార భావాన్ని ‘సాగిలపడి నమస్కరిస్తే’గా ఇచ్చాం. షరతు నిర్మాణం, ‘మీరు గాని మీ కుమారులు గాని’ అనే ఆడిట్-ట్రైల్ ఆధారిత ప్రత్యామ్నాయ పఠనం, మరియు పాదటిప్పణి అర్థం మారలేదు.
