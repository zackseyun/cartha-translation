id: 1KI.9.6
reference: 1 Kings 9:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם שׁ֨וֹב תְּשֻׁב֜וּ/ן אַתֶּ֤ם וּ/בְנֵי/כֶם֙ מֵֽ/אַחֲרַ֔/י וְ/לֹ֤א תִשְׁמְרוּ֙ מִצְוֺתַ֣/י חֻקֹּתַ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/כֶ֑ם וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/006.yaml
  text: But if you or your sons turn away from following me[a], and do not keep my commandments and my statutes that I have set before you, and go and serve other gods and bow down to them,
translation:
  language: te
  text: అయితే మీరు గాని మీ కుమారులు గాని నన్ను అనుసరించడం మానేసి[a], నేను మీ ముందుంచిన నా ఆజ్ఞలను, నా విధులను పాటించకుండా, వెళ్లి ఇతర దేవుళ్లను సేవించి వారికి సాగిలపడి నమస్కరిస్తే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు, మీ కుమారులు నన్ను అనుసరించడం మానేస్తే.” హెబ్రీలో అక్షరార్థంగా “మీరు మరియు మీ కుమారులు”; సందర్భంలో ఇది సొలొమోనుతోపాటు అతని రాజవంశీయ వారసులను ఉద్దేశిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: అయితే ... పడితే
  rationale: హెబ్రీ షరతును తెలుగులో సహజమైన ‘అయితే ... -తే’ నిర్మాణంతో తెలిపింది; ముందరి సందర్భానికి విరుద్ధ మలుపును ‘అయితే’ సూచిస్తుంది.
- source_word: שׁוֹב תְּשֻׁבוּן
  choice: అనుసరించడం మానేసి
  rationale: ఇన్ఫినిటివ్ అబ్సల్యూట్‌తో కూడిన క్రియ బలమైన తిరుగుబాటును సూచిస్తుంది. מֵאַחֲרַיతో కలిపి, యెహోవాను అనుసరించడం విడిచిపెట్టే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אַתֶּם וּבְנֵיכֶם
  choice: మీరు గాని మీ కుమారులు గాని
  rationale: రాజవంశ సందర్భంలో సొలొమోనును, అతని కుమారులను/వారసులను సూచిస్తుంది. షరతు వారిలో ఎవరి విషయంలోనైనా వర్తించగలదనే భావాన్ని ‘గాని ... గాని’ తెలియజేస్తుంది; అక్షరార్థమైన ‘మీరు మరియు మీ కుమారులు’ను పాదటిప్పణిలో ఉంచింది.
- source_word: מֵאַחֲרַי
  choice: నన్ను అనుసరించడం
  rationale: ‘నా వెనుకనుండి’ అనే హెబ్రీ నిబంధనాత్మక నుడికారాన్ని, దేవుణ్ణి అనుసరించే సంబంధార్థాన్ని నిలుపుతూ సహజంగా అనువదించింది.
- source_word: וְלֹא תִשְׁמְרוּ
  choice: పాటించకుండా
  rationale: ఆజ్ఞల సందర్భంలో שׁמר అంటే కాపాడడం కంటే ఆచరించడం/పాటించడం.
- source_word: מִצְוֺתַי חֻקֹּתַי
  choice: నా ఆజ్ఞలను, నా కట్టడలను
  rationale: రెండు వేర్వేరు న్యాయ-నిబంధన పదాలను తెలుగులోనూ వేరు చేసి నిలిపింది.
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיכֶם
  choice: నేను మీ ముందుంచిన
  rationale: נתן + לפני అనే నుడికారానికి ‘ముందుంచిన’ సహజమైన, భావసమానమైన అనువాదం.
- source_word: וַהֲלַכְתֶּם
  choice: వెళ్లి
  rationale: తరువాతి విగ్రహారాధనా చర్యలను పరిచయం చేసే הלךను తెలుగులో సహజమైన అనుక్రమ క్రియగా ఇచ్చింది.
- source_word: וַעֲבַדְתֶּם אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లను సేవించి
  rationale: עבד యొక్క ‘సేవించు’ భావాన్ని నిలిపి, తరువాతి השתחוהతో ఉన్న క్రియాభేదాన్ని కాపాడింది.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: వారికి సాష్టాంగపడితే
  rationale: శరీరాన్ని వంచి/నేలపై పడి నమస్కరించే స్పష్టమైన చర్యను తెలియజేస్తూ, ‘సేవించడం’తో కలిపివేయలేదు.
theological_decisions:
- issue: హెచ్చరిక యొక్క రాజవంశ పరిధి
  choice: ‘మీరు గాని మీ కుమారులు గాని’—సొలొమోను లేదా అతని రాజవంశీయ కుమారులు/వారసులు
  alternative: ‘మీరు మరియు మీ కుమారులు’ లేదా విస్తృతంగా ‘మీరు మరియు మీ పిల్లలు’
  rationale: సందర్భంలో దేవుడు సొలొమోనుతో దావీదు రాజవంశం, దేవాలయం గురించి మాట్లాడుతున్నాడు. בניםను ‘కుమారులు’గా ఉంచడం రాజవంశ సంబంధాన్ని కాపాడుతుంది; అయితే హెబ్రీలోని సముచ్చయ రూపాన్ని పాదటిప్పణి స్పష్టంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే రాజాజ్ఞ మరియు నిబంధన హెచ్చరికకు తగిన గౌరవప్రదమైన శైలిని నిలిపింది. వాక్యం తరువాతి వచనంలో పూర్తయ్యే షరతు ఉపవాక్యం కావడంతో చివర కామా ఉంచబడింది.
