revisions:
- from: ఈ మందిరం శిథిలమైపోతుంది[a]. దాని పక్కగా వెళ్లే ప్రతి ఒక్కరూ దిగ్భ్రాంతి చెంది ఈల వేస్తారు[b]. వారు, ‘యెహోవా ఈ దేశానికీ ఈ మందిరానికీ ఇలా ఎందుకు చేశాడు?’ అని అడుగుతారు.
  to: ఈ మందిరం శిథిలమైపోతుంది[a]. దాని పక్కగా వెళ్లే ప్రతి ఒక్కరూ దిగ్భ్రాంతి చెంది ఈల వేస్తారు[b]. వారు, ‘యాహ్వే ఈ దేశానికీ ఈ మందిరానికీ ఇలా ఎందుకు చేశాడు?’ అని అంటారు.
  rationale: మూలంలోని దైవనామాన్ని POB విధానానికి అనుగుణంగా ‘యాహ్వే’గా మార్చాం. ‘అడుగుతారు’ను మూలంలోని సాధారణ మాట్లాడే క్రియకు సరిపోయే ‘అంటారు’గా మార్చాం. పాదసూచిక aలోని అస్పష్టమైన వ్యాఖ్యానాన్ని తొలగించి, అక్షరార్థ ‘ఉన్నతం’ పఠనానికీ సందర్భానుసార ‘శిథిలం’ అర్థానికీ మధ్య ఉన్న ఉద్రిక్తతను నిలిపాం. పాదసూచిక bలో ‘బుసకొడతారు’కన్నా ఈ సందర్భానికి అనుకూలమైన ‘ఈసడిస్తారు’ను ప్రత్యామ్నాయంగా ఇచ్చాం.
