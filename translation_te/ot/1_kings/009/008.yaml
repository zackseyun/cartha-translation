id: 1KI.9.8
reference: 1 Kings 9:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/בַּ֤יִת הַ/זֶּה֙ יִהְיֶ֣ה עֶלְי֔וֹן כָּל עֹבֵ֥ר עָלָ֖י/ו יִשֹּׁ֣ם וְ/שָׁרָ֑ק וְ/אָמְר֗וּ עַל מֶ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/אָ֥רֶץ הַ/זֹּ֖את וְ/לַ/בַּ֥יִת הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/008.yaml
  text: And this house will become a ruin[a]. Everyone who passes by it will be appalled and will whistle, and they will say[b], ‘Why has Yahweh done thus to this land and to this house?’
translation:
  language: te
  text: ఈ మందిరం శిథిలమైపోతుంది[a]. దాని పక్కగా వెళ్లే ప్రతి ఒక్కరూ దిగ్భ్రాంతి చెంది ఈల వేస్తారు[b]. వారు, ‘యాహ్వే ఈ దేశానికీ ఈ మందిరానికీ ఇలా ఎందుకు చేశాడు?’ అని అంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠం అక్షరార్థంగా, “ఈ మందిరం ఉన్నతంగా ఉంటుంది” అని ఉంది. అయితే ఈ తీర్పు సందర్భంలో చాలామంది దీన్ని శిథిలమైన స్థితిని సూచిస్తుందని అర్థం చేసుకుంటారు; 2 దినవృత్తాంతాలు 7:21తో పోల్చండి.
    reason: textual_variant
  - marker: b
    text: లేదా, “ఈసడిస్తారు.” హీబ్రూ క్రియ ఆశ్చర్యం లేదా ఎగతాళితో పదునైన శబ్దం చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבַּיִת הַזֶּה
  choice: ఈ మందిరం
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’; ఇక్కడ సొలొమోను కట్టించిన యెహోవా మందిరాన్ని సూచిస్తున్నందున ఆధునిక తెలుగు పాఠకులకు ‘మందిరం’ స్పష్టంగా ఉంటుంది.
- source_word: יִהְיֶה עֶלְיוֹן
  choice: శిథిలమైపోతుంది
  rationale: మసొరేటిక్ పాఠం అక్షరార్థంగా ‘ఉన్నతంగా ఉంటుంది’ అని ఉన్నా, తీర్పు సందర్భం మరియు 2 దినవృత్తాంతాలు 7:21లోని సమాంతర వాక్యం నాశనమైన స్థితిని సూచిస్తున్నాయి. పాఠ్య ఉద్రిక్తతను పాదసూచికలో ఉంచాం.
- source_word: כָּל עֹבֵר עָלָיו
  choice: దాని పక్కగా వెళ్లే ప్రతి ఒక్కరూ
  rationale: హీబ్రూ నుడికారం దాని సమీపం గుండా వెళ్లే వారందరినీ సూచిస్తుంది; ఈ తెలుగు రూపం సహజంగా, స్పష్టంగా ఉంది.
- source_word: יִשֹּׁם
  choice: దిగ్భ్రాంతి చెంది
  rationale: ఈ క్రియ విధ్వంసాన్ని చూసి కలిగే విస్మయం, భయభ్రాంతిని తెలియజేస్తుంది; ‘దిగ్భ్రాంతి’ ఆ భావబలాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: וְשָׁרָק
  choice: ఈల వేస్తారు
  rationale: ఆశ్చర్యం లేదా ఎగతాళిని తెలిపే పదునైన శబ్దం చేయడాన్ని ఈ క్రియ సూచిస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: וְאָמְרוּ
  choice: వారు … అని అడుగుతారు
  rationale: బహువచన క్రియకు ముందున్న ‘ప్రతి ఒక్కరూ’ సమూహార్థక కర్త. ప్రశ్నను పలకడం తెలుగులో సహజంగా ‘అని అడుగుతారు’గా వ్యక్తమవుతుంది.
- source_word: עַל מֶה
  choice: ఎందుకు
  rationale: తీర్పుకు కారణాన్ని ప్రశ్నించే ఈ పదబంధానికి ‘ఎందుకు’ సహజమైన సమానార్థకం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: כָּכָה
  choice: ఇలా
  rationale: కనిపిస్తున్న తీర్పు విధానాన్ని సూచించే పదానికి ‘ఇలా’ సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: לָאָרֶץ הַזֹּאת וְלַבַּיִת הַזֶּה
  choice: ఈ దేశానికీ ఈ మందిరానికీ
  rationale: אֶרֶץ ఇక్కడ భూమండలాన్ని కాక ఇశ్రాయేలు దేశాన్ని సూచిస్తుంది. పునరుక్తిని నిలుపుతూ అనుసంధానాన్ని తెలుగు ‘-కీ … -కీ’ రూపంతో అందించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా, తెలుగు బైబిలు వాడుకలో బాగా పరిచయమైన లిప్యంతరీకరణను ఎంచుకున్నాం; ఉచ్చారణపై ఉన్న భిన్నాభిప్రాయాన్ని సిద్ధాంతపరంగా తీర్చలేదు.
- issue: తీర్పు సందర్భంలో עֶלְיוֹן భావం
  choice: శిథిలమైపోతుంది
  alternative: ఉన్నతంగా ఉంటుంది
  rationale: అక్షరార్థ పాఠం ‘ఉన్నతంగా ఉంటుంది’ అయినప్పటికీ సందర్భంలో అది క్లిష్టంగా ఉంది; సమాంతర వాక్యం మరియు విధ్వంసానికి ప్రజల ప్రతిస్పందన శిథిల స్థితిని బలపరుస్తాయి. అయినా మూలపాఠంలోని నిజమైన సందిగ్ధతను పాదసూచికలో స్పష్టంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘మందిరం’ సందర్భాన్ని స్పష్టం చేస్తుంది; ‘ఇలా ఎందుకు చేశాడు?’ అనే ప్రశ్న సహజమైన మాటతీరును నిలుపుతుంది. పాదసూచిక గుర్తులు [a], [b] ప్రధాన పాఠ్యంలో రెండూ ఉన్నాయి.
