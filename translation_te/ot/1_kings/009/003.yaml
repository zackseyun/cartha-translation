  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו שָׁ֠מַעְתִּי אֶת תְּפִלָּתְ/ךָ֣ וְ/אֶת תְּחִנָּתְ/ךָ֮ אֲשֶׁ֣ר הִתְחַנַּ֣נְתָּה לְ/פָנַ/י֒ הִקְדַּ֗שְׁתִּי אֶת הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר בָּנִ֔תָה לָ/שֽׂוּם שְׁמִ֥/י שָׁ֖ם עַד עוֹלָ֑ם וְ/הָי֨וּ עֵינַ֧/י וְ/לִבִּ֛/י שָׁ֖ם כָּל הַ/יָּמִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/003.yaml
  text: And Yahweh said to him[a], “I have heard your prayer and your plea for favor that you made before me. I have consecrated this house that you built, to put my name there forever[c][b], and my eyes and my heart will be there all the days.”
translation:
  language: te
  text: 'యాహ్వే అతనితో ఇలా అన్నాడు: “నీ ప్రార్థనను, నా సన్నిధిలో నీవు వినయంగా చేసిన నీ కృపావిన్నపాన్ని[a] నేను విన్నాను. నా పేరు అక్కడ ఎప్పటికీ ఉంచడానికి నీవు నిర్మించిన ఈ గృహాన్ని[b] నేను పవిత్రపరిచాను. నా కళ్లూ నా హృదయమూ[c] అక్కడ అన్ని దినములూ ఉంటాయి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కృపావిన్నపం” అంటే కృప లేదా అనుగ్రహం కోరుతూ చేసే వినయపూర్వక విన్నపం; “మనవి” లేదా “వేడుకోలు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “ఈ గృహం”; అంటే సొలొమోను నిర్మించిన ఆలయం.
    reason: lexical_alternative
  - marker: c
    text: “నా కళ్లూ నా హృదయమూ” అనేది యాహ్వే నిరంతరం గమనిస్తూ శ్రద్ధ చూపడాన్ని తెలిపే మానవరూపక ప్రయోగం.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో ఉంచింది.
- source_word: תְּפִלָּתְךָ
  choice: నీ ప్రార్థనను
  rationale: విన్నాను అనే క్రియకు సహజమైన తెలుగు కర్మరూపం; విన్నప సందర్భంలోని సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: תְּחִנָּתְךָ
  choice: కృపకోసం చేసిన విజ్ఞాపనను
  rationale: ప్రార్థన అనే సమీప పదంతో ఉన్న భావభేదాన్ని నిలుపుతూ, అనుగ్రహం కోరే వినయపూర్వక విన్నప భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: לְפָנַי
  choice: నా సన్నిధిలో
  rationale: హీబ్రూ ముఖసన్నిధి నుడికారాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో అందిస్తుంది.
- source_word: הִקְדַּשְׁתִּי
  choice: పవిత్రంగా ప్రత్యేకపరిచాను
  rationale: కేవలం ఆచారపూర్వక ప్రతిష్ఠ భావం కాకుండా, దేవుని ఉద్దేశం కోసం పవిత్రంగా వేరుచేయడం అనే causative భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: הַבַּיִת הַזֶּה
  choice: ఈ గృహాన్ని
  rationale: సందర్భంలో ఆలయాన్ని సూచించినా, మూలంలోని ‘గృహం’ అనే పదాన్ని మరియు దాని ధార్మిక ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: לָשׂוּם שְׁמִי שָׁם
  choice: నా పేరు అక్కడ ఉంచడానికి
  rationale: దేవుని నామాన్ని అక్కడ ఉంచడం అనే ఆలయ-నిబంధన నుడికారాన్ని సిద్ధాంతపరమైన వివరణగా విస్తరించకుండా యథాతథంగా నిలుపుతుంది.
- source_word: עַד עוֹלָם
  choice: ఎప్పటికీ
  rationale: దీర్ఘకాలిక, శాశ్వత ఉద్దేశాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עֵינַי וְלִבִּי
  choice: నా కన్నులూ నా హృదయమూ
  rationale: దేవుని నిరంతర దృష్టి, శ్రద్ధ, అభిమానం తెలిపే మానవరూపక చిత్రణను సపాటైన భావానువాదంగా మార్చకుండా నిలుపుతుంది.
- source_word: כָּל הַיָּמִים
  choice: అన్ని రోజులూ
  rationale: ‘ఎల్లప్పుడూ’ అని అమూర్తీకరించకుండా మూలంలోని స్పష్టమైన కాల నుడికారాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘నా కన్నులూ నా హృదయమూ అక్కడే ఉంటాయి’ అనే దేవునికి సంబంధించిన మానవరూపక భాష
  choice: మానవరూపక చిత్రణను నేరుగా నిలుపడం
  alternative: ‘నా దృష్టి, నా శ్రద్ధ ఎల్లప్పుడూ దానిపై ఉంటాయి’ అని భావానువాదం చేయడం
  rationale: మూలపాఠం దేవుని నిరంతర గమనికను, నిబంధనాపూర్వక శ్రద్ధను శరీరాంగాల చిత్రణతో వ్యక్తం చేస్తుంది; దాన్ని వివరణాత్మక భావంగా సపాటుచేయకుండా పాఠంలోని ధార్మిక ఉద్వేగాన్ని నిలుపుతుంది.
- issue: ‘నా పేరు అక్కడ ఎప్పటికీ ఉంచడానికి’ అనే ఆలయ-నామ నుడికారం
  choice: దేవుడు తన ‘పేరు’ అక్కడ ఉంచుతాడనే మూల నుడికారాన్ని నిలుపడం
  alternative: ‘నేను అక్కడ ఎప్పటికీ నివసించడానికి’ లేదా ‘అక్కడ ఎప్పటికీ ఆరాధించబడడానికి’ అని విస్తరించడం
  rationale: మూలం దేవుని పేరు గురించి ప్రత్యేకంగా చెబుతుంది. దేవుని భౌతిక స్థానీకరణగా గానీ, ఆరాధనపై విస్తృత సిద్ధాంత ప్రకటనగా గానీ దాన్ని మార్చకుండా నిజమైన భావపరిధిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘గృహం,’ ‘నా పేరు ఉంచడం,’ ‘నా కన్నులూ నా హృదయమూ,’ ‘అన్ని రోజులూ’ వంటి మూల చిత్రణలు ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి; అవసరమైన వివరణలు పాదసూచికలకు పరిమితం చేయబడ్డాయి.
