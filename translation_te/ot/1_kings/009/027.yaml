lexical_decisions:
- source_word: בָּאֳנִי
  choice: ఓడలో
  rationale: בְּ ఉపసర్గతో ఉన్న אֳנִי ఏకవచన రూపాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఓడలో’గా అనువదించాం.
- source_word: אַנְשֵׁי אֳנִיּוֹת
  choice: నావికులు
  rationale: అక్షరార్థంగా ‘ఓడల మనుషులు’; సందర్భంలో ఓడ నడపడంలో అనుభవమున్న సిబ్బందిని సూచించే సహజ తెలుగు పదం ‘నావికులు’.
- source_word: יֹדְעֵי הַיָּם
  choice: సముద్రం గురించి తెలిసినవారు
  rationale: ‘సముద్రాన్ని తెలిసినవారు’ అనే మూలభావాన్ని, సముద్రయాన పరిజ్ఞానాన్ని సూచించేలా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עִם עַבְדֵי שְׁלֹמֹה
  choice: సొలొమోను సేవకులతో పాటు
  rationale: עִם యొక్క సహవాస భావాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
