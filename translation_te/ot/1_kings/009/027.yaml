  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని ‘ఓడల మనుషులు—సముద్రాన్ని తెలిసినవారు’ అనే పునరుక్తి భావాన్ని ‘వారు నావికులు, సముద్రం గురించి తెలిసినవారు’గా నిలిపాం.
