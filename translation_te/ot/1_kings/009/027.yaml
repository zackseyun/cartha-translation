revisions:
- from: హీరాము ఓడలో తన సేవకులను సొలొమోను సేవకులతో పాటు పంపించాడు. వారు నావికులు, సముద్రం గురించి తెలిసినవారు.
  to: హీరాము తన సేవకులను—ఓడల పనిలో అనుభవం ఉన్న, సముద్రయానంలో నిపుణులైన నావికులను—సొలొమోను సేవకులతో కలిసి ఓడలో పంపించాడు.
  rationale: The revision preserves the singular “ship,” the association with Solomon’s servants, and the twofold Hebrew characterization of Hiram’s servants as shipmen who knew the sea. It also removes the ambiguous pronoun by making the descriptive apposition explicit.
