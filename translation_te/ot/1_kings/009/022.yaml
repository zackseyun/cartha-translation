source:
  edition: WLC
  text: וּ/מִ/בְּנֵי֙ יִשְׂרָאֵ֔ל לֹֽא נָתַ֥ן שְׁלֹמֹ֖ה עָ֑בֶד כִּי הֵ֞ם אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַ/עֲבָדָי/ו֙ וְ/שָׂרָ֣י/ו וְ/שָׁלִשָׁ֔י/ו וְ/שָׂרֵ֥י רִכְבּ֖/וֹ וּ/פָרָשָֽׁי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/022.yaml
  text: But from the sons of Israel Solomon made no servants[a], for they were the men of war, his servants, his commanders, his officers, and the commanders of his chariots and his horsemen.
translation:
  language: te
  text: 'అయితే ఇశ్రాయేలీయులలో ఎవరినీ సొలొమోను బానిసలుగా నియమించలేదు. ఎందుకంటే వారు యుద్ధవీరులు, అతని సేవకులు, సేనాధిపతులు, అతని అధికారులు[a], అతని రథదళాధిపతులు, గుర్రపు రౌతులు.


    [a] లేదా, “అతని సైనిక సహాయకాధికారులు”; “అతని రథదళ అధికారులు.” ఇక్కడి హెబ్రీ పదం సూచించే ప్రాచీన హోదా యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని సైనిక సహాయకాధికారులు”; “అతని రథదళ అధికారులు.” ఇక్కడి హెబ్రీ పదం సూచించే ప్రాచీన హోదా యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం.
    reason: שָׁלִישׁ అనే హోదా యొక్క నిర్దిష్ట స్వరూపం వివాదాస్పదమైనందున, ప్రధాన పాఠంలో విస్తృతమైన “అధికారులు” అనే అనువాదాన్ని ఉంచి, సాధ్యమైన మరింత నిర్దిష్ట అర్థాలను పాదసూచికలో ఇస్తుంది.
lexical_decisions:
- source_word: וּמִבְּנֵי יִשְׂרָאֵל
  choice: అయితే ఇశ్రాయేలీయులలో ఎవ్వరినీ
  rationale: మునుపటి వచనంలోని ఇశ్రాయేలీయేతరుల నిర్బంధ శ్రమకు ఉన్న వ్యత్యాసాన్ని ‘అయితే’ తెలియజేస్తుంది. ‘ఇశ్రాయేలీయులలో ఎవ్వరినీ’ అనేది తెలుగు వాక్య నిర్మాణంలో సహజంగా ఉండి, హెబ్రీలోని ‘ఇశ్రాయేలు కుమారులలోనుండి’ అనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לֹא נָתַן ... עָבֶד
  choice: బానిసగా చేయలేదు
  rationale: ‘ఎవరినైనా బానిసగా నియమించడం/ఉంచడం’ అనే హెబ్రీ ప్రయోగాన్ని, పరిసర వచనాల్లోని నిర్బంధ సేవ నేపథ్యంతో సహా నేరుగా తెలియజేస్తుంది. ‘సేవకునిగా’ అనడం సామాజిక స్థితి తీవ్రతను తగ్గించవచ్చు.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: యుద్ధవీరులు
  rationale: సైనిక యుద్ధసేవ చేసే పురుషులను సూచించే హెబ్రీ నానుడికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: וַעֲבָדָיו
  choice: అతని సేవకులు
  rationale: రాజసభ సందర్భంలో ఈ పదం అధికారులను లేదా పరిచారకులను కూడా సూచించగలదు. విస్తృతార్థాన్ని నిలుపుతూ, మొదటి భాగంలోని బానిస స్థితితో సందర్భానుసారమైన తేడాను చూపుతుంది.
- source_word: וְשָׂרָיו
  choice: సేనాధిపతులు
  rationale: ఈ సైనిక జాబితాలో שׂר అనే నాయకత్వ హోదాకు ‘సేనాధిపతులు’ సందర్భోచితంగా, స్పష్టంగా ఉంటుంది.
- source_word: וְשָׁלִשָׁיו
  choice: ఉన్నత సైనిక అధికారులు
  rationale: శָׁלִישׁ అనే చారిత్రక హోదా ఖచ్చిత స్వరూపం అనిశ్చితం; సాధారణ పాఠకునికి అర్థమయ్యే ప్రధాన అనువాదాన్ని ఇచ్చి, మరింత నిర్దిష్టమైన అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְשָׂרֵי רִכְבּוֹ
  choice: అతని రథదళాధిపతులు
  rationale: సొలొమోను రథసేనపై అధికారమున్న నాయకులను సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: וּפָרָשָׁיו
  choice: గుర్రపు రౌతులు
  rationale: గుర్రాలపై యుద్ధం చేసే సైనికులను సూచించే పదానికి నేరమైన, కాలానుగుణమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: עָבֶד సూచించే సామాజిక స్థితి
  choice: బానిసగా చేయలేదు
  alternative: సేవకునిగా నియమించలేదు
  rationale: పరిసర సందర్భం ఇశ్రాయేలీయేతరులపై విధించిన నిర్బంధ శ్రమను వివరిస్తుంది. అందువల్ల బంధిత సేవ తీవ్రతను తగ్గించకుండా ‘బానిస’ అని అనువదించాం; అయితే తరువాతి וַעֲבָדָיו రాజసేవలోని విస్తృత పాత్రను సూచించగలందున అక్కడ ‘సేవకులు’ అని ఉంచాం.
- issue: אַנְשֵׁי הַמִּלְחָמָה లోని లింగసూచన
  choice: యుద్ధవీరులు
  alternative: యుద్ధవీరులైన పురుషులు
  rationale: హెబ్రీ పదబంధం పురుష యోధులను సూచిస్తుంది. తెలుగులో ‘యుద్ధవీరులు’ ఈ సందర్భంలో సహజంగానే ఆ పురుష సైనిక వర్గాన్ని సూచిస్తుంది; ‘యుద్ధవీరులైన పురుషులు’ మూలానికి మరింత రూపపరంగా దగ్గరైనా అసహజంగా, అనవసర పునరుక్తిగా వినిపిస్తుంది.
- issue: שָׁלִישׁ అనే హోదా యొక్క అనిశ్చిత అర్థం
  choice: ఉన్నత సైనిక అధికారులు[a]
  alternative: సైనిక సహాయకాధికారులు / రథదళ అధికారులు
  rationale: పదం సూచించే ఖచ్చితమైన ప్రాచీన హోదా వివాదాస్పదం. ప్రధాన పాఠంలో విస్తృతమైన అర్థాన్ని ఇచ్చి, సాధ్యమైన నిర్దిష్ట అర్థాలను పాదసూచికలో భద్రపరచడం ద్వారా అనిశ్చితిని నిశ్శబ్దంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సైనిక-రాజకీయ పదజాలం వాడబడింది. మూలంలోని వరుస హోదాలను స్పష్టంగా నిలిపి, అతిగా ప్రాచీనమైన లేదా మతశాఖాపరమైన పదాలను నివారించాం.
