    [a] లేదా, “అతని సైనిక సహాయకాధికారులు”; “అతని రథదళ అధికారులు.” ఇక్కడి హెబ్రీ పదం సూచించే ప్రాచీన హోదా యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం.'
  revised_footnotes:
