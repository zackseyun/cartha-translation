  to: 'అయితే ఇశ్రాయేలీయులలో ఎవరినీ సొలొమోను బానిసలుగా నియమించలేదు. ఎందుకంటే వారు యుద్ధవీరులు, అతని సేవకులు, సేనాధిపతులు, అతని అధికారులు[a], అతని రథదళాధిపతులు, గుర్రపు రౌతులు.


    [a] లేదా, “అతని సైనిక సహాయకాధికారులు”; “అతని రథదళ అధికారులు.” ఇక్కడి హెబ్రీ పదం సూచించే ప్రాచీన హోదా యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం.'
