- source_word: לְפָנָיו
  choice: అతని ఎదుట
  rationale: అధికారస్థుని సమక్షంలో నిలబడటాన్ని సూచించే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానం.
