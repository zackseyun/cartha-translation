id: 1KI.3.8
reference: 1 Kings 3:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַ֨בְדְּ/ךָ֔ בְּ/ת֥וֹךְ עַמְּ/ךָ֖ אֲשֶׁ֣ר בָּחָ֑רְתָּ עַם רָ֕ב אֲשֶׁ֧ר לֹֽא יִמָּנֶ֛ה וְ/לֹ֥א יִסָּפֵ֖ר מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/008.yaml
  text: And your servant is in the midst of your people whom you have chosen[a], a great people[b], too numerous to be counted or numbered.
translation:
  language: te
  text: నీ సేవకుడనైన నేను నీవు ఎన్నుకున్న నీ ప్రజల మధ్య ఉన్నాను. వారు విస్తారమైన జనము[a]; వారి అధిక సంఖ్యవల్ల వారిని లెక్కించడమూ సంఖ్య కట్టడమూ సాధ్యం కాదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అసంఖ్యాకమైన జనము”; హీబ్రూ పదబంధం అక్షరార్థంగా “గొప్ప జనము” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అధిక సంఖ్యవల్ల లెక్కించబడదు, సంఖ్య కట్టబడదు.”
    reason: literal_rendering
lexical_decisions:
- source_word: וְעַבְדְּךָ
  choice: నీ సేవకుడనైన నేను
  rationale: దేవునితో సొలొమోను వినయంగా మాట్లాడుతున్న సందర్భంలో עֶבֶדకు ‘సేవకుడు’ సహజమైనది; ప్రత్యక్ష సంబోధనలోని ప్రథమ పురుష భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בְּתוֹךְ עַמְּךָ
  choice: నీ ప్రజల మధ్య
  rationale: בְּתוֹךְ యొక్క ‘మధ్యలో/నడుమ’ భావాన్ని, עַמְּךָలోని దేవునికి చెందిన ప్రజలు అనే సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: אֲשֶׁר בָּחָרְתָּ
  choice: నీవు ఎన్నుకున్న
  rationale: దేవుడు ఆ ప్రజలను ఎంచుకున్నాడని మూలపాఠం నేరుగా చెప్పే భావాన్ని అదనపు సిద్ధాంత వివరణ లేకుండా నిలుపుతుంది.
- source_word: עַם רָב
  choice: విస్తారమైన జనము
  rationale: ఈ సందర్భంలో רָב ప్రధానంగా సంఖ్యాపరమైన విస్తారాన్ని సూచిస్తుంది; వెంట వచ్చే లెక్కించలేని స్థితి దానిని నిర్ధారిస్తుంది. ‘జనము’ సమూహ ఏకవచన భావాన్ని కాపాడుతుంది.
- source_word: לֹא יִמָּנֶה וְלֹא יִסָּפֵר
  choice: లెక్కించడమూ సంఖ్య కట్టడమూ సాధ్యం కాదు
  rationale: రెండు సమాంతర క్రియలలోని గణించడం/సంఖ్య నిర్ధారించడం అనే దగ్గరి భావాలను తెలుగులో వేరువేరు పదాలతో నిలుపుతుంది.
- source_word: מֵרֹב
  choice: వారి అధిక సంఖ్యవల్ల
  rationale: లెక్కించడం సాధ్యం కాకపోవడానికి వారి విస్తార సంఖ్యే కారణమని מִן־רֹב తెలిపే కారణార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు దేవుడు ఎన్నుకున్న ప్రజలుగా పేర్కొనబడటం
  choice: నీవు ఎన్నుకున్న నీ ప్రజలు
  alternative: నీ ప్రజలు
  rationale: ‘నీవు ఎన్నుకున్న’ అనే మాట మూలపాఠంలో స్పష్టంగా ఉంది; దానిని ఉంచడం నిబంధనాత్మక సంబంధాన్ని కాపాడుతుంది, అయితే తరువాతి సిద్ధాంత భావాలను ఇందులో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవభరితంగా రూపొందించబడింది. ‘సేవకుడు’, ‘ప్రజలు’, ‘ఎన్నుకున్న’ వంటి సుపరిచిత పదాలు మూలంలోని రాజప్రార్థనా గంభీరతను నిలుపుతాయి; సమాంతర హీబ్రూ క్రియలను పూర్తిగా కలిపివేయకుండా రెండింటినీ వ్యక్తం చేశాము.
