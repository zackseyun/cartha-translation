id: 1KI.3.28
reference: 1 Kings 3:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁמְע֣וּ כָל יִשְׂרָאֵ֗ל אֶת הַ/מִּשְׁפָּט֙ אֲשֶׁ֣ר שָׁפַ֣ט הַ/מֶּ֔לֶךְ וַ/יִּֽרְא֖וּ מִ/פְּנֵ֣י הַ/מֶּ֑לֶךְ כִּ֣י רָא֔וּ כִּֽי חָכְמַ֧ת אֱלֹהִ֛ים בְּ/קִרְבּ֖/וֹ לַ/עֲשׂ֥וֹת מִשְׁפָּֽט־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/028.yaml
  text: And all Israel heard of the judgment that the king had rendered[a], and they feared the king[b], because they saw that the wisdom of God was within him to administer justice.
translation:
  language: te
  text: రాజు తీర్చిన తీర్పు గురించి ఇశ్రాయేలంతా విన్నారు. వారు రాజుకు భయపడ్డారు[a], ఎందుకంటే న్యాయం చేయడానికి[b] దేవుని జ్ఞానం అతనిలో ఉందని వారు చూశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజుపట్ల భయభక్తులు కలిగారు,” లేదా “రాజును చూసి విస్మయభరితులయ్యారు.” హీబ్రూ పదప్రయోగం భయం, గౌరవం, విస్మయం అనే భావాలను వ్యక్తం చేయగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “న్యాయం నిర్వహించడానికి,” లేదా “తీర్పు తీర్చడానికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: విన్నారు
  rationale: శׁמע యొక్క ప్రాథమిక అర్థాన్ని నిలుపుతూ, ‘తీర్పు గురించి’ అనే ప్రయోగంతో వార్త తెలిసిందనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలంతా
  rationale: ఇది ప్రతి వ్యక్తిని గణితపరంగా సూచించడంకంటే దేశప్రజలను సమష్టిగా సూచించే హీబ్రూ వాడుకను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: הַמִּשְׁפָּט אֲשֶׁר שָׁפַט הַמֶּלֶךְ
  choice: రాజు తీర్చిన తీర్పు
  rationale: ఒక న్యాయవిచారణలో రాజు ఇచ్చిన నిర్ణయాన్ని సూచించే న్యాయపరమైన పదబంధంగా సహజంగా ఉంది; హీబ్రూలోని మִשְׁפָּט/שָׁפַט పదప్రయోగాన్నీ సాధ్యమైనంతవరకు ప్రతిబింబిస్తుంది.
- source_word: וַיִּרְאוּ מִפְּנֵי הַמֶּלֶךְ
  choice: వారు రాజుకు భయపడ్డారు
  rationale: యָרֵא యొక్క ప్రత్యక్ష భావాన్ని నిలుపుతుంది. సందర్భంలో దీనికి భయంతో పాటు గౌరవం లేదా విస్మయం కూడా ఉండవచ్చనే విస్తృతిని పాదసూచికలో ఉంచాం.
- source_word: כִּי רָאוּ
  choice: ఎందుకంటే … వారు గ్రహించారు
  rationale: כִּי యొక్క కారణార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది. ఇక్కడ ראה కేవలం కంటితో చూడడంకంటే రాజులోని దేవదత్త జ్ఞానాన్ని గుర్తించడాన్ని సూచిస్తున్నందున ‘గ్రహించారు’ సహజంగా ఉంది.
- source_word: חָכְמַת אֱלֹהִים
  choice: దేవుని జ్ఞానం
  rationale: అనిర్దిష్టమైన ‘దైవిక జ్ఞానం’గా మార్చకుండా, אֱלֹהִים అనే స్పష్టమైన దేవుని సూచనను నిలుపుతుంది.
- source_word: בְּקִרְבּוֹ
  choice: అతనిలో ఉంది
  rationale: రాజులో అంతర్గతంగా ఉన్న జ్ఞానాన్ని సూచించే హీబ్రూ రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לַעֲשׂוֹת מִשְׁפָּט
  choice: న్యాయం తీర్చడానికి
  rationale: రాజు న్యాయపరమైన కార్యాన్ని నిర్వహించడానికి ఆ జ్ఞానం ఉన్నదనే ఉద్దేశం లేదా సామర్థ్యాన్ని తెలుపుతుంది; ఒక్క తీర్పుతో మాత్రమే భావాన్ని పరిమితం చేయదు.
theological_decisions:
- issue: אֱלֹהִים ను రాజజ్ఞాన సందర్భంలో అనువదించడం
  choice: దేవుడు
  alternative: దైవికమైన
  rationale: మూలపాఠం జ్ఞానాన్ని స్పష్టంగా దేవునితో సంబంధపరుస్తుంది. వ్యక్తిరహిత విశేషణంగా మార్చడానికి సందర్భంలో ఆధారం లేదు.
- issue: וַיִּרְאוּ מִפְּנֵי הַמֶּלֶךְ లో భయం–గౌరవం మధ్య భావవిస్తృతి
  choice: రాజుకు భయపడ్డారు
  alternative: రాజుపట్ల భయభక్తులు కలిగారు / రాజును చూసి విస్మయభరితులయ్యారు
  rationale: ‘భయపడ్డారు’ హీబ్రూ క్రియ యొక్క ప్రత్యక్ష బలాన్ని కాపాడుతుంది; అయితే దేవుడు ఇచ్చిన జ్ఞానాన్ని గుర్తించిన సందర్భం గౌరవం లేదా విస్మయాన్ని కూడా సూచించవచ్చు. ఆ అనిశ్చితిని పాదసూచిక స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘ఇశ్రాయేలంతా’ సమష్టి జాతీయ భావాన్ని, ‘తీర్పు/న్యాయం’ న్యాయపరమైన పదశైలిని నిలుపుతాయి. మూలంలోని భయం–గౌరవం భావసందిగ్ధతను ప్రధాన పాఠంలో ఏకపక్షంగా పరిష్కరించకుండా పాదసూచికలో భద్రపరిచాం.
