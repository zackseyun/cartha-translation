revisions:
- from: రాజు తీర్చిన తీర్పు గురించి ఇశ్రాయేలంతా విన్నారు. వారు రాజుకు భయపడ్డారు[a]; ఎందుకంటే న్యాయం తీర్చడానికి[b] దేవుని జ్ఞానం అతనిలో ఉందని వారు గ్రహించారు.
