  edition: WLC
  text: בְּ/גִבְע֗וֹן נִרְאָ֧ה יְהֹוָ֛ה אֶל שְׁלֹמֹ֖ה בַּ/חֲל֣וֹם הַ/לָּ֑יְלָה וַ/יֹּ֣אמֶר אֱלֹהִ֔ים שְׁאַ֖ל מָ֥ה אֶתֶּן לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/005.yaml
  text: At Gibeon Yahweh appeared to Solomon in a dream at night[a], and God said, “Ask what I should give you.”
translation:
  language: te
  text: గిబియోనులో యాహ్వే సొలొమోనుకు రాత్రివేళ కలలో[a] ప్రత్యక్షమయ్యాడు. దేవుడు, “నేను నీకు ఏమి ఇవ్వాలో అడుగు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: ‘రాత్రియొక్క కలలో’; అంటే రాత్రివేళ కలలో.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/גִבְעוֹן
  choice: గిబియోనులో
  rationale: בְּ స్థలాన్ని సూచిస్తుంది; తెలుగు స్థలనామంతో ‘-లో’ సహజమైన, మూలార్థానికి నమ్మకమైన రూపం.
- source_word: נִרְאָה
  choice: ప్రత్యక్షమయ్యాడు
  rationale: ఇక్కడ ראה యొక్క నిఫల్ రూపం దైవ ప్రత్యక్షతకు సాధారణంగా వాడే ప్రయోగం; ప్రత్యక్షమైన విధానాన్ని అదనంగా నిర్వచించదు.
- source_word: יְהֹוָה
  choice: యెహోవా
  rationale: దైవ నామమైన יהוהను బిరుదుగా మార్చకుండా తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: אֶל שְׁלֹמֹה
  choice: సొలొమోనుకు
  rationale: אֶל ఇక్కడ ప్రత్యక్షత ఎవరికి కలిగిందో సూచిస్తుంది; తెలుగులో చతుర్థీ విభక్తి సహజం.
- source_word: בַּ/חֲלֹם הַ/לָּיְלָה
  choice: రాత్రి కలలో
  rationale: అక్షరార్థంగా ‘రాత్రి యొక్క కలలో’; ‘రాత్రి కలలో’ అనే తెలుగు రూపం మూల నిర్మాణపు సంక్షిప్తతను నిలుపుతూ సహజంగా ఉంటుంది.
- source_word: וַ/יֹּאמֶר
  choice: అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; తెలుగులో సాధారణ భూతకాల వాక్యక్రియ సరిపోతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: మూలంలో יהוה తర్వాత אֱלֹהִים అనే వేరే సంబోధనకు మార్పు ఉంది; దానిని ‘దేవుడు’గా నిలిపాం.
- source_word: שְׁאַל
  choice: అడుగు
  rationale: ఇది ప్రత్యక్ష ఏకవచన ఆజ్ఞ; ‘అడుగు’ సరళమైన, సహజమైన సమానార్థకం.
- source_word: מָה אֶתֶּן לָךְ
  choice: నేను నీకు ఏమి ఇవ్వాలో
  rationale: ‘నేను నీకు ఏమి ఇవ్వాలి?’ అనే మూల ప్రశ్న ‘అడుగు’పై ఆధారపడే పరోక్ష ప్రశ్నగా ఉంది; తెలుగులో ‘ఏమి ఇవ్వాలో’ దానిని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవ నామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలంలో ప్రత్యేక దైవ నామం నేరుగా ఉంది. దానిని సాధారణ బిరుదుగా మార్చకుండా, ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన నామరూపంతో ఇచ్చాం.
- issue: ఒకే వచనంలో יהוה నుండి אֱלֹהִיםకు పదమార్పు
  choice: ‘యెహోవా’ మరియు ‘దేవుడు’గా వేర్వేరుగా నిలుపడం
  alternative: రెండింటినీ ‘దేవుడు’గా లేదా ‘యెహోవా’గా ఏకరీకరించడం
  rationale: మూలంలోని రెండు భిన్న దైవ సూచనలను శైలీ సౌలభ్యం కోసం కలపకుండా, దాని పదభేదాన్ని మరియు సాధ్యమైన భావతీవ్రతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. చిన్న వాక్యాలుగా విభజించడం తెలుగు పఠనసౌలభ్యానికి అనుకూలం; మూలంలోని భావక్రమం మరియు దైవ నామాల మార్పు యథాతథంగా నిలుపబడ్డాయి.
