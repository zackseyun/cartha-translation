base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/018.yaml
  text: And on the third day after I gave birth[a], this woman also gave birth. And we were together; there was no stranger with us in the house, only the two of us were in the house.
translation:
  language: te
  text: నేను ప్రసవించిన మూడో రోజున ఈ స్త్రీ కూడా ప్రసవించింది. మేము కలిసి ఉన్నాం. ఇంట్లో మాతోపాటు పరాయి వ్యక్తి[a] ఎవరూ లేరు; ఇంట్లో ఉన్నది మేమిద్దరమే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మా ఇంటివారు కాని వ్యక్తి.” హీబ్రూ పదం ఆ గుంపుకు లేదా ఇంటివారికి చెందని వ్యక్తిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי לְלִדְתִּי
  choice: నేను ప్రసవించిన మూడో రోజున
  rationale: לְతో కూడిన క్రియానామ రూపం ఇక్కడ కాలసంబంధాన్ని సూచిస్తుంది. తెలుగులో ఈ రూపం ప్రసవం జరిగిన తరువాతి మూడో రోజును సహజంగా తెలియజేస్తుంది; కథన ప్రవాహం కోసం וַיְהִיని విడిగా కృత్రిమంగా అనువదించలేదు.
- source_word: וַתֵּלֶד גַּם הָאִשָּׁה הַזֹּאת
  choice: ఈ స్త్రీ కూడా ప్రసవించింది
  rationale: הַזֹּאתలోని సూచనాత్మక, కొంత సూటిగా చూపించే భావాన్ని ‘ఈ స్త్రీ’ నిలుపుతుంది; גַּםను ‘కూడా’గా వ్యక్తం చేసింది.
- source_word: וַאֲנַחְנוּ יַחְדָּו
  choice: మేము కలిసి ఉన్నాం
  rationale: יַחְדָּו యొక్క ప్రత్యక్ష అర్థమైన ‘కలిసి’ని నిలిపి, ‘ఒంటరిగా’ అనే భావాన్ని ముందుగానే చేర్చలేదు; తరువాతి వాక్యమే మరెవరూ లేరని స్పష్టం చేస్తుంది.
- source_word: אֵין זָר אִתָּנוּ בַּבַּיִת
  choice: ఇంట్లో మాతోపాటు పరాయి వ్యక్తి ఎవరూ లేరు
  rationale: זָר అనేది ఆ గుంపుకు లేదా ఇంటివారికి చెందని వ్యక్తిని సూచించగలదు. ‘పరాయి వ్యక్తి’ దాని పదార్థాన్ని నిలుపుతూ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: זוּלָתִי שְׁתַּיִם אֲנַחְנוּ בַּבָּיִת
  choice: ఇంట్లో ఉన్నది మేమిద్దరమే
  rationale: זוּלָתִי తెలిపే మినహాయింపు, ప్రత్యేకతను ‘మేమిద్దరమే’ సహజంగా వ్యక్తం చేస్తుంది. మూలంలోని ‘ఇంట్లో’ అనే పునరుక్తిని కూడా సాక్షులు మరెవరూ లేరనే నొక్కిచెప్పే భావం కోసం నిలిపింది.
