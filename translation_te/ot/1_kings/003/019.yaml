  text: And this woman's son died in the night[b][a], because she lay on him.
translation:
  language: te
  text: ఈ స్త్రీ కుమారుడు రాత్రివేళ చనిపోయాడు, ఎందుకంటే ఆమె అతని మీద పడుకొని ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
