lexical_decisions:
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: మూత్ క్రియ యొక్క కథన భూతకాల రూపం గతంలో జరిగిన సంఘటనను సూచిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘చనిపోయాడు’ సహజంగా ఉంటుంది.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: హీబ్రూ నామవాచకం లింగనిర్దిష్టంగా ‘కుమారుడు’ అని అర్థం; ‘బిడ్డ’ కంటే మూలంలోని నిర్దిష్టతను ఇది నిలుపుతుంది.
- source_word: בֶּן הָאִשָּׁה הַזֹּאת
  choice: ఈ స్త్రీ కుమారుడు
  rationale: సంబంధార్థక నిర్మాణాన్ని తెలుగులో సహజమైన స్వామ్య పదబంధంగా అనువదించబడింది.
- source_word: לָיְלָה
  choice: రాత్రివేళ
  rationale: ఇది సంఘటన జరిగిన సమయాన్ని సూచించే కాలవాచక ప్రయోగం; ‘రాత్రివేళ’ ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: אֲשֶׁר
  choice: దానికి కారణం
  rationale: ఈ సందర్భంలో సంబంధార్థక పదం మరణానికి దారితీసిన పరిస్థితిని పరిచయం చేస్తుంది. కారణార్థాన్ని ప్రధాన పాఠంలో స్పష్టం చేస్తూ, దాని రూపపరమైన అస్పష్టతను పాదసూచికలో నిలుపబడింది.
- source_word: שָׁכְבָה עָלָיו
  choice: ఆమె అతని మీద పడుకొని ఉండడం
  rationale: శాఖవ్ మరియు ‘మీద’ అనే ఉపసర్గ కలయిక ఆమె శిశువు మీద పడుకొని ఉండడాన్ని సూచిస్తుంది; ‘పడుకొని ఉండడం’ ఉద్దేశపూర్వక చర్యను అనవసరంగా సూచించకుండా భౌతిక స్థితిని తెలియజేస్తుంది.
