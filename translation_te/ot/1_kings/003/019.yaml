  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని ‘కుమారుడు’ అనే లింగనిర్దిష్ట పదం నిలుపబడింది. కారణార్థం పాఠ్యంలో సహజంగా వ్యక్తం చేయబడగా, אֲשֶׁר లోని సంబంధార్థక/కాలార్థక సాధ్యత పాదసూచికలో భద్రపరచబడింది.
