id: 1KI.3.15
reference: 1 Kings 3:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַ֥ץ שְׁלֹמֹ֖ה וְ/הִנֵּ֣ה חֲל֑וֹם וַ/יָּב֨וֹא יְרוּשָׁלִַ֜ם וַֽ/יַּעֲמֹ֣ד לִ/פְנֵ֣י אֲר֣וֹן בְּרִית אֲדֹנָ֗/י וַ/יַּ֤עַל עֹלוֹת֙ וַ/יַּ֣עַשׂ שְׁלָמִ֔ים וַ/יַּ֥עַשׂ מִשְׁתֶּ֖ה לְ/כָל עֲבָדָֽי/ו׀׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/015.yaml
  text: Then Solomon awoke[a], and behold, it was a dream. And he came to Jerusalem and stood before the ark of the covenant of the LORD, and offered up burnt offerings and made peace offerings, and made a feast for all his servants.
translation:
  language: te
  text: అప్పుడు సొలొమోను మేల్కొన్నాడు; ఇదంతా కల అని అతనికి తెలిసింది. అతడు యెరూషలేముకు వచ్చి ప్రభువు నిబంధన మందసం ఎదుట నిలబడ్డాడు. అతడు దహనబలులు అర్పించి, సమాధానబలులు[a] సమర్పించాడు. తన సేవకులందరికీ విందు ఏర్పాటు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సహవాస బలులు”; ఈ పదం బలిభోజనంలో పాల్గొనేవారి సహవాసాన్ని ప్రత్యేకంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַץ
  choice: మేల్కొన్నాడు
  rationale: నిద్రనుండి మేల్కొనడాన్ని సూచించే సాధారణ క్రియ; కథనశైలిలో సహజంగా ఉంది.
- source_word: וְהִנֵּה חֲלוֹם
  choice: చూడగా, అది కల
  rationale: הִנֵּה కలిగించే ఆకస్మిక గ్రహింపు భావాన్ని ‘చూడగా’ నిలుపుతుంది; తెలుగులో వాక్యం సహజంగా ఉండేందుకు ‘అది’ చేర్చబడింది.
- source_word: וַיָּבֹא יְרוּשָׁלִַם
  choice: యెరూషలేముకు వచ్చి
  rationale: בוא యొక్క ప్రత్యక్ష అర్థమైన రావడం/చేరడం నిలుపబడింది; మూలంలో స్పష్టంగా లేని ‘తిరిగి’ అనే భావాన్ని చేర్చలేదు.
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: ఎదుట నిలబడ్డాడు
  rationale: ఎవరి లేదా దేని సన్నిధిలో నిలబడటాన్ని తెలిపే హీబ్రూ ప్రయోగానికి స్పష్టమైన తెలుగు రూపం.
- source_word: אֲרוֹן בְּרִית אֲדֹנָי
  choice: ప్రభువు నిబంధన మందసం
  rationale: నిబంధనకు సంబంధించిన పవిత్ర పెట్టెను ‘మందసం’గా, అֲדֹנָי అనే దైవ బిరుదును ‘ప్రభువు’గా అనువదించింది.
- source_word: עֹלוֹת
  choice: దహనబలులు
  rationale: బలిపీఠంపై పూర్తిగా దహనం చేసే బలి రకానికి తెలుగులో స్థిరమైన, స్పష్టమైన పదం.
- source_word: וַיַּעַל
  choice: అర్పించి
  rationale: బలులను బలిపీఠంపై సమర్పించే ఆచారార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: שְׁלָמִים
  choice: సమాధాన బలులు
  rationale: ఈ ప్రత్యేక బలి వర్గానికి సాంప్రదాయికంగా దగ్గరైన పదం; అందులోని సహవాస భోజన కోణాన్ని పాదటిప్పణి సూచిస్తుంది.
- source_word: מִשְׁתֶּה
  choice: విందు
  rationale: సందర్భంలోని ఉత్సవ భోజనాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: לְכָל עֲבָדָיו
  choice: తన సేవకులందరికీ
  rationale: עֲבָדִים అనే విస్తృత పదాన్ని నేరుగా అనువదిస్తుంది; ‘అధికారులు’ అని పరిమితం చేయదు.
theological_decisions:
- issue: אֲדֹנָי అనే దైవ బిరుదు అనువాదం
  choice: ప్రభువు
  alternative: యెహోవా
  rationale: అందించిన హీబ్రూ పాఠంలో ఉన్న పదం אֲדֹנָי (‘ప్రభువు’), יהוה కాదు. కాబట్టి మూలపాఠ భేదాన్ని చెరపకుండా దైవ బిరుదును ‘ప్రభువు’గా ఉంచింది.
- issue: שְׁלָמִים బలి వర్గం యొక్క భావం
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు
  rationale: మూలపదానికి ‘సమాధానం/సంపూర్ణత’తో సంబంధం ఉన్నప్పటికీ, ఈ బలిలో పంచుకునే భోజనం వల్ల సహవాస భావమూ ఉంది. ప్రధాన పాఠంలో స్థిరమైన పదాన్ని ఉంచి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. హీబ్రూ వాక్యక్రమాన్ని యథాశక్తి నిలుపుతూ, తెలుగులో పునరుక్తి అసహజంగా మారకుండా చిన్న వాక్యాలుగా విభజించబడింది. పాదటిప్పణి గుర్తు సంబంధిత ‘సమాధాన బలులు’ పదం తరువాత ఉంచబడింది.
