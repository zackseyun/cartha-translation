  yaml_path: translation/ot/1_kings/003/024.yaml
  text: Then the king said, “Bring me a sword.” So they brought the sword before the king.
translation:
  language: te
  text: అప్పుడు రాజు, “నాకు ఒక ఖడ్గం తీసుకురండి” అన్నాడు. వారు ఆ ఖడ్గాన్ని రాజు ఎదుటకు తీసుకొచ్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని తదుపరి చర్యకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ ఆ వరుసను సహజంగా తెలియజేస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: నిర్దిష్ట నామవాచకానికి సహజమైన తెలుగు రూపం; సందర్భంలో ఏ రాజో స్పష్టంగా ఉంది.
- source_word: קְחוּ לִי
  choice: నా దగ్గరకు ... తీసుకురండి
  rationale: לקח యొక్క మౌలిక భావం ‘తీసుకోండి’ అయినా, ఇక్కడ వస్తువును రాజు వద్దకు తెప్పించమనే సందర్భార్థం ఉంది. ‘నా దగ్గరకు తీసుకురండి’ గమ్యాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: חָרֶב
  choice: ఒక ఖడ్గం
  rationale: మొదటి ప్రస్తావనలో నిర్దిష్ట ఉపపదం లేదు; అందువల్ల ‘ఒక ఖడ్గం’ అనిర్దిష్ట భావాన్ని నిలుపుతుంది.
- source_word: וַיָּבִאוּ
  choice: వారు ... తీసుకొచ్చారు
  rationale: బహువచన క్రియను స్పష్టంగా ప్రతిబింబిస్తూ, ఆజ్ఞకు వెంటనే జరిగిన ప్రతిస్పందనను సహజ తెలుగు కథనశైలిలో అందిస్తుంది.
- source_word: הַחֶרֶב
  choice: ఆ ఖడ్గాన్ని
  rationale: రెండవ ప్రస్తావనలో నిర్దిష్ట ఉపపదం ఉంది; ముందుగా కోరిన అదే ఖడ్గాన్ని సూచించేందుకు ‘ఆ’ సహజమైన అనాఫరిక రూపం.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: రాజు ఎదుటకు
  rationale: రాజసభా సందర్భంలో ‘రాజు సమక్షానికి/ముందుకు’ అనే భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే రాజసభా కథనానికి తగిన గౌరవప్రదమైన శైలి. ‘ఖడ్గం’ అనే పదం సందర్భానికి తగిన సాహిత్య గాంభీర్యాన్ని నిలుపుతుంది.
