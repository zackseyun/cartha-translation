- from: 'అప్పుడు బతికున్న కుమారుడు ఎవరిదో ఆ స్త్రీ, తన కుమారునిపై కనికరంతో హృదయం తల్లడిల్లగా[a], రాజుతో ఇలా అంది: “దయచేసి, నా ప్రభూ! బతికున్న బిడ్డను ఆమెకే ఇచ్చేయండి; అతణ్ణి ఎంతమాత్రం చంపవద్దు[b].” అయితే రెండో స్త్రీ, “అతడు నాకూ దక్కకూడదు, నీకూ దక్కకూడదు; అతణ్ణి రెండు ముక్కలుగా నరకండి” అంది.'
  to: 'అప్పుడు బతికున్న కుమారుని తల్లి, తన కుమారునిపట్ల ఆమె కనికరం ఉప్పొంగడంతో[a], రాజుతో ఇలా అంది: “దయచేసి, నా ప్రభూ! బతికున్న బిడ్డను ఆమెకు ఇవ్వండి; అతణ్ణి ఎంతమాత్రం చంపవద్దు[b].” అయితే రెండో స్త్రీ, “అతడు నాకూ దక్కకూడదు, నీకూ దక్కకూడదు; అతణ్ణి రెండు ముక్కలుగా నరకండి” అంది.'
  rationale: సవరణలు అర్థాన్ని మార్చకుండా తెలుగును మరింత సహజంగా చేశాయి మరియు హీబ్రూ మూలంలోని సాధారణ దత్తివాచకమైన ‘ఆమెకు’ను మాత్రమే ప్రతిబింబించాయి. బలపరచబడిన నిషేధం ‘ఎంతమాత్రం చంపవద్దు’గా, చివరి క్రూర ఆజ్ఞ ‘రెండు ముక్కలుగా నరకండి’గా నిలిపాం. పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వద్దనే ఉంచబడ్డాయి.
