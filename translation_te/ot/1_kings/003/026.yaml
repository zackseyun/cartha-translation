  text: וַ/תֹּ֣אמֶר הָ/אִשָּׁה֩ אֲשֶׁר בְּנָ֨/הּ הַ/חַ֜י אֶל הַ/מֶּ֗לֶךְ כִּֽי נִכְמְר֣וּ רַחֲמֶי/הָ֮ עַל בְּנָ/הּ֒ וַ/תֹּ֣אמֶר בִּ֣י אֲדֹנִ֗/י תְּנוּ לָ/הּ֙ אֶת הַ/יָּל֣וּד הַ/חַ֔י וְ/הָמֵ֖ת אַל תְּמִיתֻ֑/הוּ וְ/זֹ֣את אֹמֶ֗רֶת גַּם לִ֥/י גַם לָ֛/ךְ לֹ֥א יִהְיֶ֖ה גְּזֹֽרוּ־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/026.yaml
  text: Then the woman whose son was alive said to the king[a], because her compassion was stirred for her son, and she said, "Please, my lord, give her the living child, and do not put him to death." But the other said, "It shall be neither mine nor yours[b]; cut him in two."
translation:
  language: te
  text: 'అప్పుడు బతికున్న కుమారుని తల్లి, తన కుమారునిపట్ల ఆమె కనికరం ఉప్పొంగడంతో[a], రాజుతో ఇలా అంది: “దయచేసి, నా ప్రభూ! బతికున్న బిడ్డను ఆమెకు ఇవ్వండి; అతణ్ణి ఎంతమాత్రం చంపవద్దు[b].” అయితే రెండో స్త్రీ, “అతడు నాకూ దక్కకూడదు, నీకూ దక్కకూడదు; అతణ్ణి రెండు ముక్కలుగా నరకండి” అంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ నుడికారం పదశః ‘ఆమె కనికరం వేడెక్కింది’; ఇది తన కుమారునిపట్ల కలిగిన తీవ్రమైన మాతృకనికరాన్ని వ్యక్తం చేస్తుంది.
    reason: cultural_note
  - marker: b
    text: హీబ్రూలో ‘చంపవద్దు’ అనే నిషేధం బలంగా ఉద్ఘాటించబడింది.
    reason: lexical_note
lexical_decisions:
- source_word: נִכְמְרוּ רַחֲמֶיהָ
  choice: కనికరంతో హృదయం తల్లడిల్లగా
  rationale: כמר + רחמים అనే హీబ్రూ నుడికారం తీవ్రమైన అంతరంగ కనికరాన్ని సూచిస్తుంది. పదశః శరీరాంతర భాగాల ప్రస్తావన ఆధునిక తెలుగులో అసహజంగా ఉంటుంది; ఈ రూపం భావోద్వేగ తీవ్రతను సహజంగా నిలుపుతుంది.
- source_word: בִּי אֲדֹנִי
  choice: దయచేసి, నా ప్రభూ!
  rationale: בִּי ఇక్కడ విభక్తి సంబంధమైన అర్థంలో కాక, అత్యవసరమైన వినయపూర్వక విన్నపాన్ని తెలిపే అవ్యయంగా ఉంది.
- source_word: הַיָּלוּד הַחַי
  choice: బతికున్న బిడ్డ
  rationale: יַלוּד పుట్టిన శిశువు లేదా బిడ్డను సూచిస్తుంది. సందర్భంలోని వయస్సును అతిగా నిర్దిష్టం చేయకుండా, జీవించి ఉన్న బిడ్డకు చనిపోయిన బిడ్డతో ఉన్న వ్యత్యాసాన్ని ఈ ఎంపిక స్పష్టంగా ఉంచుతుంది.
- source_word: וְהָמֵת אַל תְּמִיתֻהוּ
  choice: అతణ్ణి ఎంతమాత్రం చంపవద్దు
  rationale: క్రియానామ రూపం మరియు సమాపక క్రియ కలయిక నిషేధాన్ని బలపరుస్తుంది. ‘ఎంతమాత్రం’ ఆ ఉద్ఘాటనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְזֹאת אֹמֶרֶת
  choice: అయితే రెండో స్త్రీ ... అంది
  rationale: זֹאת వ్యత్యాసంగా మరో స్త్రీని సూచిస్తుంది. ‘ఈమె’ కంటే ‘రెండో స్త్రీ’ సందర్భాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: גַּם לִי גַם לָךְ לֹא יִהְיֶה
  choice: అతడు నాకూ దక్కకూడదు, నీకూ దక్కకూడదు
  rationale: అవ్యక్త కర్త బిడ్డే. ‘దక్కకూడదు’ అనేది ఇరువురిలో ఎవరికీ అతడు చెందకూడదనే స్వాధీన పోటీని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: גְּזֹרוּ
  choice: అతణ్ణి రెండు ముక్కలుగా నరకండి
  rationale: ఆజ్ఞ ఆకస్మికంగా, క్రూరంగా ఉంది. ముందరి వచనంలోని రాజాజ్ఞ వల్ల రెండుగా నరకడమే ఉద్దేశమని సందర్భం స్పష్టం చేస్తుంది; తెలుగులో అవసరమైన కర్మను, ఫలితాన్ని వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. రాజును ఉద్దేశించిన గౌరవ బహువచనాన్ని నిలిపి, రెండో స్త్రీతో మాట్లాడే చోట ఏకవచనాన్ని వాడాం.
