    rationale: ‘బతికున్న కుమారుడు ఎవరిదో ఆ స్త్రీ’ వ్యాకరణపరంగా అర్థమయ్యినా సహజ కథన తెలుగు కాదు. ‘బతికున్న కుమారుని తల్లి’ మూలంలోని ‘whose son was alive’ను సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
