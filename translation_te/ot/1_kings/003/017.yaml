  yaml_path: translation/ot/1_kings/003/017.yaml
  text: Then one woman said, “Please, my lord, I and this woman live in one house, and I gave birth while she was in the house with me.
translation:
  language: te
  text: 'అప్పుడు ఆ స్త్రీలలో ఒకామె ఇలా అంది: “దయచేసి, నా ప్రభువా, నేనూ ఈ స్త్రీయూ ఒకే ఇంట్లో నివసిస్తున్నాం; ఆమె నాతో ఇంట్లో ఉండగా నేను బిడ్డను కన్నాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: నా ప్రభువా, దయచేసి వినండి
  rationale: రాజును ఉద్దేశించిన గౌరవపూర్వక విన్నప సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; בִּי ఇక్కడ ‘నాలో’ అనే అర్థంలో కాక, వినయపూర్వక అభ్యర్థనగా ఉంది.
- source_word: יֹשְׁבֹת בְּבַיִת אֶחָד
  choice: ఒకే ఇంట్లో నివసిస్తున్నాం
  rationale: హీబ్రూ వర్తమాన కృదంత రూపంలోని కొనసాగుతున్న సహనివాస భావాన్ని నిలుపుతుంది; ‘ఒకే ఇల్లు’ అనే ఏకత్వ ఉద్ఘాటనను సహజంగా అందిస్తుంది.
- source_word: וָאֵלֵד
  choice: నేను బిడ్డను కన్నాను
  rationale: ‘నేను ప్రసవించాను’ కంటే సాధారణ పాఠకులకు సహజంగా ఉండే రీతిలో ప్రసవార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עִמָּהּ בַּבָּיִת
  choice: ఇంట్లో ఆమె నాతో ఉన్నప్పుడు
  rationale: ఆ స్త్రీ ప్రసవ సమయంలో అదే ఇంట్లో తనతో ఉందనే సందర్భాన్ని మూలానికి దగ్గరగా, స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; న్యాయస్థానంలో రాజును సంబోధించే గౌరవాన్ని కాపాడుతూ, సాధారణ పాఠకులకు సహజంగా వినిపించే వాక్యనిర్మాణం ఉపయోగించబడింది.
