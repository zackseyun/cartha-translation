source:
  edition: WLC
  text: וַ/יֶּאֱהַ֤ב שְׁלֹמֹה֙ אֶת יְהוָ֔ה לָ/לֶ֕כֶת בְּ/חֻקּ֖וֹת דָּוִ֣ד אָבִ֑י/ו רַ֚ק בַּ/בָּמ֔וֹת ה֥וּא מְזַבֵּ֖חַ וּ/מַקְטִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/003.yaml
  text: Solomon loved Yahweh[a], walking in the statutes of David his father; only[b], he was sacrificing and burning incense at the high places.
translation:
  language: te
  text: సొలొమోను యెహోవాను ప్రేమించి, తన తండ్రి దావీదు నియమాల ప్రకారం నడుచుకున్నాడు. అయితే[a] అతడు ఉన్నత స్థలాల్లో[b] బలులు అర్పిస్తూ ధూపం వేస్తూ ఉండేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “ఒక్క విషయం తప్ప: అతడు ఉన్నత స్థలాల్లో బలులు అర్పిస్తూ ధూపం వేస్తూ ఉండేవాడు.”'
    reason: హీబ్రూ רַק పదం ముందున్న సానుకూల వర్ణనకు ‘అయితే’ అనే పరిమితినీ, ‘ఒక్క విషయం తప్ప’ అనే మినహాయింపు భావాన్నీ ఇవ్వగలదు.
  - marker: b
    text: “ఉన్నత స్థలాలు” అంటే సాధారణంగా స్థానికంగా ఎత్తైన ప్రదేశాల్లో లేదా ఎత్తుగా నిర్మించిన వేదికల వద్ద ఉన్న ఆరాధనా స్థలాలు.
    reason: ప్రాచీన ఇశ్రాయేలు ఆరాధనా సంస్కృతికి సంబంధించిన పదాన్ని ఆధునిక పాఠకులకు వివరిస్తుంది.
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: ప్రేమించాడు
  rationale: אהב అనే క్రియ ప్రేమను నేరుగా తెలియజేస్తుంది. కథకుడు సొలొమోనుకు ఇచ్చిన సానుకూల అంచనాను ఈ పదం సహజంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: לָלֶכֶת
  choice: నడుచుకున్నాడు
  rationale: ‘నడవడం’ అనే హీబ్రూ రూపకం ఇక్కడ జీవన ప్రవర్తనను సూచిస్తుంది. తెలుగులో ‘నియమాల ప్రకారం నడుచుకోవడం’ అదే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּחֻקּוֹת
  choice: నియమాల ప్రకారం
  rationale: חֻקּוֹת నిర్దేశించబడిన కట్టడలు లేదా శాసనాలను సూచిస్తుంది. ‘నియమాలు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, విధిగా పాటించాల్సిన ప్రమాణాల భావాన్ని నిలుపుతుంది.
- source_word: דָּוִד אָבִיו
  choice: తన తండ్రి దావీదు
  rationale: హీబ్రూ సంబంధాన్ని తెలుగులో సహజమైన పదక్రమంతో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: רַק
  choice: అయితే
  rationale: ముందున్న సానుకూల అంచనాకు పరిమితి లేదా మినహాయింపును జోడించే రַק భావాన్ని ‘అయితే’ సహజంగా తెలియజేస్తుంది; దానిని పూర్తిగా ఖండనగా మార్చదు.
- source_word: בַּבָּמוֹת
  choice: ఉన్నత స్థలాల్లో
  rationale: בָּמוֹת స్థానికంగా ఎత్తైన ప్రదేశాల్లో లేదా ఎత్తుగా నిర్మించిన వేదికల వద్ద ఉన్న ఆరాధనా స్థలాలను సూచిస్తుంది. సాంస్కృతిక వివరణను పాదసూచికలో ఇచ్చి, మూలపద రూపకాన్ని ప్రధాన వాక్యంలో నిలిపాం.
- source_word: מְזַבֵּחַ
  choice: బలులు అర్పిస్తూ ఉండేవాడు
  rationale: వర్తమాన కృదంతం అలవాటుగా లేదా కొనసాగుతూ జరిగిన కార్యాన్ని సూచిస్తుంది. ఈ తెలుగు రూపం ఆ పునరావృత భావాన్ని నిలుపుతుంది.
- source_word: וּמַקְטִיר
  choice: ధూపం వేస్తూ ఉండేవాడు
  rationale: ఆరాధనా సందర్భంలో קטר హిఫీల్ ధూపాన్ని లేదా అర్పణను పొగగా పైకి లేపడాన్ని సూచించగలదు. ముందున్న బలి అర్పణతో వేరుచేసి చెప్పడానికి ‘ధూపం వేయడం’ స్పష్టమైన సహజ అనువాదం.
theological_decisions:
- issue: సొలొమోను ఆరాధనా ఆచారంపై కథకుని అంచనా
  choice: సొలొమోను యెహోవాను ప్రేమించాడని సానుకూలంగా చెప్పి, అదే సమయంలో అతడు ఉన్నత స్థలాల్లో ఆరాధించాడనే పరిమితిని ‘అయితే’తో నిలిపాం.
  alternative: ప్రారంభ ప్రశంసను వ్యంగ్యంగా లేదా పూర్తిగా మందలింపుగా చదవడం; లేక ఉన్నత స్థలాల ఆరాధనకు ఎలాంటి అభ్యంతరం లేదని చూపడం.
  rationale: వాక్య నిర్మాణం ముందుగా ప్రశంసను ఇస్తుంది; తరువాత רַק ద్వారా దానికి పరిమితిని జోడిస్తుంది. అందువల్ల ప్రశంసనూ, అసౌకర్యకరమైన పరిమితినీ రెండింటినీ పరిష్కరించకుండా నిలపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథన శైలిని ఉపయోగించాం. హీబ్రూ ‘నడవడం’ రూపకాన్ని తెలుగులో సహజమైన ‘నియమాల ప్రకారం నడుచుకోవడం’గా ఇచ్చాం. కృదంతాల నిరంతర లేదా అలవాటు భావాన్ని ‘అర్పిస్తూ… వేస్తూ ఉండేవాడు’ అనే రూపంతో నిలిపాం.
