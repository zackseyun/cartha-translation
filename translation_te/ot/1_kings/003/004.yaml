  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ הַ/מֶּ֤לֶךְ גִּבְעֹ֨נָ/ה֙ לִ/זְבֹּ֣חַ שָׁ֔ם כִּ֥י הִ֖יא הַ/בָּמָ֣ה הַ/גְּדוֹלָ֑ה אֶ֤לֶף עֹלוֹת֙ יַעֲלֶ֣ה שְׁלֹמֹ֔ה עַ֖ל הַ/מִּזְבֵּ֥חַ הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/004.yaml
  text: And the king went to Gibeon to sacrifice there[a], for that was the great high place. Solomon offered a thousand burnt offerings on that altar.
translation:
  language: te
  text: రాజు అక్కడ బలి అర్పించడానికి గిబ్యోనుకు వెళ్లాడు; ఎందుకంటే అదే గొప్ప ఉన్నత స్థలం[a]. సొలొమోను ఆ బలిపీఠం మీద వెయ్యి దహనబలులు అర్పించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రధానమైన ఉన్నత స్థలం.” హీబ్రూ విశేషణం పరిమాణంలో గొప్పదనాన్ని లేదా ప్రాముఖ్యతను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ הַמֶּלֶךְ גִּבְעֹנָה
  choice: రాజు ... గిబ్యోనుకు వెళ్లాడు
  rationale: הלך యొక్క సాధారణ కథనార్థాన్ని ‘వెళ్లాడు’గా, స్థలనామానికి జతైన దిశాసూచక ה־ను ‘గిబ్యోనుకు’గా సహజమైన తెలుగులో అందిస్తుంది.
- source_word: לִזְבֹּחַ שָׁם
  choice: బలి అర్పించడానికి
  rationale: זבח సూచించే బలియర్పణ క్రియను ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; ‘అక్కడ’ అనే భావం తరువాతి ‘అక్కడే’లో సహజంగా కలిసింది.
- source_word: הַבָּמָה הַגְּדוֹלָה
  choice: ప్రసిద్ధమైన ఉన్నత స్థలం
  rationale: במה అనే ఆరాధనా స్థలానికి ‘ఉన్నత స్థలం’ అనే చారిత్రక-మతపరమైన పదాన్ని నిలుపుతూ, גדולה ఇక్కడ పరిమాణం లేదా ప్రాముఖ్యతను సూచించగల అస్పష్టతను పాదసూచికలో భద్రపరుస్తుంది.
- source_word: אֶלֶף עֹלוֹת
  choice: వెయ్యి దహనబలులు
  rationale: עֹלוֹת అనేది సాధారణ బలులు కాక పూర్తిగా దహనం చేసే బలులను సూచిస్తుంది; సంఖ్యను యథాతథంగా ఉంచింది.
- source_word: יַעֲלֶה שְׁלֹמֹה
  choice: సొలొమోను ... అర్పించాడు
  rationale: עלה హిఫీల్ రూపం దహనబలులను ‘అర్పించడం’ అనే స్థిరమైన ఆచారార్థాన్ని కలిగిస్తుంది. ఈ కథన సందర్భంలో సాధారణ భూతకాలం అనవసరమైన అలవాటు భావాన్ని రుద్దదు.
- source_word: עַל הַמִּזְבֵּחַ הַהוּא
  choice: ఆ బలిపీఠం మీద
  rationale: మూలంలోని సంబంధవాచకాన్ని మరియు సూచనాత్మక ‘ఆ’ అనే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: దేవాలయ నిర్మాణానికి ముందున్న ఆరాధనా సందర్భంలో במה అనువాదం
  choice: ఉన్నత స్థలం
  alternative: ఆరాధనా స్థలం / పుణ్యస్థలం
  rationale: సాధారణ ‘ఆరాధనా స్థలం’గా మృదువుపరచకుండా, ఇశ్రాయేలు చరిత్రలోని ఈ ప్రత్యేక ఆరాధనా ప్రదేశానికి సంబంధించిన పదాన్ని మరియు దానితో ముడిపడిన వేదాంతపరమైన ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలి. ‘ఉన్నత స్థలం,’ ‘దహనబలులు,’ ‘బలిపీఠం’ వంటి బైబిలు చారిత్రక-ఆరాధనా పదాలను స్పష్టతతో నిలిపింది.
