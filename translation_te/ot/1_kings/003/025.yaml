  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదప్రయోగం. మూలంలోని తీవ్రమైన రాజాజ్ఞను మృదువుగా చేయకుండా అనువదించబడింది.
