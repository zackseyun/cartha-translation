  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ גִּזְר֛וּ אֶת הַ/יֶּ֥לֶד הַ/חַ֖י לִ/שְׁנָ֑יִם וּ/תְנ֤וּ אֶֽת הַ/חֲצִי֙ לְ/אַחַ֔ת וְ/אֶֽת הַ/חֲצִ֖י לְ/אֶחָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/025.yaml
  text: Then the king said[a], “Cut the living child in two, and give half to the one and half to the other.”
translation:
  language: te
  text: 'అప్పుడు రాజు ఇలా అన్నాడు: “బతికున్న బిడ్డను రెండు ముక్కలుగా నరికి, ఒక సగాన్ని ఒకామెకు, మరో సగాన్ని ఇంకొకామెకు ఇవ్వండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ దాని క్రమానుగత భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: నిర్దిష్ట నామవాచకానికి సందర్భానుగుణమైన సహజ తెలుగు రూపం; తెలుగులో ప్రత్యేక ఆర్టికల్ అవసరం లేదు.
- source_word: גִּזְרוּ
  choice: నరికి
  rationale: గజర్ ధాతువు ఇక్కడ శారీరకంగా కోసి వేరుచేయాలనే బహువచన ఆజ్ఞ. ‘నరికి’ ఆ ఆజ్ఞలోని కఠినతను, స్పష్టతను నిలుపుతుంది.
- source_word: הַיֶּלֶד הַחַי
  choice: బతికున్న బిడ్డను
  rationale: చుట్టుపక్కల కథనంలోని చనిపోయిన బిడ్డకు విరుద్ధంగా ఉన్న జీవస్థితిని సహజమైన తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: לִשְׁנָיִם
  choice: రెండు ముక్కలుగా
  rationale: రెండు భాగాలుగా విభజించడాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది; ‘నరికి’ అనే క్రియతో ‘ముక్కలుగా’ చక్కగా సరిపోతుంది.
- source_word: וּתְנוּ
  choice: ఇవ్వండి
  rationale: మొదటి ఆజ్ఞకు అనుసంధానమైన రెండవ బహువచన ఆజ్ఞను గౌరవసూచక/బహువచన తెలుగు ఆజ్ఞారూపంలో అందిస్తుంది.
- source_word: הַחֲצִי
  choice: సగాన్ని
  rationale: ప్రతి భాగంలో ఒక అర్ధభాగాన్ని సూచించే సహజమైన తెలుగు పదం.
- source_word: לְאַחַת ... לְאֶחָת
  choice: ఒకామెకు ... ఇంకొకామెకు
  rationale: హీబ్రూలోని స్త్రీలింగ ఏకవచన రూపాలు కథనంలోని ఇద్దరు స్త్రీలను సూచిస్తాయి. ‘ఒకామెకు ... ఇంకొకామెకు’ అనే రూపం అదనపు వివరణ లేకుండానే ఆ పంపిణీ భావాన్ని తెలుగులో స్పష్టంగా ఉంచుతుంది.
