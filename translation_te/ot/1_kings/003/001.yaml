id: 1KI.3.1
reference: 1 Kings 3:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתְחַתֵּ֣ן שְׁלֹמֹ֔ה אֶת פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם וַ/יִּקַּ֣ח אֶת בַּת פַּרְעֹ֗ה וַ/יְבִיאֶ֨/הָ֙ אֶל עִ֣יר דָּוִ֔ד עַ֣ד כַּלֹּת֗/וֹ לִ/בְנ֤וֹת אֶת בֵּית/וֹ֙ וְ/אֶת בֵּ֣ית יְהוָ֔ה וְ/אֶת חוֹמַ֥ת יְרוּשָׁלִַ֖ם סָבִֽיב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/001.yaml
  text: Solomon formed a marriage alliance with Pharaoh king of Egypt[a], and he took Pharaoh’s daughter and brought her into the city of David until he had finished building his own house, and the house of Yahweh[b], and the wall around Jerusalem.
translation:
  language: te
  text: సొలొమోను ఐగుప్తు రాజైన ఫరోతో వివాహ బంధం ఏర్పరచుకొని[a], ఫరో కుమార్తెను వివాహం చేసుకున్నాడు. తన ఇంటిని, యెహోవా మందిరాన్ని[b], యెరూషలేము చుట్టూ ప్రాకారాన్ని కట్టడం పూర్తయ్యే వరకు ఆమెను దావీదు నగరంలోకి తీసుకువచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఫరోకు వివాహం ద్వారా బంధువై.” హీబ్రూ క్రియ వివాహ బంధంలోకి ప్రవేశించడాన్ని ప్రధానంగా సూచిస్తుంది; ఇక్కడ దానికి రాజకీయ మైత్రి భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “యెహోవా ఇంటిని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַתֵּן
  choice: వివాహ బంధం ఏర్పరచుకొని
  rationale: హిత్పయేల్ రూపం వివాహం ద్వారా బంధుత్వంలోకి ప్రవేశించడాన్ని సూచిస్తుంది; రాజసంబంధ సందర్భంలో ఉన్న రాజకీయ మైత్రి భావాన్ని బలవంతంగా ప్రధానార్థం చేయకుండా ఈ పదబంధం నిలుపుతుంది.
- source_word: אֶת פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: ఐగుప్తు రాజైన ఫరోతో
  rationale: హీబ్రూ సమానాధికార నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: וַיִּקַּח אֶת בַּת פַּרְעֹה
  choice: ఫరో కుమార్తెను వివాహం చేసుకున్నాడు
  rationale: స్త్రీని కర్మగా తీసుకునే לקח ఇక్కడ వివాహం చేసుకోవడం అనే స్థిర హీబ్రూ ప్రయోగం; తెలుగులో అక్షరార్థమైన ‘తీసుకున్నాడు’ అస్పష్టంగా ఉండేందున భావాన్ని స్పష్టం చేశాం.
- source_word: וַיְבִיאֶהָ אֶל עִיר דָּוִד
  choice: ఆమెను దావీదు నగరానికి తీసుకొచ్చి అక్కడ ఉంచాడు
  rationale: וַיְבִיאֶהָ అంటే ‘ఆమెను తీసుకొచ్చాడు’; עַד తో కొనసాగే కాలవ్యవధి తెలుగులో సహజంగా అర్థమయ్యేందుకు సందర్భసిద్ధమైన నివాస భావాన్ని ‘అక్కడ ఉంచాడు’తో తెలిపాం.
- source_word: עַד כַּלֹּתוֹ לִבְנוֹת
  choice: కట్టడం పూర్తయ్యే వరకు
  rationale: עַד ముగింపు హద్దును, כַּלֹּתוֹ నిర్మాణకార్యం పూర్తవడాన్ని సూచిస్తాయి.
- source_word: אֶת בֵּיתוֹ
  choice: తన రాజభవనాన్ని
  rationale: బֵּיתוֹ అక్షరార్థంగా ‘అతని ఇల్లు’; రాజైన సొలొమోను నిర్మించిన నివాస సముదాయాన్ని తెలుగులో స్పష్టంగా సూచించేందుకు ‘రాజభవనం’ ఎంచుకున్నాం.
- source_word: וְאֶת בֵּית יְהוָה
  choice: యెహోవా మందిరాన్ని
  rationale: అక్షరార్థం ‘యెహోవా ఇల్లు’; ఈ నిర్మాణ సందర్భంలో తెలుగు పాఠకునికి సహజమైన ‘మందిరం’ దాని కార్యార్థాన్ని స్పష్టంగా తెలియజేస్తుంది, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: וְאֶת חוֹמַת יְרוּשָׁלִַם סָבִיב
  choice: యెరూషలేము చుట్టూ ప్రాకారాన్ని
  rationale: חוֹמָה నగర రక్షణ గోడను, סָבִיב దాని చుట్టుముట్టే విస్తృతిని సూచిస్తాయి; ‘ప్రాకారం’ ఈ సందర్భంలో సహజమైన తెలుగు పదం.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; దానిని ఒక బిరుదుగా మార్చకుండా తెలుగులో విస్తృతంగా తెలిసిన ‘యెహోవా’ రూపాన్ని నిలిపాం.
- issue: בֵּית יְהוָה భావవ్యక్తీకరణ
  choice: యెహోవా మందిరం
  alternative: యెహోవా ఇల్లు
  rationale: ‘ఇల్లు’ మూలానికి దగ్గరగా ఉన్నప్పటికీ, సొలొమోను నిర్మించిన పవిత్ర కట్టడాన్ని ఆధునిక తెలుగులో ‘మందిరం’ స్పష్టంగా తెలియజేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. పొడవైన హీబ్రూ సమన్వయ వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి సంబంధాలను స్పష్టం చేశాం; మూలంలోని సంఘటనల క్రమాన్ని నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
