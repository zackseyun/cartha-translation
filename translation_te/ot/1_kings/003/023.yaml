  terminology: ‘రాజు,’ ‘కుమారుడు,’ ‘బతికున్నవాడు,’ ‘చనిపోయినవాడు’ అనే పదాలు సందర్భానుకూలంగా, సహజంగా ఉన్నాయి. ‘ఈమె’ ఇద్దరు స్త్రీలను సూచించడాన్ని అనవసరంగా పేర్లు లేదా ఇతర గుర్తింపులు జోడించకుండా కాపాడుతుంది. పాదటిప్పణి మూలంలోని స్త్రీలింగ సూచనను, ప్రత్యామ్నాయ వ్యావహారిక అనువాదాన్ని సరిగ్గా వివరిస్తుంది.
