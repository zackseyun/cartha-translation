id: 1KI.3.23
reference: 1 Kings 3:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ זֹ֣את אֹמֶ֔רֶת זֶה בְּנִ֥/י הַ/חַ֖י וּ/בְנֵ֣/ךְ הַ/מֵּ֑ת וְ/זֹ֤את אֹמֶ֨רֶת֙ לֹ֣א כִ֔י בְּנֵ֥/ךְ הַ/מֵּ֖ת וּ/בְנִ֥/י הֶ/חָֽי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/023.yaml
  text: Then the king said[a], “This one says, ‘This is my son, the living one, and your son is the dead one,’ and this one says, ‘No, for your son is the dead one, and my son is the living one.’”
translation:
  language: te
  text: 'అప్పుడు రాజు ఇలా అన్నాడు[a]: “ఈమె, ‘ఇతడే నా కుమారుడు—బతికున్నవాడు; నీ కుమారుడే చనిపోయినవాడు’ అంటోంది. మరి ఈమె, ‘కాదు! నీ కుమారుడే చనిపోయినవాడు; నా కుమారుడే బతికున్నవాడు’ అంటోంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత వ్యావహారికంగా, “ఈ స్త్రీ అంటోంది ... ఆ స్త్రీ అంటోంది ...” అని అనువదించవచ్చు. హీబ్రూలో ఇద్దరు స్త్రీలను సూచిస్తూ స్త్రీలింగ సూచనపదాలతో అక్షరార్థంగా “ఈమె ... ఈమె” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథన క్రమాన్ని ముందుకు తీసుకెళ్తుంది; ఆధునిక తెలుగు కథనంలో ‘అప్పుడు’ సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: మూలంలో వ్యక్తిపేరు కాక బిరుదే ఉంది; అందువల్ల ‘రాజు’ అని ఉంచబడింది.
- source_word: זֹאת ... וְזֹאת
  choice: ఈమె ... మరి ఈమె
  rationale: స్త్రీలింగ సూచనపదాలు ముందున్న ఇద్దరు స్త్రీలను సూచిస్తున్నాయి. ‘ఈమె’ లింగాన్నీ సమీప సూచననూ నిలుపుతుంది; ‘మరి’ వ్యత్యాసాన్ని సహజంగా చూపుతుంది.
- source_word: אֹמֶרֶת
  choice: అంటోంది
  rationale: హీబ్రూ క్రియావిశేషణ రూపం రాజు వారి వాదనలను సజీవ వర్తమానంలో సంగ్రహిస్తున్నట్లు చూపుతుంది.
- source_word: זֶה בְּנִי הַחַי
  choice: ఇతడే నా కుమారుడు—బతికున్నవాడు
  rationale: ‘ఇతడు/ఇదే’ అనే సూచన బలాన్నీ, ‘నా కుమారుడు, బతికున్నవాడు’ అనే మూలంలోని అన్వయ నిర్మాణాన్నీ నిలుపుతుంది.
- source_word: בְּנִי / בְּנֵךְ
  choice: నా కుమారుడు / నీ కుమారుడు
  rationale: בֵּןకు సాధారణ అర్థం ‘కుమారుడు’; సందర్భంలో మగ శిశువే ఉద్దేశించబడ్డాడు.
- source_word: הַחַי / הַמֵּת
  choice: బతికున్నవాడు / చనిపోయినవాడు
  rationale: నామవాచకంగా పనిచేసే ఈ రూపాల మధ్యనున్న సమాంతర వ్యత్యాసాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: לֹא כִי
  choice: కాదు!
  rationale: ఈ సందర్భంలో ఈ పదబంధం ముందటి వాదనను గట్టిగా ఖండించి ఎదురువాదనను ప్రవేశపెడుతుంది; తెలుగులో ‘కాదు!’ ఆ శక్తిని సహజంగా వ్యక్తం చేస్తుంది.
