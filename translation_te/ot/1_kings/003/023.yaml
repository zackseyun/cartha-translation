  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయితే రాజు వాదనలను తూచా తప్పకుండా పునరుక్తి చేస్తున్న న్యాయసభా సందర్భానికి తగిన గౌరవప్రదమైన శైలి పాటించబడింది.
