  source_fidelity: హీబ్రూ వచనంలోని కథన క్రమం, ‘రాజు’ అనే బిరుదు, ఇద్దరు స్త్రీల వాదనలను రాజు వర్తమాన-సజీవ శైలిలో సంగ్రహించడం, అలాగే జీవించి ఉన్న కుమారుడు/చనిపోయిన కుమారుడు అనే సమాంతర విరోధం అన్నీ విశ్వసనీయంగా ప్రతిబింబించబడ్డాయి. ‘ఈమె ... మరి ఈమె’ అనేది זֹאת ... וְזֹאת అనే రెండు స్త్రీలింగ సూచనపదాల అర్థాన్ని సహజంగా తెలియజేస్తుంది. ‘కాదు!’ తరువాతి ప్రతివాదన לא כִי యొక్క ఖండనాత్మక బలాన్ని తగిన విధంగా అందిస్తుంది.
