id: 1KI.3.2
reference: 1 Kings 3:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רַ֣ק הָ/עָ֔ם מְזַבְּחִ֖ים בַּ/בָּמ֑וֹת כִּ֠י לֹא נִבְנָ֥ה בַ֨יִת֙ לְ/שֵׁ֣ם יְהוָ֔ה עַ֖ד הַ/יָּמִ֥ים הָ/הֵֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/002.yaml
  text: Only the people were sacrificing at the high places[a], because no house had yet been built for the name of Yahweh in those days.
translation:
  language: te
  text: అయితే, ప్రజలు ఉన్నత స్థలాల్లో[a] బలులు అర్పిస్తూ ఉండేవారు, ఎందుకంటే అప్పటివరకు యెహోవా నామం కోసం ఒక ఇల్లు కట్టబడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఉన్నత స్థలాలు’ అంటే బలులు అర్పించడానికి ఉపయోగించిన స్థానిక ఆరాధనా స్థలాలు. ‘ఇల్లు’ అనే పదం ఇక్కడ యెహోవా నామం కోసం నిర్మించబడవలసిన మందిరాన్ని సూచిస్తుంది.
    reason: సాంస్కృతిక పదం మరియు సందర్భానుసారమైన అర్థ వివరణ
lexical_decisions:
- source_word: רַק
  choice: అయితే
  rationale: ముందటి అనుకూల వర్ణనకు ఇక్కడ పరిమితి లేదా మినహాయింపును సూచిస్తుంది; ఆధునిక తెలుగులో ‘అయితే’ సహజమైన concessive అనుసంధానం.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: సాంకేతికంగా ఏ ప్రత్యేక వర్గాన్నీ కాక, ఆరాధనలో పాల్గొన్న జనులను సాధారణంగా సూచిస్తుంది.
- source_word: מְזַבְּחִים
  choice: బలులు అర్పిస్తూ ఉండేవారు
  rationale: హెబ్రీ భాగధాతువు తెలిపే కొనసాగుతున్న లేదా అలవాటైన చర్యను ఈ రూపం స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בַּבָּמוֹת
  choice: ఉన్నత స్థలాల్లో
  rationale: స్థానిక బలిపీఠాలు లేదా ఆరాధనా ప్రదేశాలను సూచించే במות పదానికి మూలరూపాన్ని పారదర్శకంగా నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ప్రజలు ఉన్నత స్థలాల్లో బలులు అర్పించడానికి గల కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: לֹא נִבְנָה בַיִת
  choice: ఒక మందిరం ఇంకా కట్టబడలేదు
  rationale: בית అక్షరార్థంగా ‘ఇల్లు’ అయినా, యెహోవా నామం కోసం నిర్మించబడే ఆరాధనా భవనమే సందర్భార్థం; తెలుగులో ‘మందిరం’ అస్పష్టతను తొలగిస్తూ సహజంగా ఉంటుంది.
- source_word: לְשֵׁם יְהוָה
  choice: యెహోవా నామం కోసం
  rationale: దేవుని నామానికి సంబంధించిన ఆలయ-భాషను సంక్షిప్తం చేయకుండా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన రూపంలో ప్రతిబింబిస్తుంది.
- source_word: עַד הַיָּמִים הָהֵם
  choice: ఆ రోజుల వరకు
  rationale: עד యొక్క పరిమితి భావాన్నీ, ‘ఆ రోజులు’ అనే హెబ్రీ కాలవ్యక్తీకరణనూ నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా ఉంచుతుంది; ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితం.
- issue: בַיִת ను ‘ఇల్లు’గా లేదా ‘మందిరం’గా అనువదించడం
  choice: మందిరం
  alternative: ఇల్లు
  rationale: మూలపదం ‘ఇల్లు’ అయినప్పటికీ ‘యెహోవా నామం కోసం’ అనే పదబంధం ఆలయాన్ని సూచిస్తుంది. తెలుగులో ‘ఇల్లు’ అనవసర అస్పష్టత కలిగించవచ్చు; పాదటిప్పణిలో అక్షరార్థం ఇవ్వబడింది.
- issue: רַק తెలిపే పరిమితి
  choice: అయితే
  alternative: కేవలం / ఒక్కటే
  rationale: ఇది ప్రజలనే ఇతరుల నుంచి తప్పనిసరిగా వేరు చేయడం కంటే ముందటి వాక్యంలోని అనుకూల అంచనాకు మినహాయింపును జోడిస్తుంది; ‘అయితే’ ఆ ఉద్వేగాన్ని పరిష్కరించకుండా సహజంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. కొనసాగుతున్న ఆచారాన్ని ‘అర్పిస్తూ ఉండేవారు’తో తెలిపి, హెబ్రీ వాక్యంలోని పరిమితి భావాన్ని ‘అయితే’తో నిలిపాం.
