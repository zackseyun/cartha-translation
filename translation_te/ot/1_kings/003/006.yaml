source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֗ה אַתָּ֨ה עָשִׂ֜יתָ עִם עַבְדְּ/ךָ֙ דָוִ֣ד אָבִ/י֮ חֶ֣סֶד גָּדוֹל֒ כַּ/אֲשֶׁר֩ הָלַ֨ךְ לְ/פָנֶ֜י/ךָ בֶּ/אֱמֶ֧ת וּ/בִ/צְדָקָ֛ה וּ/בְ/יִשְׁרַ֥ת לֵבָ֖ב עִמָּ֑/ךְ וַ/תִּשְׁמָר ל֗/וֹ אֶת הַ/חֶ֤סֶד הַ/גָּדוֹל֙ הַ/זֶּ֔ה וַ/תִּתֶּן ל֥/וֹ בֵ֛ן יֹשֵׁ֥ב עַל כִּסְא֖/וֹ כַּ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/006.yaml
  text: And Solomon said[a], “You have shown great covenant faithfulness to your servant David my father, because he walked before you in faithfulness, in righteousness, and in uprightness of heart with you; and you have kept for him this great covenant faithfulness and have given him a son sitting on his throne[c][b], as it is this day.”
translation:
  language: te
  text: 'సొలొమోను ఇలా అన్నాడు: “నీవు నీ సేవకుడైన నా తండ్రి దావీదుకు గొప్ప నిబంధనబద్ధ ప్రేమను[a] చూపించావు—అతడు నీ సన్నిధిలో నమ్మకంతో[b], నీతితో, నీతో హృదయ యథార్థతతో నడుచుకున్న ప్రకారమే. నీవు అతనికోసం ఈ గొప్ప నిబంధనబద్ధ ప్రేమను నిలిపి ఉంచి, అతని సింహాసనంపై కూర్చున్న కుమారుణ్ణి అతనికి ఇచ్చావు; ఈ రోజు కనిపిస్తున్నట్లుగా[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “స్థిరమైన ప్రేమ,” “విశ్వాసపూర్వక ప్రేమ.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “నమ్మకంతో” అనే మాటకు “సత్యంలో” లేదా “యథార్థతతో” అనే భావమూ ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: 'హీబ్రూ నుడికారం: “ఈ రోజున ఉన్నట్టుగా”; అంటే ప్రస్తుతం కనిపిస్తున్న పరిస్థితి దీనిని ధృవీకరిస్తోంది.'
    reason: cultural_note
lexical_decisions:
- source_word: חֶסֶד
  choice: నిబంధనబద్ధ ప్రేమ
  rationale: దావీదుతో దేవునికున్న నిబంధన సంబంధంలో ఈ పదం కేవలం దయను కాక, ప్రేమతో కూడిన స్థిరమైన విధేయతను సూచిస్తుంది. ‘నిబంధనబద్ధ ప్రేమ’ దాని సంబంధాత్మక, వాగ్దానపూర్వక బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עָשִׂיתָ עִם
  choice: పట్ల ... చూపించావు
  rationale: חֶסֶדతో కలిసిన ఈ హీబ్రూ ప్రయోగానికి తెలుగులో ‘పట్ల ప్రేమను చూపించు’ సహజమైన సమానార్థక నిర్మాణం.
- source_word: עַבְדְּךָ
  choice: నీ సేవకుడు
  rationale: దేవుని ఎదుట దావీదు స్థితిని తెలిపే రాజప్రార్థనా సందర్భంలో ‘సేవకుడు’ సహజమైనది; బానిసత్వ భావాన్ని అనవసరంగా ముందుకు తేవదు.
- source_word: כַּאֲשֶׁר
  choice: నడుచుకున్న ప్రకారమే
  rationale: ఈ అనుసంధానం కారణాన్ని లేదా అనుగుణతను సూచించగలదు. ‘ప్రకారమే’ హీబ్రూ వాక్యంలోని అనుగుణతను నిలుపుతూ, దాన్ని కేవలం ప్రతిఫల సంబంధంగా కుదించదు.
- source_word: הָלַךְ לְפָנֶיךָ
  choice: నీ సన్నిధిలో ... నడుచుకున్నాడు
  rationale: జీవన ప్రవర్తనను సూచించే హీబ్రూ రూపకాన్ని తెలుగులో అర్థమయ్యే విధంగా నిలుపుతుంది.
- source_word: בֶּאֱמֶת
  choice: నమ్మకంతో
  rationale: ఈ సందర్భంలో אֱמֶת సత్యం, విశ్వసనీయత, యథార్థత అనే భావాలను కలిగి ఉంది. దావీదు దేవుని ఎదుట ప్రవర్తించిన తీరును ‘నమ్మకంతో’ సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయ భావాలను పాదసూచికలో ఉంచాం.
- source_word: בִּצְדָקָה
  choice: నీతితో
  rationale: దేవుని ఎదుట దావీదు నైతిక సత్ప్రవర్తనను నేరుగా, సహజంగా తెలుపుతుంది.
- source_word: וּבְיִשְׁרַת לֵבָב
  choice: హృదయ యథార్థతతో
  rationale: అంతరంగ నిష్కపటతను, నైతిక నిటారుతనాన్ని ఆధునిక గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עִמָּךְ
  choice: నీతో
  rationale: మూలంలోని ‘తో’ అనే సంబంధార్థాన్ని ‘సన్నిధిలో’ అనే ముందరి ప్రయోగంతో కలిపివేయకుండా ప్రత్యేకంగా నిలుపుతుంది.
- source_word: וַתִּשְׁמָר לוֹ
  choice: అతనికోసం ... నిలిపి ఉంచావు
  rationale: దేవుని నిబంధనబద్ధ ప్రేమ కొనసాగి, దావీదు వంశంలో భద్రపరచబడిందనే שׁמר భావాన్ని తెలియజేస్తుంది.
- source_word: בֵן יֹשֵׁב עַל כִּסְאוֹ
  choice: అతని సింహాసనం మీద కూర్చున్న కుమారుడు
  rationale: యֹשֵׁב అనే వర్తమాన భాగధాతువు కుమారుడు అప్పటికే సింహాసనంపై ఉన్నాడనే సాకార నెరవేర్పును చూపుతుంది.
- source_word: כַּיּוֹם הַזֶּה
  choice: ఈ రోజున ఉన్నట్టుగానే
  rationale: ప్రస్తుత పరిస్థితి దేవుని వాగ్దాన నెరవేర్పుకు కనబడే ధృవీకరణగా ఉందనే హీబ్రూ కాలసూచక నుడికారాన్ని రూపసామీప్యంతో నిలుపుతుంది.
theological_decisions:
- issue: రాజవంశ నిబంధన సందర్భంలో חֶסֶד అనువాదం
  choice: నిబంధనబద్ధ ప్రేమ
  alternative: స్థిరమైన ప్రేమ; విశ్వాసపూర్వక ప్రేమ; దయ
  rationale: ఈ వాక్యం దేవుడు దావీదుపట్ల చూపిన ప్రేమను, దావీదు కుమారుడు సింహాసనంపై ఉండటంలో దాని కొనసాగింపును కలిపి చెబుతుంది. ఎంపిక చేసిన పదబంధం నిబంధన నిబద్ధతను, ప్రేమాంశాన్ని రెండింటినీ నిలుపుతుంది.
- issue: כַּאֲשֶׁר ద్వారా దావీదు నడవడికకు దేవుని חֶסֶדతో ఉన్న సంబంధం
  choice: నడుచుకున్న ప్రకారమే
  alternative: నడుచుకున్నందువల్ల; నడుచుకున్నట్లుగా
  rationale: మూలంలోని అనుగుణత లేదా కారణార్థ సాధ్యతను పూర్తిగా ఒకే సిద్ధాంతపరమైన కారణ-ఫలిత వ్యాఖ్యగా మార్చకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలిని వాడాం. ‘నడుచుకున్నాడు,’ ‘సింహాసనం’ వంటి బైబిలు రూపకాలను అవి సాధారణ పాఠకుడికి అర్థమయ్యేంత పరిచితమైనందున నిలిపాం. పొడవైన హీబ్రూ వాక్యాన్ని సహజ పఠనానికి విరామచిహ్నాలతో క్రమబద్ధం చేశాం; మూలంలోని సంబంధాలు, పునరుక్తి మాత్రం నిలిచాయి.
