  to: 'సొలొమోను ఇలా అన్నాడు: “నీవు నీ సేవకుడైన నా తండ్రి దావీదుకు గొప్ప నిబంధనబద్ధ ప్రేమను[a] చూపించావు—అతడు నీ సన్నిధిలో నమ్మకంతో[b], నీతితో, నీతో హృదయ యథార్థతతో నడుచుకున్న ప్రకారమే. నీవు అతనికోసం ఈ గొప్ప నిబంధనబద్ధ ప్రేమను నిలిపి ఉంచి, అతని సింహాసనంపై కూర్చున్న కుమారుణ్ణి అతనికి ఇచ్చావు; ఈ రోజు కనిపిస్తున్నట్లుగా[c].”'
  rationale: చిన్న శైలీ సవరణలే చేయబడ్డాయి. దావీదు సంబంధాన్ని తెలుగులో స్పష్టపరచి, చివరి హీబ్రూ కాలసూచక నుడికారంలోని వర్తమాన, దృశ్య ధృవీకరణ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేశాం. మూలంలోని అస్పష్టమైన అనుసంధానాన్ని ‘నడుచుకున్న ప్రకారమే’ ద్వారా అలాగే ఉంచాం; దానిని బలమైన కారణ-ఫలిత వాదనగా మార్చలేదు.
