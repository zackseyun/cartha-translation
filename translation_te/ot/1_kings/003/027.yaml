  yaml_path: translation/ot/1_kings/003/027.yaml
  text: Then the king answered and said[a], “Give her the living child, and by no means put him to death; she is his mother.”
translation:
  language: te
  text: 'అప్పుడు రాజు సమాధానంగా ఇలా అన్నాడు: “బతికున్న బిడ్డను ఆమెకు ఇవ్వండి. అతన్ని ఎంతమాత్రమూ చంపవద్దు[a]. ఆమె అతని తల్లి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో ఒకే ధాతువుకు చెందిన రెండు రూపాలను కలిపి గట్టి నిషేధాన్ని వ్యక్తం చేశారు; భావం: “అతన్ని అసలే చంపవద్దు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן הַמֶּלֶךְ וַיֹּאמֶר
  choice: అప్పుడు రాజు ఇలా జవాబిచ్చాడు
  rationale: ענה ... אמר అనే హీబ్రూ కథన సూత్రాన్ని పదేపదే ‘జవాబిచ్చి చెప్పాడు’ అని కాకుండా, దాని ప్రతిస్పందన భావాన్ని నిలుపుతూ సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: תְּנוּ לָהּ
  choice: ఆమెకు ఇవ్వండి
  rationale: נתן యొక్క బహువచన ఆజ్ఞారూపాన్ని, స్త్రీలింగ ఏకవచన పరోక్ష కర్మతో సహజంగా అనువదిస్తుంది.
- source_word: הַיָּלוּד הַחַי
  choice: బతికున్న బిడ్డను
  rationale: יַלּוּד ఇక్కడ పుట్టిన శిశువు/బిడ్డను సూచిస్తుంది; חַי అతడు సజీవంగా ఉన్నాడని తెలియజేస్తుంది. సందర్భానికి తగిన సాధారణ తెలుగు ‘బతికున్న బిడ్డ’.
- source_word: וְהָמֵת לֹא תְמִיתֻהוּ
  choice: అతన్ని ఎంతమాత్రమూ చంపవద్దు
  rationale: מות ధాతువు యొక్క infinitive absolute మరియు Hiphil క్రియ కలయికలోని గట్టి నిషేధాన్ని ‘ఎంతమాత్రమూ ... వద్దు’ సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הִיא אִמּוֹ
  choice: ఆమే అతని తల్లి
  rationale: సర్వనామానికి ఉన్న ఉద్ఘాటనను ‘ఆమే’ నిలుపుతుంది; 3వ పురుష పుంలింగ ఏకవచన ప్రత్యయాన్ని ‘అతని’గా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజాజ్ఞకు తగిన గౌరవభరితమైన బహువచన ఆజ్ఞారూపం వాడబడింది. మూలంలోని బలమైన నిషేధాన్ని పాఠ్యంలోనూ పాదసూచికలోనూ నిలుపుకున్నాం.
