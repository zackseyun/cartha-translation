source:
  edition: WLC
  text: הִנֵּ֥ה עָשִׂ֖יתִי כִּ/דְבָרֶ֑י/ךָ הִנֵּ֣ה נָתַ֣תִּי לְ/ךָ֗ לֵ֚ב חָכָ֣ם וְ/נָב֔וֹן אֲשֶׁ֤ר כָּמ֨וֹ/ךָ֙ לֹא הָיָ֣ה לְ/פָנֶ֔י/ךָ וְ/אַחֲרֶ֖י/ךָ לֹא יָק֥וּם כָּמֽוֹ/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/012.yaml
  text: Behold[a], I have done according to your words. Behold, I have given you a wise and discerning heart, such that no one like you has been before you, and no one like you shall arise after you.
translation:
  language: te
  text: “ఇదిగో, నీ మాటల ప్రకారం చేశాను. ఇదిగో, నీకు జ్ఞానమూ వివేచనయూ గల హృదయాన్ని[a] ఇచ్చాను. నీకు ముందు నీలాంటివాడు ఎవరూ ఉండలేదు; నీ తర్వాత నీలాంటివాడు ఎవరూ ఉద్భవించరు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గ్రహింపుగల హృదయం.” హీబ్రూలో “హృదయం” అనేది కేవలం భావోద్వేగాలకు మాత్రమే కాకుండా ఆలోచన, నిర్ణయం, వివేచనలకు సంబంధించిన అంతరంగ సామర్థ్యాన్ని కూడా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: దైవిక ప్రకటనలోని గంభీరమైన అవధాన సూచనను వదలకుండా, ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: עָשִׂיתִי כִּדְבָרֶיךָ
  choice: నీ మాటల ప్రకారం చేశాను
  rationale: ‘నీ విన్నపం’ అని సందర్భార్థాన్ని మాత్రమే ఇవ్వకుండా, మూలంలోని ‘నీ మాటలు’ అనే రూపాన్ని నిలుపుతుంది; పూర్తయిన దైవిక చర్యను కూడా వ్యక్తం చేస్తుంది.
- source_word: נָתַתִּי לְךָ
  choice: నీకు ... ఇచ్చాను
  rationale: נתן అనే క్రియ యొక్క ప్రత్యక్ష అర్థాన్నీ, ఇప్పటికే అనుగ్రహించబడిన వరాన్నీ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לֵב חָכָם וְנָבוֹן
  choice: జ్ఞానం, వివేచన గల హృదయం
  rationale: לֵב అనే ‘హృదయం’ పదాన్ని నిలుపుతూ, חָכָם మరియు נָבוֹן పదాలలోని జ్ఞానం, లోతుగా గ్రహించి తీర్పు చెప్పగల వివేచన అనే వేర్వేరు భావాలను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֲשֶׁר כָּמוֹךָ לֹא הָיָה לְפָנֶיךָ
  choice: నీకు ముందు నీలాంటివాడు ఎవరూ ఉండలేదు
  rationale: ఈ వరం విషయంలో సొలొమోను సాటిలేనివాడని తెలిపే పోలికను సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: וְאַחֲרֶיךָ לֹא יָקוּם כָּמוֹךָ
  choice: నీ తర్వాత నీలాంటివాడు ఎవరూ ఉద్భవించరు
  rationale: יקום లోని ‘లేచి రావడం/చరిత్రలో ఉద్భవించడం’ అనే చిత్రాన్ని నిలుపుతూ, భవిష్యత్తుకు సంబంధించిన వాగ్దానాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: సొలొమోనుకు వాగ్దానం చేసిన సాటిలేని స్థానం యొక్క పరిధి
  choice: ఈ పోలికను వెంటనే ప్రస్తావించిన జ్ఞానం, వివేచన గల హృదయంతో అనుసంధానంగా ఉంచడం
  alternative: ప్రతి విషయంలోనూ సొలొమోను సాటిలేని గొప్పవాడని విస్తృతంగా అర్థం చేయడం
  rationale: తక్షణ సందర్భం పరిపాలనకూ న్యాయతీర్పుకూ అవసరమైన జ్ఞానం, వివేచన అనే వరంపై కేంద్రీకృతమై ఉంది. మూలపాఠం చెప్పినదానికంటే విస్తృతమైన సిద్ధాంతపరమైన వాదనను అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన దైవవాక్య శైలి ఉపయోగించబడింది. ‘ఇదిగో’ అనే అవధాన సూచన రెండుసార్లు నిలుపబడింది. ‘హృదయం’ అనే హీబ్రూ మానవశాస్త్ర సంబంధ పదాన్ని ప్రధాన పాఠ్యంలో ఉంచి, దాని విస్తృత భావాన్ని పాదసూచికలో వివరించాం.
