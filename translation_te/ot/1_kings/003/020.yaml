  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תָּקָם֩ בְּ/ת֨וֹךְ הַ/לַּ֜יְלָה וַ/תִּקַּ֧ח אֶת בְּנִ֣/י מֵֽ/אֶצְלִ֗/י וַ/אֲמָֽתְ/ךָ֙ יְשֵׁנָ֔ה וַ/תַּשְׁכִּיבֵ֖/הוּ בְּ/חֵיקָ֑/הּ וְ/אֶת בְּנָ֥/הּ הַ/מֵּ֖ת הִשְׁכִּ֥יבָה בְ/חֵיקִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/020.yaml
  text: She got up in the middle of the night and took my son from beside me while your servant was sleeping[a], and she laid him in her bosom, and laid her dead son in my bosom.
translation:
  language: te
  text: ఆమె రాత్రి నడుమ లేచి, నీ దాసినైన నేను నిద్రపోతుండగా నా పక్కనుంచి నా కుమారుణ్ణి తీసుకొని తన ఒడిలో[a] పడుకోబెట్టింది. తన చనిపోయిన కుమారుణ్ణి నా ఒడిలో పడుకోబెట్టింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఒడిలో’ను ‘వక్షస్థలానికి ఆనించి’ అని కూడా అర్థం చేసుకోవచ్చు. హీబ్రూ חֵיק ఒడిని లేదా వక్షస్థలానికి ఆనుకుని ఉన్న దగ్గరి భాగాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹךְ הַלַּיְלָה
  choice: రాత్రి నడుమ
  rationale: బְּתוֹךְ అనే పదం రాత్రి సమయంలో అని మాత్రమే కాక, రాత్రి మధ్య భాగంలో జరిగినదనే భావాన్ని ఇస్తుంది; ‘రాత్రి నడుమ’ సహజంగానూ గంభీరంగానూ ఉంది.
- source_word: מֵאֶצְלִי
  choice: నా పక్కనుంచి
  rationale: אֵצֶל సమీపాన్ని, ఒకరి పక్కన ఉన్న స్థానాన్ని సూచిస్తుంది; నిద్రిస్తున్న సందర్భంలో ‘నా పక్కనుంచి’ స్పష్టమైన సహజ తెలుగు.
- source_word: וַאֲמָתְךָ יְשֵׁנָה
  choice: నీ దాసినైన నేను నిద్రపోతుండగా
  rationale: אֲמָה స్త్రీ మాట్లాడుతున్న వినయపూర్వక రాజసభా సంబోధన; ‘దాసి’ స్త్రీలింగాన్ని నిలుపుతుంది. మూలంలోని మూడవ పురుష వాక్యరూపాన్ని తెలుగులో సహజమైన స్వీయసూచనగా వ్యక్తం చేశాం.
- source_word: וַתַּשְׁכִּיבֵהוּ
  choice: పడుకోబెట్టింది
  rationale: שׁכב హిఫీల్ రూపం ‘పడుకునేలా చేయడం’ అని అర్థం; ఈ శిశువు-నిద్ర సందర్భంలో ‘పడుకోబెట్టింది’ ఖచ్చితంగా సరిపోతుంది.
- source_word: בְּחֵיקָהּ / בְחֵיקִי
  choice: తన ఒడిలో / నా ఒడిలో
  rationale: חֵיק ఒడి, వక్షస్థలం లేదా ఒడిలోని దగ్గరి స్థలాన్ని సూచించగలదు. ఆధునిక తెలుగులో ‘ఒడి’ తల్లి శిశువును దేహానికి దగ్గరగా ఉంచే భావాన్ని సహజంగా తెలియజేస్తూ, రెండు సమాంతర ప్రయోగాలనూ ఒకే విధంగా నిలుపుతుంది.
- source_word: בְּנָהּ הַמֵּת
  choice: తన చనిపోయిన కుమారుణ్ణి
  rationale: הַמֵּת ఇక్కడ ‘కుమారుడు’ను విశేషించే పదంగా పనిచేస్తుంది; ‘చనిపోయిన కుమారుడు’ సహజమైన, ప్రత్యక్షమైన తెలుగు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజుతో మాట్లాడే స్త్రీ యొక్క వినయపూర్వక స్వరాన్ని ‘నీ దాసినైన నేను’ ద్వారా నిలిపాం. వాక్యాన్ని సహజ పఠనార్థం రెండు వాక్యాలుగా ఇచ్చినా, మూలంలోని చర్యల క్రమం మరియు సమాంతర నిర్మాణం భద్రపరచబడ్డాయి.
