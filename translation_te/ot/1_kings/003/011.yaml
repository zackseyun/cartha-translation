id: 1KI.3.11
reference: 1 Kings 3:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים אֵלָ֗י/ו יַעַן֩ אֲשֶׁ֨ר שָׁאַ֜לְתָּ אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה וְ/לֹֽא שָׁאַ֨לְתָּ לְּ/ךָ֜ יָמִ֣ים רַבִּ֗ים וְ/לֹֽא שָׁאַ֤לְתָּ לְּ/ךָ֙ עֹ֔שֶׁר וְ/לֹ֥א שָׁאַ֖לְתָּ נֶ֣פֶשׁ אֹיְבֶ֑י/ךָ וְ/שָׁאַ֧לְתָּ לְּ/ךָ֛ הָבִ֖ין לִ/שְׁמֹ֥עַ מִשְׁפָּֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/011.yaml
  text: And God said to him, “Because you have asked for this thing, and have not asked for yourself many days, nor have asked for yourself riches, nor have asked for the life of your enemies, but have asked for yourself understanding to hear justice,”
translation:
  language: te
  text: 'దేవుడు అతనితో ఇలా అన్నాడు: “నీవు ఈ విషయాన్ని అడిగావు; నీ కోసం దీర్ఘాయుష్షునుగానీ, సంపదనుగానీ, నీ శత్రువుల ప్రాణాలనుగానీ అడగకుండా, న్యాయాన్ని విని గ్రహించే వివేకాన్ని అడిగావు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָמִים רַבִּים
  choice: దీర్ఘాయుష్షు
  rationale: అక్షరార్థంగా ‘అనేక దినాలు’; సందర్భంలో తన కోసం ఎక్కువ కాలం జీవించడాన్ని కోరుకోవడం అనే సహజ భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: נֶפֶשׁ אֹיְבֶיךָ
  choice: నీ శత్రువుల ప్రాణాలు
  rationale: נֶפֶשׁ ఇక్కడ శత్రువుల ‘జీవితం/ప్రాణం’ను సూచిస్తుంది; ‘శత్రువుల మరణం’ అని భావాన్ని మార్చకుండా మూలంలోని నిర్మాణాన్ని నిలుపుతుంది.
- source_word: הָבִין לִשְׁמֹעַ מִשְׁפָּט
  choice: న్యాయాన్ని విని గ్రహించే వివేకం
  rationale: ‘వినడం’, ‘గ్రహించడం’, ‘న్యాయం/తీర్పు’ అనే మూలపాఠంలోని మూడు భావాంశాలను నిలుపుతూ, రాజు న్యాయవిచారణలో వివేచనతో వ్యవహరించాలనే సందర్భానికి సరిపడే తెలుగు రూపం.
theological_decisions:
- issue: מִשְׁפָּט పదాన్ని ‘తీర్పు’గా లేదా ‘న్యాయం’గా అనువదించడం
  choice: న్యాయం
  alternative: తీర్పు / న్యాయవిచారణ
  rationale: ఈ సందర్భంలో పదం న్యాయపాలనను, న్యాయమైన నిర్ణయాన్ని రెండింటినీ సూచించగలదు. ‘న్యాయం’ ఆ విస్తృతిని నిలుపుతుంది; ఏ ప్రత్యేక సిద్ధాంతార్థాన్నీ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని వరుస నిరాకరణలను తెలుగులో ‘గానీ… గానీ… గానీ’ నిర్మాణంతో సంక్షిప్తంగా, స్పష్టంగా నిలిపాం. ప్రత్యక్ష సంభాషణలో దేవుని వాక్యానికి తగిన గంభీరతను కాపాడాం.
