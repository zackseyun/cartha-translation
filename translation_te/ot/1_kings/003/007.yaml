source:
  edition: WLC
  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהָ֔/י אַתָּה֙ הִמְלַ֣כְתָּ אֶֽת עַבְדְּ/ךָ֔ תַּ֖חַת דָּוִ֣ד אָבִ֑/י וְ/אָֽנֹכִי֙ נַ֣עַר קָטֹ֔ן לֹ֥א אֵדַ֖ע צֵ֥את וָ/בֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/007.yaml
  text: And now[a], O Yahweh my God, you have made your servant king in place of David my father, though I am a little child[b]; I do not know how to go out or come in.
translation:
  language: te
  text: ఇప్పుడు, నా దేవుడైన యాహ్వే, నీవు నా తండ్రి దావీదు స్థానంలో నీ సేవకుణ్ణి రాజుగా నియమించావు; అయితే నేను చిన్నవాణ్ణి[a]. బయటికి వెళ్లడం, లోపలికి రావడం ఎలా చేయాలో నాకు తెలియదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చిన్నపిల్లవాణ్ణి’ లేదా ‘యువకుణ్ణి’ అని కూడా అనువదించవచ్చు. ఈ హీబ్రూ పదబంధం సొలొమోను తన యౌవనాన్ని, అనుభవరాహిత్యాన్ని వినయంగా చెప్పడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘బయటికి వెళ్లడం, లోపలికి రావడం’ అనేది ఒకరి బాధ్యతలను, ముఖ్యంగా ప్రజా నాయకత్వ బాధ్యతలను నిర్వర్తించడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה אֱלֹהָי
  choice: నా దేవుడైన యెహోవా
  rationale: దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించి, אֱלֹהָי లోని స్వామ్యార్థాన్ని సహజమైన తెలుగు సంబోధనలో నిలిపింది.
- source_word: הִמְלַכְתָּ אֶת־עַבְדְּךָ
  choice: నీ సేవకుణ్ణి రాజుగా నియమించావు
  rationale: מלך హిఫిల్ రూపంలోని రాజుగా చేయడం/పాలనకు నిలపడం అనే కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תַּחַת דָּוִד אָבִי
  choice: నా తండ్రి దావీదు స్థానంలో
  rationale: תַּחַת ఇక్కడ రాజ్య వారసత్వంలో ఒకరి స్థానాన్ని మరొకరు తీసుకోవడాన్ని సూచిస్తుంది.
- source_word: נַעַר קָטֹן
  choice: చిన్నవాణ్ణి
  rationale: ఈ పదబంధం ఖచ్చితమైన వయస్సును నిర్ధారించకుండా యౌవనాన్ని, అనుభవరాహిత్యాన్ని వినయపూర్వకంగా వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: לֹא אֵדַע צֵאת וָבֹא
  choice: బయటికి వెళ్లడం, లోపలికి రావడం నాకు తెలియదు
  rationale: హీబ్రూ నుడికారపు రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, నాయకత్వ బాధ్యతలు నిర్వర్తించే భావాన్ని పాదటిప్పణిలో వివరిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠ్యంలోని ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన రూపంలో నిలిపింది.
- issue: సొలొమోను తనను తాను נַעַר קָטֹן అని వర్ణించుకోవడం
  choice: చిన్నవాణ్ణి అని ఉంచి, యౌవనం మరియు అనుభవరాహిత్యాన్ని పాదటిప్పణిలో సూచించడం
  alternative: నేను చిన్నపిల్లవాణ్ణి
  rationale: హీబ్రూ పదబంధం బాలుణ్ణి గానీ యువకుణ్ణి గానీ సూచించగలదు; అందువల్ల ఖచ్చితమైన వయస్సును బలవంతంగా నిర్ణయించలేదు.
- issue: צֵאת וָבֹא నుడికారం
  choice: అక్షరార్థ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, పరిపాలనా భావాన్ని పాదటిప్పణిలో ఇవ్వడం
  alternative: నా బాధ్యతలను ఎలా నిర్వర్తించాలో నాకు తెలియదు
  rationale: మూలంలోని రూపకాన్ని, దాని అర్థవ్యాప్తిని కాపాడుతూ నాయకత్వ భావాన్ని మౌనంగా చేర్చకుండా నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలిని ఉపయోగించింది. మూలంలోని దైవనామం, సేవకత్వ భాష, వినయపూర్వక స్వవర్ణన, నాయకత్వ నుడికారాన్ని నిలిపింది; సందిగ్ధతలను పాదటిప్పణుల్లో స్పష్టం చేసింది.
