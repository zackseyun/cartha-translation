  variant: modern standard Telugu
source:
  edition: WLC
  text: וָ/אָקֻ֥ם בַּ/בֹּ֛קֶר לְ/הֵינִ֥יק אֶת בְּנִ֖/י וְ/הִנֵּה מֵ֑ת וָ/אֶתְבּוֹנֵ֤ן אֵלָי/ו֙ בַּ/בֹּ֔קֶר וְ/הִנֵּ֛ה לֹֽא הָיָ֥ה בְנִ֖/י אֲשֶׁ֥ר יָלָֽדְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/021.yaml
  text: When I got up in the morning to nurse my son[a], behold, he was dead. But when I looked closely at him in the morning, behold, he was not my son[b], whom I had borne.
translation:
  language: te
  text: ఉదయం నా కుమారునికి పాలివ్వడానికి నేను లేచినప్పుడు, ఇదిగో, అతడు చనిపోయి ఉన్నాడు. కానీ ఉదయం అతనిని జాగ్రత్తగా పరిశీలించినప్పుడు, ఇదిగో, అతడు నేను కన్న కుమారుడు కాదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָקֻם בַּבֹּקֶר
  choice: ఉదయం ... నేను లేచినప్పుడు
  rationale: קום క్రియలోని కథన చర్యను సహజమైన ఆధునిక తెలుగులో కాలసంబంధ ఉపవాక్యంగా వ్యక్తం చేస్తుంది; בַּבֹּקֶר ను ‘ఉదయం’గా అనువదించాం.
- source_word: לְהֵינִיק אֶת־בְּנִי
  choice: నా కుమారునికి పాలివ్వడానికి
  rationale: ינק హిఫీల్ రూపం ఇక్కడ శిశువుకు పాలు పట్టించడం అనే అర్థం ఇస్తుంది; בְּנִי లోని పురుషలింగ నిర్దిష్టతను ‘నా కుమారుడు’తో నిలిపాం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: ఆకస్మికంగా గమనించిన విషయానికి ఇచ్చే నాటకీయ బలాన్ని నిలుపుతుంది; హీబ్రూలో రెండుసార్లు ఉన్నట్లే అనువాదంలోనూ రెండుసార్లు ఉంచాం.
- source_word: מֵת
  choice: అతడు చనిపోయి ఉన్నాడు
  rationale: ఆమె లేచిన సమయానికి శిశువు ఉన్న మృతస్థితిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וָאֶתְבּוֹנֵן אֵלָיו
  choice: నేను అతన్ని జాగ్రత్తగా పరిశీలించి చూశాను
  rationale: התבונן సూచించే శ్రద్ధతో పరిశీలించడం, నిశితంగా చూడడం అనే భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: לֹא הָיָה בְנִי אֲשֶׁר יָלָדְתִּי
  choice: అతడు నేను కన్న నా కుమారుడు కాదు
  rationale: మూలంలోని వ్యక్తిగత పురుషలింగ సూచనను నిలుపుతూ, יָלָדְתִּי ను ప్రసవానికి సహజమైన తెలుగు వ్యక్తీకరణ ‘నేను కన్న’గా అనువదించాం.
