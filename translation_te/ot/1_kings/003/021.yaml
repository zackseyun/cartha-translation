translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనా గౌరవప్రదమైన శైలి. మూలంలోని ‘ఉదయం’ మరియు ‘ఇదిగో’ పునరుక్తులను కథన గతి, నాటకీయత కోసం నిలిపాం.
