source:
  edition: WLC
  text: וְ/אִ֣ם תֵּלֵ֣ךְ בִּ/דְרָכַ֗/י לִ/שְׁמֹ֤ר חֻקַּ/י֙ וּ/מִצְוֺתַ֔/י כַּ/אֲשֶׁ֥ר הָלַ֖ךְ דָּוִ֣יד אָבִ֑י/ךָ וְ/הַאַרַכְתִּ֖י אֶת יָמֶֽי/ךָ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/014.yaml
  text: And if you walk in my ways[a], keeping my statutes and my commandments, as David your father walked, then I will lengthen your days.
translation:
  language: te
  text: నీవు నా మార్గాల్లో నడిచి, నీ తండ్రి దావీదు నడిచినట్లుగా నా కట్టడలను, నా ఆజ్ఞలను పాటిస్తే, నేను నీ ఆయుష్షును పొడిగిస్తాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: పాటిస్తే
  rationale: హీబ్రూ షరతును తెలుగులో సహజమైన ‘-తే’ రూపంతో వ్యక్తం చేశాం; ముందున్న వాక్యంతో కొనసాగింపు భావం సందర్భంలో స్పష్టంగా ఉంటుంది.
- source_word: תֵּלֵךְ בִּדְרָכַי
  choice: నీవు నా మార్గాల్లో నడుస్తూ
  rationale: నైతిక జీవన విధానాన్ని సూచించే ‘మార్గాల్లో నడుచుట’ అనే హీబ్రూ రూపకాన్ని సహజమైన తెలుగు బైబిలు శైలిలో నిలిపాం.
- source_word: לִשְׁמֹר
  choice: పాటిస్తే
  rationale: కట్టడలు, ఆజ్ఞలను జాగ్రత్తగా ఆచరించడాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలిపే పదం.
- source_word: חֻקַּי
  choice: నా కట్టడలను
  rationale: ఒడంబడిక సంబంధమైన నిర్దేశాలను సూచిస్తూ, తరువాతి ‘ఆజ్ఞలు’ అనే పదంతో ఉన్న భేదాన్ని నిలుపుతుంది.
- source_word: וּמִצְוֺתַי
  choice: నా ఆజ్ఞలను
  rationale: దేవుడు ఇచ్చిన నిర్దిష్ట ఆదేశాలను తెలిపే సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: כַּאֲשֶׁר הָלַךְ דָּוִיד אָבִיךָ
  choice: నీ తండ్రి దావీదు నడిచినట్లుగా
  rationale: మూలంలోని పోలికను, అలాగే ‘నడుచుట’ క్రియ పునరుక్తిని నిలిపి, తెలుగు పదక్రమాన్ని సహజంగా చేశాం.
- source_word: וְהַאַרַכְתִּי אֶת יָמֶיךָ
  choice: నేను నీ ఆయుష్షును పొడిగిస్తాను
  rationale: అక్షరార్థమైన ‘నీ దినాలను పొడిగిస్తాను’ అనే హీబ్రూ నుడికారానికి ఆధునిక తెలుగులో స్పష్టమైన అర్థసమాన రూపం; దీర్ఘజీవిత వాగ్దానాన్ని కచ్చితంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఒడంబడిక విధేయతతో ముడిపడిన దీర్ఘాయుష్షు వాగ్దానం
  choice: విధేయత నెరవేరితే ఆయుష్షు పొడిగిస్తాననే షరతుతో కూడిన వాగ్దానంగా నేరుగా అనువదించాం.
  alternative: షరతులేని రాజవంశ వాగ్దానంగా లేదా సాధారణ ఆశీర్వాదంగా వ్యాఖ్యానించడం.
  rationale: మూలవాక్యం స్పష్టంగా షరతు–ఫలితం నిర్మాణంలో ఉంది; తరువాతి సిద్ధాంత వర్గాలను చేర్చకుండా ఆ ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన గ్రంథశైలి. ‘మార్గాల్లో నడుస్తూ’ అనే మూల రూపకాన్ని నిలిపి, ‘నీ దినాలను పొడిగిస్తాను’ అనే నుడికారాన్ని స్పష్టత కోసం ‘నీ ఆయుష్షును పొడిగిస్తాను’గా ఇచ్చాం.
