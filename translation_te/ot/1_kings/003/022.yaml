id: 1KI.3.22
reference: 1 Kings 3:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּאמֶר֩ הָ/אִשָּׁ֨ה הָ/אַחֶ֜רֶת לֹ֣א כִ֗י בְּנִ֤/י הַ/חַי֙ וּ/בְנֵ֣/ךְ הַ/מֵּ֔ת וְ/זֹ֤את אֹמֶ֨רֶת֙ לֹ֣א כִ֔י בְּנֵ֥/ךְ הַ/מֵּ֖ת וּ/בְנִ֣/י הֶ/חָ֑י וַ/תְּדַבֵּ֖רְנָה לִ/פְנֵ֥י הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/022.yaml
  text: But the other woman said[a], “No! My son is the living one, and your son is the dead one.” And this one said, “No! Your son is the dead one, and my son is the living one.” So they spoke before the king.
translation:
  language: te
  text: అయితే ఆ మరో స్త్రీ, “కాదు! బతికున్నవాడు నా కుమారుడు; చనిపోయినవాడు నీ కుమారుడు” అంది. ఈమె, “కాదు! చనిపోయినవాడు నీ కుమారుడు; బతికున్నవాడు నా కుమారుడు” అంది. ఇలా వారు రాజు ఎదుట మాట్లాడారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అంది
  rationale: సాధారణ కథన వాక్కు క్రియ; ఈ ప్రత్యక్ష సంభాషణలో సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: הָאִשָּׁה הָאַחֶרֶת
  choice: ఆ మరో స్త్రీ
  rationale: వివాదంలో ఉన్న ఇద్దరిలో మరొకరిని సూచిస్తుంది; వైవాహిక అర్థాన్ని అనవసరంగా చేర్చకుండా ‘స్త్రీ’ అని అనువదించబడింది.
- source_word: לֹא כִי
  choice: కాదు!
  rationale: ఎదుటివారి మాటను బలంగా ఖండించే ప్రయోగం; ఆశ్చర్యార్థక చిహ్నం ఆ తీవ్రతను తెలియజేస్తుంది.
- source_word: בְּנִי הַחַי
  choice: బతికున్నవాడు నా కుమారుడు
  rationale: నిర్దిష్టంగా గుర్తించబడుతున్న ఇద్దరు పిల్లల మధ్య ‘బతికున్నవాడు/చనిపోయినవాడు’ అనే హెబ్రీ వ్యత్యాసాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וּבְנֵךְ הַמֵּת
  choice: చనిపోయినవాడు నీ కుమారుడు
  rationale: వ్యతిరేక సమాంతర నిర్మాణాన్ని కాపాడుతూ, మరణించిన నిర్దిష్ట శిశువును సూచిస్తుంది.
- source_word: וְזֹאת אֹמֶרֶת
  choice: ఈమె ... అంది
  rationale: స్త్రీలింగ సూచనార్థకమైన זֹאת యొక్క ‘ఈమె’ అనే దైక్తిక భావాన్ని నిలుపుతుంది.
- source_word: הֶחָי
  choice: బతికున్నవాడు
  rationale: ముందటి పదప్రయోగంతో ఏకరీతిని, వాదనలోని స్పష్టమైన వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: וַתְּדַבֵּרְנָה
  choice: ఇలా వారు ... వాదించుకున్నారు
  rationale: మూలంలోని స్త్రీలింగ బహువచన వాక్కు క్రియ ఈ సందర్భంలో పరస్పర విరుద్ధ వాదనను సంగ్రహిస్తుంది; ‘వాదించుకున్నారు’ న్యాయవిచారణ సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: రాజు ఎదుట
  rationale: మూలంలోని ‘రాజు సమక్షంలో’ అనే అర్థాన్ని సంక్షిప్తంగా, సహజంగా ఇస్తుంది; ‘సొలొమోను’ అని మూలంలో లేని పేరును చేర్చదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రద కథన శైలి. ‘బతికున్నవాడు/చనిపోయినవాడు’ అనే జత ద్వారా హెబ్రీ మూలంలోని నిర్దిష్ట వ్యత్యాసం నిలుపబడింది. చివరి క్రియను సందర్భానుగుణంగా ‘వాదించుకున్నారు’ అని ఇచ్చి పరస్పర విరుద్ధ వాక్యాల కొనసాగింపును సహజంగా వ్యక్తం చేశాం.
