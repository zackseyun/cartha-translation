source:
  edition: WLC
  text: וְ/נָתַתָּ֨ לְ/עַבְדְּ/ךָ֜ לֵ֤ב שֹׁמֵ֨עַ֙ לִ/שְׁפֹּ֣ט אֶֽת עַמְּ/ךָ֔ לְ/הָבִ֖ין בֵּֽין ט֣וֹב לְ/רָ֑ע כִּ֣י מִ֤י יוּכַל֙ לִ/שְׁפֹּ֔ט אֶת עַמְּ/ךָ֥ הַ/כָּבֵ֖ד הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/009.yaml
  text: So give your servant a listening heart to judge your people[a], to discern between good and evil[b], for who is able to judge this great people of yours?
translation:
  language: te
  text: కాబట్టి నీ సేవకునికి నీ ప్రజలకు న్యాయం తీర్చడానికి, మంచి చెడుల మధ్య వివేచించడానికి వినే హృదయాన్ని అనుగ్రహించు[a]. ఎందుకంటే, నీ ఈ గొప్ప[b] ప్రజలకు న్యాయం తీర్చగలవాడు ఎవరు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అర్థం చేసుకునే హృదయాన్ని’; అక్షరార్థంగా ‘వినే/ఆలకించే హృదయాన్ని.’
    reason: lexical_alternative
  - marker: b
    text: ‘గొప్ప’ అని అనువదించిన హీబ్రూ పదానికి అక్షరార్థంగా ‘భారమైన’ లేదా ‘బరువైన’ అని అర్థం. ఇక్కడ అది ప్రజల ప్రాముఖ్యతను లేదా వారిని పాలించే బాధ్యతా భారాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: కాబట్టి ... అనుగ్రహించు
  rationale: ముందటి సందర్భం నుంచి ప్రవహించే విన్నపాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; హీబ్రూ రూపంలోని ‘ఇవ్వు’ భావాన్ని గౌరవప్రదమైన ప్రార్థనా వాడుకలో ‘అనుగ్రహించు’గా అందిస్తుంది.
- source_word: לְעַבְדְּךָ
  choice: నీ సేవకుడు
  rationale: దేవుని ఎదుట సొలొమోను వినయంతో తనను తాను పేర్కొనే రాజసంబంధమైన సంప్రదాయ ప్రయోగాన్ని సహజంగా నిలుపుతుంది.
- source_word: לֵב שֹׁמֵעַ
  choice: వినే హృదయం
  rationale: అక్షరార్థంలోని వినడం/శ్రద్ధగా ఆలకించడం అనే రూపకాన్ని, అలాగే హృదయాన్ని జ్ఞానం మరియు సంకల్పానికి కేంద్రంగా చూసే హీబ్రూ భావప్రపంచాన్ని నిలుపుతుంది.
- source_word: לִשְׁפֹּט
  choice: న్యాయం తీర్చడానికి
  rationale: שפט అనే క్రియలోని న్యాయనిర్ణయ భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది; రాజపాలనా విస్తృతార్థం సందర్భంలో అంతర్లీనంగా ఉంటుంది.
- source_word: עַמְּךָ
  choice: నీ ప్రజలు
  rationale: దేవునికి చెందిన ప్రజలు అనే ఒడంబడిక మరియు రాజకీయ భావాలను రెండింటినీ నిలుపుతుంది.
- source_word: לְהָבִין
  choice: వివేచించడానికి
  rationale: కేవలం అర్థం చేసుకోవడం కంటే, న్యాయనిర్ణయానికి అవసరమైన భేదజ్ఞానాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בֵּין טוֹב לְרָע
  choice: మంచి చెడులను
  rationale: హీబ్రూలోని నైతిక, మూల్యాంకన పదజాలాన్ని ‘మంచి—చెడు’గా నిలుపుతుంది; దానిని ‘న్యాయం—అన్యాయం’ అనే సన్నని అర్థానికి పరిమితం చేయదు.
- source_word: כִּי מִי יוּכַל
  choice: ఎవరు ... తీర్చగలరు?
  rationale: ఆ కార్యభారం ఎదుట మానవ అసమర్థతను సూచించే అలంకారప్రశ్నను సహజమైన తెలుగులో అందిస్తుంది.
- source_word: הַכָּבֵד הַזֶּה
  choice: ఇంత గొప్పవారైన
  rationale: ‘భారమైన/బరువైన’ అనే మూలార్థం ఇక్కడ ప్రజల విస్తృతి, ప్రాముఖ్యత లేదా వారిని పాలించే బాధ్యతా భారాన్ని సూచిస్తుంది; ప్రధాన పాఠ్యంలో ‘గొప్పవారైన’ సహజంగా ఉండగా, మూలంలోని బహుఅర్థాన్ని పాదటిప్పణి నిలుపుతుంది.
theological_decisions:
- issue: సొలొమోను కోరిన ‘వినే హృదయం’ అనే మానవస్వరూప సంబంధమైన నానుడి
  choice: వినే హృదయం
  alternative: అర్థం చేసుకునే హృదయం
  rationale: ‘హృదయం’ అనే మూలరూపకాన్ని ఉంచడం ద్వారా జ్ఞానం, సంకల్పం, స్పందన అన్నీ కలిసిన హీబ్రూ భావాన్ని నిలుపుతుంది; దానిని కేవలం మేధోశక్తిగా సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలి వాడబడింది. ‘వినే హృదయం’ అనే ఉద్దేశపూర్వకంగా కొంత అసాధారణమైన రూపకం మూల హీబ్రూ చిత్రాన్ని నిలుపుతుంది; ‘న్యాయం తీర్చడం’ సాధారణ పాఠకులకు స్పష్టమైన న్యాయపాలనా ప్రయోగం.
