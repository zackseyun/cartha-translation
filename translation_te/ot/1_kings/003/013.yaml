  to: నీవు అడగనివి కూడా నీకు ఇచ్చాను—ఐశ్వర్యాన్నీ ఘనతనూ. దానివల్ల నీ జీవితకాలమంతా రాజులలో నీలాంటి వాడు ఎవరూ ఉండడు.[a]
  rationale: The revision removes the unsupported ‘another,’ retains the royal comparison and the promise-context future reading, and replaces the inaccurate gender-ambiguity explanation with a focused note on the Hebrew verb’s temporal/stative interpretive range.
