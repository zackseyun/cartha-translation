id: 1KI.3.13
reference: 1 Kings 3:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/גַ֨ם אֲשֶׁ֤ר לֹֽא שָׁאַ֨לְתָּ֙ נָתַ֣תִּי לָ֔/ךְ גַּם עֹ֖שֶׁר גַּם כָּב֑וֹד אֲ֠שֶׁר לֹא הָיָ֨ה כָמ֥וֹ/ךָ אִ֛ישׁ בַּ/מְּלָכִ֖ים כָּל יָמֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/013.yaml
  text: And I have also given you what you did not ask for[a], both riches and honor, so that there has been no man like you among the kings all your days.
translation:
  language: te
  text: నీవు అడగనివి కూడా నీకు ఇచ్చాను—ఐశ్వర్యాన్నీ ఘనతనూ. దానివల్ల నీ జీవితకాలమంతా రాజులలో నీలాంటి వాడు ఎవరూ ఉండడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ జీవితకాలమంతా రాజులలో నీలాంటి వాడెవరూ లేరు.” హీబ్రూ క్రియారూపాన్ని గత/వర్తమాన స్థితిగా కూడా అర్థం చేసుకోవచ్చు.
    reason: హీబ్రూ పర్ఫెక్ట్ క్రియారూపానికి సందర్భానుసారంగా భవిష్యత్ వాగ్దాన భావం లేదా గత/స్థితి భావం ఉండవచ్చు.
lexical_decisions:
- source_word: וְגַם אֲשֶׁר לֹא שָׁאַלְתָּ
  choice: నీవు అడగనివి కూడా
  rationale: וְגַם లోని కొనసాగింపు, అదనపు భావాన్ని ‘కూడా’ సహజంగా తెలియజేస్తుంది; సంబంధ వాక్యాన్ని ఆధునిక తెలుగులో ‘నీవు అడగనివి’గా సంక్షిప్తంగా వ్యక్తం చేశాం.
- source_word: נָתַתִּי לָךְ
  choice: నీకు ఇచ్చాను
  rationale: దేవుని పూర్తయిన అనుగ్రహాన్ని హీబ్రూ పర్ఫెక్ట్ సూచిస్తుంది; తెలుగు భూతకాల రూపం దీనిని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: גַּם עֹשֶׁר גַּם כָּבוֹד
  choice: ఐశ్వర్యాన్నీ ఘనతనూ
  rationale: పునరుక్తమైన גַּם రెండు వరాలనూ విడివిడిగా నొక్కిచెబుతుంది; ‘-నీ ... -నూ’ నిర్మాణం ఆ సమన్వయాన్ని నిలుపుతుంది. రాజసంబంధ సందర్భంలో כָּבוֹדకు ‘ఘనత’ సహజమైన ఎంపిక.
- source_word: אֲשֶׁר לֹא הָיָה כָמוֹךָ אִישׁ
  choice: అందువల్ల ... నీలాంటి వాడు మరొకడు ఉండడు
  rationale: ఈ אֲשֶׁר ముందున్న వరాల ఫలితాన్ని పరిచయం చేస్తుందని ప్రధాన పాఠంలో తీసుకున్నాం. אִישׁ యొక్క పురుష ఏకవచన భావాన్ని ‘వాడు’ నిలుపుతుంది; భావి జీవితకాలమంతటికీ వర్తించే దైవ వాగ్దానంగా ‘ఉండడు’ సహజంగా ఉంది.
- source_word: בַּמְּלָכִים
  choice: రాజులలో
  rationale: సొలొమోనును రాజుల సమూహంలో పోల్చే భావాన్ని సహజమైన తెలుగు విభక్తితో వ్యక్తం చేస్తుంది.
- source_word: כָּל יָמֶיךָ
  choice: నీ జీవితకాలమంతా
  rationale: ‘నీ దినాలన్నీ’ అనే హీబ్రూ నుడికారానికి ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన సమానార్థక రూపం.
theological_decisions:
- issue: אִישׁ ను పోలిక వాక్యంలో ఎలా అనువదించాలి
  choice: నీలాంటి వాడు మరొకడు
  alternative: నీలాంటి ఎవరూ
  rationale: మూలంలో ఉన్న పురుష ఏకవచన నామవాచకాన్ని ప్రధాన పాఠం నిలుపుతుంది; లింగనిరపేక్షమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- issue: לֹא הָיָה తో కూడిన వాక్యపు కాలం మరియు ఫలిత భావం
  choice: అందువల్ల ... ఉండడు
  alternative: '... లేడు / ఉండలేదు'
  rationale: పూర్తి జీవితకాలాన్ని సూచించే כָּל יָמֶיךָ సందర్భంలో ఇది సొలొమోను భవిష్యత్తు అంతటికీ వర్తించే ఫలిత వాగ్దానంగా సహజంగా అర్థమవుతుంది. అయినా హీబ్రూ పర్ఫెక్ట్‌ను గత/స్థితి భావంతో గ్రహించే అవకాశం ఉన్నందున దానిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. వరాల జాబితాను స్పష్టంచేయడానికి దీర్ఘవిరామం వాడాం; ‘ఐశ్వర్యం’, ‘ఘనత’ పదాలు రాజసంబంధ సందర్భానికి తగిన ఔన్నత్యాన్ని కలిగి ఉన్నప్పటికీ సాధారణ పాఠకులకు సుపరిచితమైనవే.
