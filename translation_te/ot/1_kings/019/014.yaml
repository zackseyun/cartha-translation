source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ קַנֹּ֨א קִנֵּ֜אתִי לַ/יהוָ֣ה אֱלֹהֵ֣י צְבָא֗וֹת כִּֽי עָזְב֤וּ בְרִֽיתְ/ךָ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת מִזְבְּחֹתֶ֣י/ךָ הָרָ֔סוּ וְ/אֶת נְבִיאֶ֖י/ךָ הָרְג֣וּ בֶ/חָ֑רֶב וָ/אִוָּתֵ֤ר אֲנִי֙ לְ/בַדִּ֔/י וַ/יְבַקְשׁ֥וּ אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/014.yaml
  text: And he said[a], “I have been very zealous for Yahweh, the God of hosts, because the sons of Israel have forsaken your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they seek my life[b], to take it.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “సైన్యాల దేవుడైన యెహోవా కోసం నేను ఎంతో ఉత్సాహపడ్డాను.[a] ఎందుకంటే ఇశ్రాయేలీయులు[b] నీ నిబంధనను విడిచిపెట్టారు, నీ బలిపీఠాలను కూల్చివేశారు, నీ ప్రవక్తలను ఖడ్గంతో చంపేశారు. నేనొక్కడినే మిగిలాను; వారు నా ప్రాణాన్ని తీయడానికి ప్రయత్నిస్తున్నారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నేను అత్యంత జలసి చూపాను.” హీబ్రూలో ఒకే మూలానికి చెందిన infinitive absolute మరియు క్రియారూపం కలిసి ఈ భావాన్ని బలంగా ఉద్ఘాటిస్తున్నాయి.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థం “ఇశ్రాయేలు కుమారులు”; ఇక్కడ అది ఇశ్రాయేలు ప్రజలందరినీ సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַנֹּא קִנֵּאתִי
  choice: నేను ఎంతో ఉత్సాహంతో రగిలిపోయాను
  rationale: క్రియకు ముందు అదే మూలం నుంచి వచ్చిన infinitive absolute ఉండడం భావాన్ని తీవ్రం చేస్తుంది. తెలుగు పాఠకులకు సహజంగా ఉండేలా, యెహోవా పట్ల ఏలీయాకు ఉన్న తీవ్రమైన నిబంధనా నిబద్ధతను ఈ ప్రయోగం తెలియజేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవా కోసం
  rationale: ל ఉపసర్గ ఏలీయా ఉత్సాహం ఎవరి పక్షాన లేదా ఎవరి నిమిత్తం ఉందో తెలియజేస్తుంది. దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: సైన్యాల దేవుడు
  rationale: צבאות భూలోక లేదా పరలోక సైన్యాలను సూచించగల విస్తృత పదం. ‘సైన్యాల దేవుడు’ స్థిరమైన దైవబిరుదును అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఏలీయా తన తీవ్రమైన ఉత్సాహానికి చెప్పే కారణాన్ని ఆధునిక తెలుగులో స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: עָזְבוּ בְרִיתְךָ
  choice: నీ నిబంధనను విడిచిపెట్టారు
  rationale: עזב అంటే విడిచిపెట్టడం లేదా త్యజించడం. ఈ అనువాదం నిబంధనను ఉల్లంఘించిన తీవ్రతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’ అయినా, ఇక్కడ ఇది మొత్తం ఇశ్రాయేలు ప్రజలను సూచించే జాతీయ-నిబంధనా నామం. ‘ఇశ్రాయేలీయులు’ ఆధునిక తెలుగులో సహజంగా, సమగ్రంగా ఉంటుంది.
- source_word: מִזְבְּחֹתֶיךָ הָרָסוּ
  choice: నీ బలిపీఠాలను కూల్చివేశారు
  rationale: הרס కూల్చివేయడం లేదా నేలమట్టం చేయడం అనే బలమైన భావాన్ని ఇస్తుంది.
- source_word: נְבִיאֶיךָ הָרְגוּ בֶחָרֶב
  choice: నీ ప్రవక్తలను ఖడ్గంతో చంపేశారు
  rationale: ఖడ్గం సాధనంగా ఉపయోగించబడిందనే హీబ్రూ నిర్మాణాన్ని, దాని హింసాత్మక స్పష్టతతో సహా నిలుపుతుంది.
- source_word: וָאִוָּתֵר אֲנִי לְבַדִּי
  choice: నేనొక్కడినే మిగిలాను
  rationale: אֲנִי לְבַדִּיలోని ఏలీయా ఒంటరితనపు ఉద్ఘాటనను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיְבַקְשׁוּ אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: నా ప్రాణాన్ని తీయాలని వారు చూస్తున్నారు
  rationale: ఈ సందర్భంలో נפש అమూర్తమైన ‘ఆత్మ’ను కాక వ్యక్తి ప్రాణాన్ని సూచిస్తుంది. ‘ప్రాణం తీయడం’ హత్య చేయాలని ప్రయత్నించడాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో నిబంధనా దైవనామం నేరుగా ఉంది. దాన్ని సాధారణ బిరుదుగా మార్చకుండా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచాం.
- issue: קַנֹּא קִנֵּאתִיలోని ఉత్సాహం/ఈర్ష్య భావం
  choice: ఎంతో ఉత్సాహంతో రగిలిపోయాను
  alternative: మిక్కిలి రోషంతో ఉన్నాను
  rationale: హీబ్రూ మూలం ఉత్సాహం, ఈర్ష్య, రోషం వంటి పరస్పర సంబంధిత భావాలను కలిగి ఉండగలదు. ఇక్కడ ఏలీయా తన నిబంధనా నిబద్ధతను చెబుతున్నందున ‘ఉత్సాహం’ను ప్రధాన పాఠంలో ఉంచి, ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో నిలిపాం.
- issue: בְּנֵי יִשְׂרָאֵל అనే సామూహిక పదబంధం
  choice: ఇశ్రాయేలీయులు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: ఇక్కడ వ్యాకరణపరమైన పుంలింగ రూపం కేవలం పురుషులను కాక జాతి మొత్తాన్ని సూచిస్తుంది. అందువల్ల సహజమైన సామూహిక రూపాన్ని ప్రధాన పాఠంలో వాడి, అక్షరార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు స్పష్టంగా ఉండే శైలి వాడబడింది. ‘బలిపీఠాలు,’ ‘నిబంధన,’ ‘ప్రవక్తలు,’ ‘ఖడ్గం’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని నిలిపి, అసహజమైన అక్షరానువాదాలను నివారించాం.
