  to: 'అతడు ఇలా అన్నాడు: “సైన్యాల దేవుడైన యెహోవా కోసం నేను ఎంతో ఉత్సాహపడ్డాను.[a] ఎందుకంటే ఇశ్రాయేలీయులు[b] నీ నిబంధనను విడిచిపెట్టారు, నీ బలిపీఠాలను కూల్చివేశారు, నీ ప్రవక్తలను ఖడ్గంతో చంపేశారు. నేనొక్కడినే మిగిలాను; వారు నా ప్రాణాన్ని తీయడానికి ప్రయత్నిస్తున్నారు.”'
