  revision_rationale: పాదటిప్పణి aలోని అసంగతమైన ‘రోషం’ ప్రత్యామ్నాయాన్ని తొలగించి, మూలపదానికి సందర్భోచితమైన ‘జలసి’ ప్రత్యామ్నాయాన్ని ఇచ్చాం. ప్రధాన పాఠంలోని ప్రారంభ వాక్యాన్ని మరింత సహజంగా చేశాం; చివరి వాక్యంలో ప్రాణాన్ని తీసుకోవాలనే వారి ప్రయత్నాన్ని హీబ్రూ ప్రయోజనార్థక భావానికి దగ్గరగా స్పష్టం చేశాం. ఇతర పదజాలం, పేర్లు, మరియు పాదటిప్పణి b యథావిధిగా సరైనవే.
