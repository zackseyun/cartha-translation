    rationale: కַנֹּא קִנֵּאתִי అనేది infinitive absolute ద్వారా బలపరచబడిన ‘నేను అత్యంత ఉత్సాహపడ్డాను/జలసి చూపాను’ అనే భావం. ఈ సందర్భంలో ‘రోషం’ ప్రత్యక్ష అర్థప్రత్యామ్నాయం కాదు; అది కోపాన్ని ప్రధాన భావంగా తప్పుగా సూచిస్తుంది.
