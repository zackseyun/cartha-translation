revisions:
- from: 'అతడు ఇలా అన్నాడు: “సైన్యాలకు దేవుడైన యెహోవా కోసం నేను ఎంతో ఆసక్తితో రగిలిపోయాను. ఎందుకంటే ఇశ్రాయేలు ప్రజలు నీ నిబంధనను విడిచిపెట్టారు, నీ బలిపీఠాలను కూల్చివేశారు, నీ ప్రవక్తలను కత్తితో చంపారు. నేను, నేను ఒక్కడినే మిగిలాను; ఇప్పుడు నా ప్రాణం తీయడానికి వారు ప్రయత్నిస్తున్నారు.”'
  to: 'అతడు ఇలా అన్నాడు: “సైన్యాల దేవుడైన యాహ్వే కొరకు నేను ఎంతో ఆసక్తి చూపాను. ఎందుకంటే ఇశ్రాయేలు ప్రజలు నీ నిబంధనను విడిచిపెట్టారు, నీ బలిపీఠాలను కూల్చివేశారు, నీ ప్రవక్తలను కత్తితో చంపారు. నేను ఒక్కడినే మిగిలి ఉన్నాను; నా ప్రాణం తీయడానికి వారు నన్ను వెదుకుతున్నారు.”'
  rationale: The revision corrects the construct relationship in the divine title, retains the project’s stated rendering of the divine name, and restores the Hebrew sense that Elijah’s enemies are seeking him in order to take his life. It also smooths the emphatic solitary-survivor clause without adding interpretation.
