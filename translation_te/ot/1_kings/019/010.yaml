id: 1KI.19.10
reference: 1 Kings 19:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ קַנֹּ֨א קִנֵּ֜אתִי לַ/יהוָ֣ה אֱלֹהֵ֣י צְבָא֗וֹת כִּֽי עָזְב֤וּ בְרִֽיתְ/ךָ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת מִזְבְּחֹתֶ֣י/ךָ הָרָ֔סוּ וְ/אֶת נְבִיאֶ֖י/ךָ הָרְג֣וּ בֶ/חָ֑רֶב וָֽ/אִוָּתֵ֤ר אֲנִי֙ לְ/בַדִּ֔/י וַ/יְבַקְשׁ֥וּ אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/010.yaml
  text: And he said[a], “I have been very zealous for Yahweh, the God of hosts, because the sons of Israel have forsaken your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they seek my life[c][b], to take it.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “సైన్యాల దేవుడైన యాహ్వే కొరకు నేను ఎంతో ఆసక్తి చూపాను. ఎందుకంటే ఇశ్రాయేలు ప్రజలు నీ నిబంధనను విడిచిపెట్టారు, నీ బలిపీఠాలను కూల్చివేశారు, నీ ప్రవక్తలను కత్తితో చంపారు. నేను ఒక్కడినే మిగిలి ఉన్నాను; నా ప్రాణం తీయడానికి వారు నన్ను వెదుకుతున్నారు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַנֹּא קִנֵּאתִי
  choice: నేను ఎంతో ఆసక్తితో రగిలిపోయాను
  rationale: ధాతురూపానికి ముందు అదే ధాతువు యొక్క absolute infinitive రావడం తీవ్రతను సూచిస్తుంది. ‘ఎంతో ఆసక్తితో రగిలిపోయాను’ అనేది అసూయ అనే అపార్థాన్ని నివారిస్తూ దేవునిపట్ల ఏలీయా చూపిన ప్రగాఢ నిబంధనాసక్తిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవా కోసం
  rationale: మూలంలో ఉన్న יהוה అనే ప్రత్యేక నిబంధన నామాన్ని బిరుదుతో మార్చకుండా, తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచింది.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: సైన్యాలకు దేవుడైన
  rationale: צְבָאוֹת యొక్క సైన్యాలు/దళాలు అనే భావాన్ని కాపాడుతుంది; వేరొక దైవబిరుదైన ‘సర్వశక్తిమంతుడు’ను దిగుమతి చేయదు.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఏలీయా ఆసక్తికి తరువాతి వాక్యాలు కారణాన్ని తెలియజేస్తున్నందున ఆధునిక తెలుగులో స్పష్టమైన కారణసంబంధాన్ని చూపుతుంది.
- source_word: עָזְבוּ בְרִיתְךָ
  choice: నీ నిబంధనను విడిచిపెట్టారు
  rationale: עָזַב లోని విడిచిపెట్టడం/త్యజించడం అనే భావాన్నీ, నిబంధన ఉల్లంఘనలోని గంభీరతనూ సహజంగా తెలియజేస్తుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: పదశః ‘ఇశ్రాయేలు కుమారులు’ అయినా, ఇక్కడ మొత్తం నిబంధన సమాజాన్ని సూచిస్తుంది. ‘ఇశ్రాయేలు ప్రజలు’ ఆధునిక తెలుగులో సహజంగా అదే సమూహార్థాన్ని ఇస్తుంది.
- source_word: מִזְבְּחֹתֶיךָ הָרָסוּ
  choice: నీ బలిపీఠాలను కూల్చివేశారు
  rationale: הָרַס యొక్క నిర్మాణాన్ని పడగొట్టడం/కూల్చడం అనే సజీవ భావాన్ని నిలుపుతుంది.
- source_word: נְבִיאֶיךָ הָרְגוּ בֶחָרֶב
  choice: నీ ప్రవక్తలను కత్తితో చంపారు
  rationale: క్రియను, సాధనాన్ని రెండింటినీ నేరుగా మరియు గంభీరంగా ప్రతిబింబిస్తుంది.
- source_word: וָאִוָּתֵר אֲנִי לְבַדִּי
  choice: నేను, నేను ఒక్కడినే మిగిలాను
  rationale: అదనంగా ఉంచిన אֲנִי మరియు לְבַדִּי కలిగించే ఏలీయా ఏకాకిత్వపు ఉద్ఘాటనను తెలుగులో పునరుక్తితో కాపాడుతుంది.
- source_word: וַיְבַקְשׁוּ אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: నా ప్రాణం తీయడానికి వారు ప్రయత్నిస్తున్నారు
  rationale: נֶפֶשׁ ఇక్కడ సాంకేతికంగా ‘ఆత్మ’ కాదు, వ్యక్తి ప్రాణాన్ని సూచిస్తుంది. మొత్తం హీబ్రూ నుడికారాన్ని తెలుగులో హత్యాయత్నం అనే ఉద్దేశం స్పష్టమయ్యేలా సహజంగా అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే / ప్రభువు
  rationale: మూలపాఠంలో ప్రత్యేక దైవనామం నేరుగా ఉంది. దానిని సాధారణ బిరుదైన ‘ప్రభువు’గా మార్చకుండా నామరూపంలో ఉంచడం మూలంలోని నిబంధనాత్మక ప్రత్యేకతను కాపాడుతుంది; ‘యెహోవా’ తెలుగు బైబిలు వాడుకలో సుపరిచితం.
- issue: ఏలీయా చెప్పిన ‘నేను ఒక్కడినే’ అనే వాదన
  choice: వాక్యంలోని సంపూర్ణ ఏకాకిత్వ వాదనను యథాతథంగా ఉంచడం
  alternative: ‘విశ్వాసంగా ఉన్నవారిలో నేను ఒక్కడినే’ అని వివరణ జోడించడం
  rationale: తరువాతి సందర్భం ఈ వాదనను సవాలు చేసినప్పటికీ, ఈ వచనంలో ఏలీయా పలికిన ఉద్విగ్నమైన వాదనను అనువాదం సవరించకూడదు.
- issue: קנא యొక్క భావం
  choice: ఆసక్తితో రగిలిపోయాను
  alternative: అత్యంత రోషపడ్డాను / అసూయపడ్డాను
  rationale: ఈ పదానికి zeal మరియు jealousy రెండింటి పరిధి ఉన్నా, ఇక్కడ యెహోవా నిబంధన గౌరవం కోసం ఏలీయా చూపిన తీవ్రమైన ఆసక్తి ప్రధానమైనది. అయినప్పటికీ ‘రగిలిపోయాను’ అనే రూపం భావోద్వేగ తీవ్రతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకుడికి సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. హీబ్రూ ఉద్ఘాటనను ‘నేను, నేను ఒక్కడినే’ ద్వారా నిలిపి, అసహజమైన పదశః అనువాదాలను నివారించాం.
