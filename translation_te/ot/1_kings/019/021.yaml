reference: 1 Kings 19:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֨שָׁב מֵ/אַחֲרָ֜י/ו וַ/יִּקַּ֣ח אֶת צֶ֧מֶד הַ/בָּקָ֣ר וַ/יִּזְבָּחֵ֗/הוּ וּ/בִ/כְלִ֤י הַ/בָּקָר֙ בִּשְּׁלָ֣/ם הַ/בָּשָׂ֔ר וַ/יִּתֵּ֥ן לָ/עָ֖ם וַ/יֹּאכֵ֑לוּ וַ/יָּ֗קָם וַ/יֵּ֛לֶךְ אַחֲרֵ֥י אֵלִיָּ֖הוּ וַ/יְשָׁרְתֵֽ/הוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/021.yaml
  text: Then he turned back from following him[a], took the pair of oxen, and sacrificed them. With the oxen’s equipment he boiled the flesh and gave it to the people, and they ate[b]. Then he arose and went after Elijah and served him.
translation:
  language: te
  text: అప్పుడు అతడు ఏలీయా వెనుకనుండి తిరిగి వచ్చి, ఆ జత ఎద్దులను తీసుకొని బలిగా అర్పించాడు.[a] ఎద్దుల సామగ్రిని ఇంధనంగా ఉపయోగించి వాటి మాంసాన్ని ఉడికించి, ప్రజలకు ఇచ్చాడు; వారు తిన్నారు.[b] తరువాత అతడు లేచి ఏలీయా వెనుక వెళ్లి అతనికి సేవ చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎద్దుల కాడిని.”
    reason: lexical_alternative
  - marker: b
    text: “ఎద్దుల సామగ్రి” అనే మాటకు “ఎద్దుల కాడి లేదా ఇతర పనిముట్లు” అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב מֵאַחֲרָיו
  choice: ఏలీయాను వెంబడించడం మానుకొని వెనక్కి తిరిగి
  rationale: హీబ్రూ నుడికారం అక్షరార్థంగా ‘అతని వెనుకనుండి తిరిగాడు.’ ముందు వచనంలో ఎలీషా ఏలీయా వెనుక పరుగెత్తిన సందర్భాన్ని తెలుగులో సహజంగా తెలియజేస్తూ దిశాభావాన్ని నిలుపుతుంది.
- source_word: צֶמֶד הַבָּקָר
  choice: ఆ జత ఎద్దులను
  rationale: צֶמֶד అనేది సాధారణంగా కాడికి కట్టిన జతను సూచిస్తుంది. వధించబడేవి ఎద్దులే కాబట్టి ప్రధాన వాక్యంలో ‘జత ఎద్దులు’ స్పష్టంగా ఉంది; ‘కాడెద్దులు’ అనే భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַיִּזְבָּחֵהוּ
  choice: బలిగా అర్పించాడు
  rationale: זבח సాధారణ వధకన్నా బలివధ భావాన్ని కలిగి ఉంటుంది. అయితే బలి ఎవరికి లేదా ఏ ఆచారస్థలంలో అర్పించబడిందో వచనం చెప్పనందున అదనపు వివరాలు చేర్చలేదు.
- source_word: וּבִכְלִי הַבָּקָר
  choice: ఎద్దుల పనిముట్లను కట్టెలుగా ఉపయోగించి
  rationale: כְּלִי విస్తృతంగా సామగ్రి లేదా పనిముట్లను సూచిస్తుంది. తరువాతి వంటక్రియతో ఉన్న సంబంధం వల్ల అవి ఇంధనంగా ఉపయోగించబడ్డాయని సహజ తెలుగులో తెలిపాం; నిర్దిష్టంగా ‘కాడి’ అని మాత్రమే పరిమితం చేయలేదు.
- source_word: בִּשְּׁלָם הַבָּשָׂר
  choice: వాటి మాంసాన్ని ఉడికించి
  rationale: בשל అంటే ఉడికించడం లేదా వండడం; ‘ఉడికించి’ మూలంలోని నిర్దిష్ట భావానికి దగ్గరగా ఉంది. בשר కు ఆధునిక తెలుగులో సహజమైన ‘మాంసం’ వాడాం.
- source_word: לָעָם
  choice: ప్రజలకు
  rationale: స్థానిక సమాజంలోని ప్రజలను నేరుగా, తటస్థంగా సూచిస్తుంది.
- source_word: וַיָּקָם
  choice: తరువాత అతడు లేచి
  rationale: హీబ్రూ కథన క్రమాన్ని నిలుపుతూ, తెలుగులో సహజమైన గంభీర శైలిని ఇస్తుంది.
- source_word: וַיֵּלֶךְ אַחֲרֵי אֵלִיָּהוּ
  choice: ఏలీయా వెనుక వెళ్లి
  rationale: అక్షరార్థంలోని ‘ఏలీయా వెనుక వెళ్లాడు’ అనే భౌతిక అనుసరణ చిత్రాన్ని నిలుపుతుంది.
- source_word: וַיְשָׁרְתֵהוּ
  choice: అతనికి సేవ చేశాడు
  rationale: שרת సేవ చేయడం, సహాయకునిగా పరిచర్య చేయడం అనే విస్తృత భావాన్ని కలిగి ఉంది. ‘సేవ చేశాడు’ ఆ పాత్రను అనవసరంగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: זבח లోని బలి సంబంధిత భావాన్ని స్పష్టంగా అనువదించాలా
  choice: ‘బలిగా అర్పించాడు’ అని అనువదించడం
  alternative: ‘వధించాడు’ అని బలి భావాన్ని వ్యక్తం చేయకుండా అనువదించడం
  rationale: ఈ క్రియ సాధారణంగా బలివధ భావాన్ని కలిగి ఉంది; సామూహిక భోజన సందర్భం కూడా దానితో సరిపోతుంది. అయినా బలి ఎవరికి అర్పించబడిందో లేదా అది ఏ విధమైన ఆచారమో అనువాదం నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యక్రమాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, అసహజమైన అక్షరానువాదాన్ని నివారించాం. పాదసూచిక గుర్తులు రెండూ ప్రధాన వచనంలో ఉన్నాయి.
