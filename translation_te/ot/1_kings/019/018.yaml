  text: וְ/הִשְׁאַרְתִּ֥י בְ/יִשְׂרָאֵ֖ל שִׁבְעַ֣ת אֲלָפִ֑ים כָּל הַ/בִּרְכַּ֗יִם אֲשֶׁ֤ר לֹֽא כָֽרְעוּ֙ לַ/בַּ֔עַל וְ/כָ֨ל הַ/פֶּ֔ה אֲשֶׁ֥ר לֹֽא נָשַׁ֖ק לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/018.yaml
  text: Yet I have left for myself seven thousand in Israel—all the knees that have not bowed to Baal[b][a], and every mouth that has not kissed him.
translation:
  language: te
  text: అయితే, ఇశ్రాయేలులో నేను ఏడు వేల మందిని మిగిల్చాను—అంటే బయలుకు మోకాళ్లు వంచని వారందరినీ, అతనికి ముద్దుపెట్టని ప్రతి నోటినీ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలులో ఏడు వేల మందిని కాపాడి ఉంచాను.”
    reason: lexical_alternative
  - marker: b
    text: విగ్రహానికి ముద్దుపెట్టడం దానికి గౌరవం లేదా ఆరాధన చెల్లించే చర్య.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִשְׁאַרְתִּי
  choice: అయితే ... నేను మిగిల్చాను
  rationale: שׁאר హిఫిల్ ప్రథమ పురుష ఏకవచనం ‘మిగిలి ఉండేలా చేయడం/కాపాడి ఉంచడం’ అనే భావాన్ని ఇస్తుంది. సందర్భంలో ఏలీయా ఫిర్యాదుకు విరుద్ధంగా దేవుని సమాధానాన్ని ‘అయితే’ తెలియజేస్తుంది; సంపూర్ణ క్రియ ప్రస్తుత ఫలితమున్న గత చర్యగా అనువదించబడింది.
- source_word: בְיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో
  rationale: స్థానార్థక ప్రయోగానికి సహజమైన తెలుగు రూపం.
- source_word: שִׁבְעַת אֲלָפִים
  choice: ఏడు వేల మందిని
  rationale: హీబ్రూ సంఖ్యా నిర్మాణాన్ని సహజమైన తెలుగులో ఇచ్చి, తరువాతి శరీరావయవ రూపకాల ద్వారా సూచించబడినవారు మనుషులని ‘మందిని’తో స్పష్టం చేశాం.
- source_word: כָּל הַבִּרְכַּיִם אֲשֶׁר לֹא כָרְעוּ לַבַּעַל
  choice: బయలుకు మోకాళ్లు వంచని వారినీ
  rationale: ‘మోకాళ్లు’ అనే శరీరావయవ చిత్రాన్ని నిలిపి, כּרע సూచించే ఆరాధనాపూర్వకంగా వంగడాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలిపింది.
- source_word: הַבַּעַל
  choice: బయలు
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదం ఉన్నప్పటికీ, తెలుగులో ఈ దేవత పేరును సహజంగా వ్యక్తినామంలా ‘బయలు’ అని ఇచ్చాం.
- source_word: וְכָל הַפֶּה אֲשֶׁר לֹא נָשַׁק לוֹ
  choice: అతనికి ముద్దుపెట్టని వారినీ
  rationale: נשׁק యొక్క ప్రాథమిక అర్థమైన ‘ముద్దుపెట్టు’ను నిలిపాం. ‘అతనికి’ హీబ్రూ సర్వనామాన్ని అనుసరిస్తూ బయలును సూచిస్తుంది; తెలుగులో అసహజమైన ‘ప్రతి నోరు’కు బదులు వ్యక్తులను సూచించే సహజ నిర్మాణం వాడాం.
theological_decisions:
- issue: తరువాతి సిద్ధాంతపరమైన పరిభాషను చేర్చకుండా దేవుడు మిగిల్చినవారి ప్రకటనను అనువదించడం
  choice: నేను మిగిల్చాను
  alternative: నా కోసం నేను కాపాడి ఉంచాను
  rationale: వాక్యం దేవుడు నమ్మకంగా ఉన్నవారిని నిలిపి ఉంచినట్లు చెబుతుంది. అయితే మూలంలో స్పష్టంగా లేని సాంకేతిక సిద్ధాంతపదాన్ని చేర్చలేదు; ‘మిగిల్చాను’ దేవుని చర్యను నిలిపి ఉంచుతూ ‘నా కోసం’ అనే భావాన్ని పాఠ్యంలో బలవంతంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. హీబ్రూ శరీరావయవ చిత్రాల్లో ‘మోకాళ్లు’ నిలిపి, తెలుగులో అసహజంగా వినిపించే ‘ప్రతి నోరు’ను వ్యక్తులను సూచించే సహజ రూపంలో ఇచ్చాం. రెండు పాదాల సమాంతరత్వాన్ని ‘వారినీ ... వారినీ’తో కాపాడాం.
