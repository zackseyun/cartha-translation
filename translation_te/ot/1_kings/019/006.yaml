source:
  edition: WLC
  text: וַ/יַּבֵּ֕ט וְ/הִנֵּ֧ה מְרַאֲשֹׁתָ֛י/ו עֻגַ֥ת רְצָפִ֖ים וְ/צַפַּ֣חַת מָ֑יִם וַ/יֹּ֣אכַל וַ/יֵּ֔שְׁתְּ וַ/יָּ֖שָׁב וַ/יִּשְׁכָּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/006.yaml
  text: He looked[a], and behold, at his head was a cake baked on hot stones and a jar of water. He ate and drank and lay down again.
translation:
  language: te
  text: అతడు చూశాడు; ఇదిగో, అతని తల దగ్గర వేడిచేసిన రాళ్లపై కాల్చిన ఒక రొట్టె[a], నీటి పాత్ర ఉన్నాయి. అతడు తిని, తాగి, మళ్లీ పడుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిప్పులపై కాల్చిన రొట్టె.’ హిబ్రూ పదం రొట్టె కాల్చడానికి ఉపయోగించిన వేడిచేసిన రాళ్లను సూచించవచ్చు; కొందరు దీనిని మరింత సాధారణంగా ‘నిప్పులు’ అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבֵּט
  choice: అతడు చూసినప్పుడు
  rationale: נבט యొక్క ‘చూడు’ అనే ప్రాథమిక అర్థాన్ని నిలుపుతూ, వెంట వచ్చే וְהִנֵּהతో సహజమైన తెలుగు వాక్యనిర్మాణాన్ని ఇస్తుంది; మూలంలో లేని దిశను చేర్చదు.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: దృష్టిని ఆకర్షించే హిబ్రూ సంభాషణా అవ్యయపు సజీవతను తెలుగు భాషలో సహజంగా నిలుపుతుంది.
- source_word: מְרַאֲשֹׁתָיו
  choice: అతని తలవైపు
  rationale: అతడు పడుకున్న సందర్భంలో తలకు సమీపంలోని ప్రదేశాన్ని సూచిస్తుంది; ‘తల దగ్గర’ కంటే కొద్దిగా మూలరూపానికి దగ్గరగా ఉండి సహజంగానూ ఉంది.
- source_word: עֻגַת
  choice: రొట్టె
  rationale: ఇక్కడ עֻגָה గుండ్రని రొట్టెను సూచిస్తుంది. ఆధునిక తెలుగులో ‘కేక్’ తీపి పదార్థాన్ని సూచించే అవకాశం ఉన్నందున ‘రొట్టె’ సందర్భానికి స్పష్టంగా సరిపోతుంది.
- source_word: רְצָפִים
  choice: వేడిచేసిన రాళ్లపై కాల్చిన
  rationale: ఈ పదం రొట్టె కాల్చడానికి వాడిన వేడి రాళ్లను సూచించే సంభావ్య అర్థాన్ని ప్రధాన పాఠ్యంలో అందిస్తుంది; ‘నిప్పులపై’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: וְצַפַּחַת מָיִם
  choice: ఒక నీళ్ల కుండ
  rationale: צַפַּחַת నీరు ఉంచే చిన్న పాత్రను సూచిస్తుంది; ‘నీళ్ల కుండ’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అర్థమవుతుంది.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ
  choice: అతడు తిని, తాగి
  rationale: వరుసగా జరిగిన సాధారణ క్రియలను సంక్షిప్తంగా, సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది.
- source_word: וַיָּשָׁב וַיִּשְׁכָּב
  choice: మళ్లీ పడుకున్నాడు
  rationale: שׁוּב + שׁכב కలయికలోని తిరిగి పడుకోవడం అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; విడిగా ‘తిరిగి’ అనే క్రియను కృత్రిమంగా చేర్చదు.
