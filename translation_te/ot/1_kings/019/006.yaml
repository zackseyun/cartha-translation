  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైన, గౌరవప్రదమైన కథనశైలి. ‘ఇదిగో’ ద్వారా మూలంలోని దృష్టి-ఆకర్షణ నిలుపబడింది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
