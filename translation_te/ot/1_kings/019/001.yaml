source:
  edition: WLC
  text: וַ/יַּגֵּ֤ד אַחְאָב֙ לְ/אִיזֶ֔בֶל אֵ֛ת כָּל אֲשֶׁ֥ר עָשָׂ֖ה אֵלִיָּ֑הוּ וְ/אֵ֨ת כָּל אֲשֶׁ֥ר הָרַ֛ג אֶת כָּל הַ/נְּבִיאִ֖ים בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/001.yaml
  text: Ahab told Jezebel all that Elijah had done, and how he had killed all the prophets with the sword.
translation:
  language: te
  text: అహాబు ఏలీయా చేసినదంతా, అతడు ప్రవక్తలందరినీ ఖడ్గంతో ఎలా చంపాడో కూడా యెజెబెలుకు తెలియజేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: తెలియజేశాడు
  rationale: హీబ్రూ క్రియకు ‘వివరంగా చెప్పాడు/తెలియజేశాడు’ అనే భావం ఉంది; ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండే రూపం.
- source_word: בֶּחָרֶב
  choice: ఖడ్గంతో
  rationale: ‘ఖడ్గం చేత/ఖడ్గంతో’ అనే సాధనార్థక భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: הַנְּבִיאִים
  choice: ప్రవక్తలందరినీ
  rationale: నిర్దిష్టంగా సూచించిన ప్రవక్తలను తెలుపుతూ, כָּל యొక్క సమగ్ర భావాన్ని ‘అందరినీ’తో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ప్రవక్తలను చంపిన క్రియకు కర్త ఎవరు?
  choice: ‘అతడు’ అనే సర్వనామంతో మూలంలోని ఏలీయా సూచనను నిలిపాం.
  alternative: ‘ఏలీయా ప్రవక్తలందరినీ...’ అని పేరును మళ్లీ స్పష్టంగా చెప్పడం.
  rationale: హీబ్రూలో עָשָׂה మరియు הָרַג రెండూ ఏకవచన పుంలింగ క్రియలు; సమీప పుంలింగ కర్త ఏలీయా. అయితే మూలంలో రెండవసారి పేరు లేకపోవడంతో సర్వనామ రూపాన్ని ఉంచాం.
- issue: וְאֵת כָּל אֲשֶׁר הָרַג నిర్మాణం
  choice: ‘చంపిన సంగతంతా’
  alternative: ‘ఎలా చంపాడో’
  rationale: అక్షరార్థంగా ‘అతడు చంపినదంతా’ అనే కఠిన నిర్మాణాన్ని తెలుగులో సహజంగా చేయడంతో పాటు, విధానార్థాన్ని అనవసరంగా బలపరచకుండా మూలంలోని నివేదిక భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకుడికి సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘యెజెబెలు’, ‘ఏలీయా’, ‘ఖడ్గం’ వంటి స్థిరమైన బైబిలు పదరూపాలు ఉపయోగించబడ్డాయి.
