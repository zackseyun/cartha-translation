- from: భూకంపం తర్వాత అగ్ని వచ్చింది; కానీ ఆ అగ్నిలో యహ్వే లేడు. అగ్ని తర్వాత సన్నని నిశ్శబ్దపు ధ్వని వినిపించింది.[a]
  to: భూకంపం తర్వాత అగ్ని వచ్చింది; యహ్వే ఆ అగ్నిలో లేడు. అగ్ని తర్వాత సన్నని నిశ్శబ్దపు ధ్వని వచ్చింది.[a]
  rationale: The revision removes the unsupported adversative ‘కానీ’ and changes the final supplied verb from ‘వినిపించింది’ to the less interpretive ‘వచ్చింది.’ It preserves the divine name, the locative sense of ‘in the fire,’ and the unresolved lexical tension of קוֹל דְּמָמָה דַקָּה. The footnote continues to identify conventional interpretive alternatives while retaining the literal ambiguity.
