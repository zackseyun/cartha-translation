id: 1KI.19.12
reference: 1 Kings 19:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַחַ֤ר הָ/רַ֨עַשׁ֙ אֵ֔שׁ לֹ֥א בָ/אֵ֖שׁ יְהוָ֑ה וְ/אַחַ֣ר הָ/אֵ֔שׁ ק֖וֹל דְּמָמָ֥ה דַקָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/012.yaml
  text: And after the earthquake[a], a fire; Yahweh was not in the fire. And after the fire, a sound of a gentle whisper.
translation:
  language: te
  text: భూకంపం తర్వాత అగ్ని వచ్చింది; యహ్వే ఆ అగ్నిలో లేడు. అగ్ని తర్వాత సన్నని నిశ్శబ్దపు ధ్వని వచ్చింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చిన్న, నిశ్చల స్వరం,” “మృదువైన గుసగుస,” లేదా “మెల్లని గుసగుస.” హీబ్రూ పదబంధానికి అక్షరార్థంగా “సన్నని నిశ్శబ్దపు ధ్వని/స్వరం” అని ఉంటుంది; ఇది ఉద్దేశపూర్వకంగా సున్నితమైన, అర్థనిర్ణయం కష్టమైన వ్యక్తీకరణ.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַחַר
  choice: తర్వాత
  rationale: సంఘటనల వరుసను తెలిపే హీబ్రూ అనుసంధానాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הָ/רַעַשׁ
  choice: భూకంపం
  rationale: רַעַשׁ అంటే తీవ్రమైన కంపనం లేదా భూకంపం; ఈ దైవప్రత్యక్షత సందర్భంలో ‘భూకంపం’ స్పష్టమైన, సహజమైన అర్థం.
- source_word: אֵשׁ
  choice: అగ్ని
  rationale: తర్వాతి ప్రకృతి ఘటనను సూచిస్తుంది. తెలుగు వాక్యప్రవాహం కోసం మూలంలోని అంతర్లీన క్రియను ‘వచ్చింది’గా వ్యక్తం చేశాం.
- source_word: לֹא בָ/אֵשׁ יְהוָה
  choice: ఆ అగ్నిలో యహ్వే లేడు
  rationale: ב అనే విభక్తి సంబంధాన్ని స్థానార్థకంగా ‘లో’ అని అనువదించి, దేవుని సన్నిధి విధానాన్ని అదనంగా వ్యాఖ్యానించకుండా మూలంలోని పునరుక్త నిర్మాణాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: קוֹל
  choice: ధ్వని
  rationale: קוֹל ‘శబ్దం’ లేదా ‘స్వరం’ రెండింటినీ సూచించగలదు. ఇక్కడ మాటలు పలికినట్టు మూలం స్పష్టంగా చెప్పనందున ‘ధ్వని’ ఆ సందిగ్ధతను కాపాడుతుంది.
- source_word: דְּמָמָה
  choice: నిశ్శబ్దం
  rationale: ఈ పదం నిశ్చలత, మౌనం లేదా ప్రశాంతతను సూచిస్తుంది; ‘నిశ్శబ్దం’ קוֹלతో ఉన్న ఉద్దేశపూర్వక విరుద్ధభావాన్ని నిలుపుతుంది.
- source_word: דַקָּה
  choice: సన్నని
  rationale: דַקָּה యొక్క ‘సన్నని, సూక్ష్మమైన, అతి స్వల్పమైన’ భావాన్ని కాపాడుతూ, దానిని ముందుగానే ‘మృదువైన’ అని వ్యాఖ్యానించకుండా ఉంటుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది; అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించాం.
- issue: קוֹל דְּמָמָה דַקָּה అనే క్లిష్టమైన పదబంధం
  choice: సన్నని నిశ్శబ్దపు ధ్వని
  alternative: మృదువైన గుసగుస / మెల్లని స్వరం / నిశ్చలమైన చిన్న స్వరం
  rationale: ఈ హీబ్రూ పదబంధం ఉద్దేశపూర్వకంగా సున్నితమైనది, అర్థనిర్ణయం కష్టమైనది. ప్రధాన పాఠంలో ‘ధ్వని’–‘నిశ్శబ్దం’ మధ్య ఉద్వేగాన్ని నిలిపి, ‘స్వరం’ లేదా ‘గుసగుస’ అని అతిగా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని క్రియలేని సంక్షిప్త నిర్మాణం తెలుగులో అసహజంగా ఉండే కారణంగా ‘వచ్చింది,’ ‘వినిపించింది’ అనే సందర్భసిద్ధ క్రియలు చేర్చబడ్డాయి. అయితే చివరి హీబ్రూ పదబంధంలోని నిజమైన సందిగ్ధతను ప్రధాన పాఠం మరియు పాదసూచిక రెండింటిలోనూ కాపాడాం.
