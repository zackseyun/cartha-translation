id: 1KI.19.15
reference: 1 Kings 19:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלָ֔י/ו לֵ֛ךְ שׁ֥וּב לְ/דַרְכְּ/ךָ֖ מִדְבַּ֣רָ/ה דַמָּ֑שֶׂק וּ/בָ֗אתָ וּ/מָשַׁחְתָּ֧ אֶת חֲזָאֵ֛ל לְ/מֶ֖לֶךְ עַל אֲרָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/015.yaml
  text: And Yahweh said to him[a], “Go, return by your way to the wilderness of Damascus; and when you arrive[b], you shall anoint Hazael as king over Aram.”
translation:
  language: te
  text: 'యాహ్వే అతనితో ఇలా అన్నాడు: “వెళ్లు, నీ దారినే తిరిగి దమస్కు అరణ్యం వైపు వెళ్లు.[a] నీవు చేరినప్పుడు, హజాయేలును అరాము[b] మీద రాజుగా అభిషేకించు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దమస్కు అరణ్యానికి వెళ్లు.” ‘అరణ్యం’ అనే హీబ్రూ రూపంలో దిశను సూచించే అంత్యం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘అరాము’ అనే హీబ్రూ భూభాగపు పేరు చాలాసార్లు ‘సిరియా’ అని అనువదించబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సహజమైన లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: לֵךְ שׁוּב
  choice: వెళ్లు, ... తిరిగి ... వెళ్లు
  rationale: హీబ్రూలోని రెండు ఆజ్ఞారూపాలైన ‘వెళ్లు’ మరియు ‘తిరుగు’ రెండింటి భావాన్ని నిలిపి, తెలుగులో స్పష్టంగా వినిపించేలా అనువదించాం.
- source_word: לְדַרְכְּךָ
  choice: నీ దారిలో
  rationale: ‘నీ దారికి/నీ దారి వెంట’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఏ ప్రత్యేక మార్గాన్ని మూలం చెప్పనందున అదనపు వివరాన్ని చేర్చలేదు.
- source_word: מִדְבָּרָה דַמָּשֶׂק
  choice: దమస్కు అరణ్యానికి
  rationale: ‘అరణ్యం’ అనే పదంలోని దిశాసూచక ప్రత్యయం ఆ ప్రాంతం వైపు కదలికను సూచిస్తుంది. ప్రధాన పాఠంలో గమ్యార్థాన్ని ఇచ్చి, సాధ్యమైన ‘వైపు’ అనువాదాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וּבָאתָ
  choice: నీవు అక్కడికి చేరినప్పుడు
  rationale: రూపరీత్యా ‘నీవు వచ్చి/వస్తావు’ అయినప్పటికీ, సందర్భంలో తదుపరి చర్య చేరుకున్న తరువాత జరగాలని సూచించే క్రమార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּמָשַׁחְתָּ
  choice: అభిషేకించు
  rationale: సంయోజకంతో వచ్చిన సంపూర్ణ క్రియ ముందున్న ఆజ్ఞను కొనసాగిస్తుంది; తెలుగులో ప్రత్యక్ష ఆజ్ఞారూపం ఆ నియామక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: חֲזָאֵל
  choice: హజాయేలు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: לְמֶלֶךְ עַל אֲרָם
  choice: అరాము మీద రాజుగా
  rationale: రాజుగా నియమించే సూత్రాన్ని సహజంగా వ్యక్తం చేస్తూ, తరువాతి కాలపు ‘సిరియా’ అనే పేరుకు బదులు మూలంలోని ‘అరాము’ను నిలిపాం.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవ నామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
- issue: హజాయేలును రాజుగా అభిషేకించాలనే ఆజ్ఞ యొక్క బలం
  choice: అభిషేకించు
  alternative: అభిషేకిస్తావు; అభిషేకించాలి
  rationale: హీబ్రూ క్రియ ముందున్న ఆజ్ఞాక్రమాన్ని కొనసాగిస్తుంది. ప్రత్యక్ష ఆజ్ఞారూపం ఆ బలాన్ని నిలుపుతుంది; అది ప్రవచనమా విధియా అనే ఉద్రిక్తతను అదనపు వివరణతో పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని అనుసరించాం. ఆజ్ఞల క్రమాన్ని నిలిపి, మూలంలో లేని ‘వచ్చిన దారి’ వంటి వివరణను చేర్చలేదు. పాదటిప్పణి గుర్తులను అవి వివరించే పదబంధాల దగ్గరే ఉంచాం.
