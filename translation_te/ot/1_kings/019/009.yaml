revisions:
- from: అక్కడ అతడు ఆ గుహ దగ్గరికి వచ్చి, అక్కడ రాత్రి గడిపాడు. ఇదిగో, యెహోవా వాక్కు అతనికి వచ్చి, “ఏలీయా, నువ్వు ఇక్కడ ఏం చేస్తున్నావు?”[a] అని అడిగింది.
  to: అతడు అక్కడ ఆ గుహకు వచ్చి, అక్కడ రాత్రి గడిపాడు. ఇదిగో, యాహ్వే వాక్కు అతనికి వచ్చి, “ఏలీయా, నీవు ఇక్కడ ఏమి చేస్తున్నావు?”[a] అని అడిగింది.
  rationale: The revision replaces the proximity expression with ‘గుహకు,’ which reflects movement to the cave without overtranslating it as entry. It renders יהוה as ‘యాహ్వే’ in accordance with the English POB audit trail and retains the prophetic formula, the vivid ‘ఇదిగో,’ and the deliberately broad question. The footnote preserves the viable ‘why are you here?’ alternative and the literal Hebrew idiom.
