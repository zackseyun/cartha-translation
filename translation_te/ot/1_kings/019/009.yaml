  text: וַ/יָּבֹא שָׁ֥ם אֶל הַ/מְּעָרָ֖ה וַ/יָּ֣לֶן שָׁ֑ם וְ/הִנֵּ֤ה דְבַר יְהוָה֙ אֵלָ֔י/ו וַ/יֹּ֣אמֶר ל֔/וֹ מַה לְּ/ךָ֥ פֹ֖ה אֵלִיָּֽהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/009.yaml
  text: There he came to the cave and spent the night there. And behold[a], the word of Yahweh came to him and said to him, “What are you doing here, Elijah?”
translation:
  language: te
  text: అతడు అక్కడ ఆ గుహకు వచ్చి, అక్కడ రాత్రి గడిపాడు. ఇదిగో, యాహ్వే వాక్కు అతనికి వచ్చి, “ఏలీయా, నీవు ఇక్కడ ఏమి చేస్తున్నావు?”[a] అని అడిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “ఏలీయా, నీవు ఇక్కడ ఎందుకు ఉన్నావు?” హెబ్రీయ నుడికారానికి అక్షరార్థం: “ఏలీయా, ఇక్కడ నీకు ఏమి?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא שָׁם אֶל הַמְּעָרָה
  choice: అక్కడ అతడు ఆ గుహ దగ్గరికి వచ్చి
  rationale: בוא + אֶל‌ను సహజమైన తెలుగు గమనవ్యక్తీకరణగా అనువదిస్తూ, אֶל సూచించే గమ్యాన్ని నిలుపుతుంది; క్రియను ‘గుహలోకి ప్రవేశించాడు’ అని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: וַיָּלֶן שָׁם
  choice: అక్కడ రాత్రి గడిపాడు
  rationale: לון/לין యొక్క రాత్రి బసచేయడం అనే కాలార్థాన్ని ఆధునిక, సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: הִנֵּה సూచించే ఆకస్మిక దృష్టి-ఆహ్వానాన్ని, కథన సజీవతను వదలకుండా నిలుపుతుంది.
- source_word: דְבַר יְהוָה
  choice: యెహోవా వాక్కు
  rationale: ప్రవచనాత్మక ప్రకటనకు సంబంధించిన స్థిరమైన హెబ్రీయ వ్యక్తీకరణను, దాని ధార్మిక బరువును నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హెబ్రీయ దైవనామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా అందిస్తుంది; దాని స్థానంలో బిరుదును పెట్టదు.
- source_word: וַיֹּאמֶר לוֹ
  choice: అని అడిగింది
  rationale: హెబ్రీయ ‘అతనితో చెప్పింది’ అన్న నిర్మాణం ఇక్కడ ప్రశ్నను పరిచయం చేస్తుంది. తెలుగులో ‘అడిగింది’ సహజంగా ఉంటుంది; వ్యాకరణ కర్త ‘వాక్కు’తో సరిపోతుంది.
- source_word: מַה לְּךָ פֹה
  choice: నువ్వు ఇక్కడ ఏం చేస్తున్నావు?
  rationale: అక్షరార్థంగా ‘ఇక్కడ నీకు ఏమి?’ అనే హెబ్రీయ నుడికారాన్ని, ఏలీయా ఇక్కడ ఉండటాన్ని ప్రశ్నించే సహజ తెలుగు రూపంలో అందిస్తుంది; కారణాన్ని మాత్రమే నిర్దిష్టం చేయదు.
- source_word: אֵלִיָּהוּ
  choice: ఏలీయా
  rationale: వ్యక్తినామాన్ని ప్రామాణిక తెలుగు బైబిలు రూపంలో లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో చతురక్షర దైవనామమే ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా ఉంచాం; ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: דְבַר יְהוָה అనే ప్రకటన సూత్రం
  choice: యెహోవా వాక్కు
  alternative: యెహోవా సందేశం; యెహోవా నుండి ఒక వాక్కు
  rationale: మూలంలోని స్థిరమైన ప్రవచన సూత్రాన్ని, ‘వాక్కు’ కర్తగా వచ్చి మాట్లాడుతున్న అసాధారణ నిర్మాణంతో సహా నిలుపుతుంది.
- issue: ప్రశ్న מַה לְּךָ פֹה యొక్క ఉద్దేశం
  choice: నువ్వు ఇక్కడ ఏం చేస్తున్నావు?
  alternative: నువ్వు ఇక్కడ ఎందుకు ఉన్నావు?
  rationale: ప్రశ్న ఏలీయా ఉనికిని, పరిస్థితిని లేదా కార్యాన్ని పరిశీలించవచ్చు. ‘ఎందుకు’ అని మాత్రమే అనువదిస్తే దానిని ఉద్దేశం/కారణానికి పరిమితం చేసే ప్రమాదం ఉంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ‘ఇదిగో’ ద్వారా మూలంలోని దృష్టి-ఆహ్వానం నిలుపబడింది. సంభాషణలో ‘నువ్వు’ సందర్భానుకూలమైన ఏకవచన సంబోధన; అది అవమానార్థకం కాదు. పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో ప్రశ్న తరువాత ఉంచబడింది.
