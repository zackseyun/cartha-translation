source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר צֵ֣א וְ/עָמַדְתָּ֣ בָ/הָר֮ לִ/פְנֵ֣י יְהוָה֒ וְ/הִנֵּ֧ה יְהוָ֣ה עֹבֵ֗ר וְ/ר֣וּחַ גְּדוֹלָ֡ה וְ/חָזָ֞ק מְפָרֵק֩ הָרִ֨ים וּ/מְשַׁבֵּ֤ר סְלָעִים֙ לִ/פְנֵ֣י יְהוָ֔ה לֹ֥א בָ/ר֖וּחַ יְהוָ֑ה וְ/אַחַ֤ר הָ/ר֨וּחַ רַ֔עַשׁ לֹ֥א בָ/רַ֖עַשׁ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/011.yaml
  text: And he said[a], “Go out and stand on the mountain before Yahweh.” And behold, Yahweh was passing by, and a great and strong wind was tearing apart the mountains and shattering rocks before Yahweh, but Yahweh was not in the wind. And after the wind, an earthquake[b], but Yahweh was not in the earthquake.
translation:
  language: te
  text: 'అప్పుడు ఆయన ఇలా అన్నాడు: “బయటికి వెళ్లి, పర్వతం మీద యహ్వే సన్నిధిలో నిలబడు.” ఇదిగో, యహ్వే అటుగా వెళ్తున్నాడు. యహ్వే సన్నిధిలో పర్వతాలను చీల్చుతూ, బండలను పగలగొడుతూ గొప్పదీ బలమైనదీ అయిన గాలి వీచింది. అయితే యహ్వే ఆ గాలిలో లేడు[a]. గాలి తర్వాత భూకంపం వచ్చింది; అయితే యహ్వే ఆ భూకంపంలో లేడు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యహ్వే ఆ గాలిలో లేడు’ అని హీబ్రూ మూలం అక్షరార్థంగా చెబుతుంది. ఆయన ఆ గాలిలో తనను బయలుపరచుకోలేదనే భావం ఇందులో ఉండవచ్చు; అనువాదం మాత్రం మూలంలోని మాటనే నిలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘యహ్వే ఆ భూకంపంలో లేడు’ అని హీబ్రూ మూలం చెబుతుంది. ఆ ఘటనపై యహ్వేకు అధికారం లేదని ఈ మాట నిరాకరించడం లేదు; కథనం వ్యక్తం చేసిన భావాన్నే అనువాదం నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’కు దగ్గరైన ఆధునిక తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: צֵא
  choice: బయటికి వెళ్లి
  rationale: ఏలీయా తాను ఉన్న ఆశ్రయం నుంచి బయటికి వెళ్లాలనే ఆజ్ఞను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְעָמַדְתָּ
  choice: నిలబడు
  rationale: עמד అనే క్రియలోని నేరమైన స్థితి భావాన్ని అదనపు ఉద్ఘాటన లేకుండా నిలుపుతుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యహ్వే సన్నిధిలో / యహ్వేకు ముందుగా
  rationale: మొదటి సందర్భంలో వ్యక్తి యహ్వే ఎదుట నిలబడటాన్ని ‘సన్నిధిలో’ అని సహజంగా చెప్పాం; ప్రకృతి ఘటన యహ్వేకు ముందు సాగడాన్ని రెండవ సందర్భంలో ‘ముందుగా’ అని స్థల-క్రమ భావంతో ఇచ్చాం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: కథనంలో అకస్మాత్తుగా దృష్టిని ఆకర్షించే హీబ్రూ సూచకపద బలాన్ని నిలుపుతుంది.
- source_word: עֹבֵר
  choice: అటుగా వెళ్తున్నాడు
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న, సజీవమైన చర్యను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: רוּחַ גְּדוֹלָה וְחָזָק
  choice: గొప్పదైన బలమైన గాలి
  rationale: సందర్భం భౌతిక గాలిని సూచిస్తుంది; రెండు విశేషణాల తీవ్రతను విడివిడిగా నిలిపాం.
- source_word: מְפָרֵק הָרִים
  choice: పర్వతాలను చీల్చుతూ
  rationale: పర్వతాలను బలంగా విడగొట్టే కొనసాగుతున్న చర్యను సంక్షిప్తంగా, దృశ్యమానంగా తెలియజేస్తుంది.
- source_word: וּמְשַׁבֵּר סְלָעִים
  choice: బండలను పగలగొడుతూ
  rationale: సామాన్య పాఠకులకు సులభమైన పదాలతో హింసాత్మకమైన కొనసాగుతున్న చర్యను నిలుపుతుంది.
- source_word: רַעַשׁ
  choice: భూకంపం
  rationale: ఈ ప్రకృతి ఘటనల వరుసలో רעשׁకు సందర్భానుగుణమైన అర్థం ‘భూకంపం’.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’కు దగ్గరగా లిప్యంతరీకరించాం.
- issue: ‘యహ్వే గాలిలో/భూకంపంలో లేడు’ అనే వాక్యాల భావం
  choice: స్థానార్థకమైన ‘లో లేడు’ అనే మాటనే నిలపడం
  alternative: యహ్వే వాటిలో ప్రత్యక్షం కాలేదు / తనను బయలుపరచుకోలేదు
  rationale: హీబ్రూ మూలం కేవలం యహ్వే ఆ ఘటనల్లో ‘లేడు’ అని చెబుతుంది. ఆయన సార్వభౌమత్వం, కార్యం లేదా ప్రత్యక్షత గురించి అదనపు సిద్ధాంత వివరణను వచనంలో చేర్చకుండా దాని ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన కథన శైలిని ఉపయోగించాం. ‘ఇదిగో’ అనే పదంతో మూలంలోని నాటకీయ తక్షణతను, ‘చీల్చుతూ… పగలగొడుతూ’ అనే సమాంతర రూపాలతో చర్యల సజీవత్వాన్ని నిలిపాం.
