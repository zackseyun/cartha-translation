  yaml_path: translation/ot/1_kings/019/003.yaml
  text: And he saw, and arose and went for his life, and came to Beersheba, which belongs to Judah, and left his servant there.
translation:
  language: te
  text: అతడు చూసి, లేచి తన ప్రాణరక్షణ కోసం బయలుదేరాడు. యూదాకు చెందిన బెయేర్షెబాకు వచ్చి, అక్కడ తన సేవకుణ్ణి విడిచిపెట్టాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: అతడు అది చూసి
  rationale: మసొరెటిక్ పాఠంలోని ‘చూశాడు’ అనే క్రియను నిలుపుతూ, తెలుగులో సహజంగా ఉండేందుకు సందర్భసూచకమైన ‘అది’ చేర్చబడింది; కొన్ని ప్రాచీన సాక్ష్యాలలో కనిపించే ‘భయపడ్డాడు’ అనే పాఠాన్ని ప్రధాన పాఠంలో స్వీకరించలేదు.
- source_word: אֶל־נַפְשׁוֹ
  choice: తన ప్రాణం కాపాడుకోవడానికి
  rationale: అక్షరార్థంగా ‘తన ప్రాణం కోసం’; సందర్భంలో ప్రాణరక్షణార్థం పారిపోవడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: యూదాకు చెందిన
  rationale: బెయేర్షెబా యూదా ప్రాంతానికి చెందినదని చెప్పే సంబంధాన్ని సంక్షిప్తంగా, స్పష్టంగా అందిస్తుంది.
- source_word: נַעֲרוֹ
  choice: తన సేవకుణ్ణి
  rationale: ఈ సందర్భంలో נַעַר అనేది వెంట ఉండే పరిచారకుడు లేదా సేవకుడిని సూచిస్తుంది; ‘యువకుడు’ కంటే సందర్భానుకూలం.
theological_decisions:
- issue: וַיַּרְא పాఠభేదం
  choice: ‘అతడు అది చూసి’ అనే మసొరెటిక్ పాఠాన్ని అనుసరించడం
  alternative: కొన్ని ప్రాచీన అనువాదాల ఆధారంగా ‘అతడు భయపడి’
  rationale: ఇచ్చిన WLC మూలపాఠాన్ని ప్రాథమికంగా అనుసరించి, ప్రవక్త భయపడ్డాడని పాఠాన్ని నిశ్శబ్దంగా దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. వరుస వావ్ క్రియలను యాంత్రికంగా ‘మరియు’తో పునరావృతం చేయకుండా తెలుగు వాక్యప్రవాహానికి అనుగుణంగా కలిపాం; అయినా సంఘటనల క్రమాన్ని నిలిపాం.
