source:
  edition: WLC
  text: וַ/יִּשְׁכַּב֙ וַ/יִּישַׁ֔ן תַּ֖חַת רֹ֣תֶם אֶחָ֑ד וְ/הִנֵּֽה זֶ֤ה מַלְאָךְ֙ נֹגֵ֣עַ בּ֔/וֹ וַ/יֹּ֥אמֶר ל֖/וֹ ק֥וּם אֱכֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/005.yaml
  text: Then he lay down and slept under a broom tree. And behold[a], an angel touched him and said to him, “Get up, eat.”
translation:
  language: te
  text: అప్పుడు అతడు ఒక రెతెము పొద కింద పడుకొని నిద్రపోయాడు. ఇదిగో, ఒక దేవదూత[a] అతన్ని తాకి, “లేచి తిను” అని అతనితో అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దూత.’ హీబ్రూ పదం మానవ దూతను గానీ దేవదూతను గానీ సూచించవచ్చు; ఇక్కడి సందర్భం ‘దేవదూత’ అనే అర్థానికి మొగ్గు చూపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב וַיִּישַׁן
  choice: పడుకొని నిద్రపోయాడు
  rationale: రెండు వరుస కథన క్రియలైన ‘పడుకొను’ మరియు ‘నిద్రపోవు’ అనే సరళ భావాలను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: תַּחַת רֹתֶם אֶחָד
  choice: ఒక రేతము చెట్టు కింద
  rationale: רֹתֶם ఎడారి ప్రాంతంలో పెరిగే broom shrub/treeను సూచిస్తుంది. తెలుగు బైబిలు పాఠకులకు గుర్తుపట్టదగిన ‘రేతము చెట్టు’ అనే పేరును ఉపయోగించి, אֶחָד యొక్క అనిర్దిష్ట భావాన్ని ‘ఒక’తో నిలిపాం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: కొత్తదైన, ఆశ్చర్యకరమైన సంఘటనను సజీవంగా పరిచయం చేసే హీబ్రూ కథన సూచిక బలాన్ని ‘ఇదిగో’ సహజంగా నిలుపుతుంది.
- source_word: מַלְאָךְ
  choice: దేవదూత
  rationale: ఈ పదానికి ‘దూత’ లేదా ‘దేవదూత’ అనే అర్థాలు ఉండవచ్చు; తరువాతి సందర్భంలోని అసాధారణ దర్శనం, ఆహార సమకూర్పు కారణంగా ‘దేవదూత’ను ప్రధాన పాఠంలో ఎంచుకున్నాం. ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: נֹגֵעַ בּוֹ
  choice: అతన్ని తాకి
  rationale: స్పర్శను సూచించే participleను తెలుగు కథన ప్రవాహానికి తగిన సమాపక క్రియారూపంలో ఇచ్చాం.
- source_word: וַיֹּאמֶר לוֹ
  choice: అని అతనితో అన్నాడు
  rationale: హీబ్రూలో స్పష్టంగా ఉన్న పరోక్ష కర్మను నిలుపుతూ సహజ తెలుగు ప్రత్యక్ష సంభాషణ నిర్మాణాన్ని వాడాం.
- source_word: קוּם אֱכֹל
  choice: లేచి తిను
  rationale: రెండు సంక్షిప్త ఆజ్ఞారూపాల భావాన్ని స్పష్టమైన, సహజమైన ఆధునిక తెలుగులో అలాగే ఉంచుతుంది.
theological_decisions:
- issue: מַלְאָךְను ‘దేవదూత’గా లేదా ‘దూత’గా అనువదించాలా
  choice: దేవదూత
  alternative: దూత
  rationale: హీబ్రూ పదం రెండింటినీ సూచించగలిగినా, అరణ్యంలో జరిగే అసాధారణ ప్రత్యక్షత మరియు తరువాతి ఆహార సమకూర్పు సందర్భం దేవదూత అనే అర్థానికి మొగ్గు చూపుతుంది. పదంలోని నిజమైన సందిగ్ధతను పాదసూచికలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే కథన గాంభీర్యాన్ని నిలుపుతూ రూపొందించబడింది. ‘ఇదిగో’ ద్వారా మూలంలోని సజీవ కథన మలుపు నిలిచింది; ‘రేతము చెట్టు’ వృక్షనామంగా సంప్రదాయ పరిచయాన్ని కాపాడుతుంది.
