source:
  edition: WLC
  text: וַ/יְהִ֣י כִּ/שְׁמֹ֣עַ אֵלִיָּ֗הוּ וַ/יָּ֤לֶט פָּנָי/ו֙ בְּ/אַדַּרְתּ֔/וֹ וַ/יֵּצֵ֕א וַֽ/יַּעֲמֹ֖ד פֶּ֣תַח הַ/מְּעָרָ֑ה וְ/הִנֵּ֤ה אֵלָי/ו֙ ק֔וֹל וַ/יֹּ֕אמֶר מַה לְּ/ךָ֥ פֹ֖ה אֵלִיָּֽהוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/013.yaml
  text: And when Elijah heard it[a], he wrapped his face in his cloak, and went out and stood at the entrance of the cave. And behold, a voice came to him and said, “What are you doing here[b], Elijah?”
translation:
  language: te
  text: 'ఏలీయా అది విన్నప్పుడు[a], తన పైవస్త్రంతో ముఖాన్ని కప్పుకొని, బయటికి వెళ్లి గుహ ప్రవేశద్వారం దగ్గర నిలబడ్డాడు. అప్పుడు ఇదిగో, ఒక స్వరం అతనితో ఇలా అంది: “నువ్వు ఇక్కడ ఏం చేస్తున్నావు[b], ఏలీయా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అది’ అనే కర్మ హెబ్రీ మూలంలో స్పష్టంగా లేదు. సందర్భం ప్రకారం, ముందు వచనంలో పేర్కొన్న శబ్దం లేదా స్వరాన్ని ఇది సూచిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, “ఇక్కడ నీకేమి పని?” ఈ హెబ్రీ నుడికారం ఏలీయా ఈ స్థలంలో ఉండడానికి గల పని లేదా ఉద్దేశం గురించి అడుగుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  choice: విన్నప్పుడు
  rationale: כְּతో కూడిన క్రియానామ రూపం కాలసంబంధ ఉపవాక్యాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘విన్నప్పుడు’ సహజంగా ఉంది.
- source_word: וַיָּלֶט פָּנָיו בְּאַדַּרְתּוֹ
  choice: తన పైవస్త్రంతో ముఖాన్ని కప్పుకొని
  rationale: క్రియ ముఖాన్ని దగ్గరగా కప్పుకోవడాన్ని సూచిస్తుంది. אַדֶּרֶת ఒక ప్రత్యేకమైన బయటి వస్త్రం; ‘పైవస్త్రం’ ఆధునిక పాఠకునికి స్పష్టంగా ఉండి, ‘ఉత్తరీయం’ వంటి పరిమిత సాంస్కృతిక భావాన్ని రుద్దదు.
- source_word: וַיֵּצֵא וַיַּעֲמֹד
  choice: బయటికి వెళ్లి ... నిలబడ్డాడు
  rationale: సరళమైన వరుస కథన చర్యలను సహజమైన తెలుగు క్రియారూపాలతో వ్యక్తపరుస్తుంది.
- source_word: פֶּתַח הַמְּעָרָה
  choice: గుహ ప్రవేశద్వారం దగ్గర
  rationale: פֶּתַח అంటే తెరువు లేదా ప్రవేశస్థానం. ‘ప్రవేశద్వారం దగ్గర’ అనే రూపం అతడు నిలిచిన స్థానాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וְהִנֵּה
  choice: అప్పుడు ఇదిగో
  rationale: הִנֵּה యొక్క సజీవ దృష్టి-ఆకర్షణ ప్రభావాన్ని ‘ఇదిగో’ నిలుపుతుంది; ‘అప్పుడు’ కథన అనుసంధానాన్ని సహజంగా చేస్తుంది.
- source_word: אֵלָיו קוֹל
  choice: ఒక స్వరం అతనితో ఇలా అంది
  rationale: మూలంలోని క్రియలేని వాక్యం అక్షరార్థంగా ‘అతనికి ఒక స్వరం’ అని ఉంది. తెలుగులో సంబోధిస్తున్న స్వరాన్ని సహజంగా తెలిపేందుకు ఈ రూపం ఉపయోగించబడింది; స్వరం ఎవరిదో అదనంగా నిర్ధారించలేదు.
- source_word: מַה לְּךָ פֹה
  choice: నువ్వు ఇక్కడ ఏం చేస్తున్నావు
  rationale: ఈ హెబ్రీ నుడికారం ఆ స్థలంలో ఏలీయా పని లేదా ఉద్దేశం ఏమిటని ప్రశ్నిస్తుంది. ‘నువ్వు ఇక్కడ ఎందుకు ఉన్నావు?’ అనేది ఉద్దేశానికే పరిమితం చేసే అవకాశం ఉండగా, ఎంచుకున్న రూపం నుడికారపు విస్తృతిని నిలుపుతుంది.
- source_word: אֵלִיָּהוּ
  choice: ఏలీయా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం; ఇక్కడ సంబోధనగా కూడా సహజంగా ఉంటుంది.
theological_decisions:
- issue: ‘విన్నప్పుడు’ తర్వాత మూలంలో స్పష్టంగా లేని కర్మ
  choice: అది విన్నప్పుడు
  alternative: ఆ స్వరం విన్నప్పుడు / ఆ శబ్దం విన్నప్పుడు
  rationale: ఈ వచనంలో హెబ్రీ మూలం కర్మను చెప్పదు; ముందటి సందర్భమే దానిని అందిస్తుంది. ‘అది’ అనే కనిష్ఠ సూచన శబ్దమా స్వరమా అని అనువాదంలోనే నిర్ణయించకుండా కథనంలోని అస్పష్టతను కాపాడుతుంది.
- issue: ఏలీయాను ప్రశ్నించిన స్వరం ఎవరిదో గుర్తించడం
  choice: ఒక స్వరం
  alternative: యెహోవా స్వరం / దేవుని స్వరం
  rationale: ఈ వాక్యంలో קוֹל మాత్రమే ఉంది; స్వరం ఎవరిదో అనువాదంలో చేర్చకుండా మూలంలోని సంక్షిప్తతను, సందర్భానుసారమైన theological tensionను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘ఇదిగో’ ద్వారా మూలంలోని సజీవ ప్రదర్శనను నిలిపి, ‘పైవస్త్రం’ ద్వారా పాతకాలపు లేదా మతపరంగా పరిమితమైన పదజాలాన్ని నివారించాం.
