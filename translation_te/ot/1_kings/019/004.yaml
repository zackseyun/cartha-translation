id: 1KI.19.4
reference: 1 Kings 19:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הֽוּא הָלַ֤ךְ בַּ/מִּדְבָּר֙ דֶּ֣רֶךְ י֔וֹם וַ/יָּבֹ֕א וַ/יֵּ֕שֶׁב תַּ֖חַת רֹ֣תֶם אחת וַ/יִּשְׁאַ֤ל אֶת נַפְשׁ/וֹ֙ לָ/מ֔וּת וַ/יֹּ֣אמֶר רַ֗ב עַתָּ֤ה יְהוָה֙ קַ֣ח נַפְשִׁ֔/י כִּֽי לֹא ט֥וֹב אָנֹכִ֖י מֵ/אֲבֹתָֽ/י־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/004.yaml
  text: But he himself went a day's journey into the wilderness[a], and came and sat down under a broom tree. And he asked that he might die, and said, “It is enough; now, Yahweh, take my life[b], for I am no better than my fathers.”
translation:
  language: te
  text: అయితే అతడు తానే అరణ్యంలోకి ఒక రోజు ప్రయాణమంత దూరం వెళ్లాడు. అక్కడికి వచ్చి ఒక రోతెము పొద కింద కూర్చున్నాడు.[a] తాను చనిపోవాలని కోరాడు. అతడు, “ఇక చాలు! యాహ్వే, ఇప్పుడు నా ప్రాణం తీసుకో; ఎందుకంటే నేను నా పితరులకంటే మెరుగైనవాణ్ణి కాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రోతెము’ అనేది ఎడారి ప్రాంతంలో పెరిగే పొదవంటి మొక్క; దీనిని ‘ఎడారి చీపురు పొద’ అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: అయితే అతడు ఒంటరిగా
  rationale: ప్రత్యక్షంగా ‘అతడైతే/అతడు తానే’ అనే భావం. ముందటి సందర్భంలో సేవకుణ్ణి విడిచిపెట్టి వెళ్లినందున, తెలుగులో సహజంగా ‘అతడు ఒంటరిగా’ అని వ్యక్తీకరించబడింది.
- source_word: בַּמִּדְבָּר דֶּרֶךְ יוֹם
  choice: అరణ్యంలోకి ఒక రోజు ప్రయాణమంత దూరం
  rationale: מִדְבָּר జనావాసం లేని అరణ్య/ఎడారి ప్రాంతాన్ని సూచిస్తుంది; דֶּרֶךְ יוֹם ఒక రోజులో ప్రయాణించే దూరాన్ని సూచించే నుడికారం.
- source_word: רֹתֶם אַחַת
  choice: ఒక రోతెము పొద
  rationale: רֹתֶם ఎడారి ప్రాంతంలో పెరిగే పొదవంటి మొక్క. నిర్దిష్ట వృక్షజాతిని ఊహించి తప్పుదారి పట్టించకుండా పేరును లిప్యంతరీకరించి, దాని రూపాన్ని ‘పొద’తో స్పష్టం చేశాం.
- source_word: וַיִּשְׁאַל אֶת־נַפְשׁוֹ לָמוּת
  choice: తాను చనిపోవాలని కోరుకుంటూ
  rationale: హీబ్రూ నుడికారం తనకు మరణం కలగాలని కోరడాన్ని సూచిస్తుంది; అసహజమైన పదశః అనువాదాన్ని నివారిస్తూ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: רַב עַתָּה
  choice: ఇక చాలు! ... ఇప్పుడు
  rationale: רַב ఇక్కడ ‘చాలు’ అనే తీవ్ర ఉద్గారం; עַתָּהలోని తక్షణత్వాన్ని తరువాతి విజ్ఞాపనలో ‘ఇప్పుడు’గా నిలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: ఇశ్రాయేలు దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో ఇచ్చాం.
- source_word: קַח נַפְשִׁי
  choice: నా ప్రాణం తీసుకో
  rationale: ఈ సందర్భంలో נֶפֶשׁ వ్యక్తి జీవాన్ని సూచిస్తుంది; ‘ఆత్మ’ అని అనువదిస్తే సందర్భంలో లేని మానవ స్వభావశాస్త్ర భావన దిగుమతి కావచ్చు.
- source_word: כִּי לֹא־טוֹב אָנֹכִי מֵאֲבֹתָי
  choice: ఎందుకంటే నేను నా పూర్వీకులకంటే గొప్పవాణ్ణి కాను
  rationale: טוֹב + מִן తులనాత్మకంగా ‘వారికంటే మెరుగైన/గొప్పవాడిని’ అనే భావం. אֲבֹתָי ఇక్కడ పితరులు లేదా పూర్వీకులను సూచించగలదు; సహజమైన సమగ్ర తెలుగు కోసం ‘పూర్వీకులు’ ఎంచుకున్నాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠం దేవుని వ్యక్తిగత నామాన్ని నేరుగా సంబోధిస్తుంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ప్రధాన పాఠంలో ఉంచాం.
- issue: నֶפֶשׁ యొక్క భావం
  choice: ప్రాణం
  alternative: ఆత్మ
  rationale: ఏలీయా మరణాన్ని కోరుతున్న సందర్భంలో ఇది అతని జీవాన్ని సూచిస్తుంది. ‘ఆత్మ’ అనే ఎంపిక మూలంలో నిర్ణయించని శరీర–ఆత్మ విభజనను సూచించే అవకాశం ఉంది.
- issue: ఏలీయా విజ్ఞాపన స్వరూపం
  choice: తాను చనిపోవాలని కోరుకున్నాడు
  alternative: తనను తాను చంపుకోవాలని కోరుకున్నాడు
  rationale: పాఠం మరణాన్ని కోరినట్లు చెబుతుంది, కాని స్వీయహత్య చర్యను పేర్కొనదు. అందువల్ల మూలంలోని ఉద్రిక్తతను మించి నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. ఏలీయా నిరాశలోని తీవ్రతను ‘ఇక చాలు!’ ద్వారా నిలిపి, మూలంలో లేని మానసిక లేదా సిద్ధాంతపరమైన వివరణను చేర్చలేదు. ప్రధాన పాఠంలోని [a] సూచిక పాదటిప్పణితో సరిపోలుతుంది.
