id: 1KI.19.8
reference: 1 Kings 19:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֖קָם וַ/יֹּ֣אכַל וַ/יִּשְׁתֶּ֑ה וַ/יֵּ֜לֶךְ בְּ/כֹ֣חַ הָ/אֲכִילָ֣ה הַ/הִ֗יא אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה עַ֛ד הַ֥ר הָ/אֱלֹהִ֖ים חֹרֵֽב׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/008.yaml
  text: So he arose and ate and drank[a], and went in the strength of that food forty days and forty nights to Horeb, the mountain of God.
translation:
  language: te
  text: అప్పుడు అతడు లేచి, తిని, తాగి, ఆ ఆహారం ఇచ్చిన బలంతో[a] నలభై రోజులు, నలభై రాత్రులు దేవుని పర్వతమైన హోరేబు వరకు వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ భోజనం బలంతో.” హీబ్రూ వ్యక్తీకరణ అతడు తిన్న ఆహారం ద్వారా పొందిన పోషణను, బలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: అప్పుడు అతడు లేచి
  rationale: קום అనే క్రియ కథన క్రమంలో ‘లేచాడు’ అనే అర్థాన్ని ఇస్తుంది; వావ్-క్రమాన్ని సహజమైన తెలుగు కథన శైలిలో ‘అప్పుడు’తో వ్యక్తం చేశాం.
- source_word: וַיֹּאכַל וַיִּשְׁתֶּה
  choice: తిని, తాగాడు
  rationale: రెండు సాధారణ కథన క్రియల క్రమాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా నిలిపింది.
- source_word: וַיֵּלֶךְ
  choice: ప్రయాణించి ... వెళ్లాడు
  rationale: הלך ఇక్కడ గమ్యస్థానంవైపు సాగడాన్ని సూచిస్తుంది; దీర్ఘకాల ప్రయాణ సందర్భాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּכֹחַ הָאֲכִילָה הַהִיא
  choice: ఆ ఆహారం ఇచ్చిన బలంతో
  rationale: כֹחַ లోని ‘బలం’ భావాన్నీ, אֲכִילָה సూచించే తిన్న ఆహారం వల్ల కలిగిన పోషణనూ సహజంగా వ్యక్తం చేస్తుంది; ‘ఆ తినడం యొక్క బలంలో’ అనే అసహజ పదానువాదాన్ని నివారిస్తుంది.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: నలభై రోజులు, నలభై రాత్రులు
  rationale: హీబ్రూ కాలవ్యవధి వ్యక్తీకరణను స్పష్టంగా, సంప్రదాయబద్ధంగా అందిస్తుంది.
- source_word: עַד
  choice: వరకు
  rationale: ఇక్కడ ప్రయాణపు అంతిమ గమ్యాన్ని సూచించే హీబ్రూ పదానికి ‘వరకు’ సమీపమైన, సహజమైన తెలుగు సమానం.
- source_word: הַר הָאֱלֹהִים
  choice: దేవుని పర్వతమైన
  rationale: ‘దేవుని పర్వతం’ అనే సంబంధాన్ని నిలుపుతూ, హోరేబుతో దాని సమానాధికరణ సంబంధాన్ని తెలుగులో సహజంగా చూపిస్తుంది.
- source_word: חֹרֵב
  choice: హోరేబు
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగులో సాధారణంగా గుర్తించదగిన రూపంలో లిప్యంతరీకరించింది.
theological_decisions:
- issue: הָאֱלֹהִים అనే పదాన్ని הַר הָאֱלֹהִים పదబంధంలో అనువదించడం
  choice: దేవుని
  alternative: దైవికమైన
  rationale: ఇది హోరేబుకు సంబంధించిన స్థిరమైన బైబిలు వర్ణన; ఇక్కడ వ్యక్తిగతంగా ఇశ్రాయేలు దేవునినే సూచించడం సందర్భానికి తగినది. ‘దైవికమైన’ అని అనువదించడం సంబంధాన్ని గుణవాచకంగా మార్చే ప్రమాదం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. మూలంలోని వరుస క్రియలు, కాలవ్యవధి, గమ్యస్థానం స్పష్టంగా నిలుపబడ్డాయి.
