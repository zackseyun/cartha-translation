id: 1KI.19.20
reference: 1 Kings 19:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעֲזֹ֣ב אֶת הַ/בָּקָ֗ר וַ/יָּ֨רָץ֙ אַחֲרֵ֣י אֵֽלִיָּ֔הוּ וַ/יֹּ֗אמֶר אֶשְּׁקָה נָּא֙ לְ/אָבִ֣/י וּ/לְ/אִמִּ֔/י וְ/אֵלְכָ֖ה אַחֲרֶ֑י/ךָ וַ/יֹּ֤אמֶר ל/וֹ֙ לֵ֣ךְ שׁ֔וּב כִּ֥י מֶה עָשִׂ֖יתִי לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/020.yaml
  text: So he left the oxen and ran after Elijah and said[a], “Please let me kiss my father and my mother, and then I will go after you.” And he said to him, “Go back[b], for what have I done to you?”
translation:
  language: te
  text: అప్పుడు అతడు ఎద్దులను విడిచిపెట్టి ఏలీయా వెనుక పరుగెత్తి, “దయచేసి నా తండ్రిని, నా తల్లిని ముద్దుపెట్టుకోనివ్వండి[a]. ఆ తర్వాత నేను మీ వెంట వస్తాను” అన్నాడు. ఏలీయా అతనితో, “వెళ్లి తిరిగి రా[b]. నేను నీకేమి చేశాను?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నా తండ్రిని, నా తల్లిని ముద్దుపెట్టుకోనివ్వండి.” ఇక్కడ ఇది వీడ్కోలు సందర్భంలో చేసే చర్యను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఏలీయా జవాబు అర్థం నిర్ధిష్టంగా లేదు. దీనిని “వెనక్కి వెళ్లు, నేను నీకు ఏమి చేశాను?” అని, లేదా “వెనక్కి వెళ్లు; నేను నీ కోసం ఏమి చేశాను?” అని అర్థం చేసుకోవచ్చు. ఇది నిర్ణయాన్ని ఎలీషాకే వదిలే సంక్షిప్తమైన మాటగా కూడా భావించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: విడిచిపెట్టి
  rationale: עזב ఇక్కడ ఎద్దుల దగ్గర నుంచి వెళ్లిపోవడాన్ని సూచిస్తుంది; శాశ్వతంగా త్యజించాడనే భావాన్ని అతిగా మోపకుండా సహజమైన తెలుగు ప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: הַבָּקָר
  choice: ఎద్దులను
  rationale: ముందరి సందర్భంలో నాగలి దున్నే జతల ప్రస్తావన ఉన్నందున בקר అనే విస్తృత పదానికి ఇక్కడ పనికొచ్చే ఎద్దులు అన్న భావమే సందర్భోచితం.
- source_word: וַיָּרָץ אַחֲרֵי
  choice: వెనుక పరుగెత్తి వచ్చి
  rationale: ఈ పదబంధం ఏలీయాను వెంబడిస్తూ పరుగెత్తడాన్ని నేరుగా తెలియజేస్తుంది; తెలుగులో సహజంగా ఉండేందుకు ‘వచ్చి’ చేర్చబడింది.
- source_word: אֶשְּׁקָה נָּא
  choice: దయచేసి ... ముద్దుపెట్టుకొని వీడ్కోలు చెప్పనివ్వండి
  rationale: נשק యొక్క ప్రత్యక్ష అర్థమైన ‘ముద్దుపెట్టు’ను నిలుపుతూ, సందర్భంలోని వీడ్కోలు ఉద్దేశాన్ని సహజమైన తెలుగులో స్పష్టం చేశాం; נָא మర్యాదపూర్వక అభ్యర్థనగా ‘దయచేసి’తో వ్యక్తమైంది.
- source_word: לְאָבִי וּלְאִמִּי
  choice: నా తండ్రిని, నా తల్లిని
  rationale: మూలంలో తల్లిదండ్రులు విడివిడిగా పేర్కొనబడినందున ‘నా తల్లిదండ్రులు’ అని సంక్షిప్తం చేయకుండా ఆ నిర్మాణాన్ని నిలిపాం.
- source_word: וְאֵלְכָה אַחֲרֶיךָ
  choice: ఆ తర్వాత నేను మీ వెంట వస్తాను
  rationale: הלך אחרי ఇక్కడ భౌతికంగా వెంట వెళ్లడాన్నీ, ఏలీయాను అనుసరించడాన్నీ సూచించగలదు. తెలుగు గౌరవ సంబోధనతో సహజంగా అనువదించాం.
- source_word: לֵךְ שׁוּב
  choice: వెళ్లి తిరిగి రా
  rationale: రెండు ఆజ్ఞారూపాలనూ నిలుపుతూ మూలంలోని సంక్షిప్తతను, అస్పష్టతను కాపాడాం. తెలుగులో ఈ పదబంధం సహజంగానే ఉన్నా దాని ఉద్దేశం వివిధ రీతుల్లో అర్థమవవచ్చు.
- source_word: כִּי מֶה עָשִׂיתִי לָךְ
  choice: నేను నీకు ఏమి చేశాను?
  rationale: లְךָ సందర్భానుసారం ‘నీకు’ లేదా ప్రతికూల ఛాయలో ‘నీ పట్ల’ అని అర్థమవవచ్చు. వ్యాఖ్యానంతో భావాన్ని నిర్ణయించకుండా ప్రత్యక్ష ప్రశ్నను నిలిపాం.
theological_decisions:
- issue: ఏలీయా జవాబు כִּי מֶה עָשִׂיתִי לָךְ యొక్క భావం
  choice: ‘నేను నీకు ఏమి చేశాను?’ అనే ప్రత్యక్ష ప్రశ్నను ప్రధాన పాఠ్యంలో నిలిపాం.
  alternative: ‘నేను నీ కోసం ఏమి చేశాను?’ లేదా ‘నిన్ను ఆపేలా నేను నీకు ఏమి చేశాను?’ లేదా తాను చేసిన కార్యాన్ని ఆలోచించమనే సూచన.
  rationale: ఈ మాటలు అనుమతి, మందలింపు, బాధ్యతను ఎలీషా నిర్ణయానికే వదలడం, లేదా ఏలీయా చేసిన సంకేతాత్మక కార్యాన్ని జ్ఞాపకం చేయడం వంటి భిన్న భావాల్లో అర్థమయ్యాయి. ప్రధాన పాఠ్యం ఏ ఒక్క వ్యాఖ్యానాన్నీ నిర్బంధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, కథనానికి తగిన శైలిని వాడాం. ఎలీషా ఏలీయాతో మాట్లాడేటప్పుడు ‘మీరు’ రూపాన్ని, ఏలీయా ఎలీషాతో మాట్లాడేటప్పుడు సహజమైన పెద్దవారి ఏకవచన ‘నీకు/రా’ రూపాన్ని ఉపయోగించాం. ప్రధాన పాఠ్యంలో మూలంలోని అస్పష్టతను నిలిపి, అవసరమైన వివరణను పాదటిప్పణులకు పరిమితం చేశాం.
