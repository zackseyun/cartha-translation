- from: అప్పుడు అతడు ఎద్దులను విడిచిపెట్టి, ఏలీయా వెనుక పరుగెత్తి వచ్చి, “దయచేసి నా తండ్రిని, నా తల్లిని ముద్దుపెట్టుకొని వీడ్కోలు చెప్పనివ్వండి[a]. ఆ తర్వాత నేను మీ వెంట వస్తాను” అన్నాడు. ఏలీయా అతనితో, “వెళ్లి తిరిగి రా[b]. నేను నీకు ఏమి చేశాను?” అన్నాడు.
  to: అప్పుడు అతడు ఎద్దులను విడిచిపెట్టి ఏలీయా వెనుక పరుగెత్తి, “దయచేసి నా తండ్రిని, నా తల్లిని ముద్దుపెట్టుకోనివ్వండి[a]. ఆ తర్వాత నేను మీ వెంట వస్తాను” అన్నాడు. ఏలీయా అతనితో, “వెళ్లి తిరిగి రా[b]. నేను నీకేమి చేశాను?” అన్నాడు.
  rationale: మూలంలోని ముద్దుపెట్టుకునే నేర చర్యను ప్రధాన పాఠ్యంలో పునరుద్ధరించి, దాని వీడ్కోలు-సందర్భ భావాన్ని పాదటిప్పణికి పరిమితం చేశాం. అలాగే ‘పరుగెత్తి వచ్చి’లోని అవసరం లేని ‘వచ్చి’ని తొలగించాం. ఏలీయా చివరి మాటలోని వ్యాకరణాత్మక, భావార్థ అస్పష్టతను ప్రధాన పాఠ్యమూ పాదటిప్పణీ కాపాడుతున్నాయి.
