id: 1KI.19.7
reference: 1 Kings 19:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּשָׁב֩ מַלְאַ֨ךְ יְהוָ֤ה שֵׁנִית֙ וַ/יִּגַּע בּ֔/וֹ וַ/יֹּ֖אמֶר ק֣וּם אֱכֹ֑ל כִּ֛י רַ֥ב מִמְּ/ךָ֖ הַ/דָּֽרֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/007.yaml
  text: Then the angel of Yahweh returned a second time and touched him and said[a], “Get up and eat, because the journey is too much for you.”
translation:
  language: te
  text: అప్పుడు యాహ్వే దూత రెండోసారి తిరిగి వచ్చి అతన్ని తాకి, “లేచి తిను; ఎందుకంటే ఈ ప్రయాణం నీ శక్తికి మించినది” అని చెప్పాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే దేవదూత.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: తిరిగి వచ్చి
  rationale: కథన సందర్భంలో שוב అనే క్రియ మళ్లీ రావడాన్ని సూచిస్తుంది; ‘తిరిగి వచ్చి’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: מַלְאַךְ יְהוָה
  choice: యాహ్వే దూత
  rationale: מַלְאָךְ అంటే ‘దూత’ లేదా సందర్భానుసారం ‘దేవదూత’; మూలంలోని విస్తృత అర్థాన్ని ‘దూత’ కాపాడుతుంది. יְהוָה అనే దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: שֵׁנִית
  choice: రెండోసారి
  rationale: కేవలం ‘మళ్లీ’ అని కాకుండా, మూలంలో ఉన్న నిర్దిష్టమైన రెండవ సందర్భాన్ని తెలియజేస్తుంది.
- source_word: וַיִּגַּע בּוֹ
  choice: అతన్ని తాకి
  rationale: נגע + בוֹ యొక్క ప్రత్యక్ష, సహజమైన తెలుగు అనువాదం; ‘మళ్లీ’ అనే భావం ఇప్పటికే ‘రెండోసారి’లో ఉంది.
- source_word: קוּם אֱכֹל
  choice: లేచి తిను
  rationale: రెండు ఆజ్ఞారూపాల బలాన్ని సంక్షిప్తంగా, సహజ ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ఆజ్ఞకు కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: רַב מִמְּךָ הַדָּרֶךְ
  choice: ఈ ప్రయాణం నీ శక్తికి మించినది
  rationale: హెబ్రీయులో ప్రయాణం అతని సామర్థ్యానికి మించినదనే భావం ఉంది. కేవలం దూరాన్ని సూచించే ‘చాలా పొడవైనది’ అని పరిమితం చేయకుండా సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా అందించాం.
- issue: מַלְאָךְ యొక్క అర్థపరిధి
  choice: దూత
  alternative: దేవదూత
  rationale: హెబ్రీ పదానికి సాధారణంగా ‘దూత’ అనే అర్థమూ, దైవిక ప్రతినిధి సందర్భంలో ‘దేవదూత’ అనే అర్థమూ ఉన్నాయి. ప్రధాన పాఠంలో మూలంలోని పదార్థ విస్తృతిని కాపాడి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథన శైలి సరళంగా, గౌరవప్రదంగా ఉంది. మూలంలోని ఆజ్ఞల ప్రత్యక్షతను నిలిపి, ‘ప్రయాణం నీ శక్తికి మించినది’ ద్వారా సామర్థ్యాన్ని మించే భావాన్ని సహజంగా తెలిపాం.
