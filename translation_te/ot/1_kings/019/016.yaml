revisions:
- from: నింషీ కుమారుడైన యెహూను ఇశ్రాయేలుమీద రాజుగా అభిషేకించు. ఆబేలు-మెహోలాకు చెందిన షాఫాతు కుమారుడైన ఎలీషాను నీ స్థానంలో[a] ప్రవక్తగా అభిషేకించు.
  to: నిమ్షీ కుమారుడైన యెహూను ఇశ్రాయేలు మీద రాజుగా అభిషేకించు; ఆబేలు-మెహోలా నుండి వచ్చిన షాపాతు కుమారుడైన ఎలీషాను నీ స్థానంలో[a] ప్రవక్తగా అభిషేకించు.
  rationale: The revision corrects the two source-name transliterations and renders the origin phrase more directly, while retaining the Hebrew’s paired commands, commissioning language, and the deliberately unresolved succession/replacement nuance in תחתיך.
