  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵת֙ יֵה֣וּא בֶן נִמְשִׁ֔י תִּמְשַׁ֥ח לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וְ/אֶת אֱלִישָׁ֤ע בֶּן שָׁפָט֙ מֵ/אָבֵ֣ל מְחוֹלָ֔ה תִּמְשַׁ֥ח לְ/נָבִ֖יא תַּחְתֶּֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/016.yaml
  text: And you shall anoint Jehu son of Nimshi as king over Israel[a], and Elisha son of Shaphat from Abel-meholah you shall anoint as prophet in your place.
translation:
  language: te
  text: నిమ్షీ కుమారుడైన యెహూను ఇశ్రాయేలు మీద రాజుగా అభిషేకించు; ఆబేలు-మెహోలా నుండి వచ్చిన షాపాతు కుమారుడైన ఎలీషాను నీ స్థానంలో[a] ప్రవక్తగా అభిషేకించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ తరువాత’; లేదా, ‘నీకు బదులుగా.’ హెబ్రీ పదం వారసత్వాన్నీ స్థానభర్తీనీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשַׁח
  choice: అభిషేకించు
  rationale: ఇది משׁח అనే క్రియ యొక్క Qal imperfect 2ms రూపం. ఈ ఆజ్ఞాపక సందర్భంలో భవిష్యదర్థం కంటే నిర్దేశాన్ని వ్యక్తం చేస్తుంది; అందువల్ల సహజమైన తెలుగు ఆజ్ఞారూపం వాడబడింది.
- source_word: לְמֶלֶךְ
  choice: రాజుగా
  rationale: లామెద్ ఇక్కడ పదవి లేదా హోదాకు నియామకాన్ని సూచిస్తుంది; తెలుగులో ‘రాజుగా’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుమీద
  rationale: עַל రాజాధికారాన్ని, ఒక ప్రజలమీద పరిపాలనను సూచిస్తుంది; ‘ఇశ్రాయేలుమీద’ ఆ అధికార సంబంధాన్ని నిలుపుతుంది.
- source_word: מֵאָבֵל מְחוֹלָה
  choice: ఆబేలు-మెహోలాకు చెందిన
  rationale: మిన్ ఉపసర్గ మూలస్థలాన్ని సూచిస్తుంది. ‘చెందిన’ అనేది ఎలీషా స్వస్థల సంబంధాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: לְנָבִיא
  choice: ప్రవక్తగా
  rationale: లామెద్ ఇక్కడ ప్రవక్త పదవికి నియామకాన్ని సూచిస్తుంది; ‘ప్రవక్తగా’ తెలుగు వాక్య నిర్మాణంలో సహజమైన ఎంపిక.
- source_word: תַּחְתֶּיךָ
  choice: నీ స్థానంలో
  rationale: תחת పదం స్థానభర్తీ లేదా వారసత్వ భావాన్ని వ్యక్తం చేయగలదు. ‘నీ స్థానంలో’ రెండింటి మధ్యనున్న భావ విస్తృతిని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: וְאֵת ... וְאֶת
  choice: రెండు సమన్విత ఆజ్ఞలుగా విభజింపు
  rationale: אֵת ప్రత్యక్ష కర్మ సూచికను తెలుగులో విడిగా అనువదించాల్సిన అవసరం లేదు. రెండు నియామకాలు స్పష్టంగా వినిపించేందుకు వాటిని వరుస వాక్యాలుగా ఇచ్చాం.
- source_word: בֶן
  choice: కుమారుడైన
  rationale: వ్యక్తిని తండ్రి పేరుతో గుర్తించే హెబ్రీ నిర్మాణాన్ని తెలుగులో సహజమైన ‘కుమారుడైన’ రూపంతో నిలిపాం.
theological_decisions:
- issue: תַּחְתֶּיךָలో ఎలీషాకు ఏలీయాతో ఉన్న సంబంధం
  choice: ‘నీ స్థానంలో’—ప్రవక్తగా ఏలీయా స్థానాన్ని స్వీకరించే భావం
  alternative: ‘నీ తరువాత’ లేదా ‘నీకు బదులుగా’
  rationale: హెబ్రీ పదం కాలక్రమ వారసత్వాన్నీ స్థానభర్తీనీ సూచించగలదు. ‘నీ స్థానంలో’ అనే రూపం ఆకస్మిక తొలగింపు భావాన్ని బలవంతంగా చేర్చకుండా పదవీ వారసత్వాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ఆజ్ఞారూపం వాడబడింది. వ్యక్తి, స్థలనామాలు సాధారణ తెలుగు బైబిలు లిప్యంతరీకరణకు సమీపంగా ఉంచబడ్డాయి; అస్పష్టత ఉన్న పదం వద్ద పాదసూచికను నేరుగా చేర్చాం.
