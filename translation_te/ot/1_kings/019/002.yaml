id: 1KI.19.2
reference: 1 Kings 19:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּשְׁלַ֤ח אִיזֶ֨בֶל֙ מַלְאָ֔ךְ אֶל אֵלִיָּ֖הוּ לֵ/אמֹ֑ר כֹּֽה יַעֲשׂ֤וּ/ן אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִפ֔וּ/ן כִּֽי כָ/עֵ֤ת מָחָר֙ אָשִׂ֣ים אֶֽת נַפְשְׁ/ךָ֔ כְּ/נֶ֖פֶשׁ אַחַ֥ד מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/002.yaml
  text: Then Jezebel sent a messenger to Elijah[a], saying, “So may the gods do, and more also, if by this time tomorrow I do not make your life like the life of one of them.”
translation:
  language: te
  text: 'అప్పుడు యెజెబెలు ఏలీయా దగ్గరకు ఒక సందేశకుణ్ణి పంపి ఇలా చెప్పింది: “దేవతలు నాకు అలాగే చేసి, అంతకంటే ఎక్కువ చేయుగాక! రేపు ఇదే సమయానికి నేను నీ ప్రాణాన్ని వారిలో ఒకరి ప్రాణంలా చేయకపోతే!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁלַח
  choice: అప్పుడు ... పంపి
  rationale: వయ్యిక్తోల్ కథనాన్ని తదుపరి చర్యకు తీసుకెళ్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מַלְאָךְ
  choice: సందేశకుణ్ణి
  rationale: ఇక్కడ రాజసభకు సంబంధించిన మానవ దూత ఉద్దేశించబడ్డాడు; ‘దేవదూత’ అనే అతీంద్రియ భావాన్ని నివారించేందుకు ఈ పదం వాడబడింది.
- source_word: לֵאמֹר
  choice: ఇలా చెప్పింది
  rationale: ప్రత్యక్ష వాక్యాన్ని సహజమైన తెలుగులో పరిచయం చేస్తుంది.
- source_word: כֹּה יַעֲשׂוּן אֱלֹהִים וְכֹה יוֹסִפוּן
  choice: దేవతలు నాకు అలాగే చేసి, అంతకంటే ఎక్కువే చేయుగాక
  rationale: ఇది శిక్షను తనమీదికి ఆహ్వానించే ప్రమాణ సూత్రం. ‘నాకు’ మూలపాఠంలో ప్రత్యక్షంగా లేకపోయినా ప్రమాణంలోని అంతర్భావిత కర్మను తెలుగులో స్పష్టం చేస్తుంది; ‘అంతకంటే ఎక్కువే’ రెండో క్రియ యొక్క తీవ్రతను అందిస్తుంది.
- source_word: אֱלֹהִים
  choice: దేవతలు
  rationale: యెజెబెలు నేపథ్యంతో పాటు יַעֲשׂוּן, יוֹסִפוּן అనే బహువచన క్రియారూపాలు ఇక్కడ బహువచన భావానికి బలమైన ఆధారం ఇస్తాయి.
- source_word: כִּי
  choice: చేయకపోతే
  rationale: ప్రమాణ వాక్యంలో ఇది శాపానికి సంబంధించిన షరతును పరిచయం చేస్తుంది; తెలుగులో నిషేధ షరతుతో సహజంగా వ్యక్తమవుతుంది.
- source_word: כָעֵת מָחָר
  choice: రేపు ఇదే సమయానికి
  rationale: మరుసటి రోజున దీనికి సరిపోలే సమయాన్ని సూచించే సహజమైన, ఖచ్చితమైన తెలుగు ప్రయోగం.
- source_word: אָשִׂים אֶת־נַפְשְׁךָ
  choice: నీ ప్రాణాన్ని ... నేను చేయకపోతే
  rationale: నేరుగా ‘నిన్ను చంపకపోతే’ అని విప్పి చెప్పకుండా, మూలంలోని נֶפֶשׁ మరియు שׂים నిర్మాణాన్నీ దాని ఉద్దేశపూర్వక బెదిరింపు భాషనూ నిలుపుతుంది.
- source_word: כְּנֶפֶשׁ אַחַד מֵהֶם
  choice: వారిలో ఒకరి ప్రాణంలా
  rationale: నֶפֶשׁ పునరుక్తిని నిలిపి, ఏలీయా చంపిన వారిలో ఒకరి గతి అతనికీ కలిగిస్తాననే బెదిరింపును ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: యెజెబెలు ప్రమాణంలోని אֱלֹהִים ఏకవచనమా, బహువచనమా
  choice: బహువచనం—‘దేవతలు’
  alternative: ఏకవచనం—‘దేవుడు’
  rationale: వక్త యెజెబెలు కావడం, ఆమె ఆరాధనా నేపథ్యం, అలాగే దానికి అనుసంధానమైన బహువచన క్రియలు కలిసి బహువచన పఠనానికి మద్దతిస్తాయి. అయినా אֱלֹהִים రూపం కొన్ని సందర్భాల్లో ఇశ్రాయేలు దేవుణ్ణి ఏకవచనంగా సూచించగలదు కాబట్టి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: ప్రమాణంలో శిక్షను పొందేది ఎవరు
  choice: ‘నాకు’ అని అంతర్భావిత కర్మను స్పష్టం చేయడం
  alternative: కర్మను చెప్పకుండా ‘దేవతలు అలాగే చేసి...’ అని ఉంచడం
  rationale: హీబ్రూ ప్రమాణ సూత్రంలో కర్మ ప్రత్యక్షంగా లేకపోయినా, శాపం పలికే వ్యక్తిమీదికే వస్తుందనే భావం అంతర్భావితంగా ఉంది. తెలుగులో కర్మ లేకుండా వాక్యం అసంపూర్ణంగా లేదా అస్పష్టంగా వినిపించేందున ‘నాకు’ చేర్చబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథన శైలి వాడబడింది. ‘సందేశకుడు’ మానవ దూతను స్పష్టం చేస్తుంది. బెదిరింపును నేరుగా ‘చంపుతాను’ అని విప్పకుండా మూలంలోని ‘ప్రాణాన్ని ... ప్రాణంలా చేయడం’ అనే రూపక నిర్మాణం నిలుపబడింది.
