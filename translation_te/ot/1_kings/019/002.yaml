- from: 'అప్పుడు యెజెబెలు ఏలీయా దగ్గరకు ఒక సందేశకుణ్ణి పంపి ఇలా చెప్పింది: “రేపు ఇదే సమయానికి నీ ప్రాణాన్ని వారిలో ఒకరి ప్రాణంలా నేను చేయకపోతే, దేవతలు[a] నాకు అలాగే చేసి, అంతకంటే ఎక్కువే చేయుగాక!”'
