review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the narrative sequence, Jezebel's human messenger, the oath formula, the plural reading of אֱלֹהִים, the corresponding time on the following day, and the repeated נֶפֶשׁ ('life'). Supplying 'నాకు' ('to me') is justified as an idiomatic implication of this self-imprecatory oath, though it is not explicit in the Hebrew.
  naturalness: The translation is generally modern and clear. However, 'నీ ప్రాణాన్ని వారిలో ఒకరి ప్రాణంలా నేను చేయకపోతే' is slightly heavy in Telugu because the explicit subject 'నేను' falls between the compared object and its verb. Moving it before the object produces a smoother, still close rendering.
  terminology: ‘యెజెబెలు,’ ‘ఏలీయా,’ ‘సందేశకుడు,’ ‘ప్రాణం,’ and ‘దేవతలు’ are suitable. ‘దేవతలు’ appropriately reflects the plural verbal forms in the oath, while the footnote responsibly records the possible singular reading without forcing it.
  issues:
  - severity: low
    issue: Awkward placement of the explicit first-person subject in the conditional threat
    rationale: In ‘నీ ప్రాణాన్ని వారిలో ఒకరి ప్రాణంలా నేను చేయకపోతే,’ ‘నేను’ interrupts a tightly connected Telugu comparison and verb phrase. ‘నేను నీ ప్రాణాన్ని ... చేయకపోతే’ is more idiomatic and retains all source components.
  revised_text: 'అప్పుడు యెజెబెలు ఏలీయా దగ్గరకు ఒక సందేశకుణ్ణి పంపి ఇలా చెప్పింది: “దేవతలు నాకు అలాగే చేసి, అంతకంటే ఎక్కువ చేయుగాక! రేపు ఇదే సమయానికి నేను నీ ప్రాణాన్ని వారిలో ఒకరి ప్రాణంలా చేయకపోతే!”'
