base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/017.yaml
  text: And it shall be that whoever escapes from the sword of Hazael[a], Jehu shall put to death; and whoever escapes from the sword of Jehu, Elisha shall put to death.
translation:
  language: te
  text: 'అప్పుడు ఇలా జరుగుతుంది: హజాయేలు ఖడ్గం నుండి తప్పించుకునేవాణ్ణి యెహూ చంపుతాడు; యెహూ ఖడ్గం నుండి తప్పించుకునేవాణ్ణి ఎలీషా చంపుతాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ క్రియకు ‘మరణానికి గురిచేస్తాడు’ అనే కార్యకారక భావం ఉంది. సందర్భంలో ఎలీషా పాత్రను ప్రత్యక్ష చర్యగా గానీ, అతని ప్రవచన పరిచర్య ద్వారా అమలైన తీర్పుగా గానీ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: అప్పుడు ఇలా జరుగుతుంది
  rationale: ఈ సూత్రప్రాయ భవిష్యత్ కథన వ్యక్తీకరణ తరువాత సంభవించబోయేదాన్ని పరిచయం చేస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా, అదే సమయంలో ప్రకటిత ఫలిత భావాన్ని నిలుపుకునేలా అనువదించబడింది.
- source_word: הַנִּמְלָט / וְהַנִּמְלָט
  choice: తప్పించుకునేవాణ్ణి
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న కృదంతం సాధారణ వ్యక్తిని సూచిస్తుంది. సందర్భంలో కర్మగా ఉన్నందున ‘తప్పించుకునేవాణ్ణి’ సహజమైన తెలుగు రూపం.
- source_word: מֵחֶרֶב
  choice: ఖడ్గం నుండి
  rationale: חֶרֶב అనే పదానికి ఉన్న ఆయుధం మరియు ప్రాణాంతక తీర్పు అనే భావాలను నిలుపుకోవడానికి ‘ఖడ్గం’ అనే ప్రత్యక్ష పదాన్ని ఉంచాం.
- source_word: חֲזָאֵל
  choice: హజాయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: יָמִית
  choice: చంపుతాడు
  rationale: מות ధాతువు హిఫీల్ రూపం ప్రాణం తీయడం లేదా మరణానికి గురిచేయడం అనే కార్యకారక భావాన్ని వ్యక్తం చేస్తుంది. ‘చంపిస్తాడు’ అంటే తప్పనిసరిగా మరొకరి చేత చేయించడం అనే అదనపు భావం రావచ్చు; అందువల్ల ప్రత్యక్షమైన, సహజమైన ‘చంపుతాడు’ ఎంచుకున్నాం.
- source_word: יֵהוּא
  choice: యెహూ
  rationale: వ్యక్తినామాన్ని ప్రామాణిక తెలుగు రూపంలో ఇచ్చాం.
- source_word: אֱלִישָׁע
  choice: ఎలీషా
  rationale: వ్యక్తినామాన్ని ప్రామాణిక తెలుగు రూపంలో ఇచ్చాం.
theological_decisions:
- issue: ఎలీషా ‘చంపుతాడు’ అనే వాక్యంలో అతని పాత్ర
  choice: హీబ్రూ వాక్య నిర్మాణానికి అనుగుణంగా ఎలీషాను నేరుగా చర్యకు కర్తగా ప్రధాన పాఠ్యంలో ఉంచాం.
  alternative: ఎలీషా ప్రవచన పరిచర్య ద్వారా అమలయ్యే తీర్పుగా, లేదా అతనితో సంబంధం ఉన్న తీర్పుగా అర్థం చేసుకోవడం.
  rationale: హజాయేలు, యెహూ, ఎలీషా ముగ్గురినీ సమాంతరంగా ప్రాణాంతక తీర్పు కర్తలుగా హీబ్రూ వాక్యం పేర్కొంటుంది. ఎలీషా పాత్రను ప్రధాన పాఠ్యంలో మృదువుగా మార్చడం మూలంలో లేని వ్యాఖ్యానాన్ని చేర్చినట్లవుతుంది; మధ్యవర్తిత్వ పాత్రకు అవకాశం పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్య నిర్మాణాన్ని ఉపయోగించాం. ‘ఖడ్గం’ అనే పదం గంభీరతను, మూలంలోని సాహిత్య రూపకాన్ని నిలుపుతుంది; వ్యక్తినామాలకు విస్తృతంగా తెలిసిన తెలుగు రూపాలను వాడాం.
