source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ מִ֠/שָּׁם וַ/יִּמְצָ֞א אֶת אֱלִישָׁ֤ע בֶּן שָׁפָט֙ וְ/ה֣וּא חֹרֵ֔שׁ שְׁנֵים עָשָׂ֤ר צְמָדִים֙ לְ/פָנָ֔י/ו וְ/ה֖וּא בִּ/שְׁנֵ֣ים הֶ/עָשָׂ֑ר וַ/יַּעֲבֹ֤ר אֵלִיָּ֨הוּ֙ אֵלָ֔י/ו וַ/יַּשְׁלֵ֥ךְ אַדַּרְתּ֖/וֹ אֵלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/019.yaml
  text: So he went from there and found Elisha son of Shaphat[a], and he was plowing with twelve yoke-pairs before him, and he was with the twelfth[b]. Elijah passed by him and threw his cloak over him.
translation:
  language: te
  text: అప్పుడు అతడు అక్కడి నుండి వెళ్లి, షాపాతు కుమారుడైన ఎలీషాను కనుగొన్నాడు. ఎలీషాకు ముందుగా కాడికట్టిన పన్నెండు జతలు[a] ఉండగా, అతడు పన్నెండవ జతతో దున్నుతున్నాడు. ఏలీయా అతని వద్దకు వెళ్లి, తన పైవస్త్రాన్ని[b] అతని మీద వేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎద్దుల పన్నెండు కాడి జతలు.” హీబ్రూ పదం దున్నడానికి కాడికట్టిన పన్నెండు జతలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘పైవస్త్రం’ అనేది బయట ధరించే ప్రత్యేకమైన వస్త్రం. పరిసర సందర్భంలో ఇది ఏలీయా ప్రవక్త పరిచర్యకు సంబంధించిన సంకేతంగా పనిచేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: అప్పుడు అతడు అక్కడి నుండి వెళ్లి
  rationale: వావ్-క్రమకథన రూపం కథను ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన అనుసంధానాన్ని ఇస్తుంది, ‘అక్కడి నుండి’ מִשָּׁםను నిలుపుతుంది.
- source_word: וַיִּמְצָא אֶת אֱלִישָׁע בֶּן שָׁפָט
  choice: షాఫాతు కుమారుడైన ఎలీషాను కనుగొన్నాడు
  rationale: מָצָא యొక్క సాధారణ భావమైన ‘కనుగొను’ను నేరుగా అందిస్తుంది; వ్యక్తినామాలు తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించబడ్డాయి.
- source_word: וְהוּא חֹרֵשׁ
  choice: అతడు ... దున్నుతున్నాడు
  rationale: హీబ్రూ వర్తమాన కృదంతం కొనసాగుతున్న చర్యను సూచిస్తుంది; తెలుగు అసమాపక వర్తమాన రూపం ఆ దృశ్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שְׁנֵים עָשָׂר צְמָדִים
  choice: కాడికట్టిన పన్నెండు జతలు
  rationale: צֶמֶד కాడి కట్టిన జంతువుల జతను సూచించగలదు. ప్రధాన పాఠ్యంలో హీబ్రూలో స్పష్టంగా లేని ‘ఎద్దులు’ను చేర్చకుండా వ్యవసాయ సందర్భాన్ని తెలియజేస్తుంది.
- source_word: לְפָנָיו
  choice: ఎలీషాకు ముందుగా
  rationale: జతలు ఎలీషా ముందున్నాయనే స్థల సంబంధాన్ని స్పష్టంగా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְהוּא בִּשְׁנֵים הֶעָשָׂר
  choice: అతడు పన్నెండవ జతతో దున్నుతున్నాడు
  rationale: హీబ్రూ వాక్యంలోని సంక్షిప్తతను కొంత స్పష్టీకరిస్తూ, ఎలీషా పన్నెండవ జతతో ఉన్నాడనే భావాన్ని సందర్భానుగుణంగా అందిస్తుంది.
- source_word: וַיַּעֲבֹר אֵלִיָּהוּ אֵלָיו
  choice: ఏలీయా అతని దగ్గరికి వెళ్లి
  rationale: עָבַר తో אֶל ఇక్కడ ఏలీయా ఎలీషా వద్దకు వెళ్లి తదుపరి సంకేతాత్మక చర్య చేయడాన్ని సూచిస్తుంది; ‘దగ్గరికి వెళ్లి’ సహజమైన ఆధునిక తెలుగు.
- source_word: וַיַּשְׁלֵךְ אַדַּרְתּוֹ אֵלָיו
  choice: తన పైవస్త్రాన్ని అతని మీద వేశాడు
  rationale: אַדֶּרֶת ఏలీయా ధరించిన ప్రత్యేకమైన బయటి వస్త్రం. ‘పైవస్త్రం’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది; చర్యను వివరించకుండా యథాతథంగా ఉంచుతుంది.
theological_decisions:
- issue: ఏలీయా వస్త్రపు సంకేతార్థం
  choice: ‘తన పైవస్త్రాన్ని అతని మీద వేశాడు’ అని చర్యను మాత్రమే ప్రధాన పాఠ్యంలో అనువదించడం
  alternative: ‘తన వారసునిగా నియమించాడు’ అని భావానువాదం చేయడం లేదా ప్రవక్త పదవిని ప్రధాన పాఠ్యంలోనే స్పష్టీకరించడం
  rationale: ఈ వచనం సంకేతాత్మక చర్యను వర్ణిస్తుంది గాని దాని అర్థాన్ని ప్రత్యక్షంగా వివరించదు. కాబట్టి ప్రవక్తగా పిలుపు లేదా వారసత్వ నియామకం అనే భావాన్ని పాఠ్యంలోకి చేర్చకుండా సందర్భానికి వదిలివేయబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. హీబ్రూ వాక్యంలోని వ్యవసాయ దృశ్యం మరియు వస్త్రానికి సంబంధించిన సంకేతాత్మక చర్యను అనవసర వ్యాఖ్యానం లేకుండా నిలుపుతూ, అవసరమైన పదార్థ వివరణలను పాదటిప్పణుల్లో ఇచ్చాం.
