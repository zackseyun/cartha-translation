  to: అప్పుడు అతడు అక్కడి నుండి వెళ్లి, షాపాతు కుమారుడైన ఎలీషాను కనుగొన్నాడు. ఎలీషాకు ముందుగా కాడికట్టిన పన్నెండు జతలు[a] ఉండగా, అతడు పన్నెండవ జతతో దున్నుతున్నాడు. ఏలీయా అతని వద్దకు వెళ్లి, తన పైవస్త్రాన్ని[b] అతని మీద వేశాడు.
  rationale: పాఠ్యార్థాన్ని మార్చకుండా పేరును హీబ్రూ ఉచ్చారణకు, తెలుగు బైబిలు వాడుకకు అనుగుణంగా సవరించాం. ఏలీయా వస్త్రాన్ని దుప్పటిగా చిత్రించే అస్పష్టమైన పాదటిప్పణిని తొలగించి, మూలపదానికి సరిపోయే తటస్థమైన వివరణను ఇచ్చాం. ప్రధాన పాఠ్యం సంకేతాత్మక చర్యను మాత్రమే వర్ణిస్తుంది; ప్రవక్త వారసత్వం వంటి వ్యాఖ్యానాన్ని దానిలో చేర్చలేదు.
