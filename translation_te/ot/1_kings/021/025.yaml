source:
  edition: WLC
  text: רַ֚ק לֹֽא הָיָ֣ה כְ/אַחְאָ֔ב אֲשֶׁ֣ר הִתְמַכֵּ֔ר לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה אֲשֶׁר הֵסַ֥תָּה אֹת֖/וֹ אִיזֶ֥בֶל אִשְׁתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/025.yaml
  text: Surely there was no one like Ahab, who sold himself to do what was evil in the sight of Yahweh, because Jezebel his wife incited him.
translation:
  language: te
  text: నిజంగా, యాహ్వే దృష్టిలో చెడు చేయడానికి తనను తాను అమ్ముకున్న, తన భార్య యెజెబెలు పురికొల్పిన అహాబు వంటి వాడు మరెవ్వరూ లేడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: నిజంగా
  rationale: ఈ సందర్భంలో ఈ కణం వాక్యాన్ని బలంగా నొక్కిచెబుతుంది. ఆధునిక తెలుగులో ‘నిజంగా’ ఆ ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: לֹא הָיָה כְאַחְאָב
  choice: అహాబులాంటి వాడు మరెవ్వరూ లేడు
  rationale: ఈ హీబ్రూ నుడికారం అహాబు సాటిలేనివాడని—ఇక్కడ చెడులో—తెలియజేస్తుంది. తెలుగులో ఈ రూపం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הִתְמַכֵּר
  choice: తనను తాను అమ్ముకున్న
  rationale: מכר అనే మూలపదంలోని ‘అమ్మడం’ రూపకాన్ని హిత్పయేల్ రూపం ఇక్కడ తనను తాను చెడుకు అప్పగించుకోవడం అనే భావంలో వాడుతుంది. మూలంలోని బలమైన చిత్రాన్ని అనువాదం నిలుపుతుంది.
- source_word: לַעֲשׂוֹת הָרַע
  choice: చెడు చేయడానికి
  rationale: చెడును ఆచరించడాన్ని సూచించే ఈ అనంతక్రియా పదబంధానికి ఇది సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: בְּעֵינֵי יְהוָה
  choice: యాహ్వే దృష్టిలో
  rationale: మూలంలోని ‘కళ్లలో’ అనే మూల్యాంకన నుడికారాన్ని తెలుగులో సహజమైన ‘దృష్టిలో’తో వ్యక్తపరుస్తూ, దేవుని తీర్పు ప్రకారం అనే భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ יהוהకు సాధారణంగా పునర్నిర్మించిన ఉచ్చారణను తెలుగు లిపిలో ప్రతిలిపి చేస్తుంది.
- source_word: הֵסַתָּה
  choice: ప్రేరేపించింది
  rationale: హిఫీల్ రూపం ఒకరిని ఒక చర్యవైపు పురికొల్పడం లేదా ప్రేరేపించడం అనే ప్రతికూల సందర్భార్థాన్ని ఇక్కడ కలిగి ఉంది.
- source_word: אֲשֶׁר הֵסַתָּה אֹתוֹ אִיזֶבֶל אִשְׁתּוֹ
  choice: అతని భార్య యెజెబెలు అతన్ని ప్రేరేపించింది
  rationale: అహాబును యెజెబెలు ప్రేరేపించిందనే సంబంధాన్ని స్పష్టమైన ఆధునిక తెలుగు వాక్యంగా ఇస్తుంది; אֲשֶׁר యొక్క సంబంధార్థం మరియు సందర్భంలో సాధ్యమైన కారణార్థం గురించి పాదసూచిక తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగు లిపిలో ‘యాహ్వే’గా ఇవ్వడం మూలంలోని నామాన్ని నిలుపుతుంది.
- issue: యెజెబెలు ప్రేరేపణకు అహాబు దోషబాధ్యతకు మధ్య సంబంధం
  choice: అహాబు తనను తాను అమ్ముకున్నాడని, యెజెబెలు అతన్ని ప్రేరేపించిందని రెండింటినీ ఉంచడం
  alternative: అహాబు చెడు చేసినది కేవలం యెజెబెలు కారణంగానే అని స్పష్టీకరించడం
  rationale: మూలం అహాబు స్వచ్ఛంద దోషాన్ని మరియు అతని భార్య ప్రేరేపణను పక్కపక్కనే ఉంచుతుంది. అనువాదం ఒకదానితో మరొకదాన్ని తొలగించదు లేదా దోషాన్ని పూర్తిగా యెజెబెలుపై మోపదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ‘తనను తాను అమ్ముకున్న’ అనే మూలంలోని గాఢమైన రూపకం యథాతథంగా నిలుపబడింది. శైలి గౌరవప్రదంగా, సంక్షిప్తంగా ఉంది.
