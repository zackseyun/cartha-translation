id: 1KI.21.3
reference: 1 Kings 21:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר נָב֖וֹת אֶל אַחְאָ֑ב חָלִ֤ילָ/ה לִּ/י֙ מֵֽ/יהוָ֔ה מִ/תִּתִּ֛/י אֶת נַחֲלַ֥ת אֲבֹתַ֖/י לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/003.yaml
  text: But Naboth said to Ahab[a], “Far be it from me by Yahweh to give you the inheritance of my fathers.”
translation:
  language: te
  text: కానీ నాబోతు అహాబుతో, “యహ్వే వలన, నా పితరుల వారసత్వ ఆస్తిని నీకు ఇవ్వడం నాకు దూరంగా ఉండుగాక!” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: కానీ ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ముందు వచనంలోని అహాబు ప్రతిపాదనకు నాబోతు సమాధానం విరుద్ధంగా ఉన్నందున ‘కానీ’ సందర్భానుకూలం.
- source_word: נָבוֹת אֶל־אַחְאָב
  choice: నాబోతు అహాబుతో
  rationale: వ్యక్తుల పేర్లను తెలుగులో సహజంగా లిప్యంతరీకరించి, אֶל సూచించే సంబోధితుడిని ‘తో’ ద్వారా వ్యక్తం చేశాం.
- source_word: חָלִילָה לִּי מֵיְהוָה
  choice: యహ్వే సాక్షిగా ... నాకు ఎంతమాత్రమూ తగదు
  rationale: ఈ బలమైన నిరాకరణ సూత్రంలో మֵיְהוָה దేవునితో సంబంధాన్ని లేదా ప్రమాణసదృశ భావాన్ని సూచిస్తుంది. తెలుగు సహజత్వం కోసం ‘యహ్వే సాక్షిగా’ అని, חָלִילָה לִּי యొక్క తీవ్రత కోసం ‘నాకు ఎంతమాత్రమూ తగదు’ అని అనువదించాం.
- source_word: מִתִּתִּי
  choice: నేను ... ఇవ్వడం
  rationale: ప్రత్యయంతో కూడిన ఇన్ఫినిటివ్ నిర్మాణం నాబోతు చేయడానికి నిరాకరిస్తున్న కార్యాన్ని సూచిస్తుంది.
- source_word: נַחֲלַת אֲבֹתַי
  choice: నా పితరుల వారసత్వ ఆస్తి
  rationale: נַחֲלָה సాధారణ ఆస్తి మాత్రమే కాక, వంశపారంపర్యంగా సంక్రమించిన కుటుంబ భూమి లేదా స్వాస్థ్యాన్ని సూచిస్తుంది; ‘వారసత్వ ఆస్తి’ ఆ న్యాయపరమైన, కుటుంబపరమైన భావాలను నిలుపుతుంది. אֲבֹתַי లోని పురుష బహువచనాన్ని ‘పితరులు’గా ఉంచాం.
- source_word: לָךְ
  choice: నీకు
  rationale: ‘ఇవ్వడం’ అనే క్రియకు పరోక్ష కర్మను సహజ తెలుగులో సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణను తెలుగులో ‘యహ్వే’గా ఇచ్చాం.
- issue: חָלִילָה לִּי מֵיְהוָה అనే సూత్రాన్ని ఎంతవరకు జాతీయంగా అనువదించాలి
  choice: యహ్వే సాక్షిగా ... నాకు ఎంతమాత్రమూ తగదు
  alternative: నేను ... ఇవ్వడం యహ్వే అనుమతించకూడదు
  rationale: ప్రధాన పాఠం ప్రమాణసదృశ బలమైన నిరాకరణను సహజ తెలుగులో తెలియజేస్తుంది; అయితే యహ్వే నేరుగా నిషేధిస్తున్నాడని మూలంలో లేని స్పష్టీకరణను చేర్చదు. మరింత జాతీయమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. ‘పితరులు,’ ‘వారసత్వ ఆస్తి’ వంటి పదాలు కుటుంబ వారసత్వ భావాన్ని స్పష్టంగా ఉంచుతాయి. ప్రధాన వాక్యం సహజంగా ఉండేలా చేసినప్పటికీ, మూలంలోని ప్రమాణసదృశ తీవ్రతను తగ్గించలేదు.
