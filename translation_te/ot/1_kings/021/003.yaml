revisions:
- from: కానీ నాబోతు అహాబుతో, “యహ్వే సాక్షిగా, నా పితరుల వారసత్వ ఆస్తిని నీకు ఇవ్వడం నాకు ఎంతమాత్రమూ తగదు[a]” అన్నాడు.
  to: కానీ నాబోతు అహాబుతో, “యహ్వే వలన, నా పితరుల వారసత్వ ఆస్తిని నీకు ఇవ్వడం నాకు దూరంగా ఉండుగాక!” అన్నాడు.
  rationale: The principal revision removes the added “as witness” meaning and renders the Hebrew repudiation formula more closely. The footnote is retained as an idiomatic alternative, but its description and wording are corrected. The footnote anchor remains attached to the repudiation formula in the revised complete text.
