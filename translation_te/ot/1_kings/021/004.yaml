source:
  edition: WLC
  text: וַ/יָּבֹא֩ אַחְאָ֨ב אֶל בֵּית֜/וֹ סַ֣ר וְ/זָעֵ֗ף עַל הַ/דָּבָר֙ אֲשֶׁר דִּבֶּ֣ר אֵלָ֗י/ו נָבוֹת֙ הַ/יִּזְרְעֵאלִ֔י וַ/יֹּ֕אמֶר לֹֽא אֶתֵּ֥ן לְ/ךָ֖ אֶת נַחֲלַ֣ת אֲבוֹתָ֑/י וַ/יִּשְׁכַּב֙ עַל מִטָּת֔/וֹ וַ/יַּסֵּ֥ב אֶת פָּנָ֖י/ו וְ/לֹֽא אָ֥כַל לָֽחֶם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/004.yaml
  text: So Ahab went into his house sullen and angry because of the word that Naboth the Jezreelite had spoken to him[a], saying, “I will not give you the inheritance of my fathers.” And he lay down on his bed and turned his face away[c][b], and he would not eat bread.
translation:
  language: te
  text: యెజ్రెయేలీయుడైన నాబోతు అహాబుతో, “నా పితరుల స్వాస్థ్యాన్ని నీకు ఇవ్వను” అని చెప్పిన మాటవల్ల అహాబు ముభావంగా, కోపంగా తన ఇంటికి వచ్చాడు. అతడు తన మంచం మీద పడుకొని, ముఖం పక్కకు తిప్పుకొని, భోజనం చేయలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థం: “రొట్టె తినలేదు.” హీబ్రూలో ఈ ప్రయోగం సాధారణంగా ఆహారం తీసుకోవడాన్ని సూచించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַר וְזָעֵף
  choice: దిగులుతో, కోపంతో
  rationale: ఈ జంట పదాలు అహాబు లోలోపల అసంతృప్తితో ముడుచుకొని, ఆగ్రహంగా ఉన్న స్థితిని సూచిస్తాయి. ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేయడానికి ఈ పదజోడును ఎంచుకున్నాం.
- source_word: עַל הַדָּבָר אֲשֶׁר דִּבֶּר אֵלָיו
  choice: తనతో చెప్పిన మాటను బట్టి
  rationale: דבר అనే పదానికి ‘మాట,’ ‘విషయం’ అనే అర్థాలు ఉండవచ్చు; ఇక్కడ నాబోతు పలికిన నిరాకరణను సూచిస్తున్నందున ‘మాట’ అనేది మూలానికి దగ్గరగా, తెలుగులో సహజంగా ఉంది.
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: యెజ్రెయేలీయుడైన నాబోతు
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించి, అతని ప్రాంతీయ గుర్తింపును సహజమైన తెలుగు రూపంలో ఉంచాం.
- source_word: נַחֲלַת אֲבוֹתָי
  choice: నా పితరుల స్వాస్థ్యం
  rationale: נחלה కేవలం ఆస్తి కాకుండా వంశపారంపర్యంగా సంక్రమించిన భూమి లేదా వాటాను సూచిస్తుంది. אבות అనే పురుషలింగ బహువచనాన్ని ‘పితరులు’గా నిలిపాం.
- source_word: וַיִּשְׁכַּב עַל מִטָּתוֹ
  choice: తన మంచం మీద పడుకొని
  rationale: కథనంలోని వరుస చర్యను సహజమైన తెలుగు సంయుక్త క్రియారూపంలో వ్యక్తం చేస్తుంది.
- source_word: וַיַּסֵּב אֶת פָּנָיו
  choice: ముఖం తిప్పుకొని
  rationale: మూలంలోని శారీరక హావను అనవసరంగా దాని భావాన్ని విస్తరించకుండా సహజ తెలుగులో నిలుపుతుంది.
- source_word: וְלֹא אָכַל לָחֶם
  choice: భోజనం చేయలేదు
  rationale: ‘రొట్టె తినలేదు’ అనేది అక్షరార్థం; అయితే לחם ఇక్కడ సాధారణంగా ఆహారం తీసుకోవడాన్ని సూచించే ప్రయోగం. ‘భోజనం చేయలేదు’ ఆధునిక తెలుగులో ఆ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: నాబోతు పేర్కొన్న వంశపారంపర్య స్వాస్థ్యంలో లింగ సూచన
  choice: నా పితరుల స్వాస్థ్యం
  alternative: నా పూర్వికుల స్వాస్థ్యం
  rationale: హీబ్రూ אֲבוֹתָי పదం స్పష్టంగా పురుషలింగ బహువచనం. భూమి పితృవంశం ద్వారా సంక్రమించిన సందర్భంలోని కుటుంబ, వారసత్వ ప్రాధాన్యాన్ని ‘పితరులు’ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని అనుసరించాం. మూలంలోని భావోద్వేగ తీవ్రత, వంశపారంపర్య స్వాస్థ్య భావం నిలిచేలా చూసి, ‘రొట్టె తినడం’ అనే హీబ్రూ నుడికారాన్ని పాఠ్యంలో సహజీకరించి పాదటిప్పణిలో అక్షరార్థాన్ని ఇచ్చాం.
