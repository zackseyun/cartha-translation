  text: וַ/יַּעֲשׂוּ֩ אַנְשֵׁ֨י עִיר֜/וֹ הַ/זְּקֵנִ֣ים וְ/הַ/חֹרִ֗ים אֲשֶׁ֤ר הַ/יֹּֽשְׁבִים֙ בְּ/עִיר֔/וֹ כַּ/אֲשֶׁ֛ר שָׁלְחָ֥ה אֲלֵי/הֶ֖ם אִיזָ֑בֶל כַּ/אֲשֶׁ֤ר כָּתוּב֙ בַּ/סְּפָרִ֔ים אֲשֶׁ֥ר שָׁלְחָ֖ה אֲלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/011.yaml
  text: So the men of his city—the elders and the nobles who lived in his city—did as Jezebel had sent to them[a], as it was written in the letters that she had sent to them.
translation:
  language: te
  text: అప్పుడు అతని పట్టణంలోని మనుషులు—అంటే, ఆ పట్టణంలో నివసించే పెద్దలూ ప్రముఖులూ[a]—యెజెబెలు తమకు పంపిన దాని ప్రకారం, ఆమె తమకు పంపిన ఉత్తరాల్లో వ్రాసి ఉన్నట్లే చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఉన్నత హోదాలో ఉన్నవారు’; ఇక్కడి హీబ్రూ పదం సమాజంలో ప్రముఖ స్థానం గలవారిని లేదా ఉన్నతాధికారులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: చేశారు
  rationale: ఇక్కడ עשה యెజెబెలు పంపిన సూచనలను అమలు చేయడాన్ని తెలిపే సాధారణ క్రియ. ‘చేశారు’ కథనంలోని సరళతను నిలుపుతుంది.
- source_word: אַנְשֵׁי עִירוֹ
  choice: అతని పట్టణపు మనుషులు
  rationale: ఇది అక్షరార్థంగా ‘అతని పట్టణపు మనుషులు.’ తరువాతి వివరణ వీరు పురుషులైన పౌర నాయకులు—పెద్దలు, ప్రముఖులు—అని స్పష్టం చేస్తుంది.
- source_word: הַזְּקֵנִים
  choice: పెద్దలు
  rationale: ఈ పౌర సందర్భంలో ఇది కేవలం వృద్ధులను కాక, గుర్తింపు పొందిన సమాజ నాయకులను సూచిస్తుంది.
- source_word: הַחֹרִים
  choice: ప్రముఖులు
  rationale: ఈ పదం ఉన్నత సామాజిక స్థానం లేదా హోదా గలవారిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ప్రముఖులు’ సహజంగా ఉండి, ‘ఉన్నత హోదాలో ఉన్నవారు’ అనే ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: הַיֹּשְׁבִים בְּעִירוֹ
  choice: ఆ పట్టణంలో నివసించే
  rationale: ישב యొక్క ‘నివసించు’ అనే సందర్భోచిత భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כַּאֲשֶׁר שָׁלְחָה אֲלֵיהֶם אִיזָבֶל
  choice: యెజెబెలు తమకు పంపిన సందేశం ప్రకారం
  rationale: హీబ్రూలో ‘పంపిన’ క్రియకు కర్మ ప్రత్యక్షంగా లేదు; వెంటనే ప్రస్తావించబడే ఉత్తరాలు దాని భావాన్ని తెలియజేస్తాయి. తెలుగులో వాక్యం సహజంగా ఉండేందుకు ‘సందేశం’ అని వ్యక్తపరచబడింది, కానీ దానిని ప్రత్యేకంగా ‘ఆజ్ఞ’గా నిర్ధారించలేదు.
- source_word: כָּתוּב בַּסְּפָרִים
  choice: ఉత్తరాల్లో రాసి ఉన్నట్టే
  rationale: ఇక్కడ סְפָרִים యెజెబెలు పంపిన లిఖిత సమాచారాన్ని సూచిస్తుంది; అందువల్ల ‘ఉత్తరాలు’ సందర్భానికి సరిపోతుంది.
- source_word: אֲשֶׁר שָׁלְחָה אֲלֵיהֶם
  choice: ఆమె తమకు పంపిన
  rationale: ఈ సంబంధవాచక వాక్యభాగం ఉత్తరాలను గుర్తిస్తుంది; తెలుగు రూపం పూర్వపద సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని ‘ప్రకారం … రాసి ఉన్నట్టే’ అనే పునరుక్తి భావాన్ని నిలుపుతూ, తెలుగులో అర్థస్పష్టత కోసం గీతల మధ్య వివరణాత్మక పదబంధం ఉంచబడింది.
