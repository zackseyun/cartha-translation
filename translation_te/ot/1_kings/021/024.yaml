  edition: WLC
  text: הַ/מֵּ֤ת לְ/אַחְאָב֙ בָּ/עִ֔יר יֹאכְל֖וּ הַ/כְּלָבִ֑ים וְ/הַ/מֵּת֙ בַּ/שָּׂדֶ֔ה יֹאכְל֖וּ ע֥וֹף הַ/שָּׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/024.yaml
  text: Anyone belonging to Ahab who dies in the city the dogs will eat[b][a], and anyone who dies in the field the birds of the sky will eat.
translation:
  language: te
  text: అహాబుకు చెందినవారిలో నగరంలో చనిపోయినవారిని కుక్కలు తింటాయి[a]; వారిలో పొలంలో చనిపోయినవారిని ఆకాశంలోని పక్షులు తింటాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “అహాబుకు చెందిన మృతుడు”; ఇక్కడ అహాబు ఇంటివారిలో చనిపోయే ఎవరినైనా ఈ మాట సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, “ఆకాశపు పక్షులు”; “ఆకాశ పక్షులు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת לְאַחְאָב
  choice: అహాబుకు చెందినవారిలో ... చనిపోయినవారిని
  rationale: నిర్దిష్ట ఆర్టికల్‌తో ఉన్న מות కృదంతం ఇక్కడ సాధారణార్థంలో ఉంది; לְ సంబంధం లేదా చెందుదలను సూచిస్తుంది. అందువల్ల అహాబు ఇంటివారిలో చనిపోయే ఎవరినైనా సూచించేలా సహజమైన తెలుగులో అనువదించబడింది.
- source_word: בָּעִיר
  choice: పట్టణంలో
  rationale: స్థలాన్ని సూచించే సాధారణ ప్రయోగం; పొలంతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: יֹאכְלוּ
  choice: తింటాయి
  rationale: אכל అనే క్రియ యొక్క ప్రాథమిక అర్థమైన ‘తిను’ను నేరుగా నిలుపుతుంది; సందర్భంలోని భయానకతను అదనపు తీవ్ర పదంతో పెంచలేదు.
- source_word: הַכְּלָבִים
  choice: కుక్కలు
  rationale: హీబ్రూ పదానికి నేర అనువాదం; మరణానంతర అవమానకర పరిణామాన్ని యథాతథంగా వ్యక్తం చేస్తుంది.
- source_word: בַּשָּׂדֶה
  choice: పొలంలో
  rationale: హీబ్రూ దృశ్యరూపాన్నీ పట్టణం–పొలం వ్యత్యాసాన్నీ కాపాడే నేర అనువాదం.
- source_word: עוֹף הַשָּׁמָיִם
  choice: ఆకాశపక్షులు
  rationale: ‘ఆకాశపు పక్షులు’ అనే హీబ్రూ భావాన్ని సహజమైన ఆధునిక తెలుగు సమాసంతో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి వాడబడింది. రెండు సమాంతర భాగాల నిర్మాణం, పట్టణం–పొలం వ్యత్యాసం, ‘తింటాయి’ అనే సూటి భాష నిలుపబడ్డాయి.
