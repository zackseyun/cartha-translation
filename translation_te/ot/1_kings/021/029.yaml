id: 1KI.21.29
reference: 1 Kings 21:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲֽ/רָאִ֔יתָ כִּֽי נִכְנַ֥ע אַחְאָ֖ב מִ/לְּ/פָנָ֑/י יַ֜עַן כִּֽי נִכְנַ֣ע מִ/פָּנַ֗/י לֹֽא אבי הָֽ/רָעָה֙ בְּ/יָמָ֔י/ו בִּ/ימֵ֣י בְנ֔/וֹ אָבִ֥יא הָ/רָעָ֖ה עַל בֵּיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/029.yaml
  text: Have you seen that Ahab has humbled himself before me? Because he has humbled himself before me[a], I will not bring the disaster in his days[b]; in his son's days I will bring the disaster on his house.
translation:
  language: te
  text: “అహాబు నా ఎదుట తనను తాను తగ్గించుకున్నాడని చూశావా? అతడు నా ఎదుట తనను తాను తగ్గించుకున్నాడు కాబట్టి, అతని రోజుల్లో నేను ఆ విపత్తును[a] రప్పించను; అతని కుమారుని రోజుల్లో అతని ఇంటి[b] మీదికి ఆ విపత్తును రప్పిస్తాను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆపదను.” హెబ్రీలో “ఆ కీడును/విపత్తును.” ఈ తీర్పు సందర్భంలో ఈ పదం నైతిక కీడును కాక శిక్షాత్మక విపత్తును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “ఇల్లు” అనేది అతని కుటుంబాన్ని లేదా రాజవంశాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרָאִיתָ
  choice: చూశావా?
  rationale: ראה అనే క్రియ యొక్క Qal perfect ద్వితీయ పురుష ఏకవచన రూపాన్ని, ఏలీయాతో దేవుడు నేరుగా అడిగిన ప్రశ్నగా సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: נִכְנַע
  choice: తనను తాను తగ్గించుకున్నాడు
  rationale: כנע అనే క్రియ యొక్క Niphal రూపం ఇక్కడ దేవుని తీర్పు ఎదుట తనను తాను తగ్గించుకొని లోబడిన భావాన్ని ఇస్తుంది. ‘పశ్చాత్తాపపడ్డాడు’ అని మూలంలో లేని పూర్తి భావాన్ని చేర్చకుండా ప్రతిబింబిస్తుంది.
- source_word: מִלְּפָנַי / מִפָּנַי
  choice: నా ఎదుట
  rationale: అక్షరార్థంగా దేవుని ముఖం లేదా సన్నిధి ఎదుట అనే హెబ్రీ నుడికారాన్ని సహజంగా, సంబంధాత్మక భావంతో అందిస్తుంది.
- source_word: יַעַן כִּי
  choice: కాబట్టి
  rationale: అహాబు తనను తగ్గించుకోవడం వల్ల తీర్పు వాయిదా పడుతుందనే కారణ–ఫలిత సంబంధాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: לֹא אָבִיא
  choice: నేను ... రప్పించను
  rationale: בוא యొక్క Hiphil రూపం ‘వచ్చేలా చేయడం/రప్పించడం’ అనే కార్యార్థాన్ని కలిగి ఉంది; తీర్పును సంభవింపజేయనని చెప్పే సందర్భానికి ఇది సహజమైన తెలుగు.
- source_word: הָרָעָה
  choice: ఆ విపత్తు
  rationale: ఈ తీర్పు సందర్భంలో רָעָה నైతిక దుష్టత్వాన్ని కాక శిక్షాత్మక ఆపదను సూచిస్తుంది. ‘విపత్తు’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּיָמָיו
  choice: అతని రోజుల్లో
  rationale: హెబ్రీ కాలసూచక నుడికారాన్ని నిలుపుతూ, అహాబు జీవితకాలాన్ని సూచిస్తుంది.
- source_word: בִּימֵי בְנוֹ
  choice: అతని కుమారుని రోజుల్లో
  rationale: ముందటి ‘అతని రోజుల్లో’ అనే నిర్మాణంతో ఉన్న సమాంతరతను, కాలపరమైన వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: עַל בֵּיתוֹ
  choice: అతని ఇంటి మీదికి
  rationale: రాజవంశ సందర్భంలో ‘ఇల్లు’ కుటుంబాన్ని లేదా వంశాన్ని సూచించగలదు. ప్రధాన పాఠ్యంలో మూలంలోని రూపకాన్ని నిలిపి, విస్తృత భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
theological_decisions:
- issue: అహాబు స్పందన స్వభావం
  choice: ‘తనను తాను తగ్గించుకున్నాడు’ అని అనువదించడం
  alternative: ‘పశ్చాత్తాపపడ్డాడు’ లేదా ‘లోబడ్డాడు’
  rationale: వచనం అహాబు దేవుని ఎదుట తనను తాను తగ్గించుకున్నాడని, అందువల్ల దేవుడు తీర్పును వాయిదా వేశాడని చెబుతుంది. అయితే సాధారణ పశ్చాత్తాప పదజాలాన్ని ఉపయోగించదు; కాబట్టి మూలంలోని వేదాంతపరమైన ఉద్రిక్తతను పరిష్కరించకుండా అలాగే ఉంచుతుంది.
- issue: దేవుడు రప్పించే רָעָה భావం
  choice: ‘విపత్తు’ అని అనువదించడం
  alternative: ‘కీడు’ లేదా ‘ఆపద’
  rationale: ఇక్కడ ఉద్దేశం దేవునిలో నైతిక దుష్టత్వం కాదు; అహాబు ఇంటి మీద ప్రకటించబడిన న్యాయతీర్పు రూపమైన విపత్తు. అందువల్ల ‘విపత్తు’ సందర్భార్థాన్ని ఖచ్చితంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన వాక్యశైలిని ఉపయోగించాం. ‘నా ఎదుట,’ ‘రోజుల్లో,’ ‘ఇంటి మీదికి’ వంటి మూలరూపాలను సహజమైన మేరకు నిలిపాం; అస్పష్టత ఉన్న ‘ఇల్లు’ అనే పదాన్ని ప్రధాన పాఠ్యంలో విస్తరించకుండా పాదసూచికలో వివరించాం.
