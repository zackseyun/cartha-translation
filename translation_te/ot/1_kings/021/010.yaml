id: 1KI.21.10
reference: 1 Kings 21:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֠/הוֹשִׁיבוּ שְׁנַ֨יִם אֲנָשִׁ֥ים בְּנֵֽי בְלִיַּעַל֮ נֶגְדּ/וֹ֒ וִ/יעִדֻ֣/הוּ לֵ/אמֹ֔ר בֵּרַ֥כְתָּ אֱלֹהִ֖ים וָ/מֶ֑לֶךְ וְ/הוֹצִיאֻ֥/הוּ וְ/סִקְלֻ֖/הוּ וְ/יָמֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/010.yaml
  text: And seat two worthless men opposite him[a], and let them testify against him, saying, ‘You have cursed God and the king.’ Then bring him out and stone him, so that he dies.
translation:
  language: te
  text: అతనికి ఎదురుగా దుర్మార్గులైన ఇద్దరు మనుషులను కూర్చోబెట్టి, ‘నీవు దేవుణ్ణీ రాజునూ దూషించావు[a]’ అని అతనికి వ్యతిరేకంగా వారితో సాక్ష్యం చెప్పించండి. తరువాత అతన్ని బయటికి తీసుకెళ్లి, అతడు చనిపోయేలా రాళ్లతో కొట్టండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “నీవు దేవుణ్ణీ రాజునూ ఆశీర్వదించావు.” ఇక్కడ “ఆశీర్వదించావు” అనేది “దూషించావు” అని చెప్పడానికి ఉపయోగించిన సభ్యోక్తి.
    reason: మూలంలోని ברך అనే పదం యొక్క అక్షరార్థాన్నీ, ఈ సందర్భంలోని సభ్యోక్తి ప్రయోగాన్నీ తెలియజేయడం.
lexical_decisions:
- source_word: וְהוֹשִׁיבוּ
  choice: కూర్చోబెట్టి
  rationale: హిఫిల్ రూపంలోని కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שְׁנַיִם אֲנָשִׁים
  choice: ఇద్దరు మనుషులను
  rationale: న్యాయపరమైన సందర్భంలో పేర్కొన్న ఇద్దరు పురుష సాక్షులను స్పష్టంగా నిలుపుతుంది.
- source_word: בְּנֵי בְלִיַּעַל
  choice: నీచులైన ... మనుషులను
  rationale: ఈ నానుడి నైతికంగా భ్రష్టులైన, దుష్టులైన వ్యక్తులను సూచిస్తుంది; తరువాతి కాలపు ‘బెలీయాలు’ అనే వ్యక్తినామ భావాన్ని దిగుమతి చేయదు.
- source_word: נֶגְדּוֹ
  choice: అతనికి ఎదురుగా
  rationale: ఆ వ్యక్తిని ఎదుర్కొనేలా, అధికారిక సభలో అతని ఎదుట కూర్చోబెట్టే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וִיעִדֻהוּ
  choice: అతనికి వ్యతిరేకంగా వారితో సాక్ష్యం చెప్పించండి
  rationale: న్యాయసంబంధమైన ‘సాక్ష్యం పలకడం’ అనే భావాన్నీ, సందర్భంలో ఆ సాక్ష్యం అతనికి వ్యతిరేకమైనదనే దిశనూ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בֵּרַכְתָּ
  choice: దూషించావు
  rationale: మూల క్రియ సాధారణంగా ‘ఆశీర్వదించు’ అని అర్థమైనా, ఇక్కడ దేవుని విషయంలో గౌరవార్థక సభ్యోక్తిగా ‘దూషించు/శపించు’ అనే అర్థంలో వాడబడింది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֱלֹהִים
  choice: దేవుణ్ణి
  rationale: రాజుతో కలిపి మోపబడిన నేరారోపణలో ఏకవచనంగా ఇశ్రాయేలు దేవుడే ఉద్దేశించబడ్డాడు.
- source_word: וָמֶלֶךְ
  choice: రాజునూ
  rationale: దేవునిపైనా రాజుపైనా చేసిన నేరాలను సమన్వయంతో జతచేసే మూల వాక్యాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְהוֹצִיאֻהוּ
  choice: అతన్ని బయటికి తీసుకెళ్లి
  rationale: మరణశిక్ష అమలు కోసం సభ లేదా పట్టణం వెలుపలికి తీసుకెళ్లే చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: וְסִקְלֻהוּ
  choice: రాళ్లతో కొట్టండి
  rationale: రాళ్లతో కొట్టి మరణశిక్ష అమలు చేయడాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְיָמֹת
  choice: అతడు చనిపోయేలా
  rationale: చివరి క్రియలోని ఉద్దేశిత ఫలితాన్ని—రాళ్లతో కొట్టడం వల్ల అతడు మరణించడాన్ని—స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: దేవుడు కర్మగా ఉన్నప్పుడు ברך అనే క్రియ యొక్క సభ్యోక్తి ప్రయోగం
  choice: ప్రధాన పాఠ్యంలో ‘దూషించావు’ అని అనువదించడం
  alternative: ‘ఆశీర్వదించావు’ అని అక్షరార్థంగా అనువదించి వివరణ ఇవ్వడం
  rationale: ఇది దేవునినీ రాజునీ దూషించాడనే కల్పిత మరణార్హ నేరారోపణ. ప్రధాన పాఠ్యంలో ‘ఆశీర్వదించావు’ అంటే ఉద్దేశించిన నేరానికి విరుద్ధమైన భావం కలుగుతుంది; అయినా మూలంలోని గౌరవార్థక సభ్యోక్తిని పాదసూచిక పారదర్శకంగా సంరక్షిస్తుంది.
- issue: בְּנֵי בְלִיַּעַל అనే నానుడి
  choice: ‘నీచులైన మనుషులు’
  alternative: ‘బెలీయాలు కుమారులు’ లేదా ‘పనికిమాలిన మనుషులు’
  rationale: ఈ సందర్భంలో అది ఒక వ్యక్తినామం కాదు; నైతికంగా భ్రష్టులైన వ్యక్తులను సూచించే నానుడి. ఎటువంటి తరువాతి దయ్యశాస్త్ర భావాన్నీ చేర్చకుండా దాని నైతిక తీవ్రతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూప శైలిని వాడాం. న్యాయసభ నేపథ్యాన్ని ‘ఎదురుగా’, ‘వ్యతిరేకంగా’, ‘సాక్ష్యం’ అనే పదాలతో స్పష్టంగా ఉంచాం; మూలంలోని నైతిక, ధార్మిక ఉద్రిక్తతను పాదసూచికతో సంరక్షించాం.
