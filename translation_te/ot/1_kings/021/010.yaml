revisions:
- from: 'అతనికి ఎదురుగా నీచులైన ఇద్దరు మనుషులను కూర్చోబెట్టి, ‘నీవు దేవుణ్ణీ రాజునూ దూషించావు[a]’ అని అతనికి వ్యతిరేకంగా వారితో సాక్ష్యం చెప్పించండి. తరువాత అతన్ని బయటికి తీసుకెళ్లి, అతడు చనిపోయేలా రాళ్లతో కొట్టండి.


    [a] హెబ్రీలో అక్షరార్థంగా, “నీవు దేవుణ్ణీ రాజునూ ఆశీర్వదించావు.” ఇక్కడ “ఆశీర్వదించావు” అనేది “దూషించావు” అని చెప్పడానికి ఉపయోగించిన సభ్యోక్తి.'
  to: అతనికి ఎదురుగా దుర్మార్గులైన ఇద్దరు మనుషులను కూర్చోబెట్టి, ‘నీవు దేవుణ్ణీ రాజునూ దూషించావు[a]’ అని అతనికి వ్యతిరేకంగా వారితో సాక్ష్యం చెప్పించండి. తరువాత అతన్ని బయటికి తీసుకెళ్లి, అతడు చనిపోయేలా రాళ్లతో కొట్టండి.
  rationale: బְּנֵי בְלִיַּעַלకు ఉన్న నైతికంగా దుష్టమైన, చట్టవిరోధమైన భావాన్ని స్పష్టంగా ప్రతిబింబించడానికి మాత్రమే ‘నీచులైన’ స్థానంలో ‘దుర్మార్గులైన’ను వాడాం. మిగిలిన పాఠ్యాన్ని, అలాగే వివాదాస్పదంగా కనిపించే సభ్యోక్తి క్రియకు సంబంధించిన పాదసూచికను, మూలార్థానికి నమ్మకంగా ఉన్నందున నిలిపి ఉంచాం.
