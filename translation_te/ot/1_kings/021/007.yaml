  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר אֵלָי/ו֙ אִיזֶ֣בֶל אִשְׁתּ֔/וֹ אַתָּ֕ה עַתָּ֛ה תַּעֲשֶׂ֥ה מְלוּכָ֖ה עַל יִשְׂרָאֵ֑ל ק֤וּם אֱכָל לֶ֨חֶם֙ וְ/יִטַ֣ב לִבֶּ֔/ךָ אֲנִי֙ אֶתֵּ֣ן לְ/ךָ֔ אֶת כֶּ֖רֶם נָב֥וֹת הַ/יִּזְרְעֵאלִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/007.yaml
  text: Then Jezebel his wife said to him[a], “Do you now govern Israel as king? Get up, eat bread, and let your heart be cheerful[b]; I will give you the vineyard of Naboth the Jezreelite.”
translation:
  language: te
  text: 'అప్పుడు అతని భార్య యెజెబెలు అతనితో ఇలా చెప్పింది: “నువ్వు ఇప్పుడు ఇశ్రాయేలుపై రాజుగా పరిపాలిస్తున్నావా? లేచి భోజనం చేసి, మనసు ఉల్లాసంగా ఉంచుకో[b]. యిజ్రెయేలీయుడైన నాబోతు ద్రాక్షతోటను నేను నీకు ఇస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “రొట్టె తిను”; ఇది భోజనం చేయడాన్ని సూచించే నానుడి.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: అప్పుడు ... అతనితో ... చెప్పింది
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన శైలిలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: אִיזֶבֶל אִשְׁתּוֹ
  choice: అతని భార్య యెజెబెలు
  rationale: మాట్లాడుతున్న వ్యక్తి పేరుతోపాటు అహాబుతో ఆమె సంబంధాన్ని సహజమైన తెలుగు పదక్రమంలో తెలియజేస్తుంది.
- source_word: אַתָּה עַתָּה תַּעֲשֶׂה מְלוּכָה עַל יִשְׂרָאֵל
  choice: ఇప్పుడు ఇశ్రాయేలుపై రాజుగా పరిపాలిస్తున్నది నువ్వే కదా?
  rationale: מְלוּכָה עשה అంటే రాజాధికారాన్ని చలాయించడం. సందర్భంలోని మందలింపు, వ్యంగ్య ప్రశ్న స్వరాన్ని ‘నువ్వే కదా?’ సహజంగా వ్యక్తం చేస్తుంది; ప్రకటనగా చదివే అవకాశాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: קוּם
  choice: లేచి
  rationale: ఆజ్ఞార్థక క్రియను తరువాతి క్రియతో సహజంగా అనుసంధానించే ఆధునిక తెలుగు రూపం.
- source_word: אֱכָל לֶחֶם
  choice: భోజనం చేసి
  rationale: అక్షరార్థంగా ‘రొట్టె తిను’; హీబ్రూ వాడుకలో ఇది భోజనం చేయడాన్ని సూచిస్తుంది. తెలుగులో అర్థాన్ని సహజంగా అందిస్తుంది.
- source_word: וְיִטַב לִבֶּךָ
  choice: మనసు ఉల్లాసంగా ఉంచుకో
  rationale: అక్షరార్థంగా ‘నీ హృదయం మంచిగా/సంతోషంగా ఉండనివ్వు’; అంతరంగ స్థితిని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲנִי אֶתֵּן לְךָ
  choice: నేను నీకు ఇస్తాను
  rationale: ప్రత్యక్ష సర్వనామమైన אֲנִי లోని వక్త ప్రాధాన్యాన్ని ‘నేను’ నిలుపుతుంది.
- source_word: כֶּרֶם נָבוֹת הַיִּזְרְעֵאלִי
  choice: యిజ్రెయేలీయుడైన నాబోతు ద్రాక్షతోటను
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని తెలుగులో సహజంగా మార్చి, నాబోతు ప్రాంతీయ గుర్తింపును నిలుపుతుంది.
theological_decisions:
- issue: యెజెబెలు ప్రారంభ వాక్యపు స్వరూపం
  choice: 'వ్యంగ్యార్థక ప్రశ్నగా: ‘ఇప్పుడు ఇశ్రాయేలుపై రాజుగా పరిపాలిస్తున్నది నువ్వే కదా?’'
  alternative: 'ప్రకటన లేదా ఎద్దేవాగా: ‘ఇప్పుడు ఇశ్రాయేలుపై రాజాధికారం చలాయిస్తున్నది నువ్వే.’'
  rationale: హీబ్రూలో స్పష్టమైన ప్రశ్నార్థక సూచిక లేదు. అయినా సందర్భంలో యెజెబెలు అహాబు నిష్క్రియతను మందలిస్తున్నందున వ్యంగ్యార్థక ప్రశ్న సహజం; మూలంలోని వ్యాకరణ సందిగ్ధతను పాదటిప్పణి కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘రాజుగా పరిపాలిస్తున్నది నువ్వే కదా?’ అనే రూపం యెజెబెలు ఎద్దేవా స్వరాన్ని అందిస్తూనే, ప్రత్యామ్నాయ ప్రకటన పఠనాన్ని పాదటిప్పణిలో కాపాడుతుంది. మూలంలోని ‘హృదయం’ భావాన్ని తెలుగులో సహజమైన ‘మనసు’తో వ్యక్తం చేసింది.
