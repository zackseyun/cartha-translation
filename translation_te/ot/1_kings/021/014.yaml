revisions:
- from: అప్పుడు వారు యెజెబెలుకు, “నాబోతు రాళ్లతో కొట్టబడ్డాడు; అతడు చనిపోయాడు” అని కబురు పంపారు.
  to: అప్పుడు వారు యెజెబెలుకు, “నాబోతు రాళ్లతో కొట్టబడ్డాడు; చనిపోయాడు” అని సందేశం పంపారు.
  rationale: The revision improves modern-standard Telugu register and flow while preserving the Hebrew’s passive ‘was stoned’ followed by the separate sequential statement ‘and he died.’ No theological or interpretive change is made.
