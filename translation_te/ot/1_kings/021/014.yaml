id: 1KI.21.14
reference: 1 Kings 21:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּשְׁלְח֖וּ אֶל אִיזֶ֣בֶל לֵ/אמֹ֑ר סֻקַּ֥ל נָב֖וֹת וַ/יָּמֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/014.yaml
  text: Then they sent word to Jezebel[a], saying, “Naboth has been stoned and is dead.”
translation:
  language: te
  text: అప్పుడు వారు యెజెబెలుకు, “నాబోతు రాళ్లతో కొట్టబడ్డాడు; చనిపోయాడు” అని సందేశం పంపారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: అప్పుడు వారు ... కబురు పంపారు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది కాబట్టి ‘అప్పుడు’ సహజం. తరువాత వచ్చే לֵאמֹר సందేశవిషయాన్ని పరిచయం చేస్తున్నందున, సందర్భానుసారంగా ‘కబురు పంపారు’ అని అనువదించాం.
- source_word: אֶל אִיזֶבֶל
  choice: యెజెబెలుకు
  rationale: దిశను సూచించే אֶל ను తెలుగులో చతుర్థీ విభక్తితో సహజంగా వ్యక్తపరిచాం; వ్యక్తినామాన్ని ప్రాచుర్యంలో ఉన్న తెలుగు రూపంలో లిప్యంతరీకరించాం.
- source_word: לֵאמֹר
  choice: … అని
  rationale: హీబ్రూ నివేదిక సూత్రాన్ని తెలుగులో ప్రత్యక్ష వాక్యాన్ని ముగించే సహజమైన ‘అని’ రూపంతో వ్యక్తపరిచాం.
- source_word: סֻקַּל
  choice: రాళ్లతో కొట్టబడ్డాడు
  rationale: పుయల్ రూపంలోని కర్మణి అర్థాన్ని నిలిపి, మరణశిక్ష విధానమైన రాళ్లతో కొట్టడాన్ని స్పష్టంగా తెలిపాం. ఈ క్రియలోనే ‘చంపడం’ అని చేర్చలేదు, ఎందుకంటే మరణం తరువాతి క్రియలో ప్రత్యేకంగా చెప్పబడింది.
- source_word: נָבוֹת
  choice: నాబోతు
  rationale: వ్యక్తినామాన్ని ప్రాచుర్యంలో ఉన్న తెలుగు బైబిలు రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וַיָּמֹת
  choice: అతడు చనిపోయాడు
  rationale: హీబ్రూలోని క్రమానుసార క్రియను ఫలితస్థితిగా మార్చకుండా, ‘అతడు చనిపోయాడు’ అని నేరుగా అనువదించాం; దీనివల్ల రెండు వేర్వేరు క్రియల నిర్మాణం నిలుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలి వాడబడింది. ‘రాళ్లతో కొట్టబడ్డాడు; అతడు చనిపోయాడు’ అనే నిర్మాణం మూలంలోని కర్మణి క్రియను, తరువాతి మరణక్రియను విడివిడిగా నిలుపుతూ సాధారణ పాఠకుడికి స్పష్టంగా ఉంటుంది.
