review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the narrative sequence: they sent a message to Jezebel, Naboth was subjected to stoning, and he died. The passive sense of סֻקַּל and the distinct following verb וַיָּמֹת are retained.'
  naturalness: ‘కబురు పంపారు’ is understandable but somewhat colloquial for the narrative register. ‘సందేశం పంపారు’ is more natural in modern standard Telugu. Omitting the repeated pronoun in the second clause makes the reported message more idiomatic without losing the Hebrew subject reference.
  terminology: ‘యెజెబెలు’ and ‘నాబోతు’ are appropriate established Telugu biblical name forms. ‘రాళ్లతో కొట్టబడ్డాడు’ preserves the passive and avoids importing ‘చంపబడ్డాడు’ into the first verb, since death is separately stated afterward.
  issues:
  - severity: low
    issue: Register of ‘కబురు పంపారు’
    rationale: The expression is valid, but ‘సందేశం పంపారు’ better suits a formal biblical narrative in modern standard Telugu.
  - severity: low
    issue: Repeated pronoun ‘అతడు’ in the reported message
    rationale: It is not incorrect, but Telugu naturally permits omission here; the subject remains unambiguous from ‘నాబోతు.’
  revised_text: అప్పుడు వారు యెజెబెలుకు, “నాబోతు రాళ్లతో కొట్టబడ్డాడు; చనిపోయాడు” అని సందేశం పంపారు.
  revised_footnotes: []
  revision_rationale: The revision improves modern-standard Telugu register and flow while preserving the Hebrew’s passive ‘was stoned’ followed by the separate sequential statement ‘and he died.’ No theological or interpretive change is made.
