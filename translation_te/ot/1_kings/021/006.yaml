- from: 'అతడు ఆమెతో ఇలా అన్నాడు: “ఎందుకంటే నేను యిజ్రెయేలీయుడైన నాబోతుతో మాట్లాడి, ‘నీ ద్రాక్షతోటను డబ్బుకు[a] నాకు ఇవ్వు; లేదా, నీకు ఇష్టమైతే, దానికి బదులుగా నీకు మరొక ద్రాక్షతోట ఇస్తాను’ అని చెప్పాను. కాని అతడు, ‘నా ద్రాక్షతోటను నీకు ఇవ్వను’ అన్నాడు.”'
  to: 'అతడు ఆమెతో ఇలా అన్నాడు: “నేను యిజ్రెయేలీయుడైన నాబోతుతో మాట్లాడి, ‘వెండి ఇచ్చి నీ ద్రాక్షతోటను నాకు ఇవ్వు; లేదా, నీకు ఇష్టమైతే, దానికి బదులుగా నీకు ఒక ద్రాక్షతోట ఇస్తాను’ అని చెప్పాను. కానీ అతడు, ‘నా ద్రాక్షతోటను నీకు ఇవ్వను’ అన్నాడు.”'
  rationale: The revision retains the complete reported exchange and Naboth’s concise refusal. It restores the specific payment term “silver” in natural Telugu (“వెండి ఇచ్చి”) and removes an unnaturally positioned literal equivalent of כִּי. Since the source connective can function as an explanatory discourse introducer, this does not remove a necessary semantic element or impose an interpretation.
