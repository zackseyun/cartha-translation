  text: וַ/יְדַבֵּ֣ר אֵלֶ֗י/הָ כִּֽי אֲ֠דַבֵּר אֶל נָב֨וֹת הַ/יִּזְרְעֵאלִ֜י וָ/אֹ֣מַר ל֗/וֹ תְּנָ/ה לִּ֤/י אֶֽת כַּרְמְ/ךָ֙ בְּ/כֶ֔סֶף א֚וֹ אִם חָפֵ֣ץ אַתָּ֔ה אֶתְּנָה לְ/ךָ֥ כֶ֖רֶם תַּחְתָּ֑י/ו וַ/יֹּ֕אמֶר לֹֽא אֶתֵּ֥ן לְ/ךָ֖ אֶת כַּרְמִֽ/י־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/006.yaml
  text: And he spoke to her, because I spoke to Naboth the Jezreelite and said to him, ‘Give me your vineyard for silver, or, if you prefer, I will give you a vineyard in place of it,’ but he said, ‘I will not give you my vineyard.’
translation:
  language: te
  text: 'అతడు ఆమెతో ఇలా అన్నాడు: “నేను యిజ్రెయేలీయుడైన నాబోతుతో మాట్లాడి, ‘వెండి ఇచ్చి నీ ద్రాక్షతోటను నాకు ఇవ్వు; లేదా, నీకు ఇష్టమైతే, దానికి బదులుగా నీకు ఒక ద్రాక్షతోట ఇస్తాను’ అని చెప్పాను. కానీ అతడు, ‘నా ద్రాక్షతోటను నీకు ఇవ్వను’ అన్నాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֶּסֶף
  choice: డబ్బు
  rationale: మూలపదానికి అక్షరార్థం ‘వెండి’; ఈ సందర్భంలో అది చెల్లింపు సాధనాన్ని సూచిస్తున్నందున ఆధునిక పాఠకులకు సహజంగా ‘డబ్బు’ అని అనువదించి, అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: חָפֵץ
  choice: ఇష్టమైతే
  rationale: ఇక్కడ నాబోతు కోరుకోవడం లేదా సమ్మతించడాన్ని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: תַחְתָּיו
  choice: దానికి బదులుగా
  rationale: ప్రతిస్థాపన భావాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: כִּי అనే సంధిపదం యొక్క భావం
  choice: ఎందుకంటే
  alternative: అని / పాదాన్ని సంధిపదం లేకుండా ప్రారంభించడం
  rationale: మసోరెటిక్ పాఠంలో ఉన్న కారణార్థక రూపాన్ని నిలుపుతూ, మునుపటి వచనంలో యెజెబెలు అడిగిన ప్రశ్నకు అహాబు ఇచ్చిన సమాధానంగా పాఠాన్ని చూపుతుంది.
- issue: నాబోతు నిరాకరణను అహాబు సంక్షిప్తంగా చెప్పడం
  choice: ‘నా ద్రాక్షతోటను నీకు ఇవ్వను’ అని మాత్రమే ఉంచడం
  alternative: పూర్వీకుల స్వాస్థ్యానికి సంబంధించిన నాబోతు కారణాన్ని 21:3 నుండి ఇక్కడ చేర్చడం
  rationale: ఈ వచనంలో అహాబు నాబోతు మాటలను సంక్షిప్తంగా నివేదిస్తున్నాడు; మూలపాఠంలో లేని కారణాన్ని చేర్చకుండా కథనంలోని ఉద్దేశపూర్వక ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే కథనశైలి. ప్రత్యక్ష సంభాషణల అంతర్గత ఉల్లేఖనాలను స్పష్టంగా ఉంచాం.
