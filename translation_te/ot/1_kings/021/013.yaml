source:
  edition: WLC
  text: וַ֠/יָּבֹאוּ שְׁנֵ֨י הָ/אֲנָשִׁ֥ים בְּנֵֽי בְלִיַּעַל֮ וַ/יֵּשְׁב֣וּ נֶגְדּ/וֹ֒ וַ/יְעִדֻ/הוּ֩ אַנְשֵׁ֨י הַ/בְּלִיַּ֜עַל אֶת נָב֗וֹת נֶ֤גֶד הָ/עָם֙ לֵ/אמֹ֔ר בֵּרַ֥ךְ נָב֛וֹת אֱלֹהִ֖ים וָ/מֶ֑לֶךְ וַ/יֹּצִאֻ֨/הוּ֙ מִ/ח֣וּץ לָ/עִ֔יר וַ/יִּסְקְלֻ֥/הוּ בָ/אֲבָנִ֖ים וַ/יָּמֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/013.yaml
  text: Then the two worthless men came in and sat opposite him[a], and the worthless men testified against Naboth before the people, saying, “Naboth cursed God and the king.” So they brought him outside the city and stoned him with stones[b], and he died.
translation:
  language: te
  text: అప్పుడు ఆ ఇద్దరు దుష్టులు వచ్చి నాబోతుకు ఎదురుగా కూర్చున్నారు.[a] ఆ దుష్టులు ప్రజల సమక్షంలో నాబోతుకు వ్యతిరేకంగా సాక్ష్యమిస్తూ, “నాబోతు దేవుణ్ణీ రాజునూ శపించాడు” అని చెప్పారు.[b] అప్పుడు వారు అతణ్ణి పట్టణం వెలుపలికి తీసుకెళ్లి, రాళ్లతో కొట్టారు; అతడు చనిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో పదశః ‘బెలీయాలు కుమారులు’ లేదా ‘బెలీయాలు మనుషులు’ అనే వ్యక్తీకరణలు; ఇవి నీచులైన లేదా దుర్మార్గులైన మనుషులను సూచించే నానుడి.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో పదశః ‘ఆశీర్వదించాడు’; ఇక్కడ ‘శపించాడు’ అనే భావంలో గౌరవసూచక ప్రత్యామ్నాయ పదంగా వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי בְלִיַּעַל / אַנְשֵׁי הַבְּלִיַּעַל
  choice: దుష్టులు
  rationale: ఇది శారీరక వంశాన్ని సూచించని హీబ్రూ నానుడి; నీచులు, దుర్మార్గులు లేదా చట్టవిరోధులు అనే నైతిక భావం ఇస్తుంది. ఆధునిక తెలుగులో ‘దుష్టులు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: נֶגְדּוֹ
  choice: నాబోతుకు ఎదురుగా
  rationale: ఈ పదం నాబోతును ఎదుర్కొనే స్థానాన్ని సూచిస్తుంది. సర్వనామపు అస్పష్టతను నివారించేందుకు తెలుగులో పేరును పునరుక్తి చేశాం.
- source_word: וַיְעִדֻהוּ
  choice: నాబోతుకు వ్యతిరేకంగా సాక్ష్యమిస్తూ
  rationale: హిఫిల్ రూపం ఇక్కడ న్యాయపరమైన ప్రతికూల సాక్ష్యాన్ని సూచిస్తుంది; ‘సాక్ష్యమిస్తూ’ ఆ అధికారిక సందర్భాన్ని నిలుపుతుంది.
- source_word: נֶגֶד הָעָם
  choice: ప్రజల సమక్షంలో
  rationale: ఆరోపణ బహిరంగంగా ప్రజల ముందు చేయబడిందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בֵּרַךְ
  choice: దూషించాడు
  rationale: పదరూపంగా ‘ఆశీర్వదించాడు’ అయినా, ఇక్కడ దేవదూషణ ఆరోపణలో గౌరవసూచక ప్రత్యామ్నాయ ప్రయోగంగా ‘శపించాడు/దూషించాడు’ అనే అర్థం. దేవుణ్ణీ రాజునూ ఉద్దేశించిన ఆరోపణకు ‘దూషించాడు’ సహజంగా సరిపోతుంది.
- source_word: אֱלֹהִים
  choice: దేవుణ్ణి
  rationale: ఇశ్రాయేలీయ న్యాయసందర్భంలో ఏకవచనంగా ఇశ్రాయేలు దేవుణ్ణే సూచిస్తుంది.
- source_word: וָמֶלֶךְ
  choice: రాజునూ
  rationale: దేవుడు, రాజు—ఇద్దరూ ఆరోపిత దూషణకు కర్మలని తెలుగు సముచ్చయ నిర్మాణం స్పష్టం చేస్తుంది.
- source_word: וַיֹּצִאֻהוּ מִחוּץ לָעִיר
  choice: అతణ్ణి పట్టణం వెలుపలికి తీసుకెళ్లి
  rationale: శిక్ష అమలు కోసం నాబోతును పట్టణం బయటకు తీసుకెళ్లారనే కదలికను సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּסְקְלֻהוּ בָאֲבָנִים וַיָּמֹת
  choice: రాళ్లతో కొట్టి చంపారు
  rationale: హీబ్రూలోని రాళ్లతో కొట్టడం మరియు అతడు మరణించడం అనే వరుస ఫలితాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది; మరణం ఉద్దేశించిన రాళ్ల శిక్ష అని సందర్భం స్పష్టం చేస్తుంది.
theological_decisions:
- issue: దేవదూషణ ఆరోపణలో בֵּרַךְ అనే గౌరవసూచక ప్రత్యామ్నాయ క్రియను అనువదించడం
  choice: ప్రధాన పాఠ్యంలో సందర్భార్థం ప్రకారం ‘దూషించాడు’
  alternative: పదశః ‘ఆశీర్వదించాడు’ అని అనువదించి, అది ‘దూషించాడు’ అనే భావంలోని గౌరవసూచక ప్రత్యామ్నాయమని పాదసూచికలో చెప్పడం
  rationale: ఆరోపణ యొక్క నిజమైన భావం నాబోతు దేవుణ్ణీ రాజునూ దూషించాడనేది. పదశః రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచితే ఆధునిక పాఠకునికి విరుద్ధార్థం కలుగుతుంది; పాదసూచిక మూలరూపాన్ని పారదర్శకంగా భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే కథనశైలి. న్యాయపరమైన సందర్భాన్ని ‘వ్యతిరేకంగా సాక్ష్యమిస్తూ’ ద్వారా నిలిపాం. ‘రాళ్లతో కొట్టి చంపారు’ అనేది తెలుగు సహజత్వం కోసం చివరి రెండు హీబ్రూ క్రియలను ఒక ఫలిత నిర్మాణంగా కలుపుతుంది.
