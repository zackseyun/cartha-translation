  rationale: 'The revision preserves the source’s legal and narrative sequence more closely: the allegation is rendered with the specific sense “cursed,” and the stoning is followed by the explicit result that Naboth died. The footnotes continue to document both Hebrew idioms and have been made clearer in modern Telugu.'
