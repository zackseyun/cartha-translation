  text: וַ/יְהִ֛י כִּ/שְׁמֹ֥עַ אַחְאָ֖ב כִּ֣י מֵ֣ת נָב֑וֹת וַ/יָּ֣קָם אַחְאָ֗ב לָ/רֶ֛דֶת אֶל כֶּ֛רֶם נָב֥וֹת הַ/יִּזְרְעֵאלִ֖י לְ/רִשְׁתּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/016.yaml
  text: And when Ahab heard that Naboth was dead[a], Ahab arose to go down to the vineyard of Naboth the Jezreelite[b], to take possession of it.
translation:
  language: te
  text: నాబోతు చనిపోయాడని[a] అహాబు విన్నప్పుడు, అహాబు లేచి యెజ్రెయేలీయుడైన నాబోతు ద్రాక్షతోటను స్వాధీనం చేసుకోవడానికి[b] దిగివెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చనిపోయి ఉన్నాడని.’ హీబ్రూ రూపం పూర్తయిన సంఘటనను (‘చనిపోయాడు’) లేదా దాని ఫలిత స్థితిని (‘చనిపోయి ఉన్నాడు’) సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దానిని తన వశం చేసుకోవడానికి,’ ‘దానిని వారసత్వంగా పొందడానికి.’ హీబ్రూ క్రియ సందర్భాన్ని బట్టి స్వాధీనం చేసుకోవడం, కలిగి ఉండడం లేదా వారసత్వంగా పొందడం అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: విన్నప్పుడు
  rationale: היה తో కూడిన వావ్ కథన మార్పును సూచిస్తుంది; כ + שמע infinitive construct కాలసంబంధ ఉపవాక్యాన్ని ఏర్పరుస్తుంది. ఆధునిక తెలుగులో ‘విన్నప్పుడు’ ఈ రెండింటి కథన కార్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מֵת
  choice: చనిపోయాడని
  rationale: מות యొక్క qatal రూపం పూర్తయిన మరణ సంఘటనను లేదా దాని ఫలిత స్థితిని సూచించగలదు. సందర్భంలో అహాబు విన్న సమాచారం సహజ తెలుగులో ‘చనిపోయాడని’గా వ్యక్తమవుతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום కథనంలో తదుపరి నిర్ణయాత్మక చర్యకు లేవడాన్ని సూచిస్తుంది. ‘లేచి’ మూలంలోని కదలికను సంక్షిప్తంగా, గౌరవప్రదంగా నిలుపుతుంది.
- source_word: לָרֶדֶת
  choice: దిగివెళ్లాడు
  rationale: ירד లోని కిందికి వెళ్లే దిశాభావాన్ని ‘దిగివెళ్లాడు’ స్పష్టంగా కాపాడుతుంది.
- source_word: כֶּרֶם
  choice: ద్రాక్షతోట
  rationale: తెలుగులో vineyard కు సాధారణమైన, స్పష్టమైన సమానార్థకం.
- source_word: הַיִּזְרְעֵאלִי
  choice: యెజ్రెయేలీయుడైన
  rationale: ఈ gentilic రూపం నాబోతును యెజ్రెయేలుకు చెందినవాడిగా గుర్తిస్తుంది; తెలుగు విశేషణ రూపం సహజంగా ఉంటుంది.
- source_word: לְרִשְׁתּוֹ
  choice: దానిని స్వాధీనం చేసుకోవడానికి
  rationale: ירשׁ సందర్భానుసారం స్వాధీనం చేసుకోవడం, కలిగి ఉండడం, వారసత్వంగా పొందడం అనే అర్థాలు కలిగి ఉంటుంది. ఇక్కడ అహాబు తోటపై అధికారం చేపట్టడానికి వెళ్లడాన్ని ‘స్వాధీనం చేసుకోవడం’ తెలియజేస్తుంది; క్రియలోనే ‘బలవంతంగా లాక్కోవడం’ అనే అదనపు భావాన్ని చేర్చదు.
