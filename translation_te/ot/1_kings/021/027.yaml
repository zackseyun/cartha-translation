base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/027.yaml
  text: And it happened[a], when Ahab heard these words, that he tore his clothes and put sackcloth on his flesh and fasted and lay in sackcloth and went about softly.
translation:
  language: te
  text: అహాబు ఈ మాటలు విన్నప్పుడు, తన బట్టలు చింపుకొని, తన శరీరంపై గోనెపట్ట వేసుకొని, ఉపవాసం ఉండి, గోనెపట్ట ధరించి పడుకొని, మెల్లగా తిరిగాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మౌనంగా తిరిగాడు,” “అణిగినట్లుగా తిరిగాడు.” హీబ్రూ పదం మృదువైన, నెమ్మదైన లేదా అణిగిన ప్రవర్తనను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: విన్నప్పుడు
  rationale: וַיְהִי అనే హీబ్రూ కథన సూత్రాన్ని తెలుగులో విడిగా అనువదిస్తే వాక్యం కృత్రిమంగా ఉంటుంది; కాలసూచక భావాన్ని సహజంగా ‘విన్నప్పుడు’లో కలిపాం.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ఈ మాటలు
  rationale: ఇక్కడ ఏలీయా పలికిన తీర్పు మాటలు ఉద్దేశించబడ్డాయి; అందువల్ల דְּבָרִים యొక్క వాచిక భావాన్ని ‘మాటలు’ నిలుపుతుంది.
- source_word: וַיִּקְרַע בְּגָדָיו
  choice: తన బట్టలు చింపుకొని
  rationale: దుఃఖానికి సూచనగా బట్టలు చింపుకోవడాన్ని ఆధునిక, సహజమైన తెలుగులో నేరుగా తెలిపింది.
- source_word: וַיָּשֶׂם שַׂק עַל בְּשָׂרוֹ
  choice: తన శరీరంపై గోనెపట్ట కట్టుకొని
  rationale: שַׂק అనేది దుఃఖ సూచకమైన ముతక గోనె వస్త్రం; עַל בְּשָׂרוֹ దానిని శరీరానికి నేరుగా ధరించిన స్పష్టమైన చిత్రాన్ని ఇస్తుంది. తెలుగులో ‘కట్టుకొని’ ధరించడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיָּצֹם
  choice: ఉపవాసం ఉండి
  rationale: צוּם యొక్క సూటి, సాధారణ తెలుగు అనువాదం.
- source_word: וַיִּשְׁכַּב בַּשָּׂק
  choice: గోనెపట్టలో పడుకొని
  rationale: שׁכב పడుకోవడం లేదా పండుకోవడం అని సూచిస్తుంది; నిద్రపోయాడని అదనంగా నిర్ధారించకుండా శరీర భంగిమను నిలుపుతుంది.
- source_word: וַיְהַלֵּךְ אַט
  choice: అణకువగా తిరిగాడు
  rationale: אַט నెమ్మదైన, మృదువైన, అణిగిన నడవడిని సూచిస్తుంది. సందర్భంలోని తనను తాను తగ్గించుకున్న ప్రవర్తనను ‘అణకువగా’ సహజంగా అందిస్తుంది; పదంలోని పరిధిని పాదటిప్పణి వివరిస్తుంది.
theological_decisions:
- issue: అహాబు స్పందన స్వభావం
  choice: బాహ్య దుఃఖం, తనను తాను తగ్గించుకోవడాన్ని తెలిపే క్రియలను మాత్రమే వర్ణించడం
  alternative: అహాబు నిజంగా పశ్చాత్తాపపడ్డాడని లేదా కేవలం నటించాడని స్పష్టంగా తీర్పు చెప్పడం
  rationale: హీబ్రూ వచనం బట్టలు చింపుకోవడం, గోనెపట్ట ధరించడం, ఉపవాసం ఉండడం, గోనెపట్టలో పడుకోవడం, అణిగిన విధంగా తిరగడం అనే చర్యలను మాత్రమే నివేదిస్తుంది. అతని అంతరంగ నిజాయితీని ఈ వచనం తేల్చదు; అనువాదం ఆ ఉద్వేగాన్ని అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే దుఃఖాచారాల గంభీరతను నిలిపే పదజాలం వాడబడింది. ‘గోనెపట్ట’ అనే బైబిలు-సందర్భ పదం స్పష్టత కోసం ఉంచబడింది.
