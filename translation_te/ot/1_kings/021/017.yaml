  text: Then the word of Yahweh came to Elijah the Tishbite[a], saying,
translation:
  language: te
  text: 'అప్పుడు[a] యాహ్వే వాక్కు తిష్బీయుడైన ఏలీయాకు వచ్చి ఇలా చెప్పింది:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “అది జరిగింది: యాహ్వే వాక్కు తిష్బీయుడైన ఏలీయాకు వచ్చి ఇలా చెప్పింది:”'
    reason: וַיְהִי యొక్క కథన-ప్రారంభ ప్రత్యామ్నాయాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: וַיְהִי
  choice: అప్పుడు ... వచ్చింది
  rationale: వావ్-క్రమ రూపం కథనంలోని తదుపరి సంఘటనను సూచిస్తుంది. తెలుగు కథనశైలిలో ‘అప్పుడు ... వచ్చింది’ సహజంగా కాలక్రమాన్ని తెలియజేస్తుంది.
- source_word: דְּבַר יְהוָה
  choice: యెహోవా వాక్కు
  rationale: ఇది ప్రవచన వాక్యాలకు వాడే స్థిరమైన సూత్రప్రయోగం. ‘వాక్కు’ దైవిక ప్రకటన అనే భావాన్ని కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో వ్యక్తిగత నామంగా అందిస్తుంది.
- source_word: אֶל
  choice: ఏలీయాకు
  rationale: మాట లేదా ప్రకటన ఒక వ్యక్తికి చేరడాన్ని తెలుగులో చతుర్థీ విభక్తితో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֵלִיָּהוּ
  choice: ఏలీయా
  rationale: వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న రూపాన్ని ఉపయోగించింది.
- source_word: הַתִּשְׁבִּי
  choice: తిష్బీయుడైన
  rationale: హీబ్రూ నివాస/వంశ సంబంధ విశేషణంలోని సంక్షిప్తతను కాపాడుతూ, సహజమైన తెలుగు విశేషణ రూపాన్ని ఇస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా చెప్పింది
  rationale: తరువాత వచ్చే ప్రత్యక్ష దైవవాక్యాన్ని పరిచయం చేసే హీబ్రూ క్రియావిశేష రూపాన్ని తెలుగులో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; దానిని బిరుదుగా మార్చకుండా తెలుగులో పరిచితమైన నామరూపంతో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవభరితమైన బైబిలు కథనశైలిని అనుసరించింది. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుకరించకుండా దాని భావం, ప్రవచన సూత్రప్రయోగం నిలుపబడ్డాయి.
