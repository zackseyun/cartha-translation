source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אַחְאָב֙ אֶל אֵ֣לִיָּ֔הוּ הַֽ/מְצָאתַ֖/נִי אֹיְבִ֑/י וַ/יֹּ֣אמֶר מָצָ֔אתִי יַ֚עַן הִתְמַכֶּרְ/ךָ֔ לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/020.yaml
  text: Ahab said to Elijah[a], “Have you found me, O my enemy?” And he said, “I have found you, because you have sold yourself to do what is evil in the eyes of Yahweh.”
translation:
  language: te
  text: అహాబు ఏలీయాతో, “నా శత్రువా, నన్ను కనుగొన్నావా?” అన్నాడు. ఏలీయా, “నిన్ను కనుగొన్నాను. ఎందుకంటే యహ్వే[a] దృష్టిలో చెడు చేయడానికి నిన్ను నీవే అమ్ముకున్నావు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘YHWH.’ సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు; ‘యహ్వే,’ ‘యెహోవా’ లిప్యంతరీకరణ రూపాలు.'
    reason: దైవనామానికి ఉన్న సంప్రదాయ అనువాదాన్ని, అలాగే ప్రత్యామ్నాయ లిప్యంతరీకరణ రూపాలను తెలియజేయడం.
lexical_decisions:
- source_word: הַמְצָאתַנִי
  choice: నన్ను కనిపెట్టావా?
  rationale: מצא అనే క్రియను నేరుగా, సహజమైన తెలుగులో అందిస్తూ అహాబు ప్రశ్నలోని ఎదుర్కొనే స్వరాన్ని నిలుపుతుంది.
- source_word: אֹיְבִי
  choice: నా శత్రువా
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయాన్ని, సంబోధన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: מָצָאתִי
  choice: నిన్ను కనిపెట్టాను
  rationale: ముందటి ప్రశ్నలోని מצא క్రియను అదే పదంతో పునరావృతం చేసి సంభాషణలోని శబ్దప్రతిధ్వనిని కాపాడుతుంది.
- source_word: יַעַן
  choice: ఎందుకంటే
  rationale: ఏలీయా అహాబును కనిపెట్టిన కారణాన్ని పరిచయం చేసే హేతువాచక భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: הִתְמַכֶּרְךָ
  choice: నిన్ను నీవే అమ్ముకున్నావు
  rationale: מכר హిత్పయేల్ రూపంలోని ఆత్మార్థకమైన ‘తనను తాను అమ్ముకోవడం’ అనే బలమైన రూపకాన్ని సడలించకుండా నిలుపుతుంది.
- source_word: לַעֲשׂוֹת הָרַע
  choice: చెడ్డది చేయడానికి
  rationale: చెడును ఆచరించడాన్ని సూచించే హీబ్రూ ప్రయోగాన్ని సహజమైన, సాధారణ తెలుగులో అందిస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యహ్వే దృష్టిలో
  rationale: దేవుని నైతిక మదింపును సూచించే ‘కళ్లలో’ అనే హీబ్రూ నుడికారాన్ని తెలుగులో సహజమైన ‘దృష్టిలో’తో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామం YHWHను బిరుదుతో భర్తీ చేయకుండా పేరుగా లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో దైవనామం నేరుగా ఉంది. అందువల్ల దాని వ్యక్తినామ స్వభావాన్ని నిలుపుతూ ‘యహ్వే’ అని ఇచ్చి, సంప్రదాయ రూపాలను పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘నా శత్రువా’ సంబోధనలోని ఘర్షణను, ‘కనిపెట్టావా/కనిపెట్టాను’ మూలంలోని క్రియాపునరావృతిని, ‘నిన్ను నీవే అమ్ముకున్నావు’ అనే గాఢమైన రూపకాన్ని నిలుపుకున్నాం.
