id: 1KI.21.8
reference: 1 Kings 21:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תִּכְתֹּ֤ב סְפָרִים֙ בְּ/שֵׁ֣ם אַחְאָ֔ב וַ/תַּחְתֹּ֖ם בְּ/חֹתָמ֑/וֹ וַ/תִּשְׁלַ֣ח ה/ספרים אֶל הַ/זְקֵנִ֤ים וְ/אֶל הַֽ/חֹרִים֙ אֲשֶׁ֣ר בְּ/עִיר֔/וֹ הַ/יֹּשְׁבִ֖ים אֶת נָבֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/008.yaml
  text: So she wrote letters in Ahab’s name[a], sealed them with his seal, and sent the letters to the elders and to the nobles who were in his city, who were living with Naboth.
translation:
  language: te
  text: అప్పుడు ఆమె అహాబు పేరుతో ఉత్తరాలు రాసి, అతని ముద్రతో వాటికి ముద్ర వేసి, నాబోతుతో పాటు నివసిస్తున్న అతని పట్టణంలోని[a] పెద్దలకు, ప్రముఖులకు ఆ ఉత్తరాలు పంపింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అహాబు పట్టణంలోని.” “అతని పట్టణం” అనే హీబ్రూ పదంలోని ప్రత్యయం నాబోతును గానీ అహాబును గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: అప్పుడు ఆమె రాసి
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; స్త్రీలింగ ఏకవచన కర్త సందర్భానుసారం యెజెబెలును సూచిస్తుంది.
- source_word: סְפָרִים / הַסְּפָרִים
  choice: ఉత్తరాలు / ఆ ఉత్తరాలు
  rationale: సֵפֶר లిఖిత పత్రాన్ని సూచించగలదు; స్థానిక నాయకులకు పంపిన అధికారిక సమాచార సందర్భంలో ‘ఉత్తరాలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בְּשֵׁם אַחְאָב
  choice: అహాబు పేరుతో
  rationale: అహాబు అధికార ప్రతినిధిగా వ్యవహరించడాన్ని తెలిపే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וַתַּחְתֹּם בְּחֹתָמוֹ
  choice: అతని ముద్రతో వాటికి ముద్ర వేసి
  rationale: అధికారిక ముద్రను పత్రాలకు వేయడమనే క్రియను స్పష్టంగా ఉంచుతుంది; ‘అతని’ అనే ప్రత్యయం అహాబును సూచిస్తుంది.
- source_word: הַזְּקֵנִים
  choice: పెద్దలు
  rationale: పట్టణ సమాజపు పాలనాపరమైన పెద్దలను సూచించే సాధారణ బైబిలు పదప్రయోగం.
- source_word: הַחֹרִים
  choice: ప్రముఖులు
  rationale: חֹרִים ఉన్నత సామాజిక హోదాగలవారిని సూచిస్తుంది; ‘ప్రముఖులు’ ఆధునిక తెలుగులో సహజంగా ఉండి, తప్పనిసరిగా వంశపారంపర్య కులీనత్వాన్ని దిగుమతి చేయదు.
- source_word: אֲשֶׁר בְּעִירוֹ
  choice: అతని పట్టణంలోని
  rationale: 3 పురుష ఏకవచన ప్రత్యయాన్ని ప్రధాన పఠనంలో నాబోతుకు అన్వయిస్తుంది; అయితే అది అహాబును సూచించే అవకాశం పాదటిప్పణిలో నిలుపబడింది.
- source_word: הַיֹּשְׁבִים אֶת נָבוֹת
  choice: నాబోతుతో పాటు నివసిస్తున్న
  rationale: ישב తో אֶת ఇక్కడ నాబోతుతో ఒకే ప్రాంతంలో నివసించడాన్ని సూచిస్తుంది; ‘తో పాటు’ అనేది సహనివాస భావాన్ని వ్యక్తిగత గృహసహవాసంగా తప్పుగా అర్థం చేసుకోకుండా చేస్తుంది.
theological_decisions:
- issue: בְּעִירוֹ లోని పురుష ఏకవచన ప్రత్యయ సూచన
  choice: ‘అతని పట్టణం’ నాబోతు పట్టణాన్ని సూచిస్తుంది
  alternative: ‘అతని పట్టణం’ అహాబు పట్టణాన్ని సూచిస్తుంది
  rationale: తదుపరి ‘నాబోతుతో పాటు నివసిస్తున్న’ అనే పదబంధం స్థానిక నాయకులను నాబోతుతో అనుసంధానిస్తున్నందున ప్రధాన పాఠంలో నాబోతును సూచనగా తీసుకున్నాం. హీబ్రూ ప్రత్యయం అహాబును కూడా సూచించగలదు కాబట్టి ఆ నిజమైన సందిగ్ధతను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్య క్రమం, అధికారిక పత్రవ్యవహార భావం, ప్రత్యయ సూచనలోని సందిగ్ధత సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
