  terminology: “ఉత్తరాలు,” “ముద్ర,” “పెద్దలు,” and “ప్రముఖులు” are suitable contextual equivalents for the Hebrew terms. The names అహాబు and నాబోతు are consistently and recognizably rendered. The footnote clearly preserves the disputed antecedent without over-resolving it.
