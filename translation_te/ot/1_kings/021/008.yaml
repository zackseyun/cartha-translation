  source_fidelity: 'The Telugu accurately renders the sequential actions: Jezebel writes letters under Ahab’s name, seals them with his seal, and sends them to the elders and nobles. It retains the Hebrew ambiguity of the suffix in “his city” through the anchored footnote. “నాబోతుతో పాటు నివసిస్తున్న” appropriately conveys the local/co-resident sense of היֹשְׁבִים אֶת־נָבוֹת without requiring household cohabitation.'
