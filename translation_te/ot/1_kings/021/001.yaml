  yaml_path: translation/ot/1_kings/021/001.yaml
  text: After these things[a], Naboth the Jezreelite had a vineyard in Jezreel, beside the palace of Ahab king of Samaria.
translation:
  language: te
  text: ఈ సంగతుల తర్వాత[a], యెజ్రెయేలీయుడైన నాబోతుకు యెజ్రెయేలులో ఒక ద్రాక్షతోట ఉండేది. అది సమరయ రాజైన అహాబు రాజభవనం పక్కనే ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ సంగతుల తర్వాత, యెజ్రెయేలీయుడైన నాబోతుకు ఒక ద్రాక్షతోట ఉండేది.” హీబ్రూలో స్వామ్యం “నాబోతుకు ... ఉండేది” అనే నిర్మాణంతో వ్యక్తమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: జరిగిన
  rationale: కొత్త కథా ఘట్టాన్ని పరిచయం చేసే హీబ్రూ కథన రూపాన్ని, దానిలో లేని ప్రత్యేకమైన ‘ఇప్పుడు’ అనే కాలసూచక పదాన్ని చేర్చకుండా సహజమైన తెలుగు వాక్య నిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: ఈ సంగతులు జరిగిన తర్వాత
  rationale: హీబ్రూ బహువచన కాలాంతర సూత్రాన్ని సహజంగా, స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: כֶּרֶם
  choice: ద్రాక్షతోట
  rationale: ఈ పదానికి సందర్భానుసారమైన సాధారణ అర్థం.
- source_word: הָיָה לְנָבוֹת
  choice: నాబోతుకు ... ఉండేది
  rationale: హీబ్రూలోని అస్తిత్వాత్మక-స్వామ్య నిర్మాణాన్ని తెలుగులోనూ దగ్గరగా, సహజంగా నిలుపుతుంది.
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: యెజ్రెయేలీయుడైన నాబోతు
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించి, అతని యెజ్రెయేలు సంబంధాన్ని తెలిపే gentilic రూపాన్ని విశేషణంగా అందిస్తుంది.
- source_word: אֲשֶׁר בְּיִזְרְעֶאל
  choice: యెజ్రెయేలులో
  rationale: ద్రాక్షతోట ఉన్న స్థలాన్ని సంక్షిప్తంగా, అర్థనష్టం లేకుండా తెలియజేస్తుంది.
- source_word: אֵצֶל
  choice: పక్కనే
  rationale: సమీపాన్ని తెలిపే మూలపదాన్ని ‘దగ్గర’ కంటే మరింత ఖచ్చితమైన సాన్నిహిత్యంతో వ్యక్తపరుస్తుంది.
- source_word: הֵיכַל
  choice: రాజభవనం
  rationale: రాజసంబంధ సందర్భంలో ఇది దేవాలయం కాక రాజ నివాసాన్ని సూచిస్తుంది.
- source_word: אַחְאָב מֶלֶךְ שֹׁמְרוֹן
  choice: సమరయ రాజైన అహాబు
  rationale: హీబ్రూ సంబంధపదబంధాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంలో అందిస్తుంది.
