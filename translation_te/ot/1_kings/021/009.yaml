  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి వాడబడింది. హెబ్రీయులోని ఆజ్ఞల బహువచన భావాన్ని తెలుగు గౌరవ/బహువచన ఆజ్ఞారూపం నిలుపుతుంది.
