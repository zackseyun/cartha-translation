source:
  edition: WLC
  text: וַ/תִּכְתֹּ֥ב בַּ/סְּפָרִ֖ים לֵ/אמֹ֑ר קִֽרְאוּ צ֔וֹם וְ/הוֹשִׁ֥יבוּ אֶת נָב֖וֹת בְּ/רֹ֥אשׁ הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/009.yaml
  text: She wrote in the letters[a], saying, “Proclaim a fast, and seat Naboth at the head of the people.”
translation:
  language: te
  text: 'ఆమె ఆ ఉత్తరాల్లో ఇలా రాసింది: “ఉపవాసం ప్రకటించి, నాబోతును ప్రజల ముందుభాగంలో[a] కూర్చోబెట్టండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ప్రజల తలవద్ద.” దీన్ని “ప్రజల ముందు” లేదా “ప్రజల మధ్య ప్రముఖ స్థానంలో” అని కూడా అనువదించవచ్చు. ఈ మాట సభలో అందరికీ కనిపించే లేదా నాయకత్వ స్థానాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: ఆమె ... రాసింది
  rationale: כתב క్రియ యొక్క వరుస కథనరూపం తృతీయ పురుష ఏకవచన స్త్రీలింగంలో ఉంది; సందర్భంలో కర్త యెజెబెలు. ఆధునిక తెలుగులో సహజమైన కథనశైలిని అనుసరించి అనువదించబడింది.
- source_word: בַּסְּפָרִים
  choice: ఆ ఉత్తరాల్లో
  rationale: ఇక్కడ סְפָרִים పుస్తకాలు కాక, పట్టణ అధికారులకు పంపిన లిఖిత ఉత్తరాలను సూచిస్తుంది. בְּ ఉపసర్గను సందర్భానుసారంగా ‘ఉత్తరాల్లో’ అని ఇచ్చాం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ఉత్తరాల విషయాన్ని పరిచయం చేసే హెబ్రీయుల ఉద్ధరణ పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఇలా రాసింది’గా వ్యక్తం చేశాం.
- source_word: קִרְאוּ צוֹם
  choice: ఉపవాసం ప్రకటించి
  rationale: ఇది సమాజమంతటికీ సంబంధించిన అధికారిక ఉపవాస ప్రకటన. ‘ఉపవాసం ప్రకటించండి’ అనే భావాన్ని తదుపరి ఆజ్ఞతో సహజంగా కలిపేందుకు ‘ప్రకటించి’ వాడాం.
- source_word: וְהוֹשִׁיבוּ
  choice: కూర్చోబెట్టండి
  rationale: ישב హిఫీల్ ఆజ్ఞారూపంలోని కారక భావాన్ని ‘కూర్చోబెట్టండి’ స్పష్టంగా నిలుపుతుంది.
- source_word: אֶת נָבוֹת
  choice: నాబోతును
  rationale: వ్యక్తిపేరును తెలుగులో సాధారణంగా గుర్తించదగిన రూపంలో లిప్యంతరీకరించి, ప్రత్యక్ష కర్మను ‘ను’తో సూచించాం.
- source_word: בְּרֹאשׁ הָעָם
  choice: ప్రజల ముందు ప్రముఖ స్థానంలో
  rationale: అక్షరార్థంగా ‘ప్రజల తలవద్ద’ అనే ఈ పదబంధం సభలో ముందున్న, అందరికీ కనిపించే లేదా ప్రముఖ స్థానాన్ని సూచించవచ్చు. తెలుగు ప్రధాన పాఠ్యంలో అర్థస్పష్టతతో పాటు ఆ ప్రముఖతను నిలిపాం; ప్రత్యామ్నాయాలు పాదసూచికలో ఇచ్చాం.
