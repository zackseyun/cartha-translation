id: 1KI.21.23
reference: 1 Kings 21:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/גַ֨ם לְ/אִיזֶ֔בֶל דִּבֶּ֥ר יְהוָ֖ה לֵ/אמֹ֑ר הַ/כְּלָבִ֛ים יֹאכְל֥וּ אֶת אִיזֶ֖בֶל בְּ/חֵ֥ל יִזְרְעֶֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/023.yaml
  text: And also concerning Jezebel[a], Yahweh spoke, saying, ‘The dogs will eat Jezebel in the territory of Jezreel.’
translation:
  language: te
  text: 'ఇజెబెలు గురించి కూడా యెహోవా ఇలా చెప్పాడు: “యెజ్రెయేలు ప్రాకారం వద్ద[a] కుక్కలు ఇజెబెలును తింటాయి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యెజ్రెయేలు ప్రాంతంలో.” ఇక్కడి హీబ్రూ పదమైన హేలు అర్థం నిర్ధారించడం కష్టం; అది నగర ప్రాకారాన్ని, కోట వెలుపలి భాగాన్ని, లేదా విస్తృతంగా ఆ స్థలాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: కూడా
  rationale: మునుపటి తీర్పుతో ఈ ప్రవచనాన్ని అనుసంధానిస్తూ, גַם యొక్క అదనపు భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לְאִיזֶבֶל
  choice: ఇజెబెలు గురించి
  rationale: דבר తో వచ్చిన לְ ఇక్కడ ఎవరి గురించి మాట చెప్పబడిందో సూచిస్తుంది; ఇజెబెలే ప్రత్యక్ష శ్రోత అని అనవసరంగా సూచించదు.
- source_word: דִּבֶּר יְהוָה לֵאמֹר
  choice: యెహోవా ఇలా చెప్పాడు
  rationale: హీబ్రూ వాక్యప్రవేశ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; దైవనామాన్ని బిరుదుతో భర్తీ చేయదు.
- source_word: הַכְּלָבִים יֹאכְלוּ
  choice: కుక్కలు ... తింటాయి
  rationale: ప్రవచనాత్మక భవిష్యత్తు భావాన్ని, మూలంలోని సాధారణ ‘తిను’ అనే క్రియను అతిశయింపకుండా నిలుపుతుంది.
- source_word: אֶת אִיזֶבֶל
  choice: ఇజెబెలును
  rationale: ప్రత్యక్ష కర్మను తెలుగు విభక్తితో స్పష్టంగా సూచిస్తుంది.
- source_word: בְּחֵל יִזְרְעֶאל
  choice: యెజ్రెయేలు ప్రాకార ప్రాంతంలో
  rationale: חֵל కు సంభవించే ప్రాకారం లేదా కోట వెలుపలి ప్రాంతం అనే భావాన్ని వ్యక్తం చేస్తుంది; పదంలోని అనిశ్చితిని పాదటిప్పణిలో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో నిలుపుతుంది; దానిని బిరుదుగా మార్చదు.
- issue: לְאִיזֶבֶל తో דִּבֶּר యొక్క సంబంధం
  choice: ఇజెబెలు గురించి
  alternative: ఇజెబెలుతో / ఇజెబెలుకు
  rationale: కథన సందర్భంలో ఇది ఇజెబెలుకు నేరుగా పలికిన మాటకన్నా ఆమెను గూర్చిన దైవతీర్పు అని తెలియజేస్తుంది.
- issue: בְּחֵל יִזְרְעֶאל యొక్క అర్థం
  choice: యెజ్రెయేలు ప్రాకార ప్రాంతంలో
  alternative: యెజ్రెయేలు ప్రాంతంలో
  rationale: חֵל యొక్క నిర్మాణసంబంధ సాధ్యార్థాన్ని ప్రధాన పాఠ్యంలో ఉంచుతూ, దాని విస్తృత స్థలార్థాన్ని పాదటిప్పణిలో ఇచ్చి నిజమైన పదార్థ అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే ప్రవచన తీర్పుకు తగిన గంభీరతతో రూపొందించబడింది.
