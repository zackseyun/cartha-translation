id: 1KI.21.2
reference: 1 Kings 21:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר אַחְאָ֣ב אֶל נָב֣וֹת לֵ/אמֹר֩ תְּנָ/ה לִּ֨/י אֶֽת כַּרְמְ/ךָ֜ וִֽ/יהִי לִ֣/י לְ/גַן יָרָ֗ק כִּ֣י ה֤וּא קָרוֹב֙ אֵ֣צֶל בֵּיתִ֔/י וְ/אֶתְּנָ֤ה לְ/ךָ֙ תַּחְתָּ֔י/ו כֶּ֖רֶם ט֣וֹב מִמֶּ֑/נּוּ אִ֚ם ט֣וֹב בְּ/עֵינֶ֔י/ךָ אֶתְּנָה לְ/ךָ֥ כֶ֖סֶף מְחִ֥יר זֶֽה־׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/002.yaml
  text: And Ahab spoke to Naboth[a], saying, “Give me your vineyard, so that it may become a vegetable garden for me, because it is near my house; and in its place I will give you a better vineyard than it. Or, if it seems good in your eyes, I will give you its price in silver.”
translation:
  language: te
  text: 'అహాబు నాబోతుతో ఇలా అన్నాడు: “నీ ద్రాక్షతోటను నాకు ఇవ్వు. అది నా ఇంటికి దగ్గరగా ఉంది కాబట్టి, దాన్ని నా కూరగాయల తోటగా చేసుకోవడానికి ఇమ్ము. దానికి బదులుగా దానికంటే మంచి ద్రాక్షతోటను నీకు ఇస్తాను. లేదా, నీకు మంచిదనిపిస్తే[a], దాని ధరను వెండిలో నీకు ఇస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నీ కళ్లలో మంచిదైతే”; అంటే “నీకు సమ్మతమైతే” లేదా “నీకు నచ్చితే.”
    reason: హీబ్రూ నుడికారం యొక్క అక్షరార్థ రూపాన్ని, దాని సందర్భార్థాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיְדַבֵּר אַחְאָב אֶל נָבוֹת לֵאמֹר
  choice: అహాబు నాబోతుతో ఇలా అన్నాడు
  rationale: దבר + אֶל అనే సంబోధన నిర్మాణాన్ని సహజమైన తెలుగు కథనశైలిలో వ్యక్తం చేస్తుంది; לֵאמֹר పరిచయం చేసే ప్రత్యక్ష వాక్యాన్ని ‘ఇలా అన్నాడు’ స్పష్టంగా సూచిస్తుంది.
- source_word: תְּנָה לִּי אֶת כַּרְמְךָ
  choice: నీ ద్రాక్షతోటను నాకు ఇవ్వు
  rationale: ఆజ్ఞార్థక క్రియలోని నేరుగా చేసిన అభ్యర్థనను, כֶּרֶם యొక్క సాధారణ అర్థమైన ‘ద్రాక్షతోట’ను యథాతథంగా ఉంచుతుంది.
- source_word: וִיהִי לִי לְגַן יָרָק
  choice: నాకు కూరగాయల తోటగా ఉపయోగపడుతుంది
  rationale: היה రూపంలోని ఉద్దేశ్య/ఫలిత భావాన్ని సహజ తెలుగులో తెలియజేస్తూ, גַן יָרָקను ఆధునికంగా ‘కూరగాయల తోట’గా అనువదిస్తుంది.
- source_word: כִּי הוּא קָרוֹב אֵצֶל בֵּיתִי
  choice: అది నా ఇంటికి దగ్గరగా ఉంది కాబట్టి
  rationale: తోటను కోరడానికి అహాబు చెప్పిన స్థలసంబంధ కారణాన్ని స్పష్టంగా, మూలంలోని కారణార్థక సంబంధంతో అందిస్తుంది.
- source_word: וְאֶתְּנָה לְךָ תַּחְתָּיו כֶּרֶם טוֹב מִמֶּנּוּ
  choice: దానికి బదులుగా దానికంటే మంచి ద్రాక్షతోటను నీకు ఇస్తాను
  rationale: תַּחְתָּיו లోని మార్పిడి భావాన్ని ‘బదులుగా’తో, טוֹב מִמֶּנּוּ లోని తులనాత్మక భావాన్ని ‘దానికంటే మంచి’తో కాపాడుతుంది.
- source_word: אִם טוֹב בְּעֵינֶיךָ
  choice: నీకు మంచిదనిపిస్తే
  rationale: ‘నీ కళ్లలో మంచిదైతే’ అనే హీబ్రూ నుడికారానికి సహజ తెలుగు సమానార్థక రూపం; నాబోతు సమ్మతి లేదా ఆమోదాన్ని సూచిస్తుంది.
- source_word: אֶתְּנָה לְךָ כֶסֶף מְחִיר זֶה
  choice: దాని వెలను వెండిగా నీకు ఇస్తాను
  rationale: כֶסֶףను అప్పటి చెల్లింపు మాధ్యమమైన ‘వెండి’గా ఉంచుతూ, מְחִירలోని ధర/వెల భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథనశైలి వాడబడింది. అహాబు చేసిన ప్రతిపాదనలోని నేరుదనం, మార్పిడి లేదా వెండి చెల్లింపు అనే రెండు ప్రత్యామ్నాయాలు స్పష్టంగా నిలుపబడ్డాయి.
