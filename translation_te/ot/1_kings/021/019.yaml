source:
  edition: WLC
  text: וְ/דִבַּרְתָּ֨ אֵלָ֜י/ו לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הֲ/רָצַ֖חְתָּ וְ/גַם יָרָ֑שְׁתָּ וְ/דִבַּרְתָּ֨ אֵלָ֜י/ו לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה בִּ/מְק֗וֹם אֲשֶׁ֨ר לָקְק֤וּ הַ/כְּלָבִים֙ אֶת דַּ֣ם נָב֔וֹת יָלֹ֧קּוּ הַ/כְּלָבִ֛ים אֶת דָּמְ/ךָ֖ גַּם אָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/019.yaml
  text: 'And you shall speak to him[a], saying, ‘Thus says Yahweh: Have you murdered and also taken possession?’ And you shall speak to him, saying, ‘Thus says Yahweh: In the place where the dogs licked the blood of Naboth[b], the dogs shall lick your blood—you also.’'
translation:
  language: te
  text: 'నీవు అతనితో ఇలా చెప్పాలి: “యెహోవా ఇలా అంటున్నాడు: ‘నీవు హత్య చేసి, దాన్ని కూడా స్వాధీనం చేసుకున్నావా?’” ఇంకా నీవు అతనితో ఇలా చెప్పాలి: “యెహోవా ఇలా అంటున్నాడు: ‘నాబోతు రక్తాన్ని కుక్కలు నాకిన చోటే, కుక్కలు నీ రక్తాన్ని నాకుతాయి—నీదీ కూడా.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: చివరి మాటలను అక్షరార్థంగా, “నీ రక్తాన్ని—నీవు కూడా” అని ఇవ్వవచ్చు. హీబ్రూలోని “నీవు కూడా” అనే ఉద్ఘాటన, నాబోతుకు జరిగిన అదే అవమానకరమైన తీర్పు అహాబుకూ వర్తిస్తుందని బలంగా తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו לֵאמֹר
  choice: నీవు అతనితో ఇలా చెప్పాలి
  rationale: ప్రవక్తకు ఇచ్చిన ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, వచనంలోని రెండుసార్ల పునరుక్తిని నిలిపింది.
- source_word: כֹּה אָמַר יְהוָה
  choice: యెహోవా ఇలా అంటున్నాడు
  rationale: ప్రవక్త సందేశ సూత్రాన్ని సహజంగా నిలిపి, יהוה అనే వ్యక్తిగత నామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: הֲרָצַחְתָּ
  choice: నీవు హత్య చేసి
  rationale: רצח సాధారణంగా చంపడం కంటే అక్రమమైన ప్రాణహత్య భావాన్ని కలిగిస్తుంది; సందర్భంలో అహాబు నాబోతు హత్యకు బాధ్యుడని చేసే నైతిక ఆరోపణను ‘హత్య’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְגַם יָרָשְׁתָּ
  choice: ఆస్తిని కూడా స్వాధీనం చేసుకున్నావా
  rationale: ירש ఇక్కడ నాబోతు ద్రాక్షతోటను తన ఆధీనంలోకి తీసుకోవడాన్ని సూచిస్తుంది. తెలుగులో కర్మ అవసరమైనందున సందర్భానుసారంగా ‘ఆస్తిని’ చేర్చబడింది; ‘వారసత్వం’ అని అతిగా నిర్దిష్టం చేయలేదు.
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: చోటే
  rationale: తీర్పు అదే ప్రదేశంతో ముడిపడి ఉందనే సమాంతరతను సంక్షిప్తంగా, బలంగా తెలియజేస్తుంది.
- source_word: לָקְקוּ ... יָלֹקּוּ
  choice: నాకిన ... నాకుతాయి
  rationale: హీబ్రూలోని ఒకే క్రియను భూత, భవిష్యత్ రూపాల్లో తెలుగులోనూ పునరావృతం చేసి భయానకమైన ప్రవచన సమాంతరతను కాపాడింది.
- source_word: הַכְּלָבִים
  choice: కుక్కలు
  rationale: తీర్పు చిత్రణకు కేంద్రంగా ఉన్న పదాన్ని నేరుగా అనువదించింది.
- source_word: דַּם נָבוֹת
  choice: నాబోతు రక్తాన్ని
  rationale: సంబంధ నిర్మాణాన్ని సహజమైన తెలుగు కర్మరూపంలో ఇచ్చింది.
- source_word: אֶת דָּמְךָ גַּם אָתָּה
  choice: నీ రక్తాన్ని కూడా నాకుతాయి—అవును, నీ రక్తాన్నే
  rationale: గַּם אָתָּהలోని ఆకస్మిక వ్యక్తిగత ఉద్ఘాటనను తెలుగులో స్పష్టంగా నిలిపేందుకు చివర ‘నీ రక్తాన్నే’ అని పునరుద్ఘాటించింది.
theological_decisions:
- issue: הֲרָצַחְתָּలోని నైతిక ఆరోపణ తీవ్రత
  choice: ‘హత్య చేసి’ అని అనువదించడం
  alternative: ‘చంపి’
  rationale: ఈ సందర్భంలో רצח నాబోతుపై జరిగిన అక్రమ ప్రాణహత్యను, దానిలో అహాబు బాధ్యతను సూచిస్తుంది. ‘హత్య’ మూలంలోని నైతిక-న్యాయబద్ధమైన బలాన్ని కాపాడుతుంది.
- issue: గַּם אָתָּה చివరి ఉద్ఘాటన
  choice: ‘నీ రక్తాన్ని కూడా ...—అవును, నీ రక్తాన్నే’ అని ఉద్ఘాటనను నిలపడం
  alternative: ‘నీ రక్తాన్ని కూడా నాకుతాయి’ అని మాత్రమే చెప్పడం
  rationale: హీబ్రూ ముగింపులో అహాబుపై తీర్పు వ్యక్తిగతంగా పడుతుందనే అదనపు ఉద్ఘాటన ఉంది. దానిని సున్నితపరచకుండా తెలుగు వాక్యంలో పునరుద్ఘాటించింది.
- issue: యెహోవా నామం
  choice: יהוהను ‘యెహోవా’గా ఇవ్వడం
  alternative: ‘ప్రభువు’
  rationale: మూలంలో బిరుదు కాక దేవుని వ్యక్తిగత నామం ఉంది; అందువల్ల తెలుగు బైబిల్ పాఠకులకు పరిచితమైన ‘యెహోవా’ రూపాన్ని ఉపయోగించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రవచన శైలిని ఉపయోగించింది. ‘ఇలా చెప్పాలి’ అనే సహజ నిర్మాణంతో ఆజ్ఞను అందించినప్పటికీ, మూలంలోని రెండుసార్ల సందేశ సూత్రాన్ని ఉద్దేశపూర్వకంగా నిలిపింది. ‘స్వాధీనం చేసుకున్నావా’ సాధారణ పాఠకులకు అర్థమయ్యే న్యాయసంబంధ పదప్రయోగం; ముగింపులోని డాష్ హీబ్రూ ఉద్ఘాటనలోని ఆకస్మికతను ప్రతిబింబిస్తుంది.
