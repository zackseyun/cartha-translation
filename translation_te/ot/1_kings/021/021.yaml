source:
  edition: WLC
  text: הִנְ/נִ֨י מבי אֵלֶ֨י/ךָ֙ רָעָ֔ה וּ/בִעַרְתִּ֖י אַחֲרֶ֑י/ךָ וְ/הִכְרַתִּ֤י לְ/אַחְאָב֙ מַשְׁתִּ֣ין בְּ/קִ֔יר וְ/עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/021.yaml
  text: Behold[a], I am bringing disaster upon you, and I will sweep away after you, and I will cut off from Ahab every male, both bond and free in Israel.
translation:
  language: te
  text: “ఇదిగో, నేను నీ మీదికి విపత్తు రప్పిస్తున్నాను. నీ వంశాన్ని తుడిచివేస్తాను. ఇశ్రాయేలులో అహాబుకు చెందిన ప్రతి మగవాణ్ణీ[a]—బంధింపబడినవాణ్ణీ, విడిచిపెట్టబడినవాణ్ణీ[b]—నిర్మూలం చేస్తాను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “గోడకు మూత్రం పోసే ప్రతి వాడు”; ఇది ప్రతి మగవాణ్ణీ సూచించే మొరటైన జాతీయం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలోని ఈ పదజోడు యొక్క ఖచ్చితమైన అర్థం అనిశ్చితం. సందర్భంలో ఎవరూ మినహాయించబడరనే సమగ్ర భావాన్ని ఇది సూచించవచ్చు.
    reason: textual_ambiguity
lexical_decisions:
- source_word: הִנְנִי
  choice: ఇదిగో
  rationale: ప్రవచనాత్మక ప్రకటనలోని గంభీరతను, తక్షణత్వాన్ని సహజమైన తెలుగు పదంతో నిలుపుతుంది.
- source_word: מֵבִיא אֵלֶיךָ רָעָה
  choice: నేను నీ మీదికి విపత్తు రప్పిస్తున్నాను
  rationale: తీర్పు సందర్భంలో רָעָה నైతిక దుష్టత్వాన్ని కాక విపత్తు లేదా కీడును సూచిస్తుంది; ‘నీ మీదికి’ ప్రతికూల ప్రభావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּבִעַרְתִּי אַחֲרֶיךָ
  choice: నీ తరువాతివారిని పూర్తిగా ఊడ్చివేస్తాను
  rationale: అక్షరార్థమైన ‘నీ తరువాత’ అనే భావాన్ని నిలుపుతూ, వంశం లేదా వారసులు అని అతిగా నిర్దిష్టం చేయకుండా నిర్మూలనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהִכְרַתִּי לְאַחְאָב
  choice: అహాబుకు చెందిన ... నిర్మూలం చేస్తాను
  rationale: అహాబు ఇంటికి చెందినవారిని పూర్తిగా తొలగించే తీర్పు సూత్రాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: מַשְׁתִּין בְּקִיר
  choice: ప్రతి మగవాణ్ణీ
  rationale: హీబ్రూలోని మొరటైన జాతీయాన్ని ప్రధాన పాఠ్యంలో సహజమైన అర్థంతో అనువదించి, అక్షరార్థాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
- source_word: וְעָצוּר וְעָזוּב
  choice: నిర్బంధంలో ఉన్నవాణ్ణీ, స్వేచ్ఛగా ఉన్నవాణ్ణీ
  rationale: వివాదాస్పదమైన పదజోడును అందరికీ వర్తించే సమగ్రతగా చూపుతూనే, దాని రెండు భాగాల వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలులో
  rationale: స్థలాన్ని సూచించే సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: దైవిక తీర్పులో רָעָה పదం
  choice: విపత్తు
  alternative: కీడు / చెడు
  rationale: దేవుడు నైతిక చెడు చేస్తున్నాడనే భావాన్ని అనవసరంగా కలిగించకుండా, సందర్భంలోని శిక్షాత్మక విపత్తు తీవ్రతను నిలుపుతుంది.
- issue: וּבִעַרְתִּי אַחֲרֶיךָలో సూచితమైన కర్మ
  choice: నీ తరువాతివారు
  alternative: నీ సంతానం / నీ వంశం
  rationale: సందర్భం అహాబు వంశ నిర్మూలనను సూచించినప్పటికీ, మూలంలోని ‘నీ తరువాత’ అనే కొంత అనిర్దిష్టమైన వ్యక్తీకరణను పూర్తిగా సంతానం అనే ఒక్క అర్థానికి పరిమితం చేయదు.
- issue: וְעָצוּר וְעָזוּב అనే సమగ్ర జంట
  choice: నిర్బంధంలో ఉన్నవాడు, స్వేచ్ఛగా ఉన్నవాడు
  alternative: కాపాడబడినవాడు, విడిచిపెట్టబడినవాడు / బానిస, స్వతంత్రుడు
  rationale: ఈ సూత్రప్రాయ జంట అర్థం వివాదాస్పదం; సమాజంలోని ఏ స్థితిలో ఉన్న మగవాడూ మినహాయించబడడని సూచించే పఠనాన్ని ఎంచుకుని, అనిశ్చితిని పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రవచన తీర్పుకు తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని మొరటైన జాతీయాన్ని ప్రధాన పాఠ్యంలో మర్యాదపూర్వకంగా అర్థానువదించి పాదటిప్పణిలో వెల్లడించాం; వివాదాస్పద పదజోడు అనిశ్చితినీ దాచలేదు.
