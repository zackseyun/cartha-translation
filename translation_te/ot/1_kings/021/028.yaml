source:
  edition: WLC
  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל אֵלִיָּ֥הוּ הַ/תִּשְׁבִּ֖י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/028.yaml
  text: And the word of Yahweh came to Elijah the Tishbite[a], saying,
translation:
  language: te
  text: 'తిష్బీయుడైన ఏలీయాకు యహ్వే[a] వాక్కు వచ్చి ఇలా పలికింది:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘YHWH’; సంప్రదాయంగా ‘ప్రభువు’ అని అనువదిస్తారు.'
    reason: దైవనామానికి సంప్రదాయ ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיְהִי
  choice: వచ్చి
  rationale: దైవిక ప్రకటనను పరిచయం చేసే ויהי דבר־יהוה אל అనే హీబ్రూ సూత్రప్రయోగంలో, ‘వాక్కు వచ్చింది’ అనే భావాన్ని సహజమైన తెలుగులో కొనసాగిస్తుంది.
- source_word: דְּבַר יְהוָה
  choice: యహ్వే వాక్కు
  rationale: דָּבָר కు ‘మాట’ లేదా ‘సందేశం’ అనే అర్థాలు ఉన్నా, ప్రవచన సూత్రప్రయోగంలోని పదార్థాన్ని, గ్రంథాంతర ప్రతిధ్వనిని నిలుపుకోవడానికి ‘వాక్కు’ ఎంచుకోబడింది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామం YHWHను ఒక బిరుదుతో భర్తీ చేయకుండా, వ్యక్తినామంగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֶל
  choice: కు
  rationale: ప్రకటన చేరిన వ్యక్తిని సూచించే దిశార్థక విభక్తిగా సహజమైన తెలుగు రూపం.
- source_word: אֵלִיָּהוּ
  choice: ఏలీయా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: הַתִּשְׁבִּי
  choice: తిష్బీయుడైన
  rationale: ఈ విశేషణాత్మక జనపద గుర్తింపును ఏలీయాకు అన్వయిస్తూ, సంక్షిప్తంగా మరియు సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా పలికింది
  rationale: తరువాతి వచనంలో వచ్చే ప్రత్యక్ష దైవవాక్యాన్ని పరిచయం చేసే క్రియను స్పష్టంగా తెలుపుతూ, వాక్యసరిహద్దు దాటే అనుసంధానాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తినామమైన YHWH నేరుగా ఉంది. అందువల్ల దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా ‘యహ్వే’గా లిప్యంతరీకరించడం మూలంలోని నామ స్వరూపాన్ని కాపాడుతుంది; సంప్రదాయ ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ప్రవచన శైలి. ‘వాక్కు వచ్చి ఇలా పలికింది’ అనే నిర్మాణం హీబ్రూ ప్రకటన సూత్రంలోని రూపకాన్ని నిలుపుతూ, తరువాతి వచనంలోని ప్రత్యక్ష ప్రసంగానికి సహజంగా దారి తీస్తుంది.
