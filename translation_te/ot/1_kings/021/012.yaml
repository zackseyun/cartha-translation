    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ
  choice: ప్రకటించి
  rationale: צוֹם అనే కర్మతో కలిసి ఈ క్రియ బహిరంగంగా ఉపవాసాన్ని ప్రకటించడాన్ని సూచిస్తుంది.
- source_word: צוֹם
  choice: ఉపవాసాన్ని
  rationale: ఇది వ్యక్తిగత ఉపవాసం కాక, ప్రజలు ఆచరించేందుకు అధికారికంగా ప్రకటించిన ఉపవాసాన్ని సూచిస్తుంది.
- source_word: וְהֹשִׁיבוּ
  choice: కూర్చోబెట్టారు
  rationale: ישב క్రియ హిఫీల్ రూపంలో ఒకరిని నిర్ణీత స్థానంలో కూర్చోబెట్టడం అనే కారణార్థక భావాన్ని ఇస్తుంది.
- source_word: אֶת נָבוֹת
  choice: నాబోతును
  rationale: אֶת నేర కర్మను సూచిస్తుంది; నాబోతు అనే పేరును ఆధునిక ప్రామాణిక తెలుగు రూపంలో ఇచ్చాం.
- source_word: בְּרֹאשׁ
  choice: ముందు ముఖ్య స్థానంలో
  rationale: పదబంధం అక్షరార్థంగా ‘తల వద్ద/అగ్రభాగంలో’ అని ఉన్నా, ఇక్కడ సమావేశంలో అందరికీ కనిపించే ప్రముఖ స్థానాన్ని సూచిస్తుంది; తెలుగు సహజత్వంతో పాటు భావంలోని విస్తృతిని నిలుపుతుంది.
- source_word: הָעָם
  choice: ప్రజల
  rationale: సందర్భంలో కూడిన పట్టణ ప్రజలను లేదా ప్రజాసభను సూచిస్తుంది; ‘ప్రజలు’ మూలపదానికి నేరమైన, సహజమైన సమానం.
