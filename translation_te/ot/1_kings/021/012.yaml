translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. בְּרֹאשׁ లోని స్థానం గురించిన అస్పష్టతను ప్రధాన పాఠ్యంలో పూర్తిగా పరిష్కరించకుండా, పాదసూచికలో ప్రత్యామ్నాయాలను ఇచ్చాం.
