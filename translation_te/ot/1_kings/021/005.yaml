id: 1KI.21.5
reference: 1 Kings 21:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תָּבֹ֥א אֵלָ֖י/ו אִיזֶ֣בֶל אִשְׁתּ֑/וֹ וַ/תְּדַבֵּ֣ר אֵלָ֗י/ו מַה זֶּה֙ רוּחֲ/ךָ֣ סָרָ֔ה וְ/אֵינְ/ךָ֖ אֹכֵ֥ל לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/005.yaml
  text: Then Jezebel his wife came to him and said to him[a], “Why is your spirit so sullen that you are not eating bread?”
translation:
  language: te
  text: 'అప్పుడు అతని భార్య యెజెబెలు అతని దగ్గరికి వచ్చి అతనితో ఇలా చెప్పింది: “నీ మనసు ఎందుకు ఇంత ముభావంగా ఉంది, నువ్వు రొట్టె ఎందుకు తినడం లేదు?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఇదేమిటి—నీ మనసు ముభావంగా ఉంది, నువ్వు రొట్టె తినడం లేదు?”
    reason: మూలంలోని ‘ఇదేమిటి?’ అనే ప్రశ్నారంభాన్ని, రెండు సమన్వయమైన వాక్యభాగాలను, అలాగే ‘రొట్టె’ అనే పదాన్ని చూపించడానికి.
lexical_decisions:
- source_word: וַתָּבֹא
  choice: అప్పుడు ... వచ్చింది
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథన శైలిలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: אִיזֶבֶל אִשְׁתּוֹ
  choice: అతని భార్య యెజెబెలు
  rationale: సంబంధాన్ని, వ్యక్తినామాన్ని మూలంలోని క్రమానికి దగ్గరగా స్పష్టంగా తెలియజేస్తుంది; యెజెబెలు అనేది ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: అని అతనిని అడిగింది
  rationale: ఇది ప్రశ్నతో కూడిన ప్రత్యక్ష సంభాషణ కావడంతో, తెలుగు వాడుకలో ‘అడిగింది’ అనేది ‘మాట్లాడింది’ కంటే సహజంగా ఉంటుంది.
- source_word: מַה זֶּה
  choice: ఎందుకు
  rationale: అక్షరార్థంగా ‘ఇదేమిటి?’ అయినా, సందర్భంలో అతని స్థితికి కారణాన్ని ప్రశ్నించే హీబ్రూ నుడికారపు భావాన్ని ‘ఎందుకు’ సహజంగా అందిస్తుంది.
- source_word: רוּחֲךָ
  choice: నీ మనసు
  rationale: רוּחַ ఇక్కడ అంతరంగ స్థితి లేదా మానసిక భావాన్ని సూచిస్తుంది. తెలుగులో ‘నీ ఆత్మ’ అనడం ఈ సందర్భంలో అసహజంగా లేదా ప్రత్యేక ఆధ్యాత్మిక అర్థంతో వినిపించవచ్చు; ‘నీ మనసు’ సందర్భార్థాన్ని కాపాడుతుంది.
- source_word: סָרָה
  choice: దిగులుగా ఉంది
  rationale: ఈ సందర్భంలో పదం ముఖం తిప్పుకున్న, ముభావమైన లేదా కుంగిన అంతరంగ స్థితిని సూచిస్తుంది. ‘దిగులుగా’ సాధారణ పాఠకులకు సహజంగా అర్థమవుతుంది; ‘మొరటుగా’ వంటి పదం అవసరానికి మించి ప్రతికూల స్వభావాన్ని చేర్చవచ్చు.
- source_word: וְאֵינְךָ אֹכֵל לָחֶם
  choice: భోజనం చేయకుండా ఉండేంతగా
  rationale: ‘రొట్టె తినడం’ అనే హీబ్రూ ప్రయోగం ఇక్కడ భోజనం చేయడాన్ని సూచిస్తుంది. తెలుగులో ‘భోజనం చేయడం’ సహజంగా భావాన్ని అందిస్తుంది; వాక్య నిర్మాణం రెండో స్వతంత్ర ‘ఎందుకు’ను చేర్చకుండా పరిస్థితుల అనుబంధాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన కథన శైలి. దాంపత్య సంభాషణలో ఏకవచన ‘నువ్వు/నీ’ సహజంగా ఉపయోగించబడింది. పాదసూచిక గుర్తు ప్రధాన వచనంలో చేర్చబడింది.
