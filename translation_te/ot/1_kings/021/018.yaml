source:
  edition: WLC
  text: ק֣וּם רֵ֗ד לִ/קְרַ֛את אַחְאָ֥ב מֶֽלֶךְ יִשְׂרָאֵ֖ל אֲשֶׁ֣ר בְּ/שֹׁמְר֑וֹן הִנֵּה֙ בְּ/כֶ֣רֶם נָב֔וֹת אֲשֶׁר יָ֥רַד שָׁ֖ם לְ/רִשְׁתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/018.yaml
  text: Arise[a], go down to meet Ahab king of Israel, who is in Samaria. Look, he is in the vineyard of Naboth, where he has gone down to take possession of it.
translation:
  language: te
  text: “లేచి, సమార్యలో ఉన్న ఇశ్రాయేలు రాజు అహాబును కలవడానికి దిగివెళ్లు. ఇదిగో, అతడు నాబోతు ద్రాక్షతోటలో ఉన్నాడు; దాన్ని స్వాధీనం చేసుకోవడానికి[a] అతడు అక్కడికి దిగివెళ్లాడు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దాన్ని సొంతం చేసుకోవడానికి.” హీబ్రూ క్రియ సందర్భాన్ని బట్టి స్వాధీనం చేసుకోవడం, కలిగి ఉండడం లేదా వారసత్వంగా పొందడం అనే అర్థాలు ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּם
  choice: లేచి
  rationale: קום ఆజ్ఞారూపంలోని ‘లేచు’ అనే భావాన్ని సహజమైన, సంక్షిప్తమైన ప్రవక్తీయ ఆజ్ఞగా తెలియజేస్తుంది.
- source_word: רֵד
  choice: దిగివెళ్లు
  rationale: ירד లోని దిశాసూచక భావాన్ని ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: לִקְרַאת
  choice: కలవడానికి
  rationale: ఈ రూపం ‘కలవడం/ఎదురుపడడం’ అనే భావాన్ని ఇస్తుంది. ‘ఎదిరించడానికి’ అని అనువదిస్తే సందర్భంలోని ఘర్షణ భావాన్ని క్రియలోనే అవసరానికి మించి చేర్చినట్లవుతుంది.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: హీబ్రూ సంయుక్త రాజబిరుదుకు నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: אֲשֶׁר בְּשֹׁמְרוֹן
  choice: షోమ్రోనులో ఉన్న
  rationale: క్రియలేని హీబ్రూ సంబంధ వాక్యాన్ని తెలుగులో అవసరమైన ‘ఉన్న’తో వ్యక్తం చేస్తూ, అహాబు షోమ్రోనులో ఉన్నాడనే మూలపాఠ్య నిర్మాణాన్ని నిలుపుతుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే హీబ్రూ సూచక అవ్యయానికి గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సుపరిచితమైన తెలుగు సమానం.
- source_word: בְּכֶרֶם נָבוֹת
  choice: నాబోతు ద్రాక్షతోటలో
  rationale: בְּ సూచించే స్థలార్థాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: אֲשֶׁר יָרַד שָׁם
  choice: అతడు అక్కడికి దిగివెళ్లాడు
  rationale: యారద్ క్రియలోని దిశను, שָׁם లోని స్థలసూచనను స్పష్టంగా నిలుపుతుంది.
- source_word: לְרִשְׁתּוֹ
  choice: దాన్ని స్వాధీనం చేసుకోవడానికి
  rationale: ירשׁ సందర్భానుసారంగా స్వాధీనం చేసుకోవడం, కలిగి ఉండడం లేదా వారసత్వంగా పొందడం అనే భావాలు ఇవ్వగలదు. నాబోతు మరణం తర్వాత అహాబు తోటను తన ఆధీనంలోకి తీసుకోవడానికి వెళ్లిన ఈ సందర్భంలో ‘స్వాధీనం చేసుకోవడానికి’ అనేది హింసను క్రియలోకి అదనంగా చేర్చకుండా న్యాయపరమైన-ఆస్తి సంబంధ భావాన్ని తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ప్రవక్తీయ ఆజ్ఞకు తగిన గంభీరతను ఉంచాం. ‘షోమ్రోనులో ఉన్నాడు’ వెంటనే ‘ద్రాక్షతోటలో ఉన్నాడు’ అని వచ్చే మూలపాఠ్యంలోని స్థలవివరణ ఉద్రిక్తతను సవరించకుండా నిలిపాం. పాదసూచిక గుర్తును అది వివరిస్తున్న לְרִשְׁתּוֹ అనువాదం వద్ద ఉంచాం.
