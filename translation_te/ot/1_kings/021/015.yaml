  rationale: The revision corrects the Telugu exchange syntax, removes an unstated temporal addition, and improves the footnote’s naturalness. It retains the source text’s distinction between literal ‘give ... for silver’ in the main text and the contextually plausible ‘sell ... for money’ in the note, as well as the emphatic double statement that Naboth is dead.
