id: 1KI.21.15
reference: 1 Kings 21:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יְהִי֙ כִּ/שְׁמֹ֣עַ אִיזֶ֔בֶל כִּֽי סֻקַּ֥ל נָב֖וֹת וַ/יָּמֹ֑ת וַ/תֹּ֨אמֶר אִיזֶ֜בֶל אֶל אַחְאָ֗ב ק֣וּם רֵ֞שׁ אֶת כֶּ֣רֶם נָב֣וֹת הַ/יִּזְרְעֵאלִ֗י אֲשֶׁ֤ר מֵאֵן֙ לָ/תֶת לְ/ךָ֣ בְ/כֶ֔סֶף כִּ֣י אֵ֥ין נָב֛וֹת חַ֖י כִּי מֵֽת־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/015.yaml
  text: When Jezebel heard that Naboth had been stoned and had died[a], Jezebel said to Ahab, “Get up, take possession of the vineyard of Naboth the Jezreelite, which he refused to give you for silver, because Naboth is not alive; he is dead.”
translation:
  language: te
  text: నాబోతు రాళ్లతో కొట్టబడి చనిపోయాడని యెజెబెలు విన్నప్పుడు, ఆమె అహాబుతో, “లేచి, వెండికి బదులుగా నీకు ఇవ్వడానికి నిరాకరించిన యెజ్రెయేలీయుడైన నాబోతు ద్రాక్షతోటను స్వాధీనం చేసుకో[a]. ఎందుకంటే నాబోతు సజీవంగా లేడు; అతడు చనిపోయాడు” అని చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “డబ్బు కోసం నీకు అమ్మడానికి నిరాకరించిన.” హీబ్రూ పాఠంలో అక్షరార్థంగా, “వెండికి బదులుగా నీకు ఇవ్వడానికి నిరాకరించిన” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: విన్నప్పుడు
  rationale: హీబ్రూ కథన సూత్రంలోని కాలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘అప్పుడు జరిగిందేమంటే’ అనే కృత్రిమ పదప్రయోగాన్ని నివారిస్తుంది.
- source_word: סֻקַּל וַיָּמֹת
  choice: రాళ్లతో కొట్టబడి చనిపోయాడు
  rationale: స్కల్ క్రియలోని రాళ్లతో కొట్టే నిర్దిష్ట విధానాన్ని, కర్మణి రూపాన్ని కాపాడుతూ, తరువాతి మరణాన్ని విడిగా తెలియజేస్తుంది.
- source_word: קוּם
  choice: లేచి
  rationale: ఆజ్ఞలోని తక్షణతను సహజంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: רֵשׁ
  choice: స్వాధీనం చేసుకో
  rationale: ఈ సందర్భంలో భూమిని తన అధీనంలోకి తీసుకోవడమే భావం; ‘వారసత్వంగా పొందు’ అని అర్థాన్ని అనవసరంగా కుదించదు.
- source_word: כֶּרֶם
  choice: ద్రాక్షతోట
  rationale: వ్యవసాయ ఆస్తిని సూచించే ఈ పదానికి ప్రామాణికమైన తెలుగు సమానం.
- source_word: הַיִּזְרְעֵאלִי
  choice: యెజ్రెయేలీయుడైన
  rationale: నాబోతు యొక్క ప్రాంతీయ గుర్తింపును నేరుగా తెలియజేస్తుంది.
- source_word: מֵאֵן לָתֵת לְךָ בְכֶסֶף
  choice: నీకు వెండికి ఇవ్వడానికి నిరాకరించిన
  rationale: ‘వెండికి ఇవ్వడం’ అనే మూలపాఠపు రూపాన్ని నిలుపుతుంది; సందర్భంలో అమ్మడం ఉద్దేశమైనా దానిని ప్రధాన పాఠంలో విపులీకరించదు.
- source_word: אֵין נָבוֹת חַי כִּי מֵת
  choice: నాబోతు ఇప్పుడు సజీవంగా లేడు; అతడు చనిపోయాడు
  rationale: ‘సజీవంగా లేడు’ మరియు ‘చనిపోయాడు’ అనే మూలంలోని ఉద్దేశపూర్వక ద్వంద్వ ప్రకటనను, దాని కఠిన స్వరాన్ని కాపాడుతుంది.
theological_decisions:
- issue: רֵשׁ అనే క్రియ వారసత్వం లేదా స్వాధీనాన్ని సూచించగలదు
  choice: స్వాధీనం చేసుకో
  alternative: వారసత్వంగా పొందు
  rationale: ఈ వాక్యం అహాబు ఆస్తిని తన అధీనంలోకి తీసుకోవాలని చెప్పడంపై దృష్టి పెడుతుంది; అతని చట్టబద్ధమైన వారసత్వ హక్కును పాఠ్యం స్పష్టంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథన శైలి సహజంగా, గంభీరంగా ఉంది. యెజెబెలు మాటలలోని నిర్దాక్షిణ్యమైన పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం.
