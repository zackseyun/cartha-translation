source:
  edition: WLC
  text: וְ/נָתַתִּ֣י אֶת בֵּיתְ/ךָ֗ כְּ/בֵית֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט וּ/כְ/בֵ֖ית בַּעְשָׁ֣א בֶן אֲחִיָּ֑ה אֶל הַ/כַּ֨עַס֙ אֲשֶׁ֣ר הִכְעַ֔סְתָּ וַֽ/תַּחֲטִ֖א אֶת יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/022.yaml
  text: And I will make your house like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah[a], because of the provocation with which you have provoked me and caused Israel to sin.
translation:
  language: te
  text: నీ వంశాన్ని నెబాతు కుమారుడైన యెరొబాము వంశంలాగా, అహీయా కుమారుడైన బయెషా వంశంలాగా చేస్తాను[a]. నీవు నన్ను కోపపెట్టి, ఇశ్రాయేలును పాపం చేయించినందున ఇలా చేస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ ఇంటిని ... యెరొబాము ఇంటిలాగా, ... బయెషా ఇంటిలాగా.” ఇక్కడ “ఇల్లు” అంటే రాజవంశం.
    reason: మూల హీబ్రూలోని ‘ఇల్లు’ రూపకాన్ని చూపిస్తూ, సందర్భార్థమైన రాజవంశాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: చేస్తాను
  rationale: נתן యొక్క మూలార్థం ‘ఇవ్వడం’ అయినా, నాశనమైన రాజవంశాలతో పోల్చే ఈ తీర్పు సూత్రంలో ఫలిత స్థితిని సూచించే ‘చేస్తాను’ సహజమైన తెలుగు.
- source_word: בֵּיתְךָ
  choice: నీ వంశాన్ని
  rationale: రాజులకు సంబంధించిన ఈ సందర్భంలో בַּיִת భవనాన్ని కాక రాజవంశాన్ని సూచిస్తుంది. తెలుగులో ‘నీ ఇల్లు’ అస్పష్టంగా ఉండవచ్చు కాబట్టి భావాన్ని నేరుగా తెలిపే ‘నీ వంశం’ ఎంచుకున్నాం.
- source_word: כְּבֵית ... וּכְבֵית
  choice: వంశంలాగా ... వంశంలాగా
  rationale: כְּ పోలికను సూచిస్తుంది; ఆధునిక తెలుగులో ‘లాగా’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: నెబాతు కుమారుడైన యెరొబాము
  rationale: హీబ్రూ పితృనామ సూత్రాన్ని సహజమైన తెలుగు క్రమంలో ఉంచి, పేర్లను సంప్రదాయ తెలుగు రూపాల్లో లిప్యంతరీకరించాం.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: అహీయా కుమారుడైన బయెషా
  rationale: పితృనామాన్ని నేరుగా అనువదించి, పేర్లకు తెలుగులో ప్రాచుర్యంలో ఉన్న రూపాలను వాడాం.
- source_word: אֶל הַכַּעַס אֲשֶׁר הִכְעַסְתָּ
  choice: ఎందుకంటే నీవు నాకు కోపం పుట్టించి
  rationale: כעס మరియు దాని హిఫీల్ రూపం కేవలం ‘కోపం’ అనే భావోద్వేగం కంటే కోపానికి రెచ్చగొట్టడాన్ని సూచిస్తాయి. కారణసంబంధాన్ని ‘ఎందుకంటే’తో, అంతర్లీన దైవీయ కర్మను ‘నాకు’తో స్పష్టం చేశాం.
- source_word: וַתַּחֲטִא אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పాపం చేసేలా చేశావు
  rationale: חטא హిఫీల్ రూపం ఇతరులను పాపం చేయించడాన్ని సూచిస్తుంది; ‘పాపం చేసేలా చేశావు’ కారణార్థాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘కోపం పుట్టించావు’ అనే క్రియకు హీబ్రూలో ప్రత్యక్షంగా లేని దైవీయ కర్మను తెలుగులో వ్యక్తం చేయడం
  choice: ‘నాకు’ అని స్పష్టంగా చేర్చడం
  alternative: ‘కోపం పుట్టించి’ అని కర్మను అంతర్లీనంగా ఉంచడం
  rationale: మాట్లాడుతున్నది యెహోవా; సందర్భంలో కోపానికి గురైనవాడు ఆయనే. ‘నాకు’ అనడం తెలుగులో అస్పష్టతను తొలగిస్తుంది, కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: రాజ తీర్పు సందర్భంలో בֵּית ను అనువదించడం
  choice: ప్రధాన పాఠ్యంలో ‘వంశం’
  alternative: ‘ఇల్లు’ లేదా ‘రాజవంశం’
  rationale: ఇక్కడ అహాబు కుటుంబ నివాసం కాక అతని రాజవంశ పరంపర తీర్పుకు గురవుతోంది. ‘వంశం’ సాధారణ పాఠకుడికి స్పష్టంగా ఉండగా, మూలంలోని ‘ఇల్లు’ రూపకాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన ప్రవచనాత్మక స్వరం, సాధారణ పాఠకుడికి స్పష్టమైన వాక్యనిర్మాణం. పాతకాలపు లేదా మతశాఖాపరమైన ప్రత్యేక పదజాలాన్ని నివారించాం.
