  text: He acted very abominably by going after idols[a], according to all that the Amorites had done[b], whom Yahweh drove out before the sons of Israel.
translation:
  language: te
  text: అతడు విగ్రహాల[a] వెంట వెళ్లి, యహ్వే ఇశ్రాయేలు కుమారుల[b] ఎదుటనుండి వెళ్లగొట్టిన అమోరీయులు చేసిన వాటన్నిటి ప్రకారం అత్యంత హేయంగా ప్రవర్తించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హెబ్రీ పదం గిల్లూలీమ్ విగ్రహాలను తీవ్రంగా తృణీకరించే పదం; దీనిని ‘అసహ్యమైన విగ్రహాలు’ లేదా మరింత అక్షరార్థంగా ‘మలవిగ్రహాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఇశ్రాయేలీయులు’ లేదా ‘ఇశ్రాయేలు ప్రజలు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּתְעֵב מְאֹד
  choice: అత్యంత హేయంగా ప్రవర్తించాడు
  rationale: తעב క్రియలోని నైతిక అసహ్యతను, מְאֹד ఇచ్చే తీవ్రతను సహజమైన ఆధునిక తెలుగులో క్రియాత్మకంగా వ్యక్తపరుస్తుంది.
- source_word: לָלֶכֶת אַחֲרֵי
  choice: వెంట నడుస్తూ
  rationale: వేరొక దానిని అనుసరించి దానికి విధేయత చూపే హెబ్రీయ రూపకాన్ని నిలుపుతూ, ఈ చర్య అతని హేయ ప్రవర్తనకు విధానం/పరిధి అని తెలియజేస్తుంది.
- source_word: הַגִּלֻּלִים
  choice: విగ్రహాలు
  rationale: ప్రధాన పాఠ్యంలో స్పష్టమైన సాధారణ పదాన్ని వాడి, మూలపదంలోని తీవ్ర అవమానార్థాన్ని పాదటిప్పణిలో తెలిపింది.
- source_word: כְּכֹל אֲשֶׁר עָשׂוּ
  choice: చేసిన వాటన్నిటి ప్రకారం
  rationale: అహాబు ప్రవర్తనను అమోరీయుల క్రియల సమస్త నమూనాతో పోల్చే మూలంలోని విస్తృత భావాన్ని సన్నగిల్లకుండా ఉంచుతుంది.
- source_word: הָאֱמֹרִי
  choice: అమోరీయులు
  rationale: మూలంలో రూపపరంగా ఏకవచనమైనా ఇక్కడ సమూహవాచకంగా ఉంది; తెలుగులో సహజంగా బహువచనం వాడబడింది.
- source_word: הוֹרִישׁ
  choice: వెళ్లగొట్టిన
  rationale: భూమి నుండి పూర్వ నివాసులను తొలగించిన భావాన్ని పాఠకులకు స్పష్టమైన తెలుగులో అందిస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: מִפְּנֵי
  choice: ఎదుటనుండి
  rationale: ఇశ్రాయేలు సమక్షం నుండి తొలగించబడిన దిశాభావాన్ని కాపాడుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని అక్షరార్థమైన పురుషలింగ సమూహవ్యక్తీకరణను ప్రధాన పాఠ్యంలో నిలిపి, సహజమైన సమానార్థాన్ని పాదటిప్పణిలో ఇచ్చింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలం వ్యక్తిగత దైవనామాన్ని ప్రత్యక్షంగా వాడుతుంది; అందువల్ల దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం సముచితం.
- issue: בְּנֵי יִשְׂרָאֵל లోని లింగసూచక సమూహవ్యక్తీకరణ
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు; ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలోని రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, అది మొత్తం ఇశ్రాయేలు ప్రజలను సూచించగలదనే విషయాన్ని పాదటిప్పణి స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. సంబంధవాక్యాన్ని తెలుగులో సహజంగా ముందుకు మార్చి, అమోరీయులనే యహ్వే వెళ్లగొట్టాడనే సంబంధాన్ని స్పష్టంగా ఉంచింది.
