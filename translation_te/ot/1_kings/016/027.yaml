source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֤י עָמְרִי֙ אֲשֶׁ֣ר עָשָׂ֔ה וּ/גְבוּרָת֖/וֹ אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹֽא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/027.yaml
  text: The rest of the acts of Omri[a], what he did[b], and his might that he showed—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: te
  text: ఒమ్రీ చేసిన మిగిలిన కార్యాలు, అతడు చూపిన పరాక్రమం[a]—ఇవన్నీ ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథంలో[b] రాసి లేవా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతడు చేసిన పరాక్రమ కార్యాలు.’ హీబ్రూ పదం బలాన్ని గానీ, ఆ బలాన్ని వెల్లడించే కార్యాలను గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథం’ అనేది ఇశ్రాయేలు రాజుల పాలనకు సంబంధించిన రాజరిక వార్షిక వృత్తాంతాల మూలగ్రంథం; ఇది బైబిలులోని దినవృత్తాంతాల గ్రంథం కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי עָמְרִי
  choice: ఒమ్రీ చేసిన మిగిలిన కార్యాలు
  rationale: రాజుల పాలన సంగ్రహ సూత్రంలో דִּבְרֵי అంటే మాటలు కాక, రాజు చేసిన కార్యాలు లేదా పాలనా చర్యలు. וְיֶתֶר వాటిలో మిగిలిన వాటిని సూచిస్తుంది.
- source_word: אֲשֶׁר עָשָׂה
  choice: అతడు చేసినవన్నీ
  rationale: ముందున్న ‘కార్యాలు’ను వివరించే సంబంధ వాక్యాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; మూలంలోని పునరుక్తిని కూడా నిలుపుతుంది.
- source_word: וּגְבוּרָתוֹ אֲשֶׁר עָשָׂה
  choice: అతడు ప్రదర్శించిన పరాక్రమం
  rationale: גְּבוּרָה బలం లేదా ఆ బలాన్ని వెల్లడించే పరాక్రమ కార్యాలు అనే రెండు భావాలను కలిగి ఉండవచ్చు. ‘ప్రదర్శించిన పరాక్రమం’ నామవాచకాన్నీ, దాని వెంట ఉన్న క్రియాత్మక సంబంధ వాక్యాన్నీ సహజంగా నిలుపుతుంది.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: ఇవన్నీ ... రాసి ఉన్నాయి కదా?
  rationale: హీబ్రూ అలంకార ప్రశ్న సమ్మతికరమైన జవాబును ఆశిస్తుంది. ‘ఉన్నాయి కదా?’ తెలుగులో ఆ భావాన్ని సహజంగా కాపాడుతుంది.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజుల చరిత్ర గ్రంథంలో
  rationale: ఇది ఇశ్రాయేలు రాజులకు సంబంధించిన రాజవంశ వార్షిక వృత్తాంతాల గ్రంథాన్ని సూచించే శీర్షికాత్మక పదబంధం. ‘గ్రంథంలో’ అనేది తెలుగు ప్రయోగానికి అనుగుణం.
theological_decisions:
- issue: గְּבוּרָה అనే పదం బలాన్నా, పరాక్రమ కార్యాలనా సూచిస్తుంది?
  choice: పరాక్రమం
  alternative: పరాక్రమ కార్యాలు
  rationale: మూలంలోని నామవాచక భావాన్ని నిలుపుతూ, దాని పరిధిలో బలం మరియు బలప్రదర్శన రెండూ ఉండేలా ప్రధాన పాఠంలో విస్తృతార్థ పదాన్ని వాడి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: ‘చరిత్ర గ్రంథం’ ఏ గ్రంథాన్ని సూచిస్తుంది?
  choice: రాజవంశ వార్షిక వృత్తాంతాల మూలగ్రంథంగా వివరించడం
  alternative: బైబిలులోని దినవృత్తాంతముల గ్రంథంగా గుర్తించడం
  rationale: సందర్భంలోని శీర్షిక ఇశ్రాయేలు రాజుల రాజరిక నమోదులను సూచిస్తుంది; బైబిలు కానన్‌లోని దినవృత్తాంతముల గ్రంథంతో దాన్ని సమానంగా చూడకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక వచన శైలిని వాడాం. అలంకార ప్రశ్నను ‘కదా?’తో నిలిపాం; మూలంలోని גְּבוּרָה పదానికి ఉన్న నిజమైన భావవిస్తృతిని పాదటిప్పణిలో కాపాడాం.
