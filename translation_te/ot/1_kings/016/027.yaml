revisions:
- from: ఒమ్రీ చేసిన మిగిలిన కార్యాలు, అతడు చేసినవన్నీ, అతడు ప్రదర్శించిన పరాక్రమం[a]—ఇవన్నీ ఇశ్రాయేలు రాజుల చరిత్ర గ్రంథంలో[b] రాసి ఉన్నాయి కదా?
