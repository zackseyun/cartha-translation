source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אֵלָ֖ה וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/014.yaml
  text: The rest of the acts of Elah[a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: te
  text: ఏలా గురించిన మిగిలిన సంగతులు, అతడు చేసినదంతా ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథంలో[a] వ్రాయబడి ఉన్నాయి కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలు రాజుల వృత్తాంతాల గ్రంథంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֵלָה
  choice: ఏలా గురించిన మిగిలిన సంగతులు
  rationale: יֶתֶר అంటే ‘మిగిలినవి’; דִּבְרֵי అనే విస్తృత పదం ఈ రాజవృత్తాంత సూత్రప్రయోగంలో ఏలా పాలనకు సంబంధించిన సంగతులు లేదా కార్యాలను సూచిస్తుంది. వెంటనే వచ్చే ‘అతడు చేసినదంతా’ అనే మాటతో అనవసర పునరుక్తి రాకుండా సహజమైన తెలుగులో ‘సంగతులు’ అని ఇచ్చాం.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: అతడు చేసినదంతా
  rationale: עשה అనే విస్తృత క్రియను సరళంగా, సమగ్ర భావం నిలిచేలా అనువదిస్తుంది.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: రాసి ఉన్నాయి కదా?
  rationale: సానుకూల సమాధానాన్ని ఆశించే హీబ్రూ అలంకారప్రశ్నను ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: עַל סֵפֶר
  choice: గ్రంథంలో
  rationale: అక్షరార్థంగా ‘గ్రంథం/చుట్టపై’ అయినా, ఒక పత్రంలో విషయాలు నమోదై ఉన్నాయని తెలుగులో ‘గ్రంథంలో’ అనడం సహజం.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజుల దినవృత్తాంతాలు
  rationale: ఈ పదబంధం ఇశ్రాయేలు రాజులకు సంబంధించిన అధికారిక కాలక్రమ వృత్తాంతాలను సూచిస్తుంది; ‘దినవృత్తాంతాలు’ మూలంలోని కాలానుక్రమిక నమోదు భావాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన చారిత్రక శైలి. మూలంలోని అలంకారప్రశ్నను ప్రకటనగా మార్చకుండా నిలిపాం. ఆంగ్ల సంప్రదింపు పాఠ్యంలో [a] సూచిక ‘Elah’ తరువాత ఉన్నప్పటికీ, దాని గమనిక గ్రంథశీర్షికకు సంబంధించినది కాబట్టి తెలుగులో సంబంధిత పదబంధం తరువాత ఉంచాం.
