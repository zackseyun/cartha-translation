  variant: modern standard Telugu
source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת עֶשְׂרִ֤ים וָ/שֵׁשׁ֙ שָׁנָ֔ה לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ אֵלָ֨ה בֶן בַּעְשָׁ֧א עַל יִשְׂרָאֵ֛ל בְּ/תִרְצָ֖ה שְׁנָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/008.yaml
  text: In the twenty-sixth year of Asa king of Judah, Elah son of Baasha became king over Israel in Tirzah for two years.
translation:
  language: te
  text: యూదా రాజు ఆసా పరిపాలనలోని ఇరవై ఆరవ సంవత్సరంలో, బయెషా కుమారుడు ఏలా తిర్సాలో ఇశ్రాయేలుమీద రాజై రెండు సంవత్సరాలు పరిపాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֵׁשׁ שָׁנָה
  choice: పరిపాలనలో ఇరవై ఆరవ సంవత్సరంలో
  rationale: హీబ్రూ రాజ్యకాల తేదీ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది; మూలంలోని పదపునరుక్తిని యాంత్రికంగా అనుసరించదు.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన ఆసా
  rationale: לְ ఉపసర్గ ఇక్కడ ఆసా రాజ్యపాలన సంవత్సరాన్ని సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో ‘యూదా రాజైన ఆసా పరిపాలనలో’ సహజంగా ఉంటుంది.
- source_word: מָלַךְ
  choice: రాజై ... పరిపాలించాడు
  rationale: ప్రవేశ ప్రకటనలో క్రియకు రాజవడం అనే ఆరంభ భావం ఉంది; చివరి కాలవ్యవధితో కలిపి అతని పరిపాలనను కూడా సహజంగా తెలుపుతుంది.
- source_word: אֵלָה
  choice: ఏలా
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించింది.
- source_word: בֶן בַּעְשָׁא
  choice: బయెషా కుమారుడు
  rationale: సాధారణ పుత్ర సంబంధ నిర్మాణాన్ని నేరుగా, సహజంగా అనువదించింది; పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుమీద
  rationale: עַל తో కూడిన מלך పాలనాధికారాన్ని సూచిస్తుంది; మూలంలో లేని ‘రాజ్యం’ అనే పదాన్ని చేర్చలేదు.
- source_word: בְּתִרְצָה
  choice: తిర్సాలో
  rationale: בְ ఇక్కడ స్థలాన్ని సూచిస్తుంది; ‘లో’ దానికి సహజమైన తెలుగు సమానం.
- source_word: שְׁנָתָיִם
  choice: రెండు సంవత్సరాలు
  rationale: హీబ్రూ ద్వివచన రూపంలోని ఖచ్చితమైన కాలవ్యవధిని తెలుగులో నేరుగా తెలిపింది.
