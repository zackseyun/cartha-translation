translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే రాజ్యకాల ప్రకటన శైలి. తేదీ, వంశసంబంధం, పాలనా పరిధి, స్థలం, వ్యవధి అన్నీ మూల క్రమానికి దగ్గరగా ఉంచబడ్డాయి.
