source:
  edition: WLC
  text: וַ/יֵּ֗לֶךְ בְּ/כָל דֶּ֨רֶךְ֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט ו/ב/חטאתי/ו אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵ֑ל לְ/הַכְעִ֗יס אֶת יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל בְּ/הַבְלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/026.yaml
  text: For he walked in all the way of Jeroboam son of Nebat[a], and in his sins by which he caused Israel to sin, provoking Yahweh, the God of Israel, with their idols.
translation:
  language: te
  text: అతడు నెబాతు కుమారుడైన యరొబాము మార్గమంతటిలోనూ, యరొబాము ఇశ్రాయేలీయులను పాపం చేయించిన పాపాల్లోనూ నడిచాడు; వారి విగ్రహాలతో[a] ఇశ్రాయేలు దేవుడైన యాహ్వేను కోపపెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదానికి అక్షరార్థంగా ‘వారి వ్యర్థమైన వాటితో’ లేదా ‘వారి నిస్సారమైన వాటితో’ అని అర్థం; విగ్రహాలను అవహేళనాత్మకంగా సూచించడానికి ఈ పదాన్ని తరచుగా వాడుతారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל דֶּרֶךְ
  choice: మార్గమంతటిలో నడిచాడు
  rationale: הלך ... דרך అనే హీబ్రూ ప్రయోగం శారీరకంగా నడవడాన్ని కాక జీవన ప్రవర్తనను సూచిస్తుంది. తెలుగు పాఠ్యంలో ‘మార్గంలో నడవడం’ అనే రూపకాన్ని నిలుపుతూ సంపూర్ణ అనుసరణ భావాన్ని ‘మార్గమంతటిలో’ తెలియజేస్తుంది.
- source_word: יָרָבְעָם בֶּן־נְבָט
  choice: నెబాతు కుమారుడైన యరొబాము
  rationale: వ్యక్తుల పేర్లను ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చి, హీబ్రూ సంబంధ నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేసింది.
- source_word: וּבְחַטֹּאתָיו
  choice: అతని పాపాల్లోనూ
  rationale: బహువచన నామవాచకంలోని మూడవ పురుష ఏకవచన ప్రత్యయం యరొబాము పాపాలను సూచిస్తుంది; ‘నూ’ ముందున్న మార్గంతో దీనిని సమాంతరంగా కలుపుతుంది.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת־יִשְׂרָאֵל
  choice: యరొబాము ఇశ్రాయేలుతో పాపం చేయించిన
  rationale: חטא హిఫీల్ రూపంలోని కారణార్థాన్ని ‘పాపం చేయించిన’ అని స్పష్టంగా నిలిపింది. తెలుగు పాఠ్యంలో సంబంధం అస్పష్టంగా కాకుండా ఉండేందుకు కర్త పేరును పునరుక్తి చేసింది.
- source_word: לְהַכְעִיס
  choice: కోపం పుట్టించాడు
  rationale: ఈ కారణార్థక క్రియ ముందున్న ప్రవర్తన ఫలితంగా లేదా ఉద్దేశంగా దేవునికి కోపం కలిగించడాన్ని సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో క్రియారూపంగా అందించింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ ‘Yahweh’ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: హీబ్రూ సమాసాన్ని సహజమైన తెలుగు సంబంధ పదబంధంగా నేరుగా అనువదించింది.
- source_word: בְּהַבְלֵיהֶם
  choice: వారి విగ్రహాలతో
  rationale: הבל ప్రాథమికంగా ఆవిరి, వ్యర్థత, నిస్సారత అని అర్థమైనా, ఈ విగ్రహారాధనా సందర్భంలో అది వ్యర్థమైన దేవతలను లేదా విగ్రహాలను అవహేళనాత్మకంగా సూచిస్తుంది. సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, మూల రూపకాన్ని పాదసూచికలో నిలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగులో లిప్యంతరీకరించడం మూలంలోని నామస్వరూపాన్ని నిలుపుతుంది.
- issue: בְּהַבְלֵיהֶם యొక్క విగ్రహారాధనా భావం
  choice: వారి విగ్రహాలతో
  alternative: వారి వ్యర్థమైన వాటితో; వారి నిస్సారమైన దేవతలతో
  rationale: ఈ పదం విగ్రహాల వ్యర్థతను ఉద్దేశపూర్వకంగా ఎత్తిచూపుతుంది. ‘విగ్రహాలు’ సందర్భ సూచనను స్పష్టం చేస్తుండగా, పాదసూచిక హీబ్రూ పదంలోని ‘వ్యర్థత/నిస్సారత’ భావాన్ని సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించింది. ‘మార్గంలో నడవడం’ అనే బైబిలు ప్రవర్తనా రూపకాన్ని నిలిపి, పొడవైన హీబ్రూ వాక్యాన్ని స్పష్టత కోసం మూడు అనుసంధానిత తెలుగు వాక్యాలుగా విభజించింది. పాదసూచిక సూచిక [a] సంబంధిత ‘విగ్రహాలతో’ పదం వెంట ఉంచబడింది.
