  text: Then the word of Yahweh came to Jehu son of Hanani against Baasha[a], saying,
translation:
  language: te
  text: 'అప్పుడు యాహ్వే వాక్యం హనానీ కుమారుడైన యెహూకు బయెషాకు వ్యతిరేకంగా వచ్చి ఇలా చెప్పింది:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: అప్పుడు ... వచ్చింది
  rationale: వావ్-కన్సిక్యూటివ్ కథనంలో కొత్త పరిణామాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: דְבַר יְהוָה
  choice: యెహోవా వాక్యం
  rationale: ప్రవచన ప్రకటనకు వాడే స్థిరమైన సూత్రాన్ని, దైవిక వాక్కు అనే భావగాంభీర్యాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: אֶל
  choice: యెహూకు
  rationale: దైవవాక్యాన్ని అందుకున్న వ్యక్తిని సూచించే אֶל భావాన్ని తెలుగు విభక్తి ‘కు’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יֵהוּא בֶן חֲנָנִי
  choice: హనానీ కుమారుడైన యెహూ
  rationale: హీబ్రూ పితృనామ సంబంధాన్ని సహజమైన తెలుగు పదక్రమంలో స్పష్టంగా అందిస్తుంది.
- source_word: עַל
  choice: విరోధంగా
  rationale: తదుపరి తీర్పు ప్రవచన సందర్భంలో ఇది కేవలం ‘గురించి’ అనే తటస్థ భావంకంటే ప్రతికూలంగా ఉద్దేశించిన ప్రకటనను సూచిస్తుంది.
- source_word: בַּעְשָׁא
  choice: బయెషా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: לֵאמֹר
  choice: 'ఇలా తెలిపింది:'
  rationale: తరువాత వచ్చే దైవవాక్య విషయాన్ని పరిచయం చేసే హీబ్రూ క్రియారూపాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా నిలుపుతుంది; తెలుగు పాఠకులకు సుపరిచితమైన రూపాన్ని ఉపయోగిస్తుంది.
- issue: ప్రవచన సూత్రంలో עַל భావం
  choice: బయెషాకు విరోధంగా
  alternative: బయెషా గురించి
  rationale: ఇది తీర్పు ప్రకటనకు నాంది కాబట్టి ‘విరోధంగా’ సందర్భంలోని న్యాయతీర్పు బలాన్ని నిలుపుతుంది; అయితే హీబ్రూ ఉపసర్గకు విస్తృత భావపరిధి ఉన్నందున ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణంతో పాటు ప్రవచన సూత్రంలోని గాంభీర్యం నిలుపబడింది.
