  yaml_path: translation/ot/1_kings/016/028.yaml
  text: And Omri slept with his fathers and was buried in Samaria[a], and Ahab his son reigned in his place.
translation:
  language: te
  text: ఒమ్రీ తన పితరులతో నిద్రించాడు[a]; అతడు షోమ్రోనులో పాతిపెట్టబడ్డాడు. అతని స్థానంలో అతని కుమారుడు అహాబు రాజ్యమేలాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తన పితరులతో నిద్రించాడు’ అనేది రాజుల వృత్తాంతాల్లో మరణాన్ని సూచించే సంప్రదాయ హీబ్రూ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עָמְרִי עִם אֲבֹתָיו
  choice: ఒమ్రీ తన పితరులతో నిద్రించాడు
  rationale: రాజుల వృత్తాంతాల్లో ఇది మరణాన్ని సూచించే స్థిరమైన హీబ్రూ ప్రయోగం. అర్థాన్ని నేరుగా ‘చనిపోయాడు’ అని మార్చకుండా, మూలంలోని రూపకాన్ని మరియు సూత్రబద్ధ శైలిని నిలుపుతుంది; పాదసూచిక అర్థాన్ని స్పష్టం చేస్తుంది.
- source_word: וַיִּקָּבֵר
  choice: పాతిపెట్టబడ్డాడు
  rationale: నిఫాల్ క్రియారూపంలోని కర్మణి భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּשֹׁמְרוֹן
  choice: షోమ్రోనులో
  rationale: בְּ ఇక్కడ సమాధి చేసిన స్థలాన్ని సూచిస్తుంది. హీబ్రూ స్థలనామానికి దగ్గరగా ‘షోమ్రోను’ రూపాన్ని వాడాం.
- source_word: וַיִּמְלֹךְ
  choice: రాజ్యమేలాడు
  rationale: రాజవంశ వారసత్వ సూత్రంలో క్రియ యొక్క సరళమైన అర్థాన్ని ఇస్తుంది; మూలంలో తప్పనిసరిగా లేని ‘రాజవడం ప్రారంభించాడు’ అనే భావాన్ని అదనంగా చేర్చదు.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: అతని స్థానాన్ని కుమారుడు చేపట్టిన రాజవంశ వారసత్వాన్ని సహజంగా, ఖచ్చితంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని అనుసరించాం. హీబ్రూ మరణసూత్రాన్ని పాదసూచికతో సహా నిలిపాం; వాక్యాన్ని సహజ తెలుగు ప్రవాహం కోసం రెండు ప్రధాన భాగాలుగా విభజించాం.
