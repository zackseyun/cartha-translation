source:
  edition: WLC
  text: אָ֧ז יֵחָלֵ֛ק הָ/עָ֥ם יִשְׂרָאֵ֖ל לַ/חֵ֑צִי חֲצִ֨י הָ/עָ֜ם הָ֠יָה אַחֲרֵ֨י תִבְנִ֤י בֶן גִּינַת֙ לְ/הַמְלִיכ֔/וֹ וְ/הַ/חֲצִ֖י אַחֲרֵ֥י עָמְרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/021.yaml
  text: 'Then the people of Israel were divided into two parts: half of the people followed Tibni son of Ginath[a], to make him king, and half followed Omri.'
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు ప్రజలు రెండు సగాలుగా విడిపోయారు. ప్రజల్లో సగం గీనతు కుమారుడైన తిబ్నీని రాజుగా చేయడానికి అతని పక్షాన ఉన్నారు; మరో సగం ఒమ్రీ పక్షాన ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵחָלֵק
  choice: చీలిపోయారు
  rationale: నిఫాల్ రూపం ప్రజలు విభజించబడినట్లు లేదా చీలిపోయినట్లు సూచిస్తుంది. సమూహవాచకమైన ‘ప్రజలు’కు ఆధునిక తెలుగులో బహువచన క్రియ సహజంగా ఉంటుంది.
- source_word: הָעָם יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: ఇది ఇశ్రాయేలు జాతీయ ప్రజాసమూహాన్ని సూచించే సహజమైన తెలుగు వ్యక్తీకరణ.
- source_word: לַחֵצִי
  choice: రెండు వర్గాలుగా
  rationale: ప్రజలు రెండు సగాలుగా విడిపోయారనే భావాన్ని రాజకీయ సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: חֲצִי הָעָם
  choice: ప్రజల్లో సగం
  rationale: మూలంలోని సమతూకమైన విభజనను స్పష్టంగా నిలుపుతుంది.
- source_word: הָיָה אַחֲרֵי
  choice: అనుసరించారు
  rationale: ‘ఒకరి వెనుక ఉండడం’ అనే హీబ్రూ ప్రయోగం ఈ రాజకీయ సందర్భంలో ఆ వ్యక్తికి మద్దతు ఇవ్వడం లేదా అతని పక్షాన్ని అనుసరించడం అనే భావం కలిగిస్తుంది.
- source_word: תִבְנִי בֶן גִּינַת
  choice: గీనతు కుమారుడైన తిబ్నీ
  rationale: వ్యక్తుల పేర్లను తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించి, హీబ్రూ వంశసంబంధాన్ని సహజమైన తెలుగు క్రమంలో తెలిపింది.
- source_word: לְהַמְלִיכוֹ
  choice: అతన్ని రాజుగా చేయడానికి
  rationale: హిఫిల్ క్రియారూపం అతడు రాజ్యమేలేలా చేయడం అనే కారణార్థక భావాన్ని ఇస్తుంది; పట్టాభిషేక ఆచారాన్ని అదనంగా చేర్చదు.
- source_word: וְהַחֲצִי אַחֲרֵי עָמְרִי
  choice: మిగిలిన సగం ఒమ్రీని అనుసరించారు
  rationale: మూలంలో రెండో భాగంలో విడిచిపెట్టిన క్రియను సమాంతర మొదటి భాగం నుంచి పూరించి, తెలుగులో స్పష్టత కోసం ‘మిగిలిన’ అని తెలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. రాజకీయ విభజన స్పష్టంగా ఉండేందుకు ‘రెండు వర్గాలుగా’ అన్నాం; మూలంలోని రెండు సమాన భాగాల భావాన్ని ‘సగం… మిగిలిన సగం’తో నిలిపాం.
