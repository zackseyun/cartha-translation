revisions:
- from: అప్పుడు ఇశ్రాయేలు ప్రజలు రెండు వర్గాలుగా చీలిపోయారు. ప్రజల్లో సగం గీనతు కుమారుడైన తిబ్నీని రాజుగా చేయడానికి అతన్ని అనుసరించారు[a]; మిగిలిన సగం ఒమ్రీని అనుసరించారు.
