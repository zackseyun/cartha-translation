  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే కథన శైలి. ‘రాజభవనం’ మరియు ‘కోట’ మధ్య మూలపాఠంలోని పదభేదాన్ని కాపాడింది; హీబ్రూ అసాధారణ ప్రయోగాన్ని పాదసూచికలో తెలిపింది.
