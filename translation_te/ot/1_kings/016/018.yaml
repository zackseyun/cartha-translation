source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/רְא֤וֹת זִמְרִי֙ כִּֽי נִלְכְּדָ֣ה הָ/עִ֔יר וַ/יָּבֹ֖א אֶל אַרְמ֣וֹן בֵּית הַ/מֶּ֑לֶךְ וַ/יִּשְׂרֹ֨ף עָלָ֧י/ו אֶת בֵּֽית מֶ֛לֶךְ בָּ/אֵ֖שׁ וַ/יָּמֹֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/018.yaml
  text: And when Zimri saw that the city had been captured[a], he went into the citadel of the king’s house and burned the king’s house over himself with fire[b], and died.
translation:
  language: te
  text: జిమ్రీ పట్టణం స్వాధీనమైందని చూసినప్పుడు, రాజభవనపు కోటలోకి వెళ్లి, తన చుట్టూ రాజభవనానికి నిప్పంటించి చనిపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తన మీద రాజభవనాన్ని అగ్నితో కాల్చి చనిపోయాడు”; అంటే తాను లోపల ఉండగానే రాజభవనానికి నిప్పంటించాడు.
    reason: హీబ్రూ మూలంలోని עָלָיו (‘తన మీద’) అనే అసాధారణ నిర్మాణాన్ని చూపించి, ప్రధాన పాఠంలోని సహజ తెలుగు రూపానికి ఆధారం తెలియజేయడం.
lexical_decisions:
- source_word: כִּרְאוֹת זִמְרִי
  choice: జిమ్రీ ... చూసినప్పుడు
  rationale: כְּ + క్రియార్థక నామరూపం ఇక్కడ కాలసంబంధ పరిస్థితిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘చూసినప్పుడు’ సహజంగా కథన క్రమాన్ని నిలుపుతుంది.
- source_word: נִלְכְּדָה הָעִיר
  choice: పట్టణం స్వాధీనమైంది
  rationale: לכד నిఫాల్ రూపం పట్టుబడటం లేదా స్వాధీనమవడాన్ని సూచిస్తుంది; యుద్ధ సందర్భంలో ‘స్వాధీనమైంది’ స్పష్టమైన సహజ తెలుగు.
- source_word: אַרְמוֹן בֵּית הַמֶּלֶךְ
  choice: రాజభవనంలోని కోట
  rationale: אַרְמוֹן ఒక పటిష్ఠమైన రాజనిర్మాణాన్ని సూచించగలదు. בֵּית הַמֶּלֶךְతో ఉన్న సంబంధాన్ని ‘రాజభవనంలోని’ అని వ్యక్తపరచడం, రెండు పదాలను ఒకే ‘భవనం’గా కలిపివేయకుండా భేదాన్ని కాపాడుతుంది.
- source_word: וַיִּשְׂרֹף עָלָיו אֶת בֵּית מֶלֶךְ בָּאֵשׁ
  choice: తన చుట్టూ రాజభవనానికి నిప్పంటించుకొని
  rationale: హీబ్రూ వాక్యం అక్షరార్థంగా రాజభవనాన్ని ‘తన మీద’ అగ్నితో కాల్చాడని చెబుతుంది. తెలుగులో ‘తన చుట్టూ ... నిప్పంటించుకొని’ ఆత్మవినాశక చర్యను సహజంగా తెలియజేస్తూ עָלָיו భావాన్ని నిలుపుతుంది.
- source_word: וַיָּמֹת
  choice: చనిపోయాడు
  rationale: సాధారణ కథన కొనసాగింపును సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
