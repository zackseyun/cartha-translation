  yaml_path: translation/ot/1_kings/016/010.yaml
  text: Then Zimri came in, struck him down, and killed him, in the twenty-seventh year of Asa king of Judah; and he reigned in his place.
translation:
  language: te
  text: అప్పుడు జిమ్రీ లోపలికి వచ్చి అతనిని కొట్టి చంపాడు. ఇది యూదా రాజైన ఆసా పాలనలో ఇరవై ఏడవ సంవత్సరంలో జరిగింది. జిమ్రీ అతని స్థానంలో రాజయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: అప్పుడు ... లోపలికి వచ్చి
  rationale: בוא అనే క్రియకు ‘రావడం/ప్రవేశించడం’ అనే అర్థాలున్నాయి. హత్య జరిగిన సందర్భంలో స్థలాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా ‘లోపలికి వచ్చి’ సహజంగా ఉంది; ‘అప్పుడు’ కథన క్రమాన్ని తెలియజేస్తుంది.
- source_word: זִמְרִי
  choice: జిమ్రీ
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וַיַּכֵּהוּ וַיְמִיתֵהוּ
  choice: అతనిని కొట్టి చంపాడు
  rationale: נכה ‘కొట్టు’, מות హిఫీల్ రూపం ‘చంపు’ అని అర్థం. తెలుగులో ‘కొట్టి చంపాడు’ రెండు చర్యల సంబంధాన్ని సంక్షిప్తంగా, సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע לְאָסָא מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన ఆసా పాలనలో ఇరవై ఏడవ సంవత్సరంలో
  rationale: ఇది రాజ్యపాలనా సంవత్సరాన్ని సూచించే ప్రామాణిక తేదీ సూత్రం. తెలుగులో ‘పాలనలో ... సంవత్సరంలో’ అని చెప్పడం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: జిమ్రీ అతని స్థానంలో రాజయ్యాడు
  rationale: מלך ఇక్కడ ‘రాజుగా పాలించడం’ లేదా ‘రాజవడం’ అనే భావాన్ని ఇవ్వగలదు; תחתיו వారసత్వ సందర్భంలో ‘అతని స్థానంలో’ అని అర్థం. ‘రాజయ్యాడు’ అధికార స్వీకరణను సహజంగా తెలియజేస్తుంది.
