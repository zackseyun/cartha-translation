translation_notes:
  register: సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. హీబ్రూ కథన క్రమం నిలుపుతూ, తెలుగులో భారంగా వినిపించే వరుస సంధులను తగ్గించేందుకు వాక్యాన్ని మూడు భాగాలుగా విభజించాం. చివరి వాక్యంలో కర్త స్పష్టత కోసం ‘జిమ్రీ’ పేరును మళ్లీ పేర్కొన్నాం.
