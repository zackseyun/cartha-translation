source:
  edition: WLC
  text: בִּ/שְׁנַת֩ עֶשְׂרִ֨ים וָ/שֶׁ֜בַע שָׁנָ֗ה לְ/אָסָא֙ מֶ֣לֶךְ יְהוּדָ֔ה מָלַ֥ךְ זִמְרִ֛י שִׁבְעַ֥ת יָמִ֖ים בְּ/תִרְצָ֑ה וְ/הָ/עָ֣ם חֹנִ֔ים עַֽל גִּבְּת֖וֹן אֲשֶׁ֥ר לַ/פְּלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/015.yaml
  text: In the twenty-seventh year of Asa king of Judah[a], Zimri became king for seven days in Tirzah, while the people were camped against Gibbethon, which belonged to the Philistines.
translation:
  language: te
  text: యూదా రాజైన ఆసా పాలనలోని ఇరవై ఏడవ సంవత్సరంలో, జిమ్రీ తిర్సాలో రాజై ఏడు రోజులు పాలించాడు. ఆ సమయంలో ప్రజలు ఫిలిష్తీయులకు చెందిన గిబ్బెతోనును ఎదిరించి[a] మకాం వేసి ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గిబ్బెతోను దగ్గర.’ ఈ సైనిక సందర్భంలో ‘గిబ్బెతోనును ఎదిరించి’ అనేది ఆ పట్టణానికి వ్యతిరేకంగా మకాం వేసిన భావాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע שָׁנָה לְאָסָא מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన ఆసా పాలనలో ఇరవై ఏడవ సంవత్సరంలో
  rationale: రాజుల పాలనాసంవత్సరాల ప్రకారం తేదీ చెప్పే హీబ్రూ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מָלַךְ זִמְרִי שִׁבְעַת יָמִים
  choice: జిమ్రీ ... రాజై ఏడు రోజులు పాలించాడు
  rationale: מָלַךְ లోని రాజ్యాధికారాన్ని స్వీకరించే భావాన్ని ‘రాజై’ తెలియజేస్తుంది; వెంటనే వచ్చే ఏడు రోజుల వ్యవధిని ‘పాలించాడు’ సహజంగా అనుసంధానిస్తుంది.
- source_word: בְּתִרְצָה
  choice: తిర్సాలో
  rationale: స్థలాన్ని సూచించే సాధారణ రూపం.
- source_word: וְהָעָם חֹנִים
  choice: ఆ సమయంలో ప్రజలు ... మకాం వేసి ఉన్నారు
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న నేపథ్య పరిస్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עַל גִּבְּתוֹן
  choice: గిబ్బెతోనుకు ఎదురుగా
  rationale: సైనిక సందర్భంలోని ప్రతిఘటన భావాన్ని చూపుతూ, హీబ్రూ పదబంధం కేవలం స్థలసమీపతను కూడా సూచించగల అస్పష్టతను పూర్తిగా తొలగించదు.
- source_word: אֲשֶׁר לַפְּלִשְׁתִּים
  choice: ఫిలిష్తీయులకు చెందిన
  rationale: లామెద్ సూచించే స్వామ్య లేదా అనుబంధ భావాన్ని, సైనిక నియంత్రణ గురించి అదనంగా ఊహించకుండా, స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. ‘రాజై ఏడు రోజులు పాలించాడు’ అనే రూపం హీబ్రూ క్రియలోని రాజ్యప్రాప్తి భావాన్నీ పాలనాకాలాన్నీ సహజంగా కలుపుతుంది.
