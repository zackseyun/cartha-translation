base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/019.yaml
  text: because of his sins that he committed[a], doing what was evil in the eyes of Yahweh, walking in the way of Jeroboam and in the sin that he caused Israel to commit.
translation:
  language: te
  text: అతడు చేసిన పాపాలనుబట్టి[a]—యాహ్వే దృష్టిలో చెడ్డది చేస్తూ, యరొబాము మార్గంలోనూ, ఇశ్రాయేలును పాపం చేయించిన అతడు చేసిన పాపంలోనూ నడిచినందున.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ అక్షరార్థం: “అతడు పాపం చేసిన తన పాపాన్నిబట్టి.”'
    reason: మూలంలోని ఒకే మూలపదపు పునరుక్తి మరియు ఏకవచన రూపాన్ని చూపడానికి.
lexical_decisions:
- source_word: עַל
  choice: …నుబట్టి / …నందున
  rationale: ఈ తీర్పు సూత్రంలో עַל ముందున్న శిక్షకు కారణాన్ని తెలియజేస్తుంది. తెలుగు వాక్యప్రవాహంలో కారణార్థాన్ని సహజంగా తెలియజేయడానికి ఈ రూపాలు వాడబడ్డాయి.
- source_word: חטאתו אֲשֶׁר חָטָא
  choice: అతడు చేసిన పాపాలు
  rationale: హీబ్రూలో ఉన్న ఒకే మూలపదపు పునరుక్తిని తెలుగులో యథాతథంగా ఉంచితే కృత్రిమంగా ఉంటుంది. సందర్భంలో సమష్టి భావం ఉన్నందున సహజమైన బహువచనం వాడబడింది; అక్షరార్థ నిర్మాణం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה
  choice: యాహ్వే దృష్టిలో చెడ్డది చేస్తూ
  rationale: ‘కళ్లలో’ అనే హీబ్రూ రూపకానికి తెలుగులో సహజ సమానార్థకమైన ‘దృష్టిలో’ వాడి, నైతిక మూల్యాంకన భావాన్ని నిలిపింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ నాలుగు అక్షరాల నామానికి సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: לָלֶכֶת בְּדֶרֶךְ יָרָבְעָם
  choice: యరొబాము మార్గంలో నడవడం
  rationale: జీవన ప్రవర్తనను ‘మార్గంలో నడవడం’గా తెలిపే మూలభాషా రూపకాన్ని తెలుగులో స్పష్టంగా, సహజంగా నిలిపింది.
- source_word: וּבְחַטָּאתוֹ אֲשֶׁר עָשָׂה לְהַחֲטִיא אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పాపం చేసేలా అతడు చేసిన పాపంలో
  rationale: హిఫిల్ రూపమైన לְהַחֲטִיא యొక్క కారణార్థాన్ని ‘పాపం చేసేలా’ అని స్పష్టంగా ఉంచింది; అదే సమయంలో ‘అతడు చేసిన పాపం’ అనే మూలంలోని స్వతంత్ర పదబంధాన్ని తొలగించలేదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: ఇశ్రాయేలు పాపానికి రాజు కారణమవడం
  choice: ఇశ్రాయేలు పాపం చేసేలా అతడు చేసిన పాపం
  alternative: ఇశ్రాయేలు చేసిన పాపం
  rationale: לְהַחֲטִיא కారణార్థక క్రియ. ఇశ్రాయేలు బాధ్యతను నిరాకరించకుండానే, రాజు వారిని పాపంలోకి నడిపించిన కారణత్వాన్ని మూలపాఠం ప్రకారం నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. ఈ వచనం ముందున్న వాక్యంపై ఆధారపడే కారణవాచక భాగం కావడంతో దాని అసంపూర్ణ అనుసంధాన స్వభావాన్ని నిలిపి, వివరణాత్మక భాగాన్ని దీర్ఘ విరామచిహ్నంతో వేరు చేశాం.
