translation:
  language: te
  text: అప్పుడు ఒమ్రీ, అతనితో ఉన్న ఇశ్రాయేలీయులందరూ గిబ్బెతోను నుండి పైకి వెళ్లి, తిర్సాకు ముట్టడి వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלֶה
  choice: బయలుదేరి వెళ్లి
  rationale: עלה అనే క్రియకు మూలార్థం ‘పైకి వెళ్లడం.’ ఇక్కడ గిబ్బెతోను నుండి తిర్సాకు సైనిక కదలికను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, భౌగోళికంగా పైకి వెళ్లారనే భావాన్ని అనవసరంగా బలపరచకుండా ఈ రూపం ఎంచుకోబడింది.
- source_word: עָמְרִי
  choice: ఒమ్రీ
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: అతనితో ఉన్న ఇశ్రాయేలీయులందరూ
  rationale: ‘ఇశ్రాయేలు అంతా అతనితో’ అనే హీబ్రూ సమష్టి ప్రయోగాన్ని, ఈ సందర్భంలో ఒమ్రీ పక్షాన ఉన్న ప్రజలు లేదా సైన్యాన్ని సూచించే సహజమైన తెలుగుగా అందిస్తుంది; ‘అందరూ’ అనే విస్తృతతను నిలుపుతుంది.
- source_word: מִגִּבְּתוֹן
  choice: గిబ్బెతోను నుండి
  rationale: స్థలనామాన్ని తెలుగు లిపిలో అందించి, מן ఉపసర్గను ‘నుండి’గా నేరుగా అనువదించింది.
- source_word: וַיָּצֻרוּ
  choice: ముట్టడి వేశారు
  rationale: צור క్రియకు ఇక్కడ సైనికంగా ఒక పట్టణాన్ని చుట్టుముట్టి దిగ్బంధించడం అనే అర్థం ఉంది. ‘ముట్టడి వేశారు’ ఆధునిక తెలుగులో స్పష్టమైన, సహజమైన సైనిక ప్రయోగం.
- source_word: עַל תִּרְצָה
  choice: తిర్సాకు
  rationale: ముట్టడి క్రియతో על లక్ష్యాన్ని సూచిస్తుంది. తెలుగులో ‘తిర్సాకు ముట్టడి వేశారు’ సహజమైన నిర్మాణం; స్థలనామం తెలుగు లిప్యంతరీకరణలో ఇవ్వబడింది.
