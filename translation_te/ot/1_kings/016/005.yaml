source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֥י בַעְשָׁ֛א וַ/אֲשֶׁ֥ר עָשָׂ֖ה וּ/גְבֽוּרָת֑/וֹ הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/005.yaml
  text: The rest of the acts of Baasha[a], and what he did, and his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: te
  text: బయెషా గురించిన మిగిలిన విషయాలు, అతడు చేసిన కార్యాలు, అతని పరాక్రమం—ఇవన్నీ ఇశ్రాయేలు రాజుల వృత్తాంత గ్రంథంలో[a] రాయబడి ఉన్నాయి కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథంలో.’
    reason: ‘దినాల విషయాలు’ అనే హీబ్రూ పదబంధాన్ని ‘వృత్తాంతాలు’ లేదా మరింత అక్షరార్థంగా ‘దినవృత్తాంతాలు’ అని అనువదించవచ్చు.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי בַעְשָׁא
  choice: బయెషా గురించిన మిగిలిన విషయాలు
  rationale: దִּבְרֵי అనే పదం ఇక్కడ కేవలం మాటలను కాక రాజు గురించిన నమోదైన విషయాలను సూచిస్తుంది. తరువాత వచ్చే ‘అతడు చేసిన కార్యాలు’తో అనవసర పునరుక్తి రాకుండా ‘విషయాలు’ అని అనువదించాం.
- source_word: וַאֲשֶׁר עָשָׂה
  choice: అతడు చేసిన కార్యాలు
  rationale: హీబ్రూ సంబంధవాచక వాక్యభాగంలోని ‘అతడు చేసినది’ అనే భావాన్ని సహజమైన తెలుగు బహువచన ప్రయోగంతో వ్యక్తం చేస్తుంది; మూలంలో లేని ‘అన్నీ’ని చేర్చలేదు.
- source_word: וּגְבוּרָתוֹ
  choice: అతని పరాక్రమం
  rationale: గְּבוּרָה బలం, శౌర్యం లేదా ప్రదర్శిత సామర్థ్యాన్ని సూచించగలదు. రాజసంబంధ వృత్తాంతంలో ‘పరాక్రమం’ ఆ విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: ఇవన్నీ ... రాయబడి ఉన్నాయి కదా?
  rationale: మూలంలోని అలంకారిక ప్రశ్నను తెలుగు సహజ ప్రశ్నారూపమైన ‘కదా?’తో నిలిపాం.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: వృత్తాంత గ్రంథంలో
  rationale: ఇది రాజుల సంఘటనలను నమోదు చేసిన అధికారిక వృత్తాంత గ్రంథాన్ని సూచిస్తుంది. עַל అనే ఉపసర్గను ఈ లిఖిత సందర్భంలో సహజంగా ‘గ్రంథంలో’ అని ఇచ్చాం.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజుల
  rationale: లְ ఇక్కడ ఆ గ్రంథం ఇశ్రాయేలు రాజులకు సంబంధించినదని తెలుపుతుంది; తెలుగులో సంబంధార్థక షష్ఠీ ప్రయోగం సహజం.
