  terminology: “బయెషా” is an appropriate Telugu transliteration of Baasha. “పరాక్రమం” suitably conveys גְּבוּרָה in this royal-annalistic context, and “ఇశ్రాయేలు రాజుల వృత్తాంత గ్రంథం” naturally conveys the archival title without confusing it with the canonical books of Chronicles. The footnote supplies the more literal “దినవృత్తాంతాలు” alternative and is correctly anchored.
