source:
  edition: WLC
  text: וְ/גַ֡ם בְּ/יַד יֵה֨וּא בֶן חֲנָ֜נִי הַ/נָּבִ֗יא דְּבַר יְהוָ֡ה הָיָה֩ אֶל בַּעְשָׁ֨א וְ/אֶל בֵּית֜/וֹ וְ/עַ֥ל כָּל הָ/רָעָ֣ה אֲשֶׁר עָשָׂ֣ה בְּ/עֵינֵ֣י יְהוָ֗ה לְ/הַכְעִיס/וֹ֙ בְּ/מַעֲשֵׂ֣ה יָדָ֔י/ו לִ/הְי֖וֹת כְּ/בֵ֣ית יָרָבְעָ֑ם וְ/עַ֥ל אֲשֶׁר הִכָּ֖ה אֹתֽ/וֹ־־־־־־׀־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/007.yaml
  text: And also through Jehu son of Hanani the prophet[a], the word of Yahweh came against Baasha and against his house, both because of all the evil that he did in the sight of Yahweh, provoking him to anger by the work of his hands, by becoming like the house of Jeroboam, and because he struck him down.
translation:
  language: te
  text: అంతేకాక, హనానీ కుమారుడైన ప్రవక్త యెహూ ద్వారా బయెషాకు, అతని వంశానికి వ్యతిరేకంగా యాహ్వే వాక్కు వచ్చింది. యాహ్వే దృష్టిలో అతడు చేసిన సమస్త చెడునుబట్టి, తన చేతుల పనుల ద్వారా ఆయనకు కోపం పుట్టిస్తూ యరొబాము వంశంలా మారినందువల్ల, అలాగే దానిని నాశనం చేసినందువల్ల[a] ఆ వాక్కు వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతణ్ణి కొట్టివేసినందువల్ల.” హీబ్రూ ప్రత్యయం పుంలింగ ఏకవచనంలో ఉంది. అది యరొబామును వ్యక్తిగతంగా సూచించవచ్చు; అయితే సందర్భంలో అది యరొబాము వంశాన్ని సమష్టిగా సూచించడం ఎక్కువ సంభావ్యం.
    reason: చివరి హీబ్రూ పుంలింగ ఏకవచన ప్రత్యయం ఎవరిని లేదా దేనిని సూచిస్తుందో వ్యాకరణపరంగా పూర్తిగా నిర్దిష్టం కాదు; సందర్భానుకూలమైన వంశ/రాజవంశ అర్థాన్ని ప్రధాన పాఠంలో ఉంచి, వ్యక్తిగత అర్థాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
lexical_decisions:
- source_word: וְגַם
  choice: అంతేకాక
  rationale: మునుపటి తీర్పు సందర్భానికి కొనసాగింపును, అదనపు అంశాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בְּיַד
  choice: ద్వారా
  rationale: ప్రవక్త యాహ్వే సందేశాన్ని అందించిన మధ్యవర్తి అనే సాధనార్థక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דְּבַר יְהוָה
  choice: యాహ్వే వాక్కు
  rationale: ప్రవచన సూత్రంలోని ‘వాక్కు’ భావాన్నీ, దైవనామాన్ని నేరుగా పలికే మూలపాఠాన్నీ నిలుపుతుంది.
- source_word: אֶל ... וְאֶל
  choice: బయెషాకు, అతని వంశానికి వ్యతిరేకంగా
  rationale: אֶל యొక్క సాధారణ దిశార్థాన్ని తెలుగులో ‘-కు’తో ఉంచుతూ, ఈ తీర్పు సందర్భంలోని ప్రతికూల భావాన్ని ‘వ్యతిరేకంగా’ స్పష్టం చేస్తుంది.
- source_word: בֵּיתוֹ
  choice: అతని వంశం
  rationale: ఇక్కడ ‘ఇల్లు’ అనేది గృహాన్ని మాత్రమే కాక రాజవంశాన్ని సూచిస్తుంది; సందర్భంలో ‘వంశం’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: עַל כָּל הָרָעָה
  choice: అతడు చేసిన చెడు అంతటి నిమిత్తం
  rationale: తీర్పుకు కారణాన్ని తెలిపే עַל యొక్క కారణార్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యాహ్వే దృష్టిలో
  rationale: మూలంలోని మూల్యాంకన సూత్రాన్ని సహజమైన తెలుగు నుడికారంతో నిలుపుతుంది.
- source_word: לְהַכְעִיסוֹ
  choice: ఆయనకు కోపం పుట్టించి
  rationale: హిఫీల్ క్రియలోని ‘కోపానికి కారణమవడం’ అనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: בְּמַעֲשֵׂה יָדָיו
  choice: తన చేతుల పనులతో
  rationale: ఇది సాధారణ క్రియలనో, విగ్రహ సంబంధమైన పనులనో సూచించవచ్చు; ఆ అనిశ్చితిని పరిష్కరించకుండా మూలంలోని స్పష్టమైన రూపకాన్ని నిలుపుతుంది.
- source_word: לִהְיוֹת כְּבֵית יָרָבְעָם
  choice: యరొబాము వంశంలా అయినందుకు
  rationale: బయెషా యరొబాము వంశాన్ని చెడులో పోలిన ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְעַל אֲשֶׁר הִכָּה אֹתוֹ
  choice: అలాగే అతణ్ణి హతమార్చినందుకు
  rationale: పుంలింగ ఏకవచన ప్రత్యయాన్ని ప్రధాన పాఠంలో వ్యక్తిగా అనువదిస్తూ, సమష్టిగా వంశాన్ని సూచించే అవకాశాన్ని పాదటిప్పణిలో ఉంచుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం చతురక్షర దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది; ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా వ్యక్తినామంగా నిలుపుతుంది.
- issue: చివరి పుంలింగ ఏకవచన ప్రత్యయం אֹתוֹ యొక్క సూచన
  choice: అతణ్ణి
  alternative: దానిని—యరొబాము వంశాన్ని సమష్టిగా
  rationale: వ్యాకరణ రూపం పుంలింగ ఏకవచనం కాబట్టి ప్రధాన పాఠంలో వ్యక్తిసూచక రూపాన్ని ఉంచాం. అయితే సమీపంలోని ‘యరొబాము వంశం’ సమష్టి ఏకవచనంగా సూచించబడే అవకాశం ఉన్నందున దానిని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. పేర్లు తెలుగు బైబిలు వాడుకకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి. తీర్పు వాక్యంలోని దీర్ఘ కారణ శ్రేణిని డాష్‌లతో విభజించి పఠనసౌలభ్యం కల్పించాం; మూలంలోని కారణ సంబంధాలు, చివరి ప్రత్యయపు సందిగ్ధత నిలుపబడ్డాయి.
