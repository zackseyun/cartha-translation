  yaml_path: translation/ot/1_kings/016/016.yaml
  text: And the people who were camped there heard it said, “Zimri has conspired and has also struck down the king.” So all Israel made Omri, the commander of the army over Israel, king that day in the camp.
translation:
  language: te
  text: అక్కడ శిబిరం వేసి ఉన్న ప్రజలు, “జిమ్రీ కుట్ర చేశాడు; రాజును కూడా హతమార్చాడు” అని విన్నారు. కాబట్టి ఆ రోజే శిబిరంలో ఇశ్రాయేలీయులందరూ ఇశ్రాయేలు సైన్యాధిపతియైన ఒమ్రీని రాజుగా నియమించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם הַחֹנִים
  choice: అక్కడ మకాం వేసిన ప్రజలు
  rationale: חנה అనే క్రియ శిబిరం వేసి ఉండడాన్ని సూచిస్తుంది. సందర్భాన్ని బట్టి సహజమైన తెలుగులో ‘అక్కడ’ చేర్చబడింది.
- source_word: קָשַׁר
  choice: కుట్ర చేశాడు
  rationale: రాజుకు వ్యతిరేకంగా పన్నాగం లేదా తిరుగుబాటు చేయడం అనే భావాన్ని ఈ సందర్భంలో ‘కుట్ర చేశాడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: הִכָּה אֶת־הַמֶּלֶךְ
  choice: రాజును ... చంపేశాడు
  rationale: נכה సాధారణంగా ‘కొట్టాడు’ అని అర్థమయ్యే వీలున్నా, ఇక్కడ మునుపటి వచనంలోని రాజవధను సూచిస్తున్నందున ఫలితార్థమైన ‘చంపేశాడు’ సరైనది.
- source_word: וַיַּמְלִכוּ
  choice: రాజుగా నియమించారు
  rationale: హిఫీల్ రూపం ‘రాజుగా చేశారు/నియమించారు’ అనే అర్థాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘నియమించారు’ సహజంగా, గౌరవంగా ఉంటుంది.
- source_word: שַׂר צָבָא עַל־יִשְׂרָאֵל
  choice: సైన్యాధిపతియైన ఒమ్రీని ఇశ్రాయేలుకు రాజుగా
  rationale: עַל־יִשְׂרָאֵל ను రాజ్యపాలన వాక్యభాగంతో కలిపి, ఒమ్రీని ఇశ్రాయేలుకు రాజుగా చేసినట్లు చదవడం హెబ్రీ వాక్యనిర్మాణానికి అనుగుణం; ‘సైన్యాధిపతి’ ఒమ్రీ హోదాను తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనశైలికి తగిన సరళమైన, గౌరవప్రదమైన భాష. మూలంలోని సంఘటనల క్రమం, ‘కూడా’ అనే బలవాచకం నిలుపబడ్డాయి.
