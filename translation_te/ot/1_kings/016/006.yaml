  text: Baasha slept with his fathers and was buried in Tirzah[a], and Elah his son reigned in his place.
translation:
  language: te
  text: బయెషా తన పితరులతో నిద్రించాడు[a]. అతనిని తిర్సాలో సమాధి చేశారు. అతని కుమారుడైన ఏలా అతని స్థానంలో రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన పూర్వీకులతో.” “తన పితరులతో నిద్రించాడు” అనే హీబ్రూ నానుడి రాజు మరణాన్ని తెలిపే సంప్రదాయ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: నిద్రించాడు
  rationale: రాజు మరణాన్ని తెలిపే సంప్రదాయ హీబ్రూ ప్రయోగంలోని ‘నిద్రించాడు’ అనే రూపకాన్ని నిలుపుతుంది; దానిని నేరుగా ‘చనిపోయాడు’ అని వివరణాత్మకంగా మార్చదు.
- source_word: עִם אֲבֹתָיו
  choice: తన పితరులతో
  rationale: హీబ్రూలోని స్థిరమైన రాజవంశ మరణ ప్రకటనను సన్నిహితంగా అనుసరిస్తుంది. ‘తన పూర్వీకులతో’ అనేది సాధ్యమైన మరింత సాధారణ ప్రత్యామ్నాయం.
- source_word: וַיִּקָּבֵר
  choice: అతనికి … సమాధి చేశారు
  rationale: హీబ్రూ నిఫాల్ క్రియలోని కర్మణి భావాన్ని తెలుగులో సహజమైన అనిర్దిష్ట కర్త నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: בְּתִרְצָה
  choice: తిర్సాలో
  rationale: పట్టణం పేరుతో వచ్చిన ב ఉపసర్గను సహజంగా ‘లో’ అని అనువదించి, స్థలనామాన్ని లిప్యంతరీకరించింది.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: రాజ్య వారసత్వ సందర్భంలో ఏలా అధికారాన్ని స్వీకరించాడనే భావాన్ని సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֵלָה בְנוֹ
  choice: అతని కుమారుడైన ఏలా
  rationale: వ్యక్తి పేరు మరియు బంధాన్ని తెలుగులో సహజమైన క్రమంలో స్పష్టంగా అందిస్తుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: ప్రత్యక్ష రాజ్య వారసత్వం లేదా భర్తీ అనే సందర్భోచిత భావాన్ని స్పష్టంగా నిలుపుతుంది.
