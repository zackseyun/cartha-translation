translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ పేర్లైన שֶׁמֶר, שֹׁמְרוֹן మధ్య ఉన్న నామసంబంధం కనిపించేందుకు ‘షెమెరు’, ‘షోమ్రోను’ రూపాలు ఎంచుకోబడ్డాయి. మూలంలోని వరుస క్రియలను సహజ తెలుగు వాక్యప్రవాహంలో రెండు వాక్యాలుగా అమర్చాం.
