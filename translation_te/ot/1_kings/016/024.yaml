  verdict: revise
  source_fidelity: 'మొత్తంగా అర్థం మూలానికి దగ్గరగా ఉంది: కొనుగోలు, రెండు తలాంతుల వెండి, కొండపై నిర్మించడం, షెమెరు పేరుమీద పట్టణానికి పేరు పెట్టడం అన్నీ ఉన్నాయి. అయితే ‘షెమెరు దగ్గర నుంచి’ కంటే అమ్మకందారుని సూచించే ‘షెమెరు నుండి’ మరింత సూటిగా ఉంటుంది. ‘ఆ కొండ మీద నిర్మాణం చేసి’ అనేది కర్త చేసిన నిర్మాణాన్ని కొంత అస్పష్టంగా చేస్తుంది; ‘ఆ కొండపై కట్టించి/నిర్మించి’ అనే రూపం మూల క్రియను స్పష్టంగా ప్రతిబింబిస్తుంది.'
  naturalness: ‘రెండు తలాంతుల వెండికి’ సహజమే, కానీ ‘రెండు తలాంతుల వెండి చెల్లించి’ ఆధునిక తెలుగులో ధర చెల్లించి కొనుగోలు చేసిన భావాన్ని స్పష్టంగా, సజావుగా అందిస్తుంది. ‘కొండపై కట్టించి’ ఇక్కడ నేరుగా, సహజంగా ఉంటుంది.
  terminology: ‘తలాంతు’ బరువు-విలువ ప్రమాణంగా సరైనది. ‘షెమెరు’ మరియు ‘షోమ్రోను’ రూపాలు మూలంలోని నామసంబంధాన్ని తగినంతగా కాపాడుతున్నాయి. ‘కొండ యజమాని’ అనేది אֲדֹנֵי הָהָר యొక్క ఆస్తి-యాజమాన్య భావాన్ని సరిగా ఇస్తుంది.
