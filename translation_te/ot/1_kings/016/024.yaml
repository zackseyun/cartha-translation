- from: అతడు షెమెరు దగ్గర నుంచి షోమ్రోను కొండను రెండు తలాంతుల వెండికి[a] కొన్నాడు. ఆ కొండ మీద నిర్మాణం చేసి, తాను కట్టిన పట్టణానికి కొండ యజమాని షెమెరు పేరును బట్టి “షోమ్రోను” అని పేరు పెట్టాడు.[b]
  to: అతడు షెమెరు నుండి షోమ్రోను కొండను రెండు తలాంతుల వెండి చెల్లించి కొన్నాడు.[a] అతడు ఆ కొండపై కట్టించి, తాను కట్టిన పట్టణానికి కొండ యజమాని అయిన షెమెరు పేరుమీద షోమ్రోను అని పేరు పెట్టాడు.[b]
  rationale: సవరణలు అర్థాన్ని మార్చకుండా కొనుగోలు సంబంధాన్ని (‘షెమెరు నుండి’) మరియు కర్తృక నిర్మాణ చర్యను (‘ఆ కొండపై కట్టించి’) స్పష్టంచేస్తాయి. ‘పేరుమీద’ అనేది עַל שֵׁם యొక్క సాధారణ ఆధునిక తెలుగు నామకరణ ప్రయోగం; షెమెరు కొండ యజమాని అన్న వివరాన్ని అలాగే నిలిపాం. ఫుట్‌నోట్ గుర్తులు వాటి వాక్యాంశాలకు అనుగుణంగా ఉంచబడ్డాయి.
