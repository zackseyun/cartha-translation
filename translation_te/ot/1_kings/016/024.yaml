source:
  edition: WLC
  text: וַ/יִּ֜קֶן אֶת הָ/הָ֥ר שֹׁמְר֛וֹן מֵ֥/אֶת שֶׁ֖מֶר בְּ/כִכְּרַ֣יִם כָּ֑סֶף וַ/יִּ֨בֶן֙ אֶת הָ/הָ֔ר וַ/יִּקְרָ֗א אֶת שֵׁ֤ם הָ/עִיר֙ אֲשֶׁ֣ר בָּנָ֔ה עַ֣ל שֶׁם שֶׁ֔מֶר אֲדֹנֵ֖י הָ/הָ֥ר שֹׁמְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/024.yaml
  text: He bought the hill of Samaria from Shemer for two talents of silver[a], built on the hill, and called the name of the city that he built Samaria, after the name of Shemer[b], the owner of the hill.
translation:
  language: te
  text: అతడు షెమెరు నుండి షోమ్రోను కొండను రెండు తలాంతుల వెండి చెల్లించి కొన్నాడు.[a] అతడు ఆ కొండపై కట్టించి, తాను కట్టిన పట్టణానికి కొండ యజమాని అయిన షెమెరు పేరుమీద షోమ్రోను అని పేరు పెట్టాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తలాంతు’ అనేది పెద్ద బరువు ప్రమాణం; ఇక్కడ వెండి మొత్తాన్ని బరువు ప్రకారం తెలిపింది.
    reason: cultural_note
  - marker: b
    text: 'లేదా, మరింత సంక్షిప్తంగా: ‘తాను కట్టిన పట్టణానికి కొండ యజమాని షెమెరు పేరుమీద షోమ్రోను అని పేరు పెట్టాడు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: కొన్నాడు
  rationale: కנה ఇక్కడ ధర చెల్లించి ఆస్తిని సొంతం చేసుకోవడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘కొన్నాడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הָהָר
  choice: కొండ
  rationale: הַר అనే పదానికి పర్వతం లేదా కొండ అనే అర్థాలు ఉన్నాయి. పట్టణం కట్టే ఎత్తైన ప్రదేశం అనే సందర్భంలో ‘కొండ’ సహజమైన ఎంపిక.
- source_word: שֹׁמְרוֹן
  choice: షోమ్రోను
  rationale: హీబ్రూ స్థలనామంలోని ధ్వనిని నిలుపుతుంది; షెమెరు పేరుతో దానికి ఉన్న పదసంబంధం కూడా తెలుగులో కొంతవరకు కనిపిస్తుంది.
- source_word: מֵאֵת שֶׁמֶר
  choice: షెమెరు దగ్గర నుంచి
  rationale: ఈ విభక్తి ప్రయోగం కొనుగోలు చేసిన వ్యక్తి లేదా మూలాన్ని సూచిస్తుంది; తెలుగులో ఇది సహజమైన వ్యక్తీకరణ.
- source_word: בְּכִכְּרַיִם כָּסֶף
  choice: రెండు తలాంతుల వెండికి
  rationale: ద్వివచన రూపం రెండు తలాంతులను సూచిస్తుంది. כִּכָּר ఇక్కడ నాణెం కాక, విలువను నిర్ణయించే పెద్ద బరువు ప్రమాణం.
- source_word: וַיִּבֶן אֶת הָהָר
  choice: ఆ కొండ మీద నిర్మాణం చేసి
  rationale: అక్షరార్థంగా ‘కొండను కట్టాడు’ అని ఉన్నా, సందర్భార్థం కొండపై పట్టణ నిర్మాణం చేయడం. ‘నిర్మాణం చేసి’ అదనపు వివరాలు చేర్చకుండా తెలుగులో అర్థవంతంగా ఉంటుంది.
- source_word: וַיִּקְרָא אֶת שֵׁם הָעִיר
  choice: పట్టణానికి … పేరు పెట్టాడు
  rationale: హీబ్రూ నామకరణ నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַל שֵׁם שֶׁמֶר
  choice: షెమెరు పేరును బట్టి
  rationale: పట్టణం పేరు షెమెరు పేరుతో సంబంధం కలిగి ఉందని స్పష్టంగా తెలియజేస్తూ, మూలంలోని భావాన్ని నిలుపుతుంది.
- source_word: אֲדֹנֵי הָהָר
  choice: కొండ యజమాని
  rationale: אדון ఇక్కడ ప్రభువు లేదా పాలకుడు అనే భావంలో కాక, ఆస్తి యాజమాన్యాన్ని సూచిస్తుంది.
