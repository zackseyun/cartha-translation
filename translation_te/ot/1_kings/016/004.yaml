source:
  edition: WLC
  text: הַ/מֵּ֤ת לְ/בַעְשָׁא֙ בָּ/עִ֔יר יֹֽאכְל֖וּ הַ/כְּלָבִ֑ים וְ/הַ/מֵּ֥ת ל/וֹ֙ בַּ/שָּׂדֶ֔ה יֹאכְל֖וּ ע֥וֹף הַ/שָּׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/004.yaml
  text: Whoever belonging to Baasha dies in the city[a], the dogs will eat; and whoever belonging to him dies in the field[b], the birds of the heavens will eat.
translation:
  language: te
  text: బయెషాకు చెందినవారిలో పట్టణంలో చనిపోయేవారిని[a] కుక్కలు తింటాయి; అతనికి చెందినవారిలో పొలంలో చనిపోయేవారిని ఆకాశపు పక్షులు[b] తింటాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బయెషావారిలో.” హీబ్రూ పదబంధం బయెషాతో సంబంధమున్న లేదా అతనికి చెందినవారిని సూచిస్తుంది; బహుశా అతని కుటుంబం లేదా రాజవంశం ఉద్దేశించబడి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆకాశ పక్షులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת
  choice: చనిపోయేవారిని
  rationale: ఏ ఒక్కరినైనా సూచించే ఏకవచన కృదంతాన్ని తెలుగులో సహజమైన సాధారణ బహువచన రూపంతో వ్యక్తం చేశాం.
- source_word: לְבַעְשָׁא
  choice: బయెషాకు చెందినవారిలో
  rationale: లామెద్ సూచించే సంబంధం లేదా స్వామ్యాన్ని నిలుపుతూ, అది ప్రత్యేకంగా కుటుంబమా రాజవంశమా అని మూలపాఠం కంటే ఎక్కువగా నిర్దేశించలేదు.
- source_word: בָּעִיר
  choice: పట్టణంలో
  rationale: బేత్ విభక్తితో ఉన్న సరళ స్థానార్థాన్ని సహజ తెలుగులో ఇచ్చాం.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: కుక్కలు తింటాయి
  rationale: אָכַל యొక్క ప్రత్యక్ష అర్థమైన ‘తిను’ను నిలిపి, అనవసరంగా ‘మింగివేస్తాయి’ వంటి తీవ్ర పదాన్ని చేర్చలేదు.
- source_word: וְהַמֵּת לוֹ
  choice: అతనికి చెందినవారిలో ... చనిపోయేవారిని
  rationale: బయెషా నుండి ‘అతడు’కు మారిన మూలపాఠపు సర్వనామ మార్పును, మొదటి భాగంతో సమాంతరంగా నిలిపాం.
- source_word: בַּשָּׂדֶה
  choice: పొలంలో
  rationale: שׂדה యొక్క సాధారణ అర్థాన్ని తీసుకొని పట్టణం–పొలం వ్యత్యాసాన్ని నిలిపాం.
- source_word: עוֹף הַשָּׁמָיִם
  choice: ఆకాశ పక్షులు
  rationale: సమూహార్థక עוֹף ను తెలుగులో సహజమైన బహువచనంగా ఇచ్చి, הַשָּׁמַיִם ను ‘ఆకాశం’గా అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘బయెషాకు చెందినవారు’ అనే రూపం మూలంలోని సంబంధార్థాన్ని కాపాడుతూ ‘కుటుంబం’ లేదా ‘రాజవంశం’ అని అతిగా నిర్దిష్టం చేయదు. రెండు సమాంతర భాగాల నిర్మాణం నిలుపబడింది.
