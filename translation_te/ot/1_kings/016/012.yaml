  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּשְׁמֵ֣ד זִמְרִ֔י אֵ֖ת כָּל בֵּ֣ית בַּעְשָׁ֑א כִּ/דְבַ֤ר יְהוָה֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֶל בַּעְשָׁ֔א בְּ/יַ֖ד יֵה֥וּא הַ/נָּבִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/012.yaml
  text: So Zimri destroyed all the house of Baasha[b][a], according to the word of Yahweh that he had spoken against Baasha through Jehu the prophet.
translation:
  language: te
  text: అలా జిమ్రీ బయెషా వంశమంతటినీ[a] నాశనం చేశాడు. యెహోవా ప్రవక్తయైన యెహూ ద్వారా బయెషాకు విరోధంగా[b] పలికిన మాట ప్రకారమే ఇది జరిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘బయెషా ఇల్లంతటినీ.’ ఇక్కడ ‘ఇల్లు’ అంటే బయెషా రాజవంశం.
    reason: cultural_note
  - marker: b
    text: లేదా ‘బయెషాకు.’ హీబ్రూ విభక్తి అక్షరార్థంగా ‘కు’ అని ఉన్నా, ఇక్కడ అది అతనిపై ఉద్దేశించిన తీర్పు వాక్యాన్ని పరిచయం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁמֵד
  choice: నాశనం చేశాడు
  rationale: హిఫీల్ రూపం పూర్తిగా నాశనం చేయడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండి, విధానాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా మూల భావాన్ని తెలియజేస్తుంది.
- source_word: כָּל בֵּית בַּעְשָׁא
  choice: బయెషా వంశమంతటినీ
  rationale: రాజవంశ సందర్భంలో בֵּית అనేది భవనం లేదా కేవలం ఇంటివారిని కాక రాజవంశాన్ని సూచిస్తుంది; ‘వంశమంతటినీ’ ఆ భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: כִּדְבַר
  choice: మాట ప్రకారమే
  rationale: ముందుగా ప్రకటించిన యెహోవా వాక్యానికి అనుగుణంగా ఈ సంఘటన జరిగిందనే నెరవేర్పు భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన రూపంలో వ్యక్తిగత నామంగా ఉంచుతుంది.
- source_word: אֲשֶׁר דִּבֶּר
  choice: పలికిన
  rationale: ముందుగా పలికిన ప్రవచన వాక్యాన్ని సూచిస్తుంది; తెలుగు వాక్య నిర్మాణంలో కాలక్రమం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: אֶל בַּעְשָׁא
  choice: బయెషాకు విరోధంగా
  rationale: אֶל అక్షరార్థంగా ‘కు’ అయినప్పటికీ, ఇక్కడ తీర్పు వాక్యం బయెషాపై ఉద్దేశించబడినందున ‘విరోధంగా’ సందర్భబలాన్ని తెలియజేస్తుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదటిప్పణిలో నిలుపబడింది.
- source_word: בְּיַד יֵהוּא הַנָּבִיא
  choice: ప్రవక్తయైన యెహూ ద్వారా
  rationale: ‘చేతి ద్వారా’ అనే హీబ్రూ నుడికారం మధ్యవర్తిత్వం లేదా సాధనాన్ని సూచిస్తుంది; ‘ద్వారా’ ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా నిలుపుతుంది. ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా గుర్తించదగిన రూపం; ‘యాహ్వే’ కూడా శాస్త్రీయ లిప్యంతరీకరణగా సాధ్యమే.
- issue: אֶל בַּעְשָׁא లోని సంబంధ భావం
  choice: బయెషాకు విరోధంగా
  alternative: బయెషాకు
  rationale: సందర్భం బయెషాపై ప్రకటించిన తీర్పు కావడంతో ప్రతికూల దిశను ప్రధాన పాఠంలో స్పష్టం చేసింది; అయితే హీబ్రూ విభక్తి యొక్క అక్షరార్థ అనిశ్చితిని పాదటిప్పణిలో కాపాడింది.
- issue: בֵּית בַּעְשָׁא యొక్క పరిధి
  choice: బయెషా వంశం
  alternative: బయెషా ఇల్లు / ఇంటివారు
  rationale: రాజకీయ సందర్భంలో ‘ఇల్లు’ అనేది రాజవంశాన్ని సూచిస్తుంది. దీనిని ‘వంశం’గా అనువదించడం భౌతిక గృహమనే అపార్థాన్ని నివారిస్తుంది; సాంస్కృతిక నుడికారాన్ని పాదటిప్పణి వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. హీబ్రూ రాజవంశ నుడికారాన్ని పాఠ్యంలో స్పష్టీకరించి, మూలంలోని అక్షరార్థ రూపాన్ని పాదటిప్పణిలో ఉంచింది. ప్రవచన తీర్పు భావాన్ని తెలియజేస్తూనే אֶל యొక్క ప్రత్యామ్నాయ పఠనాన్ని సంరక్షించింది.
