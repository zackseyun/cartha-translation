source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ אַחְאָ֖ב אֶת הָ/אֲשֵׁרָ֑ה וַ/יּ֨וֹסֶף אַחְאָ֜ב לַ/עֲשׂ֗וֹת לְ/הַכְעִיס֙ אֶת יְהֹוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל מִ/כֹּ֨ל מַלְכֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/033.yaml
  text: Ahab also made the Asherah[a], and Ahab went on to do more to provoke Yahweh, the God of Israel, than all the kings of Israel who were before him.
translation:
  language: te
  text: అహాబు ఆ అషేరాను[a] చేశాడు. అహాబు తనకు ముందున్న ఇశ్రాయేలు రాజులందరికంటే ఇశ్రాయేలు దేవుడైన యెహోవాకు కోపం పుట్టించే పనులను ఇంకా ఎక్కువగా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అషేరా స్తంభం.’ హీబ్రూ పదం అషేరా దేవతను గానీ, ఆమెతో సంబంధమున్న ఆరాధనా వస్తువును గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేయించాడు
  rationale: עשה యొక్క ప్రాథమిక భావం ‘చేయడం/తయారుచేయడం.’ రాజు స్వయంగా తయారుచేశాడనే అపార్థం రాకుండా, తెలుగులో సహజమైన కారక రూపమైన ‘చేయించాడు’ వాడబడింది; ‘నిలబెట్టించాడు’ అని సంకుచితం చేయలేదు.
- source_word: הָאֲשֵׁרָה
  choice: ఆ అషేరాను
  rationale: ఈ పదం అషేరా దేవతను గానీ, ఆమెతో సంబంధమున్న ఆరాధనా వస్తువును గానీ సూచించవచ్చు. ‘అషేరా స్తంభం’ అని ప్రధాన పాఠంలో నిర్దిష్టం చేయకుండా మూలంలోని సందిగ్ధతను నిలిపింది.
- source_word: וַיּוֹסֶף ... לַעֲשׂוֹת
  choice: ఇంకా ఎన్నో పనులు చేశాడు
  rationale: יסף + క్రియార్థక రూపం కొనసాగింపు లేదా అధికతను తెలియజేస్తుంది. తరువాతి తులనాత్మక వాక్యభాగంతో కలిపి, అహాబు పూర్వ రాజులను మించిన కార్యాలు చేశాడనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְהַכְעִיס
  choice: కోపం పుట్టించేలా
  rationale: כעס యొక్క హిఫీల్ రూపం ‘కోపానికి ప్రేరేపించడం’ అనే కారక భావాన్ని ఇస్తుంది. తెలుగులో ‘కోపం పుట్టించేలా’ ఆ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించింది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: నిర్మాణ సంబంధాన్ని తెలుగులో సహజమైన విశేషణాత్మక అన్వయంతో అందించి, యెహోవాను ఇశ్రాయేలు దేవుడిగా గుర్తిస్తుంది.
- source_word: מִכֹּל מַלְכֵי יִשְׂרָאֵל אֲשֶׁר הָיוּ לְפָנָיו
  choice: తనకు ముందున్న ఇశ్రాయేలు రాజులందరికంటే
  rationale: מן సూచించే తులనను ‘అందరికంటే’తో, לְפָנָיו సూచించే పూర్వకాల స్థానాన్ని ‘తనకు ముందున్న’తో స్పష్టంగా అందించింది.
theological_decisions:
- issue: אֲשֵׁרָה యొక్క సూచన
  choice: ప్రధాన పాఠంలో ‘అషేరా’ అనే పదాన్నే ఉంచి, అది దేవతనా లేక ఆమెకు సంబంధించిన ఆరాధనా వస్తువా అని నిర్ణయించలేదు.
  alternative: ‘అషేరా స్తంభం’ లేదా ‘అషేరా దేవత’
  rationale: ఈ వచనం మాత్రమే సూచనను ఖచ్చితంగా నిర్ధారించదు. అందువల్ల మూలంలోని నిజమైన పదార్థ సందిగ్ధతను ప్రధాన పాఠంలో నిలిపి, పాదటిప్పణిలో రెండు అవకాశాలను తెలిపింది.
- issue: దైవనామం יְהוָה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం ఉన్నందున దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించింది; ఇది ప్రత్యేక మతశాఖ వ్యాఖ్యానాన్ని ప్రవేశపెట్టదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘అషేరా’ అనే సాంకేతిక పదాన్ని పాదటిప్పణితో వివరించి మూలంలోని సందిగ్ధతను కాపాడింది; వాక్యక్రమాన్ని సహజ తెలుగు ప్రవాహానికి అనుగుణంగా మార్చింది.
