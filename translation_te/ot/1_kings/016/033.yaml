revisions:
- from: అహాబు ఆ అషేరాను[a] కూడా చేయించాడు. తనకు ముందున్న ఇశ్రాయేలు రాజులందరికంటే ఇశ్రాయేలు దేవుడైన యెహోవాకు ఎక్కువగా కోపం పుట్టించేలా అహాబు ఇంకా ఎన్నో పనులు చేశాడు.
  to: అహాబు ఆ అషేరాను[a] చేశాడు. అహాబు తనకు ముందున్న ఇశ్రాయేలు రాజులందరికంటే ఇశ్రాయేలు దేవుడైన యెహోవాకు కోపం పుట్టించే పనులను ఇంకా ఎక్కువగా చేశాడు.
  rationale: The first verb is revised from the unsupported causative ‘చేయించాడు’ to the direct active ‘చేశాడు.’ The second sentence explicitly expresses Ahab’s continued/escalating conduct and the comparison with all preceding Israelite kings, without adding the unsupported idea that the actions were ‘many.’ The Asherah ambiguity and its footnote are retained.
