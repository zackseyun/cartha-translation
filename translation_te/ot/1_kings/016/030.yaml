source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ אַחְאָ֧ב בֶּן עָמְרִ֛י הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה מִ/כֹּ֖ל אֲשֶׁ֥ר לְ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/030.yaml
  text: Ahab son of Omri did what was evil in the sight of Yahweh[b][a], more than all who were before him.
translation:
  language: te
  text: ఒమ్రీ కుమారుడైన అహాబు యాహ్వే దృష్టిలో తనకంటే ముందున్న వారందరికంటే ఎక్కువగా చెడైనది చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేశాడు
  rationale: עשה అనే సాధారణ క్రియ הָרַעతో కలిసి ‘చెడైనది చేయడం’ అనే హీబ్రూ ప్రయోగాన్ని ఏర్పరుస్తుంది; ‘చేశాడు’ దానిని సహజంగా, అతివ్యాఖ్యానం లేకుండా అందిస్తుంది.
- source_word: הָרַע
  choice: చెడైనది
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న విశేషణం నామవాచకార్థంలో వాడబడింది; ‘చెడైనది’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని నైతిక మదింపును నిలుపుతుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో
  rationale: అక్షరార్థంగా ‘యెహోవా కళ్లలో’; ఇది యెహోవా మదింపు ప్రకారం అనే భావాన్ని తెలిపే హీబ్రూ నుడికారం. ‘దృష్టిలో’ తెలుగులో సహజమైన సమానార్థక ప్రయోగం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: మూలపాఠంలోని దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: מִכֹּל אֲשֶׁר לְפָנָיו
  choice: తనకంటే ముందున్న వారందరికంటే ఎక్కువగా
  rationale: తులనార్థక מִן మరియు కాలార్థక לְפָנָיו కలిసి అహాబు తనకు ముందున్న వారిని చెడులో మించాడని సూచిస్తాయి; ఈ రూపం ఆ తులనను స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: ఇది బిరుదు కాక వ్యక్తిగత దైవనామం. మూలంలోని పేరును నిలుపుతూ, సాధారణ తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించే ప్రత్యామ్నాయ రూపం.
- issue: ‘తనకంటే ముందున్న వారందరు’ ఎవరన్న పరిధి
  choice: మూలంలోని సాధారణ సూచనను అలాగే ఉంచడం
  alternative: తనకు ముందున్న రాజులందరు
  rationale: సందర్భంలో ఇశ్రాయేలు పూర్వ రాజులు ఉద్దేశించబడి ఉండవచ్చు; అయితే ఈ వచనం ‘రాజులు’ అనే నామవాచకాన్ని స్పష్టంగా ఇవ్వదు. అందువల్ల మూలంలోని సంక్షిప్తతను, స్వల్ప అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన వాక్య నిర్మాణం వాడబడింది. హీబ్రూ నుడికారాన్ని అక్షరానువాదంగా ‘కళ్లలో’ అని కాక సహజమైన ‘దృష్టిలో’ అని ఇచ్చాం; పోలికలోని ‘ఎక్కువగా’ అనే భావాన్ని స్పష్టంగా నిలిపాం.
