  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י זִמְרִ֔י וְ/קִשְׁר֖/וֹ אֲשֶׁ֣ר קָשָׁ֑ר הֲ/לֹֽא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/020.yaml
  text: The rest of the acts of Zimri[a], and his conspiracy that he carried out—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: te
  text: జిమ్రీ చేసిన మిగిలిన కార్యాలు, అతడు పన్నిన కుట్ర[a]—ఇవన్నీ ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథంలో రాయబడి ఉన్నాయి కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతడు కుట్ర పన్నిన అతని కుట్ర.” హెబ్రీలో నొక్కి చెప్పడానికి ఒకే మూలానికి చెందిన నామవాచకం, క్రియ వాడబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי זִמְרִי
  choice: జిమ్రీ చేసిన మిగిలిన కార్యాలు
  rationale: రాజుల పాలన సంగ్రహాల్లో דִּבְרֵי అనేది మాటలను మాత్రమే కాక వారి కార్యాలు, వ్యవహారాలను సూచిస్తుంది. ఈ సూత్రబద్ధమైన భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: וְקִשְׁרוֹ אֲשֶׁר קָשָׁר
  choice: అతడు పన్నిన కుట్ర
  rationale: קֶשֶׁר ఇక్కడ రాజుపై చేసిన రాజకీయ కుట్రను సూచిస్తుంది. హెబ్రీలోని నామవాచకం–సజాతీయ క్రియ పునరుక్తిని తెలుగు సహజ ప్రయోగమైన ‘కుట్ర పన్ను’ కొంతవరకు నిలుపుతుంది; మూడవ పురుష ఏకవచన సంబంధం ‘అతడు’ ద్వారా స్పష్టమవుతుంది.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: ఇవన్నీ ... రాయబడి ఉన్నాయి కదా?
  rationale: హెబ్రీ అలంకారప్రశ్నను ప్రకటనగా మార్చకుండా, తెలుగులో సహజమైన ‘కదా?’ రూపంలో నిలిపింది. బహువచన సూచనను ‘ఇవన్నీ’ వ్యక్తం చేస్తుంది.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: దినవృత్తాంతాల గ్రంథంలో
  rationale: ఇది రాజుల సంఘటనలను నమోదు చేసిన లిఖిత ఆధారాన్ని సూచించే సూత్రబద్ధ పదబంధం. עַל‌ను ఈ సందర్భంలో సహజ తెలుగు స్థానార్థకమైన ‘గ్రంథంలో’గా అనువదించింది.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజుల
  rationale: ఇక్కడ לְ గ్రంథ శీర్షికలో సంబంధార్థాన్ని కలిగివుంది; అందువల్ల ‘ఇశ్రాయేలు రాజుల’ అనేది సందర్భోచితం.
