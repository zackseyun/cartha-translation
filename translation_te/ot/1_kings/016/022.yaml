translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. రాజకీయ అనుబంధానికి ‘పక్షాన ఉన్న,’ విజయం లేదా ఆధిక్యానికి ‘పైచేయి సాధించారు’ అనే సహజ పదబంధాలు ఎంచుకున్నాం. మూలంలోని ఫలితక్రమాన్ని నిలుపుతూ, తిబ్నీ మరణ విధానం లేదా ప్రత్యక్ష కారణాన్ని అదనంగా ఊహించలేదు.
