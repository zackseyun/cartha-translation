source:
  edition: WLC
  text: וַ/יֶּחֱזַ֤ק הָ/עָם֙ אֲשֶׁ֣ר אַחֲרֵ֣י עָמְרִ֔י אֶת הָ/עָ֕ם אֲשֶׁ֥ר אַחֲרֵ֖י תִּבְנִ֣י בֶן גִּינַ֑ת וַ/יָּ֣מָת תִּבְנִ֔י וַ/יִּמְלֹ֖ךְ עָמְרִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/022.yaml
  text: But the people who followed Omri prevailed over the people who followed Tibni son of Ginath. So Tibni died[a], and Omri became king.
translation:
  language: te
  text: అయితే ఒమ్రీ పక్షాన ఉన్న ప్రజలు గీనతు కుమారుడైన తిబ్నీ పక్షాన ఉన్న ప్రజలపై పైచేయి సాధించారు.[a] అప్పుడు తిబ్నీ చనిపోయాడు; ఒమ్రీ రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కంటే బలవంతులయ్యారు,’ ‘మరింత బలపడ్డారు.’ హీబ్రూ క్రియ బలం పెరగడాన్ని లేదా ఆధిక్యం సాధించడాన్ని సూచించగలదు; ఇక్కడ ఒమ్రీ వర్గం అంతర్యుద్ధంలో పైచేయి సాధించిన భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: పైచేయి సాధించారు
  rationale: חזק అనే క్రియ ఇక్కడ אֶת తో కలిసి ఒక వర్గం ప్రత్యర్థి వర్గంపై బలంలో లేదా ఆధిపత్యంలో పైచేయి పొందిన భావాన్ని ఇస్తుంది. రాజకీయ అంతర్యుద్ధ సందర్భంలో ‘పైచేయి సాధించారు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: הָעָם אֲשֶׁר אַחֲרֵי עָמְרִי
  choice: ఒమ్రీ పక్షాన ఉన్న ప్రజలు
  rationale: אַחֲרֵי అక్షరార్థంగా ‘వెనుక’ అయినా, ఇక్కడ అది రాజకీయ మద్దతు లేదా అనుబంధాన్ని సూచిస్తుంది. ‘పక్షాన ఉన్న’ ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶת הָעָם אֲשֶׁר אַחֲרֵי תִּבְנִי
  choice: తిబ్నీ పక్షాన ఉన్న ప్రజలపై
  rationale: חזק తో వచ్చిన אֶת ఇక్కడ ప్రత్యర్థి వర్గంపై ఆధిక్యం సాధించడాన్ని సూచిస్తుంది. మొదటి వర్గంతో సమాంతర నిర్మాణాన్ని నిలుపుతూ ‘పక్షాన ఉన్న’ అని పునరావృతం చేయబడింది.
- source_word: תִּבְנִי בֶן גִּינַת
  choice: గీనతు కుమారుడైన తిబ్నీ
  rationale: בן వంశపరమైన గుర్తింపును సూచిస్తుంది. తెలుగు వాక్యప్రవాహానికి సహజంగా తండ్రి పేరు ముందుంచి ‘గీనతు కుమారుడైన తిబ్నీ’గా ఇచ్చాం.
- source_word: וַיָּמָת תִּבְנִי
  choice: అప్పుడు తిబ్నీ చనిపోయాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథన క్రమాన్ని ముందుకు తీసుకెళ్తుంది. ‘అప్పుడు’ సంఘటనల వరుసను తెలియజేస్తుంది; మరణానికి ప్రత్యక్ష కారణాన్ని మూలం చెప్పినదానికంటే బలంగా నిర్ధారించదు.
- source_word: וַיִּמְלֹךְ עָמְרִי
  choice: ఒమ్రీ రాజయ్యాడు
  rationale: מלך ఇక్కడ ప్రత్యర్థి మరణానంతరం ఒమ్రీ రాజ్యాధికారాన్ని పొందడాన్ని సూచిస్తుంది. ‘రాజయ్యాడు’ కేవలం పరిపాలించాడు అనే భావంకన్నా సింహాసనారోహణను స్పష్టంగా తెలియజేస్తుంది.
