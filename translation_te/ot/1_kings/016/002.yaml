source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֤ר הֲרִימֹתִ֨י/ךָ֙ מִן הֶ֣/עָפָ֔ר וָ/אֶתֶּנְ/ךָ֣ נָגִ֔יד עַ֖ל עַמִּ֣/י יִשְׂרָאֵ֑ל וַ/תֵּ֣לֶךְ בְּ/דֶ֣רֶךְ יָרָבְעָ֗ם וַֽ/תַּחֲטִא֙ אֶת עַמִּ֣/י יִשְׂרָאֵ֔ל לְ/הַכְעִיסֵ֖/נִי בְּ/חַטֹּאתָֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/002.yaml
  text: Because I raised you up from the dust and made you ruler over my people Israel[a], and you walked in the way of Jeroboam and caused my people Israel to sin, provoking me to anger by their sins,
translation:
  language: te
  text: “నేను నిన్ను ధూళిలోనుండి పైకి లేపి, నా ప్రజలైన ఇశ్రాయేలుమీద నాయకునిగా నియమించాను; నీవు యరొబాము మార్గంలో నడిచి, నా ప్రజలైన ఇశ్రాయేలు ప్రజలను పాపం చేయింపజేసి[a], వారి పాపాలవల్ల నాకు కోపం పుట్టించావు గనుక,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూ క్రియ కారణార్థక రూపంలో ఉంది; అంటే, “నా ప్రజలైన ఇశ్రాయేలు ప్రజలను పాపంలోకి నడిపించి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: గనుక
  rationale: తదుపరి వచనంలో వచ్చే తీర్పుకు కారణాన్ని పరిచయం చేసే హేతుబోధక ప్రయోగం. తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా చివర ఉంచబడింది.
- source_word: הֲרִימֹתִיךָ מִן הֶעָפָר
  choice: నిన్ను ధూళిలోనుండి పైకి లేపి
  rationale: తక్కువ స్థితినుండి రాజ్యాధికార స్థితికి ఎత్తడాన్ని సూచించే మూల రూపకాన్ని నిలుపుతుంది.
- source_word: וָאֶתֶּנְךָ נָגִיד
  choice: నాయకునిగా నియమించాను
  rationale: נָגִיד ఇక్కడ ఇశ్రాయేలుమీద నియమించబడిన పాలక నాయకుణ్ణి సూచిస్తుంది; ఆధునిక తెలుగులో ‘నాయకుడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: నా ప్రజలైన ఇశ్రాయేలుమీద
  rationale: దేవుని స్వామ్య భావమైన ‘నా ప్రజలు’నూ, పరిపాలనా సంబంధమైన ‘మీద’నూ కాపాడుతుంది.
- source_word: וַתֵּלֶךְ בְּדֶרֶךְ יָרָבְעָם
  choice: అయినా నీవు యరొబాము మార్గంలో నడిచి
  rationale: ‘మార్గంలో నడుచుట’ అనే ప్రవర్తనా రూపకాన్ని నిలుపుతుంది. దేవుడు పైకి లేపిన దానికి రాజు చూపిన విరుద్ధ స్పందనను తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘అయినా’ వాడబడింది.
- source_word: וַתַּחֲטִא אֶת עַמִּי יִשְׂרָאֵל
  choice: నా ప్రజలైన ఇశ్రాయేలుతో పాపం చేయించి
  rationale: חטא హిఫీల్ రూపంలోని కారణార్థక భావాన్ని నేరుగా తెలుపుతుంది; రాజు ప్రజలను పాపానికి కారణమైనాడనే బాధ్యతను నిలుపుతుంది.
- source_word: לְהַכְעִיסֵנִי
  choice: నాకు కోపం పుట్టించావు
  rationale: దేవునిపట్ల జరిగిన వ్యక్తిగత అవమానాన్నీ దాని ఫలితమైన కోపాన్నీ సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּחַטֹּאתָם
  choice: వారి పాపాలవల్ల
  rationale: בְ యొక్క సాధన/కారణ భావాన్ని, బహువచన ప్రత్యయాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘వారి పాపాలు’లోని బహువచన ప్రత్యయం ఎవరిని సూచిస్తుంది?
  choice: బయెషా పాపం చేయించిన ఇశ్రాయేలు ప్రజలను సూచించేలా ‘వారి పాపాలు’ అని అనువదించబడింది.
  alternative: యరొబాము మార్గంతో ముడిపడిన పాపాచారాలను, అందులో బయెషా పాలుపంచుకోవడాన్ని కూడా కలుపుకొని సాధారణంగా సూచించవచ్చు.
  rationale: వ్యాకరణపరంగా దీనికి వెంటనే ముందు ఉన్న ‘నా ప్రజలైన ఇశ్రాయేలు’ సహజ పూర్వపదం. ఈ పఠనం రాజు వారిని పాపానికి నడిపించిన బాధ్యతతోపాటు ప్రజలు చేసిన పాపాల బాధ్యతనూ ఉంచుతుంది.
- issue: וַ- సంధిని వ్యతిరేకార్థకంగా వ్యక్తం చేయాలా?
  choice: సందర్భంలోని బలమైన వ్యత్యాసాన్ని సహజ తెలుగులో చూపడానికి ‘అయినా’ అని అనువదించబడింది.
  alternative: రూపపరంగా మరింత నేరుగా ‘మరియు’ లేదా సంధి లేకుండా అనువదించవచ్చు.
  rationale: హీబ్రూ וַ- స్వయంగా తప్పనిసరిగా ‘అయినా’ అని అర్థం కాకపోయినా, దేవుడు అతన్ని పైకి లేపిన దానికి తరువాత అతని అవిధేయత మధ్య ఉన్న సందర్భసిద్ధ వ్యత్యాసం తెలుగులో ఈ అనుసంధానంతో స్పష్టమవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే రాజదైవిక ప్రకటనకు తగిన గంభీరతతో రూపొందించబడింది. వాక్యం తదుపరి వచనంలోని తీర్పుతో పూర్తవుతుందనే కారణంగా చివర కామా ఉంచబడింది.
