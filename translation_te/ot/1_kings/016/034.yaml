source:
  edition: WLC
  text: בְּ/יָמָ֞י/ו בָּנָ֥ה חִיאֵ֛ל בֵּ֥ית הָאֱלִ֖י אֶת יְרִיחֹ֑ה בַּ/אֲבִירָ֨ם בְּכֹר֜/וֹ יִסְּדָ֗/הּ ו/ב/שגיב צְעִיר/וֹ֙ הִצִּ֣יב דְּלָתֶ֔י/הָ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד יְהוֹשֻׁ֥עַ בִּן נֽוּן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/034.yaml
  text: In his days Hiel of Bethel rebuilt Jericho[a]. At the cost of Abiram his firstborn he laid its foundation, and at the cost of Segub his youngest he set up its gates[b], according to the word of Yahweh that he had spoken through Joshua son of Nun.
translation:
  language: te
  text: అతని కాలంలో బేతేలుకు చెందిన హీయేలు యెరికోను తిరిగి కట్టాడు[a]. తన జ్యేష్ఠ కుమారుడైన అబీరాము ప్రాణం మూల్యంగా దాని పునాది వేశాడు; తన అతి చిన్న కుమారుడైన సెగూబు ప్రాణం మూల్యంగా దాని ద్వారాలను నిలబెట్టాడు[b]. నూను కుమారుడైన యెహోషువ ద్వారా యెహోవా పలికిన మాట ప్రకారమే ఇదంతా జరిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘యెరికోను కట్టాడు.’ యెరికో ఇంతకుముందే నాశనం చేయబడినందువల్ల సందర్భానుసారంగా ‘తిరిగి కట్టాడు’ అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘తన జ్యేష్ఠ కుమారుడైన అబీరాముతో/అబీరాములో … తన అతి చిన్న కుమారుడైన సెగూబుతో/సెగూబులో.’ యెహోషువ 6:26లోని మాట నెరవేరే క్రమంలో ఈ పునర్నిర్మాణం ఆ కుమారుల ప్రాణాలను మూల్యంగా కోరిందనేది భావం.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיָמָיו
  choice: అతని కాలంలో
  rationale: ముందు ప్రస్తావించిన రాజు పరిపాలించిన కాలాన్ని సూచించే సహజమైన తెలుగు కాలప్రయోగం.
- source_word: בָּנָה
  choice: తిరిగి కట్టాడు
  rationale: క్రియకు అక్షరార్థంగా ‘కట్టాడు’ అని ఉన్నా, ముందే నాశనమైన యెరికో పట్టణం సందర్భంలో పునర్నిర్మాణ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: חִיאֵל בֵּית הָאֱלִי
  choice: బేతేలుకు చెందిన హీయేలు
  rationale: బేతేలుతో అతని ప్రాంతీయ సంబంధాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בַּאֲבִירָם בְּכֹרוֹ
  choice: తన జ్యేష్ఠ కుమారుడైన అబీరాము ప్రాణం మూల్యంగా
  rationale: హీబ్రూ ב ఉపసర్గలోని సాధన/పరిస్థితి భావాన్ని, యెహోషువ 6:26లోని శాపనెరవేర్పు సందర్భాన్ని ప్రతిబింబిస్తూ వ్యక్తం చేస్తుంది.
- source_word: יִסְּדָהּ
  choice: దాని పునాది వేశాడు
  rationale: పట్టణ నిర్మాణ సందర్భంలో יסד క్రియకు తగిన సహజమైన నిర్మాణ పదబంధం.
- source_word: וּבִשְׂגוּב צְעִירוֹ
  choice: తన చిన్న కుమారుడైన సెగూబు ప్రాణం మూల్యంగా
  rationale: మొదటి కుమారునికి సంబంధించిన సమాంతర నిర్మాణాన్ని నిలుపుతూ, צעירను కుటుంబ జన్మక్రమంలో ‘చిన్న కుమారుడు’గా అందిస్తుంది.
- source_word: הִצִּיב דְּלָתֶיהָ
  choice: దాని ద్వారాలను నిలబెట్టాడు
  rationale: పట్టణ సందర్భంలో דלתותను నగర ద్వారాలుగా, הציבను వాటిని స్థాపించడం లేదా నిలబెట్టడంగా అనువదిస్తుంది.
- source_word: כִּדְבַר יְהוָה
  choice: యెహోవా పలికిన మాట ప్రకారం
  rationale: దైవనామాన్ని స్పష్టంగా ఉంచి, మూలంలోని సూత్రబద్ధమైన ‘మాట ప్రకారం’ అనే భావాన్ని కాపాడుతుంది.
- source_word: אֲשֶׁר דִּבֶּר בְּיַד
  choice: ద్వారా ... పలికిన
  rationale: ביד అనే ప్రతినిధిత్వ ప్రయోగాన్ని తెలుగులో సహజమైన ‘ద్వారా’తో వ్యక్తం చేస్తుంది.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: నూను కుమారుడైన యెహోషువ
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని స్పష్టమైన ప్రామాణిక తెలుగు రూపంలో అందిస్తుంది.
theological_decisions:
- issue: హీయేలు కుమారులకు సంబంధించిన శాపనెరవేర్పు స్వభావం
  choice: యెరికో పునర్నిర్మాణంలో హీయేలు తన జ్యేష్ఠ కుమారుడు, చిన్న కుమారుడు ప్రాణాలను మూల్యంగా చెల్లించాడనే భావం
  alternative: నిర్మాణ దశలు కుమారుల జీవితకాలంలో జరిగాయని మాత్రమే సూచించే అక్షరానుసార పఠనం
  rationale: ఈ వాక్యం యెహోషువ 6:26ను స్పష్టంగా ప్రతిధ్వనిస్తుంది. ‘ప్రాణం మూల్యంగా’ అనేది కుమారుల మరణాన్ని వివరాలు జోడించకుండా సూచిస్తుంది; అయితే మూలంలోని ב ఉపసర్గ అక్షరరూపాన్ని పాదసూచికలో ఉంచి భాషాత్మక ఉద్రిక్తతను కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణంతో పాటు గంభీరమైన గ్రంథశైలిని పాటించింది. ‘జ్యేష్ఠ కుమారుడు,’ ‘పునాది,’ ‘ద్వారాలు’ వంటి పదాలు ఖచ్చితత్వం మరియు పఠనసౌలభ్యానికి సమతుల్యం కల్పిస్తాయి.
