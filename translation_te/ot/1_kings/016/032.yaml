  yaml_path: translation/ot/1_kings/016/032.yaml
  text: He set up an altar for Baal in the house of Baal[a], which he had built in Samaria.
translation:
  language: te
  text: అతడు సమరయలో తాను కట్టిన బయలు గృహంలో[a] బయలుకు ఒక బలిపీఠాన్ని నెలకొల్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బయలు మందిరంలో.’ హీబ్రూలో అక్షరార్థంగా ‘బయలు ఇంటిలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: నెలకొల్పాడు
  rationale: హిఫీల్ రూపంలోని קום ఇక్కడ ఒక బలిపీఠాన్ని నిలబెట్టడం లేదా ఏర్పాటు చేయడం అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘నెలకొల్పాడు’ సహజంగా ఉండి, స్థాపన భావాన్ని నిలుపుతుంది.
- source_word: מִזְבֵּחַ
  choice: ఒక బలిపీఠాన్ని
  rationale: מזבחకు ప్రామాణిక తెలుగు సమానార్థకం ‘బలిపీఠం’; ఇది బలులు అర్పించే పీఠాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: לַבָּעַל
  choice: బయలుకు
  rationale: లామెద్ ఇక్కడ అంకితం లేదా ఉద్దేశాన్ని సూచిస్తుంది; ‘బయలుకు’ అనేది ఆ బలిపీఠం బయలుకు అంకితమైనదని సహజంగా తెలియజేస్తుంది.
- source_word: בֵּית הַבַּעַל
  choice: బయలు మందిరంలో
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘బయలు ఇల్లు’; ఆరాధనా కట్టడాన్ని సూచించే సందర్భంలో ‘మందిరం’ ఆధునిక తెలుగు పాఠకులకు సహజంగా, స్పష్టంగా ఉంటుంది. అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֲשֶׁר בָּנָה
  choice: తాను కట్టించిన
  rationale: సాపేక్ష ఉపవాక్యం బయలు మందిరాన్నే విశేషిస్తుంది. రాజు స్వయంగా నిర్మాణం చేయడం కంటే నిర్మింపజేయడం సహజ సందర్భార్థం కాబట్టి ‘కట్టించిన’ వాడాం; ‘తాను’ దాని కర్తను స్పష్టం చేస్తుంది.
- source_word: בְּשֹׁמְרוֹן
  choice: సమరయలో
  rationale: שֹׁמְרוֹן స్థలనామానికి ప్రాచుర్యంలో ఉన్న తెలుగు రూపం ‘సమరయ’; בְּ స్థానాన్ని సూచిస్తుంది.
theological_decisions:
- issue: בֵּית הַבַּעַל పదబంధం అనువాదం
  choice: బయలు మందిరం
  alternative: బయలు ఇల్లు
  rationale: అక్షరార్థం ‘బయలు ఇల్లు’ అయినప్పటికీ, సందర్భంలో ఇది బయలు ఆరాధనకు నిర్మించిన ఆలయం. ‘మందిరం’ ఆ కార్యాన్ని సహజ తెలుగులో స్పష్టంగా తెలియజేస్తుంది; మూలంలోని రూపకల్పనను పాదసూచిక సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. వాక్యక్రమం తెలుగుకు అనుగుణంగా మార్చినా, మందిరం సమరయలో కట్టించబడిందనీ దానిలో బయలుకు బలిపీఠం నెలకొల్పబడిందనీ మూల సంబంధాలను కాపాడింది.
