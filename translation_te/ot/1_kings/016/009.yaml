  yaml_path: translation/ot/1_kings/016/009.yaml
  text: But his servant Zimri[a], commander of half the chariots, conspired against him while he was in Tirzah, drinking himself drunk in the house of Arza[b], who was over the household in Tirzah.
translation:
  language: te
  text: అతడు తిర్సాలో, తిర్సాలో రాజగృహానికి బాధ్యుడైన అర్సా ఇంటిలో మత్తు వచ్చేంతగా తాగుతూ ఉండగా, అతని సేవకుడైన జిమ్రీ—రథదళంలో సగ భాగానికి అధిపతి—అతనికి వ్యతిరేకంగా కుట్ర చేశాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తాగి మత్తెక్కుతూ ఉండగా.” హీబ్రూ వ్యక్తీకరణ తాగడం ద్వారా మత్తు కలుగుతున్న సజీవ చర్యను వర్ణిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “రాజగృహానికి బాధ్యుడు” అనేది ఒక పరిపాలనా హోదా; బహుశా రాజగృహం లేదా రాజప్రాసాద వ్యవహారాలను పర్యవేక్షించే అధికారిని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: అతనికి వ్యతిరేకంగా కుట్ర చేశాడు
  rationale: రాజవృత్తాంత సందర్భంలో קשר + עַל అనేది పాలకునికి వ్యతిరేకంగా రాజకీయ కుట్ర చేయడాన్ని సూచిస్తుంది; తెలుగు పదబంధం ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: עַבְדּוֹ
  choice: అతని సేవకుడు
  rationale: మూలపదానికి ‘సేవకుడు’ అనే ప్రాథమిక అర్థం ఉంది; రాజసభ సందర్భంలో అధికారి అనే భావం ఉండగలిగినా, వెంటనే జిమ్రీ సైనిక పదవి చెప్పబడుతున్నందున మూలంలోని సాధారణ పదాన్ని నిలిపాం.
- source_word: זִמְרִי
  choice: జిమ్రీ
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: שַׂר מַחֲצִית הָרָכֶב
  choice: రథదళంలో సగానికి అధిపతి
  rationale: רכב ఇక్కడ రథాల సమూహం లేదా రథసైన్యాన్ని సూచిస్తుంది. ‘రథదళం’ సైనిక భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; ‘సగానికి అధిపతి’ మూల నిర్మాణాన్ని నిలుపుతుంది.
- source_word: וְהוּא בְתִרְצָה
  choice: అతడు తిర్సాలో ... ఉన్నప్పుడు
  rationale: హీబ్రూ వాక్యంలోని పరిస్థితి సూచించే ఉపవాక్యాన్ని తెలుగులో సహజమైన కాలసూచక నిర్మాణంగా మార్చాం; సర్వనామాన్ని పేరుతో భర్తీ చేయకుండా మూలంలోని రూపాన్ని నిలిపాం.
- source_word: שֹׁתֶה שִׁכּוֹר
  choice: మత్తెక్కేలా తాగుతూ
  rationale: ఈ వ్యక్తీకరణ కేవలం ‘మత్తులో ఉన్నాడు’ అనే స్థితిని కాక, తాగుతూ మత్తు పొందుతున్న సజీవ చర్యను వర్ణిస్తుంది.
- source_word: בֵּית אַרְצָא
  choice: అర్సా ఇంట్లో
  rationale: తెలుగులో సహజమైన స్వామ్య నిర్మాణాన్ని ఉపయోగించాం.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: రాజగృహ బాధ్యత వహించే
  rationale: ఇది రాజగృహం లేదా రాజప్రాసాద పరిపాలనకు బాధ్యుడైన అధికారిని సూచించే పరిపాలనా బిరుదు; పదక్షరానువాదం కంటే అర్థస్పష్టమైన తెలుగు రూపాన్ని ఎంచుకున్నాం.
- source_word: בְּתִרְצָה
  choice: అక్కడి
  rationale: మూలంలో తిర్సా పేరు రెండుసార్లు ఉన్నా, తెలుగులో భారంగా కాకుండా రెండవ ప్రస్తావనను ‘అక్కడి’తో వ్యక్తం చేసి, అర్సా బాధ్యత తిర్సాలోనిదేనని నిలిపాం.
