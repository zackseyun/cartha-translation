translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే రాజవంశ కాలనిర్ణయ శైలి. ‘రాజయ్యాడు’ మరియు ‘పరిపాలించాడు’ ద్వారా సింహాసనారోహణకూ పాలనా వ్యవధికీ ఉన్న భేదం కాపాడబడింది. స్థలనామానికి మూల హెబ్రీ రూపానికి దగ్గరైన ‘షోమ్రోను’ వాడబడింది.
