source:
  edition: WLC
  text: וְ/אַחְאָ֣ב בֶּן עָמְרִ֗י מָלַךְ֙ עַל יִשְׂרָאֵ֔ל בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וּ/שְׁמֹנֶה֙ שָׁנָ֔ה לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ֠/יִּמְלֹךְ אַחְאָ֨ב בֶּן עָמְרִ֤י עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן עֶשְׂרִ֥ים וּ/שְׁתַּ֖יִם שָׁנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/029.yaml
  text: And Ahab son of Omri became king over Israel in the thirty-eighth year of Asa king of Judah, and Ahab son of Omri reigned over Israel in Samaria twenty-two years.
translation:
  language: te
  text: యూదా రాజైన ఆసా పరిపాలనలో ముప్పై ఎనిమిదవ సంవత్సరంలో ఒమ్రీ కుమారుడు అహాబు ఇశ్రాయేలుపై రాజయ్యాడు. ఒమ్రీ కుమారుడు అహాబు షోమ్రోనులో ఇశ్రాయేలును ఇరవై రెండు సంవత్సరాలు పరిపాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: రాజయ్యాడు
  rationale: రాజుల పరిపాలనకు సంబంధించిన ఈ సూత్రబద్ధ వాక్యంలో ఈ క్రియ సింహాసనారోహణను సూచిస్తుంది; తరువాత వచ్చే పరిపాలనా కాలవ్యవధి వాక్యంతో తేడాను నిలుపుతుంది.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: పరిపాలనలో ముప్పై ఎనిమిదవ సంవత్సరంలో
  rationale: హెబ్రీ కాలనిర్ణయ సూత్రంలోని క్రమసంఖ్య భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన ఆసా పరిపాలనలో
  rationale: లְ సూచించే ఆసా పరిపాలనను కాలనిర్ణయానికి ఆధారంగా స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: וַיִּמְלֹךְ
  choice: పరిపాలించాడు
  rationale: తరువాత పేర్కొన్న ఇరవై రెండు సంవత్సరాల పాలనా వ్యవధిని సూచించే కొనసాగిన రాజపాలన భావాన్ని అందిస్తుంది.
- source_word: בְּשֹׁמְרוֹן
  choice: షోమ్రోనులో
  rationale: בְּ యొక్క స్థానార్థాన్ని నిలుపుతూ, హెబ్రీ స్థలనామం שֹׁמְרוֹן‌ను నేరుగా లిప్యంతరీకరిస్తుంది.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: ఇరవై రెండు సంవత్సరాలు
  rationale: పాలనా కాలవ్యవధిని సూటిగా, సహజంగా తెలుగులో అందిస్తుంది.
- source_word: וְ
  choice: వాక్యాల అనుసంధానంలో అంతర్లీనంగా ఉంచబడింది
  rationale: హెబ్రీ וְ కథన పరంపరను కలుపుతుంది; అయితే విడి వచనంగా ఆధునిక తెలుగులో ఆరంభ ‘మరియు’ అసహజంగా ఉండటం వల్ల దాని అనుసంధాన కార్యాన్ని వాక్యప్రవాహంలో నిలిపాం.
