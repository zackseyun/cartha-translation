  text: בִּ/שְׁנַת֩ שְׁלֹשִׁ֨ים וְ/אַחַ֜ת שָׁנָ֗ה לְ/אָסָא֙ מֶ֣לֶךְ יְהוּדָ֔ה מָלַ֤ךְ עָמְרִי֙ עַל יִשְׂרָאֵ֔ל שְׁתֵּ֥ים עֶשְׂרֵ֖ה שָׁנָ֑ה בְּ/תִרְצָ֖ה מָלַ֥ךְ שֵׁשׁ שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/023.yaml
  text: In the thirty-first year of Asa king of Judah[a], Omri became king over Israel for twelve years; he reigned in Tirzah six years.
translation:
  language: te
  text: యూదా రాజైన ఆసా పరిపాలనలో ముప్పై ఒకటవ సంవత్సరంలో, ఒమ్రీ ఇశ్రాయేలుమీద రాజై మొత్తం పన్నెండు సంవత్సరాలు పరిపాలించాడు; తిర్సాలో అతడు ఆరు సంవత్సరాలు పరిపాలించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “ఒమ్రీ ఇశ్రాయేలుమీద పన్నెండు సంవత్సరాలు పరిపాలించాడు; తిర్సాలో ఆరు సంవత్సరాలు పరిపాలించాడు.” ఈ వాక్యం అతని మొత్తం పాలనాకాలాన్ని తిర్సాలో పరిపాలించిన ఆరు సంవత్సరాల నుండి వేరుచేస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/שְׁנַת ... שְׁלֹשִׁים וְ/אַחַת שָׁנָה
  choice: పరిపాలనలో ముప్పై ఒకటో సంవత్సరంలో
  rationale: ఇది రాజు పరిపాలన సంవత్సరాన్ని సూచించే హీబ్రూ కాలనిర్ణయ సూత్రం; ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉండేలా అనువదించబడింది.
- source_word: לְ/אָסָא מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన ఆసా
  rationale: לְ ఇక్కడ ఆసా పరిపాలన సంవత్సరంతో సంబంధాన్ని సూచిస్తుంది; ముందు ఉన్న ‘పరిపాలనలో’తో కలిపి ఈ భావం స్పష్టమవుతుంది.
- source_word: מָלַךְ
  choice: రాజై
  rationale: మొదటి ప్రయోగం సింహాసనాన్ని అధిష్ఠించి రాజు కావడాన్ని సూచిస్తుంది; అందువల్ల కేవలం కొనసాగుతున్న పాలనకన్నా ఆరంభ భావాన్ని నిలిపింది.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు
  rationale: מלך עַל అనే నిర్మాణం ప్రజలపై రాజ్యాధికారాన్ని సూచిస్తుంది; ‘ఇశ్రాయేలుకు రాజై’ అనేది సహజమైన తెలుగు ప్రయోగం.
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: మొత్తం పన్నెండు సంవత్సరాలు
  rationale: ఇది ఒమ్రీ పాలన యొక్క సంపూర్ణ వ్యవధి; తిర్సాలోని ఆరు సంవత్సరాల నుంచి దానిని స్పష్టంగా వేరుచేయడానికి ‘మొత్తం’ చేర్చబడింది.
- source_word: בְּ/תִרְצָה
  choice: తిర్సాలో
  rationale: בְּ ఇక్కడ పాలన జరిగిన కేంద్రస్థలాన్ని సూచించే స్థానార్థక విభక్తి.
- source_word: מָלַךְ שֵׁשׁ שָׁנִים
  choice: అతడు ఆరు సంవత్సరాలు పరిపాలించాడు
  rationale: రెండవ מָלַךְ కొనసాగిన పాలనను, ముఖ్యంగా తిర్సాలో గడిచిన కాలాన్ని సూచిస్తుంది.
