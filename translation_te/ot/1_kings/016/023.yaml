  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక వచనశైలి. ‘రాజై’ ద్వారా సింహాసనారోహణ భావాన్ని, ‘పరిపాలించాడు’ ద్వారా కొనసాగిన పాలనను వేరుచేసింది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
