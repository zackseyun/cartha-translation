source:
  edition: WLC
  text: אֶ֚ל כָּל חַטֹּ֣אות בַּעְשָׁ֔א וְ/חַטֹּ֖אות אֵלָ֣ה בְנ֑/וֹ אֲשֶׁ֣ר חָטְא֗וּ וַ/אֲשֶׁ֤ר הֶחֱטִ֨יאוּ֙ אֶת יִשְׂרָאֵ֔ל לְ/הַכְעִ֗יס אֶת יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל בְּ/הַבְלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/013.yaml
  text: because of all the sins of Baasha and the sins of Elah his son[a], which they committed and by which they caused Israel to sin, provoking Yahweh, the God of Israel, with their idols.
translation:
  language: te
  text: బయెషా చేసిన పాపాలన్నిటి కారణంగా, అతని కుమారుడైన ఏలా చేసిన పాపాల కారణంగా—వారు పాపం చేసి, ఇశ్రాయేలును పాపం చేయించి, తమ వ్యర్థమైన విగ్రహాలతో[a] ఇశ్రాయేలు దేవుడైన యాహ్వేకు కోపం పుట్టించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘తమ వ్యర్థమైనవాటితో’ లేదా ‘తమ నిస్సారమైనవాటితో.’ విగ్రహాలను తక్కువ చేసి చెప్పడానికి ఉపయోగించే సాధారణ పదప్రయోగం ఇది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל כָּל חַטֹּאות
  choice: చేసిన పాపాలన్నిటి కారణంగా
  rationale: ఇక్కడ אֶל ముందున్న తీర్పుకు కారణాన్ని సూచిస్తుంది. ‘కారణంగా’ అనే ప్రయోగం ఆ కారణార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; כָּל యొక్క సమగ్ర భావాన్ని ‘అన్నిటి’ నిలుపుతుంది.
- source_word: בַּעְשָׁא
  choice: బయెషా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ఉచ్చారణకు అనుకూలంగా లిప్యంతరీకరించాం.
- source_word: וְחַטֹּאות אֵלָה בְנוֹ
  choice: అతని కుమారుడు ఏలా చేసిన పాపాల కారణంగా
  rationale: ఏలా బయెషా కుమారుడని నిర్మాణం స్పష్టపరుస్తుంది; తెలుగు వాక్యప్రవాహం కోసం సంబంధాన్ని పేరుకు ముందు ఉంచాం.
- source_word: אֲשֶׁר חָטְאוּ
  choice: వారు తాము పాపం చేసి
  rationale: חטא యొక్క ప్రత్యక్ష భావాన్ని నిలుపుతూ, ఇద్దరు రాజుల స్వంత పాపాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַאֲשֶׁר הֶחֱטִיאוּ אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును పాపం చేయించి
  rationale: חטא హిఫీల్ రూపంలోని కారణార్థాన్ని ‘పాపం చేయించి’ నేరుగా నిలుపుతుంది.
- source_word: לְהַכְעִיס
  choice: కోపం పుట్టించారు
  rationale: ఈ సందర్భంలో దేవుణ్ణి రెచ్చగొట్టి కోపానికి గురిచేయడం అనే ఉద్దేశ్య/ఫలిత భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామాటన్‌ను బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంగా అందిస్తుంది.
- source_word: בְּהַבְלֵיהֶם
  choice: తమ వ్యర్థమైన విగ్రహాలతో
  rationale: הֶבֶל యొక్క ‘వ్యర్థత/నిస్సారత’ అనే నిందార్థాన్ని ‘వ్యర్థమైన’ నిలుపుతుంది; ఈ విగ్రహారాధనా సందర్భంలోని సూచిత వస్తువులను ‘విగ్రహాలు’ అని స్పష్టం చేస్తుంది. మూలంలోని విస్తృత పదార్థాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని వ్యక్తినామ స్వభావాన్ని నిలుపుతుంది.
- issue: בְּהַבְלֵיהֶם లో విగ్రహారాధన సూచన
  choice: తమ వ్యర్థమైన విగ్రహాలతో
  alternative: తమ వ్యర్థమైనవాటితో; తమ నిస్సారమైనవాటితో
  rationale: సందర్భం విగ్రహారాధనను సూచిస్తున్నప్పటికీ, మూలపదంలోని వ్యర్థత అనే వాదాత్మక నిందను కూడా నిలుపేందుకు రెండు భావాలను ప్రధాన పాఠ్యంలో కలిపాం; మరింత అక్షరార్థ రూపాలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. హీబ్రూ వాక్యం ముందటి తీర్పుకు కారణాన్ని తెలిపే నిర్మాణంగా మొదలవుతుంది; తెలుగులోనూ ‘కారణంగా’ అనే పునరుక్తితో ఆ సంబంధాన్ని నిలుపుతూ, డాష్ తరువాత వారి పాపం మరియు ఇశ్రాయేలును పాపం చేయించడం అనే సమాంతర నేరాలను స్పష్టంగా చూపించాం.
