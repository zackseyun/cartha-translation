translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ జాతీయం ప్రధాన పాఠంలో స్పష్టంగా అనువదించబడగా దాని మొరటైన అక్షరరూపం పాదసూచికలో భద్రపరచబడింది; גֹאֲלָיו లోని న్యాయపరమైన బహుఅర్థకతను కూడా పాదసూచికలో నిలిపాం.
