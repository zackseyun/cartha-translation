source:
  edition: WLC
  text: וַ/יְהִ֨י בְ/מָלְכ֜/וֹ כְּ/שִׁבְתּ֣/וֹ עַל כִּסְא֗/וֹ הִכָּה֙ אֶת כָּל בֵּ֣ית בַּעְשָׁ֔א לֹֽא הִשְׁאִ֥יר ל֖/וֹ מַשְׁתִּ֣ין בְּ/קִ֑יר וְ/גֹאֲלָ֖י/ו וְ/רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/011.yaml
  text: And it happened that when he became king[a], as soon as he sat on his throne, he struck down all the house of Baasha. He did not leave him a single male[b], or any of his kinsmen or his friends.
translation:
  language: te
  text: 'అతడు రాజైనప్పుడు ఇలా జరిగింది: అతడు తన సింహాసనం మీద కూర్చున్న వెంటనే బయెషా ఇంటివారందరినీ హతమార్చాడు. బయెషాకు ఒక్క మగవాడినీ కూడా[a] మిగలనివ్వలేదు; అతని బంధువులనూ[b], స్నేహితులనూ మిగలనివ్వలేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థం, “గోడకు మూత్రం పోసేవాడు”; ఇది మగవాణ్ణి సూచించే మొరటైన జాతీయం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అతని ప్రతీకారకులను,” “అతని విమోచకులను”; హీబ్రూ పదం కుటుంబపరమైన బాధ్యతలు గల సమీప బంధువును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְמָלְכוֹ
  choice: అతడు రాజైనప్పుడు
  rationale: హీబ్రూ కథన క్రమాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, בְמָלְכוֹ ఇక్కడ అతని రాజ్యారంభాన్ని సూచిస్తుందని ప్రతిబింబిస్తుంది.
- source_word: כְשִׁבְתּוֹ עַל כִּסְאוֹ
  choice: తన సింహాసనం మీద కూర్చున్న వెంటనే
  rationale: כְּ నిర్మాణం సందర్భంలో సూచించే తక్షణ కాలక్రమాన్ని ‘వెంటనే’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הִכָּה
  choice: హతమార్చాడు
  rationale: ఈ సందర్భంలో נכה ప్రాణాంతకంగా కొట్టడం లేదా చంపడం అనే అర్థంలో ఉంది; ‘హతమార్చాడు’ హింసాత్మక చర్యనూ దాని ఫలితాన్నీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: כָּל בֵּית בַּעְשָׁא
  choice: బయెషా వంశమంతటినీ
  rationale: ‘ఇల్లు’ అనే భౌతిక భావం కాకుండా రాజవంశం లేదా కుటుంబ పరంపర ఉద్దేశించబడింది; ‘వంశం’ ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: לֹא הִשְׁאִיר לוֹ
  choice: బయెషాకు ... మిగలనివ్వలేదు
  rationale: హీబ్రూలోని దత్తివాచక సర్వనామాన్ని అస్పష్టమైన ‘అతనికి’గా కాక, దాని సూచిత వ్యక్తి అయిన బయెషాను పేరుతో పేర్కొని సహజంగా అందిస్తుంది.
- source_word: מַשְׁתִּין בְּקִיר
  choice: ఒక్క మగవాణ్ణి కూడా
  rationale: ఇది పురుషుణ్ణి సూచించే మొరటైన హీబ్రూ జాతీయం. ప్రధాన పాఠంలో అర్థాన్ని సహజంగా ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: גֹאֲלָיו
  choice: అతని బంధువులను
  rationale: גאל మూలపదం కుటుంబ బాధ్యతలు కలిగిన సమీప బంధువును సూచించవచ్చు; సందర్భం నిర్దిష్టంగా విమోచకుడా ప్రతీకారకుడా అని తేల్చనందున విస్తృతమైన ‘బంధువులు’ ఎంచుకోబడింది.
- source_word: רֵעֵהוּ
  choice: స్నేహితులను
  rationale: רֵעַ అనే పదానికి స్నేహితుడు, సహచరుడు లేదా సహచారి అనే భావాలు ఉన్నాయి; ‘స్నేహితులు’ సాధారణంగా, సహజంగా అర్థాన్ని అందిస్తుంది.
