  yaml_path: translation/ot/1_kings/016/003.yaml
  text: Behold[a], I am sweeping away Baasha and his house, and I will make your house like the house of Jeroboam son of Nebat.
translation:
  language: te
  text: “ఇదిగో[a], నేను బయెషాను, అతని వంశాన్ని తుడిచిపెట్టివేయబోతున్నాను; నీ వంశాన్ని నెబాతు కుమారుడైన యరొబాము వంశంలా చేస్తాను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నేను బయెషా వెనుక, అతని ఇంటి వెనుక కాల్చివేస్తున్నాను/నాశనం చేస్తున్నాను.” ఈ హీబ్రూ నుడికారం బయెషా వంశాన్ని పూర్తిగా తొలగించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: ఇదిగో
  rationale: గంభీరమైన దైవిక ప్రకటనను పరిచయం చేసే ప్రవక్తల భాషా బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: מַבְעִיר אַחֲרֵי
  choice: తుడిచిపెట్టివేస్తాను
  rationale: בער హిఫీల్ రూపం, אַחֲרֵי కలిసిన ఈ సందర్భంలో, కేవలం అగ్నితో కాల్చే విధానాన్ని కాక సంపూర్ణంగా తొలగించే తీర్పును సూచిస్తుంది. తెలుగు పాఠకులకు అర్థమయ్యేలా దాని సందర్భార్థాన్ని వ్యక్తం చేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: בַעְשָׁא
  choice: బయెషా
  rationale: హీబ్రూ వ్యక్తినామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: בֵיתוֹ
  choice: అతని ఇంటివారు
  rationale: రాజవంశ తీర్పు సందర్భంలో בַּיִת కుటుంబం, ఇంటివారు, వంశం అనే విస్తృత భావాన్ని కలిగి ఉంది. ‘ఇంటివారు’ సాధారణ పాఠకునికి సహజంగా ఉండి కుటుంబ-వంశ భావాన్ని నిలుపుతుంది.
- source_word: וְנָתַתִּי
  choice: చేస్తాను
  rationale: ఈ నిర్మాణంలో נתן ‘ఇవ్వడం’ కంటే ఒకదాన్ని మరొకదానిలా చేయడం అనే భావం ఇస్తుంది.
- source_word: בֵיתְךָ
  choice: నీ ఇల్లు
  rationale: బయెషా కుటుంబం మరియు రాజవంశాన్ని సూచించే ‘ఇల్లు’ అనే హీబ్రూ రూపకాన్ని నిలుపుతుంది.
- source_word: כְבֵית
  choice: ఇంటిలా
  rationale: כְּ యొక్క సరళమైన పోలిక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: నెబాతు కుమారుడైన యరొబాము
  rationale: వ్యక్తినామం, పితృనామాన్ని తెలుగు వాక్యనిర్మాణానికి సహజంగా అందిస్తుంది.
theological_decisions:
- issue: బయెషా వంశంపై తీర్పు స్వభావం
  choice: ప్రధాన పాఠంలో సంపూర్ణ నిర్మూలనగా ‘తుడిచిపెట్టివేస్తాను’ అని అనువదించడం
  alternative: ‘బయెషా వెనుక కాల్చివేస్తున్నాను’ లేదా ‘దహించివేస్తున్నాను’ అని మరింత అక్షరార్థంగా అనువదించడం
  rationale: హీబ్రూ నుడికారం బయెషా ఇంటిపై సమగ్ర దైవిక తీర్పును ప్రకటిస్తుంది. అక్షరార్థ అనువాదం తెలుగులో అస్పష్టంగా ఉండి అగ్నినే తీర్పు విధానంగా అనవసరంగా నిర్దిష్టం చేయవచ్చు. ఎంపిక చేసిన పదబంధం తీర్పు తీవ్రతను నిలుపుతూ దాని ఫలితాన్ని స్పష్టంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీర ప్రవచన శైలి. ‘ఇదిగో’ ప్రకటన బలాన్ని, ‘ఇల్లు’ రాజకుటుంబం/వంశం అనే హీబ్రూ రూపకాన్ని నిలుపుతాయి.
