revisions:
- from: “ఇదిగో[a], నేను బయెషాను, అతని ఇంటివారిని తుడిచిపెట్టివేస్తాను; నీ ఇంటిని నెబాతు కుమారుడైన యరొబాము ఇంటిలా చేస్తాను.”
  to: “ఇదిగో[a], నేను బయెషాను, అతని వంశాన్ని తుడిచిపెట్టివేయబోతున్నాను; నీ వంశాన్ని నెబాతు కుమారుడైన యరొబాము వంశంలా చేస్తాను.”
  rationale: The revision retains the source's severe dynastic judgment and its impending force, while replacing potentially physical-house language with the contextually intended and parallel Telugu term ‘వంశం.’ The footnote continues to preserve the lexical alternative and the Hebrew idiom without over-specifying fire as the mechanism of judgment.
