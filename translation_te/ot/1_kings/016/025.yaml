source:
  edition: WLC
  text: וַ/יַּעֲשֶׂ֥ה עָמְרִ֛י הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יָּ֕רַע מִ/כֹּ֖ל אֲשֶׁ֥ר לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/025.yaml
  text: Omri did what was evil in the eyes of Yahweh[a], and he did more evil than all who were before him.
translation:
  language: te
  text: ఒమ్రీ యాహ్వే దృష్టిలో చెడు చేశాడు; తనకు ముందున్న వారందరికంటే ఎక్కువ చెడు చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తనకు ముందున్న వారందరికంటే మరింత చెడ్డవాడిగా ఉన్నాడు.” హీబ్రూ క్రియ ఒమ్రీ చేసిన పనులను గానీ, ఒమ్రీనే గానీ వర్ణిస్తున్నట్లు అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה הָרַע
  choice: చెడైనది చేశాడు
  rationale: ‘చెడు చేయడం’ అనే హీబ్రూ మూలంలోని స్థిరమైన మూల్యాంకన ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּעֵינֵי
  choice: దృష్టిలో
  rationale: అక్షరార్థంగా ‘కళ్లలో’ అయినా, ఒకరి మూల్యాంకనం లేదా అభిప్రాయాన్ని తెలిపే ఈ హీబ్రూ నుడికారానికి ‘దృష్టిలో’ సహజంగా, స్పష్టంగా సరిపోతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపంలో ఉంచుతుంది.
- source_word: וַיָּרַע
  choice: ఎక్కువ చెడు చేశాడు
  rationale: సందర్భంలోని తులనాత్మక భావాన్ని, ముందటి ‘చెడైనది చేశాడు’ అనే క్రియాత్మక మూల్యాంకనంతో కొనసాగిస్తుంది; అయితే ఈ క్రియ ఒమ్రీ స్వయంగా మరింత చెడ్డవాడయ్యాడనే భావాన్నీ అనుమతిస్తుంది.
- source_word: מִכֹּל אֲשֶׁר לְפָנָיו
  choice: తనకు ముందున్న వారందరికంటే
  rationale: ‘రాజులు’ అని మూలంలో లేని పదాన్ని చేర్చకుండా, అతనికి ముందున్న పాలకులను సూచించే భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయకుండా నిలుపుతుంది; ఆధునిక తెలుగు బైబిలు పాఠకులకు ‘యెహోవా’ రూపం ఎక్కువగా పరిచితం.
- issue: וַיָּרַע యొక్క కర్తృత్వ లేదా క్రియాత్మక భావం
  choice: ఎక్కువ చెడు చేశాడు
  alternative: మరింత చెడ్డవాడిగా ఉన్నాడు
  rationale: రాజుల ప్రవర్తనను మూల్యాంకనం చేసే సందర్భంలో క్రియాత్మక భావం సహజంగా సరిపోతుంది; హీబ్రూలోని నిజమైన ద్వంద్వార్థాన్ని పాదటిప్పణిలో చూపించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సంక్షిప్తంగా, గౌరవప్రదంగా ఉంది. హీబ్రూ మూలంలోని మూల్యాంకన ధోరణి, తులన, దైవనామం నిలుపబడ్డాయి.
