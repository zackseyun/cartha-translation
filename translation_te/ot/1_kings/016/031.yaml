  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִי֙ הֲ/נָקֵ֣ל לֶכְתּ֔/וֹ בְּ/חַטֹּ֖אות יָרָבְעָ֣ם בֶּן נְבָ֑ט וַ/יִּקַּ֨ח אִשָּׁ֜ה אֶת אִיזֶ֗בֶל בַּת אֶתְבַּ֨עַל֙ מֶ֣לֶךְ צִידֹנִ֔ים וַ/יֵּ֨לֶךְ֙ וַֽ/יַּעֲבֹ֣ד אֶת הַ/בַּ֔עַל וַ/יִּשְׁתַּ֖חוּ לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/031.yaml
  text: And as if it were a light thing for him to walk in the sins of Jeroboam son of Nebat[a], he took Jezebel daughter of Ethbaal, king of the Sidonians, as his wife, and went and served Baal and bowed down to him.
translation:
  language: te
  text: నెబాతు కుమారుడైన యెరోబాము పాపాల్లో నడవడం అతనికి అల్పమైన విషయమైనట్టుగా[a], అతడు సీదోనీయుల రాజైన ఎత్బయలు కుమార్తె యెజెబెలును భార్యగా చేసుకున్నాడు; వెళ్లి బయలును సేవించి, అతనికి సాష్టాంగపడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నెబాతు కుమారుడైన యెరోబాము పాపాల్లో నడవడం అతనికి అల్పమైన విషయమా...?” హెబ్రీ ప్రారంభ వాక్యం అలంకారిక ప్రశ్నగా కూడా అర్థమవుతుంది; ఆహాబు ఆ పాపాలను అల్పంగా పరిగణించినట్టు అది నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנָקֵל
  choice: తేలికైన విషయమైనట్టుగా
  rationale: హెబ్రీయుల అలంకారిక ప్రశ్న/జాతీయాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, ఆహాబు యెరోబాము పాపాలను అల్పంగా ఎంచి మరింత దూరం వెళ్లాడనే తీవ్రతను నిలుపుతుంది.
- source_word: לֶכְתּוֹ בְּחַטֹּאות
  choice: పాపాల్లో నడవడం
  rationale: ప్రవర్తనా విధానాన్ని సూచించే ‘నడచుట’ అనే బైబిలు రూపకాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: וַיִּקַּח אִשָּׁה אֶת אִיזֶבֶל
  choice: యెజెబెలును భార్యగా చేసుకున్నాడు
  rationale: అక్షరార్థమైన ‘భార్యగా తీసుకున్నాడు’ అనే భావాన్ని ఆధునిక, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: אֶתְבַּעַל
  choice: ఎత్బయలు
  rationale: ఫొనీషీయ రాజుని వ్యక్తినామాన్ని అనువదించకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించింది.
- source_word: צִידֹנִים
  choice: సీదోనీయులు
  rationale: బహువచన జాతివాచకాన్ని ‘సీదోను ప్రజలు’ అని విప్పకుండా సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וַיַּעֲבֹד אֶת הַבַּעַל
  choice: బయలును సేవించి
  rationale: ఆరాధనా సందర్భంలోని עבד క్రియకు ‘సేవించు’ అని ఇచ్చి, తరువాతి సాష్టాంగపడే చర్యతో ఉన్న వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: וַיִּשְׁתַּחוּ לוֹ
  choice: అతనికి సాష్టాంగపడ్డాడు
  rationale: క్రియలోని శరీరాన్ని వంచి నమస్కరించే నిర్దిష్ట భావాన్ని నిలుపుతూ, దానిని సాధారణ ‘ఆరాధించాడు’గా కలిపివేయదు.
theological_decisions:
- issue: యెరోబాము పాపాలనుంచి బయలు సేవకు ఆహాబు దిగజారిన తీవ్రత
  choice: యెరోబాము పాపాలను తేలికగా పరిగణించినట్టుగా ఆహాబు మరింత ముందుకు వెళ్లాడనే తీవ్రతను చూపించడం
  alternative: ‘యెరోబాము పాపాల్లో నడవడం అతనికి అల్పమైన విషయమా?’ అని ప్రత్యక్ష అలంకారిక ప్రశ్నగా అనువదించడం
  rationale: హెబ్రీ ప్రారంభ నిర్మాణం ప్రశ్నగా కూడా అర్థమవుతుంది; అయితే వాక్యసందర్భం ఆహాబు మునుపటి విగ్రహారాధనను అల్పంగా ఎంచి బయలు సేవలోకి మరింత దిగజారినట్టు సూచిస్తుంది. ప్రధాన పాఠం ఆ భావాన్ని సహజంగా ఇస్తూ, ప్రత్యామ్నాయ నిర్మాణాన్ని పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి. ‘పాపాల్లో నడవడం’ అనే గ్రంథరూపకాన్ని నిలిపి, ‘సేవించి’ మరియు ‘సాష్టాంగపడ్డాడు’ మధ్య మూలపాఠంలోని క్రియాభేదాన్ని కాపాడింది. వ్యక్తి, స్థల, జాతి పేర్లు తెలుగు బైబిలు పఠనానికి అనుకూలమైన రూపాల్లో ధ్వన్యంతరీకరించబడ్డాయి.
