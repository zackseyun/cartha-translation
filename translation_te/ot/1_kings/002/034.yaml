id: 1KI.2.34
reference: 1 Kings 2:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֗עַל בְּנָיָ֨הוּ֙ בֶּן יְה֣וֹיָדָ֔ע וַ/יִּפְגַּע בּ֖/וֹ וַ/יְמִתֵ֑/הוּ וַ/יִּקָּבֵ֥ר בְּ/בֵית֖/וֹ בַּ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/034.yaml
  text: Then Benaiah son of Jehoiada went up[a], struck him down, and put him to death[b]; and he was buried at his house in the wilderness.
translation:
  language: te
  text: అప్పుడు యెహోయాదా కుమారుడైన బెనాయా పైకి వెళ్లి, అతనిపై దాడి చేసి[a], అతన్ని చంపాడు; అతడు అరణ్యంలోని తన ఇంటివద్ద[b] పాతిపెట్టబడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతనిపై పడి అతన్ని చంపాడు.’ హీబ్రూలో దాడిని తెలిపే క్రియ, చంపడాన్ని తెలిపే క్రియ వేర్వేరుగా ఉన్నాయి; ప్రధాన పాఠం ఆ భేదాన్ని నిలిపింది.
    reason: lexical_alternative
  - marker: b
    text: ‘తన ఇంటివద్ద’ అనేది అరణ్యంలో ఉన్న అతని కుటుంబ ఆస్తి లేదా నివాసానికి చెందిన ప్రదేశాన్ని మరింత విస్తృతంగా సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: పైకి వెళ్లి
  rationale: עלה అనే క్రియకు ప్రాథమికంగా ‘పైకి వెళ్లు/ఎక్కు’ అనే అర్థం ఉంది. రాజాజ్ఞను అమలు చేయడానికి వెళ్లాడనే సందర్భార్థాన్ని అతిగా విపులీకరించకుండా, దాని దిశాసూచక భావాన్ని నిలిపింది.
- source_word: וַיִּפְגַּע בּוֹ
  choice: అతనిపై దాడి చేసి
  rationale: פגע ב అనే పదబంధం ఎదురుపడటం, మీదపడటం, దాడి చేయటం లేదా కొట్టటం అనే భావాలు ఇవ్వగలదు. ఇక్కడ మరణదండన సందర్భంలో శత్రుత్వ చర్యను స్పష్టంగా తెలియజేస్తూ, తరువాతి ‘చంపాడు’ అనే క్రియతో కలిపివేయకుండా వేరుగా ఉంచింది.
- source_word: וַיְמִתֵהוּ
  choice: అతన్ని చంపాడు
  rationale: מות యొక్క హిఫిల్ రూపం ‘చనిపోయేలా చేయటం/మరణానికి గురిచేయటం’ అనే కారణార్థక భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘చంపాడు’ సహజంగా ఉండి, ముందున్న దాడి క్రియకు వేరుగా హత్యను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּקָּבֵר
  choice: అతడు ... పాతిపెట్టబడ్డాడు
  rationale: నిఫాల్ రూపంలోని కర్మణి భావాన్ని నిలిపి, బెనాయా చేసిన చర్యల నుంచి యోవాబు సమాధి చేయబడటానికి కర్త మార్పును స్పష్టం చేస్తుంది.
- source_word: בְּבֵיתוֹ
  choice: తన ఇంటి దగ్గర
  rationale: בית ఇల్లు, ఇంటివారు లేదా కుటుంబ ఆస్తి/నివాస ప్రదేశాన్ని సూచించగలదు. సమాధి సందర్భంలో ఇంటి లోపల అని అపార్థం కాకుండా, నివాసానికి చెందిన ప్రదేశం అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో
  rationale: מדבר జనావాసం తక్కువైన అరణ్య లేదా ఎడారి ప్రాంతాన్ని సూచిస్తుంది. భూభాగ స్వరూపాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘అరణ్యం’ సాధారణ బైబిలు సందర్భానికి సరిపోతుంది.
