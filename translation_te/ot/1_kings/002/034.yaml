translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. హీబ్రూ వాక్యంలోని వరుస చర్యలు మరియు దాడి–చంపడం మధ్య ఉన్న క్రియా భేదం నిలిపివేయబడ్డాయి.
