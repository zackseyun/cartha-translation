source:
  edition: WLC
  text: וַ/תָּבֹ֤א בַת שֶׁ֨בַע֙ אֶל הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה לְ/דַבֶּר ל֖/וֹ עַל אֲדֹנִיָּ֑הוּ וַ/יָּקָם֩ הַ/מֶּ֨לֶךְ לִ/קְרָאתָ֜/הּ וַ/יִּשְׁתַּ֣חוּ לָ֗/הּ וַ/יֵּ֨שֶׁב֙ עַל כִּסְא֔/וֹ וַ/יָּ֤שֶׂם כִּסֵּא֙ לְ/אֵ֣ם הַ/מֶּ֔לֶךְ וַ/תֵּ֖שֶׁב לִֽ/ימִינֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/019.yaml
  text: So Bathsheba went to King Solomon to speak to him on behalf of Adonijah. The king rose to meet her and bowed down before her. Then he sat on his throne and had a throne placed for the king's mother, and she sat at his right hand.
translation:
  language: te
  text: అదోనీయా విషయమై అతనితో మాట్లాడడానికి బత్షెబా రాజైన సొలొమోను దగ్గరికి వెళ్లింది. రాజు ఆమెను ఎదుర్కొనడానికి లేచి, ఆమెకు వంగి నమస్కరించాడు. తర్వాత అతడు తన సింహాసనంపై కూర్చుని, రాజమాత కోసం ఒక సింహాసనం ఏర్పాటు చేయించాడు. ఆమె అతని కుడివైపున కూర్చుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל אֲדֹנִיָּהוּ
  choice: అదోనీయా తరఫున
  rationale: עַל సందర్భానుసారంగా ‘గురించి’ లేదా ‘తరఫున’ అని రావచ్చు; ఇక్కడ బత్షెబ అదోనీయా విజ్ఞప్తిని రాజుకు తెలియజేయడానికి రావడం వల్ల ‘తరఫున’ సందర్భాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּשְׁתַּחוּ לָהּ
  choice: ఆమెకు వంగి నమస్కరించాడు
  rationale: క్రియలోని శరీరాన్ని వంచి గౌరవం చూపే భావాన్ని స్పష్టంగా ఉంచుతుంది; దీనికి ఆరాధన అనే ప్రత్యేక మతార్థాన్ని జోడించదు.
- source_word: לְאֵם הַמֶּלֶךְ
  choice: రాజమాత కోసం
  rationale: అక్షరార్థంగా ‘రాజు తల్లి’; ఆధునిక తెలుగులో ‘రాజమాత’ అదే రాజసభా సంబంధాన్ని సహజంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: וַיָּשֶׂם כִּסֵּא
  choice: ఒక సింహాసనం వేయించాడు
  rationale: రాజు స్వయంగా పెట్టాడని తప్పనిసరిగా సూచించకుండా, అతని ఆదేశంతో ఆసనం ఏర్పాటు చేయబడిందనే సందర్భార్థాన్ని తెలుగులో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: సొలొమోను బత్షెబకు వంగడం యొక్క స్వభావం
  choice: ఆమెకు వంగి నమస్కరించాడు
  alternative: ఆమె ముందు సాష్టాంగపడ్డాడు
  rationale: హీబ్రూ క్రియ గౌరవార్థకంగా వంగడాన్ని కూడా సూచిస్తుంది. ఈ రాజసభా సందర్భంలో ఆరాధన లేదా సంపూర్ణ సాష్టాంగప్రణామం అనే భావాన్ని బలవంతంగా చేర్చకుండా మూలంలోని చర్యను నిలుపుతుంది.
- issue: עַל ద్వారా బత్షెబ మాటల ఉద్దేశం
  choice: అదోనీయా తరఫున
  alternative: అదోనీయా గురించి
  rationale: తదుపరి సందర్భంలో ఆమె అతని అభ్యర్థనను సమర్పిస్తుంది. అందువల్ల మధ్యవర్తిత్వ భావాన్ని చూపే ‘తరఫున’ అనుకూలం; అయితే పదబంధానికి ‘గురించి’ అనే విస్తృత సాధ్యత ఉందని గుర్తించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజసభా గౌరవాన్ని నిలుపుతూ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్య నిర్మాణం. పొడవైన హీబ్రూ సమన్వయ వాక్యాన్ని చర్యల క్రమం స్పష్టంగా ఉండేలా చిన్న వాక్యాలుగా విభజించాం.
