translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. హీబ్రూ వాక్యంలోని వరుస చర్యలు, షిమీ పేరును రెండోసారి చెప్పడం నిలుపబడ్డాయి.
