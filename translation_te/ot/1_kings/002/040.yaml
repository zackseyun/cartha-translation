- from: అప్పుడు షిమీ లేచి, తన గాడిదకు జీను కట్టి, తన దాసులను[a] వెదకడానికి గాతులోని ఆకీషు దగ్గరికి వెళ్లాడు. షిమీ వెళ్లి, గాతు నుండి తన దాసులను తీసుకొచ్చాడు.
  to: అప్పుడు షిమీ లేచి, తన గాడిదకు జీను కట్టి, తన దాసులను[a] వెదకడానికి గాతుకు, ఆకీషు దగ్గరికి వెళ్లాడు. షిమీ వెళ్లి గాతు నుండి తన దాసులను తీసుకొచ్చాడు.
