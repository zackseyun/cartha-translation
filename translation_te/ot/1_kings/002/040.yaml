id: 1KI.2.40
reference: 1 Kings 2:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֣קָם שִׁמְעִ֗י וַֽ/יַּחֲבֹשׁ֙ אֶת חֲמֹר֔/וֹ וַ/יֵּ֤לֶךְ גַּ֨תָ/ה֙ אֶל אָכִ֔ישׁ לְ/בַקֵּ֖שׁ אֶת עֲבָדָ֑י/ו וַ/יֵּ֣לֶךְ שִׁמְעִ֔י וַ/יָּבֵ֥א אֶת עֲבָדָ֖י/ו מִ/גַּֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/040.yaml
  text: Then Shimei arose[a], saddled his donkey, and went to Gath, to Achish, to look for his servants. Shimei went and brought his servants back from Gath.
translation:
  language: te
  text: అప్పుడు షిమీ లేచి, తన గాడిదకు జీను కట్టి, తన దాసులను[a] వెదకడానికి గాతుకు, ఆకీషు దగ్గరికి వెళ్లాడు. షిమీ వెళ్లి గాతు నుండి తన దాసులను తీసుకొచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సేవకులను.” హీబ్రూ పదం עֲבָדָיו సేవకులను లేదా దాసులను సూచించగలదు; ఇక్కడ వారు పారిపోయి, షిమీ వారిని తీసుకురావడానికి వెళ్లిన సందర్భం వల్ల “దాసులు” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: లేచి
  rationale: קום అనే క్రియ కథన క్రమంలో ‘లేచాడు/లేచి’ అని అర్థమిస్తుంది; తెలుగులో తరువాతి క్రియలతో సహజంగా అనుసంధానించడానికి ‘లేచి’ వాడబడింది.
- source_word: וַיַּחֲבֹשׁ אֶת חֲמֹרוֹ
  choice: తన గాడిదకు జీను కట్టి
  rationale: ప్రయాణ సందర్భంలో חבש అంటే గాడిదను స్వారీకి సిద్ధం చేయడం, ప్రత్యేకంగా జీను కట్టడం.
- source_word: גַּתָה אֶל־אָכִישׁ
  choice: గాతులోని ఆకీషు దగ్గరికి
  rationale: దిశను సూచించే రూపం గాతుకు వెళ్లడాన్ని తెలియజేస్తుంది; ఆకీషు అక్కడ ఉన్న గమ్యవ్యక్తి. ఆధునిక తెలుగులో ఈ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְבַקֵּשׁ
  choice: వెదకడానికి
  rationale: בקש ఇక్కడ తప్పిపోయిన లేదా పారిపోయిన వ్యక్తులను వెదకడాన్ని సూచిస్తుంది; ‘వెదకడానికి’ స్పష్టమైన, సహజమైన కథన భాష.
- source_word: עֲבָדָיו
  choice: తన దాసులను
  rationale: עבד అంటే ‘సేవకుడు’ లేదా ‘దాసుడు’ కావచ్చు. ముందరి సందర్భంలో వారు షిమీ నుండి పారిపోయి, అతడు వారిని తిరిగి స్వాధీనపరచుకోవడానికి వెళ్లడం వల్ల బంధిత స్థితిని సూచించే ‘దాసులు’ సందర్భానికి సరిపోతుంది; పదంలోని విస్తృత అర్థాన్ని పాదటిప్పణి నిలుపుతుంది.
- source_word: וַיָּבֵא אֶת־עֲבָדָיו מִגַּת
  choice: గాతు నుండి తన దాసులను తీసుకొచ్చాడు
  rationale: Hiphil రూపంలోని בוא ‘తీసుకురావడం’ అని అర్థం. ‘తీసుకొచ్చాడు’ తెలుగులో మూలంలోని కార్యాన్ని సహజంగా తెలియజేస్తుంది; ‘తిరిగి’ అనే పదాన్ని మూలంలో ప్రత్యేకంగా లేకపోవడం వల్ల చేర్చలేదు.
