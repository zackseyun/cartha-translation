source:
  edition: WLC
  text: וְ/עַתָּ֗ה חַי יְהוָה֙ אֲשֶׁ֣ר הֱכִינַ֗/נִי ו/יושיבי/ני עַל כִּסֵּא֙ דָּוִ֣ד אָבִ֔/י וַ/אֲשֶׁ֧ר עָֽשָׂה לִ֛/י בַּ֖יִת כַּ/אֲשֶׁ֣ר דִּבֵּ֑ר כִּ֣י הַ/יּ֔וֹם יוּמַ֖ת אֲדֹנִיָּֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/024.yaml
  text: And now[a], as Yahweh lives, who has established me and seated me on the throne of David my father, and who has made for me a house as he promised, surely Adonijah shall be put to death today.
translation:
  language: te
  text: ఇప్పుడు, నన్ను స్థిరపరచి, నా తండ్రి దావీదు సింహాసనంపై నన్ను కూర్చోబెట్టి, తాను వాగ్దానం చేసినట్లుగా నాకు ఒక గృహాన్ని[a] ఏర్పరచిన యాహ్వే జీవముతోడు—అదోనీయా ఈ రోజే తప్పకుండా చంపబడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాకు ఒక రాజవంశాన్ని స్థాపించాడు.’ ఇక్కడ ‘గృహం’ అనేది భౌతిక భవనం కంటే నిలకడైన రాజవంశాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: యాహ్వే జీవం తోడు
  rationale: ఇది హెబ్రీయుల ప్రమాణ సూత్రం. తెలుగులో సహజమైన ప్రమాణ భాషను ఉపయోగిస్తూ యాహ్వే సజీవుడనే స్పష్టమైన భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ ధ్వన్యంతరీకరణను ఉపయోగించింది.
- source_word: הֱכִינַנִי
  choice: నన్ను స్థిరపరచి
  rationale: כון అనే క్రియకు ఇక్కడ స్థిరపరచడం, దృఢంగా నెలకొల్పడం అనే రాజసంబంధ భావం ఉంది.
- source_word: וַיּוֹשִׁיבֵנִי עַל כִּסֵּא
  choice: సింహాసనం మీద నన్ను కూర్చోబెట్టి
  rationale: హిఫీల్ రూపంలోని కారణార్థాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: כִּסֵּא דָּוִד אָבִי
  choice: నా తండ్రి దావీదు సింహాసనం
  rationale: హెబ్రీ నిర్మాణంలోని సంబంధాన్ని సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: עָשָׂה לִי בַּיִת
  choice: నాకు ఒక గృహాన్ని ఏర్పరచిన
  rationale: మూలంలోని ‘గృహం’ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, రాజవంశ భావాన్ని పాదసూచికలో తెలియజేస్తుంది. ‘ఏర్పరచిన’ అనే పదం ఈ సందర్భంలోని స్థాపన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: తాను వాగ్దానం చేసినట్లుగా
  rationale: అక్షరార్థంగా ‘మాట్లాడినట్లుగా’ అయినప్పటికీ, ఇక్కడ దేవుని నిబద్ధమైన వాగ్దానమే సందర్భార్థం.
- source_word: כִּי
  choice: తప్పకుండా
  rationale: ప్రమాణానంతరం వచ్చే ప్రకటనలోని నిశ్చయార్థక బలాన్ని తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַיּוֹם
  choice: ఈ రోజే
  rationale: కాలాన్ని మాత్రమే కాక, ఆ రోజునే జరిగే విషయమనే ఉద్ఘాటనను కూడా సహజంగా తెలియజేస్తుంది.
- source_word: יוּמַת
  choice: మరణశిక్ష పొందుతాడు
  rationale: מות క్రియ యొక్క హోఫాల్ రూపంలో ఉన్న కర్మణి-కారణార్థాన్ని, రాజాజ్ఞ ద్వారా చంపబడతాడనే భావంతో స్పష్టంగా అందిస్తుంది.
- source_word: אֲדֹנִיָּהוּ
  choice: అదోనీయా
  rationale: హెబ్రీ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న ధ్వన్యంతరీకరణ.
theological_decisions:
- issue: రాజ ఒడంబడిక భాషలో ‘గృహం’ అనే పదం అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘గృహం’ అనే రూపకాన్ని నిలిపి, రాజవంశ భావాన్ని పాదసూచికలో వివరించడం
  alternative: ప్రధాన పాఠ్యంలోనే ‘రాజవంశం’ అని అనువదించడం
  rationale: בַּיִת అనే పదం ఈ రాజసంబంధ సందర్భంలో నిలిచే వంశపారంపర్య రాజకుటుంబాన్ని సూచించే అవకాశం బలంగా ఉంది. అయినా మూలపాఠ్యం ‘గృహం’ అనే పదాన్నే ఉపయోగిస్తున్నందున, దావీదుకు ఇచ్చిన వాగ్దానంతో ఉన్న అంతర్పాఠ్య సంబంధాన్ని కాపాడి, దాని భావాన్ని పాదసూచికలో స్పష్టం చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన రాజప్రమాణ శైలిని నిలిపింది. వాక్యం మూలంలోని ప్రమాణ నిర్మాణాన్ని అనుసరిస్తూనే సాధారణ పాఠకులకు సహజంగా ఉండేలా రూపొందించబడింది.
