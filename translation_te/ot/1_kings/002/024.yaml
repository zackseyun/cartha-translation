  to: ఇప్పుడు, నన్ను స్థిరపరచి, నా తండ్రి దావీదు సింహాసనంపై నన్ను కూర్చోబెట్టి, తాను వాగ్దానం చేసినట్లుగా నాకు ఒక గృహాన్ని[a] ఏర్పరచిన యాహ్వే జీవముతోడు—అదోనీయా ఈ రోజే తప్పకుండా చంపబడతాడు.
