    rationale: తెలుగులో స్థిరమైన ప్రమాణప్రయోగంగా ‘యాహ్వే జీవముతోడు’ మరింత సహజంగా ఉంటుంది; మూలంలోని ‘యాహ్వే జీవమున్నాడు’ అనే ప్రమాణబలాన్ని నిలుపుతుంది.
