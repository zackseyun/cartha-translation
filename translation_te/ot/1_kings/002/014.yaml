  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి. హీబ్రూ నుడికారాన్ని ప్రధాన పాఠంలో అర్థసహజంగా అనువదించి, అక్షర రూపాన్ని పాదసూచికలో తెలిపింది.
