- source_word: וַיֹּאמֶר
  choice: అప్పుడు అతడు ... అన్నాడు
  rationale: కథన క్రమాన్ని కొనసాగించే wayyiqtol రూపం; ‘అప్పుడు’ సహజమైన తెలుగు కథన ప్రవాహాన్ని ఇస్తుంది.
- source_word: דָּבָר לִי אֵלָיִךְ
  choice: నీతో ఒక విషయం చెప్పాలి
  rationale: అక్షరార్థంగా ‘నాకు నీ వైపు ఒక మాట/విషయం ఉంది’; సందర్భంలో మాట్లాడవలసిన విషయం ఉందనే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַתֹּאמֶר
  choice: ఆమె ... అంది
  rationale: స్త్రీలింగ క్రియారూపాన్ని స్పష్టంగా నిలుపుతూ సంభాషణలోని వరుస ప్రతిస్పందనను సహజంగా అందిస్తుంది.
- source_word: דַּבֵּר
  choice: చెప్పు
  rationale: దּבר క్రియ యొక్క ఆజ్ఞార్థక రూపం; ఈ సంభాషణలో సంక్షిప్తమైన, సహజమైన తెలుగు సమానార్థకం.
