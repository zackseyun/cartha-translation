id: 1KI.2.16
reference: 1 Kings 2:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁאֵלָ֤ה אַחַת֙ אָֽנֹכִי֙ שֹׁאֵ֣ל מֵֽ/אִתָּ֔/ךְ אַל תָּשִׁ֖בִי אֶת פָּנָ֑/י וַ/תֹּ֥אמֶר אֵלָ֖י/ו דַּבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/016.yaml
  text: And now I am asking one request of you; do not turn away my face. And she said to him[a], “Speak.”
translation:
  language: te
  text: ఇప్పుడు నేను నీతో ఒక విన్నపం చేస్తున్నాను; నా ముఖాన్ని వెనక్కి తిప్పవద్దు[a]. అప్పుడు ఆమె అతనితో, “చెప్పు” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ జాతీయం: “నా ముఖాన్ని వెనక్కి తిప్పవద్దు”; అంటే “నన్ను తిరస్కరించకు” లేదా “నా విన్నపాన్ని కాదనకు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: సంభాషణలో తదుపరి అంశాన్ని ప్రవేశపెట్టే సూచకం; తెలుగులో ‘ఇప్పుడు’ సహజంగా అనుసంధానాన్ని తెలియజేస్తుంది.
- source_word: שְׁאֵלָה אַחַת
  choice: ఒక విన్నపం
  rationale: שְׁאֵלָה ఇక్కడ అడిగే మనవి లేదా అభ్యర్థనను సూచిస్తుంది; ‘ఒక విన్నపం’ సంఖ్యను, గౌరవభరిత సందర్భాన్ని నిలుపుతుంది.
- source_word: אָנֹכִי שֹׁאֵל מֵאִתָּךְ
  choice: నేను నిన్ను ... అడుగుతున్నాను
  rationale: స్వతంత్ర సర్వనామం మరియు కృదంత రూపం ప్రస్తుత, ప్రత్యక్ష అభ్యర్థనకు ప్రాధాన్యం ఇస్తాయి; ఈ నిర్మాణం ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: אַל תָּשִׁיבִי אֶת פָּנָי
  choice: నా ముఖాన్ని తిప్పివేయకు
  rationale: హీబ్రూ జాతీయాన్ని ఉద్దేశపూర్వకంగా నిలిపి, తిరస్కరించవద్దనే భావాన్ని పాదటిప్పణిలో స్పష్టం చేశాము.
- source_word: וַתֹּאמֶר אֵלָיו
  choice: అందుకు ఆమె అతనితో ... అంది
  rationale: కథన క్రమంలోని ప్రతిస్పందనను సహజమైన తెలుగు సంధానంతో తెలియజేస్తుంది.
- source_word: דַּבֵּר
  choice: చెప్పు
  rationale: అభ్యర్థనను వెల్లడించమని అనుమతిచ్చే ఏకవచన ఆజ్ఞ; ‘చెప్పు’ తెలుగులో సంక్షిప్తంగా, సహజంగా ఉంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవభరిత సంభాషణ శైలి వాడబడింది. మూలంలోని ముఖాన్ని తిప్పివేయడం అనే రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని భావాన్ని పాదటిప్పణిలో వివరించాము.
