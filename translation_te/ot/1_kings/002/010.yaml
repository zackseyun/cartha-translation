translation:
  language: te
  text: అప్పుడు దావీదు తన పూర్వీకులతో కలిసి నిద్రించాడు[a]. అతడు దావీదు నగరంలో పాతిపెట్టబడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తన పూర్వీకులతో కలిసి నిద్రించాడు” అనేది మరణించాడని తెలిపే సంప్రదాయ హెబ్రీయ నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: నిద్రించాడు
  rationale: שׁכב అనే క్రియకు ‘పడుకొను/నిద్రించు’ అనే ప్రాథమిక అర్థం ఉంది; ఇక్కడ రాజుల మరణవార్తల్లో వాడే సంప్రదాయ మరణ సూచక నానుడిలో భాగం. ‘నిద్రించాడు’ అని ఉంచడం మూలంలోని రూపకాన్ని, సాహిత్య కొనసాగింపును కాపాడుతుంది.
- source_word: עִם אֲבֹתָיו
  choice: తన పూర్వీకులతో కూడ
  rationale: ఇది మరణాన్ని తెలిపే స్థిరమైన హెబ్రీయ నానుడిలో భాగం. ఆధునిక తెలుగులో ‘పూర్వీకులు’ అనేది వంశపరమైన విస్తృత అర్థాన్ని సహజంగా తెలియజేస్తుంది; ‘తండ్రులు’ అని అక్షరార్థంగా అనువదిస్తే ఇక్కడి భావం అపార్థమయ్యే అవకాశం ఉంది.
- source_word: וַיִּקָּבֵר
  choice: అతన్ని పాతిపెట్టారు
  rationale: నిఫాల్ రూపం ఇక్కడ కర్మణి భావంలో ‘పాతిపెట్టబడ్డాడు’ అని అర్థం. తెలుగులో ‘అతన్ని పాతిపెట్టారు’ అనేది అదే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּעִיר דָּוִד
  choice: దావీదు నగరంలో
  rationale: ఇది దావీదు పేరుతో ప్రసిద్ధమైన నిర్దిష్ట స్థల నామం. ‘దావీదు నగరం’ అనే రూపం మూలంలోని עיר דוד నిర్మాణాన్ని స్పష్టంగా, సహజంగా కాపాడుతుంది.
- source_word: וַ
  choice: అప్పుడు
  rationale: వావ్ కథన క్రమాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ తెలుగులో ఆ వరుసను సహజంగా తెలియజేస్తుంది.
