  yaml_path: translation/ot/1_kings/002/025.yaml
  text: So King Solomon sent Benaiah son of Jehoiada[a], and he struck him down, and he died.
translation:
  language: te
  text: అప్పుడు సొలొమోను రాజు యెహోయాదా కుమారుడైన బెనాయాను పంపాడు[a]. బెనాయా అతణ్ణి కొట్టాడు; అతడు చనిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యెహోయాదా కుమారుడైన బెనాయా చేతి ద్వారా పంపాడు.” ఇది బెనాయాను తన కార్యనిర్వాహకుడిగా పంపాడని తెలిపే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపాడు
  rationale: שׁלח అనే సాధారణ క్రియను సహజమైన తెలుగు కథన రూపంలో అనువదిస్తుంది; సందర్భం మరణశిక్ష అమలును సూచించినా, ‘చంపడానికి పంపాడు’ అని మూలంలో లేని ఉద్దేశాన్ని స్పష్టంగా చేర్చదు.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: సొలొమోను రాజు
  rationale: రాజబిరుదునూ వ్యక్తి పేరునూ సహజమైన ఆధునిక తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: בְּיַד
  choice: బెనాయాను పంపాడు
  rationale: ‘చేతి ద్వారా’ అనే హీబ్రూ ప్రయోగం ఇక్కడ ప్రతినిధిత్వం లేదా కార్యసాధకత్వాన్ని తెలియజేస్తుంది. తెలుగులో బెనాయాను ‘పంపాడు’ అని చెప్పడం సహజం; అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: యెహోయాదా కుమారుడైన బెనాయా
  rationale: హీబ్రూ పితృనామ సంబంధాన్ని స్పష్టంగా, గౌరవప్రదమైన సాధారణ తెలుగు రూపంలో వ్యక్తపరుస్తుంది.
- source_word: וַיִּפְגַּע בּוֹ
  choice: బెనాయా అతణ్ణి కొట్టాడు
  rationale: פגע ב అనే ప్రయోగం ఈ సందర్భంలో శత్రుత్వపూర్వకంగా దెబ్బకొట్టడాన్ని సూచిస్తుంది. ‘చంపాడు’ అని అనువదించకుండా, తరువాతి ‘అతడు చనిపోయాడు’ అనే స్వతంత్ర వాక్యాన్ని నిలుపుతుంది; సర్వనామ గందరగోళం రాకుండా కర్త పేరును మళ్లీ పేర్కొన్నాం.
- source_word: וַיָּמֹת
  choice: అతడు చనిపోయాడు
  rationale: హీబ్రూ కథన క్రమంలోని మరణ ప్రకటనను వేరుగా, సూటిగా నిలుపుతుంది.
