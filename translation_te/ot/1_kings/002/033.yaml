source:
  edition: WLC
  text: וְ/שָׁ֤בוּ דְמֵי/הֶם֙ בְּ/רֹ֣אשׁ יוֹאָ֔ב וּ/בְ/רֹ֥אשׁ זַרְע֖/וֹ לְ/עֹלָ֑ם וּ/לְ/דָוִ֡ד וּ֠/לְ/זַרְע/וֹ וּ/לְ/בֵית֨/וֹ וּ/לְ/כִסְא֜/וֹ יִהְיֶ֥ה שָׁל֛וֹם עַד עוֹלָ֖ם מֵ/עִ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/033.yaml
  text: So their blood shall return on the head of Joab and on the head of his offspring forever[a], but for David and for his offspring and for his house and for his throne, there shall be peace forever from Yahweh.
translation:
  language: te
  text: కాబట్టి వారి రక్తం యోవాబు తలమీదికి, అతని సంతానం తలమీదికి శాశ్వతంగా తిరిగి వస్తుంది[a]. అయితే దావీదుకు, అతని సంతానానికి, అతని ఇంటికి, అతని సింహాసనానికి యాహ్వే నుండి శాశ్వతంగా శాంతి కలుగుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘వారి రక్తం.’ ఇది చిందించబడిన వారి రక్తానికి సంబంధించిన బాధ్యతను, అంటే ఆ రక్తదోషం యోవాబు మీదికి తిరిగి రావడాన్ని సూచించే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבוּ
  choice: తిరిగి వస్తుంది
  rationale: హీబ్రూ క్రియలోని ‘తిరిగి రావడం’ అనే న్యాయపరమైన రూపకాన్ని నిలిపి ఉంచుతూ, ఈ ప్రకటనలోని భవిష్యత్ ఫలితాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: דְמֵיהֶם
  choice: వారి రక్తం
  rationale: మూలంలోని ‘వారి రక్తం’ అనే ప్రయోగాన్ని అలాగే ఉంచింది; ఇది హత్యకు సంబంధించిన రక్తదోషాన్ని సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
- source_word: בְּרֹאשׁ
  choice: తలమీదికి
  rationale: దోషం లేదా దాని పర్యవసానం ఒకరి మీదికి రావడాన్ని సూచించే హీబ్రూ రూపకాన్ని కాపాడుతుంది.
- source_word: זַרְעוֹ
  choice: అతని సంతానం
  rationale: వంశపారంపర్యంగా వచ్చే వారిని సమష్టిగా సూచించే సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదబంధం.
- source_word: לְעֹלָם / עַד עוֹלָם
  choice: శాశ్వతంగా
  rationale: తీర్పు మరియు దావీదు వంశానికి కలిగే శాంతి రెండింటి నిరంతర స్వభావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: יִהְיֶה שָׁלוֹם
  choice: శాంతి కలుగుతుంది
  rationale: שָׁלוֹם అనే పదంలోని శాంతి, క్షేమం, స్థిరత్వం వంటి విస్తృత భావాన్ని ‘శాంతి’ ద్వారా తెరిచి ఉంచుతుంది.
- source_word: לְדָוִד וּלְזַרְעוֹ וּלְבֵיתוֹ וּלְכִסְאוֹ
  choice: దావీదుకు, అతని సంతానానికి, అతని ఇంటికి, అతని సింహాసనానికి
  rationale: మూలంలోని వరుస నిర్మాణాన్ని, అలాగే ‘ఇల్లు’ మరియు ‘సింహాసనం’ పదాల్లోని రాజవంశ సంబంధిత ప్రాధాన్యాన్ని నిలిపి ఉంచుతుంది.
- source_word: מֵעִם יְהוָה
  choice: యెహోవా నుండి
  rationale: శాంతికి మూలం యెహోవాయే అని స్పష్టంగా తెలిపే సహజమైన తెలుగు రూపం; దైవనామాన్ని పేరుగానే ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: యోవాబు వంశంపై తీర్పు, దావీదు వంశంపై శాంతి మధ్య సంబంధం
  choice: ‘అయితే’ అనే వ్యతిరేక సంధిని ఉపయోగించడం
  alternative: సాధారణంగా ‘మరియు’ అని అనుసంధానించడం
  rationale: హీబ్రూలో సంధి అక్షరార్థంగా ‘మరియు’ అయినప్పటికీ, సందర్భంలో యోవాబుపై తీర్పు మరియు దావీదుకు శాంతి స్పష్టంగా పరస్పర విరుద్ధంగా ఉన్నాయి. ‘అయితే’ ఈ భావాన్ని కొత్త సిద్ధాంతాన్ని చేర్చకుండా సహజంగా వెల్లడిస్తుంది.
- issue: שָׁלוֹם పదంలోని రాజవంశ మరియు దైవానుగ్రహ భావం
  choice: ‘శాంతి’ అని అనువదించి దాని విస్తృత భావాన్ని అంతర్లీనంగా ఉంచడం
  alternative: ‘క్షేమం’ లేదా ‘సమృద్ధి’ అని అనువదించడం
  rationale: ‘శాంతి’ అనేది కేవలం ఆర్థిక సమృద్ధికి పరిమితం కాకుండా క్షేమం, స్థిరత్వం, దైవానుగ్రహం వంటి భావాలకు చోటిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. న్యాయపరమైన ‘రక్తం తలమీదికి తిరిగి రావడం’ అనే మూల రూపకాన్ని పాదసూచిక సహాయంతో నిలిపి ఉంచి, ‘ఇల్లు,’ ‘సింహాసనం,’ ‘శాంతి’ వంటి రాజవంశ మరియు ధార్మిక ప్రాధాన్యమున్న పదాలను సరళీకరించలేదు.
