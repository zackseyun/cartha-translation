base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/042.yaml
  text: Then the king sent and called for Shimei and said to him[a], “Did I not make you swear by Yahweh and warn you, saying, ‘On the day you go out and go anywhere at all, know for certain that you shall surely die’? And you said to me, ‘The word is good[c][b]; I have heard.’”
translation:
  language: te
  text: 'అప్పుడు రాజు షిమీని పిలిపించి అతనితో ఇలా అన్నాడు: “నేను యాహ్వే పేరున నిన్ను ప్రమాణం చేయించి, ‘నువ్వు బయలుదేరి ఇటో అటో ఎక్కడికైనా వెళ్లే రోజున,[b] నువ్వు తప్పకుండా చనిపోతావని నిశ్చయంగా తెలుసుకో’ అని నిన్ను గంభీరంగా హెచ్చరించలేదా?[a] నువ్వు నాతో, ‘ఈ మాట మంచిదే’[c]; ‘నేను విన్నాను’ అన్నావు కదా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నిన్ను గంభీరంగా హెచ్చరించాను” అనే మాటను “నీకు గంభీరంగా ఆజ్ఞాపించాను” లేదా “నీకు వ్యతిరేకంగా సాక్ష్యమిచ్చాను” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఇటో అటో”; ఇది ఎక్కడికైనా వెళ్లడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: “ఈ మాట మంచిదే” అనే మాటను “ఈ విషయం మంచిదే” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁבַּעְתִּיךָ בַיהוָה
  choice: యెహోవా పేరట నీతో ప్రమాణం చేయించి
  rationale: హిఫీల్ రూపంలోని కారణార్థాన్ని సహజమైన తెలుగులో నిలుపుతూ, ప్రమాణానికి ఆధారమైన దైవనామాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וָאָעִד בְּךָ
  choice: నిన్ను గట్టిగా హెచ్చరించలేదా
  rationale: ఈ సందర్భంలో అధికారికమైన, గంభీరమైన హెచ్చరిక భావం ప్రధానమైనది; న్యాయపరమైన ‘నీకు వ్యతిరేకంగా సాక్ష్యమిచ్చాను’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וְהָלַכְתָּ אָנֶה וָאָנָה
  choice: ఎక్కడికైనా వెళ్లిన
  rationale: అక్షరార్థంగా ‘ఇటో అటో’ అనే జంట అవ్యయాలు ఏ దిశకైనా లేదా ఎక్కడికైనా వెళ్లడాన్ని సూచించే నుడికారం.
- source_word: יָדֹעַ תֵּדַע
  choice: ఖచ్చితంగా తెలుసుకో
  rationale: క్రియతో కూడిన infinitive absolute ఇచ్చే నిశ్చయాత్మక బలాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מוֹת תָּמוּת
  choice: తప్పకుండా చనిపోతావు
  rationale: హీబ్రూ తీవ్రతా నిర్మాణంలోని మరణ నిశ్చయాన్ని స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: טוֹב הַדָּבָר
  choice: ఈ మాట మంచిదే
  rationale: דבר ఇక్కడ పలికిన ఆజ్ఞ లేదా ప్రకటనను సూచిస్తుంది; ‘మాట’ మూలంలోని వాక్కు భావాన్ని కాపాడుతుంది.
- source_word: שָׁמָעְתִּי
  choice: నేను విన్నాను
  rationale: మూలంలోని ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది; అంగీకారం లేదా విధేయత అనే అంతర్భావాన్ని అనువాదంలో అనవసరంగా బలపరచదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలో ఉన్న ప్రత్యేక దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా ఉంచాం. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మూల ఉచ్చారణకు సమీపమైన ప్రత్యామ్నాయం.
translation_notes:
  register: గంభీరమైన రాజన్య-న్యాయ సందర్భానికి తగిన ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. వాక్యం సాధారణ పాఠకులకు సహజంగా ఉండేలా నిర్మించబడినా, ప్రమాణం, హెచ్చరిక, మరణదండన నిశ్చయం, షిమీ ఇచ్చిన ప్రత్యుత్తరం వంటి మూలంలోని న్యాయపరమైన అంశాలు నిలుపబడ్డాయి. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
