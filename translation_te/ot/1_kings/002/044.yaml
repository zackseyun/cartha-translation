    rationale: For this predicate, Telugu normally uses a dative experiencer ('నీకు తెలుసు') or a finite verb. The revision corrects this while preserving the emphatic direct address.
  - severity: low
    issue: Footnote b frames the completed Hebrew verb as an alternative to a future main text.
    rationale: Once the main text reflects the Hebrew perfect, the note should instead give the lexical alternative 'repaid' and explain the return/retribution sense.
