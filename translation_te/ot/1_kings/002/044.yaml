- from: 'అప్పుడు రాజు షిమీతో ఇలా అన్నాడు: “నువ్వు నా తండ్రి దావీదుకు చేసిన దుష్టకార్యాలన్నీ నీ హృదయానికి తెలుసు[a]. యాహ్వే నీ దుష్టత్వాన్ని నీ తలమీదికే తిరిగి రప్పిస్తాడు[b].”'
