  yaml_path: translation/ot/1_kings/002/044.yaml
  text: Then the king said to Shimei[a], “You know all the evil that your heart knows, which you did to David my father[b]; and Yahweh has returned your evil on your own head.”
translation:
  language: te
  text: 'అప్పుడు రాజు షిమీతో ఇలా అన్నాడు: “నీ హృదయానికి తెలిసిన, నీవు నా తండ్రి దావీదుకు చేసిన దుష్టత్వమంతా నీకు తెలుసు[a]. యాహ్వే నీ దుష్టత్వాన్ని నీ తలమీదికే తిరిగి తెచ్చాడు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ హృదయం ఎరిగిన దుష్టత్వమంతా.” ఇది షిమీకి తన అపరాధం గురించి ఉన్న అంతరంగ అవగాహనను నొక్కి చెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తిరిగి చెల్లించాడు.” హీబ్రూ క్రియ షిమీ చేసిన దుష్టత్వాన్ని అతని తలమీదికే తిరిగి వచ్చేలా చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ אֶל שִׁמְעִי
  choice: అప్పుడు రాజు షిమీతో ఇలా అన్నాడు
  rationale: వావ్ వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన క్రమాన్ని చూపుతుంది. אֶל అనే దిశార్థక ప్రయోగానికి ఇక్కడ ‘తో’ సహజంగా సరిపోతుంది.
- source_word: אַתָּה יָדַעְתָּ
  choice: నువ్వు ... తెలుసు
  rationale: ప్రత్యక్ష సంబోధనలోని స్పష్టతను నిలుపుతూ, సాధారణ ఆధునిక తెలుగులో సహజంగా అందించబడింది.
- source_word: כָּל הָרָעָה
  choice: దుష్టకార్యాలన్నీ
  rationale: רָעָה ఇక్కడ కేవలం కీడు లేదా అపాయం కాక, దావీదుకు వ్యతిరేకంగా చేసిన నైతిక దుష్టత్వాన్ని సూచిస్తుంది. బహువచన భావంతో ‘దుష్టకార్యాలన్నీ’ తెలుగు వాక్యంలో సహజంగా ఉంటుంది.
- source_word: אֲשֶׁר יָדַע לְבָבְךָ
  choice: నీ హృదయానికి తెలుసు
  rationale: ‘నీ హృదయం ఎరుగుతుంది’ అనే హీబ్రూ వ్యక్తీకరణలోని అంతరంగ అవగాహనను నిలుపుతూ, ఆధునిక తెలుగులో అర్థమయ్యే రూపం.
- source_word: אֲשֶׁר עָשִׂיתָ לְדָוִד אָבִי
  choice: నువ్వు నా తండ్రి దావీదుకు చేసిన
  rationale: సంబంధ వాక్యాన్ని తెలుగులో సహజమైన క్రమంలో ఉంచి, దావీదుతో ‘నా తండ్రి’ అనే సంబంధాన్ని యథాతథంగా నిలిపింది.
- source_word: וְהֵשִׁיב
  choice: తిరిగి రప్పిస్తాడు
  rationale: שׁוב హిఫిల్ రూపం ‘తిరిగి వచ్చేలా చేయడం’ అనే కారణార్థక భావాన్ని కలిగి ఉంది. సందర్భంలో ఇది షిమీపై రాబోయే ప్రతిఫలాన్ని ప్రకటిస్తున్నందున భవిష్యత్ రూపం ఎంచుకోబడింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన నాలుగు అక్షరాల పేరును బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֶת רָעָתְךָ
  choice: నీ దుష్టత్వాన్ని
  rationale: ముందటి רָעָהతో పదసంబంధాన్ని నిలుపుతూ, ఇక్కడ షిమీ చేసిన నైతిక చెడును సమగ్రంగా సూచించడానికి ‘దుష్టత్వం’ వాడబడింది.
- source_word: בְּרֹאשֶׁךָ
  choice: నీ తలమీదికే
  rationale: చేసిన కీడు చేసినవానిపైనే తిరిగి పడే ప్రతిఫలాన్ని సూచించే హీబ్రూ నుడికారాన్ని, ‘కే’ అనే ఉద్ఘాటనతో తెలుగులో నిలిపింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించబడింది.
- issue: దైవిక ప్రతిఫలపు కార్యసాధకత్వం
  choice: యాహ్వే నీ దుష్టత్వాన్ని నీ తలమీదికే తిరిగి రప్పిస్తాడు
  alternative: నీ దుష్టత్వం నీ తలమీదికి తిరిగి వస్తుంది
  rationale: హీబ్రూ వాక్యం ప్రతిఫలాన్ని తిరిగి రప్పించే కర్తగా యాహ్వేను స్పష్టంగా పేర్కొంటుంది; ఆ దైవిక కార్యసాధకత్వాన్ని తగ్గించకుండా నిలిపింది.
- issue: וְהֵשִׁיב యొక్క కాలభావం
  choice: తిరిగి రప్పిస్తాడు
  alternative: తిరిగి రప్పించాడు / తిరిగి రప్పించాడు గనుక
  rationale: రూపం పరిపూర్ణ క్రియ అయినప్పటికీ, ఈ సందర్భంలో సొలొమోను షిమీకి ఎదురుకాబోయే తీర్పును ప్రకటిస్తున్నాడు. హీబ్రూ పరిపూర్ణ రూపం ఫలిత నిశ్చయాన్ని కూడా వ్యక్తం చేయగలదు; అందువల్ల తెలుగులో భవిష్యత్ భావం ప్రధాన పాఠ్యంలో ఉంచి, ప్రత్యామ్నాయం పాదటిప్పణిలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి ఉపయోగించబడింది. ‘నీ హృదయానికి తెలుసు’ అనే హీబ్రూ హృదయ-జ్ఞాన నుడికారాన్ని సాధ్యమైనంతవరకు నిలిపింది. ప్రధాన పాఠ్యంలో అనౌపచారిక ఏకవచన సంబోధన ‘నువ్వు/నీ’ వాడటం రాజు షిమీని నేరుగా ఉద్దేశించిన సందర్భానికి సహజంగా సరిపోతుంది.
