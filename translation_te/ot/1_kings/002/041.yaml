source:
  edition: WLC
  text: וַ/יֻּגַּ֖ד לִ/שְׁלֹמֹ֑ה כִּי הָלַ֨ךְ שִׁמְעִ֧י מִ/ירוּשָׁלִַ֛ם גַּ֖ת וַ/יָּשֹֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/041.yaml
  text: And it was reported to Solomon that Shimei had gone from Jerusalem to Gath and had returned.
translation:
  language: te
  text: షిమీ యెరూషలేము నుండి గాతుకు వెళ్లి తిరిగి వచ్చాడని సొలొమోనుకు తెలియజేయబడింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: తెలియజేయబడింది
  rationale: ఈ పరోక్ష కర్మణి క్రియ సమాచారం సొలొమోనుకు తెలియజేయబడిందని చెబుతుంది; దాన్ని తెలియజేసిన వ్యక్తి ఎవరో పేర్కొనదు.
- source_word: לִשְׁלֹמֹה
  choice: సొలొమోనుకు
  rationale: ל ఉపసర్గ ఇక్కడ సమాచారాన్ని అందుకున్న పరోక్ష కర్మను సూచిస్తుంది.
- source_word: כִּי
  choice: అని
  rationale: ఇది తెలియజేయబడిన సమాచారం యొక్క విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో పరోక్ష వచనానికి ‘అని’ సహజమైన రూపం.
- source_word: הָלַךְ
  choice: వెళ్లి
  rationale: הלך వెళ్లడం లేదా ప్రయాణించడం అనే అర్థాన్ని ఇస్తుంది; తరువాతి וַיָּשֹׁב క్రియతో సహజంగా అనుసంధానించడానికి ‘వెళ్లి’ వాడబడింది.
- source_word: שִׁמְעִי
  choice: షిమీ
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు లిపిలో మూల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: מִירוּשָׁלִַם
  choice: యెరూషలేము నుండి
  rationale: מִ ఉపసర్గ యెరూషలేము నుంచి బయలుదేరిన కదలికను సూచిస్తుంది.
- source_word: גַּת
  choice: గాతుకు
  rationale: మూలంలో గాతు ముందు ప్రత్యేక గమ్యసూచక ఉపసర్గ లేకపోయినా, הָלַךְ క్రియ సందర్భంలో అది గమ్యస్థానంగా పనిచేస్తుంది; తెలుగులో ‘కు’ అవసరం.
- source_word: וַיָּשֹׁב
  choice: తిరిగి వచ్చాడని
  rationale: שׁוב తిరిగి రావడం లేదా వెనుదిరగడం అనే అర్థాన్ని ఇస్తుంది; ఇక్కడ షిమీ గాతుకు వెళ్లి మళ్లీ వచ్చాడనే పూర్తయిన చర్యను సూచిస్తుంది.
