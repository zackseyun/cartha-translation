translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. సమాచారాన్ని ఎవరు తెలియజేశారో మూలపాఠం చెప్పకపోవడంతో కర్మణి నిర్మాణం నిలుపబడింది.
