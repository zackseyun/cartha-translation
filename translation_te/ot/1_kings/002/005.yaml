source:
  edition: WLC
  text: וְ/גַ֣ם אַתָּ֣ה יָדַ֡עְתָּ אֵת֩ אֲשֶׁר עָ֨שָׂה לִ֜/י יוֹאָ֣ב בֶּן צְרוּיָ֗ה אֲשֶׁ֣ר עָשָׂ֣ה לִ/שְׁנֵֽי שָׂרֵ֣י צִבְא֣וֹת יִ֠שְׂרָאֵל לְ/אַבְנֵ֨ר בֶּן נֵ֜ר וְ/לַ/עֲמָשָׂ֤א בֶן יֶ֨תֶר֙ וַ/יַּ֣הַרְגֵ֔/ם וַ/יָּ֥שֶׂם דְּמֵֽי מִלְחָמָ֖ה בְּ/שָׁלֹ֑ם וַ/יִּתֵּ֞ן דְּמֵ֣י מִלְחָמָ֗ה בַּ/חֲגֹֽרָת/וֹ֙ אֲשֶׁ֣ר בְּ/מָתְנָ֔י/ו וּֽ/בְ/נַעֲל֖/וֹ אֲשֶׁ֥ר בְּ/רַגְלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/005.yaml
  text: 'And you also know what Joab son of Zeruiah did to me[a], what he did to the two commanders of the armies of Israel, to Abner son of Ner and to Amasa son of Jether: he killed them and put the blood of war in peace[b], and put the blood of war on the belt that was around his waist and on the sandals that were on his feet.'
translation:
  language: te
  text: సెరూయా కుమారుడైన యోవాబు నాకు ఏమి చేశాడో నీకూ తెలుసు. ఇశ్రాయేలు సైన్యాల ఇద్దరు సేనాధిపతులకు—నేరు కుమారుడైన అబ్నేరుకు, యెతెరు కుమారుడైన అమాసాకు—అతడు ఏమి చేశాడో కూడా నీకు తెలుసు. అతడు వారిని చంపి, శాంతికాలంలో యుద్ధరక్తాన్ని చిందించాడు[a]. ఆ యుద్ధరక్తాన్ని తన నడుము చుట్టూ ఉన్న నడికట్టుపై, తన పాదాలకు ఉన్న చెప్పులపై పెట్టాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “శాంతిలో యుద్ధరక్తాన్ని ఉంచాడు.” అంటే, శాంతియుత పరిస్థితుల్లో యుద్ధకాల రక్తపాతం చేశాడు.
    reason: lexical_alternative
  - marker: b
    text: నడికట్టు, చెప్పులపై రక్తం ఉన్న ఈ దృశ్యం, ఈ హత్యల రక్తాపరాధం యోవాబుకు అంటుకొని ఉందని సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אַתָּה יָדַעְתָּ
  choice: నీకూ తెలుసు
  rationale: సొలొమోనును నేరుగా సంబోధిస్తూ, גם లోని ‘కూడా’ అనే ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אֵת אֲשֶׁר עָשָׂה לִי
  choice: నాకు ఏమి చేశాడో
  rationale: לִי ని దావీదుకు ప్రతికూలంగా జరిగిన కార్యంగా చూపుతుంది; యోవాబు చర్యలను దావీదు తనకు చేసిన అపకారంగా పేర్కొంటున్న వాక్యబలాన్ని కాపాడుతుంది.
- source_word: לִשְׁנֵי שָׂרֵי צִבְאוֹת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సైన్యాలకు అధిపతులైన ఆ ఇద్దరికి
  rationale: שָׂרֵי ని సైనిక నాయకత్వంగా స్పష్టంగా తెలుపుతూ, צִבְאוֹת లోని బహువచనాన్ని ‘సైన్యాలకు’గా నిలుపుతుంది.
- source_word: וַיַּהַרְגֵם
  choice: అతడు వారిని చంపి
  rationale: హీబ్రూ క్రియలోని నేరుగా, తీవ్రమైన ఆరోపణను మృదువుచేయకుండా అందిస్తుంది.
- source_word: וַיָּשֶׂם דְּמֵי־מִלְחָמָה בְּשָׁלֹם
  choice: శాంతికాలంలో యుద్ధరక్తాన్ని చిందించాడు
  rationale: ‘యుద్ధరక్తం’–‘శాంతి’ అనే హీబ్రూ విరోధాన్ని నిలుపుతూ, అక్షరార్థమైన ‘ఉంచాడు’ వల్ల తెలుగులో కలిగే అస్పష్టతను సహజమైన ‘చిందించాడు’తో వివరిస్తుంది.
- source_word: בַּחֲגֹרָתוֹ אֲשֶׁר בְּמָתְנָיו וּבְנַעֲלוֹ אֲשֶׁר בְּרַגְלָיו
  choice: తన నడుము చుట్టూ ఉన్న దట్టీ మీద, తన కాళ్లకు ఉన్న చెప్పుల మీద
  rationale: దుస్తులపై రక్తం అంటుకున్న స్పష్టమైన దృశ్యాన్ని నిలుపుతుంది; חֲגוֹרָה కు సందర్భానుకూలంగా ‘దట్టీ’ వాడబడింది.
theological_decisions:
- issue: శాంతికాలంలో జరిగిన హత్యలను ‘యుద్ధరక్తం’గా వర్ణించడం
  choice: శాంతికాలంలో యుద్ధరక్తాన్ని చిందించాడు
  alternative: శాంతిలో యుద్ధరక్తాన్ని ఉంచాడు
  rationale: హీబ్రూ రూపకాన్ని పూర్తిగా తొలగించకుండా, యోవాబు శాంతి పరిస్థితుల్లో యుద్ధకాల హింస చేసినాడనే నైతిక ఉద్రిక్తతను తెలుగులో అర్థమయ్యేలా ఉంచుతుంది.
- issue: దట్టీ, చెప్పులపై రక్తం యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో దృశ్యాన్ని యథాతథంగా ఉంచి, రక్తాపరాధ సూచనను పాదసూచికలో సంభావ్య భావంగా పేర్కొనడం
  alternative: ప్రధాన పాఠ్యంలోనే ‘రక్తాపరాధం అతనికి అంటుకుంది’ అని వ్యాఖ్యానించడం
  rationale: మూలంలోని స్పష్టమైన దృశ్యాన్ని వ్యాఖ్యానంతో భర్తీ చేయకుండా, దాని సాధ్యమైన నైతిక సంకేతాన్ని మాత్రమే పాదసూచికలో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘యుద్ధరక్తం’ అనే అసాధారణమైన కానీ ఉద్దేశపూర్వకమైన మూలరూపకం నిలుపబడింది; దాని అర్థం పాదసూచికలో వివరించబడింది.
