source:
  edition: WLC
  text: וַ/יַּעַן֩ הַ/מֶּ֨לֶךְ שְׁלֹמֹ֜ה וַ/יֹּ֣אמֶר לְ/אִמּ֗/וֹ וְ/לָ/מָה֩ אַ֨תְּ שֹׁאֶ֜לֶת אֶת אֲבִישַׁ֤ג הַ/שֻּׁנַמִּית֙ לַ/אֲדֹ֣נִיָּ֔הוּ וְ/שַֽׁאֲלִי ל/וֹ֙ אֶת הַ/מְּלוּכָ֔ה כִּ֛י ה֥וּא אָחִ֖/י הַ/גָּד֣וֹל מִמֶּ֑/נִּי וְ/ל/וֹ֙ וּ/לְ/אֶבְיָתָ֣ר הַ/כֹּהֵ֔ן וּ/לְ/יוֹאָ֖ב בֶּן צְרוּיָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/022.yaml
  text: King Solomon answered and said to his mother[a], “Why are you asking for Abishag the Shunammite for Adonijah? Ask for the kingship for him as well, since he is my older brother—and for him, for Abiathar the priest, and for Joab son of Zeruiah!”
translation:
  language: te
  text: 'సొలొమోను రాజు తన తల్లికి ఇలా జవాబిచ్చాడు: “అదోనీయా కోసం షూనేమీయురాలైన అబీషగును నీవెందుకు అడుగుతున్నావు? అతనికోసం రాజ్యాధికారాన్ని[a] కూడా అడుగు! ఎందుకంటే అతడు నాకంటే పెద్దవాడైన నా అన్న—అతనికీ, యాజకుడైన అబ్యాతారుకీ, సెరూయా కుమారుడైన యోవాబుకీ కూడా అడుగు!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “రాజ్యాన్ని.” హీబ్రూ పదం రాజరిక పాలనను లేదా రాజ్యాన్ని సూచించగలదు; ఇక్కడ “రాజ్యాధికారం” అనే అనువాదం అదోనీయా అభ్యర్థనలోని రాజవంశ సంబంధమైన సూచనను ముందుకు తెస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן הַמֶּלֶךְ שְׁלֹמֹה וַיֹּאמֶר לְאִמּוֹ
  choice: సొలొమోను రాజు తన తల్లికి ఇలా జవాబిచ్చాడు
  rationale: హీబ్రూ వాక్యంలోని ‘జవాబిచ్చి చెప్పాడు’ అనే కథన సూత్రాన్ని ఆధునిక తెలుగులో సహజంగా ‘ఇలా జవాబిచ్చాడు’ అని వ్యక్తం చేశాం; తల్లి పేరు మూలంలో లేనందున చేర్చలేదు.
- source_word: אֲבִישַׁג הַשֻּׁנַמִּית
  choice: షూనేమీయురాలైన అబీషగు
  rationale: జాతి/స్థలనామ విశేషణాన్ని తెలుగు వాక్య నిర్మాణానికి సహజంగా మార్చి, వ్యక్తి గుర్తింపును నిలిపాం.
- source_word: וְשַׁאֲלִי לוֹ אֶת הַמְּלוּכָה
  choice: అతనికోసం రాజ్యాధికారాన్ని కూడా అడుగు
  rationale: మూలంలోని వ్యంగ్యభరిత ఆజ్ఞను నిలిపి, מְלוּכָה ఇక్కడ సూచించే పాలనా హక్కును ‘రాజ్యాధికారం’గా అనువదించాం.
- source_word: כִּי הוּא אָחִי הַגָּדוֹל מִמֶּנִּי
  choice: ఎందుకంటే అతడు నాకంటే పెద్దవాడైన నా అన్న
  rationale: వయస్సు/జననక్రమానికి సంబంధించిన పోలికను స్పష్టంగా, సహజమైన తెలుగులో నిలిపాం.
- source_word: וְלוֹ וּלְאֶבְיָתָר הַכֹּהֵן וּלְיוֹאָב בֶּן צְרוּיָה
  choice: అది అతనికీ, యాజకుడైన అబ్యాతారుకీ, సెరూయా కుమారుడైన యోవాబుకీ
  rationale: హీబ్రూలోని అసంపూర్ణ, ఉద్ధృత జాబితా నిర్మాణాన్ని తెలుగులో అర్థమయ్యేలా ‘అది’ని పూరించి, రాజ్యాధికారంతో ఈ ముగ్గురికీ ఉన్న సంబంధాన్ని అతిగా వివరించకుండా ఉంచాం.
theological_decisions:
- issue: అబీషగును కోరడం వెనుక రాజవంశాధికార సూచన
  choice: సొలొమోను మాటల్లో ఆ అభ్యర్థన రాజ్యాధికారాన్ని కోరడానికే సమానమన్న భావాన్ని స్పష్టంగా నిలిపాం.
  alternative: కేవలం ‘రాజ్యాన్ని అడుగు’ అని అనువదించి రాజకీయ సూచనను మరింత పరోక్షంగా ఉంచడం.
  rationale: మూల హీబ్రూ స్వయంగా הַמְּלוּכָה అనే పదంతో రాజకీయ/రాజవంశ సంబంధాన్ని వెల్లడిస్తుంది; ‘రాజ్యాధికారం’ భూభాగం కంటే పాలనా హక్కుపై దృష్టి ఉంచుతుంది.
- issue: చివరి ముగ్గురి జాబితాలోని హీబ్రూ వాక్య అసంపూర్ణత
  choice: ‘అది’ అనే సూచక సర్వనామంతో ముందున్న రాజ్యాధికారాన్ని అనుసంధానించాం.
  alternative: ‘అతనికోసం, అబ్యాతారు కోసం, యోవాబు కోసం’ అని అసంపూర్ణ నిర్మాణాన్ని యథాతథంగా ఉంచడం.
  rationale: తెలుగులో అర్థస్పష్టతకు అవసరమైన కనిష్ఠ పూరణ మాత్రమే చేశాం; వారు సహరాజులని గానీ రాజ్యాన్ని పంచుకుంటారని గానీ నిర్ణయించి చెప్పలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని వాడాం. సొలొమోను వ్యంగ్యంతో, ఆగ్రహంతో పలికిన మాటల ఉద్ధృతిని ప్రశ్న, ఆశ్చర్యార్థక చిహ్నాలు మరియు దీర్ఘవిరామంతో నిలిపాం; మూలంలో లేని వ్యక్తిపేర్లు లేదా సిద్ధాంత వివరణలు చేర్చలేదు.
