source:
  edition: WLC
  text: אָנֹכִ֣י הֹלֵ֔ךְ בְּ/דֶ֖רֶךְ כָּל הָ/אָ֑רֶץ וְ/חָזַקְתָּ֖ וְ/הָיִ֥יתָֽ לְ/אִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/002.yaml
  text: I am going the way of all the earth. So be strong[a], and be a man,
translation:
  language: te
  text: “నేను ఈ లోకంలోని అందరూ వెళ్లే మార్గంలో వెళ్తున్నాను. కాబట్టి బలంగా ఉండు; పురుషునిగా ఉండు[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు పురుషుడినని చూపించు,” లేదా “పురుషోచితంగా ప్రవర్తించు.” హీబ్రూ వ్యక్తీకరణలో పురుషునిగా ఉండడమనే భావంతోపాటు ధైర్యంగా, బాధ్యతగా ప్రవర్తించడమనే భావం కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: నేను
  rationale: స్వతంత్ర ప్రథమ పురుష ఏకవచన సర్వనామం; సందర్భంలో ప్రత్యేక ఉద్ఘాటనను అదనంగా చేర్చాల్సిన అవసరం లేదు.
- source_word: הֹלֵךְ
  choice: వెళ్తున్నాను
  rationale: సర్వనామంతో కూడిన కర్తరి వర్తమాన కృదంతం సమీపిస్తున్న మరణాన్ని సూచించే ప్రయాణ రూపకాన్ని నిలుపుతుంది.
- source_word: בְּדֶרֶךְ כָּל הָאָרֶץ
  choice: లోకమంతటికీ సాధారణమైన మార్గంలో
  rationale: అక్షరార్థంలోని ‘భూమి అంతటి మార్గం’ అనే హీబ్రూ నుడికారాన్ని, అందరికీ సంభవించే మరణమనే భావం తెలుగులో సహజంగా అర్థమయ్యేలా రూపకంగానే నిలిపింది.
- source_word: וְחָזַקְתָּ
  choice: కాబట్టి నీవు బలంగా ఉండి
  rationale: సంయోజకంతో ఉన్న సంపూర్ణ క్రియారూపం ఇక్కడ సందర్భానుసారంగా ప్రోత్సాహక ఆజ్ఞగా పనిచేస్తుంది; ‘కాబట్టి’ ముందున్న మరణ ప్రకటనతో సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: וְהָיִיתָ לְאִישׁ
  choice: మగవాడివై ఉండు
  rationale: సొలొమోనును ఉద్దేశించిన పురుషలింగ వ్యక్తీకరణను నిలుపుతూ, ధైర్యం మరియు బాధ్యతతో ప్రవర్తించాలనే సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో విస్తరించకుండా ఉంచుతుంది.
theological_decisions:
- issue: ప్రోత్సాహంలోని పురుషలింగ వ్యక్తీకరణ
  choice: మగవాడివై ఉండు
  alternative: నీవు మగవాడినని చూపించు; పురుషోచితంగా ప్రవర్తించు
  rationale: హీబ్రూ పదబంధం ప్రత్యేకంగా సొలొమోనును ఉద్దేశించి పురుషలింగ నామవాచకాన్ని వాడుతుంది. దానిని లింగతటస్థంగా మార్చకుండా మూలంలోని తండ్రి-కొడుకు ప్రోత్సాహాన్ని నిలిపాం; ఆధునిక మూసధారణలను ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన సంభాషణ శైలి. మరణానికి సంబంధించిన మూల రూపకాన్ని నిలిపి, ‘మగవాడివై ఉండు’ అనే లింగ-నిర్దిష్ట పిలుపుకు గల భావవ్యాప్తిని పాదటిప్పణిలో తెలిపాం.
