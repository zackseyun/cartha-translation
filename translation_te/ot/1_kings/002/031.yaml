source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר ל֣/וֹ הַ/מֶּ֗לֶךְ עֲשֵׂה֙ כַּ/אֲשֶׁ֣ר דִּבֶּ֔ר וּ/פְגַע בּ֖/וֹ וּ/קְבַרְתּ֑/וֹ וַ/הֲסִירֹ֣תָ דְּמֵ֣י חִנָּ֗ם אֲשֶׁר֙ שָׁפַ֣ךְ יוֹאָ֔ב מֵ/עָלַ֕/י וּ/מֵ/עַ֖ל בֵּ֥ית אָבִֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/031.yaml
  text: Then the king said to him[a], “Do as he has said, and strike him down and bury him[b], and remove from me and from my father’s house the innocent blood that Joab shed.”
translation:
  language: te
  text: 'అప్పుడు రాజు అతనితో ఇలా అన్నాడు: “అతడు చెప్పినట్టే చేయి. అతన్ని హతమార్చి[a] పాతిపెట్టు. యోవాబు చిందించిన నిరపరాధుల రక్తాన్ని[b] నా మీదనుండి, నా తండ్రి ఇంటి మీదనుండి తొలగించు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతని మీద పడు.” ఈ హీబ్రూ నుడికారం ఈ సందర్భంలో అతన్ని చంపి మరణశిక్ష అమలు చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “నిరపరాధుల రక్తం” అనేది న్యాయమైన కారణం లేకుండా చేసిన రక్తపాతాన్ని, దానివల్ల కలిగే రక్తదోషాన్ని సూచించే హీబ్రూ న్యాయ-నైతిక ప్రయోగం.
    reason: cultural_note
lexical_decisions:
- source_word: עֲשֵׂה כַּאֲשֶׁר דִּבֶּר
  choice: అతడు చెప్పినట్టే చేయి
  rationale: ఇప్పుడే పలికిన మాట ప్రకారం నడుచుకోవాలనే ప్రత్యక్ష ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּפְגַע בּוֹ
  choice: అతన్ని హతమార్చి
  rationale: פגע ב అనే ప్రయోగం ఈ సందర్భంలో ప్రాణాంతకంగా దాడిచేసి మరణశిక్ష అమలు చేయడాన్ని సూచిస్తుంది. ‘హతమార్చి’ ఆ అర్థాన్ని స్పష్టంగా, గౌరవప్రదమైన శైలిలో ఇస్తుంది; హీబ్రూ నుడికారాన్ని పాదసూచికలో ఉంచాం.
- source_word: וּקְבַרְתּוֹ
  choice: పాతిపెట్టు
  rationale: మరణశిక్ష అనంతరం శవాన్ని సమాధి చేయాలనే రెండవ ప్రత్యక్ష ఆజ్ఞను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וַהֲסִירֹתָ
  choice: తొలగించు
  rationale: హీబ్రూ ఆజ్ఞల పరంపరలో ఉన్న సమన్వయాన్ని నేరుగా నిలుపుతూ, రక్తదోషం వారిమీద ఉండకుండా చేయాలనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: דְּמֵי חִנָּם
  choice: నిరపరాధుల రక్తం
  rationale: న్యాయమైన కారణం లేకుండా చిందించిన రక్తాన్ని సూచించే హీబ్రూ న్యాయ-నైతిక నుడికారాన్ని స్పష్టమైన తెలుగులో నిలుపుతుంది.
- source_word: מֵעָלַי וּמֵעַל בֵּית אָבִי
  choice: నా మీదనుండి, నా తండ్రి వంశం మీదనుండి
  rationale: దోషం వ్యక్తి మరియు అతని రాజవంశం మీద నిలిచివున్నదనే రూపకాన్ని ‘మీదనుండి’ ద్వారా కాపాడుతుంది; ఈ సందర్భంలో ‘వంశం’ తండ్రి ఇంటిని, రాజకుటుంబ పరంపరను సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: అన్యాయ రక్తపాత దోషం రాజు మరియు అతని తండ్రి వంశం మీద ఉండటం
  choice: ‘నిరపరాధుల రక్తాన్ని నా మీదనుండి, నా తండ్రి వంశం మీదనుండి తొలగించు’ అనే మూర్తమైన హీబ్రూ రూపకాన్ని నిలుపడం
  alternative: ‘రక్తపాత దోషం నుండి నన్ను, నా తండ్రి వంశాన్ని విముక్తం చేయి’ అని అమూర్తంగా అనువదించడం
  rationale: మూలం కేవలం ‘దోషం’ అని కాక, చిందించిన నిరపరాధుల రక్తం వారిమీద ఉన్నట్లు మాట్లాడుతుంది. అనువాదం ఆ న్యాయ-దైవశాస్త్రీయ ఉద్రిక్తతను వివరించి పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉండే ప్రత్యక్ష ఆజ్ఞారూపాలు వాడబడ్డాయి. ‘హతమార్చి’ మరణశిక్ష సందర్భాన్ని స్పష్టం చేస్తుంది; ‘నిరపరాధుల రక్తం’ మరియు ‘మీదనుండి’ మూలంలోని న్యాయపరమైన రూపకాన్ని కాపాడుతాయి.
