source:
  edition: WLC
  text: וְ/הִנֵּ֣ה עִ֠מְּ/ךָ שִֽׁמְעִ֨י בֶן גֵּרָ֥א בֶן הַ/יְמִינִי֮ מִ/בַּחֻרִים֒ וְ/ה֤וּא קִֽלְלַ֨/נִי֙ קְלָלָ֣ה נִמְרֶ֔צֶת בְּ/י֖וֹם לֶכְתִּ֣/י מַחֲנָ֑יִם וְ/הֽוּא יָרַ֤ד לִ/קְרָאתִ/י֙ הַ/יַּרְדֵּ֔ן וָ/אֶשָּׁ֨בַֽע ל֤/וֹ בַֽ/יהוָה֙ לֵ/אמֹ֔ר אִם אֲמִֽיתְ/ךָ֖ בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/008.yaml
  text: And behold[a], with you is Shimei son of Gera, the Benjaminite from Bahurim, and he cursed me with a grievous curse on the day I went to Mahanaim. But he came down to meet me at the Jordan, and I swore to him by Yahweh, saying, ‘I will not put you to death with the sword.’
translation:
  language: te
  text: ఇదిగో, బహూరీము ఊరికి చెందిన బెన్యామీనీయుడైన గేరా కుమారుడు షిమీ నీ దగ్గర ఉన్నాడు. నేను మహనయీముకు వెళ్లిన రోజున అతడు నన్ను తీవ్రమైన శాపంతో శపించాడు. అయితే అతడు యొర్దాను దగ్గర నన్ను కలుసుకోవడానికి దిగి వచ్చినప్పుడు, ‘నేను నిన్ను కత్తితో చంపను’[a] అని యాహ్వే పేరిట అతనికి ప్రమాణం చేశాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ అక్షరార్థంగా, “నేను నిన్ను కత్తితో చంపితే…” ఇది శాపభాగం చెప్పకుండా విడిచిపెట్టిన ప్రమాణ సూత్రం; దీని భావం, “నేను నిన్ను కత్తితో చంపను.”
    reason: మూలంలోని సంక్షిప్త ప్రమాణ నిర్మాణం మరియు దాని ఉద్దేశిత ప్రతికూల అర్థం మధ్య తేడాను తెలియజేయడానికి.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: దృష్టిని ఒక ముఖ్యమైన వ్యక్తి లేదా పరిస్థితివైపు మళ్లించే హీబ్రూ సూచనార్థక పదానికి సహజమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: עִמְּךָ
  choice: నీ దగ్గర ఉన్నాడు
  rationale: షిమీ సొలొమోను పరిధిలో లేదా అతని సమీపంలో ఉన్నాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שִׁמְעִי בֶן גֵּרָא בֶן הַיְמִינִי מִבַּחֻרִים
  choice: బహూరీము ఊరికి చెందిన బెన్యామీనీయుడైన గేరా కుమారుడు షిమీ
  rationale: వ్యక్తి పేరు, తండ్రి పేరు, గోత్ర సంబంధం, స్వస్థలం అన్నింటినీ స్పష్టంగా ఉంచుతూ తెలుగు వాక్యక్రమానికి అనుగుణంగా అమర్చింది.
- source_word: קִלְלַנִי קְלָלָה נִמְרֶצֶת
  choice: నన్ను తీవ్రమైన శాపంతో శపించాడు
  rationale: మూలంలోని ఒకే ధాతువుతో ఏర్పడిన బలవర్ధక నిర్మాణాన్ని నిలుపుతూ נִמְרֶצֶת సూచించే తీవ్రతను అతిగా నిర్దిష్టీకరించకుండా తెలుపుతుంది.
- source_word: בְּיוֹם לֶכְתִּי מַחֲנָיִם
  choice: నేను మహనయీముకు వెళ్లిన రోజున
  rationale: కాలసూచనను, గమ్యదిశను సూటిగా మరియు సహజంగా అందిస్తుంది.
- source_word: יָרַד לִקְרָאתִי הַיַּרְדֵּן
  choice: యొర్దాను దగ్గర నన్ను కలుసుకోవడానికి దిగి వచ్చినప్పుడు
  rationale: ירד అనే దిగివచ్చే చలనాన్ని, לקראתי అనే ఎదుర్కొని కలుసుకోవడానికి వచ్చే భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: וָאֶשָּׁבַע לוֹ בַיהוָה
  choice: యాహ్వే పేరిట అతనికి ప్రమాణం చేశాను
  rationale: దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరిస్తూ, హీబ్రూ ప్రమాణ సూత్రాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אִם אֲמִיתְךָ בֶּחָרֶב
  choice: నేను నిన్ను కత్తితో చంపను
  rationale: אִם అక్షరార్థంగా ‘ఒకవేళ’ అయినా, ఇక్కడ శాపభాగం విడిచిపెట్టబడిన ప్రమాణ సూత్రంలో బలమైన ప్రతికూల వాగ్దానాన్ని సూచిస్తుంది; ప్రధాన పాఠంలో ఉద్దేశిత అర్థాన్ని ఇస్తూ అక్షర నిర్మాణాన్ని పాదసూచికలో నమోదు చేసింది.
theological_decisions:
- issue: יהוה అనే దైవనామ అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో నేరుగా ప్రతిబింబిస్తుంది.
- issue: אִם אֲמִיתְךָ בֶּחָרֶב అనే సంక్షిప్త ప్రమాణ సూత్రం
  choice: ప్రధాన పాఠంలో ‘నేను నిన్ను కత్తితో చంపను’
  alternative: ‘నేను నిన్ను కత్తితో చంపితే…’ అనే అసంపూర్ణ అక్షరార్థ రూపం
  rationale: హీబ్రూ ప్రమాణాల్లో విడిచిపెట్టబడిన స్వశాప భాగం కారణంగా ఈ సూత్రం ప్రతికూల నిబద్ధతను వ్యక్తం చేస్తుంది. ఆధునిక పాఠకుడికి వాక్య ఉద్దేశాన్ని స్పష్టం చేస్తూనే, మూలంలోని సంక్షిప్తతను పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ రాజసంబంధ సందర్భానికి తగిన గౌరవప్రదమైన శైలి వాడబడింది. స్థలనామాలు, వ్యక్తినామాలు తెలుగు లిపిలో లిప్యంతరీకరించబడ్డాయి; మూలంలోని తీవ్రత, చలన సూచన, ప్రమాణ భావం నిలుపబడ్డాయి.
