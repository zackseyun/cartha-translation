source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קֵּץ֙ שָׁלֹ֣שׁ שָׁנִ֔ים וַ/יִּבְרְח֤וּ שְׁנֵֽי עֲבָדִים֙ לְ/שִׁמְעִ֔י אֶל אָכִ֥ישׁ בֶּֽן מַעֲכָ֖ה מֶ֣לֶךְ גַּ֑ת וַ/יַּגִּ֤ידוּ לְ/שִׁמְעִי֙ לֵ/אמֹ֔ר הִנֵּ֥ה עֲבָדֶ֖י/ךָ בְּ/גַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/039.yaml
  text: At the end of three years[a], two servants of Shimei ran away to Achish son of Maacah, king of Gath. And they told Shimei, saying, “Look, your servants are in Gath.”
translation:
  language: te
  text: మూడు సంవత్సరాల చివరికి, షిమీకి చెందిన ఇద్దరు దాసులు[a] గాతు రాజు, మయకా కుమారుడైన ఆకీషు దగ్గరికి పారిపోయారు. “ఇదిగో, నీ దాసులు గాతులో ఉన్నారు” అని కొందరు షిమీకి చెప్పారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సేవకులు.” హీబ్రూ పదం సేవకులను లేదా బానిసలుగా ఉన్నవారిని సూచించగలదు; వారు తమ యజమాని దగ్గరనుంచి పారిపోయినందున ఇక్కడ “దాసులు” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ שָׁלֹשׁ שָׁנִים
  choice: మూడు సంవత్సరాలు గడిచిన తరువాత
  rationale: ఈ పదబంధం మూడు సంవత్సరాల కాలం ముగిసిన తరువాతి సమయాన్ని సూచిస్తుంది. తెలుగులో ఇది సహజంగా ఉండి మూలంలోని కాలార్థాన్ని నిలుపుతుంది.
- source_word: וַיִּבְרְחוּ
  choice: పారిపోయారు
  rationale: ברח అనేది పారిపోవడం లేదా తప్పించుకొని వెళ్లడం అనే భావాన్ని ఇస్తుంది; యజమానిని విడిచి వెళ్లిన ఈ సందర్భంలో ‘పారిపోయారు’ సహజమైన ఎంపిక.
- source_word: עֲבָדִים / עֲבָדֶיךָ
  choice: దాసులు
  rationale: עבד అనే పదానికి సేవకులు లేదా బానిసలు అనే విస్తృతి ఉంది. ఇక్కడ వారు షిమీకి చెందినవారుగా ఉండి అతని దగ్గరనుంచి పారిపోవడం వల్ల బంధిత స్థితి సందర్భంలో ముఖ్యంగా కనిపిస్తుంది; ‘దాసులు’ ఆ భావాన్ని తెలియజేస్తూనే తెలుగు బైబిల్ శైలిలో సహజంగా ఉంటుంది.
- source_word: אֶל אָכִישׁ
  choice: ఆకీషు దగ్గరికి
  rationale: ఈ విభక్తి ఆకీషు అనే వ్యక్తి వైపు వెళ్లడాన్ని సూచిస్తుంది; తెలుగులో వ్యక్తిని గమ్యంగా చెప్పడానికి ‘దగ్గరికి’ సహజం.
- source_word: בֶּן מַעֲכָה מֶלֶךְ גַּת
  choice: గాతు రాజైన మయకా కుమారుడు
  rationale: ఆకీషు వంశసంబంధాన్నీ రాజపదవినీ సహజమైన తెలుగు క్రమంలో వ్యక్తం చేస్తుంది.
- source_word: וַיַּגִּידוּ לְשִׁמְעִי לֵאמֹר
  choice: అని కొందరు షిమీకి చెప్పారు
  rationale: మూలంలోని మూడవ పురుష బహువచన కర్త ఎవరో పేర్కొనబడలేదు. ‘కొందరు’ అనడం ఆ అనిర్దిష్టతను నిలుపుతుంది; తెలుగులో ప్రత్యక్ష వాక్యాన్ని ‘అని ... చెప్పారు’ సహజంగా పరిచయం చేస్తుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని సమాచారంపై కేంద్రీకరించే మూలంలోని సూచనాత్మక బలాన్ని ‘ఇదిగో’ సహజంగా నిలుపుతుంది.
- source_word: בְּגַת
  choice: గాతులో
  rationale: ב ఇక్కడ స్థలాన్ని సూచిస్తుంది; నగరంలో ఉన్నారని తెలుగులో ‘గాతులో’ అని సహజంగా చెబుతారు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. హీబ్రూ వాక్యారంభంలోని సాధారణ కథన సంధిని ప్రత్యేకంగా ‘ఇప్పుడు’ అని చేర్చలేదు. వ్యక్తి పేర్లు ఆకీషు, మయకా, షిమీ; స్థలనామం గాతు అని లిప్యంతరీకరించబడ్డాయి.
