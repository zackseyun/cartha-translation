id: 1KI.2.45
reference: 1 Kings 2:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בָּר֑וּךְ וְ/כִסֵּ֣א דָוִ֗ד יִהְיֶ֥ה נָכ֛וֹן לִ/פְנֵ֥י יְהוָ֖ה עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/045.yaml
  text: But King Solomon will be blessed[a], and the throne of David will be established before Yahweh forever.
translation:
  language: te
  text: అయితే రాజైన సొలొమోను ఆశీర్వదించబడతాడు[a]; దావీదు సింహాసనం యాహ్వే సన్నిధిలో ఎప్పటికీ స్థిరంగా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజైన సొలొమోను ఆశీర్వదించబడినవాడు.” హీబ్రూ క్రియలేని ఈ వాక్యాన్ని వర్తమాన ప్రకటనగా కూడా అర్థం చేసుకోవచ్చు; అయితే సందర్భం ప్రధాన పాఠ్యంలో ఉన్న భవిష్యదర్థానికీ మద్దతిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ
  choice: అయితే రాజైన
  rationale: ముందటి వచనంలో షిమీపై వచ్చిన తీర్పుతో ఇక్కడ వ్యత్యాసం ఉంది. అందువల్ల וְ ను సందర్భానుసారంగా ‘అయితే’ అని అనువదించాం; మֶלֶךְ కు ‘రాజు’ అనే ప్రత్యక్ష అర్థాన్ని సహజమైన తెలుగు నిర్మాణంలో ఇచ్చాం.
- source_word: שְׁלֹמֹה
  choice: సొలొమోను
  rationale: తెలుగులో ప్రాచుర్యంలో ఉన్న వ్యక్తినామ రూపం.
- source_word: בָּרוּךְ
  choice: ఆశీర్వదించబడతాడు
  rationale: ఈ పదం ‘ఆశీర్వదించబడినవాడు’ అనే విశేషణాత్మక/కర్మణి భావాన్ని ఇస్తుంది. తరువాతి భవిష్యత్ వాక్యంతోను రాజాజ్ఞ సందర్భంతోను అనుసంధానించి ప్రధాన పాఠ్యంలో భవిష్యదర్థాన్ని వ్యక్తం చేశాం; వర్తమానార్థ అవకాశాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: וְ/כִסֵּא דָוִד
  choice: దావీదు సింహాసనం
  rationale: כִסֵּא అంటే ‘సింహాసనం’; దావీదుతో ఉన్న construct సంబంధాన్ని సహజ తెలుగులో ‘దావీదు సింహాసనం’గా వ్యక్తం చేశాం. సెమికోలన్ తరువాత సమన్వయం స్పష్టంగా ఉండటం వల్ల וְ ను విడిగా ‘మరియు’ అని పెట్టడం అవసరం లేదు.
- source_word: יִהְיֶה נָכוֹן
  choice: స్థిరంగా ఉంటుంది
  rationale: ఈ పదబంధం స్థాపించబడటం, భద్రంగా లేదా దృఢంగా నిలవటం అనే భావాలను కలిగి ఉంది. సింహాసనానికి సంబంధించిన రాజవంశీయ సందర్భంలో ‘స్థిరంగా ఉంటుంది’ సహజంగా ఉండి మూలంలోని స్థిరత్వ భావాన్ని కాపాడుతుంది.
- source_word: לִ/פְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: לִפְנֵי అంటే ‘ముందు’ లేదా ‘సన్నిధిలో.’ ఆధునిక తెలుగులో దేవుని సమక్షాన్ని సహజంగా తెలియజేయడానికి ‘సన్నిధిలో’ వాడాం; יְהוָה అనే దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: עַד עוֹלָם
  choice: ఎప్పటికీ
  rationale: అంతం లేని కాలాన్ని సూచించే ఈ పదబంధానికి స్పష్టమైన, సహజమైన ఆధునిక తెలుగు సమానార్థకం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలంలో చతురక్షర దైవనామం నేరుగా ఉంది. దానిని సాధారణ బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగా నిలిపేందుకు ‘యాహ్వే’ వాడాం.
- issue: בָּרוּךְ అనే ఆశీర్వాద ప్రకటన కాలబలం
  choice: భవిష్యదర్థం—‘ఆశీర్వదించబడతాడు’
  alternative: వర్తమాన ప్రకటన—‘ఆశీర్వదించబడినవాడు’ లేదా ‘ఆశీర్వదించబడ్డాడు’
  rationale: హీబ్రూ క్రియలేని వాక్యం కాలాన్ని స్పష్టంగా గుర్తించదు. తరువాతి יִהְיֶה నిబంధనతోను సందర్భంలోని భవిష్యదోన్ముఖ రాజప్రకటనతోను సరిపడేలా ప్రధాన పాఠ్యంలో భవిష్యదర్థం తీసుకున్నాం; నిజమైన వ్యాకరణ సందిగ్ధతను పాదటిప్పణిలో కాపాడాం.
- issue: దావీదు సింహాసనం స్థిరత్వం
  choice: ‘ఎప్పటికీ స్థిరంగా ఉంటుంది’
  alternative: ‘ఎప్పటికీ స్థాపించబడుతుంది’
  rationale: נָכוֹן స్థాపనతో పాటు దృఢత్వం, భద్రత అనే భావాన్ని ఇస్తుంది. మూలానికి మించిన వ్యవస్థీకృత ధార్మిక వివరణను చేర్చకుండా రాజవంశ స్థిరత్వాన్ని వ్యక్తం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని అనుసరించాం. ‘సింహాసనం,’ ‘సన్నిధి,’ ‘ఆశీర్వదించబడతాడు’ వంటి సాధారణ బైబిలు పదజాలాన్ని నిలిపి, అతిగా ప్రాచీనమైన క్రియారూపాలను నివారించాం.
