source:
  edition: WLC
  text: וְ/הָיָ֣ה בְּ/י֣וֹם צֵאתְ/ךָ֗ וְ/עָֽבַרְתָּ֙ אֶת נַ֣חַל קִדְר֔וֹן יָדֹ֥עַ תֵּדַ֖ע כִּ֣י מ֣וֹת תָּמ֑וּת דָּמְ/ךָ֖ יִהְיֶ֥ה בְ/רֹאשֶֽׁ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/037.yaml
  text: For on the day you go out and cross the Kidron Valley[a], know for certain that you shall surely die[b]; your blood shall be on your own head.
translation:
  language: te
  text: నీవు బయటికి వెళ్లి కిద్రోను లోయను[a] దాటిన రోజున, నీవు తప్పకుండా చనిపోతావని నిశ్చయంగా తెలుసుకో; నీ రక్తం నీ తలమీదే ఉంటుంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కిద్రోను వాగును.’ హీబ్రూ נחל అనే పదం లోయను, వాగును లేదా కాలానుగుణంగా నీరు ప్రవహించే జలమార్గాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘నీ రక్తం నీ తలమీదే ఉంటుంది’ అనేది హీబ్రూ నానుడి; నీ మరణానికి నీవే బాధ్యత వహిస్తావని దీని అర్థం.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  choice: రోజున
  rationale: హీబ్రూ కాలసూచక నిర్మాణం షిమీ నిషేధాన్ని అతిక్రమించే సమయాన్ని గంభీరమైన న్యాయపరమైన శైలిలో సూచిస్తుంది; తెలుగులో ‘రోజున’ సహజంగా, సంక్షిప్తంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: צֵאתְךָ
  choice: నీవు బయటికి వెళ్లి
  rationale: ప్రత్యయంతో ఉన్న హీబ్రూ క్రియానామం పరిమిత ప్రాంతం నుంచి బయటికి వెళ్లే చర్యను సూచిస్తుంది; ఈ అనువాదం దాని క్రియాత్మక భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וְעָבַרְתָּ אֶת נַחַל קִדְרוֹן
  choice: కిద్రోను లోయను దాటిన
  rationale: נחל అనే పదం లోయ, వాగు లేదా కాలానుగుణ జలమార్గాన్ని సూచించగలదు. భౌగోళిక సందర్భంలో ‘కిద్రోను లోయ’ సహజమైన ప్రధాన పఠనం; ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: יָדֹעַ תֵּדַע
  choice: నిశ్చయంగా తెలుసుకో
  rationale: క్రియతో కూడిన infinitive absolute తీవ్ర నిశ్చయాన్ని నొక్కిచెబుతుంది; ‘నిశ్చయంగా తెలుసుకో’ ఆ బలాన్ని ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כִּי מוֹת תָּמוּת
  choice: నీవు తప్పకుండా చనిపోతావని
  rationale: ఇక్కడ కూడా infinitive absolute మరణం అనివార్యమనే ఉద్ఘాటనను ఇస్తుంది; ‘తప్పకుండా’ ఆ తీవ్రతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דָּמְךָ יִהְיֶה בְרֹאשֶׁךָ
  choice: నీ రక్తం నీ తలమీదే ఉంటుంది
  rationale: మరణానికి వ్యక్తియే బాధ్యుడని తెలిపే హీబ్రూ న్యాయపరమైన నానుడిని దాని బలమైన రూపకంతో సహా నిలుపుతూ, ‘మీదే’ ద్వారా స్వీయ బాధ్యతను స్పష్టం చేస్తుంది.
theological_decisions:
- issue: మరణశిక్షకు సంబంధించిన బాధ్యతా నానుడి
  choice: ‘నీ రక్తం నీ తలమీదే ఉంటుంది’ అనే హీబ్రూ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘నీ మరణానికి నీవే బాధ్యుడవుతావు’ అని భావానువాదం చేయడం
  rationale: ఇది ప్రత్యేక సిద్ధాంత వివాదం కాక న్యాయపరమైన హెచ్చరిక మరియు వ్యక్తిగత బాధ్యతకు సంబంధించిన మాట. మూలంలోని రూపకాన్ని ఉంచడం దాని నైతిక, న్యాయపరమైన తీవ్రతను కాపాడుతుంది; అర్థాన్ని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయపరమైన హెచ్చరిక స్వరాన్ని నిలిపాం. ‘చనిపోతావు’ సాధారణ పాఠకులకు సహజంగా ఉండగా, ‘తప్పకుండా’ మరియు ‘నిశ్చయంగా’ మూలంలోని రెండు ఉద్ఘాటక నిర్మాణాల బలాన్ని వేర్వేరుగా కాపాడుతున్నాయి. ‘కిద్రోను’ అనే రూపం హీబ్రూ קִדְרוֹן పేరుకు సమీపమైన తెలుగు లిప్యంతరీకరణ.
