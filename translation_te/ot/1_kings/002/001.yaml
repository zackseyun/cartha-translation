  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే వాక్య నిర్మాణం. ప్రత్యక్ష ప్రసంగం కొనసాగుతుందని సూచించడానికి చివర ద్విబిందువు ఉపయోగించబడింది.
