  text: As the days of David drew near for him to die[a], he commanded Solomon his son, saying,
translation:
  language: te
  text: 'దావీదు చనిపోయే సమయం దగ్గరపడినప్పుడు[a], అతడు తన కుమారుడైన సొలొమోనుకు ఇలా ఆజ్ఞాపించాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరాలా, “దావీదు దినాలు చనిపోవడానికి దగ్గరపడ్డాయి”; ఇది దావీదు మరణించే సమయం సమీపించిందని తెలిపే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ יְמֵי דָוִד לָמוּת
  choice: దావీదు చనిపోయే సమయం దగ్గరపడినప్పుడు
  rationale: ‘దావీదు దినాలు చనిపోవడానికి దగ్గరపడ్డాయి’ అనే హీబ్రూ కాలసంబంధ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, మరణం సమీపించడమనే భావాన్ని నిలుపుతుంది.
- source_word: וַיְצַו
  choice: ఆజ్ఞాపించాడు
  rationale: צוה క్రియలోని ఆజ్ఞ లేదా గంభీరమైన తుది నిర్దేశం భావాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: אֶת שְׁלֹמֹה בְנוֹ
  choice: తన కుమారుడైన సొలొమోనుకు
  rationale: తెలుగులో సహజమైన పదక్రమాన్ని అనుసరిస్తూ సొలొమోను దావీదు కుమారుడని స్పష్టం చేస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాత వచ్చే ప్రత్యక్ష ప్రసంగాన్ని ఆధునిక తెలుగులో సహజంగా పరిచయం చేస్తుంది; ‘అంటూ’ కూడా సాధ్యమే.
