  text: וַ/יְגָ֤רֶשׁ שְׁלֹמֹה֙ אֶת אֶבְיָתָ֔ר מִ/הְי֥וֹת כֹּהֵ֖ן לַֽ/יהוָ֑ה לְ/מַלֵּא֙ אֶת דְּבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֛ר עַל בֵּ֥ית עֵלִ֖י בְּ/שִׁלֹֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/027.yaml
  text: So Solomon drove Abiathar out from being priest to Yahweh[b][a], fulfilling the word of Yahweh that he had spoken concerning the house of Eli in Shiloh.
translation:
  language: te
  text: సొలొమోను అబ్యాతారును యహ్వేకు యాజకునిగా ఉండకుండా వెళ్లగొట్టాడు. దాంతో షిలోహులో ఏలీ వంశం గురించి యహ్వే పలికిన మాట నెరవేరింది.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యహ్వే పలికిన మాటను నెరవేర్చడానికి.” హీబ్రూ వాక్యనిర్మాణం ఉద్దేశాన్ని గానీ ఫలితాన్ని గానీ సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ఏలీ వంశానికి వ్యతిరేకంగా పలికిన మాట గురించి 1 సమూయేలు 2:27–36; 3:11–14 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: తొలగించాడు
  rationale: గּרשׁ బలవంతంగా వెళ్లగొట్టడం లేదా పదవి నుంచి తొలగించడం అనే భావాన్ని ఇస్తుంది. ఇక్కడ వెంటనే వచ్చే ‘యాజకుడిగా ఉండకుండా’ అనే మాటలతో కలిపి, అబ్యాతారు యాజక పదవి నుంచి తొలగించబడిన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מִהְיוֹת כֹּהֵן
  choice: యాజకుడిగా ఉండకుండా
  rationale: מִן + היה అనే నిర్మాణం ఒక స్థితి లేదా బాధ్యత నుంచి తొలగింపును సూచిస్తుంది. ఈ తెలుగు రూపం అబ్యాతారు ఇకపై యాజకుడిగా ఉండకూడదనే ఫలితాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כֹּהֵן לַיהוָה
  choice: యహ్వేకు యాజకుడిగా
  rationale: ל ఇక్కడ యహ్వేకు సంబంధించిన సేవను సూచిస్తుంది. ‘యహ్వేకు యాజకుడు’ అనే రూపం ఆ సేవా సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, వ్యక్తిగత నామానికి సమీపమైన ఆధునిక తెలుగు లిప్యంతరీకరణగా ‘యహ్వే’ వాడబడింది.
- source_word: לְמַלֵּא
  choice: అలా ... నెరవేరింది
  rationale: ל తో కూడిన ఈ క్రియారూపం ఉద్దేశాన్ని లేదా ఫలితాన్ని సూచించగలదు. ప్రధాన పాఠంలో ఫలిత భావాన్ని సహజంగా వ్యక్తం చేసి, ఉద్దేశ భావాన్ని పాదటిప్పణిలో ఉంచడం ద్వారా హీబ్రూ అస్పష్టతను కాపాడాం.
- source_word: דְּבַר יְהוָה
  choice: యహ్వే ... మాట
  rationale: దేవుడు ముందుగా పలికిన ప్రకటనను సూచించే సాధారణ బైబిలు పదబంధంగా ‘యహ్వే పలికిన మాట’ సందర్భానికి సరిపోతుంది.
- source_word: עַל בֵּית עֵלִי
  choice: ఏలీ ఇంటివారి గురించి
  rationale: בֵּית ఒక వంశం లేదా కుటుంబాన్ని సూచించగలదు; ‘ఇంటివారు’ సాధారణ పాఠకులకు ఆ భావాన్ని సహజంగా అందిస్తుంది. עַל‌ను విస్తృతమైన ‘గురించి’గా అనువదించడం తీర్పు సందర్భాన్ని నిరాకరించకుండా దాని మూలార్థ పరిధిని కాపాడుతుంది.
- source_word: בְּשִׁלֹה
  choice: షిలోహులో
  rationale: בְּ యొక్క స్థానార్థాన్ని తెలుగు విభక్తితో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సొలొమోను చర్యకు ముందటి దైవవాక్యానికి ఉన్న సంబంధం
  choice: సొలొమోను చేసిన తొలగింపు ద్వారా ముందుగా పలికిన యహ్వే మాట నెరవేరిన ఫలితాన్ని ప్రధాన పాఠం తెలియజేస్తుంది.
  alternative: సొలొమోను యహ్వే మాటను నెరవేర్చాలనే ఉద్దేశంతో అబ్యాతారును తొలగించాడని కూడా హీబ్రూ వాక్యనిర్మాణాన్ని అర్థం చేసుకోవచ్చు.
  rationale: לְמַלֵּא ఉద్దేశం లేదా ఫలితం రెండింటిలో దేనినైనా వ్యక్తం చేయగలదు. సొలొమోను అంతరంగ ఉద్దేశాన్ని పాఠం చెప్పినదానికంటే ఎక్కువగా నిర్ధారించకుండా, ప్రధాన అనువాదంలో ఫలితాన్ని చూపించి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘యహ్వే’ దైవనామాన్ని నిలుపుతుంది; ‘ఏలీ ఇంటివారు’ కుటుంబం/వంశం అనే హీబ్రూ భావాన్ని సహజంగా తెలియజేస్తుంది.
