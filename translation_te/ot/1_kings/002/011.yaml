id: 1KI.2.11
reference: 1 Kings 2:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/יָּמִ֗ים אֲשֶׁ֨ר מָלַ֤ךְ דָּוִד֙ עַל יִשְׂרָאֵ֔ל אַרְבָּעִ֖ים שָׁנָ֑ה בְּ/חֶבְר֤וֹן מָלַךְ֙ שֶׁ֣בַע שָׁנִ֔ים וּ/בִ/ירוּשָׁלִַ֣ם מָלַ֔ךְ שְׁלֹשִׁ֥ים וְ/שָׁלֹ֖שׁ שָׁנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/011.yaml
  text: The days that David reigned over Israel were forty years. In Hebron he reigned seven years, and in Jerusalem he reigned thirty-three years.
translation:
  language: te
  text: దావీదు ఇశ్రాయేలును పరిపాలించిన కాలం నలభై సంవత్సరాలు. అతడు హెబ్రోనులో ఏడు సంవత్సరాలు, యెరూషలేములో ముప్పైమూడు సంవత్సరాలు పరిపాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ
  choice: పరిపాలించిన కాలం
  rationale: హీబ్రూ ‘అతడు పరిపాలించిన దినాలు’ అనే కాలవ్యవధి నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా ‘పరిపాలించిన కాలం’ అని అందించింది.
- source_word: מָלַךְ
  choice: పరిపాలించాడు
  rationale: రాజుగా ఏలడం అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలును
  rationale: מָלַךְ עַל అంటే ఒక ప్రజపై రాజుగా అధికారం చెలాయించడం; తెలుగులో ‘ఇశ్రాయేలును పరిపాలించాడు’ సహజ నిర్మాణం.
- source_word: אַרְבָּעִים שָׁנָה
  choice: నలభై సంవత్సరాలు
  rationale: సంఖ్యను, కాలవ్యవధిని యథాతథంగా తెలిపే ప్రామాణిక రూపం.
- source_word: בְּחֶבְרוֹן
  choice: హెబ్రోనులో
  rationale: בְּ అనే స్థానార్థక ఉపసర్గను నగరనామంతో సహజమైన తెలుగు సప్తమీవిభక్తిలో అందించింది.
- source_word: וּבִירוּשָׁלִַם
  choice: యెరూషలేములో
  rationale: సంయోజక భావం తెలుగు వాక్యంలోని ‘ఏడు సంవత్సరాలు, యెరూషలేములో’ అనే సమాంతర నిర్మాణంలో నిలిచింది; בִּ స్థానాన్ని సూచిస్తుంది.
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ שָׁנִים
  choice: ముప్పైమూడు సంవత్సరాలు
  rationale: హీబ్రూ ముప్పై మరియు మూడు అనే ఖచ్చితమైన మొత్తాన్ని ఆధునిక తెలుగు సంఖ్యారూపంలో తెలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని మొత్తం పరిపాలనా కాలం మరియు రెండు నగరాల్లోని విభజన స్పష్టంగా నిలుపబడ్డాయి.
