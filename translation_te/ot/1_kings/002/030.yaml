source:
  edition: WLC
  text: וַ/יָּבֹ֨א בְנָיָ֜הוּ אֶל אֹ֣הֶל יְהוָ֗ה וַ/יֹּ֨אמֶר אֵלָ֜י/ו כֹּֽה אָמַ֤ר הַ/מֶּ֨לֶךְ֙ צֵ֔א וַ/יֹּ֥אמֶר לֹ֖א כִּ֣י פֹ֣ה אָמ֑וּת וַ/יָּ֨שֶׁב בְּנָיָ֤הוּ אֶת הַ/מֶּ֨לֶךְ֙ דָּבָ֣ר לֵ/אמֹ֔ר כֹּֽה דִבֶּ֥ר יוֹאָ֖ב וְ/כֹ֥ה עָנָֽ/נִי־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/030.yaml
  text: 'Then Benaiah came to the tent of Yahweh and said to him[a], “Thus says the king: ‘Come out.’” But he said, “No, for I will die here.” And Benaiah brought word back to the king, saying, “Thus Joab spoke, and thus he answered me.”'
translation:
  language: te
  text: 'అప్పుడు బెనాయా యాహ్వే గుడారానికి వచ్చి యోవాబుతో, “రాజు ఇలా చెబుతున్నాడు: ‘బయటికి రా’” అన్నాడు. అయితే యోవాబు, “లేదు; నేను ఇక్కడే చనిపోతాను” అన్నాడు. అప్పుడు బెనాయా రాజు దగ్గరికి తిరిగి వచ్చి, “యోవాబు ఇలా చెప్పాడు; నాకు ఇలా జవాబిచ్చాడు” అని నివేదించాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹהֶל יְהוָה
  choice: యెహోవా గుడారం
  rationale: אֹהֶל కు ‘గుడారం’ ప్రత్యక్షమైన ఆధునిక తెలుగు సమానార్థకం. ఇది ‘మందిరం’ అనే భిన్నమైన హీబ్రూ పదాన్ని దిగుమతి చేయకుండా, ఇక్కడి పవిత్రస్థల సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తినామంగా ఉంచింది.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: రాజు ఇలా చెబుతున్నాడు
  rationale: సందేశవాహక సూత్రంలోని అధికారిక భావాన్ని కాపాడుతూ, ఆధునిక తెలుగులో సహజంగా వినిపించే రూపం.
- source_word: צֵא
  choice: బయటికి రా
  rationale: లోపల ఉన్న వ్యక్తిని ఉద్దేశించిన ఏకవచన ఆజ్ఞగా יצא ను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לֹא כִּי פֹה אָמוּת
  choice: రాను; నేను ఇక్కడే చనిపోతాను
  rationale: లాక్షణిక ‘లేదు’ను తెలుగు సందర్భంలో స్పష్టమైన నిరాకరణగా ‘రాను’ అని వ్యక్తపరచి, פֹה పై ఉన్న స్థల ఉద్ఘాటనను ‘ఇక్కడే’తో నిలిపింది. כִּי యొక్క ఖచ్చిత సంబంధం వివరణ లేదా ప్రతివాద ఉద్ఘాటనగా ఉండగలందున అర్ధవిరామం ద్వారా దానిని అతిగా నిర్ణయించలేదు.
- source_word: וַיָּשֶׁב ... דָּבָר
  choice: తిరిగి వచ్చి ... నివేదించాడు
  rationale: తిరిగి సమాచారం అందించే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగు కథనంగా వ్యక్తపరుస్తుంది.
- source_word: כֹּה דִבֶּר יוֹאָב וְכֹה עָנָנִי
  choice: యోవాబు ఇలా చెప్పాడు; నాకు ఇలా జవాబిచ్చాడు
  rationale: పునరుక్త כֹּה ను రెండుసార్లు ‘ఇలా’గా నిలిపి, అధికారిక నివేదిక శైలిని మరియు హీబ్రూ పునరుక్తిని కాపాడింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుగా మార్చలేదు. ‘యెహోవా’ ఆధునిక తెలుగు బైబిల్ పాఠకులకు సుపరిచితమైన నామరూపం; అయితే ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
- issue: యోవాబు మాటలో כִּי యొక్క సంబంధం
  choice: అర్ధవిరామంతో ప్రతిజ్ఞాత్మక/వివరణాత్మక సంబంధాన్ని తెరిచి ఉంచడం
  alternative: ‘ఎందుకంటే నేను ఇక్కడే చనిపోతాను’
  rationale: כִּי ఇక్కడ కారణాన్ని సూచించవచ్చు; అలాగే ‘లేదు, ఇక్కడే చనిపోతాను’ అనే దృఢ ప్రతివాదాన్ని బలపరచవచ్చు. తెలుగు పాఠంలో ఒకే అర్థాన్ని బలవంతంగా నిర్ణయించకుండా రెండింటికీ చోటు ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; గౌరవప్రదమైనా సామాన్య పాఠకులకు సులభంగా ఉండే కథనశైలి. పేర్లు బెనాయా, యోవాబు అని తెలుగు బైబిల్ వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడ్డాయి. ప్రధాన పాఠంలో పాదటిప్పణులు అవసరం లేకపోవడంతో గుర్తులు లేవు.
