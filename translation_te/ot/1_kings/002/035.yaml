translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. పరిపాలనా సందర్భాన్ని సహజంగా వ్యక్తం చేయడానికి ‘సైన్యంపై’ బదులు ‘సైన్యాధిపతిగా’ అన్నాం; అయితే ‘అతని స్థానంలో’ అనే మూలంలోని సర్వనామ సంబంధాన్ని పాదసూచికతో నిలిపాం.
