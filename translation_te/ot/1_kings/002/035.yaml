source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן הַ/מֶּ֜לֶךְ אֶת בְּנָיָ֧הוּ בֶן יְהוֹיָדָ֛ע תַּחְתָּ֖י/ו עַל הַ/צָּבָ֑א וְ/אֶת צָד֤וֹק הַ/כֹּהֵן֙ נָתַ֣ן הַ/מֶּ֔לֶךְ תַּ֖חַת אֶבְיָתָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/035.yaml
  text: And the king appointed Benaiah son of Jehoiada in his place over the army[a], and the king appointed Zadok the priest in place of Abiathar.
translation:
  language: te
  text: రాజు యెహోయాదా కుమారుడైన బెనాయాను అతని స్థానంలో సైన్యాధిపతిగా నియమించాడు[a]. అబ్యాతారు స్థానంలో యాజకుడైన సాదోకును రాజు నియమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: “అతని స్థానంలో.” ఇక్కడ “అతని” అనేది ముందటి సందర్భంలో పదవి నుంచి తొలగించబడిన సైన్యాధిపతి యోవాబును సూచిస్తుంది.'
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: నియమించాడు
  rationale: మూల క్రియకు అక్షరార్థంగా ‘పెట్టాడు/ఉంచాడు’ అనే భావం ఉన్నా, ఇక్కడ అధికార పదవిలో ప్రతిష్ఠించడాన్ని సూచిస్తుంది; అందువల్ల ఆధునిక తెలుగులో ‘నియమించాడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: ప్రత్యయ సర్వనామం తక్షణ పూర్వ సందర్భంలోని యోవాబును సూచిస్తుంది. మూలంలోని సర్వనామాన్ని ప్రధాన పాఠ్యంలో అలాగే ఉంచి, దాని సూచనను పాదసూచికలో వివరించాం.
- source_word: עַל הַצָּבָא
  choice: సైన్యాధిపతిగా
  rationale: అక్షరార్థంగా ‘సైన్యంపై’ అయినా, సందర్భంలో సైన్యంపై అధికార బాధ్యతను సూచిస్తుంది. తెలుగులో ‘సైన్యాధిపతిగా’ ఆ పరిపాలనా భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּנָיָהוּ בֶן־יְהוֹיָדָע
  choice: యెహోయాదా కుమారుడైన బెనాయా
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని తెలుగులో సహజమైన పదక్రమంతో అందించాం.
- source_word: צָדוֹק הַכֹּהֵן
  choice: యాజకుడైన సాదోకు
  rationale: వ్యక్తి పేరుతో కూడిన పదవిని సహజమైన తెలుగు అన్వయంతో ఇచ్చాం.
- source_word: תַּחַת אֶבְיָתָר
  choice: అబ్యాతారు స్థానంలో
  rationale: పదవిలో ఒకరి స్థానాన్ని మరొకరు స్వీకరించే ప్రత్యామ్నాయ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: నిర్దిష్ట బిరుదును సరళంగా అనువదించాం; హీబ్రూలో రెండో వాక్యభాగంలో పునరుక్తమైనందున తెలుగులోనూ నిలిపాం.
