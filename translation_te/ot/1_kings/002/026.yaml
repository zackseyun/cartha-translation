source:
  edition: WLC
  text: וּ/לְ/אֶבְיָתָ֨ר הַ/כֹּהֵ֜ן אָמַ֣ר הַ/מֶּ֗לֶךְ עֲנָתֹת֙ לֵ֣ךְ עַל שָׂדֶ֔י/ךָ כִּ֛י אִ֥ישׁ מָ֖וֶת אָ֑תָּה וּ/בַ/יּ֨וֹם הַ/זֶּ֜ה לֹ֣א אֲמִיתֶ֗/ךָ כִּֽי נָשָׂ֜אתָ אֶת אֲר֨וֹן אֲדֹנָ֤/י יְהֹוִה֙ לִ/פְנֵי֙ דָּוִ֣ד אָבִ֔/י וְ/כִ֣י הִתְעַנִּ֔יתָ בְּ/כֹ֥ל אֲשֶֽׁר הִתְעַנָּ֖ה אָבִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/026.yaml
  text: And to Abiathar the priest the king said[a], “Go to Anathoth, to your field, for you are a man deserving death; but on this day I will not put you to death, because you carried the ark of the Lord GOD before David my father, and because you shared in all the affliction with which my father was afflicted.”
translation:
  language: te
  text: 'యాజకుడైన అబ్యాతారుతో రాజు ఇలా అన్నాడు: “అనాతోతులోని నీ పొలాలకు వెళ్లిపో. నీవు మరణశిక్షకు పాత్రుడవు[a]. అయితే ఈ రోజున నేను నిన్ను చంపను; ఎందుకంటే నీవు నా తండ్రియైన దావీదు ఎదుట ప్రభువైన యాహ్వే మందసాన్ని మోశావు, అలాగే నా తండ్రి అనుభవించిన కష్టాలన్నిటిలో నీవూ కష్టపడ్డావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీవు మరణపు మనిషివి”; అంటే మరణశిక్షకు అర్హుడవు లేదా దానికి లోబడినవాడవు.
    reason: హీబ్రూ నుడికారం אִישׁ מָוֶת యొక్క అక్షరార్థ రూపాన్ని, దాని సందర్భార్థాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: עֲנָתֹת
  choice: అనాతోతు
  rationale: స్థలనామాన్ని ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: עַל שָׂדֶיךָ
  choice: అనాతోతులోని నీ పొలానికి
  rationale: సందర్భంలో అబ్యాతారు తన సొంత భూమికి తిరిగి పంపబడుతున్నాడు; ‘పొలం’ మూలంలోని నిర్దిష్టమైన భూసూచనను నిలుపుతుంది.
- source_word: אִישׁ מָוֶת
  choice: మరణశిక్షకు పాత్రుడవు
  rationale: అక్షరార్థంగా ‘మరణపు మనిషి’; ఈ హీబ్రూ నుడికారం మరణదండనకు అర్హుడు లేదా దానికి లోబడినవాడు అనే భావాన్ని ఇస్తుంది. సహజమైన తెలుగులో భావాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֲמִיתֶךָ
  choice: నేను నిన్ను చంపను
  rationale: מות హిఫీల్ రూపం ‘చనిపోయేలా చేయడం/చంపడం’ అని అర్థం. రాజు అమలు చేయకుండా వదిలిన మరణదండన సందర్భంలో ఈ తెలుగు స్పష్టంగా ఉంది.
- source_word: נָשָׂאתָ אֶת אֲרוֹן אֲדֹנָי יְהוִה
  choice: ప్రభువైన యాహ్వే మందసాన్ని మోశావు
  rationale: נשא యొక్క భౌతికంగా మోయడం అనే భావాన్ని ‘మోశావు’ నిలుపుతుంది. אֲדֹנָי יְהוִה లోని బిరుదు, దైవనామం రెండింటినీ ‘ప్రభువైన యాహ్వే’గా వ్యక్తం చేశాం.
- source_word: לִפְנֵי דָוִד אָבִי
  choice: నా తండ్రి దావీదు ఎదుట
  rationale: לִפְנֵי యొక్క స్థల/సంబంధార్థమైన ‘ఎదుట, సమక్షంలో’ అనే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: הִתְעַנִּיתָ ... הִתְעַנָּה
  choice: నా తండ్రి అనుభవించిన కష్టాలన్నిటిలో నువ్వూ కష్టపడ్డావు
  rationale: రెండు సంబంధిత క్రియారూపాల పునరుక్తిని ‘కష్టాలు/కష్టపడ్డావు’ ద్వారా సాధ్యమైనంతవరకు నిలిపి, అబ్యాతారు దావీదు బాధల్లో పాలుపంచుకున్న భావాన్ని సహజమైన తెలుగులో తెలిపాం.
- source_word: כִּי ... וְכִי
  choice: ఎందుకంటే ... ; ... నువ్వూ
  rationale: రెండు ఉపవాక్యాలూ రాజు చూపిన కనికరానికి కారణాలు. తెలుగులో మొదటి ‘ఎందుకంటే’ పరిధిలో రెండవ కారణాన్ని సమన్వయంగా చేర్చడం సహజంగా ఉంటుంది.
theological_decisions:
- issue: אֲדֹנָי יְהוִה అనే సంయుక్త దైవసంబోధన అనువాదం
  choice: ప్రభువైన యాహ్వే
  alternative: ప్రభువైన దేవుడు; ప్రభువైన యెహోవా
  rationale: మూలంలో ఉన్న אֲדֹנָי అనే బిరుదును, יהוה అనే ప్రత్యేక దైవనామాన్ని రెండింటినీ వేరువేరుగా గుర్తించగలిగేలా ఉంచాం; సాధారణ నామమైన ‘దేవుడు’తో దైవనామాన్ని భర్తీ చేయలేదు.
- issue: అబ్యాతారు అనుభవించిన బాధల స్వరూపం
  choice: నా తండ్రి అనుభవించిన కష్టాలన్నిటిలో నువ్వూ కష్టపడ్డావు
  alternative: నా తండ్రి శ్రమలన్నిటిలో నీవు పాలుపంచుకున్నావు
  rationale: హీబ్రూ వాక్యం బాధను పంచుకోవడం లేదా దానిలో సహభాగితను సూచిస్తుంది; దానికి ప్రత్యేకమైన మతపరమైన లేదా ప్రాయశ్చిత్త సంబంధమైన అర్థాన్ని జోడించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. రాజు అబ్యాతారును నేరుగా సంబోధిస్తున్నందున ఏకవచన ‘నీవు/నిన్ను’ రూపాలను వాడాం. మూలంలోని కారణ సంబంధం, న్యాయపరమైన తీవ్రత, గత బాధల్లో భాగస్వామ్యం అన్నింటినీ సహజమైన వాక్యనిర్మాణంతో నిలిపాం.
