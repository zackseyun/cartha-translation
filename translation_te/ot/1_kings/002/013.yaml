language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֞א אֲדֹנִיָּ֣הוּ בֶן חַגֵּ֗ית אֶל בַּת שֶׁ֨בַע֙ אֵם שְׁלֹמֹ֔ה וַ/תֹּ֖אמֶר הֲ/שָׁל֣וֹם בֹּאֶ֑/ךָ וַ/יֹּ֖אמֶר שָׁלֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/013.yaml
  text: Then Adonijah son of Haggith came to Bathsheba[a], the mother of Solomon, and she said, “Do you come in peace?” And he said, “In peace.”
translation:
  language: te
  text: అప్పుడు హగ్గీతు కుమారుడైన అదోనీయా సొలొమోను తల్లి బత్షెబా దగ్గరికి వచ్చాడు. ఆమె అతనితో, “నీవు శాంతితో వచ్చావా?[a]” అని అడిగింది. అతడు, “శాంతితో” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ రాక శాంతేనా?”
    reason: హీబ్రూ ప్రశ్నలోని నామవాచక నిర్మాణాన్ని చూపించే మరింత అక్షరార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చాడు
  rationale: בוא సందర్భానుసారంగా ‘వచ్చు/వెళ్లు’ అని అర్థమవుతుంది. ఇక్కడ బత్షెబ వైపు కథన దృష్టి ఉండటంతో ‘దగ్గరికి వచ్చాడు’ సహజంగా ఉంది.
- source_word: אֲדֹנִיָּהוּ
  choice: అదోనీయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సుపరిచితమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: בֶן חַגֵּית
  choice: హగ్గీతు కుమారుడైన
  rationale: తల్లి పేరుతో అదోనీయాను గుర్తించే హీబ్రూ సంబంధ నిర్మాణాన్ని సహజమైన తెలుగులో నిలిపింది.
- source_word: בַּת שֶׁבַע
  choice: బత్షెబ
  rationale: హీబ్రూ వ్యక్తినామానికి దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణ.
- source_word: אֵם שְׁלֹמֹה
  choice: సొలొమోను తల్లి
  rationale: బత్షెబను సొలొమోనుతో ఉన్న రాజకుటుంబ సంబంధం ద్వారా గుర్తించే మూలపాఠ భావాన్ని సహజమైన తెలుగు పదక్రమంలో తెలిపింది.
- source_word: הֲשָׁלוֹם בֹּאֶךָ
  choice: నీవు శాంతితోనే వచ్చావా?
  rationale: שָׁלוֹם ఇక్కడ కేవలం అభివాదం కాక, అతని రాక వెనుక శాంతియుత ఉద్దేశం ఉందా అనే అప్రమత్తమైన ప్రశ్న. ‘శాంతితోనే’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: שָׁלוֹם
  choice: శాంతితోనే
  rationale: అదోనీయా సమాధానం హీబ్రూలో సంక్షిప్తంగా, ప్రశ్నలోని పదాన్నే పునరావృతం చేస్తుంది; ఈ తెలుగు రూపం ఆ సంక్షిప్తతను నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. సంభాషణలోని అప్రమత్తతను ‘శాంతితోనే’ ద్వారా, సమాధానంలోని సంక్షిప్తతను అదే పదబంధ పునరావృతం ద్వారా నిలిపాం.
