    text: అక్షరార్థంగా, “నీ రాక శాంతేనా?”
    reason: హీబ్రూ ప్రశ్నలోని నామవాచక నిర్మాణాన్ని చూపించే మరింత అక్షరార్థ ప్రత్యామ్నాయం.
  revision_rationale: The revision removes an added emphatic nuance, preserves the terse repetition of the Hebrew dialogue, and regularizes Bathsheba’s name as ‘బత్షెబా.’ The footnote anchor and its lexical alternative remain accurate.
