revisions:
- from: అయితే గిలాదీయుడైన బర్జిల్లయి కుమారులపట్ల విశ్వసనీయమైన దయ చూపు[a]. వారు నీ బల్ల దగ్గర భోజనం చేసేవారిలో ఉండాలి[b]. ఎందుకంటే, నీ సహోదరుడైన అబ్షాలోము ఎదుటనుండి నేను పారిపోయినప్పుడు వారు ఇలాగే నా దగ్గరకు వచ్చారు[c].
  to: అయితే గిలాదీయుడైన బర్జిల్లయి కుమారులతో దయతో వ్యవహరించు[a]. వారు నీ భోజన బల్ల వద్ద భోజనం చేసేవారిలో ఉండాలి[b]. ఎందుకంటే, నీ సహోదరుడైన అబ్షాలోము నుండి నేను పారిపోతున్నప్పుడు, వారు ఈ విధంగానే నాకు తోడుగా వచ్చారు[c].
  rationale: సహజం కాని “ఎదుటనుండి”ని సందర్భసమ్మతమైన “నుండి”గా సవరించాం. חֶסֶד ను ఆధునిక తెలుగులో సజావుగా వినిపించే “దయతో వ్యవహరించు”గా ఇచ్చి, దాని విశ్వసనీయత భావాన్ని పాదటిప్పణిలో నిలిపాం. అలాగే, כִּי כֵן యొక్క అనుసంధాన భావాన్ని “ఈ విధంగానే నాకు తోడుగా వచ్చారు” ద్వారా స్పష్టం చేశాం; కర్వు క్రియ యొక్క అక్షరార్థం పాదటిప్పణిలో భద్రపరచబడింది.
