  revised_text: అయితే గిలాదీయుడైన బర్జిల్లయి కుమారులతో దయతో వ్యవహరించు[a]. వారు నీ భోజన బల్ల వద్ద భోజనం చేసేవారిలో ఉండాలి[b]. ఎందుకంటే, నీ సహోదరుడైన అబ్షాలోము నుండి నేను పారిపోతున్నప్పుడు, వారు ఈ విధంగానే నాకు తోడుగా వచ్చారు[c].
