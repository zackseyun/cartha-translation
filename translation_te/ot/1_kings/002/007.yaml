source:
  edition: WLC
  text: וְ/לִ/בְנֵ֨י בַרְזִלַּ֤י הַ/גִּלְעָדִי֙ תַּֽעֲשֶׂה חֶ֔סֶד וְ/הָי֖וּ בְּ/אֹכְלֵ֣י שֻׁלְחָנֶ֑/ךָ כִּי כֵן֙ קָרְב֣וּ אֵלַ֔/י בְּ/בָרְחִ֕/י מִ/פְּנֵ֖י אַבְשָׁל֥וֹם אָחִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/007.yaml
  text: But show kindness to the sons of Barzillai the Gileadite[a], and let them be among those who eat at your table[c][b], for this is how they came near to me when I fled from Absalom your brother.
translation:
  language: te
  text: అయితే గిలాదీయుడైన బర్జిల్లయి కుమారులతో దయతో వ్యవహరించు[a]. వారు నీ భోజన బల్ల వద్ద భోజనం చేసేవారిలో ఉండాలి[b]. ఎందుకంటే, నీ సహోదరుడైన అబ్షాలోము నుండి నేను పారిపోతున్నప్పుడు, వారు ఈ విధంగానే నాకు తోడుగా వచ్చారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బర్జిల్లయి కుమారులతో నిబద్ధతగా వ్యవహరించు.” హీబ్రూ పదబంధం కేవలం భావోద్వేగ దయనే కాక, విశ్వసనీయతతో కూడిన దయను కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “నీ బల్లను భుజించేవారిలో ఉండాలి.” ఇది రాజు నుండి నిరంతర పోషణ, ఆదరణ పొందడాన్ని సూచించే నుడికారం.
    reason: cultural_note
  - marker: c
    text: అక్షరార్థంగా, “వారు నా దగ్గరకు వచ్చారు.” సందర్భంలో ఇది దావీదు పారిపోతున్నప్పుడు వారు అతనికి తోడుగా నిలిచారని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: అయితే ... కుమారులపట్ల
  rationale: మునుపటి ఆదేశానికి భిన్నంగా ఇక్కడ చేయవలసిన మేలును సూచిస్తున్నందున וְ ను సందర్భానుసారంగా ‘అయితే’ అని ఇచ్చాం. בְנֵי అనే నిర్మాణాన్ని పురుష సంతానాన్ని సూచించే ‘కుమారులు’గా అనువదించాం.
- source_word: בַרְזִלַּי הַגִּלְעָדִי
  choice: గిలాదీయుడైన బర్జిల్లయి
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించి, ప్రాంతీయ గుర్తింపును సహజమైన తెలుగు విశేషణ నిర్మాణంతో అనువదించాం.
- source_word: תַּעֲשֶׂה חֶסֶד
  choice: విశ్వసనీయమైన దయ చూపు
  rationale: חֶסֶד లోని దయతో కూడిన విశ్వసనీయత/నిబద్ధత భావాన్ని ‘దయ’ మాత్రమే అని కుదించకుండా, అదే సమయంలో ప్రత్యేక ఒడంబడిక సిద్ధాంత పదాన్ని రుద్దకుండా వ్యక్తం చేస్తుంది.
- source_word: וְהָיוּ
  choice: వారు ... ఉండాలి
  rationale: ఆదేశ సందర్భంలో ఈ రూపం సంకల్పాత్మక లేదా ఆజ్ఞార్థక భావాన్ని ఇస్తుంది; తెలుగులో ‘ఉండాలి’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: בְּאֹכְלֵי שֻׁלְחָנֶךָ
  choice: నీ బల్ల దగ్గర భోజనం చేసేవారిలో
  rationale: అక్షరార్థ చిత్రాన్ని నిలుపుతూ, నిరంతర రాజపోషణ మరియు అనుగ్రహాన్ని సూచించే నుడికారాన్ని సహజ తెలుగులో తెలిపింది.
- source_word: כִּי כֵן
  choice: ఎందుకంటే ... ఇలాగే
  rationale: כִּי యొక్క కారణార్థాన్ని, כֵן యొక్క అనురూప విధాన భావాన్ని రెండింటినీ నిలుపుతుంది; ఇది బర్జిల్లయి కుమారులకు చూపవలసిన దయకు వారు దావీదుకు చేసిన సహాయాన్ని ఆధారంగా చూపుతుంది.
- source_word: קָרְבוּ אֵלַי
  choice: వారు ... నా దగ్గరకు వచ్చారు
  rationale: క్రియ యొక్క ప్రాథమికమైన ‘దగ్గరకు వచ్చారు’ అనే భావాన్ని నిలిపాం; సందర్భంలో అది మద్దతుగా వచ్చారనే సూచనను ఇస్తుంది కానీ దానిని ప్రధాన పాఠంలో స్పష్టీకరించి మూలంలోని విస్తృతార్థాన్ని కుదించలేదు.
- source_word: בְּבָרְחִי מִפְּנֵי
  choice: ఎదుటనుండి నేను పారిపోయినప్పుడు
  rationale: కాలార్థక infinitive నిర్మాణాన్ని సహజమైన ‘పారిపోయినప్పుడు’గా, מִפְּנֵי లోని ‘ముఖం/సన్నిధి ఎదుటనుండి’ భావాన్ని ‘ఎదుటనుండి’గా నిలిపాం.
- source_word: אַבְשָׁלוֹם אָחִיךָ
  choice: నీ సహోదరుడైన అబ్షాలోము
  rationale: పేరును లిప్యంతరీకరించి, కుటుంబ సంబంధాన్ని మూలంలో ఉన్నట్లే స్పష్టంగా ఉంచాం.
theological_decisions:
- issue: חֶסֶד యొక్క భావవ్యాప్తి
  choice: విశ్వసనీయమైన దయ
  alternative: దయ / ఒడంబడిక విశ్వసనీయత
  rationale: ఈ సందర్భంలో దయ మరియు నిబద్ధత రెండూ కలిసివున్నాయి. ‘దయ’ మాత్రమే భావాన్ని పలుచన చేయవచ్చు; ‘ఒడంబడిక విశ్వసనీయత’ మాత్రం సందర్భం నిర్బంధించని ప్రత్యేక ధార్మిక వ్యాఖ్యానాన్ని జోడించవచ్చు.
- issue: קָרְבוּ אֵלַי లో సహాయ భావం
  choice: నా దగ్గరకు వచ్చారు
  alternative: నాకు అండగా నిలిచారు / నాకు సహాయం చేయడానికి వచ్చారు
  rationale: సందర్భం వారి మద్దతును సూచించినా, హీబ్రూ క్రియ అక్షరార్థంగా ‘దగ్గరకు వచ్చారు’. ప్రధాన పాఠం ఆ విస్తృతతను కాపాడి, సూచిత సహాయ భావాన్ని పాదటిప్పణిలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభంగా అర్థమయ్యే శైలి వాడాం. రాజసభ సందర్భానికి తగిన ‘బల్ల దగ్గర భోజనం’ చిత్రాన్ని నిలిపి, పాతబడిన లేదా అతిగా సంస్కృతీకృత పదజాలాన్ని నివారించాం. మూలంలోని సంబోధన ఏకవచనం కాబట్టి ‘చూపు’, ‘నీ’ రూపాలు వాడాం.
