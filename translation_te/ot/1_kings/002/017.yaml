source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אִמְרִי נָא֙ לִ/שְׁלֹמֹ֣ה הַ/מֶּ֔לֶךְ כִּ֥י לֹֽא יָשִׁ֖יב אֶת פָּנָ֑יִ/ךְ וְ/יִתֶּן לִ֛/י אֶת אֲבִישַׁ֥ג הַ/שּׁוּנַמִּ֖ית לְ/אִשָּֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/017.yaml
  text: And he said[a], “Please speak to King Solomon, for he will not refuse you, and let him give me Abishag the Shunammite as a wife.”
translation:
  language: te
  text: అతడు, “దయచేసి సొలొమోను రాజుతో చెప్పండి; ఆయన మీ అభ్యర్థనను తిరస్కరించరు[a]. షూనేమీయురాలైన అబీషగును నాకు భార్యగా ఇవ్వమని అడగండి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఆయన మీ ముఖాన్ని వెనక్కి తిప్పరు.” ఇది “ఆయన మీ అభ్యర్థనను తిరస్కరించరు” లేదా “మీ కోరికను నిరాకరించరు” అనే అర్థమిచ్చే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרִי נָא
  choice: దయచేసి ... మాట్లాడు
  rationale: స్త్రీ ఏకవచన ఆజ్ఞారూపంతో ఉన్న נָא మర్యాదపూర్వక అభ్యర్థనను సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజంగా వినిపిస్తుంది.
- source_word: לִשְׁלֹמֹה הַמֶּלֶךְ
  choice: సొలొమోను రాజుతో
  rationale: హీబ్రూ దిశాసూచక భావాన్ని తెలుగు సంభాషణా ప్రయోగానికి తగిన ‘తో మాట్లాడు’ నిర్మాణంతో వ్యక్తం చేస్తుంది; రాజబిరుదును పేరుకు తరువాత ఉంచడం సహజ తెలుగు క్రమం.
- source_word: כִּי לֹא יָשִׁיב אֶת פָּנָיִךְ
  choice: ఆయన నీ మాటను కాదనడు
  rationale: ముఖాన్ని వెనక్కి తిప్పడు అనే హీబ్రూ నుడికారానికి ఇక్కడ అభ్యర్థనను తిరస్కరించడు అనే భావం ఉంది. ‘నీ మాటను కాదనడు’ వ్యక్తినే తిరస్కరిస్తాడనే అనవసర భావాన్ని నివారిస్తూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: וְיִתֶּן לִי
  choice: నాకు ... ఇవ్వమని అడుగు
  rationale: సందర్భంలో ఈ క్రియ బత్షెబ సొలొమోనుకు తెలియజేయవలసిన అభ్యర్థన విషయాన్ని సూచిస్తుంది; తెలుగులో పరోక్ష అభ్యర్థనగా స్పష్టంగా, సహజంగా వ్యక్తమవుతుంది.
- source_word: אֲבִישַׁג הַשּׁוּנַמִּית
  choice: షూనేమీయురాలైన అబీషగు
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించి, షూనేము ప్రాంతానికి చెందిన స్త్రీని సూచించే జాతివాచక రూపాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: לְאִשָּׁה
  choice: భార్యగా
  rationale: ఈ నిర్మాణం వివాహ సంబంధాన్ని సూచిస్తుంది; ‘భార్యగా’ సంక్షిప్తంగా, స్పష్టంగా ఆ భావాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే రాజదర్బారు సందర్భానికి తగిన గౌరవపూర్వక శైలిలో అనువదించబడింది. మూలంలోని పురుష ఏకవచన సర్వనామాన్ని గౌరవార్థకంగా ‘ఆయన’ అని అందించి, ప్రత్యక్ష వాక్య నిర్మాణాన్ని నిలుపుతూ తెలుగులో సహజత కోసం చివరి అభ్యర్థనను ‘ఇవ్వమని అడుగు’గా వ్యక్తం చేసింది.
