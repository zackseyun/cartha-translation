translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సంక్షిప్త అంగీకారాన్ని, మధ్యవర్తిత్వ సందర్భాన్ని కాపాడుతూ ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో ఉంచింది.
