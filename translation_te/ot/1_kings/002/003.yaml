  to: 'నీ దేవుడైన యాహ్వే విధించిన కర్తవ్యాన్ని పాటించు: ఆయన మార్గాల్లో నడుచుకుంటూ, మోషే ధర్మశాస్త్రంలో వ్రాయబడిన ప్రకారం ఆయన కట్టడాలను, ఆజ్ఞలను, న్యాయవిధులను, సాక్ష్యాలను పాటించు. దీనివల్ల నీవు చేసే ప్రతి పనిలోనూ, నీవు ఎటు తిరిగినా వివేకంతో ప్రవర్తిస్తావు[a].'
