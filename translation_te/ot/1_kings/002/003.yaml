source:
  edition: WLC
  text: וְ/שָׁמַרְתָּ֞ אֶת מִשְׁמֶ֣רֶת יְהוָ֣ה אֱלֹהֶ֗י/ךָ לָ/לֶ֤כֶת בִּ/דְרָכָי/ו֙ לִ/שְׁמֹ֨ר חֻקֹּתָ֤י/ו מִצְוֺתָי/ו֙ וּ/מִשְׁפָּטָ֣י/ו וְ/עֵדְוֺתָ֔י/ו כַּ/כָּת֖וּב בְּ/תוֹרַ֣ת מֹשֶׁ֑ה לְמַ֣עַן תַּשְׂכִּ֗יל אֵ֚ת כָּל אֲשֶׁ֣ר תַּֽעֲשֶׂ֔ה וְ/אֵ֛ת כָּל אֲשֶׁ֥ר תִּפְנֶ֖ה שָֽׁם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/003.yaml
  text: And keep the charge of Yahweh your God by walking in his ways and by keeping his statutes[a], his commandments, his judgments, and his testimonies, as it is written in the Law of Moses, so that you may act wisely in all that you do and wherever you turn.
translation:
  language: te
  text: 'నీ దేవుడైన యాహ్వే విధించిన కర్తవ్యాన్ని పాటించు: ఆయన మార్గాల్లో నడుచుకుంటూ, మోషే ధర్మశాస్త్రంలో వ్రాయబడిన ప్రకారం ఆయన కట్టడాలను, ఆజ్ఞలను, న్యాయవిధులను, సాక్ష్యాలను పాటించు. దీనివల్ల నీవు చేసే ప్రతి పనిలోనూ, నీవు ఎటు తిరిగినా వివేకంతో ప్రవర్తిస్తావు[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సఫలమవుతావు.” హీబ్రూ క్రియ వివేకంతో ప్రవర్తించడాన్ని గానీ, దాని ఫలితంగా కలిగే సఫలతను గానీ నొక్కి చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ אֶת־מִשְׁמֶרֶת
  choice: అప్పగించిన బాధ్యతను నెరవేర్చు
  rationale: మִשְׁמֶרֶת అప్పగించబడిన కర్తవ్యాన్ని లేదా బాధ్యతను సూచిస్తుంది. తెలుగు సహజత్వం కోసం క్రియతో కలిపి అనువదించబడింది; సంధి కలిగిన సంపూర్ణ క్రియ ఇక్కడ ఉపదేశాత్మక ఆజ్ఞగా పనిచేస్తుంది.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యాహ్వే
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించి, אֱלֹהֶיךָను సహజమైన తెలుగు సంబంధ నిర్మాణంలో ఇచ్చింది.
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: ఆయన మార్గాల్లో నడుచుకుంటూ
  rationale: హీబ్రూ ‘మార్గాల్లో నడవడం’ అనే విధేయతా రూపకాన్ని నిలుపుతూ, ప్రధాన ఆజ్ఞను ఎలా నెరవేర్చాలో తెలిపే విధంగా అనువదించబడింది.
- source_word: חֻקֹּתָיו מִצְוֺתָיו וּמִשְׁפָּטָיו וְעֵדְוֺתָיו
  choice: ఆయన కట్టడలను, ఆజ్ఞలను, న్యాయవిధులను, సాక్ష్యవాక్యాలను
  rationale: 'నాలుగు ధర్మశాస్త్ర సంబంధ పదాల మధ్య ఉన్న పదభేదాన్ని సాధ్యమైనంతవరకు కాపాడింది: నిర్ణయించిన కట్టడలు, ఆదేశాలు, న్యాయపరమైన విధులు, నిబంధనకు సాక్ష్యంగా నిలిచే వాక్యాలు.'
- source_word: כַּכָּתוּב בְּתוֹרַת מֹשֶׁה
  choice: మోషే ధర్మశాస్త్రంలో రాసి ఉన్న ప్రకారం
  rationale: వ్రాతపూర్వక మోషే తోరాను సూచించే సందర్భంలో ‘ధర్మశాస్త్రం’ స్పష్టమైన, స్థిరపడిన తెలుగు ప్రయోగం.
- source_word: לְמַעַן תַּשְׂכִּיל
  choice: అప్పుడు ... వివేకంతో ప్రవర్తిస్తావు
  rationale: שׂכל హిఫీల్ రూపం వివేకంతో వ్యవహరించడం అనే భావాన్ని ప్రధానంగా వ్యక్తపరుస్తుంది; దాని ఫలితంగా కలిగే సఫలత భావం పాదసూచికలో నిలుపబడింది.
- source_word: אֵת כָּל־אֲשֶׁר תַּעֲשֶׂה וְאֵת כָּל־אֲשֶׁר תִּפְנֶה שָׁם
  choice: నీవు చేసే ప్రతి పనిలోనూ, నీవు ఎటు తిరిగినా
  rationale: చర్యలన్నిటినీ, వెళ్లే లేదా దృష్టి మళ్లించే ప్రతి దిశనూ కలిపి సూచించే హీబ్రూ విస్తృత భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా, హీబ్రూ నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణను వాడింది.
- issue: לְמַעַן תַּשְׂכִּיל యొక్క భావవిస్తృతి
  choice: వివేకంతో ప్రవర్తిస్తావు
  alternative: సఫలమవుతావు
  rationale: ఈ క్రియ వివేకయుక్తమైన కార్యాచరణను, దానివల్ల కలిగే సఫలతను రెండింటినీ సూచించగలదు. ప్రధాన పాఠంలో వివేకపూర్వక ప్రవర్తనను ఎంచుకుని, ఫలితార్థాన్ని పాదసూచికలో ఉంచడం ద్వారా అసలు భావ ఉద్వేగాన్ని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘మార్గాల్లో నడుచుకోవడం’ అనే మూల రూపకాన్ని, ధర్మశాస్త్ర పదజాలంలోని భేదాలను నిలుపుతూ, పొడవైన హీబ్రూ వాక్యాన్ని స్పష్టత కోసం రెండు తెలుగు వాక్యాలుగా విభజించాం.
