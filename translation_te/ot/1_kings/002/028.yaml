source:
  edition: WLC
  text: וְ/הַ/שְּׁמֻעָה֙ בָּ֣אָה עַד יוֹאָ֔ב כִּ֣י יוֹאָ֗ב נָטָה֙ אַחֲרֵ֣י אֲדֹנִיָּ֔ה וְ/אַחֲרֵ֥י אַבְשָׁל֖וֹם לֹ֣א נָטָ֑ה וַ/יָּ֤נָס יוֹאָב֙ אֶל אֹ֣הֶל יְהוָ֔ה וַֽ/יַּחֲזֵ֖ק בְּ/קַרְנ֥וֹת הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/028.yaml
  text: And the report came to Joab[a], for Joab had turned after Adonijah, though he had not turned after Absalom[b]. So Joab fled to the tent of Yahweh and took hold of the horns of the altar.
translation:
  language: te
  text: ఆ వార్త యోవాబుకు చేరింది. యోవాబు అబ్షాలోము పక్షం వహించకపోయినా, అదోనీయా పక్షం వహించాడు[a]. కాబట్టి యోవాబు యాహ్వే గుడారానికి పారిపోయి, బలిపీఠపు కొమ్ములను[b] పట్టుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, “అదోనీయా వెంట తిరిగాడు … అబ్షాలోము వెంట తిరగలేదు.” సందర్భంలో ఇది వారి పక్షం వహించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘కొమ్ములు’ అంటే బలిపీఠపు నాలుగు మూలల్లో పైకి పొడుచుకొచ్చిన కొమ్ము ఆకారపు భాగాలు. వాటిని పట్టుకోవడం ఆశ్రయం లేదా కనికరం కోసం చేసే విజ్ఞప్తి.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְּׁמֻעָה
  choice: ఆ వార్త
  rationale: ఇక్కడ ఈ నామవాచకం యోవాబుకు చేరిన సమాచారం లేదా వార్తను సూచిస్తుంది. ‘పుకారు’ అనడం మూలంలో లేని అనిశ్చితిని కలిగిస్తుంది.
- source_word: בָּאָה עַד
  choice: చేరింది
  rationale: ‘ఒకరి వరకు వచ్చింది’ అనే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో ‘చేరింది’ అని అందించింది.
- source_word: נָטָה אַחֲרֵי
  choice: పక్షం వహించాడు
  rationale: పదశః ‘వెనుకకు తిరిగాడు’ అనే రూపకం ఉన్నప్పటికీ, సందర్భంలో ఇది రాజకీయ విధేయతను సూచిస్తుంది. రెండు ఉపవాక్యాల్లోనూ ఒకే పదబంధాన్ని వాడి మూలంలోని పునరుక్తిని నిలిపింది; పదశః రూపాన్ని పాదటిప్పణిలో తెలిపింది.
- source_word: וְאַחֲרֵי אַבְשָׁלוֹם לֹא נָטָה
  choice: అబ్షాలోము పక్షం వహించకపోయినా
  rationale: వ్యతిరేకతను తెలుగులో సహజంగా తెలియజేస్తూ, అదోనీయా మరియు అబ్షాలోము విషయంలో మూలంలోని ఒకే రాజకీయ ప్రయోగాన్ని నిలిపింది.
- source_word: וַיָּנָס
  choice: పారిపోయి
  rationale: అపాయం నుంచి తప్పించుకోవడానికి త్వరగా వెళ్లడాన్ని సూచించే సాధారణ కథన రూపం.
- source_word: אֹהֶל יְהוָה
  choice: యాహ్వే గుడారం
  rationale: ‘యాహ్వే యొక్క గుడారం’ అనే మూలార్థాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది; ‘మందిరం’ వంటి భిన్న నిర్మాణాన్ని దిగుమతి చేయదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: וַיַּחֲזֵק בְּקַרְנוֹת הַמִּזְבֵּחַ
  choice: బలిపీఠపు కొమ్ములను పట్టుకున్నాడు
  rationale: భౌతిక చర్యను అతిగా వ్యాఖ్యానించకుండా నేరుగా అందిస్తుంది. ‘కొమ్ములు’ అనే సాంస్కృతిక రూపాన్ని పాదటిప్పణి వివరిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని నామాన్ని కాపాడుతుంది.
- issue: נָטָה אַחֲרֵי అనే రాజకీయ ప్రయోగాన్ని పదశః ఉంచాలా, భావానువాదం చేయాలా
  choice: పక్షం వహించాడు
  alternative: వెంట తిరిగాడు; అనుసరించాడు
  rationale: తెలుగులో ‘వెంట తిరిగాడు’ ఈ సందర్భంలో అసహజంగా లేదా కేవలం భౌతిక చర్యగా వినిపించవచ్చు. ‘పక్షం వహించాడు’ రాజకీయ అనుబంధాన్ని స్పష్టంగా తెలియజేస్తుంది; మూలంలోని రూపకాన్ని పాదటిప్పణి ద్వారా కాపాడింది.
- issue: బలిపీఠపు కొమ్ములను పట్టుకోవడంలోని ఉద్దేశాన్ని ప్రధాన పాఠంలో వివరించాలా
  choice: చర్యను మాత్రమే ప్రధాన పాఠంలో ఉంచడం
  alternative: ఆశ్రయం లేదా కనికరం కోరాడని ప్రధాన పాఠంలో చేర్చడం
  rationale: మూల వాక్యం చర్యను మాత్రమే చెబుతుంది; దాని సాంస్కృతిక ప్రాధాన్యాన్ని ప్రధాన పాఠంలో చేర్చడం వ్యాఖ్యానాన్ని దిగుమతి చేస్తుంది. అందువల్ల వివరణను పాదటిప్పణికి పరిమితం చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించింది. వ్యక్తినామాలకు సాధారణ బైబిలు తెలుగు రూపాలు, దైవనామానికి ‘యాహ్వే’ రూపం వాడింది. హీబ్రూ రాజకీయ ప్రయోగంలోని పునరుక్తిని రెండు ఉపవాక్యాల్లో ఒకే తెలుగు పదబంధంతో నిలిపింది.
