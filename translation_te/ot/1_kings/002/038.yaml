source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שִׁמְעִ֤י לַ/מֶּ֨לֶךְ֙ ט֣וֹב הַ/דָּבָ֔ר כַּ/אֲשֶׁ֤ר דִּבֶּר֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כֵּ֖ן יַעֲשֶׂ֣ה עַבְדֶּ֑/ךָ וַ/יֵּ֧שֶׁב שִׁמְעִ֛י בִּ/ירוּשָׁלִַ֖ם יָמִ֥ים רַבִּֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/038.yaml
  text: Shimei said to the king[a], “The word is good. Just as my lord the king has spoken, so your servant will do.” And Shimei lived in Jerusalem many days.
translation:
  language: te
  text: షిమీ రాజుతో, “ఆ మాట మంచిదే.[a] నా ప్రభువైన రాజు చెప్పినట్టే మీ సేవకుడు చేస్తాడు” అన్నాడు. షిమీ యెరూషలేములో చాలా రోజులు నివసించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆ విషయం మంచిదే,” లేదా “మీరు చెప్పింది మంచిదే.”
    reason: דָּבָר అనే హీబ్రూ పదానికి ఈ సందర్భంలో ‘మాట,’ ‘విషయం/సంగతి,’ లేదా చెప్పబడినదంతా అనే భావాలు సాధ్యమైనందున నిజమైన పదార్థ వైవిధ్యాన్ని చూపడం.
lexical_decisions:
- source_word: טוֹב הַדָּבָר
  choice: ఆ మాట మంచిదే
  rationale: דָּבָר అనే పదానికి ‘మాట,’ ‘విషయం,’ ‘సంగతి’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ షిమీ రాజు విధించిన షరతుకు స్పందిస్తున్నందున ‘ఆ మాట మంచిదే’ అనేది హీబ్రూ భావాన్ని నేరుగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయ భావాలను పాదసూచికలో ఉంచాం.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజు
  rationale: రాజసభ సందర్భంలోని గౌరవపూర్వక సంబోధనను ‘నా ప్రభువైన రాజు’ సహజంగా నిలుపుతుంది; ‘యజమాని’ అనడం ఇక్కడ అవసరానికి మించి సేవకత్వ భావాన్ని ముందుకు తెచ్చే అవకాశం ఉంది.
- source_word: כֵּן יַעֲשֶׂה עַבְדֶּךָ
  choice: మీ సేవకుడు చేస్తాడు
  rationale: עַבְדֶּךָ ఇక్కడ రాజు ఎదుట వినయపూర్వక స్వీయసూచన; అందువల్ల ‘మీ సేవకుడు’ సముచితం. יַעֲשֶׂה సందర్భంలో భవిష్యత్తు విధేయతను తెలిపేందున ‘చేస్తాడు’ అని అనువదించాం.
- source_word: וַיֵּשֶׁב
  choice: నివసించాడు
  rationale: יָשַׁב స్థలనివాస సందర్భంలో ‘నివసించు’ అనే అర్థం ఇస్తుంది. షిమీ యెరూషలేములో ఉండిపోయిన విషయాన్ని ఇది స్పష్టంగా తెలియజేస్తుంది.
- source_word: יָמִים רַבִּים
  choice: చాలా రోజులు
  rationale: హీబ్రూ పదబంధంలోని ‘అనేక/చాలా రోజులు’ అనే రూపాన్ని నిలుపుతూ, నిర్దిష్ట కాలవ్యవధిని ఊహించకుండా సహజమైన ఆధునిక తెలుగులో ఇచ్చాం.
- source_word: שִׁמְעִי
  choice: షిమీ
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: בִּירוּשָׁלִַם
  choice: యెరూషలేములో
  rationale: స్థలపేరును ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, בְּ ఉపసర్గను ‘లో’గా కలిపాం.
