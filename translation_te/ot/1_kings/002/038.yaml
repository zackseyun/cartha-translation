translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజసభకు తగిన గౌరవభావాన్ని నిలుపుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘నా ప్రభువైన రాజు,’ ‘మీ సేవకుడు’ అనే రూపాలు వినయపూర్వక రాజసభ సంభాషణను అతిశయింపకుండా ప్రతిబింబిస్తాయి. ప్రధాన పాఠంలోని [a] సూచిక పాదసూచికతో సరిపోలుతుంది.
