source:
  edition: WLC
  text: וּ/מַדּ֕וּעַ לֹ֣א שָׁמַ֔רְתָּ אֵ֖ת שְׁבֻעַ֣ת יְהוָ֑ה וְ/אֶת הַ/מִּצְוָ֖ה אֲשֶׁר צִוִּ֥יתִי עָלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/043.yaml
  text: Why then have you not kept the oath of Yahweh and the command that I commanded you?[a][b]
translation:
  language: te
  text: అయితే యాహ్వే పేరున చేసిన ప్రమాణాన్ని, నేను నీకు విధించిన ఆజ్ఞను నీవెందుకు పాటించలేదు?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే యొక్క ప్రమాణాన్ని.” సందర్భంలో ఇది యాహ్వే పేరున లేదా ఆయన సాక్షిగా చేయించిన ప్రమాణాన్ని సూచిస్తుంది; “యాహ్వేకు చేసిన ప్రమాణం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఆజ్ఞను నేను నీ మీద ఆజ్ఞాపించిన.” అంటే, నేను నీకు విధించిన ఆజ్ఞను.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַדּוּעַ
  choice: అయితే ... ఎందుకు
  rationale: ప్రశ్నార్థకమైన ‘ఎందుకు’ను ముందున్న ఆరోపణతో అనుసంధానించే וּ ఉపసర్గను సహజమైన తెలుగులో ‘అయితే’గా వ్యక్తం చేసింది.
- source_word: לֹא שָׁמַרְתָּ
  choice: నీవెందుకు పాటించలేదు
  rationale: שׁמר ఇక్కడ ప్రమాణానికీ ఆజ్ఞకూ విధేయంగా ఉండడం అనే భావంలో ఉంది; ‘పాటించు’ రెండింటితోనూ సహజంగా సరిపోతుంది.
- source_word: שְׁבֻעַת יְהוָה
  choice: యాహ్వే పేరట చేసిన ప్రమాణం
  rationale: నిర్మాణం అక్షరార్థంగా ‘యాహ్వే యొక్క ప్రమాణం’ అయినప్పటికీ, సందర్భంలో యాహ్వే చేసిన ప్రమాణం కాక ఆయన పేరట లేదా ఆయన సాక్షిగా చేసిన ప్రమాణమని స్పష్టం చేయడానికి ఈ సహజ రూపాన్ని ఎంచుకున్నాం; అక్షరార్థ నిర్మాణాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: הַמִּצְוָה
  choice: ఆజ్ఞ
  rationale: מִצְוָה అంటే ఆదేశం లేదా విధించిన కర్తవ్యం; రాజు పలికే సందర్భంలో ‘ఆజ్ఞ’ సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: אֲשֶׁר צִוִּיתִי עָלֶיךָ
  choice: నేను నీకు విధించిన
  rationale: צוה అనే ఆజ్ఞాపించే క్రియను, עַל సూచించే బాధ్యతను కలిపి, పునరుక్తిని తగ్గిస్తూ ‘నీకు విధించిన’గా అనువదించాం; హీబ్రూ రూపానికి దగ్గరైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
theological_decisions:
- issue: שְׁבֻעַת יְהוָה లో ప్రమాణానికి యాహ్వేతో ఉన్న సంబంధం
  choice: యాహ్వే పేరట చేసిన ప్రమాణం
  alternative: యాహ్వే యొక్క ప్రమాణం / యాహ్వేకు చేసిన ప్రమాణం
  rationale: సందర్భంలో ఇది యాహ్వే స్వయంగా చేసిన ప్రమాణం కాదు; ఆయన పేరట లేదా ఆయన సాక్షిగా షిమీ చేసిన ప్రమాణం. అయితే హీబ్రూ నిర్మాణం సంబంధాన్ని సంక్షిప్తంగానే ఉంచుతుంది కాబట్టి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో సంరక్షించాం.
- issue: יְהוָה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది; దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన రాజసభా ప్రశ్నశైలిని ఉపయోగించాం. ‘పాటించు’ అనే క్రియ ప్రమాణం, ఆజ్ఞ రెండింటినీ సమానంగా పరిపాలిస్తుంది. దైవనామాన్ని ‘యాహ్వే’గా నిలిపాం; మూలంలోని సంబంధార్థక సందిగ్ధతను పాదటిప్పణిలో చూపించాం.
