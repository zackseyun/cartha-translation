  yaml_path: translation/ot/1_kings/002/021.yaml
  text: And she said, “Let Abishag the Shunammite be given to Adonijah your brother as a wife.”
translation:
  language: te
  text: అప్పుడు ఆమె, “షూనేమీయురాలైన అబీషగును నీ సోదరుడైన అదోనీయాకు భార్యగా ఇవ్వండి” అంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అప్పుడు ఆమె ... అంది
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ సహజమైన కథన అనుసంధానాన్ని ఇస్తుంది.
- source_word: יֻתַּן
  choice: ఇవ్వనివ్వు
  rationale: నిఫ్అల్ జస్సివ్ అభ్యర్థన లేదా ప్రతిపాదన భావాన్ని వ్యక్తం చేస్తుంది; ‘ఇవ్వనివ్వు’ ఆ అనుమతి కోరే భావాన్ని నిలుపుతుంది.
- source_word: אֲבִישַׁג הַשֻּׁנַמִּית
  choice: షూనేమీయురాలైన అబీషగు
  rationale: స్త్రీని ఆమె వచ్చిన షూనేము ప్రాంతంతో గుర్తించే హెబ్రీ జాతివాచకాన్ని సహజమైన తెలుగులో విశేషణ రూపంగా అందిస్తుంది.
- source_word: לַאֲדֹנִיָּהוּ
  choice: అదోనీయాకు
  rationale: לְ ఉపసర్గ వివాహార్థంగా ఇవ్వబడే వ్యక్తిని, అంటే పరోక్ష కర్మను, సూచిస్తుంది.
- source_word: אָחִיךָ
  choice: నీ సహోదరుడైన
  rationale: రెండవ పురుష ఏకవచన ప్రత్యయం సొలొమోనును నేరుగా సంబోధిస్తుంది; ‘సహోదరుడు’ గౌరవప్రదమైన ఆధునిక ప్రమాణ తెలుగు.
- source_word: לְאִשָּׁה
  choice: భార్యగా
  rationale: ఈ వివాహ సందర్భంలో ‘భార్యగా ఇవ్వడం’ అనే అధికారిక వైవాహిక భావాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హెబ్రీ వాక్యంలోని అభ్యర్థనాత్మక జస్సివ్ భావాన్ని నిలుపుతూ, వ్యక్తి పేర్లు మరియు ప్రాంతీయ గుర్తింపును తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
