  text: וַ/יֻּגַּ֞ד לַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה כִּ֣י נָ֤ס יוֹאָב֙ אֶל אֹ֣הֶל יְהוָ֔ה וְ/הִנֵּ֖ה אֵ֣צֶל הַ/מִּזְבֵּ֑חַ וַ/יִּשְׁלַ֨ח שְׁלֹמֹ֜ה אֶת בְּנָיָ֧הוּ בֶן יְהוֹיָדָ֛ע לֵ/אמֹ֖ר לֵ֥ךְ פְּגַע בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/029.yaml
  text: And it was reported to King Solomon that Joab had fled to the tent of Yahweh[a], and behold, he was beside the altar. So Solomon sent Benaiah son of Jehoiada, saying, “Go[b], strike him down.”
translation:
  language: te
  text: యోవాబు యాహ్వే గుడారానికి[a] పారిపోయాడనీ, ఇదిగో అతడు బలిపీఠం పక్కన ఉన్నాడనీ సొలొమోను రాజుకు తెలియజేయబడింది. అప్పుడు సొలొమోను యెహోయాదా కుమారుడైన బెనాయాను పంపి, “వెళ్లి అతనిపై దాడిచేయి[b]” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యాహ్వే నివాసగుడారానికి.” హీబ్రూలో అక్షరార్థంగా “యాహ్వే గుడారం” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “అతణ్ణి కొట్టు” లేదా “అతనిపై పడు.” హీబ్రూ క్రియ కొట్టడం, దాడిచేయడం, లేదా ఒకరిపై పడడం అనే భావాలను సూచించవచ్చు; ఈ సందర్భంలో అది ప్రాణాంతక దాడిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: తెలియజేయబడింది
  rationale: נגד హోఫల్ రూపంలోని కర్మణి భావాన్ని నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా సమాచార నివేదికను వ్యక్తపరుస్తుంది.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: సొలొమోను రాజుకు
  rationale: బిరుదు-పేరు సంబంధాన్ని తెలుగులో సహజమైన పదక్రమంతో తెలియజేస్తుంది.
- source_word: נָס
  choice: పారిపోయాడు
  rationale: నివేదికకు ముందే జరిగిన యోవాబు పారిపోవడాన్ని సందర్భం స్పష్టం చేస్తుంది; తెలుగులో ప్రత్యేక భూతపూర్వ కాలరూపం అవసరం లేకుండానే సహజంగా ఉంటుంది.
- source_word: אֶל אֹהֶל יְהוָה
  choice: యెహోవా గుడారానికి
  rationale: אֹהֶל యొక్క ప్రాథమిక అర్థమైన ‘గుడారం’ను నిలుపుతుంది; יְהוָהను వ్యక్తిగత దైవనామంగా ‘యెహోవా’ అని లిప్యంతరీకరిస్తుంది.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హిన్నే కలిగించే దృష్టి ఆకర్షణ, కథన సజీవతను నేరుగా నిలుపుతుంది.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: బలిపీఠం పక్కన
  rationale: אֵצֶל సూచించే సమీప స్థానాన్ని స్పష్టంగా, సహజంగా తెలుపుతుంది.
- source_word: וַיִּשְׁלַח
  choice: అప్పుడు ... పంపి
  rationale: వావ్ కథన క్రమాన్ని ముందుకు నడిపే భావాన్ని తెలుగు కథనశైలిలో సహజంగా ప్రతిబింబిస్తుంది.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: యెహోయాదా కుమారుడు బెనాయాను
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని తెలుగులో సాధారణమైన విధంగా వ్యక్తపరుస్తుంది; కర్మ విభక్తి పంపబడిన వ్యక్తిని స్పష్టం చేస్తుంది.
- source_word: לֵאמֹר
  choice: అని చెప్పాడు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ నిర్మాణాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: לֵךְ
  choice: వెళ్లి
  rationale: ఆజ్ఞార్థక భావాన్ని తరువాతి ఆజ్ఞతో సహజంగా అనుసంధానిస్తుంది.
- source_word: פְּגַע בּוֹ
  choice: అతణ్ణి హతమార్చు
  rationale: פגע ב యొక్క ‘దాడిచేయు/కొట్టు’ పరిధిని, ఈ ఉరిశిక్ష సందర్భంలోని ప్రాణాంతక ఉద్దేశంతో సహజంగా వ్యక్తపరుస్తుంది; పాదసూచిక మూలపద విస్తృతిని నమోదు చేస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: హీబ్రూ పాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో ఉంచుతుంది. ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం; ‘ప్రభువు’ సంప్రదాయ ప్రత్యామ్నాయం.
- issue: పీఠం వద్ద ఆశ్రయం మరియు రాజాజ్ఞ మధ్య ఉద్రిక్తత
  choice: మూల కథనం చెప్పిన స్థానాన్ని, హతమార్చమనే ఆజ్ఞను వివరణాత్మక సమన్వయం లేకుండా యథాతథంగా ఉంచడం
  alternative: పీఠపు కొమ్ములను పట్టుకున్నాడని చేర్చడం లేదా ఆజ్ఞను న్యాయపరచే వివరణ జోడించడం
  rationale: ఈ వచనం అతడు పీఠం పక్కన ఉన్నాడని మాత్రమే చెబుతుంది. సమీప సందర్భంలోని వివరాలను ఇక్కడికి దిగుమతి చేయకుండా కథనంలోని నైతిక-ధార్మిక ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే రాజకథనానికి తగిన గౌరవప్రదమైన శైలిలో ఉంది. ‘ఇదిగో’ ద్వారా హీబ్రూ కథన సజీవతను నిలిపి, ‘తెలియజేయబడింది’ ద్వారా కర్మణి నిర్మాణాన్ని కాపాడింది.
