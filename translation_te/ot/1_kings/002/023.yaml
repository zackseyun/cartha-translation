revisions:
- from: అప్పుడు సొలొమోను రాజు యెహోవా[a] తోడు అని ప్రమాణం చేస్తూ, “దేవుడు నాకు అలాగే చేసి, అంతకంటే ఎక్కువగా చేయుగాక! అదోనీయా ఈ మాట చెప్పి తన ప్రాణానికే ముప్పు తెచ్చుకున్నాడు[b]” అన్నాడు.
  to: అప్పుడు సొలొమోను రాజు యహ్వే[a] పేరిట ప్రమాణం చేసి ఇలా అన్నాడు, “దేవుడు నాకు అలాగే చేయుగాక, అంతకంటే ఎక్కువగా చేయుగాక; ఎందుకంటే అదోనీయా ఈ మాటను తన ప్రాణానికే వ్యతిరేకంగా పలికాడు[b].”
  rationale: ప్రమాణానికి సంబంధించిన బַּיהוָהను “యహ్వే పేరిట”గా సరిచేసి, దైవనామాన్ని అందించిన POB నిర్ణయానికి అనుగుణంగా ఏకరీతిగా మార్చాం. స్వీయశాప సూత్రంలోని పేర్కొనని శిక్షను పేర్కొనకుండా ఉంచాం. అదోనీయా మాటకు సంబంధించిన ప్రాణ-జాతీయ ప్రయోగాన్ని ప్రధాన పాఠంలో మూలానికి దగ్గరగా ఉంచి, దాని అర్థాన్ని గమనికలో వివరించాం.
