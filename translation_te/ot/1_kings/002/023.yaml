source:
  edition: WLC
  text: וַ/יִּשָּׁבַע֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה בַּֽ/יהוָ֖ה לֵ/אמֹ֑ר כֹּ֣ה יַֽעֲשֶׂה לִּ֤/י אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִ֔יף כִּ֣י בְ/נַפְשׁ֔/וֹ דִּבֶּר֙ אֲדֹ֣נִיָּ֔הוּ אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/023.yaml
  text: Then King Solomon swore by Yahweh[a], saying, “May God do so to me, and more also[b], for Adonijah has spoken this word against his own life.”
translation:
  language: te
  text: అప్పుడు సొలొమోను రాజు యహ్వే[a] పేరిట ప్రమాణం చేసి ఇలా అన్నాడు, “దేవుడు నాకు అలాగే చేయుగాక, అంతకంటే ఎక్కువగా చేయుగాక; ఎందుకంటే అదోనీయా ఈ మాటను తన ప్రాణానికే వ్యతిరేకంగా పలికాడు[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో దేవుని ప్రత్యేక నామం יהוה ఉంది; దీనిని ‘యహ్వే’ అని పలుకుతారు. ‘యెహోవా’ అనేది మరో సాంప్రదాయ ఉచ్చారణ రూపం.
    reason: దైవనామం యొక్క మూలరూపాన్ని, ప్రత్యామ్నాయ సాంప్రదాయ ఉచ్చారణను తెలియజేయడం.
  - marker: b
    text: అక్షరార్థంగా, “తన ప్రాణంతో/తన ప్రాణానికి ఈ మాట పలికాడు.” ఇది అతడు చెప్పిన మాట తన ప్రాణాన్ని పణంగా పెట్టిందని లేదా ప్రమాదంలో పెట్టిందని సూచించే హీబ్రూ జాతీయ ప్రయోగం.
    reason: హీబ్రూ జాతీయ ప్రయోగంలోని అక్షరార్థాన్ని, సందర్భార్థాన్ని రెండింటినీ నిలుపడం.
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: ప్రమాణం చేస్తూ
  rationale: కథన సందర్భంలో ప్రమాణం చేయడం అనే అర్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בַּיהוָה
  choice: యెహోవా తోడు అని
  rationale: ప్రమాణానికి సాక్షిగా యెహోవా నామాన్ని ఉచ్చరించిన భావాన్ని సహజ తెలుగు ప్రమాణ ప్రయోగంతో వ్యక్తం చేస్తుంది.
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִיף
  choice: దేవుడు నాకు అలాగే చేసి, అంతకంటే ఎక్కువగా చేయుగాక
  rationale: ఏ శిక్ష అనేది పేర్కొనకుండా తనమీదికి శాపాన్ని ఆహ్వానించే హీబ్రూ ప్రమాణ సూత్రంలోని బలాన్ని, పునరుక్తిని నిలుపుతుంది.
- source_word: אֱלֹהִים
  choice: దేవుడు
  rationale: రూపం బహువచనమైనా ఈ ప్రమాణ సూత్రంలో ఏకవచన దైవ సూచనగా వాడబడింది.
- source_word: כִּי
  choice: (కారణార్థకంగా)
  rationale: ఇక్కడ ప్రమాణంలోని నిర్ణయానికి కారణాన్ని పరిచయం చేస్తుంది; అందువల్ల తెలుగు వాక్య నిర్మాణంలో ప్రత్యేక సంధిపదం లేకుండానే కారణ సంబంధం స్పష్టంగా ఉంది.
- source_word: בְנַפְשׁוֹ
  choice: తన ప్రాణానికే ముప్పు తెచ్చుకున్నాడు
  rationale: అక్షరార్థమైన ‘తన ప్రాణంతో/తన ప్రాణానికి’ అనే ప్రయోగం ఇక్కడ అతని మాట అతని ప్రాణాన్ని ప్రమాదంలో పెట్టిందనే హీబ్రూ జాతీయ భావాన్ని సూచిస్తుంది.
- source_word: דִּבֶּר ... אֶת־הַדָּבָר הַזֶּה
  choice: ఈ మాట చెప్పి
  rationale: హీబ్రూ పదబంధంలోని ‘ఈ మాట పలికాడు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా ఇస్తుంది.
- source_word: אֲדֹנִיָּהוּ
  choice: అదోనీయా
  rationale: హీబ్రూ వ్యక్తినామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యహ్వే
  rationale: మూలంలో ఉన్న ప్రత్యేక దైవనామాన్ని బిరుదుగా మార్చకుండా పేరుగానే ఉంచుతూ, తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన రూపాన్ని ఎంచుకున్నాం.
- issue: כִּי యొక్క ప్రమాణ సందర్భార్థం
  choice: కారణార్థకం—అదోనీయా మాట అతని ప్రాణాన్ని ప్రమాదంలో పెట్టిందని దృఢంగా ప్రకటించడం
  alternative: షరతార్థకం—‘అయితే/ఒకవేళ’
  rationale: సందర్భంలో సొలొమోను అదోనీయా చర్యపై తీర్పు ప్రకటిస్తున్నాడు; ఇక్కడ అసంపూర్ణమైన షరతు కంటే కారణార్థక లేదా దృఢ ప్రకటన పఠనం కథన ప్రవాహానికి సరిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజకథనానికి తగిన గంభీరతతో, సాధారణ పాఠకుడికి అర్థమయ్యే సహజ వాక్య నిర్మాణం. ప్రమాణ సూత్రపు ఆచారబద్ధమైన స్వరాన్ని ఉద్దేశపూర్వకంగా నిలిపాం.
