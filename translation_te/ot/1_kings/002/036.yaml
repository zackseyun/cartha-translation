- from: 'అప్పుడు రాజు షిమీని పిలిపించి అతనితో ఇలా అన్నాడు: “నీవు యెరూషలేములో నీకోసం ఒక ఇల్లు కట్టుకొని అక్కడే నివసించు. అక్కడి నుంచి ఎక్కడికీ[a] వెళ్లవద్దు.”'
  to: 'అప్పుడు రాజు షిమీని పిలిపించడానికి కబురు పంపి, అతనితో ఇలా అన్నాడు: “నీవు యెరూషలేములో నీకోసం ఒక ఇల్లు కట్టుకొని అక్కడే నివసించు. అక్కడి నుంచి ఎక్కడికీ[a] వెళ్లవద్దు.”'
  rationale: ప్రారంభంలోని ‘కబురు పంపి’ హీబ్రూ వాక్యంలోని ‘పంపి’ మరియు ‘పిలిచాడు/పిలిపించాడు’ అనే రెండు చర్యలను సహజంగా ప్రతిబింబిస్తుంది. మిగిలిన పాఠం మూలార్థాన్ని, ఆధునిక తెలుగు సహజత్వాన్ని, మరియు పాదసూచికలోని నుడికార వివరణను ఇప్పటికే సరిగ్గా కాపాడుతుంది.
