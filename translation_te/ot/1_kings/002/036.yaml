  text: וַ/יִּשְׁלַ֤ח הַ/מֶּ֨לֶךְ֙ וַ/יִּקְרָ֣א לְ/שִׁמְעִ֔י וַ/יֹּ֣אמֶר ל֗/וֹ בְּֽנֵה לְ/ךָ֥ בַ֨יִת֙ בִּ/יר֣וּשָׁלִַ֔ם וְ/יָשַׁבְתָּ֖ שָׁ֑ם וְ/לֹֽא תֵצֵ֥א מִ/שָּׁ֖ם אָ֥נֶה וָ/אָֽנָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/036.yaml
  text: Then the king sent and called for Shimei and said to him[a], “Build yourself a house in Jerusalem and live there, and do not go out from there anywhere.”
translation:
  language: te
  text: 'అప్పుడు రాజు షిమీని పిలిపించడానికి కబురు పంపి, అతనితో ఇలా అన్నాడు: “నీవు యెరూషలేములో నీకోసం ఒక ఇల్లు కట్టుకొని అక్కడే నివసించు. అక్కడి నుంచి ఎక్కడికీ[a] వెళ్లవద్దు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ నుడికారం అక్షరార్థంగా “ఇటూ అటూ”; అంటే “ఎక్కడికీ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח הַמֶּלֶךְ וַיִּקְרָא לְשִׁמְעִי
  choice: రాజు షిమీని పిలిపించి
  rationale: రాజు ఒకరిని పంపి షిమీని పిలిచాడనే రెండు హీబ్రూ క్రియల భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘పిలిపించి’ సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנֵה לְךָ בַיִת
  choice: నీకోసం ఒక ఇల్లు కట్టుకొని
  rationale: ఆజ్ఞార్థకమైన ‘కట్టు’ భావాన్నీ, לְךָ సూచించే వ్యక్తిగత ప్రయోజనాన్నీ నిలుపుతుంది; తరువాతి నివాస ఆజ్ఞతో సహజంగా అనుసంధానించేందుకు ‘కట్టుకొని’ వాడబడింది.
- source_word: בִּירוּשָׁלִַם
  choice: యెరూషలేములో
  rationale: స్థలార్థక ఉపసర్గకు సహజమైన తెలుగు రూపం.
- source_word: וְיָשַׁבְתָּ שָׁם
  choice: అక్కడే నివసించు
  rationale: ישׁב ఇక్కడ నిరంతర నివాసాన్ని సూచిస్తుంది; ‘అక్కడే’ నివాస పరిమితిని స్పష్టం చేస్తుంది.
- source_word: וְלֹא תֵצֵא מִשָּׁם
  choice: అక్కడి నుంచి ... వెళ్లవద్దు
  rationale: יצא యొక్క బయటకు పోవడం/విడిచి వెళ్లడం అనే భావాన్ని ఈ సందర్భంలో సహజమైన తెలుగులో అందిస్తుంది.
- source_word: אָנֶה וָאָנָה
  choice: ఎక్కడికీ
  rationale: ‘ఇటూ అటూ’ అనే హీబ్రూ విభక్త idiom నిషేధ వాక్యంలో ‘ఎక్కడికీ’ అని సహజంగా అర్థమవుతుంది; మూల రూపం పాదసూచికలో ఇవ్వబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజాజ్ఞకు తగిన గంభీరతను ఉంచుతూ సామాన్య పాఠకులకు సహజంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది.
