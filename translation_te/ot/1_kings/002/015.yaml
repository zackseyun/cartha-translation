- from: 'అతడు ఇలా అన్నాడు: “రాజ్యం నాదై ఉండిందనీ, నేనే రాజుగా పరిపాలించాలని ఇశ్రాయేలు అంతా నా వైపు చూసిందనీ[a] నీకు తెలుసు. అయితే రాజ్యం మళ్లి నా సోదరునిదైంది; ఎందుకంటే అది యాహ్వే నుండి అతనికి వచ్చింది[b].”'
  to: 'అతడు ఇలా అన్నాడు: “రాజ్యం నాదేనని, నేనే రాజుగా పరిపాలించాలని ఇశ్రాయేలు అంతా నా వైపు దృష్టి పెట్టిందని[a] నీకు తెలుసు. అయితే రాజ్యం మారి నా సోదరునిదైంది; ఎందుకంటే అది యాహ్వే నుండి అతనికి వచ్చింది[b].”'
  rationale: 'సవరణలు అర్థాన్ని మార్చకుండా రెండు అంశాలను మెరుగుపరుస్తాయి: రాజ్యం ‘తిరిగిన’ లేదా బదిలీ అయిన భావాన్ని “మారి” ద్వారా వ్యక్తం చేశాం; మొదటి వాక్యంలోని అసహజమైన “నాదై ఉండింది”ని సహజమైన “నాదేనని”గా మార్చాం. చివరి ఉపవాక్యంలో మూలంలోని దైవిక మూలం మరియు సోదరునికి రాజ్యం చెందడం/వచ్చడం అనే భావాన్ని యథాతథంగా కాపాడాం.'
