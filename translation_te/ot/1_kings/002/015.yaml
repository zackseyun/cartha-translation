id: 1KI.2.15
reference: 1 Kings 2:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אַ֤תְּ יָדַ֨עַתְּ֙ כִּי לִ/י֙ הָיְתָ֣ה הַ/מְּלוּכָ֔ה וְ/עָלַ֞/י שָׂ֧מוּ כָֽל יִשְׂרָאֵ֛ל פְּנֵי/הֶ֖ם לִ/מְלֹ֑ךְ וַ/תִּסֹּ֤ב הַ/מְּלוּכָה֙ וַ/תְּהִ֣י לְ/אָחִ֔/י כִּ֥י מֵ/יְהוָ֖ה הָ֥יְתָה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/015.yaml
  text: And he said[a], “You know that the kingdom was mine, and that all Israel had set their faces on me to reign; but the kingdom turned and became my brother’s[b], for it was his from Yahweh.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “రాజ్యం నాదేనని, నేనే రాజుగా పరిపాలించాలని ఇశ్రాయేలు అంతా నా వైపు దృష్టి పెట్టిందని[a] నీకు తెలుసు. అయితే రాజ్యం మారి నా సోదరునిదైంది; ఎందుకంటే అది యాహ్వే నుండి అతనికి వచ్చింది[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఇశ్రాయేలు అంతా తమ ముఖాలను నా మీద ఉంచింది.” అంటే, నేను రాజుగా పరిపాలించాలని నిరీక్షిస్తూ నా వైపు దృష్టి పెట్టింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఎందుకంటే అది యాహ్వే నుండి అతనిదైంది.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְּלוּכָה
  choice: రాజ్యం
  rationale: ఇక్కడ రాజ్యాధికారాన్ని, రాజుగా పరిపాలించే హక్కును సూచిస్తుంది. ఆధునిక తెలుగులో ‘రాజ్యం’ సహజంగా ఉండి, సందర్భంలో అధికార భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְעָלַי שָׂמוּ כָל־יִשְׂרָאֵל פְּנֵיהֶם
  choice: ఇశ్రాయేలు అంతా నా వైపు చూసింది
  rationale: ఎవరినైనా ఉద్దేశించి నిరీక్షణతో దృష్టి నిలపడం అనే హీబ్రూ నుడికార భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; మూలంలోని ముఖాల రూపకాన్ని పాదసూచికలో ఉంచాం.
- source_word: לִמְלֹךְ
  choice: నేనే రాజుగా పరిపాలించాలని
  rationale: మూలంలోని ‘రాజుగా ఏలడం’ అనే భావాన్ని, ఇశ్రాయేలు ప్రజల నిరీక్షణకు అనుసంధానిస్తూ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַתִּסֹּב
  choice: మళ్లి
  rationale: సంఘటనల దిశ తిరిగి రాజ్యాధికారం మరొకరికి వెళ్లిందనే రూపకాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וַתְּהִי לְאָחִי
  choice: నా సోదరునిదైంది
  rationale: రాజ్యం సోదరునికి చెందిందనే לְ యొక్క స్వామ్య/బదిలీ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כִּי מֵיְהוָה הָיְתָה לּוֹ
  choice: ఎందుకంటే అది యాహ్వే నుండి అతనికి వచ్చింది
  rationale: రాజ్యం యాహ్వే నుండి అతనికి కలిగిందనే దైవిక మూలాన్ని తెలియజేస్తూ, మూలంలో లేని ‘ఇచ్చాడు’ వంటి స్పష్టీకరణను చేర్చదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אָחִי
  choice: నా సోదరుడు
  rationale: అదోనీయా దృష్టిలో సొలొమోనుతో ఉన్న కుటుంబ సంబంధాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉన్నందున దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
- issue: చివరి వాక్యంలో దైవిక నియామకాన్ని ఎంత స్పష్టంగా చెప్పాలి
  choice: అది యాహ్వే నుండి అతనికి వచ్చింది
  alternative: యాహ్వే దానిని అతనికి ఇచ్చాడు
  rationale: హీబ్రూ పాఠం ‘ఇచ్చాడు’ అనే క్రియను ఉపయోగించదు. కాబట్టి రాజ్యానికి దైవిక మూలం ఉందనే వాదనను నిలుపుతూ, ఇవ్వడం అనే మరింత నిర్దిష్టమైన భావాన్ని చేర్చలేదు.
- issue: מֵיְהוָה הָיְתָה לּוֹ లోని సంబంధ భావం
  choice: యాహ్వే నుండి అతనికి వచ్చింది
  alternative: యాహ్వే నుండి అది అతనిదైంది
  rationale: ఈ నిర్మాణం మూలం/ప్రాప్తి భావాన్నీ, అతనికి చెందడం అనే భావాన్నీ అనుమతిస్తుంది. ప్రధాన పాఠంలో సహజమైన ప్రాప్తి భావాన్ని ఎంచుకుని, స్వామ్య భావాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘ఇశ్రాయేలు అంతా’ అనే సమూహవాచక ప్రయోగానికి ఏకవచన క్రియను జతచేశాం. హీబ్రూ నుడికారాన్ని ప్రధాన పాఠంలో సహజీకరించి, దాని రూపకాన్ని పాదసూచికలో భద్రపరిచాం.
