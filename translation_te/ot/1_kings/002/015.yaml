  revised_text: 'అతడు ఇలా అన్నాడు: “రాజ్యం నాదేనని, నేనే రాజుగా పరిపాలించాలని ఇశ్రాయేలు అంతా నా వైపు దృష్టి పెట్టిందని[a] నీకు తెలుసు. అయితే రాజ్యం మారి నా సోదరునిదైంది; ఎందుకంటే అది యాహ్వే నుండి అతనికి వచ్చింది[b].”'
