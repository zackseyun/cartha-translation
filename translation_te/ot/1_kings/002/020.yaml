base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/020.yaml
  text: She said, “I am asking one small request of you; do not turn away my face.” And the king said to her, “Ask, my mother, for I will not turn away your face.”
translation:
  language: te
  text: ఆమె, “నేను మీ దగ్గర ఒక చిన్న మనవి కోరుతున్నాను; నా మనవిని తిరస్కరించవద్దు” అంది. అప్పుడు రాజు ఆమెతో, “అడుగు, అమ్మా; నీ మనవిని నేను తిరస్కరించను” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁאֵלָה אַחַת קְטַנָּה
  choice: ఒక చిన్న మనవి
  rationale: ‘ఒక చిన్న అభ్యర్థన’ అనే భావాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אַל תָּשֶׁב אֶת פָּנָי / לֹא אָשִׁיב אֶת פָּנָיִךְ
  choice: నా ముఖాన్ని తిప్పివేయకండి / నీ ముఖాన్ని నేను తిప్పివేయను
  rationale: ముఖాన్ని వెనక్కి తిప్పడం అనే హీబ్రూ రూపకాన్ని రెండుచోట్లా సమాంతరంగా నిలుపుతుంది; కేవలం ‘నిరాకరించవద్దు’ అని అర్థాన్ని మాత్రమే చెప్పకుండా మూలభాష చిత్రణను సంరక్షిస్తుంది.
- source_word: אִמִּי
  choice: అమ్మా
  rationale: రాజు తన తల్లిని నేరుగా సంబోధించే సన్నిహితమైనప్పటికీ గౌరవపూర్వకమైన సహజ తెలుగు రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజమాత రాజుతో గౌరవంగా మాట్లాడేందుకు ‘మీతో/తిప్పివేయకండి’ వాడగా, కుమారుడు తల్లిని ‘అమ్మా’ అని సహజంగా సంబోధించాడు. మూలంలోని ‘ముఖాన్ని తిప్పివేయడం’ అనే పునరుక్త రూపకం ఉద్దేశపూర్వకంగా నిలుపబడింది.
