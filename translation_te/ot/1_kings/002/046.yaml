source:
  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֗לֶךְ אֶת בְּנָיָ֨הוּ֙ בֶּן יְה֣וֹיָדָ֔ע וַ/יֵּצֵ֕א וַ/יִּפְגַּע בּ֖/וֹ וַ/יָּמֹ֑ת וְ/הַ/מַּמְלָכָ֥ה נָכ֖וֹנָה בְּ/יַד שְׁלֹמֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/046.yaml
  text: Then the king commanded Benaiah son of Jehoiada[a], and he went out and struck him down, and he died. So the kingdom was established in the hand of Solomon.
translation:
  language: te
  text: అప్పుడు రాజు యెహోయాదా కుమారుడైన బెనాయాకు ఆజ్ఞాపించాడు. బెనాయా బయలుదేరి వెళ్లి అతనిని కొట్టాడు; అతడు చనిపోయాడు. దాంతో రాజ్యం సొలొమోను చేతిలో స్థిరపడింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజ్యం సొలొమోను పాలనలో దృఢంగా స్థాపించబడింది.” “సొలొమోను చేతిలో” అనే హీబ్రూ నుడికారం ఆయన నియంత్రణ లేదా అధీనాన్ని సూచిస్తుంది.
    reason: హీబ్రూ నుడికారంలోని రూపకాన్ని ప్రధాన పాఠంలో నిలిపి, దాని భావార్థాన్ని మరియు ‘స్థిరపడింది’లోని దృఢత్వ భావాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: అప్పుడు రాజు ... ఆజ్ఞాపించాడు
  rationale: צוה అనే క్రియ రాజాధికారంతో ఆజ్ఞ ఇవ్వడాన్ని సూచిస్తుంది. కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో చూపడానికి וַ־ను ‘అప్పుడు’గా వ్యక్తం చేశాం.
- source_word: בְּנָיָהוּ בֶן־יְהוֹיָדָע
  choice: యెహోయాదా కుమారుడైన బెనాయా
  rationale: హీబ్రూ పేర్లను తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో ఇచ్చి, construct సంబంధాన్ని సహజంగా ‘కుమారుడైన’ అని అనువదించాం.
- source_word: וַיֵּצֵא
  choice: బయలుదేరి వెళ్లి
  rationale: יצא యొక్క ‘బయటికి వెళ్లడం/బయలుదేరడం’ అనే భావాన్ని కథన సందర్భంలో సహజంగా నిలుపుతుంది.
- source_word: וַיִּפְגַּע־בּוֹ
  choice: అతనిని కొట్టాడు
  rationale: פגע ב־ ఇక్కడ దాడిచేసి ప్రాణాంతకంగా కొట్టడాన్ని సూచిస్తుంది. తరువాతి ‘అతడు చనిపోయాడు’ అనే స్వతంత్ర ఫలిత వాక్యాన్ని నిలుపుకోవడానికి ‘చంపాడు’ అని ముందుగానే స్పష్టీకరించలేదు.
- source_word: וַיָּמֹת
  choice: అతడు చనిపోయాడు
  rationale: మరణాన్ని తెలిపే హీబ్రూ క్రియను నేరుగా అనువదించి, దెబ్బ మరియు దాని ఫలితం అనే కథన క్రమాన్ని కాపాడాం.
- source_word: וְהַמַּמְלָכָה נָכוֹנָה
  choice: దాంతో రాజ్యం ... స్థిరపడింది
  rationale: נכון (Niphal) స్థిరపరచబడటం లేదా దృఢంగా నెలకొనడాన్ని సూచిస్తుంది. ముందటి సంఘటనకు ఫలితంగా ఈ ముగింపు వాక్యం రావడాన్ని ‘దాంతో’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּיַד שְׁלֹמֹה
  choice: సొలొమోను చేతిలో
  rationale: ‘చేతిలో’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ, రాజ్యంపై సొలొమోనుకు ఏర్పడిన నియంత్రణను తెలుగులో అర్థమయ్యేలా వ్యక్తం చేస్తుంది.
