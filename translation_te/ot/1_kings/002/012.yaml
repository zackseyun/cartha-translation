  text: וּ/שְׁלֹמֹ֕ה יָשַׁ֕ב עַל כִּסֵּ֖א דָּוִ֣ד אָבִ֑י/ו וַ/תִּכֹּ֥ן מַלְכֻת֖/וֹ מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/012.yaml
  text: And Solomon sat on the throne of David his father[a], and his kingdom was firmly established.
translation:
  language: te
  text: సొలొమోను తన తండ్రియైన దావీదు సింహాసనం మీద కూర్చున్నాడు. అతని రాజ్యం ఎంతో స్థిరపడింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని పరిపాలన ఎంతో సురక్షితమైంది’; లేదా ‘అతని రాజ్యాధికారం ఎంతో స్థిరపడింది.’
    reason: מַלְכוּת మరియు וַתִּכֹּן מְאֹד పదబంధాలు రాజ్యం, పరిపాలన, లేదా రాజ్యాధికారం స్థిరపడటం లేదా సురక్షితం కావడం అనే సమీపార్థాలను అనుమతిస్తాయి.
lexical_decisions:
- source_word: יָשַׁב
  choice: కూర్చున్నాడు
  rationale: עַל כִּסֵּא అనే రాజసింహాసన సందర్భంలో ఇది సింహాసనాన్ని అధిష్ఠించి రాజుగా పాలించడం ప్రారంభించాడనే భావాన్ని కలిగిస్తుంది; మూలంలోని దృశ్యరూపాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כִּסֵּא
  choice: సింహాసనం
  rationale: దావీదు రాజవంశ వారసత్వ సందర్భంలో సాధారణ ‘ఆసనం’ కంటే రాజాధికారాన్ని సూచించే ‘సింహాసనం’ సరైన అర్థం.
- source_word: אָבִיו
  choice: తన తండ్రి
  rationale: దావీదు సొలొమోనుకు నిజమైన తండ్రి; ‘తన’ వాడటం తెలుగులో కర్తతో సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַתִּכֹּן
  choice: స్థిరపడింది
  rationale: నిఫ్అల్ రూపం స్థాపించబడటం, స్థిరత్వం పొందటం అనే ఫలితార్థాన్ని ఇస్తుంది. ‘స్థిరపడింది’ ఆ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מַלְכֻתוֹ
  choice: అతని రాజ్యం
  rationale: మַלְכוּת అనే పదానికి రాజ్యం, రాజ్యాధికారం, పరిపాలన అనే అర్థాలు ఉండవచ్చు. ప్రధాన పాఠంలో ‘రాజ్యం’ విస్తృతమైన భావాన్ని నిలుపుతుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: מְאֹד
  choice: బాగా
  rationale: ఈ క్రియావిశేషణం స్థిరపడటంలోని అధిక తీవ్రతను సూచిస్తుంది. ‘బాగా స్థిరపడింది’ ఆధునిక తెలుగులో సహజంగా ఆ బలాన్ని అందిస్తుంది.
theological_decisions:
- issue: దావీదు సింహాసనానికి సంబంధించిన రాజవంశ వారసత్వ భాష
  choice: సొలొమోను దావీదు సింహాసనాన్ని అధిష్ఠించి, అతని రాజ్యం స్థిరపడిందనే చారిత్రక ప్రకటనగా అనువదించాం.
  alternative: దావీదు వంశపు చట్టబద్ధతను లేదా తరువాతి మెస్సీయ సంబంధిత భావాలను స్పష్టంగా చేర్చే అనువాదం.
  rationale: ఈ వచనం నేరుగా సొలొమోను సింహాసనారోహణం, అతని పాలన స్థిరపడటం గురించి చెబుతుంది. విస్తృత గ్రంథసందర్భంలో దావీదు సింహాసనానికి మరిన్ని ధార్మిక ప్రాధాన్యాలు ఉన్నప్పటికీ, అవి ఇక్కడ స్పష్టంగా చెప్పబడలేదు; అందువల్ల వాటిని ప్రధాన పాఠంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని సింహాసన దృశ్యాన్ని నిలిపి, రాజ్యం/పరిపాలన/రాజ్యాధికారం మధ్య ఉన్న నిజమైన పదార్థ వైవిధ్యాన్ని పాదసూచికలో సంరక్షించాం.
