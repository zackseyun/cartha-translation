revisions:
- from: 'యెహోవా నా గురించి పలికిన తన మాటను నిలబెట్టడానికి ఇలా అన్నాడు: “నీ కుమారులు తమ ప్రవర్తన విషయంలో జాగ్రత్తగా ఉండి, తమ పూర్ణహృదయంతో, పూర్ణప్రాణంతో నా సన్నిధిలో సత్యంగా నడుచుకుంటే[a], ‘ఇశ్రాయేలు సింహాసనం మీద కూర్చునే పురుషుడు నీ వంశంలో లేకుండా పోడు’[b].”'
  to: 'యెహోవా నా గురించి పలికిన తన మాటను నిలబెట్టునట్లు ఆయన ఇలా చెప్పాడు: “నీ కుమారులు తమ మార్గాన్ని కాపాడుకొని, తమ పూర్ణహృదయంతోను పూర్ణప్రాణంతోను నా సన్నిధిలో సత్యంగా నడుచుకుంటే[a],” అని, “ఇశ్రాయేలు సింహాసనం మీద కూర్చునే పురుషుడు నీ వంశంలో లేకుండా పోడు[b].”'
  rationale: ఉద్దేశార్థమైన לְמַעַן మరియు యాకీమ్ యొక్క ‘నిలబెట్టడం’ భావాన్ని స్పష్టం చేశాం. דבר עלי కి ‘నా గురించి పలికిన’ అనే మూలానుగుణ పఠనాన్ని, షరతు అర్థాన్ని, మరియు రెండవ లేఅమోర్ ప్రవేశికను నిలిపాం. సింహాసన నుడికారాన్ని ప్రధాన పాఠంలో పాఠకులకు స్పష్టంగా, పాదటిప్పణిలో మరింత అక్షరార్థంగా ఇచ్చాం.
