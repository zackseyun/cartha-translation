source:
  edition: WLC
  text: לְמַעַן֩ יָקִ֨ים יְהוָ֜ה אֶת דְּבָר֗/וֹ אֲשֶׁ֨ר דִּבֶּ֣ר עָלַ/י֮ לֵ/אמֹר֒ אִם יִשְׁמְר֨וּ בָנֶ֜י/ךָ אֶת דַּרְכָּ֗/ם לָ/לֶ֤כֶת לְ/פָנַ/י֙ בֶּ/אֱמֶ֔ת בְּ/כָל לְבָבָ֖/ם וּ/בְ/כָל נַפְשָׁ֑/ם לֵ/אמֹ֕ר לֹֽא יִכָּרֵ֤ת לְ/ךָ֙ אִ֔ישׁ מֵ/עַ֖ל כִּסֵּ֥א יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/004.yaml
  text: so that Yahweh may establish his word that he spoke concerning me[a], saying, ‘If your sons keep their way by walking before me in truth with all their heart and with all their soul,’ saying[c][b], ‘A man of yours shall not be cut off from upon the throne of Israel.’
translation:
  language: te
  text: 'యెహోవా నా గురించి పలికిన తన మాటను నిలబెట్టునట్లు ఆయన ఇలా చెప్పాడు: “నీ కుమారులు తమ మార్గాన్ని కాపాడుకొని, తమ పూర్ణహృదయంతోను పూర్ణప్రాణంతోను నా సన్నిధిలో సత్యంగా నడుచుకుంటే[a],” అని, “ఇశ్రాయేలు సింహాసనం మీద కూర్చునే పురుషుడు నీ వంశంలో లేకుండా పోడు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సత్యంగా” అనే మాటను “నమ్మకంగా” లేదా “యథార్థంగా” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'హెబ్రీయు నుడికారానికి మరింత అక్షరార్థం: “ఇశ్రాయేలు సింహాసనం మీదనుండి నీకు ఒక పురుషుడు తెగిపోడు”; భావం: దావీదు వంశంలో ఇశ్రాయేలు సింహాసనం మీద కూర్చునే వారసుడు లేకుండా పోడు.'
    reason: idiom_clarification
lexical_decisions:
- source_word: לְמַעַן יָקִים
  choice: నిలబెట్టడానికి
  rationale: ఉద్దేశాన్ని సూచించే לְמַעַןను, ‘మాటను స్థిరపరచడం/నెరవేర్చడం’ అనే హిఫిల్ יָקִים భావంతో సహజమైన తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన లిప్యంతరీకరణగా నిలుపుతుంది.
- source_word: דְּבָרוֹ
  choice: తన మాటను
  rationale: సందర్భంలో వాగ్దానాన్ని సూచించినప్పటికీ, హెబ్రీయులోని ‘మాట’ అనే రూపాన్ని నిలుపుతుంది.
- source_word: דִּבֶּר עָלַי
  choice: నా గురించి పలికిన
  rationale: עַל యొక్క ‘గురించి/సంబంధించి’ అనే సాధారణ భావాన్ని కాపాడుతుంది; ‘నాతో పలికిన’ అని సందర్భానుసారంగా మార్చదు.
- source_word: יִשְׁמְרוּ ... אֶת דַּרְכָּם
  choice: తమ ప్రవర్తన విషయంలో జాగ్రత్తగా ఉండి
  rationale: ‘తమ మార్గాన్ని కాపాడుకోవడం’ అనే హెబ్రీయు రూపకాన్ని ఆధునిక తెలుగులో దాని నైతిక భావంతో సహజంగా తెలియజేస్తుంది.
- source_word: לָלֶכֶת לְפָנַי
  choice: నా సన్నిధిలో ... నడుచుకుంటే
  rationale: దేవుని ఎదుట జీవించడం అనే నిబంధనా రూపకాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: בֶּאֱמֶת
  choice: సత్యంగా
  rationale: ‘సత్యంతో, నమ్మకంగా, యథార్థంగా’ అనే భావవ్యాప్తిని పూర్తిగా సంకుచితం చేయకుండా మూలపదానికి దగ్గరగా ఉంటుంది.
- source_word: בְּכָל לְבָבָם וּבְכָל נַפְשָׁם
  choice: తమ పూర్ణహృదయంతో, పూర్ణప్రాణంతో
  rationale: మొత్తం అంతరంగం మరియు జీవంతో కూడిన సంపూర్ణ నిబద్ధతను సమాంతర నిర్మాణంలో తెలియజేస్తుంది.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ מֵעַל כִּסֵּא יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సింహాసనం మీద కూర్చునే పురుషుడు నీ వంశంలో లేకుండా పోడు
  rationale: ‘నీకు పురుషుడు తెగిపోడు’ అనే హెబ్రీయు నుడికారాన్ని అర్థస్పష్టమైన తెలుగులో అందిస్తూ, రాజవంశ వారసత్వ సూచనను వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దావీదు వంశానికి ఇచ్చిన వాగ్దానంలోని షరతు
  choice: ‘నడుచుకుంటే’ అనే స్పష్టమైన షరతుతో అనువదించబడింది.
  alternative: ఇతర నిబంధనా వచనాలతో సమన్వయం చేయడానికి దీనిని కేవలం సాధారణ ఉపదేశంగా మృదువుగా చెప్పడం.
  rationale: אִם స్పష్టంగా షరతును ప్రవేశపెడుతుంది; వాగ్దానంలోని షరతుతో కూడిన రూపాన్ని, ఇతర చోట్ల కనిపించే షరతులేని ప్రకటనలతో బలవంతంగా సమన్వయం చేయకుండా నిలుపుతుంది.
- issue: ‘నా గురించి’ లేదా ‘నాతో’
  choice: నా గురించి
  alternative: నాతో
  rationale: דבר עלי అనే మూలనిర్మాణం సహజంగా ‘నా గురించి/నన్ను గూర్చి పలికాడు’ అని సూచిస్తుంది; సందర్భం ఆధారంగా దానిని ‘నాతో పలికాడు’గా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే నుడికారం. ‘పూర్ణహృదయం/పూర్ణప్రాణం’ మరియు ‘నా సన్నిధిలో నడుచుకోవడం’ వంటి బైబిలీయ రూపకాలను నిలిపి, అసహజమైన అక్షరానువాదాన్ని అవసరమైన చోట భావస్పష్టంగా మార్చాం.
