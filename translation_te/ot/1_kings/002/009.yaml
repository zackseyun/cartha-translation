id: 1KI.2.9
reference: 1 Kings 2:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּה֙ אַל תְּנַקֵּ֔/הוּ כִּ֛י אִ֥ישׁ חָכָ֖ם אָ֑תָּה וְ/יָֽדַעְתָּ֙ אֵ֣ת אֲשֶׁ֣ר תַּֽעֲשֶׂה לּ֔/וֹ וְ/הוֹרַדְתָּ֧ אֶת שֵׂיבָת֛/וֹ בְּ/דָ֖ם שְׁאֽוֹל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/009.yaml
  text: But now[a], do not hold him guiltless, for you are a wise man, and you will know what you should do to him; and you shall bring his gray head down to Sheol with blood.
translation:
  language: te
  text: అయితే ఇప్పుడు అతన్ని నిర్దోషిగా విడిచిపెట్టకు; నీవు జ్ఞానవంతుడవు కాబట్టి, అతనికి ఏమి చేయాలో నీవు తెలుసుకొంటావు. అతని నెరిసిన తలను రక్తంతో షెయోలుకు దింపుతావు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “షెయోలు”కు “సమాధి” లేదా “మృతుల లోకం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנַקֵּהוּ
  choice: అతన్ని నిర్దోషిగా విడిచిపెట్టకు
  rationale: పీయేల్ రూపంలోని נקה ఇక్కడ ‘నిర్దోషిగా పరిగణించి శిక్షించకుండా విడిచిపెట్టు’ అనే న్యాయపరమైన భావాన్ని ఇస్తుంది. ఈ తెలుగు రూపం నిర్దోషిత్వం మరియు శిక్ష లేకుండా విడిచిపెట్టడం అనే రెండు ఛాయలనూ సహజంగా తెలియజేస్తుంది.
- source_word: אִישׁ חָכָם
  choice: నీవు జ్ఞానవంతుడవు
  rationale: సొలొమోనును నేరుగా సంబోధిస్తున్న సందర్భంలో ఇది సహజమైన ఆధునిక తెలుగు; ‘మనిషి’ అనే పదాన్ని యాంత్రికంగా చేర్చకుండానే పురుష ఏకవచన సంబోధన నిలుస్తుంది.
- source_word: וְיָדַעְתָּ אֵת אֲשֶׁר תַּעֲשֶׂה לוֹ
  choice: అతనికి ఏమి చేయాలో నీకు తెలుసు
  rationale: కతల్ రూపం సందర్భంలో దావీదు సొలొమోను వివేచనపై ఉంచిన నమ్మకాన్ని వ్యక్తం చేస్తుంది. ‘తెలుసు’ అనేది భవిష్యత్ భావాన్ని బలవంతంగా చేర్చకుండా మూలంలోని రూపాన్ని సహజంగా అందిస్తుంది.
- source_word: וְהוֹרַדְתָּ
  choice: దింపాలి
  rationale: ירד హిఫీల్ యొక్క కారణార్థక భావమైన ‘కిందికి దింపడం’ను నిలుపుతూ, సందర్భంలోని రాజాజ్ఞ/బాధ్యతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שֵׂיבָתוֹ
  choice: అతని నెరిసిన తలను
  rationale: మూలంలోని ‘అతని నెరుపు/నెరిసిన జుట్టు’ అనే వృద్ధాప్య సూచక రూపకాన్ని తెలుగు పాఠకులకు స్పష్టంగా ఉండే ‘నెరిసిన తల’గా నిలుపుతుంది.
- source_word: בְּדָם
  choice: రక్తంతో
  rationale: హింసాత్మకమైన, రక్తపాతంతో కూడిన మరణాన్ని సూచించే మూలంలోని కఠినమైన చిత్రణను మృదువుపరచకుండా ఉంచుతుంది.
- source_word: שְׁאוֹל
  choice: షెయోలు
  rationale: దీనిని కేవలం ‘సమాధి’గా పరిమితం చేయకుండా, హీబ్రూ భావప్రపంచంలోని మృతుల లోకానికి సంబంధించిన విస్తృతార్థాన్ని లిప్యంతరీకరణ ద్వారా కాపాడుతుంది.
theological_decisions:
- issue: שְׁאוֹל పదానికి అనువాదం
  choice: షెయోలు
  alternative: సమాధి లేదా మృతుల లోకం
  rationale: ‘సమాధి’ అని మాత్రమే అనువదిస్తే భావం భౌతిక సమాధికి పరిమితమయ్యే అవకాశం ఉంది; ‘మృతుల లోకం’ ఒక వివరణాత్మక ప్రత్యామ్నాయం. లిప్యంతరీకరణ మూలంలోని విశ్వదృష్టి మరియు భావసందిగ్ధతను నిలుపుతుంది.
- issue: వాక్యంలో మరణశిక్ష సూచన
  choice: రక్తంతో ... దింపాలి
  alternative: రక్తపాత మరణం కలిగించాలి
  rationale: మూలం ప్రత్యక్షంగా ఇచ్చే రక్తం మరియు షెయోలు చిత్రణను వివరణాత్మక సిద్ధాంత వాక్యంగా మార్చకుండా అలాగే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన రాజాజ్ఞ ధోరణి ఉంచబడింది. హీబ్రూ రూపకాలు—‘నెరిసిన తల,’ ‘రక్తంతో,’ ‘షెయోలు’—సాధ్యమైనంతవరకు నిలుపబడ్డాయి; అయితే వాక్యనిర్మాణం సాధారణ పాఠకుడికి సహజంగా ఉండేలా చేయబడింది.
