review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the judicial sense of אַל־תְּנַקֵּהוּ, the wisdom addressed to Solomon, the gray-head idiom, and the violent force of ‘with blood’ and Sheol. However, ‘నీకు తెలుసు’ shifts the contextual future sense of וְיָדַעְתָּ ... תַּעֲשֶׂה, and the impersonal ‘దింపాలి’ weakens the explicitly second-person causative instruction/prediction of וְהוֹרַדְתָּ.
  naturalness: The Telugu is generally clear and suitably grave. Using future second-person forms makes the sequence more natural as David’s direct charge to Solomon and retains the source’s addressee more precisely.
  terminology: ‘నిర్దోషిగా విడిచిపెట్టకు,’ ‘జ్ఞానవంతుడవు,’ ‘నెరిసిన తల,’ ‘రక్తంతో,’ and ‘షెయోలు’ are appropriate. The Sheol footnote is correctly anchored and preserves the lexical range without narrowing it doctrinally.
  issues:
  - severity: medium
    issue: The clause ‘అతనికి ఏమి చేయాలో నీకు తెలుసు’ uses a present-state expression.
    rationale: 'In this instructional context, the Hebrew qatal followed by imperfect has a forward-looking sense: Solomon will know what to do. A future Telugu form better retains that force.'
  - severity: medium
    issue: ‘అతని నెరిసిన తలను రక్తంతో షెయోలుకు దింపాలి’ is impersonal.
    rationale: The Hebrew Hiphil verb directly addresses Solomon (‘you shall/will bring down’). ‘దింపుతావు’ preserves both the second-person reference and causative force.
  revised_text: అయితే ఇప్పుడు అతన్ని నిర్దోషిగా విడిచిపెట్టకు; నీవు జ్ఞానవంతుడవు కాబట్టి, అతనికి ఏమి చేయాలో నీవు తెలుసుకొంటావు. అతని నెరిసిన తలను రక్తంతో షెయోలుకు దింపుతావు.[a]
