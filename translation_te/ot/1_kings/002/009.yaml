- from: అయితే ఇప్పుడు అతన్ని నిర్దోషిగా విడిచిపెట్టకు. నీవు జ్ఞానవంతుడవు; అతనికి ఏమి చేయాలో నీకు తెలుసు. అతని నెరిసిన తలను రక్తంతో షెయోలుకు దింపాలి.[a]
  to: అయితే ఇప్పుడు అతన్ని నిర్దోషిగా విడిచిపెట్టకు; నీవు జ్ఞానవంతుడవు కాబట్టి, అతనికి ఏమి చేయాలో నీవు తెలుసుకొంటావు. అతని నెరిసిన తలను రక్తంతో షెయోలుకు దింపుతావు.[a]
