source:
  edition: WLC
  text: וְ/הֵשִׁיב֩ יְהוָ֨ה אֶת דָּמ֜/וֹ עַל רֹאשׁ֗/וֹ אֲשֶׁ֣ר פָּגַ֣ע בִּ/שְׁנֵֽי אֲ֠נָשִׁים צַדִּקִ֨ים וְ/טֹבִ֤ים מִמֶּ֨/נּוּ֙ וַ/יַּהַרְגֵ֣/ם בַּ/חֶ֔רֶב וְ/אָבִ֥/י דָוִ֖ד לֹ֣א יָדָ֑ע אֶת אַבְנֵ֤ר בֶּן נֵר֙ שַׂר צְבָ֣א יִשְׂרָאֵ֔ל וְ/אֶת עֲמָשָׂ֥א בֶן יֶ֖תֶר שַׂר צְבָ֥א יְהוּדָֽה־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/032.yaml
  text: 'And Yahweh will return his blood on his own head[a], because he struck down two men more righteous and better than he, and killed them with the sword while my father David did not know it: Abner son of Ner, commander of Israel’s army, and Amasa son of Jether, commander of Judah’s army.'
translation:
  language: te
  text: 'యాహ్వే అతని రక్తాన్ని అతని సొంత తలమీదికి తిరిగి రప్పిస్తాడు[a], ఎందుకంటే అతడు తనకంటే నీతిమంతులూ మంచివారూ అయిన ఇద్దరు మనుష్యులపై దాడిచేసి, నా తండ్రియైన దావీదుకు తెలియకుండానే వారిని కత్తితో చంపాడు: ఇశ్రాయేలు సైన్యాధిపతి నేరు కుమారుడు అబ్నేరు, యూదా సైన్యాధిపతి యెతెరు కుమారుడు అమాశా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని రక్తపాత దోషాన్ని అతని సొంత తలమీదికి తిరిగి రప్పిస్తాడు.” ఈ హెబ్రీయ నుడికారం రక్తపాతానికి సంబంధించిన బాధ్యత, దానికి తగిన ప్రతిఫలం దోషిపైనే తిరిగి పడడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵשִׁיב
  choice: తిరిగి రప్పిస్తాడు
  rationale: హిఫిల్ రూపం ఇక్కడ చేసిన రక్తపాతానికి ప్రతిఫలం దోషి మీదికే తిరిగి వచ్చే భావాన్ని వ్యక్తం చేస్తుంది; హెబ్రీయ చిత్రణను నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపంతో అందించింది; బిరుదుతో భర్తీ చేయలేదు.
- source_word: דָּמוֹ ... עַל רֹאשׁוֹ
  choice: అతని రక్తాన్ని అతని తలమీదికే
  rationale: రక్తపాత బాధ్యత దోషిపైనే పడుతుందనే హెబ్రీయ నుడికారపు రూపకాన్ని ప్రధాన పాఠంలో నిలిపి, పాదసూచికలో అర్థాన్ని స్పష్టం చేసింది.
- source_word: פָּגַע
  choice: దాడిచేసి
  rationale: ఈ హింసాత్మక సందర్భంలో శత్రుత్వంతో మీదపడడాన్ని సూచిస్తుంది; తరువాతి ‘చంపాడు’ అనే స్పష్టమైన క్రియతో అనవసర పునరుక్తి రాకుండా సహజంగా ఉంది.
- source_word: צַדִּקִים וְטֹבִים מִמֶּנּוּ
  choice: తనకంటే నీతిమంతులూ మంచివారూ అయిన
  rationale: నైతిక/న్యాయపరమైన צַדִּיקִים భావాన్నీ, తులనాత్మకమైన טֹבִים భావాన్నీ వేరువేరుగా నిలుపుతుంది.
- source_word: וַיַּהַרְגֵם בַּחֶרֶב
  choice: వారిని కత్తితో చంపాడు
  rationale: హత్యను, ఉపయోగించిన సాధనాన్ని నేరుగా మరియు స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְאָבִי דָוִד לֹא יָדָע
  choice: నా తండ్రి దావీదుకు తెలియకుండానే
  rationale: వావ్‌ను సందర్భానుసార పరిస్థితి సూచకంగా గ్రహించి, ఆ హత్యల గురించి దావీదుకు ముందస్తు జ్ఞానం లేదా సమ్మతి లేదనే భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: שַׂר צְבָא יִשְׂרָאֵל / שַׂר צְבָא יְהוּדָה
  choice: ఇశ్రాయేలు సైన్యాధిపతి / యూదా సైన్యాధిపతి
  rationale: ప్రాచీన సైనిక బిరుదును ఆధునిక పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన తెలుగులో ఏకరీతిగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా ఉంచుతూ, ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు విస్తృతంగా సుపరిచితమైన రూపాన్ని ఎంచుకుంది.
- issue: ‘రక్తం తలమీదికి తిరిగి రావడం’ అనే నుడికారం
  choice: రూపకాన్ని ప్రధాన పాఠంలో నిలిపి, రక్తపాత దోషం మరియు దానికి తగిన ప్రతిఫలం అనే భావాన్ని పాదసూచికలో వివరించడం
  alternative: ‘అతని రక్తపాత దోషాన్ని అతనిపైనే మోపుతాడు’ అని పూర్తిగా భావానువాదం చేయడం
  rationale: ఈ మాట కేవలం శారీరక రక్తాన్ని కాక, హత్యకు సంబంధించిన బాధ్యత మరియు దైవిక ప్రతిఫలాన్ని సూచిస్తుంది. మూలంలోని బలమైన రూపకాన్ని చెరపకుండా పాఠకునికి అర్థం అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘నీతిమంతులు’, ‘సైన్యాధిపతి’ వంటి పదాలు మూలంలోని నైతిక మరియు అధికారిక భావాన్ని నిలుపుతాయి. పేర్లను తెలుగు బైబిలు సంప్రదాయంలో సుపరిచితమైన రూపాల్లో ఇచ్చాం.
