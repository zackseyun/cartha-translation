source:
  edition: WLC
  text: וְ/אֶת כָּל הַ/בַּ֛יִת צִפָּ֥ה זָהָ֖ב עַד תֹּ֣ם כָּל הַ/בָּ֑יִת וְ/כָל הַ/מִּזְבֵּ֥חַ אֲֽשֶׁר לַ/דְּבִ֖יר צִפָּ֥ה זָהָֽב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/022.yaml
  text: He overlaid the whole house with gold[a], until the whole house was finished[b]; and he overlaid with gold the whole altar that belonged to the inner sanctuary.
translation:
  language: te
  text: మందిరం మొత్తం పూర్తయ్యేవరకు అతడు మందిరమంతటినీ బంగారంతో పొదిగించాడు. అంతర్గర్భాలయానికి[a] చెందిన[b] బలిపీఠమంతటినీ అతడు బంగారంతో పొదిగించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం దెబీర్; అంటే మందిరంలోని అంతర్గర్భాలయం. సంప్రదాయంగా దీనిని ‘అతి పరిశుద్ధ స్థలం’ అని కూడా అంటారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అంతర్గర్భాలయంలో ఉన్న.’ హీబ్రూ పదబంధం బలిపీఠానికి అంతర్గర్భాలయంతో ఉన్న సంబంధాన్నిగానీ, దాని స్థానాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: మందిరం
  rationale: బַּיִת‌కు అక్షరార్థంగా ‘ఇల్లు’ అనే భావం ఉన్నా, ఇక్కడ అది యెహోవా మందిర నిర్మాణాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘మందిరం’ సందర్భాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: צִפָּה
  choice: పొదిగించాడు
  rationale: ఈ నిర్మాణ సందర్భంలో ఉపరితలంపై బంగారాన్ని అమర్చి కప్పడం అనే భావాన్ని ‘పొదిగించాడు’ సహజంగా, నిర్దిష్టంగా వ్యక్తం చేస్తుంది.
- source_word: זָהָב
  choice: బంగారం
  rationale: మూలంలోని లోహ పదానికి సాధారణమైన, నేరమైన తెలుగు సమానం.
- source_word: עַד תֹּם
  choice: పూర్తయ్యే వరకు
  rationale: పని సంపూర్ణతకు చేరేవరకు కొనసాగిందనే కాల–పూర్తి భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: כָּל
  choice: మంతటినీ / మంతా
  rationale: మందిరం, బలిపీఠం మొత్తం అనే సంపూర్ణతను సందర్భానుసారమైన తెలుగు రూపాలతో తెలియజేస్తుంది.
- source_word: הַמִּזְבֵּחַ
  choice: బలిపీఠం
  rationale: మִזְבֵּחַకు ప్రామాణికమైన, సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: אֲשֶׁר לַדְּבִיר
  choice: అంతర్గర్భాలయానికి చెందిన
  rationale: לְ సంబంధం, చెందినదనం లేదా స్థానం సూచించవచ్చు. ప్రధాన పాఠంలో ‘చెందిన’ అని ఇవ్వడం సంబంధాన్ని తెలియజేస్తూ నిర్దిష్ట స్థలాన్ని అనవసరంగా నిర్ణయించదు; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: דְּבִיר
  choice: అంతర్గర్భాలయం
  rationale: దేవాలయంలోని అత్యంత లోపలి పవిత్ర గదిని ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది; సంప్రదాయ వ్యాఖ్యాత్మక నామాన్ని ప్రధాన పాఠంలో బలవంతంగా చేర్చదు.
theological_decisions:
- issue: דְּבִיר అనే స్థలానికి సంప్రదాయ పవిత్ర నామం
  choice: అంతర్గర్భాలయం
  alternative: అతి పరిశుద్ధ స్థలం
  rationale: మూలపదం ఆలయంలోని లోపలి గదిని సూచిస్తుంది. ‘అంతర్గర్భాలయం’ నిర్మాణ సంబంధ అర్థాన్ని కాపాడుతుంది; ‘అతి పరిశుద్ధ స్థలం’ అనే సంప్రదాయ పేరును పాదసూచికలో తెలియజేయడం ద్వారా భావాన్ని అతిగా నిర్ణయించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన నిర్మాణ వర్ణనను వాడాం. మూలంలోని ‘మొత్తం’ అనే పునరుక్తి భావాన్ని ‘మంతటినీ/మంతా’ ద్వారా నిలిపాం. సంబంధం–స్థానం విషయంలో హీబ్రూ అస్పష్టతను ప్రధాన పాఠం మరియు పాదసూచికల ద్వారా సంరక్షించాం.
