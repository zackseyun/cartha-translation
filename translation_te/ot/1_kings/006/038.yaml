translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు స్పష్టమైన శైలి వాడబడింది. ‘బూలు’ అనే చారిత్రక నెల పేరును అలాగే ఉంచి పాదటిప్పణిలో వివరించాం. నిర్మాణ సందర్భాన్ని స్పష్టంచేయడానికి ‘మందిర నిర్మాణం’ అని వాడినా, అదనపు మతపరమైన వ్యాఖ్యానాన్ని చేర్చలేదు.
