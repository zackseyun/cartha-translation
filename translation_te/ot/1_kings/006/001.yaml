id: 1KI.6.1
reference: 1 Kings 6:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י בִ/שְׁמוֹנִ֣ים שָׁנָ֣ה וְ/אַרְבַּ֣ע מֵא֣וֹת שָׁנָ֡ה לְ/צֵ֣את בְּנֵֽי יִשְׂרָאֵ֣ל מֵ/אֶֽרֶץ מִצְרַיִם֩ בַּ/שָּׁנָ֨ה הָ/רְבִיעִ֜ית בְּ/חֹ֣דֶשׁ זִ֗ו ה֚וּא הַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י לִ/מְלֹ֥ךְ שְׁלֹמֹ֖ה עַל יִשְׂרָאֵ֑ל וַ/יִּ֥בֶן הַ/בַּ֖יִת לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/001.yaml
  text: And it came about in the four hundred eightieth year after the sons of Israel came out from the land of Egypt[a], in the fourth year, in the month of Ziv (that is, the second month), of Solomon’s reign over Israel[c][b], that he built the house for Yahweh.
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు[a] ఐగుప్తు దేశం నుండి బయలుదేరిన తరువాతి నాలుగు వందల ఎనభయ్యవ సంవత్సరంలో, ఇశ్రాయేలుమీద సొలొమోను పరిపాలనలోని నాలుగో సంవత్సరంలో, జివ్ నెలలో—అంటే రెండో నెలలో[b]—అతడు యాహ్వేకు మందిరాన్ని[c] కట్టాడు.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఇక్కడ ఈ మాట ఇశ్రాయేలు ప్రజలను సమూహంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘జివ్’ అనేది ప్రాచీన హెబ్రీ క్యాలెండరులో రెండో నెలకు ఉన్న పాత పేరు.
    reason: cultural_note
  - marker: c
    text: హెబ్రీలో అక్షరార్థంగా ‘ఇల్లు’; ఇక్కడ యాహ్వే మందిరం ఉద్దేశం.
    reason: lexical_alternative
  - marker: d
    text: లేదా సందర్భార్థంగా, ‘కట్టడం మొదలుపెట్టాడు.’ అయితే హెబ్రీ క్రియ అక్షరార్థంగా ‘కట్టాడు’ అని మాత్రమే చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[ప్రత్యేక పదంగా అనువదించకుండా కాలసూచక వాక్య నిర్మాణంలో వ్యక్తీకరణ]'
  rationale: హీబ్రూ కథనారంభ సూత్రాన్ని తెలుగులో ‘అప్పుడు జరిగింది’ అని భారంగా ఉంచకుండా, సహజమైన కాలసూచక వాక్యంగా వ్యక్తం చేశాం.
- source_word: בִּשְׁמוֹנִים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: నాలుగు వందల ఎనభయ్యవ సంవత్సరంలో
  rationale: ఇది 480 సంవత్సరాల సడలిన వ్యవధి కాక, నిర్దిష్ట సంవత్సర గణనను సూచించే హీబ్రూ నిర్మాణం.
- source_word: לְצֵאת בְּנֵי יִשְׂרָאֵל מֵאֶרֶץ מִצְרַיִם
  choice: ఇశ్రాయేలు కుమారులు ఐగుప్తు దేశం నుండి బయలుదేరిన
  rationale: కాలానికి ఆధారబిందువైన బయలుదేరడాన్ని సహజ తెలుగులో చెప్పి, ‘దేశం’ అనే మూలపదాన్నీ నిలిపాం.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: మూలంలోని కుటుంబసంబంధమైన సామూహిక నుడికారాన్ని నిలిపాం; ఇది కేవలం పురుషులను మాత్రమే సూచించదు.
- source_word: בְּחֹדֶשׁ זִו הוּא הַחֹדֶשׁ הַשֵּׁנִי
  choice: జివ్ నెలలో—అంటే రెండో నెలలో
  rationale: ప్రాచీన నెలపేరును లిప్యంతరీకరించి, మూలంలోని వివరణాత్మక సమానార్థక భాగాన్ని సహజంగా ఉంచాం.
- source_word: לִמְלֹךְ שְׁלֹמֹה עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుమీద సొలొమోను పరిపాలనలోని
  rationale: ఇది సొలొమోను రాజ్యపాలన ఆధారంగా తేదీని సూచిస్తున్నందున సంక్షిప్తమైన ఆధునిక తెలుగు నిర్మాణాన్ని ఎంచుకున్నాం.
- source_word: וַיִּבֶן
  choice: కట్టాడు
  rationale: మూల క్రియ సాధారణంగా ‘కట్టాడు’ అని చెబుతుంది; సందర్భం నిర్మాణారంభాన్ని సూచించినా ‘కట్టడం మొదలుపెట్టాడు’ అనే భావాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: הַבַּיִת
  choice: మందిరాన్ని
  rationale: అక్షరార్థం ‘ఇల్లు’; ఈ సందర్భంలో యెహోవా ఆరాధనాలయమే ఉద్దేశం. సాధారణ తెలుగు పాఠకుడికి సూచ్యార్థం స్పష్టంగా ఉండేందుకు ‘మందిరం’ వాడి, అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: לַיהוָה
  choice: యెహోవా కోసం
  rationale: దైవనామమైన יהוהను సాధారణ తెలుగు బైబిలు సంప్రదాయంలో సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం; לַ ఉపసర్గను ‘కోసం’గా వ్యక్తం చేశాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో ప్రత్యక్షంగా ఉన్న నిబంధన దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగానే ఉంచాం. తెలుగు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ఉచ్చారణ పునర్నిర్మాణంలో ఉన్న అనిశ్చితిని పాదసూచికలో తెలిపాం.
- issue: בְּנֵי יִשְׂרָאֵל లోని కుటుంబసంబంధ నుడికారం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు; ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలోని ‘కుమారులు’ అనే సామూహిక, వంశసంబంధ రూపాన్ని నిలిపాం; దాని పరిధిని పాదసూచిక స్పష్టం చేస్తుంది.
- issue: וַיִּבֶן క్రియ నిర్మాణ ప్రారంభాన్నే సూచిస్తుందా
  choice: కట్టాడు
  alternative: కట్టడం మొదలుపెట్టాడు
  rationale: తదుపరి సందర్భం ప్రాజెక్టు ప్రారంభాన్ని తేదీతో సూచించినప్పటికీ, హీబ్రూ క్రియలో ‘మొదలుపెట్టాడు’ అనే పదం స్పష్టంగా లేదు. అందువల్ల మూలంలోని సంక్షిప్తతను ప్రధాన పాఠ్యంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, చదవడానికి సులభమైన చారిత్రక కథన శైలి. దీర్ఘమైన హీబ్రూ కాలసూచక వాక్యాన్ని ఒకే వాక్యంగా ఉంచినా, డ్యాష్‌లతో నెల వివరణను వేరుచేసి స్పష్టత పెంచాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో వరుసగా చేర్చబడ్డాయి.
