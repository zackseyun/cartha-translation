source:
  edition: WLC
  text: וַ/יִּ֨בֶן֙ אֶת הֶ/חָצֵ֣ר הַ/פְּנִימִ֔ית שְׁלֹשָׁ֖ה טוּרֵ֣י גָזִ֑ית וְ/ט֖וּר כְּרֻתֹ֥ת אֲרָזִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/036.yaml
  text: And he built the inner court with three rows of cut stone and a row of cedar beams[a].
translation:
  language: te
  text: అతడు లోపలి ప్రాంగణాన్ని మలచిన రాళ్ల మూడు వరుసలతోను, దేవదారు దూలాల ఒక వరుసతోను కట్టాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మలచిన రాళ్ల మూడు పొరలతోను, దేవదారు దూలాల ఒక పొరతోను.”
    reason: టוּר అనే నిర్మాణ పదానికి ‘వరుస’తో పాటు ‘పొర’ లేదా నిర్మాణ-స్థరం అనే అర్థమూ సాధ్యమైనందున ఆ ప్రత్యామ్నాయాన్ని భద్రపరచడం.
lexical_decisions:
- source_word: וַיִּבֶן
  choice: అతడు ... కట్టించాడు
  rationale: בנה అనే క్రియ ఆలయ నిర్మాణ సందర్భంలో ‘కట్టించాడు’ అని సహజంగా వస్తుంది; రాజైన సొలొమోను స్వయంగా కట్టాడని కాక, తన ఆధ్వర్యంలో కట్టించాడనే తెలుగు ప్రయోగం సందర్భానుకూలం. వַ- తెలిపే కథన క్రమాన్ని వాక్యప్రవాహమే వ్యక్తం చేస్తుంది.
- source_word: הֶחָצֵר הַפְּנִימִית
  choice: లోపలి ప్రాంగణాన్ని
  rationale: חָצֵר ఆలయ పరిసరంలోని court/courtyard‌ను సూచిస్తుంది; ‘ప్రాంగణం’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన పదం. פְּנִימִיתను ‘లోపలి’గా నేరుగా అనువదించాం.
- source_word: שְׁלֹשָׁה טוּרֵי
  choice: మూడు వరుసలుగాను
  rationale: טוּר నిర్మాణంలో వరుస లేదా పొరను సూచించవచ్చు. సాధారణ పాఠకులకు ‘వరుసలు’ సులభం; నిర్మాణపరమైన ‘పొరలు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: גָזִית
  choice: చెక్కిన రాళ్లు
  rationale: גָזִית మలచబడిన లేదా చెక్కబడిన నిర్మాణ రాయిని సూచిస్తుంది. ‘చెక్కిన రాళ్లు’ అర్థాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: וְטוּר
  choice: ఒక వరుసగాను
  rationale: హీబ్రూలో సంఖ్యావాచకం ప్రత్యక్షంగా లేకపోయినా, ఏకవచనమైన טוּר ముందున్న ‘మూడు వరుసలు’తో వ్యత్యాసంగా ఒక అదనపు వరుసను సూచిస్తుంది. తెలుగులో ‘ఒక వరుస’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: כְּרֻתֹת אֲרָזִים
  choice: దేవదారు దూలాలు
  rationale: ఈ పదబంధం కోసి సిద్ధం చేసిన దేవదారు కలప భాగాలను సూచిస్తుంది. నిర్మాణ సందర్భంలో ‘దూలాలు’ వాటి సంభావ్య పనిని స్పష్టంగా తెలియజేస్తుంది; అవి కోసినవనే భావం దూలాలు అన్న పదంలో సహజంగా ఇమిడింది.
