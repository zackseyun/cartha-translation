source:
  edition: WLC
  text: וְ/כֵ֥ן עָשָׂ֛ה לְ/פֶ֥תַח הַֽ/הֵיכָ֖ל מְזוּז֣וֹת עֲצֵי שָׁ֑מֶן מֵ/אֵ֖ת רְבִעִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/033.yaml
  text: And so he made for the entrance of the nave doorposts of olivewood[a], four-sided.
translation:
  language: te
  text: అలాగే అతడు ఆలయ ప్రధాన మందిరపు ప్రవేశానికి ఒలీవ చెక్కతో ద్వారబంధాలను చేశాడు; అవి నాలుగవ భాగం ప్రకారమున్నవి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధం అక్షరార్థంగా “నాలుగవ భాగం నుండి” అని ఉంటుంది; దాని నిర్మాణార్థం స్పష్టంగా లేదు. దీనిని “చతురస్రంగా” లేదా “నాలుగు వైపుల చట్రంతో” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֵן
  choice: అలాగే
  rationale: ముందటి నిర్మాణ వివరణతో ఉన్న పోలికను, కొనసాగింపును సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עָשָׂה
  choice: చేశాడు
  rationale: నిర్మాణ సందర్భంలో సాధారణమైన, సూటియైన క్రియ.
- source_word: לְפֶתַח הַהֵיכָל
  choice: ఆలయ ప్రధాన మందిరపు ప్రవేశానికి
  rationale: הֵיכָל అంతర్గర్భాలయానికి భిన్నమైన ఆలయ ప్రధాన గదిని సూచిస్తుంది; సాధారణ పాఠకులకు అర్థమయ్యేలా ‘ప్రధాన మందిరం’ అని ఇచ్చాం.
- source_word: מְזוּזוֹת
  choice: ద్వారబంధాలను
  rationale: ద్వారానికి ఇరువైపులనున్న నిలువు కమ్ములను సూచించే సహజమైన తెలుగు నిర్మాణ పదం.
- source_word: עֲצֵי שָׁמֶן
  choice: ఒలీవ చెక్కతో
  rationale: ఈ సందర్భంలో నూనె చెట్టు, అంటే ఒలీవ చెట్టు కలపను సూచించే నిర్మాణ పదబంధం.
- source_word: מֵאֵת רְבִעִית
  choice: నాలుగు వైపుల చట్రంగా
  rationale: హీబ్రూ పదబంధం నిర్మాణపరంగా క్లిష్టమైనది. అది ద్వార నిర్మాణపు నాలుగు వైపుల చట్రాన్ని లేదా చతురస్ర ఆకృతిని సూచించవచ్చనే భావాన్ని పాఠ్యంలో సహజంగా అందిస్తూ, అనిశ్చితిని పాదసూచికలో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే నిర్మాణ వర్ణన. ‘నేవ్’ వంటి ప్రత్యేక సాంకేతిక పదానికి బదులుగా ‘ఆలయ ప్రధాన మందిరం’ వాడబడింది. క్లిష్టమైన చివరి హీబ్రూ పదబంధం అతిగా నిర్ణయించకుండా పాదసూచికలో దాని అస్పష్టతను తెలిపాం.
