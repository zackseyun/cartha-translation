  text: And the word of Yahweh came to Solomon[a], saying[b],
translation:
  language: te
  text: అప్పుడు యాహ్వే[a] వాక్కు సొలొమోనుకు వచ్చి ఇలా పలికింది:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: יהוה (YHWH); సంప్రదాయ తెలుగు రూపం: ‘యెహోవా’.'
    reason: దైవనామపు లిప్యంతరీకరణను స్పష్టం చేయడం.
  - marker: b
    text: 'హీబ్రూ అక్షరార్థం: ‘అని చెప్పుతూ’. ఇది తరువాతి వచనంలోని మాటలను పరిచయం చేస్తుంది.'
    reason: లֵאמֹר అనే హీబ్రూ ప్రకటన సూత్రపు రూపాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַיְהִי
  choice: అప్పుడు ... వచ్చి
  rationale: ఇక్కడ היה యొక్క వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది. ‘అప్పుడు’ సహజమైన తెలుగు కథన ప్రవాహాన్ని ఇస్తుంది; ‘జరిగింది ఏమిటంటే’ అనే అక్షరానువాదపు భారాన్ని నివారిస్తుంది.
- source_word: דְּבַר
  choice: వాక్కు
  rationale: דְּבַר יְהוָה అనే స్థిరమైన దైవిక ప్రకటన సూత్రంలో ‘వాక్కు’ మూలంలోని రూపకాన్నీ, దైవసందేశ భావాన్నీ నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో సమీప లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: אֶל שְׁלֹמֹה
  choice: సొలొమోనుకు
  rationale: אֶל గ్రహీతను సూచిస్తుంది; దత్తివిభక్తి ‘-కు’ తెలుగులో సహజంగా అదే సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా పలికింది
  rationale: తదుపరి వచనంలో వచ్చే ప్రత్యక్ష దైవవాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాక వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం; సుపరిచితమైన ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో తెలిపాం.
- issue: ‘యాహ్వే వాక్కు’ మాట్లాడినట్లు చూపే వాక్యనిర్మాణం
  choice: వాక్కు ... పలికింది
  alternative: యాహ్వే ఇలా అన్నాడు
  rationale: హీబ్రూ వాక్యంలో కర్త ‘యాహ్వే వాక్కు’; దానిని నేరుగా ‘యాహ్వే’గా మార్చితే మూలంలోని ప్రకటన సూత్రం కనుమరుగవుతుంది. తెలుగు వ్యాకరణానికి అనుగుణంగా ‘వాక్కు’నే కర్తగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవభరితమైన శైలిని వాడాం. ‘వాక్కు’ అనే బైబిలీయ పదాన్ని నిలుపుతూ, ‘వచ్చి ఇలా పలికింది’ ద్వారా హీబ్రూ ప్రకటన సూత్రాన్ని పాఠకులకు సులభంగా అర్థమయ్యేలా చేశాం.
