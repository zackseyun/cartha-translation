  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּבֶן֩ אֶת עֶשְׂרִ֨ים אַמָּ֜ה מ/ירכותי הַ/בַּ֨יִת֙ בְּ/צַלְע֣וֹת אֲרָזִ֔ים מִן הַ/קַּרְקַ֖ע עַד הַ/קִּיר֑וֹת וַ/יִּ֤בֶן ל/וֹ֙ מִ/בַּ֣יִת לִ/דְבִ֔יר לְ/קֹ֖דֶשׁ הַ/קֳּדָשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/016.yaml
  text: He built twenty cubits at the rear of the house with cedar boards[a], from the floor to the walls, and he built it within as an inner sanctuary[c][b], as the Most Holy Place.
translation:
  language: te
  text: అతడు మందిరం వెనుక భాగంలో ఇరవై మూరల మేరకు దేవదారు పలకలతో, నేల నుండి గోడల వరకు[a], నిర్మించాడు. మందిరం లోపల దానిని అంతర్గత పరిశుద్ధ గదిగా[b], అంటే అతి పరిశుద్ధ స్థలంగా[c], నిర్మించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేల నుండి దూలాల/పైకప్పు కర్రల వరకు.’ హెబ్రీయ పాఠంలో ‘గోడల వరకు’ అని ఉంది; ప్రధాన పాఠంలో అదే ఉంచబడింది.
    reason: alternative_reading
  - marker: b
    text: హెబ్రీయులో దెబీర్; ఇది మందిరంలోని అత్యంత లోపలి పవిత్ర గది.
    reason: cultural_note
  - marker: c
    text: 'సాంప్రదాయిక అనువాదం: ‘పరిశుద్ధాతిపరిశుద్ధ స్థలం.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִירְכְּתֵי הַבַּיִת
  choice: మందిరం వెనుక భాగంలో
  rationale: ఈ నిర్మాణ సందర్భంలో הַבַּיִת దేవాలయ మందిరాన్ని సూచిస్తుంది; יַרְכָה దాని సుదూర లేదా వెనుక భాగాన్ని సూచిస్తుంది.
- source_word: בְּצַלְעוֹת אֲרָזִים
  choice: దేవదారు పలకలతో
  rationale: צֵלָעוֹת అనే పదానికి పక్క నిర్మాణాలు, పక్కటెముకలు, పలకలు అనే అర్థాలు ఉండవచ్చు; ఇక్కడ అంతర్గత విభాగ నిర్మాణానికి ఉపయోగించిన దేవదారు పలకలు సందర్భానికి సహజం.
- source_word: מִן הַקַּרְקַע עַד הַקִּירוֹת
  choice: నేల మొదలుకొని గోడల వరకు
  rationale: మసొరా పాఠంలోని కִירוֹתను నేరుగా ‘గోడలు’గా ఉంచి, వాస్తు పరంగా కష్టమైన భావాన్ని సవరించలేదు.
- source_word: וַיִּבֶן לוֹ מִבַּיִת
  choice: దానిని మందిరం లోపల ... నిర్మించాడు
  rationale: సంక్షిప్తమైన హెబ్రీయ ప్రయోగం మందిరం లోపల ఒక ప్రత్యేక అంతర్గత స్థలాన్ని నిర్మించాడనే భావాన్ని ఇస్తుంది.
- source_word: לִדְבִיר
  choice: అంతరాలయంగా
  rationale: דְּבִיר దేవాలయంలోని అత్యంత లోపలి పవిత్ర గదికి సాంకేతిక పదం; ‘అంతరాలయం’ దాని స్థానం, ఆరాధనా విధిని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: అతి పరిశుద్ధ స్థలంగా
  rationale: హెబ్రీయ సమాసం అత్యున్నత పరిశుద్ధతను తెలిపే విధానం; ఆధునిక తెలుగులో ‘అతి పరిశుద్ధ స్థలం’ స్పష్టంగా, గంభీరంగా ఉంటుంది.
- source_word: אַמָּה
  choice: మూరలు
  rationale: ప్రాచీన కొలమానాన్ని ఆధునిక కొలతగా మార్చకుండా, తెలుగులో బైబిలు సందర్భంలో స్థిరపడిన ‘మూర’ పదంతో అనువదించబడింది.
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים అనే అత్యున్నత పవిత్రతా వ్యక్తీకరణ
  choice: అతి పరిశుద్ధ స్థలం
  alternative: పరిశుద్ధ స్థలాల్లోకెల్లా పరిశుద్ధమైన స్థలం
  rationale: మూలంలోని హెబ్రీయ అత్యుత్తమార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, అదనపు మతశాఖాపరమైన వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. పొడవు సూచించే ‘ఇరవై మూరల’ భావాన్ని స్పష్టపరిచి, నిర్మాణ వాక్యాన్ని సహజత కోసం రెండు వాక్యాలుగా విభజించాం; మూలంలోని వాస్తు సంబంధ అస్పష్టతను [a]లో నిలిపాం.
