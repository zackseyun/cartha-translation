    rationale: హెబ్రీయ వాక్యం ఇరవై మూరల వెనుక భాగాన్ని దేవదారు నిర్మాణంతో వేరుచేసిన విషయాన్ని చెబుతుంది; “ఒక విభాగం” అనే పదం నేరుగా లేదు. దానివల్ల రెండవ వాక్యంలోని సర్వనామ సూచన కూడా అస్పష్టమవుతోంది.
