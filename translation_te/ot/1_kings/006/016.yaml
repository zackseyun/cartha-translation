- from: అతడు మందిరం వెనుక భాగంలో ఇరవై మూరల పొడవున దేవదారు పలకలతో, నేల మొదలుకొని గోడల వరకు[a], ఒక విభాగాన్ని నిర్మించాడు. దానిని మందిరం లోపల అంతరాలయంగా[b], అంటే అతి పరిశుద్ధ స్థలంగా[c], నిర్మించాడు.
  to: అతడు మందిరం వెనుక భాగంలో ఇరవై మూరల మేరకు దేవదారు పలకలతో, నేల నుండి గోడల వరకు[a], నిర్మించాడు. మందిరం లోపల దానిని అంతర్గత పరిశుద్ధ గదిగా[b], అంటే అతి పరిశుద్ధ స్థలంగా[c], నిర్మించాడు.
  rationale: అదనంగా చేర్చబడిన “ఒక విభాగం”ను తొలగించి, హెబ్రీయ నిర్మాణపు సంక్షిప్తతను కాపాడాం. “అంతర్గత పరిశుద్ధ గది” దెబీరు యొక్క స్థానం, స్వభావాన్ని స్పష్టంగా తెలియజేస్తుంది; హెబ్రీయ సాంకేతిక పదం పాదటిప్పణిలో మిగిలింది. MTలోని వాస్తుపరంగా క్లిష్టమైన “గోడల వరకు” అనే పఠనం మరియు దానికి ప్రత్యామ్నాయం రెండూ అలాగే భద్రపరచబడ్డాయి.
