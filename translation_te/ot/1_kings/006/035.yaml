id: 1KI.6.35
reference: 1 Kings 6:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/קָלַ֤ע כְּרוּבִים֙ וְ/תִ֣מֹר֔וֹת וּ/פְטֻרֵ֖י צִצִּ֑ים וְ/צִפָּ֣ה זָהָ֔ב מְיֻשָּׁ֖ר עַל הַ/מְּחֻקֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/035.yaml
  text: He carved cherubim and palm trees and open flowers, and overlaid them with gold, fitted over the carved work.
translation:
  language: te
  text: అతడు వాటిమీద కెరూబులను, ఖర్జూర వృక్షాలను, వికసించిన పుష్పాలను చెక్కించి, చెక్కిన పనిమీద సమంగా అమర్చిన బంగారంతో వాటిని కప్పించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְקָלַע
  choice: చెక్కించి
  rationale: ఈ సందర్భంలో తలుపులపై ఆకృతులను చెక్కే పనిని సూచిస్తుంది. ముందున్న వాక్యంలోని సొలొమోను నిర్మాణ కార్యాన్ని చేయించిన భావానికి అనుగుణంగా ప్రేరణార్థక రూపం సహజంగా ఉంది.
- source_word: כְרוּבִים
  choice: కెరూబులను
  rationale: ప్రత్యేకమైన పరలోక జీవుల పేరును వివరణతో పరిమితం చేయకుండా లిప్యంతరీకరించింది.
- source_word: תִמֹרוֹת
  choice: ఖర్జూర చెట్లను
  rationale: అలంకార రూపాలుగా చెక్కిన ఖర్జూర చెట్లను సూచించే సాధారణ, స్పష్టమైన పదబంధం.
- source_word: פְטֻרֵי צִצִּים
  choice: వికసించిన పువ్వులను
  rationale: మూలంలోని తెరచుకున్న లేదా వికసించిన పుష్పాకృతుల భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְצִפָּה זָהָב
  choice: బంగారు రేకు పొదిగించాడు
  rationale: ఉపరితలాన్ని బంగారంతో కప్పడాన్ని సూచిస్తుంది; తెలుగులో నిర్మాణ అలంకరణకు సహజమైన ప్రయోగం.
- source_word: מְיֻשָּׁר עַל הַמְחֻקֶּה
  choice: ఆ చెక్కిన పనికి సరిపోయేలా
  rationale: బంగారం చెక్కిన ఆకృతుల ఉపరితలానికి అనుగుణంగా అమర్చబడిందనే భావాన్ని నిలుపుతుంది; 'సమంగా' అనే ఒక్క అర్థానికి అనవసరంగా పరిమితం చేయదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, దేవాలయ అలంకరణకు తగిన గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు స్పష్టమైన శైలి. సందర్భంలో కర్త సొలొమోను అయినప్పటికీ పనిని శిల్పులచేత చేయించిన భావాన్ని తెలుగు ప్రేరణార్థక క్రియలతో వ్యక్తం చేసింది.
