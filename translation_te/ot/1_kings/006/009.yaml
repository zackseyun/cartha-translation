  text: ఆ విధంగా అతడు మందిరాన్ని కట్టి పూర్తి చేశాడు. దేవదారు దూలలతోను దేవదారు కలప వరుసలతోను[a] మందిరానికి పైకప్పు వేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “వరుసలు” అనే హీబ్రూ పదం ఇక్కడ వరుసగా అమర్చిన దేవదారు పలకలను సూచించవచ్చు.
    reason: నిర్మాణ సంబంధమైన మూలపదం అర్థం పూర్తిగా నిర్ధారితం కాదు; ప్రధాన పాఠంలో అస్పష్టతను నిలుపుతూ సాధ్యమైన భావాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: הַבַּיִת
