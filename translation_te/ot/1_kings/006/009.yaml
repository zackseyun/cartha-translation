- source_word: שְׂדֵרֹת
  choice: వరుసలు
  rationale: మూలపదంలోని ‘వరుసలు/శ్రేణులు’ అనే రూపకల్పనను, అవి ఖచ్చితంగా పలకలే అని నిర్ణయించకుండా నిలుపుతుంది.
- source_word: אֲרָזִים
  choice: దేవదారు
  rationale: నిర్మాణంలో వాడిన cedar కలపకు ప్రామాణికమైన తెలుగు పేరు.
