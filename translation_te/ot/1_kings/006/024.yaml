- from: ఒక కెరూబు రెక్క ఐదు మూరలు, ఆ కెరూబు రెండవ రెక్క ఐదు మూరలు; దాని ఒక రెక్క చివరి నుండి మరొక రెక్క చివరి వరకు పది మూరలు.[a]
  to: కెరూబు యొక్క ఒక రెక్క ఐదు మూరలు, కెరూబు యొక్క రెండవ రెక్క ఐదు మూరలు; దాని రెక్కల ఒక అంచు నుండి మరొక అంచు వరకు పది మూరలు.[a]
