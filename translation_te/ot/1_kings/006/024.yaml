  register: ఆధునిక ప్రామాణిక తెలుగులో, దేవాలయ నిర్మాణ వివరణకు తగిన గౌరవప్రదమైన సరళ శైలి వాడబడింది. ‘కెరూబు’ అనే బైబిలు పదం నిలిపి, కొలతకు సాధారణ బైబిలు తెలుగు పదమైన ‘మూర’ ఉపయోగించబడింది.
