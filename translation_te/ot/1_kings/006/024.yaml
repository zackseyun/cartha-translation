source:
  edition: WLC
  text: וְ/חָמֵ֣שׁ אַמּ֗וֹת כְּנַ֤ף הַ/כְּרוּב֙ הָֽ/אֶחָ֔ת וְ/חָמֵ֣שׁ אַמּ֔וֹת כְּנַ֥ף הַ/כְּר֖וּב הַ/שֵּׁנִ֑ית עֶ֣שֶׂר אַמּ֔וֹת מִ/קְצ֥וֹת כְּנָפָ֖י/ו וְ/עַד קְצ֥וֹת כְּנָפָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/024.yaml
  text: And five cubits was the one wing of the cherub[a], and five cubits the second wing of the cherub; ten cubits from the end of its wings to the end of its wings.
translation:
  language: te
  text: కెరూబు యొక్క ఒక రెక్క ఐదు మూరలు, కెరూబు యొక్క రెండవ రెక్క ఐదు మూరలు; దాని రెక్కల ఒక అంచు నుండి మరొక అంచు వరకు పది మూరలు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని రెక్కల ఒక కొన నుండి మరొక కొన వరకు,” అంటే రెండు రెక్కల కొనల మధ్య పూర్తి విస్తారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָמֵשׁ אַמּוֹת
  choice: ఐదు మూరలు
  rationale: దేవాలయ నిర్మాణ కొలత సందర్భంలో אַמָּהకు తెలుగులో సంప్రదాయబద్ధంగా, సులభంగా అర్థమయ్యే సమానార్థకం ‘మూర’.
- source_word: כְּנַף
  choice: రెక్క
  rationale: కెరూబు ఆకృతి సందర్భంలో ఈ పదం స్పష్టంగా రెక్కను సూచిస్తుంది.
- source_word: הַכְּרוּב
  choice: కెరూబు
  rationale: ప్రతి చెక్కిన పరలోక జీవి ఆకృతిని సూచించే ఏకవచన నామాన్ని లిప్యంతరీకరించి నిలిపింది.
- source_word: הָאֶחָת
  choice: ఒక
  rationale: హీబ్రూ పాఠం స్పష్టంగా ‘మొదటి’ అని కాక ‘ఒకటి’ అని చెబుతున్నందున ఆ భేదాన్ని నిలిపింది.
- source_word: הַשֵּׁנִית
  choice: రెండవ
  rationale: ‘రెక్క’తో అన్వయించే క్రమసంఖ్యకు నేరమైన అనువాదం.
- source_word: עֶשֶׂר אַמּוֹת
  choice: పది మూరలు
  rationale: రెండు రెక్కల పూర్తి విస్తారాన్ని తెలిపే కొలతను నేరుగా అనువదించింది.
- source_word: מִקְצוֹת ... וְעַד קְצוֹת
  choice: ఒక రెక్క చివరి నుండి మరొక రెక్క చివరి వరకు
  rationale: మూలంలోని ‘చివరి నుండి చివరి వరకు’ అనే విస్తార భావాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది; రెండు రెక్కల కొనల మధ్య పూర్తి విస్తారమే ఉద్దేశమని సందర్భం తెలియజేస్తుంది.
- source_word: כְּנָפָיו
  choice: దాని ... రెక్క
  rationale: హీబ్రూ పురుష ఏకవచన ప్రత్యయం కెరూబు ఆకృతిని సూచిస్తుంది; తెలుగులో ‘దాని’ అనడం సహజంగా ఉండి అనవసరంగా లింగాన్ని ఆరోపించదు.
