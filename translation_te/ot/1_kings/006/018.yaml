  text: וְ/אֶ֤רֶז אֶל הַ/בַּ֨יִת֙ פְּנִ֔ימָה מִקְלַ֣עַת פְּקָעִ֔ים וּ/פְטוּרֵ֖י צִצִּ֑ים הַ/כֹּ֣ל אֶ֔רֶז אֵ֥ין אֶ֖בֶן נִרְאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/018.yaml
  text: The cedar on the inside of the house was carved with gourds and open flowers[a]. Everything was cedar[b]; no stone was visible.
translation:
  language: te
  text: మందిరం లోపలి భాగంలోని దేవదారు చెక్కపై గుమ్మడికాయల ఆకారపు అలంకారాలు[a], వికసించిన పుష్పాలు[b] చెక్కబడి ఉన్నాయి. అంతా దేవదారు చెక్కతోనే ఉంది; రాయి ఏదీ కనిపించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మొగ్గల ఆకారపు అలంకారాలు.’ హీబ్రూ పదం గుండ్రని అలంకార రూపాలను సూచిస్తుంది; ఈ మందిర సందర్భంలో అవి గుమ్మడికాయల ఆకారపు చెక్కడాలు కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పుష్ప వికాసాలు.’ హీబ్రూ పదబంధం చెక్కిన పుష్పాల వికాస రూపాలను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶז
  choice: దేవదారు చెక్క
  rationale: ఈ నామవాచకం దేవదారు కలపను లేదా దానితో చేసిన పలకలను సూచిస్తుంది. తెలుగు పాఠకులకు పదార్థాన్ని స్పష్టంగా తెలియజేయడానికి ‘దేవదారు చెక్క’ అని అనువదించాం.
- source_word: אֶל־הַבַּיִת פְּנִימָה
  choice: మందిరం లోపలి వైపున
  rationale: ఈ పదబంధం మందిరపు అంతర్భాగంలోని ఉపరితలాన్ని సూచిస్తుంది; దేవదారు కేవలం లోపల ఉంచబడిందని కాకుండా లోపలి వైపు తాపడం చేయబడిందనే భావాన్ని ఇస్తుంది.
- source_word: מִקְלַעַת
  choice: చెక్కబడి ఉన్నాయి
  rationale: ఈ పదం చెక్కిన లేదా చెక్కుదలతో చేసిన అలంకార పనిని సూచిస్తుంది. నిర్మాణ అలంకరణ సందర్భంలో ఇది సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: פְּקָעִים
  choice: గుమ్మడికాయ ఆకారపు అలంకారాలు
  rationale: ఆలయ వర్ణనలో ఈ పదం గుండ్రని, బహుశా గుమ్మడికాయ ఆకారపు చెక్కడాలను సూచిస్తుంది. రూపాన్ని స్పష్టంచేస్తూనే దాని అలంకార స్వభావాన్ని తెలియజేస్తుంది.
- source_word: וּפְטוּרֵי צִצִּים
  choice: విచ్చిన పువ్వులు
  rationale: ఈ పదబంధం వికసించిన పుష్పాకార చెక్కడాలను సూచించే అవకాశం ఉంది. ‘విచ్చిన పువ్వులు’ మూలంలోని పుష్ప వికాస భావాన్ని సహజంగా అందిస్తుంది.
- source_word: הַכֹּל אֶרֶז
  choice: అంతా దేవదారు చెక్కతో కప్పబడి ఉంది
  rationale: కనిపించే అంతర్భాగమంతా దేవదారు తాపడంతో కప్పబడిందని తరువాతి వాక్యం స్పష్టం చేస్తుంది. తెలుగులో అపార్థం రాకుండా ఈ భావాన్ని వ్యక్తం చేశాం.
- source_word: אֵין אֶבֶן נִרְאָה
  choice: రాయి ఏదీ కనిపించలేదు
  rationale: మూలంలోని నిషేధాత్మక నిష్క్రియ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; రాతి నిర్మాణం దేవదారు తాపడం వల్ల పూర్తిగా మరుగైందని సూచిస్తుంది.
