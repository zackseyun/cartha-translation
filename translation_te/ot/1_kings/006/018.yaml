translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ఇల్లు’ అనే అక్షరార్థం కంటే సందర్భానుసారంగా ‘మందిరం’ వాడాం. అలంకార రూపాలకు సంబంధించిన హీబ్రూ పదాల అనిశ్చితిని పాదసూచికల్లో నిలిపాం.
