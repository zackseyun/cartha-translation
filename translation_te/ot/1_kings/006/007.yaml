translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గంభీరమైన వచనశైలి నిలిపాం. నిర్మాణ సంబంధ పదాలను అతిగా సాంకేతికంగా చేయకుండా మూలంలోని భావాన్నీ, מַסָּע పదంలోని నిజమైన అనిశ్చితినీ పాదటిప్పణిలో సంరక్షించాం.
