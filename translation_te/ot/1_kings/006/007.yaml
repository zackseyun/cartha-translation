  to: ఆ మందిరం[a] కట్టబడుతున్నప్పుడు, గనిలో ముందుగానే సిద్ధంగా మలచిన రాళ్లతో కట్టబడింది; అది కట్టబడుతున్నప్పుడు సుత్తి, గొడ్డలి, లేదా ఏ ఇనుప పనిముట్టు శబ్దమూ ఆ మందిరంలో వినిపించలేదు.
