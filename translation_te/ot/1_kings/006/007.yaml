  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/בַּ֨יִת֙ בְּ/הִבָּ֣נֹת֔/וֹ אֶֽבֶן שְׁלֵמָ֥ה מַסָּ֖ע נִבְנָ֑ה וּ/מַקָּב֤וֹת וְ/הַ/גַּרְזֶן֙ כָּל כְּלִ֣י בַרְזֶ֔ל לֹֽא נִשְׁמַ֥ע בַּ/בַּ֖יִת בְּ/הִבָּנֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/007.yaml
  text: The house[a], when it was built, was built of finished stone quarried in advance; and no hammer or axe or any iron tool was heard in the house while it was being built.
translation:
  language: te
  text: ఆ మందిరం[a] కట్టబడుతున్నప్పుడు, గనిలో ముందుగానే సిద్ధంగా మలచిన రాళ్లతో కట్టబడింది; అది కట్టబడుతున్నప్పుడు సుత్తి, గొడ్డలి, లేదా ఏ ఇనుప పనిముట్టు శబ్దమూ ఆ మందిరంలో వినిపించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ ఇల్లు.’ ఇక్కడ హీబ్రూ పదం అక్షరార్థంగా ‘ఇల్లు’; సందర్భంలో అది యెహోవా మందిరాన్ని సూచిస్తుంది. ‘గనిలో ముందుగానే సిద్ధంగా మలచిన’ అని అనువదించిన מַסָּע అనే ప్రత్యేక పదం రాళ్లు గనిలోనే సిద్ధం చేయబడ్డాయని లేదా గని నుంచి సిద్ధంగా తీసుకురాబడ్డాయని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: ఆ మందిరం
  rationale: మూలపదానికి అక్షరార్థం ‘ఇల్లు’ అయినా, ఈ సందర్భంలో అది యెహోవా మందిర నిర్మాణాన్ని సూచిస్తుంది. సాధారణ తెలుగు పాఠకునికి సూచ్యం స్పష్టంగా ఉండేందుకు ‘మందిరం’ ఎంచుకున్నాం; మూలంలోని నిర్దిష్ట ఉపపదాన్ని ‘ఆ’ ద్వారా సూచించాం.
- source_word: בְּהִבָּנֹתוֹ
  choice: కట్టబడుతున్నప్పుడు / కట్టబడుతున్న సమయంలో
  rationale: בְּ తో కూడిన infinitive construct నిర్మాణకాలాన్ని సూచిస్తుంది. రెండుసార్లూ ఉన్న కాలార్థాన్ని సహజమైన ఆధునిక తెలుగులో స్వల్ప శైలీ వైవిధ్యంతో వ్యక్తం చేశాం.
- source_word: אֶבֶן שְׁלֵמָה
  choice: సిద్ధం చేసిన రాళ్లు
  rationale: నిర్మాణ సందర్భంలో שְׁלֵמָה రాళ్లు నిర్మాణ స్థలానికి రాకముందే పూర్తిగా తయారుచేయబడ్డాయని సూచిస్తుంది. ‘పూర్తి రాళ్లు’ తెలుగులో అస్పష్టంగా ఉండటంతో ‘సిద్ధం చేసిన రాళ్లు’ సహజంగా భావాన్ని అందిస్తుంది.
- source_word: מַסָּע
  choice: గనిలో
  rationale: ఈ ప్రత్యేక నామవాచకం రాతిగనిని లేదా అక్కడి నుంచి సిద్ధంగా తీసుకురావడాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో ‘గనిలో’ అని ఇచ్చి, పదంలోని అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
- source_word: נִבְנָה
  choice: దాన్ని కట్టారు
  rationale: నిఫాల్ రూపం నిర్మాణం జరిగిన విధానాన్ని తెలుపుతుంది. తెలుగులో వరుసగా రెండు కర్మణి రూపాలు భారంగా ఉండకుండా సహజ వాక్యప్రవాహం కోసం రెండవ భాగాన్ని కర్తృవాచ్యంలో ఇచ్చాం; భావం మారదు.
- source_word: מַקָּבוֹת
  choice: సుత్తి
  rationale: రూపపరంగా బహువచనమైనా, పనిముట్ల వర్గాన్ని సూచించే జాబితాలో తెలుగు ఏకవచన రూపం సహజం.
- source_word: הַגַּרְזֶן
  choice: గొడ్డలి
  rationale: పదానికి సాధారణమైన, నేరమైన తెలుగు సమానం ‘గొడ్డలి’; ‘చెక్కను చెక్కే గొడ్డలి’ వంటి మరింత ప్రత్యేక భావం మూలంలో నిశ్చితం కాదు.
- source_word: כָּל כְּלִי בַרְזֶל
  choice: మరే ఇనుప పనిముట్టు
  rationale: כָּל యొక్క విభజనాత్మక సమగ్రార్థాన్ని ‘మరే ... పనిముట్టు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא נִשְׁמַע
  choice: శబ్దం ... వినిపించలేదు
  rationale: హీబ్రూ కర్మణి ‘వినబడలేదు’ అనే భావాన్ని తెలుగులో సహజంగా ‘శబ్దం వినిపించలేదు’ అని తెలిపాం.
