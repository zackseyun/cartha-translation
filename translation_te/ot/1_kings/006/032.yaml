  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/שְׁתֵּי֮ דַּלְת֣וֹת עֲצֵי שֶׁמֶן֒ וְ/קָלַ֣ע עֲ֠לֵי/הֶם מִקְלְע֨וֹת כְּרוּבִ֧ים וְ/תִמֹר֛וֹת וּ/פְטוּרֵ֥י צִצִּ֖ים וְ/צִפָּ֣ה זָהָ֑ב וַ/יָּ֛רֶד עַל הַ/כְּרוּבִ֥ים וְ/עַל הַ/תִּֽמֹר֖וֹת אֶת הַ/זָּהָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/032.yaml
  text: Also[a], the two doors were of olivewood, and he carved on them engravings of cherubim and palm trees and open flowers, and overlaid them with gold[b]; and he spread the gold over the cherubim and over the palm trees.
translation:
  language: te
  text: ఆ రెండు తలుపులు కూడా ఆలివ్ చెక్కతో చేసినవి. వాటి మీద కెరూబులు, ఖర్జూర చెట్లు, వికసించిన పువ్వుల ఆకృతులను చెక్కాడు[a]; వాటికి బంగారం పొదిగించాడు. కెరూబుల మీద, ఖర్జూర చెట్ల మీద బంగారాన్ని పరచాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కెరూబులు, ఖర్జూర చెట్లు, పుష్పవికాసాల చెక్కిన అలంకార రూపాలు.”
    reason: lexical_alternative
  - marker: b
    text: చివరి ఉపవాక్యంలోని హీబ్రూ క్రియ అక్షరార్థంగా “కిందికి దింపాడు” లేదా “కిందికి పరచాడు” అని ఉంటుంది; చెక్కిన రూపాలపై బంగారాన్ని అమర్చడాన్ని అది వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּלְתוֹת עֲצֵי שֶׁמֶן
  choice: ఒలీవ చెక్కతో చేసిన తలుపులు
  rationale: దַּלְתוֹת అంటే తలుపులు లేదా తలుపు పలకలు; עֲצֵי שֶׁמֶן అనేది ఇక్కడ ఒలీవ చెక్కను సూచించే హీబ్రూ ప్రయోగం. ఆధునిక తెలుగులో పదార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּשְׁתֵּי
  choice: ఆ రెండు ... కూడా
  rationale: వావ్ సంధి ముందటి నిర్మాణ వర్ణనతో ఈ వాక్యాన్ని కలిపి అదనపు అంశాన్ని సూచిస్తుంది; ‘కూడా’ ఆ అనుసంధానాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: וְקָלַע ... מִקְלְעוֹת
  choice: ఆకృతులను చెక్కించి
  rationale: ఆలయ అలంకరణ సందర్భంలో క్రియ, నామవాచకం రెండూ చెక్కిన అలంకార పనిని సూచిస్తాయి. తెలుగులో అనవసర పునరుక్తి లేకుండా భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: כְּרוּבִים
  choice: కెరూబులు
  rationale: ఆలయ చిత్రణలోని ప్రత్యేక పరలోక జీవులకు సంప్రదాయ లిప్యంతరీకరణను నిలుపుతుంది; సాధారణ దేవదూతలు అని మార్చదు.
- source_word: תִמֹרוֹת
  choice: ఖర్జూర చెట్లు
  rationale: ఈ పదం ఆలయ అలంకరణలో ఖర్జూర చెట్ల రూపాలను సూచిస్తుంది; సాధారణ పాఠకులకు ‘ఖర్జూర చెట్లు’ స్పష్టంగా ఉంటుంది.
- source_word: פְּטוּרֵי צִצִּים
  choice: వికసించిన పువ్వులు
  rationale: ఈ పదబంధం పుష్పాలంకరణను, బహుశా విప్పారిన పుష్ప రూపాలను సూచిస్తుంది. నిర్దిష్ట వృక్షజాతిని ఊహించకుండా దృశ్య భావాన్ని అందిస్తుంది.
- source_word: וְצִפָּה זָהָב
  choice: బంగారం పొదిగించాడు
  rationale: צפה అనే క్రియ ఉపరితలాన్ని లోహంతో కప్పడం లేదా పొదగడం అనే భావాన్ని ఇస్తుంది; నిర్మాణ అలంకరణ సందర్భంలో ‘బంగారం పొదిగించాడు’ సహజమైనది.
- source_word: וַיָּרֶד ... אֶת־הַזָּהָב
  choice: బంగారాన్ని పరచాడు
  rationale: ירד సాధారణంగా ‘దిగు’ అని అర్థమిచ్చినా, ఈ అసాధారణ సకర్మక ప్రయోగం చెక్కిన రూపాలపై బంగారాన్ని కిందికి పరచి అమర్చడాన్ని వర్ణిస్తుంది. ‘పరచాడు’ మూలంలోని దిశాత్మక చిత్రాన్ని కొంత నిలుపుతుంది.
- source_word: עַל הַכְּרוּבִים וְעַל הַתִּמֹרוֹת
  choice: కెరూబుల మీద, ఖర్జూర చెట్ల మీద
  rationale: పునరుక్తమైన עַל రెండు రకాల చెక్కిన రూపాలపై బంగారం అమర్చబడిందని ప్రత్యేకంగా నొక్కిచెబుతుంది; తెలుగులో ‘మీద’ను పునరావృతం చేయడం ఆ నిర్మాణాన్ని నిలుపుతుంది.
