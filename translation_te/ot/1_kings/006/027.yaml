source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן אֶת הַ/כְּרוּבִ֜ים בְּ/ת֣וֹךְ הַ/בַּ֣יִת הַ/פְּנִימִ֗י וַֽ/יִּפְרְשׂוּ֮ אֶת כַּנְפֵ֣י הַ/כְּרֻבִים֒ וַ/תִּגַּ֤ע כְּנַף הָֽ/אֶחָד֙ בַּ/קִּ֔יר וּ/כְנַף֙ הַ/כְּר֣וּב הַ/שֵּׁנִ֔י נֹגַ֖עַת בַּ/קִּ֣יר הַ/שֵּׁנִ֑י וְ/כַנְפֵי/הֶם֙ אֶל תּ֣וֹךְ הַ/בַּ֔יִת נֹגְעֹ֖ת כָּנָ֥ף אֶל כָּנָֽף־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/027.yaml
  text: He placed the cherubim inside the inner house[a], and the cherubim spread out their wings, so that the wing of the one touched the wall, and the wing of the second cherub touched the other wall; and their wings toward the middle of the house were touching wing to wing.
translation:
  language: te
  text: అతడు కెరూబులను లోపలి మందిరంలో[a] ఉంచాడు. కెరూబులు తమ రెక్కలను చాచాయి; ఒక దాని రెక్క గోడను తాకింది, రెండవ కెరూబు రెక్క మరొక గోడను తాకింది. మందిరం మధ్యభాగం వైపున్న వాటి రెక్కలు రెక్కతో రెక్క తాకుతూ ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లోపలి పరిశుద్ధస్థలంలో.” హీబ్రూలో అక్షరార్థంగా “లోపలి ఇల్లు” అని ఉంది; ఇది ఆలయంలోని అత్యంత లోపలి భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ఉంచాడు
  rationale: נתן అనే క్రియకు ‘ఇవ్వు/పెట్టు/ఉంచు’ అనే అర్థాలున్నాయి; కెరూబులను నిర్దిష్ట స్థానంలో అమర్చిన ఈ నిర్మాణ సందర్భంలో ‘ఉంచాడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: הַכְּרוּבִים
  choice: కెరూబులు
  rationale: ఆరాధనా సంబంధమైన ఈ పరలోక జీవుల సంప్రదాయ నామాన్ని లిప్యంతరీకరణ రూపంలో నిలుపుతుంది; సాధారణ ‘దూతలు’ వంటి పదంతో భావాన్ని కుదించదు.
- source_word: בְּתוֹךְ הַבַּיִת הַפְּנִימִי
  choice: లోపలి మందిరం మధ్యలో
  rationale: బయిత్ అక్షరార్థంగా ‘ఇల్లు’; ఇక్కడ ఆలయపు అంతర్భాగాన్ని సూచిస్తుంది. ‘లోపలి మందిరం’ మూలరూపానికి దగ్గరగా ఉండగా, בְּתוֹךְ లోని అంతర్భాగం/మధ్య అనే స్థలభావాన్ని ‘మధ్యలో’ వ్యక్తం చేస్తుంది.
- source_word: וַיִּפְרְשׂוּ אֶת כַּנְפֵי הַכְּרֻבִים
  choice: కెరూబులు తమ రెక్కలను చాచాయి
  rationale: హీబ్రూ వ్యాకరణ రూపం ‘వారు కెరూబుల రెక్కలను చాచారు’ అని ఉన్నప్పటికీ, సందర్భంలో కెరూబులే సహజ కర్తలు. తెలుగు వాక్యం ఈ భావాన్ని అస్పష్టత లేకుండా అందిస్తుంది.
- source_word: וַתִּגַּע / נֹגַעַת / נֹגְעֹת
  choice: తాకింది / తాకాయి
  rationale: נגע ప్రత్యక్ష స్పర్శను సూచిస్తుంది. వచనం, లింగం, వాక్యనిర్మాణానికి అనుగుణంగా తెలుగు క్రియారూపాలు మార్చబడ్డాయి.
- source_word: כְּנַף הָאֶחָד
  choice: ఒక కెరూబు రెక్క
  rationale: మూలంలోని ‘ఒకదాని రెక్క’ అనే భావాన్ని సహజ తెలుగులో స్పష్టపరుస్తుంది; మూలంలో లేని ‘మొదటి’ అనే క్రమసంఖ్యను చేర్చదు.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: రెండవ కెరూబు
  rationale: హీబ్రూలోని క్రమసంఖ్యను నేరుగా నిలుపుతుంది.
- source_word: הַקִּיר הַשֵּׁנִי
  choice: అవతలి గోడ
  rationale: అక్షరార్థమైన ‘రెండవ గోడ’ కంటే, ఎదురెదురు రెండు గోడల స్థలవివరణలో ‘అవతలి గోడ’ సహజంగా ఉండి అదే భావాన్ని తెలియజేస్తుంది.
- source_word: וְכַנְפֵיהֶם אֶל תּוֹךְ הַבַּיִת
  choice: మందిరం మధ్యవైపు ఉన్న వాటి రెక్కలు
  rationale: תּוֹךְ ఇక్కడ లోపలి మధ్యభాగాన్ని సూచిస్తుంది; రెక్కలు మధ్యలో కలిసిన దృశ్యాన్ని ఈ రూపం సహజంగా స్పష్టం చేస్తుంది.
- source_word: נֹגְעֹת כָּנָף אֶל כָּנָף
  choice: ఒకదానినొకటి తాకాయి
  rationale: అక్షరార్థం ‘రెక్క రెక్కను తాకుతూ’; తెలుగులో పునరుక్తి భారాన్ని తగ్గిస్తూ రెండు రెక్కల పరస్పర స్పర్శను ఖచ్చితంగా తెలియజేస్తుంది.
