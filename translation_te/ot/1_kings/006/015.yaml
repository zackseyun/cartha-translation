  text: וַ/יִּבֶן֩ אֶת קִיר֨וֹת הַ/בַּ֤יִת מִ/בַּ֨יְתָ/ה֙ בְּ/צַלְע֣וֹת אֲרָזִ֔ים מִ/קַּרְקַ֤ע הַ/בַּ֨יִת֙ עַד קִיר֣וֹת הַ/סִּפֻּ֔ן צִפָּ֥ה עֵ֖ץ מִ/בָּ֑יִת וַ/יְצַ֛ף אֶת קַרְקַ֥ע הַ/בַּ֖יִת בְּ/צַלְע֥וֹת בְּרוֹשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/015.yaml
  text: He built the walls of the house on the inside with cedar boards[a]; from the floor of the house to the walls of the ceiling he covered them with wood on the inside[b], and he overlaid the floor of the house with boards of cypress.
translation:
  language: te
  text: అతడు మందిరం లోపలి గోడలను దేవదారు పలకలతో నిర్మించాడు. మందిరపు నేల నుండి పైకప్పు లోపలి భాగాల వరకు వాటిని లోపల చెక్కతో కప్పాడు.[a] మందిరపు నేలను సైప్రస్ పలకలతో కప్పాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “పైకప్పు గోడల వరకు” అని ఉంది. ఇది బహుశా లోపలి పైకప్పు లేదా దాని లోపలి పొర వరకు అని సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: “సైప్రస్” అని అనువదించిన హీబ్రూ వృక్షనామం ఏ శంకువృక్షాన్ని సూచిస్తుందో ఖచ్చితంగా తెలియదు; దీనిని జూనిపర్ లేదా సంప్రదాయంగా సరళవృక్షం అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן אֶת קִירוֹת הַבַּיִת מִבַּיְתָה
  choice: అతడు మందిరపు గోడల లోపలి వైపున ... అమర్చాడు
  rationale: בנה సాధారణంగా ‘కట్టాడు’ అని అర్థమైనా, ఇక్కడ ఇప్పటికే ఉన్న లోపలి గోడలకు చెక్క పలకలు అమర్చడం సందర్భం; అందువల్ల సహజమైన నిర్మాణ భాషను వాడాం. సందర్భంలో הַבַּיִת దేవాలయాన్ని సూచిస్తున్నందున ‘మందిరం’ అని అనువదించాం.
- source_word: בְּצַלְעוֹת אֲרָזִים
  choice: దేవదారు పలకలు
  rationale: צלעות అనే పదానికి ప్రక్క భాగాలు లేదా పలకలు అనే అర్థాలు ఉండవచ్చు; ఈ నిర్మాణ సందర్భంలో గోడలకు వేసే పలకలు సహజం. אֲרָזִים ను ‘దేవదారు’గా అనువదించాం.
- source_word: מִקַּרְקַע הַבַּיִת עַד קִירוֹת הַסִּפֻּן
  choice: మందిరపు నేల మొదలుకొని పైకప్పు వరకు
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా అసాధారణమైన ‘పైకప్పు గోడల వరకు’ అని ఉంది; ఉద్దేశించిన లోపలి ఎగువ హద్దును సహజమైన తెలుగులో ‘పైకప్పు వరకు’గా వ్యక్తం చేశాం.
- source_word: צִפָּה עֵץ מִבָּיִת
  choice: లోపలంతా చెక్కతో కప్పాడు
  rationale: צפה ఇక్కడ ఉపరితలాన్ని మరొక పదార్థంతో కప్పడాన్ని సూచిస్తుంది. ముందు పేర్కొన్న నేలనుంచి పైకప్పు వరకున్న లోపలి భాగమే అంతర్నిహిత కర్మ.
- source_word: וַיְצַף אֶת קַרְקַע הַבַּיִת בְּצַלְעוֹת בְּרוֹשִׁים
  choice: మందిరపు నేలను సరళవృక్షపు పలకలతో కప్పాడు
  rationale: קַרְקַע భవన సందర్భంలో ‘నేల’. צלעות ఇక్కడ పలకలు. ברורשים ఏ శంకువృక్షాన్ని సూచిస్తుందో అనిశ్చితం కాబట్టి ప్రధాన పాఠ్యంలో సుపరిచితమైన ‘సరళవృక్షం’ను ఉంచి ప్రత్యామ్నాయాలను పాదసూచికలో తెలిపాం.
