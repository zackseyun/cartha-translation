translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన నిర్మాణ పదజాలం వాడబడింది. హీబ్రూలోని అసాధారణ ‘పైకప్పు గోడలు’ అనే నిర్మాణాన్ని భావస్పష్టత కోసం ‘పైకప్పు వరకు’గా ఇచ్చాం; వృక్షనామంలోని నిజమైన అనిశ్చితిని పాదసూచికలో నిలిపాం.
