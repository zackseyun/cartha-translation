- from: అతడు మందిరపు గోడల లోపలి వైపున దేవదారు పలకలు అమర్చాడు. మందిరపు నేల మొదలుకొని పైకప్పు వరకు లోపలంతా చెక్కతో కప్పాడు; మందిరపు నేలను సరళవృక్షపు పలకలతో కప్పాడు.[a]
  to: అతడు మందిరం లోపలి గోడలను దేవదారు పలకలతో నిర్మించాడు. మందిరపు నేల నుండి పైకప్పు లోపలి భాగాల వరకు వాటిని లోపల చెక్కతో కప్పాడు.[a] మందిరపు నేలను సైప్రస్ పలకలతో కప్పాడు.[b]
