lexical_decisions:
- source_word: וַיְצַף
  choice: పూత పూయించాడు
  rationale: ఆలయ నిర్మాణ సందర్భంలో צפה అనే క్రియ ఒక వస్తువుపై, ముఖ్యంగా లోహపు పొరను కప్పించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘బంగారు పూత పూయించాడు’ సహజంగా, స్పష్టంగా ఈ భావాన్ని తెలియజేస్తుంది.
- source_word: אֶת
  choice: ప్రత్యక్ష కర్మను తెలుగు విభక్తి ‘-లకు’ ద్వారా వ్యక్తపరచడం
  rationale: హీబ్రూ אֶת నిర్దిష్ట ప్రత్యక్ష కర్మను సూచిస్తుంది; దానికి ప్రత్యేక తెలుగు పదం అవసరం లేదు. ‘కెరూబులకు ... పూయించాడు’ అనే నిర్మాణంలో కర్మసంబంధం సహజంగా వ్యక్తమవుతుంది.
- source_word: הַכְּרוּבִים
  choice: కెరూబులకు
  rationale: ‘కెరూబులు’ అనే రూపం బైబిలు ఆలయ చిత్రణలోని ప్రత్యేక పరలోక జీవుల పేరును గౌరవప్రదంగా నిలుపుతుంది; ఇక్కడ విభక్తి రూపం ‘కెరూబులకు’ వాడబడింది.
- source_word: זָהָב
  choice: బంగారు
  rationale: ఈ నామవాచకం పూతకు ఉపయోగించిన పదార్థమైన బంగారాన్ని సూచిస్తుంది. ‘బంగారు పూత’ అనేది తెలుగులో సహజమైన పదబంధం.
