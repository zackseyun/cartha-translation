  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, ఆలయ నిర్మాణ సందర్భానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని సంక్షిప్త వాక్య నిర్మాణాన్ని నిలుపుతూ, తెలుగు సహజత్వం కోసం causative రూపాన్ని ఎంచుకున్నాం.
