source:
  edition: WLC
  text: וְ/הַ/בַּ֗יִת אֲשֶׁ֨ר בָּנָ֜ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ לַֽ/יהוָ֔ה שִׁשִּֽׁים אַמָּ֥ה אָרְכּ֖/וֹ וְ/עֶשְׂרִ֤ים רָחְבּ֑/וֹ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה קוֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/002.yaml
  text: The house that King Solomon built for Yahweh was sixty cubits long[a], twenty cubits wide[c][b], and thirty cubits high.
translation:
  language: te
  text: సొలొమోను రాజు యాహ్వే కోసం కట్టిన మందిరం పొడవు అరవై మూరలు, వెడల్పు ఇరవై మూరలు[a], ఎత్తు ముప్పై మూరలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ఈ మధ్య కొలత వద్ద ‘మూరలు’ అనే ప్రమాణపదం మళ్లీ లేదు; ముందున్న కొలతనుబట్టి అది అర్థమవుతుంది.
    reason: మూలపాఠంలో అంతర్లీనంగా ఉన్న కొలమానాన్ని ప్రధాన పాఠంలో స్పష్టత కోసం సరఫరా చేసినట్టు తెలియజేయడం.
lexical_decisions:
- source_word: וְהַבַּיִת
  choice: మందిరం
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’; అయితే ఇక్కడ సొలొమోను కట్టించిన యెహోవా ఆలయ భవనాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘మందిరం’ సందర్భాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది. ప్రారంభ וְ కు ప్రత్యేకంగా ‘మరియు’ చేర్చకపోవడం తెలుగు కథన ప్రవాహానికి అనుకూలం.
- source_word: אֲשֶׁר בָּנָה הַמֶּלֶךְ שְׁלֹמֹה
  choice: సొలొమోను రాజు ... కట్టించిన
  rationale: రాజు స్వయంగా నిర్మాణ శ్రమ చేశాడనే భావం రాకుండా, అతని ఆధ్వర్యంలో నిర్మించబడిందని సహజ తెలుగు ప్రయోగమైన ‘కట్టించిన’ తెలియజేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవా కోసం
  rationale: לְ ఇక్కడ ఉద్దేశం లేదా అంకితాన్ని సూచిస్తుంది. יהוה అనే దైవనామాన్ని తెలుగు బైబిల్ పాఠకులకు సుపరిచితమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: שִׁשִּׁים אַמָּה אָרְכּוֹ
  choice: అరవై మూరల పొడవు
  rationale: అమ్మా అనే ప్రాచీన కొలమానాన్ని తెలుగులో సాంప్రదాయకంగా ‘మూర’ అంటారు; స్వామ్యప్రత్యయంతో ఉన్న ‘దాని పొడవు’ భావాన్ని సహజమైన కొలత నిర్మాణంలో తెలిపాం.
- source_word: וְעֶשְׂרִים רָחְבּוֹ
  choice: ఇరవై మూరల వెడల్పు[a]
  rationale: హీబ్రూలో ఈ భాగంలో ‘మూర’ మళ్లీ రాకపోయినా, ముందు మరియు తరువాత ఉన్న కొలతల వల్ల అదే ప్రమాణం అర్థమవుతుంది. తెలుగులో స్పష్టత కోసం దాన్ని సరఫరా చేశాం; పాదటిప్పణిలో మూల నిర్మాణాన్ని తెలియజేశాం.
- source_word: וּשְׁלֹשִׁים אַמָּה קוֹמָתוֹ
  choice: ముప్పై మూరల ఎత్తు
  rationale: קוֹמָה ఇక్కడ భవనం యొక్క ఎత్తును సూచిస్తుంది; కొలతను సహజ తెలుగు నామవాచక నిర్మాణంలో అందించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా పేరుగానే ఉంచాం. ఆధునిక ప్రామాణిక తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ప్రధాన పాఠంలో వాడి, సాధ్యమైన మరో లిప్యంతరీకరణను నిర్ణయాత్మకంగా రుద్దలేదు.
- issue: בַּיִת ను ‘ఇల్లు’గా లేదా ‘మందిరం’గా అనువదించడం
  choice: మందిరం
  alternative: ఇల్లు
  rationale: ‘ఇల్లు’ మూలపదానికి దగ్గరగా ఉండి దేవుని నివాసస్థల భావాన్ని నిలుపుతుంది; అయినా ఈ నిర్మాణ కొలతల సందర్భంలో ‘మందిరం’ సాధారణ తెలుగు పాఠకునికి ఉద్దేశిత భవనాన్ని వెంటనే స్పష్టం చేస్తుంది, ప్రత్యేక మతశాఖ భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన చారిత్రక-కథన శైలి. కొలతల జాబితాలో సమాంతర నిర్మాణాన్ని కాపాడాం.
