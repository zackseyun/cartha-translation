translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన నిర్మాణ వివరణను ఉపయోగించాం. అరుదైన వాస్తుశాస్త్ర పదానికి బదులుగా సామాన్య పాఠకులకు అర్థమయ్యే ‘ప్రధాన మందిరం’ను ఎంచుకున్నాం; ‘మూర’ను సాంప్రదాయ బైబిలు కొలమాన పదంగా నిలిపాం.
