source:
  edition: WLC
  text: וְ/אַרְבָּעִ֥ים בָּ/אַמָּ֖ה הָיָ֣ה הַ/בָּ֑יִת ה֖וּא הַ/הֵיכָ֥ל לִ/פְנָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/017.yaml
  text: And the house[a], that is, the nave before the inner sanctuary, was forty cubits long.
translation:
  language: te
  text: లోపలి పవిత్రస్థలం ముందున్న ఆలయ భవనం[a], అంటే ప్రధాన గది, నలభై మూరల పొడవు ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాని ముందు ఉన్న ప్రధాన గది.’ హీబ్రూ పాఠం ‘భవనం’ను הֵיכָל అని మరింత నిర్దిష్టంగా పేర్కొంటుంది; ఇది లోపలి పవిత్రస్థలం ముందున్న ప్రధాన గది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעִים
  choice: నలభై
  rationale: సంఖ్యను నేరుగా అనువదించాం; వాక్యారంభంలోని సంధికారకాన్ని తెలుగులో సహజమైన వాక్యప్రవాహం కోసం ప్రత్యేకంగా అనువదించలేదు.
- source_word: בָּ/אַמָּה
  choice: మూరల పొడవు
  rationale: אַמָּה ప్రాచీన రేఖీయ కొలమానమైన ‘మూర’; కొలత ఏ దిశలో ఉందో సందర్భానుసారం స్పష్టం చేయడానికి ‘పొడవు’ చేర్చాం.
- source_word: הָיָה
  choice: ఉంది
  rationale: నిర్మాణ కొలతను తెలిపే సాధారణ అస్తిత్వ క్రియగా అనువదించాం.
- source_word: הַ/בָּיִת
  choice: భవనం
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఇక్కడ ఆలయ నిర్మాణాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘భవనం’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: ה֖וּא
  choice: అంటే
  rationale: సర్వనామం ఇక్కడ ముందున్న ‘భవనం’ను మరింత నిర్దిష్టంగా గుర్తించే వివరణాత్మక సమానాధికార ప్రయోగంగా ఉంది.
- source_word: הַ/הֵיכָל
  choice: ప్రధాన మందిరం
  rationale: הֵיכָל ఇక్కడ లోపలి పవిత్రస్థలానికి వెలుపల ఉన్న ఆలయపు ప్రధాన గదిని సూచిస్తుంది; ‘ప్రధాన మందిరం’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, తరువాతి సాంకేతిక మతపదజాలాన్ని అనవసరంగా దిగుమతి చేయదు.
- source_word: לִ/פְנָֽ/י
  choice: లోపలి పవిత్రస్థలం ముందున్న
  rationale: మూలంలోని ‘ముందు’ అనే స్థానసంబంధాన్ని నిలుపుతూ, మునుపటి వచనంలో పేర్కొన్న లోపలి పవిత్రస్థలాన్ని సందర్భం ఆధారంగా స్పష్టం చేశాం.
