  text: וּ/שְׁתֵּ֥י דַלְת֖וֹת עֲצֵ֣י בְרוֹשִׁ֑ים שְׁנֵ֨י צְלָעִ֜ים הַ/דֶּ֤לֶת הָֽ/אַחַת֙ גְּלִילִ֔ים וּ/שְׁנֵ֧י קְלָעִ֛ים הַ/דֶּ֥לֶת הַ/שֵּׁנִ֖ית גְּלִילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/034.yaml
  text: and two doors of cypress wood[a]; the one door had two folding leaves[b], and the second door had two folding leaves.
translation:
  language: te
  text: సైప్రస్ చెక్కతో[a] రెండు తలుపులు చేశాడు. ఒక తలుపుకు మడతపడే రెండు పలకలు[b], రెండవ తలుపుకు మడతపడే రెండు పలకలు ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సాంప్రదాయంగా, “దేవదారు చెక్కతో.” హీబ్రూ బְּרוֹשׁ బహుశా సైప్రస్‌ను లేదా దానికి సమీపమైన శంఖాకార వృక్షాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తిరిగే రెండు పక్క పలకలు.” ఇక్కడి హీబ్రూ వాస్తుశిల్ప పదాలు అరుదైనవి; సాధారణంగా ఇవి మడతపడే తలుపు పలకలను సూచిస్తాయని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַלְתוֹת
  choice: తలుపులు
  rationale: ఇక్కడ రెండు తలుపుల నిర్మాణాలను సూచించే బహువచనం; ఆధునిక తెలుగులో సహజమైన పదం.
- source_word: עֲצֵי בְרוֹשִׁים
  choice: దేవదారు చెక్కతో
  rationale: בְּרוֹשׁ ఏ శంఖాకార వృక్షాన్ని సూచిస్తుందో నిశ్చితం కాదు. తెలుగు బైబిలు పాఠకులకు పరిచితమైన ‘దేవదారు’ను ప్రధాన పాఠంలో ఉంచి, ‘సైప్రస్’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: צְלָעִים
  choice: పలకలు
  rationale: సాధారణంగా ‘పక్కలు/ప్రక్క భాగాలు’ అనే అర్థమున్నా, ఈ అరుదైన వాస్తుశిల్ప సందర్భంలో తలుపు భాగాలను సూచిస్తుంది; ‘పలకలు’ సహజంగా అర్థమవుతుంది.
- source_word: גְּלִילִים
  choice: మడతపడే
  rationale: ఈ పదం తిరగడం లేదా చుట్టుకోవడం అనే భావాన్ని సూచించవచ్చు; సందర్భంలో కదిలే తలుపు పలకల నిర్మాణాన్ని ‘మడతపడే’ అని కార్యాత్మకంగా తెలిపాం, కానీ అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: קְלָעִים
  choice: మడతపడే పలకలు
  rationale: అరుదైన పదం; ముందరి సమాంతర పదబంధంతో ఒకే తలుపు నిర్మాణాన్ని సూచిస్తున్నందున సమానంగా అనువదించాం.
- source_word: הַדֶּלֶת הָאַחַת
  choice: ఒక తలుపు
  rationale: రెండు తలుపుల్లో ఒకదానిని తదుపరి ‘రెండవ తలుపు’తో వ్యత్యాసంగా సూచిస్తుంది.
- source_word: הַדֶּלֶת הַשֵּׁנִית
  choice: రెండవ తలుపు
  rationale: హీబ్రూ క్రమసంఖ్యను నేరుగా, స్పష్టంగా ప్రతిబింబిస్తుంది.
