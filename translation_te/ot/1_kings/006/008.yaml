source:
  edition: WLC
  text: פֶּ֗תַח הַ/צֵּלָע֙ הַ/תִּ֣יכֹנָ֔ה אֶל כֶּ֥תֶף הַ/בַּ֖יִת הַ/יְמָנִ֑ית וּ/בְ/לוּלִּ֗ים יַֽעֲלוּ֙ עַל הַ/תִּ֣יכֹנָ֔ה וּ/מִן הַ/תִּֽיכֹנָ֖ה אֶל הַ/שְּׁלִשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/008.yaml
  text: The entrance to the middle side chamber was on the right side of the house[a], and by winding stairs they went up to the middle story[b], and from the middle to the third.
translation:
  language: te
  text: మధ్యనున్న పక్కగది ప్రవేశద్వారం మందిరం కుడివైపున ఉండేది. మెలికలు తిరిగిన మెట్ల ద్వారా[a] మధ్య అంతస్తుకు ఎక్కేవారు; మధ్య అంతస్తు నుండి మూడవ అంతస్తుకు[b] ఎక్కేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సర్పిల మెట్లు.” ఈ హెబ్రీ పదం మెలికలు తిరిగిన లేదా సర్పిల మెట్లను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీలో అక్షరార్థంగా, “మధ్యదాని నుండి మూడవదానికి”; అంటే మధ్య అంతస్తు నుండి మూడవ అంతస్తుకు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּתַח
  choice: ప్రవేశద్వారం
  rationale: ఇది లోపలికి వెళ్లే తెరువు లేదా ద్వారాన్ని సూచిస్తుంది; నిర్మాణ వివరణలో ‘ప్రవేశద్వారం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הַצֵּלָע הַתִּיכֹנָה
  choice: మధ్య పక్కగది
  rationale: ఆలయ నిర్మాణ సందర్భంలో צֵלָע అనేది అక్షరార్థమైన ‘పక్కటెముక’ కాకుండా పక్కన ఉన్న గది లేదా నిర్మాణ భాగాన్ని సూచిస్తుంది. హెబ్రీలోని ఏకవచనాన్ని నిలుపుకున్నాం.
- source_word: אֶל כֶּתֶף הַבַּיִת הַיְמָנִית
  choice: మందిరం కుడివైపున
  rationale: כֶּתֶף అక్షరార్థంగా ‘భుజం’ అయినా ఇక్కడ భవనం పక్కను సూచిస్తుంది. יְמָנִית ను సందర్భంలో ఊహించి ‘దక్షిణం’గా మార్చకుండా ‘కుడివైపు’గా అనువదించాం.
- source_word: וּבְלוּלִּים
  choice: మెలికలు తిరిగిన మెట్లదారి గుండా
  rationale: అరుదైన ఈ పదం సాధారణంగా మెలికలుగల లేదా సర్పిల మెట్లను సూచిస్తుందని అర్థం చేసుకుంటారు. తెలుగు పాఠకులకు నిర్మాణ స్వరూపం స్పష్టమయ్యేలా ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: יַעֲלוּ
  choice: ఎక్కేవారు
  rationale: మూడవ పురుష బహువచన క్రియను భవనంలో పైకి వెళ్లే సాధారణ విధానాన్ని తెలిపే సహజ తెలుగు రూపంలో ఇచ్చాం.
- source_word: עַל הַתִּיכֹנָה
  choice: మధ్య అంతస్తుకు
  rationale: అంతస్తుల వరుసను వర్ణిస్తున్నందున ఇక్కడ ‘మధ్య గది’ కంటే ‘మధ్య అంతస్తు’ నిర్మాణార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּמִן הַתִּיכֹנָה אֶל הַשְּׁלִשִׁים
  choice: మధ్య అంతస్తు నుండి మూడవ అంతస్తుకు
  rationale: హెబ్రీలో ‘మధ్యదాని నుండి మూడవదానికి’ అని సంక్షిప్తంగా ఉన్న భావాన్ని తెలుగులో సందిగ్ధత లేకుండా చెప్పేందుకు ‘అంతస్తు’ను రెండుచోట్లా స్పష్టంగా చేర్చాం.
