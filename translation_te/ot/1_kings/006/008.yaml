translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన నిర్మాణ వర్ణనను ఉపయోగించాం. ‘మందిరం’ సందర్భానుసారంగా הַבַּיִת ను సూచిస్తుంది. అరుదైన మెట్ల పదంలోని అనిశ్చితిని పాదటిప్పణిలో నిలుపుకున్నాం.
