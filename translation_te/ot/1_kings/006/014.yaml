  text: So Solomon built the house and finished it[a].
translation:
  language: te
  text: సొలొమోను ఆ మందిరాన్ని కట్టి, దానిని పూర్తి చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘ఆ ఇంటిని’ అని ఉంది; ఈ సందర్భంలో అది ఆలయాన్ని సూచించే సాధారణ పదప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: కట్టి
  rationale: בנה అనే క్రియ యొక్క ఖాల్ వయ్యిక్టోల్ రూపం కథన క్రమంలో జరిగిన గత కార్యాన్ని సూచిస్తుంది. నిర్మాణ సందర్భంలో ‘కట్టి’ సహజమైన, స్పష్టమైన తెలుగు ప్రయోగం.
- source_word: שְׁלֹמֹה
  choice: సొలొమోను
  rationale: హీబ్రూ వ్యక్తిపేరు שְׁלֹמֹהకు తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: הַבַּיִת
  choice: ఆ మందిరాన్ని
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’; అయితే ఈ అధ్యాయ సందర్భంలో అది యెహోవా ఆలయ భవనాన్ని సూచిస్తుంది. తెలుగులో ‘ఆ ఇల్లు’ అనడం సాధారణ పాఠకునికి తప్పుదారి పట్టించవచ్చు కాబట్టి, సందర్భార్థాన్ని స్పష్టంగా తెలిపే ‘ఆ మందిరాన్ని’ ఎంచుకుని అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: וַיְכַלֵּהוּ
  choice: దాన్ని పూర్తి చేశాడు
  rationale: כלה ధాతువు పీయేల్ రూపంలో, మూడవ పురుష ఏకవచన కర్మప్రత్యయంతో, ముందున్న మందిరాన్ని పూర్తిచేయడాన్ని సూచిస్తుంది. ‘దాన్ని పూర్తి చేశాడు’ ఆ ప్రత్యక్ష కర్మసంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలిని ఉపయోగించాం. ‘మందిరం’ అనే పదం సందర్భంలోని ఆలయ భవనాన్ని గౌరవప్రదంగా, సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; మూలంలోని అక్షరార్థాన్ని పాదసూచికలో భద్రపరిచాం.
