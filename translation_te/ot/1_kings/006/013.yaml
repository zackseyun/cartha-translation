source:
  edition: WLC
  text: וְ/שָׁ֣כַנְתִּ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֥א אֶעֱזֹ֖ב אֶת עַמִּ֥/י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/013.yaml
  text: And I will dwell among the children of Israel[a], and I will not forsake my people Israel.
translation:
  language: te
  text: నేను ఇశ్రాయేలు సంతతి[a] మధ్య నివసిస్తాను; నా ప్రజలైన ఇశ్రాయేలును విడిచిపెట్టను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలీయులు.’ హీబ్రూలో అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  choice: నేను ... నివసిస్తాను
  rationale: שׁכן దేవుడు తన ప్రజల మధ్య ఉండే నివాససాన్నిధ్యాన్ని సూచిస్తుంది. ‘నివసిస్తాను’ ఆధునిక తెలుగులో సహజంగా ఉండి, ఆ నిబంధనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: בְּתוֹךְ
  choice: మధ్య
  rationale: బహువచన ప్రజాసమూహంతో వచ్చినప్పుడు ‘మధ్య’ అనేది సమాజంలో దేవుని సాన్నిధ్యాన్ని సహజంగా వ్యక్తపరుస్తుంది; దానిని దేవాలయానికే పరిమితం చేయదు.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సంతతి
  rationale: హీబ్రూ పదబంధంలోని వంశసంబంధ ప్రజా గుర్తింపును నిలుపుతూ, పురుషులకు మాత్రమే పరిమితమనే అపార్థం రాకుండా చేస్తుంది.
- source_word: וְלֹא אֶעֱזֹב
  choice: విడిచిపెట్టను
  rationale: עזב లోని విడిచిపెట్టడం లేదా పరిత్యజించడం అనే సంబంధాత్మక, నిబంధనాత్మక బలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עַמִּי
  choice: నా ప్రజలైన
  rationale: ‘నా ప్రజలు’ అనే నిబంధనాత్మక స్వామ్యసంబంధాన్ని స్పష్టంగా నిలుపుతుంది; తెలుగు వాక్యంలో ఇశ్రాయేలుతో సహజంగా అనుసంధానించడానికి ‘ప్రజలైన’ వాడబడింది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: సరైన నామానికి ప్రామాణిక తెలుగు బైబిలు రూపాన్ని ఉపయోగించింది.
theological_decisions:
- issue: దేవాలయ సందర్భంలో దేవుని నివాససాన్నిధ్యం
  choice: ‘ఇశ్రాయేలు సంతతి మధ్య నివసిస్తాను’ అని అనువదించి, దేవుడు తన ప్రజల మధ్య ఉండే నిబంధనాత్మక సాన్నిధ్యాన్ని వ్యక్తపరచడం.
  alternative: ‘ఇశ్రాయేలీయుల మధ్య ఉంటాను’ లేదా ‘ఇశ్రాయేలు సంతతి నడుమ నివాసముంటాను.’
  rationale: ఈ వచనం దేవాలయ సందర్భంలో ఉన్నప్పటికీ, హీబ్రూ మాటలు దేవుని సాన్నిధ్యాన్ని కేవలం ఒక భవనంలో స్థలీకరించకుండా ప్రజల మధ్య నివాసంగా చెబుతాయి. అనువాదం ఆ ఉద్దేశపూర్వక ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరమైన నిబంధనాత్మక శైలిని నిలుపుతూ రూపొందించబడింది. సెమీకోలన్ రెండు సమాంతర దైవ వాగ్దానాలను అనుసంధానిస్తుంది.
