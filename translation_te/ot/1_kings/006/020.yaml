id: 1KI.6.20
reference: 1 Kings 6:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לִ/פְנֵ֣י הַ/דְּבִ֡יר עֶשְׂרִים֩ אַמָּ֨ה אֹ֜רֶךְ וְ/עֶשְׂרִ֧ים אַמָּ֣ה רֹ֗חַב וְ/עֶשְׂרִ֤ים אַמָּה֙ קֽוֹמָת֔/וֹ וַ/יְצַפֵּ֖/הוּ זָהָ֣ב סָג֑וּר וַ/יְצַ֥ף מִזְבֵּ֖חַ אָֽרֶז׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/020.yaml
  text: In front of the inner sanctuary was twenty cubits in length[a], twenty cubits in width, and twenty cubits in its height. He overlaid it with pure gold[b], and he overlaid the cedar altar.
translation:
  language: te
  text: అంతర్గర్భాలయం పొడవు ఇరవై మూరలు, వెడల్పు ఇరవై మూరలు, ఎత్తు ఇరవై మూరలు.[a] అతడు దానికి మేలిమి బంగారం తాపడం చేశాడు; దేవదారు చెక్కతో చేసిన బలిపీఠానికి కూడా తాపడం చేశాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా ఉంది; అక్షరార్థంగా, “అంతర్గర్భాలయం ముందు, పొడవు ఇరవై మూరలు…” అని మొదలవుతుంది.
    reason: హీబ్రూ వాక్యనిర్మాణంలోని నిజమైన అస్పష్టతను తెలియజేయడం.
  - marker: b
    text: “మేలిమి బంగారం” అనే హీబ్రూ పదబంధాన్ని “శుద్ధ బంగారం” అని కూడా అనువదించవచ్చు. చివరి మాటలను “దేవదారు బలిపీఠానికి తాపడం చేశాడు” అని కూడా అనువదించవచ్చు.
    reason: బంగారం నాణ్యతను తెలిపే పదబంధానికి, దేవదారు బలిపీఠాన్ని తెలిపే సంక్షిప్త నిర్మాణానికి ఉన్న అనువాద ప్రత్యామ్నాయాలను నమోదు చేయడం.
lexical_decisions:
- source_word: וְלִפְנֵי הַדְּבִיר
  choice: అంతర్గర్భాలయం
  rationale: దేవాలయంలోని అత్యంత లోపలి పరిశుద్ధ గదిని సూచించే הַדְּבִיר ను సహజమైన ఆధునిక తెలుగులో ‘అంతర్గర్భాలయం’గా అనువదించాం. לִפְנֵי తో కూడిన హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా, అస్పష్టంగా ఉంది; సందర్భం ఆ గది కొలతలను ఇస్తున్నందున ప్రధాన పాఠంలో దానినే నేరుగా తెలిపి, అక్షరార్థ అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: עֶשְׂרִים אַמָּה ... אֹרֶךְ / רֹחַב / קוֹמָתוֹ
  choice: పొడవు ఇరవై మూరలు, వెడల్పు ఇరవై మూరలు, ఎత్తు ఇరవై మూరలు
  rationale: మూలంలోని మూడు సమాన కొలతలను స్పష్టంగా నిలిపాం. אַמָּה కు తెలుగు బైబిలు వాడుకలో అర్థమయ్యే సంప్రదాయ కొలమాన పదం ‘మూర’ను వాడి, ఆధునిక ప్రమాణంలోకి మార్చలేదు.
- source_word: וַיְצַפֵּהוּ
  choice: దానికి ... తాపడం చేయించాడు
  rationale: צפה ఇక్కడ ఒక ఉపరితలాన్ని బంగారంతో కప్పడం లేదా పూత వేయడాన్ని సూచిస్తుంది. ఆలయ నిర్మాణ సందర్భంలో ‘తాపడం చేయించాడు’ సహజంగానూ ఖచ్చితంగానూ ఉంది.
- source_word: זָהָב סָגוּר
  choice: మేలిమి బంగారం
  rationale: ఈ పదబంధం అత్యున్నత నాణ్యతగల శుద్ధి చేసిన బంగారాన్ని సూచిస్తుంది. ‘మేలిమి బంగారం’ సహజమైన తెలుగు; ‘శుద్ధ బంగారం’ కూడా సాధ్యమే.
- source_word: וַיְצַף מִזְבֵּחַ אָרֶז
  choice: దేవదారు చెక్కతో చేసిన బలిపీఠానికి కూడా తాపడం చేయించాడు
  rationale: מִזְבֵּחַ אָרֶז ను బలిపీఠం దేవదారు చెక్కతో చేసినదని తెలిపే పదబంధంగా గ్రహించాం. తెలుగులో అస్పష్టమైన ‘దేవదారు బలిపీఠం’ కంటే పదార్థాన్ని స్పష్టంగా చెప్పే రూపం సహజంగా ఉంది.
theological_decisions:
- issue: לִפְנֵי הַדְּבִיר అనే సంక్షిప్త హీబ్రూ నిర్మాణం దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో అంతర్గర్భాలయానికే ఈ కొలతలు వర్తిస్తున్నట్లు అనువదించడం
  alternative: ‘అంతర్గర్భాలయం ముందు ఉన్న భాగం’ అని అక్షరార్థంగా అనువదించడం
  rationale: సందర్భం, కొలతల ఘనాకార సమానత్వం, వాక్యంలో తరువాత వచ్చే ఏకవచన కర్మప్రత్యయం—ఇవి అంతర్గర్భాలయమే కొలవబడి బంగారంతో తాపడం చేయబడిందని బలపరుస్తాయి. అయినప్పటికీ לִפְנֵי సాధారణ అర్థాన్ని తొలగించకుండా పాదసూచికలో నమోదు చేశాం; దీనిపై ప్రత్యేక సిద్ధాంతార్థాన్ని మోపలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల నిర్మాణం వాడాం. దేవాలయ సంబంధ పదాలకు ‘అంతర్గర్భాలయం,’ ‘బలిపీఠం,’ ‘తాపడం’ వంటి సాధారణంగా అర్థమయ్యే పదాలను ఎంచుకున్నాం. మూల కొలమానాన్ని ‘మూరలు’గా నిలిపాం.
