translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన నిర్మాణ పదజాలం వాడబడింది. הבית ను సందర్భానుసారంగా ‘మందిరం’గా, אַמּוֹת ను సంప్రదాయ బైబిలు కొలతపదమైన ‘మూరలు’గా అనువదించాం. అస్పష్టమైన నిర్మాణ పదానికి ప్రధాన పాఠంలో విస్తృతార్థం ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
