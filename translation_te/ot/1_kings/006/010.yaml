  text: וַ/יִּ֤בֶן אֶת ה/יצוע עַל כָּל הַ/בַּ֔יִת חָמֵ֥שׁ אַמּ֖וֹת קֽוֹמָת֑/וֹ וַ/יֶּאֱחֹ֥ז אֶת הַ/בַּ֖יִת בַּ/עֲצֵ֥י אֲרָזִֽים־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/010.yaml
  text: He built the side structure against the whole house[a], five cubits high[b], and it was fastened to the house with cedar timbers.
translation:
  language: te
  text: అతడు మందిరమంతటి పొడవునా ఆనుకొని ఉండే పక్క కట్టడాన్ని నిర్మించాడు[a]. దాని ఎత్తు ఐదు మూరలు. అతడు దేవదారు కలపతో దానిని మందిరానికి బిగించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పక్క గదులను”; హీబ్రూ పదం మందిరానికి ఆనుకొని దాని వెంట విస్తరించిన అనుబంధ నిర్మాణాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ క్రియకు అక్షరార్థంగా “పట్టుకొన్నాడు” అనే భావం ఉంది; ఈ నిర్మాణ సందర్భంలో “దేవదారు కలపతో మందిరానికి జోడించాడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: అతడు … నిర్మించాడు
  rationale: בנה క్రియ యొక్క కథన భూతకాల రూపాన్ని సహజమైన ఆధునిక తెలుగు వాక్యక్రమంలో అందిస్తుంది.
- source_word: היצוע
  choice: పక్క కట్టడం
  rationale: ఈ పదం మందిరానికి ఆనుకొని విస్తరించిన అనుబంధ నిర్మాణాన్ని సూచిస్తుంది; గదులు మాత్రమే అని అర్థాన్ని కుదించకుండా నిర్మాణ సముదాయాన్ని తెలియజేస్తుంది.
- source_word: עַל כָּל הַבַּיִת
  choice: మందిరమంతటి పొడవునా దానికి ఆనుకొని ఉన్న
  rationale: עַל ఇక్కడ స్థలసంబంధంగా మందిరం పక్కన లేదా దానికి ఆనుకొని ఉండడాన్ని సూచిస్తుంది. כָּל భావాన్ని ‘మంతటి పొడవునా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חָמֵשׁ אַמּוֹת קוֹמָתוֹ
  choice: అది ఐదు మూరల ఎత్తు
  rationale: కొలతను తెలుగులో సహజంగా చెబుతూ, ‘దాని ఎత్తు’ అనే హీబ్రూ ప్రత్యయ భావాన్ని ‘అది … ఎత్తు’గా నిలుపుతుంది.
- source_word: וַיֶּאֱחֹז
  choice: బిగించాడు
  rationale: אחז యొక్క మూలభావం ‘పట్టుకొను’; నిర్మాణ సందర్భంలో అది దృఢంగా జోడించడం లేదా బిగించడం అనే భావాన్ని ఇస్తుంది. క్రియారూపంలోని ఏకవచన పురుష కర్తను తెలుగు క్రియలో నిలిపింది.
- source_word: בַּעֲצֵי אֲרָזִים
  choice: దేవదారు దూలాలతో
  rationale: నిర్మాణ సందర్భంలో עֲצֵי אֲרָזִים అనేది నిర్మాణానికి ఉపయోగించిన దేవదారు కలప భాగాలను సూచిస్తుంది; ‘దూలాలు’ వాటి నిర్మాణాత్మక పనిని స్పష్టంగా తెలియజేస్తుంది.
