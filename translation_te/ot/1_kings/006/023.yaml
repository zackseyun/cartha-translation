translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా, సాధారణ పాఠకులకు స్పష్టంగా రూపొందించబడింది. దేవాలయ సంబంధ సందర్భాన్ని తెలియజేయడానికి ‘లోపలి పవిత్రస్థలం’ను ఎంచుకొని, సాంప్రదాయ సాంకేతిక పదబంధాన్ని పాదటిప్పణిలో ఇచ్చాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన వచనంలో ఉన్నాయి.
