  edition: WLC
  text: וַ/יַּ֣עַשׂ בַּ/דְּבִ֔יר שְׁנֵ֥י כְרוּבִ֖ים עֲצֵי שָׁ֑מֶן עֶ֥שֶׂר אַמּ֖וֹת קוֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/023.yaml
  text: In the inner sanctuary he made two cherubim of olivewood[b][a], each ten cubits high.
translation:
  language: te
  text: లోపలి పరిశుద్ధస్థలంలో[a] అతడు ఒలీవ చెక్కతో రెండు కెరూబులను చేశాడు; వాటిలో ప్రతిదాని ఎత్తు పది మూరలు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతి పరిశుద్ధ స్థలంలో.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “దాని ఎత్తు పది మూరలు”; ఏకవచనం రెండు కెరూబులలో ప్రతిదానిని సూచిస్తున్నట్లు అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדְּבִיר
  choice: లోపలి పవిత్రస్థలంలో
  rationale: దేవాలయంలోని అత్యంత లోపలి గదిని సూచించే דְּבִיר కు ఇది సహజమైన, స్పష్టమైన తెలుగు రూపం; ‘అతి పరిశుద్ధ స్థలం’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచి మూలపద పరిధిని కాపాడింది.
- source_word: כְרוּבִים
  choice: కెరూబులు
  rationale: ఇవి ప్రత్యేకమైన బైబిలు పరలోక జీవులు; సాధారణ ‘దూతలు’ అని మార్చకుండా మూలంలోని ప్రత్యేక నామాన్ని లిప్యంతరీకరించింది.
- source_word: עֲצֵי שָׁמֶן
  choice: ఒలీవ చెక్కతో
  rationale: ఈ సందర్భంలో శేమెన్ చెట్టు ఒలీవ చెట్టును సూచిస్తుంది; విగ్రహాలు చేయబడిన పదార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: עֶשֶׂר אַמּוֹת
  choice: పది మూరలు
  rationale: אַמָּה అనే ప్రాచీన మోచేతి ఆధారిత కొలతకు తెలుగు బైబిలు వాడుకలో స్థిరపడిన ‘మూర’ను ఉపయోగించింది.
- source_word: קוֹמָתוֹ
  choice: ఒక్కొక్కటి ... ఎత్తు ఉండేది
  rationale: హీబ్రూలో అక్షరార్థంగా ఏకవచనంలో ‘దాని ఎత్తు’ ఉన్నా, రెండు కెరూబులలో ప్రతిదానికీ వర్తించే పంపిణీ ఏకవచనంగా సందర్భం సూచిస్తుంది; ఆ విషయాన్ని పాదటిప్పణితో వెల్లడించింది.
- source_word: וַיַּעַשׂ
  choice: చేయించాడు
  rationale: రాజైన సొలొమోను నిర్మాణ కార్యాన్ని నిర్వహింపజేసిన సందర్భంలో causative భావంతో సహజ తెలుగులో ‘చేయించాడు’ సరిపోతుంది; మూలక్రియ సాధారణంగా ‘చేశాడు’ అని కూడా అనువదించవచ్చు.
