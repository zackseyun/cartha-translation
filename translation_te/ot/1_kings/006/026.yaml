  text: The height of the one cherub was ten cubits[a], and so it was with the second cherub.
translation:
  language: te
  text: ఒక కెరూబు ఎత్తు పది మూరలు[a]; రెండవ కెరూబు ఎత్తు కూడా అంతే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూర అనేది మోచేయి నుంచి చేతివేళ్ల చివర వరకు ఉండే దూరం ఆధారంగా నిర్ణయించిన ప్రాచీన పొడవు ప్రమాణం.
    reason: cultural_note
lexical_decisions:
- source_word: קוֹמַת
  choice: ఎత్తు
  rationale: קוֹמָה ఇక్కడ ఆలయ సామగ్రిలోని ఆకృతి యొక్క నిలువు కొలతను సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఎత్తు’ సహజమైన, స్పష్టమైన పదం.
- source_word: הַכְּרוּב
  choice: కెరూబు
  rationale: ఏకవచనంలోని כְּרוּבను ఆలయ సందర్భంలోని ఒక కెరూబు ఆకృతిగా సూచించేందుకు సంప్రదాయ బైబిలు పదమైన ‘కెరూబు’తో అనువదించాం.
- source_word: הָאֶחָד
  choice: ఒక
  rationale: హీబ్రూ పదబంధం ‘ఆ ఒకటి/ఒకటి’ అని రెండు కెరూబులలో ఒకదాన్ని వేరుచేస్తుంది; ‘మొదటి’ అని అనువదించడం మూలంలో లేని క్రమ భావాన్ని బలపరచవచ్చు.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: పది మూరలు
  rationale: కొలతను నేరుగా తెలిపే ఈ పదబంధానికి, ప్రాచీన మోచేయి-ఆధారిత ప్రమాణాన్ని సూచించే స్థిర తెలుగు బైబిలు పదం ‘మూర’ను వాడాం.
- source_word: וְכֵן
  choice: కూడా అంతే
  rationale: రెండు కెరూబుల ఎత్తులు సమానమని తెలిపే తుల్యార్థాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: రెండవ కెరూబు
  rationale: మూలంలోని הַשֵּׁנִי అనే స్పష్టమైన ‘రెండవ’ భావాన్ని నిలుపుకుంది; ‘మరో కెరూబు’ కంటే ఇది రూపపరంగా దగ్గరగా ఉంది.
