translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన నిర్మాణం వాడబడింది. మొదటి భాగంలోని ‘ఎత్తు’ను రెండవ భాగంలో పునరుక్తి చేయడం ద్వారా ‘కూడా అంతే’ దేనిని సూచిస్తుందో స్పష్టంగా ఉంచాం; ఇది హీబ్రూ తుల్య నిర్మాణ భావాన్ని సహజంగా అందిస్తుంది.
