source:
  edition: WLC
  text: וּ/דְבִ֧יר בְּ/תוֹךְ הַ/בַּ֛יִת מִ/פְּנִ֖ימָה הֵכִ֑ין לְ/תִתֵּ֣ן שָׁ֔ם אֶת אֲר֖וֹן בְּרִ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/019.yaml
  text: And he prepared the inner sanctuary within the house[a], to place there the ark of the covenant of Yahweh.
translation:
  language: te
  text: యాహ్వే నిబంధన మందసాన్ని అక్కడ ఉంచడానికి, అతడు మందిరంలో లోపలి అంతరాలయాన్ని[a] సిద్ధం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం దెబీర్. సంప్రదాయంగా దీనిని ‘దివ్యవాక్కు స్థలం’ అని కూడా అనువదించారు; ఇక్కడ ఇది మందిరంలోని అత్యంత లోపలి పవిత్ర గదిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבִיר
  choice: అంతరాలయం
  rationale: ఆలయ సందర్భంలో ఈ పదం మందిరంలోని అత్యంత లోపలి పవిత్ర గదిని సూచిస్తుంది. ‘అంతరాలయం’ దాని స్థానం, పవిత్ర కార్యం రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: בְּתוֹךְ הַבַּיִת מִפְּנִימָה
  choice: మందిరం లోపల
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా, సందర్భంలో అది యెహోవా మందిరాన్ని సూచిస్తుంది. మִפְּנִימָה తెలిపే అంతర్గత స్థాన భావం ‘లోపల’లో నిలిచింది; דְבִירకు వాడిన ‘అంతరాలయం’ దాని అత్యంత లోపలి స్వభావాన్ని మరింత స్పష్టం చేస్తుంది.
- source_word: הֵכִין
  choice: సిద్ధం చేశాడు
  rationale: ఒక నిర్దిష్ట ప్రయోజనం కోసం స్థలాన్ని తయారుచేయడం లేదా ఏర్పాటుచేయడం అనే భావాన్ని ఇది సహజంగా వ్యక్తం చేస్తుంది; నిర్మాణ విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: לְתִתֵּן
  choice: ఉంచడానికి
  rationale: ఈ క్రియారూపం ఉద్దేశాన్ని తెలియజేస్తుంది. మందసాన్ని నిర్దిష్ట స్థలంలో పెట్టే భావానికి ‘ఉంచడానికి’ సహజమైన ఆధునిక తెలుగు.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: యెహోవా నిబంధన మందసం
  rationale: హీబ్రూ సంబంధపద శ్రేణిని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, మందసం యెహోవా నిబంధనకు సంబంధించినదని స్పష్టం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా నిలుపుతుంది.
theological_decisions:
- issue: దైవ నామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న దైవ నామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో మార్చకుండా నిలుపుతున్నాం. ఆధునిక తెలుగు బైబిల్ పాఠకులకు ‘యెహోవా’ రూపం విస్తృతంగా పరిచితం; ‘యాహ్వే’ మూల ఉచ్చారణను పునర్నిర్మించే ప్రత్యామ్నాయ లిప్యంతరీకరణ.
- issue: דְבִיר యొక్క ఆలయార్థం
  choice: అంతరాలయం
  alternative: దివ్యవాక్కు స్థలం
  rationale: ఇక్కడ పదం ఆలయంలోని అత్యంత లోపలి గదిని సూచిస్తుంది. సంప్రదాయ ‘oracle’ భావాన్ని ప్రధాన పాఠ్యంలో పెట్టడం స్థలార్థాన్ని అస్పష్టం చేయవచ్చు; అందువల్ల పదసంబంధ ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఆలయ నిర్మాణ సందర్భం స్పష్టంగా ఉండేందుకు בַּיִת‌ను ‘మందిరం’గా సందర్భానుసారంగా అనువదించాం; ‘అంతరాలయం’ అనే పదానికి పాదసూచిక ద్వారా వివరణ ఇచ్చాం.
