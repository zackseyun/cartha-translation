    issue: The draft renders יְהוָה as “యెహోవా.”
    rationale: The supplied English POB and its theological decision explicitly prescribe “Yahweh” for the divine name. “యాహ్వే” is the corresponding Telugu transliteration and should be used for project consistency.
  - severity: low
