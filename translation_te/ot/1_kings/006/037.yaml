lexical_decisions:
- source_word: בַּשָּׁנָה הָרְבִיעִית
  choice: నాలుగో సంవత్సరంలో
  rationale: ఇది నిర్దిష్టమైన కాలసూచన. సందర్భం సొలొమోను పరిపాలనను సూచించినా, ఈ వచనంలో లేని ‘అతని పరిపాలనలో’ అనే మాటలను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: יֻסַּד
  choice: పునాది వేయబడింది
  rationale: יסד యొక్క ఈ కర్మణి రూపం భవన నిర్మాణ సందర్భంలో పునాది వేయడాన్ని లేదా స్థాపించడాన్ని సూచిస్తుంది. సహజమైన తెలుగులో భావం స్పష్టంగా ఉండేందుకు ‘పునాది వేయబడింది’ అని అనువదించాం.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరానికి
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఇక్కడ అది దేవాలయాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సందర్భార్థాన్ని స్పష్టంగా తెలిపే ‘మందిరం’ ఉపయోగించాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించగల ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: בְּיֶרַח זִו
  choice: జీవు నెలలో
  rationale: יֶרַח అంటే ‘నెల’; זִו ఆ నెల పేరు. ఈ వచనం చెప్పని ‘రెండో నెల’ అనే సందర్భ సమాచారాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠ్యంలో ఉన్న ప్రత్యేక దైవనామాన్ని బిరుదుగా మార్చకుండా నిలుపుకున్నాం; దీనివల్ల నిబంధన నామానికి ఉన్న ప్రత్యేకత కాపాడబడుతుంది.
translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు; చారిత్రక వర్ణనకు తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలో లేని పరిపాలనా వివరాలు లేదా ‘రెండో నెల’ అనే వివరణ చేర్చలేదు.
