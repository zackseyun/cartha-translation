translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే నిర్మాణ పదజాలం వాడబడింది. ‘ఆలయ భవనం’ సందర్భాన్ని స్పష్టం చేస్తుంది; ‘ముఖమంటపం’ మరియు ‘ప్రధాన మందిరం’ వేర్వేరు నిర్మాణ భాగాలుగా నిలుపబడ్డాయి. మూలంలోని కొలమానం ‘మూర’గా అలాగే ఉంచబడింది.
