  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָ/אוּלָ֗ם עַל פְּנֵי֙ הֵיכַ֣ל הַ/בַּ֔יִת עֶשְׂרִ֣ים אַמָּה֙ אָרְכּ֔/וֹ עַל פְּנֵ֖י רֹ֣חַב הַ/בָּ֑יִת עֶ֧שֶׂר בָּ/אַמָּ֛ה רָחְבּ֖/וֹ עַל פְּנֵ֥י הַ/בָּֽיִת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/003.yaml
  text: The portico in front of the nave of the house was twenty cubits long[a], across the width of the house[c][b], and ten cubits deep in front of the house.
translation:
  language: te
  text: ఆలయ భవనంలోని ప్రధాన మందిరం[b] ఎదుట ఉన్న ముఖమంటపం[a], భవనం వెడల్పు అంతటా ఇరవై మూరల పొడవు ఉండి, భవనం ఎదుట పది మూరల లోతు[c] ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వసారా’ లేదా ‘ప్రవేశ మంటపం.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘భవనపు హేఖాలు’; అంటే ఆలయ భవనంలోని ప్రధాన మందిరం.
    reason: lexical_alternative
  - marker: c
    text: పదశః ‘దాని వెడల్పు’; ఇక్కడ భావం, ఆలయ భవనం ఎదుట ముఖమంటపం ముందుకు విస్తరించిన లోతు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאוּלָם
  choice: ముఖమంటపం
  rationale: ఆలయ నిర్మాణంలో ప్రధాన మందిరానికి ముందున్న ప్రవేశ నిర్మాణాన్ని సూచిస్తుంది. ‘ముఖమంటపం’ ఆధునిక తెలుగు పాఠకులకు సహజంగా అర్థమవుతూ దాని స్థానం, నిర్మాణ విధి రెండింటినీ తెలియజేస్తుంది.
- source_word: עַל־פְּנֵי
  choice: ఎదుట
  rationale: ఈ సందర్భంలో నిర్మాణాల మధ్య స్థలసంబంధాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הֵיכַל הַבַּיִת
  choice: ఆలయ భవనంలోని ప్రధాన మందిరం
  rationale: הֵיכַל ఇక్కడ ముఖమంటపం, అంతర్గర్భగది నుండి వేరైన ప్రధాన మందిర భాగాన్ని సూచిస్తుంది; הַבַּיִת ఆలయ భవనాన్ని సూచిస్తుందని సందర్భానుసారంగా స్పష్టం చేయబడింది.
- source_word: עֶשְׂרִים אַמָּה
  choice: ఇరవై మూరలు
  rationale: మూలంలోని ప్రాచీన కొలమానాన్ని మార్పిడి చేయకుండా తెలుగు బైబిలు వాడుకలో పరిచితమైన ‘మూర’తో నిలిపింది.
- source_word: עַל־פְּנֵי רֹחַב הַבָּיִת
  choice: భవనం వెడల్పు అంతటా
  rationale: ముఖమంటపపు పొడవు ఆలయ భవనం ముందుభాగపు వెడల్పుకు అడ్డంగా విస్తరించిందనే నిర్మాణ సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: పది మూరలు
  rationale: కొలతల్లో ב ఉపసర్గను తెలుగులో ప్రత్యేకంగా అనువదించాల్సిన అవసరం లేదు; సాధారణ కొలత వ్యక్తీకరణ సరిపోతుంది.
- source_word: רָחְבּוֹ
  choice: లోతు
  rationale: పదశః ‘దాని వెడల్పు’ అయినా, భవనం ఎదుట ఉన్న ముఖమంటపానికి ఇది ముందునుంచి వెనుకకు ఉండే కొలత. ‘లోతు’ నిర్మాణ పరిమాణాన్ని అయోమయం లేకుండా తెలియజేస్తుంది.
- source_word: עַל־פְּנֵי הַבָּיִת
  choice: భవనం ఎదుట
  rationale: పది మూరల కొలత ఆలయ భవనం ముందుభాగంలో బయటికి విస్తరించిన పరిమాణమని తెలియజేస్తుంది.
