  text: For the entrance of the inner sanctuary he made doors of olivewood[a]; the doorposts and jambs were five-sided.
translation:
  language: te
  text: లోపలి పవిత్రస్థల ప్రవేశం కోసం అతడు ఒలీవ చెక్కతో తలుపులు చేశాడు; ద్వారచట్రం, ద్వారబంధాలు ఐదు భుజాల ఆకారంలో ఉన్నాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ద్వారచట్రం, ద్వారబంధాలు ఐదవ వంతుగా ఉన్నాయి.” చివరి హీబ్రూ పదబంధం సంక్షిప్తంగా ఉంది; దాని వాస్తుపరమైన అర్థం స్పష్టంగా లేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח
  choice: ప్రవేశం
  rationale: ఈ పదం తలుపు పలకలను కాకుండా లోపలికి వెళ్లే తెరువును లేదా ప్రవేశస్థానాన్ని సూచిస్తుంది; తరువాత వచ్చే ‘తలుపులు’ అనే పదంతో తేడాను నిలుపుతుంది.
- source_word: הַדְּבִיר
  choice: అంతరాలయం
  rationale: ఆలయంలోని అత్యంత లోపలి పవిత్ర గదిని సూచించే సహజమైన, గౌరవప్రదమైన తెలుగు పదం; తరువాతి కాలపు ప్రత్యేక పారిభాషిక పదాన్ని అనవసరంగా రుద్దదు.
- source_word: דַּלְתוֹת
  choice: తలుపులు
  rationale: జతగా ఉన్న తలుపు పలకలను సూచించే బహువచనానికి సాధారణ పాఠకులకు సహజమైన అనువాదం.
- source_word: עֲצֵי שָׁמֶן
  choice: ఒలీవ చెక్క
  rationale: అక్షరార్థంగా ‘నూనె చెట్టు చెక్క’; సందర్భంలో ఇది ఒలీవ చెక్కను సూచిస్తుంది.
- source_word: הָאַיִל
  choice: ద్వారచట్రం
  rationale: వాస్తు సందర్భంలో తలుపు చట్రంలోని ఆధార నిర్మాణాన్ని సూచించగల పదం; పక్కనే ఉన్న מְזוּזוֹתతో భేదాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: מְזוּזוֹת
  choice: ద్వారపు నిలువు కమ్ములు
  rationale: తలుపు ఇరువైపులా ఉండే నిలువు ద్వారబంధాలను స్పష్టంగా తెలియజేస్తుంది.
- source_word: חֲמִשִׁית
  choice: ఐదు పక్కలుగా ఉన్నాయి
  rationale: హెబ్రీ పదబంధం చాలా సంక్షిప్తంగా, వాస్తు పరంగా అస్పష్టంగా ఉంది. సందర్భంలో ఇది ద్వార నిర్మాణ ఆకారాన్ని సూచిస్తుందని తీసుకున్న పఠనం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి అస్పష్టతను కాపాడాం.
