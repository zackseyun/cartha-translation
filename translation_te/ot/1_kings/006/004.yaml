translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే నిర్మాణ భాషను వాడాం. అరుదైన హీబ్రూ పదాలపై అతినిశ్చయాన్ని నివారించి, ప్రధాన పాఠాన్ని సంక్షిప్తంగా ఉంచి ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చాం.
