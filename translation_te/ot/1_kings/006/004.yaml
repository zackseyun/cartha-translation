  text: וַ/יַּ֣עַשׂ לַ/בָּ֔יִת חַלּוֹנֵ֖י שְׁקֻפִ֥ים אֲטֻמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/004.yaml
  text: He made for the house windows with recessed frames[a].
translation:
  language: te
  text: అతడు మందిరం కోసం లోపలికి దిగిన చట్రాలుగల కిటికీలు చేశాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి హీబ్రూ నిర్మాణ పదాలు అరుదైనవి; వాటి ఖచ్చితమైన అర్థం అనిశ్చితం. ఈ మాటలను “వాలుగా చేసిన చట్రాలుగల కిటికీలు,” “క్రమంగా ఇరుకయ్యే పక్కకమ్ములుగల కిటికీలు,” “లోపల వెడల్పుగా, బయట ఇరుకుగా ఉన్న కిటికీలు,” లేదా “మూయబడిన కిటికీలు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేయించాడు
  rationale: עשה యొక్క వయ్యిక్టోల్ రూపం కథనంలో సాధారణ భూతకాల చర్యను తెలియజేస్తుంది. నిర్మాణ సందర్భంలో రాజు స్వయంగా చేయడం కంటే చేయించాడనే సహజ తెలుగు ప్రయోగం సరిపోతుంది.
- source_word: לַבָּיִת
  choice: మందిరానికి
  rationale: సందర్భంలో בַּיִת సొలొమోను నిర్మిస్తున్న యెహోవా మందిరాన్ని సూచిస్తుంది; తెలుగులో ‘మందిరం’ స్పష్టంగా, సహజంగా ఉంటుంది. ל ఉపసర్గను ‘కు/కోసం’ అనే ప్రయోజనార్థంలో అనువదించాం.
- source_word: חַלּוֹנֵי
  choice: కిటికీలు
  rationale: חלון పదం యొక్క బహువచన సంయుక్తరూపానికి సాధారణమైన, సహజమైన తెలుగు సమానం.
- source_word: שְׁקֻפִים
  choice: లోపలికి నొక్కిన చట్రాలుగల
  rationale: ఇది అరుదైన నిర్మాణ పదం; లోపలికి దిగిన, వాలుగా చేసిన, లేదా క్రమంగా ఇరుకయ్యే చట్రాలు/పక్కకమ్ములను సూచించవచ్చు. ప్రధాన పాఠంలో చదవదగిన ఒక సాధ్యమైన అర్థాన్ని ఇచ్చి, అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
- source_word: אֲטֻמִים
  choice: కిటికీల నిర్మాణ వివరణలో అంతర్భావంగా గ్రహించబడింది
  rationale: אטם నుండి వచ్చిన ఈ నిష్క్రియ రూపం ‘మూయబడిన/బిగించబడిన’ భావాన్ని ఇస్తుంది; అయితే ఈ రెండు అరుదైన పదాలు కలసి ఒకే నిర్మాణ రకాన్ని వర్ణిస్తున్నాయా, లేక రెండవది ప్రత్యేక లక్షణాన్ని జోడిస్తున్నదా అనేది అనిశ్చితం. తెలుగులో అసహజమైన ద్విగుణ వర్ణనను నివారించి, ప్రత్యామ్నాయాలను పాదటిప్పణిలో తెలిపాం.
