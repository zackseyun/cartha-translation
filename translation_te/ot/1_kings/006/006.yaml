revisions:
- from: కింది అంతస్తు ఐదు మూరల వెడల్పు, మధ్య అంతస్తు ఆరు మూరల వెడల్పు, మూడవ అంతస్తు ఏడు మూరల వెడల్పు. ఎందుకంటే పక్కగదుల దూలాలను ఆలయపు గోడల్లోకి చొప్పించకుండా ఉండేలా, అతడు ఆలయం వెలుపలి వైపున చుట్టూ అంచెలను[a] ఏర్పాటు చేశాడు.[b]
  to: కింది అంతస్తు వెడల్పు ఐదు మూరలు, మధ్య అంతస్తుది ఆరు మూరలు, మూడవ అంతస్తుది ఏడు మూరలు. ఆలయపు గోడలకు దూలాలు బిగించబడకుండా ఉండేందుకు అతడు ఆలయం వెలుపల చుట్టూ వెనుకకు తగ్గిన అంచులను[a] ఏర్పాటు చేశాడు.[b]
