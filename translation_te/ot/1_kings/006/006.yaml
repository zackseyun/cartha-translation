    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఆలయపు గోడలను పట్టుకోకుండా ఉండేందుకు.” హీబ్రూ పాఠం ఏది గోడలకు పట్టుకోకూడదో స్పష్టంగా చెప్పదు; సందర్భంలో పక్కగదుల దూలాలు ఉద్దేశించబడ్డాయని భావించవచ్చు.
