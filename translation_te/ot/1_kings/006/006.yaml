  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన నిర్మాణవివరణను ఉపయోగించాం. ‘ఆలయం’ ద్వారా సందర్భంలోని הַבַּיִתను స్పష్టం చేశాం; మూలంలోని అంతర్లీన కర్తవ్యవస్తువు విషయంలో ఉన్న సందిగ్ధతను పాదసూచికలో సంరక్షించాం.
