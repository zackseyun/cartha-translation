  text: ה/יצוע הַ/תַּחְתֹּנָ֜ה חָמֵ֧שׁ בָּ/אַמָּ֣ה רָחְבָּ֗/הּ וְ/הַ/תִּֽיכֹנָה֙ שֵׁ֤שׁ בָּֽ/אַמָּה֙ רָחְבָּ֔/הּ וְ/הַ֨/שְּׁלִישִׁ֔ית שֶׁ֥בַע בָּ/אַמָּ֖ה רָחְבָּ֑/הּ כִּ֡י מִגְרָעוֹת֩ נָתַ֨ן לַ/בַּ֤יִת סָבִיב֙ ח֔וּצָ/ה לְ/בִלְתִּ֖י אֲחֹ֥ז בְּ/קִֽירוֹת הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/006.yaml
  text: The lowest story was five cubits wide[a], the middle one six cubits wide, and the third seven cubits wide; for he made offsets around the outside of the temple[b], so that the beams would not be inserted into the walls of the temple.
translation:
  language: te
  text: కింది అంతస్తు వెడల్పు ఐదు మూరలు, మధ్య అంతస్తుది ఆరు మూరలు, మూడవ అంతస్తుది ఏడు మూరలు. ఆలయపు గోడలకు దూలాలు బిగించబడకుండా ఉండేందుకు అతడు ఆలయం వెలుపల చుట్టూ వెనుకకు తగ్గిన అంచులను[a] ఏర్పాటు చేశాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆధారపు అంచులు,’ ‘గోడలో వెనుకంజలు.’ ఇది బయటి గోడలో చేసిన వాస్తు నిర్మాణ లక్షణాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఆలయపు గోడలను పట్టుకోకుండా ఉండేందుకు.” హీబ్రూ పాఠం ఏది గోడలకు పట్టుకోకూడదో స్పష్టంగా చెప్పదు; సందర్భంలో పక్కగదుల దూలాలు ఉద్దేశించబడ్డాయని భావించవచ్చు.
    reason: source_ambiguity
lexical_decisions:
- source_word: היצוע
  choice: అంతస్తు
  rationale: ఆలయం చుట్టూ ఉన్న పక్కగదుల నిర్మాణంలోని ఒక స్థాయిని ఈ పదం సూచిస్తుంది. ఆధునిక తెలుగులో ‘అంతస్తు’ ఆ నిర్మాణస్థాయిని సహజంగా తెలియజేస్తుంది.
- source_word: הַתַּחְתֹּנָה
  choice: కింది అంతస్తు
  rationale: కింది, మధ్య, మూడవ అనే వరుసను స్పష్టంగా ఉంచుతుంది; హీబ్రూ విశేషణానికి సందర్భానుసారంగా ‘అంతస్తు’ను జోడించాం.
- source_word: בָּאַמָּה
  choice: మూరలు
  rationale: ప్రాచీన కొలమానాన్ని ఆధునిక ప్రమాణంలోకి మార్చకుండా, తెలుగులో సంప్రదాయంగా అర్థమయ్యే ‘మూర’తో అనువదించాం.
- source_word: רָחְבָּהּ
  choice: వెడల్పు
  rationale: ప్రతి స్థాయి వెడల్పును తెలుగులో సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הַתִּיכֹנָה
  choice: మధ్య అంతస్తు
  rationale: మొదటి పదంలో ఉన్న నిర్మాణస్థాయి భావాన్ని పునరుద్ధరించి సందిగ్ధత లేకుండా చేశాం.
- source_word: הַשְּׁלִישִׁית
  choice: మూడవ అంతస్తు
  rationale: హీబ్రూ క్రమసంఖ్యను యథాతథంగా ఉంచుతూ అది నిర్మాణస్థాయిని సూచిస్తుందని స్పష్టం చేశాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: అంతస్తుల వెడల్పులు పెరగడానికి తరువాతి నిర్మాణవివరణ కారణమని సూచిస్తుంది.
- source_word: מִגְרָעוֹת
  choice: అంచెలు
  rationale: ఆలయపు బయటి గోడలో పైకి వెళ్లే కొద్దీ ఏర్పరిచిన వెనుకంజలు లేదా ఆధారపు అంచులను సూచించే సులభమైన వాస్తుశిల్ప పదం; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: נָתַן לַבַּיִת סָבִיב חוּצָה
  choice: అతడు ఆలయం వెలుపలి వైపున చుట్టూ ... ఏర్పాటు చేశాడు
  rationale: ‘ఇంటి వెలుపల చుట్టూ ఉంచాడు’ అనే హీబ్రూ నిర్మాణాన్ని ఆలయ నిర్మాణ సందర్భంలో సహజమైన తెలుగుగా అందించాం.
- source_word: לְבִלְתִּי אֲחֹז בְּקִירוֹת הַבָּיִת
  choice: పక్కగదుల దూలాలను ఆలయపు గోడల్లోకి చొప్పించకుండా ఉండేలా
  rationale: హీబ్రూలో పట్టుకునే వస్తువు స్పష్టంగా చెప్పబడలేదు. నిర్మాణ సందర్భంలో దూలాలు ఉద్దేశించబడ్డాయని ప్రధాన పాఠంలో స్పష్టం చేశాం; మూలంలోని అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
