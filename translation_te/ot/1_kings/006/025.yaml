translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. మూలంలో లేని 'ఎత్తు' అనే నిర్దిష్టతను చేర్చలేదు. పూర్వ వచనంతో కొనసాగింపును చూపేందుకు 'కూడా' వాడబడింది.
