  revision_rationale: The revision improves Telugu idiom while preserving the Hebrew’s neutral statement of dimension and its assertion that the two cherubim had identical measure and form. The footnote carries forward the audit-trail lexical alternative for קֶצֶב without imposing a narrower interpretation in the main text.
