source:
  edition: WLC
  text: וְ/עֶ֨שֶׂר֙ בָּֽ/אַמָּ֔ה הַ/כְּר֖וּב הַ/שֵּׁנִ֑י מִדָּ֥ה אַחַ֛ת וְ/קֶ֥צֶב אֶחָ֖ד לִ/שְׁנֵ֥י הַ/כְּרֻבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/025.yaml
  text: And the second cherub was ten cubits[a]; both cherubim had one measure and one form.
translation:
  language: te
  text: రెండవ కెరూబు కూడా పది మూరల కొలతగలది; రెండు కెరూబులకూ ఒకే కొలతా, ఒకే ఆకృతీ ఉన్నాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రెండు కెరూబులూ ఒకే కొలత, ఒకే నిష్పత్తి కలిగినవి.”
    reason: కֶצֶב అనే పదం సందర్భానుసారం ఆకృతి/రూపం లేదా నిష్పత్తి అనే భావాన్ని ఇవ్వవచ్చు.
lexical_decisions:
- source_word: וְעֶשֶׂר בָּאַמָּה
  choice: పది మూరలది
  rationale: హీబ్రూ వాక్యం కొలతను మాత్రమే తెలియజేస్తుంది; ఎత్తు అని స్పష్టంగా చెప్పదు. అందువల్ల సందర్భానికి సహజంగా ఉండేలా, ఆ వివరాన్ని జోడించకుండా తటస్థంగా అనువదించబడింది.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: రెండవ కెరూబు
  rationale: నిర్దిష్ట నామవాచకం, క్రమసంఖ్యను నేరుగా ప్రతిబింబిస్తుంది. 'కెరూబు' అనే రూపం హీబ్రూ ఏకవచనాన్ని నిలుపుతుంది.
- source_word: מִדָּה אַחַת
  choice: కొలత ... ఒక్కటే
  rationale: מִדָּה అంటే కొలత లేదా పరిమాణం. రెండు కెరూబులకు ఒకే కొలత ఉందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וְקֶצֶב אֶחָד
  choice: ఆకారం ఒక్కటే
  rationale: ఈ సందర్భంలో קֶצֶב రూపం, ఆకృతి లేదా నిష్పత్తిని సూచించవచ్చు. 'ఆకారం' సాధారణ పాఠకులకు స్పష్టంగా ఉండి, మూలంలోని విస్తృత భావాన్ని తగినంతగా నిలుపుతుంది.
- source_word: לִשְׁנֵי הַכְּרֻבִים
  choice: రెండు కెరూబుల
  rationale: అక్షరార్థంగా 'రెండు కెరూబులకు' అనే నిర్మాణం. తెలుగులో సహజంగా ఉండేందుకు, ఒకే కొలత మరియు ఆకారం రెండింటికీ వర్తిస్తాయని తెలిపే సంబంధరూపంగా ఇచ్చాం.
