  text: He overlaid the floor of the house with gold[b][a], on the inside and on the outside.
translation:
  language: te
  text: అతడు మందిరపు నేలను లోపలి వైపునూ బయటి వైపునూ బంగారంతో పొదిగించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో “లోపలికి, బయటికి” అనే సంక్షిప్త పదబంధం ఉంది. ఇది మందిరపు నేలను లోపలి భాగం నుంచి బయటి భాగం వరకు బంగారంతో పొదిగించాడని సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: קַרְקַע
  choice: నేల
  rationale: మందిర నిర్మాణ సందర్భంలో ఇది భవనం లోపలి నేల ఉపరితలాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘నేల’ సహజమైన నిర్మాణపరమైన పదం.
- source_word: הַבַּיִת
  choice: మందిరపు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఇంటి’ అని ఉన్నప్పటికీ, ఈ సందర్భంలో అది యెహోవా మందిరాన్ని సూచించే స్థిర వాడుక; తెలుగులో ‘మందిరపు’ అనడం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: צִפָּה
  choice: కప్పించాడు
  rationale: ఈ క్రియ ఒక ఉపరితలంపై పదార్థాన్ని పొరగా అమర్చడాన్ని సూచిస్తుంది; బంగారు రేకులతో కప్పించే నిర్మాణ కార్యానికి ‘కప్పించాడు’ సరిపోతుంది.
- source_word: זָהָב
  choice: బంగారంతో
  rationale: పదార్థాన్ని సూచించే సాధారణ, నేరమైన తెలుగు రూపం.
- source_word: לִפְנִימָה וְלַחִיצוֹן
  choice: లోపలివైపున, బయటివైపున అంతటా
  rationale: మూలంలోని సంక్షిప్త లోపలి–బయటి వ్యత్యాసాన్ని నిలుపుతూ, నేల అంతటా బంగారు పూత ఉన్నదనే సంభావ్య భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన నిర్మాణ వర్ణన. మూలంలోని ‘లోపల–బయట’ జంటను నిలిపి, దాని సంభావ్య విస్తృతి భావాన్ని ‘అంతటా’తో తెలిపింది.
