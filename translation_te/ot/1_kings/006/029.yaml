source:
  edition: WLC
  text: וְ/אֵת֩ כָּל קִיר֨וֹת הַ/בַּ֜יִת מֵסַ֣ב קָלַ֗ע פִּתּוּחֵי֙ מִקְלְעוֹת֙ כְּרוּבִ֣ים וְ/תִֽמֹרֹ֔ת וּ/פְטוּרֵ֖י צִצִּ֑ים מִ/לִּ/פְנִ֖ים וְ/לַ/חִיצֽוֹן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/029.yaml
  text: He carved all the walls of the house all around with engraved figures of cherubim[a], palm trees, and open flowers[c][b], on the inner and outer walls.
translation:
  language: te
  text: అతడు మందిరపు గోడలన్నిటిమీద నలువైపులా కెరూబులు, ఖర్జూర చెట్లు, వికసించిన పువ్వుల[a] ఆకృతులను చెక్కించాడు—లోపలి నుంచీ వెలుపలి వరకు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘విప్పారుతున్న పుష్పాలు’; ఇక్కడి హెబ్రీ పదబంధం పుష్పాల అలంకార ఆకృతులను సూచిస్తుంది, అయితే వాటి ఖచ్చితమైన రూపం స్పష్టంగా లేదు.
    reason: lexical_alternative
  - marker: b
    text: ఈ చివరి పదబంధాన్ని ‘లోపల మరియు వెలుపల’ అని కూడా అనువదించవచ్చు. ఈ సందర్భంలో అది మందిరంలోని లోపలి, వెలుపలి విభాగాలను లేదా గోడల ఉపరితలాలను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: קִירוֹת הַבַּיִת
  choice: మందిరపు గోడలు
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఈ నిర్మాణ సందర్భంలో దేవాలయాన్ని సూచిస్తుంది; ఆధునిక తెలుగు పాఠకులకు ‘మందిరం’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: מֵסַב
  choice: చుట్టూ
  rationale: అలంకార చెక్కులు గోడలన్నిటినీ చుట్టుముట్టి ఉన్న విస్తృతిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: קָלַע / פִּתּוּחֵי מִקְלְעוֹת
  choice: ఆకృతులను చెక్కించాడు
  rationale: క్రియతో పాటు వచ్చిన అలంకార చెక్కడానికి సంబంధించిన పదబంధాన్ని తెలుగులో అనవసర పునరుక్తి లేకుండా, బొమ్మల రూపాలుగా చెక్కిన భావంతో వ్యక్తపరుస్తుంది.
- source_word: כְּרוּבִים
  choice: కెరూబులు
  rationale: దేవాలయ సందర్భంలోని పరలోక జీవులకు వాడే బైబిలీయ లిప్యంతరీకరణను నిలుపుతుంది.
- source_word: תִמֹרֹת
  choice: ఖర్జూర చెట్లు
  rationale: అలంకార కళలోని ఖర్జూర వృక్ష ఆకృతులను సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: פְטוּרֵי צִצִּים
  choice: వికసించిన పువ్వులు
  rationale: విప్పారిన లేదా తెరుచుకున్న పుష్పాల అలంకార భావాన్ని సహజంగా అందిస్తుంది; ఖచ్చితమైన కళారూపం అనిశ్చితమైనందున గమనిక ఇచ్చబడింది.
- source_word: מִלִּפְנִים וְלַחִיצוֹן
  choice: లోపలి భాగంలోనూ వెలుపలి భాగంలోనూ
  rationale: హెబ్రీ పదబంధంలోని ‘లోపల/వెలుపల’ వ్యత్యాసాన్ని నిలుపుతూ, అవి గదులా గోడల ఉపరితలాలా అన్నదాన్ని అతిగా నిర్ధారించకుండా అస్పష్టతను కాపాడుతుంది.
