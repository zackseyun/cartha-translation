  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి. ‘మందిరం’ సందర్భార్థాన్ని స్పష్టం చేస్తుంది; ‘లోపలి భాగం/వెలుపలి భాగం’ మూలంలోని నిర్మాణాత్మక అస్పష్టతను నిలుపుతుంది.
