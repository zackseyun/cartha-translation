review_pass:
  verdict: revise
  source_fidelity: The conditional sequence and the idiom of establishing God's word are retained. However, ‘నా కట్టడలు’ normally denotes buildings/structures in modern Telugu and is not a suitable rendering of חֻקֹּתַי (‘my statutes’). The final relative clause should more clearly say that the word was spoken to David, rather than potentially suggesting speech with David.
  naturalness: The sentence is generally fluent and appropriately formal. Replacing the ambiguous ‘కట్టడలు’ and tightening the chained conditional clauses makes it more natural and immediately intelligible in modern standard Telugu.
  terminology: Use ‘శాసనాలు’ for statutes, retain ‘న్యాయవిధులు’ for judgments/ordinances and ‘ఆజ్ఞలు’ for commandments, and use ‘ధృవపరుస్తాను’ as the natural spelling. ‘మందిరం’ is contextually appropriate for the house under construction, though it is more explicit than the Hebrew’s literal ‘house’.
  issues:
  - severity: medium
    issue: ‘నా కట్టడల ప్రకారం’ for בְּחֻקֹּתַי
    rationale: In current Telugu, ‘కట్టడాలు/కట్టడలు’ ordinarily means constructed buildings, creating an incorrect or distracting sense. ‘నా శాసనాలలో/ప్రకారం’ conveys statutes and preserves the covenantal sense.
  - severity: low
    issue: ‘నీ తండ్రి దావీదుతో నేను చెప్పిన’
    rationale: ‘తో’ can be heard as ‘with David.’ The Hebrew אֶל means ‘to’; ‘నీ తండ్రియైన దావీదుకు నేను చెప్పిన’ is clearer.
  - severity: low
    issue: Footnote wording and spelling
    rationale: ‘హీబ్రూ జాతీయ ప్రయోగం’ is not idiomatic Telugu for an idiom, and ‘ధృవపరుస్తాను’ is the standard spelling. The alternative should preserve ‘with you’ rather than shift it to ‘for you’.
  revised_text: “నీవు కడుతున్న ఈ మందిరం విషయానికొస్తే—నీవు నా శాసనాలలో నడుచుకొని, నా న్యాయవిధులను అమలు చేసి, నా ఆజ్ఞలన్నిటినీ పాటించి వాటిలో నడుచుకుంటే, నీ తండ్రియైన దావీదుకు నేను చెప్పిన నా మాటను నీతో స్థిరపరుస్తాను.[a]”
