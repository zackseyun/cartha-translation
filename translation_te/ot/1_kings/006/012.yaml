  text: הַ/בַּ֨יִת הַ/זֶּ֜ה אֲשֶׁר אַתָּ֣ה בֹנֶ֗ה אִם תֵּלֵ֤ךְ בְּ/חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֣/י תַּֽעֲשֶׂ֔ה וְ/שָׁמַרְתָּ֥ אֶת כָּל מִצְוֺתַ֖/י לָ/לֶ֣כֶת בָּ/הֶ֑ם וַ/הֲקִמֹתִ֤י אֶת דְּבָרִ/י֙ אִתָּ֔/ךְ אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל דָּוִ֥ד אָבִֽי/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/012.yaml
  text: As for this house that you are building[a], if you walk in my statutes, carry out my judgments, and keep all my commandments by walking in them, then I will establish my word with you, which I spoke to David your father.
translation:
  language: te
  text: “నీవు కడుతున్న ఈ మందిరం విషయానికొస్తే—నీవు నా శాసనాలలో నడుచుకొని, నా న్యాయవిధులను అమలు చేసి, నా ఆజ్ఞలన్నిటినీ పాటించి వాటిలో నడుచుకుంటే, నీ తండ్రియైన దావీదుకు నేను చెప్పిన నా మాటను నీతో స్థిరపరుస్తాను.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా మాటను నీతో ధృవపరుస్తాను,” లేదా “నీతో నా వాగ్దానాన్ని నెరవేరుస్తాను.” “నా మాటను స్థిరపరుస్తాను” అనే హీబ్రూ పదబంధం, ముందుగా పలికిన మాటను ధృవపరచడం లేదా నెరవేర్చడం అనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת הַזֶּה
  choice: ఈ మందిరం
  rationale: בַּיִת యొక్క మూలార్థం ‘ఇల్లు’ అయినప్పటికీ, ఇక్కడ సందర్భం యెహోవా ఆలయ నిర్మాణం. ఆధునిక తెలుగులో ‘ఈ మందిరం’ సందర్భార్థాన్ని సహజంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר אַתָּה בֹנֶה
  choice: నీవు కడుతున్న
  rationale: בֹנֶה అనే కృదంతం కొనసాగుతున్న నిర్మాణక్రియను సూచిస్తుంది; ‘కడుతున్న’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אִם תֵּלֵךְ בְּחֻקֹּתַי
  choice: నీవు నా కట్టడల ప్రకారం నడుచుకొని
  rationale: הלך ב అనే నిబంధనాత్మక జీవనరూపకాన్ని ‘నడుచుకొని’ నిలుపుతుంది; חֻקֹּתַיకు ‘నా కట్టడలు’ చట్టబద్ధమైన నియమాల భావాన్ని ఇస్తుంది.
- source_word: מִשְׁפָּטַי תַּעֲשֶׂה
  choice: నా న్యాయవిధులను అమలు చేసి
  rationale: מִשְׁפָּטִיםలోని న్యాయపరమైన, నిబంధనాపరమైన బలాన్ని ‘న్యాయవిధులు’ నిలుపుతుంది; תעשהకు ‘అమలు చేసి’ సహజమైన కార్యాచరణ భావాన్ని ఇస్తుంది.
- source_word: וְשָׁמַרְתָּ אֶת כָּל מִצְוֺתַי
  choice: నా ఆజ్ఞలన్నిటినీ పాటిస్తూ
  rationale: שׁמר ఇక్కడ ఆజ్ఞలను జాగ్రత్తగా అనుసరించడం అనే అర్థంలో ఉంది; ‘పాటిస్తూ’ కొనసాగుతున్న విధేయతను సహజంగా తెలియజేస్తుంది.
- source_word: לָלֶכֶת בָּהֶם
  choice: వాటి ప్రకారం నడుచుకుంటే
  rationale: మూలంలోని పునరుక్త ‘నడచుట’ రూపకాన్ని నిలుపుతూ, ఆజ్ఞలకు అనుగుణంగా జీవించడం అనే భావాన్ని స్పష్టం చేస్తుంది.
- source_word: וַהֲקִמֹתִי אֶת דְּבָרִי אִתָּךְ
  choice: నా మాటను నీతో స్థిరపరుస్తాను
  rationale: הקים דבר అనే జాతీయ ప్రయోగం ముందుగా పలికిన మాటను ధృవపరచడం లేదా నెరవేర్చడం సూచిస్తుంది. ప్రధాన పాఠంలో ‘మాట’–‘స్థిరపరుస్తాను’ అని ఉంచడం మూలరూపాన్నీ దాని వాగ్దానార్థాన్నీ రెండింటినీ కాపాడుతుంది; אִתָּךְను ‘నీతో’గా నిలుపుతుంది.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֶל דָּוִד אָבִיךָ
  choice: నీ తండ్రి దావీదుతో నేను చెప్పిన
  rationale: דבר యొక్క ‘చెప్పడం/మాట్లాడడం’ భావాన్ని ఉంచి, דְּבָרִי (‘నా మాట’)తో ఉన్న పదసంబంధాన్ని కాపాడుతుంది.
theological_decisions:
- issue: మందిర నిర్మాణం, సొలొమోను విధేయత, దావీదుకు పలికిన మాట మధ్య షరతుతో కూడిన సంబంధం
  choice: సొలొమోను నిబంధనాపరమైన విధేయత చూపితే దేవుడు దావీదుకు పలికిన తన మాటను అతనితో స్థిరపరుస్తాడనే ‘అయితే—అప్పుడు’ నిర్మాణాన్ని నిలుపడం.
  alternative: ఇది పూర్తిగా షరతులేని వాగ్దానపు పునరుద్ఘాటనగా చెప్పడం; లేదా మునుపటి వాగ్దానంలోని ఇతర అంశాలన్నిటినీ రద్దుచేసే సంపూర్ణ షరతుగా వివరించడం.
  rationale: హీబ్రూ వాక్యంలో אִם స్పష్టమైన షరతును ప్రవేశపెడుతుంది. దావీదు నిబంధనలోని షరతుతో కూడిన, షరతులేని కోణాల మధ్య విస్తృతమైన ధార్మిక ఉద్రిక్తతను ఈ వచనం స్వయంగా పరిష్కరించదు; అందువల్ల అనువాదం కూడా దానిని పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘నడుచు’ అనే నిబంధనాత్మక రూపకం రెండుసార్లు వచ్చిన మూల పునరుక్తిని సాధ్యమైనంతవరకు నిలిపింది. ముందుంచబడిన הַבַּיִת הַזֶּהను ‘ఈ మందిరం విషయానికొస్తే’గా చూపి హీబ్రూ వాక్యంలోని అంశ-ప్రాధాన్యాన్ని కాపాడింది. వివరణకు సంబంధించిన [a] గుర్తును ‘స్థిరపరుస్తాను’ తరువాత ఉంచి దాని సరైన పదబంధంతో అనుసంధానించింది.
