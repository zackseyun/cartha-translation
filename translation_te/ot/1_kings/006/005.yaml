  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన నిర్మాణ పదజాలాన్ని వాడాం. మూలంలోని ‘చుట్టూ’ అనే పునరుక్తిని కొంత భారంగా అనిపించినా ఉద్దేశపూర్వకంగా నిలిపాం; అరుదైన יצוע పదానికి అతిగా నిర్దిష్టమైన నిర్మాణ రూపాన్ని ఆపాదించలేదు.
