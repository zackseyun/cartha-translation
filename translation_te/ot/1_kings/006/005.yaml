  text: וַ/יִּבֶן֩ עַל קִ֨יר הַ/בַּ֤יִת יצוע סָבִ֔יב אֶת קִיר֤וֹת הַ/בַּ֨יִת֙ סָבִ֔יב לַֽ/הֵיכָ֖ל וְ/לַ/דְּבִ֑יר וַ/יַּ֥עַשׂ צְלָע֖וֹת סָבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/005.yaml
  text: He built against the wall of the house a structure all around[a], against the walls of the house all around, around both the nave and the inner sanctuary[c][b]; and he made side rooms all around.
translation:
  language: te
  text: అతడు మందిరపు గోడకు ఆనుకొని, మందిరపు గోడల చుట్టూ, ప్రధాన మండపానికీ[b] అంతర్గత పరిశుద్ధ స్థలానికీ[c] చుట్టూ ఒక కట్టడం[a] కట్టాడు; చుట్టూ పక్క గదులను నిర్మించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చుట్టూ ఉన్న అనుబంధ కట్టడం.” ఇక్కడి అరుదైన హీబ్రూ పదం יצוע మందిరపు గోడల చుట్టూ కట్టిన నిర్మాణాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ הֵיכָל ఇక్కడ అంతర్గత పరిశుద్ధ స్థలానికి భిన్నంగా ఉన్న మందిరపు ప్రధాన మండపాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా, “అతి పరిశుద్ధ స్థలం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: కట్టాడు
  rationale: హీబ్రూ కథనంలోని సాధారణ భూతకాల క్రియను ఆధునిక తెలుగు కథన శైలిలో సహజంగా తెలిపింది.
- source_word: עַל קִיר הַבַּיִת
  choice: మందిరపు గోడకు ఆనుకొని
  rationale: ఈ నిర్మాణ సందర్భంలో עַל అనేది గోడపై కాకుండా గోడను ఆనుకొని కట్టడాన్ని సూచిస్తుంది; הַבַּיִת ఇక్కడ యెహోవా మందిరాన్ని సూచిస్తుంది.
- source_word: יצוע
  choice: ఒక కట్టడం
  rationale: అరుదైన ఈ పదం మందిరం చుట్టూ ఉన్న అనుబంధ నిర్మాణాన్ని సూచిస్తుంది. దాని ఖచ్చితమైన నిర్మాణ రూపాన్ని నిర్ణయించకుండా విస్తృతార్థాన్ని నిలుపుతుంది.
- source_word: סָבִיב
  choice: చుట్టూ
  rationale: మూలంలో పదేపదే వచ్చిన ఈ పదం నిర్మాణం మందిరాన్ని పరివేష్టించిన విధానాన్ని నొక్కి చెబుతుంది; ఆ పునరుక్తిని తెలుగులోనూ సాధ్యమైనంతవరకు నిలిపాం.
- source_word: אֶת קִירוֹת הַבַּיִת
  choice: మందిరపు గోడల చుట్టూ
  rationale: బహువచనమైన ‘గోడలు’ను స్పష్టంగా నిలిపి, మందిర నిర్మాణపు బయటి గోడలను సూచిస్తుంది.
- source_word: לַהֵיכָל
  choice: ప్రధాన మండపానికి
  rationale: הֵיכָל ఇక్కడ అంతరాలయానికి భిన్నమైన మందిరపు ప్రధాన గదిని సూచిస్తుంది. సాధారణ పాఠకులకు అర్థమయ్యే నిర్మాణపరమైన పదంగా ‘ప్రధాన మండపం’ ఎంచుకున్నాం.
- source_word: וְלַדְּבִיר
  choice: అంతరాలయానికి
  rationale: דְּבִיר మందిరంలోని లోపలి పవిత్రస్థలాన్ని సూచిస్తుంది. ‘అంతరాలయం’ దాని ప్రత్యేక స్థానం, ప్రధాన మండపంతో దాని భేదం రెండింటినీ సంక్షిప్తంగా తెలుపుతుంది.
- source_word: וַיַּעַשׂ צְלָעוֹת
  choice: పక్క గదులను నిర్మించాడు
  rationale: צְלָעוֹת అనే పదానికి అక్షరార్థంగా ‘పక్కలు/ప్రక్కటెముకలు’ అనే భావం ఉన్నా, ఈ నిర్మాణ సందర్భంలో మందిరానికి ఆనుకొని ఉన్న పక్క గదులను సూచిస్తుంది.
