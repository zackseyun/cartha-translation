  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన నిర్మాణ-వివరణ శైలిని ఉపయోగించాం. ‘తాపడం చేయించాడు’ మరియు ‘అంతర్గర్భాలయం’ వంటి పదాలు సందర్భానికి తగిన ఖచ్చితత్వాన్ని ఇస్తాయి. మూలంలోని కర్మప్రత్యయ సందిగ్ధతను ‘దానిని’ ద్వారా నిలిపి ఉంచాం; పాదటిప్పణి గుర్తులన్నీ ప్రధాన పాఠంలో ఉన్నాయి.
