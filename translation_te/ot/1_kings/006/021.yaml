  yaml_path: translation/ot/1_kings/006/021.yaml
  text: Solomon overlaid the inside of the house with pure gold[a], and he drew gold chains across the front of the inner sanctuary[c][b], and overlaid it with gold.
translation:
  language: te
  text: సొలొమోను మందిరం లోపలి భాగాన్ని మేలిమి బంగారంతో[a] తాపడం చేశాడు. అతడు అంతర్గర్భాలయం[c] ముందు అడ్డంగా బంగారు గొలుసులను సాగదీసి[b], దానిని బంగారంతో తాపడం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శుద్ధిచేసిన బంగారంతో.’ హీబ్రూ పదబంధం అక్షరార్థంగా ‘మూసిన బంగారం’ అని ఉంటుంది; ఇది అత్యున్నత నాణ్యతగల బంగారాన్ని సూచించే నుడికారంగా కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అంతర్గర్భాలయం ముందు బంగారు గొలుసులను సాగదీసి.’ హీబ్రూ మాటలు అక్షరార్థంగా గొలుసులను అంతర్గర్భాలయం ముందు ఉంచినట్లు చెబుతాయి; ‘అడ్డంగా’ అనేది ‘దాటేలా చేశాడు’ అనే క్రియ సూచించే సంభావ్య అమరికను ప్రతిబింబిస్తుంది.
    reason: alternative_reading
  - marker: c
    text: ‘అంతర్గర్భాలయం’ అంటే మందిరంలోని అత్యంత లోపలి గది; తరువాత దీనిని ‘అతి పరిశుద్ధ స్థలం’ అని పిలిచారు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַף
  choice: తాపడం చేయించాడు
  rationale: ఆలయ నిర్మాణ సందర్భంలో צפה ఒక ఉపరితలంపై లోహపు పొరను కప్పించడాన్ని సూచిస్తుంది. రాజైన సొలొమోను పని చేయించిన భావాన్ని సహజ తెలుగులో ఈ ప్రయోగం తెలియజేస్తుంది.
- source_word: הַבַּיִת
  choice: మందిరం
  rationale: మూలంలో అక్షరార్థంగా ‘ఇల్లు’ ఉన్నా, తక్షణ సందర్భంలో ఇది యెహోవా మందిరాన్ని సూచిస్తుంది; ఆధునిక తెలుగు పాఠకునికి ‘మందిరం’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: מִפְּנִימָה
  choice: లోపలి భాగాన్ని
  rationale: మందిరపు అంతర్భాగాన్ని సూచించే స్థలార్థాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: זָהָב סָגוּר
  choice: మేలిమి బంగారం
  rationale: సָגוּר అక్షరార్థంగా ‘మూసినది’ అనే భావం ఉన్న అరుదైన విశేషణం; ఇక్కడ అది అత్యున్నత నాణ్యతగల లేదా శుద్ధిచేసిన బంగారాన్ని సూచించే జాతీయంగా అర్థమవుతుంది. ‘మేలిమి బంగారం’ సహజంగా ఈ భావాన్ని అందిస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וַיְעַבֵּר
  choice: అడ్డంగా ... అమర్చించి
  rationale: హిఫీల్ రూపం ‘దాటేలా చేయడం/సాగనంపడం’ అనే భావాన్ని ఇస్తుంది. గొలుసులను అంతర్గర్భాలయం ముఖభాగం మీదుగా అడ్డంగా ఉంచిన సంభావ్య అమరికను ఇది సహజ తెలుగులో తెలియజేస్తుంది; స్థలార్థంలోని అనిశ్చితిని పాదటిప్పణి సంరక్షిస్తుంది.
- source_word: בְּרַתּוּקוֹת
  choice: గొలుసులను
  rationale: ఈ అరుదైన నామవాచకానికి సందర్భానుసారంగా బంగారు గొలుసులు అనే అర్థమే విస్తృతంగా సమర్థించబడుతుంది.
- source_word: לִפְנֵי הַדְּבִיר
  choice: అంతర్గర్భాలయం ముందు అడ్డంగా
  rationale: לִפְנֵי సాధారణంగా ‘ముందు’ అని సూచిస్తుంది; וַיְעַבֵּר‌తో కలిపి గొలుసులు దాని ముఖభాగం మీదుగా సాగినట్లు భావించవచ్చు. ప్రధాన పాఠంలో సంభావ్య అమరికను తెలిపి, మరింత అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: הַדְּבִיר
  choice: అంతర్గర్భాలయం
  rationale: דְּבִיר మందిరంలోని అత్యంత లోపలి గదిని సూచిస్తుంది. తరువాతి సాంకేతిక నామమైన ‘అతి పరిశుద్ధ స్థలం’ను ప్రధాన పాఠంలోకి ముందుగానే తీసుకురాకుండా, స్థల స్వభావాన్ని ఈ పదం తెలియజేస్తుంది.
- source_word: וַיְצַפֵּהוּ
  choice: దానిని ... తాపడం చేయించాడు
  rationale: పుంలింగ ఏకవచన కర్మప్రత్యయాన్ని ‘దానిని’గా ఉంచడం ద్వారా అది అంతర్గర్భాలయాన్నా, దాని ముందుభాగాన్నా సూచిస్తుందనే స్వల్ప సందిగ్ధతను అతిగా నిర్దిష్టం చేయకుండా సంరక్షించాం.
