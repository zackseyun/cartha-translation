  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי כֵ֣ן צִוָּ֣ה אֹתִ֗/י בִּ/דְבַ֤ר יְהוָה֙ לֵ/אמֹ֔ר לֹא תֹ֥אכַל לֶ֖חֶם וְ/לֹ֣א תִשְׁתֶּה מָּ֑יִם וְ/לֹ֣א תָשׁ֔וּב בַּ/דֶּ֖רֶךְ אֲשֶׁ֥ר הָלָֽכְתָּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/009.yaml
  text: For this is what he commanded me by the word of the LORD, saying, ‘You shall not eat bread, nor drink water, nor return by the way that you went.’
translation:
  language: te
  text: 'ఎందుకంటే, యెహోవా వాక్కు ద్వారా ఆయన నాకు ఇలా ఆజ్ఞాపించాడు: ‘నీవు రొట్టె తినకూడదు, నీరు తాగకూడదు, నీవు వెళ్లిన దారిలో తిరిగి రాకూడదు.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּדְבַר יְהוָה
  choice: యెహోవా వాక్కు ద్వారా
  rationale: దైవనామాన్ని యెహోవా అని లిప్యంతరీకరించి, בְּ సాధనార్థాన్ని ‘ద్వారా’తోను דְּבַר ను సందర్భానుసారంగా ‘వాక్కు’తోను వ్యక్తపరుస్తుంది.
- source_word: לֶחֶם
  choice: రొట్టె
  rationale: మూలంలోని సాధారణ ఆహారపదమైన ‘bread’ను సహజమైన తెలుగు పదంతో నేరుగా అనువదిస్తుంది.
- source_word: תָשׁוּב
  choice: తిరిగి రాకూడదు
  rationale: שׁוב యొక్క తిరిగి రావడం అనే భావాన్ని, ప్రయాణ సందర్భానికి సరిపోయే తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: בַּדֶּרֶךְ אֲשֶׁר הָלָכְתָּ
  choice: నీవు వెళ్లిన దారిలో
  rationale: הלך ను ‘వెళ్లిన’ అని అనువదించి, మూలంలోని ‘నీవు వెళ్లిన మార్గం’ అనే భావాన్ని ‘వచ్చిన దారి’గా మార్చకుండా కాపాడుతుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ప్రత్యేక దైవనామం ఉన్నందున దానిని సాధారణ బిరుదుతో భర్తీ చేయకుండా సాంప్రదాయ తెలుగు రూపంలో చూపుతుంది.
- issue: ఆజ్ఞ ఇచ్చిన కర్తకు సర్వనామం
  choice: ఆయన
  alternative: యెహోవా
  rationale: మూలంలోని צִוָּה లో కర్త వ్యాకరణపరంగా మూడవ పురుష ఏకవచనం; సందర్భం యెహోవాను సూచించినప్పటికీ, మూలంలోని సర్వనామ నిర్మాణాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ప్రత్యక్ష వాక్యంలోని మూడు నిషేధాలను సమాంతరంగా ఉంచి మూల వాక్య నిర్మాణం, బలాన్ని కాపాడింది.
