id: 1KI.13.23
reference: 1 Kings 13:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחֲרֵ֛י אָכְל֥/וֹ לֶ֖חֶם וְ/אַחֲרֵ֣י שְׁתוֹת֑/וֹ וַ/יַּחֲבָשׁ ל֣/וֹ הַ/חֲמ֔וֹר לַ/נָּבִ֖יא אֲשֶׁ֥ר הֱשִׁיבֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/023.yaml
  text: And it happened[a], after he had eaten bread and after he had drunk, that he saddled the donkey for him, for the prophet whom he had brought back.
translation:
  language: te
  text: ఆ ప్రవక్త భోజనం చేసి, తాగిన తరువాత, అతన్ని తిరిగి తీసుకొచ్చినవాడు అతని కోసం గాడిదకు జీను కట్టాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతన్ని తిరిగి వచ్చేలా చేసినవాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[తెలుగులో ప్రత్యేక పదంగా అనువదించకుండా కథన క్రమంలో వ్యక్తీకరించబడింది]'
  rationale: హీబ్రూ కథనంలో తదుపరి సంఘటనను పరిచయం చేసే సాధారణ wayyiqtol సూత్రం. తెలుగులో ‘అప్పుడు జరిగింది’ అని విడిగా చేర్చడం అసహజంగా ఉంటుంది; వాక్య క్రమమే దాని పనిని సహజంగా నెరవేరుస్తుంది.
- source_word: אַחֲרֵי אָכְלוֹ לֶחֶם
  choice: అతడు భోజనం చేసి ... తరువాత
  rationale: లֶחֶם అక్షరార్థంగా ‘రొట్టె/ఆహారం’; ఈ సందర్భంలో భోజనం చేయడాన్ని సూచించే సహజ తెలుగు ప్రయోగం ‘భోజనం చేసి’. కాలక్రమ సంబంధాన్ని ‘తరువాత’ నిలుపుతుంది.
- source_word: וְאַחֲרֵי שְׁתוֹתוֹ
  choice: తాగిన తరువాత
  rationale: మూలంలో పానీయపు కర్మ చెప్పబడలేదు; కాబట్టి నీరు లేదా ద్రాక్షారసం అని సరఫరా చేయకుండా ఉంచబడింది.
- source_word: וַיַּחֲבָשׁ
  choice: జీను కట్టాడు
  rationale: חבש ఇక్కడ జంతువును ప్రయాణానికి సిద్ధం చేస్తూ దానికి జీను కట్టడాన్ని సూచిస్తుంది.
- source_word: לוֹ ... לַנָּבִיא
  choice: ప్రవక్త కోసం
  rationale: ל pronominal suffix ప్రయోజనార్థాన్ని సూచిస్తుంది; తరువాతి ‘ప్రవక్త కోసం’ అనే వివరణతో కలిపి సహజ తెలుగులో ఒక్కసారి వ్యక్తీకరించబడింది.
- source_word: הַחֲמוֹר
  choice: గాడిద
  rationale: ఆధునిక ప్రామాణిక తెలుగులో సాధారణమైన, ఖచ్చితమైన పదం.
- source_word: לַנָּבִיא
  choice: ప్రవక్త
  rationale: ఈ వాక్యంలో మూలపాఠం ప్రత్యేకంగా ‘ప్రవక్త’ అని చెబుతుంది; ‘దేవుని మనిషి’ అని మార్చలేదు.
- source_word: אֲשֶׁר הֱשִׁיבוֹ
  choice: తాను తిరిగి తీసుకొచ్చిన
  rationale: שוב యొక్క హిఫిల్ రూపం ‘తిరిగి వచ్చేలా చేయడం/తిరిగి తీసుకురావడం’ అనే causative భావాన్ని ఇస్తుంది. కథా సందర్భంలో ‘తిరిగి తీసుకొచ్చిన’ సహజంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే కథన శైలి. ‘రొట్టె తిని’ అనే అక్షరానువాదం బదులు సందర్భార్థమైన ‘భోజనం చేసి’ వాడబడింది. ప్రధాన పాఠంలోని [a] గుర్తు ప్రత్యామ్నాయ causative భావాన్ని సూచిస్తుంది.
