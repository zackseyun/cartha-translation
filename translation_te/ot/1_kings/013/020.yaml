id: 1KI.13.20
reference: 1 Kings 13:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֕י הֵ֥ם יֹשְׁבִ֖ים אֶל הַ/שֻּׁלְחָ֑ן וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל הַ/נָּבִ֖יא אֲשֶׁ֥ר הֱשִׁיבֽ/וֹ־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/020.yaml
  text: And it happened, as they were sitting at the table, that the word of Yahweh came to the prophet who had brought him back.
translation:
  language: te
  text: అప్పుడు వారు బల్ల వద్ద కూర్చొని ఉండగా, అతన్ని తిరిగి తీసుకొచ్చిన ప్రవక్తకు యాహ్వే వాక్యం వచ్చింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: వచ్చింది
  rationale: హీబ్రూ కథన క్రమాన్ని తెలుగులో సహజంగా కొనసాగిస్తూ, వాక్యం చివర ప్రధాన సంఘటనగా వ్యక్తపరచబడింది; విడిగా ‘అప్పుడు జరిగింది’ అని చేర్చడం తెలుగు వాక్యాన్ని భారంగా చేస్తుంది.
- source_word: הֵם יֹשְׁבִים
  choice: వారు ... కూర్చొని ఉండగా
  rationale: సర్వనామం-కృదంత నిర్మాణంలోని కొనసాగుతున్న స్థితిని సహజమైన ఆధునిక తెలుగులో చూపిస్తుంది.
- source_word: אֶל הַשֻּׁלְחָן
  choice: బల్ల దగ్గర
  rationale: యథార్థంగా ‘బల్ల వైపు’ అనే భావం ఉన్నా, కూర్చోవడం మరియు భోజన సందర్భంలో ‘బల్ల దగ్గర’ అనేది సహజమైన తెలుగు ప్రయోగం.
- source_word: דְּבַר יְהוָה
  choice: యాహ్వే వాక్కు
  rationale: ప్రవచన ప్రకటనకు వాడే స్థిరమైన హీబ్రూ పదబంధాన్ని గంభీరంగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యనుకరణగా అందిస్తుంది.
- source_word: אֶל הַנָּבִיא
  choice: ప్రవక్తకు
  rationale: దైవిక సందేశాన్ని స్వీకరించిన వ్యక్తిని సూచించే אֶל‌ను తెలుగులో సహజమైన సంప్రదాన విభక్తితో వ్యక్తపరుస్తుంది.
- source_word: אֲשֶׁר הֱשִׁיבוֹ
  choice: అతన్ని తిరిగి తీసుకొచ్చిన
  rationale: שׁוב్ హిఫీల్ రూపంలోని కారణార్థాన్ని, పురుష ఏకవచన కర్మప్రత్యయాన్ని నిలుపుతూ కథా సందర్భానికి సరిపోయే సహజమైన రూపం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా నేరుగా ధ్వన్యనుకరణ చేయడం; ‘యెహోవా’ కంటే ‘యాహ్వే’ హీబ్రూ నామానికి దగ్గరైన ఆధునిక రూపం.
- issue: వాక్కు వచ్చిన ప్రవక్త ఎవరు?
  choice: అతన్ని తిరిగి తీసుకొచ్చిన ప్రవక్త
  alternative: దేవుని మనిషి
  rationale: సంబంధవాచక ఉపవాక్యం వ్యాకరణపరంగా ‘ప్రవక్త’నే నిర్దేశిస్తుంది. కథనంలోని ఉద్రిక్తతను వివరణతో సడలించకుండా మూలపాఠం ప్రకారమే ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా ఉండేలా సహజమైన వాక్యక్రమం, అయితే ‘యాహ్వే వాక్కు’ అనే ప్రవచన సూత్రానికి తగిన గంభీరత నిలుపబడింది.
