source:
  edition: WLC
  text: כִּֽי דָבָ֤ר אֵלַ/י֙ בִּ/דְבַ֣ר יְהוָ֔ה לֹֽא תֹאכַ֣ל לֶ֔חֶם וְ/לֹֽא תִשְׁתֶּ֥ה שָׁ֖ם מָ֑יִם לֹא תָשׁ֣וּב לָ/לֶ֔כֶת בַּ/דֶּ֖רֶךְ אֲשֶׁר הָלַ֥כְתָּ בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/017.yaml
  text: 'For a word came to me by the word of the LORD: ‘You shall not eat bread, and you shall not drink water there; you shall not return by going on the way by which you went.’'
translation:
  language: te
  text: 'ఎందుకంటే యెహోవా వాక్కు ద్వారా నాకు ఈ మాట చెప్పబడింది: ‘నువ్వు అక్కడ రొట్టె తినకూడదు, నీళ్లు తాగకూడదు; నువ్వు వెళ్లిన మార్గంలో తిరిగి వెళ్లకూడదు.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דָבָר אֵלַי בִּדְבַר יְהוָה
  choice: యెహోవా వాక్కు ద్వారా నాకు ఇలా ఆజ్ఞ వచ్చింది
  rationale: ద్విరుక్తిగా ఉన్న דָבָר / בִּדְבַר నిర్మాణాన్ని సహజమైన తెలుగులో అందిస్తూ, సందర్భంలో ఇది కేవలం సమాచారం కాక దైవిక ఆజ్ఞ అని స్పష్టం చేస్తుంది.
- source_word: לֹא תֹאכַל לֶחֶם
  choice: ఆహారం తినకూడదు
  rationale: లֶחֶם అక్షరార్థంగా ‘రొట్టె’ అయినా, ఈ సందర్భంలో సాధారణ ఆహారాన్ని సూచిస్తుంది; ఆధునిక తెలుగు పాఠకునికి సహజంగా ‘ఆహారం’ అని అనువదించబడింది.
- source_word: לֹא תָשׁוּב לָלֶכֶת
  choice: తిరిగి వెళ్లకూడదు
  rationale: ‘తిరిగి వెళ్లడానికి మరలకూడదు’ అనే హెబ్రీయ నిర్మాణ భావాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: בַּדֶּרֶךְ אֲשֶׁר הָלַכְתָּ בָּהּ
  choice: నువ్వు వెళ్లిన దారిలో
  rationale: అదే ప్రయాణ మార్గాన్ని సూచించే సంబంధవాక్యాన్ని సహజ తెలుగు పదక్రమంలో నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יהוה ప్రతిరూపం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలోని ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపంలో నిలుపుతుంది.
- issue: דָבָר ను ‘వాక్కు’ లేదా ‘ఆజ్ఞ’గా వ్యక్తీకరించడం
  choice: యెహోవా వాక్కు ద్వారా ... ఆజ్ఞ వచ్చింది
  alternative: యెహోవా వాక్కు ద్వారా నాకు ఒక మాట వచ్చింది
  rationale: దైవిక వాక్కు అనే భావాన్ని కాపాడుతూ, తరువాత వచ్చే నిషేధాలు ఆజ్ఞలని సందర్భానుసారంగా తెలియజేస్తుంది; అదనపు సిద్ధాంతార్థం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభంగా అర్థమయ్యే శైలి. ప్రత్యక్ష సంభాషణలో ఏకవచన ‘నువ్వు’ వాడి హెబ్రీయ రెండవ పురుష ఏకవచనాన్ని సహజంగా ప్రతిబింబించింది.
