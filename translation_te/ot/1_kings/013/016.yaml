  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לֹ֥א אוּכַ֛ל לָ/שׁ֥וּב אִתָּ֖/ךְ וְ/לָ/ב֣וֹא אִתָּ֑/ךְ וְ/לֹֽא אֹ֣כַל לֶ֗חֶם וְ/לֹֽא אֶשְׁתֶּ֤ה אִתְּ/ךָ֙ מַ֔יִם בַּ/מָּק֖וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/016.yaml
  text: And he said[a], “I cannot return with you or go with you, and I will not eat bread or drink water with you in this place.”
translation:
  language: te
  text: 'అతడు ఇలా చెప్పాడు: “నేను నీతో[a] తిరిగి రాలేను, నీతో వెళ్లలేను; ఈ స్థలంలో నీతో రొట్టె తినను, నీళ్లు తాగను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠ్యంలో మొదటి రెండు చోట్ల ‘నీతో’ అనే పదానికి స్త్రీలింగ ఏకవచన ప్రత్యయం ఉంది; తినడం, తాగడం గురించి చెప్పే భాగంలో మాత్రం పుంలింగ ఏకవచన ప్రత్యయం ఉంది. తెలుగులో ‘నీతో’ అనే రూపం ఈ లింగభేదాన్ని చూపదు.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అతడు … అని చెప్పాడు
  rationale: హీబ్రూ కథనంలోని సాధారణ wayyiqtol రూపాన్ని సహజమైన తెలుగు ప్రత్యక్ష సంభాషణ నిర్మాణంలో అందిస్తుంది.
- source_word: לֹא אוּכַל
  choice: నేను … రాలేను
  rationale: నిషేధంతో కూడిన יכל ఇక్కడ అసమర్థతను లేదా చేయలేని నిర్బంధాన్ని సూచిస్తుంది; ‘రాలేను’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: לָשׁוּב
  choice: తిరిగి రా
  rationale: שׁוב యొక్క ‘తిరిగి రావడం/వెళ్లడం’ భావాన్ని సందర్భానుసారంగా ‘తిరిగి రా’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וְלָבוֹא
  choice: నీతో వెళ్లలేను
  rationale: בוא సందర్భం, దృష్టికోణం బట్టి రావడం లేదా వెళ్లడం అని అర్థమవుతుంది. ఆహ్వానించిన వ్యక్తితో అతని ఇంటికి వెళ్లడమే సందర్భం కాబట్టి ‘వెళ్లలేను’ సహజమైన ఎంపిక; ‘తిరిగి’ అనే ముందు క్రియతో తేడా కూడా నిలుస్తుంది.
- source_word: וְלֹא אֹכַל לֶחֶם
  choice: రొట్టె తినను
  rationale: לֶחֶם సాధారణంగా ఆహారాన్ని కూడా సూచించగలిగినా, చుట్టుపక్కల వచనాల్లో పునరావృతమయ్యే నిర్దిష్ట పదబంధాన్ని నిలుపుతూ ‘రొట్టె’ అని అనువదించబడింది.
- source_word: וְלֹא אֶשְׁתֶּה ... מַיִם
  choice: నీళ్లు తాగను
  rationale: మూలంలోని ‘నీరు తాగడం’ అనే స్పష్టమైన భావాన్ని సహజమైన ఆధునిక తెలుగు బహువచన వాడుక ‘నీళ్లు’తో అందిస్తుంది.
- source_word: אִתָּךְ / אִתְּךָ
  choice: నీతో
  rationale: తెలుగులో ద్వితీయ పురుష ఏకవచన రూపం లింగభేదాన్ని చూపదు. అందువల్ల హీబ్రూలోని స్త్రీలింగం నుంచి పుంలింగానికి మార్పు ప్రధాన పాఠ్యంలో కనిపించదు; దాన్ని పాదసూచికలో తెలిపాం.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: ఈ స్థలంలో
  rationale: స్థలాన్ని స్పష్టంగా సూచించే మూల పదబంధాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో నేరుగా ప్రతిబింబిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని ‘రొట్టె’, ‘నీళ్లు’, ‘ఈ స్థలంలో’ అనే స్పష్టమైన పదాలను నిలిపి, తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా ఉద్ధరణ క్రియను చివర ఉంచాం.
