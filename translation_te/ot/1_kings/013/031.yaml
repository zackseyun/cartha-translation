  text: וַ/יְהִי֮ אַחֲרֵ֣י קָבְר֣/וֹ אֹת/וֹ֒ וַ/יֹּ֤אמֶר אֶל בָּנָי/ו֙ לֵ/אמֹ֔ר בְּ/מוֹתִ/י֙ וּ/קְבַרְתֶּ֣ם אֹתִ֔/י בַּ/קֶּ֕בֶר אֲשֶׁ֛ר אִ֥ישׁ הָ/אֱלֹהִ֖ים קָב֣וּר בּ֑/וֹ אֵ֚צֶל עַצְמֹתָ֔י/ו הַנִּ֖יחוּ אֶת עַצְמֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/031.yaml
  text: And it happened, after he had buried him, that he said to his sons, “When I die, bury me in the tomb where the man of God is buried; lay my bones beside his bones.”
translation:
  language: te
  text: 'అతడు అతన్ని సమాధి చేసిన తరువాత, తన కుమారులతో ఇలా అన్నాడు: “నేను చనిపోయినప్పుడు, దేవుని మనిషి సమాధి చేయబడిన సమాధిలోనే నన్ను సమాధి చేయండి. అతని ఎముకల పక్కన నా ఎముకలను ఉంచండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי קָבְרוֹ אֹתוֹ
  choice: అతడు అతన్ని సమాధి చేసిన తరువాత
  rationale: హీబ్రూ కథన సూత్రాన్ని తెలుగులో సహజమైన కాలవాచక ఉపవాక్యంగా అందిస్తుంది. వַיְהִיని విడిగా అనువదిస్తే తెలుగు వాక్యం కృత్రిమంగా ఉండే అవకాశం ఉన్నందున, దాని కథన కొనసాగింపు భావాన్ని ఈ నిర్మాణంలో కలిపాం.
- source_word: בָּנָיו
  choice: తన కుమారులతో
  rationale: మూలంలోని పురుషలింగ బహువచనాన్ని సాధారణీకరించకుండా ఖచ్చితంగా నిలుపుతుంది.
- source_word: בְּמוֹתִי
  choice: నేను చనిపోయినప్పుడు
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయంతో ఉన్న కాలార్థక రూపానికి సహజమైన ఆధునిక తెలుగు.
- source_word: וּקְבַרְתֶּם אֹתִי
  choice: నన్ను సమాధి చేయండి
  rationale: ఈ సందర్భంలో కుమారులకు ఇచ్చిన ఆదేశాన్ని గౌరవపూర్వక బహువచన ఆజ్ఞారూపంలో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בַּקֶּבֶר
  choice: సమాధిలోనే
  rationale: ఒక నిర్దిష్టమైన, అనేకుల అవశేషాలకు స్థలమున్న సమాధిని సూచిస్తుంది; ‘నే’ మూలంలోని సంబంధిత స్థలంపై ఉన్న దృష్టిని సహజంగా తెలియజేస్తుంది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: ఈ కథనమంతటా ఉన్న హీబ్రూ బిరుదును ‘ప్రవక్త’గా సంకుచితం చేయకుండా నేరుగా అనువదిస్తుంది.
- source_word: קָבוּר בּוֹ
  choice: సమాధి చేయబడిన
  rationale: హీబ్రూ స్థితివాచక కర్మణి భావాన్ని సంబంధవాచక నిర్మాణంలో స్పష్టంగా అందిస్తుంది.
- source_word: אֵצֶל
  choice: పక్కన
  rationale: స్థలసామీప్యాన్ని సరళంగా, సహజంగా తెలియజేస్తుంది.
- source_word: עַצְמֹתָיו ... עַצְמֹתָי
  choice: అతని ఎముకలు ... నా ఎముకలు
  rationale: ‘అవశేషాలు’ అని సాధారణీకరించకుండా, మూలంలోని స్పష్టమైన సమాధి చిత్రణను నిలుపుతుంది.
- source_word: הַנִּיחוּ
  choice: ఉంచండి
  rationale: ఎముకలను పక్కన పెట్టాలనే ప్రత్యక్ష ఆదేశానికి ఆధునిక తెలుగులో సహజమైన పదం.
