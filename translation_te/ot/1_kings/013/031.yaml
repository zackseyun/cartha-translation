translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. మూలంలో ఉన్న సర్వనామాల పునరుక్తి వల్ల తెలుగులో స్వల్ప అస్పష్టత ఉన్నా, ముందరి సందర్భం దానిని నిర్ధారిస్తుంది; అదనపు పేర్లను చేర్చి మూలాన్ని వివరణాత్మకంగా మార్చలేదు.
