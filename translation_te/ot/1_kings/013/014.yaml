source:
  edition: WLC
  text: וַ/יֵּ֗לֶךְ אַֽחֲרֵי֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים וַ/יִּ֨מְצָאֵ֔/הוּ יֹשֵׁ֖ב תַּ֣חַת הָ/אֵלָ֑ה וַ/יֹּ֣אמֶר אֵלָ֗י/ו הַ/אַתָּ֧ה אִישׁ הָ/אֱלֹהִ֛ים אֲשֶׁר בָּ֥אתָ מִֽ/יהוּדָ֖ה וַ/יֹּ֥אמֶר אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/014.yaml
  text: So he went after the man of God and found him sitting under the terebinth[a], and he said to him, “Are you the man of God who came from Judah?” And he said, “I am.”
translation:
  language: te
  text: 'అప్పుడు అతడు దేవుని మనిషి వెంట వెళ్లి, టెరెబింతు చెట్టు[a] కింద కూర్చొని ఉన్న అతనిని కనుగొన్నాడు. అతడు అతనితో ఇలా అన్నాడు: “యూదా నుండి వచ్చిన దేవుని మనిషి నువ్వేనా?” అతడు, “నేనే” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఓక్ చెట్టు.” హీబ్రూ אֵלָה పదం మరింత నిర్దిష్టంగా టెరెబింతు చెట్టును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ אַחֲרֵי
  choice: వెనుక వెళ్లి
  rationale: הלך אחרי అనే ప్రయోగం ఒకరి వెనుక వెళ్లడాన్ని సూచిస్తుంది. ఈ సందర్భంలో వెంబడింపు భావాన్ని అతిగా చేర్చకుండా కథనంలోని కదలికను సహజంగా నిలుపుతుంది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: మూలంలోని స్థిరమైన బిరుదును నేరుగా నిలుపుతుంది; దానిని ‘దేవుని ప్రవక్త’గా వ్యాఖ్యానించి పదవిని సంకుచితం చేయదు.
- source_word: וַיִּמְצָאֵהוּ
  choice: అతడిని కనుగొన్నాడు
  rationale: מצא అనే సాధారణ కథన క్రియకు సందర్భానుగుణమైన ప్రత్యక్ష సమానార్థకం.
- source_word: יֹשֵׁב
  choice: కూర్చొని ఉండగా
  rationale: అతడు కనిపించిన సమయంలోని భంగిమను తెలియజేసే వర్తమాన కృదంత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: תַּחַת הָאֵלָה
  choice: మస్తకి చెట్టు కింద
  rationale: אֵלָה ప్రధానంగా terebinth చెట్టును సూచిస్తుంది. ఆధునిక తెలుగు పాఠకునికి వృక్షార్థం స్పష్టమయ్యేలా ‘చెట్టు’ను చేర్చాం.
- source_word: הַאַתָּה
  choice: నువ్వేనా?
  rationale: గుర్తింపును నిర్ధారించే ప్రశ్నలో సర్వనామంపై ఉన్న ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר בָּאתָ מִיהוּדָה
  choice: యూదా నుండి వచ్చిన
  rationale: మూలంలోని సంబంధవాచక ఉపవాక్యాన్ని, ప్రదేశం నుండి వచ్చిన భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: אָנִי
  choice: నేనే
  rationale: హీబ్రూలోని సంక్షిప్త నామవాచక ప్రత్యుత్తరం అక్షరార్థంగా ‘నేను’; ప్రశ్నకు ధృవీకరణగా తెలుగులో ‘నేనే’ సహజంగా, సంక్షిప్తంగా ఉంటుంది.
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים అనే బిరుదు అనువాదం
  choice: దేవుని మనిషి
  alternative: దేవుని ప్రవక్త
  rationale: హీబ్రూ బిరుదును నేరుగా, ఈ కథనం అంతటా స్థిరంగా అనువదించడం ద్వారా మూలంలోని విస్తృత భావాన్ని కాపాడి, దానిని ఒక నిర్దిష్ట పదవిగా వ్యాఖ్యానించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. సంభాషణలో సందర్భానికి తగిన సాధారణ ఏకవచన రూపం ‘నువ్వు’ను వాడాం. అరుదైన వృక్షనామం కారణంగా ప్రధాన పాఠంలో ‘మస్తకి చెట్టు’ను ఉంచి, ప్రత్యామ్నాయ గుర్తింపులను పాదసూచికలో ఇచ్చాం.
