translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. రెండవ వాక్యం మొదటి ప్రశ్నకు నేపథ్య కారణాన్ని ఇస్తున్నందున సంధిని ‘ఎందుకంటే’గా వ్యక్తం చేశారు. ‘దేవుని మనిషి’ అనే మూల బిరుదును వ్యాఖ్యానాత్మకంగా మార్చలేదు.
