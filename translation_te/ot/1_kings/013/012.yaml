  text: וַ/יְדַבֵּ֤ר אֲלֵ/הֶם֙ אֲבִי/הֶ֔ם אֵֽי זֶ֥ה הַ/דֶּ֖רֶךְ הָלָ֑ךְ וַ/יִּרְא֣וּ בָנָ֗י/ו אֶת הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֤ר הָלַךְ֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֲשֶׁר בָּ֖א מִ/יהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/012.yaml
  text: And their father said to them, “Which way did he go?” For his sons had seen the way that the man of God, who came from Judah, had gone.
translation:
  language: te
  text: వారి తండ్రి వారితో, “అతడు ఏ దారిన వెళ్లాడు?” అన్నాడు. ఎందుకంటే, అతని కుమారులు యూదా నుండి వచ్చిన దేవుని మనిషి వెళ్లిన దారిని చూశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అన్నాడు
  rationale: ప్రత్యక్ష సంభాషణను పరిచయం చేస్తున్న సందర్భంలో ‘మాట్లాడాడు’ కంటే ‘అన్నాడు’ సహజమైన తెలుగు; హీబ్రూ క్రియ యొక్క కథన విధిని నిలుపుతుంది.
- source_word: אֲבִיהֶם
  choice: వారి తండ్రి
  rationale: మూడవ పురుష బహువచన ప్రత్యయం ముందుగా ప్రస్తావించిన కుమారులను సూచిస్తుంది; అందువల్ల ‘వారి తండ్రి’ రూపం సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: ఏ దారిన
  rationale: ఇది కేవలం ఉన్న స్థలాన్ని కాకుండా అతడు తీసుకున్న మార్గాన్ని అడుగుతోంది; ఆధునిక తెలుగులో ‘ఏ దారిన’ సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: הָלָךְ
  choice: వెళ్లాడు / వెళ్లిన
  rationale: ఒకే హీబ్రూ క్రియను ప్రశ్నలో సమాపక రూపంగానూ, సంబంధ వాక్యంలో విశేషణాత్మక రూపంగానూ తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా అందించారు.
- source_word: וַיִּרְאוּ
  choice: చూశారు
  rationale: హీబ్రూ కథన భూతకాలాన్ని సరళ భూతకాలంగా అనువదించారు; సందర్భమే వారు ముందుగా దారిని చూశారని తెలియజేస్తుంది.
- source_word: בָנָיו
  choice: ఆ తండ్రి కుమారులు
  rationale: అసలు పాఠంలోని ఏకవచన స్వామ్యసూచక ప్రత్యయం తండ్రిని సూచిస్తుంది. తెలుగులో సమీపంలోని ‘దేవుని మనిషి’తో తప్పుగా అన్వయించకుండా ‘ఆ తండ్రి కుమారులు’ అని స్పష్టం చేశారు.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: హీబ్రూ బిరుదును ‘దేవుని ప్రవక్త’ అని మరింత సంకుచితం చేయకుండా యథాశక్తి నేరుగా నిలుపుతుంది.
- source_word: מִיהוּדָה
  choice: యూదా నుంచి
  rationale: మూలస్థానాన్ని సూచించే హీబ్రూ ఉపసర్గకు ఇది సహజమైన ఆధునిక తెలుగు రూపం.
