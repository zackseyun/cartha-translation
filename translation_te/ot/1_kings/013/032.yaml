source:
  edition: WLC
  text: כִּי֩ הָיֹ֨ה יִהְיֶ֜ה הַ/דָּבָ֗ר אֲשֶׁ֤ר קָרָא֙ בִּ/דְבַ֣ר יְהוָ֔ה עַל הַ/מִּזְבֵּ֖חַ אֲשֶׁ֣ר בְּ/בֵֽית אֵ֑ל וְ/עַל֙ כָּל בָּתֵּ֣י הַ/בָּמ֔וֹת אֲשֶׁ֖ר בְּ/עָרֵ֥י שֹׁמְרֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/032.yaml
  text: For the word that he cried out by the word of Yahweh against the altar that is in Bethel[a], and against all the houses of the high places that are in the cities of Samaria[b], will surely come to pass.
translation:
  language: te
  text: ఎందుకంటే, యెహోవా మాటచొప్పున అతడు బేతేలులోని బలిపీఠానికి వ్యతిరేకంగా, సమరయ పట్టణాల్లోని ఉన్నత స్థలాల ఇళ్లన్నిటికి వ్యతిరేకంగా బిగ్గరగా ప్రకటించిన మాట తప్పకుండా నెరవేరుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిశ్చయంగా జరుగుతుంది.” హీబ్రూలో నిశ్చయతను బలంగా తెలియజేసే క్రియా నిర్మాణం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందరి వచనంలోని సమాధి అభ్యర్థనకు కారణాన్ని తెలియజేసే వివరణాత్మక సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָיֹה יִהְיֶה
  choice: తప్పకుండా నెరవేరుతుంది
  rationale: అనంత క్రియారూపం మరియు అసంపూర్ణ క్రియ కలయిక ప్రవచనం నిశ్చయంగా జరుగుతుందనే ఉద్ఘాటనను సూచిస్తుంది; ప్రవచన సందర్భంలో ‘నెరవేరుతుంది’ సహజంగా ఉంది.
- source_word: הַדָּבָר
  choice: మాట
  rationale: ఇక్కడ ఇది సాధారణ విషయం కంటే పలికిన ప్రవచన సందేశాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר קָרָא
  choice: బిగ్గరగా ప్రకటించిన
  rationale: క్రియలోని బహిరంగంగా పిలిచి చెప్పే బలాన్ని ఉంచుతూ ఆధునిక తెలుగులో సహజంగా వినిపిస్తుంది.
- source_word: בִּדְבַר יְהוָה
  choice: యెహోవా మాట ప్రకారం
  rationale: ప్రవక్త పలికిన ప్రకటనకు దైవిక మూలం మరియు ఆధారం యెహోవా మాటేనని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: עַל
  choice: వ్యతిరేకంగా
  rationale: తీర్పు ప్రకటన లక్ష్యాన్ని సూచించే ఈ ఉపసర్గకు సందర్భానుకూలమైన భావం.
- source_word: הַמִּזְבֵּחַ
  choice: బలిపీఠం
  rationale: ఆరాధనా సందర్భంలోని altar‌కు ప్రామాణికమైన, సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: בְּבֵית אֵל
  choice: బేతేలులోని
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, బలిపీఠం ఉన్న ప్రదేశాన్ని సహజమైన తెలుగు నిర్మాణంలో సూచిస్తుంది.
- source_word: כָּל בָּתֵּי הַבָּמוֹת
  choice: ఉన్నత స్థలాల మందిరాలన్నీ
  rationale: ‘ఉన్నత స్థలాలు’ అనే ఆరాధనా పదాన్ని నిలుపుతూ, ‘ఇళ్లు’ అనే అక్షరార్థాన్ని సందర్భానికి తగిన ‘మందిరాలు’గా సహజీకరిస్తుంది; అక్షరార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: సమరయ పట్టణాల్లోని
  rationale: మూలంలోని భౌగోళిక సూచనను చారిత్రకంగా సవరించకుండా యథాతథంగా ఉంచుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉన్నందున దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించాం.
- issue: הָיֹה יִהְיֶה లోని ప్రవచన నిశ్చయత
  choice: తప్పకుండా నెరవేరుతుంది
  alternative: నిశ్చయంగా జరుగుతుంది
  rationale: హీబ్రూ నిర్మాణంలోని ఉద్ఘాటిత నిశ్చయతను కాపాడుతూ, ఇది పలికిన ప్రవచన ‘మాట’కు సంబంధించినదని సందర్భానుగుణంగా తెలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. ‘ఉన్నత స్థలాలు’ అనే స్థిరమైన ఆరాధనా పదాన్ని నిలిపి, దానికి సంబంధించిన ‘ఇళ్లు’ను ప్రధాన పాఠంలో సహజమైన ‘మందిరాలు’గా అందించాం.
