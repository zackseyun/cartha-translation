source:
  edition: WLC
  text: וְ/הִנֵּ֧ה אֲנָשִׁ֣ים עֹבְרִ֗ים וַ/יִּרְא֤וּ אֶת הַ/נְּבֵלָה֙ מֻשְׁלֶ֣כֶת בַּ/דֶּ֔רֶךְ וְ/אֶת הָ֣/אַרְיֵ֔ה עֹמֵ֖ד אֵ֣צֶל הַ/נְּבֵלָ֑ה וַ/יָּבֹ֨אוּ֙ וַ/יְדַבְּר֣וּ בָ/עִ֔יר אֲשֶׁ֛ר הַ/נָּבִ֥יא הַ/זָּקֵ֖ן יֹשֵׁ֥ב בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/025.yaml
  text: And behold[a], men were passing by and saw the corpse thrown on the road, and the lion standing beside the corpse; and they came and reported it in the city where the old prophet lived.
translation:
  language: te
  text: ఇదిగో, అటుగా వెళ్తున్న కొంతమంది దారిలో పడవేయబడి ఉన్న శవాన్ని, ఆ శవం పక్కన నిలబడి ఉన్న సింహాన్ని చూశారు. వారు వృద్ధ ప్రవక్త నివసిస్తున్న ఆ పట్టణానికి వచ్చి ఆ సంగతి చెప్పారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పట్టణంలో ఆ సంగతి గురించి మాట్లాడారు.” హీబ్రూ క్రియకు అక్షరార్థంగా “మాట్లాడారు” అని అర్థం; ఈ సందర్భంలో వారు ఆ సంఘటనను తెలియజేశారని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హీబ్రూ కథనంలో అకస్మాత్తుగా దృష్టిని ఆకర్షించే సూచనను సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: אֲנָשִׁים עֹבְרִים
  choice: కొందరు మనుషులు అటుగా వెళ్తూ
  rationale: అనిశ్చిత బహువచన వ్యక్తులను, కొనసాగుతున్న చర్యను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הַנְּבֵלָה מֻשְׁלֶכֶת בַּדֶּרֶךְ
  choice: దారిలో పడవేయబడిన శవాన్ని
  rationale: మానవ మృతదేహాన్ని సూచించే సందర్భంలో 'శవం' స్పష్టమైన పదం; నిష్క్రియ కృదంతంలోని పడవేయబడిన భావాన్ని నిలుపుతుంది.
- source_word: הָאַרְיֵה עֹמֵד אֵצֶל הַנְּבֵלָה
  choice: ఆ శవం పక్కన నిలబడి ఉన్న సింహాన్ని
  rationale: సింహం ఉన్న స్థితిని, శవానికి దాని సమీపాన్ని స్పష్టంగా మరియు దృశ్యాత్మకంగా తెలుపుతుంది.
- source_word: וַיָּבֹאוּ וַיְדַבְּרוּ בָעִיר
  choice: వారు వచ్చి ... పట్టణంలో ఆ సంగతి చెప్పారు
  rationale: వారు పట్టణానికి చేరి తాము చూసిన విషయాన్ని తెలియజేశారనే సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; అయితే మూల క్రియ సాధారణంగా 'మాట్లాడారు/చెప్పారు' అనే అర్థం కలిగినదని పాదసూచికలో ఉంచబడింది.
- source_word: אֲשֶׁר הַנָּבִיא הַזָּקֵן יֹשֵׁב בָּהּ
  choice: వృద్ధ ప్రవక్త నివసిస్తున్న పట్టణంలో
  rationale: יֹשֵׁב בָּהּ లోని నివాస భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా అందిస్తుంది.
