revisions:
- from: ఇదిగో, కొందరు మనుషులు అటుగా వెళ్తూ, దారిలో పడవేయబడిన శవాన్ని, ఆ శవం పక్కన నిలబడి ఉన్న సింహాన్ని చూశారు. వారు వచ్చి, వృద్ధ ప్రవక్త నివసిస్తున్న పట్టణంలో ఆ సంగతి చెప్పారు.[a]
  to: ఇదిగో, అటుగా వెళ్తున్న కొంతమంది దారిలో పడవేయబడి ఉన్న శవాన్ని, ఆ శవం పక్కన నిలబడి ఉన్న సింహాన్ని చూశారు. వారు వృద్ధ ప్రవక్త నివసిస్తున్న ఆ పట్టణానికి వచ్చి ఆ సంగతి చెప్పారు.[a]
