  text: And the altar was torn apart[a], and the ashes were poured out from the altar, according to the sign that the man of God had given by the word of Yahweh.
translation:
  language: te
  text: యెహోవా మాట ద్వారా దేవుని మనిషి ఇచ్చిన సూచనకు[a] అనుగుణంగా బలిపీఠం చీలిపోయింది, బలిపీఠం నుండి బూడిద చిందిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సూచనగా” లేదా “అద్భుతం/శకునసూచనకు అనుగుణంగా.” హెబ్రీ మోఫేత్ అనే పదం సూచన, అద్భుతం, లేదా శకునసూచనను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: బలిపీఠం
  rationale: బలులు అర్పించే పీఠాన్ని సూచించే מִזְבֵּחַకు ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, స్థిరమైన పదం.
- source_word: נִקְרָע
  choice: చీలిపోయింది
  rationale: קרע యొక్క చీలడం/విడిపోవడం అనే భావాన్ని, నిష్క్రియాత్మక ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּשָּׁפֵךְ הַדֶּשֶׁן
  choice: బూడిద ... ఒలికిపోయింది
  rationale: שׁפך అంటే పోయబడడం లేదా ఒలకడం. బలిపీఠం చీలినప్పుడు దానిపైని అవశేషం బయటికి పడిన దృశ్యానికి ‘ఒలికిపోయింది’ సహజంగా సరిపోతుంది; דֶּשֶׁןను అతిగా సాంకేతికీకరించకుండా ‘బూడిద’గా ఇచ్చాం.
- source_word: מִן הַמִּזְבֵּחַ
  choice: బలిపీఠం దానిపైనుంచి
  rationale: מן తెలిపే మూలస్థానాన్ని స్పష్టంగా ఉంచుతూ, బూడిద బలిపీఠం మీద ఉన్నదనే సందర్భాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כַּמּוֹפֵת
  choice: సూచన నెరవేరింది
  rationale: כְּ ఇక్కడ ముందుగా ప్రకటించిన מוֹפֵתకు సంఘటన సరిపోవడాన్ని సూచిస్తుంది. తెలుగులో ‘సూచన నెరవేరింది’ అనే నిర్మాణం ఆ అనురూపతను సహజంగా తెలియజేస్తుంది; ‘అద్భుత సూచన’ అనే ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: אֲשֶׁר נָתַן
  choice: ఇచ్చిన
  rationale: נתן యొక్క మూలార్థాన్ని నిలుపుతూ ‘సూచన ఇచ్చాడు’ అనే సహజ తెలుగు ప్రయోగాన్ని ఉపయోగిస్తుంది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: ఈ స్థిరమైన హెబ్రీ బిరుదును ‘ప్రవక్త’గా వ్యాఖ్యానించి సంకుచితం చేయకుండా యథాతథంగా నిలుపుతుంది.
- source_word: בִּדְבַר יְהוָה
  choice: యెహోవా మాట ప్రకారం
  rationale: דברను ‘ఆజ్ఞ’కు పరిమితం చేయకుండా ‘మాట’గా ఉంచుతుంది; בְּ యొక్క ఆధారం/అధికార భావాన్ని సందర్భానుసారంగా ‘ప్రకారం’ తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: హెబ్రీ మూలంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’గా ఉంచాం.
- issue: מוֹפֵת యొక్క భావపరిధి
  choice: సూచన
  alternative: అద్భుత సూచన / శకునసూచన
  rationale: ఈ సందర్భంలో అది దేవుని మనిషి ముందుగా ప్రకటించిన, అతని మాటను ధృవీకరించే సంఘటన. ‘సూచన’ ఈ కార్యాన్ని స్పష్టంగా చూపుతుంది; పదంలోని అద్భుతం లేదా శకునం అనే విస్తృత భావాన్ని పాదటిప్పణి సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మొదటి వాక్యంలో దృశ్య సంఘటనను స్పష్టంగా ఉంచి, రెండవ వాక్యంలో అది ముందుగా ఇచ్చిన దైవసూచనకు అనుగుణంగా జరిగినదని సహజంగా తెలిపాం.
