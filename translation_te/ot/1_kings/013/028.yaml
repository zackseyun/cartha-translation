translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘శవం’ మూలంలోని కఠినతను నిలుపుతుంది; ‘చీల్చివేయలేదు’ సందర్భార్థాన్ని స్పష్టంగా చేస్తూ అక్షరార్థాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
