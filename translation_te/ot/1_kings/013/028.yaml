id: 1KI.13.28
reference: 1 Kings 13:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֗לֶךְ וַ/יִּמְצָ֤א אֶת נִבְלָת/וֹ֙ מֻשְׁלֶ֣כֶת בַּ/דֶּ֔רֶךְ וַֽ/חֲמוֹר֙ וְ/הָ֣/אַרְיֵ֔ה עֹמְדִ֖ים אֵ֣צֶל הַ/נְּבֵלָ֑ה לֹֽא אָכַ֤ל הָֽ/אַרְיֵה֙ אֶת הַ/נְּבֵלָ֔ה וְ/לֹ֥א שָׁבַ֖ר אֶֽת הַ/חֲמֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/028.yaml
  text: He went and found his corpse thrown on the road[a], with the donkey and the lion standing beside the corpse. The lion had not eaten the corpse[b], nor had it torn apart the donkey.
translation:
  language: te
  text: అతడు వెళ్లి, దారిలో పడవేయబడి ఉన్న అతని శవాన్ని[a] కనుగొన్నాడు. ఆ గాడిద, సింహం శవం పక్కన నిలబడి ఉన్నాయి. సింహం శవాన్ని తినలేదు; గాడిదను చీల్చివేయలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శవం’కు మూల హీబ్రూ పదం נְבֵלָה; దీనిని ‘మృతదేహం’ అని కూడా అనువదించవచ్చు. ఈ పదం మరణ వాస్తవాన్ని గట్టిగా వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘గాడిదను విరగగొట్టలేదు.’ ఇక్కడ సింహం దానిని చీల్చివేయలేదు లేదా తీవ్రంగా గాయపరచలేదు అనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְלָתוֹ / הַנְּבֵלָה
  choice: అతని శవాన్ని / శవం
  rationale: נְבֵלָה మృతదేహాన్ని సూచించే గట్టి పదం. మానవుని సందర్భంలో సహజంగా ఉండడంతో పాటు మరణ వాస్తవాన్ని స్పష్టంగా నిలుపుకోవడానికి ‘శవం’ ఎంచుకున్నాం.
- source_word: מֻשְׁלֶכֶת
  choice: పడవేయబడి ఉన్న
  rationale: שלך ధాతువు యొక్క కర్మణి రూపం శవం అక్కడ పడవేయబడిందనే భావాన్ని ఇస్తుంది. కేవలం ‘పడి ఉన్న’ అనడం మూలంలోని బలాన్ని తగ్గిస్తుంది.
- source_word: בַּדֶּרֶךְ
  choice: దారిలో
  rationale: ఇక్కడ דֶּרֶךְ ప్రయాణ దారిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘దారిలో’ సహజంగా, సందర్భానికి తగినట్లు ఉంది.
- source_word: עֹמְדִים אֵצֶל
  choice: పక్కన నిలబడి ఉన్నాయి
  rationale: ఈ పదబంధం గాడిద, సింహం శవానికి సమీపంలో అలాగే నిలిచి ఉన్న దృశ్యాన్ని తెలియజేస్తుంది.
- source_word: לֹא אָכַל
  choice: తినలేదు
  rationale: אָכַל యొక్క సాధారణ అర్థమైన ‘తిను’నే నిలిపాం; ‘మింగివేయు’ వంటి పదం మూలం కంటే ఎక్కువ భావాన్ని చేర్చుతుంది.
- source_word: שָׁבַר אֶת הַחֲמוֹר
  choice: గాడిదను చీల్చివేయలేదు
  rationale: שׁבר అక్షరార్థంగా ‘విరగగొట్టు’ అయినా, సింహం గాడిదకు చేసే చర్య సందర్భంలో దాన్ని చీల్చివేయడం లేదా తీవ్రంగా గాయపరచడం అనే భావం వస్తుంది. ‘చీల్చివేయలేదు’ ఆ దృశ్యాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וַיֵּלֶךְ וַיִּמְצָא
  choice: అతడు వెళ్లి ... కనుగొన్నాడు
  rationale: వరుస కథన క్రియలను సరళంగా, మూలంలోని కథన గమనాన్ని కాపాడేలా అనువదించాం.
