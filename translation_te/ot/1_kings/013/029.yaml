  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘దైవజనుడు’ అనే స్థిరమైన బైబిలు బిరుదును నిలిపి, వృద్ధ ప్రవక్తను వయస్సు సూచించే పదంతో స్పష్టంగా వేరు చేశాం.
