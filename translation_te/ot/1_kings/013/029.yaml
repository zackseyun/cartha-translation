source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א הַ/נָּבִ֜יא אֶת נִבְלַ֧ת אִישׁ הָ/אֱלֹהִ֛ים וַ/יַּנִּחֵ֥/הוּ אֶֽל הַ/חֲמ֖וֹר וַ/יְשִׁיבֵ֑/הוּ וַ/יָּבֹ֗א אֶל עִיר֙ הַ/נָּבִ֣יא הַ/זָּקֵ֔ן לִ/סְפֹּ֖ד וּ/לְ/קָבְרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/029.yaml
  text: Then the prophet lifted up the corpse of the man of God and laid it on the donkey and brought it back[a]. And he came to the city of the old prophet to mourn and to bury him.
translation:
  language: te
  text: అప్పుడు ఆ ప్రవక్త దైవజనుని శవాన్ని ఎత్తి గాడిద మీద ఉంచి, దాన్ని తిరిగి తీసుకొచ్చాడు. ఆ వృద్ధ ప్రవక్త శోకించడానికి[a], అతన్ని పాతిపెట్టడానికి వృద్ధ ప్రవక్త ఉన్న పట్టణానికి వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విలపించడానికి.’ ఇక్కడి హీబ్రూ క్రియ అంత్యక్రియల సందర్భంలో చేసే విలాపాన్ని ప్రత్యేకంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: ఎత్తి
  rationale: נשא ఇక్కడ శవాన్ని పైకెత్తి తీసుకోవడాన్ని సూచిస్తుంది; తరువాత గాడిద మీద ఉంచిన చర్యతో సహజంగా అనుసంధానమవుతుంది.
- source_word: הַנָּבִיא
  choice: ఆ ప్రవక్త
  rationale: నిర్దిష్ట ఉపపదాన్ని సందర్భానుసారమైన ‘ఆ’తో వ్యక్తం చేసి, శవాన్ని కనుగొన్న వృద్ధ ప్రవక్తనే సూచిస్తుంది.
- source_word: נִבְלַת
  choice: శవాన్ని
  rationale: נבלה అంటే మృతదేహం; ‘శవం’ ఆధునిక తెలుగులో స్పష్టమైన, ఖచ్చితమైన పదం.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దైవజనుని
  rationale: ఇది దేవునిచేత నియమించబడిన వ్యక్తికి వాడే స్థిరమైన బైబిలు బిరుదు; ‘దైవజనుడు’ తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: וַיַּנִּחֵהוּ אֶל הַחֲמוֹר
  choice: గాడిద మీద ఉంచి
  rationale: נוח యొక్క హిఫీల్ రూపం ఇక్కడ పెట్టడం లేదా ఉంచడం అనే అర్థమిస్తుంది; אֶל సందర్భంలో గాడిదపై ఉంచడాన్ని సూచిస్తుంది.
- source_word: וַיְשִׁיבֵהוּ
  choice: దాన్ని తిరిగి తీసుకొచ్చాడు
  rationale: שוב హిఫీల్ రూపం ‘తిరిగి తీసుకురావడం’ అని అర్థం; ‘దాన్ని’ సమీపంలోని ‘శవం’తో వ్యాకరణపరంగా స్పష్టంగా అనుసంధానమవుతుంది.
- source_word: וַיָּבֹא אֶל עִיר הַנָּבִיא הַזָּקֵן
  choice: ఆ వృద్ధ ప్రవక్త తన పట్టణానికి వచ్చాడు
  rationale: హీబ్రూ పదక్రమంలో ‘వృద్ధ ప్రవక్త’ క్రియ తరువాత వచ్చే కర్త; ‘వృద్ధ ప్రవక్త పట్టణం’ అనే సంబంధాన్ని సహజ తెలుగులో ‘తన పట్టణం’గా వ్యక్తం చేశాం.
- source_word: הַזָּקֵן
  choice: వృద్ధ
  rationale: ఇక్కడ ఇది అధికారపదవి కాదు; ప్రవక్త వయస్సును సూచించి అతన్ని దైవజనుని నుండి వేరు చేస్తుంది.
- source_word: לִסְפֹּד
  choice: శోకించడానికి
  rationale: ספד మరణ సందర్భంలోని శోకాన్ని, తరచుగా బహిరంగ విలాపాన్ని సూచిస్తుంది; ప్రధాన పాఠంలో ‘శోకించడానికి’ సులభంగా అర్థమవుతుంది, ప్రత్యేకమైన విలాప భావాన్ని పాదటిప్పణి తెలుపుతుంది.
- source_word: וּלְקָבְרוֹ
  choice: అతన్ని పాతిపెట్టడానికి
  rationale: קבר అంటే పాతిపెట్టడం; ప్రత్యయం మరణించిన దైవజనుణ్ణి సూచిస్తుంది.
