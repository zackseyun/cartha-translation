source:
  edition: WLC
  text: וַ/יִּקְרָ֞א אֶל אִ֣ישׁ הָ/אֱלֹהִ֗ים אֲשֶׁר בָּ֤א מִֽ/יהוּדָה֙ לֵ/אמֹ֔ר כֹּ֖ה אָמַ֣ר יְהוָ֑ה יַ֗עַן כִּ֤י מָרִ֨יתָ֙ פִּ֣י יְהוָ֔ה וְ/לֹ֤א שָׁמַ֨רְתָּ֙ אֶת הַ/מִּצְוָ֔ה אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/021.yaml
  text: 'And he cried out to the man of God who had come from Judah[a], saying, “Thus says Yahweh: Because you have rebelled against the word of Yahweh and have not kept the command that Yahweh your God commanded you,”'
translation:
  language: te
  text: 'అప్పుడు అతడు యూదా నుండి వచ్చిన దైవజనునికి బిగ్గరగా ఇలా పలికాడు: “యాహ్వే ఇలా అంటున్నాడు: నీవు యాహ్వే మాటకు[a] తిరుగుబాటు చేసి, నీ దేవుడైన యాహ్వే నీకు ఆజ్ఞాపించిన ఆజ్ఞను పాటించలేదు కాబట్టి—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యాహ్వే నోరు.” ఇది యాహ్వే పలికిన మాటను సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶל
  choice: బిగ్గరగా ... అన్నాడు
  rationale: קרא אל అంటే ఒకరిని ఉద్దేశించి పిలవడం లేదా బిగ్గరగా పలకడం. ప్రవచనాత్మక తీర్పు ప్రకటనలోని తీవ్రతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దైవజనుడు
  rationale: ఇది హీబ్రూ గ్రంథంలో ప్రవక్తకు వాడే స్థిరమైన బిరుదు. అక్షరార్థమైన ‘దేవుని మనిషి’ కంటే ‘దైవజనుడు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంటుంది; ‘ప్రవక్త’ అని వ్యాఖ్యానాత్మకంగా మార్చదు.
- source_word: מִיהוּדָה
  choice: యూదా నుండి వచ్చిన
  rationale: భౌగోళిక మూలాన్ని స్పష్టంగా, సహజమైన తెలుగు పదక్రమంలో తెలియజేస్తుంది.
- source_word: כֹּה אָמַר יְהוָה
  choice: యాహ్వే ఇలా అంటున్నాడు
  rationale: ప్రవచన దూత సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: יַעַן כִּי
  choice: కాబట్టి
  rationale: రాబోయే తీర్పుకు కారణాన్ని పరిచయం చేసే హీబ్రూ నిర్మాణాన్ని తెలుగులో సహజంగా వాక్యాంత కారణరూపంలో చూపుతుంది.
- source_word: מָרִיתָ
  choice: ఎదురుతిరిగి
  rationale: మרהలో ఉన్న కేవలం అవిధేయతకన్నా బలమైన తిరుగుబాటు, ధిక్కార భావాన్ని నిలుపుతుంది.
- source_word: פִּי יְהוָה
  choice: యాహ్వే నోటిమాటకు
  rationale: అక్షరార్థమైన ‘యాహ్వే నోరు’ అనే రూపకాన్ని తెలుగులో అర్థమయ్యే ‘నోటిమాట’తో నిలుపుతూ, అది ఆయన పలికిన మాటను సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
- source_word: וְלֹא שָׁמַרְתָּ אֶת הַמִּצְוָה
  choice: ఆజ్ఞను పాటించలేదు
  rationale: ఆజ్ఞ సందర్భంలో שׁמרకు ‘పాటించు’ సహజమైన తెలుగు సమానార్థకం; ఏకవచన הַמִּצְוָהను ‘ఆజ్ఞ’గా ఉంచింది.
- source_word: אֲשֶׁר צִוְּךָ
  choice: నీకు ఆజ్ఞాపించిన
  rationale: צוה అనే క్రియలోని ప్రత్యక్ష ఆజ్ఞ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యాహ్వే
  rationale: ఒడంబడిక సంబంధాన్ని తెలిపే హీబ్రూ సంబోధనను సహజమైన తెలుగు రూపంలో కాపాడుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా వాడుతుంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా, ‘Jehovah’ ఆధారిత రూపాన్ని అనుసరించకుండా లిప్యంతరీకరిస్తుంది.
- issue: מָרִיתָలోని అవిధేయత తీవ్రత
  choice: ఎదురుతిరిగి
  alternative: అవిధేయత చూపి / ధిక్కరించి
  rationale: ఈ క్రియ సాధారణంగా ఆజ్ఞను పాటించకపోవడమే కాక తిరుగుబాటును సూచిస్తుంది. ‘ఎదురుతిరిగి’ ఆ బలాన్ని నిలుపుతుంది; ఉద్దేశాన్ని మరింత నిర్దిష్టంగా వ్యాఖ్యానించదు.
- issue: פִּי יְהוָה అనే రూపకం
  choice: యాహ్వే నోటిమాట
  alternative: యాహ్వే మాట / యాహ్వే ఆజ్ఞ
  rationale: ‘నోరు’ అనే మూలరూపకానికి పారదర్శకతను కాపాడుతూనే తెలుగులో అర్థవంతమైన రూపాన్ని ఇస్తుంది. పాదసూచిక దాని భావాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రవచన ప్రకటనకు తగిన గంభీరతతో, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. హీబ్రూ వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున చివర దీర్ఘవిరామ చిహ్నం ఉంచబడింది.
