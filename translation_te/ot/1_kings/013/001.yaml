id: 1KI.13.1
reference: 1 Kings 13:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה אִ֣ישׁ אֱלֹהִ֗ים בָּ֧א מִ/יהוּדָ֛ה בִּ/דְבַ֥ר יְהוָ֖ה אֶל בֵּֽית אֵ֑ל וְ/יָרָבְעָ֛ם עֹמֵ֥ד עַל הַ/מִּזְבֵּ֖חַ לְ/הַקְטִֽיר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/001.yaml
  text: And behold[a], a man of God came from Judah to Bethel by the word of Yahweh[b], while Jeroboam was standing by the altar to burn incense.
translation:
  language: te
  text: ఇదిగో, యూదా నుండి ఒక దైవజనుడు యాహ్వే వాక్కు ప్రకారం[a] బేతేలుకు వచ్చాడు. ఆ సమయంలో యరొబాము ధూపం వేయడానికి బలిపీఠం దగ్గర నిలబడి ఉన్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే వాక్కు చేత” లేదా “యాహ్వే ఆజ్ఞ మేరకు.”
    reason: హిబ్రూ בִּדְבַר అనే పదబంధం అనుగుణత, సాధనం లేదా అధికారపూర్వక ఆజ్ఞ అనే దగ్గరి భావాలను మోయగలదు.
  - marker: b
    text: లేదా, “యరొబాము ధూపం వేయడానికి బలిపీఠం వద్ద నిలబడి ఉన్నాడు.” హిబ్రూ సంధికారకాన్ని సరళంగా “మరియు” అని కూడా అనువదించవచ్చు; స్థలసూచక పదబంధం “బలిపీఠం వద్ద” అని కూడా చెప్పవచ్చు.
    reason: వాక్యాల మధ్య సంబంధం సమకాలిక నేపథ్యంగా గానీ సాధారణ సంయోజనంగా గానీ అర్థమవుతుంది; עַל ఇక్కడ ‘దగ్గర/వద్ద’ అనే స్థానార్థాన్ని ఇస్తుంది.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హిబ్రూ కథనంలోని దృష్టిని ఆకర్షించే, దృశ్యాన్ని సజీవంగా పరిచయం చేసే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: אִישׁ אֱלֹהִים
  choice: దేవుని మనిషి ఒకడు
  rationale: ఇది ప్రవక్తను సూచించే స్థిరమైన హిబ్రూ అభివ్యక్తి అయినప్పటికీ, మూలపాఠంలోని పదబంధాన్ని వ్యాఖ్యానాత్మకంగా ‘ప్రవక్త’ అని మార్చకుండా నిలుపుతుంది.
- source_word: מִיהוּדָה ... אֶל־בֵּית אֵל
  choice: యూదా నుండి బేతేలుకు
  rationale: ప్రయాణపు ఆరంభస్థలాన్నీ గమ్యస్థానాన్నీ నేరుగా, సహజంగా తెలుపుతుంది.
- source_word: בִּדְבַר יְהוָה
  choice: యాహ్వే వాక్కు ప్రకారం
  rationale: ఆ మనిషి రాక యాహ్వే పలికిన మాటకు అనుగుణంగా, ఆయన ఆజ్ఞ లేదా అధికారంతో జరిగిందనే భావాన్ని వ్యక్తం చేస్తుంది; ఉపసర్గలోని స్వల్ప భావవిస్తృతిని పాదసూచికలో ఉంచింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: మూలపాఠంలోని దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో సూచిస్తుంది.
- source_word: וְיָרָבְעָם עֹמֵד
  choice: ఆ సమయంలో యరొబాము ... నిలబడి ఉన్నాడు
  rationale: వావ్‌ను సందర్భానుసారమైన సమకాలిక నేపథ్య సంబంధంగా, వర్తమాన కృదంతాన్ని కొనసాగుతున్న స్థితిగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַל הַמִּזְבֵּחַ
  choice: బలిపీఠం దగ్గర
  rationale: యరొబాము బలిపీఠం మీద నిలిచాడని అనవసరంగా సూచించకుండా, ఆచార సందర్భంలో దాని వద్ద ఉన్నాడనే భావాన్ని ఇస్తుంది.
- source_word: לְהַקְטִיר
  choice: ధూపం వేయడానికి
  rationale: ఆరాధనా సందర్భంలో పొగ పైకి లేచేలా అర్పించడాన్ని సూచించే క్రియకు ఇక్కడ సరిపోయే నిర్దిష్టమైన, సాధారణ తెలుగు రూపం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: ఈ వచనం దేవుని వ్యక్తిగత నామాన్ని ప్రత్యక్షంగా ఉపయోగిస్తుంది. అందువల్ల బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా, మూలరూపానికి సమీపమైన ‘యాహ్వే’ను ఉపయోగించాం.
- issue: אִישׁ אֱלֹהִים యొక్క గుర్తింపు
  choice: దేవుని మనిషి
  alternative: ప్రవక్త; దైవజనుడు
  rationale: సందర్భంలో అతడు ప్రవక్తగా పనిచేసినా, వచనం ఉపయోగించిన ప్రత్యేక పదబంధాన్ని నిలుపుతూ అతని గుర్తింపును ముందుగానే మరింత నిర్దిష్టం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘ఇదిగో’ మూలంలోని కథన సజీవతను నిలుపుతుంది. ‘దేవుని మనిషి’ కొద్దిగా మూలభాషా ముద్ర కలిగినప్పటికీ ఉద్దేశపూర్వకంగా ఉంచబడింది; ‘ప్రవక్త’ అనే వ్యాఖ్యానాన్ని పాఠ్యంలోకి చేర్చలేదు.
