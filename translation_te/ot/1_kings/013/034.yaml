id: 1KI.13.34
reference: 1 Kings 13:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/דָּבָ֣ר הַ/זֶּ֔ה לְ/חַטַּ֖את בֵּ֣ית יָרָבְעָ֑ם וּ/לְ/הַכְחִיד֙ וּ/לְ/הַשְׁמִ֔יד מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/034.yaml
  text: And this matter became sin for the house of Yarovam[b][a], to cut it off and to destroy it from the face of the ground.
translation:
  language: te
  text: ఈ విషయం[a] యెరోబాము వంశానికి పాపంగా అయింది; దానివల్ల ఆ వంశాన్ని నేల ముఖం మీదనుండి[b] తొలగించడానికీ నాశనం చేయడానికీ దారితీసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఈ సంగతి’ లేదా ‘ఈ వ్యవహారం’ అని కూడా అనువదించవచ్చు. హీబ్రూ דָּבָר అనే పదం విషయం, వ్యవహారం లేదా సంగతి అనే విస్తృతార్థాలను కలిగి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘నేల ముఖం మీదనుండి.’ ఇది భూమి లేదా దేశం మీదనుండి పూర్తిగా తొలగించబడటాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: కారణమైంది
  rationale: ఈ వాక్యంలో היה ముందటి వ్యవహారం యెరోబాము వంశపు పాపంగా నిలిచి, చివరకు దాని నిర్మూలనకు దారితీసిన ఫలితాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో ‘పాపమై ... కారణమైంది’ ఆ పరిణామ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בַּדָּבָר הַזֶּה
  choice: ఈ విషయం
  rationale: דָּבָר ఇక్కడ కేవలం పలికిన మాటను కాకుండా, ముందుగా వివరించిన వ్యవహారాన్ని లేదా కార్యాచరణను సూచిస్తుంది. ‘విషయం’ దాని విస్తృతార్థాన్ని నిలుపుతుంది.
- source_word: לְחַטַּאת
  choice: పాపమై
  rationale: ఈ నిర్మాణం ఒక విషయం పాపంగా మారడాన్ని లేదా పాపానికి కారణంగా నిలవడాన్ని సూచించగలదు. ‘పాపమై’ మూలంలోని సంక్షిప్తతను కాపాడుతుంది.
- source_word: בֵּית יָרָבְעָם
  choice: యెరోబాము వంశం
  rationale: ‘ఇల్లు’ అనే హీబ్రూ నుడికారం ఇక్కడ కుటుంబ పరంపర లేదా రాజవంశాన్ని సూచిస్తుంది. ఆధునిక తెలుగు పాఠకునికి ‘వంశం’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וּלְהַכְחִיד
  choice: తొలగించి
  rationale: כחד హిఫీల్ రూపం కనబడకుండా చేయడం లేదా ఉనికిలో లేకుండా చేయడం అనే భావాన్ని ఇస్తుంది. తరువాతి ‘నాశనం’తో ఉన్న పదభేదాన్ని ‘తొలగించి’ నిలుపుతుంది.
- source_word: וּלְהַשְׁמִיד
  choice: నాశనం చేయడానికి
  rationale: שׁמד హిఫీల్ సంపూర్ణ విధ్వంసాన్ని సూచిస్తుంది. ‘నాశనం చేయడం’ ఆ తీర్పు తీవ్రతను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: నేలమీదనుండి
  rationale: ఇది భూమి లేదా దేశం మీదనుండి పూర్తిగా తొలగించబడటాన్ని సూచించే హీబ్రూ నుడికారం. ‘నేలమీదనుండి’ దాని రూపక చిత్రాన్ని సంక్షిప్తంగా కాపాడుతుంది.
theological_decisions:
- issue: నిర్మూలన క్రియల కర్మ
  choice: ‘ఆ వంశాన్ని’ అని యెరోబాము వంశాన్నే సూచించడం
  alternative: ఆ క్రియలు పాపకరమైన విషయాన్నే సాధారణంగా సూచిస్తాయని గ్రహించడం
  rationale: వాక్యనిర్మాణంలో సమీపమైన, సందర్భానికి సరిపోయే కర్మ ‘యెరోబాము వంశం.’ రాజవంశంపై రాబోయే తీర్పు అనే కథన సందర్భం కూడా దీనికి మద్దతిస్తుంది. హీబ్రూలో అంతర్భావంగా ఉన్న కర్మను తెలుగులో స్పష్టత కోసం తెలిపాం.
- issue: ל ఉపసర్గ సూచించే సంబంధం
  choice: పాపం వంశ నిర్మూలనకు దారితీసిన ఫలిత సంబంధంగా అనువదించడం
  alternative: నిర్మూలించాలనే ఉద్దేశాన్ని తెలిపే ప్రయోజన సంబంధంగా అనువదించడం
  rationale: సందర్భంలో ఈ పాపం యెరోబాము వంశంపై తీర్పు మరియు నిర్మూలనకు దారితీస్తుంది. ‘కారణమైంది’ ఈ ఫలిత భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; దేవుని కార్యవిధి గురించి మూలంలో లేని అదనపు వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. ‘ఇల్లు’ అనే అక్షరార్థ నుడికారానికి బదులుగా సందర్భోచితమైన ‘వంశం’ వాడాం; జతగా ఉన్న రెండు విధ్వంస క్రియల భావభేదాన్ని ‘తొలగించి నాశనం చేయడానికి’ ద్వారా నిలిపాం.
