source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע הַ/נָּבִיא֮ אֲשֶׁ֣ר הֱשִׁיב֣/וֹ מִן הַ/דֶּרֶךְ֒ וַ/יֹּ֨אמֶר֙ אִ֣ישׁ הָ/אֱלֹהִ֣ים ה֔וּא אֲשֶׁ֥ר מָרָ֖ה אֶת פִּ֣י יְהוָ֑ה וַ/יִּתְּנֵ֨/הוּ יְהוָ֜ה לָ/אַרְיֵ֗ה וַֽ/יִּשְׁבְּרֵ֨/הוּ֙ וַ/יְמִתֵ֔/הוּ כִּ/דְבַ֥ר יְהוָ֖ה אֲשֶׁ֥ר דִּבֶּר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/026.yaml
  text: When the prophet who had brought him back from the way heard it[a], he said, “It is the man of God who rebelled against the word of Yahweh; therefore Yahweh gave him to the lion, and it mauled him and killed him, according to the word of Yahweh that he spoke to him.”
translation:
  language: te
  text: తనను దారినుంచి వెనక్కి తీసుకొచ్చిన ప్రవక్త ఈ సంగతి విని, “యాహ్వే ఆజ్ఞకు ఎదురుతిరిగిన దేవుని మనిషి ఇతడే[a]. అందుకే యాహ్వే అతణ్ణి సింహానికి అప్పగించాడు; యాహ్వే అతనితో చెప్పిన మాట ప్రకారం, అది అతణ్ణి చీల్చి చంపింది” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యాహ్వే నోటికి ఎదురుతిరిగినవాడు.” దీన్ని “యాహ్వే మాటను ధిక్కరించినవాడు” అని కూడా అనువదించవచ్చు.
    reason: హీబ్రూ నుడికారం యొక్క అక్షరరూపాన్ని, తిరుగుబాటు/ధిక్కారానికి సాధ్యమైన అనువాదాన్ని భద్రపరచడం.
lexical_decisions:
- source_word: הֱשִׁיבוֹ מִן־הַדֶּרֶךְ
  choice: తనను దారినుంచి వెనక్కి తీసుకొచ్చిన
  rationale: שׁוב హిఫీల్ రూపంలోని కారణార్థాన్ని ‘వెనక్కి తీసుకొచ్చిన’ సహజంగా తెలియజేస్తుంది; ‘దారి’ కథనంలో పునరావృతమయ్యే మార్గ భావాన్ని నిలుపుతుంది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: దైవిక నియామకం పొందిన వ్యక్తికి వాడే హీబ్రూ బిరుదును నేరుగా, కథన సాతత్యంతో అందిస్తుంది.
- source_word: מָרָה אֶת־פִּי יְהוָה
  choice: యెహోవా ఆజ్ఞకు ఎదురుతిరిగిన
  rationale: מָרָהలోని తిరుగుబాటు/ధిక్కార భావాన్ని నిలుపుతూ, ‘యెహోవా నోరు’ అనే హీబ్రూ నుడికారానికి ఉద్దేశమైన పలికిన ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. అక్షరార్థాన్ని పాదసూచికలో భద్రపరచాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో అందిస్తుంది.
- source_word: וַיִּתְּנֵהוּ ... לָאַרְיֵה
  choice: అతణ్ణి సింహానికి అప్పగించాడు
  rationale: נתן + ל ఇక్కడ ఒకరి అధికారానికి లేదా బలానికి అప్పగించడం అనే భావాన్ని ఇస్తుంది; ‘అప్పగించాడు’ తెలుగులో సహజంగా ఆ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: וַיִּשְׁבְּרֵהוּ
  choice: అతణ్ణి చీల్చి
  rationale: שׁבר అక్షరార్థంగా ‘విరగగొట్టు’; సింహం కర్తగా ఉన్న సందర్భంలో హింసాత్మకంగా చీల్చడం లేదా నుజ్జుచేయడం అనే భావం. ‘చీల్చి’ జంతువు దాడిని స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וַיְמִתֵהוּ
  choice: చంపింది
  rationale: מות హిఫీల్ రూపంలోని ‘చనిపోయేలా చేయడం’ అనే ప్రత్యక్ష భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: כִּדְבַר יְהוָה אֲשֶׁר דִּבֶּר לוֹ
  choice: యెహోవా అతనితో చెప్పిన మాట ప్రకారం
  rationale: ముందుగా పలికిన యెహోవా మాట నెరవేరిందనే సంబంధాన్ని నిలుపుతుంది; לוֹను ‘అతనితో’గా సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని ఉపయోగిస్తుంది; దానిని కేవలం బిరుదుగా మార్చకుండా నామరూపంలో ఉంచాం.
- issue: פִּי יְהוָה నుడికారం
  choice: యెహోవా ఆజ్ఞ
  alternative: యెహోవా నోటి మాట / యెహోవా మాట
  rationale: ఇది యెహోవా పలికిన నిర్దిష్ట ఆజ్ఞను సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన భావాన్ని ఇచ్చి, హీబ్రూ రూపకాన్ని మరియు ఇతర సాధ్యమైన అనువాదాలను పాదసూచికలో పేర్కొన్నాం; తద్వారా తిరుగుబాటు భావం తగ్గిపోదు.
- issue: మనిషి మరణంలో యెహోవా పాత్ర
  choice: యెహోవా అతణ్ణి సింహానికి అప్పగించాడు
  alternative: అతడు సింహానికి చిక్కేలా యెహోవా చేశాడు
  rationale: మూలంలోని ప్రత్యక్ష దైవకర్తృత్వాన్ని మృదువుచేయకుండా నిలిపాం; అదే సమయంలో సింహమే చీల్చి చంపిన సమీప కర్తగా వాక్యంలో ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు సులభమైన కథన శైలి వాడబడింది. ‘అతణ్ణి’ వంటి సహజ ఆధునిక సర్వనామ రూపాలు, ‘అప్పగించాడు’ వంటి స్పష్టమైన క్రియలు ఎంచుకున్నాం. హీబ్రూ వాక్యంలోని కారణసూచక సంబంధాన్ని ‘అందుకే’తో వ్యక్తం చేశాం; సింహాన్ని సూచించే నపుంసక ఏకవచన సర్వనామం ‘అది’ ద్వారా కర్తల మధ్య స్పష్టత ఉంచాం.
