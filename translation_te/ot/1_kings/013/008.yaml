revisions:
- from: 'అయితే దేవుని మనిషి రాజుతో ఇలా అన్నాడు: “నీవు నీ ఇంటిలో సగం నాకు ఇచ్చినా[a], నేను నీతో రాను; ఈ స్థలంలో రొట్టె తినను, నీళ్లు తాగను.”'
  to: 'అయితే దేవుని మనిషి రాజుతో ఇలా అన్నాడు: “నీవు నీ ఇంటి సగభాగాన్ని నాకు ఇచ్చినా, నేను నీతో రాను; ఈ స్థలంలో రొట్టె తినను, నీళ్లు కూడా తాగను.”'
  rationale: ‘నీ ఇంటిలో సగం’ను ‘నీ ఇంటి సగభాగాన్ని’గా మార్చి, హీబ్రూ ‘నీ ఇంటిలో సగం’ కాదు, ‘నీ ఇంటి సగం’ అనే అర్థాన్ని స్పష్టంగా చేశాం. పాదటిప్పణిలో కూడా అదే సంబంధాన్ని సహజమైన తెలుగులో సరిచేశాం. చివరి నిషేధంలో ‘కూడా’ను చేర్చి పునరుక్త హీబ్రూ నిషేధాన్ని సహజంగా ప్రతిబింబించాం.
