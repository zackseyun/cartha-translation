review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects the Hebrew conditional refusal, the designation 'man of God,' and the prohibitions against going, eating bread, and drinking water. However, 'నీ ఇంటిలో సగం' can mean 'half inside your house' rather than 'half of your house'; the genitive construction is needed to represent בֵיתֶךָ faithfully.
  naturalness: The overall narrative register is modern and natural. 'నీ ఇంటి సగభాగాన్ని' is clearer and more idiomatic in this context than the locative phrasing in the draft. Adding 'కూడా' to the final coordinated negative gives the Hebrew's repeated negative a natural Telugu expression.
  terminology: ‘దేవుని మనిషి’ appropriately preserves איש האלהים without interpretively changing it to ‘prophet.’ ‘రొట్టె’ and ‘నీళ్లు’ are clear, standard choices. The footnote should likewise use a genitive expression for 'half your house.'
  issues:
  - severity: medium
    issue: Locative wording for 'half your house'
    rationale: ‘నీ ఇంటిలో సగం’ is locative (‘half in your house’) and does not clearly express the Hebrew possessive/genitive sense, ‘half of your house.’
  revised_text: 'అయితే దేవుని మనిషి రాజుతో ఇలా అన్నాడు: “నీవు నీ ఇంటి సగభాగాన్ని నాకు ఇచ్చినా, నేను నీతో రాను; ఈ స్థలంలో రొట్టె తినను, నీళ్లు కూడా తాగను.”'
  revised_footnotes:
