translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘దేవుని మనిషి,’ ‘రొట్టె,’ ‘ఈ స్థలం’ వంటి మూల పదచిత్రాలను నిలుపుతూ, షరతు వాక్యాన్ని తెలుగులో సహజమైన ‘ఇచ్చినా’ నిర్మాణంతో వ్యక్తం చేశాం.
