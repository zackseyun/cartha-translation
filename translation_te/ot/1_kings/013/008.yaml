  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אִישׁ הָֽ/אֱלֹהִים֙ אֶל הַ/מֶּ֔לֶךְ אִם תִּתֶּן לִ/י֙ אֶת חֲצִ֣י בֵיתֶ֔/ךָ לֹ֥א אָבֹ֖א עִמָּ֑/ךְ וְ/לֹֽא אֹ֤כַל לֶ֨חֶם֙ וְ/לֹ֣א אֶשְׁתֶּה מַּ֔יִם בַּ/מָּק֖וֹם הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/008.yaml
  text: But the man of God said to the king[a], “If you were to give me half your house, I would not go with you, nor would I eat bread or drink water in this place.”
translation:
  language: te
  text: 'అయితే దేవుని మనిషి రాజుతో ఇలా అన్నాడు: “నీవు నీ ఇంటి సగభాగాన్ని నాకు ఇచ్చినా, నేను నీతో రాను; ఈ స్థలంలో రొట్టె తినను, నీళ్లు కూడా తాగను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: దైవిక నియామకం పొందిన సందేశకునికి వాడే ప్రామాణిక హీబ్రూ పదబంధాన్ని ‘దేవుని ప్రవక్త’ అని వివరణాత్మకంగా మార్చకుండా మూలరూపానికి దగ్గరగా ఉంచుతుంది.
- source_word: אִם תִּתֶּן לִי אֶת חֲצִי בֵיתֶךָ
  choice: నీవు నీ ఇంటిలో సగం నాకు ఇచ్చినా
  rationale: హీబ్రూలోని షరతుతో కూడిన అతిశయోక్తిని సహజమైన తెలుగు నిర్మాణంలో అందిస్తూ, ‘ఇల్లు’ అనే మూల చిత్రాన్ని నిలుపుతుంది.
- source_word: בֵיתֶךָ
  choice: నీ ఇల్లు
  rationale: בַּיִת అనే పదం ఇల్లు, ఇంటివారు, ఆస్తి అనే విస్తృత అర్థాలు కలిగి ఉండగలదు. ఇక్కడ రాజు ఇవ్వగల గొప్ప బహుమానాన్ని సూచించవచ్చుగాని, అనిశ్చితిని తొలగించకుండా అక్షరార్థ చిత్రాన్ని ఉంచాం.
- source_word: לֹא אָבֹא עִמָּךְ
  choice: నేను నీతో రాను
  rationale: ఆహ్వానానికి ఇచ్చిన తిరస్కారంగా తెలుగులో సహజంగా ఉండి, మూలంలోని ‘నీతో రాను’ అనే భావాన్ని నేరుగా అందిస్తుంది.
- source_word: לֹא אֹכַל לֶחֶם
  choice: రొట్టె తినను
  rationale: לֶחֶם సాధారణంగా ఆహారం లేదా భోజనాన్ని కూడా సూచించగలిగినా, ‘రొట్టె’ అనే మూల పదచిత్రం తెలుగులో అర్థవంతంగా ఉంది.
- source_word: לֹא אֶשְׁתֶּה מַּיִם
  choice: నీళ్లు తాగను
  rationale: సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండే నేర అనువాదం.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: ఈ స్థలంలో
  rationale: ‘ఇక్కడ’ కంటే మూలంలోని నామవాచకాన్ని, నిర్దేశక బలాన్ని స్పష్టంగా నిలుపుతుంది.
