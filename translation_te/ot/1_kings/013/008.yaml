    text: హీబ్రూలో అక్షరార్థంగా, “నీ ఇంటి సగం.” ఈ పదబంధం చాలా గొప్ప బహుమానాన్ని లేదా ఆస్తిలో పెద్ద భాగాన్ని సూచించవచ్చు; అనువాదంలో మూలంలోని పదచిత్రాన్ని అలాగే ఉంచాం.
