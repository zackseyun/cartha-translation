source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר אֶל בָּנָי/ו֙ לֵ/אמֹ֔ר חִבְשׁוּ לִ֖/י אֶֽת הַ/חֲמ֑וֹר וַֽ/יַּחֲבֹֽשׁוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/027.yaml
  text: Then he spoke to his sons[a], saying, “Saddle the donkey for me.” So they saddled it.
translation:
  language: te
  text: అప్పుడు అతడు తన కుమారులతో, “నాకోసం గాడిదకు జీను కట్టండి” అని చెప్పాడు. వారు దానికి జీను కట్టారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు ఆ గాడిదకు జీను కట్టారు.”
    reason: చివరి హీబ్రూ క్రియకు కర్మ స్పష్టంగా రాయబడలేదు; సందర్భం గాడిదనే సూచిస్తుంది. ప్రధాన పాఠంలో సర్వనామం వాడగా, ప్రత్యామ్నాయంలో నామవాచకాన్ని పునరుక్తి చేశాం.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు అతడు ... చెప్పాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ ఆ క్రమాన్ని సహజమైన తెలుగు కథనశైలిలో చూపిస్తుంది. דּברను సందర్భానుసారంగా ‘చెప్పాడు’ అని అనువదించడం ప్రత్యక్ష సంభాషణకు సహజంగా ఉంది.
- source_word: אֶל בָּנָיו
  choice: తన కుమారులతో
  rationale: בָּנָיו ఇక్కడ అతని మగ సంతానాన్ని సూచిస్తుంది. మాట చెప్పబడిన వారిని తెలుగులో సహజంగా ‘తన కుమారులతో’ అని వ్యక్తం చేశాం.
- source_word: לֵאמֹר
  choice: '... అని'
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే ఈ హీబ్రూ రూపాన్ని తెలుగులో సహజమైన ఉద్ధరణ నిర్మాణమైన ‘అని’తో అందించాం.
- source_word: חִבְשׁוּ לִי
  choice: నాకోసం ... జీను కట్టండి
  rationale: గాడిద సందర్భంలో חבשׁ అంటే జీను కట్టడం. לִי తెలియజేసే ప్రయోజనార్థాన్ని ‘నాకోసం’ స్పష్టంగా నిలుపుతుంది.
- source_word: אֶת הַחֲמוֹר
  choice: గాడిదకు
  rationale: חֲמוֹרకు ఆధునిక ప్రామాణిక తెలుగులో సాధారణమైన పదం ‘గాడిద’. ‘జీను కట్టు’ అనే తెలుగు ప్రయోగానికి అనుగుణంగా కర్మను ‘గాడిదకు’ అని రూపాంతరం చేశాం.
- source_word: וַיַּחֲבֹשׁוּ
  choice: వారు దానికి జీను కట్టారు
  rationale: మూలంలో חבשׁ క్రియ పునరావృతమవుతుంది కాబట్టి ‘జీను కట్టారు’ను పునరావృతం చేశాం. మూలంలోని అంతర్లీన కర్మను సహజమైన తెలుగులో ‘దానికి’ అని తెలిపాం.
