- from: బేతేలులో ఒక వృద్ధ ప్రవక్త నివసిస్తూ ఉన్నాడు.[a] అతని కుమారుడు వచ్చి, దేవుని మనిషి ఆ రోజు బేతేలులో చేసిన కార్యమంతటినీ, రాజుతో పలికిన మాటలనూ అతనికి వివరించాడు. వారు వాటిని తమ తండ్రికి వివరించారు.[b]
