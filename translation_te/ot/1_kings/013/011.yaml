  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని ఏకవచనం నుంచి బహువచనానికి మార్పు ఉద్దేశపూర్వకంగా నిలుపబడింది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
