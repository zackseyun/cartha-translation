source:
  edition: WLC
  text: וְ/נָבִ֤יא אֶחָד֙ זָקֵ֔ן יֹשֵׁ֖ב בְּ/בֵֽית אֵ֑ל וַ/יָּב֣וֹא בְנ֡/וֹ וַ/יְסַפֶּר ל֣/וֹ אֶת כָּל הַ/מַּעֲשֶׂ֣ה אֲשֶׁר עָשָׂה֩ אִישׁ הָ/אֱלֹהִ֨ים הַ/יּ֜וֹם בְּ/בֵֽית אֵ֗ל אֶת הַ/דְּבָרִים֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֶל הַ/מֶּ֔לֶךְ וַֽ/יְסַפְּר֖וּ/ם לַ/אֲבִי/הֶֽם־־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/011.yaml
  text: An old prophet was living in Bethel[a], and his sons came and told him all the deed that the man of God had done that day in Bethel, and the words that he had spoken to the king[b]; they told them to their father.
translation:
  language: te
  text: బేతేలులో ఒక వృద్ధ ప్రవక్త నివసించేవాడు.[a] అతని కుమారుడు వచ్చి, దేవుని మనిషి ఆ రోజు బేతేలులో చేసిన కార్యమంతటినీ, రాజుతో చెప్పిన మాటలనూ అతనికి వివరించాడు. వారు వాటిని తమ తండ్రికి వివరించారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలోని ‘ఒకడు’ ఇక్కడ అనిర్దిష్ట వ్యక్తిని పరిచయం చేస్తుంది; దీనిని ‘ఒక నిర్దిష్ట వృద్ధ ప్రవక్త’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠం మొదట ‘అతని కుమారుడు వచ్చి ... వివరించాడు’ అని ఏకవచనంలో ఉండి, చివర ‘వారు వాటిని తమ తండ్రికి వివరించారు’ అని బహువచనానికి మారుతుంది. ఇది ఒకరికంటే ఎక్కువ మంది కుమారులను సూచించవచ్చు లేదా పాఠ్య/కథన అసమానత కావచ్చు; అనువాదం ఈ మార్పును సమన్వయం చేయకుండా నిలుపుతుంది.
    reason: textual_variant
lexical_decisions:
- source_word: נָבִיא אֶחָד זָקֵן
  choice: ఒక వృద్ధ ప్రవక్త
  rationale: אֶחָד ఇక్కడ నిర్దిష్టంగా పరిచయం కాని ఒక వ్యక్తిని సూచిస్తుంది. ‘ఒక వృద్ధ ప్రవక్త’ సహజమైన తెలుగులో ఆ అనిర్దిష్టతను నిలుపుతుంది.
- source_word: יֹשֵׁב בְּבֵית־אֵל
  choice: బేతేలులో ... నివసిస్తూ ఉన్నాడు
  rationale: יֹשֵׁב అక్షరార్థంగా కూర్చోవడం అనే భావం కలిగినా, ఈ సందర్భంలో నివాసాన్ని సూచిస్తుంది.
- source_word: וַיָּבֹא בְנוֹ
  choice: అతని కుమారుడు వచ్చి
  rationale: בְנוֹ రూపం ఏకవచనం. వాక్యాంతంలోని బహువచనంతో సమన్వయం చేయకుండా మూలంలోని ఏకవచనాన్ని నిలిపాం.
- source_word: וַיְסַפֶּר לוֹ
  choice: అతనికి వివరించాడు
  rationale: పియేల్‌లో ספר జరిగినదాన్ని చెప్పడం లేదా వివరించడం అనే భావాన్ని ఇస్తుంది; కథన సందర్భంలో ‘వివరించాడు’ సహజంగా ఉంది.
- source_word: אֶת כָּל הַמַּעֲשֶׂה
  choice: చేసిన కార్యమంతటినీ
  rationale: מַעֲשֶׂה ఏకవచనంలో ఉండి, దేవుని మనిషి చేసిన ప్రాముఖ్యమైన కార్యాన్ని సమష్టిగా సూచిస్తుంది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: పూర్వ ప్రవక్తల గ్రంథాల్లో ఇది స్థిరమైన ప్రవక్తీయ బిరుదు; దానిని నేరుగా నిలిపాం.
- source_word: הַיּוֹם
  choice: ఆ రోజు
  rationale: గతకాల కథనంలో הַיּוֹםను ‘ఆ రోజు’గా అనువదించడం సహజం.
- source_word: אֶת הַדְּבָרִים אֲשֶׁר דִּבֶּר אֶל הַמֶּלֶךְ
  choice: రాజుతో పలికిన మాటలనూ
  rationale: דְּבָרִיםలోని ‘మాటలు’ అనే స్పష్టమైన భావాన్ని నిలిపి, కార్యం మరియు ప్రవచన వాక్కు మధ్య తేడాను కాపాడాం.
- source_word: וַיְסַפְּרוּם לַאֲבִיהֶם
  choice: వారు వాటిని తమ తండ్రికి వివరించారు
  rationale: మసొరెటిక్ పాఠంలో క్రియ, కర్తసూచన, తండ్రిని సూచించే ప్రత్యయం బహువచనంలో ఉన్నాయి; అలాగే బహువచన కర్మ ప్రత్యయాన్ని ‘వాటిని’గా వ్యక్తం చేశాం.
