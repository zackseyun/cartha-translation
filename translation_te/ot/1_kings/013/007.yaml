  text: Then the king said to the man of God[a], “Come home with me and eat, and I will give you a gift.”
translation:
  language: te
  text: అప్పుడు రాజు దేవుని మనిషితో, “నాతోపాటు ఇంటికి వచ్చి భోజనం చేయి[a]; నేను నీకు ఒక కానుక ఇస్తాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సేదదీర్చుకో” లేదా “ఆహారం తీసుకో”; హీబ్రూ క్రియకు తనను బలపరచుకోవడం లేదా పోషించుకోవడం అనే అర్థం ఉంది, ఇది తరచుగా భోజనం చేయడం ద్వారా జరుగుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘అప్పుడు ... అన్నాడు’ సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: నిర్దిష్ట నామవాచకానికి సందర్భానుగుణమైన సరళ అనువాదం.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: హీబ్రూ స్థిరపదబంధాన్ని ‘ప్రవక్త’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా యథార్థంగా నిలుపుతుంది.
- source_word: בֹּאָה
  choice: వచ్చి
  rationale: ఆహ్వాన సందర్భంలోని ఆజ్ఞారూపాన్ని తెలుగులో సహజమైన సంయుక్త క్రియారూపంగా అందిస్తుంది; అదనపు మర్యాదార్థాన్ని చేర్చదు.
- source_word: אִתִּי הַבַּיְתָה
  choice: నాతోపాటు ఇంటికి
  rationale: దిశను సూచించే రూపం ‘ఇంటికి’ అనే అర్థాన్ని ఇస్తుంది; ‘నాతోపాటు’ సహవాసాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וּסְעָדָה
  choice: భోజనం చేసి బలపడు
  rationale: סעד అంటే తనను బలపరచుకోవడం లేదా నిలబెట్టుకోవడం; ఈ సందర్భంలో అది ఆహారం ద్వారా జరుగుతుంది. ఈ అనువాదం భోజన సూచననూ, మూలక్రియలోని విస్తృత భావాన్నీ కాపాడుతుంది.
- source_word: וְאֶתְּנָה לְךָ
  choice: నేను నీకు ... ఇస్తాను
  rationale: ఆఫర్ సందర్భంలో మొదటి పురుష సంకల్ప/భవిష్యత్ భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: מַתָּת
  choice: ఒక కానుక
  rationale: ‘కానుక’ తటస్థంగా gift/present భావాన్ని ఇస్తుంది; మూలంలో స్పష్టంగా లేని ప్రతిఫల భావాన్ని చేర్చదు.
