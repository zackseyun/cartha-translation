source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אֶל בָּנָ֔י/ו חִבְשׁוּ לִ֖/י הַ/חֲמ֑וֹר וַ/יַּחְבְּשׁוּ ל֣/וֹ הַ/חֲמ֔וֹר וַ/יִּרְכַּ֖ב עָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/013.yaml
  text: And he said to his sons[a], “Saddle the donkey for me.” So they saddled the donkey for him, and he rode on it.
translation:
  language: te
  text: అతడు తన కుమారులతో, “నా కోసం గాడిదకు జీను కట్టండి” అన్నాడు. వారు అతనికోసం గాడిదకు జీను కట్టారు; అతడు దానిమీద స్వారీ చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־בָּנָיו
  choice: అతడు తన కుమారులతో … అన్నాడు
  rationale: వచనంలోని కథన క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, בָּנָיו అనే పుంలింగ బహువచనాన్ని నిర్దిష్టంగా ‘కుమారులు’గా అనువదిస్తుంది.
- source_word: חִבְשׁוּ לִי הַחֲמוֹר
  choice: నా కోసం గాడిదకు జీను కట్టండి
  rationale: ఈ సందర్భంలో חבש అంటే స్వారీకి జంతువును సిద్ధం చేయడం, ప్రత్యేకంగా జీను కట్టడం. ఈ తెలుగు ప్రయోగం ఆ అర్థాన్ని సహజంగా, స్పష్టంగా అందిస్తుంది.
- source_word: וַיַּחְבְּשׁוּ לוֹ הַחֲמוֹר
  choice: వారు అతని కోసం గాడిదకు జీను కట్టారు
  rationale: ఆజ్ఞలో వాడిన క్రియనే అమలు చేసిన చర్యలోనూ పునరావృతం చేసి, హీబ్రూ వాక్య నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וַיִּרְכַּב עָלָיו
  choice: అతడు దానిమీద ఎక్కాడు
  rationale: רכב על అనే పదబంధం జంతువుమీద ఎక్కడం లేదా దానిపై స్వారీ చేయడం అనే అర్థం ఇస్తుంది. ఇక్కడ ‘దానిమీద ఎక్కాడు’ సహజమైన తెలుగు; ప్రయాణ దిశ లేదా గమ్యాన్ని మూలంలో లేనివిధంగా చేర్చదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలో స్పష్టమైన పాఠాంతర లేదా భావసందిగ్ధత లేకపోవడంతో పాదటిప్పణి చేర్చలేదు; అందించిన ఆంగ్ల పాదటిప్పణి గుర్తు మరియు విషయం పరస్పరం సరిపోకపోవడం వల్ల దానిని అనుసరించలేదు.
