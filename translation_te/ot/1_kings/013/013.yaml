- from: అతడు తన కుమారులతో, “నా కోసం గాడిదకు జీను కట్టండి” అన్నాడు. వారు అతని కోసం గాడిదకు జీను కట్టారు; అతడు దానిమీద ఎక్కాడు.
  to: అతడు తన కుమారులతో, “నా కోసం గాడిదకు జీను కట్టండి” అన్నాడు. వారు అతనికోసం గాడిదకు జీను కట్టారు; అతడు దానిమీద స్వారీ చేశాడు.
