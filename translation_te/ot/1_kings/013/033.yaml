revisions:
- from: ఈ సంఘటన తర్వాత యెరోబాము తన చెడు మార్గం నుంచి తిరగలేదు. అతడు మళ్లీ ప్రజల్లోని అన్ని వర్గాల నుంచి[a] ఉన్నత స్థలాల కోసం యాజకులను నియమించాడు. యాజకుడు కావాలని కోరినవాణ్ణి అతడు ప్రతిష్ఠించేవాడు[b]; ఆ వ్యక్తి ఉన్నత స్థలాల యాజకుల్లో ఒకడయ్యేవాడు.
  to: ఈ సంఘటన తర్వాత, యెరోబాము తన చెడు మార్గం నుంచి తిరగలేదు. అతడు మళ్లీ ప్రజల్లోని అన్ని రకాల వారిలోనుంచి[a] ఉన్నత స్థలాల యాజకులను నియమించాడు. యాజకుడవాలని కోరిన ఎవరినైనా అతడు యాజకునిగా నియమించేవాడు[b]; అతడు ఉన్నత స్థలాల యాజకుల్లో ఒకడయ్యేవాడు.
  rationale: The revision narrows two avoidable interpretive expansions while retaining the meaning. It does not resolve the disputed force of מִקְצוֹת הָעָם beyond what the context permits, and it renders the installation idiom plainly in the text while preserving its literal form in a correctly anchored footnote.
