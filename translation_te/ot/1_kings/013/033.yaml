  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַחַר֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה לֹֽא שָׁ֥ב יָרָבְעָ֖ם מִ/דַּרְכּ֣/וֹ הָ/רָעָ֑ה וַ֠/יָּשָׁב וַ/יַּ֜עַשׂ מִ/קְצ֤וֹת הָ/עָם֙ כֹּהֲנֵ֣י בָמ֔וֹת הֶֽ/חָפֵץ֙ יְמַלֵּ֣א אֶת יָד֔/וֹ וִ/יהִ֖י כֹּהֲנֵ֥י בָמֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/033.yaml
  text: After this event[a], Jeroboam did not turn from his evil way, but again made priests of high places from among all the people. Whoever desired it, he ordained him, and he became one of the priests of the high places.
translation:
  language: te
  text: ఈ సంఘటన తర్వాత, యెరోబాము తన చెడు మార్గం నుంచి తిరగలేదు. అతడు మళ్లీ ప్రజల్లోని అన్ని రకాల వారిలోనుంచి[a] ఉన్నత స్థలాల యాజకులను నియమించాడు. యాజకుడవాలని కోరిన ఎవరినైనా అతడు యాజకునిగా నియమించేవాడు[b]; అతడు ఉన్నత స్థలాల యాజకుల్లో ఒకడయ్యేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ హెబ్రీయ పదబంధానికి అక్షరార్థంగా, ‘ప్రజల చివరల నుండి’ అని చెప్పవచ్చు. దీని ఖచ్చితమైన భావం అనిశ్చితం; ఎలాంటి నిర్దిష్ట వర్గ పరిమితి లేకుండా ప్రజలలోనుండి ఎంపిక చేయడాన్ని ఇది సూచించవచ్చు.
    reason: lexical_ambiguity
  - marker: b
    text: అక్షరార్థంగా, ‘అతని చేతిని నింపాడు.’ ఇది ఒకరిని యాజక సేవలో నియమించడాన్ని లేదా ప్రతిష్ఠించడాన్ని సూచించే హెబ్రీయ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַדָּבָר הַזֶּה
  choice: ఈ సంఘటన తర్వాత
  rationale: דָּבָר అనే పదానికి ‘విషయం,’ ‘సంగతి,’ ‘కార్యం’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ ముందటి కథనాన్ని సూచిస్తున్నందున ‘ఈ సంఘటన’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: לֹא שָׁב ... מִדַּרְכּוֹ הָרָעָה
  choice: తన చెడు మార్గం నుంచి తిరగలేదు
  rationale: שׁוּב అనే క్రియలోని ‘తిరుగు’ రూపకాన్ని నిలుపుతూ, ‘పశ్చాత్తాపపడలేదు’ అనే మరింత వ్యాఖ్యానాత్మకమైన పదాన్ని ప్రధాన పాఠ్యంలో నివారించింది.
- source_word: וַיָּשָׁב וַיַּעַשׂ
  choice: మళ్లీ ... నియమించాడు
  rationale: ఇక్కడ రెండో שׁוּב తరువాతి చర్యను తిరిగి చేయడం లేదా కొనసాగించడం సూచిస్తుంది; తెలుగులో ‘మళ్లీ’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִקְצוֹת הָעָם
  choice: ప్రజల్లోని అన్ని వర్గాల నుంచి
  rationale: ఈ క్లిష్టమైన పదబంధం ప్రజలలో ఏ ప్రత్యేక అర్హతగల వర్గానికీ నియామకాన్ని పరిమితం చేయలేదనే భావాన్ని ఇస్తుంది. మూలంలోని రూపకాన్ని అస్పష్టంగా అనువదించకుండా, దాని అనిశ్చితిని పాదసూచికలో తెలియజేసింది.
- source_word: כֹּהֲנֵי בָמוֹת
  choice: ఉన్నత స్థలాల కోసం యాజకులు
  rationale: בָּמוֹת స్థానిక ఆరాధనా ఉన్నత స్థలాలను సూచిస్తుంది. ‘కోసం’ అనే నిర్మాణం వారు ఆ స్థలాల్లో సేవచేసే యాజకులని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: הֶחָפֵץ
  choice: యాజకుడు కావాలని కోరినవాణ్ణి
  rationale: నిర్దిష్ట వ్యక్తిని కాకుండా ఎవరైనా కోరితే అనే సాధారణ భావాన్ని సందర్భానుసారంగా వ్యక్తం చేస్తుంది.
- source_word: יְמַלֵּא אֶת יָדוֹ
  choice: ప్రతిష్ఠించేవాడు
  rationale: ‘చేతిని నింపడం’ అనే హెబ్రీయ ఇడియమ్ యాజక సేవలో ఒకరిని నియమించి ప్రతిష్ఠించడాన్ని సూచిస్తుంది. సహజమైన ప్రధాన అనువాదంతో పాటు అక్షరార్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: וִיהִי כֹּהֲנֵי בָמוֹת
  choice: ఆ వ్యక్తి ఉన్నత స్థలాల యాజకుల్లో ఒకడయ్యేవాడు
  rationale: ఏకవచన క్రియతో వచ్చిన బహువచన విధేయం ఆ యాజకుల వర్గంలో చేరడాన్ని సూచిస్తుంది; తెలుగులో ‘యాజకుల్లో ఒకడు’ అని సహజంగా వ్యక్తం చేసింది.
theological_decisions:
- issue: שׁוּב అనే క్రియను మతపరమైన ‘పశ్చాత్తాపపడడం’గా అనువదించాలా?
  choice: తన చెడు మార్గం నుంచి తిరగలేదు
  alternative: తన చెడు మార్గం గురించి పశ్చాత్తాపపడలేదు
  rationale: సందర్భంలో నైతిక మార్పు ఉద్దేశించబడినా, మూల క్రియ నేరుగా ‘తిరుగు’ అని చెబుతుంది. అందువల్ల మూలంలోని స్పష్టమైన మార్గరూపకాన్ని నిలిపింది.
- issue: יְמַלֵּא אֶת יָדוֹ అనే యాజక నియామక ఇడియమ్‌ను ఎలా తెలపాలి?
  choice: ప్రతిష్ఠించేవాడు
  alternative: అతని చేతిని నింపేవాడు
  rationale: అక్షరార్థ అనువాదం ఆధునిక తెలుగు పాఠకులకు అర్థంకాకపోవచ్చు. ‘ప్రతిష్ఠించేవాడు’ దాని కార్యార్థాన్ని తెలియజేస్తుంది; మూల ఇడియమ్ పాదసూచికలో భద్రపరచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘ఉన్నత స్థలాలు,’ ‘యాజకులు,’ ‘ప్రతిష్ఠించేవాడు’ వంటి పదాలు మూలంలోని ఆరాధనా సందర్భాన్ని స్పష్టంగా ఉంచుతాయి; క్లిష్టమైన హెబ్రీయ పదబంధాల అనిశ్చితి పాదసూచికల్లో భద్రపరచబడింది.
