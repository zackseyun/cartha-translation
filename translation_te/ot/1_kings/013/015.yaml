translation:
  language: te
  text: అప్పుడు అతడు అతనితో, “నాతో ఇంటికి వచ్చి భోజనం చేయి[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాతో ఇంటికి వెళ్లి రొట్టె తిను.” హీబ్రూ క్రియకు అక్షరార్థం “వెళ్లు”; “రొట్టె” అనే పదం విస్తృతంగా ఆహారం లేదా భోజనాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు … అన్నాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు … అన్నాడు’ దాని క్రమానుగత భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֵלָיו
  choice: అతనితో
  rationale: మాట ఎవరిని ఉద్దేశించి చెప్పబడిందో తెలిపే హీబ్రూ పూర్వప్రత్యయం మరియు తృతీయ పురుష ఏకవచన ప్రత్యయానికి సహజమైన తెలుగు రూపం.
- source_word: לֵךְ
  choice: వచ్చి
  rationale: మూల క్రియకు అక్షరార్థంగా ‘వెళ్లు’ అని అర్థం. అయితే మాట్లాడుతున్న వ్యక్తి తనతో తన ఇంటికి రావాలని ఆహ్వానిస్తున్న సందర్భంలో తెలుగులో ‘నాతో … వచ్చి’ అనడం సహజం; అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: אִתִּי
  choice: నాతో
  rationale: ప్రథమ పురుష ఏకవచన ప్రత్యయంతో ఉన్న పూర్వప్రత్యయానికి నేరమైన సమానార్థక రూపం.
- source_word: הַבָּיְתָה
  choice: ఇంటికి
  rationale: ‘ఇల్లు’ అనే పదానికి దిశను సూచించే ప్రత్యయం జతకావడం వల్ల ‘ఇంటివైపు/ఇంటికి’ అనే భావం వస్తుంది. ‘నాతో’ అనే సందర్భంలో అది మాట్లాడేవాని ఇంటిని సూచిస్తుంది; ‘నా’ అనే పదాన్ని అనవసరంగా చేర్చలేదు.
- source_word: וֶאֱכֹל
  choice: చేయి
  rationale: మొదటి ఆజ్ఞను అనుసరించే ఆహ్వానాత్మక ఆజ్ఞారూపం. తెలుగులో ‘భోజనం చేయి’ అనే సంయుక్త ప్రయోగంలో క్రియాభావం సహజంగా నిలుస్తుంది.
- source_word: לָחֶם
  choice: భోజనం
  rationale: లֶחֶם అనే పదానికి ప్రాథమిక అర్థం ‘రొట్టె’; అయితే అది విస్తృతంగా ఆహారం లేదా భోజనాన్ని కూడా సూచిస్తుంది. ఈ ఆహ్వాన సందర్భంలో ‘భోజనం చేయి’ ఆధునిక తెలుగులో సహజంగా ఉండగా, అక్షరార్థమైన ‘రొట్టె తిను’ పాదసూచికలో ఇవ్వబడింది.
