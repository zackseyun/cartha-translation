  naturalness: ‘జవాబిస్తూ’ కంటే కథనంలో ‘జవాబిచ్చి ఇలా అన్నాడు’ సహజంగా ఉంటుంది. ‘దయచేసి’తో పాటు గౌరవపూర్వక బహువచన క్రియలు (‘వేడుకోండి,’ ‘ప్రార్థించండి’) ఆధునిక ప్రామాణిక తెలుగులో మరింత సజావుగా, సందర్భానికి తగినట్లుగా ఉంటాయి. చేతి కోలుకోవడాన్ని ‘మళ్లీ సాధారణ స్థితికి రావడం’గా చెప్పడం స్పష్టంగా ఉంది.
