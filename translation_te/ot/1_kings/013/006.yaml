source:
  edition: WLC
  text: וַ/יַּ֨עַן הַ/מֶּ֜לֶךְ וַ/יֹּ֣אמֶר אֶל אִ֣ישׁ הָ/אֱלֹהִ֗ים חַל נָ֞א אֶת פְּנֵ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ וְ/הִתְפַּלֵּ֣ל בַּעֲדִ֔/י וְ/תָשֹׁ֥ב יָדִ֖/י אֵלָ֑/י וַ/יְחַ֤ל אִישׁ הָֽ/אֱלֹהִים֙ אֶת פְּנֵ֣י יְהוָ֔ה וַ/תָּ֤שָׁב יַד הַ/מֶּ֨לֶךְ֙ אֵלָ֔י/ו וַ/תְּהִ֖י כְּ/בָ/רִֽאשֹׁנָֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/006.yaml
  text: Then the king answered and said to the man of God[a], “Please entreat the favor of Yahweh your God, and pray for me, that my hand may be restored to me.” So the man of God entreated the favor of Yahweh, and the king’s hand was restored to him and became as it was before.
translation:
  language: te
  text: 'అప్పుడు రాజు దేవుని మనిషికి జవాబిచ్చి ఇలా అన్నాడు: “దయచేసి నీ దేవుడైన యాహ్వే అనుగ్రహాన్ని వేడుకోండి[a]; నా కోసం ప్రార్థించండి, నా చెయ్యి మళ్లీ సాధారణ స్థితికి వచ్చేలా.” దేవుని మనిషి యాహ్వే అనుగ్రహాన్ని వేడుకున్నాడు. అప్పుడు రాజు చెయ్యి మళ్లీ సాధారణ స్థితికి వచ్చి, మునుపటిలా అయింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే అనుగ్రహాన్ని కోరండి.” హీబ్రూ నుడికారం అక్షరాలా, “యాహ్వే ముఖాన్ని వేడుకోండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חַל נָא אֶת־פְּנֵי יְהוָה / וַיְחַל ... אֶת־פְּנֵי יְהוָה
  choice: యాహ్వే అనుగ్రహాన్ని వేడుకో / యాహ్వే అనుగ్రహాన్ని వేడుకున్నాడు
  rationale: ఈ హీబ్రూ నుడికారం ఒకరి అనుగ్రహాన్ని వేడుకోవడం లేదా కోరడం అనే అర్థాన్నిస్తుంది. అక్షరార్థమైన ‘ముఖాన్ని వేడుకో’ అనే రూపం తెలుగులో అపార్థానికి దారితీయవచ్చు; ‘అనుగ్రహాన్ని వేడుకో’ మూల భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: రాజు యాహ్వేను దేవుని మనిషి దేవుడిగా సంబోధిస్తున్న మూలంలోని ద్వితీయ పురుష ఏకవచన సంబంధాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: וְהִתְפַּלֵּל בַּעֲדִי
  choice: నా కోసం ప్రార్థించు
  rationale: బְּעַדితో కూడిన ఈ క్రియ ఇతరుని తరఫున చేసే ప్రార్థనను సూచిస్తుంది. ‘నా కోసం ప్రార్థించు’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: וְתָשֹׁב יָדִי אֵלָי / וַתָּשָׁב יַד־הַמֶּלֶךְ אֵלָיו
  choice: నా చెయ్యి మళ్లీ బాగుపడుతుంది / రాజు చెయ్యి మళ్లీ బాగై
  rationale: అక్షరార్థంగా చెయ్యి ‘తిరిగి రావడం’ అని ఉన్నా, ముందటి వచనంలోని దాని దెబ్బతిన్న స్థితి నుంచి కోలుకోవడమే ఉద్దేశం. తెలుగులో ‘మళ్లీ బాగుపడడం’ ఆ ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וַתְּהִי כְּבָרִאשֹׁנָה
  choice: మునుపటిలా అయింది
  rationale: చెయ్యి తన పూర్వ స్థితికి పూర్తిగా తిరిగి వచ్చిందనే భావాన్ని సరళమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: మూలంలోని స్థిరమైన ప్రవక్తీయ బిరుదును ‘ప్రవక్త’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా సంరక్షిస్తుంది.
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: జవాబిస్తూ ... అన్నాడు
  rationale: హీబ్రూ కథన జంట క్రియల భావాన్ని తెలుగులో కృత్రిమంగా అనిపించకుండా నిలుపుతుంది.
theological_decisions:
- issue: రాజు యాహ్వేను ‘నీ దేవుడు’ అని సంబోధించడం
  choice: ‘నీ దేవుడైన యాహ్వే’ అని ఏకవచన ద్వితీయ పురుష రూపాన్ని నిలుపుట
  alternative: ‘మన దేవుడైన యాహ్వే’
  rationale: మూలంలో రాజు తనను చేర్చుకోకుండా దేవుని మనిషితో ‘నీ దేవుడు’ అంటాడు. దాన్ని ‘మన దేవుడు’గా మార్చడం మూలంలో లేని ఒడంబడిక ఐక్యతను చేర్చి, వాక్యంలోని భావ ఉద్రిక్తతను తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘దేవుని మనిషి’ అనే మూల బిరుదు, ‘నీ దేవుడు’ అనే దూరాన్ని సూచించే సంబోధన, యాహ్వే అనే దైవనామం నిలుపబడ్డాయి.
