id: 1KI.13.4
reference: 1 Kings 13:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ הַ/מֶּ֜לֶךְ אֶת דְּבַ֣ר אִישׁ הָ/אֱלֹהִ֗ים אֲשֶׁ֨ר קָרָ֤א עַל הַ/מִּזְבֵּ֨חַ֙ בְּ/בֵֽית אֵ֔ל וַ/יִּשְׁלַ֨ח יָרָבְעָ֧ם אֶת יָד֛/וֹ מֵ/עַ֥ל הַ/מִּזְבֵּ֖חַ לֵ/אמֹ֣ר תִּפְשֻׂ֑/הוּ וַ/תִּיבַ֤שׁ יָד/וֹ֙ אֲשֶׁ֣ר שָׁלַ֣ח עָלָ֔י/ו וְ/לֹ֥א יָכֹ֖ל לַ/הֲשִׁיבָ֥/הּ אֵלָֽי/ו־־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/004.yaml
  text: And when the king heard the word of the man of God[a], who cried out against the altar at Bethel, Jeroboam stretched out his hand from the altar, saying, “Seize him!” But his hand, which he stretched out against him, dried up, and he could not draw it back to himself.
translation:
  language: te
  text: దేవుని మనిషి బేతేలులో బలిపీఠానికి వ్యతిరేకంగా కేక వేసిన మాటను రాజు విన్నప్పుడు, యెరొబాము బలిపీఠం మీదనుంచి తన చెయ్యి చాచి, “అతణ్ణి పట్టుకోండి!” అన్నాడు. అయితే అతనికి వ్యతిరేకంగా చాపిన అతని చెయ్యి ఎండిపోయింది[a]; దాన్ని తిరిగి తన దగ్గరకు తీసుకురాలేకపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వాడిపోయింది.” హెబ్రీలో అక్షరార్థంగా “ఎండిపోయింది.”
    reason: יבש అనే పదానికి సాధ్యమైన సహజ ప్రత్యామ్నాయాన్ని తెలియజేస్తూ, మూలంలోని అక్షరార్థ రూపకాన్ని సూచించడం.
lexical_decisions:
- source_word: דְּבַר
  choice: మాట
  rationale: ప్రవచనంగా పలికిన నిర్దిష్ట వాక్కు లేదా సందేశాన్ని సూచించే హెబ్రీ ఏకవచన రూపాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: ఇది హెబ్రీలోని స్థిరమైన బిరుదును నేరుగా నిలుపుతుంది; మూలంలో లేని ‘ప్రవక్త’ అనే వివరణను చేర్చదు.
- source_word: קָרָא עַל
  choice: వ్యతిరేకంగా ప్రకటించిన
  rationale: קרא లోని బహిరంగంగా పలికే భావాన్నీ, על లోని ప్రతికూల దిశనూ సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: בְּבֵית אֵל
  choice: బేతేలులోని
  rationale: స్థల నామాన్ని ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇస్తూ, అక్కడ ఉన్న బలిపీఠంతో దాని సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ מֵעַל הַמִּזְבֵּחַ
  choice: బలిపీఠం దగ్గర నుంచి తన చెయ్యి చాపి
  rationale: చెయ్యి చాపడం అనే శత్రుత్వపూర్వక సంజ్ఞను సహజ తెలుగులో అందిస్తుంది; מֵעַל‌ను రాజు బలిపీఠం వద్ద ఉన్న సందర్భానికి అనుగుణంగా ‘దగ్గర నుంచి’ అని వ్యక్తం చేస్తుంది.
- source_word: תִּפְשֻׂהוּ
  choice: అతణ్ణి పట్టుకోండి!
  rationale: బహువచన ఆజ్ఞను నిలుపుతూ, ఆధునిక న్యాయపరమైన భావాన్ని అనవసరంగా జోడించకుండా రాజు ఆజ్ఞలోని తీవ్రతను చూపుతుంది.
- source_word: וַתִּיבַשׁ יָדוֹ
  choice: అతని చెయ్యి ఎండిపోయింది
  rationale: יבש యొక్క మూల రూపకమైన ‘ఎండిపోవడం’ అనే భావాన్ని నిలుపుతుంది; వైద్య నిర్ధారణను జోడించదు.
- source_word: אֲשֶׁר שָׁלַח עָלָיו
  choice: అతనికి వ్యతిరేకంగా చాపిన
  rationale: అదే శత్రుత్వపూర్వక సంజ్ఞను పునరుద్ఘాటిస్తూ על యొక్క ప్రతికూల భావాన్ని కాపాడుతుంది.
- source_word: לַהֲשִׁיבָהּ אֵלָיו
  choice: దాన్ని తిరిగి తనవైపుకు తీసుకోలేకపోయాడు
  rationale: హిఫీల్ రూపంలోని ‘తిరిగి వచ్చేలా చేయడం’ అనే భావాన్ని, కదలలేని చెయ్యి సందర్భంలో స్పష్టమైన సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: యెరొబాము చెయ్యిపై వచ్చిన తీర్పు స్వభావం
  choice: చెయ్యి అకస్మాత్తుగా ఎండిపోయి పనిచేయకుండా పోయిన శారీరక పరిణామాన్ని సూటిగా వర్ణించడం
  alternative: ‘వాడిపోయింది’ అని మరింత సాంప్రదాయికంగా అనువదించడం
  rationale: కథనం దీనిని యెరొబాము శత్రుత్వపూర్వక ఆజ్ఞకు వెంటనే సంభవించిన దైవిక తీర్పుగా చూపుతుంది. వైద్య నిర్ధారణను గానీ అదనపు సిద్ధాంత వివరణను గానీ చేర్చకుండా మూలంలోని బలాన్ని ఈ ఎంపిక కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. రాజు ఆజ్ఞను నేరుగా, బహువచన రూపంలో ఉంచాం. ‘దేవుని మనిషి’ అనే మూల బిరుదును వ్యాఖ్యానాత్మకంగా ‘ప్రవక్త’గా మార్చలేదు.
