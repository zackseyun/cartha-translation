revisions:
- from: కానీ నీవు వెనక్కి తిరిగి వచ్చి, ‘రొట్టె తినవద్దు, నీళ్లు తాగవద్దు’ అని ఆయన నీతో చెప్పిన స్థలంలోనే రొట్టె తిని, నీళ్లు తాగావు. కాబట్టి నీ మృతదేహం నీ పితరుల సమాధికి చేరదు.[a]
  to: కానీ నీవు వెనక్కి తిరిగి వచ్చి, ఆయన నీతో, ‘రొట్టె తినవద్దు, నీళ్లు తాగవద్దు’ అని చెప్పిన ఆ స్థలంలో రొట్టె తిని నీళ్లు తాగావు—నీ మృతదేహం నీ పితరుల సమాధికి చేరదు.[a]
