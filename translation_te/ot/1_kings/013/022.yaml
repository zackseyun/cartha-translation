id: 1KI.13.22
reference: 1 Kings 13:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תָּ֗שָׁב וַ/תֹּ֤אכַל לֶ֨חֶם֙ וַ/תֵּ֣שְׁתְּ מַ֔יִם בַּ/מָּקוֹם֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֵלֶ֔י/ךָ אַל תֹּ֥אכַל לֶ֖חֶם וְ/אַל תֵּ֣שְׁתְּ מָ֑יִם לֹֽא תָב֥וֹא נִבְלָתְ/ךָ֖ אֶל קֶ֥בֶר אֲבֹתֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/022.yaml
  text: but you came back and ate bread and drank water in the place about which he said to you[a], ‘Do not eat bread, and do not drink water’—your corpse shall not come to the tomb of your fathers.
translation:
  language: te
  text: కానీ నీవు వెనక్కి తిరిగి వచ్చి, ఆయన నీతో, ‘రొట్టె తినవద్దు, నీళ్లు తాగవద్దు’ అని చెప్పిన ఆ స్థలంలో రొట్టె తిని నీళ్లు తాగావు—నీ మృతదేహం నీ పితరుల సమాధికి చేరదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరో విధంగా: “నీ మృతదేహం నీ పితరుల సమాధిలోకి రాదు.” హీబ్రూలో అక్షరార్థంగా, “నీ మృతదేహం నీ పితరుల సమాధికి రాదు” అని ఉంది.'
    reason: ‘చేరదు’ అనే సహజ తెలుగు రూపానికి వెనుకనున్న హీబ్రూ ‘రాదు’ చిత్రణను, ‘సమాధిలోకి’ అనే సాధ్యమైన ప్రత్యామ్నాయాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וַתָּשָׁב
  choice: నీవు వెనక్కి తిరిగి వచ్చి
  rationale: שוב అనే క్రియ ఇక్కడ దేవుని మనిషిని నేరుగా సంబోధిస్తూ, అతడు నిషేధాన్ని అతిక్రమించి తిరిగి వచ్చిన చర్యను సూచిస్తుంది. ‘వెనక్కి తిరిగి వచ్చి’ అనేది ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַתֹּאכַל לֶחֶם
  choice: రొట్టె తిని
  rationale: లֶחֶם అనే స్పష్టమైన పదాన్ని ‘ఆహారం’గా సాధారణీకరించకుండా ‘రొట్టె’గా ఉంచి, ముందటి నిషేధంతో ఉన్న పదప్రతిధ్వనిని కాపాడింది.
- source_word: וַתֵּשְׁתְּ מַיִם
  choice: నీళ్లు తాగావు
  rationale: మַיִםకు సహజమైన ఆధునిక తెలుగు రూపం ‘నీళ్లు’; నిషేధంలోనూ దాని ఉల్లంఘనలోనూ అదే పదాన్ని పునరావృతం చేసింది.
- source_word: בַּמָּקוֹם אֲשֶׁר דִּבֶּר אֵלֶיךָ
  choice: ఆయన నీతో చెప్పిన స్థలంలోనే
  rationale: హీబ్రూ సంబంధవాక్యం ఆ స్థలాన్ని అక్కడ పలికిన నిషేధంతో అనుసంధానిస్తుంది. తెలుగు వాక్యక్రమంలో ప్రత్యక్ష ఉద్ధరణను ముందుంచి ‘చెప్పిన స్థలంలోనే’ అనడం సహజంగా ఉండి, స్థలంపై ఉన్న ఉద్ఘాటనను కాపాడుతుంది.
- source_word: אַל תֹּאכַל לֶחֶם וְאַל תֵּשְׁתְּ מָיִם
  choice: ‘రొట్టె తినవద్దు, నీళ్లు తాగవద్దు’
  rationale: రెండు వేర్వేరు నిషేధాలను, వాటిలోని నామవాచకాల పునరుక్తిని అలాగే నిలిపింది.
- source_word: נִבְלָתְךָ
  choice: నీ మృతదేహం
  rationale: נבלה అంటే చనిపోయిన శరీరం. ‘మృతదేహం’ పదం మూలంలోని తీక్ష్ణతను నిలుపుతూ, ఆధునిక తెలుగులో స్పష్టంగా మరియు గౌరవప్రదంగా ఉంటుంది.
- source_word: לֹא תָבֹא נִבְלָתְךָ אֶל קֶבֶר אֲבֹתֶיךָ
  choice: నీ మృతదేహం నీ పితరుల సమాధికి చేరదు
  rationale: ‘రాదు/చేరదు’ అనే హీబ్రూ చిత్రణను క్రియాశీలంగానే ఉంచింది; దేహాన్ని ఎవరో తీసుకురారని మూలంలో లేని కర్తను చేర్చలేదు. ‘సమాధికి చేరదు’ ఆధునిక తెలుగులో సహజంగా ఉండి కుటుంబ సమాధిలో పాతిపెట్టబడకపోవడాన్ని సూచిస్తుంది.
- source_word: אֲבֹתֶיךָ
  choice: నీ పితరుల
  rationale: పురుషలింగ బహువచనమైన ‘తండ్రులు/పూర్వపితరులు’ అనే కుటుంబ వంశార్థాన్ని ‘పితరులు’ సంక్షిప్తంగా, గంభీరంగా కాపాడుతుంది.
theological_decisions:
- issue: తీర్పు ప్రకటన స్వభావం
  choice: దేవుని మనిషి మృతదేహం అతని పితరుల సమాధికి చేరదనే ప్రత్యక్ష ప్రకటన
  alternative: మరణానంతర అవమానాన్ని సూచించే విస్తృతమైన రూపకాలంకార ప్రకటన
  rationale: హీబ్రూ వాక్యం మృతదేహం పితరుల సమాధికి చేరకపోవడంపైనే స్పష్టంగా కేంద్రీకృతమైంది. అందువల్ల కుటుంబ సమాధిలో అంత్యక్రియలు జరగకపోవడం అనే వాస్తవ తీర్పును అనువాదం నిలుపుతుంది; మూలం చెప్పని అదనపు ధార్మిక వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజ వాక్యనిర్మాణంతో కూడిన గంభీరమైన ప్రవచన శైలి. ‘రొట్టె’, ‘నీళ్లు’ వంటి సులభ పదాలతో మూలంలోని పునరుక్తిని నిలిపి, ‘మృతదేహం’, ‘పితరులు’ ద్వారా తీర్పు ప్రకటనకు తగిన గౌరవభరిత స్వరాన్ని కాపాడింది.
