id: 1KI.13.18
reference: 1 Kings 13:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֗/וֹ גַּם אֲנִ֣י נָבִיא֮ כָּמוֹ/ךָ֒ וּ/מַלְאָ֡ךְ דִּבֶּ֣ר אֵלַ/י֩ בִּ/דְבַ֨ר יְהוָ֜ה לֵ/אמֹ֗ר הֲשִׁבֵ֤/הוּ אִתְּ/ךָ֙ אֶל בֵּיתֶ֔/ךָ וְ/יֹ֥אכַל לֶ֖חֶם וְ/יֵ֣שְׁתְּ מָ֑יִם כִּחֵ֖שׁ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/018.yaml
  text: And he said to him[a], “I also am a prophet like you, and an angel spoke to me by the word of Yahweh, saying, ‘Bring him back with you to your house, that he may eat bread and drink water.’” But he lied to him.
translation:
  language: te
  text: 'అతడు అతనితో ఇలా అన్నాడు: “నేనూ నీలాగే ప్రవక్తను. ఒక దేవదూత[a] యాహ్వే వాక్యం ద్వారా నాతో మాట్లాడి ఇలా అన్నాడు: ‘అతడు రొట్టె తినడానికి, నీరు తాగడానికి అతన్ని నీతోపాటు నీ ఇంటికి తిరిగి తీసుకురా.’” కానీ అతడు అతనితో అబద్ధం చెప్పాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక సందేశవాహకుడు.” హీబ్రూ పదానికి “దేవదూత” లేదా “సందేశవాహకుడు” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבִיא
  choice: ప్రవక్త
  rationale: దేవుని సందేశాన్ని ప్రకటించే వ్యక్తికి ఆధునిక ప్రామాణిక తెలుగులో స్థిరమైన, సహజమైన పదం.
- source_word: מַלְאָךְ
  choice: దేవదూత
  rationale: ఈ సందర్భంలో యాహ్వే వాక్యాన్ని తెలియజేసే అతీంద్రియ దూత అనే భావం సహజంగా ఉంది; హీబ్రూ పదానికి ‘సందేశవాహకుడు’ అనే విస్తృతార్థం కూడా ఉన్నందున దానిని పాదసూచికలో ఉంచాం.
- source_word: דִּבֶּר אֵלַי
  choice: నాతో మాట్లాడుతూ
  rationale: ప్రత్యక్షంగా సందేశం తెలియజేయడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בִּדְבַר יְהוָה
  choice: యాహ్వే వాక్యం ద్వారా
  rationale: ב యొక్క సాధనార్థాన్ని, ప్రవచన సంబంధమైన ‘యాహ్వే వాక్యం’ అనే ప్రయోగాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుగా మార్చకుండా పేరుగానే లిప్యంతరీకరిస్తుంది.
- source_word: הֲשִׁיבֵהוּ
  choice: అతన్ని ... తిరిగి తీసుకురా
  rationale: שוב హిఫీల్ రూపంలోని కారణార్థాన్ని, అంటే అతడు తిరిగి వచ్చేలా చేయడాన్ని, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אִתְּךָ אֶל־בֵּיתֶךָ
  choice: నీతోపాటు నీ ఇంటికి
  rationale: తోడు మరియు గమ్యస్థానం అనే రెండు అంశాలనూ స్పష్టంగా నిలుపుతుంది.
- source_word: וְיֹאכַל לֶחֶם
  choice: అతడు రొట్టె తిని
  rationale: లక్ష్యం లేదా ఉద్దేశాన్ని తరువాతి ‘తాగేలా’తో కలిపి సహజంగా వ్యక్తం చేస్తూ, ‘రొట్టె తినడం’ అనే హీబ్రూ స్పష్టతను కాపాడుతుంది.
- source_word: וְיֵשְׁתְּ מָיִם
  choice: నీళ్లు తాగేలా
  rationale: తిరిగి తీసుకురావాలనే ఆజ్ఞ యొక్క ఉద్దేశాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: כִּחֵשׁ לוֹ
  choice: అతడు అతనితో అబద్ధం చెప్పాడు
  rationale: కథకుడు ఆ ప్రవక్త చేసిన వాదనను అబద్ధమని నేరుగా బయటపెడుతున్న భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ ఉచ్చారణకు సమీపంగా పేరుగానే అందించాం.
- issue: מַלְאָךְ యొక్క గుర్తింపు
  choice: దేవదూత
  alternative: దూత / సందేశవాహకుడు
  rationale: ఈ కథన సందర్భం అతీంద్రియ దూతను సూచించేలా ఉన్నప్పటికీ, హీబ్రూ పదంలోని నిజమైన పదార్థ విస్తృతిని పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథనశైలిని వాడాం. హీబ్రూ వాక్యంలోని ప్రత్యక్ష ఉల్లేఖనం, కారణార్థక ‘తిరిగి తీసుకురా,’ ‘రొట్టె తిని నీళ్లు తాగడం’ అనే స్పష్టమైన పదబంధం, చివరలో కథకుడు వెల్లడించే అబద్ధం అన్నీ నిలుపబడ్డాయి.
