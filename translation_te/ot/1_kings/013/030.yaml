id: 1KI.13.30
reference: 1 Kings 13:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּנַּ֥ח אֶת נִבְלָת֖/וֹ בְּ/קִבְר֑/וֹ וַ/יִּסְפְּד֥וּ עָלָ֖י/ו ה֥וֹי אָחִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/030.yaml
  text: And he laid his corpse in his own tomb[a], and they mourned over him, saying, “Alas[b], my brother!”
translation:
  language: te
  text: అతడు అతని శవాన్ని తన సమాధిలో[a] ఉంచాడు. వారు అతని కోసం విలపిస్తూ, “అయ్యో! నా సోదరుడా![b]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తన సమాధి’ అంటే సందర్భానుసారం వృద్ధ ప్రవక్తకు చెందిన సమాధి.
    reason: referent_clarification
  - marker: b
    text: ‘నా సోదరుడా!’ అనేది తప్పనిసరిగా రక్తసంబంధాన్ని సూచించదు; సాన్నిహిత్యాన్ని లేదా సంఘీభావాన్ని వ్యక్తపరిచే విలాపోక్తి కావచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּנַּח
  choice: ఉంచాడు
  rationale: హిఫీల్ రూపంలో ఈ క్రియ ‘ఉంచడం/పడుకోబెట్టడం’ అనే భావాన్ని ఇస్తుంది. సమాధిలో శవాన్ని ఉంచే సందర్భానికి ‘ఉంచాడు’ సహజంగా, మూలానికి దగ్గరగా ఉంది.
- source_word: נִבְלָתוֹ
  choice: అతని శవాన్ని
  rationale: נְבֵלָה జీవం లేని దేహాన్ని స్పష్టంగా సూచిస్తుంది. ‘శవం’ ఆ బలాన్ని నిలుపుతూ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: בְּקִבְרוֹ
  choice: తన సమాధిలో
  rationale: קֶבֶר సమాధి లేదా సమాధి గుహను సూచించవచ్చు. సందర్భంలో వృద్ధ ప్రవక్తకు చెందిన సమాధి భావాన్ని తెలుగు ఆత్మార్థక సర్వనామమైన ‘తన’ సహజంగా తెలియజేస్తుంది.
- source_word: וַיִּסְפְּדוּ עָלָיו
  choice: వారు అతని కోసం విలపిస్తూ
  rationale: ספד మృతుని గురించి చేసే శోకవిలాపాన్ని సూచిస్తుంది. ‘అతని కోసం విలపిస్తూ’ తెలుగులో సహజంగా ఉండి, తరువాత వచ్చే విలాపోక్తితో అనుసంధానమవుతుంది.
- source_word: הוֹי
  choice: అయ్యో!
  rationale: ఇది దుఃఖాన్ని వ్యక్తపరిచే విలాపోద్గారం. ‘అయ్యో!’ తీర్పును సూచించే అదనపు భావం లేకుండా అంత్యక్రియల దుఃఖాన్ని తెలియజేస్తుంది.
- source_word: אָחִי
  choice: నా సోదరుడా!
  rationale: אָח యొక్క అక్షరార్థం ‘సోదరుడు.’ సంబోధన రూపం భావోద్వేగ బలాన్ని, విలాప సూత్రంలోని సాన్నిహిత్యాన్ని నిలుపుతుంది.
