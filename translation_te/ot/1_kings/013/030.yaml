translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన కథన శైలి వాడబడింది. ‘శవం’ మూలంలోని నిర్జీవ దేహ భావాన్ని నిలుపుతుంది; ‘విలపిస్తూ’ అంత్యక్రియల శోకాన్ని సహజంగా వ్యక్తపరుస్తుంది.
