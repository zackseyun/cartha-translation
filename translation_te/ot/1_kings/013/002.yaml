source:
  edition: WLC
  text: וַ/יִּקְרָ֤א עַל הַ/מִּזְבֵּ֨חַ֙ בִּ/דְבַ֣ר יְהוָ֔ה וַ/יֹּ֨אמֶר֙ מִזְבֵּ֣חַ מִזְבֵּ֔חַ כֹּ֖ה אָמַ֣ר יְהוָ֑ה הִנֵּֽה בֵ֞ן נוֹלָ֤ד לְ/בֵית דָּוִד֙ יֹאשִׁיָּ֣הוּ שְׁמ֔/וֹ וְ/זָבַ֣ח עָלֶ֗י/ךָ אֶת כֹּהֲנֵ֤י הַ/בָּמוֹת֙ הַ/מַּקְטִרִ֣ים עָלֶ֔י/ךָ וְ/עַצְמ֥וֹת אָדָ֖ם יִשְׂרְפ֥וּ עָלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/002.yaml
  text: 'And he cried out against the altar by the word of Yahweh and said[a], “Altar, altar, thus says Yahweh: Behold, a son will be born to the house of David, Josiah by name, and he will sacrifice on you the priests of the high places who burn incense on you[c][b], and human bones will be burned on you.”'
translation:
  language: te
  text: 'అతడు యాహ్వే వాక్కుచేత[a] బలిపీఠానికి వ్యతిరేకంగా బిగ్గరగా ప్రకటించాడు: “బలిపీఠమా, బలిపీఠమా! యాహ్వే ఇలా అంటున్నాడు: ‘ఇదిగో, దావీదు వంశంలో ఒక కుమారుడు పుడతాడు; అతని పేరు యోషీయా. నీ మీద ధూపం వేస్తున్న[c] ఉన్నత స్థలాల యాజకులను అతడు నీ మీదే బలిగా వధిస్తాడు[b]. మనుషుల ఎముకలు[d] నీ మీద కాల్చబడతాయి.’”


    [a] లేదా “యాహ్వే వాక్కు ప్రకారం,” లేక “యాహ్వే ఆదేశం మేరకు.”

    [b] లేదా “నీ మీద బలిగా అర్పిస్తాడు.” హీబ్రూ క్రియ బలి కోసం వధించడాన్ని సూచిస్తుంది; బలిపీఠం అపవిత్రం కావడంలోని వ్యంగ్యాన్ని ఇది ఉద్దేశపూర్వకంగా నొక్కిచెప్పవచ్చు.

    [c] హీబ్రూ క్రియకు “పొగ పైకి లేచేలా చేయడం” అనే విస్తృత భావం కూడా ఉంది; కనుక ఇది ధూపాన్నే కాక బలులను దహించడాన్ని కూడా సూచించవచ్చు.

    [d] అక్షరార్థంగా “ఆదామ్ ఎముకలు”; ఇక్కడ ఆదామ్ అనే పదం సాధారణంగా మనుషులను సూచిస్తుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యాహ్వే వాక్కు ప్రకారం,” లేక “యాహ్వే ఆదేశం మేరకు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “నీ మీద బలిగా అర్పిస్తాడు.” హీబ్రూ క్రియ బలి కోసం వధించడాన్ని సూచిస్తుంది; బలిపీఠం అపవిత్రం కావడంలోని వ్యంగ్యాన్ని ఇది ఉద్దేశపూర్వకంగా నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ క్రియకు “పొగ పైకి లేచేలా చేయడం” అనే విస్తృత భావం కూడా ఉంది; కనుక ఇది ధూపాన్నే కాక బలులను దహించడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: అక్షరార్థంగా “ఆదామ్ ఎముకలు”; ఇక్కడ ఆదామ్ అనే పదం సాధారణంగా మనుషులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא עַל
  choice: బలిపీఠానికి వ్యతిరేకంగా బిగ్గరగా ప్రకటించాడు
  rationale: קרא עם עַל అనే నిర్మాణం ప్రవచన సందర్భంలో గట్టిగా, దానికి వ్యతిరేకంగా ప్రకటన చేయడాన్ని సూచిస్తుంది.
- source_word: בִּדְבַר יְהוָה
  choice: యాహ్వే వాక్కుచేత
  rationale: ప్రవక్త పలికిన మాటకు దైవిక ఆధారం లేదా అధికారాన్ని సూచిస్తుంది; సాధనార్థం, ప్రమాణార్థం రెండింటి సాధ్యతను పాదటిప్పణి నిలుపుతుంది.
- source_word: מִזְבֵּחַ מִזְבֵּחַ
  choice: బలిపీఠమా, బలిపీఠమా
  rationale: నేరుగా సంబోధించే ప్రవచన గంభీరతను, మూలంలోని పునరుక్తిని నిలుపుతుంది.
- source_word: בֵן נוֹלָד לְבֵית דָּוִד
  choice: దావీదు వంశంలో ఒక కుమారుడు పుడతాడు
  rationale: నפעל participle ప్రవచన ప్రకటనలో భవిష్యత్తును సూచిస్తుంది; בית דוד ఇక్కడ రాజవంశాన్ని సూచిస్తున్నందున సహజమైన తెలుగు రూపం వాడబడింది.
- source_word: יֹאשִׁיָּהוּ שְׁמוֹ
  choice: అతని పేరు యోషీయా
  rationale: హీబ్రూ నామకరణ సూత్రాన్ని సహజమైన, స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: וְזָבַח עָלֶיךָ
  choice: నీ మీదే బలిగా వధిస్తాడు
  rationale: זבח లోని బలిసంబంధమైన వధ భావాన్ని, యాజకులే బలులుగా మారే భయానక వ్యంగ్యాన్ని నిలుపుతుంది.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: ఉన్నత స్థలాల యాజకులు
  rationale: במות అనేది స్థానిక ఆరాధనా స్థలాలను సూచిస్తుంది; ‘ఉన్నత స్థలాలు’ రాజుల గ్రంథ సందర్భంలో స్థిరమైన, అర్థవంతమైన పదబంధం.
- source_word: הַמַּקְטִרִים עָלֶיךָ
  choice: నీ మీద ధూపం వేస్తున్న
  rationale: הקטיר సాధారణంగా ధూపం లేదా అర్పణను కాల్చి పొగ పైకి లేపడాన్ని సూచిస్తుంది; ప్రధాన పాఠంలో సహజమైన అర్థాన్ని ఎంచుకుని విస్తృత సాధ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: וְעַצְמוֹת אָדָם
  choice: మనుషుల ఎముకలు
  rationale: ఇక్కడ אדם ఒక నిర్దిష్ట పురుషుణ్ణి కాక సాధారణంగా మానవులను సూచిస్తుంది.
theological_decisions:
- issue: దైవ నామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలోని ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ప్రత్యక్షంగా ప్రతిలిపి చేశాం.
- issue: యాజకులపై זבח క్రియలోని బలిసంబంధమైన వ్యంగ్యం
  choice: బలిగా వధిస్తాడు
  alternative: బలిగా అర్పిస్తాడు / వధిస్తాడు
  rationale: కేవలం హత్యగా లేదా కేవలం అర్పణగా సున్నితీకరించకుండా, బలిపీఠాన్ని అపవిత్రం చేసే ప్రవచనంలోని బలి-వధ ఉద్రిక్తతను నిలుపుతుంది.
- issue: אָדָם యొక్క పరిధి
  choice: మనుషులు
  alternative: మనిషి / పురుషుడు
  rationale: ఈ సందర్భంలో పదం లింగనిర్దిష్ట వ్యక్తిని కాక మానవ ఎముకలను సాధారణంగా సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ప్రవచనానికి తగిన గంభీరతను నిలిపాం. ‘బలిపీఠమా, బలిపీఠమా’ అనే పునరుక్తిని అలాగే ఉంచాం. ‘ఇదిగో’ అనే శ్రద్ధాకర్షక పదం, ప్రత్యక్ష దైవనామం, రాజవంశ సూచన అన్నీ మూలంలోని శైలిని ప్రతిబింబిస్తాయి. సందిగ్ధమైన בִּדְבַר, זבח, הקטיר పదాల సాధ్యార్థాలను పాదటిప్పణుల్లో వెల్లడించాం.
