  text: So he went by another way and did not return by the way he had come to Bethel.
translation:
  language: te
  text: అతడు వేరొక దారిలో వెళ్లాడు; తాను బేతేలుకు వచ్చిన దారిలో తిరిగి వెళ్లలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: కాబట్టి అతడు ... వెళ్లాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తూ, ముందున్న ఆజ్ఞకు అనుగుణమైన ఫలితాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘కాబట్టి’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּדֶרֶךְ אַחֵר
  choice: వేరొక దారిలో
  rationale: דֶּרֶךְ అంటే దారి లేదా మార్గం; אַחֵר అసలు వచ్చిన దారికి భిన్నమైన మరో దారిని సూచిస్తుంది.
- source_word: וְלֹא שָׁב
  choice: తిరిగి వెళ్లలేదు
  rationale: שׁוּב ఇక్కడ ప్రయాణ సందర్భంలో వెనక్కి వెళ్లడం లేదా తిరిగి వెళ్లడం అనే అర్థం ఇస్తుంది.
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּא בָהּ
  choice: తాను ... వచ్చిన దారిలో
  rationale: సంబంధ వాక్యం అతడు ముందుగా ప్రయాణించిన దారిని నిర్దిష్టంగా సూచిస్తుంది. בָהּ లోని స్త్రీలింగ ప్రత్యయం דֶּרֶךְ ను తిరిగి సూచిస్తున్న భావం తెలుగులో ‘దారిలో’ ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: אֶל בֵּית אֵל
  choice: బేతేలుకు
  rationale: בֵּית אֵל స్థలనామం. ‘కు’ విభక్తి అతడు ముందుగా అక్కడికి వచ్చిన గమ్యాన్ని స్పష్టంగా చూపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని రెండు సమాంతర క్రియలను సెమీకోలన్‌తో స్పష్టంగా అనుసంధానించాం; వివరణాత్మక పదాలను చేర్చలేదు.
