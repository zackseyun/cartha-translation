id: 1KI.13.3
reference: 1 Kings 13:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָתַן֩ בַּ/יּ֨וֹם הַ/ה֤וּא מוֹפֵת֙ לֵ/אמֹ֔ר זֶ֣ה הַ/מּוֹפֵ֔ת אֲשֶׁ֖ר דִּבֶּ֣ר יְהוָ֑ה הִנֵּ֤ה הַ/מִּזְבֵּ֨חַ֙ נִקְרָ֔ע וְ/נִשְׁפַּ֖ךְ הַ/דֶּ֥שֶׁן אֲשֶׁר עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/003.yaml
  text: 'And on that day he gave a sign[a], saying, “This is the sign that Yahweh has spoken: behold, the altar will be torn apart[b], and the ashes that are on it will be poured out.”'
translation:
  language: te
  text: 'ఆ రోజున అతడు ఒక సూచనను[a] ఇచ్చాడు; ఇలా అన్నాడు: “యాహ్వే పలికిన సూచన ఇదే: ఇదిగో, బలిపీఠం చీలిపోతుంది; దానిమీద ఉన్న బూడిద[b] చిందిపోతుంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అద్భుతం” లేదా “శకునం.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి హీబ్రూ పదం బలుల వల్ల ఏర్పడిన కొవ్వుతో కూడిన బూడిదను లేదా అవశేషాలను మరింత ప్రత్యేకంగా సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַן
  choice: ఇచ్చి
  rationale: נתן అనే క్రియకు ‘ఇవ్వడం/ఉంచడం’ అనే అర్థాలున్నాయి; מוֹפֵתతో కలిసి ఇక్కడ ప్రవచనాన్ని ధ్రువీకరించే సూచనను ఇవ్వడాన్ని సూచిస్తుంది.
- source_word: מוֹפֵת
  choice: సూచన
  rationale: ఈ పదానికి సూచన, అద్భుతం, శకునం అనే భావాలు ఉండవచ్చు. సందర్భంలో ఇది ప్రవచన వాక్యాన్ని ధ్రువీకరించే గుర్తు కాబట్టి ‘సూచన’ సహజంగా సరిపోతుంది; ఇతర భావాలను పాదసూచికలో ఉంచాం.
- source_word: דִּבֶּר יְהוָה
  choice: యెహోవా పలికినదానికి
  rationale: హీబ్రూ వాక్యనిర్మాణంలోని కొంత సంక్షిప్తతను సహజమైన తెలుగులో నిలుపుతూ, రాబోయే సంఘటన యెహోవా పలికిన మాటకు ధ్రువీకరణ సూచన అని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవిక వ్యక్తినామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: ప్రవచన ప్రకటనలోని దృష్ట్యాకర్షణను, గంభీరతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַמִּזְבֵּחַ נִקְרָע
  choice: బలిపీఠం చీలిపోతుంది
  rationale: నిఫాల్ రూపంలోని నిష్క్రియ/ఫలిత భావాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, సందర్భానుసారమైన భవిష్యత్ అర్థాన్ని నిలుపుతుంది.
- source_word: וְנִשְׁפַּךְ
  choice: ఒలికిపోతుంది
  rationale: שׁפך నిఫాల్ రూపం ‘పారబోయబడడం/చిందడం’ను సూచిస్తుంది. బలిపీఠంపై ఉన్న బూడిద కిందికి పడే దృశ్యానికి ‘ఒలికిపోతుంది’ సహజంగా సరిపోతుంది.
- source_word: הַדֶּשֶׁן
  choice: బూడిద
  rationale: బలి సందర్భంలో ఇది కొవ్వుతో కూడిన బూడిద లేదా బలి అవశేషాలను ప్రత్యేకంగా సూచించవచ్చు; ప్రధాన పాఠంలో సులభమైన ‘బూడిద’ను వాడి, ప్రత్యేక భావాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: אֲשֶׁר עָלָיו
  choice: దానిమీద ఉన్న
  rationale: బూడిద బలిపీఠం మీద ఉందనే సంబంధాన్ని స్పష్టమైన, సహజమైన తెలుగు విశేషణ వాక్యభాగంగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవిక నామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తినామమే ఉంది. దాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా ఉంచాం; ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’ను ఎంచుకున్నాం.
- issue: דִּבֶּר יְהוָה తో సూచనకు ఉన్న సంబంధం
  choice: యెహోవా పలికినదానికి సూచన
  alternative: యెహోవా పలికిన సూచన
  rationale: హీబ్రూ నిర్మాణం వ్యాకరణపరంగా సంక్షిప్తంగా ఉండి, ‘యెహోవా పలికిన మాటకు సూచన’ లేదా ‘యెహోవా చెప్పిన సూచన’గా గ్రహించవచ్చు. సందర్భం (13:2లోని ప్రవచనం, 13:5లోని నెరవేర్పు) మొదటి భావాన్ని బలపరుస్తుంది; అయినా అదనపు సిద్ధాంతార్థం జోడించకుండా సంక్షిప్తంగా అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే ప్రవచన ప్రకటనకు తగిన గంభీరతతో రూపొందించాం. ‘ఇదిగో’ అనే రూపం మూలంలోని దృష్ట్యాకర్షణను నిలుపుతుంది.
