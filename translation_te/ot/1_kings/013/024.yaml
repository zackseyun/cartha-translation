base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/024.yaml
  text: And he went[a], and a lion found him on the road and killed him. And his corpse was cast on the road, and the donkey was standing beside it, and the lion was standing beside the corpse.
translation:
  language: te
  text: అతడు వెళ్లాడు. దారిలో ఒక సింహం అతనికి ఎదురై అతన్ని చంపింది. అతని మృతదేహం దారిలో పడవేయబడి ఉంది[a]. గాడిద దాని పక్కన నిలిచి ఉంది; సింహం మృతదేహం పక్కన నిలిచి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని మృతదేహం దారిలో విసిరివేయబడినట్లు పడి ఉంది.’ హీబ్రూ నిష్క్రియ కృదంతం అది అక్కడ కేవలం పడి ఉండడమే కాక, పడవేయబడిందనే భావాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: అతడు వెళ్లాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగులో సహజమైన కథన క్రమాన్ని నిలుపుతుంది.
- source_word: וַיִּמְצָאֵהוּ
  choice: అతనికి ఎదురై
  rationale: מצא యొక్క ప్రాథమిక భావం ‘కనుగొను’; ఈ ఆకస్మిక జంతు-సమాగమ సందర్భంలో ‘ఎదురై’ సహజంగా ఉండి మూల భావాన్ని తెలియజేస్తుంది.
- source_word: אַרְיֵה
  choice: ఒక సింహం
  rationale: ఈ వాక్యంలో మొదటిసారి ప్రస్తావించబడుతున్నందున అనిర్దిష్ట భావాన్ని ‘ఒక’ ద్వారా వ్యక్తం చేసింది.
- source_word: בַּדֶּרֶךְ
  choice: దారిలో
  rationale: ప్రయాణ సందర్భంలో דרךకు సహజమైన ఆధునిక తెలుగు సమానార్థకం; వచనంలోని పునరుక్తిని కూడా నిలుపుతుంది.
- source_word: וַיְמִיתֵהוּ
  choice: అతన్ని చంపింది
  rationale: מות హిఫిల్ రూపం మరణానికి కారణమవడాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: נִבְלָתוֹ
  choice: అతని మృతదేహం
  rationale: נבלה ఇక్కడ చనిపోయిన మానవ శరీరాన్ని సూచిస్తుంది. ‘మృతదేహం’ గంభీరమైనదిగా, స్పష్టమైనదిగా ఉంది.
- source_word: מֻשְׁלֶכֶת
  choice: పడవేయబడి ఉంది
  rationale: שלך యొక్క హొఫల్ కృదంత రూపంలోని నిష్క్రియ భావాన్ని, అలాగే అక్కడ పడివున్న దృశ్యస్థితిని రెండింటినీ ప్రతిబింబిస్తుంది.
- source_word: וְהַחֲמוֹר עֹמֵד אֶצְלָהּ
  choice: గాడిద దాని పక్కన నిలిచి ఉంది
  rationale: עֹמֵד కృదంతం కొనసాగుతున్న దృశ్యస్థితిని సూచిస్తుంది; స్త్రీలింగ ప్రత్యయం ముందున్న ‘మృతదేహం’ను సూచిస్తుంది.
- source_word: וְהָאַרְיֵה עֹמֵד אֵצֶל הַנְּבֵלָה
  choice: సింహం కూడా మృతదేహం పక్కన నిలిచి ఉంది
  rationale: మూలంలోని కృదంత దృశ్యవర్ణనను, అలాగే ‘మృతదేహం’ అనే నామవాచక పునరుక్తిని నిలుపుతుంది; ‘కూడా’ రెండు జంతువుల సమాంతర స్థితిని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
