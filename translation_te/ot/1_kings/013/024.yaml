  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా కథన గంభీరతను నిలుపుతూ అనువదించబడింది. హీబ్రూ వాక్యంలోని దృశ్యాత్మక కృదంతాలు ‘నిలిచి ఉంది’ రూపంలో ప్రతిఫలించాయి.
