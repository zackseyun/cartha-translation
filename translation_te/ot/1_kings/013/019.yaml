  text: So he went back with him and ate bread in his house and drank water[a].
translation:
  language: te
  text: అప్పుడు అతడు అతనితో తిరిగి వెళ్లి, అతని ఇంట్లో రొట్టె తిని నీళ్లు తాగాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా ‘రొట్టె తిన్నాడు.’ ఈ మాట భోజనం చేయడాన్ని కూడా సూచించవచ్చు. అయితే చుట్టుపక్కల కథనంలో ‘రొట్టె,’ ‘నీళ్లు’ ముఖ్యమైన పదాలు కాబట్టి అక్షరార్థ పదప్రయోగాన్ని ఇక్కడ నిలిపాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: తిరిగి వెళ్లి
  rationale: שׁוב్ క్రియ యొక్క కథన రూపం, ముందుగా వెళ్లిన మార్గం నుంచి అతడు వెనుదిరిగి ఆ వ్యక్తితో వెళ్లిన పూర్తయిన చర్యను సూచిస్తుంది. ‘తిరిగి వెళ్లి’ ఆధునిక తెలుగులో సహజంగా ఉండి సందర్భంలోని కదలికను స్పష్టంగా తెలియజేస్తుంది.
- source_word: אִתּוֹ
  choice: అతనితో
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న సంబంధబోధక పదానికి నేరమైన అనువాదం; ఇది తోడుగా వెళ్లడాన్ని సూచిస్తుంది.
- source_word: וַיֹּאכַל לֶחֶם
  choice: రొట్టె తిని
  rationale: అక్షరార్థంగా ‘రొట్టె తిన్నాడు.’ హెబ్రీలో ఇది భోజనం చేయడాన్ని సూచించే నుడికారంగా ఉండవచ్చు. అయినా చుట్టుపక్కల కథనంలో రొట్టెకు ఉన్న ప్రాధాన్యాన్ని నిలుపుకోవడానికి నిర్దిష్ట పదాన్ని ఉంచాం.
- source_word: בְּבֵיתוֹ
  choice: అతని ఇంట్లో
  rationale: అక్షరార్థానికి దగ్గరగా, సహజమైన తెలుగు. సందర్భంలో ‘అతని’ అనేది వృద్ధ ప్రవక్తను సూచిస్తుంది.
- source_word: וַיֵּשְׁתְּ מָיִם
  choice: నీళ్లు తాగాడు
  rationale: క్రియాపదబంధానికి నేరమైన, సహజమైన అనువాదం. విస్తృత కథనంలో నిషేధించబడిన నిర్దిష్ట చర్యను పునరావృతం చేస్తున్నందున ‘నీళ్లు’ అనే పదాన్ని నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని వరుస చర్యలను సంక్షిప్తంగా నిలిపి, ‘రొట్టె’ మరియు ‘నీళ్లు’ అనే కథనపరంగా ముఖ్యమైన పదాలను యథాతథంగా ఉంచాం.
