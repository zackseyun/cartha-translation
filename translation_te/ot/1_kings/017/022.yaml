source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע יְהוָ֖ה בְּ/ק֣וֹל אֵלִיָּ֑הוּ וַ/תָּ֧שָׁב נֶֽפֶשׁ הַ/יֶּ֛לֶד עַל קִרְבּ֖/וֹ וַ/יֶּֽחִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/022.yaml
  text: And Yahweh listened to the voice of Elijah[a], and the life of the child returned to his inner being, and he lived.
translation:
  language: te
  text: యాహ్వే ఏలీయా స్వరాన్ని ఆలకించాడు. అప్పుడు బాలుని ప్రాణం[a] అతనిలోనికి తిరిగి వచ్చింది; అతడు బ్రతికాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బాలుని ఆత్మ అతనిలోనికి తిరిగి వచ్చింది.’ హీబ్రూ నెఫెష్ (נֶפֶשׁ) సందర్భానుసారంగా ‘ప్రాణం,’ ‘ఆత్మ,’ లేదా ‘వ్యక్తి/స్వయం’ అని అర్థమివ్వవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ఆలకించాడు
  rationale: ప్రార్థన సందర్భంలో שׁמע కేవలం వినడమే కాక అనుకూలంగా విని స్పందించడాన్ని సూచిస్తుంది. ‘ఆలకించాడు’ ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: בְּקוֹל אֵלִיָּהוּ
  choice: ఏలీయా స్వరాన్ని
  rationale: హీబ్రూ వాక్యంలోని స్పష్టమైన ‘స్వరం’ అనే రూపకల్పనను ‘ప్రార్థన’ లేదా ‘విన్నపం’గా విస్తరించకుండా నిలిపాం; తెలుగులో సహజత కోసం విభక్తిని క్రియకు అనుగుణంగా మార్చాం.
- source_word: וַתָּשָׁב
  choice: తిరిగి వచ్చింది
  rationale: שׁוב ఇక్కడ పునరాగమనాన్ని లేదా పునరుద్ధరణను సూచిస్తుంది. ‘తిరిగి వచ్చింది’ నేరుగా, సహజంగా ఉంది.
- source_word: נֶפֶשׁ
  choice: ప్రాణం
  rationale: మరణించిన బాలుడు మళ్లీ బ్రతికిన సందర్భంలో נֶפֶשׁ జీవాన్ని సూచిస్తుంది. ‘ప్రాణం’ తెలుగు వాడుకలో జీవం అనే సందర్భార్థాన్ని ఇస్తూ, ‘ఆత్మ’ వల్ల కలగగల నిర్దిష్ట మానవశాస్త్ర భావనను బలవంతంగా రుద్దదు.
- source_word: הַיֶּלֶד
  choice: బాలుడు
  rationale: יֶלֶד అంటే బిడ్డ లేదా బాలుడు. ఈ కథనంలో పిల్లవాడు మగవాడని సందర్భం తెలియజేస్తున్నందున ‘బాలుడు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: עַל קִרְבּוֹ
  choice: అతని అంతరంగంలోకి
  rationale: קֶרֶב శరీర అంతర్భాగాన్ని లేదా లోపలి ఉనికిని సూచిస్తుంది. చలనార్థకమైన ‘తిరిగి వచ్చింది’తో ‘అంతరంగంలోకి’ తెలుగు భాషలో సహజంగా ఉండి మూలంలోని అంతర్భాగ భావాన్ని నిలుపుతుంది.
- source_word: וַיֶּחִי
  choice: అతడు బ్రతికాడు
  rationale: חיה ఇక్కడ ఫలితాన్ని సూటిగా చెబుతుంది. ‘బ్రతికాడు’ సంక్షిప్తంగా, మూలానికి దగ్గరగా ఉంది.
theological_decisions:
- issue: పునర్జీవ సందర్భంలో נֶפֶשׁ అనువాదం
  choice: ప్రాణం
  alternative: ఆత్మ
  rationale: వాక్యం బాలుని జీవం పునరుద్ధరించబడిన విషయాన్ని చెబుతుంది. ‘ప్రాణం’ తక్షణ కథనార్థాన్ని అందిస్తూ, హీబ్రూ స్పష్టంగా నిర్దేశించని ఆత్మ–శరీర సిద్ధాంతాన్ని నిర్ణయించదు. ‘ఆత్మ’ సాధ్యమైన సంప్రదాయ ప్రత్యామ్నాయం కనుక పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని వరుస సంఘటనలను సహజ తెలుగు వాక్య విభజనతో అందించాం; నెఫెష్‌లోని నిజమైన అర్థవిస్తృతిని పాదసూచికలో నిలిపాం.
