source:
  edition: WLC
  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלָ֥י/ו לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/008.yaml
  text: Then the word of Yahweh came to him[a], saying,
translation:
  language: te
  text: 'అప్పుడు యహ్వే[a] వాక్కు అతనికి ఇలా వచ్చింది:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో దేవుని ప్రత్యేక నామం יהוה (YHWH) ఉంది; ఇక్కడ దాన్ని ‘యహ్వే’ అని లిప్యంతరీకరించాం.
    reason: divine_name
lexical_decisions:
- source_word: וַיְהִי
  choice: అప్పుడు … వచ్చింది
  rationale: వావ్-క్రమానుగత రూపం కథనంలోని తదుపరి సంఘటనను పరిచయం చేస్తుంది. పాతకాలపు పదబంధం వాడకుండా, ‘అప్పుడు’ కథన పురోగతిని సహజంగా తెలియజేస్తుంది; క్రియాభావం ‘వచ్చింది’లో వ్యక్తమవుతుంది.
- source_word: דְבַר
  choice: వాక్కు
  rationale: דְבַר יְהוָה ప్రవచన సంబంధమైన స్థిర పదబంధం. ‘వాక్కు’ దైవిక సంభాషణను సూచిస్తూ, ‘సందేశం’కన్నా మూలంలోని రూపాన్ని మరియు ధార్మిక బరువును మెరుగ్గా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: మూలంలో దేవుని ప్రత్యేక నామమైన చతురక్షర నామం ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించిన ఉచ్చారణకు అనుగుణంగా ‘యహ్వే’ అని లిప్యంతరీకరించాం.
- source_word: אֵלָיו
  choice: అతనికి
  rationale: אֶל అనే విభక్త్యర్థక పదానికి మూడవ పురుష ఏకవచన పుంలింగ ప్రత్యయం చేరిన ఈ రూపం నేరుగా ‘అతనికి’ అని అర్థమిస్తుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ఈ క్రియానామ రూపం తరువాతి వచనంలో వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది. తెలుగులో ద్వంద్వ క్రియాప్రయోగం లేకుండా ‘ఇలా వచ్చింది:’ అని చెప్పడం సహజంగా ఉండి, రాబోయే మాటలను స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం ఒక బిరుదును కాకుండా దేవుని ప్రత్యేక నామాన్ని ఉపయోగిస్తుంది. అందువల్ల దానిని ‘ప్రభువు’గా మార్చకుండా ‘యహ్వే’గా లిప్యంతరీకరించాం. ‘యెహోవా’ సంప్రదాయ రూపమైనప్పటికీ, ‘యహ్వే’ ప్రాచీన ఉచ్చారణకు విస్తృతంగా అంగీకరించిన పునర్నిర్మాణానికి దగ్గరగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు. ప్రవచన సూత్రవాక్యంలోని గంభీరతను ‘యహ్వే వాక్కు’ ద్వారా నిలుపుతూ, పాతకాలపు ‘సెలవిచ్చినదేమనగా’ వంటి రూపాలను నివారించాం. తరువాతి వచనంలోని ప్రత్యక్ష వాక్యాన్ని సూచించేందుకు వాక్యాంతంలో ద్విబిందువు వాడాం.
