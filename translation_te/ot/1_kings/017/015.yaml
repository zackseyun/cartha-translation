  text: So she went and did according to the word of Elijah[a], and she ate—he and she and her household—for many days.
translation:
  language: te
  text: అప్పుడు ఆమె వెళ్లి ఏలీయా మాట ప్రకారం చేసింది. ఆమె తిన్నది—అతడూ, ఆమె కూడా, ఆమె ఇంటివారు కూడా—చాలా రోజులపాటు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా మరింత అక్షరార్థంగా: “ఆమె తిన్నది—అతడూ, ఆమె కూడా, ఆమె ఇంటివారు కూడా—రోజులు.” హీబ్రూలో ఏకవచన క్రియ తరువాత తిన్నవారి జాబితా స్పష్టంగా వస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ
  choice: అప్పుడు ఆమె వెళ్లి
  rationale: కథనాన్ని ముందుకు నడిపించే wayyiqtol క్రమాన్ని సహజమైన ఆధునిక తెలుగులో ‘అప్పుడు’తో వ్యక్తం చేసింది.
- source_word: וַתַּעֲשֶׂה
  choice: చేసింది
  rationale: ఇక్కడ עשה అంటే ఏలీయా ఇచ్చిన సూచనను అమలు చేయడం; ‘చేసింది’ ఆ విస్తృత భావాన్ని సహజంగా అందిస్తుంది.
- source_word: כִּדְבַר אֵלִיָּהוּ
  choice: ఏలీయా మాట ప్రకారం
  rationale: דבר ఇక్కడ పలికిన సూచన లేదా ఆదేశాన్ని సూచిస్తుంది; ఈ రూపం మూలంలోని నిర్మాణాన్నీ గౌరవభరితమైన సహజ తెలుగునీ నిలుపుతుంది.
- source_word: וַתֹּאכַל
  choice: ఆమె తిన్నది
  rationale: క్రియ స్త్రీలింగ ఏకవచనంలో ఉంది. తరువాత వచ్చే వారందరి జాబితాను బహువచన క్రియగా సవరించకుండా మూలంలోని అసాధారణ నిర్మాణాన్ని నిలిపింది.
- source_word: הוּא וְהִיא וּבֵיתָהּ
  choice: అతడూ, ఆమె కూడా, ఆమె ఇంటివారు కూడా
  rationale: హీబ్రూలో ఉన్న ‘అతడు—ఆమె—ఆమె ఇంటివారు’ అనే క్రమాన్ని నిలిపింది; సందర్భంలో ‘అతడు’ ఏలీయాను సూచిస్తాడు.
- source_word: בֵיתָהּ
  choice: ఆమె ఇంటివారు
  rationale: ఆహారం తినే వ్యక్తుల సందర్భంలో בַּיִת భవనాన్ని కాక గృహసభ్యులను సూచిస్తుంది; ‘ఇంటివారు’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: יָמִים
  choice: చాలా రోజులపాటు
  rationale: కాలవ్యవధిని సూచించే బహువచన రూపాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘రోజులు’ అనే అక్షరార్థ నిర్మాణం పాదసూచికలో ఇవ్వబడింది.
