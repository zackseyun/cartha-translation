source:
  edition: WLC
  text: וַ/יִּתְמֹדֵ֤ד עַל הַ/יֶּ֨לֶד֙ שָׁלֹ֣שׁ פְּעָמִ֔ים וַ/יִּקְרָ֥א אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר יְהוָ֣ה אֱלֹהָ֔/י תָּ֥שָׁב נָ֛א נֶֽפֶשׁ הַ/יֶּ֥לֶד הַ/זֶּ֖ה עַל קִרְבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/021.yaml
  text: Then he stretched himself out over the boy three times[a], and he cried out to Yahweh and said, “Yahweh my God, please let this boy’s life return to him.”
translation:
  language: te
  text: అప్పుడు అతడు ఆ బాలునిమీద మూడుసార్లు తన శరీరాన్ని చాచుకొని, యెహోవాకు మొరపెట్టి, “నా దేవుడైన యెహోవా, దయచేసి ఈ బాలుని ప్రాణం[a] అతనిలోకి తిరిగి రావనివ్వు” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “ఈ బాలుని ఆత్మ అతనిలోకి తిరిగి రావుగాక.” హీబ్రూలో అక్షరార్థంగా: “ఈ బాలుని నెఫెష్ అతని అంతర్భాగానికి తిరిగి రావుగాక.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְמֹדֵד
  choice: తనను తాను చాపుకొని
  rationale: అరుదైన హిత్పయేల్ క్రియ ఇక్కడ ఏలీయా బాలునిమీద తన శరీరాన్ని చాపిన చర్యను సూచిస్తుంది. తెలుగు సహజత్వంతోపాటు ప్రతిబింబార్థాన్ని కూడా ఈ రూపం నిలుపుతుంది.
- source_word: עַל הַיֶּלֶד
  choice: ఆ బాలునిమీద
  rationale: עַל ఇక్కడ భౌతిక స్థానాన్ని సూచిస్తుంది; సందర్భంలో ‘బాలునిమీద’ సహజమైన, స్పష్టమైన రూపం.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: మూడుసార్లు
  rationale: సంఖ్యతో కూడిన ‘సార్లు’ అనే సహజ తెలుగు ప్రయోగం.
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: యెహోవాకు మొరపెట్టి
  rationale: ప్రార్థనా సందర్భంలోని קרא אל అత్యవసరమైన వేడుకోలును తెలియజేస్తుంది; ‘మొరపెట్టి’ ఆ తీవ్రతను అతిశయోక్తి లేకుండా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచింది.
- source_word: יְהוָה אֱלֹהָי
  choice: నా దేవుడైన యెహోవా
  rationale: దైవనామాన్నీ ప్రథమ పురుష స్వామ్యసూచకమైన ‘నా దేవుడు’ భావాన్నీ సహజమైన తెలుగు సంబోధనగా నిలుపుతుంది.
- source_word: תָּשָׁב נָא
  choice: దయచేసి ... తిరిగి వచ్చేలా చేయి
  rationale: జస్సివ్ రూపంతో కూడిన נָא వినయపూర్వకమైనా అత్యవసరమైన విన్నపం. కారణార్థక భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: נֶפֶשׁ
  choice: ప్రాణం
  rationale: ఈ సందర్భంలో బాలుని జీవింపజేసే జీవాన్ని సూచిస్తుంది. ‘ప్రాణం’ ఆధునిక తెలుగులో సహజంగా ఉండి, ‘ఆత్మ’ అనే సాంకేతిక మానవశాస్త్రీయ నిర్ధారణను ప్రధాన పాఠ్యంలో బలవంతంగా రుద్దదు.
- source_word: הַיֶּלֶד הַזֶּה
  choice: ఈ బాలుని
  rationale: నిర్దేశక సర్వనామాన్నీ పుంలింగ బాలుడనే సూచననూ స్పష్టంగా నిలుపుతుంది.
- source_word: עַל קִרְבּוֹ
  choice: అతనిలోకి
  rationale: అక్షరార్థంగా ‘అతని అంతర్భాగానికి/లోపలికి’ అనే భావం. ‘అతనిలోకి’ మూలంలోని అంతర్గత దిశను నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
theological_decisions:
- issue: పునర్జీవ సందర్భంలో נֶפֶשׁ అనువాదం
  choice: ప్రాణం
  alternative: ఆత్మ
  rationale: వాక్యం బాలుని జీవం తిరిగి రావాలని కోరుతుంది; ‘ప్రాణం’ కథనార్థాన్ని స్పష్టంగా అందిస్తూ నిర్దిష్టమైన ఆత్మ-శరీర సిద్ధాంతాన్ని నిర్ణయించదు. ‘ఆత్మ’ కూడా పదసాధ్యమైనందున దానిని పాదటిప్పణిలో ఉంచి మూలంలోని భావపరమైన విస్తృతిని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన-ప్రార్థనా శైలి. అరుదైన శారీరక చర్యను స్పష్టంగా తెలిపి, נֶפֶשׁ విషయంలోని పదార్థ మరియు దైవశాస్త్రీయ విస్తృతిని పాదటిప్పణిలో నిలిపింది.
