- from: అప్పుడు అతడు ఆ బాలునిమీద మూడుసార్లు తనను తాను చాపుకొని, యెహోవాకు మొరపెట్టి, “నా దేవుడైన యెహోవా, దయచేసి ఈ బాలుని ప్రాణం[a] అతనిలోకి తిరిగి వచ్చేలా చేయి” అని అన్నాడు.
  to: అప్పుడు అతడు ఆ బాలునిమీద మూడుసార్లు తన శరీరాన్ని చాచుకొని, యెహోవాకు మొరపెట్టి, “నా దేవుడైన యెహోవా, దయచేసి ఈ బాలుని ప్రాణం[a] అతనిలోకి తిరిగి రావనివ్వు” అని అన్నాడు.
  rationale: The revision retains the draft's accurate use of “ప్రాణం” and the established rendering “యెహోవా,” while representing the Hebrew jussive as a direct plea for the boy's life to return. The footnote now supplies a complete “ఆత్మ” alternative and transparently records the literal Hebrew inward-part idiom.
