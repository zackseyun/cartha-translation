revisions:
- from: అప్పుడు ఏలీయా ఆ బాలుణ్ణి తీసుకొని, మేడగది నుండి ఇంట్లోకి దింపి, అతని తల్లికి అప్పగించాడు. ఏలీయా ఆమెతో, “చూడు, నీ కుమారుడు బతికే ఉన్నాడు[a]” అన్నాడు.
  to: అప్పుడు ఏలీయా ఆ బాలుణ్ణి తీసుకొని, మేడగది నుండి ఇంట్లోకి దింపి, అతని తల్లికి ఇచ్చాడు. ఏలీయా ఆమెతో, “చూడు, నీ కుమారుడు సజీవంగా ఉన్నాడు[a]” అన్నాడు.
