source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אֵלִיָּ֜הוּ אֶת הַ/יֶּ֗לֶד וַ/יֹּרִדֵ֤/הוּ מִן הָ/עֲלִיָּה֙ הַ/בַּ֔יְתָ/ה וַֽ/יִּתְּנֵ֖/הוּ לְ/אִמּ֑/וֹ וַ/יֹּ֨אמֶר֙ אֵ֣לִיָּ֔הוּ רְאִ֖י חַ֥י בְּנֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/023.yaml
  text: Then Elijah took the boy[a], brought him down from the upper room into the house, and gave him to his mother. And Elijah said, “See, your son is alive.”
translation:
  language: te
  text: అప్పుడు ఏలీయా ఆ బాలుణ్ణి తీసుకొని, మేడగది నుండి ఇంట్లోకి దింపి, అతని తల్లికి ఇచ్చాడు. ఏలీయా ఆమెతో, “చూడు, నీ కుమారుడు సజీవంగా ఉన్నాడు[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ కుమారుడు జీవిస్తున్నాడు.”
    reason: חַי బְּנֵךְ అనే సంక్షిప్త హీబ్రూ ప్రకటనను ‘సజీవంగా ఉన్నాడు’ అని స్థితిని సూచిస్తూ, లేదా ‘జీవిస్తున్నాడు’ అని క్రియాత్మకంగా అనువదించవచ్చు.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: తీసుకొని
  rationale: לקח అనే సాధారణ కథన క్రియను సహజమైన తెలుగులో ‘తీసుకొని’ అని అనువదించడం సందర్భానికి సరిపోతుంది; బాలుణ్ణి ఎత్తుకున్నాడని పద్ధతిని అదనంగా నిర్దిష్టం చేయదు.
- source_word: הַיֶּלֶד
  choice: ఆ బాలుణ్ణి
  rationale: יֶלֶד అంటే బిడ్డ లేదా బాలుడు కావచ్చు. ఈ సందర్భంలో తల్లి కుమారుని సూచిస్తున్నందున ‘బాలుడు’ సహజంగా ఉంది; శిశువు అనే భావాన్ని అనవసరంగా కలిగించదు.
- source_word: וַיֹּרִדֵהוּ
  choice: దింపి
  rationale: ירד యొక్క causative రూపం ‘కిందికి తీసుకురావడం’ అనే భావాన్ని ఇస్తుంది. ‘దింపి’ పై గది నుండి కిందికి జరిగిన కదలికను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది; మోసుకొచ్చాడని ప్రత్యేకంగా చెప్పదు.
- source_word: הָעֲלִיָּה
  choice: మేడగది
  rationale: עֲלִיָּה పై అంతస్తులోని లేదా మేడమీద ఉన్న గదిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘మేడగది’ ఈ నిర్మాణ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: הַבַּיְתָה
  choice: ఇంట్లోకి
  rationale: దిశను సూచించే ־ה ముగింపు ఇంటి వైపు లేదా ఇంటి లోపలికి కదలికను తెలియజేస్తుంది. ‘ఇంట్లోకి’ ఆ దిశార్థాన్ని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: וַיִּתְּנֵהוּ לְאִמּוֹ
  choice: అతని తల్లికి అప్పగించాడు
  rationale: נתן + పరోక్ష కర్మను తెలుగులో ‘అప్పగించాడు’ అని చెప్పడం ఈ సందర్భంలో సహజం. ‘తిరిగి ఇచ్చాడు’ అనేది సందర్భానుసారంగా నిజమే అయినా మూలపదంలో లేని ‘తిరిగి’ భావాన్ని చేర్చుతుంది.
- source_word: רְאִי
  choice: చూడు
  rationale: ఇది తల్లిని ఉద్దేశించిన స్త్రీలింగ ఏకవచన ఆజ్ఞారూపం. ‘చూడు’ ప్రత్యక్షతను, దృష్టి ఆకర్షణను ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: חַי בְּנֵךְ
  choice: నీ కుమారుడు బతికే ఉన్నాడు
  rationale: విశేషణాత్మక predicate ‘సజీవంగా ఉన్నాడు’ అనే స్థితిని ప్రకటిస్తుంది. ‘బతికే ఉన్నాడు’ అద్భుత ఫలితాన్ని ప్రత్యక్షంగా, నాటకీయంగా తెలియజేస్తూ మూలంలోని సంక్షిప్తతను కాపాడుతుంది.
theological_decisions:
- issue: పునర్జీవ అద్భుతాన్ని ఎంత స్పష్టంగా విస్తరించాలి
  choice: ‘నీ కుమారుడు బతికే ఉన్నాడు’ అని మూలంలోని ప్రత్యక్ష ప్రకటనకే పరిమితం చేయడం
  alternative: ‘నీ కుమారుడు మళ్లీ బతికాడు’ లేదా ‘నీ కుమారుడు తిరిగి ప్రాణం పొందాడు’
  rationale: హీబ్రూ వాక్యం కుమారుడు సజీవంగా ఉన్నాడనే వాస్తవాన్ని మాత్రమే ప్రత్యక్షంగా ప్రకటిస్తుంది. పూర్వసందర్భం అద్భుతాన్ని స్పష్టం చేసినా, ‘మళ్లీ’ లేదా ‘తిరిగి ప్రాణం పొందాడు’ అని చేర్చడం మూలపాఠాన్ని వ్యాఖ్యానాత్మకంగా విస్తరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘మేడగది’ నిర్మాణ సందర్భాన్ని స్పష్టంగా ఉంచుతుంది. సంభాషణలో ‘చూడు’ అనే ప్రత్యక్ష రూపం మూలంలోని స్త్రీలింగ ఏకవచన ఆజ్ఞను సందర్భానుసారంగా అందిస్తుంది. ‘ఏలీయా ఆమెతో’ అన్న నిర్మాణం తెలుగులో మాట ఎవరిని ఉద్దేశించిందో స్పష్టం చేస్తుంది; హీబ్రూ ఆజ్ఞారూపంలోని స్త్రీలింగం దీనికి ఆధారం.
