source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל אֵ֣לִיָּ֔הוּ מַה לִּ֥/י וָ/לָ֖/ךְ אִ֣ישׁ הָ/אֱלֹהִ֑ים בָּ֧אתָ אֵלַ֛/י לְ/הַזְכִּ֥יר אֶת עֲוֺנִ֖/י וּ/לְ/הָמִ֥ית אֶת בְּנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/018.yaml
  text: She said to Elijah[a], “What do I have to do with you, man of God? Have you come to me to bring my iniquity to remembrance and to cause my son to die?”
translation:
  language: te
  text: ఆమె ఏలీయాతో, “దేవుని మనిషీ, నాతో నీకేమిటి? నా దోషాన్ని[a] జ్ఞాపకానికి తెచ్చి, నా కుమారుడు చనిపోయేలా చేయడానికి నా దగ్గరికి వచ్చావా?” అని అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నా దోషం” అనే హీబ్రూ పదాన్ని “నా పాపం” లేదా “నా అపరాధం” అని కూడా అనువదించవచ్చు. అది చేసిన తప్పును, దాని అపరాధభారాన్ని, లేదా దాని పర్యవసానాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לִּי וָלָךְ
  choice: నాతో నీకేమిటి?
  rationale: దూరం పెట్టే భావం, అభ్యంతరం, నింద కలిగిన హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా నిలుపుతుంది.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషీ
  rationale: ప్రవక్త లేదా దేవుని దూతకు వాడే స్థిరమైన హీబ్రూ బిరుదును వ్యాఖ్యానాత్మకంగా మార్చకుండా సంబోధన రూపంలో నిలుపుతుంది.
- source_word: בָּאתָ אֵלַי
  choice: నా దగ్గరికి వచ్చావా?
  rationale: సందర్భంలోని నిందారోపణతో కూడిన అలంకారప్రశ్న భావాన్ని సహజమైన తెలుగు భూతకాల ప్రశ్నగా వ్యక్తం చేస్తుంది.
- source_word: לְהַזְכִּיר
  choice: గుర్తుచేసి
  rationale: హిఫీల్ కారణార్థక భావాన్ని సందర్భానుసారంగా దేవుని దృష్టికి దోషాన్ని మళ్లీ తేవడం అనే అర్థంలో తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: עֲוֺנִי
  choice: నా దోషాన్ని
  rationale: ఈ పదంలో ఉన్న తప్పు, అపరాధస్థితి, దాని పర్యవసానం అనే అర్థపరిధిని సాధ్యమైనంతవరకు తెరిచి ఉంచే సాధారణమైన గంభీర పదం.
- source_word: וּלְהָמִית
  choice: చనిపోయేలా చేయడానికి
  rationale: מות హిఫీల్ రూపంలోని కారణార్థకతను నేరుగా ‘చంపడానికి’ అని కుదించకుండా స్పష్టంగా నిలుపుతుంది.
- source_word: בְּנִי
  choice: నా కుమారుడు
  rationale: హీబ్రూ పదం సూచించే పురుష లింగాన్ని ఖచ్చితంగా నిలుపుతుంది.
theological_decisions:
- issue: విధవ పలికిన עֲוֺנִי పదార్థం
  choice: నా దోషాన్ని
  alternative: నా పాపాన్ని; నా అపరాధాన్ని
  rationale: విధవ తన కుమారుని మరణాన్ని తన నైతిక తప్పు లేదా దాని అపరాధభారంతో అనుసంధానిస్తుంది. మూలపదం చేసిన తప్పు, దోషస్థితి, పరిణామం అన్నిటినీ సూచించగలదు; ‘దోషం’ ఈ ఉద్రిక్తతను పూర్తిగా ఒక వైపుకు పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరమైన ప్రత్యక్ష సంభాషణ శైలితో. హీబ్రూ నుడికారంలోని అభ్యంతర స్వరం, కారణార్థక క్రియలు, עָוֹן పదంలోని ఉద్దేశపూర్వక అస్పష్టత నిలుపబడ్డాయి.
