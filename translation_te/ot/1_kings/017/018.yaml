  to: ఆమె ఏలీయాతో, “దేవుని మనిషీ, నాతో నీకేమిటి? నా దోషాన్ని[a] జ్ఞాపకానికి తెచ్చి, నా కుమారుడు చనిపోయేలా చేయడానికి నా దగ్గరికి వచ్చావా?” అని అంది.
