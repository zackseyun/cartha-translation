- from: నీవు ఆ వాగులోని నీళ్లు తాగుతావు; అక్కడ నీకు ఆహారం అందించమని కాకులకు[c] నేను ఆజ్ఞాపించాను.[a][b]
  to: అప్పుడు నీవు ఆ వాగునుండి[a] నీరు తాగుతావు; అక్కడ నిన్ను పోషించమని[b] నేను కాకులకు[c] ఆజ్ఞాపించాను.
  rationale: The revision restores the source’s ‘from the brook’ relation, represents the broad provision/sustenance sense without importing the next verse’s specific food detail, retains the ordinary bird reading, and places every footnote marker at its proper textual anchor. ‘అప్పుడు’ gives a natural Telugu expression of the introductory וְהָיָה formula without over-formalizing it.
