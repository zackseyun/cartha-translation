id: 1KI.17.4
reference: 1 Kings 17:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֖ה מֵ/הַ/נַּ֣חַל תִּשְׁתֶּ֑ה וְ/אֶת הָ/עֹרְבִ֣ים צִוִּ֔יתִי לְ/כַלְכֶּלְ/ךָ֖ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/004.yaml
  text: And it shall be that you will drink from the brook[c][b][a], and I have commanded the ravens to provide for you there.
translation:
  language: te
  text: అప్పుడు నీవు ఆ వాగునుండి[a] నీరు తాగుతావు; అక్కడ నిన్ను పోషించమని[b] నేను కాకులకు[c] ఆజ్ఞాపించాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వాగు’కు బదులుగా ‘కాలానుగుణంగా ప్రవహించే వాగు’ లేదా ‘జలధార’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘నిన్ను పోషించమని’కు బదులుగా ‘నీకు అవసరమైనవి సమకూర్చమని’ లేదా ‘నీకు ఆహారం అందించమని’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూ పదం సాధారణంగా రావెన్ జాతి పక్షులను సూచిస్తుంది. కొందరు దీనిని పక్షులు కాని విధంగా అర్థం చేసుకోవాలని ప్రతిపాదించారు; అయితే సాధారణ హీబ్రూ అర్థమూ తరువాతి సందర్భమూ పక్షులనే సూచిస్తున్నాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: వాక్య నిర్మాణంలో సహజంగా అంతర్భావం
  rationale: ఈ సందర్భంలో తదుపరి పరిస్థితిని పరిచయం చేసే హీబ్రూ సూత్రప్రయోగం. తెలుగులో ప్రత్యేకంగా ‘అప్పుడు ఇలా జరుగుతుంది’ అని చేర్చితే భారంగా ఉంటుంది; భవిష్యత్ క్రియలోనే భావం సహజంగా వ్యక్తమవుతుంది.
- source_word: מֵהַנַּחַל
  choice: ఆ వాగులోని నీళ్లు
  rationale: נחל ప్రవహించే వాగును లేదా కాలానుగుణ జలప్రవాహాన్ని సూచించవచ్చు. ‘వాగు’ సాధారణ ఆధునిక తెలుగు పాఠకులకు సహజం; ‘నీళ్లు’ అనేది తాగడం అనే క్రియకు తెలుగులో సహజమైన పూరకం.
- source_word: תִּשְׁתֶּה
  choice: నీవు ... తాగుతావు
  rationale: ద్వితీయ పురుష ఏకవచన భవిష్యత్ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הָעֹרְבִים
  choice: కాకులు
  rationale: עֹרֵב సాధారణంగా రావెన్ జాతి నల్ల కాకి పక్షిని సూచిస్తుంది. తెలుగులో విస్తృతంగా అర్థమయ్యే సహజ సమానార్థకం ‘కాకులు’; మరింత నిర్దిష్ట రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: צִוִּיתִי
  choice: నేను ఆజ్ఞాపించాను
  rationale: ఇప్పటికే పూర్తయి ప్రస్తుత ఏర్పాటుకు సంబంధించిన దేవుని ఆజ్ఞను భూతకాల రూపం సహజంగా తెలియజేస్తుంది.
- source_word: לְכַלְכֶּלְךָ
  choice: నీకు ఆహారం అందించమని
  rationale: ఈ క్రియ పోషించడం, ఆదరించడం, అవసరాలు తీర్చడం అనే విస్తృత భావం కలిగి ఉంది. తరువాతి సందర్భంలో పక్షులు ఆహారం తెచ్చే కారణంగా ఈ అనువాదం స్పష్టంగా ఉంటుంది; విస్తృత ప్రత్యామ్నాయాలు పాదటిప్పణిలో ఉంచబడ్డాయి.
- source_word: שָׁם
  choice: అక్కడ
  rationale: స్థలాన్ని సూచించే సరళమైన, ప్రత్యక్ష తెలుగు సమానార్థకం.
theological_decisions:
- issue: ఆజ్ఞ పొందిన కాకుల స్వరూపం
  choice: దేవుని ఆజ్ఞతో ఏలీయాకు ఆహారం అందించే నిజమైన పక్షులు
  alternative: పక్షులు కాకుండా ఒక స్థలనామం లేదా మానవ సమూహం
  rationale: הָעֹרְבִים అనే పదానికి సాధారణ హీబ్రూ అర్థం కాకి జాతి పక్షులే; తరువాతి వచనంలో అవి రొట్టె, మాంసం తెచ్చినట్లు చెప్పడం కూడా దీనికి మద్దతిస్తుంది. అరుదైన ప్రత్యామ్నాయ ప్రతిపాదనను ప్రధాన పాఠ్యంలో స్వీకరించకుండా పాదటిప్పణిలో గుర్తించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. హీబ్రూ వాక్యంలోని క్రమాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగులో సహజత కోసం ‘వాగులోని నీళ్లు తాగుతావు’ అనే నిర్మాణం వాడబడింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
