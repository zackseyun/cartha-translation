translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘వాగు’ సాధారణ పాఠకులకు ‘వాడి’ వంటి అరువు భౌగోళిక పదం కంటే సులభంగా అర్థమవుతుంది; కాలానుగుణ ప్రవాహం అనే సూక్ష్మార్థాన్ని పాదటిప్పణి వివరిస్తుంది.
