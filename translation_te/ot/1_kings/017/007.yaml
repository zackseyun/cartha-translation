  yaml_path: translation/ot/1_kings/017/007.yaml
  text: And it happened after some days that the wadi dried up[a], because there was no rain in the land.
translation:
  language: te
  text: కొంతకాలం గడిచిన తరువాత, దేశంలో వర్షం లేకపోవడం వల్ల ఆ వాగు[a] ఎండిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఏరు.’ హీబ్రూ పదం కాలానుగుణంగా నీరు ప్రవహించే వాగును లేదా దాని ప్రవాహమార్గాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: గడిచిన తరువాత
  rationale: హీబ్రూ కథన సంధిని తెలుగులో కృత్రిమమైన ‘అలా జరిగింది’ అనే పదబంధం లేకుండా, తరువాతి సంఘటనకు సహజమైన మార్పుగా వ్యక్తం చేస్తుంది.
- source_word: מִקֵּץ יָמִים
  choice: కొంతకాలం గడిచిన తరువాత
  rationale: పదశః ‘దినాల ముగింపున’ అనే భావం ఉన్న ఈ నుడికారం నిర్దిష్టంగా చెప్పని కాలవ్యవధి గడిచిందని సూచిస్తుంది.
- source_word: וַיִּיבַשׁ
  choice: ఎండిపోయింది
  rationale: నీటి ప్రవాహం పూర్తిగా లేకుండా పోయిందనే సందర్భార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַנָּחַל
  choice: ఆ వాగు
  rationale: נחל అనేది కాలానుగుణంగా ప్రవహించే నీటిమార్గాన్ని లేదా లోయలోని ప్రవాహాన్ని సూచించగలదు. సందర్భంలో ముందే పేర్కొన్న నీటిమార్గానికి ‘ఆ వాగు’ సహజమైన తెలుగు పదం.
- source_word: כִּי
  choice: వల్ల
  rationale: వాగు ఎండిపోవడానికి కారణాన్ని తెలిపే హీబ్రూ కారణార్థక సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא הָיָה גֶשֶׁם
  choice: వర్షం లేకపోవడం
  rationale: వర్షాభావాన్ని కారణంగా తెలిపే మూలవాక్య భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: בָּאָרֶץ
  choice: దేశంలో
  rationale: ఇక్కడ אֶרֶץ భూమి అంతటినీ కాక సంబంధిత దేశాన్ని లేదా ప్రాంతాన్ని సూచిస్తుంది; ‘దేశంలో’ కథన సందర్భానికి తగినది.
