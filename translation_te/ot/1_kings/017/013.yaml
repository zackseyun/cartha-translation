  terminology: ‘చిన్న రొట్టె’ అనేది עֻגָה కְטַנָּהకు సందర్భోచితమైన, అతిగా నిర్దిష్టం కాని అనువాదం. పాదటిప్పణిలో ‘చిన్న పలుచని రొట్టె’ అనే ప్రత్యామ్నాయం స్థానంలో ‘చిన్న కాల్చిన రొట్టె లేదా కేకు’ వాడాలి; మూలపదం కాల్చిన చిన్న రొట్టె/కేకును సూచించవచ్చు గాని పలుచనితనాన్ని తప్పనిసరిగా సూచించదు.
