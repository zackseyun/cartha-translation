source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלֶ֤י/הָ אֵלִיָּ֨הוּ֙ אַל תִּ֣ירְאִ֔י בֹּ֖אִי עֲשִׂ֣י כִ/דְבָרֵ֑/ךְ אַ֣ךְ עֲשִׂי לִ֣/י מִ֠/שָּׁם עֻגָ֨ה קְטַנָּ֤ה בָ/רִאשֹׁנָה֙ וְ/הוֹצֵ֣אתְ לִ֔/י וְ/לָ֣/ךְ וְ/לִ/בְנֵ֔/ךְ תַּעֲשִׂ֖י בָּ/אַחֲרֹנָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/013.yaml
  text: And Elijah said to her[a], “Do not fear. Go, do as you have said. But first make me a small cake from there and bring it out to me[b], and afterward make some for yourself and for your son.”
translation:
  language: te
  text: ఏలీయా ఆమెతో, “భయపడకు. వెళ్లి[a], నువ్వు చెప్పినట్లే చేయి. అయితే ముందుగా అక్కడి నుంచి నాకోసం ఒక చిన్న రొట్టె[b] చేసి, దాన్ని నా దగ్గరికి తీసుకురా. ఆ తర్వాత నీకూ నీ కుమారునికీ చేయి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'పదశః: ‘రా.’ ఇక్కడ ఈ హీబ్రూ క్రియ తరువాత చెప్పిన పనిని కొనసాగించమనే ప్రేరణగా వాడబడింది.'
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: ‘చిన్న కాల్చిన రొట్టె లేదా కేకు.’ హీబ్రూ పదం చిన్నగా కాల్చిన రొట్టెను లేదా కేకును సూచించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: భయపడకు
  rationale: నిషేధ ఆజ్ఞతో కూడిన ‘భయపడడం’ అనే మూలార్థాన్ని సహజమైన, సంక్షిప్తమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בֹּאִי
  choice: వెళ్లి
  rationale: పదశః ‘రా’ అని అర్థమైనా, ఇక్కడ తరువాతి ఆజ్ఞకు ముందున్న కార్యప్రేరణగా వాడబడింది; సందర్భంలో ఆహారం సిద్ధం చేయడానికి వెళ్లడాన్ని ‘వెళ్లి’ సహజంగా తెలియజేస్తుంది.
- source_word: עֲשִׂי כִדְבָרֵךְ
  choice: నువ్వు చెప్పినట్లే చేయి
  rationale: ఆమె ముందుగా చెప్పిన యోచన ప్రకారమే చేయమనే భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: אַךְ
  choice: అయితే
  rationale: ముందటి అనుమతికి ఒక షరతు లేదా పరిమితిని జోడించే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: מִשָּׁם
  choice: అక్కడి నుంచి
  rationale: హీబ్రూ పదంలోని స్థలసూచక భావాన్ని నిలుపుతూ, అది సందర్భంలోని పిండి-నూనె నిల్వను సూచిస్తుందనే వివరణను ప్రధాన వాక్యంలో అధికంగా చేర్చదు.
- source_word: עֻגָה קְטַנָּה
  choice: ఒక చిన్న రొట్టె
  rationale: ఇది సాధారణంగా కాల్చిన చిన్న రొట్టె లేదా పలుచని రొట్టెను సూచిస్తుంది; ‘రొట్టె’ ఆధునిక తెలుగు పాఠకులకు ‘కేక్’ కంటే సందర్భానుకూలంగా ఉంటుంది.
- source_word: בָרִאשֹׁנָה
  choice: ముందుగా
  rationale: ఏలీయా కోసం చేయవలసిన భాగానికి స్పష్టమైన కాలక్రమ ప్రాధాన్యం ఉందని తెలియజేస్తుంది.
- source_word: וְהוֹצֵאתְ לִי
  choice: దాన్ని నా దగ్గరికి తీసుకురా
  rationale: హిఫీల్ రూపంలోని ‘బయటకు తీసుకురావడం’ భావాన్ని తెలుగు సందర్భంలో సహజమైన రీతిలో వ్యక్తం చేస్తుంది.
- source_word: וְלָךְ וְלִבְנֵךְ תַּעֲשִׂי
  choice: నీకూ నీ కుమారునికీ చేసుకో
  rationale: ముందటి వాక్యంలోని ఆహారవస్తువే ఇక్కడ అంతర్లీన కర్మగా ఉందని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בָאַחֲרֹנָה
  choice: ఆ తర్వాత
  rationale: మొదట ఏలీయాకు, తరువాత ఆమెకూ ఆమె కుమారునికీ అనే క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఏలీయాకు ముందుగా ఆహారం చేయాలనే ఆజ్ఞ వల్ల కలిగే నైతిక లేదా వేదాంతపరమైన ఉద్రిక్తత
  choice: ‘ముందుగా’ మరియు ‘ఆ తర్వాత’ అనే కాలక్రమాన్ని యథాతథంగా, మృదువుపరచకుండా అనువదించడం
  alternative: ఏలీయా అభ్యర్థన తీవ్రతను తగ్గించేలా లేదా దానికి సమర్థన జోడించేలా భావానువాదం చేయడం
  rationale: హీబ్రూ పాఠం ఏలీయా కోసం చిన్న రొట్టెను మొదట చేయాలని, ఆమెకూ ఆమె కుమారునికీ తరువాత చేయాలని స్పష్టంగా చెబుతుంది. అనువాదం ఈ ఉద్రిక్తతను వ్యాఖ్యానంతో పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలి వాడబడింది. స్త్రీని ఉద్దేశించిన ఏకవచన ఆజ్ఞారూపాలు సహజ తెలుగు సంభాషణ ప్రకారం ఇవ్వబడ్డాయి; మూలంలోని కాలక్రమ బలం మాత్రం నిలుపబడింది.
