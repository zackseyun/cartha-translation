  source_fidelity: ప్రధాన అనువాదం హీబ్రూ వాక్య నిర్మాణాన్ని, ముఖ్యంగా ‘భయపడకు,’ ‘ముందుగా,’ ‘ఆ తర్వాత’ అనే ఆజ్ఞా-కాలక్రమాన్ని నమ్మకంగా ప్రతిబింబిస్తుంది. అయితే చివరి భాగంలోని ‘చేసుకో’ కంటే, హీబ్రూలో ఉన్న ఆమెకూ ఆమె కుమారునికీ ఉద్దేశించిన దాతృక భావాన్ని ‘చేయి’తో స్పష్టంగా ఉంచడం మంచిది. అలాగే עֻגָהకు ‘పలుచని’ అని నిర్దిష్టంగా చెప్పడం మూలపదం తప్పనిసరిగా సూచించని ఆకారాన్ని జోడిస్తుంది.
