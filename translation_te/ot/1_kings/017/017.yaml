source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה חָלָ֕ה בֶּן הָ/אִשָּׁ֖ה בַּעֲלַ֣ת הַ/בָּ֑יִת וַ/יְהִ֤י חָלְי/וֹ֙ חָזָ֣ק מְאֹ֔ד עַ֛ד אֲשֶׁ֥ר לֹא נֽוֹתְרָה בּ֖/וֹ נְשָׁמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/017.yaml
  text: After these things[a], the son of the woman who owned the house became sick, and his illness became very severe, until no breath was left in him.
translation:
  language: te
  text: ఈ సంగతుల తరువాత, ఇంటి యజమానురాలైన ఆ స్త్రీ కుమారుడు జబ్బుపడ్డాడు. అతని జబ్బు చాలా తీవ్రమై, అతనిలో ఊపిరి ఏమాత్రం మిగలలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనిలో ప్రాణం ఏమాత్రం మిగలలేదు.” హీబ్రూ మూలపాఠం అక్షరార్థంగా, “అతనిలో ఊపిరి ఏమాత్రం మిగలలేదు” అని చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: ఈ సంగతులు జరిగిన తరువాత
  rationale: హీబ్రూ కథన సంధిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, הַדְּבָרִים అనే బహువచనాన్ని ‘సంగతులు’గా నిలుపుతుంది.
- source_word: חָלָה
  choice: జబ్బుపడ్డాడు
  rationale: క్రియలోని అనారోగ్యానికి గురయ్యే భావాన్ని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: בֶּן הָאִשָּׁה בַּעֲלַת הַבָּיִת
  choice: ఇంటి యజమానురాలైన ఆ స్త్రీ కుమారుడు
  rationale: בַּעֲלַת הַבָּיִת లోని స్త్రీలింగ ‘ఇంటి యజమానురాలు’ భావాన్ని స్పష్టంగా నిలుపుతూ సహజమైన తెలుగు పదక్రమాన్ని వాడుతుంది.
- source_word: וַיְהִי חָלְיוֹ חָזָק מְאֹד
  choice: అతని జబ్బు మరీ తీవ్రమై
  rationale: חָזָק מְאֹד సూచించే అత్యంత తీవ్రతను ‘మరీ తీవ్రమై’ సహజంగా తెలియజేస్తుంది; కథనంలోని పరిస్థితి మరింత విషమించిన క్రమాన్ని కూడా ప్రతిబింబిస్తుంది.
- source_word: עַד אֲשֶׁר לֹא נוֹתְרָה בוֹ נְשָׁמָה
  choice: చివరికి అతనిలో ఊపిరి ఏమాత్రం మిగలలేదు
  rationale: נְשָׁמָה యొక్క ప్రాథమిక ‘ఊపిరి’ భావాన్ని నిలుపుతూ, మరణాన్ని నేరుగా వ్యాఖ్యానించి చేర్చకుండా హీబ్రూ వాక్యరూపాన్నే ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: చివరి మాటను మరణమని నేరుగా అనువదించాలా, లేక హీబ్రూ ‘ఊపిరి’ రూపకల్పనను నిలుపాలా
  choice: అతనిలో ఊపిరి ఏమాత్రం మిగలలేదు
  alternative: అతనిలో ప్రాణం మిగలలేదు; అతడు చనిపోయాడు
  rationale: మూలపాఠం నేరుగా సాధారణ మరణసూత్రాన్ని వాడకుండా נְשָׁמָה (‘ఊపిరి’) మిగలలేదని చెబుతుంది. అందువల్ల ప్రధాన పాఠంలో ఆ భాషనే నిలిపి, దాని జీవనార్థాన్ని పాదటిప్పణిలో సూచించడం నిజమైన భావసందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘యజమానురాలు’ మూలంలోని స్త్రీలింగ గృహాధికార భావాన్ని నిలుపుతుంది; ‘ఊపిరి’ అనే పదం మూలంలోని ఉద్దేశపూర్వక భావతీవ్రతను కాపాడుతుంది.
