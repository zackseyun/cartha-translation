source:
  edition: WLC
  text: וַ/יָּ֣קָם וַ/יֵּ֣לֶךְ צָרְפַ֗תָ/ה וַ/יָּבֹא֙ אֶל פֶּ֣תַח הָ/עִ֔יר וְ/הִנֵּֽה שָׁ֛ם אִשָּׁ֥ה אַלְמָנָ֖ה מְקֹשֶׁ֣שֶׁת עֵצִ֑ים וַ/יִּקְרָ֤א אֵלֶ֨י/הָ֙ וַ/יֹּאמַ֔ר קְחִי נָ֨א לִ֧/י מְעַט מַ֛יִם בַּ/כְּלִ֖י וְ/אֶשְׁתֶּֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/010.yaml
  text: So he arose and went to Zarephath. When he came to the entrance of the city[a], behold, a widow was there gathering sticks. He called to her and said, “Please bring me a little water in a vessel, so that I may drink.”
translation:
  language: te
  text: అప్పుడు అతడు లేచి సారెపతుకు వెళ్లాడు. అతడు పట్టణ ప్రవేశం వద్దకు[a] వచ్చినప్పుడు, ఇదిగో, అక్కడ ఒక విధవరాలు కట్టెలు ఏరుకుంటూ ఉంది. అతడు ఆమెను పిలిచి, “దయచేసి, నేను తాగడానికి ఒక పాత్రలో కొంచెం నీళ్లు తీసుకురా” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పట్టణ ద్వారం వద్దకు.’ హీబ్రూలో ఉన్న פֶּתַח అంటే ‘ప్రవేశం/తెరువు’; అది ‘ద్వారం’ అనే మరింత నిర్దిష్ట పదంకన్నా విస్తృతమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: అతడు లేచి ... వెళ్లాడు
  rationale: קום మరియు הלך అనే వరుస కథన క్రియలను సహజమైన తెలుగు కథనశైలిలో చూపిస్తూ, లేచి కార్యానికి పూనుకొని వెళ్లిన భావాన్ని నిలుపుతుంది.
- source_word: צָרְפַתָה
  choice: సారెపతుకు
  rationale: దిశను సూచించే హేను తెలుగులో గమ్యార్థక ‘-కు’తో వ్యక్తం చేసి, స్థలనామాన్ని ప్రాచుర్యంలో ఉన్న బైబిలు రూపంలో లిప్యంతరీకరించాం.
- source_word: פֶּתַח הָעִיר
  choice: పట్టణ ప్రవేశస్థలం
  rationale: פֶּתַח అనేది నిర్దిష్టంగా ‘గుమ్మం’ అనే మాటకన్నా విస్తృతమైన ‘తెరువు/ప్రవేశస్థలం’ భావం కలది; అందువల్ల మూలంలోని సాధారణతను కాపాడాం.
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హఠాత్తుగా దృష్టిని ఆకర్షించే హీబ్రూ కథన సూచకపదపు సజీవతను ‘ఇదిగో’ నిలుపుతుంది.
- source_word: אִשָּׁה אַלְמָנָה
  choice: ఒక విధవరాలు
  rationale: అక్షరార్థంగా ‘ఒక స్త్రీ, విధవరాలు’ అయిన పదబంధాన్ని సహజమైన తెలుగులో సంక్షిప్తంగా అందిస్తుంది.
- source_word: מְקֹשֶׁשֶׁת עֵצִים
  choice: కట్టెలు ఏరుకుంటూ ఉంది
  rationale: קשׁשׁ చిన్న కట్టెలను లేదా పుల్లలను ఏరడాన్ని సూచిస్తుంది; సందర్భానికి తగిన సాధారణ తెలుగు రూపం ఇది.
- source_word: וַיִּקְרָא אֵלֶיהָ
  choice: అతడు ఆమెను పిలిచి
  rationale: ఎవరినైనా ఉద్దేశించి పిలిచే క్రియను సహజమైన తెలుగు వాక్యక్రమంలో అందిస్తుంది.
- source_word: קְחִי נָא
  choice: దయచేసి ... తీసుకురా
  rationale: לקח యొక్క ప్రాథమిక భావం ‘తీసుకో’ అయినా, మాట్లాడేవాని కోసం వస్తువు తెమ్మనే సందర్భంలో ‘తీసుకురా’ సహజం; נָא లోని వినయపూర్వక విన్నపాన్ని ‘దయచేసి’ వ్యక్తం చేస్తుంది.
- source_word: מְעַט מַיִם
  choice: కొంచెం నీళ్లు
  rationale: చిన్న పరిమాణాన్ని సూచించే מְעַט ను సాధారణ ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: בַּכְּלִי
  choice: ఒక పాత్రలో
  rationale: כְּלִי సాధారణంగా పాత్ర లేదా సాధనాన్ని సూచిస్తుంది; ‘కుండ’ వంటి నిర్దిష్ట వస్తువును ఊహించకుండా విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: וְאֶשְׁתֶּה
  choice: నేను తాగడానికి
  rationale: కోహోర్టేటివ్ రూపంలోని ఉద్దేశం లేదా ఆశించిన ఫలితాన్ని సహజమైన తెలుగు ప్రయోజనార్థక నిర్మాణంతో తెలియజేస్తుంది.
