  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. హీబ్రూ కథనంలోని ‘ఇదిగో’ అనే దృష్టి ఆకర్షణ సూచకాన్ని నిలిపి, పాత్ర మరియు పట్టణ ప్రవేశస్థలం వంటి పదాల్లో మూలంలోని అనిర్దిష్టతను కాపాడాం.
