id: 1KI.17.5
reference: 1 Kings 17:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ וַ/יַּ֖עַשׂ כִּ/דְבַ֣ר יְהוָ֑ה וַ/יֵּ֗לֶךְ וַ/יֵּ֨שֶׁב֙ בְּ/נַ֣חַל כְּרִ֔ית אֲשֶׁ֖ר עַל פְּנֵ֥י הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/005.yaml
  text: So he went and did according to the word of Yahweh[a], and he went and stayed by the Wadi Cherith[b], which is before the Jordan.
translation:
  language: te
  text: అతడు వెళ్లి యాహ్వే మాట ప్రకారం చేశాడు; వెళ్లి, యొర్దాను ఎదుట[b] ఉన్న కెరీతు వాగు[a] దగ్గర నివసించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కెరీతు ఏరు’ లేదా ‘కెరీతు జలవాహిని’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం లోయను, వాగును లేదా కాలానుగుణంగా నీరు ప్రవహించే జలమార్గాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘యొర్దాను ఎదుట’ లేదా ‘యొర్దానుకు ఎదురుగా.’ ఇది ‘యొర్దానుకు తూర్పున’ అని సూచించవచ్చు, కానీ దిశను హీబ్రూ పాఠ్యం స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ וַיַּעַשׂ
  choice: అతడు వెళ్లి ... చేశాడు
  rationale: వావ్-క్రమ నిర్మాణం కథనాన్ని ముందుకు నడిపిస్తుంది; సహజమైన ఆధునిక తెలుగులో చర్యల క్రమాన్ని నిలుపుతుంది.
- source_word: כִּדְבַר יְהוָה
  choice: యాహ్వే మాట ప్రకారం
  rationale: כִּדְבַר అనే ‘మాట ప్రకారం’ భావాన్ని, అలాగే దేవుని వ్యక్తిగత నామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా కాపాడుతుంది.
- source_word: וַיֵּלֶךְ וַיֵּשֶׁב
  choice: వెళ్లి ... నివసించాడు
  rationale: మూలంలోని రెండవ וַיֵּלֶךְను విడిచిపెట్టకుండా ఉంచి, ישׁבను ఆ ప్రదేశంలో ఉండడాన్ని సూచించే సహజ తెలుగు క్రియతో అనువదించింది.
- source_word: בְּנַחַל כְּרִית
  choice: కెరీతు వాగు దగ్గర
  rationale: נחל లోయలో ప్రవహించే లేదా కాలానుగుణంగా నీరు ఉండే వాగును సూచించవచ్చు. తెలుగు సందర్భంలో ‘వాగు’ సహజంగా ఉండగా, ‘దగ్గర’ నివాసస్థాన సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר עַל פְּנֵי הַיַּרְדֵּן
  choice: యొర్దాను ఎదుట ఉన్న
  rationale: עַל־פְּנֵיలోని ‘ఎదుట/ఎదురుగా’ అనే భౌగోళిక భావాన్ని కాపాడి, మూలంలో స్పష్టంగా లేని ‘తూర్పున’ అనే దిశను పాఠ్యంలో చేర్చదు.
- source_word: הַיַּרְדֵּן
  choice: యొర్దాను
  rationale: నది పేరుకు తెలుగులో స్థిరపడిన లిప్యంతరీకరణ; ఈ సందర్భంలో ‘నది’ అని అదనంగా చేర్చాల్సిన అవసరం లేదు.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: హీబ్రూ పాఠ్యంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: עַל פְּנֵי הַיַּרְדֵּן యొక్క భౌగోళిక భావం
  choice: యొర్దాను ఎదుట
  alternative: యొర్దానుకు తూర్పున / యొర్దానుకు ఎదురుగా
  rationale: ‘తూర్పున’ అనేది సాధ్యమైన సందర్భార్థ వివరణ అయినప్పటికీ మూలపదబంధంలో దిశ స్పష్టంగా లేదు. అందువల్ల నిజమైన భౌగోళిక అస్పష్టతను పాఠ్యంలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని ‘వెళ్లి’ అనే పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపి, భౌగోళిక పదబంధంలోని అస్పష్టతను వివరణాత్మక దిశతో తొలగించలేదు.
