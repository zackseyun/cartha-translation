  text: And the word of Yahweh came to him[a], saying,
translation:
  language: te
  text: 'యాహ్వే[a] వాక్యం అతనికి వచ్చి ఇలా చెప్పింది:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీలో: “YHWH” (יהוה). ఇక్కడ దైవనామాన్ని “యాహ్వే”గా లిప్యంతరీకరించాం; అనేక సాంప్రదాయ అనువాదాలు దీనికి బదులుగా “ప్రభువు” అనే బిరుదును ఉపయోగిస్తాయి.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: అప్పుడు ... వచ్చింది
  rationale: వావ్-కాన్సిక్యూటివ్ కథనంలోని తదుపరి పరిణామాన్ని సూచిస్తుంది. తెలుగులో ‘అప్పుడు’ కథన క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: דְבַר
  choice: వాక్యం
  rationale: దైవనామంతో కూడిన ఈ పదబంధం ప్రవచన ప్రకటనకు ప్రామాణిక సూత్రం. ‘వాక్యం’ దాని ప్రకటనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హెబ్రీ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: אֵלָיו
  choice: అతనికి
  rationale: אֶל అనే విభక్త్యర్థక పదం వ్యక్తివైపు దిశను సూచిస్తుంది; ఈ సందర్భంలో ‘అతనికి’ సహజమైన తెలుగు రూపం.
- source_word: לֵאמֹר
  choice: ఇలా చెప్పింది
  rationale: ఈ క్రియారూపం తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది. ‘ఇలా చెప్పింది’ తెలుగులో స్పష్టంగా, సహజంగా ఆ పని చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో దైవనామం నేరుగా ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా ఇవ్వడం మూలంలోని వ్యక్తిగత నామాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన ప్రవచన శైలిని ఉపయోగించాం. హెబ్రీ కథన క్రమాన్ని ‘అప్పుడు’తో, ప్రత్యక్ష వాక్య పరిచయాన్ని ‘ఇలా చెప్పింది’తో వ్యక్తం చేశాం.
