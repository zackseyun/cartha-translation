  source_fidelity: 'మూల హీబ్రూ ఆజ్ఞారూపాలను మరియు క్రమాన్ని విశ్వసనీయంగా అందించింది: ఇక్కడి నుండి వెళ్లడం, తూర్పు వైపుకు తిరగడం, దాక్కోవడం, కెరీతు నహలు/వాగు దగ్గర ఉండడం. אֲשֶׁר עַל־פְּנֵי הַיַּרְדֵּן లోని భౌగోళిక అనిశ్చితిని ప్రధాన వచనంలో “యొర్దాను నదికి ఎదురుగా” అని ఉంచి, పాదసూచికలో సంభావ్య తూర్పు-వైపు అర్థాన్ని మాత్రమే సూచించింది; నిర్ధారించని వ్యాఖ్యానాన్ని వచనంలో బలవంతంగా చేర్చలేదు.'
