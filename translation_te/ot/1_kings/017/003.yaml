id: 1KI.17.3
reference: 1 Kings 17:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֵ֣ךְ מִ/זֶּ֔ה וּ/פָנִ֥יתָ לְּ/ךָ֖ קֵ֑דְמָ/ה וְ/נִסְתַּרְתָּ֙ בְּ/נַ֣חַל כְּרִ֔ית אֲשֶׁ֖ר עַל פְּנֵ֥י הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/003.yaml
  text: Go from here and turn yourself eastward[a], and hide yourself by the Wadi Cherith[c][b], which is east of the Jordan.
translation:
  language: te
  text: “నీవు ఇక్కడి నుండి వెళ్లి తూర్పు వైపుకు తిరిగి, యొర్దాను నదికి ఎదురుగా[a] ఉన్న కెరీతు వాగు[b] దగ్గర దాక్కో.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదబంధానికి అక్షరార్థంగా “యొర్దాను ఎదుట” లేదా “యొర్దానుకు ఎదురుగా.” ఈ సందర్భంలో ఇది యొర్దాను నదికి తూర్పున అని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “వాగు” అని అనువదించిన హీబ్రూ పదం నీరు ప్రవహించే వాగు, కాలానుగుణ జలమార్గం లేదా లోయను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ מִזֶּה
  choice: ఇక్కడి నుండి వెళ్లి
  rationale: ఆజ్ఞార్థక క్రియను, ప్రస్తుత స్థలం నుండి బయలుదేరమనే భావాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: וּפָנִיתָ לְּךָ קֵדְמָה
  choice: తూర్పు వైపుకు తిరిగి
  rationale: קֵדְמָה దిశను ‘తూర్పు వైపుకు’గా స్పష్టంగా తెలియజేస్తుంది. לְּךָలోని స్వప్రయోజన/ప్రతిబింబ ఛాయను తెలుగులో అసహజమైన ‘నిన్ను నీవు తిప్పుకొని’ అని అతిగా వ్యక్తం చేయకుండా, సహజ క్రియారూపంలో ఉంచింది.
- source_word: וְנִסְתַּרְתָּ
  choice: దాక్కో
  rationale: నిఫాల్ రూపంలోని తనను తాను దాచుకొని ఉండే భావానికి సాధారణ పాఠకులకు స్పష్టమైన, సహజమైన ఆజ్ఞారూపం.
- source_word: בְּנַחַל
  choice: వాగు దగ్గర
  rationale: נחל కాలానుగుణంగా నీరు ప్రవహించే వాగు, లోయ లేదా జలమార్గాన్ని సూచించగలదు. ‘వాగు’ తెలుగు పాఠకులకు సహజంగా ఉండి, ‘దగ్గర’ స్థలసంబంధ בְּను సందర్భానుసారంగా వ్యక్తం చేస్తుంది.
- source_word: כְּרִית
  choice: కెరీతు
  rationale: స్థలనామాన్ని హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగు లిప్యంతరీకరణ చేసింది.
- source_word: אֲשֶׁר עַל פְּנֵי הַיַּרְדֵּן
  choice: యొర్దాను నదికి ఎదురుగా
  rationale: עַל־פְּנֵי యొక్క ‘ముందు/ఎదురుగా/అవతల వైపు’ అనే స్థలసంబంధ అనిశ్చితిని కాపాడుతుంది; మూలంలో స్పష్టంగా లేని ‘యొర్దానుకు తూర్పున’ అనే నిర్దిష్ట వ్యాఖ్యానాన్ని ప్రధాన వచనంలో చేర్చదు.
