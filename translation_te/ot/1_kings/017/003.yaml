translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞాశైలిని ఉపయోగించాం. ‘యొర్దాను నది’ అని చేర్చడం తెలుగు పాఠకులకు స్థలనామ స్వభావాన్ని స్పష్టం చేస్తుంది. మూలంలోని భౌగోళిక అనిశ్చితిని ప్రధాన వచనం మరియు పాదసూచికలో నిలిపాం.
