source:
  edition: WLC
  text: כַּ֤ד הַ/קֶּ֨מַח֙ לֹ֣א כָלָ֔תָה וְ/צַפַּ֥חַת הַ/שֶּׁ֖מֶן לֹ֣א חָסֵ֑ר כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר בְּ/יַ֥ד אֵלִיָּֽהוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/016.yaml
  text: The jar of flour was not used up[a], and the jug of oil did not run out, according to the word of Yahweh that he had spoken by the hand of Elijah.
translation:
  language: te
  text: పిండి కుండలో పిండి అయిపోలేదు; నూనె పాత్రలో నూనె తగ్గిపోలేదు. యహ్వే ఏలీయా ద్వారా[a] పలికిన మాట ప్రకారమే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ భాషలో అక్షరార్థంగా “ఏలీయా చేత”; అంటే “ఏలీయా ద్వారా.”
    reason: హీబ్రూ בְּיַד అనే మధ్యవర్తిత్వ నుడికారపు అక్షరార్థ రూపాన్ని తెలియజేయడానికి.
lexical_decisions:
- source_word: כַּד הַקֶּמַח
  choice: పిండి కుండలోని పిండి
  rationale: כַּד అనేది ఇంట్లో పొడి పదార్థాలను ఉంచే పాత్ర. తెలుగులో ‘పిండి కుండలోని పిండి’ అనడం పాత్రనూ అందులోని పదార్థాన్నీ సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: לֹא כָלָתָה
  choice: అయిపోలేదు
  rationale: כלה ఇక్కడ పూర్తిగా తరిగిపోవడం లేదా వినియోగమైపోవడం అనే భావాన్ని ఇస్తుంది. ‘అయిపోలేదు’ సాధారణ ఆధునిక తెలుగులో ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: צַפַּחַת הַשֶּׁמֶן
  choice: నూనె బుడ్డిలోని నూనె
  rationale: צַפַּחַת నూనె వంటి ద్రవాన్ని ఉంచే చిన్న పాత్రను సూచిస్తుంది. పిండి కుండతో తేడా కనబడేలా ‘బుడ్డి’ని ఎంచుకున్నాం.
- source_word: לֹא חָסֵר
  choice: తగ్గిపోలేదు
  rationale: חסר ఇక్కడ కొరతపడకపోవడం లేదా పరిమాణం తగ్గకపోవడం అనే భావం. ‘తగ్గిపోలేదు’ మూలంలోని భావాన్ని నిలుపుతూ నూనె సరఫరా కొనసాగిన విషయాన్ని సహజంగా తెలుపుతుంది.
- source_word: כִּדְבַר יְהוָה
  choice: యహ్వే ... పలికిన మాట ప్రకారమే
  rationale: ఈ నిర్మాణం జరిగినది యహ్వే ముందుగా పలికిన మాటకు అనుగుణంగానే అని తెలియజేస్తుంది. ‘ప్రకారమే’ ఆ నెరవేర్పు సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: మూలంలో ఉన్న దైవనామాన్ని బిరుదుతో మార్చకుండా తెలుగులో సాధారణంగా అర్థమయ్యే లిప్యంతరీకరణతో ఇచ్చాం.
- source_word: בְּיַד אֵלִיָּהוּ
  choice: ఏలీయా చేత
  rationale: హీబ్రూ ప్రయోగంలోని ‘చేత’ అనే మధ్యవర్తిత్వ భావాన్ని ప్రధాన పాఠ్యంలో సంక్షిప్తంగా నిలిపాం; దాని అర్థాన్ని పాదసూచికలో ‘ద్వారా’ అని వివరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. అందువల్ల దానిని బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా లిప్యంతరీకరించాం.
- issue: ప్రవక్త ద్వారా పలికిన దైవవాక్యంలోని మధ్యవర్తిత్వ ప్రయోగం
  choice: యహ్వే ఏలీయా చేత పలికిన మాట
  alternative: యహ్వే ఏలీయా ద్వారా పలికిన మాట
  rationale: మాట పలికినవాడు యహ్వే, దానిని చేరవేసిన మానవ మధ్యవర్తి ఏలీయా అనే భేదాన్ని మూలంలోని בְּיַד ప్రయోగం ఉంచుతుంది. ‘చేత’ ఆ రూపాన్ని నిలుపుతుంది; ‘ద్వారా’ అనే సహజార్థాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, అయినా గౌరవప్రదమైన శైలి వాడబడింది. రెండు పాత్రల మధ్య తేడా కోసం ‘కుండ’, ‘బుడ్డి’ ఉపయోగించబడ్డాయి. మూలంలోని సమాంతర వాక్య నిర్మాణం మరియు దైవవాక్య నెరవేర్పు భావం నిలుపబడ్డాయి.
