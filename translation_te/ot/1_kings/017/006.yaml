  text: וְ/הָ/עֹרְבִ֗ים מְבִיאִ֨ים ל֜/וֹ לֶ֤חֶם וּ/בָשָׂר֙ בַּ/בֹּ֔קֶר וְ/לֶ֥חֶם וּ/בָשָׂ֖ר בָּ/עָ֑רֶב וּ/מִן הַ/נַּ֖חַל יִשְׁתֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/006.yaml
  text: And the ravens were bringing him bread and meat in the morning[a], and bread and meat in the evening, and he would drink from the wadi.
translation:
  language: te
  text: కాకులు ఉదయం అతనికి రొట్టెను మాంసాన్ని, సాయంత్రం రొట్టెను మాంసాన్ని తెచ్చేవి; అతడు ఆ వాగు[a] నుండి తాగేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సెలయేరు,’ ‘నీటివాహిని’; హీబ్రూ పదం נַחַל వాగును లేదా కాలానుగుణంగా ప్రవహించే నీటివాహినిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֹרְבִים
  choice: కాకులు
  rationale: עֹרְבִים అనే పదానికి సాధారణ అర్థం రావెన్ జాతి కాకులు. ఆధునిక తెలుగులో సహజంగా, విస్తృతంగా అర్థమయ్యే ‘కాకులు’ అనే పదాన్ని ఎంచుకున్నాం; మానవ దూతలు అనే ఊహాత్మక అర్థాన్ని చేర్చలేదు.
- source_word: מְבִיאִים
  choice: తెస్తూ ఉండేవి
  rationale: హీబ్రూ కృదంతం కథన సందర్భంలో కొనసాగుతూ, పునరావృతమయ్యే చర్యను సూచిస్తుంది; ‘తెస్తూ ఉండేవి’ ఆ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לֶחֶם
  choice: రొట్టెను
  rationale: లֶחֶם అనే నిర్దిష్ట పదాన్ని సాధారణీకరించి ‘ఆహారం’ అనకుండా, దాని మౌలిక అర్థమైన ‘రొట్టె’గానే ఉంచాం.
- source_word: וּבָשָׂר
  choice: మాంసాన్ని
  rationale: ఈ సందర్భంలో בָשָׂר తినదగిన మాంసాన్ని సూచిస్తుంది; ‘మాంసం’ సహజమైన తెలుగు పదం.
- source_word: בַּבֹּקֶר ... בָּעָרֶב
  choice: ఉదయం ... సాయంత్రం
  rationale: కాలసూచక పదాలను సంక్షిప్తంగా, సహజంగా అనువదించాం; ఉదయం, సాయంత్రం ఇచ్చిన సరఫరాను స్పష్టంగా నిలిపాం.
- source_word: וּמִן הַנַּחַל
  choice: ఆ వాగు నుండి
  rationale: נַחַל అనేది వాగు, సెలయేరు లేదా కాలానుగుణ నీటివాహినిని సూచించగలదు. ప్రధాన పాఠ్యంలో సాధారణ పాఠకులకు సహజమైన ‘వాగు’ను వాడి, విస్తృత భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: יִשְׁתֶּה
  choice: తాగేవాడు
  rationale: అసంపూర్ణ క్రియారూపం ఇక్కడ అలవాటుగా లేదా పదేపదే జరిగే చర్యను సూచిస్తుంది; ‘తాగేవాడు’ ఆ పునరావృత భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఏలీయాకు ఆహారం అందించిన עֹרְבִים స్వభావం
  choice: నిజమైన కాకులు
  alternative: అరబ్బీయులు, వర్తకులు లేదా ఇతర మానవ దూతలు
  rationale: עֹרְבִים యొక్క సాధారణ నిఘంటు అర్థం రావెన్ జాతి కాకులు. అద్భుత అంశాన్ని తొలగించడానికి దానిని మానవులుగా పునర్వ్యాఖ్యానించాల్సిన సూచన సమీప సందర్భంలో లేదు; అందువల్ల ప్రధాన పాఠ్యం సాధారణ అర్థాన్నే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. హీబ్రూలోని ఉదయం–సాయంత్రం పునరుక్తిని నిలిపి, పునరావృత చర్యను ‘తెస్తూ ఉండేవి,’ ‘తాగేవాడు’ అనే రూపాలతో వ్యక్తం చేశాం. పాదసూచిక గుర్తును దానికి సంబంధించిన ‘వాగు’ పదం వెంట ఉంచాం.
