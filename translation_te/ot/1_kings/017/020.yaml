  terminology: ‘యాహ్వే,’ ‘మొరపెట్టి,’ ‘కీడు కలిగించి,’ ‘కుమారుడు’ సరైన, స్థిరమైన పదప్రయోగాలు. ‘కీడు’ నైతిక దుష్టత్వానికి మాత్రమే అర్థాన్ని పరిమితం చేయకుండా విపత్తు/హాని భావాన్ని నిలుపుతుంది.
