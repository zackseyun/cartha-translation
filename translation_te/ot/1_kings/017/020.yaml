id: 1KI.17.20
reference: 1 Kings 17:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֥א אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר יְהוָ֣ה אֱלֹהָ֔/י הֲ֠/גַם עַל הָ/אַלְמָנָ֞ה אֲשֶׁר אֲנִ֨י מִתְגּוֹרֵ֥ר עִמָּ֛/הּ הֲרֵע֖וֹתָ לְ/הָמִ֥ית אֶת בְּנָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/020.yaml
  text: Then he cried out to Yahweh and said[a], “O Yahweh my God, have you also brought harm on the widow with whom I am staying[b], by causing her son to die?”
translation:
  language: te
  text: 'అప్పుడు అతడు యాహ్వేకు మొరపెట్టి ఇలా అన్నాడు: “యాహ్వే, నా దేవా, నేను ఆమె వద్ద నివసిస్తున్న ఆ విధవరాలికి కూడా కీడు కలిగించి[b], ఆమె కుమారుడు చనిపోయేలా చేశావా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా ‘చెడు చేసి’; హీబ్రూ క్రియ హాని చేయడం, విపత్తు కలిగించడం, లేదా చెడుగా వ్యవహరించడం అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶל־יְהוָה
  choice: యాహ్వేకు మొరపెట్టి
  rationale: ప్రార్థనా సందర్భంలో קרא אל అనేది సాధారణంగా పిలవడం కంటే ఆర్తితో దేవునికి విన్నవించడాన్ని సూచిస్తుంది; ‘మొరపెట్టి’ ఆ భావతీవ్రతను సహజమైన తెలుగులో అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ నామానికి సమీపమైన ఆధునిక తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: יְהוָה אֱלֹהָי
  choice: నా దేవుడవైన యాహ్వే
  rationale: ఇది దైవనామంతో కూడిన ప్రత్యక్ష సంబోధన. తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉండేలా చేస్తూనే ‘నా దేవుడు’ అనే వ్యక్తిగత సంబంధాన్ని నిలుపుతుంది.
- source_word: הֲגַם
  choice: కూడా ... చేశావా?
  rationale: ప్రశ్నార్థక అవ్యయం, ‘కూడా’ అనే చేర్పు భావం కలసి, ఇప్పటికే కష్టాల్లో ఉన్న విధవరాలిపై ఈ విపత్తు కూడా వచ్చిందా అనే ఏలీయా దిగ్భ్రాంతిని తెలియజేస్తాయి.
- source_word: מִתְגּוֹרֵר עִמָּהּ
  choice: నేను అతిథిగా ఉంటున్న
  rationale: גור హిత్పయేల్ రూపం తాత్కాలికంగా లేదా మరొకరి ఆశ్రయంలో నివసించడాన్ని సూచిస్తుంది. ‘అతిథిగా ఉంటున్న’ అనేది ఆధారిత అతిథి నివాస భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הֲרֵעוֹתָ
  choice: కీడు కలిగించి
  rationale: רעע హిఫీల్ రూపం హాని, కీడు లేదా విపత్తు కలిగించడాన్ని సూచించగలదు. ‘కీడు కలిగించి’ కారణార్థకతను కాపాడుతూ, నైతిక దుష్టత్వం అనే భావానికే పరిమితం చేయదు.
- source_word: לְהָמִית
  choice: చనిపోయేలా చేశావా
  rationale: మరణానికి కారణమవడం అనే హిఫీల్ అనంతరూప భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; దేవుని కార్యంతో మరణాన్ని అనుసంధానించే మూలపాఠంలోని కఠినతను తొలగించదు.
- source_word: בְּנָהּ
  choice: ఆమె కుమారుడు
  rationale: בֵּן ఇక్కడ పురుష సంతానాన్ని సూచిస్తుంది; అందువల్ల లింగనిర్దిష్టమైన ‘కుమారుడు’ సరైనది.
theological_decisions:
- issue: ఏలీయా దేవునిపై నైతిక దుష్టత్వం మోపుతున్నాడా, లేక దేవుడు కలిగించిన విపత్తు గురించి విలపిస్తున్నాడా?
  choice: ‘కీడు కలిగించి ... చనిపోయేలా చేశావా?’ అని అనువదించాం.
  alternative: ‘విధవరాలికి చెడు చేసి, ఆమె కుమారుణ్ణి చంపేశావా?’ లేదా ‘ఆమె కుమారుడు చనిపోవడానికి అనుమతించావా?’
  rationale: హీబ్రూ רעע హిఫీల్ రూపం నైతిక చెడుతో పాటు హాని లేదా విపత్తు కలిగించడాన్నీ సూచించగలదు. ఎంపిక చేసిన రూపం దేవునిపై నైతిక దుష్టత్వాన్ని అనవసరంగా మోపదు; అదే సమయంలో కుమారుని మరణాన్ని దేవుని కార్యంతో ధైర్యంగా అనుసంధానించే ఏలీయా విలాపంలోని వేదాంత ఉద్రిక్తతను కూడా తగ్గించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనకు తగిన గంభీరతతోనూ సామాన్య పాఠకులకు అర్థమయ్యే సహజ వాక్యనిర్మాణంతోనూ రూపొందించాం. ‘మొరపెట్టి’ భావోద్వేగ తీవ్రతను, ‘అతిథిగా ఉంటున్న’ నివాస స్వరూపాన్ని, ‘కీడు కలిగించి’ మూలంలోని అర్థ విస్తృతిని కాపాడుతాయి.
