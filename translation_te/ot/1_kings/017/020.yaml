  to: 'అప్పుడు అతడు యాహ్వేకు మొరపెట్టి ఇలా అన్నాడు: “యాహ్వే, నా దేవా, నేను ఆమె వద్ద నివసిస్తున్న ఆ విధవరాలికి కూడా కీడు కలిగించి[b], ఆమె కుమారుడు చనిపోయేలా చేశావా?”'
  rationale: మూలార్థాన్ని మార్చకుండా, అనవసరమైన సూచక భావాన్ని తొలగించి, విధవరాలితో ఏలీయాకు ఉన్న నివాస-సంబంధాన్ని స్పష్టపరిచాం. అనువాదంలో ఇక ‘అతిథిగా’ అనే ప్రత్యేక వ్యాఖ్యానాన్ని పాఠ్యంగా ఉంచనందున దానికి సంబంధించిన పాదటిప్పణిని తొలగించాం. మిగిలిన పాదటిప్పణి הֲרֵעוֹתָ యొక్క సముచిత పదార్థ-విస్తృతిని తెలియజేస్తుంది.
