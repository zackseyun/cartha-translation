source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אֵלִיָּ֨הוּ הַ/תִּשְׁבִּ֜י מִ/תֹּשָׁבֵ֣י גִלְעָד֮ אֶל אַחְאָב֒ חַי יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֲשֶׁ֣ר עָמַ֣דְתִּי לְ/פָנָ֔י/ו אִם יִהְיֶ֛ה הַ/שָּׁנִ֥ים הָ/אֵ֖לֶּה טַ֣ל וּ/מָטָ֑ר כִּ֖י אִם לְ/פִ֥י דְבָרִֽ/י־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/001.yaml
  text: And Elijah the Tishbite[a], from the inhabitants of Gilead, said to Ahab, “As Yahweh, the God of Israel, lives, before whom I stand, there will be neither dew nor rain in these years[c][b], except by my word.”
translation:
  language: te
  text: 'గిలాదు నివాసులలోని తిష్బీయుడైన ఏలీయా[a] అహాబుతో ఇలా అన్నాడు: “నేను ఎవరి సన్నిధిలో నిలబడి ఉన్నానో, ఆ ఇశ్రాయేలు దేవుడైన యాహ్వే జీవం తోడు—నా మాట ప్రకారం తప్ప[c], ఈ సంవత్సరాల్లో మంచుగానీ వర్షంగానీ పడవు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తిష్బీయుడు” అంటే తిష్బెకు చెందినవాడు అని సూచించే ప్రాంతీయ గుర్తింపు.
    reason: lexical_alternative
  - marker: b
    text: 'హెబ్రీలో ఇది ప్రమాణానికి ప్రత్యేకమైన నుడికారం: పదశః “ఉంటే …” అనే రూపం ఇక్కడ “ఉండదు” అనే బలమైన నిరాకరణను తెలియజేస్తుంది.'
    reason: cultural_note
  - marker: c
    text: లేదా “నా మాట వచ్చినప్పుడు తప్ప,” “నా మాటకు అనుగుణంగా తప్ప.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתִּשְׁבִּי
  choice: తిష్బీయుడైన
  rationale: ఈ రూపం ఏలీయాను అతని ప్రాంతీయ మూలంతో గుర్తిస్తుంది. స్థలనామం నిర్ధారణపై అదనపు వివరణను ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చకుండా హెబ్రీ బిరుదు స్వరూపాన్ని నిలుపుతుంది.
- source_word: מִתֹּשָׁבֵי גִלְעָד
  choice: గిలాదు నివాసుల్లో ఒకడైన
  rationale: תּוֹשָׁבִים అనే పదం నివాసులు లేదా స్థిరపడినవారు అనే భావాన్ని ఇవ్వగలదు. సహజమైన తెలుగులో సంబంధాన్ని తెలియజేస్తూ ఆ విస్తృతిని నిలుపుతుంది.
- source_word: חַי יְהוָה
  choice: యెహోవా జీవం తోడు
  rationale: ఇది ప్రమాణ సూత్రం. పదశః ప్రకటనగా కాకుండా ప్రమాణ బలాన్ని సహజమైన తెలుగు నుడికారంలో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హెబ్రీ దైవనామాన్ని సాధారణ తెలుగు బైబిలు లిప్యంతరీకరణలో ప్రత్యక్షంగా ఉంచుతుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: నిర్మాణ సంబంధాన్ని స్పష్టంగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: నేను ఎవరి సన్నిధిలో నిలబడి ఉన్నానో
  rationale: దేవుని సమక్షంలో నిలబడటం అనే హెబ్రీ రూపకాన్ని నిలుపుతుంది; దానిని కేవలం ‘సేవించు’ అని వ్యాఖ్యానించి పరిమితం చేయదు.
- source_word: אִם יִהְיֶה
  choice: కురవదు
  rationale: ప్రమాణ సందర్భంలో אִם బలమైన నిరాకరణను సూచిస్తుంది. తెలుగు పాఠకుడికి అర్థమయ్యేలా ఆ నిరాకరణను క్రియలో ప్రత్యక్షం చేసింది.
- source_word: טַל וּמָטָר
  choice: మంచుగానీ వర్షంగానీ
  rationale: టַל అనేది రాత్రివేళ ఏర్పడే dew; తెలుగులో ప్రాచుర్యమైన ‘మంచు’ దానిని సూచిస్తుంది. జతచేసిన ‘గానీ...గానీ’ సంపూర్ణ నిరాకరణను సహజంగా తెలుపుతుంది.
- source_word: הַשָּׁנִים הָאֵלֶּה
  choice: ఈ సంవత్సరాల్లో
  rationale: బహువత్సర కాలవ్యాప్తిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּי אִם
  choice: తప్ప
  rationale: మినహాయింపును సంక్షిప్తంగా, స్పష్టంగా సూచిస్తుంది.
- source_word: לְפִי דְבָרִי
  choice: నా మాట ప్రకారం
  rationale: ‘నా మాటకు అనుగుణంగా’ అనే మూల భావాన్ని నిలుపుతూ, ప్రవక్త స్వతంత్ర శక్తితోనే వర్షాన్ని నియంత్రిస్తాడనే అదనపు భావాన్ని చేర్చదు.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలపాఠ్యంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో మార్చకుండా ప్రత్యక్షంగా ఉంచి, తెలుగులో విస్తృతంగా గుర్తించబడే రూపాన్ని వాడింది.
- issue: לְפִי דְבָרִי లో ప్రవక్త మాటకున్న అధికారం
  choice: నా మాట ప్రకారం తప్ప
  alternative: నా మాటవల్ల తప్ప / నా మాట వచ్చినప్పుడు తప్ప
  rationale: వర్షం లేదా మంచు ఏలీయా పలికే మాటకు అనుగుణంగానే వస్తుందనే పాఠ్యబలాన్ని నిలుపుతుంది; అది దేవునికి స్వతంత్రమైన ప్రవక్త శక్తి అని వివరించదు.
- issue: దేవుని సన్నిధిలో నిలబడటం
  choice: నేను ఎవరి సన్నిధిలో నిలబడి ఉన్నానో
  alternative: నేను ఎవరిని సేవిస్తున్నానో
  rationale: మూలంలోని సమక్షం మరియు సేవ రెండింటినీ సూచించగల రూపకాన్ని అలాగే ఉంచి, దాని అర్థాన్ని ఒక్క ‘సేవ’ భావానికే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను కాపాడుతూ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ప్రమాణ సూత్రానికి సహజమైన ‘జీవం తోడు’ వాడబడింది. మూలంలోని అస్పష్టతలు ప్రధాన పాఠ్యం మరియు పాదసూచనల్లో నిలుపబడ్డాయి.
