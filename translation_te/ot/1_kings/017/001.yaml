revisions:
- from: 'గిలాదు నివాసుల్లో ఒకడైన తిష్బీయుడైన ఏలీయా[a] అహాబుతో ఇలా అన్నాడు: “నేను ఎవరి సన్నిధిలో నిలబడి ఉన్నానో, ఆ ఇశ్రాయేలు దేవుడైన యెహోవా జీవం తోడు—నా మాట ప్రకారం తప్ప[c], ఈ సంవత్సరాల్లో మంచుగానీ వర్షంగానీ కురవదు[b].”'
  to: 'గిలాదు నివాసులలోని తిష్బీయుడైన ఏలీయా[a] అహాబుతో ఇలా అన్నాడు: “నేను ఎవరి సన్నిధిలో నిలబడి ఉన్నానో, ఆ ఇశ్రాయేలు దేవుడైన యాహ్వే జీవం తోడు—నా మాట ప్రకారం తప్ప[c], ఈ సంవత్సరాల్లో మంచుగానీ వర్షంగానీ పడవు[b].”'
  rationale: The revision preserves the Hebrew oath’s force, Elijah’s standing in Yahweh’s presence, and the qualified prediction of drought. It aligns the divine name with the supplied POB policy, improves the natural Telugu collocation for dew and rain, and narrows footnote a to the supported gentilicial sense.
