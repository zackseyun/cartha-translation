id: 1KI.17.24
reference: 1 Kings 17:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר הָֽ/אִשָּׁה֙ אֶל אֵ֣לִיָּ֔הוּ עַתָּה֙ זֶ֣ה יָדַ֔עְתִּי כִּ֛י אִ֥ישׁ אֱלֹהִ֖ים אָ֑תָּה וּ/דְבַר יְהוָ֥ה בְּ/פִ֖י/ךָ אֱמֶֽת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/024.yaml
  text: Then the woman said to Elijah[a], “Now I know that you are a man of God, and that the word of Yahweh in your mouth is truth.”
translation:
  language: te
  text: అప్పుడు ఆ స్త్రీ ఏలీయాతో, “నీవు దేవుని మనిషివని, నీ నోటిలోనున్న యాహ్వే వాక్యం సత్యమని ఇప్పుడు నాకు తెలుసు” అంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: అప్పుడు ... అంది
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ సహజంగా సంఘటనల క్రమాన్ని తెలియజేస్తుంది.
- source_word: הָאִשָּׁה
  choice: ఆ స్త్రీ
  rationale: సందర్భంలో ఇంతకుముందు పరిచయమైన విధవరాలినే సూచించినా, ఈ వచనంలోని సూటి పదార్థమైన ‘స్త్రీ’ని నిలుపుతుంది.
- source_word: עַתָּה זֶה
  choice: ఇప్పుడు
  rationale: ఈ హీబ్రూ పదబంధం ప్రస్తుత క్షణంలో కలిగిన దృఢమైన గ్రహింపును సూచిస్తుంది; తెలుగులో ‘ఇప్పుడు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: יָדַעְתִּי
  choice: నాకు తెలిసింది
  rationale: రూపరీత్యా పర్ఫెక్ట్ అయినా, ఇటీవలి సంఘటన వల్ల ఇప్పుడు కలిగిన స్థిరమైన నిశ్చయాన్ని సూచిస్తుంది.
- source_word: אִישׁ אֱלֹהִים
  choice: దేవుని మనిషి
  rationale: దేవునికి చెందిన ప్రవక్తను లేదా దేవుని ప్రతినిధిని సూచించే స్థిరమైన హీబ్రూ ప్రయోగాన్ని పారదర్శకంగా నిలుపుతుంది.
- source_word: וּדְבַר יְהוָה
  choice: యాహ్వే వాక్యం
  rationale: דבר లోని ‘వాక్యం/సందేశం’ భావాల్లో, ప్రవచన సంబంధమైన స్థిర ప్రయోగాన్ని మరియు దైవిక నామాన్ని నిలుపుతుంది.
- source_word: בְּפִיךָ
  choice: నీ నోటిలో ఉన్న
  rationale: ప్రవక్త పలికిన మాటను సూచించే హీబ్రూ నోటి రూపకాన్ని తెలుగులో అర్థమయ్యే విధంగా సాధ్యమైనంత దగ్గరగా నిలుపుతుంది.
- source_word: אֱמֶת
  choice: సత్యం
  rationale: నామవాచక రూపాన్ని నిలుపుతూ సత్యం, సత్యసంధత, నమ్మదగినదనం అనే భావపరిధిని మోస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో నాలుగు అక్షరాల దైవనామం నేరుగా ఉంది; దానిని బిరుదుగా మార్చకుండా దేవుని నిబంధన నామంగా లిప్యంతరీకరించాం.
- issue: אֱמֶת ను నామవాచకంగానా విశేషణంగానా వ్యక్తపరచడం
  choice: సత్యం
  alternative: సత్యమైనది / నమ్మదగినది
  rationale: హీబ్రూలో ఉన్న నామవాచక బలాన్ని నిలుపుతూ, ఆ మాట నిజమైనదీ నమ్మదగినదీ అనే భావవిస్తృతిని పూర్తిగా ఒకే అర్థానికి పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘నీ నోటిలో ఉన్న’ అనే రూపం కొంత సెమిటిక్ చిత్రాన్ని నిలుపుకున్నప్పటికీ సాధారణ పాఠకునికి అర్థమయ్యేలా ఉంది; వాక్యక్రమం సహజమైన తెలుగు ప్రత్యక్ష సంభాషణకు అనుగుణంగా అమర్చబడింది.
