  to: అప్పుడు ఆ స్త్రీ ఏలీయాతో, “నీవు దేవుని మనిషివని, నీ నోటిలోనున్న యాహ్వే వాక్యం సత్యమని ఇప్పుడు నాకు తెలుసు” అంది.
