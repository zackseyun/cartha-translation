  terminology: '''దేవుని మనిషి,'' ''యాహ్వే,'' ''వాక్యం,'' and ''సత్యం'' are appropriate, consistent, and theologically nonsectarian. The lexical-alternative footnote appropriately preserves the possible adjectival sense of אמת.'
