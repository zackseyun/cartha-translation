source:
  edition: WLC
  text: וַ/תֹּ֗אמֶר חַי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אִם יֶשׁ לִ֣/י מָע֔וֹג כִּ֣י אִם מְלֹ֤א כַף קֶ֨מַח֙ בַּ/כַּ֔ד וּ/מְעַט שֶׁ֖מֶן בַּ/צַּפָּ֑חַת וְ/הִנְ/נִ֨י מְקֹשֶׁ֜שֶׁת שְׁנַ֣יִם עֵצִ֗ים וּ/בָ֨אתִי֙ וַ/עֲשִׂיתִ֨י/הוּ֙ לִ֣/י וְ/לִ/בְנִ֔/י וַ/אֲכַלְנֻ֖/הוּ וָ/מָֽתְנוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/012.yaml
  text: And she said[a], “As Yahweh your God lives, I have no bread-cake, only a handful of flour in the jar and a little oil in the jug. And look, I am gathering two sticks, so that I may go in and prepare it for myself and for my son, and we may eat it and die.”
translation:
  language: te
  text: అప్పుడు ఆమె, “నీ దేవుడైన యాహ్వే జీవించి ఉన్నట్టుగా, నా దగ్గర రొట్టె ఏదీ లేదు[a]. కుండలో గుప్పెడు పిండి, చిన్న పాత్రలో కొద్దిగా నూనె మాత్రమే ఉన్నాయి. ఇదిగో, నేను రెండు చిన్న కట్టెలు ఏరుకుంటున్నాను. ఇంటికి వెళ్లి, ఆ పిండితో నాకూ నా కుమారునికీ ఆహారం సిద్ధం చేస్తాను. మేము దాన్ని తిని చనిపోతాము” అని చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రొట్టె’కు ఉపయోగించిన హీబ్రూ పదం చిన్నగా, గుండ్రంగా కాల్చిన రొట్టెను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యాహ్వే జీవంతోడు
  rationale: హీబ్రూ ప్రమాణ సూత్రంలోని గంభీరతను సహజమైన తెలుగు ప్రమాణ ప్రయోగంతో నిలుపుతూ, దైవనామాన్ని ‘యాహ్వే’గా ప్రత్యక్షంగా అందిస్తుంది.
- source_word: אִם יֶשׁ לִי מָעוֹג
  choice: నా దగ్గర రొట్టె ఏదీ లేదు
  rationale: ప్రమాణ సందర్భంలో אִם బలమైన నిరాకరణను సూచిస్తుంది. מָעוֹג కాల్చిన చిన్న రొట్టెను సూచించినా, ప్రధాన పాఠ్యంలో సహజమైన ‘రొట్టె’ను ఉంచి నిర్దిష్ట భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: מְלֹא כַף קֶמַח
  choice: గుప్పెడు పిండి
  rationale: అక్షరార్థంగా అరచేతి నిండా అనే చిన్న పరిమాణాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כַּד
  choice: కుండ
  rationale: పిండిని నిల్వచేసే గృహపాత్రకు సందర్భోచితమైన సాధారణ తెలుగు పదం.
- source_word: מְעַט שֶׁמֶן בַּצַּפָּחַת
  choice: చిన్న పాత్రలో కొద్దిగా నూనె
  rationale: צַפַּחַת నూనె ఉంచే చిన్న పాత్రను సూచిస్తుంది; పాత్ర ఆకారాన్ని అతిగా నిర్దిష్టం చేయకుండా మూలంలోని భావాన్ని ఇస్తుంది.
- source_word: וְהִנְנִי מְקֹשֶׁשֶׁת
  choice: ఇదిగో, నేను ... ఏరుకుంటున్నాను
  rationale: הִנְנִי సూచించే తక్షణ దృష్ట్యాకర్షణను, participle సూచించే కొనసాగుతున్న చర్యను రెండింటినీ నిలుపుతుంది.
- source_word: שְׁנַיִם עֵצִים
  choice: రెండు పుల్లలు
  rationale: అతి చిన్న మంటకు సరిపడే కొద్దిపాటి కట్టెలనే సూచించే సందర్భంలో ‘పుల్లలు’ కొరత తీవ్రతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַעֲשִׂיתִיהוּ לִי וְלִבְנִי
  choice: నాకూ నా కుమారునికీ దానితో ఆహారం సిద్ధం చేస్తాను
  rationale: స్త్రీలింగ ‘పిండి’ మరియు నపుంసక సూచనల మధ్య తెలుగులో కలిగే అసహజతను నివారిస్తూ, సిద్ధం చేయబోయేది ఆహారమని సందర్భానుసారంగా స్పష్టం చేస్తుంది.
theological_decisions:
- issue: సీదోను విధవరాలు పలికిన ప్రమాణంలో יְהוָה దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఒడంబడిక దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో ‘యాహ్వే’గా అందించడం మూలంలోని వ్యక్తినామాన్ని కాపాడుతుంది.
- issue: ‘మేము అది తిని చనిపోతాము’ అనే వాక్యంలోని మరణ నిరీక్షణ
  choice: చనిపోతాము
  alternative: చనిపోవడానికి సిద్ధమవుతాము
  rationale: హీబ్రూ వాక్యం మరణాన్ని నేరుగా, నిరాశతో కూడిన తదుపరి పరిణామంగా చెబుతుంది; ఉద్దేశపూర్వక మరణం లేదా ఆత్మహత్య భావాన్ని చేర్చకుండా అదే తీవ్రతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ప్రమాణ సూత్రానికి ‘జీవంతోడు’ అనే సహజ తెలుగు రూపాన్ని వాడాం. కొరతను స్పష్టంగా చూపేందుకు ‘గుప్పెడు’, ‘కొద్దిగా’, ‘రెండు పుల్లలు’ అనే సంక్షిప్త పదబంధాలను నిలిపాం.
