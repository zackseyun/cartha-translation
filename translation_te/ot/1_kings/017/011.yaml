translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని, గౌరవప్రదమైన వాక్యనిర్మాణాన్ని ఉపయోగించాం. మూలంలోని విజ్ఞాపన స్వరం, చేతి దృశ్యరూపం, ‘రొట్టె ముక్క’ పరిమాణభావం నిలిపాం.
