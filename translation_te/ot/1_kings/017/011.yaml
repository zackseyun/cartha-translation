  yaml_path: translation/ot/1_kings/017/011.yaml
  text: As she went to get it[a], he called to her and said[b], “Please bring me a piece of bread in your hand.”
translation:
  language: te
  text: ఆమె దాన్ని తీసుకురావడానికి వెళ్తుండగా, అతడు ఆమెను పిలిచి[a], “దయచేసి నీ చేతిలో ఉన్న ఒక రొట్టె ముక్కను[b] నాకు తీసుకురా” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమె వెనుకనుండి పిలిచాడు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “రొట్టె ముద్దను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ לָקַחַת
  choice: ఆమె దాన్ని తీసుకురావడానికి వెళ్తుండగా
  rationale: הלך తరువాత వచ్చిన לקח ఉద్దేశాన్ని తెలియజేస్తుంది; తరువాతి క్రియ ఆమె వెళ్తున్న సమయంలోనే పిలుపు వచ్చిందని సందర్భం సూచిస్తుంది. ‘దాన్ని’ అనేది ముందరి వచనంలో అడిగిన నీటిని సహజంగా సూచిస్తుంది.
- source_word: וַיִּקְרָא אֵלֶיהָ
  choice: అతడు ఆమెను పిలిచి
  rationale: קרא తో אֶל సాధారణంగా ఒకరిని ఉద్దేశించి పిలవడాన్ని సూచిస్తుంది. సందర్భం వల్ల ‘ఆమె వెనుక నుంచి పిలిచి’ అనే భావం సాధ్యమైనా, ప్రధాన పాఠంలో మరింత ప్రత్యక్షమైన అర్థాన్ని ఉంచాం.
- source_word: לִקְחִי נָא לִי
  choice: దయచేసి … నా కోసం తీసుకురా
  rationale: נָא విజ్ఞాపనను మృదువుగా చేస్తుంది; అందుకు ఆధునిక తెలుగులో ‘దయచేసి’ సహజమైన సమానం. לקח ఇక్కడ వస్తువును తెచ్చి ఇవ్వమనే సందర్భార్థంలో ‘తీసుకురా’గా అనువదించబడింది; לִי లబ్ధిదారుని సూచిస్తున్నందున ‘నా కోసం’గా ఉంచాం.
- source_word: פַּת לֶחֶם
  choice: ఒక రొట్టె ముక్కను
  rationale: ఈ నిర్మాణం రొట్టెలో ఒక చిన్న భాగాన్ని లేదా ముక్కను సూచిస్తుంది. ‘రొట్టె ముక్క’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: בְּיָדֵךְ
  choice: నీ చేతిలో
  rationale: మూలంలోని స్పష్టమైన ‘నీ చేతిలో’ అనే రూపకల్పనను నిలిపి, వస్తువును చేతిలో పట్టుకొని తీసుకురావాలనే భావాన్ని కాపాడాం.
