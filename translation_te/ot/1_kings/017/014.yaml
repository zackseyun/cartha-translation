id: 1KI.17.14
reference: 1 Kings 17:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל כַּ֤ד הַ/קֶּ֨מַח֙ לֹ֣א תִכְלָ֔ה וְ/צַפַּ֥חַת הַ/שֶּׁ֖מֶן לֹ֣א תֶחְסָ֑ר עַ֠ד י֧וֹם תתן יְהוָ֛ה גֶּ֖שֶׁם עַל פְּנֵ֥י הָ/אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/014.yaml
  text: 'For this is what Yahweh[a], the God of Israel, says: ‘The jar of flour will not be used up, and the jug of oil will not run dry[c][b], until the day Yahweh gives rain on the face of the ground.’'
translation:
  language: te
  text: 'ఎందుకంటే ఇశ్రాయేలు దేవుడైన యాహ్వే[a] ఇలా అంటున్నాడు: “పిండి కుండలోని పిండి అయిపోదు[b], నూనె పాత్రలోని నూనె తగ్గిపోదు[d], యాహ్వే నేలపై[c] వర్షం కురిపించే రోజు వరకు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యాహ్వే’ అనేది יהוה అనే హీబ్రూ దైవనామానికి లిప్యంతరీకరణ.
    reason: translation_note
  - marker: b
    text: లేదా “తరిగిపోదు.”
    reason: lexical_alternative
  - marker: c
    text: 'హీబ్రూ: “నేల ముఖంపై.”'
    reason: cultural_note
  - marker: d
    text: లేదా “కొదువపడదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో సాధారణంగా గుర్తించగల లిప్యంతరీకరణగా ఉంచింది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: כַּד הַקֶּמַח
  choice: పిండి కుండలోని పిండి
  rationale: మూలంలో అక్షరార్థంగా ‘పిండి కుండ’ ఉన్నా, సరఫరా అయిపోకపోవడమే భావమని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לֹא תִכְלָה
  choice: అయిపోదు
  rationale: כלה ఇక్కడ పూర్తిగా ఖర్చైపోవడం లేదా అంతమవడం అనే భావాన్ని ఇస్తుంది; గృహావసర సరఫరా సందర్భంలో ‘అయిపోదు’ సహజంగా ఉంది.
- source_word: צַפַּחַת הַשֶּׁמֶן
  choice: నూనె పాత్రలోని నూనె
  rationale: צַפַּחַת ఒక చిన్న పాత్రను సూచిస్తుంది. ‘సీసా’ అనడం గాజు పాత్ర అనే అనవసర భావాన్ని కలిగించవచ్చు కాబట్టి సాధారణమైన ‘పాత్ర’ను ఎంచుకుంది.
- source_word: לֹא תֶחְסָר
  choice: తగ్గిపోదు
  rationale: חסר లోని కొదువపడటం లేదా తగ్గిపోవడం అనే భావాన్ని నిలుపుతుంది; ‘ఎండిపోదు’ అని చెప్పి మూలంలో లేని ద్రవసంబంధ రూపకాన్ని బలపరచదు.
- source_word: תתן יְהוָה גֶּשֶׁם
  choice: యాహ్వే … వర్షం కురిపించే
  rationale: נתן అక్షరార్థంగా ‘ఇవ్వడం’; వర్షం విషయంలో ‘కురిపించడం’ ఆధునిక తెలుగులో సహజమైన సమానార్థక ప్రయోగం.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: నేలపై
  rationale: హీబ్రూ ‘నేల ముఖంపై’ అనే నుడికారాన్ని సహజ తెలుగులో సంక్షిప్తంగా అందిస్తుంది; అక్షరార్థ రూపాన్ని పాదటిప్పణిలో ఉంచింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దాన్ని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని నామప్రయోగాన్ని కాపాడుతుంది.
- issue: అద్భుత వాగ్దానంలోని రెండు క్రియల భేదం
  choice: పిండి ‘అయిపోదు’; నూనె ‘తగ్గిపోదు’
  alternative: రెండింటికీ ఒకే క్రియను ఉపయోగించడం
  rationale: כלה మరియు חסר అనే వేర్వేరు హీబ్రూ క్రియల భావభేదాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, వాగ్దానం యొక్క అసాధారణ స్వభావాన్ని వివరణతో మృదువుపరచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సామాన్య పాఠకులకు స్పష్టమైన వాక్య నిర్మాణం వాడబడింది. ప్రవచన సూత్రానికి ‘ఇలా అంటున్నాడు’ను, ఇంటి నిల్వ పాత్రలకు సహజమైన పదజాలాన్ని ఎంచుకుంది. మూలంలోని రెండు ప్రతికూల వాగ్దానాల సమాంతరతను అర్థవిరామంతో నిలిపింది.
