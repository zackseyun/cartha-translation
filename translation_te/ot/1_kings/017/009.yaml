source:
  edition: WLC
  text: ק֣וּם לֵ֤ךְ צָרְפַ֨תָ/ה֙ אֲשֶׁ֣ר לְ/צִיד֔וֹן וְ/יָשַׁבְתָּ֖ שָׁ֑ם הִנֵּ֨ה צִוִּ֥יתִי שָׁ֛ם אִשָּׁ֥ה אַלְמָנָ֖ה לְ/כַלְכְּלֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/009.yaml
  text: Get up[a], go to Zarephath, which belongs to Sidon, and stay there. Look[b], I have commanded a widow there to provide for you.
translation:
  language: te
  text: “లేచి, సీదోనుకు చెందిన సారెపతుకు[a] వెళ్లి అక్కడ నివసించు. ఇదిగో, అక్కడ ఉన్న ఒక విధవరాలికి నిన్ను పోషించమని నేను ఆజ్ఞాపించాను[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సీదోనులో ఉన్న సారెపతుకు’ లేదా ‘సీదోను సమీపంలోని సారెపతుకు.’ హీబ్రూ పదబంధం సారెపతును సీదోనుతో సంబంధపరుస్తుంది; ఇది ప్రాంతీయ లేదా రాజకీయ అనుబంధాన్ని సూచిస్తుండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అక్కడ ఒక విధవరాలు నిన్ను పోషించేలా నేను నియమించాను.’ హీబ్రూ పాఠంలో అక్షరార్థంగా ‘నేను ఆజ్ఞాపించాను’ అని ఉంది. ఆ విధవరాలు ఆ ఆజ్ఞను అప్పటికే చైతన్యపూర్వకంగా తెలుసుకుందని కథనం ఇంకా చూపకపోయినా, ఇది దేవుని సార్వభౌమ నిర్దేశాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ק֣וּם
  choice: లేచి
  rationale: קום ఆజ్ఞారూపం లేచి కార్యానికి సిద్ధపడమనే భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండేలా తరువాతి ఆజ్ఞతో అనుసంధానించబడింది.
- source_word: לֵ֤ךְ
  choice: వెళ్లి
  rationale: הלך ఆజ్ఞారూపం గమనం చేయమనే సాధారణ భావం; తెలుగులో వరుస ఆజ్ఞలను సహజంగా వ్యక్తం చేయడానికి ‘లేచి ... వెళ్లి ... నివసించు’ అనే నిర్మాణం వాడబడింది.
- source_word: צָרְפַתָה
  choice: సారెపతుకు
  rationale: స్థలనామాన్ని తెలుగు లిపిలో మూల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించి, దిశను సూచించే విభక్తి చేర్చబడింది.
- source_word: אֲשֶׁר לְצִידוֹן
  choice: సీదోనుకు చెందిన
  rationale: לְ అనే సంబంధసూచక ప్రయోగం భౌగోళిక లేదా రాజకీయ అనుబంధాన్ని సూచించగలదు. ‘చెందిన’ ఆ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది; ఇతర సాధ్యార్థాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: וְיָשַׁבְתָּ שָׁם
  choice: అక్కడ నివసించు
  rationale: ముందున్న ఆజ్ఞల కొనసాగింపుగా వచ్చిన ఈ రూపం అక్కడ ఉండి నివసించమనే ఆజ్ఞను తెలియజేస్తుంది. ‘నివసించు’ గౌరవప్రదమైన ఆధునిక తెలుగు.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే మూలపాఠంలోని సూచనాత్మక అవ్యయాన్ని తెలుగు బైబిలు వచనశైలిలో సహజమైన ‘ఇదిగో’తో నిలిపింది.
- source_word: צִוִּיתִי
  choice: నేను ఆజ్ఞాపించాను
  rationale: צוה పీయేల్ రూపానికి నేరమైన అర్థం ‘ఆజ్ఞాపించాను.’ కథలో విధవరాలికి ఆ ఆజ్ఞ ముందే తెలిసిందా అనే ప్రశ్నను అనువాదం పరిష్కరించకుండా మూలంలోని బలాన్ని నిలుపుతుంది.
- source_word: אִשָּׁה אַלְמָנָה
  choice: ఒక విధవరాలికి
  rationale: ‘ఒక స్త్రీ, విధవరాలు’ అనే మూల నిర్మాణాన్ని అర్థనష్టం లేకుండా సహజ తెలుగులో ‘ఒక విధవరాలు’గా సంక్షిప్తంగా వ్యక్తం చేసింది.
- source_word: לְכַלְכְּלֶךָ
  choice: నిన్ను పోషించమని
  rationale: כלכל ఆహారం ఇవ్వడమే కాక జీవనాధారాన్ని సమకూర్చి నిలబెట్టే విస్తృత భావం కలిగి ఉంది. ‘పోషించు’ సందర్భానికి తగిన విస్తృతిని నిలుపుతుంది.
theological_decisions:
- issue: విధవరాలికి దేవుడు ‘ఆజ్ఞాపించాను’ అని చెప్పడంలోని భావం
  choice: ‘నేను ఆజ్ఞాపించాను’ అనే ప్రత్యక్ష పదప్రయోగాన్ని నిలుపడం
  alternative: ‘నేను నియమించాను’ లేదా ‘నేను సిద్ధం చేశాను’
  rationale: మూలంలోని צוה సాధారణంగా ‘ఆజ్ఞాపించు’ అని అర్థం. తరువాతి కథనంలో విధవరాలు ముందుగానే ఈ ఆజ్ఞను చైతన్యపూర్వకంగా తెలుసుకున్నట్లు స్పష్టంగా కనిపించకపోయినా, ఆ ఉద్వేగాన్ని వ్యాఖ్యానాత్మకంగా తొలగించకుండా మూలపాఠానుసారంగా ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞాశైలి ఉపయోగించబడింది. వరుస హీబ్రూ ఆజ్ఞలు తెలుగులో ‘లేచి ... వెళ్లి ... నివసించు’గా ప్రవాహవంతంగా అమర్చబడ్డాయి. ‘ఇదిగో’ ద్వారా మూలంలోని శ్రద్ధాకర్షక స్వరం, ‘ఆజ్ఞాపించాను’ ద్వారా దైవ కార్యసంబంధమైన ఉద్దేశపూర్వక ఉద్వేగం నిలుపబడ్డాయి.
