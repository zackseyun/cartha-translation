source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֵלֶ֖י/הָ תְּנִֽי לִ֣/י אֶת בְּנֵ֑/ךְ וַ/יִּקָּחֵ֣/הוּ מֵ/חֵיקָ֗/הּ וַֽ/יַּעֲלֵ֨/הוּ֙ אֶל הָ/עֲלִיָּ֗ה אֲשֶׁר הוּא֙ יֹשֵׁ֣ב שָׁ֔ם וַ/יַּשְׁכִּבֵ֖/הוּ עַל מִטָּתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/019.yaml
  text: And he said to her[a], “Give me your son.” Then he took him from her bosom, carried him up to the upper room where he was staying[b], and laid him on his own bed.
translation:
  language: te
  text: అతడు ఆమెతో, “నీ కుమారుణ్ణి నాకు ఇవ్వు” అన్నాడు. తరువాత అతడు ఆమె ఒడి నుండి బాలుణ్ణి తీసుకొని, తాను ఉంటున్న మేడగదికి[a] అతణ్ణి పైకి మోసుకెళ్లి, తన మంచం మీద పడుకోబెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మేడమీది గదికి’ లేదా ‘పైగదికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנִי לִי
  choice: నాకు ఇవ్వు
  rationale: ఆజ్ఞార్థక క్రియతో לִי కలిసిన సహజమైన, నేరమైన అర్థాన్ని అనవసర కఠినత్వం జోడించకుండా తెలియజేస్తుంది.
- source_word: בְּנֵךְ
  choice: నీ కుమారుణ్ణి
  rationale: בֵּן ప్రత్యేకంగా కుమారుణ్ణి సూచిస్తుంది; సాధారణార్థకమైన ‘బిడ్డ’ కంటే మూలంలోని లింగసూచనను నిలుపుతుంది.
- source_word: מֵחֵיקָהּ
  choice: ఆమె ఒడి నుండి
  rationale: חֵיק ఛాతి/ఒడి ప్రాంతాన్ని, దగ్గరగా హత్తుకొని ఉంచడాన్ని సూచిస్తుంది; ‘ఒడి’ ఆధునిక తెలుగులో సహజంగా ఈ దృశ్యాన్ని అందిస్తుంది.
- source_word: וַיַּעֲלֵהוּ
  choice: అతణ్ణి పైకి మోసుకెళ్లి
  rationale: గమ్యస్థానంవైపు పైకి తీసుకెళ్లడాన్ని సూచించే క్రియ; సందర్భంలో బాలుణ్ణి భౌతికంగా మోసుకెళ్లిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָעֲלִיָּה
  choice: మేడగది
  rationale: עֲלִיָּה ఇంటి పైభాగంలోని గది లేదా మేడమీది గదిని సూచిస్తుంది; ‘మేడగది’ సంక్షిప్తమైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: אֲשֶׁר הוּא יֹשֵׁב שָׁם
  choice: తాను ఉంటున్న
  rationale: ישב ఇక్కడ కూర్చోవడం కాక నివసించడం లేదా బసచేయడం అనే సందర్భార్థంలో ఉంది.
- source_word: וַיַּשְׁכִּבֵהוּ
  choice: పడుకోబెట్టాడు
  rationale: שׁכב హిఫీల్ రూపం ‘పడుకునేలా చేయడం’ అనే కారణార్థాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: עַל מִטָּתוֹ
  choice: తన మంచం మీద
  rationale: ప్రత్యయం చుట్టుపక్కల క్రియల కర్త అయిన ఏలీయాను సూచిస్తుంది; ‘తన’ తెలుగులో ఆ సూచనను సహజంగా స్పష్టం చేస్తుంది.
