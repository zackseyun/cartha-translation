translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యక్రమాన్ని యాంత్రికంగా అనుకరించకుండా చర్యల వరుసను నిలిపింది; మూలంలోని భావానికి మించిన సిద్ధాంత వివరణ ఏదీ చేర్చలేదు.
