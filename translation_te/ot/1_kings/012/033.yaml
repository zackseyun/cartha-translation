  text: And he went up to the altar that he had made in Bethel on the fifteenth day in the eighth month[a], in the month that he had devised from his own heart, and he made a feast for the sons of Israel[b]; and he went up to the altar to burn incense.
translation:
  language: te
  text: అతడు బేతేలులో తాను చేసిన బలిపీఠం మీదికి, తన హృదయంలోనే కల్పించుకున్న ఎనిమిదో నెల పదిహేనవ రోజున ఎక్కాడు[a]. అతడు ఇశ్రాయేలు ప్రజల కోసం[b] పండుగను ఏర్పాటు చేసి, ధూపం అర్పించడానికి బలిపీఠం మీదికి ఎక్కాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తనంతట తానే నిర్ణయించుకున్న నెలలో” లేదా “తన ఇష్టానుసారం నిర్ణయించుకున్న నెలలో.”
    reason: మూలంలోని మִלִּבּוֹ (‘తన హృదయం నుండి’) పదబంధం, ఆ నెల అతని స్వంత ఆలోచన/ఎంపిక నుండి వచ్చినదని సూచిస్తుంది.
  - marker: b
    text: హీబ్రూలో “ఇశ్రాయేలు కుమారుల కోసం”; ఇది ఇశ్రాయేలు ప్రజలను సూచించే సాధారణ జాతీయ నామం.
    reason: మూల రూపాన్ని తెలియజేస్తూ, తెలుగులో ఉపయోగించిన సమూహార్థ అనువాదాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: וַיַּעַל
  choice: ఎక్కాడు
  rationale: עלה అనే క్రియకు ‘పైకి ఎక్కు’ అనేది ప్రాథమిక అర్థం. బలిపీఠం సందర్భంలో దాని దగ్గరకు లేదా దాని వేదికపైకి ఎక్కడాన్ని సూచించవచ్చు; మూలంలోని పునరుక్తిని తెలుగులోనూ నిలిపింది.
- source_word: הַמִּזְבֵּחַ
  choice: బలిపీఠం
  rationale: מזבחకు ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, స్థిరమైన ఆరాధనా సంబంధ పదం.
- source_word: אֲשֶׁר עָשָׂה בְּבֵית־אֵל
  choice: బేతేలులో తాను చేసిన
  rationale: సంబంధవాచక వాక్యభాగాన్ని సహజ తెలుగు క్రమంలో ఉంచి, בְּ సూచించే స్థలార్థాన్ని ‘లో’తో తెలిపింది.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם בַּחֹדֶשׁ הַשְּׁמִינִי
  choice: ఎనిమిదో నెల పదిహేనో రోజున
  rationale: హీబ్రూ తేదీ నిర్మాణాన్ని స్పష్టమైన, సహజమైన తెలుగు తేదీ ప్రయోగంగా అందించింది.
- source_word: בַּחֹדֶשׁ אֲשֶׁר בָּדָא מִלְּבַד
  choice: ఆ నెలను అతడు తన హృదయంలో నుంచే కల్పించుకున్నాడు
  rationale: בדאలోని కల్పించడం/రూపొందించడం అనే భావాన్నీ, מִלְּבַדలోని స్వీయ నిర్ణయాన్ని సూచించే విమర్శాత్మక ఛాయనూ నిలుపుతుంది; పాఠ్యంలోని హృదయ-రూపకాన్ని అనవసరంగా తొలగించదు.
- source_word: וַיַּעַשׂ חָג
  choice: పండుగను ఏర్పాటు చేసి
  rationale: ‘పండుగ చేశాడు’ అనే అక్షరానువాదం తెలుగులో అసహజంగా ఉండవచ్చు; సందర్భంలో పండుగను నియమించి నిర్వహించాడనే భావాన్ని ‘ఏర్పాటు చేశాడు’ సహజంగా తెలియజేస్తుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజల కోసం
  rationale: ఇది జాతిని మొత్తంగా సూచించే స్థిర హీబ్రూ నామవాచకం. ‘ఇశ్రాయేలు కుమారులు’ అనే రూపం తెలుగులో పురుషులను మాత్రమే సూచించినట్లు అపార్థమయ్యే అవకాశం ఉన్నందున సమూహార్థాన్ని స్పష్టపరచింది.
- source_word: לְהַקְטִיר
  choice: ధూపం వేయడానికి
  rationale: הקטיר ఆరాధనా సందర్భంలో అర్పణను పొగగా ఎగసేలా చేయడం, తరచుగా ధూపం వేయడం, అనే అర్థం ఇస్తుంది. ఈ సందర్భానికి సంక్షిప్తమైన సహజ తెలుగు ప్రయోగం.
theological_decisions:
- issue: యెరోబాము నిర్ణయించిన నెలను వివరించే מִלְּבַד పదబంధంలోని మూల్యాంకన ఛాయ
  choice: తన హృదయంలో నుంచే కల్పించుకున్నాడు
  alternative: తనంతట తానే నిర్ణయించుకున్నాడు
  rationale: పండుగ దైవ ఆజ్ఞ ప్రకారం కాక అతని స్వీయ ఆలోచనలో పుట్టిందనే కథకుని పరోక్ష విమర్శను నిలుపుతుంది; అదే సమయంలో పాఠ్యానికి మించిన సిద్ధాంత వ్యాఖ్యను చేర్చదు.
- issue: בני ישראל అనే జాతీయ సమూహ నామం
  choice: ఇశ్రాయేలు ప్రజలు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: ఇక్కడ పదబంధం పురుష సంతానాన్ని మాత్రమే కాక ఇశ్రాయేలు జాతిని సమష్టిగా సూచిస్తుంది. అందువల్ల ఆధునిక తెలుగులో ఉద్దేశిత పరిధిని స్పష్టంగా తెలియజేసే రూపాన్ని ఎంచుకుంది.
- issue: הקטיר యొక్క ఆరాధనా అర్థ పరిధి
  choice: ధూపం వేయడం
  alternative: అర్పణను పొగగా ఎగసేలా చేయడం
  rationale: క్రియకు విస్తృతంగా బలి భాగాన్ని దహనం చేయడం అనే అర్థం ఉండగలిగినా, ఈ సందర్భంలో ధూపార్పణ అనే సంప్రదాయ అర్థం సాధ్యమైనది మరియు సహజమైనది; ప్రత్యామ్నాయ అర్థ పరిధిని గమనికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. మూలంలోని రెండు సార్లు వచ్చే ‘ఎక్కాడు’ను నిలిపి, మధ్య భాగంలోని పొడవైన నిర్మాణాన్ని డాష్‌తో స్పష్టపరిచింది. ‘తన హృదయంలో నుంచే’ అనే హీబ్రూ రూపకాన్ని నిలుపుతూ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
