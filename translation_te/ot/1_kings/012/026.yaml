  edition: WLC
  text: וַ/יֹּ֥אמֶר יָרָבְעָ֖ם בְּ/לִבּ֑/וֹ עַתָּ֛ה תָּשׁ֥וּב הַ/מַּמְלָכָ֖ה לְ/בֵ֥ית דָּוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/026.yaml
  text: And Jeroboam said in his heart[a], “Now the kingdom will return to the house of David.”
translation:
  language: te
  text: యెరోబాము తన హృదయంలో[a], “ఇప్పుడు రాజ్యం దావీదు వంశానికి తిరిగి వెళ్తుంది” అని అనుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తనలో తాను.” హీబ్రూలో అక్షరార్థంగా “తన హృదయంలో” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అని అనుకున్నాడు
  rationale: ఇది అంతరంగంలో జరిగిన మాట కాబట్టి, తెలుగులో సహజంగా ‘అనుకున్నాడు’ అని అనువదించాం; వావ్-కన్సిక్యూటివ్ కథన ప్రవాహాన్ని కొనసాగిస్తుంది.
- source_word: יָרָבְעָם
  choice: యరొబాము
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణంగా వ్యక్తి పేరును లిప్యంతరీకరించాం.
- source_word: בְּלִבּוֹ
  choice: తన హృదయంలో
  rationale: హీబ్రూ పదబంధంలోని శరీరాత్మక రూపకాన్ని నిలుపుతూ, అది అంతరంగ ఆలోచనను సూచిస్తుందని సందర్భం స్పష్టం చేస్తుంది.
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: యరొబాము ఆందోళనలోని తక్షణ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: תָּשׁוּב
  choice: తిరిగి వెళ్తుంది
  rationale: שוב అనే క్రియలోని ‘తిరుగు/మునుపటి స్థితికి వెళ్లు’ అనే భావాన్ని రాజకీయ సందర్భంలో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַמַּמְלָכָה
  choice: రాజ్యం
  rationale: ఇక్కడ రాజాధికారం కింద ఉన్న రాజకీయ రాజ్యాన్ని సూచించే సహజమైన తెలుగు పదం.
- source_word: לְבֵית דָּוִד
  choice: దావీదు వంశానికి
  rationale: హీబ్రూ ‘దావీదు ఇంటికి’ అనేది ఇక్కడ దావీదు రాజవంశాన్ని సూచించే నానుడి; ‘వంశానికి’ అనడం ఆధునిక తెలుగు పాఠకులకు అర్థాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: בְּלִבּוֹ అనే అంతరంగ సంభాషణ నానుడి
  choice: తన హృదయంలో
  alternative: తనలో తాను
  rationale: మూలంలోని ‘హృదయం’ రూపకాన్ని నిలుపుతూ, అంతరంగ ఆలోచన అనే భావాన్ని సందర్భం ద్వారా తెలియజేస్తుంది; ఎలాంటి అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: בֵית דָּוִד యొక్క రాజవంశార్థం
  choice: దావీదు వంశానికి
  alternative: దావీదు ఇంటికి
  rationale: ఇక్కడ ‘ఇల్లు’ భవనాన్ని కాక దావీదు రాజవంశాన్ని సూచిస్తుంది. తెలుగు పాఠకులకు రాజకీయ భావం స్పష్టమయ్యేలా అర్థానువాదం చేయబడింది; ఒడంబడిక లేదా వారసత్వ సంబంధిత భావాన్ని తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ‘హృదయంలో’ అనే రూపకాన్ని పాదసూచికతో నిలుపుతూ, అంతరంగ సంభాషణకు సహజమైన తెలుగు వాక్యనిర్మాణాన్ని ఉపయోగించాం.
