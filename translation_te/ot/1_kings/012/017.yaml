  text: But Rehoboam reigned over the Israelites who lived in the cities of Judah.
translation:
  language: te
  text: అయితే యూదా పట్టణాల్లో నివసిస్తున్న ఇశ్రాయేలీయుల మీద రెహబాము రాజుగా పరిపాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  choice: అయితే … ఇశ్రాయేలీయులు
  rationale: בני ישראל అనే జాతీయ సమూహ సూచనను ఆధునిక తెలుగులో సహజంగా ‘ఇశ్రాయేలీయులు’ అని అందించాం; וּ సందర్భంలోని వ్యత్యాసాన్ని ‘అయితే’ తెలియజేస్తుంది.
- source_word: הַ/יֹּשְׁבִים
  choice: నివసిస్తున్న
  rationale: ישב క్రియలోని కొనసాగుతున్న నివాస భావాన్ని సహజమైన వర్తమాన కృదంత రూపం తెలియజేస్తుంది.
- source_word: בְּ/עָרֵי יְהוּדָה
  choice: యూదా పట్టణాల్లో
  rationale: స్థలవాచక భావాన్ని సూటిగా ఉంచుతూ, ఆధునిక తెలుగులో సహజమైన సంబంధ నిర్మాణాన్ని వాడాం.
- source_word: וַ/יִּמְלֹךְ
  choice: రాజుగా పరిపాలించాడు
  rationale: מלך ఇక్కడ రాజాధికారాన్ని నిర్వహించడాన్ని సూచిస్తుంది; ‘రాజుగా పరిపాలించాడు’ సాధారణ పాఠకునికి స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: עֲלֵי/הֶם
  choice: వారి మీద
  rationale: రాజ్యాధికార సంబంధాన్ని ‘మీద’ ద్వారా నిలిపాం; తెలుగులో వాక్య స్పష్టత కోసం సూచిత సమూహాన్ని భావపరంగా కొనసాగించాం.
- source_word: רְחַבְעָם
  choice: రెహబాము
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు బైబిలు వాడుకకు అనుగుణమైన లిప్యంతరీకరణ.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. హీబ్రూ వాక్యంలోని సందర్భానుసార వ్యత్యాసాన్ని ‘అయితే’తో, నివాసాన్ని సూచించే కృదంత భావాన్ని ‘నివసిస్తున్న’తో నిలిపాం.
