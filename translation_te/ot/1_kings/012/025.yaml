source:
  edition: WLC
  text: וַ/יִּ֨בֶן יָרָבְעָ֧ם אֶת שְׁכֶ֛ם בְּ/הַ֥ר אֶפְרַ֖יִם וַ/יֵּ֣שֶׁב בָּ֑/הּ וַ/יֵּצֵ֣א מִ/שָּׁ֔ם וַ/יִּ֖בֶן אֶת פְּנוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/025.yaml
  text: Then Jeroboam built Shechem in the hill country of Ephraim and lived there[a]; and he went out from there and built Penuel.
translation:
  language: te
  text: అప్పుడు యెరోబాము ఎఫ్రాయిము కొండప్రాంతంలోని షెకెమును కట్టి, అక్కడ నివసించాడు. అతడు అక్కడి నుండి బయలుదేరి పెనూయేలును[a] కట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ స్థలనామం కొన్ని అనువాదాల్లోను, సంబంధిత బైబిలు వాక్యభాగాల్లోను “పెనీయేలు” అని కూడా కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: కట్టాడు
  rationale: בנה అనే క్రియకు సాధారణ అర్థం ‘కట్టు.’ నగర సందర్భంలో అది పునర్నిర్మించడాన్ని లేదా కోటగా బలపరచడాన్ని సూచించవచ్చు; అయితే హీబ్రూ వచనం చెప్పినదానికంటే ఎక్కువ నిర్దిష్టతను చేర్చకుండా ‘కట్టాడు’ అని అనువదించాం.
- source_word: שְׁכֶם
  choice: షెకెము
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగులో సులభంగా గుర్తించగల ప్రామాణిక రూపంలో లిప్యంతరీకరించాం.
- source_word: בְּהַר אֶפְרַיִם
  choice: ఎఫ్రాయిము కొండప్రాంతంలోని
  rationale: הַר ఇక్కడ ఒక్క కొండను మాత్రమే కాక కొండలతో కూడిన భౌగోళిక ప్రాంతాన్ని సూచించగలదు. అందువల్ల సహజమైన ఆధునిక తెలుగులో ‘కొండప్రాంతం’ అని అనువదించాం.
- source_word: וַיֵּשֶׁב בָּהּ
  choice: అక్కడ నివసించాడు
  rationale: ישב ఇక్కడ నివసించడం లేదా స్థిరపడడాన్ని సూచిస్తుంది. స్త్రీలింగ ప్రత్యయం షెకెము పట్టణాన్ని సూచిస్తున్నందున తెలుగులో సహజంగా ‘అక్కడ’ అని ఇచ్చాం.
- source_word: וַיֵּצֵא מִשָּׁם
  choice: అక్కడి నుండి బయలుదేరి
  rationale: יצא యొక్క ‘బయటికి వెళ్లు’ అనే గమన భావాన్ని నిలుపుతూ, షెకెము నుండి అతడు వెళ్లినట్లు సహజ తెలుగులో వ్యక్తం చేశాం.
- source_word: פְּנוּאֵל
  choice: పెనూయేలు
  rationale: ఈ వచనంలోని హీబ్రూ హల్లుల రూపానికి అనుగుణంగా స్థలనామాన్ని ‘పెనూయేలు’ అని లిప్యంతరీకరించాం; ‘పెనీయేలు’ అనే సంబంధిత రూపాన్ని పాదటిప్పణిలో ఉంచాం.
