translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అదే సమయంలో గౌరవప్రదమైన కథనశైలిని పాటించాం. హీబ్రూ వరుస క్రియల ప్రవాహాన్ని సహజ తెలుగు వాక్య నిర్మాణంలో నిలిపాం; ‘పునర్నిర్మించాడు’ లేదా ‘కోటగా బలపరిచాడు’ వంటి సందర్భసాధ్యమైన కానీ మూలంలో స్పష్టంగా లేని భావాలను ప్రధాన పాఠ్యంలో చేర్చలేదు.
