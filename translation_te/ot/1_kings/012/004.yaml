id: 1KI.12.4
reference: 1 Kings 12:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָבִ֖י/ךָ הִקְשָׁ֣ה אֶת עֻלֵּ֑/נוּ וְ/אַתָּ֡ה עַתָּ֣ה הָקֵל֩ מֵ/עֲבֹדַ֨ת אָבִ֜י/ךָ הַ/קָּשָׁ֗ה וּ/מֵ/עֻלּ֧/וֹ הַ/כָּבֵ֛ד אֲשֶׁר נָתַ֥ן עָלֵ֖י/נוּ וְ/נַעַבְדֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/004.yaml
  text: Your father made our yoke heavy[a]. So now, lighten the hard service of your father and his heavy yoke that he put on us[b], and we will serve you.
translation:
  language: te
  text: “నీ తండ్రి మా కాడిని కఠినంగా చేశాడు[a]. ఇప్పుడు, నీ తండ్రి విధించిన కఠినమైన సేవను[b], ఆయన మాపై మోపిన బరువైన కాడిని తగ్గించు; అప్పుడు మేము నిన్ను సేవిస్తాము.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మా కాడిని కష్టతరం చేశాడు.” ఇక్కడ ‘కాడి’ అణచివేసే సేవా బాధ్యతలకు రూపకం.
    reason: lexical_alternative
  - marker: b
    text: “కఠినమైన సేవ”ను “కష్టమైన పని” లేదా “కఠోరమైన సేవ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשָׁה אֶת עֻלֵּנוּ
  choice: మా కాడిని కఠినం చేశాడు
  rationale: హిఫిల్ క్రియలోని ‘కఠినంగా చేశాడు’ అనే కారక భావాన్ని, అలాగే కాడి రూపకాన్ని నిలుపుతుంది.
- source_word: עֻלֵּנוּ
  choice: మా కాడి
  rationale: అణచివేసే సేవా బాధ్యతలు, పాలనా భారాన్ని సూచించే మూలభాష రూపకాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: הָקֵל
  choice: తేలిక చేయి
  rationale: ఆజ్ఞార్థక రూపాన్ని స్పష్టంగా తెలుపుతూ, తరువాతి ‘బరువైన’ అనే పదంతో ఉన్న వ్యతిరేక సంబంధాన్ని కాపాడుతుంది.
- source_word: מֵעֲבֹדַת אָבִיךָ הַקָּשָׁה
  choice: నీ తండ్రి మాపై మోపిన కఠినమైన సేవను
  rationale: עֲבֹדָהకు ‘సేవ’ అనే విస్తృత అర్థాన్ని ఉంచి, ఈ సందర్భంలో అది భారమైన లేదా నిర్బంధ సేవా బాధ్యతలను సూచిస్తుందని వాక్యనిర్మాణం ద్వారా స్పష్టం చేస్తుంది.
- source_word: וּמֵעֻלּוֹ הַכָּבֵד
  choice: బరువైన కాడిని
  rationale: ‘కాడి’ రూపకాన్ని పునరావృతం చేసి, כבד యొక్క బరువు భావాన్ని నేరుగా అందిస్తుంది; తెలుగు ప్రవాహంలో సంబంధం ముందున్న ‘నీ తండ్రి’ ద్వారా స్పష్టమవుతుంది.
- source_word: אֲשֶׁר נָתַן עָלֵינוּ
  choice: మాపై మోపిన
  rationale: భారం లేదా బాధ్యతను ఒకరిపై ఉంచడం అనే సందర్భార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְנַעַבְדֶךָּ
  choice: అప్పుడు మేము నిన్ను సేవిస్తాము
  rationale: విన్నపం నెరవేరితే కలిగే ఫలితం లేదా ప్రజలు చేసే వాగ్దానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: ఫిర్యాదు నుంచి విజ్ఞప్తికి మారే సంభాషణ క్రమాన్ని సూటిగా నిలుపుతుంది.
