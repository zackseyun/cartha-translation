translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘కాడి’ అనే బైబిలు రూపకాన్ని నిలుపుతూ, ‘మాపై మోపిన’ ద్వారా దాని భారార్థాన్ని సహజంగా వ్యక్తం చేసింది.
