translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. తరువాతి వచనంలో మొదలయ్యే ప్రత్యక్ష సంభాషణ కోసం వాక్యాంతంలో ద్విబిందువు ఉంచాం.
