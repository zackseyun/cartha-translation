id: 1KI.12.3
reference: 1 Kings 12:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּשְׁלְחוּ֙ וַ/יִּקְרְאוּ ל֔/וֹ ו/יבאו יָרָבְעָ֖ם וְ/כָל קְהַ֣ל יִשְׂרָאֵ֑ל וַֽ/יְדַבְּר֔וּ אֶל רְחַבְעָ֖ם לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/003.yaml
  text: So they sent and called for him[a], and Jeroboam and all the assembly of Israel came and spoke to Rehoboam, saying[b],
translation:
  language: te
  text: 'వారు అతనికి కబురు పంపి పిలిపించారు[a]. యెరోబాము, ఇశ్రాయేలు సభ అంతా[b] వచ్చి రెహబాముతో ఇలా అన్నారు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతణ్ణి రమ్మని పిలిచారు.” హీబ్రూలో వారు అతని కోసం పంపి అతణ్ణి పిలిపించారని భావం.
    reason: lexical_alternative
  - marker: b
    text: “సభ”ను “సమాజం” అని కూడా అనువదించవచ్చు. ఇక్కడ అది ప్రజా-రాజకీయ విషయమై కూడిన ఇశ్రాయేలు సమూహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: వారు మనుషులను పంపి
  rationale: שׁלח అనే క్రియకు ప్రాథమిక అర్థం ‘పంపు.’ తెలుగులో వాక్యం సహజంగా ఉండేందుకు హీబ్రూలో అంతర్లీనంగా ఉన్న పంపబడిన వ్యక్తులను ‘మనుషులను’ అని వ్యక్తం చేశాం.
- source_word: וַיִּקְרְאוּ לוֹ
  choice: అతణ్ణి పిలిపించారు
  rationale: קרא + ל ఇక్కడ యరొబామును రమ్మని పిలిపించడం లేదా అతనికి కబురు పంపించడం అనే భావాన్ని ఇస్తుంది. ‘పిలిపించారు’ ఆ సందర్భార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיָּבֹאוּ
  choice: వచ్చి
  rationale: בוא అనే సాధారణ క్రియకు ‘వచ్చు’ అనే అర్థాన్ని నిలుపుతూ, తరువాతి క్రియతో సహజంగా అనుసంధానించాం.
- source_word: יָרָבְעָם
  choice: యరొబాము
  rationale: హీబ్రూ వ్యక్తి పేరును ప్రామాణిక తెలుగు రూపంలో లిప్యంతరీకరించాం.
- source_word: וְכָל־קְהַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సభ అంతా
  rationale: קהל అనేది కూడివచ్చిన సమూహాన్ని సూచిస్తుంది. ఈ ప్రజా-రాజకీయ సందర్భంలో ‘సభ’ సరళంగా, గౌరవప్రదంగా ఉండి, మొత్తం కూడిన ఇశ్రాయేలు సమూహాన్ని సూచిస్తుంది.
- source_word: וַיְדַבְּרוּ אֶל־רְחַבְעָם
  choice: రెహబాముతో ... అన్నారు
  rationale: דבר אל అంటే ఒకరితో మాట్లాడడం. తరువాత ప్రత్యక్ష సంభాషణ వస్తున్నందున తెలుగులో సహజమైన ‘ఇలా అన్నారు’ అనే నిర్మాణాన్ని వాడాం; ‘తో’ సంభాషణ ఎవరిని ఉద్దేశించిందో నిలుపుతుంది.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నారు:'
  rationale: ఈ రూపం తరువాతి వచనంలోని ప్రత్యక్ష మాటలను పరిచయం చేస్తుంది. తెలుగు విరామచిహ్నంతో ఆ కొనసాగింపును స్పష్టంగా ఉంచాం.
