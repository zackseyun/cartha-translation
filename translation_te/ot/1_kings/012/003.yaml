  to: 'వారు అతనికి కబురు పంపి పిలిపించారు[a]. యెరోబాము, ఇశ్రాయేలు సభ అంతా[b] వచ్చి రెహబాముతో ఇలా అన్నారు:'
  rationale: Unstated ‘men’ has been removed to avoid over-specification. “కబురు పంపి పిలిపించారు” preserves the contextual, two-part Hebrew action in natural Telugu. The conventional name form “యెరోబాము” has been adopted; the assembly term and direct-speech introduction are retained.
