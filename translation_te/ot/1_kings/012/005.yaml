  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם לְכ֥וּ עֹ֛ד שְׁלֹשָׁ֥ה יָמִ֖ים וְ/שׁ֣וּבוּ אֵלָ֑/י וַ/יֵּלְכ֖וּ הָ/עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/005.yaml
  text: He said to them[a], “Go away for three more days, then return to me.” So the people went away.
translation:
  language: te
  text: అతడు వారితో, “మరో మూడు రోజులు వెళ్లండి; ఆ తర్వాత నా దగ్గరకు తిరిగి రండి” అని చెప్పాడు.[a] అప్పుడు ప్రజలు వెళ్లిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇంకా మూడు రోజులు వెళ్లండి; తరువాత నా దగ్గరకు తిరిగి రండి.”
    reason: עוֹד שְׁלֹשָׁה יָמִיםను ‘మరో మూడు రోజులు’ లేదా ‘ఇంకా మూడు రోజులు’గా వ్యక్తపరచవచ్చు.
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: అతడు వారితో ... అని చెప్పాడు
  rationale: హీబ్రూ కథనంలోని సాధారణ wayyiqtol రూపాన్ని సహజమైన తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో అందిస్తుంది; אֲלֵיהֶם సంభాషణ ఉద్దేశాన్ని ‘వారితో’గా స్పష్టంగా చూపుతుంది.
- source_word: לְכוּ
  choice: వెళ్లి
  rationale: బహువచన ఆజ్ఞారూపమైన הלך ఇక్కడ రాజు సమక్షం నుంచి తాత్కాలికంగా వెళ్లడాన్ని సూచిస్తుంది. తరువాతి ఆజ్ఞతో సహజంగా కలపడానికి ‘వెళ్లి’ ఉపయోగించబడింది.
- source_word: עוֹד שְׁלֹשָׁה יָמִים
  choice: ఇంకా మూడు రోజులు
  rationale: עוֹד కాలవ్యవధితో కలిసి అదనపు మూడు రోజుల భావాన్ని ఇస్తుంది; ‘ఇంకా మూడు రోజులు’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని కొంత నిర్మాణాత్మక అస్పష్టతను నిలుపుతుంది.
- source_word: וְשׁוּבוּ אֵלָי
  choice: ఆ తర్వాత నా దగ్గరికి తిరిగి రండి
  rationale: שוב యొక్క తిరిగి రావడం అనే ప్రధాన భావాన్ని ‘తిరిగి రండి’ నిలుపుతుంది; ఆజ్ఞల క్రమాన్ని తెలుగులో స్పష్టంగా తెలియజేయడానికి ‘ఆ తర్వాత’ చేర్చబడింది.
- source_word: וַיֵּלְכוּ הָעָם
  choice: అప్పుడు ప్రజలు వెళ్లిపోయారు
  rationale: సమూహార్థకమైన הָעָםను ‘ప్రజలు’గా అనువదించి, కథన కొనసాగింపును ‘అప్పుడు’తో సహజంగా చూపిస్తుంది. ‘వెళ్లిపోయారు’ వారు రాజు సమక్షం నుంచి నిష్క్రమించిన భావాన్ని అందిస్తుంది.
