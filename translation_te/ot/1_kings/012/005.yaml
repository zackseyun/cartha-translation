translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు ఉపయోగించబడ్డాయి. వాక్యం సాధారణ పాఠకులకు సహజంగా ఉండేలా రూపొందించబడింది; మూలంలోని అదనపు మూడు రోజుల కాలసంబంధ నిర్మాణానికి ఉన్న ప్రత్యామ్నాయ పఠనం పాదటిప్పణిలో నిలుపబడింది.
