source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ יָרָבְעָ֣ם חָ֡ג בַּ/חֹ֣דֶשׁ הַ/שְּׁמִינִ֣י בַּ/חֲמִשָּֽׁה עָשָׂר֩ י֨וֹם לַ/חֹ֜דֶשׁ כֶּ/חָ֣ג אֲשֶׁ֣ר בִּ/יהוּדָ֗ה וַ/יַּ֨עַל֙ עַל הַ/מִּזְבֵּ֔חַ כֵּ֤ן עָשָׂה֙ בְּ/בֵֽית אֵ֔ל לְ/זַבֵּ֖חַ לָ/עֲגָלִ֣ים אֲשֶׁר עָשָׂ֑ה וְ/הֶעֱמִיד֙ בְּ/בֵ֣ית אֵ֔ל אֶת כֹּהֲנֵ֥י הַ/בָּמ֖וֹת אֲשֶׁ֥ר עָשָֽׂה׀־׀׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/032.yaml
  text: Jeroboam made a feast in the eighth month[a], on the fifteenth day of the month, like the feast that was in Judah, and he went up to the altar. So he did in Bethel, sacrificing to the calves that he had made[b]; and he installed in Bethel the priests of the high places that he had made.
translation:
  language: te
  text: యెరోబాము ఎనిమిదవ నెలలో[a], నెల పదిహేనవ రోజున, యూదాలో ఉన్న పండుగలాగే ఒక పండుగను జరిపాడు; అతడు బలిపీఠం పైకి ఎక్కాడు[b]. అతడు బేతేలులో కూడా అలాగే చేసి, తాను చేసిన దూడలకు బలులు అర్పించాడు; తాను ఏర్పాటు చేసిన ఉన్నత పూజాస్థలాల యాజకులను బేతేలులో నియమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యూదాలోని ఈ పండుగ బహుశా పర్ణశాలల పండుగను సూచిస్తుంది. అది ఏడవ నెల పదిహేనవ రోజున జరిగేది; యెరోబాము తన ప్రత్యర్థి పండుగను ఒక నెల తర్వాత ఏర్పాటు చేశాడు.
    reason: cross_reference
  - marker: b
    text: లేదా, “బలిపీఠం దగ్గరకు ఎక్కాడు.” హీబ్రూ పదబంధాన్ని మరింత సందర్భానుసారంగా ఇలా అనువదించవచ్చు; అయితే అక్షరార్థంగా అది బలిపీఠం పైకి ఎక్కడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... חָג
  choice: పండుగను జరిపి
  rationale: עשה అనే క్రియ חגతో కలిసినప్పుడు పండుగను నిర్వహించడం లేదా జరపడం అనే నుడికారార్థం వస్తుంది. ఆధునిక తెలుగులో ‘పండుగను జరిపాడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בַּחֹדֶשׁ הַשְּׁמִינִי
  choice: ఎనిమిదవ నెలలో
  rationale: హీబ్రూ కాలసూచక పదబంధాన్ని నేరుగా, సహజమైన తెలుగు రూపంలో తెలిపింది.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: ఆ నెల పదిహేనవ రోజున
  rationale: హీబ్రూ తేదీ సూత్రాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, అదే నెలను సూచించడానికి ‘ఆ నెల’ వాడబడింది.
- source_word: כֶּחָג אֲשֶׁר בִּיהוּדָה
  choice: యూదాలో జరిగే పండుగలాంటి పండుగను
  rationale: పోలికను స్పష్టంగా ఉంచుతూ, మూలపాఠం పేరు చెప్పని పండుగకు నిర్దిష్టమైన పేరు చేర్చలేదు.
- source_word: וַיַּעַל עַל הַמִּזְבֵּחַ
  choice: బలిపీఠం దగ్గరకు ఎక్కి వెళ్లాడు
  rationale: ఈ ఆరాధనా సందర్భంలో పదబంధం బలిపీఠం వద్ద సేవ చేయడానికి పైకి వెళ్లడాన్ని సూచించగలదు. బలిపీఠం ఉపరితలంపై నిలిచాడని తప్పనిసరిగా తేల్చకుండా భావాన్ని సహజంగా అందిస్తుంది; మరింత అక్షరార్థ రూపం పాదసూచికలో ఉంది.
- source_word: כֵּן עָשָׂה בְּבֵית אֵל
  choice: బేతేలులో కూడా అలాగే చేశాడు
  rationale: כֵּן ముందున్న చర్యతో సారూప్యాన్ని సూచిస్తుంది. ‘కూడా అలాగే చేశాడు’ తెలుగులో ఆ సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: לְזַבֵּחַ לָעֲגָלִים
  choice: దూడలకు బలులు అర్పిస్తూ
  rationale: లక్ష్యం లేదా అనుబంధ చర్యను సూచించే infinitiveను తెలుగు వాక్యప్రవాహానికి సరిపోయే అసమాపక క్రియారూపంలో అనువదించింది; బలులు దూడలకే అర్పించబడినట్లు నిలుపుతుంది.
- source_word: הָעֲגָלִים
  choice: దూడలు
  rationale: మూలపదానికి అక్షరార్థం ‘దూడలు’. సందర్భంలోని విగ్రహారాధనా తీర్పును నామవాచకంలో అదనంగా చేర్చలేదు.
- source_word: וְהֶעֱמִיד
  choice: నియమించాడు
  rationale: ఆరాధనా సిబ్బందిని ఒక స్థానంలో అధికారికంగా ఉంచిన భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: ఉన్నత పూజాస్థలాల యాజకులు
  rationale: בָּמוֹת అనేది ఎత్తైన లేదా స్థానిక ఆరాధనా స్థలాలను సూచించే సాంప్రదాయిక పదం. ‘ఉన్నత పూజాస్థలాలు’ అర్థాన్ని సాధారణ పాఠకునికి స్పష్టంగా చేస్తుంది.
- source_word: אֲשֶׁר עָשָׂה
  choice: తాను ఏర్పాటు చేసిన
  rationale: ఆ పూజాస్థలాలను యెరోబామే నెలకొల్పాడనే సంబంధాన్ని నిలుపుతుంది; స్థలాల విషయంలో ‘ఏర్పాటు చేసిన’ అనేది ‘చేసిన’ కంటే సహజమైన తెలుగు.
theological_decisions:
- issue: ‘యూదాలో జరిగే పండుగ’ ఏ పండుగను సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో పండుగకు పేరు పెట్టకుండా సాధారణంగానే అనువదించడం.
  alternative: దానిని పర్ణశాలల పండుగగా స్పష్టంగా పేర్కొనడం.
  rationale: సందర్భం ఏడవ నెల పదిహేనవ రోజున జరిగే పర్ణశాలల పండుగను బలంగా సూచించినా, ఈ వచనంలోని హీబ్రూ పాఠం దానికి పేరు పెట్టదు. అందువల్ల ప్రధాన పాఠం ఆ అనిశ్చితిని నిలుపుతుంది; సంభావ్య గుర్తింపు పాదసూచికలో ఇవ్వబడింది.
- issue: యెరోబాము ఆరాధనా ఏర్పాట్లపై మూలపాఠంలోని మూల్యాంకనం
  choice: దూడలను ‘విగ్రహాలు’ అనీ, యాజకులను ‘అక్రమ యాజకులు’ అనీ ప్రధాన పాఠంలో అదనంగా వర్ణించకుండా చర్యలను వివరణాత్మకంగా అనువదించడం.
  alternative: కథనం యొక్క విస్తృత సందర్భాన్ని బట్టి ఖండనాత్మక విశేషణాలను చేర్చడం.
  rationale: విస్తృత కథనం యెరోబాము ఆరాధనా వ్యవస్థను ఖండించినప్పటికీ, ఈ వచనం చర్యలను ప్రధానంగా వివరిస్తుంది. మూలపాఠం చేయని స్పష్టీకరణను అనువాదం జోడించదు.
- issue: וַיַּעַל עַל הַמִּזְבֵּחַలోని עַל యొక్క స్థలార్థం
  choice: ‘బలిపీఠం దగ్గరకు ఎక్కి వెళ్లాడు’ అని ప్రధాన పాఠంలో ఇవ్వడం.
  alternative: ‘బలిపీఠం మీదికి ఎక్కాడు’ అని అక్షరార్థంగా ఇవ్వడం.
  rationale: హీబ్రూ పదబంధం బలిపీఠం వద్దకు/మీదికి ఎక్కడాన్ని సూచించగలదు. సందర్భంలో ఆరాధనా క్రియ నిర్వహించడానికి బలిపీఠం వద్దకు చేరడమే భావం కావచ్చు; భౌతికంగా దాని ఉపరితలంపై ఎక్కాడని నిర్ణయించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. ‘ఉన్నత పూజాస్థలాలు’ వంటి పదం మూలంలోని ఆరాధనా భావాన్ని నిలుపుతూ సాధారణ పాఠకునికి ‘ఉన్నత స్థలాలు’ కంటే స్పష్టంగా ఉంటుంది. పాఠంలో లేని ఖండనాత్మక పదాలు చేర్చబడలేదు.
