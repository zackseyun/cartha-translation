revisions:
- from: యెరోబాము ఎనిమిదవ నెలలో[a], ఆ నెల పదిహేనవ రోజున, యూదాలో జరిగే పండుగలాంటి పండుగను జరిపి, బలిపీఠం దగ్గరకు ఎక్కి వెళ్లాడు[b]. తాను చేసిన దూడలకు బలులు అర్పిస్తూ బేతేలులో కూడా అలాగే చేశాడు. తాను ఏర్పాటు చేసిన ఉన్నత పూజాస్థలాల యాజకులను బేతేలులో నియమించాడు.
  to: యెరోబాము ఎనిమిదవ నెలలో[a], నెల పదిహేనవ రోజున, యూదాలో ఉన్న పండుగలాగే ఒక పండుగను జరిపాడు; అతడు బలిపీఠం పైకి ఎక్కాడు[b]. అతడు బేతేలులో కూడా అలాగే చేసి, తాను చేసిన దూడలకు బలులు అర్పించాడు; తాను ఏర్పాటు చేసిన ఉన్నత పూజాస్థలాల యాజకులను బేతేలులో నియమించాడు.
