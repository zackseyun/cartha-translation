id: 1KI.12.13
reference: 1 Kings 12:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֧עַן הַ/מֶּ֛לֶךְ אֶת הָ/עָ֖ם קָשָׁ֑ה וַֽ/יַּעֲזֹ֛ב אֶת עֲצַ֥ת הַ/זְּקֵנִ֖ים אֲשֶׁ֥ר יְעָצֻֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/013.yaml
  text: And the king answered the people harshly, and he abandoned the counsel of the elders who had advised him.
translation:
  language: te
  text: రాజు ప్రజలకు కఠినంగా జవాబిచ్చాడు; తనకు సలహా ఇచ్చిన పెద్దల సలహాను అతడు పక్కన పెట్టాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: జవాబిచ్చాడు
  rationale: Qal రూపంలోని ענה ఇక్కడ ప్రజల ముందటి అభ్యర్థనకు రాజు ఇచ్చిన ప్రత్యుత్తరాన్ని సూచిస్తుంది; ‘జవాబిచ్చాడు’ సహజమైన కథన భాష.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: సందర్భంలో ఇప్పటికే తెలిసిన రాజును సూచించే నిర్దిష్ట నామవాచకం; తెలుగులో ‘రాజు’ సహజంగా నిర్దిష్ట భావాన్ని అందిస్తుంది.
- source_word: הָעָם
  choice: ప్రజలకు
  rationale: ఇక్కడ עָם రాజును ఉద్దేశించి మాట్లాడిన ఇశ్రాయేలు ప్రజాసమూహాన్ని సూచిస్తుంది. ענה క్రియకు సంబంధించిన ప్రత్యక్ష కర్మను తెలుగులో సహజంగా సంప్రదాన విభక్తితో వ్యక్తం చేశాం.
- source_word: קָשָׁה
  choice: కఠినంగా
  rationale: రాజు జవాబు ఇచ్చిన తీరును తెలిపే క్రియావిశేషణ భావం; ‘కఠినంగా’ తీవ్రతను, నిర్దయమైన ధోరణిని సహజంగా తెలియజేస్తుంది.
- source_word: וַיַּעֲזֹב
  choice: పక్కన పెట్టాడు
  rationale: עזב అంటే విడిచిపెట్టడం లేదా విసర్జించడం. ఈ సందర్భంలో సలహాను అంగీకరించకుండా వదిలేయడాన్ని ‘పక్కన పెట్టాడు’ స్పష్టంగా, ఆధునికంగా తెలియజేస్తుంది.
- source_word: עֲצַת
  choice: సలహాను
  rationale: עֵצָה ఇక్కడ రాజుకు ఇచ్చిన ఆలోచనాపూర్వక సలహాను సూచిస్తుంది; ‘సలహా’ సాధారణ పాఠకులకు స్పష్టమైన ఆధునిక పదం.
- source_word: הַזְּקֵנִים
  choice: పెద్దల
  rationale: ఈ సందర్భంలో זְקֵנִים కేవలం వృద్ధులను కాక, అనుభవజ్ఞులైన గుర్తింపు పొందిన సీనియర్ సలహాదారులను సూచిస్తుంది; ‘పెద్దలు’ ఆ సామాజిక పాత్రను సహజంగా అందిస్తుంది.
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: తనకు సలహా ఇచ్చిన
  rationale: ఈ సంబంధ వాక్యం ఆ పెద్దలు ముందుగా రాజుకు సలహా ఇచ్చారని గుర్తిస్తుంది; తెలుగు భూతకాల కృదంత నిర్మాణం సంఘటనల క్రమాన్ని సహజంగా తెలియజేస్తుంది.
