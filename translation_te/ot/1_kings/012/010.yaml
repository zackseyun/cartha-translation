reference: 1 Kings 12:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבְּר֣וּ אֵלָ֗י/ו הַ/יְלָדִים֙ אֲשֶׁ֨ר גָּדְל֣וּ אִתּ/וֹ֮ לֵ/אמֹר֒ כֹּֽה תֹאמַ֣ר לָ/עָ֣ם הַ/זֶּ֡ה אֲשֶׁר֩ דִּבְּר֨וּ אֵלֶ֜י/ךָ לֵ/אמֹ֗ר אָבִ֨י/ךָ֙ הִכְבִּ֣יד אֶת עֻלֵּ֔/נוּ וְ/אַתָּ֖ה הָקֵ֣ל מֵ/עָלֵ֑י/נוּ כֹּ֚ה תְּדַבֵּ֣ר אֲלֵי/הֶ֔ם קָֽטָנִּ֥/י עָבָ֖ה מִ/מָּתְנֵ֥י אָבִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/010.yaml
  text: 'The young men who had grown up with him spoke to him, saying, “This is what you shall say to this people who spoke to you, saying, ‘Your father made our yoke heavy, but you, make it lighter for us’: this is what you shall say to them, ‘My little finger is thicker than my father’s waist.’”'
translation:
  language: te
  text: 'తనతోపాటు పెరిగిన యువకులు అతనితో ఇలా అన్నారు: “నీతో, ‘నీ తండ్రి మా కాడిని బరువుగా చేశాడు; నువ్వు దాన్ని మాకు తేలిక చేయి’ అని చెప్పిన ఈ ప్రజలతో నువ్వు ఇలా చెప్పాలి: ‘నా చిటికెన వేలు[a] నా తండ్రి నడుముకంటే మందంగా ఉంది.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ పదశః: “నా చిన్నది”; సందర్భాన్ని బట్టి సాధారణంగా “నా చిటికెన వేలు” అని అర్థం చేసుకుంటారు.'
    reason: మూలంలోని సంక్షిప్త శరీరావయవ సూచనలో ఉన్న నిజమైన భాషాపరమైన అస్పష్టతను పాఠకునికి తెలియజేయడం.
lexical_decisions:
- source_word: הַיְלָדִים
  choice: యువకులు
  rationale: ఈ సందర్భంలో రాజుతోపాటు పెరిగి ఇప్పుడు సలహా ఇస్తున్న సమవయస్కులను సూచిస్తుంది; ‘పిల్లలు’ అనడం ఆధునిక తెలుగులో తప్పుదారి పట్టించవచ్చు.
- source_word: עֻלֵּנוּ
  choice: మా కాడిని
  rationale: ‘కాడి’ అనే రూపకం ప్రజలపై మోపిన భారమైన సేవ లేదా పాలనా ఒత్తిడిని మూలంలోని చిత్రంతోనే నిలుపుతుంది.
- source_word: הָקֵל מֵעָלֵינוּ
  choice: దాన్ని మాకు తేలిక చేయి
  rationale: మూలంలోని ఆజ్ఞార్థక భావాన్ని, కాడి భారాన్ని తగ్గించాలనే అభ్యర్థనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: קָטָנִּי
  choice: నా చిటికెన వేలు
  rationale: పదశః ‘నా చిన్నది’ అని ఉన్న సంక్షిప్త శరీరావయవ సూచనను సంప్రదాయంగా, సందర్భానుసారంగా ‘చిటికెన వేలు’గా అర్థం చేసుకుంటారు; సందిగ్ధతను పాదసూచికలో తెలియజేశాం.
- source_word: מָתְנֵי אָבִי
  choice: నా తండ్రి నడుము
  rationale: హీబ్రూ బహువచన రూపం నడుము/నడుము భాగాన్ని సూచిస్తుంది; తెలుగులో ఏకవచన ‘నడుము’ సహజంగా ఉంటుంది.
- source_word: עָבָה
  choice: లావుగా ఉంది
  rationale: పోలికలో ‘మందంగా/లావుగా ఉండడం’ అనే భావం ఉంది; శరీర భాగాల అతిశయోక్తికి ‘లావుగా’ సాధారణ తెలుగు వాడుక.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రజలకు సులభంగా అర్థమయ్యేలా గంభీరమైన కథన శైలిని వాడాం. పునరుక్తమైన ‘ఇలా చెప్పాలి’ నిర్మాణాన్ని మూలంలోని వాక్చాతుర్యానికి అనుగుణంగా నిలిపాం; అంతర్లీన ఉద్ధరణలను స్పష్టంగా ఉంచాం.
