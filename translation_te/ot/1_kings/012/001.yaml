lexical_decisions:
- source_word: כָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలందరూ
  rationale: ‘ఇశ్రాయేలంతా’ అనే అక్షరార్థ రూపం కంటే, ఇక్కడ సమకూడిన సమస్త ఇశ్రాయేలు ప్రజలను సూచించే భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: לְהַמְלִיךְ אֹתוֹ
  choice: అతన్ని రాజుగా చేయడానికి
  rationale: హిఫీల్ క్రియ యొక్క రాజుగా నియమించడం లేదా ప్రకటించడం అనే causative భావాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: రెహబాము షెకెముకు వెళ్లడానికి తరువాతి వాక్యభాగం కారణాన్ని తెలియజేస్తున్నందున కారణార్థాన్ని నిలుపుతుంది.
