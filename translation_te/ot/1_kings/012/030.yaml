source:
  edition: WLC
  text: וַ/יְהִ֛י הַ/דָּבָ֥ר הַ/זֶּ֖ה לְ/חַטָּ֑את וַ/יֵּלְכ֥וּ הָ/עָ֛ם לִ/פְנֵ֥י הָ/אֶחָ֖ד עַד דָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/030.yaml
  text: And this thing became a sin[a], and the people went before the one as far as Dan.
translation:
  language: te
  text: ఈ విషయం పాపంగా మారింది. ప్రజలు దాను వరకు ఆ ఒకదాని ఎదుటికి[a] వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘ఆ ఒకదాని ఎదుటికి’ అని ఉంది. సందర్భాన్ని బట్టి ఇది యరొబాము నిలబెట్టిన రెండు దూడలలో ఒకదాన్ని, ముఖ్యంగా దానులో ఉన్న దూడను, సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: మారింది
  rationale: לְחַטָּאת తో కలిసి ఇది కేవలం ‘ఉంది’ అనే స్థితిని కాక, ‘పాపంగా మారింది’ అనే ఫలితాన్ని సూచిస్తుంది.
- source_word: הַדָּבָר הַזֶּה
  choice: ఈ విషయం
  rationale: דבר ఇక్కడ యరొబాము ఏర్పాటు చేసిన ఆరాధనా వ్యవస్థను సూచిస్తుంది; ‘ఈ విషయం’ దాని విస్తృత భావాన్ని, సూచనార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לְחַטָּאת
  choice: పాపంగా
  rationale: ఇక్కడ חַטָּאת అంటే ‘పాపం’; కథన సందర్భంలో ‘పాపబలి’ అనే అర్థం సరిపోదు. తెలుగు వాక్య నిర్మాణంలో ‘పాపంగా మారింది’ సహజంగా ఉంది.
- source_word: וַיֵּלְכוּ הָעָם
  choice: ప్రజలు ... వెళ్లారు
  rationale: הלך కథనంలో సాధారణంగా ‘వెళ్లారు’ అని అర్థం. మూలంలో లేని ‘ఆరాధించడానికి’ వంటి వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: לִפְנֵי
  choice: ఎదుటికి
  rationale: לפני యొక్క ‘ఎదుట/సన్నిధిలో’ అనే స్థలార్థాన్ని నిలుపుతూ, הלך తో సహజంగా కలిసేలా ‘ఎదుటికి’ అని అనువదించబడింది.
- source_word: הָאֶחָד
  choice: ఆ ఒకదాని
  rationale: హీబ్రూలో నామవాచకం లేకుండా అక్షరార్థంగా ‘ఆ ఒకటి/ఆ ఒకదాని’ అని ఉంది. సందర్భంలో ఇది రెండు దూడలలో ఒకదాన్ని సూచించినా, మూలంలోని సంక్షిప్తతను ప్రధాన పాఠ్యంలో కాపాడింది.
- source_word: עַד דָּן
  choice: దాను వరకు
  rationale: עד ప్రయాణపు చివరి హద్దును సూచిస్తుంది; ‘దాను వరకు’ భౌగోళిక గమ్యాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యరొబాము ఆరాధనా ఏర్పాటు పాపంగా మారిన స్వభావం
  choice: ఈ ఏర్పాటు ‘పాపంగా మారింది’ అని మాత్రమే పేర్కొనడం
  alternative: ఇది ప్రజలు పాపం చేయడానికి కారణమైంది అని విస్తరించి చెప్పడం; లేదా ‘పాపబలి’గా అర్థం చేసుకోవడం
  rationale: సందర్భం అక్రమ విగ్రహారాధనను ఖండిస్తుంది; అయితే ఈ వచనం చెప్పిన దానికంటే విస్తృతమైన సిద్ధాంత వివరణను అనువాదంలో చేర్చకూడదు. חַטָּאת కు ఇక్కడ ‘పాపం’ అనే అర్థమే సందర్భోచితం.
- issue: ‘ఆ ఒకదాని’ యొక్క నిర్దేశ్యం
  choice: మూలంలోని అస్పష్టమైన ‘ఆ ఒకదాని’ అనే రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, అది దూడలలో ఒకదాన్ని—బహుశా దానులోని దూడను—సూచిస్తుందని పాదసూచికలో వివరించడం
  alternative: ప్రధాన పాఠ్యంలోనే ‘ఆ ఒక దూడ ఎదుటికి’ అని నామవాచకాన్ని స్పష్టంగా చేర్చడం
  rationale: הָאֶחָד సంక్షిప్తంగా, కొంత అసాధారణంగా ఉంది. సందర్భం దూడను సూచించినా, మూలంలోని నిజమైన అస్పష్టతను పూర్తిగా తొలగించకుండా పాదసూచిక ద్వారా అర్థసహాయం అందించడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఆ ఒకదాని’ కొంత అసాధారణంగా వినిపించినా, హీబ్రూ మూలంలోని ఉద్దేశపూర్వక సంక్షిప్తతను నిలుపుతూ పాదసూచికతో స్పష్టత ఇచ్చింది.
