  yaml_path: translation/ot/1_kings/012/022.yaml
  text: And the word of God came to Shemaiah the man of God[a], saying,
translation:
  language: te
  text: దేవుని మనుష్యుడైన షెమయాకు దేవుని వాక్యం వచ్చి ఇలా చెప్పింది:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలపాఠంలో ఇక్కడ ‘దేవుని వాక్యం’ అని ఉంది; ఇలాంటి సందర్భాల్లో సాధారణంగా కనిపించే ‘యెహోవా వాక్యం’ అనే పదబంధం కాదు. ఇక్కడ יהוה అనే దైవనామానికి బదులు אֱלֹהִים (‘దేవుడు’) ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... אֶל
  choice: వచ్చి
  rationale: ఈ ప్రవచనాత్మక సూత్రంలో దేవుని వాక్యం ఒక వ్యక్తికి చేరడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వచ్చి’ సహజంగా ఉండి, సంఘటనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: דְּבַר
  choice: వాక్యం
  rationale: దైవిక సమాచారాన్ని సూచించే ఈ సందర్భంలో ‘వాక్యం’ మూలపదానికి దగ్గరగా ఉండి, బైబిలు సంబంధిత భావప్రాధాన్యాన్ని కాపాడుతుంది; ‘సందేశం’ కూడా సాధ్యమే.
- source_word: הָאֱלֹהִים
  choice: దేవుని
  rationale: మూలపాఠంలో దైవనామమైన יהוה కాక אֱלֹהִים ఉంది; అందువల్ల దానిని ‘దేవుని’గా అనువదించాం.
- source_word: שְׁמַעְיָה
  choice: షెమయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు లిపిలో మూల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: ఇది ప్రవక్తగా సేవచేసే వ్యక్తికి వాడే గుర్తింపు పదబంధం; మూలంలోని నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לֵאמֹר
  choice: ఇలా చెప్పింది
  rationale: తరువాతి వచనంలో వచ్చే ప్రత్యక్ష దైవవాక్యాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘ఇలా చెప్పింది’ సహజమైన అనుసంధానం.
theological_decisions:
- issue: ప్రకటన సూత్రంలో אֱלֹהִים అనువాదం
  choice: దేవుడు
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠం ఇక్కడ יהוה అనే దైవనామాన్ని కాక אֱלֹהִים అనే పదాన్ని ఉపయోగిస్తుంది. సాధారణంగా కనిపించే ‘యెహోవా వాక్యం’ అనే సూత్రంతో సమన్వయపరచకుండా మూలంలోని పదాన్నే నిలిపాం.
