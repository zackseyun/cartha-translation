  naturalness: ‘ఈ ప్రజల హృదయం తమ ప్రభువైన యూదా రాజు రెహబాము వైపు తిరుగుతుంది’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంది. రెండు చోట్ల ‘తిరుగు’ వాడకం హీబ్రూ పదపునరుక్తిని తగినంతగా నిలుపుతుంది. సందర్భం వెలుపల ఒకే వచనంగా చూపుతున్నందున జతలేని చివరి ఉద్ధరణ చిహ్నాన్ని తొలగించాలి.
