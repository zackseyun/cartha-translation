id: 1KI.12.27
reference: 1 Kings 12:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִֽם יַעֲלֶ֣ה הָ/עָ֣ם הַ/זֶּ֗ה לַ/עֲשׂ֨וֹת זְבָחִ֤ים בְּ/בֵית יְהוָה֙ בִּ/יר֣וּשָׁלִַ֔ם וְ֠/שָׁב לֵ֣ב הָ/עָ֤ם הַ/זֶּה֙ אֶל אֲדֹ֣נֵי/הֶ֔ם אֶל רְחַבְעָ֖ם מֶ֣לֶךְ יְהוּדָ֑ה וַ/הֲרָגֻ֕/נִי וְ/שָׁ֖בוּ אֶל רְחַבְעָ֥ם מֶֽלֶךְ יְהוּדָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/027.yaml
  text: If this people goes up to offer sacrifices in the house of Yahweh in Jerusalem[a], then the heart of this people will return to their lord, to Rehoboam king of Judah[c][b], and they will kill me and return to Rehoboam king of Judah.
translation:
  language: te
  text: ఈ ప్రజలు యెరూషలేములోని యాహ్వే మందిరంలో[a] బలులు అర్పించడానికి పైకి వెళ్తే, ఈ ప్రజల హృదయం తమ ప్రభువైన[b] యూదా రాజు రెహబాము వైపు తిరుగుతుంది. అప్పుడు వారు నన్ను చంపి, యూదా రాజు రెహబాము వైపు తిరిగిపోతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘యాహ్వే ఇంటిలో’; ఇక్కడ అది యెరూషలేములోని దేవాలయాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: ‘తమ యజమాని’ అని కూడా అనువదించవచ్చు. తరువాతి మాటలు ఇక్కడ రెహబామునే సూచిస్తున్నాయని స్పష్టం చేస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: వెళ్తే
  rationale: సందర్భంలో యెరోబాము భయపడుతున్న షరతును సహజమైన తెలుగు షరతార్థక క్రియారూపంతో వ్యక్తం చేస్తుంది; కాలార్థకమైన ‘వెళ్లినప్పుడు’ అనే భావాన్ని ప్రధాన పాఠంలో స్వీకరించదు.
- source_word: יַעֲלֶה
  choice: పైకి వెళ్తే
  rationale: యెరూషలేముకు తీర్థయాత్రగా ‘పైకి వెళ్లడం’ అనే భౌగోళిక, ఆరాధనా నుడికారాన్ని నిలుపుతుంది.
- source_word: לַעֲשׂוֹת זְבָחִים
  choice: బలులు అర్పించడానికి
  rationale: హీబ్రూ ‘బలులు చేయడం’ అనే నుడికారానికి సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: בְּבֵית יְהוָה
  choice: యెహోవా మందిరంలో
  rationale: ఇక్కడ בַּיִת దేవాలయాన్ని సూచిస్తుంది; ‘మందిరం’ సాధారణ పాఠకునికి స్పష్టంగా ఉండి స్థలార్థక ఉపసర్గను కూడా ప్రతిబింబిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంతో సూచిస్తుంది.
- source_word: וְשָׁב לֵב הָעָם הַזֶּה
  choice: ఈ ప్రజల హృదయం ... వైపు తిరుగుతుంది
  rationale: హృదయం తిరగడం అనే హీబ్రూ రూపకాన్ని నిలుపుతూ, రాజకీయ విధేయత మళ్లడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: తమ ప్రభువైన
  rationale: పదం ప్రభువు లేదా యజమాని అనే అర్థం ఇవ్వగలదు; వెంట వచ్చే రెహబాము అనే ఏకవచన నిర్దేశంతో ‘ప్రభువు’ సరిపోతుంది.
- source_word: רְחַבְעָם מֶלֶךְ יְהוּדָה
  choice: యూదా రాజు రెహబాము
  rationale: తెలుగులో సహజమైన బిరుదు-పేరు క్రమాన్ని ఉపయోగిస్తూ వ్యక్తిని స్పష్టంగా గుర్తిస్తుంది.
- source_word: וַהֲרָגֻנִי
  choice: వారు నన్ను చంపి
  rationale: హרג యొక్క నేరమైన అర్థాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וְשָׁבוּ
  choice: తిరిగిపోతారు
  rationale: ముందటి שׁוב తో ఉన్న పదపునరుక్తిని ‘తిరుగు’ ధాతువుతో నిలుపుతుంది; ‘పోతారు’ గమ్యానికి తిరిగి చేరే భావాన్ని సహజంగా ఇస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవ నామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో మార్చకుండా ఉంచుతుంది; ఆధునిక తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించదగిన రూపాన్ని ఎంచుకుంది.
- issue: ‘హృదయం తిరగడం’ యొక్క రాజకీయ-అంతరంగ భావం
  choice: రూపకాన్ని ‘హృదయం ... వైపు తిరుగుతుంది’గా నిలుపడం
  alternative: ‘విధేయత మళ్లుతుంది’ అని వివరణాత్మకంగా అనువదించడం
  rationale: ఈ మాటలో అంతరంగ మొగ్గు మరియు రాజకీయ విధేయత రెండూ కలిసివున్నాయి; వివరణాత్మక అనువాదం ఆ ఉద్రిక్తతను ఒకే భావానికి పరిమితం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘పైకి వెళ్తే’ ద్వారా యెరూషలేము యాత్రా నుడికారాన్ని, రెండు చోట్ల ‘తిరుగు’ ద్వారా హీబ్రూ పదపునరుక్తిని నిలిపాం. ప్రధాన పాఠంలోని ప్రతి పాదటిప్పణి గుర్తు సంబంధిత పదబంధం వెంట ఉంచబడింది.
