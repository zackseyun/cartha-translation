  edition: WLC
  text: וַ/יָּ֥שֶׂם אֶת הָ/אֶחָ֖ד בְּ/בֵֽית אֵ֑ל וְ/אֶת הָ/אֶחָ֖ד נָתַ֥ן בְּ/דָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/029.yaml
  text: He set one in Bethel[a], and the other he put in Dan.
translation:
  language: te
  text: అతడు ఒకదానిని బేతేలులో[a] ఉంచాడు; మరొకదానిని దానులో ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అంటే, ముందటి వచనంలో చెప్పిన రెండు దూడలలో ఒకదానిని. మరో విధంగా: “అతడు ఒక దూడను బేతేలులో ఉంచాడు; మరొకదానిని దానులో ఉంచాడు.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: ఉంచాడు
  rationale: שׂוּם/שִׂים అనే క్రియకు ‘ఉంచు, పెట్టు, స్థాపించు’ అనే అర్థాలున్నాయి. ఈ స్థలసూచక సందర్భంలో ‘ఉంచాడు’ సహజంగా, మూలానికి సమీపంగా ఉంది.
- source_word: אֶת הָאֶחָד
  choice: ఒకదానిని
  rationale: ముందటి వచనంలో చెప్పిన రెండు దూడలలో ఒకదానిని సూచిస్తుంది. మూలంలో నామవాచకం మళ్లీ లేకపోవడంతో తెలుగులోనూ దానిని చేర్చకుండా, సూచనను స్పష్టంగా ఉంచే సర్వనామ రూపాన్ని వాడాం.
- source_word: בְּבֵית אֵל
  choice: బేతేలులో
  rationale: בְּ అనే ఉపసర్గ ఇక్కడ స్థలాన్ని సూచిస్తుంది; בֵּית אֵל స్థిరపడిన స్థలనామం కాబట్టి దాని అర్థాన్ని అనువదించకుండా ‘బేతేలు’గా లిప్యంతరీకరించాం.
- source_word: וְאֶת הָאֶחָד
  choice: మరొకదానిని
  rationale: అక్షరార్థంగా ‘మరియు ఆ ఒకదానిని’ అయినా, జతలో రెండవదాన్ని సూచించే సహజమైన తెలుగు రూపం ‘మరొకదానిని’.
- source_word: נָתַן
  choice: ఉంచాడు
  rationale: נָתַן సాధారణంగా ‘ఇచ్చు’ అని అర్థమైనప్పటికీ, స్థలసూచక సందర్భంలో ‘పెట్టు/ఉంచు’ అని అర్థం. తెలుగులో క్రియ పునరుక్తి వాక్య సమాంతరతను సహజంగా నిలుపుతుంది.
- source_word: בְּדָן
  choice: దానులో
  rationale: בְּ స్థలాన్ని సూచిస్తుంది; דָן స్థలనామాన్ని తెలుగులో ‘దాను’గా లిప్యంతరీకరించి, ‘లో’ విభక్తిని చేర్చాం.
theological_decisions:
- issue: ‘ఒకదానిని’, ‘మరొకదానిని’ అనే పదాల పూర్వపదం
  choice: ఈ వచనంలో వస్తువును ‘దూడ’ అని మళ్లీ చేర్చకుండా, ముందటి వచనంలోని రెండు దూడలను సూచించే మూలభాషా అధ్యాహారాన్ని నిలుపుకున్నాం.
  alternative: ‘అతడు ఒక దూడను బేతేలులో ఉంచాడు; మరొకదానిని దానులో ఉంచాడు.’
  rationale: సందర్భం పూర్వపదాన్ని స్పష్టం చేసినప్పటికీ, హెబ్రీ మూలం ఈ వచనంలో ‘దూడ’ అనే నామవాచకాన్ని పునరుక్తి చేయదు. ప్రధాన పాఠంలో దాన్ని సరఫరా చేయకుండా ఉండటం మూలంలోని సంక్షిప్తతను, సూచనను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని రెండు సమాంతర భాగాలను నిలుపుతూ, తెలుగులో సహజమైన ‘ఒకదానిని—మరొకదానిని’ నిర్మాణాన్ని ఉపయోగించాం.
