  text: So Israel has rebelled against the house of David to this day[a].
translation:
  language: te
  text: ఈ విధంగా ఇశ్రాయేలు దావీదు వంశానికి వ్యతిరేకంగా నేటివరకు తిరుగుబాటులో ఉంది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “ఈ విధంగా ఇశ్రాయేలు దావీదు వంశానికి వ్యతిరేకంగా నేటివరకు తిరుగుబాటు చేసింది.”'
    reason: కథన క్రియను గతకాలంలో ఉంచే ప్రత్యామ్నాయాన్ని చూపుతూ, ‘నేటివరకు’ అనే కాలవ్యాప్తి పదబంధంలోని కొనసాగింపు భావాన్ని పాఠకుడు పరిశీలించేందుకు వీలు కల్పిస్తుంది.
lexical_decisions:
- source_word: וַיִּפְשְׁעוּ
  choice: తిరుగుబాటు చేసి ... అలాగే ఉంది
  rationale: రాజకీయ సందర్భంలో פשע సాధారణ పాపాన్ని కాకుండా రాజవంశ అధికారానికి వ్యతిరేకంగా తిరుగుబాటు చేయడాన్ని సూచిస్తుంది. ‘తిరుగుబాటు చేసి’ కథనంలోని సంఘటనను తెలియజేస్తే, ‘నేటివరకు అలాగే ఉంది’ దాని కొనసాగుతున్న స్థితిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: హీబ్రూ నామాన్ని అలాగే నిలిపింది. ఈ సందర్భంలో అది దావీదు వంశానికి భిన్నంగా నిలిచిన ఉత్తర గోత్రాల సమూహాన్ని సూచిస్తుంది; ‘ఇశ్రాయేలీయులు’ అని విప్పి చెప్పడం కంటే ‘ఇశ్రాయేలు’ మూలానికి దగ్గరగా ఉంటుంది.
- source_word: בְּבֵית דָּוִד
  choice: దావీదు వంశంపై
  rationale: פשעతో వచ్చిన ב తిరుగుబాటు ఎవరికి వ్యతిరేకమో సూచిస్తుంది. בֵּית דָּוִד ఇక్కడ భౌతిక గృహాన్ని కాకుండా దావీదు రాజవంశాన్ని సూచిస్తుంది; అందువల్ల ‘దావీదు వంశంపై’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటివరకు
  rationale: వివరించిన సంఘటన ఫలితం రచయిత కాలం వరకూ కొనసాగిందని తెలిపే ప్రామాణిక హీబ్రూ నుడికారానికి ఇది సహజమైన ఆధునిక తెలుగు సమానం.
