translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించింది. ‘దావీదు ఇల్లు’ అనే అపార్థసాధ్యమైన అక్షరానువాదానికి బదులుగా రాజవంశార్థాన్ని స్పష్టం చేసే ‘దావీదు వంశం’ వాడింది.
