translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. మూలంలోని ఉల్లేఖన పరిచయాన్ని తెలుగులో సహజంగా ఉండేందుకు వాక్యారంభానికి మార్చినా, సంఘటనల క్రమం మరియు భావసంబంధం యథాతథంగా ఉంచబడ్డాయి.
