  yaml_path: translation/ot/1_kings/012/012.yaml
  text: So Jeroboam and all the people came to Rehoboam on the third day[a], just as the king had spoken, saying, “Return to me on the third day.”
translation:
  language: te
  text: యెరోబాము మరియు ప్రజలందరూ మూడవ రోజున రెహబాము దగ్గరకు వచ్చారు; రాజు, “మూడవ రోజున నా దగ్గరకు తిరిగి రండి” అని చెప్పినట్లుగా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: వచ్చారు
  rationale: בוא అనే క్రియ సందర్భాన్ని బట్టి ‘వచ్చు’ లేదా ‘వెళ్లు’ అనే అర్థం ఇవ్వగలదు. ఇక్కడ వారు రెహబాము దగ్గరకు చేరడాన్ని తెలుగులో సహజంగా ‘వచ్చారు’ అని వ్యక్తం చేశాం.
- source_word: יָרָבְעָם
  choice: యెరోబాము
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపం.
- source_word: וְכָל הָעָם
  choice: ప్రజలందరూ
  rationale: ఆ రాజును అభ్యర్థించిన ప్రజాసమూహమంతటినీ సూచించే సహజమైన ఆధునిక తెలుగు పదబంధం.
- source_word: אֶל־רְחַבְעָם
  choice: రెహబాము దగ్గరకు
  rationale: אֶל వ్యక్తివైపు గమనాన్ని సూచిస్తుంది; ‘దగ్గరకు’ తెలుగులో ఆ దిశను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: మూడవ రోజున
  rationale: హీబ్రూ కాలసూచక పదబంధానికి నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: כַּאֲשֶׁר דִּבֶּר הַמֶּלֶךְ
  choice: రాజు ... అని చెప్పిన ప్రకారం
  rationale: ప్రజల రాక రాజు ముందుగా ఇచ్చిన ఆదేశానికి అనుగుణంగా జరిగిందనే సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: שׁוּבוּ אֵלַי
  choice: నా దగ్గరకు తిరిగి రండి
  rationale: שׁוב లోని తిరిగి రావడం అనే భావాన్ని నిలుపుతూ, రాజు పలికిన ఆదేశంగా గౌరవప్రదమైన బహువచన రూపాన్ని వాడాం.
