revisions:
- from: అతడు ఉన్నత స్థలాల మందిరాన్ని నిర్మించాడు[a]. లేవి కుమారుల్లోనివారు కానివారిని ప్రజల్లోని అన్ని వర్గాల నుండి యాజకులుగా నియమించాడు[b].
  to: అతడు ఉన్నత స్థలాల కోసం ఒక మందిరాన్ని నిర్మించాడు[a], మరియు ప్రజలందరిలో నుండి లేవి కుమారులకు చెందనివారిని యాజకులుగా నియమించాడు[b].
  rationale: The revision replaces an unnecessarily specific reference to ‘all classes’ with a direct expression for selection from the populace at large, and smooths the high-place construct phrase for modern Telugu. It retains the singular ‘one shrine/house,’ the non-Levitical qualification, and the source's non-polemical historical description.
