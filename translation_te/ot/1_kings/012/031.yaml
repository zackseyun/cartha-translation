source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ אֶת בֵּ֣ית בָּמ֑וֹת וַ/יַּ֤עַשׂ כֹּֽהֲנִים֙ מִ/קְצ֣וֹת הָ/עָ֔ם אֲשֶׁ֥ר לֹֽא הָי֖וּ מִ/בְּנֵ֥י לֵוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/031.yaml
  text: He made houses of high places[a], and he appointed priests from among all the people[b], who were not from the sons of Levi.
translation:
  language: te
  text: అతడు ఉన్నత స్థలాల కోసం ఒక మందిరాన్ని నిర్మించాడు[a], మరియు ప్రజలందరిలో నుండి లేవి కుమారులకు చెందనివారిని యాజకులుగా నియమించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, ‘ఉన్నత స్థలాల ఇల్లు’; ఇది ఉన్నత స్థలాలతో సంబంధమున్న ఆరాధనా మందిరాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘లేవీయులు కానివారిని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: నిర్మించాడు / నియమించాడు
  rationale: עשה అనే విస్తృతార్థక క్రియ రెండు ఉపవాక్యాల్లోనూ వచ్చింది. నిర్మాణానికి సంబంధించి ‘నిర్మించాడు’, యాజకుల ఏర్పాటుకు సంబంధించి ‘నియమించాడు’ అని సందర్భానుసారంగా సహజమైన తెలుగులో అందించాం.
- source_word: בֵּית בָּמוֹת
  choice: ఉన్నత స్థలాల మందిరం
  rationale: అక్షరార్థంగా ‘ఉన్నత స్థలాల ఇల్లు’; ఆరాధనకు సంబంధించిన మందిరం లేదా పవిత్రస్థలం అనే నుడికారార్థాన్ని ‘మందిరం’ తెలియజేస్తుంది. హెబ్రీలోని ఏకవచన రూపాన్ని నిలిపాం.
- source_word: כֹּהֲנִים
  choice: యాజకులు
  rationale: ఆరాధనా సందర్భంలో כהניםకు సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: מִקְצוֹת הָעָם
  choice: ప్రజల్లోని అన్ని వర్గాల నుండి
  rationale: ఈ నుడికారం ప్రజల అంచులు అని భౌగోళికంగా కాక, ప్రజాసమూహం అంతటిలోని వివిధ వర్గాల నుండి ఎంపిక చేయడాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר לֹא הָיוּ מִבְּנֵי לֵוִי
  choice: లేవి కుమారుల్లోనివారు కానివారిని
  rationale: ‘లేవి కుమారులు’ అనే హెబ్రీ వంశపరమైన వ్యక్తీకరణను స్పష్టమైన ఆధునిక తెలుగులో నిలిపి, వారు లేవీయ వంశానికి చెందనివారని తెలియజేస్తుంది.
theological_decisions:
- issue: యరొబాము ఏర్పాటు చేసిన అనధికార ఆరాధనా స్థలాల వర్ణన
  choice: ఉన్నత స్థలాల మందిరం
  alternative: ఉన్నత స్థలాల ఆలయం; ఉన్నత స్థలాల కోసం ఒక మందిరం
  rationale: వాక్యం ఆరాధనా నిర్మాణాన్ని వర్ణిస్తుంది; దాని గురించి మూలంలో లేని అదనపు తీర్పును చేర్చకుండా బֵּית בָּמוֹת యొక్క ఆరాధనా భావాన్ని తెలియజేస్తుంది.
- issue: యాజకుల లేవీయేతర స్థితి
  choice: లేవి కుమారుల్లోనివారు కానివారు
  alternative: లేవీయులు కానివారు
  rationale: హెబ్రీలోని వంశపరమైన రూపాన్ని కాపాడుతూ, యాజకులు లేవి సంతతికి చెందనివారనే చారిత్రక-ఆరాధనా భేదాన్ని అదనపు సిద్ధాంత వివరణ లేకుండా తెలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. పొడవైన హెబ్రీ సమన్వయ వాక్యాన్ని తెలుగులో సహజంగా చదవడానికి రెండు వాక్యాలుగా విభజించాం; భావసంబంధం యథాతథంగా ఉంది.
