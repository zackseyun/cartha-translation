translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. ‘వెట్టిచాకిరి’ నిర్బంధ రాజశ్రమను స్పష్టంగా తెలియజేస్తుంది. హీబ్రూ కథనంలోని వరుస ‘రాళ్లు రువ్వారు; అతడు చనిపోయాడు’ అని విడిగా నిలుపబడింది; הִתְאַמֵּץ లోని స్వీయప్రయత్నం మరియు సందర్భంలోని తొందర—రెండింటినీ ప్రధాన పాఠం, పాదటిప్పణి కలిసి సంరక్షిస్తాయి.
