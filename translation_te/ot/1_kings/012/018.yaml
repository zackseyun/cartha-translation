source:
  edition: WLC
  text: וַ/יִּשְׁלַ֞ח הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם אֶת אֲדֹרָם֙ אֲשֶׁ֣ר עַל הַ/מַּ֔ס וַ/יִּרְגְּמ֨וּ כָל יִשְׂרָאֵ֥ל בּ֛/וֹ אֶ֖בֶן וַ/יָּמֹ֑ת וְ/הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם הִתְאַמֵּץ֙ לַ/עֲל֣וֹת בַּ/מֶּרְכָּבָ֔ה לָ/נ֖וּס יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/018.yaml
  text: Then King Rehoboam sent Adoram[a], who was over the forced labor, and all Israel stoned him with stones, and he died[c][b]. And King Rehoboam made haste to get up into the chariot to flee to Jerusalem.
translation:
  language: te
  text: అప్పుడు రాజైన రెహబాము వెట్టిచాకిరి పనుల పర్యవేక్షకుడైన అదోరామును[a] పంపాడు. ఇశ్రాయేలీయులందరూ అతనిమీద రాళ్లు రువ్వారు, అతడు చనిపోయాడు[b]. రాజైన రెహబాము యెరూషలేముకు పారిపోవడానికి తొందరపడి రథమెక్కాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘అదోరాము’; సంబంధిత కొన్ని వచనాల్లో ఈ పేరు ‘అదోనీరాము’ అనే రూపంలో ఉంది.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘అతనిని రాళ్లతో రాళ్లు రువ్వారు’ అని రాళ్లను స్పష్టంగా ప్రస్తావించే నిర్మాణం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, మరింత అక్షరార్థంగా, ‘రథమెక్కడానికి తనను తాను బలపరచుకున్నాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: పంపాడు
  rationale: שלח అనే సాధారణ కథన క్రియను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: אֲדֹרָם
  choice: అదోరాము
  rationale: మసొరెటిక్ పాఠంలో ఉన్న పేరురూపాన్నే ప్రధాన పాఠంలో ఉంచింది; సంబంధిత చోట్ల కనిపించే ‘అదోనీరాము’ రూపాన్ని పాదటిప్పణిలో తెలిపింది.
- source_word: אֲשֶׁר עַל הַמַּס
  choice: వెట్టిచాకిరి పనులకు అధిపతిగా ఉన్న
  rationale: מַס ఇక్కడ నగదు పన్నును కాకుండా రాజ్యం విధించిన నిర్బంధ శ్రమను సూచిస్తుంది; ‘వెట్టిచాకిరి’ దాని బలవంతపు స్వభావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיִּרְגְּמוּ ... אֶבֶן
  choice: అతనిపై రాళ్లు రువ్వారు
  rationale: హీబ్రూ ప్రయోగంలోని రాళ్లతో కొట్టే స్పష్టమైన చర్యను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరూ
  rationale: ఈ సందర్భంలోని సామూహిక రాజకీయ సమూహాన్ని సాధారణ తెలుగు పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיָּמֹת
  choice: అతడు చనిపోయాడు
  rationale: రాళ్లు రువ్విన తరువాతి ఫలితాన్ని హీబ్రూ కథన క్రమం ప్రకారమే ప్రత్యేక ఉపవాక్యంగా ఉంచుతుంది.
- source_word: הִתְאַמֵּץ
  choice: తన శక్తిని కూడగట్టుకున్నాడు
  rationale: אמץ హిత్పయేల్ రూపంలోని స్వీయప్రయత్నం లేదా తనను తాను బలపరచుకోవడం అనే భావాన్ని కాపాడుతూ తెలుగులో అర్థవంతంగా ఉంది; సందర్భంలోని తొందర భావాన్ని పాదటిప్పణి సూచిస్తుంది.
- source_word: לַעֲלוֹת בַּמֶּרְכָּבָה
  choice: రథమెక్కేందుకు
  rationale: రథంలోకి ఎక్కడం అనే దిశాత్మక భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לָנוּס יְרוּשָׁלָם
  choice: యెరూషలేముకు పారిపోవడానికి
  rationale: נוּס లోని ప్రమాదం నుంచి పలాయనం చేసే భావాన్ని ‘పారిపోవడం’ స్పష్టంగా తెలియజేస్తుంది.
