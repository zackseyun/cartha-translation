source:
  edition: WLC
  text: וַ/יַּ֣רְא כָּל יִשְׂרָאֵ֗ל כִּ֠י לֹֽא שָׁמַ֣ע הַ/מֶּלֶךְ֮ אֲלֵי/הֶם֒ וַ/יָּשִׁ֣בוּ הָ/עָ֣ם אֶת הַ/מֶּ֣לֶךְ דָּבָ֣ר לֵ/אמֹ֡ר מַה לָּ/נוּ֩ חֵ֨לֶק בְּ/דָוִ֜ד וְ/לֹֽא נַחֲלָ֣ה בְּ/בֶן יִשַׁ֗י לְ/אֹהָלֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל עַתָּ֕ה רְאֵ֥ה בֵיתְ/ךָ֖ דָּוִ֑ד וַ/יֵּ֥לֶךְ יִשְׂרָאֵ֖ל לְ/אֹהָלָֽי/ו־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/016.yaml
  text: When all Israel saw that the king had not listened to them[a], the people answered the king, saying, “What share do we have in David? We have no inheritance in the son of Jesse. To your tents, O Israel! Now see to your own house[b], David.” So Israel went to their tents.
translation:
  language: te
  text: 'రాజు తమ మాట వినలేదని ఇశ్రాయేలీయులందరూ గ్రహించినప్పుడు, ప్రజలు రాజుకు ఇలా జవాబిచ్చారు: “దావీదులో మనకు భాగమేముంది? యెష్షయి కుమారునిలో మనకు స్వాస్థ్యమేమీ లేదు. ఇశ్రాయేలూ, మీ మీ గుడారాలకు వెళ్లండి![a] దావీదూ, ఇక నీ సొంత ఇంటి సంగతి నువ్వే చూసుకో![b]” అప్పుడు ఇశ్రాయేలు ప్రజలు తమ తమ గుడారాలకు వెళ్లిపోయారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా “మీ మీ గుడారాలకు” అని ఉంది. ఇది ఎవరి నివాసాలకు వారు వెళ్లిపోవడాన్నే కాక, రాజుకు తమ విధేయతను ఉపసంహరించుకోవడాన్నీ సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: 'ఇక్కడ “ఇల్లు” అనే మాట “కుటుంబం” లేదా “రాజవంశం” అనే అర్థాన్నీ కలిగి ఉండవచ్చు: “దావీదూ, ఇక నీ సొంత రాజవంశం సంగతి నువ్వే చూసుకో!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: గ్రహించినప్పుడు
  rationale: ראה ఇక్కడ కేవలం కంటితో చూడడం కాక, రాజు తమ విజ్ఞప్తిని తిరస్కరించాడని గుర్తించడం అనే సందర్భార్థాన్ని కలిగి ఉంది.
- source_word: כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరూ
  rationale: జాతి సమూహాన్ని సూచించే హెబ్రీ సమష్టి ప్రయోగాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֹא שָׁמַע ... אֲלֵיהֶם
  choice: తమ మాట వినలేదు
  rationale: שׁמע + אֶל అంటే శబ్దం వినడం మాత్రమే కాక, విజ్ఞప్తిని ఆలకించి అంగీకరించడం; తెలుగు ‘మాట వినడం’ ఈ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וַיָּשִׁבוּ הָעָם אֶת־הַמֶּלֶךְ דָּבָר
  choice: ప్రజలు రాజుకు ఇలా జవాబిచ్చారు
  rationale: ‘ఒక మాటను తిరిగి ఇచ్చారు’ అనే హెబ్రీ నుడికారాన్ని సహజమైన తెలుగు ప్రత్యుత్తర రూపంలో అనువదిస్తుంది.
- source_word: מַה לָּנוּ חֵלֶק בְּדָוִד
  choice: దావీదులో మనకు భాగమేముంది?
  rationale: חֵלֶק యొక్క ‘భాగం/వాటా’ భావాన్ని నిలుపుతూ దావీదు వంశంతో రాజకీయ సంబంధాన్ని తిరస్కరించే నినాద స్వరాన్ని కాపాడుతుంది.
- source_word: וְלֹא נַחֲלָה בְּבֶן־יִשַׁי
  choice: యెష్షయి కుమారునిలో మనకు స్వాస్థ్యమేమీ లేదు
  rationale: נַחֲלָה లోని వారసత్వం, గోత్ర స్వాధీనం అనే ప్రతిధ్వనులను ‘స్వాస్థ్యం’ నిలుపుతుంది; ‘యెష్షయి కుమారుడు’ అనే సంబోధనలోని తిరస్కార ధోరణినీ కాపాడుతుంది.
- source_word: לְאֹהָלֶיךָ יִשְׂרָאֵל
  choice: ఇశ్రాయేలూ, మీ మీ గుడారాలకు వెళ్లండి!
  rationale: ‘గుడారాలకు’ అనే మూల చిత్రాన్ని నిలుపుతూ, చెదరిపోయి రాజవంశానికి విధేయతను ఉపసంహరించుకోవాలనే పిలుపును సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: עַתָּה רְאֵה בֵיתְךָ דָּוִד
  choice: దావీదూ, ఇక నీ సొంత ఇంటి సంగతి నువ్వే చూసుకో!
  rationale: ראה యొక్క ‘శ్రద్ధ వహించు/చూసుకో’ భావాన్ని అందిస్తూ, בַּיִת లోని ఇల్లు–కుటుంబం–రాజవంశం అనే బహుఅర్థతను ‘ఇంటి’ ద్వారా నిలుపుతుంది.
- source_word: וַיֵּלֶךְ יִשְׂרָאֵל לְאֹהָלָיו
  choice: ఇశ్రాయేలు ప్రజలు తమ తమ గుడారాలకు వెళ్లిపోయారు
  rationale: సమష్టి ఏకవచనమైన ‘ఇశ్రాయేలు’ను తెలుగులో స్పష్టంగా చేసి, ముందటి నినాదంలోని ‘గుడారాలు’ అనే పదాన్ని పునరావృతం చేస్తుంది.
theological_decisions:
- issue: దావీదు ఇంటికి వ్యతిరేకమైన రాజకీయ నినాదం
  choice: రెహబాము మరియు దావీదు రాజవంశంపై విధేయతను తిరస్కరించే రాజకీయ తిరుగుబాటుగా సూటిగా అనువదించడం
  alternative: దీనిని దావీదు నిబంధనకు లేదా మెస్సీయ ఆశకు వ్యతిరేకమైన స్పష్టమైన ధార్మిక ప్రకటనగా విస్తరించడం
  rationale: వచనం చారిత్రక విభజనను వర్ణిస్తుంది. తిరుగుబాటు తీవ్రతను నిలుపుతూ, మూలపాఠం చెప్పని తరువాతి ధార్మిక తీర్పును అనువాదంలో చేర్చలేదు.
- issue: בֵיתְךָ పదంలోని అర్థ విస్తృతి
  choice: ‘నీ సొంత ఇంటి’ అని ఉంచి కుటుంబం/రాజవంశం అనే భావసంభావ్యతను పాదటిప్పణిలో తెలియజేయడం
  alternative: ప్రధాన పాఠంలోనే ‘నీ రాజవంశం’ అని ఏకార్థంగా అనువదించడం
  rationale: సందర్భంలో రాజవంశ భావం బలంగా ఉన్నప్పటికీ, హెబ్రీ ‘ఇల్లు’ అనే రూపకంలోని ఉద్దేశపూర్వక బహుఅర్థతను పూర్తిగా తొలగించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. ప్రజల రాజకీయ నినాదంలోని తీవ్రత కోసం ప్రత్యక్ష సంబోధనలు, ప్రశ్నలు నిలుపబడ్డాయి. ‘భాగం—స్వాస్థ్యం’ అనే సమాంతర పదజాలం మరియు ‘గుడారాలు’ అనే మూలచిత్రం సంరక్షించబడ్డాయి.
