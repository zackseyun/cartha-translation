source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר אֲלֵי/הֶ֗ם כַּ/עֲצַ֤ת הַ/יְלָדִים֙ לֵ/אמֹ֔ר אָבִ/י֙ הִכְבִּ֣יד אֶֽת עֻלְּ/כֶ֔ם וַ/אֲנִ֖י אֹסִ֣יף עַֽל עֻלְּ/כֶ֑ם אָבִ֗/י יִסַּ֤ר אֶתְ/כֶם֙ בַּ/שּׁוֹטִ֔ים וַ/אֲנִ֕י אֲיַסֵּ֥ר אֶתְ/כֶ֖ם בָּ/עַקְרַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/014.yaml
  text: He spoke to them according to the advice of the young men[a], saying, “My father made your yoke heavy, and I will add to your yoke. My father disciplined you with whips, but I will discipline you with scorpions.”
translation:
  language: te
  text: 'అతడు యువకుల సలహా ప్రకారం వారితో ఇలా అన్నాడు: “నా తండ్రి మీ కాడిని బరువుగా చేశాడు; నేను మీ కాడికి మరింత బరువు చేర్చుతాను. నా తండ్రి మిమ్మల్ని కొరడాలతో శిక్షించాడు; నేనైతే మిమ్మల్ని తేళ్లతో[a] శిక్షిస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తేలు-కొరడాలతో”; అంటే పదునైన మొనలు లేదా ముళ్లు గల కొరడాలతో కావచ్చు. హీబ్రూలో అక్షరార్థంగా “తేళ్లతో” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: వారితో ఇలా అన్నాడు
  rationale: דבר పియేల్ రూపానికి ప్రాథమికంగా ‘మాట్లాడు’ అనే అర్థం ఉంది. ఈ సందర్భంలో రాజు ప్రజలకు పలికిన మాటలను సహజమైన ఆధునిక తెలుగులో ‘ఇలా అన్నాడు’ అని వ్యక్తపరచడం సముచితం.
- source_word: כַּעֲצַת הַיְלָדִים
  choice: యువకుల సలహా ప్రకారం
  rationale: עֵצָה అంటే సలహా; כ ఉపసర్గ ‘ప్రకారం’ అనే భావాన్ని ఇస్తుంది. הַיְלָדִים ఇక్కడ పెద్దలతో వ్యత్యాసంగా నిలిచిన యువ సలహాదారులను సూచిస్తుంది కాబట్టి ‘యువకులు’ సహజం.
- source_word: הִכְבִּיד אֶת עֻלְּכֶם
  choice: మీ కాడిని బరువుగా చేశాడు
  rationale: כבד హిఫీల్ రూపంలోని ‘బరువుగా చేయు’ భావాన్నీ, עֹל యొక్క స్పష్టమైన కాడి రూపకాన్నీ నిలుపుతుంది.
- source_word: אֹסִיף עַל עֻלְּכֶם
  choice: మీ కాడికి మరింత బరువు చేర్చుతాను
  rationale: יסף על అక్షరార్థంగా ‘దానికి చేర్చు.’ తెలుగులో కేవలం ‘కాడికి చేర్చుతాను’ అసంపూర్ణంగా వినిపించవచ్చు కాబట్టి సందర్భంలో అంతర్లీనమైన ‘బరువు’ను స్పష్టంచేస్తూ రూపకాన్ని నిలిపాం.
- source_word: יִסַּר / אֲיַסֵּר
  choice: శిక్షించాడు / శిక్షిస్తాను
  rationale: יסרకు క్రమశిక్షణ పెట్టడం, దండించడం, శిక్షించడం అనే పరిధి ఉంది. కొరడాల ద్వారా బలవంతపు దండనను సూచించే ఈ రాజసంబంధ సందర్భంలో ‘శిక్షించు’ సాధారణ పాఠకునికి సహజంగా, కచ్చితంగా ఉంటుంది.
- source_word: בַּשּׁוֹטִים
  choice: కొరడాలతో
  rationale: שׁוֹט అనేది కొరడా లేదా చర్నాకోలును సూచిస్తుంది; ‘కొరడాలు’ ఆధునిక తెలుగులో స్పష్టమైన సమానార్థకం.
- source_word: בָּעַקְרַבִּים
  choice: తేళ్లతో
  rationale: హీబ్రూ పదం అక్షరార్థంగా ‘తేళ్లు’ అని చెబుతుంది. ముళ్లు లేదా పదునైన మొనలు గల కొరడాలను సూచించే అవకాశం ఉన్నా, మూలంలోని స్పష్టమైన చిత్రాన్ని ప్రధాన పాఠ్యంలో నిలిపి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: ‘తేళ్లు’ అనే శిక్షా చిత్ర స్వభావం
  choice: ప్రధాన పాఠ్యంలో అక్షరార్థమైన ‘తేళ్లతో’ను నిలుపడం
  alternative: ‘తేలు-కొరడాలతో’ లేదా ‘ముళ్ల కొరడాలతో’ అని వివరణాత్మకంగా అనువదించడం
  rationale: עקרבים అనే నామవాచకం నిజంగా ‘తేళ్లు’ అని ఉంటుంది; అది ప్రత్యేకమైన ముళ్ల కొరడాలకు రూపకంగా వాడబడి ఉండవచ్చు. మూలంలోని నిజమైన అర్థసందిగ్ధతను ప్రధాన పాఠ్యంలో ముందుగానే పరిష్కరించకుండా, సాధ్యమైన సాధనార్థాన్ని పాదసూచికలో తెలియజేయడం మూలభాషకు పారదర్శకంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘కాడి’ అనే మూల రూపకాన్ని నిలిపాం. మొదటి వాక్యంలో హీబ్రూ వరుస భావాన్ని సెమీకోలన్‌తో చూపించాం; రెండవ వాక్యంలో וַאֲנִי యొక్క బలమైన వ్యత్యాసాన్ని ‘నేనైతే’తో సహజంగా వ్యక్తపరచాం.
