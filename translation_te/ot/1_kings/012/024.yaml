source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֡ה לֹֽא תַעֲלוּ֩ וְ/לֹא תִלָּ֨חֲמ֜וּ/ן עִם אֲחֵי/כֶ֣ם בְּנֵֽי יִשְׂרָאֵ֗ל שׁ֚וּבוּ אִ֣ישׁ לְ/בֵית֔/וֹ כִּ֧י מֵ/אִתִּ֛/י נִהְיָ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/יִּשְׁמְעוּ֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יָּשֻׁ֥בוּ לָ/לֶ֖כֶת כִּ/דְבַ֥ר יְהוָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/024.yaml
  text: 'Thus says Yahweh: ‘Do not go up or fight against your brothers[a], the sons of Israel. Return, each man to his house[c][b], for this thing is from me.’ So they listened to the word of Yahweh and turned back to go according to the word of Yahweh.'
translation:
  language: te
  text: 'యెహోవా ఇలా అంటున్నాడు: ‘మీరు పైకి వెళ్లవద్దు; మీ సోదరులైన ఇశ్రాయేలు కుమారులతో యుద్ధం చేయవద్దు.[a] ప్రతి ఒక్కరూ తన ఇంటికి తిరిగి వెళ్లండి. ఎందుకంటే ఈ విషయం నా నుంచే జరిగింది.’ వారు యెహోవా మాట విని, యెహోవా మాట ప్రకారం వెనుదిరిగి వెళ్లారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, ‘మీ సోదరులతో, ఇశ్రాయేలు కుమారులతో.’ ఇక్కడ ‘యుద్ధం చేయడం’ అనే క్రియతో ‘తో’ అనేది వారికి వ్యతిరేకంగా పోరాడడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: యెహోవా ఇలా అంటున్నాడు
  rationale: ప్రవక్త ద్వారా వచ్చే సందేశ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతూ, యెహోవా అనే దైవనామాన్ని ప్రత్యక్షంగా ఉంచింది.
- source_word: לֹא תַעֲלוּ וְלֹא תִלָּחֲמוּן
  choice: మీరు వెళ్లి ... యుద్ధం చేయవద్దు
  rationale: עלה ఇక్కడ సైనికంగా ముందుకు వెళ్లడాన్ని సూచిస్తుంది; తెలుగులో ‘పైకి వెళ్లవద్దు’ అనడం సందర్భాన్ని మసకబార్చగలదు. రెండు నిషేధాలను ఒక సహజ వాక్యంగా కలిపింది.
- source_word: עִם אֲחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: మీ సోదరులైన ఇశ్రాయేలీయులతో
  rationale: לחם తో עִם ప్రత్యర్థిని సూచిస్తుంది; తెలుగులో ‘వారితో యుద్ధం’ సహజంగానే ‘వారికి వ్యతిరేకంగా’ అనే భావాన్ని ఇస్తుంది. ‘సోదరులు’ అనే బంధుత్వ భాషను నిలిపింది.
- source_word: שׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: ప్రతి ఒక్కరూ తమ తమ ఇంటికి తిరిగి వెళ్లండి
  rationale: אִישׁ యొక్క పంపిణీ భావాన్ని సహజమైన తెలుగు ‘ప్రతి ఒక్కరూ తమ తమ’ ద్వారా వ్యక్తం చేసింది.
- source_word: כִּי מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: ఎందుకంటే ఈ విషయం నా నుంచే జరిగింది
  rationale: מֵאִתִּי యొక్క మూలం/కారణ సంబంధాన్ని కాపాడుతూ, నִהְיָה యొక్క ‘జరిగింది’ భావాన్ని ఉంచింది; దైవ కారణత్వాన్ని మూలానికి మించి వివరించలేదు.
- source_word: וַיִּשְׁמְעוּ אֶת דְּבַר יְהוָה
  choice: వారు యెహోవా మాట విని
  rationale: שׁמע లోని వినడం మరియు విధేయత అనే రెండు సాధ్య ఛాయలను ‘విని’ నిలుపుతుంది; తరువాతి చర్య విధేయతను స్పష్టం చేస్తుంది.
- source_word: וַיָּשֻׁבוּ לָלֶכֶת כִּדְבַר יְהוָה
  choice: యెహోవా మాట ప్రకారం వెనుదిరిగి వెళ్లారు
  rationale: שׁוב మరియు הלך రెండింటి భావాన్ని ‘వెనుదిరిగి వెళ్లారు’ ద్వారా సహజంగా నిలిపి, ఆ చర్య దేవుని మాటకు అనుగుణమని స్పష్టం చేసింది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: హీబ్రూ పాఠంలోని ప్రత్యేక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపంలో ఉంచింది.
- issue: אֲחֵיכֶם లోని బంధుత్వ భావం
  choice: మీ సోదరులైన ఇశ్రాయేలీయులు
  alternative: మీ తోటి ఇశ్రాయేలీయులు
  rationale: అంతర్యుద్ధం తమ సొంత బంధువులపై జరిగేదనే వాక్యంలోని నైతిక ఉద్వేగాన్ని ‘సోదరులు’ కాపాడుతుంది.
- issue: מֵאִתִּי నִהְיָה ద్వారా సూచితమైన దైవ కారణత్వం
  choice: ఈ విషయం నా నుంచే జరిగింది
  alternative: ఈ వ్యవహారం నా వల్లనే జరిగింది
  rationale: దేవుని నుంచే ఇది సంభవించిందనే బలాన్ని నిలుపుతూ, ఆయన అనుమతి మరియు ప్రత్యక్ష కార్యసాధన మధ్య మూలపాఠం తేల్చని అంశాన్ని అతిగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. బంధుత్వ పదాన్ని నిలిపి, హీబ్రూ సైనిక నుడికారాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో తెలిపింది.
