id: 1KI.12.15
reference: 1 Kings 12:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹֽא שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֶל הָ/עָ֑ם כִּֽי הָיְתָ֤ה סִבָּה֙ מֵ/עִ֣ם יְהוָ֔ה לְמַ֜עַן הָקִ֣ים אֶת דְּבָר֗/וֹ אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ בְּ/יַד֙ אֲחִיָּ֣ה הַ/שִּׁילֹנִ֔י אֶל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/015.yaml
  text: So the king did not listen to the people[a], for it was a turn of events from Yahweh[b], in order to establish his word that Yahweh had spoken by the hand of Ahijah the Shilonite to Jeroboam son of Nebat.
translation:
  language: te
  text: అందుచేత రాజు ప్రజల మాట వినలేదు. ఎందుకంటే, ఈ పరిణామం యెహోవా నుండి వచ్చింది[a]. నెబాతు కుమారుడైన యరొబాముతో షిలోనీయుడైన అహీయా ద్వారా యెహోవా పలికిన తన మాటను నెరవేర్చడానికే ఇలా జరిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానికి కారణం యెహోవా నుండి వచ్చింది.” హీబ్రూ పదం ‘కారణం,’ ‘పరిస్థితి,’ లేదా ‘సంఘటనల మలుపు’ అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע אֶל
  choice: మాట వినలేదు
  rationale: ఇక్కడ కేవలం శబ్దాన్ని వినడం కాకుండా ప్రజల విన్నపాన్ని ఆలకించి అంగీకరించడం అనే భావం ఉంది. ‘మాట వినలేదు’ ఆధునిక తెలుగులో సహజంగా ఈ భావాన్ని తెలియజేస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: ఇది రాజు ఎదుట విన్నపం చేసిన ఇశ్రాయేలు ప్రజలను సూచించే సాధారణ పదం.
- source_word: סִבָּה
  choice: పరిణామం
  rationale: ఈ నామవాచకం కారణం, పరిస్థితుల మలుపు లేదా జరిగిన పరిణామం అనే భావాలను కలిగి ఉండగలదు. ‘పరిణామం’ కథన సందర్భానికి సరిపోతూ మూలపదంలోని విస్తృతిని కాపాడుతుంది.
- source_word: מֵעִם יְהוָה
  choice: యెహోవా నుంచే వచ్చింది
  rationale: ఈ పదబంధం ఆ పరిణామానికి యెహోవాయే మూలమని తెలియజేస్తుంది. ‘నుంచే’ మూలంలోని దైవిక ఆవిర్భావాన్ని స్పష్టంగా ఉంచుతుంది గాని అది ఎలా కార్యరూపం దాల్చిందో అదనంగా నిర్వచించదు.
- source_word: לְמַעַן הָקִים
  choice: నెరవేర్చడానికే
  rationale: לְמַעַן ఉద్దేశాన్ని సూచిస్తుంది; הֵקִים ‘మాట’తో కలిసినప్పుడు పలికిన మాటను స్థిరపరచడం లేదా నెరవేర్చడం అనే భావం ఇస్తుంది. తెలుగులో ‘నెరవేర్చడం’ సహజంగా ప్రవచన వాక్యం కార్యరూపం దాల్చడాన్ని తెలియజేస్తుంది.
- source_word: דְּבָרוֹ
  choice: తన మాటను
  rationale: ‘మాట’ మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది; ‘వాగ్దానం’ అని అనువదిస్తే భావం అనవసరంగా సంకుచితమవుతుంది. ‘తన’ అనేది యెహోవాను సూచిస్తుంది.
- source_word: דִּבֶּר יְהוָה
  choice: యెహోవా పలికిన
  rationale: ప్రస్తుత సంఘటనకు ముందే పలికిన దైవవాక్యాన్ని సహజమైన తెలుగు సంబంధవాచక నిర్మాణంతో తెలియజేస్తుంది.
- source_word: בְּיַד אֲחִיָּה
  choice: అహీయా ద్వారా
  rationale: అక్షరార్థంగా ‘అహీయా చేతి ద్వారా’ అయిన ఈ హీబ్రూ నుడికారం ప్రవక్తను మధ్యవర్తిగా చేసుకొని మాట్లాడడాన్ని సూచిస్తుంది. ‘ద్వారా’ ఆధునిక తెలుగులో దాని ఉద్దేశాన్ని సహజంగా అందిస్తుంది.
- source_word: הַשִּׁילֹנִי
  choice: షిలోనీయుడు
  rationale: షిలోకు చెందిన వ్యక్తి అనే హీబ్రూ జాతి/స్థలనామ విశేషణాన్ని తెలుగు వ్యక్తివాచక రూపంలో కాపాడుతుంది.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: నెబాతు కుమారుడైన యరొబాము
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
theological_decisions:
- issue: దైవ కారణత్వం మరియు రాజు చేసిన మానవ నిర్ణయం
  choice: రాజు ప్రజల మాట వినకపోవడాన్ని యెహోవా నుండి వచ్చిన పరిణామంతో అనుసంధానించి, అది యెహోవా ముందుగా పలికిన మాట నెరవేరే ఉద్దేశంతో జరిగిందని చెప్పడం
  alternative: యెహోవా దీనిని కేవలం అనుమతించాడని బలహీనపరచడం, లేదా రాజు నిరాకరణను యెహోవా నేరుగా బలవంతంగా కలిగించాడని మూలానికి మించి వివరించడం
  rationale: హీబ్రూ ఆ పరిణామం యెహోవా నుండి వచ్చిందని, దానికి ఆయన మాటను స్థాపించే ఉద్దేశం ఉందని స్పష్టంగా చెబుతుంది; అయితే దైవ కార్యం మరియు రాజు బాధ్యత మధ్య సంబంధం ఎలా పనిచేసిందో వివరించదు. అనువాదం ఆ ఉద్రిక్తతను అలాగే ఉంచుతుంది.
- issue: దైవనామం יְהוָה
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో ఉన్న ప్రత్యేక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తపరుస్తుంది.
- issue: הֵקִים אֶת דְּבָרוֹ యొక్క భావం
  choice: తన మాటను నెరవేర్చడం
  alternative: తన మాటను స్థాపించడం
  rationale: రాజ్య విభజనకు సంబంధించిన ముందరి ప్రవచనం కథనంలో కార్యరూపం దాల్చడం ఇక్కడ ఉద్దేశం. ‘నెరవేర్చడం’ సహజమైన తెలుగు; అయినా దానిని ‘వాగ్దానం’గా సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. మొదటి వాక్యం రాజు చర్యను స్పష్టంగా ఉంచగా, తరువాతి వాక్యాలు దైవ మూలం మరియు ప్రవచన నెరవేర్పును సహజమైన తెలుగు క్రమంలో తెలియజేస్తాయి. ‘పరిణామం’ అనే పదం סִבָּה లోని కారణం/సంఘటనల మలుపు అనే నిజమైన అర్థవిస్తృతిని పూర్తిగా ఒకే దిశలో నిర్ణయించకుండా ఉంచుతుంది.
