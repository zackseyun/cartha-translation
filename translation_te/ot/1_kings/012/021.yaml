  source_fidelity: ముసాయిదా ప్రధాన భావాన్ని సరిగ్గా అందిస్తుంది. అయితే హీబ్రూలో లక్షా ఎనభై వేలమంది ఎంపికైన యుద్ధవీరులే రెహబాము సమకూర్చిన ప్రత్యక్ష కర్మ; ముసాయిదాలో వారు ‘ఉన్నారు’ అనే స్వతంత్ర వాక్యంగా మారారు. సవరించిన పాఠం ఆ వాక్యనిర్మాణాన్ని, ఉద్దేశార్థక పదబంధాలను పునరుద్ధరిస్తుంది.
