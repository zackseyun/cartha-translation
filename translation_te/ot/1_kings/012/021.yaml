  terminology: ‘యూదా ఇంటివారు’ మరియు ‘ఇశ్రాయేలు ఇంటివారు’ హీబ్రూ రాజకీయ-సామూహిక నుడికారానికి సమాంతరంగా ఉన్నాయి. ‘ఎంపికైన యుద్ధవీరులు,’ ‘గోత్రం,’ ‘రాజ్యం’ సందర్భానుకూలమైన పదాలు. ప్రత్యామ్నాయ పాదటిప్పణి בָּחוּר עֹשֵׂה מִלְחָמָה యొక్క మరింత పదానుసారమైన పఠనాన్ని కాపాడుతుంది.
