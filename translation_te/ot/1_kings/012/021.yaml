source:
  edition: WLC
  text: ו/יבאו רְחַבְעָם֮ יְרוּשָׁלִַם֒ וַ/יַּקְהֵל֩ אֶת כָּל בֵּ֨ית יְהוּדָ֜ה וְ/אֶת שֵׁ֣בֶט בִּנְיָמִ֗ן מֵאָ֨ה וּ/שְׁמֹנִ֥ים אֶ֛לֶף בָּח֖וּר עֹשֵׂ֣ה מִלְחָמָ֑ה לְ/הִלָּחֵם֙ עִם בֵּ֣ית יִשְׂרָאֵ֔ל לְ/הָשִׁיב֙ אֶת הַ/מְּלוּכָ֔ה לִ/רְחַבְעָ֖ם בֶּן שְׁלֹמֹֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/021.yaml
  text: When Rehoboam came to Jerusalem[a], he assembled all the house of Judah and the tribe of Benjamin, one hundred eighty thousand chosen warriors, to fight against the house of Israel, to restore the kingdom to Rehoboam son of Solomon.
translation:
  language: te
  text: రెహబాము యెరూషలేముకు వచ్చి, యూదా ఇంటివారందరినీ, బెన్యామీను గోత్రాన్నీ—ఇశ్రాయేలు ఇంటివారితో యుద్ధం చేసి, సొలొమోను కుమారుడైన రెహబాముకు రాజ్యాన్ని తిరిగి అప్పగించడానికి—లక్షా ఎనభై వేలమంది ఎంపికైన యుద్ధవీరులను సమకూర్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యుద్ధం చేసే ఎంపికైన పురుషులు.”
    reason: בָּחוּר עֹשֵׂה מִלְחָמָה అనే పదబంధానికి మరింత పదానుసారమైన ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: וַיָּבֹאוּ / ויבאו
  choice: వచ్చినప్పుడు
  rationale: లిఖిత రూపం బహువచనంగా కనిపించినా, సందర్భంలోని కర్త రెహబాము మరియు తరువాతి ఏకవచన క్రియ ఏకవచన భావాన్ని నిర్ధారిస్తాయి. యెరూషలేము గమ్యంగా ఉన్న בוא క్రియను సహజ తెలుగులో ‘వచ్చినప్పుడు’గా ఇచ్చాం.
- source_word: וַיַּקְהֵל
  choice: సమకూర్చాడు
  rationale: హిఫిల్ రూపంలోని ప్రజలను కూడగట్టే కారక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כָּל בֵּית יְהוּדָה
  choice: యూదా వంశమంతటినీ
  rationale: రాజకీయ-సామూహిక అర్థమున్న ‘యూదా ఇంటివారు’ అనే హీబ్రూ నుడికారాన్ని ‘వంశం’గా అందించి, తరువాతి ‘ఇశ్రాయేలు వంశం’తో సమాంతరతను నిలిపాం.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: బెన్యామీను గోత్రాన్నీ
  rationale: שֵׁבֶט అనే స్పష్టమైన గోత్రపదాన్ని అనువాదంలో నిలిపాం.
- source_word: מֵאָה וּשְׁמֹנִים אֶלֶף
  choice: లక్షా ఎనభై వేలమంది
  rationale: ఆధునిక తెలుగులో సహజమైన సంఖ్యా వ్యక్తీకరణ.
- source_word: בָּחוּר עֹשֵׂה מִלְחָמָה
  choice: ఎంపికైన యుద్ధవీరులు
  rationale: సైనిక సందర్భంలో בָּחוּר ఎంపిక చేయబడిన లేదా శ్రేష్ఠమైన పురుషులను సూచిస్తుంది; עֹשֵׂה מִלְחָמָה వారి యుద్ధసామర్థ్యాన్ని స్పష్టం చేస్తుంది.
- source_word: לְהִלָּחֵם עִם
  choice: యుద్ధం చేసి
  rationale: విరోధ పక్షంతో పోరాడే ఉద్దేశాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: בֵּית יִשְׂרָאֵל
  choice: ఇశ్రాయేలు వంశంతో
  rationale: విభజిత రాజ్య సందర్భంలోని రాజకీయ-సామూహిక భావాన్ని నిలుపుతూ ‘యూదా వంశం’తో సమాంతరంగా అనువదించాం.
- source_word: לְהָשִׁיב אֶת הַמְּלוּכָה
  choice: రాజ్యాన్ని తిరిగి అప్పగించడానికి
  rationale: హిఫిల్ రూపంలోని ‘తిరిగి చేర్చడం/పునరుద్ధరించడం’ అనే భావాన్ని, లబ్ధిదారునికి రాజ్యాధికారాన్ని మళ్లీ కలిగించడంగా సహజ తెలుగులో అందిస్తుంది.
- source_word: לִרְחַבְעָם בֶּן שְׁלֹמֹה
  choice: సొలొమోను కుమారుడైన రెహబాముకు
  rationale: లామెడ్ సూచించే గ్రహీత/లబ్ధిదారు భావాన్ని ‘రెహబాముకు’తో స్పష్టంగా చూపిస్తుంది.
theological_decisions:
- issue: מַמְלָכָה యొక్క రాజకీయ భావం
  choice: రాజ్యం
  alternative: రాజరికం / రాజ్యాధికారం
  rationale: సందర్భం విభజన తరువాత జాతీయ పాలనను రెహబాముకు తిరిగి చేర్చడం గురించి ఉంది. ‘రాజ్యం’ సహజమైనదిగా ఉండి, రాజరికం లేదా రాజ్యాధికార భావాన్నీ సందర్భంలో కలిగి ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన కథనశైలి. ‘వంశం’ ద్వారా בֵּית యొక్క రాజకీయ-సామూహిక నుడికారాన్ని రెండు చోట్ల సమాంతరంగా నిలిపాం. ప్రధాన వాక్యం అతిగా పొడవుగా కాకుండా రెండు వాక్యాలుగా విభజించాం; ఉద్దేశ సంబంధాన్ని మాత్రం యథాతథంగా ఉంచాం.
