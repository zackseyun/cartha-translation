base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/028.yaml
  text: So the king took counsel and made two calves of gold[a], and he said to them, “It is too much for you to go up to Jerusalem. Behold your gods, O Israel[b], who brought you up from the land of Egypt.”
translation:
  language: te
  text: కాబట్టి రాజు సలహా తీసుకొని రెండు బంగారు దూడలను చేశాడు. అతడు ప్రజలతో, “మీరు యెరూషలేముకు ఎక్కి వెళ్లడం మీకు చాలా భారంగా ఉంది[a]. ఇదిగో, ఇశ్రాయేలూ, ఐగుప్తు దేశం నుండి నిన్ను పైకి తీసుకొచ్చిన నీ దేవుళ్లు వీరే[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు యెరూషలేముకు ఎక్కి వెళ్లింది చాలు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఇశ్రాయేలూ, ఇదిగో నీ దేవుడు.” హీబ్రూ రూపం కొన్నిసార్లు ఏకవచన బిరుదుగా కూడా వాడబడుతుంది; ఈ మాటలు నిర్గమకాండము 32:4ను ప్రతిధ్వనిస్తాయి. అయితే ఇక్కడ రెండు దూడలు ఉండడం, క్రియ బహువచనంలో ఉండడం వల్ల “నీ దేవుళ్లు” అనే అనువాదానికి ఎక్కువ బలం ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: సలహా తీసుకొని
  rationale: నిఫల్ రూపం రాజు సంప్రదించి లేదా ఆలోచన చేసి నిర్ణయించాడనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో ‘సలహా తీసుకొని’ సహజంగా ఉండి మూలార్థాన్ని నిలుపుతుంది.
- source_word: שְׁנֵי עֶגְלֵי זָהָב
  choice: రెండు బంగారు దూడలను
  rationale: ‘బంగారంతో చేసిన రెండు దూడలు’ అనే నిర్మాణార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తూ నిర్గమకాండము 32లోని ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: רַב לָכֶם מֵעֲלוֹת יְרוּשָׁלִַם
  choice: మీరు యెరూషలేముకు వెళ్లడం చాలా కష్టం
  rationale: ఈ మాట వెళ్లడం వారికి మించిన భారమని లేదా వారు వెళ్లింది చాలునని సూచించవచ్చు. ప్రధాన పాఠం సందర్భంలోని రాజు ప్రలోభపెట్టే వాదనను సహజంగా వ్యక్తం చేస్తుంది; మరొక సాధ్యార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: చూపిస్తూ ప్రకటించే హీబ్రూ పదబలాన్ని గంభీరమైనప్పటికీ ప్రస్తుత తెలుగులో అర్థమయ్యే విధంగా వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהֶיךָ יִשְׂרָאֵל
  choice: ఇశ్రాయేలూ… నీ దేవుళ్లు
  rationale: రెండు దూడల ప్రస్తావనతో పాటు తరువాతి క్రియ బహువచనంలో ఉండడం వల్ల ఇక్కడ బహువచనం ప్రధానంగా తీసుకున్నాం. సంబోధనను ‘ఇశ్రాయేలూ’ అని స్పష్టంగా చూపాం.
- source_word: הֶעֱלוּךָ
  choice: నిన్ను పైకి తీసుకొచ్చిన
  rationale: హీబ్రూలోని బహువచన క్రియను ‘దేవుళ్లు’ అనే బహువచన కర్తతో అనుసంధానిస్తూ, ఐగుప్తు నుండి తీసుకురావడం అనే నిర్గమన సూత్రభాషను నిలుపుతుంది.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ఐగుప్తు దేశం నుండి
  rationale: హీబ్రూ పదబంధాన్ని దగ్గరగా అనుసరించి నిర్గమన వృత్తాంతంలోని స్థిరమైన భాషను కాపాడుతుంది.
theological_decisions:
- issue: אֱלֹהֶיךָ అనే పదాన్ని ఏకవచనంగా లేదా బహువచనంగా అనువదించాలా
  choice: ‘నీ దేవుళ్లు’ అనే బహువచనం
  alternative: ‘నీ దేవుడు’ అనే ఏకవచనం
  rationale: אֱלֹהִים రూపం కొన్నిసార్లు ఏకవచన దేవుని బిరుదుగా పనిచేయగలదు. అయితే ఇక్కడ రెండు దూడలు ఉన్నాయి; הֶעֱלוּ అనే క్రియ కూడా బహువచనం. కాబట్టి బహువచనం బలమైన పఠనం. అయినా నిర్గమకాండము 32:4తో ఉన్న ప్రతిధ్వని మరియు ఏకవచన సాధ్యతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. ‘యెరూషలేము,’ ‘ఐగుప్తు’ వంటి విస్తృతంగా గుర్తించబడే బైబిలు స్థలనామాలను ఉంచాం. సమూహమైన ఇశ్రాయేలును సంబోధించే హీబ్రూ ఏకవచనాన్ని తెలుగులో ‘నిన్ను/నీ’గా నిలిపాం.
