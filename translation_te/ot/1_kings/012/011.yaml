id: 1KI.12.11
reference: 1 Kings 12:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֗ה אָבִ/י֙ הֶעְמִ֤יס עֲלֵי/כֶם֙ עֹ֣ל כָּבֵ֔ד וַ/אֲנִ֖י אוֹסִ֣יף עַֽל עֻלְּ/כֶ֑ם אָבִ֗/י יִסַּ֤ר אֶתְ/כֶם֙ בַּ/שּׁוֹטִ֔ים וַ/אֲנִ֕י אֲיַסֵּ֥ר אֶתְ/כֶ֖ם בָּ/עַקְרַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/011.yaml
  text: And now[a], my father made your yoke heavy, but I will add to your yoke. My father disciplined you with whips, but I will discipline you with scorpions.
translation:
  language: te
  text: ఇప్పుడు[a], నా తండ్రి మీ మీద బరువైన కాడిని మోపాడు; నేనైతే మీ కాడికి మరింత బరువు చేర్చుతాను. నా తండ్రి మిమ్మల్ని కొరడాలతో దండించాడు; నేనైతే మిమ్మల్ని తేళ్లతో దండిస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తేళ్ల కొరడాలతో” అని కూడా అర్థం కావచ్చు; అంటే మరింత బాధ కలిగించేలా రూపొందించిన కొరడాలు లేదా దెబ్బలు. హీబ్రూ మూలంలో అక్షరార్థంగా “తేళ్లతో” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעְמִיס
  choice: బరువుగా చేశాడు
  rationale: עמס యొక్క హిఫీల్ రూపం బరువు మోపడం లేదా భారంగా చేయడం అనే భావాన్ని ఇస్తుంది. ‘కాడి’తో కలిసి రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: עֹל / עֻלְּכֶם
  choice: కాడి / మీ కాడికి
  rationale: ఇది పాలన లేదా బలవంతపు శ్రమ వల్ల కలిగే అణచివేతకు సంబంధించిన స్పష్టమైన రూపకం. ‘భారం’ అని సాధారణీకరించకుండా మూలంలోని పునరుక్తిని నిలిపింది.
- source_word: כָּבֵד
  choice: బరువుగా
  rationale: మూలపదానికి ప్రత్యక్ష అర్థం ‘బరువైనది.’ ‘కఠినంగా’ అని అనువదిస్తే రూపకాన్ని వ్యాఖ్యానించినట్లవుతుంది.
- source_word: אוֹסִיף עַל
  choice: మరింత బరువు చేర్చుతాను
  rationale: ‘దానికి జోడిస్తాను/పెంచుతాను’ అనే నిర్మాణాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తూ, కాడి మరింత భారమవుతుందనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: יִסַּר / אֲיַסֵּר
  choice: శిక్షించాడు / శిక్షిస్తాను
  rationale: יסר క్రమశిక్షణ పెట్టడం, దండించడం, శిక్షించడం అనే పరిధి కలిగి ఉంది. ఇక్కడ శారీరక దండనతో కూడిన రాజకీయ బెదిరింపు కాబట్టి ‘శిక్షించు’ సహజంగా, సందర్భోచితంగా ఉంది.
- source_word: בַּשּׁוֹטִים
  choice: కొరడాలతో
  rationale: שׁוֹט అంటే కొరడా లేదా దెబ్బలు కొట్టే సాధనం; ‘కొరడాలతో’ ప్రత్యక్షమైన, సాధారణ తెలుగు పదప్రయోగం.
- source_word: בָּעַקְרַבִּים
  choice: తేళ్లతో
  rationale: మూలపదానికి అక్షరార్థం ‘తేళ్లు.’ ఇది మరింత బాధాకరమైన కొరడాలకు రూపకంగా ఉండవచ్చు; అయినా మూలంలోని బలమైన చిత్రాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సాధ్యమైన సాధనార్థాన్ని పాదటిప్పణిలో తెలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘కాడి’ అనే మూల రూపకాన్ని, వాక్యంలోని తండ్రి–నేను వ్యతిరేక సమాంతర నిర్మాణాన్ని నిలిపింది.
