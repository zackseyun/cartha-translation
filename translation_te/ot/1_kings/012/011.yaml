  to: ఇప్పుడు[a], నా తండ్రి మీ మీద బరువైన కాడిని మోపాడు; నేనైతే మీ కాడికి మరింత బరువు చేర్చుతాను. నా తండ్రి మిమ్మల్ని కొరడాలతో దండించాడు; నేనైతే మిమ్మల్ని తేళ్లతో దండిస్తాను.
