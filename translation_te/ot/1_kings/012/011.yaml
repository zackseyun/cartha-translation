review_pass:
  verdict: revise
  source_fidelity: The draft preserves the yoke metaphor, the escalating threat, and the literal rendering of “scorpions.” However, the first clause renders the Hebrew’s “placed/imposed a heavy yoke upon you” less directly as “made your yoke heavy.” A small revision better reflects both the heavy yoke and its imposition upon the people.
  naturalness: The Telugu is generally clear and suitably formal. “మీ మీద బరువైన కాడిని మోపాడు” is more idiomatic and concrete than “మీ కాడిని బరువుగా చేశాడు,” while retaining the metaphor. “దండించాడు” naturally conveys corporal chastisement in this context.
  terminology: “కాడి,” “కొరడాలు,” and “తేళ్లు” appropriately retain the source imagery. The footnote correctly preserves the lexical ambiguity of עַקְרַבִּים without making the interpretive sense the main text. “దండించాడు” is preferable here to the broader “శిక్షించాడు,” since the explicit instruments indicate harsh corporal chastisement.
  issues:
  - severity: low
    issue: The first clause does not explicitly represent the Hebrew prepositional sense “upon you.”
    rationale: הֶעְמִיס עֲלֵיכֶם עֹל כָּבֵד depicts the father as imposing a heavy yoke upon the people. “మీ మీద బరువైన కాడిని మోపాడు” represents this image directly.
  - severity: low
    issue: “శిక్షించాడు” may suggest general punishment more readily than the corporal chastisement indicated by whips and scorpions.
    rationale: יסר has a discipline/chastisement range; in this explicitly physical political threat, “దండించాడు” is natural and appropriately specific without overinterpreting it as a legal sentence.
  revised_text: ఇప్పుడు[a], నా తండ్రి మీ మీద బరువైన కాడిని మోపాడు; నేనైతే మీ కాడికి మరింత బరువు చేర్చుతాను. నా తండ్రి మిమ్మల్ని కొరడాలతో దండించాడు; నేనైతే మిమ్మల్ని తేళ్లతో దండిస్తాను.
