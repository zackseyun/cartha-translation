source:
  edition: WLC
  text: וַ/יִּוָּעַ֞ץ הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם אֶת הַ/זְּקֵנִים֙ אֲשֶׁר הָי֣וּ עֹמְדִ֗ים אֶת פְּנֵי֙ שְׁלֹמֹ֣ה אָבִ֔י/ו בִּֽ/הְיֹת֥/וֹ חַ֖י לֵ/אמֹ֑ר אֵ֚יךְ אַתֶּ֣ם נֽוֹעָצִ֔ים לְ/הָשִׁ֥יב אֶת הָֽ/עָם הַ/זֶּ֖ה דָּבָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/006.yaml
  text: Then King Rehoboam consulted the elders who had stood before Solomon his father while he was still alive[a], saying[b], “How do you advise me to answer this people?”
translation:
  language: te
  text: అప్పుడు రాజైన రెహబాము, తన తండ్రియైన సొలొమోను జీవించి ఉన్నప్పుడు అతని సన్నిధిలో నిలిచి ఉన్న[a] పెద్దలను సంప్రదించి, “ఈ ప్రజలకు ఎలా జవాబివ్వాలో మీరు నాకు సలహా ఇస్తారు?” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో పదశః, ‘సొలొమోను సన్నిధిలో నిలిచి ఉన్న’ అని ఉంది. ఇది రాజసభలో సొలొమోను సమక్షంలో హాజరై అతనికి సేవ చేసినవారిని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: సంప్రదించి
  rationale: నిఫాల్ రూపం ఇక్కడ ఇతరుల సలహా కోరడాన్ని సూచిస్తుంది. ‘సంప్రదించి’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, అంతర్గతంగా ఆలోచించడం కంటే పెద్దల అభిప్రాయం అడిగిన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: రాజైన రెహబాము
  rationale: రాజపదవిని పేరుతో సహజమైన తెలుగు నిర్మాణంలో కలిపి, హెబ్రీలోని నిర్దిష్టతను సందర్భానుగుణంగా తెలియజేస్తుంది.
- source_word: הַזְּקֵנִים
  choice: పెద్దలను
  rationale: రాజసభ సందర్భంలో ఇది కేవలం వృద్ధులను కాక, అనుభవజ్ఞులైన పెద్దలు లేదా సీనియర్ సలహాదారులను సూచిస్తుంది. ‘పెద్దలు’ ఆ రెండు భావాలను సహజంగా మోస్తుంది.
- source_word: אֲשֶׁר הָיוּ עֹמְדִים אֶת־פְּנֵי שְׁלֹמֹה
  choice: సొలొమోను ... సన్నిధిలో నిలిచిన
  rationale: రాజు ఎదుట హాజరై సేవ చేయడాన్ని సూచించే హెబ్రీ నుడికారంలోని ‘నిలుచుట’ అనే రూపకాన్ని ప్రధాన పాఠంలో నిలిపి ఉంచింది; దాని కార్యార్థాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: בִּהְיֹתוֹ חַי
  choice: బతికున్నప్పుడు
  rationale: ఈ పెద్దలు సొలొమోను జీవించిన కాలంలోనే అతని సన్నిధిలో ఉన్నారని తెలిపే కాలవాచక ఉపవాక్యాన్ని సరళంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֵיךְ אַתֶּם נוֹעָצִים
  choice: ఏ విధంగా ... మీరు నాకు సలహా ఇస్తున్నారు
  rationale: אֵיךְ లోని ‘ఎలా/ఏ విధంగా’ అనే ప్రశ్నార్థక భావాన్ని కాపాడుతుంది. సందర్భం ద్వారా సూచితమైన సలహా స్వీకర్తను తెలుగులో సహజత కోసం ‘నాకు’ అని స్పష్టపరుస్తుంది.
- source_word: לְהָשִׁיב ... דָּבָר
  choice: జవాబివ్వాలని
  rationale: పదశః ‘ఒక మాటను తిరిగి ఇవ్వడం’ అనే నిర్మాణం ఇక్కడ ప్రత్యుత్తరం ఇవ్వడాన్ని సూచిస్తుంది. ‘జవాబివ్వడం’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: הָעָם הַזֶּה
  choice: ఈ ప్రజలకు
  rationale: עם అనే ఏకవచన సమూహవాచక పదాన్ని ‘ప్రజలు’గా, దానికి సంబంధించిన సూచనార్థక విశేషణాన్ని ‘ఈ’గా అనువదించింది.
