translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. హీబ్రూ సామూహిక నుడికారం ‘యూదా వంశం’గా నిలుపబడింది. వాక్యం తరువాతి వచనానికి కొనసాగుతుందని ద్విబిందువు సూచిస్తుంది.
