language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֱמֹ֗ר אֶל רְחַבְעָ֤ם בֶּן שְׁלֹמֹה֙ מֶ֣לֶךְ יְהוּדָ֔ה וְ/אֶל כָּל בֵּ֥ית יְהוּדָ֖ה וּ/בִנְיָמִ֑ין וְ/יֶ֥תֶר הָ/עָ֖ם לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/023.yaml
  text: Speak to Rehoboam son of Solomon[a], king of Judah, and to all the house of Judah and Benjamin, and the rest of the people, saying[c][b],
translation:
  language: te
  text: 'సొలొమోను కుమారుడూ యూదా రాజూ అయిన రెహబాముతో, యూదా వంశమంతటితో, బెన్యామీనుతో, మిగిలిన ప్రజలతో ఇలా చెప్పు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱמֹר
  choice: ఇలా చెప్పు
  rationale: אמר ఆజ్ఞార్థక రూపం సందేశాన్ని నిర్దిష్ట వ్యక్తులకు తెలియజేయమనే ఆజ్ఞను వ్యక్తం చేస్తుంది. తెలుగులో ‘ఇలా చెప్పు’ సహజంగా ఉండి, తరువాతి వచనంలో వచ్చే సందేశానికి అనుసంధానిస్తుంది.
- source_word: רְחַבְעָם
  choice: రెహబాము
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు బైబిలు వాడుకకు అనుగుణమైన లిప్యంతరీకరణ.
- source_word: בֶּן שְׁלֹמֹה מֶלֶךְ יְהוּדָה
  choice: సొలొమోను కుమారుడూ యూదా రాజూ అయిన
  rationale: రెహబామును వంశపరంగానూ రాజపదవిపరంగానూ గుర్తించే రెండు సమాంతర విశేషణాలను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כָּל בֵּית יְהוּדָה
  choice: యూదా వంశమంతటితో
  rationale: בֵּית అనే హీబ్రూ సామూహిక-రాజకీయ నుడికారాన్ని ‘వంశం’ ద్వారా నిలుపుతూ, ఇక్కడ యూదా సమాజం లేదా రాజ్యవర్గం ఉద్దేశించబడిందనే భావాన్ని తెలియజేస్తుంది.
- source_word: וּבִנְיָמִין
  choice: బెన్యామీనుతో
  rationale: హీబ్రూలో బెన్యామీను పేరు స్వతంత్రంగా ఉండటాన్ని అలాగే ఉంచి, సందర్భంలో గోత్రసమూహాన్ని సూచించనిస్తుంది.
- source_word: וְיֶתֶר הָעָם
  choice: మిగిలిన ప్రజలతో
  rationale: יֶתֶר ను ‘మిగిలిన’గా, הָעָם ను సాధారణ అర్థమైన ‘ప్రజలు’గా అనువదిస్తుంది; యుద్ధసందర్భం ఉన్నప్పటికీ మూలపాఠంలో ‘సైన్యం’ అని స్పష్టంగా లేదు.
- source_word: לֵאמֹר
  choice: 'ఇలా చెప్పు:'
  rationale: తరువాతి వచనంలో వచ్చే ప్రత్యక్ష సందేశాన్ని పరిచయం చేసే ఉద్ధరణార్థక క్రియారూపాన్ని తెలుగులో సహజమైన వాక్యాంత ఆజ్ఞగా వ్యక్తం చేసి, ద్విబిందువుతో కొనసాగింపును సూచిస్తుంది.
