source:
  edition: WLC
  text: וַֽ/יַּעֲזֹ֛ב אֶת עֲצַ֥ת הַ/זְּקֵנִ֖ים אֲשֶׁ֣ר יְעָצֻ֑/הוּ וַ/יִּוָּעַ֗ץ אֶת הַ/יְלָדִים֙ אֲשֶׁ֣ר גָּדְל֣וּ אִתּ֔/וֹ אֲשֶׁ֥ר הָ/עֹמְדִ֖ים לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/008.yaml
  text: But he abandoned the advice of the elders that they had given him[a], and consulted with the young men who had grown up with him, who stood before him.
translation:
  language: te
  text: అయితే అతడు పెద్దలు తనకు ఇచ్చిన సలహాను పక్కనపెట్టి, తనతోపాటు పెరిగి అతని ఎదుట నిలబడి ఉండే[a] యువకులతో సంప్రదించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనికి పరిచర్య చేసేవారు” లేదా “అతని సేవలో ఉండేవారు.” “అతని ఎదుట నిలబడుట” అనే హెబ్రీ నుడికారం రాజసభలో హాజరై సేవ చేయడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: పక్కనపెట్టి
  rationale: עזב ఇక్కడ ముందుగా ఇచ్చిన సలహాను ఉద్దేశపూర్వకంగా విడిచిపెట్టడం లేదా తిరస్కరించడం సూచిస్తుంది. ఆధునిక తెలుగులో ‘పక్కనపెట్టి’ సహజంగా ఉండి ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עֲצַת
  choice: సలహాను
  rationale: עֵצָה ఈ సందర్భంలో రాజుకు ఇచ్చిన మార్గదర్శక సలహాను సూచిస్తుంది; ‘సలహా’ సాధారణ ఆధునిక తెలుగులో స్పష్టమైన పదం.
- source_word: הַזְּקֵנִים
  choice: పెద్దలు
  rationale: זקנים వయస్సులో పెద్దవారనే భావంతో పాటు గుర్తింపు పొందిన సీనియర్ సలహాదారుల పాత్రను కూడా సూచిస్తుంది. ‘పెద్దలు’ ఈ రెండు భావాలను సహజంగా మోస్తుంది.
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: తనకు ఇచ్చిన
  rationale: ముందున్న ‘సలహా’తో కలిపి ‘పెద్దలు తనకు ఇచ్చిన సలహా’ అని చెప్పడం తెలుగు నుడికారానికి సహజం; మూలంలోని ‘అతనికి సలహా ఇచ్చారు’ అనే భావం నిలుస్తుంది.
- source_word: וַיִּוָּעַץ
  choice: సంప్రదించాడు
  rationale: יעץ నిఫాల్ రూపం ఇక్కడ ఇతరులతో ఆలోచన కోరడం లేదా సంప్రదించడం అనే పరస్పర భావాన్ని ఇస్తుంది. ‘సంప్రదించాడు’ దానిని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַיְלָדִים
  choice: యువకులతో
  rationale: ילדים అక్షరార్థంగా పిల్లలు లేదా బాలురు కావచ్చు; అయితే వీరు రాజుతోపాటు పెరిగి రాజసభలో ఉన్న సమవయస్కులు. ‘యువకులు’ వృద్ధులతో ఉన్న వ్యత్యాసాన్ని కాపాడుతూ పిల్లలనే తప్పుదారి పట్టించే భావాన్ని నివారిస్తుంది.
- source_word: אֲשֶׁר גָּדְלוּ אִתּוֹ
  choice: తనతోపాటు పెరిగి
  rationale: ఈ పదబంధం అతనితో కలిసి పెరిగిన ఉమ్మడి బాల్యాన్ని లేదా ఎదుగుదలను సూచిస్తుంది. ‘తనతోపాటు పెరిగి’ సహజమైన తెలుగు రూపం.
- source_word: אֲשֶׁר הָעֹמְדִים לְפָנָיו
  choice: తన ఎదుట నిలిచే
  rationale: ‘ఎదుట నిలుచుట’ అనే హెబ్రీ నుడికారాన్ని ప్రధాన పాఠంలో నిలిపి, అది రాజసభలో హాజరై సేవ చేయడాన్ని సూచించవచ్చనే కార్యార్థాన్ని పాదసూచికలో తెలియజేస్తుంది.
