source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/שְׁמֹ֣עַ יָרָבְעָ֣ם בֶּן נְבָ֗ט וְ/הוּא֙ עוֹדֶ֣/נּוּ בְ/מִצְרַ֔יִם אֲשֶׁ֣ר בָּרַ֔ח מִ/פְּנֵ֖י הַ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה וַ/יֵּ֥שֶׁב יָרָבְעָ֖ם בְּ/מִצְרָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/002.yaml
  text: When Jeroboam son of Nebat heard of it—while he was still in Egypt[a], where he had fled from King Solomon—Jeroboam was still living in Egypt.
translation:
  language: te
  text: నెబాతు కుమారుడైన యరొబాము ఆ సంగతి[a] విన్నప్పుడు—అతడు సొలొమోను రాజు నుండి పారిపోయి వెళ్లిన ఐగుప్తులో ఇంకా ఉండగా—యరొబాము ఐగుప్తులో నివసిస్తున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ‘యరొబాము విన్నప్పుడు’ అని మాత్రమే ఉంది; అతడు ఏమి విన్నాడో సందర్భం ద్వారా గ్రహించాలి—బహుశా చుట్టుపక్కల కథనంలో ఇప్పుడే చెప్పిన వార్తను సూచిస్తుంది.
    reason: మూలంలో వ్యక్తంగా లేని కర్మను తెలుగులో సహజత కోసం చేర్చినట్లు తెలియజేయడం.
lexical_decisions:
- source_word: וַיְהִי
  choice: ప్రత్యేక పదంగా అనువదించకుండా వాక్య నిర్మాణంలో ప్రతిబింబించడం
  rationale: ఇది కథనాన్ని కొనసాగించే సూత్రప్రాయమైన సంధి. తెలుగులో ‘అప్పుడు’ లేదా ‘ఇదిగో’ అని అదనంగా చేర్చడం కంటే, తరువాతి కాలవాచక ఉపవాక్యంతో కథన ప్రవాహాన్ని సహజంగా వ్యక్తం చేయడం సముచితం.
- source_word: כִּשְׁמֹעַ
  choice: విన్నప్పుడు
  rationale: כְּ ఉపసర్గతో కూడిన שמע క్రియానామ రూపం కాలవాచక ఉపవాక్యాన్ని పరిచయం చేస్తుంది; ‘విన్నప్పుడు’ దాని అర్థాన్ని సహజమైన ఆధునిక తెలుగులో ఇస్తుంది.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: నెబాతు కుమారుడైన యరొబాము
  rationale: వ్యక్తి పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించి, తండ్రి-కొడుకు సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: שְׁמֹעַ
  choice: ఆ సంగతి విన్నప్పుడు
  rationale: హీబ్రూలో వినబడిన విషయానికి ప్రత్యక్ష కర్మ లేదు; సందర్భంలో ముందుగా చెప్పబడిన వార్తను సూచించేందుకు తెలుగులో సహజంగా ఉండే ‘ఆ సంగతి’ చేర్చబడింది. దాని అంతర్నిహిత స్వభావాన్ని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: וְהוּא עוֹדֶנּוּ בְמִצְרַיִם
  choice: అతడు ఇంకా ఐగుప్తులోనే ఉన్నాడు
  rationale: యరొబాము వార్త విన్న సమయంలో కొనసాగుతున్న అతని స్థితిని ‘ఇంకా ... లోనే’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר בָּרַח מִפְּנֵי הַמֶּלֶךְ שְׁלֹמֹה
  choice: సొలొమోను రాజు నుంచి పారిపోయి అక్కడికి వెళ్లాడు
  rationale: מִפְּנֵי ఇక్కడ రాజు సన్నిధి లేదా అధికార పరిధి నుంచి పారిపోవడాన్ని సూచిస్తుంది. ‘అక్కడికి’ అనేది సంబంధవాక్యం సూచించే ఐగుప్తును సహజంగా అనుసంధానిస్తుంది.
- source_word: וַיֵּשֶׁב יָרָבְעָם בְּמִצְרָיִם
  choice: యరొబాము ఐగుప్తులో నివసిస్తూ ఉన్నాడు
  rationale: ישׁב ఇక్కడ స్థిరంగా లేదా కొనసాగుతూ నివసించడాన్ని సూచిస్తుంది. మూలంలో యరొబాము పేరు, ఐగుప్తు ప్రస్తావన పునరావృతమైనందున, కొంత అసాధారణంగా అనిపించినా ఆ పునరుక్తిని నిలిపాం.
