translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని మధ్యంతర వ్యాఖ్యను దీర్ఘరేఖలతో, చివరి పునరుక్తిని తొలగించకుండా నిలిపాం.
