id: 1KI.12.7
reference: 1 Kings 12:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ו/ידבר אֵלָ֜י/ו לֵ/אמֹ֗ר אִם הַ֠/יּוֹם תִּֽהְיֶה עֶ֜בֶד לָ/עָ֤ם הַ/זֶּה֙ וַֽ/עֲבַדְתָּ֔/ם וַ/עֲנִיתָ֕/ם וְ/דִבַּרְתָּ֥ אֲלֵי/הֶ֖ם דְּבָרִ֣ים טוֹבִ֑ים וְ/הָי֥וּ לְ/ךָ֛ עֲבָדִ֖ים כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/007.yaml
  text: And he spoke to him[a], saying, “If today you will be a servant to this people, and serve them, and answer them, and speak good words to them[b], then they will be your servants all your days.”
translation:
  language: te
  text: 'అతడు అతనితో ఇలా అన్నాడు[a]: “నీవు ఈ రోజు ఈ ప్రజలకు సేవకుడిగా ఉండి, వారికి సేవ చేసి, వారికి జవాబిచ్చి, వారికి మంచి మాటలు చెప్పితే[b], వారు ఎల్లప్పుడూ నీ సేవకులుగా ఉంటారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అందించిన హీబ్రూ రూపంలో “అతడు ... అన్నాడు” అని ఉంది; ప్రామాణిక మసోరా పఠనంలో “వారు ... అన్నారు” అని ఉంటుంది.
    reason: textual_variant
  - marker: b
    text: లేదా “దయగల మాటలు చెప్పితే.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד
  choice: సేవకుడు
  rationale: ఈ రాజకీయ సందర్భంలో రాజు ప్రజల మేలు కోసం సేవచేసే వైఖరిని సూచిస్తుంది; ‘బానిస’ అనడం సందర్భార్థాన్ని అనవసరంగా కఠినతరం చేస్తుంది.
- source_word: וַעֲבַדְתָּם
  choice: వారికి సేవ చేసి
  rationale: עבד అనే మూలపదానికి చెందిన నామవాచకం–క్రియ సంబంధాన్ని ‘సేవకుడు/సేవ చేసి’ ద్వారా నిలుపుతుంది.
- source_word: וַעֲנִיתָם
  choice: వారికి జవాబిచ్చి
  rationale: ప్రజల విన్నపానికి ప్రత్యుత్తరం ఇవ్వడం అనే సందర్భానుకూల అర్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: דְּבָרִים טוֹבִים
  choice: మంచి మాటలు
  rationale: హీబ్రూ పదబంధానికి దగ్గరగా ఉండి సహజమైన తెలుగులోనూ అర్థవంతంగా ఉంటుంది; ‘దయగల మాటలు’ అనే భావం కూడా సాధ్యమే.
- source_word: וְהָיוּ לְךָ עֲבָדִים
  choice: వారు ... నీ సేవకులుగా ఉంటారు
  rationale: రాజు ఇప్పుడు ప్రజలకు సేవ చేస్తే వారు అతనికి సేవకులుగా ఉంటారనే పరస్పర వ్యత్యాసాన్ని, అలాగే హీబ్రూలోని నామవాచక రూపాన్ని నిలుపుతుంది.
- source_word: כָּל הַיָּמִים
  choice: ఎల్లప్పుడూ
  rationale: అక్షరార్థంగా ‘అన్ని దినాలు’ అయిన ఈ హీబ్రూ కాలసూచక నానుడిని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: אִם הַיּוֹם
  choice: నీవు ఈ రోజు ... అయితే
  rationale: ప్రస్తుత సంక్షోభంలో వెంటనే తీసుకోవలసిన నిర్ణయంపై ఉన్న కాలప్రాధాన్యాన్ని నిలుపుతుంది.
- source_word: ו/ידבר אֵלָיו לֵאמֹר
  choice: అతడు అతనితో ఇలా అన్నాడు
  rationale: అందించిన హీబ్రూ లిప్యంతరీకరణలో క్రియ ఏకవచనంగా ఉన్నందున దానిని ప్రధాన పాఠంలో అనుసరించాం; పాఠసంప్రదాయంలోని బహువచన పఠనాన్ని పాదటిప్పణిలో తెలిపాం.
theological_decisions:
- issue: రాజరికాన్ని సేవగా చిత్రించే రాజకీయ రూపకం
  choice: సేవకుడు/సేవ చేయడం అనే భాషను నేరుగా నిలుపడం
  alternative: ప్రజలకు లోబడడం లేదా వారి పరిపాలకుడిగా వ్యవహరించడం
  rationale: వచనం రెహబాముకు ఇచ్చిన ఆచరణాత్మక రాజకీయ సలహాను సేవ అనే పరస్పర భావంతో వ్యక్తం చేస్తుంది; దీనిలో తరువాతి కాలపు ప్రత్యేక సిద్ధాంతార్థాలను చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘సేవకుడు/సేవ చేసి’ అనే పునరుక్తి మూలంలోని రాజకీయ పరస్పరతను ఉద్దేశపూర్వకంగా నిలుపుతుంది.
