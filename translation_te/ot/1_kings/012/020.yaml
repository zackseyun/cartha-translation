source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/שְׁמֹ֤עַ כָּל יִשְׂרָאֵל֙ כִּֽי שָׁ֣ב יָרָבְעָ֔ם וַֽ/יִּשְׁלְח֗וּ וַ/יִּקְרְא֤וּ אֹת/וֹ֙ אֶל הָ֣/עֵדָ֔ה וַ/יַּמְלִ֥יכוּ אֹת֖/וֹ עַל כָּל יִשְׂרָאֵ֑ל לֹ֤א הָיָה֙ אַחֲרֵ֣י בֵית דָּוִ֔ד זוּלָתִ֥י שֵֽׁבֶט יְהוּדָ֖ה לְ/בַדּֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/020.yaml
  text: And when all Israel heard that Jeroboam had returned[a], they sent and called him to the assembly and made him king over all Israel. None followed the house of David except the tribe of Judah alone.
translation:
  language: te
  text: యరొబాము తిరిగి వచ్చాడని ఇశ్రాయేలీయులందరూ విన్నప్పుడు, వారు అతనికి కబురు పంపి, అతన్ని సభకు పిలిపించి, ఇశ్రాయేలంతటిమీద అతన్ని రాజుగా నియమించారు. యూదా గోత్రం ఒక్కటే తప్ప దావీదు వంశాన్ని అనుసరించినవారు ఎవరూ లేరు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదా గోత్రం ఒక్కటే తప్ప దావీదు వంశంతో నిలిచినవారు ఎవరూ లేరు.” హీబ్రూ నుడికారం అక్షరార్థంగా “దావీదు వంశం వెనుక ఉండడం” అని ఉండి, విధేయతను లేదా ఒక పక్షంతో కలిసివుండడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: విన్నప్పుడు
  rationale: హీబ్రూ కథన సంధిలోని కాలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; ‘జరిగిందేమంటే’ అనే కృత్రిమ విస్తరణను నివారిస్తుంది.
- source_word: כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరూ
  rationale: ఇక్కడ వినడం, పంపడం వంటి క్రియలకు ప్రజల సమష్టి కర్తగా ఉన్న జాతీయ సమూహాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: כִּי שָׁב יָרָבְעָם
  choice: యరొబాము తిరిగి వచ్చాడని
  rationale: שׁוּב యొక్క ‘తిరిగి రావడం’ అనే అర్థాన్ని, తరువాత జరిగిన చర్యలకు ముందరి సంఘటనగా సహజంగా అందిస్తుంది.
- source_word: וַיִּשְׁלְחוּ
  choice: వారు అతనికి కబురు పంపి
  rationale: హీబ్రూలో పంపిన దాని కర్మ స్పష్టంగా లేకపోయినా, తెలుగులో ఒంటరిగా ‘పంపి’ అనడం అసంపూర్ణంగా ఉంటుంది; సందేశం లేదా పిలుపు పంపిన భావాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘కబురు పంపి’ తెలియజేస్తుంది.
- source_word: וַיִּקְרְאוּ אֹתוֹ אֶל הָעֵדָה
  choice: సమాజం దగ్గరికి అతన్ని పిలిపించి
  rationale: קרא אל లోని పిలిపించే భావాన్ని, עֵדָה లోని సమావేశమైన ప్రజాసమూహ భావాన్ని నిలుపుతుంది; సంఘసంబంధమైన తరువాతి ప్రత్యేకార్థాన్ని రుద్దదు.
- source_word: וַיַּמְלִיכוּ אֹתוֹ עַל כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలంతటిమీద అతన్ని రాజుగా నియమించారు
  rationale: מלך హిఫీల్‌లోని ‘రాజుగా చేయడం’ అనే కారణార్థాన్ని, עַל లోని పరిపాలనా పరిధిని స్పష్టంగా అందిస్తుంది; కిరీటధారణ వంటి చెప్పని ఆచారాన్ని చేర్చదు.
- source_word: לֹא הָיָה אַחֲרֵי בֵית דָּוִד
  choice: దావీదు వంశాన్ని అనుసరించినవారు ఎవరూ లేరు
  rationale: ‘దావీదు ఇంటి వెనుక ఉండడం’ అనే హీబ్రూ నుడికారాన్ని రాజకీయ విధేయత/పక్షానుసరణగా సహజంగా తెలుగులో అందిస్తుంది.
- source_word: זוּלָתִי שֵׁבֶט יְהוּדָה לְבַדּוֹ
  choice: యూదా గోత్రం మాత్రమే తప్ప
  rationale: זוּלָתִי యొక్క మినహాయింపు భావాన్ని, לְבַדּוֹ యొక్క నొక్కిచెప్పే ఏకైకత్వాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: రాజ్య విభజన తరువాత దావీదు వంశానికి రాజకీయ విధేయతను తెలిపే నుడికారం
  choice: దావీదు వంశాన్ని అనుసరించినవారు ఎవరూ లేరు
  alternative: దావీదు వంశంతో నిలిచినవారు ఎవరూ లేరు
  rationale: אַחֲרֵי అనే నుడికారం ఇక్కడ ప్రధానంగా రాజకీయ అనుసరణ/విధేయతను సూచిస్తుంది. ‘అనుసరించారు’ మూల రూపకాన్ని కొంత నిలుపుతుంది; ‘తో నిలిచారు’ కూడా సాధ్యమైన భావానువాదం కాబట్టి పాదటిప్పణిలో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. ‘దావీదు వంశం’ అనే ప్రయోగం בית דוד యొక్క రాజవంశీయ భావాన్ని సహజంగా అందిస్తుంది. ప్రధాన వాక్యంలో రాజకీయ అనుసరణను ఉంచి, నుడికారంలోని ప్రత్యామ్నాయ భావాన్ని [a] పాదటిప్పణిలో సంరక్షించాం.
