  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם מָ֚ה אַתֶּ֣ם נֽוֹעָצִ֔ים וְ/נָשִׁ֥יב דָּבָ֖ר אֶת הָ/עָ֣ם הַ/זֶּ֑ה אֲשֶׁ֨ר דִּבְּר֤וּ אֵלַ/י֙ לֵ/אמֹ֔ר הָקֵל֙ מִן הָ/עֹ֔ל אֲשֶׁר נָתַ֥ן אָבִ֖י/ךָ עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/009.yaml
  text: And he said to them[a], “What do you advise, that we may answer this people who have spoken to me, saying[b], ‘Lighten the yoke that your father put on us’?”
translation:
  language: te
  text: 'అతడు వారితో ఇలా అన్నాడు: “‘నీ తండ్రి మాపై మోపిన కాడిని[b] తేలిక చేయి’ అని నాతో చెప్పిన ఈ ప్రజలకు మనం ఏమని జవాబివ్వాలి? మీరు ఏ సలహా ఇస్తారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “కాడి” అనేది రాజు ప్రజలపై మోపిన కఠిన శ్రమను, ఇతర బాధ్యతలను సూచించే రూపకం.
    reason: cultural_note
lexical_decisions:
- source_word: מָה אַתֶּם נוֹעָצִים
  choice: మీరు ఏ సలహా ఇస్తారు?
  rationale: వర్తమాన సందర్భంలో సలహా కోరుతున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; బహువచన సంబోధనను కూడా నిలుపుతుంది.
- source_word: וְנָשִׁיב דָּבָר
  choice: మనం ఏమని జవాబివ్వాలో
  rationale: ‘మాటను తిరిగి పంపడం’ అనే హీబ్రూ నుడికారానికి ‘జవాబివ్వడం’ సహజమైన తెలుగు సమానం. వాక్య నిర్మాణం కోసం ఉద్దేశ భావాన్ని ‘ఏమని ... ఇవ్వాలో’గా వ్యక్తం చేసింది.
- source_word: הָעָם הַזֶּה
  choice: ఈ ప్రజలకు
  rationale: עָם అనే ఏకవచన సమూహవాచక భావాన్ని ‘ప్రజలు’తో సహజంగా నిలుపుతూ, הַזֶּה లోని సూచనను ‘ఈ’గా అనువదించింది.
- source_word: אֲשֶׁר דִּבְּרוּ אֵלַי לֵאמֹר
  choice: అని నాతో చెప్పిన
  rationale: ప్రజలు చెప్పిన మాటల విషయాన్ని పరిచయం చేసే సంబంధ వాక్యాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָקֵל
  choice: తేలిక చేయి
  rationale: భారాన్ని తగ్గించమనే ఆజ్ఞార్థక భావాన్ని స్పష్టంగా నిలుపుతుంది; ‘కాడి’ అనే రూపకంతో సహజంగా సరిపోతుంది.
- source_word: מִן הָעֹל
  choice: కాడిని
  rationale: עֹל యొక్క ప్రత్యక్ష చిత్రం మరియు రాజు మోపిన భారానికి సంబంధించిన రూపకాన్ని ‘భారం’గా సపాటుచేయకుండా నిలుపుతుంది.
- source_word: אֲשֶׁר נָתַן אָבִיךָ עָלֵינוּ
  choice: నీ తండ్రి మాపై మోపిన
  rationale: נתן ... על యొక్క ‘పై ఉంచడం’ భావాన్ని కాడి చిత్రానికి సరిపోయే సహజ తెలుగు ‘మోపిన’తో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. హీబ్రూ వాక్యక్రమాన్ని తెలుగుకు అనుగుణంగా మార్చినా, సలహా కోరడం, సమూహవాచకమైన ‘ఈ ప్రజలు,’ మరియు ‘కాడి’ రూపకం నిలుపబడ్డాయి.
