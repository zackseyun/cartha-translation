source:
  edition: WLC
  text: אַ֥ךְ הַ/בָּמ֖וֹת לֹֽא סָ֑רוּ ע֥וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/044.yaml
  text: However[a], the high places were not removed[b]; the people still were sacrificing and burning incense on the high places.
translation:
  language: te
  text: అయితే, ఉన్నత స్థలాలు[a] తొలగించబడలేదు; ప్రజలు ఇంకా ఆ ఉన్నత స్థలాల్లో బలులు అర్పిస్తూ ధూపం కాలుస్తూనే ఉన్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆరాధనా స్థలాలు.” హీబ్రూ పదం స్థానిక ఎత్తైన ఆరాధనా స్థలాలను సూచిస్తుంది; సంప్రదాయంగా వీటిని “ఉన్నత స్థలాలు” అని అనువదిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: ఈ బలులు అనుమతి లేని ప్రదేశాల్లో యెహోవాకు అర్పించబడినవో, లేక విగ్రహారాధనలో భాగంగా అర్పించబడినవో ఈ వచనం స్పష్టంగా చెప్పదు.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: అయితే
  rationale: మునుపటి అనుకూల మూల్యాంకనానికి విరుద్ధమైన అంశాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: הַבָּמוֹת
  choice: ఉన్నత స్థలాలు
  rationale: స్థానిక ఆరాధనా స్థలాలను సూచించే చారిత్రక-మతపరమైన పదాన్ని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా నిలుపుతుంది.
- source_word: לֹא סָרוּ
  choice: తొలగించబడలేదు
  rationale: ఉన్నత స్థలాలు కొనసాగి ఉన్నాయనే సందర్భార్థాన్ని తెలుగులో సహజమైన కర్మణి రూపంలో తెలియజేస్తుంది.
- source_word: עוֹד
  choice: ఇంకా
  rationale: ఆచారం కొనసాగుతూనే ఉందనే భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: הָעָם
  choice: ప్రజలు
  rationale: జనసమూహాన్ని సూచించే సహజమైన సమానార్థకం.
- source_word: מְזַבְּחִים
  choice: బలులు అర్పిస్తూ
  rationale: హీబ్రూ అసమాపక రూపంలోని కొనసాగుతున్న లేదా అలవాటైన క్రియాభావాన్ని నిలుపుతుంది.
- source_word: וּמְקַטְּרִים
  choice: ధూపం వేస్తూనే
  rationale: ఆరాధనా సందర్భంలో ధూపం కాల్చడాన్ని సహజమైన తెలుగు వాడుకలో తెలియజేస్తూ, క్రియ కొనసాగింపును కూడా నిలుపుతుంది.
- source_word: בַּבָּמוֹת
  choice: ఆ ఉన్నత స్థలాల్లో
  rationale: ఆరాధనా కార్యాలు జరిగిన ప్రదేశాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: ఉన్నత స్థలాల్లో జరిగిన ఆరాధన స్వభావం
  choice: బలులు ఎవరికి అర్పించారో పేర్కొనకుండా వాక్యాన్ని వర్ణనాత్మకంగా అనువదించడం
  alternative: ఇది యెహోవాకు అనుమతిలేని ప్రదేశాల్లో చేసిన ఆరాధన అని లేదా ఇతర దేవతలకు చేసిన విగ్రహారాధన అని స్పష్టీకరించడం
  rationale: హీబ్రూ పాఠ్యం ప్రజలు ఉన్నత స్థలాల్లో బలులు అర్పించి ధూపం వేశారని మాత్రమే చెబుతుంది; ఆరాధన ఎవరికి చేయబడిందో స్పష్టంగా చెప్పదు. అందువల్ల మూలంలోని అనిశ్చితిని అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘అర్పిస్తూ… వేస్తూనే ఉన్నారు’ అనే నిర్మాణం హీబ్రూ అసమాపక రూపాలు సూచించే కొనసాగుతున్న అలవాటును ప్రతిబింబిస్తుంది; ‘ఉన్నత స్థలాలు’ చారిత్రక పదాన్ని నిలుపుతుంది.
