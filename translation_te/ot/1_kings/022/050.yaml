reference: 1 Kings 22:50
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָ֠ז אָמַ֞ר אֲחַזְיָ֤הוּ בֶן אַחְאָב֙ אֶל יְה֣וֹשָׁפָ֔ט יֵלְכ֧וּ עֲבָדַ֛/י עִם עֲבָדֶ֖י/ךָ בָּ/אֳנִיּ֑וֹת וְ/לֹ֥א אָבָ֖ה יְהוֹשָׁפָֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/050.yaml
  text: Then Ahaziah son of Ahab said to Jehoshaphat[b][a], “Let my servants go with your servants in the ships,” but Jehoshaphat was not willing.
translation:
  language: te
  text: అప్పుడు అహాబు కుమారుడైన అహజ్యా యెహోషాపాతుతో, “నా సేవకులు నీ సేవకులతో కలిసి ఓడల్లో[a] వెళ్లనివ్వు” అన్నాడు. కానీ యెహోషాపాతు ఒప్పుకోలేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఓడలపై.” సముద్ర ప్రయాణ సందర్భంలో హెబ్రీ ఉపసర్గను రెండు విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “కానీ యెహోషాపాతు నిరాకరించాడు.” హెబ్రీలో అక్షరార్థంగా అతడు సమ్మతించడానికి ఇష్టపడలేదు అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: తరువాతి సంఘటనను పరిచయం చేసే కాలక్రమ సూచనగా సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: אָמַר ... אֶל
  choice: '...తో ... అన్నాడు'
  rationale: ప్రత్యక్ష సంభాషణలో మాట్లాడిన వ్యక్తినీ, సంబోధితునినీ సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది.
- source_word: אֲחַזְיָהוּ בֶן אַחְאָב
  choice: అహాబు కుమారుడైన అహజ్యా
  rationale: పేర్లను తెలుగు బైబిలు సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరిస్తూ, בֶן సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: יֵלְכוּ
  choice: వెళ్లనివ్వు
  rationale: ఈ సందర్భంలోని సంకల్పార్థక/అభ్యర్థన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עֲבָדַי ... עֲבָדֶיךָ
  choice: నా సేవకులు ... నీ సేవకులతో
  rationale: עֶבֶד పదానికి ఇక్కడ రాజుల పరివారంలోని సిబ్బంది అనే విస్తృత భావం ఉంది; బానిసత్వాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా సమాంతర నిర్మాణాన్ని కాపాడుతుంది.
- source_word: עִם
  choice: కలిసి
  rationale: సహవాస లేదా సహకార భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בָּאֳנִיּוֹת
  choice: ఓడల్లో
  rationale: אֳנִיּוֹתను ‘ఓడలు’గా, בְּ ఉపసర్గను అంతర్భావక ‘లో’గా దగ్గరగా అనువదిస్తుంది; ప్రయాణ సందర్భంలో ‘ఓడలపై’ కూడా సాధ్యమే.
- source_word: וְלֹא אָבָה
  choice: కానీ ... ఇష్టం లేదు
  rationale: אָבָה యొక్క ‘సమ్మతించు/ఇష్టపడు’ భావాన్ని ‘నిరాకరించాడు’ అనే మరింత బలమైన వ్యాఖ్యానంగా మార్చకుండా సహజంగా నిలుపుతుంది.
- source_word: יְהוֹשָׁפָט
  choice: యెహోషాపాతు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ప్రత్యక్ష వాక్యాన్ని సహజంగా ఉంచి, హెబ్రీలోని సంకల్పార్థక అభ్యర్థనను మరియు యెహోషాపాతు సమ్మతించకపోవడంలోని మృదువైన పదార్థాన్ని కాపాడింది.
