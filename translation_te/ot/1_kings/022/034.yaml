  text: וְ/אִ֗ישׁ מָשַׁ֤ךְ בַּ/קֶּ֨שֶׁת֙ לְ/תֻמּ֔/וֹ וַ/יַּכֶּה֙ אֶת מֶ֣לֶךְ יִשְׂרָאֵ֔ל בֵּ֥ין הַ/דְּבָקִ֖ים וּ/בֵ֣ין הַ/שִּׁרְיָ֑ן וַ/יֹּ֣אמֶר לְ/רַכָּב֗/וֹ הֲפֹ֥ךְ יָדְ/ךָ֛ וְ/הוֹצִיאֵ֥/נִי מִן הַֽ/מַּחֲנֶ֖ה כִּ֥י הָחֳלֵֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/034.yaml
  text: But a man drew his bow at random and struck the king of Israel between the scale armor and the breastplate[a]. So he said to his charioteer, “Turn your hand and take me out of the camp[d][c][b], for I am wounded.”
translation:
  language: te
  text: అయితే ఒకడు ఎవరినీ ప్రత్యేకంగా గురి పెట్టకుండా[a] విల్లు లాగి, ఇశ్రాయేలు రాజును కవచంలోని ఒక భాగానికీ ఛాతీ కవచానికీ మధ్య[b] కొట్టాడు. అప్పుడు రాజు తన రథసారథితో, “నీ చెయ్యి తిప్పి[c] నన్ను సైనిక శిబిరం నుండి బయటికి తీసుకుపో; ఎందుకంటే నేను గాయపడ్డాను[d]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యాదృచ్ఛికంగా,” “గురి చూడకుండా.” ఇక్కడి హీబ్రూ పదబంధం “తన నిర్దోషిత్వంలో” అని కూడా అర్థమివ్వగలదు; ఈ సందర్భంలో విలుకాడు ఒక నిర్దిష్ట వ్యక్తిని లక్ష్యంగా పెట్టుకోలేదనే భావం ఎక్కువగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా “దెబాకీమ్‌కూ షిర్యాన్‌కూ మధ్య.” ఇవి కవచంలోని వేర్వేరు భాగాలను సూచిస్తాయి; బహుశా అతికించబడిన లేదా కలిపిన భాగం మరియు దేహకవచం కావచ్చు. ఖచ్చితమైన సాంకేతిక అర్థం అనిశ్చితం.
    reason: cultural_note
  - marker: c
    text: హీబ్రూలో “నీ చెయ్యి తిప్పు”; ఇది చేతితో రథాన్ని మళ్లించమనే భావం గల నుడికారం.
    reason: lexical_alternative
  - marker: d
    text: హీబ్రూ క్రియకు “అనారోగ్యానికి గురయ్యాను” లేదా “బలహీనపడ్డాను” అనే అర్థాలు కూడా ఉన్నాయి; ఇక్కడ బాణం తగిలిన సందర్భంలో “గాయపడ్డాను” అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: అయితే ఒకడు
  rationale: సాధారణంగా పేరులేని ఒక వ్యక్తిని సూచించే אִישׁ భావాన్ని ఇస్తూ, וְ అనే సంధి ముందటి సందర్భానికి విరుద్ధమైన కథా మలుపును ఇక్కడ సూచిస్తున్నందున ‘అయితే’ అని అనువదించాం.
- source_word: מָשַׁךְ בַּקֶּשֶׁת
  choice: విల్లు లాగి
  rationale: విల్లును బాణం వేయడానికి వెనక్కి లాగే చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; మూలంలో స్పష్టంగా లేని ‘బాణం వదిలాడు’ అనే మాటను చేర్చలేదు.
- source_word: לְתֻמּוֹ
  choice: ఎవరినీ ప్రత్యేకంగా గురి పెట్టకుండా
  rationale: ఈ యుద్ధ సందర్భంలో నైతిక ‘నిర్దోషిత్వం’ కంటే, నిర్దిష్ట లక్ష్యాన్ని ఉద్దేశించకుండా బాణం వేయడం అనే భావమే సహజం. ‘యాదృచ్ఛికంగా’ కంటే ఈ రూపం ఉద్దేశరాహిత్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיַּכֶּה
  choice: కొట్టాడు
  rationale: נכה యొక్క ప్రాథమిక ‘కొట్టు/తాకు’ భావాన్ని క్రమానుసారంగా నిలుపుతుంది; గాయం ఏర్పడిందనే విషయం వాక్యం చివర స్పష్టమవుతుంది.
- source_word: בֵּין הַדְּבָקִים וּבֵין הַשִּׁרְיָן
  choice: కవచపు పలకలకూ రొమ్ము కవచానికీ మధ్యనున్న చోట
  rationale: రెండు కవచ భాగాల మధ్యనున్న బలహీన ఖాళీని పాఠకుడికి స్పష్టంగా చూపుతుంది. సాంకేతిక పదాల ఖచ్చిత గుర్తింపు అనిశ్చితమైనందున దానిని పాదసూచికలో వెల్లడించాం.
- source_word: לְרַכָּבוֹ
  choice: తన రథసారథితో
  rationale: ఇది రథాన్ని కాక, దాన్ని నడిపే వ్యక్తిని సూచిస్తుంది; ‘రథసారథి’ సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: הֲפֹךְ יָדְךָ
  choice: నీ చెయ్యి తిప్పి
  rationale: హీబ్రూ భాషలోని స్పష్టమైన ‘నీ చెయ్యి తిప్పు’ అనే రూపకాన్ని నిలుపుతుంది; సందర్భంలో అది రథాన్ని మళ్లించడాన్ని సూచిస్తుంది.
- source_word: וְהוֹצִיאֵנִי מִן הַמַּחֲנֶה
  choice: నన్ను సైన్యం మధ్యనుండి బయటికి తీసుకుపో
  rationale: מַחֲנֶה యుద్ధ సందర్భంలో శిబిరం మాత్రమే కాక సైనిక సమూహం లేదా యుద్ధ దళాన్ని కూడా సూచించగలదు. ఇక్కడ జరుగుతున్న పోరాటానికి తగినట్లు ‘సైన్యం మధ్యనుండి’ అని ఇచ్చాం.
- source_word: כִּי הָחֳלֵיתִי
  choice: ఎందుకంటే నేను గాయపడ్డాను
  rationale: ఈ క్రియకు ‘అనారోగ్యంగా/బలహీనంగా అయ్యాను’ అనే విస్తృత భావం ఉన్నా, బాణం తగిలిన తక్షణ సందర్భంలో గాయపడటమే ఉద్దేశం. మూలంలో లేని తీవ్రతను జోడించకుండా ‘గాయపడ్డాను’ అని ఇచ్చాం.
