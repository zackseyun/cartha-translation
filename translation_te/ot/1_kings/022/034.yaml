translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. కవచానికి సంబంధించిన అనిశ్చిత సాంకేతిక పదాలను పాఠ్యంలో సహజంగా ఇచ్చి, మూలంలోని అనిశ్చితిని పాదసూచికలో నిలిపాం. మూలంలో లేని ‘తీవ్రంగా’ వంటి పదాన్ని చేర్చలేదు.
