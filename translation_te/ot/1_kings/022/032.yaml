  terminology: యెహోషాపాతు, ఇశ్రాయేలు, and రథదళాధిపతులు are appropriate. యుద్ధం చేయడానికి adequately represents לְהִלָּחֵם. The directional nuance of וַיָּסֻרוּ עָלָיו is responsibly retained in the wording and footnote.
