id: 1KI.22.32
reference: 1 Kings 22:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֡י כִּ/רְאוֹת֩ שָׂרֵ֨י הָ/רֶ֜כֶב אֶת יְהוֹשָׁפָ֗ט וְ/הֵ֤מָּה אָֽמְרוּ֙ אַ֣ךְ מֶֽלֶךְ יִשְׂרָאֵ֣ל ה֔וּא וַ/יָּסֻ֥רוּ עָלָ֖י/ו לְ/הִלָּחֵ֑ם וַ/יִּזְעַ֖ק יְהוֹשָׁפָֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/032.yaml
  text: And it happened[a], when the commanders of the chariots saw Jehoshaphat, that they said, “Surely he is the king of Israel.” So they turned aside against him to fight[b], but Jehoshaphat cried out.
translation:
  language: te
  text: రథదళాధిపతులు యెహోషాపాతును చూసినప్పుడు, “ఇతడే తప్పకుండా ఇశ్రాయేలు రాజు” అన్నారు. కాబట్టి అతనితో యుద్ధం చేయడానికి అతని వైపుకు తిరిగారు[a]. అప్పుడు యెహోషాపాతు కేక వేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతనిపై దాడి చేయడానికి అతనికి ఎదురుగా తిరిగారు.” హీబ్రూ క్రియ యుద్ధంలో తలపడేందుకు ఒకరి వైపుకు లేదా ఒకరికి విరోధంగా తిరగడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: చూసినప్పుడు
  rationale: వాక్యారంభంలోని וַיְהִי కథన ప్రవాహాన్ని కొనసాగిస్తుంది; దానిని తెలుగులో విడిగా ‘జరిగింది’ అని అనడం అసహజం. כִּרְאוֹת యొక్క కాలార్థాన్ని ‘చూసినప్పుడు’ సహజంగా తెలియజేస్తుంది.
- source_word: שָׂרֵי הָרֶכֶב
  choice: రథదళాధిపతులు
  rationale: שָׂרֵי సైనిక అధికారులను, הָרֶכֶב రథాలను సమష్టిగా రథదళాన్ని సూచిస్తాయి; ఈ సమాసం సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: אַךְ מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: ఇతడే తప్పకుండా ఇశ్రాయేలు రాజు
  rationale: אַךְ ఇక్కడ పరిమితికన్నా దృఢమైన గుర్తింపును సూచిస్తుంది. הוּא యొక్క పుంలింగ ఏకవచన సూచనను ‘ఇతడే’ నిలుపుతుంది.
- source_word: וַיָּסֻרוּ עָלָיו לְהִלָּחֵם
  choice: అతనితో యుద్ధం చేయడానికి అతని వైపుకు తిరిగారు
  rationale: סור + עַל సందర్భంలో ఒకరి వైపుకు లేదా ఒకరికి విరోధంగా తిరగడాన్ని సూచించగలదు; ‘అతని వైపుకు తిరిగారు’ దిశార్థాన్ని నిలుపగా, ‘యుద్ధం చేయడానికి’ శత్రుత్వ ఉద్దేశాన్ని స్పష్టం చేస్తుంది.
- source_word: וַיִּזְעַק
  choice: కేక వేశాడు
  rationale: זעק ఆపదలో చేసే బిగ్గర కేకను సూచిస్తుంది; మూలంలో లేని మాటలను చేర్చకుండా తీవ్రతను తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘రథదళాధిపతులు’ సైనిక సందర్భాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; హీబ్రూ దిశార్థంలోని స్వల్ప సందిగ్ధతను పాదసూచికలో నిలిపాం.
