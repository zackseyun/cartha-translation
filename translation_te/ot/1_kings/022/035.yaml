  yaml_path: translation/ot/1_kings/022/035.yaml
  text: And the battle intensified that day[a], and the king remained standing in the chariot facing Aram, and he died in the evening[c][b]; and the blood from the wound flowed into the bottom of the chariot.
translation:
  language: te
  text: ఆ రోజు యుద్ధం మరింత ఉధృతమైంది.[a] రాజు అరాముకు ఎదురుగా రథంలో నిలబడేలా ఉంచబడ్డాడు.[b] సాయంత్రం అతడు చనిపోయాడు. గాయం నుండి రక్తం రథం అడుగుభాగంలోకి ప్రవహించింది.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ రోజు యుద్ధం ఉధృతమైంది’; అక్షరార్థంగా, ‘యుద్ధం పైకి వెళ్లింది.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘రాజు రథంలో నిలబడి ఉన్నాడు.’ హీబ్రూ రూపం అతడు నిలబడేలా చేయబడ్డాడని లేదా అలాగే నిలబడేలా ఉంచబడ్డాడని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో, ‘రథం ఒడిలోకి’; ఇది రథం లోపలి లేదా దిగువ భాగాన్ని సూచించే రూపకం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲלֶה הַמִּלְחָמָה
  choice: పోరు మరింత తీవ్రమైంది
  rationale: עלה అనే ‘పైకి పోవడం’ క్రియ ‘పోరు’తో వచ్చినప్పుడు పోరు ఉధృతమవడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ఈ భావాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: מָעֳמָד
  choice: నిలబెట్టబడి ఉన్నాడు
  rationale: ఈ నిష్క్రియ రూపం రాజు కేవలం నిలబడ్డాడనే దానికంటే, అతడు నిలబడేలా చేయబడ్డాడు లేదా అలాగే ఉంచబడ్డాడు అనే భావాన్ని సూచిస్తుంది; ఎలా నిలబెట్టారో మాత్రం అనవసరంగా నిర్దిష్టపరచదు.
- source_word: בַּמֶּרְכָּבָה
  choice: రథంలో
  rationale: యుద్ధ రథంలో రాజు ఉన్న స్థానాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: נֹכַח אֲרָם
  choice: అరాముకు ఎదురుగా
  rationale: נֹכַח లోని ‘ఎదురుగా/అభిముఖంగా’ అనే స్థానార్థాన్ని నిలుపుతూ, אֲרָם అనే జాతీయ నామాన్ని ‘అరాము’గా ఉంచుతుంది.
- source_word: וַיָּמָת בָּעֶרֶב
  choice: సాయంత్రానికి అతడు చనిపోయాడు
  rationale: సాయంత్రం సమయానికి మరణం సంభవించిందనే కాలసూచనను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: וַיִּצֶק דַּם הַמַּכָּה
  choice: గాయం నుంచి కారిన రక్తం … ప్రవహించింది
  rationale: יצק యొక్క పోయడం/ప్రవహించడం అనే ద్రవచలన భావాన్ని, గాయం నుంచి వెలువడే రక్తానికి తగిన సహజ తెలుగు ప్రయోగంతో అందిస్తుంది.
- source_word: חֵיק הָרָכֶב
  choice: రథం అడుగు భాగం
  rationale: חֵיק అక్షరార్థంగా ‘ఒడి/వక్షస్థలం’; రథానికి సంబంధించి రక్తం చేరే లోపలి దిగువ భాగాన్ని రూపకంగా సూచిస్తుంది. ‘అడుగు భాగం’ ఆ దృశ్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
