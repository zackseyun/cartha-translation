  language: te
  text: ఆసా అనే తన తండ్రి కాలం నుండి మిగిలి ఉన్న ఆరాధనకు సంబంధించిన వ్యభిచారులను[a] అతడు దేశం నుండి తొలగించాడు.
  philosophy: optimal-equivalence
  footnotes:
