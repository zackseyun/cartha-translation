  rationale: ఈ పదం నిషిద్ధమైన ఆరాధనా సంబంధ లైంగిక ఆచారంతో ముడిపడిన వ్యక్తులను సూచిస్తుంది. ప్రధాన పాఠంలోని ఎంపిక ఆరాధనా మరియు లైంగిక పార్శ్వాలను తెలియజేస్తుంది; హెబ్రీ రూపం పుంలింగ ఏకవచనంలో ఉన్న విషయాన్ని పాదసూచికలో భద్రపరుస్తుంది. ‘ఆరాధనా సేవకులు’ లైంగిక కోణాన్ని మరుగుపరచవచ్చు.
