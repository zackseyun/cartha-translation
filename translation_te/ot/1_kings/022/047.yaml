    text: లేదా, ‘ఆరాధనకు సంబంధించిన పురుష వ్యభిచారులను.’ హెబ్రీ పదం קָדֵשׁ పుంలింగ రూపంలో ఉంది; నిషిద్ధమైన ఆరాధనతో సంబంధమున్న లైంగిక ఆచారంలో పాల్గొన్న వ్యక్తులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  choice: మిగిలిపోయిన ... అందరినీ
  rationale: יֶתֶר ఇంతకుముందు తొలగించబడకుండా ఇంకా మిగిలిన సమూహాన్ని సూచిస్తుంది. తెలుగులో ‘మిగిలిపోయిన ... అందరినీ’ అనేది సహజంగా ఉండి, మిగిలినవారి సమష్టి భావాన్ని తెలియజేస్తుంది.
- source_word: הַקָּדֵשׁ
  choice: ఆరాధనా వ్యభిచారులు
  rationale: ఈ చారిత్రక సందర్భంలో קָדֵשׁ నిషిద్ధమైన ఆరాధనా సంబంధ లైంగిక ఆచారంలో పాల్గొన్న పురుష వ్యక్తిని లేదా అలాంటి వర్గాన్ని సూచిస్తుంది. ‘ఆరాధనా వ్యభిచారులు’ అనే పదబంధం ఆరాధనా సందర్భాన్నీ లైంగిక కోణాన్నీ తెలియజేస్తుంది; సంప్రదాయబద్ధమైనప్పటికీ పదార్థపరంగా తప్పుదారి పట్టించే పదాలను నివారిస్తుంది.
- source_word: אֲשֶׁר נִשְׁאַר
  choice: మిగిలిపోయిన
  rationale: ఈ సంబంధవాక్యం ఆసా కాలం నుండి ఇంకా ఉనికిలో ఉన్నవారిని గుర్తిస్తుంది. ‘మిగిలిపోయిన’ అనేది נִשְׁאַר లోని ఫలితస్థితి భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בִּימֵי אָסָא אָבִיו
  choice: తన తండ్రి ఆసా కాలంలో
  rationale: ఈ పదబంధం వారు ఏ కాలంలో మిగిలి ఉన్నారో సూచిస్తుంది. ‘తన తండ్రి ఆసా కాలంలో’ మూలంలోని బంధుత్వాన్నీ కాలసూచననూ స్పష్టంగా నిలుపుతుంది.
- source_word: בִּעֵר
  choice: తొలగించాడు
  rationale: בער ఇక్కడ מן הארץ తో కలిసి దేశం నుండి తీసివేయడం లేదా నిర్మూలించడం అనే భావాన్ని ఇస్తుంది. విధానం చెప్పబడనందున ‘తొలగించాడు’ అనేది కాల్చివేయడం లేదా చంపడం అనే నిరాధార భావాన్ని చేర్చదు.
- source_word: מִן הָאָרֶץ
  choice: దేశంలోనుండి
  rationale: ఈ సందర్భంలో הָאָרֶץ భూమి అంతటినీ కాక యూదా దేశప్రాంతాన్ని సూచిస్తుంది. అందువల్ల ‘దేశంలోనుండి’ సందర్భానుకూలంగా ఉంది.
theological_decisions:
- issue: నైతికంగా, సాంస్కృతికంగా సున్నితమైన సందర్భంలో קָדֵשׁ అనువాదం
  choice: ఆరాధనా వ్యభిచారులు
