  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని పుంలింగ సూచన ప్రధాన వాక్యాన్ని భారంగా చేయకుండా పాదసూచికలో నిలుపబడింది.
