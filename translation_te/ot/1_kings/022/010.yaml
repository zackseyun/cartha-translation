id: 1KI.22.10
reference: 1 Kings 22:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מֶ֣לֶךְ יִשְׂרָאֵ֡ל וִֽ/יהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֡ה יֹשְׁבִים֩ אִ֨ישׁ עַל כִּסְא֜/וֹ מְלֻבָּשִׁ֤ים בְּגָדִים֙ בְּ/גֹ֔רֶן פֶּ֖תַח שַׁ֣עַר שֹׁמְר֑וֹן וְ/כָ֨ל הַ/נְּבִיאִ֔ים מִֽתְנַבְּאִ֖ים לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/010.yaml
  text: The king of Israel and Jehoshaphat king of Judah were sitting[a], each on his throne, clothed in garments, at the threshing floor at the entrance of the gate of Samaria, and all the prophets were prophesying before them.
translation:
  language: te
  text: ఇశ్రాయేలు రాజు, యూదా రాజైన యెహోషాపాతు సమరయ ద్వారపు ప్రవేశస్థలం వద్దనున్న నూర్పిడి కళ్లంలో, ఒక్కొక్కరు తమ సింహాసనంపై కూర్చొని, వస్త్రాలు ధరించి ఉన్నారు. ప్రవక్తలందరూ వారి ముందు ప్రవచిస్తూ ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: ప్రారంభంలోని וְ కథన అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో సందర్భానుసారంగా వాక్యనిర్మాణమే ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది కాబట్టి అదనంగా ‘ఇప్పుడు’ అని చేర్చలేదు.
- source_word: וִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన యెహోషాపాతు
  rationale: పేరును ప్రాచుర్యంలో ఉన్న తెలుగు రూపంలో ఉంచి, రాజబిరుదును సహజమైన విశేషణ నిర్మాణంతో కలిపాం.
- source_word: יֹשְׁבִים
  choice: కూర్చుని ఉన్నారు
  rationale: హీబ్రూ కృదంతం దృశ్యంలో కొనసాగుతున్న స్థితిని సూచిస్తుంది; తెలుగు సంయుక్త క్రియ ఆ కొనసాగింపు భావాన్ని నిలుపుతుంది.
- source_word: אִישׁ עַל־כִּסְאוֹ
  choice: తమ తమ సింహాసనాల మీద
  rationale: אִישׁ ఇక్కడ విభజనార్థకంగా ‘ఒక్కొక్కరు/తమ తమ’ అని అర్థం; రాజసందర్భంలో כִּסֵּאను ‘సింహాసనం’గా అనువదించడం సముచితం.
- source_word: מְלֻבָּשִׁים בְּגָדִים
  choice: వస్త్రధారులై[a]
  rationale: మూలంలో వస్త్రాల స్వరూపం ‘రాజవస్త్రాలు’ అని నిర్దిష్టంగా లేదు. పునరుక్తిని నివారిస్తూ హీబ్రూ భావాన్ని సహజమైన తెలుగులో నిలిపాం; అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: בְּגֹרֶן
  choice: నూర్పిడి కళ్లం వద్ద
  rationale: גֹּרֶן ధాన్యాన్ని నూర్చే కళ్లాన్ని సూచిస్తుంది; ‘వద్ద’ స్థలసూచకంగా సహజంగా ఉంది.
- source_word: פֶּתַח שַׁעַר שֹׁמְרוֹן
  choice: సమరయ ద్వార ప్రవేశం దగ్గర ఉన్న
  rationale: మూలంలోని స్థల సంబంధాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలిపి, ‘సమరయ ద్వారం’ అనే నిర్మాణాన్ని నిలిపాం.
- source_word: וְכָל הַנְּבִיאִים מִתְנַבְּאִים לִפְנֵיהֶם
  choice: ప్రవక్తలందరూ వారి ముందు ప్రవచిస్తూ ఉన్నారు
  rationale: ‘అందరూ’ అనే సమగ్రతను, వారి సమక్షంలో కొనసాగుతున్న ప్రవచన చర్యను రెండింటినీ నిలిపాం.
