translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సులభంగా అర్థమయ్యే కథన శైలిని వాడాం. హీబ్రూ కృదంతాల కొనసాగింపు భావాన్ని ‘కూర్చుని ఉన్నారు,’ ‘ప్రవచిస్తూ ఉన్నారు’ అనే రూపాలతో నిలిపాం. మూలంలో లేని ‘రాజవస్త్రాలు’ అనే స్పష్టీకరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
