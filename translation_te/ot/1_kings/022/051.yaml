translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన రాజవృత్తాంత శైలిని ఉంచుతూ, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా తీర్చిదిద్దాం. మరణాన్ని సూచించే హీబ్రూ నుడికారాన్ని, అలాగే ‘తండ్రి/పూర్వీకుడు’ అనే వంశావళి విస్తృతార్థాన్ని పాదసూచికలతో సంరక్షించాం.
