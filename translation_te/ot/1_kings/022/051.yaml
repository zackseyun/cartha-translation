source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב יְהֽוֹשָׁפָט֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵר֙ עִם אֲבֹתָ֔י/ו בְּ/עִ֖יר דָּוִ֣ד אָבִ֑י/ו וַ/יִּמְלֹ֛ךְ יְהוֹרָ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/051.yaml
  text: And Jehoshaphat slept with his fathers and was buried with his fathers in the city of David his father[b][a], and Jehoram his son became king in his place.
translation:
  language: te
  text: యెహోషాపాతు తన పితరులతో కలిసి నిద్రించాడు[a]; అతడు తన పితరులతో కలిసి తన తండ్రియైన దావీదు[b] నగరంలో పాతిపెట్టబడ్డాడు. అతని కుమారుడు యెహోరాము అతని స్థానంలో రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తన పితరులతో కలిసి నిద్రించాడు’ అనేది మరణాన్ని సూచించే సంప్రదాయ హీబ్రూ నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘తండ్రి’ అనే హీబ్రూ వంశావళి సంబంధ పదం ‘పూర్వీకుడు’ లేదా ‘మూలపురుషుడు’ అనే అర్థాన్నీ ఇవ్వగలదు.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: నిద్రించాడు
  rationale: రాజుల మరణవృత్తాంతాల్లో ‘పితరులతో కూడ నిద్రించడం’ అనేది మరణాన్ని సూచించే సంప్రదాయ హీబ్రూ నుడికారం. ‘చనిపోయాడు’ అని అర్థాన్ని మాత్రమే చెప్పకుండా మూలంలోని సాహిత్య సూత్రాన్ని నిలిపింది.
- source_word: עִם אֲבֹתָיו
  choice: తన పితరులతో కూడ
  rationale: ఇది రాజవంశ సంబంధమైన స్థిర ప్రయోగం. ‘పితరులు’ అనే పదం హీబ్రూ రూపాన్ని, పూర్వీకులనే విస్తృత భావాన్ని రెండింటినీ మోయగలదు.
- source_word: וַיִּקָּבֵר
  choice: పాతిపెట్టబడ్డాడు
  rationale: నిఫాల్ కర్మణి రూపాన్ని సహజమైన తెలుగు కర్మణి ప్రయోగంతో వ్యక్తం చేస్తుంది; సమాధి విధానానికి సంబంధించి మూలంలో లేని వివరాన్ని చేర్చదు.
- source_word: בְּעִיר דָּוִד
  choice: దావీదు నగరంలో
  rationale: హీబ్రూ సమాసబంధాన్ని సహజమైన తెలుగు స్థలనామ రూపంలో తెలియజేస్తుంది.
- source_word: אָבִיו
  choice: తన పితరుడైన
  rationale: దావీదు యెహోషాపాతుకు తక్షణ తండ్రి కాదు; హీబ్రూ אָב వంశావళి సందర్భంలో పూర్వీకుడినీ సూచించగలదు. ‘పితరుడు’ మూలంలోని కుటుంబ సంబంధ భాషను నిలుపుతూ తెలుగులో విస్తృత వంశార్థానికి అవకాశం ఇస్తుంది.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: ఇక్కడ క్రియ పరిపాలన కాలమంతటినీ కాక రాజ్యాధికార స్వీకరణను సూచిస్తుంది. ‘రాజయ్యాడు’ వారసత్వంగా సింహాసనం అధిష్ఠించిన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: అధికార స్థానంలో వారసుడిగా రావడాన్ని సహజంగా, మూలార్థానికి దగ్గరగా వ్యక్తం చేస్తుంది.
