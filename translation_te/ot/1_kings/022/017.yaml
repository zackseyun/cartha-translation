source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר רָאִ֤יתִי אֶת כָּל יִשְׂרָאֵל֙ נְפֹצִ֣ים אֶל הֶ/הָרִ֔ים כַּ/צֹּ֕אן אֲשֶׁ֥ר אֵין לָ/הֶ֖ם רֹעֶ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ לֹֽא אֲדֹנִ֣ים לָ/אֵ֔לֶּה יָשׁ֥וּבוּ אִישׁ לְ/בֵית֖/וֹ בְּ/שָׁלֽוֹם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/017.yaml
  text: And he said[a], “I saw all Israel scattered on the mountains, like sheep that have no shepherd. And Yahweh said, ‘These have no master[b]; let each man return to his house in peace.’”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “ఇశ్రాయేలు అంతా కాపరి లేని గొర్రెల్లా కొండల మీద చెదరిపోయి ఉండగా నేను చూశాను. అప్పుడు యాహ్వే, ‘వీరికి అధిపతి లేడు[a]. ప్రతి పురుషుడూ తన ఇంటికి క్షేమంగా తిరిగి వెళ్లాలి[b]’ అని అన్నాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వీరికి అధిపతులు లేరు.” హీబ్రూ పదం రూపపరంగా బహువచనం; సందర్భంలో అది ఇశ్రాయేలుకు పాలించే అధికారం లేకపోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ప్రతి ఒక్కరూ తమ ఇంటికి క్షేమంగా తిరిగి వెళ్లాలి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְפֹצִים
  choice: చెదరిపోయి ఉండడం
  rationale: ఈ కృదంతం విస్తరించి, చెల్లాచెదురుగా ఉన్న స్థితిని సూచిస్తుంది. ఓడిపోయి నాయకుడు లేకుండా చెదరిపోయిన సైన్యపు దృశ్యాన్ని ఈ సహజమైన తెలుగు వ్యక్తీకరణ నిలుపుతుంది.
- source_word: אֶל הֶהָרִים
  choice: కొండల మీద
  rationale: אֶל సాధారణంగా ‘వైపు’ అని అర్థమిచ్చినా, చెదరిపోవడాన్ని తెలిపే ఈ సందర్భంలో స్థలార్థం సహజం. దర్శన దృశ్యానికి ‘కొండల మీద’ స్పష్టంగా సరిపోతుంది.
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶם רֹעֶה
  choice: కాపరి లేని గొర్రెల్లా
  rationale: మూలంలోని సుపరిచితమైన ఉపమానాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో నేరుగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֲדֹנִים
  choice: యజమాని
  rationale: హీబ్రూలో రూపం బహువచనమైనా, సందర్భంలో సైన్యానికి ఇక పాలకుడైన అధిపతి—ముఖ్యంగా రాజు—లేడనే భావం ఉంది. ‘యజమాని’ అధికార సంబంధాన్ని నిలుపుతూ, దైవ బిరుదుతో గందరగోళాన్ని తగ్గిస్తుంది; బహువచన రూపాన్ని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: יָשׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: ప్రతి పురుషుడూ తన ఇంటికి తిరిగి వెళ్లాలి
  rationale: ఇక్కడ అసంపూర్ణ క్రియకు ఆదేశార్థక ఛాయ ఉంది. אִישׁ అనే పురుషలింగ పంపిణీ పదాన్ని ‘ప్రతి పురుషుడూ’ అని స్పష్టంగా నిలిపింది.
- source_word: בְּשָׁלוֹם
  choice: క్షేమంగా
  rationale: ఈ సందర్భంలో అది సురక్షితంగా, హాని లేకుండా తిరిగి వెళ్లడాన్ని సూచిస్తుంది. ‘క్షేమంగా’ ఆధునిక తెలుగులో సహజంగా ఉండి మూల నుడికార భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: వచనంలో వ్యక్తిగత దైవ నామమే ఉంది. దానిని బిరుదుగా మార్చకుండా మూల ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణను ఉపయోగించింది.
- issue: אֲדֹנִים పదంలోని సంఖ్య, భావం
  choice: వీరికి యజమాని లేడు
  alternative: వీరికి యజమానులు లేరు; వీరికి అధిపతి లేడు
  rationale: రూపపరంగా బహువచనం ఉన్నప్పటికీ, సందర్భం ఇశ్రాయేలు సైన్యానికి పాలక శిరస్సైన రాజు లేకపోవడాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన ఏకవచనాన్ని ఉంచి, మూలంలోని బహువచనాన్ని పాదటిప్పణిలో భద్రపరిచింది.
- issue: పంపిణీ అర్థంలోని אִישׁ పురుషలింగం
  choice: ప్రతి పురుషుడూ
  alternative: ప్రతి ఒక్కరూ
  rationale: మూలంలో పురుషలింగ ఏకవచన నామవాచకం వాడబడింది; సైన్యంలో ఉన్న పురుషులను ఉద్దేశించిన సందర్భానికి అనుగుణంగా దాన్ని తటస్థీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే దర్శనపు గంభీరతను నిలుపుకుంది. ‘గొర్రెల్లా,’ ‘కొండల మీద,’ ‘క్షేమంగా’ వంటి ప్రస్తుత వాడుక రూపాలు ఎంచుకున్నాయి. పాదటిప్పణి సూచికలు సంబంధిత పదబంధాల వెంటనే ఉంచబడ్డాయి.
