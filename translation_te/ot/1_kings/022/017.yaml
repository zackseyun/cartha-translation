  to: 'అతడు ఇలా అన్నాడు: “ఇశ్రాయేలు అంతా కాపరి లేని గొర్రెల్లా కొండల మీద చెదరిపోయి ఉండగా నేను చూశాను. అప్పుడు యాహ్వే, ‘వీరికి అధిపతి లేడు[a]. ప్రతి పురుషుడూ తన ఇంటికి క్షేమంగా తిరిగి వెళ్లాలి[b]’ అని అన్నాడు.”'
