  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ הַ/מֶּ֔לֶךְ עַד כַּ/מֶּ֥ה פְעָמִ֖ים אֲנִ֣י מַשְׁבִּעֶ֑/ךָ אֲ֠שֶׁר לֹֽא תְדַבֵּ֥ר אֵלַ֛/י רַק אֱמֶ֖ת בְּ/שֵׁ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/016.yaml
  text: Then the king said to him[a], “How many times must I make you swear that you tell me nothing but the truth in the name of Yahweh?”
translation:
  language: te
  text: అప్పుడు రాజు అతనితో, “యెహోవా పేరున నాతో నిజం తప్ప మరేమీ చెప్పకూడదని నేను నిన్ను ఎన్నిసార్లు ప్రమాణం చేయించాలి[a]?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను నిన్ను ఎన్నిసార్లు ప్రమాణబద్ధుణ్ణి చేయాలి?” హీబ్రూ క్రియకు ఒకరితో ప్రమాణం చేయించడం లేదా అతణ్ణి ప్రమాణబద్ధుణ్ణి చేయడం అనే అర్థం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-వరుస కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: హీబ్రూలో వ్యక్తిపేరు కాక బిరుదే ఉంది; తెలుగులో నిర్దిష్టత సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: עַד כַּמֶּה פְעָמִים
  choice: ఎన్నిసార్లు
  rationale: పునరావృతంపై రాజుకున్న విసుగును తెలిపే సహజమైన తెలుగు ప్రశ్నారూపం.
- source_word: מַשְׁבִּעֶךָ
  choice: నేను నీతో ... ప్రమాణం చేయించాలి
  rationale: שׁבע హిఫీల్ రూపం ఎదుటివానితో ప్రమాణం చేయించడం లేదా అతణ్ణి ప్రమాణబద్ధుణ్ణి చేయడం అనే causative భావాన్ని కలిగిస్తుంది.
- source_word: אֲשֶׁר לֹא תְדַבֵּר אֵלַי רַק אֱמֶת
  choice: నిజం తప్ప మరేమీ నాతో చెప్పకూడదని
  rationale: హీబ్రూ నిషేధాత్మక నిర్మాణాన్ని, రַק ఇచ్చే ప్రత్యేకతను సహజమైన తెలుగులో నిలుపుతుంది; דּבר యొక్క మాటలాడే భావం ‘చెప్పు’లో స్పష్టంగా వ్యక్తమవుతుంది.
- source_word: בְּשֵׁם יְהוָה
  choice: యెహోవా పేరట
  rationale: దైవనామాన్ని లిప్యంతరీకరించి, ఆ నామాన్ని ఆధారంగా చేసుకొని లేదా ఆ నామాధికారంలో పలకడాన్ని ‘పేరట’ సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాక చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచడం మూలంలోని ప్రత్యేక నామాన్ని కాపాడుతుంది.
- issue: ప్రమాణం యొక్క సంబంధం
  choice: యెహోవా పేరట నిజం చెప్పాలని మీకాతో ప్రమాణం చేయించడం
  alternative: రాజు యెహోవా పేరట మీకాయాను ఆజ్ఞాపించడం
  rationale: מַשְׁבִּיעֶךָ యొక్క causative భావాన్ని ప్రధానంగా ఉంచాం; వాక్యం ప్రమాణానికి దైవనామం ఇచ్చే అధికారాన్ని కూడా నిలుపుతుంది, కానీ ప్రమాణం ఎవరు ఉచ్చరిస్తారో అవసరానికి మించి నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథనశైలి. రాజు యొక్క విసుగును ప్రశ్నారూపం ద్వారా నిలిపి, మూలంలోని దైవనామం మరియు ప్రమాణభావాన్ని స్పష్టంగా ఉంచాం.
