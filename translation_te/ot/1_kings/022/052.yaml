  source_fidelity: 'హీబ్రూ రాజ్యారోహణ సూత్రంలోని ప్రధాన అంశాలన్నీ సరిగా ప్రతిఫలించాయి: అహాబు కుమారుడైన అహజ్యా, సమరయలో ఇశ్రాయేలుకు రాజవడం; అది యూదా రాజైన యెహోషాపాతు పదిహేడవ సంవత్సరంలో జరగడం; ఆపై అతడు రెండు సంవత్సరాలు ఇశ్రాయేలును పరిపాలించడం. మొదటి మָלַךְ యొక్క రాజ్యారోహణ భావాన్నీ, రెండవ וַיִּמְלֹךְ యొక్క పాలనాకాల సంగ్రహాన్నీ వేర్వేరు తెలుగు క్రియలతో తగినట్లుగా చూపింది.'
