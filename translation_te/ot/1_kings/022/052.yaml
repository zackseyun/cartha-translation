id: 1KI.22.52
reference: 1 Kings 22:52
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֲחַזְיָ֣הוּ בֶן אַחְאָ֗ב מָלַ֤ךְ עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן בִּ/שְׁנַת֙ שְׁבַ֣ע עֶשְׂרֵ֔ה לִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ עַל יִשְׂרָאֵ֖ל שְׁנָתָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/052.yaml
  text: Ahaziah son of Ahab became king over Israel in Samaria in the seventeenth year of Jehoshaphat king of Judah, and he reigned over Israel two years.
translation:
  language: te
  text: అహాబు కుమారుడైన అహజ్యా, యూదా రాజైన యెహోషాపాతు పరిపాలనలో పదిహేడవ సంవత్సరంలో సమరయలో ఇశ్రాయేలుకు రాజయ్యాడు. అతడు ఇశ్రాయేలును రెండు సంవత్సరాలు పరిపాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: రాజయ్యాడు
  rationale: ఇక్కడ క్రియ అహజ్యా సింహాసనాన్ని అధిష్ఠించిన సంగతిని తెలియజేస్తుంది; ఆధునిక తెలుగులో ‘రాజయ్యాడు’ సహజంగా, సంక్షిప్తంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు / ఇశ్రాయేలును
  rationale: מָלַךְ עַל అనే ప్రయోగం ఇశ్రాయేలుపై రాజాధికారాన్ని సూచిస్తుంది. రాజ్యారోహణ వాక్యంలో ‘ఇశ్రాయేలుకు రాజయ్యాడు’, పాలనాకాల వాక్యంలో సహజ తెలుగు కోసం ‘ఇశ్రాయేలును ... పరిపాలించాడు’ అని ఇచ్చాం.
- source_word: בְּשֹׁמְרוֹן
  choice: సమరయలో
  rationale: בְּ ఇక్కడ స్థలాన్ని సూచిస్తుంది; సమరయ ఇశ్రాయేలు రాజధాని, రాజాసనం ఉన్న ప్రదేశం.
- source_word: בִּשְׁנַת שְׁבַע עֶשְׂרֵה לִיהוֹשָׁפָט
  choice: యెహోషాపాతు పరిపాలనలో పదిహేడవ సంవత్సరంలో
  rationale: ఇది సమకాలిక రాజుల పరిపాలనా సంవత్సరాన్ని తెలిపే సూత్రబద్ధమైన ప్రయోగం. ‘పరిపాలనలో’ అనేది లְ సూచించే కాలసంబంధాన్ని తెలుగులో స్పష్టంగా చేస్తుంది.
- source_word: וַיִּמְלֹךְ
  choice: అతడు ... పరిపాలించాడు
  rationale: మొదటి క్రియ రాజ్యారోహణను తెలిపిన తరువాత, ఈ క్రియ పాలన కొనసాగిన కాలాన్ని సంగ్రహిస్తుంది; ‘పరిపాలించాడు’ పునరుక్తిని నివారిస్తూ అర్థాన్ని కాపాడుతుంది.
- source_word: שְׁנָתָיִם
  choice: రెండు సంవత్సరాలు
  rationale: హీబ్రూ ద్వివచన రూపం ఖచ్చితంగా రెండు సంవత్సరాల కాలాన్ని సూచిస్తుంది.
- source_word: אֲחַזְיָהוּ בֶן אַחְאָב
  choice: అహాబు కుమారుడైన అహజ్యా
  rationale: వంశసంబంధాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంలో నిలిపి, వ్యక్తినామాలను ప్రాచుర్యంలో ఉన్న బైబిలు తెలుగు రూపాల్లో ఇచ్చాం.
- source_word: מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన
  rationale: ఇది యెహోషాపాతును గుర్తించే బిరుదు; తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా సంబంధవాచక రూపంలో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన చారిత్రక-వివరణాత్మక శైలి. హీబ్రూ రాజ్యారోహణ ప్రకటన మరియు పాలనాకాల సంగ్రహం మధ్య తేడాను ‘రాజయ్యాడు’/‘పరిపాలించాడు’ ద్వారా నిలిపాం. పాదసూచికలు అవసరం లేదు.
