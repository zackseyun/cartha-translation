source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אֵצֵא֙ וְ/הָיִ֨יתִי֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאָ֑י/ו וַ/יֹּ֗אמֶר תְּפַתֶּה֙ וְ/גַם תּוּכָ֔ל צֵ֖א וַ/עֲשֵׂה כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/022.yaml
  text: And he said[a], ‘I will go out and be a lying spirit in the mouth of all his prophets.’ And he said, ‘You will entice him, and you will also prevail[b]. Go out and do so.’
translation:
  language: te
  text: అప్పుడు ఆ ఆత్మ, “నేను బయలుదేరి, అతని ప్రవక్తలందరి నోటిలో అబద్ధపు ఆత్మగా ఉంటాను[a]” అన్నది. అప్పుడు యెహోవా, “నువ్వు అతన్ని ప్రలోభపెడతావు; అందులో సఫలమవుతావు కూడా[b]. బయలుదేరి అలాగే చేయి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మోసపు ఆత్మగా ఉంటాను.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అతన్ని మోసగిస్తావు” లేదా “అతన్ని ఒప్పిస్తావు; పైచేయి సాధిస్తావు కూడా.” హీబ్రూ క్రియలు సందర్భాన్ని బట్టి ప్రలోభపెట్టడం, ఒప్పించడం, మోసగించడం, సామర్థ్యం కలిగి ఉండడం లేదా పైచేయి సాధించడం అనే భావాలను ఇవ్వగలవు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: నేను బయలుదేరి
  rationale: יצא అనే క్రియలోని బయటికి వెళ్లే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; తరువాతి ఆజ్ఞలోనూ ఇదే పదబంధాన్ని పునరావృతం చేశాం.
- source_word: וְהָיִיתִי
  choice: ఉంటాను
  rationale: ఆ ఆత్మ స్వీకరించబోయే పాత్రను సూచించే היה క్రియను సందర్భానుగుణంగా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: רוּחַ שֶׁקֶר
  choice: అబద్ధపు ఆత్మ
  rationale: శקרుతో లక్షణీకరించబడిన ఆత్మ అనే భావాన్ని సూటిగా, అర్థమయ్యేలా ఇస్తుంది; ‘మోసపు ఆత్మ’ అనే భావసాధ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: בְּפִי
  choice: నోటిలో
  rationale: ప్రవక్తల ద్వారా పలికే మాటను సూచించే హీబ్రూ శరీరాంగ రూపకాన్ని నిలుపుతుంది.
- source_word: כָּל נְבִיאָיו
  choice: అతని ప్రవక్తలందరి
  rationale: כָּל యొక్క సమగ్ర భావాన్నీ, 3ms స్వామ్య ప్రత్యయాన్నీ స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: תְּפַתֶּה
  choice: నువ్వు అతన్ని ప్రలోభపెడతావు
  rationale: פתה పియేల్ రూపంలోని ఆకర్షించి ఒక చర్యవైపు నడిపించే భావాన్ని నిలుపుతుంది; ‘మోసగించు’ లేదా ‘ఒప్పించు’ అనే భావసాధ్యతలను పాదటిప్పణిలో తెలిపాం.
- source_word: וְגַם תּוּכָל
  choice: అందులో సఫలమవుతావు కూడా
  rationale: יכל ఇక్కడ సామర్థ్యంతో పాటు కార్యసిద్ధిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘సఫలమవుతావు’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: צֵא
  choice: బయలుదేరు
  rationale: יצא యొక్క ఆజ్ఞార్థక రూపాన్ని, ముందు ఆ ఆత్మ పలికిన ‘బయలుదేరి’తో ఉన్న శబ్దసంబంధాన్ని నిలుపుతుంది.
- source_word: וַעֲשֵׂה כֵן
  choice: అలాగే చేయి
  rationale: עשה כן అనే సంక్షిప్త ఆజ్ఞను సహజమైన, గౌరవప్రదమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: మోసంతో సంబంధమున్న పరలోక సంభాషణలో దేవుని అనుమతి లేదా ఆదేశం
  choice: ఆ ఆత్మ ప్రతిపాదించిన చర్యకు యెహోవా నేరుగా ‘బయలుదేరి అలాగే చేయి’ అని చెప్పినట్లు అనువదించాం.
  alternative: దీనిని కేవలం నిష్క్రియాత్మక అనుమతిగా మృదువుగా వ్యాఖ్యానించడం.
  rationale: హీబ్రూ పాఠంలోని ప్రత్యక్ష ఆజ్ఞను తగ్గించకుండా, దేవుని సార్వభౌమత్వం మరియు ఆ ఆత్మ యొక్క ద్వితీయ కార్యసాధకత్వం మధ్య ఉన్న వేదాంత ఉద్రిక్తతను పాఠంలో ఉన్నట్లే నిలిపాం.
- issue: అస్పష్టంగా ఉన్న కర్తలను తెలుగులో గుర్తించడం
  choice: మొదటి వక్తను ‘ఆ ఆత్మ’గా, రెండవ వక్తను ‘యెహోవా’గా సందర్భం ఆధారంగా స్పష్టపరిచాం.
  alternative: రెండు చోట్లా కేవలం ‘అతడు అన్నాడు’ అని ఉంచడం.
  rationale: హీబ్రూలో లింగసూచక సర్వనామాలు ఉన్నా, తెలుగులో కర్తను చెప్పకపోతే వక్తల మార్పు అస్పష్టమవుతుంది. ముందరి వచన సందర్భం నుంచి గుర్తింపులను చేర్చడం భావాన్ని మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని వాడాం. ప్రత్యక్ష సంభాషణ సహజంగా ఉండేందుకు ‘నువ్వు’ అనే ఏకవచన సంబోధనను ఉంచాం. హీబ్రూ ‘నోటిలో’ అనే రూపకాన్ని నిలిపి, వక్తల గుర్తింపును సమీప సందర్భం ఆధారంగా స్పష్టపరిచాం.
