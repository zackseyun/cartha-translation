id: 1KI.22.26
reference: 1 Kings 22:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל קַ֚ח אֶת מִיכָ֔יְהוּ וַ/הֲשִׁיבֵ֖/הוּ אֶל אָמֹ֣ן שַׂר הָ/עִ֑יר וְ/אֶל יוֹאָ֖שׁ בֶּן הַ/מֶּֽלֶךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/026.yaml
  text: Then the king of Israel said[a], “Take Micaiah and return him to Amon, the governor of the city, and to Joash the king’s son.”
translation:
  language: te
  text: 'అప్పుడు ఇశ్రాయేలు రాజు ఇలా అన్నాడు: “మీకాయాను తీసుకొని, అతనిని పట్టణాధికారి[a] ఆమోను దగ్గరకు, రాజు కుమారుడైన యోవాషు దగ్గరకు తిరిగి తీసుకెళ్లండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పట్టణ సేనాధిపతి” లేదా “పట్టణ ప్రధాన అధికారి.” హీబ్రూ పదం పౌర లేదా సైనిక నాయకుని సూచించవచ్చు.
    reason: శַׂר הָעִיר అనే హోదాలో ఉన్న పౌర/సైనిక అనిశ్చితిని కాపాడటానికి.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... ఇలా అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘అప్పుడు’ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: హీబ్రూ మూలంలో వ్యక్తిపేరు కాకుండా బిరుదే ఉంది; అందువల్ల దానినే నేరుగా ఉంచాం.
- source_word: קַח
  choice: తీసుకెళ్లండి
  rationale: לקח సాధారణంగా ‘తీసుకో/తీసుకెళ్లు’ అనే అర్థం ఇస్తుంది. సందర్భానికి అనుగుణంగా గౌరవార్థక బహువచన ఆజ్ఞారూపం సహజంగా ఉంది; ‘పట్టుకోండి’ అంటే మూలంలో లేని బలప్రయోగ భావం పెరగవచ్చు.
- source_word: מִיכָיְהוּ
  choice: మీకాయా
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగులో సహజమైన ధ్వన్యంతరీకరణతో ఇచ్చాం.
- source_word: וַהֲשִׁיבֵהוּ
  choice: తిరిగి తీసుకెళ్లండి
  rationale: שוב హిఫీల్ రూపం ‘అతణ్ణి తిరిగి వెళ్లేలా చేయు/తిరిగి తీసుకెళ్లు’ అనే కారణార్థాన్ని ఇస్తుంది; తెలుగు వాక్యంలో ఇదే సహజమైన ప్రయోగం.
- source_word: אָמֹן
  choice: ఆమోను
  rationale: వ్యక్తిపేరును తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా ధ్వన్యంతరీకరించాం.
- source_word: שַׂר הָעִיר
  choice: పట్టణ అధికారి
  rationale: שַׂר పదం పౌర లేదా సైనిక నాయకుణ్ణి సూచించవచ్చు. ‘పట్టణ అధికారి’ మూలంలోని విస్తృత భావాన్ని ఒక నిర్దిష్ట సైనిక హోదాగా పరిమితం చేయకుండా సహజంగా తెలియజేస్తుంది.
- source_word: וְאֶל יוֹאָשׁ
  choice: యోవాషు దగ్గరికీ
  rationale: రెండవ אֶל మరో గమ్యవ్యక్తిని సమన్వయపరుస్తుంది; తెలుగులో ‘దగ్గరికీ’ పునరుక్త గమ్యభావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: בֶּן הַמֶּלֶךְ
  choice: రాజు కుమారుడైన
  rationale: మూలంలోని సంబంధాన్ని నేరుగా ఉంచాం; ‘రాజకుమారుడు’ అని పెడితే ప్రత్యేక హోదా లేదా వారసత్వ భావం అదనంగా రావచ్చు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని రాజబిరుదు, వ్యక్తిపేర్లు, ఆజ్ఞ, తిరిగి అప్పగించే భావం నిలుపబడ్డాయి. שַׂר הָעִיר లోని పౌర/సైనిక పదవికి సంబంధించిన అనిశ్చితిని ‘పట్టణ అధికారి’ అనే విస్తృత పదంతో కాపాడాం.
