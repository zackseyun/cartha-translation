source:
  edition: WLC
  text: וְ/הַ/מַּלְאָ֞ךְ אֲשֶׁר הָלַ֣ךְ לִ/קְרֹ֣א מִיכָ֗יְהוּ דִּבֶּ֤ר אֵלָי/ו֙ לֵ/אמֹ֔ר הִנֵּה נָ֞א דִּבְרֵ֧י הַ/נְּבִיאִ֛ים פֶּֽה אֶחָ֥ד ט֖וֹב אֶל הַ/מֶּ֑לֶךְ יְהִֽי נָ֣א דברי/ך כִּ/דְבַ֛ר אַחַ֥ד מֵ/הֶ֖ם וְ/דִבַּ֥רְתָּ טּֽוֹב־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/013.yaml
  text: And the messenger who had gone to summon Micaiah spoke to him[a], saying, “Look now, the words of the prophets are with one mouth favorable to the king. Please let your word be like the word of one of them, and speak favorably.”
translation:
  language: te
  text: 'మీకాయాను పిలవడానికి వెళ్లిన దూత అతనితో ఇలా అన్నాడు: “ఇదిగో, ప్రవక్తల మాటలు ఏకకంఠంతో[a] రాజుకు అనుకూలంగా ఉన్నాయి. దయచేసి నీ మాట కూడా వారిలో ఒకరి మాటలాగే ఉండనివ్వు; నువ్వూ అనుకూలంగా మాట్లాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా “ఒకే నోటితో”; అంటే “ఒకే స్వరంతో” లేదా “ఏకాభిప్రాయంతో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: దూత
  rationale: సందర్భంలో ఇది మీకాయాను పిలవడానికి పంపబడిన మానవ సందేశవాహకుణ్ణి సూచిస్తుంది; పరలోక దూతను కాదు.
- source_word: לִקְרֹא
  choice: పిలుచుకొని రావడానికి
  rationale: రాజు సమక్షానికి ప్రవక్తను అధికారికంగా పిలిపించే సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הִנֵּה נָא
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే హీబ్రూ ప్రయోగ బలాన్ని సంభాషణకు తగిన సహజ తెలుగులో నిలుపుతుంది.
- source_word: דִּבְרֵי הַנְּבִיאִים
  choice: ప్రవక్తలందరూ ... మాట్లాడుతున్నారు
  rationale: తెలుగులో సహజమైన వాక్య నిర్మాణం కోసం నామవాచక ప్రయోగాన్ని క్రియాత్మకంగా మార్చినా, ప్రవక్తల పలుకులనే సూచించే మూలార్థం నిలిచింది.
- source_word: פֶּה אֶחָד
  choice: ఏక కంఠంతో
  rationale: ‘ఒకే నోటితో’ అనే హీబ్రూ రూపకానికి సమీపంగా ఉండి, ఏకాభిప్రాయంతో పలకడాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: טוֹב אֶל הַמֶּלֶךְ
  choice: రాజుకు అనుకూలంగా
  rationale: రాజుకు నచ్చే లేదా అతనికి మేలు సూచించే మాటల భావాన్ని సందర్భానుసారంగా స్పష్టంగా తెలియజేస్తుంది.
- source_word: יְהִי נָא דבריך
  choice: దయచేసి నీ మాట కూడా ... ఉండనివ్వు
  rationale: విన్నప స్వరాన్ని, అలాగే మీకాయా చెప్పబోయే సందేశాన్ని సమష్టిగా సూచించే ఏకవచన ‘మాట’ను నిలుపుతుంది.
- source_word: כִּדְבַר אַחַד מֵהֶם
  choice: వారిలో ఒకరి మాటలాగే
  rationale: మూలంలోని ఏకవచన పోలికను దగ్గరగా అనుసరిస్తూ, ఇతర ప్రవక్తలలో ఎవరో ఒకరి సందేశానికి అనుగుణంగా పలకమనే ఒత్తిడిని తెలియజేస్తుంది.
- source_word: וְדִבַּרְתָּ טּוֹב
  choice: నువ్వూ అనుకూలంగా మాట్లాడు
  rationale: ‘మంచిని పలుకు’ అనే అక్షరార్థాన్ని ఈ సందర్భంలో సహజంగా, రాజుకు అనుకూలమైన సందేశం చెప్పమనే భావంతో అందిస్తుంది.
