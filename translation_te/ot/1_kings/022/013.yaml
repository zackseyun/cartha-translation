  to: 'మీకాయాను పిలవడానికి వెళ్లిన దూత అతనితో ఇలా అన్నాడు: “ఇదిగో, ప్రవక్తల మాటలు ఏకకంఠంతో[a] రాజుకు అనుకూలంగా ఉన్నాయి. దయచేసి నీ మాట కూడా వారిలో ఒకరి మాటలాగే ఉండనివ్వు; నువ్వూ అనుకూలంగా మాట్లాడు.”'
  rationale: The revision preserves the Hebrew construction by making “ప్రవక్తల మాటలు” the subject, while retaining the natural Telugu idiom “ఏకకంఠంతో” and its explanatory footnote. It also streamlines “పిలుచుకొని రావడానికి” to the direct and contextually sufficient “పిలవడానికి.”
