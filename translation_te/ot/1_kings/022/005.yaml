id: 1KI.22.5
reference: 1 Kings 22:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹשָׁפָ֖ט אֶל מֶ֣לֶךְ יִשְׂרָאֵ֑ל דְּרָשׁ נָ֥א כַ/יּ֖וֹם אֶת דְּבַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/005.yaml
  text: And Jehoshaphat said to the king of Israel[a], “Please inquire today for the word of Yahweh.”
translation:
  language: te
  text: అప్పుడు యెహోషాపాతు ఇశ్రాయేలు రాజుతో, “దయచేసి, ఈ రోజే యాహ్వే వాక్యం ఏమిటో అడిగి తెలుసుకోండి[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ రోజే యాహ్వే వాక్యాన్ని వెదకండి,” లేదా “యాహ్వేను సంప్రదించి ఒక వాక్యం అడగండి.”
    reason: దְּרָשׁ అనే క్రియ ఈ సందర్భంలో దైవవాక్యాన్ని వెదకడం లేదా దైవమార్గదర్శకత్వం కోసం సంప్రదించడం అనే సమీపార్థాలను కలిగి ఉంది.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగు కథనశైలిలో “అప్పుడు ... అన్నాడు” సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: יְהוֹשָׁפָט
  choice: యెహోషాపాతు
  rationale: హీబ్రూ వ్యక్తినామాన్ని ప్రామాణిక తెలుగు బైబిలు నామరూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజుతో
  rationale: మాట్లాడటాన్ని సూచించే తెలుగు ప్రయోగంలో “రాజుతో” సహజంగా ఉంటుంది; రాజపదవిని స్పష్టంగా నిలుపుతుంది.
- source_word: דְּרָשׁ
  choice: విచారించండి
  rationale: ఈ సందర్భంలో దేవుని నుండి మార్గదర్శక వాక్యాన్ని వెదకడం లేదా సంప్రదించి తెలుసుకోవడం అనే భావం ఉంది. “విచారించండి” ఆ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: נָא
  choice: దయచేసి
  rationale: విన్నపం, మర్యాదను సూచించే కణాన్ని ఆధునిక సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: כַיּוֹם
  choice: ఈ రోజే
  rationale: అదే రోజు వెంటనే విచారించాలనే కాలబలాన్ని “ఈ రోజే” స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֶת דְּבַר יְהוָה
  choice: యాహ్వే వాక్యం కోసం
  rationale: దేవుని నుండి లభించవలసిన ప్రకటనను కోరడమే సందర్భార్థం. “వాక్యం” అనే మూలపదాన్ని నిలుపుతూ, తెలుగులో విచారణకు లక్ష్యాన్ని సహజంగా తెలిపేందుకు “కోసం” వాడాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత లిప్యంతరీకరణకు అనుగుణంగా తెలుగులో ఇచ్చాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా “యాహ్వే”గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేక నామాన్ని నిలుపుతుంది.
- issue: דְּרָשׁ ... דְּבַר יְהוָה ప్రయోగంలోని భావం
  choice: యాహ్వే వాక్యం కోసం విచారించండి
  alternative: యాహ్వే వాక్యాన్ని వెదకండి; యాహ్వేను సంప్రదించి ఒక వాక్యం అడగండి
  rationale: ఈ ప్రయోగం వాక్యాన్ని వెదకడం, దేవుని సంప్రదించడం అనే రెండు దగ్గరి భావాలకు వీలు ఇస్తుంది. ప్రధాన పాఠం రెండింటినీ అతిగా నిర్దిష్టం చేయకుండా ఉంచి, ప్రత్యామ్నాయాలను పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా మర్యాదతో కూడిన, గంభీరమైన కథనశైలి. రాజును ఉద్దేశించిన ఏకవచన ఆజ్ఞను తెలుగులో గౌరవబహువచన రూపంతో వ్యక్తపరిచాం.
