source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֧י יְהוֹשָׁפָ֛ט וּ/גְבוּרָת֥/וֹ אֲשֶׁר עָשָׂ֖ה וַ/אֲשֶׁ֣ר נִלְחָ֑ם הֲ/לֹֽא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/046.yaml
  text: The rest of the acts of Jehoshaphat[a], and his might that he showed, and how he fought—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: te
  text: యెహోషాపాతు చేసిన మిగిలిన కార్యాలు, అతడు కనబరిచిన పరాక్రమం[a], అతడు ఎలా యుద్ధం చేశాడో—ఇవన్నీ యూదా రాజుల వృత్తాంతాల గ్రంథంలో రాసి ఉన్నాయి కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు చేసిన పరాక్రమ కార్యాలు.” హెబ్రీలో “అతని పరాక్రమం” అనే పదాన్ని “అతడు చేసిన” అనే మాటలతో కలిపారు; ఇది కార్యాల్లో కనబడిన శౌర్యాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹשָׁפָט
  choice: యెహోషాపాతు చేసిన మిగిలిన కార్యాలు
  rationale: రాజుల పాలన సంగ్రహ సూత్రంలో דִּבְרֵי అనేది మాటలు కాకుండా కార్యాలు లేదా పాలనలో జరిగిన విషయాలను సూచిస్తుంది; וְיֶתֶר వాటిలో మిగిలినవాటిని సూచిస్తుంది.
- source_word: וּגְבוּרָתוֹ אֲשֶׁר עָשָׂה
  choice: అతడు కనబరిచిన పరాక్రమం
  rationale: గెబూరా బలం, శౌర్యం, పరాక్రమ కార్యాలు అనే భావాలను కలిగి ఉంది. ‘అతడు చేసిన పరాక్రమం’ కంటే ‘కనబరిచిన పరాక్రమం’ ఆధునిక తెలుగులో సహజంగా ఉండి, కార్యాల్లో వెల్లడైన శౌర్యాన్ని తెలియజేస్తుంది.
- source_word: וַאֲשֶׁר נִלְחָם
  choice: అతడు ఎలా యుద్ధం చేశాడో
  rationale: נלחם అంటే యుద్ధం చేయడం లేదా పోరాడడం. సంబంధవాచక నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, మూలంలో లేని నిర్దిష్ట యుద్ధాల సంఖ్యను చేర్చకుండా ఈ రూపం వాడబడింది.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: ఇవన్నీ ... రాసి ఉన్నాయి కదా?
  rationale: మూలంలోని అలంకార ప్రశ్నను నిలుపుతూ, బహువచన సూచన הֵם ను ‘ఇవన్నీ’తో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: యూదా రాజుల వృత్తాంతాల గ్రంథంలో
  rationale: ఇది యూదా రాజులకు సంబంధించిన రాజవంశ చరిత్ర లేదా అధికారిక వృత్తాంతాల గ్రంథాన్ని సూచించే సూత్రబద్ధమైన శీర్షిక; ‘వృత్తాంతాలు’ అర్థాన్ని సహజంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక శైలి వాడబడింది. మూలంలోని అలంకార ప్రశ్నను అలాగే ఉంచి, రాజవృత్తాంతాల సూత్రబద్ధ ముగింపు ధోరణిని కాపాడింది.
