- from: అతడు యాహ్వే దృష్టిలో చెడ్డది చేసి, తన తండ్రి మార్గంలో, తన తల్లి మార్గంలో, ఇశ్రాయేలును పాపం చేయించిన నెబాతు కుమారుడు యెరోబాము మార్గంలో నడిచాడు.
