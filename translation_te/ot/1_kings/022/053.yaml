  terminology: ‘యాహ్వే’ appropriately renders יהוה, and ‘యెరోబాము,’ ‘నెబాతు,’ and ‘ఇశ్రాయేలు’ are suitable Telugu forms. ‘ఇశ్రాయేలును పాపం చేయించిన’ retains the causative force without adding an explanation of how Jeroboam did so.
