  source_fidelity: 'The draft accurately preserves the verse’s sequence and all major elements: Yahweh’s evaluative perspective, the repeated ‘way’ pattern, the father and mother, Jeroboam’s patronymic, and the causative sense of הֶחֱטִיא (‘caused Israel to sin’).'
