id: 1KI.22.53
reference: 1 Kings 22:53
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/דֶ֤רֶךְ אָבִי/ו֙ וּ/בְ/דֶ֣רֶךְ אִמּ֔/וֹ וּ/בְ/דֶ֨רֶךְ֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/053.yaml
  text: And he did what was evil in the eyes of Yahweh and walked in the way of his father, and in the way of his mother, and in the way of Jeroboam son of Nebat, who caused Israel to sin.
translation:
  language: te
  text: అతడు యాహ్వే దృష్టిలో చెడు చేసి, తన తండ్రి మార్గంలో, తన తల్లి మార్గంలో, ఇశ్రాయేలును పాపం చేయించిన నెబాతు కుమారుడు యెరోబాము మార్గంలో నడిచాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: చెడ్డది చేసి
  rationale: ‘చెడ్డది చేయడం’ అనే సహజమైన తెలుగు ప్రయోగం ద్వారా క్రియతో కూడిన హెబ్రీ నైతిక మూల్యాంకనాన్ని నేరుగా నిలుపుతుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యాహ్వే దృష్టిలో
  rationale: హెబ్రీలోని ‘కళ్లలో’ అనే మూల్యాంకన నుడికారాన్ని ఆధునిక తెలుగులో సహజంగా ‘దృష్టిలో’ అని వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: మూలపాఠంలోని దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: మార్గంలో నడిచాడు
  rationale: జీవన ప్రవర్తనను మార్గంలో నడవడంతో పోల్చే హెబ్రీ రూపకాన్ని నిలుపుతుంది.
- source_word: אָבִיו ... אִמּוֹ
  choice: తన తండ్రి ... తన తల్లి
  rationale: తండ్రి, తల్లి ఇద్దరినీ ప్రత్యేకంగా పేర్కొన్న మూలపాఠపు ఉద్ఘాటనను కాపాడుతుంది.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: నెబాతు కుమారుడు యెరోబాము
  rationale: హెబ్రీ వంశసూచక నిర్మాణాన్ని తెలుగులో సహజమైన పదక్రమంలో అందిస్తుంది.
- source_word: הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును పాపం చేయించిన
  rationale: חטא క్రియ యొక్క హిఫీల్ కారణార్థక భావాన్ని స్పష్టంగా, అదనపు వ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: వ్యక్తిగత దైవ నామాన్ని మూలపాఠానుసారంగా నిలిపి, దానిని బిరుదుగా మార్చదు.
- issue: దైవిక నైతిక మూల్యాంకన సూత్రం
  choice: యాహ్వే దృష్టిలో చెడ్డది చేసి
  alternative: యాహ్వే దృష్టికి చెడు చేసి
  rationale: కార్యాన్ని యాహ్వే మూల్యాంకనం చేస్తున్నాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, మూలంలోని నైతిక తీర్పును తగ్గించదు.
- issue: యెరోబాము ఇశ్రాయేలును పాపం చేయించాడనే కారణార్థక వాక్యం
  choice: ఇశ్రాయేలును పాపం చేయించిన
  alternative: ఇశ్రాయేలును పాపంలోకి నడిపించిన
  rationale: మూలంలోని వ్యాకరణ కారణార్థకతను నిలుపుతూ, అతని చర్య యొక్క విధానాన్ని పాఠ్యంలో లేనంతగా వివరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘మార్గంలో’ అనే పదాన్ని మూడుసార్లు పునరావృతం చేసి మూలపాఠపు నిర్మాణాత్మక ఉద్ఘాటనను నిలిపింది.
