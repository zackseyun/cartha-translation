  text: וַ/יֹּ֨אמֶר֙ אֶל יְה֣וֹשָׁפָ֔ט הֲ/תֵלֵ֥ךְ אִתִּ֛/י לַ/מִּלְחָמָ֖ה רָמֹ֣ת גִּלְעָ֑ד וַ/יֹּ֤אמֶר יְהֽוֹשָׁפָט֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל כָּמ֧וֹ/נִי כָמ֛וֹ/ךָ כְּ/עַמִּ֥/י כְ/עַמֶּ֖/ךָ כְּ/סוּסַ֥/י כְּ/סוּסֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/004.yaml
  text: And he said to Jehoshaphat[a], “Will you go with me to battle at Ramoth-gilead?” And Jehoshaphat said to the king of Israel, “I am as you are, my people as your people, my horses as your horses.”
translation:
  language: te
  text: అప్పుడు అతడు యెహోషాపాతుతో, “రామోత్-గిలాదు వద్ద యుద్ధానికి నాతో వస్తావా?” అని అన్నాడు. యెహోషాపాతు ఇశ్రాయేలు రాజుతో, “నేను నీవంటివాడినే; నా ప్రజలు నీ ప్రజలవంటివారే; నా గుర్రాలు నీ గుర్రాలవంటివే[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను నీవంటివాడిని; నా ప్రజలు నీ ప్రజలవంటివారు; నా గుర్రాలు నీ గుర్రాలవంటివి.” హీబ్రూ వాక్యం క్రియలు లేకుండా చాలా సంక్షిప్తంగా ఉండి, సంఘీభావాన్ని, కూటమిని వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵלֵךְ אִתִּי
  choice: నాతో వస్తావా?
  rationale: ప్రశ్నార్థక అవ్యయంతో కూడిన క్రియ ప్రత్యక్ష ఆహ్వానాన్ని సూచిస్తుంది. గమనం మాట్లాడుతున్న రాజుతో కలిసి జరగబోతున్నందున ఆధునిక తెలుగులో ‘నాతో వస్తావా?’ సహజంగా ఉంది; ఇది సహగమన భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: לַמִּלְחָמָה
  choice: యుద్ధానికి
  rationale: הלך తో కూడిన ఈ పదబంధం యుద్ధంలో పాల్గొనడానికి వెళ్లడాన్ని సూచిస్తుంది. ‘యుద్ధానికి’ సంక్షిప్తమైన, సహజమైన తెలుగు ప్రయోగం.
- source_word: רָמֹת גִּלְעָד
  choice: గిలాదులోని రామోతు మీద
  rationale: స్థలనామాన్ని ‘రామోతు’గా లిప్యంతరీకరించి, గిలాదు ప్రాంతంతో దాని సంబంధాన్ని ‘గిలాదులోని’ అని స్పష్టం చేశాం. యుద్ధ లక్ష్యస్థలాన్ని తెలుగులో సహజంగా చూపేందుకు ‘మీద’ వాడాం.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: హీబ్రూ సమాస నిర్మాణాన్ని సహజమైన తెలుగు షష్ఠీ సంబంధంగా అనువదించాం.
- source_word: כָּמוֹנִי כָמוֹךָ
  choice: నేను నీవంటివాడినే
  rationale: క్రియలేని సంక్షిప్త హీబ్రూ సమానతా వాక్యానికి తెలుగులో అవసరమైన విధేయ రూపాన్ని చేర్చాం. ‘-నే’ ఐక్యత, సంపూర్ణ మద్దతు భావాన్ని నిలుపుతుంది.
- source_word: כְּעַמִּי כְעַמֶּךָ
  choice: నా ప్రజలు నీ ప్రజలవంటివారే
  rationale: మూలంలోని సంక్షిప్త సమాంతర నిర్మాణాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది; ప్రజల మధ్య పోలిక కంటే కూటమి సంఘీభావమే సందర్భార్థమని నిర్మాణం తెలియజేస్తుంది.
- source_word: כְּסוּסַי כְּסוּסֶיךָ
  choice: నా గుర్రాలు నీ గుర్రాలవంటివే
  rationale: సוּס అనే నిర్దిష్ట నామవాచకాన్ని ‘గుర్రాలు’గానే ఉంచాం. ‘అశ్వదళం’ వంటి వ్యాఖ్యాత్మక విస్తరణను నివారించి, సైనిక వనరుల సూచనను పాఠకుడికి వదిలాం.
theological_decisions:
- issue: యెహోషాపాతు మాటలలోని సంఘీభావం లేదా కూటమి భావం
  choice: పోలిక రూపాన్ని యథాతథంగా ఉంచి, ‘-నే/-వారే/-వే’ ద్వారా దృఢమైన ఐక్యతను సూచించడం
  alternative: ‘నేనూ నా ప్రజలూ నా గుర్రాలూ నీ సేవలో ఉన్నాం’ అని భావానువాదం చేయడం
  rationale: మూలంలోని ఉద్వేగభరితమైన, క్రియలేని సమాంతర వాక్యాలు సంపూర్ణ మద్దతును సూచించినా, సేవ లేదా లోబడటం అనే భావాన్ని స్పష్టంగా చెప్పవు. కాబట్టి ఆ ఉద్రిక్తతను పరిష్కరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని వాడాం. ప్రత్యక్ష సంభాషణను సాధారణ పాఠకులకు సహజంగా ఉంచుతూ, హీబ్రూ సమాంతరత్వాన్ని సాధ్యమైనంత వరకు కాపాడాం. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
