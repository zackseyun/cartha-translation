base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/001.yaml
  text: For three years they remained without war between Aram and Israel[a][b].
translation:
  language: te
  text: అరాము, ఇశ్రాయేలు మధ్య యుద్ధం లేకుండా మూడు సంవత్సరాలు గడిచాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మూడు సంవత్సరాలపాటు అరాము, ఇశ్రాయేలు మధ్య యుద్ధం జరగలేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: గడిచాయి
  rationale: ישׁב అనే క్రియకు ప్రాథమికంగా ‘కూర్చుండు/నివసించు’ అనే అర్థాలున్నా, ‘మూడు సంవత్సరాలు’ అనే కాలవ్యవధితో కూడిన ఈ చారిత్రక వాక్యంలో ఒక స్థితి కొనసాగడాన్ని సూచిస్తుంది. తెలుగులో ‘మూడు సంవత్సరాలు గడిచాయి’ సహజంగా ఉండి ఆ కొనసాగింపును తెలియజేస్తుంది.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: మూడు సంవత్సరాలు
  rationale: హీబ్రూలో ఇది కాలవ్యవధిని సూచించే పదబంధం; తెలుగు వాక్య నిర్మాణంలో వ్యవధిగా సహజంగా అందించబడింది.
- source_word: אֵין מִלְחָמָה
  choice: యుద్ధం లేకుండా
  rationale: మూలంలోని ‘యుద్ధం లేదు’ అనే స్థితిని, ‘గడిచాయి’తో సహజంగా కలిసే విధంగా ‘యుద్ధం లేకుండా’ అని అనువదించాం.
- source_word: בֵּין ... וּבֵין
  choice: … మధ్య
  rationale: రెండు పక్షాల మధ్య సంబంధాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలిపే రూపం.
- source_word: אֲרָם
  choice: అరాము
  rationale: తరువాతి భౌగోళిక పేరైన ‘సిరియా’ను పెట్టకుండా హీబ్రూ పేరును నేరుగా తెలుగు లిప్యంతరీకరణలో ఉంచాం.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: హీబ్రూ వ్యక్తి/దేశ నామానికి సంప్రదాయబద్ధమైన, మూలధ్వనికి సమీపమైన తెలుగు రూపం.
