translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన చారిత్రక వచనం. మూలంలోని స్థితి కొనసాగింపును సహజమైన తెలుగు వాక్య నిర్మాణంతో వ్యక్తం చేసింది; ‘అరాము’ అనే మూల నామాన్ని నిలిపింది.
