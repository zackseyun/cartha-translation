source:
  edition: WLC
  text: וְ/אָמַרְתָּ֗ כֹּ֚ה אָמַ֣ר הַ/מֶּ֔לֶךְ שִׂ֥ימוּ אֶת זֶ֖ה בֵּ֣ית הַ/כֶּ֑לֶא וְ/הַאֲכִילֻ֨/הוּ לֶ֤חֶם לַ֨חַץ֙ וּ/מַ֣יִם לַ֔חַץ עַ֖ד בֹּאִ֥/י בְ/שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/027.yaml
  text: 'and say[a], ‘Thus says the king: Put this man in the prison, and feed him with bread of affliction and water of affliction until I come in peace.’'
translation:
  language: te
  text: 'నీవు ఇలా చెప్పు: ‘రాజు ఇలా సెలవిస్తున్నాడు: ఇతన్ని చెరసాలలో వేయండి. నేను క్షేమంగా వచ్చేవరకు ఇతనికి కష్టపు రొట్టెను, కష్టపు నీటిని[a] ఇవ్వండి.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బాధ రొట్టెను, బాధ నీటిని.” ఈ పదబంధం కఠినమైన లేదా అతి కొద్దిగా ఇచ్చే జైలు రేషన్లను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: రాజు ఇలా సెలవిస్తున్నాడు
  rationale: హెబ్రీయ అధికారిక సందేశ సూత్రాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: שִׂימוּ אֶת זֶה
  choice: ఇతన్ని ... వేయండి
  rationale: సందర్భంలో సూచించబడుతున్న మీకాయాను సహజమైన తెలుగులో స్పష్టంగా సూచిస్తుంది; అవమానార్థాన్ని అనవసరంగా చేర్చదు.
- source_word: בֵּית הַכֶּלֶא
  choice: చెరసాలలో
  rationale: ‘నిర్బంధ గృహం’ అనే మూల భావాన్ని సంక్షిప్తమైన, సాధారణ ఆధునిక పదంతో తెలియజేస్తుంది.
- source_word: וְהַאֲכִילֻהוּ
  choice: ఇతనికి ... ఇవ్వండి
  rationale: రొట్టెతో పాటు నీరు కూడా కర్మగా ఉన్నందున, తెలుగులో సహజంగా రెండింటికీ వర్తించే క్రియను ఉపయోగించింది.
- source_word: לֶחֶם לַחַץ
  choice: కష్టపు రొట్టె
  rationale: కఠినమైన లేదా కొరతగల జైలు ఆహారాన్ని సూచించే అవకాశం ఉన్నప్పటికీ, హెబ్రీయ రూపక నిర్మాణాన్ని వ్యాఖ్యానంతో భర్తీ చేయకుండా నిలుపుతుంది.
- source_word: וּמַיִם לַחַץ
  choice: కష్టపు నీరు
  rationale: ‘కష్టపు రొట్టె’తో ఉన్న సమాంతర నిర్మాణాన్ని కాపాడి, అసలు పదబంధంలోని తీవ్రతను నిలుపుతుంది.
- source_word: עַד בֹּאִי בְשָׁלוֹם
  choice: నేను క్షేమంగా వచ్చేవరకు
  rationale: בְשָׁלוֹם లోని సురక్షితంగా, హాని లేకుండా రావడం అనే భావాన్ని తెలుగులో సహజంగా అందిస్తూ, రాజు ధీమా మరియు కథన వ్యంగ్యాన్ని నిలుపుతుంది.
theological_decisions:
- issue: అహాబు మాటలోని בְשָׁלוֹם భావం
  choice: క్షేమంగా
  alternative: శాంతితో
  rationale: ఈ సందర్భంలో పదం సురక్షితంగా తిరిగి రావడాన్ని సూచించగలదు. ‘క్షేమంగా’ అనేది ఆ భావాన్ని సహజంగా అందిస్తుంది; ‘విజయవంతంగా’ అని మరింత సంకుచితం చేయకుండా కథనంలోని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని వాడింది. రాజాజ్ఞకు తగిన అధికారిక ధోరణిని ఉంచుతూ, సామాన్య పాఠకులకు అర్థమయ్యే పదాలను ఎంచుకుంది.
