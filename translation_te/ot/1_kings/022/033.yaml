translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని సైనిక సందర్భాన్ని స్పష్టపరచడానికి ‘రథదళాధిపతులు’ ఎంచుకోబడింది; హీబ్రూ నుడికారాన్ని ప్రధాన పాఠ్యంలో భావానువాదంగా ఇచ్చి, అక్షరార్థాన్ని పాదటిప్పణిలో నిలుపుకున్నాం.
