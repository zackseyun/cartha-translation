source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/רְאוֹת֙ שָׂרֵ֣י הָ/רֶ֔כֶב כִּֽי לֹא מֶ֥לֶךְ יִשְׂרָאֵ֖ל ה֑וּא וַ/יָּשׁ֖וּבוּ מֵ/אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/033.yaml
  text: And it happened[a], when the commanders of the chariots saw that he was not the king of Israel, they turned back from pursuing him.
translation:
  language: te
  text: రథదళాధిపతులు అతడు ఇశ్రాయేలు రాజు కాదని చూసినప్పుడు, అతని వెంటపడడం మానుకొని వెనుదిరిగారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతని వెంబడి నుండి”; ఇది అతని వెంట వెళ్లడం లేదా అతన్ని వెంబడించడం ఆపివేశారని తెలిపే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ప్రత్యేక పదంగా అనువదించకుండా కాలసూచక వాక్య నిర్మాణంలో ప్రతిబింబించబడింది
  rationale: ఇది కథనాన్ని ముందుకు నడిపించే సాధారణ wayyiqtol రూపం. తెలుగులో ‘అప్పుడు’ అని అదనంగా పెట్టకుండానే ‘చూసినప్పుడు’ అనే సహజ నిర్మాణం సంఘటనల క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: כִּרְאוֹת
  choice: చూసినప్పుడు
  rationale: כ తో కూడిన infinitive construct కాలసంబంధ పరిస్థితిని సూచిస్తుంది. ‘చూసినప్పుడు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ భావాన్ని సముచితంగా నిలుపుతుంది.
- source_word: שָׂרֵי הָרֶכֶב
  choice: రథదళాధిపతులు
  rationale: שָׂרֵי అంటే సైనిక అధిపతులు; הָרֶכֶב ఇక్కడ రథాలను లేదా రథదళాన్ని సూచిస్తుంది. సమాసరూపమైన ‘రథదళాధిపతులు’ సందర్భానికి తగిన స్పష్టమైన తెలుగు.
- source_word: כִּי לֹא מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: అతడు ఇశ్రాయేలు రాజు కాదని
  rationale: הוּא పుంలింగ ఏకవచన సర్వనామం; వారు వెంబడిస్తున్న వ్యక్తినే సూచిస్తుంది. ఈ అనువాదం గ్రహించిన విషయాన్ని నేరుగా వ్యక్తపరుస్తుంది.
- source_word: וַיָּשׁוּבוּ
  choice: వెనుదిరిగారు
  rationale: שׁוּב ఇక్కడ అప్పటికే సాగుతున్న చర్యనుంచి తిరగడాన్ని సూచిస్తుంది. సైనిక సందర్భంలో ‘వెనుదిరిగారు’ సహజంగా సరిపోతుంది.
- source_word: מֵאַחֲרָיו
  choice: అతని వెంటపడడం మానుకొని
  rationale: అక్షరార్థంగా ‘అతని వెనుకనుండి’ అయిన ఈ హీబ్రూ ప్రయోగం, సందర్భంలో అతన్ని వెంబడించడం ఆపివేశారని సూచిస్తుంది. ‘వెంటపడడం మానుకొని’ ఆ ప్రయోగార్థాన్ని స్పష్టంగా అందిస్తుంది.
