id: 1KI.22.14
reference: 1 Kings 22:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מִיכָ֑יְהוּ חַי יְהוָ֕ה כִּ֠י אֶת אֲשֶׁ֨ר יֹאמַ֧ר יְהוָ֛ה אֵלַ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/014.yaml
  text: And Micaiah said[a], “As Yahweh lives, whatever Yahweh says to me, that I will speak.”
translation:
  language: te
  text: 'మీకాయా అన్నాడు: “యెహోవా జీవిస్తున్నాడనే ప్రమాణంతో, యెహోవా నాకు ఏమి చెబుతాడో దానినే నేను చెప్పుతాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ కథనంలోని ప్రత్యక్ష వాక్య పరిచయాన్ని సహజమైన ఆధునిక తెలుగు శైలిలో తెలియజేస్తుంది.
- source_word: מִיכָיְהוּ
  choice: మీకాయా
  rationale: ఈ వ్యక్తి పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపాన్ని వాడింది.
- source_word: חַי יְהוָה
  choice: యెహోవా జీవంతోడు
  rationale: ఇది గంభీరమైన ప్రమాణ సూత్రం; మూలంలోని ‘యెహోవా జీవించుచున్నట్లుగా’ అనే భావాన్ని తెలుగు ప్రమాణ భాషలో సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: כִּי אֵת אֲשֶׁר
  choice: ఏమి...ఓ అదే
  rationale: ప్రమాణంలోని విషయాన్ని పరిచయం చేసే నిర్మాణాన్ని, పునరుద్ఘాటక సర్వనామంతో సహా సహజమైన తెలుగు సంబంధ వాక్యంగా ప్రతిబింబిస్తుంది.
- source_word: יֹאמַר
  choice: చెబుతాడో
  rationale: ఇక్కడి అపూర్ణ క్రియ భవిష్యదర్థాన్ని కలిగి ఉంది; తెలుగు సంబంధ నిర్మాణంలో ‘ఏమి చెబుతాడో’ దానిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֵלַי
  choice: నాతో
  rationale: ప్రవక్తను ఉద్దేశించి చెప్పే మాట దిశను సహజమైన తెలుగులో సూచిస్తుంది; ‘నాకు’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: אֹתוֹ
  choice: అదే
  rationale: ముందున్న సంబంధ వాక్యాన్ని తిరిగి సూచించే హీబ్రూ పునరుద్ఘాటక కర్మ సర్వనామాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אֲדַבֵּר
  choice: నేను పలుకుతాను
  rationale: ప్రవక్త బహిరంగంగా ప్రకటించే గంభీర భావాన్ని ‘పలుకు’ సహజంగా వ్యక్తపరుస్తుంది; మూలంలోని ‘మాట్లాడు’ క్రియార్థాన్ని కాపాడుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠం దైవనామాన్ని ప్రత్యక్షంగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా, సాధారణ తెలుగు బైబిలు పాఠకులకు పరిచితమైన ‘యెహోవా’ రూపంలో ఉంచడం వ్యక్తిగత నామ స్వభావాన్ని కాపాడుతుంది.
- issue: חַי יְהוָה అనే ప్రమాణ సూత్రం
  choice: యెహోవా జీవంతోడు
  alternative: యెహోవా జీవిస్తున్నంత నిశ్చయంగా; సజీవుడైన యెహోవా సాక్షిగా
  rationale: ఇది దేవుని జీవం ఆధారంగా చేసే ప్రమాణం. వివరణాత్మకంగా విస్తరించకుండా మూలంలోని గంభీరతను, ప్రమాణ స్వరూపాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. మూలంలోని ప్రమాణ సూత్రం మరియు ‘అదే’ అనే పునరుద్ఘాటన కాపాడబడ్డాయి.
