source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מִיכָ֔יְהוּ אִם שׁ֤וֹב תָּשׁוּב֙ בְּ/שָׁל֔וֹם לֹֽא דִבֶּ֥ר יְהוָ֖ה בִּ֑/י וַ/יֹּ֕אמֶר שִׁמְע֖וּ עַמִּ֥ים כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/028.yaml
  text: And Micaiah said[a], “If you indeed return in peace, Yahweh has not spoken by me.” And he said, “Hear[b], all you peoples!”
translation:
  language: te
  text: 'మీకాయా ఇలా అన్నాడు: “నీవు నిజంగా క్షేమంగా తిరిగి వస్తే, యాహ్వే నా ద్వారా మాట్లాడలేదు.” తరువాత అతడు ఇలా అన్నాడు: “సకల ప్రజలారా, వినండి!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో ‘ప్రజలు’ అనే పదం బహువచన రూపంలో ఉంది; ఇది ఒకే ప్రజావర్గానికి కాకుండా అనేక ప్రజలందరికీ ఉద్దేశించిన విస్తృత బహిరంగ పిలుపు.
    reason: cultural_note
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: మీకాయా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో సహజంగా, సాంప్రదాయకంగా అర్థమయ్యే లిప్యంతరీకరణ.
- source_word: אִם שׁוֹב תָּשׁוּב
  choice: నీవు నిజంగా ... తిరిగి వస్తే
  rationale: క్రియాధాతురూపం, అసంపూర్ణ క్రియ కలయికలోని బలమైన షరతును ‘నిజంగా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּשָׁלוֹם
  choice: క్షేమంగా
  rationale: ఈ సందర్భంలో యుద్ధం నుంచి హాని లేకుండా సురక్షితంగా తిరిగి రావడాన్ని సూచిస్తుంది; తెలుగు వాడుకలో ‘క్షేమంగా’ సహజమైన సమానార్థకం.
- source_word: לֹא דִבֶּר יְהוָה בִּי
  choice: యెహోవా నా ద్వారా మాట్లాడినట్టే కాదు
  rationale: בִּי ప్రవక్తను దైవవాక్యానికి సాధనంగా చూపుతుంది. ‘నా ద్వారా’ ఆ భావాన్ని స్పష్టంగా ఉంచుతుంది; షరతు నిజమైతే తన ప్రవచనం యెహోవా నుండి కాదని మీకాయా ప్రకటిస్తున్న భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తింపుపొందిన రూపంలో లిప్యంతరీకరించింది.
- source_word: שִׁמְעוּ
  choice: వినండి
  rationale: బహువచన ఆజ్ఞార్థక పిలుపును సహజమైన, గంభీరమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַמִּים כֻּלָּם
  choice: ప్రజలారా, మీరందరూ
  rationale: עַמִּים అనే బహువచనాన్ని విస్తృత బహిరంగ పిలుపుగా ఉంచుతూ, తెలుగులో కృత్రిమంగా వినిపించే ‘ప్రజాసమూహాలారా’ వంటి రూపాన్ని నివారిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుగా మార్చకుండా ప్రత్యక్షంగా లిప్యంతరీకరించింది. ‘యెహోవా’ సాధారణ తెలుగు పాఠకులకు సుపరిచితమైన రూపం.
- issue: చివరి וַיֹּאמֶר వాక్యంలోని వక్త
  choice: మీకాయానే వక్తగా కొనసాగించడం
  alternative: సంపాదకీయ వ్యాఖ్యగా లేదా వేరొక వక్త మాటగా గ్రహించడం
  rationale: సమీప వ్యాకరణ సందర్భంలో అదే వక్త కొనసాగడం అత్యంత సహజమైన పఠనం; పాఠ్యంలో లేని వక్త మార్పును చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రవచన స్వరాన్ని కాపాడుతూ, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదప్రయోగం వాడబడింది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
