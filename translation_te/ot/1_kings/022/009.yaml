  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֶל סָרִ֖יס אֶחָ֑ד וַ/יֹּ֕אמֶר מַהֲרָ֖/ה מִיכָ֥יְהוּ בֶן יִמְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/009.yaml
  text: Then the king of Israel called one officer and said[a], “Bring Micaiah son of Imlah quickly.”
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు రాజు ఒక రాజోద్యోగిని[a] పిలిచి, “ఇమ్లా కుమారుడైన మీకాయాను త్వరగా తీసుకురా” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదమైన ‘సారీస్’కు ‘నపుంసకుడు’ అని లేదా మరింత సాధారణంగా ‘రాజాస్థాన అధికారి/రాజోద్యోగి’ అని అర్థం కావచ్చు. ఇక్కడ రెండవ అర్థమే సందర్భానికి ఎక్కువగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: పిలిచి
  rationale: కרא అనే క్రియ ఈ కథన సందర్భంలో ఒకరిని పిలిపించడం లేదా పిలవడం అనే భావాన్ని ఇస్తుంది. తెలుగులో ‘పిలిచి’ సహజంగా ఉండి, తరువాతి וַיֹּאמֶר‌తో సాఫీగా కలుస్తుంది.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: ఇది మాట్లాడుతున్న వ్యక్తిని గుర్తించే సరళమైన సమాస నిర్మాణం; తెలుగులో ‘ఇశ్రాయేలు రాజు’ సహజమైన రూపం.
- source_word: אֶל־סָרִיס אֶחָד
  choice: ఒక రాజోద్యోగిని
  rationale: סָרִיס అనే పదానికి ‘నపుంసకుడు’ అనే అక్షరార్థంతో పాటు రాజాస్థాన అధికారి అనే విస్తృత అర్థమూ ఉంది. ఇక్కడ అతని పరిపాలనా సేవే సందర్భానికి తగినది కాబట్టి ‘రాజోద్యోగి’ని ప్రధాన పాఠ్యంలో ఉంచి, ఇతర అర్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: מַהֲרָה
  choice: త్వరగా తీసుకురా
  rationale: מַהֲרָה అత్యవసరతను సూచిస్తుంది. హీబ్రూలో తీసుకురావడం అనే క్రియ స్పష్టంగా లేకపోయినా సందర్భం దానిని సూచిస్తుంది; తెలుగులో ఆజ్ఞ సంపూర్ణంగా, సహజంగా ఉండేందుకు ‘త్వరగా తీసుకురా’ అని అనువదించాం.
- source_word: מִיכָיְהוּ
  choice: మీకాయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సులభంగా ఉచ్చరించగల, ప్రాచుర్యంలో ఉన్న రూపంలో లిప్యంతరీకరించాం.
- source_word: בֶן־יִמְלָה
  choice: ఇమ్లా కుమారుడైన
  rationale: ఇది తండ్రి పేరుతో వ్యక్తిని గుర్తించే సాధారణ నిర్మాణం. తెలుగు వాక్యప్రవాహానికి అనుగుణంగా ‘ఇమ్లా కుమారుడైన’ అని ఇచ్చాం.
