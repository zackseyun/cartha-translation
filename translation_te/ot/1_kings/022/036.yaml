  yaml_path: translation/ot/1_kings/022/036.yaml
  text: And a cry passed through the camp at sunset[a], saying, “Each man to his city[b], and each man to his land!”
translation:
  language: te
  text: 'సూర్యాస్తమయ సమయంలో[a] ఒక కేక సైనిక శిబిరమంతటా వ్యాపించింది: “ప్రతి మనిషి తన పట్టణానికి, ప్రతి మనిషి తన దేశానికి వెళ్లిపోవాలి!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సూర్యుడు అస్తమిస్తున్నప్పుడు.”
    reason: translation_alternative
  - marker: b
    text: అక్షరార్థంగా, “ప్రతి మనిషి తన పట్టణానికి, ప్రతి మనిషి తన దేశానికి.” ఇది యుద్ధానంతరం సైనికులను తమ తమ ఇళ్లకు పంపించే సూత్రప్రాయమైన ప్రకటన.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲבֹר הָרִנָּה בַּמַּחֲנֶה
  choice: సైనిక శిబిరమంతటా ఒక కేక వినిపించింది
  rationale: עבר అనే క్రియ కేక శిబిరంలో వ్యాపించడాన్ని సూచిస్తుంది. తెలుగులో ‘శిబిరమంతటా ... వినిపించింది’ సహజంగా ఆ కదలికను, విస్తృతిని వ్యక్తం చేస్తుంది. ‘సైనిక’ అనే పదం సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: הָרִנָּה
  choice: ఒక కేక
  rationale: רִנָּה బిగ్గర కేకను లేదా నినాదాన్ని సూచించవచ్చు. ఇక్కడ ఆనందధ్వని కంటే శిబిరమంతటికి అందిన ప్రకటన భావం ఉంది; ‘కేక’ ఆ అనిశ్చితిని సాధ్యమైనంత వరకు నిలుపుతుంది.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: సూర్యాస్తమయ సమయంలో
  rationale: సూర్యుడు అస్తమించడం అనే హీబ్రూ నుడికారానికి ఇది సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: לֵאמֹר
  choice: 'వినిపించింది:'
  rationale: తరువాత వచ్చే ప్రత్యక్ష ప్రకటనను తెలుగులో సహజంగా పరిచయం చేయడానికి విరామచిహ్నంతో వ్యక్తం చేయబడింది.
- source_word: אִישׁ ... וְאִישׁ
  choice: ప్రతి మనిషి ... ప్రతి మనిషి
  rationale: హీబ్రూలోని పంపిణీ భావాన్ని, పునరుక్తిని నిలుపుతుంది; ఇది యుద్ధంలో పాల్గొన్న పురుషులకు ఉద్దేశించిన సైనిక విసర్జన సూత్రం.
- source_word: אֶל עִירוֹ
  choice: తన పట్టణానికి
  rationale: עִיר కు సందర్భానుకూలమైన సాధారణ తెలుగు పదం ‘పట్టణం’; స్వామ్య ప్రత్యయం ‘తన’తో సహజంగా వ్యక్తమవుతుంది.
- source_word: וְאִישׁ אֶל אַרְצוֹ
  choice: ప్రతి మనిషి తన ప్రాంతానికి
  rationale: אֶרֶץ ఇక్కడ దేశం అనే రాజకీయ భావం కంటే వ్యక్తి స్వస్థల ప్రాంతాన్ని సూచించవచ్చు. ‘ప్రాంతం’ ఆ సందర్భార్థాన్ని సహజ తెలుగులో అందిస్తుంది.
