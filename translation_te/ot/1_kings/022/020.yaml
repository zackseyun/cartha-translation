source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה מִ֤י יְפַתֶּה֙ אֶת אַחְאָ֔ב וְ/יַ֕עַל וְ/יִפֹּ֖ל בְּ/רָמֹ֣ת גִּלְעָ֑ד וַ/יֹּ֤אמֶר זֶה֙ בְּ/כֹ֔ה וְ/זֶ֥ה אֹמֵ֖ר בְּ/כֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/020.yaml
  text: And Yahweh said[a], “Who will entice Ahab, so that he may go up and fall at Ramoth-gilead?” And this one said one thing, and that one said another.
translation:
  language: te
  text: 'అప్పుడు యహ్వే ఇలా అన్నాడు: “అహాబు రామోతు-గిలాదుకు వెళ్లి అక్కడ పడిపోయేలా అతన్ని ఎవరు ప్రలోభపెడతారు[a]?” అప్పుడు ఒకరు ఒక విధంగా, మరొకరు మరొక విధంగా చెప్పారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఒప్పిస్తారు”; సందర్భాన్ని బట్టి ఈ క్రియకు “మోసగిస్తారు” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి సాధారణంగా అంగీకరించిన ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: יְפַתֶּה
  choice: ప్రలోభపెడతారు
  rationale: పియేల్ రూపంలోని ఈ క్రియకు ప్రలోభపెట్టు, ఒప్పించు, మోసగించు అనే భావాలు సందర్భానుసారం రావచ్చు. ప్రధాన పాఠంలో ‘ప్రలోభపెట్టు’ అనేది అహాబును ఒక చర్యవైపు నడిపించే భావాన్ని ఉంచుతూ, ‘మోసగించు’ అని పూర్తిగా నిర్ధారించదు.
- source_word: וְיַעַל
  choice: వెళ్లి
  rationale: రామోతు-గిలాదుకు ‘ఎక్కిపోవడం’ అనే హీబ్రూ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో గమ్యస్థానానికి ‘వెళ్లడం’గా తెలిపింది; ‘పడిపోయేలా’తో కలిపి ఉద్దేశిత ఫలితాన్ని వ్యక్తం చేస్తుంది.
- source_word: וְיִפֹּל
  choice: అక్కడ పడిపోయేలా
  rationale: సైనిక సందర్భంలో మరణం లేదా పరాజయం అంతర్భావంగా ఉన్నా, హీబ్రూ వాడిన ప్రాథమిక ‘పడిపోవు’ రూపకాన్ని అలాగే నిలిపింది. ‘అక్కడ’ అనేది యుద్ధస్థలంతో సహజంగా అనుసంధానిస్తుంది.
- source_word: בְּרָמֹת גִּלְעָד
  choice: రామోతు-గిలాదుకు
  rationale: స్థలనామాన్ని లిప్యంతరీకరించింది. గమనాన్ని సూచించే וְיַעַל కారణంగా తెలుగులో ‘-కు’ సహజంగా సరిపోతుంది.
- source_word: זֶה בְּכֹה וְזֶה אֹמֵר בְּכֹה
  choice: ఒకరు ఒక విధంగా, మరొకరు మరొక విధంగా చెప్పారు
  rationale: వేర్వేరు వ్యక్తులు వేర్వేరు ప్రతిపాదనలు చేసినట్టు సూచించే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: అహాబు పతనంలో దేవుని ప్రమేయం
  choice: అహాబును ఎవరు ప్రలోభపెడతారని యహ్వే నేరుగా అడిగినట్టే ఉంచడం
  alternative: దైవిక ప్రమేయాన్ని తగ్గించేలా ‘అహాబును ఎవరు ప్రభావితం చేస్తారు?’ అని మృదువుగా చెప్పడం
  rationale: హీబ్రూ పాఠం పరలోక సభలో ప్రశ్నను యహ్వే ప్రారంభించినట్టు నేరుగా చూపుతుంది. దైవ సార్వభౌమత్వం, తీర్పు గురించి పాఠంలో ఉన్న ఉద్వేగాన్ని అనువాదం పరిష్కరించకుండా అలాగే నిలుపుతుంది.
translation_notes:
  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. దైవనామం బిరుదుగా కాక వ్యక్తినామంగా ‘యహ్వే’ అని ఇచ్చబడింది; సైనిక సందర్భంలోని ‘పడిపోవు’ రూపకం మరియు ప్రలోభపెట్టడం/ఒప్పించడం/మోసగించడం మధ్య ఉన్న మూలపాఠపు భావ విస్తృతి కాపాడబడ్డాయి.
