translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని ‘రాజు’ అనే పునరుక్తిని నిలిపి, మరణానంతరం ‘వచ్చాడు’ అనే హీబ్రూ ప్రయోగంలోని అసాధారణతను సహజ తెలుగు ప్రధాన పాఠంతోను అక్షరార్థ పాదసూచికతోను ప్రతిబింబించాం.
