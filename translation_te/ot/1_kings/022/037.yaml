  edition: WLC
  text: וַ/יָּ֣מָת הַ/מֶּ֔לֶךְ וַ/יָּב֖וֹא שֹׁמְר֑וֹן וַ/יִּקְבְּר֥וּ אֶת הַ/מֶּ֖לֶךְ בְּ/שֹׁמְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/037.yaml
  text: So the king died and was brought to Samaria[a], and they buried the king in Samaria.
translation:
  language: te
  text: అలా రాజు చనిపోయాడు. అతన్ని సమరయకు తీసుకొచ్చారు[a]; రాజును సమరయలో పాతిపెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా, “రాజు చనిపోయాడు; అతడు సమరయకు వచ్చాడు.” రాజు మరణించిన తర్వాత అతని మృతదేహాన్ని సమరయకు తీసుకొచ్చారనేది భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: מות అనే క్రియ యొక్క ఖల్ వయ్యిక్తోల్ రూపం కథన క్రమంలో మరణించిన సంఘటనను సూచిస్తుంది; ఆధునిక తెలుగులో ‘చనిపోయాడు’ సహజమైన, స్పష్టమైన అనువాదం.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: సందర్భంలో ఇప్పటికే తెలిసిన రాజును, అంటే అహాబును, సూచించే నిర్దిష్ట నామవాచకం. మూలంలోని సాధారణ బిరుదును నిలుపుతూ ఇక్కడ అతని పేరును చేర్చలేదు.
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: అతన్ని సమరయకు తీసుకొచ్చారు
  rationale: క్రియ రూపపరంగా ఏకవచన కర్తరి ప్రయోగంలో ‘అతడు వచ్చాడు’ అని ఉన్నా, రాజు అప్పటికే మరణించినందున సందర్భ భావం అతని మృతదేహం సమరయకు చేరవేయబడిందనేది. తెలుగులో ‘అతన్ని ... తీసుకొచ్చారు’ అని చెప్పడం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది; అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: שֹׁמְרוֹן
  choice: సమరయ
  rationale: ఈ స్థలనామానికి తెలుగులో ప్రామాణికంగా వాడే రూపం.
- source_word: וַיִּקְבְּרוּ
  choice: పాతిపెట్టారు
  rationale: మూడవ పురుష బహువచన క్రియకు కర్తను మూలం పేర్కొనలేదు. తెలుగు క్రియారూపంలో కూడా ఆ అనిర్దిష్ట కర్తను అలాగే నిలిపాం.
- source_word: אֶת הַמֶּלֶךְ
  choice: రాజును
  rationale: హీబ్రూ మూలం ‘రాజు’ అనే నామవాచకాన్ని మళ్లీ వాడుతుంది. ‘అతన్ని’ అని మార్చకుండా ఆ పునరుక్తిని నిలిపాం.
- source_word: בְּשֹׁמְרוֹן
  choice: సమరయలో
  rationale: בְ ఇక్కడ పాతిపెట్టిన స్థలాన్ని సూచిస్తుంది; ‘సమరయలో’ దానికి నేరమైన సహజ తెలుగు సమానం.
