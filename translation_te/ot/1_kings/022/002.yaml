lexical_decisions:
- source_word: וַיְהִי בַּשָּׁנָה הַשְּׁלִישִׁית
  choice: మూడో సంవత్సరంలో
  rationale: וַיְהִי ఇక్కడ కథనాన్ని కాలసూచనతో ముందుకు నడిపే రూపం. తెలుగులో కృత్రిమంగా ‘అప్పుడు ఇలా జరిగింది’ అని చేర్చకుండా, కాలపదబంధంతో వాక్యాన్ని ప్రారంభించడం సహజంగా ఉండి మూలార్థాన్ని నిలుపుతుంది.
- source_word: וַיֵּרֶד
  choice: దిగివెళ్లాడు
  rationale: ירד అనే క్రియలో ‘కిందికి వెళ్లడం’ అనే దిశాత్మక లేదా భౌగోళిక భావం ఉంది. ‘దిగివెళ్లాడు’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన యెహోషాపాతు
  rationale: హీబ్రూ సమాసంలో యెహోషాపాతు రాజపదవి సూచించబడింది. తెలుగులో ‘రాజైన’ అనే విశేషణ రూపం వ్యక్తి పేరుతో సహజంగా అనుసంధానమవుతుంది.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు వద్దకు
  rationale: אֶל ఒక వ్యక్తివైపు లేదా అతని వద్దకు కదలికను సూచిస్తుంది. ‘వద్దకు’ గమ్యమైన వ్యక్తిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
