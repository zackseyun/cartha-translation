  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. దిశను సూచించే మూలభాషా భావాన్ని ‘దిగివెళ్లాడు’ ద్వారా నిలిపి, ప్రత్యామ్నాయ దృష్టికోణాన్ని పాదటిప్పణిలో ఇచ్చాం.
