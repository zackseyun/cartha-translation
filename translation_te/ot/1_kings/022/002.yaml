    text: లేదా ‘దిగి వచ్చాడు.’ హీబ్రూ క్రియకు అక్షరార్థంగా ‘కిందికి వెళ్లాడు’ అనే భావం ఉంది; ఇది సాధారణ ప్రయాణంతో పాటు భౌగోళిక ఎత్తులో మార్పును కూడా సూచించవచ్చు.
