  text: In the third year[a], Jehoshaphat king of Judah went down to the king of Israel.
translation:
  language: te
  text: మూడో సంవత్సరంలో యూదా రాజైన యెహోషాపాతు ఇశ్రాయేలు రాజు వద్దకు దిగివెళ్లాడు[a].
  philosophy: optimal-equivalence
