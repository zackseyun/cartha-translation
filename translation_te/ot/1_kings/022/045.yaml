translation:
  language: te
  text: యెహోషాపాతు ఇశ్రాయేలు రాజుతో శాంతి చేసుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెహోషాపాతు ఇశ్రాయేలు రాజుతో శాంతిగా ఉన్నాడు.” హీబ్రూ క్రియను శాంతి సంబంధాన్ని ఏర్పరచుకున్నాడని గానీ, శాంతి స్థితిలో ఉన్నాడని గానీ అర్థం చేసుకోవచ్చు; ప్రధాన పాఠం సంఘటనార్థాన్ని అనుసరిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁלֵם
  choice: శాంతి చేసుకున్నాడు
  rationale: శׁלם అనే క్రియ హిఫీల్ రూపంలో ఇక్కడ శాంతియుత సంబంధాన్ని ఏర్పరచుకోవడం లేదా సంధి చేసుకోవడం అనే సంఘటనార్థాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘శాంతి చేసుకున్నాడు’ సహజంగా ఉండి, పరస్పర సంబంధాన్ని కూడా వ్యక్తం చేస్తుంది.
- source_word: יְהוֹשָׁפָט
  choice: యెహోషాపాతు
  rationale: వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
- source_word: עִם
  choice: తో
  rationale: సంబంధం లేదా సహవాసాన్ని సూచించే సాధారణ పూర్వప్రత్యయం; ఎవరితో శాంతి చేసుకున్నాడో తెలియజేస్తుంది.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: హీబ్రూ సమాస నిర్మాణాన్ని తెలుగులో సహజంగా ‘ఇశ్రాయేలు రాజు’ అని ఇచ్చాం; సందర్భంలో అప్పటి ఉత్తర రాజ్యపు రాజును సూచిస్తుంది.
