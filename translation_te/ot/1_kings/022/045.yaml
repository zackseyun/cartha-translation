translation_notes:
  register: సహజమైన, ఆధునిక ప్రామాణిక తెలుగును వాడుతూ మూలంలోని సంక్షిప్తతను నిలిపాం. ‘శాంతి చేసుకున్నాడు’ అనే ప్రయోగం సాధారణ పాఠకులకు స్పష్టంగా ఉండి, మూలంలోని సంఘటనార్థానికి ప్రాధాన్యం ఇస్తుంది; స్థిత్యర్థాన్ని పాదసూచికలో నిలిపాం.
