id: 1KI.22.41
reference: 1 Kings 22:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וִ/יהֽוֹשָׁפָט֙ בֶּן אָסָ֔א מָלַ֖ךְ עַל יְהוּדָ֑ה בִּ/שְׁנַ֣ת אַרְבַּ֔ע לְ/אַחְאָ֖ב מֶ֥לֶךְ יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/041.yaml
  text: And Jehoshaphat son of Asa became king over Judah in the fourth year of Ahab king of Israel.
translation:
  language: te
  text: ఇశ్రాయేలు రాజైన అహాబు పాలనలో నాలుగో సంవత్సరంలో, ఆసా కుమారుడైన యెహోషాపాతు యూదాకు రాజయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִ/יהֽוֹשָׁפָט
  choice: యెహోషాపాతు
  rationale: వావ్ కథన అనుసంధానాన్ని సూచించినా, ఆధునిక తెలుగు వాక్యంలో ప్రత్యేకంగా ‘మరియు’ అని చేర్చకుండానే సందర్భ సంబంధం సహజంగా ఉంటుంది; వ్యక్తి పేరు సంప్రదాయ తెలుగు లిప్యంతరీకరణలో ఇవ్వబడింది.
- source_word: בֶּן אָסָא
  choice: ఆసా కుమారుడు
  rationale: వంశసంబంధాన్ని సంక్షిప్తంగా, సహజమైన తెలుగు నిర్మాణంలో తెలియజేస్తుంది.
- source_word: מָלַךְ
  choice: రాజయ్యాడు
  rationale: ఇక్కడ క్రియ పాలన కొనసాగింపుకన్నా రాజ్యాధికార స్వీకరణను సూచిస్తుంది; ‘రాజయ్యాడు’ ఆ ఆరంభార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: עַל יְהוּדָה
  choice: యూదా మీద
  rationale: עַל రాజ్యాధికార పరిధిని సూచిస్తుంది; ‘మీద’ మూలంలోని ‘over’ భావాన్ని సహజమైన తెలుగు రాజపాలనా ప్రయోగంలో నిలుపుతుంది.
- source_word: בִּ/שְׁנַת אַרְבַּע
  choice: నాలుగో సంవత్సరంలో
  rationale: రాజుల కాలనిర్ణయ సూత్రానికి సాధారణమైన, స్పష్టమైన తెలుగు రూపం.
- source_word: לְ/אַחְאָב
  choice: అహాబు పాలనలో
  rationale: ఈ కాలనిర్ణయ సూత్రంలో לְ అహాబు రాజ్యపాలనా సంవత్సరాన్ని సూచిస్తుంది; తెలుగులో ‘అహాబు పాలనలో’ అని చెప్పడం భావాన్ని స్పష్టంగా చేస్తుంది.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజైన
  rationale: అహాబును గుర్తించే సమానాధికార బిరుదును తెలుగులో సహజమైన విశేషణ నిర్మాణంగా అందిస్తుంది.
