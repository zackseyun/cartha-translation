- from: ఇశ్రాయేలు రాజైన అహాబు పాలనలో నాలుగో సంవత్సరంలో, ఆసా కుమారుడు యెహోషాపాతు యూదా మీద రాజయ్యాడు.
  to: ఇశ్రాయేలు రాజైన అహాబు పాలనలో నాలుగో సంవత్సరంలో, ఆసా కుమారుడైన యెహోషాపాతు యూదాకు రాజయ్యాడు.
