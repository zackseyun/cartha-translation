  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే చారిత్రక వర్ణన. పేర్లు తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడ్డాయి.
