reference: 1 Kings 22:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּצֵ֣א הָ/ר֗וּחַ וַֽ/יַּעֲמֹד֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יֹּ֖אמֶר אֲנִ֣י אֲפַתֶּ֑/נּוּ וַ/יֹּ֧אמֶר יְהוָ֛ה אֵלָ֖י/ו בַּ/מָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/021.yaml
  text: Then the spirit came forward and stood before Yahweh and said[a], ‘I will entice him.’ And Yahweh said to him[b], ‘By what means?’
translation:
  language: te
  text: అప్పుడు ఆ ఆత్మ[a] ముందుకు వచ్చి యెహోవా సన్నిధిలో నిలబడి, “నేను అతన్ని ప్రలోభపెడతాను[b]” అని చెప్పింది. యెహోవా ఆ ఆత్మతో, “ఏ విధంగా?” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఒక ఆత్మ.” హెబ్రీలో “ఆ ఆత్మ” అని ఉంది. ఇది పరలోక సభలోని ఒక నిర్దిష్ట ఆత్మీయ ప్రాణిని సూచించే అవకాశం ఉంది; తప్పనిసరిగా పరిశుద్ధాత్మను సూచించదు.
    reason: alternative_reading
  - marker: b
    text: “నేను అతన్ని ఒప్పిస్తాను” లేదా “నేను అతన్ని మోసగిస్తాను” అని కూడా అనువదించవచ్చు. ఈ క్రియ ప్రలోభపెట్టడం, ఒప్పించడం లేదా మభ్యపెట్టడం అనే అర్థాలను ఇవ్వగలదు; ఉపయోగించే పద్ధతి తరువాతి వచనంలో స్పష్టమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרוּחַ
  choice: ఆ ఆత్మ
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ఈ పదం పరలోక సభలోని ఒక ప్రత్యేక ఆత్మీయ ప్రాణిని సూచిస్తుంది. ‘పరిశుద్ధాత్మ’ అనే భావాన్ని అనవసరంగా కలిగించకుండా, నిర్దిష్టతను నిలుపుతుంది.
- source_word: וַיֵּצֵא
  choice: ముందుకు వచ్చి
  rationale: మూల క్రియకు బయటికి రావడం అనే ప్రాథమిక అర్థం ఉన్నా, ఈ సభా సందర్భంలో సమూహం నుండి ముందుకు వచ్చి తనను తాను సమర్పించుకోవడం అనే సహజ భావం ఉంది.
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: సన్నిధిలో నిలబడి
  rationale: ఒక అధికారి ఎదుట అధికారికంగా నిలబడే సభా దృశ్యాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: אֲפַתֶּנּוּ
  choice: నేను అతన్ని ప్రలోభపెడతాను
  rationale: పిత్తేల్ రూపంలోని క్రియ ప్రలోభపెట్టడం, మభ్యపెట్టడం లేదా ఒప్పించడం అనే అర్థాలను కలిగి ఉంటుంది. తరువాతి వచనం పద్ధతిని స్పష్టం చేసే వరకు ప్రేరేపించి ఉచ్చులోకి నడిపించే భావాన్ని ఇది నిలుపుతుంది.
- source_word: בַּמָּה
  choice: దేని ద్వారా?
  rationale: ఏ మార్గం లేదా సాధనం ద్వారా ఆ ప్రతిపాదనను అమలు చేస్తావని ప్రశ్నిస్తున్న మూలభావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: పరలోక సభలో הָרוּחַ గుర్తింపు
  choice: ఒక నిర్దిష్ట ఆత్మీయ ప్రాణిని సూచించే ‘ఆ ఆత్మ’
  alternative: ‘పరిశుద్ధాత్మ’ లేదా అనిర్దిష్టమైన ‘ఒక ఆత్మ’
  rationale: సందర్భంలో పరలోక సైన్యంలోని ఒక ఆత్మ ముందుకు వస్తుంది. ‘పరిశుద్ధాత్మ’ అని అనువదించడం మూలపాఠం కోరనంతగా గుర్తింపును నిర్ణయిస్తుంది; ‘ఒక ఆత్మ’ అనడం హెబ్రీ నిర్దిష్ట ఉపపదాన్ని తగ్గిస్తుంది.
- issue: אֲפַתֶּנּוּ యొక్క నైతిక-అర్థ పరిధి
  choice: ‘ప్రలోభపెడతాను’
  alternative: ‘ఒప్పిస్తాను’ లేదా ‘మోసగిస్తాను’
  rationale: క్రియలో ఉన్న ప్రేరేపణ, ఆకర్షణ, మభ్యపెట్టడం అనే పరిధిని ఒకే విధంగా పూర్తిగా తేల్చకుండా ఉంచుతుంది; నిర్దిష్ట పద్ధతి తరువాతి వచనంలో వెల్లడవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ఆత్మకు తెలుగు వ్యాకరణానుసారం నపుంసక సూచన (‘చెప్పింది’, ‘దానితో’) వాడబడింది; దీని ద్వారా ఆ ప్రాణి స్వభావం లేదా లింగం గురించి అదనపు సిద్ధాంత నిర్ణయం చేయబడలేదు.
