  edition: WLC
  text: וּ/מֶ֣לֶךְ אֲרָ֡ם צִוָּ֣ה אֶת שָׂרֵי֩ הָ/רֶ֨כֶב אֲשֶׁר ל֜/וֹ שְׁלֹשִׁ֤ים וּ/שְׁנַ֨יִם֙ לֵ/אמֹ֔ר לֹ֚א תִּלָּ֣חֲמ֔וּ אֶת קָטֹ֖ן וְ/אֶת גָּד֑וֹל כִּ֛י אִֽם אֶת מֶ֥לֶךְ יִשְׂרָאֵ֖ל לְ/בַדּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/031.yaml
  text: The king of Aram had commanded the thirty-two chariot commanders who belonged to him[a], saying, “Do not fight with either small or great[c][b], but only with the king of Israel alone.”
translation:
  language: te
  text: 'అరాము రాజు తనకు చెందిన ముప్పై ఇద్దరు రథదళాధిపతులకు ఇలా ఆజ్ఞాపించాడు: “చిన్నవారితో గాని గొప్పవారితో గాని[a] యుద్ధం చేయకండి; ఇశ్రాయేలు రాజుతో మాత్రమే యుద్ధం చేయండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “చిన్నవారితో గాని గొప్పవారితో గాని” అనేది హోదా లేదా ప్రాముఖ్యత ఏదైనా సరే, ఇతరులెవ్వరితోనూ యుద్ధం చేయవద్దనే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: అరాము రాజు
  rationale: ו narrative connectiveను తెలుగులో ప్రత్యేక పదంగా చూపకపోయినా వాక్యప్రవాహంలో దాని పని నిలుస్తుంది. אֲרָםను సంప్రదాయ ‘సిరియా’కు బదులు మూల స్థలనామానికి దగ్గరగా ‘అరాము’గా ఇచ్చాం.
- source_word: צִוָּה
  choice: ఆజ్ఞాపించాడు
  rationale: అధికారపూర్వకమైన సైనిక ఆదేశాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది. హీబ్రూ రూపం కాలపూర్వత్వాన్ని ప్రత్యేకంగా వ్యాకరణీకరించదు; సందర్భాన్ని తెలుగులో సాధారణ భూతకాలంతో సహజంగా చూపాం.
- source_word: שָׂרֵי הָרֶכֶב אֲשֶׁר לוֹ שְׁלֹשִׁים וּשְׁנַיִם
  choice: తన ముప్పై ఇద్దరు రథదళాధిపతులకు
  rationale: שָׂרֵי הָרֶכֶב అనేది రథసేనకు సంబంధించిన నాయకులను సూచిస్తుంది. ‘తన’ ద్వారా אֲשֶׁר לוֹలోని అనుబంధం సహజంగా వ్యక్తమవుతుంది.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రపదాన్ని తెలుగులో సహజమైన ఉద్ధరణ ప్రవేశంగా అందిస్తుంది.
- source_word: לֹא תִּלָּחֲמוּ אֶת קָטֹן וְאֶת גָּדוֹל
  choice: చిన్నవాడితో గాని గొప్పవాడితో గాని యుద్ధం చేయకండి
  rationale: హీబ్రూ జంటపద ప్రయోగాన్ని నిలుపుతూ, హోదా తక్కువవాడైనా ఎక్కువవాడైనా ఎవ్వరితోనూ యుద్ధం చేయవద్దనే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: כִּי אִם אֶת מֶלֶךְ יִשְׂרָאֵל לְבַדּוֹ
  choice: ఇశ్రాయేలు రాజుతో మాత్రమే యుద్ధం చేయండి
  rationale: כִּי אִם మరియు לְבַדּוֹ కలిగించే బలమైన ప్రత్యేకతను ‘మాత్రమే’ ద్వారా తెలియజేశాం. ముందు క్రియను తెలుగులో మళ్లీ ఉంచడం వల్ల ఆజ్ఞ స్పష్టంగా, సహజంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలి. సైనిక పదజాలంలో ‘రథదళాధిపతులు’ను ఉపయోగించి మూలంలోని అధికార హోదా మరియు రథదళ సంబంధం రెండింటినీ నిలిపాం.
