  source_fidelity: The translation accurately represents the king of Aram, his thirty-two chariot commanders, the prohibitory command, and the exclusive focus on the king of Israel. Adding “తనకు చెందిన” makes the relative clause אֲשֶׁר לוֹ explicit without adding meaning.
