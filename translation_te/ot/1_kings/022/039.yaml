  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక శైలిని ఉపయోగించాం. మూలంలోని జాబితా నిర్మాణాన్నీ చివరి అలంకారప్రశ్ననూ నిలిపాం. ఇచ్చిన ఆంగ్ల consultation layer లో పాదసూచిక గుర్తులు వాటి విషయాలకు సరిపోని స్థానాల్లో కనిపించడంతో, మూలార్థానికి అనుగుణంగా [a]ను ‘దంతపు భవనం’ వద్ద, [b]ను గ్రంథశీర్షిక వద్ద ఉంచాం.
