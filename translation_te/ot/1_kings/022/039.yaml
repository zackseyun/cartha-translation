source:
  edition: WLC
  text: וְ/יֶתֶר֩ דִּבְרֵ֨י אַחְאָ֜ב וְ/כָל אֲשֶׁ֣ר עָשָׂ֗ה וּ/בֵ֤ית הַ/שֵּׁן֙ אֲשֶׁ֣ר בָּנָ֔ה וְ/כָל הֶ/עָרִ֖ים אֲשֶׁ֣ר בָּנָ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/039.yaml
  text: The rest of the acts of Ahab[a], and all that he did, and the ivory house that he built[b], and all the cities that he built—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: te
  text: అహాబు మిగిలిన కార్యాలు, అతడు చేసినదంతా, అతడు నిర్మించిన దంతపు భవనం[a], అతడు నిర్మించిన పట్టణాలన్నీ—ఇవన్నీ ‘ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథం’లో[b] రాసి ఉన్నాయి కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దంతపు ఇల్లు.’ ఇది పూర్తిగా దంతంతో చేసిన కట్టడం కాకుండా, దంతంతో అలంకరించిన భవనాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథం’ అనేది రాజుల గ్రంథంలో ఉదహరించబడిన రాజరిక నమోదు గ్రంథం; ఇది బైబిలులోని దినవృత్తాంతాల గ్రంథమే అని తప్పనిసరిగా భావించకూడదు.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אַחְאָב
  choice: అహాబు మిగిలిన కార్యాలు
  rationale: రాజుల పాలనాసారాంశ సూత్రంలో דִּבְרֵי అనేది కేవలం ‘మాటలు’ కాక, రాజు చేసిన కార్యాలు లేదా అతనికి సంబంధించిన సంగతులను సూచిస్తుంది. ‘మిగిలిన కార్యాలు’ ఆధునిక తెలుగులో సహజంగా ఈ భావాన్ని అందిస్తుంది.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: అతడు చేసినదంతా
  rationale: עָשָׂה అనే విస్తృతార్థక క్రియను అదనపు నిర్దిష్టత లేకుండా నేరుగా అనువదిస్తుంది.
- source_word: בֵּית הַשֵּׁן
  choice: దంతపు భవనం
  rationale: అక్షరార్థంగా ‘దంతపు ఇల్లు/భవనం.’ ఇది పూర్తిగా దంతంతో చేసిన కట్టడం కంటే దంతంతో అలంకరించిన రాజభవనాన్ని సూచించే అవకాశం ఉంది; ‘భవనం’ మూలంలోని בֵּית కంటే అతిగా ‘రాజభవనం’ అని నిర్ధారించదు.
- source_word: וְכָל הֶעָרִים אֲשֶׁר בָּנָה
  choice: అతడు నిర్మించిన పట్టణాలన్నీ
  rationale: עָרִים కు ‘పట్టణాలు’ సహజమైన సాధారణ తెలుగు సమానం; בָּנָה ను ‘నిర్మించిన’గా ఇవ్వడం మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: ఇవన్నీ … రాసి ఉన్నాయి కదా?
  rationale: הֲלוֹא సానుకూల సమాధానాన్ని ఆశించే అలంకారప్రశ్నను సూచిస్తుంది. తెలుగు ‘కదా?’ ఆ ప్రశ్న స్వభావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: ‘ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథం’
  rationale: ఇది రాజుల చారిత్రక నమోదు గ్రంథానికి శీర్షిక. ‘దినవృత్తాంతాలు’ చారిత్రక అన్నాళ్లు/కాలవృత్తాంతాలు అనే భావాన్ని ఇస్తుంది; సంబంధసూచక לְ ను ‘రాజుల’ అనే షష్ఠీ నిర్మాణంతో సహజంగా వ్యక్తం చేసింది.
