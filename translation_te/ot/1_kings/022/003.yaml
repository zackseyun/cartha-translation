  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֶֽלֶךְ יִשְׂרָאֵל֙ אֶל עֲבָדָ֔י/ו הַ/יְדַעְתֶּ֕ם כִּֽי לָ֖/נוּ רָמֹ֣ת גִּלְעָ֑ד וַ/אֲנַ֣חְנוּ מַחְשִׁ֔ים מִ/קַּ֣חַת אֹתָ֔/הּ מִ/יַּ֖ד מֶ֥לֶךְ אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/003.yaml
  text: And the king of Israel said to his servants[a], “Do you know that Ramoth-gilead belongs to us[b], yet we are doing nothing to take it from the hand of the king of Aram?”
translation:
  language: te
  text: 'ఇశ్రాయేలు రాజు తన సేవకులతో ఇలా అన్నాడు: “రామోతు-గిలాదు మనదని మీకు తెలుసు కదా? అయినా, దానిని అరాము[b] రాజు చేతిలోనుండి తీసుకోవడానికి మనం ఏమీ చేయడం లేదు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “దానిని తీసుకోకుండా మౌనంగా ఉన్నాం.” ఇక్కడి హీబ్రూ నుడికారం చర్య తీసుకోకపోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘అరాము’ అనేది హీబ్రూ పేరు; పాత అనువాదాల్లో దీనిని తరచుగా ‘సిరియా’ అని అనువదించారు.
    reason: alternative_reading
lexical_decisions:
- source_word: עֲבָדָיו
  choice: తన సేవకులతో
  rationale: עבד అనే పదం రాజసభలోని సేవకులను లేదా అధికారులను సూచించగలదు. హీబ్రూ పదప్రయోగాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘సేవకులు’ సహజంగా నిలుపుతుంది.
- source_word: הֲיְדַעְתֶּם
  choice: మీకు తెలుసు కదా?
  rationale: ఇది పంచుకున్న జ్ఞానాన్ని గుర్తుచేసే అలంకారప్రశ్న. హీబ్రూలో నిషేధార్థక పదం లేకపోయినా, ఆధునిక తెలుగులో ‘తెలుసు కదా?’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי לָנוּ רָמֹת גִּלְעָד
  choice: గిలాదు రామోతు మనదని
  rationale: לָנוּ ఇక్కడ స్వాధీనత లేదా భూహక్కు దావాను సూచిస్తుంది; ‘మనది’ సంక్షిప్తంగా, సహజంగా ఆ అర్థాన్ని ఇస్తుంది.
- source_word: רָמֹת גִּלְעָד
  choice: గిలాదు రామోతు
  rationale: సంయుక్త స్థలనామాన్ని తెలుగులో పరిచిత బైబిలు నామక్రమంతో లిప్యంతరీకరించింది.
- source_word: מַחְשִׁים
  choice: మనం ఏమీ చేయడం లేదు
  rationale: మూలపదానికి అక్షరార్థంగా ‘మౌనంగా ఉండడం’ అనే భావమున్నా, ఈ సందర్భంలో అది నిందార్హమైన నిష్క్రియను సూచిస్తుంది. ప్రస్తుత తెలుగు వాడుకలో ఈ ఎంపిక సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: מִקַּחַת אֹתָהּ
  choice: దాన్ని ... తీసుకోకుండా
  rationale: מן తో కూడిన క్రియారూపం చేయకుండా వదిలిన కార్యాన్ని సూచిస్తుంది. ‘తీసుకోకుండా’ వాక్య నిర్మాణంలో సహజంగా ఆ సంబంధాన్ని చూపుతుంది.
- source_word: מִיַּד
  choice: చేతిలోనుండి
  rationale: ఇది అధీనంలో లేదా నియంత్రణలో ఉండడాన్ని సూచించే హీబ్రూ నుడికారం. అర్థమయ్యే బైబిలు శైలిని నిలుపుతూ అక్షరరూపాన్ని సంరక్షిస్తుంది.
- source_word: אֲרָם
  choice: అరాము
  rationale: తరువాతి కాలపు ‘సిరియా’ అనే భౌగోళిక పేరుకు బదులు మూల హీబ్రూ నామాన్ని లిప్యంతరీకరించింది.
