    issue: The toponym is in reverse order.
    rationale: The Hebrew reads רָמֹת גִּלְעָד (‘Ramoth-gilead’). The draft’s “గిలాదు రామోతు” reverses its components and is not the source order.
  - severity: low
    issue: The Telugu construction ‘దాన్ని ... తీసుకోకుండా మనం ఏమీ చేయడం లేదు’ can attach ‘without taking it’ to ‘doing nothing’ in a less direct way.
    rationale: The Hebrew idiom denotes remaining inactive with respect to taking the city. ‘దానిని ... తీసుకోవడానికి మనం ఏమీ చేయడం లేదు’ states that relationship clearly while retaining the contextual sense of מַחְשִׁים.
  - severity: low
    issue: The explanatory note for Aram in the English audit trail is absent.
    rationale: Adding an anchored, non-interpretive note preserves the audit-trail help that Aram is the Hebrew name often rendered ‘Syria’ in older translations.
