translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘చేతిలోనుండి’ అనే హీబ్రూ నుడికారాన్ని బైబిలు వాక్యరుచికోసం నిలిపి, מַחְשִׁים యొక్క సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో సహజీకరించి అక్షరార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
