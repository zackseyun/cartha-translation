id: 1KI.22.7
reference: 1 Kings 22:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט הַ/אֵ֨ין פֹּ֥ה נָבִ֛יא לַ/יהוָ֖ה ע֑וֹד וְ/נִדְרְשָׁ֖ה מֵ/אוֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/007.yaml
  text: But Jehoshaphat said[a], “Is there not still here a prophet of Yahweh, that we may inquire of him?”
translation:
  language: te
  text: అప్పుడు యెహోషాపాతు, “ఇక్కడ ఇంకా యెహోవా ప్రవక్త ఎవరైనా లేరా? అతని ద్వారా మనం విచారిద్దాం[a]” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇక్కడ యెహోవా ప్రవక్త మరొకరు లేరా? అతనిని అడుగుదాం.”
    reason: עוֹד ను ‘ఇంకా’ లేదా సందర్భానుసారం ‘మరొకరు’గా గ్రహించవచ్చు; מֵאֹתוֹ ను ‘అతని ద్వారా’ లేదా మరింత అక్షరార్థానికి దగ్గరగా ‘అతనిని/అతని వద్ద’ అని అనువదించవచ్చు.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అని అడిగాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది. ఇది ప్రశ్న కావడంతో తెలుగులో ‘అని అడిగాడు’ సహజంగా ఉంటుంది; సందర్భంలోని స్వల్ప వ్యత్యాసాన్ని ప్రత్యేకంగా ‘కానీ’ అని అధికంగా సూచించకుండా ఉంటుంది.
- source_word: יְהוֹשָׁפָט
  choice: యెహోషాపాతు
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన వ్యక్తినామ లిప్యంతరీకరణ.
- source_word: הֲאֵין ... עוֹד
  choice: ఇంకా ... ఎవరైనా లేరా?
  rationale: నిరాకరణాత్మక ప్రశ్నతో పాటు עוֹד సూచించే ‘ఇంకా/మిగిలి ఉన్న’ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. అదనంగా మరో ప్రవక్త అనే సందర్భార్థాన్ని ‘ఎవరైనా’ స్పష్టం చేస్తుంది.
- source_word: פֹּה
  choice: ఇక్కడ
  rationale: స్థలాన్ని సూచించే సరళ క్రియావిశేషణానికి సహజమైన తెలుగు సమానం.
- source_word: נָבִיא לַיהוָה
  choice: యెహోవా ప్రవక్త
  rationale: లామెద్ ఇక్కడ సంబంధం లేదా అనుబంధాన్ని సూచిస్తుంది—యెహోవాకు చెందిన లేదా ఆయన తరఫున పలికే ప్రవక్త. తెలుగు సమాస నిర్మాణం ఈ భావాన్ని సంక్షిప్తంగా ఇస్తుంది.
- source_word: וְנִדְרְשָׁה
  choice: మనం విచారిద్దాం
  rationale: మొదటి పురుష బహువచన cohortative లోని సంకల్పం/ఆహ్వాన భావాన్ని సహజంగా కాపాడుతుంది.
- source_word: מֵאֹתוֹ
  choice: అతని ద్వారా
  rationale: అక్షరార్థంగా ‘అతని నుండి’; సందర్భంలో దేవుని సమాధానాన్ని ప్రవక్త మధ్యవర్తిత్వం ద్వారా అడగడం భావం. ‘అతని ద్వారా’ తెలుగులో ఆ కార్యసంబంధాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో చతురక్షర దైవనామం నేరుగా ఉంది. తెలుగులో విస్తృతంగా గుర్తించబడే నామరూపం ‘యెహోవా’; దాన్ని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా వ్యక్తినామ స్వభావాన్ని నిలుపుతుంది.
- issue: ప్రవక్తను విచారించడం అనే భావం
  choice: అతని ద్వారా మనం విచారిద్దాం
  alternative: అతనిని అడుగుదాం
  rationale: ప్రవక్తనే అంతిమ జవాబు మూలంగా చూపకుండా, అతని ద్వారా యెహోవా సమాధానాన్ని వెదకడం అనే సందర్భార్థాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన ప్రశ్నారూపం. మూలంలోని నిరాకరణాత్మక ప్రశ్న, అదనపు ప్రవక్త కోసం వెదకడం, cohortative సంకల్పభావం నిలుపబడ్డాయి.
