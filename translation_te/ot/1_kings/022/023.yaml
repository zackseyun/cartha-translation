id: 1KI.22.23
reference: 1 Kings 22:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֨ה נָתַ֤ן יְהוָה֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאֶ֣י/ךָ אֵ֑לֶּה וַֽ/יהוָ֔ה דִּבֶּ֥ר עָלֶ֖י/ךָ רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/023.yaml
  text: And now[a], behold, Yahweh has put a lying spirit in the mouth of all these prophets of yours[b], and Yahweh has spoken disaster against you.
translation:
  language: te
  text: “ఇప్పుడు, ఇదిగో, యెహోవా నీ ఈ ప్రవక్తలందరి నోట అబద్ధపు ఆత్మను ఉంచాడు[a]. యెహోవా నీకు విపత్తు కలుగుతుందని చెప్పాడు[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అసత్యపు ఆత్మను.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీకు అపాయం కలుగుతుందని చెప్పాడు.” ఈ హీబ్రూ పదం తీర్పు సందర్భాల్లో విపత్తు లేదా అపాయాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: సంభాషణను ప్రస్తుత నిర్ణాయక విషయానికి మళ్లించే కాలసూచక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; హీబ్రూలోని సంధికార్థం తెలుగు వాక్యప్రవాహంలో అంతర్లీనంగా ఉంటుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: శ్రద్ధను గంభీరంగా ఆకర్షించే ప్రవచనాత్మక ఉద్ఘాటనను కాపాడుతుంది.
- source_word: נָתַן
  choice: ఉంచాడు
  rationale: ‘నోట ... ఆత్మను’ అనే సందర్భంలో హీబ్రూ క్రియ తెలిపే ప్రత్యక్ష కార్యాన్ని సహజంగా వ్యక్తం చేస్తుంది; దాన్ని ‘అనుమతించాడు’ అని మృదువుగా మార్చదు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని తెలుగు పాఠకులకు పరిచితమైన లిప్యంతరీకరణలో అందిస్తుంది.
- source_word: רוּחַ שֶׁקֶר
  choice: అబద్ధపు ఆత్మ
  rationale: మోసంతో లక్షణీకరించబడిన ఆత్మ అనే సంధిపద భావాన్ని సంక్షిప్తంగా నిలుపుతుంది; వ్యక్తిగత కర్తృత్వాన్నీ, పదబంధంలోని కొంత సందిగ్ధతనూ కాపాడుతుంది.
- source_word: בְּפִי
  choice: నోట
  rationale: హీబ్రూ ఏకవచన రూపం తరువాతి బహువచన సమూహానికి పంపిణీయంగా వర్తిస్తుంది; తెలుగులో ‘ప్రవక్తలందరి నోట’ సహజమైన వాక్ప్రయోగం.
- source_word: כָּל נְבִיאֶיךָ אֵלֶּה
  choice: నీ ఈ ప్రవక్తలందరి
  rationale: రెండవ పురుష స్వామ్యార్థం, సూచనాత్మక ఉద్ఘాటన, సమగ్రత—మూడింటినీ కాపాడుతుంది.
- source_word: דִּבֶּר עָלֶיךָ רָעָה
  choice: నీ మీదికి విపత్తును ప్రకటించాడు
  rationale: ఇక్కడ דִּבֶּר అనేది పలికిన తీర్పు ప్రకటనను, רָעָה నైతిక చెడును కాక రాబోయే హానికర తీర్పును సూచిస్తుంది. ‘ప్రకటించాడు’ తెలుగు సహజత్వాన్ని ఇస్తూ దైవ ప్రకటన బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యెహోవా కార్యంతో సంబంధించి רָעָה పదం
  choice: విపత్తు
  alternative: కీడు; అపాయం
  rationale: ఈ తీర్పు సందర్భంలో పదం నైతిక దుష్టత్వం కన్నా రాబోయే హాని లేదా విపత్తును సూచిస్తుంది. ‘విపత్తు’ మూలపాఠ బలాన్ని నిలుపుతూ దేవుడు నైతిక చెడు చేశాడనే అనవసర భావాన్ని రానివ్వదు.
- issue: దైవ సార్వభౌమత్వం కింద అబద్ధపు ఆత్మ కర్తృత్వం
  choice: యెహోవా ... అబద్ధపు ఆత్మను ఉంచాడు
  alternative: యెహోవా ... అబద్ధపు ఆత్మను అనుమతించాడు
  rationale: נָתַן అనే క్రియ దైవ కార్యాన్ని నేరుగా చెబుతుంది. ‘అనుమతించాడు’ అని మార్చకుండా మూలపాఠంలోని వేదాంత ఉద్రిక్తతను యథాతథంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనదిగానూ గంభీరమైనదిగానూ రూపొందించబడింది. ‘ఇదిగో’ ప్రవచనాత్మక ఉద్ఘాటనను నిలుపుతుంది. దైవ కర్తృత్వాన్ని మృదువుచేయకుండా, రాబోయే తీర్పును నైతిక చెడుగా అపార్థం చేసుకోకుండా పదాలను ఎంచుకున్నాం.
