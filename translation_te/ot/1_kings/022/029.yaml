  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన కథనశైలి. హీబ్రూలోని ఏకవచన క్రియ రెండు కర్తలను కలిపి సూచించినందున తెలుగులో సహజంగా బహువచన గౌరవ/సమన్వయ రూపమైన ‘వెళ్లారు’ వాడాం.
