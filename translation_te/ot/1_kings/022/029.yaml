translation:
  language: te
  text: కాబట్టి ఇశ్రాయేలు రాజు మరియు యూదా రాజైన యెహోషాపాతు గిలాదు రామోతుకు పైకి వెళ్లారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: వెళ్లారు
  rationale: עלה అనే క్రియకు ప్రాథమికంగా ‘పైకి వెళ్లడం’ అనే భావం ఉన్నా, తెలుగులో ఈ స్థలనామంతో ‘పైకి వెళ్లారు’ అనడం అసహజంగా ఉండవచ్చు. సందర్భంలోని సైనిక ప్రయాణాన్ని అతిగా వ్యాఖ్యానించకుండా సహజమైన ‘వెళ్లారు’ అని అనువదించాం.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: మూలంలో వ్యక్తిగత పేరు కాకుండా రాజబిరుదే ఉంది; దానిని అలాగే నిలిపాం.
- source_word: וִיהוֹשָׁפָט
  choice: యెహోషాపాతు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన బైబిలు రూపాన్ని ఉపయోగించాం.
- source_word: מֶלֶךְ יְהוּדָה
  choice: యూదా రాజైన
  rationale: యెహోషాపాతును వివరిస్తున్న సమానాధికార పదబంధాన్ని సహజమైన తెలుగు నిర్మాణంలో ఇచ్చాం.
- source_word: רָמֹת גִּלְעָד
  choice: గిలాదు రామోతు
  rationale: సంయుక్త స్థలనామానికి తెలుగులో విస్తృతంగా పరిచయమైన రూపాన్ని ఎంచుకున్నాం.
