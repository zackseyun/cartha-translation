  terminology: Use “యాహ్వే” for יהוה, consistently reflecting the prescribed personal divine name. “ప్రవక్తలు,” “ప్రవచిస్తూ,” “విజయం సాధించండి,” and “రాజు చేతికి అప్పగిస్తాడు” are accurate and natural.
