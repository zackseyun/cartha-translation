id: 1KI.22.12
reference: 1 Kings 22:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל הַ/נְּבִאִ֔ים נִבְּאִ֥ים כֵּ֖ן לֵ/אמֹ֑ר עֲלֵ֞ה רָמֹ֤ת גִּלְעָד֙ וְ/הַצְלַ֔ח וְ/נָתַ֥ן יְהוָ֖ה בְּ/יַ֥ד הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/012.yaml
  text: And all the prophets were prophesying thus[a], saying, “Go up to Ramoth-gilead and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: te
  text: 'ప్రవక్తలందరూ ఇదే విధంగా[a] ప్రవచిస్తూ ఇలా అన్నారు: “రామోత్-గిలాదుకు వెళ్లి విజయం సాధించండి; యాహ్వే దానిని రాజు చేతికి అప్పగిస్తాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అలా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל הַ/נְּבִאִים
  choice: ప్రవక్తలందరూ కూడా
  rationale: సమూహవాచకమైన כָל‌ను, నిర్దిష్టతను సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది; וְ కథన అనుసంధానాన్ని ‘కూడా’ ద్వారా సందర్భానుగుణంగా వ్యక్తం చేస్తుంది.
- source_word: נִבְּאִים
  choice: ప్రవచిస్తూ
  rationale: హీబ్రూ కృదంత రూపం కొనసాగుతున్న, సమకాలీన చర్యను సూచిస్తున్నందున ‘ప్రవచిస్తూ’ సరిపోతుంది.
- source_word: כֵּן
  choice: అదే విధంగా
  rationale: వారందరి ప్రవచనం ఒకే రీతిగా ఉందనే విధానార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לֵ/אמֹר
  choice: అని చెప్పారు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ రూపాన్ని తెలుగులో సహజమైన ఉద్ధరణ ముగింపు నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: עֲלֵה
  choice: వెళ్లి
  rationale: పదశః ‘పైకి వెళ్లు’ అయినా, స్థలానికి వెళ్లమనే ఆజ్ఞను తెలుగులో సహజంగా ఇస్తుంది; దాడి చేయడం అనే భావాన్ని అవసరానికి మించి చేర్చదు.
- source_word: רָמֹת גִּלְעָד
  choice: రామోత్-గిలాదు
  rationale: హీబ్రూ స్థలనామానికి సమీపమైన, తెలుగులో చదవదగిన లిప్యంతరీకరణ.
- source_word: וְ/הַצְלַח
  choice: విజయం సాధించండి
  rationale: צלח హిఫిల్ రూపంలోని విజయవంతమైన ఫలితాన్ని సైనిక సందర్భంలో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְ/נָתַן
  choice: అప్పగిస్తాడు
  rationale: వావ్‌తో కూడిన రూపాన్ని ముందున్న ఆజ్ఞకు అనుసంధానమైన భవిష్య హామీగా చూపుతుంది; హీబ్రూలోని ‘మరియు’ను తెలుగులో అర్ధవిరామ అనుసంధానం సహజంగా మోస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరంగా పరిచితమైన రూపంలో లిప్యంతరీకరిస్తుంది.
- source_word: בְּ/יַד הַ/מֶּלֶךְ
  choice: రాజు చేతికి
  rationale: అధీనంలోకి అప్పగించడం అనే హీబ్రూ నుడికారాన్ని తెలుగులో స్పష్టంగా ఉండే సమీప రూపంతో నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: ఇది ‘ప్రభువు’ అనే బిరుదు కాదు, వ్యక్తిగత దైవనామం. తెలుగు సాధారణ బైబిలు వాడుకలో విస్తృతంగా గుర్తించదగిన ‘యెహోవా’ రూపాన్ని ఎంచుకొని పేరును పేరుగానే నిలిపాం.
- issue: ప్రవక్తల మాటకు దైవసత్య ధృవీకరణ ఉందా?
  choice: వారు ‘ప్రవచిస్తూ’ ఉన్నారని మాత్రమే తెలిపి, వారి సందేశం నిజమని అనువాదం ద్వారా ధృవీకరించలేదు
  alternative: దేవుని నిజమైన సందేశంగా స్పష్టీకరించడం
  rationale: మూలపాఠం వారి చర్యను נבא పదంతో వర్ణిస్తుంది; పరిసర కథనంలోని ఉద్రిక్తతను ముందుగానే పరిష్కరించకుండా అదే వర్ణనను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. రాజును నేరుగా సంబోధిస్తున్న సందర్భానికి తగిన గౌరవ బహువచనం వాడబడింది.
