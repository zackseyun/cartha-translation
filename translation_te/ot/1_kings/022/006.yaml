source:
  edition: WLC
  text: וַ/יִּקְבֹּ֨ץ מֶֽלֶךְ יִשְׂרָאֵ֥ל אֶֽת הַ/נְּבִיאִים֮ כְּ/אַרְבַּ֣ע מֵא֣וֹת אִישׁ֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם הַ/אֵלֵ֞ךְ עַל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם אֶחְדָּ֑ל וַ/יֹּאמְר֣וּ עֲלֵ֔ה וְ/יִתֵּ֥ן אֲדֹנָ֖/י בְּ/יַ֥ד הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/006.yaml
  text: Then the king of Israel gathered the prophets[a], about four hundred men, and said to them, “Should I go against Ramoth-gilead for battle, or should I refrain?” And they said, “Go up, and the Lord will give it into the hand of the king.”
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు రాజు దాదాపు నాలుగు వందల మంది ప్రవక్తలను సమకూర్చి, “నేను రామోతు-గిలాదు మీదికి యుద్ధానికి వెళ్లాలా, లేక మానుకోవాలా?” అని వారిని అడిగాడు. వారు, “వెళ్లండి; ప్రభువు[a] దానిని రాజు చేతికి అప్పగిస్తాడు” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ప్రభువు దానిని రాజు చేతికి అప్పగిస్తాడు.” హెబ్రీయ אֲדֹנָי కొన్ని సందర్భాల్లో “నా ప్రభువు” అని కూడా అర్థమవుతుంది; అయితే ఇక్కడ దైవ బిరుదైన “ప్రభువు” అనే అర్థమే ఎక్కువ సంభావ్యమైనది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: సమకూర్చి
  rationale: కבץ అనే క్రియ వ్యక్తులను ఒకచోట చేర్చడాన్ని సూచిస్తుంది. ‘సమకూర్చి’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి రాజు ప్రవక్తలను సమావేశపరచిన భావాన్ని అందిస్తుంది.
- source_word: הַנְּבִיאִים
  choice: ప్రవక్తలను
  rationale: נביאיםకు సాధారణమైన, సందర్భోచితమైన తెలుగు సమానార్థకం ‘ప్రవక్తలు’.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: దాదాపు నాలుగు వందల మంది
  rationale: ఉపసర్గ כ ఇక్కడ సంఖ్య సుమారుగా ఉందని సూచిస్తుంది; ‘దాదాపు’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַאֵלֵךְ
  choice: నేను ... వెళ్లాలా
  rationale: ప్రశ్నార్థక הతో ఉన్న ప్రథమ పురుష అసంపూర్ణ క్రియ ఆలోచించి నిర్ణయించుకునే ప్రశ్నను వ్యక్తం చేస్తుంది; ‘వెళ్లాలా’ తెలుగులో సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: עַל רָמֹת גִּלְעָד לַמִּלְחָמָה
  choice: రామోతు-గిలాదు మీదికి యుద్ధానికి
  rationale: עַל లక్ష్యానికి వ్యతిరేకంగా సైనికంగా వెళ్లడాన్ని, לַמִּלְחָמָה యుద్ధ ఉద్దేశాన్ని సూచిస్తాయి. ‘మీదికి యుద్ధానికి’ మూలంలోని దిశ, సైనిక భావం రెండింటినీ కాపాడుతుంది.
- source_word: אִם אֶחְדָּל
  choice: లేక మానుకోవాలా
  rationale: חדל ఆపడం లేదా చర్యకు పూనుకోకుండా ఉండడాన్ని సూచిస్తుంది. ఈ నిర్ణయాత్మక ప్రశ్నలో ‘మానుకోవాలా’ సహజమైన తెలుగు.
- source_word: עֲלֵה
  choice: వెళ్లండి
  rationale: עלה ఇక్కడ యుద్ధానికి ‘పైకి వెళ్లడం’ అనే సైనిక ప్రయోగం. తెలుగులో అక్షరార్థమైన ‘పైకి వెళ్లండి’ అసహజంగా లేదా కేవలం దిశాసూచకంగా వినిపించవచ్చు; ‘వెళ్లండి’ సందర్భంలోని ఆజ్ఞను సహజంగా తెలియజేస్తుంది.
- source_word: אֲדֹנָי
  choice: ప్రభువు
  rationale: మసొరెటిక్ పఠనం ఇక్కడ సాధారణంగా దైవ బిరుదైన ‘ప్రభువు’ను సూచిస్తుంది; ఇది יהוה అనే దైవనామం కాదు. ‘నా ప్రభువు’ అనే సాధ్యమైన ప్రత్యామ్నాయ పఠనాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: రాజు చేతికి
  rationale: ‘చేతిలో/చేతికి ఇవ్వడం’ అనేది మరొకరి అధికారానికి లేదా స్వాధీనానికి అప్పగించడాన్ని సూచించే హెబ్రీయ రూపకం. ‘రాజు చేతికి అప్పగిస్తాడు’ తెలుగులో అర్థవంతంగా ఆ రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ప్రవక్తల జవాబులో אֲדֹנָי పదం
  choice: ప్రభువు
  alternative: నా ప్రభువు
  rationale: ఈ సందర్భంలోని మసొరెటిక్ రూపం దైవ బిరుదుగా చదవబడే అవకాశమే ఎక్కువ; అందువల్ల ప్రధాన పాఠంలో ‘ప్రభువు’ అని ఇచ్చాం. అయితే ‘నా ప్రభువు’ అనే పఠన సాధ్యతను పూర్తిగా తొలగించకుండా పాదసూచికలో భద్రపరిచాం. ఇది יהוה అనే దైవనామంతో కలపబడలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడాం. ‘రామోతు-గిలాదు’ అనే స్థలనామాన్ని మూలరూపానికి దగ్గరగా లిప్యంతరీకరించాం. హెబ్రీయ సైనిక ప్రయోగాన్ని తెలుగులో అసహజమైన అక్షరానువాదంగా కాకుండా సందర్భానికి తగిన రీతిలో అందించాం.
