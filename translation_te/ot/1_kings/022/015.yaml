  source_fidelity: The draft accurately conveys the sequential arrival, the king’s deliberative first-person-plural question, the alternative of refraining, Micaiah’s imperative reply, the divine name, and the assured future result. The reply’s potentially ironic force is appropriately left unmarked in the main text and noted in a footnote. A minor name-form correction better reflects the final consonant of רָמֹת.
