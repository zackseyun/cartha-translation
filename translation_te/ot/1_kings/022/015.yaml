  text: וַ/יָּבוֹא֮ אֶל הַ/מֶּלֶךְ֒ וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֵלָ֗י/ו מִיכָ֨יְהוּ֙ הֲ/נֵלֵ֞ךְ אֶל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם נֶחְדָּ֑ל וַ/יֹּ֤אמֶר אֵלָי/ו֙ עֲלֵ֣ה וְ/הַצְלַ֔ח וְ/נָתַ֥ן יְהוָ֖ה בְּ/יַ֥ד הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/015.yaml
  text: So he came to the king[a], and the king said to him, “Micaiah, should we go to Ramoth-gilead for battle, or should we refrain?” And he said to him, “Go up and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: te
  text: అతడు రాజు వద్దకు వచ్చాడు. రాజు అతనితో, “మీకాయా, మనం యుద్ధానికి రామోత్-గిలాదుకు వెళ్లాలా, లేక వెళ్లకుండా ఉండాలా?” అన్నాడు. అతడు రాజుతో, “వెళ్లండి, విజయం సాధించండి; యహ్వే దానిని రాజు చేతికి అప్పగిస్తాడు” అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సందర్భాన్ని బట్టి మీకాయా ఈ జవాబును వ్యంగ్యంగా చెప్పి ఉండవచ్చు; అయితే హీబ్రూ పాఠం ఆ వ్యంగ్యాన్ని స్పష్టంగా గుర్తించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבוֹא
  choice: అతడు ... వచ్చాడు
  rationale: వావ్-వరుస కథనంలోని తదుపరి సంఘటనను సహజమైన తెలుగు కథన శైలిలో తెలిపింది; కర్తను మూలంలోని సర్వనామ రూపంలోనే ఉంచింది.
- source_word: הֲנֵלֵךְ
  choice: మనం ... వెళ్లాలా
  rationale: మొదటి పురుష బహువచన ప్రశ్న సలహా కోరే భావాన్ని వ్యక్తం చేస్తుంది; ‘వెళ్లాలా’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: רָמֹת גִּלְעָד
  choice: రామోతు-గిలాదు
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: לַמִּלְחָמָה
  choice: యుద్ధానికి
  rationale: లామెద్‌తో కూడిన నామవాచకం ప్రయోజనాన్ని సూచిస్తుంది; సంక్షిప్తమైన సహజ తెలుగు రూపం.
- source_word: אִם נֶחְדָּל
  choice: లేక వెళ్లకుండా ఉండాలా
  rationale: దండయాత్రకు వెళ్లకపోవడం అనే ప్రత్యామ్నాయాన్ని సందర్భానుసారంగా స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: עֲלֵה
  choice: వెళ్లండి
  rationale: עלה యొక్క ‘పైకి వెళ్లు’ అనే ప్రాథమిక భావం ఇక్కడ సైనిక ప్రయాణాన్ని సూచిస్తుంది; తెలుగులో కృత్రిమంగా అనిపించే ‘పైకి వెళ్లండి’ కంటే సందర్భానికి సహజమైన రూపం ఎంచుకుంది.
- source_word: וְהַצְלַח
  choice: విజయం సాధించండి
  rationale: హిఫీల్ రూపం కార్యంలో సఫలమవ్వడాన్ని సూచిస్తుంది; సంభావ్య వ్యంగ్యాన్ని ప్రధాన పాఠ్యంలో అదనంగా గుర్తించకుండా అర్థాన్ని నేరుగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: וְנָתַן יְהוָה
  choice: యహ్వే ... అప్పగిస్తాడు
  rationale: ఆజ్ఞారూపాల తరువాత వచ్చిన పరిపూర్ణ క్రియ నిశ్చయమైన భవిష్యత్ ఫలితాన్ని సూచించగలదు; తెలుగులో భవిష్యత్ రూపం ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: రాజు చేతికి
  rationale: ‘చేతిలో/చేతికి ఇవ్వడం’ అనే హీబ్రూ అధికార-అప్పగింత నుడికారాన్ని తెలుగులో గుర్తించదగిన రూపంలో నిలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది; దానిని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించడం మూలభేదాన్ని కాపాడుతుంది.
- issue: మీకాయా సమాధానంలోని స్వరం
  choice: ప్రధాన పాఠ్యంలో మాటలను నేరుగా అనువదించి, సంభావ్య వ్యంగ్యాన్ని పాదసూచికలో తెలియజేయడం
  alternative: ఆశ్చర్యార్థకం లేదా అదనపు పదాలతో వ్యంగ్యాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా చూపడం
  rationale: విస్తృత సందర్భం వ్యంగ్యాన్ని బలంగా సూచించినా, హీబ్రూ పదాలు స్వయంగా దాన్ని స్పష్టంగా గుర్తించవు. అందువల్ల కథనంలోని ఉద్దేశపూర్వక ఉద్వేగం, అస్పష్టత నిలుస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడింది. రాజసభ సందర్భంలోని ‘రాజు’ అనే పునరుక్తిని మూలానికి అనుగుణంగా నిలిపింది; సంభావ్య వ్యంగ్యాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చలేదు.
