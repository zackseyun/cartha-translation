source:
  edition: WLC
  text: יְהוֹשָׁפָ֗ט בֶּן שְׁלֹשִׁ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ בְּ/מָלְכ֔/וֹ וְ/עֶשְׂרִ֤ים וְ/חָמֵשׁ֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ עֲזוּבָ֖ה בַּת שִׁלְחִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/042.yaml
  text: Jehoshaphat was thirty-five years old when he began to reign, and he reigned twenty-five years in Jerusalem. And his mother’s name was Azubah daughter of Shilhi.
translation:
  language: te
  text: యెహోషాపాతు రాజైనప్పుడు అతనికి ముప్పై ఐదు సంవత్సరాలు. అతడు యెరూషలేములో ఇరవై ఐదు సంవత్సరాలు పరిపాలించాడు. అతని తల్లి పేరు అజూబా; ఆమె షిల్హీ కుమార్తె.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוֹשָׁפָט
  choice: యెహోషాపాతు
  rationale: వ్యక్తి పేరును అనువదించకుండా, తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు నామరూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: בֶּן שְׁלֹשִׁים וְחָמֵשׁ שָׁנָה בְּמָלְכוֹ
  choice: రాజైనప్పుడు అతనికి ముప్పై ఐదు సంవత్సరాలు
  rationale: ‘ముప్పై ఐదు సంవత్సరాల కుమారుడు’ అనే హీబ్రూ వయస్సు నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, בְּמָלְכוֹ సూచించే సింహాసనారోహణ సమయాన్ని నిలిపాం.
- source_word: וְעֶשְׂרִים וְחָמֵשׁ שָׁנָה מָלַךְ
  choice: ఇరవై ఐదు సంవత్సరాలు పరిపాలించాడు
  rationale: מלך అనే క్రియను రాజ్యపాలన వ్యవధి సందర్భంలో సహజంగా ‘పరిపాలించాడు’ అని అనువదించాం.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: స్థానార్థక בְּ ఉపసర్గను ‘లో’తో తెలిపి, స్థలనామాన్ని ప్రాచుర్యంలో ఉన్న తెలుగు రూపంలో ఇచ్చాం.
- source_word: וְשֵׁם אִמּוֹ
  choice: అతని తల్లి పేరు
  rationale: రాజవంశ సమాచార సూత్రాన్ని అర్థానికి నిబద్ధంగా, సహజమైన తెలుగు పదక్రమంలో అందించాం.
- source_word: עֲזוּבָה
  choice: అజూబా
  rationale: వ్యక్తి పేరును దాని హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: בַּת שִׁלְחִי
  choice: ఆమె షిల్హీ కుమార్తె
  rationale: వంశసంబంధాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలిపి, షిల్హీ అనే వ్యక్తి పేరును లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన చారిత్రక వచనశైలి. హీబ్రూ రాజ్యపాలనా సూత్రంలోని సమాచార క్రమాన్ని ప్రధానంగా నిలిపి, తెలుగులో సహజత కోసం చివరి భాగాన్ని రెండు స్వతంత్ర వాక్యఖండాలుగా అందించాం.
