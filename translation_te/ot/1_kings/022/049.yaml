source:
  edition: WLC
  text: יְהוֹשָׁפָ֡ט עשר אֳנִיּ֨וֹת תַּרְשִׁ֜ישׁ לָ/לֶ֧כֶת אוֹפִ֛ירָ/ה לַ/זָּהָ֖ב וְ/לֹ֣א הָלָ֑ךְ כִּֽי נשברה אֳנִיּ֖וֹת בְּ/עֶצְי֥וֹן גָּֽבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/049.yaml
  text: Jehoshaphat made ships of Tarshish to go to Ophir for gold[a], but they did not go[b], because the ships were wrecked at Ezion-geber.
translation:
  language: te
  text: యెహోషాపాతు బంగారం కోసం ఓఫీరుకు వెళ్లడానికి తర్షీషు ఓడలను[a] తయారు చేశాడు. అయితే అవి వెళ్లలేదు, ఎందుకంటే ఎజ్యోను-గెబెరులో ఆ ఓడలు బద్దలయ్యాయి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తర్షీషు ఓడలు”; ఇది తప్పనిసరిగా తర్షీషు నుండి వచ్చిన ఓడలను సూచించకపోవచ్చు; పెద్ద సముద్రయాన ఓడల ఒక వర్గాన్ని సూచించి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “బద్దలైంది” అని ఏకవచనంలో ఉంది; ఇక్కడ అది ఓడలను లేదా నౌకాదళాన్ని సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עשר
  choice: చేయించాడు
  rationale: వ్యంజన పాఠాన్ని సందర్భంలో ‘చేయు/సిద్ధం చేయు’ అనే క్రియగా గ్రహించడం వాక్యనిర్మాణానికీ సమాంతర వృత్తాంతానికీ సరిపోతుంది. రాజు స్వయంగా నిర్మించాడనే భావం రాకుండా తెలుగులో సహజమైన ప్రేరణార్థక రూపం వాడబడింది.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: తర్షీషు ఓడలను
  rationale: హీబ్రూ సంబంధ పదబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది; ఇది తర్షీషుతో సంబంధమున్న ఓడలనో, పెద్ద సముద్రయాన ఓడల వర్గాన్నో సూచించవచ్చు కాబట్టి ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: לָלֶכֶת אוֹפִירָה
  choice: ఓఫీరుకు వెళ్లడానికి
  rationale: క్రియార్థక రూపం మరియు దిశాసూచక ప్రత్యయం తెలిపే ఉద్దేశం, గమ్యం రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לַזָּהָב
  choice: బంగారం కోసం
  rationale: ל ఇక్కడ ప్రయాణ లక్ష్యాన్ని సూచిస్తుంది; ఈ తెలుగు ప్రయోగం బంగారం సంపాదించడానికి చేసిన ప్రయాణమని స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: וְלֹא הָלָךְ
  choice: అయితే అవి వెళ్లలేదు
  rationale: క్రియ ఏకవచనంలో ఉన్నా సందర్భంలో ఓడల సమూహం లేదా నౌకాదళాన్ని సమష్టిగా సూచిస్తుంది. ‘అవి’ అనడం యెహోషాపాతు వెళ్లలేదనే అపార్థాన్ని నివారిస్తుంది.
- source_word: נשברה
  choice: ఓడబద్దలయ్యాయి
  rationale: שבר నిఫాల్ రూపంలోని ‘విరిగిపోవడం’ అనే భావాన్ని సముద్రయాన సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది; హీబ్రూలోని ఏకవచన రూపాన్ని పాదసూచిక తెలియజేస్తుంది.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: ఎసోన్గెబెరులో
  rationale: ב స్థలాన్ని సూచిస్తుంది; స్థలనామాన్ని ఆధునిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
