  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలి. మూలంలోని సమష్టి ఏకవచన అసంగతిని ప్రధాన పాఠంలో సహజ తెలుగు బహువచనంతో ఇచ్చి, పాదసూచికలో సంరక్షించాం.
