  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ ל֛/וֹ צִדְקִיָּ֥ה בֶֽן כְּנַעֲנָ֖ה קַרְנֵ֣י בַרְזֶ֑ל וַ/יֹּ֨אמֶר֙ כֹּֽה אָמַ֣ר יְהוָ֔ה בְּ/אֵ֛לֶּה תְּנַגַּ֥ח אֶת אֲרָ֖ם עַד כַּלֹּתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/011.yaml
  text: 'Then Zedekiah son of Chenaanah made for himself horns of iron and said, “Thus says the LORD: With these you will gore Aram until you have finished them off.”'
translation:
  language: te
  text: 'అప్పుడు కనానా కుమారుడైన సిద్కియా తనకోసం ఇనుప కొమ్ములు చేసుకున్నాడు. అతడు, “యెహోవా ఇలా అంటున్నాడు: వీటితో నీవు అరామును కుమ్ముతూ, వారిని పూర్తిగా అంతమొందించేవరకు పోతావు” అని అన్నాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַרְנֵי בַרְזֶל
  choice: ఇనుప కొమ్ములు
  rationale: మూలంలోని స్పష్టమైన ప్రతీకాత్మక వస్తువును యథాతథంగా, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: תְּנַגַּח
  choice: కుమ్ముతావు
  rationale: కొమ్ములతో పొడిచి దాడిచేయడం అనే క్రియ యొక్క బలమైన దృశ్యార్థాన్ని నిలుపుతుంది.
- source_word: אֲרָם
  choice: అరాము
  rationale: ఇది ప్రజలనూ రాజ్యాన్నీ సూచించగల భౌగోళిక-రాజకీయ నామం; మూలంలోని ఏకవచన రూపాన్ని నిలుపుతుంది.
- source_word: עַד כַּלֹּתָם
  choice: వారిని పూర్తిగా నాశనం చేసేవరకు
  rationale: ప్రత్యయము బహువచన పురుషులను సూచిస్తున్నందున అరాము సైన్యం లేదా ప్రజలను ఉద్దేశించిన భావాన్ని తెలుపుతుంది; క్రియలోని సంపూర్ణ అంతం భావాన్ని ‘పూర్తిగా నాశనం’గా అందిస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה యొక్క అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: హెబ్రీ వ్యక్తినామాన్ని తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో ఉంచి, సాధారణ బిరుదుతో కలిసిపోకుండా చేసింది.
- issue: ప్రవక్తృత్వ సూత్రవాక్యం כֹּה אָמַר יְהוָה
  choice: యెహోవా ఇలా అంటున్నాడు
  alternative: యెహోవా ఇలా సెలవిస్తున్నాడు
  rationale: దైవప్రకటన సూత్రాన్ని గౌరవభరితంగా, అయినా ఆధునిక సాధారణ పాఠకులకు సహజంగా అందిస్తుంది; సందర్భం ఆ వాదన నిజమా కాదా అన్నది తరువాత నిర్ణయించనిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన కాని సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ప్రత్యక్ష వాక్యంలోని ప్రతీకాత్మక బలాన్ని కాపాడింది.
