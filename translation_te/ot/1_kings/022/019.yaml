source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לָ/כֵ֖ן שְׁמַ֣ע דְּבַר יְהוָ֑ה רָאִ֤יתִי אֶת יְהוָה֙ יֹשֵׁ֣ב עַל כִּסְא֔/וֹ וְ/כָל צְבָ֤א הַ/שָּׁמַ֨יִם֙ עֹמֵ֣ד עָלָ֔י/ו מִ/ימִינ֖/וֹ וּ/מִ/שְּׂמֹאלֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/019.yaml
  text: 'Then he said[a], “Therefore hear the word of Yahweh: I saw Yahweh sitting on his throne, and all the host of heaven standing by him[b], on his right and on his left.”'
translation:
  language: te
  text: 'అప్పుడు అతడు ఇలా అన్నాడు: “కాబట్టి యాహ్వే మాట విను: యాహ్వే తన సింహాసనంపై కూర్చొని ఉండగా, ఆకాశ సైన్యమంతా[a] ఆయన కుడివైపునా ఎడమవైపునా ఆయన పక్కన[b] నిలబడి ఉండగా నేను చూశాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పరలోక సమూహమంతా,” లేదా “ఆకాశపు సైన్యమంతా.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదప్రయోగాన్ని అక్షరార్థంగా అనువదిస్తే, “ఆయనపై నిలబడి.” అయితే “ఆయన కుడివైపునా ఎడమవైపునా” అనే సందర్భాన్ని బట్టి, ఆయన పక్కన పరిచర్యకు సిద్ధంగా నిలబడటం అని భావం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: కాబట్టి
  rationale: ముందటి సంభాషణ నుంచి వచ్చే తార్కిక పరిణామాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שְׁמַע
  choice: విను
  rationale: ఏకవచన ఆజ్ఞారూపాన్ని నేరుగా, గంభీరంగా నిలుపుతుంది.
- source_word: דְּבַר יְהוָה
  choice: యాహ్వే మాట
  rationale: ప్రవచన సందేశాన్ని సూచించే మూలభాషా ప్రయోగాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరిస్తుంది.
- source_word: רָאִיתִי
  choice: నేను చూశాను
  rationale: మీకాయా దర్శన నివేదికను సహజమైన భూతకాలంలో వ్యక్తం చేస్తుంది.
- source_word: יֹשֵׁב עַל כִּסְאוֹ
  choice: తన సింహాసనం మీద కూర్చుని ఉండడం
  rationale: కొనసాగుతున్న రాజాసన భంగిమను తెలిపే హీబ్రూ కృదంత భావాన్ని నిలుపుతుంది.
- source_word: כָל צְבָא הַשָּׁמַיִם
  choice: ఆకాశ సైన్యమంతా
  rationale: సైన్యం లేదా సమూహం అనే విస్తృత సామూహిక చిత్రాన్ని నిలిపి, దానిని కేవలం దేవదూతలుగా పరిమితం చేయదు.
- source_word: עֹמֵד
  choice: నిలబడి ఉండడం
  rationale: దర్శన దృశ్యంలోని కొనసాగుతున్న భంగిమను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: עָלָיו
  choice: ఆయన పక్కన
  rationale: సింహాసన సభ సందర్భంలో పరిచర్యకు సిద్ధంగా సమీపంలో నిలబడటాన్ని సూచిస్తుంది; అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచింది.
- source_word: מִימִינוֹ וּמִשְּׂמֹאלוֹ
  choice: ఆయన కుడివైపునా ఎడమవైపునా
  rationale: మూలంలోని స్థల సమాంతరతను సహజమైన తెలుగులో కాపాడుతుంది.
theological_decisions:
- issue: పరలోక సింహాసన దర్శనంలో יְהוָה దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- issue: כָל צְבָא הַשָּׁמַיִם అనే పరలోక సమూహం యొక్క స్వరూపం
  choice: ఆకాశ సైన్యమంతా
  alternative: పరలోక దేవదూతలందరూ
  rationale: ఈ సమూహాన్ని దేవదూతలకే పరిమితం చేయకుండా, మూలంలోని సైన్యం/సమూహం చిత్రణను మరియు దైవసభ సంబంధిత అనిర్దిష్టతను నిలుపుతుంది.
- issue: עָלָיו యొక్క స్థల సంబంధం
  choice: ఆయన పక్కన
  alternative: ఆయన మీద
  rationale: కుడివైపునా ఎడమవైపునా అనే తరువాతి వివరణ సింహాసనం పక్కన పరిచారకులుగా నిలబడిన దృశ్యాన్ని సూచిస్తుంది; అయినా హీబ్రూ పదప్రయోగంలోని అక్షరార్థ అవకాశాన్ని పాదసూచికలో సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ దర్శన వర్ణనకు తగిన గంభీరతను నిలిపింది. పొడవైన దృశ్య వాక్యాన్ని తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా క్రియానామ రూపాలతో కూర్చింది. పాదసూచిక గుర్తులు వాటికి సంబంధించిన పదబంధాల వెంటనే ఉంచబడ్డాయి.
