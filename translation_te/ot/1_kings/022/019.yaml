  to: 'అప్పుడు అతడు ఇలా అన్నాడు: “కాబట్టి యాహ్వే మాట విను: యాహ్వే తన సింహాసనంపై కూర్చొని ఉండగా, ఆకాశ సైన్యమంతా[a] ఆయన కుడివైపునా ఎడమవైపునా ఆయన పక్కన[b] నిలబడి ఉండగా నేను చూశాను.”'
  rationale: The revision improves modern Telugu flow without changing the source meaning. It retains the vision’s simultaneous, ongoing postures, the broad and theologically non-specific “host of heaven,” and the contextual rendering of עָלָיו, while preserving the literal alternative in the footnote.
