- from: 'ఇశ్రాయేలు రాజు యెహోషాపాతుతో ఇలా అన్నాడు: “అతని ద్వారా యాహ్వేను విచారించడానికి ఇంకా ఒక వ్యక్తి ఉన్నాడు[a]. అయితే అతడంటే నాకు ద్వేషం. ఎందుకంటే అతడు నా గురించి మేలు ప్రవచించడు; కీడు మాత్రమే ప్రవచిస్తాడు. అతడు ఇమ్లా కుమారుడైన మీకాయా.” అందుకు యెహోషాపాతు, “రాజు అలా అనకూడదు” అన్నాడు.


    [a] లేదా, “అతని దగ్గర యాహ్వే చిత్తాన్ని అడిగి తెలుసుకోవడానికి.”'
  to: 'ఇశ్రాయేలు రాజు యెహోషాపాతుతో ఇలా అన్నాడు: “యాహ్వేను అతని ద్వారా అడిగి తెలుసుకోవడానికి ఇంకా ఒక వ్యక్తి ఉన్నాడు[a]. కానీ నేను అతణ్ణి ద్వేషిస్తాను, ఎందుకంటే అతడు నా గురించి మేలు కాదు, కీడు మాత్రమే ప్రవచిస్తాడు: ఇమ్లా కుమారుడైన మీకాయా.” అప్పుడు యెహోషాపాతు, “రాజు అలా అనకూడదు” అన్నాడు.


    [a] లేదా, “అతని దగ్గర యాహ్వేను అడిగి తెలుసుకోవడానికి.”'
  rationale: మూలార్థాన్ని మార్చకుండా, దైవవాక్యాన్ని అడిగి తెలుసుకునే సందర్భానికి తగిన తెలుగు క్రియను ఎంచుకున్నాం. పాదటిప్పణి మూలంలోని మాధ్యమ/వ్యక్తివద్ద విచారణ అనే అనువాద అవకాశాన్ని నిలుపుతుంది. ‘కీడు’ అనే తటస్థ పదం రָע యొక్క ఉద్దేశపూర్వక విస్తృతిని కాపాడుతుంది.
