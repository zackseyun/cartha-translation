source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֶֽלֶךְ יִשְׂרָאֵ֣ל אֶֽל יְהוֹשָׁפָ֡ט ע֣וֹד אִישׁ אֶחָ֡ד לִ/דְרֹשׁ֩ אֶת יְהוָ֨ה מֵ/אֹת֜/וֹ וַ/אֲנִ֣י שְׂנֵאתִ֗י/ו כִּ֠י לֹֽא יִתְנַבֵּ֨א עָלַ֥/י טוֹב֙ כִּ֣י אִם רָ֔ע מִיכָ֖יְהוּ בֶּן יִמְלָ֑ה וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט אַל יֹאמַ֥ר הַ/מֶּ֖לֶךְ כֵּֽן־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/008.yaml
  text: 'And the king of Israel said to Jehoshaphat[a], “There is still one more man through whom to inquire of Yahweh, but I hate him, because he does not prophesy good concerning me, but only evil: Micaiah son of Imlah.” And Jehoshaphat said, “Let not the king say so.”'
translation:
  language: te
  text: 'ఇశ్రాయేలు రాజు యెహోషాపాతుతో ఇలా అన్నాడు: “యాహ్వేను అతని ద్వారా అడిగి తెలుసుకోవడానికి ఇంకా ఒక వ్యక్తి ఉన్నాడు[a]. కానీ నేను అతణ్ణి ద్వేషిస్తాను, ఎందుకంటే అతడు నా గురించి మేలు కాదు, కీడు మాత్రమే ప్రవచిస్తాడు: ఇమ్లా కుమారుడైన మీకాయా.” అప్పుడు యెహోషాపాతు, “రాజు అలా అనకూడదు” అన్నాడు.


    [a] లేదా, “అతని దగ్గర యాహ్వేను అడిగి తెలుసుకోవడానికి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని దగ్గర యాహ్వేను అడిగి తెలుసుకోవడానికి.”
    reason: మూలంలోని מֵאֹתוֹను ప్రవక్త ద్వారా విచారణ చేయడం అనే మాధ్యమ భావంగా లేదా అతని వద్ద విచారణ చేయడం అనే భావంగా అనువదించవచ్చు. మూలంలో లేని ‘చిత్తం’ను చేర్చకుండా ప్రత్యామ్నాయాన్ని ఉంచాం.
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ నామానికి సాధారణంగా అంగీకరించిన ఉచ్చారణను తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: עוֹד אִישׁ אֶחָד
  choice: ఇంకా ఒక వ్యక్తి ఉన్నాడు
  rationale: עוֹד లోని ‘ఇంకా’ అనే అదనపు భావాన్ని, אִישׁ אֶחָד లోని ఒక వ్యక్తి అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לִדְרֹשׁ אֶת־יְהוָה מֵאֹתוֹ
  choice: అతని ద్వారా యాహ్వేను విచారించడానికి
  rationale: ప్రవక్తను మాధ్యమంగా చేసుకొని యాహ్వేను అడిగి తెలుసుకోవడం అనే సందర్భార్థాన్ని, מֵאֹתוֹ సూచించే మాధ్యమ భావంతో సహా వ్యక్తం చేస్తుంది.
- source_word: שְׂנֵאתִיו
  choice: అతడంటే నాకు ద్వేషం
  rationale: రాజుకు ప్రస్తుతం స్థిరంగా ఉన్న తీవ్రమైన విరక్తిని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: לֹא יִתְנַבֵּא עָלַי טוֹב כִּי אִם רָע
  choice: అతడు నా గురించి మేలు ప్రవచించడు; కీడు మాత్రమే ప్రవచిస్తాడు
  rationale: עָלַי ను ‘నా గురించి’గా, כִּי אִם ను ‘మాత్రమే’గా చూపుతూ, רָע లోని విస్తృత ‘కీడు/అనర్థం’ భావాన్ని ఒక నిర్దిష్ట అర్థానికి పరిమితం చేయదు.
- source_word: מִיכָיְהוּ בֶּן־יִמְלָה
  choice: ఇమ్లా కుమారుడైన మీకాయా
  rationale: హీబ్రూ వ్యక్తినామాలను తెలుగు బైబిలు శైలికి అనుగుణంగా లిప్యంతరీకరించి, తండ్రి-కొడుకు సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: אַל יֹאמַר הַמֶּלֶךְ כֵּן
  choice: రాజు అలా అనకూడదు
  rationale: అరమరికతో కూడిన నిషేధాన్ని ఆధునిక తెలుగులో గౌరవపూర్వకంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాక దేవుని ప్రత్యేక నామం ఉంది. ‘యాహ్వే’ హీబ్రూ నామానికి విస్తృతంగా అంగీకరించిన పునర్నిర్మిత ఉచ్చారణను దగ్గరగా ప్రతిబింబిస్తుంది; ‘యెహోవా’ తెలుగులో పరిచితమైన ప్రత్యామ్నాయం అయినా, అది తరువాతి మిశ్రిత ఉచ్చారణ సంప్రదాయాన్ని అనుసరిస్తుంది.
- issue: רָע యొక్క భావపరిధి
  choice: కీడు
  alternative: అనర్థం
  rationale: రాజు ఫిర్యాదులో ఇది నైతిక చెడునా, తనకు సంభవించే విపత్తునా అన్నది పూర్తిగా నిర్ధారించబడలేదు. ‘కీడు’ ఆ ఉద్దేశపూర్వక విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన కథన శైలిని వాడాం. రాజసభ సందర్భానికి తగిన మర్యాదను నిలుపుతూ, సంభాషణను సాధారణ పాఠకులకు స్పష్టంగా ఉంచాం.
