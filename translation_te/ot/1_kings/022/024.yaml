id: 1KI.22.24
reference: 1 Kings 22:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּגַּשׁ֙ צִדְקִיָּ֣הוּ בֶֽן כְּנַעֲנָ֔ה וַ/יַּכֶּ֥ה אֶת מִיכָ֖יְהוּ עַל הַ/לֶּ֑חִי וַ/יֹּ֕אמֶר אֵי זֶ֨ה עָבַ֧ר רֽוּחַ יְהוָ֛ה מֵ/אִתִּ֖/י לְ/דַבֵּ֥ר אוֹתָֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/024.yaml
  text: Then Zedekiah son of Chenaanah came near and struck Micaiah on the cheek and said[a], “Which way did the Spirit of Yahweh pass from me to speak to you?”
translation:
  language: te
  text: అప్పుడు కెనయనా కుమారుడు సిద్కియా దగ్గరికి వచ్చి, మీకాయా చెంప మీద కొట్టి, “నీతో మాట్లాడడానికి యాహ్వే ఆత్మ నా నుంచి ఏ దారిన వెళ్లింది?[a]” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాహ్వే ఆత్మ నా నుంచి ఏ మార్గం గుండా వెళ్లి నీతో మాట్లాడింది?”
    reason: אֵי זֶה మరియు עבר కలయికను ‘ఏ దారిన వెళ్లింది’ లేదా ‘ఏ మార్గం గుండా వెళ్లింది’ అని వ్యక్తం చేయవచ్చు.
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: దగ్గరికి వచ్చి
  rationale: נגשׁ సూచించే భౌతికంగా సమీపించడం, అలాగే సందర్భంలోని ఘర్షణాత్మక స్వరాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: కెనయనా కుమారుడు సిద్కియా
  rationale: హీబ్రూ వ్యక్తినామాలను తెలుగు లిపిలో లిప్యంతరీకరించి, patronymic నిర్మాణాన్ని సహజ తెలుగు క్రమంలో ఉంచుతుంది.
- source_word: וַיַּכֶּה ... עַל הַלֶּחִי
  choice: మీకాయా చెంప మీద కొట్టి
  rationale: נכה అనే విస్తృతార్థక క్రియను విధానాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘కొట్టి’గా, לֶחִיని సాధారణ అర్థమైన ‘చెంప’గా అనువదిస్తుంది.
- source_word: אֵי זֶה
  choice: ఏ దారిన
  rationale: ఈ ప్రశ్నలోని మార్గం లేదా దిశ భావాన్ని, అలాగే సిద్కియా ఎగతాళి ధోరణిని సహజంగా నిలుపుతుంది; ‘ఎక్కడ’ అనే అనువాదం కంటే సందర్భానికి స్పష్టంగా సరిపోతుంది.
- source_word: עָבַר
  choice: వెళ్లింది
  rationale: ఇక్కడ עבר అనేది ఒకరి దగ్గర నుంచి మరొకరి దగ్గరికి వెళ్లడం లేదా దాటిపోవడం అనే భావాన్ని ఇస్తుంది; తెలుగులో ‘వెళ్లింది’ సహజంగా ఆ గమనాన్ని తెలియజేస్తుంది.
- source_word: רוּחַ יְהוָה
  choice: యాహ్వే ఆత్మ
  rationale: ప్రవచన సంబంధమైన ఈ సందర్భంలో ఇది దేవుని ఆత్మను సూచిస్తుంది; יְהוָהను బిరుదుతో భర్తీ చేయకుండా దైవనామంగా ‘యాహ్వే’ అని లిప్యంతరీకరిస్తుంది.
- source_word: מֵאִתִּי
  choice: నా నుంచి
  rationale: మూలంలోని బయలుదేరిన స్థానాన్ని లేదా మూలాన్ని సంక్షిప్తంగా, నేరుగా తెలియజేస్తుంది.
- source_word: לְדַבֵּר אֹתָךְ
  choice: నీతో మాట్లాడడానికి
  rationale: హీబ్రూ నిర్మాణంలోని దిశాత్మక భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, ఆత్మ మీకాయాతో మాట్లాడిందనే అర్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: רוּחַ יְהוָה యొక్క అర్థం మరియు రూపం
  choice: యాహ్వే ఆత్మ
  alternative: యాహ్వే యొక్క ఆత్మ; యాహ్వే ఆత్మశక్తి
  rationale: ప్రవక్తల మధ్య వివాదమైన ఈ సందర్భంలో ఈ పదబంధం గాలి లేదా మానసిక స్వభావాన్ని కాక దేవుని ప్రవచనాత్మక ఆత్మను సూచిస్తుంది. అయితే సిద్కియా మాటలోని వ్యంగ్యాన్ని, అతడు నిజంగా ఆత్మను కలిగి ఉన్నాడా అనే కథన ఉద్రిక్తతను అనువాదం పరిష్కరించదు.
- issue: אֵי זֶה అనే ప్రశ్న యొక్క భావం
  choice: ఏ దారిన
  alternative: ఎటువైపుగా; ఏ మార్గం గుండా
  rationale: సిద్కియా యాహ్వే ఆత్మ తనను విడిచి మీకాయాతో మాట్లాడటానికి ఏ మార్గంలో వెళ్లిందని వ్యంగ్యంగా ప్రశ్నిస్తున్న భావాన్ని ఇది నిలుపుతుంది; ప్రశ్నను కేవలం స్థలానికి సంబంధించినదిగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘చెంప మీద కొట్టి’ అనేది చర్యను స్పష్టంగా చెబుతుంది కానీ అది ప్రత్యేకంగా అరచేతితో కొట్టడమేనని నిర్ణయించదు. సిద్కియా మాటలోని ఎగతాళి ప్రశ్నారూపంలోనే ఉంచబడింది.
