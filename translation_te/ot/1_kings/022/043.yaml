  yaml_path: translation/ot/1_kings/022/043.yaml
  text: He walked in all the ways of Asa his father[a]; he did not turn aside from them[b], doing what was right in the eyes of Yahweh.
translation:
  language: te
  text: అతడు తన తండ్రి ఆసా మార్గమంతటిలో నడిచాడు[a]; దాని నుండి తొలగిపోలేదు; యెహోవా దృష్టిలో సరైనది చేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతడు తన తండ్రి ఆసా నడిచిన మార్గాన్నంతా అనుసరించాడు.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థం ‘యెహోవా కళ్లలో సరైనది’; ఇది ‘యెహోవా దృష్టిలో సరైనది’ అనే భావమిచ్చే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: నడిచాడు
  rationale: הלך అనే క్రియకు ‘నడుచు/వెళ్లు’ అనే ప్రాథమిక అర్థం ఉంది. ఇక్కడ రాజు జీవన ప్రవర్తనను సూచించే ‘మార్గం’ రూపకంతో కలిసివచ్చినందున ‘నడిచాడు’ ఆ రూపకాన్ని నిలుపుతుంది.
- source_word: בְּכָל דֶּרֶךְ
  choice: మార్గమంతటిలో
  rationale: హీబ్రూలో ‘మార్గం’ ఏకవచనంలో ఉంది; మొత్తం జీవన విధానాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో ‘మార్గమంతటిలో’ అని ఇవ్వడం ఏకవచన మార్గరూపకాన్నీ సంపూర్ణ అనుసరణ భావాన్నీ కాపాడుతుంది.
- source_word: אָסָא אָבִיו
  choice: తన తండ్రి ఆసా
  rationale: తెలుగులో సహజమైన సంబంధ క్రమాన్ని అనుసరిస్తూ, ఆసా అతని తండ్రి అనే మూలపాఠ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: לֹא סָר מִמֶּנּוּ
  choice: దాని నుంచి తొలగిపోకుండా
  rationale: סור అంటే ‘తొలగిపోవు/పక్కకు మళ్లిపోవు.’ ‘దాని’ అనే ఏకవచనం ముందున్న ఏకవచన ‘మార్గం’ను సూచిస్తూ మార్గరూపకాన్ని కొనసాగిస్తుంది.
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: సరైనది చేశాడు
  rationale: ‘సరైనదాన్ని చేయడం’ అనే సాధారణ హీబ్రూ నైతిక మూల్యాంకన సూత్రాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టికి
  rationale: అక్షరార్థంగా ‘యెహోవా కళ్లలో’ అయిన ఈ హీబ్రూ నుడికారం, యెహోవా చేసే మూల్యాంకనాన్ని సూచిస్తుంది. ‘దృష్టికి’ తెలుగులో సహజంగా ఉండి మూలంలోని దృశ్యభావాన్ని కొంతవరకు నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: రాజు ప్రవర్తనపై మూల్యాంకనం
  choice: యెహోషాపాతు తన తండ్రి ఆసా జీవన మార్గాన్ని అనుసరించి యెహోవా దృష్టికి సరైనది చేశాడని పాఠం చెబుతున్న మేరకే అనువదించబడింది.
  alternative: దీనిని విశ్వాసపూర్వక రాజత్వంపై విస్తృతమైన ప్రశంసగా వివరణాత్మకంగా చెప్పడం.
  rationale: మూలపాఠం రాజుల ప్రవర్తనను అంచనా వేసే సూత్రబద్ధ భాషను ఉపయోగిస్తుంది. దానిలో లేని అదనపు సిద్ధాంతార్థాలను చేర్చకుండా ఆ నైతిక మూల్యాంకనాన్ని నిలిపాము.
- issue: మార్గం అనే సూచన ఏకవచనమా బహువచనమా
  choice: ‘మార్గం’ మరియు దానిని సూచించే ‘దాని’ అనే ఏకవచన రూపాలు వాడబడ్డాయి.
  alternative: ‘మార్గాలు,’ ‘వాటి నుంచి’ అనే బహువచన రూపాలు.
  rationale: WLC పాఠంలో דֶּרֶךְ ఏకవచనంలో ఉంది; מִמֶּנּוּ లోని ప్రత్యయం కూడా ఏకవచన సూచనకు సరిపోతుంది. అందువల్ల మూలపాఠంలోని సంఖ్యను కాపాడాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘నడిచాడు—మార్గం—తొలగిపోవడం’ అనే పరస్పర సంబంధిత రూపకాన్ని సాధ్యమైనంతవరకు నిలిపాము; వాక్య ప్రవాహం కోసం హీబ్రూ infinitive భావాన్ని ‘తొలగిపోకుండా ... చేశాడు’గా సహజీకరించాము.
