source:
  edition: WLC
  text: וַ/יִּשְׁטֹ֨ף אֶת הָ/רֶ֜כֶב עַ֣ל בְּרֵכַ֣ת שֹׁמְר֗וֹן וַ/יָּלֹ֤קּוּ הַ/כְּלָבִים֙ אֶת דָּמ֔/וֹ וְ/הַ/זֹּנ֖וֹת רָחָ֑צוּ כִּ/דְבַ֥ר יְהוָ֖ה אֲשֶׁ֥ר דִּבֵּֽר־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/038.yaml
  text: And they washed the chariot at the pool of Samaria[a], and the dogs licked up his blood, and the prostitutes washed there, according to the word of Yahweh that he had spoken.
translation:
  language: te
  text: 'షోమ్రోను కొలను దగ్గర రథాన్ని కడిగారు; కుక్కలు అతని రక్తాన్ని నాకాయి; వేశ్యలు అక్కడ కడిగారు[a]. యాహ్వే పలికిన మాట ప్రకారం ఇది జరిగింది.


    [a] లేదా, “వేశ్యలు తమను తాము కడుక్కున్నారు” లేదా “స్నానం చేశారు.” హీబ్రూ క్రియ కర్మను స్పష్టంగా పేర్కొనదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వేశ్యలు తమను తాము కడుక్కున్నారు” లేదా “స్నానం చేశారు.” హీబ్రూ క్రియ కర్మను స్పష్టంగా పేర్కొనదు.
    reason: רָחָצוּ అనే క్రియకు కర్మ పేర్కొనబడలేదు; ఆత్మార్థకంగా లేదా స్నానం చేయడం అనే భావంలో కూడా అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: וַיִּשְׁטֹף אֶת־הָרֶכֶב
  choice: రథాన్ని కడిగారు
  rationale: హెబ్రీ క్రియ వ్యాకరణపరంగా ఏకవచనంలో ఉన్నా, కర్త ఎవరో పేర్కొనలేదు. తెలుగులో కర్తలేని ‘కడిగారు’ అనే ప్రయోగం సహజంగా ఉండి, పేరు చెప్పని వ్యక్తి లేదా వ్యక్తుల చేత జరిగిన పనిని తెలియజేస్తుంది.
- source_word: עַל בְּרֵכַת שֹׁמְרוֹן
  choice: షోమ్రోను కొలను దగ్గర
  rationale: ఇక్కడ עַל స్థలాన్ని సూచిస్తుంది. కడిగే సందర్భంలో ‘కొలను దగ్గర’ అనేది సహజమైన తెలుగు; ‘కొలను మీద’ అనే అక్షరార్థం సందర్భానికి సరిపోదు.
- source_word: וַיָּלֹקּוּ הַכְּלָבִים אֶת־דָּמוֹ
  choice: కుక్కలు అతని రక్తాన్ని నాకాయి
  rationale: క్రియ యొక్క స్పష్టమైన ‘నాకు/నాకివేయు’ భావాన్ని, అహాబు వైపు సూచించే సర్వనామాన్ని నేరుగా నిలుపుతుంది.
- source_word: וְהַזֹּנוֹת
  choice: వేశ్యలు
  rationale: זוֹנָהకు ఆధునిక ప్రామాణిక తెలుగులో నేరమైన, పాతబడని సమానార్థకం.
- source_word: רָחָצוּ
  choice: అక్కడ కడిగారు
  rationale: హెబ్రీలో క్రియకు కర్మ స్పష్టంగా లేదు. ప్రధాన పాఠంలో కర్మను చేర్చకుండా అస్పష్టతను నిలిపి, సాధ్యమైన ఆత్మార్థక/స్నాన భావాన్ని పాదటిప్పణిలో ఇచ్చాం. ‘అక్కడ’ సందర్భంలోని స్థల సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: כִּדְבַר יְהוָה אֲשֶׁר דִּבֵּר
  choice: యాహ్వే తాను పలికిన మాట ప్రకారమే ఇది జరిగింది
  rationale: ప్రవచన నెరవేర్పు సూత్రాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, దైవనామాన్ని ‘యాహ్వే’గా ఉంచుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’ ఉచ్చారణకు సమీపమైన తెలుగు రూపంలో నిలిపాం.
- issue: וְהַזֹּנוֹת רָחָצוּ అనే సంక్షిప్త వాక్యభాగం యొక్క అర్థం
  choice: వేశ్యలు అక్కడ కడిగారు
  alternative: వేశ్యలు తమను తాము కడుక్కున్నారు / స్నానం చేశారు
  rationale: హెబ్రీ పాఠం వేశ్యలను క్రియకు కర్తలుగా స్పష్టంగా పేర్కొంటుంది, కాని కర్మను పేర్కొనదు. అందువల్ల ప్రధాన పాఠం ఆ అస్పష్టతను పరిష్కరించకుండా ఉంచి, సాధ్యమైన వివరణలను పాదటిప్పణిలో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. హెబ్రీలో కర్త లేదా కర్మ వెల్లడించని చోట అనవసరమైన వివరాలు చేర్చలేదు; చివరి వాక్యభాగంలోని నిజమైన అర్థసందిగ్ధతను పాదటిప్పణితో కాపాడాం.
