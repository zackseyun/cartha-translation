id: 1KI.22.18
reference: 1 Kings 22:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֶֽלֶךְ יִשְׂרָאֵ֖ל אֶל יְהוֹשָׁפָ֑ט הֲ/לוֹא֙ אָמַ֣רְתִּי אֵלֶ֔י/ךָ לֽוֹא יִתְנַבֵּ֥א עָלַ֛/י ט֖וֹב כִּ֥י אִם רָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/018.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Did I not tell you that he would not prophesy good concerning me, but only evil?”
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు రాజు యెహోషాపాతుతో, “ఇతడు నా గురించి మేలు ప్రవచించడు, కీడే[a] ప్రవచిస్తాడని నేను నీతో చెప్పలేదా?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “విపత్తే.” హీబ్రూ మూలంలో అక్షరార్థంగా “మేలు ... కీడే” అని ఉంది. ఇక్కడ ఈ స్పష్టమైన వ్యతిరేకత అననుకూలమైన లేదా విపత్తును ప్రకటించే ప్రవచనాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది. ఆధునిక తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు రాజు
  rationale: మూలంలోని బిరుదునే నిలిపి, ఇక్కడ ‘అహాబు’ అనే పేరును అదనంగా చేర్చలేదు.
- source_word: אֶל יְהוֹשָׁפָט
  choice: యెహోషాపాతుతో
  rationale: మాట ఎవరిని ఉద్దేశించి చెప్పబడిందో సహజమైన తెలుగులో తెలియజేస్తుంది; మూలంలో లేని ‘రాజు’ అనే బిరుదును పేరుకు ముందు చేర్చలేదు.
- source_word: הֲלוֹא אָמַרְתִּי אֵלֶיךָ
  choice: నేను నీతో చెప్పలేదా?
  rationale: అంగీకారాన్ని ఆశించే మందలింపు ధోరణిగల అలంకార ప్రశ్నను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לֹא יִתְנַבֵּא
  choice: ప్రవచించడు
  rationale: ఇక్కడ అసంపూర్ణ క్రియారూపం రాజు దృష్టిలో మీకాయా ఎప్పుడూ లేదా ఊహించిన విధంగా చెప్పే సందేశాన్ని సూచిస్తుంది. తెలుగు సాధారణ వర్తమాన రూపం ఆ అలవాటు లేదా నిరీక్షణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עָלַי
  choice: నా గురించి
  rationale: ప్రసంగం లేదా ప్రవచనంతో వాడిన עַל ఇక్కడ ‘గురించి’ అనే భావాన్ని ఇస్తుంది.
- source_word: טוֹב
  choice: మేలు
  rationale: నామవాచకార్థంలో ఉన్న విశేషణాన్ని సంక్షిప్తంగా ఉంచుతూ, రָע తో ఉన్న ప్రత్యక్ష విరుద్ధతను నిలుపుతుంది.
- source_word: כִּי אִם
  choice: కీడే
  rationale: తెలుగు నిశ్చయార్థక ‘ఏ’ ప్రత్యయం నిషేధం తరువాత వచ్చే ‘కాని అది మాత్రమే’ అనే ప్రత్యేక వ్యతిరేక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: רָע
  choice: కీడు
  rationale: ‘మేలు—కీడు’ అనే మూలంలోని విరుద్ధ పదజంటను నిలుపుతుంది. సందర్భంలో ఇది నైతిక దుష్టత్వం కంటే అననుకూలమైన లేదా విపత్తును ప్రకటించే ప్రవచనాన్ని సూచించవచ్చు.
theological_decisions:
- issue: రాజును గూర్చిన ప్రవచనంలో רָע పదానికి అర్థం
  choice: కీడు
  alternative: విపత్తు
  rationale: ‘కీడు’ అనే పదం טוֹב–רָע (‘మేలు—కీడు’) విరుద్ధతను నేరుగా నిలుపుతుంది; అదే సమయంలో అది నైతిక చెడునా, అననుకూల ఫలితమా, విపత్తా అనే భావాన్ని సందర్భమే నిర్ణయించేలా నిజమైన అర్థ విస్తృతిని కాపాడుతుంది. మరింత సందర్భానుకూలమైన ‘విపత్తు’ను పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని ‘మేలు—కీడు’ వ్యతిరేకతను నిలుపుతూ, ‘కీడు’ పదానికి సందర్భంలో ఉండే ‘విపత్తు’ భావాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
