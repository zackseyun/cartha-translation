source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ מֶ֨לֶךְ יִשְׂרָאֵ֜ל אֶל יְהוֹשָׁפָ֗ט הִתְחַפֵּשׂ֙ וָ/בֹ֣א בַ/מִּלְחָמָ֔ה וְ/אַתָּ֖ה לְבַ֣שׁ בְּגָדֶ֑י/ךָ וַ/יִּתְחַפֵּשׂ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יָּב֖וֹא בַּ/מִּלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/030.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Disguise yourself and go into the battle, but you, put on your robes.” So the king of Israel disguised himself and went into the battle.
translation:
  language: te
  text: అప్పుడు ఇశ్రాయేలు రాజు యెహోషాపాతుతో, “నీవు మారువేషం వేసుకొని యుద్ధంలోకి వెళ్లు[a]; అయితే నీవు నీ వస్త్రాలు ధరించు” అన్నాడు. ఆ విధంగా ఇశ్రాయేలు రాజు మారువేషం వేసుకొని యుద్ధంలోకి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ రూపాన్ని “నేను మారువేషం వేసుకొని యుద్ధంలోకి వెళ్తాను” అని కూడా అర్థం చేసుకోవచ్చు. తరువాతి వాక్యంలో ఇశ్రాయేలు రాజే మారువేషం వేసుకున్నాడని ఉండటం వల్ల, ఈ అర్థాన్ని కొందరు సందర్భానుసారంగా తీసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: הִתְחַפֵּשׂ
  choice: నేను మారువేషం వేసుకొని
  rationale: ఈ రూపం స్వతంత్రంగా చూస్తే ఆజ్ఞార్థకంగానూ గ్రహించవచ్చు. అయితే వెంటనే వచ్చే కథనంలో ఇశ్రాయేలు రాజే మారువేషం వేసుకున్నాడని ఉండటంతో, వక్త తన ఉద్దేశాన్ని చెబుతున్న ప్రథమ పురుష భావం సందర్భానికి బాగా సరిపోతుంది.
- source_word: וָבֹא
  choice: యుద్ధంలోకి వెళ్తాను
  rationale: ముందున్న క్రియతో కలిపి రాజు తన కార్యప్రణాళికను తెలియజేస్తుంది. בוא యొక్క ప్రవేశ భావాన్ని సహజమైన తెలుగులో ‘యుద్ధంలోకి వెళ్తాను’గా వ్యక్తం చేశాం.
- source_word: בַמִּלְחָמָה
  choice: యుద్ధంలోకి
  rationale: ప్రవేశాన్ని సూచించే בואతో కలిసి ఇది యుద్ధరంగంలోకి ప్రవేశించడాన్ని తెలియజేస్తుంది.
- source_word: וְאַתָּה
  choice: అయితే నువ్వు
  rationale: రాజు మారువేషానికి, యెహోషాపాతు తన వస్త్రాలు ధరించడానికి మధ్యనున్న స్పష్టమైన వ్యత్యాసాన్ని తెలుగులో సహజంగా చూపుతుంది.
- source_word: לְבַשׁ בְּגָדֶיךָ
  choice: నీ రాజవస్త్రాలు ధరించు
  rationale: పదశః ‘నీ వస్త్రాలు ధరించు.’ రాజసంబంధ యుద్ధ సందర్భంలో మారువేషానికి విరుద్ధంగా గుర్తుపట్టగల రాజవస్త్రాలే ఉద్దేశమని సందర్భం సూచిస్తుంది.
- source_word: וַיִּתְחַפֵּשׂ
  choice: మారువేషం వేసుకొని
  rationale: రాజు తన రూపాన్ని దాచుకున్నాడనే ఆత్మనేపద చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: וַיָּבֹא בַמִּלְחָמָה
  choice: యుద్ధంలోకి వెళ్లాడు
  rationale: ముందు ప్రకటించిన ఉద్దేశాన్ని కథనం నెరవేరిన చర్యగా పునరుక్తి చేస్తుంది; మూలంలోని పునరావృతిని నిలుపుతుంది.
theological_decisions:
- issue: הִתְחַפֵּשׂ అనే రూపంలోని పురుషార్థ సందిగ్ధత
  choice: ‘నేను మారువేషం వేసుకొని … వెళ్తాను’ అనే ప్రథమ పురుష భావం
  alternative: ‘నువ్వు మారువేషం వేసుకొని … వెళ్లు’ అనే ఆజ్ఞార్థకం
  rationale: రూపం ఆజ్ఞార్థకంగా అర్థమయ్యే అవకాశమున్నా, తరువాత ‘ఇశ్రాయేలు రాజు మారువేషం వేసుకున్నాడు’ అనే వాక్యం వక్త తన ప్రణాళికను తెలిపాడనే భావానికి బలమైన సందర్భ ఆధారం ఇస్తుంది. ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచి అసలు సందిగ్ధతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘రాజవస్త్రాలు’ సందర్భార్థాన్ని స్పష్టం చేస్తుంది; మూలంలోని వ్యత్యాసం, క్రియల పునరావృతి, వ్యాకరణ సందిగ్ధత పాదటిప్పణితో కాపాడబడ్డాయి.
