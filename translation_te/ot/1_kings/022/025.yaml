revisions:
- from: 'మీకాయా ఇలా అన్నాడు: “ఇదిగో, నీవు దాక్కోవడానికి లోపలి గదిలోకి వెళ్లే ఆ రోజునే అది చూస్తావు[a].”'
  to: 'మీకాయా ఇలా అన్నాడు: “ఇదిగో, నీవు దాక్కోవడానికి లోపలి గదిలోకి[a] వెళ్లే ఆ రోజున చూస్తావు.”'
  rationale: The revision removes the unsupported object, uses natural Telugu temporal-clause order, avoids added emphasis, and moves the lexical-alternative marker to the expression it explains. It retains the main-text rendering ‘into an inner room’ while preserving the possible ‘from room to room’ sense in the footnote.
