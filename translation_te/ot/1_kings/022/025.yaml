reference: 1 Kings 22:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מִיכָ֔יְהוּ הִנְּ/ךָ֥ רֹאֶ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא אֲשֶׁ֥ר תָּבֹ֛א חֶ֥דֶר בְּ/חֶ֖דֶר לְ/הֵחָבֵֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/025.yaml
  text: And Micaiah said[a], “Behold, you will see on that day when you go into an inner room to hide.”
translation:
  language: te
  text: 'మీకాయా ఇలా అన్నాడు: “ఇదిగో, నీవు దాక్కోవడానికి లోపలి గదిలోకి[a] వెళ్లే ఆ రోజున చూస్తావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గది నుండి గదికి వెళ్లి దాక్కునే రోజున.” హీబ్రూలో “గది” అనే పదం పునరుక్తమై, దాక్కోవడానికి మరింత లోపలికి వెనుదిరగడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: מִיכָיְהוּ
  choice: మీకాయా
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన వ్యక్తినామ లిప్యంతరీకరణ.
- source_word: הִנְּךָ רֹאֶה
  choice: ఇదిగో, నీవు ... చూస్తావు
  rationale: הִנְּךָ యొక్క దృష్టి ఆకర్షించే బలాన్ని, భవిష్యత్ కాలసూచన వల్ల רֹאֶה పొందే అంచనా భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజునే
  rationale: సహజమైన తెలుగు కాలప్రయోగం; సందర్భంలో మీకాయా మాట నిజమని తెలిసే నిర్దిష్ట దినాన్ని సూచిస్తుంది.
- source_word: אֲשֶׁר תָּבֹא
  choice: వెళ్లే
  rationale: దాక్కోవడానికి గదిలోనికి కదలడాన్ని సందర్భానుసారంగా సహజంగా తెలుపుతుంది.
- source_word: חֶדֶר בְּחֶדֶר
  choice: లోపలి గదిలోకి
  rationale: పునరుక్త హీబ్రూ పదబంధం లోలోపలికి వెనుదిరిగి దాక్కునే భావాన్ని ఇక్కడ సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది; ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: לְהֵחָבֵה
  choice: దాక్కోవడానికి
  rationale: ఉద్దేశార్థక క్రియారూపాన్ని సహజంగా, స్వీయ దాచుకొనే భావంతో అనువదిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇదిగో’ అనే పదం మూలంలోని దృష్టి ఆకర్షించే ప్రయోగాన్ని నిలుపుతుంది; సందిగ్ధమైన గది-పదబంధానికి ప్రధాన పాఠ్యంలో సహజార్థం, పాదసూచికలో ప్రత్యామ్నాయం ఇచ్చాం.
