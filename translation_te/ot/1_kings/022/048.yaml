source:
  edition: WLC
  text: וּ/מֶ֥לֶךְ אֵ֛ין בֶּ/אֱד֖וֹם נִצָּ֥ב מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/048.yaml
  text: And there was no king in Edom[a]; a deputy was king.
translation:
  language: te
  text: ఎదోములో రాజు లేడు; నియమిత అధికారి[a] రాజుగా ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రతినిధి’, ‘పాలకుడు’. హెబ్రీ పదం נִצָּב అక్షరార్థంగా నిలబెట్టబడిన లేదా నియమించబడిన వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ
  choice: —
  rationale: ఈ వాక్యభాగాన్ని ముందున్న కథనంతో కలిపే సంధిగా ఉంది. తెలుగు వాక్యప్రవాహంలో ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండా సహజంగా వ్యక్తమవుతుంది.
- source_word: מֶלֶךְ אֵין בֶּאֱדוֹם
  choice: ఎదోములో రాజు లేడు
  rationale: אֵין ఉనికి లేకపోవడాన్ని తెలుపుతుంది; בֶּאֱדוֹם స్థలార్థకంగా ‘ఎదోములో’ అని అనువదించబడింది.
- source_word: נִצָּב
  choice: నియమిత అధికారి
  rationale: נצב ధాతువు నుంచి వచ్చిన ఈ రూపం ‘నిలబెట్టబడినవాడు’ లేదా ‘నియమించబడినవాడు’ అనే భావాన్ని ఇస్తుంది. రాజకీయ సందర్భంలో మరొక అధికారానికి లోబడి నియమించబడిన పరిపాలకుడిని సూచించవచ్చు; ఖచ్చితమైన పదవిపేరును మూలపాఠం నిర్దేశించదు.
- source_word: מֶלֶךְ
  choice: రాజుగా ఉన్నాడు
  rationale: చివరి מֶלֶךְ విధేయపదంగా వచ్చి, ఆ నియమిత అధికారి రాజు స్థానంలో లేదా రాజుగా వ్యవహరించిన స్థితిని సంక్షిప్తంగా తెలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన చారిత్రక గద్యశైలిని వాడాం. ‘నియమిత అధికారి’ అనే పదబంధం మూలంలోని పదవికి సంబంధించిన అనిశ్చితిని నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
