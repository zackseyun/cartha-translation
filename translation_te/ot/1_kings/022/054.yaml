  to: అతడు బయలును సేవించి, అతనికి సాష్టాంగ నమస్కారం చేసి, తన తండ్రి చేసినవన్నిటి ప్రకారమే ఇశ్రాయేలు దేవుడైన యాహ్వేకు కోపం పుట్టించాడు.[a]
