source:
  edition: WLC
  text: וַֽ/יַּעֲבֹד֙ אֶת הַ/בַּ֔עַל וַ/יִּֽשְׁתַּחֲוֶ֖ה ל֑/וֹ וַ/יַּכְעֵ֗ס אֶת יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/054.yaml
  text: He served Baal and bowed down to him[a], and he provoked Yahweh, the God of Israel, just as his father had done.
translation:
  language: te
  text: అతడు బయలును సేవించి, అతనికి సాష్టాంగ నమస్కారం చేసి, తన తండ్రి చేసినవన్నిటి ప్రకారమే ఇశ్రాయేలు దేవుడైన యాహ్వేకు కోపం పుట్టించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనిని ఆరాధించాడు”; హీబ్రూ క్రియ అక్షరార్థంగా వంగి నమస్కరించడాన్ని లేదా నేలపై పడి నమస్కరించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: సేవించి
  rationale: עבד అనే క్రియకు ప్రాథమికంగా ‘సేవించు’ అనే అర్థం ఉంది; విగ్రహారాధన సందర్భంలో అది ఆరాధనాపరమైన సేవను సూచిస్తుంది. తరువాతి క్రియతో పునరుక్తి రాకుండా మూలంలోని భేదాన్ని నిలుపుతుంది.
- source_word: הַבַּעַל
  choice: బయలు
  rationale: ఈ సందర్భంలో ఇది దేవతా నామం/బిరుదుగా వాడబడింది. హీబ్రూలోని నిర్దిష్ట ఉపపదాన్ని తెలుగులో విడిగా చూపడం సహజం కాదు.
- source_word: וַיִּשְׁתַּחֲוֶה לוֹ
  choice: దానికి సాష్టాంగపడ్డాడు
  rationale: שׁחה శరీరాన్ని వంచి లేదా నేలపై పడి నమస్కరించడాన్ని సూచిస్తుంది; ఇక్కడ అది ఆరాధనా చర్య. ‘దానికి’ అనేది బయలు అనే విగ్రహదేవతను సూచిస్తూ సహజ తెలుగు నపుంసక సర్వనామాన్ని ఉపయోగిస్తుంది.
- source_word: וַיַּכְעֵס
  choice: కోపం పుట్టించాడు
  rationale: כעס హిఫీల్ రూపం ‘కోపానికి పురికొల్పు’ అనే కారణార్థాన్ని ఇస్తుంది. ఈ భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా స్థిరపడిన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా ఉంచింది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: నిర్మాణ సంబంధాన్ని సహజ తెలుగులో చూపుతూ, యెహోవాను ఇశ్రాయేలు దేవుడిగా గుర్తిస్తుంది.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה אָבִיו
  choice: తన తండ్రి చేసినదంతా చేసినట్లే
  rationale: మూలంలోని ‘అతని తండ్రి చేసిన సమస్తం ప్రకారం’ అనే తులనాత్మక భావాన్ని సహజంగా, సంపూర్ణత సూచనతో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: ఇది బయలుతో భేదంగా ఇశ్రాయేలు దేవుని వ్యక్తిగత నామాన్ని సూచిస్తుంది. బిరుదైన ‘ప్రభువు’తో మార్చకుండా దైవనామాన్ని నిలుపుతూ, ఆధునిక తెలుగు బైబిలు వాడుకలో ఎక్కువగా పరిచయమైన రూపాన్ని ఎంచుకుంది.
- issue: బయలుకు చేసిన שׁחה చర్య స్వభావం
  choice: దానికి సాష్టాంగపడ్డాడు
  alternative: దానిని ఆరాధించాడు
  rationale: మూల క్రియలోని శారీరకంగా వంగి నమస్కరించే చిత్రాన్ని నిలుపుతూ, సందర్భంలో ఉన్న ఆరాధనా భావాన్ని పాదసూచికలో స్పష్టం చేసింది; ‘సేవించి’ అనే ముందరి క్రియతో భావభేదం కూడా నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘సాష్టాంగపడు’ అనే పదం ఆరాధనా సందర్భంలో సుపరిచితమైనదే అయినా, దాని విస్తృత భావాన్ని పాదసూచిక వివరిస్తుంది.
