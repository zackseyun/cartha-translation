base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/040.yaml
  text: And Ahab slept with his fathers[a], and Ahaziah his son became king in his place.
translation:
  language: te
  text: అహాబు తన పితరులతో కూడ నిద్రించాడు[a]. అతని కుమారుడైన అహజ్యా అతని స్థానంలో రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “తన పితరులతో కూడ నిద్రించాడు.” ఇది అతడు చనిపోయాడని తెలిపే ప్రామాణిక రాజవంశ మరణ సూత్రం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: నిద్రించాడు
  rationale: రాజుల మరణవార్తల్లో కనిపించే שׁכב עם־אבותיו అనే స్థిర హీబ్రూ నుడికారాన్ని ప్రతిబింబిస్తుంది. సందర్భంలో ఇది మరణాన్ని సూచిస్తుంది; ‘చనిపోయాడు’ అని అనువదిస్తే భావం స్పష్టమవుతుంది గాని మూలంలోని రూపకాలంకారమూ సూత్రబద్ధమైన శైలీ కనిపించవు.
- source_word: עִם אֲבֹתָיו
  choice: తన పితరులతో కూడ
  rationale: మూలంలోని రాజవంశ సంబంధమైన మరణ సూత్రాన్ని దగ్గరగా నిలుపుతుంది. ‘తన పూర్వీకులతో’ అనేది సహజమైన ప్రత్యామ్నాయం అయినా, ‘పితరులు’ అనే పదం మూలంలోని אָבוֹת కు మరియు సంప్రదాయ బైబిలు ప్రయోగానికి దగ్గరగా ఉంటుంది.
- source_word: וַיִּמְלֹךְ
  choice: రాజయ్యాడు
  rationale: ఇక్కడ కొనసాగుతున్న పరిపాలనకన్నా సింహాసనారోహణం, అంటే రాజుగా అవడం ఉద్దేశం. అందువల్ల ‘పరిపాలించాడు’ కంటే ‘రాజయ్యాడు’ సరైనది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: అదే రాజపదవిలో వారసుడిగా వచ్చిన భావాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אַחְאָב
  choice: అహాబు
  rationale: హీబ్రూ వ్యక్తిపేరుకు తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: אֲחַזְיָהוּ
  choice: అహజ్యా
  rationale: హీబ్రూ వ్యక్తిపేరుకు తెలుగులో సాధారణంగా వాడే లిప్యంతరీకరణ.
- source_word: בְנוֹ
  choice: అతని కుమారుడైన
  rationale: రాజవంశ వారసత్వ సంబంధాన్ని మూలం వలే స్పష్టంగా ఉంచుతుంది.
