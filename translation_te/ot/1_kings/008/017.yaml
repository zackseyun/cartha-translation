    reason: lexical_alternative
  revision_rationale: The revision restores the Hebrew lexical choice “house” (בַּיִת) in the main text, preserving the temple-as-house image without obscuring the historical referent; “temple” is retained as an alternative. It also uses “ఉద్దేశం” for the inward intention expressed by the Hebrew heart idiom. The divine name and the phrase “the God of Israel” remain faithfully and naturally rendered.
