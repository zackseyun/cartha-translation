revisions:
- from: నా తండ్రి దావీదు హృదయంలో ఇశ్రాయేలు దేవుడైన యెహోవా నామం కోసం ఒక మందిరం[a] కట్టాలనే కోరిక ఉండేది.
  to: నా తండ్రియైన దావీదు హృదయంలో ఇశ్రాయేలు దేవుడైన యెహోవా నామం కొరకు ఒక ఇల్లు కట్టాలనే ఉద్దేశం ఉండేది.
  rationale: The revision restores the Hebrew lexical choice “house” (בַּיִת) in the main text, preserving the temple-as-house image without obscuring the historical referent; “temple” is retained as an alternative. It also uses “ఉద్దేశం” for the inward intention expressed by the Hebrew heart idiom. The divine name and the phrase “the God of Israel” remain faithfully and naturally rendered.
  reviewer_model: gpt-5.6-terra
