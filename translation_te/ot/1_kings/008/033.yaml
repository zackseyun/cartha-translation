source:
  edition: WLC
  text: בְּֽ/הִנָּגֵ֞ף עַמְּ/ךָ֧ יִשְׂרָאֵ֛ל לִ/פְנֵ֥י אוֹיֵ֖ב אֲשֶׁ֣ר יֶחֶטְאוּ לָ֑/ךְ וְ/שָׁ֤בוּ אֵלֶ֨י/ךָ֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וְ/הִֽתְפַּֽלְל֧וּ וְ/הִֽתְחַנְּנ֛וּ אֵלֶ֖י/ךָ בַּ/בַּ֥יִת הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/033.yaml
  text: When your people Israel are struck down before an enemy because they have sinned against you[a], and they turn back to you and confess your name and pray and plead with you in this house,
translation:
  language: te
  text: నీ ప్రజలైన ఇశ్రాయేలీయులు నీకు విరోధంగా పాపం చేసినందువల్ల శత్రువు ఎదుట ఓడిపోయినప్పుడు, వారు నీ వైపు తిరిగి, నీ నామాన్ని ఒప్పుకొని[a], ఈ మందిరంలో నీకు ప్రార్థించి నిన్ను వేడుకుంటే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ నామాన్ని స్తుతించి,” లేదా “నీ నామానికి కృతజ్ఞతలు చెల్లించి.” సందర్భాన్ని బట్టి హెబ్రీ క్రియ ఒప్పుకోవడం, స్తుతించడం లేదా కృతజ్ఞత చెప్పడం అనే అర్థాలను ఇవ్వగలదు.
    reason: ידה హిఫిల్ రూపంలోని నిజమైన పదార్థ వైవిధ్యాన్ని పాఠ్యంలో ఒకే అర్థానికి పరిమితం చేయకుండా సంరక్షించడానికి.
lexical_decisions:
- source_word: בְּהִנָּגֵף
  choice: ఓడిపోయినప్పుడు
  rationale: నָגַף నిఫల్ రూపం సైనిక సందర్భంలో శత్రువు ఎదుట పరాజయం పొందడాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘ఓడిపోయినప్పుడు’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: నీ ప్రజలైన ఇశ్రాయేలీయులు
  rationale: దేవునితో ఉన్న సంబంధాన్ని తెలిపే ‘నీ ప్రజలు’ అనే స్వామ్య భావాన్నీ, ఆ ప్రజలు ఇశ్రాయేలు వారనే గుర్తింపునూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: לִפְנֵי אוֹיֵב
  choice: శత్రువు ఎదుట
  rationale: לִפְנֵי అనే ‘ఎదుట’ భావాన్ని నిలుపుతూ, సైనిక పరాజయ సూత్రానికి తగిన సహజ ప్రయోగాన్ని ఇస్తుంది.
- source_word: אֲשֶׁר יֶחֶטְאוּ לָךְ
  choice: నీకు విరోధంగా పాపం చేసినందువల్ల
  rationale: ఈ ఉపవాక్యం పరాజయానికి కారణాన్ని తెలియజేస్తుంది. לָךְ ఇక్కడ పాపం దేవునికి విరోధంగా చేయబడిందనే సంబంధాన్ని సూచిస్తుంది.
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: వారు నీ వైపు తిరిగి
  rationale: שׁוּב యొక్క తిరగడం/తిరిగి రావడం అనే రూపకాన్ని నిలుపుతుంది; ‘పశ్చాత్తాపపడడం’ అనే విస్తృత సిద్ధాంత పదాన్ని అదనంగా చేర్చదు.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: నీ నామాన్ని ఒప్పుకొని
  rationale: ידה హిఫిల్ రూపానికి ఒప్పుకోవడం, స్తుతించడం, కృతజ్ఞత చెప్పడం అనే భావాలు ఉండవచ్చు. పాపం, పరాజయం, దేవునివైపు తిరగడం అనే సందర్భంలో ‘ఒప్పుకొని’ తగిన ప్రధాన పఠనం; ఇతర సాధ్యార్థాలు పాదసూచికలో ఉంచబడ్డాయి.
- source_word: וְהִתְפַּלְלוּ
  choice: నీకు ప్రార్థించి
  rationale: פלל హిత్పయేల్ రూపానికి ప్రామాణికమైన, సహజ తెలుగు అనువాదం.
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: నిన్ను వేడుకుంటే
  rationale: חנן హిత్పయేల్ రూపంలోని అనుగ్రహం కోరే వినయపూర్వక విన్నప భావాన్ని సహజంగా తెలియజేస్తుంది; మూలంలోని אֵלֶיךָ దిశను ‘నిన్ను’ ద్వారా వ్యక్తం చేస్తుంది.
- source_word: בַּבַּיִת הַזֶּה
  choice: ఈ మందిరంలో
  rationale: బְּ అనే ‘లో’ భావాన్ని కాపాడుతుంది. ఈ సందర్భంలో בַּיִת యెహోవా కోసం నిర్మించిన ఆలయాన్ని సూచిస్తున్నందున ఆధునిక తెలుగులో ‘మందిరం’ స్పష్టంగా, సహజంగా ఉంటుంది.
theological_decisions:
- issue: శూబ్‌లోని తిరిగి రావడం అనే భావాన్ని సిద్ధాంతపరంగా విస్తరించకుండా అనువదించడం
  choice: నీ వైపు తిరిగి
  alternative: పశ్చాత్తాపపడి నీ దగ్గరకు తిరిగి వచ్చి
  rationale: మూల క్రియ దేవునివైపు తిరగడాన్ని చెబుతుంది. సందర్భంలో పశ్చాత్తాప భావం ఉన్నప్పటికీ, దాన్ని ప్రత్యేక పదంగా చేర్చి మూలాన్ని విస్తరించకుండా రూపకాన్ని నిలిపాం.
- issue: וְהוֹדוּ אֶת שְׁמֶךָ యొక్క బహుళార్థకత
  choice: నీ నామాన్ని ఒప్పుకొని
  alternative: నీ నామాన్ని స్తుతించి / నీ నామానికి కృతజ్ఞతలు చెల్లించి
  rationale: పాపం తరువాత దేవునివైపు తిరిగే సందర్భంలో దేవుని నామాన్ని అంగీకరించి ఒప్పుకోవడం ప్రధాన భావంగా సరిపోతుంది. అయితే హెబ్రీ క్రియలో స్తుతి, కృతజ్ఞత భావాలు కూడా నిజంగా సాధ్యమైనందున వాటిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ప్రార్థనలో దేవునిని ఏకవచన సన్నిహిత సంబోధనతో ‘నీ/నిన్ను’ అని పలికాం. వాక్యం తరువాతి వచనంలో కొనసాగుతున్న షరతు నిర్మాణం కావడంతో చివర కామా ఉంచబడింది.
