id: 1KI.8.1
reference: 1 Kings 8:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָ֣ז יַקְהֵ֣ל שְׁלֹמֹ֣ה אֶת זִקְנֵ֣י יִשְׂרָאֵ֡ל אֶת כָּל רָאשֵׁ֣י הַ/מַּטּוֹת֩ נְשִׂיאֵ֨י הָ/אָב֜וֹת לִ/בְנֵ֧י יִשְׂרָאֵ֛ל אֶל הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה יְרוּשָׁלִָ֑ם לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מֵ/עִ֥יר דָּוִ֖ד הִ֥יא צִיּֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/001.yaml
  text: Then Solomon assembled the elders of Israel[a], all the heads of the tribes, the leaders of the fathers’ houses of the sons of Israel, to King Solomon in Jerusalem, to bring up the ark of the covenant of Yahweh from the city of David, that is, Zion.
translation:
  language: te
  text: అప్పుడు సొలొమోను ఇశ్రాయేలు పెద్దలను, గోత్రాల అధిపతులందరినీ, ఇశ్రాయేలు కుమారుల[a] పితృకుటుంబాల నాయకులను యెరూషలేములోని రాజు సొలొమోను దగ్గరకు సమకూర్చాడు; దావీదు పట్టణమైన సీయోను నుండి యాహ్వే నిబంధన మందసాన్ని పైకి తీసుకురావడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో “ఇశ్రాయేలు కుమారులు”; ఇది కుటుంబ-జాతీయ భావంలో ఇశ్రాయేలు సమాజాన్ని సూచించే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: తదుపరి సంఘటనను పరిచయం చేసే కాలసూచక కథన పదంగా సహజంగా ఉంది.
- source_word: יַקְהֵל
  choice: సమకూర్చాడు
  rationale: קהל హిఫీల్ రూపం ప్రజలను సమావేశపరచడం లేదా సమకూర్చడం అనే causative భావాన్ని ఇస్తుంది.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పెద్దలు
  rationale: గుర్తింపు పొందిన వయోవృద్ధ సామాజిక-రాజకీయ నాయకులను సూచించే స్థిరమైన పదబంధం.
- source_word: כָּל רָאשֵׁי הַמַּטּוֹת
  choice: గోత్రాల అధిపతులందరూ
  rationale: מַטּוֹת ఇక్కడ అక్షరార్థమైన కర్రలను కాక గోత్ర విభాగాలను సూచిస్తుంది.
- source_word: נְשִׂיאֵי הָאָבוֹת
  choice: పితృకుటుంబాల నాయకులు
  rationale: పూర్వికుల ఆధారంగా ఏర్పడిన కుటుంబ లేదా వంశ గృహాల గుర్తింపు పొందిన నాయకులను తెలియజేస్తుంది.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారుల
  rationale: మూలంలోని కుటుంబ-జాతీయ పురుష బహువచన రూపాన్ని నిలుపుతుంది; ఇక్కడ అది సమష్టిగా ఇశ్రాయేలు జనాన్ని సూచిస్తుంది.
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: రాజైన సొలొమోను దగ్గరికి
  rationale: సమావేశ సందర్భంలో אֶל రాజు ఉన్న చోటుకు లేదా అతని సన్నిధికి రావడాన్ని సూచిస్తుంది; ‘దగ్గరికి’ దిశను సహజ తెలుగులో నిలుపుతుంది.
- source_word: לְהַעֲלוֹת
  choice: పైకి తీసుకురావడానికి
  rationale: עלה లోని పైకి కదలిక భావాన్ని, మందసాన్ని యెరూషలేముకు తరలించే సందర్భాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: యెహోవా నిబంధన మందసం
  rationale: హీబ్రూ construct సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; ‘మందసం’ పవిత్ర పెట్టెకు స్థిరమైన గౌరవప్రద పదం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో లిప్యంతరీకరిస్తుంది.
- source_word: מֵעִיר דָּוִד
  choice: దావీదు పట్టణం నుండి
  rationale: భౌగోళిక నామాన్ని నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: הִיא צִיּוֹן
  choice: అంటే సీయోను
  rationale: దావీదు పట్టణమే సీయోను అని గుర్తించే వివరణాత్మక appositionను స్పష్టంగా చూపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవ నామమే ఉన్నందున ‘ప్రభువు’ అనే బిరుదుతో మార్చలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ఉచ్చారణ పునర్నిర్మాణంగా ‘యాహ్వే’ కూడా సాధ్యమే.
- issue: לִבְנֵי יִשְׂרָאֵל అనే కుటుంబ-జాతీయ వ్యక్తీకరణ
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలు ప్రజలు
  rationale: మూలంలోని కుటుంబ సంబంధ రూపాన్ని చెరపకుండా ఉంచాం; సందర్భంలో ఇది జాతీయ సమూహాన్ని సూచిస్తుందనే భావం సహజంగానే తెలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు, గౌరవప్రద కథన శైలి. దీర్ఘమైన హీబ్రూ వాక్యాన్ని తెలుగు స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; రెండో వాక్యంలో ‘వారిని సమకూర్చాడు’ అని పునరుక్తి చేసి ఉద్దేశ్య సంబంధాన్ని స్పష్టం చేశాం. మూలంలో లేని వ్యాఖ్యాత్మక వివరాలు చేర్చలేదు.
