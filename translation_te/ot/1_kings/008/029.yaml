base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/029.yaml
  text: that your eyes may be open toward this house night and day[a], toward the place of which you said, ‘My name will be there,’ to hear the prayer that your servant prays toward this place.
translation:
  language: te
  text: నీ కన్నులు రాత్రింబగళ్లు ఈ మందిరంవైపు—‘నా నామం అక్కడ ఉంటుంది’[a] అని నీవు చెప్పిన స్థలంవైపు—తెరిచి ఉండునుగాక; నీ సేవకుడు ఈ స్థలంవైపు చేసే ప్రార్థనను నీవు ఆలకించునుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నా నామం అక్కడ ఉంటుంది’ అనేది ఈ స్థలంతో దేవుడు ఏర్పరచుకున్న ప్రత్యేక అనుబంధాన్ని తెలిపే ఆలయ భాష. ఇది ఆయన నిబంధనాత్మక సన్నిధిని సూచిస్తుంది; అయితే ఈ మాటను కేవలం ‘నా సన్నిధి అక్కడ ఉంటుంది’ అనే ఒక్క భావానికే పరిమితం చేయకూడదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִהְיוֹת עֵינֶךָ פְתֻחוֹת
  choice: నీ కన్నులు ... తెరిచి ఉండి
  rationale: దేవుని శ్రద్ధగల దృష్టిని తెలిపే మానవరూపకాన్ని ‘కన్నులు తెరిచి ఉండడం’ అనే మూలచిత్రంతోనే నిలిపి, తెలుగు వాక్యప్రవాహానికి అనుగుణంగా అనుసంధానించాం.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: ఈ మందిరంవైపు
  rationale: אֶל సూచించే దిశను ‘వైపు’తో తెలిపాం. సందర్భంలోని בַּיִת దేవాలయాన్ని సూచిస్తున్నందున ఆధునిక తెలుగు పాఠకులకు సహజమైన ‘మందిరం’ను ఎంచుకున్నాం.
- source_word: לַיְלָה וָיוֹם
  choice: రాత్రింబగళ్లు
  rationale: రాత్రి, పగలు అనే జంట తెలిపే నిరంతరత్వాన్ని సహజమైన తెలుగు నుడికారంతో, మూలార్థాన్ని కోల్పోకుండా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר אָמַרְתָּ יִהְיֶה שְׁמִי שָׁם
  choice: ‘నా నామం అక్కడ ఉంటుంది’ అని నీవు చెప్పిన
  rationale: దేవుని ‘నామం’ గురించిన ముఖ్యమైన ఆలయ భాషను ‘సన్నిధి’ లేదా ‘నివాసం’గా వ్యాఖ్యానించి మార్చకుండా యథాతథంగా నిలిపాం.
- source_word: לִשְׁמֹעַ אֶל הַתְּפִלָּה
  choice: ప్రార్థనను ఆలకించునుగాక
  rationale: שׁמע ప్రార్థన సందర్భంలో శ్రద్ధగా వినడాన్ని సూచిస్తుంది. ‘ఆలకించు’ గౌరవభరితమైన, సహజమైన తెలుగు; ప్రార్థనా సందర్భానికి తగిన ఆశాభావ రూపాన్ని వాడాం.
- source_word: עַבְדְּךָ
  choice: నీ సేవకుడు
  rationale: దేవుని ఎదుట సొలొమోను చూపే వినయపూర్వక సేవాసంబంధాన్ని ‘సేవకుడు’ సహజంగా తెలియజేస్తుంది.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: ఈ స్థలంవైపు
  rationale: ప్రార్థన ఆలయ దిశగా చేయబడుతున్నదనే మూలంలోని దిశార్థాన్ని ‘వైపు’తో నిలిపాం.
theological_decisions:
- issue: దేవుని కన్నులు తెరిచి ఉండడం అనే మానవరూపక భాష
  choice: ‘నీ కన్నులు ... తెరిచి ఉండి’ అని మూలచిత్రాన్ని నిలిపాం.
  alternative: ‘ఈ మందిరంపై నీ దృష్టి ఉంచి’ లేదా ‘ఈ మందిరాన్ని కాపాడుతూ’
  rationale: మూలంలోని శరీరరూపకాన్ని భావవ్యాఖ్యగా కుదించకుండా ఉంచడం దాని కవితాత్మక, దైవశాస్త్రీయ బలాన్ని కాపాడుతుంది.
- issue: ‘నా నామం అక్కడ ఉంటుంది’ అనే ఆలయ భాష
  choice: ప్రధాన పాఠ్యంలో ‘నా నామం అక్కడ ఉంటుంది’ అని ఉంచాం.
  alternative: ‘నా సన్నిధి అక్కడ ఉంటుంది’ లేదా ‘నేను అక్కడ నివసిస్తాను’
  rationale: ఈ మాట దేవుని ఎన్నుకున్న స్థలంతో ఆయనకున్న నిబంధనాత్మక అనుబంధాన్ని సూచించినా, మూలంలోని ‘నామం’ అనే పదాన్ని ఒకే వ్యాఖ్యానానికి పరిమితం చేయకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ప్రార్థనకు తగిన గౌరవభరిత శైలిని వాడాం. ‘మందిరం’, ‘నామం’, ‘ఆలకించునుగాక’ వంటి పదాలు సందర్భ గాంభీర్యాన్ని నిలుపుతాయి. మూలంలోని రెండు ‘వైపు’ ప్రయోగాల దిశార్థం స్పష్టంగా ఉండేలా పునరుక్తిని ఉద్దేశపూర్వకంగా కాపాడాం.
