  text: And all the elders of Israel came[b][a], and the priests carried the ark.
translation:
  language: te
  text: ఇశ్రాయేలు పెద్దలందరూ వచ్చారు. యాజకులు మందసాన్ని[a] మోశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, నిబంధన మందసం; ఈ వచనంలో పూర్తి పేరు లేకపోయినా, పరిసర సందర్భం దానిని స్పష్టం చేస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: వచ్చారు
  rationale: בוא క్రియ యొక్క కథన క్రమరూపం; గమ్యస్థానం ఈ వచనంలో ప్రత్యేకంగా చెప్పబడనందున సహజమైన ‘వచ్చారు’ సరైనది.
- source_word: כֹּל זִקְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పెద్దలందరూ
  rationale: ఇశ్రాయేలు సమాజంలోని గుర్తింపు పొందిన నాయకులందరినీ సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: וַיִּשְׂאוּ
  choice: మోశారు
  rationale: נשׂא ఇక్కడ ఎత్తి తీసుకువెళ్లడాన్ని సూచిస్తుంది; సందర్భంలో ‘మోశారు’ అర్థాన్ని సహజంగా, సంపూర్ణంగా తెలియజేస్తుంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: నిర్దిష్ట బహువచన నామానికి సాధారణమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం.
- source_word: אֶת הָאָרוֹן
  choice: మందసాన్ని
  rationale: ఈ సందర్భంలో అందరికీ తెలిసిన పవిత్ర మందసాన్ని సూచిస్తుంది; మూలంలో ‘నిబంధన’ అనే విస్తృత బిరుదు ఈ వచనంలో లేదు కాబట్టి దాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
theological_decisions:
- issue: ‘మందసం’ యొక్క పూర్తి గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో ‘మందసం’ మాత్రమే
  alternative: ‘నిబంధన మందసం’
  rationale: ఈ వచనంలోని హీబ్రూ పాఠ్యంలో הָאָרוֹן (‘మందసం’) మాత్రమే ఉంది. పరిసర సందర్భం అది నిబంధన మందసమని స్పష్టం చేసినా, ప్రధాన పాఠ్యంలో లేని పదాన్ని చేర్చకుండా మూలరూపాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యక్రమాన్ని బలవంతంగా అనుకరించకుండా, రెండు వరుస క్రియలను స్పష్టమైన తెలుగు వాక్యాలుగా ఇచ్చాం. ‘మోశారు’లో ఎత్తి తీసుకువెళ్లే భావం సహజంగా ఇమిడినందున ప్రత్యేక లెక్సికల్ ప్రత్యామ్నాయ పాదటిప్పణి అవసరం లేదు.
