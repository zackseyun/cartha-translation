source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר֙ דִּבֶּ֣ר בְּ/פִ֔י/ו אֵ֖ת דָּוִ֣ד אָבִ֑/י וּ/בְ/יָד֥/וֹ מִלֵּ֖א לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/015.yaml
  text: And he said[a], “Blessed be Yahweh, the God of Israel, who spoke with his mouth to David my father and has fulfilled it with his hand, saying,”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “ఇశ్రాయేలు దేవుడైన యాహ్వే ఆశీర్వదింపబడుగాక![a] ఆయన నా తండ్రియైన దావీదుతో తన నోటితో చెప్పినదాన్ని తన చేతితో నెరవేర్చాడు. ఆయన ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్తుతింపబడుగాక.” హీబ్రూలో ఇది సంప్రదాయ ఆశీర్వచన సూత్రప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: స్తుతింపబడుగాక
  rationale: ఇది ఆశీర్వాద/స్తుతి సూత్రప్రయోగం. ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండేలా ‘స్తుతింపబడుగాక’ అని ఇచ్చాం; ‘ఆశీర్వదింపబడుగాక’ అనే మరింత రూపానుగత ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడు
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన తెలుగు పదక్రమంలో ‘ఇశ్రాయేలు దేవుడైన’ అని వ్యక్తపరిచాం.
- source_word: אֲשֶׁר דִּבֶּר בְּפִיו
  choice: ఆయన ... తన నోటితో చెప్పినదాన్ని
  rationale: ‘నోటితో’ అనే శరీరాంగ రూపకాన్ని ఉంచి, తరువాతి ‘తన చేతితో’ అనే సమాంతర ప్రయోగాన్ని సంరక్షించాం.
- source_word: אֵת דָּוִד אָבִי
  choice: నా తండ్రి దావీదుతో
  rationale: דבר + אֵת ఇక్కడ సంభాషణకు ఉద్దేశింపబడిన వ్యక్తిని సూచిస్తుంది. తెలుగులో ‘దావీదుతో చెప్పిన’ సహజంగా ఉంటుంది; ‘దావీదుకు’ కూడా సాధ్యమే.
- source_word: וּבְיָדוֹ מִלֵּא
  choice: తన చేతితో నెరవేర్చాడు
  rationale: దేవుని మాట మరియు కార్యం మధ్య ఉన్న సమాంతరాన్ని నిలిపేందుకు ‘చేతితో’ ఉంచి, מִלֵּאను సందర్భానుసారంగా ‘నెరవేర్చాడు’ అని అనువదించాం.
- source_word: לֵאמֹר
  choice: 'ఆయన ఇలా అన్నాడు:'
  rationale: తరువాతి వచనంలో వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే ఉల్లేఖన రూపం. తెలుగు వాక్యప్రవాహంలో స్పష్టత కోసం కర్తను పునరుద్ధరించాం.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు బాగా పరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’ను ఎంచుకున్నాం; ‘యాహ్వే’ పునర్నిర్మిత ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
- issue: בָּרוּךְ స్తుతి/ఆశీర్వాద సూత్రం
  choice: స్తుతింపబడుగాక
  alternative: ఆశీర్వదింపబడుగాక
  rationale: దేవుని గురించి ఉపయోగించిన ఈ సూత్రంలో తెలుగు పాఠకులకు ఉద్దేశ్యం స్పష్టంగా ఉండేందుకు ‘స్తుతింపబడుగాక’ ఎంచుకున్నాం; అయితే హీబ్రూ రూపంలోని ఆశీర్వాద భాషను పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘నోటితో—చేతితో’ అనే మూలభాషా సమాంతరాన్ని ఉద్దేశపూర్వకంగా నిలిపాం. చివరి ఉల్లేఖన సూత్రం తరువాతి వచనంతో అనుసంధానమవుతుంది.
