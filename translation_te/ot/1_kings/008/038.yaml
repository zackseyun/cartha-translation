revisions:
- from: ఏ వ్యక్తి గానీ, నీ ప్రజలైన ఇశ్రాయేలీయులందరూ గానీ ఏ ప్రార్థన, ఏ విన్నపం చేసినా,[a] ప్రతి ఒక్కరూ తమ హృదయపు తెగులును[b] తెలుసుకొని ఈ మందిరం[c] వైపు తమ చేతులు చాపినప్పుడు,
  to: ఏ వ్యక్తి గానీ, నీ ప్రజలైన ఇశ్రాయేలీయులందరూ గానీ చేసే ఏ ప్రార్థనైనా, ఏ విన్నపమైనా చేసినప్పుడు,[a] వారిలో ప్రతి ఒక్కరూ తన హృదయపు పీడను[b] తెలుసుకొని ఈ ఇల్లు[c] వైపు తన చేతులు చాపినప్పుడు,
  rationale: The revision retains the Hebrew’s broad scope and its singular distributive force (“ప్రతి ఒక్కరూ ... తన”), improves Telugu syntactic flow, renders the inward נֶגַע as “పీడ,” and restores the source term “house” in the text. The alternative construal of לְ (“for” rather than “by”) remains available in footnote a. The final comma is retained because this verse continues into the following verse.
