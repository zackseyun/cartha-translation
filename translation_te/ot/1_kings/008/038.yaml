  text: whatever prayer[a], whatever plea, may be made by any man or by all your people Israel, each knowing the affliction of his own heart and spreading out his hands toward this house[c][b],
translation:
  language: te
  text: ఏ వ్యక్తి గానీ, నీ ప్రజలైన ఇశ్రాయేలీయులందరూ గానీ చేసే ఏ ప్రార్థనైనా, ఏ విన్నపమైనా చేసినప్పుడు,[a] వారిలో ప్రతి ఒక్కరూ తన హృదయపు పీడను[b] తెలుసుకొని ఈ ఇల్లు[c] వైపు తన చేతులు చాపినప్పుడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ పదబంధాన్ని ‘ఏ వ్యక్తికోసం గానీ, నీ ప్రజలైన ఇశ్రాయేలీయులందరి కోసం గానీ చేయబడే ఏ ప్రార్థనైనా, ఏ విన్నపమైనా’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘తన హృదయపు తెగులు’ లేదా ‘పీడ.’ ఇది ప్రతి ఒక్కరి అంతరంగాన్ని పీడించే బాధను లేదా విపత్తును సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ ‘ఈ ఇల్లు’ యెహోవా మందిరాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל תְּפִלָּה
  choice: ఏ ప్రార్థన
  rationale: అనిర్దిష్ట సంబంధ వాక్యంతో ఉన్న כָּל సమగ్ర పరిధిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఏ ప్రార్థన ... చేసినా’ సహజంగా అదే భావాన్ని అందిస్తుంది.
- source_word: כָל תְּחִנָּה
  choice: ఏ విన్నపం
  rationale: תְּחִנָּה అనుగ్రహం కోసం చేసే హృదయపూర్వక వేడుకోలును సూచిస్తుంది; ‘విన్నపం’ గౌరవప్రదమైన, సులభంగా అర్థమయ్యే సమానార్థకం.
- source_word: אֲשֶׁר תִהְיֶה
  choice: చేసినా
  rationale: ప్రార్థన లేదా విన్నపం ఏ సందర్భంలో చేయబడినా అనే అనిర్దిష్ట భావాన్ని సహజమైన తెలుగు షరతు నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: לְכָל הָאָדָם
  choice: ఏ వ్యక్తి గానీ
  rationale: לְ ఇక్కడ ప్రార్థన చేసే వ్యక్తితో సంబంధాన్ని సూచిస్తుందని గ్రహించాం. הָאָדָם ప్రతినిధి ఏకవచనంగా ఉన్నా, తెలుగులో ‘వ్యక్తి’ సహజంగా ఉండి మూలంలోని సాధారణ మానవ సూచనను నిలుపుతుంది. వేరుగా ‘ఏ మనిషి చేసినదైనా’ అని కూడా అర్థం చేసుకోవచ్చు.
- source_word: לְכֹל עַמְּךָ יִשְׂרָאֵל
  choice: నీ ప్రజలైన ఇశ్రాయేలీయులందరూ గానీ
  rationale: వ్యక్తి నుండి సమస్త నిబంధన ప్రజలకు పరిధిని విస్తరించే సమాంతర పదబంధం; తెలుగు వాక్య నిర్మాణంలో ప్రార్థన చేసేవారిగా స్పష్టంగా అమర్చబడింది.
- source_word: אֲשֶׁר יֵדְעוּן אִישׁ
  choice: ప్రతి ఒక్కరూ ... తెలుసుకొని
  rationale: אִישׁ యొక్క పంపిణీ భావాన్ని ‘ప్రతి ఒక్కరూ’ స్పష్టంగా చూపుతుంది; సమూహంలోని ఒక్కొక్కరి వ్యక్తిగత అవగాహన నిలుస్తుంది.
- source_word: נֶגַע לְבָבוֹ
  choice: తమ హృదయపు తెగులు
  rationale: נֶגַע యొక్క బలమైన రూపకార్థమైన ‘తెగులు/పీడ’ను మృదువుగా ‘బాధ’గా మార్చకుండా నిలిపింది; సందర్భంలో ఇది అంతరంగాన్ని పీడించే దానిని సూచించవచ్చు.
- source_word: וּפָרַשׂ כַּפָּיו
  choice: తమ చేతులు చాపినప్పుడు
  rationale: ప్రార్థనలో అరచేతులను విప్పి చాపే భంగిమను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: ఈ మందిరం వైపు
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఈ సందర్భంలో సొలొమోను ప్రతిష్ఠించిన దేవాలయమే స్పష్టమైన సూచ్యం. ‘మందిరం’ ordinary Telugu readersకు సహజంగా అర్థమవుతుంది; పాదసూచిక మూల పదాన్ని తెలుపుతుంది.
theological_decisions:
- issue: הָאָדָם అనే ప్రతినిధి ఏకవచనాన్ని ఎలా అనువదించాలి
  choice: వ్యక్తి
  alternative: మనిషి
  rationale: మూలంలోని సాధారణ మానవ సూచనను లింగపరమైన అదనపు భావం లేకుండా తెలుగులో సహజంగా అందిస్తుంది; తరువాతి אִישׁ యొక్క పంపిణీ భావం ‘ప్రతి ఒక్కరూ’గా నిలుపబడింది.
- issue: נֶגַע לְבָבוֹ లోని రూపకాన్ని నిలుపాలా లేదా సాధారణీకరించాలా
  choice: హృదయపు తెగులు
  alternative: హృదయ బాధ
  rationale: ‘తెగులు’ మూలంలోని נֶגַע బలాన్ని, ఉద్దేశపూర్వక రూపకాన్ని నిలుపుతుంది. ఇది శారీరక వ్యాధికే పరిమితం కాక అంతరంగ పీడను కూడా సూచించగలదనే అస్పష్టతను పాదసూచిక వివరిస్తుంది.
- issue: הַבַּיִת ను అక్షరార్థంగా ‘ఇల్లు’గా ఉంచాలా, సూచ్యార్థంగా ‘మందిరం’గా ఇవ్వాలా
  choice: మందిరం
  alternative: ఈ ఇల్లు
  rationale: సందర్భంలో సూచ్యం దేవాలయమే; ‘మందిరం’ ఆధునిక తెలుగులో వెంటనే స్పష్టమవుతుంది. అయితే హీబ్రూ అక్షరార్థం ‘ఈ ఇల్లు’ అని పాదసూచికలో భద్రపరచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, పఠనయోగ్యమైన శైలి. వచనం తరువాతి వాక్యంతో కొనసాగుతున్నందున చివర కామా ఉంచబడింది. వ్యక్తి/సమూహ సమాంతరతను ‘గానీ ... గానీ’ నిర్మాణంతో, పంపిణీ భావాన్ని ‘ప్రతి ఒక్కరూ’తో వ్యక్తం చేశాం.
