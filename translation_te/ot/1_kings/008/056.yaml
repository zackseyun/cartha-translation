  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בָּר֣וּךְ יְהוָ֗ה אֲשֶׁ֨ר נָתַ֤ן מְנוּחָה֙ לְ/עַמּ֣/וֹ יִשְׂרָאֵ֔ל כְּ/כֹ֖ל אֲשֶׁ֣ר דִּבֵּ֑ר לֹֽא נָפַ֞ל דָּבָ֣ר אֶחָ֗ד מִ/כֹּל֙ דְּבָר֣/וֹ הַ/טּ֔וֹב אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד מֹשֶׁ֥ה עַבְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/056.yaml
  text: Blessed be Yahweh[a], who has given rest to his people Israel, according to all that he spoke. Not one word has failed of all his good words that he spoke by the hand of Moses his servant.
translation:
  language: te
  text: “తాను పలికిన సమస్తం ప్రకారం తన ప్రజలైన ఇశ్రాయేలుకు విశ్రాంతిని అనుగ్రహించిన యాహ్వే స్తుతింపబడుగాక! తన సేవకుడైన మోషే ద్వారా ఆయన పలికిన మంచి మాటలన్నిటిలో ఒక్క మాట కూడా తప్పిపోలేదు[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “ఆయన పలికిన మంచి వాగ్దానాలన్నిటిలో ఒక్క వాగ్దానమూ నెరవేరకుండా మిగలలేదు.” ఇక్కడ ‘మాట’కు పలికిన వాగ్దానం అనే భావం ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: స్తుతింపబడుగాక
  rationale: ఇది ఆశీర్వాదాత్మకమైన స్తుతి ప్రకటన. ‘స్తుతింపబడుగాక’ ఆధునిక తెలుగులో సహజంగా ఉండి, హీబ్రూ పదంలోని ఆరాధనా బలాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ శాస్త్రీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: נָתַן מְנוּחָה
  choice: విశ్రాంతి అనుగ్రహించిన
  rationale: శత్రువులనుండి, అస్థిరతనుండి లభించిన స్థిరమైన విశ్రాంతిని సూచిస్తుంది; కేవలం అంతరంగ శాంతి అనే భావానికి పరిమితం చేయదు.
- source_word: לְעַמּוֹ יִשְׂרָאֵל
  choice: తన ప్రజలైన ఇశ్రాయేలుకు
  rationale: ఇశ్రాయేలు యాహ్వే ప్రజలని తెలిపే సంబంధాన్ని సహజమైన తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: כְּכֹל אֲשֶׁר דִּבֵּר
  choice: తాను పలికినదంతటి ప్రకారం
  rationale: సందర్భం వాగ్దాన నెరవేర్పును సూచించినా, మూలంలోని ‘పలికాడు’ అనే సాధారణ క్రియను అలాగే నిలుపుతుంది.
- source_word: לֹא נָפַל דָּבָר אֶחָד
  choice: ఒక్క మాట కూడా తప్పిపోలేదు
  rationale: అక్షరార్థంగా ‘ఒక్క మాట పడిపోలేదు’ అనే హీబ్రూ నుడికారానికి, ఏ మాటా విఫలం కాలేదనే సహజమైన తెలుగు సమానార్థక రూపం.
- source_word: מִכֹּל דְּבָרוֹ הַטּוֹב
  choice: మంచి మాటలన్నిటిలో
  rationale: ఏకవచన సమష్టి భావాన్ని తెలుగులో సహజమైన బహువచనంతో అందిస్తూ, ‘వాగ్దానం’ అని ముందుగానే వ్యాఖ్యానించకుండా ‘మాట’ అనే పదాన్ని నిలుపుతుంది.
- source_word: בְּיַד מֹשֶׁה
  choice: మోషే ద్వారా
  rationale: అక్షరార్థమైన ‘మోషే చేతి ద్వారా’ తెలుగులో కృత్రిమంగా ఉంటుంది; ‘మోషే ద్వారా’ మధ్యవర్తిత్వం లేదా సాధనార్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: עַבְדּוֹ
  choice: తన సేవకుడైన
  rationale: మోషేకు గౌరవప్రదమైన నియుక్త సేవకుని స్థానం ఉన్నందున ‘దాసుడు’ కంటే ఈ సందర్భంలో ‘సేవకుడు’ సహజం.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని నామాన్ని ప్రత్యక్షంగా నిలుపుతుంది.
- issue: דָּבָר / דְּבָרוֹ ను ‘మాట’గా లేదా ‘వాగ్దానం’గా ఇవ్వాలా
  choice: మాట
  alternative: వాగ్దానం
  rationale: సందర్భం వాగ్దాన నెరవేర్పును సూచిస్తుంది; అయినా హీబ్రూ పదం విస్తృతార్థకమైన ‘మాట’. ప్రధాన పాఠంలో ఆ అస్పష్టతను నిలిపి, వాగ్దాన భావాన్ని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆరాధనాత్మక గాంభీర్యాన్ని నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండే వాక్యనిర్మాణం వాడబడింది. హీబ్రూ నుడికారాన్ని అక్షరానువాదంగా కాక అర్థసహజంగా ఇచ్చినా, ‘మాట/వాగ్దానం’ మధ్యనున్న భావవ్యాప్తిని ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా కాపాడింది.
