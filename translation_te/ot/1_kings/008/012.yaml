source:
  edition: WLC
  text: אָ֖ז אָמַ֣ר שְׁלֹמֹ֑ה יְהוָ֣ה אָמַ֔ר לִ/שְׁכֹּ֖ן בָּ/עֲרָפֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/012.yaml
  text: Then Solomon said[a], “Yahweh said that he would dwell in the thick darkness.”
translation:
  language: te
  text: 'అప్పుడు సొలొమోను ఇలా అన్నాడు: “యెహోవా తాను గాఢాంధకారంలో[a] నివసిస్తానని చెప్పాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చీకటి మేఘంలో.” హీబ్రూ పదం עֲרָפֶל దట్టమైన చీకటిని లేదా చీకటి మేఘాన్ని సూచించవచ్చు; ముఖ్యంగా యెహోవా ప్రత్యక్ష సన్నిధిని వర్ణించే సందర్భాల్లో ఈ రెండు భావాలూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: కథన క్రమాన్ని సూచించే సహజమైన ఆధునిక తెలుగు కాలసూచక పదం.
- source_word: אָמַר
  choice: అన్నాడు / చెప్పాడు
  rationale: మొదటి సందర్భంలో ప్రత్యక్ష వాక్యాన్ని పరిచయం చేయడానికి ‘అన్నాడు’, రెండవ సందర్భంలో నివేదిత దైవవాక్యానికి ‘చెప్పాడు’ సహజంగా సరిపోతాయి.
- source_word: שְׁלֹמֹה
  choice: సొలొమోను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- source_word: לִשְׁכֹּן
  choice: తాను … నివసిస్తానని
  rationale: ל తో కూడిన క్రియానామం పలికిన మాటలోని ఉద్దేశం లేదా విషయాన్ని తెలియజేస్తుంది; తెలుగులో పరోక్ష వచనంగా ఈ రూపం సహజంగా ఉంటుంది.
- source_word: בָּעֲרָפֶל
  choice: గాఢాంధకారంలో
  rationale: עֲרָפֶל సూచించే దట్టమైన చీకటి లేదా గాఢాంధకార భావాన్ని, అలాగే దైవసన్నిధికి సంబంధించిన నిగూఢతను నిలుపుతుంది.
theological_decisions:
- issue: עֲרָפֶלలో యెహోవా నివసించడం
  choice: గాఢాంధకారంలో నివసిస్తానని
  alternative: చీకటి మేఘంలో నివసిస్తానని
  rationale: దేవుని ప్రత్యక్ష సన్నిధి మరియు మరుగుదనం మధ్య ఉన్న భావ ఉద్వేగాన్ని ‘గాఢాంధకారం’ నిలుపుతుంది; దానిని కేవలం వాతావరణ సంబంధమైన మేఘంగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్య నిర్మాణం. ‘ఇలా అన్నాడు’ ప్రత్యక్ష వాక్యానికి స్పష్టమైన ప్రవేశాన్ని ఇస్తుంది; ‘తాను’ అనే పదం నివసించేవాడు యెహోవానే అని తెలుగులో స్పష్టం చేస్తుంది.
