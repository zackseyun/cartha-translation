  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּֽי עַמְּ/ךָ֥ וְ/נַחֲלָתְ/ךָ֖ הֵ֑ם אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ מִ/מִּצְרַ֔יִם מִ/תּ֖וֹךְ כּ֥וּר הַ/בַּרְזֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/051.yaml
  text: For they are your people and your inheritance[a], whom you brought out of Egypt[b], out of the midst of the iron furnace.
translation:
  language: te
  text: ఎందుకంటే వారు నీ ప్రజలు, నీ స్వాస్థ్యం[a]; నీవు వారిని ఐగుప్తులోనుండి, ఇనుప కొలిమిలోనుండి[b] బయటకు తీసుకొచ్చావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ వారసత్వం’ లేదా ‘నీ సొత్తు.’
    reason: lexical_alternative
  - marker: b
    text: ‘ఇనుప కొలిమి’ అనేది తీవ్రమైన అణచివేత, బాధ అనుభవించిన స్థలంగా ఐగుప్తును సూచించే రూపకం; ద్వితీయోపదేశకాండము 4:20 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: చుట్టుపక్కల ప్రార్థనలో సొలొమోను చేస్తున్న విన్నపానికి కారణాన్ని పరిచయం చేస్తుంది; హీబ్రూ వివరణాత్మక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עַמְּךָ
  choice: నీ ప్రజలు
  rationale: దేవునితో ఇశ్రాయేలు సంబంధాన్ని సూచించే సరళమైన, సందర్భోచితమైన అనువాదం.
- source_word: וְנַחֲלָתְךָ
  choice: నీ స్వాస్థ్యం
  rationale: నַחֲלָהలోని వారసత్వంగా లభించిన భాగం లేదా సొంతమైన భాగం అనే భావాలను ‘స్వాస్థ్యం’ సముచితంగా నిలుపుతుంది; ప్రజలు దేవునికి చెందినవారనే నిబంధనాత్మక భావాన్నీ వ్యక్తం చేస్తుంది.
- source_word: הֵם
  choice: వారు
  rationale: హీబ్రూలో స్పష్టంగా ఉన్న స్వతంత్ర సర్వనామాన్ని తెలుగులో సహజమైన విధేయ నిర్మాణంతో నిలుపుతుంది.
- source_word: אֲשֶׁר
  choice: వారిని
  rationale: ముందున్న ప్రజలను తిరిగి సూచించే సంబంధవాచక భావం తెలుగులో తరువాతి క్రియతో సహజంగా వ్యక్తమవుతుంది.
- source_word: הוֹצֵאתָ
  choice: నువ్వే ... బయటకు తీసుకొచ్చావు
  rationale: יצא హిఫీల్ రూపంలోని కారణార్థక నిర్గమన భావాన్ని నిలుపుతుంది; ‘నువ్వే’ హీబ్రూ ద్వితీయ పురుష క్రియలోని కర్తను సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: מִמִּצְרַיִם
  choice: ఐగుప్తులోనుండి
  rationale: నిర్గమన సూత్రప్రయోగాన్ని సహజమైన తెలుగు రూపంలో తెలియజేస్తుంది.
- source_word: מִתּוֹךְ
  choice: మధ్యనుండి
  rationale: ఏదో ఒక దాని లోపలి భాగం నుంచి బయటకు రావడమనే సజీవ స్థలచిత్రాన్ని కాపాడుతుంది.
- source_word: כּוּר הַבַּרְזֶל
  choice: ఇనుప కొలిమి
  rationale: తీవ్రమైన అణచివేత స్థలంగా ఐగుప్తును చిత్రించే మూలభాషా రూపకాన్ని వివరణతో భర్తీ చేయకుండా యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: ఇశ్రాయేలు దేవుని נַחֲלָהగా పేర్కొనబడటం
  choice: ప్రధాన పాఠ్యంలో ‘నీ స్వాస్థ్యం’
  alternative: నీ వారసత్వం; నీ సొత్తు
  rationale: ‘స్వాస్థ్యం’ కేటాయించబడిన లేదా వారసత్వంగా పొందిన సొంత భాగం అనే నిబంధనాత్మక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; పాఠ్యానికి మించిన సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. దేవునికి చేసే ప్రత్యక్ష సంబోధనలో ఆధునిక సహజ ఏకవచన రూపమైన ‘నీ/నువ్వే’ వాడబడింది. హీబ్రూ వాక్యంలోని కారణసంబంధం, నిర్గమన భాష, ‘ఇనుప కొలిమి’ రూపకం నిలుపబడ్డాయి.
