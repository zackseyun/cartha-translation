review_pass:
  verdict: revise
  source_fidelity: 'The judicial sequence is substantially retained: God is asked to hear, act, judge his servants, declare the wicked guilty, bring his conduct back upon him, and declare the righteous righteous and give according to his righteousness. However, కార్యం జరిగించి is not a natural rendering of ועשית, and అనుగ్రహించు adds a grace/favor nuance not expressed by the simple לתת (“give”).'
  naturalness: The draft’s legal register is generally clear, but కార్యం జరిగించి is awkward in modern standard Telugu. చర్య తీసుకొని is idiomatic and suitably broad. The revised wording also makes the final recompense clause natural without adding interpretive coloring.
  terminology: దోషిగా తీర్చి and నీతిమంతుడని తీర్చి preserve the forensic force and parallelism of להרשיע and להצדיק. The revised “అతని ప్రవర్తన ఫలితాన్ని అతని తలమీదికే మోపి” communicates the Hebrew recompense idiom while retaining its head imagery. “పరలోకంలో” is acceptable in this prayer formula; a note preserves the viable “పరలోకం నుండి” alternative.
  issues:
  - severity: medium
    issue: కార్యం జరిగించి for וְעָשִׂיתָ
    rationale: This phrase sounds causative and unnatural (“causing a task to happen”), whereas the Hebrew broadly requests that God act. చర్య తీసుకొని is idiomatic and does not narrow the action.
  - severity: medium
    issue: అనుగ్రహించు for לָתֶת לוֹ
    rationale: అనుగ్రహించు can imply a gracious bestowal or favor. The Hebrew says simply “give to him according to his righteousness,” in a judicial-recompense context; ఇచ్చి is closer and more neutral.
  - severity: low
    issue: Main-text explanation of the ‘way upon his head’ idiom
    rationale: The draft is understandable but “ప్రవర్తనకు తగిన ప్రతిఫలం” explains the idiom fully in the text. The revision retains the retributive head imagery while a footnote explains it.
  revised_text: అప్పుడు నీవు పరలోకంలో[a] విని, చర్య తీసుకొని, నీ సేవకులకు తీర్పు తీర్చు. దుష్టుణ్ణి దోషిగా తీర్చి, అతని ప్రవర్తన ఫలితాన్ని అతని తలమీదికే మోపి[b]; నీతిమంతుణ్ణి నీతిమంతుడని తీర్చి[c], అతని నీతిని బట్టి అతనికి ఇచ్చు.
