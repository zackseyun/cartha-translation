  yaml_path: translation/ot/1_kings/008/032.yaml
  text: then hear in heaven and act[a], and judge your servants, condemning the wicked by bringing his way upon his own head[c][b], and justifying the righteous by giving to him according to his righteousness.
translation:
  language: te
  text: అప్పుడు నీవు పరలోకంలో[a] విని, చర్య తీసుకొని, నీ సేవకులకు తీర్పు తీర్చు. దుష్టుణ్ణి దోషిగా తీర్చి, అతని ప్రవర్తన ఫలితాన్ని అతని తలమీదికే మోపి[b]; నీతిమంతుణ్ణి నీతిమంతుడని తీర్చి[c], అతని నీతిని బట్టి అతనికి ఇచ్చు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరలోకం నుండి విని.’ హీబ్రూలో ఉన్న ప్రార్థనా ప్రయోగాన్ని ‘పరలోకంలో విని’ లేదా ‘పరలోకం నుండి విని’ అని అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘అతని మార్గాన్ని అతని తలమీద ఉంచి.’ ఇది ఒక వ్యక్తి ప్రవర్తనకు తగిన ప్రతిఫలాన్ని అతనికే తిరిగి కలిగించడాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
  - marker: c
    text: లేదా, ‘నిర్దోషిగా తీర్చి’ / ‘నీతిమంతునికి న్యాయం చేసి.’ ఇక్కడి క్రియ న్యాయస్థాన సందర్భంలో ఒకరిని నీతిమంతుడని ప్రకటించడాన్ని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: పరలోకంలో విని
  rationale: హీబ్రూ ప్రార్థనా సందర్భంలో దేవుడు పరలోకంలో ఉండి వినడాన్ని సూచించే స్థానార్థక ప్రయోగం; సహజమైన తెలుగులో ‘పరలోకంలో విని’ మూలానికి సమీపంగా ఉంటుంది.
- source_word: וְעָשִׂיתָ
  choice: కార్యం జరిగించి
  rationale: עשה అనే విస్తృత క్రియ ఇక్కడ విన్న దానికి ప్రతిస్పందనగా చర్య తీసుకోవడాన్ని సూచిస్తుంది; ‘కార్యం జరిగించి’ న్యాయపరమైన దైవ జోక్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְשָׁפַטְתָּ אֶת עֲבָדֶיךָ
  choice: నీ సేవకులకు తీర్పు తీర్చు
  rationale: שׁפט ఇక్కడ ప్రమాణంతో కూడిన వివాదాన్ని న్యాయంగా పరిష్కరించడాన్ని సూచిస్తుంది; ఫలితాన్ని ముందే నిర్ధారించకుండా న్యాయస్థాన భావాన్ని కాపాడుతుంది.
- source_word: לְהַרְשִׁיעַ רָשָׁע
  choice: దుష్టుణ్ణి దోషిగా తీర్చి
  rationale: רשע హిఫీల్ న్యాయ సందర్భంలో దోషిగా ప్రకటించడం అనే అర్థం ఇస్తుంది; తెలుగు న్యాయపరమైన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: לָתֵת דַּרְכּוֹ בְּרֹאשׁוֹ
  choice: అతని ప్రవర్తనకు తగిన ప్రతిఫలాన్ని అతని తలమీదికే రప్పించు
  rationale: ‘అతని మార్గాన్ని అతని తలమీద ఉంచడం’ అనే హీబ్రూ నుడికారంలోని ప్రతిఫల, ప్రతీకార చిత్రాన్ని ‘తలమీదికే’ ద్వారా నిలుపుతూ, ‘ప్రవర్తనకు తగిన ప్రతిఫలం’తో అర్థాన్ని స్పష్టం చేస్తుంది.
- source_word: וּלְהַצְדִּיק צַדִּיק
  choice: నీతిమంతుణ్ణి నిర్దోషిగా తీర్చి
  rationale: צדק హిఫీల్‌కు ఇక్కడ నైతికంగా మార్చడం కాక న్యాయపరంగా నిర్దోషి లేదా న్యాయవంతుడని ప్రకటించడం అనే భావం ఉంది.
- source_word: לָתֶת לוֹ כְּצִדְקָתוֹ
  choice: అతని నీతిని బట్టి అతనికి అనుగ్రహించు
  rationale: వ్యక్తి నీతికి అనుగుణంగా అతనికి ఇవ్వాలనే మూల భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘బహుమానమివ్వు’ అని చెప్పి భావాన్ని అతిగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: న్యాయపరమైన ప్రకటననా, నైతిక పరివర్తనా
  choice: ‘దోషిగా తీర్చి’ మరియు ‘నిర్దోషిగా తీర్చి’ అనే న్యాయపరమైన జత
  alternative: ‘శిక్షించి’ మరియు ‘సమర్థించి’
  rationale: ఈ వాక్యం ప్రమాణం, విచారణ, తీర్పు సందర్భంలో ఉంది. హీబ్రూ causative క్రియలు దోషిగా, నీతిమంతుడిగా ప్రకటించే న్యాయస్థాన భావాన్ని కలిగి ఉన్నాయి; నైతిక పరివర్తన భావాన్ని చేర్చకూడదు.
- issue: ‘అతని మార్గాన్ని అతని తలమీద ఇవ్వడం’ అనే ప్రతిఫల భావం
  choice: ప్రవర్తనకు తగిన ప్రతిఫలాన్ని అతని తలమీదికే రప్పించడం
  alternative: అతని క్రియలను బట్టి అతనికి శిక్ష విధించడం
  rationale: మూలంలోని శరీరాత్మక నుడికార చిత్రాన్ని కొంత నిలుపుతూ దాని అర్థాన్ని తెలుగులో గ్రాహ్యంగా చేస్తుంది; ‘శిక్ష’ మాత్రమే అని పరిమితం చేయకుండా మూలంలోని ప్రతిఫల భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవప్రదమైన ఏకవచన సంబోధనను, న్యాయస్థాన పదజాలాన్ని ఉపయోగించింది. హీబ్రూ నుడికారాన్ని పూర్తిగా తొలగించకుండా, సాధారణ పాఠకునికి అర్థమయ్యేలా ప్రధాన పాఠ్యంలో స్వల్పంగా వివరణాత్మకంగా అనువదించింది.
