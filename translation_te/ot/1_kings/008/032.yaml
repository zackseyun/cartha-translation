revisions:
- from: అప్పుడు నీవు పరలోకంలో విని, కార్యం జరిగించి, నీ సేవకులకు తీర్పు తీర్చు. దుష్టుణ్ణి దోషిగా తీర్చి, అతని ప్రవర్తనకు తగిన ప్రతిఫలాన్ని అతని తలమీదికే రప్పించు[a]; నీతిమంతుణ్ణి నిర్దోషిగా తీర్చి[b], అతని నీతిని బట్టి అతనికి అనుగ్రహించు.
  to: అప్పుడు నీవు పరలోకంలో[a] విని, చర్య తీసుకొని, నీ సేవకులకు తీర్పు తీర్చు. దుష్టుణ్ణి దోషిగా తీర్చి, అతని ప్రవర్తన ఫలితాన్ని అతని తలమీదికే మోపి[b]; నీతిమంతుణ్ణి నీతిమంతుడని తీర్చి[c], అతని నీతిని బట్టి అతనికి ఇచ్చు.
  rationale: The revision replaces an unnatural action verb, avoids the added favor nuance of అనుగ్రహించు, and preserves the Hebrew legal parallel more closely with దోషిగా తీర్చి / నీతిమంతుడని తీర్చి. It also supplies a properly anchored note for the heaven/from-heaven ambiguity and retains the recompense idiom’s imagery with an explanatory note.
