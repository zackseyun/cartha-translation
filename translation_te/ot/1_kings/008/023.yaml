  revised_text: 'అతడు ఇలా అన్నాడు: “ఇశ్రాయేలు దేవుడవైన యెహోవా, పైనున్న ఆకాశంలోగానీ కిందనున్న భూమిమీదగానీ నీతో సమానమైన దేవుడు లేడు.[a] నీ సేవకుల పట్ల నిబంధనను, నిబద్ధమైన ప్రేమను కాపాడేవాడవు; వారు నీ సన్నిధిలో పూర్ణహృదయంతో నడుస్తారు.[b]”'
