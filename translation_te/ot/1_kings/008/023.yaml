id: 1KI.8.23
reference: 1 Kings 8:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵין כָּמ֣וֹ/ךָ אֱלֹהִ֔ים בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּ֑חַת שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לַ/עֲבָדֶ֕י/ךָ הַ/הֹלְכִ֥ים לְ/פָנֶ֖י/ךָ בְּ/כָל לִבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/023.yaml
  text: And he said[a], “O Yahweh, God of Israel, there is no God like you in heaven above or on earth beneath[b], keeping the covenant and the steadfast love for your servants who walk before you with all their heart.”
translation:
  language: te
  text: 'అతడు ఇలా అన్నాడు: “ఇశ్రాయేలు దేవుడవైన యెహోవా, పైనున్న ఆకాశంలోగానీ కిందనున్న భూమిమీదగానీ నీతో సమానమైన దేవుడు లేడు.[a] నీ సేవకుల పట్ల నిబంధనను, నిబద్ధమైన ప్రేమను కాపాడేవాడవు; వారు నీ సన్నిధిలో పూర్ణహృదయంతో నడుస్తారు.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పైనున్న ఆకాశాల్లోను కిందనున్న భూమిమీదను దేవుళ్లలో నీలాంటివాడు లేడు.”
    reason: హీబ్రూలో ‘ఆకాశాలు’ బహువచనంలో ఉంది; אֱלֹהִים ను ‘దేవుళ్లు’ అని కూడా అర్థం చేసుకోవచ్చు.
  - marker: b
    text: ‘నిబద్ధమైన ప్రేమ’కు మూలమైన హీబ్రూ పదం חֶסֶד (హెసెద్); ఇది తరచుగా నిబంధన పట్ల విశ్వసనీయతను, నమ్మకమైన ప్రేమను లేదా స్థిరమైన ప్రేమను సూచిస్తుంది.
    reason: ఈ ముఖ్యమైన హీబ్రూ పదంలోని ప్రేమ, విశ్వసనీయత, నిబంధనాబద్ధత అనే విస్తృత భావపరిధిని వివరించడానికి.
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: అతడు ఇలా అన్నాడు
  rationale: హీబ్రూ కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో పరిచయం చేస్తుంది; కర్త అయిన సొలొమోను సందర్భం ద్వారా స్పష్టమవుతాడు.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు బైబిలు వాడుకలో దైవనామానికి విస్తృతంగా గుర్తింపుపొందిన లిప్యంతరీకరణ; దానిని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామాన్ని నిలుపుతుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడవైన
  rationale: సంబోధనలో సహజంగా వినిపిస్తూ, హీబ్రూ సమాస సంబంధాన్ని నిలుపుతుంది.
- source_word: אֵין כָּמוֹךָ אֱלֹהִים
  choice: నీతో సమానమైన దేవుడు లేడు
  rationale: దేవుని అసమానత్వాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; אֱלֹהִים ను ఈ ప్రత్యక్ష సంబోధన సందర్భంలో ఏకవచనార్థంతో తీసుకుంటుంది.
- source_word: בַּשָּׁמַיִם מִמַּעַל וְעַל הָאָרֶץ מִתָּחַת
  choice: పైనున్న ఆకాశంలోగానీ కిందనున్న భూమిమీదగానీ
  rationale: సమస్త సృష్టిని సూచించే జంటవ్యక్తీకరణను సహజమైన తెలుగులో నిలుపుతుంది; హీబ్రూలో ఆకాశాలు బహువచన రూపంలో ఉన్న విషయాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: שֹׁמֵר הַבְּרִית וְהַחֶסֶד
  choice: నీ నిబంధనను, నిబద్ధమైన ప్రేమను నిలబెట్టేవాడవు
  rationale: שֹׁמֵר అనే కృదంతం దేవుని స్థిర స్వభావాన్ని వర్ణిస్తుంది. నిబంధనను ‘నిలబెట్టడం’ తెలుగులో సహజం; חֶסֶד లోని ప్రేమ మరియు విశ్వసనీయత రెండింటినీ ‘నిబద్ధమైన ప్రేమ’ సూచిస్తుంది.
- source_word: לַעֲבָדֶיךָ
  choice: నీ సేవకుల పట్ల
  rationale: ఈ సందర్భంలోని సంబంధపూర్వక సేవను తెలియజేస్తుంది; బానిసత్వం ప్రధానాంశం కానందున ‘సేవకులు’ తగినది.
- source_word: הַהֹלְכִים לְפָנֶיךָ
  choice: నీ సన్నిధిలో ... నడిచే
  rationale: దేవుని సమక్షంలో విశ్వాసపూర్వకంగా జీవించడాన్ని సూచించే హీబ్రూ రూపకాన్ని ‘నడిచే’ అని నిలుపుతూ, לְפָנֶיךָ ను సహజంగా ‘నీ సన్నిధిలో’ అని వ్యక్తం చేస్తుంది.
- source_word: בְּכָל לִבָּם
  choice: పూర్ణహృదయంతో
  rationale: విభజనలేని అంతరంగ సమర్పణను సంక్షిప్తంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: వ్యక్తిగత దైవనామాన్ని బిరుదుతో కప్పివేయకుండా ఉంచుతూ, ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు అత్యంత సుపరిచితమైన రూపాన్ని ఎంచుకుంది. మూలనామ ఉచ్చారణకు దగ్గరైన ‘యాహ్వే’ కూడా సమర్థనీయ ప్రత్యామ్నాయం.
- issue: אֵין כָּמוֹךָ אֱלֹהִים లో אֱלֹהִים భావం
  choice: నీతో సమానమైన దేవుడు లేడు
  alternative: దేవుళ్లలో నీలాంటివాడు లేడు
  rationale: సందర్భం యెహోవా అసమానత్వాన్ని ప్రకటిస్తుంది. ఏకవచన అనువాదం సహజంగా ఉండి ఆ భావాన్ని ఇస్తుంది; అయితే హీబ్రూ రూపం ‘దేవుళ్లలో’ అనే పఠనానికి కూడా వ్యాకరణపరంగా అవకాశం ఇస్తుంది, కాబట్టి దానిని పాదసూచికలో నిలిపింది.
- issue: חֶסֶד యొక్క నిబంధనాత్మక భావం
  choice: నిబద్ధమైన ప్రేమ
  alternative: విశ్వసనీయ ప్రేమ; స్థిరమైన ప్రేమ; కృప
  rationale: నిబంధనతో జతగా ఉన్న חֶסֶד కేవలం భావోద్వేగ ప్రేమను కాక, విశ్వాసపూర్వకమైన స్థిర నిబద్ధతను కూడా సూచిస్తుంది. ‘నిబద్ధమైన ప్రేమ’ ఈ రెండు పార్శ్వాల మధ్యనున్న భావ ఉద్వేగాన్ని సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనా సందర్భానికి తగిన గౌరవప్రదమైన సంబోధనను, సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణాన్ని ఉపయోగించింది. ‘నడిచే’ అనే బైబిలీయ రూపకాన్ని నిలిపి, దాని భావాన్ని ‘నీ సన్నిధిలో’ ద్వారా స్పష్టం చేసింది. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
