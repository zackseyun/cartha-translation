  revision_rationale: మూలంలోని ఒకే విశేషణాత్మక కృదంతం שֹׁמֵרను “కాపాడేవాడవు”గా ఉంచి, మూలంలో లేని “చూపేవాడవు”ను తొలగించాను. హీబ్రూ సంబంధాన్ని ప్రతిబింబించేందుకు “నీ సేవకుల పట్ల”ను నిబంధన మరియు నిబద్ధమైన ప్రేమతో నేరుగా కలిపాను. సంబంధిత పదబంధం వద్ద పాదసూచిక aను ఉంచాను. చివరి ఉపవాక్యాన్ని తెలుగు వాక్యప్రవాహానికి అనుగుణంగా స్వతంత్రంగా వ్యక్తం చేసినా, అది సేవకులను విశేషించే హీబ్రూ భావాన్నే కొనసాగిస్తుంది.
