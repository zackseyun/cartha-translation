  text: 'And he stood and blessed all the assembly of Israel with a loud voice[b][a], saying:'
translation:
  language: te
  text: 'అతడు నిలబడి, ఇశ్రాయేలు సమాజమంతటినీ బిగ్గరగా[b] ఆశీర్వదిస్తూ[a] ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, వారిపై ఆశీర్వచనం పలుకుతూ.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘గొప్ప స్వరంతో’; అంటే, బిగ్గరగా.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעְמֹד
  choice: అప్పుడు అతడు నిలబడి
  rationale: వావ్-అనుక్రమ రూపం కథనంలోని తదుపరి చర్యను సూచిస్తుంది; עמד యొక్క సహజ అర్థం ఇక్కడ ‘నిలబడు’.
- source_word: וַיְבָרֶךְ
  choice: ఆశీర్వదిస్తూ
  rationale: ఈ సందర్భంలో ברך సమకూడిన ప్రజలపై ఆశీర్వచనం పలకడాన్ని సూచిస్తుంది. తెలుగులో ‘ఆశీర్వదిస్తూ’ సహజంగా ఉండి, తరువాతి మాటలతో చర్యను అనుసంధానిస్తుంది.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సమాజమంతటినీ
  rationale: קהל అనేది సమకూడిన ప్రజాసమూహాన్ని సూచిస్తుంది; ‘సమాజం’ ఆధునిక తెలుగులో స్పష్టంగా ఉంది. כָּל భావాన్ని ‘అంతటినీ’ వ్యక్తపరుస్తుంది.
- source_word: קוֹל גָּדוֹל
  choice: పెద్ద స్వరంతో
  rationale: హెబ్రీ పదబంధానికి అక్షరార్థం ‘గొప్ప/పెద్ద స్వరం’; సందర్భంలో ఇది గట్టిగా, అందరికీ వినబడేలా పలకడాన్ని సూచిస్తుంది. మూల రూపాన్ని నిలుపుతూ తెలుగులో సహజమైన ‘పెద్ద స్వరంతో’ ఎంచుకున్నాం.
- source_word: לֵאמֹר
  choice: 'ఇలా అన్నాడు:'
  rationale: ఈ అవ్యయ క్రియారూపం తరువాత వచ్చే ప్రసంగ విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘ఇలా అన్నాడు:’ సహజమైన కథన అనుసంధానం.
theological_decisions:
- issue: ఇశ్రాయేలును ‘ఆశీర్వదించడం’ యొక్క స్వభావం
  choice: సొలొమోను సమకూడిన ప్రజలపై ఆశీర్వచనం పలికాడు అనే భావాన్ని ఉంచడం
  alternative: సొలొమోను తన స్వశక్తితో దైవకృపను అనుగ్రహించాడనే బలమైన కారణార్థక లేదా సంస్కారపరమైన భావం
  rationale: ברך అధికారిక ప్రజా సందర్భంలో ఆశీర్వచనం పలకడాన్ని సూచించగలదు. వచనం చెప్పేదానికంటే అధికమైన వేదాంత ప్రక్రియను అనువాదంలో చేర్చకుండా ‘ఆశీర్వదిస్తూ’ అనే మూల పదార్థాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హెబ్రీ వాక్యక్రమాన్ని యాంత్రికంగా అనుకరించకుండా చర్యల అనుసంధానాన్ని తెలుగులో స్పష్టంగా చేశాం; పాదసూచిక గుర్తులు రెండూ ప్రధాన పాఠ్యంలో ఉన్నాయి.
