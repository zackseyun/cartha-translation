revisions:
- from: భూమి మీద ఉన్న ప్రజలందరూ యెహోవాయే దేవుడు, మరొకడు లేడు అని తెలుసుకునేలా.
  to: భూమిలోని ప్రజలందరూ యెహోవా, ఆయనే దేవుడు; మరొక దేవుడు లేడు అని తెలుసుకునేలా.
