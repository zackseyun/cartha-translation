  text: לְמַ֗עַן דַּ֚עַת כָּל עַמֵּ֣י הָ/אָ֔רֶץ כִּ֥י יְהוָ֖ה ה֣וּא הָ/אֱלֹהִ֑ים אֵ֖ין עֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/060.yaml
  text: so that all the peoples of the earth may know that the LORD, he is God; there is no other.
translation:
  language: te
  text: భూమిలోని ప్రజలందరూ యెహోవా, ఆయనే దేవుడు; మరొక దేవుడు లేడు అని తెలుసుకునేలా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָל עַמֵּי הָאָרֶץ
  choice: భూమి మీద ఉన్న ప్రజలందరూ
  rationale: ‘భూమిలోని సమస్త ప్రజలు’ అనే మూలార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ మూలంలోని దేవుని ప్రత్యేక నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన రూపంలో ఉంచుతుంది.
- source_word: הוּא הָאֱלֹהִים
  choice: యెహోవాయే దేవుడు
  rationale: הוּא ఇచ్చే నొక్కిచెప్పే భావాన్ని తెలుగు ‘-యే’ ద్వారా సహజంగా నిలుపుతుంది.
- source_word: אֵין עוֹד
  choice: మరొకడు లేడు
  rationale: ‘ఇంకెవరూ/మరొకరు లేరు’ అనే సంక్షిప్త, సంపూర్ణ నిరాకరణను నిలుపుతూ మూలంలో లేని ‘దేవుడు’ పదాన్ని మళ్లీ చేర్చదు.
theological_decisions:
- issue: యెహోవా మాత్రమే దేవుడు అనే ఏకైకత్వ ప్రకటన
  choice: యెహోవాయే దేవుడు, మరొకడు లేడు
  alternative: యెహోవా దేవుడు; మరొక దేవుడు లేడు
  rationale: మూలంలోని הוּא అనే ఉద్ఘాటనను ‘-యే’తో స్పష్టంగా చూపుతూ, אֵין עוֹד యొక్క తెరచిన కానీ సందర్భపరంగా స్పష్టమైన రూపాన్ని ‘మరొకడు లేడు’గా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గంభీరంగా ఉండే ఉద్దేశ్యవాచక వాక్య నిర్మాణం. మూలవాక్యం ముందరి ప్రార్థనపై ఆధారపడే ఉద్దేశ్య ఉపవాక్యం కావడం వల్ల చివర ‘తెలుసుకునేలా’ వాడబడింది.
