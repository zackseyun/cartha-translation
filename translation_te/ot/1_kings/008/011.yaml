reference: 1 Kings 8:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹֽא יָכְל֧וּ הַ/כֹּהֲנִ֛ים לַ/עֲמֹ֥ד לְ/שָׁרֵ֖ת מִ/פְּנֵ֥י הֶֽ/עָנָ֑ן כִּי מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֥ית יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/011.yaml
  text: and the priests were not able to stand to minister because of the cloud[b][a], for the glory of Yahweh filled the house of Yahweh.
translation:
  language: te
  text: మేఘం కారణంగా యాజకులు సేవ చేయడానికి నిలబడలేకపోయారు[a]. ఎందుకంటే యాహ్వే మహిమ యాహ్వే మందిరాన్ని[b] నింపింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సేవ చేయడానికి నిలిచి ఉండలేకపోయారు.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థం, “యాహ్వే ఇంటిని”; అంటే దేవాలయాన్ని.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: లేకపోయారు
  rationale: సామర్థ్యం లేకపోవడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: ఆలయ సేవకులైన priestలను సూచించే ప్రామాణిక తెలుగు పదం.
- source_word: לַעֲמֹד
  choice: నిలబడడానికి
  rationale: మూలంలోని ‘నిలుచుట’ అనే ప్రత్యక్ష భావాన్ని నిలుపుతుంది.
- source_word: לְשָׁרֵת
  choice: సేవ చేయడానికి
  rationale: యాజక సంబంధమైన అధికారిక సేవను స్పష్టంగా, సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: מִפְּנֵי הֶעָנָן
  choice: మేఘం కారణంగా
  rationale: హీబ్రూ ప్రయోగంలోని కారణార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి వివరణాత్మక కారణాన్ని స్పష్టంగా కలుపుతుంది.
- source_word: מָלֵא
  choice: నింపింది
  rationale: పూర్తయిన క్రియను సరళ భూతకాల రూపంలో తెలియజేస్తుంది.
- source_word: כְבוֹד יְהוָה
  choice: యాహ్వే మహిమ
  rationale: ‘మహిమ’ అనే దైవ ప్రత్యక్షతకు సంబంధించిన బలమైన రూపకాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే మందిరాన్ని
  rationale: అక్షరార్థం ‘యాహ్వే ఇల్లు’; సందర్భంలో ఇది దేవాలయాన్ని సూచిస్తుంది. ‘మందిరం’ సహజమైనదిగా ఉండి ఆ సూచనను స్పష్టంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగు లిప్యంతరీకరణలో నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה దైవ నామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: హీబ్రూ మూలంలోని వ్యక్తిగత దైవ నామాన్ని ప్రత్యక్షంగా నిలుపుతూ, దానిని బిరుదుగా మార్చదు.
- issue: כְבוֹד יְהוָה భావం
  choice: యాహ్వే మహిమ
  alternative: యాహ్వే సన్నిధి
  rationale: ‘మహిమ’ అనే మూల రూపకాన్నీ దాని దైవశాస్త్రీయ ఉద్వేగాన్నీ నిలుపుతుంది; దానిని ‘సన్నిధి’గా వ్యాఖ్యానించి పరిమితం చేయదు.
- issue: בֵּית יְהוָה సూచన
  choice: యాహ్వే మందిరం
  alternative: యాహ్వే ఇల్లు
  rationale: సందర్భంలో సొలొమోను నిర్మించిన దేవాలయమే ఉద్దేశం. ప్రధాన పాఠ్యంలో సహజమైన ‘మందిరం’ను వాడి, అక్షరార్థాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. మూలంలోని కారణ సంబంధం, యాజక సేవ, మేఘం, దైవ మహిమ చిత్రణలను నిలిపింది.
