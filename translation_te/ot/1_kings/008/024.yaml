source:
  edition: WLC
  text: אֲשֶׁ֣ר שָׁמַ֗רְתָּ לְ/עַבְדְּ/ךָ֙ דָּוִ֣ד אָבִ֔/י אֵ֥ת אֲשֶׁר דִּבַּ֖רְתָּ ל֑/וֹ וַ/תְּדַבֵּ֥ר בְּ/פִ֛י/ךָ וּ/בְ/יָדְ/ךָ֥ מִלֵּ֖אתָ כַּ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/024.yaml
  text: who have kept for your servant David my father what you spoke to him[a]; you spoke with your mouth, and with your hand you have fulfilled it[b], as it is this day.
translation:
  language: te
  text: నీవు నీ సేవకుడైన నా తండ్రి దావీదుకు[a] చెప్పిన మాటను నిలబెట్టావు. నీవు నీ నోటితో పలికావు, నీ చేతితో దాన్ని నెరవేర్చావు[b]—నేడు ఉన్నట్టుగా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ సేవకుడైన నా తండ్రి దావీదు కోసం.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, ‘నీవు నీ నోటితో పలికావు, నీ చేతితో నెరవేర్చావు.’ దేవుడు పలికినదాన్నే తానే కార్యరూపంలో నెరవేర్చాడనే స్పష్టమైన చిత్రణ ఇది.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַרְתָּ
  choice: నిలబెట్టావు
  rationale: ఇక్కడ שׁמר దేవుడు దావీదుకు పలికిన మాటను నమ్మకంగా నిలబెట్టడాన్ని సూచిస్తుంది. తరువాతి מִלֵּאתָకు వాడిన ‘నెరవేర్చావు’తో ఉన్న క్రియాభేదాన్ని ఇది కాపాడుతుంది.
- source_word: לְעַבְדְּךָ
  choice: నీ సేవకుడైన ... అతని కోసం
  rationale: לְ అనే ఉపసర్గ ఇక్కడ ‘కోసం’ లేదా ‘తో/కు’ అనే భావాలను అనుమతిస్తుంది. ప్రధాన పాఠంలో వాగ్దానం దావీదు పక్షంగా నిలబెట్టబడిందనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేశాము; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాము.
- source_word: דָּוִד אָבִי
  choice: నా తండ్రి దావీదు
  rationale: హీబ్రూ పదక్రమం ‘దావీదు, నా తండ్రి’ అయినా, ఆధునిక ప్రామాణిక తెలుగులో ‘నా తండ్రి దావీదు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: అతనితో చెప్పినదాన్ని
  rationale: ‘వాగ్దానం చేసినదాన్ని’ అని వివరణాత్మకంగా మార్చకుండా, דִּבַּרְתָּ యొక్క మాటలాడే భావాన్ని నిలిపాము. తద్వారా తరువాత వచ్చే ‘నీ నోటితో చెప్పి’ అనే పునరుక్తి, ఉద్దేశపూర్వక బలప్రయోగం నిలుస్తాయి.
- source_word: וַתְּדַבֵּר בְּפִיךָ
  choice: నీవు నీ నోటితో చెప్పి
  rationale: దైవిక వాక్కు మరియు కార్యాన్ని ఎదురెదురుగా ఉంచే హీబ్రూ రూపకాన్ని యథాతథంగా కాపాడుతుంది.
- source_word: וּבְיָדְךָ מִלֵּאתָ
  choice: నీ చేతితో దాన్ని నెరవేర్చావు
  rationale: מלא ఇక్కడ పలికిన మాటను పూర్తిగా కార్యరూపంలోకి తేవడాన్ని సూచిస్తుంది. ‘నీ చేతితో’ అనే మానవరూపక భాషను తొలగించలేదు.
- source_word: כַּיּוֹם הַזֶּה
  choice: ఈ రోజు ఉన్నట్టుగానే
  rationale: ప్రస్తుతం ప్రత్యక్షంగా కనిపిస్తున్న నెరవేర్పును సూచించే సాధారణ హీబ్రూ నుడికారాన్ని సహజ తెలుగులో దగ్గరగా అందిస్తుంది.
theological_decisions:
- issue: దేవుని ‘నోరు’, ‘చేయి’ అనే మానవరూపక భాష
  choice: ప్రధాన పాఠంలో ‘నీ నోటితో’, ‘నీ చేతితో’ అనే స్పష్టమైన రూపకాలను నిలిపాము.
  alternative: ‘నీవు వాగ్దానం చేసి దాన్ని కార్యసిద్ధి చేశావు’ అని భావానువాదం చేయడం.
  rationale: మూలపాఠం దేవుని పలుకును, కార్యాన్ని ఉద్దేశపూర్వకంగా శరీరాంగాల రూపకాల ద్వారా జతచేస్తుంది. వాటిని నిలపడం వాక్యంలోని కవితాత్మక బలాన్ని, దేవుడు పలికినదాన్ని తానే కార్యరూపం దాల్చించాడనే ధార్మిక ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాము. ‘నిలబెట్టావు’ మరియు ‘నెరవేర్చావు’ అనే వేర్వేరు క్రియలతో మూలంలోని שׁמר / מלא భేదాన్ని కాపాడాము. వాక్యంలోని ‘నోరు—చేయి’ సమాంతర రూపకాన్ని నిలిపాము.
