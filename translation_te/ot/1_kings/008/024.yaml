revisions:
- from: నీవు నీ సేవకుడైన నా తండ్రి దావీదుతో చెప్పినదాన్ని అతని కోసం[a] నిలబెట్టావు. నీవు నీ నోటితో చెప్పి, నీ చేతితో దాన్ని నెరవేర్చావు[b]—ఈ రోజు ఉన్నట్టుగానే.
  to: నీవు నీ సేవకుడైన నా తండ్రి దావీదుకు[a] చెప్పిన మాటను నిలబెట్టావు. నీవు నీ నోటితో పలికావు, నీ చేతితో దాన్ని నెరవేర్చావు[b]—నేడు ఉన్నట్టుగా.
  rationale: The revision attaches the Hebrew לְ relation naturally to David through ‘దావీదుకు,’ while the following ‘చెప్పిన మాటను’ faithfully renders what God spoke to him. It retains the lexical distinction between keeping/maintaining a word (‘నిలబెట్టావు’) and bringing it to completion (‘నెరవేర్చావు’). The two coordinate clauses retain the source's emphatic mouth-and-hand imagery and its speech/action parallelism. Footnote anchors remain correctly attached and their notes reflect genuine lexical and idiomatic matters.
