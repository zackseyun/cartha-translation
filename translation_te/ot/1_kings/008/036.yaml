  to: అప్పుడు నీవు పరలోకంలో విని[a], నీ సేవకులైన నీ ప్రజ ఇశ్రాయేలు పాపాన్ని క్షమించు. వారు నడవవలసిన మంచి మార్గాన్ని నీవు వారికి బోధించినప్పుడు[b], నీ ప్రజలకు స్వాస్థ్యంగా నీవు ఇచ్చిన నీ దేశం మీద వర్షం కురిపించు.
