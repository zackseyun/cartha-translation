  yaml_path: translation/ot/1_kings/008/036.yaml
  text: then may you hear in heaven and forgive the sin of your servants[a], your people Israel, when you teach them the good way in which they should walk. And may you give rain on your land[b], which you have given to your people as an inheritance.
translation:
  language: te
  text: అప్పుడు నీవు పరలోకంలో విని[a], నీ సేవకులైన నీ ప్రజ ఇశ్రాయేలు పాపాన్ని క్షమించు. వారు నడవవలసిన మంచి మార్గాన్ని నీవు వారికి బోధించినప్పుడు[b], నీ ప్రజలకు స్వాస్థ్యంగా నీవు ఇచ్చిన నీ దేశం మీద వర్షం కురిపించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరలోకం నుండి విని.” హీబ్రూ పదబంధం అక్షరార్థంగా “ఆకాశం/ఆకాశాలను విని” అని ఉంది; సందర్భానుసారం “లో” లేదా “నుండి” అనే భావాన్ని చేర్చి అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారు నడవవలసిన మంచి మార్గాన్ని నీవు వారికి బోధించినందున.” హీబ్రూ సంధిపదానికి కాలార్థంతో పాటు కారణార్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: పరలోకంలో విని
  rationale: హీబ్రూ పదబంధం అక్షరార్థంగా ‘ఆకాశం/ఆకాశాలను విను’ అని ఉన్నా, ప్రార్థనా సందర్భంలో స్థలార్థక విభక్తిని భావింపజేస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘పరలోకంలో విని’ అని అనువదించి, ‘పరలోకం నుండి విని’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: పాపాన్ని క్షమించు
  rationale: ఇక్కడ חַטָּאת పాపబలి గురించి కాదు; క్షమాపణ కోరబడుతున్న అపరాధాన్ని సూచిస్తుంది.
- source_word: עֲבָדֶיךָ וְעַמְּךָ יִשְׂרָאֵל
  choice: నీ సేవకులైన నీ ప్రజ ఇశ్రాయేలు
  rationale: ‘సేవకులు’ మరియు ‘నీ ప్రజ ఇశ్రాయేలు’ ఒకే సమూహాన్ని సూచించే అన్వయాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי תוֹרֵם
  choice: నీవు వారికి ... బోధించినప్పుడు
  rationale: כִּי కి సందర్భానుసారం ‘ఎప్పుడు’ లేదా ‘ఎందుకంటే’ అనే భావాలు రావచ్చు. ప్రార్థనలోని కార్యప్రవాహానికి ‘బోధించినప్పుడు’ సహజంగా సరిపోతుంది; కారణార్థక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: הַדֶּרֶךְ הַטּוֹבָה אֲשֶׁר יֵלְכוּ בָהּ
  choice: వారు నడవవలసిన మంచి మార్గం
  rationale: దేవునికి అనుకూలమైన జీవన విధానాన్ని సూచించే ‘మార్గంలో నడవడం’ అనే హీబ్రూ రూపకాన్ని నిలుపుతుంది.
- source_word: וְנָתַתָּה מָטָר
  choice: వర్షం కురిపించు
  rationale: అక్షరార్థమైన ‘వర్షం ఇవ్వు’ కంటే ‘వర్షం కురిపించు’ ఆధునిక తెలుగులో సహజం; అయినా దేవుడే వర్షాన్ని అనుగ్రహిస్తున్నాడనే భావం యథాతథంగా ఉంటుంది.
- source_word: עַל אַרְצְךָ אֲשֶׁר נָתַתָּה לְעַמְּךָ לְנַחֲלָה
  choice: నీ దేశం మీద—నీ ప్రజలకు స్వాస్థ్యంగా నీవు ఇచ్చిన దేశం మీద—
  rationale: దేశం దేవునిదే అనే ప్రత్యయాన్ని, అదే దేశాన్ని ఆయన తన ప్రజలకు స్వాస్థ్యంగా ఇచ్చాడనే వాక్యాన్ని రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: దేశంపై దేవుని యాజమాన్యం మరియు ఇశ్రాయేలుకు అది స్వాస్థ్యంగా ఇవ్వబడటం
  choice: నీ దేశం ... నీ ప్రజలకు స్వాస్థ్యంగా నీవు ఇచ్చిన దేశం
  alternative: నీ ప్రజలకు స్వాస్థ్యంగా నీవు ఇచ్చిన దేశం
  rationale: హీబ్రూ మూలంలో ‘నీ దేశం’ అనే దేవుని యాజమాన్య సూచనతోపాటు, దాన్ని ప్రజలకు స్వాస్థ్యంగా ఇచ్చిన సంగతి కూడా స్పష్టంగా ఉంది. రెండింటినీ ఉంచడం మూలపాఠంలోని theological tensionను కాపాడుతుంది.
- issue: כִּי యొక్క కాలార్థక లేదా కారణార్థక సంబంధం
  choice: బోధించినప్పుడు
  alternative: ఎందుకంటే నీవు వారికి ... బోధిస్తావు
  rationale: సందర్భంలో కాలార్థక పఠనం సహజమైనప్పటికీ, హీబ్రూ సంధిపదం కారణార్థాన్నీ అనుమతిస్తుంది; అందువల్ల ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, దేవునితో ఏకవచన ప్రత్యక్ష సంబోధనను కొనసాగిస్తూ గంభీరమైన ప్రార్థనా శైలిని ఉపయోగించాం. పాతకాలపు ‘మందు’, ‘దయచేయుము’ వంటి రూపాలను నివారించాం. ‘మార్గంలో నడవడం’ అనే మూల రూపకాన్ని నిలిపి, వర్షం విషయంలో సహజమైన తెలుగు ప్రయోగమైన ‘కురిపించు’ను ఎంచుకున్నాం.
