  source_fidelity: 'The translation preserves the conditional progression of the Hebrew: reflection in exile, turning/returning, supplication to God in the captors’ land, and the threefold confession. The open-ended final conditional appropriately reflects that the sentence continues into the following verse.'
  naturalness: Modern standard Telugu is used naturally and the prayerful register is appropriate. “తమ హృదయంలో ఆలోచించుకొని” is understandable as an idiomatic contextual rendering of bringing something back to one’s heart/mind.
  terminology: “తిరిగి” preserves the breadth of וְשָׁבוּ without imposing the more doctrinally specific “పశ్చాత్తాపపడు.” The three confessional expressions retain both the cumulative force and meaningful distinctions of the Hebrew.
