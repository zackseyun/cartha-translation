id: 1KI.8.47
reference: 1 Kings 8:47
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הֵשִׁ֨יבוּ֙ אֶל לִבָּ֔/ם בָּ/אָ֖רֶץ אֲשֶׁ֣ר נִשְׁבּוּ שָׁ֑ם וְ/שָׁ֣בוּ וְ/הִֽתְחַנְּנ֣וּ אֵלֶ֗י/ךָ בְּ/אֶ֤רֶץ שֹֽׁבֵי/הֶם֙ לֵ/אמֹ֔ר חָטָ֥אנוּ וְ/הֶעֱוִ֖ינוּ רָשָֽׁעְנוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/047.yaml
  text: and if they come to their senses in the land where they were taken captive, and return and plead with you in the land of those who took them captive, saying, ‘We have sinned and acted perversely; we have acted wickedly,’
translation:
  language: te
  text: తాము చెరగా తీసుకుపోబడిన దేశంలో వారు తమ హృదయంలో ఆలోచించుకొని, తిరిగి, తమను చెరగా తీసుకుపోయినవారి దేశంలో నీకు మొరపెట్టి, ‘మేము పాపం చేశాం; వక్రంగా ప్రవర్తించాం; దుష్టంగా నడుచుకున్నాం’ అని వేడుకుంటే,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵשִׁיבוּ אֶל־לִבָּם
  choice: తమ హృదయంలో ఆలోచించుకొని
  rationale: అక్షరార్థంగా ‘తమ హృదయానికి తిరిగి తెచ్చుకొని’; సందర్భంలో జరిగినదాన్ని మనసులో గ్రహించి ఆలోచించడాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో భావాన్ని నిలిపింది.
- source_word: וְשָׁבוּ
  choice: తిరిగి
  rationale: మూలంలోని సాధారణ ‘తిరుగు’ భావాన్ని అలాగే ఉంచి, ‘పశ్చాత్తాపపడు’ అనే వ్యాఖ్యానాత్మక ధార్మిక పదాన్ని చేర్చలేదు.
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: నీకు మొరపెట్టి … వేడుకుంటే
  rationale: హిత్పయేల్ రూపం కృప కోసం వినయంగా వేడుకోవడాన్ని సూచిస్తుంది; తెలుగు వాక్య నిర్మాణంలో ‘మొరపెట్టి…వేడుకుంటే’ సహజంగా ఉంటుంది.
- source_word: חָטָאנוּ
  choice: మేము పాపం చేశాం
  rationale: ‘లక్ష్యాన్ని తప్పడం/పాపం చేయడం’ అనే నైతిక-ధార్మిక భావానికి సాధారణ తెలుగు సమానం.
- source_word: וְהֶעֱוִינוּ
  choice: వక్రంగా ప్రవర్తించాం
  rationale: עוה పదంలోని వక్రీకరణ, తప్పుదారి ప్రవర్తన భావాన్ని ప్రతిబింబిస్తుంది; తదుపరి ‘దుష్టంగా’ అనే పదంతో భేదాన్ని నిలుపుతుంది.
- source_word: רָשָׁעְנוּ
  choice: దుష్టంగా నడుచుకున్నాం
  rationale: దోషపూరితమైన లేదా దుష్టమైన ప్రవర్తనను సూచించే క్రియాభావాన్ని సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: וְשָׁבוּ ను పశ్చాత్తాపంగా వ్యాఖ్యానించాలా
  choice: తిరిగి
  alternative: పశ్చాత్తాపపడి
  rationale: మూలపదం విస్తృతమైన ‘తిరుగు’ భావాన్ని కలిగి ఉంది. సందర్భం పాపాన్ని ఒప్పుకోవడాన్ని సూచించినా, అనువాదం ఆ భావాన్ని ఒక నిర్దిష్ట ధార్మిక సాంకేతిక పదానికి పరిమితం చేయదు.
- issue: మూడు పాప-ఒప్పుకోలు పదాల భేదం
  choice: పాపం చేశాం; వక్రంగా ప్రవర్తించాం; దుష్టంగా నడుచుకున్నాం
  alternative: మేము పాపులమై చెడుగా ప్రవర్తించాం
  rationale: חטא, עוה, רשע అనే మూడు వేర్వేరు మూలపదాల సారూప్యతతోపాటు వాటి స్వల్ప భావభేదాన్ని కూడా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనా సందర్భానికి తగిన గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని షరతు వాక్యం తరువాతి వచనాల్లో కొనసాగుతున్నందున చివర ‘వేడుకుంటే’తో తెరిచి ఉంచబడింది.
