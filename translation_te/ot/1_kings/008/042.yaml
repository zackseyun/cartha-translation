id: 1KI.8.42
reference: 1 Kings 8:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֤י יִשְׁמְעוּ/ן֙ אֶת שִׁמְ/ךָ֣ הַ/גָּד֔וֹל וְ/אֶת יָֽדְ/ךָ֙ הַֽ/חֲזָקָ֔ה וּֽ/זְרֹעֲ/ךָ֖ הַ/נְּטוּיָ֑ה וּ/בָ֥א וְ/הִתְפַּלֵּ֖ל אֶל הַ/בַּ֥יִת הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/042.yaml
  text: for they will hear of your great name[a], and of your mighty hand and your outstretched arm, and he will come and pray toward this house—
translation:
  language: te
  text: ఎందుకంటే వారు నీ గొప్ప పేరు గురించి, నీ బలమైన చెయ్యి గురించి, చాచిన నీ బాహువు గురించి వింటారు; అతడు వచ్చి ఈ మందిరం వైపు ప్రార్థిస్తాడు—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలో చెప్పిన విదేశీయుని రాకకు, ప్రార్థనకు కారణాన్ని వివరిస్తుంది.
- source_word: יִשְׁמְעוּן
  choice: వారు ... వింటారు
  rationale: అసంపూర్ణ క్రియ యొక్క భవిష్యత్తు/సాధారణ భావాన్ని, విదేశీయులను ఒక వర్గంగా సూచించే బహువచనాన్ని నిలుపుతుంది.
- source_word: אֶת שִׁמְךָ הַגָּדוֹל
  choice: నీ గొప్ప పేరు గురించి
  rationale: שמע క్రియతో సందర్భానుసారంగా ‘గురించి వినడం’ సహజం; ‘పేరు’ అనే మూలరూపం దేవుని ఖ్యాతి భావాన్ని కూడా మోస్తుంది.
- source_word: יָדְךָ הַחֲזָקָה
  choice: నీ బలమైన చెయ్యి
  rationale: దేవుని శక్తిని తెలిపే మానవరూప చిత్రణను అమూర్తంగా మార్చకుండా నిలుపుతుంది.
- source_word: זְרֹעֲךָ הַנְּטוּיָה
  choice: చాపబడిన నీ బాహువు
  rationale: దేవుని కార్యశక్తిని సూచించే స్పష్టమైన హీబ్రూ చిత్రణను గౌరవంగా, సహజంగా నిలుపుతుంది.
- source_word: וּבָא
  choice: అప్పుడు అతడు వచ్చి
  rationale: ముందటి బహువచనం నుంచి ప్రతినిధి విదేశీయుణ్ణి సూచించే ఏకవచనానికి మూలపాఠంలో వచ్చిన మార్పును కాపాడుతుంది.
- source_word: וְהִתְפַּלֵּל
  choice: ప్రార్థిస్తాడు
  rationale: וּבָאతో సమన్వయమైన ఏకవచన క్రియగా సహజమైన తెలుగులో అందిస్తుంది.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: ఈ మందిరం వైపు తిరిగి
  rationale: ఆలయాన్ని దిశగా చేసుకొని ప్రార్థించే భావాన్ని తెలియజేస్తుంది; భవనంలోకి ప్రవేశించడమే భావమని సూచించదు.
theological_decisions:
- issue: దేవుని శక్తికి సంబంధించిన మానవరూప భాష
  choice: ‘చెయ్యి’, ‘బాహువు’ అనే స్పష్టమైన రూపకాలను ప్రధాన పాఠంలో నిలుపడం
  alternative: ‘శక్తి’, ‘బలం’ వంటి అమూర్త పదాలతో వివరణాత్మకంగా అనువదించడం
  rationale: హీబ్రూ పాఠంలోని సాహిత్యపరమైన, వేదాంతపరమైన చిత్రణను వ్యాఖ్యానంతో భర్తీ చేయకుండా కాపాడుతుంది.
- issue: బహువచన కర్త నుంచి ఏకవచన కర్తకు మార్పు
  choice: ‘వారు ... వింటారు; అప్పుడు అతడు వచ్చి ... ప్రార్థిస్తాడు’ అని మార్పును నిలుపడం
  alternative: అంతటినీ బహువచనంగా సమన్వయించడం
  rationale: విదేశీయులను సమూహంగా పేర్కొని, తరువాత వారిలో ప్రతినిధి వ్యక్తిపై దృష్టి పెట్టే మూలపాఠంలోని ఉద్వేగాన్ని పారదర్శకంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘మందిరం’ సందర్భంలోని దేవాలయ భావాన్ని స్పష్టంగా ఇస్తుంది; ‘బలమైన చెయ్యి’, ‘చాపబడిన బాహువు’ మూలంలోని కవితాత్మక మానవరూప చిత్రణను నిలుపుతాయి.
