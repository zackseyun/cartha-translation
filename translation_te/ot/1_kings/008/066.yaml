  text: בַּ/יּ֤וֹם הַ/שְּׁמִינִי֙ שִׁלַּ֣ח אֶת הָ/עָ֔ם וַֽ/יְבָרֲכ֖וּ אֶת הַ/מֶּ֑לֶךְ וַ/יֵּלְכ֣וּ לְ/אָהֳלֵי/הֶ֗ם שְׂמֵחִים֙ וְ/ט֣וֹבֵי לֵ֔ב עַ֣ל כָּל הַ/טּוֹבָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/דָוִ֣ד עַבְדּ֔/וֹ וּ/לְ/יִשְׂרָאֵ֖ל עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/066.yaml
  text: On the eighth day he sent the people away[a], and they blessed the king and went to their tents, rejoicing and glad of heart because of all the good that Yahweh had done for David his servant and for Israel his people.
translation:
  language: te
  text: ఎనిమిదవ రోజున అతడు ప్రజలను పంపించాడు. వారు రాజును ఆశీర్వదించి, యాహ్వే తన సేవకుడైన దావీదుకూ తన ప్రజలైన ఇశ్రాయేలుకూ చేసిన సమస్త మేలును బట్టి ఆనందిస్తూ, హృదయాల్లో సంతోషం నిండినవారై తమ గుడారాలకు[a] వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమ ఇళ్లకు’; అక్షరార్థంగా, ‘తమ గుడారాలకు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: ఎనిమిదవ రోజున
  rationale: మూలంలోని కాలసూచనను నేరుగా అనువదించింది; సందర్భం సూచించే ‘పండుగ’ అనే మాట మూల వాక్యంలో లేదు కాబట్టి చేర్చలేదు.
- source_word: שִׁלַּח אֶת הָעָם
  choice: ప్రజలను పంపివేశాడు
  rationale: పియేల్ రూపం ఇక్కడ ప్రజలకు వెళ్లడానికి అనుమతించి వీడ్కోలు చెప్పడాన్ని సూచిస్తుంది; తెలుగు వాడుకలో సహజంగా ఉండేలా కారణార్థాన్ని నిలిపింది.
- source_word: וַיְבָרֲכוּ אֶת הַמֶּלֶךְ
  choice: వారు రాజును ఆశీర్వదించి
  rationale: ברך అనే పదానికి ప్రాథమిక అర్థమైన ‘ఆశీర్వదించు’ను నిలిపింది; సందర్భంలో వీడ్కోలు శుభాకాంక్ష భావం ఉండవచ్చునన్నా దానికే పరిమితం చేయలేదు.
- source_word: לְאָהֳלֵיהֶם
  choice: తమ గుడారాలకు
  rationale: హీబ్రూ పదబంధంలోని ప్రత్యక్ష రూపకాన్ని నిలిపింది; ‘తమ ఇళ్లకు’ అనే సహజార్థాన్ని పాదసూచికలో ఇచ్చింది.
- source_word: שְׂמֵחִים וְטוֹבֵי לֵב
  choice: ఆనందిస్తూ, హృదయంలో సంతోషంతో
  rationale: బాహ్యంగా వ్యక్తమయ్యే ఆనందాన్నీ, అంతరంగ సంతోషాన్నీ సూచించే రెండు సమాంతర భావాలను సహజమైన ఆధునిక తెలుగులో వేరు వేరుగా నిలిపింది.
- source_word: עַל כָּל הַטּוֹבָה
  choice: చేసిన మేలంతటిని బట్టి
  rationale: עַל ఇక్కడ ఆనందానికి కారణాన్ని సూచిస్తుంది; הַטּוֹבָה యొక్క విస్తృతమైన మేలు/ఉపకారం భావాన్ని నిలిపింది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే నామరూపంతో ఇచ్చింది.
- source_word: לְדָוִד עַבְדּוֹ
  choice: తన సేవకుడైన దావీదుకు
  rationale: రాజసంబంధమైన, నిబంధనాత్మక సందర్భంలో עבד పదానికి తగిన ‘సేవకుడు’ అనే అర్థాన్ని ఉపయోగించింది.
- source_word: וּלְיִשְׂרָאֵל עַמּוֹ
  choice: తన ప్రజలైన ఇశ్రాయేలుకు
  rationale: ఇశ్రాయేలు యెహోవా ప్రజలని తెలిపే సమానాధికరణ సంబంధాన్ని స్పష్టమైన తెలుగులో నిలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ మూలంలో వ్యక్తిగత దైవ నామమే ఉంది. బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా నామరూపాన్ని నిలిపి, ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకుంది; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు సులభంగా ఉండే వాక్య నిర్మాణం. హీబ్రూ భావసమాంతరతను నిలుపుతూ అతిగా అక్షరానువాదంగా వినిపించకుండా రూపొందించబడింది.
