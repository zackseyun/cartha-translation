translation:
  language: te
  text: అప్పుడు నీవు ఆకాశంలో[a] వారి ప్రార్థనను, వారి విన్నపాన్ని విని, వారికి న్యాయం చేయి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘ఆకాశాలు.’ ఈ ప్రార్థనా సూత్రంలో స్థలార్థంగా ‘ఆకాశంలో’ అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వారి వ్యాజ్యాన్ని సమర్థించు,’ ‘వారి హక్కును నిలబెట్టు,’ లేదా ‘వారి పక్షాన న్యాయం చేయి.’ హీబ్రూలో అక్షరార్థంగా ‘వారి న్యాయాన్ని/తీర్పును చేయు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: అప్పుడు నీవు … విని
  rationale: ఇది దేవునికి చేసే ప్రార్థనలోని విన్నపం. ముందున్న షరతులకు కొనసాగింపుగా ఉన్న וְ־ భావాన్ని సహజమైన తెలుగులో ‘అప్పుడు’ తెలియజేస్తుంది.
- source_word: הַשָּׁמַיִם
  choice: ఆకాశంలో
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఆకాశాలు’ అని ఉన్నా, ఈ ప్రార్థనా సూత్రంలో అది దేవుడు వినే స్థలాన్ని సూచిస్తుంది. మూలంలో ‘నుండి’ అనే విభక్తి లేకపోవడంతో ‘ఆకాశం నుండి’ కంటే ‘ఆకాశంలో’ మూలరూపానికి దగ్గరగా ఉంటుంది.
- source_word: תְּפִלָּתָם
  choice: వారి ప్రార్థనను
  rationale: תְּפִלָּה అనేది ప్రార్థనకు సాధారణ పదం; ఏకవచన రూపాన్ని సమూహార్థకంగా సహజంగా అనువదించాం.
- source_word: תְּחִנָּתָם
  choice: వారి విన్నపాన్ని
  rationale: תְּחִנָּה అనుగ్రహం లేదా కనికరం కోరే మనవిని సూచిస్తుంది. ‘విన్నపం’ ఆధునిక తెలుగులో సహజంగా ఉండి, సాధారణమైన ‘ప్రార్థన’తో ఉన్న భావభేదాన్ని నిలుపుతుంది.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: వారి పక్షంగా న్యాయం జరిగించు
  rationale: అక్షరార్థం ‘వారి తీర్పు/న్యాయాన్ని చేయు.’ ఈ న్యాయపరమైన నానుడి వారి విషయంలో న్యాయం చేయడం లేదా వారి పక్షాన్ని సమర్థించడం అనే భావాన్ని ఇస్తుంది; ఎంచుకున్న రూపం రెండింటినీ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవునికి చేసే విన్నపంలోని న్యాయపరమైన నానుడి
  choice: వారి పక్షంగా న్యాయం జరిగించు
  alternative: వారి వ్యాజ్యాన్ని సమర్థించు; వారికి న్యాయం చేయు; వారి హక్కును నిలబెట్టు
  rationale: עשה משפט అనే హీబ్రూ నానుడి ఒకరి పక్షంగా న్యాయం అమలు చేయడాన్ని సూచిస్తుంది. ఈ అనువాదం దేవుని న్యాయనిర్ణయ భావాన్ని నిలుపుతూ, సందర్భం చెప్పనంత సన్నని సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ప్రార్థనా శైలి వాడబడింది. ‘ఆలకించు,’ ‘ప్రార్థనావిన్నపం’ వంటి అధిక గ్రాంథిక పదాలను నివారించి, ‘ప్రార్థన,’ ‘విన్నపం,’ ‘న్యాయం జరిగించు’ వంటి సహజ పదాలను ఎంచుకున్నాం.
