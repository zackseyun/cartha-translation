id: 1KI.8.63
reference: 1 Kings 8:63
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּזְבַּ֣ח שְׁלֹמֹ֗ה אֵ֣ת זֶ֣בַח הַ/שְּׁלָמִים֮ אֲשֶׁ֣ר זָבַ֣ח לַ/יהוָה֒ בָּקָ֗ר עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ אֶ֔לֶף וְ/צֹ֕אן מֵאָ֥ה וְ/עֶשְׂרִ֖ים אָ֑לֶף וַֽ/יַּחְנְכוּ֙ אֶת בֵּ֣ית יְהוָ֔ה הַ/מֶּ֖לֶךְ וְ/כָל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/063.yaml
  text: 'And Solomon sacrificed the sacrifice of peace offerings that he sacrificed to Yahweh: twenty-two thousand cattle and one hundred twenty thousand sheep[b][a]. So the king and all the sons of Israel dedicated the house of Yahweh.'
translation:
  language: te
  text: సొలొమోను యాహ్వేకు సమాధాన బలులుగా[a] ఇరవై రెండు వేల గొడ్డు పశువులను, లక్షా ఇరవై వేల గొర్రెలను బలిగా అర్పించాడు. ఆ విధంగా రాజు, ఇశ్రాయేలు కుమారులందరూ[b] యాహ్వే మందిరాన్ని అంకితం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సహవాస బలులు” లేదా “క్షేమ బలులు.”
    reason: lexical_alternative
  - marker: b
    text: అంటే ఇశ్రాయేలీయులందరూ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: బలిగా అర్పించాడు
  rationale: బలిసంబంధ సందర్భంలో זבח సూచించే వధతో కూడిన ఆరాధనా అర్పణను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: సమాధాన బలులు
  rationale: שְׁלָמִים పదంలోని శాంతి, క్షేమం, సహవాసం అనే భావవిస్తృతిని పూర్తిగా ఒకే పదంలో బంధించకుండా, తెలుగులో గుర్తించదగిన ఆరాధనా పదాన్ని వాడి ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచింది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: హీబ్రూ దైవనామం יהוהను బిరుదుగా మార్చకుండా పేరుగానే లిప్యంతరీకరించింది.
- source_word: בָּקָר
  choice: పశువులు
  rationale: సందర్భంలో ఇది పెద్ద పశువుల సమూహాన్ని, ముఖ్యంగా గోవుల జాతిని సూచిస్తుంది; భారీ సంఖ్యతో సహజంగా సరిపడే తెలుగు సమూహపదం.
- source_word: צֹאן
  choice: గొర్రెలు
  rationale: צֹאן చిన్న మంద పశువులను, కొన్నిసార్లు గొర్రెలు-మేకలను కలిపి సూచించగలిగినా, ఈ సందర్భంలో సంప్రదాయబద్ధమైన స్పష్టమైన అనువాదంగా ‘గొర్రెలు’ ఎంచుకోబడింది.
- source_word: וַיַּחְנְכוּ
  choice: ప్రతిష్ఠించారు
  rationale: మందిరాన్ని పవిత్ర సేవకు అధికారికంగా అంకితం చేసి వినియోగంలోకి తెచ్చిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే మందిరం
  rationale: అక్షరార్థమైన ‘యాహ్వే ఇల్లు’ కంటే సందర్భార్థాన్ని స్పష్టంగా అందిస్తూ, దేవాలయాన్ని సూచించే గౌరవప్రదమైన ఆధునిక తెలుగు రూపాన్ని వాడింది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ రూపకల్పనను పారదర్శకంగా నిలుపుతుంది; ఇది సమస్త ఇశ్రాయేలీయులను సూచించే సామూహిక నామమని పాదసూచిక స్పష్టం చేస్తుంది.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని సాధారణ శాస్త్రీయ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- issue: בְּנֵי יִשְׂרָאֵל అనే ఒడంబడిక-జాతి సంజ్ఞ
  choice: ఇశ్రాయేలు కుమారులందరూ
  alternative: ఇశ్రాయేలీయులందరూ; ఇశ్రాయేలు ప్రజలందరూ
  rationale: మూలంలోని పుంలింగ రూపాన్ని నిలుపుతూ, అది కేవలం పురుషులను మాత్రమే కాక ఇశ్రాయేలు సమాజాన్ని సూచిస్తుందనే భావాన్ని పాదసూచికలో సంరక్షించింది.
- issue: שְׁלָמִים బలి స్వభావం
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు; క్షేమ బలులు
  rationale: ఈ బలిపదంలో శాంతి, క్షేమం, సహవాసం వంటి పరస్పర సంబంధిత భావాలు ఉన్నాయి. ప్రధాన పాఠం ఒక స్థిరమైన పదాన్ని వాడినా, ఇతర సముచిత భావాలను పాదసూచికలో ఉంచి అర్థాన్ని సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బహిరంగ పఠనానికి అనుకూలమైన గౌరవప్రదమైన శైలిని వాడింది. హీబ్రూలోని ‘బలిని బలిగా అర్పించాడు’ అనే పునరుక్తిని తెలుగులో సహజంగా సంక్షిప్తం చేసింది; అయితే బలి చర్య, బలి రకం, సంఖ్యలు అన్నీ స్పష్టంగా నిలిపింది. చివరి వాక్యంలో హీబ్రూ బహువచన కర్తలను అలాగే ఉంచి, వాక్యప్రవాహం కోసం ‘ఆ విధంగా’ అనే అనుసంధానాన్ని వాడింది.
