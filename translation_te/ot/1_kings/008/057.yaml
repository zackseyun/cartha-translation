id: 1KI.8.57
reference: 1 Kings 8:57
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ עִמָּ֔/נוּ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם אֲבֹתֵ֑י/נוּ אַל יַעַזְבֵ֖/נוּ וְ/אַֽל יִטְּשֵֽׁ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/057.yaml
  text: May Yahweh our God be with us[a], as he was with our fathers. May he not forsake us or abandon us.
translation:
  language: te
  text: మన దేవుడైన యహ్వే మన పితరులతో ఉన్నట్లే మనతో ఉండుగాక. ఆయన మనలను విడిచిపెట్టకుండుగాక, వదలకుండుగాక.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהִי
  choice: ఉండుగాక
  rationale: היה క్రియ యొక్క జస్సివ్ రూపం ప్రార్థనాత్మకమైన కోరికను వ్యక్తం చేస్తుంది; ఆధునిక గౌరవప్రదమైన తెలుగు ప్రార్థనా శైలిలో ‘ఉండుగాక’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’ ఉచ్చారణకు తగిన తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: אֱלֹהֵינוּ
  choice: మన దేవుడు
  rationale: ఏకవచన నామవాచకానికి ప్రథమ పురుష బహువచన ప్రత్యయం కలిసిన రూపం నేరుగా ‘మన దేవుడు’ అని అర్థమిస్తుంది; వాక్యంలో సహజత్వం కోసం ‘మన దేవుడైన యహ్వే’గా అమర్చాం.
- source_word: עִמָּנוּ
  choice: మనతో
  rationale: ఇక్కడ עִם దేవుని సన్నిధి, తోడును సూచిస్తుంది; ‘మనతో’ సంక్షిప్తమైన, ఖచ్చితమైన తెలుగు రూపం.
- source_word: כַּאֲשֶׁר הָיָה עִם אֲבֹתֵינוּ
  choice: ఆయన మన పితరులతో ఉన్నట్లే
  rationale: כַּאֲשֶׁר పోలికను సూచిస్తుంది. אֲבֹתֵינוּలోని పురుషలింగ మూలరూపాన్ని ‘మన పితరులు’ నిలుపుతుంది; సందర్భంలో ఇది ఇశ్రాయేలు పూర్వతరాల వారిని సూచిస్తుంది.
- source_word: אַל יַעַזְבֵנוּ
  choice: ఆయన మనలను విడిచిపెట్టకుండుగాక
  rationale: ప్రతికూల జస్సివ్ దేవుడు తన ప్రజలను విడిచిపెట్టవద్దనే ప్రార్థనను వ్యక్తం చేస్తుంది; ‘విడిచిపెట్టకుండుగాక’ సంబంధపరమైన బరువును నిలుపుతుంది.
- source_word: וְאַל יִטְּשֵׁנוּ
  choice: మనలను వదిలివేయకుండుగాక
  rationale: נטש మరియు עזב అర్థాల్లో సమీపమైనవే అయినా పూర్తిగా ఒకటే కావు. ‘వదిలివేయు’ సమాంతరత్వాన్ని నిలుపుతూ, ప్రజలను నిరాధారంగా వదలకూడదనే భావాన్ని తెలుపుతుంది.
theological_decisions:
- issue: יְהוָה దైవనామాన్ని ఎలా అనువదించాలి
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా, ‘Yahweh’కు సమీపమైన ‘యహ్వే’గా లిప్యంతరీకరించడం నామాన్ని నిలుపుతుంది.
- issue: אֲבֹתֵינוּ పదంలోని లింగసూచన మరియు విస్తృతి
  choice: మన పితరులు
  alternative: మన పూర్వీకులు
  rationale: హీబ్రూ పదం అక్షరార్థంగా పురుష పూర్వీకులను, ఇక్కడ ఇశ్రాయేలు పితరులను సూచిస్తుంది. ‘పితరులు’ మూలంలోని పురుషలింగ సూచనను నిలుపుతుంది; విస్తృత సందర్భార్థమైన ‘పూర్వీకులు’ను పాదసూచికలో ఇచ్చాం.
- issue: రెండు ప్రతికూల జస్సివ్‌ల ప్రార్థనాత్మక స్వరం
  choice: విడిచిపెట్టకుండుగాక … వదిలివేయకుండుగాక
  alternative: విడిచిపెట్టవద్దు … వదిలివేయవద్దు
  rationale: మూలంలో దేవుణ్ణి నేరుగా సంబోధించే ద్వితీయ పురుష ఆజ్ఞలు కాక, ఆయన గురించి చెప్పే మూడవ పురుష ప్రతికూల జస్సివ్‌లు ఉన్నాయి. అందుకే తెలుగు రూపంలో మూడవ పురుష ప్రార్థనాత్మక స్వరాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ప్రార్థనా శైలిని వాడాం. ‘ఉండుగాక/విడిచిపెట్టకుండుగాక’ రూపాలు జస్సివ్ స్వరాన్ని నిలుపుతాయి. మొదటి వాక్యంలోని ‘మనతోనూ ఉండుగాక’ మూలంలోని పోలికను తెలుగులో స్పష్టంగా, సహజంగా పూర్తి చేస్తుంది.
