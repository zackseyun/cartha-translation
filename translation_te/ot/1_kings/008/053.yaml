    issue: 'Unsupported added clause: “నీవు ఇలా చేశావు.”'
    rationale: The Hebrew has no equivalent independent clause. It states that God set Israel apart, “just as/according as” he spoke through Moses; the added words introduce an unnecessary assertion and alter the sentence's syntax.
  - severity: low
    issue: Footnote c gives YHWH as “య్హ్వ్హ.”
    rationale: This unvocalized Telugu transliteration is not useful for modern readers. Since the translation renders the name as “యాహ్వే,” the note should identify it correspondingly while still distinguishing the title from the divine name.
