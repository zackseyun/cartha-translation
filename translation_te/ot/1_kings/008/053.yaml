- from: ఎందుకంటే భూమిమీద ఉన్న ప్రజలందరిలోనుండి వారిని నీకోసం స్వాస్థ్యంగా ప్రత్యేకించావు. నీ సేవకుడైన మోషే ద్వారా[a] నీవు చెప్పినట్టే, మా పితరులను[b] ఐగుప్తులోనుండి బయటికి తీసుకువచ్చినప్పుడు నీవు ఇలా చేశావు, ప్రభువైన యాహ్వే[c].
