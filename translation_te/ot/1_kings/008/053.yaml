source:
  edition: WLC
  text: כִּֽי אַתָּ֞ה הִבְדַּלְתָּ֤/ם לְ/ךָ֙ לְֽ/נַחֲלָ֔ה מִ/כֹּ֖ל עַמֵּ֣י הָ/אָ֑רֶץ כַּ/אֲשֶׁ֨ר דִּבַּ֜רְתָּ בְּ/יַ֣ד מֹשֶׁ֣ה עַבְדֶּ֗/ךָ בְּ/הוֹצִיאֲ/ךָ֧ אֶת אֲבֹתֵ֛י/נוּ מִ/מִּצְרַ֖יִם אֲדֹנָ֥/י יְהוִֽה־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/053.yaml
  text: For you set them apart for yourself as an inheritance from all the peoples of the earth[a], just as you spoke by the hand of Moses your servant when you brought our fathers out from Egypt[c][b], Lord GOD.
translation:
  language: te
  text: ఎందుకంటే, భూమిమీదనున్న సమస్త ప్రజలలోనుండి వారిని నీ స్వాస్థ్యంగా ప్రత్యేకపరచుకున్నావు, నీవు మా పితరులను ఐగుప్తులోనుండి తీసుకువచ్చినప్పుడు నీ సేవకుడైన మోషే ద్వారా[a] చెప్పినట్లుగానే, ప్రభువైన యాహ్వే[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘నీ సేవకుడైన మోషే చేతి ద్వారా.’
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో ‘అదోనాయి యాహ్వే’; బిరుదైన ‘ప్రభువు’తో పాటు దైవనామమైన ‘యాహ్వే’ ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבְדַּלְתָּם
  choice: వారిని ... ప్రత్యేకించావు
  rationale: హిఫీల్ రూపం వేరుచేయడం లేదా ప్రత్యేకంగా ఉంచడం అనే భావాన్ని ఇస్తుంది. ‘ప్రత్యేకించావు’ ఆధునిక తెలుగులో సహజంగా ఉండి, దేవుడు ఇశ్రాయేలును ఇతర ప్రజల నుండి తనకోసం వేరుచేసిన భావాన్ని నిలుపుతుంది.
- source_word: לְךָ לְנַחֲלָה
  choice: నీకోసం స్వాస్థ్యంగా
  rationale: לְךָ దేవునికి చెందినదిగా లేదా ఆయన కోసం అనే భావాన్ని, נַחֲלָה వారసత్వంగా లభించిన స్వాస్థ్యం అనే నిబంధనాత్మక భావాన్ని వ్యక్తం చేస్తాయి.
- source_word: מִכֹּל עַמֵּי הָאָרֶץ
  choice: భూమిమీద ఉన్న ప్రజలందరిలోనుండి
  rationale: ఇక్కడ הָאָרֶץ ఒక ప్రాంతీయ ‘దేశం’ కంటే సమస్త భూమిని సూచిస్తుంది; עַמֵּי అనేక జనసమూహాలను సూచిస్తుంది.
- source_word: בְּיַד מֹשֶׁה
  choice: మోషే ద్వారా
  rationale: అక్షరార్థంగా ‘మోషే చేతి ద్వారా’ అయిన ఈ హీబ్రూ నుడికారం మధ్యవర్తిత్వాన్ని సూచిస్తుంది. తెలుగులో ‘మోషే ద్వారా’ అదే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: עַבְדֶּךָ
  choice: నీ సేవకుడైన
  rationale: మోషేకు సంబంధించిన గౌరవపూర్వక సందర్భంలో עבד కు ‘సేవకుడు’ తగిన అర్థం; ఇక్కడ బానిసత్వ భావం ప్రధానంగా లేదు.
- source_word: בְּהוֹצִיאֲךָ
  choice: బయటికి తీసుకువచ్చినప్పుడు
  rationale: ב తో కూడిన క్రియానామ రూపం కాలసంబంధ పరిస్థితిని సూచిస్తుంది; అందువల్ల ‘తీసుకువచ్చినప్పుడు’ అని అనువదించబడింది.
- source_word: אֶת אֲבֹתֵינוּ
  choice: మా పితరులను
  rationale: అక్షరార్థమైన పూర్వతరాల పురుషులను సూచించే పదాన్ని ‘పితరులు’ స్పష్టంగా నిలుపుతుంది; విస్తృతార్థంలో ‘పూర్వికులు’ కూడా సాధ్యమే.
- source_word: אֲדֹנָי יְהוִה
  choice: ప్రభువైన యాహ్వే
  rationale: אֲדֹנָי అనే బిరుదును ‘ప్రభువు’గా, יהוה అనే దైవ నామాన్ని ‘యాహ్వే’గా వేర్వేరుగా నిలుపుతూ తెలుగులో సహజమైన సంయుక్త రూపం వాడబడింది.
theological_decisions:
- issue: אֲדֹנָי יְהוִה లోని దైవనామం
  choice: ప్రభువైన యాహ్వే
  alternative: ప్రభువైన దేవుడు; ప్రభువైన యెహోవా
  rationale: మూలపాఠంలో బిరుదుతోపాటు ప్రత్యేక దైవనామం కూడా ఉంది. ‘యాహ్వే’ దైవనామాన్ని దాచకుండా ఉంచుతుంది; ‘దేవుడు’ అని మార్చడం పేరు మరియు బిరుదు మధ్య భేదాన్ని తొలగిస్తుంది.
- issue: ఇశ్రాయేలు దేవుని స్వాస్థ్యమనే వాక్యభావం
  choice: నీకోసం స్వాస్థ్యంగా ప్రత్యేకించావు
  alternative: నీ సొత్తుగా చేసుకున్నావు
  rationale: ‘స్వాస్థ్యం’ నిబంధనాత్మక נחלה భావాన్ని నిలుపుతుంది; ‘సొత్తు’ మాత్రమే అనడం ఆ భావాన్ని సంకుచితం చేయవచ్చు. వాక్యం చెప్పిన ప్రత్యేక సంబంధాన్ని అనువాదం వివరణాత్మక సిద్ధాంతంగా విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలి ఉపయోగించబడింది. హీబ్రూ వాక్యంలో చివర ఉన్న సంబోధనను చివరే ఉంచాం. అయితే పొడవైన హీబ్రూ నిర్మాణం తెలుగులో స్పష్టంగా ఉండేందుకు మొదటి భావఖండం తరువాత వాక్య విరామం ఇచ్చి, ‘నీవు ఇలా చేశావు’ అనే సందర్భానుగుణ క్రియను చేర్చాం.
