lexical_decisions:
- source_word: וַיִּקָּהֲלוּ אֶל
  choice: ఎదుట సమావేశమయ్యారు
  rationale: קהל యొక్క సమూహంగా కూడడం అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, אֶל సూచించే రాజు సమక్షానికి చేరడాన్ని ‘ఎదుట’తో వ్యక్తం చేసింది.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులందరూ
  rationale: אִישׁ అనే ఏకవచన సమూహప్రయోగాన్ని దాని పురుష-సూచనతో సహా తెలుగులో సహజమైన బహువచనంగా ఇచ్చింది.
- source_word: בְּיֶרַח הָאֵתָנִים
  choice: ఏతానీము నెలలో
  rationale: ప్రాచీన నెల పేరును అర్థానువాదం చేయకుండా లిప్యంతరీకరించింది; יֶרַח ను ‘నెల’గా అనువదించింది.
- source_word: בֶּחָג
  choice: పండుగ సమయంలో
  rationale: నిర్దిష్ట పండుగ సందర్భాన్ని సూచించే חָג ను సంక్షిప్తంగా, సహజంగా అందించింది.
- source_word: הוּא הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ఏడవ నెల అయిన
  rationale: ఏతానీము ఏ నెలవో గుర్తించే వివరణను తెలుగులో సహజమైన సంబంధ నిర్మాణంగా ముందుంచింది.
