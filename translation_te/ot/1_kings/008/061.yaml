id: 1KI.8.61
reference: 1 Kings 8:61
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הָיָ֤ה לְבַבְ/כֶם֙ שָׁלֵ֔ם עִ֖ם יְהוָ֣ה אֱלֹהֵ֑י/נוּ לָ/לֶ֧כֶת בְּ/חֻקָּ֛י/ו וְ/לִ/שְׁמֹ֥ר מִצְוֺתָ֖י/ו כַּ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/061.yaml
  text: Let your heart therefore be wholly with Yahweh our God[a], to walk in his statutes and to keep his commandments[b], as at this day.
translation:
  language: te
  text: కాబట్టి మీ హృదయం మన దేవుడైన యాహ్వే పట్ల పూర్తిగా నిబద్ధమై ఉండాలి[a]; నేటిలాగే ఆయన విధులలో నడుచుకొని ఆయన ఆజ్ఞలను పాటించాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “అవిభక్తంగా”: “మీ హృదయం మన దేవుడైన యాహ్వే పట్ల అవిభక్తంగా ఉండాలి.”'
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీ నుడికారం అక్షరార్థంగా, “ఈ దినంలాగా.” ప్రస్తుత దినం అలాంటి నిబద్ధతకు నమూనాగా లేదా సాక్ష్యంగా సూచించబడుతోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ఉండాలి
  rationale: ఈ సందర్భంలో వావ్‌తో కూడిన ఖాతల్ రూపం సాధారణ భవిష్యత్తును కాక ప్రోత్సాహపూర్వక ఆదేశాన్ని వ్యక్తపరుస్తుంది; తెలుగులో ‘ఉండాలి’ సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: לְבַבְכֶם
  choice: మీ హృదయం
  rationale: లేవావ్ సంకల్పం, భక్తి, అంతరంగ వ్యక్తిత్వాన్ని సూచిస్తుంది. హెబ్రీలోని సమూహార్థక ఏకవచనాన్ని ‘మీ హృదయం’గా నిలుపుకున్నాం.
- source_word: שָׁלֵם
  choice: సంపూర్ణంగా
  rationale: ఒడంబడిక సందర్భంలో ఇది పాపరహిత పరిపూర్ణతకన్నా సంపూర్ణమైన, విభజింపబడని నిబద్ధతను సూచిస్తుంది.
- source_word: עִם יְהוָה אֱלֹהֵינוּ
  choice: మన దేవుడైన యాహ్వే పట్ల
  rationale: עִם అక్షరార్థంగా ‘తో’ అయినా, తెలుగులో ‘హృదయం ... తో సంపూర్ణంగా’ అసహజంగా ఉంటుంది. ‘పట్ల’ సంబంధపూర్వకమైన సంపూర్ణ నిబద్ధతను సహజంగా తెలియజేస్తుంది; దైవనామాన్ని యాహ్వేగా లిప్యంతరీకరించాం.
- source_word: לָלֶכֶת בְּחֻקָּיו
  choice: ఆయన కట్టడల ప్రకారం నడుచుకుంటూ
  rationale: ‘నడుచు’ అనే బైబిలీయ జీవనరూపకాన్ని నిలిపి, בְּ యొక్క నియమానుసరణ భావాన్ని తెలుగులో స్పష్టంగా తెలిపాం.
- source_word: וְלִשְׁמֹר מִצְוֺתָיו
  choice: ఆయన ఆజ్ఞలను పాటించాలి
  rationale: న్యాయ/ఒడంబడిక సందర్భంలో שׁמר అంటే కాపాడటం మాత్రమే కాక ఆచరించడం; ‘పాటించాలి’ ఆధునిక తెలుగులో సహజం.
- source_word: כַּיּוֹם הַזֶּה
  choice: ఈ రోజు ఉన్నట్టుగానే
  rationale: ప్రస్తుత దినాన్ని అలాంటి నిబద్ధతకు నమూనాగా లేదా సాక్ష్యంగా చూపే హెబ్రీ నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత ఒడంబడిక నామం నేరుగా ఉంది; బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: שָׁלֵם సూచించే సంపూర్ణత
  choice: సంపూర్ణంగా
  alternative: విభజింపబడకుండా
  rationale: ఇది యాహ్వే పట్ల సంపూర్ణ నిబద్ధతను తెలియజేస్తుంది; పాపరహిత పరిపూర్ణత అనే తరువాతి సిద్ధాంతార్థాన్ని వాక్యంలోకి దిగుమతి చేయదు. ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన బైబిలీయ శైలిని కాపాడుతూ సాధారణ పాఠకులకు సహజంగా ఉండే వాక్యనిర్మాణం వాడాం. ‘నడుచుకుంటూ’ అనే రూపకం మూలంలోని covenantal ‘walk’ భావాన్ని నిలుపుతుంది.
