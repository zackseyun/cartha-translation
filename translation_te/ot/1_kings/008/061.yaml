revisions:
- from: కాబట్టి మీ హృదయం మన దేవుడైన యాహ్వే పట్ల సంపూర్ణంగా ఉండాలి[a]; ఈ రోజు ఉన్నట్టుగానే ఆయన కట్టడల ప్రకారం నడుచుకుంటూ, ఆయన ఆజ్ఞలను పాటించాలి[b].
  to: కాబట్టి మీ హృదయం మన దేవుడైన యాహ్వే పట్ల పూర్తిగా నిబద్ధమై ఉండాలి[a]; నేటిలాగే ఆయన విధులలో నడుచుకొని ఆయన ఆజ్ఞలను పాటించాలి[b].
  rationale: The revision retains the Hebrew exhortation and its sequence—whole-hearted loyalty to Yahweh, walking in his statutes, and keeping his commandments—while making the Telugu syntax natural and ensuring that “as at this day” clearly modifies the life of obedience. The footnote continues to preserve the valid lexical alternative “undivided.”
