  text: וַֽ/יַּאֲרִכוּ֮ הַ/בַּדִּים֒ וַ/יֵּרָאוּ֩ רָאשֵׁ֨י הַ/בַּדִּ֤ים מִן הַ/קֹּ֨דֶשׁ֙ עַל פְּנֵ֣י הַ/דְּבִ֔יר וְ/לֹ֥א יֵרָא֖וּ הַ/ח֑וּצָ/ה וַ/יִּ֣הְיוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/008.yaml
  text: And the poles were so long that the ends of the poles were seen from the Holy Place before the inner sanctuary[a], but they could not be seen from outside; and they are there to this day.
translation:
  language: te
  text: మోయు కర్రలు ఎంత పొడవుగా ఉన్నాయంటే, వాటి చివరలు పరిశుద్ధస్థలంలో, లోపలి పరిశుద్ధస్థలం ఎదుట కనిపించాయి[a]; అయితే అవి బయట నుండి కనిపించలేదు. అవి నేటివరకు అక్కడే ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతి పరిశుద్ధస్థలం ఎదుట.” హీబ్రూ పదం ఆలయంలోని లోపలి గదిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲרִכוּ
  choice: ఎంత పొడవుగా ఉన్నాయంటే
  rationale: కర్రల పొడవు కారణంగానే వాటి చివరలు కనిపించాయనే సందర్భ సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: הַבַּדִּים
  choice: మోయు కర్రలు
  rationale: ఇవి మందసాన్ని మోయడానికి ఉపయోగించిన కర్రలని స్పష్టం చేస్తూ, పాతబడిన పదజాలాన్ని నివారిస్తుంది.
- source_word: וַיֵּרָאוּ רָאשֵׁי הַבַּדִּים
  choice: వాటి చివరలు ... కనిపించాయి
  rationale: רָאשֵׁי అక్షరార్థంగా ‘తలలు’; కర్రల విషయంలో ‘చివరలు’ సహజమైన సమానార్థకం. నిఫల్ రూపాన్ని ప్రత్యక్షంగా ‘కనిపించాయి’ అని అనువదించింది.
- source_word: מִן הַקֹּדֶשׁ
  choice: పరిశుద్ధ స్థలం నుండి
  rationale: అంతర్గర్భాలయానికి భిన్నమైన ఆలయపు బయటి గదిని సూచించే నిర్మాణ సంబంధమైన భేదాన్ని నిలుపుతుంది.
- source_word: עַל פְּנֵי הַדְּבִיר
  choice: అంతర్గర్భాలయం ముందర
  rationale: דְּבִיר ఆలయంలో మందసం ఉంచిన లోపలి గదిని సూచిస్తుంది; עַל־פְּנֵי భావాన్ని ‘ముందర’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְלֹא יֵרָאוּ הַחוּצָה
  choice: అయితే అవి బయట నుండి కనిపించలేదు
  rationale: పరిశుద్ధ స్థలం నుండి అవి కనిపించడానికీ బయట నుండి కనిపించకపోవడానికీ ఉన్న వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: וַיִּהְיוּ שָׁם עַד הַיּוֹם הַזֶּה
  choice: అవి ఈ రోజు వరకు అక్కడే ఉన్నాయి
  rationale: వివరణకర్త కాలం వరకు కొనసాగిన స్థితిని సూచించే ప్రామాణిక హీబ్రూ నుడికారాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: הַדְּבִיר అనే ఆలయ నిర్మాణ పదానికి అనువాదం
  choice: అంతర్గర్భాలయం
  alternative: అతి పరిశుద్ధ స్థలం
  rationale: మూలపదం ప్రధానంగా ఆలయపు లోపలి గదిని సూచిస్తుంది. ‘అంతర్గర్భాలయం’ నిర్మాణార్థాన్ని ప్రత్యక్షంగా నిలుపుతుంది; ‘అతి పరిశుద్ధ స్థలం’ సందర్భానికి సరిపడే సాంప్రదాయ ప్రత్యామ్నాయం అయినప్పటికీ కొంత వివరణాత్మకం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ఆలయ నిర్మాణంలోని ‘పరిశుద్ధ స్థలం’ మరియు ‘అంతర్గర్భాలయం’ మధ్య భేదాన్ని నిలుపుతూ, మూలంలోని కనిపించడం/కనిపించకపోవడం అనే వ్యత్యాసాన్ని ప్రత్యక్షంగా వ్యక్తం చేసింది.
