reference: 1 Kings 8:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: רַ֣ק אַתָּ֔ה לֹ֥א תִבְנֶ֖ה הַ/בָּ֑יִת כִּ֤י אִם בִּנְ/ךָ֙ הַ/יֹּצֵ֣א מֵ/חֲלָצֶ֔י/ךָ הֽוּא יִבְנֶ֥ה הַ/בַּ֖יִת לִ/שְׁמִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/019.yaml
  text: Nevertheless[a], you shall not build the house; rather, your son who comes from your own body, he shall build the house for my name.
translation:
  language: te
  text: అయితే నీవు ఆ ఇంటిని కట్టవు; కానీ నీ నడుము నుండి పుట్టబోయే నీ కుమారుడే[a] నా నామం కోసం ఆ ఇంటిని కడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ నడుము నుంచి బయలుదేరే”; ఇది నీకు శారీరకంగా పుట్టే సంతానాన్ని సూచించే హీబ్రూ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: అయితే
  rationale: ముందటి మాటను పరిమితం చేస్తూ వ్యత్యాసాన్ని సూచించే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לֹא תִבְנֶה
  choice: నీవు ... కట్టవు
  rationale: దైవిక ప్రకటనలోని నిషేధం–భవిష్య నిర్ణయం మధ్య ఉన్న భావసందిగ్ధతను ‘కట్టకూడదు’ అని పూర్తిగా నిషేధంగా మార్చకుండా నిలుపుతుంది.
- source_word: הַבָּיִת
  choice: ఆ ఇల్లు
  rationale: సందర్భంలో ఇది ఆలయాన్ని సూచించినా, మూలపాఠంలోని ‘ఇల్లు’ అనే పదాన్నీ దాని దైవశాస్త్రీయ ప్రతీకనూ నిలుపుతుంది.
- source_word: כִּי אִם
  choice: నీ కుమారుడే
  rationale: ‘నీవు కాదు, నీ కుమారుడే’ అనే వ్యతిరేకతను తెలుగు ‘ఏ’ నొక్కిచెప్పే ప్రత్యయంతో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בִּנְךָ
  choice: నీ కుమారుడు
  rationale: నిర్దిష్టమైన కుమారుణ్ణి సూచించే ఏకవచన రూపానికి నేరుగా సరిపోతుంది.
- source_word: הַיֹּצֵא מֵחֲלָצֶיךָ
  choice: నీ శరీరం నుంచి పుట్టే
  rationale: శారీరక సంతానాన్ని సూచించే హీబ్రూ నుడికారాన్ని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తూ, దాని అక్షరార్థాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
- source_word: הוּא
  choice: అతడే అనే భావాన్ని ‘కుమారుడే’లో వ్యక్తీకరించడం
  rationale: స్వతంత్ర సర్వనామంలోని నొక్కిచెప్పే భావాన్ని తెలుగులో సహజంగా ‘ఏ’ ప్రత్యయంతో అందిస్తుంది.
- source_word: יִבְנֶה הַבַּיִת
  choice: ఆ ఇంటిని కడతాడు
  rationale: మూలంలోని ‘ఇల్లు కట్టు’ అనే పునరుక్తిని నిలుపుతూ దైవిక భవిష్య ప్రకటనను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לִשְׁמִי
  choice: నా నామం కోసం
  rationale: యెహోవాకు అంకితమైన ఇంటిని సూచించే బైబిలు నుడికారాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
theological_decisions:
- issue: הַבָּיִת ను ‘ఇల్లు’గా అనువదించాలా, ‘ఆలయం’గా స్పష్టం చేయాలా
  choice: ఇల్లు
  alternative: ఆలయం
  rationale: సందర్భంలో ఆలయమే ఉద్దేశమైనప్పటికీ, మూలపాఠం ‘ఇల్లు’ అని చెబుతుంది. దేవుని నామం కోసం కట్టబడే ఇంటి దైవశాస్త్రీయ నుడికారాన్ని వ్యాఖ్యానంతో మార్చకుండా ఉంచడం సముచితం.
- issue: לֹא תִבְנֶה ను నిషేధంగా లేదా భవిష్య నిర్ణయంగా చూపాలా
  choice: నీవు కట్టవు
  alternative: నీవు కట్టకూడదు
  rationale: హీబ్రూ నిరాకరణతో కూడిన అసంపూర్ణ క్రియారూపం ఇక్కడ నిషేధం మరియు దైవిక నిర్ణయం రెండింటి ఛాయలను కలిగి ఉంది; ‘కట్టవు’ ఆ ఉద్రిక్తతను ఎక్కువగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘ఇల్లు,’ ‘నామం’ వంటి మూలపాఠానికి ముఖ్యమైన బైబిలు పదప్రయోగాలు నిలుపబడ్డాయి; ‘కుమారుడే’ ద్వారా హీబ్రూ నొక్కిచెప్పే భావం తెలుగులో సహజంగా వ్యక్తమైంది.
