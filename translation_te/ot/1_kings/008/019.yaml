revisions:
- from: అయితే నీవు ఆ ఇంటిని కట్టవు; నీ శరీరం నుంచి పుట్టే నీ కుమారుడే[a] నా నామం కోసం ఆ ఇంటిని కడతాడు.
  to: అయితే నీవు ఆ ఇంటిని కట్టవు; కానీ నీ నడుము నుండి పుట్టబోయే నీ కుమారుడే[a] నా నామం కోసం ఆ ఇంటిని కడతాడు.
  rationale: The revision explicitly renders the Hebrew corrective contrast כִּי אִם with “కానీ,” while retaining కుమారుడే to convey the emphatic independent pronoun הוּא. It also replaces the comparatively awkward “నీ శరీరం నుంచి” with the source-nearer and biblically conventional “నీ నడుము నుండి,” with the existing footnote preserving and explaining the literal idiom. No theological interpretation has been added.
