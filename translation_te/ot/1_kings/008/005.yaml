reference: 1 Kings 8:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה וְ/כָל עֲדַ֤ת יִשְׂרָאֵל֙ הַ/נּוֹעָדִ֣ים עָלָ֔י/ו אִתּ֖/וֹ לִ/פְנֵ֣י הָֽ/אָר֑וֹן מְזַבְּחִים֙ צֹ֣אן וּ/בָקָ֔ר אֲשֶׁ֧ר לֹֽא יִסָּפְר֛וּ וְ/לֹ֥א יִמָּנ֖וּ מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/005.yaml
  text: And King Solomon[a], and all the assembly of Israel who had assembled before him, were with him before the ark, sacrificing sheep and cattle that could not be counted or numbered because of their great number.
translation:
  language: te
  text: సొలొమోను రాజు, అతని సమక్షంలో కూడిన[a] ఇశ్రాయేలు సమాజమంతా, మందసం ఎదుట అతనితో కలిసి ఉన్నారు. వారు ఎంతో ఎక్కువగా ఉండడం వల్ల లెక్కించడానికీ సంఖ్య కట్టడానికీ వీలులేని గొర్రెలను, పశువులను బలిగా అర్పిస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని వద్ద కూడిన.” హీబ్రూ పదబంధం ప్రజలు సొలొమోనుతో సంబంధంగా కూడినట్లు సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת
  choice: సమాజమంతా
  rationale: ప్రజారాధన కోసం కూడిన ఇశ్రాయేలు జాతీయ సమూహాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది; తరువాతి సంఘసంబంధ భావాన్ని అనవసరంగా చేర్చదు.
- source_word: הַנּוֹעָדִים עָלָיו
  choice: అతని దగ్గర సమకూడిన
  rationale: יעד నిఫాల్ రూపంలోని సమావేశ భావాన్నీ, עָלָיו ద్వారా సొలొమోనుతో ఉన్న సంబంధాన్నీ సహజంగా నిలుపుతుంది.
- source_word: אִתּוֹ
  choice: అతనితో కలిసి
  rationale: హీబ్రూ వాక్యంలో సూచితమైన సహవాస సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לִפְנֵי הָאָרוֹן
  choice: మందసం ఎదుట
  rationale: ఆరాధనా సందర్భంలోని אָרוֹןకు స్థిరమైన తెలుగు సమానార్థకమైన ‘మందసం’ను వాడి, స్థలార్థాన్ని నిలుపుతుంది.
- source_word: מְזַבְּחִים
  choice: బలిగా అర్పిస్తున్నారు
  rationale: కొనసాగుతున్న ఆచారబద్ధ బలి చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: צֹאן וּבָקָר
  choice: గొర్రెలను, పశువులను
  rationale: రెండు జంతు వర్గాలను స్పష్టంగా, సామాన్య పాఠకులకు అర్థమయ్యేలా అందిస్తుంది.
- source_word: אֲשֶׁר לֹא יִסָּפְרוּ וְלֹא יִמָּנוּ
  choice: లెక్కించడానికి గానీ సంఖ్య కట్టడానికి గానీ వీలులేనంత
  rationale: రెండు సమీపార్థక క్రియల ద్వారా కలిగే హీబ్రూ వాక్యపు బలాన్ని తెలుగులో కూడా రెండంచెల వ్యక్తీకరణతో నిలుపుతుంది.
- source_word: מֵרֹב
  choice: విస్తారంగా
  rationale: జంతువుల అపార సంఖ్యే వాటిని లెక్కించలేకపోవడానికి కారణమనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘మందసం’ అనే సూచన పరిధి
  choice: హీబ్రూలో ఉన్నట్లే ‘మందసం’ అని మాత్రమే అనువదించబడింది.
  alternative: నిబంధన మందసం
  rationale: ఈ వచనంలో הָאָרוֹן మాత్రమే ఉంది; ‘నిబంధన’ అని విస్తరించడం సందర్భం నుంచి సమాచారాన్ని చేర్చడమే అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. హీబ్రూ సమన్వయ నిర్మాణాన్ని యథాతథంగా అసహజంగా ఉంచకుండా రెండు సహజ వాక్యాలుగా అమర్చబడింది.
