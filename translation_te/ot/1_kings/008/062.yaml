source:
  edition: WLC
  text: וְֽ/הַ/מֶּ֔לֶךְ וְ/כָל יִשְׂרָאֵ֖ל עִמּ֑/וֹ זֹבְחִ֥ים זֶ֖בַח לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/062.yaml
  text: And the king and all Israel with him were sacrificing sacrifices before Yahweh[a].
translation:
  language: te
  text: రాజు, అతనితో ఉన్న ఇశ్రాయేలంతా యాహ్వే సన్నిధిలో బలి అర్పించారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘బలి అర్పించడం’ అనే ఒకే మూలానికి చెందిన క్రియ, నామవాచకం కలిసి వచ్చాయి; ఈ పదబంధం బలి అర్పించే చర్యను నొక్కిచెబుతుంది. ‘బలులు అర్పించారు’ అని కూడా అనువదించవచ్చు.
    reason: మూలంలోని సజాతీయ క్రియ-నామ నిర్మాణాన్ని మరియు సహజమైన ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: రాజు
  rationale: ముందటి కథనాన్ని కొనసాగించే וְను తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని పెట్టకపోవడం సహజం; నిర్దిష్ట రాజు సందర్భం ద్వారా స్పష్టమవుతున్నాడు.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: అతనితో ఉన్న ఇశ్రాయేలు ప్రజలందరూ
  rationale: ‘ఇశ్రాయేలు’ అనే సమష్టి జాతీయ సూచనను నిలుపుతూ, עִמּוֹను సహజమైన తెలుగులో సంబంధవాచక నిర్మాణంగా అనువదించింది.
- source_word: זֹבְחִים זֶבַח
  choice: బలి అర్పిస్తూ ఉన్నారు
  rationale: వర్తమాన క్రియారూపం సూచించే కొనసాగుతున్న చర్యను ‘అర్పిస్తూ ఉన్నారు’ తెలియజేస్తుంది. ఒకే మూలానికి చెందిన క్రియ-నామ పదబంధాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తూ, దాని హీబ్రూ రూపాన్ని పాదటిప్పణిలో తెలిపింది.
- source_word: לִפְנֵי
  choice: సన్నిధిలో
  rationale: ఆరాధనా సందర్భంలో ‘ఎదుట’ అనే స్థానార్థంతో పాటు దేవుని సమక్షంలో జరుగుతున్న చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ఆధునికంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. అందువల్ల దానిని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని భేదాన్ని కాపాడుతుంది.
- issue: זֹבְחִים זֶבַחలోని ఏకవచన నామవాచకం
  choice: బలి అర్పిస్తూ ఉన్నారు
  alternative: బలులు అర్పిస్తూ ఉన్నారు
  rationale: హీబ్రూ ఏకవచన నామవాచకాన్ని సాధారణ/సమష్టి భావంలో నిలుపుతూ తెలుగులో సహజంగా చెప్పింది; సందర్భానుసారమైన బహువచన అనువాదాన్ని పాదటిప్పణిలో సూచించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. ‘ఇశ్రాయేలు ప్రజలందరూ’ సమష్టి జాతీయ భావాన్ని స్పష్టం చేస్తుంది; ‘సన్నిధిలో’ ఆరాధనా సందర్భానికి సహజమైన పదం.
