  to: రాజు, అతనితో ఉన్న ఇశ్రాయేలంతా యాహ్వే సన్నిధిలో బలి అర్పించారు[a].
  rationale: The revision preserves the Hebrew collective ‘all Israel’ without adding ‘people’ and uses an unambiguously past narrative form in modern Telugu. Because Telugu cannot naturally reproduce the Hebrew cognate construction without stiffness, its emphasis remains transparently documented in the footnote. The singular generic ‘బలి’ is retained in the main text, while the plural alternative is noted.
