id: 1KI.8.50
reference: 1 Kings 8:50
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/סָלַחְתָּ֤ לְ/עַמְּ/ךָ֙ אֲשֶׁ֣ר חָֽטְאוּ לָ֔/ךְ וּ/לְ/כָל פִּשְׁעֵי/הֶ֖ם אֲשֶׁ֣ר פָּשְׁעוּ בָ֑/ךְ וּ/נְתַתָּ֧/ם לְ/רַחֲמִ֛ים לִ/פְנֵ֥י שֹׁבֵי/הֶ֖ם וְ/רִֽחֲמֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/050.yaml
  text: and forgive your people who have sinned against you[a], and all their transgressions that they have committed against you, and grant them compassion before those who took them captive[b], so that they may have compassion on them.
translation:
  language: te
  text: నీకు వ్యతిరేకంగా పాపం చేసిన నీ ప్రజలను, నీకు వ్యతిరేకంగా వారు చేసిన వారి అపరాధాలన్నిటినీ[b] క్షమించు. వారిని చెరగా తీసుకెళ్లినవారి దృష్టిలో వారిపట్ల కనికరం కలిగించు, వారు వారిపై కనికరం చూపేలా చేయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు వారిపై కనికరం చూపుతారు.” చివరి మాటను ఉద్దేశంగానూ ఫలితంగానూ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “అపరాధాలు” అనే మాటను “తిరుగుబాట్లు” అని కూడా అనువదించవచ్చు; ఇది దేవునికి వ్యతిరేకంగా చేసిన ఒడంబడిక ఉల్లంఘనను మరింత బలంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָלַחְתָּ
  choice: క్షమించు
  rationale: ప్రార్థనా సందర్భంలో ఉన్న ఈ క్రియ అభ్యర్థన భావాన్ని వ్యక్తం చేస్తుంది. ఆధునిక తెలుగులో ‘క్షమించు’ సహజంగానూ స్పష్టంగానూ ఉంది.
- source_word: לְעַמְּךָ
  choice: నీ ప్రజలను
  rationale: హీబ్రూలో పరోక్ష కర్మ సూచన ఉన్నప్పటికీ, తెలుగులో ‘ప్రజలను క్షమించు’ అనే నిర్మాణం సహజం.
- source_word: חָטְאוּ לָךְ
  choice: నీకు విరోధంగా పాపం చేసిన
  rationale: לָךְ ఇక్కడ పాపం ఎవరికి విరోధంగా జరిగిందో సూచిస్తుంది; ‘నీకు విరోధంగా’ ఆ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וּלְכָל פִּשְׁעֵיהֶם אֲשֶׁר פָּשְׁעוּ בָךְ
  choice: వారు నీకు విరోధంగా చేసిన అపరాధాలన్నిటినీ
  rationale: నామవాచకం, దానికి సంబంధించిన క్రియ ఒకే మూలం నుంచి వచ్చినా, తెలుగులో వాటిని యథాతథంగా పునరావృతం చేయడం అసహజంగా ఉంటుంది. ‘అపరాధాలు’ నైతిక, ఒడంబడిక ఉల్లంఘన భావాన్ని ఉంచుతుంది; ‘తిరుగుబాట్లు’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: וּנְתַתָּם לְרַחֲמִים
  choice: వారికి కనికరం కలిగించు
  rationale: ఈ హీబ్రూ ప్రయోగం వారు ఇతరుల కనికరాన్ని పొందే పరిస్థితిని దేవుడు కల్పించాలని కోరుతుంది. ‘కనికరం కలిగించు’ దైవ చర్యను, వారు పొందే దయను రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי שֹׁבֵיהֶם
  choice: వారిని చెరపట్టినవారి ఎదుట
  rationale: שֹׁבֵיהֶם అనేది వారిని బందీలుగా తీసుకెళ్లినవారిని సూచిస్తుంది. విస్తరించిన తెలుగు రూపం సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: וְרִחֲמוּם
  choice: ఆ చెరపట్టినవారు వారిపై కనికరం చూపేలా చేయి
  rationale: ముందున్న ‘కనికరం’ పదంతో మూలంలోని רחמים/רחם పదబంధ సంబంధాన్ని నిలుపుతుంది. ఈ చివరి క్రియ ఉద్దేశం లేదా ఫలితం అనే రెండు విధాలుగా అర్థమవగలదు.
theological_decisions:
- issue: దేవుని క్షమాపణకు, చెరపట్టినవారి మానవ కనికరానికి మధ్య సంబంధం
  choice: దేవుడు తన ప్రజలను క్షమించి, వారిని చెరపట్టినవారు వారిపై కనికరం చూపే పరిస్థితిని కల్పించాలని చేసే ప్రార్థనగా అనువదించబడింది.
  alternative: చివరి మాటను ఉద్దేశంగా కాక ఫలితంగా, ‘ఆ చెరపట్టినవారు వారిపై కనికరం చూపుతారు’ అని చదవవచ్చు.
  rationale: హీబ్రూ వాక్యక్రమం దేవుని చర్యను చెరపట్టినవారి కనికరంతో అనుసంధానిస్తుంది; అయితే చివరి క్రియ ఉద్దేశాన్నా ఫలితాన్నా సూచిస్తుందో పూర్తిగా నిర్ణయించదు. ప్రధాన పాఠం ఉద్దేశ భావాన్ని తీసుకుంటూ, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనకు తగిన గౌరవభరితమైన సరళ శైలి వాడబడింది. ‘నీ’ అనే ఏకవచన సంబోధన మూలంలోని ద్వితీయ పురుష ఏకవచనాన్ని నిలుపుతుంది. అస్పష్టమైన సర్వనామ సంబంధాన్ని నివారించేందుకు చివరి భాగంలో ‘ఆ చెరపట్టినవారు’ అని స్పష్టీకరించబడింది.
