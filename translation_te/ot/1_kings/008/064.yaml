source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא קִדַּ֨שׁ הַ/מֶּ֜לֶךְ אֶת תּ֣וֹךְ הֶ/חָצֵ֗ר אֲשֶׁר֙ לִ/פְנֵ֣י בֵית יְהוָ֔ה כִּי עָ֣שָׂה שָׁ֗ם אֶת הָֽ/עֹלָה֙ וְ/אֶת הַ/מִּנְחָ֔ה וְ/אֵ֖ת חֶלְבֵ֣י הַ/שְּׁלָמִ֑ים כִּֽי מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָ֔ה קָטֹ֗ן מֵֽ/הָכִיל֙ אֶת הָ/עֹלָ֣ה וְ/אֶת הַ/מִּנְחָ֔ה וְ/אֵ֖ת חֶלְבֵ֥י הַ/שְּׁלָמִֽים־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/064.yaml
  text: On that day the king consecrated the middle of the court that was before the house of Yahweh[a], because there he offered the burnt offering and the grain offering and the fat portions of the peace offerings[c][b], because the bronze altar that was before Yahweh was too small to contain the burnt offering and the grain offering and the fat portions of the peace offerings.
translation:
  language: te
  text: ఆ రోజున రాజు యెహోవా మందిరం ఎదుట ఉన్న ప్రాంగణం మధ్యభాగాన్ని పవిత్రపరిచాడు; ఎందుకంటే అక్కడ అతడు దహనబలిని, ధాన్యార్పణను, సమాధాన బలుల కొవ్వు భాగాలను అర్పించాడు, యెహోవా సన్నిధిలో ఉన్న కంచు బలిపీఠం దహనబలిని, ధాన్యార్పణను, సమాధాన బలుల కొవ్వు భాగాలను స్వీకరించలేనంత చిన్నదిగా ఉండింది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ బలులను ఉంచడానికి సరిపోనంత చిన్నదిగా ఉండింది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: קִדַּשׁ
  choice: పవిత్రపరిచాడు
  rationale: బలులు అర్పించే పవిత్ర వినియోగం కోసం ఆ ప్రదేశాన్ని ప్రత్యేకపరచడం అనే ఆరాధనాపరమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: תּוֹךְ הֶחָצֵר
  choice: ప్రాంగణం మధ్యభాగాన్ని
  rationale: תּוֹךְ యొక్క స్థలసంబంధమైన ‘మధ్య/నడిమి’ భావాన్ని స్పష్టంగా ఉంచుతుంది; ఇది మొత్తం ప్రాంగణాన్ని కాక దాని మధ్య ప్రాంతాన్ని సూచిస్తుంది.
- source_word: לִפְנֵי בֵית יְהוָה
  choice: యెహోవా మందిరం ఎదుట
  rationale: לִפְנֵי యొక్క స్థలార్థాన్ని ‘ఎదుట’గా, בֵית యొక్క సందర్భోచిత భావాన్ని సాధారణ పాఠకులకు స్పష్టమైన ‘మందిరం’గా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో నిలుపుతుంది.
- source_word: עָשָׂה שָׁם
  choice: అక్కడ అతడు ... అర్పించాడు
  rationale: బలుల సందర్భంలో עשה అంటే వాటిని నిర్వహించడం లేదా అర్పించడం; ‘అర్పించాడు’ సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: הָעֹלָה
  choice: దహనబలి
  rationale: పూర్తిగా బలిపీఠంపై దహనం చేసే עֹלָה బలికి తెలుగులో స్పష్టమైన, ప్రామాణిక ఆరాధనాపరమైన పదం.
- source_word: הַמִּנְחָה
  choice: ధాన్యార్పణ
  rationale: ఈ బలుల సందర్భంలో מִנְחָה సాధారణ కానుక కాక ధాన్యంతో చేసే అర్పణను సూచిస్తుంది.
- source_word: חֶלְבֵי הַשְּׁלָמִים
  choice: సమాధాన బలుల కొవ్వు భాగాలు
  rationale: חֶלְבֵי బలిపీఠంపై దహనం చేయాల్సిన నిర్దిష్ట కొవ్వు భాగాలను సూచిస్తుంది; שְׁלָמִיםకు గుర్తించదగిన ‘సమాధాన బలులు’ వాడబడింది.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: కంచు బలిపీఠం
  rationale: נְחֹשֶׁתకు ఈ ఆరాధనా సామగ్రి సందర్భంలో సాధారణంగా అంగీకరించబడిన ‘కంచు’ అర్థాన్ని ఇస్తుంది.
- source_word: קָטֹן מֵהָכִיל
  choice: ఇముడ్చుకోలేనంత చిన్నదిగా ఉండింది
  rationale: బలుల పరిమాణాన్ని స్వీకరించే సామర్థ్యం బలిపీఠానికి చాలలేదనే నిర్మాణార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה దైవనామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉన్నందున దానిని ఒక బిరుదుగా మార్చకుండా తెలుగులో సుపరిచితమైన రూపంలో నిలుపుతుంది.
- issue: שְׁלָמִים బలి పేరును అనువదించడం
  choice: సమాధాన బలులు
  alternative: సహవాస బలులు
  rationale: ఈ పదానికి సమాధానం, సంపూర్ణత, సహవాసం వంటి పరస్పర సంబంధిత భావాలు ఉన్నాయి. ప్రధాన పాఠంలో సంప్రదాయంగా గుర్తించదగిన ‘సమాధాన బలులు’ ఉంచి, ఒకే వివరణాత్మక భావంతో పదాన్ని పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. మూలంలోని పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపి, ఆరాధనాపరమైన పదాలకు స్పష్టమైన కానీ అతిగా మతశాఖాపరంగా కాని రూపాలు వాడబడ్డాయి.
