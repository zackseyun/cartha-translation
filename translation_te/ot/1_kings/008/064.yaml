  to: ఆ రోజున రాజు యెహోవా మందిరం ఎదుట ఉన్న ప్రాంగణం మధ్యభాగాన్ని పవిత్రపరిచాడు; ఎందుకంటే అక్కడ అతడు దహనబలిని, ధాన్యార్పణను, సమాధాన బలుల కొవ్వు భాగాలను అర్పించాడు, యెహోవా సన్నిధిలో ఉన్న కంచు బలిపీఠం దహనబలిని, ధాన్యార్పణను, సమాధాన బలుల కొవ్వు భాగాలను స్వీకరించలేనంత చిన్నదిగా ఉండింది[a].
  rationale: రెండవ כִּי ద్వారా వ్యక్తమైన కారణసంబంధాన్ని స్పష్టంగా చూపించడానికి వాక్యనిర్మాణాన్ని సవరించాను. బలిపీఠం ‘contain’ చేయలేకపోవడం అనే భావాన్ని తెలుగులో సహజమైన ‘స్వీకరించలేనంత చిన్నది’గా ఇచ్చాను. ఈ కొత్త పాదసూచిక మూలపాఠంలోని ‘చాలకపోవడం/స్వీకరించలేకపోవడం’ భావానికి సహజమైన తెలుగు ప్రత్యామ్నాయాన్ని మాత్రమే అందిస్తుంది; అర్థాన్ని విస్తరించదు.
