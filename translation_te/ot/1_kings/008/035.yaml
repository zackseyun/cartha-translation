revisions:
- from: ఆకాశం మూసుకుపోయి, వారు నీకు విరోధంగా పాపం చేసినందువల్ల వర్షం కురవనప్పుడు, వారు ఈ స్థలం వైపు తిరిగి ప్రార్థించి, నీ నామాన్ని స్తుతించి[a], నీవు వారిని బాధించినందువల్ల[b] తమ పాపాన్ని విడిచిపెట్టి తిరిగితే,
  to: ఆకాశం మూసుకుపోయి, వారు నీకు విరోధంగా పాపం చేసినందువల్ల వర్షం కురవనప్పుడు, వారు ఈ స్థలం వైపు తిరిగి ప్రార్థించి, నీ నామాన్ని స్తుతించి[a], నీవు వారిని బాధించినందువల్ల[b] తమ పాపం నుండి తిరిగితే,
  rationale: మూలంలోని שׁוּב מִן నిర్మాణాన్ని తెలుగులో “తమ పాపం నుండి తిరిగితే” అని నేరుగా వ్యక్తం చేశాం. ఇది అనవసర భావపునరుక్తిని తొలగిస్తూ, పాపం నుండి మళ్లడం అనే మూలభావాన్ని, అలాగే తరువాతి వచనంతో కొనసాగే షరతు వాక్య నిర్మాణాన్ని కాపాడుతుంది.
