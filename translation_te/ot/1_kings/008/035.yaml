source:
  edition: WLC
  text: בְּ/הֵעָצֵ֥ר שָׁמַ֛יִם וְ/לֹא יִהְיֶ֥ה מָטָ֖ר כִּ֣י יֶחֶטְאוּ לָ֑/ךְ וְ/הִֽתְפַּֽלְל֞וּ אֶל הַ/מָּק֤וֹם הַ/זֶּה֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וּ/מֵ/חַטָּאתָ֥/ם יְשׁוּב֖וּ/ן כִּ֥י תַעֲנֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/035.yaml
  text: When the heavens are shut up and there is no rain because they have sinned against you[a], and they pray toward this place and give thanks to your name and turn from their sin because you afflict them[b],
translation:
  language: te
  text: ఆకాశం మూసుకుపోయి, వారు నీకు విరోధంగా పాపం చేసినందువల్ల వర్షం కురవనప్పుడు, వారు ఈ స్థలం వైపు తిరిగి ప్రార్థించి, నీ నామాన్ని స్తుతించి[a], నీవు వారిని బాధించినందువల్ల[b] తమ పాపం నుండి తిరిగితే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నీ నామానికి కృతజ్ఞతలు చెల్లించి,’ లేదా ‘నీ నామాన్ని ఒప్పుకొని.’ హీబ్రూ క్రియ సందర్భాన్నిబట్టి కృతజ్ఞతతో స్తుతించడం లేదా బహిరంగంగా అంగీకరించడం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నీవు వారిని దీనులుగా చేసినందువల్ల.’ కొందరు దీనిని ‘నీవు వారికి జవాబిచ్చినందువల్ల’ అని అర్థం చేసుకుంటారు; అయితే కరువు ద్వారా కలిగిన క్రమశిక్షణ అనే సందర్భం ‘బాధించినందువల్ల’ అనే అర్థానికి అనుకూలంగా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּהֵעָצֵר שָׁמַיִם
  choice: ఆకాశం మూసుకుపోయి
  rationale: కాలార్థకమైన בְּతో కూడిన నిఫల్ రూపం ‘మూసుకుపోయినప్పుడు/నిలిపివేయబడినప్పుడు’ అనే భావాన్ని ఇస్తుంది. తెలుగులో వర్షం నిలిచిపోవడాన్ని సూచించడానికి ‘ఆకాశం మూసుకుపోయి’ సహజమైన బైబిలు నుడికారంగా ఉంటుంది.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: వర్షం కురవనప్పుడు
  rationale: హీబ్రూ వాక్యంలోని ‘వర్షం ఉండదు’ అనే ఫలితాన్ని తెలుగులో సహజంగా ‘వర్షం కురవనప్పుడు’ అని వ్యక్తం చేస్తుంది.
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: వారు నీకు విరోధంగా పాపం చేసినందువల్ల
  rationale: כִּי కారణాన్ని సూచిస్తుంది; לָךְ ఇక్కడ దేవునికి విరోధంగా చేసిన అపరాధాన్ని తెలియజేస్తుంది.
- source_word: וְהִתְפַּלְלוּ אֶל הַמָּקוֹם הַזֶּה
  choice: వారు ఈ స్థలం వైపు తిరిగి ప్రార్థించి
  rationale: אֶל ఇక్కడ ప్రార్థన ఎవరికి చేయబడుతుందో కాక, ఏ దిశగా చేయబడుతుందో సూచిస్తుంది. ‘వైపు తిరిగి’ అనడం ఆలయాన్నే సంబోధించి ప్రార్థిస్తున్నారనే అపార్థాన్ని నివారిస్తుంది.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: నీ నామాన్ని స్తుతించి
  rationale: ידה హిఫిల్ రూపం కృతజ్ఞతతో స్తుతించడం, బహిరంగంగా అంగీకరించడం లేదా ఒప్పుకోవడం వంటి సంబంధిత భావాలను కలిగి ఉంటుంది. ఈ సందర్భంలో ‘స్తుతించి’ సహజంగా ఉండగా, ఇతర భావాలను పాదసూచికలో నిలిపాం.
- source_word: וּמֵחַטָּאתָם יְשׁוּבוּן
  choice: తమ పాపాన్ని విడిచిపెట్టి తిరిగితే
  rationale: שׁוב + מִן పాపం నుండి వెనుదిరగడాన్ని సూచిస్తుంది. ‘విడిచిపెట్టి తిరిగితే’ మూలంలోని దిశామార్పు భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: כִּי תַעֲנֵם
  choice: నీవు వారిని బాధించినందువల్ల
  rationale: మసొరా స్వరచిహ్నాలతో ఉన్న రూపం సందర్భంలో బాధించడం లేదా దీనులుగా చేయడం అనే భావానికి అనుకూలంగా ఉంది; కరువు అనే దైవిక క్రమశిక్షణ వల్ల వారు పాపం నుండి తిరుగుతున్న వాక్యక్రమానికీ ఇది సరిపోతుంది.
theological_decisions:
- issue: ఆలయం వైపు ప్రార్థించడం
  choice: ఈ స్థలం వైపు తిరిగి ప్రార్థించి
  alternative: ఈ స్థలానికి ప్రార్థించి
  rationale: ప్రార్థన ఆలయానికి అర్పించబడుతుందని కాక, దేవుని నామం ఉంచబడిన స్థలం వైపు ముఖం చేసి చేయబడుతుందని పాఠం సూచిస్తుంది.
- issue: תַעֲנֵם యొక్క అర్థం
  choice: నీవు వారిని బాధించినందువల్ల
  alternative: నీవు వారికి జవాబిచ్చినందువల్ల
  rationale: మసొరా పాఠ స్వరీకరణ మరియు కరువు ద్వారా కలిగిన క్రమశిక్షణ పశ్చాత్తాపానికి దారితీసే సందర్భం ‘బాధించు/దీనులుగా చేయు’ అనే అర్థానికి మద్దతిస్తాయి. ‘జవాబిచ్చు’ అనే వేరొక అవగాహనను పాదసూచికలో పేర్కొని పాఠంలోని సమస్యను దాచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. ఆలయ దిశ, పాపం నుండి తిరగడం, దేవుని నామాన్ని స్తుతించడం వంటి మూలభావాలు స్పష్టంగా ఉంచబడ్డాయి. వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున చివర విరామచిహ్నంగా కామా ఉంచబడింది.
