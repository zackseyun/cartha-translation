source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל דָּוִ֣ד אָבִ֔/י יַ֗עַן אֲשֶׁ֤ר הָיָה֙ עִם לְבָ֣בְ/ךָ֔ לִ/בְנ֥וֹת בַּ֖יִת לִ/שְׁמִ֑/י הֱטִיבֹ֔תָ כִּ֥י הָיָ֖ה עִם לְבָבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/018.yaml
  text: But Yahweh said to David my father[a], ‘Because it was in your heart to build a house for my name, you did well that it was in your heart.’
translation:
  language: te
  text: 'యాహ్వే నా తండ్రియైన దావీదుతో ఇలా అన్నాడు: “నా నామం కోసం ఒక ఇల్లు[a] కట్టాలనే సంకల్పం నీ హృదయంలో ఉన్నందున నీవు మంచిగా చేశావు; ఎందుకంటే ఆ సంకల్పం నీ హృదయంలో ఉంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా నామం కోసం ఒక ఆలయం.” హీబ్రూలో అక్షరార్థంగా “నా నామం కోసం ఒక ఇల్లు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: אמר అనే సాధారణ వాక్కు క్రియను సహజమైన ఆధునిక తెలుగు ప్రత్యక్ష సంభాషణ శైలిలో అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אָבִי
  choice: నా తండ్రి
  rationale: మొదటి పురుష ఏకవచన ప్రత్యయం ప్రకారం సొలొమోను దావీదును తన తండ్రిగా సూచిస్తున్నాడు.
- source_word: יַעַן אֲשֶׁר
  choice: సందర్భానుసారంగా వాక్య నిర్మాణంలో కారణార్థం
  rationale: ఈ పదబంధం కారణాన్ని పరిచయం చేస్తుంది; తెలుగులో తరువాతి ఆమోద వాక్యంతో సహజంగా కలిసేలా ప్రత్యేకమైన ‘ఎందుకంటే’ పదాన్ని బలవంతంగా చేర్చలేదు.
- source_word: הָיָה עִם לְבָבְךָ
  choice: నీ హృదయంలో ఉంది
  rationale: ఉద్దేశం లేదా కోరికను సూచించే హీబ్రూ హృదయ రూపకాన్ని తెలుగులో అర్థమయ్యే విధంగా నిలుపుతుంది.
- source_word: לִבְנוֹת בַּיִת
  choice: ఒక ఇల్లు కట్టాలనే
  rationale: בַּיִת యొక్క ప్రాథమిక అర్థమైన ‘ఇల్లు’ను నిలిపింది; సందర్భంలో అది ఆలయాన్ని సూచిస్తుందని పాదసూచిక తెలియజేస్తుంది.
- source_word: לִשְׁמִי
  choice: నా నామం కోసం
  rationale: దేవుని నామంతో సంబంధం గల పవిత్రస్థలాన్ని సూచించే మూలభాషలోని నిబంధనాత్మక, ధార్మిక నుడికారాన్ని నిలుపుతుంది.
- source_word: הֱטִיבֹתָ
  choice: మంచిదే
  rationale: ఇక్కడ יטב హిఫీల్ రూపం తెలిపే దైవిక ఆమోదాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: כִּי הָיָה עִם לְבָבֶךָ
  choice: ఆ సంకల్పం నీ హృదయంలో ఉండడం
  rationale: దైవిక ఆమోదానికి ఆధారమైన ఉద్దేశాన్ని మళ్లీ ప్రస్తావిస్తూ, మూలంలోని పునరుక్తిని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని ఎలా అందించాలి
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: ‘యాహ్వే’ మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా, విస్తృతంగా అంగీకరించిన పండితీయ లిప్యంతరీకరణకు దగ్గరగా ఉంటుంది.
- issue: בַּיִת పదాన్ని ‘ఇల్లు’గా లేదా ‘ఆలయం’గా అనువదించాలా
  choice: ఇల్లు
  alternative: ఆలయం
  rationale: హీబ్రూ పాఠంలో ‘ఇల్లు’ అనే పదమే ఉంది. సందర్భంలో అది ఆలయాన్ని సూచించినప్పటికీ, మూల నుడికారాన్ని ప్రధాన పాఠంలో నిలిపి, వివరణాత్మక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
- issue: హృదయంలో ఉండడం అనే రూపకాన్ని నిలుపాలా
  choice: నీ హృదయంలో ఉంది; ఆ సంకల్పం నీ హృదయంలో ఉండడం
  alternative: నీవు ఉద్దేశించావు; అలా ఉద్దేశించడం
  rationale: హీబ్రూ వాక్యంలోని హృదయ రూపకాన్నీ, దాని ఉద్దేశపూర్వక పునరుక్తినీ నిలుపుతూ, ‘సంకల్పం’ ద్వారా ఆధునిక తెలుగు పాఠకుడికి భావాన్ని స్పష్టం చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించింది. ‘హృదయం,’ ‘నామం,’ ‘ఇల్లు’ అనే మూలభాషా రూపకాలను నిలిపి, ‘సంకల్పం’ ద్వారా ఉద్దేశ భావాన్ని సహజంగా స్పష్టం చేసింది.
