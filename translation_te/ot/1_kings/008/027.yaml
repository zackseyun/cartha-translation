base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/027.yaml
  text: For will God indeed dwell on the earth? Behold[a], the heavens, even the highest heavens, cannot contain you[c][b]; how much less this house that I have built!
translation:
  language: te
  text: నిజంగానే దేవుడు భూమిమీద నివసిస్తాడా? ఇదిగో, ఆకాశాలు, అత్యున్నత ఆకాశాలు[a] కూడా నిన్ను ఇముడ్చుకోలేవు[b]; అలాంటప్పుడు నేను కట్టిన ఈ మందిరం[c] నిన్ను ఎలా ఇముడ్చుకోగలదు!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘ఆకాశాలు, ఆకాశాల ఆకాశాలు’; ఇది అత్యున్నత ఆకాశాలను సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: ‘నిన్ను తమలో ఉంచుకోలేవు.’'
    reason: lexical_alternative
  - marker: c
    text: ‘ఈ మందిరం’ అంటే సొలొమోను నిర్మించిన దేవాలయం.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי הַאֻמְנָם
  choice: అయితే ... నిజంగానే
  rationale: ప్రశ్నలోని ఆశ్చర్యాన్ని, గంభీరమైన ఉద్ఘాటనను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ముందున్న సందర్భంతో ఉన్న తార్కిక సంబంధాన్ని కూడా సూచిస్తుంది.
- source_word: יֵשֵׁב
  choice: నివసిస్తాడా
  rationale: మూల క్రియకు ‘కూర్చోవడం’ అనే అర్థం ఉన్నప్పటికీ, దేవుని సన్నిధి మరియు మందిర సందర్భంలో ‘నివసించు’ అనేదే సహజమైన భావం.
- source_word: עַל הָאָרֶץ
  choice: భూమిమీద
  rationale: ఆకాశంతో భూమికి ఉన్న వ్యత్యాసాన్ని నేరుగా, స్పష్టంగా నిలుపుతుంది.
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: తరువాతి ప్రకటనపై గంభీరంగా దృష్టి నిలిపే హీబ్రూ ఉద్ఘాటనను కాపాడుతుంది.
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: ఆకాశాలు, అత్యున్నత ఆకాశాలు
  rationale: ‘ఆకాశాల ఆకాశాలు’ అనే హీబ్రూ అతిశయోక్తి నుడికారాన్ని ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా తెలియజేస్తూ దాని విస్తృతిని నిలుపుతుంది.
- source_word: לֹא יְכַלְכְּלוּךָ
  choice: నిన్ను ఇముడ్చుకోలేవు
  rationale: దేవుణ్ణి ఏ సృష్టించబడిన స్థలమూ తన పరిమితుల్లో ఉంచలేదనే సామర్థ్య భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אַף כִּי
  choice: అలాంటప్పుడు ... ఎలా ఇముడ్చుకోగలదు
  rationale: ఆకాశాలే దేవుణ్ణి ఇముడ్చుకోలేకపోతే మందిరం మరింతగా ఇముడ్చుకోలేదనే బలమైన తార్కిక నిర్ధారణను తెలుగులో సహజమైన ప్రశ్నారూపంలో తెలియజేస్తుంది.
- source_word: הַבַּיִת הַזֶּה
  choice: ఈ మందిరం
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఈ ఇల్లు’ ఉన్నా, సందర్భంలో అది సొలొమోను నిర్మించిన దేవాలయాన్ని సూచిస్తుంది; ‘మందిరం’ ఆధునిక తెలుగులో గౌరవప్రదంగా, స్పష్టంగా ఉంటుంది.
- source_word: אֲשֶׁר בָּנִיתִי
  choice: నేను కట్టిన
  rationale: పూర్తయిన నిర్మాణ కార్యాన్ని సరళంగా, మూలానికి దగ్గరగా తెలియజేస్తుంది.
theological_decisions:
- issue: దేవుని అతీతత్వం మరియు మందిరంలో ఆయన సన్నిధి
  choice: దేవుడు భూమిమీద నివసించడం గురించి ఆశ్చర్యభరిత ప్రశ్నను ఉంచి, అత్యున్నత ఆకాశాలు కూడా ఆయనను ఇముడ్చుకోలేవని ప్రకటించడం
  alternative: దేవుడు భూమిమీద అసలు నివసించడని నిశ్చయంగా చెప్పడం, లేదా మందిరం ఆయనను అక్షరార్థంగా తనలో పరిమితం చేస్తుందని సూచించడం
  rationale: హీబ్రూ వాక్యం దేవుని నిజమైన మందిర సన్నిధిని కొట్టివేయకుండా, ఆయనను ఏ సృష్టించబడిన స్థలమూ పరిమితం చేయలేదనే ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ప్రార్థనకు తగిన గంభీరతను నిలిపింది. ‘ఇదిగో’ మూలంలోని ఉద్ఘాటనను కాపాడుతుంది; చివరి వాక్యాన్ని ప్రశ్నారూపంలో ఇవ్వడం אַף כִּי యొక్క బలమైన ‘అయితే మరెంత తక్కువగా’ అనే తర్కాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
