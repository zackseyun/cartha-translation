source:
  edition: WLC
  text: רָעָ֞ב כִּֽי יִהְיֶ֣ה בָ/אָ֗רֶץ דֶּ֣בֶר כִּֽי יִ֠הְיֶה שִׁדָּפ֨וֹן יֵרָק֜וֹן אַרְבֶּ֤ה חָסִיל֙ כִּ֣י יִהְיֶ֔ה כִּ֧י יָֽצַר ל֛/וֹ אֹיְב֖/וֹ בְּ/אֶ֣רֶץ שְׁעָרָ֑י/ו כָּל נֶ֖גַע כָּֽל מַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/037.yaml
  text: If there is famine in the land[a], if there is pestilence, blight, mildew, locust, or caterpillar; if his enemy besieges him in the land of his gates; whatever plague[b], whatever sickness—
translation:
  language: te
  text: దేశంలో కరవు వచ్చినా, అంటువ్యాధి ప్రబలినా, పంటలకు ఎండుతెగులు గానీ బూజుతెగులు గానీ పట్టినా, మిడతలు గానీ పంటలను తినివేసే కీటకాలు[a] గానీ వచ్చినా; అతని దేశంలోని పట్టణాల్లో[b] శత్రువు అతన్ని ముట్టడించినా; ఏ విపత్తు వచ్చినా, ఏ వ్యాధి వచ్చినా—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ హీబ్రూ పదం ఖచ్చితంగా ఏ కీటకాన్ని సూచిస్తుందో తెలియదు; ఇది పంటలను తినివేసే ఒక రకమైన మిడతను లేదా మిడత జీవితంలోని ఒక దశను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘అతని ద్వారాలున్న దేశంలో.’ ఇక్కడ ‘ద్వారాలు’ పట్టణాలను సూచిస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: కరవు
  rationale: విపత్తుల జాబితాలో ఇది సాధారణ ఆకలిని కాక, దేశవ్యాప్త ఆహార కొరతను సూచిస్తుంది.
- source_word: דֶּבֶר
  choice: అంటువ్యాధి
  rationale: వ్యాపించే ప్రాణాంతక వ్యాధిని సూచిస్తుంది; తరువాతి విస్తృత పదమైన נֶגַע నుండి దీనిని వేరుగా ఉంచుతుంది.
- source_word: שִׁדָּפוֹן
  choice: ఎండుతెగులు
  rationale: వేడి లేదా ఎండగాలి వల్ల పంట మాడిపోవడాన్ని సూచించే వ్యవసాయ విపత్తుగా సహజమైన తెలుగు పదాన్ని ఎంచుకున్నాం.
- source_word: יֵרָקוֹן
  choice: పసుపుతెగులు
  rationale: పంట పసుపుబారడం లేదా వాడిపోవడం అనే వ్యవసాయ భావాన్ని వ్యక్తం చేస్తుంది; ఖచ్చితమైన వ్యాధి రకం నిర్ధారితం కాదు.
- source_word: אַרְבֶּה
  choice: మిడతలు
  rationale: సమూహంగా పంటలను నాశనం చేసే మిడతలకు సాధారణ హీబ్రూ పదం; తెలుగులో బహువచనం సహజం.
- source_word: חָסִיל
  choice: పంటను తినివేసే మిడతలు
  rationale: పంటను మింగివేసే కీటకాన్ని సూచిస్తుంది; ఖచ్చితమైన జాతి లేదా మిడత జీవితదశ అనిశ్చితమైనందున వివరణాత్మక పదబంధం వాడి, పాదసూచికలో అనిశ్చితిని నిలిపాం.
- source_word: כִּי יָצַר לוֹ אֹיְבוֹ
  choice: శత్రువు అతన్ని ముట్టడించినా
  rationale: צור అనే క్రియ ఇక్కడ సైనికంగా చుట్టుముట్టి నిర్బంధించడాన్ని సూచిస్తుంది.
- source_word: בְּאֶרֶץ שְׁעָרָיו
  choice: అతని దేశంలోని పట్టణాల్లో
  rationale: అక్షరార్థంగా ‘అతని ద్వారాల దేశంలో’; ‘ద్వారాలు’ పట్టణాలకు లక్షణార్థకంగా వాడబడ్డాయి. ఆధునిక తెలుగులో భావం స్పష్టంగా ఉండేలా ‘పట్టణాల్లో’ అని ఇచ్చాం.
- source_word: כָּל נֶגַע
  choice: ఏ విపత్తు
  rationale: దెబ్బ, పీడ, తెగులు వంటి విస్తృత భావం ఉంది; ముందున్న నిర్దిష్ట అంటువ్యాధితో కలిసిపోకుండా సమగ్ర విపత్తు భావాన్ని నిలుపుతుంది.
- source_word: כָּל מַחֲלָה
  choice: ఏ వ్యాధి
  rationale: అనారోగ్యం లేదా రోగానికి సాధారణ పదం; כָּל యొక్క సమగ్రతను ‘ఏ’ ద్వారా వ్యక్తం చేశాం.
