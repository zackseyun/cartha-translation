translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరతతో కూడిన, సాధారణ పాఠకులకు అర్థమయ్యే విపత్తుల జాబితాగా రూపొందించాం. హీబ్రూ వాక్యంలోని వరుస షరతులను ‘వచ్చినా/ప్రబలినా/పట్టినా’ రూపాలతో నిలిపి, వాక్యం తరువాతి వచనంలో కొనసాగుతుందని చివరి దీర్ఘ విరామచిహ్నంతో సూచించాం.
