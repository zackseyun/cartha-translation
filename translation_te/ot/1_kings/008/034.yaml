source:
  edition: WLC
  text: וְ/אַתָּה֙ תִּשְׁמַ֣ע הַ/שָּׁמַ֔יִם וְ/סָ֣לַחְתָּ֔ לְ/חַטַּ֖את עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וַ/הֲשֵֽׁבֹתָ/ם֙ אֶל הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר נָתַ֖תָּ לַ/אֲבוֹתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/034.yaml
  text: then may you hear in heaven and forgive the sin of your people Israel[c][b][a], and bring them back to the land that you gave to their fathers.
translation:
  language: te
  text: అప్పుడు నీవు పరలోకంలో విని[a], నీ ప్రజలైన ఇశ్రాయేలు చేసిన పాపాన్ని క్షమించి, నీవు వారి పితరులకు[c] ఇచ్చిన దేశానికి వారిని తిరిగి రప్పించు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరలోకం నుండి విని.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారిని ఆ దేశంలో మళ్లీ స్థాపించు.”
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “వారి తండ్రులకు”; అంటే దేవుడు ఆ దేశాన్ని ఇచ్చిన పూర్వపితరులకు.
    reason: cultural_note
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: పరలోకంలో విని
  rationale: మూలంలోని విభక్తి సూచకం లేని నిర్మాణాన్ని దేవుని నివాసస్థలంలో వినడమనే భావంతో సహజమైన ఆధునిక తెలుగులో అందిస్తుంది. שָׁמַיִם రూపరీత్యా బహువచనమైనా, ఈ సందర్భంలో తెలుగు ఏకవచన ‘పరలోకం’ సహజం; ‘పరలోకం నుండి విని’ అనేదీ సాధ్యమైన భావం కాబట్టి పాదటిప్పణిలో ఉంచబడింది.
- source_word: וְסָלַחְתָּ
  choice: క్షమించి
  rationale: סלח ఇక్కడ పాపాన్ని క్షమించడాన్ని సూచిస్తుంది. హీబ్రూ వాక్యంలోని సమన్వయ క్రియాక్రమాన్ని తెలుగులో సహజంగా కొనసాగిస్తుంది.
- source_word: לְחַטַּאת עַמְּךָ יִשְׂרָאֵל
  choice: నీ ప్రజలైన ఇశ్రాయేలు చేసిన పాపాన్ని
  rationale: חַטָּאת ఇక్కడ పాపబలి కాదు, ఇశ్రాయేలు చేసిన పాపం. ‘నీ ప్రజలైన ఇశ్రాయేలు’ అనేది עַמְּךָ יִשְׂרָאֵל లోని గుర్తింపును స్పష్టంగా, సహజంగా తెలుపుతుంది; ‘చేసిన’ అనేది తెలుగులో సంబంధాన్ని సందిగ్ధత లేకుండా చేసే స్వల్ప వ్యాకరణ విస్తరణ.
- source_word: וַהֲשֵׁבֹתָם
  choice: వారిని తిరిగి రప్పించు
  rationale: שוב హిఫీల్ రూపం ‘తిరిగి రావడానికి కారణమవడం’ అనే భావాన్ని ఇస్తుంది. కాబట్టి కేవలం సాధారణ పునరుద్ధరణకన్నా దేశానికి నిజంగా తిరిగి తీసుకురావడాన్ని ఈ పదబంధం స్పష్టంగా ఉంచుతుంది.
- source_word: אֶל הָאֲדָמָה
  choice: దేశానికి
  rationale: אֲדָמָה కు నేల, మట్టి, భూమి అనే అర్థాలు ఉన్నా, ఇక్కడ పితరులకు ఇవ్వబడిన ప్రాదేశిక భూమి ఉద్దేశం; అందువల్ల ‘దేశం’ సందర్భోచితం.
- source_word: אֲשֶׁר נָתַתָּ לַאֲבוֹתָם
  choice: నీవు వారి పితరులకు ఇచ్చిన
  rationale: భూమి వాగ్దానం పొందిన పూర్వపు తండ్రులను సూచించే covenantal భాషను ‘పితరులు’ సంక్షిప్తంగా, గౌరవప్రదంగా కాపాడుతుంది; సాధారణ ‘పూర్వీకులు’ అని లింగభేదాన్ని పూర్తిగా తొలగించదు.
theological_decisions:
- issue: లַאֲבוֹתָם అనే పితృవాగ్దాన పదబంధం
  choice: వారి పితరులకు
  alternative: వారి పూర్వీకులకు
  rationale: సందర్భం భూమి వాగ్దానం పొందిన పితరులను సూచిస్తుంది. ‘పితరులు’ మూలంలోని పురుషలింగ, వాగ్దాన సంబంధ పదప్రయోగాన్ని నిలుపుతూ, నేటి తెలుగులో తక్షణ జన్మతండ్రులకే పరిమితం కాకుండా అర్థమవుతుంది.
- issue: וַהֲשֵׁבֹתָם లోని పునరాగమన భావం
  choice: దేశానికి వారిని తిరిగి రప్పించు
  alternative: వారిని దేశంలో మళ్లీ స్థాపించు
  rationale: ఈ సందర్భంలో తీర్పు వల్ల దేశం వెలుపలికి వెళ్లిన ప్రజలు తిరిగి దేశానికి రావడం ప్రధాన భావం. ఎంపిక చేసిన రూపం స్థలసంబంధమైన కారణార్థక భావాన్ని కాపాడుతుంది; అనంతర సిద్ధాంతవ్యవస్థలను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ప్రార్థనకు తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘పరలోకం’, ‘పితరులు’ వంటి పదాలు గంభీరతను నిలుపుతాయి; మిగతా వాక్యనిర్మాణం ప్రస్తుత వాడుకకు అనుగుణంగా ఉంది.
