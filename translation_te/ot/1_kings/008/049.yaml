translation:
  language: te
  text: అప్పుడు ఆకాశంలోని నీ నివాసస్థలం నుండి వారి ప్రార్థనను, వారి విజ్ఞాపనను ఆలకించి, వారి పక్షంగా న్యాయం చేయుము[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారికి న్యాయం చేయుము’ లేదా ‘వారి వ్యాజ్యాన్ని సమర్థించుము.’ హెబ్రీలో అక్షరార్థంగా ‘వారి న్యాయం/తీర్పు చేయుము’ అని ఉంది; ఇది వారి న్యాయపరమైన పక్షాన చర్య తీసుకోవడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: అప్పుడు ... విని
  rationale: షరతులతో కూడిన ముందరి వాక్యాల కొనసాగింపులో ఇది దేవునికి చేసే విన్నపంగా పనిచేస్తుంది. వావ్‌ను సందర్భానుసారంగా ‘అప్పుడు’ అని ఇచ్చాం.
- source_word: הַשָּׁמַיִם מְכוֹן שִׁבְתְּךָ
  choice: ఆకాశంలో, నీ నివాస స్థలంలో ఉండి
  rationale: ‘ఆకాశం’ దేవుని నివాస పరిధిని సూచిస్తుంది; מְכוֹן స్థిరమైన లేదా ఏర్పాటైన స్థల భావాన్ని కలిగించినా, సహజమైన ఆధునిక తెలుగులో ‘నివాస స్థలం’ ఆ భావాన్ని తగినంతగా అందిస్తుంది. హెబ్రీలో ‘నుండి’ అనే విభక్తి స్పష్టంగా లేనందున ‘ఆకాశం నుండి’ అని ఇవ్వలేదు.
- source_word: תְּפִלָּתָם
  choice: వారి ప్రార్థనను
  rationale: תפלהకు సాధారణమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: תְּחִנָּתָם
  choice: వారి విజ్ఞాపనను
  rationale: కృప లేదా అనుగ్రహం కోరే గాఢమైన విన్నపాన్ని సూచిస్తుంది; ‘ప్రార్థన’తో ఉన్న భావభేదాన్ని నిలుపుతుంది.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: వారి పక్షంగా న్యాయం చేయాలి
  rationale: అక్షరార్థంగా ‘వారి తీర్పు/న్యాయం చేయు’ అనే న్యాయపరమైన నుడికారం, వారి వ్యాజ్యానికి అనుకూలంగా న్యాయంగా చర్య తీసుకోవడం లేదా వారికి న్యాయం కలిగించడం అని అర్థం.
theological_decisions:
- issue: దేవుని ఆకాశ నివాసాన్ని తెలిపే మానవరూపక భాష
  choice: ‘ఆకాశంలో, నీ నివాస స్థలంలో’ అనే చిత్రణను నిలుపడం
  alternative: ‘నీ నివాస స్థలమైన ఆకాశం నుండి’
  rationale: మూలం దేవుని ఆకాశ నివాసాన్ని ఆలయ ప్రార్థనా భాషలో చెబుతుంది. దేవుడు ఆకాశానికే పరిమితుడని అదనపు సిద్ధాంతార్థం చేర్చకుండా ఆ చిత్రణను అలాగే ఉంచాం.
- issue: מִשְׁפָּטָם లోని న్యాయపరమైన భావం
  choice: వారి పక్షంగా న్యాయం చేయాలి
  alternative: వారికి న్యాయం కలిగించాలి / వారిని నిర్దోషులుగా తీర్చాలి
  rationale: వారి వ్యాజ్యాన్ని సమర్థిస్తూ న్యాయంగా చర్య తీసుకోవాలనే భావాన్ని ఉంచుతుంది; వారంతా తప్పనిసరిగా నిర్దోషులనే భావాన్ని పాఠ్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలిని వాడాం. ‘విజ్ఞాపన’ ద్వారా సాధారణ ప్రార్థనకూ కృపకోసం చేసే గాఢ విన్నపానికీ మధ్యనున్న భేదాన్ని నిలిపాం. వాక్యాంతంలోని ‘చేయాలి’ సందర్భంలో ఆజ్ఞకన్నా ప్రార్థనాత్మక అభ్యర్థనగా చదవాలి.
