revisions:
- from: అప్పుడు నీవు ఆకాశంలో, నీ నివాస స్థలంలో ఉండి, వారి ప్రార్థనను, వారి విజ్ఞాపనను విని, వారి పక్షంగా న్యాయం చేయాలి[a].
  to: అప్పుడు ఆకాశంలోని నీ నివాసస్థలం నుండి వారి ప్రార్థనను, వారి విజ్ఞాపనను ఆలకించి, వారి పక్షంగా న్యాయం చేయుము[a].
  rationale: The revision removes the unsupported ‘ఉండి,’ makes the heavenly-dwelling construction natural in Telugu, and replaces the non-petitionary ‘చేయాలి’ with the prayerful imperative ‘చేయుము.’ It retains the prayer/plea distinction and the judicial ambiguity of the final Hebrew idiom.
  reviewer_model: gpt-5.6-terra
