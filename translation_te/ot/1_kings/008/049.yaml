    text: లేదా ‘వారికి న్యాయం చేయుము’ లేదా ‘వారి వ్యాజ్యాన్ని సమర్థించుము.’ హెబ్రీలో అక్షరార్థంగా ‘వారి న్యాయం/తీర్పు చేయుము’ అని ఉంది; ఇది వారి న్యాయపరమైన పక్షాన చర్య తీసుకోవడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
