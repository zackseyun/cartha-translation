  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַתָּ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל יֵאָ֤מֶן נָא֙ דברי/ך אֲשֶׁ֣ר דִּבַּ֔רְתָּ לְ/עַבְדְּ/ךָ֖ דָּוִ֥ד אָבִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/026.yaml
  text: And now[a], God of Israel[b], please let your word that you spoke to your servant David my father be confirmed.
translation:
  language: te
  text: ఇప్పుడు ఇశ్రాయేలు దేవా, దయచేసి నీ సేవకుడైన నా తండ్రి దావీదుతో నీవు పలికిన నీ మాట స్థిరపడుగాక.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “స్థాపించబడుగాక,” “నిజమని నిర్ధారించబడుగాక,” లేదా “నెరవేరుగాక.” హీబ్రూ పదంలో స్థిరత్వం, నిర్ధారణ, నెరవేర్పు అనే భావాలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: ప్రార్థనలో ముందటి మాటను కొనసాగిస్తూ కొత్త విన్నపానికి మారుతున్న భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; హీబ్రూ సంధికారకపు కొనసాగింపు భావం సందర్భంలో అంతర్లీనంగా ఉంటుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవా
  rationale: ఇది ప్రత్యక్ష సంబోధన. తెలుగు సంబోధన రూపం ‘దేవా’ హీబ్రూ నిర్మాణాన్ని సహజంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: יֵאָמֶן נָא
  choice: స్థిరపడుగాక
  rationale: אמן ధాతువు నిఫాల్ రూపంలోని స్థిరత్వం, నిర్ధారణ భావాన్ని నిలుపుతుంది. נָא లోని వినయపూర్వక విన్నప భావాన్ని తెలుగు ఆశీర్వచనాత్మక విన్నప రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: דבריך
  choice: నీ మాట
  rationale: రూపం ‘నీ మాటలు’ అని కూడా అనువదించవచ్చు; అయితే ఇక్కడ దేవుడు పలికిన వాక్యాన్ని సమష్టిగా సూచించడం, ఏకవచన క్రియతో ఉండడం వల్ల తెలుగులో ‘నీ మాట’ సహజంగా ఉంది.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: నీవు పలికిన
  rationale: ‘పలుకు’ అనే సాధారణ క్రియను నేరుగా నిలుపుతుంది; ‘వాగ్దానం చేసిన’ అని అనువదిస్తే సందర్భార్థాన్ని మూలపదంలోకే ముందుగా చేర్చినట్లవుతుంది.
- source_word: לְעַבְדְּךָ
  choice: నీ సేవకుడైన
  rationale: దేవునితో దావీదుకు ఉన్న విధేయతా సంబంధాన్ని, గౌరవపూర్వక రాజప్రార్థనా సందర్భాన్ని ‘సేవకుడు’ సరిగ్గా వ్యక్తం చేస్తుంది.
- source_word: דָּוִד אָבִי
  choice: నా తండ్రి దావీదు
  rationale: హీబ్రూ పదక్రమానికి భిన్నమైనా ఆధునిక తెలుగులో ఇదే సహజమైన అన్వయం; సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: దావీదుతో దేవుడు పలికిన మాట గురించి సొలొమోను చేస్తున్న విన్నప స్వభావం
  choice: ఆ మాట ‘స్థిరపడుగాక’ అని ప్రార్థనగా అనువదించడం
  alternative: ఆ మాట ‘నెరవేరుగాక’ లేదా ‘నిజమని రుజువగుగాక’ అని అనువదించడం
  rationale: హీబ్రూ రూపం దేవుని మాట నెరవేరాలని కోరుతున్నప్పటికీ, אמן ధాతువులోని స్థిరత్వం/నిర్ధారణ భావాన్ని కూడా మోస్తుంది. ‘స్థిరపడుగాక’ ఈ భావాన్ని నిలుపుతూ, నెరవేర్పు ఎలా జరుగుతుందో అదనపు సిద్ధాంతంతో నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలి వాడబడింది. ‘దేవా,’ ‘స్థిరపడుగాక’ వంటి రూపాలు గంభీరతను నిలుపుతూనే సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి.
