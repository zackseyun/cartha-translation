- source_word: עַמִּי אֶת־יִשְׂרָאֵל
  choice: నా ప్రజలైన ఇశ్రాయేలు
  rationale: ‘నా ప్రజలు’ ఎవరంటే ‘ఇశ్రాయేలు’ అని గుర్తించే సమానాధికార నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בָחַרְתִּי
  choice: ఎన్నుకోలేదు / ఎన్నుకున్నాను
  rationale: בחר అనే దైవిక ఎంపికను నేరుగా, వేదాంతపరమైన అదనపు వ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
- source_word: בְעִיר מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాలన్నిటిలో ఏ పట్టణాన్నీ
  rationale: ఏ గోత్రానికి చెందిన పట్టణాన్నీ ఎన్నుకోలేదనే సంక్షిప్త హీబ్రూ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: לִבְנוֹת בַּיִת
  choice: ఒక మందిరాన్ని నిర్మించడానికి
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినప్పటికీ, ఇక్కడ దేవుని ఆరాధనా మందిరాన్ని సూచిస్తుంది; ‘నా నామం అక్కడ ఉండేలా’ అనే మూలపాఠ్య భావాన్ని అలాగే ఉంచుతూ తెలుగులో అపార్థం రాకుండా ‘మందిరం’ వాడబడింది.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: నా నామం అక్కడ ఉండేలా
  rationale: היה యొక్క సరళమైన ‘ఉండు’ భావాన్ని కాపాడుతుంది; ‘నివసించు’ వంటి వ్యాఖ్యానాత్మక విస్తరణను నివారిస్తుంది.
- source_word: וָאֶבְחַר בְּדָוִד
  choice: అయితే ... దావీదును ఎన్నుకున్నాను
  rationale: వావ్‌ను సందర్భంలోని వ్యతిరేక సంబంధానికి అనుగుణంగా ‘అయితే’ అని అనువదించింది; సమన్వయార్థమైన ‘మరియు’ కూడా సాధ్యమని పాదసూచికలో నిలుపుతుంది.
- source_word: לִהְיוֹת עַל־עַמִּי יִשְׂרָאֵל
  choice: నా ప్రజలైన ఇశ్రాయేలుపై ఉండడానికి
  rationale: ‘పై ఉండడం’ అనే మూలపాఠ్య రూపాన్ని నిలుపుతూ, ‘పాలించడానికి’ అని స్పష్టీకరించి మూలంలోని పరిధిని మించకుండా ఉంటుంది.
theological_decisions:
- issue: ‘నా నామం అక్కడ ఉండేలా ఒక మందిరం’ అనే ఆలయ వేదాంతం
  choice: ‘నా నామం అక్కడ ఉండేలా’ అనే హీబ్రూ ప్రయోగాన్ని నిలుపుతూ బַּיִת‌ను సందర్భానుసారంగా ‘మందిరం’గా అనువదించడం
  alternative: ‘నా నామం కోసం ఒక ఇల్లు’ లేదా ‘నా నామం నివసించే ఆలయం’
  rationale: దేవుని నామం ఎంపికైన స్థలంతో అనుబంధించబడే భావాన్ని కాపాడుతుంది; ‘నివసించు’ వంటి మూలంలో లేని వేదాంత విస్తరణను చేర్చదు. ‘మందిరం’ సందర్భార్థాన్ని సాధారణ తెలుగు పాఠకునికి స్పష్టం చేస్తుంది.
- issue: పట్టణాన్ని ఎన్నుకోకపోవడం మరియు దావీదును ఎన్నుకోవడం మధ్య సంబంధం
  choice: వావ్‌ను వ్యతిరేకార్థకంగా ‘అయితే’ అని అనువదించడం
  alternative: ‘మరియు దావీదును ఎన్నుకున్నాను’
  rationale: ఇంతవరకు పట్టణం ఎన్నుకోబడకపోయినా దావీదు ఎన్నుకోబడ్డాడనే సందర్భపరమైన వ్యత్యాసాన్ని సహజంగా చూపుతుంది; సమన్వయ పఠన సాధ్యతను పాదసూచికలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘నా ప్రజలైన ఇశ్రాయేలు’ ఒడంబడిక సంబంధాన్ని, ‘నా నామం అక్కడ ఉండేలా’ మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతాయి. పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధాల వద్ద ఉంచబడ్డాయి.
