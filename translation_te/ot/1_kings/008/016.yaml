  text: מִן הַ/יּ֗וֹם אֲשֶׁ֨ר הוֹצֵ֜אתִי אֶת עַמִּ֣/י אֶת יִשְׂרָאֵל֮ מִ/מִּצְרַיִם֒ לֹֽא בָחַ֣רְתִּי בְ/עִ֗יר מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לִ/בְנ֣וֹת בַּ֔יִת לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וָ/אֶבְחַ֣ר בְּ/דָוִ֔ד לִֽ/הְי֖וֹת עַל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/016.yaml
  text: From the day that I brought my people Israel out of Egypt[a], I have not chosen a city from all the tribes of Israel to build a house for my name to be there[b], but I chose David to be over my people Israel.
translation:
  language: te
  text: “నేను నా ప్రజలైన ఇశ్రాయేలును ఈజిప్టు నుండి బయటకు తీసుకువచ్చిన రోజు మొదలుకొని, నా నామం అక్కడ ఉండేలా ఒక ఇల్లు నిర్మించడానికి ఇశ్రాయేలు గోత్రాలన్నిటిలో ఏ పట్టణాన్నీ నేను ఎన్నుకోలేదు. అయితే నా ప్రజలైన ఇశ్రాయేలుపై ఉండడానికి దావీదును ఎన్నుకున్నాను[a].”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు దావీదును ఎన్నుకున్నాను.” హీబ్రూ సంధిపదాన్ని సమన్వయార్థంలో చదవవచ్చు; అయితే పట్టణాన్ని ఎన్నుకోకపోవడానికి, దావీదును ఎన్నుకోవడానికి మధ్య వ్యత్యాసాన్ని సందర్భం సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “నా నామం అక్కడ ఉండేలా ఒక ఇల్లు” అనేది యెహోవా నామంతో, ఆయన సన్నిధితో అనుబంధించబడిన ఆరాధనా స్థలాన్ని సూచించే హీబ్రూ ప్రయోగం; సందర్భంలో అది ఆలయాన్ని సూచిస్తుంది.
    reason: cultural_note
