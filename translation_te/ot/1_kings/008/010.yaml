source:
  edition: WLC
  text: וַ/יְהִ֕י בְּ/צֵ֥את הַ/כֹּהֲנִ֖ים מִן הַ/קֹּ֑דֶשׁ וְ/הֶ/עָנָ֥ן מָלֵ֖א אֶת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/010.yaml
  text: And when the priests came out from the holy place[a], the cloud filled the house of Yahweh.
translation:
  language: te
  text: యాజకులు పవిత్ర స్థలం[a] నుండి బయటికి వచ్చినప్పుడు, మేఘం యాహ్వే మందిరాన్ని నింపింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పరిశుద్ధస్థలం నుండి’ లేదా ‘పవిత్ర మందిర భాగం నుండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּצֵאת
  choice: బయటికి వచ్చినప్పుడు
  rationale: היהతో కూడిన కథన సంధి, בְּ + יצא క్రియానామ రూపం కలిసి తదుపరి సంఘటనకు కాలసంబంధ ఉపవాక్యాన్ని ఏర్పరుస్తాయి. తెలుగులో ‘వచ్చినప్పుడు’ సహజంగా ఆ భావాన్ని అందిస్తుంది; ‘అప్పుడు జరిగింది’ అని విడిగా అనువదించాల్సిన అవసరం లేదు.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: నిర్దిష్ట బహువచన నామానికి ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: מִן הַקֹּדֶשׁ
  choice: పవిత్ర స్థలం నుండి
  rationale: קֹדֶשׁ అక్షరార్థంగా పవిత్రమైన స్థలం లేదా ప్రదేశాన్ని సూచిస్తుంది. సందర్భంలో ఇది మందిరంలోని పవిత్ర విభాగం; మూలంలోని సాధారణ పదబంధాన్ని సాంకేతిక పదంగా అతిగా నిర్దిష్టం చేయకుండా ఉంచింది.
- source_word: וְהֶעָנָן
  choice: మేఘం
  rationale: నిర్దిష్ట నామవాచకం. తెలుగు కాలసంబంధ వాక్య నిర్మాణంలో సంధికారకమైన וְను ప్రత్యేకంగా ‘మరియు’ అని పలకకపోయినా సంబంధం స్పష్టంగా ఉంటుంది.
- source_word: מָלֵא
  choice: నింపింది
  rationale: מלא Qal సంపూర్ణ క్రియారూపం; ‘మేఘం’ కర్తగా, ‘యాహ్వే మందిరం’ కర్మగా ఉన్నాయి. తెలుగు భూతకాల సకర్మక రూపం మూల వాక్య నిర్మాణాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే మందిరం
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఈ సందర్భంలో యెరూషలేము ఆలయాన్ని సూచిస్తుంది; తెలుగులో ‘మందిరం’ స్పష్టమైనది, సహజమైనది. יְהוָהను వ్యక్తిగత దైవనామంగా ‘యాహ్వే’ అని లిప్యంతరీకరించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాకుండా చతురక్షర దైవనామం నేరుగా ఉంది. ‘యాహ్వే’ దానిని పేరుగా నిలుపుతుంది; ‘ప్రభువు’ పేరు-బిరుదు భేదాన్ని మరుగుపరచవచ్చు, ‘యెహోవా’ తరువాత ఏర్పడిన సాంప్రదాయ రూపం.
- issue: הַקֹּדֶשׁ యొక్క స్థలార్థ నిర్దిష్టత
  choice: పవిత్ర స్థలం
  alternative: పరిశుద్ధస్థలం; గర్భాలయం
  rationale: హీబ్రూ పదం సందర్భంలో పవిత్ర మందిర విభాగాన్ని సూచించినా, ఇక్కడ మరింత సాంకేతిక విభజనను స్పష్టంగా పేర్కొనదు. అందువల్ల మూలంలోని కొంత విస్తృతతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్య నిర్మాణం. ‘మందిరం’ సందర్భస్పష్టత కోసం, ‘పవిత్ర స్థలం’ మూలంలోని అర్థ విస్తృతతను కాపాడేందుకు వాడబడ్డాయి.
