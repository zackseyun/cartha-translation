  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבִ֣אוּ הַ֠/כֹּהֲנִים אֶת אֲר֨וֹן בְּרִית יְהוָ֧ה אֶל מְקוֹמ֛/וֹ אֶל דְּבִ֥יר הַ/בַּ֖יִת אֶל קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים אֶל תַּ֖חַת כַּנְפֵ֥י הַ/כְּרוּבִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/006.yaml
  text: Then the priests brought the ark of the covenant of Yahweh to its place[a], into the inner sanctuary of the house, into the Most Holy Place[b], under the wings of the cherubim.
translation:
  language: te
  text: అప్పుడు యాజకులు యాహ్వే నిబంధన మందసాన్ని దాని స్థానానికి, అంటే ఆలయపు[a] అంతరాలయంలోని అతి పరిశుద్ధ స్థలానికి[b], కెరూబుల రెక్కల కిందికి తీసుకువచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘ఇంటి’; ఇక్కడ అది ఆలయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పరిశుద్ధాతిపరిశుద్ధ స్థలం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: అప్పుడు ... తీసుకువచ్చారు
  rationale: కథన క్రమాన్ని ముందుకు నడిపే wayyiqtol రూపాన్ని సహజమైన ఆధునిక తెలుగులో ‘అప్పుడు’తో వ్యక్తపరిచింది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: ఆలయ సేవకులను సూచించే నిర్దిష్ట బహువచన నామవాచకానికి సాధారణ తెలుగు సమానార్థకం.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: యాహ్వే నిబంధన మందసం
  rationale: హీబ్రూ construct chain భావాన్ని సహజమైన తెలుగు పదక్రమంలో ఉంచి, אֲרוֹןకు బైబిలు సందర్భంలో స్థిరమైన ‘మందసం’ను ఉపయోగించింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ చతురక్షర నామానికి విస్తృతంగా అంగీకరించబడిన లిప్యంతరీకరణను తెలుగులో ఇచ్చింది.
- source_word: מְקוֹמוֹ
  choice: దాని స్థానం
  rationale: ఏకవచన ప్రత్యయం మందసాన్ని సూచిస్తుంది; మూలంలో లేని ‘నియమిత’ లేదా ‘తగిన’ అనే భావాన్ని చేర్చలేదు.
- source_word: דְּבִיר הַבַּיִת
  choice: ఆలయపు అంతరాలయం
  rationale: ఆలయ సందర్భంలో דְּבִיר సూచించే అత్యంత లోపలి గదిని సహజంగా తెలియజేస్తుంది; הַבַּיִתను సందర్భానుసారంగా ‘ఆలయం’గా అనువదించింది.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: అతి పరిశుద్ధ స్థలం
  rationale: హీబ్రూ అతిశయార్థక నిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: תַּחַת
  choice: కిందికి
  rationale: గమ్యస్థానాన్ని సూచించే אֶלతో కూడిన స్థలార్థాన్ని తెలుగు వాక్యనిర్మాణంలో సహజంగా తెలిపింది.
- source_word: כַּנְפֵי הַכְּרוּבִים
  choice: కెరూబుల రెక్కలు
  rationale: ప్రత్యేక ఆలయ జీవరూపాల పేరును లిప్యంతరీకరించి, כַּנְפֵי యొక్క ప్రత్యక్ష అర్థమైన ‘రెక్కలు’ను నిలిపింది.
theological_decisions:
- issue: దైవ నామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: వచనంలో వ్యక్తిగత నామమైన చతురక్షర నామం ప్రత్యక్షంగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా ‘యాహ్వే’గా ఇవ్వడం మూలంలోని నిబంధన నామాన్ని కాపాడుతుంది.
- issue: קֹדֶשׁ הַקֳּדָשִׁים అనే పరిశుద్ధ స్థల నామం
  choice: అతి పరిశుద్ధ స్థలం
  alternative: పరిశుద్ధాతిపరిశుద్ధ స్థలం
  rationale: హీబ్రూ అతిశయార్థాన్ని స్పష్టంగా అందిస్తూ, ఒక ప్రత్యేక సంప్రదాయ పదబంధాన్ని తప్పనిసరి చేయకుండా పాఠకులకు అర్థమయ్యే రూపాన్ని ఎంచుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలిని అనుసరించింది. ‘మందసం,’ ‘యాజకులు,’ ‘అంతరాలయం’ వంటి బైబిలు-ఆలయ సందర్భానికి తగిన పదాలను వాడింది. మూలంలోని వరుస గమ్యపదబంధాలను తెలుగులో సహజంగా చేయడానికి ‘అంటే’ మరియు సంబంధవాచక నిర్మాణాన్ని ఉపయోగించింది; స్థలాల మధ్య ఉన్న సంబంధాన్ని మార్చలేదు.
