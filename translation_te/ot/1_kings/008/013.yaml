source:
  edition: WLC
  text: בָּנֹ֥ה בָנִ֛יתִי בֵּ֥ית זְבֻ֖ל לָ֑/ךְ מָכ֥וֹן לְ/שִׁבְתְּ/ךָ֖ עוֹלָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/013.yaml
  text: I have indeed built you an exalted house[b][a], a settled place for you to dwell forever.
translation:
  language: te
  text: నీ కోసం నిజంగా ఒక మహోన్నతమైన మందిరాన్ని[a] కట్టాను—నీవు శాశ్వతంగా నివసించడానికి స్థిరమైన స్థలాన్ని[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఉన్నతమైన నివాసపు ఇల్లు’; זְבֻל అనే హీబ్రూ పదం ఉన్నతమైన లేదా మహిమాన్వితమైన నివాసాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీ నివాసం కోసం స్థాపించబడిన స్థలాన్ని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנֹה בָנִיתִי
  choice: నిజంగా ... కట్టాను
  rationale: క్రియకు ముందు ఉన్న infinitive absolute నిర్మాణం కార్యాన్ని బలంగా నొక్కిచెబుతుంది. తెలుగులో సహజంగా ఆ ఉద్ఘాటనను ‘నిజంగా’ తెలియజేస్తుంది.
- source_word: בֵּית זְבֻל
  choice: మహోన్నతమైన మందిరం
  rationale: בֵּית అక్షరార్థంగా ‘ఇల్లు’; సందర్భంలో అది దేవాలయాన్ని సూచిస్తుంది. זְבֻל ఉన్నతమైన లేదా మహిమాన్వితమైన నివాసాన్ని సూచిస్తుంది. ‘మహోన్నతమైన మందిరం’ ఈ సందర్భార్థాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
- source_word: לָךְ
  choice: నీ కోసం
  rationale: ఈ విభక్తి ప్రయోజనాన్ని లేదా ఉద్దేశాన్ని సూచిస్తుంది; దేవునికి నేరుగా చేసిన సంబోధనను నిలుపుతుంది.
- source_word: מָכוֹן
  choice: స్థిరమైన స్థలం
  rationale: ఈ పదం స్థాపించబడిన, నిశ్చితమైన స్థలాన్ని సూచిస్తుంది. ‘స్థిరమైన’ అనేది దాని స్థిరత్వ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְשִׁבְתְּךָ
  choice: నీవు ... నివసించడానికి
  rationale: ישׁב అంటే కూర్చోవడం లేదా నివసించడం; దేవాలయ సందర్భంలో సింహాసనాసీనత అనే భావసూచన ఉండవచ్చు. ప్రధాన పాఠంలో ‘నివసించడానికి’ అని ఉంచడం గృహరూపకాన్ని, మూలంలోని సాధారణ అర్థాన్ని కాపాడుతుంది.
- source_word: עוֹלָמִים
  choice: శాశ్వతంగా
  rationale: బహువచన రూపం దీర్ఘకాలిక స్థిరత్వాన్ని బలపరుస్తుంది. ‘శాశ్వతంగా’ ఆధునిక, గౌరవప్రదమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: దేవాలయాన్ని దేవుని శాశ్వత నివాసంగా చెప్పే భాషను వ్యాఖ్యానాత్మకంగా పరిమితం చేయాలా
  choice: దేవుడు నివసించే స్థలమనే మూలభాషను యథాతథ భావంతో నిలుపడం
  alternative: ‘నీ నామం నివసించడానికి’ లేదా ‘నిన్ను ఆరాధించే స్థలంగా’ అని వివరణాత్మకంగా మార్చడం
  rationale: హీబ్రూ పాఠం దేవుడు నివసించడానికి ఇల్లు, స్థలం అని నేరుగా చెబుతుంది. విస్తృత సందర్భం ఆధారంగా ఈ వచనంలో లేని అర్హతలను చేర్చకుండా దాని నిబంధనా-దేవాలయ భాషను నిలుపాలి.
- issue: לְשִׁבְתְּךָలో నివాసం మరియు సింహాసనాసీనత మధ్య భావసంభావ్యత
  choice: ప్రధాన పాఠంలో ‘నివసించడానికి’
  alternative: ‘సింహాసనాసీనుడై ఉండడానికి’
  rationale: ישׁב రెండు భావాలకు అవకాశం ఇస్తుంది; అయితే ‘మందిరం’తో ‘నివసించడం’ నేరుగా సరిపోతుంది. సింహాసనాసీనత భావాన్ని ప్రధాన పాఠంలో తప్పనిసరిగా నిర్ధారించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. దేవునికి ఏకవచన సన్నిహిత సంబోధనను ‘నీ/నీవు’తో నిలిపాం. హీబ్రూ సమాంతర నిర్మాణాన్ని తెలుగు ప్రవాహం కోసం అర్ధవిరామంతో కలిపి, రెండవ భాగంలో సందర్భానుగుణంగా ‘ఏర్పరచాను’ను పూరించాం.
