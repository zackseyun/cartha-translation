source:
  edition: WLC
  text: וַֽ/יַּעֲל֞וּ אֶת אֲר֤וֹן יְהוָה֙ וְ/אֶת אֹ֣הֶל מוֹעֵ֔ד וְ/אֶֽת כָּל כְּלֵ֥י הַ/קֹּ֖דֶשׁ אֲשֶׁ֣ר בָּ/אֹ֑הֶל וַ/יַּעֲל֣וּ אֹתָ֔/ם הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/004.yaml
  text: They brought up the ark of Yahweh[a], the tent of meeting, and all the holy vessels that were in the tent[b]; the priests and the Levites brought them up.
translation:
  language: te
  text: వారు యాహ్వే[a] మందసాన్ని, సమావేశపు గుడారాన్ని, ఆ గుడారంలో ఉన్న పవిత్ర వస్తువులన్నిటినీ పైకి తీసుకొచ్చారు; యాజకులూ లేవీయులూ వాటిని పైకి తీసుకొచ్చారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో దేవుని వ్యక్తిగత నామం ‘యాహ్వే’ ఉంది.
    reason: divine_name
  - marker: b
    text: హీబ్రూ పాఠం అక్షరార్థంగా ‘యాజకులు మరియు లేవీయులు’ అని రెండు వర్గాలనూ పేర్కొంటుంది. కొందరు దీన్ని ‘లేవీయ యాజకులు’ అని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: పైకి తీసుకొచ్చారు
  rationale: హిఫీల్ రూపంలోని עלה ‘పైకి తీసుకురావడం’ అనే దిశాభావాన్ని ఇస్తుంది. ఆలయ పర్వతం వైపు జరిగిన ఊరేగింపు సందర్భంలో ఈ తెలుగు ప్రయోగం సహజంగా ఉండి, మోసిన విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: אֲרוֹן יְהוָה
  choice: యెహోవా మందసం
  rationale: אֲרוֹן ఇక్కడ నిబంధన మందసాన్ని సూచిస్తుంది. יְהוָה అనే దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్ష గుడారం
  rationale: ఇశ్రాయేలీయుల ఆరాధనా గుడారానికి తెలుగులో స్థిరపడి, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన పేరు; ‘సమావేశ గుడారం’ కంటే సహజంగా ఉంది.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: పవిత్రమైన ఉపకరణాలన్నీ
  rationale: כְּלִים పాత్రలు, సామగ్రి, పనిముట్లు వంటి విస్తృతార్థం కలిగిన పదం. ‘ఉపకరణాలు’ ఆ పరిధిని కేవలం పాత్రలకు పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: אֲשֶׁר בָּאֹהֶל
  choice: ఆ గుడారంలో ఉన్న
  rationale: సంబంధవాచక వాక్యం పవిత్ర ఉపకరణాలను విశేషిస్తుంది. ముందే పేర్కొన్న ప్రత్యక్ష గుడారాన్ని సహజంగా తిరిగి సూచించేందుకు ‘ఆ గుడారం’ అన్నాం.
- source_word: וַיַּעֲלוּ אֹתָם
  choice: వాటిని పైకి తీసుకొచ్చారు
  rationale: హీబ్రూ మూలంలోని క్రియ పునరుక్తిని నిలిపి, మొదటి వాక్యభాగంలోని దిశాభావంతో అనుసంధానించాం.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: యాజకులూ లేవీయులూ
  rationale: మూలపాఠం రెండు వర్గాలనూ స్పష్టంగా పేర్కొంటుంది. వాటిని ‘లేవీయ యాజకులు’ అనే ఒకే వర్గంగా వ్యాఖ్యానాత్మకంగా కలపలేదు.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమైన చతురక్షరి నామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో ఉంచాం.
- issue: రవాణా కార్యంలో యాజకులు, లేవీయుల సంబంధం
  choice: రెండు వర్గాలనూ వేరుగా స్పష్టంగా పేర్కొనడం
  alternative: ‘లేవీయ యాజకులు’ అని ఒకే వర్గంగా భావించడం
  rationale: హీబ్రూ పాఠం ‘యాజకులు మరియు లేవీయులు’ అని రెండు పేర్లను ఇస్తుంది. ఇతర వచనాలతో కనిపించే ఉద్రిక్తతను వ్యాఖ్యానంతో తొలగించకుండా మూలంలోని ద్వంద్వ నిర్దేశాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన బైబిలు శైలిని పాటించాం. ‘పైకి తీసుకొచ్చారు’ ద్వారా దిశాభావాన్ని నిలిపి, వారు వాటిని మోసిన నిర్దిష్ట విధానాన్ని ప్రధాన పాఠంలో నిర్ణయించలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
