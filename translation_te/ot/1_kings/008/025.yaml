source:
  edition: WLC
  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁ֠מֹר לְ/עַבְדְּ/ךָ֨ דָוִ֤ד אָבִ/י֙ אֵת֩ אֲשֶׁ֨ר דִּבַּ֤רְתָּ לּ/וֹ֙ לֵ/אמֹ֔ר לֹא יִכָּרֵ֨ת לְ/ךָ֥ אִישׁ֙ מִ/לְּ/פָנַ֔/י יֹשֵׁ֖ב עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל רַ֠ק אִם יִשְׁמְר֨וּ בָנֶ֤י/ךָ אֶת דַּרְכָּ/ם֙ לָ/לֶ֣כֶת לְ/פָנַ֔/י כַּ/אֲשֶׁ֥ר הָלַ֖כְתָּ לְ/פָנָֽ/י׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/025.yaml
  text: And now[a], Yahweh, God of Israel, keep for your servant David my father what you spoke to him, saying, ‘A man shall not be cut off from before me for you, one sitting on the throne of Israel, if only your sons keep their way, by walking before me as you have walked before me.’
translation:
  language: te
  text: 'ఇప్పుడు, ఇశ్రాయేలు దేవుడవైన యెహోవా, నీ సేవకుడైన నా తండ్రి దావీదు కోసం నీవు అతనితో చెప్పిన మాటను నిలబెట్టు. నీవు అతనితో ఇలా అన్నావు: “నీ కుమారులు తమ నడవడిని జాగ్రత్తగా కాపాడుకొని, నీవు నా సన్నిధిలో నడిచినట్లే నా సన్నిధిలో నడిస్తేనే, ఇశ్రాయేలు సింహాసనం మీద కూర్చునే వ్యక్తి నీకు నా సన్నిధిలో లేకుండా పోడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరంగా వాడుకలో ఉన్న ‘యెహోవా’ రూపంలో ఇచ్చాం.
- source_word: שְׁמֹר
  choice: నిలబెట్టు
  rationale: వాగ్దానం సందర్భంలో ఈ క్రియకు ‘కాపాడు’ అనే మూలభావంతో పాటు ‘నెరవేర్చు/నిలబెట్టు’ అనే భావం ఉంది; ఆధునిక తెలుగులో ‘మాటను నిలబెట్టు’ సహజంగా ఉంది.
- source_word: לְעַבְדְּךָ דָוִד אָבִי
  choice: నీ సేవకుడూ నా తండ్రీ అయిన దావీదుతో
  rationale: దావీదు దేవుని సేవకుడని, సొలొమోనుకు తండ్రని తెలిపే రెండు సంబంధాలనూ స్పష్టంగా, సహజంగా ఉంచాం.
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: నీవు చెప్పిన మాటను
  rationale: హీబ్రూలోని ‘అతనితో నీవు పలికినదాన్ని’ అనే భావాన్ని తెలుగు మాటప్రయోగంలో సహజంగా అందిస్తుంది; దాన్ని ముందుగానే ‘వాగ్దానం’ అని వ్యాఖ్యానించదు.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ מִלְּפָנַי
  choice: నా సన్నిధిలో నీకు ఒక పురుషుడు లేకుండా పోడు
  rationale: ‘తొలగింపబడడు/నరికివేయబడడు’ అనే పదశః రూపం తెలుగులో వంశపారంపర్య కొనసాగింపును అస్పష్టంగా చేస్తుంది. ఈ హీబ్రూ నుడికారపు భావమైన ‘నీకు ఒక పురుషుడు కొరవడడు’ను సహజంగా వ్యక్తం చేశాం.
- source_word: יֹשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సింహాసనం మీద కూర్చోవడానికి
  rationale: కర్తృవాచక కృదంతం ఇక్కడ రాజవంశ వారసుడు సింహాసనం మీద కూర్చోవడాన్ని సూచిస్తుంది; ఉద్దేశార్థక తెలుగు రూపం సందర్భానికి సహజం.
- source_word: רַק אִם
  choice: …తేనే
  rationale: వాగ్దానానికి జతచేసిన బలమైన షరతును తెలుగు ప్రత్యయం ‘తేనే’ స్పష్టంగా నిలుపుతుంది.
- source_word: יִשְׁמְרוּ בָנֶיךָ אֶת דַּרְכָּם
  choice: నీ కుమారులు … తమ ప్రవర్తనను జాగ్రత్తగా కాపాడుకుంటేనే
  rationale: ‘తమ మార్గాన్ని కాపాడుకోవడం’ అనే హీబ్రూ నుడికారాన్ని, నైతిక జీవనవిధానాన్ని సూచించే సహజ తెలుగు ‘తమ ప్రవర్తనను జాగ్రత్తగా కాపాడుకోవడం’గా ఇచ్చాం.
- source_word: לָלֶכֶת לְפָנַי כַּאֲשֶׁר הָלַכְתָּ לְפָנָי
  choice: నీవు నా సన్నిధిలో నడిచినట్లే నా సన్నిధిలో నడుస్తూ
  rationale: ‘దేవుని సన్నిధిలో నడవడం’ అనే బైబిలీయ రూపకాన్ని కాపాడుతూ, అది తమ ప్రవర్తనను కాపాడుకునే విధానమని తెలుగులో స్పష్టపరిచాం.
theological_decisions:
- issue: దావీదు వంశానికి ఇచ్చిన వాగ్దానంలోని షరతు
  choice: దావీదు కుమారుల ప్రవర్తనపై స్పష్టమైన షరతుగా అనువదించాం.
  alternative: వాగ్దానం షరతులేనిదని భావించి, ఈ షరతు దాని అనుభవానికి మాత్రమే వర్తిస్తుందని వివరించడం.
  rationale: רַק אִם అనే హీబ్రూ పదబంధం కుమారుల విధేయతను బలమైన షరతుగా నేరుగా ఉంచుతుంది. ఇతర వాక్యాల ఆధారంగా ఈ వచనంలోని ఉద్రిక్తతను పరిష్కరించకుండా అలాగే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవభావం, సాధారణ పాఠకులకు అర్థమయ్యే సహజ వాక్యనిర్మాణం. దైవ నామాన్ని ‘యెహోవా’గా ఉంచాం; పాతకాలపు లేదా అతిగా పదశః రూపాలను నివారించాం.
