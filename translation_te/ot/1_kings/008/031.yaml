  text: אֵת֩ אֲשֶׁ֨ר יֶחֱטָ֥א אִישׁ֙ לְ/רֵעֵ֔/הוּ וְ/נָֽשָׁא ב֥/וֹ אָלָ֖ה לְ/הַֽאֲלֹת֑/וֹ וּ/בָ֗א אָלָ֛ה לִ/פְנֵ֥י מִֽזְבַּחֲ/ךָ֖ בַּ/בַּ֥יִת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/031.yaml
  text: If a man sins against his neighbor[a], and an oath is laid on him to make him swear, and the oath comes before your altar in this house,
translation:
  language: te
  text: ఒకడు తన పొరుగువానిపై పాపం చేస్తే, అతనిచేత ప్రమాణం చేయించడానికి అతనిపై ఒక ప్రమాణం[a] మోపబడి, ఆ ప్రమాణం ఈ మందిరంలో నీ బలిపీఠం ఎదుటికి వస్తే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘శాపం’; హీబ్రూ పదం ప్రమాణాన్నిగానీ, దానిని ఉల్లంఘించినవానిపై పడే శాపాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶחֱטָא
  choice: పాపం చేసినప్పుడు
  rationale: חטא లోని నైతిక, ఆధ్యాత్మిక బలాన్ని నిలుపుతూ, షరతును సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: אִישׁ
  choice: ఒకడు
  rationale: మూలంలోని పుంలింగ ఏకవచన ప్రతినిధి ప్రయోగాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: לְרֵעֵהוּ
  choice: తన పొరుగువానికి విరోధంగా
  rationale: רֵעַ సూచించే తోటి వ్యక్తి లేదా పొరుగువాని భావాన్ని, వ్యక్తుల మధ్య జరిగిన అపరాధ సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְנָשָׂא בוֹ אָלָה
  choice: అతని మీద ప్రమాణం మోపబడి
  rationale: ప్రమాణం అతని మీద విధించబడిందనే హీబ్రూ నిష్క్రియ భావాన్ని నిలుపుతుంది; אָלָה లోని శాపార్థాన్ని పాదసూచికలో భద్రపరుస్తుంది.
- source_word: לְהַאֲלֹתוֹ
  choice: అతనితో ప్రమాణం చేయించడానికి
  rationale: హిఫీల్ క్రియారూపంలోని కారణార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וּבָא אָלָה
  choice: ఆ ప్రమాణం ... ఎదుటికి వస్తే
  rationale: హీబ్రూలో אָלָה వాక్యకర్తగా ఉన్న నిర్మాణాన్ని, దేవుని సన్నిధికి న్యాయపరమైన ప్రమాణం రావడం అనే చిత్రాన్ని నిలుపుతుంది.
- source_word: לִפְנֵי מִזְבַּחֲךָ
  choice: నీ బలిపీఠం ఎదుటికి
  rationale: స్థలార్థంతో పాటు దేవుని సమక్షంలో జరిగే న్యాయపరమైన చర్య భావాన్ని సహజంగా తెలుపుతుంది.
- source_word: בַּבַּיִת הַזֶּה
  choice: ఈ మందిరంలో
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఇక్కడ సొలొమోను నిర్మించిన యెహోవా మందిరాన్ని సూచిస్తుంది; తెలుగులో ‘మందిరం’ సందర్భాన్ని అయోమయం లేకుండా, గౌరవప్రదంగా అందిస్తుంది.
theological_decisions:
- issue: దేవాలయ న్యాయసందర్భంలో אָלָה పదార్థం
  choice: ప్రమాణం
  alternative: శాపం
  rationale: ఈ సందర్భంలో బలిపీఠం ఎదుట చేయించే న్యాయపరమైన ప్రమాణమే ప్రధాన భావం. అయినప్పటికీ ప్రమాణం తప్పితే కలిగే శాపాన్ని కూడా ఈ హీబ్రూ పదం సూచించగలదు; ఆ భావాన్ని పాదసూచికలో ఉంచడం ద్వారా మూలంలోని అర్థ ఉద్రిక్తతను నిలిపాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన న్యాయ-ఆరాధనా శైలి వాడబడింది. వాక్యం తరువాతి వచనంలో కొనసాగే ప్రార్థనా షరతు కావడంతో చివర కామా నిలుపబడింది.
