id: 1KI.8.46
reference: 1 Kings 8:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י יֶֽחֶטְאוּ לָ֗/ךְ כִּ֣י אֵ֤ין אָדָם֙ אֲשֶׁ֣ר לֹא יֶחֱטָ֔א וְ/אָנַפְתָּ֣ בָ֔/ם וּ/נְתַתָּ֖/ם לִ/פְנֵ֣י אוֹיֵ֑ב וְ/שָׁב֤וּ/ם שֹֽׁבֵי/הֶם֙ אֶל אֶ֣רֶץ הָ/אוֹיֵ֔ב רְחוֹקָ֖ה א֥וֹ קְרוֹבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/046.yaml
  text: When they sin against you—for there is no one who does not sin—and you become angry with them and give them over to an enemy[a], and their captors carry them away captive to the land of the enemy, whether far away or near,
translation:
  language: te
  text: వారు నీకు విరోధంగా పాపం చేసినప్పుడు—పాపం చేయని మనిషి ఎవరూ లేరు—నీవు వారిపై కోపపడి, వారిని ఒక శత్రువు చేతికి అప్పగించి, వారిని చెరపట్టినవారు వారిని చెరగా దూరమైనా సమీపమైనా శత్రువు దేశానికి తీసుకుపోయినప్పుడు,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: వారు నీకు విరోధంగా పాపం చేసినప్పుడు
  rationale: ప్రార్థనలో ఊహించబడిన షరతుతో కూడిన సందర్భాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; לָךְలోని సంబంధపరమైన అపరాధ భావాన్ని ‘నీకు విరోధంగా’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֵין אָדָם אֲשֶׁר לֹא יֶחֱטָא
  choice: పాపం చేయని మనిషి ఎవరూ లేరు
  rationale: אָדָם ఇక్కడ సమస్త మానవాళిని సూచించే ఏకవచన సాధారణ పదం. ‘మనిషి ఎవరూ’ అనే రూపం ఆధునిక తెలుగులో సహజంగా ఉండి ఆ విశ్వవ్యాప్త భావాన్ని నిలుపుతుంది.
- source_word: וְאָנַפְתָּ בָם
  choice: నీవు వారిపై కోపపడి
  rationale: దేవుని కోపాన్ని అతిశయింపకుండా నేరుగా తెలియజేస్తూ, తరువాతి క్రియతో సహజంగా అనుసంధానిస్తుంది.
- source_word: וּנְתַתָּם לִפְנֵי אוֹיֵב
  choice: వారిని ఒక శత్రువు చేతికి అప్పగిస్తే
  rationale: נתן לפני అనే సందర్భోచిత ప్రయోగం శత్రువు అధికారానికి అప్పగించడాన్ని సూచిస్తుంది. నిర్దిష్ట ఉపపదం లేని אוֹיֵבను ‘ఒక శత్రువు’గా ప్రతిబింబిస్తుంది.
- source_word: וְשָׁבוּם שֹׁבֵיהֶם
  choice: వారిని చెరపట్టినవారు … వారిని చెరగా తీసుకుపోయినప్పుడు
  rationale: మూలంలోని పదప్రయోగ పునరుక్తిని తెలుగులో అర్థవంతంగా నిలుపుతూ, చెరపట్టినవారే వారిని బందీలుగా తరలించారనే భావాన్ని స్పష్టం చేస్తుంది.
- source_word: אֶל אֶרֶץ הָאוֹיֵב רְחוֹקָה אוֹ קְרוֹבָה
  choice: దూరమైనా సమీపమైనా శత్రుదేశానికి
  rationale: ‘దేశం’తో సంబంధమైన దూరం–సమీపం వ్యత్యాసాన్ని సహజమైన తెలుగు క్రమంలో ఉంచుతుంది; నిర్దిష్టమైన הָאוֹיֵבను సమాసరూపమైన ‘శత్రుదేశం’లో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: אָדָם యొక్క సాధారణ మానవార్థం
  choice: మనిషి
  alternative: మానవుడు / ఎవరైనా
  rationale: ఈ పదం ఇక్కడ పురుషులను మాత్రమే కాక సమస్త మానవాళిని సాధారణంగా సూచిస్తుంది. ‘మనిషి’ ఆధునిక ప్రామాణిక తెలుగులో ఆ సమగ్ర భావాన్ని సహజంగా మోస్తుంది; ప్రత్యేక సిద్ధాంతార్థాన్ని జోడించదు.
- issue: పాపం చేయని వ్యక్తి లేడనే విశ్వవ్యాప్త ప్రకటన
  choice: పాపం చేయని మనిషి ఎవరూ లేరు
  alternative: పాపం చేయని మానవుడు లేడు
  rationale: మూలంలోని నిరాకరణ నిర్మాణాన్ని, మానవ పాపం గురించిన దాని విస్తృత వాదనను తగ్గించకుండా లేదా విస్తరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనకు తగిన గౌరవభరితమైన ‘నీవు’ ప్రయోగం. వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున చివర కామా ఉంచబడింది. మూలంలో నిజమైన పాఠాంతర లేదా వివరణాత్మక అవసరం కనిపించనందున పాదటిప్పణి చేర్చలేదు.
