  naturalness: ‘వారిపై కోపపడి, వారిని ఒక శత్రువు చేతికి అప్పగించి’ అనే క్రియానుసంధానం ప్రార్థనా-వాక్య నిర్మాణంలో సహజంగా ఉంటుంది. ‘వారిని చెరపట్టినవారు వారిని చెరగా’ అనే పునరుక్తి మూలంలోని శబ్దపునరుక్తి/బలప్రయోగాన్ని నిలుపుతుంది; సందర్భానుగుణంగా అర్థమవుతుంది.
