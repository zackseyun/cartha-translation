review_pass:
  verdict: revise
  source_fidelity: The petitionary force is retained, as are hearing in heaven, forgiveness, divine action, recompense according to each person's ways, and God's exclusive knowledge of every human heart. However, the draft turns the relative clause 'whose heart you know' into an explicit causal clause ('ఎందుకంటే'), which is more interpretive than the Hebrew syntax warrants. 'ప్రతిఫలమివ్వు' also narrows the broad verb 'give' toward recompense.
  naturalness: ‘కార్యం చేసి’ is not idiomatic modern Telugu in this prayer sequence. A simple coordinated participial chain ending in ‘ఇవ్వు’ is natural and suitably dignified.
  terminology: ‘పరలోకం,’ ‘క్షమించి,’ ‘హృదయం,’ and ‘మార్గాలు’ suit the register. ‘మనుష్యులందరి’ naturally communicates the inclusive idiomatic sense of כָּל בְּנֵי הָאָדָם; the footnote appropriately records the source expression.
  issues:
  - severity: medium
    issue: The relative clause is rendered as a causal clause.
    rationale: ‘ఎందుకంటే అతని హృదయం నీకు తెలుసు’ imposes a causal connection where the Hebrew first has a relative qualification, followed by a separate explanatory כִּי clause. The revision keeps the qualification in a natural Telugu construction.
  - severity: medium
    issue: ‘ప్రతిఫలమివ్వు’ over-specifies the verb.
    rationale: וְנָתַתָּ means ‘give.’ In this context it can imply a fitting response, but ‘ప్రతిఫలం’ can sound more explicitly judicial or retributive than the source requires. ‘ఇవ్వు’ preserves the breadth.
  - severity: low
    issue: ‘కార్యం చేసి’ is stiff and unnatural.
    rationale: The broad Hebrew ‘act/do’ is adequately and more naturally represented by ‘చేసి’ in the coordinated prayer request.
  revised_text: అప్పుడు నీవు నీ నివాసస్థలమైన పరలోకంలో విని, క్షమించి, చేసి, ప్రతి మనిషికి—అతని హృదయం నీకు తెలిసినవాడికి—అతని మార్గాలన్నిటి చొప్పున ఇవ్వు. ఎందుకంటే మనుష్యులందరి[a] హృదయాలను ఎరిగినవాడవు నీవొక్కడివే.
