reference: 1 Kings 8:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ֠/אַתָּה תִּשְׁמַ֨ע הַ/שָּׁמַ֜יִם מְכ֤וֹן שִׁבְתֶּ֨/ךָ֙ וְ/סָלַחְתָּ֣ וְ/עָשִׂ֔יתָ וְ/נָתַתָּ֤ לָ/אִישׁ֙ כְּ/כָל דְּרָכָ֔י/ו אֲשֶׁ֥ר תֵּדַ֖ע אֶת לְבָב֑/וֹ כִּֽי אַתָּ֤ה יָדַ֨עְתָּ֙ לְ/בַדְּ/ךָ֔ אֶת לְבַ֖ב כָּל בְּנֵ֥י הָ/אָדָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/039.yaml
  text: then may you hear in heaven[a], the place where you dwell, and forgive, and act, and give to each man according to all his ways, whose heart you know—for you alone know the heart of all the sons of man—
translation:
  language: te
  text: అప్పుడు నీవు నీ నివాసస్థలమైన పరలోకంలో విని, క్షమించి, చేసి, ప్రతి మనిషికి—అతని హృదయం నీకు తెలిసినవాడికి—అతని మార్గాలన్నిటి చొప్పున ఇవ్వు. ఎందుకంటే మనుష్యులందరి[a] హృదయాలను ఎరిగినవాడవు నీవొక్కడివే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో పదశః, ‘మనుష్య కుమారులందరి’; ఇది సమస్త మానవులను సూచించే జాతీయం.
    reason: మూలభాషలోని లింగసూచక జాతీయ రూపాన్ని తెలియజేస్తూ, అది పురుషులకు మాత్రమే పరిమితం కాదని స్పష్టం చేయడం.
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: విని
  rationale: ప్రార్థనా సందర్భంలో ఇది సాధారణ భవిష్యత్తు కాక, దేవునికి చేసే విన్నపం. తరువాతి క్రియలతో సహజంగా కలిసేలా ‘విని’ అని అనువదించబడింది.
- source_word: הַשָּׁמַיִם מְכוֹן שִׁבְתֶּךָ
  choice: నీ నివాసస్థలమైన పరలోకంలో
  rationale: ‘ఆకాశాలు, నీ నివాస స్థానం’ అనే మూలభాషా భావాన్ని ఆధునిక తెలుగులో సహజమైన స్థానార్థక నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: וְסָלַחְתָּ וְעָשִׂיתָ
  choice: క్షమించి, కార్యం చేసి
  rationale: వరుసగా కోరబడుతున్న దేవుని చర్యలను నిలుపుతుంది. עָשָׂה అనే విస్తృతార్థక క్రియను అనవసరంగా నిర్దిష్టం చేయకుండా ‘కార్యం చేసి’ అని ఇచ్చాం.
- source_word: וְנָתַתָּ לָאִישׁ כְּכָל דְּרָכָיו
  choice: ప్రతి మనిషికి అతని మార్గాలన్నిటిని బట్టి ప్రతిఫలమివ్వు
  rationale: לָאִישׁ యొక్క పంపిణీ భావాన్ని ‘ప్రతి మనిషికి’ అని, דְּרָכָיו లోని నైతిక ప్రవర్తన భావాన్ని బైబిలు రూపకమైన ‘మార్గాలు’తో నిలిపాం. సందర్భంలో ‘ఇవ్వు’ అనేది ప్రవర్తనకు తగిన ప్రతిచర్యను సూచించేందున ‘ప్రతిఫలమివ్వు’ అని స్పష్టం చేశాం.
- source_word: אֲשֶׁר תֵּדַע אֶת לְבָבוֹ
  choice: ఎందుకంటే అతని హృదయం నీకు తెలుసు
  rationale: దేవుడు ప్రతి వ్యక్తి హృదయాన్ని ఎరుగుతాడనే కారణార్థ సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְבָב / לְבָבוֹ
  choice: హృదయం / హృదయాలు
  rationale: ఇది భావోద్వేగాలకే కాక ఆలోచన, సంకల్పం సహా అంతరంగ వ్యక్తిని సూచించినా, మూలంలోని బైబిలు రూపకాన్ని ‘హృదయం’ సరిగ్గా నిలుపుతుంది.
- source_word: לְבַדְּךָ
  choice: నీవొక్కడివే
  rationale: మానవ హృదయాల సంపూర్ణ జ్ఞానం దేవునికే ప్రత్యేకమనే ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כָּל בְּנֵי הָאָדָם
  choice: మనుష్యులందరి[a]
  rationale: ఈ హీబ్రూ జాతీయాన్ని పదానువాదం వల్ల కలిగే అపార్థం లేకుండా సమస్త మానవులను సూచించే సహజ తెలుగు రూపంలో ఇచ్చి, మూలరూపాన్ని పాదటిప్పణిలో తెలిపాం.
theological_decisions:
- issue: మనిషి మార్గాలను బట్టి దేవుడు ఇచ్చేది
  choice: ప్రతిఫలమివ్వు
  alternative: ఇవ్వు
  rationale: మూలక్రియ సాధారణంగా ‘ఇవ్వు’ అని అర్థమైనా, ‘మార్గాలను బట్టి’ అనే సందర్భం తీర్పు లేదా తగిన ప్రతిచర్యను సూచిస్తుంది. ‘ప్రతిఫలం’ శుభమో అశుభమో ముందే నిర్ణయించదు.
- issue: హృదయాన్ని ఎరిగే దేవుని ప్రత్యేకత
  choice: మనుష్యులందరి హృదయాలను ఎరిగినవాడవు నీవొక్కడివే
  alternative: మానవుల హృదయాలను నీవు మాత్రమే తెలుసు
  rationale: לְבַדְּךָ లోని ప్రత్యేక ఉద్ఘాటనను నిలుపుతూ, దేవుని జ్ఞానం కేవలం భావోద్వేగాలకే పరిమితం కాక అంతరంగమంతటికీ సంబంధించినదనే మూల రూపకాన్ని సంరక్షిస్తుంది.
- issue: כָּל בְּנֵי הָאָדָם లోని మానవశాస్త్ర సంబంధమైన వ్యక్తీకరణ
  choice: మనుష్యులందరి[a]
  alternative: మనుష్య కుమారులందరి
  rationale: పదశః రూపం తెలుగులో పురుషుల కుమారులను మాత్రమే సూచిస్తున్నట్లు అపార్థం కలిగించవచ్చు. మూల జాతీయం సమస్త మానవులను సూచిస్తుందని ప్రధాన పాఠ్యంలో సహజంగా ఇచ్చి, దాని హీబ్రూ రూపాన్ని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ప్రార్థనకు తగిన గంభీరతను నిలిపాం. ‘పరలోకం’, ‘హృదయం’, ‘మార్గాలు’ వంటి పరిచిత బైబిలు పదాలను ఉంచి, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా తీర్చిదిద్దాం.
