revisions:
- from: అప్పుడు నీవు నీ నివాసస్థలమైన పరలోకంలో విని, క్షమించి, కార్యం చేసి, ప్రతి మనిషికి అతని మార్గాలన్నిటిని బట్టి ప్రతిఫలమివ్వు. ఎందుకంటే అతని హృదయం నీకు తెలుసు; మనుష్యులందరి[a] హృదయాలను ఎరిగినవాడవు నీవొక్కడివే.
  to: అప్పుడు నీవు నీ నివాసస్థలమైన పరలోకంలో విని, క్షమించి, చేసి, ప్రతి మనిషికి—అతని హృదయం నీకు తెలిసినవాడికి—అతని మార్గాలన్నిటి చొప్పున ఇవ్వు. ఎందుకంటే మనుష్యులందరి[a] హృదయాలను ఎరిగినవాడవు నీవొక్కడివే.
  rationale: The revision removes the overly causal rendering of the first heart clause, retains the source verb’s semantic breadth, and improves the Telugu flow. The dash marks the qualifying clause without introducing a doctrinal or causal interpretation. The final explanatory ‘ఎందుకంటే’ corresponds to כִּי, and the footnote anchor remains correctly attached to the collective human expression.
