base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/048.yaml
  text: and they return to you with all their heart and with all their soul in the land of their enemies who took them captive[a], and pray to you toward their land that you gave to their fathers, the city that you chose, and the house that I have built for your name[c][b],
translation:
  language: te
  text: తమను చెరపట్టిన శత్రువుల దేశంలో వారు తమ హృదయమంతటితో, తమ ప్రాణమంతటితో నీ వైపు తిరిగి[a], నీవు తమ పితరులకు ఇచ్చిన తమ దేశం వైపుగా[b]—నీవు ఎన్నుకున్న పట్టణం వైపుగా, నీ నామం కోసం నేను కట్టిన మందిరం[c] వైపుగా—నీకు ప్రార్థిస్తే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ దగ్గరకు తిరిగి వచ్చి.” ఈ సందర్భంలో ఈ మాట పశ్చాత్తాపపడటం అనే భావాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, తమ దేశం ఉన్న దిశకు ముఖం చేసి.
    reason: lexical_alternative
  - marker: c
    text: అంటే, నీ నామానికి అంకితం చేసిన మందిరం.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: నీ వైపు తిరిగి
  rationale: שׁוּב యొక్క ప్రాథమిక దిశాత్మక భావమైన ‘తిరుగు/తిరిగి రా’ను నిలుపుతుంది; ఈ సందర్భంలోని పశ్చాత్తాప భావాన్ని ప్రధాన పాఠ్యంలో అతిగా స్పష్టీకరించదు.
- source_word: בְּכָל לְבָבָם וּבְכָל נַפְשָׁם
  choice: తమ హృదయమంతటితో, తమ ప్రాణమంతటితో
  rationale: సంపూర్ణ అంకితభావాన్ని తెలిపే హెబ్రీయ సమాంతర పదబంధాన్ని, హృదయం–ప్రాణం అనే మూల రూపకాలతో సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בְּאֶרֶץ אֹיְבֵיהֶם אֲשֶׁר שָׁבוּ אֹתָם
  choice: తమను చెరపట్టిన శత్రువుల దేశంలో
  rationale: שׁבה యొక్క ‘చెరపట్టు’ భావాన్ని స్పష్టంగా తెలియజేస్తూ, అֶרֶץ‌ను తరువాతి ‘దేశం’తో అనుసంధానిస్తుంది.
- source_word: וְהִתְפַּלְלוּ אֵלֶיךָ
  choice: నీకు ప్రార్థిస్తే
  rationale: షరతును కొనసాగించే విస్తృత వాక్యనిర్మాణానికి సరిపోయే సహజ తెలుగు రూపం; ప్రార్థన దేవునికే ఉద్దేశించబడినదని నిలుపుతుంది.
- source_word: דֶּרֶךְ אַרְצָם
  choice: తమ దేశం వైపుగా
  rationale: דֶּרֶךְ ఇక్కడ సూచించే భౌగోళిక దిశను ‘వైపుగా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבוֹתָם
  choice: నీవు తమ పితరులకు ఇచ్చిన
  rationale: ఒడంబడిక సంబంధమైన ‘పితరులు’ అనే నిర్దిష్ట మూలపద భావాన్ని నిలుపుతుంది.
- source_word: הָעִיר אֲשֶׁר בָּחַרְתָּ
  choice: నీవు ఎన్నుకున్న పట్టణం
  rationale: దైవిక ఎంపికను అదనపు సిద్ధాంతార్థం చేర్చకుండా సూటిగా వ్యక్తం చేస్తుంది.
- source_word: וְהַבַּיִת אֲשֶׁר בנית לִשְׁמֶךָ
  choice: నీ నామం కోసం నేను కట్టిన మందిరం
  rationale: సొలొమోను వక్తగా ఉన్న సందర్భానికి సరిపోయే మొదటి పురుష ఏకవచనమైన ‘నేను కట్టిన’ను నిలుపుతుంది. בַּיִת ఇక్కడ దేవాలయాన్ని సూచించేందున సాధారణ పాఠకునికి సహజమైన ‘మందిరం’ వాడబడింది; ‘నీ నామం కోసం’ అనే ఒడంబడిక పదబంధం అలాగే ఉంచబడింది.
theological_decisions:
- issue: וְשָׁבוּ אֵלֶיךָలో ఒడంబడిక పశ్చాత్తాప భావం
  choice: ‘నీ వైపు తిరిగి’ అని అనువదించడం
  alternative: ‘నీ ఎదుట పశ్చాత్తాపపడి’
  rationale: మూల క్రియ సంబంధపూర్వకంగా, దిశాత్మకంగా ‘నీ వైపు తిరగడం’ను చెబుతుంది; సందర్భంలో పశ్చాత్తాపం అంతర్భూతమైనా దానిని ప్రధాన పాఠ్యంలో మాత్రమే అర్థంగా నిర్ణయించకూడదు.
- issue: בניתలో మందిరాన్ని కట్టిన వ్యక్తి
  choice: 'మొదటి పురుష ఏకవచనం: ‘నేను కట్టిన’'
  alternative: ‘కట్టబడిన’ లేదా ‘వారు కట్టిన’
  rationale: మసొరెటిక్ వ్యంజన పాఠం మరియు సొలొమోను ప్రార్థన సందర్భం మొదటి పురుష ఏకవచన పఠనానికి సహజంగా సరిపోతాయి.
- issue: ‘నీ నామం కోసం’ అనే పదబంధం
  choice: మూల నామ-భాషను యథాతథంగా నిలుపడం
  alternative: ‘నీకు అంకితం చేసిన’
  rationale: అంకిత భావం సందర్భంలో ఉన్నప్పటికీ, ‘నామం’ అనే ముఖ్యమైన ధార్మిక రూపకాన్ని వివరణతో భర్తీ చేయకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలి వాడబడింది. దీర్ఘమైన హెబ్రీయ వాక్యంలో ప్రార్థన దిశను చూపే మూడు భాగాలు స్పష్టంగా కనిపించేందుకు డ్యాష్‌లు ఉపయోగించబడ్డాయి. ‘హృదయమంతటితో, ప్రాణమంతటితో’ సాధారణ పాఠకునికి సహజంగా ఉండి మూలంలోని సమాంతర రూపకాన్ని కాపాడుతుంది.
