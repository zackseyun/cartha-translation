revisions:
- from: యెహోవా ఎదుట నేను విన్నవించిన ఈ నా మాటలు రాత్రింబగళ్లు మన దేవుడైన యెహోవాకు సమీపంగా ఉండుగాక[a]. తద్వారా ఆయన తన సేవకునికి, తన ప్రజలైన ఇశ్రాయేలుకు న్యాయం జరిగిస్తూ[b], ప్రతి రోజూ ఆ రోజుకు అవసరమైనదాన్ని చేయుగాక[c].
  to: నేను యెహోవా ఎదుట విన్నవించిన ఈ నా మాటలు మన దేవుడైన యెహోవాకు పగలూరాత్రీ సమీపంలో ఉండుగాక[a], తద్వారా ఆయన తన సేవకుని న్యాయమైన పక్షాన్ని, తన ప్రజలైన ఇశ్రాయేలు న్యాయమైన పక్షాన్ని ప్రతి రోజూ ఆ రోజుకు తగినట్లుగా నిలబెట్టుగాక[b][c].
  rationale: మూల వాక్యంలోని న్యాయపరమైన సమాంతర కర్మలను (‘తన సేవకుని ... తన ప్రజలైన ఇశ్రాయేలు ...’) స్పష్టంగా పునరుద్ధరించాం. ‘ప్రతి రోజూ ఆ రోజుకు తగినట్లుగా’ అనే దినదిన పంపిణీ భావాన్ని ఆ న్యాయాన్ని నిలబెట్టే చర్యకు అనుసంధానించాం. ప్రార్థనాత్మక ‘ఉండుగాక/నిలబెట్టుగాక’ రూపాలు, దైవనామం, మరియు విన్నపభావం యథాతథంగా ఉంచబడ్డాయి.
