source:
  edition: WLC
  text: וְ/יִֽהְי֨וּ דְבָרַ֜/י אֵ֗לֶּה אֲשֶׁ֤ר הִתְחַנַּ֨נְתִּי֙ לִ/פְנֵ֣י יְהוָ֔ה קְרֹבִ֛ים אֶל יְהוָ֥ה אֱלֹהֵ֖י/נוּ יוֹמָ֣ם וָ/לָ֑יְלָה לַ/עֲשׂ֣וֹת מִשְׁפַּ֣ט עַבְדּ֗/וֹ וּ/מִשְׁפַּ֛ט עַמּ֥/וֹ יִשְׂרָאֵ֖ל דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/059.yaml
  text: And may these words of mine[a], with which I have pleaded before Yahweh, be near Yahweh our God day and night, that he may uphold the cause of his servant and the cause of his people Israel, as each day requires[c][b],
translation:
  language: te
  text: నేను యెహోవా ఎదుట విన్నవించిన ఈ నా మాటలు మన దేవుడైన యెహోవాకు పగలూరాత్రీ సమీపంలో ఉండుగాక[a], తద్వారా ఆయన తన సేవకుని న్యాయమైన పక్షాన్ని, తన ప్రజలైన ఇశ్రాయేలు న్యాయమైన పక్షాన్ని ప్రతి రోజూ ఆ రోజుకు తగినట్లుగా నిలబెట్టుగాక[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘మన దేవుడైన యెహోవాకు దగ్గరగా ఉండుగాక’; ఈ విన్నపపు మాటలు దేవుని ఎదుట నిరంతరం నిలిచి ఉండాలనే భావం.
    reason: lexical_alternative
  - marker: b
    text: ‘వారి పక్షాన్ని నిలబెట్టడం,’ ‘వారి హక్కును కాపాడడం,’ లేదా ‘వారి కోసం న్యాయం చేయడం’ అని కూడా అనువదించవచ్చు; హీబ్రూ నుడికారం ఒకరి న్యాయమైన పక్షాన్ని నిర్వహించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: 'హీబ్రూ అక్షరార్థం: ‘ఒక రోజు విషయాన్ని దాని రోజులో’; అంటే ప్రతి రోజుకు తగిన అవసరాన్ని ఆ రోజే నెరవేర్చడం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִהְיוּ
  choice: ఉండుగాక
  rationale: ఈ సందర్భంలోని సంకల్పార్థక రూపం సాధారణ భవిష్యత్తును కాక ప్రార్థనాపూర్వకమైన కోరికను వ్యక్తం చేస్తుంది.
- source_word: דְבָרַי אֵלֶּה
  choice: ఈ నా మాటలు
  rationale: సొలొమోను పలికిన విన్నపపు మాటలనే నేరుగా, సహజమైన తెలుగు స్వామ్య నిర్మాణంతో సూచిస్తుంది.
- source_word: אֲשֶׁר הִתְחַנַּנְתִּי
  choice: నేను విన్నవించిన
  rationale: חנן హిత్పయేల్ రూపంలోని earnest supplication భావాన్ని ‘ప్రార్థించిన’ కంటే ‘విన్నవించిన’ స్పష్టంగా అందిస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యెహోవా ఎదుట
  rationale: దేవుని సన్నిధిలో చేసిన విన్నపాన్ని తెలిపే హీబ్రూ నుడికారానికి సహజమైన తెలుగు రూపం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా అందిస్తుంది.
- source_word: קְרֹבִים אֶל יְהוָה אֱלֹהֵינוּ
  choice: మన దేవుడైన యెహోవాకు సమీపంగా
  rationale: קְרֹבִים అనే ‘దగ్గరగా/సమీపంగా’ భావాన్ని నిలుపుతూ, ప్రార్థనా మాటలు దేవుని దృష్టిలో నిరంతరం ఉండాలనే చిత్రాన్ని కాపాడుతుంది.
- source_word: יוֹמָם וָלָיְלָה
  choice: రాత్రింబగళ్లు
  rationale: నిరంతర కాలాన్ని తెలిపే ‘పగలూ రాత్రీ’ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: לַעֲשׂוֹת מִשְׁפַּט
  choice: న్యాయం జరిగిస్తూ
  rationale: ఒకరి న్యాయమైన పక్షాన్ని నిలబెట్టడం లేదా వారి విషయంలో న్యాయం చేయడం అనే న్యాయపరమైన నుడికార భావాన్ని తెలియజేస్తుంది.
- source_word: עַבְדּוֹ
  choice: తన సేవకునికి
  rationale: రాజైన సొలొమోను దేవునితో తన సంబంధాన్ని చెప్పే ప్రార్థనా సందర్భంలో ‘సేవకుడు’ తగిన తెలుగు పదం.
- source_word: וּמִשְׁפַּט עַמּוֹ יִשְׂרָאֵל
  choice: తన ప్రజలైన ఇశ్రాయేలుకు న్యాయం జరిగిస్తూ
  rationale: ముందటి מִשְׁפַּט పదంతో సమాంతరతను నిలుపుతూ, ఇశ్రాయేలు పక్షాన దేవుడు న్యాయం చేయాలనే భావాన్ని స్పష్టం చేస్తుంది.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: ప్రతి రోజూ ఆ రోజుకు అవసరమైనదాన్ని
  rationale: అక్షరార్థంగా ‘ఒక రోజు విషయం దాని రోజులో’ అనే పంపిణీ భావాన్ని, ప్రతి రోజుకు తగిన అవసరంగా సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత ఒడంబడిక నామమైన יהוהను వాడుతుంది; దానిని బిరుదుగా మార్చకుండా తెలుగులో ప్రాచుర్యం పొందిన లిప్యంతరీకరణతో నిలిపాం.
- issue: מִשְׁפַּט యొక్క న్యాయపరమైన భావం
  choice: న్యాయం జరిగించడం
  alternative: వ్యాజ్యాన్ని సమర్థించడం / హక్కును నిలబెట్టడం
  rationale: ఈ పదం కేవలం శిక్షాతీర్పును కాక సేవకుని, ప్రజల న్యాయమైన పక్షాన్ని దేవుడు నిర్వహించడాన్ని సూచించగలదు; అందువల్ల విస్తృతమైన న్యాయభావాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన ప్రార్థనా శైలిని వాడాం. ‘ఉండుగాక/చేయుగాక’ రూపాలు మూలంలోని ప్రార్థనాత్మక కోరికను నిలుపుతాయి; క్లిష్టమైన న్యాయపరమైన నుడికారాన్ని సాధారణ పాఠకులకు అర్థమయ్యేలా ‘న్యాయం జరిగించడం’గా ఇచ్చాం.
