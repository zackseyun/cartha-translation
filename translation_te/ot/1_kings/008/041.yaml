  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/גַם֙ אֶל הַ/נָּכְרִ֔י אֲשֶׁ֛ר לֹא מֵ/עַמְּ/ךָ֥ יִשְׂרָאֵ֖ל ה֑וּא וּ/בָ֛א מֵ/אֶ֥רֶץ רְחוֹקָ֖ה לְמַ֥עַן שְׁמֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/041.yaml
  text: And also concerning the foreigner[a], who is not from your people Israel, but comes from a distant land for the sake of your name—
translation:
  language: te
  text: అలాగే, నీ ప్రజలైన ఇశ్రాయేలుకు చెందినవాడు కాని విదేశీయుడు[a] నీ నామం నిమిత్తం దూరదేశం నుండి వచ్చినప్పుడు—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పరదేశి,’ ‘బయటివాడు.’ హీబ్రూ పదం కేవలం ప్రయాణికుణ్ణి కాక, ఇశ్రాయేలీయుడు కాని వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: అలాగే
  rationale: ముందున్న ప్రార్థనా విన్నపాలకు ఈ సందర్భాన్ని జోడించే సంధాన, ఉద్ఘాటన భావాలను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֶל הַנָּכְרִי
  choice: విదేశీయుడు
  rationale: אֶל ఇక్కడ తదుపరి వాక్యాలతో కొనసాగే ప్రార్థనలో పరిశీలిస్తున్న వ్యక్తిని పరిచయం చేస్తుంది; తెలుగు వాక్యనిర్మాణంలో ప్రత్యేకంగా ‘గురించి’ అని చేర్చకుండా వ్యక్తిని నేరుగా ఉంచడం సహజం. נָכְרִי ఇశ్రాయేలీయుడు కాని వ్యక్తిని సూచిస్తుంది.
- source_word: אֲשֶׁר לֹא מֵעַמְּךָ יִשְׂרָאֵל הוּא
  choice: నీ ప్రజలైన ఇశ్రాయేలుకు చెందినవాడు కాని
  rationale: ఇశ్రాయేలు దేవుని ప్రజలనే నిబంధనాత్మక సూచనను, అలాగే ఆ విదేశీయుడు వారిలోనివాడు కాదనే భేదాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וּבָא
  choice: వచ్చినప్పుడు
  rationale: హీబ్రూ సంపూర్ణ క్రియ ఈ పొడవైన షరతుసంబంధ ప్రార్థనా నిర్మాణంలో సందర్భాన్ని ముందుకు తీసుకెళ్తుంది; తెలుగులో ‘వచ్చినప్పుడు’ తదుపరి వచనాలతో అనుసంధానాన్ని సహజంగా చూపుతుంది. వావ్‌ను బలమైన వ్యతిరేకార్థక ‘కాని’గా మార్చదు.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: దూరదేశం నుండి
  rationale: భౌగోళిక దూరాన్ని సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְמַעַן שְׁמֶךָ
  choice: నీ నామాన్ని బట్టి
  rationale: దేవుని వెల్లడైన ఖ్యాతి, ఘనత కారణంగా అతడు రావడాన్ని తెలియజేస్తూ ‘నామం’ అనే బైబిలు దైవశాస్త్రీయ పదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఇశ్రాయేలు ప్రజలకు, ఇశ్రాయేలీయుడు కాని ప్రార్థకునికి మధ్య నిబంధనాత్మక భేదం
  choice: నీ ప్రజలైన ఇశ్రాయేలుకు చెందినవాడు కాని విదేశీయుడు
  alternative: నీ ప్రజలైన ఇశ్రాయేలులోనివాడు కాని పరదేశి
  rationale: ఇశ్రాయేలు దేవుని ప్రజలని వచనం చెప్పే విధానాన్నీ, విదేశీయుడు ఆ సమూహానికి చెందనివాడనే అంశాన్నీ తగ్గించకుండా ఉంచుతుంది; అయినా అతడు దేవుని నామాన్ని బట్టి రావచ్చనే వచనంలోని ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనా సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ఈ వచనం తరువాతి వాక్యాల్లో కొనసాగుతుంది కాబట్టి చివర దీర్ఘ విరామచిహ్నం ఉంచబడింది.
