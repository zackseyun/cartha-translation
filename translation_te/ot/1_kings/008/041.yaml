  terminology: ‘విదేశీయుడు’ appropriately renders the non-Israelite sense of הַנָּכְרִי. The note’s alternatives and explanation are accurate. ‘నీ ప్రజలైన ఇశ్రాయేలు’ properly retains the covenantal designation without importing further interpretation.
  issues:
