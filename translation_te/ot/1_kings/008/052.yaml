  text: לִ/הְי֨וֹת עֵינֶ֤י/ךָ פְתֻחוֹת֙ אֶל תְּחִנַּ֣ת עַבְדְּ/ךָ֔ וְ/אֶל תְּחִנַּ֖ת עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל לִ/שְׁמֹ֣עַ אֲלֵי/הֶ֔ם בְּ/כֹ֖ל קָרְאָ֥/ם אֵלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/052.yaml
  text: that your eyes may be open to the plea of your servant and to the plea of your people Israel[b][a], to listen to them whenever they call to you.
translation:
  language: te
  text: నీ సేవకుని విన్నపం[a] పట్లను, నీ ప్రజలైన ఇశ్రాయేలు విన్నపం పట్లను నీ కన్నులు తెరిచి ఉండునట్లుగా, వారు నిన్ను పిలిచిన ప్రతిసారీ వారిని ఆలకించడానికి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వేడుకోలు.’ హీబ్రూ పదం అనుగ్రహం లేదా కనికరం కోసం చేసే హృదయపూర్వక విన్నపాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారిని వినడానికి.’ హీబ్రూ క్రియ సందర్భానుసారం ‘విను,’ ‘ఆలకించు,’ లేదా ‘పట్టించుకో’ అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִהְיוֹת
  choice: తెరిచి ఉండి
  rationale: ముందటి సందర్భంలోని సొలొమోను ప్రార్థనను కొనసాగించే ఉద్దేశ్య/విన్నప భావాన్ని తెలుగులో సహజమైన ప్రార్థనా నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: עֵינֶיךָ פְתֻחוֹת
  choice: నీ కన్నులు తెరిచి ఉండి
  rationale: దేవుని శ్రద్ధాపూర్వక అనుగ్రహాన్ని సూచించే మూలంలోని మానవరూపకాన్ని వ్యాఖ్యానించి తొలగించకుండా నిలుపుతుంది.
- source_word: תְּחִנַּת
  choice: విన్నపం
  rationale: అనుగ్రహం లేదా కనికరం కోసం చేసే earnest request భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: עַבְדְּךָ
  choice: నీ సేవకుని
  rationale: దేవుని ఎదుట సొలొమోను తనను తాను పేర్కొనే సందర్భంలో ‘సేవకుడు’ సహజమైనది; బానిసత్వ భావం ఇక్కడ ప్రధానంగా లేదు.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: నీ ప్రజలైన ఇశ్రాయేలు
  rationale: ఇశ్రాయేలును దేవుని ప్రజలుగా గుర్తించే నిర్మాణాన్ని తెలుగులో స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: לִשְׁמֹעַ אֲלֵיהֶם
  choice: వారి మొర ఆలకించు
  rationale: ప్రార్థనా సందర్భంలో కేవలం శబ్దం వినడం కాక శ్రద్ధగా వినడం అనే భావాన్ని ఇస్తుంది; ‘వారి మొర’ అనేది అర్థస్పష్టత కోసం సందర్భానుగుణంగా పూరించబడింది.
- source_word: בְּכֹל קָרְאָם אֵלֶיךָ
  choice: వారు నిన్ను పిలిచినప్పుడల్లా
  rationale: בְּכֹל నిర్మాణంలోని పునరావృత కాలార్థాన్ని ‘అప్పుడల్లా’ సహజంగా వ్యక్తం చేస్తుంది; קרא యొక్క సాధారణ ప్రార్థనా భావాన్ని ‘పిలుచు’గా నిలుపుతుంది.
theological_decisions:
- issue: దేవుని కన్నులు తెరిచి ఉండడం అనే మానవరూపక భాష
  choice: ‘నీ కన్నులు తెరిచి ఉండి’ అని రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘నీవు శ్రద్ధ చూపి’ అని భావానువాదం చేయడం
  rationale: హీబ్రూ పాఠ్యం దేవుని శ్రద్ధను శరీర రూపకంతో స్పష్టంగా వ్యక్తం చేస్తుంది. దాన్ని నిలపడం సాహిత్య, ధార్మిక ఉద్వేగాన్ని కాపాడుతుంది.
- issue: שׁמע క్రియలో వినడం/ఆలకించడం/విన్నపాన్ని పట్టించుకోవడం మధ్య అర్థవిస్తృతి
  choice: ప్రధాన పాఠ్యంలో ‘ఆలకించు’
  alternative: ‘విను’
  rationale: ప్రార్థనా సందర్భంలో శ్రద్ధతో వినే భావాన్ని ‘ఆలకించు’ అందిస్తుంది; అయినా మూలపదంలోని సాధారణ ‘విను’ అర్థాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలిని వాడాం. మూలంలోని మానవరూపకాన్ని నిలిపి, క్లిష్టమైన గ్రాంథిక పదజాలాన్ని తగ్గించాం. పాదటిప్పణి గుర్తులు రెండూ ప్రధాన పాఠ్యంలో ఉన్నాయి.
