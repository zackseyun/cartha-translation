review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the military departure, the God-sent route, prayer to Yahweh, and prayer oriented toward the chosen city and house. However, ‘తమ శత్రువుతో’ means ‘with their enemy,’ whereas עַל אֹיְבוֹ means ‘against their enemy.’ Also, ‘నేను కట్టించిన’ is causative (‘I had [someone] build’), while בָּנִיתִי means ‘I built.’
  naturalness: The revised wording retains a natural modern standard Telugu prayer-register and clearly carries the incomplete conditional clause forward with its final comma.
  terminology: యాహ్వే appropriately represents יהוה. ‘మందిరం’ is an acceptable contextual rendering of הַבַּיִת, provided the footnote preserves the literal sense ‘house.’ ‘నీ నామం కోసం’ correctly retains the Hebrew expression.
  issues:
  - severity: high
    issue: ‘తమ శత్రువుతో’ reverses the battle relation.
    rationale: The Hebrew preposition עַל in this military context means ‘against,’ not ‘with.’
  - severity: medium
    issue: ‘నేను కట్టించిన’ is causative.
    rationale: The first-person perfect בָּנִיתִי states that Solomon built the house; it does not say that he commissioned someone else to build it.
  revised_text: నీ ప్రజలు నీవు వారిని పంపే మార్గంలో తమ శత్రువుపై యుద్ధానికి బయలుదేరి, నీవు ఎన్నుకున్న పట్టణం వైపునకు[a], నీ నామం కోసం నేను కట్టిన మందిరం వైపునకు[b] తిరిగి యాహ్వేకు ప్రార్థించినప్పుడు,
