  text: כִּי יֵצֵ֨א עַמְּ/ךָ֤ לַ/מִּלְחָמָה֙ עַל אֹ֣יְב֔/וֹ בַּ/דֶּ֖רֶךְ אֲשֶׁ֣ר תִּשְׁלָחֵ֑/ם וְ/הִתְפַּֽלְל֣וּ אֶל יְהוָ֗ה דֶּ֤רֶךְ הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתָּ בָּ֔/הּ וְ/הַ/בַּ֖יִת אֲשֶׁר בָּנִ֥תִי לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/044.yaml
  text: When your people go out to battle against their enemy by the way you send them[a], and they pray to Yahweh toward the city that you have chosen and the house that I have built for your name[b],
translation:
  language: te
  text: నీ ప్రజలు నీవు వారిని పంపే మార్గంలో తమ శత్రువుపై యుద్ధానికి బయలుదేరి, నీవు ఎన్నుకున్న పట్టణం వైపునకు[a], నీ నామం కోసం నేను కట్టిన మందిరం వైపునకు[b] తిరిగి యాహ్వేకు ప్రార్థించినప్పుడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘పట్టణం దిశగా’ అని ఉంది; ఇది ప్రార్థించేటప్పుడు ఆ పట్టణం వైపు అభిముఖంగా ఉండడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘మందిరం’గా అనువదించిన హీబ్రూ పదానికి అక్షరార్థం ‘ఇల్లు’ లేదా ‘గృహం’; సందర్భంలో అది దేవాలయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ప్రార్థించినప్పుడు
  rationale: ఈ ప్రార్థనలో ఒక సందర్భాన్ని పరిచయం చేస్తుంది. తెలుగు వాక్యప్రవాహంలో కాలార్థకమైన ‘అప్పుడు’ భావం సహజంగా ఉంటుంది; తదుపరి వచనంలోని ప్రధాన విన్నపానికి ఈ వాక్యం ఆధారంగా నిలుస్తుంది.
- source_word: יֵצֵא עַמְּךָ לַמִּלְחָמָה
  choice: నీ ప్రజలు ... యుద్ధం చేయడానికి బయలుదేరి
  rationale: יצא యొక్క ‘బయలుదేరు’ భావాన్ని, యుద్ధ సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: עַל אֹיְבוֹ
  choice: తమ శత్రువుతో
  rationale: ‘ప్రజలు’ సమూహవాచకమైనందున హీబ్రూ ఏకవచన ప్రత్యయ భావాన్ని తెలుగులో సహజంగా ‘తమ’తో వ్యక్తం చేసింది; ‘శత్రువు’ ఏకవచనాన్ని నిలిపింది.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תִּשְׁלָחֵם
  choice: నీవు పంపే మార్గంలో
  rationale: దేవుడు వారిని పంపే మార్గం లేదా యుద్ధయాత్ర అనే స్పష్టమైన హీబ్రూ చిత్రాన్ని అతిగా వివరణ చేయకుండా నిలుపుతుంది.
- source_word: וְהִתְפַּלְלוּ אֶל יְהוָה
  choice: యాహ్వేకు ప్రార్థించినప్పుడు
  rationale: התפלל సాధారణంగా ‘ప్రార్థించు’; יהוהను బిరుదుతో మార్చకుండా దైవనామంగా ‘యాహ్వే’ అని లిప్యంతరీకరించింది.
- source_word: דֶּרֶךְ הָעִיר
  choice: పట్టణం వైపుగా ... తిరిగి
  rationale: ఇక్కడ דֶּרֶךְ ప్రయాణమార్గం కంటే ప్రార్థనలో దిశాభిముఖతను సూచిస్తుంది. ‘వైపుగా తిరిగి’ తెలుగులో ఆ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: הָעִיר אֲשֶׁר בָּחַרְתָּ בָּהּ
  choice: నీవు ఎన్నుకున్న పట్టణం
  rationale: దేవుడు ఆ పట్టణాన్ని ఎన్నుకున్నాడనే మూలపాఠంలోని సంక్షిప్త వాక్యాన్ని అదనపు భావం చేర్చకుండా నిలుపుతుంది.
- source_word: וְהַבַּיִת
  choice: మందిరం
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు/గృహం’ అయినా, ఇక్కడ సొలొమోను కట్టించిన దేవాలయాన్ని సూచిస్తుంది. ‘మందిరం’ సాధారణ తెలుగు పాఠకునికి సహజంగా ఉండి సందర్భార్థాన్ని అందిస్తుంది; అక్షరార్థాన్ని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: אֲשֶׁר בָּנִתִי לִשְׁמֶךָ
  choice: నీ నామం కోసం నేను కట్టించిన
  rationale: ‘నీ నామం కోసం’ అనే ముఖ్యమైన బైబిలు వ్యక్తీకరణను గౌరవం లేదా స్మారకార్థం అని విపులీకరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం దేవుని వ్యక్తిగత నామమైన టెట్రాగ్రామటన్‌ను ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా, సాధారణంగా అంగీకరించిన ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరిస్తుంది.
- issue: הַבַּיִת అనే పదానికి ఆలయ సందర్భంలోని అనువాదం
  choice: మందిరం
  alternative: గృహం / ఇల్లు
  rationale: మూలపదం ‘ఇల్లు’ అయినప్పటికీ ఇక్కడ సూచితమైనది దేవాలయం. ప్రధాన పాఠంలో సహజమైన ‘మందిరం’ను వాడి, మూలపదపు రూపాన్ని పాదటిప్పణిలో సంరక్షించింది.
- issue: ప్రార్థనలో పట్టణం మరియు మందిరం వైపు దిశాభిముఖత
  choice: వైపుగా ... తిరిగి
  alternative: దిశగా
  rationale: ఈ వాక్యం ప్రార్థనను ఒక నిర్దిష్ట దిశకు అభిముఖం చేయడాన్ని చెబుతుంది; దానికి మించిన ఆరాధనా సిద్ధాంతాన్ని పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడింది. ఇది తదుపరి వచనంలో పూర్తయ్యే షరతు/కాల ఉపవాక్యం కాబట్టి చివర కామాను ఉంచింది. రెండు పాదటిప్పణి గుర్తులూ సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉన్నాయి.
