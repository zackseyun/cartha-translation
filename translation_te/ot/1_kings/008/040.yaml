  rationale: ‘నీవు మా పితరులకు ఇచ్చిన’ అనే వెంటనే వచ్చే విశేషణ వాక్యం దీనిని సాధారణంగా భూమండలమంతటికి కాక, ఇశ్రాయేలు పితరులకు ఇచ్చిన దేశానికి అన్వయిస్తుంది.
