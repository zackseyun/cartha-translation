source:
  edition: WLC
  text: אַתָּ֞ה תִּשְׁמַ֤ע הַ/שָּׁמַ֨יִם֙ מְכ֣וֹן שִׁבְתֶּ֔/ךָ וְ/עָשִׂ֕יתָ כְּ/כֹ֛ל אֲשֶׁר יִקְרָ֥א אֵלֶ֖י/ךָ הַ/נָּכְרִ֑י לְמַ֣עַן יֵדְעוּ/ן֩ כָּל עַמֵּ֨י הָ/אָ֜רֶץ אֶת שְׁמֶ֗/ךָ לְ/יִרְאָ֤ה אֹֽתְ/ךָ֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל וְ/לָ/דַ֕עַת כִּי שִׁמְ/ךָ֣ נִקְרָ֔א עַל הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/043.yaml
  text: may you hear in heaven[a], the place where you dwell, and do according to all that the foreigner calls to you for, so that all the peoples of the earth may know your name, to fear you as your people Israel do[b], and to know that your name is called on this house that I have built.
translation:
  language: te
  text: నీవు నీ నివాసస్థలమైన పరలోకం నుండి ఆలకించి, ఆ విదేశీయుడు నీకు మొరపెట్టి అడిగినదంతా చేయి.[a] అప్పుడు భూమిమీదనున్న సమస్త ప్రజలు నీ పేరును తెలుసుకొని, నీ ప్రజలైన ఇశ్రాయేలువారిలా నిన్ను భయపడునట్లుగాను, నేను కట్టించిన ఈ మందిరంపై నీ పేరు పిలువబడుతుందని తెలుసుకొనునట్లుగాను చేయి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీకు పిలుపునిస్తాడో’ లేదా ‘నీకు మొరపెట్టి అడుగుతాడో.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఈ మందిరంపై నీ పేరు పిలువబడిందని.’ ఇది ఈ మందిరం నీకు చెందిందని లేదా నీ పేరును ధరిస్తుందని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: విని
  rationale: రూపపరంగా అసంపూర్ణ క్రియ అయినా, ప్రార్థనా సందర్భంలో ఇది విన్నప భావాన్ని కలిగి ఉంది. తెలుగులో తరువాతి ‘చేయి’తో కలిపి సహజమైన ప్రత్యక్ష ప్రార్థనగా వ్యక్తమవుతుంది.
- source_word: הַשָּׁמַיִם מְכוֹן שִׁבְתֶּךָ
  choice: నీ నివాసస్థలమైన పరలోకంలో
  rationale: ‘ఆకాశాలు’ అనే మూలరూపాన్ని దేవుని నివాసస్థలం అనే అనుబంధ పదబంధంతో కలిపి, సందర్భానుకూలంగా ‘పరలోకం’ అని సహజ తెలుగులో ఇచ్చింది.
- source_word: וְעָשִׂיתָ כְּכֹל אֲשֶׁר
  choice: దానంతటి ప్రకారం చేయి
  rationale: దేవుడు విదేశీయుని విన్నపానికి అనుగుణంగా చర్య తీసుకోవాలనే విస్తృత భావాన్ని పరిమితం చేయకుండా ఉంచుతుంది.
- source_word: יִקְרָא אֵלֶיךָ
  choice: నీకు మొరపెడతాడో
  rationale: קרא אל ప్రార్థనలో దేవునికి పిలవడం లేదా మొరపెట్టడం అనే భావాన్ని ఇస్తుంది. ‘మొరపెట్టు’ ఆధునిక తెలుగులో ప్రార్థనా తీవ్రతను సహజంగా తెలియజేస్తుంది.
- source_word: הַנָּכְרִי
  choice: ఆ విదేశీయుడు
  rationale: ఇది కేవలం అపరిచితుణ్ణి కాక, వేరే ప్రజకు చెందిన వ్యక్తిని సూచిస్తుంది.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: భూమిపై ఉన్న ప్రజలందరూ
  rationale: వాక్యంలోని విశ్వవ్యాప్త పరిధిని, వివిధ ప్రజాసమూహాలను సూచించే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לְיִרְאָה אֹתְךָ
  choice: నీకు భయపడతారు
  rationale: ירא లోని భయం, భక్తిపూర్వక విస్మయం, గౌరవం అనే ఉద్విగ్న సమగ్ర భావాన్ని ‘భయపడు’ నిలుపుతుంది; దాన్ని కేవలం ‘గౌరవించు’గా మృదువుపరచదు.
- source_word: שִׁמְךָ נִקְרָא עַל הַבַּיִת הַזֶּה
  choice: ఈ మందిరంపై నీ పేరు ఉంచబడిందని
  rationale: మందిరం దేవునికి చెందిందనీ ఆయన పేరును ధరిస్తుందనీ సూచించే హీబ్రూ నుడికారాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, ‘పేరు’ మరియు ‘పై’ అనే మూల చిత్రాన్ని నిలుపుతుంది.
theological_decisions:
- issue: שִׁמְךָ נִקְרָא עַל అనే దైవిక యాజమాన్య/సంబంధ నుడికారం
  choice: ఈ మందిరంపై నీ పేరు ఉంచబడిందని
  alternative: ఈ మందిరం నీ పేరుతో పిలువబడుతున్నదని
  rationale: ఎంచుకున్న రూపం మందిరం దేవునికి చెందినదనే నుడికార భావాన్ని తెలుగులో తెలియజేస్తుంది; అదే సమయంలో మూలంలోని ‘పేరు’ మరియు ‘పై’ చిత్రాలను నిలుపుతుంది. పాదసూచికలో మరింత అక్షరార్థ రూపం ఇవ్వబడింది.
- issue: ירא యొక్క భావ పరిధి
  choice: నీకు భయపడతారు
  alternative: నిన్ను భక్తితో గౌరవిస్తారు
  rationale: ఇశ్రాయేలు మరియు ఇతర ప్రజలు దేవుని పట్ల చూపే స్పందనలో భయం, విస్మయం, భక్తి కలిసివున్నాయి. ‘భయపడతారు’ ఈ వేదాంతపరమైన ఉద్విగ్నతను తగ్గించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలి ఉపయోగించబడింది. ‘మందిరం,’ ‘మొరపెట్టు,’ ‘భయపడు’ వంటి సాధారణంగా అర్థమయ్యే పదాలతో మూలంలోని గంభీరతను నిలిపింది; పాతకాలపు విభక్తి రూపాలు నివారించబడ్డాయి.
