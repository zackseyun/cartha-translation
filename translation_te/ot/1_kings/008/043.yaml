revisions:
- from: నీవు నీ నివాసస్థలమైన పరలోకంలో విని, ఆ విదేశీయుడు దేనికోసం నీకు మొరపెడతాడో దానంతటి ప్రకారం చేయి.[a] అప్పుడు భూమిపై ఉన్న ప్రజలందరూ నీ పేరును తెలుసుకొని, నీ ప్రజలైన ఇశ్రాయేలువారిలాగే నీకు భయపడతారు; నేను కట్టించిన ఈ మందిరంపై నీ పేరు ఉంచబడిందని తెలుసుకుంటారు.[b]
  to: నీవు నీ నివాసస్థలమైన పరలోకం నుండి ఆలకించి, ఆ విదేశీయుడు నీకు మొరపెట్టి అడిగినదంతా చేయి.[a] అప్పుడు భూమిమీదనున్న సమస్త ప్రజలు నీ పేరును తెలుసుకొని, నీ ప్రజలైన ఇశ్రాయేలువారిలా నిన్ను భయపడునట్లుగాను, నేను కట్టించిన ఈ మందిరంపై నీ పేరు పిలువబడుతుందని తెలుసుకొనునట్లుగాను చేయి.[b]
  rationale: The revision restores the Hebrew purpose structure, clarifies the inclusive response requested for the foreigner, and uses a more source-near rendering of the temple-name idiom. It preserves the prayer’s direct address, the universal scope of ‘all the peoples of the earth,’ and the full force of ‘fear’ rather than softening it.
