id: 1KI.8.28
reference: 1 Kings 8:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/פָנִ֜יתָ אֶל תְּפִלַּ֧ת עַבְדְּ/ךָ֛ וְ/אֶל תְּחִנָּת֖/וֹ יְהוָ֣ה אֱלֹהָ֑/י לִ/שְׁמֹ֤עַ אֶל הָֽ/רִנָּה֙ וְ/אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֧ר עַבְדְּ/ךָ֛ מִתְפַּלֵּ֥ל לְ/פָנֶ֖י/ךָ הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/028.yaml
  text: Yet turn toward the prayer of your servant and to his plea for favor[a], O Yahweh my God[b], to hear the cry and the prayer that your servant is praying before you today.
translation:
  language: te
  text: అయినా యహ్వే, నా దేవా, నీ సేవకుని ప్రార్థనవైపు, అతని వేడుకోలువైపు[a] తిరిగి, నీ సేవకుడు ఈ రోజు నీ సన్నిధిలో చేస్తున్న మొరను[b], ప్రార్థనను ఆలకించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని దయావిన్నపంవైపు.’ హీబ్రూ పదం దయ లేదా అనుగ్రహం కోసం చేసే హృదయపూర్వక వేడుకోలును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘బిగ్గర మొరను.’ హీబ్రూ పదం గట్టిగా చేసే కేకను లేదా పిలుపును సూచించగలదు; ఇక్కడ అది ప్రార్థనలో దేవునికి చేసే మొరను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתָ
  choice: అయినా … వైపు తిరిగి
  rationale: פנה అనే క్రియలోని ‘వైపు తిరుగు’ అనే స్పష్టమైన చిత్రాన్ని నిలుపుతూ, ముందరి వచనంతో ఉన్న స్వల్ప వ్యతిరేక సంబంధాన్ని ‘అయినా’ తెలియజేస్తుంది.
- source_word: תְּפִלַּת / הַתְּפִלָּה
  choice: ప్రార్థన / ప్రార్థనను
  rationale: תפלהకు సహజమైన ప్రత్యక్ష సమానార్థకం. మూలంలోని పునరుక్తిని కూడా నిలిపింది.
- source_word: עַבְדְּךָ
  choice: నీ సేవకుడు / నీ సేవకుని
  rationale: దేవుని ఎదుట సొలొమోను చూపే వినయపూర్వక సేవాభావాన్ని సందర్భానుసారంగా తెలియజేస్తుంది; రెండు సందర్భాల్లోనూ ఒకే పదం వాడబడింది.
- source_word: תְּחִנָּתוֹ
  choice: అతని వేడుకోలు
  rationale: దయ లేదా అనుగ్రహం కోసం చేసే earnest plea అనే భావాన్ని ఆధునిక, సహజమైన తెలుగులో తెలియజేస్తుంది. మూడవ పురుష ఏకవచన ప్రత్యయం సొలొమోనునే సూచిస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: אֱלֹהָי
  choice: నా దేవా
  rationale: ప్రత్యక్ష సంబోధనను, ప్రథమ పురుష స్వామ్యార్థాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לִשְׁמֹעַ
  choice: ఆలకించు
  rationale: ప్రార్థనను శ్రద్ధగా వినాలనే విజ్ఞప్తిని సహజమైన, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הָרִנָּה
  choice: మొర
  rationale: ఈ ప్రార్థనా సందర్భంలో רנה సూచించే బిగ్గరమైన లేదా ఆర్తితో కూడిన పిలుపును ‘మొర’ సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: מִתְפַּלֵּל
  choice: చేస్తున్న
  rationale: హీబ్రూ వర్తమాన కృదంతంలోని కొనసాగుతున్న క్రియాభావాన్ని ‘ప్రార్థనను … చేస్తున్న’ అనే నిర్మాణం నిలుపుతుంది.
- source_word: לְפָנֶיךָ
  choice: నీ సన్నిధిలో
  rationale: ‘నీ ఎదుట’ అనే మూలభావాన్ని ప్రార్థనా సందర్భానికి తగిన సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: הַיּוֹם
  choice: ఈ రోజు
  rationale: కాలసూచనను ఆధునిక ప్రామాణిక తెలుగులో నేరుగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తున్నందున దాన్ని బిరుదుగా మార్చకుండా ‘యహ్వే’ అని లిప్యంతరీకరించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ప్రార్థనా సందర్భానికి తగిన గౌరవప్రదమైన శైలి వాడబడింది. హీబ్రూ సమాంతర నిర్మాణం, ‘ప్రార్థన’ పునరుక్తి, ‘వైపు తిరుగు’ అనే స్పష్టమైన రూపకం నిలుపబడ్డాయి. ఆంగ్ల సంప్రదింపు పాఠంలో [b] గుర్తు దైవనామం తరువాత కనిపించినా, దాని గమనిక רנה గురించి కావున తెలుగు ప్రధాన పాఠంలో ‘మొరను’ తరువాత ఉంచబడింది.
