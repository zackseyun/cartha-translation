  source_fidelity: 'The Telugu accurately represents the Hebrew appeal: the request that Yahweh turn toward the servant''s prayer and plea, and hear the cry and prayer offered before him today. It retains the servant''s third-person self-reference and the repeated terms for prayer. “మొర” suitably conveys הָרִנָּה in this prayer context without forcing a joyful-song sense.'
