  terminology: “యహ్వే” correctly transliterates the divine name, and “నా దేవా,” “నీ సేవకుడు,” “ప్రార్థన,” “వేడుకోలు,” and “ఆలకించు” are contextually appropriate. Footnote markers are placed on the terms they explain.
