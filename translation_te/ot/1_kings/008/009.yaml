id: 1KI.8.9
reference: 1 Kings 8:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אֵ֚ין בָּֽ/אָר֔וֹן רַ֗ק שְׁנֵי֙ לֻח֣וֹת הָ/אֲבָנִ֔ים אֲשֶׁ֨ר הִנִּ֥חַ שָׁ֛ם מֹשֶׁ֖ה בְּ/חֹרֵ֑ב אֲשֶׁ֨ר כָּרַ֤ת יְהוָה֙ עִם בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/009.yaml
  text: There was nothing in the ark except the two stone tablets that Moses had placed there at Horeb[c][b][a], where Yahweh made a covenant with the sons of Israel when they came out from the land of Egypt.
translation:
  language: te
  text: మందసంలో, ఇశ్రాయేలు కుమారులు ఐగుప్తు దేశం నుండి బయలుదేరినప్పుడు యాహ్వే వారితో నిబంధన చేసినట్లు హోరేబులో మోషే ఉంచిన రెండు రాతి పలకలు తప్ప మరేమీ లేవు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో, ‘నిబంధన కోశాడు’; ఇది ‘నిబంధన చేశాడు’ అనే అర్థమిచ్చే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין בָּאָרוֹן רַק
  choice: మందసంలో ... తప్ప మరేమీ లేవు
  rationale: నిషేధార్థక అస్తిత్వ వాక్యంతో వచ్చిన רַקను సహజమైన తెలుగు ‘తప్ప మరేమీ లేవు’గా వ్యక్తం చేసింది.
- source_word: שְׁנֵי לֻחֹת הָאֲבָנִים
  choice: రెండు రాతి పలకలు
  rationale: హీబ్రూ నిర్మాణాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలిపే సహజమైన పదబంధం.
- source_word: אֲשֶׁר הִנִּיחַ שָׁם מֹשֶׁה
  choice: మోషే ఆ పలకలను అందులో ఉంచాడు
  rationale: הִנִּיחַ అంటే ఉంచడం లేదా పెట్టడం. తెలుగు వాక్యంలో ‘అందులో’ మందసాన్ని స్పష్టంగా సూచిస్తుంది; ‘ఆ పలకలను’ సంబంధవాక్యాన్ని సహజంగా చేస్తుంది.
- source_word: בְּחֹרֵב
  choice: హోరేబులో
  rationale: స్థలాన్ని సూచించే హీబ్రూ בְּకు సహజమైన తెలుగు స్థానవిభక్తి.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִם
  choice: యెహోవా వారితో నిబంధన చేసిన
  rationale: ‘నిబంధన కోయడం’ అనే హీబ్రూ నుడికారాన్ని దాని అర్థమైన ‘నిబంధన చేయడం’గా అనువదించింది; మూలంలో ‘నిబంధన’ పదం సూచ్యంగా ఉంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని తెలుగు బైబిల్ వాడుకలో సుపరిచితమైన లిప్యంతరీకరణతో వ్యక్తం చేసింది; బిరుదుతో భర్తీ చేయలేదు.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: ఈ సందర్భంలో మొత్తం ఇశ్రాయేలు ప్రజలను సూచించే సహజమైన సమూహనామం; అక్షరార్థమైన ‘ఇశ్రాయేలు కుమారులు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపింది.
- source_word: בְּצֵאתָם מֵאֶרֶץ מִצְרָיִם
  choice: వారు ఐగుప్తు దేశం నుండి బయలుదేరినప్పుడు
  rationale: కాలార్థక infinitive constructను సహజమైన తెలుగు కాలవాక్యంగా అనువదించింది.
theological_decisions:
- issue: יְהוָה దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా ఉంచింది. తెలుగు పాఠకులకు విస్తృతంగా తెలిసిన ‘యెహోవా’ రూపాన్ని ప్రధాన పాఠ్యంలో, ‘యాహ్వే’ రూపాన్ని పాదసూచికలో ఇచ్చింది.
- issue: בְּנֵי יִשְׂרָאֵל యొక్క ప్రతినిధి బహువచనం
  choice: ఇశ్రాయేలీయులు
  alternative: ఇశ్రాయేలు కుమారులు
  rationale: ఇక్కడ పదబంధం జాతి సముదాయాన్ని సూచిస్తుంది. సహజ తెలుగు కోసం సమూహనామాన్ని ఎంచుకుని, మూలపు కుటుంబరూపాన్ని పాదసూచికలో సంరక్షించింది.
- issue: כָּרַת అనే నిబంధన నుడికారం
  choice: నిబంధన చేసిన
  alternative: నిబంధన కోసిన
  rationale: హీబ్రూ నుడికారాన్ని తెలుగులో అక్షరార్థంగా అనువదిస్తే భావం అస్పష్టమవుతుంది; అందువల్ల ఉద్దేశించిన అర్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, మూలరూపాన్ని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరతతో కూడిన సరళ శైలి. పొడవైన హీబ్రూ వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి పఠనసౌలభ్యం కల్పించింది. ‘మందసం,’ ‘నిబంధన’ వంటి స్థిరమైన బైబిల్ పదజాలాన్ని నిలిపింది.
