revisions:
- from: మందసంలో రెండు రాతి పలకలు తప్ప మరేమీ లేవు. ఇశ్రాయేలీయులు ఐగుప్తు దేశం నుండి బయలుదేరినప్పుడు యెహోవా వారితో నిబంధన చేసిన హోరేబులో మోషే ఆ పలకలను అందులో ఉంచాడు.[a][b][c]
  to: మందసంలో, ఇశ్రాయేలు కుమారులు ఐగుప్తు దేశం నుండి బయలుదేరినప్పుడు యాహ్వే వారితో నిబంధన చేసినట్లు హోరేబులో మోషే ఉంచిన రెండు రాతి పలకలు తప్ప మరేమీ లేవు.[a]
  rationale: 'The revision follows the Hebrew clause order more closely: the tablets are those Moses placed at Horeb, the place where Yahweh made a covenant with the sons of Israel at their exodus from Egypt. It uses “యాహ్వే” in accordance with the supplied POB audit trail, retains the source’s familial expression “ఇశ్రాయేలు కుమారులు,” and keeps only the footnote needed to explain the Hebrew covenant idiom.'
