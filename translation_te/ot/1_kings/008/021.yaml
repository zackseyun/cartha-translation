source:
  edition: WLC
  text: וָ/אָשִׂ֨ם שָׁ֤ם מָקוֹם֙ לָֽ/אָר֔וֹן אֲשֶׁר שָׁ֖ם בְּרִ֣ית יְהוָ֑ה אֲשֶׁ֤ר כָּרַת֙ עִם אֲבֹתֵ֔י/נוּ בְּ/הוֹצִיא֥/וֹ אֹתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/021.yaml
  text: And there I have set a place for the ark[b][a], in which is the covenant of Yahweh that he made with our fathers when he brought them out of the land of Egypt.
translation:
  language: te
  text: అక్కడ నేను మందసం కోసం ఒక స్థలాన్ని ఏర్పాటు చేశాను. ఆ మందసంలో యాహ్వే నిబంధన ఉంది; ఆయన మన పితరులతో[b] ఆ నిబంధనను[a] చేశాడు, వారిని ఐగుప్తు దేశం నుండి బయటకు రప్పించినప్పుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో అక్షరార్థం: “యాహ్వే మన పితరులతో కోసిన నిబంధన.”'
    reason: హీబ్రూ నిబంధన-నుడికారాన్ని తెలియజేయడానికి.
  - marker: b
    text: “మన పితరులు” అనే మాటను “మన పూర్వీకులు” అని కూడా అనువదించవచ్చు.
    reason: אֲבֹתֵינוּ కు సాధ్యమైన విస్తృతార్థక ప్రత్యామ్నాయాన్ని చూపడానికి.
lexical_decisions:
- source_word: וָאָשִׂם שָׁם מָקוֹם לָאָרוֹן
  choice: అక్కడ నేను మందసం కోసం ఒక స్థలాన్ని ఏర్పాటు చేశాను
  rationale: שׂים యొక్క ప్రాథమిక భావం ‘పెట్టు/ఉంచు’; అయితే ‘స్థలాన్ని పెట్టాను’ అనేది తెలుగులో అసహజం. సందర్భానుగుణంగా ‘స్థలాన్ని ఏర్పాటు చేశాను’ సహజంగా ఉండి, పూర్తయిన కార్యాన్ని వ్యక్తపరుస్తుంది.
- source_word: לָאָרוֹן
  choice: మందసం కోసం
  rationale: אָרוֹן ఇక్కడ నిబంధన మందసాన్ని సూచిస్తుంది. వెంటనే వచ్చే వాక్యం దానిలో నిబంధన ఉందని గుర్తిస్తున్నందున సంక్షిప్తంగా ‘మందసం’ అని అనువదించబడింది.
- source_word: אֲשֶׁר שָׁם בְּרִית יְהוָה
  choice: ఆ మందసంలో యెహోవా నిబంధన ఉంది
  rationale: హీబ్రూ సంబంధవాచక నిర్మాణంలోని స్థానార్థాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో స్థిరపడిన లిప్యంతరీకరణ ‘యెహోవా’గా ఉంచబడింది.
- source_word: אֲשֶׁר כָּרַת
  choice: ఆ నిబంధన చేశాడు
  rationale: ‘నిబంధనను కోశాడు’ అనేది హీబ్రూ నుడికారం యొక్క అక్షరార్థం; సహజమైన తెలుగులో ‘నిబంధన చేశాడు’ అని ఇవ్వబడింది.
- source_word: עִם אֲבֹתֵינוּ
  choice: మన పితరులతో
  rationale: אבותינו లోని పురుషలింగ కుటుంబపూర్వీకుల సూచనను ‘పితరులు’ పదం నేరుగా కాపాడుతుంది.
- source_word: בְּהוֹצִיאוֹ אֹתָם מֵאֶרֶץ מִצְרָיִם
  choice: ఆయన మన పితరులను ఐగుప్తు దేశం నుండి బయటకు రప్పించినప్పుడు
  rationale: בְּ + infinitive construct ఇక్కడ కాలార్థాన్ని ఇస్తుంది; హిఫిల్ రూపం కారణక భావంతో ‘బయటకు రప్పించాడు’గా అనువదించబడింది.
theological_decisions:
- issue: יְהוָה అనే దైవిక నామం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవిక నామమే ఉంది. దానిని బిరుదుగా మార్చకుండా తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపం ఉపయోగించబడింది.
- issue: אֲבֹתֵינוּ లోని లింగసూచన
  choice: మన పితరులు
  alternative: మన పూర్వీకులు
  rationale: మూలంలోని స్పష్టమైన పురుషలింగ పదాన్ని ప్రధాన పాఠంలో కాపాడి, విస్తృతార్థక ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- issue: בְּרִית మరియు మందసం మధ్య సంబంధం
  choice: ఆ మందసంలో యెహోవా నిబంధన ఉంది
  alternative: ఆ మందసంలో యెహోవా నిబంధన పత్రాలు ఉన్నాయి
  rationale: మూలం ‘నిబంధన’ అని మాత్రమే చెబుతుంది; పలకలు లేదా పత్రాలు అని వివరణాత్మకంగా చేర్చకుండా దాని సంక్షిప్తతను, భావ ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. పొడవైన హీబ్రూ వాక్యాన్ని రెండు సహజమైన తెలుగు వాక్యాలుగా విభజించాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
