  to: అప్పుడు రాజు తన ముఖాన్ని తిప్పి[a] ఇశ్రాయేలు సమాజమంతటినీ[b] ఆశీర్వదించాడు; ఇశ్రాయేలు సమాజమంతా నిలబడి ఉంది.
