source:
  edition: WLC
  text: וַ/יַּסֵּ֤ב הַ/מֶּ֨לֶךְ֙ אֶת פָּנָ֔י/ו וַ/יְבָ֕רֶךְ אֵ֖ת כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וְ/כָל קְהַ֥ל יִשְׂרָאֵ֖ל עֹמֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/014.yaml
  text: Then the king turned around and blessed all the assembly of Israel[b][a], while all the assembly of Israel was standing.
translation:
  language: te
  text: అప్పుడు రాజు తన ముఖాన్ని తిప్పి[a] ఇశ్రాయేలు సమాజమంతటినీ[b] ఆశీర్వదించాడు; ఇశ్రాయేలు సమాజమంతా నిలబడి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తిరిగాడు.’ హీబ్రూలో అక్షరార్థంగా ‘తన ముఖాన్ని తిప్పాడు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఇశ్రాయేలు జనసమూహమంతటినీ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב אֶת־פָּנָיו
  choice: తన ముఖం తిప్పుకొని
  rationale: హీబ్రూ వాక్యంలోని ‘తన ముఖాన్ని తిప్పాడు’ అనే శరీరచలనాన్ని నిలుపుతూ, తెలుగులో సహజంగా వినిపించే క్రియారూపాన్ని ఉపయోగించింది.
- source_word: וַיְבָרֶךְ
  choice: ఆశీర్వదించాడు
  rationale: ఈ రాజసంబంధమైన బహిరంగ సందర్భంలో పలికిన దీవెనను సూచించడానికి ברך అనే క్రియకు సాధారణమైన, సంక్షిప్తమైన తెలుగు సమానం.
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సమాజమంతా
  rationale: קהל కూడి ఉన్న ప్రజాసముదాయాన్ని సూచిస్తుంది. ‘సమాజం’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, సమష్టిగా కూడిన ప్రజల భావాన్ని అందిస్తుంది.
- source_word: וְכָל־קְהַל יִשְׂרָאֵל עֹמֵד
  choice: ఆ సమయంలో ఇశ్రాయేలు సమాజమంతా నిలబడి ఉంది
  rationale: עֹמֵד అనే కృదంతం ఆశీర్వాదం జరుగుతున్నప్పుడు ప్రజల కొనసాగుతున్న భంగిమను నేపథ్య చర్యగా చూపుతుంది; అందుకే ‘నిలబడి ఉంది’ అని అనువదించింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని ఉపయోగించింది. మూలంలోని ‘ఇశ్రాయేలు సమాజమంతా’ అనే పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపింది; సమష్టివాచక ఏకవచనానికి అనుగుణంగా ‘నిలబడి ఉంది’ అని రాసింది.
