  text: כִּ֤י הַ/כְּרוּבִים֙ פֹּרְשִׂ֣ים כְּנָפַ֔יִם אֶל מְק֖וֹם הָֽ/אָר֑וֹן וַ/יָּסֹ֧כּוּ הַ/כְּרֻבִ֛ים עַל הָ/אָר֥וֹן וְ/עַל בַּדָּ֖י/ו מִ/לְ/מָֽעְלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/007.yaml
  text: For the cherubim spread out their wings over the place of the ark[a], and the cherubim overshadowed the ark and its poles from above.
translation:
  language: te
  text: ఎందుకంటే కెరూబులు మందసం ఉన్న స్థలం మీద తమ రెక్కలు చాచి ఉన్నాయి[a]; కెరూబులు మందసాన్ని, దాని మోసే కర్రలను పైనుంచి కప్పాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మందసం ఉన్న స్థలం వైపుగా.” హీబ్రూ ఉపసర్గను మరింత అక్షరార్థంగా దిశను సూచించేదిగా అర్థం చేసుకోవచ్చు; అయితే తరువాతి వాక్యభాగాన్ని బట్టి రెక్కలు మందసం ఉన్న స్థలం మీద విస్తరించాయనే భావం సందర్భానికి బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలో చెప్పిన విషయానికి కారణాన్ని లేదా వివరణను పరిచయం చేస్తుంది.
- source_word: הַכְּרוּבִים
  choice: కెరూబులు
  rationale: ఆలయ సందర్భంలోని ప్రత్యేక పరలోక జీవులను సూచించే స్థిరమైన బైబిలు పదాన్ని నిలుపుతుంది.
- source_word: פֹּרְשִׂים כְּנָפַיִם
  choice: తమ రెక్కలు చాపి ఉన్నాయి
  rationale: హీబ్రూ కృదంతం సూచించే కొనసాగుతున్న భంగిమను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶל מְקוֹם הָאָרוֹן
  choice: మందసం ఉన్న స్థలం మీద
  rationale: אֶל సాధారణంగా దిశను సూచించినా, తరువాతి కప్పివేత వాక్యభాగం ఇక్కడ రెక్కలు మందసం ఉన్న ప్రదేశంపై విస్తరించాయని సూచిస్తుంది; అసలు దిశార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: וַיָּסֹכּוּ
  choice: కప్పి ఉంచాయి
  rationale: סכך యొక్క కప్పడం లేదా రక్షణగా ఆవరించడం అనే భౌతిక చిత్రాన్ని, స్థిర భంగిమను తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַּדָּיו
  choice: దాని మోతకర్రలను
  rationale: మందసాన్ని మోయడానికి ఉపయోగించే కర్రలను స్పష్టంగా సూచించే సహజ తెలుగు పదం.
- source_word: מִלְמָעְלָה
  choice: పైనుంచి
  rationale: కప్పివేత పైవైపు నుంచి జరిగిన స్థల సంబంధాన్ని నిలుపుతుంది.
