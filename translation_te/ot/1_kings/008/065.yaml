source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֣ה בָֽ/עֵת הַ/הִ֣יא אֶת הֶ/חָ֡ג וְ/כָל יִשְׂרָאֵ֣ל עִמּ/וֹ֩ קָהָ֨ל גָּד֜וֹל מִ/לְּב֥וֹא חֲמָ֣ת עַד נַ֣חַל מִצְרַ֗יִם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ שִׁבְעַ֥ת יָמִ֖ים וְ/שִׁבְעַ֣ת יָמִ֑ים אַרְבָּעָ֥ה עָשָׂ֖ר יֽוֹם־׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/065.yaml
  text: At that time Solomon held the feast[a], and all Israel with him, a great assembly from Lebo-hamath to the Brook of Egypt, before Yahweh our God, seven days and seven days[b], fourteen days.
translation:
  language: te
  text: ఆ సమయంలో సొలొమోను, అతనితో కూడ ఇశ్రాయేలీయులందరూ, లెబో-హమాతు[a] నుండి ఐగుప్తు వాగు[b] వరకు ఉన్న ఒక గొప్ప సభగా, మన దేవుడైన యాహ్వే సన్నిధిలో ఆ పండుగను ఏడు రోజులు, మరో ఏడు రోజులు—మొత్తం పద్నాలుగు రోజులు—జరిపారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హమాతు ప్రవేశద్వారం నుండి.’ హెబ్రీ పదబంధాన్ని సరిహద్దును వర్ణించే మాటగా గానీ, ‘లెబో-హమాతు’ అనే స్థలనామంగా గానీ చదవవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘ఐగుప్తు వాడి.’ ఇక్కడి హెబ్రీ పదం సాధారణంగా పెద్ద నదిని కాక, కాలానుగుణంగా నీరు ప్రవహించే వాగు లేదా దాని ప్రవాహపాత్రను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... אֶת הֶחָג
  choice: పండుగ జరిపాడు / జరుపుకున్నారు
  rationale: చేయడం అనే మూలార్థం ఉన్నప్పటికీ, חָגతో కలిసి ఈ ప్రయోగం పండుగను ఆచరించడం లేదా జరుపుకోవడం అనే సహజ అర్థాన్ని ఇస్తుంది. తెలుగు వాక్యప్రవాహం కోసం మొదట సొలొమోనును ఏకవచనంలో ఉంచి, తరువాత అతనితో కూడిన సభను బహువచనంలో తెలిపాం.
- source_word: קָהָל גָּדוֹל
  choice: ఒక గొప్ప సభ
  rationale: కేవలం జనసమూహం కాక, కూడిన సమాజాన్ని సూచించే అధికారిక సామూహిక భావాన్ని ‘సభ’ నిలుపుతుంది.
- source_word: מִלְּבוֹא חֲמָת
  choice: లెబో-హమాతు నుండి
  rationale: ఇది స్థిరమైన భౌగోళిక సరిహద్దు పేరుగా తరచుగా వాడబడుతుంది. ‘హమాతు ప్రవేశద్వారం నుండి’ అనే వివరణాత్మక పఠనాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: נַחַל מִצְרַיִם
  choice: ఐగుప్తు వాగు
  rationale: נַחַל సాధారణంగా పెద్ద నది కంటే కాలానుగుణంగా ప్రవహించే వాగు లేదా ప్రవాహపాత్రను సూచిస్తుంది. ‘వాగు’ సహజమైన తెలుగు పదం; నైలు నదితో గందరగోళాన్ని నివారిస్తుంది.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵינוּ
  choice: మన దేవుడైన యెహోవా సన్నిధిలో
  rationale: లִפְנֵי యొక్క స్థల-సంబంధ భావాన్ని సహజ తెలుగులో ‘సన్నిధిలో’ తెలియజేస్తుంది; יְהוָה అనే ఒడంబడిక నామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: שִׁבְעַת יָמִים וְשִׁבְעַת יָמִים
  choice: ఏడు రోజులు, మరొక ఏడు రోజులు
  rationale: రెండు వరుస ఏడు రోజుల కాలాలను సూచించే హెబ్రీ పునరుక్తిని కూలదోసి కేవలం ‘పద్నాలుగు రోజులు’గా చేయకుండా స్పష్టంగా నిలుపుతుంది.
- source_word: אַרְבָּעָה עָשָׂר יוֹם
  choice: మొత్తం పద్నాలుగు రోజులు
  rationale: ముందటి రెండు ఏడు రోజుల కాలాల మొత్తాన్ని తెలిపే సమాపక వివరణగా సహజ తెలుగులో అందించాం.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుగా మార్చకుండా, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపంలో నిలుపుతుంది.
- issue: రెండు ఏడు రోజుల కాలాల సంబంధం
  choice: ఏడు రోజులు, మరొక ఏడు రోజులు—మొత్తం పద్నాలుగు రోజులు
  alternative: పద్నాలుగు రోజులు
  rationale: ఈ రెండు కాలాలు ఏ ఆచారాలకు సంబంధించినవో వచనం స్వయంగా విడదీయదు. అందువల్ల వాటికి వేర్వేరు పండుగల పేర్లు చేర్చకుండా మూలంలోని నిర్మాణాత్మక పునరుక్తినే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. దీర్ఘమైన హెబ్రీ వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించినా, సొలొమోను, ఇశ్రాయేలు మహాసభ, భౌగోళిక హద్దులు, యెహోవా సన్నిధి, రెండు ఏడు రోజుల కాలాలు మరియు పద్నాలుగు రోజుల మొత్తం అన్నీ నిలిపాం. అందించిన ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదటిప్పణి గుర్తులు వాటి విషయాలకు సరిపోని స్థానాల్లో ఉన్నందున, [a]ను లెబో-హమాతు వద్దவும் [b]ను ఐగుప్తు వాగు వద్దவும் ఉంచాం.
