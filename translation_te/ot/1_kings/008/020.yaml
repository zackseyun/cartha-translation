id: 1KI.8.20
reference: 1 Kings 8:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֣קֶם יְהוָ֔ה אֶת דְּבָר֖/וֹ אֲשֶׁ֣ר דִּבֵּ֑ר וָ/אָקֻ֡ם תַּחַת֩ דָּוִ֨ד אָבִ֜/י וָ/אֵשֵׁ֣ב עַל כִּסֵּ֣א יִשְׂרָאֵ֗ל כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וָ/אֶבְנֶ֣ה הַ/בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/020.yaml
  text: And Yahweh has fulfilled his word that he spoke[a], and I have risen in the place of David my father and sit on the throne of Israel, just as Yahweh spoke, and I have built the house for the name of Yahweh[b], the God of Israel.
translation:
  language: te
  text: యెహోవా తాను పలికిన మాటను నెరవేర్చాడు[a]; నేను నా తండ్రి దావీదు స్థానాన్ని చేపట్టి ఇశ్రాయేలు సింహాసనంపై కూర్చున్నాను, యెహోవా పలికినట్లే; ఇశ్రాయేలు దేవుడైన యెహోవా నామం కోసం ఆ ఇంటిని నిర్మించాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తాను పలికిన మాటను స్థిరపరిచాడు” లేదా “తాను పలికిన మాటను కార్యరూపంలో పెట్టాడు.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో “ఆ ఇల్లు”; ఇక్కడ దేవాలయం ఉద్దేశించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: నెరవేర్చాడు
  rationale: హిఫీల్ రూపంలోని קום, ‘మాట’తో కలిసినప్పుడు పలికినదాన్ని స్థిరపరచడం లేదా కార్యరూపంలో నెరవేర్చడం అనే భావం ఇస్తుంది; సందర్భంలో దేవుని వాగ్దానం నెరవేరినదే ప్రధాన భావం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో ఉంచింది.
- source_word: דְּבָרוֹ אֲשֶׁר דִּבֵּר
  choice: తాను పలికిన మాటను
  rationale: ‘మాట/పలికాడు’ అనే హీబ్రూ పునరుక్తిని సాధ్యమైనంతవరకు నిలుపుతూ, దానిని నేరుగా ‘వాగ్దానం’ అని వ్యాఖ్యానించలేదు.
- source_word: וָאָקֻם תַּחַת דָּוִד אָבִי
  choice: నేను నా తండ్రి దావీదు స్థానంలో నిలిచి
  rationale: קום అనే క్రియతో ఉన్న పదబంధం దావీదు తరువాతి రాజవంశ వారసత్వాన్ని సూచిస్తుంది; ‘స్థానంలో నిలిచి’ మూలంలోని క్రియా సంబంధాన్ని, వారసత్వ భావాన్ని రెండింటినీ కాపాడుతుంది.
- source_word: וָאֵשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సింహాసనం మీద కూర్చున్నాను
  rationale: సింహాసనం మీద కూర్చోవడం అనే రాజ్యాధికార చిత్రాన్ని నేరుగా, సహజమైన తెలుగులో ఉంచింది.
- source_word: וָאֶבְנֶה הַבַּיִת
  choice: ఆ మందిరాన్ని నిర్మించాను
  rationale: הַבַּיִת అక్షరార్థంగా ‘ఆ ఇల్లు’; ఈ సందర్భంలో అది దేవాలయాన్ని సూచిస్తుంది. తెలుగులో ‘మందిరం’ referent‌ను స్పష్టంగా చేస్తూ గౌరవప్రదంగా ఉంటుంది; అక్షరార్థాన్ని పాదటిప్పణిలో తెలిపింది.
- source_word: לְשֵׁם יְהוָה
  choice: యెహోవా నామం కోసం
  rationale: ‘నామం కోసం’ అనే ముఖ్యమైన బైబిలీయ వ్యక్తీకరణను ‘గౌరవార్థం’గా పరిమితం చేయకుండా నిలుపుకుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: ఒడంబడిక సంబంధిత బిరుదును సహజమైన తెలుగు వాక్య నిర్మాణంలో నేరుగా అందించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో భర్తీ చేయలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఎంచుకుంది; ఉచ్చారణకు సంబంధించిన ప్రత్యామ్నాయాన్ని బలవంతంగా పరిష్కరించలేదు.
- issue: הַבַּיִת ను ‘ఇల్లు’గా లేదా ‘మందిరం’గా ఇవ్వడం
  choice: మందిరం
  alternative: ఇల్లు
  rationale: సందర్భంలో ఇది యెరూషలేము దేవాలయాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన స్పష్టత కోసం ‘మందిరం’ వాడి, హీబ్రూ అక్షరార్థాన్ని పాదటిప్పణిలో భద్రపరిచింది.
- issue: דְּבָרוֹ ను ‘మాట’గా లేదా ‘వాగ్దానం’గా ఇవ్వడం
  choice: మాట
  alternative: వాగ్దానం
  rationale: సందర్భంలో వాగ్దాన భావం ఉన్నప్పటికీ, మూలం వాడిన సాధారణ ‘మాట’ను ఉంచడం ద్వారా పునరుక్తి మరియు భావ విస్తృతిని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. మూలంలోని ‘మాట—పలికాడు’, ‘స్థానంలో నిలిచాడు’, ‘నామం కోసం’ అనే ముఖ్య భావసంబంధాలు నిలుపబడ్డాయి; పొడవైన హీబ్రూ సమన్వయ వాక్యాన్ని తెలుగు పఠనసౌలభ్యం కోసం మూడు వాక్యాలుగా విభజించింది.
