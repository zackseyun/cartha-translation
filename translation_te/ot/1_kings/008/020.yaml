revisions:
- from: యెహోవా తాను పలికిన మాటను నెరవేర్చాడు[a]. నేను నా తండ్రి దావీదు స్థానంలో నిలిచి, యెహోవా పలికినట్లే ఇశ్రాయేలు సింహాసనం మీద కూర్చున్నాను. ఇశ్రాయేలు దేవుడైన యెహోవా నామం కోసం ఆ మందిరాన్ని నిర్మించాను[b].
  to: యెహోవా తాను పలికిన మాటను నెరవేర్చాడు[a]; నేను నా తండ్రి దావీదు స్థానాన్ని చేపట్టి ఇశ్రాయేలు సింహాసనంపై కూర్చున్నాను, యెహోవా పలికినట్లే; ఇశ్రాయేలు దేవుడైన యెహోవా నామం కోసం ఆ ఇంటిని నిర్మించాను[b].
  rationale: రాజవంశ వారసత్వాన్ని తెలుపుతున్న תַּחַת దావీదు భావానికి ‘స్థానాన్ని చేపట్టి’ అనే సహజమైన తెలుగు రూపాన్ని వాడాం. హీబ్రూ הַבַּיִת యొక్క ప్రత్యక్ష పదప్రయోగాన్ని ప్రధాన పాఠ్యంలో ‘ఆ ఇంటిని’గా భద్రపరిచి, సందర్భానుసారమైన దేవాలయ సూచనను పాదటిప్పణిలో ఉంచాం. మిగతా కీలక పునరుక్తులు మరియు దైవనామం యథాతథంగా నిలిపాం.
