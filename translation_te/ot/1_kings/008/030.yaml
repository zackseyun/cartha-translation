source:
  edition: WLC
  text: וְ/שָׁ֨מַעְתָּ֜ אֶל תְּחִנַּ֤ת עַבְדְּ/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יִֽתְפַּֽלְל֖וּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וְ֠/אַתָּה תִּשְׁמַ֞ע אֶל מְק֤וֹם שִׁבְתְּ/ךָ֙ אֶל הַ/שָּׁמַ֔יִם וְ/שָׁמַעְתָּ֖ וְ/סָלָֽחְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/030.yaml
  text: And hear the plea of your servant and of your people Israel when they pray toward this place[a]. And hear in heaven, the place of your dwelling[b]; hear and forgive.
translation:
  language: te
  text: నీ సేవకుని విన్నపాన్నీ, నీ ప్రజలైన ఇశ్రాయేలు ఈ స్థలం వైపు[a] ప్రార్థించేటప్పుడు వారి విన్నపాన్నీ ఆలకించు. నీ నివాసస్థలమైన పరలోకంలో[b] ఆలకించు; ఆలకించి క్షమించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఈ స్థలానికి.’ హీబ్రూ పదబంధాన్ని ఇలా మరింత అక్షరార్థంగా అనువదించవచ్చు; ‘ఈ స్థలం వైపు’ అనేది దేవాలయం దిశగా చేసే ప్రార్థనను స్పష్టంగా తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పరలోకంలో ఉన్న నీ నివాసస్థలంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחִנַּת
  choice: విన్నపం
  rationale: కృప లేదా కనికరం కోరుతూ చేసే earnest petition అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘విన్నపం’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: עַבְדְּךָ
  choice: నీ సేవకుడు
  rationale: దేవుని ఎదుట వినయంతో తనను తాను సూచించుకునే రాజప్రార్థనా సందర్భానికి ‘నీ సేవకుడు’ తగినది; ‘దాసుడు’ కంటే ఆధునిక పాఠకులకు సహజంగా ఉంటుంది.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: నీ ప్రజలైన ఇశ్రాయేలు
  rationale: ఇశ్రాయేలును దేవుని ప్రజలుగా గుర్తించే హీబ్రూ సంబంధాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: יִתְפַּלְלוּ
  choice: ప్రార్థించేటప్పుడు
  rationale: פלל యొక్క హిత్పయేల్ రూపం ఇక్కడ సాధారణంగా ప్రార్థించడాన్ని సూచిస్తుంది; కాలసంబంధ ఉపవాక్యాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: ఈ స్థలం వైపు
  rationale: אֶל యొక్క దిశార్థాన్ని నిలుపుతూ, దేవాలయం వైపు తిరిగి చేసే ప్రార్థనను సహజంగా తెలియజేస్తుంది.
- source_word: מְקוֹם שִׁבְתְּךָ
  choice: నీ నివాసస్థలం
  rationale: ‘నీవు నివసించే స్థలం’ అనే హీబ్రూ నిర్మాణాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: אֶל הַשָּׁמַיִם
  choice: పరలోకంలో
  rationale: అక్షరార్థంగా אֶל ‘కు/వైపు’ అయినప్పటికీ, ‘ఆలకించు’ మరియు దేవుని నివాసస్థలం అనే సందర్భంలో ఇది స్థానార్థకంగా ఉంది; ‘పరలోకంలో’ తెలుగులో సహజం.
- source_word: וְשָׁמַעְתָּ
  choice: ఆలకించు
  rationale: కేవలం శబ్దం వినడం కాక, ప్రార్థనకు శ్రద్ధగా చెవియొగ్గి స్పందించడాన్ని ‘ఆలకించు’ తెలియజేస్తుంది.
- source_word: וְסָלָחְתָּ
  choice: క్షమించు
  rationale: దైవిక క్షమాపణను సూచించే סלח కు స్పష్టమైన, ప్రామాణిక తెలుగు సమానార్థకం.
theological_decisions:
- issue: దేవాలయం వైపు ప్రార్థన మరియు పరలోకం దేవుని నివాసస్థలం కావడం
  choice: ‘ఈ స్థలం వైపు’ మరియు ‘నీ నివాసస్థలమైన పరలోకంలో’ అనే రెండు అంశాలనూ నిలిపాము.
  alternative: ‘ఈ దేవాలయంలో ప్రార్థించేటప్పుడు’ అని స్థలాన్ని మాత్రమే సూచించడం, లేదా ‘పరలోకం నుండి ఆలకించు’ అని దైవిక చర్య వచ్చే దిశను ప్రధానంగా చూపడం.
  rationale: భూమిపై దేవాలయం ప్రార్థనకు దిశాకేంద్రంగా ఉండడాన్నీ, పరలోకం దేవుని నివాసస్థలంగా ఉండడాన్నీ వాక్యం కలిపి ఉంచుతుంది. ఒక అంశాన్ని మరొకదానిలో కలిపేయకుండా ఆ ఉద్వేగాన్ని అనువాదం సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలిని వాడాం. ‘ఆలకించు’ అనే పదం మూలంలోని పునరుక్తిని నిలుపుతూ శ్రద్ధగా విని స్పందించాలనే భావాన్ని అందిస్తుంది; వాక్య నిర్మాణం సాధారణ పాఠకులకు సులభంగా ఉండేలా ఉంచాం.
