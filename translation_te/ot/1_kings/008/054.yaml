id: 1KI.8.54
reference: 1 Kings 8:54
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת שְׁלֹמֹ֗ה לְ/הִתְפַּלֵּל֙ אֶל יְהוָ֔ה אֵ֛ת כָּל הַ/תְּפִלָּ֥ה וְ/הַ/תְּחִנָּ֖ה הַ/זֹּ֑את קָ֞ם מִ/לִּ/פְנֵ֨י מִזְבַּ֤ח יְהוָה֙ מִ/כְּרֹ֣עַ עַל בִּרְכָּ֔י/ו וְ/כַפָּ֖י/ו פְּרֻשׂ֥וֹת הַ/שָּׁמָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/054.yaml
  text: And when Solomon had finished praying to Yahweh with all this prayer and plea for favor[a], he rose from before the altar of Yahweh[b], from kneeling on his knees with his palms spread out toward heaven.
translation:
  language: te
  text: సొలొమోను యహ్వేకు ఈ ప్రార్థన, కృప కోసం చేసిన ఈ విన్నపం అంతటితో ప్రార్థించడం ముగించినప్పుడు, అతడు యహ్వే బలిపీఠం ఎదుట తన మోకాళ్లపై మోకరించి, అరచేతులను ఆకాశం వైపు చాపి ఉన్న స్థితి నుంచి లేచాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: చేసి ముగించినప్పుడు
  rationale: כְּతో కూడిన infinitive construct కాలసంబంధ ఉపవాక్యాన్ని పరిచయం చేస్తుంది. హీబ్రూ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: לְהִתְפַּלֵּל אֶל יְהוָה
  choice: యహ్వేకు ... చేసి
  rationale: ప్రార్థన యహ్వేను ఉద్దేశించి చేయబడిందనే దిశార్థాన్ని తెలుగులో సహజంగా ‘యహ్వేకు’ అని వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֵת כָּל הַתְּפִלָּה וְהַתְּחִנָּה הַזֹּאת
  choice: ఈ ప్రార్థననూ, కృప కోసం చేసిన ఈ విన్నపాన్నంతటినీ
  rationale: תְּפִלָּה అనే సాధారణ ‘ప్రార్థన’ పదానికీ, కృప లేదా అనుగ్రహం కోసం చేసే ఆర్త విన్నపాన్ని సూచించే תְּחִנָּה పదానికీ మధ్య ఉన్న భేదాన్ని నిలుపుతుంది. כָּל యొక్క సమగ్రతను ‘అంతటినీ’ తెలియజేస్తుంది.
- source_word: קָם
  choice: లేచాడు
  rationale: ప్రార్థన అనంతరం సొలొమోను తన శరీర భంగిమను మార్చుకున్నాడనే అర్థాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מִלִּפְנֵי מִזְבַּח יְהוָה
  choice: యహ్వే బలిపీఠం ఎదుట ... ఉన్న స్థితి నుంచి
  rationale: לִפְנֵי యొక్క స్థలార్థమైన ‘ఎదుట’ను, מִן సూచించే బయలుదేరిన స్థితిని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: מִכְּרֹעַ עַל בִּרְכָּיו
  choice: తన మోకాళ్లపై మోకరించి
  rationale: మూలంలోని స్పష్టమైన శరీర భంగిమను తొలగించకుండా, తెలుగులో గౌరవప్రదంగా మరియు సహజంగా అందిస్తుంది.
- source_word: וְכַפָּיו פְּרֻשׂוֹת הַשָּׁמָיִם
  choice: అరచేతులను ఆకాశం వైపు చాపి
  rationale: כַּף యొక్క నిర్దిష్ట అర్థమైన ‘అరచేతి’ని నిలుపుతూ, ఆకాశం వైపు విప్పి ఉంచిన ప్రార్థనా భంగిమను సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; దానిని ఒక బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా లిప్యంతరీకరించడం మూలంలోని నామస్వరూపాన్ని కాపాడుతుంది.
- issue: תְּחִנָּה యొక్క భావపరిధి
  choice: కృప కోసం చేసిన విన్నపం
  alternative: విన్నపం / ప్రార్థన
  rationale: ఈ పదం సాధారణ అభ్యర్థనకన్నా కృప లేదా అనుగ్రహం కోరే ఆర్త విన్నపాన్ని సూచిస్తుంది. అయితే ‘కృప’ను సిద్ధాంతపరమైన ప్రత్యేక అర్థంలో విస్తరించకుండా, కోరబడే అనుకూలతగా మాత్రమే వ్యక్తపరచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. మూలంలోని మోకాళ్లపై మోకరించడం, అరచేతులను ఆకాశం వైపు చాపడం అనే శరీర భంగిమలు స్పష్టంగా నిలుపబడ్డాయి; అనవసరమైన మతపరమైన పారిభాషికతను నివారించాం.
