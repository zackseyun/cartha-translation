revisions:
- from: సొలొమోను యహ్వేకు ఈ ప్రార్థననూ, కృప కోసం చేసిన ఈ విన్నపాన్నంతటినీ[a] చేసి ముగించినప్పుడు, అతడు యహ్వే బలిపీఠం ఎదుట తన మోకాళ్లపై మోకరించి, అరచేతులను ఆకాశం వైపు చాపి ఉన్న స్థితి నుంచి లేచాడు.
  to: సొలొమోను యహ్వేకు ఈ ప్రార్థన, కృప కోసం చేసిన ఈ విన్నపం అంతటితో ప్రార్థించడం ముగించినప్పుడు, అతడు యహ్వే బలిపీఠం ఎదుట తన మోకాళ్లపై మోకరించి, అరచేతులను ఆకాశం వైపు చాపి ఉన్న స్థితి నుంచి లేచాడు.
