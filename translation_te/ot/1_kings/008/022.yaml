  text: וַ/יַּעֲמֹ֣ד שְׁלֹמֹ֗ה לִ/פְנֵי֙ מִזְבַּ֣ח יְהוָ֔ה נֶ֖גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/022.yaml
  text: Then Solomon stood before the altar of Yahweh in front of all the assembly of Israel and spread out his hands toward heaven[a].
translation:
  language: te
  text: అప్పుడు సొలొమోను యాహ్వే బలిపీఠం ముందు, ఇశ్రాయేలు సమాజమంతటి ఎదుట నిలబడి, ఆకాశం వైపు తన చేతులు చాపాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో: “ఆకాశాల వైపు.”'
    reason: హీబ్రూ הַשָּׁמָיִם రూపాన్ని మరింత అక్షరార్థంగా సూచించడానికి.
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: నిలబడి
  rationale: עמד అనే క్రియ ఇక్కడ కథన క్రమంలోని సాధారణ గత చర్యను సూచిస్తుంది; తెలుగులో వాక్యప్రవాహానికి సహజంగా ‘నిలబడి’ అని అనువదించాం.
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: యెహోవా బలిపీఠం ముందు
  rationale: לִפְנֵי యొక్క స్థలార్థాన్ని ‘ముందు’ స్పష్టంగా తెలియజేస్తుంది; నిర్మాణబంధాన్ని సహజ తెలుగు పదక్రమంలో ఇచ్చాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు సమాజమంతటి ఎదుట
  rationale: נֶגֶד యొక్క బహిరంగ స్థలసంబంధ భావాన్ని ‘ఎదుట’ తెలియజేస్తుంది; כָּל קְהַל‌ను సహజంగా ‘సమాజమంతటి’ అని ఇచ్చాం.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: తన చేతులు చాపాడు
  rationale: ప్రార్థనలో చేతులను విస్తరించే భంగిమను ఆధునిక తెలుగులో సహజంగా ‘చేతులు చాపాడు’ తెలియజేస్తుంది; כף యొక్క అవయవసూచనను సందర్భానుసారం ‘చేతులు’గా ఇచ్చాం.
- source_word: הַשָּׁמָיִם
  choice: ఆకాశం
  rationale: ప్రార్థనా భంగిమలో చేతులు చాపిన దిశను తెలుగులో సహజంగా ‘ఆకాశం వైపు’ అంటారు; హీబ్రూ రూపంలోని బహువచనసదృశ భావాన్ని పాదటిప్పణిలో సూచించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా, సాధారణ తెలుగు బైబిల్ పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణను ఉపయోగించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలిని ఉపయోగించాం. ‘బలిపీఠం’, ‘సమాజం’ వంటి స్థిరమైన బైబిల్ పదజాలాన్ని ఉంచుతూ, వాక్యనిర్మాణాన్ని సహజ తెలుగు క్రమంలో అమర్చాం.
