source:
  edition: WLC
  text: לְ/הַטּ֥וֹת לְבָבֵ֖/נוּ אֵלָ֑י/ו לָ/לֶ֣כֶת בְּ/כָל דְּרָכָ֗י/ו וְ/לִ/שְׁמֹ֨ר מִצְוֺתָ֤י/ו וְ/חֻקָּי/ו֙ וּ/מִשְׁפָּטָ֔י/ו אֲשֶׁ֥ר צִוָּ֖ה אֶת אֲבֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/058.yaml
  text: that he may incline our hearts to himself[a], to walk in all his ways and to keep his commandments, his statutes, and his judgments, which he commanded our fathers.
translation:
  language: te
  text: ఆయన మన హృదయాలను తనవైపు మళ్లించి, మనం ఆయన మార్గాలన్నిటిలో నడిచేలా, ఆయన మన పితరులకు[a] ఆజ్ఞాపించిన తన ఆజ్ఞలను, కట్టడలను, న్యాయవిధులను పాటించేలా చేయుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మన పూర్వీకులకు.’ హీబ్రూలో ‘మన పితరులు’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַטּוֹת
  choice: మళ్లించి ... చేయుగాక
  rationale: హిఫిల్ రూపం ‘తిప్పడం/మళ్లించడం’ అనే కారణార్థాన్ని వ్యక్తం చేస్తుంది. మునుపటి వాక్య సందర్భంలో ఉన్న ప్రార్థనా భావాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘చేయుగాక’తో నిర్మించబడింది.
- source_word: לְבָבֵנוּ
  choice: మన హృదయాలను
  rationale: לֵבָב సంకల్పం, ఆలోచన, అంతరంగ ప్రవృత్తిని సూచిస్తుంది; ‘హృదయాలు’ మూలంలోని రూపకాన్ని నిలుపుతుంది.
- source_word: אֵלָיו
  choice: తనవైపు
  rationale: దేవుని దిశగా హృదయాలను మళ్లించడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: ఆయన మార్గాలన్నిటిలో మనం నడిచేలా
  rationale: నడవడం అనే ఒడంబడిక సంబంధమైన జీవన రూపకాన్ని, అలాగే ‘ఆయన మార్గాలు’ అనే మూలపద చిత్రాన్ని కాపాడుతుంది.
- source_word: וְלִשְׁמֹר
  choice: పాటించేలా
  rationale: ఆజ్ఞలకు సంబంధించిన సందర్భంలో שׁמר అంటే వాటిని గైకొనడం లేదా ఆచరించడం; ఆధునిక తెలుగులో ‘పాటించడం’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: מִצְוֺתָיו
  choice: ఆయన ఆజ్ఞలను
  rationale: మూలంలోని ఆదేశాత్మక ఒడంబడిక పదాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: וְחֻקָּיו
  choice: కట్టడలను
  rationale: నిర్దేశించబడిన శాసనాలు అనే חֹק/חֻקָּה భావాన్ని తెలుపుతూ, మిగతా న్యాయపదాల నుంచి భేదాన్ని నిలుపుతుంది.
- source_word: וּמִשְׁפָּטָיו
  choice: న్యాయవిధులను
  rationale: מִשְׁפָּט లోని న్యాయపరమైన తీర్పు లేదా నియమం భావాన్ని తెలుపుతుంది; ‘ఆజ్ఞలు,’ ‘కట్టడలు’తో ఉన్న త్రయభేదాన్ని కాపాడుతుంది.
- source_word: אֲשֶׁר צִוָּה
  choice: ఆయన ఆజ్ఞాపించిన
  rationale: న్యాయపదాల త్రయాన్ని విశేషించే సంబంధ ఉపవాక్యాన్ని మూలానికి దగ్గరగా ఉంచుతుంది.
- source_word: אֶת אֲבֹתֵינוּ
  choice: మన పితరులకు
  rationale: ఆבות అనే పురుషలింగ బంధుత్వ పదాన్ని యథాతథంగా ప్రతిబింబిస్తుంది; సందర్భంలో ఇది ఇశ్రాయేలు పూర్వతరాలను సూచిస్తుంది.
theological_decisions:
- issue: ఒడంబడిక ధర్మశాస్త్రానికి సంబంధించిన మూడు పదాల అనువాదం
  choice: ఆయన ఆజ్ఞలను, కట్టడలను, న్యాయవిధులను
  alternative: ఆయన ఆదేశాలను, శాసనాలను, నియమాలను
  rationale: హీబ్రూ మూడు వేర్వేరు న్యాయపదాలను ఉపయోగిస్తుంది. వాటిని ఒకే సాధారణ భావంగా మార్చకుండా పదభేదాన్ని నిలుపడం మూలంలోని ఒడంబడిక భాషను కాపాడుతుంది.
- issue: పూర్వతరాలను సూచించే లింగనిర్దిష్ట పదం
  choice: మన పితరులకు
  alternative: మన పూర్వీకులకు
  rationale: హీబ్రూ స్పష్టంగా పురుషలింగ బంధుత్వ పదాన్ని వాడుతుంది. ‘పితరులు’ మూలరూపాన్ని కాపాడుతుంది; విస్తృత సూచనను ‘పూర్వీకులు’గా అర్థం చేసుకునే అవకాశాన్ని పాదసూచికలో ఇస్తుంది.
- issue: దేవుడు మానవ హృదయాన్ని మళ్లించడం మరియు మానవ విధేయత మధ్య సంబంధం
  choice: మన హృదయాలను తనవైపు మళ్లించి ... మనం నడిచేలా ... పాటించేలా చేయుగాక
  alternative: మన హృదయాలను తనవైపు మళ్లించడానికి ... నడవడానికి ... పాటించడానికి
  rationale: మూలంలోని ఉద్దేశార్థక క్రియారూపాల సంబంధాన్ని ప్రార్థనా సందర్భంలో సహజంగా వ్యక్తం చేస్తూనే, దైవ కార్యాన్నీ మానవ విధేయతనూ రెండింటినీ ఉంచుతుంది; వాటి మధ్య ఉన్న ధార్మిక ఉద్రిక్తతను తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలి వాడబడింది. ‘మార్గాలలో నడవడం,’ ‘హృదయాలను మళ్లించడం’ వంటి హీబ్రూ రూపకాలు అర్థమయ్యే విధంగా నిలుపబడ్డాయి. న్యాయపదాల త్రయం ఉద్దేశపూర్వకంగా వేర్వేరు పదాలతో అనువదించబడింది.
