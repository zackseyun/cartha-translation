  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే నిర్మాణ వర్ణన. ‘మూర’ అనే సంప్రదాయ బైబిలు కొలమానాన్ని నిలిపి, ‘కొలతతాడు’ ద్వారా సందర్భాన్ని స్పష్టం చేశాం. మూలపాఠంలోని ‘రెండవ స్తంభం’ అనే అసాధారణతను ప్రధాన పాఠంలోనే కాపాడాం.
