id: 1KI.7.15
reference: 1 Kings 7:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֛צַר אֶת שְׁנֵ֥י הָ/עַמּוּדִ֖ים נְחֹ֑שֶׁת שְׁמֹנֶ֨ה עֶשְׂרֵ֜ה אַמָּ֗ה קוֹמַת֙ הָ/עַמּ֣וּד הָ/אֶחָ֔ד וְ/חוּט֙ שְׁתֵּים עֶשְׂרֵ֣ה אַמָּ֔ה יָסֹ֖ב אֶת הָ/עַמּ֥וּד הַ/שֵּׁנִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/015.yaml
  text: He cast the two bronze pillars; the height of the one pillar was eighteen cubits[a], and a line of twelve cubits measured around it.
translation:
  language: te
  text: అతడు రెండు కంచు స్తంభాలను పోతపోశాడు. ఒక స్తంభం ఎత్తు పద్దెనిమిది మూరలు; పన్నెండు మూరల కొలతతాడు రెండవ స్తంభం చుట్టూ తిరిగింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠం అక్షరార్థంగా “రెండవ స్తంభం” అని ఉంది. ఒక స్తంభం ఎత్తును, రెండవ స్తంభం చుట్టుకొలతను చెప్పడం ద్వారా ఒకేలా ఉన్న రెండు స్తంభాల కొలతలను సూచిస్తున్నట్లు భావించవచ్చు.
    reason: మూలపాఠంలోని అసాధారణమైన సూచనను—‘ఒక స్తంభం’ నుంచి ‘రెండవ స్తంభం’కు మారడాన్ని—పాఠకునికి తెలియజేసి, దాన్ని నిశ్శబ్దంగా సవరించకుండా ఉంచడం.
lexical_decisions:
- source_word: וַיָּצַר
  choice: పోతపోశాడు
  rationale: కంచుతో చేసిన ఆలయ నిర్మాణ భాగాల సందర్భంలో ఈ క్రియ లోహాన్ని అచ్చులో పోసి తయారుచేయడాన్ని సూచిస్తుంది; సాధారణమైన ‘రూపొందించాడు’ కంటే ‘పోతపోశాడు’ సందర్భానుకూలం.
- source_word: שְׁנֵי הָעַמּוּדִים
  choice: రెండు ... స్తంభాలను
  rationale: ఆలయ నిర్మాణ సందర్భంలో పెద్ద నిలువు నిర్మాణ భాగాలకు ‘స్తంభాలు’ సహజమైన ఆధునిక తెలుగు పదం.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ప్రాచీన లోహపని సందర్భంలో ఇది సాధారణంగా రాగి మిశ్రమమైన bronze‌ను సూచిస్తుంది; తెలుగులో ‘కంచు’ సహజమైన సమానం.
- source_word: שְׁמֹנֶה עֶשְׂרֵה אַמָּה
  choice: పద్దెనిమిది మూరలు
  rationale: ప్రాచీన కొలమానాన్ని ఆధునిక ప్రమాణానికి మార్చకుండా ‘మూర’గా నిలుపుతుంది.
- source_word: קוֹמַת הָעַמּוּד הָאֶחָד
  choice: ఒక స్తంభం ఎత్తు
  rationale: హీబ్రూ నామవాచక నిర్మాణ భావాన్ని సహజమైన తెలుగు వాక్యక్రమంలో వ్యక్తం చేస్తుంది.
- source_word: וְחוּט
  choice: కొలతతాడు
  rationale: חוּט అక్షరార్థంగా దారం లేదా తాడు; చుట్టుకొలత సందర్భం దాని కొలిచే పనిని స్పష్టం చేస్తున్నందున ‘కొలతతాడు’ సహజంగా అర్థాన్ని అందిస్తుంది.
- source_word: שְׁתֵּים עֶשְׂרֵה אַמָּה
  choice: పన్నెండు మూరల
  rationale: సంఖ్యను, ప్రాచీన కొలమానాన్ని నేరుగా నిలుపుతుంది.
- source_word: יָסֹב
  choice: చుట్టూ చుట్టుకుంది
  rationale: క్రియ యొక్క ‘చుట్టూ వెళ్లింది/ఆవరించింది’ అనే రూపకాన్ని నిలుపుతూ, ఇది చుట్టుకొలతను తెలిపే కొలతతాడని సందర్భం ద్వారా అర్థమయ్యేలా చేస్తుంది.
- source_word: הָעַמּוּד הַשֵּׁנִי
  choice: రెండవ స్తంభం
  rationale: WLC పాఠంలోని నిర్దిష్ట క్రమసంఖ్యను నేరుగా అనువదిస్తుంది; దాన్ని ‘దాని’గా మార్చి మూలపాఠంలోని వ్యత్యాసాన్ని తొలగించలేదు.
