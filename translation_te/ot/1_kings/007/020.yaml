  register: ఆధునిక ప్రామాణిక తెలుగు; వాస్తు వివరణకు తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని కఠినమైన స్థలసంబంధ నిర్మాణాన్ని పూర్తిగా సులభీకరించకుండా, ప్రధాన పాఠంలో చదవదగిన రూపం ఇచ్చి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపింది.
