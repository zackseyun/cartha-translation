  text: וְ/כֹתָרֹ֗ת עַל שְׁנֵי֙ הָֽ/עַמּוּדִ֔ים גַּם מִ/מַּ֨עַל֙ מִ/לְּ/עֻמַּ֣ת הַ/בֶּ֔טֶן אֲשֶׁ֖ר לְ/עֵ֣בֶר שבכה וְ/הָ/רִמּוֹנִ֤ים מָאתַ֨יִם֙ טֻרִ֣ים סָבִ֔יב עַ֖ל הַ/כֹּתֶ֥רֶת הַ/שֵּׁנִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/020.yaml
  text: And the capitals were on the two pillars[a], also above, opposite the bulge that was beside the latticework; and the pomegranates were two hundred, in rows all around[c][b], on the second capital.
translation:
  language: te
  text: రెండు స్తంభాలపై ఉన్న శీర్షభాగాలు జాలిక[c] పక్కన ఉన్న ఉబ్బెత్తు భాగానికి[b] ఎదురుగా పైభాగంలో కూడా ఉన్నాయి; రెండవ శీర్షభాగం[a] మీద దాని చుట్టూ వరుసలుగా రెండు వందల దానిమ్మపండు ఆకృతులు ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరో శీర్షభాగం.” ఈ నిర్మాణ వర్ణనలో “రెండవది” అనే హీబ్రూ పదం రెండవ స్తంభానికి చెందిన జత శీర్షభాగాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “ఉబ్బెత్తు భాగం” అని అనువదించిన హీబ్రూ పదానికి అక్షరార్థం “కడుపు”; ఇక్కడ అది శీర్షభాగంలోని గుండ్రంగా ఉబ్బిన భాగాన్ని సూచిస్తున్నట్లు ఉంది.
    reason: lexical_alternative
  - marker: c
    text: “జాలిక” అంటే శీర్షభాగాలకు అమర్చిన వలలాంటి అలంకార నిర్మాణం.
    reason: cultural_note
lexical_decisions:
- source_word: כֹתָרֹת / הַכֹּתֶרֶת
  choice: శీర్షభాగాలు / శీర్షభాగం
  rationale: స్తంభాల పైభాగంలోని అలంకార నిర్మాణాన్ని సూచించే ఆధునిక, సులభంగా అర్థమయ్యే వాస్తుశిల్ప పదబంధం.
- source_word: עַל שְׁנֵי הָעַמּוּדִים
  choice: రెండు స్తంభాల మీద
  rationale: స్థానార్థక హీబ్రూ పదబంధాన్ని సహజమైన తెలుగులో నేరుగా తెలిపింది.
- source_word: גַּם מִמַּעַל
  choice: పైభాగంలో కూడా
  rationale: גַּם యొక్క అదనపు భావాన్నీ, מִמַּעַל యొక్క ఎత్తైన స్థాన భావాన్నీ నిలుపుతుంది.
- source_word: מִלְעֻמַּת הַבֶּטֶן
  choice: ఉబ్బెత్తు భాగానికి ఎదురుగా
  rationale: הַבֶּטֶן అక్షరార్థంగా ‘కడుపు’; ఇక్కడ గుండ్రంగా ఉబ్బిన వాస్తు భాగాన్ని సూచిస్తున్నందున అర్థస్పష్టమైన రూపం వాడబడింది.
- source_word: אֲשֶׁר לְעֵבֶר שבכה
  choice: జాలిక పక్కన ఉన్న
  rationale: కఠినమైన స్థలసంబంధ వాక్యనిర్మాణాన్ని అతిగా నిర్ధారించకుండా, అలంకార జాలికకు సమీప సంబంధంగా తెలిపింది.
- source_word: הָרִמּוֹנִים
  choice: దానిమ్మపండు ఆకృతులు
  rationale: సందర్భంలో నిజమైన పండ్లు కాకుండా దానిమ్మపండ్ల రూపంలోని అలంకారాలను సూచిస్తుందని స్పష్టం చేస్తుంది.
- source_word: מָאתַיִם
  choice: రెండు వందల
  rationale: సంఖ్యను నేరుగా అనువదించింది.
- source_word: טֻרִים סָבִיב
  choice: దానిచుట్టూ వరుసలుగా
  rationale: వరుసల అమరికనూ, చుట్టుముట్టిన స్థానాన్నీ సహజమైన తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: עַל הַכֹּתֶרֶת הַשֵּׁנִית
  choice: రెండవ శీర్షభాగం మీద
  rationale: హీబ్రూలోని ‘రెండవది’ అనే రూపాన్ని నేరుగా నిలుపుతూ, సాధ్యమైన ‘మరో’ అనే భావాన్ని పాదటిప్పణిలో ఇచ్చింది.
