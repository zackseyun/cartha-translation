source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ חִיר֔וֹם אֶת הַ֨/כִּיֹּר֔וֹת וְ/אֶת הַ/יָּעִ֖ים וְ/אֶת הַ/מִּזְרָק֑וֹת וַ/יְכַ֣ל חִירָ֗ם לַֽ/עֲשׂוֹת֙ אֶת כָּל הַ/מְּלָאכָ֔ה אֲשֶׁ֥ר עָשָׂ֛ה לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/040.yaml
  text: And Hiram made the basins[a], the shovels, and the bowls. So Hiram finished doing all the work that he did for King Solomon for the house of Yahweh.
translation:
  language: te
  text: హీరాము కడుగుట తొట్టెలను, పారలను, గిన్నెలను[a] తయారుచేశాడు. ఈ విధంగా హీరాము యహ్వే మందిరం కోసం సొలొమోను రాజుకు చేసిన పనంతటినీ పూర్తి చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రోక్షణ పాత్రలు”; బలి ఆచారాల్లో రక్తం లేదా ఇతర ద్రవాలను పట్టుకోవడానికి లేదా చల్లడానికి ఉపయోగించే పాత్రలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּיֹּרוֹת
  choice: కడవలు
  rationale: ఈ పదం ఆలయ సేవలో కడగడానికి ఉపయోగించే పెద్ద పాత్రలను సూచిస్తుంది. ఆధునిక తెలుగులో ‘కడవలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: יָּעִים
  choice: పారలు
  rationale: బూడిద లేదా నిప్పుకణాలను తొలగించడానికి ఉపయోగించే పనిముట్లను ఈ పదం సూచిస్తుంది. మూలంలో లేని వివరణను ప్రధాన పాఠ్యంలో చేర్చకుండా ‘పారలు’ అని అనువదించబడింది.
- source_word: מִּזְרָקוֹת
  choice: గిన్నెలు
  rationale: బలి రక్తం లేదా ఇతర ద్రవాలను పట్టుకోవడానికి లేదా చల్లడానికి ఉపయోగించే పాత్రలను సూచించే విస్తృత పదం. ‘గిన్నెలు’ చదవడానికి సహజంగా ఉండగా, ఆచార సంబంధమైన ప్రత్యేక భావం పాదసూచికలో ఉంచబడింది.
- source_word: וַיְכַל
  choice: పూర్తి చేశాడు
  rationale: అప్పగించబడిన పని ముగిసిందనే భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: כָּל הַמְּלָאכָה
  choice: పనంతటినీ
  rationale: పని లేదా పనితనాన్ని సూచించే విస్తృత భావాన్ని అతిగా నిర్దిష్టం చేయకుండా సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: בֵּית יְהוָה
  choice: యహ్వే మందిరం
  rationale: అక్షరార్థంగా ‘యహ్వే ఇల్లు’; సందర్భంలో ఆలయమే ఉద్దేశించబడినందున ఆధునిక తెలుగులో సహజమైన ‘మందిరం’ వాడబడింది.
- source_word: חִירוֹם / חִירָם
  choice: హీరాము
  rationale: మూలపాఠంలోని ఒకే వ్యక్తి పేరుకు ఉన్న రెండు లేఖన రూపాలను తెలుగులో సంప్రదాయబద్ధమైన ఒకే రూపంతో సూచిస్తుంది.
- source_word: עָשָׂה ... לַמֶּלֶךְ שְׁלֹמֹה
  choice: సొలొమోను రాజుకు చేసిన
  rationale: లַמֶּלֶךְ అనే నిర్మాణంలోని ‘రాజుకు/రాజు నిమిత్తం’ భావాన్ని నిలుపుతూ, తెలుగులో అనవసరమైన క్రియాపునరుక్తిని తగ్గిస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో నాలుగు అక్షరాల దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించడం మూలానికి మరింత సమీపంగా ఉంటుంది.
- issue: בֵּית יְהוָה లో ‘ఇల్లు’ అనే రూపకం
  choice: యహ్వే మందిరం
  alternative: యహ్వే ఇల్లు
  rationale: ‘ఇల్లు’ అక్షరార్థమైనప్పటికీ, ఈ సందర్భంలో నిర్మించబడుతున్న ఆలయాన్ని సూచిస్తుంది. ‘మందిరం’ ఉద్దేశిత స్థలాన్ని సాధారణ పాఠకునికి సహజంగా తెలియజేస్తుంది; ప్రత్యేక సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి వాడబడింది. వస్తువుల జాబితా సంక్షిప్తతను, పనిని పూర్తి చేసినట్లు తెలిపే హీబ్రూ సారాంశ నిర్మాణాన్ని నిలుపుకుంది.
