id: 1KI.7.3
reference: 1 Kings 7:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/סָפֻ֣ן בָּ/אֶ֗רֶז מִ/מַּ֨עַל֙ עַל הַ/צְּלָעֹת֙ אֲשֶׁ֣ר עַל הָֽ/עַמּוּדִ֔ים אַרְבָּעִ֖ים וַ/חֲמִשָּׁ֑ה חֲמִשָּׁ֥ה עָשָׂ֖ר הַ/טּֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/003.yaml
  text: It was paneled with cedar above[a], over the side chambers that were on the pillars, forty-five in all, fifteen to a row.
translation:
  language: te
  text: పైభాగంలో, స్తంభాల మీద ఉన్న పక్క గదులపై దేవదారు చెక్కతో కప్పబడి ఉంది[a]. అవి మొత్తం నలభై ఐదు—ఒక్కొక్క వరుసలో పదిహేను చొప్పున ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పైభాగంలో, స్తంభాల మీద ఉన్న పక్క నిర్మాణాలపై దేవదారు చెక్కతో కప్పబడి ఉంది.” ఇక్కడి హెబ్రీ నిర్మాణ పదాలు స్పష్టంగా లేవు; ముఖ్యంగా צלעות అనే పదానికి “పక్కలు,” “ప్రక్క ఎముకలు,” “పక్క గదులు,” లేదా “పక్క నిర్మాణాలు” అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפֻן
  choice: కప్పబడి ఉంది
  rationale: ספן అనే నిష్క్రియ రూపం చెక్క వంటి పదార్థంతో పైపూతగా కప్పడాన్ని సూచిస్తుంది. నిర్మాణ స్వరూపం పూర్తిగా స్పష్టం కానందున మరింత నిర్దిష్టమైన ‘ఫలకాలతో అలంకరించబడింది’ కంటే ‘కప్పబడి ఉంది’ మూలంలోని విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: בָּאֶרֶז
  choice: దేవదారు చెక్కతో
  rationale: ב ఇక్కడ నిర్మాణ పదార్థాన్ని సూచిస్తుంది. ఆధునిక తెలుగు పాఠకునికి పదార్థం స్పష్టమయ్యేలా ‘చెక్కతో’ చేర్చబడింది.
- source_word: מִמַּעַל
  choice: పైభాగంలో
  rationale: నిర్మాణపు ఎగువ స్థానాన్ని తెలిపే అవ్యయ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: עַל הַצְּלָעֹת
  choice: పక్క గదులపై
  rationale: צלעות యొక్క ప్రాథమిక భావం ‘పక్కలు/ప్రక్క ఎముకలు’; నిర్మాణ సందర్భంలో ఇది పక్క గదులు లేదా పక్క నిర్మాణాలను సూచించవచ్చు. ప్రధాన పాఠ్యంలో సంభావ్యమైన ‘పక్క గదులు’ తీసుకొని, అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: אֲשֶׁר עַל הָעַמּוּדִים
  choice: స్తంభాల మీద ఉన్న
  rationale: సంబంధ వాక్యాన్ని దాని సమీప నామవాచకమైన పక్క గదులతో కలిపి, על యొక్క స్థాన సంబంధాన్ని అతిగా వివరించకుండా అనువదిస్తుంది.
- source_word: אַרְבָּעִים וַחֲמִשָּׁה
  choice: మొత్తం నలభై ఐదు
  rationale: ఈ సంఖ్య ముందున్న నిర్మాణ భాగాల మొత్తం సంఖ్యను ఇస్తున్నట్లు సందర్భం సూచిస్తుంది; ‘మొత్తం’ తెలుగులో ఆ సారాంశ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: חֲמִשָּׁה עָשָׂר הַטּוּר
  choice: ఒక్కొక్క వరుసలో పదిహేను చొప్పున
  rationale: טור అంటే వరుస లేదా శ్రేణి. మొత్తం నలభై ఐదును వరుసకు పదిహేను చొప్పున విభజించిన భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
