translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన నిర్మాణ వర్ణన. హెబ్రీ వాక్యంలోని నిర్మాణ సంబంధాల అనిశ్చితిని ప్రధాన పాఠ్యంలో అతిగా పరిష్కరించకుండా, పాదసూచికలో ప్రత్యామ్నాయాన్ని ఇచ్చాం.
