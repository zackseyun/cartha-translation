source:
  edition: WLC
  text: וּ֠/פִי/הוּ מִ/בֵּ֨ית לַ/כֹּתֶ֤רֶת וָ/מַ֨עְלָ/ה֙ בָּֽ/אַמָּ֔ה וּ/פִ֨י/הָ֙ עָגֹ֣ל מַעֲשֵׂה כֵ֔ן אַמָּ֖ה וַ/חֲצִ֣י הָֽ/אַמָּ֑ה וְ/גַם עַל פִּ֨י/הָ֙ מִקְלָע֔וֹת וּ/מִסְגְּרֹתֵי/הֶ֥ם מְרֻבָּע֖וֹת לֹ֥א עֲגֻלּֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/031.yaml
  text: Its opening projected upward from within the capital by a cubit[a], and its opening was round, like the work of a pedestal, a cubit and a half; and also on its opening were carvings, and their panels were square[c][b], not round.
translation:
  language: te
  text: దాని తెరువు[a] శిరోభాగం లోపలి నుండి ఒక మూర ఎత్తున పైకి లేచి ఉండేది. ఆ తెరువు పీఠం పనివలె[b] గుండ్రంగా ఉండి, ఒకటిన్నర మూర ఉండేది. ఆ తెరువు మీద చెక్కిన అలంకారాలు[c] కూడా ఉండేవి; వాటి పలకలు గుండ్రంగా కాక చతురస్రాకారంగా ఉండేవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దాని నోరు’; హీబ్రూలో నిర్మాణంలోని తెరువుకు రూపకంగా ‘నోరు’ అనే పదం వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: ‘పీఠం పనివలె’ అనే హీబ్రూ పదబంధం సాంకేతికంగా క్లిష్టమైనది; ‘పీఠపు పనితీరువలె,’ ‘ఆధార నిర్మాణపు పనివలె,’ లేదా ‘పీఠంలా చేసినది’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘చెక్కిన పని,’ ‘దండలు,’ లేదా ‘పుష్పహారాలు’; ఇక్కడి అలంకార పదం యొక్క ఖచ్చితమైన ఆకృతి అనిశ్చితం.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִיהוּ / פִיהָ
  choice: పై రంధ్రం
  rationale: నిర్మాణ వర్ణనలో ఈ పదం అక్షరార్థమైన ‘నోరు’ను కాక, పైభాగంలోని తెరుచుకున్న రంధ్రాన్ని సూచిస్తుంది. ‘పై రంధ్రం’ సాధారణ తెలుగు పాఠకునికి స్పష్టంగా ఉంటుంది; మూలంలోని నిర్మాణ రూపకాన్ని పాదసూచికలో నిలిపాం.
- source_word: מִבֵּית לַכֹּתֶרֶת
  choice: శిరోభాగం లోపలి నుంచి
  rationale: בַּיִת ఇక్కడ ‘లోపలి భాగం’ అనే స్థలార్థాన్ని ఇస్తుంది; כֹּתֶרֶת పైభాగంలోని శీర్ష నిర్మాణాన్ని సూచిస్తుంది. ‘శిరోభాగం’ అనేది సందర్భానికి తగిన, సహజమైన నిర్మాణ పదం.
- source_word: וָמַעְלָה בָּאַמָּה
  choice: ఒక మూర పైకి పొడుచుకొని ఉండేది
  rationale: హీబ్రూ వాక్యంలో క్రియాభావం అంతర్లీనంగా ఉంది. పైవైపు ఒక మూర మేర విస్తరించిందనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేయడానికి ఈ రూపాన్ని ఎంచుకున్నాం.
- source_word: עָגֹל
  choice: గుండ్రంగా
  rationale: ఆకారాన్ని నేరుగా, సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מַעֲשֵׂה כֵן
  choice: పీఠం పనివలె
  rationale: כֵּןను పీఠం లేదా ఆధార నిర్మాణంగా గ్రహించవచ్చు. సాంకేతికంగా క్లిష్టమైన మూల పదబంధాన్ని అతిగా నిర్దిష్టం చేయకుండా, దాని సంక్షిప్త పోలిక స్వరూపాన్ని నిలిపాం.
- source_word: אַמָּה וַחֲצִי הָאַמָּה
  choice: ఒకటిన్నర మూర
  rationale: మూలంలోని కొలతను సంప్రదాయ బైబిలు కొలమాన పదమైన ‘మూర’తో సంక్షిప్తంగా తెలిపాం.
- source_word: מִקְלָעוֹת
  choice: చెక్కిన అలంకారాలు
  rationale: ఈ పదం అలంకార చెక్కడపు పనిని సూచిస్తుంది; ఖచ్చితమైన ఆకృతి అనిశ్చితమైనందున దండలు లేదా పుష్పహారాలు అని నిర్దిష్టం చేయలేదు.
- source_word: מִסְגְּרֹתֵיהֶם
  choice: వాటి పలకలు
  rationale: ఆలయ సామగ్రి వర్ణనల్లో ఈ పదం చట్రంతో విభజించిన పలకలను లేదా ఫలకాలను సూచించగలదు. తరువాతి చతురస్ర–గుండ్రపు ఆకార వ్యత్యాసానికి ‘పలకలు’ సహజంగా సరిపోతుంది.
- source_word: מְרֻבָּעוֹת לֹא עֲגֻלּוֹת
  choice: గుండ్రంగా కాక చతురస్రాకారంగా
  rationale: మూలంలోని స్పష్టమైన నాలుగు వైపుల ఆకారం–గుండ్రపు ఆకారం వ్యత్యాసాన్ని నేరుగా నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనా గౌరవప్రదమైన నిర్మాణ వర్ణనను ఉపయోగించాం. సాంకేతిక పదబంధాల అనిశ్చితిని పాదసూచికల్లో నిలిపి, వాక్యాన్ని అనవసరంగా వివరణాత్మకం చేయలేదు. కొలమానానికి తెలుగు బైబిలు వాడుకలో పరిచితమైన ‘మూర’ను ఎంచుకున్నాం.
