  text: All the doorways and the doorposts had square frames[b][a], and window was opposite window three times.
translation:
  language: te
  text: అన్ని ద్వారపు తెరువులకూ ద్వారబంధాలకూ చతురస్రాకారపు చట్రాలు ఉన్నాయి[a]; కిటికీలు ఒకదానికొకటి ఎదురుగా, ఇలా మూడుసార్లు ఉన్నాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అన్ని ద్వారపు తెరువులకూ ద్వారబంధాలకూ చతురస్రాకారపు పైకమ్ములు ఉన్నాయి.” ఇక్కడి హెబ్రీ నిర్మాణ పదం ప్రత్యేకంగా చట్రపు పైభాగాన్ని లేదా పైకమ్మిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “కిటికికి ఎదురుగా కిటికి, మూడుసార్లు.” ఇది ఒకదానికొకటి ఎదురుగా అమర్చిన కిటికుల మూడు వరుసలను లేదా మూడు అంతస్తులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּתָחִים
  choice: ద్వారాలు
  rationale: ఈ నిర్మాణ సందర్భంలో కదిలే తలుపు పలకలకన్నా ప్రవేశ మార్గాలు లేదా ద్వారపు తెరువులను సూచిస్తుంది; సహజమైన తెలుగులో ‘ద్వారాలు’ అనువైనది.
- source_word: מְּזוּזוֹת
  choice: ద్వారబంధాలు
  rationale: ద్వారానికి ఇరువైపుల ఉండే నిలువు కమ్ములు లేదా జంబులను సూచిస్తుంది; ‘ద్వారబంధాలు’ నిర్మాణార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: רְבֻעִים
  choice: చతురస్రాకారపు
  rationale: నాలుగు మూలలు గల ఆకారాన్ని సూచించే విశేషణం; ఇక్కడ చట్రాల ఆకారాన్ని వివరిస్తుంది.
- source_word: שָׁקֶף
  choice: చట్రాలు
  rationale: ఈ అరుదైన నిర్మాణ పదం పైకమ్మి లేదా ద్వారపు చట్రాన్ని సూచించవచ్చు. ‘చట్రాలు’ అని అనువదించడం ద్వారా అర్థాన్ని అనవసరంగా పైకమ్మికే పరిమితం చేయకుండా ఉంచాం.
- source_word: מוּל ... אֶל
  choice: ఎదురుగా
  rationale: ఒక నిర్మాణ భాగం మరొకదానికి అభిముఖంగా లేదా సరిపోలే స్థానంలో ఉండటాన్ని సూచిస్తుంది.
- source_word: מֶחֱזָה
  choice: కిటికి
  rationale: భవన నిర్మాణ వర్ణనలో ఇది చూడటానికి ఏర్పాటు చేసిన తెరువు, అంటే కిటికిని సూచించే అవకాశమే ఎక్కువ.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: ఇలా మూడుసార్లు
  rationale: హెబ్రీ పదబంధానికి అక్షరార్థం ‘మూడుసార్లు’. మూడు వరుసలు లేదా అంతస్తులు ఉద్దేశించబడి ఉండవచ్చు గాని, మూలంలోని అస్పష్టతను ప్రధాన పాఠంలో నిలిపి ఉంచాం.
