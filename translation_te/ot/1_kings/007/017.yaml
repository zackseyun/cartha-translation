id: 1KI.7.17
reference: 1 Kings 7:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שְׂבָכִ֞ים מַעֲשֵׂ֣ה שְׂבָכָ֗ה גְּדִלִים֙ מַעֲשֵׂ֣ה שַׁרְשְׁר֔וֹת לַ/כֹּ֣תָרֹ֔ת אֲשֶׁ֖ר עַל רֹ֣אשׁ הָ/עַמּוּדִ֑ים שִׁבְעָה֙ לַ/כֹּתֶ֣רֶת הָ/אֶחָ֔ת וְ/שִׁבְעָ֖ה לַ/כֹּתֶ֥רֶת הַ/שֵּׁנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/017.yaml
  text: 'There were lattices of latticework and twisted cords of chainwork for the capitals that were on the tops of the pillars: seven for the one capital[a], and seven for the second capital.'
translation:
  language: te
  text: స్తంభాల పైభాగాల మీదున్న శీర్షాల కోసం జాలకపు పనితో చేసిన జాలాలు, గొలుసు పనితో చేసిన పేనిన పోగులు ఉండేవి—ఒక శీర్షానికి ఏడు[a], రెండవ శీర్షానికి ఏడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వల అల్లికతో చేసిన జాలాలు, గొలుసు అల్లికతో చేసిన పేనిన తంతువులు.” స్తంభశీర్షాల అలంకార లోహపనిని వర్ణించడానికి హీబ్రూ మూలం జతజతగా ఉన్న శిల్పపదాలను ఉపయోగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂבָכִים מַעֲשֵׂה שְׂבָכָה
  choice: జాలకపు పనితో చేసిన జాలాలు
  rationale: మూలంలోని ఒకే ధాతువుకు చెందిన నామవాచకం, పనితనాన్ని సూచించే పదబంధం రెండింటినీ నిలుపుతూ, స్తంభశీర్షాల మీదున్న వలలాంటి లోహ అలంకారాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: גְּדִלִים
  choice: పేనిన పోగులు
  rationale: ఈ పదం మెలిపెట్టిన లేదా అల్లిన అలంకార భాగాలను సూచించగలదు. ‘పేనిన పోగులు’ వాటి నిర్మాణాన్ని తెలియజేస్తూ, ‘పుష్పమాలలు’ వంటి నిర్దిష్ట రూపాన్ని అనవసరంగా నిర్ణయించదు.
- source_word: מַעֲשֵׂה שַׁרְשְׁרוֹת
  choice: గొలుసు పనితో చేసిన
  rationale: అలంకార పోగులు గొలుసుల రూపంలో రూపొందించబడ్డాయని తెలిపే శిల్పపదబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: כֹּתָרֹת
  choice: శీర్షాలు
  rationale: ఈ నిర్మాణ సందర్భంలో స్తంభాల అలంకార పైభాగాలను సూచిస్తుంది. ‘శీర్షాలు’ గౌరవప్రదమైన, అర్థమయ్యే వాస్తుశిల్ప పదం; వెంటనే వచ్చే ‘స్తంభాల పైభాగాలు’ సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: אֲשֶׁר עַל רֹאשׁ הָעַמּוּדִים
  choice: స్తంభాల పైభాగాల మీద ఉన్న
  rationale: రֹאשׁ యొక్క అక్షరార్థమైన ‘తల’కు బదులు వాస్తు సందర్భానికి సహజమైన ‘పైభాగం’ వాడి, స్థల సంబంధాన్ని యథాతథంగా ఉంచింది.
- source_word: שִׁבְעָה לַכֹּתֶרֶת הָאֶחָת וְשִׁבְעָה לַכֹּתֶרֶת הַשֵּׁנִית
  choice: ఒక శీర్షానికి ఏడు, రెండవ శీర్షానికి ఏడు
  rationale: ప్రతి శీర్షానికి ఏడు చొప్పున ఉన్నాయని మూలం విడివిడిగా చెప్పే పంపిణీ భావాన్ని దగ్గరగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా వాస్తుశిల్ప భావాన్ని స్పష్టంగా ఉంచుతూ గౌరవప్రదమైన శైలిని అనుసరించాం. మూలంలోని పునరుక్త శిల్పపద నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపాం.
