    issue: Redundant architectural phrasing
    rationale: “స్తంభాల పైభాగాల మీద ఉన్న శీర్షాలు” repeats the idea of an upper part. Removing “ఉన్న” and joining the phrase improves modern Telugu idiom without altering the source meaning.
  revised_text: స్తంభాల పైభాగాల మీదున్న శీర్షాల కోసం జాలకపు పనితో చేసిన జాలాలు, గొలుసు పనితో చేసిన పేనిన పోగులు ఉండేవి—ఒక శీర్షానికి ఏడు[a], రెండవ శీర్షానికి ఏడు.
