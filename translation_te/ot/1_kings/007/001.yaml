  edition: WLC
  text: וְ/אֶת בֵּית/וֹ֙ בָּנָ֣ה שְׁלֹמֹ֔ה שְׁלֹ֥שׁ עֶשְׂרֵ֖ה שָׁנָ֑ה וַ/יְכַ֖ל אֶת כָּל בֵּיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/001.yaml
  text: Solomon built his own house for thirteen years[a], and he finished all his house.
translation:
  language: te
  text: సొలొమోను తన సొంత భవనాన్ని[a] పదమూడు సంవత్సరాలు నిర్మించి, దానినంతటినీ పూర్తి చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన సొంత రాజభవనాన్ని.’ ఇక్కడ హీబ్రూ ‘ఇల్లు’ అనే పదం రాజనివాసాన్ని లేదా రాజభవన సముదాయాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: తన సొంత భవనాన్ని
  rationale: בַּיִת ప్రాథమికంగా ‘ఇల్లు’ అని అర్థమైనా, రాజసంబంధ సందర్భంలో రాజనివాసం లేదా రాజభవన సముదాయాన్ని సూచించగలదు. తెలుగులో ‘భవనం’ ఈ సందర్భాన్ని సహజంగా తెలియజేస్తుంది; ‘సొంత’ ముందున్న ఆలయ నిర్మాణంతో ఉన్న వ్యత్యాసాన్ని ప్రతిబింబిస్తుంది.
- source_word: בָּנָה
  choice: నిర్మించి
  rationale: Qal perfect ఇక్కడ గతకాల నిర్మాణ కార్యాన్ని సూచిస్తుంది. తరువాతి వַיְכַל‌తో సహజంగా అనుసంధానించేందుకు తెలుగులో అసమాపక క్రియారూపం వాడబడింది.
- source_word: שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: పదమూడు సంవత్సరాలు
  rationale: ఈ పదబంధం నిర్మాణానికి పట్టిన కాలవ్యవధిని సూచిస్తుంది; తెలుగులో విభక్తి లేకుండానే ఈ వ్యవధి సహజంగా వ్యక్తమవుతుంది.
- source_word: וַיְכַל
  choice: పూర్తి చేశాడు
  rationale: כלה నుండి వచ్చిన ఈ రూపం నిర్మాణ కార్యాన్ని ముగింపుకు తీసుకువచ్చాడనే కథన భావాన్ని ఇస్తుంది.
- source_word: כָּל בֵּיתוֹ
  choice: దానినంతటినీ
  rationale: כָּל సంపూర్ణతను సూచిస్తుంది. పునరుక్తిని తగ్గిస్తూ, ముందున్న భవనం మొత్తాన్ని పూర్తి చేశాడనే భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וְאֶת
  choice: తన సొంత
  rationale: సంయోజక అవ్యయం మరియు కర్మసూచకం కొత్త, సంబంధిత అంశాన్ని ముందున్న ఆలయ నిర్మాణానికి వ్యత్యాసంగా ప్రవేశపెడతాయి; తెలుగులో ఆ సంభాషణాత్మక బలం ‘తన సొంత’ ద్వారా వ్యక్తమవుతుంది.
