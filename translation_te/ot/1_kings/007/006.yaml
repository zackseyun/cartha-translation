  text: וְ/אֵ֨ת אוּלָ֤ם הָֽ/עַמּוּדִים֙ עָשָׂ֔ה חֲמִשִּׁ֤ים אַמָּה֙ אָרְכּ֔/וֹ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה רָחְבּ֑/וֹ וְ/אוּלָם֙ עַל פְּנֵי/הֶ֔ם וְ/עַמֻּדִ֥ים וְ/עָ֖ב עַל פְּנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/006.yaml
  text: He made the Hall of Pillars fifty cubits long and thirty cubits wide[a], with a porch in front of them[b], and pillars and a threshold in front of them.
translation:
  language: te
  text: అతడు స్తంభాల మండపాన్ని[a] నిర్మించాడు. దాని పొడవు యాభై మూరలు, వెడల్పు ముప్పై మూరలు. వాటి ముందర ఒక ముందరి మండపాన్ని, వాటి ముందర స్తంభాలనూ ఒక అడ్డదూలాన్నీ చేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మండపం’ అని అనువదించిన אוּלָם అనే హెబ్రీ పదమే ఈ వాక్యంలో రెండుసార్లు ఉంది. రెండోసారి అది స్తంభాల మండపం ముందున్న ముందరి మండపం లేదా ప్రవేశ వసారాను సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘అడ్డదూలం’ అని అనువదించిన עָב అనే హెబ్రీ పదం ఈ వాస్తు సందర్భంలో అనిశ్చితమైనది. ‘గడప,’ ‘పైకప్పులాంటి ఆవరణ,’ లేదా మరొక మందమైన నిర్మాణ భాగం అనే అర్థాలు కూడా సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם הָעַמּוּדִים
  choice: స్తంభాల మండపం
  rationale: ప్రధాన నిర్మాణం స్తంభాలతో ప్రత్యేకంగా గుర్తించబడిన విశాలమైన మండపమని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עָשָׂה
  choice: నిర్మించాడు
  rationale: మూల క్రియ సాధారణంగా ‘చేశాడు’ అని అర్థమైనా, భవన నిర్మాణ సందర్భంలో ‘నిర్మించాడు’ సహజంగా ఉండి భావాన్ని మార్చదు.
- source_word: חֲמִשִּׁים אַמָּה אָרְכּוֹ וּשְׁלֹשִׁים אַמָּה רָחְבּוֹ
  choice: దాని పొడవు యాభై మూరలు, వెడల్పు ముప్పై మూరలు
  rationale: హెబ్రీ కొలత వాక్యనిర్మాణాన్ని ఖచ్చితమైన సంఖ్యలతో సహజ తెలుగులో అందిస్తుంది.
- source_word: וְאוּלָם עַל־פְּנֵיהֶם
  choice: వాటి ఎదుట ఒక ముంగిలి మండపం
  rationale: మూలంలో ముందున్న ప్రధాన మండపానికి వాడిన אוּלָם పదమే మళ్లీ వచ్చినా, ఇక్కడ అది ముందుభాగంలోని ప్రవేశ నిర్మాణాన్ని సూచిస్తున్నట్లు సందర్భం తెలియజేస్తుంది; ‘ముంగిలి మండపం’ ఆ సంబంధాన్ని స్పష్టంగా చెబుతుంది.
- source_word: וְעַמֻּדִים
  choice: స్తంభాలు
  rationale: మూలంలోని సంక్షిప్త సమన్వయ నిర్మాణాన్ని తొలగించకుండా నామవాచకాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וְעָב
  choice: ఒక అడ్డదూలం
  rationale: ఈ వాస్తు సందర్భంలో అరుదైన עָב పదం అర్థం అనిశ్చితం. ‘అడ్డదూలం’ సాధ్యమైన నిర్మాణ భాగాన్ని సూచిస్తుంది; అనిశ్చితిని పాదసూచికలో వెల్లడించాం.
- source_word: עַל־פְּנֵיהֶם
  choice: వాటి ఎదుట
  rationale: బహువచన సర్వనామంలోని సూచన కొంత అస్పష్టంగా ఉన్నందున దాన్ని ఏకవచనంగా మార్చకుండా స్థల సంబంధాన్ని నిలుపుతుంది.
