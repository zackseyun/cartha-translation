translation:
  language: te
  text: ఆ ఒక్క పీఠం నాలుగు మూలల వద్ద నాలుగు ఆధారాలు ఉండేవి; ఆ ఆధారాలు పీఠంలోనే భాగంగా ఉండేవి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְתֵפוֹת / כְתֵפֶיהָ
  choice: ఆధారాలు
  rationale: ఈ నిర్మాణ సందర్భంలో అక్షరార్థంగా ‘భుజాలు’ అని కాకుండా, మట్టం మూలల వద్ద అమర్చిన బరువు మోసే నిర్మాణ భాగాలను సహజ తెలుగులో సూచిస్తుంది.
- source_word: הַמְּכוֹנָה
  choice: మట్టం
  rationale: పాత్రను మోసే చక్రాలుగల లోహపు ఆధార నిర్మాణాన్ని సూచించే పదంగా, సందర్భానికి తగిన సంక్షిప్త నిర్మాణపదం.
- source_word: הָאֶחָת
  choice: ఆ ఒక్క
  rationale: హీబ్రూ పాఠంలోని నిర్దిష్ట ఏకవచనాన్ని నిలుపుతుంది; దాన్ని ‘ప్రతి’గా మార్చి పాఠాన్ని సాధారణీకరించదు.
- source_word: מִן הַמְּכוֹנָה
  choice: మట్టంలోనే భాగంగా
  rationale: ఆ ఆధారాలు విడిగా జోడించినవి కాక, మట్టం నుంచే ఏర్పడిన సమగ్ర భాగాలని సందర్భానుసారంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, దేవాలయ సామగ్రి నిర్మాణ వివరణకు తగిన సరళమైన గంభీర శైలి. హీబ్రూ పాఠంలోని ‘ఆ ఒక్క మట్టం’ అనే అసాధారణ నిర్దిష్ట ఏకవచనాన్ని సరిచేసి ‘ప్రతి మట్టం’గా మార్చకుండా కాపాడాం.
