  yaml_path: translation/ot/1_kings/007/022.yaml
  text: And on the top of the pillars was lily-work[b][a], and the work of the pillars was finished.
translation:
  language: te
  text: స్తంభాల పైభాగంలో కలువపువ్వు ఆకారపు అలంకరణ[a] ఉండేది. అలా స్తంభాల పని పూర్తయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “కలువపువ్వు పని”; లేదా “కలువపువ్వు నమూనా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: పైభాగం
  rationale: స్తంభాల నిర్మాణ సందర్భంలో పై అంచు లేదా పై భాగాన్ని సూచిస్తుంది; సాంకేతిక పదమైన ‘శీర్షభాగం’ అని అతిగా నిర్దిష్టం చేయకుండా సహజంగా అనువదించబడింది.
- source_word: הָעַמּוּדִים
  choice: స్తంభాలు
  rationale: ఆలయ నిర్మాణ సందర్భంలో עַמּוּדִיםకు సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: מַעֲשֵׂה שׁוֹשָׁן
  choice: కలువపువ్వు ఆకారపు అలంకరణ
  rationale: పదబంధం అక్షరార్థంగా ‘కలువపువ్వు పని’; ఇక్కడ స్తంభాల పైభాగంలోని పుష్పాకార శిల్ప అలంకరణను సూచిస్తున్నందున అర్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַתִּתֹּם
  choice: పూర్తయింది
  rationale: תמם క్రియ పని ముగింపుకు లేదా సంపూర్ణతకు వచ్చిందని తెలియజేస్తుంది.
- source_word: מְלֶאכֶת הָעַמּוּדִים
  choice: స్తంభాల పని
  rationale: నిర్మాణం, శిల్పపని రెండింటినీ కలుపుకోగల హీబ్రూ పదబంధపు విస్తృతతను నిలుపుతుంది.
