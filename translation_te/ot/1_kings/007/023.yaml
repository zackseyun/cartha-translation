base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/023.yaml
  text: Then he made the cast sea[a], ten cubits from brim to brim, round all around; its height was five cubits[c][b], and a line of thirty cubits went around it all around.
translation:
  language: te
  text: తరువాత అతడు పోతపోసిన సముద్రాన్ని[a] చేశాడు. అది ఒక అంచు నుండి మరొక అంచు వరకు పది మూరలు; చుట్టూ గుండ్రంగా ఉంది. దాని ఎత్తు ఐదు మూరలు; ముప్పై మూరల కొలత తాడు[c][b] దాని చుట్టూ తిరిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పెద్ద తొట్టి.’ ఈ పెద్ద ఆలయ పాత్రను హీబ్రూ పాఠ్యం ప్రత్యేక నామంగా ‘సముద్రం’ అని పిలుస్తుంది; ఆ పేరునే ప్రధాన పాఠ్యంలో ఉంచాం.
    reason: lexical_alternative
  - marker: b
    text: 'హీబ్రూ: ‘ముప్పై మూరల తాడు’; అంటే దాని చుట్టుకొలత ముప్పై మూరలు.'
    reason: cultural_note
  - marker: c
    text: ఇక్కడ లిఖిత రూపం קוה; సంప్రదాయ పఠనం దాన్ని కొలత తాడు అనే భావంలో చదువుతుంది. 2 దినవృత్తాంతాలు 4:2తో పోల్చండి.
    reason: textual_variant
lexical_decisions:
- source_word: הַיָּם
  choice: సముద్రం
  rationale: ఇది ఆలయంలోని పెద్ద నీటి తొట్టికి హీబ్రూ వచనం ఇచ్చిన ప్రత్యేక నామం. దాని రూపక నామాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, అర్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: מוּצָק
  choice: పోతపోసిన
  rationale: లోహాన్ని కరిగించి అచ్చులో పోసి తయారుచేసిన వస్తువును సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: עֶשֶׂר בָּאַמָּה מִשְּׂפָתוֹ עַד שְׂפָתוֹ
  choice: ఒక అంచు నుండి మరొక అంచు వరకు పది మూరలు
  rationale: పాత్ర ముఖభాగం మీదుగా ఉన్న వ్యాసాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: שָׂפָה
  choice: అంచు
  rationale: పెద్ద పాత్ర యొక్క పై అంచును సూచించడానికి సాధారణంగా అర్థమయ్యే పదం.
- source_word: עָגֹל סָבִיב
  choice: చుట్టూ గుండ్రంగా
  rationale: వస్తువు అన్ని వైపులా వృత్తాకారంగా ఉందనే హీబ్రూ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: קוֹמָתוֹ
  choice: దాని ఎత్తు
  rationale: నిర్మాణ కొలతల సందర్భంలో నేరుగా, సహజంగా ఉన్న అనువాదం.
- source_word: וקוה
  choice: కొలత తాడు
  rationale: లిఖిత రూపంలోని ‘రేఖ/తాడు’ భావాన్ని సందర్భానుసారంగా కొలిచే తాడుగా వ్యక్తం చేస్తుంది; పాఠ్య సమస్యను పాదసూచికలో సూచించాం.
- source_word: יָסֹב אֹתוֹ סָבִיב
  choice: దాని చుట్టూ చుట్టింది
  rationale: చుట్టుకొలతను తెలిపే తాడు పాత్రను పూర్తిగా చుట్టిందనే భావాన్ని, మూలంలోని పునరుక్తి ఛాయతో వ్యక్తం చేస్తుంది.
- source_word: אַמָּה
  choice: మూర
  rationale: ప్రాచీన మోచేతి-ఆధారిత కొలమానానికి తెలుగులో సంప్రదాయంగా వాడే పదం; ఆధునిక ప్రమాణానికి అనిశ్చిత మార్పిడిని ప్రధాన పాఠ్యంలో రుద్దదు.
