translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన నిర్మాణ వర్ణన. ‘సముద్రం’ అనే మూలపాఠ్య ప్రత్యేక నామాన్ని నిలిపి, దాని కార్యార్థాన్ని పాదసూచికలో స్పష్టం చేశాం. కొలమానానికి ‘మూర’ను వాడాం; వాక్య నిర్మాణాన్ని తెలుగు పఠనసౌలభ్యానికి రెండు వాక్యాలుగా విభజించాం.
