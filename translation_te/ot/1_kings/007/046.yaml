translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘పోత పోయించాడు’ లోహశిల్ప సందర్భాన్ని సామాన్య పాఠకునికి స్పష్టంగా చేస్తుంది. మూలంలోని అరుదైన భూవివరణకు ఉన్న అనిశ్చితిని [c] పాదసూచికలో నిలిపాం.
