source:
  edition: WLC
  text: בְּ/כִכַּ֤ר הַ/יַּרְדֵּן֙ יְצָקָ֣/ם הַ/מֶּ֔לֶךְ בְּ/מַעֲבֵ֖ה הָ/אֲדָמָ֑ה בֵּ֥ין סֻכּ֖וֹת וּ/בֵ֥ין צָרְתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/046.yaml
  text: In the plain of the Jordan the king cast them[c][b][a], in the clay ground between Sukkoth and Zarethan.
translation:
  language: te
  text: యొర్దాను మైదానంలో[a] రాజు వాటిని పోత పోశాడు[b], సుక్కోతు మరియు సారెతాను మధ్యనున్న దట్టమైన మట్టినేలలో[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యొర్దాను లోయలో.’ హీబ్రూ పదబంధం అక్షరార్థంగా యొర్దాను ప్రాంతాన్ని లేదా మైదానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వాటిని పోశాడు.’ ఈ క్రియ లోహ వస్తువులను పోత పోయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘నేల మందంలో’; పోత అచ్చులు చేయడానికి అనువైన దట్టమైన మట్టినేల అని భావం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכִכַּר הַיַּרְדֵּן
  choice: యొర్దాను మైదానంలో
  rationale: భౌగోళిక సందర్భంలో כִּכָּר యొర్దాను ప్రాంతంలోని మైదానాన్ని సూచిస్తుంది. ‘మైదానం’ మూలంలోని భౌగోళిక భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: יְצָקָם
  choice: వాటిని పోత పోయించాడు
  rationale: יצק లోహాన్ని పోసి వస్తువులను తయారుచేయడాన్ని సూచిస్తుంది. రాజే స్వయంగా పని చేశాడని కాక, తన ఆధ్వర్యంలో చేయించాడనే సహజ రాజసంబంధ వాడుకను తెలుగులో ‘పోయించాడు’ తెలియజేస్తుంది; కర్మప్రత్యయం సందర్భంలోని వస్తువులను సూచిస్తుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: హీబ్రూలో వ్యక్తిపేరు కాక నిర్దిష్ట సామాన్య నామవాచకం ఉంది; అందువల్ల ‘సొలొమోను రాజు’ అని విస్తరించకుండా ‘రాజు’ అని ఉంచబడింది.
- source_word: בְּמַעֲבֵה הָאֲדָמָה
  choice: చిక్కని మట్టినేలలో
  rationale: מַעֲבֶה మందం లేదా సాంద్రతను సూచిస్తుంది. ఈ లోహపోత సందర్భంలో అచ్చులకు అనువైన దట్టమైన మట్టినేల భావాన్ని ‘చిక్కని మట్టినేల’ సహజంగా తెలియజేస్తుంది; అయినా పదబంధం అరుదైనది కాబట్టి అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: בֵּין סֻכּוֹת וּבֵין צָרְתָן
  choice: సుక్కోతుకు సారెతానుకు మధ్య
  rationale: స్థలనామాలను హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం; పునరుక్త בֵּין నిర్మాణాన్ని తెలుగులో సహజమైన ‘...కు ...కు మధ్య’గా ఇచ్చాం.
