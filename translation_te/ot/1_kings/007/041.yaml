  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆలయ నిర్మాణ సామగ్రి జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలి. హీబ్రూలోని సంఖ్యల పునరుక్తిని కాపాడుతూ, చివరి సంబంధ వాక్యంలోని భావాన్ని తెలుగులో అనవసర భారంలేకుండా వ్యక్తం చేసింది.
