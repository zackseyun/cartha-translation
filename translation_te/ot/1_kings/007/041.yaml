base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/041.yaml
  text: the two pillars[a], and the two bowls of the capitals that were on the tops of the pillars, and the two latticeworks to cover the two bowls of the capitals that were on the tops of the pillars[c][b];
translation:
  language: te
  text: రెండు స్తంభాలు; స్తంభాల పైభాగాన ఉన్న శిరోభాగాల రెండు గిన్నెలవంటి భాగాలు[a]; స్తంభాల పైభాగాన ఉన్న శిరోభాగాల ఆ రెండు గిన్నెలవంటి భాగాలను కప్పడానికి రెండు జాలికలు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గోళాకార భాగాలు,” “గుండ్రని ఆకృతులు.” హీబ్రూ పదం శిరోభాగాల గుండ్రని భాగాలను సూచిస్తుంది; వాటి ఖచ్చితమైన వాస్తు ఆకృతి అనిశ్చితం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “వలలాంటి అల్లికలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדִים
  choice: స్తంభాలు
  rationale: ఆలయ ప్రాంగణంలోని రెండు పెద్ద స్వతంత్ర నిర్మాణాలను సూచించే సహజమైన, ప్రామాణిక వాస్తుశిల్ప పదం.
- source_word: גֻלֹּת
  choice: గిన్నె ఆకారపు భాగాలు
  rationale: పైతలాలకు సంబంధించిన గుండ్రని లేదా గిన్నెలాంటి ఆకృతులను సూచిస్తుంది; ఖచ్చితమైన నిర్మాణ ఆకృతి అనిశ్చితమైనందున రూపాన్ని అతిగా నిర్ధారించకుండా వివరిస్తుంది.
- source_word: כֹּתָרֹת
  choice: పైతలాలు
  rationale: స్తంభం పైభాగంలోని అలంకార నిర్మాణాన్ని సూచించే అర్థస్పష్టమైన ఆధునిక తెలుగు వాస్తు పదం.
- source_word: רֹאשׁ
  choice: పైభాగం
  rationale: మూలంలోని ‘తల’ అనే భావాన్ని వాస్తుశిల్ప సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: שְּׂבָכוֹת
  choice: జాలకపు అల్లికలు
  rationale: వలవంటి, పరస్పరం అల్లుకున్న అలంకార నిర్మాణాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְכַסּוֹת
  choice: కప్పే
  rationale: హీబ్రూ ఉద్దేశార్థక క్రియను జాబితా వాక్యంలో సహజమైన విశేషణ రూపంలో అందిస్తుంది.
- source_word: שְׁנַיִם / שְׁתָּיִם / שְׁתֵּי
  choice: రెండు
  rationale: జాబితాను నిర్మించే పునరుక్త సంఖ్యను ప్రతి అంశంలో నిలుపుతుంది.
- source_word: אֲשֶׁר עַל רֹאשׁ הָעַמּוּדִים
  choice: స్తంభాల పైభాగాన ఉన్న
  rationale: స్థానాన్ని తెలిపే సంబంధ వాక్యభాగాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
