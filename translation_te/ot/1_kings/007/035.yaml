translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ వర్ణనకు తగిన గౌరవప్రదమైన సరళ శైలి వాడబడింది. మూలంలోని అస్పష్ట నిర్మాణ పదాలకు ప్రధాన పాఠంలో సందర్భోచిత పదాలు ఇచ్చి, నిజమైన ప్రత్యామ్నాయ అర్థాలను పాదసూచికల్లో నిలిపాం.
