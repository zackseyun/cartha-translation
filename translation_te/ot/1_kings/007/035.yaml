id: 1KI.7.35
reference: 1 Kings 7:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְ/רֹ֣אשׁ הַ/מְּכוֹנָ֗ה חֲצִ֧י הָ/אַמָּ֛ה קוֹמָ֖ה עָגֹ֣ל סָבִ֑יב וְ/עַ֨ל רֹ֤אשׁ הַ/מְּכֹנָה֙ יְדֹתֶ֔י/הָ וּ/מִסְגְּרֹתֶ֖י/הָ מִמֶּֽ/נָּה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/035.yaml
  text: And on the top of the stand there was a round rim all around[a], half a cubit high[b]; and on the top of the stand its supports and its panels were of one piece with it.
translation:
  language: te
  text: ఆ పీఠం పైభాగంలో చుట్టూ గుండ్రంగా, అర మూర ఎత్తుగల అంచు ఉండేది. పీఠం పైభాగంలోని దాని ఆధారాలు[a], దాని పలకలు[b] దానితోనే ఒకే ముక్కగా ఉండేవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని పట్టీలు.” హెబ్రీ పదానికి అక్షరార్థం “దాని చేతులు”; ఇది పీఠం నుండి పొడుచుకొచ్చిన నిర్మాణ భాగాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దాని చట్రాలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֹאשׁ הַמְּכוֹנָה
  choice: ఆ పీఠం పైభాగంలో
  rationale: רֹאשׁ ఇక్కడ నిర్మాణంలోని ‘పైభాగం’ను సూచిస్తుంది; מְכוֹנָה ఈ సందర్భంలో కంచు పీఠం లేదా ఆధార నిర్మాణం. ఆధునిక తెలుగులో ‘పీఠం పైభాగంలో’ సహజంగా ఉంది.
- source_word: חֲצִי הָאַמָּה קוֹמָה
  choice: అర మూర ఎత్తుగల
  rationale: קוֹמָה ఎత్తును సూచిస్తుంది. אַמָּה అనే ప్రాచీన కొలతకు తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘మూర’ను ఉపయోగించాం.
- source_word: עָגֹל סָבִיב
  choice: చుట్టూ గుండ్రంగా ... అంచు
  rationale: עָגֹל ‘గుండ్రంగా’, סָבִיב ‘చుట్టూ’ అని సూచిస్తాయి. హెబ్రీలో నిర్మాణ భాగానికి స్పష్టమైన నామవాచకం లేకపోవడంతో, సందర్భానుగుణంగా ‘అంచు’ను చేర్చాం.
- source_word: יְדֹתֶיהָ
  choice: దాని ఆధారాలు
  rationale: యథార్థంగా ‘దాని చేతులు’; వస్తు నిర్మాణ వర్ణనలో పొడుచుకొచ్చే ఆధార భాగాలు లేదా పట్టీలు కావచ్చు. ప్రధాన పాఠంలో నిర్మాణ సందర్భానికి సరిపోయే ‘ఆధారాలు’ను ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וּמִסְגְּרֹתֶיהָ
  choice: దాని పలకలు
  rationale: ఈ పదం చట్రాలు, అంచులు లేదా చట్రంలో అమర్చిన పలకలను సూచించవచ్చు. చదవడానికి స్పష్టమైన ‘పలకలు’ను ప్రధాన పాఠంలో ఉంచి, ‘చట్రాలు’ను పాదసూచికలో నిలిపాం.
- source_word: מִמֶּנָּה
  choice: దానితోనే ఒకే ముక్కగా
  rationale: అక్షరార్థంగా ‘దాని నుండే’. ఈ నిర్మాణ సందర్భంలో అవి విడిగా జోడించినవి కాక పీఠంతో సమగ్రంగా చేసినవని సూచించే సహజ తెలుగు వ్యక్తీకరణ ఇది.
