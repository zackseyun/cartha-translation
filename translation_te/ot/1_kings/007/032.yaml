  edition: WLC
  text: וְ/אַרְבַּ֣עַת הָ/אֽוֹפַנִּ֗ים לְ/מִ/תַּ֨חַת֙ לַֽ/מִּסְגְּר֔וֹת וִ/יד֥וֹת הָ/אֽוֹפַנִּ֖ים בַּ/מְּכוֹנָ֑ה וְ/קוֹמַת֙ הָ/אוֹפַ֣ן הָ/אֶחָ֔ד אַמָּ֖ה וַ/חֲצִ֥י הָ/אַמָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/032.yaml
  text: And the four wheels were underneath the panels[a], and the axles of the wheels were on the stand[b]; and the height of each wheel was a cubit and a half.
translation:
  language: te
  text: ఆ నాలుగు చక్రాలు పలకల[a] కింద ఉన్నాయి. చక్రాల ఇరుసులు[b] ఆ ఆధారంలో ఉన్నాయి. ఒక్కో చక్రం ఎత్తు ఒకటిన్నర మూర.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చట్రాలు” లేదా “అంచులు.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో పదశః “చక్రాల చేతులు”; సందర్భంలో ఇవి చక్రాల ఇరుసులను లేదా వాటిని మోసే కడ్డీలను సూచించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹפַנִּים / הָאוֹפַן
  choice: చక్రాలు / చక్రం
  rationale: ఈ కంచు ఆధార నిర్మాణ వర్ణనలో אוֹפַן నిజమైన చక్రాన్నే సూచిస్తుంది; ఆధునిక తెలుగులో ‘చక్రం’ సహజమైన సమానార్థకం.
- source_word: לְמִתַּחַת
  choice: కింద
  rationale: ఈ సంయుక్త విభక్తి రూపం పలకలకు దిగువన ఉన్న స్థానాన్ని సూచిస్తుంది; ‘కింద’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: הַמִּסְגְּרוֹת
  choice: పలకలు
  rationale: ఈ శిల్పనిర్మాణ సందర్భంలో מִסְגְּרוֹת చట్రబద్ధమైన పార్శ్వ భాగాలను లేదా పలక విభాగాలను సూచించవచ్చు. ప్రధాన పాఠంలో ‘పలకలు’ చదవడానికి సహజం; ‘చట్రాలు’ అనే సాధ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: וִידוֹת
  choice: ఇరుసులు
  rationale: పదశః ‘చేతులు’ అయినప్పటికీ, యాంత్రిక సందర్భంలో చక్రాలను నిర్మాణానికి కలిపే లేదా మోసే పొడవైన భాగాలను సూచిస్తుంది. ‘ఇరుసులు’ వాటి సంభావ్య కార్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַּמְּכוֹנָה
  choice: ఆధారానికి అమర్చబడి
  rationale: מְכוֹנָה ఇక్కడ చక్రాలున్న కంచు ఆధారాన్ని సూచిస్తుంది. ב־ సంబంధాన్ని కేవలం ‘లో/మీద’గా కాక, ఈ నిర్మాణ సందర్భంలో అనుసంధాన సంబంధంగా సహజ తెలుగులో వ్యక్తం చేశాం.
- source_word: קוֹמַת
  choice: ఎత్తు
  rationale: ఇక్కడ నిలువు కొలతను సూచిస్తుంది; ‘ఎత్తు’ నేరమైన, సాధారణ తెలుగు పదం.
- source_word: הָאֶחָד
  choice: ఒక్కో
  rationale: పదశః ‘ఒకటి’ అయినా, చక్రాలన్నిటికీ వర్తించే పంపిణీ భావం ఉంది; తెలుగులో ‘ఒక్కో చక్రం’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אַמָּה וַחֲצִי הָאַמָּה
  choice: ఒకటిన్నర మూర
  rationale: పురాతన కొలమానాన్ని ఆధునిక ప్రమాణంలోకి మార్చకుండా నిలుపుతూ, తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘మూర’ను ఉపయోగించాం.
theological_decisions: []
