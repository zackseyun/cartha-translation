  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన నిర్మాణ వర్ణన. చిన్న వాక్యాలతో యాంత్రిక సంబంధాలు స్పష్టపరిచాం; హీబ్రూ పదాల నిజమైన అనిశ్చితిని పాదటిప్పణుల్లో నిలిపాం.
