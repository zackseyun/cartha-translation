source:
  edition: WLC
  text: כָּ/זֹ֣את עָשָׂ֔ה אֵ֖ת עֶ֣שֶׂר הַ/מְּכֹנ֑וֹת מוּצָ֨ק אֶחָ֜ד מִדָּ֥ה אַחַ֛ת קֶ֥צֶב אֶחָ֖ד לְ/כֻלָּֽ/הְנָה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/037.yaml
  text: 'Thus he made the ten stands: one casting[a], one measure, one form for all of them.'
translation:
  language: te
  text: 'ఈ విధంగా అతడు ఆ పది ఆధారపీఠాలను చేశాడు: వాటన్నిటికీ ఒకే అచ్చుపోసిన పని, ఒకే కొలత, ఒకే నమూనా ఉన్నాయి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అవన్నీ ఒకే పోతలో, ఒకే పరిమాణంతో, ఒకే రూపకల్పనతో చేయబడ్డాయి.” పది ఆధారపీఠాలన్నీ ఒకే నిర్దేశాల ప్రకారం చేయబడ్డాయని నొక్కిచెప్పడానికి హీబ్రూలో మూడు సంక్షిప్త సమాంతర పదబంధాలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּזֹאת
  choice: ఈ విధంగా
  rationale: ముందు వివరించిన నమూనా, పనితీరును వెనక్కి సూచించే హీబ్రూ ప్రదర్శనార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עָשָׂה
  choice: చేశాడు
  rationale: నిర్మాణం, శిల్పపని సందర్భంలో సాధారణమైనదీ స్పష్టమైనదీ అయిన అనువాదం.
- source_word: עֶשֶׂר הַמְּכֹנוֹת
  choice: ఆ పది పీఠాలను
  rationale: ఈ ఆలయ సామగ్రి సందర్భంలో מְכֹנוֹת తొట్టెలను మోసే చక్రాలుగల ఆధార నిర్మాణాలను సూచిస్తుంది. ‘పీఠాలు’ వాటి ఆధారకార్యాన్ని తెలియజేస్తూ ‘బండ్లు’ అనే అతినిర్దిష్ట అర్థాన్ని నివారిస్తుంది.
- source_word: מוּצָק אֶחָד
  choice: ఒకే పోతపని
  rationale: లోహాన్ని కరిగించి అచ్చులో పోసి చేసిన పనిని సూచించే מוּצָק భావాన్ని నిలుపుతూ, పది పీఠాల తయారీ ఒకే విధంగా ఉందని తెలియజేస్తుంది.
- source_word: מִדָּה אַחַת
  choice: ఒకే కొలత
  rationale: హీబ్రూ పదబంధానికి సమీపంగా ఉండి, అన్నిటి పరిమాణాలు ఒకటేననే భావాన్ని ఇస్తుంది.
- source_word: קֶצֶב אֶחָד
  choice: ఒకే ఆకారం
  rationale: ఇక్కడ קֶצֶב నమూనా, రూపం లేదా అనుపాతాన్ని సూచించవచ్చు. ‘ఆకారం’ సంక్షిప్త సమాంతర నిర్మాణాన్ని కాపాడుతూ రూపసామ్యాన్ని తెలియజేస్తుంది.
- source_word: לְכֻלָּהְנָה
  choice: వాటన్నిటికీ
  rationale: పది పీఠాలలో ప్రతిదానికీ ఒకే నిర్దేశాలు వర్తించాయని సహజమైన తెలుగులో తెలియజేస్తుంది.
