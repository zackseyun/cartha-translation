  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֔ה אֵ֚ת כָּל הַ/כֵּלִ֔ים אֲשֶׁ֖ר בֵּ֣ית יְהוָ֑ה אֵ֚ת מִזְבַּ֣ח הַ/זָּהָ֔ב וְ/אֶת הַ/שֻּׁלְחָ֗ן אֲשֶׁ֥ר עָלָ֛י/ו לֶ֥חֶם הַ/פָּנִ֖ים זָהָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/048.yaml
  text: 'And Solomon made all the vessels that were in the house of Yahweh: the golden altar[a], and the table on which was the bread of the Presence[b], of gold.'
translation:
  language: te
  text: 'సొలొమోను యాహ్వే మందిరంలోని[a] ఉపకరణాలన్నిటినీ చేశాడు: బంగారు బలిపీఠాన్ని, దానిమీద సన్నిధి రొట్టె[b] ఉండే బంగారు బల్లను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘యాహ్వే ఇల్లు.’
    reason: lexical_alternative
  - marker: b
    text: సాంప్రదాయికంగా, ‘సముఖపు రొట్టె.’ అక్షరార్థంగా, ‘సన్నిధి రొట్టె.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేశాడు
  rationale: עשה అనే విస్తృతార్థక క్రియకు ఈ సామగ్రి తయారీ సందర్భంలో సహజమైన, అతిశయార్థం లేని అనువాదం.
- source_word: כָּל הַכֵּלִים
  choice: సామగ్రినంతటినీ
  rationale: כֵּלִים అనేది పాత్రలు, ఉపకరణాలు, సామగ్రి అనే అర్థాలను ఇస్తుంది. ఇక్కడ బలిపీఠం, బల్ల కూడా జాబితాలో ఉన్నందున ‘పాత్రలన్నిటినీ’ కంటే ‘సామగ్రినంతటినీ’ విస్తృతంగా, సహజంగా సరిపోతుంది.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే మందిరం
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’; ఈ సందర్భంలో దేవాలయాన్ని సూచిస్తుంది. יְהוָה అనే దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: מִזְבַּח הַזָּהָב
  choice: బంగారు బలిపీఠం
  rationale: హీబ్రూ నామవాచక నిర్మాణాన్ని తెలుగులో సహజమైన విశేషణ నిర్మాణంగా ఇచ్చాం.
- source_word: הַשֻּׁלְחָן אֲשֶׁר עָלָיו
  choice: దానిమీద ... ఉండే బల్ల
  rationale: సాపేక్ష వాక్యంలోని స్థానార్థాన్ని స్పష్టంగా, సహజమైన తెలుగు నిర్మాణంలో నిలిపాం.
- source_word: לֶחֶם הַפָּנִים
  choice: సన్నిధి రొట్టె
  rationale: పదబంధంలోని ‘సన్నిధి/ముఖము’ భావాన్ని నిలుపుతూ, ఆరాధనా సందర్భంలోని ప్రత్యేక రొట్టెను సూచించే పారదర్శకమైన అనువాదం.
- source_word: זָהָב
  choice: బంగారు బల్ల
  rationale: చివరనున్న זָהָב బల్లను విశేషిస్తుందని గ్రహించి, తెలుగులో సహజంగా ‘బంగారు బల్ల’ అని ఇచ్చాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా అంగీకరించిన ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- issue: לֶחֶם הַפָּנִים లోని సన్నిధి భావం
  choice: సన్నిధి రొట్టె
  alternative: సముఖపు రొట్టె / నైవేద్యపు రొట్టె
  rationale: దైవసన్నిధి ముందు ఉంచబడే రొట్టె అనే భావాన్ని నిలిపి, ‘నైవేద్యం’ వంటి అదనపు వ్యాఖ్యానాన్ని పాఠ్యంలోకి తేవలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. జాబితా నిర్మాణాన్ని నిలిపి, చివరి זָהָב బల్లను విశేషించేలా స్పష్టం చేశాం.
