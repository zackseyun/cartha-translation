  text: וּ/שְׁתֵּ֨י כֹתָרֹ֜ת עָשָׂ֗ה לָ/תֵ֛ת עַל רָאשֵׁ֥י הָֽ/עַמּוּדִ֖ים מֻצַ֣ק נְחֹ֑שֶׁת חָמֵ֣שׁ אַמּ֗וֹת קוֹמַת֙ הַ/כֹּתֶ֣רֶת הָ/אֶחָ֔ת וְ/חָמֵ֣שׁ אַמּ֔וֹת קוֹמַ֖ת הַ/כֹּתֶ֥רֶת הַ/שֵּׁנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/016.yaml
  text: He made two capitals of cast bronze to set on the tops of the pillars. The height of the one capital was five cubits[a], and the height of the second capital was five cubits.
translation:
  language: te
  text: స్తంభాల పైభాగాలపై ఉంచడానికి అతడు పోతపోసిన కంచుతో రెండు స్తంభశీర్షాలు[a] చేశాడు. ఒక స్తంభశీర్షపు ఎత్తు ఐదు మూరలు; రెండవ స్తంభశీర్షపు ఎత్తు ఐదు మూరలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కిరీటాలు’; హీబ్రూ పదం స్తంభం పైన ఉండే అలంకార భాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹתָרֹת / הַכֹּתֶרֶת
  choice: స్తంభశీర్షాలు / స్తంభశీర్షం
  rationale: స్తంభం పైభాగంలోని అలంకార నిర్మాణాన్ని సూచించే వాస్తుశిల్పార్థాన్ని స్పష్టంగా తెలియజేస్తుంది; అక్షరార్థమైన ‘కిరీటాలు’ ఇక్కడ తప్పుదారి పట్టించవచ్చు.
- source_word: עָשָׂה
  choice: చేశాడు
  rationale: హీబ్రూ సాధారణ క్రియకు సహజమైన, అదనపు భావభారం లేని తెలుగు సమానం.
- source_word: לָתֵת
  choice: ఉంచడానికి
  rationale: 'ఈ క్రియారూపం ఉద్దేశాన్ని తెలియజేస్తుంది: వాటిని స్తంభాలపై ఉంచే నిమిత్తం చేశాడు.'
- source_word: רָאשֵׁי הָעַמּוּדִים
  choice: స్తంభాల పైభాగాలు
  rationale: అక్షరార్థంగా ‘తలలు’ అయినప్పటికీ, వాస్తు సందర్భంలో ‘పైభాగాలు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: מֻצַק נְחֹשֶׁת
  choice: పోతపోసిన కంచు
  rationale: లోహాన్ని కరిగించి అచ్చులో పోసి తయారు చేసిన ప్రక్రియనూ, కంచు అనే పదార్థాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: חָמֵשׁ אַמּוֹת
  choice: ఐదు మూరలు
  rationale: మూలంలోని ప్రాచీన కొలమానాన్ని ఆధునిక కొలతగా మార్చకుండా, తెలుగు బైబిలు వాడుకలో పరిచితమైన ‘మూర’తో అందిస్తుంది.
- source_word: קוֹמַת
  choice: ఎత్తు
  rationale: నిర్మాణ కొలత సందర్భంలో సహజమైన, ఖచ్చితమైన తెలుగు పదం.
- source_word: הָאֶחָת
  choice: ఒక
  rationale: మూలం ‘మొదటి’ అని కాక జంటలో ‘ఒకటి’ అని చెబుతున్న తేడాను నిలుపుతుంది.
- source_word: הַשֵּׁנִית
  choice: రెండవ
  rationale: జంటలో రెండవదాన్ని హీబ్రూ స్పష్టంగా గుర్తిస్తుంది.
