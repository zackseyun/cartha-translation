id: 1KI.7.9
reference: 1 Kings 7:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּל אֵ֜לֶּה אֲבָנִ֤ים יְקָרֹת֙ כְּ/מִדֹּ֣ת גָּזִ֔ית מְגֹרָר֥וֹת בַּ/מְּגֵרָ֖ה מִ/בַּ֣יִת וּ/מִ/ח֑וּץ וּ/מִ/מַּסָּד֙ עַד הַ/טְּפָח֔וֹת וּ/מִ/ח֖וּץ עַד הֶ/חָצֵ֥ר הַ/גְּדוֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/009.yaml
  text: All these were costly stones[a], cut according to measure, sawed with a saw on the inside and on the outside, from the foundation to the coping[b], and on the outside as far as the great court.
translation:
  language: te
  text: ఇవన్నీ ఖరీదైన రాళ్లు[a]; కొలతలకు తగినట్లుగా చెక్కబడినవి, లోపలి వైపునూ బయటి వైపునూ రంపంతో కోయబడినవి—పునాది నుండి పై అంచుల[b] వరకు, వెలుపల నుండి మహా ప్రాంగణం వరకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విలువైన రాళ్లు.” ఇక్కడ రత్నాలు కాకుండా ఖరీదైన, మేలైన నిర్మాణ రాళ్లు ఉద్దేశించబడి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ “తెఫాహోత్.” ఈ నిర్మాణ భాగానికి ఖచ్చితమైన అర్థం అనిశ్చితం; అది పైభాగపు ముగింపును, అంచును, లేదా రాళ్ల పై వరుసను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים יְקָרֹת
  choice: ఖరీదైన రాళ్లు
  rationale: నిర్మాణ సందర్భంలో יְקָרֹת రత్నాలను కాకుండా అధిక విలువగల, మేలైన నిర్మాణ రాళ్లను సూచించే అవకాశం ఎక్కువ. ‘ఖరీదైన రాళ్లు’ ఈ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: כְּמִדֹּת גָּזִית
  choice: కొలత ప్రకారం చెక్కి
  rationale: ఈ పదబంధంలో నిర్దిష్ట కొలతల భావమూ, రాళ్లను నిర్మాణానికి తగినట్లు చెక్కిన భావమూ ఉన్నాయి. ఎంపిక చేసిన రూపం రెండింటినీ సంక్షిప్తంగా అందిస్తుంది.
- source_word: מְגֹרָרוֹת בַּמְּגֵרָה
  choice: రంపంతో కోశారు
  rationale: హీబ్రూలో క్రియతోపాటు పనిముట్టు కూడా స్పష్టంగా ఉంది. తెలుగులో ‘రంపంతో కోశారు’ ఆ స్పష్టతను సహజంగా నిలుపుతుంది.
- source_word: מִבַּיִת וּמִחוּץ
  choice: లోపలివైపునా వెలుపలివైపునా
  rationale: రాతిపనికి సంబంధించిన లోపలి, బయటి వైపులను సూచించే నిర్మాణ సందర్భాన్ని ఈ రూపం స్పష్టంగా తెలియజేస్తుంది; కేవలం స్థల సూచనగా పరిమితం చేయదు.
- source_word: מִמַּסָּד
  choice: పునాది మొదలుకొని
  rationale: నిర్మాణ సందర్భంలో מַסָּד భవనం పునాదిని లేదా అడుగుభాగాన్ని సూచిస్తుంది. ‘పునాది’ సాధారణ పాఠకులకు స్పష్టమైన నిర్మాణ పదం.
- source_word: עַד הַטְּפָחוֹת
  choice: పై అంచు వరకు
  rationale: הַטְּפָחוֹת యొక్క ఖచ్చితమైన నిర్మాణార్థం అనిశ్చితం. భవనం పైభాగపు ముగింపు లేదా పై వరుస అనే సాధారణ భావాన్ని ‘పై అంచు’ అతిగా నిర్దిష్టం చేయకుండా అందిస్తుంది.
- source_word: וּמִחוּץ עַד הֶחָצֵר הַגְּדוֹלָה
  choice: వెలుపల మహా ప్రాంగణం వరకు
  rationale: వివరణ భవనం వెలుపలి భాగం నుండి పెద్ద ప్రాంగణం వరకు విస్తరించిందనే భావాన్ని నేరుగా వ్యక్తం చేస్తుంది. חָצֵר కు ‘ప్రాంగణం’ సహజమైన నిర్మాణపరమైన సమానార్థకం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన నిర్మాణ వర్ణనను ఉపయోగించాం. హీబ్రూ వాక్యంలోని గట్టి నామవాచక నిర్మాణాన్ని తెలుగులో స్పష్టత కోసం మూడు వాక్యాలుగా విభజించాం; చివరి వాక్యం పునాది నుండి పైభాగం వరకు మరియు వెలుపల మహా ప్రాంగణం వరకు ఉన్న విస్తృతిని తెలియజేస్తుంది. అనిశ్చితమైన הַטְּפָחוֹת ను ప్రధాన పాఠ్యంలో సాధారణంగా అనువదించి, దాని అనిశ్చితిని పాదసూచికలో నిలిపాం.
