  text: וְ/עַֽל הַ/מִּסְגְּר֞וֹת אֲשֶׁ֣ר בֵּ֣ין הַ/שְׁלַבִּ֗ים אֲרָי֤וֹת בָּקָר֙ וּ/כְרוּבִ֔ים וְ/עַל הַ/שְׁלַבִּ֖ים כֵּ֣ן מִ/מָּ֑עַל וּ/מִ/תַּ֨חַת֙ לַ/אֲרָי֣וֹת וְ/לַ/בָּקָ֔ר לֹי֖וֹת מַעֲשֵׂ֥ה מוֹרָֽד־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/029.yaml
  text: And on the panels that were between the frames were lions[a], oxen, and cherubim; and on the frames likewise above, and beneath the lions and the oxen were wreaths[b], a work of hanging relief.
translation:
  language: te
  text: చట్రాల మధ్య ఉన్న పలకల మీద సింహాలు, ఎద్దులు, కెరూబుల ఆకృతులు చెక్కబడి ఉండేవి. చట్రాల పైభాగంలో కూడా అలాంటి ఆకృతులే ఉండేవి. సింహాలు, ఎద్దుల కింద దండలవంటి అలంకారాలు[a] వేలాడే ఉబ్బెత్తు శిల్పకళతో చేయబడి ఉండేవి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘హారాల వంటి అలంకారాలు’; ఇక్కడి హీబ్రూ పదం అరుదైనది, ఆ అలంకారం ఖచ్చితంగా ఏ ఆకారంలో ఉండేదో తెలియదు.
    reason: lexical_alternative
  - marker: b
    text: ‘వేలాడే ఉబ్బెత్తు శిల్పకళతో’గా అనువదించిన హీబ్రూ పదబంధం అర్థం కఠినమైనది; అది సింహాలు, ఎద్దుల కింద కిందికి దిగుతూ లేదా వేలాడుతూ ఉన్న అలంకార పనిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִּסְגְּרוֹת
  choice: పలకలు
  rationale: ఈ నిర్మాణ వర్ణనలో చట్రాల మధ్య అమర్చిన అలంకార విభాగాలను సూచిస్తుంది; שְׁלַבִּים నుండి స్పష్టంగా వేరు చేస్తుంది.
- source_word: שְׁלַבִּים
  choice: చట్రాలు
  rationale: అలంకార పలకలను చుట్టుముట్టే లేదా వాటి మధ్యనున్న నిర్మాణ భాగాలను సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: אֲרָיוֹת
  choice: సింహాలు
  rationale: అలంకార సందర్భంలోని సాధారణ బహువచన జంతు పదం.
- source_word: בָּקָר
  choice: ఎద్దులు
  rationale: హీబ్రూ పదం గోవుల వర్గాన్ని సూచించినా, ఆలయ సామగ్రిపై చెక్కిన బలమైన గోవు ఆకృతులకు ‘ఎద్దులు’ సహజమైన తెలుగు పదం.
- source_word: כְרוּבִים
  choice: కెరూబులు
  rationale: సింహాసనంతో అనుబంధమున్న ప్రత్యేక పరలోక జీవులను సూచించే సంప్రదాయ లిప్యంతరీకరణ; సాధారణ దేవదూతలుగా మార్చలేదు.
- source_word: כֵּן
  choice: అలాంటి ఆకృతులే
  rationale: పలకల అలంకరణకు చట్రాల పైభాగంలోని అలంకరణ సరిపోలిందనే తులనాత్మక భావాన్ని సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: מִמָּעַל
  choice: పైభాగంలో
  rationale: అలంకరణ ఉన్న ఎగువ స్థానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִתַּחַת
  choice: కింద
  rationale: సింహాలు, ఎద్దుల ఆకృతులకు దిగువన ఉన్న అలంకరణ స్థానాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: לֹיוֹת
  choice: పూలదండల ఆకారపు అలంకారాలు
  rationale: అత్యంత అరుదైన ఈ నామవాచకం దండ, హారం లేదా వలయాకార అలంకరణను సూచించవచ్చు; రూపం అనిశ్చితమని పాదసూచికలో నిలుపుకుంది.
- source_word: מַעֲשֵׂה מוֹרָד
  choice: వేలాడుతున్న ఉబ్బెత్తు పని
  rationale: కఠినమైన ఈ పదబంధంలోని కిందికి దిగే లేదా వేలాడే అలంకార భావాన్నీ, శిల్పకళా పనినీ కలిపి తెలియజేస్తూ ఖచ్చితత్వాన్ని అతిగా ప్రకటించదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన నిర్మాణ-శిల్ప పదజాలం వాడబడింది. మూలంలోని అరుదైన అలంకార పదం మరియు చివరి కఠిన పదబంధం పాదసూచికల ద్వారా అనిశ్చితంగానే ఉంచబడ్డాయి. అందించిన ఆంగ్ల పాఠ్యంలో మొదటి పాదసూచిక గుర్తు ‘lions’ వద్ద కనిపించినా, దాని విషయము לֹיוֹת అనే అలంకార పదానికే సంబంధించినందున తెలుగు ప్రధాన పాఠ్యంలో సరైన స్థానంలో ఉంచబడింది.
