id: 1KI.7.47
reference: 1 Kings 7:47
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּנַּ֤ח שְׁלֹמֹה֙ אֶת כָּל הַ/כֵּלִ֔ים מֵ/רֹ֖ב מְאֹ֣ד מְאֹ֑ד לֹ֥א נֶחְקַ֖ר מִשְׁקַ֥ל הַ/נְּחֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/047.yaml
  text: And Solomon left all the vessels unweighed because they were exceedingly many[a]; the weight of the bronze was not determined.
translation:
  language: te
  text: ఉపకరణాలు ఎంతో ఎక్కువగా ఉన్నందున సొలొమోను వాటన్నిటినీ తూకం వేయకుండా విడిచిపెట్టాడు[a]; కంచు బరువు నిర్ధారించబడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఉపకరణాలు ఎంతో ఎక్కువగా ఉన్నందున సొలొమోను వాటన్నిటినీ అలాగే విడిచిపెట్టాడు; కంచు బరువు విచారించి నిర్ధారించబడలేదు.”
    reason: వַיַּנַּחకు ‘విడిచిపెట్టాడు/అలాగే ఉంచాడు’ అనే విస్తృత అర్థం ఉంది; ‘తూకం వేయకుండా’ అనేది తరువాతి ఉపవాక్యంలోని బరువు నిర్ధారణ సందర్భం నుంచి వచ్చిన వివరణాత్మక అనువాదం. לֹא נֶחְקַרను మరింత అక్షరార్థంగా ‘విచారించి నిర్ధారించబడలేదు’ అని కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: וַיַּנַּח
  choice: తూకం వేయకుండా విడిచిపెట్టాడు
  rationale: ప్రాథమికంగా ‘విడిచిపెట్టాడు/అలాగే ఉంచాడు’ అనే భావం. వెంటనే వచ్చే కంచు బరువు నిర్ధారించబడలేదనే వాక్యాన్ని బట్టి, ఏ పని చేయకుండా విడిచిపెట్టాడో సహజమైన తెలుగులో స్పష్టంచేస్తుంది; అయితే మూలంలోని సంక్షిప్తతను పాదసూచికలో నిలుపుతుంది.
- source_word: כָּל הַכֵּלִים
  choice: వాటన్నిటినీ
  rationale: ముందటి సందర్భంలో చెప్పబడిన ఆలయ సామానును సూచిస్తుంది. వచనంలో ‘సామాను’ అని పేర్కొని, పునరుక్తి భారాన్ని తగ్గించడానికి సర్వనామ రూపం వాడబడింది.
- source_word: מֵרֹב מְאֹד מְאֹד
  choice: సామాను అత్యధికంగా ఉన్నందున
  rationale: מִן కారణార్థాన్ని, רֹב సమృద్ధిని, రెండుసార్లు వచ్చిన מְאֹד తీవ్రమైన అధికతను తెలియజేస్తాయి. ‘అత్యధికంగా’ ఆ బలాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: לֹא נֶחְקַר
  choice: నిర్ధారించబడలేదు
  rationale: חקר నిఫల్ రూపం ఇక్కడ విచారించి/లెక్కించి ఖచ్చితంగా తెలుసుకోకపోవడాన్ని సూచిస్తుంది. బరువు సందర్భంలో ‘నిర్ధారించబడలేదు’ సముచితంగా ఉంటుంది.
- source_word: מִשְׁקַל
  choice: బరువు ఎంత అనేది
  rationale: మూలపదం ‘బరువు’ను సూచిస్తుంది. తెలుగు వాక్యంలో ‘ఎంత అనేది’ చేర్చడం ద్వారా నిర్ధారణకు సంబంధించిన భావం సహజంగా వ్యక్తమవుతుంది.
- source_word: הַנְּחֹשֶׁת
  choice: కంచు
  rationale: ఆలయ సామగ్రి సందర్భంలో נְחֹשֶׁת సాధారణంగా bronze‌ను సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘కంచు’ సహజమైన పదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా రాజప్రాసాద/ఆలయ వర్ణనకు తగిన గౌరవప్రదమైన శైలి. మూలంలోని సంభావ్య నిర్మాణార్థాన్ని ప్రధాన పాఠంలో సందర్భానుసారంగా స్పష్టంచేసి, నిజమైన లెక్సికల్ ప్రత్యామ్నాయాన్ని [a] పాదసూచికలో నిలిపాం.
