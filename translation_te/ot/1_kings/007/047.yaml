    rationale: ‘సామాను’ is a broad, somewhat colloquial collective term, while the following pronoun treats it as distinct countable objects. In a temple-furnishings context, ‘ఉపకరణాలు’ is more natural and precise in register.
  - severity: low
    issue: Footnote wording is unnatural
    rationale: ‘పరిశీలించి తెలుసుకోబడలేదు’ is a cumbersome passive expression. ‘విచారించి నిర్ధారించబడలేదు’ expresses the lexical alternative naturally while preserving the source ambiguity.
