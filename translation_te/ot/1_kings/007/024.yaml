  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/פְקָעִים֩ מִ/תַּ֨חַת לִ/שְׂפָת֤/וֹ סָבִיב֙ סֹבְבִ֣ים אֹת֔/וֹ עֶ֚שֶׂר בָּֽ/אַמָּ֔ה מַקִּפִ֥ים אֶת הַ/יָּ֖ם סָבִ֑יב שְׁנֵ֤י טוּרִים֙ הַ/פְּקָעִ֔ים יְצֻקִ֖ים בִּ/יצֻקָתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/024.yaml
  text: And gourds were under its rim all around[a], encircling it, ten to the cubit, surrounding the Sea all around. The gourds were in two rows, cast in one piece with it.
translation:
  language: te
  text: దాని అంచు కింద చుట్టూరా కాయలవంటి అలంకారాలు[a] దానిని చుట్టుముట్టి ఉండేవి; ఒక్కో మూరకు పది చొప్పున, అవి సముద్రం చుట్టూ ఉండేవి. ఆ కాయలవంటి అలంకారాలు రెండు వరుసలుగా ఉండి, దానిని పోసినప్పుడే దానితో కలిసి పోయబడ్డాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మొగ్గలు” లేదా “గుబ్బలు”; హీబ్రూ పదం కాయలను పోలిన అలంకార రూపాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקָעִים
  choice: కాయల ఆకారపు అలంకారాలు
  rationale: ఈ పదం కాయలు, మొగ్గలు లేదా బుడిపెలను పోలిన అలంకార రూపాలను సూచిస్తుంది. నిర్దిష్ట వృక్షజాతిని అనవసరంగా నిర్ణయించకుండా, సందర్భంలోని అలంకార స్వభావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִתַּחַת לִשְׂפָתוֹ
  choice: దాని అంచు కింద
  rationale: שָׂפָה అక్షరార్థంగా ‘పెదవి’ లేదా ‘అంచు’; పెద్ద పాత్ర విషయంలో ‘అంచు’ సహజమైన ఆధునిక తెలుగు.
- source_word: סָבִיב סֹבְבִים אֹתוֹ
  choice: చుట్టూ ... దాన్ని ఆవరించాయి
  rationale: మూలంలోని ఒకే ధాతువుకు సంబంధించిన పునరుక్తి ఇచ్చే నొక్కిచెప్పడాన్ని సహజమైన తెలుగు ద్వంద్వవ్యక్తీకరణతో నిలిపింది.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: ఒక్కో మూరకు పది చొప్పున
  rationale: చుట్టుకొలత వెంట ప్రతి మూరకు ఉన్న అలంకారాల సంఖ్యను సహజంగా, కొలత విధానాన్ని మించి వ్యాఖ్యానించకుండా వ్యక్తం చేస్తుంది.
- source_word: מַקִּפִים אֶת הַיָּם סָבִיב
  choice: సముద్రం చుట్టూ వ్యాపించి ఉన్నాయి
  rationale: הַיָּם ఇక్కడ పెద్ద లోహపు తొట్టికి ఇచ్చిన ప్రత్యేక నామం; ‘సముద్రం’ అని నిలిపి, అలంకారాలు దాని చుట్టూ కొనసాగిన భావాన్ని తెలిపింది.
- source_word: שְׁנֵי טוּרִים
  choice: రెండు వరుసల్లో
  rationale: అలంకారాల అమరికను తెలుగులో నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: יְצֻקִים בִּיצֻקָתוֹ
  choice: సముద్రంతోపాటే ఒకే పోతలో పోయబడ్డాయి
  rationale: అలంకారాలను తర్వాత అతికించలేదని, పాత్రను పోసినప్పుడే దానిలో అంతర్భాగంగా రూపొందించారని మూలంలోని ధాతు పునరుక్తి సూచిస్తుంది.
