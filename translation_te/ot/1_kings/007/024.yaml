translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆలయ సామగ్రి వర్ణనకు తగిన గంభీరతను ఉంచుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. కొలత పదంగా సంప్రదాయబద్ధమైన ‘మూర’ను ఉపయోగించింది.
