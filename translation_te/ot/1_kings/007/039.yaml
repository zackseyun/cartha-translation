base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/039.yaml
  text: He placed five stands on the right side of the house and five on the left side of the house[a], and he placed the Sea on the southeast side of the house.
translation:
  language: te
  text: అతడు ఐదు పీఠాలను మందిరపు కుడి వైపున, మరో ఐదింటిని మందిరపు ఎడమ వైపున ఉంచాడు. సముద్రాన్ని మందిరానికి ఆగ్నేయ వైపున ఉంచాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ వాక్యరూపం: “మందిరపు కుడి వైపు, తూర్పు దిశగా, దక్షిణం వైపున”—ఇది ఆగ్నేయ వైపును సూచించే సంక్షిప్త స్థలవివరణ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּכֹנוֹת
  choice: పీఠాలు
  rationale: ఈ సందర్భంలో ఈ పదం తొట్టెలను మోసే చక్రాలుగల కంచు నిర్మాణాలను సూచిస్తుంది. ‘పీఠాలు’ వాటి ఆధారంగా నిలిపే పనిని సహజంగా తెలియజేస్తుంది; ‘బండ్లు’ అనడం వాటి కదలికను అనవసరంగా ప్రధానంగా చూపవచ్చు.
- source_word: כֶּתֶף
  choice: వైపు
  rationale: అక్షరార్థం ‘భుజం’; నిర్మాణ స్థలవివరణలో ఇది భవనం యొక్క ఒక వైపును సూచిస్తుంది.
- source_word: הַבַּיִת
  choice: మందిరం
  rationale: హీబ్రూలో ‘ఇల్లు’ అని ఉన్నా, ఈ సందర్భంలో అది యెహోవా మందిరాన్ని సూచిస్తుంది. ఆధునిక తెలుగు పాఠకునికి సందర్భార్థాన్ని స్పష్టంగా తెలియజేయడానికి ‘మందిరం’ ఎంచుకున్నాం.
- source_word: מִיָּמִין / מִשְּׂמֹאלוֹ
  choice: కుడి వైపున / ఎడమ వైపున
  rationale: మూలంలోని శరీరాధారిత దిశా భాషను దిక్సూచి దిశలుగా మార్చకుండా నేరుగా నిలిపాం.
- source_word: הַיָּם
  choice: సముద్రం
  rationale: ఇది మందిర ప్రాంగణంలోని పెద్ద పోత తొట్టికి వాడిన ప్రత్యేక నామం. మూలంలోని సంప్రదాయ నామాన్ని నిలిపేందుకు ‘సముద్రం’ అని అనువదించాం.
- source_word: הַיְמָנִית קֵדְמָה מִמּוּל נֶגֶב
  choice: ఆగ్నేయ వైపున
  rationale: ‘కుడి వైపు, తూర్పు దిశగా, దక్షిణానికి ఎదురుగా’ అనే సంక్షిప్త హీబ్రూ స్థలవివరణ మొత్తంగా మందిరపు ఆగ్నేయ వైపును సూచిస్తుంది; సహజమైన తెలుగులో ఆ దిశను సంక్షిప్తంగా తెలిపాం.
