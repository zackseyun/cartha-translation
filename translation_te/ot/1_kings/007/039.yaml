translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘మరో ఐదింటిని’ అనే రూపం పునరుక్తిని తగ్గిస్తూ సంఖ్యా సమతౌల్యాన్ని స్పష్టంగా ఉంచుతుంది. ‘సముద్రం’ ఆలయ సామగ్రికి చెందిన ప్రత్యేక నామంగా నిలిపబడింది.
