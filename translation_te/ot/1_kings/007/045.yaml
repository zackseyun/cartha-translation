id: 1KI.7.45
reference: 1 Kings 7:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֶת הַ/סִּיר֨וֹת וְ/אֶת הַ/יָּעִ֜ים וְ/אֶת הַ/מִּזְרָק֗וֹת וְ/אֵת֙ כָּל הַ/כֵּלִ֣ים ה/אהל אֲשֶׁ֨ר עָשָׂ֥ה חִירָ֛ם לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בֵּ֣ית יְהוָ֑ה נְחֹ֖שֶׁת מְמֹרָֽט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/045.yaml
  text: and the pots[a], the shovels, the basins[c][b], and all these vessels that Hiram made for King Solomon for the house of Yahweh were of burnished bronze.
translation:
  language: te
  text: కుండలు, పారలు, గిన్నెలు[a], ఇంకా హీరాము రాజు సొలొమోను కోసం యాహ్వే మందిరం కొరకు చేసిన ఈ వస్తువులన్నీ మెరుగుపెట్టిన కంచుతో తయారైనవి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పాత్రలు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నునుపుగా మెరుగుపెట్టిన కంచుతో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירוֹת
  choice: కుండలు
  rationale: సִירוֹת అనేది సాధారణంగా కుండలు లేదా పెద్ద వంటపాత్రలను సూచిస్తుంది. ఈ సామగ్రి జాబితాలో ‘కుండలు’ సహజమైన, విస్తృతమైన పదం.
- source_word: הַיָּעִים
  choice: పారలు
  rationale: యָעִים బలిపీఠం దగ్గర బూడిద లేదా ఇతర పదార్థాలను తొలగించడానికి ఉపయోగించే పనిముట్లను సూచిస్తుంది. ‘పారలు’ ఆధునిక తెలుగులో సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: הַמִּזְרָקוֹת
  choice: గిన్నెలు
  rationale: מִזְרָקוֹת ద్రవాలను పట్టుకోవడానికి లేదా చిలకరించడానికి ఉపయోగించే పాత్రలు. ‘గిన్నెలు’ సాధారణ పాఠకులకు సహజంగా అర్థమవుతుంది; ‘లోతైన పాత్రలు’ కూడా సాధ్యమైన భావం.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: ఈ సామగ్రి అంతా
  rationale: כֵּלִים అనేది పాత్రలు, పనిముట్లు రెండింటినీ కలుపుకొనే విస్తృత పదం. ముందు పేర్కొన్న కుండలు, పారలు, గిన్నెలన్నిటినీ తెలుగులో సహజంగా సమగ్రపరచడానికి ‘సామగ్రి’ ఎంచుకున్నాం.
- source_word: עָשָׂה חִירָם לַמֶּלֶךְ שְׁלֹמֹה
  choice: హీరాము రాజైన సొలొమోనుకు చేసిన
  rationale: క్రియ యొక్క సాధారణ అర్థమైన ‘చేసిన’ను నిలుపుతూ, לְ ను పని ఎవరి కోసం జరిగిందో తెలిపే ‘కు’గా అనువదించాం.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే మందిరం కోసం
  rationale: בֵּית అక్షరార్థంగా ‘ఇల్లు’ అయినప్పటికీ, ఇక్కడ దేవాలయాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సందర్భం వెంటనే స్పష్టమయ్యేలా ‘మందిరం’ వాడాం; వస్తువుల ఉద్దేశాన్ని తెలపడానికి ‘కోసం’ చేర్చాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ పాఠంలోని దేవుని వ్యక్తిగత నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యంతరీకరించాం.
- source_word: נְחֹשֶׁת מְמֹרָט
  choice: మెరుగుపెట్టిన కంచు
  rationale: נְחֹשֶׁת ఈ ఆలయ సామగ్రి సందర్భంలో కంచును సూచిస్తుంది; מְמֹרָט లోహాన్ని నునుపుగా, ప్రకాశించేలా మెరుగుపెట్టిన స్థితిని తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠం ఒక బిరుదును కాకుండా చతురక్షర దైవనామాన్ని ఉపయోగిస్తుంది. అందువల్ల వ్యక్తిగత నామాన్ని నిలుపుతూ ‘యాహ్వే’ అని ఇచ్చాం.
- issue: చివరి నామపదబంధం నְחֹשֶׁת מְמֹרָט యొక్క వాక్య సంబంధం
  choice: జాబితాలోని సామగ్రి అంతటికీ వర్తించే విధేయంగా తీసుకుని ‘తయారైంది’ అని స్పష్టం చేయడం
  alternative: చివరలో ‘మెరుగుపెట్టిన కంచుతో’ అనే అసంపూర్ణ నామపదబంధంగా ఉంచడం
  rationale: హీబ్రూలో ఇది క్రియలేని విధేయ వాక్యం; జాబితాలోని వస్తువులన్నీ మెరుగుపెట్టిన కంచుతో చేసినవని భావం. తెలుగులో సహజమైన సంపూర్ణ వాక్యం కోసం అంతర్లీనమైన ‘ఉంది/అయింది’ భావాన్ని ‘తయారైంది’గా వ్యక్తం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి వాడాం. ఆలయ సామగ్రి జాబితా సంక్షిప్తతను నిలిపి, హీబ్రూలో అంతర్లీనంగా ఉన్న చివరి విధేయ సంబంధాన్ని తెలుగులో స్పష్టం చేశాం.
