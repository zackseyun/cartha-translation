  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడాం. కొలతల వరుసను సహజ తెలుగు వాక్య నిర్మాణంలో ఉంచి, మూలంలోని సంఖ్యలను యథాతథంగా నిలిపాం.
