source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ אֶת הַ/מְּכֹנ֛וֹת עֶ֖שֶׂר נְחֹ֑שֶׁת אַרְבַּ֣ע בָּ/אַמָּ֗ה אֹ֚רֶךְ הַ/מְּכוֹנָ֣ה הָֽ/אֶחָ֔ת וְ/אַרְבַּ֤ע בָּֽ/אַמָּה֙ רָחְבָּ֔/הּ וְ/שָׁלֹ֥שׁ בָּ/אַמָּ֖ה קוֹמָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/027.yaml
  text: He made ten bronze stands. The length of each stand was four cubits[a], its width four cubits, and its height three cubits.
translation:
  language: te
  text: అతడు కంచుతో పది పీఠాలను[a] చేశాడు. ఒక్కొక్క పీఠం పొడవు నాలుగు మూరలు, వెడల్పు నాలుగు మూరలు, ఎత్తు మూడు మూరలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆధారాలు.” ఇక్కడి హెబ్రీ పదం ఆలయ ఆవరణలోని గంగాళాలను మోసే కంచు నిర్మాణాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: అతడు ... చేశాడు
  rationale: కథన క్రమంలో తదుపరి చర్యను తెలిపే wayyiqtol రూపం. ఆధునిక తెలుగులో సాధారణ భూతకాల రూపం సహజంగా ఉంటుంది.
- source_word: הַמְּכֹנוֹת
  choice: పీఠాలను
  rationale: ఆలయ ఆవరణలోని గంగాళాలకు ఆధారంగా ఉన్న కంచు నిర్మాణాలను సూచిస్తుంది. ‘పీఠాలు’ వాటి ఆధారపు పనిని సహజంగా తెలియజేస్తుంది; పదంలోని విస్తృత భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: עֶשֶׂר
  choice: పది
  rationale: పీఠాల సంఖ్యను తెలిపే సాధారణ సంఖ్యావాచకం.
- source_word: נְחֹשֶׁת
  choice: కంచుతో
  rationale: ఆలయ సామగ్రి సందర్భంలో ఈ పదం సాధారణంగా కంచును సూచిస్తుంది; మూలపదానికి రాగి అనే విస్తృత అర్థం కూడా ఉండవచ్చు.
- source_word: הַמְּכוֹנָה הָאֶחָת
  choice: ఒక్కొక్క పీఠం
  rationale: అక్షరార్థంగా ‘ఒక పీఠం’ అయిన హెబ్రీ ప్రయోగం ప్రతి పీఠానికీ కొలతలు ఒకేలా ఉన్నాయని పంపిణీ భావంతో తెలియజేస్తుంది.
- source_word: אַמָּה
  choice: మూరలు
  rationale: ప్రాచీన మూర కొలతను సుమారు ఆధునిక కొలతగా మార్చకుండా, సంప్రదాయ తెలుగు బైబిలు కొలమాన పదంతో నిలిపాం.
- source_word: אֹרֶךְ / רָחְבָּהּ / קוֹמָתָהּ
  choice: పొడవు / వెడల్పు / ఎత్తు
  rationale: మూడు కొలతల అర్థాలను స్పష్టమైన, సాధారణ ఆధునిక తెలుగు పదాలతో అందించాం.
