  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מְיֻסָּ֕ד אֲבָנִ֥ים יְקָר֖וֹת אֲבָנִ֣ים גְּדֹל֑וֹת אַבְנֵי֙ עֶ֣שֶׂר אַמּ֔וֹת וְ/אַבְנֵ֖י שְׁמֹנֶ֥ה אַמּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/010.yaml
  text: And the foundation was of costly stones[a], large stones, stones of ten cubits and stones of eight cubits.
translation:
  language: te
  text: పునాది ఖరీదైన రాళ్లతో[a], పెద్ద రాళ్లతో, పది మూరల రాళ్లతోను ఎనిమిది మూరల రాళ్లతోను వేయబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విలువైన రాళ్లతో’ లేదా ‘అమూల్యమైన రాళ్లతో.’ హీబ్రూ పదం రాళ్ల అధిక విలువను లేదా నాణ్యతను సూచిస్తుంది; నిర్మాణ సందర్భంలో ఇది రత్నాలను కాక, ఖరీదైన నిర్మాణ రాళ్లను సూచించడం ఎక్కువ సంభావ్యం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְיֻסָּד
  choice: పునాది ... వేయబడింది
  rationale: יסד ధాతువు యొక్క కర్మణి రూపాన్ని నిర్మాణ సందర్భానికి సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; అంతర్నిహితమైన నిర్మాణాధారాన్ని ‘పునాది’గా స్పష్టం చేస్తుంది.
- source_word: אֲבָנִים יְקָרוֹת
  choice: విలువైన రాళ్లతో
  rationale: יְקָרוֹת సూచించే అధిక విలువ లేదా నాణ్యతను తెలియజేస్తుంది; ‘రత్నాలు’ అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: పెద్ద రాళ్లతో
  rationale: ఈ నిర్మాణ సందర్భంలో גְּדֹלוֹת రాళ్ల భౌతిక పరిమాణాన్ని సూచిస్తుంది.
- source_word: אַבְנֵי עֶשֶׂר אַמּוֹת
  choice: పది మూరల రాళ్లు
  rationale: మూలంలోని కొలతను అలాగే ఉంచి, ఏ దిశలోని కొలతో పేర్కొనకుండా ఉంటుంది.
- source_word: וְאַבְנֵי שְׁמֹנֶה אַמּוֹת
  choice: ఎనిమిది మూరల రాళ్లు
  rationale: ముందున్న పదబంధానికి సమాంతర నిర్మాణాన్ని కాపాడుతుంది.
- source_word: אַמּוֹת
  choice: మూరలు
  rationale: אַמָּה అనే ప్రాచీన కొలమానానికి తెలుగులో సంప్రదాయంగా వాడే ‘మూర’ను ఉపయోగించి, ఆధునిక కొలమానంలోకి ఊహాత్మకంగా మార్చలేదు.
