    issue: Added explanatory wording
    rationale: “అంటే” and “వంటి” are not represented in the Hebrew. They make the ten- and eight-cubit stones examples or explanations of the large stones, whereas the source presents them in a coordinated sequence.
  - severity: low
    issue: Footnote overstates the exclusion of gemstones
    rationale: The note says that gemstones are not intended. The construction context strongly favors valuable building stones, but the lexical note should state this as a contextual likelihood rather than an absolute claim.
