  terminology: “మూరలు” is an appropriate traditional Telugu rendering for cubits. “ఖరీదైన రాళ్లు” directly conveys the high-value sense in this construction context; the footnote should not categorically deny that the stones could be called precious, but should explain why “రత్నాలు” is unlikely here.
  issues:
