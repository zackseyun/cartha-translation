translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన నిర్మాణ వర్ణన. మూలంలోని కొలత దిశను నిర్దిష్టం చేయకుండా, ‘మూర’ అనే ప్రాచీన కొలమానాన్ని నిలిపి ఉంచింది.
