translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. దిశల పునరుక్తి, నిర్మాణ వివరణలోని సమతౌల్యం నిలుపబడ్డాయి. ఆలయపు ప్రత్యేక తొట్టి పేరుగా ‘సముద్రం’ను ఉద్ధరణ చిహ్నాలతో ఉంచి, సాధారణ జలరాశితో గందరగోళం తగ్గించబడింది.
