source:
  edition: WLC
  text: עֹמֵ֞ד עַל שְׁנֵ֧י עָשָׂ֣ר בָּקָ֗ר שְׁלֹשָׁ֣ה פֹנִ֣ים צָפ֡וֹנָ/ה וּ/שְׁלֹשָׁה֩ פֹנִ֨ים יָ֜מָּ/ה וּ/שְׁלֹשָׁ֣ה פֹּנִ֣ים נֶ֗גְבָּ/ה וּ/שְׁלֹשָׁה֙ פֹּנִ֣ים מִזְרָ֔חָ/ה וְ/הַ/יָּ֥ם עֲלֵי/הֶ֖ם מִ/לְ/מָ֑עְלָ/ה וְ/כָל אֲחֹֽרֵי/הֶ֖ם בָּֽיְתָ/ה־׀׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/025.yaml
  text: 'It stood on twelve oxen: three facing north[a], three facing west, three facing south, and three facing east; and the Sea was on them above[b], and all their rear parts were inward.'
translation:
  language: te
  text: 'అది పన్నెండు ఎద్దుల మీద నిలిచి ఉంది: మూడు ఉత్తరంవైపు తిరిగి, మూడు పడమరవైపు తిరిగి[a], మూడు దక్షిణంవైపు తిరిగి, మూడు తూర్పువైపు తిరిగి ఉన్నాయి. ఆ సముద్రం వాటి మీద, పైభాగాన ఉంది; వాటి వెనుక భాగాలన్నీ లోపలి వైపు ఉన్నాయి.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పడమర’కు వాడిన హీబ్రూ పదానికి అక్షరార్థం ‘సముద్రం వైపు’; బైబిలు హీబ్రూలో పడమరను సూచించడానికి ఇది సాధారణమైన విధానం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వాటి పృష్ఠభాగాలన్నీ లోపలి వైపు ఉన్నాయి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמֵד
  choice: నిలిచి ఉంది
  rationale: ఈ కర్తరి వర్తమాన కృదంతం ముందటి వచనంలోని ‘సముద్రం’ స్థితిని వర్ణిస్తోంది. తెలుగు కథన సందర్భంలో ‘నిలిచి ఉంది’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בָּקָר
  choice: ఎద్దులు
  rationale: ఆలయపు తొట్టికి ఆధారంగా చేసిన పన్నెండు పశు ప్రతిమలను సూచించే సందర్భంలో ‘ఎద్దులు’ సహజమైన, నిర్దిష్టమైన పదం.
- source_word: פֹנִים
  choice: వైపు తిరిగి ఉన్నాయి
  rationale: అక్షరార్థంగా ‘ముఖాలు’ అయినా, ఇక్కడ నాలుగు దిక్కులవైపు వాటి అమరికను సూచిస్తుంది.
- source_word: יָמָּה
  choice: పడమర వైపు
  rationale: అక్షరార్థంగా ‘సముద్రం వైపు’ అయిన ఈ దిశారూపం బైబిలు హీబ్రూలో సాధారణంగా పడమరను సూచిస్తుంది; నాలుగు దిక్కుల జాబితాలో అదే ఉద్దేశం.
- source_word: הַיָּם
  choice: ఆ ‘సముద్రం’
  rationale: ఇది ఆలయంలోని పెద్ద పోతపోసిన తొట్టికి ఉపయోగించిన ప్రత్యేక నామం. ఉద్ధరణ చిహ్నాలు సాధారణ సముద్రం కాదని పాఠకునికి తెలియజేస్తూ మూలంలోని రూపక నామాన్ని నిలుపుతాయి.
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: వాటి పైన ఉంది
  rationale: మూలం సముద్రం ఎద్దులపై ఉన్నదని నేరుగా చెబుతుంది; ‘పెట్టబడింది’ వంటి మూలంలో లేని క్రియను చేర్చలేదు.
- source_word: אֲחֹרֵיהֶם
  choice: వాటి వెనుక భాగాలన్నీ
  rationale: పశు ప్రతిమల వెనుక భాగాలను గౌరవప్రదంగా, శరీర నిర్మాణపరంగా స్పష్టంగా సూచిస్తుంది.
- source_word: בָּיְתָה
  choice: లోపలి వైపు
  rationale: దిశను సూచించే ఈ రూపం మధ్యభాగం వైపు, అంటే లోపలివైపు, అమరికను తెలియజేస్తుంది.
