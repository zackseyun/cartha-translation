translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే నిర్మాణ వర్ణనను వాడాం. క్లిష్టమైన హీబ్రూ స్థలసంబంధ పదబంధాన్ని ప్రధాన పాఠంలో సహజంగా ఇచ్చి, దాని నిజమైన అనిశ్చితిని పాదసూచికలో నిలిపాం.
