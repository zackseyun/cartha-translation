  to: అతడు నివసించడానికి ఉద్దేశించిన అతని ఇల్లు, సభామందిరానికి వెనుకవైపున ఉన్న ఇతర ప్రాంగణంలో[a] ఉన్నది; అది అదే పనితనంతో నిర్మించబడింది. సొలొమోను వివాహం చేసుకున్న[b] ఫరో కుమార్తె కోసం కూడా ఈ సభామందిరంలాంటి ఒక ఇంటిని కట్టించాడు.
  rationale: ‘రెండవ’ అనే అనవసర సంఖ్యాక్రమ నిర్దిష్టతను తొలగించి, హీబ్రూ ‘ఇతర’ అనే భావాన్ని నిలిపాం. నివాసానికి ఉద్దేశించిన భావాన్ని మరింత సహజంగా వ్యక్తపరచి, మొదటి వాక్య నిర్మాణాన్ని స్పష్టం చేశాం. స్థలసంబంధ పదబంధం వివాదాస్పదతను పాదసూచికలో యథాతథంగా ఉంచాం.
