id: 1KI.7.8
reference: 1 Kings 7:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בֵית/וֹ֩ אֲשֶׁר יֵ֨שֶׁב שָׁ֜ם חָצֵ֣ר הָ/אַחֶ֗רֶת מִ/בֵּית֙ לָֽ/אוּלָ֔ם כַּ/מַּֽעֲשֶׂ֥ה הַ/זֶּ֖ה הָיָ֑ה וּ/בַ֜יִת יַעֲשֶׂ֤ה לְ/בַת פַּרְעֹה֙ אֲשֶׁ֣ר לָקַ֣ח שְׁלֹמֹ֔ה כָּ/אוּלָ֖ם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/008.yaml
  text: His house where he was to live[a], in the other court farther back from the Hall, was of the same workmanship. He also made a house like this Hall for Pharaoh’s daughter[b], whom Solomon had taken as wife.
translation:
  language: te
  text: అతడు నివసించడానికి ఉద్దేశించిన అతని ఇల్లు, సభామందిరానికి వెనుకవైపున ఉన్న ఇతర ప్రాంగణంలో[a] ఉన్నది; అది అదే పనితనంతో నిర్మించబడింది. సొలొమోను వివాహం చేసుకున్న[b] ఫరో కుమార్తె కోసం కూడా ఈ సభామందిరంలాంటి ఒక ఇంటిని కట్టించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సభామందిరం నుంచి లోపలివైపున ఉన్న మరొక ప్రాంగణంలో.” ఈ హీబ్రూ స్థలసంబంధ పదబంధం అర్థనిర్ణయం కష్టమైనది; సభామందిరంతో పోలిస్తే నివాసం ఎక్కడ ఉండేదో అనువాదాలు భిన్నంగా వివరిస్తాయి.
    reason: alternative_reading
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “సొలొమోను తీసుకున్న”; అంటే, భార్యగా స్వీకరించిన.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵיתוֹ
  choice: అతని ఇల్లు
  rationale: ప్రత్యయంతో ఉన్న నామవాచకం సొలొమోను నివాసాన్ని సూచిస్తుంది. ఆరంభంలోని సంధికారకాన్ని తెలుగు వాక్యప్రవాహంలో వేరుగా అనువదించాల్సిన అవసరం లేదు.
- source_word: אֲשֶׁר יֵשֶׁב שָׁם
  choice: అతడు నివసించాల్సిన
  rationale: יָשַׁב అంటే ‘కూర్చుండు/నివసించు.’ భవన వివరణలో ఇది ఆ ఇంటి ఉద్దేశిత నివాస వినియోగాన్ని సూచిస్తుంది.
- source_word: חָצֵר הָאַחֶרֶת
  choice: రెండవ ప్రాంగణం
  rationale: חָצֵר అంటే ప్రాంగణం. నిర్దిష్ట ఉపపదంతో ఉన్న ‘మరొకటి’ ఇక్కడ రాజభవన సముదాయంలోని వేరొక నిర్దిష్ట ప్రాంగణాన్ని సూచిస్తుంది; తెలుగులో ‘రెండవ ప్రాంగణం’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: מִבֵּית לָאוּלָם
  choice: సభామందిరానికి వెనుకగా
  rationale: ఇది అర్థనిర్ణయం కష్టమైన స్థలసంబంధ పదబంధం. నివాసం సభామందిరం నుండి లోపలికి లేదా దాని వెనుకవైపు ఉన్నదనే సాధారణ నిర్మాణ అవగాహనను ఈ అనువాదం సులభంగా తెలియజేస్తుంది; భిన్న పఠనాన్ని పాదసూచికలో ఉంచాం.
- source_word: כַּמַּעֲשֶׂה הַזֶּה הָיָה
  choice: అదే పనితనంతో నిర్మించబడింది
  rationale: מַעֲשֶׂה ఇక్కడ పని లేదా కార్యం కన్నా నిర్మాణ పనితనాన్ని సూచిస్తుంది. ఉపమానపూర్వకం మునుపు వర్ణించిన నిర్మాణంతో పోలికను తెలియజేస్తుంది.
- source_word: וּבַיִת יַעֲשֶׂה
  choice: ఒక ఇంటిని కట్టించాడు
  rationale: ఈ నిర్మాణ సంగ్రహంలో అసంపూర్ణ క్రియారూపం గతకాల వర్ణనను కొనసాగిస్తుంది. రాజు నిర్మాణాన్ని జరిపించిన భావానికి ‘కట్టించాడు’ సహజమైన తెలుగు.
- source_word: לְבַת פַּרְעֹה
  choice: ఫరో కుమార్తె కోసం
  rationale: ఇది నేరుగా ఉన్న సమాస సంబంధం; ఆధునిక తెలుగులో సహజంగా అనువదించబడింది.
- source_word: אֲשֶׁר לָקַח שְׁלֹמֹה
  choice: సొలొమోను వివాహం చేసుకున్న
  rationale: స్త్రీని కర్మగా తీసుకున్నప్పుడు לָקַח సాధారణంగా వివాహం చేసుకోవడాన్ని సూచిస్తుంది. తెలుగు పాఠకులకు ఉద్దేశిత అర్థాన్ని స్పష్టంగా, సహజంగా తెలిపే రూపం ఇది.
- source_word: כָּאוּלָם הַזֶּה
  choice: ఈ సభామందిరంలాంటి
  rationale: אוּלָם ఇక్కడ రాజప్రాసాద సముదాయంలోని విశాలమైన మండపం లేదా సభామందిరాన్ని సూచిస్తుంది. పోలికను తెలుగు సమాసరూపం సహజంగా వ్యక్తం చేస్తుంది.
