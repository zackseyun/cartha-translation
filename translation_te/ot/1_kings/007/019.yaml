  text: And the capitals that were on the tops of the pillars were made like a lily blossom in the portico[c][b][a], four cubits.
translation:
  language: te
  text: స్తంభాల పైభాగాలపై ఉన్న కిరీటాలు ముఖమంటపంలో[a] లిల్లీ పువ్వు ఆకారంలో[b] చేయబడ్డాయి; వాటి కొలత నాలుగు మూరలు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రవేశ మంటపంలో’ లేదా ‘ముఖద్వారపు మండపంలో.’ హీబ్రూ పదం ఆలయ నిర్మాణంలోని ప్రవేశ మండపాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘లిల్లీ పువ్వుల పనితో.’ ఈ పదం ఇక్కడ తామరపువ్వు వంటి పుష్పాకార నమూనాను సూచిస్తుందని కొందరు భావిస్తారు.
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో కేవలం ‘నాలుగు మూరలు’ అని ఉంది. ఈ కొలత శీర్షాల లిల్లీ పువ్వు ఆకార భాగపు ఎత్తును సూచిస్తుండవచ్చు.
    reason: lexical_alternative
