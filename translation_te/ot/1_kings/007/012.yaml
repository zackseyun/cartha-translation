  source_fidelity: మూల హీబ్రూలోని నిర్మాణవివరణను ముసాయిదా బాగా ప్రతిబింబిస్తుంది. అయితే יהוהకు ఇచ్చిన ప్రాజెక్టు నిర్ణయం ప్రకారం వ్యక్తినామ రూపమైన “యాహ్వే” వాడాలి; “యెహోవా” ఆ నిర్ణయంతో సరిపోలదు. చివరి లామెద్-వాక్యభాగం పోలిక/సంబంధం అనే వ్యాకరణ సందిగ్ధతను కాపాడుతూ, తెలుగులో పోలికను స్పష్టంగా ఉంచడం సముచితం.
