  yaml_path: translation/ot/1_kings/007/012.yaml
  text: And the great court all around had three rows of cut stone and a row of cedar beams[c][b][a], like the inner court of the house of Yahweh and the vestibule of the house.
translation:
  language: te
  text: ఆ పెద్ద ప్రాంగణానికి చుట్టూ చెక్కి మలచిన రాళ్ల మూడు వరుసలు, దేవదారు దూలాల ఒక వరుస ఉన్నాయి; యాహ్వే మందిరపు లోపలి ప్రాంగణానికీ, మందిరపు ప్రవేశ మండపానికీ అలాగే ఉన్నాయి.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “యాహ్వే మందిరపు లోపలి ప్రాంగణానికి, మందిరపు ప్రవేశ మండపానికి కూడా.” హీబ్రూ ఉపసర్గను పోలికగా గానీ సంబంధాన్ని సూచించేదిగా గానీ అర్థం చేసుకోవచ్చు.'
    reason: alternative_reading
  - marker: b
    text: “చెక్కి మలచిన రాళ్ల మూడు వరుసలు, దేవదారు దూలాల ఒక వరుస”ను “చెక్కి మలచిన రాళ్లతో మూడు పొరలు, దేవదారు దూలాలతో ఒక పొర” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అంటే, మందిర భవనంలోని ప్రవేశ హాలు.
    reason: cultural_note
lexical_decisions:
- source_word: חָצֵר הַגְּדוֹלָה
  choice: పెద్ద ప్రాంగణం
  rationale: చుట్టూ ఆవరించబడిన ఆవరణను సూచించే חָצֵרకు ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాస్తుశిల్ప పదం.
- source_word: סָבִיב
  choice: చుట్టూ
  rationale: నిర్మాణం అన్ని వైపులా కొనసాగిందనే స్థలార్థాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: שְׁלֹשָׁה טוּרִים גָּזִית
  choice: మూడు వరుసల చెక్కిన రాళ్లు
  rationale: నిర్మాణ సందర్భంలో טוּרִים రాతి వరుసలను సూచిస్తుంది; גָּזִית పని చేసి ఆకారమిచ్చిన రాయిని సూచిస్తుంది.
- source_word: וְטוּר כְּרֻתֹת אֲרָזִים
  choice: ఒక వరుస దేవదారు దూలాలు
  rationale: כְּרֻתֹת అక్షరార్థంగా కోసిన వస్తువులు; ఈ నిర్మాణ సందర్భంలో దేవదారు కలప దూలాలు సహజమైన అర్థం.
- source_word: וְלַחֲצַר בֵּית יְהוָה הַפְּנִימִית וּלְאֻלָם הַבָּיִת
  choice: యెహోవా మందిరపు లోపలి ప్రాంగణం, మందిరపు ప్రవేశ మండపం కూడా అలాగే నిర్మించబడ్డాయి
  rationale: లామెద్ ఉపసర్గను ఇక్కడ సాదృశ్యాన్ని సూచించేదిగా తీసుకొని, హీబ్రూ వాక్యంలోని సంక్షిప్త పోలికను తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేసింది.
- source_word: אֻלָם
  choice: ప్రవేశ మండపం
  rationale: ప్రధాన భవనానికి ముందున్న ప్రవేశ హాలు లేదా మండపాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַבָּיִת
  choice: మందిరం
  rationale: ఈ సందర్భంలో בַּיִת సాధారణ గృహం కాక దేవాలయ ప్రధాన భవనాన్ని సూచిస్తున్నందున సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుగా మార్చకుండా తెలుగులో విస్తృతంగా గుర్తించబడే రూపంలో ఉంచింది.
- issue: ל ఉపసర్గల వాక్యసంబంధం
  choice: పోలికగా—‘కూడా అలాగే నిర్మించబడ్డాయి’
  alternative: సంబంధార్థంగా—‘లోపలి ప్రాంగణానికి, ప్రవేశ మండపానికి’
  rationale: సందర్భంలో ఈ నిర్మాణ పద్ధతి మందిరపు లోపలి ప్రాంగణం, ప్రవేశ మండపానికి కూడా వర్తించిందనే పోలిక సుసంభవం; అయితే హీబ్రూ ఉపసర్గ సంబంధార్థాన్నీ అనుమతిస్తుంది కాబట్టి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన వాస్తుశిల్ప పదజాలం ఉపయోగించబడింది. మూలంలోని నిర్మాణ పోలికను సహజ తెలుగు వాక్యంగా విప్పి చెప్పినా, ఉపసర్గలోని నిజమైన సందిగ్ధతను పాదటిప్పణిలో భద్రపరిచింది.
