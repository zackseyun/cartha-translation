  register: ఆధునిక ప్రామాణిక తెలుగులో, నిర్మాణ మరియు శిల్పకళా సందర్భానికి తగిన గౌరవప్రదమైన సాధారణ పదజాలం వాడబడింది. కఠినమైన హెబ్రీ పదబంధం ప్రధాన పాఠ్యంలో సహజంగా అనువదించబడి, దాని అనిశ్చితి పాదసూచికలో నిలుపబడింది.
