  text: On the panels of its supports and on its frames he engraved cherubim[a], lions, and palm trees, according to the space on each[b], with wreaths all around.
translation:
  language: te
  text: దాని ఆధారాల పలకల మీదా దాని చట్రాల మీదా అతడు కెరూబులను, సింహాలను, ఖర్జూర చెట్లను, వాటి చుట్టూ అలంకార దండలను చెక్కాడు—ప్రతిదానికి ఉన్న స్థలం మేరకు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రతి ఆకృతికి చోటు ఉన్న మేరకు.’ ఈ హెబ్రీ పదబంధం అర్థం కష్టం; అందుబాటులో ఉన్న స్థలాన్ని బట్టి చెక్కిన ఆకృతుల అమరికను ఇది సూచిస్తుండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అలంకార తోరణాలు.’ ఈ హెబ్రీ పదం ఆకృతుల చుట్టూ ఉన్న దండలవంటి అలంకరణను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְפַתַּח
  choice: చెక్కాడు
  rationale: అలంకార ఆకృతులను ఉపరితలంపై చెక్కే శిల్పకార్యాన్ని ఈ సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: הַלֻּחֹת יְדֹתֶיהָ
  choice: దాని ఆధారాల పలకలు
  rationale: ఇక్కడ לֻחוֹת అనేది పలకలను, יָדוֹת అక్షరార్థమైన ‘చేతులు’ కాక నిర్మాణంలోని ఆధార భాగాలను సూచిస్తున్నట్లు సందర్భం తెలియజేస్తుంది.
- source_word: מַסְגְּרֹתֶיהָ
  choice: దాని చట్రాలు
  rationale: బండికి చెందిన ఆకృతులను చుట్టి ఉంచే నిర్మాణాత్మక అంచులు లేదా ఫ్రేములను సూచిస్తుంది.
- source_word: כְּרוּבִים
  choice: కెరూబులు
  rationale: దేవాలయ అలంకరణలో కనిపించే ప్రత్యేక పరలోక జీవులకు ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణను నిలుపుతుంది.
- source_word: אֲרָיוֹת
  choice: సింహాలు
  rationale: చెక్కిన జంతు ఆకృతులను నేరుగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: תִמֹרֹת
  choice: ఖర్జూర చెట్లు
  rationale: దేవాలయ అలంకరణలోని ఖర్జూర చెట్టు ఆకృతులను ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: כְּמַעַר אִישׁ
  choice: ఒక్కోదానికి లభించిన స్థలానికి తగినట్లుగా
  rationale: కఠినమైన హెబ్రీ పదబంధంలోని పంపిణీ భావాన్ని, అందుబాటులో ఉన్న స్థలానికి అనుగుణంగా ఆకృతులు అమర్చబడ్డాయనే సాధ్యమైన అర్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לֹיֹת
  choice: అలంకార దండలు
  rationale: ఆకృతుల చుట్టూ ఉన్న దండలు లేదా తోరణాలవంటి అలంకరణను సూచిస్తుంది; పదంలోని అనిశ్చితిని అతిగా నిర్దిష్టం చేయదు.
- source_word: סָבִיב
  choice: చుట్టూ
  rationale: అలంకారాలు ఆకృతులను పరివేష్టించి ఉన్న అమరికను సహజంగా తెలియజేస్తుంది.
