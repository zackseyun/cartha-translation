  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని క్లిష్టమైన నిర్మాణ సంబంధాన్ని అతిగా సరిచేయకుండా రెండు చిన్న వాక్యాలుగా విభజించాం; ‘దానిమ్మలు’ అనే అక్షరార్థాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అలంకారార్థాన్ని పాదసూచికలో వివరించాం.
