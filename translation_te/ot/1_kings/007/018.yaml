  text: וַ/יַּ֖עַשׂ אֶת הָ/עַמּוּדִ֑ים וּ/שְׁנֵי֩ טוּרִ֨ים סָבִ֜יב עַל הַ/שְּׂבָכָ֣ה הָ/אֶחָ֗ת לְ/כַסּ֤וֹת אֶת הַ/כֹּֽתָרֹת֙ אֲשֶׁר֙ עַל רֹ֣אשׁ הָֽ/רִמֹּנִ֔ים וְ/כֵ֣ן עָשָׂ֔ה לַ/כֹּתֶ֖רֶת הַ/שֵּׁנִֽית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/018.yaml
  text: He made the pillars[a], and two rows all around on the one latticework, to cover the capitals that were on top of the pomegranates[b]; and so he did for the second capital.
translation:
  language: te
  text: అతడు స్తంభాలను చేశాడు; ఒక జాలకపు పనిమీద చుట్టూ రెండు వరుసలను, దానిమ్మల పైన ఉన్న స్తంభశీర్షాలను కప్పడానికి, చేశాడు[a]. రెండవ స్తంభశీర్షానికీ అలాగే చేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘రెండు వరుసలు’ అని మాత్రమే ఉంది. ఇవి దానిమ్మ ఆకారపు అలంకారాల వరుసలు కావచ్చని భావించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఈ వాక్యంలోని హీబ్రూ నిర్మాణం క్లిష్టంగా ఉంది. కొందరు ఈ వరుసలు ప్రతి స్తంభశీర్షపు జాలకపు పని చుట్టూ ఉన్న దానిమ్మ అలంకారాలకు చెందినవిగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేశాడు / అమర్చాడు
  rationale: עשה అనే సాధారణ క్రియకు మొదటి సందర్భంలో నేరుగా ‘చేశాడు’ అని అనువదించాం. అలంకార వరుసల సందర్భంలో వాటి స్థానబద్ధ ఏర్పాటును సహజమైన తెలుగులో తెలియజేయడానికి ‘అమర్చాడు’ వాడాం.
- source_word: הָעַמּוּדִים
  choice: స్తంభాలను
  rationale: నిర్మాణ సందర్భంలో עַמּוּדִיםకు సాధారణమైన, స్పష్టమైన తెలుగు పదం ‘స్తంభాలు’.
- source_word: שְׁנֵי טוּרִים
  choice: రెండు వరుసలను
  rationale: טוּר అనేది క్రమంగా అమర్చిన వరుసను సూచిస్తుంది; అలంకార నిర్మాణ సందర్భానికి ‘రెండు వరుసలు’ సరిపోతుంది.
- source_word: סָבִיב
  choice: చుట్టూ
  rationale: నిర్మాణాన్ని పరివేష్టించి ఉన్న అమరికను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: הַשְּׂבָכָה
  choice: జాలరి పని
  rationale: వలలాంటి అలంకార నిర్మాణాన్ని సూచించే ఈ పదానికి ‘జాలరి పని’ సాధారణ పాఠకులకు అర్థమయ్యే నిర్మాణపరమైన పదబంధం.
- source_word: לְכַסּוֹת
  choice: కప్పేలా
  rationale: హీబ్రూ ఉద్దేశార్థక క్రియారూపాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తూ, వరుసల ప్రయోజనాన్ని సూచిస్తుంది.
- source_word: הַכֹּתָרֹת / לַכֹּתֶרֶת
  choice: స్తంభశీర్షాలను / స్తంభశీర్షానికి
  rationale: నిర్మాణ సందర్భంలో כֹּתֶרֶת స్తంభం పైభాగంలోని అలంకార శీర్షాన్ని సూచిస్తుంది; ‘స్తంభశీర్షం’ ఖచ్చితమైనదీ స్పష్టమైనదీ.
- source_word: הָרִמֹּנִים
  choice: దానిమ్మల
  rationale: హీబ్రూలో అక్షరార్థంగా ‘దానిమ్మలు’ ఉంది. ఇవి దానిమ్మ ఆకారపు అలంకారాలు కావచ్చన్న భావాన్ని పాదసూచికలో తెలిపి, ప్రధాన పాఠ్యంలో మూలరూపాన్ని నిలిపాం.
- source_word: וְכֵן עָשָׂה
  choice: కూడా అలాగే చేశాడు
  rationale: అదే పనిని రెండవ నిర్మాణ భాగానికీ పునరావృతం చేసిన భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
