id: 1KI.7.14
reference: 1 Kings 7:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בֶּן אִשָּׁה֩ אַלְמָנָ֨ה ה֜וּא מִ/מַּטֵּ֣ה נַפְתָּלִ֗י וְ/אָבִ֣י/ו אִישׁ צֹרִי֮ חֹרֵ֣שׁ נְחֹשֶׁת֒ וַ֠/יִּמָּלֵא אֶת הַ/חָכְמָ֤ה וְ/אֶת הַ/תְּבוּנָה֙ וְ/אֶת הַ/דַּ֔עַת לַ/עֲשׂ֥וֹת כָּל מְלָאכָ֖ה בַּ/נְּחֹ֑שֶׁת וַ/יָּבוֹא֙ אֶל הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה וַ/יַּ֖עַשׂ אֶת כָּל מְלַאכְתּֽ/וֹ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/014.yaml
  text: He was the son of a widow from the tribe of Naphtali[a], and his father was a man of Tyre, a worker in bronze. He was filled with wisdom, understanding, and knowledge to do every kind of work in bronze[b]. So he came to King Solomon and did all his work.
translation:
  language: te
  text: అతడు నఫ్తాలి గోత్రానికి చెందిన ఒక విధవరాలి కుమారుడు. అతని తండ్రి తూరు పట్టణానికి చెందినవాడు, కంచు పనివాడు.[a] కంచుతో అన్ని రకాల పనులు చేయగల జ్ఞానం, వివేచన, పరిజ్ఞానంతో అతడు నింపబడ్డాడు. అతడు సొలొమోను రాజు వద్దకు వచ్చి, తన పనంతా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ ‘నెహోషెత్’ అనే పదం రాగిని లేదా కంచును సూచించవచ్చు; ఇక్కడ ఆలయ సామగ్రి సందర్భాన్ని బట్టి ‘కంచు’ అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אִשָּׁה אַלְמָנָה
  choice: ఒక విధవరాలి కుమారుడు
  rationale: హీబ్రూ నిర్మాణం అతని తల్లి విధవరాలని ప్రత్యేకంగా తెలియజేస్తుంది; ఈ రూపం ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: מִמַּטֵּה נַפְתָּלִי
  choice: నఫ్తాలి గోత్రానికి చెందిన
  rationale: వంశీయ సందర్భంలో מַטֶּה అంటే గోత్రం; ‘చెందిన’ మూలం సూచించే అనుబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אִישׁ צֹרִי
  choice: తూరు పట్టణానికి చెందినవాడు
  rationale: צֹרִי అనేది తూరుకు చెందిన వ్యక్తిని సూచించే జాతివాచకం; తెలుగు పాఠకులకు స్థల సంబంధాన్ని స్పష్టంగా చూపడానికి ఈ రూపం ఎంచుకున్నాం.
- source_word: חֹרֵשׁ נְחֹשֶׁת
  choice: కంచు పనివాడు
  rationale: חֹרֵשׁ నైపుణ్యంతో పనిచేసే వృత్తికారుణ్ణి సూచిస్తుంది. ఆలయ సామగ్రి సందర్భంలో נְחֹשֶׁתకు ‘కంచు’ అనేది తగిన భావం.
- source_word: וַיִּמָּלֵא
  choice: నింపబడ్డాడు
  rationale: నిఫాల్ క్రియారూపంలోని కర్మణి భావాన్ని నిలుపుతూ, ఈ సామర్థ్యాలు అతనికి అనుగ్రహించబడ్డాయనే భావాన్ని అతిగా వివరణ చేయకుండా వ్యక్తం చేస్తుంది.
- source_word: הַחָכְמָה וְהַתְּבוּנָה וְהַדַּעַת
  choice: జ్ఞానం, వివేచన, నైపుణ్యాలు
  rationale: ఈ సందర్భంలో పదత్రయం శిల్పపనికి అవసరమైన ప్రాయోగిక జ్ఞానం, అవగాహన, నేర్పును సూచిస్తుంది; సహజమైన తెలుగులో వాటి సమిష్టి భావాన్ని తెలియజేస్తుంది.
- source_word: לַעֲשׂוֹת כָּל מְלָאכָה בַּנְּחֹשֶׁת
  choice: కంచుతో అన్ని రకాల పనులు చేయడానికి
  rationale: כָּל מְלָאכָה యొక్క విస్తృత పరిధినీ, בַּנְּחֹשֶׁת సూచించే పదార్థాన్నీ స్పష్టంగా ఉంచుతుంది.
- source_word: וַיָּבוֹא אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: అతడు సొలొమోను రాజు దగ్గరికి వచ్చి
  rationale: కథన క్రమాన్ని సహజమైన తెలుగు సంధానంతో వ్యక్తం చేస్తుంది.
- source_word: וַיַּעַשׂ אֶת כָּל מְלַאכְתּוֹ
  choice: తన పనంతా చేశాడు
  rationale: ప్రత్యయాన్ని హీరాము పనికి సంబంధించినదిగా తీసుకుంటూ, ‘పూర్తిచేశాడు’ లేదా ‘అప్పగించిన’ వంటి మూలంలో స్పష్టంగా లేని భావాలను చేర్చదు.
theological_decisions:
- issue: וַיִּמָּלֵאలో సామర్థ్యాల మూలం
  choice: ‘నింపబడ్డాడు’ అనే కర్మణి రూపాన్ని నిలుపుకున్నాం
  alternative: ‘అతనికి ... సమృద్ధిగా ఉన్నాయి’ లేదా దేవుణ్ణి స్పష్టమైన కర్తగా చేర్చడం
  rationale: హీబ్రూ కర్మణి రూపం కర్తను చెప్పదు. దేవుడే నింపాడని పాఠకుడు సందర్భానుసారం గ్రహించవచ్చు, కానీ అనువాదంలో మూలంలో లేని స్పష్టమైన కర్తను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే చారిత్రక కథనానికి తగిన గౌరవప్రదమైన శైలి. వ్యక్తి పేరు ఈ వచనంలో లేకపోవడం వల్ల చేర్చలేదు; హీబ్రూ కర్మణి రూపం మరియు చివరి ప్రత్యయపు స్వల్ప అస్పష్టతను అతిగా విప్పకుండా ఉంచాం.
