  language: te
  text: అప్పుడు సొలొమోను రాజు మనుషులను పంపి, తూరు నుండి హీరామును రప్పించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקַּח
  choice: మనుషులను పంపి ... రప్పించాడు
  rationale: ‘పంపి తీసుకున్నాడు’ అనే యథాతథ రూపం తెలుగులో అసహజంగా ఉండవచ్చు. రాజు పంపినవారి ద్వారా హీరామును తూరు నుండి తన వద్దకు రప్పించాడనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; క్రియలోని causative sense సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: מִצֹּר
  choice: తూరు నుండి
  rationale: צֹר అనే స్థలనామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న ‘తూరు’ రూపాన్ని ఉపయోగించి, מִן ఉపసర్గను ‘నుండి’గా అనువదించాం.
- source_word: אֶת חִירָם
  choice: హీరామును
  rationale: వ్యక్తినామాన్ని సాధారణ తెలుగు బైబిలు రూపంలో ఉంచి, ప్రత్యక్ష కర్మను ‘-ను’తో సూచించాం.
