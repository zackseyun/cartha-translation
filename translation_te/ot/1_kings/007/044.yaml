  text: and the one Sea[a], and the twelve oxen under the Sea;
translation:
  language: te
  text: మరియు ఆ ఒక్క సముద్రాన్ని, సముద్రం కిందనున్న పన్నెండు ఎద్దులను;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַיָּם
  choice: సముద్రం
  rationale: ఆలయ సామగ్రి సందర్భంలో ఇది పోతపోసిన పెద్ద నీటి తొట్టెకు వాడిన ప్రత్యేక పేరు. మూలంలోని రూపకపూర్వక నామాన్ని నిలుపుతూ గుర్తింపుకోసం ‘సముద్రం’ అని అనువదించాం.
- source_word: הָאֶחָד
  choice: ఆ ఒక్క
  rationale: నిర్దిష్టతను, చుట్టుపక్కల పేర్కొన్న అనేక సామగ్రికి భిన్నంగా ఇది ఒక్కటేనన్న లెక్కింపు భావాన్ని నిలుపుతుంది.
- source_word: הַבָּקָר
  choice: ఎద్దులు
  rationale: ఈ నిర్మాణ సందర్భంలో సముద్రాన్ని మోసే గోవు ఆకారపు ప్రతిమలను సూచిస్తుంది; సహజమైన, నిర్దిష్టమైన తెలుగు పదంగా ‘ఎద్దులు’ ఎంచుకున్నాం.
- source_word: שְׁנֵים עָשָׂר
  choice: పన్నెండు
  rationale: మూలంలోని సంఖ్యను నేరుగా అనువదిస్తుంది.
- source_word: תַּחַת
  choice: కింద ఉన్న
  rationale: ఎద్దులు సముద్రానికి దిగువన ఉన్న భౌతిక స్థానాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְאֶת
  choice: మరియు
  rationale: ప్రత్యక్ష కర్మ సూచికకు తెలుగులో ప్రత్యేక పదం అవసరం లేదు; దానితో కూడిన సంధాయకాన్ని జాబితా కొనసాగింపుగా ‘మరియు’ అని చూపించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆలయ సామగ్రి జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలి. వాక్యం విస్తృత జాబితాలో భాగమైనందున మొదటి ‘మరియు’, చివరి విరామచిహ్నంగా సెమికోలన్ నిలుపబడ్డాయి.
