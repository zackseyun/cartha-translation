id: 1KI.7.11
reference: 1 Kings 7:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִ/לְ/מַ֗עְלָ/ה אֲבָנִ֧ים יְקָר֛וֹת כְּ/מִדּ֥וֹת גָּזִ֖ית וָ/אָֽרֶז׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/011.yaml
  text: And above were costly stones[a], cut according to measure, and cedar.
translation:
  language: te
  text: పైభాగంలో కొలతల ప్రకారం చెక్కిన విలువైన రాళ్లు[a], దేవదారు కలప ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చెక్కిన రాయి కొలతల ప్రకారం.’
    reason: כְּמִדּוֹת גָּזִית అనే పదబంధాన్ని ప్రధాన పాఠంలో ‘కొలతల ప్రకారం చెక్కిన’ అని క్రియాత్మకంగా అనువదించవచ్చు. మరో సాధ్యమైన పఠనంలో అది ‘చెక్కిన రాయి కొలతల ప్రకారం’ అని, గాజీత్‌ను కొలతలకు సంబంధించిన నామవాచకంగా తీసుకుంటుంది.
lexical_decisions:
- source_word: וּמִלְמַעְלָה
  choice: పైభాగంలో
  rationale: నిర్మాణ వర్ణనలో ఈ సమాస పూర్వప్రత్యయ రూపం పునాది వరుసల పైన ఉన్న భాగాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘పైభాగంలో’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: אֲבָנִים יְקָרוֹת
  choice: విలువైన రాళ్లు
  rationale: יְקָרוֹת ఇక్కడ రత్నాలను కాకుండా ఖరీదైన లేదా శ్రేష్ఠమైన నిర్మాణ రాళ్లను సూచిస్తుంది. ‘విలువైన’ అనే పదం ఆ రెండు భావ ఛాయలనూ అనవసరంగా కుదించకుండా ఉంచుతుంది.
- source_word: כְּמִדּוֹת גָּזִית
  choice: కొలతలకు తగినట్లు చెక్కిన
  rationale: כְּמִדּוֹת అనే పదబంధంలోని ‘కొలతల ప్రకారం’ అనే భావాన్నీ, גָּזִית లోని చెక్కి సిద్ధం చేసిన రాయి అనే భావాన్నీ సహజమైన తెలుగు నిర్మాణ పదబంధంగా కలిపింది. హెబ్రీ పదబంధ నిర్మాణానికి మరింత అక్షరార్థమైన పఠనాన్ని పాదసూచికలో ఉంచింది.
- source_word: וָאָרֶז
  choice: దేవదారు కలప
  rationale: אָרֶז అంటే దేవదారు; నిర్మాణ సందర్భంలో తెలుగులో పదార్థం స్పష్టంగా ఉండేందుకు ‘కలప’ను సహజంగా చేర్చింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన నిర్మాణ వర్ణన. మూలంలోని సంక్షిప్త జాబితా శైలిని నిలుపుతూ, తెలుగులో వాక్యం పూర్తిగా ఉండేందుకు చివర ‘ఉన్నాయి’ చేర్చబడింది.
