  yaml_path: translation/ot/1_kings/007/021.yaml
  text: He set up the pillars at the portico of the temple[a]. He set up the right pillar and called its name Jachin; then he set up the left pillar and called its name Boaz.
translation:
  language: te
  text: అతడు దేవాలయ మంటపం వద్ద ఆ స్తంభాలను నిలబెట్టాడు.[a] కుడివైపు స్తంభాన్ని నిలబెట్టి దానికి యాకీను అని పేరు పెట్టాడు; ఎడమవైపు స్తంభాన్ని నిలబెట్టి దానికి బోయజు అని పేరు పెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యాకీను,’ ‘బోయజు’ అనేవి స్తంభాలకు పెట్టిన హీబ్రూ పేర్ల లిప్యంతరీకరణలు; వాటికి ఉండగల అర్థాల అనువాదాలు కావు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: నిలబెట్టాడు
  rationale: హిఫీల్ రూపంలోని קום ఇక్కడ ‘నిలిచేలా చేయడం, స్థాపించడం’ అనే భావాన్ని ఇస్తుంది. స్తంభాలను వాటి స్థానాల్లో నిలిపిన చర్యను ‘నిలబెట్టాడు’ సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: הָעַמֻּדִים
  choice: స్తంభాలను
  rationale: עַמּוּד ఆలయ నిర్మాణ సందర్భంలో స్తంభాన్ని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘స్తంభం’ సహజమైన నిర్మాణ పదం.
- source_word: לְאֻלָם הַהֵיכָל
  choice: దేవాలయపు మంటపం దగ్గర
  rationale: אוּלָם దేవాలయ ముఖభాగంలోని మంటపం లేదా వసారాను సూచిస్తుంది. לְ అనే సంబంధాన్ని సందర్భానుసారం స్థానార్థకంగా తీసుకొని ‘దగ్గర’ అని అనువదించడం, స్తంభాలు మంటపానికి సంబంధించిన స్థానంలో నిలబెట్టబడ్డాయని తెలియజేస్తుంది; ఖచ్చితంగా లోపల అని నిర్ధారించదు.
- source_word: הָעַמּוּד הַיְמָנִי
  choice: కుడివైపు స్తంభాన్ని
  rationale: יְמָנִי అక్షరార్థంగా కుడివైపును సూచిస్తుంది. దిక్సూచకంగా ‘దక్షిణం’ అని వ్యాఖ్యానించకుండా మూలంలోని స్థల సంబంధాన్ని నిలుపుతుంది.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ
  choice: దానికి … అని పేరు పెట్టాడు
  rationale: హీబ్రూ నామకరణ సూత్రం అక్షరార్థంగా ‘దాని పేరును పిలిచాడు.’ తెలుగులో అదే భావాన్ని సహజంగా తెలిపే రూపం ‘దానికి … అని పేరు పెట్టాడు.’
- source_word: יָכִין
  choice: యాకీను
  rationale: ఇది స్తంభానికి పెట్టిన హీబ్రూ పేరు; సాధ్యమైన పదార్థాన్ని అనువదించకుండా తెలుగు లిపిలో ధ్వన్యనుకరణ చేయబడింది.
- source_word: הָעַמּוּד הַשְּׂמָאלִי
  choice: ఎడమవైపు స్తంభాన్ని
  rationale: שְׂמָאלִי అంటే ఎడమవైపు ఉన్నది. ఇది కుడివైపు స్తంభంతో ఉన్న సమాంతర నిర్మాణాన్ని సహజంగా నిలుపుతుంది.
- source_word: בֹּעַז
  choice: బోయజు
  rationale: ఇది స్తంభానికి పెట్టిన హీబ్రూ పేరు; దాని సాధ్యమైన అర్థాన్ని అనువదించకుండా తెలుగు బైబిలు నామరూపానికి అనుగుణంగా ధ్వన్యనుకరణ చేయబడింది.
