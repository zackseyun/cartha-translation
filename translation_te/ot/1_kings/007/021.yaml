  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన వాక్యనిర్మాణం వాడబడింది. పునరావృతమైన וַיָּקֶםకు ప్రతిసారీ ‘నిలబెట్టాడు’ అని ఇచ్చి మూలంలోని సమాంతరతను నిలుపుకున్నాం. పాదసూచిక గుర్తు ప్రధాన వాక్యంలో చేర్చబడింది.
