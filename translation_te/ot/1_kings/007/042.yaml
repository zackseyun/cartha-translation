translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; ఆలయ వాస్తు వివరణకు తగిన గంభీరమైన కానీ సాధారణ పాఠకుడు గ్రహించగల పదజాలం. ఈ వాక్యం మునుపటి జాబితాను కొనసాగించే ఖండవాక్య స్వభావాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
