source:
  edition: WLC
  text: וְ/אֶת הָ/רִמֹּנִ֛ים אַרְבַּ֥ע מֵא֖וֹת לִ/שְׁתֵּ֣י הַ/שְּׂבָכ֑וֹת שְׁנֵֽי טוּרִ֤ים רִמֹּנִים֙ לַ/שְּׂבָכָ֣ה הָֽ/אֶחָ֔ת לְ/כַסּ֗וֹת אֶת שְׁתֵּי֙ גֻּלֹּ֣ת הַ/כֹּֽתָרֹ֔ת אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/עַמּוּדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/042.yaml
  text: and the four hundred pomegranates for the two latticeworks[a], two rows of pomegranates for each latticework[b], to cover the two bowl-shaped capitals that were on the tops of the pillars.
translation:
  language: te
  text: రెండు జాలికల కోసం నాలుగు వందల దానిమ్మపండ్ల అలంకారాలు[a]; ఒక్కొక్క జాలికకు రెండు వరుసల దానిమ్మపండ్ల అలంకారాలు—స్తంభాలపై ఉన్న స్తంభశిరస్సుల రెండు గిన్నెవంటి భాగాలను కప్పడానికి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వలల పని.” హెబ్రీ పదం స్తంభశిరస్సులపై ఉండే అలంకారపు బహిరంగ అల్లికను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “శిరస్సుల రెండు గిన్నెలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמֹּנִים
  choice: దానిమ్మపండ్ల ఆకృతులు
  rationale: మూలపదం నేరుగా దానిమ్మపండ్లను సూచిస్తుంది; ఇక్కడ అవి అలంకార రూపాలు కాబట్టి, ఆధునిక తెలుగు పాఠకునికి సందర్భం స్పష్టమయ్యేలా ‘ఆకృతులు’ చేర్చబడింది.
- source_word: שְׂבָכוֹת
  choice: అల్లిక పనులు
  rationale: కిరీటాలపై ఉన్న వలలాంటి అలంకారపు బహిరంగ పనిని సూచిస్తుంది; ‘అల్లిక పనులు’ సహజమైన తెలుగులో ఆ నిర్మాణ భావాన్ని తెలియజేస్తుంది.
- source_word: טוּרִים
  choice: వరుసలు
  rationale: క్రమంగా అమర్చిన శ్రేణులను సూచించే స్పష్టమైన తెలుగు పదం.
- source_word: לַשְּׂבָכָה הָאֶחָת
  choice: ఒక్కొక్క అల్లిక పనికి
  rationale: అక్షరార్థంగా ‘ఒక అల్లిక పనికి’ అయినా, రెండు అల్లిక పనులలో ప్రతిదానిపై అమరికను తెలిపే విభజనార్థక ప్రయోగం.
- source_word: לְכַסּוֹת
  choice: కప్పడానికి
  rationale: అనంతరూపం ఉద్దేశాన్ని తెలియజేస్తుంది; ‘కప్పడానికి’ దాని నేరమైన భావాన్ని నిలుపుతుంది.
- source_word: גֻּלֹּת הַכֹּתָרֹת
  choice: కిరీటాల ... గిన్నెవంటి భాగాలు
  rationale: గుండ్రని లేదా గిన్నె ఆకారపు నిర్మాణ భాగాలను సూచిస్తుంది; మూలంలోని ‘కిరీటాల గిన్నెలు’ అనే నిర్మాణ సంబంధాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: כֹּתָרֹת
  choice: కిరీటాలు
  rationale: ఇది స్తంభాల పైభాగంలోని అలంకార శీర్షాలను సూచించే వాస్తుశిల్ప పదం; ‘కిరీటాలు’ రూపకాన్ని, సందర్భాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: עַל פְּנֵי הָעַמּוּדִים
  choice: స్తంభాలపై ఉన్న
  rationale: అక్షరార్థంగా ‘స్తంభాల ముఖం/ముందుభాగంపై’; ఈ వాస్తు సందర్భంలో స్తంభాలపై అమర్చబడిన స్థానాన్ని సహజంగా తెలియజేస్తుంది.
