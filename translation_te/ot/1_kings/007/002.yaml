source:
  edition: WLC
  text: וַ/יִּ֜בֶן אֶת בֵּ֣ית יַ֣עַר הַ/לְּבָנ֗וֹן מֵאָ֨ה אַמָּ֤ה אָרְכּ/וֹ֙ וַ/חֲמִשִּׁ֤ים אַמָּה֙ רָחְבּ֔/וֹ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה קוֹמָת֑/וֹ עַ֗ל אַרְבָּעָה֙ טוּרֵי֙ עַמּוּדֵ֣י אֲרָזִ֔ים וּ/כְרֻת֥וֹת אֲרָזִ֖ים עַל הָ/עַמּוּדִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/002.yaml
  text: He built the House of the Forest of Lebanon[a], one hundred cubits long, fifty cubits wide, and thirty cubits high, on four rows of cedar pillars[c][b], with cedar beams on the pillars.
translation:
  language: te
  text: 'అతడు “లెబానోను అరణ్య భవనాన్ని” నిర్మించాడు: అది నూరు మూరల పొడవు, యాభై మూరల వెడల్పు, ముప్పై మూరల ఎత్తు కలిగినది[c]; దేవదారు స్తంభాల నాలుగు వరుసల మీద[a], ఆ స్తంభాల మీద దేవదారు దూలాలతో[b] నిర్మించాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవదారు స్తంభాల నాలుగు వరుసలతో.” ఇక్కడి హెబ్రీ పూర్వప్రత్యయం ఆధారాన్ని (‘మీద’) గానీ అమరికను (‘తో’) గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘దూలాలు’ అని అనువదించిన హెబ్రీ పదానికి అక్షరార్థం దేవదారుతో చేసిన ‘నరికిన భాగాలు’; అది దూలాలు, పైకప్పు కడ్డీలు లేదా మరొక చెక్కిన నిర్మాణ భాగాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: హెబ్రీలో అక్షరార్థంగా, “నూరు మూరలు దాని పొడవు, యాభై మూరలు దాని వెడల్పు, ముప్పై మూరలు దాని ఎత్తు.”
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּבֶן
  choice: అతడు ... నిర్మించాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపే సాధారణ భూతకాల క్రియగా ఉంది; ఆధునిక తెలుగు కథనశైలిలో ప్రారంభ ‘మరియు’ అవసరం లేదు.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: “లెబానోను అరణ్య భవనం”
  rationale: בֵּית అనే ‘ఇల్లు/భవనం’ భావాన్ని నిలుపుతూ, ఇది నిర్మాణానికి ఉన్న పేరని స్పష్టమయ్యే సహజమైన ఆధునిక తెలుగు రూపం ఎంచుకోబడింది. ‘మందిరం’ అన్న పదం కలిగించగల ఆరాధనా స్థల భావాన్ని నివారించాం.
- source_word: מֵאָה אַמָּה אָרְכּוֹ וַחֲמִשִּׁים אַמָּה רָחְבּוֹ וּשְׁלֹשִׁים אַמָּה קוֹמָתוֹ
  choice: దాని పొడవు నూరు మూరలు, వెడల్పు యాభై మూరలు, ఎత్తు ముప్పై మూరలు
  rationale: హెబ్రీలోని సమాంతర కొలతల నిర్మాణాన్ని సహజమైన తెలుగులో నిలిపాం. ప్రాచీన కొలమానమైన אַמָּהకు తెలుగు బైబిలు వాడుకలో పరిచితమైన ‘మూర’ను వాడాం.
- source_word: עַל אַרְבָּעָה טוּרֵי עַמּוּדֵי אֲרָזִים
  choice: దేవదారు స్తంభాల నాలుగు వరుసల మీద
  rationale: טוּרֵי అంటే వరుసలు, עַמּוּדִים అంటే స్తంభాలు. עַל యొక్క ప్రాథమిక స్థలార్థాన్ని ‘మీద’గా నిలిపాం; అది నిర్మాణ ఆధారాన్నో అమరికనో సూచించవచ్చని పాదసూచికలో తెలిపాం.
- source_word: וּכְרֻתוֹת אֲרָזִים
  choice: దేవదారు దూలాలు
  rationale: כְרֻתוֹת అక్షరార్థంగా నరికిన లేదా చెక్కిన దేవదారు భాగాలు. నిర్మాణ సందర్భంలో ‘దూలాలు’ స్పష్టమైన, సహజమైన పదం; అయితే మూలపదం ఖచ్చితమైన నిర్మాణ భాగాన్ని నిర్దేశించదని పాదసూచికలో నిలిపాం.
- source_word: עַל הָעַמּוּדִים
  choice: ఆ స్తంభాల మీద ... అమర్చబడ్డాయి
  rationale: దేవదారు నిర్మాణ భాగాలు స్తంభాలపై ఉన్న స్థల సంబంధాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే నిర్మాణ వర్ణన. ప్రాచీన కొలమానానికి ‘మూర’ను నిలిపి, వాక్య నిర్మాణాన్ని సహజ తెలుగు క్రమంలో ఇచ్చాం. భవనం పేరును ఉల్లేఖన చిహ్నాల్లో ఉంచి అది సాధారణ అరణ్యగృహం కాక ప్రత్యేక నిర్మాణనామమని సూచించాం.
