  terminology: ‘లెబానోను అరణ్య భవనం’ ప్రత్యేక భవననామంగా అనుకూలంగా ఉంది; ‘భవనం’ ఆరాధనా-స్థల భావాన్ని రుద్దదు. אמהకు ‘మూరలు’ మరియు כרתותకు సందర్భోచితమైన ‘దూలాలు’ సరైన ఎంపికలు. כרתות యొక్క ఖచ్చిత నిర్మాణార్థం అనిశ్చితమనే విషయాన్ని పాదసూచిక తగిన విధంగా కాపాడుతుంది.
