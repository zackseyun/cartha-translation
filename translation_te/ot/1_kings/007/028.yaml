translation:
  language: te
  text: 'ఆ పీఠాల నిర్మాణం ఇలా ఉండేది: వాటికి చట్రాలు[a] ఉండేవి; ఆ చట్రాలు అడ్డకమ్మీల[b] మధ్య ఉండేవి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చట్రబద్ధమైన పలకలు’; హీబ్రూ పదం పీఠంలోని చట్రబద్ధమైన విభాగాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి హీబ్రూ పదాన్ని ‘నిలువుకమ్మీలు,’ ‘ఆధారకమ్మీలు,’ లేదా ‘పట్టీలు’ అని కూడా అనువదించవచ్చు; సూచించబడిన నిర్మాణ భాగం ఖచ్చితంగా ఏదో తెలియదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: ఇలా ఉంది
  rationale: వివరణాత్మక నిర్మాణ వివరాన్ని సహజమైన ఆధునిక తెలుగులో ప్రవేశపెడుతుంది; హీబ్రూ సంధాన ప్రవాహాన్ని వాక్య నిర్మాణంలో నిలుపుతుంది.
- source_word: מַעֲשֵׂה
  choice: నిర్మాణం
  rationale: ఇక్కడ సాధారణ ‘పని’కన్నా పీఠం తయారైన విధానాన్ని, నిర్మాణ స్వరూపాన్ని సూచిస్తుంది.
- source_word: הַמְּכוֹנָה
  choice: ఆ పీఠం
  rationale: ఈ సందర్భంలో తొట్టెలను మోసే చక్రాలుగల ఆధార నిర్మాణాన్ని సూచిస్తుంది; ‘పీఠం’ సాధారణ పాఠకులకు స్పష్టమైనది.
- source_word: מִסְגְּרֹת
  choice: చట్రాలు
  rationale: మూలపదం చట్రబద్ధమైన భాగాలను లేదా ఫ్రేములను సూచించవచ్చు. పదాన్ని రెండుసార్లూ ఒకే విధంగా అనువదించడం హీబ్రూ పునరుక్తిని కాపాడుతుంది.
- source_word: לָהֶם
  choice: వాటికి ... ఉండేవి
  rationale: లామెద్‌తో కూడిన బహువచన సర్వనామ ప్రత్యయం స్వామ్యాన్ని సూచిస్తుంది; తెలుగు సహజ ప్రయోగంలో ‘వాటికి ఉండేవి’గా వ్యక్తమవుతుంది.
- source_word: וּמִסְגְּרֹת בֵּין
  choice: ఆ చట్రాలు ... మధ్య ఉండేవి
  rationale: హీబ్రూలోని రెండవ ప్రస్తావనను నిలిపి, దాని స్థాన సంబంధాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַשְׁלַבִּים
  choice: అడ్డకమ్మీలు
  rationale: ఇవి నిర్మాణాన్ని కలిపే సభ్యాలు; ‘అడ్డకమ్మీలు’ ఒక సాధ్యమైన నిర్మాణార్థాన్ని అందిస్తుంది. ఖచ్చిత రూపం అనిశ్చితమైనందున ఇతర అవకాశాలను పాదసూచికలో ఉంచాం.
