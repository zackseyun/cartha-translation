translation:
  language: te
  text: పది ఆధార వేదికలను[a], ఆ ఆధార వేదికల మీద ఉన్న పది గంగాళాలను,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పది ఆధారాలను’; ఇవి చక్రాలుగల ఆధార నిర్మాణాలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: ను,
  rationale: אֵת నిర్దిష్ట ప్రత్యక్ష కర్మను సూచిస్తుంది; తెలుగులో దానికి కర్మవిభక్తి ‘ను’ వాడబడింది. וְ జాబితా కొనసాగింపును సూచిస్తున్నప్పటికీ, సహజమైన తెలుగు జాబితా నిర్మాణంలో కామాతో అది వ్యక్తమవుతుంది.
- source_word: הַ/מְּכֹנוֹת
  choice: ఆధార బండ్లు
  rationale: ఆలయ సామగ్రి సందర్భంలో מְכֹנוֹת అనేవి గంగాళాలను మోసే చక్రాలుగల నిర్మాణాలు. ‘ఆధార బండ్లు’ వాటి ఆధార కార్యాన్నీ, కదిలించగల నిర్మాణాన్నీ తెలియజేస్తుంది; కేవలం ‘ఆధారాలు’ అనడం చక్రాల లక్షణాన్ని మరుగుపరుస్తుంది.
- source_word: עָשֶׂר
  choice: పది
  rationale: స్త్రీలింగ నామవాచకమైన מְכֹנוֹת సంఖ్యను తెలిపే సాధారణ సంఖ్యావాచకం.
- source_word: הַ/כִּיֹּרֹת
  choice: గంగాళాలు
  rationale: כִּיּוֹר కడగడానికి ఉపయోగించే పెద్ద పాత్రను సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘గంగాళాలు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: עֲשָׂרָה
  choice: పది
  rationale: כִּיּוֹרוֹת సంఖ్యను తెలిపే సాధారణ సంఖ్యావాచకం.
- source_word: עַל
  choice: మీద ఉన్న
  rationale: గంగాళాలు ఆధార బండ్లపై అమర్చబడ్డ స్థాన సంబంధాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הַ/מְּכֹנוֹת
  choice: ఆధార బండ్లు
  rationale: మూలంలోని పునరుక్తిని నిలుపుతూ, వచనమంతటా పదాన్ని ఏకరీతిగా అనువదించాం.
