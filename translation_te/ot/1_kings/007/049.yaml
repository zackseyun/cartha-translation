translation_notes:
  register: ఆలయ సామగ్రి జాబితాకు తగిన గంభీరమైన, ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. పూర్వ వచనం నుంచి కొనసాగుతున్న క్రియను తెలుగులో వాక్యం సంపూర్ణంగా ఉండేందుకు “ఉంచాడు” అని పునరుద్ధరించాం. మూలంలోని కుడి/ఎడమ దిశలను నిలిపి, దక్షిణం/ఉత్తరం అని వ్యాఖ్యానించలేదు. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
