source:
  edition: WLC
  text: וְ/אֶת הַ֠/מְּנֹרוֹת חָמֵ֨שׁ מִ/יָּמִ֜ין וְ/חָמֵ֧שׁ מִ/שְּׂמֹ֛אול לִ/פְנֵ֥י הַ/דְּבִ֖יר זָהָ֣ב סָג֑וּר וְ/הַ/פֶּ֧רַח וְ/הַ/נֵּרֹ֛ת וְ/הַ/מֶּלְקַחַ֖יִם זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/049.yaml
  text: and the lampstands[a], five on the right and five on the left, before the inner sanctuary, of pure gold; and the flowers, the lamps, and the tongs[c][b], of gold.
translation:
  language: te
  text: అంతరాలయానికి ముందుగా[a] కుడివైపున ఐదు, ఎడమవైపున ఐదు చొప్పున స్వచ్ఛమైన బంగారపు[b] దీపస్తంభాలు; అలాగే బంగారపు పుష్పాలంకారాలు, దీపాలు, చిమటలు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతి పరిశుద్ధ స్థలానికి ముందుగా.” హీబ్రూ పదం ఆలయంలోని అత్యంత లోపలి గదిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “శుద్ధి చేసిన బంగారం.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “వత్తులు సరిచేసే పరికరాలు” లేదా “దీపకత్తెరలు.” హీబ్రూ పదం దీపాలను సంరక్షించడానికి ఉపయోగించే చిమటల వంటి సాధనాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְּנֹרוֹת
  choice: దీపస్తంభాలు
  rationale: ఇది ఒక్కొక్క దీపాన్ని కాక, నూనెదీపాలను నిలిపే స్తంభాలను సూచిస్తుంది; కొవ్వొత్తుల భావాన్ని కలిగించే పదాన్ని నివారిస్తుంది.
- source_word: מִיָּמִין ... מִשְּׂמֹאול
  choice: కుడివైపున ... ఎడమవైపున
  rationale: మూలపాఠంలోని సాపేక్ష దిశా పదాలను అలాగే నిలుపుతుంది; ఆలయ దిశల ఆధారంగా దక్షిణం, ఉత్తరం అని వ్యాఖ్యానించదు.
- source_word: לִפְנֵי הַדְּבִיר
  choice: అంతరాలయానికి ఎదురుగా
  rationale: דְּבִיר ఆలయంలోని అత్యంత లోపలి గదిని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: זָהָב סָגוּר
  choice: స్వచ్ఛమైన బంగారం
  rationale: సందర్భంలో ఈ పదబంధం అత్యున్నత నాణ్యతగల శుద్ధి చేసిన బంగారాన్ని సూచిస్తుంది.
- source_word: הַפֶּרַח
  choice: పుష్పాలంకారాలు
  rationale: ఏకవచన రూపం సమూహార్థకంగా దీపస్తంభాల పుష్పాకార అలంకరణలను సూచిస్తుంది.
- source_word: הַנֵּרֹת
  choice: దీపాలు
  rationale: దీపస్తంభాలపై ఉండే ఒక్కొక్క నూనెదీపాన్ని నేరుగా సూచిస్తుంది.
- source_word: הַמֶּלְקַחַיִם
  choice: పట్టుకార్లు
  rationale: దీపాల వత్తులను సరిచేయడానికి ఉపయోగించే పట్టు సాధనాలకు సమీపమైన సాధారణ తెలుగు పదం; నిర్దిష్ట కార్యాన్ని ప్రధాన పాఠంలో అతిగా వ్యాఖ్యానించదు.
- source_word: זָהָב
  choice: బంగారంతో చేసిన
  rationale: చివరి పదం పుష్పాలంకారాలు, దీపాలు, పట్టుకార్లు బంగారంతో చేసినవని సూచించే జాబితా నిర్మాణాన్ని స్పష్టం చేస్తుంది.
