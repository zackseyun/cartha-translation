- from: అంతరాలయానికి ఎదురుగా కుడివైపున ఐదు, ఎడమవైపున ఐదు చొప్పున స్వచ్ఛమైన బంగారంతో చేసిన దీపస్తంభాలను[a], అలాగే బంగారంతో చేసిన పుష్పాలంకారాలను, దీపాలను, పట్టుకార్లను[b] ఉంచాడు.
