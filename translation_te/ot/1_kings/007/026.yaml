  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עָבְי֣/וֹ טֶ֔פַח וּ/שְׂפָת֛/וֹ כְּ/מַעֲשֵׂ֥ה שְׂפַת כּ֖וֹס פֶּ֣רַח שׁוֹשָׁ֑ן אַלְפַּ֥יִם בַּ֖ת יָכִֽיל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/026.yaml
  text: Its thickness was a handbreadth[a], and its rim was made like the rim of a cup, like a lily blossom[b]. It could hold two thousand baths.
translation:
  language: te
  text: దాని మందం ఒక అరచేతి వెడల్పు[a]. దాని అంచు గిన్నె అంచు వలె, వికసించిన లిల్లీ పువ్వు వలె మలచబడింది[b]. అది రెండువేల బాత్‌ల పరిమాణం పట్టగలదు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఒక అరచేతి వెడల్పు ప్రాచీన పొడవు కొలమానం.
    reason: measurement_clarification
  - marker: b
    text: లేదా, “దాని పెదవి … గిన్నె పెదవి వలె.” ఇక్కడ ‘పెదవి’ అంటే పాత్ర పై అంచు.
    reason: lexical_alternative
  - marker: c
    text: సమాంతర వర్ణనలో, 2 దినవృత్తాంతములు 4:5 ఈ తొట్టె మూడు వేల బాత్‌లను పట్టేదని చెబుతుంది. ఇది సామర్థ్యం మరియు సాధారణంగా నింపిన పరిమాణం మధ్య తేడాను సూచించవచ్చు; లేదా పాఠ్య-ప్రసార/వివరణాత్మక భేదం కావచ్చు.
    reason: cross_reference
lexical_decisions:
- source_word: עָבְיוֹ
  choice: దాని మందం
  rationale: ఈ నామవాచకం సముద్రం అని పిలిచే పెద్ద తొట్టె లోహపు మందాన్ని సూచిస్తుంది; ప్రత్యయం ఆ తొట్టెనే సూచిస్తుంది.
- source_word: טֶפַח
  choice: ఒక అరచేతి వెడల్పు
  rationale: టెఫహ్ అనేది చేతి వెడల్పు ఆధారమైన ప్రాచీన కొలత; ఆధునిక తెలుగు పాఠకునికి అర్థమయ్యేలా భావాన్ని తెలిపింది.
- source_word: שְׂפָתוֹ
  choice: దాని అంచు
  rationale: పెద్ద లోహపు తొట్టె పైభాగపు అంచును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘పెదవి’ అనే అక్షరార్థం ఇక్కడ అసహజంగా ఉంటుంది.
- source_word: כְּמַעֲשֵׂה שְׂפַת כּוֹס
  choice: గిన్నె అంచులా ... చేయబడింది
  rationale: చెక్కిన లేదా మలచిన ఆకారపు పోలికను సహజంగా వ్యక్తం చేస్తూ, అంచు అనే పదాన్ని స్థిరంగా ఉంచుతుంది.
- source_word: פֶּרַח שׁוֹשָׁן
  choice: కలువ పువ్వులా
  rationale: శోషాన్ సూచించే పుష్పజాతి ఖచ్చిత గుర్తింపు వివాదాస్పదమైనా, తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ‘కలువ’ను ఎంచుకుంది; వికసించిన పుష్పాకార పోలికను నిలుపుతుంది.
- source_word: אַלְפַּיִם בַּת
  choice: రెండువేల బాతుల నీటిని
  rationale: ‘బాతు’ ప్రాచీన ద్రవ కొలమానం; ఆధునిక ప్రమాణానికి ఊహాత్మక మార్పిడి చేయకుండా లిప్యంతరీకరించబడింది. సందర్భానుసారం కొలవబడేది నీరు అని స్పష్టం చేసింది.
- source_word: יָכִיל
  choice: పట్టగలదు
  rationale: హిఫీల్ రూపం వాస్తవంగా నిండివున్న పరిమాణం కంటే సామర్థ్యాన్ని సూచించగలదు; అందువల్ల ‘పట్టగలదు’ సరిపోతుంది.
theological_decisions:
- issue: 1 రాజులు 7:26లో రెండువేల బాతులు, 2 దినవృత్తాంతాలు 4:5లో మూడువేల బాతులు అని ఉండటం
  choice: మూలపాఠంలోని ‘రెండువేల’ను యథాతథంగా అనువదించి, భేదాన్ని పాదసూచికలో తెలిపింది.
  alternative: రెండు సంఖ్యలను సామర్థ్యం మరియు సాధారణంగా నింపిన పరిమాణం అని సమన్వయపరచడం.
  rationale: మూలాల మధ్య ఉన్న నిజమైన పాఠ్య లేదా వివరణాత్మక ఉద్రిక్తతను ప్రధాన వచనంలో నిశ్శబ్దంగా పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. అయితే సమర్పించిన పాదసూచికల్లో [c] ప్రధాన పాఠ్యంలో తప్పనిసరిగా కనిపించాలి; అందుచేత ప్రచురణ పాఠ్యంలో చివరి వాక్యాన్ని ‘అది రెండువేల బాతుల నీటిని పట్టగలదు[c].’గా చదవాలి.
