base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/050.yaml
  text: and the basins[a], the snuffers, the bowls, the cups, and the firepans, of pure gold; and the hinges for the doors of the inner house, for the Most Holy Place, and for the doors of the house, that is, the nave[d][c][b], of gold.
translation:
  language: te
  text: వెడల్పాటి పాత్రలు[a], వత్తులు కత్తిరించే పనిముట్లు, గిన్నెలు, చిన్న పాత్రలు, నిప్పు పళ్లాలు—ఇవన్నీ మేలిమి బంగారంతో చేయబడ్డాయి. అలాగే అతి పరిశుద్ధ స్థలమైన లోపలి మందిరపు తలుపులకూ, మందిరంలోని ప్రధాన గది తలుపులకూ అమర్చిన ఇరుసు గూళ్లు[b] బంగారంతో చేయబడ్డాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: పెద్ద పాత్రలు.'
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదం ఆధునిక పక్క కీలులకన్నా, తలుపులు ఇరుసుపై తిరిగే గూళ్లు లేదా అలాంటి అమరికలను సూచించే అవకాశం ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: הַסִּפּוֹת
  choice: మేళ్లు
  rationale: ఆలయ పాత్రల జాబితాలో ఇది ద్రవాలను ఉంచే వెడల్పాటి పాత్రలను సూచిస్తుంది; తరువాతి מִזְרָקוֹת నుండి భేదం నిలుపుతుంది.
- source_word: הַמְזַמְּרוֹת
  choice: వత్తులు కత్తిరించే పనిముట్లు
  rationale: ఆలయ సందర్భంలో దీపాల వత్తులను కత్తిరించి సరిచేసే పరికరాలనే సూచిస్తుంది; సాధారణ పాఠకునికి పని స్పష్టమయ్యే సహజ పదబంధం.
- source_word: הַמִּזְרָקוֹת
  choice: గిన్నెలు
  rationale: ఆరాధనా క్రియల్లో ద్రవాలను పట్టుకోవడానికి లేదా చల్లడానికి వాడే పాత్రలు; మూలంలోని నిర్దిష్ట వినియోగాన్ని అతిగా నిర్ణయించకుండా సాధారణ రూపపదం వాడబడింది.
- source_word: הַכַּפּוֹת
  choice: చిన్న పాత్రలు
  rationale: చేతి అరలాంటి చిన్న లోతైన పాత్ర అనే విస్తృత భావాన్ని నిలుపుతుంది; చెంచాలు లేదా ధూపపాత్రలు అని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: הַמַּחְתּוֹת
  choice: నిప్పు పళ్లాలు
  rationale: నిప్పు లేదా నిప్పుల బొగ్గులను మోయడానికి ఉపయోగించే ఆరాధనా పళ్లాలను నేరుగా సూచిస్తుంది.
- source_word: זָהָב סָגוּר
  choice: మేలిమి బంగారం
  rationale: అత్యుత్తమంగా శుద్ధి చేసిన బంగారం అనే నుడికారార్థాన్ని సహజ తెలుగు రూపంలో తెలియజేస్తుంది.
- source_word: הַפֹּתוֹת
  choice: ఇరుసు గుంటలు
  rationale: తలుపులు తిరిగే పివట్ సాకెట్లు లేదా అలాంటి అమరికలను సూచించే అవకాశం ఎక్కువ; ఆధునిక పక్క కీలుల భావాన్ని రుద్దదు.
- source_word: הַבַּיִת הַפְּנִימִי
  choice: లోపలి మందిరం
  rationale: ఆలయపు అంతర్గత గదిని సహజంగా సూచిస్తూ, తరువాతి పదబంధం దానిని అతి పరిశుద్ధ స్థలంగా గుర్తించడానికి వీలు కల్పిస్తుంది.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: అతి పరిశుద్ధ స్థలం
  rationale: హీబ్రూ తీవ్రతా నిర్మాణాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְדַלְתֵי הַבַּיִת לַהֵיכָל
  choice: మందిరంలోని ప్రధాన గది తలుపులకు
  rationale: హֵיכָל లోపలి అతి పరిశుద్ధ స్థలానికి భిన్నమైన ప్రధాన ఆలయ మందిరాన్ని సూచిస్తుంది; 'ప్రధాన గది' సాధారణ పాఠకునికి స్పష్టం.
- source_word: זָהָב
  choice: బంగారంతో చేయబడ్డాయి
  rationale: క్రియలేని హీబ్రూ జాబితాలో తలుపు అమరికల పదార్థాన్ని తెలుగులో సహజమైన పూర్తి వాక్యంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים యొక్క సాంప్రదాయ నామం
  choice: అతి పరిశుద్ధ స్థలం
  alternative: పరిశుద్ధాతిపరిశుద్ధ స్థలం
  rationale: అర్థాన్ని సాధారణ ఆధునిక పాఠకునికి స్పష్టంగా అందిస్తూ, ఒక ప్రత్యేక సంప్రదాయ పదబంధాన్ని తప్పనిసరి చేయదు.
translation_notes:
  register: ఆలయ సామగ్రి జాబితాకు తగిన గంభీరమైన ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. అరుదైన సాంకేతిక పదాలకు బదులుగా వాటి పనిని తెలిపే పదబంధాలు ఎంచుకోబడ్డాయి; మూలంలోని రెండు వేర్వేరు పాత్రపదాల భేదం సాధ్యమైనంతవరకు నిలుపబడింది.
