  rationale: ఈ పదం చూడడానికి లేదా వెలుగు రావడానికి ఉన్న తెరువును సూచిస్తుంది; ముందున్న నిర్మాణ పదంతో సమాంతరంగా ‘కిటికీ’ స్పష్టంగా ఉంటుంది.
- source_word: אֶל מֶחֱזָה
  choice: ఒక కిటికీకి ఎదురుగా మరొక కిటికీ
  rationale: אֶל ఇక్కడ కిటికీల పరస్పర అభిముఖ అమరికను తెలియజేస్తుంది; ఈ తెలుగు రూపం ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שָׁלֹשׁ פְּעָמִים
