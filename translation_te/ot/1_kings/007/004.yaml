  rationale: హీబ్రూ పదబంధానికి అక్షరార్థం ‘మూడు సార్లు’; అది మూడు అంతస్తులు లేదా స్థాయిల అమరికను సూచించవచ్చనే భావాన్ని పాదటిప్పణిలో ఉంచాం.
