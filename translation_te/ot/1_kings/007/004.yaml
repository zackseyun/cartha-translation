lexical_decisions:
- source_word: שְׁקֻפִים
  choice: కిటికీ చట్రాలు
  rationale: ఈ నిర్మాణ సందర్భంలో ఈ పదం కేవలం కిటికీలను కాకుండా చట్రంతో కూడిన తెరువులను సూచించే అవకాశం ఉంది; అందువల్ల నిర్మాణార్థాన్ని స్పష్టంగా ఉంచే పదబంధం ఎంచుకున్నాం.
- source_word: שְׁלֹשָׁה טוּרִים
  choice: మూడు వరుసలుగా
