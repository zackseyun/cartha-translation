reference: 1 Kings 7:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אוּלָ֤ם הַ/כִּסֵּא֙ אֲשֶׁ֣ר יִשְׁפָּט שָׁ֔ם אֻלָ֥ם הַ/מִּשְׁפָּ֖ט עָשָׂ֑ה וְ/סָפ֣וּן בָּ/אֶ֔רֶז מֵ/הַ/קַּרְקַ֖ע עַד הַ/קַּרְקָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/007.yaml
  text: And he made the Hall of the Throne[a], where he was to judge—the Hall of Judgment—and it was paneled with cedar from floor to floor.
translation:
  language: te
  text: అతడు తాను అక్కడ తీర్పు తీర్చే సింహాసన మందిరాన్ని, అనగా న్యాయవిచారణ మందిరాన్ని, నిర్మించాడు. అది నేల నుండి నేల వరకు[a] దేవదారు చెక్కతో కప్పబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, భావానువాదంగా, ‘నేల నుండి పైకప్పు వరకు.’ హీబ్రూ మూలపాఠంలో అక్షరార్థంగా, ‘నేల నుండి నేల వరకు’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם הַכִּסֵּא
  choice: సింహాసన మందిరాన్ని
  rationale: אוּלָם రాజభవన సందర్భంలో విశాలమైన మందిరాన్ని సూచిస్తుంది; הַכִּסֵּא రాజసంబంధమైన ‘సింహాసనం’ అనే అర్థాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר יִשְׁפָּט שָׁם
  choice: తాను తీర్పు తీర్చే
  rationale: יִשְׁפָּט ఇక్కడ ఆ మందిరపు నియమిత లేదా సాధారణ కార్యాన్ని సూచించగలదు; తెలుగు వర్తమాన సంబంధ క్రియారూపం ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֻלָם הַמִּשְׁפָּט
  choice: న్యాయ మందిరాన్ని
  rationale: మందిరాన్ని దాని కార్యం ఆధారంగా పిలిచే నిర్మాణం; ‘న్యాయం’ సందర్భంలో తీర్పు నిర్వహణను సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: עָשָׂה
  choice: నిర్మించాడు
  rationale: మూలపదం సాధారణంగా ‘చేశాడు’ అయినప్పటికీ, భవన నిర్మాణ సందర్భంలో ‘నిర్మించాడు’ సహజమైన తెలుగు సమానార్థకం.
- source_word: וְסָפוּן בָּאֶרֶז
  choice: దేవదారు చెక్కతో పలకలు అమర్చబడ్డాయి
  rationale: సָפוּן కప్పడం లేదా చెక్క పలకలతో తాపడం అనే నిర్మాణ భావాన్ని ఇస్తుంది; ఈ ఎంపిక అంతర్గత చెక్క తాపడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֵהַקַּרְקַע עַד הַקַּרְקָע
  choice: నేల నుండి నేల వరకు
  rationale: హీబ్రూ పాఠంలోని ‘నేల ... నేల’ అనే అసాధారణ పునరుక్తిని సరిచేయకుండా ప్రధాన పాఠంలో నిలిపి, సాధారణ వ్యాఖ్యానాన్ని పాదటిప్పణిలో ఇస్తుంది.
