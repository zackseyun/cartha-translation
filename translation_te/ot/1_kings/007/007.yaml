translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన నిర్మాణ వర్ణనను ఉపయోగించాం. మూలంలోని అసాధారణమైన చివరి పదబంధాన్ని ప్రధాన పాఠంలో నిలిపి, దాని సాధారణ భావవ్యాఖ్యానాన్ని పాదటిప్పణిలో ఇచ్చాం.
