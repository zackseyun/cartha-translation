source:
  edition: WLC
  text: וּ/מַֽעֲשֵׂה֙ הָ/א֣וֹפַנִּ֔ים כְּ/מַעֲשֵׂ֖ה אוֹפַ֣ן הַ/מֶּרְכָּבָ֑ה יְדוֹתָ֣/ם וְ/גַבֵּי/הֶ֗ם וְ/חִשֻּׁקֵי/הֶ֛ם וְ/חִשֻּׁרֵי/הֶ֖ם הַ/כֹּ֥ל מוּצָֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/033.yaml
  text: The workmanship of the wheels was like the workmanship of a chariot wheel[a]; their axles, their rims, their spokes[b], and their hubs were all cast metal.
translation:
  language: te
  text: ఆ చక్రాల నిర్మాణం రథచక్రం నిర్మాణంలా ఉంది; వాటి ఇరుసులు[a], అంచులు, ఆకులు[b], నాభులు—అన్నీ పోతపోసినవే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఇరుసులు” అనే చోట “పిడులు” లేదా “ఆధారాలు” అని కూడా అనువదించవచ్చు. హీబ్రూ పదం అక్షరార్థంగా “చేతులు” అనే భావానికి సంబంధించినది; ఈ చక్రాల సందర్భంలో అది ఇరుసు భాగాలను లేదా ఆధారాలను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “ఆకులు” అనే చోట “బిగింపు పట్టీలు” అని, “నాభులు” అనే చోట “అమరిక భాగాలు” లేదా “కేంద్ర భాగాలు” అని కూడా అనువదించవచ్చు. ఈ రెండు హీబ్రూ సాంకేతిక పదాలు అరుదైనవి; వాటి ఖచ్చితమైన అర్థం చక్ర నిర్మాణ సందర్భం ఆధారంగా ఊహించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה / כְּמַעֲשֵׂה
  choice: నిర్మాణం / నిర్మాణంలా
  rationale: ఈ సందర్భంలో వస్తువు రూపొందించబడిన తీరు, కట్టుదల రెండింటినీ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; כְ ఉపసర్గంలోని పోలికను నిలుపుతుంది.
- source_word: הָאֹפַנִּים / אוֹפַן הַמֶּרְכָּבָה
  choice: చక్రాలు / రథచక్రం
  rationale: אוֹפַן యొక్క సాధారణ అర్థాన్ని, పోలికలోని ఏకవచనాన్ని నిలుపుతుంది; מֶרְכָּבָהకు ప్రాచీన సందర్భానుకూలమైన ‘రథం’ వాడబడింది.
- source_word: יְדוֹתָם
  choice: ఇరుసులు
  rationale: యָד పదానికి మౌలికంగా ‘చేతి/పిడి’ భావం ఉన్నప్పటికీ, చక్ర భాగాల జాబితాలో ఇరుసు భాగాలు లేదా ఆధారాలు అనే అర్థం సందర్భానికి సరిపోతుంది.
- source_word: גַבֵּיהֶם
  choice: అంచులు
  rationale: చక్రపు వెలుపలి ఎత్తైన వలయ భాగాన్ని సాధారణ పాఠకునికి అర్థమయ్యేలా సూచిస్తుంది.
- source_word: חִשֻּׁקֵיהֶם
  choice: ఆకులు
  rationale: చక్రనాభిని అంచుతో కలిపే భాగాలకు తెలుగులో వాడే సహజ పదం; అయితే అరుదైన హీబ్రూ సాంకేతిక పదం కావడంతో ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: חִשֻּׁרֵיהֶם
  choice: నాభులు
  rationale: చక్రం మధ్యనున్న కేంద్ర భాగానికి స్పష్టమైన, ప్రస్తుత తెలుగు పదం; హీబ్రూ పదం అరుదైనదైనందున అనిశ్చితి పాదటిప్పణిలో గుర్తించబడింది.
- source_word: הַכֹּל מוּצָק
  choice: అన్నీ పోతపోసిన లోహంతో చేసినవే
  rationale: יצק యొక్క లోహాన్ని పోతపోసే తయారీ భావాన్ని సహజ తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; ‘అన్నీ’ జాబితాలోని భాగాలన్నిటినీ సమగ్రంగా సూచిస్తుంది.
