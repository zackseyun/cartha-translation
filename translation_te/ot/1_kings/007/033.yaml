translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకునికి స్పష్టంగా ఉండే చక్ర భాగాల పదజాలం వాడబడింది. మూలంలోని సాంకేతిక పదాల అనిశ్చితిని ప్రధాన వాక్యాన్ని భారంగా చేయకుండా పాదటిప్పణుల్లో నిలుపుకున్నాం. శైలి గౌరవప్రదంగా, నిర్మాణ వివరణకు తగినంత సంక్షిప్తంగా ఉంది.
