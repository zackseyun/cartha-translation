  text: וְ/אַרְבָּעָה֩ אוֹפַנֵּ֨י נְחֹ֜שֶׁת לַ/מְּכוֹנָ֤ה הָֽ/אַחַת֙ וְ/סַרְנֵ֣י נְחֹ֔שֶׁת וְ/אַרְבָּעָ֥ה פַעֲמֹתָ֖י/ו כְּתֵפֹ֣ת לָ/הֶ֑ם מִ/תַּ֤חַת לַ/כִּיֹּר֙ הַ/כְּתֵפֹ֣ת יְצֻק֔וֹת מֵ/עֵ֥בֶר אִ֖ישׁ לֹיֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/030.yaml
  text: And the one stand had four bronze wheels and bronze axles[a], and its four corners had supports for them; beneath the basin the supports were cast[c][b], each beside wreathwork.
translation:
  language: te
  text: ఒక్కొక్క పీటకు[a] నాలుగు కంచు చక్రాలు, కంచు ఇరుసులు ఉండేవి. దాని నాలుగు పాదాలకు[b] ఆధార భుజాలు[c] ఉండేవి. తొట్టి కింద ఆ భుజాలు పోతపోసినవిగా ఉండేవి; ఒక్కొక్కటి పూలదండలవంటి అలంకరణ[d] పక్కన ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పీట’కు బదులుగా ‘ఆధార నిర్మాణం’ అని కూడా అనువదించవచ్చు. హీబ్రూ מְכוֹנָה ఇక్కడ తొట్టి కింద ఉన్న చక్రాల నిర్మాణాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదానికి అక్షరార్థంగా ‘పాదాలు’ లేదా ‘అడుగులు’ అనే భావం ఉంది; ఈ నిర్మాణ సందర్భంలో అది పీట నాలుగు దిగువ మూలస్థానాలను కూడా సూచించవచ్చు.
    reason: lexical_ambiguity
  - marker: c
    text: హీబ్రూ כְּתֵפֹת అక్షరార్థంగా ‘భుజాలు’; ఇక్కడ తొట్టిని మోసే బయటికి పొడుచుకొచ్చిన ఆధార భాగాలు కావచ్చు.
    reason: lexical_alternative
  - marker: d
    text: చివరి హీబ్రూ పదం అరుదైనది. అది పూలదండలు, తోరణాలు లేదా వాటివంటి అలంకార పనిని సూచించవచ్చు.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: אוֹפַנֵּי נְחֹשֶׁת
  choice: కంచు చక్రాలు
  rationale: אוֹפַנִּים అంటే చక్రాలు; ఆలయ సామగ్రి సందర్భంలో נְחֹשֶׁתను సహజంగా ‘కంచు’ అని అనువదించడం సముచితం.
- source_word: לַמְּכוֹנָה הָאַחַת
  choice: ఒక్కొక్క పీటకు
  rationale: מְכוֹנָה ఇక్కడ తొట్టిని మోసే చక్రాల పీటను సూచిస్తుంది. ఏకవచన వర్ణనకు తెలుగులో సహజమైన పంపిణీ భావాన్ని ‘ఒక్కొక్క’ తెలియజేస్తుంది.
- source_word: סַרְנֵי נְחֹשֶׁת
  choice: కంచు ఇరుసులు
  rationale: చక్రాల యాంత్రిక సందర్భంలో סַרְנִים అనేది చక్రాలను కలిపే ఇరుసులను సూచించడం అత్యంత సంభావ్యం.
- source_word: פַעֲמֹתָיו
  choice: దాని నాలుగు మూలల్లో
  rationale: ఈ పదానికి అక్షరార్థంగా ‘పాదాలు/అడుగులు’ అనే భావం ఉన్నా, పీట నిర్మాణ వర్ణనలో నాలుగు దిగువ మూలస్థానాలను సూచిస్తున్నట్లు సందర్భం తెలియజేస్తుంది; అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: כְּתֵפֹת
  choice: ఆధారపు భుజాలు
  rationale: అక్షరార్థమైన ‘భుజాలు’ అనే రూపకాన్ని నిలుపుతూ, అవి తొట్టిని మోసే నిర్మాణ భాగాలని ‘ఆధారపు’ స్పష్టం చేస్తుంది.
- source_word: מִתַּחַת לַכִּיֹּר
  choice: తొట్టి కింద
  rationale: כִּיּוֹר పెద్ద పాత్ర లేదా తొట్టిని సూచిస్తుంది; స్థల సంబంధాన్ని సరళంగా నిలిపాం.
- source_word: יְצֻקוֹת
  choice: పోతపోసినవి
  rationale: లోహపు పనిలో יצק ధాతువు పోతపోయడాన్ని సూచిస్తుంది.
- source_word: מֵעֵבֶר אִישׁ
  choice: ఒక్కొక్క భుజం పక్కన
  rationale: పంపిణీ స్థానాన్ని తెలిపే ఈ ప్రయోగాన్ని సహజమైన తెలుగులో చెప్పి, ఖచ్చితమైన భౌగోళిక అమరికను అతిగా నిర్ణయించలేదు.
- source_word: לֹיוֹת
  choice: పూలదండలవంటి అలంకరణ
  rationale: అత్యంత అరుదైన ఈ పదం దండలు లేదా తోరణాలవంటి అలంకార పనిని సూచించే అవకాశం ఉంది; ‘వంటి’ దాని అర్థంలోని అనిశ్చితిని కాపాడుతుంది.
