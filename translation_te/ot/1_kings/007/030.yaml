    issue: పַעֲמֹתָיו is translated in the main text as “నాలుగు మూలల్లో.”
    rationale: The Hebrew term primarily evokes feet/steps or lower support-points. In this object-description it may refer to the four lower corners, but “పాదాలకు” better retains the source expression while the footnote can state the structural possibility.
  - severity: low
    issue: The final clause says “ఒక్కొక్క భుజం పక్కన,” supplying ‘shoulder’ as the referent of the distributive phrase.
    rationale: The Hebrew wording is compressed and the referential geometry is uncertain. A more neutral Telugu formulation preserves the likely adjacency to the decorative garland-work without over-specifying the object.
