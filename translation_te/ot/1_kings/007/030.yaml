  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆలయ నిర్మాణ వర్ణనకు తగిన గౌరవప్రదమైన కానీ సులభమైన శైలిని వాడాం. అరుదైన నిర్మాణ పదాలకు కార్యార్థం మరియు అక్షరార్థం రెండింటినీ సాధ్యమైనంతవరకు నిలిపి, అస్పష్టతలను పాదసూచికల్లో తెలిపాం.
