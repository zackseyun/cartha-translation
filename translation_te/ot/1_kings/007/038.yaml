translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని కొలమానాలు నిలిపి, అవసరమైన వివరణలను పాదసూచికల్లో ఇచ్చాం; కొలత దిశకు సంబంధించిన మూలభాష అస్పష్టతను కూడా సూచించాం.
