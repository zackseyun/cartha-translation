  terminology: ‘కంచు,’ ‘తొట్టెలు,’ ‘బాతులు,’ ‘మూరలు,’ మరియు ‘ఆధారాలు’ సందర్భానుకూలమైన, అర్థమయ్యే పదాలు. ‘బాతు’ అనే పురాతన ద్రవకొలమానానికి పాదసూచిక అవసరమైన స్పష్టీకరణను ఇస్తుంది.
