source:
  edition: WLC
  text: וַ/יַּ֛עַשׂ עֲשָׂרָ֥ה כִיֹּר֖וֹת נְחֹ֑שֶׁת אַרְבָּעִ֨ים בַּ֜ת יָכִ֣יל הַ/כִּיּ֣וֹר הָ/אֶחָ֗ד אַרְבַּ֤ע בָּֽ/אַמָּה֙ הַ/כִּיּ֣וֹר הָ/אֶחָ֔ד כִּיּ֤וֹר אֶחָד֙ עַל הַ/מְּכוֹנָ֣ה הָ/אַחַ֔ת לְ/עֶ֖שֶׂר הַ/מְּכֹנֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/038.yaml
  text: He made ten bronze basins[a]. Each basin held forty baths, and each basin was four cubits across[c][b]. One basin stood on each of the ten stands.
translation:
  language: te
  text: అతడు పది కంచు తొట్టెలను[c] చేశాడు. ప్రతి తొట్టి నలభై బాతులు[a] పట్టేది; దాని కొలత నాలుగు మూరలు[b] ఉండేది. పది ఆధారాల్లో ప్రతిదానిమీద ఒక తొట్టి ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బాతు’ అనేది హెబ్రీయుల ద్రవకొలమానం.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘నాలుగు మూరల వ్యాసం.’ హెబ్రీ పాఠం ఇక్కడ కేవలం ‘నాలుగు మూరలు’ అని చెబుతుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘తొట్టెలు’ అంటే కడగడానికి ఉపయోగించే పెద్ద పాత్రలు.
    reason: lexical_clarification
lexical_decisions:
- source_word: כִיֹּרוֹת
  choice: తొట్టెలు
  rationale: దేవాలయ సామగ్రిలో కడగడానికి ఉపయోగించే పెద్ద పాత్రలను సూచిస్తుంది. ‘తొట్టెలు’ సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: దేవాలయ సామగ్రి సందర్భంలో ఈ లోహపదానికి సంప్రదాయబద్ధంగానూ సహజంగానూ సరిపోయే తెలుగు పదం.
- source_word: בַּת
  choice: బాతులు
  rationale: మూలంలోని హెబ్రీ ద్రవకొలమానాన్ని తప్పుడు కచ్చితత్వంతో ఆధునిక కొలమానంగా మార్చకుండా లిప్యంతరీకరించి నిలిపింది.
- source_word: יָכִיל
  choice: పట్టేది
  rationale: పాత్ర సామర్థ్యాన్ని తెలిపే క్రియకు సహజమైన తెలుగు రూపం.
- source_word: אַרְבַּע בָּאַמָּה
  choice: అడ్డంగా నాలుగు మూరలు
  rationale: మూలం కొలతను మాత్రమే స్పష్టంగా చెబుతుంది; ‘అడ్డంగా’ అనేది వృత్తాకార తొట్టి కొలతను సహజంగా తెలియజేస్తుంది, అయితే ‘వ్యాసం’ అనే సాంకేతిక నిర్ధారణను ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చదు.
- source_word: מְכוֹנָה
  choice: ఆధారాలు
  rationale: ఈ తొట్టెలను మోసే నిర్మాణాలను సూచించే స్పష్టమైన సాధారణ పదం; ఈ వచనంలో అవసరానికి మించిన వివరాన్ని చేర్చదు.
- source_word: כִּיּוֹר אֶחָד עַל הַמְּכוֹנָה הָאַחַת לְעֶשֶׂר הַמְּכֹנוֹת
  choice: పది ఆధారాల్లో ఒక్కొక్క దానిమీద ఒక్కో తొట్టి ఉండేది
  rationale: పది ఆధారాలకు ఒక్కొక్క తొట్టి చొప్పున ఉన్న పంపిణీ భావాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
