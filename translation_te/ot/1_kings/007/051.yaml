source:
  edition: WLC
  text: וַ/תִּשְׁלַם֙ כָּל הַ/מְּלָאכָ֔ה אֲשֶׁ֥ר עָשָׂ֛ה הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בֵּ֣ית יְהוָ֑ה וַ/יָּבֵ֨א שְׁלֹמֹ֜ה אֶת קָדְשֵׁ֣י דָּוִ֣ד אָבִ֗י/ו אֶת הַ/כֶּ֤סֶף וְ/אֶת הַ/זָּהָב֙ וְ/אֶת הַ/כֵּלִ֔ים נָתַ֕ן בְּ/אֹצְר֖וֹת בֵּ֥ית יְהוָֽה־־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/051.yaml
  text: So all the work that King Solomon did for the house of Yahweh was finished. And Solomon brought in the holy things of David his father—the silver[a], the gold, and the vessels—and put them in the treasuries of the house of Yahweh.
translation:
  language: te
  text: ఆ విధంగా యెహోవా మందిరం కోసం రాజైన సొలొమోను చేసిన పని అంతా పూర్తయింది. సొలొమోను తన తండ్రియైన దావీదు పవిత్రంగా అంకితం చేసిన వస్తువులను[a]—వెండిని, బంగారాన్ని, పాత్రలను—తెచ్చి యెహోవా మందిరంలోని ఖజానా గదుల్లో ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన తండ్రి దావీదు పవిత్ర వస్తువులను.” హీబ్రూ పదం యెహోవా కోసం పవిత్రంగా ప్రత్యేకపరచబడిన లేదా అంకితం చేయబడిన వస్తువులను సూచిస్తుంది.
    reason: కָדְשֵׁי పదంలో ఉన్న ‘పవిత్రమైనవి’ మరియు ‘అంకితం చేయబడినవి’ అనే సన్నిహిత భావాలను, అలాగే దావీదుతో ఉన్న సంబంధాన్ని పాఠకునికి తెలియజేయడానికి.
lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: పూర్తయింది
  rationale: שלם ఇక్కడ సంపూర్ణం కావడం లేదా ముగియడం అనే భావాన్ని ఇస్తుంది; స్త్రీలింగ ఏకవచన క్రియ מְלָאכָהతో ఏకీభవిస్తుంది. తెలుగులో ‘పని అంతా పూర్తయింది’ సహజంగా ఉంటుంది.
- source_word: כָּל הַמְּלָאכָה
  choice: పని అంతా
  rationale: మందిర నిర్మాణం మరియు దాని సామగ్రికి సంబంధించిన మొత్తం కార్యాన్ని సూచిస్తుంది; ‘పని అంతా’ విస్తృతమైన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: בֵּית అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఈ సందర్భంలో దేవాలయాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘మందిరం’ స్పష్టంగా, సహజంగా ఉంది; יהוהను వ్యక్తిగత దైవనామమైన ‘యెహోవా’గా ఉంచాం.
- source_word: וַיָּבֵא
  choice: తెచ్చి
  rationale: בוא హిఫీల్ రూపం ‘తీసుకురావడం/లోపలికి తేవడం’ అనే భావం ఇస్తుంది. గమ్యం తరువాత స్పష్టంగా ఉన్నందున ‘తెచ్చి’ సహజమైన తెలుగు.
- source_word: קָדְשֵׁי דָּוִד אָבִיו
  choice: తన తండ్రి దావీదు ప్రతిష్ఠించిన వస్తువులను
  rationale: קָדְשֵׁי అనేది దేవుని కోసం ప్రత్యేకంగా వేరు చేసి అర్పించిన వస్తువులను సూచిస్తుంది. ‘ప్రతిష్ఠించిన వస్తువులు’ పవిత్రంగా ప్రత్యేకపరచిన భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַכֶּסֶף ... הַזָּהָב ... הַכֵּלִים
  choice: వెండిని, బంగారాన్ని, పాత్రలను
  rationale: כֵּלִים విస్తృతంగా వస్తువులు, ఉపకరణాలు లేదా పాత్రలను సూచించగలదు. మందిర సందర్భంలో ‘పాత్రలు’ సాధారణమైన, సముచితమైన పదం.
- source_word: נָתַן
  choice: ఉంచాడు
  rationale: נתן ఇక్కడ ఖజానా గదుల్లో వస్తువులను పెట్టడం లేదా నిల్వచేయడం అనే సందర్భార్థాన్ని కలిగి ఉంది; ‘ఉంచాడు’ సరళంగా, ఖచ్చితంగా ఉంది.
- source_word: בְּאֹצְרוֹת
  choice: ఖజానా గదుల్లో
  rationale: బహువచన రూపం నిల్వ లేదా ధనాగార గదులను సూచిస్తుంది. ‘ఖజానా గదులు’ కేవలం ధనాన్ని మాత్రమే కాక విలువైన పవిత్ర సామగ్రిని భద్రపరిచే ప్రదేశాలనూ సూచించగలదు.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠం చతురక్షర దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. సాధారణ తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన వ్యక్తిగత నామరూపం ‘యెహోవా’ను వాడటం ద్వారా దానిని సాధారణ బిరుదుగా మార్చలేదు.
- issue: קָדְשֵׁי యొక్క పవిత్రత/అంకిత భావం
  choice: ప్రతిష్ఠించిన వస్తువులు
  alternative: పవిత్ర వస్తువులు; అంకితం చేసిన వస్తువులు
  rationale: ఇవి అంతర్గతంగా పవిత్రమైనవి అనే భావం మాత్రమే కాక, యెహోవా కోసం ప్రత్యేకంగా వేరు చేసి అర్పించబడినవి అనే సందర్భార్థాన్ని ‘ప్రతిష్ఠించిన’ స్పష్టంగా అందిస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. హీబ్రూ వాక్యక్రమాన్ని బలవంతంగా అనుసరించకుండా, కార్యం పూర్తవడం మరియు ప్రతిష్ఠిత వస్తువులను ఖజానా గదుల్లో ఉంచడం అనే రెండు ప్రధాన వాక్యభాగాలను స్పష్టంగా నిలిపాం.
