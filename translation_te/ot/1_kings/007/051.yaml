- from: ఆ విధంగా యెహోవా మందిరం కోసం రాజైన సొలొమోను చేసిన పని అంతా పూర్తయింది. సొలొమోను తన తండ్రి దావీదు ప్రతిష్ఠించిన వస్తువులను[a]—వెండిని, బంగారాన్ని, పాత్రలను—తెచ్చి యెహోవా మందిరంలోని ఖజానా గదుల్లో ఉంచాడు.
