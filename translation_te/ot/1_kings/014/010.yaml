source:
  edition: WLC
  text: לָ/כֵ֗ן הִנְ/נִ֨י מֵבִ֤יא רָעָה֙ אֶל בֵּ֣ית יָרָבְעָ֔ם וְ/הִכְרַתִּ֤י לְ/יָֽרָבְעָם֙ מַשְׁתִּ֣ין בְּ/קִ֔יר עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵ֑ל וּ/בִֽעַרְתִּי֙ אַחֲרֵ֣י בֵית יָרָבְעָ֔ם כַּ/אֲשֶׁ֛ר יְבַעֵ֥ר הַ/גָּלָ֖ל עַד תֻּמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/010.yaml
  text: Therefore[a], behold, I am bringing disaster on the house of Jeroboam, and I will cut off from Jeroboam every male, bond and free in Israel, and I will burn away after the house of Jeroboam[b], just as one burns away dung until it is all gone.
translation:
  language: te
  text: కాబట్టి ఇదిగో, నేను యెరోబాము వంశం మీదికి విపత్తు రప్పిస్తున్నాను. ఇశ్రాయేలులో యెరోబాముకు చెందిన ప్రతి మగవాణ్ణీ[a]—బానిసనైనా స్వతంత్రుడినైనా[b]—నిర్మూలిస్తాను. పెంట అంతమైపోయే వరకు దాన్ని పూర్తిగా తొలగించినట్లే, యెరోబాము వంశాన్ని పూర్తిగా తొలగిస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘గోడకు మూత్రం పోసేవాడు’; ఇది మగవాణ్ణి సూచించే మోటైన నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అడ్డగించబడినవాడైనా విడిచిపెట్టబడినవాడైనా.’ ఈ హీబ్రూ పదజంట ఎవ్వరినీ మినహాయించకుండా అందరినీ సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה
  choice: విపత్తు
  rationale: ఇది నైతికమైన చెడును కాక, దేవుని తీర్పుగా రాబోయే ఘోరమైన కీడును సూచిస్తుంది; ‘విపత్తు’ ఆధునిక తెలుగులో సహజంగా ఆ తీవ్రతను తెలియజేస్తుంది.
- source_word: וְהִכְרַתִּי
  choice: నిర్మూలిస్తాను
  rationale: כרת ఇక్కడ వ్యక్తులను, వంశపరంపరను పూర్తిగా తొలగించే తీర్పును సూచిస్తుంది. తెలుగులో ‘నిర్మూలిస్తాను’ ఆ ఫలితాన్ని స్పష్టంగా, బలంగా వ్యక్తం చేస్తుంది.
- source_word: מַשְׁתִּין בְּקִיר
  choice: ప్రతి మగవాణ్ణీ
  rationale: అక్షరార్థంగా ‘గోడకు మూత్రం పోసేవాడు’ అనే మోటైన హీబ్రూ నుడికారం మగవారిని సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన అర్థాన్ని ఇచ్చి, మూలంలోని మోటుదనాన్ని పాదటిప్పణిలో నమోదు చేశాం.
- source_word: עָצוּר וְעָזוּב
  choice: బానిసనైనా స్వతంత్రుడినైనా
  rationale: ఈ స్థిరమైన జంట పదబంధం ఎవ్వరినీ మినహాయించని సంపూర్ణతను సూచించే అవకాశముంది. సామాజిక స్థితి ఏదైనా అందరినీ సూచించే పదజంటగా అనువదించాం; అనిశ్చితిని పాదటిప్పణిలో నిలిపాం.
- source_word: וּבִעַרְתִּי אַחֲרֵי בֵית יָרָבְעָם
  choice: యెరోబాము ఇంటివారిని కాల్చి నిర్మూలిస్తాను
  rationale: בער తొలగించడం లేదా దహనం చేసి పూర్తిగా లేకుండా చేయడం అనే భావాన్ని కలిగిస్తుంది. వెంట వచ్చే పెంట ఉపమానం, అదే క్రియ పునరావృతం దృష్టిలో ఉంచుకొని ‘కాల్చి నిర్మూలిస్తాను’ అని ఇచ్చాం.
- source_word: הַגָּלָל
  choice: పెంట
  rationale: మూలపదంలోని అవమానకరమైన, గ్రాఫిక్ స్వరాన్ని మృదువుచేయకుండా సాధారణ ఆధునిక తెలుగు పదాన్ని ఎంచుకున్నాం.
- source_word: עַד תֻּמּוֹ
  choice: పూర్తిగా
  rationale: ఏ అవశేషమూ లేకుండా అంతమయ్యే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దైవిక తీర్పు ప్రకటనలోని తీవ్రతను మృదువుచేయకుండా అనువదించడం
  choice: ‘విపత్తు’, ‘నిర్మూలిస్తాను’, ‘కాల్చి నిర్మూలిస్తాను’, ‘పెంట’ వంటి నేరుగా, బలంగా ఉన్న పదాలను వాడటం
  alternative: ‘కష్టం’, ‘తొలగిస్తాను’, ‘చెత్త’ వంటి మృదువైన పదాలను వాడటం
  rationale: హీబ్రూ ప్రకటన ఉద్దేశపూర్వకంగా తీవ్రమైనది, అవమానకరమైనది. దాని తీర్పు స్వరాన్ని ఏ సిద్ధాంతపరమైన కారణంతోనూ తగ్గించకుండా నిలిపాం.
- issue: בער అనే క్రియలో తొలగింపు మరియు దహనం మధ్య ఉన్న భావవ్యాప్తి
  choice: ఉపమానంలోని పునరుక్తిని నిలుపుతూ ‘కాల్చి నిర్మూలిస్తాను’ అని అనువదించడం
  alternative: ‘తుడిచిపెట్టేస్తాను’ లేదా ‘ఊడ్చివేస్తాను’
  rationale: మూలంలో ఒకే క్రియ ప్రధాన వాక్యంలోనూ పెంట ఉపమానంలోనూ వస్తుంది. తెలుగు పాఠకునికి సంపూర్ణ వినాశన భావం స్పష్టమయ్యేలా దహనం మరియు నిర్మూలన రెండింటినీ వ్యక్తం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన తీర్పు స్వరాన్ని నిలిపాం. ‘ఇదిగో’ ప్రవచన ప్రకటనలోని הִנְנִי బలాన్ని కాపాడుతుంది. వాక్య నిర్మాణం సాధారణ పాఠకునికి స్పష్టంగా ఉండేలా విభజించబడింది; మూలంలోని మోటైన నుడికారం మరియు అనిశ్చిత పదజంట పాదటిప్పణుల్లో పారదర్శకంగా ఇవ్వబడ్డాయి.
