review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the judgment, the total removal of Jeroboam’s male line, and the contemptuous dung comparison. However, ‘కాల్చి నిర్మూలిస్తాను’ expands the single repeated Hebrew verb (בער) into two actions and makes literal burning more prominent than the context requires. The comparison is better represented by a single Telugu verb for thorough clearing away, repeated in both clauses.
  naturalness: The Telugu is generally clear and suitably grave. ‘యెరోబాము ఇంటివారి’ can sound merely household-oriented; ‘యెరోబాము వంశం’ better conveys ‘house’ in this dynastic judgment context. Repeating ‘పూర్తిగా’ with ‘అంతమైపోయే వరకు’ is unnecessary; the latter preserves the Hebrew’s finality naturally.
  terminology: ‘విపత్తు,’ ‘నిర్మూలిస్తాను,’ and ‘పెంట’ are appropriate. ‘బానిసనైనా స్వతంత్రుడినైనా’ is a defensible rendering of the disputed totality formula, provided the footnote retains the Hebrew’s less certain literal wording and its likely inclusive force.
  issues:
  - severity: medium
    issue: ‘కాల్చి నిర్మూలిస్తాను’ adds ‘నిర్మూలిస్తాను’ to the Hebrew verb בער and does not preserve the source’s verbal repetition cleanly.
    rationale: The same verb occurs in the main clause and the dung simile. In this context it denotes thorough removal/clearing away, with burning as a possible nuance, rather than requiring two separate Telugu actions.
  - severity: low
    issue: ‘యెరోబాము ఇంటివారి’ is narrower and less dynastic than ‘house of Jeroboam.’
    rationale: The oracle concerns Jeroboam’s house as a ruling line; ‘యెరోబాము వంశం’ communicates this naturally in modern Telugu.
  - severity: low
    issue: The final simile’s ‘పూర్తిగా’ does not fully reflect the temporal phrase ‘until it is finished/all gone.’
    rationale: ‘అంతమైపోయే వరకు’ naturally preserves the endpoint and totality expressed by עַד תֻּמּוֹ.
  revised_text: కాబట్టి ఇదిగో, నేను యెరోబాము వంశం మీదికి విపత్తు రప్పిస్తున్నాను. ఇశ్రాయేలులో యెరోబాముకు చెందిన ప్రతి మగవాణ్ణీ[a]—బానిసనైనా స్వతంత్రుడినైనా[b]—నిర్మూలిస్తాను. పెంట అంతమైపోయే వరకు దాన్ని పూర్తిగా తొలగించినట్లే, యెరోబాము వంశాన్ని పూర్తిగా తొలగిస్తాను.
