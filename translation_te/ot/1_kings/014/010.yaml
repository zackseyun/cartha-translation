- from: కాబట్టి ఇదిగో, నేను యెరోబాము ఇంటివారి మీదికి విపత్తు రప్పిస్తున్నాను. ఇశ్రాయేలులో యెరోబాముకు చెందిన ప్రతి మగవాణ్ణీ[a]—బానిసనైనా స్వతంత్రుడినైనా[b]—నిర్మూలిస్తాను. పెంటను పూర్తిగా కాల్చివేసినట్లే యెరోబాము ఇంటివారిని కాల్చి నిర్మూలిస్తాను.
  to: కాబట్టి ఇదిగో, నేను యెరోబాము వంశం మీదికి విపత్తు రప్పిస్తున్నాను. ఇశ్రాయేలులో యెరోబాముకు చెందిన ప్రతి మగవాణ్ణీ[a]—బానిసనైనా స్వతంత్రుడినైనా[b]—నిర్మూలిస్తాను. పెంట అంతమైపోయే వరకు దాన్ని పూర్తిగా తొలగించినట్లే, యెరోబాము వంశాన్ని పూర్తిగా తొలగిస్తాను.
