source:
  edition: WLC
  text: וַ/יהוָ֞ה אָמַ֣ר אֶל אֲחִיָּ֗הוּ הִנֵּ֣ה אֵ֣שֶׁת יָרָבְעָ֡ם בָּאָ֣ה לִ/דְרֹשׁ֩ דָּבָ֨ר מֵ/עִמְּ/ךָ֤ אֶל בְּנָ/הּ֙ כִּֽי חֹלֶ֣ה ה֔וּא כָּ/זֹ֥ה וְ/כָ/זֶ֖ה תְּדַבֵּ֣ר אֵלֶ֑י/הָ וִ/יהִ֣י כְ/בֹאָ֔/הּ וְ/הִ֖יא מִתְנַכֵּרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/005.yaml
  text: And Yahweh said to Ahijah[a], “Look, Jeroboam’s wife is coming to ask you about her son, because he is sick. You shall speak to her like this and like that. And when she comes[b], she will be disguising herself.”
translation:
  language: te
  text: 'యాహ్వే అహీయాతో ఇలా అన్నాడు: “చూడు, యరొబాము భార్య తన కుమారుని గురించి నిన్ను అడిగి తెలుసుకోవడానికి వస్తోంది; ఎందుకంటే అతడు అనారోగ్యంతో ఉన్నాడు. నీవు ఆమెతో ఇలా అలా చెప్పాలి.[a] ఆమె వచ్చినప్పుడు, తనను గుర్తుపట్టలేని విధంగా మారువేషం వేసుకుని ఉంటుంది.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘ఇలా అలా’ అనే సూత్రప్రాయ ప్రయోగం ఉంది; ఇంకా స్పష్టంగా చెప్పని ఒక నిర్దిష్ట సందేశాన్ని ఇది సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తాను వేరొక స్త్రీనని నటిస్తూ ఉంటుంది.’ హీబ్రూ క్రియ తనను గుర్తుపట్టలేని విధంగా చేసుకోవడం లేదా మారువేషం ధరించడం అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను దాని వ్యక్తినామ స్వభావాన్ని నిలుపుతూ ఆధునిక తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: הִנֵּה
  choice: చూడు
  rationale: శ్రద్ధను ఆకర్షించే హీబ్రూ సూచక పదాన్ని ప్రాచీనంగా వినిపించే రూపం కాకుండా సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: యరొబాము భార్య
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని సహజమైన తెలుగు స్వామ్య సంబంధంగా అనువదించాం.
- source_word: בָּאָה
  choice: వస్తోంది
  rationale: సందర్భంలోని సమీపిస్తున్న చర్యను వర్తమాన ప్రగతిశీల రూపం సహజంగా తెలియజేస్తుంది.
- source_word: לִדְרֹשׁ דָּבָר מֵעִמְּךָ אֶל־בְּנָהּ
  choice: తన కుమారుని గురించి నిన్ను అడిగి తెలుసుకోవడానికి
  rationale: ప్రవక్తను సంప్రదించి సమాచారం లేదా సందేశం తెలుసుకోవడం అనే భావాన్ని సాధారణ పాఠకులకు సహజంగా అందిస్తుంది.
- source_word: כִּי חֹלֶה הוּא
  choice: ఎందుకంటే అతడు జబ్బుపడ్డాడు
  rationale: కారణార్థక సంబంధాన్ని, కుమారుని అనారోగ్య స్థితిని నేరుగా తెలియజేస్తుంది.
- source_word: כָּזֹה וְכָזֶה
  choice: ఇలా ఇలా
  rationale: ఇంకా ఉటంకించని నిర్దిష్ట సందేశాన్ని సూచించే హీబ్రూ సూత్రప్రాయ ప్రయోగాన్ని సంక్షిప్తంగా, పునరుక్తితో నిలుపుతుంది.
- source_word: תְּדַבֵּר אֵלֶיהָ
  choice: నీవు ఆమెతో ... మాట్లాడాలి
  rationale: ఆదేశాత్మక భావాన్ని సహజమైన తెలుగు విధ్యర్థక రూపంలో అందిస్తుంది.
- source_word: וִיהִי כְבֹאָהּ
  choice: ఆమె వచ్చినప్పుడు
  rationale: హీబ్రూ కథన సూత్రాన్ని భారంగా కాకుండా దాని కాలసంబంధ భావంతో అనువదించాం.
- source_word: וְהִיא מִתְנַכֵּרָה
  choice: మారువేషంలో ఉంటుంది
  rationale: తనను గుర్తించకుండా చేసుకోవడం అనే ఆత్మనేపద భావాన్ని స్పష్టంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించిన ఉచ్చారణకు దగ్గరైన తెలుగు రూపంలో నిలిపాం.
- issue: כָּזֹה וְכָזֶה సూచించే సందేశపు విషయం
  choice: విషయం ఇంకా చెప్పబడని నిర్దిష్ట సందేశంగా అస్పష్టతను నిలుపడం
  alternative: తరువాతి వచనాల సందేశాన్ని ఇక్కడే వివరించడం
  rationale: మూల వచనం సందేశం ఉందని సూచిస్తుంది గాని దాని విషయాన్ని ఇక్కడ వెల్లడించదు; అందువల్ల వివరణను పాఠ్యంలోకి దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘చూడు’, ‘అడిగి తెలుసుకోవడానికి’, ‘జబ్బుపడ్డాడు’ వంటి సాధారణ పదాలతో పఠనసౌలభ్యాన్ని కాపాడుతూ, ‘ఇలా ఇలా’ మరియు ‘మారువేషంలో’ ద్వారా మూలంలోని ప్రత్యేక భావాలను నిలిపాం.
