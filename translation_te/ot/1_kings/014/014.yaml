id: 1KI.14.14
reference: 1 Kings 14:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הֵקִים֩ יְהוָ֨ה ל֥/וֹ מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יַכְרִ֛ית אֶת בֵּ֥ית יָרָבְעָ֖ם זֶ֣ה הַ/יּ֑וֹם וּ/מֶ֖ה גַּם עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/014.yaml
  text: And Yahweh will raise up for himself a king over Israel who will cut off the house of Jeroboam this day[a]. But what? Even now.
translation:
  language: te
  text: యాహ్వే తనకోసం ఇశ్రాయేలు మీద ఒక రాజును లేవనెత్తుతాడు. అతడు యెరోబాము వంశాన్ని ఈ రోజే నిర్మూలిస్తాడు[a]. అయితే ఏమిటి? ఇప్పుడే సైతం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ వాక్యాంతం ఆకస్మికంగాను అర్థం చేసుకోవడానికి క్లిష్టంగాను ఉంది; అక్షరార్థంగా, “అయితే ఏమిటి? ఇప్పుడే సైతం.” తీర్పు తక్షణమే సంభవించబోతుందని నొక్కిచెప్పే ఆశ్చర్యోక్తిగా కూడా దీనిని అర్థం చేసుకోవచ్చు: “అయితే ఏమిటి? ఇప్పుడే!” లేదా “ఇంకేముంది? ఇప్పటికే ఇప్పుడే.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵקִים
  choice: లేవనెత్తుతాడు
  rationale: קום హిఫిల్ రూపం దేవుడు ఒక పాలకుణ్ణి రంగంలోకి తీసుకురావడం లేదా నిలబెట్టడం అనే భావాన్ని ఇస్తుంది. ‘లేవనెత్తుతాడు’ నియామక విధానాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా ఆ హీబ్రూ రూపకాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగు లిపిలో దాని సాధారణ లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: לּוֹ
  choice: తనకోసం
  rationale: ఈ సర్వనామ ప్రత్యయం వాక్యకర్త అయిన యాహ్వేనే తిరిగి సూచించడం అత్యంత సహజం; అందువల్ల హీబ్రూ భావం స్పష్టంగా ఉంటుంది.
- source_word: מֶלֶךְ עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుమీద ఒక రాజు
  rationale: రాజ్యపాలన సందర్భంలో עַל అధికారాన్ని సూచిస్తుంది; ‘మీద’ ఆ పాలనా భావాన్ని నిలుపుతుంది.
- source_word: אֲשֶׁר יַכְרִית
  choice: అతడు … నిర్మూలిస్తాడు
  rationale: כרת హిఫిల్ ఇక్కడ పూర్తిగా తొలగించడం లేదా అంతం చేయడం అనే తీర్పు భావాన్ని కలిగిస్తుంది. తెలుగులో ‘నిర్మూలిస్తాడు’ సహజంగా, బలంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: בֵּית יָרָבְעָם
  choice: యెరోబాము వంశం
  rationale: ‘ఇల్లు’ ఇక్కడ కట్టడాన్ని కాక రాజవంశాన్ని లేదా కుటుంబ పరంపరను సూచిస్తుంది. ‘వంశం’ ఆధునిక తెలుగు పాఠకునికి ఈ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: זֶה הַיּוֹם
  choice: ఈ రోజే
  rationale: అక్షరార్థంగా ‘ఈ రోజు’; ‘ఏ’ నొక్కిచెప్పే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּמֶה גַּם עָתָּה
  choice: అయితే ఏమిటి? ఇప్పుడే కూడా.
  rationale: హీబ్రూ ముగింపు ఉద్దేశపూర్వకంగా పరిష్కరించకుండా, దాని ఆకస్మికమైన మరియు సంక్షిప్తమైన స్వరాన్ని ఈ రూపం నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దానిని ఒక బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరించడం మూలంలోని ప్రత్యేకతను కాపాడుతుంది.
- issue: וּמֶה גַּם עָתָּה అనే క్లిష్ట ముగింపును నిర్వహించడం
  choice: అయితే ఏమిటి? ఇప్పుడే కూడా.
  alternative: తీర్పు ఇప్పటికే మొదలైంది.
  rationale: హీబ్రూ వాక్యం వ్యాకరణపరంగా సంక్షిప్తమై, అర్థంలో అనిశ్చితంగా ఉంది. స్పష్టమైన వివరణను మూలంలోకి చేర్చకుండా ఆ అస్పష్టతను, ఆకస్మికతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని వాడాం. ‘లేవనెత్తుతాడు’ వంటి మూలానికి దగ్గరైన పదాన్ని ఉంచుతూ, ‘వంశం’, ‘నిర్మూలిస్తాడు’ వంటి సాధారణ పాఠకునికి స్పష్టమైన పదాలను ఎంచుకున్నాం. క్లిష్టమైన చివరి భాగాన్ని కావాలనే మృదువుగా మార్చలేదు.
