reference: 1 Kings 14:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הַ/יָּמִים֙ אֲשֶׁ֣ר מָלַ֣ךְ יָרָבְעָ֔ם עֶשְׂרִ֥ים וּ/שְׁתַּ֖יִם שָׁנָ֑ה וַ/יִּשְׁכַּב֙ עִם אֲבֹתָ֔י/ו וַ/יִּמְלֹ֛ךְ נָדָ֥ב בְּנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/020.yaml
  text: The days that Jeroboam reigned were twenty-two years. Then he lay down with his fathers[a], and Nadab his son became king in his place.
translation:
  language: te
  text: యెరోబాము రాజుగా పరిపాలించిన కాలం ఇరవై రెండు సంవత్సరాలు. తరువాత అతడు తన పితరులతో నిద్రించాడు[a]. అతని కుమారుడు నాదాబు అతని స్థానంలో రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సంప్రదాయంగా, “తన పితరులతో కూడ నిద్రించాడు.” ఈ హీబ్రూ నుడికారం రాజవంశ వారసత్వ వర్ణనలో అతడు మరణించాడని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ
  choice: రాజుగా పరిపాలించిన కాలం
  rationale: ఇది రాజు పరిపాలన కాలాన్ని సంగ్రహించే హీబ్రూ సూత్రప్రయోగం. ఆరంభ సంధానకర్తను యాంత్రికంగా అనువదించకుండా, ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יָרָבְעָם
  choice: యెరోబాము
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన వ్యక్తినామ లిప్యంతరీకరణ.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: ఇరవై రెండు సంవత్సరాలు
  rationale: హీబ్రూ సంఖ్యా వ్యక్తీకరణకు సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: అతడు తన పూర్వీకులతో కూడ నిద్రించాడు
  rationale: మరణాన్ని సూచించే రాజవంశ చరిత్ర సూత్రప్రయోగంలోని రూపకాన్ని నిలుపుతుంది. ‘చనిపోయాడు’ అని మాత్రమే అనువదిస్తే మూలంలోని రూపకం కనుమరుగవుతుంది; ‘పితరులు’ కంటే ‘పూర్వీకులు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: וַיִּמְלֹךְ נָדָב בְּנוֹ
  choice: అతని కుమారుడు నాదాబు … రాజయ్యాడు
  rationale: ఇక్కడ క్రియ పరిపాలన కొనసాగింపుకన్నా సింహాసనారోహణను సూచిస్తుంది; ‘రాజయ్యాడు’ వారసత్వ మార్పును స్పష్టంగా తెలుపుతుంది.
- source_word: תַּחְתָּיו
  choice: అతని స్థానంలో
  rationale: రాజ్య వారసత్వ సందర్భంలో ఒకరి స్థానాన్ని మరొకరు చేపట్టడాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: రాజుల మరణాన్ని తెలిపే హీబ్రూ సూత్రప్రయోగం
  choice: ‘తన పూర్వీకులతో కూడ నిద్రించాడు’ అనే రూపకాన్ని నిలుపడం
  alternative: ‘చనిపోయాడు’
  rationale: ఇది మరణాన్ని సూచించే కథన సూత్రప్రయోగం; పరలోక స్థితిపై ప్రత్యేక సిద్ధాంత ప్రకటనగా విస్తరించకూడదు. రూపకాన్ని నిలుపుతూ దాని అర్థాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన చారిత్రక కథనశైలి ఉపయోగించబడింది. మూలంలోని రాజపాలన సూత్రప్రయోగం సంక్షిప్తతను, మరణ రూపకాన్ని నిలుపుతూ అస్పష్టతను పాదటిప్పణితో సమతుల్యం చేశాం.
