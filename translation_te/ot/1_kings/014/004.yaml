source:
  edition: WLC
  text: וַ/תַּ֤עַשׂ כֵּן֙ אֵ֣שֶׁת יָרָבְעָ֔ם וַ/תָּ֨קָם֙ וַ/תֵּ֣לֶךְ שִׁלֹ֔ה וַ/תָּבֹ֖א בֵּ֣ית אֲחִיָּ֑ה וַ/אֲחִיָּ֨הוּ֙ לֹֽא יָכֹ֣ל לִ/רְא֔וֹת כִּ֛י קָ֥מוּ עֵינָ֖י/ו מִ/שֵּׂיבֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/004.yaml
  text: Jeroboam’s wife did so. She arose and went to Shiloh[a], and came to Ahijah’s house. Now Ahijah could not see, because his eyes were dim because of his old age.
translation:
  language: te
  text: యరొబాము భార్య అలాగే చేసింది. ఆమె లేచి షిలోహుకు వెళ్లి అహీయా ఇంటికి వచ్చింది. అహీయా వృద్ధాప్యం వల్ల అతని కళ్ల చూపు మందగిపోయి ఉండడంతో చూడలేకపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, “వృద్ధాప్యం వల్ల అతని కళ్లు నిలిచిపోయాయి.” ఇది వయస్సు కారణంగా చూపు మందగించడాన్ని సూచించే జాతీయం.
    reason: మూలంలోని అసాధారణ దృశ్యరూపాన్ని చూపిస్తూ, ప్రధాన పాఠంలోని భావానువాదాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: וַתַּעַשׂ כֵּן
  choice: అతడు చెప్పినట్లే చేసింది
  rationale: ముందటి ఆదేశానికి అనుగుణంగా ఆమె ప్రవర్తించిందనే హెబ్రీ కథన సూత్రార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; సందర్భంలోని పురుషుని ఆదేశాన్ని ‘అతడు చెప్పినట్లు’ స్పష్టం చేస్తుంది.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: యరొబాము భార్య
  rationale: హెబ్రీ సమాస నిర్మాణానికి సరళమైన, సహజ తెలుగు రూపం.
- source_word: וַתָּקָם
  choice: ఆమె లేచి
  rationale: కథనంలోని వరుస చర్యలను నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: וַתֵּלֶךְ שִׁלֹה
  choice: షిలోహుకు వెళ్లి
  rationale: గమ్యాన్ని సూచించే హెబ్రీ రూపాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: וַתָּבֹא בֵּית אֲחִיָּה
  choice: అహీయా ఇంటికి వచ్చింది
  rationale: ఇంటి లోపలికి ప్రవేశించడాన్ని తప్పనిసరిగా నొక్కిచెప్పకుండా, ఆ ఇంటివద్దకు చేరిన భావాన్ని కాపాడుతుంది.
- source_word: לֹא יָכֹל לִרְאוֹת
  choice: చూడలేకపోయాడు
  rationale: సామర్థ్యలేమి మరియు చూడటం అనే క్రియను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: קָמוּ עֵינָיו
  choice: అతని కళ్ల చూపు మందగించి
  rationale: అక్షరార్థంగా ‘అతని కళ్లు నిలిచిపోయాయి’ అనే హెబ్రీ జాతీయాన్ని పదేపదే అనువదించకుండా, వృద్ధాప్యంతో కలిగిన చూపు నష్టాన్ని పాఠకుడికి స్పష్టంగా అందిస్తుంది.
- source_word: מִשֵּׂיבוֹ
  choice: వృద్ధాప్యం వల్ల
  rationale: కారణం లేదా మూలాన్ని సూచించే מִן భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
