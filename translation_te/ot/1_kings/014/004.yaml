revisions:
- from: యరొబాము భార్య అతడు చెప్పినట్లే చేసింది. ఆమె లేచి షిలోహుకు వెళ్లి, అహీయా ఇంటికి వచ్చింది. అహీయా వృద్ధాప్యం వల్ల అతని కళ్ల చూపు మందగించి, చూడలేకపోయాడు.[a]
  to: యరొబాము భార్య అలాగే చేసింది. ఆమె లేచి షిలోహుకు వెళ్లి అహీయా ఇంటికి వచ్చింది. అహీయా వృద్ధాప్యం వల్ల అతని కళ్ల చూపు మందగిపోయి ఉండడంతో చూడలేకపోయాడు.[a]
  rationale: సందర్భం నుంచి ఊహించగల ‘అతడు చెప్పినట్లు’ అనే అదనపు స్పష్టీకరణను తొలగించి, హెబ్రీలోని ‘అలాగే చేసింది’ అనే సూచనాత్మక రూపాన్ని కాపాడాం. అహీయా చూపుకు సంబంధించిన కారణవాక్యాన్ని ఆధునిక ప్రామాణిక తెలుగులో మరింత సహజంగా మార్చాం; పాదటిప్పణిలోని వివరణను పూర్తి అంధత్వాన్ని సూచించకుండా మూలంలోని పరిమిత అస్పష్టతను నిలుపుకునేలా సవరించాం.
