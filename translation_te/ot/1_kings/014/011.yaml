id: 1KI.14.11
reference: 1 Kings 14:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הַ/מֵּ֨ת לְ/יָֽרָבְעָ֤ם בָּ/עִיר֙ יֹאכְל֣וּ הַ/כְּלָבִ֔ים וְ/הַ/מֵּת֙ בַּ/שָּׂדֶ֔ה יֹאכְל֖וּ ע֣וֹף הַ/שָּׁמָ֑יִם כִּ֥י יְהוָ֖ה דִּבֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/011.yaml
  text: Anyone belonging to Jeroboam who dies in the city[a], the dogs will eat; and anyone who dies in the field, the birds of the sky will eat[b], for Yahweh has spoken.
translation:
  language: te
  text: యెరోబాముకు చెందినవారిలో పట్టణంలో చనిపోయే ఎవరినైనా కుక్కలు తింటాయి; యెరోబాముకు చెందినవారిలో పొలంలో చనిపోయే ఎవరినైనా ఆకాశంలోని పక్షులు తింటాయి. ఎందుకంటే యాహ్వే పలికాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמֵּת לְיָרָבְעָם
  choice: యెరోబాముకు చెందినవారిలో పట్టణంలో చనిపోయినవారిని
  rationale: హీబ్రూ నిర్మాణం యెరోబాము ఇంటివారిలో లేదా వంశస్థులలో చనిపోయే ప్రతి వ్యక్తిని సూచిస్తుంది. తెలుగులో సహజంగా ఉండేలా విభజనార్థక భావాన్ని స్పష్టం చేశాం.
- source_word: בָּעִיר
  choice: పట్టణంలో
  rationale: ఇది నిర్దిష్ట ఉపపదంతో ఉన్న సరళమైన స్థలవాచకం; పొలంతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: కుక్కలు తింటాయి
  rationale: אָכַל యొక్క ప్రాథమిక అర్థమైన ‘తిను’ను ఉంచి, మూలంలోని భయంకరమైన చిత్రణకు అదనపు తీవ్రతను జోడించలేదు.
- source_word: וְהַמֵּת בַּשָּׂדֶה
  choice: పొలంలో చనిపోయినవారిని
  rationale: మొదటి భాగానికి సమాంతరంగా అనువదించాం. שָׂדֶהకు నేరమైన ‘పొలం’ అనే అర్థాన్ని ఉంచాం.
- source_word: עוֹף הַשָּׁמָיִם
  choice: ఆకాశ పక్షులు
  rationale: עוֹף సమూహార్థకంగా ఎగిరే జీవులను, సందర్భంలో పక్షులను సూచిస్తుంది; הַשָּׁמָיִםను సహజమైన తెలుగులో ‘ఆకాశ’గా అనువదించాం.
- source_word: כִּי יְהוָה דִּבֵּר
  choice: ఎందుకంటే యాహ్వే పలికాడు
  rationale: כִּי తీర్పు నెరవేరడానికి ఆధారాన్ని తెలియజేస్తుంది. దైవనామాన్ని పేరుగానే ‘యాహ్వే’ అని లిప్యంతరీకరించాం; דִּבֵּרలోని పూర్తయిన, నిశ్చిత ప్రకటన భావాన్ని ‘పలికాడు’ నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలంలో చతురక్షర దైవనామం నేరుగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, ఆధునికంగా విస్తృతంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా ‘యాహ్వే’ అని లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. పట్టణం–పొలం, కుక్కలు–ఆకాశ పక్షులు అనే సమాంతర నిర్మాణాన్ని కాపాడాం.
