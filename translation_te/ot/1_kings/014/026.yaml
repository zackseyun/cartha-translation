- from: అతడు యాహ్వే మందిరంలోని ధననిధులను[a], రాజభవనంలోని ధననిధులను తీసుకుపోయాడు; అన్నిటినీ తీసుకుపోయాడు. సొలొమోను చేయించిన బంగారు డాళ్లన్నిటినీ కూడా తీసుకుపోయాడు.
