source:
  edition: WLC
  text: וַ/יִּקַּ֞ח אֶת אֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֽוֹצְרוֹת֙ בֵּ֣ית הַ/מֶּ֔לֶךְ וְ/אֶת הַ/כֹּ֖ל לָקָ֑ח וַ/יִּקַּח֙ אֶת כָּל מָגִנֵּ֣י הַ/זָּהָ֔ב אֲשֶׁ֥ר עָשָׂ֖ה שְׁלֹמֹֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/026.yaml
  text: He took the treasures of the house of Yahweh and the treasures of the king’s house; he took everything[a]. He also took all the gold shields that Solomon had made.
translation:
  language: te
  text: అతడు యాహ్వే మందిరంలోని నిధులను[a], రాజభవనంలోని నిధులను తీసుకుపోయాడు; అన్నిటినీ తీసుకుపోయాడు. సొలొమోను చేసిన బంగారు డాళ్లన్నిటినీ కూడా తీసుకుపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “యాహ్వే ఇల్లు”; అంటే దేవాలయం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח / לָקָח
  choice: తీసుకుపోయాడు
  rationale: לקח ప్రాథమికంగా ‘తీసుకోవడం’ అని అర్థం. దోపిడీ సందర్భంలో విలువైన వస్తువులను అక్కడి నుంచి తరలించిన భావాన్ని సహజమైన తెలుగులో ‘తీసుకుపోయాడు’ స్పష్టంగా తెలియజేస్తుంది; ‘దోచుకున్నాడు’ వంటి మరింత బలమైన భావాన్ని మూలపాఠానికి మించి చేర్చదు.
- source_word: אֹצְרוֹת
  choice: ధననిధులు
  rationale: ఈ సందర్భంలో ఈ పదం భాండాగార భవనాలను కాకుండా వాటిలోని విలువైన సంపదను సూచిస్తుంది. ‘ధననిధులు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే మందిరం
  rationale: అక్షరార్థం ‘యాహ్వే ఇల్లు.’ సాధారణ తెలుగు పాఠకులకు ఉద్దేశించిన స్థలం దేవాలయమని స్పష్టంగా ఉండేందుకు ‘మందిరం’ వాడి, అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో మార్చకుండా, ఆధునిక తెలుగులో ‘Yahweh’కు సమీపమైన ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: בֵּית הַמֶּלֶךְ
  choice: రాజభవనం
  rationale: అక్షరార్థంగా ‘రాజు ఇల్లు’; ఇక్కడ రాజు నివాసమైన రాజప్రాసాదం ఉద్దేశించబడింది. ‘రాజభవనం’ సహజంగానూ స్పష్టంగానూ ఉంది.
- source_word: וְאֶת הַכֹּל לָקָח
  choice: అన్నిటినీ తీసుకుపోయాడు
  rationale: ఈ సంగ్రహ వాక్యంలోని సంపూర్ణతను, దోపిడీ విస్తృతిని ‘అన్నిటినీ’ నిలుపుతుంది. క్రియ పునరుక్తిని కూడా ఉంచడం ద్వారా హీబ్రూ వాక్యంలోని ఉద్ఘాటన ప్రతిఫలిస్తుంది.
- source_word: מָגִנֵּי הַזָּהָב
  choice: బంగారు డాళ్లు
  rationale: నామవాచక సమాసాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. ‘డాలు’ యుద్ధంలో రక్షణకు పట్టుకునే shield అనే భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: సొలొమోను చేయించిన
  rationale: రాజైన సొలొమోను స్వయంగా తయారు చేశాడని కాక, తన ఆధ్వర్యంలో తయారు చేయించాడనే సహజ సందర్భార్థాన్ని తెలుగులో ‘చేయించిన’ తెలియజేస్తుంది; అవి అతని ఆదేశంతో తయారైనవని గుర్తిస్తుంది.
- source_word: וַיִּקַּח ... וַיִּקַּח
  choice: తీసుకుపోయాడు ... కూడా తీసుకుపోయాడు
  rationale: రెండో క్రియలో ‘కూడా’ చేర్చడం దాని సంయోజక భావాన్ని సహజమైన తెలుగులో చూపుతూ, హీబ్రూలోని పునరుక్త నిర్మాణాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాకుండా ప్రత్యేక దైవనామం ఉంది. అందువల్ల దానిని ‘ప్రభువు’గా ప్రత్యామ్నాయపరచకుండా ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలంలోని వ్యక్తినామాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘తీసుకుపోయాడు’ అనే క్రియను పునరావృతం చేసి మూలంలోని ఉద్ఘాటనను నిలిపాం; ‘రాజభవనం,’ ‘ధననిధులు,’ ‘బంగారు డాళ్లు’ వంటి పదాలు సందర్భాన్ని స్పష్టంగా చేస్తాయి.
