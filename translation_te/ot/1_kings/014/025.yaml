  text: In the fifth year of King Rehoboam[a], Shishak king of Egypt came up against Jerusalem.
translation:
  language: te
  text: రెహబాము రాజ్యపాలన ఐదవ సంవత్సరంలో, ఐగుప్తు రాజు షీషకు యెరూషలేముకు వ్యతిరేకంగా పైకి వచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెరూషలేముపైకి ఎక్కి వచ్చాడు.’ హీబ్రూలో ‘పైకి రావడం’ అనే నుడికారం ప్రముఖ నగరం వైపు సైనికంగా ముందుకు రావడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది కథనంలో కొత్త పరిణామాన్ని పరిచయం చేసే రూపం. ఆధునిక తెలుగులో వాక్య నిర్మాణమే ఆ కథన ప్రవాహాన్ని సహజంగా తెలియజేస్తుంది; ‘అప్పుడు’ వంటి స్పష్టమైన కాలసూచక పదాన్ని చేర్చడం మూలంలో లేని భావాన్ని జోడించవచ్చు.
- source_word: בַּשָּׁנָה הַחֲמִישִׁית לַמֶּלֶךְ רְחַבְעָם
  choice: రాజైన రెహబాము పరిపాలనలో ఐదవ సంవత్సరంలో
  rationale: ఇది రాజ్యపాలనా సంవత్సరాన్ని సూచించే సూత్రబద్ధమైన కాలనిర్దేశం. తెలుగులో ‘పరిపాలనలో’ అని స్పష్టం చేయడం సహజంగా ఉండి హీబ్రూ లామెద్ సూచించే సంబంధాన్ని తెలియజేస్తుంది.
- source_word: עָלָה ... עַל
  choice: మీదికి దండెత్తి వచ్చాడు
  rationale: సైనిక సందర్భంలో ఈ పదబంధం ఒక నగరానికి వ్యతిరేకంగా సైన్యంతో ముందుకు రావడాన్ని సూచిస్తుంది. ‘దండెత్తి వచ్చాడు’ శత్రుత్వ భావాన్ని స్పష్టం చేస్తూనే ‘పైకి రావడం’ అనే దిశాత్మక నుడికారాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: שושק
  choice: షీషకు
  rationale: హీబ్రూ రూపాన్ని అనుసరించిన సంప్రదాయ తెలుగు బైబిలు నామరూపం; ఈజిప్టు చారిత్రక గుర్తింపుపై ఆధారపడిన వేరే రూపాన్ని పాఠ్యంలోకి తీసుకురాలేదు.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: ఐగుప్తు రాజైన
  rationale: షీషకు యొక్క హోదా, రాజ్యాన్ని తెలిపే సమాస పదబంధాన్ని సహజ తెలుగు విశేషణ నిర్మాణంగా అనువదించింది.
- source_word: יְרוּשָׁלִָם
  choice: యెరూషలేము
  rationale: ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన నామరూపాన్ని ఉపయోగించింది.
