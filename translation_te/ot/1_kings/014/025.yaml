  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘దండెత్తి వచ్చాడు’ సైనిక సందర్భాన్ని సాధారణ పాఠకునికి స్పష్టంగా చేస్తుంది; ప్రత్యక్ష దాడి ఇప్పటికే జరిగిందని అతిగా నిర్ధారించదు. పాదసూచిక గుర్తు సంబంధిత క్రియాఖండం తరువాత ఉంచబడింది.
