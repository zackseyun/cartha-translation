  text: ఆ సమయంలో యరొబాము కుమారుడైన అబీయా జబ్బుపడ్డాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: ఆ సమయంలో
  rationale: హీబ్రూ కాలసూచక పదబంధంలోని ‘ఆ సమయంలో’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: חָלָה
  choice: జబ్బుపడ్డాడు
  rationale: ఈ క్రియ అనారోగ్యానికి గురికావడాన్ని సూచిస్తుంది. ‘జబ్బుపడ్డాడు’ వ్యాధి ఆరంభాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲבִיָּה
  choice: అబీయా
  rationale: హీబ్రూ వ్యక్తినామం אֲבִיָּהను తెలుగు ధ్వన్యనుకరణకు అనుగుణంగా రాశాము.
- source_word: בֶן יָרָבְעָם
  choice: యరొబాము కుమారుడైన
  rationale: హీబ్రూ నిర్మాణంలో తెలిపిన తండ్రీకొడుకుల సంబంధాన్ని తెలుగులో సహజమైన విశేషణ నిర్మాణంతో స్పష్టంగా అందిస్తుంది.
