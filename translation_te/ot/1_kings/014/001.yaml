  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని కాలసూచన, వ్యక్తుల సంబంధం, అనారోగ్యం మొదలైన అంశాలను సంక్షిప్తంగా నిలిపింది.
