  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. దీర్ఘ వాక్యాన్ని భావస్పష్టత కోసం మూడు వాక్యాలుగా విభజించగా, తీర్పు, ఉపమానం, దేశం నుండి పెకలింపు, చెదరగొట్టడం, దానికి కారణం అనే మూల క్రమం నిలుపబడింది.
