  text: וְ/הִכָּ֨ה יְהוָ֜ה אֶת יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֨ר יָנ֣וּד הַ/קָּנֶה֮ בַּ/מַּיִם֒ וְ/נָתַ֣שׁ אֶת יִשְׂרָאֵ֗ל מֵ֠/עַל הָ/אֲדָמָ֨ה הַ/טּוֹבָ֤ה הַ/זֹּאת֙ אֲשֶׁ֤ר נָתַן֙ לַ/אֲב֣וֹתֵי/הֶ֔ם וְ/זֵרָ֖/ם מֵ/עֵ֣בֶר לַ/נָּהָ֑ר יַ֗עַן אֲשֶׁ֤ר עָשׂוּ֙ אֶת אֲשֵׁ֣רֵי/הֶ֔ם מַכְעִיסִ֖ים אֶת יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/015.yaml
  text: And Yahweh will strike Israel[a], as a reed sways in the water, and he will uproot Israel from this good land that he gave to their fathers, and scatter them beyond the River, because they made their Asherim[b], provoking Yahweh.
translation:
  language: te
  text: యాహ్వే నీటిలో రెల్లు ఊగినట్లు ఇశ్రాయేలును దెబ్బతీస్తాడు. ఆయన వారి పితరులకు ఇచ్చిన ఈ మంచి దేశం నుండి ఇశ్రాయేలును పెకలించి, నదికి ఆవల[a] వారిని చెదరగొడతాడు. ఎందుకంటే వారు తమ అషేరీము[b] చేసుకొని యాహ్వేకు కోపం రేపారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘నది’ అంటే యూఫ్రటీసు నది.
    reason: హెబ్రీలోని సంప్రదాయికమైన ‘నది’ అనే పదబంధాన్ని ప్రధాన పాఠ్యంలో ఉంచి, దాని చారిత్రక సూచనను వివరిస్తుంది.
  - marker: b
    text: హెబ్రీలో ‘వారి అషేరీము’; అషేరా దేవతతో సంబంధమున్న పూజా వస్తువులు. వీటిని సాధారణంగా చెక్క స్తంభాలు లేదా ప్రతిమలుగా అర్థం చేసుకుంటారు.
    reason: హెబ్రీ పదాన్ని ప్రధాన పాఠ్యంలో లిప్యంతరీకరించి, వస్తువు యొక్క ఖచ్చితమైన రూపం అనిశ్చితమని పాదసూచికలో తెలియజేస్తుంది.
lexical_decisions:
- source_word: וְהִכָּה
  choice: దెబ్బతీస్తాడు
  rationale: ప్రవచన సందర్భంలో ఈ క్రియకు భవిష్యత్ భావం ఉంది. ‘దెబ్బతీస్తాడు’ దైవిక తీర్పును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- source_word: כַּאֲשֶׁר יָנוּד הַקָּנֶה בַּמַּיִם
  choice: నీటిలో రెల్లు ఊగినట్లు ఊగిపోతాడు
  rationale: నీటిలో అస్థిరంగా కదిలే రెల్లు అనే ఉపమానాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది; ఏకవచనమైన ఇశ్రాయేలుకు సరిపోయే క్రియను వాడింది.
- source_word: וְנָתַשׁ
  choice: పెకలించి
  rationale: భూమిలోనుండి వేర్లతో సహా లాగివేయడం అనే వ్యవసాయ రూపకాన్ని నిలుపుతుంది.
- source_word: הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: ఈ మంచి దేశం
  rationale: నిబంధన సందర్భంలో దేవుడు ఇచ్చిన భూభాగాన్ని సూచిస్తున్నందున ‘దేశం’ సహజమైన తెలుగు ఎంపిక.
- source_word: אֲשֶׁר נָתַן לַאֲבוֹתֵיהֶם
  choice: వారి పితరులకు ఇచ్చిన
  rationale: హెబ్రీ మూలంలోని పితృపరంపర భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: וְזֵרָם
  choice: వారిని చెదరగొడతాడు
  rationale: ప్రవాస సందర్భంలో ప్రజలను వివిధ ప్రాంతాలకు చెల్లాచెదురు చేయడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מֵעֵבֶר לַנָּהָר
  choice: నదికి ఆవల
  rationale: మూలంలోని ‘నది’ అనే సంప్రదాయ సూచనను ప్రధాన పాఠ్యంలో నిలిపి, అది యూఫ్రటీసు అని పాదసూచికలో వివరిస్తుంది.
- source_word: עָשׂוּ אֶת אֲשֵׁרֵיהֶם
  choice: తమ అషేరా పూజా చిహ్నాలను చేసుకొని
  rationale: అషేరాతో సంబంధమున్న ఆరాధనా వస్తువులను సూచిస్తుంది; అవి తప్పనిసరిగా స్తంభాలే అని ప్రధాన పాఠ్యంలో నిర్ణయించకుండా మూలంలోని విస్తృతార్థాన్ని కాపాడుతుంది.
- source_word: מַכְעִיסִים אֶת יְהוָה
  choice: యాహ్వేకు కోపం పుట్టించారు
  rationale: వారి విగ్రహారాధన యాహ్వే కోపాన్ని రేపిందనే క్రియార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠ్యంలో వ్యక్తిగత దైవనామం ఉన్నందున దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించింది.
- issue: ‘నది’ దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘నది’ అని ఉంచి, పాదసూచికలో యూఫ్రటీసు అని వివరించడం
  alternative: యూఫ్రటీసు నదికి ఆవల
  rationale: హెబ్రీ పాఠ్యంలోని సంప్రదాయ పదబంధాన్ని నిలుపుతూ ఆధునిక పాఠకుడికి చారిత్రక సూచనను తెలియజేస్తుంది.
- issue: אֲשֵׁרֵיהֶם యొక్క స్వరూపం
  choice: అషేరా పూజా చిహ్నాలు
  alternative: అషేరా స్తంభాలు; అషేరా ప్రతిమలు; అషేరీము
  rationale: ఈ పదం అషేరా దేవతతో సంబంధమున్న ఆరాధనా వస్తువులను సూచిస్తుంది; వాటి ఖచ్చితమైన రూపాన్ని మూలపాఠ్యం ఇక్కడ నిర్దిష్టం చేయనందున వివాదాస్పద వివరాన్ని ప్రధాన పాఠ్యంలో స్థిరపరచలేదు.
