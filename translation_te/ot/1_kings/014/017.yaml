  text: וַ/תָּ֨קָם֙ אֵ֣שֶׁת יָרָבְעָ֔ם וַ/תֵּ֖לֶךְ וַ/תָּבֹ֣א תִרְצָ֑תָ/ה הִ֛יא בָּאָ֥ה בְ/סַף הַ/בַּ֖יִת וְ/הַ/נַּ֥עַר מֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/017.yaml
  text: Then Jeroboam’s wife arose and went and came to Tirzah. As she came to the threshold of the house[a], the boy died.
translation:
  language: te
  text: అప్పుడు యెరోబాము భార్య లేచి వెళ్లి తిర్సాకు చేరుకుంది. ఆమె ఇంటి గడప వద్దకు వచ్చినప్పుడు[a], బాలుడు చనిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమె ఇంటి గడప వద్దకు వస్తుండగా.”
    reason: హీబ్రూ స్వతంత్ర సర్వనామంతో కూడిన కృదంత నిర్మాణాన్ని కాలబిందువుగా ‘వచ్చినప్పుడు’ అని లేదా కొనసాగుతున్న/సమకాలిక చర్యగా ‘వస్తుండగా’ అని అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: וַתָּקָם
  choice: లేచి
  rationale: קום అనే క్రియ యొక్క కథన క్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; కేవలం ప్రయాణం మొదలుపెట్టిందని అతిగా నిర్దిష్టం చేయదు.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: యెరోబాము భార్య
  rationale: హీబ్రూ సంబంధపదబంధాన్ని ఆధునిక తెలుగులో సహజమైన స్వామ్య నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: וַתֵּלֶךְ
  choice: వెళ్లి
  rationale: הלך యొక్క సాధారణ గమనార్థాన్ని నిలుపుతూ, ప్రయాణ విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: וַתָּבֹא תִרְצָתָה
  choice: తిర్సాకు చేరుకుంది
  rationale: దిశను సూచించే రూపం తిర్సా వైపు వెళ్లి అక్కడికి చేరడాన్ని తెలియజేస్తుంది; తెలుగులో ‘చేరుకుంది’ సహజంగా గమ్యస్థానానికి రాకను వ్యక్తపరుస్తుంది.
- source_word: הִיא בָּאָה
  choice: ఆమె ... వస్తుండగా
  rationale: స్వతంత్ర సర్వనామంతో కూడిన కృదంత రూపంలోని కాలసంబంధమైన, కొనసాగుతున్న చర్య భావాన్ని నిలుపుతుంది.
- source_word: בְסַף הַבַּיִת
  choice: ఇంటి గడప దగ్గరకు
  rationale: סַף కు ‘గడప’ ఖచ్చితమైన సాధారణ తెలుగు సమానం. సందర్భంలో గడపను సమీపించడం అనే భావాన్ని ‘దగ్గరకు’ సహజంగా తెలియజేస్తుంది.
- source_word: וְהַנַּעַר
  choice: బాలుడు
  rationale: ఇక్కడ נַעַר యెరోబాము కుమారుణ్ణి సూచిస్తుంది; ‘బాలుడు’ వయస్సును అతిగా నిర్దిష్టం చేయకుండా గౌరవప్రదమైన ఆధునిక పదంగా ఉంటుంది.
- source_word: מֵת
  choice: చనిపోయాడు
  rationale: రూపపరంగా సంపూర్ణ క్రియ అయినప్పటికీ, మునుపటి వాక్యంలోని ప్రవచనం ఆ క్షణంలో నెరవేరిన సంఘటనగా సందర్భం చూపిస్తుంది.
