  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. హీబ్రూ వరుస క్రియల సహజ ప్రవాహాన్ని తెలుగులో ‘లేచి వెళ్లి’ అని ఉంచి, నిర్ణాయక క్షణంలోని కాలసంబంధ అస్పష్టతను పాదటిప్పణిలో నిలిపాం.
