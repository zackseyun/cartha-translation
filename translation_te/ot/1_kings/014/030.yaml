revisions:
- from: రెహబాము, యెరోబాము మధ్య వారి జీవితకాలమంతా[a] యుద్ధం జరిగింది.
  to: రెహబాముకూ యెరోబాముకూ మధ్య వారి కాలమంతా[a] యుద్ధం ఉండేది.
  rationale: The revision retains the Hebrew statement that war existed between the two rulers throughout “all the days,” while avoiding an unnecessary restriction to lifespan alone. It also uses idiomatic Telugu case linkage and a durative expression for the state of war. The footnote remains anchored to the duration phrase and explains the literal Hebrew wording and contextual scope.
