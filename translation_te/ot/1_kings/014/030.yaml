translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. వాక్యారంభంలోని וּ భావాన్ని తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండా సహజ కథన కొనసాగింపుగా వ్యక్తపరచబడింది.
