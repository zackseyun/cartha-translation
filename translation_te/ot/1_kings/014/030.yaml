  text: And there was war between Rehoboam and Jeroboam all their days[a].
translation:
  language: te
  text: రెహబాముకూ యెరోబాముకూ మధ్య వారి కాలమంతా[a] యుద్ధం ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “అన్ని దినాలు.” ఈ హీబ్రూ నుడికారం ఈ విరోధం వారి జీవితకాలమంతా లేదా పాలనాకాలమంతా కొనసాగిందని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִלְחָמָה הָיְתָה
  choice: యుద్ధం జరిగింది
  rationale: מִלְחָמָה ‘యుద్ధం’ అని, היה యొక్క భూతకాల రూపం ఈ సందర్భంలో యుద్ధస్థితి ఉనికిని తెలిపేదిగా అనువదించబడింది. ‘కొనసాగింది’ అని చెప్పడం సాధ్యమైనా, కొనసాగిన కాలాన్ని వాక్యాంతమే స్పష్టం చేస్తుంది.
- source_word: בֵין ... וּ/בֵין
  choice: … మధ్య
  rationale: ఇద్దరు పక్షాల మధ్య పరస్పర విరోధాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: רְחַבְעָם
  choice: రెహబాము
  rationale: హీబ్రూ వ్యక్తినామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: יָרָבְעָם
  choice: యెరోబాము
  rationale: హీబ్రూ వ్యక్తినామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: כָּל הַיָּמִים
  choice: వారి జీవితకాలమంతా
  rationale: అక్షరార్థంగా ‘దినాలన్నీ.’ ఇక్కడ ఇద్దరు రాజుల మధ్య విరోధం వారి జీవితాలు లేదా పాలనాకాలమంతా నిలిచిందనే సందర్భార్థాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది; అసలు పదబంధంలోని సంక్షిప్తతను పాదసూచికలో ఉంచింది.
