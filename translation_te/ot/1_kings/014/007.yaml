id: 1KI.14.7
reference: 1 Kings 14:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לְכִ֞י אִמְרִ֣י לְ/יָרָבְעָ֗ם כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל יַ֛עַן אֲשֶׁ֥ר הֲרִימֹתִ֖י/ךָ מִ/תּ֣וֹךְ הָ/עָ֑ם וָ/אֶתֶּנְ/ךָ֣ נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/007.yaml
  text: 'Go and say to Jeroboam[a], ‘Thus says Yahweh[b], the God of Israel: Because I raised you up from among the people and made you ruler over my people Israel,’'
translation:
  language: te
  text: 'నీవు వెళ్లి యరొబాముతో ఇలా చెప్పు: “ఇశ్రాయేలు దేవుడైన యాహ్వే ఇలా అంటున్నాడు: ఎందుకంటే నేను నిన్ను ప్రజల మధ్యనుండి పైకి లేపి[a], నా ప్రజలైన ఇశ్రాయేలుమీద పాలకునిగా నియమించాను[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిన్ను ఉన్నత స్థితికి చేర్చాను.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పాలకునిగా ఉంచాను.” హీబ్రూలో అక్షరార్థంగా “నాయకునిగా ఇచ్చాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכִי אִמְרִי
  choice: నీవు వెళ్లి ... ఇలా చెప్పు
  rationale: స్త్రీలింగ ఏకవచన ఆజ్ఞారూపాలను సందర్భానుసారంగా సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לְיָרָבְעָם
  choice: యరొబాముతో
  rationale: మాటను అందుకోవలసిన వ్యక్తిని తెలుగులో సహజంగా సూచించే రూపం.
- source_word: כֹּה אָמַר
  choice: ఇలా అంటున్నాడు
  rationale: ప్రవక్త సందేశ సూత్రాన్ని స్పష్టంగా, ప్రస్తుత తెలుగు వాడుకకు తగినట్లు అందిస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరిస్తుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంలో నిలుపుతుంది.
- source_word: יַעַן אֲשֶׁר
  choice: —
  rationale: ఈ కారణసూచక పదబంధం తరువాతి వచనాల్లో పూర్తయ్యే తీర్పు వాక్యానికి ఆధారం. ఈ వచనం ఒక్కటిగా ఇచ్చినప్పుడు అసహజమైన ‘ఎందుకంటే’తో ముగించకుండా, ఉద్ధరణ కొనసాగుతుందనే భావాన్ని విరామచిహ్నాల ద్వారా ఉంచాం.
- source_word: הֲרִימֹתִיךָ
  choice: నిన్ను ... పైకి లేపి
  rationale: సామాజిక-రాజకీయ స్థాయికి హెచ్చించడాన్ని తెలిపే మూల రూపకాన్ని నిలుపుతుంది.
- source_word: מִתּוֹךְ הָעָם
  choice: ప్రజల మధ్యనుండి
  rationale: ప్రజలలోనుండి ఎంపిక చేసి పైకి తేవడం అనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וָאֶתֶּנְךָ נָגִיד
  choice: నాయకునిగా నియమించాను
  rationale: అక్షరార్థంగా ‘నాయకునిగా ఇచ్చాను’; సందర్భంలోని అధికార నియామక భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: నా ప్రజలైన ఇశ్రాయేలుమీద
  rationale: దైవ సంబంధాన్ని తెలిపే ‘నా ప్రజలు’ అనే భావాన్నీ, పాలనా పరిధినీ కాపాడుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవ నామం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవ నామం నేరుగా ఉంది; అందువల్ల దానిని బిరుదుగా మార్చకుండా సాధారణ తెలుగు లిప్యంతరీకరణతో ఇచ్చాం.
- issue: נָגִיד యొక్క రాజकीय-పాలనా భావం
  choice: నాయకుడు
  alternative: పాలకుడు; అధిపతి; రాజకుమారుడు
  rationale: ఈ పదం దేవుడు అధికార స్థానంలో ఉంచిన వ్యక్తిని సూచిస్తుంది. ‘నాయకుడు’ మూలంలోని విస్తృత అర్థాన్ని నిలుపుతుంది; ‘రాజకుమారుడు’ వంశపారంపర్య భావాన్ని అనవసరంగా చేర్చవచ్చు.
- issue: יַעַן אֲשֶׁר కారణ నిర్మాణం
  choice: తెలుగు వాక్యంలో బహిరంగ కారణసూచక పదం లేకుండా కొనసాగుతున్న ఉద్ధరణగా చూపడం
  alternative: ‘నేను ... చేశాను గనుక’ లేదా ‘ఎందుకంటే నేను ...’
  rationale: హీబ్రూ కారణ వాక్యం తరువాతి తీర్పుకు ఆధారంగా కొనసాగుతుంది. వచనాన్ని ఒంటరిగా చదివేటప్పుడు తప్పుదారి పట్టించే సంపూర్ణ కారణ-ఫలిత సంబంధాన్ని సృష్టించకుండా దాని అపూర్ణ కొనసాగింపును కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన ప్రవక్త సందేశ ధోరణిని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడాం. మూలంలోని స్త్రీలింగ ఆజ్ఞ తెలుగు క్రియలో స్పష్టంగా కనిపించనందున ‘నీవు’ చేర్చాం. ఉద్ధరణ స్థరాలను ద్వంద్వ, ఏక ఉద్ధరణ చిహ్నాలతో చూపాం.
