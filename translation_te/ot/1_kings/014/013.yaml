source:
  edition: WLC
  text: וְ/סָֽפְדוּ ל֤/וֹ כָל יִשְׂרָאֵל֙ וְ/קָבְר֣וּ אֹת֔/וֹ כִּֽי זֶ֣ה לְ/בַדּ֔/וֹ יָבֹ֥א לְ/יָרָבְעָ֖ם אֶל קָ֑בֶר יַ֣עַן נִמְצָא ב֞/וֹ דָּבָ֣ר ט֗וֹב אֶל יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל בְּ/בֵ֥ית יָרָבְעָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/013.yaml
  text: All Israel will mourn for him and bury him[a], because he alone of Jeroboam’s house will come to the grave, since in him something good toward Yahweh, the God of Israel[c][b], has been found in the house of Jeroboam.
translation:
  language: te
  text: ఇశ్రాయేలీయులందరూ అతని కోసం దుఃఖించి, అతన్ని పాతిపెడతారు; ఎందుకంటే యెరోబాము ఇంటివారిలో ఇతడు ఒక్కడే సమాధి పొందుతాడు[a]. యెరోబాము ఇంటివారిలో ఇశ్రాయేలు దేవుడైన యాహ్వే పట్ల ఏదో మంచి ఇతనిలో కనిపించింది కాబట్టి[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో అక్షరార్థ నిర్మాణం, “ఇతడు ఒక్కడే యెరోబాముకు, సమాధికి వస్తాడు.” సందర్భంలో దీని భావం: యెరోబాము ఇంటివారిలో ఇతనికి మాత్రమే సమాధి లభిస్తుంది.'
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఒక మంచి విషయం.”
    reason: lexical_alternative
  - marker: c
    text: హీబ్రూలో “యాహ్వే వైపు” లేదా “యాహ్వే పట్ల.” ఇది యాహ్వే వైపు మళ్లిన స్వభావాన్ని గానీ, ఆయనకు సంబంధించి మంచిదైన గుణాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפְדוּ לוֹ
  choice: అతని కోసం దుఃఖించి
  rationale: ספד మృతుని గురించి శోకించడం లేదా విలపించడం అనే అర్థం ఇస్తుంది. ఆధునిక తెలుగులో ‘దుఃఖించడం’ సహజంగా ఉండి, ప్రజల శోకాన్ని అతిశయోక్తి లేకుండా తెలియజేస్తుంది.
- source_word: וְקָבְרוּ אֹתוֹ
  choice: అతన్ని పాతిపెడతారు
  rationale: హీబ్రూ క్రియ కర్మప్రత్యయంతో నేరుగా ‘అతన్ని పాతిపెడతారు’ అని అర్థమిస్తుంది.
- source_word: כִּי זֶה לְבַדּוֹ
  choice: ఇతడు ఒక్కడే
  rationale: ఈ పదబంధం ప్రత్యేకతను నొక్కిచెబుతుంది; యెరోబాము ఇంటిలోని ఇతరులతో ఉన్న వ్యత్యాసాన్ని ‘ఒక్కడే’ స్పష్టంగా నిలుపుతుంది.
- source_word: יָבֹא לְיָרָבְעָם אֶל־קָבֶר
  choice: యెరోబాము ఇంటివారిలో ఇతడు ఒక్కడే సమాధికి చేరుతాడు
  rationale: అక్షరార్థ నిర్మాణం తెలుగులో అసహజంగా ఉంటుంది. సందర్భంలో యెరోబాము వంశంలో ఇతనికి మాత్రమే పాతిపెట్టబడే గౌరవం దక్కుతుందనే భావాన్ని ఈ రూపం తెలియజేస్తుంది; అక్షరార్థ అస్పష్టతను పాదసూచికలో ఉంచింది.
- source_word: קָבֶר
  choice: సమాధి
  rationale: ఇక్కడ నామవాచకం పాతిపెట్టే సమాధి లేదా గోరీని సూచిస్తుంది. ‘సమాధికి చేరడం’ గౌరవప్రదమైన పాతిపెట్టడాన్ని సహజంగా సూచిస్తుంది.
- source_word: יַעַן
  choice: ఎందుకంటే
  rationale: ఈ పదం ముందున్న ప్రకటనకు కారణాన్ని పరిచయం చేస్తుంది; ‘ఎందుకంటే’ స్పష్టమైన కారణార్థక అనుసంధానం.
- source_word: נִמְצָא בוֹ
  choice: ఇతనిలోనే ... కనిపించింది
  rationale: నిఫాల్ రూపం ఒక మంచి లక్షణం ఇతనిలో కనుగొనబడిందని సూచిస్తుంది. ‘కనిపించింది’ తెలుగులో సహజంగా ఉండి, అది గుర్తించబడిన భావాన్ని నిలుపుతుంది.
- source_word: דָּבָר טוֹב
  choice: ఏదో మంచి
  rationale: ఈ పదబంధం నిర్దిష్టంగా నిర్వచించని మంచి లక్షణం లేదా విషయం గురించి చెబుతుంది. ‘ఏదో మంచి’ దాని అనిర్దిష్టతను కాపాడుతుంది.
- source_word: אֶל יְהוָה
  choice: యాహ్వే పట్ల
  rationale: אֶל ఇక్కడ యాహ్వే వైపు మొగ్గు లేదా ఆయనకు సంబంధించిన అనుకూల గుణాన్ని సూచించవచ్చు. ‘పట్ల’ ఆ సంబంధ దిశను నిలుపుతూ, అది దేవునికి ఇష్టమైనదని మాత్రమే నిర్ణయించదు.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించింది.
- source_word: בְּבֵית יָרָבְעָם
  choice: యెరోబాము ఇంటివారిలో
  rationale: ‘ఇల్లు’ ఇక్కడ గృహం కంటే కుటుంబం లేదా వంశాన్ని సూచిస్తుంది. ‘ఇంటివారు’ ఆధునిక తెలుగులో ఆ సామూహిక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా
  rationale: మూలపాఠంలో చతురక్షర దైవనామం ప్రత్యక్షంగా ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుగా మార్చకుండా ‘యాహ్వే’గా ఇవ్వడం వ్యక్తిగత నామాన్ని నిలుపుతుంది.
- issue: אֶל־יְהוָה తో సంబంధమున్న ‘మంచి’ యొక్క స్వభావం
  choice: యాహ్వే పట్ల ఏదో మంచి
  alternative: యాహ్వేకు ఇష్టమైన ఏదో మంచి
  rationale: హీబ్రూ אֶל దిశ లేదా సంబంధాన్ని తెలియజేస్తుంది; అది దేవుని పట్ల ఉన్న వైఖరినా, ఆయన దృష్టిలో ప్రసన్నమైన గుణమా అన్నది పూర్తిగా నిర్ధారించదు. అందువల్ల మరింత వ్యాఖ్యానాత్మకమైన ప్రత్యామ్నాయాన్ని ప్రధాన పాఠంలో ఎంచుకోలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ప్రవచన వాక్యానికి తగిన గంభీరతతో రూపొందించబడింది. ‘ఇంటివారు’ కుటుంబ/వంశ భావాన్ని సహజంగా అందిస్తుంది. మూలంలోని אֶל־יְהוָה అస్పష్టతను ప్రధాన పాఠం మరియు పాదసూచికలో ఉద్దేశపూర్వకంగా నిలిపింది.
