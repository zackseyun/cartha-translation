revisions:
- from: ఇశ్రాయేలీయులందరూ అతని కోసం దుఃఖించి, అతన్ని పాతిపెడతారు. యెరోబాము ఇంటివారిలో ఇతడు ఒక్కడే సమాధికి చేరుతాడు[a]. ఎందుకంటే యెరోబాము ఇంటివారిలో ఇతనిలోనే ఇశ్రాయేలు దేవుడైన యాహ్వే పట్ల ఏదో మంచి[b][c] కనిపించింది.
  to: ఇశ్రాయేలీయులందరూ అతని కోసం దుఃఖించి, అతన్ని పాతిపెడతారు; ఎందుకంటే యెరోబాము ఇంటివారిలో ఇతడు ఒక్కడే సమాధి పొందుతాడు[a]. యెరోబాము ఇంటివారిలో ఇశ్రాయేలు దేవుడైన యాహ్వే పట్ల ఏదో మంచి ఇతనిలో కనిపించింది కాబట్టి[b][c].
  rationale: The revision removes the unexpressed exclusive particle from the statement that good was found in him, clarifies that the exclusive ‘coming to the grave’ concerns receiving burial, and retains the source’s ambiguity concerning what the good thing is and how it relates to Yahweh. All existing footnote anchors are retained and their content is aligned with the revised wording.
