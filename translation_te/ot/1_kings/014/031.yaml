  text: וַ/יִּשְׁכַּ֨ב רְחַבְעָ֜ם עִם אֲבֹתָ֗י/ו וַ/יִּקָּבֵ֤ר עִם אֲבֹתָי/ו֙ בְּ/עִ֣יר דָּוִ֔ד וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָ/עַמֹּנִ֑ית וַ/יִּמְלֹ֛ךְ אֲבִיָּ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/031.yaml
  text: And Rehoboam slept with his fathers and was buried with his fathers in the city of David[a]. And his mother's name was Naamah the Ammonite[b]. And Abijam his son reigned in his place.
translation:
  language: te
  text: రెహబాము తన పితరులతో కూడ నిద్రించాడు; దావీదు పట్టణంలో తన పితరులతోపాటు పాతిపెట్టబడ్డాడు. అతని తల్లి పేరు అమ్మోనీయురాలైన నయమా[a]. అతని కుమారుడు అబీయాము[b] అతని స్థానంలో రాజయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ఇక్కడ స్త్రీలింగ జాతివాచక పదం ఉంది; నయమా అమ్మోను జాతికి చెందిన స్త్రీ అని అది స్పష్టంగా తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: మరికొన్ని వచనాల్లో ఇదే రాజును ‘అబీయా’ అని పిలుస్తారు; ఈ వచనంలోని హీబ్రూ పాఠంలో మాత్రం ‘అబీయాము’ అనే రూపం ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: తన పితరులతో కూడ నిద్రించాడు
  rationale: రాజుల మరణవార్తల్లో వాడే ‘పితరులతో నిద్రించడం’ అనే హీబ్రూ సూత్రప్రాయ ప్రయోగాన్ని నిలుపుతుంది; దాన్ని కేవలం ‘చనిపోయాడు’ అని వ్యాఖ్యానాత్మకంగా మార్చదు.
- source_word: וַיִּקָּבֵר עִם אֲבֹתָיו
  choice: తన పితరులతోపాటు పాతిపెట్టబడ్డాడు
  rationale: קבר క్రియలోని కర్మణి భావాన్ని, రాజవంశ సమాధి సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: בְּעִיר דָּוִד
  choice: దావీదు పట్టణంలో
  rationale: స్థలనామ ప్రయోగాన్ని స్పష్టంగా, సంప్రదాయబద్ధంగా అందిస్తుంది.
- source_word: נַעֲמָה הָעַמֹּנִית
  choice: అమ్మోనీయురాలైన నయమా
  rationale: హీబ్రూలోని స్త్రీలింగ జాతివాచక రూపాన్ని తెలుగు ‘అమ్మోనీయురాలు’ అనే సహజ రూపంతో స్పష్టంగా నిలుపుతుంది.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: అతని స్థానంలో రాజయ్యాడు
  rationale: రాజ్య వారసత్వాన్ని సూచించే హీబ్రూ సూత్రప్రాయ వాక్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אֲבִיָּם
  choice: అబీయాము
  rationale: ఈ వచనంలోని అబీయామ్ అనే పేరురూపాన్నే ప్రతిబింబిస్తుంది; ఇతర చోట్ల కనిపించే అబీయా రూపంతో సమానీకరించదు.
theological_decisions:
- issue: ‘పితరులతో నిద్రించాడు’ అనే మరణ రూపకం
  choice: రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: చనిపోయాడు
  rationale: మూలంలోని రాజవంశ మరణ సూత్రాన్ని, దాని భావసూక్ష్మతను వ్యాఖ్యానంతో తొలగించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; రాజవంశ చరిత్రకు తగిన గౌరవభరితమైన శైలి. ‘పితరులతో కూడ నిద్రించాడు’ అనే బైబిలు సూత్రప్రాయ రూపకాన్ని నిలుపుతూ, మిగతా వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా ఉంచింది. మూలంలోని సమాచారానికి సరిపోయేలా పాదసూచిక [a]ను నయమా జాతిగుర్తింపుకు, [b]ను అబీయాము పేరురూపానికి జతచేసింది.
