    rationale: ‘నేను ... కఠినమైనదానిగా పంపబడ్డాను’ అనేది కఠినత్వం పంపబడిన వ్యక్తికి చెందిందన్న భావాన్ని కలిగించవచ్చు. కాశా సూచితమైన స్త్రీలింగ నామవాచకాన్ని—సందేశం లేదా వార్తను—వర్ణిస్తుంది.
