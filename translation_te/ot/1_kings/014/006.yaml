source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ אֲחִיָּ֜הוּ אֶת ק֤וֹל רַגְלֶ֨י/הָ֙ בָּאָ֣ה בַ/פֶּ֔תַח וַ/יֹּ֕אמֶר בֹּ֖אִי אֵ֣שֶׁת יָרָבְעָ֑ם לָ֣/מָּה זֶּ֗ה אַ֚תְּ מִתְנַכֵּרָ֔ה וְ/אָ֣נֹכִ֔י שָׁל֥וּחַ אֵלַ֖יִ/ךְ קָשָֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/006.yaml
  text: And when Ahijah heard the sound of her feet as she came in at the doorway[a], he said, “Come in, wife of Jeroboam[b]. Why are you disguising yourself? For I am sent to you with a hard message.”
translation:
  language: te
  text: అహీయా ఆమె గుమ్మంలోకి వస్తుండగా ఆమె అడుగుల చప్పుడు విని, “యెరోబాము భార్యా, లోపలికి రా. నీవెందుకు మారువేషం వేసుకున్నావు?[a] నేను నీ దగ్గరికి కఠినమైన సందేశంతో పంపబడ్డాను[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవెందుకు వేరొకరిగా నటిస్తున్నావు?”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “నేను నీ దగ్గరికి కఠినమైనది పంపబడ్డాను” అనే సంక్షిప్త భావం. హీబ్రూలో నామవాచకం చెప్పబడలేదు; తీవ్రమైన సందేశం లేదా వార్త ఉద్దేశించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל רַגְלֶיהָ
  choice: ఆమె అడుగుల చప్పుడు
  rationale: హీబ్రూ పదచిత్రాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా వినిపించే వ్యక్తీకరణ.
- source_word: בָּאָה בַפֶּתַח
  choice: ఆమె గుమ్మంలోకి వస్తుండగా
  rationale: ప్రవేశద్వారం వద్ద లోపలికి వస్తున్న కొనసాగుతున్న చర్యను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; פֶּתַח‌ను తలుపు పలకగా కాక ప్రవేశస్థలంగా గ్రహిస్తుంది.
- source_word: בֹּאִי
  choice: లోపలికి రా
  rationale: స్త్రీని ఉద్దేశించిన ఏకవచన ఆజ్ఞను సందర్భానుకూలమైన సాధారణ తెలుగులో అందిస్తుంది.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: యెరోబాము భార్యా
  rationale: ప్రత్యక్ష సంబోధనను స్పష్టంగా, సహజంగా ఉంచుతుంది.
- source_word: לָמָּה זֶּה אַתְּ מִתְנַכֵּרָה
  choice: నీవెందుకు మారువేషం వేసుకున్నావు?
  rationale: నכר హిత్పయేల్ రూపం ఇక్కడ తనను గుర్తుపట్టలేనట్లు చేసుకోవడం లేదా వేరొకరిగా కనిపించడం అనే భావాన్ని ఇస్తుంది; కథా సందర్భంలో ‘మారువేషం’ సూటిగా సరిపోతుంది.
- source_word: שָׁלוּחַ אֵלַיִךְ
  choice: నేను నీ దగ్గరికి ... పంపబడ్డాను
  rationale: హీబ్రూ నిష్క్రియాత్మక కృదంతంలోని పంపబడిన స్థితిని నిలుపుతుంది; పంపిన వ్యక్తిని వాక్యంలో అదనంగా పేర్కొనదు.
- source_word: קָשָׁה
  choice: కఠినమైన సందేశంతో
  rationale: హీబ్రూలో నామవాచకం లేకుండా ఉన్న విశేషణాన్ని తెలుగులో అర్థవంతం చేయడానికి ‘సందేశం’ చేర్చబడింది; ‘కఠినమైన’ అనే పదం మూలంలోని సంక్షిప్తతను, తీవ్రతను నిలుపుతుంది.
theological_decisions:
- issue: קָשָׁה తర్వాత సూచితంగా ఉన్న నామవాచకం
  choice: కఠినమైన సందేశంతో
  alternative: దుఃఖకరమైన వార్తతో; కఠినమైన విషయంతో
  rationale: హీబ్రూ నామవాచకాన్ని స్పష్టంగా చెప్పదు. ప్రవక్త సందర్భంలో తీవ్రమైన వర్తమానం సూచితమైనా, ‘సందేశం’ అనేది దానిని ప్రత్యేకమైన సిద్ధాంతపరమైన వర్గంగా మార్చకుండా అర్థాన్ని తెలిపే మితమైన పూరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘గుమ్మం,’ ‘అడుగుల చప్పుడు,’ ‘మారువేషం’ వంటి సాధారణంగా అర్థమయ్యే పదాలు ఎంచుకోబడ్డాయి. మూలంలోని నిష్క్రియాత్మక ‘పంపబడ్డాను’ మరియు చివరి పదంలోని ఉద్దేశపూర్వక అసంపూర్ణతను పాదసూచిక ద్వారా నిలుపుకున్నాం.
