  to: 'యెరోబాము తన భార్యతో ఇలా అన్నాడు: “దయచేసి లేచి, మారువేషం వేసుకో; నీవు యెరోబాము భార్యవని వారు గుర్తించకుండా[a] షిలోహుకు వెళ్లు. ఇదిగో, అహీయా ప్రవక్త అక్కడ ఉన్నాడు. ఈ ప్రజలకు నేను రాజును అవుతానని నా గురించి చెప్పినవాడు[b] ఆయనే.”'
