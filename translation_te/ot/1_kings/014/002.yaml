id: 1KI.14.2
reference: 1 Kings 14:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יָרָבְעָ֜ם לְ/אִשְׁתּ֗/וֹ ק֤וּמִי נָא֙ וְ/הִשְׁתַּנִּ֔ית וְ/לֹ֣א יֵֽדְע֔וּ כִּי אתי אֵ֣שֶׁת יָרָבְעָ֑ם וְ/הָלַ֣כְתְּ שִׁלֹ֗ה הִנֵּה שָׁם֙ אֲחִיָּ֣ה הַ/נָּבִ֔יא הֽוּא דִבֶּ֥ר עָלַ֛/י לְ/מֶ֖לֶךְ עַל הָ/עָ֥ם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/002.yaml
  text: Jeroboam said to his wife[a], “Please get up and disguise yourself, so that they will not know that you are the wife of Jeroboam, and go to Shiloh. Behold, Ahijah the prophet is there; he is the one who spoke concerning me[b], that I would be king over this people.”
translation:
  language: te
  text: 'యెరోబాము తన భార్యతో ఇలా అన్నాడు: “దయచేసి లేచి, మారువేషం వేసుకో; నీవు యెరోబాము భార్యవని వారు గుర్తించకుండా[a] షిలోహుకు వెళ్లు. ఇదిగో, అహీయా ప్రవక్త అక్కడ ఉన్నాడు. ఈ ప్రజలకు నేను రాజును అవుతానని నా గురించి చెప్పినవాడు[b] ఆయనే.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత పదశఃగా: “నీవు యెరోబాము భార్యవని వారు తెలుసుకోరు.” హీబ్రూలో ‘వారు’ ఎవరనే విషయం నిర్దిష్టంగా లేదు.'
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: “ఈ ప్రజలకు రాజును కావడానికి నా గురించి చెప్పినవాడు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יָרָבְעָם לְאִשְׁתּוֹ
  choice: యెరోబాము తన భార్యతో ఇలా అన్నాడు
  rationale: హీబ్రూ కథన క్రియను సహజమైన ఆధునిక తెలుగు కథన శైలిలో అందించి, לְאִשְׁתּוֹ లోని వైవాహిక సంబంధాన్ని స్పష్టంగా నిలిపింది.
- source_word: קוּמִי נָא
  choice: దయచేసి లేచి
  rationale: స్త్రీలింగ ఏకవచన ఆజ్ఞతో పాటు נָא లోని అభ్యర్థనా మర్యాదను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהִשְׁתַּנִּית
  choice: మారువేషం వేసుకుని
  rationale: సందర్భంలో హిత్పయేల్ రూపం తన రూపాన్ని గుర్తుపట్టలేనట్లు మార్చుకోవడాన్ని సూచిస్తుంది; ఈ భావానికి ‘మారువేషం వేసుకుని’ సహజమైన తెలుగు సమానం.
- source_word: וְלֹא יֵדְעוּ כִּי אַתְּ אֵשֶׁת יָרָבְעָם
  choice: నీవు యెరోబాము భార్యవని వారు గుర్తుపట్టకుండా
  rationale: వేషం మార్చుకోవాలనే ఆజ్ఞకు ఉద్దేశాన్ని తెలుగులో సహజంగా చూపుతుంది. హీబ్రూలో కర్త నిర్దిష్టంగా చెప్పబడనందున ‘వారు’ అని నిర్దిష్ట గుర్తింపులేకుండా ఉంచింది.
- source_word: וְהָלַכְתְּ שִׁלֹה
  choice: షిలోహుకు వెళ్లు
  rationale: ఆజ్ఞను అనుసరించే వావ్-పర్ఫెక్ట్ ఇక్కడ ఆజ్ఞాత్మక క్రమాన్ని కలిగి ఉంది; తెలుగులో ప్రత్యక్ష ఆజ్ఞ సహజం.
- source_word: הִנֵּה שָׁם
  choice: ఇదిగో, ... అక్కడ ఉన్నాడు
  rationale: הִנֵּה లోని శ్రద్ధ ఆకర్షించే సూచనాత్మక బలాన్ని ఆధునిక తెలుగు ‘ఇదిగో’ నిలుపుతుంది.
- source_word: אֲחִיָּה הַנָּבִיא
  choice: అహీయా ప్రవక్త
  rationale: వ్యక్తి పేరును తెలుగు లిప్యంతరీకరణలో ఇచ్చి, బిరుదును సాధారణ తెలుగు పదంతో అనువదించింది.
- source_word: הוּא דִבֶּר
  choice: చెప్పినవాడు ఆయనే
  rationale: స్వతంత్ర సర్వనామం הוּא ఇచ్చే ఉద్ఘాటనను తెలుగు వాక్యాంతంలోని ‘ఆయనే’ ద్వారా నిలిపింది.
- source_word: עָלַי לְמֶלֶךְ עַל הָעָם הַזֶּה
  choice: ఈ ప్రజల మీద నేను రాజవుతానని నా గురించి
  rationale: עָלַי ను ‘నా గురించి’గా ఉంచి, לְמֶלֶךְ ను యెరోబాము రాజుగా కావడాన్ని సూచించే వాక్యంగా సహజీకరించింది; సాధ్యమైన మరింత పదశః నిర్మాణాన్ని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: అహీయా మాటలో యెరోబాము రాజత్వానికి సంబంధించిన לְמֶלֶךְ నిర్మాణం
  choice: ఈ ప్రజల మీద నేను రాజవుతానని నా గురించి చెప్పినవాడు
  alternative: ఈ ప్రజల మీద రాజుగా ఉండడానికి నా గురించి చెప్పినవాడు
  rationale: ప్రధాన పాఠ్యం సందర్భానుసారంగా యెరోబాము రాజుగా నియమించబడబోవడాన్ని సహజమైన తెలుగులో చెబుతుంది; అయితే హీబ్రూ లామెడ్ నిర్మాణంలోని సంక్షిప్తతను, వ్యాకరణ విస్తృతిని ప్రత్యామ్నాయంగా పాదసూచికలో భద్రపరిచింది. ఎటువంటి ప్రత్యేక సిద్ధాంత వ్యాఖ్యానాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి వాడబడింది. ‘లెమ్ము’ వంటి ప్రాచీన రూపాల బదులు ‘లేచి’, ‘వెళ్లు’ వంటి ప్రస్తుత రూపాలు ఎంచుకోబడ్డాయి; ‘ఇదిగో’ ద్వారా హీబ్రూ సూచనాత్మక ఉద్ఘాటన నిలుపబడింది.
