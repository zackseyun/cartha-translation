    rationale: అది అర్థమవుతున్నా, ‘ఈ ప్రజలకు నేను రాజును అవుతానని’ ఆధునిక ప్రామాణిక తెలుగులో మరింత సహజం; ప్రజలపై రాజ్యాధికారం అనే మూలార్థాన్ని కూడా నిలుపుతుంది.
