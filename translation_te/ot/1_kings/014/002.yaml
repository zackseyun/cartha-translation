    rationale: హీబ్రూలో ముందుగా లేవడం, వేషం మార్చుకోవడం, గుర్తించకపోవడం, ఆపై షిలోహుకు వెళ్లడం వస్తాయి. సవరించిన తెలుగు ఈ క్రమాన్ని స్పష్టంగా ప్రతిఫలిస్తుంది.
