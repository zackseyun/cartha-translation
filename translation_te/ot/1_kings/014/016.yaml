source:
  edition: WLC
  text: וְ/יִתֵּ֖ן אֶת יִשְׂרָאֵ֑ל בִּ/גְלַ֞ל חַטֹּ֤אות יָֽרָבְעָם֙ אֲשֶׁ֣ר חָטָ֔א וַ/אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/016.yaml
  text: And he will give up Israel because of the sins of Jeroboam[a], which he committed and by which he caused Israel to sin.
translation:
  language: te
  text: యెరోబాము చేసిన పాపాలవల్లను, అతడు ఇశ్రాయేలును పాపం చేయించినందువల్లను ఆయన ఇశ్రాయేలును అప్పగిస్తాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా ‘ఇస్తాడు.’ ఇక్కడ తీర్పు సందర్భంలో ఒక ప్రజను విపత్తుకు లేదా శత్రువుల చేతికి అప్పగించడం అనే భావంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֵּן
  choice: ఆయన … అప్పగిస్తాడు
  rationale: נתן అనే క్రియకు అక్షరార్థంగా ‘ఇస్తాడు’ అని అర్థం. ఇక్కడ తీర్పు సందర్భంలో అది ఇశ్రాయేలును విపత్తుకు లేదా శత్రువుల చేతికి అప్పగించడాన్ని సూచిస్తుంది. ఈ వాక్యంలో ఆ విపత్తు సాధనం స్పష్టంగా చెప్పబడనందున దానిని అనువాదంలో చేర్చలేదు.
- source_word: אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును
  rationale: ఇది ప్రత్యక్ష కర్మగా ఉన్న జాతి పేరు; ఈ సందర్భంలో ఉత్తర రాజ్య ప్రజలను సమష్టిగా సూచిస్తుంది.
- source_word: בִּגְלַל
  choice: కారణంగా
  rationale: ఈ పదబంధం తీర్పుకు కారణాన్ని తెలియజేస్తుంది; ఆధునిక తెలుగులో ‘కారణంగా’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: חַטֹּאות יָרָבְעָם
  choice: యెరోబాము … పాపాలు
  rationale: బహువచన రూపాన్ని ‘పాపాలు’గా నిలిపి, వ్యక్తి పేరును ప్రాజెక్టు లిప్యంతరీకరణ పద్ధతికి అనుగుణంగా ‘యెరోబాము’గా ఇచ్చాం.
- source_word: אֲשֶׁר חָטָא
  choice: తాను చేసిన
  rationale: సంబంధ వాక్యం యెరోబాము స్వయంగా చేసిన పాపాలను సూచిస్తుంది. తెలుగులో ‘తాను చేసిన పాపాలు’ సహజంగా ఉండి అతని వ్యక్తిగత బాధ్యతను నిలుపుతుంది.
- source_word: וַאֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలుతో చేయించిన
  rationale: חטא యొక్క హిఫీల్ రూపం కారణార్థకమైనది—‘పాపం చేయించు.’ ‘ఇశ్రాయేలుతో చేయించిన పాపాలు’ అనే నిర్మాణం యెరోబాము ప్రజలను పాపంలో నడిపించిన భావాన్ని సంక్షిప్తంగా కాపాడుతుంది.
theological_decisions:
- issue: దైవిక తీర్పులో క్రియాశీలత
  choice: ఆయన ఇశ్రాయేలును అప్పగిస్తాడు
  alternative: ఆయన ఇశ్రాయేలును విడిచిపెడతాడు
  rationale: మూలంలోని נתן క్రియ తీర్పు సందర్భంలో ‘అప్పగించు’ అనే భావాన్ని ఇస్తుంది. ‘విడిచిపెడతాడు’ అనేది పరిత్యాగ భావాన్ని అధికంగా ముందుకు తేవచ్చు; ‘అప్పగిస్తాడు’ దైవిక తీర్పును నిలుపుతూ, ఎవరికి లేదా ఏ విపత్తుకు అప్పగిస్తాడో ఈ వాక్యానికి మించి నిర్దిష్టం చేయదు.
- issue: యెరోబాము వ్యక్తిగత అపరాధం మరియు ప్రజలను పాపం చేయించిన బాధ్యత
  choice: యెరోబాము తాను చేసిన, ఇశ్రాయేలుతో చేయించిన పాపాలు
  alternative: యెరోబాము పాపం చేసి ఇశ్రాయేలును పాపం చేయించినందువల్ల
  rationale: ఎంచుకున్న రూపం మూలంలోని బహువచన ‘పాపాలు’ను నిలుపుతూ, యెరోబాము స్వయంగా చేసిన పాపాలను మరియు ఇశ్రాయేలును పాపం చేయించిన కారణార్థక బాధ్యతను రెండింటినీ స్పష్టంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. ‘ఆయన’ అనే గౌరవ సూచక సర్వనామం సందర్భంలోని దేవుణ్ణి సూచిస్తుంది. మూలంలో పేర్కొనని తీర్పు సాధనాన్ని అనువాదం నిర్దిష్టం చేయదు.
