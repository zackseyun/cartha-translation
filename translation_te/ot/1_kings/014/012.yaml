  yaml_path: translation/ot/1_kings/014/012.yaml
  text: But as for you[a], arise, go to your house. When your feet enter the city, the child will die.
translation:
  language: te
  text: అయితే నీవు లేచి నీ ఇంటికి వెళ్లు. నీవు పట్టణంలోకి అడుగుపెట్టగానే[a] ఆ బిడ్డ చనిపోతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ కాళ్లు పట్టణంలోకి ప్రవేశించినప్పుడు.” రాక క్షణాన్ని సూచించడానికి హీబ్రూ భాషలో “నీ కాళ్లు” అనే ప్రయోగం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתְּ
  choice: అయితే నీవు
  rationale: సంయోజక అవ్యయంతో కూడిన స్వతంత్ర ద్వితీయ పురుష ఏకవచన స్త్రీలింగ సర్వనామం స్త్రీని ప్రత్యేకంగా ఉద్దేశిస్తూ వ్యత్యాసాన్ని, ఉద్ఘాటనను సూచిస్తుంది.
- source_word: ק֖וּמִי לְכִ֣י
  choice: లేచి ... వెళ్లు
  rationale: వరుసగా ఉన్న స్త్రీలింగ ఏకవచన ఆజ్ఞలను సహజమైన ఆధునిక తెలుగులో, ప్రవచనపు గంభీరత నిలిచేలా అనువదించాం.
- source_word: לְ/בֵיתֵ֑/ךְ
  choice: నీ ఇంటికి
  rationale: בַּיִת ఇల్లు లేదా నివాసం అనే అర్థం ఇస్తుంది; సందర్భంలో గమ్యాన్ని ‘నీ ఇంటికి’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְּ/בֹאָ֥ה רַגְלַ֛יִ/ךְ הָ/עִ֖ירָ/ה
  choice: నీవు పట్టణంలోకి అడుగుపెట్టగానే
  rationale: హీబ్రూలో అక్షరార్థంగా ‘నీ కాళ్లు పట్టణంలోకి ప్రవేశించినప్పుడు’ అని ఉంది. తెలుగులో ‘అడుగుపెట్టగానే’ శరీరభాగపు చిత్రాన్ని కొంత నిలుపుతూ రాక క్షణాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וּ/מֵ֥ת הַ/יָּֽלֶד
  choice: ఆ బిడ్డ చనిపోతాడు
  rationale: ప్రవచన సందర్భంలో సంయోజకంతో వచ్చిన క్రియ భవిష్యత్ ఫలితాన్ని సూచిస్తుంది. יֶלֶד‌ను సందర్భానుసారం ‘బిడ్డ’గా అనువదించాం.
