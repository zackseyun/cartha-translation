id: 1KI.14.27
reference: 1 Kings 14:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ הַ/מֶּ֤לֶךְ רְחַבְעָם֙ תַּחְתָּ֔/ם מָגִנֵּ֖י נְחֹ֑שֶׁת וְ/הִפְקִ֗יד עַל יַד֙ שָׂרֵ֣י הָ/רָצִ֔ים הַ/שֹּׁ֣מְרִ֔ים פֶּ֖תַח בֵּ֥ית הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/027.yaml
  text: So King Rehoboam made bronze shields in their place and committed them into the hand of the commanders of the runners[b][a], who guarded the entrance of the king’s house.
translation:
  language: te
  text: అందుచేత రాజైన రెహబాము వాటి స్థానంలో కంచు డాళ్లను చేశాడు; వాటిని రాజభవనపు ప్రవేశద్వారానికి[b] కాపలా కాసే పరుగువారి[a] అధిపతులకు అప్పగించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, భావానువాదంగా, “అంగరక్షక దళాధిపతులు.” హీబ్రూలో అక్షరార్థంగా “పరుగువారి అధిపతులు”; వీరు బహుశా రాజ అంగరక్షకులుగా లేదా వార్తాహరులుగా సేవచేసే దళం.
    reason: lexical_alternative
  - marker: b
    text: “రాజభవనం” అంటే రాజు నివసించే ప్రాసాదం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: చేయించాడు
  rationale: రాజు స్వయంగా తయారుచేశాడని కాక, తన అధికారంతో వాటిని తయారు చేయించాడనే సహజమైన రాజవృత్తాంత భావాన్ని తెలుగులో తెలియజేస్తుంది.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: రాజైన రెహబాము
  rationale: హీబ్రూ పదక్రమానికి సమీపంగా ఉండి, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వినిపిస్తుంది.
- source_word: תַּחְתָּם
  choice: వాటి స్థానంలో
  rationale: ముందటి వచనంలోని బంగారు డాళ్లకు బదులుగా చేసినవని సూచించే బహువచన సర్వనామాన్ని నిలుపుతుంది.
- source_word: מָגִנֵּי נְחֹשֶׁת
  choice: కంచు డాళ్లు
  rationale: నְחֹשֶׁת ప్రాచీన లోహపనుల సందర్భంలో రాగి లేదా కంచును సూచించగలదు; ఇక్కడ సాధారణంగా అంగీకరించిన 'కంచు'ను ఎంచుకున్నాం. מָגֵן‌కు యుద్ధరక్షణ సాధనమైన 'డాలు' సరిపోతుంది.
- source_word: וְהִפְקִיד עַל יַד
  choice: వారికి వాటిని అప్పగించాడు
  rationale: వారి బాధ్యతలో ఉంచాడు అనే హిఫీల్ క్రియ మరియు హీబ్రూ నుడికార భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: שָׂרֵי הָרָצִים
  choice: పరుగువారి అధిపతులు
  rationale: హీబ్రూలోని అక్షరార్థమైన 'పరుగువారు'ను ప్రధాన పాఠ్యంలో నిలిపి, వారు రాజ అంగరక్షకులు లేదా వార్తాహరుల దళం అయి ఉండవచ్చనే వ్యాఖ్యానాన్ని పాదటిప్పణికి పరిమితం చేసింది.
- source_word: הַשֹּׁמְרִים
  choice: కాపలా కాసే
  rationale: కొనసాగుతున్న విధిని సూచించే హీబ్రూ కృదంత భావాన్ని సహజమైన తెలుగు విశేషణ ఉపవాక్యంగా అందిస్తుంది.
- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  choice: రాజభవన ప్రవేశద్వారం
  rationale: అక్షరార్థంగా 'రాజు ఇల్లు' అయినా, సందర్భంలో అది రాజప్రాసాదాన్ని సూచిస్తుంది; 'రాజభవనం' ఆధునిక పాఠకులకు స్పష్టంగా, సహజంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని అస్పష్టమైన 'పరుగువారు' అనే పదాన్ని ప్రధాన పాఠ్యంలో ఉంచి పాదటిప్పణిలో వివరణ ఇచ్చాం. రెండు పాదటిప్పణి గుర్తులూ సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
