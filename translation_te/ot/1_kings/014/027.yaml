- from: అందుచేత రాజైన రెహబాము వాటి స్థానంలో కంచు డాళ్లను చేయించి, రాజభవన ప్రవేశద్వారానికి కాపలా కాసే పరుగువారి[a] అధిపతులకు వాటిని అప్పగించాడు.[b]
  to: అందుచేత రాజైన రెహబాము వాటి స్థానంలో కంచు డాళ్లను చేశాడు; వాటిని రాజభవనపు ప్రవేశద్వారానికి[b] కాపలా కాసే పరుగువారి[a] అధిపతులకు అప్పగించాడు.
