source:
  edition: WLC
  text: וּ/רְחַבְעָם֙ בֶּן שְׁלֹמֹ֔ה מָלַ֖ךְ בִּֽ/יהוּדָ֑ה בֶּן אַרְבָּעִ֣ים וְ/אַחַ֣ת שָׁנָה֩ רְחַבְעָ֨ם בְּ/מָלְכ֜/וֹ וּֽ/שֲׁבַ֨ע עֶשְׂרֵ֥ה שָׁנָ֣ה מָלַ֣ךְ בִּ/ירוּשָׁלִַ֗ם הָ֠/עִיר אֲשֶׁר בָּחַ֨ר יְהוָ֜ה לָ/שׂ֨וּם אֶת שְׁמ֥/וֹ שָׁם֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָ/עַמֹּנִֽית־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/021.yaml
  text: Rehoboam the son of Solomon reigned in Judah[a]. Rehoboam was forty-one years old when he became king, and he reigned seventeen years in Jerusalem, the city that Yahweh had chosen from all the tribes of Israel to put his name there[b]. And his mother’s name was Naamah the Ammonite woman.
translation:
  language: te
  text: సొలొమోను కుమారుడైన రెహబాము యూదాలో[a] రాజుగా పరిపాలించాడు. రెహబాము రాజైనప్పుడు అతనికి నలభై ఒక్క సంవత్సరాల వయసు ఉంది. ఇశ్రాయేలు గోత్రాలన్నిటిలోనుండి తన నామాన్ని అక్కడ ఉంచడానికి యాహ్వే ఎంచుకున్న పట్టణమైన యెరూషలేములో అతడు పదిహేడు సంవత్సరాలు రాజుగా పరిపాలించాడు[b]. అతని తల్లి పేరు నయమా; ఆమె అమ్మోనీయురాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యూదాపై రాజుగా పరిపాలించాడు.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో, ‘తన నామాన్ని అక్కడ ఉంచడానికి.’ ఇది యాహ్వే సన్నిధి, ఆరాధనతో ప్రత్యేకంగా సంబంధమున్న స్థలాన్ని సూచించే నిబంధనకు సంబంధించిన భావవ్యక్తీకరణ.
    reason: cultural_note
lexical_decisions:
- source_word: מָלַךְ
  choice: రాజ్యపాలన చేశాడు
  rationale: రాజుగా పరిపాలించడాన్ని తెలిపే క్రియను ఆధునిక, గౌరవప్రదమైన తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; בְּמָלְכוֹ అనే రాజ్యారంభ కాలసూచనతో తేడాను కూడా నిలుపుతుంది.
- source_word: בִּיהוּדָה
  choice: యూదాలో
  rationale: בְּ ఉపసర్గకు ప్రాథమికంగా ‘లో’ అనే అర్థం ఉంది. రాజ్యపాలన సందర్భంలో ‘యూదాపై’ కూడా సాధ్యమే కాబట్టి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: בְּמָלְכוֹ
  choice: రాజైనప్పుడు
  rationale: ఉపసర్గతో కూడిన క్రియానామ రూపం రెహబాము సింహాసనాన్ని అధిష్ఠించిన సమయాన్ని సూచిస్తుంది; ఇది అతని రాజ్యపాలన వ్యవధి నుంచి స్పష్టంగా వేరుచేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యనుకరణగా అందిస్తుంది.
- source_word: לָשׂוּם אֶת־שְׁמוֹ שָׁם
  choice: తన నామాన్ని అక్కడ ఉంచడానికి
  rationale: మూలంలోని ‘తన నామాన్ని అక్కడ ఉంచు’ అనే నిబంధనాత్మక భావవ్యక్తీకరణను వివరణాత్మక పునర్వ్యాఖ్యానంతో భర్తీ చేయకుండా నిలుపుతుంది.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాలన్నిటిలోనుండి
  rationale: מִן ఇక్కడ అనేక గోత్రాల మధ్యనుండి చేసిన ఎంపికను సూచిస్తుంది.
- source_word: הָעַמֹּנִית
  choice: ఆమె అమ్మోనీయురాలు
  rationale: స్త్రీలింగ జనసంబంధ పదం నయమా అమ్మోను ప్రజకు చెందిన స్త్రీ అని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: వచనంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని బిరుదుగా మార్చకుండా, సాధ్యమైన ఉచ్చారణకు దగ్గరైన ‘యాహ్వే’గా లిప్యంతరీకరించడం మూలపాఠాన్ని ప్రత్యక్షంగా ప్రతిబింబిస్తుంది.
- issue: ‘తన నామాన్ని అక్కడ ఉంచడం’ అనే మాట యొక్క భావం
  choice: మూల రూపకాన్ని ప్రధాన పాఠంలో నిలుపుతూ పాదసూచికలో సాంస్కృతిక వివరణ
  alternative: తాను అక్కడ నివసించడానికి / తన సన్నిధిని అక్కడ స్థాపించడానికి
  rationale: ఈ మాట దేవుని సన్నిధి, ఆరాధన, నిబంధనతో సంబంధమున్న ప్రత్యేక స్థలాన్ని సూచించినా, మూలంలోని ఉద్దేశపూర్వక రూపకాన్ని విప్పి చెప్పడం దాని భావవిస్తృతిని అనవసరంగా కుదించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. రాజవంశ చరిత్రకు తగిన ‘రాజ్యపాలన చేశాడు’ వాడబడింది; ‘నామాన్ని ఉంచడం’ అనే మూలభాషా రూపకం వివరణలో కరిగిపోకుండా ప్రధాన పాఠంలో నిలుపబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
