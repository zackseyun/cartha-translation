reference: 1 Kings 14:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ יְהוּדָ֛ה הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְקַנְא֣וּ אֹת֗/וֹ מִ/כֹּל֙ אֲשֶׁ֣ר עָשׂ֣וּ אֲבֹתָ֔/ם בְּ/חַטֹּאתָ֖/ם אֲשֶׁ֥ר חָטָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/022.yaml
  text: And Judah did what was evil in the eyes of Yahweh[a], and they provoked him to jealousy more than all that their fathers had done, by the sins that they committed.
translation:
  language: te
  text: యూదా ప్రజలు యెహోవా దృష్టిలో చెడ్డదాన్ని చేశారు. వారు తమ పితరులు చేసిన వాటన్నిటికంటే ఎక్కువగా, తాము చేసిన పాపాల ద్వారా ఆయనలో అసూయను రేకెత్తించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనకు అసూయ పుట్టించారు.” ఇక్కడి హీబ్రూ పదం యూదా అవిశ్వాసానికి ప్రతిస్పందనగా యెహోవా చూపే ఒడంబడికకు సంబంధించిన అసూయను సూచిస్తుంది; ఇది పాపభరితమైన ఈర్ష్యను సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: యూదా ప్రజలు
  rationale: ఇక్కడ దక్షిణ రాజ్యపు ప్రజలను సూచించే సమష్టి నామం. తరువాతి బహువచన క్రియలకు అనుగుణంగా తెలుగులో ‘ప్రజలు’ అని స్పష్టం చేయడం సహజంగా ఉంటుంది.
- source_word: הָרַע
  choice: చెడ్డదాన్ని
  rationale: עשה + הרע అనే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో ‘చెడ్డదాన్ని చేశారు’ అని ఇచ్చింది.
- source_word: בְּעֵינֵי יְהוָה
  choice: యెహోవా దృష్టిలో
  rationale: హీబ్రూ మూలంలోని మూల్యాంకన నుడికారాన్ని తెలుగులో సహజంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది; దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించింది.
- source_word: וַיְקַנְאוּ אֹתוֹ
  choice: ఆయనకు రోషం పుట్టించారు
  rationale: קנא యొక్క సందర్భార్థం యూదా అవిశ్వాసానికి ప్రతిస్పందనగా కలిగే దైవిక ఒడంబడిక రోషం. ‘అసూయ’ అనే పదం తెలుగులో పాపభరితమైన ఈర్ష్యను సూచించే ప్రమాదం ఉన్నందున, ఆ నైతిక అపార్థం లేకుండా క్రియ యొక్క ప్రేరేపణ భావాన్ని నిలిపింది.
- source_word: מִכֹּל אֲשֶׁר עָשׂוּ אֲבֹתָם
  choice: తమ పితరులు చేసిన వాటన్నిటికంటే ఎక్కువగా
  rationale: తులనార్థక מן־ను ‘కంటే ఎక్కువగా’ అని, כל־ను ‘వాటన్నిటి’ అని ప్రతిబింబిస్తూ మూలంలోని తులనను నిలిపింది.
- source_word: בְּחַטֹּאתָם אֲשֶׁר חָטָאוּ
  choice: వారు చేసిన పాపాలవల్ల
  rationale: నామవాచకం–సజాత క్రియ కలయికను సహజ తెలుగులో సంక్షిప్తం చేసి, בְּ యొక్క కారణార్థాన్ని ‘వల్ల’తో తెలిపింది.
theological_decisions:
- issue: దైవిక రోషం/అసూయ భాష
  choice: ఆయనకు రోషం పుట్టించారు
  alternative: ఆయనకు అసూయ పుట్టించారు; ఆయన రోషాన్ని రేపారు
  rationale: మూలపదం యూదా అవిశ్వాసానికి యెహోవా చూపే ఒడంబడిక సంబంధమైన ప్రత్యేక హక్కు భావంతో కూడిన రోషాన్ని సూచిస్తుంది. ‘రోషం’ దాన్ని కేవలం సాధారణ కోపంగా పూర్తిగా పరిష్కరించకుండానే, తెలుగులో ‘అసూయ’ వల్ల కలిగే పాపాత్మక ఈర్ష్య అనే అపార్థాన్ని తగ్గిస్తుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన వాక్యనిర్మాణం. సమష్టి ‘యూదా’ను ‘యూదా ప్రజలు’గా విప్పి చెప్పింది. మూలంలోని కారణం, తులన, దైవిక రోషం అనే భావాలను నిలిపింది.
