revisions:
- from: యూదా ప్రజలు యెహోవా దృష్టిలో చెడ్డదాన్ని చేశారు. వారు చేసిన పాపాలవల్ల, తమ పితరులు చేసిన వాటన్నిటికంటే ఎక్కువగా ఆయనకు రోషం పుట్టించారు.[a]
  to: యూదా ప్రజలు యెహోవా దృష్టిలో చెడ్డదాన్ని చేశారు. వారు తమ పితరులు చేసిన వాటన్నిటికంటే ఎక్కువగా, తాము చేసిన పాపాల ద్వారా ఆయనలో అసూయను రేకెత్తించారు.[a]
  rationale: The revision preserves the Hebrew’s explicit covenantal-jealousy language in the translation itself, rather than interpreting it as anger. It retains the collective sense of Judah, the comparative ‘more than all their fathers had done,’ and the causal/instrumental relation of their sins.
  reviewer_model: gpt-5.6-terra
