source:
  edition: WLC
  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י יָֽרָבְעָ֔ם אֲשֶׁ֥ר נִלְחַ֖ם וַ/אֲשֶׁ֣ר מָלָ֑ךְ הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/019.yaml
  text: The rest of the acts of Jeroboam[a], how he fought and how he reigned, behold[c][b], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: te
  text: యెరోబాము చేసిన మిగిలిన కార్యాలు[a], అతడు ఎలా యుద్ధం చేశాడో, ఎలా రాజ్యపాలన చేశాడో—ఇదిగో[b], అవి ‘ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథం’లో[c] రాయబడి ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “యెరోబాము గురించిన మిగిలిన విషయాలు.” రాజుల పాలనాసారాంశాల్లో ఈ పదబంధం నమోదైన కార్యాలు లేదా వ్యవహారాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ మూలంలో “ఇదిగో, అవి రాయబడి ఉన్నాయి” అనే, లిఖిత నమోదువైపు దృష్టి మళ్లించే వ్యక్తీకరణ ఉంది.
    reason: lexical_alternative
  - marker: c
    text: ఇది అధికారిక రాజవృత్తాంతం లేదా చారిత్రక నమోదు; బైబిలులోని 1–2 దినవృత్తాంతములు గ్రంథం కాదు.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יָרָבְעָם
  choice: యెరోబాము చేసిన మిగిలిన కార్యాలు
  rationale: దִּבְרֵי అనే పదానికి అక్షరార్థంగా ‘మాటలు/విషయాలు’ అనే భావం ఉన్నా, రాజుల పాలనాసారాంశ సూత్రంలో అది రాజు చేసిన కార్యాలు, పాలనా వ్యవహారాలను సూచిస్తుంది. అందువల్ల ఆధునిక తెలుగులో ‘మిగిలిన కార్యాలు’ సహజంగా, సందర్భానుగుణంగా ఉంది.
- source_word: אֲשֶׁר נִלְחַם
  choice: అతడు ఎలా యుద్ధం చేశాడో
  rationale: נלחם అంటే ‘పోరాడు/యుద్ధం చేయు.’ אֲשֶׁר ఇక్కడ ముందున్న కార్యాలను వివరించేందుకే వాడబడింది; ‘ఎలా యుద్ధం చేశాడో’ ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַאֲשֶׁר מָלָךְ
  choice: ఎలా రాజ్యపాలన చేశాడో
  rationale: מלך ఇక్కడ ‘రాజుగా పరిపాలించు’ అనే అర్థంలో ఉంది. ‘రాజ్యపాలన చేశాడు’ అనేది ఆధునిక తెలుగు పాఠకునికి ‘రాజయ్యాడు’ అనే అపార్థం రాకుండా పాలనను స్పష్టంగా తెలియజేస్తుంది.
- source_word: הִנָּם
  choice: ఇదిగో, అవి
  rationale: ఈ ప్రత్యక్షీకరణ పదం తరువాత చెప్పబోయే లిఖిత ఆధారంపై దృష్టి నిలిపిస్తుంది. ‘ఇదిగో’ మూలంలోని ఆ సంభాషణాత్మక బలాన్ని నిలుపుతుంది; ‘అవి’ దాని బహువచన సూచనను వ్యక్తం చేస్తుంది.
- source_word: כְּתוּבִים
  choice: రాయబడి ఉన్నాయి
  rationale: నిష్క్రియార్థక వర్తమాన కృదంతాన్ని పారదర్శకంగా, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: ‘ఇశ్రాయేలు రాజుల దినవృత్తాంతాల గ్రంథం’లో
  rationale: עַל סֵפֶר అనే హీబ్రూ నిర్మాణం లిఖిత గ్రంథంలోని నమోదును సూచిస్తుంది కాబట్టి తెలుగులో ‘గ్రంథంలో’ సహజం. דִּבְרֵי הַיָּמִים రాజసంబంధమైన దినవృత్తాంతాలు లేదా చారిత్రక నమోదులను సూచిస్తుంది.
theological_decisions:
- issue: ‘దినవృత్తాంతాల గ్రంథం’ ఏ గ్రంథాన్ని సూచిస్తుంది?
  choice: దీనిని ఇశ్రాయేలు రాజులకు సంబంధించిన అధికారిక రాజవృత్తాంత గ్రంథంగా గుర్తించడం
  alternative: బైబిలులోని 1–2 దినవృత్తాంతములు గ్రంథంగా గుర్తించడం
  rationale: వచనంలోని శీర్షిక ఉత్తర రాజ్యమైన ఇశ్రాయేలు రాజుల రాజరిక నమోదును సూచిస్తుంది; బైబిలులోని దినవృత్తాంతములు గ్రంథంతో దానిని సమానంగా చూడటానికి మూలపాఠం ఆధారం ఇవ్వదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ రాజచరిత్రకు తగిన గౌరవప్రదమైన శైలి పాటించబడింది. మూలంలోని రాజసారాంశ సూత్రం, ‘ఇదిగో’ అనే దృష్టి ఆకర్షణ, లిఖిత ఆధార సూచన నిలుపబడ్డాయి.
