id: 1KI.14.28
reference: 1 Kings 14:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֛י מִ/דֵּי בֹ֥א הַ/מֶּ֖לֶךְ בֵּ֣ית יְהוָ֑ה יִשָּׂאוּ/ם֙ הָֽ/רָצִ֔ים וֶ/הֱשִׁיב֖וּ/ם אֶל תָּ֥א הָ/רָצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/028.yaml
  text: And whenever the king entered the house of Yahweh[b][a], the guards would carry them and then return them to the guards’ chamber.
translation:
  language: te
  text: రాజు యెహోవా మందిరంలోకి వెళ్లినప్పుడల్లా, అంగరక్షకులు ఆ డాళ్లను[a] మోసి, తరువాత వాటిని అంగరక్షకుల గదికి తిరిగి తీసుకొచ్చేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, షీషకు తీసుకుపోయిన బంగారు డాళ్లకు బదులుగా రెహబాము చేయించిన ఇత్తడి డాళ్లు (1 రాజులు 14:27 చూడండి).
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי מִדֵּי בֹא
  choice: వెళ్లినప్పుడల్లా
  rationale: מִדֵּי + క్రియార్థక నామరూపం పునరావృతమైన సందర్భాన్ని సూచిస్తుంది. తెలుగులో ‘వెళ్లినప్పుడల్లా’ ఆ అలవాటైన చర్యను సహజంగా తెలియజేస్తుంది; וַיְהִי కథన ప్రవాహంలో ప్రత్యేకంగా అనువదించనవసరం లేదు.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: సందర్భంలో రెహబామును సూచించే నిర్దిష్ట నామవాచకం.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: బֵּית అనే ‘ఇల్లు’ రూపకాన్ని పదానువాదంగా ఉంచడం కంటే, ఇక్కడ ఉద్దేశించిన ఆరాధనా స్థలాన్ని ఆధునిక తెలుగులో ‘మందిరం’ స్పష్టంగా తెలియజేస్తుంది. యెహోవా అనే వ్యక్తిగత నామం నిలుపబడింది.
- source_word: יִשָּׂאוּם
  choice: ఆ డాళ్లను మోసుకెళ్లి
  rationale: అసంపూర్ణ క్రియారూపం పునరావృత గత చర్యను సూచిస్తుంది. కర్మప్రత్యయం ముందు వచనంలోని ఇత్తడి డాళ్లను సూచిస్తుందని ప్రధాన పాఠ్యంలో స్పష్టం చేసి, పాదటీపులో సందర్భాన్ని వివరించాం.
- source_word: הָרָצִים
  choice: అంగరక్షకులు
  rationale: పదశః ‘పరుగెత్తేవారు’; రాజసభ సందర్భంలో రాజును వెంట ఉండి కాపాడే సిబ్బందిని సూచిస్తుంది. ‘అంగరక్షకులు’ వారి సందర్భోచిత విధిని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: וֶהֱשִׁיבוּם
  choice: తిరిగి తీసుకొచ్చేవారు
  rationale: שׁוב హిఫిల్ రూపం ‘తిరిగి వచ్చేలా చేయడం/తిరిగి తీసుకురావడం’ అనే భావం ఇస్తుంది. తెలుగులో ఈ ఎంపిక గమ్యస్థానానికి మళ్లీ చేర్చడాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֶל תָּא הָרָצִים
  choice: అంగరక్షకుల గదికి
  rationale: תָּא అంటే గది లేదా చిన్న మందిరగది. సంబంధాన్ని యథాతథంగా ఉంచుతూ ‘అంగరక్షకుల గది’ అని అనువదించాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: హీబ్రూ మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. ‘రాజు’, ‘మందిరం’, ‘డాళ్లు’, ‘అంగరక్షకులు’ వంటి సాధారణంగా అర్థమయ్యే పదాలను ఉపయోగించాం. మూలంలోని పునరావృత చర్యను ‘వెళ్లినప్పుడల్లా ... తీసుకొచ్చేవారు’ నిర్మాణంతో నిలుపుకున్నాం.
