  text: וַ/יִּבְנ֨וּ גַם הֵ֧מָּה לָ/הֶ֛ם בָּמ֥וֹת וּ/מַצֵּב֖וֹת וַ/אֲשֵׁרִ֑ים עַ֚ל כָּל גִּבְעָ֣ה גְבֹהָ֔ה וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/023.yaml
  text: They too built for themselves high places[a], pillars, and Asherah poles on every high hill and under every green tree.
translation:
  language: te
  text: వారు కూడా తమకొరకు ఉన్నత స్థలాలను, పూజా స్తంభాలను, అషేరా స్తంభాలను[a] ప్రతి ఎత్తైన కొండమీదా ప్రతి పచ్చని చెట్టు కిందా నిర్మించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అషేరీమ్” లేదా “పవిత్ర స్తంభాలు.” హీబ్రూ పదం అషేరాతో సంబంధమున్న ఆరాధనా వస్తువులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְנוּ
  choice: కట్టుకున్నారు
  rationale: בנה యొక్క ప్రాథమిక అర్థం ‘కట్టు/నిర్మించు’. తమ కోసం ఏర్పాటు చేసుకున్నారనే לָהֶם భావాన్ని సహజమైన తెలుగు ఆత్మనేపద రూపంతో కలిపి వ్యక్తం చేస్తుంది.
- source_word: גַם הֵמָּה
  choice: వారు కూడా
  rationale: ముందటి సందర్భంతో కొనసాగింపును, అదనపు నొక్కును సహజంగా నిలుపుతుంది.
- source_word: לָהֶם
  choice: తమ కోసం
  rationale: ఈ ఆరాధనా స్థలాలు, వస్తువులు వారి స్వంత వినియోగం కోసం ఏర్పాటయ్యాయని సూచించే ప్రతిబింబార్థాన్ని నిలుపుతుంది.
- source_word: בָּמוֹת
  choice: ఉన్నత స్థలాలు
  rationale: స్థానిక ఆరాధనా కేంద్రాలను సూచించే ఈ సాంకేతిక బైబిలు పదానికి రూపసామ్యాన్ని కాపాడే సంక్షిప్త అనువాదం.
- source_word: מַצֵּבוֹת
  choice: పూజా స్తంభాలు
  rationale: నిలబెట్టిన రాళ్లు లేదా స్తంభాల ఆరాధనా ప్రయోజనాన్ని స్పష్టం చేస్తుంది; కేవలం ‘స్తంభాలు’ అనడం సందర్భార్థాన్ని అస్పష్టంగా చేయవచ్చు.
- source_word: אֲשֵׁרִים
  choice: అషేరా స్తంభాలు
  rationale: ఈ బహువచనం అషేరాతో సంబంధమున్న ఆరాధనా వస్తువులను సూచించే అవకాశం ఎక్కువ. దేవత పేరుతో సంబంధాన్ని నిలుపుతూ వస్తు-సూచనను తెలుగులో స్పష్టం చేస్తుంది.
- source_word: עַל כָּל גִּבְעָה גְבֹהָה
  choice: ప్రతి ఎత్తైన కొండమీద
  rationale: భౌగోళిక భావాన్నీ, సమగ్రతను తెలిపే మూసపదబంధపు వాక్చాతుర్యాన్నీ కాపాడుతుంది.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: ప్రతి పచ్చని చెట్టు కింద
  rationale: רַעֲנָן లోని సజీవమైన, పచ్చగా విరిసిన భావాన్ని సాధారణ పాఠకులకు సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: אֲשֵׁרִים అనేది అషేరా దేవతను సూచిస్తుందా, లేక ఆమెతో సంబంధమున్న ఆరాధనా వస్తువులను సూచిస్తుందా?
  choice: ఆరాధనా వస్తువులుగా ‘అషేరా స్తంభాలు’
  alternative: ‘అషేరీము’ లేదా ‘అషేరా ప్రతిమలు’
  rationale: ‘ఉన్నత స్థలాలు’, ‘పూజా స్తంభాలు’ అనే భౌతిక ఏర్పాట్ల జాబితాలో ఉండటం వల్ల ఇక్కడ భౌతిక ఆరాధనా వస్తువులే ఉద్దేశించబడ్డాయని గ్రహించడం సహజం. అయినా వాటి ఖచ్చిత రూపం నిర్ధారితం కానందున పాదసూచికలో ప్రత్యామ్నాయాన్ని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరతతో కూడిన సులభ శైలి. ‘ఉన్నత స్థలాలు’ అనే బైబిలు సాంకేతిక పదాన్ని నిలిపి, ‘పూజా స్తంభాలు’ ద్వారా మతాచార సందర్భాన్ని స్పష్టం చేశాం. అషేరా వస్తువుల ఖచ్చిత స్వరూపంపై ఉన్న అనిశ్చితిని పాదసూచికలో కాపాడాం.
