  text: They buried him[a], and all Israel mourned for him, according to the word of Yahweh that he had spoken through his servant Ahijah the prophet.
translation:
  language: te
  text: యాహ్వే తన సేవకుడైన అహీయా ప్రవక్త ద్వారా చెప్పిన మాట ప్రకారం వారు అతనిని పాతిపెట్టారు, ఇశ్రాయేలు అంతా అతని కోసం విలపించింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “తన సేవకుడైన అహీయా ప్రవక్త చేతి ద్వారా”; ఇది “తన సేవకుడైన అహీయా ప్రవక్త ద్వారా” అని అర్థమిచ్చే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: వారు అతన్ని పాతిపెట్టారు
  rationale: קבר అనే క్రియను కథనంలోని వరుస గత సంఘటనగా సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; אֹתוֹ సందర్భంలోని మరణించిన కుమారుణ్ణి సూచిస్తుంది.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: అతని కోసం విలపించింది
  rationale: ספד మరణసందర్భంలోని బహిరంగ దుఃఖాన్ని లేదా విలాపాన్ని సూచిస్తుంది. ‘విలపించింది’ ఆ భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు అంతా
  rationale: దేశప్రజలను ఒక సమష్టిగా సూచించే హీబ్రూ ప్రయోగాన్ని నిలుపుతుంది; అందుకే తెలుగులో ఏకవచన క్రియను వాడాం.
- source_word: כִּדְבַר יְהוָה
  choice: యాహ్వే ... చెప్పిన మాట ప్రకారమే
  rationale: כְּדְבַר అనే నిర్మాణం ముందుగా పలికిన ప్రవచన వాక్యానికి అనుగుణంగా సంఘటన జరిగిందనే భావాన్ని ఇస్తుంది. ‘ప్రకారమే’ ఆ నెరవేర్పును సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా ఆధునిక తెలుగు లిప్యంతరీకరణలో అందిస్తుంది.
- source_word: אֲשֶׁר דִּבֶּר
  choice: చెప్పిన
  rationale: సమాధి చేయడం, విలపించడం కంటే ముందే పలికిన వాక్యాన్ని సూచించే సంబంధ క్రియారూపం.
- source_word: בְּיַד
  choice: ద్వారా
  rationale: అక్షరార్థంగా ‘చేతి ద్వారా’ అయిన ఈ హీబ్రూ నుడికారం మధ్యవర్తిత్వం లేదా సాధనాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ద్వారా’ సహజం.
- source_word: עַבְדּוֹ
  choice: తన సేవకుడైన
  rationale: ప్రవక్త దేవుని నియామక సేవలో ఉన్నాడనే సందర్భంలో עבדకు ‘సేవకుడు’ తగినది; ‘బానిస’ అనవసరమైన సామాజిక భావాన్ని ముందుకు తెస్తుంది.
- source_word: אֲחִיָּהוּ הַנָּבִיא
  choice: అహీయా ప్రవక్త
  rationale: వ్యక్తినామాన్ని తెలుగు సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించి, నిర్దిష్ట పాత్రను తెలిపే ‘ప్రవక్త’ అనే బిరుదును నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో బిరుదు కాకుండా చతురక్షర దైవనామం ఉంది. అందువల్ల దాన్ని వ్యక్తిగత నామంగా లిప్యంతరీకరించాం.
- issue: בְּיַד עַבְדּוֹ అనే ప్రవచన మధ్యవర్తిత్వ సూత్రం
  choice: తన సేవకుడైన ... ద్వారా
  alternative: తన సేవకుడైన ... చేతి ద్వారా
  rationale: దేవుని మాట అహీయా ద్వారా తెలియజేయబడిందనే మూలభావాన్ని కాపాడుతూ, హీబ్రూ నుడికారాన్ని అసహజంగా అక్షరార్థీకరించలేదు; ప్రేరణ స్వరూపంపై అదనపు సిద్ధాంతాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడాం. ‘ఇశ్రాయేలు’ను సమష్టి నామంగా తీసుకొని ‘విలపించింది’ అనే ఏకవచన క్రియను ఉపయోగించాం. చివర ‘ఇది జరిగింది’ అనేది హీబ్రూ భావంలో అంతర్లీనంగా ఉన్న ప్రవచన నెరవేర్పును తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
