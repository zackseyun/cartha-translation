source:
  edition: WLC
  text: וְ/גַם קָדֵ֖שׁ הָיָ֣ה בָ/אָ֑רֶץ עָשׂ֗וּ כְּ/כֹל֙ הַ/תּוֹעֲבֹ֣ת הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/024.yaml
  text: There were also cult prostitutes in the land[a]. They did according to all the abominations of the nations that Yahweh had driven out before the sons of Israel.
translation:
  language: te
  text: ఆ దేశంలో దేవతారాధనతో సంబంధమున్న పురుష లైంగిక సేవకులు కూడా ఉండేవారు[a]. యాహ్వే ఇశ్రాయేలు కుమారుల ఎదుటనుండి వెళ్లగొట్టిన ఆ జనాంగాల హేయమైన ఆచారాలన్నిటిని అనుసరించి వారు ప్రవర్తించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పురుష ఆరాధనా వ్యభిచారులు,” “దేవాలయ వ్యభిచారులు.” హీబ్రూ పదం קָדֵשׁ పురుషలింగంలో ఉంది; నిషిద్ధ దేవతారాధనతో సంబంధమున్న లైంగిక ఆచారాలకు సంబంధించిన వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: కూడా
  rationale: మునుపటి నేరారోపణలకు ఇది మరొకదాన్ని జోడిస్తోందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: קָדֵשׁ
  choice: దేవతారాధనతో ముడిపడిన పురుష వ్యభిచారులు
  rationale: ఈ పురుషలింగ ఏకవచన నామవాచకం ఇక్కడ ఒక వర్గాన్ని సమష్టిగా సూచిస్తుంది. నిషిద్ధ ఆరాధనా ఆచారాలతో, లైంగిక ప్రవర్తనతో సంబంధమున్న వ్యక్తులను సూచించే భావాన్ని ఇది తెలియజేస్తుంది; తప్పుదారి పట్టించే సంప్రదాయ పదాలను నివారిస్తుంది.
- source_word: הָיָה בָאָרֶץ
  choice: ఆ దేశంలో ... ఉండేవారు
  rationale: స్థలాన్ని సూచించే అస్తిత్వ వాక్యాన్ని, సమష్టి నామవాచకానికి అనుగుణంగా సహజమైన తెలుగు బహువచనంలో ఇచ్చింది.
- source_word: עָשׂוּ
  choice: వారు చేశారు
  rationale: హీబ్రూ క్రియ యొక్క విస్తృతమైన అర్థాన్ని అలాగే ఉంచి, తరువాతి పోలికే అనుకరణ భావాన్ని మోయనిస్తుంది.
- source_word: כְּכֹל הַתּוֹעֲבֹת
  choice: అసహ్యకారాలన్నిటినీ
  rationale: כְּכֹל లోని సంపూర్ణతను ‘అన్నిటినీ’ తెలియజేస్తుంది; תּוֹעֲבוֹת లోని నైతిక-మతపరమైన తీవ్రతను ‘అసహ్యకారాలు’ నిలుపుతుంది.
- source_word: הַגּוֹיִם
  choice: జనాలు
  rationale: ఈ చారిత్రక సందర్భంలో ఇశ్రాయేలీయులు కాని కనాను ప్రజలను సూచించే సహజమైన పదం; తరువాతి కాలపు ప్రత్యేక భావాలను దిగుమతి చేయదు.
- source_word: הוֹרִישׁ
  choice: వెళ్లగొట్టిన
  rationale: హిఫిల్ రూపం మునుపటి నివాసులను వారి స్థలం నుండి తొలగించడం అనే విజయయాత్ర సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవిక ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగా లిప్యంతరీకరిస్తుంది.
- source_word: מִפְּנֵי
  choice: ఎదుటనుండి
  rationale: ఒకరి సన్నిధి లేదా ముఖం ఎదుటనుండి తొలగించడమనే హీబ్రూ రూపకాన్ని తెలుగులో అర్థవంతంగా నిలుపుతుంది.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: ప్రామాణిక జాతివాచక భావం ఉన్నప్పటికీ, మూలంలోని కుటుంబ సంబంధ రూపాన్ని మరియు వ్యాకరణ పురుషలింగాన్ని నిలుపుతుంది.
theological_decisions:
- issue: కָדֵשׁ అనే పదానికి నిషిద్ధ ఆరాధన, లైంగిక ఆచారాల సందర్భంలో అనువాదం
  choice: దేవతారాధనతో ముడిపడిన పురుష వ్యభిచారులు
  alternative: ఆరాధనా వ్యభిచారులు; దేవాలయ వ్యభిచారులు
  rationale: పదం పురుషలింగంలో ఉండి, నిషిద్ధ మతాచారాలతో సంబంధమున్న వ్యక్తిని సూచిస్తుంది. ఏకవచనం ఇక్కడ వర్గాన్ని సమష్టిగా సూచించడంతో తెలుగు బహువచనం సహజంగా ఉంటుంది. ‘దేవాలయ’ అనే పదం పాఠ్యంలో లేని నిర్దిష్ట సంస్థాగత స్థలాన్ని సూచించవచ్చు కాబట్టి ప్రధాన పాఠ్యంలో దాన్ని నివారించింది.
- issue: עָשׂוּ లోని బహువచన కర్త యొక్క పరిధి
  choice: వారు చేశారు
  alternative: ఆ ప్రజలు ఆచరించారు
  rationale: బహువచన సర్వనామం యూదా ప్రజలను విస్తృతంగా సూచించవచ్చు; దాన్ని కేవలం ముందున్న ఆరాధనా వ్యభిచారులకే పరిమితం చేయకుండా మూలంలోని సూచనాత్మక అస్పష్టతను నిలుపుతుంది.
- issue: בְּנֵי יִשְׂרָאֵל అనువాదం
  choice: ఇశ్రాయేలు కుమారులు
  alternative: ఇశ్రాయేలీయులు; ఇశ్రాయేలు ప్రజలు
  rationale: ఇది జాతివాచక ప్రయోగమైనప్పటికీ మూలంలోని కుటుంబ సంబంధ పదబంధాన్ని నిలుపుతుంది.
- issue: יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: దైవిక నామాన్ని బిరుదుగా మార్చకుండా, సాధ్యమైన ఉచ్చారణకు దగ్గరగా తెలుగులో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘అసహ్యకారాలు’ మూలంలోని మతపరమైన, నైతిక తీవ్రతను నిలుపుతుంది. మొదటి వాక్యంలో వివరణాత్మక పదబంధం కొద్దిగా పొడవుగా ఉన్నా, అరుదైన హీబ్రూ పదానికి తప్పుదారి పట్టించని అర్థాన్ని ఇస్తుంది.
