revisions:
- from: ఆ దేశంలో దేవతారాధనతో ముడిపడిన పురుష వ్యభిచారులు కూడా ఉండేవారు[a]. ఇశ్రాయేలు కుమారుల ఎదుటనుండి యాహ్వే వెళ్లగొట్టిన జనాల అసహ్యకారాలన్నిటినీ వారు చేశారు.
