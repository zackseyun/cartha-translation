  text: וְ/לָקַ֣חַתְּ בְּ֠/יָדֵ/ךְ עֲשָׂרָ֨ה לֶ֧חֶם וְ/נִקֻּדִ֛ים וּ/בַקְבֻּ֥ק דְּבַ֖שׁ וּ/בָ֣את אֵלָ֑י/ו ה֚וּא יַגִּ֣יד לָ֔/ךְ מַה יִּֽהְיֶ֖ה לַ/נָּֽעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/003.yaml
  text: And take in your hand ten loaves of bread, some cakes, and a jar of honey, and go to him. He will tell you what will happen to the boy.
translation:
  language: te
  text: నీ చేతిలో పది రొట్టెలు, కొన్ని పిండివంటలు, తేనెతో ఒక కూజా తీసుకొని అతని దగ్గరికి వెళ్లు. బాలుడికి ఏమి జరుగుతుందో అతడు నీకు చెబుతాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲשָׂרָה לֶחֶם
  choice: పది రొట్టెలు
  rationale: సంఖ్యతో కూడిన సమూహార్థక ‘లెహెమ్’ను సహజమైన ఆధునిక తెలుగులో బహువచనంగా ఇచ్చాం.
- source_word: נִקֻּדִים
  choice: కొన్ని చిన్న రొట్టెలు
  rationale: ఈ అరుదైన పదం బొట్లు లేదా మచ్చలతో కనిపించే చిన్న కాల్చిన ఆహార పదార్థాలను సూచించవచ్చు; సందర్భానికి సరిపోయే సాధారణ పదాన్ని ఎంచుకొని, ఖచ్చితంగా తెలియని రకాన్ని అతిగా నిర్దిష్టం చేయలేదు.
- source_word: בַּקְבֻּק דְּבַשׁ
  choice: ఒక సీసా తేనె
  rationale: పాత్రలోని తేనె అనే భావాన్ని సహజంగా తెలియజేస్తుంది; పాత్ర పదాన్ని ఆధునిక పాఠకులకు అర్థమయ్యే ‘సీసా’గా అనువదించాం.
- source_word: מַה יִּהְיֶה לַנָּעַר
  choice: బాలుడికి ఏమి జరుగుతుందో
  rationale: హీబ్రూ వాక్యంలోని భవిష్యత్ స్థితి లేదా పరిణామాన్ని తటస్థంగా, సహజంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ప్రవక్త చెప్పబోయే విషయ స్వరూపం
  choice: ఏమి జరుగుతుందో
  alternative: అతని గతి ఏమిటో
  rationale: మూలంలోని విస్తృతమైన, తటస్థమైన భావాన్ని నిలుపుతూ ఫలితాన్ని ముందుగానే మరణం లేదా నిర్ణీత గతి అని నిర్ధారించలేదు.
translation_notes:
  register: ఆజ్ఞారూప ఏకవచన స్త్రీలింగ సంబోధనను తెలుగులో సహజమైన ‘తీసుకొని… వెళ్లు’ రూపంతో ఇచ్చాం. శైలి సరళమైనదైనా గౌరవప్రదంగా, ఆధునిక ప్రామాణిక తెలుగులో ఉంది.
