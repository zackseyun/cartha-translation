source:
  edition: WLC
  text: וָ/אֶקְרַ֤ע אֶת הַ/מַּמְלָכָה֙ מִ/בֵּ֣ית דָּוִ֔ד וָ/אֶתְּנֶ֖/הָ לָ֑/ךְ וְ/לֹֽא הָיִ֜יתָ כְּ/עַבְדִּ֣/י דָוִ֗ד אֲשֶׁר֩ שָׁמַ֨ר מִצְוֺתַ֜/י וַ/אֲשֶׁר הָלַ֤ךְ אַחֲרַ/י֙ בְּ/כָל לְבָב֔/וֹ לַ/עֲשׂ֕וֹת רַ֖ק הַ/יָּשָׁ֥ר בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/008.yaml
  text: and I tore the kingdom away from the house of David and gave it to you[a]. But you have not been like my servant David, who kept my commandments and who walked after me with all his heart[b], to do only what was right in my eyes.
translation:
  language: te
  text: నేను దావీదు వంశం నుండి రాజ్యాన్ని చీల్చి తీసి నీకు ఇచ్చాను. కానీ నువ్వు నా సేవకుడైన దావీదులా ఉండలేదు. అతడు నా ఆజ్ఞలను పాటించాడు, తన పూర్ణహృదయంతో నన్ను అనుసరించాడు[a], నా దృష్టిలో సరైనదే చేయడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నా వెనుక నడిచాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְרַע
  choice: చీల్చి తీసి
  rationale: קרע లోని ‘చీల్చడం’ అనే బలమైన రూపకాన్ని, దావీదు వంశం నుండి రాజ్యాన్ని బలవంతంగా తొలగించిన భావంతో సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: הַמַּמְלָכָה
  choice: రాజ్యాన్ని
  rationale: ఇక్కడ రాజకీయ రాజ్యాన్ని లేదా పాలనా పరిధిని సూచించే సహజమైన తెలుగు పదం.
- source_word: מִבֵּית דָּוִד
  choice: దావీదు వంశం నుండి
  rationale: ‘దావీదు ఇల్లు’ అనే హెబ్రీ రాజవంశీయ నుడికారానికి ఆధునిక తెలుగు పాఠకులకు స్పష్టమైన అర్థసమానం.
- source_word: וָאֶתְּנֶהָ לָךְ
  choice: నీకు ఇచ్చాను
  rationale: గతంలో జరిగిన కార్యాన్ని నేరుగా తెలియజేస్తుంది; కర్మ ‘రాజ్యం’ తెలుగులో ముందే స్పష్టంగా ఉంది.
- source_word: וְלֹא הָיִיתָ כְּעַבְדִּי דָוִד
  choice: నువ్వు నా సేవకుడైన దావీదులా ఉండలేదు
  rationale: ఆరోపణ యొక్క ప్రత్యక్షతను, దేవునితో దావీదుకు ఉన్న గౌరవప్రదమైన సేవా సంబంధాన్ని కాపాడుతుంది.
- source_word: שָׁמַר מִצְוֺתַי
  choice: నా ఆజ్ఞలను పాటిస్తూ
  rationale: ఆజ్ఞలకు విధేయత చూపడం అనే שׁמר యొక్క సందర్భోచిత భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הָלַךְ אַחֲרַי
  choice: నన్ను అనుసరించాడు
  rationale: అక్షరార్థం ‘నా వెనుక నడిచాడు’; తెలుగులో ‘అనుసరించాడు’ అదే విధేయ అనుసరణ భావాన్ని సహజంగా అందిస్తుంది. ప్రత్యక్ష నుడికారాన్ని పాదటీపులో సూచించాం.
- source_word: בְּכָל לְבָבוֹ
  choice: పూర్ణహృదయంతో
  rationale: విభజనలేని సంపూర్ణ అంతరంగ నిబద్ధతను సంక్షిప్తంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
- source_word: לַעֲשׂוֹת רַק הַיָּשָׁר בְּעֵינָי
  choice: నా దృష్టికి సరైనదే చేయడానికి
  rationale: లక్ష్యార్థక క్రియారూపాన్ని, רַק లోని ‘మాత్రమే’ భావాన్ని, దేవుని మూల్యాంకన దృష్టికోణాన్ని కాపాడుతుంది.
theological_decisions:
- issue: దావీదు చేసిన పాపాలు ఇతర వచనాల్లో నమోదైనా ఇక్కడ అతణ్ణి ఆదర్శంగా చూపడం
  choice: ఈ వచనం దావీదును గురించి ఇచ్చే సంపూర్ణ అనుకూల మూల్యాంకనాన్ని ఎలాంటి అర్హతా పదాలు చేర్చకుండా నిలిపాం.
  alternative: ‘సాధారణంగా’ లేదా ‘ఎక్కువగా’ వంటి పరిమితి సూచించే పదాలను చేర్చడం.
  rationale: ఇక్కడి వాక్చాతుర్యం దావీదును యెరోబాముకు వ్యతిరేకమైన విధేయతా ఆదర్శంగా చూపుతుంది. ఇతర వచనాలతో సమన్వయం చేయడానికి ఈ వచనంలో లేని పరిమితులను చేర్చడం సముచితం కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సామాన్య పాఠకులకు సులభమైన శైలి. దేవుడు రాజుతో నేరుగా మాట్లాడుతున్నందున ‘నువ్వు/నీకు’ వాడబడింది. ‘దావీదు వంశం’ రాజవంశీయ భావాన్ని స్పష్టంగా తెలియజేస్తుంది. ప్రధాన పాఠంలోని [a] గుర్తు పాదటీపుతో సరిపోలుతుంది.
