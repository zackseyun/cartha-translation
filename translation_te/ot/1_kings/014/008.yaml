  to: నేను దావీదు వంశం నుండి రాజ్యాన్ని చీల్చి తీసి నీకు ఇచ్చాను. కానీ నువ్వు నా సేవకుడైన దావీదులా ఉండలేదు. అతడు నా ఆజ్ఞలను పాటించాడు, తన పూర్ణహృదయంతో నన్ను అనుసరించాడు[a], నా దృష్టిలో సరైనదే చేయడానికి.
  rationale: పాదటీపు గుర్తును అది వివరిస్తున్న ‘నన్ను అనుసరించాడు’ వద్దకు తరలించాం. హెబ్రీ ‘నా కళ్లలో’ నుడికారానికి సహజమైన తెలుగు రూపమైన ‘నా దృష్టిలో’ వాడాం. దావీదు ఆజ్ఞలను కాపాడటం, దేవుణ్ణి పూర్ణహృదయంతో అనుసరించడం, దేవుని దృష్టిలో సరైనదే చేయడం అనే మూలంలోని మూడు అంశాలనూ, చివరి అనంతరూప సంబంధాన్నీ నిలిపాం.
