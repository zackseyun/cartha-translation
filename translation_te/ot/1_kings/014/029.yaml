source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י רְחַבְעָ֖ם וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣מָּה כְתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/029.yaml
  text: The rest of the acts of Rehoboam[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: te
  text: రెహబాము యొక్క మిగిలిన కార్యాలు, అతడు చేసినదంతా, యూదా రాజుల దినవృత్తాంతాల గ్రంథంలో[a] రాయబడి లేవా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యూదా రాజుల వార్షిక చరిత్రల గ్రంథంలో.’ ఇక్కడి హీబ్రూ పదబంధం రాజుల పాలనలో జరిగిన సంఘటనల రాజరిక నమోదును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי רְחַבְעָם
  choice: రెహబాము గురించిన మిగిలిన విషయాలు
  rationale: יֶתֶר అంటే ‘మిగిలినవి’; రాజసంబంధ చరిత్రల సూత్రప్రాయ వాక్యంలో דִּבְרֵי అనేది కేవలం మాటలను కాక, రాజుకు సంబంధించిన వ్యవహారాలు లేదా నమోదైన విషయాలను సూచిస్తుంది. ‘గురించిన మిగిలిన విషయాలు’ ఈ విస్తృత భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: అతడు చేసినదంతా
  rationale: עשה అనే విస్తృత క్రియకు నైతిక విలువను లేదా ప్రత్యేక సాధన భావాన్ని జోడించకుండా, సంబంధవాచక వాక్యాన్ని సంక్షిప్తంగా మరియు సహజంగా అందిస్తుంది.
- source_word: הֲלֹא הֵמָּה כְתוּבִים
  choice: రాయబడి ఉన్నాయి కదా?
  rationale: הֲלֹא సానుకూల సమాధానాన్ని ఆశించే ప్రతికూల ప్రశ్నను ప్రవేశపెడుతుంది. తెలుగు ‘కదా?’ ఆ వాక్చాతుర్య ప్రశ్నను సహజంగా నిలుపుతుంది; ‘రాయబడి ఉన్నాయి’ మూలంలోని కర్మణి నిర్మాణాన్ని కాపాడుతుంది.
- source_word: עַל סֵפֶר
  choice: గ్రంథంలో
  rationale: అక్షరార్థంగా ‘గ్రంథం/చుట్టపై’ అయినా, లిఖిత ఆధారాన్ని సూచించే సందర్భంలో తెలుగు భాషలో ‘గ్రంథంలో రాయబడి’ అనడం సహజం.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: యూదా రాజుల దినవృత్తాంతాల గ్రంథం
  rationale: ఈ పదబంధం రాజుల పాలనలో జరిగిన సంఘటనల అధికారిక కాలక్రమ నమోదును సూచిస్తుంది. ‘దినవృత్తాంతాలు’ చారిత్రక నమోదనే భావాన్ని తెలియజేస్తూ, ఇదే పేరుగల బైబిలు గ్రంథమని తప్పనిసరిగా భావించే ప్రమాదాన్ని తగ్గిస్తుంది.
