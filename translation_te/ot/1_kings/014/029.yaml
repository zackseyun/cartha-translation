translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, చారిత్రక గ్రంథాల సూత్రప్రాయ ముగింపు శైలిని గౌరవప్రదంగా ఉంచుతూ అనువదించబడింది. మూలంలోని ప్రతికూల వాక్చాతుర్య ప్రశ్నను ‘కదా?’తో నిలిపాం. పాదసూచిక గుర్తును అది వివరిస్తున్న గ్రంథనామం దగ్గర ఉంచాం.
