  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/תָּ֣רַע לַ/עֲשׂ֔וֹת מִ/כֹּ֖ל אֲשֶׁר הָי֣וּ לְ/פָנֶ֑י/ךָ וַ/תֵּ֡לֶךְ וַ/תַּעֲשֶׂה לְּ/ךָ֩ אֱלֹהִ֨ים אֲחֵרִ֤ים וּ/מַסֵּכוֹת֙ לְ/הַכְעִיסֵ֔/נִי וְ/אֹתִ֥/י הִשְׁלַ֖כְתָּ אַחֲרֵ֥י גַוֶּֽ/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/009.yaml
  text: and have done evil above all who were before you. You went and made for yourself other gods and molten images to provoke me to anger[a], and you have cast me behind your back.
translation:
  language: te
  text: నీకు ముందు ఉన్న వారందరికంటే నీవు మరింత చెడు చేశావు. నీవు వెళ్లి, నాకు కోపం పుట్టించడానికి నీ కోసం ఇతర దేవుళ్లను, పోతపోసిన ప్రతిమలను[a] చేసుకున్నావు; నన్ను మాత్రం నీ వీపు వెనుకకు విసిరేశావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే అచ్చులో పోసి తయారు చేసిన ప్రతిమలు; హీబ్రూ పదం సాధారణంగా లోహాన్ని పోతపోసి చేసిన ఆరాధనా వస్తువులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרַע לַעֲשׂוֹת
  choice: మరింత చెడు చేశావు
  rationale: רעה + לעשות అనే ప్రయోగం ‘చెడు చేయడం/దుర్మార్గంగా ప్రవర్తించడం’ అనే భావాన్ని ఇస్తుంది; తరువాతి מִכֹּל వల్ల తులనాత్మక భావాన్ని ‘మరింత’తో స్పష్టం చేశాం.
- source_word: מִכֹּל אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: నీకు ముందు ఉన్న వారందరికంటే
  rationale: לְפָנֶיךָ ఇక్కడ ప్రధానంగా కాలపరమైన ‘నీకు ముందు’ అనే భావంలో ఉంది; సహజమైన తెలుగు తులనాత్మక నిర్మాణాన్ని వాడాం.
- source_word: וַתֵּלֶךְ
  choice: నీవు వెళ్లి
  rationale: తదుపరి చర్యను బలంగా పరిచయం చేసే హీబ్రూ క్రమప్రయోగాన్ని తెలుగులో ‘వెళ్లి’ అని సహజంగా నిలిపాం.
- source_word: וַתַּעֲשֶׂה לְּךָ
  choice: నీ కోసం ... చేసుకున్నావు
  rationale: לְּךָ లోని స్వప్రయోజన/ప్రతిఫలిత భావాన్ని ‘నీ కోసం ... చేసుకున్నావు’ అనే రూపం వ్యక్తం చేస్తుంది.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ఇతర దేవుళ్లు
  rationale: నిబంధన సందర్భంలోని నిషిద్ధ దేవతలను సూచించే ప్రత్యక్ష పదబంధం; ‘విదేశీ’ అనే అదనపు భావాన్ని చేర్చలేదు.
- source_word: וּמַסֵּכוֹת
  choice: పోతపోసిన ప్రతిమలు
  rationale: מַסֵּכָה అచ్చులో పోసి తయారు చేసిన, సాధారణంగా లోహపు ఆరాధనా ప్రతిమను సూచిస్తుంది; తయారీ విధానాన్ని తెలుగులో స్పష్టంగా నిలిపాం.
- source_word: לְהַכְעִיסֵנִי
  choice: నాకు కోపం పుట్టించడానికి
  rationale: כעס హిఫీల్ రూపంలోని కారణార్థక భావాన్ని, మొదటి పురుష కర్మప్రత్యయాన్ని సహజమైన తెలుగులో వ్యక్తం చేశాం.
- source_word: וְאֹתִי הִשְׁלַכְתָּ אַחֲרֵי גַוֶּךָ
  choice: నన్నేమో నీ వీపు వెనుకకు విసిరేశావు
  rationale: దేవుణ్ణి తిరస్కరించడాన్ని తెలిపే తీవ్రమైన శరీరరూపకాన్ని అమూర్తమైన వివరణగా మార్చకుండా నిలిపాం; וְאֹתִי లోని వ్యత్యాస బలాన్ని ‘నన్నేమో’ తెలియజేస్తుంది.
theological_decisions:
- issue: విగ్రహారాధనకు సంబంధించిన నిబంధనాపరమైన అపరాధాన్ని మృదువుచేయకుండా అనువదించడం
  choice: ఇతర దేవుళ్లను, పోతపోసిన ప్రతిమలను
  alternative: విదేశీ దేవుళ్లను, విగ్రహాలను
  rationale: మూలంలో దేవతల వర్గం, తయారు చేసిన ఆరాధనా వస్తువులు రెండూ వేరుగా ఉన్నాయి; వాటిని సాధారణ ‘విగ్రహాలు’గా కలిపివేయలేదు.
- issue: దేవుణ్ణి తిరస్కరించే రూపకంలోని తీవ్రతను కాపాడడం
  choice: నన్నేమో నీ వీపు వెనుకకు విసిరేశావు
  alternative: నన్ను నిర్లక్ష్యం చేశావు
  rationale: హీబ్రూ వాక్యం తీవ్రమైన దృశ్యరూపకాన్ని ఉపయోగిస్తుంది; దానిని భావానువాదంతో సున్నితపరచకుండా యథాశక్తి నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన వాక్యనిర్మాణం వాడబడింది. ‘వీపు వెనుకకు విసిరేశావు’ అనే మూలరూపకాన్ని ఉద్దేశపూర్వకంగా నిలిపాం; ‘పోతపోసిన ప్రతిమలు’ సాధారణ పాఠకునికి తయారీ భావాన్ని స్పష్టం చేస్తుంది.
