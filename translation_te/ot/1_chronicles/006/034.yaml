source:
  edition: WLC
  text: וְֽ/אַהֲרֹ֨ן וּ/בָנָ֜י/ו מַקְטִירִ֨ים עַל מִזְבַּ֤ח הָֽ/עוֹלָה֙ וְ/עַל מִזְבַּ֣ח הַ/קְּטֹ֔רֶת לְ/כֹ֕ל מְלֶ֖אכֶת קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים וּ/לְ/כַפֵּר֙ עַל יִשְׂרָאֵ֔ל כְּ/כֹל֙ אֲשֶׁ֣ר צִוָּ֔ה מֹשֶׁ֖ה עֶ֥בֶד הָ/אֱלֹהִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/034.yaml
  text: And Aaron and his sons were offering on the altar of burnt offering and on the altar of incense[a], for all the work of the Most Holy Place and to make atonement for Israel, according to all that Moses the servant of God had commanded.
translation:
  language: te
  text: అహరోను మరియు అతని కుమారులు దహనబలి బలిపీఠం మీదను ధూప బలిపీఠం మీదను అర్పణలను దహించేవారు; అతి పరిశుద్ధ స్థలంలోని సమస్త సేవను నిర్వహించడానికి, ఇశ్రాయేలు కోసం ప్రాయశ్చిత్తం చేయడానికి, దేవుని సేవకుడైన మోషే ఆజ్ఞాపించినదంతటి ప్రకారం వారు అలా చేసేవారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַקְטִירִים
  choice: అర్పణలను దహించేవారు
  rationale: హిఫీల్ రూపం అర్పణను లేదా ధూపాన్ని పొగగా పైకి లేచేలా దహించడాన్ని సూచిస్తుంది. రెండు రకాల బలిపీఠాలూ ప్రస్తావించబడినందున, తెలుగు పాఠంలో విస్తృతంగా వర్తించే ఈ పదబంధాన్ని ఎంచుకున్నాం.
- source_word: מִזְבַּח הָעוֹלָה
  choice: దహనబలి బలిపీఠం
  rationale: עֹלָה అనే పూర్తిగా దహించే అర్పణకు సంబంధించిన బలిపీఠాన్ని స్పష్టంగా సూచించే ప్రామాణిక తెలుగు పదబంధం.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: ధూప బలిపీఠం
  rationale: ధూపం దహించే బలిపీఠాన్ని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: לְכֹל מְלֶאכֶת
  choice: సేవ అంతటినీ నిర్వహించడానికి
  rationale: ఆలయ సందర్భంలో מְלָאכָה అప్పగించబడిన పని లేదా సేవను సూచిస్తుంది; తెలుగు వాక్యంలో ఉద్దేశార్థాన్ని సహజంగా వ్యక్తం చేయడానికి ఈ రూపం వాడబడింది.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: అతి పరిశుద్ధ స్థలం
  rationale: ఈ పదబంధం అంతర్గత పరిశుద్ధ స్థలాన్ని సూచించగలదు. అయితే 'అతి పరిశుద్ధమైన వాటిని' అనే అర్థం కూడా సాధ్యమైనందున దానిని పాదసూచికలో ఉంచాం.
- source_word: וּלְכַפֵּר עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కోసం ప్రాయశ్చిత్తం చేయడానికి
  rationale: యాజకసంబంధ సందర్భంలోని כפר పదానికి ఉన్న విస్తృత బలిసంబంధ భావాన్ని నిలుపుతూ, ఒక ప్రత్యేక ప్రాయశ్చిత్త సిద్ధాంతాన్ని అనువాదంలో చేర్చకుండా ఉంటుంది.
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: ఆజ్ఞాపించినదంతటి ప్రకారం
  rationale: మోషే ఇచ్చిన ఆజ్ఞల సంపూర్ణ పరిధికి అనుగుణంగా వారు చేసినట్లు తెలిపే హెబ్రీయ భావాన్ని నిలుపుతుంది.
- source_word: עֶבֶד הָאֱלֹהִים
  choice: దేవుని సేవకుడు
  rationale: మోషేకు ఇవ్వబడిన గౌరవపూర్వక బిరుదును సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים పదబంధం సూచించేది
  choice: స్థలాన్ని సూచించే ‘అతి పరిశుద్ధ స్థలం’
  alternative: ‘అతి పరిశుద్ధమైనవి’ లేదా ‘పరిశుద్ధాతిపరిశుద్ధమైనవి’
  rationale: యాజక సేవ, బలిపీఠాలు, ప్రాయశ్చిత్తం అనే సమీప సందర్భంలో అంతర్గత పరిశుద్ధ స్థలాన్ని సూచించడం సహజం. అయినా హెబ్రీయ పదబంధం అత్యంత పరిశుద్ధమైన వస్తువులు లేదా విషయాలను కూడా సూచించగలదు కాబట్టి ఆ సందిగ్ధతను పాదసూచికలో నిలిపాం.
- issue: כפר పదం యొక్క సిద్ధాంతపరమైన పరిధి
  choice: ప్రాయశ్చిత్తం చేయడం
  alternative: పాపపరిహారం చేయడం
  rationale: ‘ప్రాయశ్చిత్తం’ బలిసంబంధ చర్యను విస్తృతంగా వ్యక్తం చేస్తుంది; పాఠం స్పష్టంగా చెప్పని ఒక నిర్దిష్ట సిద్ధాంత నమూనాకు అర్థాన్ని పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే యాజకసేవ సందర్భానికి తగిన గౌరవప్రదమైన శైలిలో అనువదించబడింది. పొడవైన హెబ్రీయ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించినా, క్రియల మధ్య ఉద్దేశ సంబంధం నిలుపబడింది.
