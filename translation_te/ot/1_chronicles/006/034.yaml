revisions:
- from: అహరోను, అతని కుమారులు దహనబలి బలిపీఠం మీద, ధూప బలిపీఠం మీద అర్పణలను దహించేవారు. అతి పరిశుద్ధ స్థలానికి[a] సంబంధించిన సేవ అంతటినీ నిర్వహించడానికి, ఇశ్రాయేలు కోసం ప్రాయశ్చిత్తం చేయడానికి దేవుని సేవకుడైన మోషే ఆజ్ఞాపించినదంతటి ప్రకారం వారు అలా చేసేవారు.
  to: అహరోను మరియు అతని కుమారులు దహనబలి బలిపీఠం మీదను ధూప బలిపీఠం మీదను అర్పణలను దహించేవారు; అతి పరిశుద్ధ స్థలంలోని సమస్త సేవను నిర్వహించడానికి, ఇశ్రాయేలు కోసం ప్రాయశ్చిత్తం చేయడానికి, దేవుని సేవకుడైన మోషే ఆజ్ఞాపించినదంతటి ప్రకారం వారు అలా చేసేవారు.
  rationale: 'పైన సూచించిన పునరుక్తి సమస్యను పరిష్కరించడానికి వాక్యాన్ని సవరించాలి. అయితే ప్రతిపాదిత revised_textలో చివరనున్న “వారు అలా చేసేవారు” కూడా తొలగించాలి; పూర్తి సురక్షిత పాఠం ఇలా ఉండాలి: “అహరోను మరియు అతని కుమారులు దహనబలి బలిపీఠం మీదను ధూప బలిపీఠం మీదను అర్పణలను దహించేవారు; అతి పరిశుద్ధ స్థలంలోని సమస్త సేవను నిర్వహించడానికి, ఇశ్రాయేలు కోసం ప్రాయశ్చిత్తం చేయడానికి, దేవుని సేవకుడైన మోషే ఆజ్ఞాపించినదంతటి ప్రకారం.” ఈ చివరి పదబంధం తెలుగులో అసంపూర్ణంగా ఉండే అవకాశం ఉన్నందున, మరింత సహజమైన పూర్తి రూపం: “అహరోను మరియు అతని కుమారులు దహనబలి బలిపీఠం మీదను ధూప బలిపీఠం మీదను అర్పణలను దహించేవారు; అతి పరిశుద్ధ స్థలంలోని సమస్త సేవను నిర్వహిస్తూ, ఇశ్రాయేలు కోసం ప్రాయశ్చిత్తం చేస్తూ, దేవుని సేవకుడైన మోషే ఆజ్ఞాపించినదంతటి ప్రకారం వారు సేవచేశారు.”'
