translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి సంబంధాల శ్రేణి స్పష్టంగా ఉండేందుకు ‘ఇతడు’ను పునరుక్తి చేశాం. భాష సరళంగా, గౌరవప్రదంగా ఉంచబడింది.
