  - marker: a
    text: ఇక్కడ, అలాగే ప్రతి ‘కుమారుడు’ అనే పదం వచ్చిన చోట, ‘వంశస్థుడు’ అని కూడా అనువదించవచ్చు; హీబ్రూ వంశావళులు మధ్యలోని కొన్ని తరాలను పేర్కొనకుండా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశావళుల్లో בֶּן సాధారణంగా ‘కుమారుడు’ అని అర్థం; కొన్నిసార్లు తరాలు సంక్షిప్తమైనప్పుడు ‘వంశస్థుడు’ అనే విస్తృత అర్థమూ ఉండవచ్చు.
- source_word: אַמְצִי
  choice: అమ్జీ
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని వ్యంజనాలు, స్వరాలకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: בָּנִי
  choice: బానీ
  rationale: హీబ్రూ వ్యక్తినామాన్ని నేరుగా, సహజమైన తెలుగు రూపంలో లిప్యంతరీకరించాం.
- source_word: שָׁמֶר
  choice: షెమెరు
  rationale: హీబ్రూ ఉచ్చారణను ప్రతిబింబించేలా పేరును తెలుగులో లిప్యంతరీకరించాం; తెలుగు వాక్యంలో చదవడానికి అనుకూలంగా అంత్య అచ్చును చేర్చాం.
