  text: Elkanah his son[a], and Ebiasaph his son, and Assir his son.
translation:
  language: te
  text: అతని కుమారుడు ఎల్కానా, మరియు అతని కుమారుడు ఎబ్యాసాఫు[a], మరియు అతని కుమారుడు అస్సీరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అబ్యాసాఫు”; కొన్ని సంప్రదాయ అనువాదాల్లోను, సమాంతర వంశావళి రూపాల్లోను కనిపించే సుపరిచిత లిప్యంతరీకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלְקָנָה
  choice: ఎల్కానా
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపానికి దగ్గరగా ఆధునిక తెలుగు లిప్యంతరీకరణ చేయబడింది.
- source_word: בְנוֹ
  choice: అతని కుమారుడు
  rationale: 3వ పురుష ఏకవచన పుంలింగ ప్రత్యయంతో ఉన్న בֵּן పదానికి నేరమైన అర్థం ‘అతని కుమారుడు.’ వంశావళుల్లో ఇది విస్తృతంగా వంశస్థుణ్ణి సూచించగలిగినా, మూలంలోని ప్రత్యక్ష పుత్ర సంబంధ భాషను నిలిపాము.
- source_word: וְ
  choice: (జాబితా క్రమంతో వ్యక్తీకరించబడింది)
  rationale: హీబ్రూలో పేర్లను కలిపే సాధారణ సంయోజకం. సహజమైన తెలుగు వంశావళి శైలిలో పదేపదే ‘మరియు’ అనడం కంటే వరుస వాక్యభాగాల ద్వారా దాని అనుసంధాన భావం వ్యక్తమవుతుంది.
- source_word: אֶבְיָסָף
  choice: ఎబ్యాసాఫు
  rationale: ఇక్కడి హీబ్రూ రూపాన్ని అనుసరించిన వ్యక్తి పేరు. సమాంతర వంశావళి రూపాలు, సుపరిచిత సంప్రదాయ లిప్యంతరీకరణ ఆధారంగా ‘అబ్యాసాఫు’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: אַסִּיר
  choice: అస్సీరు
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగు ఉచ్చారణకు అనుగుణంగా నేరుగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన వంశావళి శైలి వాడబడింది. హీబ్రూ పదక్రమాన్ని సాధ్యమైనంతవరకు నిలిపి, తెలుగులో అసహజంగా ఉండే పునరుక్త ‘మరియు’లను వదిలి సంబంధాల గొలుసును స్పష్టంగా చూపించాం.
