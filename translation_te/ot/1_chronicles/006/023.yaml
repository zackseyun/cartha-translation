translation:
  language: te
  text: ఇశ్హారు కుమారుడు, కహాతు కుమారుడు, లేవి కుమారుడు, ఇశ్రాయేలు[a] కుమారుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘ఇశ్రాయేలు’; అనగా, అతని నిబంధన నామమైన యాకోబు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశావళి సూత్రంలో పదేపదే వచ్చే בֶּן‌కు సహజమైన, రూపపరంగా సమీపమైన తెలుగు పదం ‘కుమారుడు’. వంశావళులు కొన్నిసార్లు తరాలను దాటవేసినా, ఇక్కడ ‘వంశస్థుడు’ అని అర్థాన్ని విస్తరించాల్సిన అవసరం లేదు.
- source_word: יִצְהָר
  choice: ఇస్హారు
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: קְהָת
  choice: కహాతు
  rationale: హీబ్రూ వ్యక్తి పేరును అనువదించకుండా, తెలుగులో గుర్తుపట్టదగిన సంప్రదాయ రూపంలో లిప్యంతరీకరించాం.
- source_word: לֵוִי
  choice: లేవి
  rationale: హీబ్రూ వ్యక్తి పేరుకు తెలుగులో సుపరిచితమైన లిప్యంతరీకరణను వాడాం.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: మూలపాఠంలో ‘యాకోబు’ కాకుండా יִשְׂרָאֵל ఉన్నందున ఆ పేరునే ప్రధాన పాఠంలో నిలిపాం; వ్యక్తి గుర్తింపును పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: יִשְׂרָאֵל అనే పేరును యాకోబుగా వివరణాత్మకంగా మార్చాలా?
  choice: ప్రధాన పాఠంలో ‘ఇశ్రాయేలు’ను నిలిపి, ‘యాకోబు’ అనే గుర్తింపును పాదసూచికలో ఇవ్వడం
  alternative: ప్రధాన పాఠంలోనే ‘యాకోబు’ అని రాయడం
  rationale: మూల హీబ్రూ పదరూపాన్ని కాపాడుతూ, ఈ వంశావళిలో సూచించబడిన వ్యక్తి ఎవరో పాఠకునికి స్పష్టం చేస్తుంది; పేర్ల మధ్యనున్న వేదాంతపరమైన ప్రాధాన్యాన్ని పాఠ్యంలో నిశ్శబ్దంగా సమపరచదు.
translation_notes:
  register: సంక్షిప్తమైన హీబ్రూ వంశావళి లయను కాపాడేందుకు ప్రతి పేరుతో ‘కుమారుడు’ను పునరావృతం చేశాం. భాష ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరంగా ఉంచబడింది. ఆంగ్ల సంప్రదింపు పాఠంలో [a] సూచిక ‘Izhar’ తర్వాత కనిపించినా, దాని పాదసూచిక విషయం ‘Israel’ గురించినది కాబట్టి తెలుగులో సూచికను ‘ఇశ్రాయేలు’ తర్వాత ఉంచాం.
