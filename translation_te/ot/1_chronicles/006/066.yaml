  yaml_path: translation/ot/1_chronicles/006/066.yaml
  text: and Heshbon with its pasturelands[a], and Jazer with its pasturelands.
translation:
  language: te
  text: హెష్బోనును, దాని పచ్చిక బయళ్లను[a], యాజేరును, దాని పచ్చిక బయళ్లను ఇచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఉమ్మడి భూములను’ లేదా ‘పట్టణాల చుట్టూ ఉన్న మేత భూములను.’ హీబ్రూ పదం పట్టణానికి చెందిన బహిరంగ భూమిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: హెష్బోను
  rationale: స్థలనామాన్ని అనువదించకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: מִגְרָשֶׁיהָ
  choice: దాని పచ్చిక బయళ్లను
  rationale: లేవీయుల పట్టణాల సందర్భంలో ఈ పదం పట్టణానికి చెందిన, పశువులు మేయడానికి ఉపయోగపడే బహిరంగ భూములను సూచిస్తుంది. తెలుగు పాఠకులకు సహజంగా అర్థమయ్యేలా ‘పచ్చిక బయళ్లు’ అని ఇచ్చాం; ఇతర సాధ్యమైన భావాలను పాదటిప్పణిలో ఉంచాం.
- source_word: יַעְזֵיר
  choice: యాజేరు
  rationale: స్థలనామాన్ని అనువదించకుండా, హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וְאֶת
  choice: -ను, ... -ను
  rationale: హీబ్రూలో పునరావృతమయ్యే సంధి మరియు కర్మ సూచకాన్ని తెలుగు కర్మ విభక్తితో జాబితా నిర్మాణంగా సహజంగా వ్యక్తం చేశాం.
- source_word: '[elliptical verb from context]'
  choice: ఇచ్చారు
  rationale: ఈ వచనం హీబ్రూలో ముందటి వాక్యంలోని క్రియపై ఆధారపడిన జాబితా భాగం. స్వతంత్ర తెలుగు వచనంగా స్పష్టత కోసం సందర్భం నుంచి ‘ఇచ్చారు’ అనే క్రియను పూరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి/భూవిభజన జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలి. మూలంలోని పేర్ల వరుసను నిలుపుతూ, తెలుగులో సంపూర్ణ వాక్యంగా ఉండేందుకు సందర్భానుసార క్రియను చేర్చాం.
