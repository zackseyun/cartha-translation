  source_fidelity: హీబ్రూ జాబితాలోని రెండు స్థలనామాలను, వాటికి చెందిన మִגְרָשׁ (పట్టణానికి చెందిన బహిరంగ మేత/పచ్చిక భూమి)లను సరిగ్గా ప్రతిబింబించింది. మూలంలో క్రియ పూర్వసందర్భం నుంచి గ్రహించబడుతుంది; తెలుగులో సందర్భానుసారంగా “ఇచ్చారు” అని పూరించడం అర్థాన్ని మార్చదు.
  naturalness: “హెష్బోనును, దాని పచ్చిక బయళ్లను, యాజేరును, దాని పచ్చిక బయళ్లను ఇచ్చారు” ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, భూవిభజన-జాబితా శైలికి తగినట్లుగా ఉంది. పునరుక్తి మూలంలోని జాబితా నిర్మాణాన్నే సహజంగా నిలుపుతుంది.
  terminology: “పచ్చిక బయళ్లు” మִגְרָשֶׁיהָకు ఈ సందర్భంలో సరైన, సులభగ్రాహ్యమైన పదం. పాదటిప్పణి “ఉమ్మడి భూములు” మరియు పట్టణానికి చెందిన చుట్టుపక్కల మేతభూములు అనే ప్రత్యామ్నాయాలను సముచితంగా తెలియజేస్తుంది. హెష్బోను, యాజేరు అనే లిప్యంతరీకరణలు ఆమోదయోగ్యమైనవి.
