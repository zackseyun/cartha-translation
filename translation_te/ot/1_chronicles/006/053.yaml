  yaml_path: translation/ot/1_chronicles/006/053.yaml
  text: and Jokmeam with its pasturelands[b][a], and Beth-horon with its pasturelands.
translation:
  language: te
  text: యొక్మెయామును[a] దాని పచ్చికబయళ్లతో[b] సహా, మరియు బేత్-హోరోనును దాని పచ్చికబయళ్లతో సహా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘యొక్మెయాము’; సమాంతర స్థలనామ సంప్రదాయాల ఆధారంగా కొన్ని అనువాదాల్లో ‘యొక్నెయాము’ అని ఉంటుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘సామూహిక భూములు,’ అంటే ప్రతి పట్టణానికి అనుబంధంగా ఉన్న చుట్టుపక్కల బహిరంగ భూములు.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקְמְעָם
  choice: యొక్మెయాము
  rationale: దినవృత్తాంతములలోని మసొరేటిక్ హీబ్రూ వ్యంజన రూపాన్ని అనుసరించి స్థలనామాన్ని లిప్యంతరీకరించాం; ఇతర సమాంతర స్థలనామ సంప్రదాయాల్లో కనిపించే ‘యొక్నెయాము’ రూపాన్ని పాఠ్యంలోకి తీసుకురాలేదు.
- source_word: מִגְרָשֶׁיהָ
  choice: దాని పచ్చికబయళ్లు
  rationale: లేవీయుల పట్టణాల సందర్భంలో מִגְרָשׁ అనేది పట్టణానికి అనుబంధంగా ఉన్న బహిరంగ భూమిని, ముఖ్యంగా పశువుల మేతభూమిని సూచిస్తుంది; ఆధునిక తెలుగు పాఠకులకు ‘పచ్చికబయళ్లు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: בֵּית חוֹרוֹן
  choice: బేత్-హోరోను
  rationale: హీబ్రూ సంయుక్త స్థలనామాన్ని గుర్తించగలిగేలా ప్రామాణిక తెలుగు లిప్యంతరీకరణతో, మధ్య గీతతో ఇచ్చాం.
- source_word: וְאֶת
  choice: ; / సహా
  rationale: జాబితాలో పునరావృతమయ్యే సంధి మరియు కర్మసూచకాన్ని యాంత్రికంగా అనువదించకుండా, తెలుగులో సహజమైన సమన్వయ నిర్మాణంతో అందించాం.
