translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి/పట్టణాల జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలిని వాడాం. ‘దాని’ అనే ఏకవచన సూచన ప్రతి పట్టణానికీ అనుబంధమైన భూమిని స్పష్టపరుస్తుంది; పాదసూచిక గుర్తులన్నీ ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
