  text: షిమెయా అతని కుమారుడు[a]; హగ్గీయా అతని కుమారుడు; అసాయా అతని కుమారుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ప్రతి పేరుకు తరువాత “అతని కుమారుడు” అనే వంశావళి సూత్రం పునరావృతమై, వంశంలోని వరుస తరాలను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁמְעָא
  choice: షిమెయా
  rationale: హీబ్రూ వ్యక్తిపేరును అనువదించకుండా, దాని ధ్వనికి దగ్గరగా ఆధునిక తెలుగు లిపిలో ఇచ్చాం.
- source_word: בְנוֹ
  choice: అతని కుమారుడు
  rationale: బేన్ అనే నామవాచకానికి మూడవ పురుష ఏకవచన పుంలింగ ప్రత్యయం కలిసిన రూపం; వరుస వంశసంబంధాన్ని సూచించే పునరుక్త సూత్రాన్ని నిలిపాం.
- source_word: חַגִּיָּה
  choice: హగ్గీయా
  rationale: వ్యక్తిపేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం; చివరి -యా దైవనామ మూలకాన్ని ప్రతిబింబిస్తుంది.
- source_word: עֲשָׂיָה
  choice: అసాయా
  rationale: వ్యక్తిపేరును హీబ్రూ రూపానికి సమీపంగా తెలుగు లిపిలో ఇచ్చాం; దానిని అర్థానువాదం చేయలేదు.
