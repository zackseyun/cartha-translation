translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా, వంశావళికి తగిన సంక్షిప్తమైన గంభీర శైలిని వాడాం. మూలంలోని పునరుక్త నిర్మాణాన్ని యథాతథంగా నిలిపాం.
