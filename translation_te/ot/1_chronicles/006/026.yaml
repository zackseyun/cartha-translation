  terminology: ‘కుమారుడు’ వంశావళి పదజాలానికి తగినది. ఎత్నీ, జెరహు, అదాయా అనే నామరూపాలు తెలుగు బైబిలు-శైలికి అనుకూలంగా ఉన్నాయి; అర్థానువాదం చేయకుండా వ్యక్తినామాలను లిప్యంతరీకరించడం సముచితం.
