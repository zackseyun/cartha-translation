  text: the son of Ethni, the son of Zerah, the son of Adaiah.
translation:
  language: te
  text: ఎత్నీ కుమారుడు, జెరహు కుమారుడు, అదాయా కుమారుడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశావళిలో ప్రత్యక్ష పితృసంబంధాన్ని సూచించే בֶּן పదాన్ని సహజమైన తెలుగు వంశావళి శైలిలో ‘కుమారుడు’గా అనువదించాం. మూలంలోని పునరుక్త నిర్మాణాన్ని కూడా నిలిపాం.
- source_word: אֶתְנִי
  choice: ఎత్నీ
  rationale: హీబ్రూ వ్యక్తినామాన్ని అనువదించకుండా, ఆధునిక తెలుగు ఉచ్చారణకు తగిన విధంగా లిప్యంతరీకరించాం.
- source_word: זֶרַח
  choice: జెరహు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు నామరూపాలకు అనుకూలంగా లిప్యంతరీకరించాం; చివరి వ్యంజనాన్ని పలకడానికి ‘హు’ రూపం సహజంగా ఉంటుంది.
- source_word: עֲדָיָה
  choice: అదాయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని ధ్వనిరూపానికి దగ్గరగా, తెలుగులో సులభంగా చదవగల ‘అదాయా’గా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: సంక్షిప్తమైన వంశావళి నిర్మాణాన్ని యథాతథంగా ఉంచుతూ, ఆధునిక ప్రామాణిక తెలుగులో గంభీరంగా మరియు సులభంగా చదవగల శైలిని ఉపయోగించాం.
