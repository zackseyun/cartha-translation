  source_fidelity: హీబ్రూ మూలంలోని పునరావృత వంశావళి నిర్మాణం—“ఎత్నీ కుమారుడు, జెరహు కుమారుడు, అదాయా కుమారుడు”—తెలుగు అనువాదంలో పూర్తిగా నిలిచింది. మూడు בֶּן పదాలకు ‘కుమారుడు’ సరియైన సమానార్థక ప్రయోగం.
