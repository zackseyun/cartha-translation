  yaml_path: translation/ot/1_chronicles/006/036.yaml
  text: Bukki his son, Uzzi his son, Zerahiah his son.
translation:
  language: te
  text: బుక్కీ అతని కుమారుడు; ఉజ్జీ అతని కుమారుడు; జెరహ్యా అతని కుమారుడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֻּקִּי
  choice: బుక్కీ
  rationale: వ్యక్తి పేరు కావడంతో అనువదించకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిప్యంతరీకరణ చేయబడింది.
- source_word: בְנ/וֹ
  choice: కుమారుడు
  rationale: בֵּן అనే నామవాచకానికి తృతీయ పురుష ఏకవచన పుంలింగ ప్రత్యయం జతై అక్షరార్థంగా ‘అతని కుమారుడు’ అని అర్థం. తెలుగులో సంబంధం స్పష్టంగా ఉండేందుకు ప్రతి పేరుతో ‘కుమారుడు’ నిర్మాణాన్ని ఉపయోగించాం.
- source_word: עֻזִּי
  choice: ఉజ్జీ
  rationale: వ్యక్తి పేరును హీబ్రూ ధ్వనికి దగ్గరగా తెలుగు లిపిలో ఇచ్చాం; మధ్య హల్లులోని దృఢ ఉచ్చారణను ‘జ్జ’తో సూచించాం.
- source_word: זְרַחְיָה
  choice: జెరహ్యా
  rationale: వ్యక్తి పేరును అనువదించకుండా హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం; చివరి יה భాగాన్ని సహజమైన తెలుగు బైబిలు నామరూపంగా ‘హ్యా’ అని ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి సంబంధం వెంటనే అర్థమయ్యేలా సంక్షిప్తమైన గౌరవప్రద శైలి. హీబ్రూలోని పునరుక్త ‘అతని కుమారుడు’ సూత్రాన్ని తెలుగులో అస్పష్ట సర్వనామాలకంటే పేర్లను పునరావృతం చేసి సహజంగా వ్యక్తపరిచాం.
