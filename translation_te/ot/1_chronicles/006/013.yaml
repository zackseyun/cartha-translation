  text: 'And the sons of Samuel: the firstborn[a], Vashni, and Abijah.'
translation:
  language: te
  text: 'సమూయేలు కుమారులు: జ్యేష్ఠుడైన వష్నీ, మరియు అబీయా.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘వష్నీ’. ఈ పదబంధాన్ని ‘జ్యేష్ఠుడు, మరియు రెండవవాడు అబీయా’ అని కూడా అర్థం చేసుకోవచ్చు. 1 సమూయేలు 8:2లో సమూయేలు కుమారుల పేర్లు యోవేలు, అబీయా అని ఉన్నాయి.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: వంశావళి వరుసలో సహజమైన ఆధునిక తెలుగు కోసం సంబంధాన్ని ‘కుమారులు’ అని ఇచ్చాం; ఆరంభ సంధికారకమైన ו భావం సందర్భంలోని కొనసాగింపులో అంతర్లీనంగా ఉంది.
- source_word: שְׁמוּאֵל
  choice: సమూయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపంలో లిప్యంతరీకరించాం.
- source_word: הַבְּכֹר
  choice: జ్యేష్ఠుడైన
  rationale: కుటుంబంలోని జన్మక్రమాన్ని సూచించే ‘మొదట పుట్టినవాడు’ అనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַשְׁנִי
  choice: వష్నీ
  rationale: మసొరేటిక్ స్వరచిహ్నాలతో ఉన్న రూపాన్ని ప్రధాన పాఠ్యంలో వ్యక్తినామంగా నిలిపాం; ‘రెండవవాడు’ అనే సాధ్యమైన అవగాహనను పాదటిప్పణిలో ఉంచాం.
- source_word: וַאֲבִיָּה
  choice: అబీయా
  rationale: సంధికారకంతో కూడిన వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం; జాబితా నిర్మాణం వల్ల ‘మరియు’ను విడిగా చేర్చడం అవసరం లేదు.
theological_decisions:
- issue: సమూయేలు కుమారుల పేర్లు, జన్మక్రమానికి సంబంధించిన పాఠ్య క్లిష్టత
  choice: ప్రధాన పాఠ్యంలో మసొరేటిక్ రూపమైన ‘వష్నీ’ని వ్యక్తినామంగా ఉంచడం
  alternative: ఈ పదబంధాన్ని ‘జ్యేష్ఠుడు, రెండవవాడు అబీయా’ అని చదవడం; లేదా 1 సమూయేలు 8:2తో సమన్వయపరచి జ్యేష్ఠుని పేరు ‘యోవేలు’ అని చేర్చడం
  rationale: ఇది సిద్ధాంతపరమైన సమస్య కాకుండా పాఠ్య, వంశావళి క్లిష్టత. మూలభాషకు ప్రాధాన్యం ఇస్తూ స్వీకృత హీబ్రూ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని నిజమైన అనిశ్చితిని పాదటిప్పణిలో వెల్లడించాం; సమాంతర వచనం ఆధారంగా పేరును మౌనంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలిని పాటించాం. ‘జ్యేష్ఠుడైన’ గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది. పాఠ్య అనిశ్చితిని ప్రధాన వాక్యంలో పరిష్కరించకుండా పాదటిప్పణిలో స్పష్టంగా సంరక్షించాం.
