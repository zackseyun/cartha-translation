  text: the son of Elkanah[a], the son of Joel, the son of Azariah, the son of Zephaniah.
translation:
  language: te
  text: ఎల్కానా కుమారుడు[a], యోవేలు కుమారుడు, అజర్యా కుమారుడు, జెఫన్యా కుమారుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ప్రతి చోటా ‘కుమారుడు’ అనే మాటకు ‘వంశస్థుడు’ అని కూడా అర్థం కావచ్చు; ఎందుకంటే హీబ్రూ వంశావళులు కొన్నిసార్లు మధ్య తరాలను పేర్కొనవు. అయితే ఇక్కడి వరుస ప్రత్యక్ష తండ్రి-కొడుకు సంబంధానికే అనుకూలంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశావళిలో בֶּן సాధారణంగా తండ్రి-కొడుకు సంబంధాన్ని సూచిస్తుంది. హీబ్రూ మూలంలోని పునరావృత వంశావళి శైలిని నిలుపుతూ ప్రతి పేరుతో ‘కుమారుడు’ అని అనువదించాం.
- source_word: אֶלְקָנָה
  choice: ఎల్కానా
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక ప్రామాణిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: יוֹאֵל
  choice: యోవేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు పాఠకులకు సహజంగా ఉండే రూపంలో లిప్యంతరీకరించాం.
- source_word: עֲזַרְיָה
  choice: అజర్యా
  rationale: హీబ్రూ వ్యక్తినామంలోని ధ్వనులకు దగ్గరగా ఉండే, తెలుగులో సులభంగా చదవగల రూపాన్ని ఎంచుకున్నాం.
- source_word: צְפַנְיָה
  choice: జెఫన్యా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న, సులభంగా గుర్తించగల రూపంలో లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గంభీర శైలిని వాడాం. మూలంలోని పునరావృత నిర్మాణాన్ని నిలిపాం; ఈ వచనం ముందరి వచనంతో కొనసాగే జాబితా భాగమని ప్రతిబింబించేలా స్వతంత్ర క్రియను చేర్చలేదు.
