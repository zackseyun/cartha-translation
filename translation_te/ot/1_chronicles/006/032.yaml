translation:
  language: te
  text: మహ్లీ కుమారుడు, మూషీ కుమారుడు, మెరారీ కుమారుడు, లేవీ కుమారుడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశావళిలో పదేపదే వచ్చే בֶּן అనే పదానికి సహజమైన, ప్రత్యక్షమైన తెలుగు సమానం ‘కుమారుడు’. వంశావళులు కొన్నిసార్లు తరాలను విడిచిపెట్టగలిగినా, ఈ వరుసలో ‘వంశస్థుడు’ అని విస్తరించి అనువదించాల్సిన అవసరం లేదు.
- source_word: מַחְלִי
  choice: మహ్లీ
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు లిపిలో ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: מוּשִׁי
  choice: మూషీ
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు లిపిలో ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: מְרָרִי
  choice: మెరారీ
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు లిపిలో ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: לֵוִי
  choice: లేవీ
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు లిపిలో ధ్వన్యనుసారంగా లిప్యంతరీకరించాం; ఇక్కడ అది గోత్రపిత లేవీని సూచిస్తుంది.
