translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలిని నిలిపాం. మూలంలోని పునరుక్త ‘కుమారుడు’ నిర్మాణాన్ని కాపాడి, పేర్ల మధ్య వంశ సంబంధాన్ని స్పష్టంగా ఉంచాం.
