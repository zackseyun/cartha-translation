- from: 'గేర్షోము వంశస్థులకు, మనష్షే అర్ధగోత్రపు వంశం నుండి: బాషానులోని గోలాను దాని పచ్చికబయళ్లతోపాటు[a], అష్టారోతును దాని పచ్చికబయళ్లతోపాటు ఇచ్చారు.'
  to: 'గెర్షోము కుమారులకు, మనష్షే అర్ధగోత్రంలోని వంశం నుండి: బాషానులోని గోలానును దాని పచ్చికబయళ్లతోపాటు[a], అష్టారోతును దాని పచ్చికబయళ్లతోపాటు ఇచ్చారు.'
