source:
  edition: WLC
  text: לִ/בְנֵי֮ גֵּרְשׁוֹם֒ מִ/מִּשְׁפַּ֗חַת חֲצִי֙ מַטֵּ֣ה מְנַשֶּׁ֔ה אֶת גּוֹלָ֥ן בַּ/בָּשָׁ֖ן וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת עַשְׁתָּר֖וֹת וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/056.yaml
  text: 'To the sons of Gershom[a], from the clan of the half-tribe of Manasseh: Golan in Bashan with its pasturelands, and Ashtaroth with its pasturelands.'
translation:
  language: te
  text: 'గెర్షోము కుమారులకు, మనష్షే అర్ధగోత్రంలోని వంశం నుండి: బాషానులోని గోలానును దాని పచ్చికబయళ్లతోపాటు[a], అష్టారోతును దాని పచ్చికబయళ్లతోపాటు ఇచ్చారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పచ్చికబయళ్లు’ అనే చోట ‘సామూహిక భూములు’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం పట్టణానికి చెందిన చుట్టుపక్కల బహిరంగ భూమిని సూచిస్తుంది. అది తరచుగా పశువులను మేపడానికి ఉపయోగించబడేది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי גֵּרְשׁוֹם
  choice: గేర్షోము వంశస్థులకు
  rationale: ల ఉపసర్గం కేటాయింపును సూచిస్తుంది. ‘కుమారులకు’ అనే అక్షరార్థం కంటే వంశావళి సందర్భంలో ‘వంశస్థులకు’ సాధారణ ఆధునిక తెలుగు పాఠకులకు ఉద్దేశించిన విస్తృత వంశార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִמִּשְׁפַּחַת
  choice: వంశం నుండి
  rationale: గోత్రంలోని ఉపవిభాగాన్ని సూచించే מִשְׁפָּחָהకు ‘వంశం’ సహజమైన తెలుగు పదం; מן ఉపసర్గంలోని ‘నుండి’ భావాన్ని నిలుపుతుంది.
- source_word: חֲצִי מַטֵּה מְנַשֶּׁה
  choice: మనష్షే అర్ధగోత్రపు
  rationale: మనష్షే గోత్రపు భూభాగ సంబంధిత అర్ధవిభాగాన్ని సంక్షిప్తంగా, సంప్రదాయ బైబిలు పరిభాషకు అనుగుణంగా సూచిస్తుంది.
- source_word: אֶת גּוֹלָן בַּבָּשָׁן
  choice: బాషానులోని గోలాను
  rationale: గోలాను పట్టణంగానూ బాషానును ప్రాంతంగానూ స్పష్టంగా చూపే సహజ తెలుగు నిర్మాణం.
- source_word: מִגְרָשֶׁיהָ
  choice: దాని పచ్చికబయళ్లతోపాటు
  rationale: లేవీయ పట్టణాల చుట్టూ పశువులను మేపడానికి, ఇతర సామూహిక అవసరాలకు ఉపయోగించిన బహిరంగ భూమిని సందర్భానుసారంగా తెలియజేస్తుంది; విస్తృత అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: עַשְׁתָּרוֹת
  choice: అష్టారోతు
  rationale: హీబ్రూ స్థలనామ ధ్వనిరూపాన్ని తెలుగు లిపిలో గుర్తించదగిన విధంగా ప్రతిలిపి చేస్తుంది.
- source_word: וְאֶת ... וְאֶת
  choice: '...తోపాటు ...ను ...తోపాటు'
  rationale: పట్టణాలు వాటికి చెందిన భూములతో సహా కేటాయించబడ్డాయనే సమన్వయాన్ని సహజ తెలుగులో చూపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల జాబితా శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలో క్రియ లేకపోయినా, కేటాయింపుల సందర్భాన్ని సహజ తెలుగులో పూర్తి చేయడానికి ‘ఇచ్చారు’ చేర్చాం. పాదసూచిక గుర్తు సంబంధిత పదబంధం వెంట ఉంచాం.
