  text: ఎలీయాబు అతని కుమారుడు; యెరోహాము అతని కుమారుడు; ఎల్కానా అతని కుమారుడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלִיאָב
  choice: ఎలీయాబు
  rationale: వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణను అనుసరించి తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: בְּנוֹ
  choice: కుమారుడు
  rationale: మూడవ పురుష ఏకవచన పుంలింగ ప్రత్యయంతో ఉన్న בֵּן పదానికి అక్షరార్థం ‘అతని కుమారుడు.’ తెలుగులో వంశావళి సంబంధాన్ని సహజంగా, స్పష్టంగా చూపడానికి ముందున్న వ్యక్తి పేరుతో ‘కుమారుడు’ అనే నిర్మాణం వాడబడింది.
- source_word: יְרֹחָם
  choice: యెరోహాము
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపాన్ని ఆధారంగా చేసుకొని తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: בְּנוֹ
  choice: కుమారుడు
  rationale: పునరావృతమైన వంశావళి సూత్రాన్ని నిలుపుతూ, వరుస సంతాన సంబంధాన్ని స్పష్టంగా తెలిపే తెలుగు రూపం.
- source_word: אֶלְקָנָה
  choice: ఎల్కానా
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపాన్ని ఆధారంగా చేసుకొని తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: בְנוֹ
  choice: కుమారుడు
  rationale: చివరి వంశావళి సంబంధాన్ని కూడా అదే విధంగా అనువదించి మూలంలోని వరుస నిర్మాణాన్ని నిలుపుకుంది.
