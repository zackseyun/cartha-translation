  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన వంశావళి శైలి. హీబ్రూలోని ‘అతని కుమారుడు’ అనే పునరావృత నిర్మాణాన్ని తెలుగులో అస్పష్టత లేకుండా వరుసగా ‘X కుమారుడు Y’ రూపంలో అందించాం.
