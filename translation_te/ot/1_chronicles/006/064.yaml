  text: and Kedemoth with its pasturelands[a], and Mephaath with its pasturelands.
translation:
  language: te
  text: కెదేమోతును దాని పచ్చిక భూములతోపాటు[a], మేఫాతును దాని పచ్చిక భూములతోపాటు ఇచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దాని సామూహిక భూములతోపాటు’; హీబ్రూ పదం పట్టణానికి చెందిన చుట్టుపక్కల బహిరంగ భూమిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֵמוֹת
  choice: కెదేమోతు
  rationale: ఇది స్థల నామం కాబట్టి అనువదించకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో రాయబడింది.
- source_word: מִגְרָשֶׁיהָ
  choice: దాని పచ్చిక భూములతోపాటు
  rationale: మִגְרָשׁ అనేది పట్టణానికి చెందిన చుట్టుపక్కల బహిరంగ భూమిని, ముఖ్యంగా పశువులను మేపే భూమిని సూచిస్తుంది. స్త్రీలింగ ఏకవచన ప్రత్యయం ఆయా పట్టణాన్ని సూచించేలా ‘దాని’గా అనువదించబడింది.
- source_word: מֵיפַעַת
  choice: మేఫాతు
  rationale: ఇది స్థల నామం కాబట్టి అనువదించకుండా, హీబ్రూ రూపానికి దగ్గరగా తెలుగు లిపిలో రాయబడింది.
- source_word: וְאֶת ... וְאֶת
  choice: '...ను ...తోపాటు'
  rationale: పునరుక్త సంధి మరియు ప్రత్యక్ష కర్మ సూచకాలు కేటాయించబడిన పట్టణాలు, వాటి భూముల జాబితాను నిర్మిస్తున్నాయి. ముందటి వచనాల నుంచి కొనసాగుతున్న క్రియను తెలుగులో స్పష్టత కోసం ‘ఇచ్చారు’గా పూరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన జాబితా శైలి వాడబడింది. మూలపాఠంలో క్రియ లేకపోయినా, సందర్భం నుంచి వచ్చే ‘ఇచ్చారు’ను తెలుగు వాక్య సంపూర్ణత కోసం చేర్చాం. అడుగుసూచి గుర్తు సంబంధిత మొదటి పదబంధం వెంట ఉంచబడింది.
