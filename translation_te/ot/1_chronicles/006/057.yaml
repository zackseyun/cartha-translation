  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలిని నిలుపుకుంటూనే పూర్తి వాక్యంగా సహజంగా చదవడానికి ‘ఇచ్చారు’ అనే క్రియను సందర్భం నుంచి పూరించాం. భాష గంభీరంగా, సాధారణ పాఠకులకు స్పష్టంగా ఉంచబడింది.
