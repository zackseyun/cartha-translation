base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/057.yaml
  text: 'And from the tribe of Issachar: Kedesh with its pasturelands[a], and Daberath with its pasturelands.'
translation:
  language: te
  text: 'ఇశ్శాఖారు గోత్రం నుండి: కేదెషు దాని పచ్చికబయళ్లతో, దాబెరతు[a] దాని పచ్చికబయళ్లతో.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: దాబెరతు అనే పేరును కొన్ని అనువాదాలు, అలాగే సమాంతర నగరాల జాబితా (యెహోషువ 21:28)లో, దాబెరెతు అని కూడా రాస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: గోత్రం నుండి
  rationale: గోత్రాలవారీగా పట్టణాలను కేటాయిస్తున్న ఈ సందర్భంలో מַטֶּה అంటే ‘గోత్రం’. ముందు ఉన్న וְ జాబితా కొనసాగింపును సూచిస్తుంది; తెలుగులో సందర్భానుసారంగా సహజ వాక్యప్రవాహంలో వ్యక్తమైంది.
- source_word: יִשָׂשכָר
  choice: ఇశ్శాఖారు
  rationale: హీబ్రూ గోత్రనామానికి సమీపంగా ఉండే, తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: קֶדֶשׁ
  choice: కేదెషు
  rationale: స్థలనామాన్ని అనువదించకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: מִגְרָשֶׁיהָ
  choice: దాని పచ్చికబయళ్లు
  rationale: లేవీయుల పట్టణాల చుట్టూ పశువుల మేతకు, సామూహిక వినియోగానికి ఉంచిన బహిరంగ భూములను సూచించే מִגְרָשׁ భావాన్ని ఆధునిక పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: דָּבְרַת
  choice: దాబెరతు
  rationale: హీబ్రూ స్థలనామాన్ని దాని వ్యంజన, అచ్చుల రూపానికి సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
theological_decisions: []
