translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. మూల హీబ్రూ వాక్యంలో స్పష్టమైన క్రియ లేకపోవడంతో ‘ఇచ్చారు’ వంటి క్రియను చేర్చకుండా, కేటాయింపు జాబితా స్వరూపాన్ని నిలిపాం.
