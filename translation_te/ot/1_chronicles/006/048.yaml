base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/048.yaml
  text: To the sons of Merari, according to their clans, from the tribe of Reuben, from the tribe of Gad, and from the tribe of Zebulun, twelve cities by lot.
translation:
  language: te
  text: మెరారీ కుమారులకు, వారి వంశాల ప్రకారం, రూబేను గోత్రం నుండి, గాదు గోత్రం నుండి, జెబూలూను గోత్రం నుండి చీటి ద్వారా పన్నెండు పట్టణాలు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי
  choice: కుమారులకు
  rationale: లְ ఉపసర్గం కేటాయింపును పొందినవారిని సూచిస్తుంది; ‘కుమారులు’ అనే పదం లేవీయ వంశపరంపరతో ఉన్న మూలపాఠ సంబంధాన్ని నిలుపుతుంది.
- source_word: מְרָרִי
  choice: మెరారి
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: గోత్ర కేటాయింపు సందర్భంలో מִשְׁפָּחָה గోత్రంలోని వంశ విభాగాలను సూచిస్తుంది; ‘వంశాలు’ ఈ స్థాయిని సహజంగా తెలియజేస్తుంది.
- source_word: מִמַּטֵּה
  choice: గోత్రం నుండి
  rationale: జనగణన, భూభాగ కేటాయింపు సందర్భాల్లో מַטֶּה అంటే ‘గోత్రం’; పదబంధ పునరావృతాన్ని మూలపాఠం ప్రకారమే నిలిపాం.
- source_word: רְאוּבֵן
  choice: రూబేను
  rationale: గోత్రనామాన్ని తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: גָד
  choice: గాదు
  rationale: గోత్రనామాన్ని తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: זְבוּלֻן
  choice: జెబూలూను
  rationale: గోత్రనామాన్ని మూలభాష ధ్వనులకు దగ్గరగా, తెలుగులో చదవడానికి సహజంగా లిప్యంతరీకరించాం.
- source_word: בַּגּוֹרָל
  choice: చీటి ద్వారా
  rationale: కేటాయింపు జరిగిన సాధనాన్ని ఈ పదబంధం సూచిస్తుంది; మూలంలో లేని ‘వేశారు’ అనే క్రియను చేర్చకుండా అర్థాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: עָרִים
  choice: పట్టణాలు
  rationale: עִיר జనావాస కేంద్రాలను సూచిస్తుంది; ఈ కేటాయింపు జాబితా సందర్భంలో ‘పట్టణాలు’ సహజమైన, సముచితమైన తెలుగు పదం.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: పన్నెండు
  rationale: హీబ్రూ సంయుక్త సంఖ్యకు ప్రామాణిక తెలుగు రూపం.
