id: 1CH.6.33
reference: 1 Chronicles 6:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲחֵי/הֶ֖ם הַ/לְוִיִּ֑ם נְתוּנִ֕ים לְ/כָ֨ל עֲבוֹדַ֔ת מִשְׁכַּ֖ן בֵּ֥ית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/033.yaml
  text: And their brothers the Levites were appointed for all the service of the tabernacle of the house of God[a].
translation:
  language: te
  text: వారి సహోదరులైన లేవీయులు దేవుని మందిరపు నివాసగుడారపు సమస్త సేవకు నియమించబడ్డారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అప్పగించబడ్డారు”; హీబ్రూ కృదంతానికి అక్షరార్థం “ఇవ్వబడినవారు.” ఇక్కడ అది సేవా బాధ్యతకు నియమించబడడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: వారి సహోదరులైన
  rationale: వావ్‌ను తెలుగు వాక్యప్రవాహంలో ప్రత్యేకంగా ‘మరియు’ అని చూపనవసరం లేదు. ‘సహోదరులు’ మూలంలోని బంధుత్వ పదాన్ని నిలుపుతూ, ఇక్కడ తోటి వంశస్థులనూ సూచించగలదు.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి గోత్రానికి చెందినవారిని సూచించే ప్రామాణిక తెలుగు రూపం.
- source_word: נְתוּנִים
  choice: నియమించబడ్డారు
  rationale: ఈ నిష్క్రియాత్మక కృదంతానికి అక్షరార్థం ‘ఇవ్వబడినవారు’; ఆరాధనా సేవకు అప్పగించబడిన భావాన్ని సహజ తెలుగులో ‘నియమించబడ్డారు’ తెలియజేస్తుంది.
- source_word: לְכָל עֲבוֹדַת
  choice: సేవ అంతటికోసం
  rationale: לְ ఇక్కడ నియామక ఉద్దేశాన్ని, כָל సేవ యొక్క సంపూర్ణ పరిధిని సూచిస్తుంది. עֲבוֹדָה ఆరాధనా సందర్భంలో ‘సేవ’గా సహజంగా వ్యక్తమవుతుంది.
- source_word: מִשְׁכַּן
  choice: నివాసగుడారం
  rationale: మూలపదంలోని ‘నివాసస్థలం’ భావాన్నీ, ఇశ్రాయేలీయుల పవిత్ర గుడారాన్ని కూడా తెలియజేసే స్పష్టమైన ఆధునిక తెలుగు పదబంధం.
- source_word: בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరపు
  rationale: అక్షరార్థంగా ‘దేవుని ఇల్లు’. పవిత్ర ఆరాధనా స్థలాన్ని సూచించే ‘మందిరం’ తెలుగులో సహజంగా ఉండి, ‘నివాసగుడారం’ అనే వేరైన పదాన్ని కలిపివేయదు.
theological_decisions:
- issue: దినవృత్తాంతాల సందర్భంలో ‘నివాసగుడారం’ మరియు ‘దేవుని మందిరం’ మధ్య సంబంధం
  choice: రెండు మూలపదాలనూ వేరుగా నిలుపుతూ ‘దేవుని మందిరపు నివాసగుడారం’ అని అనువదించాం.
  alternative: ‘దేవుని మందిర సేవ’ లేదా ‘దేవుని గుడార మందిర సేవ’
  rationale: హీబ్రూలో מִשְׁכַּן, בֵּית הָאֱלֹהִים రెండూ ఉన్నాయి. వాటిని ఒకే ‘దేవాలయం’ అనే పదంగా కుదించకుండా ఉంచడం మూలంలోని భావ ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పరిచర్య’ వంటి తరువాతి సంఘపరమైన పదానికి బదులు ‘సేవ’ వాడబడింది. మూలంలోని ‘నివాసగుడారం’ మరియు ‘దేవుని మందిరం’ రెండూ నిలుపబడ్డాయి.
