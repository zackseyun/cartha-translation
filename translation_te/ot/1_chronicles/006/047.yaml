translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన గ్రంథశైలిని అనుసరించాం. గోత్రాల కేటాయింపు జాబితా తెలుగులో అసంపూర్ణంగా అనిపించకుండా సందర్భానుసారంగా ‘ఇవ్వబడ్డాయి’ అనే క్రియను సరఫరా చేశాం. వ్యక్తి, స్థలనామాలకు విస్తృతంగా అర్థమయ్యే తెలుగు బైబిలు లిప్యంతరణలను ఉపయోగించాం.
