base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/047.yaml
  text: 'And to the sons of Gershom[a], according to their clans, from the tribe of Issachar, and from the tribe of Asher, and from the tribe of Naphtali[b], and from the tribe of Manasseh in Bashan: thirteen cities.'
translation:
  language: te
  text: మరియు గేర్షోము కుమారులకు[a], వారి వంశాల ప్రకారం, ఇశ్శాఖారు గోత్రం నుండి, ఆషేరు గోత్రం నుండి, నఫ్తాలి గోత్రం నుండి, బాషానులోని మనష్షే గోత్రం నుండి పదమూడు పట్టణాలు ఇవ్వబడ్డాయి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ హీబ్రూ పాఠంలో ఈ వంశనామం ‘గేర్షోము’ అని ఉంది; కొన్ని అనువాదాల్లో ‘గేర్షోను’ అని ఉంటుంది.
    reason: alternative_reading
  - marker: b
    text: కొన్ని అనువాదాలు భౌగోళిక సూచనను స్పష్టం చేయడానికి ‘బాషానులోని మనష్షే అర్ధగోత్రం’ అని విస్తరించాయి. అయితే ఈ వచనంలోని హీబ్రూ పాఠ్యంలో ‘అర్ధగోత్రం’ అనే మాట లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי גֵרְשׁוֹם
  choice: గేర్షోము కుమారులకు
  rationale: హీబ్రూ నిర్మాణంలోని ‘కుమారులకు’ అనే వంశసంబంధ వ్యక్తీకరణను నిలుపుతూ, జాబితాలో తదుపరి కేటాయింపును సహజమైన తెలుగులో పరిచయం చేస్తుంది.
- source_word: גֵרְשׁוֹם
  choice: గేర్షోము
  rationale: ఈ వచనంలోని హీబ్రూ రూపం గేర్షోమ్‌ను ప్రతిబింబిస్తుంది; సంప్రదాయంగా కనిపించే ‘గేర్షోను’ రూపాన్ని పాఠ్యంలోకి తీసుకురాలేదు.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: వారి వంశాల ప్రకారం
  rationale: గోత్రంలోని ఉపవిభాగాలను సూచించే מִשְׁפָּחָהకు ఈ పరిపాలనా-వంశావళి సందర్భంలో ‘వంశాలు’ సహజమైన, స్పష్టమైన సమానం.
- source_word: מִמַּטֵּה
  choice: గోత్రం నుండి
  rationale: భూభాగ, వంశావళి సందర్భంలో מַטֶּה అంటే ‘గోత్రం’; పునరావృతమయ్యే కేటాయింపు సూత్రాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: מְנַשֶּׁה בַּבָּשָׁן
  choice: బాషానులోని మనష్షే గోత్రం నుండి
  rationale: హీబ్రూలో ఉన్నట్లే బాషానులోని మనష్షేను సూచిస్తుంది; మూలంలో లేని ‘అర్ధగోత్రం’ అనే విస్తరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: పదమూడు పట్టణాలు
  rationale: సంఖ్యా పదబంధానికి నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה (elliptical allocation formula)
  choice: పదమూడు పట్టణాలు ఇవ్వబడ్డాయి
  rationale: హీబ్రూ నామవాచక జాబితాలో కేటాయింపు క్రియ అధ్యాహారంగా ఉంది; ముందున్న సందర్భం తెలిపే భావాన్ని తెలుగులో సంపూర్ణ వాక్యంగా సహజంగా వ్యక్తం చేయడానికి ‘ఇవ్వబడ్డాయి’ చేర్చబడింది.
