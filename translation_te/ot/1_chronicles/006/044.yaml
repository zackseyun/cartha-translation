translation:
  language: te
  text: ఆశానును, దాని పచ్చిక బయళ్లను[a], మరియు బేత్-షెమెష్‌ను, దాని పచ్చిక బయళ్లను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని సమాంతర పాఠసాక్ష్యాలు, అనువాదాలు ఇక్కడ ‘ఆశాను’కు బదులుగా ‘అయిను’ అని పేర్కొంటాయి; దినవృత్తాంతాల మసొరెటిక్ పాఠంలో మాత్రం ‘ఆశాను’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: עָשָׁן
  choice: ఆషాను
  rationale: ఇది స్థలనామం కాబట్టి అనువదించకుండా హీబ్రూ రూపానికి అనుగుణంగా లిప్యంతరీకరించబడింది. దానికి జతైన אֶת విభక్తి భావాన్ని తెలుగులో ‘ను’ ద్వారా తెలిపాం.
- source_word: מִגְרָשֶׁיהָ
  choice: దాని పచ్చిక బయళ్లను
  rationale: లేవీయ పట్టణాల సందర్భంలో מִגְרָשׁ అనేది పట్టణానికి చెందిన బహిరంగ మేత భూములను సూచిస్తుంది; స్త్రీలింగ ఏకవచన ప్రత్యయం తెలుగులో సహజంగా ‘దాని’గా ఇవ్వబడింది.
- source_word: בֵּית שֶׁמֶשׁ
  choice: బేత్-షెమెషును
  rationale: ఇది స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా లిప్యంతరీకరించబడింది; సమాస స్థలనామాన్ని స్పష్టంగా చూపేందుకు హైఫన్ ఉంచబడింది.
- source_word: וְאֶת
  choice: …ను
  rationale: హీబ్రూలోని సంధాయకం, ప్రత్యక్ష కర్మ సూచిక జాబితాను నిర్మిస్తాయి. తెలుగులో ఈ వాక్యఖండానికి ముందున్న సందర్భంతో అనుసంధానం ఉండటంతో, ప్రతి అంశానికి కర్మవిభక్తి ‘ను’ ఇచ్చి, జాబితా మధ్య సహజమైన కామాలను వాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి/పట్టణాల జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలి వాడబడింది. మూలంలోని జాబితా నిర్మాణం నిలుపుతూ తెలుగులో సహజంగా చదివేలా కర్మవిభక్తులు చేర్చబడ్డాయి.
