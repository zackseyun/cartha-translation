translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి సంక్షిప్త నిర్మాణాన్ని మరియు హెబ్రీ పాఠంలోని పునరుక్తిని నిలుపుతూ గౌరవప్రదంగా అనువదించాం. ప్రతి בְּנוֹను ‘అతని కుమారుడు’గా ఒకే విధంగా ఇచ్చాం.
