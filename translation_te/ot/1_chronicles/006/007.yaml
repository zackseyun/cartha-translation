  yaml_path: translation/ot/1_chronicles/006/007.yaml
  text: 'The sons of Kohath: Amminadab his son[a], Korah his son, Assir his son.'
translation:
  language: te
  text: 'కెహాతు కుమారులు: అమ్మీనాదాబు అతని కుమారుడు[a], కోరహు అతని కుమారుడు, అస్సీరు అతని కుమారుడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని సమాంతర వంశావళులలో దీనికి సరిపోలే పూర్వికుని పేరు ఇజ్హారు అని ఉంది; అయితే ఇక్కడి హెబ్రీ పాఠంలో అమ్మీనాదాబు అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: బֵּן పదానికి నిర్మిత బహువచనం; వంశావళిని పరిచయం చేసే హెబ్రీ సూత్రాన్ని నేరుగా నిలుపుతుంది.
- source_word: קְהָת
  choice: కహాతు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: עַמִּינָדָב
  choice: అమ్మీనాదాబు
  rationale: హెబ్రీ పాఠంలో ఉన్న వ్యక్తి పేరునే లిప్యంతరీకరించాం; సమాంతర వంశావళుల ఆధారంగా ఇస్హారుగా మార్చలేదు.
- source_word: בְּנוֹ
  choice: అతని కుమారుడు
  rationale: ఏకవచన నిర్మిత రూపానికి మూడవ పురుష ఏకవచన పుంలింగ ప్రత్యయం జతై ఉన్నందున, వంశక్రమంలోని తండ్రి-కొడుకు సంబంధాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: קֹרַח
  choice: కోరహు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אַסִּיר
  choice: అస్సీరు
  rationale: ఇక్కడ ఇది వ్యక్తి పేరు; దాని సాధ్యమైన పదార్థాన్ని అనువదించకుండా లిప్యంతరీకరించాం.
