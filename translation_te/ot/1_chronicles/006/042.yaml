source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י אַהֲרֹ֗ן נָתְנוּ֙ אֶת עָרֵ֣י הַ/מִּקְלָ֔ט אֶת חֶבְר֥וֹן וְ/אֶת לִבְנָ֖ה וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת יַתִּ֥ר וְ/אֶֽת אֶשְׁתְּמֹ֖עַ וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/042.yaml
  text: 'And to the sons of Aaron they gave the cities of refuge: Hebron[a], and Libnah with its pasturelands, and Jattir, and Eshtemoa with its pasturelands.'
translation:
  language: te
  text: 'వారు అహరోను కుమారులకు ఆశ్రయ పట్టణాలను ఇచ్చారు: హెబ్రోను, దాని చుట్టుపక్కల బహిరంగ భూములతో[a] కూడిన లిబ్నా, యత్తీరు, దాని చుట్టుపక్కల బహిరంగ భూములతో కూడిన ఎష్తెమోవా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చుట్టుపక్కల బహిరంగ భూములు’కు బదులుగా ‘పచ్చికబయళ్లు’ లేదా ‘ఉమ్మడి భూములు’ అని కూడా అనువదించవచ్చు; హీబ్రూ పదం పట్టణానికి చెందిన తెరచిన పరిసర భూమిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי אַהֲרֹן
  choice: అహరోను కుమారులకు
  rationale: לְ గ్రహీతను సూచిస్తుంది; בְּנֵי అనే పదానికి నేరుగా, సహజంగా ‘కుమారులకు’ అని అనువదించాం.
- source_word: נָתְנוּ
  choice: వారు ... ఇచ్చారు
  rationale: נתן అనే సాధారణ క్రియార్థమైన ‘ఇచ్చారు’ను నిలిపి, కర్త మూలపాఠంలో స్పష్టంగా పేర్కొనబడలేదని ప్రతిబింబించాం.
- source_word: עָרֵי הַמִּקְלָט
  choice: ఆశ్రయ పట్టణాలను
  rationale: హత్యకు సంబంధించిన న్యాయవిచారణ వరకు రక్షణ పొందేందుకు నియమించబడిన పట్టణాలను సూచించే స్థిరమైన ధర్మశాస్త్ర పదబంధం.
- source_word: חֶבְרוֹן ... לִבְנָה ... יַתִּר ... אֶשְׁתְּמֹעַ
  choice: హెబ్రోను ... లిబ్నా ... యత్తీరు ... ఎష్తెమోవా
  rationale: హీబ్రూ స్థలనామాలకు దగ్గరగా ఉండే, తెలుగులో చదవడానికి సహజమైన లిప్యంతరీకరణలు.
- source_word: מִגְרָשֶׁיהָ
  choice: దాని పచ్చికబయళ్లతో
  rationale: పట్టణానికి చెందిన చుట్టుపక్కల బహిరంగ భూమిని సూచించే מִגְרָשׁ పదాన్ని సందర్భానుకూలంగా ‘పచ్చికబయళ్లు’గా అనువదించాం; ఏకవచన స్త్రీలింగ ప్రత్యయం ముందున్న పట్టణాన్ని సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. హెబ్రోనుకు పచ్చికబయళ్లు ఉన్నాయని మూలపాఠం ఈ వాక్యంలో చెప్పనందున, ఆ భావాన్ని చేర్చలేదు; పచ్చికబయళ్ల ప్రస్తావనను లిబ్నా, ఎష్తెమోవాలకు మాత్రమే అనుసంధానించాం.
