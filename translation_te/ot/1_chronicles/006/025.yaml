  source_fidelity: The genealogical repetition of בֶּן is accurately retained as కుమారుడు. However, the draft's transliteration బయశేయా does not adequately represent the distinct ע (ayin) in בַּעֲשֵׂיָה; it reads more naturally as a 'Bay-' name rather than the source's Baʿaseiah. A revised Telugu form marks the intervening vowel/ayin more transparently.
