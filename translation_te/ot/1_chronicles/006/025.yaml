  text: మీకాయేలు కుమారుడు, బాఅశేయా[a] కుమారుడు, మల్కీయా కుమారుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని బైబిలు వంశావళుల్లోనూ అనువాద సంప్రదాయాల్లోనూ దీనికి దగ్గరగా ఉన్న పేరు “మయశేయా” అని కనిపిస్తుంది; అయితే ఇక్కడి హెబ్రీ పాఠంలో “బాఅశేయా” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశావళిలో ఈ పదం తండ్రి–కొడుకు సంబంధాన్ని నేరుగా సూచిస్తుంది. హెబ్రీ వాక్య నిర్మాణంలోని సంక్షిప్తతను, పునరావృత లయను ఇది నిలుపుతుంది.
- source_word: מִיכָאֵל
  choice: మీకాయేలు
  rationale: హెబ్రీ వ్యక్తిపేరుకు ఆధునిక ప్రామాణిక తెలుగులో సుపరిచితమైన లిప్యంతరీకరణ.
- source_word: בַּעֲשֵׂיָה
  choice: బయశేయా
  rationale: అందించిన మసొరెటిక్ పాఠంలోని మొదటి వ్యంజనం ב (బేత్)ను అనుసరించి పేరును లిప్యంతరీకరించాం; దానిని ‘మయశేయా’గా మార్చలేదు.
- source_word: מַלְכִּיָּה
  choice: మల్కీయా
  rationale: హెబ్రీ పేరులోని వ్యంజనాలను, అచ్చులను సహజమైన తెలుగు రూపంలో దగ్గరగా ప్రతిబింబించే లిప్యంతరీకరణ.
theological_decisions: []
translation_notes:
  register: సంక్షిప్తమైన హెబ్రీ వంశావళి శైలిని నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా చదివేలా పేర్లను లిప్యంతరీకరించాం. ఆంగ్లంలో కనిపించే Malkijah/Malchijah అక్షరరూప భేదానికి తెలుగులో ప్రత్యేక పాదసూచిక అవసరం లేదు; రెండూ ఇక్కడ ‘మల్కీయా’ అనే ఒకే హెబ్రీ పేరునే సూచిస్తాయి.
