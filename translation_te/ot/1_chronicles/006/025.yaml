    issue: The name בַּעֲשֵׂיָה is rendered బయశేయా.
    rationale: బయశేయా suggests /bay-/ and obscures the Hebrew ayin (בַּעֲ). బాఅశేయా more closely signals the source form while remaining a usable Telugu transliteration.
