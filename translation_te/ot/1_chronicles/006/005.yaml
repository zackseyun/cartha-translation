  yaml_path: translation/ot/1_chronicles/006/005.yaml
  text: 'To Gershom: Libni his son, Jahath his son, Zimmah his son.'
translation:
  language: te
  text: 'గెర్షోము వంశం: లిబ్నీ అతని కుమారుడు, యహతు అతని కుమారుడు, జిమ్మా అతని కుమారుడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְגֵרְשׁוֹם
  choice: 'గేర్షోము వంశం:'
  rationale: లְ ఉపసర్గ ఇక్కడ గేర్షోముతో మొదలయ్యే వంశావళి వరుసను పరిచయం చేస్తుంది. తెలుగులో ‘వంశం:’ అని ఇవ్వడం ఆ శీర్షికార్థాన్ని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: לִבְנִי
  choice: లిబ్నీ
  rationale: ఇది వ్యక్తి పేరు; అనువదించకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: בְנוֹ
  choice: అతని కుమారుడు
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయంతో కూడిన בֵּן నేరుగా తండ్రి–కుమారుని సంబంధాన్ని సూచిస్తుంది; ప్రతి తరంలోని సంబంధం స్పష్టంగా ఉండేందుకు ఇదే పదబంధం పునరావృతమైంది.
- source_word: יַחַת
  choice: యహతు
  rationale: ఇది వ్యక్తి పేరు; హీబ్రూ రూపానికి సమీపంగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: זִמָּה
  choice: జిమ్మా
  rationale: ఇక్కడ ఇది వ్యక్తి పేరు; ఇతర సందర్భాల్లో మూలపదానికి సాధారణ నామవాచక అర్థం ఉన్నప్పటికీ, ఇక్కడ దానిని అనువదించకుండా లిప్యంతరీకరించడం సముచితం.
