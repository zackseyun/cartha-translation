  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలిని నిలిపి, సాధారణ పాఠకులకు సంబంధాల వరుస స్పష్టంగా ఉండేలా రూపొందించబడింది. పేర్లు హీబ్రూ రూపాలకు సమీపంగా లిప్యంతరీకరించబడ్డాయి.
