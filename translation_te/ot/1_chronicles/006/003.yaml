  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֖י קְהָ֑ת עַמְרָ֣ם וְ/יִצְהָ֔ר וְ/חֶבְר֖וֹן וְ/עֻזִּיאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/003.yaml
  text: 'And the sons of Kohath: Amram, Izhar, Hebron, and Uzziel.'
translation:
  language: te
  text: 'కెహాతు కుమారులు: అమ్రాము, ఇశ్హారు, హెబ్రోను, ఉజ్జీయేలు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: בְנֵי అనే నిర్మిత బహువచనానికి వంశావళి జాబితాలో సహజమైన అర్థం ‘కుమారులు’. ముందున్న וּ ఈ జాబితా కొనసాగింపును సూచించినా, తెలుగులో వచనారంభంలో ‘మరియు’ చేర్చడం కంటే జాబితా శీర్షికలా చెప్పడం సహజం.
- source_word: קְהָת
  choice: కహాతు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: עַמְרָם
  choice: అమ్రాము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సులభంగా పలికే సంప్రదాయ రూపంలో లిప్యంతరీకరించాం.
- source_word: וְיִצְהָר
  choice: ఇస్హారు
  rationale: יִצְהָר వ్యక్తినామాన్ని మూల ఉచ్చారణకు సమీపంగా, తెలుగులో చదవదగిన రూపంలో ఇచ్చాం; ఉపసర్గ וְ జాబితా నిర్మాణంలో వ్యక్తమవుతుంది.
- source_word: וְחֶבְרוֹן
  choice: హెబ్రోను
  rationale: ఇక్కడ חֶבְרוֹן స్థలనామం కాదు, వ్యక్తినామం. అందువల్ల దానిని వ్యక్తిపేరుగా లిప్యంతరీకరించాం.
- source_word: וְעֻזִּיאֵל
  choice: ఉజ్జీయేలు
  rationale: עֻזִּיאֵל వ్యక్తినామాన్ని మూలంలోని ద్విత్వ వ్యంజనాన్ని ప్రతిబింబించేలా తెలుగు రూపంలో ఇచ్చాం; చివరి సంధికారక וְ తెలుగు జాబితా విరామచిహ్నాల ద్వారా సహజంగా వ్యక్తమవుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త వంశావళి శైలిని పాటించాం. మూలంలోని నామవాచక వాక్య నిర్మాణాన్ని పెద్దగా విస్తరించకుండా, గౌరవప్రదమైన మరియు సాధారణ పాఠకులకు స్పష్టమైన రూపం ఉపయోగించాం.
