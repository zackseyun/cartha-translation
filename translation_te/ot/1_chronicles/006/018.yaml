- from: 'తమ కుమారులతో కలిసి నిలిచినవారు[a] వీరే: కహాతీయుల వంశస్థులలో గాయకుడైన హేమాను; అతడు యోవేలు కుమారుడు, యోవేలు సమూయేలు కుమారుడు.'
  to: 'నిలిచినవారూ[a] వారి కుమారులూ వీరే: కహాతీయులలో గాయకుడైన హేమాను, యోవేలు కుమారుడు, సమూయేలు కుమారుడు.'
  rationale: The revision restores the explicit Hebrew coordination, “and their sons,” rather than interpreting it as accompaniment. It also retains the literal-but-possibly-service-related sense of “stood” with an appropriately qualified footnote, and presents the clan identification and genealogy in idiomatic Telugu without adding interpretation.
