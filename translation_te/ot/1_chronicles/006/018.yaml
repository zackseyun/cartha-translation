id: 1CH.6.18
reference: 1 Chronicles 6:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֥לֶּה הָ/עֹמְדִ֖ים וּ/בְנֵי/הֶ֑ם מִ/בְּנֵי֙ הַ/קְּהָתִ֔י הֵימָן֙ הַ/מְשׁוֹרֵ֔ר בֶּן יוֹאֵ֖ל בֶּן שְׁמוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/018.yaml
  text: 'And these are the ones who stood[a], and their sons: from the sons of the Kohathites: Heman the singer, son of Joel[b], son of Samuel.'
translation:
  language: te
  text: 'నిలిచినవారూ[a] వారి కుమారులూ వీరే: కహాతీయులలో గాయకుడైన హేమాను, యోవేలు కుమారుడు, సమూయేలు కుమారుడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సేవచేసినవారు.” హెబ్రీ పదానికి అక్షరార్థంగా “నిలిచినవారు” అని అర్థం; ఈ సందర్భంలో అది నియమిత సేవను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: వీరే
  rationale: జాబితాను పరిచయం చేసే సూచనార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; వాక్య నిర్మాణంలో సంధి భావం కొనసాగుతుంది.
- source_word: הָעֹמְדִים
  choice: నిలిచినవారు
  rationale: עמד అనే క్రియలోని ‘నిలుచుట’ అనే స్పష్టమైన రూపకాన్ని కాపాడుతుంది. సందర్భంలో ఇది నియమిత సేవను సూచించవచ్చు గాని, ప్రధాన పాఠంలో ‘సేవచేసినవారు’ అని అర్థాన్ని పూర్తిగా నిర్ధారించలేదు.
- source_word: וּבְנֵיהֶם
  choice: తమ కుమారులతో కలిసి
  rationale: అక్షరార్థంగా ‘మరియు వారి కుమారులు.’ ఇక్కడ జాబితాలో ఉన్నవారు తమ కుమారులతో కూడి ఉన్నారనే సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: מִבְּנֵי הַקְּהָתִי
  choice: కహాతీయుల వంశస్థులలో
  rationale: కహాతు వంశానికి చెందినవారిని సూచించే హెబ్రీ వంశపదబంధాన్ని స్పష్టమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: הֵימָן הַמְשׁוֹרֵר
  choice: గాయకుడైన హేమాను
  rationale: הַמְשׁוֹרֵר పాడే వ్యక్తిని నేరుగా సూచిస్తుంది; ‘సంగీతకారుడు’ కంటే ‘గాయకుడు’ మూలపదానికి సమీపంగా ఉంటుంది.
- source_word: בֶּן יוֹאֵל בֶּן שְׁמוּאֵל
  choice: అతడు యోవేలు కుమారుడు, యోవేలు సమూయేలు కుమారుడు
  rationale: తెలుగులో ప్రతి తండ్రీకొడుకుల సంబంధం సందిగ్ధత లేకుండా కనిపించేలా వంశావళి క్రమాన్ని విప్పి చెబుతుంది.
theological_decisions:
- issue: הָעֹמְדִים అనే పదం సేవలో నియామకాన్ని సూచిస్తుందా లేక నిలబడటాన్నే సూచిస్తుందా
  choice: నిలిచినవారు
  alternative: సేవచేసినవారు / సేవకు నియమించబడినవారు
  rationale: సందర్భం ఆలయ సంగీత సేవను సూచించినా, హెబ్రీ పదం స్వయంగా ‘నిలిచినవారు’ అనే రూపకాన్ని ఉంచుతుంది. అందువల్ల వ్యాఖ్యానాత్మక అర్థాన్ని ప్రధాన పాఠంలో నిర్బంధించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన వంశావళి శైలి పాటించబడింది. ‘హేమాను,’ ‘యోవేలు,’ ‘సమూయేలు,’ ‘కహాతీయులు’ అనే పేర్లకు సాధారణ తెలుగు బైబిలు రూపాలు వాడబడ్డాయి.
