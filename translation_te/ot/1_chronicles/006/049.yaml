translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూలోని ‘ఇశ్రాయేలు కుమారులు’ అనే లింగ-నిర్దిష్ట రూపం ప్రధాన పాఠ్యంలో నిలుపబడింది. ‘వాటి’ అనే సర్వనామం పచ్చిక బయళ్లు పట్టణాలకు చెందినవని తెలుగులో స్పష్టం చేస్తుంది.
