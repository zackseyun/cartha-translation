  text: וַ/יִּתְּנ֥וּ בְנֵי יִשְׂרָאֵ֖ל לַ/לְוִיִּ֑ם אֶת הֶ/עָרִ֖ים וְ/אֶת מִגְרְשֵׁי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/049.yaml
  text: And the sons of Israel gave to the Levites the cities and their pasturelands[a][b].
translation:
  language: te
  text: ఇశ్రాయేలు కుమారులు లేవీయులకు పట్టణాలను, వాటి పచ్చిక బయళ్లను[a] ఇచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వాటి సామూహిక భూములను,’ లేక ‘వాటి చుట్టుపక్కల భూములను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: ఇచ్చారు
  rationale: נתן అనే సాధారణ ‘ఇవ్వు’ క్రియకు కథన సందర్భంలో సహజమైన అనువాదం.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని ‘కుమారులు’ అనే పుంలింగ రూపాన్ని ప్రధాన పాఠ్యంలో యథార్థంగా నిలుపుతుంది; భావార్థంగా ‘ఇశ్రాయేలీయులు’ అని కూడా చెప్పవచ్చు.
- source_word: לַלְוִיִּם
  choice: లేవీయులకు
  rationale: లేవి గోత్రానికి చెందినవారిని సూచించే పదానికి ప్రామాణికమైన తెలుగు రూపం.
- source_word: הֶעָרִים
  choice: పట్టణాలను
  rationale: עָרִים పట్టణాలు లేదా నగరాలను సూచిస్తుంది; ఈ సందర్భంలో సహజమైన ఆధునిక తెలుగు పదం ‘పట్టణాలు’.
- source_word: מִגְרְשֵׁיהֶם
  choice: వాటి పచ్చిక బయళ్లను
  rationale: పట్టణాలకు అనుబంధంగా, వాటి చుట్టూ పశువులను మేపడానికి ఉపయోగించే బహిరంగ భూములను సూచించే సందర్భార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
