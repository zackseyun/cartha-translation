  text: וְ/לִ/בְנֵ֨י קְהָ֜ת הַ/נּוֹתָרִ֗ים מִ/מִּשְׁפַּ֣חַת הַ/מַּטֶּ֡ה מִֽ֠/מַּחֲצִית מַטֵּ֨ה חֲצִ֧י מְנַשֶּׁ֛ה בַּ/גּוֹרָ֖ל עָרִ֥ים עָֽשֶׂר׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/046.yaml
  text: And to the sons of Kohath[a] who remained, from the families of the tribe, from the half-tribe, the half of Manasseh, ten cities were given by lot.
translation:
  language: te
  text: మిగిలిన కహాతు కుమారులకు[a] గోత్రపు వంశాల నుండి, మనష్షే అర్ధగోత్రం నుండి, చీట్ల ద్వారా పది పట్టణాలు ఇవ్వబడ్డాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వాక్యనిర్మాణం అక్షరార్థంగా, ‘గోత్రపు వంశం నుండి, అర్ధగోత్రం నుండి, మనష్షే సగం నుండి’ అని పునరుక్తితో ఉంది; ఇది మనష్షే అర్ధగోత్రాన్ని సూచించే సూత్రప్రాయమైన ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי קְהָת הַנּוֹתָרִים
  choice: మిగిలిన కహాతు కుమారులకు
  rationale: లేవీయులలో ముందుగా వాటా పొందినవారు పోగా మిగిలిన కహాతీయులను సూచించే భాగవాచక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది. ‘కుమారులు’ అనే వంశావళి నుడికారాన్ని కూడా కాపాడుతుంది.
- source_word: מִמִּשְׁפַּחַת הַמַּטֶּה
  choice: గోత్రపు వంశాల నుండి
  rationale: מִשְׁפָּחָה ఇక్కడ కుటుంబం కంటే విస్తృతమైన వంశ లేదా వంశశాఖను, מַטֶּה గోత్రాన్ని సూచిస్తాయి. మూలంలోని కేటాయింపు సూత్ర భాషను ప్రతిబింబించేలా రెండింటినీ ఉంచాం.
- source_word: מִמַּחֲצִית מַטֵּה חֲצִי מְנַשֶּׁה
  choice: అర్ధగోత్రం నుండి, అంటే మనష్షేలోని సగం నుండి
  rationale: హీబ్రూ వాక్యంలోని పునరుక్తితో కూడిన ‘అర్ధం/సగం’ నిర్మాణాన్ని పూర్తిగా చదును చేయకుండా ఉంచుతూ, ‘అంటే’ ద్వారా తెలుగులో సంబంధాన్ని గ్రహించగలిగేలా చేశాం.
- source_word: בַּגּוֹרָל
  choice: చీట్ల ద్వారా
  rationale: పట్టణాల కేటాయింపు చీట్లు వేయడం ద్వారా నిర్ణయించబడిందనే భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: עָרִים עָשֶׂר
  choice: పది పట్టణాలు ఇవ్వబడ్డాయి
  rationale: హీబ్రూలో క్రియ ప్రత్యక్షంగా లేకపోయినా, కేటాయింపుల సందర్భం ఆధారంగా తెలుగులో అవసరమైన ‘ఇవ్వబడ్డాయి’ అనే క్రియను పూరించాం.
