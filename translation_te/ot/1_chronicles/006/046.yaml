  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి మరియు భూకేటాయింపు సందర్భానికి తగిన గంభీరమైన శైలిని ఉపయోగించాం. మూలంలోని అసాధారణ పునరుక్తిని తొలగించకుండా, ‘అంటే’తో స్వల్పంగా స్పష్టం చేశాం.
