  text: לִ/בְנֵ֣י מְרָרִי֮ הַ/נּוֹתָרִים֒ מִ/מַּטֵּ֣ה זְבוּלֻ֔ן אֶת רִמּוֹנ֖וֹ וְ/אֶת מִגְרָשֶׁ֑י/הָ אֶת תָּב֖וֹר וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/062.yaml
  text: 'To the sons of Merari who remained[a], from the tribe of Zebulun: Rimmono and its pasturelands, Tabor and its pasturelands.'
translation:
  language: te
  text: 'మిగిలిన మెరారీ కుమారులకు, జెబూలూను గోత్రం నుండి: రిమ్మోనో[a], దాని పచ్చికభూములు; తాబోరు, దాని పచ్చికభూములు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘రిమ్మోనో’ అని ఉంది; సమాంతర వాక్యమైన యెహోషువ 21:35లో ‘దిమ్నా’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי הַנּוֹתָרִים
  choice: మిగిలిన మెరారీ కుమారులకు
  rationale: లְ ఉపసర్గం ఈ పంపిణీ జాబితాలో కేటాయింపును సూచిస్తుంది; הַנּוֹתָרִים ముందటి కేటాయింపుల తరువాత మిగిలినవారిని సూచిస్తుంది.
- source_word: מִמַּטֵּה זְבוּלֻן
  choice: జెబూలూను గోత్రం నుండి
  rationale: గోత్రాల కేటాయింపు సందర్భంలో מַטֶּה అనే పదానికి ‘గోత్రం’ అనే భావమే తగినది.
- source_word: רִמּוֹנוֹ
  choice: రిమ్మోనో
  rationale: మసొరా పాఠంలోని స్థలనామాన్ని లిప్యంతరీకరించాం; సమాంతర పాఠంలోని భిన్న నామాన్ని పాదసూచికలో తెలిపాం.
- source_word: מִגְרָשֶׁיהָ
  choice: దాని పచ్చికభూములు
  rationale: లేవీయుల పట్టణాల సందర్భంలో מִגְרָשׁ పట్టణానికి చెందిన బహిరంగ మేతభూములను సూచిస్తుంది.
- source_word: תָּבוֹר
  choice: తాబోరు
  rationale: ఇక్కడ ఇది పట్టణపు పేరుగా ఉన్నందున స్థలనామంగా లిప్యంతరీకరించాం.
