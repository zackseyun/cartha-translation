translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన జాబితా శైలిని అనుసరించాం. మూలంలోని కేటాయింపు భావాన్ని ‘కుమారులకు’ ద్వారా, పాఠాంతరాన్ని ప్రధాన పాఠం మార్చకుండా పాదసూచికలో నిలిపాం.
