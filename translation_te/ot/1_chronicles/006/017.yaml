id: 1CH.6.17
reference: 1 Chronicles 6:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּהְי֨וּ מְשָׁרְתִ֜ים לִ/פְנֵ֨י מִשְׁכַּ֤ן אֹֽהֶל מוֹעֵד֙ בַּ/שִּׁ֔יר עַד בְּנ֧וֹת שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה בִּ/ירוּשָׁלִָ֑ם וַ/יַּעַמְד֥וּ כְ/מִשְׁפָּטָ֖/ם עַל עֲבוֹדָתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/017.yaml
  text: They were ministering before the tabernacle[a], the tent of meeting, with song until Solomon built the house of Yahweh in Jerusalem[c][b], and they stood according to their ordinance over their service.
translation:
  language: te
  text: వారు నివాస గుడారం, అనగా సమావేశ గుడారం, ఎదుట పాటతో పరిచర్య చేస్తూ, సొలొమోను యెరూషలేములో యెహోవా మందిరాన్ని[b] కట్టే వరకు ఉన్నారు. వారు తమ సేవకు సంబంధించి తమకు నిర్దేశించిన క్రమం ప్రకారం[c] నిలిచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: హెబ్రీలో ‘యెహోవా ఇల్లు’; అంటే దేవాలయం.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘తమ నియమం ప్రకారం’ లేదా ‘తమ ఆచారం ప్రకారం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשָׁרְתִים
  choice: పరిచర్య చేస్తూ ఉన్నారు
  rationale: ఆరాధనకు సంబంధించిన విధులను నిర్వహించడాన్ని సూచించే కృదంత రూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לִפְנֵי
  choice: ఎదుట
  rationale: పవిత్ర నివాసం సన్నిధిలో జరిగిన సేవను సూచించే సహజమైన స్థలసంబంధ పదం.
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: సమావేశ గుడారమనే నివాస గుడారం
  rationale: మִשְׁכַּן, אֹהֶל מוֹעֵד అనే రెండు హెబ్రీ పదబంధాలను ఒకటిగా కుదించకుండా, రెండవది మొదటిదానికి వివరణగా ఉన్న నిర్మాణాన్ని నిలుపుతుంది.
- source_word: בַּשִּׁיר
  choice: పాటతో
  rationale: వారి పరిచర్య జరిగిన విధానాన్ని, దాని సంగీత స్వభావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: עַד בְּנוֹת שְׁלֹמֹה
  choice: సొలొమోను ... కట్టే వరకు
  rationale: עַד తో కూడిన క్రియానామ రూపం ఈ ఏర్పాటుకు కాలపరమైన ముగింపును సూచిస్తుంది; తెలుగులో క్రియారూపం సహజంగా ఉంటుంది.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: బֵּית్ అనే ‘ఇల్లు/మందిరం’ భావాన్ని ఉంచుతూ, ఇక్కడ సూచించబడిన దేవాలయాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: וַיַּעַמְדוּ
  choice: నిలిచారు
  rationale: క్రియ యొక్క ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది; నియమిత సేవాస్థానంలో ఉండటం అనే సందర్భార్థాన్ని తరువాతి పదబంధం తెలియజేస్తుంది.
- source_word: כְמִשְׁפָּטָם
  choice: తమకు నిర్దేశించిన క్రమం ప్రకారం
  rationale: ఆరాధనా సేవలో అమలైన స్థిర నియమం లేదా ఏర్పాటును ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: עַל עֲבוֹדָתָם
  choice: తమ సేవలో
  rationale: వారికి అప్పగించబడిన సేవకు సంబంధించి వారు తమ స్థానాల్లో నిలిచారనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం ఉంది; దానిని బిరుదుగా మార్చకుండా తెలుగులో సాధారణంగా తెలిసిన రూపంలో ఉంచాం.
- issue: בֵּית יְהוָה ను ‘ఇల్లు’గా లేదా ‘దేవాలయం’గా వ్యక్తం చేయడం
  choice: యెహోవా మందిరం
  alternative: యెహోవా ఆలయం
  rationale: మూలంలోని ‘ఇల్లు/మందిరం’ రూపకాన్ని పూర్తిగా తొలగించకుండా, ఇక్కడ సొలొమోను కట్టిన దేవాలయమే ఉద్దేశమని సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని రెండు గుడార-పదాలను, దైవనామాన్ని, చివరి వాక్యంలోని ‘నిలిచారు’ అనే ప్రత్యక్ష రూపాన్ని నిలిపి, అవసరమైన ప్రత్యామ్నాయాలను పాదసూచికల్లో ఇచ్చాం.
