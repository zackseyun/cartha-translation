  terminology: ‘కుమారులు’ అనేది בְּנֵיకి ప్రత్యక్షమైన, సందర్భానుకూలమైన అనువాదం. పేర్లను హీబ్రూ ఉచ్చారణకు దగ్గరగా మహ్లీ, లిబ్నీ, షిమీ, ఉజ్జాగా లిప్యంతరీకరించడం సముచితం. ప్రత్యామ్నాయమైన ‘వంశస్థులు’ను సూచించే పాదటిప్పణి మూలంలోని సంభావ్య విస్తృత వంశావళి వాడుకను తగిన విధంగా తెలియజేస్తుంది.
