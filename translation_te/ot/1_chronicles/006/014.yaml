  yaml_path: translation/ot/1_chronicles/006/014.yaml
  text: 'The sons of Merari: Mahli[a], Libni his son, Shimei his son, Uzzah his son.'
translation:
  language: te
  text: 'మెరారీ కుమారులు[a]: మహ్లీ; అతని కుమారుడు లిబ్నీ; అతని కుమారుడు షిమీ; అతని కుమారుడు ఉజ్జా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: వంశావళి వాడుకలో దీనిని విస్తృతంగా ‘మెరారీ వంశస్థులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: బֵּן పదపు నిర్మాణ బహువచనం వంశావళిని పరిచయం చేస్తోంది. ‘కుమారులు’ మూలానికి అత్యంత సమీపమైనది; వంశావళి సందర్భంలో ‘వంశస్థులు’ అనే విస్తృత అర్థం కూడా సాధ్యమే.
- source_word: מְרָרִי
  choice: మెరారీ
  rationale: వ్యక్తి పేరు; ఆధునిక ప్రామాణిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: מַחְלִי
  choice: మహలి
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపాన్ని అనుసరించి తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: לִבְנִי
  choice: లిబ్ని
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపాన్ని అనుసరించి తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: בְנוֹ
  choice: అతని కుమారుడు
  rationale: పుంలింగ ఏకవచన ప్రత్యయంతో ఉన్న ‘కుమారుడు’ అనే పదం వంశపరంపర సంబంధాన్ని సూచిస్తుంది. ప్రతి పేరుకు తరువాత ‘అతని కుమారుడు’ అని ఇవ్వడం మూలంలోని వంశావళి గొలుసును స్పష్టంగా నిలుపుతుంది.
- source_word: שִׁמְעִי
  choice: షిమీ
  rationale: వ్యక్తి పేరు; హీబ్రూ శబ్దరూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: עֻזָּה
  choice: ఉజ్జా
  rationale: వ్యక్తి పేరు; హీబ్రూ వ్యంజన ద్విత్వాన్ని తెలుగులో ‘జ్జ’తో ప్రతిబింబిస్తూ లిప్యంతరీకరించబడింది.
