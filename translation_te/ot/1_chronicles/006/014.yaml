  register: సంక్షిప్తమైన వంశావళి శైలిని నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా మరియు గౌరవప్రదంగా రూపొందించబడింది. మూలంలోని ప్రతి ‘అతని కుమారుడు’ సంబంధం స్పష్టంగా ఉంచబడింది.
