source:
  edition: WLC
  text: וּ/מֵ/עֵ֜בֶר לְ/יַרְדֵּ֣ן יְרֵחוֹ֮ לְ/מִזְרַ֣ח הַ/יַּרְדֵּן֒ מִ/מַּטֵּ֣ה רְאוּבֵ֔ן אֶת בֶּ֥צֶר בַּ/מִּדְבָּ֖ר וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת יַ֖הְצָ/ה וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/063.yaml
  text: 'And beyond the Jordan at Jericho[a], east of the Jordan, from the tribe of Reuben: Bezer in the wilderness, with its pasturelands, and Jahzah, with its pasturelands.'
translation:
  language: te
  text: యెరికోకు ఎదురుగా యొర్దాను అవతల, యొర్దానుకు తూర్పున, రూబేను గోత్రం నుండి అరణ్యంలో ఉన్న బేసెరును దాని పచ్చిక బయళ్లతో సహా, యహ్సాను[a] దాని పచ్చిక బయళ్లతో సహా ఇచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ స్థలనామాన్ని కొన్ని అనువాదాలు “యహజు” అని కూడా రాస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר לְיַרְדֵּן יְרֵחוֹ
  choice: యెరికో దగ్గర యొర్దాను అవతల
  rationale: భౌగోళిక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, ‘అవతల’ అనే పదంతో עֵבֶר యొక్క స్థలార్థాన్ని నిలుపుతుంది.
- source_word: לְמִזְרַח הַיַּרְדֵּן
  choice: యొర్దానుకు తూర్పున
  rationale: מִזְרָח యొక్క తూర్పు దిశార్థాన్ని సంక్షిప్తంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מִמַּטֵּה רְאוּבֵן
  choice: రూబేను గోత్రం నుండి
  rationale: గోత్రాల భూకేటాయింపు సందర్భంలో מַטֶּה అంటే ‘గోత్రం’; తెలుగులో ఇదే సుపరిచితమైన బైబిలు పదప్రయోగం.
- source_word: בֶּצֶר
  choice: బేసెరు
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగులో సులభంగా పలికే విధంగా లిప్యంతరీకరించింది.
- source_word: בַּמִּדְבָּר
  choice: అరణ్యంలో ఉన్న
  rationale: מִדְבָּר సూచించే జనావాసం తక్కువైన అరణ్యప్రాంత భావాన్ని ఇస్తుంది; ‘ఉన్న’ అనే పదం బేసెరుతో దాని సంబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: מִגְרָשֶׁיהָ
  choice: దాని పచ్చిక బయళ్లతో సహా
  rationale: లేవీయుల పట్టణాల చుట్టూ పశువుల మేతకు కేటాయించిన బహిరంగ భూములను సందర్భానుసారంగా సూచిస్తుంది.
- source_word: יַהְצָה
  choice: యాహ్సా
  rationale: హీబ్రూ రూపంలోని צ ధ్వనిని ‘త్స’కు సమీపమైన ‘హ్స’ రూపంలో ప్రతిబింబిస్తూ స్థలనామాన్ని లిప్యంతరీకరించింది; సంప్రదాయ రూపాంతరం పాదసూచికలో ఇచ్చింది.
