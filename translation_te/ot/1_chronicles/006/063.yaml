translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; పట్టణాల కేటాయింపును తెలిపే జాబితా శైలిని నిలుపుతూ, వాక్యాన్ని సాధారణ పాఠకులకు సహజంగా తీర్చిదిద్దింది. హీబ్రూ వాక్యంలో క్రియ ప్రత్యక్షంగా లేకపోయినా, సందర్భంలోని కేటాయింపు భావాన్ని తెలుగులో పూర్తి చేయడానికి ‘ఇచ్చారు’ అని చేర్చింది. పాదసూచిక గుర్తును సంబంధిత స్థలనామమైన యాహ్సా దగ్గర ఉంచింది.
