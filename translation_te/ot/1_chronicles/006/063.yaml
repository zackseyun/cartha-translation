revisions:
- from: 'యెరికో దగ్గర యొర్దాను అవతల, యొర్దానుకు తూర్పున, రూబేను గోత్రం నుండి: అరణ్యంలో ఉన్న బేసెరును దాని పచ్చిక బయళ్లతో సహా, యాహ్సాను[a] దాని పచ్చిక బయళ్లతో సహా ఇచ్చారు.'
