  text: son of Elkanah[a], son of Jeroham, son of Eliel[b], son of Tohah.
translation:
  language: te
  text: ఎల్కానా కుమారుడు, యెరోహాము కుమారుడు, ఎలీయేలు కుమారుడు, తోహా కుమారుడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశావళిలో בֶּן ప్రత్యక్ష కుమారత్వాన్ని లేదా వంశసంబంధాన్ని సూచించగలదు. ఇక్కడ పునరావృతమయ్యే వంశావళి శైలిని నిలుపుతూ సాధారణమైన ‘కుమారుడు’ అని అనువదించాం.
- source_word: אֶלְקָנָה
  choice: ఎల్కానా
  rationale: హీబ్రూ వ్యక్తిపేరును ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: יְרֹחָם
  choice: యెరోహాము
  rationale: హీబ్రూ ఉచ్చారణకు సమీపంగా ఉండే తెలుగు లిప్యంతరీకరణను ఎంచుకున్నాం.
- source_word: אֱלִיאֵל
  choice: ఎలీయేలు
  rationale: హీబ్రూ పేరులోని ధ్వనులను సహజమైన తెలుగు బైబిలు పేర్ల శైలిలో ప్రతిబింబించాం.
- source_word: תּוֹחַ
  choice: తోహ
  rationale: మసొరేటిక్ పాఠంలోని תּוֹחַ రూపాన్నే అనుసరించాం; సమాంతర వంశావళుల ఆధారంగా వేరే పేరును ప్రధాన పాఠంలోకి తీసుకురాలేదు.
theological_decisions: []
translation_notes:
  register: వంశావళి జాబితాకు తగిన సంక్షిప్త, గంభీర శైలిని నిలిపాం. ప్రతి בֶּן‌కు ‘కుమారుడు’ అనే ఒకే రూపాన్ని వాడి మూలపాఠంలోని పునరుక్త నిర్మాణాన్ని కాపాడాం. అందించిన ఆంగ్ల సంప్రదింపుపాఠంలోని పాదసూచిక గుర్తులు అవి వివరిస్తున్న పేర్ల వద్ద లేవు; అంతేకాక అవి WLC పాఠానికి అవసరమైన స్పష్టీకరణలు కావు. అందువల్ల ఆధారరహితమైన పాదసూచికలను తెలుగు ముసాయిదాలో చేర్చలేదు.
