  yaml_path: translation/ot/1_chronicles/006/059.yaml
  text: 'and from the tribe of Asher: Mashal with its pasturelands[a], and Abdon with its pasturelands.'
translation:
  language: te
  text: 'ఆషేరు గోత్రం నుండి: మాషాలు[a] పట్టణాన్ని, దాని పచ్చికబయళ్లను, అబ్దోను పట్టణాన్ని, దాని పచ్చికబయళ్లను ఇచ్చారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ దినవృత్తాంతాల పాఠంలో ఈ పేరు ‘మాషాలు’గా ఉంది; సమాంతర జాబితా అయిన యెహోషువ 21:30లో ‘మిషాలు’గా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּ֣ה
  choice: గోత్రం నుండి
  rationale: గోత్రాల వారీగా పట్టణాలు కేటాయిస్తున్న సందర్భంలో מַטֶּה అంటే ‘గోత్రం’. וּ మరియు מִן భావాలు వాక్యనిర్మాణంలో సహజంగా ప్రతిఫలించాయి.
- source_word: אָשֵׁ֔ר
  choice: ఆషేరు
  rationale: గోత్రనామాన్ని ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֶת מָשָׁ֖ל
  choice: మాషాలు పట్టణాన్ని
  rationale: ఎబ్ర Hebrew దినవృత్తాంతాల పాఠంలోని మָשָׁל రూపాన్ని అనుసరించి స్థలనామాన్ని లిప్యంతరీకరించాం. אֶת కర్మసూచకత్వాన్ని ‘పట్టణాన్ని’ అనే రూపంలో సహజంగా చూపించాం; ‘పట్టణం’ మూలంలో స్పష్టంగా లేకపోయినా జాబితా సందర్భం దానిని సూచిస్తుంది.
- source_word: מִגְרָשֶׁ֑י/הָ
  choice: దాని పచ్చికబయళ్లను
  rationale: מִגְרָשׁ అనేది పట్టణానికి చెందిన, పశువులను మేపడానికి ఉపయోగించే చుట్టుపక్కల బహిరంగ భూమిని సూచిస్తుంది. ‘పచ్చికబయళ్లు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది; స్త్రీలింగ ఏకవచన ప్రత్యయం పట్టణాన్ని సూచిస్తూ ‘దాని’గా అనువదించాం.
- source_word: עַבְדּ֖וֹן
  choice: అబ్దోను
  rationale: స్థలనామాన్ని ఆధునిక తెలుగు రూపంలో లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలిని వాడాం. ఈ వచనం ముందున్న క్రియపై ఆధారపడే జాబితాలో భాగమైనందున, తెలుగులో స్వతంత్రంగా స్పష్టంగా చదవడానికి ‘ఇచ్చారు’ను పూరించాం. ప్రతి స్థలనామం తరువాత ‘పట్టణాన్ని’ను చేర్చి కర్మసంబంధాన్ని, పట్టణం–పచ్చికబయళ్ల అనుబంధాన్ని స్పష్టం చేశాం.
