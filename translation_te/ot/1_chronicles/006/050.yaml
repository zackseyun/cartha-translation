source:
  edition: WLC
  text: וַ/יִּתְּנ֣וּ בַ/גּוֹרָ֗ל מִ/מַּטֵּ֤ה בְנֵי יְהוּדָה֙ וּ/מִ/מַּטֵּ֣ה בְנֵי שִׁמְע֔וֹן וּ/מִ/מַּטֵּ֖ה בְּנֵ֣י בִנְיָמִ֑ן אֵ֚ת הֶ/עָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁר יִקְרְא֥וּ אֶתְ/הֶ֖ם בְּ/שֵׁמֽוֹת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/050.yaml
  text: They assigned by lot from the tribe of the sons of Judah[a], and from the tribe of the sons of Simeon, and from the tribe of the sons of Benjamin, these cities, which they called by name.
translation:
  language: te
  text: యూదా వంశస్థుల గోత్రం నుండి, షిమ్యోను వంశస్థుల గోత్రం నుండి, బెన్యామీను వంశస్థుల గోత్రం నుండి ఈ పట్టణాలను చీట్లు వేసి కేటాయించారు. ఆ పట్టణాల పేర్లు ఇవి:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ పదశః భావం: “వాటిని పేర్లతో పిలిచారు.” ఇది తరువాత వచ్చే పట్టణాల పేర్ల జాబితాను పరిచయం చేసే ప్రయోగం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: వారికి కేటాయించారు
  rationale: נתן యొక్క ప్రాథమిక అర్థం ‘ఇచ్చారు’; లేవీయుల పట్టణాల పంపిణీ సందర్భంలో ‘కేటాయించారు’ అనే పరిపాలనా భావం సహజంగా సరిపోతుంది. పరోక్ష కర్మను తెలుగు వాక్యస్పష్టత కోసం ‘వారికి’గా వ్యక్తపరిచాం.
- source_word: בַגּוֹרָל
  choice: చీట్లు వేసి
  rationale: גורל చీటివేయడం ద్వారా నిర్ణయించిన కేటాయింపును సూచిస్తుంది; ఆధునిక తెలుగులో ‘చీట్లు వేసి’ సహజంగా ఉండి విధానాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: מִמַּטֵּה
  choice: గోత్రం నుండి
  rationale: గోత్ర జాబితాల్లో מַטֶּה అంటే ‘గోత్రం’; ‘నుండి’ అనే విభక్తి מִן భావాన్ని నిలుపుతుంది.
- source_word: בְנֵי יְהוּדָה / בְנֵי שִׁמְעוֹן / בְּנֵי בִנְיָמִן
  choice: యూదా వంశస్థులు / షిమ్యోను వంశస్థులు / బెన్యామీను వంశస్థులు
  rationale: ‘కుమారులు’ అనే పదశః రూపం కంటే, ఇక్కడ గోత్ర సముదాయాలను సూచించే בְנֵי భావాన్ని ‘వంశస్థులు’ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ఈ పట్టణాలు
  rationale: עָרִיםకు కేటాయింపు సందర్భంలో ‘పట్టణాలు’ సాధారణమైన, సహజమైన తెలుగు సమానం.
- source_word: אֲשֶׁר יִקְרְאוּ אֶתְהֶם בְּשֵׁמוֹת
  choice: ఆ పట్టణాల పేర్లు ఇవి
  rationale: హీబ్రూ పదశఃగా ‘వాటిని పేర్లతో పిలిచే’ అనే సూత్రప్రాయమైన నిర్మాణం; వెంట వచ్చే పేర్ల జాబితాను పరిచయం చేసే దాని కార్యాన్ని తెలుగులో సహజంగా వ్యక్తపరిచాం. పదశః రూపాన్ని పాదసూచికలో ఉంచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. గోత్ర సంబంధాన్ని స్పష్టపరచడానికి ‘వంశస్థులు’ వాడాం; హీబ్రూ సూత్రప్రాయమైన చివరి ఉపవాక్యాన్ని సహజమైన జాబితా-పరిచయ రూపంలో ఇచ్చి, పదశః భావాన్ని పాదసూచికలో భద్రపరిచాం.
