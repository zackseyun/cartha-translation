translation:
  language: te
  text: యోవాహు అతని కుమారుడు, ఇద్దో అతని కుమారుడు, జెరహు అతని కుమారుడు, యెయాతెరై[a] అతని కుమారుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యెతెరై.”
    reason: యెయాతెరై పేరుకు సాధ్యమైన ప్రత్యామ్నాయ లిప్యంతరీకరణ.
lexical_decisions:
- source_word: יוֹאָח
  choice: యోవాహు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా, తెలుగులో సహజంగా పలికే విధంగా లిప్యంతరీకరించాం.
- source_word: בְּנוֹ
  choice: అతని కుమారుడు
  rationale: వంశావళి సందర్భంలో בֵּן పదానికి మూడవ పురుష ఏకవచన ప్రత్యయం చేరిన రూపం సాధారణంగా ‘అతని కుమారుడు’ అని అర్థం. వంశావళులు కొన్నిసార్లు తరాలను సంక్షిప్తం చేసినా, ఇక్కడి పదబంధపు ప్రత్యక్ష అర్థాన్ని నిలిపాం.
- source_word: עִדּוֹ
  choice: ఇద్దో
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: זֶרַח
  choice: జెరహు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: יְאָתְרַי
  choice: యెయాతెరై
  rationale: మసొరెటిక్ స్వరచిహ్నాలతో ఉన్న హీబ్రూ పేరులోని వ్యంజన, స్వర క్రమాన్ని ప్రతిబింబించే తెలుగు లిప్యంతరీకరణను ఎంచుకున్నాం; సరళీకృత ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో ఉంచాం.
