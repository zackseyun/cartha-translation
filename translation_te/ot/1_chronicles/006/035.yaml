  text: וְ/אֵ֖לֶּה בְּנֵ֣י אַהֲרֹ֑ן אֶלְעָזָ֥ר בְּנ֛/וֹ פִּֽינְחָ֥ס בְּנ֖/וֹ אֲבִישׁ֥וּעַ בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/035.yaml
  text: 'And these were the sons of Aaron: Eleazar his son, Phinehas his son, Abishua his son.'
translation:
  language: te
  text: 'అహరోను కుమారులు వీరు: ఎలియాజరు అతని కుమారుడు, ఫీనెహాసు అతని కుమారుడు, అబీషూవ అతని కుమారుడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: వీరు
  rationale: సంయోజక అవ్యయంతో కూడిన సూచన సర్వనామం వంశావళి జాబితాను పరిచయం చేస్తుంది. తెలుగులో సందర్భానుసారంగా సంయోజకాన్ని విడిచిపెట్టి ‘వీరు’ అని చెప్పడం సహజంగా, అర్థనిష్ఠగా ఉంటుంది.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇక్కడ వెంటనే ప్రత్యక్ష పుత్రపరంపర ఇవ్వబడుతున్నందున విస్తృతార్థమైన ‘వంశస్థులు’ కంటే ‘కుమారులు’ మూలపదానికి తగినది.
- source_word: אַהֲרֹן
  choice: అహరోను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: אֶלְעָזָר
  choice: ఎలియాజరు
  rationale: తెలుగు బైబిలు సంప్రదాయంలో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపం.
- source_word: בְּנוֹ
  choice: అతని కుమారుడు
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయంతో ఉన్న ‘కుమారుడు’ అనే పదం ప్రతి తరంలో ప్రత్యక్ష పుత్రసంబంధాన్ని సూచిస్తుంది; పునరుక్తిని నిలుపుకోవడం వంశావళి గొలుసును స్పష్టంగా ఉంచుతుంది.
- source_word: פִּינְחָס
  choice: ఫీనెహాసు
  rationale: తెలుగు బైబిలు వాడుకలో గుర్తించబడే వ్యక్తినామ రూపం.
- source_word: אֲבִישׁוּעַ
  choice: అబీషూవ
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు లిపిలో సహజంగా ప్రతిబింబించే రూపం.
