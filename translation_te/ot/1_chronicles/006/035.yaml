translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గంభీర శైలి. మూలంలోని పుత్రపరంపర పునరుక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది.
