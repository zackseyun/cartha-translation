lexical_decisions:
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశావళిలో ప్రత్యక్ష పితృసంబంధాన్ని సూచించే హెబ్రీ పదం. పునరావృత వంశక్రమ నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ציף
  choice: జీఫు
  rationale: వ్యక్తి పేరు; హెబ్రీ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: אֶלְקָנָה
  choice: ఎల్కానా
  rationale: వ్యక్తి పేరు; మూలరూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: מַחַת
  choice: మహతు
  rationale: వ్యక్తి పేరు; హెబ్రీ హల్లుల రూపాన్ని అనుసరించి, తెలుగు పఠనానికి సహజంగా లిప్యంతరీకరించబడింది.
- source_word: עֲמָשָׂי
  choice: అమశై
  rationale: వ్యక్తి పేరు; మూల హెబ్రీ ఉచ్చారణను ప్రతిబింబించేలా లిప్యంతరీకరించబడింది.
