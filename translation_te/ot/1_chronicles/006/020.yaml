translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. ఈ వచనం ముందరి వచనం నుండి కొనసాగుతున్న పేర్ల గొలుసు కాబట్టి మూలంలోని పునరావృత నిర్మాణం అలాగే ఉంచబడింది.
