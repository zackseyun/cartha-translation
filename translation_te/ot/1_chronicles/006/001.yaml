  yaml_path: translation/ot/1_chronicles/006/001.yaml
  text: 'The sons of Levi: Gershom[a], Kohath[b], and Merari.'
translation:
  language: te
  text: 'లేవి కుమారులు: గేర్షోము[a], కహాతు, మరియు మెరారీ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో పేరు ‘గేర్షోమ్’; సంబంధిత వంశావళి భాగాల్లో ‘గేర్షోన్’ అనే రూపం కూడా కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది בֵּן అనే పదానికి నిర్మాణ బహువచన రూపం. వంశావళుల్లో విస్తృతార్థంగా ‘సంతానం’ను సూచించగలిగినా, ఇక్కడ లేవి ప్రత్యక్ష కుమారులే పేర్కొనబడుతున్నారు; అందువల్ల ‘కుమారులు’ సహజమూ సందర్భోచితమూ.
- source_word: לֵוִי
  choice: లేవి
  rationale: వ్యక్తి పేరు; తెలుగులో స్థిరపడిన బైబిలు నామరూపాన్ని ఉపయోగించాం.
- source_word: גֵּרְשֹׁם
  choice: గేర్షోము
  rationale: ఈ వచనంలోని మసొరా పాఠం గేర్షోమ్ అనే రూపాన్ని కలిగి ఉంది; దానిని తెలుగులో ‘గేర్షోము’గా లిప్యంతరీకరించాం.
- source_word: קְהָת
  choice: కహాతు
  rationale: హీబ్రూ వ్యక్తి పేరుకు తెలుగులో ప్రసిద్ధమైన బైబిలు నామరూపం.
- source_word: וּ/מְרָרִי
  choice: మెరారి
  rationale: వావ్ సంధాయకం జాబితాలో చివరి పేరును కలుపుతుంది. తెలుగులో విరామచిహ్నాలతో కూడిన జాబితి నిర్మాణం ద్వారా ఆ సమన్వయం సహజంగా వ్యక్తమవుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త వంశావళి శైలిని నిలిపాం. మూలంలోని నామవాచక వాక్య నిర్మాణాన్ని సహజమైన తెలుగు జాబితిగా అందించాం; వ్యక్తి పేర్లకు తెలుగులో విస్తృతంగా తెలిసిన బైబిలు రూపాలను వాడాం.
