translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. హెబ్రోను అనే స్థలనామాన్ని నిలిపి, లేవీయ పట్టణాల సందర్భంలోని భూవినియోగ పదానికి సులభంగా అర్థమయ్యే ప్రధాన అనువాదంతో పాటు పాదటిప్పణిలో ప్రత్యామ్నాయ భావాన్ని ఇచ్చాం.
