source:
  edition: WLC
  text: וַֽ/יִּתְּנ֥וּ לָ/הֶ֛ם אֶת חֶבְר֖וֹן בְּ/אֶ֣רֶץ יְהוּדָ֑ה וְ/אֶת מִגְרָשֶׁ֖י/הָ סְבִיבֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/040.yaml
  text: They gave them Hebron in the land of Judah[a], with its pasturelands around it.
translation:
  language: te
  text: వారు వారికి యూదా దేశంలోని హెబ్రోనును, దాని చుట్టుపక్కల పచ్చిక భూములతో పాటు ఇచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాని సామూహిక వినియోగ భూములతో.’ ఇక్కడి హీబ్రూ పదం పట్టణానికి అనుబంధంగా ఉన్న బహిరంగ భూమిని సూచిస్తుంది; అది తరచుగా పశువులను మేపడానికి ఉపయోగించబడేది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: వారు ఇచ్చారు
  rationale: נתן అనే క్రియ యొక్క ఖల్ వయ్యిక్తోల్ రూపం కథనంలో ‘అప్పుడు/మరియు వారు ఇచ్చారు’ అనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగు కథన శైలిలో సంధాన అవ్యయాన్ని తప్పించి సాధారణ భూతకాలంతో సహజంగా అనువదించాం.
- source_word: לָהֶם
  choice: వారికి
  rationale: ל ఉపసర్గ పరోక్ష కర్మను సూచిస్తుంది; తెలుగులో చతుర్థీ విభక్తి ‘వారికి’ మూలార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: חֶבְרוֹן
  choice: హెబ్రోనును
  rationale: స్థలనామాన్ని తెలుగు లిపిలో లిప్యంతరీకరించి, వాక్యంలో ప్రత్యక్ష కర్మగా ‘ను’ విభక్తిని చేర్చాం.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: యూదా దేశంలోని
  rationale: אֶרֶץ అంటే ‘దేశం’ లేదా ‘ప్రాంతం.’ భౌగోళిక సూచనను అతిగా నిర్దిష్టం చేయకుండా ‘యూదా దేశం’గా నిలిపి, తెలుగులో సహజమైన సంబంధ రూపాన్ని వాడాం.
- source_word: מִגְרָשֶׁיהָ
  choice: దాని పచ్చిక భూములతో
  rationale: מִגְרָשׁ పట్టణానికి అనుబంధంగా ఉన్న బహిరంగ భూమిని, ముఖ్యంగా పశువులను మేపే భూమిని సూచిస్తుంది. సాధారణ పాఠకులకు అర్థమయ్యేలా ‘పచ్చిక భూములు’ అని అనువదించాం; విస్తృత అర్థాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: סְבִיבֹתֶיהָ
  choice: దాని చుట్టూ ఉన్న
  rationale: ఈ రూపం హెబ్రోను చుట్టుపక్కల ఉన్న ప్రాంతాన్ని సూచిస్తుంది. ‘దాని చుట్టూ ఉన్న’ అనే ప్రయోగం పచ్చిక భూముల స్థానాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
