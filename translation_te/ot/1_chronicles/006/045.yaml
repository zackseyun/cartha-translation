translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. పేర్లు హీబ్రూ పాఠాన్ని అనుసరించి లిప్యంతరీకరించబడ్డాయి. అందించిన ఆంగ్ల పాదసూచిక ‘Alemeth’ వద్ద ఉన్నప్పటికీ దాని విషయం కూడా ‘Alemeth’ గురించే కావడంతో అసంగతంగా ఉంది; మూల హీబ్రూ పాఠంలో పాఠాంతర సూచన అవసరం లేక ప్రధాన వచనంలో పాదసూచిక చేర్చలేదు.
