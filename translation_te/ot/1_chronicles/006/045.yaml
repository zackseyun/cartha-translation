  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִ/מַּטֵּ֣ה בִנְיָמִ֗ן אֶת גֶּ֤בַע וְ/אֶת מִגְרָשֶׁ֨י/הָ֙ וְ/אֶת עָלֶ֣מֶת וְ/אֶת מִגְרָשֶׁ֔י/הָ וְ/אֶת עֲנָת֖וֹת וְ/אֶת מִגְרָשֶׁ֑י/הָ כָּל עָרֵי/הֶ֛ם שְׁלֹשׁ עֶשְׂרֵ֥ה עִ֖יר בְּ/מִשְׁפְּחוֹתֵי/הֶֽם־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/045.yaml
  text: 'and from the tribe of Benjamin: Geba with its pasturelands[a], Alemeth with its pasturelands, and Anathoth with its pasturelands—all their cities were thirteen cities according to their families.'
translation:
  language: te
  text: 'మరియు బెన్యామీను గోత్రం నుండి: గెబా దాని పచ్చిక బయళ్లతో, ఆలెమెతు[a] దాని పచ్చిక బయళ్లతో, అనాతోతు దాని పచ్చిక బయళ్లతో; వారి వంశాల ప్రకారం వారి పట్టణాలన్నీ మొత్తం పదమూడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో «ఆలెమెతు»; యెహోషువ 21:18లోని సమాంతర జాబితాలో «అల్మోను» అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִמַּטֵּה בִנְיָמִן
  choice: బెన్యామీను గోత్రం నుండి
  rationale: మַטֶּה ఇక్కడ కర్రను కాక గోత్ర విభాగాన్ని సూచిస్తుంది. మִן భావాన్ని ‘నుండి’గా తెలిపి, ముందటి జాబితా కొనసాగింపును సహజమైన తెలుగులో ఉంచాం.
- source_word: גֶּבַע
  choice: గెబ
  rationale: స్థలనామాన్ని మూల హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: מִגְרָשֶׁיהָ
  choice: దాని పచ్చిక బయళ్లు
  rationale: లేవీయుల పట్టణాల చుట్టూ పశువుల మేతకు ఉపయోగించే బహిరంగ భూమిని సూచించే מִגְרָשׁ భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: עָלֶמֶת
  choice: ఆలెమెతు
  rationale: ఈ వచనంలోని మసొరేటిక్ పాఠం עָלֶמֶתను అనుసరించాం; యెహోషువ 21:18లోని సమాంతర జాబితాలో ఉన్న ‘అల్మోను’ను ప్రధాన పాఠంలోకి తీసుకురాలేదు.
- source_word: עֲנָתוֹת
  choice: అనాతోతు
  rationale: స్థలనామాన్ని హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: כָּל עָרֵיהֶם שְׁלֹשׁ עֶשְׂרֵה עִיר
  choice: వారికి లభించిన పట్టణాలన్నీ పదమూడు
  rationale: జాబితా ముగింపులోని మొత్తం సంఖ్యను సహజమైన తెలుగు వాక్య నిర్మాణంలో తెలిపాం. ‘వారికి లభించిన’ అనేది సందర్భంలో అంతర్లీనమైన కేటాయింపు భావాన్ని స్పష్టం చేస్తుంది.
- source_word: בְּמִשְׁפְּחוֹתֵיהֶם
  choice: వారి వంశాల ప్రకారం
  rationale: מִשְׁפָּחוֹת విస్తృత కుటుంబ సమూహాలు లేదా వంశాలను సూచించగలదు; ‘వంశాలు’ ఈ గోత్రీయ కేటాయింపు సందర్భానికి సహజంగా సరిపోతుంది.
