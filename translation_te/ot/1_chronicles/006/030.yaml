  text: హషబ్యా కుమారుడు, అమజ్యా కుమారుడు, హిల్కీయా కుమారుడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశావళి వరుసలో בֶּן ప్రత్యక్ష కుమారత్వాన్ని లేదా వంశసంబంధాన్ని సూచించగలదు. ఇక్కడ పునరావృతమయ్యే హెబ్రీ సూత్రాన్ని సహజమైన తెలుగులో నిలుపుతూ ‘కుమారుడు’ అని అనువదించాం.
- source_word: חֲשַׁבְיָה
  choice: హషబ్యా
  rationale: హెబ్రీ వ్యక్తిపేరును దాని ధ్వనిరూపానికి సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: אֲמַצְיָה
  choice: అమజ్యా
  rationale: హెబ్రీ వ్యక్తిపేరును అనువదించకుండా, దాని ధ్వనిరూపానికి సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: חִלְקִיָּה
  choice: హిల్కీయా
  rationale: హెబ్రీ వ్యక్తిపేరును దాని ధ్వనిరూపానికి సమీపంగా, తెలుగులో సులభంగా చదవగల రూపంలో లిప్యంతరీకరించాం.
