  text: son of Ethan[a], son of Zimmah, son of Shimei.
translation:
  language: te
  text: ఏతాను కుమారుడు[a], జిమ్మా కుమారుడు, షిమీ కుమారుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వంశావళులు కొన్నిసార్లు మధ్య తరాలను పేర్కొనకపోవచ్చు. అందువల్ల కొన్ని సందర్భాల్లో ‘కుమారుడు’ అనే మాటకు విస్తృతంగా ‘వంశస్థుడు’ అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశావళి జాబితాలో בֶּן అనే నిర్మాణరూప నామవాచకానికి సహజమైన ప్రత్యక్ష సమానార్థకం ‘కుమారుడు’. కొన్ని వంశావళుల్లో తరాలు దాటవేయబడవచ్చు కాబట్టి విస్తృతంగా ‘వంశస్థుడు’ అనే భావం సాధ్యమైనా, మూలపాఠంలోని సాధారణ వంశావళి సూత్రాన్ని ప్రధాన పాఠంలో నిలుపుకున్నాం.
- source_word: אֵיתָן
  choice: ఏతాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక ప్రామాణిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: זִמָּה
  choice: జిమ్మా
  rationale: ఇది ఇక్కడ వ్యక్తినామం; మూలధాతువుకు ఇతర సందర్భాల్లో ఉండే అర్థాన్ని అనువదించకుండా, పేరుగా లిప్యంతరీకరించాం.
- source_word: שִׁמְעִי
  choice: షిమీ
  rationale: హీబ్రూ వ్యక్తినామం שִׁמְעִי ధ్వనికి దగ్గరగా, తెలుగులో సులభంగా చదవగల రూపాన్ని ఎంచుకున్నాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలిని నిలిపాం. మూలంలోని పునరావృత నిర్మాణాన్ని సహజంగా ఉంచి, వ్యక్తినామాలను హీబ్రూ ధ్వనులకు సమీపంగా లిప్యంతరీకరించాం.
