  yaml_path: translation/ot/1_chronicles/006/029.yaml
  text: 'And the sons of Merari[a], their brothers, were on the left: Ethan son of Kishi, son of Abdi, son of Malluch.'
translation:
  language: te
  text: 'వారి సహోదరులైన మెరారీ కుమారులు[a] ఎడమవైపున ఉన్నారు: కీషీ కుమారుడు ఏతాను, అబ్దీ కుమారుడు కీషీ, మల్లూకు కుమారుడు అబ్దీ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి బంధువులు’; వంశావళి సందర్భాల్లో ‘సహోదరులు’ అనే హీబ్రూ పదం ఒకే వంశానికి చెందినవారిని విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי מְרָרִי
  choice: మెరారీ కుమారులైన
  rationale: בני అనే వంశావళి పదబంధంలోని ‘కుమారులు’ రూపాన్ని నిలుపుతూ, ఇక్కడ మెరారీ వంశానికి చెందిన గాయకుల సమూహాన్ని సూచించేలా సహజమైన తెలుగులో ఇచ్చాం.
- source_word: אֲחֵיהֶם
  choice: వారి సహోదరులు
  rationale: హీబ్రూ అక్షరార్థమైన ‘వారి సహోదరులు’ను నిలిపాం; వంశ/గోత్ర సందర్భంలో ఇది విస్తృతంగా బంధువులను లేదా సహవంశస్థులను కూడా సూచించవచ్చని పాదసూచిక తెలియజేస్తుంది.
- source_word: עַל הַשְּׂמֹאול
  choice: ఎడమవైపున ఉన్నారు
  rationale: ‘ఎడమవైపున’ అనే స్థానార్థాన్ని కాపాడి, హీబ్రూలో అధ్యాహారంగా ఉన్న క్రియను తెలుగులో ‘ఉన్నారు’ అని స్పష్టం చేశాం.
- source_word: אֵיתָן בֶּן קִישִׁי בֶּן עַבְדִּי בֶּן מַלּוּךְ
  choice: కీషీ కుమారుడు ఏతాను; కీషీ అబ్దీ కుమారుడు, అబ్దీ మల్లూకు కుమారుడు
  rationale: హీబ్రూ వంశావళి శ్రేణిని వ్యక్తి-తండ్రి సంబంధాలుగా స్పష్టంగా వ్యక్తం చేసి, ఆధునిక తెలుగులో పేర్ల అనుసంధానంపై కలగగల అయోమయాన్ని తగ్గించాం.
- source_word: אֵיתָן / קִישִׁי / עַבְדִּי / מַלּוּךְ
  choice: ఏతాను / కీషీ / అబ్దీ / మల్లూకు
  rationale: హీబ్రూ వ్యక్తినామాల ఉచ్చారణను అనుసరించి తెలుగులో సహజంగా లిప్యంతరీకరించాం.
