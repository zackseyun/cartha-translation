lexical_decisions:
- source_word: מְרָיוֹת
  choice: మెరాయోతు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: בְּנוֹ
  choice: అతని కుమారుడు
  rationale: వంశావళిలోని ‘అతని కుమారుడు’ అనే సంబంధాన్ని ప్రతి తరానికి స్పష్టంగా, సహజమైన తెలుగులో నిలిపాం.
- source_word: אֲמַרְיָה
  choice: అమర్యా
  rationale: యాహ్ మూలకం ఉన్న హీబ్రూ వ్యక్తి పేరును మూలభాష రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: אֲחִיטוּב
  choice: అహీటూబు
  rationale: వ్యక్తి పేరును హీబ్రూ ధ్వనులకు దగ్గరగా, తెలుగు పఠనానికి అనువుగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి సూత్రాన్ని సంక్షిప్తంగా మరియు గంభీరంగా అందించాం. హీబ్రూలో మూడుసార్లు వచ్చిన ‘అతని కుమారుడు’ను కుదించకుండా ప్రతిసారీ ఉంచాం; విభాగాలను స్పష్టపరచడానికి సెమీకోలన్లు వాడాం.
