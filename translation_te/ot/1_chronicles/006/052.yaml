translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. ‘పచ్చికబయళ్లు’ అనే పదం లేవీయ పట్టణాల చుట్టూ మేతకు కేటాయించిన భూమిని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; మూలంలోని జాబితా నిర్మాణాన్ని ప్రధాన పాఠ్యంలో సులభంగా చదవగలిగేలా, పాదటిప్పణిలో మరింత అక్షరార్థంగా నిలిపాం.
