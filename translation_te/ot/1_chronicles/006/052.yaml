source:
  edition: WLC
  text: וַ/יִּתְּנ֨וּ לָ/הֶ֜ם אֶת עָרֵ֧י הַ/מִּקְלָ֛ט אֶת שְׁכֶ֥ם וְ/אֶת מִגְרָשֶׁ֖י/הָ בְּ/הַ֣ר אֶפְרָ֑יִם וְ/אֶת גֶּ֖זֶר וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/052.yaml
  text: 'They gave them the cities of refuge: Shechem with its pasturelands in the hill country of Ephraim[a], and Gezer with its pasturelands.'
translation:
  language: te
  text: వారు వారికి ఆశ్రయ పట్టణాలైన ఎఫ్రాయిము కొండప్రాంతంలోని షెకెమును దాని పచ్చికబయళ్లతో సహా, గెజెరును దాని పచ్చికబయళ్లతో సహా ఇచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “వారు వారికి ఆశ్రయ పట్టణాలను ఇచ్చారు: ఎఫ్రాయిము కొండప్రాంతంలోని షెకెమును, దాని పచ్చికబయళ్లను, గెజెరును, దాని పచ్చికబయళ్లను.”'
    reason: עָרֵי הַמִּקְלָט తరువాతి పట్టణాలన్నిటినీ ‘ఆశ్రయ పట్టణాలు’గా వ్యాకరణపరంగా పరిచయం చేసే హీబ్రూ నిర్మాణాన్ని మరింత రూపానుగుణంగా చూపించడానికి.
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: ఇచ్చారు
  rationale: נתן క్రియ యొక్క వయ్యిక్తోల్ రూపం కథనంలోని తదుపరి చర్యను సూచిస్తుంది; తెలుగులో వాక్యక్రమమే ఆ కొనసాగింపును సహజంగా తెలియజేస్తుంది.
- source_word: לָהֶם
  choice: వారికి
  rationale: ముందరి సందర్భంలో పేర్కొన్న స్వీకర్తలను సూచించే సరళమైన బహువచన సర్వనామం.
- source_word: עָרֵי הַמִּקְלָט
  choice: ఆశ్రయ పట్టణాలు
  rationale: ఇశ్రాయేలు ధర్మశాస్త్రంలో రక్షణ కోసం నియమించబడిన పట్టణాలను సూచించే సాంకేతిక పదబంధానికి స్పష్టమైన ఆధునిక తెలుగు రూపం.
- source_word: שְׁכֶם
  choice: షెకెము
  rationale: స్థలనామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: מִגְרָשֶׁיהָ
  choice: దాని పచ్చికబయళ్లు
  rationale: పట్టణానికి చెందిన, ముఖ్యంగా పశువుల మేతకు ఉపయోగించే చుట్టుపక్కల బహిరంగ భూమిని సూచిస్తుంది.
- source_word: בְּהַר אֶפְרָיִם
  choice: ఎఫ్రాయిము కొండప్రాంతంలో
  rationale: ఒకే పర్వతాన్ని కాకుండా ఎఫ్రాయిముతో సంబంధమున్న ఎత్తైన కొండప్రాంతాన్ని సూచించే సహజమైన తెలుగు రూపం.
- source_word: גֶּזֶר
  choice: గెజెరు
  rationale: స్థలనామాన్ని లిప్యంతరీకరించాం.
- source_word: וְאֶת ... וְאֶת
  choice: …ను …తో సహా, …ను …తో సహా
  rationale: హీబ్రూ సంధానాలు, కర్మసూచక పదాల పునరుక్తిని ప్రతి పట్టణాన్ని దాని పచ్చికబయళ్లతో స్పష్టంగా జతచేసే సహజ తెలుగు నిర్మాణంలో ఇచ్చాం.
