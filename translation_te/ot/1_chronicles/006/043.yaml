translation:
  language: te
  text: హీలేను దాని పచ్చికబయళ్లతో, దెబీరును దాని పచ్చికబయళ్లతో.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חִילֵז
  choice: హీలేను
  rationale: దీర్ఘకాలిక మసొరెటిక్ పఠనంలోని స్థలనామ రూపాన్ని అనువదించకుండా తెలుగులో లిప్యంతరీకరించాం. చివరి హీబ్రూ అక్షరం అసాధారణంగా కనిపించినా, WLC ఇచ్చిన స్వరచిహ్నిత రూపం మరియు సంప్రదాయ పఠనం ఆధారంగా ‘హీలేను’ ఎంచుకున్నాం.
- source_word: מִגְרָשֶׁיהָ
  choice: దాని పచ్చికబయళ్లను
  rationale: లేవీయ పట్టణానికి చెందిన చుట్టుపక్కల బహిరంగ భూములను, ముఖ్యంగా పశువుల మేతకు ఉపయోగించే భూములను సూచిస్తుంది. సాధారణ పాఠకులకు స్పష్టంగా ఉండే ‘పచ్చికబయళ్లు’ను ఎంచుకున్నాం.
- source_word: דְּבִיר
  choice: దెబీరు
  rationale: స్థలనామాన్ని సాధారణ తెలుగు బైబిలు లిప్యంతరీకరణ శైలికి అనుగుణంగా ఇచ్చాం.
- source_word: וְ/אֶת … אֶת
  choice: జాబితా నిర్మాణం ద్వారా వ్యక్తీకరణ
  rationale: אֶת అనే ప్రత్యక్ష కర్మ సూచికకు తెలుగులో ప్రత్యేక పదం అవసరం లేదు. వావ్ సంధిని తెలుగులో అసహజంగా పదేపదే ‘మరియు’ అని పెట్టకుండా, విరామచిహ్నాలతో సహజమైన జాబితాగా చూపించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి-పట్టణాల జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. మూలంలోని ప్రత్యక్ష కర్మ నిర్మాణాన్ని తెలుగులో ‘ను’ విభక్తితో నిలిపి, పునరుక్త జాబితా లయను కాపాడాం.
