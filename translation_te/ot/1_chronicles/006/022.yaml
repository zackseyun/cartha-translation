lexical_decisions:
- source_word: בֶּן
  choice: కుమారుడు
  rationale: ఈ వంశావళి వరుసలో ప్రత్యక్ష పుత్రసంబంధాన్ని సూచించే సహజమైన, పారదర్శకమైన తెలుగు పదం. వంశావళుల్లో తరాలు కొన్నిసార్లు సంక్షిప్తం కావచ్చుగానీ, ఈ వచనం మాత్రమే విస్తృతార్థమైన ‘వంశస్థుడు’ అనే అనువాదాన్ని కోరదు.
- source_word: תַּחַת
  choice: తహతు
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపానికి దగ్గరగా, తెలుగులో సహజంగా లిప్యంతరీకరించబడింది.
- source_word: אַסִּיר
  choice: అస్సీరు
  rationale: వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణలోని ద్విత్వ వ్యంజనాన్ని, దీర్ఘ స్వరాన్ని తెలుగులో స్పష్టంగా ప్రతిబింబించే లిప్యంతరీకరణ.
- source_word: אֶבְיָסָף
  choice: ఎబ్యాసాపు
  rationale: మసొరా పాఠంలోని స్వరరూపానికి దగ్గరైన తెలుగు లిప్యంతరీకరణ. ‘అబీయాసాపు’ అనే ప్రాచుర్యమైన ప్రత్యామ్నాయ రూపం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: קֹרַח
  choice: కోరహు
  rationale: వ్యక్తి పేరు; హీబ్రూ పేరును తెలుగులో గుర్తించదగిన, సహజమైన రూపంలో లిప్యంతరీకరించబడింది.
