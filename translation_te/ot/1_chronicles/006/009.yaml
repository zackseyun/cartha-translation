source:
  edition: WLC
  text: תַּ֤חַת בְּנ/וֹ֙ אוּרִיאֵ֣ל בְּנ֔/וֹ עֻזִּיָּ֥ה בְנ֖/וֹ וְ/שָׁא֥וּל בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/009.yaml
  text: Tahath his son[a], Uriel his son, Uzziah his son, and Shaul his son.
translation:
  language: te
  text: అతని కుమారుడు తహతు; తహతు కుమారుడు ఊరియేలు; ఊరియేలు కుమారుడు ఉజ్జియా; ఉజ్జియా కుమారుడు షావూలు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: షావూలు అనే హెబ్రీ పేరు సాధారణంగా ‘సౌలు’ అని కూడా వ్రాయబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: తహతు
  rationale: వంశావళిలోని వ్యక్తి పేరు; హెబ్రీ ఉచ్చారణకు దగ్గరగా తెలుగు లిప్యంతరీకరణ చేయబడింది.
- source_word: בְּנוֹ
  choice: కుమారుడు
  rationale: వంశావళుల్లో בֵּן కొన్నిసార్లు ‘వంశస్థుడు’ అనే విస్తృత అర్థంలో ఉండగలిగినా, ఇక్కడ సాధారణ వంశావళి సూత్రాన్ని అనుసరించి ‘కుమారుడు’ అని ఉంచబడింది. తెలుగులో సంబంధాల శ్రేణి స్పష్టంగా, సహజంగా ఉండేందుకు ముందు పేర్కొన్న పేర్లు పునరుక్తం చేయబడ్డాయి.
- source_word: אוּרִיאֵל
  choice: ఊరియేలు
  rationale: హెబ్రీ వ్యక్తి పేరును ఆధునిక తెలుగు బైబిలు పేర్ల శైలికి అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: עֻזִּיָּה
  choice: ఉజ్జియా
  rationale: హెబ్రీ పేరులోని బలమైన జ్ ధ్వనిని ‘జ్జ’తో సూచిస్తూ, తెలుగులో పరిచితమైన రూపాన్ని ఎంచుకున్నాం.
- source_word: וְשָׁאוּל
  choice: షావూలు
  rationale: సంయోజకాన్ని తెలుగు జాబితా నిర్మాణంలో సహజంగా వ్యక్తపరుస్తూ, שָׁאוּל అనే హెబ్రీ ఉచ్చారణకు దగ్గరైన ‘షావూలు’ రూపాన్ని ఉపయోగించాం; పరిచితమైన ‘సౌలు’ రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలి వాడబడింది. హెబ్రీలో వరుసగా వచ్చే ‘అతని కుమారుడు’ అనే నిర్మాణం తెలుగులో ఎవరి కుమారుడో స్పష్టంగా ఉండేందుకు సంబంధిత పేర్లతో విప్పి చెప్పబడింది.
