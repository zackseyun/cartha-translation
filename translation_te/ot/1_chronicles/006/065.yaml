source:
  edition: WLC
  text: וּ/מִ֨/מַּטֵּה גָ֔ד אֶת רָאמ֥וֹת בַּ/גִּלְעָ֖ד וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶֽת מַחֲנַ֖יִם וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/065.yaml
  text: 'And from the tribe of Gad: Ramoth in Gilead with its pasturelands[a], and Mahanaim with its pasturelands.'
translation:
  language: te
  text: గాదు గోత్రం నుండి గిలాదులోని రామోతు, దాని మేతభూములతో పాటు, మహనయీము, దాని మేతభూములతో పాటు, ఇవ్వబడ్డాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రామోత్-గిలాదు,” సంప్రదాయ స్థలనామ రూపం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמַּטֵּה
  choice: గాదు గోత్రం నుండి
  rationale: గోత్రాలకు భూభాగాల కేటాయింపు సందర్భంలో מַטֶּה అంటే ‘గోత్రం’; וּמִ prefixed రూపం సందర్భానుసారంగా ‘నుండి’ అని సహజంగా వ్యక్తమవుతుంది. వాక్యసంధికి తగినట్లు ‘మరియు’ను విడిగా ఉంచలేదు.
- source_word: גָד
  choice: గాదు
  rationale: గోత్రనామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: רָאמוֹת בַּגִּלְעָד
  choice: గిలాదులోని రామోతు
  rationale: בְּ అనే స్థానార్థక ఉపసర్గను స్పష్టంగా నిలుపుతూ, ఆధునిక తెలుగులో సహజమైన ‘గిలాదులోని’ నిర్మాణాన్ని వాడాం.
- source_word: מִגְרָשֶׁיהָ
  choice: దాని పచ్చిక బయళ్లతో సహా
  rationale: లేవీయ పట్టణానికి చెందిన చుట్టుపక్కల బహిరంగ మేతభూములను సూచించే מִגְרָשׁ అర్థాన్ని ఈ సందర్భంలో ‘పచ్చిక బయళ్లు’ స్పష్టంగా తెలియజేస్తుంది; అనుబంధాన్ని ‘తో సహా’ వ్యక్తం చేస్తుంది.
- source_word: מַחֲנַיִם
  choice: మహనయీము
  rationale: స్థలనామాన్ని హెబ్రీ రూపానికి దగ్గరగా, తెలుగులో సులభంగా చదవగల విధంగా లిప్యంతరీకరించాం.
- source_word: וְאֶת
  choice: మహనయీమును
  rationale: וְ జాబితాలో రెండవ ప్రత్యక్ష కర్మను కలుపుతుంది; אֶת కు ప్రత్యేక పదం పెట్టకుండా తెలుగు కర్మవిభక్తి ‘ను’ ద్వారా నిర్మాణాన్ని సహజంగా వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలవచనం ఈ వాక్యంలో క్రియను ఇవ్వకపోయినా, ముందు వచనం నుంచి కొనసాగుతున్న కేటాయింపు భావాన్ని తెలుగులో సంపూర్ణ వాక్యంగా చేయడానికి ‘ఇచ్చారు’ను పూరించాం. స్థలనామాల విషయంలో ప్రాచుర్య రూపాలు మరియు హెబ్రీ ఉచ్చారణ మధ్య సమతుల్యత పాటించాం.
