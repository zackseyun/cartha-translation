id: 1CH.6.55
reference: 1 Chronicles 6:55
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִֽ/מַּחֲצִית֙ מַטֵּ֣ה מְנַשֶּׁ֔ה אֶת עָנֵר֙ וְ/אֶת מִגְרָשֶׁ֔י/הָ וְ/אֶת בִּלְעָ֖ם וְ/אֶת מִגְרָשֶׁ֑י/הָ לְ/מִשְׁפַּ֥חַת לִ/בְנֵי קְהָ֖ת הַ/נּוֹתָרִֽים־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/055.yaml
  text: 'And from the half-tribe of Manasseh: Aner with its pasturelands[a], and Bileam with its pasturelands, for the clan of the remaining sons of Kohath.'
translation:
  language: te
  text: మనష్షే అర్ధగోత్రం నుండి ఆనేరు దాని పచ్చికబయళ్లతో, బిలాము దాని పచ్చికబయళ్లతో—మిగిలిన కెహాతు కుమారుల వంశానికి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִמַּחֲצִית מַטֵּה מְנַשֶּׁה
  choice: మనష్షే అర్ధగోత్రం నుండి
  rationale: మַחֲצִית అంటే ‘సగం’; గోత్ర భూవిభజన సందర్భంలో מַטֶּה అంటే ‘గోత్రం.’ ఆధునిక తెలుగులో ‘అర్ధగోత్రం’ సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: אֶת עָנֵר
  choice: ఆనేరు
  rationale: స్థలనామాన్ని అనువదించకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: מִגְרָשֶׁיהָ
  choice: దాని పచ్చికబయళ్లు
  rationale: లేవీయుల పట్టణాలకు అనుబంధంగా ఉన్న పశువుల మేతభూములను מִגְרָשׁ సూచిస్తుంది; ‘పచ్చికబయళ్లు’ ఈ సందర్భంలో స్పష్టమైన సాధారణ తెలుగు పదం.
- source_word: בִּלְעָם
  choice: బిలాము
  rationale: ఇక్కడి మసొరెటిక్ హీబ్రూ పాఠంలోని పేరును లిప్యంతరీకరించాం; యెహోషువ 21:25లోని సమాంతర పాఠభేదాన్ని పాదసూచికలో నిలిపాం.
- source_word: לְמִשְׁפַּחַת לִבְנֵי קְהָת הַנּוֹתָרִים
  choice: కహాతు మిగిలిన కుమారుల వంశానికి
  rationale: మִשְׁפָּחָה ఏకవచనంలో ఒక కుటుంబ-వంశ సమూహాన్ని సూచిస్తుంది. הַנּוֹתָרִיםను ‘మిగిలిన’గా అనువదించడం, ఇంతవరకు పట్టణాలు కేటాయించబడని కహాతీయ శాఖలను సూచించే మూలపాఠ భావాన్ని కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన జాబితా శైలిని వాడాం. హీబ్రూ వాక్యం ముందరి సందర్భంపై ఆధారపడే జాబితా భాగంగా ఉన్నందున, మూలంలో లేని ‘ఇచ్చారు’ లేదా ‘పట్టణం’ వంటి పదాలను ప్రధాన పాఠంలో చేర్చలేదు. దీర్ఘ విరామచిహ్నం చివరి లబ్ధిదారుల వాక్యభాగాన్ని స్పష్టంగా వేరు చేస్తుంది.
