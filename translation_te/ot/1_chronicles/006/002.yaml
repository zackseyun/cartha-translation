  edition: WLC
  text: וְ/אֵ֛לֶּה שְׁמ֥וֹת בְּֽנֵי גֵרְשׁ֖וֹם לִבְנִ֥י וְ/שִׁמְעִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/002.yaml
  text: 'These are the names of the sons of Gershom: Libni and Shimei[a].'
translation:
  language: te
  text: 'గేర్షోము కుమారుల పేర్లు ఇవి: లిబ్నీ, షిమీ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ హెబ్రీ ప్రతుల్లో గేర్షోము అని ఉంది; సంబంధిత వంశావళి సందర్భాల్లో కొన్ని ఆంగ్ల అనువాద సంప్రదాయాలు గేర్షోను అనే రూపాన్ని ఉపయోగిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ఇవి
  rationale: సంయోజక అవ్యయంతో కూడిన సూచన సర్వనామం పేర్ల జాబితాను పరిచయం చేస్తుంది. తెలుగులో ‘ఇవి’ సహజంగా ఆ ప్రదర్శనార్థక భావాన్ని నిలుపుతుంది; వాక్యారంభంలో ‘మరియు’ అవసరం లేదు.
- source_word: שְׁמוֹת
  choice: పేర్లు
  rationale: שְׁמוֹת בְּנֵי అనే నిర్మాణాన్ని తెలుగులో సహజంగా ‘కుమారుల పేర్లు’ అని అందించవచ్చు.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: వంశావళుల్లో ఈ పదం విస్తృతంగా సంతతివారిని సూచించగలిగినా, ఇక్కడ పేర్కొన్న ఇద్దరూ గేర్షోము ప్రత్యక్ష కుమారులుగా సమర్పించబడ్డారు.
- source_word: גֵרְשׁוֹם
  choice: గేర్షోము
  rationale: ఇక్కడి హెబ్రీ రూపం గేర్షోమ్‌కు అనుగుణంగా ఉంది; తెలుగు బైబిలు పేర్ల శైలికి సరిపోయేలా చివర ‘ము’తో లిప్యంతరీకరించబడింది.
- source_word: לִבְנִי
  choice: లిబ్నీ
  rationale: వ్యక్తినామాన్ని హెబ్రీ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וְשִׁמְעִי
  choice: షిమీ
  rationale: వ్యక్తినామాన్ని హెబ్రీ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం. జాబితాలో సమన్వయాన్ని తెలుగులో విరామచిహ్నం సహజంగా తెలియజేస్తుంది.
