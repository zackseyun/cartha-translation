translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వంశావళి శైలి. మూలంలోని జాబితా నిర్మాణాన్ని సహజ తెలుగు పదక్రమంలో అందించాం; వ్యక్తినామాలను అనువదించకుండా లిప్యంతరీకరించాం.
