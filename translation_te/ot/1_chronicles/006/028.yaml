  register: సంక్షిప్తమైన వంశావళి శైలిని నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా మరియు గౌరవప్రదంగా అనువదించబడింది. హీబ్రూ వాక్యంలోని పునరావృత నిర్మాణాన్ని కాపాడింది.
