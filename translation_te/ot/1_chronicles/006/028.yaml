  text: son of Jahath[a], son of Gershom[b], son of Levi.
translation:
  language: te
  text: యహతు కుమారుడు[a], గేర్షోము కుమారుడు[b], లేవి కుమారుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, వంశావళి భాషలో విస్తృతార్థంగా, “యహతు వంశస్థుడు … గేర్షోము వంశస్థుడు … లేవి వంశస్థుడు.”
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠంలో “గేర్షోము” అని ఉంది; ఇతర వంశావళి సందర్భాల వల్ల కొందరు “గేర్షోను” అని ఊహించవచ్చు, కాని ఇక్కడ మూలపాఠంలోని నామరూపం భిన్నంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశావళి సందర్భంలో בֶּן అనే పదానికి సహజమైన ప్రత్యక్ష అర్థం ‘కుమారుడు’. వంశావళులు కొన్నిసార్లు మధ్య తరాలను వదిలివేయవచ్చు కాబట్టి విస్తృతంగా ‘వంశస్థుడు’ అనే భావం సాధ్యమే; అయితే ప్రధాన పాఠంలో దానిని తప్పనిసరి చేసే సూచన లేదు.
- source_word: יַחַת
  choice: యహతు
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: גֵּרְשֹׁם
  choice: గేర్షోము
  rationale: మూలపాఠంలో ఉన్న రూపం גֵּרְשֹׁם; అందువల్ల దానిని వేరే సందర్భాల్లో కనిపించే ‘గేర్షోను’ రూపంగా మార్చకుండా ‘గేర్షోము’గా ఉంచింది.
- source_word: לֵוִי
  choice: లేవి
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సుపరిచితమైన రూపంలో ఇచ్చింది.
