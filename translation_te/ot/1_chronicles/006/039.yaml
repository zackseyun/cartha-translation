  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ מוֹשְׁבוֹתָ֔/ם לְ/טִירוֹתָ֖/ם בִּ/גְבוּלָ֑/ם לִ/בְנֵ֤י אַהֲרֹן֙ לְ/מִשְׁפַּחַ֣ת הַ/קְּהָתִ֔י כִּ֥י לָ/הֶ֖ם הָיָ֥ה הַ/גּוֹרָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/039.yaml
  text: These were their dwelling places according to their settlements within their territory[a], for the sons of Aaron, of the family of the Kohathites; for the lot was theirs.
translation:
  language: te
  text: 'వారి ప్రాంతంలో వారి స్థావరాల[a] ప్రకారం ఉన్న వారి నివాస స్థలాలు ఇవి: కహాతీయుల వంశానికి చెందిన అహరోను కుమారుల కొరకు; ఎందుకంటే చీటి వారిదే.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి శిబిరాల ప్రకారం’; లేదా, ‘వారి గ్రామాలలో’.
    reason: טִירָה అనే పదం స్థావరం, శిబిరం లేదా గ్రామం అనే భిన్న అర్థాలను ఇవ్వగలదు.
lexical_decisions:
- source_word: מוֹשְׁבוֹתָם
  choice: వారి నివాస స్థలాలు
  rationale: ఈ నామవాచకం నివసించే ప్రదేశాలను సూచిస్తుంది. ‘నివాస స్థలాలు’ ఆధునిక తెలుగులో సహజంగా ఉండి దాని స్పష్టమైన స్థలార్థాన్ని నిలుపుతుంది.
- source_word: לְטִירוֹתָם
  choice: వారి నివాస సముదాయాల ప్రకారం
  rationale: טִירָה అనే పదానికి స్థావరం, శిబిరం, ప్రాకారంగల గ్రామం వంటి అర్థాలు ఉండవచ్చు. భూభాగ కేటాయింపు సందర్భంలో ‘నివాస సముదాయాలు’ అనేది ఒక నిర్దిష్ట రూపానికి పరిమితం చేయకుండా సాధారణ భావాన్ని అందిస్తుంది.
- source_word: בִּגְבוּלָם
  choice: వారి ప్రాంతంలోని
  rationale: גְּבוּל సరిహద్దును లేదా ఆ సరిహద్దులలోని ప్రాంతాన్ని సూచించగలదు. ఇక్కడ నివాస స్థలాలున్న కేటాయిత ప్రాంతమే ఉద్దేశం కాబట్టి ‘వారి ప్రాంతంలోని’ సహజమైన అనువాదం.
- source_word: לִבְנֵי אַהֲרֹן
  choice: అహరోను కుమారులకు
  rationale: మూలంలోని కుటుంబ సంబంధ పదప్రయోగాన్ని నేరుగా నిలుపుతుంది; సందర్భంలో ఇది అహరోను సంతతివారిని సూచిస్తుంది.
- source_word: לְמִשְׁפַּחַת הַקְּהָתִי
  choice: కహాతీయుల వంశానికి చెందిన
  rationale: ఈ పదబంధం అహరోను కుమారుల విస్తృత వంశ అనుబంధాన్ని తెలియజేస్తుంది. ‘వంశం’ ఇక్కడ కుటుంబ లేదా గోత్ర విభాగ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי לָהֶם הָיָה הַגּוֹרָל
  choice: ఎందుకంటే చీటి ద్వారా వచ్చిన వంతు వారిదే
  rationale: హీబ్రూ వాక్యం చీటి వారిదై ఉండిందని చెబుతుంది. ‘చీటి ద్వారా వచ్చిన వంతు’ భూభాగ కేటాయింపు భావాన్ని తెలుగులో స్పష్టం చేస్తూనే చీటి రూపకాన్ని నిలుపుతుంది.
