translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలోని నివాస ప్రదేశాలు, ప్రాంతం, వంశ అనుబంధం, చీటి ద్వారా కేటాయింపు అనే క్రమాన్ని సాధ్యమైనంతవరకు నిలిపాం.
