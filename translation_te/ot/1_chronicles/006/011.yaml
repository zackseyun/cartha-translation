translation:
  language: te
  text: ఎల్కానా అతని కుమారుడు; ఎల్కానా[b]; సోఫై[a] అతని కుమారుడు; మరియు నహతు అతని కుమారుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “జుఫై”; צוֹפַי అనే పేరుకు భిన్నమైన స్వరీకరణ లేదా లిప్యంతరీకరణ సంప్రదాయాన్ని ఇది ప్రతిబింబిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠంలో రెండవ “ఎల్కానా” తరువాత “అతని కుమారుడు” అనే మాట లేదు; అందువల్ల ఈ పేర్ల మధ్య సంబంధం ఇక్కడ స్పష్టంగా చెప్పబడలేదు.
    reason: source_text_ambiguity
lexical_decisions:
- source_word: אֶלְקָנָה
  choice: ఎల్కానా
  rationale: వ్యక్తి పేరును అనువదించకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో ఇచ్చాం; మూలంలో పేరు రెండుసార్లు రావడాన్ని అలాగే నిలిపాం.
- source_word: בְּנוֹ / בנו
  choice: అతని కుమారుడు
  rationale: వంశావళిలోని ‘కుమారుడు + మూడవ పురుష ఏకవచన పురుష ప్రత్యయం’ అనే నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. మూలంలో ఉన్న ప్రతిసారి దీన్ని పునరావృతం చేశాం.
- source_word: צוֹפַי
  choice: జోఫై
  rationale: హీబ్రూ స్వరచిహ్నాలతో ఉన్న రూపాన్ని అనుసరించి వ్యక్తి పేరును తెలుగు లిపిలో ఇచ్చాం; మరో ఉచ్చారణ సంప్రదాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְ
  choice: మరియు
  rationale: చివరి పేరును ముందున్న వంశావళి వరుసతో కలిపే సాధారణ సంధాయకం.
- source_word: נַחַת
  choice: నహతు
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా తెలుగు లిపిలో ఇచ్చాం.
