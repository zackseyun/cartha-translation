source:
  edition: WLC
  text: וּ/מִ/מַּטֵּ֣ה נַפְתָּלִ֗י אֶת קֶ֤דֶשׁ בַּ/גָּלִיל֙ וְ/אֶת מִגְרָשֶׁ֔י/הָ וְ/אֶת חַמּ֖וֹן וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת קִרְיָתַ֖יִם וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/061.yaml
  text: 'And from the tribe of Naphtali: Kedesh in Galilee with its pasturelands[a], Hammon with its pasturelands, and Kiriathaim with its pasturelands.'
translation:
  language: te
  text: 'మరియు నఫ్తాలి గోత్రం నుండి: గలిలయలోని కెదెషును దాని పచ్చికబయళ్లతో సహా[a], హమ్మోనును దాని పచ్చికబయళ్లతో సహా, కిర్యాతయిమును దాని పచ్చికబయళ్లతో సహా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దాని సామూహిక వినియోగ భూములతో సహా’; హీబ్రూ పదం ప్రతి పట్టణానికి చెందిన చుట్టుపక్కల బహిరంగ భూమిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמַּטֵּה נַפְתָּלִי
  choice: నఫ్తాలి గోత్రం నుండి
  rationale: గోత్రాల భూకేటాయింపు సందర్భంలో מַטֶּה అంటే ‘గోత్రం’. ముందున్న וּ־ ఈ వాక్యాన్ని పూర్వ జాబితాతో కలుపుతుంది; తెలుగులో జాబితా కొనసాగింపుతో అది సహజంగానే వ్యక్తమవుతుంది.
- source_word: קֶדֶשׁ בַּגָּלִיל
  choice: గలిలయలోని కెదెషు
  rationale: בַּגָּלִיל ప్రాంత సూచనగా ‘గలిలయలోని’ అని సహజంగా అనువదించబడింది; ఇది అదే పేరుగల ఇతర స్థలాలనుండి కెదెషును వేరుచేస్తుంది.
- source_word: מִגְרָשֶׁיהָ
  choice: దాని పచ్చికబయళ్లు
  rationale: లేవీయుల పట్టణాలకు చెందిన చుట్టుపక్కల బహిరంగ భూమిని సూచించే מִגְרָשׁ కు సందర్భానుకూలంగా ‘పచ్చికబయళ్లు’ ఎంచుకోబడింది. స్త్రీలింగ ఏకవచన ప్రత్యయం ప్రతి పట్టణాన్ని సూచిస్తూ ‘దాని’గా ఇవ్వబడింది.
- source_word: חַמּוֹן
  choice: హమ్మోను
  rationale: హీబ్రూ స్థలనామ ధ్వనిరూపాన్ని ఆధారంగా చేసుకొని తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: קִרְיָתַיִם
  choice: కిర్యాతయిము
  rationale: హీబ్రూ స్థలనామంలోని ధ్వనులను గుర్తించగలిగేలా ఆధునిక తెలుగు రూపంలో లిప్యంతరీకరించబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి-భూకేటాయింపు జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. మూలపాఠంలో క్రియ ప్రత్యక్షంగా లేకపోయినా ముందటి వాక్యాలనుంచి సరఫరా కావడం వల్ల, తెలుగులో వాక్యం సంపూర్ణంగా ఉండేందుకు ‘ఇచ్చారు’ చేర్చబడింది.
