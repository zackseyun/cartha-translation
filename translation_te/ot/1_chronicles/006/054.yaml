translation:
  language: te
  text: అయ్యాలోనును దాని పచ్చిక బయళ్లను, గత్-రిమ్మోనును దాని పచ్చిక బయళ్లను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַיָּלוֹן
  choice: అయ్యాలోను
  rationale: స్థల నామాన్ని అనువదించకుండా, హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: מִגְרָשֶׁיהָ
  choice: దాని పచ్చిక బయళ్లను
  rationale: పట్టణానికి చెందిన చుట్టుపక్కల బహిరంగ ఉమ్మడి భూములను సూచించే పదం; ఈ జాబితా సందర్భంలో సహజమైన ఆధునిక తెలుగు కోసం ‘పచ్చిక బయళ్లు’ ఎంచుకున్నాం, ఇతర భావ ఛాయలను పాదసూచికలో నిలిపాం.
- source_word: גַּת רִמּוֹן
  choice: గత్-రిమ్మోను
  rationale: సంయుక్త స్థల నామాన్ని ఒకే పేరుగా గుర్తించేందుకు హైఫన్‌తో లిప్యంతరీకరించాం.
- source_word: וְאֶת
  choice: -ను ... -ను
  rationale: హీబ్రూలోని సంయోజక అవ్యయం, కర్మ సూచికల పునరావృతాన్ని తెలుగు జాబితా నిర్మాణంలో కర్మ విభక్తి ద్వారా సహజంగా వ్యక్తం చేశాం; ముందటి వాక్యం నుంచి కొనసాగే క్రియను స్పష్టత కోసం పూరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళి/పట్టణాల జాబితాకు తగిన సంక్షిప్త, గౌరవప్రద శైలి. మూల భాగం ముందటి వాక్యంలోని ‘ఇచ్చారు’ అనే క్రియపై ఆధారపడుతున్నందున, స్వతంత్ర వచనంగా చదవడానికి ఆ క్రియను పూరించాం.
