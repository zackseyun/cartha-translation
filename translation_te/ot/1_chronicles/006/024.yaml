- from: అతని సహోదరుడు ఆసాఫు అతని కుడివైపున[a] నిలిచాడు. ఆసాఫు బెరెక్యాహు కుమారుడు; బెరెక్యాహు షిమ్యా కుమారుడు.
  to: మరియు అతని సహోదరుడైన ఆసాఫు అతని కుడివైపున[a] నిలిచాడు; ఆసాఫు బెరెక్యాహు కుమారుడు, బెరెక్యాహు షిమ్యా కుమారుడు.
