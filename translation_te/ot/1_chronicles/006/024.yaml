id: 1CH.6.24
reference: 1 Chronicles 6:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אָחִ֣י/ו אָסָ֔ף הָ/עֹמֵ֖ד עַל יְמִינ֑/וֹ אָסָ֥ף בֶּן בֶּרֶכְיָ֖הוּ בֶּן שִׁמְעָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/024.yaml
  text: 'And his brother Asaph stood at his right hand: Asaph son of Berechiah[a], son of Shimea.'
translation:
  language: te
  text: మరియు అతని సహోదరుడైన ఆసాఫు అతని కుడివైపున[a] నిలిచాడు; ఆసాఫు బెరెక్యాహు కుమారుడు, బెరెక్యాహు షిమ్యా కుమారుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని కుడిపక్కన.’ అక్షరార్థంగా, ‘అతని కుడిచేతి వద్ద’; ఈ హీబ్రూ ప్రయోగం ఒకరి కుడివైపున ఉన్న స్థానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָחִיו
  choice: అతని సహోదరుడు
  rationale: וְ అనేది సాధారణ సంధానార్థక పదం; אָחִיו సాధారణంగా ‘అతని సహోదరుడు’ అని అర్థం. సందర్భం బలవంతం చేయనందున విస్తృతార్థమైన ‘బంధువు’ను ఎంచుకోలేదు.
- source_word: אָסָף
  choice: ఆసాఫు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా, తెలుగులో సహజంగా లిప్యంతరీకరించాం. మూలంలో రెండుసార్లు ఉన్న పేరును రెండుసార్లూ ఉంచాం.
- source_word: הָעֹמֵד
  choice: నిలిచాడు
  rationale: ఇది עמד ధాతువు యొక్క వర్తమాన కృదంత రూపం, అక్షరార్థంగా ‘నిలుస్తున్నవాడు.’ ఈ వంశావళి-సేవా సందర్భంలో సహజమైన తెలుగు వాక్యనిర్మాణం కోసం ‘నిలిచాడు’ అని ఇచ్చాం.
- source_word: עַל יְמִינוֹ
  choice: అతని కుడివైపున
  rationale: ఈ హీబ్రూ పదబంధం ఒకరి కుడిపక్కన ఉన్న స్థానాన్ని సూచిస్తుంది. ‘అతని కుడివైపున’ అనేది స్థలార్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: హీబ్రూ వంశావళి సూత్రాన్ని నిలుపుతూ రెండుసార్లూ ‘కుమారుడు’ అని అనువదించాం.
- source_word: בֶּרֶכְיָהוּ
  choice: బెరెక్యాహు
  rationale: హీబ్రూ వ్యక్తి పేరును దాని చివరి -యాహు అంశంతో సహా తెలుగులో లిప్యంతరీకరించాం.
- source_word: שִׁמְעָא
  choice: షిమ్యా
  rationale: హీబ్రూ వ్యక్తి పేరుకు దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణను ఉపయోగించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణాన్ని ఉపయోగించాం. వంశావళి సంబంధాన్ని స్పష్టంగా చూపేందుకు రెండో వాక్యంలో ‘బెరెక్యాహు’ పేరును మళ్లీ పలికాం; ఇది హీబ్రూ ‘కుమారుడు… కుమారుడు…’ నిర్మాణంలోని సంబంధాన్ని తెలుగులో సందిగ్ధత లేకుండా తెలియజేస్తుంది.
