  text: 'And the sons of Elkanah: Amasai and Ahimoth[a].'
translation:
  language: te
  text: 'ఎల్కానా కుమారులు: అమసై మరియు అహీమోతు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: కుమారులు
  rationale: వంశావళి జాబితాలో సహజమైన తెలుగు శైలిని అనుసరించి בְנֵי అనే నిర్మాణాన్ని ‘కుమారులు’గా అనువదించాం. హీబ్రూ ו వరుసను కొనసాగిస్తుంది; తెలుగులో ఈ సంక్షిప్త జాబితాలో దానిని విడిగా ‘మరియు’ అని పలకకపోవడం సహజం.
- source_word: אֶלְקָנָה
  choice: ఎల్కానా
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: עֲמָשַׂי
  choice: అమాశై
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం; ఆంగ్ల అక్షరక్రమ భేదాన్ని తెలుగు పాఠంలోకి దిగుమతి చేయలేదు.
- source_word: וַ/אֲחִימוֹת
  choice: అహీమోతు
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం. ఇద్దరు కుమారుల సంక్షిప్త జాబితాలో తెలుగుకు సహజంగా కామాతో అనుసంధానించాం.
