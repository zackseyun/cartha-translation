translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలిని వాడాం. ‘పితృగృహాలు’ కొంత సాంప్రదాయ వంశావళి పదమైనా సందర్భార్థాన్ని ఖచ్చితంగా ఉంచుతుంది; దాని భావాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
