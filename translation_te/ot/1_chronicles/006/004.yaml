source:
  edition: WLC
  text: בְּנֵ֥י מְרָרִ֖י מַחְלִ֣י וּ/מֻשִׁ֑י וְ/אֵ֛לֶּה מִשְׁפְּח֥וֹת הַ/לֵּוִ֖י לַ/אֲבוֹתֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/004.yaml
  text: 'The sons of Merari: Mahli and Mushi[b][a]. These were the clans of the Levites according to their fathers’ houses.'
translation:
  language: te
  text: 'మెరారీ కుమారులు: మహ్లీ, మూషీ. తమ పితృగృహాల[a] ప్రకారం లేవీయుల వంశాలు[b] ఇవే.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ అక్షరార్థం ‘వారి తండ్రుల ప్రకారం’; ఈ వంశావళి సందర్భంలో తండ్రి వైపు పూర్విక గృహాల ఆధారంగా చేసిన వర్గీకరణ అని భావం.
    reason: cultural_note
  - marker: b
    text: లేదా ‘కుటుంబాలు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  choice: మెరారి కుమారులు
  rationale: בן యొక్క నిర్మాణ బహువచనం వంశావళి జాబితాను పరిచయం చేస్తోంది. ఇక్కడ వెంటనే పేరుపేరున కుమారులు ఇవ్వబడినందున విస్తృతార్థమున్న ‘సంతతి’ కంటే ‘కుమారులు’ సరైనది.
- source_word: מַחְלִי וּמֻשִׁי
  choice: మహలి, మూషి
  rationale: వ్యక్తుల పేర్లను హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో ఇచ్చాం; తెలుగు జాబితా శైలిలో సంయోజకాన్ని కామాతో సహజంగా వ్యక్తం చేశాం.
- source_word: מִשְׁפְּחוֹת
  choice: వంశాలు
  rationale: ఇది కేవలం ఒకే ఇంటిలోని కుటుంబాలను కాక, వంశపారంపర్య బంధంతో ఏర్పడిన విస్తృత బంధుత్వ సమూహాలను సూచిస్తుంది. అందువల్ల ‘వంశాలు’ సహజమైన ఎంపిక; ‘కుటుంబాలు’ కూడా సాధ్యమేనని పాదసూచికలో తెలిపాం.
- source_word: הַלֵּוִי
  choice: లేవీయుల
  rationale: హీబ్రూలో ఏకవచన జాతివాచక రూపం ఉన్నప్పటికీ సందర్భంలో లేవి గోత్రానికి చెందిన సమూహాలన్నిటినీ సమష్టిగా సూచిస్తుంది. ఆధునిక తెలుగులో ‘లేవీయుల’ అని చెప్పడం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: לַאֲבוֹתֵיהֶם
  choice: తమ పితృగృహాల ప్రకారం
  rationale: అక్షరార్థంగా ‘వారి తండ్రుల ప్రకారం.’ వంశావళి సందర్భంలో ఇది తండ్రి వైపు పూర్విక గృహాల ఆధారంగా చేసిన వర్గీకరణను సూచిస్తుంది; ఆ భావాన్ని తెలుగు వంశావళి రీతిలో ‘పితృగృహాలు’ అని వ్యక్తం చేశాం.
- source_word: וְאֵלֶּה
  choice: ఇవే
  rationale: సారాంశాన్ని సూచించే బహువచన నిర్దేశకాన్ని తెలుగు వాక్యాంతంలో సహజంగా ఉంచాం. ‘ఏ’ అవధారణ ఈ జాబితా సారాంశ స్వభావాన్ని తెలియజేస్తుంది; హీబ్రూ సంయోజకాన్ని విడిగా అనువదించడం తెలుగులో అవసరం లేదు.
