  text: and Hukok with its pasturelands[a], and Rehob with its pasturelands.
translation:
  language: te
  text: మరియు హుక్కోకును[a] దాని పచ్చిక భూములతో, రెహోబును దాని పచ్చిక భూములతో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘హుక్కోకు’ అని ఉంది. యెహోషువ 21:31లోని సమాంతర జాబితాలో ‘హెల్కాతు’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: חוּקֹק
  choice: హుక్కోకు
  rationale: మసొరేటిక్ పాఠంలో ఉన్న స్థలనామాన్ని ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం; సమాంతర పాఠంలోని ‘హెల్కాతు’ను ప్రధాన పాఠంలోకి తీసుకురాలేదు.
- source_word: מִגְרָשֶׁיהָ
  choice: దాని పచ్చిక భూములతో సహా
  rationale: పట్టణానికి చెందిన, ముఖ్యంగా పశువుల మేతకు ఉపయోగించే బహిరంగ భూములను సూచిస్తుంది. జాబితా సందర్భంలో పట్టణంతో పాటు ఆ భూములు కూడా ఇవ్వబడ్డాయనే సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: רְחֹב
  choice: రెహోబు
  rationale: హీబ్రూ స్థలనామాన్ని తెలుగు ధ్వని విధానానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וְאֶת
  choice: మరియు …ను
  rationale: సంయోజక అవ్యయంతో కూడిన ప్రత్యక్ష కర్మ సూచనను తెలుగు జాబితా నిర్మాణంలో ‘మరియు’ మరియు ద్వితీయావిభక్తి ‘ను’ ద్వారా వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, లేవీయ పట్టణాల జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని జాబితా-సంబంధాన్ని నిలుపుతూ, తెలుగులో వాక్యం సంపూర్ణంగా ఉండేందుకు సందర్భానుసారంగా ‘ఇచ్చారు’ను స్పష్టంగా చేర్చాం.
