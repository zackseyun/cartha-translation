source:
  edition: WLC
  text: וּ/מִֽ/מִּשְׁפְּח֖וֹת בְּנֵ֣י קְהָ֑ת וַ/יְהִי֙ עָרֵ֣י גְבוּלָ֔/ם מִ/מַּטֵּ֖ה אֶפְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/051.yaml
  text: And from the families of the sons of Kohath[b][a], the cities of their territory were from the tribe of Ephraim.
translation:
  language: te
  text: కహాతు కుమారుల కుటుంబాలకు వారి ప్రాంతపు పట్టణాలు[a] ఎఫ్రాయిము గోత్రం నుండి లభించాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి సరిహద్దు పట్టణాలు.’ హెబ్రీ పదం גְּבוּל ‘సరిహద్దు,’ ‘హద్దు,’ లేదా ‘ప్రాంతం’ అని అర్థమివ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמִּשְׁפְּחוֹת
  choice: వంశాలలోని వారికి
  rationale: מִשְׁפָּחוֹת అనేది కుటుంబ సమూహాలు లేదా వంశాలను సూచిస్తుంది; מִן యొక్క భాగార్థాన్ని సహజమైన తెలుగులో తెలియజేయడానికి ‘వంశాలలోని వారికి’ అని అనువదించబడింది. וְ జాబితా కొనసాగింపును సూచిస్తున్నా, విడిగా ‘మరియు’ చేర్చడం తెలుగులో భారంగా ఉండేందున వాక్యప్రవాహంలో అంతర్లీనంగా ఉంచబడింది.
- source_word: בְּנֵי קְהָת
  choice: కహాతు కుమారులు
  rationale: మూలంలోని ‘కహాతు కుమారులు’ అనే వంశావళి రూపాన్ని నిలుపుకుంది; సందర్భంలో ఇది కహాతు సంతతివారిని సూచిస్తుంది.
- source_word: וַיְהִי
  choice: లభించాయి
  rationale: పట్టణాల కేటాయింపు సందర్భంలో సాధారణ సంబంధక్రియను సహజమైన తెలుగులో ‘లభించాయి’గా వ్యక్తం చేశాం; ఇది కేటాయింపు భావాన్ని స్పష్టం చేస్తుంది గాని ఎవరు ఇచ్చారో మూలంలో లేని కర్తను చేర్చదు.
- source_word: עָרֵי גְבוּלָם
  choice: వారి ప్రాంతపు పట్టణాలు
  rationale: גְבוּל అనేది సరిహద్దు, హద్దు లేదా ప్రాంతాన్ని సూచించగలదు. ఇక్కడ లేవీయ పట్టణాల భూకేటాయింపు సందర్భం వల్ల ‘ప్రాంతం’ ప్రధాన పాఠ్యంలో సహజంగా సరిపోతుంది; ‘సరిహద్దు పట్టణాలు’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: מִמַּטֵּה אֶפְרָיִם
  choice: ఎఫ్రాయిము గోత్రం నుండి
  rationale: గోత్రాల భూకేటాయింపు సందర్భంలో מַטֶּהకు ‘గోత్రం’ సరైన అర్థం; מִן‌ను ‘నుండి’గా నిలుపుకున్నాం.
