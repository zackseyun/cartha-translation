translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలి ఉపయోగించబడింది. ‘కుమారులు’ అనే హెబ్రీ వంశావళి నుడికారాన్ని నిలుపుతూ, వాక్య సంబంధం సహజంగా ఉండేందుకు ‘వంశాలలోని వారికి’ మరియు ‘లభించాయి’ ఉపయోగించబడ్డాయి.
