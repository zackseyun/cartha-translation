  to: కహాతు కుమారుల కుటుంబాలకు వారి ప్రాంతపు పట్టణాలు[a] ఎఫ్రాయిము గోత్రం నుండి లభించాయి.
  rationale: The revision replaces the indirect ‘వంశాలలోని వారికి’ with ‘కహాతు కుమారుల కుటుంబాలకు,’ preserving the family-group reference while expressing naturally in Telugu the allocation relationship implicit in the Hebrew list. The territorial reading of גְּבוּל remains in the text, and its border-related alternative remains anchored in a footnote. No theological interpretation has been added.
