  yaml_path: translation/ot/1_chronicles/006/041.yaml
  text: But the fields of the city and its pasturelands they gave to Caleb son of Jephunneh[a].
translation:
  language: te
  text: అయితే ఆ పట్టణపు పొలాలను, దాని చుట్టుపక్కల గ్రామాలను[a] యెఫున్నె కుమారుడైన కాలేబుకు ఇచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దాని నివాస ప్రాంతాలను’; లేదా ‘దానికి అనుబంధమైన భూములను.’ హీబ్రూ పదం పట్టణానికి అనుబంధంగా ఉన్న గ్రామాలు, నివాస ప్రాంతాలు లేదా పరిసర భూములను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֵה הָעִיר
  choice: ఆ పట్టణపు పొలాలను
  rationale: שָׂדֶה ఇక్కడ పట్టణానికి సంబంధించిన పొలాలు లేదా సాగుభూమిని సూచించే సమష్టి పదం. సహజమైన ఆధునిక తెలుగులో ‘పొలాలు’ అని బహువచనంగా అనువదించడం భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: חֲצֵרֶיהָ
  choice: దాని చుట్టుపక్కల గ్రామాలను
  rationale: חָצֵר అనే పదం ఈ భూవిభజన సందర్భంలో పట్టణానికి అనుబంధంగా ఉన్న గ్రామాలు లేదా నివాస ప్రాంతాలను సూచించగలదు. ‘చుట్టుపక్కల గ్రామాలు’ సందర్భానికి సహజంగా సరిపోతుంది; అనుబంధ భూములు అనే అర్థసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: נָתְנוּ
  choice: ఇచ్చారు
  rationale: נתן అనే క్రియ యొక్క సాధారణ అర్థమైన ‘ఇచ్చారు’ను నిలుపుతుంది; ‘కేటాయించారు’ వంటి మరింత వ్యాఖ్యాత్మక పదాన్ని చేర్చదు.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: యెఫున్నె కుమారుడైన కాలేబుకు
  rationale: לְ పరోక్ష కర్మను సూచిస్తుంది. వ్యక్తుల పేర్లను తెలుగులో సహజంగా లిప్యంతరీకరించాం.
- source_word: וְאֶת ... וְאֶת
  choice: అయితే ... , ...
  rationale: 'మొదటి וְ మునుపటి వాక్యంతో ఉన్న వ్యత్యాసాన్ని సూచిస్తుంది: పట్టణం ఒక వర్గానికి దక్కగా, దానికి సంబంధించిన పొలాలు మరియు గ్రామాలు కాలేబుకు ఇచ్చారు. తెలుగులో ‘అయితే’ ఈ సంబంధాన్ని సహజంగా తెలియజేస్తుంది; రెండో וְ జాబితాలో విరామచిహ్నంతో వ్యక్తమైంది.'
