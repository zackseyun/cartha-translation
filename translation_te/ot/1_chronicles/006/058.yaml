  terminology: ‘రామోతు,’ ‘ఆనేము’ స్థలనామాల లిప్యంతరీకరణలు ఆమోదయోగ్యమైనవి. מִגְרָשֶׁיהָకు ‘దాని పచ్చికబయళ్లతో సహా’ సందర్భానుకూలమైన అనువాదం. పాదసూచికను ఆనేము వద్దే గుర్తించడం పాఠభేద సూచనకు స్పష్టత ఇస్తుంది.
