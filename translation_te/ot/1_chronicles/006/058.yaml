lexical_decisions:
- source_word: רָאמוֹת
  choice: రామోతు
  rationale: స్థల నామాన్ని అనువదించకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: מִגְרָשֶׁיהָ
  choice: దాని పచ్చికబయళ్లతో సహా
  rationale: లేవీయుల పట్టణాల సందర్భంలో పట్టణానికి చెందిన చుట్టుపక్కల బహిరంగ భూములను, ముఖ్యంగా పశువులు మేపే భూములను, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עָנֵם
  choice: ఆనేము
  rationale: మసొరెటిక్ పాఠంలోని స్థల నామాన్ని లిప్యంతరీకరించాం; సమాంతర పాఠంలోని భిన్న నామాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְאֶת
  choice: ను … సహా
  rationale: וְ అనే సంధిని జాబితా నిర్మాణంలో తెలుగుకు సహజంగా వ్యక్తం చేసి, את అనే కర్మసూచకాన్ని తెలుగు ద్వితీయావిభక్తి ద్వారా సూచించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి-పట్టణాల జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలిని వాడాం. సందర్భం నుంచి వచ్చిన ‘ఇచ్చారు’ అనే క్రియను వాక్యం సహజంగా ఉండేందుకు సరఫరా చేశాం.
