source:
  edition: WLC
  text: וְ/אֵ֗לֶּה אֲשֶׁ֨ר הֶעֱמִ֥יד דָּוִ֛יד עַל יְדֵי שִׁ֖יר בֵּ֣ית יְהוָ֑ה מִ/מְּנ֖וֹחַ הָ/אָרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/016.yaml
  text: These are the men whom David appointed over the service of song in the house of Yahweh[b][a], after the ark came to rest.
translation:
  language: te
  text: మందసం విశ్రాంతి పొందినప్పటి నుండి[b], యహ్వే మందిరంలో గానసేవ బాధ్యతను నిర్వహించడానికి[a] దావీదు నియమించినవారు వీరే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గానం చేయడానికి” లేదా “గానసేవకు బాధ్యులుగా.” హెబ్రీ పదబంధం పవిత్రస్థలంలోని సంగీత ఆరాధన బాధ్యతను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మందసం విశ్రాంతి పొందిన తరువాత.” అక్షరార్థంగా, “మందసం విశ్రాంతి పొందినప్పటి నుండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה אֲשֶׁר
  choice: నియమించినవారు వీరే
  rationale: తదుపరి వచ్చే వ్యక్తుల జాబితాను పరిచయం చేసే హెబ్రీ నిర్మాణాన్ని సహజమైన తెలుగు వాక్యక్రమంలో అందిస్తుంది. సందర్భం వల్ల పురుషులే సూచించబడుతున్నా, మూలంలో లేని ‘మనుషులు’ అనే పదాన్ని చేర్చలేదు.
- source_word: הֶעֱמִיד דָּוִיד
  choice: దావీదు నియమించిన
  rationale: עמד హిఫిల్ రూపం ఇక్కడ కేవలం నిలబెట్టడాన్ని కాక, ఒక అధికారిక సేవాబాధ్యతలో ఉంచడాన్ని సూచిస్తుంది; అందువల్ల ‘నియమించిన’ అనేది సందర్భోచితం.
- source_word: עַל יְדֵי שִׁיר
  choice: గానసేవ బాధ్యతపై
  rationale: ఈ పదబంధం గానం చేయడమే కాక దానికి సంబంధించిన బాధ్యత లేదా పర్యవేక్షణను సూచిస్తుంది. ‘గానసేవ’ ఆరాధనా సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בֵּית יְהוָה
  choice: యహ్వే మందిరంలోని
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా ఇక్కడ పవిత్రస్థలాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మందిరం’ సహజంగా, గౌరవప్రదంగా ఉంటుంది. יהוה అనే దైవనామాన్ని ‘యహ్వే’గా లిప్యంతరీకరించాం.
- source_word: מִמְּנוֹחַ הָאָרוֹן
  choice: మందసం విశ్రాంతి పొందిన తరువాత
  rationale: מִן + מְנוֹחַ నిర్మాణం మందసం స్థిరమైన విశ్రాంతి స్థలానికి చేరిన కాలాన్ని ఆరంభబిందువుగా సూచిస్తుంది. తెలుగులో ‘విశ్రాంతి పొందిన తరువాత’ ఆ కాలసంబంధ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: הָאָרוֹן
  choice: మందసం
  rationale: మూలంలో ‘మందసం’ మాత్రమే ఉంది; ‘నిబంధన మందసం’ అని విస్తరించడం ఈ వచనంలో లేని సమాచారాన్ని చేర్చుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో నేరుగా ఉన్న నాలుగు అక్షరాల దైవనామాన్ని బిరుదుగా మార్చకుండా, దాని సాధారణ పండితీయ ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
- issue: మందసం ‘విశ్రాంతి పొందడం’ అనే భావం
  choice: విశ్రాంతి పొందిన తరువాత
  alternative: మందసం నిలిపిన తరువాత
  rationale: מְנוֹחַలోని ‘విశ్రాంతి’ రూపకాన్ని నిలుపుతూ, అది స్థిరస్థానానికి చేరడాన్ని సూచిస్తుందనే సందర్భార్థాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘గానసేవ’ ఆరాధనా సందర్భాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; ‘బాధ్యతపై’ పరిపాలనా భావాన్ని నిలుపుతుంది. వాక్యక్రమాన్ని తెలుగు సహజత్వానికి అనుగుణంగా మార్చినా, మూలంలోని కాలసంబంధం మరియు జాబితా పరిచయ నిర్మాణం నిలుపబడ్డాయి.
