id: 1CH.10.4
reference: 1 Chronicles 10:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁאוּל֩ אֶל נֹשֵׂ֨א כֵלָ֜י/ו שְׁלֹ֥ף חַרְבְּ/ךָ֣ וְ/דָקְרֵ֣/נִי בָ֗/הּ פֶּן יָבֹ֜אוּ הָ/עֲרֵלִ֤ים הָ/אֵ֨לֶּה֙ וְ/הִתְעַלְּלוּ בִ֔/י וְ/לֹ֤א אָבָה֙ נֹשֵׂ֣א כֵלָ֔י/ו כִּ֥י יָרֵ֖א מְאֹ֑ד וַ/יִּקַּ֤ח שָׁאוּל֙ אֶת הַ/חֶ֔רֶב וַ/יִּפֹּ֖ל עָלֶֽי/הָ־׀־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/004.yaml
  text: Then Saul said to his armor-bearer[a], “Draw your sword and thrust me through with it, lest these uncircumcised men come and mistreat me.” But his armor-bearer was not willing, because he was very afraid[c][b]. So Saul took the sword and fell on it.
translation:
  language: te
  text: అప్పుడు సౌలు తన ఆయుధాలు మోసేవానితో, “నీ కత్తిని ఒర నుండి బయటకు తీసి, దానితో నన్ను పొడువు; లేకపోతే ఈ సున్నతి లేనివారు వచ్చి నాతో దుర్వ్యవహారం చేస్తారు[a]” అన్నాడు. అయితే అతని ఆయుధాలు మోసేవాడు ఎంతో భయపడినందున అలా చేయడానికి ఒప్పుకోలేదు. కాబట్టి సౌలు ఆ కత్తిని తీసుకొని దానిమీద పడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నన్ను అవమానిస్తారు,” “నాతో ఆటలాడుతారు,” లేదా “నాతో నీచంగా వ్యవహరిస్తారు.”
    reason: వְהִתְעַלְּלוּ בִי అవమానకరమైన, దుర్వ్యవహారపూర్వకమైన ప్రవర్తనను సూచిస్తుంది; దాని ఖచ్చిత రూపాన్ని మూలపాఠం నిర్దేశించదు.
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: తన ఆయుధాలు మోసేవాడు
  rationale: హీబ్రూ పదబంధం అతని సామగ్రి లేదా ఆయుధాలను మోసే వ్యక్తిని సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు సహజంగా, స్పష్టంగా ఉండే వివరణాత్మక రూపం.
- source_word: שְׁלֹף חַרְבְּךָ
  choice: నీ కత్తిని దూసి
  rationale: కత్తిని ఒర నుంచి బయటకు తీయడాన్ని సందర్భానుకూలంగా సూచిస్తుంది.
- source_word: וְדָקְרֵנִי בָהּ
  choice: దానితో నన్ను పొడిచి చంపు
  rationale: דקר ఆయుధంతో పొడవడం లేదా దూసుకుపోయేలా గుచ్చడాన్ని సూచిస్తుంది; ఈ సందర్భంలో ప్రాణాంతక ఉద్దేశం స్పష్టమైనందున సహజమైన తెలుగులో ఇలా అనువదించబడింది.
- source_word: פֶּן
  choice: లేకపోతే
  rationale: సౌలు భయపడుతున్న పరిణామాన్ని తెలుగులో సహజంగా పరిచయం చేస్తుంది.
- source_word: הָעֲרֵלִים הָאֵלֶּה
  choice: సున్నతి లేని వీరు
  rationale: మూలంలోని జాతి-మత సంబంధమైన నిందార్థక వర్ణనను ‘ఫిలిష్తీయులు’ అని సందర్భం నుంచి చేర్చకుండా నిలుపుతుంది.
- source_word: וְהִתְעַלְּלוּ בִי
  choice: నన్ను అవమానకరంగా హింసిస్తారు
  rationale: ఈ క్రియ అవమానంతో కూడిన క్రూరమైన దుర్వ్యవహారాన్ని సూచిస్తుంది; దాని నిర్దిష్ట రూపాన్ని నిర్ణయించకుండా రెండు భావాంశాలనూ వ్యక్తం చేస్తుంది.
- source_word: וְלֹא אָבָה
  choice: అలా చేయడానికి ఒప్పుకోలేదు
  rationale: చేయడానికి సమ్మతించకపోవడం అనే మూల భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: כִּי יָרֵא מְאֹד
  choice: ఎంతో భయపడినందున
  rationale: అతని నిరాకరణకు మూలపాఠం తెలిపే కారణాన్నీ భయ తీవ్రతనూ నిలుపుతుంది.
- source_word: וַיִּפֹּל עָלֶיהָ
  choice: దానిమీద పడ్డాడు
  rationale: ‘దానిపై పడ్డాడు’ అనే హీబ్రూ వాక్యాన్ని ప్రత్యక్షంగా అనువదిస్తూ, అనవసర వివరణను జోడించదు.
theological_decisions:
- issue: ఫిలిష్తీయుల చేత సౌలు భయపడిన వ్యవహారాన్ని ఎలా అనువదించాలి
  choice: నన్ను అవమానకరంగా హింసిస్తారు
  alternative: నన్ను అవమానిస్తారు; నాతో ఆటలాడుతారు; నన్ను దుర్వినియోగం చేస్తారు
  rationale: హీబ్రూ పదం అవమానకరమైన, బహుశా హింసాత్మకమైన దుర్వ్యవహారాన్ని సూచించినా దాని ఖచ్చిత రూపాన్ని చెప్పదు. ఎంపిక చేసిన రూపం ఆ తీవ్రతను నిలుపుతూ అనవసర నిర్దిష్టతను నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సైనిక సందర్భం, తీవ్రత, మరియు దుర్వ్యవహార స్వరూపంలోని అస్పష్టత కాపాడబడ్డాయి.
