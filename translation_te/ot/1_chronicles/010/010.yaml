translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. హీబ్రూ పదాల విస్తృతార్థాన్ని అవసరమైన చోట పాదటిప్పణుల్లో నిలిపాం; ‘యుద్ధ సామగ్రి’ ద్వారా ఆయుధాలు–కవచం మధ్య అనవసరమైన సంకుచిత నిర్ణయాన్ని నివారించాం.
