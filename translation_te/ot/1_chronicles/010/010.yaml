  yaml_path: translation/ot/1_chronicles/010/010.yaml
  text: They put his armor in the house of their gods[b][a], and they fastened his skull in the house of Dagon.
translation:
  language: te
  text: వారు అతని యుద్ధ సామగ్రిని తమ దేవుళ్ల మందిరంలో[a] ఉంచారు; అతని కపాలాన్ని[b] దాగోను మందిరంలో బిగించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘తమ దేవుళ్ల ఇంటిలో.’ ఇక్కడ ‘ఇల్లు’ అనే హీబ్రూ పదం దేవతల ఆలయాన్ని లేదా మందిరాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అతని తలను.’ హీబ్రూ పదం కపాలాన్ని లేదా తలను సూచించగలదు; ఇక్కడ ‘కపాలం’ మరింత నిర్దిష్టమైన అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: ఉంచారు
  rationale: שׂים అనే క్రియకు ‘పెట్టు/ఉంచు’ అనే సాధారణ అర్థం ఉంది; ఈ సందర్భంలో ‘ఉంచారు’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: כֵּלָיו
  choice: అతని యుద్ధ సామగ్రిని
  rationale: כְּלִי అనే పదం వస్తువులు, పరికరాలు, ఆయుధాలు లేదా యుద్ధ సామగ్రిని సూచించగలదు. సౌలు యుద్ధంలో మరణించి దోచబడిన సందర్భంలో ‘యుద్ధ సామగ్రి’ ఆయుధాలకే పరిమితం కాకుండా కవచాన్ని కూడా కలుపుకునే సముచితమైన అనువాదం.
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: తమ దేవుళ్ల మందిరంలో
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’; దేవతారాధన సందర్భంలో ఆలయం లేదా మందిరాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘మందిరం’ ఉద్దేశించిన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: גֻּלְגָּלְתּוֹ
  choice: అతని కపాలాన్ని
  rationale: גֻּלְגֹּלֶת తల లేదా కపాలాన్ని సూచించగలదు; ఇక్కడ ‘కపాలం’ ఆ నామవాచకానికి మరింత నిర్దిష్టమైన సమానార్థకం.
- source_word: תָקְעוּ
  choice: బిగించారు
  rationale: תקע దించడం, గుచ్చడం, స్థిరపరచడం లేదా బిగించడం అనే భావాలు కలిగి ఉంటుంది. ప్రదర్శనార్థం అవశేషాన్ని అమర్చిన ఈ సందర్భంలో ‘బిగించారు’ అనిశ్చితమైన విధానాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: בֵּית דָּגוֹן
  choice: దాగోను మందిరంలో
  rationale: దేవుని పేరైన דָּגוֹן ను ‘దాగోను’గా లిప్యంతరీకరించాం; cultic בֵּית ను సహజ తెలుగులో ‘మందిరం’గా ఇచ్చాం.
