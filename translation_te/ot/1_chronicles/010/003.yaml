source:
  edition: WLC
  text: וַ/תִּכְבַּ֤ד הַ/מִּלְחָמָה֙ עַל שָׁא֔וּל וַ/יִּמְצָאֻ֖/הוּ הַ/מּוֹרִ֣ים בַּ/קָּ֑שֶׁת וַ/יָּ֖חֶל מִן הַ/יּוֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/003.yaml
  text: The battle grew heavy against Saul, and the archers found him, and he was badly wounded by the archers.
translation:
  language: te
  text: సౌలుకు వ్యతిరేకంగా యుద్ధం తీవ్రమైంది. విలుకాండ్రు అతన్ని కనుగొన్నారు; విలుకాండ్రిచేత అతడు గాయపడ్డాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విలుకాండ్రివల్ల అతడు తీవ్రంగా కలత చెందాడు.” హీబ్రూ క్రియను శారీరకంగా గాయపడటం అని గానీ, విలుకాండ్రివల్ల తీవ్రమైన వేదన లేదా కలత చెందటం అని గానీ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְבַּד
  choice: తీవ్రమైంది
  rationale: כבד అనే క్రియ అక్షరార్థంగా ‘బరువైంది’ అని ఉన్నా, యుద్ధ సందర్భంలో పోరు తీవ్రం కావడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘తీవ్రమైంది’ సహజంగా అర్థాన్ని అందిస్తుంది.
- source_word: הַמִּלְחָמָה עַל שָׁאוּל
  choice: సౌలుకు వ్యతిరేకంగా యుద్ధం
  rationale: עַל ఇక్కడ శత్రుత్వ భావంతో ‘వ్యతిరేకంగా’ అని అనువదించబడింది; מִלְחָמָהకు ‘యుద్ధం’ సూటియైన పదం.
- source_word: וַיִּמְצָאֻהוּ
  choice: అతన్ని చేరుకున్నారు
  rationale: מצא సాధారణంగా ‘కనుగొన్నారు’ అని అర్థమైనా, ఈ సైనిక సందర్భంలో విలుకాండ్రు సౌలును చేరుకోవడం లేదా పట్టుకోవడం అనే భావం ఉంది; ‘చేరుకున్నారు’ తెలుగులో సహజంగా ఉంటుంది.
- source_word: הַמּוֹרִים בַּקָּשֶׁת
  choice: విలుకాండ్రు
  rationale: ఈ పదబంధం అక్షరార్థంగా ‘విల్లుతో బాణాలు వేసేవారు’; ‘విలుకాండ్రు’ సంక్షిప్తమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: וַיָּחֶל
  choice: తీవ్ర వేదనకు గురయ్యాడు
  rationale: కష్టమైన ఈ క్రియకు శారీరకంగా గాయపడటం లేదా తీవ్ర భయవేదన చెందటం అనే రెండు అర్థసాధ్యతలు ఉన్నాయి. మూలంలోని సందిగ్ధతను ప్రధాన పాఠం మరియు పాదసూచిక కలిపి కాపాడేందుకు ‘తీవ్ర వేదనకు గురయ్యాడు’ ఎంచుకోబడింది.
- source_word: מִן הַיּוֹרִים
  choice: వారి కారణంగా
  rationale: מִן ఇక్కడ మూలం లేదా కారణాన్ని సూచించగలదు. ప్రధాన పాఠంలోని వేదన భావానికి అనుగుణంగా ‘వారి కారణంగా’ అని ఇచ్చి, గాయపరిచిన కర్త అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: וַיָּחֶל అనే క్రియలోని గాయం/వేదన సందిగ్ధత
  choice: ప్రధాన పాఠంలో ‘తీవ్ర వేదనకు గురయ్యాడు’
  alternative: ‘విలుకాండ్రిచేత గాయపడ్డాడు’
  rationale: హీబ్రూ రూపాన్ని శారీరక గాయం గానీ తీవ్రమైన మనోవేదన గానీ అర్థం చేసుకోవచ్చు. ఒక అర్థాన్ని సిద్ధాంతపరంగా ఖరారు చేయకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన కథన శైలి. హీబ్రూ వాక్యంలోని క్రమాన్ని సాధ్యమైనంతవరకు నిలిపి, సహజమైన తెలుగు కోసం సంధానాన్ని స్వల్పంగా సవరించాం.
