- from: సౌలుకు వ్యతిరేకంగా యుద్ధం తీవ్రమైంది. విలుకాండ్రు అతన్ని చేరుకున్నారు; వారి కారణంగా అతడు తీవ్ర వేదనకు గురయ్యాడు.[a]
  to: సౌలుకు వ్యతిరేకంగా యుద్ధం తీవ్రమైంది. విలుకాండ్రు అతన్ని కనుగొన్నారు; విలుకాండ్రిచేత అతడు గాయపడ్డాడు.[a]
  rationale: The revision follows the probable contextual meaning of the difficult Hebrew verb as “was wounded,” consistent with the military setting and the parallel account, but retains the serious lexical alternative in a footnote. It also replaces the less explicit pronoun-based causal phrase with a direct reference to the archers.
