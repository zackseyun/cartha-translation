id: 1CH.10.6
reference: 1 Chronicles 10:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֤מָת שָׁאוּל֙ וּ/שְׁלֹ֣שֶׁת בָּנָ֔י/ו וְ/כָל בֵּית֖/וֹ יַחְדָּ֥ו מֵֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/006.yaml
  text: So Saul died[a], and his three sons, and all his house died together.
translation:
  language: te
  text: ఈ విధంగా సౌలు చనిపోయాడు; అతని ముగ్గురు కుమారులూ, అతని ఇంటివారందరూ[a] కలిసి చనిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా, ‘అతని ఇల్లంతా.’ ఇక్కడ ‘ఇల్లు’ భౌతిక కట్టడాన్ని కాకుండా ఇంటివారిని, కుటుంబాన్ని లేదా వంశాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: ఆ విధంగా ... చనిపోయాడు
  rationale: మూత్ క్రియ యొక్క వయ్యిక్తోల్ రూపం కథనాన్ని ముందుకు నడిపిస్తూ, ముందున్న సంఘటనల ఫలితాన్ని తెలియజేస్తుంది. ‘ఆ విధంగా’ ఆధునిక తెలుగులో ఆ కథన సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: שָׁאוּל
  choice: సౌలు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: וּשְׁלֹשֶׁת בָּנָיו
  choice: అతని ముగ్గురు కుమారులూ
  rationale: సంఖ్య, నామవాచకం, తృతీయ పురుష ఏకవచన ప్రత్యయం కలిగిన నిర్మాణం ‘అతని ముగ్గురు కుమారులు’ అని అర్థమిస్తుంది; ‘-ూ’ సముచ్చయాన్ని సహజంగా సూచిస్తుంది.
- source_word: וְכָל־בֵּיתוֹ
  choice: అతని ఇంటివారందరూ[a]
  rationale: בַּיִת ఇక్కడ భౌతిక గృహం కంటే సౌలుకు చెందిన ఇంటివారు, కుటుంబం లేదా వంశగృహాన్ని సూచిస్తుంది. ‘ఇంటివారు’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండగా, పాదసూచిక మూలపదంలోని విస్తృతార్థాన్ని నిలుపుతుంది.
- source_word: יַחְדָּו
  choice: కలిసి
  rationale: సౌలు, అతని కుమారులు, అతని ఇంటివారు ఒక సమూహంగా మరణించారని తెలిపే క్రియావిశేషణాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: מֵתוּ
  choice: వారంతా కలిసి చనిపోయారు
  rationale: మూత్ క్రియ యొక్క బహువచన రూపాన్ని ‘చనిపోయారు’గా అనువదించి, హెబ్రీలోని ‘చనిపోయాడు/చనిపోయారు’ పునరుక్తిని నిలిపాం. ‘వారంతా’ ముందున్న సమస్త సమూహాన్ని స్పష్టంగా కలుపుతుంది.
theological_decisions:
- issue: ‘అతని ఇల్లంతా’ అనే పదబంధపు పరిధి
  choice: ప్రధాన పాఠంలో ‘అతని ఇంటివారందరూ’ అని ఉంచి, పాదసూచికలో కుటుంబం/వంశగృహం అనే అర్థవిస్తృతిని తెలిపాం.
  alternative: అతని కుటుంబమంతా; అతని వంశమంతా; అతని ఇల్లంతా
  rationale: హెబ్రీ పదబంధం ప్రతి దూరపు బంధువూ మినహాయింపులేకుండా మరణించాడని తప్పనిసరిగా చెప్పదు; యుద్ధ సందర్భంలో సౌలుతో కూడిన అతని ఇంటిని సూచించవచ్చు. అందువల్ల దాని పరిధిని ఒక నిర్దిష్ట చారిత్రక లేదా వంశపరమైన వాదనగా కుదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని రెండు మరణ క్రియారూపాల పునరుక్తిని నిలిపి, రెండవ క్రియకు సంబంధించిన సమూహాన్ని ‘వారంతా’తో స్పష్టం చేశాం; పదార్థంలోని అస్పష్టతను పాదసూచికలో సంరక్షించాం.
