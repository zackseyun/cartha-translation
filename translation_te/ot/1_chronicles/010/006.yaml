  terminology: ‘సౌలు’ is standard. ‘అతని ఇంటివారందరూ’ is an acceptable contextual rendering of בֵּיתוֹ, provided the footnote preserves the broader sense of ‘house,’ including household, family, or dynasty/line. The footnote has been made more natural and precise in Telugu.
