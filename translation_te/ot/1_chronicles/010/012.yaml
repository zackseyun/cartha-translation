source:
  edition: WLC
  text: וַ/יָּקוּמוּ֮ כָּל אִ֣ישׁ חַיִל֒ וַ/יִּשְׂא֞וּ אֶת גּוּפַ֣ת שָׁא֗וּל וְ/אֵת֙ גּוּפֹ֣ת בָּנָ֔י/ו וַ/יְבִיא֖וּ/ם יָבֵ֑ישָׁ/ה וַ/יִּקְבְּר֨וּ אֶת עַצְמוֹתֵי/הֶ֜ם תַּ֤חַת הָ/אֵלָה֙ בְּ/יָבֵ֔שׁ וַ/יָּצ֖וּמוּ שִׁבְעַ֥ת יָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/012.yaml
  text: Then all the valiant men arose and carried away the body of Saul and the bodies of his sons[a], and brought them to Jabesh[b]. They buried their bones under the oak in Jabesh and fasted seven days.
translation:
  language: te
  text: అప్పుడు పరాక్రమవంతులందరూ లేచి, సౌలు మృతదేహాన్ని, అతని కుమారుల మృతదేహాలను మోసుకొని యాబేషుకు[a] తెచ్చారు. వారు వారి ఎముకలను యాబేషులోని టెరెబింతు చెట్టు[b] కింద పాతిపెట్టి, ఏడు రోజులు ఉపవాసం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: విస్తృత కథనంలో ఈ స్థలం ‘యాబేషు-గిలాదు’గా గుర్తించబడుతుంది; ఈ వచనంలోని హీబ్రూ పాఠం దానిని సంక్షిప్తంగా ‘యాబేషు’ అని మాత్రమే పేర్కొంటుంది.
    reason: cross_reference
  - marker: b
    text: హీబ్రూ אֵלָה అనే పదం టెరెబింతు చెట్టును లేదా ఓకు చెట్టును పోలిన పెద్ద చెట్టును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ חַיִל
  choice: పరాక్రమవంతులందరూ
  rationale: ఈ స్థిర పదబంధం బలం, ధైర్యం, యుద్ధశౌర్యం గల పురుషులను సూచిస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో సమూహార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: גּוּפַת ... גּוּפֹת
  choice: సౌలు మృతదేహాన్ని, అతని కుమారుల మృతదేహాలను
  rationale: గּוּפָה మరణించిన శరీరాన్ని సూచిస్తుంది. ‘మృతదేహం’ సందర్భాన్ని స్పష్టంగా ఉంచుతూ, అతిగా కఠినంగా వినిపించదు.
- source_word: וַיִּשְׂאוּ
  choice: తీసుకొని
  rationale: ఇక్కడ נשׂא మృతదేహాలను ఎత్తి అక్కడి నుంచి మోసుకెళ్లడాన్ని సూచిస్తుంది; తరువాతి ‘తెచ్చారు’తో కలిపి తెలుగు వాక్యంలో సహజంగా ఈ కదలికను తెలియజేస్తుంది.
- source_word: וַיְבִיאוּם יָבֵישָׁה
  choice: యాబేషుకు తెచ్చారు
  rationale: ఈ వచనంలోని హీబ్రూ రూపం పూర్తి ‘యాబేషు-గిలాదు’ పేరుకు బదులుగా ‘యాబేషు’ అనే సంక్షిప్త స్థలనామాన్నే ఇస్తుంది.
- source_word: עַצְמוֹתֵיהֶם
  choice: వారి ఎముకలను
  rationale: עֶצֶם యొక్క స్పష్టమైన అర్థం ‘ఎముక.’ ‘అవశేషాలు’ అని సాధారణీకరించకుండా మూలంలోని దృశ్యమైన పదాన్ని నిలుపుతుంది.
- source_word: תַּחַת הָאֵלָה
  choice: మస్తకి చెట్టు కింద
  rationale: אֵלָה మస్తకి/టెరెబింతు లేదా దానికి సమానమైన పెద్ద ఓకు జాతి చెట్టును సూచించవచ్చు. ప్రధాన పాఠంలో సంప్రదాయంగా గుర్తించదగిన వృక్షనామాన్ని ఉంచి, అనిశ్చితిని పాదసూచికలో తెలిపాం.
- source_word: וַיָּצֻמוּ שִׁבְעַת יָמִים
  choice: ఏడు రోజులు ఉపవాసం చేశారు
  rationale: శోక సందర్భంలో చేసిన ఏడు రోజుల ఉపవాసాన్ని నేరుగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
