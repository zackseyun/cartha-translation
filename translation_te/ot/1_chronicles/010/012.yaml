translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరతను నిలుపుకుంటూనే సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. మూలంలోని వరుస క్రియలను సహజ తెలుగు కథన ప్రవాహంలో ఉంచాం. పాదసూచిక గుర్తులు ప్రధాన పాఠంలో వాటి విషయాలకు సంబంధించిన చోట్ల వరుసగా అమర్చబడ్డాయి.
