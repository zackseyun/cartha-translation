    reason: cultural_note
  revision_rationale: '"చూశారు" స్థానంలో "కనుగొన్నారు" ఉంచి మూలంలోని వַיִּמְצְאוּను సరిగ్గా ప్రతిబింబించాం. దోపుడు వస్తువుల వివరాలను ప్రధాన వచనంలో పరిమితం చేయకుండా, మూలక్రియ యొక్క విస్తృత అర్థాన్ని "మీదున్న వాటిని తీసివేయడానికి" ద్వారా నిలిపి, అవసరమైన వివరణను పాదటిప్పణిలో ఇచ్చాం.'
