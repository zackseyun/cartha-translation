  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יָּבֹ֣אוּ פְלִשְׁתִּ֔ים לְ/פַשֵּׁ֖ט אֶת הַֽ/חֲלָלִ֑ים וַֽ/יִּמְצְא֤וּ אֶת שָׁאוּל֙ וְ/אֶת בָּנָ֔י/ו נֹפְלִ֖ים בְּ/הַ֥ר גִּלְבֹּֽעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/008.yaml
  text: It happened on the next day that the Philistines came to strip the slain[b][a], and they found Saul and his sons fallen on Mount Gilboa.
translation:
  language: te
  text: మరుసటి రోజు[a] ఫిలిష్తీయులు హతులైనవారి మీదున్న వాటిని తీసివేయడానికి[b] వచ్చారు; గిల్బోవ పర్వతం మీద పడి ఉన్న సౌలును, అతని కుమారులను కనుగొన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తరువాతి రోజు.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “తీసివేయడం” అంటే యుద్ధంలో హతులైనవారి మీదున్న దుస్తులు, కవచం లేదా ఇతర దోపుడు సొత్తును తీసుకోవడం.
    reason: cultural_note
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: మరుసటి రోజు
  rationale: ముందు వివరించిన యుద్ధం జరిగిన తరువాతి రోజును సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: לְפַשֵּׁט
  choice: దుస్తులు, ఆయుధాలు తీసుకోవడానికి
  rationale: యుద్ధంలో చనిపోయినవారి మీదున్న వస్త్రాలు, కవచం లేదా ఆయుధాలు వంటి వస్తువులను ఒలిచివేయడం అనే సందర్భార్థాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַחֲלָלִים
  choice: యుద్ధంలో చనిపోయినవారి
  rationale: సాధారణ మృతులను కాక యుద్ధంలో హతులైనవారిని సూచించే మూలపదంలోని సైనిక సందర్భాన్ని నిలుపుతుంది.
- source_word: נֹפְלִים
  choice: పడి ఉండడం
  rationale: మూలంలోని ‘పడినవారు’ అనే దృశ్యరూపాన్ని నిలుపుతూ, సందర్భంలో వారు మరణించి పడి ఉన్నారనే భావాన్ని అతిగా విప్పకుండా తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּהַר גִּלְבֹּעַ
  choice: గిల్బోవ పర్వతం మీద
  rationale: పేరు గల పర్వతాన్ని సూచించే పదబంధానికి సహజమైన తెలుగు రూపం.
- source_word: וַיְהִי
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది కథన కొనసాగింపును సూచించే సూత్రప్రాయ రూపం; తెలుగులో వాక్యక్రమమే ఆ కొనసాగింపును సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. ‘ఫిలిష్తీయులు,’ ‘సౌలు,’ ‘గిల్బోవ’ అనే రూపాలు తెలుగు బైబిలు వాడుకకు అనుగుణంగా ఉన్నాయి; మూలంలోని యుద్ధసందర్భం మరియు ‘పడి’ అనే దృశ్యరూపం నిలుపబడ్డాయి.
