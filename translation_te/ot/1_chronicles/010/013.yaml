id: 1CH.10.13
reference: 1 Chronicles 10:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֣מָת שָׁא֗וּל בְּ/מַֽעֲל/וֹ֙ אֲשֶׁ֣ר מָעַ֣ל בַּֽ/יהוָ֔ה עַל דְּבַ֥ר יְהוָ֖ה אֲשֶׁ֣ר לֹא שָׁמָ֑ר וְ/גַם לִ/שְׁא֥וֹל בָּ/א֖וֹב לִ/דְרֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/013.yaml
  text: So Saul died for his unfaithfulness by which he was unfaithful to Yahweh[a], because of the word of Yahweh, which he did not keep, and also because he asked counsel of a medium[b], to inquire.
translation:
  language: te
  text: కాబట్టి సౌలు యెహోవాపట్ల తాను చేసిన నమ్మకద్రోహం[a] వల్ల చనిపోయాడు; అతడు యెహోవా వాక్యాన్ని పాటించలేదు, అలాగే విచారించడానికి ఒక మాధ్యమాన్ని[b] ఆశ్రయించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తాను యెహోవాపట్ల చేసిన విశ్వాసభంగం వల్ల.”
    reason: lexical_alternative
  - marker: b
    text: “మాధ్యమం” అంటే చనిపోయినవారి నుండి లేదా ఆత్మల నుండి సమాచారం పొందడానికి ప్రయత్నించే వ్యక్తి; 1 సమూయేలు 28:7 చూడండి.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: కాబట్టి ... చనిపోయాడు
  rationale: వావ్-కన్సిక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ముందు సందర్భంలో చెప్పిన పరిణామంతో సంబంధాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘కాబట్టి’ వాడబడింది.
- source_word: בְּמַעֲלוֹ / מָעַל
  choice: తాను ... చేసిన నమ్మకద్రోహం
  rationale: మూలంలోని నామవాచకం–సజాతి క్రియ కలయిక దేవునితో నిబంధన సంబంధంలో విశ్వాసభంగాన్ని బలంగా సూచిస్తుంది. ‘నమ్మకద్రోహం’ సాధారణ తప్పుకన్నా ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בַּיהוָה
  choice: యెహోవాకు
  rationale: మעל క్రియతో వచ్చిన בְ, నమ్మకద్రోహం ఎవరికి విరుద్ధంగా జరిగిందో సూచిస్తుంది; తెలుగులో ‘యెహోవాకు నమ్మకద్రోహం’ సహజమైన నిర్మాణం.
- source_word: עַל דְּבַר יְהוָה אֲשֶׁר לֹא שָׁמָר
  choice: అతడు యెహోవా మాటను పాటించలేదు
  rationale: שׁמר ఇక్కడ మాటను కాపాడటం అనే అక్షరార్థం కంటే దానిని గైకొనడం/పాటించడం అనే నిబంధనాత్మక విధేయతను సూచిస్తుంది.
- source_word: וְגַם
  choice: అంతేకాక
  rationale: సౌలు మరణానికి రెండవ కారణాన్ని ముందటి కారణానికి జోడిస్తుంది.
- source_word: לִשְׁאוֹל בָּאוֹב לִדְרֹשׁ
  choice: విచారించడానికి మృతాత్మలను సంప్రదించే వ్యక్తిని ఆశ్రయించాడు
  rationale: אוֹב అనే పదం ఆత్మల ద్వారా సమాచారం కోరే వ్యక్తిని లేదా ఆచారాన్ని సూచించగలదు. సందర్భం 1 సమూయేలు 28:7లోని వ్యక్తిని సూచిస్తున్నందున, ఆధునిక పాఠకులకు అర్థమయ్యే వివరణాత్మక రూపం ఎంచుకోబడింది; לִדְרֹשׁ యొక్క ప్రయోజన భావం ‘విచారించడానికి’లో నిలుపబడింది.
theological_decisions:
- issue: దైవ నామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో నిబంధన నామం నేరుగా ఉంది. దానిని సాధారణ బిరుదైన ‘ప్రభువు’గా మార్చకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచాం.
- issue: సౌలు పాప స్వభావం
  choice: నమ్మకద్రోహం
  alternative: అపరాధం / అతిక్రమం
  rationale: מעל సాధారణ తప్పును మాత్రమే కాక దేవునిపట్ల విశ్వాసభంగాన్ని సూచిస్తుంది; అందువల్ల నిబంధనాత్మక తీవ్రతను నిలిపే పదం ఎంచుకోబడింది.
- issue: אוֹב యొక్క సూచన
  choice: మృతాత్మలను సంప్రదించే వ్యక్తి
  alternative: మాధ్యమం / కర్ణపిశాచి గల వ్యక్తి
  rationale: పదం వ్యక్తిని లేదా ఆత్మసంబంధ సాధనాన్ని సూచించగల చారిత్రక-పదార్థ సంక్లిష్టత కలిగి ఉంది. సందర్భానుసారం వ్యక్తిని ప్రధాన పాఠ్యంలో చూపించి, దాని అర్థపరిధిని పాదసూచికలో వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి వాడబడింది. మూలంలోని కారణ సంబంధం, నిబంధనాత్మక నమ్మకద్రోహ భావం, అలాగే నిషేధిత ఆత్మసంప్రదింపు చర్య స్పష్టంగా నిలుపబడ్డాయి.
