  text: וַ֠/יִּרְאוּ כָּל אִ֨ישׁ יִשְׂרָאֵ֤ל אֲשֶׁר בָּ/עֵ֨מֶק֙ כִּ֣י נָ֔סוּ וְ/כִי מֵ֖תוּ שָׁא֣וּל וּ/בָנָ֑י/ו וַ/יַּעַזְב֤וּ עָרֵי/הֶם֙ וַ/יָּנֻ֔סוּ וַ/יָּבֹ֣אוּ פְלִשְׁתִּ֔ים וַ/יֵּשְׁב֖וּ בָּ/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/007.yaml
  text: When all the men of Israel who were in the valley saw that they had fled and that Saul and his sons were dead[a], they abandoned their cities and fled[c][b]; then the Philistines came and lived in them.
translation:
  language: te
  text: లోయలో[a] ఉన్న ఇశ్రాయేలు పురుషులందరూ[b], పారిపోయారనీ[c], సౌలు, అతని కుమారులు చనిపోయారనీ చూసినప్పుడు, తమ పట్టణాలను విడిచిపెట్టి పారిపోయారు. అప్పుడు ఫిలిష్తీయులు వచ్చి వాటిలో నివసించారు[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మైదానంలో ఉన్న.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ వాక్యంలో ‘ఇశ్రాయేలు పురుషులందరూ’ అని పుంలింగ పదం స్పష్టంగా ఉంది; లింగ-తటస్థ పదం కాదు.
    reason: lexical_alternative
  - marker: c
    text: ‘పారిపోయారు’ అనే క్రియకు కర్త ఎవరో హీబ్రూ వాక్యం ఇక్కడ స్పష్టంగా చెప్పదు.
    reason: source_ambiguity
  - marker: d
    text: లేదా ‘వాటిలో స్థిరపడ్డారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: చూసినప్పుడు
  rationale: ראה అనే క్రియ యొక్క ప్రాథమిక దృశ్యార్థాన్ని నిలుపుతూ, యుద్ధ ఫలితాన్ని వారు గమనించిన సందర్భాన్ని సహజమైన తెలుగు కథన నిర్మాణంలో తెలియజేస్తుంది.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులందరూ
  rationale: כָּל తరువాతి ఏకవచన אִישׁ‌కు విభజనాత్మక భావం ఉంది; మూలంలోని స్పష్టమైన పుంలింగ సూచనను ‘పురుషులందరూ’ నిలుపుతుంది.
- source_word: אֲשֶׁר בָּעֵמֶק
  choice: లోయలో ఉన్న
  rationale: עֵמֶק‌కు సాధారణ భౌగోళిక అర్థం ‘లోయ’; సందర్భానికి సరళంగా సరిపోతుంది.
- source_word: כִּי נָסוּ
  choice: పారిపోయారనీ
  rationale: נוס యొక్క సాధారణ అర్థం ‘పారిపోవడం.’ హీబ్రూలో కర్త వ్యక్తంగా లేకపోవడం వల్ల తెలుగులోనూ కర్తను చేర్చకుండా ఆ అస్పష్టతను నిలిపింది.
- source_word: וְכִי מֵתוּ שָׁאוּל וּבָנָיו
  choice: సౌలు అతని కుమారులు చనిపోయారనీ
  rationale: מותను సందర్భానుకూలమైన సహజ తెలుగులో అందిస్తూ, వారు మరణించిన వాస్తవాన్ని వారు గమనించారని తెలియజేస్తుంది.
- source_word: וַיַּעַזְבוּ עָרֵיהֶם
  choice: తమ పట్టణాలను విడిచిపెట్టి
  rationale: עזבలోని వెనుక విడిచిపోవడం/త్యజించడం అనే భావాన్ని యుద్ధం కారణంగా పట్టణాలను ఖాళీ చేసిన సందర్భంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיָּנֻסוּ
  choice: పారిపోయారు
  rationale: נוסకు నేరమైన, గౌరవప్రదమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: וַיָּבֹאוּ פְלִשְׁתִּים
  choice: అప్పుడు ఫిలిష్తీయులు వచ్చి
  rationale: వావ్-కన్సెక్యూటివ్ సూచించే కథన క్రమాన్ని ‘అప్పుడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיֵּשְׁבוּ בָּהֶם
  choice: వాటిలో నివసించారు
  rationale: ישב యొక్క ‘నివసించడం’ అనే సాధారణ అర్థాన్ని స్పష్టమైన ఆధునిక తెలుగులో ఇస్తుంది; పట్టణాల్లో స్థిరపడడం అనే భావం కూడా సాధ్యమే.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి. మూలంలోని పుంలింగ సూచనను నిలిపి, నָסוּ క్రియకు వ్యక్తం కాని కర్తను తెలుగులోనూ అనవసరంగా నిర్ధారించలేదు.
