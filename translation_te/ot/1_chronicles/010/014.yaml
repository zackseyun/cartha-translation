source:
  edition: WLC
  text: וְ/לֹֽא דָרַ֥שׁ בַּֽ/יהוָ֖ה וַ/יְמִיתֵ֑/הוּ וַ/יַּסֵּב֙ אֶת הַ/מְּלוּכָ֔ה לְ/דָוִ֖יד בֶּן יִשָֽׁי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/014.yaml
  text: He did not seek Yahweh[b][a], so he put him to death and turned the kingdom over to David son of Jesse.
translation:
  language: te
  text: అతడు యెహోవాను వెదకలేదు[a]. అందుచేత యెహోవా అతణ్ణి చంపి, రాజ్యాధికారాన్ని[b] యెష్షయి కుమారుడైన దావీదుకు అప్పగించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యెహోవా దగ్గర విచారించలేదు’ లేదా ‘యెహోవాను సంప్రదించలేదు.’
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదానికి ‘రాజ్యం’ లేదా ‘రాజరికం’ అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָרַשׁ בַּיהוָה
  choice: యెహోవాను వెదకలేదు
  rationale: దైవిక కర్మతో వచ్చిన דָרַשׁ בְּ అంటే వెదకడం, విచారించడం లేదా సంప్రదించడం. ‘వెదకడం’ అనే విస్తృత పదం ఈ సందర్భంలోని మార్గదర్శకత్వం కోరే భావాన్నీ, దేవునితో సంబంధపూర్వక భావాన్నీ నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా అందించాం.
- source_word: וַיְמִיתֵהוּ
  choice: యెహోవా అతణ్ణి చంపి
  rationale: מות హిఫీల్ రూపం మరణానికి కారణం కావడాన్ని స్పష్టంగా సూచిస్తుంది. తెలుగులో ‘చంపి’ సహజంగా, నేరుగా ఆ causative భావాన్ని తెలియజేస్తుంది; సందర్భం ప్రకారం కర్త యెహోవా అని స్పష్టం చేశాం.
- source_word: וַיַּסֵּב
  choice: అప్పగించాడు
  rationale: సబబ్ హిఫీల్ ఇక్కడ రాజ్యాధికారాన్ని మరొకరికి మళ్లించడం లేదా బదిలీ చేయడం అనే భావం ఇస్తుంది. ‘అప్పగించాడు’ సహజమైన ఆధునిక తెలుగు వ్యక్తీకరణ.
- source_word: הַמְּלוּכָה
  choice: రాజ్యాధికారం
  rationale: מְלוּכָה రాజ్యం, రాజరికం, రాజ్యపాలన అనే అర్థాలు ఇవ్వగలదు. ఇక్కడ సౌలు నుండి దావీదుకు బదిలీ అయ్యేది భూభాగం మాత్రమే కాక రాజుగా పాలించే అధికారం కాబట్టి ‘రాజ్యాధికారం’ సందర్భానికి స్పష్టంగా సరిపోతుంది.
- source_word: לְדָוִיד בֶּן־יִשַׁי
  choice: యెష్షయి కుమారుడైన దావీదుకు
  rationale: హీబ్రూ పితృనామ సంబంధాన్ని సహజమైన, గౌరవప్రదమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
theological_decisions:
- issue: సౌలు మరణంలో దైవిక కార్యసాధకత్వం
  choice: సౌలును చంపిన అంతిమ కర్తగా యెహోవాను వాక్యం నేరుగా పేర్కొంటుంది.
  alternative: యెహోవా నేరుగా చంపకుండా సౌలు మరణించడానికి అనుమతించాడు.
  rationale: సందర్భంలో వరుస క్రియలకు కర్త యెహోవా; וַיְמִיתֵהוּ అనే causative రూపం దైవిక కార్యసాధకత్వాన్ని ఎటువంటి సడలింపూ లేకుండా తెలియజేస్తుంది. ద్వితీయ కారణాల సిద్ధాంతాన్ని చేర్చకుండా మూలపాఠంలోని ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని కారణ-ఫలిత సంబంధాన్ని ‘అందుచేత’తో వ్యక్తం చేశాం. దైవనామాన్ని ‘యెహోవా’గా నిలిపి, అస్పష్టమైన క్రియా కర్తను సందర్భానుసారం స్పష్టం చేశాం; నిజమైన పదార్థ వైవిధ్యాన్ని పాదటిప్పణుల్లో ఉంచాం.
