  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని సంక్షిప్త వరుసను, ‘కత్తిమీద’ అనే రూపాన్ని నిలుపుతూ అవసరమైన వివరణను పాదసూచికలో ఇచ్చాం.
