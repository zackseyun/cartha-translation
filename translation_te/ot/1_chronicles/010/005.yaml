  naturalness: The sentence is clear modern Telugu. ‘కత్తిపై’ is the more standard contemporary postpositional form than ‘కత్తిమీద’ while retaining the Hebrew’s deliberately non-possessive ‘the sword.’
  terminology: ‘అతని ఆయుధాలు మోసేవాడు’ is understandable and faithful, but ‘అతని ఆయుధవాహకుడు’ is a concise, established modern Telugu designation for the military role. The lexical footnote preserves the fuller literal sense of the Hebrew expression.
