source:
  edition: WLC
  text: וַ/יַּ֥רְא נֹשֵֽׂא כֵלָ֖י/ו כִּ֣י מֵ֣ת שָׁא֑וּל וַ/יִּפֹּ֥ל גַּם ה֛וּא עַל הַ/חֶ֖רֶב וַ/יָּמֹֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/005.yaml
  text: When his armor-bearer saw that Saul was dead[b][a], he too fell on the sword and died.
translation:
  language: te
  text: సౌలు చనిపోయి ఉన్నాడని అతని ఆయుధవాహకుడు[a] చూసినప్పుడు, అతడు కూడా కత్తిపై పడి[b] చనిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘అతని ఆయుధ సామగ్రిని మోసేవాడు.’
    reason: lexical_alternative
  - marker: b
    text: ‘కత్తిపై పడడం’ అంటే కత్తితో తనను తాను చంపుకోవడాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: అతని ఆయుధాలు మోసేవాడు
  rationale: ఈ నిర్మాణం అక్షరార్థంగా ‘అతని ఆయుధ సామగ్రిని మోసేవాడు’ అని సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు పాత్రను స్పష్టంగా తెలియజేస్తూ మూలంలోని విస్తృతమైన כֵלָיו భావాన్ని నిలుపుతుంది.
- source_word: כִּי
  choice: అని
  rationale: ఇక్కడ כִּי, ఆయుధాలు మోసేవాడు గ్రహించిన విషయాన్ని పరిచయం చేస్తుంది; అందువల్ల ‘చనిపోయాడని ... చూసినప్పుడు’ సహజమైన తెలుగు నిర్మాణం.
- source_word: מֵת
  choice: చనిపోయాడు
  rationale: సౌలు అప్పటికే మృతుడై ఉన్నాడని గమనించిన స్థితిని సందర్భానుసారంగా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וַיִּפֹּל
  choice: పడి
  rationale: נפל అనే క్రియ యొక్క ప్రాథమిక అర్థమైన ‘పడడం’ను నిలుపుతూ, కత్తితో కూడిన సందర్భం ఉద్దేశపూర్వక స్వమరణాన్ని సూచించేలా చేస్తుంది.
- source_word: גַּם הוּא
  choice: అతడు కూడా
  rationale: సౌలులాగే ఆయుధాలు మోసేవాడు కూడా మరణించాడనే అదనపు, ఉద్ఘాటన భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: עַל הַחֶרֶב
  choice: కత్తిమీద
  rationale: మూలంలో ఉన్న నిర్దిష్ట ‘కత్తిమీద’ అనే రూపాన్ని నిలుపుతుంది; ‘తన కత్తి’ అని మూలంలో లేని స్వామ్యాన్ని చేర్చదు.
- source_word: וַיָּמֹת
  choice: చనిపోయాడు
  rationale: వరుస కథనంలోని చివరి ఫలితాన్ని సంక్షిప్తంగా, నేరుగా తెలియజేస్తుంది.
