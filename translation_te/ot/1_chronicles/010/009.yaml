id: 1CH.10.9
reference: 1 Chronicles 10:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֨פְשִׁיטֻ֔/הוּ וַ/יִּשְׂא֥וּ אֶת רֹאשׁ֖/וֹ וְ/אֶת כֵּלָ֑י/ו וַ/יְשַׁלְּח֨וּ בְ/אֶֽרֶץ פְלִשְׁתִּ֜ים סָבִ֗יב לְ/בַשֵּׂ֛ר אֶת עֲצַבֵּי/הֶ֖ם וְ/אֶת הָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/009.yaml
  text: They stripped him[a], took his head and his weapons, and sent word throughout the land of the Philistines to proclaim the news to their idols and to the people.
translation:
  language: te
  text: వారు అతని వస్త్రాలను తీసివేసి[a], అతని తలను, ఆయుధాలను తీసుకొని, ఆ వార్తను తమ విగ్రహాలకూ ప్రజలకూ ప్రకటించడానికి ఫిలిష్తీయుల దేశమంతటా వార్త పంపించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతని కవచాన్ని తీసివేసి.’ హీబ్రూ క్రియ దుస్తులను లేదా కవచాన్ని తొలగించడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפְשִׁיטֻהוּ
  choice: అతని వస్త్రాలను తీసివేసి
  rationale: פשט క్రియకు దుస్తులు లేదా కవచం తొలగించడం అనే అర్థం ఉంది. మూలంలో కవచం స్పష్టంగా చెప్పబడలేదు; తెలుగులో కేవలం ‘అతన్ని విప్పి’ అనడం అసహజంగా లేదా అస్పష్టంగా ఉండటంతో, సాధారణ అర్థాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: וַיִּשְׂאוּ אֶת־רֹאשׁוֹ
  choice: అతని తలను ... తీసుకొని
  rationale: נשא ఇక్కడ యుద్ధవిజయ సందర్భంలో తలను స్వాధీనం చేసుకొని తీసుకుపోవడాన్ని సూచిస్తుంది; శిరఛ్ఛేదం అనే క్రియను మూలానికి మించి స్పష్టీకరించలేదు.
- source_word: כֵּלָיו
  choice: అతని ... ఆయుధాలను
  rationale: כְּלִי అనేది సామగ్రి, పనిముట్టు లేదా ఆయుధం అనే విస్తృత పదం. యుద్ధభూమి సందర్భంలో ‘ఆయుధాలు’ సహజమైన ఎంపిక.
- source_word: וַיְשַׁלְּחוּ
  choice: వర్తమానం పంపారు
  rationale: మూల క్రియ సాధారణంగా ‘పంపారు’ అని మాత్రమే చెబుతుంది. తరువాతి ఉద్దేశార్థక క్రియ వార్త ప్రకటించడాన్ని సూచిస్తుంది కాబట్టి, తెలుగులో సహజంగా ‘వర్తమానం పంపారు’ అని ఇచ్చాం; దూతలను స్పష్టంగా చేర్చలేదు.
- source_word: בְאֶרֶץ פְלִשְׁתִּים סָבִיב
  choice: ఫిలిష్తీయుల దేశమంతటా
  rationale: סָבִיב ఇక్కడ ఫిలిష్తీయుల ప్రాంతమంతటా వ్యాప్తిని సూచిస్తుంది. ఈ రూపం ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: לְבַשֵּׂר
  choice: ఆ వార్తను ... ప్రకటించడానికి
  rationale: בשר వార్తను, ముఖ్యంగా ఇక్కడ విజయవార్తను, ప్రకటించడం. ‘శుభవార్త’ అని అనువదిస్తే తెలుగులో అవసరానికి మించిన ప్రత్యేక భావం రావచ్చు.
- source_word: עֲצַבֵּיהֶם
  choice: తమ విగ్రహాలకు
  rationale: עֶצֶב ఆరాధనా ప్రతిమను లేదా విగ్రహాన్ని సూచిస్తుంది; సందర్భంలోని ప్రతికూల మతపరమైన విలువను ‘విగ్రహాలు’ స్పష్టంగా నిలుపుతుంది.
- source_word: הָעָם
  choice: ప్రజలకు
  rationale: నిర్దిష్ట ఏకవచన సమూహనామం సందర్భంలో ఫిలిష్తీయ ప్రజలను సూచిస్తుంది. తెలుగులో ‘ప్రజలకు’ సంక్షిప్తంగా, సహజంగా ఉంది.
theological_decisions:
- issue: עֲצַבֵּיהֶם అనే ఆరాధనా సంబంధ పదం
  choice: తమ విగ్రహాలకు
  alternative: తమ ప్రతిమలకు
  rationale: ఈ పదం దేవతలను వాటి ఆరాధనా ప్రతిమల ద్వారా సూచిస్తుంది. ‘విగ్రహాలు’ హీబ్రూ గ్రంథంలోని ప్రతికూల మూల్యాంకనాన్ని నిలుపుతుంది; ‘ప్రతిమలు’ సాధ్యమైన తటస్థ ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. హీబ్రూ వాక్యక్రమాన్ని సాధ్యమైనంత వరకు నిలుపుతూ, తెలుగులో అసహజత రాకుండా స్వల్ప పునర్వ్యవస్థీకరణ చేశాం.
