source:
  edition: WLC
  text: וַ/יַּדְבְּק֣וּ פְלִשְׁתִּ֔ים אַחֲרֵ֥י שָׁא֖וּל וְ/אַחֲרֵ֣י בָנָ֑י/ו וַ/יַּכּ֣וּ פְלִשְׁתִּ֗ים אֶת יוֹנָתָ֧ן וְ/אֶת אֲבִינָדָ֛ב וְ/אֶת מַלְכִּי שׁ֖וּעַ בְּנֵ֥י שָׁאֽוּל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/002.yaml
  text: And the Philistines pursued Saul and his sons[a], and the Philistines struck down Jonathan, Abinadab, and Malchi-shua, the sons of Saul.
translation:
  language: te
  text: ఫిలిష్తీయులు సౌలును, అతని కుమారులను విడువకుండా వెంబడించారు[a]. ఫిలిష్తీయులు సౌలు కుమారులైన యోనాతానును, అబీనాదాబును, మల్కీషూవను హతమార్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దగ్గరగా వెంబడించారు.” ఇక్కడి హీబ్రూ క్రియకు అక్షరార్థంగా ‘అంటుకొని ఉండడం’ అనే భావం ఉంది; ఈ యుద్ధ సందర్భంలో అది ఎడతెగని తీవ్ర వెంబడింపును వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְבְּקוּ ... אַחֲרֵי
  choice: విడువకుండా వెంబడించారు
  rationale: דבק అనే క్రియకు ప్రాథమికంగా ‘అంటుకొని ఉండు’ అనే భావం ఉంది; אַחֲרֵיతో యుద్ధ సందర్భంలో అది ఎడతెగని, దగ్గరి వెంబడింపును సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ఆ తీవ్రతను ‘విడువకుండా వెంబడించారు’ తెలియజేస్తుంది.
- source_word: פְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ప్రజాసమూహం పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం; హీబ్రూలో రెండుసార్లు వచ్చినందున రెండు వాక్యాల్లోనూ నిలిపాం.
- source_word: בָנָיו / בְּנֵי שָׁאוּל
  choice: అతని కుమారులను / సౌలు కుమారులైన
  rationale: హీబ్రూ పదం పురుష సంతానాన్ని స్పష్టంగా సూచిస్తుంది; తరువాత పేర్కొన్న పేర్లతోనూ ఇది నిర్ధారితమవుతుంది. చివరి సమానాధికార పదబంధాన్ని పేర్లతో సహజంగా కలిపాం.
- source_word: וַיַּכּוּ
  choice: హతమార్చారు
  rationale: נכה విస్తృతంగా ‘కొట్టు/దెబ్బతీయు’ అని అర్థమవుతుంది; ఈ యుద్ధ సందర్భంలో పేరుపొందిన వారిని చంపిన ఫలితాన్ని ‘హతమార్చారు’ సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: יוֹנָתָן
  choice: యోనాతాను
  rationale: హీబ్రూ వ్యక్తినామానికి సుపరిచితమైన తెలుగు లిప్యంతరీకరణ.
- source_word: אֲבִינָדָב
  choice: అబీనాదాబు
  rationale: హీబ్రూ వ్యక్తినామాన్ని మూల ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: מַלְכִּי שׁוּעַ
  choice: మల్కీషూవ
  rationale: రెండు భాగాల హీబ్రూ వ్యక్తినామాన్ని మూల రూపానికి సమీపంగా, తెలుగులో సులభంగా చదవగల రూపంలో ఇచ్చాం.
