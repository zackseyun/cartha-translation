source:
  edition: WLC
  text: וּ/פְלִשְׁתִּ֖ים נִלְחֲמ֣וּ בְ/יִשְׂרָאֵ֑ל וַ/יָּ֑נָס אִֽישׁ יִשְׂרָאֵל֙ מִ/פְּנֵ֣י פְלִשְׁתִּ֔ים וַ/יִּפְּל֥וּ חֲלָלִ֖ים בְּ/הַ֥ר גִּלְבֹּֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/001.yaml
  text: The Philistines fought against Israel[a], and the men of Israel fled from before the Philistines and fell slain on Mount Gilboa.
translation:
  language: te
  text: ఫిలిష్తీయులు ఇశ్రాయేలుకు వ్యతిరేకంగా యుద్ధం చేశారు. ఇశ్రాయేలు పురుషులు[a] ఫిలిష్తీయుల ఎదుట నుండి పారిపోయి, గిల్బోవా పర్వతం మీద హతులై పడిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ మూలంలో అక్షరార్థంగా ‘ఇశ్రాయేలు పురుషుడు పారిపోయాడు’ అని ఏకవచనంలో ఉంది; ఇక్కడ ఆ ఏకవచనం సమూహార్థంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ప్రజాసమూహపు పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో ఇచ్చాం. ఆరంభంలోని ו సాధారణ కథన సంధి; తెలుగులో ప్రత్యేకంగా ‘ఇప్పుడు’ వంటి కాలసూచక పదాన్ని చేర్చలేదు.
- source_word: נִלְחֲמוּ בְיִשְׂרָאֵל
  choice: ఇశ్రాయేలుతో యుద్ధం చేశారు
  rationale: לחם నిఫల్ రూపం ב ఉపసర్గతో ఇక్కడ శత్రుత్వపూర్వకంగా ‘వ్యతిరేకంగా యుద్ధం చేయడం’ అనే అర్థం ఇస్తుంది; ‘ఇశ్రాయేలుతో యుద్ధం చేశారు’ ఆధునిక తెలుగులో సహజంగా అదే భావాన్ని తెలియజేస్తుంది.
- source_word: וַיָּנָס אִישׁ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు పురుషులు పారిపోయి
  rationale: אִישׁ ఏకవచన రూపంలో ఉన్నా ఇక్కడ సమూహార్థకంగా పనిచేస్తుంది. ‘ఇశ్రాయేలు పురుషులు’ మూలంలోని పురుషవాచక భావాన్ని నిలుపుతుంది; రూపభేదాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: מִפְּנֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల ఎదుటనుంచి
  rationale: מִפְּנֵי అనే పదబంధంలోని ‘ఎదుటనుంచి/సన్నిధినుంచి’ అనే దృశ్యభావాన్ని, శత్రువును ఎదుర్కొనలేక వెనుదిరిగిన సందర్భాన్ని సహజ తెలుగులో నిలిపింది.
- source_word: וַיִּפְּלוּ חֲלָלִים
  choice: హతులై పడిపోయారు
  rationale: యుద్ధ సందర్భంలోని נפל + חֲלָלִים పదబంధం చంపబడి నేలకూలడాన్ని సూచిస్తుంది. ‘హతులై పడిపోయారు’ మరణం మరియు పడిపోవడం రెండింటినీ కాపాడుతుంది.
- source_word: בְּהַר גִּלְבֹּעַ
  choice: గిల్బోవ పర్వతం మీద
  rationale: స్థలనామాన్ని ప్రాచుర్యంలో ఉన్న తెలుగు లిప్యంతరీకరణతో ఇచ్చి, కొండపై జరిగిన సంఘటనను ‘పర్వతం మీద’ అని సహజంగా వ్యక్తం చేశాం.
