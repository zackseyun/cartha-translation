  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַחֲרֵ֣י אֲחִיתֹ֗פֶל יְהוֹיָדָ֤ע בֶּן בְּנָיָ֨הוּ֙ וְ/אֶבְיָתָ֔ר וְ/שַׂר צָבָ֥א לַ/מֶּ֖לֶךְ יוֹאָֽב־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/034.yaml
  text: After Ahithophel came Jehoiada son of Benaiah and Abiathar[a]; and Joab was commander of the army for the king.
translation:
  language: te
  text: అహీతోఫెలు తరువాత బెనాయా కుమారుడైన యెహోయాదా, అబ్యాతారు వచ్చారు.[a] యోవాబు రాజుకు సైన్యాధిపతిగా ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “అహీతోఫెలు తరువాత బెనాయా కుమారుడైన యెహోయాదా, అబ్యాతారు.” హీబ్రూలో క్రియను స్పష్టంగా పేర్కొనలేదు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי
  choice: తరువాత ... అతని స్థానంలో సలహాదారులయ్యారు
  rationale: אַחֲרֵי అంటే ‘తరువాత’. హీబ్రూ వాక్యంలో క్రియ లేకపోయినా, ఇది రాజ సలహాదారుల జాబితా సందర్భం కావడంతో వారసత్వ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేశాం; ‘సలహాదారులయ్యారు’ అనే సందర్భపూరక పదాన్ని పాదసూచికతో గుర్తించాం.
- source_word: אֲחִיתֹפֶל
  choice: అహీతోఫెలు
  rationale: వ్యక్తి పేరును తెలుగులో సుపరిచితమైన బైబిలు రూపంలో లిప్యంతరీకరించాం.
- source_word: יְהוֹיָדָע
  choice: యెహోయాదా
  rationale: వ్యక్తి పేరును తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן בְּנָיָהוּ
  choice: బెనాయా కుమారుడైన
  rationale: హీబ్రూ పితృనామ నిర్మాణాన్ని సహజమైన తెలుగులో తెలిపాం.
- source_word: וְ/אֶבְיָתָר
  choice: అబ్యాతారు
  rationale: సంయోజకంతో కూడిన వ్యక్తి పేరు; యెహోయాదాతో కలిపి అహీతోఫెలు తరువాత వచ్చినవారిగా వాక్యనిర్మాణంలో ఉంచాం.
- source_word: וְ/שַׂר צָבָא
  choice: సైన్యాధిపతిగా ఉన్నాడు
  rationale: שַׂר צָבָא అనేది సైన్యపు ప్రధాన అధికారి లేదా సేనాధిపతిని సూచిస్తుంది. హీబ్రూలో లేని అనుసంధాన క్రియను పూర్తి తెలుగు వాక్యానికి ‘ఉన్నాడు’గా చేర్చాం.
- source_word: לַ/מֶּלֶךְ
  choice: రాజుకు
  rationale: ל ఉపసర్గ ఇక్కడ రాజుతో సేవాసంబంధాన్ని సూచిస్తుంది; ‘రాజుకు సైన్యాధిపతి’ సహజమైన తెలుగు ప్రయోగం.
- source_word: יוֹאָב
  choice: యోవాబు
  rationale: వ్యక్తి పేరును తెలుగులో సుపరిచితమైన బైబిలు రూపంలో లిప్యంతరీకరించాం.
theological_decisions:
- issue: అహీతోఫెలు తరువాత యెహోయాదా, అబ్యాతారుల పాత్ర
  choice: అతని స్థానంలో సలహాదారులయ్యారు
  alternative: ‘అహీతోఫెలు తరువాత బెనాయా కుమారుడైన యెహోయాదా, అబ్యాతారు’ అని క్రియ లేకుండా ఉంచడం
  rationale: ముందరి వచనంలోని రాజ సలహాదారుల జాబితా సందర్భం ఈ పాత్రను సూచిస్తుంది. అయినా మూల హీబ్రూలో క్రియ, పదవి రెండూ స్పష్టంగా లేనందున పాదసూచికలో అక్షరార్థ నిర్మాణాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; పరిపాలనా జాబితాకు తగిన గంభీరమైన, సులభమైన శైలి. మూలంలోని క్రియారాహిత్యాన్ని ప్రధాన పాఠంలో సందర్భానుసారంగా స్పష్టం చేసి, దాని అస్పష్టతను పాదసూచికలో భద్రపరిచాం.
