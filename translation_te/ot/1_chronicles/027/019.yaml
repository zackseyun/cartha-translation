  text: for Zebulun, Ishmaiah son of Obadiah; for Naphtali, Jerimoth son of Azriel.
translation:
  language: te
  text: జెబూలూను గోత్రానికి, ఓబద్యా కుమారుడు ఇష్మయా; నఫ్తాలి గోత్రానికి, అజ్రీయేలు కుమారుడు యెరీమోతు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִזְבוּלֻן
  choice: జెబూలూను గోత్రానికి
  rationale: లְ ఉపసర్గ ఈ పరిపాలనా జాబితాలో నియామకం లేదా ప్రాతినిధ్యాన్ని సూచిస్తుంది. తెలుగులో గోత్రం అని స్పష్టీకరించడం సహజంగా ఉండి సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: יִשְׁמַעְיָהוּ
  choice: ఇష్మయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వ్యక్తిని తండ్రి పేరుతో గుర్తించే ఈ నిర్మాణంలో בֶּן ప్రత్యక్ష పుత్ర సంబంధాన్ని సూచిస్తుంది.
- source_word: עֹבַדְיָהוּ
  choice: ఓబద్యా
  rationale: హీబ్రూ వ్యక్తినామానికి సులభంగా చదవగల తెలుగు లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: לְנַפְתָּלִי
  choice: నఫ్తాలి గోత్రానికి
  rationale: ముందటి భాగంతో సమాంతరంగా, లְ ఉపసర్గ గోత్ర సంబంధిత నియామకం లేదా ప్రాతినిధ్యాన్ని సూచిస్తుంది.
- source_word: יְרִימוֹת
  choice: యెరీమోతు
  rationale: హీబ్రూ వ్యక్తినామాన్ని సహజమైన తెలుగు బైబిలు శైలిలో లిప్యంతరీకరించాం.
- source_word: עַזְרִיאֵל
  choice: అజ్రీయేలు
  rationale: హీబ్రూ వ్యక్తినామ ఉచ్చారణను సమీపంగా ప్రతిబింబించే తెలుగు రూపాన్ని ఎంచుకున్నాం.
