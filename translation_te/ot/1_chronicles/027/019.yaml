translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త పరిపాలనా జాబితా శైలిని నిలిపాం. మూలంలోని సమాంతర నిర్మాణాన్ని అర్ధవిరామంతో చూపించాం; ఈ సందర్భంలో לְ యొక్క ప్రాతినిధ్య భావాన్ని స్పష్టపరచడానికి రెండు గోత్రనామాల దగ్గర ‘గోత్రానికి’ చేర్చాం.
