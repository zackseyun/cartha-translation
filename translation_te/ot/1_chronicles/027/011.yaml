  terminology: విభాగం suitably renders the military-administrative מַחֲלֻקָה. జెరహీయుల వంశానికి చెందిన conveys likely clan affiliation while the footnote preserves the singular-gentilic alternative. హుషాతీయుడైన is the more source-faithful Telugu transliteration of the Hushathite designation.
  issues:
  - severity: low
    issue: The name-adjective “హూషాతీయుడైన” has a long ఊ vowel.
    rationale: The Hebrew חֻ in הַחֻשָׁתִי has a short u vowel. “హుషాతీయుడైన” more closely represents the source form and aligns with the conventional Hushathite rendering.
