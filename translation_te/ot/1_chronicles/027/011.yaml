source:
  edition: WLC
  text: הַ/שְּׁמִינִי֙ לַ/חֹ֣דֶשׁ הַ/שְּׁמִינִ֔י סִבְּכַ֥י הַ/חֻשָׁתִ֖י לַ/זַּרְחִ֑י וְ/עַל֙ מַחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/011.yaml
  text: 'The eighth[a], for the eighth month: Sibbecai the Hushathite, of the Zerahites; and over his division were twenty-four thousand.'
translation:
  language: te
  text: 'ఎనిమిదవ నెలకు ఎనిమిదవవాడు: జెరహీయుల వంశానికి చెందిన[a] హుషాతీయుడైన సిబ్బెకై; అతని విభాగంలో ఇరవై నాలుగు వేలమంది ఉన్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జెరహీయుడు.” హీబ్రూ పదబంధాన్ని అక్షరార్థంగా ఏకవచన జాతివాచకంగా తీసుకోవచ్చు; అయితే ఈ సందర్భంలో అది జెరహీయుల వంశంతో ఉన్న అనుబంధాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁמִינִי
  choice: ఎనిమిదవవాడు
  rationale: సైనిక విభాగాల పట్టికలో అధిపతిని సూచించే నామవాచకం విడిచిపెట్టబడి, క్రమసంఖ్య ఒక్కటే ఉంది. తెలుగు వాక్యానికి సహజంగా ఉండేలా పుంలింగ ఏకవచన రూపాన్ని వాడుతూ, ‘అధిపతి’ వంటి పదాన్ని మూలంలో లేనందున చేర్చలేదు.
- source_word: לַחֹדֶשׁ הַשְּׁמִינִי
  choice: ఎనిమిదవ నెలకు
  rationale: ఈ పరిపాలనా జాబితాలో ל ఉపసర్గ నెలవారీ సేవా నియామకాన్ని సూచిస్తుంది; సంక్షిప్తమైన మూల నిర్మాణాన్ని తెలుగు సహజంగా నిలుపుతుంది.
- source_word: סִבְּכַי
  choice: సిబ్బెకై
  rationale: హీబ్రూ వ్యక్తినామ ధ్వనిరూపానికి సమీపంగా తెలుగు లిప్యంతరీకరణ చేయబడింది.
- source_word: הַחֻשָׁתִי
  choice: హూషాతీయుడైన
  rationale: ఈ జాతి/స్థల సంబంధ విశేషణం సిబ్బెకైకి ఉన్న హూషా సంబంధాన్ని సూచిస్తుంది; తెలుగు వ్యక్తి-సంబంధ రూపంలో అందించబడింది.
- source_word: לַזַּרְחִי
  choice: జెరహీయుల వంశానికి చెందిన
  rationale: ఈ సందర్భంలో ל కలిగిన జాతివాచక రూపం వంశ అనుబంధాన్ని సూచించే అవకాశం ఎక్కువ. అయితే హీబ్రూలోని ఏకవచన జాతివాచక రూపాన్ని ‘జెరహీయుడు’ అని కూడా అనువదించవచ్చు; ఆ ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: מַחֲלֻקְתּוֹ
  choice: అతని విభాగం
  rationale: ఈ అధ్యాయపు సైనిక-పరిపాలనా సందర్భంలో מַחֲלֻקָה ఒక వ్యవస్థీకృత సైనిక విభాగాన్ని సూచిస్తుంది.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: ఇరవై నాలుగు వేలమంది
  rationale: సైనికుల సంఖ్యను సూచిస్తున్నందున తెలుగులో వ్యక్తులను తెలిపే ‘మంది’ చేర్చి సంఖ్యను సహజంగా వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సైనిక-పరిపాలనా జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని సంక్షిప్త క్రమసంఖ్య నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, అర్థస్పష్టత కోసం తెలుగు విభక్తులు సహజంగా అమర్చబడ్డాయి.
