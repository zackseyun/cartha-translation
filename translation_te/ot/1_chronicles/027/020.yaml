source:
  edition: WLC
  text: לִ/בְנֵ֣י אֶפְרַ֔יִם הוֹשֵׁ֖עַ בֶּן עֲזַזְיָ֑הוּ לַ/חֲצִי֙ שֵׁ֣בֶט מְנַשֶּׁ֔ה יוֹאֵ֖ל בֶּן פְּדָיָֽהוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/020.yaml
  text: 'For the sons of Ephraim: Hoshea son of Azaziah[a]; for the half-tribe of Manasseh: Joel son of Pedaiah.'
translation:
  language: te
  text: 'ఎఫ్రాయిము వంశస్థుల కొరకు: అజజ్యాహు కుమారుడు హోషేయ[a]; మనష్షే అర్ధగోత్రం కొరకు: పెదాయాహు కుమారుడు యోవేలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హోషేయ అనే పేరును ఆంగ్లంలో కొన్నిసార్లు ‘Hosea’ అని కూడా లిప్యంతరీకరిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/בְנֵי אֶפְרַיִם
  choice: ఎఫ్రాయిము వంశస్థుల కొరకు
  rationale: లְ ఉపసర్గం ఈ పరిపాలనా జాబితాలో బాధ్యత లేదా నియామకాన్ని సూచిస్తుంది. בְנֵי అక్షరార్థంగా ‘కుమారులు’ అయినప్పటికీ, ఇక్కడ ఒక గోత్రానికి చెందిన వంశస్థులను సూచిస్తున్నందున ఆధునిక తెలుగులో సహజమైన ‘వంశస్థులు’ అని అనువదించబడింది.
- source_word: הוֹשֵׁעַ
  choice: హోషేయ
  rationale: హీబ్రూ పేరులోని ధ్వనులను సమీపంగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశావళి మరియు పేర్ల జాబితాల్లో తండ్రి-కొడుకు సంబంధాన్ని తెలిపే సాధారణ తెలుగు పదం.
- source_word: עֲזַזְיָהוּ
  choice: అజజ్యాహు
  rationale: హీబ్రూ వ్యక్తినామానికి ధ్వన్యనుసారమైన తెలుగు లిప్యంతరీకరణ; చివరి יהו భాగం ‘యాహు’గా నిలుపబడింది.
- source_word: לַ/חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: మనష్షే అర్ధగోత్రం కొరకు
  rationale: לְ నియామకాన్ని సూచిస్తుంది; חֲצִי שֵׁבֶט అంటే ‘అర్ధగోత్రం.’ ఇది మనష్షే గోత్రంలోని ఒక భాగాన్ని సూచిస్తుంది.
- source_word: יוֹאֵל
  choice: యోవేలు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు లిప్యంతరీకరణ.
- source_word: פְּדָיָהוּ
  choice: పెదాయాహు
  rationale: హీబ్రూ పేరును ధ్వన్యనుసారంగా లిప్యంతరీకరించి, దాని చివరి יהו భాగాన్ని ‘యాహు’గా నిలుపుతుంది.
