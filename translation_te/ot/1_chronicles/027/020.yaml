translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పరిపాలనా జాబితాకు తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలి వాడబడింది. ‘కుమారులు’ అనే అక్షరార్థ రూపం తక్షణ సంతానాన్ని సూచించే అవకాశం ఉన్నందున, గోత్రసంబంధ భావాన్ని స్పష్టంగా తెలిపే ‘వంశస్థులు’ ఎంచుకోబడింది.
