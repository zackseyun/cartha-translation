  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לִֽ/יהוּדָ֕ה אֱלִיה֖וּ מֵ/אֲחֵ֣י דָוִ֑יד לְ/יִ֨שָׂשכָ֔ר עָמְרִ֖י בֶּן מִיכָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/018.yaml
  text: For Judah[a], Elihu, one of David’s brothers; for Issachar, Omri son of Michael.
translation:
  language: te
  text: యూదా గోత్రానికి దావీదు సహోదరులలో ఒకడైన ఎలీహు[a]; ఇశ్శాఖారు గోత్రానికి మీకాయేలు కుమారుడైన ఒమ్రీ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘ఎలీహు’ అని ఉంది. కొన్ని ప్రాచీన అనువాదాలు, వ్యాఖ్యాతలు ‘ఎలీయాబు’ అని చదువుతారు; ఇతర చోట్ల దావీదు సహోదరునికి ఉన్న పేరుతో సరిపోల్చడం వల్ల ఈ పఠనం వచ్చి ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: לִיהוּדָה
  choice: యూదాకు
  rationale: ఈ పరిపాలనా జాబితాలో ל ఉపసర్గ గోత్రాన్ని పరిచయం చేస్తుంది; జాబితా నిర్మాణాన్ని నిలుపుతూ సహజమైన తెలుగులో ‘యూదాకు’ అని అనువదించాం.
- source_word: אֱלִיהוּ
  choice: ఎలీహు
  rationale: మసొరా హీబ్రూ పాఠంలో ఉన్న పేరును నేరుగా లిప్యంతరీకరించాం; ‘ఎలీయాబు’ అనే ప్రత్యామ్నాయ పఠనాన్ని ప్రధాన పాఠంలోకి తీసుకురాకుండా పాదసూచికలో ఇచ్చాం.
- source_word: מֵאֲחֵי דָוִיד
  choice: దావీదు సహోదరుల్లో ఒకడైన
  rationale: מִן తో కూడిన బహువచన నిర్మాణం భాగార్థకమైనది—దావీదు సహోదరులలో ఒకడని సూచిస్తుంది. తెలుగులో స్పష్టంగా, సహజంగా ఉండే రూపాన్ని ఎంచుకున్నాం.
- source_word: לְיִשָׂשכָר
  choice: ఇశ్శాఖారుకు
  rationale: ముందున్న యూదా మాదిరిగానే ל ఉపసర్గ గోత్ర ప్రతినిధిని పరిచయం చేస్తుంది.
- source_word: עָמְרִי
  choice: ఒమ్రీ
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సాధారణంగా గుర్తించదగిన విధంగా లిప్యంతరీకరించాం.
- source_word: בֶּן מִיכָאֵל
  choice: మిఖాయేలు కుమారుడు
  rationale: హీబ్రూ వంశసూచక నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో అందించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పరిపాలనా జాబితాకు తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలిని ఉపయోగించాం. గోత్ర శీర్షికల సమాంతర నిర్మాణాన్ని నిలిపాం; పాదసూచిక గుర్తును అది వివరిస్తున్న ‘ఎలీహు’ పేరుకే జతచేశాం.
