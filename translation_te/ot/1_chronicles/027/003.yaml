translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని సంక్షిప్త నామవాచక వాక్యాన్ని తెలుగులో స్పష్టత కోసం ‘ఒకడైన అతడు’తో పూర్తి వాక్యంగా తీర్చిదిద్దాం; వంశపరమైన మరియు సైనిక పదాల అర్థవిస్తృతిని పాదసూచికల్లో నిలిపాం.
