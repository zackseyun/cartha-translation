  variant: modern standard Telugu
source:
  edition: WLC
  text: מִן בְּנֵי פֶ֗רֶץ הָ/רֹ֛אשׁ לְ/כָל שָׂרֵ֥י הַ/צְּבָא֖וֹת לַ/חֹ֥דֶשׁ הָ/רִאשֽׁוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/003.yaml
  text: From the sons of Perez[b][a], the chief over all the commanders of the divisions for the first month.
translation:
  language: te
  text: అతడు పెరెసు కుమారులలోనివాడు[a]; మొదటి నెలకు చెందిన సైనిక విభాగాల[b] అధిపతులందరిపై ప్రధాన అధిపతి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పెరెసు వంశస్థులలోనివాడు.’ హీబ్రూలో అక్షరార్థంగా ‘పెరెసు కుమారులలోనివాడు’ అని ఉంది; వంశావళి సందర్భంలో ఈ మాట విస్తృతమైన వంశపరంపరను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పదానికి ‘సైన్యాలు’ లేదా ‘సేనలు’ అనే అర్థం కూడా ఉండవచ్చు. అయితే ఈ అధ్యాయంలో అది నెలవారీగా వ్యవస్థీకరించిన సైనిక విభాగాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן
  choice: లో ఒకడైన
  rationale: ఈ ఉపసర్గ పెరెసు వంశానికి చెందినవాడని సూచిస్తుంది; తెలుగులో సహజంగా ఉండేందుకు ‘లో ఒకడైన’ అని అనువదించబడింది.
- source_word: בְּנֵי פֶרֶץ
  choice: పెరెసు కుమారులు
  rationale: హీబ్రూ పదబంధంలోని ‘కుమారులు’ అనే రూపాన్ని నిలుపుతూ, అది విస్తృత వంశపరంపరను కూడా సూచించగలదని పాదసూచికలో తెలిపాం.
- source_word: הָרֹאשׁ
  choice: ముఖ్యుడు
  rationale: ఇక్కడ ఈ పదం అత్యున్నత నాయకత్వ స్థానాన్ని సూచిస్తుంది; ‘ముఖ్యుడు’ సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: לְכָל
  choice: అందరికీ
  rationale: తరువాతి అధికారులందరిపై అతనికి ఉన్న ప్రధాన నాయకత్వ పరిధిని తెలుగులో ఈ రూపం సహజంగా తెలియజేస్తుంది.
- source_word: שָׂרֵי הַצְּבָאוֹת
  choice: సైనిక దళాల అధిపతులు
  rationale: צְבָאוֹת సాధారణంగా సైన్యాలు లేదా సమూహాలను సూచించినా, ఈ అధ్యాయంలో నెలవారీగా వ్యవస్థీకరించిన సైనిక దళాలు ఉద్దేశించబడ్డాయి.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: మొదటి నెలకు సంబంధించిన
  rationale: ఈ పదబంధం నెలవారీ సేవా వంతులో మొదటి నెలను సూచిస్తుంది; తెలుగులో వాక్య సంబంధం స్పష్టంగా ఉండేందుకు ఈ రూపం ఎంచుకోబడింది.
