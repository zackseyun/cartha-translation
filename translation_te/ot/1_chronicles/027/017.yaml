  terminology: The transliterated names are consistent and recognizable Telugu biblical forms. “వంశానికి” makes the Hebrew metonymy understandable while retaining the names Levi and Aaron. The footnote correctly preserves the Hebrew’s more literal wording and notes the Aaronic-priestly reference without imposing it on the main text.
