  edition: WLC
  text: לְ/לֵוִ֛י חֲשַׁבְיָ֥ה בֶן קְמוּאֵ֖ל לְ/אַהֲרֹ֥ן צָדֽוֹק־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/017.yaml
  text: for Levi[a], Hashabiah son of Kemuel; for Aaron, Zadok.
translation:
  language: te
  text: లేవి వంశానికి, కెమూయేలు కుమారుడు హషబ్యా; అహరోను వంశానికి[a], సాదోకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో అక్షరార్థంగా ‘అహరోనుకు’; ఇక్కడ ఇది అహరోను యాజక వంశాన్ని, అంటే అహరోనీయులను సూచించే అవకాశం ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: לְ/לֵוִי
  choice: లేవి వంశానికి
  rationale: ఈ పరిపాలనా జాబితాలో לְ అనే ఉపసర్గ, పేర్కొన్న అధికారి ఏ గోత్రం లేదా వంశానికి సంబంధించినవాడో సూచిస్తుంది. కేవలం ‘లేవికి’ అనడం ఆధునిక తెలుగులో వ్యక్తినే సూచిస్తున్నట్టు అనిపించవచ్చు; ‘లేవి వంశానికి’ అనేది మూలంలోని పూర్వికుని పేరును నిలుపుతూ ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: חֲשַׁבְיָה
  choice: హషబ్యా
  rationale: వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: בֶן
  choice: కుమారుడు
  rationale: హెబ్రీ వంశసంబంధ నిర్మాణానికి సహజమైన తెలుగు సమానం.
- source_word: קְמוּאֵל
  choice: కెమూయేలు
  rationale: వ్యక్తి పేరును తెలుగులో సహజంగా పలికే విధంగా లిప్యంతరీకరించాం.
- source_word: לְ/אַהֲרֹן
  choice: అహరోను వంశానికి
  rationale: జాబితా సందర్భంలో పూర్వికుడైన అహరోను పేరుతో అతని యాజక వంశం సూచించబడుతోంది. ‘వంశానికి’ అనే పదం తెలుగు పాఠకుడికి ఈ సంక్షిప్త ప్రయోగాన్ని స్పష్టం చేస్తుంది; మూలంలోని అహరోను పేరును అలాగే నిలుపుతుంది.
- source_word: צָדוֹק
  choice: సాదోకు
  rationale: వ్యక్తి పేరును ప్రాచుర్యంలో ఉన్న తెలుగు బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: ‘అహరోను’ అనే పేరు అహరోను యాజక వంశాన్ని సూచిస్తుందా?
  choice: ప్రధాన పాఠ్యంలో ‘అహరోను వంశానికి’ అని అనువదించడం
  alternative: అహరోనుకు; అహరోనీయులకు
  rationale: హెబ్రీలో అక్షరార్థంగా ‘అహరోనుకు’ ఉన్నప్పటికీ, ఈ పరిపాలనా జాబితాలో జీవించి ఉన్న వ్యక్తిగా అహరోనును ఉద్దేశించలేదు; అతని వంశీయ సమూహాన్ని పూర్వికుని పేరుతో సూచిస్తుంది. ‘వంశానికి’ అనేది సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది. అయితే యాజకత్వాన్ని ప్రధాన పాఠ్యంలో అదనంగా చేర్చకుండా, దానిని పాదటిప్పణిలో వివరిస్తాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త జాబితా శైలిని నిలిపాం. సెమీకోలన్ ద్వారా రెండు సమాంతర నియామకాలను వేరు చేశాం. పేర్లకు గౌరవప్రదమైన, తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపాలను ఉపయోగించాం.
