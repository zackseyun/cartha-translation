  text: הָֽ/רְבִיעִ֞י לַ/חֹ֣דֶשׁ הָ/רְבִיעִ֗י עֲשָׂה אֵל֙ אֲחִ֣י יוֹאָ֔ב וּ/זְבַדְיָ֥ה בְנ֖/וֹ אַחֲרָ֑י/ו וְ/עַל֙ מַחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/007.yaml
  text: The fourth[a], for the fourth month, was Asahel the brother of Joab, and Zebadiah his son after him; and over his division were twenty-four thousand.
translation:
  language: te
  text: నాలుగవ నెలకు నాలుగవ నాయకుడు యోవాబు సోదరుడైన ఆసాహేలు; అతని తర్వాత[a] అతని కుమారుడు జెబద్యా. అతని విభాగంలో ఇరవై నాలుగు వేల మంది ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, భావాన్ని మరింత స్పష్టంగా చెబితే, “అతని కుమారుడు జెబద్యా అతని స్థానాన్ని చేపట్టాడు.” హీబ్రూలో అక్షరార్థంగా “అతని తర్వాత” అని ఉంది; ఇది ఇక్కడ వారసత్వ క్రమాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְבִיעִי לַחֹדֶשׁ הָרְבִיעִי
  choice: నాలుగవ నెలకు నాలుగవవాడు
  rationale: నెలవారీ వంతుల జాబితాలోని సంక్షిప్త రూపాన్ని నిలుపుతూ, నాలుగవ నెలకు సంబంధించిన నాలుగవ నియామకాన్ని సూచిస్తుంది; మూలంలో స్పష్టంగా లేని ‘అధిపతి’ లేదా ‘విభాగం’ అనే నామవాచకాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: עֲשָׂהאֵל אֲחִי יוֹאָב
  choice: యోవాబు సోదరుడైన అసాహేలు
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చి, హీబ్రూ సంబంధ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేసింది.
- source_word: וּזְבַדְיָה בְנוֹ אַחֲרָיו
  choice: అతని తర్వాత అతని కుమారుడు జెబద్యా
  rationale: אַחֲרָיו అనే ‘అతని తర్వాత’ అన్న మూలభాషా వ్యక్తీకరణను నిలిపి, సందర్భంలో ఉన్న వారసత్వ క్రమాన్ని పాదసూచికలో వివరించింది.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: అతని విభాగంలో
  rationale: ఈ అధ్యాయంలో מַחֲלֻקָה నెలవారీ సైనిక విభాగాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో సభ్యుల సంఖ్యను సహజంగా తెలపడానికి ‘విభాగంలో’ అని అనువదించింది.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: ఇరవై నాలుగు వేల మంది
  rationale: సంఖ్యను ఆధునిక తెలుగు పద్ధతిలో ఇచ్చింది; జాబితా సైనికులది కాబట్టి తెలుగులో అవసరమైన ‘మంది’ని చేర్చింది.
