translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలిలోని సంక్షిప్తతను సాధ్యమైనంతవరకు నిలిపి, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన భాషను ఉపయోగించింది. పాదసూచిక సూచికను అది వివరించే ‘అతని తర్వాత’ అనే పదబంధం వద్ద ఉంచింది.
