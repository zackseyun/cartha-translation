id: 1CH.27.6
reference: 1 Chronicles 27:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: ה֧וּא בְנָיָ֛הוּ גִּבּ֥וֹר הַ/שְּׁלֹשִׁ֖ים וְ/עַל הַ/שְּׁלֹשִׁ֑ים וּ/מַ֣חֲלֻקְתּ֔/וֹ עַמִּיזָבָ֖ד בְּנֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/006.yaml
  text: This was Benaiah[a], a mighty man of the Thirty and over the Thirty; and his division was under Ammizabad his son.
translation:
  language: te
  text: అతడే బెనాయా; అతడు ముప్పైమంది వీరులలో పరాక్రమవంతుడు, ఆ ముప్పైమందికి అధిపతి. అతని విభాగానికి అతని కుమారుడు అమ్మీజాబాదు నాయకుడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוּא
  choice: అతడే
  rationale: ముందటి వచనంలో పేర్కొన్న బెనాయాను మళ్లీ నొక్కిచెప్పే సూచనాత్మక సర్వనామంగా సహజమైన తెలుగులో అనువదించబడింది.
- source_word: גִּבּוֹר
  choice: పరాక్రమశాలి
  rationale: యుద్ధశౌర్యం గల వీరుణ్ణి సూచించే సైనిక-వీరోచిత భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַשְּׁלֹשִׁים
  choice: ముప్పైమంది వీరులు
  rationale: ఇది కేవలం సంఖ్య కాకుండా దావీదుతో సంబంధమున్న ప్రసిద్ధ యోధుల బృందాన్ని సూచిస్తుంది; 'వీరులు'ను చేర్చడం తెలుగు పాఠకునికి సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: וְעַל הַשְּׁלֹשִׁים
  choice: ఆ ముప్పైమందికి అధిపతి
  rationale: עַל ఇక్కడ ఆ బృందంపై అధికారాన్ని సూచిస్తుంది. తెలుగులో 'మీద' అనే అక్షరార్థ రూపం అసహజంగా ఉండడం వల్ల సందర్భానుగుణంగా 'అధిపతి' వాడబడింది.
- source_word: מַחֲלֻקְתּוֹ
  choice: అతని దళం
  rationale: ఈ అధ్యాయంలోని సందర్భంలో మారుమారుగా సేవచేసే సైనిక విభాగాన్ని సూచిస్తుంది; 'దళం' సహజమైన, సంక్షిప్తమైన తెలుగు సమానం.
- source_word: עַמִּיזָבָד בְּנוֹ
  choice: అతని కుమారుడు అమ్మీజాబాదు
  rationale: హీబ్రూ భావాన్ని సహజ తెలుగు పదక్రమంలో అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన సైనిక పదజాలం వాడబడింది. హీబ్రూలో చివరి వాక్యం అక్షరార్థంగా ‘అతని దళం—అతని కుమారుడు అమ్మీజాబాదు’ అని ఉంది; ఇది కుమారుడు దళంపై కార్యనిర్వహణ బాధ్యత వహించాడనే భావంతో సహజ తెలుగులో వ్యక్తీకరించబడింది.
