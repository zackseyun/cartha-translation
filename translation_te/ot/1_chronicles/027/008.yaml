  edition: WLC
  text: הַ/חַמִישִׁי֙ לַ/חֹ֣דֶשׁ הַ/חֲמִישִׁ֔י הַ/שַּׂ֖ר שַׁמְה֣וּת הַ/יִּזְרָ֑ח וְ/עַל֙ מַחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/008.yaml
  text: The fifth[a], for the fifth month, was the commander Shamhuth the Izrahite; and over his division were twenty-four thousand.
translation:
  language: te
  text: ఐదవ నెలకు నియమించబడిన ఐదవ దళానికి యిజ్రాహీయుడైన[a] షమ్హూతు అధిపతి. అతని దళంలో 24,000 మంది ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జెరహీయుడు.” కొన్ని అనువాదాల్లో ఈ హీబ్రూ వంశనామాన్ని సంప్రదాయంగా ఇలా అనువదించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: ఐదవ దళానికి
  rationale: సైనిక దళాల వరుసలో ఐదవదాన్ని సూచించే నామవాచకార్థక క్రమసంఖ్య. సందర్భంలో అంతర్లీనంగా ఉన్న ‘దళం’ అనే పదాన్ని తెలుగులో స్పష్టత కోసం చేర్చాం.
- source_word: לַחֹדֶשׁ הַחֲמִישִׁי
  choice: ఐదవ నెలకు నియమించబడిన
  rationale: ఈ అధ్యాయంలో ప్రతి దళం ఒక్కో నెలకు సేవ చేయడానికి నియమించబడింది; ఆ పరిపాలనా భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: הַשַּׂר
  choice: అధిపతి
  rationale: సైనిక దళానికి నాయకత్వం వహించే అధికారిని సూచించే గౌరవప్రదమైన, సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: שַׁמְהוּת
  choice: షమ్హూతు
  rationale: మసొరెటిక్ స్వరచిహ్నాలకు అనుగుణంగా వ్యక్తి పేరును తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: הַיִּזְרָח
  choice: యిజ్రాహీయుడు
  rationale: హీబ్రూ పాఠంలోని రూపాన్ని దగ్గరగా ప్రతిబింబించే వంశ/ప్రాంత సూచక పదం. ‘జెరహీయుడు’ అనే సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: అతని దళంలో ... మంది ఉన్నారు
  rationale: מַחֲלֻקָה ఇక్కడ సైనిక విభాగాన్ని సూచిస్తుంది. హీబ్రూ పరిపాలనా నిర్మాణ భావాన్ని సహజమైన తెలుగు వాక్యంగా వ్యక్తం చేశాం.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24,000 మంది
  rationale: వ్యక్తుల సంఖ్య అని స్పష్టపరుస్తూ ఆధునిక తెలుగు పఠనానికి అనువుగా అంకెలతో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సైనిక-పరిపాలనా జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి వాడాం. మూలంలోని సంక్షిప్త నిర్మాణాన్ని స్పష్టత కోసం రెండు వాక్యాలుగా ఇచ్చాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘యిజ్రాహీయుడు’ పదానికే జోడించాం.
