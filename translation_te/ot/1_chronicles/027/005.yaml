    rationale: ‘ప్రధాన యాజకుడైన యెహోయాదా’ అనే ప్రత్యామ్నాయం ప్రధాన పాఠ్యంలోని యెహోయాదాకు రెండు హోదాలు వర్తించే పఠనంతో దాదాపు ఒకటే. నిజమైన ప్రత్యామ్నాయం ‘ప్రధానుడు’ బెనాయాకు వర్తించడమే.
