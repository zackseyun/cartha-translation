source:
  edition: WLC
  text: שַׂ֣ר הַ/צָּבָ֤א הַ/שְּׁלִישִׁי֙ לַ/חֹ֣דֶשׁ הַ/שְּׁלִישִׁ֔י בְּנָיָ֧הוּ בֶן יְהוֹיָדָ֛ע הַ/כֹּהֵ֖ן רֹ֑אשׁ וְ/עַל֙ מַחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/005.yaml
  text: The commander of the third division for the third month was Benaiah son of Jehoiada the chief[a], and in his division were twenty-four thousand.
translation:
  language: te
  text: మూడవ నెలలోని మూడవ దళానికి సేనాధిపతి యాజకుడును ప్రధానుడునైన యెహోయాదా కుమారుడు బెనాయా.[a] అతని దళంలో ఇరవై నాలుగు వేలమంది ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాజకుడైన యెహోయాదా కుమారుడైన బెనాయా ప్రధానుడు.” హీబ్రూలో ‘యాజకుడు’ మరియు ‘ప్రధానుడు’ అనే హోదాలు యెహోయాదాకా లేక బెనాయాకా వర్తిస్తాయన్నది వ్యాకరణపరంగా పూర్తిగా స్పష్టంగా లేదు.
    reason: హీబ్రూ הַכֹּהֵן רֹאשׁ పదబంధంలోని హోదాల అనుబంధానికి ఉన్న సాధ్యమైన ప్రత్యామ్నాయ పఠనాన్ని సూచించడానికి.
lexical_decisions:
- source_word: שַׂר הַצָּבָא
  choice: సేనాధిపతి
  rationale: שַׂר הַצָּבָא సైనిక అధికారిని సూచిస్తుంది; నెలవారీ దళాలకు నాయకత్వం వహించే పదవికి ‘సేనాధిపతి’ సహజమైన, సంక్షిప్తమైన తెలుగు పదం.
- source_word: הַשְּׁלִישִׁי לַחֹדֶשׁ הַשְּׁלִישִׁי
  choice: మూడవ నెలకు సంబంధించిన మూడవ దళానికి
  rationale: మొదటి ‘మూడవ’ అనేది సందర్భానుసారం అంతర్లీనంగా ఉన్న సైనిక దళాన్ని, రెండవది నెలను సూచిస్తుంది; తెలుగులో అర్థం స్పష్టంగా ఉండేందుకు ‘దళం’ చేర్చబడింది.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: యెహోయాదా కుమారుడైన బెనాయా
  rationale: వ్యక్తినామాలను ప్రామాణిక తెలుగు బైబిలు రూపాలకు దగ్గరగా లిప్యంతరీకరించి, హీబ్రూ వంశసంబంధాన్ని సహజమైన తెలుగు క్రమంలో తెలిపింది.
- source_word: הַכֹּהֵן רֹאשׁ
  choice: యాజకుడు, ప్రధానుడు
  rationale: హీబ్రూ పదక్రమాన్ని మరియు దాని వ్యాకరణ అస్పష్టతను కాపాడుతూ הַכֹּהֵן ను ‘యాజకుడు,’ רֹאשׁ ను ‘ప్రధానుడు’గా విడిగా అనువదించింది; రెండింటినీ కలిపి ‘ప్రధాన యాజకుడు’ అని నిర్ణయాత్మకంగా చేయలేదు.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: అతని దళంలో ... ఉన్నారు
  rationale: ఈ అధ్యాయంలోని పునరావృత సూత్రంలో מַחֲלֻקָה సైనిక దళాన్ని సూచిస్తుంది; తరువాత వచ్చే సంఖ్య దళబలాన్ని తెలుపుతున్నందున ఈ రూపం సహజమైన తెలుగు.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: ఇరవై నాలుగు వేలమంది
  rationale: సైనికుల సంఖ్యను సూచిస్తున్నందున సంఖ్యకు వ్యక్తివాచకమైన ‘మంది’ జోడించడం తెలుగులో సహజం.
theological_decisions:
- issue: הַכֹּהֵן רֹאשׁ అనే పదబంధం ఎవరిని, ఏ హోదాతో సూచిస్తుంది
  choice: యెహోయాదాను ‘యాజకుడు, ప్రధానుడు’గా చదివే రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘ప్రధాన యాజకుడైన యెహోయాదా కుమారుడు బెనాయా’ లేదా ‘యాజకుడైన యెహోయాదా కుమారుడు బెనాయా ప్రధానుడు’
  rationale: హీబ్రూ పదబంధం అనుబంధ నిర్మాణంలో అస్పష్టంగా ఉంది. ఒకే హోదాగా ‘ప్రధాన యాజకుడు’ అని అనువదిస్తే సాధ్యమైన ఇతర పఠనాన్ని మూసివేస్తుంది; అందువల్ల అస్పష్టతను పాఠ్యంలో నిలిపి, ప్రత్యామ్నాయాలను పాదటిప్పణిలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. ‘దళం,’ ‘సేనాధిపతి’ వంటి సాధారణ సైనిక పదాలు ఉపయోగించబడ్డాయి; మూలంలోని నిజమైన వ్యాకరణ అస్పష్టత పాదటిప్పణితో నిలుపబడింది.
