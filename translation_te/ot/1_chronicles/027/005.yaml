revisions:
- from: మూడవ నెలకు సంబంధించిన మూడవ దళానికి సేనాధిపతి యెహోయాదా కుమారుడైన బెనాయా; యెహోయాదా యాజకుడు, ప్రధానుడు.[a] అతని దళంలో ఇరవై నాలుగు వేలమంది ఉన్నారు.
  to: మూడవ నెలలోని మూడవ దళానికి సేనాధిపతి యాజకుడును ప్రధానుడునైన యెహోయాదా కుమారుడు బెనాయా.[a] అతని దళంలో ఇరవై నాలుగు వేలమంది ఉన్నారు.
  rationale: సవరణ ప్రధాన వాక్యాన్ని వ్యాకరణపరంగా పూర్తి చేసి, హీబ్రూ పదక్రమంలోని యెహోయాదా-యాజకుడు-ప్రధానుడు పఠనాన్ని సహజ తెలుగు అనుబంధంగా వ్యక్తం చేస్తుంది. ‘ప్రధానుడు’ బెనాయాను సూచించవచ్చనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో స్పష్టంగా భద్రపరుస్తుంది; అందుచేత వివాదాస్పద అనుబంధాన్ని ఏకపక్షంగా మూసివేయదు.
