  yaml_path: translation/ot/1_chronicles/027/022.yaml
  text: 'For Dan: Azarel son of Jeroham[a]. These were the leaders of the tribes of Israel.'
translation:
  language: te
  text: దాను గోత్రానికి యెరోహాము కుమారుడైన అజరేలు. వీరందరూ ఇశ్రాయేలు గోత్రాల నాయకులు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రధానులు’ లేదా ‘అధికారులు’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/דָן
  choice: దాను గోత్రానికి
  rationale: లְ ఉపసర్గ ఈ పరిపాలనా జాబితాలో సంబంధిత గోత్రాన్ని సూచిస్తుంది; తెలుగులో స్పష్టత కోసం ‘గోత్రానికి’ అని వ్యక్తపరచబడింది.
- source_word: עֲזַרְאֵל
  choice: అజరేలు
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపంగా, తెలుగులో సహజంగా ఉచ్చరించగల లిప్యంతరీకరణ.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశసంబంధాన్ని తెలిపే సాధారణమైన, పారదర్శకమైన తెలుగు పదం.
- source_word: יְרֹחָם
  choice: యెరోహాము
  rationale: హీబ్రూ వ్యక్తినామాన్ని మూల ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֵלֶּה
  choice: వీరు
  rationale: మనుషుల సమూహాన్ని సూచిస్తున్నందున తెలుగు సందర్భంలో ‘వీరు’ సహజంగా ఉంటుంది.
- source_word: שָׂרֵי
  choice: నాయకులు
  rationale: గోత్రాలపై బాధ్యత వహించే ప్రధానులను సూచించే విస్తృతమైన పదం; ‘అధికారులు’ లేదా ‘ప్రధానులు’ అనే భావాలు కూడా సందర్భంలో సాధ్యమే.
- source_word: שִׁבְטֵי
  choice: గోత్రాల
  rationale: ఇశ్రాయేలు వంశాధారిత విభాగాలకు ప్రామాణికమైన ఆధునిక తెలుగు పదం.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు
  rationale: హీబ్రూ జాతీయ నామానికి సుపరిచితమైన తెలుగు బైబిలు రూపం.
