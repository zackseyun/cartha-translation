translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన పరిపాలనా జాబితా శైలిని నిలిపి, వ్యక్తినామాలను మూల హీబ్రూకు సమీపంగా లిప్యంతరీకరించాం. మూలంలోని క్రియలేని వాక్య నిర్మాణాన్ని తెలుగులో సహజమైన నామవాక్యాలుగా అందించాం.
