  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַל הַ֨/גְּמַלִּ֔ים אוֹבִ֖יל הַ/יִּשְׁמְעֵלִ֑י וְ/עַל הָ֣/אֲתֹנ֔וֹת יֶחְדְּיָ֖הוּ הַ/מֵּרֹנֹתִֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/030.yaml
  text: Over the camels was Obil the Ishmaelite[a], and over the female donkeys was Jehdeiah the Meronothite.
translation:
  language: te
  text: ఒంటెల పర్యవేక్షకుడు ఇష్మాయేలీయుడైన ఓబీల్; ఆడ గాడిదల[a] పర్యవేక్షకుడు మేరోనోతీయుడైన యెహ్దెయాహు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పదం ప్రత్యేకంగా ఆడ గాడిదలను సూచిస్తుంది.
    reason: lexical_specificity
lexical_decisions:
- source_word: וְעַל
  choice: పర్యవేక్షకుడు
  rationale: ఈ పరిపాలనా జాబితాలో עַל రాజ ఆస్తులపై బాధ్యత లేదా పర్యవేక్షణను సూచిస్తుంది. తెలుగులో సహజంగా, సంక్షిప్తంగా అధికార బాధ్యతను తెలియజేయడానికి ‘పర్యవేక్షకుడు’ అని అనువదించాం.
- source_word: הַגְּמַלִּים
  choice: ఒంటెల
  rationale: నిర్దిష్ట బహువచన నామవాచకానికి సహజమైన తెలుగు రూపం.
- source_word: אוֹבִיל
  choice: ఓబీల్
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: הַיִּשְׁמְעֵאלִי
  choice: ఇష్మాయేలీయుడైన
  rationale: ఓబీల్‌కు చెందిన జాతి లేదా వంశ సంబంధాన్ని సూచించే హీబ్రూ విశేషణాన్ని తెలుగు వ్యక్తివాచక రూపంలో నిలిపాం.
- source_word: הָאֲתֹנוֹת
  choice: ఆడ గాడిదల
  rationale: אָתוֹן సాధారణంగా గాడిదను మాత్రమే కాక, ప్రత్యేకంగా ఆడ గాడిదను సూచిస్తుంది; ఆ లింగ నిర్దిష్టతను ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: יֶחְדְּיָהוּ
  choice: యెహ్దెయాహు
  rationale: హీబ్రూ వ్యక్తి పేరును దాని పూర్తి రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: הַמֵּרֹנֹתִי
  choice: మేరోనోతీయుడైన
  rationale: మేరోనోతు అనే స్థలంతో లేదా సమూహంతో సంబంధాన్ని సూచించే జనపద విశేషణంగా అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజ ఆస్తుల పరిపాలనా జాబితికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని సమాంతర నిర్మాణాన్ని సహజమైన తెలుగు నామవాక్యాలుగా అందించాం. ఆంగ్ల సంప్రదింపు పాఠ్యంలో [a] గుర్తు ‘ఇష్మాయేలీయుడు’ తరువాత ఉన్నప్పటికీ, దాని గమనిక הָאֲתֹנוֹת పదానికి సంబంధించినందున తెలుగులో ‘ఆడ గాడిదల’ తరువాత సరైన స్థానంలో ఉంచాం.
