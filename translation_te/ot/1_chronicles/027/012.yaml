source:
  edition: WLC
  text: הַ/תְּשִׁיעִי֙ לַ/חֹ֣דֶשׁ הַ/תְּשִׁיעִ֔י אֲבִיעֶ֥זֶר הָ/עַנְּתֹתִ֖י ל/בנימיני וְ/עַל֙ מַחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/012.yaml
  text: 'The ninth, for the ninth month: Abiezer the Anathothite, from Benjamin; and over his division were twenty-four thousand.'
translation:
  language: te
  text: తొమ్మిదవ నెలకు నియమించబడిన తొమ్మిదవవాడు బెన్యామీను గోత్రానికి చెందిన అనాతోతీయుడైన అబీయెజెరు. అతని దళానికి ఇరవై నాలుగు వేలమంది ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַתְּשִׁיעִי לַחֹדֶשׁ הַתְּשִׁיעִי
  choice: తొమ్మిదవ నెలకు నియమించబడిన తొమ్మిదవవాడు
  rationale: మాసాల వారీ దళాధిపతుల జాబితా సందర్భాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తూ, మూలంలోని ‘తొమ్మిదవవాడు—తొమ్మిదవ నెలకు’ అనే క్రమాన్ని నిలుపుతుంది.
- source_word: הָעַנְּתֹתִי
  choice: అనాతోతీయుడు
  rationale: అనాతోతు ప్రాంతానికి చెందినవాడనే నివాస/ప్రాంత సూచనను సంక్షిప్తంగా ప్రతిబింబిస్తుంది.
- source_word: ל/בנימיני
  choice: బెన్యామీను గోత్రానికి చెందిన
  rationale: కెతీవ్ రూపాన్ని బెన్యామీనుతో సంబంధాన్ని తెలిపే పదంగా గ్రహించి, తెలుగు పాఠకులకు సహజంగా గోత్ర సంబంధాన్ని వ్యక్తపరుస్తుంది; అనాతోతీయుడు అనే ప్రాంత సూచనతో విరోధం కలిగించదు.
- source_word: מַחֲלֻקְתּוֹ
  choice: అతని దళంలో
  rationale: ఈ అధ్యాయ సందర్భంలో నెలవారీ సైనిక విభాగాన్ని సూచిస్తుంది; ‘దళం’ సాధారణ పాఠకులకు సహజమైన సైనిక పదం.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: ఇరవై నాలుగు వేలమంది
  rationale: సందర్భానుసారం లెక్క సైనికులదని తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; జాబితా శైలిని కాపాడుతూ, మూలంలోని సంక్షిప్త నామవాచక వాక్యాన్ని తెలుగులో స్పష్టమైన రెండు వాక్యాలుగా అందించాం. భాష గౌరవప్రదంగా, సాధారణ పాఠకులకు సులభంగా ఉంది.
