translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పరిపాలనా-సైనిక జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలి. మూలంలోని మొదటి క్రమసంఖ్యా సంక్షిప్తతను సాధ్యమైనంతవరకు నిలిపి, సాధారణ పాఠకునికి స్పష్టంగా ఉండే పదక్రమాన్ని వాడాం.
