id: 1CH.27.9
reference: 1 Chronicles 27:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הַ/שִּׁשִּׁי֙ לַ/חֹ֣דֶשׁ הַ/שִּׁשִּׁ֔י עִירָ֥א בֶן עִקֵּ֖שׁ הַ/תְּקוֹעִ֑י וְ/עַל֙ מַחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/009.yaml
  text: 'The sixth, for the sixth month: Ira son of Ikkesh the Tekoite; and over his division were twenty-four thousand.'
translation:
  language: te
  text: 'ఆరవవాడు, ఆరవ నెలకు: తెకోవీయుడైన ఇక్కేషు కుమారుడు ఈరా; అతని విభాగంలో ఇరవై నాలుగు వేలమంది ఉన్నారు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשִּׁשִּׁי
  choice: ఆరవవాడు
  rationale: జాబితా సూత్రంలో క్రమసంఖ్య నాయకుణ్ణి సూచిస్తూ సంక్షిప్తంగా ఉంది. తెలుగు వ్యాకరణానికి అనుగుణంగా పుంలింగ వ్యక్తిసూచక రూపం వాడి, ‘అధిపతి’ వంటి పదాన్ని మూలంలో లేనందున చేర్చలేదు.
- source_word: לַחֹדֶשׁ הַשִּׁשִּׁי
  choice: ఆరవ నెలకు
  rationale: ל ఉపసర్గ ఇక్కడ నెలవారీ సేవా నియామకాన్ని సూచిస్తుంది; సంక్షిప్తమైన తెలుగు రూపం మూలంలోని పరిపాలనా జాబితా శైలిని నిలుపుతుంది.
- source_word: עִירָא
  choice: ఈరా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు లిపిలో ధ్వన్యనుసారంగా ఇచ్చాం.
- source_word: בֶן עִקֵּשׁ
  choice: ఇక్కేషు కుమారుడు
  rationale: సాధారణ పుత్రసంబంధ నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో అనువదించాం.
- source_word: הַתְּקוֹעִי
  choice: తెకోవీయుడైన
  rationale: ఈ జాతివాచక/స్థలనివాస విశేషణం తెకోవాకు చెందిన వ్యక్తిని సూచిస్తుంది; తెలుగు బైబిలు శైలికి సరిపోయే నివాసవాచక రూపాన్ని ఎంచుకున్నాం.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: అతని విభాగంలో ... ఉన్నారు
  rationale: מַחֲלֻקָה ఈ అధ్యాయంలో సైనిక లేదా వంతులవారీ సేవా విభాగాన్ని సూచిస్తుంది. עַל‌తో కూడిన నిర్మాణం అతని ఆధీనంలోని బలగాల సంఖ్యను తెలియజేస్తుంది; తెలుగులో సహజంగా అర్థమయ్యేలా ‘విభాగంలో’ అని ఇచ్చాం.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: ఇరవై నాలుగు వేలమంది
  rationale: వ్యక్తుల సంఖ్య కావడంతో ఆధునిక తెలుగులో సహజంగా ‘వేలమంది’ అని ఇచ్చాం.
