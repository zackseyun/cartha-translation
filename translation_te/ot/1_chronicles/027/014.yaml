  text: עַשְׁתֵּֽי עָשָׂר֙ לְ/עַשְׁתֵּ֣י עָשָׂ֣ר הַ/חֹ֔דֶשׁ בְּנָיָ֥ה הַ/פִּרְעָתוֹנִ֖י מִן בְּנֵ֣י אֶפְרָ֑יִם וְ/עַל֙ מַחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/014.yaml
  text: For the twelfth month[a], Benaiah the Pirathonite, from the sons of Ephraim; and over his division were twenty-four thousand.
translation:
  language: te
  text: పదకొండవ నెలకు పదకొండవ అధిపతి ఎఫ్రాయిము కుమారులలోనివాడైన పిరాతోనీయుడు బెనాయా[a]. అతని విభాగంలో ఇరవై నాలుగు వేల మంది ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎఫ్రాయిము గోత్రానికి చెందినవాడు.” హీబ్రూలో అక్షరార్థంగా “ఎఫ్రాయిము కుమారులలోనివాడు” అని ఉంది; ఇది గోత్ర వంశాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַשְׁתֵּי עָשָׂר לְעַשְׁתֵּי עָשָׂר הַחֹדֶשׁ
  choice: పదకొండవ నెలకు పదకొండవవాడు
  rationale: హీబ్రూ עַשְׁתֵּי עָשָׂר అంటే ‘పదకొండు’; అధ్యాయంలోని పునరావృత పరిపాలనా సూత్రాన్ని అనుసరించి నెలకూ, వరుసలోని అధిపతికీ ‘పదకొండవ’ అని ఉంచాం. సంప్రదింపుగా ఇచ్చిన ఆంగ్ల పాఠంలోని ‘twelfth’ మూలపాఠానికి సరిపోదు.
- source_word: בְּנָיָה
  choice: బెనాయా
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: הַפִּרְעָתוֹנִי
  choice: పిరాతోనీయుడు
  rationale: పిరాతోను ప్రాంతానికి చెందినవాడని సూచించే gentilic రూపాన్ని సహజమైన తెలుగు రూపంలో నిలిపాం.
- source_word: מִן בְּנֵי אֶפְרָיִם
  choice: ఎఫ్రాయిము కుమారులలోనివాడు
  rationale: ‘ఎఫ్రాయిము కుమారులు’ అనే హీబ్రూ వంశపరమైన వ్యక్తీకరణను నిలిపి, ఇది తక్షణ కుమారత్వం కాక గోత్ర సంబంధమని పాదసూచికలో స్పష్టం చేశాం.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: అతని విభాగంలో ... మంది ఉన్నారు
  rationale: ఈ సందర్భంలో מַחֲלֻקָה సైనిక సేవా విభాగాన్ని సూచిస్తుంది. హీబ్రూ పరిపాలనా భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేశాం.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: ఇరవై నాలుగు వేల మంది
  rationale: సైనికుల సంఖ్యను సూచిస్తున్నందున తెలుగులో సహజంగా ‘మంది’ చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, అధ్యాయంలోని సైనిక-పరిపాలనా జాబితా శైలిని నిలిపేలా సంక్షిప్తంగా అనువదించాం. మూల హీబ్రూలోని పదకొండవ నెలను అనుసరించాం; ఇచ్చిన ఆంగ్ల సంప్రదింపు పాఠంలోని ‘పన్నెండవ’ను స్వీకరించలేదు.
