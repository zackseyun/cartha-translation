translation:
  language: te
  text: షారోనులో మేస్తున్న పశువుల మందలకు షారోనువాడైన షిత్రయి బాధ్యుడు; లోయలలోని పశువుల మందలకు అద్లయి కుమారుడైన షాఫాతు బాధ్యుడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל
  choice: పర్యవేక్షకుడు
  rationale: ఈ పరిపాలనా జాబితాలో עַל బాధ్యతను లేదా పర్యవేక్షణను సూచిస్తుంది. తెలుగులో సహజమైన వాక్య నిర్మాణం కోసం నామవాచక రూపం వాడబడింది.
- source_word: הַבָּקָר
  choice: పశువుల మందలు
  rationale: בקר ప్రధానంగా గోవుల జాతికి చెందిన పశువులను లేదా వాటి మందలను సూచిస్తుంది. సందర్భంలోని సమూహ భావాన్ని ‘పశువుల మందలు’ సహజంగా తెలియజేస్తుంది.
- source_word: הָרֹעִים
  choice: మేస్తున్న
  rationale: רעה ధాతువు నుంచి వచ్చిన ఈ కర్తరి అసమాపక రూపం పచ్చిక మేస్తున్న పశువులను వర్ణిస్తుంది.
- source_word: בַּשָּׁרוֹן
  choice: షారోనులో
  rationale: షారోను ఒక భౌగోళిక ప్రాంతనామం; స్థలార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: שטרי
  choice: షిత్రయి
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: הַשָּׁרוֹנִי
  choice: షారోను ప్రాంతవాసి
  rationale: ఈ ప్రాంతసూచక రూపం షిత్రయి షారోనుకు చెందినవాడని చెబుతుంది; తెలుగులో ‘ప్రాంతవాసి’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: בָּעֲמָקִים
  choice: లోయల్లోని
  rationale: עמקים యొక్క బహువచనార్థమైన ‘లోయలు’ నేరుగా నిలుపబడింది.
- source_word: שָׁפָט
  choice: షాఫాతు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ; చివరి హల్లును పలకడానికి తెలుగు సంప్రదాయానుసారంగా అచ్చు జోడించబడింది.
- source_word: בֶּן עַדְלָי
  choice: అద్లయి కుమారుడు
  rationale: హీబ్రూ వంశసూచక నిర్మాణాన్ని తెలుగులో సహజమైన క్రమంలో అందిస్తుంది.
