  yaml_path: translation/ot/1_chronicles/027/033.yaml
  text: And Ahithophel was counselor to the king[a], and Hushai the Archite was the king’s friend.
translation:
  language: te
  text: అహీతోఫెలు రాజుకు సలహాదారుడు; అర్కీయుడైన హూషై రాజుకు స్నేహితుడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సహచరుడు,” “సన్నిహితుడు”; హీబ్రూ పదం సాధారణంగా స్నేహితుణ్ణి సూచిస్తుంది; రాజసభ సందర్భంలో రాజుకు నమ్మకమైన సహచరుణ్ణి కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִיתֹפֶל
  choice: అహీతోఫెలు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: יוֹעֵץ
  choice: సలహాదారుగా
  rationale: రాజుకు సలహా ఇచ్చే వ్యక్తిని సూచించే పదం; రాజసభ సందర్భంలో సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: לַמֶּלֶךְ
  choice: రాజుకు
  rationale: ל ఉపసర్గ సూచించే సంబంధం లేదా సేవను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: חוּשַׁי
  choice: హూషై
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: הָאַרְכִּי
  choice: అర్కీయుడైన
  rationale: హూషైకి సంబంధించిన వంశ లేదా ప్రదేశ గుర్తింపును తెలిపే gentilicial రూపాన్ని లిప్యంతరీకరించి తెలుగు వ్యాకరణానికి అనుగుణంగా ఇచ్చాం.
- source_word: רֵעַ
  choice: స్నేహితుడుగా
  rationale: సాధారణంగా ‘స్నేహితుడు’ అని అర్థం; రాజసభ సందర్భంలో నమ్మకస్థ సహచరుడు లేదా అధికారిక రాజమిత్రుడు అనే భావం కూడా ఉండవచ్చు. ప్రధాన పాఠంలో విస్తృతమైన సాధారణ అర్థాన్ని నిలిపాం.
- source_word: וְ
  choice: ;
  rationale: రెండు సమాంతర పదవీ ప్రకటనలను తెలుగులో సహజంగా కలపడానికి విరామచిహ్నం వాడాం; సంబంధం సమన్వయాత్మకంగానే ఉంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా స్వభావాన్ని నిలుపుతూ సంక్షిప్తంగా, గౌరవప్రదంగా అనువదించాం. పేర్లు లిప్యంతరీకరించబడ్డాయి; רֵעַ లోని సాధారణ మరియు రాజసభ సంబంధిత భావవ్యాప్తిని పాదసూచికలో నిలిపాం.
