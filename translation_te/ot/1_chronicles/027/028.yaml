id: 1CH.27.28
reference: 1 Chronicles 27:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַל הַ/זֵּיתִ֤ים וְ/הַ/שִּׁקְמִים֙ אֲשֶׁ֣ר בַּ/שְּׁפֵלָ֔ה בַּ֥עַל חָנָ֖ן הַ/גְּדֵרִ֑י וְ/עַל אֹצְר֥וֹת הַ/שֶּׁ֖מֶן יוֹעָֽשׁ־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/028.yaml
  text: Over the olive trees and the sycamore trees in the Shephelah was Baal-hanan the Gederite[b][a]; and over the stores of oil was Joash.
translation:
  language: te
  text: షెఫేలాలో[a] ఉన్న ఒలీవ చెట్లకూ సికమోరు-అంజూరపు చెట్లకూ[b] గెదేరీయుడైన బయల్-హానాను బాధ్యుడిగా ఉన్నాడు; నూనె నిల్వలకు యోవాషు బాధ్యుడిగా ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘షెఫేలా’ అంటే యూదా పర్వతప్రాంతానికి పశ్చిమాన ఉన్న దిగువ కొండల ప్రాంతం; లేదా, ‘దిగువ ప్రాంతం.’
    reason: cultural_note
  - marker: b
    text: లేదా, ‘సికమోరు చెట్లు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: అధికారిగా ఉన్నాడు
  rationale: ఈ పరిపాలనా జాబితాలో עַל ఒక విభాగంపై బాధ్యత లేదా పర్యవేక్షణను సూచిస్తుంది; సహజమైన ఆధునిక తెలుగులో ఈ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַזֵּיתִים
  choice: ఒలీవ చెట్లు
  rationale: భూమి నిర్వహణ సందర్భంలో ఈ బహువచన నామవాచకం పండ్లను కాక చెట్లను సూచిస్తుంది.
- source_word: וְהַשִּׁקְמִים
  choice: మేడిచెట్లు
  rationale: שִׁקְמִים అనేది సికమోరు-అంజూరపు జాతి చెట్లను సూచిస్తుంది; తెలుగులో సుపరిచితమైన వృక్షనామంగా ‘మేడిచెట్లు’ను ఉపయోగించి, ఖచ్చితమైన వృక్షశాస్త్ర ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: లోయ ప్రాంతంలో ఉన్న
  rationale: שְׁפֵלָה సాధారణంగా యూదా పర్వతప్రాంతానికీ తీర మైదానానికీ మధ్యనున్న దిగువ కొండచరియల ప్రాంతాన్ని సూచిస్తుంది. అపరిచిత లిప్యంతరీకరణకు బదులు అర్థవంతమైన భౌగోళిక వర్ణనను ప్రధాన పాఠ్యంలో ఇచ్చాం.
- source_word: בַּעַל חָנָן
  choice: బయల్‌హానాను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వని, విభక్తి ప్రయోగాలకు అనుకూలంగా లిప్యంతరీకరించాం.
- source_word: הַגְּדֵרִי
  choice: గెదేరు వాడైన
  rationale: ఈ విశేషణం గెదేరు ప్రాంతానికి చెందిన వ్యక్తిని సూచిస్తుంది; తెలుగులో సహజమైన ప్రాంతీయ గుర్తింపుగా అనువదించాం.
- source_word: אֹצְרוֹת הַשֶּׁמֶן
  choice: నూనె నిల్వలు
  rationale: ఈ నిర్మాణం నూనెను నిల్వచేసే గదులనో నిల్వ ఉంచిన నూనె సంపదనో సూచించవచ్చు; ‘నిల్వలు’ ఆ అస్పష్టతను అతిగా నిర్దిష్టం చేయకుండా కాపాడుతుంది.
- source_word: יוֹעָשׁ
  choice: యోవాషు
  rationale: హీబ్రూ వ్యక్తినామాన్ని ప్రామాణిక తెలుగు బైబిలు నామరూపానికి సమీపంగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పరిపాలనా జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలిని వాడాం. సమాంతర వాక్య నిర్మాణాన్ని నిలుపుతూ, తెలుగులో బాధ్యత భావం స్పష్టమయ్యేలా ‘అధికారిగా ఉన్నాడు’ అని రెండుసార్లు పేర్కొన్నాం.
