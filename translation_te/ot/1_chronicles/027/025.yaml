source:
  edition: WLC
  text: וְ/עַל֙ אֹצְר֣וֹת הַ/מֶּ֔לֶךְ עַזְמָ֖וֶת בֶּן עֲדִיאֵ֑ל וְ/עַ֣ל הָֽ/אֹצָר֡וֹת בַּ/שָּׂדֶ֞ה בֶּ/עָרִ֤ים וּ/בַ/כְּפָרִים֙ וּ/בַ/מִּגְדָּל֔וֹת יְהוֹנָתָ֖ן בֶּן עֻזִּיָּֽהוּ־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/025.yaml
  text: Over the king’s treasuries was Azmaveth son of Adiel[a], and over the treasuries in the countryside, in the cities, in the villages, and in the towers[b], was Jehonathan son of Uzziah.
translation:
  language: te
  text: రాజు ఖజానాలకు అదీయేలు కుమారుడు అజ్మావెతు బాధ్యుడుగా ఉన్నాడు; పల్లెప్రాంతంలో[a], పట్టణాల్లో, గ్రామాల్లో, బురుజుల్లో ఉన్న ఖజానాలకు ఉజ్జీయా కుమారుడు యెహోనాతాను[b] బాధ్యుడుగా ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో అక్షరార్థంగా ‘పొలంలో’; ఇక్కడ ఏకవచన పదం పట్టణాలు, గ్రామాలు, బురుజులకు భిన్నమైన పల్లెప్రాంతాలను సమష్టిగా సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘యెహోనాతాను’ అనేది ఇక్కడి పూర్తి హీబ్రూ నామరూపాన్ని ప్రతిబింబిస్తుంది; కొన్ని అనువాదాల్లో దీనిని సంక్షిప్తంగా ‘యోనాతాను’ అని ఇస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: బాధ్యుడుగా ఉన్నాడు
  rationale: ఈ పరిపాలనా జాబితాలో עַל పర్యవేక్షణ లేదా బాధ్యతను సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘బాధ్యుడుగా ఉన్నాడు’ సహజంగా, స్పష్టంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: אֹצְרוֹת / הָאֹצָרוֹת
  choice: ఖజానాలకు / ఖజానాలకు
  rationale: אֹצָר అనే పదం ఖజానా, నిల్వగది లేదా నిల్వచేసిన సంపదను సూచించగలదు. రాజసంబంధమైన పరిపాలనా సందర్భంలో ‘ఖజానాలు’ తగినది; రెండు సందర్భాల్లోనూ ఒకే పదాన్ని ఉంచడం మూలంలోని పదసామ్యాన్ని కాపాడుతుంది.
- source_word: הַמֶּלֶךְ
  choice: రాజు
  rationale: אֹצְרוֹת הַמֶּלֶךְ అనే సమాసాన్ని తెలుగులో సహజంగా ‘రాజు ఖజానాలు’గా అందించాం.
- source_word: עַזְמָוֶת
  choice: అజ్మావెతు
  rationale: హీబ్రూ వ్యక్తినామ ధ్వనిరూపాన్ని తెలుగులో సాధ్యమైనంత సమీపంగా లిప్యంతరీకరించాం.
- source_word: בֶּן עֲדִיאֵל
  choice: అదీయేలు కుమారుడు
  rationale: వంశపరమైన గుర్తింపులో בֶּן ను సహజ తెలుగు క్రమంలో ‘కుమారుడు’గా అనువదించాం.
- source_word: בַּשָּׂדֶה
  choice: పల్లెప్రాంతంలో
  rationale: మూలంలో ఏకవచనంగా ‘పొలంలో’ ఉన్నప్పటికీ, పట్టణాలు, గ్రామాలు, గోపురాలకు భిన్నమైన గ్రామీణ ప్రాంతాన్ని సమష్టిగా సూచిస్తున్నట్లు సందర్భం తెలియజేస్తుంది.
- source_word: בֶּעָרִים
  choice: పట్టణాల్లో
  rationale: స్థలాలను వరుసగా పేర్కొనే సందర్భంలో స్పష్టమైన స్థానార్థక అనువాదం.
- source_word: וּבַכְּפָרִים
  choice: గ్రామాల్లో
  rationale: כְּפָרִים గ్రామాలు లేదా చిన్న గ్రామీణ నివాసాలను సూచిస్తుంది; ‘గ్రామాలు’ ఆధునిక తెలుగులో సాధారణంగా అర్థమయ్యే పదం.
- source_word: וּבַמִּגְדָּלוֹת
  choice: గోపురాల్లో
  rationale: מִגְדָּלוֹת యొక్క సాధారణ అర్థం ‘గోపురాలు/బురుజులు’. అవి కావలి లేదా కోట గోపురాలని మూలం ప్రత్యేకంగా చెప్పనందున విస్తృతమైన ‘గోపురాలు’ ఎంచుకున్నాం.
- source_word: יְהוֹנָתָן
  choice: యెహోనాతాను
  rationale: ఇక్కడ ఉన్న יְהוֹנָתָן అనే పూర్తి హీబ్రూ నామరూపాన్ని ప్రతిబింబిస్తుంది; సంక్షిప్త יוֹנָתָן రూపంతో కలపలేదు.
- source_word: בֶּן עֻזִּיָּהוּ
  choice: ఉజ్జీయా కుమారుడు
  rationale: వంశపరమైన గుర్తింపును సహజ తెలుగు పదక్రమంలో అందించాం; పేరును హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించాం.
