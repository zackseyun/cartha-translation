  text: Over the flocks was Jaziz the Hagrite[a]. All these were officers over the property that belonged to King David.
translation:
  language: te
  text: మందలకు బాధ్యుడిగా హగ్రీయుడైన యజీజ్ ఉన్నాడు.[a] వీరందరూ రాజైన దావీదు ఆస్తికి అధికారులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “హాగరీయుడు.” హీబ్రూ జనపదాన్ని లేదా వంశాన్ని సూచించే విశేషణాన్ని ఈ రెండు విధాలుగా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: పర్యవేక్షణలో
  rationale: ఈ పరిపాలనా జాబితాలో עַל బాధ్యతను లేదా పర్యవేక్షణను సూచిస్తుంది; తెలుగులో సహజంగా పరిపాలనా భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: הַצֹּאן
  choice: మందల
  rationale: צֹאן గొర్రెలను మాత్రమే కాక గొర్రెలు-మేకల వంటి చిన్న పశువులను సమష్టిగా సూచించగలదు; ‘మందలు’ ఆ విస్తృతతను కాపాడుతుంది.
- source_word: יָזִיז
  choice: యాజీజ్
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
- source_word: הַהַגְרִי
  choice: హగ్రీయుడైన
  rationale: వంశ/జనసమూహ సంబంధాన్ని సూచించే హీబ్రూ విశేషణాన్ని హగ్రీయుడు అని లిప్యంతరీకరించాం; హాగరీయుడు అనే ప్రత్యామ్నాయం పాదసూచికలో ఉంచాం.
- source_word: כָּל אֵלֶּה
  choice: వీరందరూ
  rationale: వ్యక్తులతో కూడిన మునుపటి జాబితాను సమగ్రంగా సూచించే సహజమైన తెలుగు రూపం.
- source_word: שָׂרֵי
  choice: అధికారులుగా
  rationale: ఇక్కడ שָׂרִים రాజ ఆస్తుల బాధ్యత వహించే పరిపాలనా అధికారులను సూచిస్తుంది; ‘అధికారులు’ సైనిక లేదా రాజవంశ భావాన్ని అనవసరంగా చేర్చదు.
- source_word: הָרְכוּשׁ
  choice: ఆస్తిపై
  rationale: רְכוּשׁ ఆస్తి, సంపద, వస్తుసామగ్రి అనే పరిధి కలిగిన పదం; ఈ రాజ పరిపాలనా సందర్భంలో ‘ఆస్తి’ సముచితం.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִיד
  choice: దావీదు రాజుకు చెందిన
  rationale: హీబ్రూ సంబంధవాచక నిర్మాణంలోని యాజమాన్య భావాన్ని స్పష్టమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
