source:
  edition: WLC
  text: וִֽ/יהוֹנָתָ֤ן דּוֹד דָּוִיד֙ יוֹעֵ֔ץ אִישׁ מֵבִ֥ין וְ/סוֹפֵ֖ר ה֑וּא וִֽ/יחִיאֵ֥ל בֶּן חַכְמוֹנִ֖י עִם בְּנֵ֥י הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/032.yaml
  text: Jonathan[a], David’s uncle, was a counselor, a man of understanding, and a scribe[b]; and Jehiel son of Hachmoni was with the king’s sons.
translation:
  language: te
  text: దావీదుకు మామయైన[a] యోనాతాను సలహాదారుడు, వివేకవంతుడైన వ్యక్తి, లేఖకుడు. హక్మోనీ కుమారుడు యెహీయేలు రాజు కుమారులతో ఉండేవాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మామయైన’—హీబ్రూ పదానికి సందర్భానుసారంగా ‘బంధువు,’ ‘ప్రియుడు’ లేదా ‘స్నేహితుడు’ అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ వాచ్యంగా ‘రాజు కుమారులతో ఉండేవాడు’ అని ఉంది. అతడు వారికి సేవ చేశాడని లేదా వారిని పర్యవేక్షించాడని కొందరు అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹד
  choice: మామ
  rationale: ఈ రాజసభ, కుటుంబ సందర్భంలో ఈ పదం దావీదుతో కుటుంబ సంబంధాన్ని, ముఖ్యంగా ‘మామ’ అనే అర్థాన్ని సూచించడం సహజం. అయితే హీబ్రూ పదానికి ఇతర అర్థాలు కూడా ఉండగలవు కాబట్టి పాదటిప్పణిలో సందిగ్ధతను ఉంచాం.
- source_word: יוֹעֵץ
  choice: సలహాదారు
  rationale: రాజసభలో అధికారికంగా సలహా ఇచ్చే వ్యక్తిని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: אִישׁ מֵבִין
  choice: వివేకంగలవాడు
  rationale: అవగాహనతో వివేచించగల వ్యక్తి అనే ప్రశంసాత్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: סוֹפֵר
  choice: లేఖకుడు
  rationale: రాయడం, పత్రాల నిర్వహణ, రాజపాలనా సేవ వంటి విస్తృత విధులను అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: עִם
  choice: తో ఉండేవాడు
  rationale: హీబ్రూ ఉపసర్గకు నేరుగా ‘తో’ అని అర్థం. పర్యవేక్షణ లేదా సేవ అనే పాత్రను మూలపాఠం స్పష్టంగా చెప్పనందున ప్రధాన పాఠంలో దానిని చేర్చలేదు.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: రాజు కుమారులు
  rationale: హీబ్రూ వాచ్యంగా ‘రాజు కుమారులు’ అని ఉంది; ‘రాజకుమారులు’ అనే సందర్భోచిత భావాన్ని ప్రధాన పాఠంలోకి దిగుమతి చేయలేదు.
- source_word: חַכְמוֹנִי
  choice: హక్మోనీ
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
