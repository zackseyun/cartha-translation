  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. రాజసభ పదవులను అతిగా సాంకేతికంగా చేయకుండా, మూలంలోని సంక్షిప్తత మరియు ‘తో ఉండేవాడు’ అనే ఉద్దేశపూర్వక అస్పష్టతను నిలిపాం.
