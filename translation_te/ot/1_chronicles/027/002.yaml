source:
  edition: WLC
  text: עַ֞ל הַ/מַּחֲלֹ֤קֶת הָ/רִֽאשׁוֹנָה֙ לַ/חֹ֣דֶשׁ הָ/רִאשׁ֔וֹן יָֽשָׁבְעָ֖ם בֶּן זַבְדִּיאֵ֑ל וְ/עַל֙ מַֽחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/002.yaml
  text: Over the first division for the first month was Jashobeam son of Zabdiel[a], and in his division were twenty-four thousand.
translation:
  language: te
  text: మొదటి నెలకోసం ఉన్న మొదటి విభాగానికి జబ్దీయేలు కుమారుడైన యాషోబాము అధిపతి; అతని విభాగంలో ఇరవై నాలుగు వేల మంది ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అతని విభాగంపై ఇరవై నాలుగు వేలు.” హీబ్రూ వాక్యం క్రియ లేకుండా సంక్షిప్తంగా ఉంది; విభాగంలోని వారి సంఖ్యను తెలుగులో స్పష్టంగా చెప్పడానికి “మంది ఉన్నారు” అని చేర్చబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הַמַּחֲלֹקֶת
  choice: విభాగానికి … అధిపతి
  rationale: ఇక్కడ עַל పరిపాలనా లేదా సైనిక బాధ్యతను సూచిస్తుంది; తెలుగులో సహజంగా అర్థమయ్యేలా ‘అధిపతి’ని వాక్యవిధేయంగా ఉంచాం. מַחֲלֹקֶת నెలవారీగా ఏర్పాటైన సైనిక విభాగాన్ని సూచిస్తుంది.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: మొదటి నెలకు నియమించబడిన
  rationale: לְ ఇక్కడ ఆ నెలకు కేటాయింపును సూచిస్తుంది. కేవలం ‘మొదటి నెలకు’ అన్నదానికంటే ‘నియమించబడిన’ అనేది వార్షిక సేవా క్రమాన్ని స్పష్టం చేస్తుంది.
- source_word: יָשָׁבְעָם
  choice: యాషొబాము
  rationale: హీబ్రూ పేరును ఆధారంగా తీసుకొని తెలుగులో ఉచ్చరించదగిన సంప్రదాయ బైబిలు రూపాన్ని వాడాం.
- source_word: בֶּן זַבְדִּיאֵל
  choice: జబ్దీయేలు కుమారుడు
  rationale: בֶּן యొక్క సాధారణ వంశసంబంధ అర్థమైన ‘కుమారుడు’ను నిలిపాం; సందర్భం మరింత విస్తృతమైన ‘వంశస్థుడు’ అనే అర్థాన్ని కోరడం లేదు.
- source_word: וְעַל מַחֲלֻקְתּוֹ עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: అతని విభాగంలో ఇరవై నాలుగు వేల మంది ఉన్నారు
  rationale: హీబ్రూ వాక్యం క్రియ లేకుండా సంక్షిప్తంగా ఉంది. సంఖ్య ఆ విభాగంలోని మనుషుల మొత్తాన్ని సూచిస్తున్నందున, తెలుగులో అవసరమైన ‘మంది ఉన్నారు’ను సరఫరా చేశాం.
