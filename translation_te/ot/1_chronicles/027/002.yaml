translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పరిపాలనా-సైనిక జాబితాకు తగిన గౌరవప్రదమైన సరళ శైలిని వాడాం. ‘విభాగం,’ ‘అధిపతి’ వంటి సాధారణంగా అర్థమయ్యే పదాలను ఎంచుకున్నాం; మూలంలోని సంక్షిప్త నిర్మాణాన్ని పాదటిప్పణిలో తెలియజేశాం.
