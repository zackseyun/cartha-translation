source:
  edition: WLC
  text: הַ/שְּׁנֵ֤ים עָשָׂר֙ לִ/שְׁנֵ֣ים עָשָׂ֣ר הַ/חֹ֔דֶשׁ חֶלְדַּ֥י הַ/נְּטוֹפָתִ֖י לְ/עָתְנִיאֵ֑ל וְ/עַל֙ מַחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/015.yaml
  text: The twelfth[a], for the twelfth month, was Heldai the Netophathite, of Othniel[b]; and over his division were twenty-four thousand.
translation:
  language: te
  text: పన్నెండో నెలకు పన్నెండవవాడు నెటోఫాతీయుడైన హెల్దయి[a]; అతడు ఒత్నీయేలుకు చెందినవాడు[b]. అతని విభాగంలో ఇరవై నాలుగు వేలమంది ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని సమాంతర సంప్రదాయాల్లో ఈ పేరు ‘హెలెదు’ అని ఉంది.
    reason: cross_reference
  - marker: b
    text: ‘ఒత్నీయేలు వంశానికి చెందినవాడు’ లేదా ‘ఒత్నీయేలు కుటుంబానికి చెందినవాడు’ అని కూడా అర్థం కావచ్చు. హెబ్రీ నిర్మాణం బహుశా కుటుంబ లేదా వంశ అనుబంధాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁנֵים עָשָׂר
  choice: పన్నెండవవాడు
  rationale: సైనిక విభాగాల నెలవారీ వరుసలోని పన్నెండవ వ్యక్తిని సూచించే క్రమసంఖ్య; మూలంలోని సంక్షిప్త నిర్మాణాన్ని నిలుపుతుంది.
- source_word: לִשְׁנֵים עָשָׂר הַחֹדֶשׁ
  choice: పన్నెండో నెలకు
  rationale: ל ఉపసర్గ నెలకు నియామకాన్ని సూచిస్తుంది; తెలుగులో సహజమైన పరిపాలనా ప్రయోగం.
- source_word: חֶלְדַּי
  choice: హెల్దయి
  rationale: ఈ వచనంలోని హెబ్రీ పేరు రూపాన్ని నేరుగా లిప్యంతరీకరించింది.
- source_word: הַנְּטוֹפָתִי
  choice: నెటోఫాతీయుడైన
  rationale: నెటోఫా ప్రాంతానికి చెందిన వ్యక్తిని సూచించే జాత్యర్థక విశేషణాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: לְעָתְנִיאֵל
  choice: ఒత్నీయేలుకు చెందినవాడు
  rationale: కుటుంబం లేదా వంశ సంబంధాన్ని సూచించే అవకాశమున్నప్పటికీ, ఖచ్చిత సంబంధాన్ని నిర్ధారించకుండా హెబ్రీ నిర్మాణంలోని విస్తృత అనుబంధ భావాన్ని నిలుపుతుంది.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: అతని విభాగంలో ... ఉన్నారు
  rationale: ఈ అధ్యాయంలో מַחֲלֻקָה సైనిక విభాగాన్ని సూచిస్తుంది; సంఖ్యతో కూడిన వాక్యంలో ఇది సహజమైన తెలుగు నిర్మాణం.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: ఇరవై నాలుగు వేలమంది
  rationale: విభాగంలోని మనుషుల సంఖ్యను తెలుగులో స్పష్టంగా, వచనరూపంలో తెలియజేస్తుంది.
theological_decisions:
- issue: ఒత్నీయేలుతో హెల్దయికి ఉన్న సంబంధం
  choice: ఒత్నీయేలుకు చెందినవాడు
  alternative: ఒత్నీయేలు వంశస్థుడు
  rationale: לְ నిర్మాణం కుటుంబం, వంశం లేదా గోత్ర అనుబంధాన్ని సూచించవచ్చు; ప్రత్యక్ష వంశావళిని నిర్ధారించి చెప్పకుండా మూలంలోని అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి. మూలంలోని పరిపాలనా జాబితా సంక్షిప్తతను నిలుపుతూ, తెలుగులో వ్యక్తుల సంఖ్య స్పష్టమయ్యేందుకు ‘మంది’ చేర్చబడింది.
