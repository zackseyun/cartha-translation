source:
  edition: WLC
  text: הָ/עֲשִׂירִי֙ לַ/חֹ֣דֶשׁ הָ/עֲשִׂירִ֔י מַהְרַ֥י הַ/נְּטֽוֹפָתִ֖י לַ/זַּרְחִ֑י וְ/עַל֙ מַֽחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/013.yaml
  text: 'The tenth[a], for the tenth month: Mahrai the Netophathite, of the Zerahites; and over his division were twenty-four thousand.'
translation:
  language: te
  text: పదో నెలకు పదవవాడు నెటోఫాతీయుడైన మహరై, జెరహీయుడు[a]; అతని విభాగంలో ఇరవై నాలుగు వేల మంది ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘జెరహీయుల వంశానికి చెందినవాడు.’
    reason: లַזַּרְחִי అనే ఏకవచన వంశసంబంధ రూపాన్ని వ్యక్తి బిరుదుగా గానీ, జెరహీయుల వంశానికి చెందినవాడనే స్పష్టీకరణగా గానీ అనువదించవచ్చు.
lexical_decisions:
- source_word: הָעֲשִׂירִי
  choice: పదోవాడు
  rationale: ఈ జాబితా సందర్భంలో క్రమసంఖ్య నామవాచకంగా వాడబడింది. మూలంలో లేని ‘అధిపతి’ లేదా ‘దళం’ అనే పదాన్ని చేర్చకుండా, తెలుగులో వ్యక్తిని సూచించే సహజ రూపాన్ని ఎంచుకున్నాం.
- source_word: לַחֹדֶשׁ הָעֲשִׂירִי
  choice: పదో నెలకు
  rationale: ל ఉపసర్గ ఈ అధ్యాయంలోని నెలవారీ సేవా నియామకాన్ని సూచిస్తుంది; ‘పదో నెలకు’ సంక్షిప్తంగా, సందర్భానుగుణంగా ఉంది.
- source_word: מַהְרַי
  choice: మహరై
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుకరణలో ఇచ్చాం.
- source_word: הַנְּטוֹפָתִי
  choice: నెటోఫాతీయుడైన
  rationale: నెటోఫా ప్రాంతానికి చెందినవాడని తెలిపే నిస్బే రూపాన్ని తెలుగు జాతి/ప్రాంత సంబంధ విశేషణంగా అందించాం.
- source_word: לַזַּרְחִי
  choice: అతడు జెరహీయుడు
  rationale: ఈ రూపం జెరహు వంశ లేదా గోత్ర అనుబంధాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో సంక్షిప్త జాతి/వంశ విశేషణాన్ని ఉంచి, స్పష్టీకృత రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: అతని విభాగంలో ... మంది ఉన్నారు
  rationale: מַחֲלֻקָה ఇక్కడ నెలవారీ సేవకు నియమితమైన సైనిక విభాగాన్ని సూచిస్తుంది. హీబ్రూ సంబంధాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో అందించాం.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: ఇరవై నాలుగు వేల మంది
  rationale: సైనికుల సంఖ్యను ఆధునిక, సహజ తెలుగు సంఖ్యా రూపంలో ఇచ్చాం; వ్యక్తులని స్పష్టం చేయడానికి ‘మంది’ వాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలికి తగిన సంక్షిప్తతతో అనువదించాం. గౌరవప్రదమైన ధోరణిని నిలుపుతూ, మూలంలో లేని పదవీబిరుదులను చేర్చలేదు.
