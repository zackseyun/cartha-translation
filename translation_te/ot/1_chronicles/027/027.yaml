  register: సాధారణ పాఠకులకు స్పష్టంగా ఉండే ఆధునిక ప్రామాణిక తెలుగు వాడాం. మూలంలోని సంక్షిప్త పరిపాలనా నిర్మాణాన్ని సహజమైన తెలుగు వాక్యాలుగా ఇచ్చాం; వ్యక్తి పేర్లు, ప్రాంతీయ గుర్తింపులను గౌరవప్రదంగా లిప్యంతరీకరించాం.
