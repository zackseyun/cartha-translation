  text: וְ/עַל הַ֨/כְּרָמִ֔ים שִׁמְעִ֖י הָ/רָֽמָתִ֑י וְ/עַ֤ל שֶׁ/בַּ/כְּרָמִים֙ לְ/אֹצְר֣וֹת הַ/יַּ֔יִן זַבְדִּ֖י הַ/שִּׁפְמִֽי־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/027.yaml
  text: Over the vineyards was Shimei the Ramathite[b][a]; and over the produce of the vineyards for the wine cellars was Zabdi the Shiphmite.
translation:
  language: te
  text: ద్రాక్షతోటలపై రామాతీయుడైన షిమీ అధికారి. ద్రాక్షారసపు నిల్వగదుల[b] కొరకు ద్రాక్షతోటల్లో ఉన్న దిగుబడిపై[a] షిఫ్మీయుడైన జబ్దీ అధికారి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో పదశః, ‘ద్రాక్షతోటల్లో ఉన్నది’; ఈ సందర్భంలో ఇది ద్రాక్షతోటల దిగుబడిని సూచిస్తున్నట్లు ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ద్రాక్షారసపు గిడ్డంగులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: బాధ్యత … అప్పగించబడింది
  rationale: ఈ పరిపాలనా జాబితాలో עַל అనేది పర్యవేక్షణ లేదా బాధ్యతను సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో బాధ్యత అప్పగించబడినట్లు వ్యక్తీకరించడం భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: הַכְּרָמִים
  choice: ద్రాక్షతోటలు
  rationale: כֶּרֶם అనే పదానికి సాధారణ అర్థం ‘ద్రాక్షతోట’; బహువచన రూపాన్ని అలాగే ఉంచాం.
- source_word: שִׁמְעִי
  choice: షిమీ
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: הָרָמָתִי
  choice: రామాతీయుడు
  rationale: రామా ప్రాంతానికి చెందిన వ్యక్తిని సూచించే హీబ్రూ జాతివాచక రూపాన్ని తెలుగు జాతివాచకంగా అందించాం.
- source_word: שֶׁבַּכְּרָמִים
  choice: ద్రాక్షతోటల దిగుబడి
  rationale: పదశః ‘ద్రాక్షతోటల్లో ఉన్నది.’ ముందుగా తోటల పరిపాలనను చెప్పి, తరువాత ద్రాక్షారస నిల్వకు సంబంధించిన బాధ్యతను చెప్పే సందర్భంలో ఇది తోటల పంట లేదా దిగుబడిని సూచిస్తుంది.
- source_word: לְאֹצְרוֹת הַיַּיִן
  choice: ద్రాక్షారసపు నిల్వగదుల కోసం
  rationale: אֹצָר అనేది నిల్వగది లేదా గిడ్డంగిని సూచించగలదు. יַיִןతో కలిసిన ఈ సందర్భంలో ద్రాక్షారసాన్ని నిల్వచేసే గదులు ఉద్దేశించబడ్డాయి.
- source_word: זַבְדִּי
  choice: జబ్దీ
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: הַשִּׁפְמִי
  choice: షిఫ్మీయుడు
  rationale: అనిశ్చితమైన స్థలనామం నుంచి ఏర్పడిన జాతివాచకాన్ని ఊహాత్మకంగా విస్తరించకుండా లిప్యంతరీకరించాం.
