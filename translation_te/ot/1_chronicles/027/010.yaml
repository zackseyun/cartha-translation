id: 1CH.27.10
reference: 1 Chronicles 27:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הַ/שְּׁבִיעִי֙ לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י חֶ֥לֶץ הַ/פְּלוֹנִ֖י מִן בְּנֵ֣י אֶפְרָ֑יִם וְ/עַל֙ מַחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/010.yaml
  text: 'The seventh[a], for the seventh month: Helez the Pelonite, from the sons of Ephraim; and over his division were twenty-four thousand.'
translation:
  language: te
  text: 'ఏడవవాడు, ఏడవ నెల కొరకు: ఎఫ్రాయిము సంతతికి చెందిన పెలోనీయుడైన[a] హెలెజు; అతని ఆధీనంలోని విభాగంలో ఇరవై నాలుగు వేల మంది ఉన్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పల్టీయుడు”; ఇది హెలెజు వంశ గుర్తింపుకు సంబంధించిన భిన్నమైన సాంప్రదాయ గుర్తింపును ప్రతిబింబించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשְּׁבִיעִי
  choice: ఏడవవాడు
  rationale: జాబితా సందర్భంలో ఈ క్రమసంఖ్యకు సైనిక అధిపతి అనే నామవాచకం అధ్యాహారంగా ఉంది. మూలంలోని సంక్షిప్తతను కాపాడుతూ తెలుగులో వ్యక్తిని సూచించే రూపాన్ని వాడాం.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ఏడవ నెలకు నియమించబడిన
  rationale: ל ఉపసర్గ ఈ అధ్యాయంలో నెలవారీ సేవా నియామకాన్ని సూచిస్తుంది. తెలుగు పాఠకుడికి పరిపాలనా భావం స్పష్టమయ్యేలా ‘నియమించబడిన’ అని సందర్భానుగుణంగా చేర్చాం.
- source_word: חֶלֶץ
  choice: హెలెజు
  rationale: వ్యక్తి పేరును తెలుగు ధ్వని పద్ధతికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הַפְּלוֹנִי
  choice: పెలోనీయుడు
  rationale: మసొరా హీబ్రూ పాఠంలోని వ్యంజన రూపాన్ని అనుసరించిన వంశ/ప్రాంత గుర్తింపు. ప్రత్యామ్నాయ సాంప్రదాయ గుర్తింపును పాదసూచికలో ఉంచాం.
- source_word: מִן בְּנֵי אֶפְרָיִם
  choice: ఎఫ్రాయిము సంతతికి చెందిన
  rationale: అక్షరార్థంగా ‘ఎఫ్రాయిము కుమారులలోనివాడు.’ ఆధునిక తెలుగులో సహజంగా ఉండి గోత్ర సంబంధాన్ని నిలుపుకునేలా ‘సంతతికి చెందిన’ అని అనువదించాం.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: అతని విభాగంలో ... ఉన్నారు
  rationale: מַחֲלֻקָה ఇక్కడ సైనిక విభాగాన్ని సూచిస్తుంది; עַל అధిపత్య సంబంధాన్ని తెలిపినా, సంఖ్యతో కూడిన తెలుగు వాక్యంలో ‘అతని విభాగంలో’ సహజంగా అదే సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: ఇరవై నాలుగు వేల మంది
  rationale: సైనికుల సంఖ్య కాబట్టి తెలుగులో సహజమైన వ్యక్తివాచక గణన కోసం ‘మంది’ చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన జాబితా శైలిని అనుసరించాం. నెలవారీ సైనిక నియామక భావాన్ని సహజంగా తెలియజేస్తూ, వ్యక్తి మరియు గోత్ర పేర్లను తెలుగు బైబిలు పఠనానికి అనుకూలంగా లిప్యంతరీకరించాం.
