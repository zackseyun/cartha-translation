translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన జాబితా శైలిని ఉపయోగించింది. హీబ్రూ వాక్యం క్రియారహితంగా ఉన్నప్పటికీ, పరిపాలనా జాబితా భావం తెలుగులో సహజంగా వ్యక్తమయ్యేందుకు ప్రవేశ భాగంలో “నియమించబడినవారు వీరు” అని పూరించింది. పేర్లను తెలుగు బైబిలు ధ్వని సంప్రదాయానికి దగ్గరగా ఉంచింది.
