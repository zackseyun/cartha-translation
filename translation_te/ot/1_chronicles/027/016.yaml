source:
  edition: WLC
  text: וְ/עַל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לָ/רֽאוּבֵנִ֣י נָגִ֔יד אֱלִיעֶ֖זֶר בֶּן זִכְרִ֑י לַ/שִּׁ֨מְעוֹנִ֔י שְׁפַטְיָ֖הוּ בֶּֽן מַעֲכָֽה־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/016.yaml
  text: 'And over the tribes of Israel: for the Reubenites[a], Eliezer son of Zichri was leader; for the Simeonites, Shephatiah son of Maacah.'
translation:
  language: te
  text: 'ఇశ్రాయేలు గోత్రాలపై అధికారులుగా: రూబేనీయులకు జిక్రీ కుమారుడు ఎలీయెజెరు నాయకుడు[a]; షిమ్యోనీయులకు మయాకా కుమారుడు షెఫట్యా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “అధిపతి,” “ప్రధానుడు,” లేదా “పాలకుడు”; హీబ్రూ: נָגִיד (నాగీద్‌).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: పై నియమించబడినవారు వీరు
  rationale: ఈ పదబంధం ముందున్న పరిపాలనా జాబితాతో అనుసంధానమై, గోత్రాలపై బాధ్యత లేదా పర్యవేక్షణను సూచిస్తుంది. తెలుగు జాబితా ప్రవేశవాక్యంగా సహజంగా ఉండేందుకు మూలంలో అంతర్లీనంగా ఉన్న భావాన్ని స్పష్టంచేసింది.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు గోత్రాలు
  rationale: హీబ్రూ సంబంధ నిర్మాణాన్ని స్పష్టమైన, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: לָרְאוּבֵנִי
  choice: రూబేనీయులకు
  rationale: ఈ జాతీయవాచక రూపం రూబేను అనే పితరుణ్ణి కాక అతని గోత్ర ప్రజలను సూచిస్తుంది.
- source_word: נָגִיד
  choice: నాయకుడు
  rationale: పరిపాలనా సందర్భంలో అధికార బాధ్యత పొందిన వ్యక్తిని సూచించే విస్తృతమైన పదం; రాజవంశార్థాన్ని అనవసరంగా చేర్చదు.
- source_word: אֱלִיעֶזֶר בֶּן זִכְרִי
  choice: జిక్రీ కుమారుడు ఎలీయెజెరు
  rationale: తెలుగులో సహజమైన వంశనామ క్రమాన్ని అనుసరించి, వ్యక్తి పేర్లను ధ్వన్యనుసారంగా ఇచ్చింది.
- source_word: לַשִּׁמְעוֹנִי
  choice: షిమ్యోనీయులకు
  rationale: జాతీయవాచక రూపం షిమ్యోను గోత్ర సమూహాన్ని సూచిస్తుంది; మొదటి భాగంతో సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: שְׁפַטְיָהוּ בֶּן מַעֲכָה
  choice: మయకా కుమారుడు షెఫట్యా
  rationale: మూలంలోని వంశసంబంధాన్ని తెలుగులో సహజ క్రమంలో ఇచ్చింది; మయకా పురుషుడా స్త్రీయా అనే విషయాన్ని పాఠం నిర్ధారించనందున అదనపు వివరణ చేర్చలేదు.
