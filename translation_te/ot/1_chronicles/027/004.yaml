id: 1CH.27.4
reference: 1 Chronicles 27:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עַ֞ל מַחֲלֹ֣קֶת הַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֗י דּוֹדַ֤י הָ/אֲחוֹחִי֙ וּ/מַ֣חֲלֻקְתּ֔/וֹ וּ/מִקְל֖וֹת הַ/נָּגִ֑יד וְ/עַל֙ מַחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/004.yaml
  text: Over the division for the second month was Dodai the Ahohite[a], and Mikloth was the leader over his division; and in his division were twenty-four thousand.
translation:
  language: te
  text: రెండో నెల దళానికి అహోహీయుడైన దోదై అధిపతి; అతని దళానికి మిక్లోతు నాయకుడు[a]. ఆ దళంలో ఇరవై నాలుగు వేల మంది ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని దళం, నాయకుడైన మిక్లోతు.” హీబ్రూ వాక్యక్రమం సంక్షిప్తంగా ఉంది. మిక్లోతు దోదై దళంలో రెండవ నాయకుడిగా పేర్కొనబడ్డాడా, లేక ఆ దళానికి నాయకునిగా నియమించబడ్డాడా అనే విషయంలో భిన్న అభిప్రాయాలు ఉన్నాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: מַחֲלֹקֶת
  choice: దళం
  rationale: నెలవారీగా సేవచేసే సైనిక విభాగాన్ని సూచించే ఈ సందర్భంలో ‘దళం’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: הַחֹדֶשׁ הַשֵּׁנִי
  choice: రెండో నెల
  rationale: నెలవారీ సేవాక్రమంలోని రెండవ నెలను తెలిపే సరళమైన క్రమసంఖ్యా ప్రయోగం.
- source_word: דּוֹדַי
  choice: దోదై
  rationale: ఈ వచనంలోని హీబ్రూ వ్యంజనరూపాన్ని అనుసరించిన లిప్యంతరీకరణ.
- source_word: הָאֲחוֹחִי
  choice: అహోహీయుడు
  rationale: వంశం లేదా గోత్ర సంబంధాన్ని తెలిపే విశేషణ నామాన్ని సహజమైన తెలుగు రూపంలో అందిస్తుంది.
- source_word: וּמַחֲלֻקְתּוֹ
  choice: అతని దళం
  rationale: ముందున్న అదే నామపదాన్ని తృతీయ పురుష ఏకవచన సంబంధంతో స్థిరంగా అనువదిస్తుంది.
- source_word: וּמִקְלוֹת
  choice: మిక్లోతు
  rationale: వ్యక్తి పేరుకు తెలుగు లిప్యంతరీకరణ.
- source_word: הַנָּגִיד
  choice: నాయకుడు
  rationale: పరిపాలనా-సైనిక సందర్భంలో పదవి యొక్క ఖచ్చిత స్థాయి నిర్ధారించకుండా నాయకత్వ భావాన్ని నిలుపుతుంది.
- source_word: וְעַל־מַחֲלֻקְתּוֹ
  choice: అతని దళంలో
  rationale: మిక్లోతు దోదై దళంలో నాయకత్వ పాత్ర పోషించాడనే సాధ్యమైన వాక్యనిర్మాణాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; హీబ్రూ క్రమంలోని సంక్షిప్తతను పాదసూచికలో సూచించాం.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: ఇరవై నాలుగు వేల మంది
  rationale: దళంలోని మనుషుల సంఖ్యను తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: దోదై, మిక్లోతుల నాయకత్వ సంబంధం
  choice: దోదై దళానికి అధిపతి; మిక్లోతు అతని దళంలో నాయకుడు
  alternative: దోదై మరియు అతని దళం, నాయకుడైన మిక్లోతు
  rationale: హీబ్రూ పదక్రమం సంక్షిప్తంగా ఉండి సంబంధం స్పష్టంగా లేదు. ప్రధాన పాఠం సందర్భానుకూలమైన ఆధీన నాయకత్వ భావాన్ని ఇస్తూ, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సైనిక-పరిపాలనా సందర్భానికి తగిన గౌరవప్రదమైన సరళ శైలి. ‘విభాగం’ కంటే వ్యక్తులతో కూడిన సైనిక యూనిట్‌ను స్పష్టంగా సూచించేందుకు ‘దళం’ వాడబడింది.
