source:
  edition: WLC
  text: וְ/לֹא נָשָׂ֤א דָוִיד֙ מִסְפָּרָ֔/ם לְ/מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וּ/לְ/מָ֑טָּה כִּ֚י אָמַ֣ר יְהוָ֔ה לְ/הַרְבּ֥וֹת אֶת יִשְׂרָאֵ֖ל כְּ/כוֹכְבֵ֥י הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/023.yaml
  text: But David did not count them from twenty years old and under[b][a], because Yahweh had said he would multiply Israel like the stars of the heavens.
translation:
  language: te
  text: అయితే దావీదు ఇరవై సంవత్సరాల వయస్సు, అంతకంటే తక్కువ వయస్సు ఉన్నవారిని లెక్కించలేదు[a]. ఎందుకంటే యాహ్వే ఇశ్రాయేలును ఆకాశంలోని నక్షత్రాలంతగా అనేకులుగా చేస్తానని చెప్పాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి సంఖ్యను తీసుకోలేదు.’ హీబ్రూ నుడికారం అక్షరార్థంగా ‘వారి సంఖ్యను ఎత్తలేదు’; ఇక్కడ దాని భావం వారిని లెక్కించలేదు లేదా వారి జనగణన చేయలేదు అని.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆకాశంలోని నక్షత్రాలంతగా’ అనే మాట ఇశ్రాయేలును అత్యధికంగా పెంచుతానని యాహ్వే చేసిన వాగ్దానాన్ని ప్రతిధ్వనింపజేస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: וְלֹא
  choice: అయితే ... లేదు
  rationale: ముందున్న జనగణన సందర్భంతో వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: נָשָׂא ... מִסְפָּרָם
  choice: వారిని లెక్కించలేదు
  rationale: అక్షరార్థంగా ‘వారి సంఖ్యను ఎత్తలేదు’ అనే హీబ్రూ నుడికారానికి ఇక్కడ జనగణన చేయలేదనే భావం ఉంది; ‘లెక్కించలేదు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: לְמִבֶּן עֶשְׂרִים שָׁנָה וּלְמָטָּה
  choice: ఇరవై ఏళ్లవారిని, అంతకంటే తక్కువ వయసున్నవారిని
  rationale: ఇరవై ఏళ్ల వయస్సుతో సహా దాని కంటే దిగువ వయస్సుల వారిని సూచించే సమగ్ర పరిధిని స్పష్టంగా తెలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: దావీదు ఆ వయోవర్గాన్ని లెక్కించకపోవడానికి కారణాన్ని పరిచయం చేస్తుంది.
- source_word: אָמַר יְהוָה
  choice: యెహోవా ... చెప్పాడు
  rationale: దైవనామాన్ని పేరుగానే ఉంచి, హీబ్రూ క్రియకు సహజమైన తెలుగు గతకాల రూపాన్ని వాడుతుంది.
- source_word: לְהַרְבּוֹת אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును ... విస్తరింపజేస్తానని
  rationale: దేవుడు తానే ఇశ్రాయేలును అత్యధిక సంఖ్యగా పెంచుతాడనే వాగ్దాన భావాన్ని ప్రత్యక్ష వాక్యాంశ రూపంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: כְּכוֹכְבֵי הַשָּׁמָיִם
  choice: ఆకాశ నక్షత్రాలంత
  rationale: హీబ్రూ ఉపమానాన్ని సంక్షిప్తంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన పేరురూపంలో ఉంచుతుంది.
- issue: ఇశ్రాయేలు విస్తరణ వాగ్దానం
  choice: ‘విస్తరింపజేస్తానని’—దేవుని స్వీయ వాగ్దానంగా
  alternative: ‘విస్తరింపజేయడానికి’—ఉద్దేశార్థక అనిశ్చిత రూపంగా
  rationale: אָמַר తరువాతి לְהַרְבּוֹת వాగ్దాన విషయాన్ని సూచిస్తుంది. తెలుగు ప్రత్యక్ష వాక్యాంశం కర్తను స్పష్టం చేస్తుంది; దేవుడు పలికిన వాగ్దానం అనే భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గౌరవప్రదమైన బైబిలు శైలిని నిలుపుతూ రూపొందించబడింది. వయస్సు పరిధి సమావేషకంగా స్పష్టీకరించబడింది; హీబ్రూ జనగణన నుడికారం ప్రధాన పాఠంలో సహజీకరించి పాదటిప్పణిలో వివరించబడింది.
