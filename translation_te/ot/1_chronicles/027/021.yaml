  register: ఆధునిక ప్రామాణిక తెలుగులో, పరిపాలనా జాబితాకు తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని సమాంతర నిర్మాణాన్ని సెమీకోలన్‌తో నిలిపాం.
