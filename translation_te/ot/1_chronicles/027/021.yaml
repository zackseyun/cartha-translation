source:
  edition: WLC
  text: לַ/חֲצִ֤י הַֽ/מְנַשֶּׁה֙ גִּלְעָ֔דָ/ה יִדּ֖וֹ בֶּן זְכַרְיָ֑הוּ לְ/בִנְיָמִ֔ן יַעֲשִׂיאֵ֖ל בֶּן אַבְנֵֽר־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/021.yaml
  text: 'for the half-tribe of Manasseh in Gilead: Iddo son of Zechariah[a]; for Benjamin: Jaasiel son of Abner.'
translation:
  language: te
  text: గిలాదులోని మనష్షే అర్థగోత్రానికి జెకర్యా కుమారుడైన ఇద్దో; బెన్యామీనుకు అబ్నేరు కుమారుడైన యాసీయేలు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యాషీయేలు.”
    reason: వ్యక్తినామానికి సంప్రదాయంలో కనిపించే ప్రత్యామ్నాయ లిప్యంతరీకరణను సూచిస్తుంది.
lexical_decisions:
- source_word: לַ/חֲצִי הַֽ/מְנַשֶּׁה
  choice: మనష్షే అర్ధగోత్రానికి
  rationale: ఇది పరిపాలనా జాబితా కాబట్టి חֲצִי సూచించేది మనష్షే గోత్రంలోని సగభాగాన్ని. తెలుగులో అర్థం స్పష్టంగా ఉండేందుకు ‘గోత్రం’ అనే పదాన్ని పూరించాం.
- source_word: גִּלְעָדָ/ה
  choice: గిలాదులోని
  rationale: ఇక్కడ దిశార్థక రూపం ఆ అర్ధగోత్రానికి సంబంధించిన భౌగోళిక ప్రాంతాన్ని గుర్తిస్తుంది; జాబితా సందర్భంలో ‘గిలాదులోని’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: יִדּוֹ
  choice: ఇద్దో
  rationale: మసొరా పాఠంలోని వ్యక్తినామాన్ని తెలుగు ధ్వనులకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן זְכַרְיָהוּ
  choice: జెకర్యా కుమారుడు
  rationale: בֶּן అనే వంశసంబంధ సూత్రాన్ని సహజమైన తెలుగు పదక్రమంలో ‘కుమారుడు’గా ఇచ్చాం; זְכַרְיָהוּ పేరును ప్రాచుర్యంలో ఉన్న సంక్షిప్త రూపంలో లిప్యంతరీకరించాం.
- source_word: לְ/בִנְיָמִן
  choice: బెన్యామీనుకు
  rationale: ఉపసర్గ לְ ఆ గోత్రానికి నియమించబడిన నాయకుణ్ణి సూచిస్తుంది; పునరావృత జాబితా నిర్మాణాన్ని సంక్షిప్తంగా నిలిపాం.
- source_word: יַעֲשִׂיאֵל
  choice: యాశీయేలు
  rationale: మసొరా స్వరచిహ్నాలకు దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణను ప్రధాన పాఠంలో వాడాం; ఆంగ్ల సంప్రదాయంలో కనిపించే ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో తెలిపాం.
- source_word: בֶּן אַבְנֵר
  choice: అబ్నేరు కుమారుడు
  rationale: వంశసంబంధ సూత్రాన్ని సహజమైన తెలుగు పదక్రమంలో ఇచ్చి, వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం.
