source:
  edition: WLC
  text: וְ/עַ֗ל עֹשֵׂי֙ מְלֶ֣אכֶת הַ/שָּׂדֶ֔ה לַ/עֲבֹדַ֖ת הָ/אֲדָמָ֑ה עֶזְרִ֖י בֶּן כְּלֽוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/026.yaml
  text: And over those who did the work of the field for the cultivation of the ground was Ezri son of Chelub[a][b].
translation:
  language: te
  text: నేలను సాగుచేయడానికి పొలపు పనులు చేసేవారిపై[a][b] కెలూబు కుమారుడైన ఎజ్రీ అధికారిగా ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పొలపు పనివారిపై.” హీబ్రూ కృదంత ప్రయోగాన్ని మరింత సంక్షిప్తంగా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నేలను సాగుచేసే పనికోసం.” ఈ పదబంధం వ్యవసాయార్థంలో నేలను సాగుచేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: అధిపతిగా
  rationale: ఈ పరిపాలనా జాబితాలో עַל ఒక బాధ్యతా విభాగంపై నియమించబడిన పర్యవేక్షకుని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో జాబితా కొనసాగింపును సహజంగా ఉంచుతూ ఈ భావాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: עֹשֵׂי מְלֶאכֶת הַשָּׂדֶה
  choice: పొలాల్లో వ్యవసాయ పనులు చేసేవారికి
  rationale: עשה యొక్క కృదంత రూపం ఆ పనిలో నిమగ్నమైన వారిని సూచిస్తుంది; מְלֶאכֶת הַשָּׂדֶה పొలానికి సంబంధించిన శ్రమను సూచిస్తుంది. తెలుగులో సహజమైన బహువచన వ్యక్తీకరణను వాడింది.
- source_word: לַעֲבֹדַת הָאֲדָמָה
  choice: వ్యవసాయ పనులు
  rationale: ఈ సందర్భంలో עֲבֹדָה మరియు אֲדָמָה కలసి నేలను సాగుచేయడాన్ని సూచిస్తాయి. ప్రధాన వాక్యంలో సంక్షిప్తంగా, సహజంగా తెలిపి, మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: עֶזְרִי בֶּן כְּלוּב
  choice: కెలూబు కుమారుడు ఎజ్రీ
  rationale: వ్యక్తినామాలను తెలుగు లిపిలో మూల హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించి, בן‌ను సహజమైన తెలుగు వంశసంబంధ నిర్మాణంతో అనువదించింది.
