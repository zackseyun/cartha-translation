    text: అక్షరార్థంగా ‘తండ్రుల గృహాల అధిపతులు’; ఇది పితృవంశం ఆధారంగా ఏర్పడిన సామాజిక-పరిపాలనా విభాగానికి సంబంధించిన పదం.
