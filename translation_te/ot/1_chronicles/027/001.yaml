  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֣י יִשְׂרָאֵ֣ל לְֽ/מִסְפָּרָ֡/ם רָאשֵׁ֣י הָ/אָב֣וֹת וְ/שָׂרֵ֣י הָֽ/אֲלָפִ֣ים וְ/הַ/מֵּא֡וֹת וְ/שֹׁטְרֵי/הֶם֩ הַ/מְשָׁרְתִ֨ים אֶת הַ/מֶּ֜לֶךְ לְ/כֹ֣ל דְּבַ֣ר הַֽ/מַּחְלְק֗וֹת הַ/בָּאָ֤ה וְ/הַ/יֹּצֵאת֙ חֹ֣דֶשׁ בְּ/חֹ֔דֶשׁ לְ/כֹ֖ל חָדְשֵׁ֣י הַ/שָּׁנָ֑ה הַֽ/מַּחֲלֹ֨קֶת֙ הָֽ/אַחַ֔ת עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׀׀־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/001.yaml
  text: The sons of Israel according to their number—the heads of fathers’ houses[a], and the commanders of thousands and of hundreds[c][b], and their officers who served the king in every matter of the divisions that came in and went out month by month throughout all the months of the year—each division was twenty-four thousand.
translation:
  language: te
  text: ఇశ్రాయేలీయుల సంఖ్య ప్రకారం పితృవంశాల అధిపతులు[a], వెయ్యిమందికి, వందమందికి నాయకులు, వారి అధికారులు రాజుకు సేవ చేసేవారు—సంవత్సరంలోని అన్ని నెలల్లో నెలనెలా సేవలోకి వచ్చి వెళ్లే విభాగాల ప్రతి వ్యవహారంలో. ప్రతి విభాగంలో ఇరవై నాలుగు వేలమంది ఉండేవారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘తండ్రుల గృహాల అధిపతులు’; ఇది పితృవంశం ఆధారంగా ఏర్పడిన సామాజిక-పరిపాలనా విభాగానికి సంబంధించిన పదం.
    reason: cultural_note
  - marker: b
    text: అంటే, ఈ విభాగాలు నెలనెలా వంతుల ప్రకారం రాజసేవలోకి వచ్చి, తమ సేవాకాలం ముగిసినప్పుడు వెళ్లేవి.
    reason: clarification
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులు
  rationale: అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఇక్కడ మొత్తం ప్రజాసమూహాన్ని సూచిస్తున్నందున ఆధునిక తెలుగులో సహజమైన సమష్టి రూపం.
- source_word: לְמִסְפָּרָם
  choice: వారి సంఖ్య ప్రకారం
  rationale: సంఖ్యాపరమైన లెక్కింపు లేదా వ్యవస్థీకరణ భావాన్ని నిలుపుతుంది.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: పితృవంశాల అధిపతులు
  rationale: కుటుంబ-వంశ ఆధారిత పరిపాలనా పదాన్ని ‘కుటుంబ పెద్దలు’గా సాధారణీకరించకుండా వ్యక్తపరుస్తుంది.
- source_word: וְשָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: వేలమందికి, వందమందికి అధిపతులు
  rationale: సైనిక-పరిపాలనా నాయకత్వాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וְשֹׁטְרֵיהֶם
  choice: వారి అధికారులు
  rationale: ఈ సందర్భంలో పరిపాలనా బాధ్యతగల అధికారులను సూచించే విస్తృతమైన, తటస్థ పదం.
- source_word: הַמְשָׁרְתִים אֶת הַמֶּלֶךְ
  choice: రాజుకు సేవచేశారు
  rationale: రాజసేవలోని నిరంతర అధికారిక విధిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: לְכֹל דְּבַר הַמַּחְלְקוֹת
  choice: విభాగాలకు సంబంధించిన ప్రతి విషయంలో
  rationale: דבר యొక్క ‘విషయం/వ్యవహారం’ అనే పరిపాలనా పరిధిని కాపాడుతుంది.
- source_word: הַבָּאָה וְהַיֹּצֵאת
  choice: సేవలోకి వచ్చి, సేవనుంచి వెళ్లే
  rationale: మూలంలోని వచ్చుట-వెళ్లుట జంటను ఉంచుతూ, సందర్భం సూచించే నెలవారీ రాజసేవ భ్రమణాన్ని స్పష్టం చేస్తుంది.
- source_word: חֹדֶשׁ בְּחֹדֶשׁ
  choice: నెలనెలా
  rationale: పంపిణీ భావమున్న హీబ్రూ నుడికారానికి సహజమైన తెలుగు రూపం.
- source_word: לְכֹל חָדְשֵׁי הַשָּׁנָה
  choice: సంవత్సరంలోని అన్ని నెలల్లో
  rationale: ఏడాది పొడవునా జరిగే పూర్తి చక్రాన్ని తెలియజేస్తుంది.
- source_word: הַמַּחֲלֹקֶת הָאַחַת
  choice: ఒక్కొక్క విభాగంలో
  rationale: అక్షరార్థమైన ‘ఒక విభాగం’ ఇక్కడ పంపిణీ భావంలో ప్రతి విభాగాన్ని సూచిస్తుంది.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: ఇరవై నాలుగు వేలమంది
  rationale: వ్యక్తుల సంఖ్యను తెలుగులో స్పష్టంగా తెలుపుతుంది.
