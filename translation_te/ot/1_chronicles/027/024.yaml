source:
  edition: WLC
  text: יוֹאָ֨ב בֶּן צְרוּיָ֜ה הֵחֵ֤ל לִ/מְנוֹת֙ וְ/לֹ֣א כִלָּ֔ה וַ/יְהִ֥י בָ/זֹ֛את קֶ֖צֶף עַל יִשְׂרָאֵ֑ל וְ/לֹ֤א עָלָה֙ הַ/מִּסְפָּ֔ר בְּ/מִסְפַּ֥ר דִּבְרֵֽי הַ/יָּמִ֖ים לַ/מֶּ֥לֶךְ דָּוִֽיד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/024.yaml
  text: Joab son of Zeruiah began to count[a], but he did not finish; and because of this wrath came upon Israel[b]. And the number was not entered in the account of the chronicles of King David.
translation:
  language: te
  text: సెరూయా కుమారుడైన యోవాబు లెక్కించడం మొదలుపెట్టాడు, కానీ దాన్ని పూర్తి చేయలేదు. దీనివల్ల ఇశ్రాయేలు మీద ఉగ్రత వచ్చింది. ఆ సంఖ్య దావీదు రాజు దినవృత్తాంతాల నమోదులో[a] నమోదు కాలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దినవృత్తాంతాలు’ అంటే దావీదు రాజుకు సంబంధించిన రాజసభ వార్షిక వృత్తాంతాలు లేదా అధికారిక నమోదులు.
    reason: cultural_note
  - marker: b
    text: ‘నమోదు కాలేదు’ అనే చోట హీబ్రూలో అక్షరార్థంగా ‘పైకి వెళ్లలేదు’ అని ఉంది; ఇక్కడ అది అధికారిక పత్రంలో చేర్చబడకపోవడాన్ని సూచించే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵחֵל לִמְנוֹת
  choice: ప్రజలను లెక్కించడం మొదలుపెట్టాడు
  rationale: החל + מנה అనే నిర్మాణం ‘లెక్కించడం మొదలుపెట్టు’ అని అర్థమిస్తుంది. సందర్భం జనగణనకు సంబంధించినది కాబట్టి తెలుగులో కర్మను స్పష్టంచేయడానికి ‘ప్రజలను’ చేర్చబడింది; అయితే ‘జనగణన చేపట్టాడు’ అనే మరింత వివరణాత్మక పదబంధాన్ని ఉపయోగించలేదు.
- source_word: וְלֹא כִלָּה
  choice: కానీ దాన్ని పూర్తి చేయలేదు
  rationale: כלה ఇక్కడ మొదలుపెట్టిన లెక్కింపును ముగించడం లేదా పూర్తి చేయడం అనే అర్థంలో ఉంది. ‘దాన్ని’ అనేది తెలుగులో ముందటి కార్యాన్ని సహజంగా సూచిస్తుంది.
- source_word: וַיְהִי בָזֹאת קֶצֶף עַל יִשְׂרָאֵל
  choice: దీనివల్ల ఇశ్రాయేలు మీద ఉగ్రత వచ్చింది
  rationale: בזאת ను కారణార్థకంగా ‘దీనివల్ల’ అని, קצף ను గంభీరమైన ‘ఉగ్రత’గా అనువదించింది. హీబ్రూ వాక్యం ఉగ్రత ఎవరిదో ప్రత్యక్షంగా చెప్పనందున కర్తను చేర్చలేదు.
- source_word: הַמִּסְפָּר
  choice: ఆ లెక్క
  rationale: ముందు పేర్కొన్న లెక్కింపు ద్వారా వచ్చిన సంఖ్య లేదా మొత్తం ఇక్కడ ఉద్దేశించబడింది. ‘ఆ లెక్క’ తెలుగు సందర్భంలో సహజంగా ఉండి పదసంబంధాన్ని నిలుపుతుంది.
- source_word: וְלֹא עָלָה
  choice: నమోదు కాలేదు
  rationale: עלה అక్షరార్థంగా ‘పైకి వెళ్లలేదు’ అయినా, అధికారిక జాబితా లేదా పత్రంలో చేర్చబడటాన్ని సూచించే పరిపాలనా ప్రయోగంగా ఇక్కడ ఉంది.
- source_word: בְּמִסְפַּר דִּבְרֵי הַיָּמִים
  choice: దినవృత్తాంతాల గ్రంథంలో
  rationale: דברי הימים రాజసంబంధమైన వార్షిక వృత్తాంతాలు లేదా అధికారిక చరిత్రపత్రాలను సూచిస్తుంది. ‘దినవృత్తాంతాల గ్రంథం’ సాధారణ పాఠకునికి గ్రాహ్యంగా ఉండి అధికారిక లిఖిత ఆధార భావాన్ని ఇస్తుంది.
- source_word: לַמֶּלֶךְ דָּוִיד
  choice: దావీదు రాజు
  rationale: లామెద్ ఇక్కడ సంబంధం లేదా స్వామ్యాన్ని సూచిస్తుంది. ‘దావీదు రాజు దినవృత్తాంతాలు’ అనేది తెలుగులో సహజమైన సంబంధ నిర్మాణం.
theological_decisions:
- issue: ఉగ్రతకు మూలమైన కర్తను దేవుడిగా ప్రత్యక్షంగా పేర్కొనాలా?
  choice: కర్తను అంతర్లీనంగానే ఉంచి ‘ఉగ్రత వచ్చింది’ అని అనువదించడం
  alternative: ‘యెహోవా ఉగ్రత ఇశ్రాయేలు మీదికి వచ్చింది’ లేదా ‘దేవుడు ఇశ్రాయేలు మీద కోపగించాడు’
  rationale: విస్తృత కథన సందర్భం దైవిక ఉగ్రతను బలంగా సూచించినా, ఈ హీబ్రూ వాక్యంలో దేవుడు లేదా యెహోవా అనే కర్త ప్రత్యక్షంగా లేదు. అందువల్ల మూలంలోని అంతర్లీనతను, ధార్మిక ఉద్వేగాన్ని నిలుపుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ఉగ్రత’ గంభీరమైన ధార్మిక సందర్భాన్ని నిలుపుతుంది; కర్తను మాత్రం మూలంలాగే పేర్కొనలేదు. పాదసూచిక గుర్తులు అవి వివరిస్తున్న పదబంధాల దగ్గర ఉంచబడ్డాయి.
