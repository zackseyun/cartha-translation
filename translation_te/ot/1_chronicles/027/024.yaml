  to: సెరూయా కుమారుడైన యోవాబు లెక్కించడం మొదలుపెట్టాడు, కానీ దాన్ని పూర్తి చేయలేదు. దీనివల్ల ఇశ్రాయేలు మీద ఉగ్రత వచ్చింది. ఆ సంఖ్య దావీదు రాజు దినవృత్తాంతాల నమోదులో[a] నమోదు కాలేదు[b].
