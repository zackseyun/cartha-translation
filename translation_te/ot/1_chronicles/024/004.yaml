  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన చారిత్రక-వంశావళి శైలి వాడబడింది. హీబ్రూ వాక్యంలోని పోలికను సహజమైన తెలుగు క్రమంలో ఉంచి, ‘పురుషులు/బలవంతులు’ అనే పదసందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
