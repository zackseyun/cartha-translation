source:
  edition: WLC
  text: וַ/יִּמָּצְא֣וּ בְֽנֵי אֶלְעָזָ֡ר רַבִּ֞ים לְ/רָאשֵׁ֧י הַ/גְּבָרִ֛ים מִן בְּנֵ֥י אִיתָמָ֖ר וַֽ/יַּחְלְק֑וּ/ם לִ/בְנֵ֨י אֶלְעָזָ֜ר רָאשִׁ֤ים לְ/בֵית אָבוֹת֙ שִׁשָּׁ֣ה עָשָׂ֔ר וְ/לִ/בְנֵ֧י אִיתָמָ֛ר לְ/בֵ֥ית אֲבוֹתָ֖/ם שְׁמוֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/004.yaml
  text: 'The sons of Eleazar were found to be more numerous[a], as heads of the men, than the sons of Ithamar, and they divided them thus: for the sons of Eleazar, sixteen heads of fathers’ houses, and for the sons of Ithamar, according to their fathers’ houses[b], eight.'
translation:
  language: te
  text: 'ఎలియాజరు కుమారులు పురుషుల ప్రధానులుగా ఈతామారు కుమారులకంటే ఎక్కువమందిగా ఉన్నారని తేలింది[a]. కాబట్టి వారిని ఈ విధంగా విభజించారు: ఎలియాజరు కుమారులకు పితృకుటుంబాల ప్రధానులు పదహారు మంది, ఈతామారు కుమారులకు వారి పితృకుటుంబాల ప్రకారం ఎనిమిది మంది[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పురుషుల ప్రధానులుగా” అన్న హీబ్రూ పదబంధాన్ని “బలవంతుల ప్రధానులుగా” లేదా “యోధుల ప్రధానులుగా” అని కూడా అర్థం చేసుకోవచ్చు. అయితే ఈ సందర్భంలో అది యాజక వంశాలకు చెందిన ప్రముఖ పురుషులను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “పితృకుటుంబాలు” అంటే పూర్వీకుల ఆధారంగా ఏర్పడిన కుటుంబ సమూహాలు లేదా వంశగృహాలు; ఇశ్రాయేలులో ఇది వంశపరమైన, పరిపాలనాపరమైన సాధారణ విభాగం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמָּצְאוּ
  choice: ఉన్నట్లు తేలింది
  rationale: నిఫ్అల్ రూపం ఇక్కడ భౌతికంగా ‘కనిపించడం’ కంటే పరిశీలనలో వెల్లడైన స్థితిని సూచిస్తుంది.
- source_word: רַבִּים
  choice: ఎక్కువమంది
  rationale: ఈతామారు కుమారులతో ఉన్న అంతర్గత పోలికను సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְרָאשֵׁי הַגְּבָרִים
  choice: పురుషులకు ప్రధానులుగా ఉన్నవారు
  rationale: רֹאשׁ లోని నాయకత్వ భావాన్నీ, גְּבָרִים లోని ‘పురుషులు/బలవంతులు’ అనే విస్తృత అర్థసాధ్యతనూ ప్రధాన పాఠంలో అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: וַיַּחְלְקוּם
  choice: వారిని ఇలా విభజించారు
  rationale: యాజక కుటుంబాలను సేవా విభాగాలుగా ఏర్పాటు చేసిన చర్యను తెలియజేస్తూ, తరువాతి సంఖ్యా విభజనకు సహజంగా దారి తీస్తుంది.
- source_word: רָאשִׁים
  choice: ప్రధానులు
  rationale: తెలుగులో సహజంగా ఉండే నాయకత్వ పదం; కుటుంబ నిర్మాణంలోని అధిపతులను సూచిస్తుంది.
- source_word: לְבֵית אָבוֹת / לְבֵית אֲבוֹתָם
  choice: పితృవంశాల ప్రకారం / వారి పితృవంశాల ప్రకారం
  rationale: ఇశ్రాయేలు వంశపారంపర్య కుటుంబ విభాగాన్ని సూచించే పదబంధాన్ని సంక్షిప్తంగా, అర్థవంతంగా అందిస్తుంది.
- source_word: שִׁשָּׁה עָשָׂר / שְׁמוֹנָה
  choice: పదహారు / ఎనిమిది
  rationale: రెండు వంశాలకు చెందిన ప్రధానుల సంఖ్యలను నేరుగా అందిస్తుంది.
