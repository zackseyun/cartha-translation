base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/022.yaml
  text: 'For the Izharite: Shelomoth[b][a]; for the sons of Shelomoth: Jahath.'
translation:
  language: te
  text: 'యిత్స్హారీయునికి: షెలోమోతు; షెలోమోతు కుమారులకు[a]: యహతు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కుమారులు” అనే మాట వంశావళి జాబితాల్లో విస్తృతంగా “వంశస్థులు” అని కూడా అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיִּצְהָרִי
  choice: ఇస్హారీయునికి
  rationale: లְ ఉపసర్గను ఈ పరిపాలనా జాబితాలో కేటాయింపు భావంతో సహజంగా ‘-నికి’ అని అనువదించాం; יִצְהָרִי అనేది ఇస్హారు వంశానికి చెందిన వ్యక్తి లేదా వర్గాన్ని సూచించే వంశనామం.
- source_word: שְׁלֹמוֹת
  choice: షెలోమోతు
  rationale: వ్యక్తి పేరును అనువదించకుండా, హెబ్రీ ఉచ్చారణకు సమీపంగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: לִבְנֵי
  choice: కుమారులకు
  rationale: లְ ఉపసర్గలోని కేటాయింపు భావాన్ని ‘-లకు’తో చూపించి, בְּנֵי యొక్క ప్రాథమిక అర్థమైన ‘కుమారులు’ను నిలిపాం; వంశావళి సందర్భంలో ఇది విస్తృతంగా ‘వారసులు/వంశస్థులు’ అని కూడా సూచించవచ్చు.
- source_word: יָחַת
  choice: యహతు
  rationale: హెబ్రీ వ్యక్తి పేరును దాని ఆరంభ య్ ధ్వనిని నిలుపుతూ తెలుగు లిప్యంతరీకరణ చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా నిర్మాణాన్ని మరియు హెబ్రీ వాక్యంలోని సంక్షిప్త పరిపాలనా శైలిని నిలిపే విధంగా అనువదించాం. వ్యక్తి పేర్లకు గౌరవప్రదమైన తెలుగు బైబిలు శైలికి అనుగుణంగా చివర ‘-ు’ను ఉపయోగించాం.
