translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే జాబితా శైలిని వాడాం. హీబ్రూలోని సంక్షిప్త నిర్మాణాన్ని పూర్తిగా విప్పి చెప్పకుండా, ద్విబిందువు మరియు అర్ధవిరామంతో వంశశాఖల క్రమాన్ని స్పష్టం చేశాం. పాదసూచిక [b]ను అది వివరిస్తున్న ‘మిగిలినవారి’ పదంపైనే ఉంచాం.
