  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לִ/בְנֵ֥י לֵוִ֖י הַ/נּוֹתָרִ֑ים לִ/בְנֵ֤י עַמְרָם֙ שֽׁוּבָאֵ֔ל לִ/בְנֵ֥י שׁוּבָאֵ֖ל יֶחְדְּיָֽהוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/020.yaml
  text: 'And for the remaining sons of Levi: for the sons of Amram[a], Shubael; for the sons of Shubael[b], Jehdeiah.'
translation:
  language: te
  text: 'లేవీయులలో మిగిలినవారి[b] విషయానికి: అమ్రాము కుమారులకు[a] షూబాయేలు; షూబాయేలు కుమారులకు యెహ్దెయా.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వంశాల జాబితాలో హీబ్రూ వాక్యం సంక్షిప్తంగా ఉంది; పేర్కొన్న వ్యక్తి పేరు ఆయా వంశశాఖ కుటుంబ ప్రధానిని లేదా ప్రతినిధిని సూచిస్తుండవచ్చు.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘లేవీయులలో మిగతావారి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי לֵוִי הַ/נּוֹתָרִים
  choice: లేవి కుమారుల్లో మిగిలినవారి విషయానికి
  rationale: వంశాల జాబితాలోని అనుసంధానాన్ని, వర్గాన్ని పరిచయం చేసే לְ ప్రయోగాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. הַנּוֹתָרִים అనే పదంలోని ‘మిగిలిన’ భావాన్ని నిలుపుతుంది.
- source_word: לִ/בְנֵי עַמְרָם
  choice: అమ్రాము కుమారుల్లో
  rationale: ఇది అమ్రాము వంశశాఖను పరిచయం చేసే జాబితా సూత్రం. ‘కుమారుల్లో’ అనే రూపం ఇక్కడ ప్రత్యక్ష కుమారులతో పాటు వంశశాఖ సభ్యులనూ సూచించగలదు.
- source_word: שׁוּבָאֵל
  choice: షూబాయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ధ్వన్యనుసారంగా అందించింది; వాక్యంలోని సంక్షిప్త వంశావళి శైలిలో ఇతడు కుటుంబ ప్రధానిని లేదా ప్రతినిధిని సూచించవచ్చు.
- source_word: לִ/בְנֵי שׁוּבָאֵל
  choice: షూబాయేలు కుమారుల్లో
  rationale: మూలంలోని పునరుక్త జాబితా నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతూ తదుపరి ఉపశాఖను పరిచయం చేస్తుంది.
- source_word: יֶחְדְּיָהוּ
  choice: యెహ్దెయా
  rationale: హీబ్రూ వ్యక్తినామానికి సరళమైన తెలుగు లిప్యంతరీకరణ; చివరి దైవనామాంశాన్ని తెలుగు బైబిలు నామరూపాల్లో సాధారణంగా కనిపించే ‘యా’ రూపంలో ఇచ్చింది.
