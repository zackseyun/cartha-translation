- from: వారిని చీట్లు వేసి, వీరిని వారితో కలిపి[a], విభజించారు. ఎందుకంటే ఎలియాజరు కుమారులలోనూ ఈతామారు కుమారులలోనూ పరిశుద్ధ స్థలపు అధికారులూ దేవుని అధికారులూ[b] ఉన్నారు.
