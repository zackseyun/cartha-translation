source:
  edition: WLC
  text: וַ/יַּחְלְק֥וּ/ם בְּ/גוֹרָל֖וֹת אֵ֣לֶּה עִם אֵ֑לֶּה כִּי הָי֤וּ שָֽׂרֵי קֹ֨דֶשׁ֙ וְ/שָׂרֵ֣י הָ/אֱלֹהִ֔ים מִ/בְּנֵ֥י אֶלְעָזָ֖ר וּ/בִ/בְנֵ֥י אִיתָמָֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/005.yaml
  text: So they divided them by lots[a], these with those[b], because there were officers of the sanctuary and officers of God from the sons of Eleazar and from the sons of Ithamar.
translation:
  language: te
  text: వారిని వీరితో వారిని కలిపి చీట్ల ద్వారా విభజించారు[a]. ఎందుకంటే ఎలీయాజరు కుమారులలోనూ ఇతామారు కుమారులలోనూ పరిశుద్ధ స్థలపు అధికారులూ దేవుని అధికారులూ[b] ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వీరిని వారితో.” లేదా “ఒక వర్గాన్ని మరొక వర్గంతో.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “పరిశుద్ధ స్థలపు ప్రధానులు, దేవుని ప్రధానులు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְלְקוּם
  choice: వారిని విభజించారు
  rationale: పీయేల్ క్రియారూపంలోని విభజించడం లేదా వాటా కేటాయించడం అనే భావాన్ని నేరుగా నిలుపుతుంది; సందర్భంలో యాజక కుటుంబాలను వర్గాలుగా కేటాయించడం ఉద్దేశం.
- source_word: בְּגוֹרָלוֹת
  choice: చీట్లు వేసి
  rationale: గోరాలు వేయడం ద్వారా నియామకం చేసిన విధానాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֵלֶּה עִם אֵלֶּה
  choice: వీరిని వారితో కలిపి
  rationale: రెండు కుటుంబ సమూహాలను పరస్పరం కలిపి లేదా సమాంతరంగా పరిగణించిన హీబ్రూ సంక్షిప్త ప్రయోగాన్ని వీలైనంతగా నిలుపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: చీట్ల ద్వారా విభజించడానికి తరువాతి వాక్యభాగం కారణమని స్పష్టంగా చూపుతుంది.
- source_word: שָׂרֵי קֹדֶשׁ
  choice: పరిశుద్ధ స్థలపు అధికారులు
  rationale: שָׂרֵי అనే పదంలోని నాయకత్వ లేదా అధికార బాధ్యతను, קֹדֶשׁ అనే పదానికి ఇక్కడ సహజమైన పవిత్రస్థల సంబంధాన్ని తెలియజేస్తుంది.
- source_word: וְשָׂרֵי הָאֱלֹהִים
  choice: దేవుని అధికారులు
  rationale: మూలంలో లేని ‘మందిరం’ లేదా ‘సేవ’ వంటి పదాలను చేర్చకుండా, ‘దేవుని అధికారులు’ అనే అసాధారణమైనప్పటికీ ఉద్దేశపూర్వకమైన సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: מִבְּנֵי אֶלְעָזָר וּבִבְנֵי אִיתָמָר
  choice: ఎలియాజరు కుమారులలోనూ ఈతామారు కుమారులలోనూ
  rationale: రెండు యాజక కుటుంబ వంశాలను సమాంతరంగా చూపిస్తూ, בְּנֵי అనే వంశావళి ప్రయోగాన్ని పారదర్శకంగా అందిస్తుంది.
theological_decisions:
- issue: שָׂרֵי קֹדֶשׁ וְשָׂרֵי הָאֱלֹהִים అనే రెండు సమాంతర బిరుదుల అర్థం
  choice: ‘పరిశుద్ధ స్థలపు అధికారులు, దేవుని అధికారులు’ అని రెండు వేర్వేరు సమాంతర నిర్దేశాలను నిలుపడం
  alternative: ‘పరిశుద్ధ వస్తువుల అధికారులు, దేవుని అధికారులు’ లేదా రెండవదాన్ని ‘దేవుని మందిరపు అధికారులు’ అని విస్తరించడం
  rationale: రెండు కుటుంబ వర్గాల్లో పవిత్ర బాధ్యతగల అధికారులు ఉన్నారనే కారణాన్ని వచనం తెలియజేస్తుంది. మూలంలో లేని సంస్థాగత పదాన్ని చేర్చకుండా దాని సమాంతరతను, కొంత అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని రెండు కుటుంబాల సమాంతరతను ‘లోనూ…లోనూ’తో చూపించాం; అస్పష్టమైన అధికార బిరుదులను అతిగా వివరణ చేయకుండా ఉంచాం.
