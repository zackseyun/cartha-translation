  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జాబితా శైలిని నిలుపుతూ, మూలంలోని చీట్ల కేటాయింపు భావాన్ని సహజంగా తెలియజేయడానికి ‘వంతు ... వచ్చింది’ అనే నిర్మాణం వాడాం.
