  text: ఐదవ చీటి మల్కీయాకు[a], ఆరవ చీటి మియామీనుకు వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మల్కీయా కొరకు ఐదవది; మియామీను కొరకు ఆరవది.” ఈ చీట్ల కేటాయింపు జాబితాలో హీబ్రూ ఉపసర్గను రెండు విధాలుగా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַלְכִּיָּה
  choice: మల్కీయాకు
  rationale: చీట్ల ద్వారా వంతుల కేటాయింపును సూచించే לְ ఉపసర్గను తెలుగులో సహజంగా ‘-కు’ విభక్తితో వ్యక్తం చేశాం; వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: הַחֲמִישִׁי
  choice: ఐదవ వంతు
  rationale: నిర్దేశకంతో ఉన్న క్రమసంఖ్య ఇక్కడ స్వతంత్ర నామవాచకంగా, ఐదవ చీటి లేదా సేవా క్రమవంతును సూచిస్తుంది. సందర్భాన్ని స్పష్టం చేయడానికి ‘వంతు’ చేర్చాం.
- source_word: לְמִיָּמִן
  choice: మీయామీనుకు
  rationale: మొదటి పదబంధంలాగే לְ కేటాయింపును సూచిస్తుంది; పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: הַשִּׁשִּׁי
  choice: ఆరవ వంతు
  rationale: ఇది జాబితాలోని ఆరవ చీటి లేదా సేవా క్రమవంతును సూచించే క్రమసంఖ్య; సహజమైన తెలుగుకోసం ‘వంతు’ వాడాం.
