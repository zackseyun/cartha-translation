source:
  edition: WLC
  text: בְּנֵ֤י עֻזִּיאֵל֙ מִיכָ֔ה לִ/בְנֵ֥י מִיכָ֖ה שמור׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/024.yaml
  text: 'The sons of Uzziel: Micah[a]; of the sons of Micah: Shamir.'
translation:
  language: te
  text: 'ఉజ్జీయేలు కుమారులు: మీకా; మీకా కుమారులు: షామీరు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “షెమోరు”; హీబ్రూ వ్యంజన రూపం שמורను ఈ విధంగా కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారుల్లో
  rationale: בן పదపు నిర్మాణ బహువచనం వంశావళి/జాబితా సూత్రంలో వచ్చింది. తెలుగు జాబితా శైలిలో ‘కుమారుల్లో’ అనేది సహజంగా ఉండి, పేర్కొన్న వ్యక్తి ఆ కుమారులలో ఒకడని తెలియజేస్తుంది.
- source_word: עֻזִּיאֵל
  choice: ఉజ్జీయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుకరణలో అందించాం; మధ్య హల్లులోని బలాన్ని ‘జ్జీ’ ద్వారా, చివరి ఏల్ ధ్వనిని ‘యేలు’ ద్వారా సూచించాం.
- source_word: מִיכָה
  choice: మీకా
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు ధ్వన్యనుకరణ.
- source_word: לִ/בְנֵי
  choice: కుమారుల్లో
  rationale: లామెద్‌ను యాంత్రికంగా ‘కొరకు/కు’ అని కాకుండా, వంశజాబితాలోని సంబంధసూచక శీర్షికగా గ్రహించి సహజమైన తెలుగు నిర్మాణంతో అనువదించాం.
- source_word: שמור
  choice: షామీరు
  rationale: ఇది వ్యక్తినామం. మసొరా పాఠంలోని అచ్చుసూచనలు లేకున్నా, సందర్భానుసార సంప్రదాయ పఠనం ‘షామీరు’ను ప్రధాన పాఠంలో ఉంచి, వ్యంజనాల ఆధారంగా సాధ్యమైన ‘షెమోరు’ను పాదటిప్పణిలో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త వంశావళి జాబితా శైలిని నిలిపాం. సెమీకోలన్ రెండు సమాంతర జాబితా భాగాలను స్పష్టంగా వేరు చేస్తుంది; వ్యక్తినామాలను మూల హీబ్రూ ధ్వనులకు దగ్గరగా లిప్యంతరీకరించాం.
