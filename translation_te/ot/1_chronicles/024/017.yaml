  text: యాకీనుకు ఇరవై ఒకటవది; గామూలుకు ఇరవై రెండవది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יָכִין
  choice: యాకీనుకు
  rationale: ఈ యాజక వర్గాల జాబితాలో לְ క్రమంలో కేటాయింపును సూచిస్తుంది. వ్యక్తి పేరును అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֶחָד וְ/עֶשְׂרִים
  choice: ఇరవై ఒకటవ వంతు
  rationale: హీబ్రూలో అక్షరార్థంగా సంఖ్యావాచక రూపం ఉన్నా, వరుసగా పేర్కొన్న యాజక వర్గాల సందర్భంలో ఇది క్రమసంఖ్యను సూచిస్తుంది. తెలుగులో జాబితా భావం స్పష్టంగా ఉండేందుకు ‘వంతు’ చేర్చాం.
- source_word: לְ/גָמוּל
  choice: గామూలుకు
  rationale: మొదటి పదబంధంలోలాగే לְ కేటాయింపును సూచిస్తుంది; పేరును హీబ్రూ రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: שְׁנַיִם וְ/עֶשְׂרִים
  choice: ఇరవై రెండవ వంతు
  rationale: రూపరీత్యా సంఖ్యావాచకమైనా, ఈ వరుస జాబితాలో క్రమసంఖ్యగా పనిచేస్తుంది. సహజమైన తెలుగు జాబితా శైలిలో ‘ఇరవై రెండవ వంతు’ అని ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన జాబితా శైలి వాడబడింది. మూలంలో ‘వంతు’కు ప్రత్యక్ష నామవాచకం లేకపోయినా, ముందున్న సందర్భంలో యాజక సేవా విభాగాల కేటాయింపును సహజంగా తెలియజేయడానికి దాన్ని పూరించాం.
