translation:
  language: te
  text: 'మహలీ విషయానికొస్తే: ఎలియాజరు[a]; అతనికి కుమారులు లేరు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “మహలీకి సంబంధించి: ఎలియాజరు; అతనికి కుమారులు లేరు.” ఆరంభంలోని ఉపసర్గ బహుశా జాబితా శీర్షికగా లేదా అంశ సూచికగా పనిచేస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַחְלִי
  choice: మహలీ విషయానికొస్తే
  rationale: ఉపసర్గ לְ ఇక్కడ వంశావళి జాబితాలో అంశాన్ని పరిచయం చేసే సూచికగా పనిచేస్తుంది. ఈ తెలుగు ప్రయోగం ఆ జాబితా నిర్మాణాన్ని సహజంగా నిలుపుతుంది.
- source_word: אֶלְעָזָר
  choice: ఎలియాజరు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: וְלֹא הָיָה לוֹ
  choice: అతనికి ... లేరు
  rationale: అక్షరార్థంగా ‘అతనికి ... ఉండలేదు’ అనే హీబ్రూ స్వామ్య ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; వాక్య సంబంధాన్ని అనవసరమైన వ్యతిరేక భావంతో బలపరచలేదు.
- source_word: בָּנִים
  choice: కుమారులు
  rationale: ఈ వంశావళి సందర్భంలో పదం ప్రత్యేకంగా కుమారులను సూచిస్తుంది; సాధారణమైన ‘పిల్లలు’ అని విస్తరించలేదు.
theological_decisions: []
