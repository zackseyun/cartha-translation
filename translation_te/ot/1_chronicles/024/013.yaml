    text: లేదా, “హుప్పా కొరకు ... యెషెబెయాబ్ కొరకు.” ఈ కేటాయింపు జాబితాలో హీబ్రూ ఉపసర్గను ‘కు’ లేదా ‘కొరకు’ అని అనువదించవచ్చు.
    reason: లְ ఉపసర్గకు ఉన్న అనువాద ప్రత్యామ్నాయాన్ని సూచిస్తుంది; మూలపాఠంలో సంక్షిప్తంగా ఉన్న భావాన్ని అతిగా విస్తరించదు.
lexical_decisions:
- source_word: לְ/חֻפָּה
  choice: హుప్పాకు
  rationale: ఈ చీట్ల కేటాయింపు జాబితాలో పేరుకు ముందు ఉన్న לְ కేటాయింపును సూచిస్తుంది. తెలుగులో దత్తివిభక్తి ‘-కు’ సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: שְׁלֹשָׁה עָשָׂר
  choice: పదమూడవది
  rationale: మూలంలో సంఖ్యావాచక రూపం ఉన్నప్పటికీ, వరుసగా పడిన చీట్ల సందర్భంలో అది క్రమసంఖ్యగా పనిచేస్తుంది.
- source_word: לְ/יֶשֶׁבְאָב
  choice: యెషెబాబుకు
  rationale: మొదటి పేరులోలాగే לְ కేటాయింపును సూచిస్తుంది; ‘-కు’ అనే రూపం జాబితా సందర్భానికి సహజం.
- source_word: אַרְבָּעָה עָשָׂר
  choice: పద్నాలుగవది
  rationale: రూపరీత్యా సంఖ్యావాచకమైనా, చీట్ల క్రమంలో పద్నాలుగవ స్థానాన్ని సూచిస్తున్నందున క్రమసంఖ్యగా అనువదించబడింది.
