translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త జాబితా శైలిని నిలిపి ఉంచాం. వ్యక్తుల పేర్లను హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం; చీట్ల కేటాయింపు భావాన్ని ప్రధాన పాఠ్యంలో అతిగా విస్తరించలేదు.
