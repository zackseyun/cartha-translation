lexical_decisions:
- source_word: לְקִישׁ
  choice: కీషు విషయానికి
  rationale: ఈ వంశావళి/విభాగాల జాబితాలో לְ ఉపసర్గ కీషుకు సంబంధించిన అంశాన్ని పరిచయం చేసే శీర్షికా లేదా విషయసూచక ప్రయోగంగా ఉంది. సహజమైన తెలుగులో జాబితా నిర్మాణాన్ని నిలుపుకోవడానికి ‘కీషు విషయానికి’ అని అనువదించాం.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది ‘కుమారులు’ అనే అర్థమిచ్చే నిర్మాణ బహువచనం. వంశస్థులు అనే విస్తృత అర్థం సాధ్యమైనా, ఇక్కడ వెంటనే ఒక వ్యక్తి పేరు రావడం వల్ల ప్రత్యక్షమైన ‘కుమారులు’ను ఉంచాం.
- source_word: קִישׁ
  choice: కీషు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: יְרַחְמְאֵל
  choice: యెరహ్మెయేలు
  rationale: కీషు వంశానికి చెందిన పేరుగా జాబితాలో వచ్చిన వ్యక్తి పేరును లిప్యంతరీకరించాం.
