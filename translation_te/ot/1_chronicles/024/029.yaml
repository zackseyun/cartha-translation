translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జాబితా శైలిని పాటించాం. మూలంలోని శీర్షికా నిర్మాణాన్ని కోలన్‌తో, తరువాతి ఏకైక పేరును డాష్‌తో స్పష్టపరిచాం; హెబ్రీలోని బహువచనమైన ‘కుమారులు’ను యథాతథంగా నిలిపాం.
