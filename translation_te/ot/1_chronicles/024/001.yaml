  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לִ/בְנֵ֥י אַהֲרֹ֖ן מַחְלְקוֹתָ֑/ם בְּנֵ֣י אַהֲרֹ֔ן נָדָב֙ וַ/אֲבִיה֔וּא אֶלְעָזָ֖ר וְ/אִיתָמָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/001.yaml
  text: 'These were the divisions of the sons of Aaron: the sons of Aaron were Nadab and Abihu[a], Eleazar and Ithamar.'
translation:
  language: te
  text: 'అహరోను కుమారుల విభాగాలు[a] ఇవి: అహరోను కుమారులు నాదాబు, అబీహు, ఎలియాజరు, ఈతామారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘క్రమాలు’; హెబ్రీ పదం క్రమబద్ధంగా ఏర్పరచిన యాజక బృందాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי
  choice: అహరోను కుమారుల ... ఇవి
  rationale: హెబ్రీలోని సంధానక అవ్యయం, ఉపసర్గ కలసి ఈ కొత్త విభాగాన్ని పరిచయం చేస్తున్నాయి. తెలుగులో అనవసరంగా ‘మరియు’ లేదా ‘ఇప్పుడు’ చేర్చకుండా, శీర్షికలాంటి వాక్య నిర్మాణంతో ఆ సంభాషణాత్మక విధిని సహజంగా వ్యక్తం చేశాం.
- source_word: מַחְלְקוֹתָם
  choice: విభాగాలు
  rationale: ఈ నామవాచకం క్రమపరచబడిన విభజనలను లేదా బృందాలను సూచిస్తుంది. ‘విభాగాలు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, సందర్భంలోని యాజక సేవా ఏర్పాటును ముందుగానే అతిగా నిర్దిష్టం చేయదు.
- source_word: בְּנֵי אַהֲרֹן
  choice: అహరోను కుమారులు
  rationale: మూలంలోని సంబంధ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా అందిస్తుంది; మూలంలో కుమారులనే పేర్కొన్నందున లింగార్థాన్ని నిలుపుతుంది.
- source_word: נָדָב וַאֲבִיהוּא אֶלְעָזָר וְאִיתָמָר
  choice: నాదాబు, అబీహు, ఎలియాజరు, ఈతామారు
  rationale: వ్యక్తి పేర్లకు తెలుగులో స్థిరపడిన బైబిలు రూపాలను వాడాం. పేర్ల జాబితాలోని హెబ్రీ సంధానాలను తెలుగులో సహజమైన విరామచిహ్నాలతో వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని వాడాం. మూలంలో లేని కాలసూచక ‘ఇప్పుడు’ అనే మాటను చేర్చలేదు. పాదటిప్పణి సూచికను అది వివరిస్తున్న ‘విభాగాలు’ అనే పదం వెంట ఉంచాం.
