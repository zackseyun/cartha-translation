source:
  edition: WLC
  text: וַ/יָּ֨מָת נָדָ֤ב וַ/אֲבִיהוּא֙ לִ/פְנֵ֣י אֲבִי/הֶ֔ם וּ/בָנִ֖ים לֹא הָי֣וּ לָ/הֶ֑ם וַֽ/יְכַהֲנ֔וּ אֶלְעָזָ֖ר וְ/אִיתָמָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/002.yaml
  text: But Nadab and Abihu died before their father[a], and they had no sons; so Eleazar and Ithamar served as priests.
translation:
  language: te
  text: అయితే నాదాబు, అబీహు తమ తండ్రికంటే ముందే[a] చనిపోయారు; వారికి కుమారులు లేరు. కాబట్టి ఎలియాజరు, ఈతామారు యాజకులుగా సేవ చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమ తండ్రి సమక్షంలో.’ హీబ్రూ పదబంధాన్ని స్థలార్థంలో (‘ఎదుట/సమక్షంలో’) లేదా కాలార్థంలో (‘ముందే,’ అంటే తమ తండ్రి జీవించివుండగానే) అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּמָת
  choice: చనిపోయారు
  rationale: מוּת క్రియ యొక్క కథన భూతకాల రూపాన్ని సహజమైన ఆధునిక తెలుగు సాధారణ భూతకాలంతో వ్యక్తం చేస్తుంది.
- source_word: לִפְנֵי
  choice: తమ తండ్రికంటే ముందే
  rationale: ఇక్కడ ఈ పదబంధం ప్రధానంగా వారి తండ్రి చనిపోకముందే, అంటే ఆయన జీవించివుండగానే, వారు చనిపోయారని సూచిస్తుంది; స్థలార్థకమైన మరో అవగాహనను పాదసూచికలో నిలిపాం.
- source_word: אֲבִיהֶם
  choice: తమ తండ్రి
  rationale: మూడవ పురుష బహువచన ప్రత్యయం నాదాబు, అబీహుల తండ్రిని సూచిస్తుంది; తెలుగు వాక్యంలో కర్తతో సంబంధాన్ని సహజంగా చూపేందుకు ‘తమ’ వాడాం.
- source_word: וּבָנִים לֹא הָיוּ לָהֶם
  choice: వారికి కుమారులు లేరు
  rationale: בָּנִים ఇక్కడ సాధారణంగా పిల్లలు అనే అర్థం కాకుండా ప్రత్యేకంగా కుమారులను సూచిస్తుంది.
- source_word: וַיְכַהֲנוּ
  choice: యాజకులుగా సేవచేశారు
  rationale: כָּהַן పియేల్ రూపంలోని యాజక సేవను నిర్వహించడం అనే క్రియాత్మక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: אֶלְעָזָר וְאִיתָמָר
  choice: ఎలియాజరు, ఈతామారు
  rationale: వ్యక్తినామాలను తెలుగులో స్థిరపడిన బైబిలు ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని వరుస కథన సంబంధాన్ని ‘అయితే,’ ‘కాబట్టి’ ద్వారా స్పష్టంగా చూపించాం; לִפְנֵי లోని నిజమైన ద్వంద్వార్థాన్ని ప్రధాన పాఠం మరియు పాదసూచికలో సంరక్షించాం.
