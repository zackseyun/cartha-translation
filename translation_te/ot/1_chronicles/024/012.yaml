source:
  edition: WLC
  text: לְ/אֶלְיָשִׁיב֙ עַשְׁתֵּ֣י עָשָׂ֔ר לְ/יָקִ֖ים שְׁנֵ֥ים עָשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/012.yaml
  text: the eleventh to Eliashib[b][a], the twelfth to Jakim.
translation:
  language: te
  text: పదకొండవది ఎల్యాషీబుకు[a][b], పన్నెండవది యాకీముకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎల్యాషీబు కోసం … యాకీము కోసం.’ ఈ కేటాయింపు జాబితాలోని హెబ్రీ పూర్వప్రత్యయాన్ని రెండు విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘పదకొండు … పన్నెండు’; చీట్ల వరుసను తెలిపే ఈ సందర్భంలో అవి క్రమసంఖ్యలుగా పనిచేస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/אֶלְיָשִׁיב
  choice: ఎల్యాషీబుకు
  rationale: ఈ చీట్ల కేటాయింపు జాబితాలో לְ ఉపసర్గ గ్రహీతను సూచిస్తుంది; తెలుగులో ‘-కు’ సహజంగా ఆ భావాన్ని వ్యక్తపరుస్తుంది. పేరును హెబ్రీ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: עַשְׁתֵּי עָשָׂר
  choice: పదకొండవది
  rationale: మూలంలో సంఖ్యాపదం అక్షరార్థంగా ‘పదకొండు’ అయినా, వరుసగా చీట్ల కేటాయింపులను తెలిపే సందర్భంలో క్రమసంఖ్యగా పనిచేస్తుంది. ‘చీటి’ మూలపాఠంలో ఈ వచనంలో ప్రత్యక్షంగా లేదు కాబట్టి చేర్చలేదు.
- source_word: לְ/יָקִים
  choice: యాకీముకు
  rationale: לְ ఉపసర్గ ఇక్కడ కూడా కేటాయింపును పొందిన వ్యక్తిని సూచిస్తుంది. יָקִים అనే పేరును హెబ్రీ స్వరరూపానికి దగ్గరగా ‘యాకీము’గా లిప్యంతరీకరించి, విభక్తితో ‘యాకీముకు’ అని ఇచ్చాం.
- source_word: שְׁנֵים עָשָׂר
  choice: పన్నెండవది
  rationale: అక్షరార్థంగా ‘పన్నెండు’ అయిన ఈ సంఖ్యాపదం జాబితా సందర్భంలో క్రమసంఖ్యగా పనిచేస్తుంది; అందువల్ల సహజమైన తెలుగులో ‘పన్నెండవది’ అని అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త పరిపాలనా జాబితా శైలిని నిలిపాం. మూలంలో సూచితమైన ‘చీటి’ని ప్రధాన పాఠ్యంలో చేర్చకుండా, సంఖ్యల క్రమార్థాన్ని సహజమైన ‘పదకొండవది/పన్నెండవది’ రూపాలతో వ్యక్తపరిచాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచాం.
