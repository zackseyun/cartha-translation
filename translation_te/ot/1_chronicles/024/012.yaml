  source_fidelity: 'హెబ్రీ కేటాయింపు-జాబితా నిర్మాణాన్ని నమ్మకంగా ప్రతిబింబించింది: సంఖ్యలు సందర్భానుసారం క్రమసంఖ్యలుగా ఉన్నాయి; לְ ఉపసర్గకు సహజమైన ‘-కు’ రూపం వాడబడింది; మూలంలో ప్రత్యక్షంగా లేని ‘చీటి’ని ప్రధాన పాఠ్యంలో చేర్చలేదు.'
  naturalness: ‘పదకొండవది ఎల్యాషీబుకు, పన్నెండవది యాకీముకు’ అనేది ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త జాబితా శైలికి సహజంగా ఉంది. ‘ది’ రూపం, ముందరి సందర్భంలో సూచితమైన కేటాయింపు/చీటి అంశాన్ని అనవసరంగా పునరుక్తి చేయకుండా సూచిస్తుంది.
