translation:
  language: te
  text: దెలాయాకు ఇరవై మూడవది; మయజ్యాకు ఇరవై నాలుగవది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִדְלָיָהוּ
  choice: దెలాయాకు
  rationale: జాబితాలో యాజక విభాగం లేదా చీటి కేటాయింపును సూచించే לְ ఉపసర్గను తెలుగులో సహజమైన సంప్రదాన విభక్తి ‘-కు’తో వ్యక్తం చేశాం; వ్యక్తి పేరును లిప్యంతరీకరించాం.
- source_word: שְׁלֹשָׁה וְעֶשְׂרִים
  choice: ఇరవై మూడవ వంతు
  rationale: హీబ్రూ రూపం అక్షరార్థంగా సంఖ్యావాచకమైనప్పటికీ, వరుసగా కేటాయించబడిన యాజక విభాగాల్లో ఇది ఇరవై మూడవ స్థానాన్ని సూచిస్తుంది. సందర్భంలో అంతర్లీనంగా ఉన్న ‘వంతు/విభాగం’ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేయడానికి ‘వంతు’ చేర్చాం.
- source_word: לְמַעַזְיָהוּ
  choice: మయజ్యాకు
  rationale: לְ ఉపసర్గ ఇక్కడ కేటాయింపును సూచిస్తుంది; తెలుగులో ‘-కు’ సహజంగా ఆ భావాన్ని అందిస్తుంది. పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: אַרְבָּעָה וְעֶשְׂרִים
  choice: ఇరవై నాలుగవ వంతు
  rationale: రూపపరంగా సంఖ్యావాచక నిర్మాణమైనా, ఈ వరుసలో ఇరవై నాలుగవ కేటాయింపును సూచిస్తుంది; అందువల్ల తెలుగులో క్రమసంఖ్యతో ‘వంతు’ అని అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్త జాబితా శైలిని నిలుపుతూ, ముందు వచనాల నుంచి ఊహించబడే కేటాయింపు భావాన్ని ‘వంతు’ ద్వారా సహజంగా వ్యక్తం చేసింది.
