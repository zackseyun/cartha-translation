revisions:
- from: వీరు కూడా తమ సహోదరులైన అహరోను కుమారులతో సమానంగా[a], రాజైన దావీదు, సాదోకు, అహీమెలెకు, యాజకులూ లేవీయులూ అయిన పితృకుటుంబాల పెద్దల సమక్షంలో చీట్లు వేశారు—ప్రధాన పితృకుటుంబాలకు, వారి చిన్న సహోదరుల పితృకుటుంబాలకు ఒకే విధంగా.[b]
  to: వీరు కూడా తమ సహోదరులైన అహరోను కుమారులతో పాటు[a], రాజైన దావీదు, సాదోకు, అహీమెలెకు, యాజకుల, లేవీయుల పితృకుటుంబాల పెద్దల సమక్షంలో చీట్లు వేశారు—ప్రధాన పితృకుటుంబాలకు చెందినవారూ తమ చిన్న సహోదరుల పితృకుటుంబాలకు చెందినవారూ ఒకే విధంగా.[b]
  rationale: The revision removes a potentially misleading Telugu dative construction, improves the relationship of the priestly and Levitical clan leaders, and retains the source’s compressed, disputed final construction with a cautious explanatory footnote. ‘తో పాటు’ is natural in the main text and avoids making an unqualified claim of equality from לְעֻמַּת.
