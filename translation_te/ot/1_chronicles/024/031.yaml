reference: 1 Chronicles 24:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּפִּילוּ֩ גַם הֵ֨ם גּוֹרָל֜וֹת לְ/עֻמַּ֣ת אֲחֵי/הֶ֣ם בְּנֵֽי אַהֲרֹ֗ן לִ/פְנֵ֨י דָוִ֤יד הַ/מֶּ֨לֶךְ֙ וְ/צָד֣וֹק וַ/אֲחִימֶ֔לֶךְ וְ/רָאשֵׁי֙ הָֽ/אָב֔וֹת לַ/כֹּהֲנִ֖ים וְ/לַ/לְוִיִּ֑ם אָב֣וֹת הָ/רֹ֔אשׁ לְ/עֻמַּ֖ת אָחִ֥י/ו הַ/קָּטָֽן־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/031.yaml
  text: These also cast lots alongside their brothers[a], the sons of Aaron, before King David, Zadok, Ahimelech[b], and the heads of the fathers’ houses of the priests and of the Levites—the chief fathers’ houses as well as those of their younger brothers.
translation:
  language: te
  text: వీరు కూడా తమ సహోదరులైన అహరోను కుమారులతో పాటు[a], రాజైన దావీదు, సాదోకు, అహీమెలెకు, యాజకుల, లేవీయుల పితృకుటుంబాల పెద్దల సమక్షంలో చీట్లు వేశారు—ప్రధాన పితృకుటుంబాలకు చెందినవారూ తమ చిన్న సహోదరుల పితృకుటుంబాలకు చెందినవారూ ఒకే విధంగా.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ సహోదరులైన అహరోను కుమారులకు అనుగుణంగా.” హీబ్రూ పదబంధానికి “ఎదురుగా,” “అనుగుణంగా,” లేదా “వారితో పాటు” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ అక్షరార్థంగా, “ప్రధానుని పితృకుటుంబాలు తన చిన్న సహోదరునికి అనుగుణంగా.” ఇక్కడి ఏకవచన రూపాలు విభజనాత్మకంగా వాడబడి, ప్రధాన కుటుంబ శాఖలకూ చిన్న శాఖలకూ ఒకే విధంగా చీట్లు వేసినట్లు సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפִּילוּ ... גּוֹרָלוֹת
  choice: చీట్లు వేశారు
  rationale: హీబ్రూ నుడికారానికి సహజమైన తెలుగు రూపం; విధి నిర్ణయానికి చీట్లు వేయడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: גַם הֵם
  choice: వీరు కూడా
  rationale: ముందు ప్రస్తావించిన లేవీయుల వర్గాలను తిరిగి సూచిస్తూ, వారు కూడా ఈ ప్రక్రియలో పాల్గొన్నారని తెలుపుతుంది.
- source_word: לְעֻמַּת אֲחֵיהֶם בְּנֵי אַהֲרֹן
  choice: తమ సహోదరులైన అహరోను కుమారులతో సమానంగా
  rationale: לְעֻמַּת అనే పదంలోని ‘ఎదురుగా/అనుగుణంగా/సమాన స్థాయిలో’ అనే పరిధిని ఈ పరిపాలనా సందర్భంలో సహజంగా అందిస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: לִפְנֵי
  choice: సమక్షంలో
  rationale: చీట్లు వేయడం పేర్కొన్న నాయకుల సాక్షిగా జరిగిన అధికారిక ప్రక్రియ అని సహజ తెలుగులో సూచిస్తుంది.
- source_word: דָוִיד הַמֶּלֶךְ
  choice: రాజైన దావీదు
  rationale: హీబ్రూ పేరు-బిరుదు సంబంధాన్ని గౌరవిస్తూ తెలుగులో సహజంగా ఉంది.
- source_word: וְצָדוֹק וַאֲחִימֶלֶךְ
  choice: సాదోకు, అహీమెలెకు
  rationale: వ్యక్తుల పేర్లను తెలుగు బైబిలు శైలికి సరిపోయే విధంగా లిప్యంతరీకరించింది.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: పితృకుటుంబాల పెద్దలు
  rationale: వంశాధారిత కుటుంబ విభాగాల నాయకులను సూచించే హీబ్రూ సామాజిక నిర్మాణాన్ని అర్థమయ్యే ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: యాజకులూ లేవీయులూ అయిన
  rationale: ఆ పితృకుటుంబాల పెద్దలు ఏ వర్గాలకు చెందినవారో తెలుగులో స్పష్టంగా అనుసంధానిస్తుంది.
- source_word: אָבוֹת הָרֹאשׁ לְעֻמַּת אָחִיו הַקָּטָן
  choice: ప్రధాన పితృకుటుంబాలకు, వారి చిన్న సహోదరుల పితృకుటుంబాలకు ఒకే విధంగా
  rationale: సంక్షిప్తమైన, ఏకవచన హీబ్రూ రూపాలను విభజనాత్మక అర్థంలో తీసుకుని, పెద్ద మరియు చిన్న శాఖలకు సమాన ప్రక్రియ వర్తించిందని తెలియజేస్తుంది; మూలంలోని అక్షరార్థ నిర్మాణాన్ని పాదటిప్పణిలో చూపిస్తుంది.
theological_decisions:
- issue: పెద్ద మరియు చిన్న కుటుంబ శాఖల మధ్య చీట్ల ప్రక్రియలో స్థానం
  choice: రెండు వర్గాలకూ ఒకే విధంగా చీట్లు వేసినట్లు అనువదించడం
  alternative: ‘ప్రధాన పితృకుటుంబం తన చిన్న సహోదరునికి ఎదురుగా’ అని అక్షరార్థంగా ఉంచడం
  rationale: ఇది సిద్ధాంతపరమైన శ్రేణీకరణను చేర్చకుండా, హీబ్రూ ఏకవచనాల విభజనాత్మక ప్రయోగాన్ని సందర్భానుసారంగా వ్యక్తపరుస్తుంది; అక్షరార్థ అస్పష్టత పాదటిప్పణిలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘పితృకుటుంబాలు’ అనే పదం మూలంలోని వంశాధారిత సంస్థాగత భావాన్ని కాపాడుతుంది. మూలంలోని לְעֻמַּת పదం మరియు చివరి సంక్షిప్త ఏకవచన నిర్మాణంలోని నిజమైన అస్పష్టతలను పాదటిప్పణుల్లో నిలిపాం.
