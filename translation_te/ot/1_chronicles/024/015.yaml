  text: హేజీరుకు పదిహేడవ వంతు, హప్పిజ్జేసుకు పద్దెనిమిదవ వంతు వచ్చింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְחֵזִיר
  choice: హేజీరుకు
  rationale: లామెద్ ఉపసర్గ చీట్ల ద్వారా నియమించబడిన వంతును పొందిన వ్యక్తిని సూచిస్తోంది; వ్యక్తిపేరును అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: שִׁבְעָה עָשָׂר
  choice: పదిహేడవ వంతు
  rationale: యాజక విభాగాల చీట్ల క్రమంలో ఈ సంఖ్య క్రమసంఖ్యగా పనిచేస్తోంది; తెలుగులో సందర్భం స్పష్టంగా ఉండేందుకు ‘వంతు’ చేర్చాం.
- source_word: לְהַפִּצֵּץ
  choice: హప్పిజ్జేసుకు
  rationale: లామెద్ ఉపసర్గ నియామకాన్ని సూచిస్తోంది; హెబ్రీ వ్యక్తిపేరును అర్థానువాదం చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: שְׁמוֹנָה עָשָׂר
  choice: పద్దెనిమిదవ వంతు
  rationale: చీట్ల వరుసను సూచించే క్రమసంఖ్యగా గ్రహించి, సహజమైన తెలుగులో ‘వంతు’తో వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, జాబితా సందర్భాన్ని స్పష్టం చేసేలా అనువదించబడింది. మూలంలోని సమాంతర నిర్మాణాన్ని నిలుపుతూ, తెలుగులో పూర్తి వాక్య సహజత్వం కోసం ‘వచ్చింది’ను చివర చేర్చాం.
