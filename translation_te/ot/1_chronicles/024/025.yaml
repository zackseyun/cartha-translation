lexical_decisions:
- source_word: אֲחִי
  choice: సోదరుడు
  rationale: אָח పదపు నిర్మిత రూపం; ఇక్కడ వంశావళి సంబంధాన్ని ‘మీకా సోదరుడు’ అని సహజంగా తెలియజేస్తుంది.
- source_word: מִיכָה
