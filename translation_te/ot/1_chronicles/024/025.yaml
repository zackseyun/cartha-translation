- source_word: לִבְנֵי
  choice: కుమారుల్లో
  rationale: ఈ వంశావళి సందర్భంలో לִבְנֵי అనేది దిశ లేదా ప్రయోజనం కంటే వంశసమూహానికి చెందిన వ్యక్తిని సూచిస్తుంది; తెలుగులో ‘కుమారుల్లో’ సహజంగా ఉంది.
- source_word: זְכַרְיָהוּ
  choice: జెకర్యా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో విస్తృతంగా పరిచితమైన బైబిలు రూపాన్ని ఉపయోగించాం.
