  text: the third to Harim[a], the fourth to Seorim.
translation:
  language: te
  text: హారీముకు మూడవది[a], సెయోరీముకు నాలుగవది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “హారీము కోసం ... సెయోరీము కోసం”; హీబ్రూ ఉపసర్గ కేటాయింపును సూచించగలదు. ఈ చీట్ల జాబితాలో దాన్ని “-కు” అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְחָרִם
  choice: హారీముకు
  rationale: లామెద్ ఉపసర్గ చీట్ల ద్వారా జరిగిన కేటాయింపును సూచిస్తుంది; తెలుగులో దత్తివిభక్తి ‘-కు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది. హారీము వ్యక్తినామంగా లిప్యంతరీకరించబడింది.
- source_word: הַשְּׁלִישִׁי
  choice: మూడవది
  rationale: నిర్దిష్ట సరణిలోని మూడవ చీటు లేదా వంతును సూచించే క్రమసంఖ్య. హీబ్రూ జాబితాలోని సంక్షిప్త, అధ్యాహార శైలిని నిలిపింది.
- source_word: לִשְׂעֹרִים
  choice: సెయోరీముకు
  rationale: ఇక్కడ కూడా లామెద్ ఉపసర్గ కేటాయింపును సూచిస్తుంది; ‘-కు’తో సహజంగా వ్యక్తమైంది. సెయోరీము అనే పేరును హీబ్రూ రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הָרְבִעִי
  choice: నాలుగవది
  rationale: మూడవదికి సమాంతరంగా, నాలుగవ చీటు లేదా వంతును సూచించే క్రమసంఖ్య; మూలంలోని సంక్షిప్త జాబితా రూపం నిలుపబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త జాబితా శైలిని నిలిపాం. పేర్లను హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం; ‘మూడవది/నాలుగవది’ అనే నపుంసక రూపాలు అధ్యాహారంగా ఉన్న ‘చీటు’ లేదా ‘వంతు’ను సహజంగా సూచిస్తాయి.
