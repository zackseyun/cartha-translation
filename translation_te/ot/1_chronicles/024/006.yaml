source:
  edition: WLC
  text: וַֽ/יִּכְתְּבֵ֡/ם שְֽׁמַֽעְיָה֩ בֶן נְתַנְאֵ֨ל הַ/סּוֹפֵ֜ר מִן הַ/לֵּוִ֗י לִ/פְנֵ֨י הַ/מֶּ֤לֶךְ וְ/הַ/שָּׂרִים֙ וְ/צָד֣וֹק הַ/כֹּהֵ֗ן וַ/אֲחִימֶ֨לֶךְ֙ בֶּן אֶבְיָתָ֔ר וְ/רָאשֵׁי֙ הָֽ/אָב֔וֹת לַ/כֹּהֲנִ֖ים וְ/לַ/לְוִיִּ֑ם בֵּֽית אָ֣ב אֶחָ֗ד אָחֻז֙ לְ/אֶלְעָזָ֔ר וְ/אָחֻ֥ז אָחֻ֖ז לְ/אִיתָמָֽר־־־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/006.yaml
  text: Shemaiah son of Nethanel[a], the scribe from among the Levites, recorded them in the presence of the king, the officials, Zadok the priest, Ahimelech son of Abiathar, and the heads of the fathers’ houses of the priests and of the Levites—one father’s house being taken for Eleazar, and one being taken for Ithamar.
translation:
  language: te
  text: లేవీయులలో ఒకడైన లేఖకుడు నెతనేలు కుమారుడు షెమయా, రాజు, అధికారులు, యాజకుడైన సాదోకు, అబ్యాతారు కుమారుడు అహీమెలెకు, యాజకుల, లేవీయుల పితృగృహాల పెద్దల సమక్షంలో వారిని నమోదు చేశాడు. ఎలియాజరు కొరకు ఒక పితృగృహం తీసుకోబడగా, ఈతామారు కొరకు ఒకటి తీసుకోబడింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీ వాక్యం చాలా సంక్షిప్తంగా ఉంది: “ఎలియాజరుకు ఒక పితృగృహం తీసుకోబడింది; ఈతామారుకు తీసుకోబడింది, తీసుకోబడింది.” సందర్భం ప్రకారం ఎలియాజరు, ఈతామారు వంశాల పితృగృహాలను వరుసగా ఎంపిక చేసినట్లు అర్థమవుతుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתְּבֵם
  choice: వారి పేర్లు నమోదు చేశాడు
  rationale: כתב అనే క్రియకు ఉన్న బహువచన కర్మప్రత్యయం మునుపటి సందర్భంలోని విభాగాల వారిని సూచిస్తుంది. తెలుగులో కేవలం ‘వారిని రాశాడు’ అనడం అసహజం కాబట్టి, లిఖిత నమోదు భావాన్ని సహజంగా వ్యక్తం చేయడానికి ‘వారి పేర్లు నమోదు చేశాడు’ అని అనువదించాం.
- source_word: הַסֹּפֵר
  choice: లేఖకుడు
  rationale: ఇది రాతపని లేదా అధికారిక నమోదు చేసే వ్యక్తిని సూచిస్తుంది. చారిత్రక పాత్రను నిలుపుతూ ఆధునిక తెలుగులో అర్థమయ్యే పదం ‘లేఖకుడు’.
- source_word: מִן הַלֵּוִי
  choice: లేవీయులలో ఒకడైన
  rationale: מן లోని సమూహంలోనివాడు అనే భావాన్ని సహజ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי
  choice: సమక్షంలో
  rationale: ఈ నమోదు రాజు మరియు ఇతర సాక్షుల ఎదుట జరిగిందనే అధికారిక, బహిరంగ సందర్భాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: הַשָּׂרִים
  choice: అధికారులు
  rationale: రాజసభ లేదా పరిపాలనా సందర్భంలో שרים పాలనా హోదాలో ఉన్నవారిని సూచిస్తుంది; ‘రాజకుమారులు’ అనే అనవసర అర్థాన్ని నివారిస్తుంది.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: పితృగృహాల పెద్దలు
  rationale: వంశాధారిత పరిపాలనా కుటుంబ విభాగాల నాయకులను సూచించే దినవృత్తాంతాల సాంకేతిక భావాన్ని నిలుపుతుంది.
- source_word: בֵּית אָב אֶחָד
  choice: ఒక పితృగృహం
  rationale: వంశంలోని కుటుంబ లేదా కుల విభాగాన్ని సూచించే హెబ్రీయ సామాజిక నిర్మాణాన్ని పారదర్శకంగా ఉంచుతుంది.
- source_word: אָחֻז
  choice: తీసుకున్నారు
  rationale: మూలంలో ఇది ‘పట్టుకోబడినది/తీసుకోబడినది’ అనే నిష్క్రియార్థక రూపం. చీట్ల ద్వారా ఎంపిక జరుగుతున్న సందర్భంలో ‘తీసుకున్నారు’ సహజంగా ఉండి, ఎంపిక విధానాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: וְאָחֻז אָחֻז לְאִיתָמָר
  choice: ఈతామారు వంశం నుండి ఒక పితృగృహాన్ని వంతులవారీగా
  rationale: పునరుక్త אָחֻז పంపిణీ లేదా వంతుల భావాన్ని సూచిస్తుంది. మూలంలోని సంక్షిప్తతను పాఠకుడికి అర్థమయ్యేలా చేస్తూ, రెండు వంశాల నుండి మారుమారుగా కుటుంబ విభాగాలు తీసుకున్న సందర్భార్థాన్ని అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన చారిత్రక-పరిపాలనా శైలి వాడబడింది. ‘పితృగృహం’ వంటి సందర్భానుగుణ సాంకేతిక పదాన్ని నిలిపి, ‘సమక్షంలో’, ‘నమోదు చేశాడు’ వంటి సాధారణంగా అర్థమయ్యే రూపాలతో వాక్యాన్ని సహజంగా తీర్చిదిద్దాం.
