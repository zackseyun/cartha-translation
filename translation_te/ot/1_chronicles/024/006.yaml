revisions:
- from: లేవీయులలో ఒకడైన లేఖకుడు నెతనేలు కుమారుడు షెమయా, రాజు, అధికారులు, యాజకుడైన సాదోకు, అబ్యాతారు కుమారుడు అహీమెలెకు, యాజకులూ లేవీయులూ అయిన పితృగృహాల పెద్దల సమక్షంలో వారి పేర్లు నమోదు చేశాడు. ఎలియాజరు వంశం నుండి ఒక పితృగృహాన్ని, ఈతామారు వంశం నుండి ఒక పితృగృహాన్ని వంతులవారీగా తీసుకున్నారు.[a]
  to: లేవీయులలో ఒకడైన లేఖకుడు నెతనేలు కుమారుడు షెమయా, రాజు, అధికారులు, యాజకుడైన సాదోకు, అబ్యాతారు కుమారుడు అహీమెలెకు, యాజకుల, లేవీయుల పితృగృహాల పెద్దల సమక్షంలో వారిని నమోదు చేశాడు. ఎలియాజరు కొరకు ఒక పితృగృహం తీసుకోబడగా, ఈతామారు కొరకు ఒకటి తీసుకోబడింది.[a]
  rationale: మూలంలోని కర్మానికి అనవసరంగా ‘పేర్లు’ను జోడించకుండా సవరించాము; యాజకులు, లేవీయులకు చెందిన పితృగృహాల పెద్దలు అనే సంబంధాన్ని స్పష్టపరిచాము; చివరి కష్టమైన హెబ్రీ నిర్మాణంలోని సందర్భానుసార వివరణను పాదటిప్పణికి పరిమితం చేసి, ప్రధాన పాఠంలో నిష్క్రియార్థకమైన సంక్షిప్తతను నిలిపాము.
