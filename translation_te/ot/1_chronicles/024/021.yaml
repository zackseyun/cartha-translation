  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళి జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. ‘అధిపతి’ పరిపాలనా నాయకత్వాన్ని స్పష్టంగా తెలియజేస్తుంది.
