  text: For Rehabiah[a], from the sons of Rehabiah, the chief was Isshiah.
translation:
  language: te
  text: రెహబ్యా విషయమైతే,[a] రెహబ్యా కుమారులలో యిష్షీయా అధిపతి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘రెహబ్యాకు సంబంధించి, రెహబ్యా కుమారులలో యిష్షీయా అధిపతి.’
    reason: మొదటి לְ ఉపసర్గ జాబితా శీర్షికగా ‘విషయమైతే’ లేదా సంబంధార్థకంగా ‘సంబంధించి’ అనే రెండూ భావాలను అనుమతిస్తుంది.
lexical_decisions:
- source_word: לִ/רְחַבְיָהוּ
  choice: రెహబ్యా విషయమైతే
  rationale: జాబితాలో తదుపరి వంశశాఖను పరిచయం చేసే לְ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לִ/בְנֵי רְחַבְיָהוּ
  choice: రెహబ్యా కుమారులలో
  rationale: בני అనే వంశావళి పదంలోని ‘కుమారులు/వారసులు’ భావాన్ని నిలుపుతూ, యిష్షీయా ఆ శాఖకు చెందినవాడని సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: הָ/רֹאשׁ
  choice: అధిపతి
  rationale: అక్షరార్థమైన ‘తల’కు బదులుగా, కుటుంబశాఖకు నాయకుడైన వ్యక్తిని సూచించే పరిపాలనా భావాన్ని గౌరవప్రదంగా అందిస్తుంది.
- source_word: יִשִּׁיָּה
  choice: యిష్షీయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని ధ్వనిరూపానికి సమీపంగా తెలుగులో లిప్యంతరీకరించింది.
