  text: The first lot came out for Jehoiarib[a], the second for Jedaiah.
translation:
  language: te
  text: మొదటి చీటి యెహోయారీబుకు వచ్చింది; రెండవది యెదయాకు వచ్చింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: వచ్చింది
  rationale: יצא అనే క్రియకు ప్రాథమికంగా ‘బయటికి వెళ్లడం/రావడం’ అనే భావం ఉంది. చీట్లు వేసే సందర్భంలో ‘వచ్చింది’ అనేది మూలానికి దగ్గరగా ఉండి సహజమైన తెలుగును ఇస్తుంది.
- source_word: הַגּוֹרָל
  choice: చీటి
  rationale: גּוֹרָל ఇక్కడ యాజక విభాగాల క్రమాన్ని నిర్ణయించడానికి వేసిన చీటిని సూచిస్తుంది; ‘చీటి’ ఆధునిక తెలుగులో స్పష్టమైన, సంక్షిప్తమైన పదం.
- source_word: הָרִאשׁוֹן
  choice: మొదటి
  rationale: ఈ క్రమసంఖ్య చీట్ల వరుసను సూచిస్తుంది; తెలుగులో ‘మొదటి చీటి’ సహజంగా ఉంది.
- source_word: לִיהוֹיָרִיב
  choice: యెహోయారీబుకు
  rationale: ל ఉపసర్గ చీటి ద్వారా కేటాయింపు పొందిన వ్యక్తిని సూచిస్తుంది; తెలుగులో ‘-కు’ విభక్తి ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לִידַעְיָה
  choice: యెదయాకు
  rationale: ל ఉపసర్గ రెండవ చీటి ద్వారా కేటాయింపు పొందిన వ్యక్తిని సూచిస్తుంది; ‘-కు’ విభక్తి కేటాయింపు భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: הַשֵּׁנִי
  choice: రెండవది
  rationale: హీబ్రూ వాక్యంలో ‘చీటి’ రెండవ భాగంలో అధ్యాహారంగా ఉంది. తెలుగులో ‘రెండవది’ అని చెప్పడం సంక్షిప్తంగా, సహజంగా ఉండి అదే అర్థాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; పరిపాలనా జాబితా శైలికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. వ్యక్తిపేర్లు హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి.
