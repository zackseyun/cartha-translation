  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త జాబితా శైలిని నిలిపాం. మూలంలోని క్రియలేని నిర్మాణాన్ని అలాగే ఉంచి, క్రమసంఖ్యలను సహజంగా ‘ఏడవది’, ‘ఎనిమిదవది’ అని అనువదించాం.
