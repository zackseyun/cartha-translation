  text: ఏడవది హక్కోజుకు[a], ఎనిమిదవది అబీయాకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హక్కోజు కోసం … అబీయా కోసం.’ ఈ నియామకాల జాబితాలో హీబ్రూ ఉపసర్గ לను ‘కు’ అని గానీ ‘కోసం’ అని గానీ అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַקּוֹץ
  choice: హక్కోజుకు
  rationale: లָమెד్ ఉపసర్గ ఈ చీట్ల క్రమంలో నియామకం లేదా కేటాయింపును సూచిస్తుంది. హక్కోజు వ్యక్తి పేరు; దానిని తెలుగు ధ్వన్యంతరీకరణతో ఇచ్చాం.
- source_word: הַשְּׁבִעִי
  choice: ఏడవది
  rationale: నిర్దిష్ట ఆర్టికల్‌తో ఉన్న క్రమసంఖ్య; సందర్భంలో ఏడవ వంతు లేదా క్రమాన్ని సూచిస్తుంది. సహజమైన తెలుగు జాబితా శైలిలో ‘ఏడవది’ అని ఇచ్చాం.
- source_word: לַאֲבִיָּה
  choice: అబీయాకు
  rationale: ఇక్కడ కూడా ל ఉపసర్గ యాజక విభాగాల వరుసలో కేటాయింపును సూచిస్తుంది. אֲבִיָּה పేరును మూల హీబ్రూ ఉచ్చారణకు సమీపంగా ‘అబీయా’గా ధ్వన్యంతరీకరించాం.
- source_word: הַשְּׁמִינִי
  choice: ఎనిమిదవది
  rationale: ‘ఏడవది’కి సమాంతరంగా, నిర్దిష్టమైన ఎనిమిదవ వంతు లేదా క్రమాన్ని సూచించే క్రమసంఖ్య.
