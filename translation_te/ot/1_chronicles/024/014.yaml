lexical_decisions:
- source_word: לְ/בִלְגָּה
  choice: బిల్గాకు
  rationale: ఉపసర్గ לְ ఈ యాజక వర్గాల చీట్ల జాబితాలో కేటాయింపును సూచిస్తుంది; తెలుగులో ‘బిల్గాకు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: חֲמִשָּׁה עָשָׂר
  choice: పదిహేనవది
  rationale: మూలంలో సంఖ్యావాచకంగా ‘పదిహేను’ ఉన్నా, వరుసగా చీట్లు కేటాయిస్తున్న సందర్భంలో అది క్రమసంఖ్యార్థంలో పనిచేస్తుంది.
- source_word: לְ/אִמֵּר
  choice: ఇమ్మేరుకు
  rationale: ఉపసర్గ לְ కేటాయింపును సూచిస్తుంది; పేరును మూల ఉచ్చారణకు దగ్గరగా ‘ఇమ్మేరు’గా లిప్యంతరీకరించి, దత్తి విభక్తిని చేర్చాం.
- source_word: שִׁשָּׁה עָשָׂר
  choice: పదహారవది
  rationale: మూలంలోని ‘పదహారు’ ఈ సంఖ్యాబద్ధమైన చీట్ల సందర్భంలో క్రమసంఖ్యను సూచిస్తుంది.
