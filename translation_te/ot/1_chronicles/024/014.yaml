translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త జాబితా శైలిని నిలిపి, మూలంలోని సమాంతర నిర్మాణాన్ని కాపాడాం. ‘వంతు’ లేదా ‘చీటి’ని ప్రధాన పాఠంలో స్పష్టంగా చేర్చకుండా, సందర్భం సూచించే అస్పష్టతను నిలిపాం.
