  yaml_path: translation/ot/1_chronicles/024/030.yaml
  text: 'And the sons of Mushi: Mahli[a], Eder, and Jeremoth. These were the sons of the Levites according to their fathers'' houses.'
translation:
  language: te
  text: 'మరియు మూషి కుమారులు: మహలి, ఏదెరు, యెరీమోతు[a]. వీరు తమ పితృకుటుంబాల ప్రకారం లేవీయుల కుమారులు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యెరీమోతు పేరును “యెరిమోతు” అని కూడా రాయవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי מוּשִׁי
  choice: మూషి కుమారులు
  rationale: వంశావళి జాబితాను కొనసాగించే సంధి-నిర్మాణం. తెలుగులో ముందున్న వాక్యంతో అనుసంధానం సందర్భం ద్వారానే స్పష్టమవుతుంది కాబట్టి అసహజమైన ‘మరియు’ను చేర్చకుండా సహజమైన జాబితా రూపాన్ని వాడాం.
- source_word: מַחְלִי
  choice: మహలి
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: וְעֵדֶר
  choice: ఏదెరు
  rationale: ఉపసర్గ సంధిని జాబితా విరామచిహ్నంతో సూచిస్తూ వ్యక్తి పేరును లిప్యంతరీకరించాం.
- source_word: וִירִימוֹת
  choice: యెరీమోతు
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగులో సహజంగా పలికే రూపంలో లిప్యంతరీకరించాం; సాధ్యమైన మరో వర్ణక్రమాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: אֵלֶּה בְּנֵי הַלְוִיִּם
  choice: వీరు … లేవీయుల కుమారులు
  rationale: ముందు పేర్కొన్న వారిని సమీక్షించే బహువచన సూచకాన్ని ‘వీరు’గా, వంశసంబంధమైన ‘కుమారులు’ అనే మూలభాషా నుడికారాన్ని యథాతథంగా నిలిపాం.
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: తమ పితృ కుటుంబాల ప్రకారం
  rationale: పితృవంశ ఆధారిత గృహాలు లేదా వంశ కుటుంబాల ప్రకారం చేసిన విభజనను సూచిస్తుంది. ‘పితృ కుటుంబాలు’ మూల నుడికారాన్ని కాపాడుతూ ఆధునిక పాఠకులకు అర్థమయ్యేలా ఉంది.
