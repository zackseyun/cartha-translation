translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన వంశావళి శైలిని వాడాం. వ్యక్తి పేర్లను మూల హీబ్రూకు సమీపంగా లిప్యంతరీకరించాం; ‘లేవీయుల కుమారులు’, ‘పితృ కుటుంబాలు’ అనే వంశపరమైన భావాలను నిలిపాం.
