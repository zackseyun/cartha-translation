- from: 'మూషి కుమారులు: మహలి, ఏదెరు, యెరీమోతు[a]. వీరు తమ పితృ కుటుంబాల ప్రకారం లేవీయుల కుమారులు.'
  to: 'మరియు మూషి కుమారులు: మహలి, ఏదెరు, యెరీమోతు[a]. వీరు తమ పితృకుటుంబాల ప్రకారం లేవీయుల కుమారులు.'
  rationale: The revision retains every listed name and the genealogical designation, restores the source’s connective, and uses the compound “పితృకుటుంబాలు” for a smoother modern Telugu rendering of “fathers’ houses.” No doctrinal or interpretive expansion has been introduced.
