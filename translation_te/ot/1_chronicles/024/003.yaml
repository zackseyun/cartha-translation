  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. వంశసూచక ‘కుమారులు’ ప్రయోగాన్ని నిలిపి, פקדה పదంలోని ఉద్దేశపూర్వక అస్పష్టతను ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా సంరక్షించాం.
