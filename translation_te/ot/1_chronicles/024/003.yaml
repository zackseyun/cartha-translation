  text: David[a], with Zadok from the sons of Eleazar and Ahimelech from the sons of Ithamar, divided them according to their appointment in their service.
translation:
  language: te
  text: దావీదు, ఎలియాజరు కుమారుల వంశానికి చెందిన సాదోకుతో, ఈతామారు కుమారుల వంశానికి చెందిన అహీమెలెకుతో కలిసి, వారి సేవలోని వారి నియమిత బాధ్యతల ప్రకారం వారిని విభజించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి సేవకు నియమించిన క్రమం ప్రకారం వారిని విభజించాడు.” హీబ్రూ పదబంధంలో నియామకం, పర్యవేక్షణ, లేదా క్రమబద్ధమైన ఏర్పాటు అనే భావాలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחָלְקֵם
  choice: వారిని విభజించాడు
  rationale: חלק క్రియకు నేరుగా ‘విభజించాడు’ అనే అర్థం వస్తుంది; యాజక సేవా విభాగాల సందర్భాన్నీ ఇది సహజంగా తెలియజేస్తుంది.
- source_word: וְצָדוֹק
  choice: సాదోకుతోను
  rationale: సాదోకు దావీదుతో కలిసి ఈ విభజనలో పాల్గొన్నాడని సంధర్భానికి అనుగుణంగా తెలుపుతుంది.
- source_word: מִן בְּנֵי אֶלְעָזָר
  choice: ఎలియాజరు కుమారులలోని
  rationale: సాదోకు ఎలియాజరు వంశానికి చెందినవాడని מן మరియు ‘కుమారులు’ అనే వంశసూచక ప్రయోగాన్ని ప్రతిబింబిస్తుంది.
- source_word: וַאֲחִימֶלֶךְ
  choice: అహీమెలెకు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: מִן בְּנֵי אִיתָמָר
  choice: ఈతామారు కుమారులలోని
  rationale: అహీమెలెకు ఈతామారు వంశానికి చెందినవాడని సమాంతర నిర్మాణంతో తెలియజేస్తుంది.
- source_word: לִפְקֻדָּתָם
  choice: వారికి నియమించబడిన బాధ్యతల ప్రకారం
  rationale: פְּקֻדָּה పదంలోని నియామకం, పర్యవేక్షణ, క్రమబద్ధమైన బాధ్యత అనే పరిపాలనా భావాలను సహజమైన తెలుగులో కలిపి తెలియజేస్తుంది; ఖచ్చితమైన సంస్థాగత భావాన్ని అతిగా నిర్ధారించదు.
- source_word: בַּעֲבֹדָתָם
  choice: వారి సేవలో
  rationale: עֲבֹדָה యొక్క ‘పని/సేవ’ భావాన్ని ఉంచుతూ, ఇక్కడి యాజక సేవా సందర్భానికి సరిపోతుంది.
