  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְתַחְיָה
  choice: పెతహ్యాకు
  rationale: ఈ యాజక విభాగాల జాబితాలో ל ఉపసర్గ కేటాయింపును సూచిస్తుంది. వ్యక్తి పేరును హెబ్రీ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: תִּשְׁעָה עָשָׂר
  choice: పంతొమ్మిదవది
  rationale: మూలంలోని సంఖ్యాపదం ఈ వరుసలో క్రమసంఖ్య అర్థంలో ఉంది; సందర్భం ద్వారా ‘వంతు/చీటి’ అనే భావం గ్రహించబడుతుంది.
- source_word: לִיחֶזְקֵאל
  choice: యెహెజ్కేలుకు[a]
  rationale: ל ఉపసర్గ కేటాయింపును సూచిస్తుంది. ఇక్కడి హెబ్రీ నామరూపాన్ని సాధారణంగా పరిచితమైన ‘యెహెజ్కేలు’ రూపంలోకి పూర్తిగా సమానీకరించకుండా, ‘యెహెజ్కేలు’కు సమీపంగా లిప్యంతరీకరించాం; పాఠకులకు పరిచితమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: הָעֶשְׂרִים
  choice: ఇరవయ్యవది
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న సంఖ్య ఈ జాబితాలో క్రమసంఖ్యగా పనిచేస్తుంది; తెలుగులో సహజమైన క్రమసంఖ్య రూపాన్ని వాడాం.
