translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త జాబితా శైలిని నిలిపాం. మూలంలో సందర్భం ద్వారా గ్రహించబడే ‘వంతు/చీటి’ అనే నామవాచకాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా, స్త్రీలింగ క్రమసంఖ్య రూపాలతో సూచించాం.
