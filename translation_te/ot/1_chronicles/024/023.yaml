base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/023.yaml
  text: 'And the sons of Jeriah: Amariah the second[a], Jahaziel the third, Jekameam the fourth.'
translation:
  language: te
  text: 'మరియు యెరీయా కుమారులు: అమర్యా రెండవవాడు[a], యహజీయేలు మూడవవాడు, యెకమాము నాలుగవవాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ జాబితా వాక్యనిర్మాణం సంక్షిప్తంగా ఉంది; అక్షరార్థంగా, “మరియు యెరీయా కుమారులు: అమర్యా రెండవవాడు, యహజీయేలు మూడవవాడు, యెకమాము నాలుగవవాడు.” భావాన్ని విప్పి, “అమర్యా రెండవవాడు అయ్యాడు” మొదలైన విధంగానూ అనువదించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנָי
  choice: కుమారులు
  rationale: ఇది నిర్మాణ బహువచన రూపంలో ‘కుమారులు’ అని అర్థం. హీబ్రూ వావ్ జాబితాను ముందటి వాక్యంతో కలిపినా, సహజమైన తెలుగు జాబితా శైలిలో ప్రత్యేకంగా ‘మరియు’ చేర్చనవసరం లేదు.
- source_word: יְרִיָּהוּ
  choice: యెరీయా
  rationale: మసొరేటిక్ ఉచ్చారణను అనుసరించి వ్యక్తి పేరును తెలుగు లిపిలో ధ్వన్యంతరీకరించాం.
- source_word: אֲמַרְיָהוּ
  choice: అమర్యా
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా, తెలుగులో సహజంగా ధ్వన్యంతరీకరించాం.
- source_word: הַשֵּׁנִי
  choice: రెండవవాడు
  rationale: జాబితాలోని క్రమాన్ని తెలిపే పుంలింగ క్రమసంఖ్యను నిలిపి, హీబ్రూలో అంతర్లీనంగా ఉన్న ‘వాడు’ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేశాం.
- source_word: יַחֲזִיאֵל
  choice: యహజీయేలు
  rationale: వ్యక్తి పేరును మసొరేటిక్ స్వరరూపానికి అనుగుణంగా తెలుగు లిపిలో ధ్వన్యంతరీకరించాం.
- source_word: הַשְּׁלִישִׁי
  choice: మూడవవాడు
  rationale: హీబ్రూ జాబితాలోని క్రమసంఖ్యను నేరుగా, సహజమైన తెలుగు రూపంలో నిలిపాం.
- source_word: יְקַמְעָם
  choice: యెకమాము
  rationale: వ్యక్తి పేరును మసొరేటిక్ పాఠంలోని ధ్వనులకు దగ్గరగా తెలుగు లిపిలో ధ్వన్యంతరీకరించాం.
- source_word: הָרְבִיעִי
  choice: నాలుగవవాడు
  rationale: హీబ్రూ జాబితాలోని క్రమసంఖ్యను నేరుగా, సహజమైన తెలుగు రూపంలో నిలిపాం.
