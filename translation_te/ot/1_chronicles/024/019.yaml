source:
  edition: WLC
  text: אֵ֣לֶּה פְקֻדָּתָ֞/ם לַ/עֲבֹדָתָ֗/ם לָ/ב֤וֹא לְ/בֵית יְהוָה֙ כְּ/מִשְׁפָּטָ֔/ם בְּ/יַ֖ד אַהֲרֹ֣ן אֲבִי/הֶ֑ם כַּ/אֲשֶׁ֣ר צִוָּ֔/הוּ יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/019.yaml
  text: These were their appointed duties for their service[a], to enter the house of Yahweh according to their ordinance, under the hand of Aaron their father, as Yahweh, the God of Israel[b], had commanded him.
translation:
  language: te
  text: ఇశ్రాయేలు దేవుడైన యెహోవా తమ పితరుడైన అహరోనుకు ఆజ్ఞాపించినట్లుగా, యెహోవా మందిరంలో ప్రవేశించి తమ సేవను చేయడానికి, అహరోను ఆధ్వర్యంలో[a] వారి నియమిత క్రమం ప్రకారం వారికి నియమించబడిన విధులు ఇవే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తమ పితరుడైన అహరోను చేతిలో.” హీబ్రూ నుడికారం అహరోను నిర్వహణ, అధికారం లేదా మధ్యవర్తిత్వాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדָּתָם
  choice: వారికి నియమించబడిన విధులు
  rationale: ఈ యాజక సందర్భంలో ఈ పదం నియమిత బాధ్యతలు లేదా క్రమబద్ధమైన సేవా నియామకాలను సూచిస్తుంది.
- source_word: לַעֲבֹדָתָם
  choice: సేవ చేయడానికి
  rationale: ఆలయ సంబంధ సందర్భంలో עֲבֹדָה ఆరాధనా సేవను సూచిస్తుంది; ‘సేవ’ సహజమైనదిగా ఉండి మతశాఖాపరమైన అదనపు భావాన్ని చేర్చదు.
- source_word: לָבוֹא לְבֵית יְהוָה
  choice: యెహోవా మందిరంలో ప్రవేశించి
  rationale: בוא ఇక్కడ సేవకోసం లోపలికి రావడం లేదా ప్రవేశించడాన్ని సూచిస్తుంది. בית יהוה అనే హీబ్రూ నుడికారం తెలుగులో సహజంగా ‘యెహోవా మందిరం’గా ఇవ్వబడింది.
- source_word: כְּמִשְׁפָּטָם
  choice: వారికి నిర్దేశించబడిన క్రమం ప్రకారం
  rationale: ఈ సందర్భంలో מִשְׁפָּט తీర్పు అనే అర్థంలో కాక, సేవను నియంత్రించే నిర్దిష్ట నియమం లేదా క్రమం అనే అర్థంలో ఉంది.
- source_word: בְּיַד אַהֲרֹן אֲבִיהֶם
  choice: తమ పితరుడైన అహరోను ద్వారా
  rationale: בְּיַד అనే నుడికారం మధ్యవర్తిత్వం, నిర్వహణ లేదా అధికారాన్ని సూచించగలదు. ‘ద్వారా’ మూలంలోని అస్పష్టతను కొంతవరకు నిలుపుతూ సహజమైన తెలుగును ఇస్తుంది; ‘పితరుడు’ అహరోను వంశపిత అనే భావాన్ని తెలియజేస్తుంది.
- source_word: כַּאֲשֶׁר צִוָּהוּ
  choice: అతనికి ఆజ్ఞాపించినట్లే
  rationale: క్రియలోని ఏకవచన ప్రత్యయం సహజంగా అహరోనును సూచిస్తుంది.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన యెహోవా
  rationale: దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించి, ‘ఇశ్రాయేలు దేవుడు’ అనే అన్వయ విశేషణాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో నిలుపుతుంది.
- issue: בְּיַד אַהֲרֹן లోని యాజక పరిపాలనా భావం
  choice: అహరోను ద్వారా
  alternative: అహరోను అధికారం కింద; అహరోను చేతిలో
  rationale: ఈ నుడికారం సాధనత్వం లేదా అధికారాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో సహజమైన ‘ద్వారా’ను ఉపయోగించి, ప్రత్యామ్నాయ పరిపాలనా భావాన్ని పాదటిప్పణిలో చూపించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. పొడవైన హీబ్రూ వాక్యాన్ని స్పష్టత కోసం మూడు వాక్యాలుగా విభజించాం; భావ సంబంధం నిలుపబడింది. ‘మందిరం’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది; ‘పితరుడు’ అహరోను జీవశాస్త్రీయ తండ్రి మాత్రమే కాక వంశపిత అని సూచిస్తుంది.
