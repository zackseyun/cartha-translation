  source_fidelity: మూల హీబ్రూ పాఠంలోని בְּנֵי מְרָרִי, לְיַעֲזִיָּהוּ, బְּנוֹ మరియు తరువాతి మూడు పేర్లు అన్నీ ముసాయిదాలో ఉన్నాయి. అయితే ‘యాజీయాకు’ దత్తివిభక్తి రూపం ఇక్కడ వంశశాఖ/జాబితా సంబంధాన్ని అస్పష్టంగా, యాజీయాకు ఏదో ఇచ్చినట్టు వినిపించేలా చేస్తుంది. ‘యాజీయా వంశస్థులు’ ద్వారా לְ యొక్క జాబితా-సంబంధ భావం తెలుగులో స్పష్టంగా వ్యక్తమవుతుంది. బְּנוֹ యొక్క కఠినమైన ఏకవచన పాఠాన్ని ప్రధాన పాఠంలోనే నిలిపి, ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచడం సముచితం.
  naturalness: '‘మెరారి కుమారులు: యాజీయాకు, అతని కుమారుడు షోహాము…’ అనే వరుస ఆధునిక తెలుగులో వ్యాకరణపరంగా అసంపూర్ణంగా, సంబంధాలు గందరగోళంగా ఉంటుంది. ‘మెరారి కుమారులు: యాజీయా వంశస్థులు—అతని కుమారుడు షోహాము, జక్కూరు, ఇబ్రీ’ అనేది వంశావళి జాబితా శైలికి సహజంగా ఉంటుంది; అయినా మూలంలోని క్లిష్టతను పూర్తిగా పరిష్కరించినట్టు కాదు.'
  terminology: ‘మెరారి,’ ‘యాజీయా,’ ‘షోహాము,’ ‘జక్కూరు,’ ‘ఇబ్రీ’ అనే పేర్ల లిప్యంతరీకరణలు ఆమోదయోగ్యమైనవి. ‘కుమారులు’ కూడా בְּנֵיకి సరైన సాధారణ వంశావళి పదం. పాదసూచికలో ‘అతని కుమారులు’ అనే ప్రత్యామ్నాయం, అలాగే ‘బెనో’ అనే నామపఠనం స్పష్టంగా భద్రపరచబడ్డాయి.
