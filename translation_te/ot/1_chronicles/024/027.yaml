  text: 'The sons of Merari: of Jaaziah, his son, Shoham, Zaccur, and Ibri.'
translation:
  language: te
  text: 'మెరారి కుమారులు: యాజీయా వంశస్థులు—అతని కుమారుడు[a] షోహాము, జక్కూరు, ఇబ్రీ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘అతని కుమారుడు.’ ఇక్కడి వాక్యనిర్మాణం క్లిష్టంగా ఉంది; కొందరు దీనిని ‘బెనో’ అనే వ్యక్తి పేరుగా తీసుకుంటారు, మరికొందరు ‘అతని కుమారులు’ అనే బహువచన భావంలో అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  choice: మెరారి కుమారులు
  rationale: వంశావళి జాబితాను పరిచయం చేసే నిర్మాణం; ‘కుమారులు’ మూలంలోని బహువచనాన్ని నేరుగా నిలుపుతుంది.
- source_word: לְיַעֲזִיָּהוּ
  choice: యాజీయాకు
  rationale: ఉపసర్గ לְ ఇక్కడ యాజీయాకు చెందిన వంశశాఖను సూచిస్తుంది; తెలుగు జాబితా శైలిలో చతుర్థీ విభక్తి ఆ సంబంధాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: בְנוֹ
  choice: అతని కుమారుడు
  rationale: మసొరేటిక్ స్వరచిహ్నాల ప్రకారం అక్షరార్థం ‘అతని కుమారుడు’; క్లిష్టమైన వాక్యనిర్మాణాన్ని సరిచేసి అర్థాన్ని నిర్ణయించకుండా ప్రధాన పాఠంలో నిలిపాం.
- source_word: שֹׁהַם
  choice: షోహాము
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: זַכּוּר
  choice: జక్కూరు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: עִבְרִי
  choice: ఇబ్రీ
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
