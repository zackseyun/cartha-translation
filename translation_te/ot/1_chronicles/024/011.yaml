  register: సంక్షిప్తమైన వంశావళి/జాబితా శైలిని కాపాడుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా చదవబడే రూపం. ‘వంతు’ అనేది సమీప సందర్భంలోని చీట్ల ద్వారా నిర్ణయించిన యాజక సేవా క్రమాన్ని తెలియజేస్తుంది.
