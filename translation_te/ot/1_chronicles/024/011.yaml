  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְיֵשׁוּעַ
  choice: యేషూవకు
  rationale: לְ ఇక్కడ చీట్ల ద్వారా యాజక వర్గానికి వచ్చిన క్రమస్థానాన్ని సూచిస్తుంది. తెలుగులో దత్తివిభక్తి ‘-కు’ సహజంగా ఆ కేటాయింపును తెలియజేస్తుంది; వ్యక్తిపేరు మూల హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: הַתְּשִׁעִי
  choice: తొమ్మిదవ వంతు
  rationale: నిర్దేశక ఉపపదంతో ఉన్న క్రమసంఖ్య ఈ జాబితాలో తొమ్మిదవ చీటి లేదా కేటాయింపును నామవాచకంగా సూచిస్తుంది. సందర్భాన్ని సహజ తెలుగులో స్పష్టం చేయడానికి ‘వంతు’ చేర్చబడింది.
- source_word: לִשְׁכַנְיָהוּ
  choice: షెకన్యాకు
  rationale: లְ ఇక్కడ కేటాయింపును సూచిస్తుంది; తెలుగులో ‘-కు’ దానిని సహజంగా వ్యక్తం చేస్తుంది. שְׁכַנְיָהוּ అనే వ్యక్తిపేరు మూలరూపానికి సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: הָעֲשִׂרִי
  choice: పదవ వంతు
  rationale: ఈ క్రమసంఖ్య పదవ చీటి లేదా కేటాయింపును సూచిస్తుంది. సంక్షిప్త జాబితా శైలిని నిలుపుతూ తెలుగులో అర్థం స్పష్టంగా ఉండేందుకు ‘వంతు’ వాడబడింది.
