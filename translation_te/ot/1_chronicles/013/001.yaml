revisions:
- from: దావీదు వెయ్యిమందికి, వందమందికి అధిపతులైన వారితో[a]—ప్రతి నాయకునితో—సంప్రదించాడు.
  to: దావీదు వెయ్యిమంది, వందమంది గల దళాల అధిపతులతోను, ప్రతి నాయకునితోను సంప్రదించాడు.
  rationale: The revision retains all source elements—David, consultation, commanders of thousand- and hundred-units, and every leader—while making the unit-command sense explicit and using natural Telugu coordination. The footnote remains anchored to the commanders phrase and offers a legitimate verbal alternative without introducing interpretive claims.
