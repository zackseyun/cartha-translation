id: 1CH.13.1
reference: 1 Chronicles 13:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּוָּעַ֣ץ דָּוִ֗יד עִם שָׂרֵ֧י הָ/אֲלָפִ֛ים וְ/הַ/מֵּא֖וֹת לְ/כָל נָגִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/001.yaml
  text: And David consulted with the commanders of the thousands and the hundreds[a], with every leader.
translation:
  language: te
  text: దావీదు వెయ్యిమంది, వందమంది గల దళాల అధిపతులతోను, ప్రతి నాయకునితోను సంప్రదించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: సంప్రదించాడు
  rationale: నిఫాల్ రూపం పరస్పర చర్చ లేదా సలహా తీసుకోవడాన్ని సూచిస్తుంది. ‘సంప్రదించాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ భావాన్ని కాపాడుతుంది.
- source_word: עִם
  choice: వారితో
  rationale: ఈ విభక్తి దావీదు ఎవరితో సంప్రదించాడో సహవాస సంబంధాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: వెయ్యిమందికి, వందమందికి అధిపతులైన వారు
  rationale: ఈ పదబంధం సైనిక లేదా పరిపాలనా విభాగాలకు నాయకత్వం వహించే అధికారులను సూచిస్తుంది. సంఖ్యా నిర్మాణాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా అనువదించబడింది.
- source_word: לְכָל נָגִיד
  choice: ప్రతి నాయకునితో
  rationale: לְ ఇక్కడ ముందున్న ‘తో’ సంబంధాన్ని కొనసాగిస్తూ సంప్రదింపులో పాల్గొన్నవారి పరిధిని విస్తరిస్తుంది. נָגִידకు అతిశయమైన రాజపదవిని ఆపాదించకుండా ‘నాయకుడు’ అని అనువదించబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘సహస్రాధిపతులు, శతాధిపతులు’ వంటి భారమైన పారిభాషిక రూపాలకు బదులు సాధారణ పాఠకులకు స్పష్టమైన ‘వెయ్యిమందికి, వందమందికి అధిపతులు’ అనే రూపం ఎంచుకోబడింది. చివరి పదబంధం ముందున్న అధికారులను వివరిస్తుందా లేక మరింత విస్తృత వర్గాన్ని చేర్చుతుందా అనే స్వల్ప అస్పష్టతను డాష్‌లతో నిలిపి ఉంచబడింది.
