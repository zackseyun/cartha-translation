source:
  edition: WLC
  text: וַ/יִּ֣חַר לְ/דָוִ֔יד כִּֽי פָרַ֧ץ יְהוָ֛ה פֶּ֖רֶץ בְּ/עֻזָּ֑א וַ/יִּקְרָ֞א לַ/מָּק֤וֹם הַ/הוּא֙ פֶּ֣רֶץ עֻזָּ֔א עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/011.yaml
  text: And David was angry because Yahweh had broken out against Uzza[a]; so he called that place Perez-uzza to this day.
translation:
  language: te
  text: యెహోవా ఉజ్జా మీద విరుచుకుపడినందుకు దావీదుకు కోపం వచ్చింది. అందుచేత అతడు ఆ ప్రదేశానికి పెరెజ్-ఉజ్జా[a] అని పేరు పెట్టాడు; అది ఈనాటివరకూ ఆ పేరుతోనే ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పెరెజ్-ఉజ్జా” అనే పేరుకు “ఉజ్జా మీద విరుచుకుపడటం” లేదా “ఉజ్జా విషయంలో జరిగిన విరుపు” అనే భావం ఉంది. “యెహోవా ఉజ్జా మీద విరుచుకుపడ్డాడు” అనే వాక్యంలోని హీబ్రూ పదప్రయోగాన్ని ఈ పేరు ప్రతిధ్వనిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְדָוִיד
  choice: దావీదుకు కోపం వచ్చింది
  rationale: חרה ל అనే హీబ్రూ నుడికారం ఒక వ్యక్తిలో కోపం రగలడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా భావాన్ని అందిస్తుంది.
- source_word: כִּי
  choice: అందుకు
  rationale: దావీదు కోపానికి కారణమైన ముందున్న కార్యాన్ని కారణార్థకంగా అనుసంధానిస్తుంది.
- source_word: פָרַץ יְהוָה פֶּרֶץ
  choice: యెహోవా ... విరుచుకుపడి ... విఘాతం కలిగించినందుకు
  rationale: פרץ అనే క్రియకూ దానితో ఒకే మూలం గల నామవాచకానికీ మధ్యనున్న పదప్రయోగాన్ని తెలుగులో ‘విరుచుకుపడి—విఘాతం’ అనే సమీప ధ్వని, భావసంబంధంతో సాధ్యమైనంతవరకు నిలుపుతుంది; ఇది ఆకస్మికమైన దైవిక దాడి లేదా చీలిక భావాన్ని వ్యక్తపరుస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని తెలుగు బైబిలు వాడుకలో విస్తృతంగా తెలిసిన ‘యెహోవా’ రూపంలో లిప్యంతరీకరించి, బిరుదుతో భర్తీ చేయకుండా వ్యక్తినామంగా ఉంచుతుంది.
- source_word: בְּעֻזָּא
  choice: ఉజ్జా మీద
  rationale: దైవిక విరుచుకుపడటానికి ఉజ్జా లక్ష్యమని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: అతడు ఆ ప్రదేశానికి ... అని పేరు పెట్టాడు
  rationale: స్థలానికి పేరు పెట్టే హీబ్రూ సూత్రప్రయోగానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: פֶּרֶץ עֻזָּא
  choice: పెరెజ్-ఉజ్జా
  rationale: స్థలనామాన్ని అనువదించకుండా లిప్యంతరీకరిస్తుంది; దాని అర్థాన్నీ ముందున్న పదప్రయోగంతో సంబంధాన్నీ పాదసూచిక వివరిస్తుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటివరకు దానికి అదే పేరు ఉంది
  rationale: రచనా కాలం వరకు ఆ పేరు కొనసాగిందనే భావాన్ని తెలుగులో స్పష్టంగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న చతురక్షర దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో మార్చకుండా వ్యక్తినామంగా ఉంచాం. ‘యాహ్వే’ మూల ఉచ్చారణకు దగ్గరగా ఉండవచ్చుగానీ, ఆధునిక తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన లిప్యంతరీకరణ ‘యెహోవా’ను ఎంచుకున్నాం.
- issue: దైవిక చర్య స్వరూపం
  choice: విరుచుకుపడి అతనికి విఘాతం కలిగించినందుకు
  alternative: ఉజ్జాను హతమార్చినందుకు
  rationale: ఈ వచనం פרץ అనే ‘విరుచుకుపడు/చీలిక కలిగించు’ మూలపదాన్ని రెండుసార్లు ఉపయోగిస్తుంది. ఫలితాన్ని మాత్రమే చెప్పే ‘హతమార్చాడు’ కంటే, మూలంలోని రూపకాన్నీ స్థలనామంతో ఉన్న పదప్రయోగాన్నీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే కథన గాంభీర్యం మరియు మూలంలోని పదప్రయోగం నిలుపబడ్డాయి. ‘విరుచుకుపడి—విఘాతం’ ద్వారా పరץ మూలపద పునరుక్తిని కొంతవరకు ప్రతిబింబించాం.
