revisions:
- from: అప్పుడు యాహ్వే కోపం ఉజ్జాపై రగులుకుంది. అతడు మందసం మీదికి తన చెయ్యి చాపినందుకు[a] యాహ్వే అతణ్ణి కొట్టాడు; అతడు అక్కడ దేవుని ఎదుట చనిపోయాడు.
  to: అప్పుడు యాహ్వే కోపం ఉజ్జాపై రగిలింది. అతడు మందసం మీద తన చెయ్యి చాచినందుకు[a] యాహ్వే అతణ్ణి కొట్టాడు; అతడు అక్కడ దేవుని ఎదుట చనిపోయాడు.
  rationale: A small lexical and idiomatic adjustment replaces the directional ‘మీదికి’ with ‘మీద,’ preserving the Hebrew ambiguity about whether Uzza merely extended his hand toward/over the ark or made contact with it. The translation otherwise remains faithful to the source and the English audit trail.
