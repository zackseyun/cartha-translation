id: 1CH.13.10
reference: 1 Chronicles 13:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/עֻזָּ֔א וַ/יַּכֵּ֕/הוּ עַ֛ל אֲשֶׁר שָׁלַ֥ח יָד֖/וֹ עַל הָ/אָר֑וֹן וַ/יָּ֥מָת שָׁ֖ם לִ/פְנֵ֥י אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/010.yaml
  text: Then Yahweh’s anger burned against Uzza[a], and he struck him down because he had put out his hand to the ark; and he died there before God.
translation:
  language: te
  text: అప్పుడు యాహ్వే కోపం ఉజ్జాపై రగిలింది. అతడు మందసం మీద తన చెయ్యి చాచినందుకు[a] యాహ్వే అతణ్ణి కొట్టాడు; అతడు అక్కడ దేవుని ఎదుట చనిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు మందసం వైపు తన చెయ్యి చాచినందుకు.”
    reason: עַל తో కూడిన שׁלח יד అనే పదబంధం చేతిని మందసం మీదకు/వైపుకు చాచడాన్ని సూచించగలదు; చర్యను మించిన ఉద్దేశాన్ని నిర్ణయించకుండా ప్రత్యామ్నాయాన్ని చూపుతుంది.
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  choice: యాహ్వే కోపం రగులుకుంది
  rationale: హీబ్రూ నుడికారంలోని ‘కోపం మండడం’ అనే బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בְּעֻזָּא
  choice: ఉజ్జాపై
  rationale: בְ అనే విభక్తి ఇక్కడ కోపం ఎవరిమీదికి మళ్లిందో సూచిస్తుంది; తెలుగులో ‘ఉజ్జాపై’ సహజంగా ఉంది.
- source_word: וַיַּכֵּהוּ
  choice: యాహ్వే అతణ్ణి కొట్టాడు
  rationale: נכה అనే క్రియకు ‘కొట్టు/దెబ్బతీయు’ అనే ప్రాథమిక భావం ఉంది. తరువాతి ‘చనిపోయాడు’ అనే వాక్యభాగమే ఫలితాన్ని స్పష్టంగా చెబుతుంది కాబట్టి ‘హతమార్చాడు’ అని ముందుగానే విస్తరించలేదు.
- source_word: עַל אֲשֶׁר
  choice: చాపినందుకు
  rationale: ఈ పదబంధం తీర్పుకు కారణాన్ని తెలియజేస్తుంది; తెలుగు కారణార్థక నిర్మాణం సంక్షిప్తంగా, స్పష్టంగా ఉంటుంది.
- source_word: שָׁלַח יָדוֹ עַל הָאָרוֹן
  choice: మందసం మీదికి తన చెయ్యి చాపినందుకు
  rationale: చేతిని చాపిన భౌతిక చర్యను నిలుపుతూ, అతని ఉద్దేశాన్ని గానీ మందసాన్ని తాకాడని గానీ పాఠ్యంలో లేనంతగా నిర్ధారించదు.
- source_word: הָאָרוֹן
  choice: మందసం
  rationale: పవిత్ర సందర్భంలోని ఆ పెట్టెకు తెలుగులో స్థిరపడిన, గౌరవప్రదమైన పదం. ఈ వచనంలో లేని ‘దేవుని’ లేదా ‘ఒడంబడిక’ అనే విశేషణాలను చేర్చలేదు.
- source_word: וַיָּמָת שָׁם
  choice: అతడు అక్కడ ... చనిపోయాడు
  rationale: కథన క్రమాన్నీ שָׁם అనే స్థలసూచననూ అలంకరణ లేకుండా నిలుపుతుంది.
- source_word: לִפְנֵי אֱלֹהִים
  choice: దేవుని ఎదుట
  rationale: לִפְנֵי యొక్క ‘ఎదుట/సన్నిధిలో’ అనే భావాన్ని సంక్షిప్తమైన, గంభీరమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామమైన יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుగా మార్చకుండా, తెలుగులో దాని ధ్వన్యనుకరణ రూపాన్ని ఉపయోగించింది.
- issue: ఒకే వచనంలో יְהוָה మరియు אֱלֹהִים మధ్య భేదం
  choice: ‘యాహ్వే’ ... ‘దేవుని ఎదుట’ అని రెండింటినీ వేర్వేరుగా నిలుపడం
  alternative: రెండింటినీ ‘యాహ్వే’గా సమన్వయపరచడం
  rationale: హీబ్రూ మూలంలో మొదటి భాగంలో దైవనామం, చివరలో אֱלֹהִים ఉన్నాయి; ఆ పదవైవిధ్యాన్ని సవరించకుండా నిలిపింది.
- issue: దైవిక దెబ్బ మరియు మరణం మధ్య సంబంధం
  choice: ‘కొట్టాడు; ... చనిపోయాడు’
  alternative: ‘హతమార్చాడు’
  rationale: మూలంలోని రెండు వరుస క్రియలను వేర్వేరుగా ఉంచి, దెబ్బ మరణానికి దారితీసిందనే కథన సంబంధాన్ని నిలుపుతుంది; ఒకే క్రియలో రెండింటినీ కలపదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే కథన గంభీరతను కాపాడే శైలి. ‘మందసం’ అనే ప్రాచుర్యమైన బైబిలు పదాన్ని ఉంచి, మిగతా వాక్యనిర్మాణాన్ని సహజంగా తీర్చిదిద్దింది.
