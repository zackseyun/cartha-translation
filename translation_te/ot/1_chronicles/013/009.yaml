  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּבֹ֖אוּ עַד גֹּ֣רֶן כִּידֹ֑ן וַ/יִּשְׁלַ֨ח עֻזָּ֜א אֶת יָד֗/וֹ לֶ/אֱחֹז֙ אֶת הָ֣/אָר֔וֹן כִּ֥י שָֽׁמְט֖וּ הַ/בָּקָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/009.yaml
  text: When they came to the threshing floor of Kidon[a], Uzza reached out his hand to take hold of the ark, because the oxen stumbled.
translation:
  language: te
  text: వారు కీదోను కళ్లం దగ్గరికి వచ్చినప్పుడు, ఎద్దులు జారడంతో[a] ఉజ్జా మందసాన్ని పట్టుకోవడానికి తన చెయ్యి చాపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తడబడడంతో.’ హీబ్రూ క్రియ జారడాన్ని లేదా ఏదైనా జారిపడేలా చేయడాన్ని సూచించగలదు; ఇక్కడ అది ఎద్దుల అస్థిరమైన కదలికను వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן כִּידֹן
  choice: కీదోను కళ్లం
  rationale: גֹּרֶן అంటే ధాన్యం నూర్చే కళ్లం; כִּידֹן స్థలనామం కాబట్టి ‘కీదోను’ అని లిప్యంతరీకరించబడింది.
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ
  choice: తన చెయ్యి చాపాడు
  rationale: చేతిని ముందుకు చాపే భౌతిక చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לֶאֱחֹז
  choice: పట్టుకోవడానికి
  rationale: אחז అంటే పట్టుకోవడం లేదా గట్టిగా అందుకోవడం; ఇక్కడ మందసాన్ని స్థిరపరచే సందర్భానికి ‘పట్టుకోవడానికి’ సరిపోతుంది.
- source_word: הָאָרוֹן
  choice: మందసాన్ని
  rationale: హీబ్రూ మూలంలో కేవలం ‘మందసం’ మాత్రమే ఉంది; ‘దేవుని మందసం’ అనే విస్తృత రూపాన్ని ఈ వచనంలో చేర్చలేదు.
- source_word: כִּי
  choice: జారడంతో
  rationale: ఉజ్జా చర్యకు కారణాన్ని తెలిపే כִּי భావాన్ని సహజమైన తెలుగు కారణార్థక నిర్మాణంతో వ్యక్తం చేసింది.
- source_word: שָׁמְטוּ
  choice: జారడంతో
  rationale: ఈ క్రియ జారడం లేదా ఏదైనా పడిపోనివ్వడం అనే భావాలను కలిగి ఉంటుంది. ఎద్దులు కర్తలుగా ఉన్నందున ‘జారడం’ ప్రత్యక్షమైన భావం; ‘తడబడడం’ కూడా సందర్భోచిత ప్రత్యామ్నాయం.
- source_word: הַבָּקָר
  choice: ఎద్దులు
  rationale: בָּקָר సాధారణంగా పశువులను సూచించగలిగినా, బండిని లాగే ఈ సందర్భంలో ‘ఎద్దులు’ అత్యంత నిర్దిష్టమైన అనువాదం.
