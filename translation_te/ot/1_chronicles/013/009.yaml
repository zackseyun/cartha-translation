translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘మందసం’ బైబిలు సందర్భంలో సుపరిచితమైన పదంగా నిలుపబడింది; మూలంలోని సంక్షిప్తతను కాపాడుతూ అదనంగా ‘దేవుని’ అని చేర్చలేదు.
