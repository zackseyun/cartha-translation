translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘మందసం’, ‘దావీదు నగరం’, ‘గిత్తీయుడు’ వంటి బైబిలు సందర్భంలో సుపరిచితమైన పదాలను నిలిపాం; మూల హీబ్రూలోని క్రియల అర్థవిస్తృతిని పాదసూచికల్లో భద్రపరిచాం.
