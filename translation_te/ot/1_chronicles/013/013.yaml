id: 1CH.13.13
reference: 1 Chronicles 13:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹֽא הֵסִ֨יר דָּוִ֧יד אֶת הָ/אָר֛וֹן אֵלָ֖י/ו אֶל עִ֣יר דָּוִ֑יד וַ/יַּטֵּ֕/הוּ אֶל בֵּ֥ית עֹבֵֽד אֱדֹ֖ם הַ/גִּתִּֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/013.yaml
  text: So David did not bring the ark to himself[a], into the City of David; instead[b], he turned it aside to the house of Obed-edom the Gittite.
translation:
  language: te
  text: కాబట్టి దావీదు మందసాన్ని తన దగ్గరికి[a], దావీదు నగరానికి తీసుకురాలేదు; దానికి బదులుగా దాన్ని గిత్తీయుడైన ఓబేద్-ఎదోము ఇంటికి మళ్లించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మందసాన్ని తన దగ్గరికి తరలించలేదు.’ హీబ్రూ క్రియకు ‘తొలగించు’ లేదా ఈ సందర్భంలో ‘తీసుకురా, తరలించు’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దాన్ని ఓబేద్-ఎదోము ఇంటికి పక్కకు తిప్పాడు’ లేదా ‘దారి మళ్లించాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  choice: తీసుకురాలేదు
  rationale: హిఫిల్ రూపంలోని סוּר అనే క్రియకు ‘తొలగించు’, ‘పక్కకు మళ్లించు’, ‘తీసుకుపోవు’ అనే అర్థాలు రావచ్చు. మందసాన్ని గమ్యస్థానమైన దావీదు నగరానికి చేర్చకపోవడమే సందర్భార్థం కాబట్టి సహజమైన తెలుగులో ‘తీసుకురాలేదు’ అని అనువదించాం; మూలంలోని విస్తృత అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: אֵלָיו
  choice: తన దగ్గరికి
  rationale: అక్షరార్థంగా ‘అతని దగ్గరికి’; కర్త దావీదే కావడం వల్ల ఇక్కడ ఆత్మార్థక సంబంధం ఉంది. ఆధునిక తెలుగులో ‘తన దగ్గరికి’ సహజంగా దాన్ని తెలియజేస్తుంది.
- source_word: עִיר דָּוִיד
  choice: దావీదు నగరం
  rationale: ఇది స్థిరమైన స్థలనామం. తెలుగులో సుపరిచితమైన నిర్మాణంగా ‘దావీదు నగరం’ వాడాం.
- source_word: וַיַּטֵּהוּ
  choice: దాన్ని ... వైపు మళ్లించాడు
  rationale: נָטָה క్రియ ఇక్కడ నిర్ణయించిన మార్గం నుంచి మందసాన్ని మరోచోటికి తిప్పడాన్ని సూచిస్తుంది. ‘మళ్లించాడు’ ఈ దృశ్యాత్మక భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: בֵּית
  choice: ఇంటి
  rationale: בַּיִת భౌతిక ఇంటినీ కుటుంబాన్నీ సూచించగలదు. మందసం ఉంచబడే స్థలం గురించి చెబుతున్నందున ‘ఇంటి’ అత్యంత ప్రత్యక్షమైన ఎంపిక.
- source_word: עֹבֵד אֱדֹם
  choice: ఓబేద్-ఎదోము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యంతరీకరణ పద్ధతిలో అందించాం.
- source_word: הַגִּתִּי
  choice: గిత్తీయుడు
  rationale: గాతుతో సంబంధాన్ని తెలిపే జాతి/స్థలవాచక విశేషణాన్ని సంక్షిప్తంగా, సంప్రదాయబద్ధంగా ‘గిత్తీయుడు’ అని అనువదించాం.
