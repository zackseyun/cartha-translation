revisions:
- from: 'దావీదు ఇశ్రాయేలు సమాజమంతటితో ఇలా అన్నాడు: “మీకు ఇది మంచిదిగా అనిపిస్తే, మన దేవుడైన యాహ్వే నుండి దీనికి ఆమోదం ఉంటే, ఇశ్రాయేలు ప్రాంతాలన్నిటిలో[c] మిగిలివున్న మన సహోదరులకు[b], వారితోపాటు తమ పచ్చికబయళ్లుగల పట్టణాల్లో[d] ఉన్న యాజకులకు, లేవీయులకు విస్తృతంగా కబురు పంపుదాం[a]. వారు మన దగ్గరికి సమకూడాలి.”'
  to: 'దావీదు ఇశ్రాయేలు సమాజమంతటితో ఇలా అన్నాడు: “మీకు ఇది మంచిదిగా అనిపిస్తే, మన దేవుడైన యాహ్వే నుండి దీనికి ఆమోదం ఉంటే, ఇశ్రాయేలు ప్రాంతాలన్నిటిలో[c] మిగిలివున్న మన సహోదరులకు[b], వారితోపాటు వారి పచ్చికబయళ్లున్న పట్టణాల్లో నివసిస్తున్న యాజకులకూ లేవీయులకూ విస్తృతంగా సందేశం పంపుదాం[a], వారు మన దగ్గరకు సమకూడేలా.”'
  rationale: సవరణలు మూలంలోని వ్యాకరణ సంబంధాలను, ముఖ్యంగా ‘పంపుదాం’ అనే చర్యకు ‘వారు సమకూడేలా’ అనే ఉద్దేశాన్ని, స్పష్టంగా చేశాయి. నִפְרְצָהకు దాడి భావాన్ని కలిగించే పాదసూచిక అక్షరార్థాన్ని తొలగించి, దాని సందర్భానుసారమైన కానీ అనిశ్చితమైన విస్తృతి భావాన్ని నిలిపాం. పాదసూచిక d పాఠ్యంలో [d] గుర్తు పచ్చికబయళ్లకు వెంటనే జతచేయబడాలి.
