source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜יד לְ/כֹ֣ל קְהַ֣ל יִשְׂרָאֵ֗ל אִם עֲלֵי/כֶ֨ם ט֜וֹב וּ/מִן יְהוָ֣ה אֱלֹהֵ֗י/נוּ נִפְרְצָה֙ נִשְׁלְחָ֞ה עַל אַחֵ֣י/נוּ הַ/נִּשְׁאָרִ֗ים בְּ/כֹל֙ אַרְצ֣וֹת יִשְׂרָאֵ֔ל וְ/עִמָּ/הֶ֛ם הַ/כֹּהֲנִ֥ים וְ/הַ/לְוִיִּ֖ם בְּ/עָרֵ֣י מִגְרְשֵׁי/הֶ֑ם וְ/יִקָּבְצ֖וּ אֵלֵֽי/נוּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/002.yaml
  text: And David said to all the assembly of Israel[a], “If it seems good to you, and if it is from Yahweh our God, let us send word to our brothers who remain in all the lands of Israel, and also to the priests and Levites with them in the cities of their pasturelands[d][c][b], that they may gather to us.”
translation:
  language: te
  text: 'దావీదు ఇశ్రాయేలు సమాజమంతటితో ఇలా అన్నాడు: “మీకు ఇది మంచిదిగా అనిపిస్తే, మన దేవుడైన యాహ్వే నుండి దీనికి ఆమోదం ఉంటే, ఇశ్రాయేలు ప్రాంతాలన్నిటిలో[c] మిగిలివున్న మన సహోదరులకు[b], వారితోపాటు వారి పచ్చికబయళ్లున్న పట్టణాల్లో నివసిస్తున్న యాజకులకూ లేవీయులకూ విస్తృతంగా సందేశం పంపుదాం[a], వారు మన దగ్గరకు సమకూడేలా.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “మనము విస్తరించుదాం; పంపుదాం.” మొదటి క్రియ ఈ సందర్భంలో విస్తారంగా లేదా అన్ని వైపులకూ పంపడాన్ని సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “సహోదరులు” అనే మాట తోటి ఇశ్రాయేలీయులందరినీ ప్రతినిధి భావంలో సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా “ఇశ్రాయేలు దేశాలన్నిటిలో”; హీబ్రూలో “దేశాలు” అనే పదం బహువచనంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְהַל
  choice: సమాజం
  rationale: ఇక్కడ కూడివచ్చిన ఇశ్రాయేలు జాతీయ సమూహాన్ని సూచిస్తుంది; ఆధునిక తెలుగు పాఠకులకు సహజంగా ఉండి, తరువాతి కాలపు మతసంస్థ భావాన్ని అనవసరంగా చేర్చదు.
- source_word: אִם עֲלֵיכֶם טוֹב
  choice: మీకు ఇది మంచిదిగా అనిపిస్తే
  rationale: ప్రజల సమ్మతి లేదా ఆమోదాన్ని కోరే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּמִן יְהוָה אֱלֹהֵינוּ
  choice: మన దేవుడైన యాహ్వే నుండి దీనికి ఆమోదం ఉంటే
  rationale: ప్రజల ఆమోదంతోపాటు దేవుని అనుమతి కూడా అవసరమనే సమన్వయాన్ని తెలుగులో స్పష్టం చేస్తుంది; హీబ్రూలో అంతర్లీనంగా ఉన్న షరతును పూరిస్తుంది.
- source_word: נִפְרְצָה נִשְׁלְחָה
  choice: విస్తృతంగా కబురు పంపుదాం
  rationale: రెండు cohortative క్రియలలో మొదటిది అక్షరార్థంగా ‘విరుచుకుపడుదాం/వ్యాపిద్దాం’ అనే భావం కలిగివున్నా, రెండవ క్రియతో కలిసి పంపే సమాచారపు విస్తృతిని బలపరుస్తున్నదని అర్థం చేసుకొని సహజంగా అనువదించబడింది; అక్షరార్థం పాదసూచికలో నిలుపబడింది.
- source_word: עַל אַחֵינוּ
  choice: మన సహోదరులకు
  rationale: ఇది ప్రతినిధి భావంలో తోటి ఇశ్రాయేలీయులను సూచించే కుటుంబసంబంధ పదాన్ని నిలుపుతుంది.
- source_word: בְּכֹל אַרְצוֹת יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రాంతాలన్నిటిలో
  rationale: హీబ్రూ బహువచనాన్ని తెలుగులో సహజంగా ‘ప్రాంతాలు’ అని వ్యక్తం చేసి, దేశమంతటా ఉన్న విస్తృతిని తెలియజేస్తుంది.
- source_word: מִגְרְשֵׁיהֶם
  choice: పచ్చికబయళ్లు
  rationale: లేవీయుల పట్టణాలకు అనుబంధంగా ఉన్న బహిరంగ మేతభూములను స్పష్టంగా సూచిస్తుంది.
- source_word: וְיִקָּבְצוּ אֵלֵינוּ
  choice: వారు మన దగ్గరికి సమకూడాలి
  rationale: ఆహ్వానం పంపడంలోని ఉద్దేశాన్ని, అలాగే వక్తలవైపు చేరే దిశను నిలుపుతుంది.
theological_decisions:
- issue: దైవనామమైన יהוה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ప్రత్యక్షంగా ఉన్న నాలుగు అక్షరాల దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితీయ ఉచ్చారణను తెలుగులో లిప్యంతరీకరించింది.
- issue: ప్రజల సమ్మతి మరియు దేవుని ఆమోదం మధ్య సంబంధం
  choice: రెండింటినీ సమన్వయ షరతులుగా నిలుపడం
  alternative: ప్రజల నిర్ణయమే దేవుని చిత్తమని విలీనం చేయడం
  rationale: మూలంలోని ‘మీకు మంచిదైతే’ మరియు ‘యాహ్వే నుండి అయితే’ అనే రెండు భాగాల మధ్య ఉన్న ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘సమాజం’, ‘సహోదరులు’, ‘యాజకులు’, ‘లేవీయులు’ వంటి బైబిలు సందర్భానికి పరిచితమైన పదాలను ఉంచుతూ, వాక్యనిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా తీర్చిదిద్దాం.
