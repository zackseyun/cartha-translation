id: 1CH.13.8
reference: 1 Chronicles 13:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/דָוִ֣יד וְ/כָל יִשְׂרָאֵ֗ל מְשַׂחֲקִ֛ים לִ/פְנֵ֥י הָ/אֱלֹהִ֖ים בְּ/כָל עֹ֑ז וּ/בְ/שִׁירִ֤ים וּ/בְ/כִנֹּרוֹת֙ וּ/בִ/נְבָלִ֣ים וּ/בְ/תֻפִּ֔ים וּ/בִ/מְצִלְתַּ֖יִם וּ/בַ/חֲצֹצְרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/008.yaml
  text: And David and all Israel were celebrating before God with all their might[a], with songs, lyres, harps, tambourines, cymbals, and trumpets.
translation:
  language: te
  text: దావీదు, ఇశ్రాయేలు ప్రజలందరూ దేవుని సన్నిధిలో తమ పూర్ణ శక్తితో సంబరాలు జరుపుతున్నారు[a]; పాటలతో, లైరు వాద్యాలతో, హార్పులతో, కంజీరాలతో, తాళాలతో, బాకాలతో జరుపుతున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని సన్నిధిలో ఆడుతున్నారు’ లేదా ‘ఆనందిస్తున్నారు’; హీబ్రూ క్రియ ఆటతో కూడిన లేదా ఉత్సవపూర్వకమైన ఆనందకార్యాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֲקִים
  choice: సంబరాలు చేసుకుంటూ … వేడుక జరుపుకున్నారు
  rationale: שׂחק అనే క్రియ ఇక్కడ సంగీత వాద్యాలతో కూడిన బహిరంగ ఆనందోత్సవాన్ని సూచిస్తుంది. తెలుగులో ‘సంబరాలు చేసుకోవడం/వేడుక జరుపుకోవడం’ కేవలం ఆట అనే భావాన్ని కాకుండా ఈ సందర్భంలోని ఉత్సవపూర్వక ఆనందాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: దేవుని సన్నిధిలో
  rationale: ఈ పదబంధం దేవుని సమక్షంలో జరిగిన ఆరాధనాత్మక కార్యాన్ని సూచిస్తుంది; ‘దేవుని సన్నిధిలో’ ఆధునిక తెలుగులో సహజమైన, గౌరవప్రదమైన అనువాదం.
- source_word: בְּכָל עֹז
  choice: తమ శక్తినంతటితో
  rationale: עֹז అంటే బలం లేదా శక్తి. బహువచన కర్తకు అనుగుణంగా ‘తమ’ను వాడటం ద్వారా వారు పూర్ణ ఉత్సాహంతో పాల్గొన్న భావం స్పష్టమవుతుంది.
- source_word: שִׁירִים
  choice: పాటలు
  rationale: బహువచన నామవాచక రూపాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: כִנֹּרוֹת
  choice: లైరు వాద్యాలు
  rationale: כִּנּוֹר సాధారణంగా లైరు తరహా తంతివాద్యంగా గుర్తించబడుతుంది. ‘లైరు వాద్యాలు’ అనే రూపం నְבָלִים నుండి దీని భేదాన్ని కాపాడుతుంది.
- source_word: נְבָלִים
  choice: హార్పులు
  rationale: ఇది כִּנּוֹר నుండి భిన్నమైన ప్రాచీన తంతివాద్యం. దాని ఖచ్చిత నిర్మాణం అనిశ్చితమైనప్పటికీ ‘హార్పులు’ సులభంగా అర్థమయ్యే ఆధునిక సమీప పదం.
- source_word: תֻפִּים
  choice: కంజీరాలు
  rationale: תֹּף చేతితో వాయించే ఫ్రేమ్ డ్రమ్ లేదా టాంబురీన్ తరహా వాద్యం. తెలుగులో ‘కంజీరాలు’ దానికి సులభంగా అర్థమయ్యే సమీప వాద్యపదం.
- source_word: מְצִלְתַּיִם
  choice: తాళాలు
  rationale: ఒకదానికొకటి తాకించి మోగించే లోహ వాద్యాలను సూచించే సహజమైన తెలుగు పదం.
- source_word: חֲצֹצְרוֹת
  choice: బాకాలు
  rationale: ఈ పదం వేడుకల్లో ఊదే నేరమైన తూర్య వాద్యాలను సూచిస్తుంది. మూల వచనంలో వెండి అని లేకపోవడంతో ఆ వివరాన్ని చేర్చలేదు.
- source_word: וְדָוִיד וְכָל יִשְׂרָאֵל
  choice: దావీదు, ఇశ్రాయేలీయులందరూ
  rationale: ‘ఇశ్రాయేలు అంతా’ అనే సమష్టి భావాన్ని వ్యక్తుల సమూహాన్ని సూచించే సహజ తెలుగు రూపంలో అందించింది.
theological_decisions:
- issue: הָאֱלֹהִים పదానికి అనువాదం
  choice: దేవుడు
  alternative: ఆ దేవుడు
  rationale: హీబ్రూలో నిర్దిష్ట ఉపపదం ఉన్నప్పటికీ, ఈ సందర్భంలో అది ఇశ్రాయేలు దేవునికి సాధారణ నిర్దేశంగా పనిచేస్తుంది. తెలుగులో ‘ఆ దేవుడు’ అనడం అనవసరమైన వ్యత్యాసాన్ని సూచించవచ్చు; ‘దేవుడు’ సహజంగా, సందర్భానుగుణంగా ఉంది.
- issue: מְשַׂחֲקִים సూచించే కార్య స్వభావం
  choice: సంబరాలు చేసుకుంటూ … వేడుక జరుపుకున్నారు
  alternative: ఆడుతూ / ఆనందిస్తూ ఉన్నారు
  rationale: క్రియలో ఆట, ఆనందం, ఉత్సవం అనే అర్థవ్యాప్తి ఉంది. సంగీత ఊరేగింపు సందర్భం ఉత్సవార్థాన్ని బలపరుస్తుంది; అయినా ఇతర సాధ్యార్థాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ఉత్సవ శైలిని ఉపయోగించాం. ప్రాచీన తంతివాద్యాల మధ్య ఉన్న భేదాన్ని ‘లైరు వాద్యాలు, హార్పులు’గా నిలిపాం; మూలంలో లేని పదార్థం లేదా నిర్మాణ వివరాలను చేర్చలేదు.
