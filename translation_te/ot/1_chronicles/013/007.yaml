id: 1CH.13.7
reference: 1 Chronicles 13:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּרְכִּ֜יבוּ אֶת אֲר֤וֹן הָ/אֱלֹהִים֙ עַל עֲגָלָ֣ה חֲדָשָׁ֔ה מִ/בֵּ֖ית אֲבִינָדָ֑ב וְ/עֻזָּ֣א וְ/אַחְי֔וֹ נֹהֲגִ֖ים בָּ/עֲגָלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/007.yaml
  text: So they set the ark of God on a new cart from the house of Abinadab[a], and Uzza and Ahio were guiding the cart.
translation:
  language: te
  text: వారు దేవుని మందసాన్ని అబీనాదాబు ఇంటి నుండి కొత్త బండిపై ఉంచారు. ఉజ్జా, అహ్యో ఆ బండిని నడిపిస్తూ ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ బండిని తోలుతూ ఉన్నారు.’ హీబ్రూ కృదంతం వాహనాన్ని నడిపించడం లేదా తోలడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכִּיבוּ
  choice: ఎక్కించారు
  rationale: רכב యొక్క హిఫీల్ రూపం ఇక్కడ మందసాన్ని వాహనం మీద ఎక్కించి మోయించడాన్ని సూచిస్తుంది. ‘ఎక్కించారు’ ఆ క్రియను సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసం
  rationale: దైవసన్నిధికి సంబంధించిన ఈ సందర్భంలో אֲרוֹןకు స్థిరంగా, గౌరవప్రదంగా వాడే తెలుగు పదం ‘మందసం’; సమాస సంబంధాన్ని ‘దేవుని’ తెలియజేస్తుంది.
- source_word: עַל עֲגָלָה חֲדָשָׁה
  choice: ఒక కొత్త బండి మీద
  rationale: עֲגָלָה అనేది సరకు మోయే బండి లేదా శకటాన్ని సూచిస్తుంది. ‘కొత్త’ అనే విశేషణాన్ని స్పష్టంగా నిలిపి, సాధారణ ఆధునిక తెలుగులో ‘బండి’ని ఎంచుకున్నాం.
- source_word: מִבֵּית אֲבִינָדָב
  choice: అబీనాదాబు ఇంటి నుండి
  rationale: מִן మూలస్థానాన్ని సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో ‘అబీనాదాబు ఇంటి నుండి’ సహజంగా, మూలానికి నమ్మకంగా ఉంటుంది.
- source_word: עֻזָּא
  choice: ఉజ్జా
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: אַחְיוֹ
  choice: అహ్యో
  rationale: హీబ్రూ వ్యక్తినామంలోని ధ్వనులను సాధ్యమైనంత దగ్గరగా తెలిపే తెలుగు లిప్యంతరీకరణ.
- source_word: נֹהֲגִים
  choice: నడిపిస్తున్నారు
  rationale: נהג వాహనాన్ని లేదా జంతువులను ముందుకు నడపడం, తోలడం అనే భావం ఇస్తుంది. వర్తమాన కృదంతపు కొనసాగుతున్న చర్యను ‘నడిపిస్తున్నారు’ సహజంగా తెలియజేస్తూ, నడిపే విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: בָּעֲגָלָה
  choice: ఆ బండిని
  rationale: נהגతో వచ్చిన ב వాహనాన్ని నడపడాన్ని సూచిస్తుంది. తెలుగులో ప్రత్యక్ష కర్మగా ‘ఆ బండిని’ అనడం సహజం; నిర్దిష్టతను ‘ఆ’ నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘మందసం’ ఆరాధనా సందర్భానికి తగిన స్థిర పదం; మిగిలిన వాక్యాన్ని సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా నిర్మించాం. మూలంలోని נהג పదానికి ఉన్న ‘నడిపించడం/తోలడం’ అనే సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
