revisions:
- from: కాబట్టి వారు దేవుని మందసాన్ని అబీనాదాబు ఇంటి నుండి ఒక కొత్త బండి మీద ఎక్కించారు. ఉజ్జా, అహ్యో ఆ బండిని నడిపిస్తున్నారు.[a]
  to: వారు దేవుని మందసాన్ని అబీనాదాబు ఇంటి నుండి కొత్త బండిపై ఉంచారు. ఉజ్జా, అహ్యో ఆ బండిని నడిపిస్తూ ఉన్నారు.[a]
