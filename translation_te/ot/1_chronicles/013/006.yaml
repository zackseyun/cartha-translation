source:
  edition: WLC
  text: וַ/יַּ֨עַל דָּוִ֤יד וְ/כָל יִשְׂרָאֵל֙ בַּעֲלָ֔תָ/ה אֶל קִרְיַ֥ת יְעָרִ֖ים אֲשֶׁ֣ר לִ/יהוּדָ֑ה לְ/הַעֲל֣וֹת מִ/שָּׁ֗ם אֵת֩ אֲר֨וֹן הָ/אֱלֹהִ֧ים יְהוָ֛ה יוֹשֵׁ֥ב הַ/כְּרוּבִ֖ים אֲשֶׁר נִקְרָ֥א שֵֽׁם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/006.yaml
  text: So David and all Israel went up to Baalah[a], that is, to Kiriath-jearim, which belongs to Judah, to bring up from there the ark of God, Yahweh who is enthroned above the cherubim, whose name is called upon it.
translation:
  language: te
  text: దావీదు, ఇశ్రాయేలీయులందరితో కలిసి, యూదాకు చెందిన కిర్యత్‌-యెయారీము అనగా బయలాకు, అక్కడి నుంచి కెరూబులపై సింహాసనాసీనుడైన యాహ్వే నామం దానిపై ఉచ్చరింపబడే దేవుని మందసాన్ని తీసుకురావడానికి పైకి వెళ్లాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత సహజంగా: “కెరూబులపై సింహాసనాసీనుడైన యాహ్వే నామంతో పిలువబడే దేవుని మందసం.” మరో సాధ్యార్థం: “అక్కడ ఆయన నామం ఉచ్చరింపబడుతుంది.” 2 సమూయేలు 6:2తో పోల్చండి.'
    reason: మూల హెబ్రీలోని చివరి ఉపవాక్యం సంక్షిప్తంగా, వ్యాకరణపరంగా సందిగ్ధంగా ఉంది; ప్రధాన పాఠం మందసంతో దాని సంబంధాన్ని నిలుపుతుండగా పాదసూచిక ప్రత్యామ్నాయ పఠనాలను ఇస్తుంది.
lexical_decisions:
- source_word: וַיַּעַל
  choice: వెళ్లారు
  rationale: ప్రయాణ సందర్భంలో עלה యొక్క దిశార్థాన్ని తెలుగులో బలవంతంగా ‘పైకి వెళ్లారు’ అనకుండా సహజంగా తెలిపే ఎంపిక.
- source_word: בַּעֲלָתָה אֶל קִרְיַת יְעָרִים
  choice: కిర్యత్‌-యెయారీము అనే బయలాకు
  rationale: బయలా అనే స్థలాన్ని కిర్యత్‌-యెయారీముగా గుర్తిస్తున్న సమానాధికార సంబంధాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: యూదాకు చెందిన
  rationale: లామెద్ సూచించే గోత్రప్రాంత సంబంధాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: לְהַעֲלוֹת מִשָּׁם
  choice: అక్కడి నుంచి ... తీసుకురావడానికి
  rationale: హిఫీల్ రూపంలోని రవాణా భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసం
  rationale: ఒడంబడిక మందసానికి తెలుగు బైబిలు వాడుకలో స్థిరపడిన, గౌరవప్రదమైన పదం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన రూపంలో దైవిక వ్యక్తినామాన్ని నిలుపుతుంది; బిరుదుతో భర్తీ చేయదు.
- source_word: יוֹשֵׁב הַכְּרוּבִים
  choice: కెరూబులపై సింహాసనాసీనుడైన
  rationale: పూర్వప్రత్యయం లేని హెబ్రీ నిర్మాణంలో రాజాసన భావాన్ని నిలుపుతూ ‘మధ్య’ అని అదనంగా నిర్ణయించదు.
- source_word: אֲשֶׁר נִקְרָא שֵׁם
  choice: ఆయన నామం దానిపై ఉచ్చరించబడుతుంది
  rationale: సంక్షిప్తమైన, సందిగ్ధ హెబ్రీ వాక్యాన్ని మందసంతో సంబంధం కలిగిస్తూ సాధ్యమైనంత సమీపంగా అనువదిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తినామాన్ని బిరుదుగా మార్చకుండా ఉంచుతూ, ఆధునిక తెలుగు క్రైస్తవ పాఠకులకు అత్యంత పరిచితమైన రూపాన్ని ఎంచుకుంది.
- issue: אֲשֶׁר נִקְרָא שֵׁם అనే చివరి ఉపవాక్య సంబంధం
  choice: ఆయన నామం దానిపై ఉచ్చరించబడుతుంది
  alternative: ‘నామం’ అని పిలువబడే మందసం / అక్కడ నామం ప్రార్థనలో ఉచ్చరించబడుతుంది
  rationale: హెబ్రీ వాక్యం సంక్షిప్తంగా ఉండి యెహోవా నామం, మందసం మధ్య సంబంధాన్ని సూచిస్తుంది; ప్రధాన పాఠం ఒక సమీప పఠనాన్ని ఇస్తూ ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. పొడవైన హెబ్రీ వాక్యాన్ని పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించినా, భావసంబంధం మరియు చివరి ఉపవాక్యంలోని నిజమైన సందిగ్ధత నిలుపబడ్డాయి.
