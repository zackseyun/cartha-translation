revisions:
- from: కాబట్టి దావీదు, ఇశ్రాయేలీయులందరూ యూదాకు చెందిన కిర్యత్‌-యెయారీము అనే బయలాకు వెళ్లారు. అక్కడి నుంచి దేవుని మందసాన్ని తీసుకురావడానికి వారు వెళ్లారు. కెరూబులపై సింహాసనాసీనుడైన యెహోవా—ఆయన నామం దానిపై ఉచ్చరించబడుతుంది[a]—అనే దేవుని మందసం అది.
