  rationale: కర్తను మూలంలోని ఏకవచన క్రియకు అనుగుణంగా ‘దావీదు ... వెళ్లాడు’గా ఉంచి, ‘ఇశ్రాయేలీయులందరితో కలిసి’ అనే పదబంధంతో సమష్టి భాగస్వామ్యాన్ని తెలిపాము. స్థలనామాల సమానాధికార సంబంధం, యూదాతో ప్రాదేశిక సంబంధం, పైకి వెళ్లడం, అక్కడి నుంచి మందసాన్ని తీసుకురావడం అన్నీ ఒకే వాక్యప్రవాహంలో పునరుద్ధరించబడ్డాయి. చివరి ఉపవాక్యంలోని నిజమైన సందిగ్ధతను ప్రధాన పాఠంలో అతిగా పరిష్కరించకుండా, పాదసూచికలో ప్రత్యామ్నాయాలను నిలిపాము.
