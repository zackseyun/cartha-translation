id: 1CH.13.3
reference: 1 Chronicles 13:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נָסֵ֛בָּה אֶת אֲר֥וֹן אֱלֹהֵ֖י/נוּ אֵלֵ֑י/נוּ כִּי לֹ֥א דְרַשְׁנֻ֖/הוּ בִּ/ימֵ֥י שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/003.yaml
  text: And let us bring the ark of our God back to us[a], for we did not seek it in the days of Shaul.
translation:
  language: te
  text: మన దేవుని మందసాన్ని తిరిగి మన దగ్గరకు తీసుకువద్దాం; ఎందుకంటే షౌలు కాలంలో మనం దానిని వెదకలేదు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాని వద్ద విచారణ చేయలేదు” లేదా “ఆయనను వెదకలేదు.” హీబ్రూ క్రియకు వెదకడం, విచారణ చేయడం అనే రెండు భావాలూ రావచ్చు; ప్రత్యయం మందసాన్ని సూచించవచ్చు, లేదా భావపరంగా దేవుణ్ణి సూచిస్తున్నదిగా అర్థం చేసుకోవచ్చు.
    reason: పదార్థ ప్రత్యామ్నాయం మరియు కర్మను గురించిన నిజమైన సందిగ్ధతను నిలుపుట
lexical_decisions:
- source_word: וְנָסֵבָּה
  choice: తిరిగి ... తీసుకువద్దాం
  rationale: סבב యొక్క ప్రథమ పురుష బహువచన కోహోర్టేటివ్ రూపం ఇక్కడ మందసాన్ని సమాజం దగ్గరకు తిరిగి తీసుకురావాలనే ప్రతిపాదనను సూచిస్తుంది. ‘తీసుకువద్దాం’ ఆ ఉమ్మడి సంకల్పాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֶת אֲרוֹן אֱלֹהֵינוּ
  choice: మన దేవుని మందసాన్ని
  rationale: నిర్మాణ సంబంధాన్ని నేరుగా నిలుపుతూ, אָרוֹן అనే ఆరాధనా వస్తువుకు తెలుగులో స్థిరంగా అర్థమయ్యే ‘మందసం’ అనే పదాన్ని వాడింది.
- source_word: אֵלֵינוּ
  choice: మన దగ్గరికి
  rationale: ప్రథమ పురుష బహువచన ప్రత్యయంతో ఉన్న దిశార్థక విభక్తిని సహజమైన తెలుగులో చూపుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న ప్రతిపాదనకు కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לֹא דְרַשְׁנֻהוּ
  choice: మనం దానిని వెదకలేదు
  rationale: דרש అనే క్రియలోని ‘వెదకడం/విచారణ చేయడం’ అనే అర్థవిస్తృతిని ప్రధాన పాఠ్యంలో ‘వెదకలేదు’ అని ఉంచింది. ఏకవచన ప్రత్యయం సమీపంలోని ‘మందసం’ వైపు సహజంగా సూచిస్తున్నందున తెలుగులో ‘దానిని’ వాడింది; దేవుడే ప్రత్యక్ష కర్మ అని వ్యాఖ్యానించి నిర్ణయించలేదు.
- source_word: בִּימֵי שָׁאוּל
  choice: షౌలు రోజుల్లో
  rationale: హీబ్రూ పేరును మూలరూపానికి దగ్గరగా ‘షౌలు’ అని లిప్యంతరీకరించి, కాలసూచక నుడికారాన్ని సహజంగా అనువదించింది.
theological_decisions:
- issue: ‘వెదకలేదు’ అనే క్రియ యొక్క కర్మ
  choice: ‘దానిని’ అని ఉంచి మందసాన్ని వ్యాకరణ సంబంధిత కర్మగా చూపడం
  alternative: ‘ఆయనను వెదకలేదు’ లేదా ‘ఆయనను విచారించలేదు’
  rationale: హీబ్రూ ఏకవచన ప్రత్యయం సమీపంలోని ‘మందసం’ అనే నామవాచకాన్ని సూచించగలదు. ‘ఆయనను’ అని ప్రధాన పాఠ్యంలో పెట్టడం దేవుడే ప్రత్యక్ష కర్మ అనే వ్యాఖ్యానాన్ని స్థిరపరుస్తుంది. మందసం ద్వారా దేవుణ్ణి ఆశ్రయించలేదనే విస్తృత భావాన్ని పాఠకుడు గ్రహించగలిగేలా అసలు వాక్యంలోని ఉద్వేగాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. ‘మందసం’ ఆరాధనా వస్తువును సంక్షిప్తంగా నిలుపుతుంది; ‘తీసుకువద్దాం’ కోహోర్టేటివ్ ఉమ్మడి ప్రతిపాదనను సహజంగా వ్యక్తం చేస్తుంది.
