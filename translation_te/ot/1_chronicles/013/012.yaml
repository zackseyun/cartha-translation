source:
  edition: WLC
  text: וַ/יִּירָ֤א דָוִיד֙ אֶת הָ֣/אֱלֹהִ֔ים בַּ/יּ֥וֹם הַ/ה֖וּא לֵ/אמֹ֑ר הֵ֚יךְ אָבִ֣יא אֵלַ֔/י אֵ֖ת אֲר֥וֹן הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/012.yaml
  text: And David feared God that day[a], saying, “How can I bring the ark of God to me?”
translation:
  language: te
  text: ఆ రోజు దావీదు దేవునికి భయపడి[a], “దేవుని మందసాన్ని నా దగ్గరికి నేనెలా తీసుకురాగలను?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవునికి జడిసి”; హెబ్రీ క్రియ సందర్భాన్ని బట్టి భయం, జడుపు లేదా భయభక్తిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא
  choice: భయపడి
  rationale: సందర్భంలో ఉజ్జా మరణం వల్ల కలిగిన భయమే ప్రధాన భావం. అదే సమయంలో దేవునిపట్ల భయభక్తి ఛాయను పూర్తిగా తొలగించకుండా ఈ పదం సహజంగా నిలుపుతుంది.
- source_word: אֶת הָאֱלֹהִים
  choice: దేవునికి
  rationale: తెలుగులో ‘దేవునికి భయపడు’ అనేది సహజమైన ప్రయోగం; హెబ్రీలోని ప్రత్యక్ష కర్మ భావాన్ని తెలుగు విభక్తి నిర్మాణానికి అనుగుణంగా వ్యక్తం చేస్తుంది.
- source_word: בַּיּוֹם הַהוּא
  choice: ఆ రోజు
  rationale: కాలసూచక హెబ్రీ పదబంధానికి సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: לֵאמֹר
  choice: అన్నాడు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హెబ్రీ క్రియారూపాన్ని తెలుగులో సహజ కథన శైలితో అందిస్తుంది.
- source_word: הֵיךְ
  choice: ఎలా
  rationale: సాధ్యతను, సందర్భంలో ఉన్న సంకోచాన్ని రెండింటినీ పరిష్కరించకుండా నిలుపుతుంది.
- source_word: אָבִיא
  choice: తీసుకురాగలను
  rationale: בוא హిఫీల్ రూపంలోని ‘తీసుకురావడం’ అనే కారణార్థక భావాన్ని, ప్రశ్నలోని సాధ్యతను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: אֵלַי
  choice: నా దగ్గరికి
  rationale: దావీదు వ్యక్తిగతంగా తన వద్దకా లేక తన స్థలానికా అనే హెబ్రీ అస్పష్టతను విస్తరించి నిర్ణయించకుండా ఉంచుతుంది.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసం
  rationale: దేవునికి చెందిన పవిత్ర మందసం అనే నిర్మాణాన్ని పారదర్శకంగా, తెలుగు బైబిలు వాడుకకు అనుగుణంగా అందిస్తుంది.
theological_decisions:
- issue: దేవుని తీర్పుకు దావీదు స్పందన స్వభావం
  choice: ‘దేవునికి భయపడి’ అని అనువదించడం
  alternative: ‘దేవునిపట్ల భయభక్తి కలిగి’ లేదా ‘దేవునికి జడిసి’
  rationale: ఉజ్జా మరణించిన తక్షణ సందర్భంలో భయం లేదా జడుపు ప్రధానంగా ఉంది. కేవలం భక్తిగా మృదువుపరచకుండా, అలాగే భయభక్తి అవకాశాన్ని పూర్తిగా తొలగించకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘మందసం’ అనే స్థిరమైన బైబిలు పదాన్ని ఉంచి, మిగతా వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా తీర్చిదిద్దాం.
