  text: וַ/יֵּשֶׁב֩ אֲר֨וֹן הָ/אֱלֹהִ֜ים עִם בֵּ֨ית עֹבֵ֥ד אֱדֹ֛ם בְּ/בֵית֖/וֹ שְׁלֹשָׁ֣ה חֳדָשִׁ֑ים וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת בֵּ֥ית עֹבֵֽד אֱדֹ֖ם וְ/אֶת כָּל אֲשֶׁר לֽ/וֹ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/014.yaml
  text: And the ark of God remained with the household of Obed-edom[a], in his house, for three months. And Yahweh blessed the household of Obed-edom and all that belonged to him.
translation:
  language: te
  text: దేవుని మందసం ఓబేద్ ఎదోము ఇంటివారితో, అతని ఇంటిలో మూడు నెలలు ఉండిపోయింది. యెహోవా ఓబేద్ ఎదోము ఇంటివారిని, అతనికి కలిగినదంతటినీ ఆశీర్వదించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: ఉండిపోయింది
  rationale: ישׁב అనే క్రియకు కూర్చోవడం, నివసించడం, ఉండడం అనే అర్థాలున్నాయి. మందసం తాత్కాలికంగా అక్కడే కొనసాగి ఉన్నదనే సందర్భార్థాన్ని సహజమైన తెలుగులో ‘ఉండిపోయింది’ తెలియజేస్తుంది.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసం
  rationale: మూలంలో ఉన్నది ‘దేవుని మందసం’ అనే సంక్షిప్త పదబంధమే; ‘నిబంధన మందసం’ అనే విస్తృత బిరుదును ఇక్కడ చేర్చలేదు.
- source_word: עִם בֵּית עֹבֵד אֱדֹם
  choice: ఓబేద్‌-ఎదోము ఇంటివారి దగ్గర
  rationale: בֵּית అనే పదం ఇల్లు లేదా ఇంటివారు అనే రెండు భావాలను ఇవ్వగలదు. వెంటనే వచ్చే ‘అతని ఇంట్లో’ అనే భౌతిక స్థల సూచనతో తేడా స్పష్టంగా ఉండేందుకు ఇక్కడ సామాజిక భావమైన ‘ఇంటివారు’ ఎంచుకోబడింది.
- source_word: בְּבֵיתוֹ
  choice: అతని ఇంట్లో
  rationale: ఇది మందసం ఉన్న భౌతిక స్థలాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: שְׁלֹשָׁה חֳדָשִׁים
  choice: మూడు నెలలు
  rationale: కాలవ్యవధిని సహజమైన ఆధునిక తెలుగులో నేరుగా తెలిపే రూపం.
- source_word: וַיְבָרֶךְ יְהוָה
  choice: యెహోవా ... ఆశీర్వదించాడు
  rationale: కర్త అయిన యెహోవాను స్పష్టంగా ఉంచి, ברך క్రియను సాధారణ బైబిలు తెలుగులో ‘ఆశీర్వదించాడు’గా అనువదించింది.
- source_word: אֶת בֵּית עֹבֵד אֱדֹם
  choice: ఓబేద్‌-ఎదోము ఇంటివారిని
  rationale: ఇక్కడ ఆశీర్వాదం కేవలం భవనానికి కాక అతని కుటుంబ గృహసమూహానికి వర్తిస్తుందని ‘ఇంటివారు’ సహజంగా తెలియజేస్తుంది; ‘ఇల్లు’ అనే సాధ్యార్థాన్ని పాదసూచికలో నిలిపింది.
- source_word: וְאֶת כָּל אֲשֶׁר לוֹ
  choice: అతనికి కలిగినదంతటినీ
  rationale: వ్యక్తులు, ఆస్తి సహా అతనికి చెందిన సమస్తాన్ని కలుపుకోగల మూలంలోని విస్తృత పరిధిని ఈ పదబంధం కాపాడుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలపాఠంలో చతురక్షర దైవనామం నేరుగా ఉంది. తెలుగు పాఠకులకు సుపరిచితమైన వ్యక్తినామ రూపం ‘యెహోవా’ను వాడటం ద్వారా దానిని సాధారణ బిరుదైన ‘ప్రభువు’గా మార్చకుండా కాపాడింది; ఉచ్చారణకు సంబంధించిన పండితుల భిన్నాభిప్రాయాన్ని సిద్ధాంతపరంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘మందసం,’ ‘ఆశీర్వదించాడు’ వంటి సుపరిచిత బైబిలు పదజాలాన్ని నిలిపి, ‘నివసించింది’ వల్ల మందసానికి మానవ నివాస భావం కలగకుండా ‘ఉండిపోయింది’ ఎంచుకోబడింది.
