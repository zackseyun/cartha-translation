translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యక్రమాన్ని ఉపయోగించాం. స్థలనామాలను అనవసరంగా అర్థనిర్ణయం చేయకుండా లిప్యంతరీకరించాం; భౌగోళిక పదబంధాల్లోని నిజమైన సందిగ్ధతను పాదసూచికల్లో నిలిపాం.
