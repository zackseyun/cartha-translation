- from: కాబట్టి దావీదు దేవుని మందసాన్ని కిర్యత్-యారీము నుండి తీసుకురావడానికి, ఐగుప్తు షీహోరు[a] మొదలుకొని లెబో-హమాతు[b] వరకు ఉన్న ఇశ్రాయేలీయులందరినీ సమకూర్చాడు.
