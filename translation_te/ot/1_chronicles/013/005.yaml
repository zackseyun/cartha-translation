id: 1CH.13.5
reference: 1 Chronicles 13:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּקְהֵ֤ל דָּוִיד֙ אֶת כָּל יִשְׂרָאֵ֔ל מִן שִׁיח֥וֹר מִצְרַ֖יִם וְ/עַד לְב֣וֹא חֲמָ֑ת לְ/הָבִיא֙ אֶת אֲר֣וֹן הָ/אֱלֹהִ֔ים מִ/קִּרְיַ֖ת יְעָרִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/005.yaml
  text: So David assembled all Israel[a], from the Shihor of Egypt to Lebo-hamath[b], to bring the ark of God from Kiriath-jearim.
translation:
  language: te
  text: దావీదు దేవుని మందసాన్ని కిర్యత్-యారీము నుండి తీసుకురావడానికి, ఐగుప్తు షీహోరు[a] నుండి లెబో-హమాతు[b] వరకు ఇశ్రాయేలు అంతటినీ సమకూర్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఐగుప్తు షీహోరు” దక్షిణ సరిహద్దును సూచించే పేరు; కొందరు దీన్ని “ఐగుప్తు వాగు” అని అర్థం చేసుకుంటారు.
    reason: cultural_note
  - marker: b
    text: లేదా, మరింత అక్షరార్థంగా, “హమాతులో ప్రవేశం వరకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: సమకూర్చాడు
  rationale: హిఫీల్ రూపం ప్రజలను ఒకచోటికి రప్పించడాన్ని సూచిస్తుంది. జాతీయ సమాహారానికి ‘సమకూర్చాడు’ సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు పదం.
- source_word: כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలీయులందరినీ
  rationale: హెబ్రీలోని సామూహిక జాతీయ వ్యక్తీకరణను సహజమైన తెలుగులో తెలియజేస్తుంది; ఇది తప్పనిసరిగా ప్రతి వ్యక్తినీ కాక, దేశమంతటినీ ప్రాతినిధ్యపూర్వకంగా సూచించవచ్చు.
- source_word: מִן שִׁיחוֹר מִצְרַיִם
  choice: ఐగుప్తు షీహోరు మొదలుకొని
  rationale: షీహోరు అనే భౌగోళిక పేరును అనువదించి ఒక నిర్దిష్ట జలప్రవాహంగా ముందే నిర్ణయించకుండా లిప్యంతరీకరించింది. ‘ఐగుప్తు’తో దాని సంబంధాన్ని మూలంలోని సంక్షిప్త రూపానికి దగ్గరగా ఉంచింది.
- source_word: וְעַד לְבוֹא חֲמָת
  choice: లెబో-హమాతు వరకు
  rationale: ఈ పదబంధం సరిహద్దును సూచించే స్థలనామంగా పనిచేస్తుంది. అందువల్ల స్థలనామ రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: לְהָבִיא
  choice: తీసుకురావడానికి
  rationale: ఈ క్రియారూపం ఉద్దేశాన్ని తెలియజేస్తుంది. మందసాన్ని మరొక చోటు నుండి దావీదు వద్దకు తేవడం అనే సందర్భంలో ‘తీసుకురావడానికి’ సహజంగా ఉంది.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: దేవుని మందసం
  rationale: నిబంధన మందసాన్ని సూచించే ప్రామాణికమైన, సంక్షిప్త తెలుగు వ్యక్తీకరణ; మూలంలో లేని వివరణను చేర్చదు.
- source_word: מִקִּרְיַת יְעָרִים
  choice: కిర్యత్-యారీము నుండి
  rationale: హెబ్రీ స్థలనామాన్ని గుర్తించదగిన విధంగా లిప్యంతరీకరించి, מִן ఉపసర్గలోని ‘నుండి’ భావాన్ని స్పష్టంగా తెలిపింది.
