translation:
  language: te
  text: సభలోని వారందరూ అలా చేయాలని అన్నారు[a], ఎందుకంటే ఆ విషయం ప్రజలందరి దృష్టిలో సరైనదిగా ఉంది.
  philosophy: optimal-equivalence
  footnotes:
