id: 1CH.23.5
reference: 1 Chronicles 23:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אַרְבַּ֥עַת אֲלָפִ֖ים שֹׁעֲרִ֑ים וְ/אַרְבַּ֤עַת אֲלָפִים֙ מְהַֽלְלִ֣ים לַ/יהוָ֔ה בַּ/כֵּלִ֕ים אֲשֶׁ֥ר עָשִׂ֖יתִי לְ/הַלֵּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/005.yaml
  text: and four thousand gatekeepers[a], and four thousand praising Yahweh with the instruments that I made to praise him.
translation:
  language: te
  text: నాలుగు వేలమంది ద్వారపాలకులు, నాలుగు వేలమంది నేను స్తుతికోసం తయారు చేసిన వాయిద్యాలతో యాహ్వేను స్తుతించేవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నేను స్తుతికోసం తయారు చేసిన వాయిద్యాలతో.” ఈ మాటలు యాహ్వేను స్తుతించడానికి తయారు చేసిన వాయిద్యాలని సూచించవచ్చు.
    reason: లְהַלֵּל అనే ఉద్దేశార్థక క్రియారూపానికి ప్రత్యక్ష కర్మ లేకపోవడం వల్ల ఏర్పడే సంక్షిప్తతను సూచించడానికి.
lexical_decisions:
- source_word: שֹׁעֲרִים
  choice: ద్వారపాలకులు
  rationale: ఆలయ ద్వారాల వద్ద నియమించబడినవారిని సూచించే సహజమైన, సందర్భోచితమైన తెలుగు పదం.
- source_word: מְהַלְלִים
  choice: స్తుతించేవారు
  rationale: వారి నిరంతర విధిని సూచించే హీబ్రూ కృదంత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַיהוָה
  choice: యాహ్వేను
  rationale: మూలంలోని దైవనామమైన יהוהను బిరుదుగా మార్చకుండా పేరుగా లిప్యంతరీకరిస్తుంది.
- source_word: בַּכֵּלִים
  choice: వాయిద్యాలతో
  rationale: כֵּלִים సాధారణంగా పరికరాలను సూచించినా, ఇక్కడ స్తుతి సందర్భం వల్ల సంగీత వాయిద్యాలు ఉద్దేశించబడ్డాయి.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: నేను ... తయారు చేసిన
  rationale: మొదటి పురుష ఏకవచన క్రియను, వాయిద్యాలను విశేషించే సంబంధ వాక్యాన్ని నేరుగా నిలుపుతుంది.
- source_word: לְהַלֵּל
  choice: స్తుతించడానికి
  rationale: ఉద్దేశాన్ని తెలిపే హీబ్రూ క్రియారూపాన్ని ప్రతిబింబిస్తుంది; మూలంలో కర్మ స్పష్టంగా లేకపోవడం వల్ల తెలుగులోనూ దాన్ని చేర్చలేదు.
- source_word: וְאַרְבַּעַת אֲלָפִים ... וְאַרְבַּעַת אֲלָפִים
  choice: నాలుగు వేలమంది ... మరో నాలుగు వేలమంది
  rationale: రెండు వేర్వేరు సేవక గుంపులను స్పష్టంగా చూపిస్తూ పునరుక్త సంఖ్యా నిర్మాణాన్ని నిలుపుతుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునికంగా స్వీకృతమైన ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించబడింది.
- issue: לְהַלֵּלకు ఊహిత కర్మ
  choice: స్తుతించడానికి
  alternative: ఆయనను స్తుతించడానికి
  rationale: హీబ్రూలో ‘ఆయనను’ అనే కర్మ ప్రత్యక్షంగా లేదు. సందర్భం యాహ్వేను సూచించినప్పటికీ, మూలంలోని సంక్షిప్తతను మరియు స్వల్ప అస్పష్టతను నిలుపుటకు కర్మను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. లెక్కింపులోని రెండు గుంపులను సెమికోలన్ మరియు ‘మరో’తో స్పష్టపరిచాం; మూలంలో లేని ప్రధాన క్రియను చేర్చలేదు.
