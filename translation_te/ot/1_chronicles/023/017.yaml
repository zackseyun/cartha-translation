- from: ఎలీయెజెరు కుమారులలో రెహబ్యా ముఖ్యుడు[a]. ఎలీయెజెరుకు వేరే కుమారులు లేరు; అయితే రెహబ్యా కుమారులు అత్యధికంగా విస్తరించారు.
  to: 'ఎలీయెజెరు కుమారులు: రెహబ్యా ముఖ్యుడు[a]. ఎలీయెజెరుకు వేరే కుమారులు లేరు; అయితే రెహబ్యా కుమారులు ఎంతో విస్తరించారు.'
  rationale: 'The revision removes the added “among” nuance from the opening and presents the Hebrew genealogical formula directly in idiomatic Telugu. It retains the source''s contrast and intensive sense: Eliezer had no other sons, yet Rehabiah''s sons became very numerous.'
