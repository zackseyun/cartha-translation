language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּֽהְי֥וּ בְנֵי אֱלִיעֶ֖זֶר רְחַבְיָ֣ה הָ/רֹ֑אשׁ וְ/לֹא הָיָ֤ה לֶ/אֱלִיעֶ֨זֶר֙ בָּנִ֣ים אֲחֵרִ֔ים וּ/בְנֵ֥י רְחַבְיָ֖ה רָב֥וּ לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/017.yaml
  text: 'The sons of Eliezer: Rehabiah was the chief[a], and Eliezer had no other sons; but the sons of Rehabiah became very many.'
translation:
  language: te
  text: 'ఎలీయెజెరు కుమారులు: రెహబ్యా ముఖ్యుడు[a]. ఎలీయెజెరుకు వేరే కుమారులు లేరు; అయితే రెహబ్యా కుమారులు ఎంతో విస్తరించారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మొదటివాడు.”
    reason: הָרֹאשׁ వంశావళి సందర్భంలో ‘ముఖ్యుడు/ప్రధానుడు’ అని, సందర్భానుసారంగా ‘మొదటివాడు’ అని కూడా అర్థమవవచ్చు; ఈ పాదసూచిక ఆ ప్రత్యామ్నాయాన్ని నిలుపుతుంది.
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי אֱלִיעֶזֶר
  choice: ఎలీయెజెరు కుమారులలో
  rationale: వంశావళి జాబితాను పరిచయం చేసే హెబ్రీ నిర్మాణాన్ని తెలుగులో సహజమైన పరిచయ పదబంధంగా అందిస్తుంది.
- source_word: רְחַבְיָה
  choice: రెహబ్యా
  rationale: వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు సమీపంగా తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: הָרֹאשׁ
  choice: ముఖ్యుడు
  rationale: ‘తల, ప్రధానుడు, మొదటివాడు’ అనే భావపరిధిలో, వంశ లేదా కుటుంబ నాయకత్వ భావాన్ని సహజంగా తెలియజేస్తుంది; ‘మొదటివాడు’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: וְלֹא הָיָה לֶאֱלִיעֶזֶר בָּנִים אֲחֵרִים
  choice: ఎలీయెజెరుకు వేరే కుమారులు లేరు
  rationale: హెబ్రీ అస్తిత్వాత్మక స్వామ్య నిర్మాణాన్ని అర్థం మారకుండా సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּבְנֵי רְחַבְיָה
  choice: అయితే రెహబ్యా కుమారులు
  rationale: ఎలీయెజెరుకు మరి కుమారులు లేకపోవడానికి, రెహబ్యా ద్వారా సంతానం విస్తరించడానికి మధ్య ఉన్న వ్యత్యాసాన్ని ‘అయితే’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: רָבוּ לְמָעְלָה
  choice: అత్యధికంగా విస్తరించారు
  rationale: רָבוּలోని సంఖ్యాపరమైన పెరుగుదల భావాన్నీ, לְמָעְלָה ఇచ్చే తీవ్రతనూ కలిపి సహజంగా వ్యక్తం చేస్తుంది.
