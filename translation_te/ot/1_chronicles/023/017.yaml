translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గంభీరమైన వంశావళి శైలిని ఉపయోగించింది. పేర్లను తెలుగు లిపిలో లిప్యంతరీకరించింది; మూలంలోని వ్యత్యాసం మరియు పదార్థ సందిగ్ధతను నిలిపింది.
