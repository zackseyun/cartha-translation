  text: And as for Moses, the man of God, his sons were counted among the tribe of Levi.
translation:
  language: te
  text: దేవుని మనిషియైన మోషే కుమారులు లేవి గోత్రంలో లెక్కించబడ్డారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: దేవుని మనిషి
  rationale: హీబ్రూ బిరుదును సహజమైన ఆధునిక తెలుగులో నేరుగా నిలుపుతుంది.
- source_word: יִקָּרְאוּ עַל שֵׁבֶט הַלֵּוִי
  choice: లేవి గోత్రంలో లెక్కించబడ్డారు
  rationale: ఇక్కడ קרא על అనే ప్రయోగం పేరుతో పిలవడం కంటే గోత్రానికి చెందినవారిగా నమోదు చేయడం లేదా లెక్కించడం అనే భావాన్ని సందర్భానుసారంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: మోషే కుమారుల గోత్రస్థానం
  choice: లేవి గోత్రంలో లెక్కించబడ్డారు
  alternative: లేవి గోత్రం పేరుతో పిలువబడ్డారు
  rationale: వారు ప్రత్యేక యాజక వంశంగా కాక లేవి గోత్ర సభ్యులుగా పరిగణించబడ్డారనే వంశావళి సందర్భాన్ని ప్రతిబింబిస్తుంది; మూలంలోని నిష్క్రియ రూపాన్ని కూడా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గౌరవప్రదమైన వంశావళి శైలి. వాక్యారంభంలోని וּמֹשֶׁה అనే అంశోద్ఘాటనను తెలుగులో అసహజమైన ‘మోషే విషయానికైతే’ అని కాక, అంశాన్ని ముందుంచే సహజ పదక్రమంతో వ్యక్తం చేశాం.
