  yaml_path: translation/ot/1_chronicles/023/015.yaml
  text: 'The sons of Moses: Gershom and Eliezer.'
translation:
  language: te
  text: 'మోషే కుమారులు: గేర్షోము మరియు ఎలీయెజెరు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది בֵּן పదానికి నిర్మాణ బహువచన రూపం; ఇక్కడ వంశావళి జాబితాలో మోషేకు పుట్టిన పురుష సంతానాన్ని నేరుగా సూచిస్తుంది.
- source_word: מֹשֶׁה
  choice: మోషే
  rationale: హీబ్రూ వ్యక్తినామానికి ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన లిప్యంతరీకరణ.
- source_word: גֵּרְשֹׁם
  choice: గేర్షోము
  rationale: మోషే కుమారుని పేరైన గేర్షోమును, వేరే పేరైన గేర్షోనుతో కలపకుండా హీబ్రూ రూపానికి అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: וֶ/אֱלִיעֶזֶר
  choice: ఎలీయెజెరు
  rationale: వావ్ సంధి రెండు పేర్లను కలుపుతుంది; తెలుగులో జాబితా నిర్మాణం వల్ల కామాతో అదే సంబంధం సహజంగా వ్యక్తమవుతుంది. אֱלִיעֶזֶר అనే వ్యక్తినామం వేరే పేరైన ఎలియాజరుతో కలవకుండా లిప్యంతరీకరించబడింది.
theological_decisions: []
translation_notes:
  register: సంక్షిప్తమైన వంశావళి శైలిని నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా మరియు గౌరవప్రదంగా రూపొందించబడింది. మూలంలోని శీర్షికాత్మక వాక్య నిర్మాణాన్ని ద్విబిందువుతో కాపాడి, పేర్ల మధ్య హీబ్రూ సంధిని తెలుగులో సహజమైన జాబితా విరామచిహ్నంతో తెలిపింది.
