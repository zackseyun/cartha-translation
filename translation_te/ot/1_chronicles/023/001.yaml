  text: David was old and full of days[a], and he made his son Solomon king over Israel.
translation:
  language: te
  text: దావీదు వృద్ధుడై, నిండైన ఆయుష్షు పొందినప్పుడు[a], తన కుమారుడైన సొలొమోనును ఇశ్రాయేలుపై రాజుగా నియమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వయస్సు బాగా ముదిరినవాడై”; అక్షరార్థంగా, “దినాలతో నిండినవాడై.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן
  choice: ముసలివాడై
  rationale: దావీదు వృద్ధాప్యానికి చేరిన స్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וְשָׂבַע יָמִים
  choice: నిండు వయస్సుకు చేరుకున్నప్పుడు
  rationale: అక్షరార్థంగా ‘దినాలతో నిండినవాడు’ అనే హీబ్రూ నుడికారాన్ని, దీర్ఘమైన సంపూర్ణ జీవితకాలానికి చేరుకోవడం అనే భావంతో సహజంగా అందిస్తుంది; [a]లో అక్షరార్థాన్ని నిలుపుతుంది.
- source_word: וַיַּמְלֵךְ
  choice: రాజుగా నియమించాడు
  rationale: హిఫిల్ causative రూపంలోని ‘రాజుగా చేశాడు/పాలింపజేశాడు’ అనే భావాన్ని తెలియజేస్తుంది; పాఠ్యంలో లేని పట్టాభిషేక ఆచారాన్ని చేర్చదు.
- source_word: אֶת שְׁלֹמֹה בְנוֹ
  choice: తన కుమారుడైన సొలొమోనును
  rationale: కుమారునిగా ఉన్న సంబంధాన్ని స్పష్టంగా, సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుమీద
  rationale: ప్రజలపై రాజాధికారాన్ని సూచించే עַל భావాన్ని నేరుగా అందిస్తుంది; మూలంలో లేని ‘ఇశ్రాయేలంతటి’ అనే భావాన్ని చేర్చదు.
- source_word: וְ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఆరంభ conjunction కథన కొనసాగింపును సూచిస్తుంది. ఈ ఒక్క వచనంలో కృత్రిమంగా ‘మరియు/ఇప్పుడు’ చేర్చకుండా తెలుగు వాక్యప్రవాహంలో దాని అనుసంధాన పాత్రను వ్యక్తం చేసింది.
