id: 1CH.23.26
reference: 1 Chronicles 23:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/גַ֖ם לַ/לְוִיִּ֑ם אֵין לָ/שֵׂ֧את אֶת הַ/מִּשְׁכָּ֛ן וְ/אֶת כָּל כֵּלָ֖י/ו לַ/עֲבֹדָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/026.yaml
  text: And also[a], the Levites no longer need to carry the tabernacle and all its utensils for its service.
translation:
  language: te
  text: అలాగే, లేవీయులు గుడారాన్నీ దాని సేవకు కావలసిన సామగ్రినంతటినీ మోయవలసిన అవసరం ఇక లేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లేవీయులు గుడారాన్నీ దాని సేవకు కావలసిన సామగ్రినంతటినీ మోయవలసిన పని లేదు.”
    reason: హీబ్రూ నిర్మాణాన్ని మరింత ప్రత్యక్షంగా ప్రతిబింబించే ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: וְגַם
  choice: ఇక
  rationale: ముందటి వచనంలో యెహోవా యెరూషలేములో శాశ్వతంగా నివసిస్తాడనే ప్రకటనకు ఈ వాక్యాన్ని అనుసంధానిస్తూ, పరిస్థితిలో వచ్చిన మార్పును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. సంకలిత భావం వాక్య సమగ్రతలో వ్యక్తమవుతుంది.
- source_word: לַלְוִיִּם
  choice: లేవీయులు
  rationale: ల־ ఇక్కడ ప్రభావిత పక్షాన్ని సూచిస్తుంది; తెలుగు వాక్య నిర్మాణంలో వారిని కర్తగా చూపడం సహజం.
- source_word: אֵין לָשֵׂאת
  choice: మోయవలసిన అవసరం లేదు
  rationale: అక్షరార్థంగా ‘మోయడానికి లేదు’ అనే నిర్మాణం. సందర్భంలో ఇది నిషేధం కాక, ఇకపై ఆ పని అవసరం లేదనే భావాన్ని సూచిస్తుంది.
- source_word: הַמִּשְׁכָּן
  choice: గుడారం
  rationale: ఇశ్రాయేలు ఆరాధనా సందర్భంలోని משכןకు తెలుగులో స్థిరపడిన, సులభంగా అర్థమయ్యే పదం.
- source_word: וְאֶת כָּל כֵּלָיו
  choice: దాని సేవకు సంబంధించిన సామగ్రినంతటినీ
  rationale: כֵּלִים అనేది పాత్రలు, పనిముట్లు, ఉపకరణాలు వంటి విస్తృత శ్రేణిని సూచిస్తుంది; ‘సామగ్రి’ ఆ విస్తృతిని కాపాడుతుంది. כָּל యొక్క సంపూర్ణ భావాన్ని ‘అంతటినీ’ వ్యక్తం చేస్తుంది.
- source_word: לַעֲבֹדָתוֹ
  choice: దాని సేవకు సంబంధించిన
  rationale: ప్రత్యయం సహజంగా గుడారాన్ని సూచిస్తుంది. సామగ్రి గుడారపు సేవలో ఉపయోగించబడుతుందనే సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: אֵין לָשֵׂאת యొక్క విధి స్వరూపం
  choice: అవసరం లేకపోవడం
  alternative: మోయకూడదనే నిషేధం
  rationale: దావీదు చేసిన లేవీయుల సేవా పునర్వ్యవస్థీకరణ సందర్భంలో, గుడారం ఇక తరలించబడదు కాబట్టి మోయడం అవసరం లేదని వాక్యం చెబుతుంది; నైతిక లేదా ఆచారపరమైన నిషేధాన్ని విధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన శైలి. ‘ఉపకరణాలు’ కంటే విస్తృతార్థకమైన ‘సామగ్రి’ ఎంచుకోబడింది.
