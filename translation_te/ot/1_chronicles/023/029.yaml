source:
  edition: WLC
  text: וּ/לְ/לֶ֨חֶם הַֽ/מַּעֲרֶ֜כֶת וּ/לְ/סֹ֤לֶת לְ/מִנְחָה֙ וְ/לִ/רְקִיקֵ֣י הַ/מַּצּ֔וֹת וְ/לַֽ/מַּחֲבַ֖ת וְ/לַ/מֻּרְבָּ֑כֶת וּ/לְ/כָל מְשׂוּרָ֖ה וּ/מִדָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/029.yaml
  text: and for the bread of the arrangement[a], and for the fine flour for the grain offering, and for the wafers of unleavened bread, and for what is cooked on the griddle, and for what is well-mixed, and for every measure and size,
translation:
  language: te
  text: వరుసగా అమర్చిన రొట్టెల[a]ను, ధాన్యార్పణానికి మెత్తని పిండిని, పులియని పలుచని రొట్టెలను, పెనంపై చేసిన వాటిని, బాగా కలిపిన వాటిని, ప్రతి కొలతను, ప్రతి పరిమాణాన్ని చూసుకోవడం కోసం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘అమరిక రొట్టెలు’ లేదా ‘వరుసగా ఉంచిన రొట్టెలు’; వీటిని ‘సన్నిధి రొట్టెలు’ అని కూడా అంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם הַמַּעֲרֶכֶת
  choice: సన్నిధిలో వరుసగా ఉంచే రొట్టెలు
  rationale: మַעֲרֶכֶת అనే పదంలోని ‘అమరిక/వరుస’ భావాన్ని నిలుపుతూ, ఆరాధనా సందర్భంలో అవి దేవుని సన్నిధిలో ఉంచబడతాయని సహజమైన తెలుగులో తెలియజేస్తుంది; సంప్రదాయ సంక్షిప్త పదంతో భావాన్ని అస్పష్టంగా చేయదు.
- source_word: סֹלֶת
  choice: సన్నని పిండి
  rationale: అర్పణల్లో ఉపయోగించే శుద్ధమైన మెత్తటి పిండిని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: מִנְחָה
  choice: ధాన్యార్పణ
  rationale: ఈ ఆరాధనా సందర్భంలో సాధారణ కానుకకన్నా ధాన్యంతో చేసే అర్పణను నిర్దిష్టంగా సూచిస్తుంది.
- source_word: רְקִיקֵי הַמַּצּוֹת
  choice: పులియని పలుచని రొట్టెలు
  rationale: רְקִיקִים లోని పలుచని రొట్టె భావాన్నీ, מַצּוֹת లోని పులియని స్వభావాన్నీ సహజంగా నిలుపుతుంది.
- source_word: מַּחֲבַת
  choice: పెనం మీద వండినవి
  rationale: పదం చదునైన వంటపాత్రను సూచించినా, జాబితా సందర్భంలో ఆ పాత్రలో సిద్ధం చేసిన అర్పణ పదార్థాన్ని సూచించేలా అనువదించడం సహజం.
- source_word: מֻּרְבָּכֶת
  choice: కలిపి చేసినవి
  rationale: ఇది కలపబడిన తయారీని సూచించే నిష్క్రియ రూపం; నూనె లేదా వంటవిధానాన్ని మించి నిర్దిష్టం చేయకుండా మూలంలోని విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: מְשׂוּרָה
  choice: కొలతలు
  rationale: ప్రామాణికంగా కొలిచిన పరిమాణం లేదా సామర్థ్య కొలతను సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: מִדָּה
  choice: పరిమాణాలు
  rationale: మְשׂוּרָהతో జతగా వచ్చి కొలత ప్రమాణాల విస్తృత భావాన్ని ఇస్తుంది; తెలుగులో సహజమైన వేర్పాటును కల్పిస్తుంది.
theological_decisions:
- issue: లֶחֶם הַמַּעֲרֶכֶתకు ఆరాధనా సంబంధమైన పేరు
  choice: సన్నిధిలో వరుసగా ఉంచే రొట్టెలు
  alternative: సన్నిధి రొట్టెలు; అమరిక రొట్టెలు
  rationale: హీబ్రూ వాక్యంలో ప్రత్యక్షంగా ఉన్న ‘అమరిక/వరుస’ భావాన్ని నిలిపి, సంబంధిత యాజక గ్రంథాల ఆధారంగా ‘సన్నిధి’ భావాన్ని ప్రధాన పాఠ్యంలో మితంగా స్పష్టం చేస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ఈ వాక్యం మునుపటి వాక్యంలోని లేవీయుల బాధ్యతల జాబితిని కొనసాగిస్తున్నందున ‘చూసుకోవడం కోసం’ అని చివర చేర్చి తెలుగులో వాక్య సంబంధాన్ని స్పష్టం చేశాం.
