revisions:
- from: సన్నిధిలో వరుసగా ఉంచే రొట్టెల[a] కోసం, ధాన్యార్పణకు వాడే సన్నని పిండి కోసం, పులియని పలుచని రొట్టెల కోసం, పెనం మీద వండిన వాటి కోసం, కలిపి చేసిన వాటి కోసం, అలాగే అన్ని కొలతలూ పరిమాణాలూ చూసుకోవడం కోసం.
