  text: וְ/שָׁמְר֞וּ אֶת מִשְׁמֶ֣רֶת אֹֽהֶל מוֹעֵ֗ד וְ/אֵת֙ מִשְׁמֶ֣רֶת הַ/קֹּ֔דֶשׁ וּ/מִשְׁמֶ֕רֶת בְּנֵ֥י אַהֲרֹ֖ן אֲחֵי/הֶ֑ם לַ/עֲבֹדַ֖ת בֵּ֥ית יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/032.yaml
  text: And they were to keep charge of the tent of meeting[a], the charge of the holy place, and the charge of the sons of Aaron their brothers, for the service of the house of Yahweh.
translation:
  language: te
  text: యాహ్వే మందిర సేవకోసం వారు సమావేశపు గుడారం బాధ్యతను, పవిత్ర స్థలం[a] బాధ్యతను, తమ సహోదరులైన అహరోను కుమారుల బాధ్యతను నిర్వర్తించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పవిత్ర ప్రాకారం.’ హీబ్రూ పదం పవిత్ర స్థలాన్ని లేదా విస్తృతంగా పవిత్ర ప్రాంగణాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: బాధ్యతను చూసుకుంటూ … నిర్వర్తించాలి
  rationale: שׁמר అంటే కాపాడడం, పాటించడం, బాధ్యతగా చూసుకోవడం. ఇక్కడ లేవీయులకు అప్పగించిన నిరంతర విధులను తెలిపే సందర్భం కాబట్టి, సాధారణ భూతకాలంగా కాక విధి భావంతో అనువదించబడింది.
- source_word: מִשְׁמֶרֶת
  choice: బాధ్యత
  rationale: ఈ నామవాచకం అప్పగించిన కాపలా, విధి లేదా బాధ్యతను సూచిస్తుంది. మూలంలోని మూడుసార్ల పునరుక్తిని తెలుగులోనూ నిలుపుతుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: సమావేశపు గుడారం
  rationale: హీబ్రూ పదబంధంలోని ‘గుడారం,’ ‘సమావేశం’ అనే అంశాలను స్పష్టంగా నిలిపే సహజమైన తెలుగు రూపం.
- source_word: הַקֹּדֶשׁ
  choice: పవిత్ర స్థలం
  rationale: ఆరాధనా సందర్భంలో ఈ పదం పవిత్రమైన ప్రదేశాన్ని సూచిస్తుంది; ‘పవిత్ర స్థలం’ ఆ భావాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: בְּנֵי אַהֲרֹן אֲחֵיהֶם
  choice: తమ సహోదరులైన అహరోను కుమారులు
  rationale: అహరోను వంశపు యాజకులను లేవీయుల సహోదరులుగా పేర్కొనే మూలంలోని కుటుంబ సంబంధ భాషను నిలుపుతుంది.
- source_word: לַעֲבֹדַת
  choice: సేవను నిర్వర్తించాలి
  rationale: ఆలయ సందర్భంలో עֲבֹדָה ఆరాధనకు సంబంధించిన సేవ లేదా పని. తెలుగులో విధి భావాన్ని సహజంగా తెలియజేయడానికి ఈ రూపం వాడబడింది.
- source_word: בֵּית יְהוָה
  choice: యాహ్వే మందిరం
  rationale: మూలార్థం ‘యాహ్వే గృహం’; ఈ సందర్భంలో అది దేవాలయాన్ని సూచిస్తున్నందున, ఆధునిక తెలుగులో సహజమైన ‘మందిరం’ వాడబడింది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: హీబ్రూ పాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని ధ్వన్యంతరీకరణను ఉపయోగిస్తుంది.
- issue: וְשָׁמְרוּ యొక్క కాలం/విధి భావం
  choice: నిర్వర్తించాలి
  alternative: చూసుకున్నారు; చూసుకుంటారు
  rationale: ఈ వాక్యం లేవీయుల నియామక విధులను సంగ్రహిస్తోంది. అందువల్ల రూపాన్ని కేవలం గత సంఘటనగా కాక అప్పగించిన బాధ్యతగా వ్యక్తం చేయడం సందర్భానికి సరిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. పరిపాలనా భావాన్ని తెలిపేందుకు ‘బాధ్యత’ను మూడుసార్లు ఉంచి మూలంలోని సమాంతర నిర్మాణాన్ని కాపాడాం. అందించిన ఆంగ్ల పాదటిప్పణి ‘సమావేశపు గుడారం’కు సరిపోని పదార్థ వివరణను ఇస్తున్నందున, మూల హీబ్రూ ఆధారంగా దాన్ని చేర్చలేదు.
