  yaml_path: translation/ot/1_chronicles/023/002.yaml
  text: And he gathered all the leaders of Israel[a], and the priests and the Levites.
translation:
  language: te
  text: అతడు ఇశ్రాయేలు నాయకులందరినీ[a], యాజకులను, లేవీయులను సమకూర్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇశ్రాయేలు అధిపతులందరినీ,’ ‘ఇశ్రాయేలు అధికారులందరినీ,’ లేదా ‘ఇశ్రాయేలు ప్రధానులందరినీ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: సమకూర్చాడు
  rationale: వావ్-కన్సెక్యూటివ్‌తో ఉన్న אסף కథనాన్ని ముందుకు నడిపిస్తూ, ప్రజలను ఒకచోట చేర్చడాన్ని సూచిస్తుంది. ఆధునిక తెలుగు వాక్యంలో ‘సమకూర్చాడు’ సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: כָּל
  choice: అందరినీ
  rationale: బహువచన వ్యక్తులను సూచించే నామవాచకంతో సంపూర్ణతను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: שָׂרֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు నాయకులు
  rationale: שָׂרִים అనే పదం అధిపతులు, అధికారులు, ప్రధానులు లేదా నాయకులను సూచించగలదు. ఇక్కడ పరిపాలనా సందర్భంలో ‘నాయకులు’ స్పష్టమైన ఆధునిక పదం; రాజకుమారులనే ప్రత్యేకంగా సూచిస్తున్నట్లు అనవసరంగా పరిమితం చేయదు.
- source_word: וְהַכֹּהֲנִים
  choice: యాజకులను
  rationale: నిర్దిష్ట బహువచన నామవాచకానికి సూటిగా, తెలుగు బైబిలు వాడుకకు అనుగుణంగా ఉన్న అనువాదం.
- source_word: וְהַלְוִיִּם
  choice: లేవీయులను
  rationale: లేవి గోత్రానికి చెందిన వర్గాన్ని సూచించే ప్రామాణిక తెలుగు రూపం.
theological_decisions: []
translation_notes:
  register: సామాన్య ఆధునిక పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన ప్రామాణిక తెలుగును ఉపయోగించాం. హీబ్రూ జాబితా నిర్మాణాన్ని సహజమైన తెలుగు కర్మవిభక్తితో నిలిపాం.
