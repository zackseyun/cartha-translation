reference: 1 Chronicles 23:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּנֵ֖י עֻזִּיאֵ֑ל מִיכָ֣ה הָ/רֹ֔אשׁ וְ/יִשִּׁיָּ֖ה הַ/שֵּׁנִֽי׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/020.yaml
  text: 'The sons of Uzziel: Micah the first[b][a], and Isshiah the second.'
translation:
  language: te
  text: 'ఉజ్జీయేలు కుమారులు: మీకా మొదటివాడు[a], ఇష్షీయా రెండోవాడు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మీకా ప్రధానుడు’; హీబ్రూలో అక్షరార్థంగా ‘మీకా తల.’
    reason: lexical_alternative
  - marker: b
    text: ఈ పేరును ‘ఇష్షీయా’ అని లిప్యంతరీకరించాం; హీబ్రూ పేర్ల లిప్యంతరీకరణ సంప్రదాయాలను బట్టి ఇతర రూపాలు కూడా కనిపించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది בֵּן పదం యొక్క నిర్మిత బహువచనం; వంశావళి జాబితాలో ఉజ్జీయేలు కుమారులను నేరుగా పరిచయం చేస్తోంది.
- source_word: עֻזִּיאֵל
  choice: ఉజ్జీయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వనులకు తగిన విధంగా లిప్యంతరీకరించాం.
- source_word: מִיכָה
  choice: మీకా
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన, తెలుగులో సహజంగా చదవగల లిప్యంతరీకరణ.
- source_word: הָרֹאשׁ
  choice: మొదటివాడు
  rationale: రֹאשׁ అక్షరార్థంగా ‘తల’ అయినా, తరువాతి הַשֵּׁנִי (‘రెండోవాడు’)తో ఉన్న సమాంతర నిర్మాణం ఇక్కడ క్రమంలో మొదటివాడనే భావాన్ని బలపరుస్తోంది; ‘ప్రధానుడు’ అనే సాధ్యార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: וְיִשִּׁיָּה
  choice: ఇష్షీయా
  rationale: సంయోజక అవ్యయాన్ని వాక్య నిర్మాణంలో వ్యక్తపరుస్తూ, హీబ్రూ పేరులోని ద్విత్వ ష్ ధ్వనిని నిలిపిన తెలుగు లిప్యంతరీకరణ.
- source_word: הַשֵּׁנִי
  choice: రెండోవాడు
  rationale: జాబితాలో రెండవ స్థానాన్ని సూచించే సాధారణ క్రమసంఖ్యావాచకం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త వంశావళి శైలిని పాటించాం. పేర్లను మూల హీబ్రూ ధ్వనులకు సమీపంగా ఉంచాం. ‘మొదటివాడు/రెండోవాడు’ అనే సమాంతర పదప్రయోగం సందర్భంలోని క్రమార్థాన్ని సహజంగా తెలియజేస్తుంది.
