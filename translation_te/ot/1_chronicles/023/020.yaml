  source_fidelity: హీబ్రూ వాక్యంలోని వంశావళి నిర్మాణం, ఉజ్జీయేలు, మీకా, ఇష్షీయా పేర్లు, అలాగే הָרֹאשׁ / הַשֵּׁנִי యొక్క సమాంతర క్రమసూచన సరిగ్గా ప్రతిఫలించాయి. ‘మొదటివాడు’ సందర్భానుసారంగా సముచితం; ‘ప్రధానుడు’ అనే సాధ్యార్థాన్ని పాదసూచిక భద్రపరుస్తోంది.
  naturalness: '‘ఉజ్జీయేలు కుమారులు: మీకా మొదటివాడు, ఇష్షీయా రెండోవాడు’ అనేది ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త వంశావళి జాబితాకు సహజమైన శైలి. రెండవ పేరుకు ముందున్న సంయోజకాన్ని తెలుగులో కామా-జాబితా ద్వారా సూచించడం అసహజం కాదు.'
