id: 1CH.23.12
reference: 1 Chronicles 23:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּנֵ֣י קְהָ֗ת עַמְרָ֥ם יִצְהָ֛ר חֶבְר֥וֹן וְ/עֻזִּיאֵ֖ל אַרְבָּעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/012.yaml
  text: 'The sons of Kohath: Amram, Izhar, Hebron, and Uzziel—four.'
translation:
  language: te
  text: 'కెహాతు కుమారులు: అమ్రాము, ఇశ్హారు, హెబ్రోను, ఉజ్జీయేలు—నలుగురు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: בן పదం యొక్క బహువచన నిర్మాణరూపం; ఇక్కడ వెంటనే నలుగురు వ్యక్తుల పేర్లు ఇవ్వబడినందున ‘కుమారులు’ అనే ప్రత్యక్ష అర్థమే సందర్భానికి సరిపోతుంది.
- source_word: קְהָת
  choice: కహాతు
  rationale: హీబ్రూ వ్యక్తిపేరుకు దగ్గరగా ఉండే, తెలుగులో సహజంగా పలికే లిప్యంతరీకరణ.
- source_word: עַמְרָם
  choice: అమ్రాము
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు బైబిలు పేర్ల శైలికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: יִצְהָר
  choice: ఇస్హారు
  rationale: హీబ్రూ పేరులోని ధ్వనులను సాధ్యమైనంత స్పష్టంగా ప్రతిబింబించే తెలుగు రూపం.
- source_word: חֶבְרוֹן
  choice: హెబ్రోను
  rationale: ఇతర సందర్భాల్లో స్థలపేరుగా కనిపించినా, ఇక్కడ వంశావళి జాబితాలో వ్యక్తిపేరు; అందువల్ల పేరుగానే లిప్యంతరీకరించాం.
- source_word: וְעֻזִּיאֵל
  choice: ఉజ్జీయేలు
  rationale: సంయోజక అవ్యయాన్ని తెలుగు జాబితా విరామ నిర్మాణం ద్వారా సహజంగా వ్యక్తం చేసి, పేరును హీబ్రూ ధ్వనులకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: אַרְבָּעָה
  choice: మొత్తం నలుగురు
  rationale: ఇది జాబితాలో పేర్కొన్న కుమారుల సంఖ్యను సంగ్రహిస్తుంది; వ్యక్తులను లెక్కిస్తున్నందున ‘నలుగురు’ అని, సంగ్రహ భావం స్పష్టపడేందుకు ‘మొత్తం’ అని ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి జాబితా శైలిని నిలిపాం. పేర్లను మూల హీబ్రూ ధ్వనులకు దగ్గరగా, తెలుగు పాఠకులకు చదవడానికి సహజంగా లిప్యంతరీకరించాం; వివరణ అవసరం లేకపోవడంతో పాదటిప్పణులు చేర్చలేదు.
