translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి/వ్యవస్థాపక జాబితా శైలిని నిలిపి, వ్యక్తి పేర్లను తెలుగు పఠనానికి అనుకూలంగా ఇచ్చాం.
