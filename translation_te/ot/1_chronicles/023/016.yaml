  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాయకుడు.”
    reason: హీబ్రూ רֹאשׁ పదానికి అక్షరార్థంగా ‘తల’ అనే భావం ఉన్నప్పటికీ, ఇక్కడ అది నాయకత్వం లేదా ముఖ్యస్థానాన్ని సూచించవచ్చు.
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: בֵּן పదం యొక్క బహువచన నిర్మాణరూపం; వంశావళి జాబితాలో నేరుగా ‘కుమారులు’ అని అనువదించడం సహజమూ మూలానికి సన్నిహితమూ.
- source_word: גֵרְשׁוֹם
  choice: గేర్షోము
  rationale: ఇక్కడి హీబ్రూ పేరు గేర్షోము; గేర్షోను కాదు. తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: שְׁבוּאֵל
  choice: షెబూయేలు
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా, సహజమైన తెలుగు రూపంలో లిప్యంతరీకరించబడింది.
- source_word: הָרֹאשׁ
  choice: ప్రధానుడు
  rationale: רֹאשׁ అనే పదం ఇక్కడ క్రమంలో మొదటివాడని మాత్రమే కాక, కుటుంబ లేదా పరిపాలనా విభాగంలో ముఖ్యస్థానం కలవాడని సూచించే బిరుదుగా ఉంది; ‘ప్రధానుడు’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
