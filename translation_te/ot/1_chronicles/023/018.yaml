lexical_decisions:
- source_word: בְּנֵי יִצְהָר
  choice: ఇష్హారు కుమారులలో
  rationale: בְּנֵי అనేది בֵּן పదానికి నిర్మాణ బహువచన రూపం. వంశావళి సందర్భంలో ‘ఇష్హారు కుమారులు’ అనే ప్రత్యక్ష భావాన్ని నిలుపుతూ, వెంట వచ్చే ఏకైక పేరును సహజమైన తెలుగులో అనుసంధానించడానికి ‘కుమారులలో’ అని ఇచ్చాం.
- source_word: שְׁלֹמִית
  choice: షెలోమీతు
  rationale: ఇది వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణకు దగ్గరగా ఆధునిక తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: הָרֹאשׁ
  choice: ప్రధానుడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న רֹאשׁ ఈ వంశావళి/వ్యవస్థాపక జాబితాలో నాయకత్వం లేదా ప్రథమ స్థానాన్ని సూచిస్తుంది. ‘ప్రధానుడు’ ఆధునిక తెలుగులో సహజంగా ఆ హోదాను తెలియజేస్తుంది; ‘శిరస్సు’ అనే అక్షరార్థం ఇక్కడ అసహజం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలిని పాటించాం. వ్యక్తి పేర్లను మూల హీబ్రూకు దగ్గరగా లిప్యంతరీకరించాం; మూలంలోని సంక్షిప్త నామవాక్యాన్ని తెలుగులో స్పష్టంగా ఉండేలా ‘కుమారులలో’ మరియు విధేయ హోదాకు తగిన లింగరూపంతో అందించాం.
