  text: 'The sons of Izhar: Shelomith the chief[a].'
translation:
  language: te
  text: 'యిష్హారు కుమారులు: షెలోమీతు ప్రధానుడు[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తలవాడు” లేదా “మొదటివాడు.”
