  text: וַֽ/יְהִי יַ֣חַת הָ/רֹ֔אשׁ וְ/זִיזָ֖ה הַ/שֵּׁנִ֑י וִ/יע֤וּשׁ וּ/בְרִיעָה֙ לֹֽא הִרְבּ֣וּ בָנִ֔ים וַ/יִּֽהְיוּ֙ לְ/בֵ֣ית אָ֔ב לִ/פְקֻדָּ֖ה אֶחָֽת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/011.yaml
  text: Jahath was the first and Zizah the second[a]; Jeush and Beriah did not have many sons[b], so they became one father’s house for one reckoning.
translation:
  language: te
  text: యహతు మొదటివాడు; జీజా రెండవవాడు[a]. యెయూషు, బెరీయాలకు ఎక్కువమంది కుమారులు లేరు. అందువల్ల వారు ఒకే లెక్కింపులో ఒకే పితృకుటుంబంగా పరిగణించబడ్డారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘జీజా’ అనే పేరును ‘జీజాహ్’ అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఒకే పితృకుటుంబంగా ఒకే విభాగానికి.” హీబ్రూ పదబంధం వారిని ఒకే పరిపాలనా ఘటకంగా లెక్కించినట్లు సూచిస్తుంది; ఇందులో లెక్కింపు, నమోదు, నియామకం, లేదా విభాగం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי יַחַת הָרֹאשׁ
  choice: యహతు మొదటివాడు
  rationale: ఇక్కడ היה సాధారణ అనుసంధాన క్రియగా ఉంది. רֹאשׁ తరువాతి ‘రెండవవాడు’తో జతగా రావడం వల్ల ‘ప్రధానుడు’ కంటే క్రమాన్ని సూచించే ‘మొదటివాడు’ సహజం.
- source_word: וְזִיזָה הַשֵּׁנִי
  choice: జీజా రెండవవాడు
  rationale: זִיזָה అనే పేరును తెలుగు ధ్వన్యనుకరణలో ‘జీజా’గా ఇచ్చి, ordinal הַשֵּׁנִיను ‘రెండవవాడు’గా అనువదించాం.
- source_word: וִיעוּשׁ וּבְרִיעָה
  choice: యెయూషు, బెరీయా
  rationale: హీబ్రూ వ్యక్తినామాలకు దగ్గరగా ఉండే, తెలుగులో చదవడానికి సహజమైన రూపాలు.
- source_word: לֹא הִרְבּוּ בָנִים
  choice: కుమారులు ఎక్కువమంది లేరు
  rationale: అక్షరార్థంగా ‘కుమారులను విస్తరింపజేయలేదు’; సందర్భంలో వారికి ఎక్కువమంది కుమారులు కలగలేదనే భావం. בָנִיםలోని పురుషలింగ సూచనను ‘కుమారులు’గా నిలిపాం.
- source_word: לְבֵית אָב
  choice: ఒకే పితృవంశ కుటుంబంగా
  rationale: בֵּית אָב అనేది కేవలం నివాసగృహం కాక, తండ్రి వంశం ఆధారంగా ఏర్పడిన కుటుంబ లేదా కుల పరిపాలనా ఘటకాన్ని సూచించే సాంకేతిక పదబంధం.
- source_word: לִפְקֻדָּה אֶחָת
  choice: ఒకే లెక్క కింద
  rationale: פְּקֻדָּה ఇక్కడ నియామకం, పర్యవేక్షణ, జనగణన లేదా పరిపాలనా లెక్క అనే భావపరిధి కలిగి ఉంది. ఈ వంశావళి-వ్యవస్థాపక సందర్భంలో ‘ఒకే లెక్క కింద’ అనే రూపం వారిని ఒక ఘటకంగా నమోదు చేసిన భావాన్ని సహజంగా తెలియజేస్తుంది.
