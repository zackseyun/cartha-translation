translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి సందర్భానికి తగిన గౌరవప్రదమైన సరళ శైలి వాడబడింది. ‘పితృవంశ కుటుంబం’ సాంకేతిక సామాజిక ఘటకాన్ని స్పష్టపరుస్తుంది; ‘ఒకే లెక్క కింద’ మూలంలోని పరిపాలనా అస్పష్టతను పూర్తిగా ఒకే భావానికి పరిమితం చేయకుండా ఉంచుతుంది.
