translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలి ఉపయోగించబడింది. వ్యక్తినామాలు హెబ్రీ రూపాలకు సమీపంగా లిప్యంతరీకరించబడ్డాయి; ‘పితృకుటుంబాలు’ అనే పదం మూలంలోని వంశాధారిత కుటుంబ నిర్మాణాన్ని నిలుపుతుంది.
