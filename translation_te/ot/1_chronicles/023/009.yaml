  text: בְּנֵ֣י שִׁמְעִ֗י שלמות וַ/חֲזִיאֵ֛ל וְ/הָרָ֖ן שְׁלֹשָׁ֑ה אֵ֛לֶּה רָאשֵׁ֥י הָ/אָב֖וֹת לְ/לַעְדָּֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/009.yaml
  text: 'The sons of Shimei: Shelomoth[a], Haziel, and Haran—three. These were the heads of the fathers’ houses of Ladan.'
translation:
  language: te
  text: 'షిమయి కుమారులు: షెలోమోతు[a], హజీయేలు, హారాను—ముగ్గురు. వీరు లాదాను వంశంలోని పితృకుటుంబాల పెద్దలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “షెలోమీతు”; ఇది ఈ పేరుకు ఉన్న సాధారణ ప్రత్యామ్నాయ లిప్యంతరీకరణ.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי שִׁמְעִי
  choice: షిమయి కుమారులు
  rationale: ఈ వంశావళిలో వెంటనే ముగ్గురు వ్యక్తుల పేర్లు ఇవ్వబడినందున, ‘సంతానం’ కంటే ‘కుమారులు’ సహజంగా, నిర్దిష్టంగా ఉంది.
- source_word: שלמות
  choice: షెలోమోతు
  rationale: మసొరేటిక్ స్వరచిహ్నాలతో ఉన్న రూపాన్ని అనుసరించిన తెలుగు లిప్యంతరీకరణ; ప్రత్యామ్నాయ రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: וַחֲזִיאֵל
  choice: హజీయేలు
  rationale: ఇక్కడి חֲזִיאֵל రూపాన్నే నేరుగా లిప్యంతరీకరించాం; వేరే చోట కనిపించే సంబంధిత నామరూపాన్ని దిగుమతి చేయలేదు.
- source_word: וְהָרָן
  choice: హారాను
  rationale: వ్యక్తినామాన్ని తెలుగు బైబిలు శైలికి సరిపోయేలా లిప్యంతరీకరించాం.
- source_word: שְׁלֹשָׁה
  choice: ముగ్గురు
  rationale: హెబ్రీ పాఠంలో పేర్లు చెప్పబడిన వారి మొత్తాన్ని ప్రత్యేకంగా సూచిస్తున్నందున సంఖ్యను స్పష్టంగా నిలిపాం.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: పితృకుటుంబాలకు పెద్దలు
  rationale: దినవృత్తాంతముల వంశపారంపర్య సందర్భంలో ఇది పితృవంశ ఆధారిత కుటుంబ విభాగాల నాయకులను సూచిస్తుంది; ఆధునిక తెలుగులో అర్థమయ్యేలా, మూలంలోని బంధుత్వ నిర్మాణాన్ని కాపాడే రూపం.
- source_word: לְלַעְדָּן
  choice: లాదాను పితృకుటుంబాలకు
  rationale: ל ఉపసర్గ ఇక్కడ లాదాను వంశానికి చెందిన కుటుంబ విభాగాలతో సంబంధాన్ని సూచిస్తుంది.
