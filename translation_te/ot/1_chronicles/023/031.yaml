source:
  edition: WLC
  text: וּ/לְ/כֹ֨ל הַעֲל֤וֹת עֹלוֹת֙ לַ/יהוָ֔ה לַ/שַּׁבָּת֔וֹת לֶ/חֳדָשִׁ֖ים וְ/לַ/מֹּעֲדִ֑ים בְּ/מִסְפָּ֨ר כְּ/מִשְׁפָּ֧ט עֲלֵי/הֶ֛ם תָּמִ֖יד לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/031.yaml
  text: and for all the burnt offerings offered to Yahweh on the Sabbaths[a], at the new moons, and at the appointed feasts, by number according to the ordinance concerning them, continually before Yahweh.
translation:
  language: te
  text: అలాగే, విశ్రాంతి దినాల్లో, అమావాస్యల్లో, నియమిత పండుగల్లో యాహ్వేకు దహనబలులన్నిటిని అర్పించడంలోనూ[a]—వాటికి వర్తించే నియమం ప్రకారం నిర్ణయించిన సంఖ్యలో—వారు యాహ్వే సన్నిధిలో నిరంతరం సేవ చేయాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరొక విధంగా: “యాహ్వేకు దహనబలులను పైకి అర్పించే కార్యమంతటిలోనూ.” హీబ్రూలో బలి అర్పించే కార్యాన్ని బలంగా వ్యక్తం చేయడానికి ‘పైకి అర్పించడం’ అనే క్రియానామంతో ‘దహనబలులు’ అనే నామవాచకాన్ని కలిపి వాడారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְכֹל הַעֲלוֹת עֹלוֹת
  choice: అలాగే … దహనబలులన్నిటిని అర్పించడంలోనూ
  rationale: וּלְכֹל మరో సేవా బాధ్యతను కలుపుతుంది. הַעֲלוֹת అనే క్రియానామం, עֹלוֹת అనే నామవాచకంతో కలిసి దహనబలులను పైకి అర్పించే బలి కార్యాన్ని సూచిస్తుంది; సహజమైన తెలుగులో క్రియాత్మకంగా అనువదించబడింది.
- source_word: עֹלוֹת
  choice: దహనబలులు
  rationale: బలిపీఠంపై పూర్తిగా దహనం చేసే బలికి వాడే స్థిరమైన ఆరాధనా పదం.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: ల ఉపసర్గ బలిని దేవునికి సమర్పించడాన్ని సూచిస్తుంది; יהוה అనే ఒడంబడిక నామాన్ని లిప్యంతరీకరించి ఇచ్చాం.
- source_word: לַשַּׁבָּתוֹת
  choice: విశ్రాంతి దినాల్లో
  rationale: ఇక్కడ ఉపసర్గ బలులు అర్పించే సందర్భాన్ని సూచిస్తుంది; హీబ్రూ బహువచనం నిలుపబడింది.
- source_word: לֶחֳדָשִׁים
  choice: అమావాస్యల్లో
  rationale: ఆరాధనా క్యాలెండర్ సందర్భంలో חֳדָשִׁים సాధారణ నెలలను కాక కొత్తచంద్ర దినాల ఆచరణలను సూచిస్తుంది.
- source_word: וְלַמּוֹעֲדִים
  choice: నియమిత పండుగల్లో
  rationale: מוֹעֲדִים దేవుడు నిర్ణయించిన పవిత్ర పండుగ సందర్భాలను సూచిస్తుంది; ‘నియమిత’ అనే పదం నిర్ణీత కాలమనే భావాన్ని నిలుపుతుంది.
- source_word: בְּמִסְפָּר
  choice: నిర్దేశించిన సంఖ్య
  rationale: అర్పించాల్సిన బలుల సంఖ్య ముందే నిర్ణయించబడిందనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: כְּמִשְׁפָּט עֲלֵיהֶם
  choice: వాటికి నిర్దేశించిన … విధానం ప్రకారం
  rationale: מִשְׁפָּט ఇక్కడ చట్టబద్ధంగా నిర్దేశించిన క్రమం లేదా విధానాన్ని సూచిస్తుంది. עֲלֵיהֶם యొక్క పూర్వపదం బలులు లేదా ఆయా సందర్భాలు కావచ్చనే స్వల్ప అస్పష్టతను ‘వాటికి’ నిలుపుతుంది.
- source_word: תָּמִיד
  choice: నిరంతరం
  rationale: ఆరాధనా సేవ క్రమం తప్పకుండా కొనసాగడాన్ని సూచిస్తుంది; ‘నిరంతరం’ హీబ్రూ పదంలోని కొనసాగింపు భావాన్ని నిలుపుతుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యాహ్వే సన్నిధిలో
  rationale: దేవుని సమక్షంలో జరిగే ఆరాధనా సేవను తెలుగులో సహజంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న నాలుగు అక్షరాల వ్యక్తిగత ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా, సాధారణంగా పునర్నిర్మించబడిన ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆరాధనా సందర్భానికి తగిన గౌరవప్రదమైన శైలి వాడబడింది. హీబ్రూ వాక్యం ముందు వచనాలపై వ్యాకరణపరంగా ఆధారపడుతున్నందున, తెలుగులో అర్థం పూర్తిగా ఉండేందుకు సందర్భంలో అంతర్లీనంగా ఉన్న కర్తను, సేవను ‘వారు … సేవ చేయాలి’ అని స్పష్టం చేశాం; కొత్త విధిని చేర్చలేదు.
