lexical_decisions:
- source_word: לַגֵּרְשֻׁנִּי
  choice: గేర్షోనీయులలో
  rationale: ల ఉపసర్గ ఇక్కడ లేవీయులలోని ఒక వర్గాన్ని పరిచయం చేస్తోంది. జాబితా సందర్భంలో ‘గేర్షోనీయులలో’ అనే రూపం సహజంగా ఉండి, సమూహార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לַעְדָּן
  choice: లాదాను
  rationale: ఇది వ్యక్తి పేరు కాబట్టి అనువదించకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: וְשִׁמְעִי
  choice: షిమీ
  rationale: వావ్ సంధి రెండు పేర్లను కలుపుతుంది; తెలుగులో జాబితా విరామచిహ్నంతో ఆ అనుసంధానం సహజంగా వ్యక్తమవుతుంది. వ్యక్తి పేరు హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
