  terminology: హెబ్రోను, యెరీయా, అమర్యా, యహజీయేలు, యెకమాము అనే పేర్ల లిప్యంతరీకరణలు స్థిరంగా ఉన్నాయి. ‘కుమారులు’ బְּנֵי కి ఈ సన్నిహిత వంశావళి సందర్భంలో సరైన ప్రత్యక్ష అనువాదం. పాదసూచికలో ‘ప్రధానుడు’ అనే సాధ్యమైన అర్థాన్ని పేర్కొనడం ద్వారా మూలపదంలోని విస్తృతిని అనవసర సిద్ధాంతపరమైన నిర్ణయం లేకుండా తెలియజేస్తుంది.
