  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలిని ఉపయోగించాం. వ్యక్తిపేర్లను హీబ్రూ రూపాలకు సమీపంగా లిప్యంతరీకరించాం; הָרֹאשׁ లోని పదశః అర్థాన్ని పాదసూచికలో నిలిపి, ప్రధాన పాఠ్యంలో సందర్భానుసారమైన క్రమార్థాన్ని ఇచ్చాం.
