  yaml_path: translation/ot/1_chronicles/023/019.yaml
  text: 'The sons of Hebron: Jeriah the first[a], Amariah the second, Jahaziel the third, and Jekameam the fourth.'
translation:
  language: te
  text: 'హెబ్రోను కుమారులు: మొదటివాడు[a] యెరీయా, రెండవవాడు అమర్యా, మూడవవాడు యహజీయేలు, నాలుగవవాడు యెకమాము.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో పదశః ‘తల’ లేదా ‘ప్రధానుడు’; అయితే ఇక్కడ ‘రెండవవాడు, మూడవవాడు, నాలుగవవాడు’ అనే వరుసకు సమాంతరంగా ‘మొదటివాడు’ అనే అర్థంలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי חֶבְרוֹן
  choice: హెబ్రోను కుమారులు
  rationale: ఇది వంశావళి జాబితాను పరిచయం చేసే నిర్మాణం. ఇక్కడ ప్రత్యక్ష సంతానాన్ని పేర్లతో పేర్కొంటున్నందున ‘కుమారులు’ అనేది సహజమైన, సూటియైన అనువాదం.
- source_word: יְרִיָּהוּ
  choice: యెరీయా
  rationale: హీబ్రూ వ్యక్తిపేరుకు తెలుగు ధ్వన్యనుకరణ.
- source_word: הָרֹאשׁ
  choice: మొదటివాడు
  rationale: పదశః ‘తల/ప్రధానుడు’ అని అర్థమయ్యే అవకాశం ఉన్నా, తరువాత వచ్చే ‘రెండవవాడు, మూడవవాడు, నాలుగవవాడు’ అనే క్రమసూచకాల సమాంతర నిర్మాణంలో ఇది ‘మొదటివాడు’గా పనిచేస్తోంది.
- source_word: אֲמַרְיָה
  choice: అమర్యా
  rationale: హీబ్రూ వ్యక్తిపేరుకు తెలుగు ధ్వన్యనుకరణ.
- source_word: הַשֵּׁנִי
  choice: రెండవవాడు
  rationale: జాబితాలో క్రమాన్ని సూచించే పుంలింగ ఏకవచన విశేషణం.
- source_word: יַחֲזִיאֵל
  choice: యహజీయేలు
  rationale: హీబ్రూ వ్యక్తిపేరుకు తెలుగు ధ్వన్యనుకరణ; పేరులోని దైవనామ సంబంధిత ‘యహ్’ ధ్వనిని నిలుపుతుంది.
- source_word: הַשְּׁלִישִׁי
  choice: మూడవవాడు
  rationale: జాబితాలో క్రమాన్ని సూచించే పుంలింగ ఏకవచన విశేషణం.
- source_word: וִיקַמְעָם
  choice: యెకమాము
  rationale: సంయోజక అవ్యయాన్ని తెలుగు జాబితా నిర్మాణంలో చివరి అంశానికి ముందు సహజంగా వ్యక్తం చేసి, పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా ధ్వన్యనుకరించాం.
- source_word: הָרְבִיעִי
  choice: నాలుగవవాడు
  rationale: జాబితాలో క్రమాన్ని సూచించే పుంలింగ ఏకవచన విశేషణం.
