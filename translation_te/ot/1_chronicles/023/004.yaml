source:
  edition: WLC
  text: מֵ/אֵ֗לֶּה לְ/נַצֵּ֨חַ֙ עַל מְלֶ֣אכֶת בֵּית יְהוָ֔ה עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָ֑לֶף וְ/שֹׁטְרִ֥ים וְ/שֹׁפְטִ֖ים שֵׁ֥שֶׁת אֲלָפִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/004.yaml
  text: Of these, twenty-four thousand were to oversee the work of the house of Yahweh, and six thousand were officers and judges.
translation:
  language: te
  text: వీరిలో ఇరవై నాలుగు వేలమంది యాహ్వే మందిరపు పనిని పర్యవేక్షించేందుకు నియమించబడ్డారు; ఆరు వేలమంది అధికారులు, న్యాయాధిపతులు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאֵלֶּה
  choice: వీరిలో
  rationale: మునుపు పేర్కొన్న లేవీయులలోని ఒక భాగాన్ని సూచించే מִן యొక్క విభాగార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְנַצֵּחַ
  choice: పర్యవేక్షించడానికి నియమించబడ్డారు
  rationale: పియేల్ క్రియారూపం ఇక్కడ సంగీత నాయకత్వాన్ని కాదు, పనిని పర్యవేక్షించడం లేదా నిర్వహించడం అనే భావాన్ని ఇస్తుంది. వాక్యంలోని నియామక భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేయడానికి ‘నియమించబడ్డారు’ చేర్చబడింది.
- source_word: עַל מְלֶאכֶת
  choice: పనిని
  rationale: מְלָאכָה పని, శ్రమ, విధి అనే విస్తృత భావం కలిగి ఉంది; మందిరానికి సంబంధించిన బాధ్యతలను అనవసరంగా కేవలం ఆరాధనా సేవకే పరిమితం చేయదు.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరపు
  rationale: בַּיִת యొక్క అక్షరార్థం ‘ఇల్లు’ అయినప్పటికీ, ఈ సందర్భంలో దేవాలయాన్ని సూచిస్తున్నందున ఆధునిక తెలుగులో ‘మందిరం’ సహజంగా, స్పష్టంగా ఉంటుంది. יהוה అనే దైవనామం ‘యెహోవా’గా లిప్యంతరీకరించబడింది.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: ఇరవై నాలుగు వేలమంది
  rationale: వ్యక్తుల సంఖ్య కావడంతో సంఖ్యను పదాలతో ఇచ్చి, తెలుగు వ్యాకరణానికి తగిన ‘మంది’ను జోడించింది.
- source_word: וְשֹׁטְרִים
  choice: అధికారులు
  rationale: שֹׁטֵר పరిపాలనా బాధ్యతగల అధికారి లేదా కార్యనిర్వాహకుడిని సూచిస్తుంది; ‘అధికారులు’ విస్తృతమైన, సహజమైన తెలుగు సమానం.
- source_word: וְשֹׁפְטִים
  choice: న్యాయాధిపతులు
  rationale: న్యాయనిర్ణయ విధిని నిర్వహించేవారిని నేరుగా, గౌరవప్రదమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: שֵׁשֶׁת אֲלָפִים
  choice: ఆరు వేలమంది
  rationale: మొదటి సంఖ్యతో శైలీ సమాంతరతను కాపాడుతూ వ్యక్తులను సూచించేందుకు ‘మంది’ను జోడించింది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ పాఠంలో ఒడంబడిక నామం ప్రత్యక్షంగా ఉంది. దానిని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచడం ద్వారా దైవనామ స్వభావాన్ని కాపాడింది; మూల ఉచ్చారణ పునర్నిర్మాణాన్ని ‘యాహ్వే’ మరింత దగ్గరగా ప్రతిబింబించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన పరిపాలనా శైలి వాడబడింది. హీబ్రూ వాక్యంలోని సంఖ్యా విభజనను సెమికోలన్ ద్వారా స్పష్టంగా చూపించింది; అనవసరమైన మతశాఖాపర పదజాలాన్ని నివారించింది.
