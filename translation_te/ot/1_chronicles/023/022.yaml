  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יָּ֨מָת֙ אֶלְעָזָ֔ר וְ/לֹא הָ֥יוּ ל֛/וֹ בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וַ/יִּשָּׂא֥וּ/ם בְּנֵי קִ֖ישׁ אֲחֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/022.yaml
  text: Eleazar died and had no sons[a], but only daughters; and the sons of Kish, their brothers[b], married them.
translation:
  language: te
  text: ఎలియాజరు చనిపోయాడు. అతనికి కుమారులు లేరు; కుమార్తెలు మాత్రమే ఉన్నారు. వారి సహోదరులైన[b] కీషు కుమారులు వారిని వివాహం చేసుకున్నారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘వారిని భార్యలుగా తీసుకున్నారు.’
    reason: lexical_alternative
  - marker: b
    text: ‘వారి సహోదరులు’ అనేది ఒకే తల్లిదండ్రులకు పుట్టిన సహోదరులను తప్పనిసరిగా సూచించకపోవచ్చు; సంబంధిత వంశశాఖకు చెందిన సమీప బంధువులను సూచించే అవకాశం ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: చనిపోయాడు
  rationale: מות అనే క్రియకు నేరమైన అర్థం ‘చనిపోవడం.’ ఇది సభ్యోక్తిని చేర్చకుండా మూలంలోని సూటితనాన్ని నిలుపుతుంది.
- source_word: אֶלְעָזָר
  choice: ఎలియాజరు
  rationale: తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణమైన లిప్యంతరీకరణ.
- source_word: וְלֹא הָיוּ לוֹ בָּנִים
  choice: అతనికి కుమారులు లేరు
  rationale: తరువాత ‘కుమార్తెలు’తో స్పష్టమైన వ్యత్యాసం ఉన్నందున בָּנִים ఇక్కడ సాధారణంగా ‘పిల్లలు’ కాక, ప్రత్యేకంగా ‘కుమారులు’ అని అర్థం.
- source_word: כִּי אִם בָּנוֹת
  choice: కుమార్తెలు మాత్రమే ఉన్నారు
  rationale: כִּי אִם ఇక్కడ మినహాయింపు-వ్యత్యాస భావాన్ని వ్యక్తం చేస్తుంది; ఈ తెలుగు రూపం సహజంగా ‘కుమార్తెలు మాత్రమే’ అనే భావాన్ని అందిస్తుంది.
- source_word: וַיִּשָּׂאוּם
  choice: వారిని వివాహం చేసుకున్నారు
  rationale: స్త్రీలను కర్మగా తీసుకున్న נשׂא ఈ సందర్భంలో వివాహం చేసుకోవడాన్ని సూచిస్తుంది. ఎంపిక చేసిన రూపం ఆధునిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: בְּנֵי קִישׁ
  choice: కీషు కుమారులు
  rationale: హెబ్రీ నిర్మాణంలోని వంశావళి సంబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: אֲחֵיהֶם
  choice: వారి సహోదరులు
  rationale: మూలంలోని ‘వారి సహోదరులు’ అనే బంధుత్వ పదాన్ని ‘బంధువులు’ అని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా నిలిపి, సందర్భానుగుణ వివరణను పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: אֲחֵיהֶם సూచించే బంధుత్వం
  choice: ప్రధాన పాఠ్యంలో ‘వారి సహోదరులు’ అని ఉంచడం
  alternative: ‘వారి సమీప బంధువులు’ అని అనువదించడం
  rationale: మూలపదం సహోదరులు అని ఉన్నప్పటికీ, వంశ-కుటుంబ సందర్భంలో అది సమీప కులబంధువులను సూచించే అవకాశం ఉంది. ప్రధాన పాఠ్యం మూలంలోని ఉద్రిక్తతను నిలుపుతుంది; పాదసూచిక సాంస్కృతిక సందర్భాన్ని వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి ఉపయోగించబడింది. వంశావళి ధోరణిని నిలుపుతూ, హెబ్రీ వాక్యనిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా సహజ తెలుగు వాక్యాలుగా విభజించబడింది. పాదసూచిక గుర్తులు అవి వివరిస్తున్న పదబంధాల వెంట ఉంచబడ్డాయి.
