language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֶּֽחָלְקֵ֥/ם דָּוִ֖יד מַחְלְק֑וֹת לִ/בְנֵ֣י לֵוִ֔י לְ/גֵרְשׁ֖וֹן קְהָ֥ת וּ/מְרָרִֽיס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/006.yaml
  text: 'David divided them into divisions for the sons of Levi: Gershon[a], Kohath, and Merari.'
translation:
  language: te
  text: 'దావీదు వారిని లేవి కుమారుల కొరకు విభాగాలుగా విభజించాడు: గెర్షోను, కెహాతు, మెరారీ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దావీదు వారిని లేవి కుమారులైన గెర్షోను, కెహాతు, మెరారీ వారి కొరకు విభాగాలుగా విభజించాడు.” హీబ్రూలో మొదటి పేరుకు ముందు ఉన్న לְ ఉపసర్గను జాబితా మొత్తానికి అన్వయించవచ్చు.
    reason: లְ ఉపసర్గ క్లాన్-జాబితాతో ఎలా అనుసంధానమవుతుందనే నిర్మాణాత్మక ప్రత్యామ్నాయాన్ని, అదనపు భావాన్ని చేర్చకుండా, భద్రపరుస్తుంది.
lexical_decisions:
- source_word: וַיֶּחָלְקֵם
  choice: వారిని ... విభజించాడు
  rationale: פיעל రూపంలోని חלק ఇక్కడ ‘విభజించు/వాటాలు చేయు’ అనే అర్థాన్ని ఇస్తుంది. 3వ పురుష బహువచన కర్మప్రత్యయం ఉన్నందున ‘వారిని’ స్పష్టంగా నిలుపబడింది.
- source_word: מַחְלְקוֹת
  choice: విభాగాలుగా
  rationale: ఈ నామవాచకం క్రమబద్ధమైన విభాగాలు లేదా వంతులను సూచిస్తుంది. క్రియతో కలిపి ఫలితార్థాన్ని సహజమైన తెలుగులో తెలియజేయడానికి ‘విభాగాలుగా’ వాడబడింది.
- source_word: לִבְנֵי לֵוִי
  choice: లేవి కుమారులైన
  rationale: హీబ్రూ వంశావళి వ్యక్తీకరణను నిలుపుతూ, తరువాత వచ్చే మూడు పేర్లతో సహజంగా అనుసంధానించే తెలుగు నిర్మాణం.
- source_word: לְגֵרְשׁוֹן קְהָת וּמְרָרִי
  choice: గేర్షోను, కహాతు, మెరారి వంశాల ప్రకారం
  rationale: మొదటి పేరుకు ఉన్న לְ ఉపసర్గను జాబితా మొత్తానికి వర్తింపజేస్తూ, సందర్భంలో ఇవి లేవీయ వంశ విభాగాలని స్పష్టం చేయడానికి ‘వంశాల ప్రకారం’ ఎంచుకోబడింది; దీనిలో స్వల్ప వివరణాత్మకత ఉన్నందున ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. వంశావళి నేపథ్యాన్ని నిలుపుతూ హీబ్రూ వాక్య నిర్మాణంలోని לְ సంబంధానికి ఉన్న స్వల్ప అస్పష్టతను పాదటిప్పణిలో భద్రపరచింది.
