id: 1CH.23.10
reference: 1 Chronicles 23:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֣י שִׁמְעִ֔י יַ֣חַת זִינָ֔א וִ/יע֖וּשׁ וּ/בְרִיעָ֑ה אֵ֥לֶּה בְנֵי שִׁמְעִ֖י אַרְבָּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/010.yaml
  text: 'And the sons of Shimei: Jahath[a], Zina, Jeush, and Beriah. These were the sons of Shimei—four.'
translation:
  language: te
  text: 'షిమీ కుమారులు: యహతు, జీనా[a], యెయూషు, బెరీయా. వీరు షిమీ కుమారులు—నలుగురు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని అనువాదాలు రెండో పేరును “జీజా” అని చదువుతాయి (1 దినవృత్తాంతాలు 23:11తో పోల్చండి); ఇక్కడి హీబ్రూ పాఠంలో “జీనా” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעִי
  choice: షిమీ కుమారులు
  rationale: వంశావళి జాబితాలో సహజమైన తెలుగు శీర్షికా నిర్మాణాన్ని వాడుతూ ‘కుమారులు’ అనే మూలార్థాన్ని నిలిపింది. ఆరంభ ו అనేది జాబితా అనుసంధానకం; తెలుగులో దాన్ని ప్రత్యేకంగా ‘మరియు’ అని పలకకపోవడం సహజం.
- source_word: יַחַת
  choice: యహతు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుకరణ పద్ధతిలో ఇచ్చింది.
- source_word: זִינָא
  choice: జీనా
  rationale: ఈ వచనంలోని హీబ్రూ రూపం జీనా అనే పఠనానికి మద్దతిస్తుంది; 23:11లోని భిన్న నామరూపాన్ని పాదటిప్పణిలో తెలిపింది.
- source_word: וִיעוּשׁ
  choice: యెయూషు
  rationale: వ్యక్తినామాన్ని హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించింది; ముందున్న సంధికారకాన్ని తెలుగు జాబితా నిర్మాణంలో విడిగా చూపలేదు.
- source_word: וּבְרִיעָה
  choice: బెరీయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు లిపిలో ధ్వన్యనుకరణ చేసింది; జాబితాలో చివరి పేరుకు ముందు సంధికారకాన్ని తెలుగులో తప్పనిసరిగా పునరుత్పత్తి చేయలేదు.
- source_word: אֵלֶּה בְנֵי שִׁמְעִי אַרְבָּעָה
  choice: వీరు షిమీ కుమారులు—నలుగురు
  rationale: మూలంలోని పునరుక్త సంగ్రహ నిర్మాణాన్ని నిలిపి, క్రియలేని హీబ్రూ వాక్యాన్ని సహజమైన తెలుగు నామవాక్యంగా అందించింది; సంఖ్యను స్పష్టంగా ఉంచింది.
