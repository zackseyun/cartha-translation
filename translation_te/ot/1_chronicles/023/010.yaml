  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన వంశావళి శైలిని అనుసరించింది. వ్యక్తినామాలు హీబ్రూ రూపాలకు సమీపంగా లిప్యంతరీకరించబడ్డాయి; మూలంలోని పునరుక్తి మరియు నలుగురు అనే మొత్తం నిలుపబడ్డాయి.
