source:
  edition: WLC
  text: כִּ֣י בְ/דִבְרֵ֤י דָוִיד֙ הָ/אַ֣חֲרֹנִ֔ים הֵ֖מָּה מִסְפַּ֣ר בְּנֵי לֵוִ֑י מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וּ/לְ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/027.yaml
  text: For by the last words of David[a], the sons of Levi were numbered from twenty years old and upward.
translation:
  language: te
  text: ఎందుకంటే దావీదు చివరి మాటల ఆధారంగా[a], ఇరవై సంవత్సరాల వయసు నుండి పైబడిన లేవి కుమారులు లెక్కించబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దావీదు చివరి మాటల ప్రకారం.” ఈ లెక్కింపు దావీదు తుదికాలపు నిర్దేశాన్ని ఆధారంగా చేసుకొని జరిగిందని హీబ్రూ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి వివరణను పరిచయం చేసే కారణార్థక అనుసంధానాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: בְּדִבְרֵי דָוִיד הָאַחֲרֹנִים
  choice: దావీదు చివరి ఆదేశాల ప్రకారం
  rationale: בְּ ఇక్కడ ఆధారాన్ని సూచించవచ్చు; דִּבְרֵי పదానికి అక్షరార్థంగా ‘మాటలు’ అనిపించినా, సందర్భంలో లెక్కింపుకు ఆధారమైన దావీదు చివరి నిర్దేశాలు అనే భావం సహజంగా సరిపోతుంది. మూలంలోని సాధనార్థం/ఆధారార్థం సందిగ్ధతను పాదటిప్పణిలో ఉంచాం.
- source_word: הָאַחֲרֹנִים
  choice: చివరి
  rationale: దావీదు జీవితాంతంలోని లేదా తుదిదశలోని మాటలు/ఆదేశాలు అనే భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: הֵמָּה מִסְפַּר
  choice: లెక్కించబడ్డారు
  rationale: హీబ్రూ ప్రయోగం సంక్షిప్తంగా, కొంత అధ్యాహారంగా ఉంది; సందర్భంలో జనగణనలో చేర్చి లెక్కించడం అనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: בְּנֵי לֵוִי
  choice: లేవి కుమారులు
  rationale: వంశావళి సంబంధమైన మూల వ్యక్తీకరణను దగ్గరగా నిలుపుతుంది; ఇది సమూహంగా లేవీయులను సూచిస్తుంది.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וּלְמַעְלָה
  choice: ఇరవై ఏళ్ల వయసు మొదలుకొని అంతకంటే ఎక్కువ వయసున్నవారిగా
  rationale: ఇరవై ఏళ్ల కనిష్ఠ వయోపరిమితితో పాటు దానికంటే పై వయసులన్నిటినీ చేర్చే హీబ్రూ వయస్సు సూత్రాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
