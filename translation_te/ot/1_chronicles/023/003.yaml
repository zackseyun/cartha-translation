source:
  edition: WLC
  text: וַ/יִּסָּֽפְרוּ֙ הַ/לְוִיִּ֔ם מִ/בֶּ֛ן שְׁלֹשִׁ֥ים שָׁנָ֖ה וָ/מָ֑עְלָ/ה וַ/יְהִ֨י מִסְפָּרָ֤/ם לְ/גֻלְגְּלֹתָ/ם֙ לִ/גְבָרִ֔ים שְׁלֹשִׁ֥ים וּ/שְׁמוֹנָ֖ה אָֽלֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/003.yaml
  text: The Levites were counted from thirty years old and upward[a], and their number by heads, man by man, was thirty-eight thousand.
translation:
  language: te
  text: ముప్పై సంవత్సరాల వయసు నుంచీ పైబడిన లేవీయులను లెక్కించారు. ఒక్కొక్కరి చొప్పున లెక్కించిన పురుషుల సంఖ్య ముప్పై ఎనిమిది వేలు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘వారి తలల చొప్పున, పురుషులుగా’; ఇది పురుషులను ఒక్కొక్కరిగా లెక్కించారని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּפְרוּ
  choice: లెక్కించారు
  rationale: హీబ్రూ నిఫాల్ రూపం లేవీయులు లెక్కించబడినవారని సూచిస్తుంది. తెలుగులో కర్తను పేర్కొనని ‘లెక్కించారు’ అనే ప్రయోగం ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: הַלְוִיִּם
  choice: లేవీయులను
  rationale: లేవి గోత్రానికి చెందినవారిని సూచించే స్థిరమైన తెలుగు బైబిలు నామరూపం.
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמָעְלָה
  choice: ముప్పై సంవత్సరాల వయసు మొదలుకొని అంతకంటే ఎక్కువ వయసుగల
  rationale: లెక్కింపులో చేర్చే కనిష్ఠ వయోపరిమితిని స్పష్టంగా, ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיְהִי מִסְפָּרָם
  choice: వారి సంఖ్య ... వేలు
  rationale: మొత్తం సంఖ్యను పరిచయం చేసే హీబ్రూ వాక్యభాగాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: לְגֻלְגְּלֹתָם
  choice: తలలవారీగా
  rationale: ‘వారి తలల చొప్పున’ అనే హీబ్రూ నుడికారంలోని దృశ్యరూపాన్ని నిలుపుతూ, వ్యక్తిగత లెక్కింపును సూచిస్తుంది.
- source_word: לִגְבָרִים
  choice: పురుషులను లెక్కించినప్పుడు
  rationale: లెక్కింపులో చేర్చబడినవారు పురుషులని స్పష్టంగా తెలియజేస్తూ, ముందున్న ‘తలలవారీగా’ అనే పదబంధంతో సహజంగా కలుస్తుంది.
- source_word: שְׁלֹשִׁים וּשְׁמוֹנָה אָלֶף
  choice: ముప్పై ఎనిమిది వేలు
  rationale: హీబ్రూ మూలంలోని మొత్తం సంఖ్యకు నేరమైన తెలుగు అనువాదం.
