translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. నిఫాల్ క్రియను తెలుగులో అసహజమైన కర్మణి రూపంతో కాకుండా, కర్తను పేర్కొనని క్రియారూపంతో అందించాం. హీబ్రూ లెక్కింపు నుడికారాన్ని ప్రధాన పాఠంలో కొంతవరకు నిలిపి, దాని అక్షరార్థాన్ని పాదసూచికలో వివరించాం.
