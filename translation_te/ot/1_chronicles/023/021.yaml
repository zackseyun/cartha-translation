translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన వంశావళి శైలి. మూలంలోని రెండు సమాంతర జాబితా శీర్షికలను నిలిపి ఉంచి, తెలుగులో సహజంగా ఉండేందుకు పేర్ల మధ్య కామాలను ఉపయోగించాం.
