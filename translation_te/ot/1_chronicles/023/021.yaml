source:
  edition: WLC
  text: בְּנֵ֤י מְרָרִי֙ מַחְלִ֣י וּ/מוּשִׁ֔י בְּנֵ֥י מַחְלִ֖י אֶלְעָזָ֥ר וְ/קִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/021.yaml
  text: 'The sons of Merari: Mahli and Mushi. The sons of Mahli: Eleazar and Kish.'
translation:
  language: te
  text: 'మెరారీ కుమారులు: మహ్లీ, మూషీ. మహ్లీ కుమారులు: ఎలియాజరు, కీషు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది వంశావళి జాబితాను పరిచయం చేసే בֵּן పదపు బహువచన నిర్మిత రూపం. ఇక్కడ పేర్లు ప్రత్యక్ష కుమారులుగా ఇవ్వబడినందున ‘కుమారులు’ సహజమైన, సూటియైన అనువాదం.
- source_word: מְרָרִי
  choice: మెరారి
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: מַחְלִי
  choice: మహలి
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించాం; వచనంలో వచ్చిన రెండు చోట్లా ఒకే రూపాన్ని ఉంచాం.
- source_word: וּמוּשִׁי
  choice: మూషి
  rationale: సంధికారకంతో కూడిన వ్యక్తి పేరు. తెలుగు జాబితా నిర్మాణంలో విరామచిహ్నం ద్వారా అనుసంధానం స్పష్టంగా ఉన్నందున పేరును సహజంగా ఇచ్చాం.
- source_word: בְּנֵי מַחְלִי
  choice: మహలి కుమారులు
  rationale: హీబ్రూ వంశావళి నిర్మాణాన్ని స్పష్టంగా పునరావృతం చేస్తూ, తెలుగులో సహజమైన పదక్రమాన్ని ఉపయోగించాం.
- source_word: אֶלְעָזָר
  choice: ఎలియాజరు
  rationale: వ్యక్తి పేరును ప్రాచుర్యంలో ఉన్న తెలుగు బైబిలు రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: וְקִישׁ
  choice: కీషు
  rationale: సంధికారకంతో కూడిన రెండవ వ్యక్తి పేరు; దానిని తెలుగు ఉచ్చారణకు అనువైన రూపంలో లిప్యంతరీకరించాం.
