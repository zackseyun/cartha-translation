translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వంశావళి శైలిని ఉపయోగించాం. హీబ్రూ הָרֹאשׁ లోని పెద్దవాడు/ముఖ్యుడు అనే సందిగ్ధతను ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా పరిరక్షించాం.
