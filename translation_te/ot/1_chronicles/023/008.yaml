source:
  edition: WLC
  text: בְּנֵ֣י לַעְדָּ֗ן הָ/רֹ֧אשׁ יְחִיאֵ֛ל וְ/זֵתָ֥ם וְ/יוֹאֵ֖ל שְׁלֹשָֽׁה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/008.yaml
  text: 'The sons of Ladan: Jehiel the head[a], and Zetham and Joel—three.'
translation:
  language: te
  text: 'లాదాను కుమారులు: ప్రధానుడైన యెహీయేలు[a], జేతాము, యోవేలు—మొత్తం ముగ్గురు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పెద్దవాడు” లేదా “నాయకుడు.” హీబ్రూ పదం యెహీయేలు కుటుంబంలో ప్రముఖుడని లేదా మొదటివాడని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది ‘కుమారులు’ అనే పదానికి సంబంధరూప బహువచనం. ఇక్కడ వెంటనే ముగ్గురు పేర్లు ఇవ్వబడుతున్నందున ‘వారసులు’ కంటే ‘కుమారులు’ సహజంగా, నేరుగా సరిపోతుంది.
- source_word: לַעְדָּן
  choice: లాదాను
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הָרֹאשׁ
  choice: పెద్దవాడైన
  rationale: ఈ పదానికి అక్షరార్థంగా ‘తల/ముఖ్యుడు’ అనే భావం ఉంది. వంశావళి జాబితాలో ఇది కుటుంబంలో ముందున్నవాడు లేదా పెద్దవాడు అనే భావాన్ని సూచించవచ్చు; అధికారిక పదవిని అనవసరంగా సూచించకుండా సహజమైన తెలుగు కోసం ‘పెద్దవాడైన’ ఎంచుకున్నాం, అసలు పదంలోని ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: יְחִיאֵל
  choice: యెహీయేలు
  rationale: హీబ్రూ వ్యక్తిపేరుకు తెలుగు బైబిలు సంప్రదాయానికి అనుగుణమైన లిప్యంతరీకరణ.
- source_word: וְזֵתָם
  choice: జేతాము
  rationale: సంయోజక అవ్యయంతో ఉన్న వ్యక్తిపేరు; తెలుగు జాబితా నిర్మాణంలో సంయోజకాన్ని ప్రతి పేరుముందు పునరావృతం చేయకుండా సహజంగా అందించాం.
- source_word: וְיוֹאֵל
  choice: యోవేలు
  rationale: హీబ్రూ వ్యక్తిపేరుకు తెలుగు బైబిలు సంప్రదాయానికి అనుగుణమైన లిప్యంతరీకరణ.
- source_word: שְׁלֹשָׁה
  choice: మొత్తం ముగ్గురు
  rationale: పేర్ల సంఖ్యను సంక్షిప్తంగా నిర్ధారించే మూలపాఠంలోని సంఖ్యను తెలుగులో స్పష్టంగా నిలిపాం.
