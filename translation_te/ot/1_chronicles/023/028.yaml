id: 1CH.23.28
reference: 1 Chronicles 23:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֣י מַעֲמָדָ֞/ם לְ/יַד בְּנֵ֣י אַהֲרֹ֗ן לַ/עֲבֹדַת֙ בֵּ֣ית יְהוָ֔ה עַל הַ/חֲצֵרוֹת֙ וְ/עַל הַ/לְּשָׁכ֔וֹת וְ/עַֽל טָהֳרַ֖ת לְ/כָל קֹ֑דֶשׁ וּ/מַֽעֲשֵׂ֔ה עֲבֹדַ֖ת בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/028.yaml
  text: For their duty was to assist the sons of Aaron in the service of the house of Yahweh, concerning the courts and the chambers, and the purification of all that is holy, and the work of the service of the house of God.
translation:
  language: te
  text: ఎందుకంటే, యహ్వే మందిర సేవలో అహరోను కుమారులకు తోడుగా ఉండటం[b], ప్రాంగణాలకూ గదులకూ బాధ్యత వహించడం, ప్రతి పవిత్రమైన దాని శుద్ధీకరణను చూడటం[c], దేవుని మందిర సేవకు సంబంధించిన పనిని చేయడం—ఇవన్నీ వారి నియమిత బాధ్యతగా[a] ఉండేవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారి నియమిత స్థానం’ లేదా ‘వారి పదవి.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘అహరోను కుమారుల చేతి వద్ద’; అంటే, వారికి తోడుగా ఉండి సహాయం చేయడం.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘ప్రతి పవిత్ర వస్తువు శుద్ధీకరణ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న సందర్భంలో లేవీయుల నియామకానికి వివరణను పరిచయం చేసే కారణార్థక సంధానంగా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: מַעֲמָדָם
  choice: వారి నియమిత బాధ్యత
  rationale: ఈ పదం వారికి కేటాయించిన స్థానం లేదా సేవా నియామకాన్ని సూచిస్తుంది; ఆలయసేవ సందర్భంలో ‘నియమిత బాధ్యత’ దాని కార్యపరమైన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: לְיַד בְּנֵי אַהֲרֹן
  choice: అహరోను కుమారులకు సహాయం చేయడం
  rationale: అక్షరార్థంగా ‘అహరోను కుమారుల చేతి దగ్గర’ అనే భావం ఉన్నా, ఇక్కడ యాజకులకు తోడుగా సేవ చేయడాన్ని సూచించే హీబ్రూ నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: לַעֲבֹדַת בֵּית יְהוָה
  choice: యహ్వే మందిర సేవలో
  rationale: עֲבֹדָה ఇక్కడ ఆరాధనాసంబంధ ఆలయసేవను సూచిస్తుంది; ‘మందిర సేవ’ ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ధ్వన్యనువాదం చేస్తుంది.
- source_word: עַל הַחֲצֵרוֹת וְעַל הַלְּשָׁכוֹת
  choice: ప్రాంగణాలు, గదులు ... వారి బాధ్యతలో
  rationale: עַל ఇక్కడ కేవలం స్థలాన్ని కాక బాధ్యతా పరిధిని సూచిస్తుంది. ‘బాధ్యతలో’ అనే నిర్మాణం ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: וְעַל טָהֳרַת לְכָל קֹדֶשׁ
  choice: పవిత్రమైన ప్రతిదాని శుద్ధీకరణ
  rationale: కర్మకాండ సంబంధ శుద్ధిని, అలాగే קֹדֶשׁ యొక్క సమష్టి భావాన్ని, నిర్దిష్ట వస్తువులను అదనంగా ఊహించకుండా నిలుపుతుంది.
- source_word: וּמַעֲשֵׂה עֲבֹדַת בֵּית הָאֱלֹהִים
  choice: దేవుని మందిర సేవకు సంబంధించిన పనులు
  rationale: హీబ్రూలోని ‘పని—సేవ’ అనే జత భావాన్ని తెలుగులో భారంగా కాకుండా, సేవకు సంబంధించిన కార్యాలన్నింటినీ సూచించేలా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలపాఠంలో దైవనామం ప్రత్యక్షంగా ఉంది; దానిని బిరుదుగా మార్చకుండా సాధారణంగా అంగీకరించబడిన ఉచ్చారణకు దగ్గరగా ధ్వన్యనువాదం చేయబడింది.
- issue: לְיַד בְּנֵי אַהֲרֹן లో లేవీయులకు, అహరోను వంశ యాజకులకు మధ్య సంబంధం
  choice: అహరోను కుమారులకు సహాయం చేయడం
  alternative: అహరోను కుమారుల పక్కన ఉండడం / వారి ఆధీనంలో ఉండడం
  rationale: మూల నుడికారం సహాయక సేవా సంబంధాన్ని తెలియజేస్తుంది; అధికార క్రమం గురించి మూలం చెప్పేదానికంటే బలమైన సిద్ధాంతార్థాన్ని చేర్చకుండా ‘సహాయం’ అని అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆలయసేవా శైలిని అనుసరించాం. పొడవైన హీబ్రూ పరిపాలనా వాక్యాన్ని స్పష్టత కోసం రెండు తెలుగు వాక్యాలుగా విభజించినా, బాధ్యతల జాబితా మరియు వాటి పరస్పర సంబంధం నిలుపబడ్డాయి.
