revisions:
- from: ఎందుకంటే, యహ్వే మందిర సేవలో అహరోను కుమారులకు సహాయం చేయడం[b] వారి నియమిత బాధ్యతగా[a] ఉండేది. ప్రాంగణాలు, గదులు, పవిత్రమైన ప్రతిదాని శుద్ధీకరణ[c], దేవుని మందిర సేవకు సంబంధించిన పనులు వారి బాధ్యతలో ఉండేవి.
  to: ఎందుకంటే, యహ్వే మందిర సేవలో అహరోను కుమారులకు తోడుగా ఉండటం[b], ప్రాంగణాలకూ గదులకూ బాధ్యత వహించడం, ప్రతి పవిత్రమైన దాని శుద్ధీకరణను చూడటం[c], దేవుని మందిర సేవకు సంబంధించిన పనిని చేయడం—ఇవన్నీ వారి నియమిత బాధ్యతగా[a] ఉండేవి.
  rationale: 'The revision keeps the source’s one-clause structure: the appointed duty encompasses assisting Aaron’s sons in Yahweh’s temple service and responsibility for the courts, chambers, purification of every holy thing, and the work of God’s temple service. ‘తోడుగా ఉండటం’ reflects the relational force of לְיַד without importing a stronger hierarchical claim; the footnote supplies the assistance sense. The divine-name distinction in the Hebrew is retained: יְהוָה as యహ్వే and הָאֱלֹהִים as దేవుడు.'
