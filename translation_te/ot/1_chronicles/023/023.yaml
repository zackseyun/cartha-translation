  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: בְּנֵ֣י מוּשִׁ֗י מַחְלִ֥י וְ/עֵ֛דֶר וִ/ירֵמ֖וֹת שְׁלֹשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/023.yaml
  text: 'The sons of Mushi: Mahli[a], Eder, and Jeremoth—three.'
translation:
  language: te
  text: 'మూషీ కుమారులు: మహ్లీ, ఏదెరు, యెరేమోతు—ముగ్గురు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది ‘కుమారుడు’ అనే పదం యొక్క నిర్మాణ బహువచనం; వెంటనే ముగ్గురు వ్యక్తుల పేర్లు వస్తున్నందున ‘సంతతివారు’ కంటే ‘కుమారులు’ ప్రత్యక్షంగా, సహజంగా ఉంది.
- source_word: מוּשִׁי
  choice: మూషీ
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపానికి దగ్గరగా తెలుగు లిప్యంతరీకరణ చేయబడింది.
- source_word: מַחְלִי
  choice: మహలీ
  rationale: వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణను సహజమైన తెలుగు రూపంలో లిప్యంతరీకరించింది.
- source_word: וְעֵדֶר
  choice: ఏదెరు
  rationale: సంయోజక అవ్యయంతో కూడిన వ్యక్తి పేరు; తెలుగు జాబితా నిర్మాణంలో సంయోజనాన్ని విరామచిహ్నాల ద్వారా సహజంగా వ్యక్తం చేసింది.
- source_word: וִירֵמוֹת
  choice: యెరేమోతు
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపాన్ని ఆధారంగా తీసుకొని తెలుగులో సహజంగా పలికే విధంగా లిప్యంతరీకరించింది.
- source_word: שְׁלֹשָׁה
  choice: ముగ్గురు
  rationale: జాబితాలో పేర్కొన్న పురుష వ్యక్తుల మొత్తాన్ని తెలిపే సంఖ్య; వ్యక్తులకు తగిన తెలుగు సంఖ్యారూపం ‘ముగ్గురు’ ఉపయోగించబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలి పాటించబడింది. హీబ్రూ మూలంలోని జాబితా-తరువాత-మొత్తం నిర్మాణాన్ని దీర్ఘ విరామచిహ్నంతో నిలిపింది. ఆంగ్ల అనువాద సంప్రదాయంలోని Jeremoth/Jerimoth అక్షరరూప భేదం తెలుగులో మూలపాఠానికి సంబంధించిన భేదం కానందున పాదసూచికగా చేర్చలేదు.
