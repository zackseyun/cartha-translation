  rationale: 'A single orthographic correction changes “మహలీ” to “మహ్లీ” for closer fidelity to the Hebrew personal name. No footnote is needed: the English Jeremoth/Jerimoth spelling note reflects English transliteration tradition rather than a Hebrew textual ambiguity requiring a Telugu note.'
