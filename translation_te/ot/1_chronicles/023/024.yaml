source:
  edition: WLC
  text: אֵ֣לֶּה בְנֵֽי לֵוִי֩ לְ/בֵ֨ית אֲבֹתֵי/הֶ֜ם רָאשֵׁ֧י הָ/אָב֣וֹת לִ/פְקוּדֵי/הֶ֗ם בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם עֹשֵׂה֙ הַ/מְּלָאכָ֔ה לַ/עֲבֹדַ֖ת בֵּ֣ית יְהוָ֑ה מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/024.yaml
  text: These were the sons of Levi by their fathers’ houses[a], the heads of the fathers’ houses, according to those counted of them, by the number of names, head by head, doing the work for the service of the house of Yahweh, from twenty years old and upward.
translation:
  language: te
  text: వీరు తమ పితృకుటుంబాల ప్రకారం లేవి కుమారులు, పితృకుటుంబాల నాయకులు. వారి లెక్కింపు ప్రకారం, పేర్ల సంఖ్యను బట్టి, తలతలగా[a] లెక్కించబడినవారు యాహ్వే మందిర సేవలో పని చేసేవారు; వారు ఇరవై సంవత్సరాల వయస్సు నుండి అంతకంటే పైబడినవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘వారి కపాలాల/తలల చొప్పున’; అంటే ప్రతి వ్యక్తినీ విడివిడిగా లెక్కించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: తమ పితృవంశాల ప్రకారం
  rationale: ఇశ్రాయేలు వంశంలోని పితృకుటుంబ విభాగాల ప్రకారం వర్గీకరణను సూచిస్తుంది. ఆధునిక తెలుగులో ‘పితృవంశాలు’ సంక్షిప్తంగానూ స్పష్టంగానూ ఉంది.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: పితృవంశాల పెద్దలు
  rationale: అక్షరార్థంగా ‘పితరుల పెద్దలు’; సందర్భంలో కుటుంబ వంశాలకు నాయకత్వం వహించిన ప్రతినిధులను సూచిస్తుంది.
- source_word: לִפְקוּדֵיהֶם
  choice: వారిలో లెక్కించబడినవారు
  rationale: פקד పదంలోని జనగణన/నమోదు భావాన్ని, లెక్కించబడిన వ్యక్తులతో దాని సంబంధాన్ని నిలుపుతుంది.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: పేర్ల సంఖ్య ప్రకారం
  rationale: పేర్లతో కూడిన అధికారిక లెక్క లేదా పట్టికను సూచించే హెబ్రీ జనగణన పదబంధానికి సమీపమైన అనువాదం.
- source_word: לְגֻלְגְּלֹתָם
  choice: తలతలగా
  rationale: అక్షరార్థంగా ‘వారి కపాలాల/తలల చొప్పున’; ప్రతి వ్యక్తిని విడివిడిగా లెక్కించారనే నుడికారాన్ని, మూలంలోని తల రూపకాన్ని నిలుపుతూ తెలియజేస్తుంది.
- source_word: עֹשֵׂה הַמְּלָאכָה
  choice: పని చేసేవారు
  rationale: ఏకవచన కృదంతం సమూహార్థంగా లెక్కించబడిన లేవీయులను సూచిస్తుంది; తెలుగు బహువచన రూపం సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: לַעֲבֹדַת בֵּית יְהוָה
  choice: యాహ్వే మందిర సేవకు
  rationale: ఆరాధన సంబంధమైనదీ ఆచరణాత్మకమైనదీ అయిన సేవను ‘సేవ’ విస్తృతంగా సూచిస్తుంది; ‘మందిరం’ ఈ సందర్భంలోని దేవుని గృహ భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ‘Yahweh’ ఉచ్చారణకు అనుగుణంగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: ఇరవై సంవత్సరాలు మొదలుకొని అంతకంటే ఎక్కువ వయసున్నవారు
  rationale: సేవకు కనీస వయస్సు ఇరవై సంవత్సరాలని స్పష్టమైన, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠం దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ దానిని బిరుదుగా మార్చకుండా వ్యక్తిగత నామంగా నిలుపుతుంది; ఏ ప్రత్యేక సంప్రదాయ వ్యాఖ్యానాన్నీ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. మూలంలోని జనగణన పదబంధాల పునరుక్తి పూర్తిగా తొలగించకుండా, తెలుగు వాక్యాన్ని చదవదగిన మూడు భాగాలుగా విభజించాం.
