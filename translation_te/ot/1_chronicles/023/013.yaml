  to: 'అమ్రాము కుమారులు: అహరోను, మోషే. అహరోను వేరుగా నియమించబడ్డాడు—అతన్ని అత్యంత పరిశుద్ధునిగా[a] ప్రతిష్ఠించడానికి; అతడూ అతని కుమారులూ శాశ్వతంగా యహ్వే సన్నిధిలో ధూపార్పణ చేయడానికి, ఆయనకు సేవచేయడానికి, ఆయన నామంలో దీవించడానికి.'
  rationale: మూలంలోని ఏకవచన ‘అతన్ని’ని అహరోనుకు సూచనగా నిలిపి, ‘అతడూ అతని కుమారులూ శాశ్వతంగా’ అనే భాగాన్ని తరువాతి మూడు యాజక కార్యాలతో నేరుగా అనుసంధానించాం. మూలంలో లేని ‘నియమించబడ్డారు’ అనే రెండవ క్రియను తొలగించాం. పాదటిప్పణి అర్థం, గుర్తు రెండూ సరైనవే కాబట్టి నిలిపాం.
