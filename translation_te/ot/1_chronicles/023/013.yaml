source:
  edition: WLC
  text: בְּנֵ֥י עַמְרָ֖ם אַהֲרֹ֣ן וּ/מֹשֶׁ֑ה וַ/יִּבָּדֵ֣ל אַהֲרֹ֡ן לְֽ/הַקְדִּישׁ/וֹ֩ קֹ֨דֶשׁ קָֽדָשִׁ֤ים הֽוּא וּ/בָנָי/ו֙ עַד עוֹלָ֔ם לְ/הַקְטִיר֩ לִ/פְנֵ֨י יְהוָ֧ה לְ/שָׁרְת֛/וֹ וּ/לְ/בָרֵ֥ךְ בִּ/שְׁמ֖/וֹ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/013.yaml
  text: 'The sons of Amram: Aaron and Moses. And Aaron was set apart[a], he and his sons forever, to sanctify him as most holy, to burn incense before Yahweh, to minister to him, and to bless in his name forever.'
translation:
  language: te
  text: 'అమ్రాము కుమారులు: అహరోను, మోషే. అహరోను వేరుగా నియమించబడ్డాడు—అతన్ని అత్యంత పరిశుద్ధునిగా[a] ప్రతిష్ఠించడానికి; అతడూ అతని కుమారులూ శాశ్వతంగా యహ్వే సన్నిధిలో ధూపార్పణ చేయడానికి, ఆయనకు సేవచేయడానికి, ఆయన నామంలో దీవించడానికి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘పరిశుద్ధతల పరిశుద్ధత.’ ఇది అత్యున్నత స్థాయిని తెలిపే పదబంధం; అంటే ‘అత్యంత పరిశుద్ధమైనవాడు.’
    reason: హీబ్రూ అతిశయ నిర్మాణాన్ని, దాని అక్షరార్థ ప్రత్యామ్నాయాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: בְּנֵי עַמְרָם
  choice: అమ్రాము కుమారులు
  rationale: ఇక్కడ వెంటనే అహరోను, మోషే పేర్లు రావడం వల్ల ‘సంతానం’ అనే విస్తృతార్థం కంటే ‘కుమారులు’ అనే ప్రత్యక్షార్థం సరిపోతుంది.
- source_word: וַיִּבָּדֵל
  choice: ప్రత్యేకంగా ఉంచబడ్డాడు
  rationale: ప్రత్యేకమైన పవిత్ర సేవ కోసం వేరుచేయబడడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְהַקְדִּישׁוֹ
  choice: అతన్ని ... ప్రతిష్ఠించడానికి
  rationale: హిఫిల్ రూపంలోని ‘పవిత్రపరచడం/ప్రతిష్ఠించడం’ భావాన్ని, ఏకవచన పురుష కర్మప్రత్యయాన్ని నిలుపుతుంది; ‘అతన్ని’ అహరోనును సూచిస్తుంది.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: అత్యంత పరిశుద్ధునిగా
  rationale: హీబ్రూ పదబంధం అత్యున్నత స్థాయిని తెలిపే నిర్మాణం; ఇక్కడ స్థలాన్ని కాక అహరోను యొక్క ప్రతిష్ఠిత స్థితిని సూచిస్తున్నందున వ్యక్తిని సూచించే రూపం వాడబడింది.
- source_word: הוּא וּבָנָיו עַד עוֹלָם
  choice: అతడూ అతని కుమారులూ శాశ్వతంగా
  rationale: అహరోనుతో పాటు అతని కుమారుల యాజక సేవ నిరంతరంగా ఉండాలని చెప్పే మూలపాఠ నిర్మాణాన్ని అనుసరిస్తుంది.
- source_word: לְהַקְטִיר
  choice: ధూపార్పణ చేయడానికి
  rationale: యాజక సేవ సందర్భంలో ధూపాన్ని దహించి అర్పించే కార్యాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי יְהוָה
  choice: యహ్వే సన్నిధిలో
  rationale: לִפְנֵי లోని సన్నిధి భావాన్ని కాపాడుతూ, దైవనామాన్ని యహ్వే అని లిప్యంతరీకరించింది.
- source_word: לְשָׁרְתוֹ
  choice: ఆయనకు సేవచేయడానికి
  rationale: యాజక సంబంధమైన సేవను తెలుపుతుంది; సమీపంలోని యహ్వేనే ఏకవచన ప్రత్యయ సూచితుడిగా గ్రహించబడుతున్నాడు.
- source_word: וּלְבָרֵךְ בִּשְׁמוֹ
  choice: ఆయన నామంలో దీవించడానికి
  rationale: దైవనామపు అధికారంలో లేదా దానిని ఉచ్చరిస్తూ దీవించే భావాల మధ్య ఉన్న విస్తృతిని ‘నామంలో’ నిలుపుతుంది.
theological_decisions:
- issue: ‘ప్రతిష్ఠించడానికి’ అనే క్రియలోని ఏకవచన కర్మప్రత్యయం ఎవరిని సూచిస్తుంది?
  choice: అహరోనును సూచించే ‘అతన్ని’
  alternative: కర్మను అవ్యక్తంగా ఉంచడం లేదా ‘దానిని’ అని అనువదించడం
  rationale: ‘అహరోను ప్రత్యేకంగా ఉంచబడ్డాడు’ అనే సమీప వాక్యనిర్మాణం అహరోనునే సహజ కర్మగా సూచిస్తుంది; అయినా వెంటనే కుమారులు కూడా చేరడం వల్ల కలిగే మూలపాఠపు ఉద్వేగాన్ని పూర్తిగా సమతలపరచలేదు.
- issue: ‘ఆయనకు సేవచేయడానికి’లోని ప్రత్యయం ఎవరిని సూచిస్తుంది?
  choice: యహ్వేను సూచిస్తుంది
  alternative: అహరోనును సూచిస్తుంది
  rationale: ‘యహ్వే సన్నిధిలో’ అనే అత్యంత సమీప దైవసూచనతో పాటు యాజక సేవ యొక్క సందర్భం యహ్వేను సూచించడాన్ని బలపరుస్తాయి.
- issue: קֹדֶשׁ קָדָשִׁים వ్యక్తినేనా, పరిశుద్ధస్థలాన్నేనా సూచిస్తుంది?
  choice: అహరోను యొక్క ‘అత్యంత పరిశుద్ధ’ ప్రతిష్ఠిత స్థితి
  alternative: ‘పరిశుద్ధ స్థలాల పరిశుద్ధ స్థలం’ అనే ఆలయస్థల సూచన
  rationale: ఈ వాక్యంలో పదబంధం అహరోనును ప్రత్యేకంగా ఉంచడం, ప్రతిష్ఠించడం అనే క్రియలతో అనుసంధానమై ఉంది; కాబట్టి స్థలార్థాన్ని ప్రధాన పాఠంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. మూలంలోని ఏకవచన ‘అతన్ని’ నిలుపుతూ, తరువాత అహరోను కుమారులను చేర్చే నిర్మాణాన్ని రెండు వాక్యాలుగా అమర్చి చదవడానికి సహజంగా చేశాం. ‘యహ్వే’ దైవనామానికి ప్రత్యక్ష లిప్యంతరీకరణ.
