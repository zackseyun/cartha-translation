    rationale: ప్రస్తుత పాదటిప్పణి ‘నివసిస్తాడు’ అనే ప్రధాన పాఠ పదాలనే ప్రత్యామ్నాయంగా మళ్లీ ఇస్తుంది; ‘చివరి మాటలను’ అనే వివరణ కూడా అవసరంలేని అస్పష్టతను కలిగిస్తుంది. గుర్తును సంబంధిత క్రియ వద్ద ఉంచి, నిజమైన ప్రత్యామ్నాయ కాలపఠనాలను మాత్రమే ఇవ్వాలి.
