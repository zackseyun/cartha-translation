- from: 'ఎందుకంటే దావీదు ఇలా అన్నాడు[a]: “ఇశ్రాయేలు దేవుడైన యాహ్వే తన ప్రజలకు విశ్రాంతి అనుగ్రహించాడు; ఆయన యెరూషలేములో శాశ్వతంగా నివసిస్తాడు.”'
  to: 'ఎందుకంటే దావీదు ఇలా అన్నాడు: “ఇశ్రాయేలు దేవుడైన యాహ్వే తన ప్రజలకు విశ్రాంతి అనుగ్రహించాడు; ఆయన యెరూషలేములో శాశ్వతంగా నివసిస్తున్నాడు[a].”'
  rationale: ప్రధాన పాఠంలో యాహ్వే యెరూషలేములో స్థిరంగా ఉన్నాడనే సందర్భోచిత భావాన్ని తెలుగులో సహజంగా చూపడానికి ‘నివసిస్తున్నాడు’గా సవరించాం. హీబ్రూ క్రియ కాలభావానికి ఉన్న భూత/భవిష్యత్ ప్రత్యామ్నాయాలను పాదటిప్పణిలో నిలిపి, పాదటిప్పణి గుర్తును నేరుగా సంబంధిత క్రియకు అంకర్ చేశాం.
