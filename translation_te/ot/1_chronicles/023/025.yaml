id: 1CH.23.25
reference: 1 Chronicles 23:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֚י אָמַ֣ר דָּוִ֔יד הֵנִ֛יחַ יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל לְ/עַמּ֑/וֹ וַ/יִּשְׁכֹּ֥ן בִּ/ירוּשָׁלִַ֖ם עַד לְ/עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/025.yaml
  text: For David said[a], “Yahweh, the God of Israel, has given rest to his people, and he has dwelt in Jerusalem forever.”
translation:
  language: te
  text: 'ఎందుకంటే దావీదు ఇలా అన్నాడు: “ఇశ్రాయేలు దేవుడైన యాహ్వే తన ప్రజలకు విశ్రాంతి అనుగ్రహించాడు; ఆయన యెరూషలేములో శాశ్వతంగా నివసిస్తున్నాడు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన యెరూషలేములో శాశ్వతంగా నివసించాడు” లేదా “నివసించనున్నాడు.” హీబ్రూ క్రియ యాహ్వే స్థిరమైన, నిరంతర నివాసాన్ని సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి ఆదేశానికి దావీదు మాటలను కారణంగా పరిచయం చేసే వివరణాత్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: אָמַר דָּוִיד
  choice: దావీదు ఇలా అన్నాడు
  rationale: సాధారణ భూతకాల కథనాన్ని సహజంగా వ్యక్తపరుస్తుంది; ‘ఇలా’ ప్రత్యక్ష ఉల్లేఖనాన్ని సులభంగా పరిచయం చేస్తుంది.
- source_word: הֵנִיחַ
  choice: విశ్రాంతి అనుగ్రహించాడు
  rationale: נוח హిఫీల్ రూపంలోని ‘విశ్రాంతి కలిగించు/ఇవ్వు’ అనే కారణార్థక భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా లిప్యంతరీకరిస్తుంది.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: యాహ్వేకు సమానాధికార విశేషణంగా ఉన్న హీబ్రూ నిర్మాణాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: לְעַמּוֹ
  choice: తన ప్రజలకు
  rationale: కర్త యాహ్వేను సూచించే స్వీయసంబంధాన్ని స్పష్టంగా ఉంచుతూ לְ యొక్క పరోక్ష కర్మ/లబ్ధిదారు భావాన్ని తెలియజేస్తుంది.
- source_word: וַיִּשְׁכֹּן
  choice: ఆయన ... నివసిస్తాడు
  rationale: దేవుని స్థిరమైన, కొనసాగుతున్న నివాసాన్ని తెలుపుతుంది; హీబ్రూ క్రియకు భూత లేదా భవిష్యత్ కాల అవగాహన కూడా సాధ్యమని పాదటిప్పణిలో నిలుపబడింది.
- source_word: בִּירוּשָׁלַם
  choice: యెరూషలేములో
  rationale: స్థలార్థక בְּను నేరుగా, సంప్రదాయ తెలుగు స్థలనామంతో అనువదిస్తుంది.
- source_word: עַד לְעוֹלָם
  choice: శాశ్వతంగా
  rationale: నిరంతర కాలవ్యాప్తిని ఆధునిక, సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉన్నందున దానిని బిరుదుగా మార్చకుండా లిప్యంతరీకరించబడింది.
- issue: యెరూషలేములో యాహ్వే నివాసం యొక్క కాలభావం
  choice: ఆయన ... నివసిస్తాడు
  alternative: ఆయన ... నివసించాడు / నివసిస్తాడు (భవిష్యదర్థం)
  rationale: వాక్యం యాహ్వే స్థిరంగా, నిరంతరం నివసించే స్థితిని సూచించగలదు. హీబ్రూ וַיִּשְׁכֹּן యొక్క కాలార్థాన్ని అతిగా నిర్దిష్టం చేయకుండా ప్రత్యామ్నాయ అవగాహనను పాదటిప్పణిలో నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘విశ్రాంతి అనుగ్రహించాడు’ కారణార్థక భావాన్ని నిలుపుతుంది; ‘నివసిస్తాడు’ స్థిరమైన కొనసాగుతున్న స్థితిని అందిస్తుంది. పాదటిప్పణి గుర్తు ప్రధాన పాఠంలో దావీదు మాటల పరిచయం వద్ద ఉంచబడింది.
