revisions:
- from: ప్రతి ఉదయం[a] నిలబడి యాహ్వేకు కృతజ్ఞతలు చెల్లించడానికి, ఆయనను స్తుతించడానికి; అలాగే సాయంత్రం కూడా నిలబడడానికి.
  to: ప్రతి ఉదయం[a] నిలబడడానికి, యాహ్వేకు కృతజ్ఞతలు చెల్లించడానికి, ఆయనను స్తుతించడానికి, అలాగే సాయంత్రం కూడా.
  rationale: The revision removes the unwarranted final repetition of “నిలబడడానికి.” Thus “అలాగే సాయంత్రం కూడా” naturally applies to the complete morning duty—standing, giving thanks, and praising—just as in the Hebrew. The verse remains a purpose-infinitive continuation of the preceding context.
