id: 1CH.23.30
reference: 1 Chronicles 23:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לַ/עֲמֹד֙ בַּ/בֹּ֣קֶר בַּ/בֹּ֔קֶר לְ/הֹד֥וֹת וּ/לְ/הַלֵּ֖ל לַ/יהוָ֑ה וְ/כֵ֖ן לָ/עָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/030.yaml
  text: and to stand every morning to give thanks and to praise Yahweh[a], and likewise at evening,
translation:
  language: te
  text: ప్రతి ఉదయం[a] నిలబడడానికి, యాహ్వేకు కృతజ్ఞతలు చెల్లించడానికి, ఆయనను స్తుతించడానికి, అలాగే సాయంత్రం కూడా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఉదయం ఉదయం”; ఇది క్రమంగా ప్రతిరోజూ చేయవలసిన విధిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/עֲמֹד
  choice: నిలబడడానికి
  rationale: עמד అనే క్రియలోని నిలబడే భంగిమను, ముందటి సందర్భంలో తెలిపిన నియమిత సేవా ఉద్దేశాన్ని నిలుపుతుంది.
- source_word: בַּ/בֹּקֶר בַּ/בֹּקֶר
  choice: ప్రతి ఉదయం
  rationale: హీబ్రూ పదపునరుక్తి ప్రతిరోజూ క్రమంగా జరిగే విధిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ప్రతి ఉదయం’ సహజంగా అదే భావాన్ని అందిస్తుంది.
- source_word: לְ/הֹודוֹת
  choice: కృతజ్ఞతలు చెల్లించడానికి
  rationale: ఆరాధనా సందర్భంలో ידה దేవునికి కృతజ్ఞతలు తెలపడం లేదా స్తుతించడం అనే భావం ఇస్తుంది; తరువాతి ‘స్తుతించడానికి’తో అనవసర పునరుక్తి రాకుండా ఈ ఎంపిక చేశాం.
- source_word: וּ/לְ/הַלֵּל
  choice: ఆయనను స్తుతించడానికి
  rationale: הלל అనే క్రియకు నేరమైన, సాధారణంగా అర్థమయ్యే భావం ‘స్తుతించడం’; మూలంలో స్పష్టంగా లేని గాన భావాన్ని జోడించలేదు.
- source_word: לַ/יהוָה
  choice: యాహ్వేకు
  rationale: హీబ్రూ దైవనామం יהוהను బిరుదుతో భర్తీ చేయకుండా వ్యక్తిగత నామంగా లిప్యంతరీకరించాం.
- source_word: וְ/כֵן לָ/עָרֶב
  choice: అలాగే సాయంత్రం కూడా
  rationale: וכן ఉదయపు అదే విధి సాయంత్రానికీ వర్తిస్తుందని సూచిస్తుంది; తెలుగులో ఈ అనుసంధానం సహజంగా ఉంటుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం నాలుగు అక్షరాల దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యాహ్వే’ దాన్ని బిరుదుగా మార్చకుండా నామంగా నిలుపుతుంది; ఖచ్చితమైన ప్రాచీన ఉచ్చారణపై ఉన్న పరిమితిని అంగీకరిస్తూనే విస్తృతంగా స్వీకరించిన రూపాన్ని వాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ఆరాధనా శైలిని వాడాం. వాక్యం ముందటి వచనంపై ఆధారపడే ఉద్దేశార్థక నిర్మాణం కావడంతో క్రియారూపాలను ‘-డానికి’తో కొనసాగించాం; చివరి భాగంలో మూలంలో సూచితంగా ఉన్న ‘నిలబడడానికి’ని తెలుగులో స్పష్టత కోసం పునరుద్ఘాటించాం.
