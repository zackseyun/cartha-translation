  text: for the twenty-third[a], Mahazioth; his sons and his brothers, twelve.
translation:
  language: te
  text: ఇరవై మూడవ వంతు[a] మహజీయోతుకు వచ్చింది; అతని కుమారులు, అతని సహోదరులు—మొత్తం పన్నెండు మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇరవై మూడవ చీటి మహజీయోతుకు వచ్చింది.” ఉపసర్గ ఈ చీట్ల క్రమంలో కేటాయింపును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/שְׁלֹשָׁה וְ/עֶשְׂרִים
  choice: ఇరవై మూడవ వంతు
  rationale: చీట్ల ద్వారా ఏర్పడిన క్రమంలో לְ నియామకాన్ని సూచిస్తుంది; హెబ్రీ సంఖ్యాపదబంధం సందర్భానుసారంగా ‘ఇరవై మూడవది’ అనే క్రమసంఖ్యగా పనిచేస్తుంది. గత వచనాల నుంచి గ్రహించాల్సిన ‘వంతు’ను తెలుగులో సహజత కోసం చేర్చాం.
- source_word: לְ/מַחֲזִיאוֹת
  choice: మహజీయోతుకు
  rationale: ఇది వ్యక్తి పేరు; అనువదించకుండా హెబ్రీ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం. ఉపసర్గ לְ యొక్క కేటాయింపు భావాన్ని తెలుగు విభక్తి ‘-కు’తో తెలిపాం.
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: హెబ్రీ పదం ఈ జాబితా సందర్భంలో ప్రత్యేకంగా కుమారులను సూచిస్తుంది; అందువల్ల లింగనిర్దిష్ట అర్థాన్ని నిలిపాం.
- source_word: וְאֶחָיו
  choice: అతని సహోదరులు
  rationale: ఈ సందర్భంలో אַחִים అంటే సోదరులు; గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగులో ‘సహోదరులు’ అని ఇచ్చాం.
- source_word: שְׁנֵים עָשָׂר
  choice: మొత్తం పన్నెండు మంది
  rationale: ఈ సంఖ్య మహజీయోతు కుమారులు, సహోదరులు కలిపిన మొత్తం బృందసంఖ్యను తెలియజేస్తుంది; వ్యక్తుల లెక్క అని స్పష్టంగా ఉండేందుకు ‘మంది’ చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జాబితా శైలిని నిలిపి, మూలంలోని కేటాయింపు భావాన్ని సహజంగా వ్యక్తపరచాం. ‘వచ్చింది,’ ‘మొత్తం,’ ‘మంది’ మూలంలో ప్రత్యక్ష పదాలు కాకపోయినా, ఎలిప్టికల్ హెబ్రీ జాబితాను తెలుగులో స్పష్టంగా, సహజంగా అందించేందుకు సందర్భానుగుణంగా చేర్చబడ్డాయి.
