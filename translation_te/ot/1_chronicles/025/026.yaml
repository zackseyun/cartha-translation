translation:
  language: te
  text: పందొమ్మిదవ వంతు[a] మల్లోతికి వచ్చింది; అతని కుమారులు, అతని సోదరులు—మొత్తం పన్నెండు మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పందొమ్మిదవ దానికి.” ఈ అధ్యాయంలో మళ్లీ మళ్లీ వచ్చే సూత్రప్రాయమైన వాక్యనిర్మాణంలో ఇది పందొమ్మిదవ కేటాయింపును లేదా చీటిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/תִשְׁעָה עָשָׂר
  choice: పందొమ్మిదవ వంతు
  rationale: ఈ అధ్యాయంలోని చీట్ల ద్వారా ఏర్పడిన వరుస కేటాయింపుల సందర్భంలో సంఖ్యకు క్రమసంఖ్య భావం ఉంది. మూలంలోని לְ ఉపసర్గతో కూడిన సంక్షిప్త సూత్రాన్ని సహజమైన తెలుగులో ‘వంతు ... వచ్చింది’ అని వ్యక్తం చేశాం.
- source_word: לְ/מַלּוֹתִי
  choice: మల్లోతికి
  rationale: ఇది వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణను అనుసరించి ‘మల్లోతి’గా లిప్యంతరీకరించి, לְ ఉపసర్గను తెలుగులో సంప్రదానార్థక ‘-కి’తో తెలిపాం.
- source_word: בָּנָי/ו
  choice: అతని కుమారులు
  rationale: హీబ్రూ పదం ప్రత్యేకంగా పురుష సంతానాన్ని, అంటే కుమారులను సూచిస్తుంది; జాబితా సందర్భంలో అదే అర్థాన్ని నిలిపాం.
- source_word: וְ/אֶחָי/ו
  choice: అతని సోదరులు
  rationale: మూలపదపు సాధారణ అర్థం ‘సోదరులు.’ ఇది బంధువులు లేదా వంశసహచరులను విస్తృతంగా సూచించే అవకాశం ఉన్నా, సందర్భం దానిని నిర్బంధంగా కోరనందున ప్రాథమిక అర్థాన్నే ఉంచాం.
- source_word: שְׁנֵים עָשָׂר
  choice: మొత్తం పన్నెండు మంది
  rationale: ఇది ఆ విభాగంలోని వ్యక్తుల మొత్తం సంఖ్య. తెలుగులో వ్యక్తుల లెక్క స్పష్టంగా ఉండేందుకు ‘మొత్తం’ మరియు ‘మంది’ చేర్చాం.
