translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలిలోని సంక్షిప్తతను నిలుపుతూ సహజంగా చదవబడే గౌరవప్రదమైన వాక్యంగా రూపొందించాం. వ్యక్తుల పేర్లు, బంధుత్వ పదాలు మూలానికి దగ్గరగా ఉంచబడ్డాయి.
