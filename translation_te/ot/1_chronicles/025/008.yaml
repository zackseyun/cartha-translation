source:
  edition: WLC
  text: וַ/יַּפִּ֜ילוּ גּוֹרָל֣וֹת מִשְׁמֶ֗רֶת לְ/עֻמַּת֙ כַּ/קָּטֹ֣ן כַּ/גָּד֔וֹל מֵבִ֖ין עִם תַּלְמִֽיד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/008.yaml
  text: And they cast lots for duties[a], the small as well as the great[b], the teacher with the student.
translation:
  language: te
  text: వారు సేవా బాధ్యతల కోసం చీట్లు వేశారు—చిన్నవారికీ పెద్దవారికీ సమానంగా[b], నైపుణ్యవంతునికీ శిష్యునికీ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అర్థం చేసుకునేవాడు శిష్యునితో పాటు.” హీబ్రూ మేబీన్ (מֵבִין) అక్షరార్థంగా “అర్థం చేసుకునేవాడు”; సందర్భానుసారం “నైపుణ్యవంతుడు” లేదా “బోధకుడు” అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “చిన్నవాడు పెద్దవాడిలాగే.” ఇది హోదా లేదా స్థాయితో సంబంధం లేకుండా అందరినీ సమానంగా పరిగణించారని సూచించే ప్రయోగం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּפִּילוּ גּוֹרָלוֹת
  choice: చీట్లు వేశారు
  rationale: הפיל גורלות అనే హీబ్రూ ప్రయోగం చీట్లు వేసి నిర్ణయించడాన్ని సూచిస్తుంది; తెలుగులో ఇది సహజమైన, నేరుగా అర్థమయ్యే రూపం.
- source_word: מִשְׁמֶרֶת
  choice: తమ సేవా వంతుల కోసం
  rationale: ఆలయ సంగీత సేవ సందర్భంలో ఈ పదం కేటాయించబడిన సేవా వంతు లేదా విధిని సూచిస్తుంది. బహువచన భావం చీట్ల ద్వారా ప్రతి ఒక్కరికీ వంతు నిర్ణయించబడే సందర్భం నుంచి స్పష్టమవుతుంది.
- source_word: לְעֻמַּת
  choice: ఒకే విధంగా
  rationale: ఇక్కడ స్థలపరమైన ‘ఎదురుగా’ అనే భావం కాకుండా, వర్గభేదం లేకుండా సమానంగా చీట్లు వేయబడిన భావం ఉంది.
- source_word: כַּקָּטֹן כַּגָּדוֹל
  choice: చిన్నవారికీ పెద్దవారికీ
  rationale: హీబ్రూ ‘చిన్నవాడు—పెద్దవాడు’ అనే హోదా లేదా స్థాయి సంబంధిత జంటను వీలైనంత దగ్గరగా నిలుపుతుంది; వయస్సుగా మాత్రమే పరిమితం చేయదు.
- source_word: מֵבִין
  choice: నేర్పరి
  rationale: క్రియావిశేషణ రూపం అక్షరార్థంగా ‘అర్థం చేసుకునేవాడు’; సంగీత సేవ సందర్భంలో జ్ఞానం లేదా నైపుణ్యం గల వ్యక్తిని సూచించగలదు. ‘నేర్పరి’ ఈ భావాన్ని నిలుపుతూ తప్పనిసరిగా ‘బోధకుడు’ అని నిర్ణయించదు.
- source_word: עִם תַּלְמִיד
  choice: శిష్యునితో కలిసి
  rationale: עִם అంటే ‘తో’; תַּלְמִיד అంటే నేర్చుకునే వ్యక్తి. ‘శిష్యుడు’ గౌరవప్రదమైన ఆధునిక తెలుగులో శిక్షణ పొందుతున్న వ్యక్తిని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: מֵבִין పదాన్ని ‘బోధకుడు’గా లేదా ‘నేర్పరి’గా అర్థం చేయడం
  choice: నేర్పరి
  alternative: బోధకుడు
  rationale: మూలపదం నేరుగా ‘అర్థం చేసుకునేవాడు/నైపుణ్యంగలవాడు’ అని సూచిస్తుంది. తరువాతి ‘శిష్యుడు’ కారణంగా ‘బోధకుడు’ సాధ్యమైనప్పటికీ, ఆ సంబంధాన్ని మూలం ఖచ్చితంగా నిర్దేశించదు; అందువల్ల అస్పష్టతను నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల శైలి. ఆలయ సేవా సందర్భాన్ని స్పష్టం చేయడానికి ‘సేవా వంతులు’ వాడబడింది. ‘చిన్నవారు/పెద్దవారు’ అనే మూల జాతీయాన్ని నిలిపి, దాని భావాన్ని పాదసూచికలో వివరించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
