- from: వారు తమ సేవా వంతుల కోసం చీట్లు వేశారు—చిన్నవారికీ పెద్దవారికీ ఒకే విధంగా[b], నేర్పరి శిష్యునితో కలిసి[a].
  to: వారు సేవా బాధ్యతల కోసం చీట్లు వేశారు—చిన్నవారికీ పెద్దవారికీ సమానంగా[b], నైపుణ్యవంతునికీ శిష్యునికీ[a].
