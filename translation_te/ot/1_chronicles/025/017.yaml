translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త జాబితా శైలిని, మూలంలోని అసంపూర్ణ వాక్య నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపాం. ‘సహోదరులు’ గౌరవప్రదమైన సాధారణ బైబిలు పదప్రయోగం; విస్తృత బంధుత్వార్థాన్ని ప్రధాన పాఠంలో నిర్బంధించలేదు.
