  text: The fourteenth was Mattithiah[a], his sons and his brothers, twelve.
translation:
  language: te
  text: పద్నాలుగవది మత్తిత్యాహు[a]; అతని కుమారులు, అతని సహోదరులు పన్నెండుమంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరాలా, “పద్నాలుగుకు, మత్తిత్యాహు.” ఈ జాబితా సందర్భంలో ఈ సంఖ్య పద్నాలుగవ చీటిని లేదా సేవా విభాగాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַרְבָּעָה עָשָׂר
  choice: పద్నాలుగవ వంతు
  rationale: ఈ అధ్యాయంలోని పునరావృత జాబితా సూత్రంలో ఈ సంఖ్య చీటి ద్వారా నిర్ణయించబడిన వరుస వంతును సూచిస్తుంది. మూలంలో ‘చీటి’ అనే నామవాచకం ఈ వచనంలో లేకపోవడంతో దాన్ని చేర్చకుండా, సహజమైన తెలుగులో ‘వంతు’ అని అనువదించాం.
- source_word: מַתִּתְיָהוּ
  choice: మత్తిత్యాహు
  rationale: హీబ్రూ వ్యక్తినామంలోని రూపాన్ని తెలుగు లిపిలో గుర్తించగలిగే విధంగా దగ్గరగా లిప్యంతరీకరించాం.
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: హీబ్రూ పదం ప్రత్యేకంగా కుమారులను సూచిస్తుంది; అందువల్ల విస్తృతార్థకమైన ‘పిల్లలు’ అని అనువదించలేదు.
- source_word: וְאֶחָיו
  choice: అతని సహోదరులు
  rationale: మూలంలోని ‘సోదరులు/సహోదరులు’ అనే ప్రత్యక్ష అర్థాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో నిలిపాం.
- source_word: שְׁנֵים עָשָׂר
  choice: కలిపి పన్నెండు మంది
  rationale: ఈ సంఖ్య మత్తిత్యాహు కుమారులు, సహోదరులతో కూడిన బృందపు మొత్తాన్ని తెలుపుతుంది. తెలుగులో సంబంధం స్పష్టంగా ఉండేందుకు ‘కలిపి’, వ్యక్తుల లెక్కకు ‘మంది’ చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా స్వభావాన్ని నిలుపుతూ సహజంగా చదవడానికి రెండు వాక్యాలుగా ఇచ్చాం. వ్యక్తినామాన్ని హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
