  text: הַ/שְּׁלִשִׁ֣י זַכּ֔וּר בָּנָ֥י/ו וְ/אֶחָ֖י/ו שְׁנֵ֥ים עָשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/010.yaml
  text: The third was Zaccur[a], his sons and his brothers, twelve.
translation:
  language: te
  text: మూడవవాడు జక్కూరు[a]; అతని కుమారులు, అతని సహోదరులు—మొత్తం పన్నెండుమంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సందర్భానుసారంగా, “మూడవ చీటి జక్కూరుకు వచ్చింది; అతని కుమారులు, అతని సహోదరులు మొత్తం పన్నెండుమంది.” ఇక్కడ ‘చీటి’ అనే మాట మళ్లీ చెప్పబడకపోయినా, చుట్టుపక్కల వచనాల నుంచి అది అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁלִשִׁי
  choice: మూడవవాడు
  rationale: నిర్దిష్ట ఆర్టికల్‌తో ఉన్న క్రమసంఖ్య, సందర్భంలోని చీట్ల వరుసలో మూడవ స్థానాన్ని సూచిస్తోంది. హీబ్రూలో ‘చీటి’ అనే నామవాచకం ఇక్కడ పునరుక్తం కాలేదు కాబట్టి ప్రధాన పాఠ్యంలో దానిని చేర్చలేదు.
- source_word: זַכּוּר
  choice: జక్కూరు
  rationale: హీబ్రూ వ్యక్తిపేరును ఆధునిక తెలుగు ధ్వన్యంతరీకరణలో ఇచ్చాం.
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: בן పదం పురుష బహువచన రూపంలో 3వ పురుష ఏకవచన ప్రత్యయంతో ఉండి, ప్రత్యేకంగా ‘అతని కుమారులు’ అని అర్థమిస్తుంది.
- source_word: וְאֶחָיו
  choice: అతని సహోదరులు
  rationale: אחים పదానికి ఇక్కడ నేరమైన అర్థం ‘అతని సహోదరులు’; విస్తృత బంధుత్వార్థాన్ని అనవసరంగా ప్రవేశపెట్టలేదు.
- source_word: שְׁנֵים עָשָׂר
  choice: మొత్తం పన్నెండుమంది
  rationale: ఈ సంఖ్య గుంపు మొత్తం సభ్యుల సంఖ్యను తెలియజేస్తుంది. వ్యక్తులను లెక్కిస్తున్నందున ‘మంది’ను, సహజమైన తెలుగుకోసం ‘మొత్తం’ను చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. హీబ్రూ జాబితా శైలిని నిలుపుతూ, తెలుగులో సంఖ్యా సంబంధం స్పష్టంగా ఉండేందుకు దీర్ఘ విరామచిహ్నం మరియు ‘మొత్తం’ వాడాం.
