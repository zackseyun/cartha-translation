source:
  edition: WLC
  text: כָּל אֵ֨לֶּה בָנִ֜ים לְ/הֵימָ֗ן חֹזֵ֥ה הַ/מֶּ֛לֶךְ בְּ/דִבְרֵ֥י הָ/אֱלֹהִ֖ים לְ/הָרִ֣ים קָ֑רֶן וַ/יִּתֵּ֨ן הָ/אֱלֹהִ֜ים לְ/הֵימָ֗ן בָּנִ֛ים אַרְבָּעָ֥ה עָשָׂ֖ר וּ/בָנ֥וֹת שָׁלֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/005.yaml
  text: All these were sons of Heman[a], the king’s seer in the words of God, to exalt the horn[b]. And God gave Heman fourteen sons and three daughters.
translation:
  language: te
  text: వీరందరూ దేవుని మాటల విషయంలో[a] రాజుకు దర్శియైన హేమాను కుమారులు—కొమ్మును పైకెత్తడానికి[b]. దేవుడు హేమానుకు పద్నాలుగు మంది కుమారులను, ముగ్గురు కుమార్తెలను ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేవుని మాటల ద్వారా,’ లేదా ‘దేవుని సంగతుల విషయంలో.’ హీబ్రూ పదబంధం సంక్షిప్తంగా ఉండి, దైవిక ప్రకటనతో హేమాను సేవకు ఉన్న సంబంధాన్ని అనేక విధాలుగా అర్థం చేసుకోవడానికి వీలిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘కొమ్మును ఎత్తడానికి.’ హీబ్రూలో ‘కొమ్ము’ బలం, ఘనత లేదా ఉన్నత స్థితికి రూపకం. ఇక్కడ ఎవరి కొమ్ము ఉద్దేశించబడిందో స్పష్టంగా చెప్పబడలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹזֵה
  choice: దీర్ఘదర్శి
  rationale: దైవిక ప్రకటనను పొందే వ్యక్తిని సూచించే హీబ్రూ పదానికి తెలుగు బైబిలు వాడుకలో పరిచితమైన, ప్రవక్త అనే విస్తృత పదం కంటే ప్రత్యేకమైన భావాన్ని నిలుపుకునే పదం.
- source_word: בְּדִבְרֵי הָאֱלֹהִים
  choice: దేవుని మాటల విషయంలో
  rationale: హేమాను దైవిక ప్రకటనకు సంబంధించిన రాజు దీర్ఘదర్శి అని సహజమైన తెలుగులో తెలియజేస్తూ, హీబ్రూ విభక్తి సంబంధంలోని సంక్షిప్తతను పూర్తిగా ఒకే విధంగా నిర్ణయించదు.
- source_word: לְהָרִים קָרֶן
  choice: కొమ్మును పైకెత్తడానికి
  rationale: బలం, ఘనత లేదా ఉన్నత స్థితిని సూచించే హీబ్రూ రూపకాన్ని వివరణాత్మక పదంతో భర్తీ చేయకుండా నిలుపుతుంది; ఉద్దేశార్థక క్రియారూపాన్ని కూడా ప్రతిబింబిస్తుంది.
- source_word: קָרֶן
  choice: కొమ్ము
  rationale: మూలంలోని శక్తి లేదా గౌరవానికి సంబంధించిన దృశ్యరూపకాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: וַיִּתֵּן הָאֱלֹהִים לְהֵימָן
  choice: దేవుడు హేమానుకు ... ఇచ్చాడు
  rationale: దేవుడు సంతానాన్ని అనుగ్రహించినట్లు తెలిపే మూల వాక్యనిర్మాణాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: בָנִים ... וּבָנוֹת
  choice: కుమారులను ... కుమార్తెలను
  rationale: మూలంలో స్పష్టంగా వేరు చేసిన మగ, ఆడ సంతానాన్ని అలాగే నిలుపుతుంది.
- source_word: אַרְבָּעָה עָשָׂר ... שָׁלֹשׁ
  choice: పద్నాలుగు మంది ... ముగ్గురు
  rationale: సంఖ్యలను ఖచ్చితంగా తెలుపుతూ వ్యక్తులకు సహజమైన తెలుగు సంఖ్యావాచక రూపాలను ఉపయోగిస్తుంది.
theological_decisions:
- issue: ‘దేవుని మాటల విషయంలో రాజుకు దీర్ఘదర్శి’ అనే పదబంధం యొక్క సంబంధం
  choice: హేమాను సేవ దైవిక ప్రకటనకు సంబంధించినదని తెలుపుతూ ‘దేవుని మాటల విషయంలో’ అని అనువదించడం
  alternative: ‘దేవుని మాటల ద్వారా’ లేదా ‘దేవుని సంగతుల విషయంలో’
  rationale: హీబ్రూ నిర్మాణం సాధనం, విషయం లేదా పరిధి అనే భావాల్లో ఏదో ఒక్కదానిని నిర్బంధంగా నిర్ణయించదు; ప్రధాన పాఠం ఆ సంబంధాన్ని అతిగా నిర్దిష్టం చేయదు.
- issue: ‘కొమ్మును పైకెత్తడం’ యొక్క భావం మరియు వాక్యసంబంధం
  choice: బలం, ఘనత లేదా ఉన్నత స్థితికి సంబంధించిన రూపకాన్ని నిలుపుతూ, మూలంలోని సంక్షిప్త ఉద్దేశార్థక పదబంధాన్ని డాష్ తర్వాత ఉంచడం
  alternative: ‘అతని బలాన్ని పెంచడానికి’ లేదా ‘అతనిని ఘనపరచడానికి’
  rationale: మూలం ఎవరి కొమ్ము పైకెత్తబడుతుందో స్పష్టంగా చెప్పదు; ఒకే అమూర్త అర్థానికి లేదా నిర్దిష్ట వ్యక్తికి పరిమితం చేయకుండా రూపకాన్నీ వాక్యంలోని ఉద్రిక్తతనూ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బైబిలు శైలి వాడబడింది. ‘దీర్ఘదర్శి’ ప్రత్యేక దైవిక ప్రకటన పాత్రను సూచిస్తుంది. హీబ్రూ వాక్యంలోని సంక్షిప్తమైన, కొంత సందిగ్ధమైన ‘కొమ్మును పైకెత్తడానికి’ అనే భాగాన్ని డాష్‌తో వేరుచేసి, అర్థాన్ని అనవసరంగా పరిష్కరించకుండా ఉంచాం.
