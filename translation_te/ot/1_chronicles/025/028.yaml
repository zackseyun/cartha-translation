translation:
  language: te
  text: ఇరవై ఒకటవది హోతీరుకు; అతని కుమారులు, అతని సోదరులు పన్నెండు మంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/אֶחָד וְ/עֶשְׂרִים
  choice: ఇరవై ఒకటవ వంతు
  rationale: ఈ అధ్యాయంలోని సందర్భం చీట్ల ద్వారా నిర్ణయించిన వరుసను సూచిస్తుంది. హెబ్రీలో ‘చీటి’ అనే పదం ఈ వాక్యంలో ప్రత్యక్షంగా లేకపోవడంతో దానిని చేర్చకుండా, క్రమంలో కేటాయించబడిన భాగాన్ని సహజ తెలుగులో ‘వంతు’గా వ్యక్తం చేశాం.
- source_word: לְ/הוֹתִיר
  choice: హోతీరుకు వచ్చింది
  rationale: לְ ఉపసర్గ కేటాయింపును సూచిస్తుంది. వ్యక్తి పేరును ‘హోతీరు’గా లిప్యంతరీకరించి, తెలుగు వాక్య నిర్మాణం సహజంగా ఉండేందుకు ‘కు వచ్చింది’ అని వ్యక్తం చేశాం.
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: בנים ఇక్కడ సాధారణంగా పిల్లలు కాక, కుమారులను నిర్దిష్టంగా సూచిస్తుంది.
- source_word: וְאֶחָיו
  choice: అతని సహోదరులు
  rationale: మూలంలోని ‘సోదరులు’ అనే కుటుంబ సంబంధ పదాన్ని నిలిపి ఉంచాం; సందర్భం ఆధారంగా ‘బంధువులు’ లేదా ‘సహచరులు’గా విస్తరించలేదు.
- source_word: שְׁנֵים עָשָׂר
  choice: మొత్తం పన్నెండు మంది
  rationale: ఈ సంఖ్య హోతీరు కుమారులు, సహోదరులతో కూడిన బృందపు మొత్తాన్ని తెలియజేస్తుంది. తెలుగులో భావం స్పష్టంగా ఉండేందుకు ‘మొత్తం’, వ్యక్తుల సంఖ్య కావడంతో ‘మంది’ చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా స్వభావాన్ని కాపాడుతూ సంక్షిప్తంగా అనువదించాం. ‘సహోదరులు’ అనే పదం గౌరవప్రదమైన సాధారణ బైబిలు శైలికి సరిపోతూ మూలంలోని కుటుంబ సంబంధాన్ని నిలుపుతుంది.
