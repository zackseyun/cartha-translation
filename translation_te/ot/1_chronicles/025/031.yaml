source:
  edition: WLC
  text: לְ/אַרְבָּעָ֤ה וְ/עֶשְׂרִים֙ לְ/רוֹמַ֣מְתִּי עָ֔זֶר בָּנָ֥י/ו וְ/אֶחָ֖י/ו שְׁנֵ֥ים עָשָֽׂר׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/031.yaml
  text: for the twenty-fourth[a], Romamti-ezer, his sons and his brothers, twelve.
translation:
  language: te
  text: ఇరవై నాలుగవది[a] రోమమ్తీ-ఏజెరుకు వచ్చింది; అతని కుమారులు, అతని సోదరులు—పన్నెండుమంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఇరవై నాలుగవదానికి.’ ఈ విభాగమంతటా ఈ మాట ఇరవై నాలుగవ చీటిని లేదా విభాగాన్ని సూచిస్తుంది.
    reason: సందర్భంలో అంతర్లీనంగా ఉన్న ‘చీటి/విభాగం’ భావాన్ని వివరించడానికి.
lexical_decisions:
- source_word: לְאַרְבָּעָה וְעֶשְׂרִים
  choice: ఇరవై నాలుగవది
  rationale: సందర్భంలో ఇది వరుసగా వేయబడిన ఇరవై నాలుగవ చీటిని లేదా దాని ప్రకారం ఏర్పడిన విభాగాన్ని సూచిస్తుంది. అయితే ‘చీటి’ అనే పదం ఈ వాక్యంలో ప్రత్యక్షంగా లేదు కాబట్టి ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: לְרוֹמַמְתִּי עָזֶר
  choice: రోమమ్తీ-ఏజెరుకు
  rationale: ఇది వ్యక్తి పేరు; దానిని అర్థానువాదం చేయకుండా తెలుగు లిపిలో లిప్యంతరీకరించాం. לְ ఉపసర్గ కేటాయింపును సూచిస్తున్నందున ‘కు’ వాడాం.
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: హీబ్రూ పదం ప్రత్యేకంగా పురుష సంతానాన్ని, అంటే కుమారులను, సూచిస్తుంది.
- source_word: וְאֶחָיו
  choice: అతని సహోదరులు
  rationale: మూలపదానికి ప్రాథమిక అర్థం ‘అతని సోదరులు’. జాబితా సందర్భంలో బంధువులు లేదా బృంద సహచరులు అనే విస్తృత సూచన ఉండవచ్చునన్న అస్పష్టతను తొలగించకుండా, గౌరవప్రదమైన ‘సహోదరులు’ను ఎంచుకున్నాం.
- source_word: שְׁנֵים עָשָׂר
  choice: కలిపి పన్నెండుమంది
  rationale: పేర్కొన్న సమూహంలోని మొత్తం పురుషుల సంఖ్య పన్నెండు అని సందర్భం సూచిస్తుంది; సహజమైన తెలుగులో లెక్కను స్పష్టం చేయడానికి ‘కలిపి’, వ్యక్తులను సూచించడానికి ‘మంది’ వాడాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా స్వభావాన్ని కాపాడుతూ సహజంగా చదవడానికి సంక్షిప్త వాక్య నిర్మాణం వాడాం. మూలంలోని కేటాయింపు భావాన్ని ‘కు వచ్చింది’తో వ్యక్తం చేశాం; ఇది తెలుగు పాఠకుడికి సహజంగా ఉండి, ‘చీటి’ని ప్రధాన పాఠ్యంలో అదనంగా చేర్చదు.
