  text: the sixth[a], Bukkiah; his sons and his brothers, twelve.
translation:
  language: te
  text: ఆరవది[a], బుక్కీయా; అతని కుమారులు, అతని సోదరులు—పన్నెండు మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, సందర్భాన్ని మరింత స్పష్టంగా చెబితే: “ఆరవ చీటి బుక్కీయాకు వచ్చింది; అతని కుమారులు, అతని సోదరులు—పన్నెండు మంది.” చుట్టుపక్కల వచనాలనుబట్టి “చీటి వచ్చింది” అనే మాటలు అర్థమవుతాయి; హెబ్రీ జాబితా శైలిలో అవి ఇక్కడ చెప్పబడలేదు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשִּׁשִּׁי
  choice: ఆరవది
  rationale: నిర్దిష్ట ప్రత్యయంతో ఉన్న క్రమసంఖ్య ఈ చీట్ల జాబితాలో సంక్షిప్తంగా వాడబడింది. సందర్భంలో ‘చీటి’ అనే భావం అంతర్లీనంగా ఉన్నా, హెబ్రీ వాక్యంలోని సంక్షిప్త జాబితా శైలిని ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: בֻקִּיָּהוּ
  choice: బుక్కీయా
  rationale: వ్యక్తి పేరును అనువదించకుండా, ఆధునిక తెలుగు పఠనానికి సహజమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: హెబ్రీ పదం ప్రత్యేకంగా కుమారులను సూచిస్తుంది; వంశావళి మరియు సేవా జాబితా సందర్భానికి అనుగుణంగా అదే అర్థాన్ని నిలిపాం.
- source_word: וְאֶחָיו
  choice: అతని సోదరులు
  rationale: ప్రాథమిక అర్థమైన పురుష సహోదరులను నేరుగా, ఆధునిక తెలుగులో సహజంగా తెలిపాం; ఈ సందర్భంలో బంధువులు లేదా సహచరులు అనే విస్తృత భావం ఉండవచ్చుగానీ దాన్ని ప్రధాన పాఠ్యంలో నిర్ధారించలేదు.
- source_word: שְׁנֵים עָשָׂר
  choice: పన్నెండు మంది
  rationale: ఈ సంఖ్య ముందున్న సమూహం మొత్తం సంఖ్యను తెలుపుతుంది. వ్యక్తుల సంఖ్య అని తెలుగులో సహజంగా తెలియడానికి ‘మంది’ చేర్చాం; హెబ్రీలో లేని క్రియను చేర్చలేదు.
