  yaml_path: translation/ot/1_chronicles/025/029.yaml
  text: 'For the twenty-second[a], to Giddalti: his sons and his brothers, twelve.'
translation:
  language: te
  text: 'ఇరవై రెండవది[a] గిద్దల్తీకి: అతని కుమారులు, అతని సోదరులు—పన్నెండు మంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “ఇరవై రెండవ చీటి గిద్దల్తీకి: అతని కుమారులు, అతని సోదరులు—పన్నెండు మంది.” హీబ్రూ జాబితా శైలి సంక్షిప్తంగా ఉంది; ‘చీటి’ అనే పదం చుట్టుపక్కల సందర్భం నుంచి గ్రహించబడుతుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁנַיִם וְעֶשְׂרִים
  choice: ఇరవై రెండవది
  rationale: అధ్యాయంలోని వరుస చీట్ల క్రమంలో ఇది ఇరవై రెండవ చీటిని సూచిస్తుంది. మూలంలోని సంక్షిప్త జాబితా శైలిని నిలుపుతూ తెలుగులో సహజమైన క్రమసంఖ్యను వాడాం.
- source_word: לְגִדַּלְתִּי
  choice: గిద్దల్తీకి వచ్చింది
  rationale: లְ ఉపసర్గ చీటి లేదా వంతు గిద్దల్తీకి కేటాయించబడిందనే భావాన్ని ఇస్తుంది. తెలుగులో జాబితా సందర్భానికి సహజంగా ఉండేందుకు ‘కి వచ్చింది’ అని అనువదించాం.
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: మూలపదం ప్రత్యేకంగా మగ సంతానాన్ని సూచిస్తుంది; అందువల్ల సాధారణమైన ‘పిల్లలు’కు బదులు ‘కుమారులు’ అని ఇచ్చాం.
- source_word: וְאֶחָיו
  choice: అతని సహోదరులు
  rationale: సాధారణ అర్థమైన ‘అతని సహోదరులు’ను నిలిపాం; విస్తృత బంధుత్వార్థాన్ని సందర్భం తప్పనిసరి చేయదు.
- source_word: שְׁנֵים עָשָׂר
  choice: మొత్తం పన్నెండు మంది
  rationale: చివరి సంఖ్య ఈ బృందంలోని మొత్తం వ్యక్తుల సంఖ్యను తెలియజేస్తుంది. తెలుగులో అర్థం స్పష్టంగా ఉండేందుకు ‘మొత్తం’ మరియు వ్యక్తులను సూచించే ‘మంది’ చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన జాబితా శైలిని వాడాం. మూలంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు నిలిపి, తెలుగులో వాక్యార్థం స్పష్టంగా ఉండేందుకు ‘వచ్చింది’, ‘మొత్తం’, ‘మంది’ వంటి సందర్భసహజ పదాలను ఉపయోగించాం.
