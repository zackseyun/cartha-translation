  text: The fourth[a], to Izri, his sons and his brothers, twelve.
translation:
  language: te
  text: నాలుగవది[a], ఇజ్రీకి, అతని కుమారులు మరియు అతని సహోదరులు పన్నెండు మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సందర్భాన్ని మరింత స్పష్టంగా చెప్పాలంటే, “నాలుగవ చీటి ఇజ్రీకి వచ్చింది.” “చీటి” అనే పదం చుట్టుపక్కల ఉన్న జాబితా వల్ల అర్థమవుతుంది గాని ఈ వచనంలో ప్రత్యక్షంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְבִיעִי
  choice: నాలుగవది
  rationale: ఇది క్రమసంఖ్య మాత్రమే; సందర్భంలోని చీటి/వంతు భావం ఈ వచనంలో ప్రత్యక్షంగా చెప్పబడలేదు. జాబితా సంక్షిప్తతను నిలుపుతూ దానిని ప్రధాన పాఠ్యంలో అంతర్లీనంగానే ఉంచాం.
- source_word: לַיִּצְרִי
  choice: ఇజ్రీకి
  rationale: לְ ఉపసర్గ ఈ జాబితాలో కేటాయింపును సూచిస్తుంది; తెలుగులో చతుర్థీ విభక్తి ‘కి’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: హీబ్రూ పదం ప్రత్యేకంగా కుమారులను సూచిస్తుంది; అందువల్ల సాధారణ ‘పిల్లలు’ అని విస్తరించలేదు.
- source_word: וְאֶחָיו
  choice: అతని సహోదరులు
  rationale: אָח పదానికి ప్రత్యక్ష అర్థం సహోదరుడు. ఈ సందర్భంలో బంధువులు లేదా సహచరులు అనే విస్తృత భావం సాధ్యమైనా, మూలపాఠ్యానికి దగ్గరగా ‘సహోదరులు’ ఎంచుకున్నాం.
- source_word: שְׁנֵים עָשָׂר
  choice: కలిపి పన్నెండు మంది
  rationale: ఇది బృందపు మొత్తం సంఖ్య. తెలుగులో లెక్కించబడుతున్నవారు మనుషులని స్పష్టంగా, సహజంగా తెలియజేయడానికి ‘కలిపి’ మరియు ‘మంది’ చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి/పాలనా జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. మూలంలోని అసంపూర్ణ వాక్య నిర్మాణాన్ని సాధ్యమైనంతగా నిలుపుతూ, తెలుగులో సంఖ్యా సమాహారం స్పష్టంగా ఉండేందుకు ‘కలిపి పన్నెండు మంది’ వాడబడింది.
