source:
  edition: WLC
  text: לִ/בְנֵ֣י אָסָ֗ף זַכּ֧וּר וְ/יוֹסֵ֛ף וּ/נְתַנְיָ֥ה וַ/אֲשַׂרְאֵ֖לָה בְּנֵ֣י אָסָ֑ף עַ֚ל יַד אָסָ֔ף הַ/נִּבָּ֖א עַל יְדֵ֥י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/002.yaml
  text: 'Of the sons of Asaph: Zaccur[a], Joseph, Nethaniah, and Asharelah, sons of Asaph, under the direction of Asaph, who prophesied under the direction of the king.'
translation:
  language: te
  text: ఆసాపు కుమారులలో జక్కూరు, యోసేపు, నెతన్యా, అశరేలా ఉన్నారు; వీరు ఆసాపు కుమారులు, రాజు ఆదేశానుసారం ప్రవచించిన ఆసాపు ఆధ్వర్యంలో ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆసాపు చేతి ద్వారా ... రాజు చేతి ద్వారా.” ఈ హీబ్రూ నుడికారం కార్యసాధకత్వం, పర్యవేక్షణ లేదా నిర్దేశాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אָסָף
  choice: ఆసాపు కుమారులలో
  rationale: జాబితాలోని ఉపవిభాగాన్ని పరిచయం చేసే לְ ఉపసర్గ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: זַכּוּר וְיוֹסֵף וּנְתַנְיָה וַאֲשַׂרְאֵלָה
  choice: జక్కూరు, యోసేపు, నెతన్యా, అశరేలా
  rationale: హీబ్రూ వ్యక్తినామాలను ఆధునిక తెలుగు బైబిలు శైలికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בְּנֵי אָסָף
  choice: వీరు ఆసాపు కుమారులు
  rationale: మూలంలో పునరుక్తమైన వంశసంబంధ సూచనను తొలగించకుండా, తెలుగులో స్పష్టమైన వాక్యంగా నిలిపాం.
- source_word: עַל יַד אָסָף
  choice: ఆసాపు పర్యవేక్షణలో
  rationale: ‘చేతి ద్వారా/చేతి కింద’ అనే హీబ్రూ నుడికారం ఇక్కడ పర్యవేక్షణ, నిర్వహణ లేదా అధికారాన్ని సూచిస్తుంది.
- source_word: הַנִּבָּא
  choice: ప్రవచించాడు
  rationale: נבא అనే క్రియ యొక్క ప్రవచనార్థాన్ని ఆలయ సంగీత సందర్భమని చెప్పి కేవలం ‘పాడాడు’గా కుదించకుండా నిలిపాం.
- source_word: עַל יְדֵי הַמֶּלֶךְ
  choice: రాజు ఆదేశం ప్రకారం
  rationale: ఇక్కడ అదే నుడికారం రాజునుండి వచ్చిన అధికారపూర్వక నిర్దేశాన్ని సూచిస్తుంది; సహజమైన తెలుగులో ఆ భావాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఆలయ సంగీత పరిచర్య సందర్భంలో ‘ప్రవచించడం’ అనే పదం అర్థం
  choice: ప్రవచించాడు
  alternative: ప్రేరేపిత సంగీతం చేశాడు; ప్రవచనాత్మకంగా పాడాడు
  rationale: దినవృత్తాంతకర్త ఉపయోగించిన נבא పదంలోని ధార్మిక బలాన్ని నిలిపి, దాన్ని కేవలం సంగీత ప్రదర్శనగా మార్చలేదు. సందర్భం సంగీత పరిచర్యతో దాని సంబంధాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. మూలంలోని పునరుక్తిని స్పష్టతతో నిలిపి, హీబ్రూ నుడికారాన్ని సహజంగా అనువదించాం.
