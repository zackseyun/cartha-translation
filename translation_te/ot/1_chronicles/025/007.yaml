source:
  edition: WLC
  text: וַ/יְהִ֤י מִסְפָּרָ/ם֙ עִם אֲחֵי/הֶ֔ם מְלֻמְּדֵי שִׁ֖יר לַ/יהוָ֑ה כָּל הַ֨/מֵּבִ֔ין מָאתַ֖יִם שְׁמוֹנִ֥ים וּ/שְׁמוֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/007.yaml
  text: Their number[a], together with their brothers who were trained in singing to Yahweh, all who were skillful[b], was two hundred eighty-eight.
translation:
  language: te
  text: వారి సంఖ్య, యాహ్వేకు[a] గానం చేయడంలో శిక్షణ పొందిన వారి సహోదరులతో కలిపి—వారందరూ నైపుణ్యం గలవారు[b]—రెండువందల ఎనభై ఎనిమిది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యాహ్వే కోసం.’ ఈ సంగీతసేవ సందర్భంలో హీబ్రూ ఉపసర్గ దిశను లేదా ఉద్దేశాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అవగాహన గలవారందరూ’; అంటే సంగీతసేవలో సమర్థులు లేదా ప్రవీణులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפָּרָם
  choice: వారి సంఖ్య
  rationale: ప్రత్యయంతో ఉన్న నామవాచకం లెక్కించబడిన వారి మొత్తం సంఖ్యను సూచిస్తుంది; ‘వారి సంఖ్య’ సహజంగానూ మూలానికి సమీపంగానూ ఉంది.
- source_word: עִם אֲחֵיהֶם
  choice: వారి సహోదరులతో కలిపి
  rationale: עִם సహవాసాన్ని లేదా కలిపి లెక్కించడాన్ని సూచిస్తుంది; ఈ పురుష లేవీయ సంగీతసేవ సందర్భంలో אֲחֵיהֶם ను ‘సహోదరులు’గా ఉంచాం.
- source_word: מְלֻמְּדֵי שִׁיר
  choice: గానం చేయడంలో శిక్షణ పొందిన
  rationale: למד ధాతువు యొక్క నిష్క్రియార్థక రూపం బోధించబడిన లేదా శిక్షణ పొందిన వారిని సూచిస్తుంది; שִׁיר ఇక్కడ పాట/గానం అనే భావంలో ఉంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: לְ ఉపసర్గ గానం ఎవరికి అర్పించబడుతుందో లేదా ఏ ఉద్దేశంతో చేయబడుతుందో సూచించగలదు; יהוה అనే దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- source_word: כָּל הַמֵּבִין
  choice: వారందరూ నైపుణ్యం గలవారే
  rationale: בין రూపం ఈ సంగీతసేవలో కేవలం అర్థం చేసుకోవడమే కాక సామర్థ్యం, ప్రావీణ్యం కలిగి ఉండడాన్ని సూచిస్తుంది. ‘వారందరూ’ כָּל యొక్క సమగ్రతను నిలుపుతుంది.
- source_word: מָאתַיִם שְׁמוֹנִים וּשְׁמוֹנָה
  choice: రెండువందల ఎనభై ఎనిమిది
  rationale: హీబ్రూ సంఖ్యాక్రమం నేరుగా 288ను సూచిస్తుంది; తెలుగు బైబిలు శైలికి అనుగుణంగా పదాలతో రాశాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో చతురక్షర దైవనామం నేరుగా ఉంది. సాధారణ బిరుదుగా మార్చకుండా దేవుని ఒడంబడిక నామాన్ని గుర్తించేందుకు ‘యాహ్వే’గా ఇచ్చాం.
- issue: לַיהוָה లోని సంబంధం
  choice: యాహ్వేకు గానం చేయడం
  alternative: యాహ్వే కోసం గానం చేయడం
  rationale: לְ దిశను, గ్రహీతను లేదా ఉద్దేశాన్ని సూచించగలదు. ప్రధాన పాఠంలో గానం యాహ్వేకు అర్పించబడుతుందనే సహజ పఠనాన్ని ఉంచి, ఉద్దేశార్థక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. మూలంలోని లెక్కింపు నిర్మాణాన్ని నిలుపుతూ, మధ్యలోని వివరణాత్మక భాగాన్ని డాష్‌లతో స్పష్టంచేశాం. ‘నైపుణ్యం’ అనే సందర్భార్థాన్ని ప్రధాన పాఠంలో ఉంచి, అక్షరార్థానికి దగ్గరైన ‘అవగాహన’ను పాదటిప్పణిలో ఇచ్చాం.
