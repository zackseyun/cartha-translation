source:
  edition: WLC
  text: לִ/ידוּת֑וּן בְּנֵ֣י יְדוּת֡וּן גְּדַלְיָ֡הוּ וּ/צְרִ֡י וִֽ֠/ישַׁעְיָהוּ חֲשַׁבְיָ֨הוּ וּ/מַתִּתְיָ֜הוּ שִׁשָּׁ֗ה עַל֩ יְדֵ֨י אֲבִי/הֶ֤ם יְדוּתוּן֙ בַּ/כִּנּ֔וֹר הַ/נִּבָּ֕א עַל הֹד֥וֹת וְ/הַלֵּ֖ל לַ/יהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/003.yaml
  text: 'Of Jeduthun: the sons of Jeduthun—Gedaliah, Zeri, Jeshaiah, Hashabiah, and Mattithiah, six—under the direction of their father Jeduthun, who prophesied with the lyre in giving thanks and praise to Yahweh.'
translation:
  language: te
  text: 'యెదూతూను వర్గంవారు: యెదూతూను కుమారులు గెదల్యా, జెరీ, యెషయా, హషబ్యా, మత్తిత్యా—ఆరుగురు[a]. వీరు తమ తండ్రియైన యెదూతూను ఆధ్వర్యంలో ఉండేవారు. యెదూతూను కిన్నోరు అనే తంతివాద్యంతో ప్రవచిస్తూ, యెహోవాకు కృతజ్ఞతలు చెల్లిస్తూ స్తుతించేవాడు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ఇక్కడ ఐదు పేర్లు మాత్రమే ఉన్నాయి; అయినా ‘ఆరుగురు’ అని ఉంది. జాబితాలో మరో కుమారుని పేరు విడిచిపోయి ఉండవచ్చని, లేదా యెదూతూనునే ఆరవ వ్యక్తిగా లెక్కించి ఉండవచ్చని కొందరు భావిస్తారు.
    reason: textual_variant
  - marker: b
    text: లేదా, “యెహోవాకు కృతజ్ఞతలు చెల్లించడం, స్తుతించడం కోసం కిన్నోరు అనే తంతివాద్యంతో ప్రవచించేవాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִידוּתוּן
  choice: యెదూతూనుకు చెందినవారు
  rationale: లְ ఉపసర్గ ఇక్కడ జాబితాలో యెదూతూను వర్గాన్ని పరిచయం చేస్తుంది; తెలుగు పాఠకులకు సహజంగా ఉండేలా సంబంధార్థాన్ని స్పష్టపరిచాం.
- source_word: בְּנֵי יְדוּתוּן
  choice: యెదూతూను కుమారులు
  rationale: కుటుంబ లేదా వంశ సంబంధాన్ని తెలిపే మూలభాషా రూపాన్ని నేరుగా నిలిపాం.
- source_word: גְּדַלְיָהוּ וּצְרִי וִישַׁעְיָהוּ חֲשַׁבְיָהוּ וּמַתִּתְיָהוּ
  choice: గెదల్యా, జెరీ, యెషయా, హషబ్యా, మత్తిత్యా
  rationale: పేర్లను ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
- source_word: שִׁשָּׁה
  choice: మొత్తం ఆరుగురు
  rationale: మసొరెటిక్ పాఠంలో ఐదు పేర్లు మాత్రమే ఉన్నప్పటికీ ‘ఆరుగురు’ అని స్పష్టంగా ఉంది; విరుద్ధతను సరిచేయకుండా నిలిపి పాదటిప్పణిలో వివరించాం.
- source_word: עַל יְדֵי אֲבִיהֶם
  choice: తమ తండ్రి యెదూతూను నిర్దేశంలో
  rationale: అక్షరార్థంగా ‘చేతుల కింద’ అనే నుడికారానికి ఈ పరిపాలనా, సంగీత సందర్భంలో పర్యవేక్షణ లేదా నిర్దేశం అనే భావం ఉంది.
- source_word: בַּכִּנּוֹר
  choice: కిన్నోరు అనే తంతివాద్యాన్ని వాయిస్తూ
  rationale: ప్రాచీన כִּנּוֹרును అస్పష్టంగా ‘వీణ’ లేదా ‘హార్పు’గా సమీకరించకుండా, దాని పేరును నిలిపి అది తంతివాద్యమని పాఠంలో స్పష్టం చేశాం.
- source_word: הַנִּבָּא
  choice: ప్రవచించి
  rationale: నבא క్రియకు గల సాధారణ ప్రవచనార్థాన్ని సంగీత సందర్భంలోనూ నిలిపాం; దాన్ని కేవలం సంగీత ప్రదర్శనగా తగ్గించలేదు.
- source_word: עַל הֹדוֹת וְהַלֵּל
  choice: కృతజ్ఞతలు చెల్లించి స్తుతించేవాడు
  rationale: ఈ పదబంధం ప్రవచన సంగీతపు విషయం లేదా ఉద్దేశాన్ని సూచించవచ్చు; ప్రధాన పాఠంలో సహజమైన తెలుగు రూపాన్ని ఇచ్చి ప్రత్యామ్నాయ నిర్మాణాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: దైవనామమైన יהוהను తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపంలో వ్యక్తిగత నామంగా నిలిపాం.
theological_decisions:
- issue: ఆలయ సంగీతంలో ‘ప్రవచించడం’ అనే పదం అర్థం
  choice: ‘ప్రవచించి’ అనే ప్రత్యక్ష ప్రవచన పదాన్ని నిలిపాం.
  alternative: ‘దైవప్రేరణతో సంగీతం వాయించి’ లేదా ‘ప్రవచనాత్మకంగా పాడి’
  rationale: వృత్తాంతకర్త ఆలయ సంగీత సేవను ఉద్దేశపూర్వకంగా ప్రవచన భాషలో వర్ణిస్తున్నాడు. దాన్ని కేవలం ప్రేరణాత్మక సంగీతంగా మార్చకుండా మూలంలోని దైవశాస్త్ర సంబంధమైన ఉద్వేగాన్ని నిలిపాం.
- issue: ఐదు పేర్ల తరువాత ‘ఆరుగురు’ అన్న సంఖ్య
  choice: ‘ఆరుగురు’ను ప్రధాన పాఠంలో యథాతథంగా నిలిపాం.
  alternative: ఐదుగురు అని సవరించడం లేదా యెదూతూనును ఆరవ వ్యక్తిగా పాఠంలో చేర్చడం
  rationale: మూలపాఠం సమస్యను ఏదో ఒక ఊహతో నిశ్శబ్దంగా పరిష్కరించకుండా, నిజమైన పాఠ్య అస్పష్టతను పాదటిప్పణితో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. జాబితా ధోరణిని నిలిపి, పొడవైన హీబ్రూ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం. ‘కిన్నోరు’కు వెంటనే ‘తంతివాద్యం’ అనే వివరణ ఇచ్చి ప్రాచీన వాద్యపు ప్రత్యేకతను, పఠన సౌలభ్యాన్ని రెండింటినీ కాపాడాం.
