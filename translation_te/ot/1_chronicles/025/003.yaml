revisions:
- from: 'యెదూతూనుకు చెందినవారు: యెదూతూను కుమారులు గెదల్యా, జెరీ, యెషయా, హషబ్యా, మత్తిత్యా—మొత్తం ఆరుగురు[a]. వీరు తమ తండ్రి యెదూతూను నిర్దేశంలో ఉన్నారు. అతడు కిన్నోరు అనే తంతివాద్యాన్ని వాయిస్తూ ప్రవచించి, యెహోవాకు కృతజ్ఞతలు చెల్లించి స్తుతించేవాడు[b].'
  to: 'యెదూతూను వర్గంవారు: యెదూతూను కుమారులు గెదల్యా, జెరీ, యెషయా, హషబ్యా, మత్తిత్యా—ఆరుగురు[a]. వీరు తమ తండ్రియైన యెదూతూను ఆధ్వర్యంలో ఉండేవారు. యెదూతూను కిన్నోరు అనే తంతివాద్యంతో ప్రవచిస్తూ, యెహోవాకు కృతజ్ఞతలు చెల్లిస్తూ స్తుతించేవాడు[b].'
  rationale: సంఖ్యకు సంబంధించిన మూలపాఠ అస్పష్టతను, పేర్లను, యెహోవా దైవనామాన్ని, సంగీత సందర్భంలోని ‘ప్రవచించడం’ను మార్చకుండా ఉంచాం. యెదూతూను ప్రవచన కార్యాన్ని స్పష్టమైన కొనసాగు క్రియారూపంతో సవరించాం; వాద్యాన్ని సూచించే నిర్మాణాన్ని కూడా మరింత సహజమైన తెలుగులో ఇచ్చాం.
