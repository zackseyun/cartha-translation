  yaml_path: translation/ot/1_chronicles/025/012.yaml
  text: The fifth was Nethaniah[a]; his sons and his brothers were twelve.
translation:
  language: te
  text: ఐదవది నెతన్యాహు[a]; అతని కుమారులూ అతని సహోదరులూ మొత్తం పన్నెండుమంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సందర్భానుసారం, “ఐదవ చీటి నెతన్యాహుకు వచ్చింది.” ఈ వచనంలోని హీబ్రూ పాఠ్యంలో “చీటి,” “వచ్చింది” వంటి పదాలు లేవు; చుట్టుపక్కల ఉన్న జాబితాను బట్టి అవి గ్రహించబడతాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: ఐదవవాడు
  rationale: నిర్దేశక ప్రత్యయంతో ఉన్న క్రమసంఖ్య ఈ జాబితాలో సంక్షిప్తంగా వాడబడింది. సందర్భం చీట్ల క్రమాన్ని సూచించినా, ఈ వచనంలో ‘చీటి’ లేదా ‘వంతు’ అనే నామవాచకం ప్రత్యక్షంగా లేదు; అందువల్ల ప్రధాన పాఠ్యంలో దాన్ని చేర్చలేదు.
- source_word: נְתַנְיָהוּ
  choice: నెతన్యాహు
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: בנים అనే పుంలింగ బహువచనం ఇక్కడ ‘కుమారులు’ అని నిర్దిష్టంగా సూచిస్తుంది.
- source_word: וְאֶחָיו
  choice: అతని సహోదరులు
  rationale: אחים అనే పదానికి ఈ జాబితా సందర్భంలో సహజమైన అర్థం ‘సహోదరులు’; విస్తృతమైన ‘బంధువులు’ అనే అర్థాన్ని అవసరం లేకుండా తీసుకోలేదు.
- source_word: שְׁנֵים עָשָׂר
  choice: మొత్తం పన్నెండు మంది
  rationale: చివరనున్న సంఖ్య పేర్కొన్న సమూహపు మొత్తం సంఖ్యను తెలియజేస్తుంది. మనుషులను లెక్కించేందుకు ‘మంది’, వాక్యస్పష్టతకు ‘మొత్తం’ చేర్చడం సహజ తెలుగు ప్రయోగం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన జాబితా శైలిని ఉపయోగించాం. మూలంలోని సంక్షిప్త నిర్మాణాన్ని నిలుపుతూ, సంఖ్య మనుషుల మొత్తాన్ని సూచిస్తుందని సహజంగా తెలియజేయడానికి ‘మొత్తం’ మరియు ‘మంది’ వాడాం.
