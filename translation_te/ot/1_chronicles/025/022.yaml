source:
  edition: WLC
  text: לַ/חֲמִשָּׁ֤ה עָשָׂר֙ לִֽ/ירֵמ֔וֹת בָּנָ֥י/ו וְ/אֶחָ֖י/ו שְׁנֵ֥ים עָשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/022.yaml
  text: 'For the fifteenth[a], to Jeremoth: his sons and his brothers[b], twelve.'
translation:
  language: te
  text: 'పదిహేనవది[a] యెరేమోతుకు[b]: అతని కుమారులు, అతని సోదరులు—పన్నెండుమంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘పదిహేనవది, యెరేమోతుకు.’ ఈ అధ్యాయంలోని పునరావృత నమూనా ప్రకారం ‘చీటి’ అనే మాట భావంలో ఉంది; అయితే ఇక్కడి హీబ్రూ పాఠ్యంలో అది ప్రత్యక్షంగా లేదు.
    reason: cross_reference
  - marker: b
    text: ‘యెరేమోతు కొరకు’ అని కూడా అనువదించవచ్చు. ఈ జాబితాలో హీబ్రూ ఉపసర్గ కేటాయింపును సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחֲמִשָּׁה עָשָׂר
  choice: పదిహేనవది
  rationale: అధ్యాయమంతటా పునరావృతమయ్యే చీట్ల కేటాయింపు సూత్రంలో ఇది క్రమసంఖ్యార్థక పదబంధం. హీబ్రూలో ఇక్కడ ‘చీటి’ అనే పదం ప్రత్యక్షంగా లేదు కాబట్టి ప్రధాన పాఠ్యంలో చేర్చలేదు; తెలుగు వాక్యానికి సహజంగా ఉండేందుకు ‘పదిహేనవది’ అని ఇచ్చాం.
- source_word: לִירֵמוֹת
  choice: యెరేమోతుకు
  rationale: ముందున్న לְ ఉపసర్గ ఈ జాబితాలో కేటాయింపును లేదా దిశను సూచిస్తుంది. అందువల్ల ‘యెరేమోతుకు’ అని అనువదించాం.
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: హీబ్రూ పదం ప్రత్యేకంగా పురుష సంతానాన్ని సూచిస్తుంది; అందువల్ల ‘పిల్లలు’ కాకుండా ‘కుమారులు’ అని ఇచ్చాం.
- source_word: וְאֶחָיו
  choice: అతని సహోదరులు
  rationale: మూలార్థం ‘అతని సోదరులు’. గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగులో ‘సహోదరులు’ సహజంగా ఉంటుంది; సందర్భానుసారం సమీప పురుష బంధువులు లేదా వంశసహచరులు అనే విస్తృత భావం ఉండవచ్చు.
- source_word: שְׁנֵים עָשָׂר
  choice: మొత్తం పన్నెండుమంది
  rationale: ఇది యెరేమోతుతో అనుబంధించిన కుమారులు, సహోదరుల సంఖ్యను తెలిపే సాధారణ సంఖ్య. వ్యక్తుల లెక్క అని స్పష్టమయ్యేందుకు ‘మంది’, సంఖ్య మొత్తం అని సహజంగా తెలియజేయడానికి ‘మొత్తం’ వాడాం.
