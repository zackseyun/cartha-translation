translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జాబితా శైలిని నిలిపాం. మూలంలోని విభక్తి సంబంధం, ‘చీటి’ అనే ఊహిత పదం విషయంలోని అస్పష్టతను పాదటిప్పణుల్లో చూపించాం. వ్యక్తుల సంఖ్యకు సహజమైన ‘పన్నెండుమంది’ రూపాన్ని వాడాం.
