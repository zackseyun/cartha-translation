lexical_decisions:
- source_word: הַתְּשִׁיעִי
  choice: తొమ్మిదవ వంతు
  rationale: నిర్దిష్ట ఆర్టికల్‌తో ఉన్న క్రమసంఖ్య ఇక్కడ చీట్ల ద్వారా నిర్ణయించిన సేవా వంతును సూచిస్తూ సంక్షిప్తంగా వాడబడింది. తెలుగు పాఠకులకు జాబితా భావం స్పష్టంగా ఉండేందుకు అంతర్లీన నామవాచకాన్ని ‘వంతు’గా వ్యక్తం చేశాం.
- source_word: מַתַּנְיָהוּ
  choice: మత్తన్యాహు
  rationale: హీబ్రూ వ్యక్తినామ రూపాన్ని తెలుగులో సాధ్యమైనంత దగ్గరగా లిప్యంతరీకరించాం.
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: హీబ్రూ పదం సాధారణంగా పురుష సంతానాన్ని, ‘కుమారులను’, స్పష్టంగా సూచిస్తుంది.
- source_word: וְאֶחָיו
  choice: అతని సహోదరులు
  rationale: మూలపదపు ప్రాథమిక అర్థమైన పురుష సహోదరులను నిలిపాం; ఈ సందర్భంలో బంధువులు లేదా వంశసహచరులు అనే విస్తృత భావం ఉండవచ్చనే అవకాశాన్ని అనవసరంగా పాఠ్యంలో నిర్ణయించలేదు.
- source_word: שְׁנֵים עָשָׂר
  choice: కలిపి పన్నెండుగురు
  rationale: ఈ సంఖ్య పేరు చెప్పబడిన నాయకుని కుమారులు, సహోదరుల మొత్తం సంఖ్యను సూచిస్తుంది. వ్యక్తుల లెక్క కాబట్టి ‘గురు’ వాడి, సంబంధాన్ని సహజ తెలుగులో స్పష్టం చేయడానికి ‘కలిపి’ చేర్చాం.
