  text: The seventh fell to Jesharelah[a]; his sons and his brothers were twelve.
translation:
  language: te
  text: ఏడవ చీటి యెషరేలాకు పడింది[a]; అతని కుమారులు, అతని సహోదరులు మొత్తం పన్నెండుమంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఏడవది—యెషరేలా, అతని కుమారులు, అతని సహోదరులు—పన్నెండుమంది.” “పడింది” అనే క్రియను చుట్టుపక్కల వచనాల్లో పదేపదే వచ్చే చీట్ల కేటాయింపు సూత్రం ఆధారంగా చేర్చాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁבִעִי
  choice: ఏడవది
  rationale: ఇది చీట్ల క్రమంలోని సంఖ్యావాచక పదం; ‘చీటి’ అనే నామవాచకం సందర్భం వల్ల అంతర్లీనంగా ఉంది.
- source_word: יְשַׂרְאֵלָה
  choice: యెషరేలా
  rationale: వ్యక్తి పేరును అనువదించకుండా, హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: హీబ్రూ పదం ప్రత్యేకంగా కుమారులను సూచిస్తుంది; అందువల్ల లింగనిర్దిష్ట భావాన్ని నిలిపాం.
- source_word: וְאֶחָיו
  choice: అతని సహోదరులు
  rationale: సాధారణ అర్థం ‘అతని సహోదరులు’; ఈ జాబితాలో విస్తృత పురుష బంధువుల భావం సాధ్యమైనా, మూలపదానికి దగ్గరైన అర్థాన్ని ఎంచుకున్నాం.
- source_word: שְׁנֵים עָשָׂר
  choice: మొత్తం పన్నెండుమంది
  rationale: కుమారులు, సహోదరులు కలిపిన బృందసంఖ్యను సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: '[implied allotment formula]'
  choice: వంతైంది
  rationale: హీబ్రూ వాక్యంలో క్రియ లేకపోయినా, చుట్టుపక్కల వచనాల్లోని చీట్ల కేటాయింపు సూత్రం ఈ భావాన్ని సూచిస్తుంది; తెలుగులో ‘వంతైంది’ సహజంగా ఆ అంతర్లీన భావాన్ని అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలిలోని సంక్షిప్తతను కాపాడుతూ సహజంగా చదివేలా అనువదించాం. వ్యక్తి పేరు హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించబడింది; అంతర్లీన క్రియను పాదసూచికలో వెల్లడించాం.
