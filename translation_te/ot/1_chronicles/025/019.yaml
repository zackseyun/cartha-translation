lexical_decisions:
- source_word: הַשְּׁנֵים עָשָׂר
  choice: పన్నెండవ వంతు
  rationale: ఈ అధ్యాయంలో చీట్ల క్రమం వరుసగా లెక్కించబడుతున్నందున, రూపానికి సంఖ్యావాచకంగా ఉన్నా సందర్భంలో ఇది క్రమసంఖ్యార్థాన్ని ఇస్తుంది. తెలుగులో జాబితా నిర్మాణాన్ని సహజంగా తెలియజేయడానికి ‘పన్నెండవ వంతు’ అని అనువదించబడింది.
- source_word: לַחֲשַׁבְיָה
  choice: హషబ్యాకు వచ్చింది
  rationale: ఉపసర్గ ל చీటి ద్వారా హషబ్యాకు జరిగిన కేటాయింపును సూచిస్తుంది. ‘హషబ్యాకు వచ్చింది’ అనేది తెలుగు వాక్యప్రయోగంలో ఆ కేటాయింపును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: חֲשַׁבְיָה
  choice: హషబ్యా
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో లిప్యంతరీకరించబడింది.
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: בנים ఇక్కడ పురుష సంతానాన్ని సూచిస్తుంది; అందువల్ల ‘కుమారులు’ మూలార్థాన్ని కచ్చితంగా నిలుపుతుంది.
- source_word: וְאֶחָיו
  choice: అతని సహోదరులు
  rationale: אחים యొక్క ప్రాథమిక అర్థమైన ‘సోదరులు/సహోదరులు’ను నిలిపి, గౌరవప్రదమైన ఆధునిక తెలుగు రూపంగా ‘సహోదరులు’ ఎంచుకోబడింది.
- source_word: שְׁנֵים עָשָׂר
  choice: కలిపి పన్నెండు మంది
  rationale: చివరి సంఖ్య నియమించబడిన సమూహంలోని మొత్తం వ్యక్తుల సంఖ్యను తెలియజేస్తుంది. తెలుగులో స్పష్టత కోసం ‘కలిపి’ మరియు వ్యక్తులను లెక్కించే ‘మంది’ చేర్చబడ్డాయి.
