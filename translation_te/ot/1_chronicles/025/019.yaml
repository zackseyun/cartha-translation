  text: హషబ్యాకు[a] పన్నెండవ చీటి పడింది; అతని కుమారులు, అతని సోదరులు పన్నెండు మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పన్నెండు హషబ్యాకు” అని కూడా చదవవచ్చు. అయితే ఈ అధ్యాయంలో చీట్లు వరుస క్రమంలో ఇవ్వబడ్డాయి కాబట్టి, ఇక్కడ “పన్నెండవ” అనే అర్థమే సందర్భానికి సరిపోతుంది.
