id: 1CH.25.23
reference: 1 Chronicles 25:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לְ/שִׁשָּׁ֤ה עָשָׂר֙ לַ/חֲנַנְיָ֔הוּ בָּנָ֥י/ו וְ/אֶחָ֖י/ו שְׁנֵ֥ים עָשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/023.yaml
  text: The sixteenth was for Hananyahu[a], his sons and his brothers[b], twelve.
translation:
  language: te
  text: పదహారవది[a] హనన్యాహుకు వచ్చింది; అతని కుమారులు, అతని సోదరులు కలిపి పన్నెండుమంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ సందర్భంలో ‘పదహారవ చీటి’ అని మరింత స్పష్టంగా చెప్పవచ్చు. ‘చీటి’ అనే మాట చుట్టుపక్కల వచనాలనుబట్టి అర్థమవుతుంది; అయితే ఈ వచనంలోని హీబ్రూ పాఠ్యంలో అది ప్రత్యక్షంగా లేదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠ్యం సంక్షిప్తంగా ‘పన్నెండు’ అని మాత్రమే చెబుతుంది; ఇది హనన్యాహు, అతని కుమారులు, అతని సోదరులు కలిసిన సమూహపు మొత్తం సంఖ్య.
    reason: clarification
lexical_decisions:
- source_word: לְשִׁשָּׁה עָשָׂר
  choice: పదహారవది ... వచ్చింది
  rationale: ఈ సందర్భంలో לְ తో కూడిన క్రమసంఖ్య చీట్ల క్రమంలో కేటాయింపును సూచిస్తుంది. సహజమైన తెలుగు వాక్యనిర్మాణం కోసం ‘వచ్చింది’ చేర్చబడింది; ‘చీటి’ అనే పదం ఈ వచనంలోని హీబ్రూలో ప్రత్యక్షంగా లేదు.
- source_word: לַחֲנַנְיָהוּ
  choice: హనన్యాహు
  rationale: חֲנַנְיָהוּ అనే హీబ్రూ పేరులోని దీర్ఘ రూపాన్ని దగ్గరగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: ఈ వంశావళి/జాబితా సందర్భంలో בָּנִים మగ సంతానాన్ని, అంటే కుమారులను, సూచిస్తుంది.
- source_word: וְאֶחָיו
  choice: అతని సోదరులు
  rationale: אָח యొక్క ప్రత్యక్ష అర్థం ‘సోదరుడు’; ఈ సందర్భంలో విస్తృత బంధుత్వ భావం సాధ్యమైనా, అధ్యాయమంతటా వచ్చే సూత్రబద్ధ వాక్యానికి ‘సోదరులు’ సరిపోతుంది.
- source_word: שְׁנֵים עָשָׂר
  choice: కలిపి పన్నెండుమంది
  rationale: చివరి సంఖ్య ముందున్న సమూహపు మొత్తం సంఖ్యను తెలుపుతుంది. తెలుగులో అది స్పష్టంగా, సహజంగా ఉండేందుకు ‘కలిపి’ మరియు వ్యక్తులను లెక్కించే ‘మంది’ వాడబడ్డాయి.
