  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలిలోని సంక్షిప్తతను సాధ్యమైనంతవరకు నిలిపి ఉంచుతూ సహజంగా చదవడానికి అవసరమైన క్రియను, సంఖ్యాసూచక పదాలను మాత్రమే చేర్చాం.
