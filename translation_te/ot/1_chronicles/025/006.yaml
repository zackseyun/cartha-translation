reference: 1 Chronicles 25:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּל אֵ֣לֶּה עַל יְדֵי֩ אֲבִי/הֶ֨ם בַּ/שִּׁ֜יר בֵּ֣ית יְהוָ֗ה בִּ/מְצִלְתַּ֨יִם֙ נְבָלִ֣ים וְ/כִנֹּר֔וֹת לַ/עֲבֹדַ֖ת בֵּ֣ית הָ/אֱלֹהִ֑ים עַ֚ל יְדֵ֣י הַ/מֶּ֔לֶךְ אָסָ֥ף וִ/ידוּת֖וּן וְ/הֵימָֽן־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/006.yaml
  text: 'All these were under the direction of their father in the music of the house of Yahweh[a], with cymbals, harps, and lyres, for the service of the house of God, under the direction of the king: Asaph, Jeduthun[c][b], and Heman.'
translation:
  language: te
  text: వీరందరూ యాహ్వే మందిర సంగీతంలో[b] తమ తండ్రి ఆధ్వర్యంలో[a], తాళాలు, వీణలు, కిన్నెరలతో[c] దేవుని మందిర సేవ కొరకు రాజు, ఆసాపు, యెదూతూను, హేమాను ఆధ్వర్యంలో ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘తమ తండ్రి చేతి కింద’; ఈ హీబ్రూ నుడికారం ఆధ్వర్యం, పర్యవేక్షణ లేదా కార్యసాధనను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘పాటలో’ లేదా ‘గానంలో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘వీణలు,’ ‘కిన్నెరలు’గా అనువదించిన ప్రాచీన తంతివాద్యాల ఖచ్చితమైన స్వరూపం, వాటి మధ్య భేదం నిర్ధారించడం కష్టం.
    reason: cultural_note
lexical_decisions:
- source_word: עַל יְדֵי אֲבִיהֶם
  choice: తమ తండ్రి పర్యవేక్షణలో
  rationale: ‘చేతి కింద’ అనే అక్షరార్థ రూపం ఇక్కడ ఆధ్వర్యం లేదా పర్యవేక్షణను సూచించే హీబ్రూ నుడికారం. సంగీత సేవ నిర్వహణ సందర్భంలో ‘పర్యవేక్షణలో’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: בַּשִּׁיר
  choice: సంగీతంలో / వాయిస్తూ
  rationale: שׁיר అనే పదానికి ‘పాట’, ‘గానం’, ‘సంగీతం’ అనే భావాలు సాధ్యమైనవి. వాద్యాలు, మందిర సేవ ప్రస్తావనలో సమష్టి సంగీత సేవ భావాన్ని ప్రధాన పాఠం తెలియజేస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: בֵּית יְהוָה
  choice: యెహోవా మందిరం
  rationale: בֵּית అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఈ సందర్భంలో దేవాలయాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మందిరం’ సహజం. יהוה అనే దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: בִּמְצִלְתַּיִם
  choice: తాళాలు
  rationale: మందిర సంగీతంలో ఉపయోగించిన ఝాంఝల వంటి లోహ వాద్యాన్ని తెలుగులో సాధారణంగా అర్థమయ్యే ‘తాళాలు’తో అనువదించాం.
- source_word: נְבָלִים וְכִנֹּרוֹת
  choice: స్వరమండలాలు, కిన్నెరలు
  rationale: హీబ్రూ రెండు వేర్వేరు తంతివాద్యాలను పేర్కొంటుంది. వాటి భేదాన్ని నిలుపుతూ తెలుగు బైబిలు పాఠకులకు పరిచితమైన రెండు వేరు పేర్లు వాడాం; ఖచ్చితమైన ఆధునిక సమానార్థం అనిశ్చితమని పాదసూచిక తెలియజేస్తుంది.
- source_word: לַעֲבֹדַת בֵּית הָאֱלֹהִים
  choice: దేవుని మందిర సేవ చేశారు
  rationale: עֲבֹדָה ఇక్కడ ఆరాధనకు సంబంధించిన విధి లేదా సేవను సూచిస్తుంది. ‘మందిర సేవ’ ఆ సందర్భాన్ని సహజంగా అందిస్తుంది.
- source_word: עַל יְדֵי הַמֶּלֶךְ אָסָף וִידוּתוּן וְהֵימָן
  choice: రాజు, ఆసాఫు, యెదూతూను, హేమాను పర్యవేక్షణలో
  rationale: మూలపాఠం ఈ పేర్లన్నిటినీ עַל יְדֵי తరువాత ఉంచుతుంది. ఆధునిక విరామచిహ్నాలతో రాజును పేర్లకు వివరణగా మార్చకుండా, వారందరి పర్యవేక్షణ లేదా అధికార సంబంధాన్ని తెరిచి ఉంచాం.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలపాఠంలో ఒడంబడిక దైవనామం ప్రత్యక్షంగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా, ఆధునిక తెలుగు క్రైస్తవ వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఇచ్చాం.
- issue: చివరి అధికార సంబంధం
  choice: రాజు, ఆసాఫు, యెదూతూను, హేమాను పర్యవేక్షణలో
  alternative: రాజు ఆదేశం ప్రకారం ఆసాఫు, యెదూతూను, హేమాను పర్యవేక్షణలో
  rationale: ప్రత్యామ్నాయం సహజమైన పరిపాలనా శ్రేణిని స్పష్టం చేస్తుంది, కాని హీబ్రూ వాక్య నిర్మాణం ఆ సంబంధాన్ని అంత స్పష్టంగా విడదీయదు. అందువల్ల ప్రధాన పాఠం మూలంలోని సంక్షిప్తతను, సంభావ్య అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడాం. హీబ్రూ వాక్యంలోని పునరుక్త ‘పర్యవేక్షణలో’ నిర్మాణాన్ని నిలిపాం. అయితే [b] గుర్తు ‘వాయిస్తూ’ తర్వాత కనిపించినా, దాని పాదసూచిక మూలంలోని בַּשִּׁיר పదానికి సంబంధించిన ప్రత్యామ్నాయాన్ని వివరిస్తుంది.
