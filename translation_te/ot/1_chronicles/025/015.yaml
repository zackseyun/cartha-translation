translation:
  language: te
  text: ఎనిమిదవది యెషయాకు[a]; అతని కుమారులు, అతని సహోదరులు—మొత్తం పన్నెండుమంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎనిమిదవ చీటి యెషయాకు వచ్చింది; అతని కుమారులు, అతని సహోదరులు—మొత్తం పన్నెండుమంది.” ‘చీటి’ అనే పదం చుట్టుపక్కల ఉన్న జాబితా సందర్భం నుండి గ్రహించబడింది; ఈ వచనంలో అది ప్రత్యక్షంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁמִינִי
  choice: ఎనిమిదవది
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న క్రమసంఖ్య. ఈ అధ్యాయంలోని చీట్ల క్రమాన్ని సూచిస్తున్నప్పటికీ, ఈ వచనంలో ‘చీటి’ అనే పదం ప్రత్యక్షంగా లేదు; అందువల్ల ప్రధాన పాఠ్యంలో దానిని చేర్చలేదు.
- source_word: יְשַׁעְיָהוּ
  choice: యెషయా
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు నామరూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: בנים ఇక్కడ పురుష సంతానాన్ని స్పష్టంగా సూచిస్తుంది; అందువల్ల సాధారణ ‘పిల్లలు’ అనే రూపం కాకుండా ‘కుమారులు’ వాడాం.
- source_word: וְאֶחָיו
  choice: అతని సహోదరులు
  rationale: אחים యొక్క సహజమైన కుటుంబార్థాన్ని నిలుపుతూ, గౌరవప్రదమైన ఆధునిక తెలుగు రూపమైన ‘సహోదరులు’ వాడాం.
- source_word: שְׁנֵים עָשָׂר
  choice: మొత్తం పన్నెండుమంది
  rationale: ఇది సమూహంలోని వ్యక్తుల మొత్తం సంఖ్య. హెబ్రీలో క్రియ లేకపోయినా, తెలుగులో అర్థం సహజంగా స్పష్టమయ్యేందుకు ‘మొత్తం’ మరియు వ్యక్తుల సంఖ్యను తెలిపే ‘మంది’ చేర్చాం.
