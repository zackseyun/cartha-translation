  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలిలోని సంక్షిప్తతను సాధ్యమైనంతవరకు నిలిపి, సాధారణ పాఠకులకు సంఖ్యా సంబంధం స్పష్టంగా ఉండేలా రూపొందించాం.
