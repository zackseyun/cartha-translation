  yaml_path: translation/ot/1_chronicles/025/020.yaml
  text: The thirteenth[a], Shubael; his sons and his brothers, twelve.
translation:
  language: te
  text: పదమూడవది[a] షూబాయేలుకు; అతని కుమారులు, అతని సహోదరులు—మొత్తం పన్నెండుమంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పదమూడవదానికి షూబాయేలు.” చుట్టుపక్కల సందర్భాన్ని బట్టి “చీటి” అనే పదం ఇక్కడ సూచితమవుతోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹשָׁה עָשָׂר
  choice: పదమూడవది
  rationale: ఈ చీట్ల క్రమజాబితాలో לְ ఉపసర్గ కేటాయింపును సూచిస్తుంది. ‘చీటి’ అనే పదం ఈ వాక్యంలో ప్రత్యక్షంగా లేకపోవడంతో ప్రధాన పాఠ్యంలో చేర్చకుండా, సహజమైన తెలుగు జాబితా శైలిలో ‘పదమూడవది’ అని అనువదించాం.
- source_word: שׁוּבָאֵל
  choice: షూబాయేలు
  rationale: వ్యక్తి పేరును అనువదించకుండా, హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: హీబ్రూ పదం సాధారణంగా పిల్లలను కాక ప్రత్యేకంగా కుమారులను సూచిస్తుంది.
- source_word: וְאֶחָיו
  choice: అతని సహోదరులు
  rationale: మూలపదం పురుష సహోదరులను సూచిస్తుంది; ఈ సందర్భంలో బంధువులు లేదా అదే విభాగంలోని సహచరులు అనే విస్తృత భావం సాధ్యమైనా, మూలంలోని ప్రత్యక్ష అర్థాన్ని నిలిపాం.
- source_word: שְׁנֵים עָשָׂר
  choice: మొత్తం పన్నెండుమంది
  rationale: ఈ సంఖ్య షూబాయేలుతో అనుబంధమైన కుమారులు, సహోదరుల గుంపు సంఖ్యను తెలియజేస్తుంది. వ్యక్తులను లెక్కిస్తున్నందున ‘మంది’ని, భావస్పష్టత కోసం ‘మొత్తం’ను ఉపయోగించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి/విభాగాల జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని సంక్షిప్త వాక్యనిర్మాణాన్ని కాపాడుతూ, సంఖ్య వ్యక్తులకు వర్తిస్తుందని స్పష్టంచేయడానికి ‘మొత్తం పన్నెండుమంది’ అని ఇచ్చాం.
