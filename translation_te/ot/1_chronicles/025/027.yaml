translation:
  language: te
  text: ఇరవయ్యవ వంతు[a] ఎలీయాతాకు; అతని కుమారులు, అతని సహోదరులు—పన్నెండుగురు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇంకా స్పష్టంగా, “ఇరవయ్యవ చీటి వంతు ఎలీయాతాకు; అతని కుమారులు, అతని సహోదరులు—పన్నెండుగురు” అని అనువదించవచ్చు. “చీటి” అనే పదం హీబ్రూ పాఠంలో ప్రత్యక్షంగా లేదు; ఈ అధ్యాయంలో పునరావృతమయ్యే నిర్మాణం ద్వారా అది సూచితమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/עֶשְׂרִים
  choice: ఇరవయ్యవ వంతుకు
  rationale: లְ ఉపసర్గ కేటాయింపును సూచిస్తుంది; עֶשְׂרִים అధ్యాయంలోని వరుసలో ఇరవయ్యవ స్థానాన్ని సూచిస్తుంది. సందర్భంలో చీటి ద్వారా కేటాయించబడిన వంతు భావం అంతర్లీనంగా ఉంది.
- source_word: לֶ/אֱלִיָּתָה
  choice: ఎలీయాతా
  rationale: వ్యక్తి పేరును అనువదించకుండా తెలుగు లిపిలో ధ్వన్యంతరీకరించాం. ముందున్న ‘ఇరవయ్యవ వంతుకు’ అనే జాబితా సూత్రంలో לְ భావం ఇప్పటికే వ్యక్తమవుతుంది.
- source_word: בָּנָי/ו
  choice: అతని కుమారులు
  rationale: בנים అనే బహువచనం ఈ వంశావళి, సంగీత సేవకుల జాబితా సందర్భంలో మగ సంతానాన్ని సూచిస్తుంది.
- source_word: וְ/אֶחָי/ו
  choice: అతని సహోదరులు
  rationale: אחים యొక్క కుటుంబ సంబంధ భావాన్ని విస్తరించకుండా ‘సహోదరులు’గా నిలిపాం.
- source_word: שְׁנֵים עָשָׂר
  choice: మొత్తం పన్నెండుగురు
  rationale: ఈ సంఖ్య సమూహపు మొత్తం వ్యక్తుల సంఖ్యను తెలుపుతుంది. తెలుగులో వ్యక్తులను లెక్కించే ‘గురు’ను, జాబితా భావాన్ని స్పష్టం చేసే ‘మొత్తం’ను సహజత్వం కోసం చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలిని నిలిపి ఉంచుతూ సాధారణ పాఠకులకు సహజంగా ఉండే గౌరవప్రదమైన భాష వాడాం. హీబ్రూ అవ్యయ వాక్య నిర్మాణాన్ని దీర్ఘ వాక్యంగా మార్చకుండా అర్ధవిరామం, దీర్ఘ విరామచిహ్నంతో ప్రతిబింబించాం.
