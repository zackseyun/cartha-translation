id: 1CH.25.4
reference: 1 Chronicles 25:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לְ/הֵימָ֑ן בְּנֵ֣י הֵימָ֡ן בֻּקִּיָּ֡הוּ מַתַּנְיָ֡הוּ עֻ֠זִּיאֵל שְׁבוּאֵ֨ל וִֽ/ירִימ֜וֹת חֲנַנְיָ֣ה חֲנָ֗נִי אֱלִיאָ֤תָה גִדַּ֨לְתִּי֙ וְ/רֹמַ֣מְתִּי עֶ֔זֶר יָשְׁבְּקָ֣שָׁה מַלּ֔וֹתִי הוֹתִ֖יר מַחֲזִיאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/004.yaml
  text: 'To Heman: the sons of Heman: Bukkiah[a], Mattaniah, Uzziel, Shebuel, and Jerimoth, Hananiah, Hanani, Eliathah, Giddalti, and Romamti-ezer, Joshbekashah, Mallothi, Hothir[c][b], Mahazioth.'
translation:
  language: te
  text: 'హేమానుకు: హేమాను కుమారులు—బుక్కీయా, మత్తన్యా, ఉజ్జీయేలు, షెబూయేలు[c], యిరీమోతు[b], హనన్యా, హనానీ, ఎలీయాతా, గిద్దల్తీ, రోమమ్తీ-ఎజెరు[a], యాష్బెకాషా, మల్లోతీ, హోతీరు, మహజీయోతు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ జాబితాలోని కొన్ని పేర్లను—ప్రత్యేకంగా ‘గిద్దల్తీ, రోమమ్తీ-ఎజెరు’ చుట్టూ ఉన్న రూపాలను—కేవలం పేర్లుగా కాక ఒక వాక్యభాగంగా కూడా చదవవచ్చని కొందరు సూచించారు. సందర్భాన్ని బట్టి ఇక్కడ వాటిని వ్యక్తినామాలుగా పరిగణించాం.
    reason: alternative_reading
  - marker: b
    text: ‘యిరీమోతు’ అనే పేరును ‘యెరెమోతు’ అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘షెబూయేలు’ అనే పేరుకు ‘షూబాయేలు’ అనే రూపం కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/הֵימָן
  choice: హేమానుకు చెందినవారు
  rationale: ఈ అధ్యాయంలోని బృందాల కేటాయింపు జాబితాలో לְ ఉపసర్గ హేమానుకు సంబంధించిన లేదా కేటాయించబడిన వారిని సూచిస్తుంది; తెలుగులో జాబితా శీర్షికగా ఈ రూపం సహజంగా ఉంటుంది.
- source_word: בְּנֵי הֵימָן
  choice: హేమాను కుమారులు
  rationale: בְּנֵי అనే పదానికి ఇక్కడి వంశావళి-జాబితా సందర్భంలో నేరుగా ‘కుమారులు’ అనే అర్థం సరిపోతుంది.
- source_word: שְׁבוּאֵל
  choice: షెబూయేలు
  rationale: హీబ్రూ ధ్వనిరూపాన్ని ఆధారంగా చేసుకున్న తెలుగు లిప్యంతరీకరణ; మరో పాఠసంప్రదాయ రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: וִֽ/ירִימוֹת
  choice: యిరీమోతు
  rationale: మూలంలోని పేరు יְרִימוֹת ధ్వనిరూపానికి దగ్గరగా లిప్యంతరీకరించాం; ముందున్న וְ జాబితాలో పేర్లను కలిపే సంధానార్థకంగా పనిచేస్తుంది, తెలుగులో కామాలతో అది సహజంగా వ్యక్తమవుతుంది.
- source_word: גִדַּלְתִּי
  choice: గిద్దల్తీ
  rationale: ఇది క్రియారూపంలా కనిపించగలిగినా, తక్షణ సందర్భం కుమారుల పేర్ల జాబితా కాబట్టి వ్యక్తినామంగా లిప్యంతరీకరించాం.
- source_word: וְ/רֹמַמְתִּי עֶזֶר
  choice: రోమమ్తీ-ఎజెరు
  rationale: జాబితా సందర్భంలో రెండు భాగాలున్న వ్యక్తినామంగా తీసుకుని సంయుక్త నామాన్ని సూచించేందుకు హైఫన్ వాడాం.
- source_word: יָשְׁבְּקָשָׁה
  choice: యొష్బెకాషా
  rationale: వ్యక్తినామాన్ని మూల హీబ్రూ ధ్వనులకు దగ్గరగా, తెలుగులో పలకదగిన విధంగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: గిద్దల్తీ మొదలైన కొన్ని రూపాలను వ్యక్తినామాలుగా చదవాలా, అర్థవంతమైన వాక్యభాగంగా చదవాలా
  choice: ‘హేమాను కుమారులు’ అన్న తరువాతి క్రమమంతటినీ వ్యక్తినామాల జాబితాగా అనువదించడం
  alternative: కొన్ని రూపాలను ‘నేను గొప్పచేశాను, సహాయాన్ని హెచ్చించాను’ వంటి వాక్యభాగంగా అర్థం చేసుకోవడం
  rationale: తక్షణ సాహిత్య సందర్భం సంగీత సేవకుల వంశీయుల జాబితా. అయినా రూపాల్లో ఉన్న వాక్యార్థ సాధ్యతను పూర్తిగా తొలగించకుండా పాదసూచికలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా స్వభావం స్పష్టంగా ఉండేలా సంక్షిప్తమైన గౌరవప్రద శైలి వాడాం. వ్యక్తినామాలను హీబ్రూ ధ్వనులకు దగ్గరగా, తెలుగు పాఠకులు పలకగలిగే రూపాల్లో ఇచ్చాం; మూలంలో ప్రతి పేరుకు ముందు సంధానపదం లేకపోవడంతో తెలుగులో కామాలతో సహజమైన జాబితాగా అమర్చాం.
