translation:
  language: te
  text: పన్నెండవ వంతు అజరేలు[a]కు వచ్చింది; అతని కుమారులు, అతని సోదరులు—మొత్తం పన్నెండు మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అజరీయేలు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עַשְׁתֵּי עָשָׂר
  choice: పన్నెండవ వంతు
  rationale: హీబ్రూ రూపం సంఖ్యాపరంగా ‘పన్నెండు’ అయినప్పటికీ, చీట్ల క్రమాన్ని తెలిపే ఈ జాబితా సందర్భంలో క్రమసంఖ్య భావం ఉద్దేశించబడింది. తెలుగులో సహజంగా ‘పన్నెండవ వంతు’ అని ఇచ్చాం.
- source_word: עֲזַרְאֵל
  choice: అజరేలు
  rationale: వ్యక్తి పేరును అనువదించకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: మూలపదం ప్రత్యేకంగా కుమారులను సూచిస్తుంది; అందువల్ల విస్తృతార్థకమైన ‘పిల్లలు’ అని ఇవ్వలేదు.
- source_word: וְאֶחָיו
  choice: అతని సోదరులు
  rationale: మూలంలోని ప్రత్యక్ష అర్థాన్ని నిలిపాం. సందర్భంలో ఇది సమీప పురుష బంధువులను లేదా సహచరులను కూడా సూచించే అవకాశం ఉన్నా, ‘సోదరులు’ అత్యంత పారదర్శకమైన ఎంపిక.
- source_word: שְׁנֵים עָשָׂר
  choice: మొత్తం పన్నెండు మంది
  rationale: ఈ సంఖ్య అజరేలు బృందంలోని మొత్తం సభ్యుల సంఖ్యను తెలుపుతుంది. తెలుగులో భావం స్పష్టంగా ఉండేందుకు మూలంలో సూచితమైన ‘మొత్తం’, వ్యక్తులను సూచించే ‘మంది’ చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలిని సంక్షిప్తంగా ఉంచుతూ మూలంలోని అపూర్ణ వాక్య నిర్మాణాన్ని సహజంగా స్పష్టం చేశాం. ‘వంతు ... వచ్చింది’ అనేది పరిసర చీట్ల క్రమాన్ని తెలుగులో అర్థవంతంగా తెలియజేస్తుంది.
