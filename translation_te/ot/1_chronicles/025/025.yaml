lexical_decisions:
- source_word: לִשְׁמוֹנָה עָשָׂר
  choice: పద్దెనిమిదవది
  rationale: చుట్టుపక్కల వచనాల్లోని చీట్ల క్రమాన్ని సూచించే రూపం. మూలంలో ‘చీటి’ అనే పదం ప్రత్యక్షంగా లేకపోవడంతో ప్రధాన పాఠ్యంలో దాన్ని చేర్చకుండా, తెలుగులో సహజంగా ఉండేలా ‘వచ్చింది’ అని సందర్భసూచక క్రియను ఉపయోగించాం.
- source_word: לַחֲנָנִי
  choice: హనానీకి
  rationale: ל ఉపసర్గ కేటాయింపును సూచిస్తుంది; వ్యక్తిపేరును అనువదించకుండా లిప్యంతరీకరించాం.
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: హీబ్రూ పదం ప్రత్యేకంగా కుమారులను సూచిస్తుంది; అందువల్ల సాధారణ ‘పిల్లలు’కు బదులు ‘కుమారులు’ అని ఇచ్చాం.
- source_word: וְאֶחָיו
  choice: అతని సహోదరులు
  rationale: మూలంలోని కుటుంబ సంబంధార్థాన్ని నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ‘సహోదరులు’ను ఎంచుకున్నాం.
- source_word: שְׁנֵים עָשָׂר
  choice: మొత్తం పన్నెండుమంది
  rationale: హనానీ కుమారులు, సహోదరులతో కూడిన బృందపు మొత్తం సంఖ్యను స్పష్టంగా తెలియజేస్తుంది; వ్యక్తులను లెక్కిస్తున్నందున ‘మంది’ వాడాం.
