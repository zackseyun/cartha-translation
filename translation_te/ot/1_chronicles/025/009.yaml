    rationale: The Hebrew says literally “for Asaph, for Joseph”; the surrounding context identifies Joseph with Asaph's group, but the verse itself does not explicitly state genealogical descent. “ఆసాఫు వర్గానికి చెందిన” is contextually clear and less overdetermined.
