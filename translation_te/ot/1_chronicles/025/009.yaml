source:
  edition: WLC
  text: וַ/יֵּצֵ֞א הַ/גּוֹרָ֧ל הָ/רִאשׁ֛וֹן לְ/אָסָ֖ף לְ/יוֹסֵ֑ף גְּדַלְיָ֨הוּ֙ הַ/שֵּׁנִ֔י הֽוּא וְ/אֶחָ֥י/ו וּ/בָנָ֖י/ו שְׁנֵ֥ים עָשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/009.yaml
  text: The first lot came out for Asaph[a], for Joseph; Gedaliah the second, he and his brothers and his sons[b], twelve.
translation:
  language: te
  text: మొదటి చీటి ఆసాఫు వర్గానికి చెందిన యోసేపుకు వచ్చింది; రెండవ చీటి గెదల్యాహుకు వచ్చింది. అతడూ అతని సహోదరులూ అతని కుమారులూ కలిపి పన్నెండుమంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హెబ్రీయ వాక్యం సంక్షిప్త జాబితా రూపంలో ఉంది: “మొదటి చీటి ఆసాఫుకు, యోసేపుకు; గెదల్యాహు రెండవది; అతడూ అతని సహోదరులూ అతని కుమారులూ, పన్నెండుమంది.”'
    reason: మూలంలోని సంక్షిప్త జాబితా నిర్మాణాన్ని చూపిస్తూ, ప్రధాన పాఠంలో సందర్భానుసారంగా స్పష్టం చేసిన వర్గ-సంబంధం మరియు రెండవ చీటి అనే పదాన్ని పారదర్శకంగా తెలియజేయడం.
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: చీటి వచ్చింది
  rationale: చీట్లు వేసి బాధ్యతలను కేటాయించే సందర్భంలో హెబ్రీయ భాషలోని ‘చీటి బయటికి వచ్చింది’ అనే చిత్రాన్ని సహజమైన ఆధునిక తెలుగులో ‘చీటి వచ్చింది’ అని వ్యక్తం చేస్తుంది.
- source_word: לְאָסָף לְיוֹסֵף
  choice: ఆసాఫు వంశస్థుడైన యోసేపుకు
  rationale: ఈ జాబితా సందర్భంలో యోసేపు ఆసాఫు వర్గానికి చెందిన నిర్దిష్ట నాయకుడు. హెబ్రీయ సంక్షిప్త నిర్మాణాన్ని తెలుగులో స్పష్టంగా చేస్తూ, ఆసాఫుకే చీటి వచ్చిందనే అపార్థాన్ని నివారిస్తుంది.
- source_word: גְּדַלְיָהוּ
  choice: గెదల్యాహు
  rationale: మూలంలోని -యాహు ముగింపును నిలుపుతూ పేరును తెలుగులో సహజంగా లిప్యంతరీకరించింది.
- source_word: הוּא וְאֶחָיו וּבָנָיו
  choice: అతడూ, అతని సహోదరులూ, అతని కుమారులూ
  rationale: గణించబడిన బృందానికి గెదల్యాహు స్వయంగా అధిపతి/సభ్యుడని చూపే הוּא పదాన్ని నిలిపి, ‘సహోదరులు’, ‘కుమారులు’ అనే మూలంలోని లింగ-నిర్దిష్ట పదాలను కాపాడింది.
- source_word: שְׁנֵים עָשָׂר
  choice: మొత్తం పన్నెండుమంది
  rationale: క్రియలేని హెబ్రీయ సంఖ్యా నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేసి, ఇది గెదల్యాహు సహా పేర్కొన్న మొత్తం బృంద సంఖ్య అని తెలియజేస్తుంది.
theological_decisions:
- issue: לְאָסָף לְיוֹסֵף పదబంధాల పరస్పర సంబంధం
  choice: ఆసాఫు వంశస్థుడైన యోసేపుకు
  alternative: ఆసాఫుకు, యోసేపుకు
  rationale: ముందటి వచనాలలో ఆసాఫు కుమారుల జాబితా ఉండటం, తదుపరి చీట్లలో వ్యక్తిగత నాయకుల పేర్లు రావటం వల్ల మొదటి చీటి ఆసాఫు వర్గంలోని యోసేపుకు చెందినదిగా అర్థం చేసుకోవడం సందర్భానుకూలం. ఇది సిద్ధాంతపరమైన నిర్ణయం కాక, వంశ/వర్గ జాబితా నిర్మాణానికి సంబంధించిన స్పష్టీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగానూ సాధారణ పాఠకులకు సులభంగానూ ఉంది. జాబితా స్వభావాన్ని నిలుపుతూ అవసరమైన చోట మాత్రమే ‘వంశస్థుడు’, ‘మొత్తం’ అనే స్పష్టీకరణలు చేర్చబడ్డాయి.
