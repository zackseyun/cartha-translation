translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, జాబితా శైలిలోని సంక్షిప్తతను సాధ్యమైనంతవరకు నిలుపుతూ సహజంగా చదవడానికి ‘వచ్చింది’, ‘మొత్తం’ అనే సందర్భసిద్ధ పదాలను చేర్చాం. పేరు హీబ్రూ ఉచ్చారణకు దగ్గరగా ‘యష్బెకాషా’గా లిప్యంతరీకరించాం.
