base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/024.yaml
  text: For the seventeenth[a], Joshbekashah, his sons and his brothers, twelve.
translation:
  language: te
  text: పదిహేడవది[a] యాష్బెకాషాకు; అతని కుమారులు, అతని సహోదరులు—పన్నెండుమంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పదిహేడవదానికి, యాష్బెకాషాకు.” చుట్టుపక్కల సందర్భాన్ని బట్టి “చీటి” లేదా “విభాగం” అనే నామవాచకం ఇక్కడ సూచితంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשִׁבְעָה עָשָׂר
  choice: పదిహేడవది
  rationale: ఈ జాబితా సందర్భంలో לְ తో కూడిన క్రమసంఖ్య చీటి లేదా సేవావిభాగపు వరుస కేటాయింపును సూచిస్తుంది. సందర్భం ద్వారా అర్థమయ్యే నామవాచకాన్ని ప్రధాన పాఠంలో నిర్దిష్టంగా నిర్ణయించకుండా ‘పదిహేడవది’ అని ఉంచడం మూలంలోని సంక్షిప్తతను, అస్పష్టతను కాపాడుతుంది.
- source_word: לְיָשְׁבְּקָשָׁה
  choice: యష్బెకాషాకు వచ్చింది
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం. ముందున్న לְ కేటాయింపు అతనికి చెందిందని సూచిస్తుంది; సహజమైన తెలుగుకోసం ‘వచ్చింది’ అనే క్రియను సందర్భానుసారంగా చేర్చాం.
- source_word: בָּנָיו
  choice: అతని కుమారులు
  rationale: בנים ఇక్కడ పురుష సంతానాన్ని ప్రత్యేకంగా సూచిస్తున్నందున ‘పిల్లలు’ అని సాధారణీకరించకుండా ‘కుమారులు’ అని అనువదించాం.
- source_word: וְאֶחָיו
  choice: అతని సహోదరులు
  rationale: אחים యొక్క ప్రత్యక్ష అర్థం ‘సహోదరులు’. ఈ సందర్భంలో పురుష బంధువులను కూడా సూచించే అవకాశం ఉన్నా, మూలానికి పారదర్శకంగా ఉండేందుకు ప్రత్యక్ష అర్థాన్నే ఎంచుకున్నాం.
- source_word: שְׁנֵים עָשָׂר
  choice: మొత్తం పన్నెండుమంది
  rationale: ఇది బృందంలోని వ్యక్తుల సంఖ్య. తెలుగులో వ్యక్తుల లెక్కను సహజంగా తెలియజేయడానికి ‘మంది’ను, ఇది మొత్తం సంఖ్య అని స్పష్టం చేయడానికి ‘మొత్తం’ను ఉపయోగించాం.
