  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּבְדֵּ֣ל דָּוִיד֩ וְ/שָׂרֵ֨י הַ/צָּבָ֜א לַ/עֲבֹדָ֗ה לִ/בְנֵ֤י אָסָף֙ וְ/הֵימָ֣ן וִֽ/ידוּת֔וּן ה/נביאים בְּ/כִנֹּר֥וֹת בִּ/נְבָלִ֖ים וּ/בִ/מְצִלְתָּ֑יִם וַֽ/יְהִי֙ מִסְפָּרָ֔/ם אַנְשֵׁ֥י מְלָאכָ֖ה לַ/עֲבֹדָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/001.yaml
  text: 'And David and the commanders of the army set apart for the service the sons of Asaph[a], Heman, and Jeduthun, who prophesied with lyres, harps, and cymbals; and their number, the men for the work of their service[b], was:'
translation:
  language: te
  text: 'దావీదు, సైన్యాధిపతులు కలిసి ఆసాపు, హేమాను, యెదూతూను కుమారులను సేవ కోసం ప్రత్యేకించారు; వారు వీణలు, స్వరమండలాలు, తాళాలతో ప్రవచించేవారు.[a] వారి సేవలో పని చేసే వారి సంఖ్య ఇలా ఉంది:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: “వీణలు, స్వరమండలాలు, తాళాలతో ఉన్న ప్రవక్తలైన ఆసాపు, హేమాను, యెదూతూను కుమారులను.” హీబ్రూ వాక్యనిర్మాణంలో “ప్రవక్తలు” అనే పదం ఆసాపు, హేమాను, యెదూతూనుతో సమానాధికారంగా కూడా చదవబడవచ్చు. “కుమారులు” అనేది ప్రత్యక్ష కుమారులనే కాక వంశస్థులను లేదా వారి బృందాల సభ్యులను కూడా సూచించవచ్చు.'
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: וַיַּבְדֵּל
  choice: ప్రత్యేకించారు
  rationale: హిఫీల్ రూపంలోని ‘వేరుచేయడం/ప్రత్యేకించడం’ అనే భావాన్ని ఆలయసేవకు నియమించే సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: שָׂרֵי הַצָּבָא
  choice: సైన్యాధిపతులు
  rationale: שָׂרֵי అంటే అధికారులు లేదా అధిపతులు; צָבָא సాధారణంగా సైన్యం. ఈ సందర్భంలో సైనిక నాయకులనే సూచించే సహజమైన సంక్షిప్త రూపం.
- source_word: לַעֲבֹדָה
  choice: సేవ కోసం
  rationale: ఆలయ సంబంధ సందర్భంలో עֲבֹדָה వ్యవస్థీకృత సేవను సూచిస్తుంది.
- source_word: לִבְנֵי אָסָף וְהֵימָן וִידוּתוּן
  choice: ఆసాపు, హేమాను, యెదూతూను కుమారుల్లో కొందరిని
  rationale: בני అనే పదం ప్రత్యక్ష కుమారులను, వంశస్థులను లేదా బృంద సభ్యులను సూచించవచ్చు. ‘కుమారులు’ మూలపద రూపాన్ని నిలుపుతుంది; విభజన క్రియకు అనుగుణంగా ‘కొందరిని’ భావం తెలుగులో వాక్యాన్ని సహజం చేస్తుంది.
- source_word: הנביאים
  choice: వారు ... ప్రవచించేవారు
  rationale: రూపరీత్యా ‘ప్రవక్తలు’ అయినా, పేర్లతో అన్వయించే వివరణాత్మక క్రియగా తెలుగులో ఇవ్వడం సహజం; సంగీత వాయిద్యాలతో కూడిన ప్రవచన కార్యాన్ని నిలుపుతుంది.
- source_word: בְּכִנֹּרוֹת
  choice: వీణలు
  rationale: כִּנּוֹר ఒక తీగవాయిద్యం; ఆధునిక తెలుగు పాఠకులకు ‘వీణ’ సులభంగా అర్థమవుతుంది.
- source_word: בִּנְבָלִים
  choice: స్వరమండలాలు
  rationale: נֵבֶל అనేది כִּנּוֹר కంటే భిన్నమైన తీగవాయిద్యం. రెండింటి మధ్య భేదాన్ని తెలుగులో నిలుపడానికి సంప్రదాయంగా అర్థమయ్యే వేరొక వాయిద్యపేరు ఉపయోగించబడింది.
- source_word: וּבִמְצִלְתָּיִם
  choice: తాళాలు
  rationale: మోగించుకునే జత లోహ వాయిద్యాలైన cymbals‌కు సహజమైన తెలుగు పదం.
- source_word: וַיְהִי מִסְפָּרָם
  choice: 'వారి సంఖ్య ఇలా ఉంది:'
  rationale: తదుపరి వచనాల్లో వచ్చే జాబితాను పరిచయం చేసే అసంపూర్ణ ముందుచూపు నిర్మాణాన్ని ద్విబిందువుతో నిలుపుతుంది.
- source_word: אַנְשֵׁי מְלָאכָה לַעֲבֹדָתָם
  choice: తమ సేవకు సంబంధించిన పనిని చేసే వారు
  rationale: ‘నైపుణ్యంగలవారు’ అని మూలంలో స్పష్టంగా లేని భావాన్ని చేర్చకుండా, అప్పగించిన సేవాపనిలో నిమగ్నమైన వారనే అర్థాన్ని సహజ తెలుగులో ఇస్తుంది.
theological_decisions:
- issue: הַנְּבִיאִים అనే పదాన్ని ‘ప్రవక్తలు’ అనే నామవాచకంగా ఇవ్వాలా, లేక సంగీతంతో చేసిన ప్రవచన కార్యంగా వివరించాలా
  choice: ‘వారు ... వాయిస్తూ ప్రవచించేవారు’
  alternative: ‘వీణలు, స్వరమండలాలు, తాళాలతో ఉన్న ప్రవక్తలు’
  rationale: హీబ్రూ రూపం ఆసాపు, హేమాను, యెదూతూనుతో సమానాధికార నామవాచకంగా అన్వయించవచ్చు. అయితే క్రియారూప అనువాదం తెలుగులో సహజంగా ఉండి, వారి సంగీత సేవ ప్రవచన స్వభావం కలదని తెలిపుతుంది; ప్రత్యామ్నాయ వాక్యనిర్మాణాన్ని పాదటిప్పణిలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల శైలి. ఆలయసేవ సందర్భాన్ని స్పష్టంగా ఉంచుతూ, ‘ప్రవక్తలు/ప్రవచించేవారు’ అనే హీబ్రూ నిర్మాణంలోని అనిశ్చితిని పాదటిప్పణిలో సంరక్షించింది.
