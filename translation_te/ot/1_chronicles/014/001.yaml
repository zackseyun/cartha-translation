id: 1CH.14.1
reference: 1 Chronicles 14:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ֠/יִּשְׁלַח חירם מֶֽלֶךְ צֹ֥ר מַלְאָכִים֮ אֶל דָּוִיד֒ וַ/עֲצֵ֣י אֲרָזִ֔ים וְ/חָרָשֵׁ֣י קִ֔יר וְ/חָרָשֵׁ֖י עֵצִ֑ים לִ/בְנ֥וֹת ל֖/וֹ בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/001.yaml
  text: Then Hiram king of Tyre sent messengers to David[a], and cedar timber, masons, and carpenters[b], to build a house for him.
translation:
  language: te
  text: తర్వాత తూరు రాజైన హీరాము దావీదు వద్దకు దూతలను[a], దేవదారు కలపను, గోడలు కట్టే పనివారిని, వడ్రంగులను అతనికి ఒక ఇల్లు[b] కట్టడానికి పంపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “రాజ ప్రతినిధులను.” రాజసంబంధమైన ఈ సందర్భంలో హీబ్రూ పదం అధికారిక ప్రతినిధులను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “రాజభవనాన్ని.” ఇక్కడ “ఇల్లు” అనే హీబ్రూ పదం రాజ నివాసాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: తర్వాత ... పంపించాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనశైలిలో ‘తర్వాత’ సహజంగా క్రమాన్ని సూచిస్తుంది.
- source_word: חירם מֶלֶךְ צֹר
  choice: తూరు రాజైన హీరాము
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన తెలుగు విశేషణ రూపంలో వ్యక్తం చేస్తుంది; పేరును ఇక్కడి హీబ్రూ రూపానికి అనుగుణంగా ‘హీరాము’గా లిప్యంతరీకరించింది.
- source_word: מַלְאָכִים
  choice: దూతలను
  rationale: ఈ పదానికి ప్రాథమిక అర్థం సందేశం తీసుకెళ్లే ప్రతినిధులు; రాజదౌత్య సందర్భంలో ‘రాయబారులు’ కూడా సాధ్యమే అయినా ‘దూతలు’ విస్తృతార్థాన్ని కాపాడుతుంది.
- source_word: וַעֲצֵי אֲרָזִים
  choice: దేవదారు కలపను
  rationale: నిర్మాణ సందర్భంలో జీవించి ఉన్న చెట్లకన్నా నిర్మాణ సామగ్రిగా ఉపయోగించే దేవదారు కలప ఉద్దేశించబడింది.
- source_word: חָרָשֵׁי קִיר
  choice: గోడలు కట్టే పనివారిని
  rationale: అక్షరార్థంగా గోడల పనిలో నైపుణ్యం గల శిల్పులు; ‘తాపీ పనివారు’ కంటే ఈ రూపం సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది మరియు రాయి అనే అంశాన్ని అనవసరంగా చేర్చదు.
- source_word: חָרָשֵׁי עֵצִים
  choice: వడ్రంగులను
  rationale: చెక్కతో పనిచేసే నిపుణులను సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: לִבְנוֹת לוֹ בָּיִת
  choice: అతనికి ఒక ఇల్లు కట్టడానికి
  rationale: ఉద్దేశార్థక క్రియను, ప్రయోజనగ్రాహిని నేరుగా వ్యక్తం చేస్తుంది; בָּיִת యొక్క ప్రాథమిక అర్థమైన ‘ఇల్లు’ను ప్రధాన పాఠ్యంలో నిలుపుతుంది.
theological_decisions:
- issue: בָּיִת అనే పదం రాజ నివాసాన్ని సూచించవచ్చా?
  choice: ప్రధాన పాఠ్యంలో ‘ఇల్లు’
  alternative: ‘రాజభవనం’
  rationale: సందర్భంలో దావీదు రాజ నివాసం ఉద్దేశించబడినప్పటికీ, హీబ్రూ పదం సాధారణంగా ‘ఇల్లు’ అని కూడా అర్థమవుతుంది. భావాన్ని అతిగా నిర్దిష్టం చేయకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. హీబ్రూ వాక్యంలో పంపిన వస్తువులు, పనివారే ఇల్లు కట్టే ఉద్దేశంతో వచ్చినట్లు భావసంబంధం స్పష్టమయ్యేందుకు రెండో ఉపవాక్యం ఉపయోగించబడింది; మూలంలోని సమన్వయ వరుసను వీలైనంత వరకు నిలిపింది.
