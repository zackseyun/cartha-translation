  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּ֣דַע דָּוִ֔יד כִּֽי הֱכִינ֧/וֹ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל כִּֽי נִשֵּׂ֤את לְ/מַ֨עְלָ/ה֙ מַלְכוּת֔/וֹ בַּ/עֲב֖וּר עַמּ֥/וֹ יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/002.yaml
  text: And David knew that Yahweh had established him as king over Israel[b][a], for his kingdom had been greatly exalted for the sake of his people Israel.
translation:
  language: te
  text: యెహోవా తనను ఇశ్రాయేలు మీద రాజుగా స్థిరపరిచాడని దావీదు గ్రహించాడు; ఎందుకంటే, తన రాజ్యం ఎంతో ఉన్నతస్థితికి ఎత్తబడింది[a], యెహోవా ప్రజలైన ఇశ్రాయేలు నిమిత్తం[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, “పైకి ఎత్తబడింది” లేదా “ఉన్నతంగా ఎత్తబడింది.”
    reason: lexical_alternative
  - marker: b
    text: “యెహోవా ప్రజలైన” అని అనువదించిన చోట మూలభాషలో “అతని ప్రజలైన” అని ఉంది; కొందరు ఇక్కడ “అతని” అనేది దావీదును సూచిస్తుందని భావిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: గ్రహించాడు
  rationale: ידע అనే క్రియ ఇక్కడ కేవలం సమాచారం తెలిసి ఉండడమే కాక, జరిగిన పరిణామాల ద్వారా గుర్తించడం లేదా గ్రహించడం అనే భావాన్ని సహజంగా ఇస్తుంది.
- source_word: הֱכִינוֹ
  choice: తనను ... స్థిరపరిచాడని
  rationale: כון హిఫీల్ రూపం స్థిరపరచడం, దృఢపరచడం, పదవిలో నెలకొల్పడం అనే భావాలను కలిగి ఉంది; రాజుగా నియమిత స్థితిని దృఢపరచిన భావాన్ని ఇది కాపాడుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో అందించాం.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుమీద రాజుగా
  rationale: לְ నియామకం లేదా స్థితిని, עַל పాలనా అధికారాన్ని సూచిస్తున్నందున ఈ రూపం మూలభావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: נִשֵּׂאת לְמַעְלָה
  choice: ఎంతో ఉన్నత స్థితికి చేర్చబడింది
  rationale: ఈ పదబంధం పైకి ఎత్తబడడం లేదా గొప్పగా హెచ్చించబడడం అనే నిష్క్రియ భావాన్ని కలిగి ఉంది. తెలుగు పాఠకునికి రాజ్యస్థాయి పెంపును స్పష్టంగా తెలిపేలా అనువదించాం.
- source_word: מַלְכוּתוֹ
  choice: తన రాజ్యం
  rationale: מַלְכוּת రాజ్యం, రాజరికం, పాలన అనే అర్థాలను కలిగి ఉంది. సందర్భంలో దావీదు రాజాధికార పరిధిని సూచించడానికి ‘రాజ్యం’ సరళమైన ఎంపిక.
- source_word: בַּעֲבוּר
  choice: నిమిత్తం
  rationale: ప్రయోజనం లేదా హితార్థాన్ని సూచించే ఈ పదానికి ‘నిమిత్తం’ సహజమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం.
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: యెహోవా ప్రజలైన ఇశ్రాయేలు
  rationale: హీబ్రూలోని ‘అతని’ అనే సర్వనామ సూచనలో ఉన్న సంభావ్య అస్పష్టతను ప్రధాన పఠనంలో యెహోవాకు అన్వయించాం; ప్రత్యామ్నాయాన్ని పాదసూచికలో కాపాడాం.
theological_decisions:
- issue: עַמּוֹ (‘అతని ప్రజలు’) లోని స్వామ్యసూచక సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: 'యెహోవాను సూచిస్తుంది: ‘యెహోవా ప్రజలైన ఇశ్రాయేలు’'
  alternative: 'దావీదును సూచిస్తుంది: ‘దావీదు ప్రజలైన ఇశ్రాయేలు’'
  rationale: సందర్భంలో యెహోవా దావీదును స్థిరపరచడం, ఇశ్రాయేలు హితార్థం రాజ్యాన్ని ఉన్నతపరచడం ప్రధానంగా ఉన్నాయి. అయినా హీబ్రూ వ్యాకరణపరంగా దావీదు కూడా సమీప సూచ్యుడు కావచ్చు; అందువల్ల ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: రెండవ כִּי యొక్క సంబంధం
  choice: 'కారణార్థకం: ‘ఎందుకంటే’'
  alternative: 'వివరణార్థకం: ‘అని/అంటే’'
  rationale: రాజ్యం ఉన్నత స్థితికి చేరడం, యెహోవా తనను రాజుగా స్థిరపరిచాడని దావీదు గ్రహించడానికి కారణం లేదా ఆధారంగా పనిచేస్తుంది. ‘ఎందుకంటే’ ఈ తార్కిక సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- issue: రాజ్యాన్ని ఉన్నతపరచిన కర్త
  choice: హీబ్రూ నిష్క్రియ రూపాన్ని కాపాడుతూ కర్తను స్పష్టంగా పేర్కొనలేదు
  alternative: ‘యెహోవా తన రాజ్యాన్ని ఎంతో ఉన్నతపరిచాడు’
  rationale: నִשֵּׂאת నిష్క్రియ రూపంలో ఉంది. దైవకర్త సందర్భం ద్వారా ఊహించదగినప్పటికీ, మూలంలో ప్రత్యక్షంగా లేని కర్తను ప్రధాన వాక్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘గ్రహించాడు,’ ‘స్థిరపరిచాడు,’ ‘నిమిత్తం’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని రాజసంబంధమైన గంభీరతను నిలుపుతాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
