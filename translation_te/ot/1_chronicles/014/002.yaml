revisions:
- from: యెహోవా తనను ఇశ్రాయేలుమీద రాజుగా స్థిరపరిచాడని దావీదు గ్రహించాడు. ఎందుకంటే, యెహోవా ప్రజలైన ఇశ్రాయేలు నిమిత్తం తన రాజ్యం ఎంతో ఉన్నత స్థితికి చేర్చబడింది.[a][b]
