  source_fidelity: హీబ్రూ పాఠంలోని మూడు పేర్లు—וֶאֱלִישָׁמָע, וּבְעֶלְיָדָע, וֶאֱלִיפָלֶט—వరుసగా ఎలీషామా, బెయెల్యాదా, ఎలీఫాలెతుగా విశ్వసనీయంగా లిప్యంతరీకరించబడ్డాయి. మొదటి పేరుకు మాత్రమే ‘మరియు’ వాడి, జాబితాలో తరువాతి సంధానాలను తెలుగులో సహజంగా సూచించడం అర్థాన్ని మార్చదు. బְעֶלְיָדָע అనే ఈ వచనంలోని ప్రత్యేక రూపాన్ని కాపాడి, సమాంతర పాఠంలోని ఎల్యాదా రూపాన్ని పాదసూచికలో సరిగ్గా పేర్కొన్నారు.
