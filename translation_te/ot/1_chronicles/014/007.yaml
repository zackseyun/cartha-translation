  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన జాబితా నిర్మాణాన్ని ఉపయోగించాం. వ్యక్తి పేర్లను అనువదించకుండా హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం. పాదసూచిక సూచికను అది వివరించే ‘బెయెల్యాదా’ పేరు వెంట ఉంచాం.
