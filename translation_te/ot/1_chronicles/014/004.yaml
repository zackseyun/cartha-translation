  text: וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת הַ/יְלוּדִ֔ים אֲשֶׁ֥ר הָיוּ ל֖/וֹ בִּ/ירוּשָׁלִָ֑ם שַׁמּ֣וּעַ וְ/שׁוֹבָ֔ב נָתָ֖ן וּ/שְׁלֹמֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/004.yaml
  text: 'And these are the names of the children born to him in Jerusalem: Shammua[a], Shobab, Nathan, and Solomon.'
translation:
  language: te
  text: 'యెరూషలేములో అతనికి పుట్టినవారి[a] పేర్లు ఇవి: షమ్మూవా, షోబాబు, నాతాను, సొలొమోను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘యెరూషలేములో అతనికి పుట్టినవారు.’ ఇక్కడి హీబ్రూ ప్రయోగం సాధారణంగా ‘కుమారులు’ అని అర్థమిచ్చే నామవాచకాన్ని ఉపయోగించలేదు; అయితే జాబితాలో ఉన్న పేర్లన్నీ పురుషులవే.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ఇవి
  rationale: జాబితాను పరిచయం చేసే హీబ్రూ సంధానపదం, సూచనపదం తెలుగులో సహజంగా వాక్యాంతంలోని ‘ఇవి’ ద్వారా వ్యక్తమవుతున్నాయి.
- source_word: שְׁמוֹת
  choice: పేర్లు
  rationale: ‘పేరు’ అనే పదానికి బహువచనం; తరువాత వచ్చే వ్యక్తుల జాబితాను పరిచయం చేస్తుంది.
- source_word: הַיְלוּדִים אֲשֶׁר הָיוּ לוֹ
  choice: అతనికి పుట్టినవారి
  rationale: మూలంలోని ילד ధాతువు నుంచి వచ్చిన కర్మణి అసమాపక రూపం అక్షరార్థంగా ‘పుట్టినవారు’ అని సూచిస్తుంది. సాధారణ ‘కుమారులు’ అనే నామవాచకాన్ని చేర్చకుండా, స్వామ్యార్థాన్ని ‘అతనికి’ ద్వారా సహజంగా తెలియజేస్తుంది.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: జన్మస్థలాన్ని సూచించే సరళమైన స్థానార్థక ప్రయోగం.
- source_word: שַׁמּוּעַ
  choice: షమ్మూయ
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: שׁוֹבָב
  choice: షోబాబు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: נָתָן
  choice: నాతాను
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపం.
- source_word: שְׁלֹמֹה
  choice: సొలొమోను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
