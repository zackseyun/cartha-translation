source:
  edition: WLC
  text: וַ/יִּשְׁאַ֨ל ע֤וֹד דָּוִיד֙ בֵּֽ/אלֹהִ֔ים וַ/יֹּ֤אמֶר ל/וֹ֙ הָֽ/אֱלֹהִ֔ים לֹ֥א תַֽעֲלֶ֖ה אַֽחֲרֵי/הֶ֑ם הָסֵב֙ מֵֽ/עֲלֵי/הֶ֔ם וּ/בָ֥אתָ לָ/הֶ֖ם מִ/מּ֥וּל הַ/בְּכָאִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/014.yaml
  text: So David inquired of God again[a], and God said to him, “You shall not go up after them. Circle around from behind them, and come against them opposite the balsam trees.”
translation:
  language: te
  text: దావీదు మళ్లీ దేవునిని విచారించాడు. దేవుడు అతనితో, “నీవు వారి వెంట ఎక్కి వెళ్లవద్దు. వారి వైపు నుండి తిరిగి చుట్టివెళ్లి, బాకా చెట్లకు ఎదురుగా వారిమీదికి రా[a]” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో “బాకా చెట్లు.” ఇవి ఏ రకమైన చెట్లనో ఖచ్చితంగా తెలియదు; కొన్ని అనువాదాలు “బాల్సమ్ చెట్లు” లేదా “మల్బరీ చెట్లు” అని పేర్కొంటాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  choice: దేవుని దగ్గర విచారణ చేశాడు
  rationale: శׁאל + ב ఇక్కడ దేవుని మార్గదర్శనం కోరడాన్ని సూచిస్తుంది. ‘అడిగాడు’ కంటే ‘విచారణ చేశాడు’ ఆ సంప్రదింపుల భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: עוֹד
  choice: మళ్లీ
  rationale: మునుపటి విచారణ పునరావృతమవుతున్నదని సందర్భం సూచిస్తుంది.
- source_word: וַיֹּאמֶר לוֹ הָאֱלֹהִים
  choice: దేవుడు అతనితో ... అని చెప్పాడు
  rationale: హీబ్రూ కథనంలోని సాధారణ వాక్యప్రయోగాన్ని సహజమైన తెలుగు ప్రత్యక్ష వచన నిర్మాణంలో అందిస్తుంది.
- source_word: לֹא תַעֲלֶה אַחֲרֵיהֶם
  choice: నీవు వారి వెనుకగా ఎక్కి వెళ్లవద్దు
  rationale: עלה యొక్క ‘ఎక్కి వెళ్లు’ అనే కదలిక భావాన్ని నిలుపుతూ, אַחֲרֵיהֶם ను ‘వారి వెనుకగా’గా అనువదించింది; దాడి అని స్పష్టీకరించి మూలంలోని సరళతను మించలేదు.
- source_word: הָסֵב מֵעֲלֵיהֶם
  choice: వారిని చుట్టివెళ్లి
  rationale: సూటిగా వారివైపు వెళ్లకుండా దిశ మార్చి చుట్టూ వెళ్లే సైనిక కదలికను సహజంగా వ్యక్తం చేస్తుంది. מֵעֲלֵיהֶם యొక్క ఖచ్చిత స్థలసంబంధం అస్పష్టమైనందున ‘వెనుకనుంచి’ అని అధికంగా నిర్దిష్టీకరించలేదు.
- source_word: וּבָאתָ לָהֶם
  choice: వారిమీదికి రా
  rationale: యుద్ధ సందర్భంలో בוא + ל శత్రువుపైకి రావడం అనే భావాన్ని ఇస్తుంది; ‘వారిమీదికి’ ఆ ప్రతికూల కదలికను సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: מִמּוּל
  choice: ఎదురుగా
  rationale: ఒక వస్తువుకు అభిముఖంగా లేదా దానికి ఎదురుగా ఉన్న స్థానాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַבְּכָאִים
  choice: బాకా చెట్లు
  rationale: చెట్టు జాతి ఖచ్చితంగా తెలియదు. ఒక నిర్దిష్ట జాతిని ఊహించి చెప్పకుండా హీబ్రూ పేరును లిప్యంతరీకరించి, పాదటిప్పణిలో అనిశ్చితిని తెలిపింది.
