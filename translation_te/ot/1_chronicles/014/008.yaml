translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. హెబ్రీ వాక్యంలోని పునరుక్తి, క్రమం, ఉద్దేశపూర్వక అస్పష్టత సాధ్యమైనంతవరకు నిలుపబడ్డాయి. మూల ఆంగ్ల పాఠ్యంలో [a] సూచిక “ఇశ్రాయేలంతటిమీద” తరువాత కనిపించినా, ఆ పాదసూచిక వాస్తవంగా וַיֵּצֵא לִפְנֵיהֶם అనే చివరి పదబంధానికి సంబంధించినది కనుక తెలుగులో సంబంధిత పదబంధం తరువాత ఉంచాం.
