id: 1CH.14.8
reference: 1 Chronicles 14:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁמְע֣וּ פְלִשְׁתִּ֗ים כִּי נִמְשַׁ֨ח דָּוִ֤יד לְ/מֶ֨לֶךְ֙ עַל כָּל יִשְׂרָאֵ֔ל וַ/יַּעֲל֥וּ כָל פְּלִשְׁתִּ֖ים לְ/בַקֵּ֣שׁ אֶת דָּוִ֑יד וַ/יִּשְׁמַ֣ע דָּוִ֔יד וַ/יֵּצֵ֖א לִ/פְנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/008.yaml
  text: When the Philistines heard that David had been anointed king over all Israel[a], all the Philistines went up to seek David. And David heard, and went out before them.
translation:
  language: te
  text: ఫిలిష్తీయులు దావీదు ఇశ్రాయేలంతటిమీద రాజుగా అభిషేకించబడ్డాడని విన్నప్పుడు, ఫిలిష్తీయులందరూ దావీదును వెదకడానికి పైకి వచ్చారు. దావీదు అది విని, వారి ఎదుటికి బయలుదేరాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని ఎదుర్కోవడానికి బయలుదేరాడు,” లేదా “వారిమీదికి బయలుదేరాడు.” హెబ్రీలో అక్షరార్థంగా “వారి ఎదుటికి బయలుదేరాడు” అని ఉంది; ఇది సైనికంగా ఎదుర్కోవడాన్ని సూచించవచ్చు, అయితే దానిని స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: విన్నప్పుడు
  rationale: שׁמע ఇక్కడ వార్తను వినడం అనే అర్థంలో ఉంది. కాలసంబంధ ఉపవాక్యంగా తెలుగులో సహజంగా ఉండేందుకు “విన్నప్పుడు” అని అనువదించాం.
- source_word: פְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: ఈ ప్రజాసమూహానికి తెలుగులో స్థిరపడిన పేరును ఉపయోగించాం.
- source_word: כִּי
  choice: అని
  rationale: వారు విన్న వార్తలోని విషయాన్ని పరిచయం చేసే సంధిగా כִּי ఇక్కడ పనిచేస్తుంది.
- source_word: נִמְשַׁח
  choice: అభిషేకించబడ్డాడని
  rationale: משׁח నిఫాల్ రూపం “అభిషేకించబడడం” అనే కర్మణి అర్థాన్ని ఇస్తుంది; వినడానికి ముందే జరిగిన కార్యమని సందర్భం తెలియజేస్తుంది.
- source_word: לְמֶלֶךְ
  choice: రాజుగా
  rationale: לְ ఇక్కడ పదవి లేదా నియామకాన్ని సూచిస్తుంది; “రాజుగా” అనేది సహజమైన తెలుగు రూపం.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలంతటిమీద
  rationale: రాజాధికార పరిధిని సూచించే עַל భావాన్ని “మీద”తో, כָּל యొక్క సంపూర్ణ పరిధిని “అంతటి”తో నిలిపాం.
- source_word: וַיַּעֲלוּ
  choice: పైకి వచ్చారు
  rationale: עלה యొక్క భౌగోళిక-సైనిక కథనార్థాన్ని నేరుగా నిలుపుతుంది; “దండెత్తారు” అని అనువదిస్తే మూలక్రియలో స్పష్టంగా లేని సైనిక భావం అదనంగా చేరుతుంది.
- source_word: כָל פְּלִשְׁתִּים
  choice: ఫిలిష్తీయులందరూ
  rationale: హెబ్రీ సమూహవాచక పదబంధాన్ని వ్యాఖ్యానాత్మకంగా “సైన్యమంతా”గా మార్చకుండా నేరుగా అనువదించాం.
- source_word: לְבַקֵּשׁ אֶת דָּוִיד
  choice: దావీదును వెదకడానికి
  rationale: בקשׁ యొక్క ప్రాథమిక అర్థం “వెదకడం.” శత్రుత్వ సందర్భం ఉన్నప్పటికీ “పట్టుకోవడానికి” లేదా “చంపడానికి” అని ఉద్దేశాన్ని అతిగా నిర్దిష్టం చేయలేదు.
- source_word: וַיִּשְׁמַע דָּוִיד
  choice: దావీదు అది విని
  rationale: మొదటి “వినడం”తో ఉన్న కథన అనుసంధానాన్ని నిలిపి, తెలుగులో అవసరమైన అవ్యక్త కర్మను “అది”తో సహజంగా తెలిపాం.
- source_word: וַיֵּצֵא לִפְנֵיהֶם
  choice: వారి ఎదుటికి బయలుదేరాడు
  rationale: లిఖితార్థమైన “వారి ఎదుటికి” అనే దృశ్యాన్ని నిలిపాం. సందర్భంలో ఎదుర్కోవడం సూచితమై ఉండవచ్చు గాని ప్రధాన పాఠ్యంలో దానిని తప్పనిసరి అర్థంగా చేయలేదు.
