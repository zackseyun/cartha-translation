id: 1CH.14.11
reference: 1 Chronicles 14:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּעֲל֥וּ בְּ/בַֽעַל פְּרָצִים֮ וַ/יַּכֵּ֣/ם שָׁ֣ם דָּוִיד֒ וַ/יֹּ֣אמֶר דָּוִ֔יד פָּרַ֨ץ הָֽ/אֱלֹהִ֧ים אֶת אוֹיְבַ֛/י בְּ/יָדִ֖/י כְּ/פֶ֣רֶץ מָ֑יִם עַל כֵּ֗ן קָֽרְא֛וּ שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא בַּ֥עַל פְּרָצִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/011.yaml
  text: So they went up to Baal-perazim[a], and David struck them down there. And David said, “God has broken through my enemies by my hand, like a bursting flood of waters.” Therefore they called the name of that place Baal-perazim.
translation:
  language: te
  text: అప్పుడు వారు బయల్‌-పెరాజీముకు[a] ఎక్కి వెళ్లారు; దావీదు అక్కడ వారిని ఓడించాడు. దావీదు, “నీరు ఉప్పొంగి ప్రవహించినట్లుగా దేవుడు నా చేత నా శత్రువులను బద్దలుకొట్టాడు” అన్నాడు. అందుచేత వారు ఆ స్థలానికి బయల్‌-పెరాజీము అని పేరు పెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “బయల్‌-పెరాజీము” అనే పేరుకు “పగుళ్ల అధిపతి” లేదా “పగుళ్లు/పగిలిపోవుటల స్థలం” అనే భావం ఉండవచ్చు. దేవుడు తన చేత దావీదు శత్రువులను “బద్దలుకొట్టాడు” అని దావీదు చెప్పిన మాటతో ఈ పేరుకు పదప్రయోగ సంబంధం ఉంది.
    reason: స్థలనామంలోని సాధ్యమైన అర్థాన్నీ, פרץ అనే హెబ్రీయ పదంతో ఉన్న పదప్రయోగాన్నీ వివరించడానికి.
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: వారు ... ఎక్కి వెళ్లారు
  rationale: సైనిక కదలికలో עלה సూచించే ‘పైకి వెళ్లడం/ఎక్కి వెళ్లడం’ అనే దిశాభావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בְּבַעַל פְּרָצִים / בַּעַל פְּרָצִים
  choice: బయల్‌-పెరాజీము
  rationale: స్థలనామాన్ని లిప్యంతరీకరించి, దానికీ פרץ పదానికీ ఉన్న శబ్దార్థ సంబంధాన్ని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: וַיַּכֵּם
  choice: దావీదు ... వారిని హతమార్చాడు
  rationale: యుద్ధ సందర్భంలోని נכה పదానికి ఉన్న బలమైన ‘కొట్టి పడగొట్టడం/సంహరించడం’ భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: פָּרַץ ... כְּפֶרֶץ מָיִם
  choice: ఉప్పొంగే జలాలు అడ్డుగోడను ఛేదించినట్లు ... ఛేదించాడు
  rationale: פרץ పునరుక్తిని ‘ఛేదించు’ ద్వారా నిలుపుతూ, నీరు అడ్డంకిని బద్దలుకొట్టి ప్రవహించే ఉపమానాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: הָאֱלֹהִים
  choice: దేవుడు
  rationale: ఏకవచన క్రియకు అనుగుణంగా ఏకవచన దైవ కర్తను సూచిస్తుంది.
- source_word: אֶת אֹיְבַי
  choice: శత్రువులను
  rationale: తెలుగులో సహజంగా స్వామ్యసూచనను సందర్భం ద్వారా గ్రహింపజేస్తుంది; దేవుడు దావీదు శత్రువులను జయించాడనే భావం స్పష్టంగా ఉంటుంది.
- source_word: בְּיָדִי
  choice: నా చేత
  rationale: దైవ కార్యానికి దావీదు మానవ సాధనంగా ఉన్నాడనే సాధనార్థక భావాన్నీ, ‘చేతి’ అనే హెబ్రీయ రూపకాన్నీ నిలుపుతుంది.
- source_word: עַל כֵּן
  choice: అందుచేత
  rationale: కారణం నుంచి వచ్చిన నామకరణ ఫలితాన్ని గంభీరమైన కథన శైలిలో సహజంగా కలుపుతుంది.
- source_word: קָרְאוּ שֵׁם הַמָּקוֹם הַהוּא
  choice: వారు ఆ స్థలానికి ... అని పేరు పెట్టారు
  rationale: మూలంలోని మూడవ పురుష బహువచన క్రియను నిలుపుతూ, హెబ్రీయ నామకరణ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: దావీదు ప్రకటనలో אֱלֹהִים పదానికి సూచన
  choice: దావీదు ద్వారా కార్యం చేసిన ఏకవచన దైవ కర్తగా ‘దేవుడు’
  alternative: ‘దేవుళ్లు’ లేదా దావీదే స్వతంత్ర ప్రధాన కర్త అన్న పఠనం
  rationale: פָּרַץ అనే ఏకవచన క్రియ దేవుడే కర్త అని నిర్ధారిస్తుంది; בְּיָדִי దేవుని కార్యంలో దావీదు సాధనమని తెలియజేస్తుంది. ఈ రెండింటి మధ్య ఉన్న దైవ కార్యం–మానవ పాత్ర సంబంధాన్ని అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే కథన శైలి. స్థలనామం లిప్యంతరీకరించబడింది; హెబ్రీయ పదప్రయోగం ప్రధాన వాక్యంలో ‘ఛేదించు’ పునరుక్తితో, పాదటిప్పణిలో వివరణతో నిలుపబడింది.
