  to: అప్పుడు వారు బయల్‌-పెరాజీముకు[a] ఎక్కి వెళ్లారు; దావీదు అక్కడ వారిని ఓడించాడు. దావీదు, “నీరు ఉప్పొంగి ప్రవహించినట్లుగా దేవుడు నా చేత నా శత్రువులను బద్దలుకొట్టాడు” అన్నాడు. అందుచేత వారు ఆ స్థలానికి బయల్‌-పెరాజీము అని పేరు పెట్టారు.
