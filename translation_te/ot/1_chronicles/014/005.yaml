translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన సరళ శైలిని అనుసరించాం. ఇవి వ్యక్తిపేర్లు కావడంతో అనువదించకుండా హీబ్రూ పాఠం నుంచి లిప్యంతరీకరించాం. అడుగుసూచిక గుర్తులు ప్రధాన పాఠంలో తప్పనిసరిగా చేర్చాం.
