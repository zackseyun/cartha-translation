lexical_decisions:
- source_word: יִבְחָר
  choice: యిభ్హారు
  rationale: హీబ్రూ వ్యక్తిపేరును అనువదించకుండా, దాని వ్యంజన నిర్మాణాన్ని సాధ్యమైనంత స్పష్టంగా ప్రతిబింబించేలా తెలుగులో లిప్యంతరీకరించాం.
- source_word: אֱלִישׁוּעַ
  choice: ఎలీషూవ
  rationale: మసొరెటిక్ పాఠంలోని పేరును నేరుగా లిప్యంతరీకరించాం; సమాంతర వాక్యంలో కనిపించే వేరే పేరుతో దీనిని కలపలేదు.
- source_word: אֶלְפָּלֶט
  choice: ఎల్పెలెతు
  rationale: WLC స్వరచిహ్నాల ప్రకారం హీబ్రూ వ్యక్తిపేరును తెలుగులో సహజంగా పలకగలిగే రూపంలో లిప్యంతరీకరించాం.
- source_word: וְ
  choice: పేర్లను వరుసగా ఉంచి, చివర విరామచిహ్నంతో జాబితాగా చూపడం
  rationale: హీబ్రూ సంధాయక అవ్యయం ప్రతి పేరుకు ముందున్నప్పటికీ, తెలుగు పేర్ల జాబితాలో పదేపదే ‘మరియు’ అనడం అసహజం; అర్థాన్ని నిలుపుతూ సహజమైన జాబితా నిర్మాణాన్ని వాడాం.
