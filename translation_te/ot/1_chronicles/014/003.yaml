id: 1CH.14.3
reference: 1 Chronicles 14:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח דָּוִ֥יד ע֛וֹד נָשִׁ֖ים בִּ/ירוּשָׁלִָ֑ם וַ/יּ֧וֹלֶד דָּוִ֛יד ע֖וֹד בָּנִ֥ים וּ/בָנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/003.yaml
  text: And David took more wives in Jerusalem[a], and David fathered more sons and daughters.
translation:
  language: te
  text: దావీదు యెరూషలేములో ఇంకా భార్యలను చేసుకున్నాడు[a], మరియు దావీదు ఇంకా కుమారులకూ కుమార్తెలకూ తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఇంకా భార్యలను తీసుకున్నాడు”; దీనిని “ఇంకా స్త్రీలను వివాహం చేసుకున్నాడు” అని కూడా అనువదించవచ్చు.
    reason: לקח అనే క్రియ యొక్క అక్షరార్థాన్నీ, נָשִׁים పదంలోని ‘స్త్రీలు/భార్యలు’ అనే అర్థసాధ్యతనూ తెలియజేయడం.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: చేసుకున్నాడు
  rationale: לקח అనే క్రియకు అక్షరార్థంగా ‘తీసుకున్నాడు’ అని అర్థం. అయితే భార్యల సందర్భంలో ఆధునిక తెలుగులో ‘భార్యలను చేసుకున్నాడు’ అనేది సహజంగా ఉండి, క్రియ యొక్క సందర్భార్థాన్ని తెలియజేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: עוֹד
  choice: ఇంకా
  rationale: ఈ పదం అదనంగా భార్యలను చేసుకోవడాన్నీ, మరింత మంది కుమారులు కుమార్తెలు పుట్టడాన్నీ పరిమాణపరంగా సూచిస్తుంది.
- source_word: נָשִׁים
  choice: భార్యలను
  rationale: נָשִׁים అనే పదానికి ‘స్త్రీలు’ లేదా ‘భార్యలు’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ దావీదు వారిని తీసుకున్నాడనే వివాహసంబంధ సందర్భం వల్ల ‘భార్యలు’ సరైనది.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: ב ఉపసర్గ ఇక్కడ స్థలార్థాన్ని సూచిస్తుంది; ప్రదేశనామాన్ని ప్రామాణిక తెలుగు బైబిలు రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וַיּוֹלֶד
  choice: పుట్టారు
  rationale: పురుష కర్తతో ילד హిఫీల్ రూపం ‘తండ్రి అయ్యాడు/కనెను’ అనే భావం ఇస్తుంది. తెలుగులో ‘దావీదుకు ... పుట్టారు’ అనేది సహజంగా, స్పష్టంగా అదే సంబంధాన్ని వ్యక్తం చేస్తుంది; ‘కన్నాడు’ అనే అసహజ లేదా అపార్థసాధ్య రూపాన్ని నివారిస్తుంది.
- source_word: בָּנִים וּבָנוֹת
  choice: కుమారులు, కుమార్తెలు
  rationale: హీబ్రూ పాఠం ఇరు వర్గాలనూ ప్రత్యేకంగా పేర్కొంటుంది; సాధారణీకరించి ‘పిల్లలు’ అనకుండా ఆ ప్రత్యేకతను నిలిపాం.
- source_word: דָּוִיד
  choice: దావీదు
  rationale: వ్యక్తినామానికి తెలుగులో విస్తృతంగా ప్రాచుర్యంలో ఉన్న రూపం.
theological_decisions:
- issue: దావీదు బహుభార్యత్వం గురించిన కథన వర్ణన
  choice: నైతిక వ్యాఖ్యను జోడించకుండా జరిగిన విషయంగా అనువదించడం
  alternative: ఆచరణను సమర్థిస్తున్నట్లు లేదా ఖండిస్తున్నట్లు మూలంలో లేని మూల్యాంకన భావాన్ని చేర్చడం
  rationale: ఈ వచనం దావీదు అదనపు భార్యలను చేసుకోవడాన్నీ, అతనికి పిల్లలు పుట్టడాన్నీ నివేదిస్తుంది; ఈ ఆచరణపై వచనం స్వయంగా నైతిక తీర్పు ఇవ్వదు. కాబట్టి అనువాదం కూడా వివరణాత్మకంగానే ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘భార్యలను తీసుకున్నాడు’ అనే హీబ్రూ నిర్మాణాన్ని ప్రధాన పాఠంలో యాంత్రికంగా అనుకరించకుండా ‘భార్యలను చేసుకున్నాడు’ అని ఇచ్చి, అక్షరార్థాన్ని పాదసూచికలో భద్రపరిచాం.
