revisions:
- from: నీవు మస్తకి చెట్ల[a] పైకొమ్మల్లో అడుగుల చప్పుడు విన్నప్పుడు, యుద్ధానికి బయలుదేరు; ఎందుకంటే ఫిలిష్తీయుల శిబిరాన్ని హతమార్చడానికి దేవుడు నీకు ముందుగా బయలుదేరాడు.
  to: నీవు బాకా చెట్ల పైభాగాల్లో అడుగుల చప్పుడు విన్నప్పుడు, అప్పుడు యుద్ధానికి బయలుదేరు; ఎందుకంటే ఫిలిష్తీయుల శిబిరాన్ని కొట్టివేయడానికి దేవుడు నీ ముందుగా బయలుదేరాడు.
  rationale: The revision removes an unjustifiably specific tree identification, preserving the Hebrew lexical uncertainty through transliteration and a footnote. It also replaces an unnatural collocation for action against a military camp while retaining the Hebrew’s decisive military sense. ‘అప్పుడు’ explicitly reflects אָז without adding immediacy.
