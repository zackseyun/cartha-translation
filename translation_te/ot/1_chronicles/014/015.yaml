id: 1CH.14.15
reference: 1 Chronicles 14:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וִ֠/יהִי כְּֽ/שָׁמְעֲ/ךָ֞ אֶת ק֤וֹל הַ/צְּעָדָה֙ בְּ/רָאשֵׁ֣י הַ/בְּכָאִ֔ים אָ֖ז תֵּצֵ֣א בַ/מִּלְחָמָ֑ה כִּֽי יָצָ֤א הָֽ/אֱלֹהִים֙ לְ/פָנֶ֔י/ךָ לְ/הַכּ֖וֹת אֶת מַחֲנֵ֥ה פְלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/015.yaml
  text: And when you hear the sound of marching in the tops of the balsam trees[a], then go out to battle, for God has gone out before you to strike down the camp of the Philistines.
translation:
  language: te
  text: నీవు బాకా చెట్ల పైభాగాల్లో అడుగుల చప్పుడు విన్నప్పుడు, అప్పుడు యుద్ధానికి బయలుదేరు; ఎందుకంటే ఫిలిష్తీయుల శిబిరాన్ని కొట్టివేయడానికి దేవుడు నీ ముందుగా బయలుదేరాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִיהִי כְּשָׁמְעֲךָ
  choice: నీవు ... విన్నప్పుడు
  rationale: וִיהִי తో కూడిన כ + క్రియానామ రూపం కాలసంబంధ ఉపవాక్యాన్ని పరిచయం చేస్తుంది. ఆధునిక తెలుగులో ‘విన్నప్పుడు’ సహజంగా ఉండి, మూలంలో లేని తక్షణతను జోడించదు.
- source_word: קוֹל הַצְּעָדָה
  choice: అడుగుల చప్పుడు
  rationale: קוֹל ఇక్కడ మాటను కాక వినిపించే శబ్దాన్ని సూచిస్తుంది; הַצְּעָדָה అడుగులు వేయడం లేదా సైనిక కదలికను సూచిస్తుంది. ‘అడుగుల చప్పుడు’ మూల చిత్రాన్ని సహజంగా నిలుపుతుంది; ‘సైన్యం కవాతు చేసే శబ్దం’ అని చెప్పడం సందర్భాన్ని అతిగా నిర్దిష్టం చేస్తుంది.
- source_word: בְּרָאשֵׁי הַבְּכָאִים
  choice: మస్తకి చెట్ల పైకొమ్మల్లో
  rationale: רָאשֵׁי చెట్ల ఎగువ భాగాలను సూచిస్తుంది; తెలుగులో ‘పైకొమ్మల్లో’ సహజమైన సమానం. בְּכָאִים యొక్క ఖచ్చితమైన వృక్షజాతి అనిశ్చితం; ‘మస్తకి చెట్లు’ ఒక సాధారణ పండితీయ గుర్తింపును ఇస్తుంది, అనిశ్చితిని పాదసూచికలో ఉంచుతుంది.
- source_word: אָז תֵּצֵא בַמִּלְחָמָה
  choice: యుద్ధానికి బయలుదేరు
  rationale: אָז సూచించే తదనంతర చర్యను తెలుగు వాక్య నిర్మాణంలో ‘అప్పుడు’ అనకుండా కాల ఉపవాక్యం తరువాత సహజంగా వ్యక్తం చేయవచ్చు. יצא యొక్క ‘బయలుదేరు’ భావాన్ని, בַמִּלְחָמָה యొక్క యుద్ధ సందర్భాన్ని కలిపి అందిస్తుంది.
- source_word: כִּי יָצָא הָאֱלֹהִים לְפָנֶיךָ
  choice: ఎందుకంటే ... దేవుడు నీకు ముందుగా బయలుదేరాడు
  rationale: כִּי కారణాన్ని పరిచయం చేస్తుంది. పరిపూర్ణ క్రియ יָצָא దైవిక చర్య అప్పటికే మొదలైందని చూపుతుంది; ‘బయలుదేరాడు’ సైనిక గమన చిత్రాన్ని నిలుపుతుంది.
- source_word: לְהַכּוֹת אֶת מַחֲנֵה פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల శిబిరాన్ని హతమార్చడానికి
  rationale: נכה యొక్క హిఫీల్ రూపం కొట్టడం, హతమార్చడం లేదా ఓడించడం అనే నిర్ణాయక సైనిక చర్యను సూచిస్తుంది. ‘హతమార్చడానికి’ బలాన్ని నిలుపుతుంది; ‘ఓడించడానికి’ మాత్రమే అనడం దెబ్బకొట్టే మూల భావాన్ని సడలిస్తుంది.
theological_decisions:
- issue: הָאֱלֹהִים అనువాదం
  choice: దేవుడు
  alternative: దేవతలు
  rationale: אֱלֹהִים రూపపరంగా బహువచనమైనా, ఇక్కడ ఏకవచన క్రియతో వచ్చి ఇశ్రాయేలు దేవుణ్ణి సూచిస్తోంది; కాబట్టి ఏకవచన ‘దేవుడు’ సరైనది.
- issue: దేవుని ముందుగా బయలుదేరే చర్య యొక్క కాలబలం
  choice: దేవుడు ... బయలుదేరాడు
  alternative: దేవుడు ... బయలుదేరుతాడు
  rationale: మూలంలోని పరిపూర్ణ క్రియను భవిష్యత్తు వాగ్దానంగా మార్చకుండా, సూచన వినిపించే సమయానికి దైవిక చర్య ప్రారంభమై ఉందనే ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, స్పష్టమైన కథన శైలి. ‘మస్తకి’ సాధారణ పాఠకునికి అంతగా పరిచయం లేకపోవచ్చని పాదసూచికతో వృక్షజాతి అనిశ్చితిని తెలిపాం. దేవుని చర్యకు సంబంధించిన సైనిక చిత్రాన్ని, మూలంలోని కాలసూచనను నిలుపుకున్నాం.
