id: 1CH.14.17
reference: 1 Chronicles 14:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֵּצֵ֥א שֵׁם דָּוִ֖יד בְּ/כָל הָֽ/אֲרָצ֑וֹת וַֽ/יהוָ֛ה נָתַ֥ן אֶת פַּחְדּ֖/וֹ עַל כָּל הַ/גּוֹיִֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/017.yaml
  text: And David’s name went out into all the lands[b][a], and Yahweh put the fear of him on all the nations.
translation:
  language: te
  text: దావీదు పేరు అన్ని దేశాల్లో వ్యాపించింది[a]; యహ్వే అన్ని జనాంగాలకు దావీదంటే భయం కలిగించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దావీదు కీర్తి అన్ని దేశాల్లో వ్యాపించింది.”
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీయ పదబంధం పదశః, “యహ్వే అతని భయాన్ని అన్ని జనాంగాల మీద ఉంచాడు.” సందర్భంలో “అతని” దావీదును సూచిస్తుంది; అయితే వ్యాకరణపరంగా అది యహ్వేను కూడా సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא שֵׁם דָּוִיד
  choice: దావీదు పేరు … వ్యాపించింది
  rationale: יצא అనే క్రియకు మూలార్థం ‘బయటికి వెళ్లడం.’ అయితే ‘పేరు’తో కూడిన ఈ నుడికారంలో దావీదు కీర్తి విస్తరించిందనే భావం ఉంది. తెలుగులో సహజంగా ఉండేందుకు ‘పేరు వ్యాపించింది’ అని అనువదించాం; ‘పేరు’ అనే హెబ్రీయ రూపకాన్ని నిలిపాం.
- source_word: בְּכָל הָאֲרָצוֹת
  choice: దేశాలన్నిటికీ
  rationale: אֲרָצוֹת ఇక్కడ చుట్టుపక్కల ఉన్న అనేక దేశాలు లేదా ప్రాంతాలను సూచిస్తుంది. יצא లోని గమనభావాన్ని తెలుగులో ‘-కీ’ తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: נָתַן
  choice: రప్పించాడు
  rationale: పదశః ‘ఇచ్చాడు/ఉంచాడు.’ פחד మరియు עַל కలిసిన సందర్భంలో ఎవరి మీదనైనా భయం కలిగేలా చేయడం అనే నుడికార భావాన్ని సహజమైన తెలుగులో ‘రప్పించాడు’ తెలియజేస్తుంది.
- source_word: פַּחְדּוֹ
  choice: దావీదు పట్ల భయాన్ని
  rationale: మూడవ పురుష ఏకవచన ప్రత్యయం సందర్భానుసారం దావీదును సూచిస్తుంది. తెలుగులో ‘అతని భయం’ అనేది అతడు అనుభవించిన భయమని అపార్థం కావచ్చు కాబట్టి భావాన్ని స్పష్టంగా తెలిపాం.
- source_word: עַל כָּל הַגּוֹיִם
  choice: జనాలన్నిటి మీదికి
  rationale: גּוֹיִם ఇక్కడ చుట్టుపక్కల ఉన్న జనాలను లేదా జనాంగాలను సూచిస్తుంది. עַל తో కూడిన ‘భయాన్ని మీద ఉంచడం’ అనే హెబ్రీయ నుడికారాన్ని తెలుగులో సహజంగా వ్యక్తం చేశాం.
theological_decisions:
- issue: פַּחְדּוֹ లోని సర్వనామ ప్రత్యయం ఎవరిని సూచిస్తుంది?
  choice: దావీదును సూచిస్తున్నట్లు ప్రధాన పాఠ్యంలో స్పష్టంగా అనువదించాం.
  alternative: అది యహ్వేను సూచించి, ‘యహ్వే పట్ల భయం’ అనే అర్థం ఇవ్వవచ్చు.
  rationale: సమీప సందర్భం దావీదు సాధించిన విజయాలు, అతని పేరు దేశాలకు వ్యాపించడం గురించి చెబుతోంది. అందువల్ల యహ్వే జనాలు దావీదుకు భయపడేలా చేశాడనే పఠనం సందర్భానికి అత్యంత అనుకూలం. అయినా హెబ్రీయ ప్రత్యయం రూపరీత్యా రెండింటిలో ఏ పురుష ఏకవచన పూర్వపదానికైనా తిరిగి సూచించగలదు కాబట్టి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. హెబ్రీయ ‘పేరు’ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని ‘కీర్తి’ భావాన్ని పాదసూచికలో ఇచ్చాం. అస్పష్టంగా ఉండగల సర్వనామ ప్రత్యయాన్ని సందర్భానుసారం ప్రధాన పాఠ్యంలో స్పష్టం చేసి, నిజమైన వ్యాకరణ ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరిచాం.
