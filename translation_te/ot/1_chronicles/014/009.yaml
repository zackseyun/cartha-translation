  text: The Philistines came and raided the Valley of Rephaim[a].
translation:
  language: te
  text: ఫిలిష్తీయులు వచ్చి రెఫాయీము లోయలో దాడి చేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రెఫాయీము లోయలో వ్యాపించారు.’ హీబ్రూ క్రియ సైనికులు విస్తరించి మోహరించడాన్ని లేదా దాడి చేయడాన్ని సూచించగలదు; సందర్భం శత్రుత్వపూర్వక సైనిక చొరబాటును సూచిస్తోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: ఫిలిష్తీయులు
  rationale: פְלִשְׁתִּים అనే జాతిపేరును తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణతో ఇచ్చాం. ו అనే సంధికారకాన్ని తెలుగు కథన ప్రవాహంలో ప్రత్యేకంగా అనువదించాల్సిన అవసరం లేదు.
- source_word: בָּאוּ
  choice: వచ్చి
  rationale: בוא క్రియ యొక్క సాధారణ అర్థం ‘వచ్చారు’; తరువాతి క్రియతో సహజమైన తెలుగు కథన క్రమాన్ని చూపడానికి ‘వచ్చి’ అని ఇచ్చాం.
- source_word: וַיִּפְשְׁטוּ
  choice: దాడి చేశారు
  rationale: సైనిక సందర్భంలో פשט శత్రుత్వపూర్వకంగా విస్తరించి దాడి చేయడం లేదా దోపిడీ దాడి చేయడం అనే భావాన్ని ఇవ్వగలదు. సందర్భానుకూలంగా ‘దాడి చేశారు’ సహజంగా ఉంది; ‘వ్యాపించారు’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: בְּ/עֵמֶק
  choice: లోయలో
  rationale: עֵמֶק అంటే ‘లోయ’; ב అనే ఉపసర్గ సూచించే స్థలార్థాన్ని ‘లో’తో స్పష్టంగా నిలిపాం.
- source_word: רְפָאִים
  choice: రెఫాయీము
  rationale: ఇక్కడ ఇది ‘రెఫాయీము లోయ’ అనే స్థలనామంలో భాగం; అందువల్ల అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సంక్షిప్తతను నిలుపుతూ, פשט క్రియలోని నిజమైన అర్థసందిగ్ధతను పాదసూచికలో సంరక్షించాం.
