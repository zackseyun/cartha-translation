source:
  edition: WLC
  text: וַ/יַּעַזְבוּ שָׁ֖ם אֶת אֱלֹֽהֵי/הֶ֑ם וַ/יֹּ֣אמֶר דָּוִ֔יד וַ/יִּשָּׂרְפ֖וּ בָּ/אֵֽשׁ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/012.yaml
  text: And they left their gods there[a], and David gave the order[b], and they were burned with fire.
translation:
  language: te
  text: వారు తమ దేవుళ్లను అక్కడ విడిచిపెట్టారు[a]. దావీదు ఆజ్ఞ ఇచ్చాడు[b], వాటిని అగ్నితో కాల్చివేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమ విగ్రహాలను.’ హీబ్రూలో అక్షరార్థంగా ‘తమ దేవుళ్లను’ అని ఉంది; ఇక్కడ వారి పూజా ప్రతిమలు ఉద్దేశించబడి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: దీనికి సమాంతరమైన 2 సమూయేలు 5:21 వచనం, ‘దావీదు, అతని మనుషులు వాటిని తీసుకుపోయారు’ అని చెబుతుంది. దినవృత్తాంతాల వర్ణనలో, దావీదు మాట్లాడిన తరువాత వాటిని అగ్నితో కాల్చివేశారు అని ఉంది.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: విడిచిపెట్టారు
  rationale: עזב అనే క్రియకు ‘విడిచిపెట్టు, వదిలివేయు’ అనే అర్థాలున్నాయి. పారిపోతున్నప్పుడు వాటిని అక్కడే వదిలివెళ్లిన భావాన్ని ఈ పదం సహజంగా తెలియజేస్తుంది.
- source_word: שָׁם
  choice: అక్కడ
  rationale: స్థలాన్ని సూచించే సాధారణ క్రియావిశేషణాన్ని సంక్షిప్తంగా, సహజంగా అనువదిస్తుంది.
- source_word: אֶת אֱלֹהֵיהֶם
  choice: తమ దేవుళ్లను
  rationale: హీబ్రూ వచనం అక్షరార్థంగా ‘వారి దేవుళ్లు’ అని చెబుతుంది. సందర్భంలో పూజా విగ్రహాలు ఉద్దేశించబడి ఉండవచ్చు; అయినా మూలపదంలోని ఉద్దేశపూర్వక పదప్రయోగాన్ని ప్రధాన పాఠ్యంలో నిలిపి ఉంచాం.
- source_word: וַיֹּאמֶר דָּוִיד
  choice: దావీదు ఆజ్ఞ ఇవ్వగా
  rationale: అక్షరార్థంగా ‘దావీదు అన్నాడు.’ తరువాత జరిగిన దహనం అతని మాటకు ప్రతిస్పందనగా ఉన్నందున, ఆ మాట యొక్క ఆజ్ఞాత్మక కార్యాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיִּשָּׂרְפוּ
  choice: కాల్చివేశారు
  rationale: హీబ్రూలో క్రియ బహువచన కర్తతో క్రియాశీల రూపంలో ఉంది; అయితే కర్త స్పష్టంగా పేర్కొనబడలేదు. తెలుగులో కర్తలేని ప్రయోగం ఆ అనిర్దిష్టతను కాపాడుతూ, దేవుళ్ల ప్రతిమలే దహనం చేయబడ్డాయని స్పష్టం చేస్తుంది.
- source_word: בָּאֵשׁ
  choice: అగ్నితో
  rationale: בְּ ఉపసర్గ ఇక్కడ సాధనాన్ని సూచిస్తుంది; ‘అగ్నితో’ మూలంలోని భావాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: అన్యజనుల పూజా వస్తువుల సందర్భంలో אֱלֹהֵיהֶם పదాన్ని ఎలా అనువదించాలి
  choice: తమ దేవుళ్లను
  alternative: తమ విగ్రహాలను
  rationale: మూల హీబ్రూ పాఠ్యం ‘వారి దేవుళ్లు’ అనే పదాన్నే ఉపయోగిస్తుంది. వాటిని ‘విగ్రహాలు’ అని ప్రధాన పాఠ్యంలో మార్చడం సందర్భానుసారమైన వివరణ అవుతుంది; అందువల్ల అక్షరార్థాన్ని పాఠ్యంలో ఉంచి, సాధ్యమైన సూచనను పాదసూచికలో తెలిపాం.
- issue: וַיִּשָּׂרְפוּ క్రియలో పేర్కొనని కర్త
  choice: కర్తను పేర్కొనకుండా ‘కాల్చివేశారు’
  alternative: వారు వాటిని కాల్చివేశారు
  rationale: హీబ్రూ క్రియ బహువచన కర్తను సూచించినా ఆ కర్త ఎవరో వచనం పేరుపెట్టి చెప్పదు. ముందు ఉన్న ‘వారు’తో అనవసరంగా అదే కర్తను అనుసంధానించకుండా, మూలంలోని కర్త అనిర్దిష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘దేవుళ్లు’ అనే మూలపదాన్ని నిలిపి, ‘విగ్రహాలు’ అనే సందర్భానుసార అర్థాన్ని పాదసూచికకు పరిమితం చేశాం. చివరి క్రియలో కర్తను కృత్రిమంగా గుర్తించకుండా హీబ్రూ వాక్యంలోని అనిర్దిష్టతను కాపాడాం.
