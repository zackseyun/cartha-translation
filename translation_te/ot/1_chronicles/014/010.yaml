id: 1CH.14.10
reference: 1 Chronicles 14:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשְׁאַ֨ל דָּוִ֤יד בֵּ/אלֹהִים֙ לֵ/אמֹ֔ר הַ/אֶֽעֱלֶה֙ עַל פלשתיים וּ/נְתַתָּ֖/ם בְּ/יָדִ֑/י וַ/יֹּ֨אמֶר ל֤/וֹ יְהוָה֙ עֲלֵ֔ה וּ/נְתַתִּ֖י/ם בְּ/יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/010.yaml
  text: And David inquired of God[a], saying, “Shall I go up against the Philistines, and will you give them into my hand?” And Yahweh said to him, “Go up, and I will give them into your hand.”
translation:
  language: te
  text: 'దావీదు దేవునిని సంప్రదించి ఇలా అడిగాడు: “నేను ఫిలిష్తీయుల మీదికి వెళ్లాలా? నీవు వారిని నా చేతికి అప్పగిస్తావా?” యాహ్వే అతనితో, “వెళ్లు; నేను వారిని నీ చేతికి అప్పగిస్తాను” అన్నాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని నీ చేతికి ఇస్తాను.” హీబ్రూ నుడికారం అక్షరార్థంగా ‘చేతికి ఇవ్వడం’; అంటే ఒకరి అధికారంలోకి అప్పగించడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  choice: దేవుని దగ్గర విచారణ చేస్తూ ... అడిగాడు
  rationale: ఇది సాధారణ ప్రశ్నకన్నా దేవుని మార్గదర్శకత్వాన్ని కోరడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండేలా ‘విచారణ చేస్తూ ... అడిగాడు’ అని ఇచ్చాం.
- source_word: הַאֶעֱלֶה עַל פלשתיים
  choice: నేను ఫిలిష్తీయుల మీదికి వెళ్లాలా?
  rationale: עלה అనే కదలికను ‘వెళ్లడం’గా సహజీకరిస్తూ, על యొక్క సైనిక విరోధ భావాన్ని ‘మీదికి’ ద్వారా నిలిపాం.
- source_word: וּנְתַתָּם בְּיָדִי
  choice: నీవు వారిని నా చేతికి అప్పగిస్తావా?
  rationale: ‘చేతిలో ఇవ్వడం’ అనే హీబ్రూ నుడికారంలోని చేతి ప్రతిమను నిలుపుతూ, శత్రువును ఒకరి అధికారానికి అప్పగించడం అనే భావాన్ని స్పష్టంగా తెలిపాం.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: עֲלֵה
  choice: వెళ్లు
  rationale: దావీదు ప్రశ్నలోని עלה క్రియకు సమాధానంలోనూ అనురూపత ఉండేలా ‘వెళ్లు’ అని ఇచ్చాం.
- source_word: וּנְתַתִּים בְּיָדֶךָ
  choice: నేను వారిని నీ చేతికి అప్పగిస్తాను
  rationale: ప్రశ్నలోని పదబంధాన్ని ప్రతిధ్వనింపజేస్తూ హీబ్రూ వాక్యంలోని సాహిత్య సమాంతరతను కాపాడాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ మూలంలో వ్యక్తిగత దైవనామమే ఉంది. దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఉపయోగించాం; ‘యాహ్వే’ కూడా సాధ్యమైన లిప్యంతరీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. సైనిక సందర్భం సహజంగా వినిపించేలా ‘ఫిలిష్తీయుల మీదికి’ అని, נתן ביד నుడికారాన్ని చిత్రాత్మకంగా నిలుపుతూ ‘చేతికి అప్పగించు’ అని అనువదించాం.
