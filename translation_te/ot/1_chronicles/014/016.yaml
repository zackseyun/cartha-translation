  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ דָּוִ֔יד כַּֽ/אֲשֶׁ֥ר צִוָּ֖/הוּ הָֽ/אֱלֹהִ֑ים וַ/יַּכּוּ֙ אֶת מַחֲנֵ֣ה פְלִשְׁתִּ֔ים מִ/גִּבְע֖וֹן וְ/עַד גָּֽזְרָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/016.yaml
  text: So David did as God had commanded him, and they struck down the Philistine army from Gibeon as far as Gezer.
translation:
  language: te
  text: దావీదు దేవుడు తనకు ఆజ్ఞాపించినట్లే చేశాడు; వారు గిబియోను నుండి గెజెరు వరకు ఫిలిష్తీయుల సైన్యాన్ని ఓడించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఫిలిష్తీయుల శిబిరాన్ని.” ఇక్కడ “శిబిరం” అనేది అక్కడున్న సైనిక బలగాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... כַּאֲשֶׁר צִוָּהוּ
  choice: తనకు ఆజ్ఞాపించినట్లే ... చేశాడు
  rationale: దావీదు దేవుని ఆజ్ఞకు అనుగుణంగా చేసినట్లు తెలిపే సహజమైన తెలుగు ప్రయోగం; ఆజ్ఞ ముందుగా ఇవ్వబడిందనే క్రమం సందర్భంలో స్పష్టంగా ఉంటుంది.
- source_word: הָאֱלֹהִים
  choice: దేవుడు
  rationale: నిర్దిష్ట ఆర్టికల్ ఉన్నప్పటికీ సందర్భంలో ఇది ఇశ్రాయేలు దేవునికి నామసూచకంగా వాడబడింది; తెలుగులో ‘దేవుడు’ సహజం.
- source_word: וַיַּכּוּ
  choice: వారు ... హతమార్చారు
  rationale: హీబ్రూ క్రియ బహువచనంలో ఉంది; కాబట్టి దావీదు ఒక్కడే కాక అతనితో ఉన్న సైనికులు కూడా కర్తలని రూపం సూచిస్తుంది. యుద్ధ సందర్భంలో נכה యొక్క బలాన్ని ‘హతమార్చారు’ నిలుపుతుంది.
- source_word: מַחֲנֵה פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల సైన్యాన్ని
  rationale: מַחֲנֶה అక్షరార్థంగా ‘శిబిరం’; యుద్ధ సందర్భంలో శిబిరంలో ఉన్న సైనిక బలగాన్ని సూచించే లక్షణార్థ ప్రయోగం కావచ్చు. సాధారణ ఆధునిక తెలుగులో ‘సైన్యం’ ఉద్దేశిత భావాన్ని స్పష్టంగా అందిస్తుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: מִגִּבְעוֹן וְעַד גָּזְרָה
  choice: గిబియోను నుండి గెజెరు వరకు
  rationale: מִן ... עַד నిర్మాణం చర్య విస్తరించిన హద్దును సూచిస్తుంది; ‘నుండి ... వరకు’ దానిని సహజంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: וַיַּכּוּ అనే యుద్ధక్రియకు కర్త
  choice: దావీదు మరియు అతని సైనికులను సూచించే బహువచనం—‘వారు’
  alternative: దావీదు ఒక్కడినే సూచించే ఏకవచన భావం
  rationale: మూల హీబ్రూ క్రియ స్పష్టంగా బహువచన రూపంలో ఉంది; అనువాదం ఈ వ్యాకరణ వివరాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘ఫిలిష్తీయులు,’ ‘గిబియోను,’ ‘గెజెరు’ అనే రూపాలు బైబిలు స్థలనామాలు, జననామాలకు అనువైన తెలుగు లిప్యంతరీకరణలు. పాదటిప్పణి సూచిక ప్రధాన వాక్యంలో ఉంచబడింది.
