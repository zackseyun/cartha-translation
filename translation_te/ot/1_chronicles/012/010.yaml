translation_notes:
  register: సంక్షిప్తమైన పేర్ల జాబితా శైలిని నిలిపి, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించాం. ‘ప్రధానుడు’ అనే పదం హీబ్రూ రూపకార్థాన్ని తెలియజేస్తుండగా, అక్షరార్థం మరియు మరో సహజ ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడ్డాయి.
