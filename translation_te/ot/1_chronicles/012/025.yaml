  yaml_path: translation/ot/1_chronicles/012/025.yaml
  text: From the sons of Judah[a], carrying shield and spear, there were 6,800 equipped for battle.
translation:
  language: te
  text: డాలు, ఈటెలు మోసిన యూదా వంశస్థులు, యుద్ధానికి సిద్ధమైనవారు[a], 6,800 మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యుద్ధానికి ఆయుధాలు ధరించినవారు.” హీబ్రూ పదబంధం యుద్ధం చేయడానికి ఆయుధాలతో సిద్ధంగా ఉన్నవారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  choice: యూదా వంశస్థులలో
  rationale: ఈ సందర్భంలో ఈ పదబంధం యూదా గోత్రానికి చెందిన వారిని సూచిస్తుంది. జాబితాలోని ఒక దళాన్ని పరిచయం చేస్తున్న భావాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘వంశస్థులలో’ అని అనువదించాం.
- source_word: נֹשְׂאֵי
  choice: మోసేవారు
  rationale: נשׂא ధాతువు ఇక్కడ యుద్ధ సామగ్రిని మోయడం లేదా ధరించడం అనే భావంలో ఉంది. ‘మోసేవారు’ మూలంలోని కృదంత రూపాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: צִנָּה
  choice: డాలు
  rationale: צִנָּה సాధారణంగా పెద్ద రక్షణ కవచాన్ని సూచించగలదు. అయితే పరిమాణాన్ని పాఠం స్పష్టంగా చెప్పనందున, ఆధునిక తెలుగులో సులభంగా అర్థమయ్యే ‘డాలు’ ఎంచుకున్నాం.
- source_word: וָרֹמַח
  choice: ఈటె
  rationale: רֹמַח పొడిచే పొడవైన యుద్ధాయుధమైన spear లేదా lance‌ను సూచిస్తుంది. దానికి సహజమైన ప్రామాణిక తెలుగు పదం ‘ఈటె’.
- source_word: שֵׁשֶׁת אֲלָפִים וּשְׁמוֹנֶה מֵאוֹת
  choice: 6,800
  rationale: హీబ్రూ సంఖ్యను మార్చకుండా, సైనికుల జాబితాలో వెంటనే గ్రహించగల అంకెల రూపంలో ఇచ్చాం.
- source_word: חֲלוּצֵי צָבָא
  choice: యుద్ధానికి సన్నద్ధులైనవారు
  rationale: ఈ సైనిక సందర్భంలో חֲלוּצֵי צָבָא యుద్ధానికి ఆయుధసన్నద్ధంగా లేదా సిద్ధంగా ఉన్న వారిని సూచిస్తుంది. ‘యుద్ధానికి సన్నద్ధులైనవారు’ సిద్ధతను స్పష్టంగా తెలిపి, ముందున్న ఆయుధాల ప్రస్తావనను అనవసరంగా పునరావృతం చేయదు.
