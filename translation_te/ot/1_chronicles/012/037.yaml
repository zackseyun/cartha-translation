translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే సైనిక పదజాలాన్ని వాడాం. ‘బారులు తీరడం’ ద్వారా యుద్ధానికి క్రమబద్ధంగా నిలబడే భావాన్ని నిలిపాం; మూలంలోని సంక్షిప్త జాబితా శైలిని సాధ్యమైనంతవరకు కాపాడాం.
