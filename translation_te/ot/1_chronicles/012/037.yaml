  text: And from Asher[a], forty thousand who went out for military service, to array themselves for battle.
translation:
  language: te
  text: ఆషేరు నుండి, యుద్ధసేవకు బయలుదేరి యుద్ధానికి మోహరించేవారు నలభై వేల మంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యుద్ధానికి మోహరించగల నలభై వేల మంది.” హీబ్రూలో “యుద్ధసేవకు బయలుదేరడం” అనే మాటతో పాటు, యుద్ధక్రమంలో దళాలను నిలపడం లేదా మోహరించడం అనే అర్థమిచ్చే క్రియ ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/אָשֵׁר
  choice: ఆషేరు నుండి
  rationale: సందర్భంలోని జాబితా కొనసాగింపును తెలుగులో సహజంగా ఉంచుతూ, గోత్రనామాన్ని విస్తరించకుండా యథాతథంగా లిప్యంతరీకరించాం.
- source_word: יוֹצְאֵי צָבָא
  choice: యుద్ధసేవకు బయలుదేరి
  rationale: יצא అనే బయలుదేరు భావాన్నీ, צבא యొక్క సైనిక సేవ/సైన్య విధి భావాన్నీ కలిపి సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לַ/עֲרֹךְ מִלְחָמָה
  choice: యుద్ధానికి బారులు తీరగలవారు
  rationale: ערך యొక్క యుద్ధవ్యవస్థలో క్రమంగా నిలబెట్టడం లేదా మోహరించడం అనే భావాన్ని ‘బారులు తీరడం’ సహజంగా అందిస్తుంది; జాబితా సందర్భంలో సామర్థ్య భావం అంతర్లీనంగా ఉన్నా, దానిని పాదసూచికలో ప్రత్యామ్నాయంగా గుర్తించాం.
- source_word: אַרְבָּעִים אָלֶף
  choice: నలభై వేల మంది
  rationale: సంఖ్యను నేరుగా అనువదించి, లెక్కించబడుతున్నవారు మనుషులు కాబట్టి సహజ తెలుగు కోసం ‘మంది’ చేర్చాం.
