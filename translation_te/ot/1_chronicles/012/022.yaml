revisions:
- from: వారు దోపిడీ దండుకు వ్యతిరేకంగా దావీదుకు సహాయం చేశారు[a]. వారందరూ పరాక్రమవంతులైన యోధులు[b]; వారు సైన్యంలో అధిపతులయ్యారు[c].
