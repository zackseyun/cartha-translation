id: 1CH.12.22
reference: 1 Chronicles 12:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הֵ֗מָּה עָזְר֤וּ עִם דָּוִיד֙ עַֽל הַ/גְּד֔וּד כִּֽי גִבּ֥וֹרֵי חַ֖יִל כֻּלָּ֑/ם וַ/יִּהְי֥וּ שָׂרִ֖ים בַּ/צָּבָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/022.yaml
  text: And they helped David against the raiding band[a], for all of them were mighty men of valor[c][b], and they became commanders in the army.
translation:
  language: te
  text: వారు దావీదుతో కలిసి ఆ దండుకు వ్యతిరేకంగా పోరాటంలో తోడ్పడ్డారు[a], ఎందుకంటే వారందరూ పరాక్రమవంతులైన యోధులు[b]; వారు సైన్యంలో అధిపతులయ్యారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దోపిడీ దండుకు వ్యతిరేకంగా’ లేదా ‘సైనిక బృందానికి వ్యతిరేకంగా’; హీబ్రూ పదం గెదూద్ (גְּדוּד) సైనిక దండును లేదా దోపిడీ దాడులు చేసే బృందాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘శౌర్యవంతులైన పోరాట వీరులు’; గిబ్బోరే ఖయిల్ (גִבּוֹרֵי חַיִל) అనేది సమర్థులైన, పరాక్రమంగల యోధులను సూచించే సాధారణ హీబ్రూ పదబంధం.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘సేనాధిపతులు’ లేదా ‘నాయకులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה
  choice: వారు
  rationale: స్వతంత్ర సర్వనామం విషయాన్ని నొక్కిచెబుతుంది. ఆధునిక తెలుగులో స్పష్టమైన కర్తగా ‘వారు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: עָזְרוּ עִם דָּוִיד
  choice: దావీదుకు సహాయం చేశారు
  rationale: עזר అంటే ‘సహాయం చేయు, ఆదుకొను.’ עִם సాధారణంగా ‘తో’ అని అర్థమైనా, ఈ నిర్మాణంలో సహాయం పొందిన వ్యక్తిని తెలుగులో ‘దావీదుకు’ అని చెప్పడం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: עַל הַגְּדוּד
  choice: దోపిడీ దండుకు వ్యతిరేకంగా
  rationale: גְּדוּד అనేది సైనిక దండు లేదా దాడిచేసే దోపిడీ ముఠాను సూచించగలదు. ఈ యుద్ధ సందర్భంలో ‘దోపిడీ దండు’ తగిన అర్థాన్ని ఇస్తుంది; עַל శత్రుత్వ సంబంధాన్ని ‘వ్యతిరేకంగా’ అని తెలియజేస్తుంది.
- source_word: כִּי
  choice: వాక్య విభజన ద్వారా కారణ సంబంధం
  rationale: כִּי ముందున్న సహాయానికి లేదా వారి సైనిక పాత్రకు వివరణను పరిచయం చేస్తుంది. తెలుగులో ప్రత్యేక వాక్యంగా కొనసాగించడం ఈ వివరణాత్మక సంబంధాన్ని సహజంగా ఉంచుతుంది.
- source_word: גִבּוֹרֵי חַיִל
  choice: పరాక్రమవంతులైన యోధులు
  rationale: ఇది బలవంతులు, సమర్థులు, శౌర్యంగల పోరాట వీరులను సూచించే స్థిరమైన హీబ్రూ సైనిక పదబంధం. ‘పరాక్రమవంతులైన యోధులు’ ఆధునిక తెలుగులో దాని భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: כֻּלָּם
  choice: వారందరూ
  rationale: ప్రత్యయంతో ఉన్న ఈ రూపం ఆ సమూహంలోని ప్రతి ఒక్కరినీ నొక్కిచెబుతుంది; ‘వారందరూ’ ఆ సమగ్ర భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּהְיוּ
  choice: అయ్యారు
  rationale: ఈ సందర్భంలో היה కథన పురోగతిలో ఏర్పడిన స్థితిని సూచిస్తుంది. అందువల్ల స్థిరమైన ‘ఉన్నారు’ కంటే ‘అయ్యారు’ మూలంలోని ఫలిత భావాన్ని కాపాడుతుంది.
- source_word: שָׂרִים
  choice: అధిపతులు
  rationale: שָׂרִים అధికారులు, నాయకులు లేదా సైనిక కమాండర్లను సూచించగలదు. సైనిక సందర్భంలో ‘అధిపతులు’ విస్తృతమైన మూలార్థాన్ని కాపాడుతూ సహజంగా ఉంటుంది.
- source_word: בַּצָּבָא
  choice: సైన్యంలో
  rationale: צָבָא ఇక్కడ వ్యవస్థీకృత సైనిక బలగాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘సైన్యం’ అత్యంత సహజమైన సమానార్థకం.
