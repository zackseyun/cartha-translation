- source_word: יֽוֹחָנָן
  choice: యోహానాను
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הַ/שְּׁמִינִי
  choice: ఎనిమిదవవాడు
  rationale: నిర్దిష్ట క్రమసూచక విశేషణం జాబితాలో వ్యక్తి స్థానాన్ని సూచిస్తోంది; తెలుగులో సహజంగా వ్యక్తిని సూచించే రూపాన్ని వాడాం.
- source_word: אֶלְזָבָד
  choice: ఎల్జాబాదు
  rationale: హీబ్రూ వ్యక్తిపేరును దాని ధ్వనిరూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: הַ/תְּשִׁיעִי
  choice: తొమ్మిదవవాడు
  rationale: మునుపటి పదబంధానికి సమాంతరంగా, జాబితాలో తొమ్మిదవ స్థానాన్ని స్పష్టంగా తెలిపే తెలుగు రూపాన్ని వాడాం.
