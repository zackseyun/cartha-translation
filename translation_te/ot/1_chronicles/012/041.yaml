source:
  edition: WLC
  text: וְ/גַ֣ם הַ/קְּרֽוֹבִים אֲ֠לֵי/הֶם עַד יִשָׂשכָ֨ר וּ/זְבֻל֜וּן וְ/נַפְתָּלִ֗י מְבִיאִ֣ים לֶ֡חֶם בַּ/חֲמוֹרִ֣ים וּ/בַ/גְּמַלִּ֣ים וּ/בַ/פְּרָדִ֣ים וּֽ/בַ/בָּקָ֡ר מַאֲכָ֡ל קֶ֠מַח דְּבֵלִ֨ים וְ/צִמּוּקִ֧ים וְ/יַֽיִן וְ/שֶׁ֛מֶן וּ/בָקָ֥ר וְ/צֹ֖אן לָ/רֹ֑ב כִּ֥י שִׂמְחָ֖ה בְּ/יִשְׂרָאֵֽל־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/041.yaml
  text: 'Also those near them[a], as far as Issachar and Zebulun and Naphtali, were bringing food on donkeys, camels, mules, and cattle: provisions of flour, fig cakes, raisin cakes, wine, oil, cattle, and sheep in abundance[c][b], for there was joy in Israel.'
translation:
  language: te
  text: వారికి సమీపంలో ఉన్నవారు కూడా—ఇశ్శాఖారు, జెబూలూను, నఫ్తాలి వరకు ఉన్నవారు—గాడిదలు, ఒంటెలు, కంచర గాడిదలు, పశువులపై ఆహారాన్ని తీసుకొస్తూ ఉన్నారు. వారు పిండి, అంజూరపు ముద్దలు, ఎండుద్రాక్షలు,[a] ద్రాక్షామద్యం, నూనె, అలాగే విస్తారంగా పశువులు, గొర్రెలు తీసుకొచ్చారు. ఎందుకంటే ఇశ్రాయేలులో ఆనందం నెలకొంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఎండుద్రాక్ష ముద్దలు.’ హీబ్రూ పదానికి ‘ఎండుద్రాక్షలు’ లేదా ‘ఎండిన ద్రాక్షపండ్లు’ అని అర్థం కావచ్చు; ఈ సరఫరాల సందర్భంలో ఒత్తి చేసిన ముద్దలు కూడా ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרוֹבִים אֲלֵיהֶם
  choice: వారి సమీప ప్రాంతాల్లో ఉన్నవారు
  rationale: మూలంలోని ‘వారికి సమీపంగా ఉన్నవారు’ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; కేవలం వ్యక్తిగత పొరుగువారనే అర్థానికి పరిమితం చేయదు.
- source_word: עַד יִשָׂשכָר וּזְבֻלוּן וְנַפְתָּלִי
  choice: ఇశ్శాఖారు, జెబూలూను, నఫ్తాలి ప్రాంతాల వరకు ఉన్నవారు
  rationale: עַד సూచించే భౌగోళిక విస్తృతిని స్పష్టంగా చూపుతుంది.
- source_word: מְבִיאִים
  choice: తీసుకొస్తూ ఉన్నారు
  rationale: హీబ్రూ వర్తమాన కృదంతం సూచించే కొనసాగుతున్న లేదా పునరావృత చర్యను నిలుపుతుంది.
- source_word: לֶחֶם
  choice: ఆహారాన్ని
  rationale: పదశః ‘రొట్టె’ అయినప్పటికీ, వెంట వచ్చే విస్తృత ఆహార జాబితా కారణంగా ఇక్కడ సమిష్టి అర్థంలో ‘ఆహారం’ సహజం.
- source_word: בַּחֲמוֹרִים וּבַגְּמַלִּים וּבַפְּרָדִים וּבַבָּקָר
  choice: గాడిదలు, ఒంటెలు, కంచరగాడిదలు, పశువుల మీద
  rationale: ב ఉపసర్గ రవాణా సాధనాన్ని సూచిస్తుంది; בָּקָר‌ను మూలానికి అనుగుణంగా ‘పశువులు’గా ఉంచింది, బండ్లు అని ఊహించలేదు.
- source_word: קֶמַח
  choice: పిండి
  rationale: ఆహార జాబితాలోని మెత్తగా విసిరిన ధాన్యపిండానికి సాధారణ తెలుగు పదం.
- source_word: דְּבֵלִים
  choice: అంజూరపు ముద్దలు
  rationale: నిల్వ, రవాణా కోసం ఒత్తి తయారుచేసిన అంజూరపు పదార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: צִמּוּקִים
  choice: ఎండుద్రాక్ష
  rationale: ఈ హీబ్రూ పదానికి నిశ్చయమైన సాధారణ అర్థాన్ని ప్రధాన పాఠంలో ఉంచి, ‘ఎండుద్రాక్ష ముద్దలు’ అనే సందర్భోచిత సాధ్యతను పాదటిప్పణిలో పేర్కొంది.
- source_word: יַיִן
  choice: ద్రాక్షారసం
  rationale: ద్రాక్షతో చేసిన పానీయాన్ని సాధారణ ఆధునిక తెలుగులో సూచిస్తుంది; మూలపదంలో లేని అదనపు వివరణను చేర్చదు.
- source_word: שֶׁמֶן
  choice: నూనె
  rationale: హీబ్రూ మూలంలో కేవలం ‘నూనె’ ఉంది; ‘ఒలీవ నూనె’ అని ప్రత్యేకీకరించలేదు.
- source_word: לָרֹב
  choice: విస్తారంగా
  rationale: పశువులు, గొర్రెలు సమృద్ధిగా తీసుకొచ్చారనే పరిమాణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: כִּי שִׂמְחָה בְּיִשְׂרָאֵל
  choice: ఎందుకంటే ఇశ్రాయేలులో ఆనందం నెలకొంది
  rationale: కారణార్థక כִּיని, ఇశ్రాయేలు మధ్య ఉన్న సామూహిక ఆనందాన్ని నేరుగా నిలుపుతుంది.
