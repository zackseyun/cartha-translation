    text: లేదా, “కోట.” హీబ్రూ పదం రక్షణనిచ్చే బలపరచబడిన ఆశ్రయస్థలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  revision_rationale: The revision preserves the partitive force and both tribal references, while rendering the destination naturally as David, who was at the stronghold. This reflects the force of 'to the stronghold, to David' without retaining an unnatural Hebrew-like coordination in Telugu. The existing lexical-alternative footnote remains valid and is anchored in the revised text.
