source:
  edition: WLC
  text: וַ/יָּבֹ֗אוּ מִן בְּנֵ֤י בִנְיָמִן֙ וִֽ/יהוּדָ֔ה עַד לַ/מְצָ֖ד לְ/דָוִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/017.yaml
  text: And some of the sons of Benjamin and Judah came to the stronghold[b][a], to David.
translation:
  language: te
  text: బెన్యామీను, యూదా వంశస్థులలో కొందరు దుర్గంలో ఉన్న దావీదు దగ్గరికి వచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కోట.” హీబ్రూ పదం రక్షణనిచ్చే బలపరచబడిన ఆశ్రయస్థలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: వచ్చారు
  rationale: కథనాన్ని ముందుకు నడిపించే בוא క్రియారూపం; దావీదు ఉన్న స్థలం వైపు కదలికను సహజంగా తెలియజేస్తుంది.
- source_word: מִן
  choice: వంశస్థుల్లో కొందరు
  rationale: మొత్తం గోత్రాలవారు కాక, వారిలో కొందరనే విభాగార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי בִנְיָמִן וִיהוּדָה
  choice: బెన్యామీను, యూదా వంశస్థులు
  rationale: హీబ్రూలో యూదాకు సంబంధించి ‘కుమారులు’ అనే పదం అధ్యాహారంగా ఉంది; ఆధునిక తెలుగులో రెండు గోత్రాలకు చెందిన వారిని సహజంగా సూచించడానికి ‘వంశస్థులు’ వాడబడింది.
- source_word: עַד
  choice: దగ్గరికి
  rationale: ఈ గమన సందర్భంలో గమ్యాన్ని సూచిస్తుంది; తరువాతి ‘దావీదు’తో కలిపి ‘దావీదు దగ్గరికి’ సహజమైన తెలుగు.
- source_word: הַמְצָד
  choice: దుర్గం
  rationale: రక్షణ కోసం ఉపయోగించే బలపరచబడిన ఆశ్రయస్థలాన్ని సంక్షిప్తంగా, సముచితంగా సూచిస్తుంది.
- source_word: לְדָוִיד
  choice: దావీదు దగ్గరికి
  rationale: గమ్యస్థలంలో ఉన్న దావీదుతో సంబంధాన్ని సూచిస్తుంది; ‘దావీదు దగ్గరికి, దుర్గానికి’ అనే క్రమం మూలంలోని రెండు సంబంధాలను నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. מִן లోని విభాగార్థాన్ని ప్రధాన పాఠ్యంలోనే ‘కొందరు’ అని స్పష్టం చేశాం; కాబట్టి దానికి ప్రత్యేక పాదసూచిక అవసరం లేదు. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
