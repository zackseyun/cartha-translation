base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/016.yaml
  text: These are the men who crossed the Jordan in the first month[a], when it was overflowing all its banks, and they put to flight all those in the valleys, to the east and to the west.
translation:
  language: te
  text: మొదటి నెలలో యొర్దాను నది తన గట్లన్నిటినీ మించి పొంగిపొర్లుతున్నప్పుడు దానిని దాటినవారు వీరే. వారు లోయల్లో ఉన్నవారందరినీ[a] తూర్పుకూ పడమరకూ పారద్రోలారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “లోయలన్నిటినీ.” అయితే “పారిపోయేలా చేశారు” అనే క్రియను బట్టి, ఇక్కడ లోయల్లో ఉన్న ప్రజలు ఉద్దేశించబడ్డారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הֵם
  choice: వీరే
  rationale: సూచనార్థక సర్వనామం, వ్యక్తి సర్వనామం కలిసిన నొక్కిచెప్పే గుర్తింపు సూత్రాన్ని సహజమైన తెలుగులో ‘వీరే’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֲשֶׁר עָבְרוּ אֶת הַיַּרְדֵּן
  choice: యొర్దాను నదిని దాటినవారు
  rationale: עָבַר అనే క్రియకు ఇక్కడ ‘దాటు’ అనే ప్రత్యక్ష అర్థమే సరిపోతుంది. తెలుగులో స్పష్టత కోసం యొర్దానుకు ‘నది’ చేర్చబడింది.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: మొదటి నెలలో
  rationale: హీబ్రూ కాలసూచక పదబంధానికి దగ్గరగా ఉండే సహజమైన తెలుగు రూపం.
- source_word: וְהוּא מְמַלֵּא עַל כָּל גְּדִיתָיו
  choice: యొర్దాను నది తన గట్లన్నిటినీ మించి పొంగిపొర్లుతున్నప్పుడు
  rationale: ఈ వాక్యభాగం యొర్దాను వరదస్థితిని వర్ణిస్తుంది. ‘మించి పొంగిపొర్లడం’ నది గట్లపైకి నీరు రావడాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיַּבְרִיחוּ
  choice: పారద్రోలారు
  rationale: ברח హిఫీల్ రూపంలోని ‘పారిపోయేలా చేయడం’ అనే కారణార్థాన్ని ‘పారద్రోలారు’ సహజంగా నిలుపుతుంది.
- source_word: אֶת כָּל הָעֲמָקִים
  choice: లోయల్లో ఉన్నవారందరినీ
  rationale: అక్షరార్థంగా ‘లోయలన్నిటినీ’ అయినప్పటికీ, పారద్రోలబడేది ప్రజలే కావడంతో ఇది లోయల్లో నివసించేవారిని సూచించే లక్షణార్థ ప్రయోగంగా అనువదించబడింది. అక్షరార్థం పాదసూచికలో నిలుపబడింది.
- source_word: לַמִּזְרָח וְלַמַּעֲרָב
  choice: తూర్పుకూ పడమరకూ
  rationale: రెండు దిశల వైపూ తరిమివేయబడిన భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
