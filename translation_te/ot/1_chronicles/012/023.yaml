    reason: lexical_alternative
  revision_rationale: The revision removes an awkward repetition, makes the purpose and destination relationships clear, and renders the Hebrew עַד more directly as “ఏర్పడే వరకు.” It preserves the iterative narrative sense, the implied subject, and the intentionally compact ambiguity of “దేవుని శిబిరం.”
