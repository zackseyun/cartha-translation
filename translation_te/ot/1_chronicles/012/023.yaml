  variant: modern standard Telugu
source:
  edition: WLC
  text: כִּ֚י לְ/עֶת י֣וֹם בְּ/י֔וֹם יָבֹ֥אוּ עַל דָּוִ֖יד לְ/עָזְר֑/וֹ עַד לְ/מַחֲנֶ֥ה גָד֖וֹל כְּ/מַחֲנֵ֥ה אֱלֹהִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/023.yaml
  text: For day by day they came to David to help him[a], until there was a great camp, like the camp of God.
translation:
  language: te
  text: ఎందుకంటే, రోజురోజుకూ వారు అతనికి సహాయం చేయడానికి దావీదు దగ్గరికి వచ్చేవారు; దేవుని శిబిరంలాంటి[a] ఒక గొప్ప శిబిరం ఏర్పడే వరకు అలా వచ్చేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దైవిక శిబిరంలాంటి,’ ‘పరలోక శిబిరంలాంటి.’ హీబ్రూ వ్యక్తీకరణ సంక్షిప్తంగానూ భావగర్భితంగానూ ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఈ వాక్యం ముందున్న కథనానికి వివరణను జోడిస్తుంది; తెలుగు ప్రవాహంలో కారణసూచక అనుసంధానంగా ఇది సహజంగా ఉంది.
- source_word: לְעֶת יוֹם בְּיוֹם
  choice: రోజురోజుకూ
  rationale: వరుసగా ప్రతి రోజూ కొనసాగిన రాకను తెలిపే హీబ్రూ ప్రయోగంలోని పునరావృత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: יָבֹאוּ
  choice: వచ్చేవారు
  rationale: కథన సందర్భంలోని ఇంపర్ఫెక్ట్ రూపం గతంలో పునరావృతంగా జరిగిన చర్యను సూచిస్తుంది; ‘వచ్చేవారు’ ఆ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: עַל דָּוִיד
  choice: దావీదు దగ్గరికి
  rationale: రావడం అనే క్రియతోను, తరువాతి సహాయార్థక పదబంధంతోను కలిపి చూసినప్పుడు עַל ఇక్కడ వ్యతిరేకతను కాక దావీదు వైపు గమనాన్ని సూచిస్తుంది.
- source_word: לְעָזְרוֹ
  choice: అతనికి సహాయం చేయడానికి
  rationale: ప్రత్యయంతో కూడిన క్రియానామ రూపం ఉద్దేశాన్ని తెలియజేస్తుంది; ఈ అనువాదం దానిని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עַד לְמַחֲנֶה גָדוֹל
  choice: చివరికి ... ఒక మహా శిబిరం ఏర్పడింది
  rationale: నిరంతర రాకలు చేరుకున్న ఫలితాన్ని עַד సూచిస్తుంది. తెలుగులో పూర్తి వాక్యంగా ఉండేందుకు సందర్భంలో అంతర్లీనంగా ఉన్న ‘ఏర్పడింది’ చేర్చబడింది; גָדוֹלకు ‘మహా’ అని ఇచ్చి పరిమాణం, వైభవం రెండింటికీ అవకాశం ఉంచబడింది.
- source_word: כְּמַחֲנֵה אֱלֹהִים
  choice: దేవుని శిబిరంలాంటి
  rationale: హీబ్రూ ఉపమానాన్నీ, సంబంధ నిర్మాణాన్నీ నిలుపుతూ, అది అతి విస్తారమైన లేదా విస్మయం కలిగించే సమూహాన్ని సూచించే అవకాశాన్ని వ్యాఖ్యానంతో పరిమితం చేయకుండా ఉంచుతుంది.
theological_decisions:
- issue: כְּמַחֲנֵה אֱלֹהִים అనే ఉపమానంలో אֱלֹהִים భావం
  choice: దేవుని శిబిరం
  alternative: దైవిక శిబిరం / పరలోక శిబిరం
  rationale: ఇక్కడ ‘దేవుని శిబిరం’ అనే సంబంధార్థమే అత్యంత సహజం. ఇది హీబ్రూ వ్యక్తీకరణలోని దైవసంబంధ ప్రతిధ్వనిని నిలుపుతుంది; కేవలం పరిమాణాన్ని సూచించే విశేషణంగా దానిని కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. హీబ్రూ వాక్యంలోని పునరావృత చర్యను ‘రోజురోజుకూ ... వచ్చేవారు’ ద్వారా, ఫలితాన్ని ‘చివరికి ... ఏర్పడింది’ ద్వారా స్పష్టంగా వ్యక్తం చేసింది. ‘దేవుని శిబిరం’ అనే సాంద్రమైన ఉపమానాన్ని ప్రధాన పాఠ్యంలో యథాతథ భావంతో నిలిపింది.
