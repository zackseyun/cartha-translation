id: 1CH.12.28
reference: 1 Chronicles 12:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וִ/יהוֹיָדָ֖ע הַ/נָּגִ֣יד לְ/אַהֲרֹ֑ן וְ/עִמּ֕/וֹ שְׁלֹ֥שֶׁת אֲלָפִ֖ים וּ/שְׁבַ֥ע מֵאֽוֹת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/028.yaml
  text: and Jehoiada[a], the leader of Aaron, and with him three thousand seven hundred.
translation:
  language: te
  text: అహరోను వంశానికి నాయకుడైన యెహోయాదా[a], అతనితోపాటు 3,700 మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అహరోను పక్షాన నాయకుడైన యెహోయాదా”; అంటే అహరోను యాజక వంశానికి ప్రాతినిధ్యం వహించిన ప్రధాన నాయకుడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִ/יהוֹיָדָע
  choice: యెహోయాదా
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు రూపంలో లిప్యంతరీకరించాం. జాబితాలోని అనుసంధానాన్ని తెలుగులో సహజమైన వాక్య నిర్మాణం ద్వారా వ్యక్తం చేశాం.
- source_word: הַ/נָּגִיד
  choice: నాయకుడు
  rationale: నָגִיד అనే పదం నాయకుడు, అధిపతి, పాలకుడు అనే అర్థాలను ఇవ్వగలదు; ఈ వంశీయ-సైనిక జాబితా సందర్భంలో ‘నాయకుడు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: לְ/אַהֲרֹן
  choice: అహరోను వంశానికి
  rationale: לְ ఇక్కడ దిశకన్నా సంబంధం లేదా ప్రాతినిధ్యాన్ని సూచిస్తుంది. సందర్భంలో అహరోను యాజక వంశంతో యెహోయాదాకు ఉన్న సంబంధాన్ని ‘వంశానికి’ స్పష్టం చేస్తుంది; మూలంలోని సంక్షిప్తత వల్ల ఉన్న ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: וְ/עִמּ/וֹ
  choice: అతనితోపాటు
  rationale: యెహోయాదాతో ఉన్న వారి సంఖ్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּ/שְׁבַע מֵאוֹת
  choice: 3,700 మంది
  rationale: మూలంలోని ఖచ్చిత సంఖ్యను కాపాడుతూ, లెక్కించబడిన మనుషులను సూచించేందుకు తెలుగులో సహజంగా ‘మంది’ చేర్చాం.
theological_decisions:
- issue: לְאַהֲרֹן సూచించే సంబంధం
  choice: అహరోను వంశానికి నాయకుడు
  alternative: అహరోను పక్షాన నాయకుడు / అహరోనుకు నాయకుడు
  rationale: ఇది అహరోను యాజక వంశానికి చెందిన లేదా దానికి ప్రాతినిధ్యం వహించే నాయకుడని సందర్భం సూచిస్తుంది. అయితే לְ యొక్క సంబంధార్థక విస్తృతి పూర్తిగా ఏకార్థకం కానందున ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. వంశీయ సంబంధాన్ని స్పష్టపరుస్తూ మూలంలోని సాధ్యమైన ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో భద్రపరిచాం.
