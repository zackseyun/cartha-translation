revisions:
- from: వారు దావీదుతో అక్కడ మూడు రోజులు ఉండి, తింటూ తాగుతూ ఉన్నారు. ఎందుకంటే వారి సోదరులు[a] వారి కోసం సిద్ధం చేసి ఉంచారు.
  to: వారు దావీదుతో అక్కడ మూడు రోజులపాటు ఉన్నారు, తింటూ తాగుతూ ఉన్నారు; ఎందుకంటే వారి సోదరులు[a] వారి కోసం సిద్ధం చేసి ఉంచారు.
  rationale: The revision removes the mildly awkward “ఉండి ... ఉన్నారు” sequence while preserving the Hebrew’s simple statement of presence and its participial description of eating and drinking. The causal clause deliberately leaves the prepared item unstated, as in the source. The footnote remains anchored to “సోదరులు” and preserves the lexical ambiguity without replacing the literal main-text rendering.
