id: 1CH.12.40
reference: 1 Chronicles 12:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּהְיוּ שָׁ֤ם עִם דָּוִיד֙ יָמִ֣ים שְׁלוֹשָׁ֔ה אֹכְלִ֖ים וְ/שׁוֹתִ֑ים כִּֽי הֵכִ֥ינוּ לָ/הֶ֖ם אֲחֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/040.yaml
  text: They were there with David for three days[a], eating and drinking, because their brothers had prepared for them.
translation:
  language: te
  text: వారు దావీదుతో అక్కడ మూడు రోజులపాటు ఉన్నారు, తింటూ తాగుతూ ఉన్నారు; ఎందుకంటే వారి సోదరులు[a] వారి కోసం సిద్ధం చేసి ఉంచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి బంధువులు,’ ‘వారి స్వజనులు.’ హీబ్రూలో అక్షరార్థం ‘వారి సోదరులు’; ఈ సందర్భంలో అది అదే వంశానికి లేదా గోత్రానికి చెందినవారిని విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ఉన్నారు
  rationale: హయా క్రియ ఇక్కడ ఒక స్థలంలో ఉన్నారనే గతకాల కథన భావాన్ని తెలియజేస్తుంది; తెలుగు వాక్య నిర్మాణంలో కొనసాగుతున్న క్రియలతో కలిసి ‘ఉన్నారు’ సహజంగా ఉంటుంది.
- source_word: שָׁם
  choice: అక్కడ
  rationale: దావీదు ఉన్న కూడిక స్థలాన్ని సూచించే సాధారణ స్థలవాచక క్రియావిశేషణం.
- source_word: עִם דָּוִיד
  choice: దావీదుతో
  rationale: עִם సహవాసం లేదా తోడుగా ఉండడాన్ని నేరుగా సూచిస్తుంది.
- source_word: יָמִים שְׁלוֹשָׁה
  choice: మూడు రోజులు
  rationale: కాలవ్యవధిని ఆధునిక తెలుగులో సహజంగా ‘మూడు రోజులు’ అని వ్యక్తపరచవచ్చు.
- source_word: אֹכְלִים וְשׁוֹתִים
  choice: తింటూ తాగుతూ
  rationale: హీబ్రూ కృదంతాలు ఆ మూడు రోజులలో కొనసాగిన రెండు కార్యాలను స్పష్టంగా చెబుతున్నాయి; ‘విందు చేస్తూ’ అనే వ్యాఖ్యానాత్మక సంక్షిప్తీకరణను నివారించాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందు చెప్పిన తినడం, తాగడం సాధ్యమైన కారణాన్ని పరిచయం చేస్తుంది.
- source_word: הֵכִינוּ
  choice: సిద్ధం చేసి ఉంచారు
  rationale: כון యొక్క హిఫిల్ రూపం సిద్ధం చేయడం లేదా సిద్ధంగా ఉంచడం అనే భావం ఇస్తుంది. ముందుగానే చేసిన ఏర్పాటును తెలుగులో ఈ రూపం సహజంగా సూచిస్తుంది; హీబ్రూలో స్పష్టంగా లేని కర్మను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: לָהֶם
  choice: వారి కోసం
  rationale: దావీదుతో ఉన్నవారిని సూచించే పరోక్ష కర్మను నేరుగా అనువదిస్తుంది.
- source_word: אֲחֵיהֶם
  choice: వారి సోదరులు
  rationale: మూలంలోని పురుషలింగ బంధుత్వ పదాన్ని ప్రధాన పాఠ్యంలో నిలిపాం; సందర్భంలో దాని పరిధి బంధువులు లేదా వంశసభ్యుల వరకు విస్తరించవచ్చు.
theological_decisions:
- issue: אֲחֵיהֶם అనే పదానికి సందర్భానుసారంగా ఉండగల విస్తృత బంధుత్వ భావం
  choice: వారి సోదరులు
  alternative: వారి బంధువులు / వారి స్వజనులు
  rationale: ఇక్కడ ప్రత్యేక సిద్ధాంత వివాదం లేదు. అయినా మూలంలోని ‘సోదరులు’ అనే నిర్దిష్ట బంధుత్వ పదాన్ని ప్రధాన పాఠ్యంలో ఉంచి, గోత్ర లేదా వంశ సంబంధాన్ని సూచించే విస్తృత భావాన్ని పాదటిప్పణిలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలో సిద్ధం చేసిన వస్తువు స్పష్టంగా చెప్పబడనందున ‘ఆహారం’ లేదా ‘సరఫరాలు’ అని పాఠ్యంలో చేర్చలేదు. సంప్రదింపు ఆంగ్ల పాఠ్యంలో పాదటిప్పణి గుర్తు ‘మూడు రోజులు’ తర్వాత ఉన్నప్పటికీ, పాదటిప్పణి אֲחֵיהֶם గురించి కావడంతో తెలుగులో గుర్తును ‘సోదరులు’ తర్వాత సరైన స్థానంలో ఉంచాం.
