  source_fidelity: 'మొత్తంగా హీబ్రూ భావం నమ్మకంగా ఉంది: మనష్షే నుండి కొందరు దావీదు పక్షంలో చేరడం, ఫిలిష్తీయులతో సౌలుకు వ్యతిరేకంగా యుద్ధానికి అతడు వెళ్లడం, ఫిలిష్తీయుల అధిపతులు అతనిని పంపివేయడం అన్నీ సరిగ్గా ప్రతిఫలించాయి. అయితే చివరి వాక్యంలో ఉన్న ‘తిరిగి’కి మూలపాఠంలో ప్రత్యక్ష సమానపదం లేదు; సందర్భం దావీదు సౌలు పక్షానికి మారిపోవచ్చనే భయమే అయినా, దానిని చేర్చకుండా ఉంచడం మరింత సమీపమైన అనువాదం. ‘మన తలల మూల్యంగా’ అనే రూపం తెలుగు ప్రయోగంలో అసహజంగా ఉండి, ప్రాణనష్టపు నుడికారాన్ని స్పష్టంగా తెలియజేయదు.'
