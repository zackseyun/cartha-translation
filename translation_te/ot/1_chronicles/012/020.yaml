  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. హీబ్రూ సైనిక-రాజకీయ నుడికారాలు అక్షరార్థ అపార్థాన్ని నివారించేలా భావసహజంగా అనువదించబడి, మూలంలోని చిత్రణ పాదసూచికల్లో నిలుపబడింది.
