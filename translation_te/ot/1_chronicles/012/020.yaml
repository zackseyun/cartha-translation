source:
  edition: WLC
  text: וּ/מִֽ/מְּנַשֶּׁ֞ה נָפְל֣וּ עַל דָּוִ֗יד בְּ/בֹא֨/וֹ עִם פְּלִשְׁתִּ֧ים עַל שָׁא֛וּל לַ/מִּלְחָמָ֖ה וְ/לֹ֣א עֲזָרֻ֑/ם כִּ֣י בְ/עֵצָ֗ה שִׁלְּחֻ֜/הוּ סַרְנֵ֤י פְלִשְׁתִּים֙ לֵ/אמֹ֔ר בְּ/רָאשֵׁ֕י/נוּ יִפּ֖וֹל אֶל אֲדֹנָ֥י/ו שָׁאֽוּל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/020.yaml
  text: Some from Manasseh also defected to David when he came with the Philistines against Saul for battle[a], though they did not help them, because the lords of the Philistines, after taking counsel, sent him away, saying[b], “He may defect to his master Saul at the cost of our heads.”
translation:
  language: te
  text: మనష్షే గోత్రానికి చెందిన కొందరు కూడా, దావీదు ఫిలిష్తీయులతో కలిసి సౌలుకు వ్యతిరేకంగా యుద్ధానికి వచ్చినప్పుడు, దావీదు పక్షానికి చేరారు[a]. అయితే వారు ఫిలిష్తీయులకు సహాయం చేయలేదు. ఎందుకంటే ఫిలిష్తీయుల అధిపతులు సంప్రదించుకొని దావీదును పంపివేసి, “అతడు మన తలలు పోయేలా[b] తన యజమాని సౌలు పక్షానికి వెళ్లిపోవచ్చు” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘దావీదు మీద పడిపోయారు’; ఈ హీబ్రూ నుడికారం ఒక వ్యక్తి పక్షానికి వెళ్లడం లేదా అతనితో చేరడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘మన తలలతో’; అంటే మన ప్రాణాలను మూల్యంగా చెల్లించాల్సి వచ్చేలా, లేదా మన వినాశానికి అనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמְּנַשֶּׁה
  choice: మనష్షే గోత్రానికి చెందిన కొందరు కూడా
  rationale: מן సూచించే పాక్షిక భావాన్ని ‘కొందరు’ అని స్పష్టంచేసి, וְ యొక్క అదనపు భావాన్ని ‘కూడా’తో వ్యక్తం చేసింది; ఆధునిక తెలుగు పాఠకులకు ‘మనష్షే’ ఒక గోత్రమని సహజంగా తెలియజేస్తుంది.
- source_word: נָפְלוּ עַל דָּוִיד
  choice: దావీదు పక్షానికి చేరారు
  rationale: ఇది అక్షరార్థంగా ‘పడిపోయారు’ అని కాక, సైనిక-రాజకీయ సందర్భంలో ఒకరి పక్షంలో చేరడాన్ని సూచించే హీబ్రూ నుడికారం. ‘పక్షానికి చేరారు’ దాని భావాన్ని సహజంగా ఇస్తుంది.
- source_word: בְּבֹאוֹ עִם פְּלִשְׁתִּים עַל שָׁאוּל לַמִּלְחָמָה
  choice: దావీదు ఫిలిష్తీయులతో కలిసి సౌలుకు ఎదురు యుద్ధానికి వచ్చినప్పుడు
  rationale: בְּ + క్రియానామ రూపం కాలసూచకంగా ‘వచ్చినప్పుడు’; עִם సహవాసాన్ని; עַל శత్రుత్వ దిశను; לַמִּלְחָמָה యుద్ధ ఉద్దేశాన్ని సూచిస్తున్నాయి.
- source_word: וְלֹא עֲזָרֻם
  choice: అయితే వారు ఫిలిష్తీయులకు సహాయం చేయలేదు
  rationale: వ్యతిరేక భావాన్ని ‘అయితే’తో తెలిపింది. పురుష బహువచన కర్మప్రత్యయం సందర్భానుసారం ఫిలిష్తీయులను సూచిస్తుందని పాఠ్యంలో స్పష్టంచేసింది.
- source_word: כִּי בְעֵצָה
  choice: ఎందుకంటే ... సంప్రదించుకొని
  rationale: כִּי కారణాన్ని పరిచయం చేస్తుంది; בְעֵצָה పాలకులు చర్చించి నిర్ణయించుకున్న భావాన్ని సహజ తెలుగులో ‘సంప్రదించుకొని’గా వ్యక్తం చేసింది.
- source_word: שִׁלְּחֻהוּ
  choice: దావీదును పంపివేస్తూ
  rationale: పియేల్ రూపం ఇక్కడ తమతో వెళ్లనివ్వకుండా వెనక్కి పంపడం లేదా తొలగించడం అనే భావం ఇస్తుంది.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: ఫిలిష్తీయుల అధిపతులు
  rationale: סַרְנֵי ఫిలిష్తీయుల ప్రత్యేక పాలక బిరుదు; ‘అధిపతులు’ బిరుదు స్వభావాన్ని కాపాడుతూ అనవసరంగా సైనిక హోదాను నిర్దిష్టం చేయదు.
- source_word: בְּרָאשֵׁינוּ
  choice: మన తలల మూల్యంగా
  rationale: అక్షర చిత్రమైన ‘మన తలలతో’ అనే నుడికారాన్ని నిలుపుతూ, వారి ప్రాణనష్టం లేదా వినాశం అనే ఉద్దేశిత భావాన్ని ‘మూల్యంగా’ స్పష్టపరుస్తుంది.
- source_word: יִפּוֹל אֶל אֲדֹנָיו שָׁאוּל
  choice: తన యజమాని సౌలు పక్షానికి తిరిగి వెళ్లిపోవచ్చు
  rationale: נפל אל ఇక్కడ పక్షం మారడాన్ని సూచిస్తుంది; అపూర్ణ క్రియారూపం పాలకుల భయాశంకను ‘వెళ్లిపోవచ్చు’గా వ్యక్తం చేస్తుంది. אֲדֹנָיו రాజకీయ సేవాసంబంధంలో ‘తన యజమాని’గా అనువదించబడింది.
