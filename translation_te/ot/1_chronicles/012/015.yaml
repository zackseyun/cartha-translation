source:
  edition: WLC
  text: אֵ֥לֶּה מִ/בְּנֵי גָ֖ד רָאשֵׁ֣י הַ/צָּבָ֑א אֶחָ֤ד לְ/מֵאָה֙ הַ/קָּטָ֔ן וְ/הַ/גָּד֖וֹל לְ/אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/015.yaml
  text: These were from the sons of Gad[a], heads of the army; the least was for a hundred, and the greatest for a thousand.
translation:
  language: te
  text: వీరు గాదు కుమారులలోనివారు, సైన్యాధిపతులు. వారిలో అల్పుడైనవాడు వందమందికి, గొప్పవాడు వెయ్యిమందికి సాటిగా ఉండేవాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ఒకడు వందమందికి—చిన్నవాడు; గొప్పవాడు వెయ్యిమందికి.” ఇది వారి సైనిక పరాక్రమాన్ని లేదా సమర్థతను తెలిపే సంక్షిప్త ప్రయోగం కావచ్చు.
    reason: మూల హీబ్రూ సంక్షిప్తంగా, కొంత సందిగ్ధంగా ఉన్నందున అక్షరార్థ రూపాన్నీ సాధ్యమైన భావాన్నీ తెలియజేయడం.
lexical_decisions:
- source_word: אֵלֶּה מִבְּנֵי גָד
  choice: వీరు గాదు కుమారులలోనివారు
  rationale: హీబ్రూలోని కుటుంబ-గోత్ర వ్యక్తీకరణను నిలుపుతూ, తెలుగులో సహజంగా వినిపించేలా క్రియను పూరించాం.
- source_word: רָאשֵׁי הַצָּבָא
  choice: సైన్యాధిపతులు
  rationale: అక్షరార్థంగా ‘సైన్యపు తలలు’; సందర్భంలో సైనిక నాయకులను సూచిస్తుంది. ‘సైన్యాధిపతులు’ ఆధునిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన రూపం.
- source_word: הַקָּטָן
  choice: వారిలో అల్పుడైనవాడు
  rationale: శరీర పరిమాణం కంటే స్థాయి లేదా సామర్థ్యంలో తక్కువవాడనే తులనాత్మక భావం సందర్భానికి సరిపోతుంది; ‘వారిలో’ అనేది తెలుగులో సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: אֶחָד לְמֵאָה ... וְהַגָּדוֹל לְאָלֶף
  choice: వందమందికి ... వెయ్యిమందికి సాటిగా ఉండేవాడు
  rationale: మూలంలోని సంక్షిప్త నిష్పత్తి ప్రయోగం సైనిక సామర్థ్యాన్ని సూచించవచ్చు. ‘సాటిగా’ ఆ సూచిత భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. మూలంలోని గోత్ర సంబంధ పదబంధాన్ని నిలిపి, సైనిక నిష్పత్తి ప్రయోగాన్ని సాధారణ పాఠకునికి అర్థమయ్యేలా స్వల్పంగా విప్పి చెప్పాం.
