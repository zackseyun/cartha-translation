  to: వీరు గాదు కుమారులలోనివారు, సైన్యాధిపతులు. వారిలో అల్పుడైనవాడు వందమందికి, గొప్పవాడు వెయ్యిమందికి సాటిగా ఉండేవాడు.[a]
  rationale: వచనంలోని అనువాదం మూల భావానికి, ఆధునిక తెలుగు వాడుకకు అనుకూలంగానే ఉంది. పాదసూచికను మాత్రమే మూలంలోని “ఒకడు” అనే పదాన్ని ప్రతిబింబించేలా సవరించి, అది వివరిస్తున్న సైనిక-సామర్థ్య ప్రయోగం వద్దే సూచికను ఉంచాం. “సాటిగా” అనేది మూలంలోని సంక్షిప్త నిర్మాణానికి సందర్భానుగుణమైన వివరణగా ఉంచబడింది; పాదసూచిక దాని వ్యాఖ్యాన స్వభావాన్ని స్పష్టం చేస్తుంది.
