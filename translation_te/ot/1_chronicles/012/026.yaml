  yaml_path: translation/ot/1_chronicles/012/026.yaml
  text: 'From the sons of Simeon, mighty men of valor for the army: 7,100.'
translation:
  language: te
  text: షిమ్యోను కుమారుల నుండి సైనిక సేవకు పరాక్రమవంతులైన యోధులు 7,100 మంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִן בְּנֵי שִׁמְעוֹן
  choice: షిమ్యోను కుమారులలో
  rationale: గోత్రం నుండి వచ్చిన దళాన్ని సూచించే מִן భావాన్ని ‘లో’ ద్వారా సహజంగా వ్యక్తం చేస్తూ, ‘కుమారులు’ అనే హెబ్రీయ బంధుత్వ రూపాన్ని నిలుపుతుంది.
- source_word: גִּבּוֹרֵי חַיִל
  choice: పరాక్రమవంతులైన యోధులు
  rationale: ఈ సైనిక సందర్భంలో బలం, సామర్థ్యం, శౌర్యం అనే భావాలను సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: לַצָּבָא
  choice: సైన్యానికి తగిన
  rationale: లామెద్‌తో కూడిన צבא ఇక్కడ వారి సైనిక సేవకు యోగ్యత లేదా నియామకాన్ని సూచిస్తుంది; తెలుగు వాక్యంలో ‘సైన్యానికి తగిన’ అనేది స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: שִׁבְעַת אֲלָפִים וּמֵאָה
  choice: 7,100 మంది
  rationale: ఖచ్చిత సంఖ్యను ఆధునిక అంకెలతో ఇస్తూ, వ్యక్తులను లెక్కిస్తున్నందున ‘మంది’ను చేర్చింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళి-సైనిక జాబితికి తగిన సంక్షిప్త, గౌరవప్రద శైలి. మూలంలోని విభాగ స్వభావాన్ని ఒకే సరళ వాక్యంగా ఉంచింది.
