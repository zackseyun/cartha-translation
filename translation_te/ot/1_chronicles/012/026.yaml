  text: מִן בְּנֵ֣י שִׁמְע֗וֹן גִּבּ֤וֹרֵי חַ֨יִל֙ לַ/צָּבָ֔א שִׁבְעַ֥ת אֲלָפִ֖ים וּ/מֵאָֽה־׃ס
