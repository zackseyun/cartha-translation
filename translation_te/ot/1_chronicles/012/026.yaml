- from: షిమ్యోను కుమారులలో సైన్యానికి తగిన పరాక్రమవంతులైన యోధులు 7,100 మంది.
  to: షిమ్యోను కుమారుల నుండి సైనిక సేవకు పరాక్రమవంతులైన యోధులు 7,100 మంది.
  rationale: The revision retains the draft’s clear modern Telugu military-list style and exact number, while rendering מן as «నుండి» and לַצָּבָא as «సైనిక సేవకు» without adding an implication of qualification.
