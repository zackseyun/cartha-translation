  yaml_path: translation/ot/1_chronicles/012/008.yaml
  text: and Joelah and Zebadiah[a], the sons of Jeroham from Gedor.
translation:
  language: te
  text: గెదోరు నుండి వచ్చిన యెరోహాము కుమారులు యోయేలా[a], జెబద్యా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ పేరును హీబ్రూ అక్షరరూపాన్ని మరింత ప్రత్యక్షంగా అనుసరించి ‘యోఏలా’ అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹעֵאלָה
  choice: యోయేలా
  rationale: וְ అనే సంధికారకాన్ని తెలుగు జాబితా వాక్యనిర్మాణంలో ప్రత్యేకంగా పునరావృతం చేయకుండా, వ్యక్తిపేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וּ/זְבַדְיָה
  choice: జెబద్యా
  rationale: వ్యక్తిపేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం; ముందున్న וּ భావం తెలుగు జాబితా నిర్మాణంలో అంతర్భూతమైంది.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఈ వంశావళి సందర్భంలో నిర్మాణ బహువచన రూపానికి నేరమైన అర్థం ‘కుమారులు’; విస్తృతమైన ‘వంశస్థులు’ అనే భావాన్ని అవసరం లేకుండా చేర్చలేదు.
- source_word: יְרֹחָם
  choice: యెరోహాము
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగులో సహజంగా పలికే విధంగా లిప్యంతరీకరించాం.
- source_word: מִן הַ/גְּדֽוֹר
  choice: గెదోరు నుండి వచ్చిన
  rationale: מִן మూలస్థానాన్ని సూచిస్తుంది; గెదోరును స్థలనామంగా తీసుకొని, తెలుగులో సంబంధం స్పష్టంగా ఉండేందుకు ‘నుండి వచ్చిన’ అని ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని పేర్ల క్రమాన్ని ఉంచుతూ, తెలుగులో సహజమైన వాక్యక్రమం కోసం స్థలవాచక పదబంధాన్ని ముందుకు తీసుకొచ్చాం.
