translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సైనిక-జాబితా శైలిని అనుసరించాం. ‘ముప్పైమంది’ని నిర్దిష్ట వీరబృందం పేరుగా భావించి వాడాం; సభ్యత్వం మరియు నాయకత్వం మధ్య కనిపించే మూలపాఠంలోని ఉద్రిక్తతను పాదసూచనలతో నిలిపాం.
