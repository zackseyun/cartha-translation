  yaml_path: translation/ot/1_chronicles/012/004.yaml
  text: and Ishmaiah the Gibeonite[b][a], a mighty man among the Thirty and over the Thirty.
translation:
  language: te
  text: మరియు గిబియోనీయుడైన ఇష్మయా—అతడు ముప్పైమందిలో[a] పరాక్రమశాలి, ఆ ముప్పైమందికి అధిపతి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ముప్పైమందికి చెందినవాడు”; హీబ్రూ ఉపసర్గ ‘ముప్పైమంది’ అనే ప్రత్యేక వీరబృందంలో సభ్యత్వాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ముప్పైమందికి అధిపతి” అనే మాట, ఆ బృందానికి సంబంధించి నాయకత్వాన్ని లేదా ఉన్నత హోదాను సూచించే అవకాశం ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/יִֽשְׁמַֽעְיָה
  choice: ఇష్మయా
  rationale: జాబితాలోని కొనసాగింపును తెలుగులో విరామచిహ్నంతో సహజంగా తెలియజేశాం; వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: הַ/גִּבְעוֹנִי
  choice: గిబియోనీయుడైన
  rationale: ఈ జాతి/ప్రాంత సంబంధ విశేషణం అతడు గిబియోనుకు చెందినవాడని సూచిస్తుంది; తెలుగు వాక్యనిర్మాణానికి సహజమైన విశేషణ రూపాన్ని వాడాం.
- source_word: גִּבּוֹר
  choice: పరాక్రమశాలి
  rationale: సైనిక సందర్భంలో బలవంతుడు, శూరుడు అనే భావాన్ని గౌరవప్రదమైన సాధారణ తెలుగు పదంతో వ్యక్తం చేస్తుంది.
- source_word: בַּ/שְּׁלֹשִׁים
  choice: ముప్పైమందిలో
  rationale: בְּ అనే ఉపసర్గ ఇక్కడ ‘ముప్పైమంది’ అనే ప్రసిద్ధ వీరబృందంలో సభ్యత్వాన్ని సూచించవచ్చు; మూలంలోని సంక్షిప్తతను కాపాడుతుంది.
- source_word: וְ/עַל הַ/שְּׁלֹשִׁים
  choice: ఆ ముప్పైమందికి అధిపతి
  rationale: עַל ఈ సందర్భంలో ఆ బృందంపై అధికారం లేదా నాయకత్వాన్ని సూచిస్తుంది; తెలుగులో కేవలం ‘పైగా’ అనడం కంటే ‘అధిపతి’ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
