id: 1CH.12.39
reference: 1 Chronicles 12:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כָּל אֵ֜לֶּה אַנְשֵׁ֣י מִלְחָמָה֮ עֹדְרֵ֣י מַעֲרָכָה֒ בְּ/לֵבָ֤ב שָׁלֵם֙ בָּ֣אוּ חֶבְר֔וֹנָ/ה לְ/הַמְלִ֥יךְ אֶת דָּוִ֖יד עַל כָּל יִשְׂרָאֵ֑ל וְ֠/גַם כָּל שֵׁרִ֧ית יִשְׂרָאֵ֛ל לֵ֥ב אֶחָ֖ד לְ/הַמְלִ֥יךְ אֶת דָּוִֽיד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/039.yaml
  text: All these were men of war[a], arrayed for battle, who came to Hebron with a whole heart to make David king over all Israel; and also all the rest of Israel were of one heart to make David king.
translation:
  language: te
  text: వీరందరూ యుద్ధవీరులు, యుద్ధ పంక్తిలో సన్నద్ధంగా నిలిచినవారు. వారు నిండు హృదయంతో దావీదును ఇశ్రాయేలంతటిమీద రాజుగా చేయడానికి హెబ్రోనుకు వచ్చారు. ఇశ్రాయేలులోని మిగతా వారందరూ[a] కూడా దావీదును రాజుగా చేయడానికి ఏకహృదయంతో ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలు శేషమంతా.” ఇక్కడ సందర్భానుసారంగా, ముందుగా పేర్కొన్నవారు కాకుండా ఇశ్రాయేలులోని మిగతా ప్రజలందరూ అనే భావమే ఎక్కువగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: యుద్ధవీరులు
  rationale: ‘యుద్ధపు మనుషులు’ అనే మూలభావాన్ని సహజమైన ఆధునిక తెలుగులో సైనిక అర్థంతో తెలియజేస్తుంది.
- source_word: עֹדְרֵי מַעֲרָכָה
  choice: యుద్ధ పంక్తిని ఏర్పరచేవారు
  rationale: యుద్ధానికి కేవలం సిద్ధంగా ఉండడం కంటే, పోరాట పంక్తిని అమర్చడం అనే క్రియాశీల సైనిక భావాన్ని నిలుపుతుంది.
- source_word: בְּלֵבָב שָׁלֵם
  choice: నిండు హృదయంతో
  rationale: ఉద్దేశంలోని సంపూర్ణతను, విభజనలేని నిబద్ధతను సూచిస్తూ హృదయ రూపకాన్ని కాపాడుతుంది.
- source_word: בָּאוּ חֶבְרוֹנָה
  choice: హెబ్రోనుకు వచ్చారు
  rationale: స్థలంవైపు గమనాన్ని సూచించే దిశార్థక రూపాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְהַמְלִיךְ אֶת דָּוִיד
  choice: దావీదును రాజుగా చేయడానికి
  rationale: దావీదు పాలించేలా స్థాపించడం అనే హిఫిల్ భావాన్ని నేరుగా తెలియజేస్తుంది; మూలంలో స్పష్టంగా లేని పట్టాభిషేక కర్మను చేర్చదు.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలంతటిమీద
  rationale: దేశమంతటిపై రాజాధికారాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: כָּל שֵׁרִית יִשְׂרָאֵל
  choice: ఇశ్రాయేలులోని మిగతా వారందరూ
  rationale: ఈ కథన సందర్భంలో ముందుగా పేర్కొనబడని మిగిలిన ప్రజలను సూచిస్తుంది; ప్రవచన గ్రంథాల్లో కనిపించే ప్రత్యేక ‘శేషం’ భావాన్ని అనవసరంగా రుద్దదు.
- source_word: לֵב אֶחָד
  choice: ఏకహృదయంతో
  rationale: ఐక్యమైన సంకల్పాన్ని తెలిపే ‘ఒకే హృదయం’ రూపకాన్ని సహజమైన, గంభీరమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: שְׁאֵרִית అనే పదానికి ఉండగల ‘శేష ప్రజలు’ అనే ధార్మిక భావం
  choice: ఇశ్రాయేలులోని మిగతా వారందరూ
  alternative: ఇశ్రాయేలు శేషమంతా
  rationale: తక్షణ సందర్భం దావీదుకు దేశవ్యాప్తంగా లభించిన మద్దతును సంగ్రహంగా చెబుతోంది. కాబట్టి ప్రత్యేకమైన ప్రవచనాత్మక ‘శేషం’ సిద్ధాంతాన్ని ముందుకు తేవకుండా, సందర్భానుసారమైన సాధారణ అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచాం; మరింత పదానుసార ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన కథన శైలిని ఉపయోగించాం. ‘నిండు హృదయంతో,’ ‘ఏకహృదయంతో’ అనే పదబంధాలు మూలంలోని హృదయ రూపకాలను, వాటి మధ్య ఉన్న సంపూర్ణ నిబద్ధత మరియు సామూహిక ఐక్యత అనే స్వల్ప భేదాన్ని కాపాడుతున్నాయి.
