source:
  edition: WLC
  text: וּ/מִן בְּנֵ֧י בִנְיָמִ֛ן אֲחֵ֥י שָׁא֖וּל שְׁלֹ֣שֶׁת אֲלָפִ֑ים וְ/עַד הֵ֨נָּה֙ מַרְבִּיתָ֔/ם שֹׁמְרִ֕ים מִשְׁמֶ֖רֶת בֵּ֥ית שָׁאֽוּל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/030.yaml
  text: And from the sons of Benjamin[a], Saul’s brothers, three thousand[b]; until then most of them had been keeping watch over the house of Saul.
translation:
  language: te
  text: బెన్యామీను కుమారులలో, సౌలు సహోదరులైనవారు[a] మూడు వేలమంది; అప్పటివరకు వారిలో అత్యధికులు సౌలు ఇంటికి[b] కాపలా కాస్తూ వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సౌలు బంధువులు’ లేదా ‘సౌలు వంశస్థులు’ అని కూడా అర్థం కావచ్చు. హీబ్రూ పదం అక్షరార్థ సహోదరులకే కాక విస్తృత బంధుత్వ వర్గానికీ వర్తించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘సౌలు ఇల్లు’ అనేది సౌలు కుటుంబాన్ని లేదా అతని రాజవంశ సంబంధిత ప్రయోజనాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן בְּנֵי בִנְיָמִן
  choice: బెన్యామీను కుమారులలో
  rationale: గోత్ర వంశావళి నుడికారాన్ని నిలుపుతూ, జాబితాలోని కొనసాగింపును తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אֲחֵי שָׁאוּל
  choice: సౌలు సహోదరులైనవారు
  rationale: హీబ్రూ ‘సహోదరులు’ అనే పదాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది విస్తృత బంధుత్వాన్ని కూడా సూచించగలదని పాదటిప్పణిలో తెలిపింది.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: మూడు వేలమంది
  rationale: వ్యక్తుల సంఖ్యను తెలుగులో స్పష్టంగా, సహజంగా సూచిస్తుంది.
- source_word: וְעַד הֵנָּה
  choice: అప్పటివరకు
  rationale: కథనంలోని ఆ చారిత్రక సమయానికి ముందున్న స్థితిని సూచిస్తుంది; పాఠకుని వర్తమానాన్ని సూచించదు.
- source_word: מַרְבִּיתָם
  choice: వారిలో అత్యధికులు
  rationale: వారిలో ఎక్కువ భాగం లేదా మెజారిటీ అనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: שֹׁמְרִים מִשְׁמֶרֶת
  choice: కాపలా బాధ్యత నిర్వహిస్తూ ఉన్నారు
  rationale: మూలంలోని ‘కాపాడడం/కాపలా’ అనే సమానధాతు నిర్మాణాన్ని తెలుగులో అసహజ పునరుక్తి లేకుండా, కొనసాగుతున్న విధి భావంతో వ్యక్తం చేస్తుంది.
- source_word: בֵּית שָׁאוּל
  choice: సౌలు ఇంటి
  rationale: ‘ఇల్లు’ అనే మూల రూపకంలోని ఉద్దేశపూర్వక విస్తృతిని నిలుపుతుంది; అది కుటుంబం, రాజవంశం లేదా దాని ప్రయోజనాలను సూచించవచ్చు.
theological_decisions:
- issue: ‘సౌలు ఇల్లు’ అనే పదబంధపు పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘సౌలు ఇంటి’ అని విస్తృతార్థాన్ని నిలిపింది.
  alternative: ‘సౌలు కుటుంబం’, ‘సౌలు రాజవంశం’ లేదా ‘సౌలు వంశ ప్రయోజనాలు’
  rationale: ఒకే నిర్దిష్ట అర్థాన్ని ఎంచుకుంటే మూలంలోని కుటుంబ/రాజవంశ/పక్ష ప్రయోజనాల మధ్య ఉన్న నిజమైన సందిగ్ధత తొలగిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. గోత్ర జాబితా స్వభావాన్ని నిలుపుతూ సంక్షిప్త నిర్మాణం వాడబడింది; మూలంలోని బంధుత్వ, రాజవంశ సంబంధిత సందిగ్ధతలను పాదటిప్పణుల్లో భద్రపరిచింది.
