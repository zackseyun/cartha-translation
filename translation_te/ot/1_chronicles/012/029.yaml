source:
  edition: WLC
  text: וְ/צָד֥וֹק נַ֖עַר גִּבּ֣וֹר חָ֑יִל וּ/בֵית אָבִ֥י/ו שָׂרִ֖ים עֶשְׂרִ֥ים וּ/שְׁנָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/029.yaml
  text: And Zadok[a], a young man mighty in valor[b], and from his father’s house twenty-two commanders.
translation:
  language: te
  text: పరాక్రమశాలి యువకుడైన సాదోకు[a], మరియు అతని పితృకుటుంబంలోని నాయకులు[b] ఇరవై ఇద్దరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరాక్రమవంతుడైన యోధుడు.”
    reason: నַעַר గִּבּוֹר חָיִל అనే పదబంధాన్ని వయస్సుకు ప్రాధాన్యమిస్తూ ‘పరాక్రమశాలి యువకుడు’ అని గానీ, సైనిక పాత్రకు ప్రాధాన్యమిస్తూ ‘పరాక్రమవంతుడైన యోధుడు’ అని గానీ అర్థం చేసుకోవచ్చు.
  - marker: b
    text: అక్షరార్థంగా, “అతని తండ్రి ఇల్లు”; అంటే అతని పూర్వికుల కుటుంబం లేదా కుటుంబశాఖ.
    reason: בֵית אָבִיו అనేది కేవలం నివాసగృహాన్ని కాకుండా పితృపారంపర్య కుటుంబ సమూహాన్ని సూచించే హీబ్రూ సామాజిక నుడికారం.
lexical_decisions:
- source_word: צָדוֹק
  choice: సాదోకు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: נַעַר
  choice: యువకుడు
  rationale: ఈ సైనిక సందర్భంలో సేవకుడు అనే అర్థం కంటే వయస్సును సూచించే ‘యువకుడు’ సహజంగా సరిపోతుంది.
- source_word: גִּבּוֹר חָיִל
  choice: పరాక్రమశాలి
  rationale: బలం, శౌర్యం, యుద్ధసామర్థ్యం కలిగిన వ్యక్తిని సూచించే హీబ్రూ పదబంధాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో అందిస్తుంది.
- source_word: בֵית אָבִיו
  choice: అతని పితృవంశం
  rationale: అక్షరార్థమైన ‘అతని తండ్రి ఇల్లు’ తెలుగులో తప్పుగా అర్థమయ్యే అవకాశం ఉన్నందున, పితృపారంపర్య కుటుంబం లేదా వంశశాఖ అనే సామాజిక భావాన్ని వ్యక్తం చేశాం.
- source_word: שָׂרִים
  choice: అధిపతులు
  rationale: ఈ సందర్భంలోని నాయకత్వ హోదాను తెలియజేస్తుంది; ‘రాజకుమారులు’ అనే అనవసర రాజవంశార్థాన్ని కలిగించదు.
- source_word: עֶשְׂרִים וּשְׁנָיִם
  choice: ఇరవై ఇద్దరు
  rationale: వ్యక్తులను లెక్కించే సహజమైన తెలుగు సంఖ్యారూపం.
- source_word: וְ
  choice: —
  rationale: హీబ్రూ జాబితా నిర్మాణాన్ని తెలుగులో విడి వాక్యాల అనుసంధానం ద్వారా సహజంగా ప్రతిబింబించాం; ప్రత్యేకంగా ‘మరియు’ చేర్చడం అవసరం లేదు.
