source:
  edition: WLC
  text: וַ/יֵּצֵ֣א דָוִיד֮ לִ/פְנֵי/הֶם֒ וַ/יַּ֨עַן֙ וַ/יֹּ֣אמֶר לָ/הֶ֔ם אִם לְ/שָׁל֞וֹם בָּאתֶ֤ם אֵלַ/י֙ לְ/עָזְרֵ֔/נִי יִֽהְיֶה לִּ֧/י עֲלֵי/כֶ֛ם לֵבָ֖ב לְ/יָ֑חַד וְ/אִֽם לְ/רַמּוֹתַ֣/נִי לְ/צָרַ֗/י בְּ/לֹ֤א חָמָס֙ בְּ/כַפַּ֔/י יֵ֛רֶא אֱלֹהֵ֥י אֲבוֹתֵ֖י/נוּ וְ/יוֹכַֽח־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/018.yaml
  text: David went out before them and answered and said to them[a], “If you have come to me in peace to help me, my heart will be united with you; but if you have come to betray me to my enemies, though there is no violence in my hands[b], may the God of our fathers see and judge.”
translation:
  language: te
  text: 'దావీదు వారి ఎదుటికి వెళ్లి, వారికి జవాబిచ్చి ఇలా అన్నాడు: “మీరు నాకు సహాయం చేయడానికి శాంతితో నా దగ్గరికి వచ్చి ఉంటే, నా హృదయం మీతో ఏకమై ఉంటుంది. కాని నా చేతుల్లో హింస ఏదీ లేకపోయినా, నన్ను నా శత్రువులకు ద్రోహపూర్వకంగా అప్పగించడానికి[a] వచ్చి ఉంటే, మన పితరుల దేవుడు చూసి తీర్పు తీర్చుగాక[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నన్ను మోసం చేయడానికి.” హీబ్రూ క్రియ మోసపూరితమైన ద్రోహాన్ని సూచించగలదు; ఇక్కడ శత్రువుల చేతికి అప్పగించే సందర్భం ఉన్నందున ప్రధాన పాఠంలో “ద్రోహపూర్వకంగా అప్పగించడానికి” అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “చూసి గద్దించుగాక” లేదా “చూసి నిర్ణయించుగాక.” చివరి హీబ్రూ క్రియ గద్దించడం, వివాదాన్ని పరిష్కరించడం, లేదా న్యాయనిర్ణయం చేయడం అనే భావాలను ఇవ్వగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא ... לִפְנֵיהֶם
  choice: వారి ఎదుటికి వెళ్లి
  rationale: ‘వారి ఎదుటికి’ అనే రూపం స్థలసంబంధమైన మూలార్థాన్ని నిలుపుతూ, దావీదు వారి సమక్షంలోకి వెళ్లాడనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: వారికి జవాబిస్తూ ఇలా అన్నాడు
  rationale: హీబ్రూ జంట క్రియలైన ‘జవాబిచ్చి, అన్నాడు’ అనే భావాన్ని అసహజమైన పునరుక్తి లేకుండా రెండింటినీ ప్రతిబింబించేలా అందిస్తుంది.
- source_word: לְשָׁלוֹם
  choice: శాంతితో
  rationale: వారి రాక శాంతిపూర్వకమైనదా, నిజాయితీతో కూడినదా అనే సందర్భార్థాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: לְעָזְרֵנִי
  choice: నాకు సహాయం చేయడానికి
  rationale: ఉద్దేశాన్ని తెలిపే మూలంలోని క్రియారూపానికి నేరుగా, సహజంగా సరిపోతుంది.
- source_word: יִהְיֶה לִּי עֲלֵיכֶם לֵבָב לְיָחַד
  choice: నా హృదయం మీతో ఏకమై ఉంటుంది
  rationale: కొంత జాతీయమైన హీబ్రూ ప్రయోగంలోని ఏకహృదయత, నిబద్ధమైన ఐక్యత అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְרַמּוֹתַנִי לְצָרַי
  choice: నన్ను నా శత్రువులకు అప్పగించడానికి
  rationale: רמה మోసపూరిత ద్రోహాన్ని సూచించగలదు. సైనిక-రాజకీయ సందర్భంలో శత్రువుల చేతికి అప్పగించే ద్రోహం ఉద్దేశించబడినందున ఈ అనువాదం సందర్భబద్ధంగా ఉంది; ‘మోసం చేయడానికి’ అనే ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: בְּלֹא חָמָס בְּכַפַּי
  choice: నా చేతుల్లో హింస ఏదీ లేకపోయినా
  rationale: దావీదు తన నిర్దోషిత్వాన్ని ప్రకటిస్తున్న మూలంలోని ‘హింస’ మరియు ‘చేతుల్లో’ అనే రూపకాన్ని నిలుపుతూ, సందర్భంలోని విరుద్ధార్థక భావాన్ని ‘లేకపోయినా’ స్పష్టం చేస్తుంది.
- source_word: יֵרֶא אֱלֹהֵי אֲבוֹתֵינוּ
  choice: మన పితరుల దేవుడు చూసి
  rationale: ఇది భవిష్యద్వాణికంటే దైవ న్యాయానికి చేసే గంభీరమైన విజ్ఞప్తి. ‘పితరులు’ మూలంలోని ఒడంబడిక సంబంధిత సాంప్రదాయ పదబంధాన్ని నిలుపుతుంది.
- source_word: וְיוֹכַח
  choice: తీర్పు తీర్చుగాక
  rationale: יכח హిఫీల్ రూపం గద్దించడం, వివాదాన్ని నిర్ణయించడం, న్యాయనిర్ణయం చేయడం వంటి భావాలను కలిగి ఉంది. ఈ న్యాయసంబంధ సందర్భంలో ‘తీర్పు తీర్చుగాక’ స్పష్టమైనదే గాని, ఇతర సాధ్యార్థాలను పాదసూచికలో సంరక్షిస్తుంది.
theological_decisions:
- issue: చివరి విజ్ఞప్తిలో దేవుని చర్య
  choice: మన పితరుల దేవుడు చూసి తీర్పు తీర్చుగాక
  alternative: మన పితరుల దేవుడు చూసి గద్దించుగాక / నిర్ణయించుగాక; లేదా చూస్తాడు, తీర్పు తీరుస్తాడు
  rationale: హీబ్రూ అసంపూర్ణ క్రియారూపాలు ఈ షరతుతో కూడిన ఆరోపణ తరువాత దైవ న్యాయనిర్ణయాన్ని కోరే ఆశీర్వాదార్థక/విధ్యర్థక విజ్ఞప్తిగా సహజంగా పనిచేస్తాయి. ‘తీర్చుగాక’ ఆ విజ్ఞప్తిని నిలుపుతుంది; ‘తీర్పు’ న్యాయసంబంధ సందర్భానికి తగినదైనా, క్రియలోని గద్దింపు లేదా మధ్యవర్తిత్వ నిర్ణయం అనే విస్తృతిని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి ఉపయోగించబడింది. హీబ్రూ వాక్యంలోని గంభీరతను నిలుపుతూ, అతిగా పురాతనమైన పదప్రయోగాలను నివారించాం. ‘హృదయం మీతో ఏకమై ఉంటుంది’ అనే రూపం మూలంలోని ఏకహృదయ నిబద్ధతను సహజంగా అందిస్తుంది.
