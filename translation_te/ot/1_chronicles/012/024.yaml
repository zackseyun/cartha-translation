source:
  edition: WLC
  text: וְ֠/אֵלֶּה מִסְפְּרֵ֞י רָאשֵׁ֤י הֶֽ/חָלוּץ֙ לַ/צָּבָ֔א בָּ֥אוּ עַל דָּוִ֖יד חֶבְר֑וֹנָ/ה לְ/הָסֵ֞ב מַלְכ֥וּת שָׁא֛וּל אֵלָ֖י/ו כְּ/פִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/024.yaml
  text: And these are the numbers of the heads of the armed troops for war[a], who came to David at Hebron to turn Saul’s kingdom over to him, according to the word of Yahweh.
translation:
  language: te
  text: 'యుద్ధానికి సన్నద్ధమైన దళాల నాయకుల సంఖ్యలు ఇవి: సౌలు రాజ్యాన్ని యాహ్వే మాట ప్రకారం దావీదుకు అప్పగించడానికి వారు హెబ్రోనుకు దావీదు వద్దకు వచ్చారు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూలో అక్షరార్థం: “యాహ్వే నోటి ప్రకారం”; అంటే “యాహ్వే మాట ప్రకారం” లేదా “యాహ్వే పలికినట్లుగా.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפְּרֵי רָאשֵׁי
  choice: నాయకుల సంఖ్యలు
  rationale: బహువచన నిర్మాణమైన ‘సంఖ్యలు’ను, רָאשֵׁי యొక్క ‘తలలు/నాయకులు’ అనే భావాన్ని నిలుపుతూ తెలుగులో సహజంగా అనువదించబడింది.
- source_word: הֶחָלוּץ לַצָּבָא
  choice: యుద్ధానికి సన్నద్ధమైన దళాలు
  rationale: הֶחָלוּץ ఆయుధాలు ధరించి యుద్ధసేవకు సిద్ధంగా ఉన్న సమూహాన్ని సూచిస్తుంది; לַצָּבָא దాని సైనిక ఉద్దేశాన్ని స్పష్టం చేస్తుంది.
- source_word: בָּאוּ עַל דָּוִיד חֶבְרוֹנָה
  choice: హెబ్రోనులో అతని దగ్గరికి వచ్చారు
  rationale: బוא על ఇక్కడ విరోధంగా రావడం కాక దావీదును చేరడం/అతని పక్షానికి రావడం సూచిస్తుంది. חֶבְרוֹנָה లోని దిశార్థక రూపాన్ని తెలుగు వాక్యంలో సహజమైన స్థలార్థంతో వ్యక్తం చేసింది.
- source_word: לְהָסֵב מַלְכוּת שָׁאוּל אֵלָיו
  choice: సౌలు రాజ్యాన్ని దావీదుకు అప్పగించడానికి
  rationale: హిఫిల్ రూపం రాజ్యం లేదా రాజాధికారం ఒకరి నుంచి మరొకరికి మళ్లించబడడాన్ని సూచిస్తుంది. ‘అప్పగించడానికి’ ఈ బదిలీ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: כְּפִי יְהוָה
  choice: యాహ్వే మాట ప్రకారం
  rationale: అక్షరార్థంగా ‘యాహ్వే నోటి ప్రకారం’; ఇది దేవుడు పలికిన మాట లేదా ఆజ్ఞను సూచించే హీబ్రూ నుడికారం. దైవనామాన్ని ‘యాహ్వే’గా లిప్యంతరీకరించింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలోని వ్యక్తిగత దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ ఉచ్చారణకు సమీపమైన తెలుగు లిప్యంతరీకరణను ఉపయోగించింది.
- issue: מַלְכוּת యొక్క భావం
  choice: రాజ్యం
  alternative: రాజాధికారం
  rationale: ఈ పదం పాలనాధికారాన్నీ రాజ్యాన్నీ సూచించగలదు. సందర్భంలోని బదిలీ భావానికి ‘రాజ్యం’ సహజంగా సరిపోతుంది; పదంలోని విస్తృత భావాన్ని సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని జాబితా-పరిచయ స్వరాన్ని నిలుపుతూ వాక్యాన్ని తెలుగు సహజ క్రమంలో అమర్చింది.
