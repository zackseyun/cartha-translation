  rationale: జాబితా సందర్భంలో అంకెలు సంఖ్యను స్పష్టంగా చూపుతాయి; తెలుగులో లెక్కించబడిన వ్యక్తులను సూచించడానికి ‘మంది’ సహజంగా ఉంటుంది.
