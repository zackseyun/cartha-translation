translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. మూలంలోని సైనిక లేదా వంశపరమైన ద్వంద్వార్థాన్ని పాదటిప్పణిలో నిలిపాం; అనవసర మతపరమైన వ్యాఖ్యానాన్ని చేర్చలేదు.
