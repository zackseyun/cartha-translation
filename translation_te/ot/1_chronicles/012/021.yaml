source:
  edition: WLC
  text: בְּ/לֶכְתּ֣/וֹ אֶל צִֽיקְלַ֗ג נָפְל֣וּ עָלָ֣י/ו מִֽ/מְּנַשֶּׁ֡ה עַ֠דְנַח וְ/יוֹזָבָ֤ד וִ/ידִֽיעֲאֵל֙ וּ/מִיכָאֵ֣ל וְ/יוֹזָבָ֔ד וֶ/אֱלִיה֖וּא וְ/צִלְּתָ֑י רָאשֵׁ֥י הָ/אֲלָפִ֖ים אֲשֶׁ֥ר לִ/מְנַשֶּֽׁה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/021.yaml
  text: 'As he went to Ziklag[a], some from Manasseh defected to him: Adnah, Jozabad, Jediael, Michael, another Jozabad, Elihu, and Zillethai[c][b], chiefs of the thousands that belonged to Manasseh.'
translation:
  language: te
  text: 'అతడు సిక్లగుకు వెళ్తున్నప్పుడు, మనష్షే గోత్రానికి చెందిన కొందరు అతని పక్షంలో చేరారు[a]: అద్నహు, యోజాబాదు, యెదీయేలు, మీకాయేలు, మరో యోజాబాదు[b], ఎలీహు, సిల్లెతై. వీరు మనష్షేకు చెందిన వేల విభాగాల అధిపతులు[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, ‘అతని మీద పడ్డారు.’ ఇది దావీదు పక్షానికి మారడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ జాబితాలో ‘యోజాబాదు’ అనే పేరు రెండుసార్లు ఉంది; ఇది ఒకే పేరు గల ఇద్దరు వేర్వేరు వ్యక్తులను సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: ‘వేల విభాగాల అధిపతులు’ అనేది సైనిక దళాల అధికారులను గానీ, మనష్షే గోత్రంలోని వంశ విభాగాల నాయకులను గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֶכְתּוֹ אֶל צִיקְלַג
  choice: అతడు సిక్లగుకు వెళ్తున్నప్పుడు
  rationale: בְּ + క్రియార్థక నామరూపం కాలసంబంధ భావాన్ని ఇస్తుంది. ఈ తెలుగు రూపం ప్రయాణం జరుగుతున్న సందర్భాన్ని సహజంగా తెలియజేస్తుంది; אֶל గమ్యాన్ని సూచిస్తుంది.
- source_word: נָפְלוּ עָלָיו
  choice: అతని పక్షంలో చేరారు
  rationale: అక్షరార్థంగా ‘అతని మీద పడ్డారు’ అయినా, సైనిక-రాజకీయ సందర్భంలో ఈ నుడికారం ఒకరి పక్షానికి మారడాన్ని సూచిస్తుంది. ‘అతని పక్షంలో చేరారు’ ఆధునిక తెలుగులో సహజంగా ఉండి, సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: מִמְּנַשֶּׁה
  choice: మనష్షే గోత్రానికి చెందిన కొందరు
  rationale: మూలంలో గోత్రనామం మాత్రమే ఉన్నా, ఇక్కడ అది గోత్ర మూలాన్ని సూచిస్తుంది. తెలుగులో స్పష్టత కోసం ‘గోత్రానికి చెందిన’ అని చేర్చబడింది.
- source_word: עַדְנַח וְיוֹזָבָד וִידִיעֲאֵל וּמִיכָאֵל וְיוֹזָבָד וֶאֱלִיהוּא וְצִלְּתָי
  choice: అద్నహు, యోజాబాదు, యెదీయయేలు, మీకాయేలు, మరో యోజాబాదు, ఎలీహూ, జిల్లెతై
  rationale: వ్యక్తినామాలను హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం. యోజాబాదు పేరు మూలంలో రెండుసార్లు ఉన్నందున, ఇద్దరు వేర్వేరు వ్యక్తులని పాఠకుడు గ్రహించేందుకు రెండవదానికి ‘మరో’ చేర్చాం.
- source_word: רָאשֵׁי הָאֲלָפִים
  choice: వేల విభాగాల అధిపతులు
  rationale: רָאשֵׁי అంటే అధిపతులు లేదా నాయకులు. אֲלָפִים అనేది వెయ్యిమంది సైనిక విభాగాలను గానీ, వంశ/కుల విభాగాలను గానీ సూచించవచ్చు. ‘వేల విభాగాలు’ మూలంలోని అనిశ్చితిని కొంతవరకు నిలుపుతుంది.
- source_word: אֲשֶׁר לִמְנַשֶּׁה
  choice: మనష్షేకు చెందిన
  rationale: ఈ సంబంధవాక్యం ఆ విభాగాలు లేదా వాటి అధిపతులు మనష్షేతో అనుబంధమున్నవారని తెలుపుతుంది; అంతకంటే నిర్దిష్టమైన సంస్థాగత అర్థాన్ని రుద్దలేదు.
