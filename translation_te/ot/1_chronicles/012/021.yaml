  rationale: The revision corrects the transliteration of Yediael and Zillethai, while preserving all source-level content, the repeated Jozabad, and the ambiguity of “chiefs of the thousands.” It also makes the list syntax smoother in modern standard Telugu. Footnote markers and their anchors remain complete and correctly placed.
