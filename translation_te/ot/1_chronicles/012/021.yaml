revisions:
- from: అతడు సిక్లగుకు వెళ్తున్నప్పుడు, మనష్షే గోత్రానికి చెందిన కొందరు అతని పక్షంలో చేరారు[a]. వారు అద్నహు, యోజాబాదు, యెదీయయేలు, మీకాయేలు, మరో యోజాబాదు[b], ఎలీహూ, జిల్లెతై. వీరు మనష్షేకు చెందిన వేల విభాగాల అధిపతులు[c].
