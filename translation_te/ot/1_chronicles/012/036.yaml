  text: From Dan[a], twenty-eight thousand six hundred prepared for battle.
translation:
  language: te
  text: దాను గోత్రం నుండి యుద్ధానికి సన్నద్ధమైనవారు[a] 28,600 మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యుద్ధ వ్యూహంలో మోహరించినవారు,” లేక “యుద్ధ వరుసలో నిలిచినవారు.” హీబ్రూ పదబంధం యుద్ధానికి సిద్ధంగా ఉండడాన్నీ, దళాలుగా క్రమపద్ధతిలో నిలబడడాన్నీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: నుండి
  rationale: ముందున్న జాబితాతో అనుసంధానించే וּ సంధర్భానుసారంగా తెలుగులో ప్రత్యేకంగా అనువదించకపోయినా భావం నిలుస్తుంది; מִן‌కు సహజమైన తెలుగు రూపం ‘నుండి’.
- source_word: הַדָּנִי
  choice: దాను గోత్రం
  rationale: వ్యాకరణపరంగా ఇది ‘దానీయుడు/దానీయులు’ అనే జాతివాచక రూపం; సైనిక గోత్రాల జాబితాలో సమూహాన్ని సూచిస్తున్నందున ‘దాను గోత్రం’ సాధారణ పాఠకులకు స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: עֹרְכֵי מִלְחָמָה
  choice: యుద్ధానికి సన్నద్ధమైనవారు
  rationale: ערך అనే ధాతువు యుద్ధ సందర్భంలో దళాలను క్రమంగా మోహరించడం లేదా యుద్ధ వరుసలో నిలపడం అనే భావాన్ని ఇస్తుంది. ప్రధాన పాఠ్యంలో సైనిక సంసిద్ధతను సహజంగా తెలియజేస్తూ, వ్యూహరచన/మోహరింపు భావాన్ని పాదటిప్పణిలో నిలిపాము.
- source_word: עֶשְׂרִים וּשְׁמוֹנָה אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: 28,600 మంది
  rationale: హీబ్రూ సంఖ్యను తెలుగు ప్రచురణలో సులభంగా చదవగల అంకెల రూపంలో ఇచ్చి, లెక్కించబడిన వ్యక్తులను సూచించేందుకు ‘మంది’ చేర్చాము.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే సైనిక-జాబితా శైలిని వాడాము. మూలంలోని సంక్షిప్త గణన నిర్మాణాన్ని నిలుపుతూ, తెలుగులో స్పష్టత కోసం ‘గోత్రం’ మరియు ‘మంది’ చేర్చాము.
