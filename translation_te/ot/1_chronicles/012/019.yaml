source:
  edition: WLC
  text: וְ/ר֣וּחַ לָבְשָׁ֗ה אֶת עֲמָשַׂי֮ רֹ֣אשׁ ה/שלושים לְ/ךָ֤ דָוִיד֙ וְ/עִמְּ/ךָ֣ בֶן יִשַׁ֔י שָׁל֨וֹם שָׁל֜וֹם לְ/ךָ֗ וְ/שָׁלוֹם֙ לְ/עֹ֣זְרֶ֔/ךָ כִּ֥י עֲזָרְ/ךָ֖ אֱלֹהֶ֑י/ךָ וַ/יְקַבְּלֵ֣/ם דָּוִ֔יד וַֽ/יִּתְּנֵ֖/ם בְּ/רָאשֵׁ֥י הַ/גְּדֽוּד־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/019.yaml
  text: And the Spirit clothed Amasai, chief of the Thirty, and he said, “Yours are we, David, and with you, son of Jesse! Peace, peace to you, and peace to your helpers, for your God helps you.” Then David received them and made them chiefs of the troops.
translation:
  language: te
  text: 'ఆత్మ ముప్పైమందికి అధిపతియైన అమాశైని వస్త్రంలా ధరించింది.[a] అప్పుడు అతడు ఇలా అన్నాడు:


    “దావీదూ, మేము నీవారమే!

    యెష్షయి కుమారుడా, మేము నీతో ఉన్నాము!

    నీకు శాంతి, శాంతి కలుగుగాక!

    నీకు సహాయం చేసేవారికి కూడా శాంతి కలుగుగాక![b]

    ఎందుకంటే నీ దేవుడు నీకు సహాయం చేస్తున్నాడు.”[c]


    అప్పుడు దావీదు వారిని స్వీకరించి, ఆ దళానికి నాయకులుగా నియమించాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఒక ఆత్మ అమాశైని వస్త్రంలా ధరించింది”; లేదా “ఆత్మ అమాశై మీదికి వచ్చింది.” హీబ్రూలో అక్షరార్థంగా, “ఆత్మ అమాశైని ధరించింది” అని ఉంది.
    reason: alternative_reading
  - marker: b
    text: లేదా “నీకు సహాయం చేసేవానికి కూడా శాంతి కలుగుగాక!” హీబ్రూలో ఈ పదం ఏకవచనంలో ఉంది; అయితే అది సమూహార్థకంగా కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా “ఎందుకంటే నీ దేవుడు నీకు సహాయం చేశాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ לָבְשָׁה
  choice: ఆత్మ ... ఆవరించింది
  rationale: רוּחַకు నిర్దిష్ట ఉపపదం లేకపోవడం వల్ల ‘ఆత్మ’ లేదా ‘ఒక ఆత్మ’ అనే భావాలు సాధ్యమే. לָבַשׁ యొక్క అక్షరార్థం ‘ధరించు/వస్త్రంలా కప్పు’; తెలుగులో వ్యక్తిని కర్తగా చేసుకొని సహజంగా చెప్పడానికి ‘ఆవరించింది’ అని అనువదించాం. మూలంలోని రూపకాన్ని, దైవిక ప్రేరణకు ఉన్న సంభావ్యతను పాదటిప్పణిలో నిలిపాం.
- source_word: אֶת עֲמָשַׂי
  choice: అమాశైని
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించి, ప్రత్యక్ష కర్మ విభక్తి చేర్చాం.
- source_word: רֹאשׁ הַשְּׁלֹשִׁים
  choice: ముప్పైమందికి అధిపతి
  rationale: רֹאשׁ అంటే అధిపతి/నాయకుడు. הַשְּׁלֹשִׁים ప్రసిద్ధ సైనిక సమూహాన్ని సూచించే అవకాశం ఉన్నప్పటికీ, తెలుగులో సహజంగా ‘ముప్పైమంది’ అని ఇచ్చాం.
- source_word: לְךָ דָוִיד
  choice: దావీదూ, మేము నీవారమే
  rationale: క్రియలేని సంక్షిప్త విధేయతా ప్రకటనను తెలుగులో సహజంగా వ్యక్తం చేస్తూ, לְךָకు ఉన్న వాక్యారంభ ప్రాధాన్యాన్ని సంబోధన తర్వాతి ‘నీవారమే’లో నిలిపాం.
- source_word: וְעִמְּךָ בֶן יִשַׁי
  choice: యెష్షయి కుమారుడా, మేము నీ పక్షమే
  rationale: అక్షరార్థంగా ‘నీతో’ అయినా, సందర్భంలో ఇది దావీదుకు మద్దతు మరియు విధేయతను ప్రకటిస్తుంది. ‘నీ పక్షమే’ ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: שָׁלוֹם שָׁלוֹם לְךָ
  choice: నీకు శాంతి, శాంతి కలుగుగాక
  rationale: שָׁלוֹם పునరుక్తిలోని బలాన్ని తొలగించకుండా నిలిపి, ఆశీర్వాద భావాన్ని తెలుగులో ‘కలుగుగాక’తో వ్యక్తం చేశాం.
- source_word: וְשָׁלוֹם לְעֹזְרֶךָ
  choice: నీకు సహాయం చేసేవారికి శాంతి కలుగుగాక
  rationale: హీబ్రూలో ఏకవచన కృదంతం ఉన్నా అది సమూహార్థకంగా ఉండవచ్చు. తరువాత దావీదు పలువురిని స్వీకరించడం వల్ల బహువచన భావాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, ఏకవచన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: כִּי עֲזָרְךָ אֱלֹהֶיךָ
  choice: ఎందుకంటే నీ దేవుడు నీకు సహాయం చేస్తున్నాడు
  rationale: పూర్తిక్రియా రూపం గతంలో జరిగిన సహాయాన్ని లేదా ప్రస్తుతం కొనసాగుతున్న స్థిరమైన సహాయాన్ని సూచించవచ్చు. సందర్భంలో కొనసాగుతున్న దైవ సహకారం సహజంగా ఉండటంతో వర్తమాన కొనసాగింపు రూపాన్ని ఎంచుకున్నాం; గతకాల ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: וַיְקַבְּלֵם
  choice: వారిని చేర్చుకొని
  rationale: קבל అంటే స్వీకరించు/అంగీకరించు. ఇక్కడ తన సమూహంలోకి స్వీకరించిన భావాన్ని సహజ తెలుగులో ‘చేర్చుకొని’ తెలియజేస్తుంది.
- source_word: וַיִּתְּנֵם בְּרָאשֵׁי הַגְּדוּד
  choice: దండులకు అధిపతులుగా నియమించాడు
  rationale: ‘అధిపతులలో/అధిపతులుగా ఉంచాడు’ అనే హీబ్రూ ప్రయోగం నియామకాన్ని సూచిస్తుంది. גְּדוּד సైనిక దండు లేదా దాడి బృందాన్ని సూచించగలదు; ఇక్కడ ‘దండులు’ సందర్భోచితం.
theological_decisions:
- issue: רוּחַ అనేది దేవుని ఆత్మనా, ఒక ఆత్మనా, లేక ప్రేరణనా
  choice: ఆత్మ
  alternative: ఒక ఆత్మ; ఆత్మ అమాశై మీదికి వచ్చింది
  rationale: నాయకుడు దైవిక ప్రేరణతో పలికే దినవృత్తాంతాల సందర్భం దేవుని ఆత్మను సూచించే అవకాశాన్ని బలపరుస్తుంది. అయితే హీబ్రూలో నిర్దిష్ట ఉపపదం లేదు; తెలుగు లిపిలో పెద్ద/చిన్న అక్షర భేదం ద్వారా నిర్ణయాన్ని బలవంతంగా సూచించలేం. అందువల్ల ప్రధాన పాఠ్యంలో ‘ఆత్మ’ అని ఉంచి ప్రత్యామ్నాయాలను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, పఠనయోగ్యమైన శైలి వాడాం. కవితాత్మక ప్రకటనను పంక్తులుగా అమర్చి, ‘శాంతి, శాంతి’ అనే మూల పునరుక్తిని నిలిపాం. అర్థసందిగ్ధతలను ప్రధాన పాఠ్యంలో అనవసరంగా పరిష్కరించకుండా పాదటిప్పణుల్లో స్పష్టంగా నమోదు చేశాం.
