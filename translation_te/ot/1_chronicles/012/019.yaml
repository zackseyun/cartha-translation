revisions:
- from: 'అప్పుడు ఆత్మ అమాశైని ఆవరించింది.[a] అతడు ముప్పైమందికి అధిపతి. అతడు ఇలా అన్నాడు:

    “దావీదూ, మేము నీవారమే!

    యెష్షయి కుమారుడా, మేము నీ పక్షమే!

    నీకు శాంతి, శాంతి కలుగుగాక!

    నీకు సహాయం చేసేవారికి శాంతి కలుగుగాక![b]

    ఎందుకంటే నీ దేవుడు నీకు సహాయం చేస్తున్నాడు.”[c]

    అప్పుడు దావీదు వారిని చేర్చుకొని, దండులకు అధిపతులుగా నియమించాడు.'
  to: 'ఆత్మ ముప్పైమందికి అధిపతియైన అమాశైని వస్త్రంలా ధరించింది.[a] అప్పుడు అతడు ఇలా అన్నాడు:


    “దావీదూ, మేము నీవారమే!

    యెష్షయి కుమారుడా, మేము నీతో ఉన్నాము!

    నీకు శాంతి, శాంతి కలుగుగాక!

    నీకు సహాయం చేసేవారికి కూడా శాంతి కలుగుగాక![b]

    ఎందుకంటే నీ దేవుడు నీకు సహాయం చేస్తున్నాడు.”[c]


    అప్పుడు దావీదు వారిని స్వీకరించి, ఆ దళానికి నాయకులుగా నియమించాడు.'
  rationale: The revision restores the Hebrew's distinctive clothing metaphor, renders the allegiance formula without adding political nuance, and maintains the singular military unit in the final clause. It also makes Amasai's title an integrated apposition, improves the flow of the speech, and retains all source-based alternatives at their proper anchors.
