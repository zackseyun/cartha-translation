translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా చదవగల జాబితా శైలిని ఉపయోగించాం. హీబ్రూలోని క్రియలేని సంక్షిప్త నామావళి నిర్మాణాన్ని తెలుగులో స్పష్టం చేయడానికి దీర్ఘవిరామాలు, ‘వీరు’ అనే సూచక పదం వాడాం. ప్రాంతవాచక విశేషణాలను అసహజమైన తెలుగు జాతినామాలుగా కాక ‘గిబియా వాడైన,’ ‘అనాతోతు వాడైన’ అని అందించాం. ఆంగ్ల సంప్రదింపుపాఠంలో పాదసూచిక గుర్తులు అవి వివరిస్తున్న పేర్లకు దూరంగా ఉన్నందున, మూలపాఠం మరియు పాదసూచిక విషయానికి అనుగుణంగా [a]ను యెజీయేలు వద్ద, [b]ను బెరాకా వద్ద ఉంచాం.
