  variant: modern standard Telugu
source:
  edition: WLC
  text: הָ/רֹ֨אשׁ אֲחִיעֶ֜זֶר וְ/יוֹאָ֗שׁ בְּנֵי֙ הַ/שְּׁמָעָ֣ה הַ/גִּבְעָתִ֔י ו/יזואל וָ/פֶ֖לֶט בְּנֵ֣י עַזְמָ֑וֶת וּ/בְרָכָ֕ה וְ/יֵה֖וּא הָ/עֲנְּתֹתִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/003.yaml
  text: The chief was Ahiezer[a], then Joash, the sons of Shemaah the Gibeathite; and Jeziel and Pelet, the sons of Azmaveth[b]; and Beracah and Jehu the Anathothite.
translation:
  language: te
  text: ప్రధానుడు అహీయెజెరు; యోవాషు—వీరిద్దరూ గిబియా వాడైన హష్షెమాయా కుమారులు; యెజీయేలు[a], పెలెతు—వీరిద్దరూ అజ్మావెతు కుమారులు; బెరాకా[b], అనాతోతు వాడైన యేహూ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యెజీయేలు అనే పేరును ‘ఇజీయేలు’ అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: బెరాకా అనే పేరును ‘బెరాఖా’ అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: ప్రధానుడు
  rationale: ఈ పేర్ల జాబితా సందర్భంలో רֹאשׁ శరీరంలోని ‘తల’ను కాక, జాబితాలోని నాయకుణ్ణి లేదా ముఖ్యుణ్ణి సూచిస్తుంది.
- source_word: אֲחִיעֶזֶר
  choice: అహీయెజెరు
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగులో ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וְיוֹאָשׁ
  choice: ఆ తరువాత యోవాషు
  rationale: హీబ్రూ సంధాయకం ప్రాథమికంగా ‘మరియు’ అని అర్థమిచ్చినా, ప్రధానుడైన అహీయెజెరు తరువాత జాబితాలో యోవాషు వస్తున్న క్రమాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: בְּנֵי הַשְּׁמָעָה
  choice: వీరు ... షెమాయా కుమారులు
  rationale: בְּנֵי అనే వంశావళి ప్రయోగాన్ని ‘కుమారులు’గా అనువదించాం; హీబ్రూ వాక్యనిర్మాణంలో అహీయెజెరు, యోవాషు ఇద్దరూ షెమాయా కుమారులని స్పష్టం చేయడానికి తెలుగులో ‘వీరు’ చేర్చాం.
- source_word: הַגִּבְעָתִי
  choice: గిబియా వాడైన
  rationale: ఈ ప్రాంతవాచక విశేషణం గిబియా పట్టణానికి చెందిన వ్యక్తిని సూచిస్తుంది; కృత్రిమమైన జాతినామం కంటే ‘గిబియా వాడు’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: ויזואל
  choice: యెజీయేలు
  rationale: పాఠంలోని హీబ్రూ వ్యంజనరూపానికి అనుగుణమైన సంప్రదాయ నామరూపాన్ని తీసుకున్నాం; సాధ్యమైన ప్రత్యామ్నాయ లిప్యంతరీకరణను పాదసూచికలో ఉంచాం.
- source_word: וָפֶלֶט
  choice: పెలెతు
  rationale: వ్యక్తిపేరును అర్థవివరణ జోడించకుండా నేరుగా లిప్యంతరీకరించాం.
- source_word: בְּנֵי עַזְמָוֶת
  choice: వీరు అజ్మావెతు కుమారులు
  rationale: యెజీయేలు, పెలెతు ఇద్దరూ అజ్మావెతు కుమారులని హీబ్రూ నిర్మాణం సూచిస్తుంది; సహజ తెలుగు కోసం ‘వీరు’ చేర్చాం.
- source_word: וּבְרָכָה
  choice: బెరాకా
  rationale: వ్యక్తిపేరును తెలుగులో సులభంగా చదవగల సంప్రదాయ రూపంలో లిప్యంతరీకరించాం; כ ధ్వనిని ప్రతిబింబించే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וְיֵהוּא
  choice: యేహూ
  rationale: హీబ్రూ వ్యక్తిపేరును దాని ధ్వనిరూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: הָעֲנְּתֹתִי
  choice: అనాతోతు వాడైన
  rationale: ఈ ప్రాంతవాచక రూపం అనాతోతుకు చెందిన వ్యక్తిని సూచిస్తుంది; ‘అనాతోతు వాడు’ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
