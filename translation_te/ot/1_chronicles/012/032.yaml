translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. జాబితా స్వభావాన్ని నిలుపుతూ తెలుగు పదక్రమానికి అనుగుణంగా సంఖ్యను వాక్యాంతంలో ఉంచాం; మూలంలోని కర్మణి భావం మరియు ఉద్దేశ సంబంధం సంరక్షించబడ్డాయి.
