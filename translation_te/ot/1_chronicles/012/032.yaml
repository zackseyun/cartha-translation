revisions:
- from: మనష్షే అర్ధగోత్రం నుండి, దావీదును రాజుగా చేయడానికి రావాలని పేరుపేరునా నియమించబడినవారు[a] పద్దెనిమిది వేలమంది.
  to: మనష్షే అర్ధగోత్రం నుండి, పేరుపేరునా గుర్తించబడిన పద్దెనిమిది వేలమంది దావీదును రాజుగా చేయడానికి వచ్చారు.[a]
  rationale: 'The revision restores the Hebrew clause structure: the eighteen thousand were individually designated, and they came for the purpose of making David king. It retains the draft’s appropriate modern Telugu terminology and the lexical-alternative footnote.'
