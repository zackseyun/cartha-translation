source:
  edition: WLC
  text: וּ/מֵ/חֲצִי֙ מַטֵּ֣ה מְנַשֶּׁ֔ה שְׁמוֹנָ֥ה עָשָׂ֖ר אָ֑לֶף אֲשֶׁ֤ר נִקְּבוּ֙ בְּ/שֵׁמ֔וֹת לָ/ב֖וֹא לְ/הַמְלִ֥יךְ אֶת דָּוִֽיד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/032.yaml
  text: And from the half-tribe of Manasseh[a], eighteen thousand, who were designated by name, came to make David king.
translation:
  language: te
  text: మనష్షే అర్ధగోత్రం నుండి, పేరుపేరునా గుర్తించబడిన పద్దెనిమిది వేలమంది దావీదును రాజుగా చేయడానికి వచ్చారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పేర్లతో పేర్కొనబడినవారు”; అంటే ఒక్కొక్కరిగా గుర్తించబడినవారు లేదా ప్రత్యేకంగా జాబితాలో చేర్చబడినవారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵחֲצִי מַטֵּה מְנַשֶּׁה
  choice: మనష్షే అర్ధగోత్రం నుండి
  rationale: וּ־ను తెలుగు వాక్యప్రవాహంలో ప్రత్యేకంగా ‘మరియు’ అని చేర్చకుండా జాబితా కొనసాగింపుగా గ్రహించాం; חֲצִי מַטֵּה అనేది మనష్షే గోత్రంలోని సగభాగాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘అర్ధగోత్రం’ సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: పద్దెనిమిది వేలమంది
  rationale: వ్యక్తుల సంఖ్య కాబట్టి ‘మంది’ని చేర్చి సహజమైన తెలుగు సంఖ్యారూపంగా అనువదించాం.
- source_word: אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: పేరుపేరునా నియమించబడినవారు
  rationale: נקב యొక్క నిఫాల్ రూపంలోని కర్మణి భావాన్ని ‘నియమించబడినవారు’ నిలుపుతుంది; בְּשֵׁמוֹתను ‘పేరుపేరునా’ అనడం వారు వ్యక్తిగతంగా గుర్తించబడ్డారు లేదా జాబితాలో పేర్కొనబడ్డారు అనే భావాన్ని ఇస్తుంది.
- source_word: לָבוֹא
  choice: రావాలని
  rationale: హీబ్రూ ఉద్దేశార్థక క్రియావ్యయాన్ని తెలుగులో ముందున్న నియామకంతో సహజంగా అనుసంధానించేందుకు ‘రావాలని’ వాడాం.
- source_word: לְהַמְלִיךְ אֶת דָּוִיד
  choice: దావీదును రాజుగా చేయడానికి
  rationale: מלך హిఫిల్ రూపం ‘రాజుగా చేయడం/నియమించడం’ అనే కారణార్థక భావాన్ని కలిగిస్తుంది. ‘రాజుగా చేయడానికి’ అనేది కిరీటధారణ అనే ప్రత్యేక ఆచారాన్ని అనవసరంగా సూచించకుండా మూలార్థాన్ని నిలుపుతుంది.
