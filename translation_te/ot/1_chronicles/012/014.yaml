- source_word: עַשְׁתֵּי עָשָׂר
  choice: పదకొండవవాడు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘పదకొండు’ అనే సంఖ్య ఉన్నా, ముందున్న క్రమసంఖ్యకు సమాంతరంగా ఈ జాబితాలో ‘పదకొండవవాడు’ అనే భావంలో వాడబడింది.
