- source_word: יִרְמְיָהוּ
  choice: యిర్మీయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు బైబిలు వాడుకకు సహజంగా ఉండేలా లిప్యంతరీకరించాం.
- source_word: הָעֲשִׂירִי
  choice: పదవవాడు
