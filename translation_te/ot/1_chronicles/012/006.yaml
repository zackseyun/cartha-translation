  text: Eluzai[a], Jerimoth, Bealiah, Shemariahu, and Shephatiah the Haruphite.
translation:
  language: te
  text: ఎలూజై, యెరీమోతు, బెయల్యా, షెమర్యాహు, హరీఫీయుడైన షెఫట్యాహు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “హారూఫీయుడు” అని కూడా అనువదించవచ్చు. ఈ హీబ్రూ వంశసూచక రూపం ఇతర చోట్ల “హారీఫు” అనే రూపంలో కనిపించే వంశనామానికి సంబంధించినదై ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלְעוּזַי
  choice: ఎలూజై
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וִירִימוֹת
  choice: యెరీమోతు
  rationale: ముందున్న సంధికారకాన్ని తెలుగు జాబితా నిర్మాణంలో విడిగా పునరావృతం చేయకుండా, వ్యక్తి పేరును సహజమైన తెలుగు రూపంలో లిప్యంతరీకరించాం.
- source_word: וּבְעַלְיָה
  choice: బెయల్యా
  rationale: హీబ్రూ בְעַלְיָה అనే వ్యక్తి పేరును దాని హల్లులు, అచ్చుల క్రమానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וּשְׁמַרְיָהוּ
  choice: షెమర్యాహు
  rationale: హీబ్రూలోని పూర్తి -యాహు అంత్యరూపాన్ని నిలిపి వ్యక్తి పేరును లిప్యంతరీకరించాం.
- source_word: וּשְׁפַטְיָהוּ
  choice: షెఫట్యాహు
  rationale: హీబ్రూ పేరులోని పూర్తి -యాహు అంత్యరూపాన్ని నిలిపి, మూలరూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: הַחֲרִיפִי
  choice: హరీఫీయులు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ఈ వంశసూచక రూపం జాబితాలోని వ్యక్తుల వంశ లేదా కుటుంబ అనుబంధాన్ని సూచిస్తుంది; తెలుగులో సమూహాన్ని సూచించే బహువచన వంశనామంగా అందించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలిని ఉపయోగించాం. హీబ్రూ మూలంలో చివరి వంశసూచక పదం ఏకవచన రూపంలో ఉన్నప్పటికీ, అది ముందున్న వ్యక్తులందరికీ వర్తించగల జాబితా నిర్మాణాన్ని తెలుగులో సహజంగా చూపేందుకు “వీరు ...యులు” అని ఇచ్చాం; ఈ వ్యాప్తిలోని స్వల్ప సందిగ్ధతను పూర్తిగా తొలగించకుండా పాదసూచనలో రూపాంతర ప్రత్యామ్నాయాన్ని ఉంచాం.
