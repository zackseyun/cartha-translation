  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త నామావళి శైలిని నిలిపాం. పేర్లను అనువదించకుండా లిప్యంతరీకరించాం; చివరి వ్యక్తికి సంబంధించిన జననామవాచకాన్ని సహజమైన విశేషణ రూపంలో ఉంచాం.
