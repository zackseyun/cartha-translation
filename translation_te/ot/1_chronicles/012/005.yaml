lexical_decisions:
- source_word: יִרְמְיָה
  choice: యిర్మీయా
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా, తెలుగులో సులభంగా గుర్తించగల ప్రామాణిక రూపంలో లిప్యంతరీకరించాం.
- source_word: יַחֲזִיאֵל
  choice: యహజీయేలు
  rationale: వ్యక్తి పేరులోని హీబ్రూ ధ్వనిరూపాన్ని సాధ్యమైనంతగా నిలుపుతూ సహజమైన తెలుగు లిప్యంతరీకరణను వాడాం.
- source_word: יוֹחָנָן
  choice: యోహానాను
  rationale: వ్యక్తి పేరును అనువదించకుండా, తెలుగులో సుపరిచితమైన బైబిలు నామరూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: יוֹזָבָד
  choice: యోజాబాదు
  rationale: హీబ్రూ వ్యక్తి పేరును దాని ధ్వనిరూపానికి దగ్గరగా తెలుగు అక్షరాల్లో ఇచ్చాం.
- source_word: הַגְּדֵרָתִי
  choice: గెదేరాతీయుడైన
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ఈ జననామవాచకం యోజాబాదును ఒక ప్రాంతం లేదా వంశసంబంధం ద్వారా గుర్తిస్తుంది. తెలుగు వాక్యంలో విశేషణాత్మకంగా సహజంగా ఉండేలా ‘గెదేరాతీయుడైన’ అని ఇచ్చాం; మూలస్థలాన్ని ఖచ్చితంగా నిర్ణయించకుండా అడుగుసూచికలో ప్రత్యామ్నాయాన్ని తెలిపాం.
