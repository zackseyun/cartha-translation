id: 1CH.12.31
reference: 1 Chronicles 12:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִן בְּנֵ֣י אֶפְרַ֔יִם עֶשְׂרִ֥ים אֶ֖לֶף וּ/שְׁמוֹנֶ֣ה מֵא֑וֹת גִּבּ֣וֹרֵי חַ֔יִל אַנְשֵׁ֥י שֵׁמ֖וֹת לְ/בֵ֥ית אֲבוֹתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/031.yaml
  text: And from the sons of Ephraim[a], twenty thousand eight hundred mighty men of valor, men of renown according to their fathers’ houses.
translation:
  language: te
  text: ఎఫ్రాయిము సంతతివారిలోనుండి ఇరవై వేల ఎనిమిది వందల మంది పరాక్రమవంతులైన యోధులు, తమ పితృకుటుంబాలలో పేరుపొందినవారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘పేర్ల మనుషులు’; అంటే ప్రముఖులు లేదా ప్రసిద్ధులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: వారిలో
  rationale: ముందున్న గోత్రాల జాబితాను కొనసాగించే సంధి-ఉపసర్గ భావాన్ని తెలుగులో సహజమైన జాబితా నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: בְּנֵי אֶפְרַיִם
  choice: ఎఫ్రాయిము సంతతివారు
  rationale: అక్షరార్థంగా ‘ఎఫ్రాయిము కుమారులు’; ఇక్కడ గోత్రానికి చెందిన వారిని సూచిస్తున్నందున ‘సంతతివారు’ వంశ సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: עֶשְׂרִים אֶלֶף וּשְׁמוֹנֶה מֵאוֹת
  choice: ఇరవై వేల ఎనిమిది వందల మంది
  rationale: మూలంలోని ఖచ్చితమైన సంఖ్య 20,800ను తెలుగు వాక్యప్రవాహానికి అనుగుణంగా పదాలతో అందిస్తుంది.
- source_word: גִּבּוֹרֵי חַיִל
  choice: పరాక్రమవంతులైన యోధులు
  rationale: ఈ పదబంధంలోని బలం, శౌర్యం, సైనిక నైపుణ్యం అనే భావాలను యుద్ధసందర్భానికి సరిపోయే ఆధునిక తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: אַנְשֵׁי שֵׁמוֹת
  choice: పేరుపొందినవారు
  rationale: అక్షరార్థమైన ‘పేర్లు గల మనుషులు’ అనే హీబ్రూ నుడికారానికి ‘ప్రసిద్ధులు/ప్రముఖులు’ అనే భావం ఉంది; ‘పేరుపొందినవారు’ ఆ గౌరవార్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: לְבֵית אֲבוֹתָם
  choice: తమ పితృకుటుంబాల్లో
  rationale: వారి పూర్వీకుల కుటుంబ లేదా వంశ గృహాల పరిధిలో వారు పేరుగాంచినవారని సూచిస్తుంది; ‘పితృకుటుంబాలు’ హీబ్రూ సామాజిక-వంశ నిర్మాణాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. హీబ్రూ మూలంలోని జాబితా స్వభావాన్ని నిలుపుతూ, తెలుగులో పూర్తి వాక్యంగా సహజంగా ఉండేందుకు ‘ఉన్నారు; వారు’ చేర్చబడింది. సంప్రదాయ ‘కుమారులు’ కంటే గోత్రసంబంధ భావాన్ని స్పష్టంగా తెలిపే ‘సంతతివారు’ ఎంచుకోబడింది. సంప్రదింపుల ఆంగ్ల పాఠంలో [a] గుర్తు ‘Ephraim’ తరువాత ఉన్నప్పటికీ, ఆ పాదసూచిక విషయం אַנְשֵׁי שֵׁמוֹתకు సంబంధించినందున తెలుగులో ‘పేరుపొందినవారు’ తరువాత సరిగా ఉంచబడింది.
