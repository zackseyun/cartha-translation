- from: ఎఫ్రాయిము సంతతివారిలో ఇరవై వేల ఎనిమిది వందల మంది పరాక్రమవంతులైన యోధులు ఉన్నారు; వారు తమ పితృకుటుంబాల్లో పేరుపొందినవారు[a].
  to: ఎఫ్రాయిము సంతతివారిలోనుండి ఇరవై వేల ఎనిమిది వందల మంది పరాక్రమవంతులైన యోధులు, తమ పితృకుటుంబాలలో పేరుపొందినవారు[a].
