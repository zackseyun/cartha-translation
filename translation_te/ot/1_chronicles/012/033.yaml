source:
  edition: WLC
  text: וּ/מִ/בְּנֵ֣י יִשָּׂשכָ֗ר יוֹדְעֵ֤י בִינָה֙ לַֽ/עִתִּ֔ים לָ/דַ֖עַת מַה יַּעֲשֶׂ֣ה יִשְׂרָאֵ֑ל רָאשֵׁי/הֶ֣ם מָאתַ֔יִם וְ/כָל אֲחֵי/הֶ֖ם עַל פִּי/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/033.yaml
  text: 'From the sons of Issachar[a], men who understood the times, to know what Israel should do: their chiefs were two hundred[b], and all their brothers were under their command.'
translation:
  language: te
  text: ఇశ్శాఖారు కుమారుల్లో[a] కాలాల విషయమై వివేచనగలవారు, ఇశ్రాయేలు ఏమి చేయాలో తెలిసినవారు ఉన్నారు. వారి నాయకులు రెండువందల మంది; వారి సహోదరులందరూ వారి ఆదేశానికి లోబడి ఉన్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కాలాలను గ్రహించే వివేచనగలవారు’ అని కూడా అనువదించవచ్చు; హెబ్రీ పదబంధం ఆ చారిత్రక సందర్భానికి తగిన వివేచనను నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘వారి సహోదరులందరూ వారి నోటి ప్రకారం ఉన్నారు’; ఇది వారి నిర్దేశం లేదా ఆదేశానికి లోబడి ఉండడాన్ని తెలిపే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי יִשָּׂשכָר
  choice: ఇశ్శాఖారు కుమారుల్లో
  rationale: מן + בני ఈ జాబితాలో గోత్రం నుండి వచ్చిన వర్గాన్ని సూచిస్తుంది. ‘కుమారులు’ అనే హెబ్రీ గోత్రపరమైన ప్రయోగాన్ని నిలుపుతూ, తెలుగులో సహజంగా ‘కుమారుల్లో’ అని ఇచ్చాం.
- source_word: יוֹדְעֵי בִינָה לָעִתִּים
  choice: కాలాలను వివేచించి
  rationale: בינה కేవలం సమాచారం కలిగి ఉండడం కాక, పరిస్థితిని గ్రహించే వివేచనను సూచిస్తుంది. לָעִתִּים చారిత్రక సందర్భంలోని ‘కాలాలు’ అనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: לָדַעַת מַה יַעֲשֶׂה יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ఏమి చేయాలో తెలిసినవారు
  rationale: లామెద్‌తో కూడిన క్రియారూపం ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది; imperfect రూపం ఇక్కడ చేయవలసిన సముచిత కార్యాన్ని తెలియజేస్తుంది. ‘ఏమి చేయాలో’ ఆచరణాత్మక వివేచనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: רָאשֵׁיהֶם מָאתַיִם
  choice: వారి నాయకులు రెండువందల మంది
  rationale: רָאשֵׁיהֶם అంటే అక్షరార్థంగా ‘వారి తలలు’; సందర్భంలో అది నాయకులను సూచిస్తుంది. తెలుగులో ‘నాయకులు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: וְכָל אֲחֵיהֶם
  choice: వారి సహోదరులందరూ
  rationale: אֲחֵיהֶם అక్షరార్థం ‘వారి సహోదరులు’; ఇక్కడ అదే గోత్రానికి చెందిన పురుషులను సూచించవచ్చు. మూలంలోని బంధుత్వ భాషను ‘సహోదరులు’ నిలుపుతుంది.
- source_word: עַל־פִּיהֶם
  choice: వారి ఆదేశానుసారం నడుచుకున్నారు
  rationale: అక్షరార్థంగా ‘వారి నోటి ప్రకారం’ అనే ఈ హెబ్రీ నుడికారం, వారి మాట లేదా నిర్దేశానికి లోబడడాన్ని సూచిస్తుంది. తెలుగులో ‘ఆదేశానుసారం నడుచుకున్నారు’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
