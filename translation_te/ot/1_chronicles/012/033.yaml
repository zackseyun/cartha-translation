translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గోత్రపరమైన ‘కుమారులు,’ ‘సహోదరులు’ అనే మూల రూపకాలను నిలిపి, హెబ్రీ నుడికారాన్ని సహజ తెలుగులో వ్యక్తం చేశాం.
