  source_fidelity: జాబితాలోని మొదటి నాలుగు పేర్లు, అలాగే הַקָּרְחִים‌కు ‘కోరహీయులు’ అనే వంశసూచక అనువాదం, హీబ్రూ మూలానికి నమ్మకంగా ఉన్నాయి. అయితే יָשָׁבְעָם‌లోని యָשָׁבְ (యాషవ్/యాషవ-) భాగాన్ని ‘యాషొబా-’గా చేయడం మూలంలోని స్వరాన్ని మరియు ב యొక్క మృదు ఉచ్చారణను సరిగా ప్రతిబింబించదు. దాన్ని ‘యాషవాము’గా సవరించడం సురక్షితమైన, మూలానుగుణమైన లిప్యంతరీకరణ.
