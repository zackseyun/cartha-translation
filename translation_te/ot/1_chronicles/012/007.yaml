  text: Elkanah[a], Isshiah, Azarel, Joezer, and Jashobeam, the Korahites.
translation:
  language: te
  text: ఎల్కానా, యిష్షీయాహు, అజరేలు, యోయెజెరు, యాషవాము—వీరు కోరహీయులు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కోరహు వంశస్థులు.”
    reason: హీబ్రూ వంశ/గోత్ర సూచక పదాన్ని పేరురూపంగా ‘కోరహీయులు’ అని లేదా వివరణాత్మకంగా ‘కోరహు వంశస్థులు’ అని అనువదించవచ్చు.
lexical_decisions:
- source_word: אֶלְקָנָה
  choice: ఎల్కానా
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపానికి అనుగుణంగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: יִשִּׁיָּהוּ
  choice: యిష్షీయాహు
  rationale: వ్యక్తి పేరు; ఈ వచనంలోని హీబ్రూ రూపంలో ఉన్న ద్విత్వ שׁ ధ్వనిని, చివరి יָהוּ భాగాన్ని సాధ్యమైనంత స్పష్టంగా ప్రతిబింబించే లిప్యంతరీకరణ.
- source_word: עֲזַרְאֵל
  choice: అజరేలు
  rationale: వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణను సహజమైన తెలుగు పేరు రూపంలో లిప్యంతరీకరించింది.
- source_word: יוֹעֶזֶר
  choice: యోయెజెరు
  rationale: వ్యక్తి పేరు; హీబ్రూ יוֹעֶזֶר రూపాన్ని నేరుగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: יָשָׁבְעָם
  choice: యాషొబాము
  rationale: వ్యక్తి పేరు; ఈ వచనంలో సాక్ష్యమిచ్చిన హీబ్రూ రూపాన్నే అనుసరించింది; ఇతర చోట్ల కనిపించే భిన్న నామరూపాన్ని ఇక్కడకు తీసుకురాలేదు.
- source_word: הַקָּרְחִים
  choice: కోరహీయులు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న బహువచన వంశ/గోత్ర సూచక పదం; కోరహుతో సంబంధమైన వంశసమూహాన్ని సహజంగా సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పేర్ల జాబితి అని స్పష్టమయ్యేలా సహజమైన విరామచిహ్నాలతో రూపొందించబడింది. మూలంలోని చివరి వంశసూచక పదం అందరి పేర్లకూ వర్తించేలా ‘వీరు’ చేర్చబడింది. పాదసూచిక గుర్తు సంబంధిత ‘కోరహీయులు’ పదం తరువాత ఉంచబడింది.
