revisions:
- from: యొర్దాను అవతలి ప్రాంతం నుండి[a] రూబేనీయులు, గాదీయులు, మనష్షే అర్ధగోత్రంవారు—యుద్ధానికి కావలసిన అన్ని రకాల సైనిక సామగ్రితో—లక్షా ఇరవై వేలమంది వచ్చారు.
  to: యొర్దాను అవతలి వైపు నుండి[a] రూబేనీయులు, గాదీయులు, మనష్షే అర్ధగోత్రానికి చెందినవారు యుద్ధానికి అవసరమైన సమస్త సైనిక సామగ్రితో లక్షా ఇరవై వేలమంది ఉన్నారు.
