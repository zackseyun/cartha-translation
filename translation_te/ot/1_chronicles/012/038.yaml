source:
  edition: WLC
  text: וּ/מֵ/עֵ֣בֶר לַ֠/יַּרְדֵּן מִן הָ/ראוּבֵנִ֨י וְ/הַ/גָּדִ֜י וַ/חֲצִ֣י שֵׁ֣בֶט מְנַשֶּׁ֗ה בְּ/כֹל֙ כְּלֵי֙ צְבָ֣א מִלְחָמָ֔ה מֵאָ֥ה וְ/עֶשְׂרִ֖ים אָֽלֶף־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/038.yaml
  text: And from beyond the Jordan[a], from the Reubenites, the Gadites, and the half-tribe of Manasseh, with every kind of military equipment for war, there were one hundred twenty thousand.
translation:
  language: te
  text: యొర్దాను అవతలి వైపు నుండి[a] రూబేనీయులు, గాదీయులు, మనష్షే అర్ధగోత్రానికి చెందినవారు యుద్ధానికి అవసరమైన సమస్త సైనిక సామగ్రితో లక్షా ఇరవై వేలమంది ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యొర్దాను ఆవలి వైపు నుండి.” ఈ హీబ్రూ పదబంధాన్ని భౌగోళిక దృష్టికోణాన్ని బట్టి “యొర్దానుకు అవతల నుండి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר לַיַּרְדֵּן
  choice: యొర్దాను అవతలి ప్రాంతం నుండి
  rationale: מֵעֵבֶר לַיַּרְדֵּן అనేది యొర్దానుకు అవతల/ఆవలి వైపున ఉన్న ప్రాంతాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో భౌగోళిక భావం సహజంగా వినిపించేందుకు ‘అవతలి ప్రాంతం నుండి’ అని అనువదించబడింది; దృష్టికోణ భేదాన్ని పాదసూచికలో నిలిపాం.
- source_word: מִן הָראוּבֵנִי וְהַגָּדִי וַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: రూబేనీయులు, గాదీయులు, మనష్షే అర్ధగోత్రంవారు
  rationale: హీబ్రూలో జాతి/గోత్ర నామాలు ఏకవచన రూపంలో ఉన్నా సమూహార్థకాలు. అందువల్ల తెలుగులో సహజమైన బహువచన సమూహపదాలు వాడబడ్డాయి. חֲצִי שֵׁבֶט ను స్పష్టంగా ‘అర్ధగోత్రం’గా ఇచ్చాం.
- source_word: בְּכֹל כְּלֵי צְבָא מִלְחָמָה
  choice: యుద్ధానికి కావలసిన అన్ని రకాల సైనిక సామగ్రితో
  rationale: כְּלֵי అనే పదం ఆయుధాలకే పరిమితం కాకుండా పరికరాలు/సామగ్రిని కూడా సూచించగలదు. అందుచేత విస్తృత భావాన్ని కాపాడుతూ ‘సైనిక సామగ్రి’ అని, בְּכֹל ను ‘అన్ని రకాల’ అని అందించాం.
- source_word: מֵאָה וְעֶשְׂרִים אָלֶף
  choice: లక్షా ఇరవై వేలమంది
  rationale: హీబ్రూ సంఖ్య 120,000. వ్యక్తుల లెక్క అని సందర్భం తెలియజేస్తున్నందున తెలుగులో సహజంగా ‘వేలమంది’ అని ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. జాబితా నిర్మాణాన్ని సహజం చేయడానికి విరామచిహ్నాలు ఉపయోగించబడ్డాయి; హీబ్రూ వాక్యంలో అంతర్లీనంగా ఉన్న ‘వచ్చారు’ అనే క్రియను తెలుగులో వాక్యపూర్ణత కోసం స్పష్టంగా చేర్చాం.
