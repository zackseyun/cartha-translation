source:
  edition: WLC
  text: וּ/מִן הַ/גָּדִ֡י נִבְדְּל֣וּ אֶל דָּוִיד֩ לַ/מְצַ֨ד מִדְבָּ֜רָ/ה גִּבֹּרֵ֣י הַ/חַ֗יִל אַנְשֵׁ֤י צָבָא֙ לַ/מִּלְחָמָ֔ה עֹרְכֵ֥י צִנָּ֖ה וָ/רֹ֑מַח וּ/פְנֵ֤י אַרְיֵה֙ פְּנֵי/הֶ֔ם וְ/כִ/צְבָאיִ֥ם עַל הֶ/הָרִ֖ים לְ/מַהֵֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/009.yaml
  text: Some of the Gadites separated themselves to David at the stronghold in the wilderness[a], mighty warriors, men of the army for battle, able to handle shield and spear, whose faces were like the faces of lions[c][b], and who were as swift as gazelles on the mountains.
translation:
  language: te
  text: గాదీయులలో కొందరు దావీదు దగ్గరకు రావడానికి తమను తాము వేరుచేసుకొని, అరణ్యంలోని దుర్గం వద్దకు వచ్చారు[a]. వారు పరాక్రమవంతులైన యోధులు, యుద్ధానికి సిద్ధమైన సైనికులు; డాలు, ఈటెలను ఉపయోగించడంలో నిపుణులు[b]. వారి ముఖాలు సింహాల ముఖాలవలె ఉండేవి; కొండల మీద వారు లేడి జింకలవలె వేగంగా కదిలేవారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అరణ్యంలోని దుర్గం వద్ద దావీదు దగ్గరకు వచ్చారు.” హీబ్రూ విభక్తుల క్రమాన్ని దుర్గం వద్ద ఉన్నట్లు గానీ, దుర్గం వైపు కదలికను సూచించినట్లు గానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “డాలు, ఈటెలను అమర్చేవారు.” ఈ మాటలు యుద్ధానికి సిద్ధంగా ఉండి, ఆ ఆయుధాలను సమర్థంగా ఉపయోగించగల వారిని సూచిస్తాయి.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థానికి దగ్గరగా, “కొండల మీద లేడి జింకలవలె త్వరపడేవారు.” ఈ పోలిక వారి వేగాన్నీ చురుకుదనాన్నీ సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַגָּדִי
  choice: గాదీయులలో కొందరు
  rationale: מן అనే విభక్తి గాదు గోత్రం నుండి వచ్చిన ఒక వర్గాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘గాదీయులలో కొందరు’ అనేది సహజంగా ఉండి, గోత్రమంతటినీ కాక వారిలో కొందరినే సూచిస్తుంది.
- source_word: נִבְדְּלוּ
  choice: తమవారి నుండి వేరై
  rationale: בדל ధాతువు నిఫాల్ రూపం వేరుపడడం లేదా తమను తాము వేరుచేసుకోవడం అనే భావాన్ని ఇస్తుంది. తెలుగులో అవసరమైన సంబంధాన్ని సహజంగా తెలిపేందుకు ‘తమవారి నుండి’ అని ఉపయోగించబడింది; వారి ఉద్దేశాన్ని అదనంగా నిర్ధారించలేదు.
- source_word: אֶל דָּוִיד
  choice: దావీదు దగ్గరకు వచ్చారు
  rationale: אֶל దావీదు వైపు కదలికను సూచిస్తుంది. ‘దావీదు పక్షంలో చేరారు’ అని వ్యాఖ్యానాత్మకంగా చెప్పకుండా, దిశా భావాన్ని నేరుగా ఉంచింది.
- source_word: לַמְצַד מִדְבָּרָה
  choice: అరణ్యంలోని దుర్గం వద్ద
  rationale: מְצַד అనేది దుర్గం లేదా కోటను సూచిస్తుంది; מִדְבָּרָה అరణ్యం వైపు/అరణ్యంలో అనే దిశా-స్థాన భావం కలిగిస్తుంది. ప్రధాన పాఠ్యంలో సందర్భానుకూలమైన స్థానార్థం తీసుకుని, గమ్యార్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: גִּבֹּרֵי הַחַיִל
  choice: పరాక్రమవంతులైన యోధులు
  rationale: ఈ స్థిరమైన సైనిక పదబంధం బలమూ యుద్ధపటిమా గల వారిని సూచిస్తుంది. ఈ ఎంపిక ఆధునిక, గౌరవప్రదమైన తెలుగులో దాని బలాన్ని నిలుపుతుంది.
- source_word: אַנְשֵׁי צָבָא לַמִּלְחָמָה
  choice: యుద్ధానికి సిద్ధమైన సైనికులు
  rationale: పదబంధం వారి సైనిక స్వభావాన్నీ యుద్ధసన్నద్ధతనూ బలపరుస్తుంది. అక్షరార్థమైన అసహజ నిర్మాణాన్ని నివారిస్తూ రెండూ నిలుపబడ్డాయి.
- source_word: עֹרְכֵי צִנָּה וָרֹמַח
  choice: డాలు, ఈటె పట్టడంలో నిపుణులు
  rationale: ערך అనే కృదంతం ఇక్కడ ఆయుధాలను యుద్ధానికి అమర్చడం లేదా వాటిని సమర్థంగా ఉపయోగించడానికి సిద్ధంగా ఉండడం అనే భావాన్ని ఇస్తుంది. సహజ తెలుగులో యుద్ధనైపుణ్యాన్ని తెలియజేసేలా అనువదించబడింది; అక్షరార్థం పాదసూచికలో ఉంది.
- source_word: וּפְנֵי אַרְיֵה פְּנֵיהֶם
  choice: వారి ముఖాలు సింహాల ముఖాలవలె ఉండేవి
  rationale: హీబ్రూలో ‘ముఖాలు’ అనే పదం పునరుక్తమై ఉపమానాన్ని బలపరుస్తుంది. తెలుగు వాక్యం ఆ పునరుక్తినీ సింహసదృశమైన భీకరత్వాన్నీ వ్యాఖ్యానం జోడించకుండా నిలుపుతుంది.
- source_word: וְכִצְבָאִים עַל הֶהָרִים לְמַהֵר
  choice: కొండల మీద వారు జింకలవలె వేగంగా కదిలేవారు
  rationale: צְבָאִים వేగం, చురుకుదనం గల జింకలను సూచిస్తుంది; לְמַהֵר త్వరగా కదలడాన్ని స్పష్టం చేస్తుంది. తెలుగు వాక్యంలో ఉపమానాన్ని సహజంగా వ్యక్తపరచేందుకు వేగ భావాన్ని క్రియలో చేర్చింది.
