revisions:
- from: గాదీయులలో కొందరు తమవారి నుండి వేరై, అరణ్యంలోని దుర్గం వద్ద ఉన్న దావీదు దగ్గరకు వచ్చారు[a]. వారు పరాక్రమవంతులైన యోధులు, యుద్ధానికి సిద్ధమైన సైనికులు; డాలు, ఈటె పట్టడంలో నిపుణులు[b]. వారి ముఖాలు సింహాల ముఖాలవలె ఉండేవి; కొండల మీద వారు జింకలవలె వేగంగా కదిలేవారు[c].
  to: గాదీయులలో కొందరు దావీదు దగ్గరకు రావడానికి తమను తాము వేరుచేసుకొని, అరణ్యంలోని దుర్గం వద్దకు వచ్చారు[a]. వారు పరాక్రమవంతులైన యోధులు, యుద్ధానికి సిద్ధమైన సైనికులు; డాలు, ఈటెలను ఉపయోగించడంలో నిపుణులు[b]. వారి ముఖాలు సింహాల ముఖాలవలె ఉండేవి; కొండల మీద వారు లేడి జింకలవలె వేగంగా కదిలేవారు[c].
  rationale: The revision removes an unnecessary specification of the separation’s source, retains the Hebrew reflexive sense, strengthens the weapon phrase to convey combat use, clarifies the disputed locative/directional relation in footnote a, and identifies the animal comparison more specifically as gazelles. The verse’s meaning and its noninterpretive register are otherwise preserved.
  reviewer_model: gpt-5.6-terra
