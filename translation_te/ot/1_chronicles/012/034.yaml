source:
  edition: WLC
  text: מִ/זְּבֻל֞וּן יוֹצְאֵ֣י צָבָ֗א עֹרְכֵ֧י מִלְחָמָ֛ה בְּ/כָל כְּלֵ֥י מִלְחָמָ֖ה חֲמִשִּׁ֣ים אָ֑לֶף וְ/לַ/עֲדֹ֖ר בְּ/לֹא לֵ֥ב וָ/לֵֽב־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/034.yaml
  text: From Zebulun[a], fifty thousand men fit for military service, prepared for battle with every kind of weapon of war[b], to help without a divided heart.
translation:
  language: te
  text: జెబూలూను నుండి, సైనిక సేవకు తగినవారూ అన్ని రకాల యుద్ధాయుధాలతో యుద్ధానికి సిద్ధమైనవారూ అయిన యాభై వేల మంది, హృదయంలో ద్వంద్వం లేకుండా[b] సహాయం చేయడానికి[a] ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సైనిక వరుసల్లో చేరడానికి’ / ‘మద్దతు ఇవ్వడానికి.’ ఇక్కడి హెబ్రీ క్రియ అరుదైనది; సందర్భంలో వారు ఐక్యంగా మద్దతు ఇవ్వడమనే భావం ఉంది.
    reason: alternative_reading
  - marker: b
    text: పదశః, ‘హృదయం మరియు హృదయం లేకుండా.’ ఇది విభజిత విధేయత లేదా ద్విమనస్కత లేకపోవడాన్ని సూచించే హెబ్రీ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְּבֻלוּן
  choice: జెబూలూను నుండి
  rationale: మִן ఉపసర్గ మూలాన్ని లేదా వచ్చిన ప్రాంతాన్ని సూచిస్తుంది; ఈ సైనిక దళం జెబూలూను గోత్రం నుండి వచ్చిందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יוֹצְאֵי צָבָא
  choice: సైనిక సేవకు తగినవారు
  rationale: పదశః ‘సైన్యానికి బయలుదేరేవారు’; ఇక్కడ ఇది యుద్ధసేవకు అర్హులైన లేదా అందుబాటులో ఉన్న పురుషులను సూచించే సైనిక నుడికారం.
- source_word: עֹרְכֵי מִלְחָמָה
  choice: పోరాటానికి సిద్ధమైనవారు
  rationale: ערך క్రియ యుద్ధానికి బారులు తీర్చడం లేదా క్రమపరచడం అనే భావాన్ని ఇస్తుంది; సందర్భంలో యుద్ధసన్నద్ధతను స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בְּכָל כְּלֵי מִלְחָמָה
  choice: అన్ని రకాల యుద్ధాయుధాలతో
  rationale: כְּלֵי מִלְחָמָה యుద్ధ పరికరాలు లేదా ఆయుధాలను సూచిస్తుంది; בְּכָל యొక్క సమగ్ర భావాన్ని ‘అన్ని రకాల’ అని తెలియజేశాం.
- source_word: חֲמִשִּׁים אָלֶף
  choice: యాభై వేల మంది
  rationale: సంఖ్యను నేరుగా అనువదించి, సందర్భానుసారంగా వ్యక్తులను సూచించేందుకు ‘మంది’ చేర్చాం.
- source_word: וְלַעֲדֹר
  choice: సహాయం చేయడానికి
  rationale: ఇక్కడ עדר క్రియ అరుదైనది, దాని ఖచ్చితమైన సైనిక నుడికారం అనిశ్చితం. దావీదుకు మద్దతుగా చేరడమనే సందర్భోచిత భావాన్ని అతిగా నిర్దిష్టీకరించకుండా ‘సహాయం చేయడానికి’ అని ఇచ్చాం.
- source_word: בְּלֹא לֵב וָלֵב
  choice: హృదయంలో ద్వంద్వం లేకుండా
  rationale: పదశః ‘హృదయం, హృదయం లేకుండా’ అనే హెబ్రీ నుడికారం విభజిత విధేయత లేదా ద్విమనస్కత లేకపోవడాన్ని సూచిస్తుంది. హృదయ రూపకాన్ని నిలుపుతూ ఆధునిక తెలుగులో అర్థమయ్యేలా అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. సైనిక పదజాలం సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచబడింది. అరుదైన עדר క్రియలోని అనిశ్చితిని ప్రధాన పాఠంలో అతిగా నిర్దిష్టీకరించకుండా, ప్రత్యామ్నాయాలను పాదటీకలో ఇచ్చాం; ‘హృదయం’ అనే మూలభాషా రూపకాన్ని కూడా నిలిపాం.
