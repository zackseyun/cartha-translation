translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సైనిక జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. మూలంలోని సంఖ్యలు, నాయకులు–సైనికుల మధ్య సంబంధం, ఆయుధాల వివరాలు నిలుపబడ్డాయి.
