  yaml_path: translation/ot/1_chronicles/012/035.yaml
  text: 'From Naphtali: 1,000 commanders[b][a], and with them 37,000 with shield and spear.'
translation:
  language: te
  text: 'నఫ్తాలి గోత్రం నుండి: 1,000 మంది సేనాధిపతులు[a]; వారితో పాటు డాలు[b], ఈటెలతో ఉన్నవారు 37,000 మంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అధిపతులు,” “నాయకులు,” లేదా “సైన్యాధికారులు.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి హీబ్రూ పదం ప్రత్యేకంగా పెద్ద డాలును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנַּפְתָּלִי
  choice: నఫ్తాలి గోత్రం నుండి
  rationale: అక్షరార్థంగా ‘నఫ్తాలి నుండి’; జాబితా సందర్భంలో ఇది గోత్రాన్ని సూచిస్తుందని తెలుగులో సహజంగా స్పష్టం చేయబడింది.
- source_word: שָׂרִים
  choice: సేనాధిపతులు
  rationale: ఈ సైనిక గణన సందర్భంలో అధికారులు లేదా సైనిక నాయకులు అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: אָלֶף
  choice: 1,000 మంది
  rationale: సైనికుల గణనలో చదవడానికి సులభంగా అంకెలలో ఇవ్వబడింది.
- source_word: וְעִמָּהֶם
  choice: వారితో పాటు
  rationale: నాయకులతో కూడి ఉన్న పెద్ద సైనిక సమూహాన్ని సూచించే సంబంధాన్ని నిలుపుతుంది.
- source_word: בְּצִנָּה
  choice: పెద్ద డాలు ధరించిన
  rationale: צִנָּה సాధారణంగా శరీరాన్ని ఎక్కువగా కప్పే పెద్ద డాలును సూచించగలదు; ఆయుధసన్నద్ధత భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַחֲנִית
  choice: ఈటె
  rationale: חֲנִיתకు ఆధునిక తెలుగులో స్పష్టమైన, సాధారణ సైనిక పదం.
- source_word: שְׁלֹשִׁים וְשִׁבְעָה אָלֶף
  choice: 37,000 మంది
  rationale: జాబితా పఠన సౌలభ్యం కోసం సంఖ్యను అంకెలలో ఇచ్చి, వ్యక్తులని స్పష్టం చేయడానికి ‘మంది’ చేర్చబడింది.
