  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. עָצוּר యొక్క సందిగ్ధతను ప్రధాన పాఠ్యంలో విస్తృతార్థక పదంతో ఉంచి, ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చాం.
