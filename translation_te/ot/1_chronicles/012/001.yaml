  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֗לֶּה הַ/בָּאִ֤ים אֶל דָּוִיד֙ לְ/צִ֣יקְלַ֔ג ע֣וֹד עָצ֔וּר מִ/פְּנֵ֖י שָׁא֣וּל בֶּן קִ֑ישׁ וְ/הֵ֨מָּה֙ בַּ/גִּבּוֹרִ֔ים עֹזְרֵ֖י הַ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/001.yaml
  text: These are the men who came to David at Ziklag while he was still kept back because of Saul son of Kish[a]; and they were among the mighty warriors[b], helpers in war.
translation:
  language: te
  text: కీషు కుమారుడైన సౌలు కారణంగా దావీదు ఇంకా కట్టడి చేయబడి ఉన్నప్పుడు, సిక్లగులో దావీదు దగ్గరికి వచ్చినవారు వీరే[a]. వారు యుద్ధంలో తోడ్పడే పరాక్రమవంతులైన యోధులలో ఉన్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సౌలు కారణంగా ఇంకా అడ్డగించబడి ఉన్నప్పుడు’ లేదా ‘సౌలు కారణంగా ఇంకా పరిమిత స్థితిలో ఉన్నప్పుడు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వీరయోధులలో ఉన్నవారు’; హెబ్రీ పదం గిబ్బోరీమ్ పరాక్రమవంతులైన యోధులను లేదా వీరులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: వీరే
  rationale: కొత్త జాబితాను పరిచయం చేస్తూ, אֵלֶּה యొక్క సూచనార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; וְ యొక్క అనుసంధాన బలం సందర్భంలోనే వ్యక్తమవుతుంది.
- source_word: הַבָּאִים אֶל דָּוִיד לְצִיקְלַג
  choice: సిక్లగులో అతని దగ్గరికి వచ్చినవారు
  rationale: సిక్లగు వారు దావీదును చేరిన స్థలమని సందర్భానుసారంగా తెలియజేస్తూ, కృదంతాన్ని సహజమైన సంబంధార్థక నిర్మాణంగా అందిస్తుంది.
- source_word: עוֹד עָצוּר
  choice: ఇంకా నిర్బంధంలో ఉన్నప్పుడు
  rationale: עוֹד సూచించే కొనసాగుతున్న స్థితిని ‘ఇంకా’ తెలియజేస్తుంది; עָצוּר లోని అడ్డగించబడిన లేదా పరిమిత స్థితిని, తప్పనిసరిగా కారాగారవాసమని నిర్ణయించకుండా ‘నిర్బంధంలో’ వ్యక్తం చేస్తుంది.
- source_word: מִפְּנֵי שָׁאוּל בֶּן קִישׁ
  choice: కీషు కుమారుడైన సౌలు కారణంగా
  rationale: מִפְּנֵי యొక్క కారణార్థాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: בַּגִּבּוֹרִים
  choice: పరాక్రమశాలుల్లో ఒకరు
  rationale: גִּבּוֹרִים యొక్క వీరత్వం, యుద్ధసామర్థ్యం రెండింటినీ సహజంగా సూచిస్తుంది; ‘ఒకరు’ ఇక్కడ సమూహంలో భాగమనే అర్థంలో బహువచన కర్తకు అనుగుణంగా వాడబడింది.
- source_word: עֹזְרֵי הַמִּלְחָמָה
  choice: యుద్ధంలో సహాయం చేసే
  rationale: వారి సైనిక సహాయక పాత్రను మూలానికి సమీపంగా, సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
