- from: కీషు కుమారుడైన సౌలు కారణంగా దావీదు ఇంకా నిర్బంధంలో ఉన్నప్పుడు, సిక్లగులో అతని దగ్గరికి వచ్చినవారు వీరే[a]. వారు యుద్ధంలో సహాయం చేసే పరాక్రమశాలుల్లో ఒకరు[b].
  to: కీషు కుమారుడైన సౌలు కారణంగా దావీదు ఇంకా కట్టడి చేయబడి ఉన్నప్పుడు, సిక్లగులో దావీదు దగ్గరికి వచ్చినవారు వీరే[a]. వారు యుద్ధంలో తోడ్పడే పరాక్రమవంతులైన యోధులలో ఉన్నారు[b].
  rationale: The revision corrects the plural reference in the final clause, makes the military sense of גִּבּוֹרִים explicit, and replaces an overly prison-specific rendering of עָצוּר with a broader expression for restraint. It also repeats David's name at the joining clause for unambiguous Telugu reference. Footnote anchors and lexical alternatives remain aligned with their source expressions.
