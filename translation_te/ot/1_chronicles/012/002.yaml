  source_fidelity: 'మూల హెబ్రీయ వాక్యంలోని మూడు ప్రధాన అంశాలు నిష్ఠగా వచ్చాయి: విల్లుతో ఆయుధసన్నద్ధులైనవారు, రాళ్లు మరియు బాణాల వినియోగంలో రెండు చేతులనూ ఉపయోగించగల నైపుణ్యం, సౌలుకు సంబంధించిన బెన్యామీను వంశీయ/గోత్ర సంబంధం. రాళ్ల విషయంలో మూలంలో లేని వడిసెల వంటి సాధనాన్ని చేర్చలేదు. ‘సహోదరులు’కు ఉన్న విస్తృత బంధుత్వ అర్థసంభావ్యతను పాదసూచిక సముచితంగా కాపాడుతుంది.'
