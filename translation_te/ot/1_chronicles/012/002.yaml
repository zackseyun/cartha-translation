id: 1CH.12.2
reference: 1 Chronicles 12:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: נֹ֣שְׁקֵי קֶ֗שֶׁת מַיְמִינִ֤ים וּ/מַשְׂמִאלִים֙ בָּֽ/אֲבָנִ֔ים וּ/בַ/חִצִּ֖ים בַּ/קָּ֑שֶׁת מֵ/אֲחֵ֥י שָׁא֖וּל מִ/בִּנְיָמִֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/002.yaml
  text: They were archers[a], able to use both the right hand and the left in hurling stones and shooting arrows with the bow; they were from Saul’s brothers, from Benjamin.
translation:
  language: te
  text: వారు విల్లు ధరించినవారు; రాళ్లు విసరడంలోను విల్లుతో బాణాలు వేయడంలోను కుడిచేతిని, ఎడమచేతిని సమానంగా ఉపయోగించగలవారు. వారు బెన్యామీను గోత్రానికి చెందిన సౌలు సహోదరులు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సౌలు బంధువులు’ లేదా ‘సౌలు గోత్రస్థులు.’ ‘సహోదరులు’ అనే హెబ్రీ పదం సొంత అన్నదమ్ములను మాత్రమే కాకుండా, విస్తృత కుటుంబానికి లేదా అదే గోత్రానికి చెందినవారిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשְׁקֵי קֶשֶׁת
  choice: విల్లు ధరించినవారు
  rationale: ఈ భాగం అక్షరార్థంగా విల్లును ధరించిన లేదా దానితో ఆయుధసన్నద్ధులైన వారిని సూచిస్తుంది. ‘విలుకాండ్రు’ అని కేవలం నైపుణ్యపాత్రగా కుదించకుండా మూలంలోని ఆయుధసన్నద్ధతను నిలుపుతుంది.
- source_word: מַיְמִינִים וּמַשְׂמִאלִים
  choice: కుడిచేతిని, ఎడమచేతిని సమానంగా ఉపయోగించగలవారు
  rationale: ఇది సహజంగా ఏ చేతివాటమో చెప్పడం కంటే, రెండు చేతులతోనూ ఆయుధాలను నైపుణ్యంగా ఉపయోగించగల సామర్థ్యాన్ని తెలియజేస్తుంది.
- source_word: בָּאֲבָנִים
  choice: రాళ్లు విసరడంలో
  rationale: యుద్ధ సందర్భంలో రాళ్లను ఆయుధంగా ప్రయోగించడం ఉద్దేశం. మూలంలో స్పష్టంగా లేని ‘వడిసెల’ను చేర్చకుండా క్రియాత్మక భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: וּבַחִצִּים בַּקָּשֶׁת
  choice: విల్లుతో బాణాలు వేయడంలో
  rationale: బాణాలను విల్లుతో ప్రయోగించే నైపుణ్యాన్ని స్పష్టమైన, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: מֵאֲחֵי שָׁאוּל
  choice: సౌలు సహోదరులు
  rationale: אָח అనే పదానికి నేరుగా ‘సహోదరుడు’ అనే అర్థం ఉంది; అయితే ఇక్కడ అది విస్తృత బంధుత్వం లేదా ఒకే గోత్రానికి చెందినవారిని సూచించే అవకాశాన్ని పాదసూచికలో నిలుపుతున్నాం.
- source_word: מִבִּנְיָמִן
  choice: బెన్యామీను గోత్రానికి చెందిన
  rationale: గోత్ర మూలాన్ని ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా తెలియజేస్తూ, ‘బెన్యామీను నుండి’ అనే హెబ్రీయ రూపంలోని భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ‘సౌలు సహోదరులు’ అనే బంధుత్వ పదం పరిధి
  choice: ప్రధాన పాఠంలో నేరుగా ‘సహోదరులు’ అని ఉంచి, విస్తృత అర్థాన్ని పాదసూచికలో ఇవ్వడం
  alternative: సౌలు బంధువులు / సౌలు గోత్రస్థులు
  rationale: మూలపదపు ప్రత్యక్ష అర్థాన్ని కాపాడుతూ, సందర్భం సూచించే విస్తృత కుటుంబ లేదా గోత్ర సంబంధాన్ని మౌనంగా నిర్ణయించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ఆయుధ వినియోగానికి సంబంధించిన మూలంలోని సమాంతరతను నిలిపి, మూలంలో స్పష్టంగా లేని ‘వడిసెల’ వంటి వివరాలను చేర్చలేదు.
