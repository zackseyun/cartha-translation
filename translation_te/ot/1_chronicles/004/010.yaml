source:
  edition: WLC
  text: וַ/יִּקְרָ֣א יַ֠עְבֵּץ לֵ/אלֹהֵ֨י יִשְׂרָאֵ֜ל לֵ/אמֹ֗ר אִם בָּרֵ֨ךְ תְּבָרֲכֵ֜/נִי וְ/הִרְבִּ֤יתָ אֶת גְּבוּלִ/י֙ וְ/הָיְתָ֤ה יָדְ/ךָ֙ עִמִּ֔/י וְ/עָשִׂ֥יתָ מֵּ/רָעָ֖ה לְ/בִלְתִּ֣י עָצְבִּ֑/י וַ/יָּבֵ֥א אֱלֹהִ֖ים אֵ֥ת אֲשֶׁר שָׁאָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/010.yaml
  text: And Jabez called on the God of Israel[a], saying, “If you would indeed bless me and enlarge my territory, and let your hand be with me[b], and keep me from harm so that I may not suffer pain!” And God granted what he asked.
translation:
  language: te
  text: యాబేసు ఇశ్రాయేలు దేవునికి మొరపెట్టి, “నీవు నన్ను తప్పకుండా ఆశీర్వదించి, నా భూభాగాన్ని విస్తరించి, నీ చెయ్యి నాకు తోడుగా ఉండేలా చేసి, హాని నాకు కలగకుండా కాపాడి[a], నేను బాధపడకుండా చేస్తే ఎంత బాగుంటుంది![b]” అని ప్రార్థించాడు. అతడు అడిగినదాన్ని దేవుడు అనుగ్రహించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చెడునుండి కాపాడి.” హీబ్రూ పదం నైతికమైన చెడును గానీ, హాని కలిగించే విపత్తును గానీ సూచించవచ్చు. ఇక్కడ బాధపడకుండా ఉండాలనే తరువాతి మాటను బట్టి “హాని” అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: b
    text: “నేను బాధపడకుండా” అనే మాట, ముందటి వచనంలో యాబేసు పేరుకు ఇచ్చిన వివరణను ప్రతిధ్వనిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: మొరపెట్టి
  rationale: ప్రార్థనా సందర్భంలో ఈ క్రియ కేవలం పిలవడాన్ని కాక దేవునికి విజ్ఞప్తి చేయడాన్ని సూచిస్తుంది.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవునికి
  rationale: ఇశ్రాయేలు దేవుణ్ణి గుర్తించే సహజమైన తెలుగు నిర్మాణం.
- source_word: אִם בָּרֵךְ תְּבָרֲכֵנִי
  choice: నీవు నన్ను తప్పకుండా ఆశీర్వదించి … చేస్తే ఎంత బాగుంటుంది
  rationale: אִם అనే షరతు సూచక పదాన్ని విస్మరించకుండా, infinitive absolute ఇచ్చే బలాన్ని “తప్పకుండా” ద్వారా, మొత్తం వాక్యంలోని తీవ్రమైన కోరికను సహజమైన తెలుగు ఆశాప్రార్థన రూపంలో వ్యక్తం చేసింది.
- source_word: וְהִרְבִּיתָ אֶת גְּבוּלִי
  choice: నా భూభాగాన్ని విస్తరించి
  rationale: גְּבוּל సరిహద్దును లేదా ఆ సరిహద్దులోని ప్రాంతాన్ని సూచించగలదు; ఇక్కడ భూవిస్తరణ భావాన్ని “భూభాగం” సహజంగా తెలియజేస్తుంది.
- source_word: וְהָיְתָה יָדְךָ עִמִּי
  choice: నీ చెయ్యి నాకు తోడుగా ఉండేలా చేసి
  rationale: దేవుని శక్తి, సహాయం అనే హీబ్రూ రూపకాన్ని “నీ చెయ్యి”గా నిలిపి, దాని సహాయక భావాన్ని తెలుగులో స్పష్టంగా తెలిపింది.
- source_word: וְעָשִׂיתָ מֵּרָעָה
  choice: నాకు కీడు కలగకుండా కాపాడి
  rationale: హీబ్రూ నిర్మాణం సంక్షిప్తంగా, కొంత క్లిష్టంగా ఉంది. తరువాత వచ్చే బాధ ప్రస్తావనను బట్టి హానికరమైన విపత్తు నుండి రక్షణ అనే భావాన్ని ప్రధాన పాఠంలో ఇచ్చి, “చెడు” అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: לְבִלְתִּי עָצְבִּי
  choice: నేను బాధపడకుండా
  rationale: బాధ, వేదన అనే భావాన్ని తెలియజేస్తూ, ముందటి వచనంలోని యాబేసు పేరు వివరణతో ఉన్న పదప్రతిధ్వనిని నిలుపుతుంది.
- source_word: וַיָּבֵא אֱלֹהִים אֵת אֲשֶׁר שָׁאָל
  choice: అతడు అడిగినదాన్ని దేవుడు అనుగ్రహించాడు
  rationale: దేవుడు అతని అభ్యర్థనను నెరవేర్చాడనే హీబ్రూ నుడికారార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యాబేసు కోరిన גְּבוּל విస్తరణ స్వభావం
  choice: సాధారణ భూభాగ విస్తరణగా అనువదించబడింది.
  alternative: “ప్రభావ పరిధి” వంటి రూపకార్థం.
  rationale: హీబ్రూ పదం సహజంగా సరిహద్దు లేదా భూభాగాన్ని సూచిస్తుంది. ఆధునిక సంపద-సిద్ధాంత భావాలను గానీ, పాఠ్యంలో లేని రూపకార్థాన్ని గానీ అనువాదంలో చేర్చలేదు.
- issue: ప్రార్థనలో רָעָה అర్థం
  choice: ప్రధాన పాఠంలో “కీడు” అని అనువదించబడింది.
  alternative: “చెడు.”
  rationale: బాధపడకూడదనే తరువాతి ఉద్దేశ వాక్యాన్ని బట్టి హాని లేదా విపత్తు భావం సందర్భానికి సరిపోతుంది. అయినా నైతిక చెడు అనే అర్థసాధ్యతను పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలి వాడబడింది. హీబ్రూ ఆశాప్రార్థన నిర్మాణాన్ని “చేస్తే ఎంత బాగుంటుంది”గా, దాని తీవ్రతను “తప్పకుండా”గా వ్యక్తం చేసింది. “నీ చెయ్యి” అనే మూలభాషా రూపకం నిలుపబడింది.
