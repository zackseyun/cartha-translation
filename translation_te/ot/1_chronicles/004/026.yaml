  text: 'The sons of Mishma: Hammuel his son, Zaccur his son, Shimei his son.'
translation:
  language: te
  text: 'మిష్మా కుమారులు: హమ్మూయేలు అతని కుమారుడు, జక్కూరు అతని కుమారుడు, షిమీ అతని కుమారుడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: בְנֵי అనేది ‘కుమారులు’ అనే అర్థమిచ్చే నిర్మాణ బహువచనం. వంశావళి జాబితాలో సహజమైన తెలుగుకోసం ఆరంభ సంధికారకమైన וּను ప్రత్యేకంగా అనువదించలేదు.
- source_word: מִשְׁמָע
  choice: మిష్మా
  rationale: హీబ్రూ వ్యక్తినామాన్ని మాసొరెటిక్ స్వరరూపానికి దగ్గరగా తెలుగు లిపిలో ప్రతిలిపి చేశాం.
- source_word: חַמּוּאֵל
  choice: హమ్మూయేలు
  rationale: వ్యక్తినామాన్ని హీబ్రూ ఉచ్చారణకు దగ్గరగా ప్రతిలిపి చేసి, ద్విత్వ మ్ ధ్వనిని నిలిపాం.
- source_word: בְּנוֹ
  choice: అతని కుమారుడు
  rationale: 3వ పురుష ఏకవచన ప్రత్యయంతో ఉన్న בֵּן రూపం నేరుగా ‘అతని కుమారుడు’ అని అర్థమిస్తుంది; వంశావళిలోని తరాల క్రమాన్ని ఇది స్పష్టంగా ఉంచుతుంది.
- source_word: זַכּוּר
  choice: జక్కూరు
  rationale: హీబ్రూ వ్యక్తినామంలోని ద్విత్వ క్ ధ్వనిని, దీర్ఘ ū స్వరాన్ని ప్రతిబింబించే తెలుగు ప్రతిలిపి.
- source_word: שִׁמְעִי
  choice: షిమీ
  rationale: మాసొరెటిక్ స్వరరూపాన్ని అనుసరించి వ్యక్తినామాన్ని ‘షిమీ’గా ప్రతిలిపి చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితా యొక్క సంక్షిప్త నిర్మాణాన్ని నిలిపి, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలిని ఉపయోగించాం.
