  yaml_path: translation/ot/1_chronicles/004/039.yaml
  text: They went to the entrance of Gedor[a], as far as the east side of the valley[b], to seek pasture for their flocks.
translation:
  language: te
  text: వారు తమ మందలకు మేత వెదకడానికి గెదోరు ప్రవేశమార్గానికి[a], లోయకు తూర్పు వైపు వరకు[b], వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గెదోరుకు చేరువ మార్గం’; హీబ్రూ పదం ప్రవేశం, చేరువ మార్గం లేదా ప్రవేశించే స్థలాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘లోయకు తూర్పున వరకు’ లేదా ‘లోయ తూర్పు భాగం వరకు’; హీబ్రూ పదబంధం సంక్షిప్తమైన భౌగోళిక వర్ణన.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: వెళ్లారు
  rationale: הלך క్రియ యొక్క వయిక్తోల్ రూపం కథనంలోని తదుపరి చర్యను సూచిస్తుంది; ‘వెళ్లారు’ సహజమైన సూటి అనువాదం.
- source_word: לִמְבוֹא
  choice: ప్రవేశమార్గం
  rationale: מָבוֹא అనేది ప్రవేశం, చేరువ మార్గం లేదా ప్రవేశించే స్థలాన్ని సూచించగలదు; స్థలసంబంధ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: גְדֹר
  choice: గెదోరు
  rationale: ఇది స్థలనామం; అనువదించకుండా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: עַד
  choice: వరకు
  rationale: ఇక్కడ కాలవ్యవధిని కాక స్థల విస్తృతి లేదా గమ్యహద్దును సూచిస్తుంది.
- source_word: לְמִזְרַח הַגָּיְא
  choice: లోయకు తూర్పున
  rationale: సంక్షిప్త భౌగోళిక పదబంధంలోని తూర్పు దిశాసంబంధాన్ని కాపాడుతుంది; ఖచ్చితంగా ‘తూర్పు వైపు’ లేదా ‘తూర్పు భాగం’ అని నిర్ణయించదు.
- source_word: לְבַקֵּשׁ
  choice: వెదకడానికి
  rationale: בקש క్రియారూపం ఉద్దేశాన్ని తెలియజేస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: מִרְעֶה
  choice: మేత
  rationale: పశువులు మేయడానికి అవసరమైన పచ్చిక లేదా మేతస్థలాన్ని సందర్భానుసారంగా సూచిస్తుంది.
- source_word: לְצֹאנָם
  choice: తమ మందలకు
  rationale: צֹאן గొర్రెలు, మేకలు కలిసిన చిన్న పశువుల మందలను సూచించగలదు; ‘మందలు’ జాతిని అనవసరంగా పరిమితం చేయదు.
