  text: Chelub[a], the brother of Shuhah, fathered Mehir; he was the father of Eshton.
translation:
  language: te
  text: షూహా సోదరుడైన కెలూబు మెహీరును కన్నాడు; మెహీరు ఎష్తోనుకు తండ్రి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎష్తోనుకు పూర్వికుడు/స్థాపకుడు.’ వంశావళి జాబితాల్లో ‘తండ్రి’ అనే మాట కొన్నిసార్లు ప్రత్యక్ష జన్మదాతను కాకుండా ఒక వంశానికి లేదా నివాసస్థలానికి మూలపురుషుడిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/כְלוּב
  choice: కెలూబు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం. వాక్యం స్వతంత్ర వంశావళి సమాచారంగా సహజంగా ఉండేందుకు ప్రారంభ సంధికారకాన్ని ప్రత్యేకంగా అనువదించలేదు.
- source_word: אֲחִי שׁוּחָה
  choice: షూహా సోదరుడైన
  rationale: హీబ్రూ సమాసంలోని బంధుత్వ సంబంధాన్ని స్పష్టమైన, సహజమైన ఆధునిక తెలుగులో తెలిపే రూపం.
- source_word: הוֹלִיד
  choice: కన్నాడు
  rationale: వంశావళి సందర్భంలో హిఫీల్ రూపం సంతానాన్ని కనడం లేదా ఉత్పత్తి చేయడాన్ని సూచిస్తుంది; ‘కన్నాడు’ సంక్షిప్తంగా, సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: מְחִיר
  choice: మెహీరు
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: הוּא
  choice: మెహీరు
  rationale: హీబ్రూలోని స్వతంత్ర సర్వనామం సమీప పూర్వపదమైన మెహీరును తిరిగి సూచిస్తుంది. తెలుగులో సందిగ్ధత రాకుండా పేరును పునరుక్తి చేశాం.
- source_word: אֲבִי
  choice: తండ్రి
  rationale: మూలంలోని సాధారణ పితృసంబంధ పదాన్ని నేరుగా నిలిపాం; వంశావళుల్లో ఉండగల విస్తృత ‘పూర్వికుడు/స్థాపకుడు’ భావాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: אֶשְׁתּוֹן
  choice: ఎష్తోను
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
