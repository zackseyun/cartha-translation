translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలిని ఉపయోగించాం. స్థల నామాలను అనువదించకుండా హీబ్రూ రూపాలకు సమీపంగా లిప్యంతరీకరించాం; పదంలోని భావ విస్తృతిని పాదటిప్పణిలో నిలిపాం.
