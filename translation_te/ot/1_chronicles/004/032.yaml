source:
  edition: WLC
  text: וְ/חַצְרֵי/הֶם֙ עֵיטָ֣ם וָ/עַ֔יִן רִמּ֥וֹן וְ/תֹ֖כֶן וְ/עָשָׁ֑ן עָרִ֖ים חָמֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/032.yaml
  text: And their settlements were Etam[a], Ain, Rimmon, Tochen, and Ashan—five cities.
translation:
  language: te
  text: వారి నివాస స్థలాలు[a] ఏతాము, అయీను, రిమ్మోను, తోకెను, ఆషాను—మొత్తం ఐదు పట్టణాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారి గ్రామాలు.” హీబ్రూ పదం చిన్న నివాస ప్రాంతాలను లేదా చుట్టూ కంచెగల నివాసాలను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַצְרֵיהֶם
  choice: వారి నివాస స్థలాలు
  rationale: חָצֵר అనే పదం గ్రామం, చిన్న నివాస ప్రాంతం, లేదా చుట్టూ కంచెగల నివాసాన్ని సూచించగలదు. ఈ భౌగోళిక జాబితాలో ‘నివాస స్థలాలు’ అనే విస్తృతమైన ఆధునిక తెలుగు పదబంధం భావాన్ని అనవసరంగా కుదించకుండా తెలియజేస్తుంది.
- source_word: עֵיטָם
  choice: ఏతాము
  rationale: ఇది స్థల నామం; అనువదించకుండా హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడింది.
- source_word: עַיִן
  choice: అయీను
  rationale: సాధారణ నామవాచకంగా దీనికి ‘కన్ను’ లేదా ‘ఊట’ అనే అర్థాలు ఉండవచ్చు; అయితే ఇక్కడ పట్టణాల జాబితాలో స్థల నామంగా ఉంది, కాబట్టి లిప్యంతరీకరించబడింది.
- source_word: רִמּוֹן
  choice: రిమ్మోను
  rationale: ఈ పదానికి సాధారణంగా ‘దానిమ్మ’ అనే అర్థం ఉన్నప్పటికీ, ఇక్కడ స్థల నామంగా వాడబడింది; అందువల్ల లిప్యంతరీకరించబడింది.
- source_word: תֹכֶן
  choice: తోకెను
  rationale: ఇది స్థల నామం; హీబ్రూ రూపాన్ని అనుసరించి తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: עָשָׁן
  choice: ఆషాను
  rationale: ఇది స్థల నామం; అనువదించకుండా లిప్యంతరీకరించబడింది.
- source_word: עָרִים חָמֵשׁ
  choice: మొత్తం ఐదు పట్టణాలు
  rationale: עִיר అనే పదానికి ‘పట్టణం’ లేదా ‘నగరం’ అనే అర్థాలు ఉన్నాయి. జాబితాలోని ప్రదేశాలను లెక్కించే ఈ సందర్భంలో ‘పట్టణాలు’ సహజంగా ఉంటుంది; ‘మొత్తం’ అనే పదం హీబ్రూ సంగ్రహ వాక్యపు భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
