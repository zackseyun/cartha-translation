  yaml_path: translation/ot/1_chronicles/004/013.yaml
  text: 'The sons of Kenaz: Othniel and Seraiah[a]. And the sons of Othniel: Hathath.'
translation:
  language: te
  text: 'కెనజు కుమారులు: ఒత్నీయేలు, శెరాయా. ఒత్నీయేలు కుమారులు: హతతు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי קְנַז
  choice: కెనజు కుమారులు
  rationale: వంశావళి సందర్భంలో בְּנֵי అనే నిర్మాణ బహువచనానికి సహజమైన, పారదర్శకమైన అనువాదం. ఆరంభ וּ־ను తెలుగులో ప్రత్యేకంగా చూపకుండా కొత్త వంశావళి పంక్తిగా అందించడం సహజం.
- source_word: עָתְנִיאֵל
  choice: ఒత్నీయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు లిపిలో ధ్వన్యనుకరణగా ఇచ్చాం.
- source_word: וּשְׂרָיָה
  choice: శెరాయా
  rationale: ఉపసర్గ וּ־ను జాబితి విరామంతో సహజంగా సూచిస్తూ, שְׂרָיָה అనే పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וּבְנֵי עָתְנִיאֵל
  choice: ఒత్నీయేలు కుమారుడు
  rationale: మూలంలో ‘కుమారులు’ అనే బహువచనం ఉన్నప్పటికీ ఒక్క పేరు మాత్రమే అనుసరిస్తుంది; సహజ తెలుగులో ఏకవచనం వాడి సూచించిన వ్యక్తిని స్పష్టంగా అందించాం.
- source_word: חֲתַת
  choice: హతతు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ఉచ్చారణకు అనుకూలంగా ధ్వన్యనుకరణ చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త వంశావళి శైలిని నిలిపాం. పేర్లకు సాధారణ తెలుగు బైబిలు ధ్వన్యనుకరణ సంప్రదాయాన్ని అనుసరించాం; వచనంలో వివరణాత్మక పదాలు చేర్చలేదు.
