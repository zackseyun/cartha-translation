source:
  edition: WLC
  text: וַ/תֵּ֨לֶד ל֤/וֹ נַעֲרָה֙ אֶת אֲחֻזָּ֣ם וְ/אֶת חֵ֔פֶר וְ/אֶת תֵּימְנִ֖י וְ/אֶת הָ/אֲחַשְׁתָּרִ֑י אֵ֖לֶּה בְּנֵ֥י נַעֲרָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/006.yaml
  text: Naarah bore to him Ahuzzam[a], Hepher, Temeni, and Haahashtari[b]. These were the sons of Naarah.
translation:
  language: te
  text: నయరా అతనికి అహుజ్జాము, హెఫెరు, తేమెనీ[a], హాఅహష్తారీ[b]లను కనింది. వీరు నయరా కుమారులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: తేమెనీ అనే రూపాన్ని ‘తేమెనీయుడు’ లేదా ‘దక్షిణాది వ్యక్తి’ వంటి విశేషణార్థక రూపంగా కూడా అర్థం చేసుకోవచ్చు; అయితే ఈ వంశావళిలో దాన్ని వ్యక్తినామంగా లిప్యంతరీకరించాం.
    reason: lexical_alternative
  - marker: b
    text: హాఅహష్తారీ అనే పేరును ‘అహష్తారీ’ అని కూడా లిప్యంతరీకరించవచ్చు. హీబ్రూ రూపంలో ముందున్న నిర్దేశక ఉపపదం పేరులోనే స్థిరమైన భాగమై ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: కనింది
  rationale: యలద్ క్రియ యొక్క ఈ రూపం వంశావళిలో జననాన్ని తెలియజేస్తుంది; తెలుగులో మాతృకర్తను స్పష్టంగా ఉంచే సహజమైన, సంక్షిప్త ప్రయోగం.
- source_word: לוֹ
  choice: అతనికి
  rationale: ל ఉపసర్గతో కూడిన సర్వనామ ప్రత్యయం ఈ వంశావళి సూత్రంలో పురుష తల్లిదండ్రిని సూచిస్తుంది; సందర్భం చెప్పిన దానికంటే సంబంధాన్ని అధికంగా నిర్ధారించకుండా మూల నిర్మాణాన్ని నిలుపుతుంది.
- source_word: נַעֲרָה
  choice: నయరా
  rationale: ఇది వ్యక్తినామం; అర్థానువాదం చేయకుండా తెలుగులో లిప్యంతరీకరించబడింది. వచనం చివర కూడా అదే రూపం నిలుపబడింది.
- source_word: אֶת ... וְאֶת ...
  choice: తెలుగు వాక్యక్రమం, జాబితా మరియు కర్మ బహువచన ప్రత్యయం ద్వారా సూచించబడింది
  rationale: పునరావృతమైన אֶת ప్రతి పేరును ప్రత్యక్ష కర్మగా గుర్తిస్తుంది; తెలుగులో ప్రత్యేక సమానార్థక అవ్యయం అవసరం లేక, చివరి పేరుకు జోడించిన ‘లను’ మొత్తం జాబితాకు వర్తిస్తుంది.
- source_word: אֲחֻזָּם
  choice: అహుజ్జాము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ధ్వని-లిపి పద్ధతికి అనుగుణంగా లిప్యంతరీకరించి, మధ్య వ్యంజన ద్విత్వాన్ని నిలిపింది.
- source_word: חֵפֶר
  choice: హెపెరు
  rationale: హీబ్రూ వ్యక్తినామానికి సహజమైన తెలుగు లిప్యంతరీకరణ.
- source_word: תֵּימְנִי
  choice: తేమెనీ
  rationale: రూపం విశేషణార్థకంగా అర్థమయ్యే అవకాశం ఉన్నా, ఈ వంశావళి జాబితాలో వ్యక్తినామంగా పనిచేస్తున్నందున లిప్యంతరీకరించబడింది.
- source_word: הָאֲחַשְׁתָּרִי
  choice: హాహష్తారీ
  rationale: హీబ్రూ రూపంలోని ముందు నిర్దేశక ఉపపదాన్ని పేరులో స్థిరమైన భాగంగా భావించి లిప్యంతరీకరణలో ‘హా-’గా నిలిపింది; జాతి లేదా వర్ణనాత్మక బిరుదుగా మార్చలేదు.
- source_word: אֵלֶּה
  choice: వీరు
  rationale: ముందు పేర్కొన్న వ్యక్తులను సూచించే సహజమైన తెలుగు పురుష-మానవ బహువచన సూచక సర్వనామం.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: వంశావళి సందర్భంలో בנים పురుష సంతానాన్ని సూచిస్తుంది; లింగనిర్దిష్టతను సాధారణ ‘పిల్లలు’గా సడలించలేదు.
