translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ఈ పదబంధం ముందరి వచనంలోని నివాసక్రియపై ఆధారపడుతున్నందున తెలుగులో వాక్యసంపూర్ణత కోసం ‘నివసించారు’ను పునరుక్తం చేశాం. స్థలనామాల జాబితాలో సంయోజకాలను కామాలతో సహజీకరించాం.
