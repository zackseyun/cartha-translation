  text: and in Bilhah[a], and in Ezem, and in Tolad.
translation:
  language: te
  text: బిల్హాలోను[a], ఏజెములోను, తోలాదులోను నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బిల్హా వద్ద, ఏజెము వద్ద, తోలాదు వద్ద.’ పట్టణాల జాబితాలో హీబ్రూ בְ అనే ఉపసర్గను ‘లో’ లేదా ‘వద్ద’ అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/בִלְהָה
  choice: బిల్హాలో
  rationale: וּ/בְ అనే సంయోగం ఈ నివాసస్థలాల జాబితాలో ముందున్న క్రియను కొనసాగిస్తూ ‘బిల్హాలో’ అనే భావాన్ని ఇస్తుంది. בִלְהָה స్థలనామం కాబట్టి ‘బిల్హా’గా లిప్యంతరీకరించబడింది.
- source_word: וּ/בְ/עֶצֶם
  choice: ఏజెములో
  rationale: עֶצֶם ఇక్కడ స్థలనామం. హీబ్రూ ఉచ్చారణలోని ఘర్షణ ధ్వనిని సాధారణ తెలుగు పాఠకునికి సహజంగా ఉండేలా ‘ఏజెము’గా లిప్యంతరీకరించి, בְ ను ‘లో’తో వ్యక్తం చేశాం.
- source_word: וּ/בְ/תוֹלָד
  choice: తోలాదులో
  rationale: תוֹלָד స్థలనామం కాబట్టి ‘తోలాదు’గా లిప్యంతరీకరించబడింది; בְ అనే స్థలసూచక ఉపసర్గను ‘లో’గా అనువదించాం.
- source_word: וּ
  choice: జాబితా కొనసాగింపుగా విరామచిహ్నాలు
  rationale: ప్రతి పేరుకు ముందున్న וּ జాబితాను కొనసాగిస్తుంది. తెలుగులో ప్రతి అంశం ముందు ‘మరియు’ అనడం అసహజంగా ఉండేందున కామాలతో సహజంగా వ్యక్తం చేశాం.
