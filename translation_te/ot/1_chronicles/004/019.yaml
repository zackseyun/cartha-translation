id: 1CH.4.19
reference: 1 Chronicles 4:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵי֙ אֵ֣שֶׁת הֽוֹדִיָּ֔ה אֲח֣וֹת נַ֔חַם אֲבִ֥י קְעִילָ֖ה הַ/גַּרְמִ֑י וְ/אֶשְׁתְּמֹ֖עַ הַ/מַּעֲכָתִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/019.yaml
  text: And the sons of the wife of Hodiah[a], the sister of Naham[b], were the father of Keilah the Garmite and Eshtemoa the Maacathite.
translation:
  language: te
  text: హోదీయా భార్యయైన నహాము సోదరి కుమారులు గర్మీయుడైన కెయీలా, మయాకాతీయుడైన ఎష్టెమోవాలకు తండ్రి[a] అయ్యారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: వంశావళుల్లో ‘తండ్రి’ అనే హీబ్రూ పదం జన్మనిచ్చిన తండ్రినే కాక, మూలపురుషుడు, స్థాపకుడు లేదా వంశనాయకుడు అనే అర్థాన్నీ ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో ‘కుమారులు’ అనే బహువచనం తరువాత ‘తండ్రి’ అనే ఏకవచనం ఉంది. కాబట్టి ఇది సాధారణ తండ్రి-కొడుకు వరుసకన్నా సంక్షిప్తంగా చెప్పిన వంశ లేదా కుల సంబంధం కావచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: వంశావళి సందర్భంలో בנים సాధారణంగా ‘కుమారులు’ అని అర్థం; ‘వారసులు’ అనే విస్తృత భావం సాధ్యమైనా, మూలంలోని ప్రత్యక్ష పదాన్ని నిలుపుకున్నాం.
- source_word: אֵשֶׁת הוֹדִיָּה
  choice: హోదీయా భార్యయైన
  rationale: నిర్మాణ సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, ఆ స్త్రీ పేరు చెప్పబడలేదనే విషయాన్ని అలాగే ఉంచుతుంది.
- source_word: אֲחוֹת נַחַם
  choice: నహాము సోదరి
  rationale: ఈ పదబంధం హోదీయా భార్యను మరింత స్పష్టంగా గుర్తిస్తుంది; ‘నహాము సోదరి’ మూల నిర్మాణానికి దగ్గరగా, తెలుగులో సహజంగా ఉంది.
- source_word: אֲבִי
  choice: తండ్రి
  rationale: వంశావళుల్లో ఈ పదం జన్మనిచ్చిన తండ్రినే కాక మూలపురుషుడు, స్థాపకుడు లేదా వంశనాయకుడిని కూడా సూచించగలదు. ప్రధాన పాఠంలో మూలంలోని రూపాన్ని నిలిపి, విస్తృత భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: קְעִילָה הַגַּרְמִי
  choice: గర్మీయుడైన కెయీలా
  rationale: వ్యక్తి లేదా వంశానికి సంబంధించిన పేరును లిప్యంతరీకరించి, הַגַּרְמִי అనే వంశ/జాతి విశేషణాన్ని ‘గర్మీయుడు’గా ఇచ్చాం; స్థలమా వ్యక్తా అన్నది నిర్ణయించలేదు.
- source_word: אֶשְׁתְּמֹעַ הַמַּעֲכָתִי
  choice: మయకాతీయుడైన ఎష్టెమోవా
  rationale: పేరును లిప్యంతరీకరించి, הַמַּעֲכָתִי అనే వంశ/జాతి గుర్తింపును తెలుగులో విశేషణ రూపంగా ఇచ్చాం.
theological_decisions:
- issue: బహువచన కర్త ‘కుమారులు’ తరువాత ఏకవచన ‘తండ్రి’ రావడం
  choice: మూలంలోని అసాధారణ సంఖ్యా అసమతౌల్యాన్ని ‘కుమారులు ... తండ్రి అయ్యారు’గా నిలిపాం.
  alternative: ‘మూలపురుషులయ్యారు’ లేదా ‘వారి వంశం నుంచి వచ్చారు’ అని సవరించడం.
  rationale: హీబ్రూ వాక్యం సంక్షిప్త వంశ/కుల సంబంధాన్ని సూచించవచ్చు; దానిని సులభమైన జీవశాస్త్రీయ తండ్రి-కొడుకు వరుసగా మార్చకుండా అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, చదవడానికి సులభమైన వంశావళి శైలిని వాడాం. పేర్లను మూల హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం; వాక్యంలోని నిజమైన వ్యాకరణ అస్పష్టతను పాదసూచికలతో నిలిపాం.
