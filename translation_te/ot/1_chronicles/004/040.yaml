- from: వారు సారవంతమైన మంచి పచ్చికబయలును కనుగొన్నారు. ఆ ప్రదేశం విశాలంగా, నిశ్శబ్దంగా, ప్రశాంతంగా ఉంది; ఎందుకంటే పూర్వం అక్కడ నివసించినవారు హాము వంశానికి చెందినవారు.[a]
