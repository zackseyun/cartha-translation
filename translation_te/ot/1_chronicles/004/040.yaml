    text: అక్షరార్థంగా, “హాము నుండి (వచ్చినవారు).”
    reason: lexical_alternative
  revision_rationale: This revision replaces an acoustically focused term with wording that reflects the land's undisturbed condition, while retaining the paired idea of peace. It also makes the lexical footnote transparent about the interpretive word supplied for natural Telugu.
