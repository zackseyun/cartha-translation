  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַֽ/יִּמְצְא֤וּ מִרְעֶה֙ שָׁמֵ֣ן וָ/ט֔וֹב וְ/הָ/אָ֨רֶץ֙ רַחֲבַ֣ת יָדַ֔יִם וְ/שֹׁקֶ֖טֶת וּ/שְׁלֵוָ֑ה כִּ֣י מִן חָ֔ם הַ/יֹּשְׁבִ֥ים שָׁ֖ם לְ/פָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/040.yaml
  text: And they found rich and good pasture[a], and the land was broad, quiet, and peaceful, for those from Ham who had lived there formerly were there before.
translation:
  language: te
  text: వారు సారవంతమైన మంచి పచ్చికబయలును కనుగొన్నారు. ఆ దేశం విశాలమై, కలతలేక, ప్రశాంతంగా ఉంది; ఎందుకంటే పూర్వం అక్కడ నివసించినవారు హాము వంశానికి చెందినవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “హాము నుండి (వచ్చినవారు).”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִרְעֶה
  choice: పచ్చికబయలు
  rationale: మందలు మేయడానికి అనువైన ప్రదేశాన్ని సూచించే నామవాచకం; ఆధునిక తెలుగులో సహజంగా, సందర్భానికి స్పష్టంగా ఉంది.
- source_word: שָׁמֵן
  choice: సారవంతమైన
  rationale: అక్షరార్థంగా ‘కొవ్వైనది’; పచ్చిక లేదా భూమి సందర్భంలో సమృద్ధిగా పెరిగే సారాన్ని సూచిస్తుంది.
- source_word: טוֹב
  choice: మంచి
  rationale: మూలంలోని సాధారణ సానుకూల విలువను సరళంగా నిలుపుతుంది.
- source_word: רַחֲבַת יָדַיִם
  choice: విశాలంగా
  rationale: అక్షరార్థంగా ‘చేతుల మేరకు వెడల్పైనది’ అనే హీబ్రూ నుడికారానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: שֹׁקֶטֶת
  choice: నిశ్శబ్దంగా
  rationale: కలత లేకుండా, ప్రశాంత స్థితిలో ఉండడాన్ని సూచిస్తుంది; తరువాతి పదంతో ఉన్న భావసామీప్యాన్ని పూర్తిగా కలిపివేయదు.
- source_word: שְׁלֵוָה
  choice: ప్రశాంతంగా
  rationale: నెమ్మది, భద్రత, కలతలేని స్థితి అనే భావపరిధిలో ఇక్కడ సందర్భోచితమైన ఎంపిక.
- source_word: כִּי מִן חָם הַיֹּשְׁבִים שָׁם לְפָנִים
  choice: ఎందుకంటే పూర్వం అక్కడ నివసించినవారు హాము వంశానికి చెందినవారు
  rationale: హీబ్రూ పదక్రమాన్ని కఠినంగా అనుకరించకుండా, పూర్వ నివాసులు హాముతో వంశసంబంధం కలిగినవారని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: חָם
  choice: హాము
  rationale: తెలుగు బైబిలు పేర్లలో స్థిరపడిన రూపాన్ని అనుసరించిన వ్యక్తినామం.
theological_decisions:
- issue: מִן חָם లోని వంశ/జాతి సంబంధం
  choice: హాము వంశానికి చెందినవారు
  alternative: హాము నుండి వచ్చినవారు
  rationale: మూలంలో ‘సంతానం’ అనే నామవాచకం లేకపోయినా, מן + వ్యక్తినామం ఇక్కడ వంశ లేదా జాతి మూలాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన అర్థాన్ని ఇచ్చి, మరింత అక్షరానుసారమైన రూపాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళమైనదిగానూ, వాక్య గౌరవాన్ని నిలుపుకునే విధంగానూ రూపొందించబడింది. భూమిని సూచించే హీబ్రూ స్త్రీలింగ విశేషణాలను తెలుగులో ‘ఆ ప్రదేశం ... ఉంది’ అనే సహజ నిర్మాణంతో అందించాం.
