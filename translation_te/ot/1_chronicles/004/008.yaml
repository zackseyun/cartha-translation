source:
  edition: WLC
  text: וְ/ק֣וֹץ הוֹלִ֔יד אֶת עָנ֖וּב וְ/אֶת הַ/צֹּבֵבָ֑ה וּ/מִשְׁפְּח֥וֹת אֲחַרְחֵ֖ל בֶּן הָרֽוּם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/008.yaml
  text: Koz fathered Anub[a], Hazzobebah[b], and the families of Aharhel son of Harum.
translation:
  language: te
  text: కోజు అనూబుకు, హజ్జోబేబాకు[a], హారూము కుమారుడైన అహర్హేలు వంశాలకు[b] తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘జోబేబా’; హీబ్రూ పేరుకు ముందున్న నిర్దేశక ఉపసర్గను లిప్యంతరీకరణలో చూపకపోతే ఈ రూపం వస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘వంశాలు’ అనే మాటను ఈ వంశావళి సందర్భంలో ‘కుటుంబ వర్గాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹץ
  choice: కోజు
  rationale: మసొరేటిక్ హల్లుల రూపాన్ని అనుసరించి వ్యక్తి పేరును తెలుగులో సహజంగా లిప్యంతరీకరించాం; ఇక్కడ నిర్దేశక ఉపసర్గ లేనందున ‘హక్కోజు’ అని చేయలేదు.
- source_word: הוֹלִ֔יד
  choice: కన్నాడు
  rationale: వంశావళి సందర్భంలో హిఫిల్ రూపం సంతానోత్పత్తి చేయడం లేదా వంశానికి మూలమవడం అనే భావాన్ని ఇస్తుంది. ‘కన్నాడు’ సంక్షిప్తంగా, ఆధునికంగా ఉండి మూలవాక్యంలోని నేరమైన వంశావళి సంబంధాన్ని నిలుపుతుంది.
- source_word: עָנ֖וּב
  choice: అనూబు
  rationale: మసొరేటిక్ ఉచ్చారణకు అనుగుణమైన వ్యక్తి పేరు లిప్యంతరీకరణ.
- source_word: הַ/צֹּבֵבָ֑ה
  choice: హజ్జోబేబా
  rationale: హీబ్రూ రూపంలోని prefixed article ధ్వనిని, దాని తరువాతి వ్యంజన ద్విత్వాన్ని పేరులో ప్రతిబింబిస్తూ లిప్యంతరీకరించాం. ఆ ఉపసర్గను పేరులో భాగంగా తీసుకోకపోతే ‘జోబేబా’ కూడా సాధ్యం; దాన్ని పాదసూచికలో ఉంచాం.
- source_word: וּ/מִשְׁפְּח֥וֹת
  choice: వంశాలవారిని
  rationale: వంశావళి జాబితాలో ఈ బహువచన పదం విస్తృత కుటుంబ సమూహాలు లేదా వంశశాఖలను సూచిస్తుంది. ‘వంశాలవారు’ వ్యక్తుల సమూహ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, ‘కన్నాడు’ అనే క్రియతో అనుసంధానమవుతుంది.
- source_word: אֲחַרְחֵ֖ל
  choice: అహర్హేలు
  rationale: మసొరేటిక్ రూపానికి దగ్గరగా చేసిన వ్యక్తి పేరు లిప్యంతరీకరణ.
- source_word: בֶּן
  choice: కుమారుడైన
  rationale: అహర్హేలుకు హారూముతో ఉన్న వంశావళి సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా కలుపుతుంది.
- source_word: הָרֽוּם
  choice: హారూము
  rationale: మసొరేటిక్ స్వరసూచనను అనుసరించిన వ్యక్తి పేరు లిప్యంతరీకరణ; ‘హారాము’ అనే ప్రత్యామ్నాయ రూపాన్ని స్వీకరించలేదు.
