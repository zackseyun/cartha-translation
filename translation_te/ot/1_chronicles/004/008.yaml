  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన గంభీరతతో అనువదించాం. పేర్లకు తెలుగు విభక్తి ప్రయోగం సహజంగా ఉండేందుకు చివర స్వరాలను చేర్చాం. మూలంలోని అసాధారణమైన ‘వంశాలవారిని కన్నాడు’ అనే వంశావళి నిర్మాణాన్ని పూర్తిగా వివరణాత్మకంగా మార్చకుండా సాధ్యమైనంత వరకు నిలిపాం.
