  source_fidelity: హీబ్రూ పాఠంలోని ఏడు వ్యక్తిపేర్ల క్రమం, వాటి ప్రాథమిక లిప్యంతరీకరణ, మరియు జాబితా-సంబంధం అన్నీ సరిగ్గా ప్రతిబింబించబడ్డాయి. יְשִׂימִיאֵל లోని שׂ ను ‘స’గా ఇచ్చినది ప్రత్యేకంగా సరైనది. ప్రతి వావ్‌ను తెలుగులో పునరావృతమైన ‘మరియు’గా కాకుండా కామాలతో చూపడం జాబితా స్వభావానికి తగిన, అర్థాన్ని మార్చని సహజ పరిష్కారం.
