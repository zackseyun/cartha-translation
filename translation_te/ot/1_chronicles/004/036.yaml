  terminology: ఇది పూర్తిగా వ్యక్తిపేర్ల జాబితా. పేర్లు హీబ్రూ ఆధారిత రూపాల్లో స్థిరంగా ఉన్నాయి; ప్రత్యేకమైన వేదాంత పదాలు లేదా వివరణాత్మక పదజాలం లేవు.
