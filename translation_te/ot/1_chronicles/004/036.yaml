source:
  edition: WLC
  text: וְ/אֶלְיוֹעֵינַ֡י וְֽ/יַעֲקֹ֡בָה וִ֠/ישׁוֹחָיָה וַ/עֲשָׂיָ֧ה וַ/עֲדִיאֵ֛ל וִ/ישִׂימִאֵ֖ל וּ/בְנָיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/036.yaml
  text: and Elioenai, and Jaakobah, and Jeshohaiah, and Asaiah, and Adiel, and Jesimiel, and Benaiah.
translation:
  language: te
  text: ఎల్యోయేనై, యాకోబా, యెషోహాయా, అసాయా, అదీయేలు, యెసీమీయేలు, బెనాయా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלְיוֹעֵינַי
  choice: ఎల్యోయేనై
  rationale: వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణ రూపాన్ని ఆధారంగా చేసుకొని తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: יַעֲקֹבָה
  choice: యాకోబా
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపంలోని దీర్ఘ స్వరాన్ని, చివరి అక్షరాన్ని సహజమైన తెలుగు రూపంలో నిలిపింది.
- source_word: יְשׁוֹחָיָה
  choice: యెషోహాయా
  rationale: వ్యక్తి పేరు; ప్రారంభ యోద్‌ను ‘యె’, שׁ ధ్వనిని ‘ష’గా చూపిస్తూ మూలరూపానికి దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: עֲשָׂיָה
  choice: అసాయా
  rationale: వ్యక్తి పేరు; שׂ ధ్వనిని ‘స’గా చూపిస్తూ హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: עֲדִיאֵל
  choice: అదీయేలు
  rationale: వ్యక్తి పేరు; పేరులోని ‘ఏల్’ భాగాన్ని తెలుగులో సాధారణంగా వినిపించే ‘యేలు’ రూపంతో అందించింది.
- source_word: יְשִׂימִיאֵל
  choice: యెసీమీయేలు
  rationale: వ్యక్తి పేరు; హీబ్రూ వ్యంజన, స్వర క్రమాన్ని సాధ్యమైనంత స్పష్టంగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: בְּנָיָה
  choice: బెనాయా
  rationale: వ్యక్తి పేరు; హీబ్రూ మూలరూపాన్ని అనుసరించిన సహజమైన తెలుగు లిప్యంతరీకరణ.
- source_word: וְ / וַ / וִ / וּ prefixed to each name
  choice: కామాలతో అనుసంధానం
  rationale: మూలంలోని వావ్ ప్రతి పేరును జాబితాలో కలుపుతుంది. తెలుగులో ప్రతి పేరుకు ‘మరియు’ పునరావృతం చేయడం అసహజంగా ఉండేందున, జాబితా సంబంధాన్ని కామాలతో సహజంగా వ్యక్తం చేసింది.
