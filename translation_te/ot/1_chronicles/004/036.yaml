translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన, గంభీరమైన శైలి. పేర్లు ఆంగ్ల రూపాల నుంచి కాకుండా హీబ్రూ మూలరూపాల ఆధారంగా లిప్యంతరీకరించబడ్డాయి.
