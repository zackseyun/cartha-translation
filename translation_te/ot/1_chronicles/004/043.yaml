  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יַּכּ֕וּ אֶת שְׁאֵרִ֥ית הַ/פְּלֵטָ֖ה לַ/עֲמָלֵ֑ק וַ/יֵּ֣שְׁבוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/043.yaml
  text: And they struck down the remnant of the survivors of Amalek[b][a], and they lived there to this day.
translation:
  language: te
  text: వారు అమాలేకీయులలో తప్పించుకొని మిగిలినవారిని హతమార్చారు; నేటివరకు అక్కడ నివసించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేటివరకు అక్కడ స్థిరపడ్డారు.” ఈ క్రియ ఒక చోట నివసించడం లేదా అక్కడ స్థిరపడడం అనే రెండు భావాలనూ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: హతమార్చి
  rationale: נכה అనే క్రియ ఇక్కడ సైనిక సందర్భంలో దాడిచేసి పడగొట్టడాన్ని, సంభావ్యంగా చంపడాన్ని సూచిస్తుంది. తెలుగు కథనంలో ‘హతమార్చి’ ఆ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שְׁאֵרִית הַפְּלֵטָה
  choice: తప్పించుకొని మిగిలినవారిని
  rationale: దేవాస్టేషన్ తరువాత తప్పించుకుని మిగిలినవారిని సూచించే దగ్గరార్థాల రెండు హీబ్రూ నామపదాల భావాన్ని ఈ పదబంధం నిలుపుతుంది.
- source_word: לַעֲמָלֵק
  choice: అమాలేకీయుల్లో
  rationale: ‘అమాలేకు’ అనే వ్యక్తినామం ఇక్కడ ఆ పేరుతో గుర్తింపబడిన ప్రజలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘అమాలేకీయులు’ సహజంగా ఉంది.
- source_word: וַיֵּשְׁבוּ
  choice: నివసించారు
  rationale: ישב అంటే కూర్చోవడం, నివసించడం లేదా స్థిరపడడం. ఇక్కడ స్థలంలో కొనసాగి నివసించిన భావానికి ‘నివసించారు’ సరిపోతుంది; ‘స్థిరపడ్డారు’ కూడా సాధ్యమే.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: నేటివరకు
  rationale: హీబ్రూ కథనంలో ‘ఈ దినం వరకు’ అనే కాలవ్యక్తీకరణకు సహజమైన ఆధునిక తెలుగు రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథనశైలి. హీబ్రూలోని שְׁאֵרִית הַפְּלֵטָה అనే దగ్గరార్థాల జోడిని ఒకే పదంగా కుదించకుండా ‘తప్పించుకొని మిగిలినవారు’గా వ్యక్తం చేశాం. ప్రధాన పాఠంలోని [a] గుర్తు నివసించడం/స్థిరపడడం అనే నిజమైన పదార్థ వైవిధ్యాన్ని సూచిస్తుంది.
