  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళి శైలిని నిలుపుతూ, సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది.
