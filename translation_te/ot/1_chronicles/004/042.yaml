source:
  edition: WLC
  text: וּ/מֵ/הֶ֣ם מִן בְּנֵ֣י שִׁמְע֗וֹן הָלְכוּ֙ לְ/הַ֣ר שֵׂעִ֔יר אֲנָשִׁ֖ים חֲמֵ֣שׁ מֵא֑וֹת וּ/פְלַטְיָ֡ה וּ֠/נְעַרְיָה וּ/רְפָיָ֧ה וְ/עֻזִּיאֵ֛ל בְּנֵ֥י יִשְׁעִ֖י בְּ/רֹאשָֽׁ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/042.yaml
  text: And some of them[a], from the sons of Simeon, went to Mount Seir—five hundred men—with Pelatiah, Neariah, Rephaiah, and Uzziel, sons of Ishi, at their head.
translation:
  language: te
  text: షిమ్యోను కుమారులలో కొందరు—ఐదువందల మంది పురుషులు—సేయీరు పర్వతానికి వెళ్లారు; యిషీ కుమారులైన పెలట్యా, నెయర్యా, రెఫాయా, ఉజ్జీయేలు వారికి నాయకులుగా ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వారి శిరస్సున.” హీబ్రూ వాక్యనిర్మాణంలో ఈ మాటలు యిషీ కుమారులైన ఈ నలుగురిని ఐదువందల మందికి నాయకులుగా సూచిస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵהֶם מִן בְּנֵי שִׁמְעוֹן
  choice: షిమ్యోను కుమారులలోని వారిలో కొందరు
  rationale: రెండు వరుస భాగసూచక నిర్మాణాల భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; వంశావళి ప్రధానమైన సందర్భానికి అనుగుణంగా ‘కుమారులు’ అనే రూపాన్ని ఉంచింది.
- source_word: הָלְכוּ לְהַר שֵׂעִיר
  choice: సేయీరు పర్వతానికి వెళ్లారు
  rationale: సాధారణ గమనార్థక క్రియను అదనపు సైనిక భావం చేర్చకుండా అనువదించింది; స్థలనామాన్ని సంప్రదాయ పర్వతనామంగా ఇచ్చింది.
- source_word: אֲנָשִׁים חֲמֵשׁ מֵאוֹת
  choice: ఐదువందల మంది పురుషులు
  rationale: గుంపు సంఖ్యను తెలిపే సరళమైన సమానాధికార నిర్మాణాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: וּפְלַטְיָה וּנְעַרְיָה וּרְפָיָה וְעֻזִּיאֵל
  choice: పెలట్యా, నెయర్యా, రెఫాయా, ఉజ్జీయేలు
  rationale: మసొరేటిక్ స్వరపఠనాన్ని అనుసరించి పేర్లను తెలుగు లిపిలో లిప్యంతరీకరించింది.
- source_word: בְּנֵי יִשְׁעִי
  choice: యిషీ కుమారులు
  rationale: నలుగురు వ్యక్తుల వంశసంబంధ గుర్తింపును నేరుగా నిలుపుతుంది.
- source_word: בְּרֹאשָׁם
  choice: వారికి నాయకులుగా ఉన్నారు
  rationale: అక్షరార్థంగా ‘వారి శిరస్సున’ అనే హీబ్రూ నుడికారానికి తెలుగులో సహజమైన నాయకత్వార్థాన్ని ఇస్తుంది.
