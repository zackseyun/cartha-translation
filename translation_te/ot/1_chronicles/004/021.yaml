source:
  edition: WLC
  text: בְּנֵי֙ שֵׁלָ֣ה בֶן יְהוּדָ֔ה עֵ֚ר אֲבִ֣י לֵכָ֔ה וְ/לַעְדָּ֖ה אֲבִ֣י מָרֵשָׁ֑ה וּ/מִשְׁפְּח֛וֹת בֵּית עֲבֹדַ֥ת הַ/בֻּ֖ץ לְ/בֵ֥ית אַשְׁבֵּֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/021.yaml
  text: 'The sons of Shelah son of Judah: Er the father of Lecah[a], and Laadah the father of Mareshah, and the clans of the house of linen workers of the house of Ashbea.'
translation:
  language: te
  text: 'యూదా కుమారుడైన షేలా కుమారులు: లేకాకు తండ్రైన ఏరు, మారేషాకు తండ్రైన లాదా, అష్బేయా ఇంటివారైన సన్నని నారబట్టల పనివారి వంశాలు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బేత్-అష్బేయాలోని సన్నని నారబట్టల పనివారి వంశాలు.” ఈ హీబ్రూ పదబంధం చాలా సంక్షిప్తంగా ఉంది. ఈ వచనంలో ముందుగా వచ్చిన “తండ్రి” అనే మాటకు “మూలపురుషుడు” లేదా “స్థాపకుడు” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי שֵׁלָה בֶן יְהוּדָה
  choice: యూదా కుమారుడైన షేలా కుమారులు
  rationale: వంశావళి శైలిలోని కుమారత్వ భాషను సహజమైన తెలుగు నిర్మాణంలో యథాతథంగా నిలుపుతుంది.
- source_word: עֵר אֲבִי לֵכָה
  choice: లేఖాకు తండ్రైన ఏరు
  rationale: אֲבִי అనే పదానికి ప్రాథమికమైన ‘తండ్రి’ అర్థాన్ని ఉంచుతూ, స్థలానికి లేదా వంశానికి మూలపురుషుడు/స్థాపకుడు అనే సాధ్యమైన విస్తృత భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: לַעְדָּה אֲבִי מָרֵשָׁה
  choice: మారేషాకు తండ్రైన లాదా
  rationale: పేర్లను మూల హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించి, אֲבִי పదాన్ని ముందటి పదబంధంతో సమానంగా అనువదించింది.
- source_word: מִשְׁפְּחוֹת
  choice: కుటుంబాలు
  rationale: వంశపరమైన విస్తృత కుటుంబ సమూహాలను సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: בֵּית עֲבֹדַת הַבֻּץ
  choice: సన్నని నారబట్టల పనివారి
  rationale: הַבֻּץ అనేది నాజూకైన నారబట్టను సూచిస్తుంది; עֲבֹדַת తో కలిసినప్పుడు ఆ వస్త్రాన్ని తయారుచేసే లేదా దానిపై పనిచేసే వృత్తివారిని సూచించేలా సహజంగా అనువదించింది.
- source_word: לְבֵית אַשְׁבֵּעַ
  choice: అష్బేయా వంశానికి చెందిన
  rationale: సంక్షిప్తమైన హీబ్రూ నిర్మాణంలో בֵּית కుటుంబం, వంశం లేదా గృహసమూహాన్ని సూచించవచ్చు; לְ సంబంధాన్ని తెలుపుతున్నందున ‘వంశానికి చెందిన’ అని ఇచ్చింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన వంశావళి శైలిని పాటించాం. పేర్లను హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం. చివరి సంక్షిప్త పదబంధంలోని కుటుంబ/స్థల సంబంధ అస్పష్టతను ప్రధాన పాఠ్యంలో అతిగా నిర్ధారించకుండా, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
