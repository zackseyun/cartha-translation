  yaml_path: translation/ot/1_chronicles/004/007.yaml
  text: 'And the sons of Helah: Zereth[a], Izhar[b], and Ethnan.'
translation:
  language: te
  text: 'హెలా కుమారులు[a]: సెరెత్, ఇజ్హార్, ఎత్నాన్.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వంశావళుల్లో ‘కుమారులు’ అనే పదం ప్రత్యక్ష కుమారులను మాత్రమే కాకుండా, ఒక కుటుంబ వంశంలోని వారసులను కూడా సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: కుమారులు
  rationale: בְנֵי అనే వంశావళి నిర్మాణానికి సహజమైన తెలుగు రూపం. ఆరంభంలోని ו ఈ జాబితాను ముందరి వాక్యంతో కలుపుతుంది; తెలుగులో వచనాన్ని సహజంగా ఉంచేందుకు దానిని ప్రత్యేకంగా ‘మరియు’ అని పలకలేదు.
- source_word: חֶלְאָה
  choice: హెలా
  rationale: వ్యక్తి పేరును హీబ్రూ స్వరరూపానికి దగ్గరగా, తెలుగులో సులభంగా చదవగల లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: צֶרֶת
  choice: సెరెత్
  rationale: హీబ్రూ צֶרֶת అనే వ్యక్తి పేరుకు ధ్వన్యనుసారమైన తెలుగు లిప్యంతరీకరణ.
- source_word: יצחר
  choice: ఇస్హార్
  rationale: మసొరా పాఠంలోని హల్లులను అనుసరించి పేరును తెలుగులో సహజంగా లిప్యంతరీకరించాం.
- source_word: וְ/אֶתְנָן
  choice: ఎత్నాన్
  rationale: చివరి వ్యక్తి పేరును ధ్వన్యనుసారంగా లిప్యంతరీకరించాం; జాబితాలోని అనుసంధానం తెలుగులో విరామచిహ్నాల ద్వారా స్పష్టమవుతుంది.
theological_decisions:
- issue: ‘కుమారులు’ అనే వంశావళి పదం యొక్క పరిధి
  choice: ప్రధాన పాఠంలో ‘కుమారులు’ అని ఉంచి, విస్తృత వంశార్థాన్ని పాదసూచికలో తెలిపాం.
  alternative: ‘వారసులు’ లేదా ‘వంశస్థులు’
  rationale: హీబ్రూ రూపంలోని లింగం, కుటుంబ సంబంధాన్ని నిలుపుకుంటూనే, అది తప్పనిసరిగా ప్రత్యక్ష కుమారులనే సూచించకపోవచ్చనే అస్పష్టతను పాదసూచికలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలిని పాటించాం. పేర్లను హీబ్రూ పాఠం నుంచి ధ్వన్యనుసారంగా లిప్యంతరీకరించాం; వచనం సహజంగా ఉండేందుకు వాక్యారంభంలోని సంధికారకాన్ని విడిగా అనువదించలేదు.
