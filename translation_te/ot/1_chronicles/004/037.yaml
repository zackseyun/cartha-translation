id: 1CH.4.37
reference: 1 Chronicles 4:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/זִיזָ֨א בֶן שִׁפְעִ֧י בֶן אַלּ֛וֹן בֶּן יְדָיָ֥ה בֶן שִׁמְרִ֖י בֶּן שְׁמַֽעְיָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/037.yaml
  text: and Ziza son of Shiphi[a], son of Allon, son of Jedaiah, son of Shimri, son of Shemaiah.
translation:
  language: te
  text: మరియు షిఫీ కుమారుడైన జీజా, అల్లోను కుమారుడైన షిఫీ, యెదాయా కుమారుడైన అల్లోను, షిమ్రీ కుమారుడైన యెదాయా, షెమయా కుమారుడైన షిమ్రీ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/זִיזָא
  choice: మరియు జీజా
  rationale: וְ వంశావళి జాబితాను కొనసాగించే సంధిగా ‘మరియు’ అని అనువదించబడింది. זִיזָא వ్యక్తిపేరు కావడంతో దాని హీబ్రూ ఉచ్చారణకు దగ్గరగా ‘జీజా’ అని లిప్యంతరీకరించబడింది.
- source_word: בֶן
  choice: కుమారుడు
  rationale: వంశావళిలోని ప్రతి בֶן ముందున్న వ్యక్తికి తరువాత పేర్కొన్న వ్యక్తితో తండ్రీకొడుకుల సంబంధాన్ని సూచిస్తుంది. తెలుగులో సంబంధాలు సందిగ్ధంగా కాకుండా ఉండేందుకు ప్రతి తరంలో పేరును మళ్లీ పేర్కొని ‘కుమారుడు’ అనే నిర్మాణాన్ని నిలిపాము.
- source_word: שִׁפְעִי
  choice: షిఫీ
  rationale: వ్యక్తిపేరును అనువదించకుండా, హీబ్రూ వ్యంజనాలు మరియు చివరి దీర్ఘ ī ధ్వనికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: אַלּוֹן
  choice: అల్లోను
  rationale: ఇది ఈ సందర్భంలో వ్యక్తిపేరు; సాధారణ నామవాచకంగా భావించి అర్థానువాదం చేయకుండా, మధ్య వ్యంజన ద్విత్వాన్ని ప్రతిబింబించేలా లిప్యంతరీకరించాం.
- source_word: יְדָיָה
  choice: యెదాయా
  rationale: హీబ్రూ వ్యక్తిపేరును తెలుగులో సహజంగా పలికే విధంగా, దాని ధ్వని నిర్మాణాన్ని సాధ్యమైనంతగా నిలిపి లిప్యంతరీకరించాం.
- source_word: שִׁמְרִי
  choice: షిమ్రీ
  rationale: హీబ్రూ שׁ ధ్వనిని ‘ష’తో, చివరి ī ధ్వనిని ‘ఈ’తో ప్రతిబింబించే లిప్యంతరీకరణ.
- source_word: שְׁמַעְיָה
  choice: షెమయా
  rationale: వ్యక్తిపేరును దాని హీబ్రూ ధ్వనులకు దగ్గరగా, ఆధునిక తెలుగు పాఠకులు సులభంగా చదివే రూపంలో లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వంశావళి శైలి వాడబడింది. హీబ్రూ మూలంలోని పేర్ల క్రమాన్ని నిలిపి, వరుసగా వచ్చిన ‘కుమారుడు’ సంబంధాలు తెలుగులో తప్పుగా ఒకే వ్యక్తికి వర్తించకుండా ప్రతి తరంలోని పేరును స్పష్టంగా పునరుక్తి చేశాం. ఆంగ్లంలోని ‘Zizah’ ప్రత్యామ్నాయం ఆంగ్ల లిప్యంతరీకరణ సంప్రదాయానికి మాత్రమే సంబంధించినది; హీబ్రూ పేరు హేతో కాక అలెఫ్‌తో ముగుస్తుంది కాబట్టి తెలుగులో ప్రత్యేక పాదసూచిక అవసరం లేదు.
