  terminology: The transliterated names are appropriate and consistent with the Hebrew. “కుమారుడైన” is a natural, precise rendering of the genealogical בן relation in this syntax. No footnote is needed; the English Zizah/Ziza note concerns English spelling conventions, not a source-text ambiguity requiring a Telugu note.
