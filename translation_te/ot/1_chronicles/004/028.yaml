  text: They lived in Beer-sheba[a], Moladah[b], and Hazar-shual.
translation:
  language: te
  text: వారు బెయేర్షెబా, మోలాదా, హజరు-షూవాలు అనే స్థలాల్లో నివసించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: నివసించారు
  rationale: ישׁב అనే క్రియ యొక్క బహువచన రూపం ఇక్కడ ఆయా స్థలాల్లో నివాసాన్ని సూచిస్తుంది. ‘నివసించారు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంది; ‘స్థిరపడ్డారు’ అనడం మొదటిసారి అక్కడ కాపురం ఏర్పరచుకున్నారనే అదనపు భావాన్ని కలిగించవచ్చు.
- source_word: בִּבְאֵר שֶׁבַע
  choice: బెయేరు-షెబలో
  rationale: స్థలనామాన్ని అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం. స్థలాన్ని సూచించేందుకు తెలుగు విభక్తి ‘లో’ జోడించాం.
- source_word: וּמוֹלָדָה
  choice: మోలాదాలో
  rationale: ఇది స్థలనామం కాబట్టి హీబ్రూ స్వరరూపానికి దగ్గరగా లిప్యంతరీకరించి, సందర్భానికి అనుగుణంగా ‘లో’ విభక్తిని జోడించాం.
- source_word: וַחֲצַר שׁוּעָל
  choice: హసరు-షూవాలులో
  rationale: రెండు భాగాలున్న స్థలనామాన్ని మసోరా స్వరసూచనలకు దగ్గరగా లిప్యంతరీకరించాం. ח అక్షరానికి సాధారణ పాఠకులకు పలకడానికి అనుకూలమైన ‘హ’, צ అక్షరానికి ‘స’ వాడాం; ‘లో’ విభక్తి నివాసస్థలాన్ని సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన జనావాసాల జాబితా శైలిని నిలిపాం. స్థలనామాలను అనువదించకుండా హీబ్రూ ఆధారంగా లిప్యంతరీకరించాం; ప్రతి పేరుకు ‘లో’ విభక్తిని జోడించడం ద్వారా తెలుగు వాక్యం సహజంగా ఉండేలా చేశాం. ‘వారు’ ఎవరనే విషయాన్ని ఈ వచనం స్వయంగా చెప్పనందున మూలంలోని సూచనాత్మక అస్పష్టతను అలాగే ఉంచాం.
