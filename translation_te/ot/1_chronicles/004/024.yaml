  text: בְּנֵ֖י שִׁמְע֑וֹן נְמוּאֵ֣ל וְ/יָמִ֔ין יָרִ֖יב זֶ֥רַח שָׁאֽוּל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/024.yaml
  text: 'The sons of Simeon: Nemuel[a], Jamin, Jarib, Zerah[c][b], and Shaul.'
translation:
  language: te
  text: 'షిమ్యోను కుమారులు: నెమూయేలు[a], యామీను, యారీబు, జెరహు[b], షావూలు[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఆదికాండము 46:10లోని సమాంతర వంశావళిలో ఈ పేరు ‘యెమూయేలు’ అనే రూపంలో ఉంది; ఇక్కడి హెబ్రీ పాఠంలో ‘నెమూయేలు’ అని ఉంది.
    reason: alternative_reading
  - marker: b
    text: ఆదికాండము 46:10; నిర్గమకాండము 6:15లోని సమాంతర వంశావళుల్లో ఇతని పేరు ‘జోహరు’ అనే రూపంలో ఉంది.
    reason: textual_variant
  - marker: c
    text: ఈ పేరుకు హెబ్రీ లిప్యంతరీకరణ రూపం ‘షావూల్’; కొన్ని తెలుగు సంప్రదాయాల్లో దీనిని ‘సౌలు’ అని కూడా రాస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: ఇది ‘కుమారులు’ అనే పదం యొక్క బహువచన నిర్మాణ రూపం; ఇక్కడ వెంటనే వ్యక్తుల పేర్లు ఇవ్వబడుతున్నందున ‘సంతతివారు’ కంటే ‘కుమారులు’ మరింత ప్రత్యక్షమైనది.
- source_word: שִׁמְעוֹן
  choice: షిమ్యోను
  rationale: హెబ్రీ వ్యక్తినామాన్ని ఆధునిక తెలుగు లిపిలో ధ్వన్యనుసారంగా ఇచ్చాం.
- source_word: נְמוּאֵל
  choice: నెమూయేలు
  rationale: ఈ వచనంలోని హెబ్రీ రూపాన్ని అనుసరించిన లిప్యంతరీకరణ; సమాంతర వంశావళిలోని యెమూయేలు అనే రూపాన్ని ప్రధాన పాఠ్యంలోకి మార్చలేదు.
- source_word: וְיָמִין
  choice: యామీను
  rationale: వ్యక్తినామాన్ని హెబ్రీ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం. జాబితాను తెలుగులో సహజంగా విరామచిహ్నాలతో అమర్చినందున ఇక్కడి וְను ప్రత్యేకంగా ‘మరియు’ అని అనువదించలేదు.
- source_word: יָרִיב
  choice: యారీబు
  rationale: పేరుకు ఉండగల పదార్థాన్ని అనువదించకుండా వ్యక్తినామంగా ధ్వన్యనుసారంగా ఇచ్చాం.
- source_word: זֶרַח
  choice: జెరహు
  rationale: ఈ వచనంలోని זֶרַח రూపాన్ని అనుసరించాం; సమాంతర వంశావళుల్లో కనిపించే జోహరు అనే రూపాన్ని పాఠ్యంలో కలపకుండా పాదసూచికలో ఉంచాం.
- source_word: שָׁאוּל
  choice: షావూలు
  rationale: హెబ్రీ పేరును దాని ధ్వనికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం; సంప్రదాయంగా కనిపించే ‘సౌలు’ రూపాన్ని ప్రధాన పాఠ్యంలో పెట్టలేదు.
