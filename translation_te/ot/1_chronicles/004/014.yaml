source:
  edition: WLC
  text: וּ/מְעוֹנֹתַ֖י הוֹלִ֣יד אֶת עָפְרָ֑ה וּ/שְׂרָיָ֗ה הוֹלִ֤יד אֶת יוֹאָב֙ אֲבִי֙ גֵּ֣יא חֲרָשִׁ֔ים כִּ֥י חֲרָשִׁ֖ים הָיֽוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/014.yaml
  text: Meonothai fathered Ophrah[a], and Seraiah fathered Joab, the father of Ge-harashim[b], for they were craftsmen.
translation:
  language: te
  text: మెయోనోతై ఒఫ్రాకు తండ్రి అయ్యాడు. శెరాయా యోవాబుకు తండ్రి అయ్యాడు. యోవాబు గే-హరాషీముకు[a] తండ్రి[b]; ఎందుకంటే వారు శిల్పులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గే-హరాషీము’ అనే పేరుకు బహుశా ‘శిల్పుల లోయ’ అని అర్థం. హీబ్రూ పాఠ్యం దీన్ని స్థలనామంగా ఉంచి, తరువాతి మాటల్లో ఆ పేరును వివరిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘గే-హరాషీము స్థాపకుడు’ లేదా ‘అక్కడి ప్రజల మూలపురుషుడు.’ వంశావళి సందర్భాల్లో ‘తండ్రి’ అనే మాట స్థాపకుణ్ణి లేదా ఒక వంశపు ప్రధాన పూర్వికుణ్ణి కూడా సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: מְעוֹנֹתַי
  choice: మెయోనోతై
  rationale: వ్యక్తి పేరును ఆధునిక తెలుగు లిపిలో మూల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: הוֹלִיד
  choice: కన్నాడు
  rationale: వంశావళి సందర్భంలో హిఫిల్ రూపం సంతాన సంబంధాన్ని సూచిస్తుంది. ‘కన్నాడు’ సంక్షిప్తంగా, సహజంగా ఆ వంశావళి భావాన్ని తెలియజేస్తుంది.
- source_word: עָפְרָה
  choice: ఒఫ్రా
  rationale: ఇక్కడ సంతానంగా పేర్కొన్న పేరుగా తీసుకొని లిప్యంతరీకరించాం; అది వ్యక్తి పేరా, స్థలంతో సంబంధమున్న పేరా అనే సాధ్యమైన సందిగ్ధతను అనవసరంగా పరిష్కరించలేదు.
- source_word: שְׂרָיָה
  choice: శెరాయా
  rationale: వ్యక్తి పేరును తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: יוֹאָב
  choice: యోవాబు
  rationale: తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֲבִי
  choice: తండ్రి
  rationale: హీబ్రూ పదానికి నేరమైన సమానార్థకాన్ని ప్రధాన పాఠ్యంలో ఉంచాం. వంశావళుల్లో దీనికి ‘స్థాపకుడు’ లేదా ‘మూలపురుషుడు’ అనే విస్తృత భావం ఉండవచ్చని పాదసూచికలో తెలిపాం.
- source_word: גֵּיא חֲרָשִׁים
  choice: గే-హరాషీము
  rationale: మొత్తం పదబంధం స్థలనామంగా పనిచేస్తున్నందున అనువదించకుండా లిప్యంతరీకరించాం; దాని అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: స్థలనామానికి లేదా దానితో సంబంధమున్న ప్రజలకు కారణాత్మక వివరణను పరిచయం చేసే సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: חֲרָשִׁים
  choice: శిల్పులు
  rationale: ఈ సామాన్య నామవాచకం నైపుణ్యంతో పని చేసే వివిధ వృత్తులవారిని సూచించగలదు. ‘కమ్మరులు’ అని ఒక వృత్తికే పరిమితం చేయకుండా విస్తృత భావాన్ని నిలిపాం.
- source_word: הָיוּ
  choice: వారు
  rationale: క్రియలోని బహువచన కర్తను తెలుగులో సహజంగా వ్యక్తం చేసి, గే-హరాషీముతో సంబంధమున్న ప్రజలను సూచించేలా ఉంచాం.
theological_decisions:
- issue: ‘గే-హరాషీము తండ్రి’ అనే వంశావళి వ్యక్తీకరణ యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘తండ్రి’ అని మూల రూపాన్ని నిలిపి, విస్తృత భావాన్ని పాదసూచికలో ఇచ్చాం.
  alternative: ‘గే-హరాషీము స్థాపకుడు’ లేదా ‘గే-హరాషీము ప్రజల మూలపురుషుడు’
  rationale: ఒక స్థలానికి ‘తండ్రి’ అనే మాట హీబ్రూలో స్థాపకుడు, మూలపురుషుడు లేదా ప్రధాన వంశనాయకుడు అనే భావం ఇవ్వగలదు. ప్రధాన పాఠ్యంలో ఒక భావాన్ని మాత్రమే ఖరారు చేయకుండా మూలంలోని ఉద్వేగాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా సంక్షిప్త వంశావళి శైలిని వాడాం. పేర్లను గౌరవప్రదమైన తెలుగు బైబిలు నామరూపాలకు దగ్గరగా లిప్యంతరీకరించాం. ప్రధాన పాఠ్యంలో మూలంలోని ‘తండ్రి’ రూపాన్ని నిలిపి, స్థలనామార్థం మరియు ‘స్థాపకుడు/మూలపురుషుడు’ భావాలను పాదసూచికల్లో స్పష్టం చేశాం.
