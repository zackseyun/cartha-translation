  variant: modern standard Telugu
source:
  edition: WLC
  text: הֵ֚מָּה הַ/יּ֣וֹצְרִ֔ים וְ/יֹשְׁבֵ֥י נְטָעִ֖ים וּ/גְדֵרָ֑ה עִם הַ/מֶּ֥לֶךְ בִּ/מְלַאכְתּ֖/וֹ יָ֥שְׁבוּ שָֽׁם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/023.yaml
  text: These were the potters and the inhabitants of Netaim and Gederah[a]; they lived there with the king for his work.
translation:
  language: te
  text: వీరు కుమ్మరులు, నెటాయీము మరియు గెదేరా నివాసులు.[a] వారు రాజుతో కలిసి అతని పని కోసం అక్కడ నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వీరు కుమ్మరులు; నాటబడిన చెట్లు లేదా తోటలు, కంచెగల ప్రదేశం నివాసులు.” హీబ్రూలోని ‘నెటాయీము,’ ‘గెదేరా’ పదాలను స్థలనామాలుగానో, ‘నాటబడిన చెట్లు/తోటలు,’ ‘కంచెగల ప్రదేశం’ అనే సాధారణ నామాలుగానో అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: వీరు
  rationale: ముందటి వంశావళిలో పేర్కొన్నవారిని సూచించే బహువచన సర్వనామం; తెలుగులో గుర్తింపు వాక్యానికి ‘వీరు’ సహజంగా సరిపోతుంది.
- source_word: הַיּוֹצְרִים
  choice: కుమ్మరులు
  rationale: יצר అనే మూలం రూపకల్పనను సూచిస్తుంది; ఈ సందర్భంలో మట్టిని మలిచే వృత్తివారైన కుమ్మరులు అనే నిర్దిష్టమైన, సంప్రదాయ అర్థం సముచితం.
- source_word: וְיֹשְׁבֵי
  choice: నివాసులు
  rationale: ישב క్రియ యొక్క నిర్మాణాత్మక కృదంత రూపం స్థిరంగా నివసించేవారిని సూచిస్తుంది; ‘నివాసులు’ దాని నామవాచక బలాన్ని కాపాడుతుంది.
- source_word: נְטָעִים
  choice: నెటాయీము
  rationale: ‘నాట్లు/తోటలు’ అనే సాధారణ నామార్థం సాధ్యమైనప్పటికీ, వంశావళి-భౌగోళిక సందర్భంలో దీనిని స్థలనామంగా తీసుకోవడం సముచితం; ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: וּגְדֵרָה
  choice: గెదేరా
  rationale: ‘గోడ/కంచె’ అనే సాధారణ నామార్థం సాధ్యమైనప్పటికీ, నెటాయీముతో జతగా ఉన్నందున స్థలనామంగా గ్రహించబడింది; సందిగ్ధత పాదసూచికలో నిలుపబడింది.
- source_word: עִם הַמֶּלֶךְ
  choice: రాజుతో కలిసి
  rationale: עִם యొక్క ప్రాథమిక అర్థమైన ‘తో’ను కాపాడుతూ, తెలుగులో అనుబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది; రాజసేవ అనే భావాన్ని పాఠ్యంలో అతిగా నిర్ధారించదు.
- source_word: בִּמְלַאכְתּוֹ
  choice: అతని పని కోసం
  rationale: מְלָאכָה పని, వృత్తి లేదా సేవను సూచించగలదు. రాజును ప్రత్యయానికి పూర్వపదంగా తీసుకొని, విస్తృత అర్థాన్ని నిలుపుకునేలా అనువదించబడింది.
- source_word: יָשְׁבוּ שָׁם
  choice: అక్కడ నివసించారు
  rationale: ישב యొక్క కాలరూపం, שָׁם కలసి ఆ ప్రదేశంలో స్థిర నివాసాన్ని సూచిస్తాయి; ఇది ఆధునిక తెలుగులో సహజమైన వ్యక్తీకరణ.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. హీబ్రూలోని స్థలనామం–సాధారణ నామం సందిగ్ధతను ప్రధాన పాఠ్యంలో స్థలనామాలతో, పాదసూచికలో ప్రత్యామ్నాయంతో కాపాడాం.
