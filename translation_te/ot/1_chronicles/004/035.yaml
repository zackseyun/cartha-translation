  text: and Joel[a], and Jehu son of Joshibiah, son of Seraiah, son of Asiel.
translation:
  language: te
  text: యోవేలు[a], యోషిబ్యా కుమారుడైన యెహూ; యోషిబ్యా శెరాయా కుమారుడు, శెరాయా అసీయేలు కుమారుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: వంశావళుల్లో హీబ్రూ ‘కుమారుడు’ అనే పదం కొన్నిసార్లు దూరపు వంశస్థుణ్ణి కూడా సూచించవచ్చు. ఇక్కడ మూలపాఠంలోని వంశావళి సూత్రాన్ని అనుసరించి ‘కుమారుడు’గా అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: మరియు అనే పదాన్ని ప్రత్యేకంగా చేర్చకుండా జాబితా నిర్మాణంలో చూపించడం
  rationale: ఈ వచనం ముందున్న పేర్ల జాబితాను కొనసాగిస్తుంది. ఆధునిక తెలుగులో వాక్యారంభంలో పదేపదే ‘మరియు’ అనడం కృత్రిమంగా ఉంటుంది; విరామచిహ్నం, సముచ్చయ నిర్మాణం అదే అనుసంధానాన్ని సహజంగా తెలియజేస్తాయి.
- source_word: יוֹאֵל
  choice: యోవేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సుపరిచితమైన బైబిలు రూపంలో లిప్యంతరీకరించాం.
- source_word: יֵהוּא
  choice: యేహూ
  rationale: హీబ్రూ వ్యక్తినామ ధ్వనిని స్పష్టంగా ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: בֶּן יֹשִׁבְיָה
  choice: యోషిబ్యా కుమారుడు
  rationale: మొదటి בֶּן సమీప పితృసంబంధాన్ని సూచించే సూటి వంశావళి ప్రయోగంగా అనువదించాం.
- source_word: בֶּן שְׂרָיָה
  choice: శెరాయా మనుమడు
  rationale: వరుసగా వచ్చే వంశావళి సంబంధాన్ని తెలుగులో సహజంగా, స్పష్టంగా చూపేందుకు రెండో తరాన్ని ‘మనుమడు’గా వ్యక్తపరిచాం; మూలంలోని సంబంధక్రమం నిలిచింది.
- source_word: בֶּן עֲשִׂיאֵל
  choice: అసీయేలు మునిమనుమడు
  rationale: మూడో తరపు వంశసంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తూ మూల వంశక్రమాన్ని కాపాడాం.
- source_word: יֹשִׁבְיָה / שְׂרָיָה / עֲשִׂיאֵל
  choice: యోషిబ్యా / శెరాయా / అసీయేలు
  rationale: హీబ్రూ వ్యక్తినామాలను వాటి ధ్వనులకు దగ్గరగా, తెలుగు పఠనానికి అనుకూలంగా లిప్యంతరీకరించాం.
