source:
  edition: WLC
  text: וְ/אֶשְׁתּ֗וֹן הוֹלִ֞יד אֶת בֵּ֤ית רָפָא֙ וְ/אֶת פָּסֵ֔חַ וְ/אֶת תְּחִנָּ֖ה אֲבִ֣י עִ֣יר נָחָ֑שׁ אֵ֖לֶּה אַנְשֵׁ֥י רֵכָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/012.yaml
  text: Eshton fathered Beth-rapha[a], Paseah, and Tehinnah, the father of Ir-nahash[b]. These were the men of Rekah.
translation:
  language: te
  text: ఎష్టోను బేత్-రాఫాను, పాసేయహును, ఇర్-నాహాషుకు తండ్రియైన తెహిన్నాను[a][b] కన్నాడు. వీరు రేకా జనులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇర్-నాహాషు స్థాపకుడు.’ వంశావళుల్లో ‘తండ్రి’ అనే మాట ప్రత్యక్ష జన్మతండ్రినే కాక వంశపితను లేదా ఒక స్థల స్థాపకుణ్ణి కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఇర్-నాహాషు’ అనే పేరుకు ‘నాహాషు నగరం’ అనే అర్థం ఉండవచ్చు; అయితే ఇక్కడ అది బహుశా స్థలనామంగా వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: కన్నాడు
  rationale: వంశావళి సందర్భంలో హిఫిల్ రూపం సంతానానికి తండ్రి కావడాన్ని సూచిస్తుంది. ‘కన్నాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, మూలంలోని వంశసంబంధ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בֵּית רָפָא
  choice: బేత్-రాఫా
  rationale: ఇక్కడ ఇది వ్యక్తిపేరుగా సమాంతర పేర్ల మధ్య వస్తోంది; అందువల్ల ‘రాఫా ఇల్లు’ అని అనువదించకుండా పేరుగా లిప్యంతరీకరించబడింది.
- source_word: פָּסֵחַ
  choice: పాసెహు
  rationale: ఇది వ్యక్తిపేరు కాబట్టి తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: תְּחִנָּה
  choice: తెహిన్నా
  rationale: ఇతర సందర్భాల్లో ఈ పదానికి ‘విన్నపం’ అనే సామాన్య అర్థం ఉన్నా, ఇక్కడ వ్యక్తిపేరుగా వాడబడినందున లిప్యంతరీకరించబడింది.
- source_word: אֲבִי עִיר נָחָשׁ
  choice: ఇర్-నాహాషుకు తండ్రి
  rationale: אֲבִי అనే పదం ప్రత్యక్ష తండ్రినే కాక వంశపితను లేదా ఒక నివాసస్థల స్థాపకుణ్ణి కూడా సూచించగలదు. ప్రధాన పాఠంలో ‘తండ్రి’ అని ఉంచి, విస్తృత అర్థాన్ని పాదసూచికలో తెలిపాం. עִיר נָחָשׁను ఈ పేర్ల సందర్భంలో స్థలనామంగా తీసుకున్నాం.
- source_word: אֵלֶּה אַנְשֵׁי רֵכָה
  choice: వీరు రేకా మనుషులు
  rationale: אַנְשֵׁי అనే పదంలోని ‘మనుషులు/జనులు’ భావాన్ని నిలుపుతూ, రేకా అనే వంశం లేదా ప్రాంతంతో వారి సంబంధాన్ని ఉద్దేశపూర్వకంగా విప్పి చెప్పకుండా ఉంచుతుంది.
- source_word: רֵכָה
  choice: రేకా
  rationale: ఇది వ్యక్తి, వంశం లేదా స్థలానికి సంబంధించిన ప్రత్యేక నామంగా ఉన్నందున లిప్యంతరీకరించబడింది.
