translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. పేర్లు అనువదించకుండా లిప్యంతరీకరించబడ్డాయి. ‘తండ్రి’ అనే హెబ్రీ ప్రయోగంలోని తండ్రి/వంశపిత/స్థాపకుడు అనే అర్థసంభావ్యతను పాదసూచిక ద్వారా నిలుపుకున్నాం; ‘రేకా మనుషులు’ అనే పదబంధం వారు ఒక వంశానికి చెందినవారా లేక ఒక ప్రాంతవాసులా అనే మూలంలోని అనిశ్చితిని పరిష్కరించకుండా ఉంచుతుంది.
