  text: and Meshobab[a], and Jamlech, and Joshah son of Amaziah.
translation:
  language: te
  text: మెషోబాబు, యమ్లేఖు, మరియు అమజ్యా కుమారుడైన యోషా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְשׁוֹבָב
  choice: మెషోబాబు
  rationale: వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణను అనుసరించి తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: יַמְלֵךְ
  choice: యమ్లేకు
  rationale: వ్యక్తి పేరు; ఆరంభ హీబ్రూ యోద్‌ను తెలుగులో ‘య’గా సహజంగా లిప్యంతరీకరించాం.
- source_word: יוֹשָׁה
  choice: యోషా
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: בֶּן
  choice: కుమారుడైన
  rationale: వంశావళి సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֲמַצְיָה
  choice: అమజ్యా
  rationale: వ్యక్తి పేరు; హీబ్రూ ధ్వనిరూపాన్ని అనుసరించిన తెలుగు లిప్యంతరీకరణ.
- source_word: וְ
  choice: జాబితాలో విరామచిహ్నాల ద్వారా సూచించబడింది
  rationale: హీబ్రూలో ప్రతి పేరుకు ముందు పునరావృతమైన సంధాయకం ఉంది; తెలుగులో జాబితా సహజత్వం కోసం కామాలతో వ్యక్తం చేయబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. పేర్లు ఆంగ్ల సంప్రదాయ రూపాలకన్నా హీబ్రూ ధ్వనులకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి.
