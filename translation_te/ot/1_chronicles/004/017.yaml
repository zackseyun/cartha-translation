  rationale: హీబ్రూ రూపం ఏకవచనంగా ‘ఎజ్రా కుమారుడు’ అని ఉన్నా, దాని వెంట పలువురి పేర్లు వస్తున్నాయి. వంశావళి సందర్భానికి సహజంగా సరిపడేలా బహువచనాన్ని ప్రధాన పాఠ్యంలో వాడి, ఏకవచన రూపాన్ని పాదసూచికలో నిలిపాం.
