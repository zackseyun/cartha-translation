  yaml_path: translation/ot/1_chronicles/004/017.yaml
  text: 'The sons of Ezrah: Jether[a], Mered, Epher, and Jalon; and she conceived Miriam, Shammai, and Ishbah[c][b], the father of Eshtemoa.'
translation:
  language: te
  text: 'ఎజ్రహా కుమారులు[a]: యెతెరు, మెరెదు, ఏఫెరు, యాలోను. ఆమె మిర్యామును, షమ్మయిని, ఇష్బాహును గర్భం దాల్చింది[b]. ఇష్బాహు ఎష్టెమోవాకు తండ్రి[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “ఎజ్రహా కుమారుడు.” అయితే దీని వెంట పలువురి పేర్లు వస్తున్నందున, దీనిని సాధారణంగా “ఎజ్రహా కుమారులు” అనే సమూహార్థంలో గ్రహిస్తారు.
    reason: textual_variant
  - marker: b
    text: హీబ్రూ పాఠ్యం “ఆమె గర్భం దాల్చింది” అని మాత్రమే చెబుతుంది; ఈ వాక్యభాగంలో ఆ స్త్రీ ఎవరో పేర్కొనలేదు.
    reason: lexical_alternative
  - marker: c
    text: ఎష్టెమోవాను ఒక వ్యక్తిగా కాకుండా వంశం లేదా నివాసస్థలంగా గ్రహిస్తే, “ఎష్టెమోవా స్థాపకుడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
