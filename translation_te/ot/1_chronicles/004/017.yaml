  - severity: low
    issue: The verbal phrase 'గర్భం ధరించింది' is less idiomatic than 'గర్భం దాల్చింది.'
    rationale: Both can convey conception, but 'గర్భం దాల్చింది' is smoother modern standard Telugu while retaining the source's feminine singular and unnamed subject.
