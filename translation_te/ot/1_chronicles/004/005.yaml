translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వంశావళి శైలి వాడబడింది. మూలంలోని దత్తివ్యాకరణ నిర్మాణాన్ని ‘అష్హూరుకు ... ఉండేవారు’గా నిలిపి, ‘తండ్రి’ పదంలోని నిజమైన భావవ్యాప్తిని పాదటిప్పణిలో సంరక్షించాం.
