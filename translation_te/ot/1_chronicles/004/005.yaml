base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/005.yaml
  text: 'Ashhur the father of Tekoa had two wives: Helah and Naarah[a].'
translation:
  language: te
  text: 'తెకోవాకు తండ్రియైన అష్హూరుకు ఇద్దరు భార్యలు ఉండేవారు: హెలా, నయరా.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తెకోవా స్థాపకుడు’ / ‘తెకోవా పూర్వికుడు’; వంశావళుల్లో ‘తండ్రి’ అనే పదం వెంటనే జన్మనిచ్చిన తండ్రినే కాకుండా, ఒక వంశానికి లేదా నివాసస్థలానికి మూలపురుషుడిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַשְׁחוּר
  choice: అష్హూరుకు
  rationale: పేరుకు జతైన సంధాయక అవ్యయం, ఉపసర్గ ఈ వంశావళి వాక్యాన్ని ముందున్న విషయంతో అనుసంధానిస్తున్నాయి. ‘అష్హూరుకు’ అనే రూపం హెబ్రీ దత్తివ్యాకరణ నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: אֲבִי תְקוֹעַ
  choice: తెకోవకు తండ్రియైన
  rationale: אָבִי అనే పదానికి ప్రత్యక్షంగా ‘తండ్రి’ అని అర్థం; వంశావళుల్లో అది పూర్వికుడు, వంశస్థాపకుడు లేదా నివాసస్థల స్థాపకుడు అనే విస్తృత భావాన్నీ కలిగి ఉండవచ్చు. ప్రధాన పాఠ్యంలో సూటి రూపాన్ని ఉంచి, ఆ భావవ్యాప్తిని పాదటిప్పణిలో తెలిపాం.
- source_word: הָיוּ
  choice: ఉండేవారు
  rationale: హెబ్రీలో ‘ఉండిరి’ అనే అస్తిత్వ నిర్మాణం ఉంది. తెలుగులో ‘అష్హూరుకు ఇద్దరు భార్యలు ఉండేవారు’ అనేది సహజంగా స్వామ్య భావాన్ని తెలియజేస్తూ మూల నిర్మాణానికీ దగ్గరగా ఉంటుంది.
- source_word: שְׁתֵּי נָשִׁים
  choice: ఇద్దరు భార్యలు
  rationale: పేరు గల పురుషునితో వచ్చిన ఈ వంశావళి సందర్భంలో נָשִׁים సాధారణంగా ‘స్త్రీలు’ అని కాక ‘భార్యలు’ అని అర్థమవుతుంది; వ్యక్తులకు తగిన తెలుగు సంఖ్యావాచక రూపంగా ‘ఇద్దరు’ వాడబడింది.
- source_word: חֶלְאָה
  choice: హెలా
  rationale: హెబ్రీ వ్యక్తిపేరును తెలుగు ధ్వన్యంతరీకరణలో స్పష్టంగా, సులభంగా చదవగల రూపంలో ఇచ్చాం.
- source_word: וְנַעֲרָה
  choice: నయరా
  rationale: హెబ్రీ నַעֲרָה పేరులోని హల్లులు, స్వరాలను అనుసరించి ‘నయరా’గా ధ్వన్యంతరీకరించాం; జాబితాలోని సమన్వయం తెలుగులో విరామచిహ్నంతో సహజంగా వ్యక్తమవుతుంది.
