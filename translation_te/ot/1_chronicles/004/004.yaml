  source_fidelity: The draft preserves the names and the core genealogical relationships, but its final semicolon construction breaks the Hebrew apposition and makes the clause about Hur and Bethlehem unnecessarily detached. The Hebrew identifies Penuel and Ezer as sons of Hur, who is Ephrathah's firstborn and Bethlehem's father.
