  terminology: The transliterations పెనూయేలు, గెదోరు, ఏజెరు, హూషా, హూరు, ఎఫ్రాతా, and బేత్లెహేము are suitable. “జ్యేష్ఠుడైన” naturally conveys Hur's status as Ephrathah's firstborn without adding a separate noun such as “son.”
  issues:
  - severity: medium
    issue: The main text separates “Hur, Ephrathah’s firstborn, father of Bethlehem” into a semicolon clause.
    rationale: In Hebrew these descriptions belong appositionally to Hur, whose sons are Penuel and Ezer. Keeping them together makes the genealogy and scope unambiguous.
