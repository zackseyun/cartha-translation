  text: Penuel[a], the father of Gedor, and Ezer, the father of Hushah—these were the sons of Hur, the firstborn of Ephrathah[b], the father of Bethlehem.
translation:
  language: te
  text: గెదోరుకు తండ్రియైన[a] పెనూయేలు[b], హూషాకు తండ్రియైన ఏజెరు—వీరు ఎఫ్రాతాకు జ్యేష్ఠుడైన, బేత్లెహేముకు తండ్రియైన హూరు కుమారులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తండ్రి” అనే హీబ్రూ పదం ఈ వంశావళి సందర్భంలో, ముఖ్యంగా పట్టణాలు లేదా వంశాల విషయంలో, “స్థాపకుడు” లేదా “పూర్వికుడు” అని కూడా అర్థమివ్వవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “పెనూయేలు” అనే పేరు మరికొన్ని వాక్యభాగాల్లో “పెనీయేలు” అని కనిపిస్తుంది; రెండూ ఒకే పేరుకు చెందిన రూపాంతరాలు.
    reason: lexical_alternative
