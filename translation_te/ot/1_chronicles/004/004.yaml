translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన గంభీరమైన కాని సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. మూలంలోని పునరుక్త 'తండ్రి' నుడికారాన్ని నిలిపి, చివరి సంబంధంలో హూరు అనే పేరును మళ్లీ ఉంచడం ద్వారా తెలుగులో కర్త స్పష్టతను కాపాడాం. అందించిన ఆంగ్ల పాదసూచిక గుర్తులు విషయాలతో తారుమారుగా ఉన్నందున, సంబంధిత పదాల వద్ద అర్థానుసారం [a], [b] గుర్తులను ఉంచాం.
