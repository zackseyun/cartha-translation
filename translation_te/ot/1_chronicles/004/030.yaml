translation:
  language: te
  text: మరియు బెతూయేలులోను, మరియు హోర్మాలోను, మరియు సిక్లగులోను,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בִ/בְתוּאֵל
  choice: బెతూయేలులో
  rationale: వావ్ సంధి ముందున్న నివాసస్థలాల జాబితాను కొనసాగిస్తుంది; తెలుగులో ప్రతి అంశానికి ‘మరియు’ పెట్టకుండా కామాలతో సహజంగా ఆ కొనసాగింపును చూపించాం. ב స్థానాన్ని సూచిస్తున్నందున ‘లో’ వాడాం; בְתוּאֵל స్థలనామం కాబట్టి ‘బెతూయేలు’గా లిప్యంతరీకరించాం.
- source_word: וּ/בְ/חָרְמָה
  choice: హోర్మాలో
  rationale: ב అనే స్థానసూచక అవ్యయాన్ని ‘లో’గా అనువదించాం. חָרְמָה స్థలనామాన్ని దాని హీబ్రూ ఉచ్చారణకు సమీపంగా ‘హోర్మా’గా లిప్యంతరీకరించాం; జాబితా నిర్మాణాన్ని కామాతో కొనసాగించాం.
- source_word: וּ/בְ/צִיקְלָג
  choice: సిక్లగులో
  rationale: ב ను ‘లో’గా అనువదించాం; צִיקְלָג స్థలనామాన్ని ‘సిక్లగు’గా లిప్యంతరీకరించాం. వాక్యఖండం తెలుగులో సంపూర్ణంగా నిలవడానికి సందర్భం నుంచి ‘నివసించారు’ అనే క్రియను పూరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి-నివాసస్థలాల జాబితాకు తగిన సరళమైన గౌరవప్రద శైలి. మూలంలోని పునరావృత וּ/בְ నిర్మాణాన్ని తెలుగులో భారంగా వినిపించకుండా కామాలతో వ్యక్తం చేసి, చివర సందర్భానుగుణంగా ‘నివసించారు’ చేర్చాం.
