source:
  edition: WLC
  text: בְּנֵ֖י יְהוּדָ֑ה פֶּ֧רֶץ חֶצְר֛וֹן וְ/כַרְמִ֖י וְ/ח֥וּר וְ/שׁוֹבָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/001.yaml
  text: 'The sons of Judah: Perez[a], Hezron, Carmi, Hur, and Shobal.'
translation:
  language: te
  text: 'యూదా కుమారులు[a]: పెరెసు, హెస్రోను, కర్మీ, హూరు, షోబాలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ భాషలో ‘కుమారులు’ అనే మాట వంశావళిలో ప్రత్యక్ష కుమారులను లేదా మరింత విస్తృతంగా వంశస్థులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: బֵּן పదానికి నిర్మాణ బహువచనం. వంశావళి సందర్భంలో ఇది నేరుగా పుట్టిన కుమారులనే కాక విస్తృతంగా వంశస్థులను కూడా సూచించగలదు; మూలంలోని రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, ఆ విస్తృత అర్థాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: יְהוּדָה
  choice: యూదా
  rationale: గోత్రపిత/గోత్ర నామానికి తెలుగులో స్థిరంగా వాడుకలో ఉన్న రూపం.
- source_word: פֶּרֶץ
  choice: పెరెసు
  rationale: హీబ్రూ పేరుకు ఆధునిక తెలుగు లిప్యంతరీకరణ.
- source_word: חֶצְרוֹן
  choice: హెస్రోను
  rationale: హీబ్రూ పేరుకు సమీపమైన, తెలుగులో సహజంగా పలికే లిప్యంతరీకరణ.
- source_word: כַרְמִי
  choice: కర్మీ
  rationale: హీబ్రూ పేరుకు సమీపమైన తెలుగు లిప్యంతరీకరణ; వచనం పేరును మాత్రమే జాబితా చేస్తుంది.
- source_word: חוּר
  choice: హూరు
  rationale: హీబ్రూ పేరుకు తెలుగు లిప్యంతరీకరణ.
- source_word: שׁוֹבָל
  choice: షోబాలు
  rationale: హీబ్రూ పేరుకు తెలుగు లిప్యంతరీకరణ.
- source_word: וְ
  choice: కామాలతో జాబితా
  rationale: హీబ్రూలో పునరావృతమయ్యే సంధికారకాన్ని తెలుగులో సహజమైన జాబితా విరామచిహ్నాలతో వ్యక్తం చేశాం; పేర్ల సంబంధాన్ని మార్చలేదు.
theological_decisions:
- issue: జాబితాలోని వ్యక్తుల వంశ సంబంధం
  choice: మూలంలోని ‘కుమారులు’ అనే పదాన్ని యథాతథంగా ఉంచి, దాని వంశావళి విస్తృతిని పాదటిప్పణిలో వివరించడం
  alternative: ప్రధాన పాఠ్యంలో ‘వంశస్థులు’ అని అనువదించడం
  rationale: ఈ జాబితాలోని వారందరూ యూదాకు ప్రత్యక్ష కుమారులని అర్థాన్ని సంకుచితం చేయకుండా, హీబ్రూ పదరూపాన్ని కూడా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళికి తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. పేర్లు హీబ్రూ రూపాలకు దగ్గరగా, తెలుగు పఠనానికి సహజంగా లిప్యంతరీకరించబడ్డాయి.
