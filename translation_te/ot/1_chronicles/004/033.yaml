translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, చారిత్రక-భౌగోళిక జాబితాకు తగిన గౌరవప్రదమైన సరళ శైలిని అనుసరించాం. మూలంలోని సమాహార నిర్మాణాన్ని డాష్‌తో నిలిపి, ‘గ్రామాలు’ మరియు ‘నివాస స్థలాలు’ మధ్య ఉన్న హీబ్రూ పదభేదాన్ని కాపాడాం.
