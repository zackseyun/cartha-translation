source:
  edition: WLC
  text: וְ/כָל חַצְרֵי/הֶ֗ם אֲשֶׁ֧ר סְבִיב֛וֹת הֶ/עָרִ֥ים הָ/אֵ֖לֶּה עַד בָּ֑עַל זֹ֚את מוֹשְׁבֹתָ֔/ם וְ/הִתְיַחְשָׂ֖/ם לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/033.yaml
  text: And all their villages that were around these cities, as far as Baal—these were their settlements, and they had their genealogy recorded.
translation:
  language: te
  text: ఈ పట్టణాల చుట్టూ బాల్ వరకు ఉన్న వారి గ్రామాలన్నీ[a]—ఇవే వారి నివాస స్థలాలు; వారు తమ వంశావళి ప్రకారం నమోదు చేసుకున్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి చిన్న గ్రామాలన్నీ” లేదా “వారి నివాస ప్రాంతాలన్నీ.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారి వంశావళి నమోదు చేయబడింది.” హీబ్రూ పదబంధం వంశావళి ఆధారంగా నమోదును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַצְרֵיהֶם
  choice: వారి గ్రామాలు
  rationale: חָצֵר అనే పదానికి ఆవరణ, చిన్న గ్రామం, అనుబంధ నివాస స్థలం అనే అర్థాలు ఉన్నాయి. ఇక్కడ పట్టణాల చుట్టూ ఉన్న నివాస ప్రాంతాల జాబితా కాబట్టి, ఆధునిక తెలుగులో సహజమైన ‘గ్రామాలు’ అనేది సందర్భానికి సరిపోతుంది.
- source_word: אֲשֶׁר סְבִיבוֹת הֶעָרִים הָאֵלֶּה
  choice: ఈ పట్టణాల చుట్టూ ... ఉన్న
  rationale: ఈ సంబంధ వాక్యం ముందుగా పేర్కొన్న గ్రామాలు ఈ పట్టణాల పరిసరాల్లో ఉన్నాయని సూచిస్తుంది; తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా సంబంధ పదబంధాన్ని నామవాచకానికి ముందు ఉంచాం.
- source_word: עַד בָּעַל
  choice: బాల్ వరకు
  rationale: עַד భౌగోళిక విస్తృతి లేదా సరిహద్దును సూచిస్తుంది. בָּעַל ఇక్కడ స్థలనామం కాబట్టి ‘బాల్’ అని లిప్యంతరీకరించాం.
- source_word: זֹאת
  choice: ఇవే
  rationale: రూపపరంగా ఏకవచన స్త్రీలింగమైనప్పటికీ, ఇక్కడ ముందు చెప్పిన స్థలాల జాబితాను సమాహారంగా తిరిగి సూచిస్తోంది. తెలుగులో బహువచనార్థాన్ని సహజంగా తెలియజేయడానికి ‘ఇవే’ వాడాం.
- source_word: מוֹשְׁבֹתָם
  choice: వారి నివాస స్థలాలు
  rationale: מוֹשָׁב నివసించే స్థలం లేదా స్థిరనివాసాన్ని సూచిస్తుంది. ముందున్న חַצְרֵיהֶםతో పదపునరుక్తి రాకుండా, మూలంలోని విభిన్న పదాన్ని ‘నివాస స్థలాలు’గా ప్రతిబింబించాం.
- source_word: וְהִתְיַחְשָׂם לָהֶם
  choice: వారు తమ వంశావళి ప్రకారం నమోదు చేయించుకున్నారు
  rationale: יחש యొక్క హిత్పయేల్ రూపం వంశావళి ఆధారంగా తనను నమోదు చేసుకోవడం లేదా లెక్కింపబడటాన్ని సూచిస్తుంది. మధ్యమ/ప్రతిబింబ భావాన్ని కాపాడేందుకు ‘నమోదు చేయించుకున్నారు’ అని అనువదించాం; హీబ్రూ వాక్యభాగం సంక్షిప్తంగా ఉన్నందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
