  rationale: రెండవ వంశావళి శీర్షికలోని హీబ్రూ బహువచనాన్ని “ఏలా కుమారులు”గా నిలిపాం; ఒక్క పేరు మాత్రమే రావడం వల్ల దాన్ని ఏకవచనంగా మార్చలేదు. נָעַם పేరును “నామ్”గా సరిచేసి, మూలపాఠానికి లేని య-ధ్వని మరియు అదనపు ముగింపును తొలగించాం. మిగిలిన నిర్మాణం, పేర్లు, మరియు ప్రత్యామ్నాయ-అర్థపు పాదటిప్పణిని అలాగే ఉంచాం.
