id: 1CH.4.15
reference: 1 Chronicles 4:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵי֙ כָּלֵ֣ב בֶּן יְפֻנֶּ֔ה עִ֥ירוּ אֵלָ֖ה וָ/נָ֑עַם וּ/בְנֵ֥י אֵלָ֖ה וּ/קְנַֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/015.yaml
  text: 'And the sons of Caleb son of Jephunneh: Iru[a], Elah, and Naam; and the sons of Elah: Kenaz.'
translation:
  language: te
  text: 'యెఫున్నె కుమారుడైన కాలేబు కుమారులు: ఈరూ[a], ఏలా, నామ్. ఏలా కుమారులు: కెనజు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, విస్తృత అర్థంలో, “యెఫున్నె కుమారుడైన కాలేబు సంతతివారు.” వంశావళుల్లో “కుమారులు” అనే మాట కొన్నిసార్లు విస్తృత కుటుంబ సంతతిని సూచించవచ్చు; అయితే ఇక్కడ వెంటనే పేర్లు ఇవ్వబడటం వల్ల “కుమారులు” అనే అర్థమే ఎక్కువ సహజం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: వంశావళి సందర్భంలో בְּנֵי అనే పదానికి ప్రత్యక్ష అర్థం ‘కుమారులు’. ఇది విస్తృతంగా ‘సంతతి’ని కూడా సూచించగలిగినా, ఇక్కడ వెంటనే పేర్ల జాబితా రావడం వల్ల ‘కుమారులు’ సహజమైన ఎంపిక.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: యెఫున్నె కుమారుడైన కాలేబు
  rationale: ఏ కాలేబు ఉద్దేశించబడుతున్నాడో తెలిపే వంశసంబంధ విశేషణాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: עִירוּ
  choice: ఈరూ
  rationale: హీబ్రూ ఉచ్చారణను ప్రతిబింబించే వ్యక్తిపేరు లిప్యంతరీకరణ.
- source_word: אֵלָה
  choice: ఏలా
  rationale: సందర్భం మరియు రూపం దీనిని వ్యక్తిపేరుగా చూపుతున్నాయి; హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- source_word: וָנָעַם
  choice: నయము
  rationale: మసొరేటిక్ పాఠంలోని నָעַם అనే పుంలింగ వ్యక్తిపేరును తెలుగులో పలకడానికి సహజమైన రూపం; ఇది వేరే రూపమైన ‘నయమా’ కాదు.
- source_word: וּבְנֵי אֵלָה וּקְנַז
  choice: 'ఏలా కుమారుడు: కెనజు'
  rationale: హీబ్రూలో ‘ఏలా కుమారులు’ అని బహువచనం ఉన్నప్పటికీ జాబితాలో కెనజు అనే ఒక్క పేరు మాత్రమే ఉంది. తెలుగులో అసహజతను నివారిస్తూ సూచించబడిన ఏకైక కుమారుడిని స్పష్టంగా అందిస్తుంది.
