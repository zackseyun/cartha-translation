translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి-ప్రాంత జాబితాకు తగిన గంభీరమైన సరళ శైలి వాడబడింది. మూలంలోని వాక్యఖండం ముందు వచనంతో కొనసాగుతున్నప్పటికీ, తెలుగు పఠనసౌలభ్యం కోసం ‘నివసించారు’ అనే సందర్భసిద్ధ క్రియను పూరించాం. అన్ని స్థలనామాలకు ఏకరీతిగా ‘లోను’ చేర్చి జాబితా నిర్మాణాన్ని నిలిపాం.
