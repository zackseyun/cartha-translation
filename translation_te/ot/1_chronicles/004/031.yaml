base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/031.yaml
  text: and in Beth-marcaboth[a], and in Hazar-susim, and in Beth-biri, and in Shaaraim[d][c][b]. These were their cities until David reigned.
translation:
  language: te
  text: బేత్-మర్కాబోతులోను[a], హజర్-సూసీములోను[b], బేత్-బిరీలోను[c], షారయిములోను[d]. దావీదు రాజ్యమేలే వరకు ఇవి వారి పట్టణాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “బేత్-మర్కాబోతు” అనే పేరును పదశః “రథాల ఇల్లు” అని అనువదించవచ్చు; ఇక్కడ అది స్థలనామంగా ఇవ్వబడింది.
    reason: lexical_alternative
  - marker: b
    text: “హజర్-సూసీము” అనే పేరును పదశః “గుర్రాల ఆవరణ” లేదా “గుర్రాల గ్రామం” అని అనువదించవచ్చు; ఇక్కడ అది స్థలనామంగా ఇవ్వబడింది.
    reason: lexical_alternative
  - marker: c
    text: “బేత్-బిరీ” అనే పేరును “బేత్-బిరేయి” అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: alternative_reading
  - marker: d
    text: “షారయిము” అనే పేరుకు వ్యుత్పత్తిపరంగా “రెండు ద్వారాలు” అనే భావం ఉండవచ్చు; ఇక్కడ అది స్థలనామంగా ఇవ్వబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/בֵית מַרְכָּבוֹת
  choice: బేత్-మర్కాబోతులోను
  rationale: పట్టణాల జాబితాలో ఇది స్థలనామం కాబట్టి అర్థానువాదం చేయకుండా తెలుగులో లిప్యంతరీకరించబడింది; בְ ఉపసర్గను ‘లో’తో, וּ సంధానాన్ని ‘ను’తో వ్యక్తం చేశాం.
- source_word: וּ/בַ/חֲצַר סוּסִים
  choice: హజర్-సూసీములోను
  rationale: పదభాగాలకు ‘గుర్రాల ఆవరణ/గ్రామం’ అనే అర్థం సాధ్యమైనా, సందర్భంలో ఇది స్థలనామం; అందువల్ల లిప్యంతరీకరణ ప్రధాన పాఠ్యంలో ఉంచబడింది.
- source_word: וּ/בְ/בֵית בִּרְאִי
  choice: బేత్-బిరీలోను
  rationale: చుట్టూ ఉన్న పేర్లకు సమాంతరంగా దీన్ని స్థలనామంగా తీసుకున్నాం. చివరి భాగపు లిప్యంతరీకరణలో స్వల్ప అనిశ్చితి ఉన్నందున ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: וּֽ/בְ/שַׁעֲרָיִם
  choice: షారయిములోను
  rationale: రూపవ్యుత్పత్తి ‘రెండు ద్వారాలు’ అనే భావాన్ని సూచించగలిగినా, పట్టణాల జాబితా కావడంతో స్థలనామంగా లిప్యంతరీకరించాం.
- source_word: אֵלֶּה עָרֵיהֶם
  choice: ఇవే వారి పట్టణాలు
  rationale: సూచక సర్వనామం ముందు పేర్కొన్న స్థలాలను సూచిస్తుంది. עִיר పదానికి సందర్భానుకూలంగా ‘పట్టణాలు’ అనే సహజమైన తెలుగు సమానార్థకాన్ని వాడాం.
- source_word: עַד מְלֹךְ דָּוִיד
  choice: దావీదు రాజ్యమేలే వరకు
  rationale: עַד తో కూడిన క్రియారూపం కాలపరిమితిని సూచిస్తుంది. ‘రాజ్యమేలే వరకు’ అనే రూపం హెబ్రీ క్రియాత్మక భావాన్ని నిలుపుతూ, అది రాజ్యారంభాన్నేనా లేక పరిపాలనా కాలాన్నా సూచిస్తుందనే సూక్ష్మతను అతిగా నిర్ణయించదు.
