  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ אֲבִ֣י עֵיטָ֔ם יִזְרְעֶ֥אל וְ/יִשְׁמָ֖א וְ/יִדְבָּ֑שׁ וְ/שֵׁ֥ם אֲחוֹתָ֖/ם הַצְלֶלְפּֽוֹנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/003.yaml
  text: 'These were the sons of the father of Etam: Jezreel[a], Ishma, and Idbash[b]; and the name of their sister was Hazzelelponi.'
translation:
  language: te
  text: 'ఏతాము తండ్రి[a] కుమారులు వీరు: యెజ్రెయేలు, ఇష్మా, ఇద్‌బాషు. వారి సహోదరి పేరు హత్సెలెల్పోని.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “తండ్రి” అనే హీబ్రూ పదం “పూర్వికుడు” లేదా “స్థాపకుడు” అనే విస్తృత వంశావళి అర్థాన్ని కూడా ఇవ్వవచ్చు. హీబ్రూ వాక్యంలో “కుమారులు” అనే పదం ప్రత్యక్షంగా లేదు; సందర్భాన్ని బట్టి అది సూచితమై ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: వీరు
  rationale: వంశావళిలో వ్యక్తులను పరిచయం చేసే హీబ్రూ పదబంధాన్ని సహజమైన ఆధునిక తెలుగు రూపంలో ఇచ్చింది.
- source_word: אֲבִי עֵיטָם
  choice: ఏతాము తండ్రి
  rationale: నిర్మాణ సంబంధాన్ని నేరుగా నిలిపింది. దినవృత్తాంతాల్లో “తండ్రి” అనే పదం తక్షణ జనకుడే కాక పూర్వికుడు లేదా స్థాపకుడు అనే అర్థాన్నీ కలిగి ఉండవచ్చు; ఆ సందిగ్ధతను పాదటిప్పణిలో ఉంచాం.
- source_word: יִזְרְעֶאל
  choice: యెజ్రెయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చింది.
- source_word: וְיִשְׁמָא
  choice: ఇష్మా
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన తెలుగు లిప్యంతరీకరణ.
- source_word: וְיִדְבָּשׁ
  choice: ఇద్‌బాషు
  rationale: హీబ్రూ వ్యక్తినామాన్ని స్పష్టంగా పలికేలా తెలుగు లిపిలో ఇచ్చింది.
- source_word: וְשֵׁם אֲחוֹתָם
  choice: వారి సహోదరి పేరు
  rationale: బహువచన ప్రత్యయాన్ని “వారి”గా నిలిపి, తెలుగు వాక్యనిర్మాణానికి సహజంగా మార్చింది.
- source_word: הַצְלֶלְפּוֹנִי
  choice: హజ్జెలెల్పోని
  rationale: సాంప్రదాయిక రూపానికి దగ్గరగా ఉన్న తెలుగు లిప్యంతరీకరణను వాడింది.
theological_decisions:
- issue: హీబ్రూ వాక్యంలో సంబంధపదం లోపించడం
  choice: “కుమారులు” అనే పదాన్ని సందర్భానుసారంగా పాఠ్యంలో పూరించడం
  alternative: “ఏతాము తండ్రి వీరు” అని పదక్షరంగా ఇవ్వడం
  rationale: మూలంలో אֲבִי (“తండ్రి”) ఏకవచనంగా ఉండగా మూడు పురుషుల జాబితా వస్తుంది. తెలుగులో అర్థవంతమైన వంశావళి వాక్యం కోసం సూచితమైన “కుమారులు”ను పూరించాం; అది మూలంలో ప్రత్యక్షంగా లేదని పాదటిప్పణిలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన వంశావళి శైలిని ఉపయోగించాం. వ్యక్తినామాలను అనువదించకుండా లిప్యంతరీకరించాం; మూలంలోని వ్యాకరణ సంక్షిప్తతను పాదటిప్పణితో పారదర్శకంగా వివరించాం.
