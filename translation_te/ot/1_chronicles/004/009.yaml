source:
  edition: WLC
  text: וַ/יְהִ֣י יַעְבֵּ֔ץ נִכְבָּ֖ד מֵ/אֶחָ֑י/ו וְ/אִמּ֗/וֹ קָרְאָ֨ה שְׁמ֤/וֹ יַעְבֵּץ֙ לֵ/אמֹ֔ר כִּ֥י יָלַ֖דְתִּי בְּ/עֹֽצֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/009.yaml
  text: Jabez was more honored than his brothers[a], and his mother called his name Jabez, saying[b], “Because I bore him in pain.”
translation:
  language: te
  text: యాబేసు తన సహోదరులకంటే ఎక్కువ గౌరవం పొందినవాడు. అతని తల్లి అతనికి యాబేసు[a] అని పేరు పెట్టి, “ఎందుకంటే నేను అతనిని వేదనతో[b] కన్నాను” అని చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “యాబేసు” అనే పేరు, తల్లి చెప్పిన వివరణలోని “వేదన” లేదా “దుఃఖం” అనే భావాన్ని సూచించే హీబ్రూ పదంతో శబ్దసామ్యం కలిగి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “దుఃఖంతో.” ఇక్కడి హీబ్రూ పదం వేదన, దుఃఖం లేదా కష్టాన్ని సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: యాబేసు ... పొందినవాడు
  rationale: ఈ కథన ప్రారంభ నిర్మాణాన్ని తెలుగులో సహజమైన నిర్దేశ వాక్యంగా అందించాం; మూలంలో లేని ప్రత్యేక కాలసూచక పదాన్ని చేర్చలేదు.
- source_word: יַעְבֵּץ
  choice: యాబేసు
  rationale: వ్యక్తిపేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం; పేరుకూ వేదనను సూచించే హీబ్రూ పదానికీ ఉన్న శబ్దసామ్యాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: נִכְבָּד מֵאֶחָיו
  choice: తన సహోదరులకంటే ఎక్కువ గౌరవం పొందినవాడు
  rationale: נִכְבָּד లోని ‘గౌరవింపబడిన/గౌరవం పొందిన’ భావాన్ని, מִן సూచించే తులనాత్మక బలాన్ని స్పష్టంగా నిలిపాం.
- source_word: וְאִמּוֹ קָרְאָה שְׁמוֹ
  choice: అతని తల్లి అతనికి ... అని పేరు పెట్టి
  rationale: ‘అతని పేరును పిలిచింది’ అనే హీబ్రూ నామకరణ నుడికారాన్ని ఆధునిక తెలుగులో సహజమైన ‘పేరు పెట్టింది’గా అందించాం.
- source_word: לֵאמֹר
  choice: అని చెప్పింది
  rationale: తల్లి ఇచ్చిన నామకరణ వివరణను పరిచయం చేసే సాధారణ కథన రూపంగా అనువదించాం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: పేరు పెట్టడానికి తల్లి చెప్పిన కారణాన్ని సూచించే కారణార్థక బలాన్ని స్పష్టంగా ఉంచాం.
- source_word: יָלַדְתִּי
  choice: నేను ఇతనికి ... జన్మనిచ్చాను
  rationale: ప్రసవాన్ని సూచించే క్రియను తెలుగులో సహజంగా అందించాం; ‘ఇతనికి’ అనేది సందర్భంలో అంతర్లీనంగా ఉన్న శిశువును స్పష్టం చేస్తుంది.
- source_word: בְּעֹצֶב
  choice: వేదనతో
  rationale: עֹצֶב శారీరక నొప్పి, దుఃఖం లేదా కష్టాన్ని సూచించగలదు. ప్రసవ సందర్భానికి ‘వేదనతో’ సహజంగా సరిపోతూ విస్తృత భావసాధ్యతను కూడా కొంత నిలుపుతుంది.
