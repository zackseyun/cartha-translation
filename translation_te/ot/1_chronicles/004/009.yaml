translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని నామకరణ క్రమాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా మార్చాం.
