  to: యోకీము, కోజేబా వాసులు, యోవాషు, శారాఫు—మోయాబును ఏలినవారు[a]—మరియు యాషూబీ-లెహెము[b]. ఈ సంగతులు ప్రాచీనమైనవి[c].
  rationale: ముఖ్యమైన యాషూబీ-లెహెము పాఠ్య సమస్యలో ఒక వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంగా ఖరారు చేయకుండా, హీబ్రూ రూపానికి దగ్గరైన వ్యక్తిపేరును ఉంచాం; క్రియాత్మక పఠనాన్ని పాదటిప్పణిలో నిలిపాం. అలాగే మోయాబుతో సంబంధాన్ని సూచించే క్రియకు “ఏలినవారు” అనే మరింత నేరమైన రూపాన్ని వాడాం. మిగతా అనిశ్చితులు, పేర్లు, మరియు ప్రాచీన సంగతుల గురించిన ముగింపు యథాతథ అర్థంతో ఉన్నాయి.
