source:
  edition: WLC
  text: וְ/יוֹקִ֞ים וְ/אַנְשֵׁ֣י כֹזֵבָ֗א וְ/יוֹאָ֧שׁ וְ/שָׂרָ֛ף אֲשֶׁר בָּעֲל֥וּ לְ/מוֹאָ֖ב וְ/יָשֻׁ֣בִי לָ֑חֶם וְ/הַ/דְּבָרִ֖ים עַתִּיקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/022.yaml
  text: and Jokim[a], and the men of Cozeba, and Joash, and Saraph, who ruled in Moab and returned to Lehem[c][b]. These records are ancient.
translation:
  language: te
  text: యోకీము, కోజేబా వాసులు, యోవాషు, శారాఫు—మోయాబును ఏలినవారు[a]—మరియు యాషూబీ-లెహెము[b]. ఈ సంగతులు ప్రాచీనమైనవి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మోయాబును స్వాధీనపరచుకున్నవారు,” “మోయాబులో ప్రభువులైనవారు”; బహుశా “మోయాబీయులతో వివాహ సంబంధాలు ఏర్పరచుకున్నవారు.” హీబ్రూ వాక్యభాగం సంక్షిప్తంగానూ అనిశ్చితంగానూ ఉంది.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూ పాఠం అనిశ్చితం. దీనిని “లెహెముకు తిరిగి వచ్చారు” అని కూడా అర్థం చేసుకోవచ్చు. కొందరు లెహెమును బేత్లెహెముతో అనుసంధానిస్తారు.
    reason: alternative_reading
  - marker: c
    text: లేదా, “ఈ విషయాలు ప్రాచీనమైనవి,” “ఈ సంగతులు పూర్వకాలం నాటివి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹקִים
  choice: యోకీము
  rationale: వంశావళి సందర్భంలోని వ్యక్తిపేరు; తెలుగు బైబిలు పేర్ల శైలికి అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: אַנְשֵׁי כֹזֵבָא
  choice: కోజేబా మనుషులు
  rationale: אַנְשֵׁי అనేది ‘మనుషులు’ అనే అర్థమిచ్చే బహువచన నిర్మాణరూపం; כֹזֵבָא స్థలనామంగా భావించి కోజేబా అని లిప్యంతరీకరించబడింది.
- source_word: יוֹאָשׁ
  choice: యోవాషు
  rationale: వ్యక్తిపేరు; సాధారణ తెలుగు బైబిలు నామరూపానికి అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: שָׂרָף
  choice: శారాఫు
  rationale: వంశావళి సందర్భంలో ఇది వ్యక్తిపేరు; సాధారణ నామవాచక అర్థమైన ‘మండుతున్నవాడు’ వంటి భావంతో అనువదించలేదు.
- source_word: אֲשֶׁר בָּעֲלוּ לְמוֹאָב
  choice: వీరు మోయాబులో అధికారులుగా ఉండి
  rationale: בעל అనే క్రియకు స్వాధీనపరచుకోవడం, ప్రభువులుగా ఉండడం లేదా ఏలడం వంటి అర్థాలు ఉండవచ్చు. అస్పష్టతను పాదటిప్పణిలో ఉంచుతూ, ప్రధాన పాఠ్యంలో సహజమైన చారిత్రక భావాన్ని ఇచ్చే రూపం ఎంచుకోబడింది.
- source_word: יָשֻׁבִי לָחֶם
  choice: లెహెముకు తిరిగి వచ్చారు
  rationale: ఈ క్లిష్టమైన హీబ్రూ రూపాన్ని క్రియాపదం మరియు స్థలనామంగా చదివే అవకాశాన్ని ప్రధాన పాఠ్యంలో అనుసరించాం; దీనిని ఒకే వ్యక్తిపేరుగా చదివే అవకాశాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: הַדְּבָרִים עַתִּיקִים
  choice: ఈ సంగతులు ప్రాచీనకాలానికి చెందినవి
  rationale: דְּבָרִים ఇక్కడ మాటలు, సంగతులు లేదా వృత్తాంతాలు అనే విస్తృత భావాన్ని కలిగి ఉండవచ్చు. ‘రికార్డులు’ అని నిర్దిష్టంగా నిర్ణయించకుండా మూలంలోని విస్తృతతను ‘సంగతులు’ అనే పదంతో నిలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన వంశావళి-చారిత్రక శైలి వాడబడింది. మూలంలోని రెండు ప్రధాన పాఠ్య అనిశ్చితులు ప్రధాన పాఠ్యాన్ని భారంగా చేయకుండా పాదటిప్పణుల్లో స్పష్టంగా నిలిపబడ్డాయి.
