id: 1CH.4.16
reference: 1 Chronicles 4:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֖י יְהַלֶּלְאֵ֑ל זִ֣יף וְ/זִיפָ֔ה תִּירְיָ֖א וַ/אֲשַׂרְאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/016.yaml
  text: 'And the sons of Jehallelel: Ziph[a], Ziphah, Tiria, and Asarel.'
translation:
  language: te
  text: 'యెహల్లెలేలు కుమారులు: జీఫు, జీఫా, తీర్యా, మరియు అసరేలు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: בְנֵי అనేది ‘కుమారులు’ అనే పదానికి నిర్మాణ బహువచన రూపం; ఇది వంశావళిలో సంతానాన్ని పరిచయం చేస్తుంది. ముందున్న וּ అనుసంధానాన్ని సూచించినప్పటికీ, తెలుగు వంశావళి జాబితాలో సహజత్వం కోసం ప్రత్యేకంగా ‘మరియు’ అని చేర్చలేదు.
- source_word: יְהַלֶּלְאֵל
  choice: యెహల్లెలేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని అనువదించకుండా, తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: זִיף
  choice: జీఫు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు పాఠకులు సులభంగా పలికే రూపంలో లిప్యంతరీకరించాం.
- source_word: וְזִיפָה
  choice: జీఫా
  rationale: సంయోజక అవ్యయంతో కూడిన వ్యక్తినామం; జాబితా విరామచిహ్నాలు అనుసంధానాన్ని స్పష్టంగా చూపుతున్నందున పేరును ‘జీఫా’గా ఇచ్చాం.
- source_word: תִּירְיָא
  choice: తిర్యా
  rationale: మసొరెటిక్ స్వరాలు, హీబ్రూ హల్లుల ఆధారంగా పేరును ‘తిర్యా’గా లిప్యంతరీకరించాం.
- source_word: וַאֲשַׂרְאֵל
  choice: అశరేలు
  rationale: హీబ్రూ שׂ ధ్వనిని ‘శ’తో, పేరులోని אֵל భాగాన్ని తెలుగు పేర్లలో సహజమైన ‘ఏలు’తో ప్రతిబింబించాం; జాబితాలో చివరి అనుసంధానం విరామచిహ్నాల ద్వారా స్పష్టమవుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలిని ఉపయోగించాం. వ్యక్తినామాలను మూల హీబ్రూ రూపాలకు దగ్గరగా, అయితే సాధారణ తెలుగు పాఠకుడు సహజంగా చదవగల విధంగా లిప్యంతరీకరించాం. ఆంగ్ల సంప్రదింపుపాఠంలోని [a] గుర్తు ‘Ziph’ తరువాత ఉన్నప్పటికీ దాని గమనిక ‘Asarel’ ఆంగ్ల అక్షరరూపానికి సంబంధించినది; అది తెలుగు పాఠానికి మూలపాఠ సంబంధిత సమాచారం ఇవ్వనందున చేర్చలేదు.
