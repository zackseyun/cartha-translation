source:
  edition: WLC
  text: וַ/יָּבֹ֡אוּ אֵלֶּה֩ הַ/כְּתוּבִ֨ים בְּ/שֵׁמ֜וֹת בִּ/ימֵ֣י יְחִזְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֗ה וַ/יַּכּ֨וּ אֶת אָהֳלֵי/הֶ֜ם וְ/אֶת ה/מעינים אֲשֶׁ֤ר נִמְצְאוּ שָׁ֨מָּ/ה֙ וַ/יַּחֲרִימֻ/ם֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יֵּשְׁב֖וּ תַּחְתֵּי/הֶ֑ם כִּֽי מִרְעֶ֥ה לְ/צֹאנָ֖/ם שָֽׁם׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/041.yaml
  text: These[a], who were recorded by name, came in the days of Hezekiah king of Judah, and they struck down their tents and the Meunites who were found there, and devoted them to destruction to this day. Then they settled in their place, because there was pasture there for their flocks.
translation:
  language: te
  text: పేరుపేరునా నమోదు చేయబడిన వీరు యూదా రాజైన హిజ్కియా కాలంలో వచ్చి, వారి గుడారాలపైనా అక్కడ కనిపించిన మెయూనీయులపైనా[a] దాడి చేసి, వారిని వినాశనానికి అంకితం చేశారు, ఈ రోజు వరకూ. ఆ తరువాత వీరు వారి స్థానంలో నివసించారు; ఎందుకంటే అక్కడ వారి మందలకు మేతభూమి ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ הַמְּעִינִים అనే పదం అర్థం కష్టమైనది. సంప్రదాయంగా దీన్ని ‘మెయూనీయులు’ అనే ప్రజాసమూహంగా తీసుకుంటారు; కొందరు దీన్ని ‘నివాసాలు’ లేదా ‘నివాసస్థలాలు’ అని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: הַכְּתוּבִים בְּשֵׁמוֹת
  choice: పేరుపేరునా నమోదు చేయబడిన
  rationale: వంశావళి లేదా అధికారిక జాబితాలో వ్యక్తులు పేర్లతో నమోదు చేయబడ్డారనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: וַיָּבֹאוּ
  choice: వచ్చి
  rationale: בוא అనే సాధారణ క్రియకు అనుగుణంగా కథన క్రమాన్ని సహజంగా కొనసాగిస్తుంది.
- source_word: וַיַּכּוּ
  choice: హతమార్చి
  rationale: సైనిక సందర్భంలో נכה సూచించే తీవ్ర దాడి, ఓటమి లేదా సంహార భావాన్ని నిలుపుతుంది; తరువాతి חרם క్రియతో ఉన్న హింసాత్మక సందర్భానికి సరిపోతుంది.
- source_word: אָהֳלֵיהֶם
  choice: వారి గుడారాలను
  rationale: సంచార లేదా అర్ధసంచార నివాసాలైన గుడారాలను సూచించే సాధారణ అర్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: המעינים
  choice: మెయూనీయులను
  rationale: కష్టమైన రూపాన్ని సంప్రదాయంగా ఒక ప్రజాసమూహపు పేరుగా అర్థం చేసుకోవడం సందర్భానికి సరిపోతుంది; ‘నివాసాలు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: אֲשֶׁר נִמְצְאוּ שָׁמָּה
  choice: అక్కడ కనిపించిన
  rationale: మెయూనీయులను ప్రజాసమూహంగా తీసుకున్నప్పుడు వ్యక్తులను సూచించే సహజమైన సంబంధవాచక ప్రయోగం.
- source_word: וַיַּחֲרִימֻם
  choice: వారిని పూర్తిగా నాశనానికి అంకితం చేశారు
  rationale: חרם యొక్క సాంకేతిక భావమైన నాశనానికి ప్రత్యేకించడం లేదా అంకితం చేయడాన్ని కేవలం ‘నాశనం చేశారు’గా చదును చేయకుండా వ్యక్తం చేస్తుంది.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: ఈ రోజు వరకూ
  rationale: హీబ్రూ కాలసూచక సూత్రానికి సహజమైన తెలుగు రూపం.
- source_word: וַיֵּשְׁבוּ תַּחְתֵּיהֶם
  choice: వారి స్థానంలో నివసించారు
  rationale: תחתיהם ఇక్కడ ‘వారికి బదులుగా/వారి స్థానంలో’ అనే స్థానభర్తీ భావాన్ని ఇస్తుంది.
- source_word: מִרְעֶה לְצֹאנָם
  choice: వారి మందలకు మేతభూమి
  rationale: מִרְעֶה యొక్క మేతభూమి భావాన్నీ, צֹאן సూచించగల గొర్రెలు-మేకల సమూహాన్ని ‘మందలు’ అనే విస్తృత పదంతోనూ నిలుపుతుంది.
theological_decisions:
- issue: חרם అనే పదంలోని ధార్మిక-సైనిక భావం
  choice: పూర్తిగా నాశనానికి అంకితం చేశారు
  alternative: పూర్తిగా నాశనం చేశారు
  rationale: మూలంలోని ‘నాశనానికి ప్రత్యేకించడం’ అనే సాంకేతిక ఉద్వేగాన్ని నిలుపుతూ, దానిని సాధారణ హత్య లేదా ఓటమిగా మాత్రమే మార్చకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే కథన శైలి. ‘హిజ్కియా,’ ‘మెయూనీయులు’ వంటి పేర్లు తెలుగు బైబిలు వాడుకకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి. మూలంలోని కష్టమైన జాతినామ పఠనాన్నీ, חרם పదంలోని సాంకేతిక ఉద్వేగాన్నీ పాదసూచికలు మరియు పదఎంపిక ద్వారా నిలిపాం.
