  naturalness: ‘పేరుపేరునా నమోదు చేయబడిన,’ ‘యూదా రాజైన హిజ్కియా కాలంలో,’ ‘వారి మందలకు మేతభూమి’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉన్నాయి. ‘గుడారాలను హతమార్చి’ మాత్రం అర్థపరంగా అసహజం; ‘దాడి చేసి’ అనే రూపం సందర్భానుకూలంగా, రెండింటికీ వర్తిస్తుంది.
