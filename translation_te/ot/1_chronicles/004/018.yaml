id: 1CH.4.18
reference: 1 Chronicles 4:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אִשְׁתּ֣/וֹ הַ/יְהֻדִיָּ֗ה יָלְדָ֞ה אֶת יֶ֨רֶד אֲבִ֤י גְדוֹר֙ וְ/אֶת חֶ֨בֶר֙ אֲבִ֣י שׂוֹכ֔וֹ וְ/אֶת יְקֽוּתִיאֵ֖ל אֲבִ֣י זָנ֑וֹחַ וְ/אֵ֗לֶּה בְּנֵי֙ בִּתְיָ֣ה בַת פַּרְעֹ֔ה אֲשֶׁ֥ר לָקַ֖ח מָֽרֶד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/018.yaml
  text: And his wife the Jewess bore Jered the father of Gedor[a], Heber the father of Soco, and Jekuthiel the father of Zanoah. These are the sons of Bithiah daughter of Pharaoh[c][b], whom Mered took as wife.
translation:
  language: te
  text: యూదురాలైన అతని భార్య[a] గెదోరుకు తండ్రియైన[b] యెరెదును, శోకోకు తండ్రియైన హెబెరును, జానోహకు తండ్రియైన యెకూతీయేలును కనింది. వీరు ఫరో కుమార్తె బిత్యా[c] కుమారులు; ఆమెను మెరెదు భార్యగా చేసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యూదయ ప్రాంతానికి చెందిన స్త్రీ’ లేదా ‘యూదు స్త్రీ’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: దినవృత్తాంతములలో ‘తండ్రి’ అనే మాట ఒక స్థలానికి లేదా వంశానికి సంబంధించిన స్థాపకుడు, పూర్వికుడు లేదా వంశాధిపతి అనే అర్థంలో కూడా వాడబడవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడి హీబ్రూ వాక్యనిర్మాణం క్లిష్టంగా ఉంది. ‘యూదురాలైన అతని భార్య’ మరియు ‘ఫరో కుమార్తె బిత్యా’ ఒకే స్త్రీని సూచిస్తాయని కొందరు, మెరెదు వేర్వేరు భార్యలను సూచిస్తాయని మరికొందరు అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: הַיְהֻדִיָּה
  choice: యూదురాలు
  rationale: స్త్రీలింగ జాతివాచకాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; యూదయ ప్రాంతానికి చెందిన స్త్రీ అనే భౌగోళిక భావం కూడా సాధ్యమేనని పాదటిప్పణిలో ఉంచాం.
- source_word: יָלְדָה
  choice: కనింది
  rationale: వంశావళి సందర్భంలో ‘కనింది’ సంక్షిప్తంగా, సహజంగా ఉండి హీబ్రూ క్రియార్థాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: אֲבִי
  choice: తండ్రియైన
  rationale: హీబ్రూ వంశావళి ప్రయోగాన్ని యథాతథంగా నిలుపుతుంది; ఇది స్థాపకుడు, పూర్వికుడు లేదా ఒక ప్రాంతంతో సంబంధమున్న వంశాధిపతి అనే విస్తృత భావం కలిగి ఉండవచ్చని పాదటిప్పణి వివరిస్తుంది.
- source_word: שׂוֹכוֹ
  choice: శోకో
  rationale: హీబ్రూ స్థలనామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: יְקוּתִיאֵל
  choice: యెకూతీయేలు
  rationale: వ్యక్తినామాన్ని హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: זָנוֹחַ
  choice: జానోహ
  rationale: స్థలనామాన్ని హీబ్రూ రూపానికి సమీపంగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: మూలపాఠంలో స్పష్టంగా ఉన్న పుంలింగ బహువచన సంబంధాన్ని కాపాడుతుంది.
- source_word: בִּתְיָה בַת פַּרְעֹה
  choice: ఫరో కుమార్తె బిత్యా
  rationale: హీబ్రూ అనుబంధ నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: לָקַח
  choice: భార్యగా చేసుకున్నాడు
  rationale: వివాహ సందర్భంలో ‘తీసుకున్నాడు’ అనే హీబ్రూ ప్రయోగానికి సహజమైన తెలుగు భావానువాదం; కేవలం స్వాధీనం చేసుకున్నాడనే అపార్థాన్ని నివారిస్తుంది.
- source_word: וְאֵלֶּה
  choice: వీరు
  rationale: ముందు పేర్కొన్న పురుషులను సంక్షిప్తంగా సూచించే సహజమైన తెలుగు రూపం; ప్రారంభ సంధికారకాన్ని తెలుగులో ప్రత్యేకంగా పలకకపోయినా భావనష్టం లేదు.
theological_decisions:
- issue: ‘యూదురాలైన అతని భార్య’కు, తరువాత పేర్కొన్న ‘ఫరో కుమార్తె బిత్యా’కు మధ్య సంబంధం
  choice: హీబ్రూ వాక్యక్రమాన్ని నిలిపి, ఇద్దరూ ఒకే స్త్రీనా లేక మెరెదు భార్యలుగా వేర్వేరు స్త్రీలా అన్నది ప్రధాన పాఠంలో నిర్ణయించలేదు.
  alternative: ‘యూదురాలు’ బిత్యానే అని స్పష్టీకరించడం, లేదా వారు మెరెదు వేర్వేరు భార్యలని తెలిపేలా వాక్యాన్ని పునర్నిర్మించడం.
  rationale: హీబ్రూ వాక్యనిర్మాణం క్లిష్టంగా ఉంది; రెండు అవగాహనలూ ప్రతిపాదించబడ్డాయి. మూలపాఠంలోని వంశావళి ఉద్రిక్తతను అనవసరంగా పరిష్కరించకుండా పాదటిప్పణిలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గంభీర శైలిని వాడాం. వ్యక్తి, స్థలనామాలను తెలుగు బైబిలు శైలికి అనుగుణంగా లిప్యంతరీకరించాం; మూలంలోని క్లిష్టతను ప్రధాన పాఠంలో పరిష్కరించకుండా పాదటిప్పణిలో సంరక్షించాం.
