id: 1CH.4.2
reference: 1 Chronicles 4:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/רְאָיָ֤ה בֶן שׁוֹבָל֙ הוֹלִ֣יד אֶת יַ֔חַת וְ/יַ֣חַת הֹלִ֔יד אֶת אֲחוּמַ֖י וְ/אֶת לָ֑הַד אֵ֖לֶּה מִשְׁפְּח֥וֹת הַ/צָּֽרְעָתִֽי־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/002.yaml
  text: Reaiah son of Shobal fathered Jahath[a], and Jahath fathered Ahumai and Lahad. These were the clans of the Zorathites.
translation:
  language: te
  text: షోబాలు కుమారుడైన రెయాయా యహతుకు తండ్రియైనాడు; యహతు అహుమయికీ లహదుకీ తండ్రియైనాడు. ఇవే జొర్యాతీయుల వంశాలు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కుటుంబాలు.” హీబ్రూ పదం విస్తృత బంధుత్వ సమూహాలను కూడా సూచించగలదు; గోత్ర వంశావళి సందర్భంలో ఇక్కడ “వంశాలు” అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאָיָה
  choice: రెయాయా
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: בֶן
  choice: కుమారుడైన
  rationale: వంశావళిలో ఇది ప్రత్యక్ష కుమారుడిని లేదా విస్తృత వంశసంబంధాన్ని సూచించగలదు; హీబ్రూ వాక్యరూపాన్ని నిలుపుతూ ‘కుమారుడైన’ అని ఇచ్చాం.
- source_word: הוֹלִיד / הֹלִיד
  choice: కనెను
  rationale: హిఫీల్ రూపం వంశావళిలో ‘కనడం/తండ్రి కావడం’ అనే భావాన్ని ఇస్తుంది; సంక్షిప్తమైన, గౌరవప్రదమైన తెలుగు వంశావళి శైలిగా ‘కనెను’ ఎంచుకున్నాం.
- source_word: יַחַת
  choice: యహతు
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: אֲחוּמַי
  choice: అహుమై
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించాం.
- source_word: לָהַד
  choice: లహదు
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించాం; విభక్తి సందర్భంలో ‘లహదును’ అయింది.
- source_word: אֵלֶּה
  choice: వీరు
  rationale: ముందు పేర్కొన్న వ్యక్తులను సహజమైన తెలుగులో సూచిస్తుంది; హీబ్రూలో లేని అదనపు వివరణను చేర్చదు.
- source_word: מִשְׁפְּחֹות
  choice: వంశాలు
  rationale: గోత్ర సంబంధ వంశావళి సందర్భంలో విస్తృత బంధుత్వ సమూహాలను సూచించే సహజమైన తెలుగు పదం.
- source_word: הַצָּרְעָתִי
  choice: జోర్యాతీయులు
  rationale: జోర్యా ప్రాంతం లేదా దాని వంశసమూహానికి చెందినవారిని సూచించే హీబ్రూ జాతివాచక రూపాన్ని తెలుగులో వ్యక్తం చేస్తుంది.
