translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలిని ఉపయోగించాం. పేర్లను హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం; ‘కనెను’ అనే రూపం బైబిలు వంశావళి శైలిని నిలుపుతూ సాధారణ పాఠకుడికి అర్థమయ్యేలా ఉంది.
