- from: షోబాలు కుమారుడైన రెయాయా యహతును కనెను; యహతు అహుమైని, లహదును కనెను. వీరు జోర్యాతీయుల వంశాలు[a].
  to: షోబాలు కుమారుడైన రెయాయా యహతుకు తండ్రియైనాడు; యహతు అహుమయికీ లహదుకీ తండ్రియైనాడు. ఇవే జొర్యాతీయుల వంశాలు[a].
