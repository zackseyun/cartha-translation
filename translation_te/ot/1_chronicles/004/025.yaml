  source_fidelity: సవరించిన పాఠం హీబ్రూ వంశావళి సూత్రాన్ని—“షల్లూము, అతని కుమారుడు; మిబ్సాము, అతని కుమారుడు; మిష్మా, అతని కుమారుడు”—అదనపు తండ్రి-పేరు పునరుక్తి లేకుండా నిలుపుతుంది. మొదటి ‘అతని’కి పూర్వవచనంలోని వ్యక్తే సూచన కావడం మూలంలోని విధానాన్నే ప్రతిబింబిస్తుంది.
