translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు. మూలంలోని సంక్షిప్త వంశావళి శైలిని నిలుపుకుంటూనే, తెలుగులో ‘అతని కుమారుడు’ అనే వరుస ప్రయోగం కలిగించగల అస్పష్టతను నివారించేందుకు ప్రతి కుమారుని తండ్రి పేరును స్పష్టంగా పునరుక్తి చేశాం.
