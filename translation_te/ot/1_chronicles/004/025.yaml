  text: షల్లూము అతని కుమారుడు, మిబ్సాము అతని కుమారుడు, మిష్మా అతని కుమారుడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלֻּם
  choice: షల్లూము
  rationale: వ్యక్తి పేరు; హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: בְּנוֹ
  choice: కుమారుడు
  rationale: בֵּן పదానికి మూడవ పురుష ఏకవచన పుంలింగ ప్రత్యయం కలిసిన రూపం, అక్షరార్థంగా ‘అతని కుమారుడు’. తెలుగులో వంశావళి సంబంధాన్ని సహజంగా, స్పష్టంగా చూపేందుకు ప్రతి సంబంధంలో తండ్రి పేరును పునరుక్తి చేశాం.
- source_word: מִבְשָׂם
  choice: మిబ్శాము
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపాన్ని అనుసరించి లిప్యంతరీకరించబడింది.
- source_word: מִשְׁמָע
  choice: మిష్మా
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపాన్ని అనుసరించి లిప్యంతరీకరించబడింది.
