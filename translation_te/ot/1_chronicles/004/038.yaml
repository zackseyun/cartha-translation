  source_fidelity: 'హీబ్రూ వాక్యనిర్మాణాన్ని అనువాదం సముచితంగా ప్రతిబింబిస్తుంది: పేర్లతో గుర్తించబడిన వ్యక్తులు తమ మిశ్పహోత్‌లో నాయకులుగా ఉన్నారు; వారి బేత్-అవోత్ సమృద్ధిగా విస్తరించింది. הַבָּאִים యొక్క అక్షరార్థ ‘వచ్చినవారు’ అనే అవకాశాన్ని పాదటిప్పణి నిలుపుతూ, వంశావళి-జాబితా సందర్భానికి సరిపోయే ‘నమోదు చేయబడిన’ అనే ప్రధాన అనువాదం ఇచ్చింది. פָּרְצוּ לָרֹב యొక్క సంఖ్యాపరమైన అభివృద్ధి భావం ‘ఎంతో విస్తరించాయి’లో సహజంగా ఉంది.'
  naturalness: ‘పేరుపేరున నమోదు చేయబడిన వీరు’ మరియు ‘తమ వంశాలలో నాయకులుగా ఉన్నారు’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, సహజంగా ఉన్నాయి. అర్థాన్ని మార్చకుండా సంక్షిప్తమైన వంశావళి-శైలిని కాపాడుతున్నాయి.
