source:
  edition: WLC
  text: אֵ֚לֶּה הַ/בָּאִ֣ים בְּ/שֵׁמ֔וֹת נְשִׂיאִ֖ים בְּ/מִשְׁפְּחוֹתָ֑/ם וּ/בֵית֙ אֲב֣וֹתֵי/הֶ֔ם פָּרְצ֖וּ לָ/רֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/038.yaml
  text: These[a], who were mentioned by name, were leaders in their clans[b], and their ancestral houses increased greatly.
translation:
  language: te
  text: పేరుపేరున నమోదు చేయబడిన వీరు[a] తమ వంశాలలో నాయకులుగా ఉన్నారు; వారి పితృవంశాలు ఎంతో విస్తరించాయి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పేర్లతో వచ్చిన వీరు.” హెబ్రీ కృదంతానికి అక్షరార్థం “వస్తున్నవారు”; అయితే ఇక్కడ అది వంశావళి జాబితాలో పేర్లతో నమోదు చేయబడిన వారిని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “వారి పితృగృహాలు విస్తారంగా వ్యాపించాయి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: వీరు
  rationale: ముందటి వంశావళిలో పేర్కొన్న వ్యక్తుల సమూహాన్ని సూచించే బహువచన సర్వనామం; ఆధునిక తెలుగులో వ్యక్తులకు సహజమైన రూపం.
- source_word: הַבָּאִים בְּשֵׁמוֹת
  choice: పేరుపేరున నమోదు చేయబడిన
  rationale: בוא అనే కృదంతానికి అక్షరార్థంగా ‘వచ్చిన’ అని ఉన్నప్పటికీ, పేర్ల జాబితా సందర్భంలో నమోదైన లేదా పేర్కొనబడిన వారిని సూచిస్తుంది; בְּשֵׁמוֹת వ్యక్తిగతంగా పేర్లతో నమోదవడాన్ని తెలియజేస్తుంది.
- source_word: נְשִׂיאִים
  choice: నాయకులు
  rationale: వంశ లేదా గోత్ర సమూహాల్లో అధికారం, ప్రముఖ స్థానం కలిగినవారిని సూచిస్తుంది; ‘రాజకుమారులు’ అనే రాజవంశ భావాన్ని అనవసరంగా చేర్చకుండా ‘నాయకులు’ మూలార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: בְּמִשְׁפְּחוֹתָם
  choice: తమ వంశాలలో
  rationale: ఇక్కడ מִשְׁפָּחָה ఆధునిక అణుకుటుంబం కంటే విస్తృతమైన బంధుత్వ వర్గాన్ని సూచిస్తుంది; ‘వంశాలు’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וּבֵית אֲבוֹתֵיהֶם
  choice: వారి పితృవంశాలు
  rationale: అక్షరార్థమైన ‘వారి తండ్రుల ఇళ్లు’ కంటే పితృపరంపర ఆధారిత వంశగృహాలు లేదా వంశశాఖలు అనే సామాజిక భావాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: פָּרְצוּ לָרֹב
  choice: ఎంతో విస్తరించాయి
  rationale: פָּרְצוּలోని ఉప్పొంగి వ్యాపించడం లేదా పెరగడం అనే భావాన్నీ, לָרֹבలోని సమృద్ధి/అధిక సంఖ్య భావాన్నీ కలిపి తెలియజేస్తుంది.
