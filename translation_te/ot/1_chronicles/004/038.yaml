  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళి సందర్భానికి తగిన గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘వంశాలు’ మరియు ‘పితృవంశాలు’ ద్వారా రెండు బంధుత్వ పదబంధాల మధ్య ఉన్న స్వల్ప భేదాన్ని నిలుపుకుంది.
