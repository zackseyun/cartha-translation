translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన వంశావళి శైలిని ఉపయోగించింది. వ్యక్తుల సంఖ్యను సూచించడానికి ‘మంది/గురు’ రూపాలు సహజంగా వాడబడ్డాయి; ‘సహోదరులు’, ‘వంశాలు’ అనే పదాలు సందర్భానికి తగిన గంభీరతను నిలుపుతాయి.
