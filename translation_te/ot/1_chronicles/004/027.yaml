source:
  edition: WLC
  text: וּ/לְ/שִׁמְעִ֞י בָּנִ֨ים שִׁשָּׁ֤ה עָשָׂר֙ וּ/בָנ֣וֹת שֵׁ֔שׁ וּ/לְ/אֶחָ֕י/ו אֵ֖ין בָּנִ֣ים רַבִּ֑ים וְ/כֹל֙ מִשְׁפַּחְתָּ֔/ם לֹ֥א הִרְבּ֖וּ עַד בְּנֵ֥י יְהוּדָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/027.yaml
  text: Shimei had sixteen sons and six daughters[a], but his brothers did not have many sons, and all their clans did not multiply as much as the sons of Judah.
translation:
  language: te
  text: షిమీకి పదహారు మంది కుమారులు, ఆరుగురు కుమార్తెలు ఉన్నారు. అయితే అతని సహోదరులకు ఎక్కువమంది కుమారులు లేరు; వారి వంశాలన్నీ యూదా కుమారులంతగా పెరగలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదా కుమారులంత సంఖ్యలో పెరగలేదు.”
    reason: עַד בְּנֵי יְהוּדָה అనే పదబంధం యూదా కుమారుల సంఖ్యా స్థాయికి చేరకపోవడాన్ని సూచిస్తుందని స్పష్టం చేసే ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: וּלְשִׁמְעִי
  choice: షిమీకి ... ఉన్నారు
  rationale: వంశావళి సందర్భంలో לְ ఉపసర్గతో వచ్చిన ఈ నిర్మాణం స్వామ్యాన్ని లేదా కలిగియుండడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ‘షిమీకి ... ఉన్నారు’ అని అనువదించబడింది.
- source_word: בָּנִים שִׁשָּׁה עָשָׂר וּבָנוֹת שֵׁשׁ
  choice: పదహారు మంది కుమారులు, ఆరుగురు కుమార్తెలు
  rationale: మూలంలోని సంఖ్యలను, బంధుత్వ పదాలను యథాతథంగా ఉంచుతూ తెలుగు సహజ పదక్రమాన్ని అనుసరించింది.
- source_word: וּלְאֶחָיו
  choice: అయితే అతని సహోదరులకు
  rationale: וְ అక్షరార్థంగా ‘మరియు’ అయినప్పటికీ, ఇక్కడ షిమీ సంతానానికి అతని సహోదరుల సంతానానికి మధ్య వ్యత్యాసం ఉంది; అందువల్ల ‘అయితే’ సందర్భ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: אֵין בָּנִים רַבִּים
  choice: ఎక్కువమంది కుమారులు లేరు
  rationale: అస్తిత్వ నిరాకరణను సూచించే אֵין భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, רַבִּיםను అతిశయింపకుండా ‘ఎక్కువమంది’గా అనువదించింది.
- source_word: וְכֹל מִשְׁפַּחְתָּם
  choice: వారి వంశాలన్నీ
  rationale: వంశావళి సందర్భంలో מִשְׁפָּחָה కేవలం అణుకుటుంబాన్ని కాక విస్తృత బంధువర్గం లేదా వంశశాఖను సూచిస్తుంది; అందుకే ‘వంశాలు’ ఎంచుకోబడింది.
- source_word: לֹא הִרְבּוּ
  choice: విస్తరించలేదు
  rationale: רבה హిఫీల్ రూపం ఇక్కడ సంఖ్యాపరంగా పెరగడం లేదా విస్తరించడాన్ని సూచిస్తుంది; ‘విస్తరించలేదు’ వంశవృద్ధి భావాన్ని సహజంగా అందిస్తుంది.
- source_word: עַד בְּנֵי יְהוּדָה
  choice: యూదా కుమారులంతగా
  rationale: עַד ఇక్కడ స్థల దిశను కాక పరిమాణ స్థాయిని సూచిస్తుంది; వారి వంశాలు యూదా సంతతి స్థాయికి చేరలేదనే తులనను ‘అంతగా’ తెలియజేస్తుంది.
