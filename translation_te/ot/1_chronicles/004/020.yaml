  source_fidelity: 'హీబ్రూ వంశావళి నిర్మాణం మరియు పేర్ల క్రమం సరిగ్గా ప్రతిఫలించాయి: షిమోను కుమారులుగా అమ్నోను, రిన్నా, బెన్-హానాను, తీలోను; ఇషీ కుమారులుగా జోహేతు, బెన్-జోహేతు. בֶּן חָנָן మరియు בֶן זוֹחֵתలను జాబితాలోని వ్యక్తినామాలుగా తీసుకోవడం సందర్భానుకూలం; వాటి ప్రత్యామ్నాయ ప్రత్యక్ష అర్థాలు పాదసూచికల్లో నిలిపబడ్డాయి.'
