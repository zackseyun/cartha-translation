  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֣י שִׁימ֔וֹן אַמְנ֣וֹן וְ/רִנָּ֔ה בֶּן חָנָ֖ן ו/תולון וּ/בְנֵ֣י יִשְׁעִ֔י זוֹחֵ֖ת וּ/בֶן זוֹחֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/020.yaml
  text: 'The sons of Shimon: Amnon and Rinnah[a], Ben-Hanan and Tilon[b]. And the sons of Ishi: Zoheth and Ben-Zoheth.'
translation:
  language: te
  text: 'షిమోను కుమారులు: అమ్నోను, రిన్నా, బెన్-హానాను[a], తీలోను. ఇషీ కుమారులు: జోహేతు, బెన్-జోహేతు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హానాను కుమారుడు.” అయితే ఈ వంశావళి జాబితాలో “బెన్-హానాను” అనేది వ్యక్తినామంగా ఉండే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “జోహేతు కుమారుడు.” అయితే ఈ వంశావళి జాబితాలో “బెన్-జోహేతు” అనేది వ్యక్తినామంగా ఉండే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי שִׁימוֹן
  choice: షిమోను కుమారులు
  rationale: బְּנֵי అనే వంశావళి నిర్మాణాన్ని సహజమైన తెలుగులో ‘కుమారులు’గా అనువదించాం. వాక్యారంభంలోని וּ సంధిని విడిగా ‘మరియు’ అని పెట్టకుండా జాబితా కొనసాగింపుగా గ్రహించాం. שִׁימוֹן పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా ‘షిమోను’గా లిప్యంతరీకరించాం.
- source_word: אַמְנוֹן וְרִנָּה
  choice: అమ్నోను, రిన్నా
  rationale: రెండు వ్యక్తినామాలను మూలభాష ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించి, తెలుగు జాబితా శైలిలో విరామచిహ్నంతో కలిపాం.
- source_word: בֶּן חָנָן
  choice: బెన్-హానాను
  rationale: వంశావళి పేర్ల వరుసలో ఇది కొత్త ‘ఫలానివాని కుమారుడు’ అనే వాక్యభాగం కంటే సంయుక్త వ్యక్తినామంగా పనిచేసే అవకాశమే ఎక్కువ. అయినా పదబంధపు ప్రత్యక్ష అర్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: וְתולון
  choice: తీలోను
  rationale: వ్యక్తినామాన్ని ప్రాచుర్యంలో ఉన్న మసొరేటిక్ పఠనానికి అనుగుణంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וּבְנֵי יִשְׁעִי
  choice: ఇషీ కుమారులు
  rationale: పునరావృతమైన వంశావళి సూత్రాన్ని ‘కుమారులు’గా నేరుగా అనువదించాం; וּ సంధి జాబితా కొనసాగింపును సూచిస్తున్నందున తెలుగులో తప్పనిసరిగా ‘మరియు’ అని పునరుక్తి చేయలేదు.
- source_word: זוֹחֵת
  choice: జోహేతు
  rationale: వ్యక్తినామాన్ని హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וּבֶן זוֹחֵת
  choice: బెన్-జోహేతు
  rationale: దీనికి తరువాత మరో వ్యక్తినామం లేకపోవడం, అలాగే ఇది పేర్ల జాబితాలో ఉండడం వల్ల మొత్తం రూపాన్ని వ్యక్తినామంగా తీసుకున్నాం. ‘జోహేతు కుమారుడు’ అనే సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
