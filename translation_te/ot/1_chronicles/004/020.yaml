translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలిని వాడాం. వ్యక్తినామాలను మూల హీబ్రూకు దగ్గరగా, తెలుగు పాఠకులు సులభంగా పలకగల రూపాల్లో ఇచ్చాం. బంధార్థమా వ్యక్తినామమా అన్న నిజమైన సందిగ్ధతను పాదసూచికల్లో నిలిపాం.
