base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/008.yaml
  text: Elishama[a], Eliada, and Eliphelet—nine.
translation:
  language: te
  text: ఎలీషామా[a], ఎల్యాదా, ఎలీఫెలెతు—మొత్తం తొమ్మిదిమంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, 5–8 వచనాల్లో పేర్కొన్న కుమారుల మొత్తం సంఖ్య తొమ్మిది.
    reason: cross_reference
lexical_decisions:
- source_word: אֱלִישָׁמָע
  choice: ఎలీషామా
  rationale: వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు సమీపంగా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: אֶלְיָדָע
  choice: ఎల్యాదా
  rationale: వ్యక్తి పేరును హెబ్రీ రూపానికి సమీపంగా, తెలుగులో సహజంగా పలికే విధంగా లిప్యంతరీకరించాం.
- source_word: אֱלִיפֶלֶט
  choice: ఎలీఫెలెతు
  rationale: ఈ వచనంలోని పూర్తి హెబ్రీ రూపాన్ని ప్రతిబింబించేలా లిప్యంతరీకరించాం; తెలుగులో పదాంత వ్యంజన సమూహాన్ని సులభంగా పలకడానికి చివర ‘తు’ వాడాం.
- source_word: וְ / וֶ
  choice: జాబితా విరామచిహ్నాలు
  rationale: ప్రతి పేరుకు ముందు ఉన్న సంధికారకాన్ని తెలుగులో సహజమైన జాబితా శైలిలో కామాలతో సూచించాం; విడిగా ‘మరియు’ పునరావృతం చేయలేదు.
- source_word: תִּשְׁעָה
  choice: మొత్తం తొమ్మిదిమంది
  rationale: మూలంలో ‘తొమ్మిది’ అని మాత్రమే ఉన్నా, సందర్భంలో 5–8 వచనాల్లో పేర్కొన్న కుమారుల సంఖ్యను సంగ్రహిస్తుంది. వ్యక్తుల లెక్క అని స్పష్టమయ్యేలా ‘మంది’, సంగ్రహ భావానికి ‘మొత్తం’ చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్త జాబితా శైలిని ఉపయోగించాం. పేర్లను అనువదించకుండా హెబ్రీ రూపాలకు సమీపంగా లిప్యంతరీకరించాం; ముగింపు సంఖ్యను సాధారణ పాఠకుడికి స్పష్టంగా ఉండేలా సహజీకరించాం.
