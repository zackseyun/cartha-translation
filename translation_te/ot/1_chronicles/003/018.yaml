  text: Malchiram[a], Pedaiah, Shenazzar, Jekamiah, Hoshama, and Nedabiah.
translation:
  language: te
  text: మల్కీరాము[a], పెదాయా, షెనత్స్సరు, యెకమ్యా, హోషామా, మరియు నెదబ్యా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ వ్యక్తి పేర్లను తెలుగులో వేరువేరు విధాలుగా లిప్యంతరీకరించవచ్చు. ఉదాహరణకు, ‘మల్కీరాము’ అనే పేరును ‘మల్కిరాము’ అని కూడా రాయవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכִּירָם
  choice: మల్కీరాము
  rationale: వంశావళిలోని వ్యక్తి పేరు; హీబ్రూ వ్యంజనాలు, అచ్చులను సహజమైన తెలుగు లిప్యంతరీకరణలో ప్రతిబింబించాం.
- source_word: פְדָיָה
  choice: పెదాయా
  rationale: వ్యక్తి పేరు; చివరి దైవనామ సంబంధిత భాగాన్ని తెలుగు బైబిలు పేర్లలో సహజంగా వినిపించే ‘యా’గా లిప్యంతరీకరించాం.
- source_word: שֶׁנְאַצַּר
  choice: షెనస్సరు
  rationale: వ్యక్తి పేరు; హీబ్రూలో సూచితమైన ద్విత్వ צ ధ్వనిని ‘స్స’తో, చివరి ధ్వనిని తెలుగు ఉచ్చారణకు అనుకూలంగా ప్రతిబింబించాం.
- source_word: יְקַמְיָה
  choice: యెకమ్యా
  rationale: వ్యక్తి పేరు; ఆరంభ యోడ్‌ను ‘యె’గా, చివరి -יָה భాగాన్ని ‘యా’గా లిప్యంతరీకరించాం.
- source_word: הוֹשָׁמָע
  choice: హోషామా
  rationale: వ్యక్తి పేరు; హీబ్రూ స్వరరూపాన్ని సాధ్యమైనంత దగ్గరగా, సహజమైన తెలుగు ఉచ్చారణతో అందించాం.
- source_word: נְדַבְיָה
  choice: నెదబ్యా
  rationale: వ్యక్తి పేరు; హీబ్రూ రూపంలోని ధ్వనులను సంక్షిప్తమైన తెలుగు లిప్యంతరీకరణలో నిలిపాం.
- source_word: וּ / וְ
  choice: జాబితా విరామచిహ్నాలు
  rationale: హీబ్రూ సంధాన అవ్యయాలు పేర్లను జాబితాగా కలుపుతున్నాయి; తెలుగులో సహజంగా ఉండేందుకు కామాలతో వరుసను చూపించాం.
