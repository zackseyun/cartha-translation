translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. పేర్లు ఇంగ్లీషు రూపాలనుంచి కాకుండా హీబ్రూ మూలరూపాల ఆధారంగా లిప్యంతరీకరించబడ్డాయి.
