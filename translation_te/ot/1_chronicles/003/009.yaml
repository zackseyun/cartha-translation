translation:
  language: te
  text: వీరందరూ దావీదు కుమారులు, ఉపపత్నుల కుమారులు తప్ప; తామారు వారి సోదరి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּל בְּנֵי דָוִיד
  choice: వీరందరూ దావీదు కుమారులు
  rationale: כֹּל ఇంతకుముందు పేర్కొన్న పేర్లన్నిటినీ సమగ్రంగా సూచిస్తుంది. తెలుగులో ‘వీరందరూ’ వంశావళి సారాంశానికి సహజంగా ఉంటుంది; בְּנֵי అనే పుంలింగ బహువచనాన్ని ‘కుమారులు’గా నిలుపుతుంది.
- source_word: מִלְּבַד
  choice: వీరిలో లేరు
  rationale: ఈ సందర్భంలో מִלְּבַד ముందటి జాబితా నుండి ఉపపత్నుల కుమారులను మినహాయిస్తున్న భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది. అయితే ‘వారితోపాటు/వారికి అదనంగా’ అనే భావసాధ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: בְּנֵי פִילַגְשִׁים
  choice: ఉపపత్నుల కుమారులు
  rationale: హీబ్రూ పదబంధంలోని పుంలింగ బహువచనాన్ని కాపాడుతూ, రాజకుటుంబ సందర్భంలోని פִילַגְשִׁים సామాజిక స్థితిని ఆధునిక ప్రామాణిక తెలుగులో ‘ఉపపత్నులు’గా వ్యక్తం చేస్తుంది.
- source_word: וְתָמָר אֲחוֹתָם
  choice: తామారు వీరికి సోదరి
  rationale: హీబ్రూలో క్రియలేని సంబంధవాక్యాన్ని తెలుగులో సహజంగానే క్రియ లేకుండా అందించవచ్చు. אֲחוֹתָם సూచించే సంబంధాన్ని ‘వీరికి సోదరి’గా స్పష్టంగా నిలుపుతుంది.
theological_decisions: []
