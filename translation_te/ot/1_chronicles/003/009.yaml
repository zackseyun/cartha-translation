  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళికి తగిన సంక్షిప్త, గౌరవప్రద శైలి. ‘ఉపపత్ని’ అనే పదం פִילֶגֶשׁ‌కు సామాజికంగా, చారిత్రకంగా ఖచ్చితమైన సాధారణ తెలుగు సమానార్థకంగా ఎంచుకోబడింది.
