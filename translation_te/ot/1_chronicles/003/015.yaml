base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/015.yaml
  text: 'And the sons of Josiah: the firstborn[a], Johanan; the second, Jehoiakim; the third, Zedekiah; the fourth, Shallum.'
translation:
  language: te
  text: 'యోషీయా కుమారులు: మొదట పుట్టినవాడు యోహానాను[a]; రెండోవాడు యెహోయాకీము; మూడోవాడు సిద్కియా; నాలుగోవాడు షల్లూము.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: షల్లూమును సాధారణంగా 2 రాజులు 23:30–34లో యెహోయాహాజుగా, యిర్మీయా 22:11లో షల్లూముగా ప్రస్తావించబడిన వ్యక్తితో ఒకే వ్యక్తిగా గుర్తిస్తారు; అయితే వృత్తాంతకర్త యోషీయా వంశావళిలో ఇక్కడ ‘షల్లూము’ అనే పేరును నిలిపాడు.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: వంశావళి సందర్భంలో בְנֵי ప్రత్యక్ష కుమారులను సూచిస్తుంది. వాక్యారంభంలోని ו జాబితా కొనసాగింపును సూచించినా, ఆధునిక సహజ తెలుగు వాక్యంలో ప్రత్యేకంగా ‘మరియు’ అని పలకకుండానే ఆ ప్రవాహం నిలుస్తుంది.
- source_word: יֹאשִׁיָּהוּ
  choice: యోషీయా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో స్థిరపడిన రూపం.
- source_word: הַבְּכוֹר
  choice: మొదట పుట్టినవాడు
  rationale: בכור జననక్రమాన్ని, మొదటి సంతాన స్థితిని సూచిస్తుంది; ‘మొదటివాడు’ కంటే ఈ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: יוֹחָנָן
  choice: యోహానాను
  rationale: హీబ్రూ יוֹחָנָן పేరును తెలుగు ధ్వన్యనుసారంగా ప్రతిలిపి చేసిన రూపం.
- source_word: הַשֵּׁנִי
  choice: రెండోవాడు
  rationale: కుమారుల జననక్రమంలోని రెండవ స్థానాన్ని సహజ తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: יְהוֹיָקִים
  choice: యెహోయాకీము
  rationale: మూలపాఠంలో ఉన్న యెహోయాకీము అనే పేరునే నిలిపి, ఎల్యాకీము అనే ప్రత్యామ్నాయ పేరుతో మార్చలేదు.
- source_word: הַשְּׁלִשִׁי
  choice: మూడోవాడు
  rationale: జాబితాలోని మూడవ స్థానాన్ని నేరుగా, సమాంతర నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: צִדְקִיָּהוּ
  choice: సిద్కియా
  rationale: హీబ్రూ రాజనామానికి తెలుగులో సుపరిచితమైన రూపం.
- source_word: הָרְבִיעִי
  choice: నాలుగోవాడు
  rationale: జాబితాలోని నాలుగవ స్థానాన్ని నేరుగా, మిగతా సంఖ్యాక్రమ పదాలకు అనుగుణంగా వ్యక్తం చేస్తుంది.
- source_word: שַׁלּוּם
  choice: షల్లూము
  rationale: మూల హీబ్రూ పాఠంలో ఉన్న వ్యక్తినామాన్ని అనువదించకుండా ధ్వన్యనుసారంగా నిలిపింది.
theological_decisions:
- issue: వంశావళి జననక్రమం మరియు రాజ్యపాలనా క్రమం మధ్య ఉన్న ఉద్రిక్తత
  choice: హీబ్రూ పాఠం ఇచ్చిన పేర్లను, వాటికి జతచేసిన జననక్రమ సూచనలను యథాతథంగా నిలిపాం.
  alternative: యోషీయా తరువాత రాజులైన వారి పాలనాక్రమానికి సరిపడేలా పేర్లను మార్చడం లేదా ప్రధాన పాఠంలోనే సమన్వయం చేయడం.
  rationale: ఈ వచనం పాలనాక్రమాన్ని కాక కుమారుల జాబితాను క్రమసూచకాలతో ఇస్తుంది. ఇతర చారిత్రక వర్ణనలతో కనిపించే ఉద్రిక్తతను ప్రధాన పాఠాన్ని మార్చకుండా పాదసూచికలో తెలియజేయడం మూలాధారానికి నిబద్ధమైన విధానం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలి. సంఖ్యాక్రమాన్ని స్పష్టంగా చూపేందుకు ‘మొదట పుట్టినవాడు; రెండోవాడు; మూడోవాడు; నాలుగోవాడు’ అనే సమాంతర నిర్మాణం వాడబడింది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో సంబంధిత మొదటి పేరుకే జతచేయబడింది.
