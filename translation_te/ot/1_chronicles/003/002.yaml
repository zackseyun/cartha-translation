id: 1CH.3.2
reference: 1 Chronicles 3:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הַ/שְּׁלִשִׁי֙ לְ/אַבְשָׁל֣וֹם בֶּֽן מַעֲכָ֔ה בַּת תַּלְמַ֖י מֶ֣לֶךְ גְּשׁ֑וּר הָ/רְבִיעִ֖י אֲדֹנִיָּ֥ה בֶן חַגִּֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/002.yaml
  text: the third[a], Absalom son of Maacah, daughter of Talmai king of Geshur; the fourth, Adonijah son of Haggith.
translation:
  language: te
  text: మూడవవాడు, గెషూరు రాజైన తల్మయి కుమార్తె[a] మయకాకు పుట్టిన అబ్షాలోము; నాలుగవవాడు, హగ్గీతుకు పుట్టిన అదోనీయా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, వంశావళి సందర్భాల్లో “కుమార్తె” అనే పదం కొన్నిసార్లు మరింత దూరపు స్త్రీ సంతతిని సూచించగలదు కాబట్టి, “తల్మయి మనవరాలు” అని కూడా భావించే అవకాశం ఉంది. అయితే ఇక్కడి హీబ్రూ ప్రత్యక్షంగా “గెషూరు రాజైన తల్మయి కుమార్తె” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁלִשִׁי
  choice: మూడవవాడు
  rationale: దావీదు కుమారుల వరుసలో పుంలింగ ఏకవచన క్రమసంఖ్య; తెలుగులో జాబితా నిర్మాణానికి సహజమైన రూపం.
- source_word: לְאַבְשָׁלוֹם בֶּן מַעֲכָה
  choice: మయకాకు పుట్టిన అబ్షాలోము
  rationale: హీబ్రూ వంశావళి సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; לְ ఉపసర్గ జాబితాలో వ్యక్తిని సూచిస్తుంది, בֶּן తల్లితో కుమార సంబంధాన్ని తెలుపుతుంది.
- source_word: בַּת תַּלְמַי
  choice: తల్మయి కుమార్తె
  rationale: בַּת యొక్క ప్రత్యక్ష అర్థమైన ‘కుమార్తె’ను నిలిపింది; వంశావళి సందర్భంలో విస్తృత స్త్రీ సంతతి అనే అవకాశం పాదసూచికలో ఉంచింది.
- source_word: מֶלֶךְ גְּשׁוּר
  choice: గెషూరు రాజైన
  rationale: తల్మయి గెషూరుకు రాజు అనే సమాస సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הָרְבִיעִי
  choice: నాలుగవవాడు
  rationale: ముందటి క్రమసంఖ్యను కొనసాగించే పుంలింగ ఏకవచన రూపం.
- source_word: אֲדֹנִיָּה בֶן חַגִּית
  choice: హగ్గీతుకు పుట్టిన అదోనీయా
  rationale: పేర్లను లిప్యంతరీకరించి, తల్లి-కుమార సంబంధాన్ని సహజ తెలుగు వంశావళి శైలిలో తెలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలి వాడబడింది. వ్యక్తి, స్థల నామాలు హీబ్రూ రూపాలకు సమీపంగా లిప్యంతరీకరించబడ్డాయి; మయకా ఎవరి కుమార్తె అనే సంబంధం సందిగ్ధం కాకుండా పదక్రమం అమర్చబడింది.
