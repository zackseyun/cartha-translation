translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన వంశావళి శైలి. హీబ్రూ పాఠ్యంలోని సంక్షిప్తతను, ‘అతని కుమారుడు’ అనే పునరుక్త క్రమాన్ని నిలుపుకుంది.
