  text: וּ/בֶן שְׁלֹמֹ֖ה רְחַבְעָ֑ם אֲבִיָּ֥ה בְנ֛/וֹ אָסָ֥א בְנ֖/וֹ יְהוֹשָׁפָ֥ט בְּנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/010.yaml
  text: And the son of Solomon was Rehoboam; Abijah his son[a], Asa his son, Jehoshaphat his son.
translation:
  language: te
  text: సొలొమోను కుమారుడు రెహబాము; అతని కుమారుడు అబీయా[a], అతని కుమారుడు ఆసా, అతని కుమారుడు యెహోషాపాతు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: ‘అబీయా.’ 1–2 రాజులు గ్రంథాల్లో ఇదే రాజు ‘అబీయాము’ అనే భిన్న నామరూపంతో కూడా ప్రస్తావించబడ్డాడు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בֶן
  choice: కుమారుడు
  rationale: వంశావళిలో తదుపరి తరాన్ని సూచించే సంధాన నిర్మాణం. తెలుగులో వాక్యారంభంలో ‘మరియు’ అనడం అసహజంగా ఉండటంతో, అనుసంధానం వంశావళి క్రమం ద్వారానే స్పష్టమవుతుంది.
- source_word: שְׁלֹמֹה
  choice: సొలొమోను
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
- source_word: רְחַבְעָם
  choice: రెహబాము
  rationale: హీబ్రూ వ్యక్తినామానికి సమీపమైన, తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
- source_word: אֲבִיָּה
  choice: అబీయా
  rationale: ఈ వచనంలో ఉన్న అబీయా అనే హీబ్రూ నామరూపాన్నే అనుసరిస్తుంది; రాజుల గ్రంథాల్లో కనిపించే అబీయాము అనే భిన్న రూపాన్ని ప్రధాన పాఠ్యంలోకి తీసుకురాదు.
- source_word: בְנ/וֹ
  choice: అతని కుమారుడు
  rationale: మూడవ పురుష ఏకవచన స్వామ్య ప్రత్యయాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, వంశావళి పునరుక్త లయను నిలుపుతుంది.
- source_word: אָסָא
  choice: ఆసా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
- source_word: יְהוֹשָׁפָט
  choice: యెహోషాపాతు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
