source:
  edition: WLC
  text: וּ/בֶן חֲנַנְיָ֖ה פְּלַטְיָ֣ה וִ/ישַֽׁעְיָ֑ה בְּנֵ֤י רְפָיָה֙ בְּנֵ֣י אַרְנָ֔ן בְּנֵ֥י עֹבַדְיָ֖ה בְּנֵ֥י שְׁכַנְיָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/021.yaml
  text: 'And the sons of Hananiah: Pelatiah and Jeshaiah; the sons of Rephaiah[a], the sons of Arnan, the sons of Obadiah, the sons of Shecaniah.'
translation:
  language: te
  text: 'మరియు హనన్యా కుమారుడు: పెలట్యా, యెషయా; రెఫాయా కుమారులు[a], అర్నాను కుమారులు, ఓబద్యా కుమారులు, షెకన్యా కుమారులు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా ఉండి కొంత క్లిష్టంగా ఉంది. అక్షరార్థంగా, “మరియు హనన్యా కుమారుడు: పెలట్యా, యెషయా; రెఫాయా కుమారులు, అర్నాను కుమారులు, ఓబద్యా కుమారులు, షెకన్యా కుమారులు” అని ఉంది. ఈ వరుసలోని కొంత భాగాన్ని తక్షణ కుమారులుగా కాక, విస్తృతమైన వంశస్థుల పరంపరగా కూడా అర్థం చేసుకోవచ్చు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֶן
  choice: కుమారుడు
  rationale: హీబ్రూ పాఠంలో ఏకవచన రూపం ఉంది. తరువాత రెండు పేర్లు రావడం వల్ల వాక్యనిర్మాణం కఠినంగా ఉన్నప్పటికీ, దానిని బహువచనంగా మార్చకుండా మూలంలోని ఉద్విగ్నతను నిలిపాం; ముందున్న וּ భావం వంశావళి కొనసాగింపులో సహజంగా అంతర్లీనమవుతుంది.
- source_word: חֲנַנְיָה
  choice: హనన్యా
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణలో ఇచ్చాం.
- source_word: פְּלַטְיָה
  choice: పెలట్యా
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: וִישַׁעְיָה
  choice: యెషయా
  rationale: సంబంధిత ప్రసిద్ధ నామరూపంతో గందరగోళం తగ్గిస్తూ, ఇక్కడి హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించాం; సంధర్భంలోని జాబితా విరామచిహ్నంతో conjunction భావం వ్యక్తమవుతుంది.
- source_word: בְּנֵי
  choice: కుమారులు
  rationale: పునరావృతమయ్యే వంశావళి పదాన్ని సాధారణ అర్థమైన ‘కుమారులు’గా ఇచ్చాం. ఇది విస్తృతంగా ‘వంశస్థులు’ అని కూడా సూచించగలదనే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: רְפָיָה
  choice: రెఫాయా
  rationale: వ్యక్తి పేరుకు తెలుగు లిప్యంతరీకరణ.
- source_word: אַרְנָן
  choice: అర్నాను
  rationale: వ్యక్తి పేరును తెలుగు వాక్యంలో సహజంగా చదవదగిన రూపంలో లిప్యంతరీకరించాం.
- source_word: עֹבַדְיָה
  choice: ఓబద్యా
  rationale: వ్యక్తి పేరుకు హీబ్రూ రూపాన్ని ప్రతిబింబించే తెలుగు లిప్యంతరీకరణ.
- source_word: שְׁכַנְיָה
  choice: షెకన్యా
  rationale: వ్యక్తి పేరుకు హీబ్రూ ధ్వనికి సమీపమైన తెలుగు లిప్యంతరీకరణ.
