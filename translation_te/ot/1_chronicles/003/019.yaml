translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలిని అనుసరించాం. వ్యక్తినామాలను మూల హీబ్రూ ఉచ్చారణకు దగ్గరగా, తెలుగు పఠనానికి అనుకూలంగా లిప్యంతరీకరించాం; మూలపాఠంలోని ఏకవచన అసాధారణతను పాదటిప్పణిలో స్పష్టంగా కాపాడాం.
