id: 1CH.3.19
reference: 1 Chronicles 3:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֣י פְדָיָ֔ה זְרֻבָּבֶ֖ל וְ/שִׁמְעִ֑י וּ/בֶן זְרֻבָּבֶל֙ מְשֻׁלָּ֣ם וַ/חֲנַנְיָ֔ה וּ/שְׁלֹמִ֖ית אֲחוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/019.yaml
  text: 'The sons of Pedaiah: Zerubbabel and Shimei[a]. And the sons of Zerubbabel: Meshullam and Hananiah; and Shelomith was their sister.'
translation:
  language: te
  text: 'పెదాయా కుమారులు: జెరుబ్బాబెలు, షిమీ. జెరుబ్బాబెలు కుమారులు[a]: మెషుల్లాము, హనన్యా; షెలోమీతు వారి సహోదరి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ఇక్కడ “జెరుబ్బాబెలు కుమారుడు” అని ఏకవచనంలో ఉంది. అయితే తరువాత మెషుల్లాము, హనన్యా అనే ఇద్దరి పేర్లు వస్తున్నందున, చాలామంది దీనిని పాఠంలోని అసాధారణతగా లేదా సమూహార్థంలో వాడిన వంశావళి ప్రయోగంగా అర్థం చేసుకుంటారు.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי פְדָיָה
  choice: పెదాయా కుమారులు
  rationale: వంశావళి సందర్భంలో בְּנֵי సాధారణంగా ప్రత్యక్ష కుమారులను సూచిస్తుంది. తెలుగు వంశావళి శైలిలో సహజంగా ఉండేందుకు ప్రారంభ సంధికారకాన్ని విడిచిపెట్టాం.
- source_word: זְרֻבָּבֶל
  choice: జెరుబ్బాబెలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు పాఠకులకు పరిచితమైన రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וְשִׁמְעִי
  choice: షిమీ
  rationale: వ్యక్తినామాన్ని మూల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం; జాబితాలో సమన్వయాన్ని తెలుగులో విరామచిహ్నంతో సహజంగా చూపించాం.
- source_word: וּבֶן זְרֻבָּבֶל
  choice: జెరుబ్బాబెలు కుమారులు[a]
  rationale: మసొరేటిక్ పాఠంలో בֶן ఏకవచనంగా ఉన్నా, వెంటనే ఇద్దరు పురుషుల పేర్లు మరియు వారి సహోదరి ప్రస్తావించబడుతున్నారు. సందర్భార్థాన్ని ప్రధాన పాఠంలో బహువచనంగా ఇచ్చి, మూలంలోని ఏకవచనాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: מְשֻׁלָּם
  choice: మెషుల్లాము
  rationale: వ్యక్తినామాన్ని హీబ్రూ రూపానికి దగ్గరగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: וַחֲנַנְיָה
  choice: హనన్యా
  rationale: వ్యక్తినామాన్ని మూల ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וּשְׁלֹמִית
  choice: షెలోమీతు
  rationale: వ్యక్తినామాన్ని హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: אֲחוֹתָם
  choice: వారి సహోదరి
  rationale: బహువచన ప్రత్యయాన్ని కాపాడుతూ, అది సహజంగా మెషుల్లాము మరియు హనన్యాను సూచించేలా ఆధునిక గౌరవప్రదమైన తెలుగులో అనువదించాం.
