lexical_decisions:
- source_word: יִבְחָר
  choice: ఇభ్హారు
  rationale: వంశావళిలోని వ్యక్తి పేరు; అర్థానువాదం చేయకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించబడింది. భ్ తరువాతి హీబ్రూ ח ధ్వనిని సూచించేందుకు ‘హ’ను ఉంచాం.
- source_word: אֱלִישָׁמָע
  choice: ఎలీషామా
  rationale: వ్యక్తి పేరును హీబ్రూ స్వరరూపానికి దగ్గరగా లిప్యంతరీకరించాం; చివరి ע ధ్వనికి తెలుగులో సహజమైన సమాన ధ్వని లేకపోవడంతో ప్రత్యేకంగా సూచించలేదు.
- source_word: אֱלִיפָלֶט
  choice: ఎలీఫెలెతు
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగులో పలకడానికి అనువుగా లిప్యంతరీకరించాం; పదాంత వ్యంజనాన్ని సహజంగా పలికేందుకు ‘తు’ రూపం వాడాం.
- source_word: וְ / וֶ
  choice: మరియు
  rationale: ప్రతి పేరుకు ముందు ఉన్న హీబ్రూ సంధాయకాన్ని తెలుగులో సహజమైన జాబితా శైలికి అనుగుణంగా చివరి రెండు పేర్ల మధ్య మాత్రమే వ్యక్తపరిచాం.
