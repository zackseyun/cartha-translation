translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్త జాబితా శైలిని పాటించాం. పేర్లను అనువదించకుండా హీబ్రూ రూపాల ఆధారంగా లిప్యంతరీకరించాం.
