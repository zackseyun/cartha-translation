translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలిని వాడాం. హీబ్రూ వాక్య నిర్మాణంలోని రెండు వంశావళి సూత్రాలను స్పష్టంగా నిలిపి, పేర్లను మూలపాఠం ఆధారంగా లిప్యంతరీకరించాం. పాదసూచిక సూచిక [a] ప్రధాన పాఠంలో ఉంది.
