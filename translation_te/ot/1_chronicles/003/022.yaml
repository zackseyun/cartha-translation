source:
  edition: WLC
  text: וּ/בְנֵ֥י שְׁכַנְיָ֖ה שְׁמַעְיָ֑ה וּ/בְנֵ֣י שְׁמַעְיָ֗ה חַטּ֡וּשׁ וְ֠/יִגְאָל וּ/בָרִ֧יחַ וּ/נְעַרְיָ֛ה וְ/שָׁפָ֖ט שִׁשָּֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/022.yaml
  text: 'And the sons of Shecaniah: Shemaiah. And the sons of Shemaiah: Hattush[a], Igal, Bariah, Neariah, and Shaphat—six.'
translation:
  language: te
  text: 'షెకన్యా కుమారులు: షెమయా. షెమయా కుమారులు: హట్టూష్[a], యిగాల్, బారీయహ్, నెఅర్యా, షాఫాత్—ఆరుగురు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మసొరెటిక్ హీబ్రూ పాఠంలో ఇక్కడ ఐదు పేర్లు మాత్రమే ఉన్నప్పటికీ, చివరలో ‘ఆరుగురు’ అని ఉంది. ఇది పాఠప్రసారంలో ఏర్పడిన సమస్య కావచ్చు లేదా ఒక పేరు తప్పిపోయి ఉండవచ్చు.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: ఇది בֵּן (‘కుమారుడు’) పదపు బహువచన సంబంధరూపం. వంశావళుల్లో ‘వంశస్థులు’ అనే విస్తృత అర్థం ఉండగలిగినా, ఇక్కడ పేర్లతో నేరుగా సంతానాన్ని పేర్కొనే సూత్రం ఉన్నందున ‘కుమారులు’ సహజమైన, మూలానికి సమీపమైన ఎంపిక.
- source_word: שְׁכַנְיָה
  choice: షెకన్యా
  rationale: హీబ్రూ వ్యక్తినామాన్ని ఆధునిక తెలుగు పాఠకులకు పలకడానికి అనుకూలంగా లిప్యంతరీకరించాం.
- source_word: שְׁמַעְיָה
  choice: షెమయా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ; వచనమంతటా ఒకే రూపం నిలుపబడింది.
- source_word: חַטּוּשׁ
  choice: హత్తూషు
  rationale: హీబ్రూ వ్యక్తినామాన్ని ద్విత్వ వ్యంజనం, దీర్ఘ స్వరం ప్రతిఫలించేలా తెలుగు లిపిలో ఇచ్చాం.
- source_word: יִגְאָל
  choice: ఇగాలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ఉచ్చారణకు సహజంగా లిప్యంతరీకరించాం; ఆంగ్ల సంప్రదాయ రూపాన్ని యథాతథంగా ఆధారంగా చేసుకోలేదు.
- source_word: בָרִיחַ
  choice: బారీయహు
  rationale: మసొరెటిక్ పాఠంలోని בָרִיחַ రూపాన్నే అనుసరించాం; పరిచితమైన వేరొక పేరు ‘బెరయా’ను పాఠంలోకి దిగుమతి చేయలేదు. చివరి ח ధ్వనికి తెలుగు పఠనంలో సమీపమైన ‘హు’ రూపం వాడాం.
- source_word: נְעַרְיָה
  choice: నెయర్యా
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని వ్యంజన క్రమాన్ని గుర్తించగలిగే విధంగా, తెలుగులో పలకదగిన రూపంలో ఇచ్చాం.
- source_word: שָׁפָט
  choice: షాఫాతు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: שִׁשָּׁה
  choice: మొత్తం ఆరుగురు
  rationale: మూలపాఠంలోని ‘ఆరు’ అనే సంఖ్యను యథాతథంగా నిలిపాం. జాబితాలో ఐదు పేర్లే కనిపిస్తున్నందున, అది వ్యక్తుల మొత్తం అని తెలుగులో సహజంగా తెలుపుతూ పాఠభేద సమస్యను పాదసూచికలో వివరించాం.
