  yaml_path: translation/ot/1_chronicles/003/020.yaml
  text: and Hashubah[a], Ohel, Berekiah, Hasadiah[b], and Jushab-hesed—five.
translation:
  language: te
  text: హషుబా, ఓహెల్, బెరెక్యా, హసద్యా, మరియు యూషబ్-హెసెద్[b]—ఐదుగురు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో కేవలం “ఐదు” అని ఉంది; అది ఇప్పుడే పేర్కొన్న ఐదు పేర్లను సంక్షిప్తంగా లెక్కిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: చివరి పేరు హీబ్రూలో “యూషబ్ హెసెద్” అని రెండు భాగాలుగా రాయబడింది; సాధారణంగా అది ఒకే సంయుక్త వ్యక్తిపేరుగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/חֲשֻׁבָה
  choice: హషూబా
  rationale: వ్యక్తిపేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం; ముందున్న ו సంధిని తెలుగు జాబితా నిర్మాణంలో విడిగా పునరావృతం చేయలేదు.
- source_word: וָ/אֹהֶל
  choice: ఓహేలు
  rationale: ఇక్కడ ఇది ‘గుడారం’ అనే సామాన్య నామం కాదు, వ్యక్తిపేరు; తెలుగులో సహజంగా పలికేందుకు చివర ఉకారం చేర్చాం.
- source_word: וּ/בֶרֶכְיָה
  choice: బెరెక్యా
  rationale: హీబ్రూ వ్యక్తిపేరును నేరుగా లిప్యంతరీకరించాం; יה భాగాన్ని పేరులో ‘యా’గా ప్రతిబింబించాం.
- source_word: וַֽ/חֲסַדְיָה
  choice: హసద్యా
  rationale: హీబ్రూ ధ్వనిరూపాన్ని అనుసరించిన వ్యక్తిపేరు; చివరి יה భాగాన్ని ‘యా’గా ఇచ్చాం.
- source_word: י֥וּשַׁב חֶ֖סֶד
  choice: యూషబ్‌-హెసెదు
  rationale: హీబ్రూలో రెండు పదాలుగా రాసినా ఒకే సంయుక్త వ్యక్తిపేరుగా గ్రహించి హైఫన్‌తో ఇచ్చాం.
- source_word: חָמֵשׁ
  choice: మొత్తం ఐదుగురు
  rationale: హీబ్రూ పాఠంలో కేవలం ‘ఐదు’ అని సంక్షిప్తంగా ఉంది; వ్యక్తుల జాబితాను సంగ్రహిస్తున్నందున తెలుగులో సహజంగా ‘మొత్తం ఐదుగురు’ అని ఇచ్చాం.
