  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి సంక్షిప్త శైలిని నిలుపుకుంటూనే సాధారణ పాఠకులకు సహజంగా ఉండేలా అనువదించాం. పేర్లను అనువదించకుండా హీబ్రూ ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో ఇచ్చాం.
