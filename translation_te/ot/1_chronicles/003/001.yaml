id: 1CH.3.1
reference: 1 Chronicles 3:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֤לֶּה הָיוּ֙ בְּנֵ֣י דָויִ֔ד אֲשֶׁ֥ר נֽוֹלַד ל֖/וֹ בְּ/חֶבְר֑וֹן הַ/בְּכ֣וֹר אַמְנֹ֗ן לַ/אֲחִינֹ֨עַם֙ הַ/יִּזְרְעֵאלִ֔ית שֵׁנִי֙ דָּנִיֵּ֔אל לַ/אֲבִיגַ֖יִל הַֽ/כַּרְמְלִֽית־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/001.yaml
  text: 'These were David’s sons who were born to him in Hebron: the firstborn[a], Amnon, by Ahinoam the Jezreelite; the second, Daniel, by Abigail the Carmelite.'
translation:
  language: te
  text: 'హెబ్రోనులో దావీదుకు పుట్టిన కుమారులు వీరు: యెజ్రెయేలీయురాలైన అహీనోయముకు పుట్టిన జ్యేష్ఠుడు అమ్నోను; కర్మెలీయురాలైన అబీగయీలుకు పుట్టిన రెండవవాడు దానియేలు[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: దీనికి సమాంతరమైన 2 సమూయేలు 3:3 జాబితాలో ఈ కుమారుని పేరు దానియేలు అని కాక కిల్యాబు అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה הָיוּ
  choice: వీరు
  rationale: వంశావళిలో కొత్త జాబితాను పరిచయం చేసే సహజమైన తెలుగు రూపం. וְ అనే అనుసంధాన భావాన్ని సందర్భమే తెలియజేస్తుంది; మూలంలో లేని కాలసూచక ‘ఇప్పుడు’ను చేర్చలేదు.
- source_word: בְּנֵי דָוִיד
  choice: దావీదుకు పుట్టిన కుమారులు
  rationale: బְּנֵי అనే పురుషసంతాన సూచనను ‘కుమారులు’గా నిలుపుతూ, తరువాతి జనన వాక్యంతో సహజంగా అనుసంధానించింది.
- source_word: אֲשֶׁר נוֹלַד לוֹ בְּחֶבְרוֹן
  choice: హెబ్రోనులో దావీదుకు పుట్టిన
  rationale: నిష్క్రియ జనన భావాన్ని, దావీదుతో ఉన్న సంబంధాన్ని, స్థల సూచనను స్పష్టంగా కాపాడుతుంది.
- source_word: הַבְּכוֹר
  choice: మొదటివాడు
  rationale: జాబితాలో జననక్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కేవలం వయస్సు ఎక్కువవాడనే భావానికి పరిమితం చేయదు.
- source_word: אַמְנוֹן
  choice: అమ్నోను
  rationale: హీబ్రూ వ్యక్తినామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: לַאֲחִינֹעַם הַיִּזְרְעֵאלִית
  choice: యెజ్రెయేలీయురాలైన అహీనోయముకు పుట్టిన
  rationale: לְ ఇక్కడ తల్లిని సూచించే వంశావళి ప్రయోగం. స్త్రీలింగ ప్రాంతీయ గుర్తింపును ‘యెజ్రెయేలీయురాలు’గా స్పష్టంగా నిలిపింది.
- source_word: שֵׁנִי
  choice: రెండవవాడు
  rationale: కుమారుల జననక్రమంలో రెండవ స్థానాన్ని సమాంతర నిర్మాణంలో తెలియజేస్తుంది.
- source_word: דָּנִיֵּאל
  choice: దానియేలు
  rationale: దినవృత్తాంతాల మసొరేటిక్ పాఠంలో ఉన్న పేరునే అనువదించకుండా లిప్యంతరీకరించింది.
- source_word: לַאֲבִיגַיִל הַכַּרְמְלִית
  choice: కర్మెలీయురాలైన అబీగయీలుకు పుట్టిన
  rationale: తల్లి సంబంధాన్నీ, కర్మెలుతో ఆమెకున్న ప్రాంతీయ గుర్తింపునీ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలి వాడబడింది. ‘ద్వారా’ అనే కృత్రిమ నిర్మాణం బదులు తల్లికి పుట్టినవాడనే సహజ తెలుగు ప్రయోగం ఎంచుకోబడింది. పాదసూచిక దానియేలు పేరుకే సంబంధించినందున దాని సూచికను ఆ పేరు తరువాత ఉంచాం.
