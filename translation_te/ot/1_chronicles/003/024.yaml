source:
  edition: WLC
  text: וּ/בְנֵ֣י אֶלְיוֹעֵינַ֗י הדיוהו וְ/אֶלְיָשִׁ֡יב וּ/פְלָיָ֡ה וְ֠/עַקּוּב וְ/יוֹחָנָ֧ן וּ/דְלָיָ֛ה וַ/עֲנָ֖נִי שִׁבְעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/024.yaml
  text: 'And the sons of Elyoenai: Hodaviah[a], Eliashib, Pelaiah, Akkub, Johanan, Delaiah, and Anani—seven.'
translation:
  language: te
  text: 'ఎల్యోయేనై కుమారులు: హోదవీయా[a], ఎల్యాషీబు, పెలాయా, అక్కూబు, యోహానాను, దెలాయా, అనానీ—మొత్తం ఏడుగురు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మొదట పేర్కొన్న పేరుకు హీబ్రూ లేఖనరూపం అసాధారణంగా ఉంది. ఇక్కడ ‘హోదవీయా’ అనే సాధారణంగా గుర్తించబడే రూపాన్ని అనుసరించాం; ‘హోదియా’ లేదా హీబ్రూ రూపానికి మరింత దగ్గరగా ‘హోదెవాహు’ అని కూడా చదివే అవకాశం ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: వంశావళి సందర్భంలో בְּנֵי అనే నిర్మాణ బహువచనానికి ‘కుమారులు’ సహజమైన, నిర్దిష్టమైన అనువాదం. ముందున్న వాక్యంతో జాబితా కొనసాగింపును తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని చేర్చకుండానే సహజంగా వ్యక్తం చేయవచ్చు.
- source_word: אֶלְיוֹעֵינַי
  choice: ఎల్యోయేనై
  rationale: హీబ్రూ స్వరరూపాన్ని సమీపంగా ప్రతిబింబించేలా వ్యక్తి పేరును లిప్యంతరీకరించాం.
- source_word: הדיוהו
  choice: హోదవ్యా
  rationale: వ్యంజనరూపం అసాధారణమైనప్పటికీ, ఇది సాధారణంగా గుర్తించబడే పేరురూపాన్ని అనుసరిస్తుంది; పాఠ్య అనిశ్చితిని పాదసూచికలో నిలిపాం.
- source_word: וְאֶלְיָשִׁיב
  choice: ఎల్యాషీబు
  rationale: హీబ్రూ వ్యక్తి పేరుకు తెలుగు ఉచ్చారణకు అనుకూలమైన లిప్యంతరీకరణ.
- source_word: וּפְלָיָה
  choice: పెలాయా
  rationale: చివరి -יָה ధ్వనిని సహజమైన తెలుగు రూపంలో ‘-యా’గా ప్రతిబింబించాం.
- source_word: וְעַקּוּב
  choice: అక్కూబు
  rationale: హీబ్రూలోని ద్విత్వ క ధ్వనిని ‘క్క’తో, దీర్ఘ ū ధ్వనిని ‘ూ’తో సూచించాం.
- source_word: וְיוֹחָנָן
  choice: యోహానాను
  rationale: హీబ్రూ יוֹחָנָן పేరుకు ధ్వనిసమీపమైన తెలుగు రూపం; దీర్ఘ స్వరాన్ని, చివరి నాన్ ధ్వనిని ప్రతిబింబిస్తుంది.
- source_word: וּדְלָיָה
  choice: దెలాయా
  rationale: హీబ్రూ పేరును తెలుగు పఠనానికి సహజంగా లిప్యంతరీకరించాం.
- source_word: וַעֲנָנִי
  choice: అనానీ
  rationale: చివరి జాబితా పేరును మూలధ్వనులకు సమీపంగా లిప్యంతరీకరించాం; తెలుగులో జాబితా క్రమమే సంధానాన్ని స్పష్టపరుస్తుంది.
- source_word: שִׁבְעָה
  choice: మొత్తం ఏడుగురు
  rationale: మూలంలోని సంఖ్య వంశావళి లెక్కను సంగ్రహిస్తుంది. వ్యక్తులను లెక్కిస్తున్నందున ‘ఏడుగురు’ సహజం; ‘మొత్తం’ దాని సంగ్రహాత్మక పాత్రను స్పష్టం చేస్తుంది.
