  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. వ్యక్తి పేర్లు హీబ్రూ ధ్వనులకు సమీపంగా ఉండేలా, తెలుగు పఠనానికి అనుకూలంగా లిప్యంతరీకరించబడ్డాయి.
