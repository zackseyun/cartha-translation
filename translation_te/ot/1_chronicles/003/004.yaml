id: 1CH.3.4
reference: 1 Chronicles 3:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: שִׁשָּׁה֙ נֽוֹלַד ל֣/וֹ בְ/חֶבְר֔וֹן וַ/יִּ֨מְלָךְ שָׁ֔ם שֶׁ֥בַע שָׁנִ֖ים וְ/שִׁשָּׁ֣ה חֳדָשִׁ֑ים וּ/שְׁלֹשִׁ֤ים וְ/שָׁלוֹשׁ֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/004.yaml
  text: Six were born to him in Hebron, and he reigned there seven years and six months; and in Jerusalem he reigned thirty-three years.
translation:
  language: te
  text: హెబ్రోనులో అతనికి ఆరుగురు పుట్టారు. అతడు అక్కడ ఏడు సంవత్సరాల ఆరు నెలలు రాజుగా పరిపాలించాడు; యెరూషలేములో ముప్పైమూడు సంవత్సరాలు రాజుగా పరిపాలించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁשָּׁה
  choice: ఆరుగురు
  rationale: ఇంతకు ముందు పేర్కొన్న కుమారుల సంఖ్యను సూచించే సంఖ్యావాచకం. వ్యక్తులను సూచిస్తున్నందున ఆధునిక సహజ తెలుగులో ‘ఆరుగురు’ సముచితం; హెబ్రీలో స్పష్టంగా లేని ‘ఈ ఆరుగురు’ అనే సూచనను చేర్చలేదు.
- source_word: נוֹלַד לוֹ
  choice: అతనికి ... పుట్టారు
  rationale: ילד క్రియ యొక్క నిఫ్అల్ రూపం, ל + సర్వనామ ప్రత్యయంతో కలిసి ‘అతనికి పుట్టారు’ అనే నిష్క్రియ భావాన్ని ఇస్తుంది. ‘అతడు వారిని కన్నాడు/కనెను’ వంటి క్రియాశీల రూపం మూలంలోని నిర్మాణాన్ని మార్చుతుంది.
- source_word: בְחֶבְרוֹן
  choice: హెబ్రోనులో
  rationale: స్థలాన్ని సూచించే בְ ఉపసర్గను సహజ తెలుగు స్థానవాచక రూపంతో అనువదించాం.
- source_word: וַיִּמְלָךְ שָׁם
  choice: అతడు అక్కడ ... రాజుగా పరిపాలించాడు
  rationale: ఈ కథన సందర్భంలో מלך రాజ్యాధికారాన్ని నిర్వహించడాన్ని సూచిస్తుంది. ‘రాజయ్యాడు’ కేవలం సింహాసనారోహణ భావాన్ని ఇవ్వవచ్చు; ‘రాజుగా పరిపాలించాడు’ పాలనా కాలాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: ఏడు సంవత్సరాల ఆరు నెలలు
  rationale: కాలవ్యవధిని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేసే రూపం.
- source_word: וּשְׁלֹשִׁים וְשָׁלוֹשׁ שָׁנָה
  choice: ముప్పైమూడు సంవత్సరాలు
  rationale: హెబ్రీ సంఖ్యా క్రమాన్ని ఆధునిక తెలుగు సంఖ్యా రూపంలో సహజంగా అందించాం. సమాస సంఖ్య తర్వాత మూలంలో ఏకవచనమైన שָׁנָה ఉండటం హెబ్రీ వ్యాకరణ ప్రయోగం; తెలుగులో బహువచనం అవసరం.
- source_word: מָלַךְ בִּירוּשָׁלִָם
  choice: యెరూషలేములో ... రాజుగా పరిపాలించాడు
  rationale: కొత్త ప్రదేశంపై హెబ్రీ వాక్యంలోని దృష్టిని నిలుపుతూ, తెలుగులో సహజమైన వాక్యక్రమాన్ని ఉపయోగించాం.
- source_word: בִּירוּשָׁלִָם
  choice: యెరూషలేములో
  rationale: బైబిలు తెలుగు వాడుకలో సుపరిచితమైన స్థలనామ రూపాన్ని స్థానవాచక విభక్తితో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘పరిపాలించాడు’ ద్వారా రాజ్యపాలన భావాన్ని తెలిపి, మూలంలోని రెండు ప్రదేశాలు మరియు వాటి కాలవ్యవధుల మధ్య సమాంతర నిర్మాణాన్ని నిలిపాం.
