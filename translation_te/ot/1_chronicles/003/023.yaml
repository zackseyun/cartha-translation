  yaml_path: translation/ot/1_chronicles/003/023.yaml
  text: 'The sons of Neariah: Elioenai[a], Hezekiah, and Azrikam—three.'
translation:
  language: te
  text: 'నెయర్యా కుమారులు[a]: ఎల్యోయేనై, హిజ్కియా, అజ్రీకాము—ముగ్గురు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘నెయర్యా కుమారుడు’ అని ఏకవచనంలో ఉంది. అయితే ఈ వంశావళి సందర్భంలో అది తరువాత పేర్కొన్న పలువురు సంతానాన్ని పరిచయం చేసే శీర్షికలా పనిచేస్తుంది; అందుకే ‘నెయర్యా కుమారులు’ అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  choice: కుమారులు
  rationale: హీబ్రూ రూపం ఏకవచనంగా ‘కుమారుడు’ అని ఉన్నప్పటికీ, వెంటనే మూడు పేర్లు రావడం మరియు చివర ‘ముగ్గురు’ అని ఉండడం వల్ల ఇది వంశావళిలో అనేక మంది కుమారులను పరిచయం చేసే శీర్షికగా పనిచేస్తుంది.
- source_word: נְעַרְיָה
  choice: నెయర్యా
  rationale: వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: אֶלְיוֹעֵינַי
  choice: ఎల్యోయేనై
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి సమీపంగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: וְחִזְקִיָּה
  choice: హిజ్కియా
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి సమీపంగా తెలుగు లిప్యంతరీకరణ చేశాం; ఆరంభంలోని ח ధ్వనికి సహజమైన తెలుగు సమీపరూపంగా ‘హి’ వాడాం.
- source_word: וְעַזְרִיקָם
  choice: అజ్రీకాము
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి సమీపంగా తెలుగు లిప్యంతరీకరణ చేశాం; చివరి వ్యంజన సముచ్ఛయాన్ని తెలుగు పఠనానికి అనుకూలంగా స్వల్ప అచ్చుతో సూచించాం.
- source_word: שְׁלֹשָׁה
  choice: ముగ్గురు
  rationale: లెక్కించబడుతున్న వారు వ్యక్తులు కాబట్టి, తెలుగు సహజ ప్రయోగానికి అనుగుణంగా వ్యక్తివాచక సంఖ్యారూపమైన ‘ముగ్గురు’ వాడాం.
