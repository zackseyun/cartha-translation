translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వంశావళి శైలిని అనుసరించాం. మూలంలోని సంక్షిప్త జాబితా నిర్మాణాన్ని, చివరి సంఖ్యా సారాంశాన్ని నిలిపాం; ఏకవచన రూపంలోని పాఠ్య సంక్లిష్టతను పాదసూచికలో స్పష్టంగా ఉంచాం.
