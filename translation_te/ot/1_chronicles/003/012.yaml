translation:
  language: te
  text: అతని కుమారుడు అమజ్యా; అతని కుమారుడు అజర్యా[a]; అతని కుమారుడు యోతాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ పాఠంలో ‘అజర్యా’; ఈ రాజు ఇతర చోట్ల ‘ఉజ్జియా’ అని కూడా పిలువబడ్డాడు.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲמַצְיָהוּ
  choice: అమజ్యా
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בְנוֹ
  choice: అతని కుమారుడు
  rationale: ఏకవచనంలోని ఈ వంశావళి పదబంధానికి ప్రత్యక్ష అర్థం ‘అతని కుమారుడు’. వంశావళులు కొన్నిసార్లు తరాలను సంక్షిప్తం చేసినా, ఇక్కడ ‘వంశస్థుడు’ అని విస్తరించకుండా మూలపాఠంలోని పుత్ర సంబంధాన్ని నిలిపాం.
- source_word: עֲזַרְיָה
  choice: అజర్యా
  rationale: ఈ వచనంలోని హీబ్రూ పేరునే అనుసరించాం; ఇతర చోట్ల కనిపించే ‘ఉజ్జియా’ అనే పేరుతో మూలపాఠాన్ని సమన్వయపరచలేదు.
- source_word: יוֹתָם
  choice: యోతాము
  rationale: వ్యక్తి పేరును సహజమైన తెలుగు రూపంలో లిప్యంతరీకరించాం.
theological_decisions:
- issue: రాజవంశావళిలోని పుత్ర సంబంధ పదప్రయోగం
  choice: ప్రతి సందర్భంలోనూ ‘అతని కుమారుడు’ అని ఉంచడం
  alternative: ‘అతని వంశస్థుడు’ అని అనువదించడం
  rationale: మూలపాఠం בְנוֹ (‘అతని కుమారుడు’) అనే పదాన్ని మూడుసార్లు స్పష్టంగా పునరావృతం చేస్తుంది. వంశావళులు తరాలను సంక్షిప్తం చేయగలవన్న సాధ్యత ఉన్నప్పటికీ, ఈ వచనంలో ఆ సాధ్యతను వ్యాఖ్యానంగా చేర్చకుండా మూలంలోని సంబంధ పదాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి శైలికి తగిన సంక్షిప్తమైన గంభీర భాషను వాడాం. తెలుగు సహజ వాక్యక్రమం కోసం హీబ్రూలోని ‘పేరు + అతని కుమారుడు’ క్రమాన్ని ‘అతని కుమారుడు + పేరు’గా అమర్చాం. వివరణ సూచికను అది వివరించే ‘అజర్యా’ పేరుకే జతచేశాం.
