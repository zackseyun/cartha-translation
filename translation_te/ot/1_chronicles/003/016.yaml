  edition: WLC
  text: וּ/בְנֵ֖י יְהוֹיָקִ֑ים יְכָנְיָ֥ה בְנ֖/וֹ צִדְקִיָּ֥ה בְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/016.yaml
  text: 'And the sons of Jehoiakim: Jeconiah his son[a], Zedekiah his son.'
translation:
  language: te
  text: 'యెహోయాకీము కుమారులు: యెకొన్యా అతని కుమారుడు[a], సిద్కియా అతని కుమారుడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ పాఠం సంక్షిప్తంగా ఉంది: “యెకొన్యా అతని కుమారుడు, సిద్కియా అతని కుమారుడు.” దీన్ని వరుస వంశావళిగా చదవవచ్చు. అయితే, ఈ ఇద్దరూ యెహోయాకీము కుమారులా, లేక ఇక్కడ చెప్పిన వరుస ప్రకారం సిద్కియా యెకొన్యా కుమారుడా అనే విషయంలో భిన్న అభిప్రాయాలు ఉన్నాయి.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: కుమారులు
  rationale: בְּנֵי అనేది ‘కుమారులు’ అనే పదపు సంబంధరూప బహువచనం; ఇది వంశావళి జాబితాను పరిచయం చేస్తుంది. తెలుగు వాక్యప్రవాహంలో ఆరంభంలోని וּ ను ప్రత్యేకంగా ‘మరియు’ అని అనువదించకపోయినా జాబితా కొనసాగింపు సహజంగా వ్యక్తమవుతుంది.
- source_word: יְהוֹיָקִים
  choice: యెహోయాకీము
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: יְכָנְיָה
  choice: యెకొన్యా
  rationale: ఈ చోట ఉన్న హీబ్రూ రూపం יְכָנְיָה ను నేరుగా ప్రతిబింబించేలా లిప్యంతరీకరించాం; ఇతర సందర్భాల్లో కనిపించే దీర్ఘ రూపాలతో కలపలేదు.
- source_word: בְנ֖/וֹ
  choice: అతని కుమారుడు
  rationale: 3వ పురుష ఏకవచన పురుష ప్రత్యయంతో ఉన్న בְּנוֹ ను సహజమైన తెలుగులో ‘అతని కుమారుడు’గా ఇచ్చాం; మూలంలోని వంశావళి సంబంధాన్ని స్పష్టంగా నిలిపాం.
- source_word: צִדְקִיָּה
  choice: సిద్కియా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సాధారణంగా గుర్తించదగిన బైబిలు రూపంలో లిప్యంతరీకరించాం.
- source_word: בְנֽ/וֹ
  choice: అతని కుమారుడు
  rationale: మూలంలో పునరావృతమైన వంశావళి సూచనను తొలగించకుండా అలాగే అనువదించాం; సర్వనామం ఎవరిని సూచిస్తుందో ప్రధాన పాఠ్యంలో అదనంగా నిర్ణయించలేదు.
theological_decisions:
- issue: సంక్షిప్తమైన వంశావళి వాక్యనిర్మాణంలో బంధుత్వ సంబంధం
  choice: ‘అతని కుమారుడు యెకొన్యా, అతని కుమారుడు సిద్కియా’ అని హీబ్రూ నిర్మాణాన్ని నిలిపి అనువదించడం
  alternative: యెకొన్యా, సిద్కియా ఇద్దరూ యెహోయాకీము కుమారులని స్పష్టీకరించడం; లేదా సిద్కియా యెకొన్యా కుమారుడని నిర్దిష్టంగా చెప్పడం
  rationale: హీబ్రూ పాఠం సంక్షిప్తంగా ఉండి ప్రతి పేరుకు తరువాత ‘అతని కుమారుడు’ అని పునరావృతం చేస్తుంది. ఇతర చారిత్రక వచనాలతో సమన్వయం చేసి సంబంధాన్ని నిర్ణయించకుండా, మూలంలోని అస్పష్టతను ప్రధాన పాఠ్యం మరియు పాదటిప్పణిలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వంశావళి శైలిని వాడాం. హీబ్రూ సంక్షిప్తతను సాధ్యమైనంతగా నిలిపి, సంబంధాన్ని వివరణాత్మకంగా పరిష్కరించలేదు.
