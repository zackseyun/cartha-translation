id: 1CH.3.5
reference: 1 Chronicles 3:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֥לֶּה נוּלְּדוּ ל֖/וֹ בִּ/ירוּשָׁלָ֑יִם שִׁ֠מְעָא וְ/שׁוֹבָ֞ב וְ/נָתָ֤ן וּ/שְׁלֹמֹה֙ אַרְבָּעָ֔ה לְ/בַת שׁ֖וּעַ בַּת עַמִּיאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/005.yaml
  text: 'These were born to him in Jerusalem: Shimea[a], Shobab, Nathan[b], and Solomon—four by Bath-shua daughter of Ammiel.'
translation:
  language: te
  text: 'యెరూషలేములో అతనికి పుట్టినవారు వీరు: షిమ్యా[b], షోబాబు, నాతాను, సొలొమోను—ఈ నలుగురూ అమ్మీయేలు కుమార్తె బత్షూవా[a]కు పుట్టారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2 సమూయేలు 5:14లోను సంబంధిత సమాంతర వాక్యాల్లోను ఆమెను ఏలీయాము కుమార్తె బత్షెబ అని పిలుస్తారు.
    reason: alternative_reading
  - marker: b
    text: ఇక్కడ హీబ్రూ పాఠంలో ‘షిమ్యా’ అని ఉంది; 2 సమూయేలు 5:14లోని సమాంతర వాక్యంలో ‘షమ్మూవా’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: వీరు
  rationale: వంశావళిలోని తదుపరి సమూహాన్ని సహజమైన ఆధునిక తెలుగులో పరిచయం చేస్తూ హీబ్రూ నిర్దేశక భావాన్ని నిలుపుతుంది.
- source_word: נוּלְּדוּ לוֹ
  choice: అతనికి పుట్టినవారు
  rationale: ילד క్రియ యొక్క నిఫాల్ కర్మణి భావాన్ని నిలుపుతుంది; సందర్భంలో ‘అతడు’ దావీదును సూచిస్తున్నా, మూలంలోని సర్వనామాన్ని అనవసరంగా విస్తరించలేదు.
- source_word: בִּירוּשָׁלָיִם
  choice: యెరూషలేములో
  rationale: జన్మస్థలాన్ని తెలిపే స్థానార్థక పదబంధానికి సహజమైన తెలుగు రూపం.
- source_word: שִׁמְעָא
  choice: షిమ్యా
  rationale: దినవృత్తాంతాల హీబ్రూ పాఠంలోని పేరురూపాన్ని ప్రతిబింబిస్తుంది; సమూయేలు గ్రంథంలోని ‘షమ్మూవ’తో సమన్వయం చేయలేదు.
- source_word: שׁוֹבָב
  choice: షోబాబు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిపిలో స్పష్టమైన ధ్వన్యనుకరణ.
- source_word: נָתָן
  choice: నాతాను
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన ప్రసిద్ధ పేరురూపం.
- source_word: שְׁלֹמֹה
  choice: సొలొమోను
  rationale: తెలుగు పాఠకులకు సుపరిచితమైన రాజు పేరును ఉపయోగిస్తుంది.
- source_word: אַרְבָּעָה
  choice: ఈ నలుగురూ
  rationale: ముందు పేర్కొన్న నలుగురు కుమారులను సమగ్రంగా సూచిస్తూ సంఖ్యా సారాంశాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: לְבַת שׁוּעַ
  choice: బత్షూవకు పుట్టారు
  rationale: ఈ సందర్భంలో לְ సూచించే మాతృసంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ఆమెను కేవలం సాధనంగా చూపే అసహజ నిర్మాణాన్ని నివారిస్తుంది.
- source_word: בַּת עַמִּיאֵל
  choice: అమ్మీయేలు కుమార్తె
  rationale: హీబ్రూ పితృసంబంధ పదబంధాన్ని నేరుగా, సహజంగా అనువదిస్తుంది.
theological_decisions:
- issue: దినవృత్తాంతాలు మరియు సమూయేలు సమాంతర పాఠాల్లో దావీదు భార్య పేరు, ఆమె తండ్రి పేరు భిన్నంగా ఉండడం
  choice: అమ్మీయేలు కుమార్తె బత్షూవ
  alternative: ఏలీయాము కుమార్తె బత్షెబ
  rationale: ఇక్కడి WLC హీబ్రూ పాఠం ‘బత్షూవ, అమ్మీయేలు కుమార్తె’ అని ఉంది. సమాంతర వాక్యంతో మౌనంగా సమన్వయం చేయకుండా మూలపాఠాన్ని ప్రధాన వచనంలో ఉంచి, మరో రూపాన్ని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైనప్పటికీ గౌరవప్రదమైన శైలి. ప్రసిద్ధ బైబిలు పేర్లకు పాఠకులకు సుపరిచితమైన తెలుగు రూపాలు వాడి, పాఠభేదాలకు సంబంధించిన పేర్లను హీబ్రూ రూపాలకు దగ్గరగా ఉంచాం. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదాలకే జతచేశాం.
