    text: వంశావళుల్లో హీబ్రూ ‘కుమారుడు’ అనే పదం కొన్నిసార్లు విస్తృత అర్థంలో ‘వంశస్థుడు’ అని కూడా సూచించవచ్చు; అయితే ఇక్కడ మూలపాఠం సాధారణంగా వాడే ‘అతని కుమారుడు’ అనే సూత్రాన్నే ఉపయోగిస్తుంది.
