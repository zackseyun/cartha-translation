lexical_decisions:
- source_word: אָחָז
  choice: ఆహాజు
  rationale: వ్యక్తి పేరును ఆధునిక తెలుగు బైబిలు వాడుకలో గుర్తుపట్టగల రూపంలో లిప్యంతరీకరించాం.
- source_word: בְּנוֹ
  choice: అతని కుమారుడు
  rationale: 3వ పురుష ఏకవచన పుంలింగ ప్రత్యయంతో ఉన్న בֵּן అనే పదానికి ఇక్కడ నేరమైన అర్థం ‘అతని కుమారుడు’; మూలంలోని వంశావళి సూత్రాన్ని యథాతథంగా ఉంచాం.
- source_word: חִזְקִיָּהוּ
  choice: హిజ్కియా
  rationale: వ్యక్తి పేరును తెలుగు పాఠకులకు సుపరిచితమైన బైబిలు రూపంలో లిప్యంతరీకరించాం.
- source_word: בְנוֹ
  choice: అతని కుమారుడు
  rationale: హీబ్రూ మూలంలో పునరావృతమయ్యే వంశావళి సూత్రాన్ని ఒకే విధంగా అనువదించాం.
- source_word: מְנַשֶּׁה
  choice: మనష్షే
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בְנוֹ
  choice: అతని కుమారుడు
  rationale: మూలంలోని పునరావృత నిర్మాణం, పదార్థం స్పష్టంగా కనిపించేలా ‘అతని కుమారుడు’ అని అనువదించాం.
