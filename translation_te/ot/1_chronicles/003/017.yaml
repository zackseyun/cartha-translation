  text: 'And the sons of Jeconiah: Assir[a], Shealtiel his son.'
translation:
  language: te
  text: 'యెకొన్యాకు చెందిన కుమారులు: అస్సీర్[a], అతనికి కుమారుడైన షెయల్తీయేలు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “బందీగా ఉన్న యెకొన్యా కుమారులు: అతనికి కుమారుడైన షెయల్తీయేలు.” హీబ్రూ אַסִּרను ‘అస్సీర్’ అనే వ్యక్తిపేరుగా లేదా ‘బందీ/ఖైదీ’ అనే సామాన్య నామవాచకంగా చదవవచ్చు.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: కుమారులు
  rationale: వంశావళి సందర్భంలో בְנֵי అనే పదానికి సహజమైన అర్థం ‘కుమారులు’. వచనారంభంలోని ו క్రమానుసంధానాన్ని సూచించినప్పటికీ, ఆధునిక తెలుగు వంశావళి శైలిలో ప్రత్యేకంగా ‘మరియు’ అని చేర్చకపోవడం సహజంగా ఉంటుంది.
- source_word: יְכָנְיָה
  choice: యెకొన్యా
  rationale: హీబ్రూ పేరును దాని రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: אַסִּר
  choice: అస్సీరు
  rationale: మసొరా స్వరచిహ్నాలు మరియు వంశావళి జాబితా నిర్మాణం దృష్ట్యా ప్రధాన పాఠంలో దీనిని వ్యక్తిపేరుగా లిప్యంతరీకరించాం; ‘బందీ’ అనే సామాన్య నామవాచక పఠనాన్ని పాదసూచికలో నిలిపాం.
- source_word: שְׁאַלְתִּיאֵל
  choice: షెయల్తీయేలు
  rationale: హీబ్రూ వ్యక్తిపేరును మూలధ్వనులకు దగ్గరగా, తెలుగులో చదవడానికి అనువుగా లిప్యంతరీకరించాం.
- source_word: בְּנוֹ
  choice: అతని కుమారుడు
  rationale: ఏకవచన పురుష ప్రత్యయాన్ని సహజమైన తెలుగు స్వామ్య నిర్మాణంతో అనువదించాం; పాఠంలోని సమీప వంశసంబంధాన్ని అలాగే ఉంచాం.
theological_decisions:
- issue: אַסִּר అనే రూపాన్ని వ్యక్తిపేరుగా చదవాలా, ‘బందీ’ అనే వర్ణనగా చదవాలా
  choice: ప్రధాన పాఠంలో ‘అస్సీరు’ అనే వ్యక్తిపేరుగా ఉంచడం
  alternative: '‘బందీగా ఉన్న యెకొన్యా కుమారులు: అతని కుమారుడు షెయల్తీయేలు’'
  rationale: హీబ్రూ రూపం వ్యక్తిపేరు గానీ ‘బందీ/ఖైదీ’ అనే సామాన్య నామవాచకం గానీ కావచ్చు. వంశావళి నిర్మాణం పేరుగా చదవడానికి అనుకూలించినా, చారిత్రకంగా ప్రాముఖ్యమున్న ప్రత్యామ్నాయాన్ని మౌనంగా తొలగించకుండా పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సంక్షిప్తమైన వంశావళి శైలిని పాటించాం. వ్యక్తిపేర్లను హీబ్రూ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం; మూలంలోని నిజమైన సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
