id: 1CH.22.11
reference: 1 Chronicles 22:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: עַתָּ֣ה בְנִ֔/י יְהִ֥י יְהוָ֖ה עִמָּ֑/ךְ וְ/הִצְלַחְתָּ֗ וּ/בָנִ֨יתָ֙ בֵּ֚ית יְהוָ֣ה אֱלֹהֶ֔י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר עָלֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/011.yaml
  text: Now[a], my son, may Yahweh be with you, and may you prosper and build the house of Yahweh your God[c][b], as he has spoken concerning you.
translation:
  language: te
  text: ఇప్పుడు, నా కుమారుడా, యాహ్వే నీకు తోడుగా ఉండుగాక; నీవు సఫలుడవై, నీ దేవుడైన యాహ్వే మందిరాన్ని[a] కట్టుగాక—నీ గురించి ఆయన చెప్పినట్లే.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీ దేవుడైన యాహ్వే ఇంటిని.” ఇక్కడ “ఇల్లు” అంటే దేవాలయం లేదా మందిరం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీ విషయంలో ఆయన వాగ్దానం చేసినట్లే.” హీబ్రూ మరింత అక్షరార్థంగా, “నీ గురించి ఆయన చెప్పినట్లే” అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: దావీదు ఆశీర్వాదం, ప్రోత్సాహం పలకడం ప్రారంభించే కాలసూచక సంభాషణా పదాన్ని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: בְנִי
  choice: నా కుమారుడా
  rationale: ప్రత్యక్ష సంబోధనను, తండ్రి ప్రేమతో కూడిన స్వరాన్ని నిలుపుతుంది.
- source_word: יְהִי יְהוָה עִמָּךְ
  choice: యెహోవా నీకు తోడుగా ఉండుగాక
  rationale: יְהִי లోని ఆశీర్వాదాత్మక ఆకాంక్షను తెలుగులో సహజమైన విధ్యర్థక రూపంతో వ్యక్తం చేస్తుంది.
- source_word: וְהִצְלַחְתָּ
  choice: నీవు సఫలుడవై
  rationale: צלח హిఫిల్ రూపంలోని ‘సఫలమగు/విజయం పొందు’ భావాన్ని, భౌతిక సంపదకే పరిమితం చేయకుండా తెలియజేస్తుంది.
- source_word: וּבָנִיתָ
  choice: కట్టుగాక
  rationale: ముందున్న ఆశీర్వాదాత్మక ఆకాంక్షతో అనుసంధానించి, నిర్మాణ కార్యం నెరవేరాలనే భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: నీ దేవుడైన యెహోవా మందిరాన్ని
  rationale: బֵּית్ అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఇక్కడ దేవుని ఆరాధనా కట్టడాన్ని సూచిస్తున్నందున ఆధునిక తెలుగులో ‘మందిరం’ స్పష్టంగా, సహజంగా ఉంటుంది; అక్షరార్థాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: כַּאֲשֶׁר דִּבֶּר עָלֶיךָ
  choice: నీ గురించి ఆయన చెప్పినట్లే
  rationale: דבר + על యొక్క ‘గురించి చెప్పు’ అనే భావాన్ని వాగ్దానంగా అతిగా నిర్ధారించకుండా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణతో అందిస్తుంది.
theological_decisions:
- issue: יהוה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో వ్యక్తిగత దైవనామం నేరుగా ఉన్నందున బిరుదైన ‘ప్రభువు’తో మార్చకుండా దైవనామాన్ని నిలుపుతుంది.
- issue: క్రియాక్రమం యొక్క భావబలం
  choice: ఆశీర్వాదం/ఆకాంక్షగా ‘ఉండుగాక… సఫలుడవై… కట్టుగాక’
  alternative: నిశ్చయ ప్రకటనగా ‘తోడుగా ఉంటాడు… సఫలుడవై కడతావు’
  rationale: ఆరంభంలోని יְהִי జస్సివ్ రూపం ఆశీర్వాదాత్మక ఆకాంక్షను స్పష్టంగా సూచిస్తుంది; తరువాతి క్రియలను అదే ప్రవాహంలో చదవడం సందర్భానికి తగినది, అయితే అవి ఎదురుచూస్తున్న ఫలితాన్ని కూడా సూచిస్తాయి.
- issue: דִּבֶּר עָלֶיךָ ను వాగ్దానంగా పేర్కొనాలా
  choice: నీ గురించి ఆయన చెప్పినట్లే
  alternative: నీ విషయంలో ఆయన వాగ్దానం చేసినట్లే
  rationale: సందర్భంలో వాగ్దాన భావం ఉన్నప్పటికీ, హీబ్రూ వాక్యం అక్షరార్థంగా ‘నీ గురించి చెప్పినట్లే’ అంటుంది; అందువల్ల వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలోకి దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఆశీర్వాద స్వరాన్ని ‘ఉండుగాక/కట్టుగాక’ రూపాలతో నిలిపి, ‘సఫలుడవై’ ద్వారా צלחను కేవలం ఆర్థిక సమృద్ధిగా సంకుచితం చేయలేదు.
