id: 1CH.22.18
reference: 1 Chronicles 22:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: הֲ/לֹ֨א יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ עִמָּ/כֶ֔ם וְ/הֵנִ֥יחַ לָ/כֶ֖ם מִ/סָּבִ֑יב כִּ֣י נָתַ֣ן בְּ/יָדִ֗/י אֵ֚ת יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/נִכְבְּשָׁ֥ה הָ/אָ֛רֶץ לִ/פְנֵ֥י יְהוָ֖ה וְ/לִ/פְנֵ֥י עַמּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/018.yaml
  text: Is not Yahweh your God with you? And has he not given you rest on every side? For he has given the inhabitants of the land into my hand[a], and the land has been subdued before Yahweh and before his people.
translation:
  language: te
  text: మీ దేవుడైన యాహ్వే మీతో ఉన్నాడు కదా? ఆయన మీకు చుట్టుపక్కల నుండి విశ్రాంతి ఇచ్చాడు కదా? ఎందుకంటే ఆయన ఆ దేశ నివాసులను నా చేతికి అప్పగించాడు; ఆ దేశం యాహ్వే ఎదుట, ఆయన ప్రజల ఎదుట[a] వశపరచబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆయన ప్రజలు’లోని ‘ఆయన’ యాహ్వేను సూచించడం ఎక్కువ సంభావ్యం; అయితే అది దావీదును సూచిస్తుందని కూడా అర్థం చేసుకోవచ్చు.
    reason: హీబ్రూ సర్వనామానికి సాధ్యమైన పూర్వపదం విషయంలో ఉన్న నిజమైన సందిగ్ధతను తెలియజేయడం.
lexical_decisions:
- source_word: הֲלֹא
  choice: ఉన్నాడు కదా? … ఇచ్చాడు కదా?
  rationale: ఇది అవుననే జవాబును ఆశించే అలంకారప్రశ్న. తెలుగులో ‘కదా?’ ఆ ప్రశ్నాబలాన్ని సహజంగా తెలియజేస్తుంది; సంయుక్త వాక్యంలోని రెండు అంశాలకూ దాని ప్రభావాన్ని స్పష్టంగా చూపించింది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, హీబ్రూ నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణగా ఇచ్చింది.
- source_word: אֱלֹהֵיכֶם עִמָּכֶם
  choice: మీ దేవుడైన … మీతో
  rationale: ఇక్కడ אֱלֹהִים ఏకవచనార్థంలో ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది; עִם దైవసన్నిధి, సహాయాన్ని సూచించే సరళమైన ‘తో’గా అనువదించబడింది.
- source_word: וְהֵנִיחַ לָכֶם מִסָּבִיב
  choice: ఆయన మీకు అన్నివైపులా విశ్రాంతి ఇచ్చాడు
  rationale: הניח చుట్టుపక్కల శత్రువులనుండి భద్రత, ఉపశమనం కలిగించడాన్ని సూచిస్తుంది. ‘విశ్రాంతి ఇచ్చాడు’ మూలపద రూపకాన్ని నిలుపుతూ సందర్భార్థాన్ని అందిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందున్న అలంకారప్రశ్నకు ఆధారాన్ని పరిచయం చేస్తుంది.
- source_word: נָתַן בְּיָדִי
  choice: నా చేతికి అప్పగించాడు
  rationale: ఒకరి అధికారంలోకి అప్పగించడాన్ని తెలిపే హీబ్రూ నుడికారంలోని ‘చేతి’ రూపకాన్ని తెలుగులో సహజంగా నిలిపింది.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: ఈ దేశ నివాసులను
  rationale: భూమి లేదా దేశంలో నివసించేవారిని సూచించే కృదంత నిర్మాణానికి సహజమైన తెలుగు రూపం; సూచింపబడుతున్న దేశాన్ని సందర్భానుగుణంగా ‘ఈ దేశం’ అని తెలిపింది.
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: ఈ దేశం లోబరచబడింది
  rationale: כבש నిఫాల్ రూపంలోని కర్మణి భావాన్ని, దేశం అధికారానికి లోనైన ఫలితస్థితిని నిలుపుతుంది.
- source_word: לִפְנֵי יְהוָה וְלִפְנֵי עַמּוֹ
  choice: యాహ్వే ఎదుట, ఆయన ప్రజల ఎదుట
  rationale: రెండు సమాంతర לִפְנֵי పదబంధాలను ఒకే విధంగా ‘ఎదుట’ అని అనువదించింది; עַמּוֹ లోని సర్వనామ సంబంధాన్ని ప్రధాన పాఠ్యంలో పరిష్కరించకుండా నిలిపి, సందిగ్ధతను పాదసూచికలో తెలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని అనువదించడం
  choice: యాహ్వే
  alternative: యెహోవా లేదా ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని వాడుతుంది. దానిని బిరుదుగా మార్చకుండా, మూల ఉచ్చారణకు సమీపమైన రూపంలో ఉంచడం సముచితం.
- issue: עַמּוֹ లోని ‘ఆయన’ ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘ఆయన ప్రజలు’ అని సంబంధాన్ని తెరిచి ఉంచడం; పాదసూచికలో యాహ్వే ప్రధాన సంభావ్య పూర్వపదమని చెప్పడం
  alternative: దావీదు ప్రజలు అని స్పష్టీకరించడం
  rationale: సమీపంలోని ప్రముఖ పూర్వపదం యాహ్వే; ‘యాహ్వే ఎదుట, ఆయన ప్రజల ఎదుట’ అనే జత సహజంగా ఉంది. అయినా హీబ్రూ సర్వనామం వ్యాకరణపరంగా దావీదును కూడా సూచించగలదు కాబట్టి ఆ అవకాశాన్ని తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. అలంకారప్రశ్నను ‘కదా?’తో సహజీకరించింది; జయాపజయ సందర్భంలోని ‘విశ్రాంతి’, ‘చేతికి అప్పగించడం’, ‘లోబరచబడడం’ అనే మూల భావచిత్రాలను నిలిపింది.
