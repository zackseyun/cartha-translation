revisions:
- from: మీ దేవుడైన యాహ్వే మీతో ఉన్నాడు కదా? ఆయన మీకు అన్నివైపులా విశ్రాంతి ఇచ్చాడు కదా? ఎందుకంటే ఆయన ఈ దేశ నివాసులను నా చేతికి అప్పగించాడు; యాహ్వే ఎదుట, ఆయన ప్రజల ఎదుట[a] ఈ దేశం లోబరచబడింది.
  to: మీ దేవుడైన యాహ్వే మీతో ఉన్నాడు కదా? ఆయన మీకు చుట్టుపక్కల నుండి విశ్రాంతి ఇచ్చాడు కదా? ఎందుకంటే ఆయన ఆ దేశ నివాసులను నా చేతికి అప్పగించాడు; ఆ దేశం యాహ్వే ఎదుట, ఆయన ప్రజల ఎదుట[a] వశపరచబడింది.
