id: 1CH.22.1
reference: 1 Chronicles 22:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔יד זֶ֣ה ה֔וּא בֵּ֖ית יְהוָ֣ה הָ/אֱלֹהִ֑ים וְ/זֶה מִּזְבֵּ֥חַ לְ/עֹלָ֖ה לְ/יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/001.yaml
  text: Then David said[a], “This is the house of Yahweh God[b], and this is the altar for burnt offering for Israel.”
translation:
  language: te
  text: అప్పుడు దావీదు, “ఇదే యహ్వే దేవుని గృహం[a]; ఇదే ఇశ్రాయేలు కోసం దహనబలి కొరకు బలిపీఠం[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యహ్వే దేవుని ఆలయం.” హీబ్రూ మూలంలో అక్షరార్థంగా “యహ్వే దేవుని గృహం.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఇశ్రాయేలు కోసం దహనబలుల కొరకు బలిపీఠం.” హీబ్రూలో ‘దహనబలి’ ఏకవచనంలో ఉన్నా, అది సాధారణ లేదా సమష్టి భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది. ‘అప్పుడు’ సంఘటనల క్రమాన్ని సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది.
- source_word: דָּוִיד
  choice: దావీదు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: זֶה הוּא
  choice: ఇదే
  rationale: సూచక సర్వనామం, వ్యక్తిసర్వనామం కలిసి ఇచ్చే బలమైన గుర్తింపును ‘ఇదే’ సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: בֵּית
  choice: గృహం
  rationale: హీబ్రూ పదానికి ప్రాథమిక అర్థం ‘ఇల్లు/గృహం’. సందర్భం ఆలయ స్థలాన్ని సూచించినా, ‘గృహం’ మూలపాఠంలోని రూపక, దైవశాస్త్రీయ ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణంగా అంగీకరించిన ఉచ్చారణకు సమీపమైన తెలుగు లిప్యంతరీకరణగా ఇచ్చాం.
- source_word: הָאֱלֹהִים
  choice: దేవుని
  rationale: దైవనామానికి అనుబంధంగా ఉన్న ‘దేవుడు’ అనే పదాన్ని తెలుగు సంబంధవిభక్తి నిర్మాణంలో సహజంగా ‘దేవుని’ అని ఇచ్చాం.
- source_word: מִּזְבֵּחַ
  choice: బలిపీఠం
  rationale: బలులు అర్పించే నిర్మాణాన్ని సూచించే ప్రామాణిక, సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: לְעֹלָה
  choice: దహనబలి అర్పించే
  rationale: హీబ్రూ ఏకవచనం ఇక్కడ సాధారణ లేదా సమష్టి భావంలో ఉండవచ్చు. ‘దహనబలి అర్పించే’ అనే రూపం ఆ సాధారణ ఉద్దేశాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: לְיִשְׂרָאֵל
  choice: ఇశ్రాయేలు కోసం
  rationale: לְ ఉపసర్గ తెలియజేసే సంబంధం లేదా ప్రయోజనాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠం వ్యక్తిగత దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. ‘యహ్వే’ దానిని బిరుదుగా మార్చకుండా నిలుపుతుంది; ‘యెహోవా’ కంటే హీబ్రూ నామానికి ప్రతిపాదిత ఉచ్చారణకు సమీపంగా ఉంటుంది.
- issue: בֵּית יְהוָה הָאֱלֹהִים లో בֵּית ను ‘గృహం’గా లేదా ‘ఆలయం’గా ఇవ్వడం
  choice: యహ్వే దేవుని గృహం
  alternative: యహ్వే దేవుని ఆలయం
  rationale: సందర్భం భవిష్యత్తు ఆలయ స్థలాన్ని సూచించినా, హీబ్రూ నేరుగా ‘గృహం’ అంటుంది. ప్రధాన పాఠంలో దానిని నిలిపి, సందర్భానుసారమైన ‘ఆలయం’ను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. మూలంలోని బలమైన సూచనను ‘ఇదే’తో, ‘house’ భావాన్ని ‘గృహం’తో నిలిపాం; అవసరమైన సందర్భార్థాన్ని పాదసూచికల్లో ఇచ్చాం.
