id: 1CH.22.13
reference: 1 Chronicles 22:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אָ֣ז תַּצְלִ֔יחַ אִם תִּשְׁמ֗וֹר לַ/עֲשׂוֹת֙ אֶת הַֽ/חֻקִּ֣ים וְ/אֶת הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה עַל יִשְׂרָאֵ֑ל חֲזַ֣ק וֶ/אֱמָ֔ץ אַל תִּירָ֖א וְ/אַל תֵּחָֽת־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/013.yaml
  text: Then you will prosper[a], if you are careful to do the statutes and the judgments that Yahweh commanded Moses for Israel. Be strong and courageous. Do not fear[b], and do not be dismayed.
translation:
  language: te
  text: అప్పుడు నీవు వర్ధిల్లుతావు[a]—యాహ్వే ఇశ్రాయేలు కోసం మోషేకు ఆజ్ఞాపించిన కట్టడాలను, న్యాయవిధులను జాగ్రత్తగా పాటిస్తే. బలంగా ఉండు, ధైర్యంగా ఉండు. భయపడకు; దిగులుపడకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సఫలమవుతావు.” హీబ్రూ క్రియ వర్ధిల్లడాన్ని లేదా సఫలమవడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: అప్పుడు
  rationale: ముందటి ఉపదేశానికి ఫలితాన్ని సూచించే సహజమైన తెలుగు అనుసంధానం.
- source_word: תַּצְלִיחַ
  choice: నీవు వర్ధిల్లుతావు
  rationale: హిఫిల్ రూపం ‘వర్ధించు’ లేదా ‘సఫలమవు’ అనే రెండు భావాలను కలిగి ఉంది; ఒడంబడిక విధేయత సందర్భంలో ‘వర్ధిల్లుతావు’ ప్రధాన పాఠ్యానికి తగినది.
- source_word: אִם תִּשְׁמוֹר לַעֲשׂוֹת
  choice: జాగ్రత్తగా పాటిస్తే
  rationale: ‘కాపాడటం’తో ‘చేయటం’ను కలిపిన హీబ్రూ ప్రయోగం శ్రద్ధగల ఆచరణను సూచిస్తుంది; తెలుగులో ‘జాగ్రత్తగా పాటించు’ సహజంగా ఆ రెండింటినీ వ్యక్తపరుస్తుంది.
- source_word: הַחֻקִּים
  choice: కట్టడలు
  rationale: నిర్ణయించి స్థాపించిన విధులను సూచిస్తూ, తరువాతి న్యాయపదం నుండి భేదాన్ని నిలుపుతుంది.
- source_word: הַמִּשְׁפָּטִים
  choice: న్యాయవిధులు
  rationale: చట్టపరమైన, న్యాయనిర్ణయ సంబంధ భావాన్ని తెలియజేస్తూ חֻקִּים నుండి పదభేదాన్ని కాపాడుతుంది.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה עַל יִשְׂרָאֵל
  choice: యెహోవా ఇశ్రాయేలు కోసం మోషేకు ఆజ్ఞాపించిన
  rationale: మోషే ఆజ్ఞను అందుకున్న వ్యక్తి అని ప్రత్యక్ష కర్మ నిర్మాణాన్ని, ఇశ్రాయేలు ఆ ఆజ్ఞల ఉద్దేశిత సమాజమని עַל యొక్క సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ దైవనామాన్ని సాధారణ తెలుగు లిప్యంతరీకరణలో ప్రత్యక్షంగా అందిస్తుంది.
- source_word: חֲזַק וֶאֱמָץ
  choice: బలంగా, ధైర్యంగా ఉండు
  rationale: స్థిరబలం మరియు సాహసం రెండింటినీ తెలిపే హీబ్రూ ప్రోత్సాహ సూత్రానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: אַל תִּירָא
  choice: భయపడకు
  rationale: నిషేధాత్మక ఆజ్ఞను నేరుగా, సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: וְאַל תֵּחָת
  choice: దిగులుపడకు
  rationale: భయంతో లేదా విఘాతంతో కుంగిపోవద్దనే భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాకుండా టెట్రాగ్రామటన్ ప్రత్యక్షంగా ఉంది; కాబట్టి దైవనామాన్ని పేరుగానే నిలుపుతుంది.
- issue: విధేయతకు అనుసంధానమైన תַּצְלִיחַ భావం
  choice: వర్ధిల్లుతావు
  alternative: సఫలమవుతావు
  rationale: ఆర్థిక సంపదకే పరిమితం చేయకుండా అభివృద్ధి లేదా అనుకూల ఫలితాన్ని సూచిస్తుంది; సాధనాత్మక విజయమనే ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచి మూలంలోని అర్థవ్యాప్తిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే ఆజ్ఞాత్మక శైలి వాడబడింది. ‘కట్టడలు’ మరియు ‘న్యాయవిధులు’ అనే వేర్వేరు పదాలతో రెండు హీబ్రూ న్యాయపదాల భేదం నిలుపబడింది. ప్రధాన పాఠ్యంలోని ప్రతి పాదటిప్పణి సూచికకు సరిపోలే పాదటిప్పణి ఇవ్వబడింది.
