base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/019.yaml
  text: Now set your heart and your soul to seek Yahweh your God[a]. Rise up and build the sanctuary of Yahweh God[b], to bring the ark of the covenant of Yahweh and the holy vessels of God into the house that is to be built for the name of Yahweh.
translation:
  language: te
  text: ఇప్పుడు మీ దేవుడైన యెహోవాను వెదకడానికి మీ హృదయాన్నీ ప్రాణాన్నీ అంకితం చేయండి.[a] లేచి నిలబడి, యెహోవా దేవుని పరిశుద్ధస్థలాన్ని నిర్మించండి—యెహోవా నిబంధన మందసాన్నీ దేవుని పరిశుద్ధ వస్తువులనూ యెహోవా నామం కొరకు నిర్మించబడబోయే మందిరంలోకి తీసుకురావడానికి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “మీ దేవుడైన యెహోవాను వెదకడానికి మీ హృదయాన్నీ మీ ప్రాణాన్నీ ఇవ్వండి.”'
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “మందిరం” అంటే యెహోవా నామం కొరకు నిర్మించబడబోయే ఆలయ భవనం.
    reason: cultural_note
lexical_decisions:
- source_word: עַתָּה
  choice: ఇప్పుడు
  rationale: కాల సూచనతో పాటు తక్షణ ప్రోత్సాహాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: תְּנוּ לְבַבְכֶם וְנַפְשְׁכֶם
  choice: మీ హృదయాన్నీ మీ ప్రాణాన్నీ అంకితం చేయండి
  rationale: అక్షరార్థమైన ‘ఇవ్వండి’ అనే భావాన్ని ఆధునిక తెలుగులో ఉద్దేశపూర్వకమైన సంపూర్ణ నిబద్ధతగా సహజంగా వ్యక్తం చేస్తూ, రెండు పదాలనూ నిలుపుతుంది.
- source_word: לֵבָב / נֶפֶשׁ
  choice: హృదయం / ప్రాణం
  rationale: హీబ్రూ మానవ అంతరంగాన్ని సూచించే జంట పదాలను ఒకే భావంగా కుదించకుండా కాపాడుతుంది; ఇక్కడ ‘హృదయం’ సంకల్పాన్ని కూడా సూచిస్తుంది.
- source_word: לִדְרוֹשׁ
  choice: వెదకడానికి
  rationale: దేవుని పట్ల భక్తితో, ఆధారపడుతూ ఆయనను ఆశ్రయించే భావాన్ని సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: హీబ్రూ ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో స్థిరపడిన రూపంలో లిప్యంతరీకరిస్తుంది.
- source_word: וְקוּמוּ
  choice: లేచి
  rationale: ఆజ్ఞాపూర్వక ప్రోత్సాహాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో అందిస్తుంది.
- source_word: מִקְדַּשׁ
  choice: పరిశుద్ధస్థలం
  rationale: ‘పవిత్రంగా ప్రత్యేకించబడిన స్థలం’ అనే మూలార్థాన్ని కాపాడి, తరువాత వచ్చే ‘మందిరం’ అనే భవన సూచనతో అనవసరంగా కలపదు.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: యెహోవా నిబంధన మందసం
  rationale: సంబంధ పదబంధాన్ని సహజమైన తెలుగు క్రమంలో స్పష్టంగా నిలుపుతుంది.
- source_word: כְלֵי קֹדֶשׁ הָאֱלֹהִים
  choice: దేవుని పరిశుద్ధ సామగ్రి
  rationale: כְּלִי అనే విస్తృత పదాన్ని కేవలం పాత్రలకే పరిమితం చేయకుండా ఆలయ సేవకు సంబంధించిన పవిత్ర వస్తువుల సమూహంగా తెలియజేస్తుంది.
- source_word: לַבַּיִת הַנִּבְנֶה לְשֵׁם יְהוָה
  choice: యెహోవా నామం కోసం కట్టబోయే మందిరంలోకి
  rationale: ‘ఇల్లు’ ఇక్కడ ఆలయ భవనాన్ని సూచిస్తున్నందున ‘మందిరం’ సహజమైన సందర్భార్థాన్ని ఇస్తుంది; ‘నామం కోసం’ అనే హీబ్రూ నిర్మాణాన్ని అతిగా వివరణ చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠం దైవనామాన్ని ప్రత్యక్షంగా ఉపయోగిస్తుంది; దాన్ని సాధారణ బిరుదుగా మార్చకుండా పేరుగానే నిలుపుతుంది.
- issue: ‘హృదయం మరియు ప్రాణం’ అనే మానవ అంతరంగ జంట
  choice: రెండు పదాలనూ స్పష్టంగా నిలిపి ‘మీ హృదయాన్నీ మీ ప్రాణాన్నీ’ అని అనువదించడం
  alternative: ‘మీ సర్వస్వాన్ని’ అని ఒకే భావంగా కుదించడం
  rationale: ఈ జంట సంపూర్ణ నిబద్ధతను బలపరుస్తుంది; అయినా సాంకేతికమైన ద్విభాగ మానవశాస్త్రాన్ని పాఠ్యంలోకి చేర్చదు.
- issue: ‘యెహోవా నామం కోసం’ అనే ఆలయ ఉద్దేశం
  choice: నామం అనే రూపకాన్ని అలాగే నిలుపడం
  alternative: ‘యెహోవా నివసించడానికి’ అని వివరణాత్మకంగా మార్చడం
  rationale: మూలంలోని ‘నామం’ భాషకు ఉన్న ధార్మిక ఉద్వేగాన్నీ సూచనాత్మకతనూ నిశ్శబ్దంగా పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, ప్రజలకు అర్థమయ్యే శైలిని ఉపయోగించాం. ఆజ్ఞల తీవ్రతను నిలుపుతూ కృత్రిమమైన ప్రాచీన పదప్రయోగాన్ని నివారించాం. ‘పరిశుద్ధస్థలం’ మరియు ‘మందిరం’ మధ్య మూలపాఠంలోని పదభేదాన్ని కాపాడాం.
