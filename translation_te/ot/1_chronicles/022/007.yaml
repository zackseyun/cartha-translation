source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר דָּוִ֖יד לִ/שְׁלֹמֹ֑ה בנ/ו אֲנִי֙ הָיָ֣ה עִם לְבָבִ֔/י לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֖ם יְהוָ֥ה אֱלֹהָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/007.yaml
  text: And David said to Solomon his son[a], “As for me[b], it was in my heart to build a house for the name of Yahweh my God.”
translation:
  language: te
  text: 'దావీదు తన కుమారుడైన సొలొమోనుతో ఇలా అన్నాడు: “నా విషయానికైతే, నా దేవుడైన యెహోవా నామానికి ఒక ఇల్లు[b] కట్టాలని నా హృదయంలో ఉండేది[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దాన్ని చేయాలని నేను నా హృదయంలో ఉంచుకున్నాను.” ఈ హీబ్రూ నుడికారం దావీదు అంతరంగ ఉద్దేశాన్ని లేదా దృఢసంకల్పాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మందిరం.” అక్షరార్థంగా, “ఇల్లు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ఇలా అన్నాడు
  rationale: హీబ్రూ కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగు శైలిలో కొనసాగిస్తుంది.
- source_word: לִשְׁלֹמֹה בְנוֹ
  choice: తన కుమారుడైన సొలొమోనుతో
  rationale: సొలొమోను దావీదు కుమారుడని స్పష్టంగా, సహజమైన తెలుగు పదక్రమంలో తెలియజేస్తుంది.
- source_word: אֲנִי
  choice: నా విషయానికైతే
  rationale: హీబ్రూలోని స్పష్టమైన ప్రథమ పురుష సర్వనామానికి ఉన్న ఉద్ఘాటనను నిలుపుతుంది.
- source_word: הָיָה עִם לְבָבִי
  choice: నా హృదయంలో ఉంది
  rationale: అంతరంగ ఉద్దేశం లేదా సంకల్పాన్ని తెలిపే హీబ్రూ నుడికారంలోని హృదయ రూపకాన్ని నిలుపుతుంది.
- source_word: לִבְנוֹת בַּיִת
  choice: ఒక ఇల్లు కట్టాలని
  rationale: בַּיִת అనే పదానికి ప్రాథమిక అర్థమైన ‘ఇల్లు’ను నిలుపుతూ, ‘మందిరం’ అనే సందర్భార్థాన్ని పాదసూచికలో అందిస్తుంది.
- source_word: לְשֵׁם
  choice: నామానికి
  rationale: యెహోవా నామానికి అంకితమైన స్థలమనే నిబంధనాత్మక, ఆరాధనాసంబంధ భాషను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన లిప్యంతరీకరణతో అందిస్తుంది.
- source_word: אֱלֹהָי
  choice: నా దేవుడైన
  rationale: హీబ్రూలోని ప్రథమ పురుష ఏకవచన స్వామ్య ప్రత్యయాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామాన్ని ఎలా అనువదించాలి
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది; దానిని బిరుదుగా మార్చకుండా తెలుగులో స్థిరపడిన రూపంతో అందించడం మూలంలోని నిబంధనాత్మక ప్రత్యేకతను నిలుపుతుంది.
- issue: בַּיִת ను ‘ఇల్లు’గా లేదా ‘మందిరం’గా అనువదించాలా
  choice: ఇల్లు
  alternative: మందిరం
  rationale: మూలపదం అక్షరార్థంగా ‘ఇల్లు’; సందర్భంలో అది దేవాలయాన్ని సూచించినా, మూలంలోని ధార్మిక పదప్రయోగాన్ని ప్రధాన పాఠంలో నిలుపుతూ సందర్భార్థాన్ని పాదసూచికలో తెలుపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘నా విషయానికైతే’ ఉద్ఘాటనను, ‘నా హృదయంలో’ మూలంలోని రూపకాన్ని, ‘నామానికి ఒక ఇల్లు’ మూలంలోని ధార్మిక పదప్రయోగాన్ని నిలుపుతాయి.
