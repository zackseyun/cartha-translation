source:
  edition: WLC
  text: הֽוּא יִבְנֶ֥ה בַ֨יִת֙ לִ/שְׁמִ֔/י וְ/הוּא֙ יִהְיֶה לִּ֣/י לְ/בֵ֔ן וַ/אֲנִי ל֖/וֹ לְ/אָ֑ב וַ/הֲכִ֨ינוֹתִ֜י כִּסֵּ֧א מַלְכוּת֛/וֹ עַל יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/010.yaml
  text: He will build a house for my name[a], and he will be a son to me, and I will be a father to him, and I will establish the throne of his kingdom over Israel forever.
translation:
  language: te
  text: అతడు నా నామం కోసం ఒక ఇల్లును[a] కడతాడు. అతడు నాకు కుమారుడిగా ఉంటాడు, నేను అతనికి తండ్రిగా ఉంటాను. అతని రాజ్యపు సింహాసనాన్ని ఇశ్రాయేలుమీద శాశ్వతంగా స్థిరపరుస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా నామం కోసం ఒక మందిరం.’ హెబ్రీలో అక్షరార్థంగా, ‘నా నామం కోసం ఒక ఇల్లు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיִת
  choice: మందిరం
  rationale: మూలార్థం ‘ఇల్లు’; ఈ సందర్భంలో యెహోవా నామం కోసం కట్టబడే ఆలయాన్ని సూచిస్తుంది. తెలుగులో ‘నా నామం కోసం ఇల్లు’ అసహజంగా లేదా సాధారణ నివాసంగా అపార్థమయ్యే అవకాశం ఉన్నందున సందర్భార్థమైన ‘మందిరం’ ప్రధాన పాఠ్యంలో వాడి, అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: לִשְׁמִי
  choice: నా నామం కోసం
  rationale: దేవునికి అంకితమైన స్థలాన్ని సూచించే హెబ్రీయ సంప్రదాయ పదబంధాన్ని నేరుగా నిలుపుతుంది; ‘నా ఘనత కోసం’ వంటి వ్యాఖ్యానాత్మక విస్తరణను నివారిస్తుంది.
- source_word: לְבֵן
  choice: కుమారుడిగా
  rationale: లְ సూచించే సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, తండ్రి–కుమారుని నిబంధనా సూత్రాన్ని బలహీనపరచదు.
- source_word: לְאָב
  choice: తండ్రిగా
  rationale: ‘కుమారుడిగా’ అనే సమాంతర సంబంధపదానికి తగిన సహజ తెలుగు రూపం.
- source_word: וַהֲכִינוֹתִי
  choice: నేను స్థిరపరుస్తాను
  rationale: כון హిఫీల్ రూపంలోని ‘దృఢంగా చేయడం, స్థాపించడం’ అనే భావాన్ని, రాజవంశ స్థిరత్వ సందర్భంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: כִּסֵּא מַלְכוּתוֹ
  choice: అతని రాజ్య సింహాసనం
  rationale: ‘సింహాసనం’ మరియు ‘రాజ్యం’ అనే రెండు రాజసంబంధ భావాలనూ నిలుపుతూ తెలుగులో సహజమైన షష్ఠీ సమాసంగా ఉంటుంది.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుపై
  rationale: రాజ్యపాలన లేదా అధికారాన్ని సూచించే עַל కు ‘పై’ నేరమైన, సహజమైన సమానార్థకం.
- source_word: עַד עוֹלָם
  choice: శాశ్వతంగా
  rationale: నిరంతర కాలవ్యాప్తిని గౌరవప్రదమైన ఆధునిక తెలుగులో సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: సొలొమోనుకు వర్తించే తండ్రి–కుమారుని నిబంధనా సూత్రం మరియు దావీదు సంబంధమైన విస్తృత వాగ్దానంతో దాని సంబంధం
  choice: ‘అతడు నాకు కుమారుడిగా ఉంటాడు, నేను అతనికి తండ్రిగా ఉంటాను’ అనే ప్రత్యక్ష సంబంధ భాషను నిలిపాం.
  alternative: ‘నేను అతనిని కుమారునిలా చూసుకుంటాను’ వంటి ఉపమానాత్మక లేదా బలహీనపరిచే వ్యాఖ్యానం.
  rationale: హెబ్రీ పాఠ్యం సంబంధాన్ని నేరుగా ప్రకటిస్తుంది. ఈ రూపం తక్షణ సందర్భంలోని సొలొమోను సూచనను నిలుపుతూనే, విస్తృత గ్రంథసంబంధ ప్రాముఖ్యతను ముందుగానే సిద్ధాంతపరంగా తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు స్పష్టంగా ఉంది. హెబ్రీ వాక్యంలోని మూడు ప్రధాన వాగ్దానాలను సహజమైన తెలుగు వాక్య విభజనతో అందించాం; నిబంధనా మరియు రాజవంశ సంబంధ పదజాలాన్ని నిలిపాం.
