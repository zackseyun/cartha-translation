source:
  edition: WLC
  text: וַ/עֲצֵ֥י אֲרָזִ֖ים לְ/אֵ֣ין מִסְפָּ֑ר כִּֽי הֵ֠בִיאוּ הַ/צִּֽידֹנִ֨ים וְ/הַ/צֹּרִ֜ים עֲצֵ֧י אֲרָזִ֛ים לָ/רֹ֖ב לְ/דָוִֽיד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/004.yaml
  text: and cedar timbers without number[a], for the Sidonians and Tyrians had brought cedar timbers in abundance to David.
translation:
  language: te
  text: దావీదు లెక్కలేనన్ని దేవదారు దుంగలను సమకూర్చాడు[a], ఎందుకంటే సీదోనీయులు, తూరీయులు దావీదుకు దేవదారు దుంగలను సమృద్ధిగా తీసుకొచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవదారు కలపను.’ హీబ్రూ పదబంధం దేవదారు కలపను విస్తృత అర్థంలో సూచించగలదు; అయితే ఆలయ నిర్మాణ సందర్భంలో అది నిర్మాణానికి ఉపయోగించే దుంగలను సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/עֲצֵי אֲרָזִים
  choice: దేవదారు దుంగలను కూడా
  rationale: నిర్మాణ సామగ్రి సందర్భంలో עֲצֵי אֲרָזִים నిలిచి ఉన్న చెట్లను కాక, నిర్మాణానికి ఉపయోగించే దేవదారు కలపను సూచిస్తుంది. ‘దుంగలు’ అనే పదం ఆ స్పష్టమైన నిర్మాణార్థాన్ని సహజంగా తెలియజేస్తుంది; వావ్‌ను తెలుగు వాక్యప్రవాహానికి అనుగుణంగా ‘కూడా’గా ఇచ్చాం.
- source_word: לְ/אֵין מִסְפָּר
  choice: లెక్కలేనన్ని
  rationale: ఈ హీబ్రూ నుడికారం లెక్కించలేనంత అధిక పరిమాణాన్ని తెలియజేస్తుంది; ‘లెక్కలేనన్ని’ ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా అదే భావాన్ని అందిస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఇక్కడ כִּי ముందున్న ప్రకటనకు కారణాన్ని పరిచయం చేస్తుంది. ‘ఎందుకంటే’ ఆ వివరణాత్మక సంబంధాన్ని స్పష్టంగా చూపిస్తుంది.
- source_word: הֵבִיאוּ
  choice: తీసుకొచ్చారు
  rationale: హిఫిల్ పర్ఫెక్ట్ బహువచనం ‘వారు తీసుకొచ్చారు’ అని అర్థం. తెలుగులో సాధారణ భూతకాల రూపమే సందర్భంలోని పూర్వ చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַ/צִּידֹנִים
  choice: సీదోనీయులు
  rationale: సీదోను నివాసులను సూచించే జాతివాచక బహువచనానికి ఇది ప్రామాణిక తెలుగు రూపం.
- source_word: וְ/הַ/צֹּרִים
  choice: తూరీయులు
  rationale: తూరు నివాసులను సూచించే జాతివాచక బహువచనానికి ఇది ప్రామాణిక తెలుగు రూపం; ‘సీదోనీయులు’తో సమాంతరంగా ఉంటుంది.
- source_word: לָ/רֹב
  choice: విస్తారంగా
  rationale: ఈ పదబంధం గొప్ప పరిమాణాన్ని సూచిస్తుంది. ‘విస్తారంగా’ సామగ్రి సమృద్ధిగా తీసుకురాబడిందనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: לְ/דָוִד
  choice: దావీదుకు
  rationale: לְ ఇక్కడ స్వీకర్తను సూచిస్తుంది; ‘దావీదుకు’ నేరుగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
