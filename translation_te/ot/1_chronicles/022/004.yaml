translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని అనుసరించాం. ఈ వచనం ముందరి వాక్యంలోని క్రియపై ఆధారపడినందున, తెలుగు పాఠకునికి వాక్యం స్వాభావికంగా ఉండేందుకు సందర్భానుసారంగా ‘సమకూర్చాడు’ను పునరుద్ధరించాం; మూలంలోని కారణసంబంధాన్ని ‘ఎందుకంటే’తో నిలిపాం.
