id: 1CH.22.2
reference: 1 Chronicles 22:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔יד לִ/כְנוֹס֙ אֶת הַ/גֵּרִ֔ים אֲשֶׁ֖ר בְּ/אֶ֣רֶץ יִשְׂרָאֵ֑ל וַ/יַּעֲמֵ֣ד חֹֽצְבִ֗ים לַ/חְצוֹב֙ אַבְנֵ֣י גָזִ֔ית לִ/בְנ֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/002.yaml
  text: And David ordered the foreigners who were in the land of Israel to be gathered[c][b][a], and he appointed stonecutters to cut dressed stones for building the house of God.
translation:
  language: te
  text: దావీదు ఇశ్రాయేలు దేశంలో ఉన్న పరదేశులను[a] సమకూర్చమని ఆజ్ఞాపించాడు. దేవుని గృహాన్ని[c] కట్టడానికి మలచిన రాళ్లను[b] చెక్కే రాతిపనివారిని నియమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తాత్కాలిక నివాసులను,’ ‘నివాస పరదేశులను.’ హీబ్రూ పదం ఇశ్రాయేలు దేశంలో నివసిస్తున్న ఇశ్రాయేలీయేతరులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘కోసిన రాళ్లను,’ ‘చెక్కి మలచిన రాళ్లను.’
    reason: lexical_alternative
  - marker: c
    text: అంటే దేవాలయం.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר ... לִכְנוֹס
  choice: సమకూర్చమని ఆజ్ఞాపించాడు
  rationale: וַיֹּאמֶר అక్షరార్థంగా ‘చెప్పాడు’; అయితే తరువాతి క్రియార్థక రూపంతో కలిసి ఇక్కడ ఆదేశ భావాన్ని వ్యక్తం చేస్తుంది. కర్త స్వయంగా సమకూర్చాడని కాక, అలా చేయమని ఆజ్ఞాపించాడనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: הַגֵּרִים
  choice: పరదేశులను
  rationale: ఇశ్రాయేలు దేశంలో నివసిస్తున్న ఇశ్రాయేలీయేతర వాసులను సూచిస్తుంది. ‘పరదేశులు’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా ఉండి, వారి నివాస స్థితి గురించిన పూర్తి వివరణను పాదసూచికలో ఉంచడానికి వీలిస్తుంది.
- source_word: בְּאֶרֶץ יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేశంలో
  rationale: אֶרֶץ అనే ‘దేశం/భూమి’ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וַיַּעֲמֵד חֹצְבִים
  choice: రాతిపనివారిని నియమించాడు
  rationale: ఈ సందర్భంలో וַיַּעֲמֵד పనికోసం మనుషులను నియమించడం లేదా ఏర్పరచడం; חֹצְבִים రాళ్లు కొట్టే లేదా చెక్కే పనివారిని సూచిస్తుంది.
- source_word: לַחְצוֹב אַבְנֵי גָזִית
  choice: చెక్కిన రాళ్లను సిద్ధం చేసే
  rationale: גָזִית నిర్మాణానికి తగినట్లు కోసి లేదా చెక్కి రూపుదిద్దిన రాళ్లను సూచిస్తుంది. ‘సిద్ధం చేసే’ అనే ప్రయోగం రాతిపనివారి కార్యాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ప్రత్యామ్నాయ పదబంధాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: לִבְנוֹת בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరాన్ని కట్టడానికి
  rationale: בֵּית అక్షరార్థంగా ‘ఇల్లు/గృహం’; ఈ సందర్భంలో నిర్మించబోయే దేవాలయాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన ‘మందిరం’ వాడి, అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: בֵּית הָאֱלֹהִים అనువాదం
  choice: దేవుని మందిరం
  alternative: దేవుని గృహం
  rationale: సందర్భంలో ఇది నిర్మించబోయే దేవాలయమే. ‘మందిరం’ సాధారణ తెలుగు పాఠకునికి ఉద్దేశిత స్థలాన్ని స్పష్టంగా తెలియజేస్తుంది; హీబ్రూ పదబంధపు అక్షరార్థమైన ‘దేవుని గృహం’ను పాదసూచికలో ఇచ్చి మూలరూపాన్ని కూడా సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. పరిపాలనా చర్యకు ‘ఆజ్ఞాపించాడు,’ ‘నియమించాడు’ అనే స్పష్టమైన పదాలు వాడబడ్డాయి. సాంకేతిక నిర్మాణ పదజాలాన్ని అతిగా భారంగా చేయకుండా, మూలంలోని ప్రత్యామ్నాయ భావాలను పాదసూచికల్లో నిలిపాం.
