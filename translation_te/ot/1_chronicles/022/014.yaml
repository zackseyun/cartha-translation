id: 1CH.22.14
reference: 1 Chronicles 22:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה בְ/עָנְיִ֜/י הֲכִינ֣וֹתִי לְ/בֵית יְהוָ֗ה זָהָ֞ב כִּכָּרִ֤ים מֵֽאָה אֶ֨לֶף֙ וְ/כֶ֗סֶף אֶ֤לֶף אֲלָפִים֙ כִּכָּרִ֔ים וְ/לַ/נְּחֹ֤שֶׁת וְ/לַ/בַּרְזֶל֙ אֵ֣ין מִשְׁקָ֔ל כִּ֥י לָ/רֹ֖ב הָיָ֑ה וְ/עֵצִ֤ים וַ/אֲבָנִים֙ הֲכִינ֔וֹתִי וַ/עֲלֵי/הֶ֖ם תּוֹסִֽיף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/014.yaml
  text: Behold[a], in my affliction I have prepared for the house of Yahweh one hundred thousand talents of gold, and one million talents of silver; and for the bronze and the iron there is no weighing, for it was in abundance. I have prepared timber and stones[c][b], and you may add to them.
translation:
  language: te
  text: ఇదిగో, నా కష్టస్థితిలో[a] యెహోవా మందిరం కోసం లక్ష తలాంతుల బంగారాన్ని, పది లక్షల తలాంతుల వెండిని సిద్ధం చేశాను. కంచు, ఇనుము విస్తారంగా ఉన్నందువల్ల వాటి బరువుకు లెక్కే లేదు. కలపను, రాళ్లను కూడా సిద్ధం చేశాను; నీవు వాటికి మరింత చేర్చవచ్చు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా పేదరికంలో.’ హీబ్రూ పదం బాధను, కష్టాన్ని, దీనస్థితిని లేదా పేదరికాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నీవు వాటికి మరింత చేర్చాలి’ లేదా ‘వాటికి మరింత చేర్చు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: ఇదిగో
  rationale: హిన్నే అనే దృష్టి ఆకర్షణ పదాన్ని సహజమైన తెలుగు ప్రకటనగా నిలుపుతుంది; మూలంలో లేని కాలసూచక ‘ఇప్పుడు’ను చేర్చదు.
- source_word: בְעָנְיִי
  choice: నా కష్టస్థితిలో
  rationale: עֳנִי ఇక్కడ బాధ, కష్టం, దురవస్థ లేదా పేదరికాన్ని సూచించగలదు. ‘కష్టస్థితిలో’ సందర్భానికి సహజంగా ఉండి అర్థపరిధిని అతిగా కుదించదు; పేదరికం అనే ప్రత్యామ్నాయం పాదటిప్పణిలో నిలుపబడింది.
- source_word: הֲכִינוֹתִי
  choice: సిద్ధం చేశాను
  rationale: כון హిఫిల్ రూపం ‘సిద్ధపరచడం/సమకూర్చడం’ అనే అర్థం ఇస్తుంది. దావీదు పూర్తిచేసిన ఏర్పాట్లను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְבֵית יְהוָה
  choice: యెహోవా మందిరం కోసం
  rationale: בַּיִת అక్షరార్థంగా ‘ఇల్లు’ అయినా ఇక్కడ నిర్మించబోయే దేవాలయాన్ని సూచిస్తుంది. తెలుగులో ‘మందిరం’ సాధారణ పాఠకునికి స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో వ్యక్తం చేసింది.
- source_word: כִּכָּרִים
  choice: తలాంతులు
  rationale: పురాతన పెద్ద బరువు ప్రమాణమైన כִּכָּר‌కు బైబిలు తెలుగులో స్థిరపడిన సమానార్థకం. దీనిని ఆధునిక బరువుగా మార్చితే ఖచ్చితత్వంపై అనిశ్చితి కలుగుతుంది.
- source_word: מֵאָה אֶלֶף
  choice: లక్ష
  rationale: 100,000ను సహజమైన భారతీయ సంఖ్యావ్యవస్థలో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: אֶלֶף אֲלָפִים
  choice: పది లక్షలు
  rationale: ‘వెయ్యి వేల’ అంటే 1,000,000; ఆధునిక తెలుగులో ‘పది లక్షలు’ అదే పరిమాణాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: וְלַנְּחֹשֶׁת וְלַבַּרְזֶל אֵין מִשְׁקָל כִּי לָרֹב הָיָה
  choice: కంచు, ఇనుము విస్తారంగా ఉన్నందువల్ల వాటి బరువుకు లెక్కే లేదు
  rationale: ‘బరువు లేదు’ అని అంటే లోహాలకు బరువే లేదన్న అపార్థం కలగవచ్చు. మూలంలోని ‘కొలవలేనంత/నమోదు చేయలేనంత విస్తారం’ భావాన్ని ‘బరువుకు లెక్కే లేదు’ సహజంగా అందిస్తుంది.
- source_word: וְעֵצִים וַאֲבָנִים
  choice: కలపను, రాళ్లను కూడా
  rationale: నిర్మాణ సందర్భంలో עֵצִיםకు ‘కలప’ సరైన సహజ సమానార్థకం; సమకూర్చిన ఇతర సామగ్రితో అనుసంధానాన్ని ‘కూడా’ స్పష్టం చేస్తుంది.
- source_word: וַעֲלֵיהֶם תּוֹסִיף
  choice: నీవు వాటికి మరింత చేర్చవచ్చు
  rationale: అసంపూర్ణ క్రియారూపం అనుమతి లేదా ఆదేశంగా వినిపించవచ్చు. సందర్భంలో దావీదు సిద్ధం చేసిన వాటికి సొలొమోను ఇంకా చేర్చగలడనే అనుమతిసూచక పఠనం సహజంగా ఉంది; ఆదేశార్థక ప్రత్యామ్నాయం పాదటిప్పణిలో ఇచ్చింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో సాధారణ బిరుదు కాకుండా ప్రత్యేక దైవనామం ఉంది. అందువల్ల దానిని ‘ప్రభువు’గా మార్చకుండా తెలుగులో పరిచితమైన నామరూపంతో నిలిపింది.
- issue: దావీదు స్థితిని సూచించే בְעָנְיִי
  choice: నా కష్టస్థితిలో
  alternative: నా పేదరికంలో
  rationale: ఈ పదం బాధ, కష్టం, దీనస్థితి, పేదరికం అనే పరస్పర సంబంధిత భావాలను కలిగి ఉంది. అపారమైన సమకూర్పుతో ఉన్న ఉద్రిక్తతను తొలగించకుండా ప్రధాన పాఠంలో విస్తృతమైన అర్థాన్ని, పాదటిప్పణిలో ఆర్థిక భావాన్ని నిలిపింది.
- issue: תּוֹסִיף యొక్క విధి భావం
  choice: చేర్చవచ్చు
  alternative: చేర్చాలి / చేర్చు
  rationale: హీబ్రూ అసంపూర్ణ రూపం భవిష్యత్, అనుమతి లేదా ఆదేశ ఛాయను కలిగి ఉండవచ్చు. ప్రధాన పాఠం సందర్భోచితమైన అనుమతిని ఎంచుకున్నా ఆదేశార్థక అవకాశాన్ని పాదటిప్పణిలో సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘తలాంతు’ వంటి చారిత్రక బరువు ప్రమాణాన్ని నిలిపి, భారతీయ సంఖ్యారీతిలో ‘లక్ష/పది లక్షలు’ వాడింది. మూలంలోని అస్పష్టతలను [a], [b] పాదటిప్పణుల్లో సంరక్షించింది.
