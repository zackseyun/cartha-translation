id: 1CH.22.16
reference: 1 Chronicles 22:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לַ/זָּהָ֥ב לַ/כֶּ֛סֶף וְ/לַ/נְּחֹ֥שֶׁת וְ/לַ/בַּרְזֶ֖ל אֵ֣ין מִסְפָּ֑ר ק֣וּם וַ/עֲשֵׂ֔ה וִ/יהִ֥י יְהוָ֖ה עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/016.yaml
  text: For the gold[a], the silver, the bronze, and the iron, there is no number. Rise up and work[c][b], and may Yahweh be with you.
translation:
  language: te
  text: బంగారం, వెండి, కంచు[a], ఇనుము—వాటికి లెక్కే లేదు[b]. లేచి పని చేయి; యాహ్వే నీకు తోడుగా ఉండుగాక[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కంచు’కు బదులుగా ‘రాగి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'అక్షరార్థంగా, ‘లెక్క లేదు’; భావం: అవి లెక్కించలేనన్ని ఉన్నాయి.'
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘యాహ్వే నీకు తోడుగా ఉంటాడు.’ హీబ్రూ రూపం ఆశీర్వాదం లేదా ఆకాంక్షను వ్యక్తం చేయగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: לַזָּהָב לַכֶּסֶף וְלַנְּחֹשֶׁת וְלַבַּרְזֶל
  choice: బంగారం, వెండి, కంచు, ఇనుము
  rationale: ప్రతి నామవాచకానికి ఉన్న לְ ఇక్కడ విషయసూచకంగా పనిచేస్తుంది. తెలుగులో సహజంగా ఉండేందుకు జాబితాను నేరుగా ఉంచి, తరువాతి వాక్యంతో అనుసంధానించాం.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ప్రాచీన నిర్మాణ సామగ్రి జాబితాలో ఈ పదం సాధారణంగా రాగి మిశ్రమమైన కంచును సూచిస్తుంది; సందర్భానుసారం ‘రాగి’ కూడా సాధ్యమే.
- source_word: אֵין מִסְפָּר
  choice: వాటికి లెక్కే లేదు
  rationale: హీబ్రూ నుడికారంలోని అపరిమిత పరిమాణ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: קוּם וַעֲשֵׂה
  choice: లేచి పని చేయి
  rationale: రెండు ఆజ్ఞారూపాల కార్యప్రేరణను నిలుపుతూ, ఆలయ నిర్మాణ సందర్భంలో עשהను ‘పని చేయి’గా స్పష్టంగా అనువదించాం.
- source_word: וִיהִי יְהוָה עִמָּךְ
  choice: యెహోవా నీకు తోడుగా ఉండుగాక
  rationale: జస్సివ్ రూపంలోని ఆశీర్వాదం లేదా ఆకాంక్ష భావాన్ని ‘ఉండుగాక’ సహజంగా వ్యక్తపరుస్తుంది; దేవుని వ్యక్తినామాన్ని లిప్యంతరీకరించాం.
theological_decisions:
- issue: יְהוָה అనే దైవనామ అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు పాఠకులకు సుపరిచితమైన రూపంలో నిలిపాం.
- issue: וִיהִי యొక్క భావం
  choice: 'ఆశీర్వాదం/ఆకాంక్ష: ‘ఉండుగాక’'
  alternative: 'వాగ్దానం: ‘ఉంటాడు’'
  rationale: ఈ జస్సివ్ రూపం సాధారణ భవిష్యద్వాక్యంగా కాక ఆశీర్వాదం లేదా కోరికగా అర్థమయ్యే అవకాశాన్ని ప్రధాన పాఠంలో నిలిపాం; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ‘లేచి పని చేయి’ కార్యప్రేరణను సహజంగా అందిస్తుంది; ‘ఉండుగాక’ ఆశీర్వాద ధోరణిని కాపాడుతుంది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
