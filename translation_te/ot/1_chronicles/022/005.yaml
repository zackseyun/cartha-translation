  text: וַ/יֹּ֣אמֶר דָּוִ֗יד שְׁלֹמֹ֣ה בְנִ/י֮ נַ֣עַר וָ/רָךְ֒ וְ/הַ/בַּ֜יִת לִ/בְנ֣וֹת לַ/יהוָ֗ה לְ/הַגְדִּ֨יל לְ/מַ֜עְלָ/ה לְ/שֵׁ֤ם וּ/לְ/תִפְאֶ֨רֶת֙ לְ/כָל הָ֣/אֲרָצ֔וֹת אָכִ֥ינָה נָּ֖א ל֑/וֹ וַ/יָּ֧כֶן דָּוִ֛יד לָ/רֹ֖ב לִ/פְנֵ֥י מוֹתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/005.yaml
  text: And David said[a], “My son Solomon is young and inexperienced, and the house to be built for Yahweh must be made exceedingly great in fame and splendor in all lands[c][b]. I will now make preparation for it.” So David made abundant preparations before his death.
translation:
  language: te
  text: 'దావీదు ఇలా అన్నాడు: “నా కుమారుడైన సొలొమోను యువకుడు, అనుభవం లేనివాడు.[a] యెహోవా కోసం నిర్మించవలసిన ఇల్లు[b] అన్ని దేశాలలో పేరు, వైభవం కలిగేలా అత్యంత గొప్పదిగా నిర్మించబడాలి.[c] దాని కోసం నేను ఇప్పుడు సన్నాహాలు చేస్తాను.” దావీదు తన మరణానికి ముందే సమృద్ధిగా సన్నాహాలు చేశాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యువకుడు, లేతవాడు.” “లేతవాడు” అనే హీబ్రూ విశేషణం ఇక్కడ సొలొమోను అపరిపక్వతను లేదా అనుభవరాహిత్యాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: హీబ్రూలో “ఇల్లు.” సందర్భంలో ఇది యెహోవా మందిరాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా “పేరు కోసం, వైభవం కోసం”; “కీర్తి, శోభ కోసం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר וָרָךְ
  choice: చిన్నవాడు, అనుభవం లేనివాడు
  rationale: נַעַר సొలొమోను సాపేక్షంగా చిన్నవాడని, וָרָךְ అతని అపరిపక్వత లేదా అనుభవరాహిత్యాన్ని సూచిస్తున్నాయి. సహజమైన ఆధునిక తెలుగులో సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: הַבַּיִת
  choice: మందిరం
  rationale: మూలార్థం ‘ఇల్లు’ అయినా, ఇక్కడ యెహోవా కోసం నిర్మించబోయే పవిత్ర భవనమే ఉద్దేశం. తెలుగులో ‘మందిరం’ సహజంగా, స్పష్టంగా ఉంటుంది; మూలరూపం పాదటిప్పణిలో నిలుపబడింది.
- source_word: לַיהוָה
  choice: యెహోవా కోసం
  rationale: יהוה అనే దైవనామాన్ని దాచకుండా సాధారణ తెలుగు లిప్యంతరీకరణ ‘యెహోవా’గా అందిస్తుంది.
- source_word: לְהַגְדִּיל לְמַעְלָה
  choice: అత్యంత గొప్పగా ఉండాలి
  rationale: ఈ పదబంధంలోని తీవ్రతను, అసాధారణమైన గొప్పతనాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לְשֵׁם וּלְתִפְאֶרֶת
  choice: పేరుప్రఖ్యాతులు, వైభవం పొందేలా
  rationale: שֵׁם లోని కీర్తి లేదా పేరు భావాన్నీ, תִּפְאֶרֶת లోని మహిమ, శోభ భావాన్నీ సందర్భానుకూలంగా తెలియజేస్తుంది.
- source_word: לְכָל הָאֲרָצוֹת
  choice: అన్ని దేశాల్లో
  rationale: బహువచన ‘దేశాలు/ప్రాంతాలు’ అనే అంతర్జాతీయ పరిధిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: אָכִינָה נָּא לוֹ
  choice: దాని కోసం నేను ఇప్పుడే ఏర్పాట్లు చేస్తాను
  rationale: కోహోర్టేటివ్ రూపంలోని దావీదు సంకల్పాన్ని, נא యొక్క తక్షణతను తెలియజేస్తుంది. లోֹ అనే సర్వనామాన్ని సందర్భానుసారం నిర్మాణ కార్యాన్ని సూచించేదిగా తీసుకుంది.
- source_word: לָרֹב
  choice: విస్తారంగా ఏర్పాట్లు
  rationale: దావీదు చేసిన సన్నాహాల అత్యధిక పరిమాణాన్ని సరళంగా తెలియజేస్తుంది.
- source_word: לִפְנֵי מוֹתוֹ
  choice: తాను చనిపోకముందే
  rationale: కాలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగు కథనశైలిలో అందిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు / యాహ్వే
  rationale: మూలంలో వ్యక్తిగత దైవనామం ప్రత్యక్షంగా ఉంది. దాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపాన్ని ఉపయోగించింది.
- issue: הַבַּיִת ను ‘ఇల్లు’గా లేదా ‘మందిరం’గా అనువదించడం
  choice: మందిరం
  alternative: ఇల్లు
  rationale: మూలపదం ‘ఇల్లు’ అయినప్పటికీ, ఈ సందర్భంలో యెహోవా కోసం నిర్మించబోయే ఆరాధనా భవనం ఉద్దేశించబడింది. తెలుగు పాఠకునికి వెంటనే స్పష్టమయ్యేలా ‘మందిరం’ను ప్రధాన పాఠంలో ఉంచి, యథార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చింది.
- issue: לְשֵׁם וּלְתִפְאֶרֶת లోని ఉద్దేశం/ఫలితం
  choice: పేరుప్రఖ్యాతులు, వైభవం పొందేలా
  alternative: పేరు కోసం, మహిమ కోసం
  rationale: హీబ్రూ పునరుక్త לְ ఉపసర్గల ఉద్దేశం లేదా ఫలిత భావాన్ని పూర్తిగా ఒక దిశలో నిర్ణయించకుండా, తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; మరింత పదానుసార రూపాన్ని పాదటిప్పణిలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. సాధారణ పాఠకునికి స్పష్టత కోసం ‘మందిరం’, ‘అనుభవం లేనివాడు’ వంటి సందర్భార్థ పదాలను వాడి, మూలంలోని పదానుసార ప్రత్యామ్నాయాలు మరియు నిజమైన అర్థసంభావ్యతలను పాదటిప్పణుల్లో భద్రపరిచింది.
