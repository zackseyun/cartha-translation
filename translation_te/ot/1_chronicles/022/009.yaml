source:
  edition: WLC
  text: הִנֵּה בֵ֞ן נוֹלָ֣ד לָ֗/ךְ ה֤וּא יִהְיֶה֙ אִ֣ישׁ מְנוּחָ֔ה וַ/הֲנִח֥וֹתִי ל֛/וֹ מִ/כָּל אוֹיְבָ֖י/ו מִ/סָּבִ֑יב כִּ֤י שְׁלֹמֹה֙ יִהְיֶ֣ה שְׁמ֔/וֹ וְ/שָׁל֥וֹם וָ/שֶׁ֛קֶט אֶתֵּ֥ן עַל יִשְׂרָאֵ֖ל בְּ/יָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/009.yaml
  text: Behold[a], a son will be born to you. He will be a man of rest, and I will give him rest from all his enemies all around; for Solomon will be his name[b], and I will give peace and quiet to Israel in his days.
translation:
  language: te
  text: ఇదిగో, నీకు ఒక కుమారుడు పుడతాడు. అతడు విశ్రాంతిగల మనిషిగా ఉంటాడు. చుట్టుపక్కల ఉన్న అతని శత్రువులందరి నుండి నేను అతనికి విశ్రాంతిని ఇస్తాను. ఎందుకంటే అతని పేరు సొలొమోను[a] అవుతుంది; అతని కాలంలో నేను ఇశ్రాయేలుకు శాంతినీ ప్రశాంతతనీ ఇస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీలో ‘సొలొమోను’ అనే పేరు ‘శాంతి’ (షాలోమ్) అనే పదంతో ధ్వని-భావ సంబంధం కలిగి ఉంది; ఈ వచనం అతణ్ణి ‘విశ్రాంతిగల మనిషి’గా కూడా వర్ణిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: ఇదిగో
  rationale: హెబ్రీ పదంలోని శ్రద్ధను ఆకర్షించే, గంభీరమైన ప్రకటన భావాన్ని సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: בֵן נוֹלָד לָךְ
  choice: నీకు ఒక కుమారుడు పుడతాడు
  rationale: భవిష్యత్తులో నెరవేరబోయే వాగ్దానాన్ని సందర్భానుసారంగా స్పష్టంగా వ్యక్తం చేస్తుంది; ‘నీకు’ అనే దత్తార్థాన్నీ నిలుపుతుంది.
- source_word: אִישׁ מְנוּחָה
  choice: విశ్రాంతి పొందే వ్యక్తి
  rationale: ‘విశ్రాంతి’ అనే మూలభావాన్ని తరువాతి וַהֲנִחוֹתִי తో అనుసంధానిస్తూ, ఆధునిక తెలుగులో అర్థమయ్యేలా అనువదిస్తుంది.
- source_word: וַהֲנִחוֹתִי לוֹ
  choice: నేను అతనికి విశ్రాంతి కలిగిస్తాను
  rationale: దేవుడు భద్రతతో కూడిన విశ్రాంతిని అనుగ్రహిస్తాడనే causative భావాన్ని, ముందు వచ్చిన ‘విశ్రాంతి’తో పదసంబంధాన్ని నిలుపుతూ తెలియజేస్తుంది.
- source_word: מִכָּל אוֹיְבָיו מִסָּבִיב
  choice: చుట్టూ ఉన్న అతని శత్రువులందరి నుండి
  rationale: శత్రువుల సంపూర్ణతను, వారు అన్ని వైపులా ఉన్నారనే భావాన్ని రెండింటినీ సహజంగా అందిస్తుంది.
- source_word: שְׁלֹמֹה יִהְיֶה שְׁמוֹ
  choice: అతని పేరు సొలొమోను అవుతుంది
  rationale: పేరును యథావిధిగా లిప్యంతరీకరిస్తూ హెబ్రీ వాక్యంలోని భవిష్యత్ ప్రకటనను నిలుపుతుంది.
- source_word: שָׁלוֹם וָשֶׁקֶט
  choice: శాంతినీ ప్రశాంతతనీ
  rationale: రెండు వేర్వేరు హెబ్రీ పదాలను కలిపివేయకుండా, శ్రేయస్సుతో కూడిన శాంతి మరియు కలవరంలేని ప్రశాంత స్థితి అనే భావాలను విడిగా వ్యక్తం చేస్తుంది.
- source_word: בְּיָמָיו
  choice: అతని కాలంలో
  rationale: పదశః ‘అతని దినాల్లో’ అనే భావాన్ని ఆధునిక తెలుగులో సహజమైన కాలసూచక రూపంలో అందిస్తుంది.
theological_decisions:
- issue: విశ్రాంతి, సొలొమోను అనే పేరు, శాంతి మధ్య ఉన్న భావసంబంధం
  choice: מְנוּחָה మరియు נוח పదాలను ‘విశ్రాంతి’తో అనుసంధానించి, שָׁלוֹם ను ‘శాంతి’గా వేరు చేసి అనువదించడం
  alternative: אִישׁ מְנוּחָה ను ‘శాంతి గలవాడు’గా అనువదించి తరువాతి ‘శాంతి’తో నేరుగా కలపడం
  rationale: హెబ్రీ పాఠం విశ్రాంతి మరియు శాంతి అనే సంబంధితమైనా వేర్వేరు పదాలను ఉపయోగిస్తుంది. వాటిని వేరు చేసి ఉంచడం ద్వారా మూలంలోని పదసంపదను, సొలొమోను పేరుతో ఉన్న ధ్వని-భావ సంబంధాన్ని బలవంతంగా ఒకే అర్థంగా మార్చకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన దైవప్రకటన శైలిని ఉంచుతూ, సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఉపయోగించాం. ‘విశ్రాంతి గల మనిషి’ అనే కృత్రిమ పదబంధం బదులు ‘విశ్రాంతి పొందే వ్యక్తి’ అని సహజీకరించాం; అయితే మూలంలోని ‘విశ్రాంతి’ పదపునరుక్తిని నిలిపాం.
