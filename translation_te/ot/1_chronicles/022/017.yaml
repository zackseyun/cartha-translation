source:
  edition: WLC
  text: וַ/יְצַ֤ו דָּוִיד֙ לְ/כָל שָׂרֵ֣י יִשְׂרָאֵ֔ל לַ/עְזֹ֖ר לִ/שְׁלֹמֹ֥ה בְנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/017.yaml
  text: Then David commanded all the leaders of Israel to help Solomon his son.
translation:
  language: te
  text: అప్పుడు దావీదు తన కుమారుడైన సొలొమోనుకు సహాయం చేయాలని ఇశ్రాయేలు నాయకులందరికీ ఆజ్ఞాపించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: అప్పుడు ... ఆజ్ఞాపించాడు
  rationale: צוה అనే క్రియ అధికారపూర్వకమైన ఆదేశాన్ని సూచిస్తుంది; కథనాన్ని ముందుకు నడిపించే וַ రూపాన్ని సహజమైన తెలుగులో ‘అప్పుడు’ అని వ్యక్తం చేశాం.
- source_word: שָׂרֵי
  choice: నాయకులు
  rationale: ఈ పదం పాలనా బాధ్యతగల ప్రముఖులను లేదా అధికారులను సూచిస్తుంది. సందర్భాన్ని అతిగా నిర్దిష్టం చేయకుండా ఆధునిక తెలుగులో ‘నాయకులు’ స్పష్టంగా ఉంటుంది.
- source_word: לְכָל שָׂרֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు నాయకులందరికీ
  rationale: జాతీయ నాయకత్వమంతటినీ ఉద్దేశించిన సమగ్ర భావాన్ని, ఇశ్రాయేలుతో వారి సంబంధాన్ని ఈ రూపం సహజంగా నిలుపుతుంది.
- source_word: לַעְזֹר
  choice: సహాయం చేయాలని
  rationale: עזר యొక్క మూలార్థమైన ‘సహాయం చేయు’ను నేరుగా వ్యక్తం చేస్తూ, తెలుగులో ఆజ్ఞాపించాడు అనే క్రియతో సహజంగా అనుసంధానించబడింది.
- source_word: לִשְׁלֹמֹה בְנוֹ
  choice: తన కుమారుడైన సొలొమోనుకు
  rationale: సొలొమోను దావీదు కుమారుడనే సంబంధాన్ని స్పష్టంగా నిలుపుతూ, తెలుగులో సహజమైన పదక్రమాన్ని ఉపయోగించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని అధికారపూర్వక ఆదేశం, నాయకుల సమగ్రత, తండ్రి–కుమార సంబంధం యథాతథంగా నిలుపబడ్డాయి.
