  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עִמְּ/ךָ֤ לָ/רֹב֙ עֹשֵׂ֣י מְלָאכָ֔ה חֹצְבִ֕ים וְ/חָרָשֵׁ֥י אֶ֖בֶן וָ/עֵ֑ץ וְ/כָל חָכָ֖ם בְּ/כָל מְלָאכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/015.yaml
  text: 'And with you in abundance are workers for the task: stonecutters[a], and craftsmen of stone and wood, and every skilled man for every kind of work.'
translation:
  language: te
  text: నీ దగ్గర సమృద్ధిగా పనివారు ఉన్నారు—రాళ్లు చెక్కేవారు, రాతి పనివారు, చెక్క పనివారు, ప్రతి పనిలో నైపుణ్యం ఉన్నవారూ ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో అక్షరార్థంగా “ప్రతి నైపుణ్యంగల పురుషుడు” అని ఉంది; ఇక్కడ అది నైపుణ్యంగల పనివారిని సమష్టిగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמְּךָ
  choice: నీ దగ్గర ... ఉన్నారు
  rationale: హీబ్రూ పదబంధంలోని ప్రత్యక్ష సంబోధనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: לָרֹב
  choice: విస్తారంగా
  rationale: పనివారు పెద్ద సంఖ్యలో, సమృద్ధిగా ఉన్నారనే భావాన్ని తెలియజేస్తుంది.
- source_word: עֹשֵׂי מְלָאכָה
  choice: పనివారు
  rationale: నిర్మాణకార్యంలో నిమగ్నమైన వారిని సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: חֹצְבִים
  choice: రాళ్లు చెక్కేవారు
  rationale: ఆలయ నిర్మాణ సందర్భంలో సూచిత కర్మను స్పష్టం చేస్తూ, రాళ్లు కొట్టి లేదా చెక్కి సిద్ధం చేసేవారిని తెలియజేస్తుంది.
- source_word: וְחָרָשֵׁי אֶבֶן וָעֵץ
  choice: రాతి పనివారు, చెక్క పనివారు
  rationale: חָרָשׁ లోని నైపుణ్యవృత్తి భావాన్ని సాధారణ పాఠకులకు సహజమైన వృత్తిపదాలతో అందిస్తుంది.
- source_word: וְכָל חָכָם בְּכָל מְלָאכָה
  choice: ప్రతి విధమైన పనిలో నైపుణ్యంగల వారందరూ
  rationale: חָכָם ఇక్కడ జ్ఞానంకన్నా ఆచరణాత్మక నైపుణ్యాన్ని సూచిస్తుంది; ఏకవచన పుంలింగ రూపానికి ఉన్న ప్రతినిధి/సమష్టి భావాన్ని తెలుగులో సహజమైన బహువచనంతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: חָכָם లోని పుంలింగ ఏకవచన రూపం
  choice: నైపుణ్యంగల వారందరూ
  alternative: నైపుణ్యంగల ప్రతి పురుషుడు
  rationale: హీబ్రూ రూపం వ్యాకరణపరంగా పుంలింగ ఏకవచనమైనా, ఈ సందర్భంలో నైపుణ్యంగల కార్మిక వర్గాన్ని ప్రతినిధిగా సూచిస్తుంది. తెలుగు అనువాదం సందర్భార్థాన్ని స్పష్టంగా ఉంచుతూ అనవసరంగా పరిధిని కుదించదు; మూలరూప వివరాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే నిర్మాణం. వృత్తులను స్పష్టంగా వేరు చేసి, హీబ్రూ జాబితా ధోరణిని నిలుపుకుంది.
