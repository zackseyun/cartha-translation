revisions:
- from: నీ దగ్గర పనివారు విస్తారంగా ఉన్నారు—రాళ్లు చెక్కేవారు, రాతి పనివారు, చెక్క పనివారు, అలాగే ప్రతి విధమైన పనిలో నైపుణ్యంగల వారందరూ.[a]
  to: నీ దగ్గర సమృద్ధిగా పనివారు ఉన్నారు—రాళ్లు చెక్కేవారు, రాతి పనివారు, చెక్క పనివారు, ప్రతి పనిలో నైపుణ్యం ఉన్నవారూ ఉన్నారు.[a]
  rationale: The revision retains the source’s list structure and vocational terminology while making the abundance expression more idiomatic and rendering the final distributive phrase without unnecessary double quantification. The footnote remains anchored to the final skill expression, which is the phrase it explains.
