id: 1CH.22.6
reference: 1 Chronicles 22:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּקְרָ֖א לִ/שְׁלֹמֹ֣ה בְנ֑/וֹ וַ/יְצַוֵּ֨/הוּ֙ לִ/בְנ֣וֹת בַּ֔יִת לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/006.yaml
  text: Then he called for Solomon his son and commanded him to build a house for Yahweh[a], the God of Israel.
translation:
  language: te
  text: అప్పుడు దావీదు తన కుమారుడైన సొలొమోనును పిలిచి, ఇశ్రాయేలు దేవుడైన యాహ్వే కోసం ఒక మందిరం[a] కట్టమని అతనికి ఆజ్ఞాపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల హీబ్రూలో అక్షరార్థంగా ‘యాహ్వే కోసం ఒక ఇల్లు’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: అప్పుడు ... పిలిపించి
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; קרא ל ఒక వ్యక్తిని రప్పించడానికి పిలవడం అనే భావం ఇస్తుంది. ఆధునిక తెలుగులో ‘పిలిపించి’ సహజంగా ఉంది.
- source_word: לִשְׁלֹמֹה בְנוֹ
  choice: తన కుమారుడైన సొలొమోనును
  rationale: సొలొమోను దావీదు కుమారుడని మూలంలోని సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: וַיְצַוֵּהוּ
  choice: అతనికి ఆజ్ఞాపించాడు
  rationale: צוה లోని అధికారపూర్వక ఆజ్ఞ భావాన్ని నిలుపుతుంది.
- source_word: לִבְנוֹת
  choice: కట్టమని
  rationale: צוה తరువాత వచ్చే ఇన్ఫినిటివ్ ఆజ్ఞలోని విషయాన్ని తెలుగులో సహజమైన ఉద్ధరణాత్మక నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: בַּיִת
  choice: ఒక మందిరం
  rationale: בית అక్షరార్థంగా ‘ఇల్లు’ అయినా, ఇక్కడ యెహోవా ఆరాధన కోసం కట్టబోయే ఆలయాన్ని సూచిస్తుంది. తెలుగులో ‘మందిరం’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: לַיהוָה
  choice: యెహోవా కోసం
  rationale: ל అంకితం లేదా ప్రయోజన భావాన్ని ఇక్కడ ‘కోసం’ సహజంగా వ్యక్తం చేస్తుంది; יהוה అనే దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేవుడైన
  rationale: నిర్మాణ సంబంధాన్ని తెలుగులో సహజమైన విశేషణ నిర్మాణంగా మార్చి, యెహోవాను ఇశ్రాయేలు దేవునిగా గుర్తిస్తుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ఒడంబడిక నామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపంలో నిలిపాం.
- issue: בית యొక్క ఆలయసందర్భార్థం
  choice: మందిరం
  alternative: ఇల్లు
  rationale: ఇక్కడ ఉద్దేశించినది దేవుని ఆరాధనా భవనం. ‘మందిరం’ సందర్భాన్ని స్పష్టం చేస్తుంది; అయితే మూలంలోని సాధారణ ‘ఇల్లు’ పదాన్ని పాదసూచిక ద్వారా సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథనశైలి. ముందు సందర్భం వల్ల కర్త దావీదు అని స్పష్టమవుతున్నప్పటికీ, తెలుగు వాక్యంలో అయోమయం రాకుండా అతని పేరును వెల్లడించాం.
