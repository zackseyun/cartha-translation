id: 1CH.22.8
reference: 1 Chronicles 22:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְהִ֨י עָלַ֤/י דְּבַר יְהוָה֙ לֵ/אמֹ֔ר דָּ֤ם לָ/רֹב֙ שָׁפַ֔כְתָּ וּ/מִלְחָמ֥וֹת גְּדֹל֖וֹת עָשִׂ֑יתָ לֹֽא תִבְנֶ֥ה בַ֨יִת֙ לִ/שְׁמִ֔/י כִּ֚י דָּמִ֣ים רַבִּ֔ים שָׁפַ֥כְתָּ אַ֖רְצָ/ה לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/008.yaml
  text: But the word of Yahweh came to me[a], saying, ‘You have shed much blood and fought great wars. You shall not build a house for my name[d][c][b], because you have shed much blood on the earth before me.’
translation:
  language: te
  text: 'అయితే యాహ్వే వాక్కు నాకు వచ్చి ఇలా చెప్పింది: “నీవు ఎంతో రక్తం చిందించావు[a], గొప్ప యుద్ధాలు చేశావు[b]. నా నామం కోసం ఒక గృహాన్ని[c] నీవు కట్టకూడదు; ఎందుకంటే నీవు నా సన్నిధిలో నేలపై[d] ఎంతో రక్తం చిందించావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విస్తారంగా రక్తం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘గొప్ప యుద్ధాలు సాగించావు.’
    reason: lexical_alternative
  - marker: c
    text: అంటే దేవాలయం; హీబ్రూలో ‘నా నామం కోసం ఒక గృహం.’
    reason: cultural_note
  - marker: d
    text: లేదా, ‘భూమిపై.’ హీబ్రూ రూపానికి ‘నేలకు’ అనే దిశార్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר יְהוָה
  choice: యాహ్వే వాక్కు
  rationale: దైవిక నామాన్ని ‘యాహ్వే’గా ఉంచి, ప్రవచనాత్మక సూత్రంలోని דְּבַר అనే పదానికి సహజమైన తెలుగు ‘వాక్కు’ను వాడింది.
- source_word: וַיְהִי עָלַי
  choice: నాకు వచ్చి
  rationale: ‘నాపై కలిగింది’ అనే అక్షరార్థానికి బదులుగా, దేవుని వాక్కు దావీదుకు అందిందనే హీబ్రూ నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: דָּם לָרֹב / דָּמִים רַבִּים
  choice: ఎంతో రక్తం
  rationale: రక్తపాతం విస్తారంగా జరిగిందనే భావాన్ని నిలుపుతూ, రెండు చోట్లా మూలంలోని స్పష్టమైన ‘రక్తం’ రూపకాన్ని పునరావృతం చేస్తుంది.
- source_word: וּמִלְחָמוֹת גְּדֹלוֹת עָשִׂיתָ
  choice: గొప్ప యుద్ధాలు చేశావు
  rationale: ‘యుద్ధాలు చేశావు’ అనేది మూలంలోని עשה నిర్మాణానికి దగ్గరగా ఉండి, తెలుగులో అర్థమయ్యే సైనిక ప్రయోగం.
- source_word: לֹא תִבְנֶה בַיִת לִשְׁמִי
  choice: నా నామం కోసం ఒక గృహాన్ని నీవు కట్టకూడదు
  rationale: సందర్భంలో దేవాలయం ఉద్దేశించబడినా, בַיִת అనే ‘గృహం’ పదాన్ని నిలిపి ఆలయ–గృహ భావసంబంధాన్ని కాపాడుతుంది; ‘నా నామం కోసం’ అనే నిబంధనాత్మక భాషను కూడా వివరణగా మార్చదు.
- source_word: אַרְצָה לְפָנָי
  choice: నా సన్నిధిలో నేలపై
  rationale: לְפָנַי యొక్క దేవుని దృష్టి/సన్నిధి భావాన్ని నిలుపుతూ, దిశార్థక אַרְצָהను రక్తం చిందించడం అనే సందర్భానికి సహజంగా ‘నేలపై’గా అందిస్తుంది.
theological_decisions:
- issue: దైవిక నామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలంలో ఉన్న నిబంధన నామాన్ని బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండిత ఉచ్చారణకు దగ్గరైన తెలుగు లిప్యంతరీకరణను వాడింది.
- issue: בַיִתను ‘గృహం’గా లేదా ‘దేవాలయం’గా అనువదించడం
  choice: గృహం
  alternative: దేవాలయం / మందిరం
  rationale: ఇక్కడ ఉద్దేశం దేవాలయమే అయినా, మూలపదం ‘గృహం’; దానిని నిలపడం వాక్యంలోని ఆలయ–గృహ రూపకాన్ని అతిగా వ్యాఖ్యానించకుండా కాపాడుతుంది.
- issue: దావీదు రక్తపాతం గురించి వాక్యపు నైతిక–దైవశాస్త్రీయ ఉద్రిక్తత
  choice: మూలంలోని కారణ ప్రకటనను యథాతథంగా ఉంచడం
  alternative: రక్తపాతం అన్యాయమైనదని లేదా యుద్ధాలన్నీ దేవుని ఆజ్ఞవల్లనే జరిగాయని వివరణ చేర్చడం
  rationale: వాక్యం స్వయంగా ఆ వివరణల్లో ఏదీ స్పష్టంగా చెప్పదు; కాబట్టి దేవాలయం కట్టకూడదనే నిషేధానికి రక్తపాతాన్ని కారణంగా చూపే ఉద్రిక్తతను పరిష్కరించకుండా ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉండే వాక్యనిర్మాణం వాడబడింది. ‘యాహ్వే,’ ‘వాక్కు,’ ‘నా సన్నిధిలో’ వంటి పదాలు బైబిలు సందర్భానికి తగిన గౌరవభావాన్ని ఇస్తాయి; ‘గృహం’ మూలంలోని ఆలయ–గృహ రూపకాన్ని నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
