  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אַ֣ךְ יִֽתֶּן לְּ/ךָ֤ יְהוָה֙ שֵׂ֣כֶל וּ/בִינָ֔ה וִֽ/יצַוְּ/ךָ֖ עַל יִשְׂרָאֵ֑ל וְ/לִ/שְׁמ֕וֹר אֶת תּוֹרַ֖ת יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/012.yaml
  text: Only[a], may Yahweh give you insight and understanding, and command you concerning Israel[b], that you may keep the law of Yahweh your God.
translation:
  language: te
  text: ముఖ్యంగా, యాహ్వే నీకు వివేకాన్నీ అవగాహననూ ఇచ్చి, ఇశ్రాయేలుపై నీకు బాధ్యత అప్పగించుగాక[a], తద్వారా నీవు నీ దేవుడైన యాహ్వే ధర్మశాస్త్రాన్ని పాటించేలా చేయుగాక[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలు విషయమై నీకు ఆజ్ఞాపించుగాక’; ‘ఇశ్రాయేలుపై నిన్ను నియమించుగాక’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీ దేవుడైన యాహ్వే ఉపదేశాన్ని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: ముఖ్యంగా
  rationale: ఈ సందర్భంలో ఇది దావీదు కోరికలో ప్రధాన విషయాన్ని ముందుకు తెచ్చే కేంద్రీకరణ అవ్యయం. తెలుగులో అసహజంగా ఉండే ‘కేవలం’ కంటే ‘ముఖ్యంగా’ ఇక్కడి భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: יִתֶּן
  choice: అనుగ్రహించి … ఆజ్ఞాపించుగాక
  rationale: రూపరీత్యా అసంపూర్ణ క్రియ అయినా, సందర్భంలో ఇది ఆశీర్వాదపూర్వక కోరికను వ్యక్తం చేస్తుంది; ‘ఇచ్చుగాక’ భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో ‘అనుగ్రహించుగాక’గా అందించాం.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: హీబ్రూ దైవనామాన్ని బిరుదుగా మార్చకుండా పేరుగానే లిప్యంతరీకరించాం.
- source_word: שֵׂכֶל
  choice: వివేకం
  rationale: ఆచరణాత్మక జ్ఞానం, సుబుద్ధి అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: בִינָה
  choice: అవగాహన
  rationale: వివేచించి గ్రహించే సామర్థ్యాన్ని సూచిస్తూ, שֵׂכֶלకు వేరైన పదంగా హీబ్రూ జంటను నిలుపుతుంది.
- source_word: וִיצַוְּךָ עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు విషయంలో నీకు ఆజ్ఞాపించుగాక
  rationale: צוה యొక్క సాధారణమైన ‘ఆజ్ఞాపించు’ భావాన్ని, עַל యొక్క ‘గురించి/విషయంలో’ సంబంధాన్ని నేరుగా నిలుపుతుంది. రాజాధికారానికి నియమించడం అనే సందర్భోచిత ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: וְלִשְׁמוֹר
  choice: అప్పుడు నీవు … పాటించగలవు
  rationale: ముందటి దైవానుగ్రహం, ఆజ్ఞ ఫలితంగా ధర్మశాస్త్రాన్ని పాటించడం సాధ్యమవుతుందనే ఉద్దేశ్య/ఫలిత సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: תּוֹרַת
  choice: ధర్మశాస్త్రం
  rationale: ఒడంబడిక సందర్భంలో దేవుని తోరాను సూచించే సుపరిచిత తెలుగు పదం; ‘ఉపదేశం’ అనే విస్తృత భావాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: אֱלֹהֶיךָ
  choice: నీ దేవుడు
  rationale: సొలొమోనును ఉద్దేశించిన రెండవ పురుష ఏకవచన సంబంధాన్ని నేరుగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలంలో ఉన్న ఒడంబడిక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా పేరుగా నిలిపాం.
- issue: וִיצַוְּךָ עַל יִשְׂרָאֵל యొక్క రాజసందర్భ భావం
  choice: ఇశ్రాయేలు విషయంలో నీకు ఆజ్ఞాపించుగాక
  alternative: ఇశ్రాయేలుమీద నిన్ను నియమించుగాక / ఇశ్రాయేలు బాధ్యతను నీకు అప్పగించుగాక
  rationale: ‘ఆజ్ఞాపించు’ అనే క్రియ యొక్క ప్రత్యక్ష అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, రాజుగా అధికారంలో నియమించే సంభావ్య భావాన్ని పాదటిప్పణిలో ఇచ్చాం; తద్వారా అసలు వాక్యంలోని సందిగ్ధతను తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు స్పష్టమైన శైలి వాడబడింది. హీబ్రూ సమాంతర పదజంటను ‘వివేకం, అవగాహన’గా వేర్వేరు పదాలతో నిలిపాం; వివాదాస్పద రాజసంబంధ క్రియార్థాన్ని ప్రధాన పాఠ్యం మరియు పాదటిప్పణి ద్వారా సంరక్షించాం.
