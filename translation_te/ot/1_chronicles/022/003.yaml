  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే నిర్మాణం వాడబడింది. హీబ్రూ వాక్యంలోని సామగ్రి జాబితా స్వభావం నిలుపబడింది; మְחַבְּרוֹת యొక్క అనిశ్చితిని పాదసూచికలో భద్రపరచాం.
