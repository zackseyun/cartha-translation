  text: וּ/בַרְזֶ֣ל לָ֠/רֹב לַֽ/מִּסְמְרִ֞ים לְ/דַלְת֧וֹת הַ/שְּׁעָרִ֛ים וְ/לַֽ/מְחַבְּר֖וֹת הֵכִ֣ין דָּוִ֑יד וּ/נְחֹ֥שֶׁת לָ/רֹ֖ב אֵ֥ין מִשְׁקָֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/003.yaml
  text: And David prepared iron in abundance for the nails for the doors of the gates and for the fastenings[b][a], and bronze in abundance without weight.
translation:
  language: te
  text: దావీదు ద్వారాల తలుపుల కోసం మేకులకూ, బిగింపు భాగాల[a] కోసమూ సమృద్ధిగా ఇనుమును సిద్ధం చేశాడు; అలాగే తూచలేనంత కంచును సిద్ధం చేశాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కీలు’; హీబ్రూ పదం కలిపే లేదా జోడించే భాగాలను విస్తృతంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘బరువు లేకుండా’; అంటే తూచలేనంత ఎక్కువగా.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַרְזֶל
  choice: ఇనుము
  rationale: నిర్మాణ సామగ్రి సందర్భంలో ఈ పదం నేరుగా ఇనుమును సూచిస్తుంది.
- source_word: לָרֹב
  choice: విస్తారంగా
  rationale: సామగ్రి చాలా పెద్ద పరిమాణంలో సమకూర్చబడిందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: מִּסְמְרִים
  choice: మేకులు
  rationale: తలుపులు, ద్వారాల నిర్మాణ సందర్భంలో సాధారణమైన అర్థం; మరింత నిర్దిష్టమైన ‘లోహపు మొనలు’ అనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: דַלְתוֹת הַשְּׁעָרִים
  choice: ద్వారాల తలుపులు
  rationale: ద్వారాలకు చెందిన తలుపు పలకలను సూచించే హీబ్రూ సంబంధ నిర్మాణాన్ని స్పష్టంగా, సహజంగా తెలుపుతుంది.
- source_word: מְחַבְּרוֹת
  choice: బిగింపు పరికరాలు
  rationale: కలిపే లేదా బిగించే లోహ భాగాలు అనే విస్తృత అర్థాన్ని నిలుపుతుంది; ‘మూటబంధాలు’ లేదా ‘అతుకులు’ కంటే నిర్మాణ సందర్భంలో స్పష్టంగా ఉంటుంది; ‘కీలు’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: הֵכִין
  choice: సిద్ధం చేశాడు
  rationale: ఆలయ నిర్మాణం కోసం సామగ్రిని ముందుగా సమకూర్చి ఉంచడాన్ని సూచిస్తుంది.
- source_word: נְחֹשֶׁת
  choice: కంచు
  rationale: ప్రాచీన నిర్మాణ సామగ్రి జాబితాలలో ఈ హీబ్రూ పదానికి సాధారణ సందర్భోచిత సమానం; ‘రాగి’ కూడా సాధ్యమైనప్పటికీ మిశ్రలోహ భావానికి కంచు అనుకూలం.
- source_word: אֵין מִשְׁקָל
  choice: తూచలేనంతగా
  rationale: అక్షరార్థంగా ‘బరువు లేదు’ అనే హీబ్రూ నుడికారాన్ని, పరిమాణం తూచలేనంత ఎక్కువగా ఉందనే ఉద్దేశంతో సహజమైన తెలుగులో అందిస్తుంది.
