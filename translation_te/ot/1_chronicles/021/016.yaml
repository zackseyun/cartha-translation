id: 1CH.21.16
reference: 1 Chronicles 21:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א דָוִ֜יד אֶת עֵינָ֗י/ו וַ/יַּ֞רְא אֶת מַלְאַ֤ךְ יְהוָה֙ עֹמֵ֗ד בֵּ֤ין הָ/אָ֨רֶץ֙ וּ/בֵ֣ין הַ/שָּׁמַ֔יִם וְ/חַרְבּ֤/וֹ שְׁלוּפָה֙ בְּ/יָד֔/וֹ נְטוּיָ֖ה עַל יְרוּשָׁלִָ֑ם וַ/יִּפֹּ֨ל דָּוִ֧יד וְ/הַ/זְּקֵנִ֛ים מְכֻסִּ֥ים בַּ/שַּׂקִּ֖ים עַל פְּנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/016.yaml
  text: David lifted up his eyes and saw the angel of Yahweh standing between the earth and the heavens[a], with his sword drawn in his hand, stretched out over Jerusalem. Then David and the elders, covered in sackcloth, fell on their faces.
translation:
  language: te
  text: దావీదు కన్నులెత్తి, భూమికీ ఆకాశాలకీ మధ్య నిలబడి ఉన్న యహ్వే దూతను చూశాడు. అతని చేతిలో ఒరనుండి తీసిన కత్తి యెరూషలేము మీద చాపబడి ఉంది. అప్పుడు గోనెపట్టలతో కప్పబడిన దావీదు, పెద్దలు ముఖాలు నేలమీద పెట్టుకొని పడిపోయారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־עֵינָיו
  choice: కన్నులెత్తి చూసినప్పుడు
  rationale: హీబ్రూ నుడికారంలోని దృశ్యరూపాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా వినిపించే రూపం.
- source_word: מַלְאַךְ יְהוָה
  choice: యహ్వే దూత
  rationale: మַלְאַךְ‌ను ‘దూత’గా, దైవనామమైన יְהוָה‌ను బిరుదుతో భర్తీ చేయకుండా ‘యహ్వే’గా అందిస్తుంది.
- source_word: עֹמֵד
  choice: నిలబడి ఉన్న
  rationale: దూత కనిపించిన భంగిమను సూటిగా, సహజంగా తెలియజేస్తుంది.
- source_word: בֵּין הָאָרֶץ וּבֵין הַשָּׁמַיִם
  choice: భూమికి ఆకాశాలకు మధ్య
  rationale: భూమి–ఆకాశాల విశ్వవ్యాప్త వ్యత్యాసాన్ని, అలాగే שָׁמַיִם యొక్క బహువచన రూపాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְּיָדוֹ
  choice: ఆయన చేతిలో కత్తి దూయబడి
  rationale: ఒర నుంచి బయటకు తీసిన కత్తిని సూచించే ఫలితస్థితిని తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: נְטוּיָה עַל־יְרוּשָׁלִָם
  choice: యెరూషలేము మీదికి చాపబడి ఉంది
  rationale: నగరంపై కత్తి బెదిరింపుగా చాపబడి ఉన్న దిశను, తీర్పు దృశ్యాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: מְכֻסִּים בַּשַּׂקִּים
  choice: గోనెపట్టలు కప్పుకొని
  rationale: శోకం, పశ్చాత్తాపంతో సంబంధమున్న సాంస్కృతిక చర్యను వివరణాత్మక విస్తరణ లేకుండా అందిస్తుంది.
- source_word: וַיִּפֹּל ... עַל־פְּנֵיהֶם
  choice: ముఖాలు నేలకు ఆనించి పడిపోయారు
  rationale: శరీరంతో బోర్లాపడి వినయాన్ని లేదా భయభక్తిని చూపే చర్యను సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యహ్వే
  alternative: ప్రభువు; యెహోవా
  rationale: మూలపాఠంలో ఉన్న వ్యక్తిగత దైవనామాన్ని బిరుదుతో మార్చకుండా లిప్యంతరీకరిస్తుంది; ‘యెహోవా’ కంటే ‘యహ్వే’ మూల ఉచ్చారణకు దగ్గరైన సాధారణ పండిత పునర్నిర్మాణం.
- issue: מַלְאַךְ יְהוָה యొక్క గుర్తింపు
  choice: యహ్వే దూత
  alternative: యహ్వే యొక్క దూత
  rationale: మూలంలోని సంబంధాన్ని సూటిగా ఉంచి, ఈ దూత యొక్క ఖచ్చితమైన తాత్త్విక గుర్తింపును అనువాదంలో అదనంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కథనశైలిని ఉపయోగించాం. ‘కన్నులెత్తి,’ ‘కత్తి దూయబడి,’ ‘గోనెపట్టలు’ వంటి పదాలు మూలంలోని దృశ్యరూపం, సాంస్కృతిక నేపథ్యాన్ని నిలుపుతూనే సాధారణ పాఠకులకు అర్థమయ్యేలా ఎంపికయ్యాయి.
