id: 1CH.21.30
reference: 1 Chronicles 21:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֹא יָכֹ֥ל דָּוִ֛יד לָ/לֶ֥כֶת לְ/פָנָ֖י/ו לִ/דְרֹ֣שׁ אֱלֹהִ֑ים כִּ֣י נִבְעַ֔ת מִ/פְּנֵ֕י חֶ֖רֶב מַלְאַ֥ךְ יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/030.yaml
  text: But David could not go before it to seek God[a], because he was terrified by the sword of the angel of Yahweh.
translation:
  language: te
  text: కాని దావీదు దేవుణ్ణి వెదకడానికి దాని ఎదుటకు వెళ్లలేకపోయాడు[a]; ఎందుకంటే యెహోవా దూత ఖడ్గం కారణంగా అతడు భయభ్రాంతుడయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఈ సర్వనామం దేవుణ్ణి సూచిస్తే, “ఆయన సన్నిధికి.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/לֹא
  choice: కాని ... లేకపోయాడు
  rationale: మునుపటి వాక్యంతో ఉన్న స్వల్ప వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: יָכֹל ... לָ/לֶכֶת
  choice: వెళ్లలేకపోయాడు
  rationale: సామర్థ్యలేమిని, గమ్యస్థానానికి వెళ్లడాన్ని తెలుగులో సహజంగా ఒకే క్రియారూపంలో వ్యక్తం చేస్తుంది.
- source_word: לְ/פָנָי/ו
  choice: దాని సన్నిధికి
  rationale: సమీప సందర్భంలోని గిబియోను ప్రత్యక్ష గుడారాన్ని అత్యంత సంభావ్య పూర్వపదంగా తీసుకుంటుంది; తెలుగు నపుంసక ఏకవచన సర్వనామం దీనిని స్పష్టం చేస్తుంది.
- source_word: לִ/דְרֹשׁ אֱלֹהִים
  choice: దేవుణ్ణి వెదకడానికి
  rationale: דרשׁ పదంలోని ఆరాధన, ప్రార్థన, దేవుని చిత్తాన్ని అడిగి తెలుసుకోవడం అనే విస్తృత భావాన్ని కేవలం ‘విచారించడం’గా కుదించకుండా ఉంచుతుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: దావీదు ఎందుకు వెళ్లలేకపోయాడో కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: נִבְעַת
  choice: తీవ్రంగా భయపడ్డాడు
  rationale: నిఫాల్ రూపం సూచించే గాఢమైన భయాన్ని సాధారణ పాఠకులకు సహజమైన తెలుగులో అందిస్తుంది.
- source_word: מִ/פְּנֵי חֶרֶב
  choice: ఖడ్గాన్ని చూసి
  rationale: భయానికి కారణమైన దూత ఖడ్గాన్ని సహజమైన తెలుగు ప్రయోగంలో వ్యక్తం చేస్తుంది; ఖడ్గం అతని ఎదుట ప్రత్యక్షంగా ఉన్న కథా సందర్భాన్నీ నిలుపుతుంది.
- source_word: מַלְאַךְ יְהוָה
  choice: యెహోవా దూత
  rationale: ఈ సందర్భంలో పరలోక దూత ఉద్దేశించబడ్డాడు; దేవుని వ్యక్తిగత నామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించింది.
theological_decisions:
- issue: ‘అతని/దాని సన్నిధికి’లోని సర్వనామ పూర్వపదం
  choice: గిబియోనులోని ప్రత్యక్ష గుడారం లేదా ఆ ఆరాధనా స్థలం
  alternative: దేవుడు—‘ఆయన సన్నిధికి’
  rationale: 29వ వచనంలో వెంటనే ప్రస్తావించిన యెహోవా ప్రత్యక్ష గుడారం, బలిపీఠం ఈ సర్వనామానికి అత్యంత సంభావ్య పూర్వపదాలు. అయితే హెబ్రీ పురుష ఏకవచన ప్రత్యయం దేవుణ్ణి సూచించే అవకాశాన్నీ అనుమతిస్తుంది; అందుకే పాదటిప్పణిలో ప్రత్యామ్నాయం ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గౌరవప్రదమైన గ్రంథశైలిలో ఉంది. ‘సన్నిధి,’ ‘ఖడ్గం’ వంటి బైబిలు సందర్భానికి తగిన పదాలను నిలిపింది.
