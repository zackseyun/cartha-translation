review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the sequence: David approaches Ornan; Ornan directs his gaze and sees David; he comes out from the threshing floor; and he performs a face-to-ground act of obeisance before David. The wording ''సాగిలపడ్డాడు'' is broadly suitable, but the accompanying phrase and footnote can state the full prostration more idiomatically and precisely.'
  naturalness: Modern Telugu is generally natural. Recasting the first temporal clause as a narrative sequence better reflects the Hebrew wayyiqtol chain, and 'ముఖం నేలకు తగిలేలా' is smoother than 'నేలకు ముఖం ఆనించి.'
  terminology: '''కళ్లం'' is an appropriate modern standard Telugu term for a threshing floor. ''సాగిలపడ్డాడు'' communicates non-divine obeisance without importing worship. The revised alternative preserves the physical sense of full prostration and does not characterize it as divine worship.'
  issues:
  - severity: low
    issue: The opening 'వచ్చినప్పుడు' makes David's approach a temporal subordinate clause.
    rationale: The Hebrew presents a consecutive narrative action ('David came to Ornan'), not primarily a temporal setting. A finite sequential clause is closer while remaining idiomatic.
  - severity: low
    issue: The footnote's alternative is very close to the main rendering and 'వంగి నమస్కరించాడు' can sound less explicitly like full prostration.
    rationale: The Hebrew idiom אַפַּיִם אָרְצָה specifies a face-to-ground posture. The alternate should make that physical extent clear without implying worship.
  revised_text: దావీదు ఒర్నాను దగ్గరకు వచ్చాడు. ఒర్నాను చూసి దావీదును గమనించాడు. అతడు కళ్లం నుండి బయటికి వచ్చి, ముఖం నేలకు తగిలేలా దావీదు ఎదుట సాగిలపడ్డాడు.[a]
