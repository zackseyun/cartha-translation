- from: దావీదు ఒర్నాను దగ్గరికి వచ్చినప్పుడు, ఒర్నాను చూసి దావీదును గమనించాడు. అతడు కళ్లం నుండి బయటికి వచ్చి, నేలకు ముఖం ఆనించి దావీదు ఎదుట సాగిలపడ్డాడు.[a]
  to: దావీదు ఒర్నాను దగ్గరకు వచ్చాడు. ఒర్నాను చూసి దావీదును గమనించాడు. అతడు కళ్లం నుండి బయటికి వచ్చి, ముఖం నేలకు తగిలేలా దావీదు ఎదుట సాగిలపడ్డాడు.[a]
  rationale: The revision retains every narrative element and avoids interpreting Ornan's act as worship. It uses a sequential narration closer to the Hebrew and clarifies, both in the text and the alternative note, that the act entails face-to-ground prostration.
