source:
  edition: WLC
  text: וַ/יָּבֹ֥א דָוִ֖יד עַד אָרְנָ֑ן וַ/יַּבֵּ֤ט אָרְנָן֙ וַ/יַּ֣רְא אֶת דָּוִ֔יד וַ/יֵּצֵא֙ מִן הַ/גֹּ֔רֶן וַ/יִּשְׁתַּ֧חוּ לְ/דָוִ֛יד אַפַּ֖יִם אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/021.yaml
  text: When David came to Ornan[a], Ornan looked and saw David, and he went out from the threshing floor and bowed down before David with his face to the ground.
translation:
  language: te
  text: దావీదు ఒర్నాను దగ్గరకు వచ్చాడు. ఒర్నాను చూసి దావీదును గమనించాడు. అతడు కళ్లం నుండి బయటికి వచ్చి, ముఖం నేలకు తగిలేలా దావీదు ఎదుట సాగిలపడ్డాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దావీదు ఎదుట ముఖం నేలకు తగిలేలా పూర్తిగా వంగాడు.” హీబ్రూ పదబంధం ముఖం నేలవైపు ఉండే పూర్తి సాష్టాంగ భంగిమను వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא דָוִיד עַד אָרְנָן
  choice: దావీదు ఒర్నాను దగ్గరికి వచ్చినప్పుడు
  rationale: בוא మరియు עַד కలిసి దావీదు ఒర్నాను వద్దకు చేరిన కదలికను సూచిస్తున్నాయి. తెలుగు కథనంలో ‘దగ్గరికి వచ్చినప్పుడు’ సహజంగా ఉండి కాలసంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: וַיַּבֵּט אָרְנָן וַיַּרְא אֶת־דָּוִיד
  choice: ఒర్నాను చూసి దావీదును గమనించాడు
  rationale: נבט సూచించే దృష్టి సారించడాన్ని, ראה సూచించే చూడడాన్ని పూర్తిగా ఒకటిగా కలపకుండా రెండు దశల కథనంగా ఉంచింది; తెలుగులో అసహజమైన ‘చూసి చూశాడు’ పునరుక్తిని ‘చూసి… గమనించాడు’ అని సహజీకరించింది.
- source_word: וַיֵּצֵא מִן־הַגֹּרֶן
  choice: అతడు కళ్లం నుండి బయటికి వచ్చి
  rationale: גֹּרֶן అనేది ధాన్యాన్ని నూర్చే కళ్లం. יצא మరియు מן తెలిపే బయటికి రావడాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: וַיִּשְׁתַּחוּ לְדָוִיד אַפַּיִם אָרְצָה
  choice: నేలకు ముఖం ఆనించి దావీదు ఎదుట సాగిలపడ్డాడు
  rationale: השתחוה తెలిపే లోతైన వంగడాన్ని ‘సాగిలపడడం’ సహజంగా వ్యక్తం చేస్తుంది; אַפַּיִם אָרְצָה తెలిపే ముఖం నేలవైపు ఉండే శరీరభంగిమను స్పష్టంగా నిలుపుతుంది. ఇది దైవారాధన అని ముందుగానే నిర్ణయించదు.
theological_decisions:
- issue: ఒర్నాను చేసిన చర్యను దావీదుకు ఆరాధనగా అనువదించాలా
  choice: దావీదు ఎదుట సాగిలపడ్డాడు
  alternative: దావీదును ఆరాధించాడు
  rationale: השתחוה దేవుని ఆరాధించడానికీ, మానవ అధికారి ఎదుట గౌరవంతో వంగడానికీ వాడవచ్చు. ఇక్కడ దావీదు ఎదుట చేసిన శారీరక చర్యనే అనువాదం తెలియజేస్తుంది; దానిని దైవారాధనగా వ్యాఖ్యానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘కళ్లం’ వ్యవసాయ సందర్భానికి సరిపోయే సాధారణ తెలుగు పదం; ‘సాగిలపడ్డాడు’ లోతుగా వంగిన శరీరభంగిమను తెలియజేస్తూ ఆ చర్యను తప్పనిసరిగా ఆరాధనగా ముద్రించదు.
