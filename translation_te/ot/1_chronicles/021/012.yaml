revisions:
- from: మూడు సంవత్సరాల కరవో, లేక మూడు నెలలపాటు నీ విరోధుల ఎదుట నీవు తుడిచిపెట్టుకుపోవడమో[a]—నీ శత్రువుల ఖడ్గం నిన్ను తరుమి పట్టుకుంటుండగా—లేక మూడు రోజులపాటు యాహ్వే ఖడ్గమో, అంటే దేశంలో మహమ్మారి[b] వచ్చి, యాహ్వే దూత ఇశ్రాయేలు ప్రాంతమంతటా నాశనం చేయడమో. ఇప్పుడు నన్ను పంపినవానికి నేను ఏమని జవాబు చెప్పాలో ఆలోచించు.
  to: మూడు సంవత్సరాల కరవో, లేక మూడు నెలలపాటు నీ విరోధుల ఎదుట నీవు తుడిచిపెట్టుకుపోవడమో[a]—నీ శత్రువుల ఖడ్గం నిన్ను తరుమి పట్టుకుంటుండగా—లేక మూడు రోజుల యాహ్వే ఖడ్గమో—అంటే దేశంలో మహమ్మారి[b], ఇశ్రాయేలు ప్రాంతమంతటా నాశనం చేస్తున్న యాహ్వే దూత. ఇప్పుడు నన్ను పంపినవానికి నేను ఏమని జవాబు చెప్పాలో ఆలోచించు.
  rationale: The revision retains the draft's sound lexical choices and footnote anchors, but recasts the final judgment option so that “pestilence in the land” and “the angel of Yahweh destroying throughout all Israel's territory” stand as the explanatory elaboration of “three days of the sword of Yahweh,” as in the Hebrew and English audit trail. No doctrinal interpretation is introduced.
