id: 1CH.21.12
reference: 1 Chronicles 21:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: אִם שָׁל֨וֹשׁ שָׁנִ֜ים רָעָ֗ב וְ/אִם שְׁלֹשָׁ֨ה חֳדָשִׁ֜ים נִסְפֶּ֥ה מִ/פְּנֵי צָרֶי/ךָ֮ וְ/חֶ֣רֶב אוֹיְבֶ֣/ךָ לְ/מַשֶּׂגֶת֒ וְ/אִם שְׁלֹ֣שֶׁת יָ֠מִים חֶ֣רֶב יְהוָ֤ה וְ/דֶ֨בֶר֙ בָּ/אָ֔רֶץ וּ/מַלְאַ֣ךְ יְהוָ֔ה מַשְׁחִ֖ית בְּ/כָל גְּב֣וּל יִשְׂרָאֵ֑ל וְ/עַתָּ֣ה רְאֵ֔ה מָֽה אָשִׁ֥יב אֶת שֹׁלְחִ֖/י דָּבָֽר־־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/012.yaml
  text: either three years of famine[a], or three months of being swept away before your foes while the sword of your enemies overtakes you, or three days of the sword of Yahweh, even pestilence in the land, with the angel of Yahweh destroying throughout all the territory of Israel[b]. Now consider what answer I should return to the one who sent me.
translation:
  language: te
  text: మూడు సంవత్సరాల కరవో, లేక మూడు నెలలపాటు నీ విరోధుల ఎదుట నీవు తుడిచిపెట్టుకుపోవడమో[a]—నీ శత్రువుల ఖడ్గం నిన్ను తరుమి పట్టుకుంటుండగా—లేక మూడు రోజుల యాహ్వే ఖడ్గమో—అంటే దేశంలో మహమ్మారి[b], ఇశ్రాయేలు ప్రాంతమంతటా నాశనం చేస్తున్న యాహ్వే దూత. ఇప్పుడు నన్ను పంపినవానికి నేను ఏమని జవాబు చెప్పాలో ఆలోచించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నాశనమవడమో’, ‘నీ శత్రువుల ఎదుట ప్రాణాలు కోల్పోవడమో’; హీబ్రూ కృదంతం యుద్ధంలో పూర్తిగా నాశనానికి గురికావడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తెగులు’; హీబ్రూ పదం తీర్పుగా వచ్చే వ్యాపక అంటువ్యాధిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: కరవు
  rationale: జాతీయ స్థాయిలో ఆహార కొరతను సూచించే తీర్పు సందర్భంలో సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: נִסְפֶּה
  choice: తుడిచిపెట్టుకుపోవడం
  rationale: యుద్ధంలో పూర్తిగా నాశనానికి గురికావడం లేదా కొట్టుకుపోవడం అనే నిఫల్ కృదంత భావాన్ని, కేవలం మరణానికే పరిమితం చేయకుండా వ్యక్తపరుస్తుంది.
- source_word: מִפְּנֵי צָרֶיךָ
  choice: నీ విరోధుల ఎదుట
  rationale: శత్రుసేనల ఎదుట ఓడిపోయి పారిపోవడం అనే సైనిక సందర్భాన్ని నిలుపుతుంది; తరువాతి 'శత్రువులు' అనే పదంతో అనవసర పునరుక్తిని తగ్గిస్తుంది.
- source_word: חֶרֶב אוֹיְבֶיךָ
  choice: నీ శత్రువుల ఖడ్గం
  rationale: మూలంలోని సైనిక రూపకాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: לְמַשֶּׂגֶת
  choice: నిన్ను తరుమి పట్టుకుంటుండగా
  rationale: వెంటాడుతూ చేరుకోవడం లేదా పట్టుకోవడం అనే క్రియాభావాన్ని సందర్భానుగుణంగా స్పష్టపరుస్తుంది.
- source_word: חֶרֶב יְהוָה
  choice: యాహ్వే ఖడ్గం
  rationale: శత్రువుల ఖడ్గానికి వ్యతిరేకంగా నిలిచే దైవిక తీర్పు రూపకాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: చతురక్షర దైవనామాన్ని బిరుదుగా మార్చకుండా పేరుగా లిప్యంతరీకరిస్తుంది.
- source_word: דֶבֶר
  choice: మహమ్మారి
  rationale: తీర్పుగా వచ్చే విస్తృత అంటువ్యాధి అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: מַלְאַךְ יְהוָה
  choice: యాహ్వే దూత
  rationale: దూత యొక్క స్వరూపాన్ని మరింత నిర్దిష్టంగా తేల్చకుండా మూలపదబంధపు సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: מַשְׁחִית
  choice: నాశనం చేయడం
  rationale: దూత కొనసాగిస్తూ చేసే విధ్వంసక చర్యను సహజమైన క్రియారూపంలో తెలియజేస్తుంది.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రాంతమంతటా
  rationale: కేవలం సరిహద్దు రేఖలను కాక దేశపు పూర్తి విస్తీర్ణాన్ని సూచించే సందర్భార్థాన్ని ఇస్తుంది.
- source_word: רְאֵה
  choice: ఆలోచించు
  rationale: భౌతికంగా చూడమనే అర్థం కాక, నిర్ణయించి జవాబు ఇవ్వమనే సంభాషణాత్మక భావాన్ని వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యాహ్వే
  alternative: యెహోవా / ప్రభువు
  rationale: మూలంలో దైవనామమే ఉంది; దాన్ని బిరుదుగా మార్చకుండా, 'Jehovah' రూపాన్ని అనుసరించకుండా సాధారణంగా పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడింది.
- issue: מַלְאַךְ יְהוָה యొక్క స్వరూపం
  choice: యాహ్వే దూత
  alternative: యాహ్వే దేవదూత
  rationale: ఈ వ్యక్తి సృష్టించబడిన దేవదూతనా లేక ప్రత్యేక దైవ ప్రత్యక్షతనా అనే వేదాంత చర్చను అనువాదంలోనే నిర్ణయించకుండా, పదబంధపు విస్తృత అర్థాన్ని కాపాడుతుంది.
- issue: חֶרֶב יְהוָה మరియు דֶבֶר మధ్య సంబంధం
  choice: యాహ్వే ఖడ్గమో, అంటే దేశంలో మహమ్మారి
  alternative: యాహ్వే ఖడ్గమూ దేశంలో మహమ్మారియు
  rationale: ఇక్కడ మహమ్మారి 'యాహ్వే ఖడ్గం'ను వివరిస్తున్న సమానార్థక విస్తరణగా చదవవచ్చు; 'అంటే' ఆ సంబంధాన్ని తెలియజేస్తుంది, అయినా హీబ్రూ సంధి వల్ల కూడిక భావానికి అవకాశం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూడు ప్రత్యామ్నాయ తీర్పుల సమాంతర నిర్మాణం నిలుపబడింది; దీర్ఘ వాక్యంలో సంబంధాలను స్పష్టంచేయడానికి విరామచిహ్నాలు ఉపయోగించబడ్డాయి.
