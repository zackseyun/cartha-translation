id: 1CH.21.5
reference: 1 Chronicles 21:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתֵּ֥ן יוֹאָ֛ב אֶת מִסְפַּ֥ר מִפְקַד הָ/עָ֖ם אֶל דָּוִ֑יד וַ/יְהִ֣י כָֽל יִשְׂרָאֵ֡ל אֶ֣לֶף אֲלָפִים֩ וּ/מֵאָ֨ה אֶ֤לֶף אִישׁ֙ שֹׁ֣לֵֽף חֶ֔רֶב וִֽ/יהוּדָ֕ה אַרְבַּע֩ מֵא֨וֹת וְ/שִׁבְעִ֥ים אֶ֛לֶף אִ֖ישׁ שֹׁ֥לֵֽף חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/005.yaml
  text: Joab gave the number of the census of the people to David. All Israel was 1,100,000 men drawing the sword[a], and Judah was 470,000 men drawing the sword.
translation:
  language: te
  text: యోవాబు ప్రజల జనగణన లెక్కను దావీదుకు ఇచ్చాడు. ఇశ్రాయేలు మొత్తంలో కత్తి దూసే పురుషులు 11,00,000 మంది[a]; యూదాలో కత్తి దూసే పురుషులు 4,70,000 మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వెయ్యి వేలూ, ఒక వంద వేలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר מִפְקַד הָעָם
  choice: ప్రజల జనగణనలో లెక్కించిన వారి సంఖ్య
  rationale: מִסְפַּר అనే ‘సంఖ్య’ భావాన్నీ, מִפְקַד అనే ‘లెక్కింపు/జనగణన’ భావాన్నీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: וַיְהִי כָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలువారందరిలో ... మంది
  rationale: ఫలితంగా వచ్చిన మొత్తం సంఖ్యను తెలుగులో సహజంగా తెలియజేస్తూ, כָל అనే సమగ్ర భావాన్ని ‘అందరిలో’ ద్వారా నిలుపుతుంది.
- source_word: אֶלֶף אֲלָפִים וּמֵאָה אֶלֶף
  choice: 11,00,000
  rationale: హెబ్రీ సంఖ్య విలువను భారతీయ అంకెల విభజన పద్ధతిలో స్పష్టంగా అందిస్తుంది; అక్షరార్థ రూపం పాదసూచికలో ఉంచబడింది.
- source_word: אִישׁ
  choice: మంది
  rationale: ఇది సైనిక జనగణనలో పురుషులను సూచిస్తుంది; ‘కత్తి దూసేవారు’ అనే పురుష బహువచన రూపం ఆ భావాన్ని తెలుగులో వెల్లడిస్తుంది.
- source_word: שֹׁלֵף חֶרֶב
  choice: కత్తి దూసేవారు
  rationale: שֹׁלֵף యొక్క ‘ఒరనుండి తీయడం/దూయడం’ అనే సజీవ సైనిక నుడికారాన్ని, సాధారణ ‘ఆయుధాలు ధరించేవారు’గా సడలించకుండా నిలుపుతుంది.
- source_word: וִיהוּדָה
  choice: యూదావారిలో
  rationale: ముందటి ఇశ్రాయేలు మొత్తానికి సమాంతరంగా యూదా మొత్తాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో చూపుతుంది.
- source_word: אַרְבַּע מֵאוֹת וְשִׁבְעִים אֶלֶף
  choice: 4,70,000
  rationale: నాలుగు లక్షల డెబ్బై వేల సంఖ్యను ఆధునిక తెలుగు పాఠకులకు సులభంగా చదవదగిన అంకెల రూపంలో ఇస్తుంది.
theological_decisions:
- issue: సమాంతర వృత్తాంతాల్లో కనిపించే జనగణన సంఖ్యల వ్యత్యాసం
  choice: మూలపాఠంలోని 11,00,000 మరియు 4,70,000 సంఖ్యలను మార్పు లేకుండా అనువదించడం
  alternative: ఇతర వృత్తాంతంతో సమన్వయపరచి సంఖ్యలను మార్చడం లేదా వివరణను వచనంలో చేర్చడం
  rationale: ఈ వచనంలోని WLC పాఠ్య సాక్ష్యాన్ని యథాతథంగా అనుసరించి, సమాంతర వృత్తాంతాల మధ్య ఉన్న ఉద్రిక్తతను మౌనంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతతో కూడిన సరళమైన శైలి. సైనిక నుడికారాన్ని సజీవంగా ఉంచుతూ, పెద్ద సంఖ్యలకు తెలుగు పాఠకులకు పరిచితమైన భారతీయ కామా విభజనను ఉపయోగించాం.
