id: 1CH.21.3
reference: 1 Chronicles 21:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יוֹאָ֗ב יוֹסֵף֩ יְהוָ֨ה עַל עַמּ֤/וֹ כָּ/הֵם֙ מֵאָ֣ה פְעָמִ֔ים הֲ/לֹא֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כֻּלָּ֥/ם לַ/אדֹנִ֖/י לַ/עֲבָדִ֑ים לָ֣/מָּה יְבַקֵּ֥שׁ זֹאת֙ אֲדֹנִ֔/י לָ֛/מָּה יִהְיֶ֥ה לְ/אַשְׁמָ֖ה לְ/יִשְׂרָאֵֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/003.yaml
  text: But Joab said[a], “May Yahweh add to his people a hundred times as many as they are! Are they not all, my lord the king[c][b], servants of my lord? Why does my lord seek this? Why should it become guilt for Israel?”
translation:
  language: te
  text: 'అయితే యోవాబు ఇలా అన్నాడు: “యాహ్వే తన ప్రజల సంఖ్యను ఇప్పుడున్నంతకు నూరురెట్లు చేయుగాక! నా ప్రభువైన రాజా, వారందరూ నా ప్రభువైన రాజుకు సేవకులే కదా? నా ప్రభువు దీన్ని ఎందుకు కోరుతున్నారు? ఇది ఇశ్రాయేలుకు అపరాధంగా ఎందుకు మారాలి?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ఈ చర్యవల్ల ఇశ్రాయేలుకు అపరాధం లేదా దోషబాధ్యత కలగడం.
    reason: cultural_note
lexical_decisions:
- source_word: יוֹסֵף
  choice: పెంచుగాక
  rationale: హీబ్రూ జస్సివ్ రూపం యోవాబు కోరిక లేదా ప్రార్థనను వ్యక్తం చేస్తుంది; ‘పెంచుగాక’ ఆ భావాన్ని సహజమైన గౌరవప్రద తెలుగు శైలిలో అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: చతురక్షర దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపమైన ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: עַל עַמּוֹ כָּהֵם מֵאָה פְעָמִים
  choice: తన ప్రజలను ఇప్పుడున్నదానికంటే నూరింతలు
  rationale: ప్రస్తుత జనసంఖ్యతో పోల్చి నూరింతలుగా వృద్ధి చెందాలనే హీబ్రూ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הֲלֹא
  choice: కదా?
  rationale: సమ్మతిని ఆశించే ప్రతిప్రశ్నను తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజా
  rationale: రాజును ఉద్దేశించిన సభామర్యాదతో కూడిన సంబోధనను కాపాడుతుంది.
- source_word: כֻּלָּם לַאדֹנִי לַעֲבָדִים
  choice: వారందరూ నా ప్రభువు సేవకులే
  rationale: ఇక్కడ עֲבָדִים రాజుకు లోబడిన ప్రజల రాజకీయ సేవాస్థితిని సూచిస్తుంది; ‘సేవకులు’ సందర్భానికి తగినది, అయితే ‘దాసులు’ కూడా సాధ్యమే.
- source_word: יְבַקֵּשׁ זֹאת
  choice: దీన్ని ఎందుకు కోరుతున్నారు
  rationale: בקש యొక్క ‘కోరడం/అన్వేషించడం’ పరిధిని, ఇక్కడ జనగణనను చేపట్టాలనే రాజు సంకల్పానికి అనుగుణంగా అందిస్తుంది.
- source_word: יִהְיֶה לְאַשְׁמָה לְיִשְׂרָאֵל
  choice: ఇది ఇశ్రాయేలుకు అపరాధంగా ఎందుకు మారాలి?
  rationale: ఈ చర్య వల్ల ఇశ్రాయేలు మీద అపరాధం లేదా దోషబాధ్యత ఏర్పడే భావాన్ని, హీబ్రూ నిర్మాణానికి దగ్గరగా ఉంచుతుంది.
theological_decisions:
- issue: יְהוָה దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయలేదు. ‘యెహోవా’ ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన లిప్యంతరీకరణ; ‘యాహ్వే’ పునర్నిర్మిత ఉచ్చారణకు దగ్గరైన ప్రత్యామ్నాయం.
- issue: עֲבָדִים యొక్క రాజకీయ-సామాజిక భావం
  choice: సేవకులు
  alternative: దాసులు
  rationale: ఈ రాజసభ సందర్భంలో ప్రజలు రాజుకు లోబడినవారనే అంశం ప్రధానమైనది; నిర్దిష్ట బానిసత్వ స్థితిని ముందుకు తేవకుండా ‘సేవకులు’ ఆ భావాన్ని తెలియజేస్తుంది.
- issue: אַשְׁמָה యొక్క భావం
  choice: అపరాధం
  alternative: దోషబాధ్యత / అపరాధానికి కారణం
  rationale: ఇక్కడ బలి అర్థం కాకుండా, ఈ చర్యవల్ల ఇశ్రాయేలుకు కలిగే సమూహ దోషం లేదా బాధ్యత ఉద్దేశించబడింది; పాఠంలోని ఉద్రిక్తతను పరిష్కరించకుండా ప్రధాన వచనంలో ‘అపరాధం’గా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, రాజసభకు తగిన గౌరవ సంబోధనతో రూపొందించబడింది. హీబ్రూ ప్రతిప్రశ్నల బలాన్ని ‘కదా?’ మరియు ‘ఎందుకు...?’ రూపాలతో నిలిపాం. దైవనామాన్ని వ్యక్తినామంగానే ఉంచాం; వాక్యాన్ని అనవసరంగా సిద్ధాంతీకరించలేదు.
