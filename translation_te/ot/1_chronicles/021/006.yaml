id: 1CH.21.6
reference: 1 Chronicles 21:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/לֵוִי֙ וּ/בִנְיָמִ֔ן לֹ֥א פָקַ֖ד בְּ/תוֹכָ֑/ם כִּֽי נִתְעַ֥ב דְּבַר הַ/מֶּ֖לֶךְ אֶת יוֹאָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/006.yaml
  text: But he did not count Levi and Benjamin among them[a], because the king’s command was detestable to Joab.
translation:
  language: te
  text: అయితే లేవీ, బెన్యామీను గోత్రాలను యోవాబు వారితోపాటు లెక్కించలేదు. ఎందుకంటే రాజు ఆజ్ఞ[a] యోవాబుకు అసహ్యంగా అనిపించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజు మాట యోవాబుకు అసహ్యంగా అనిపించింది.”
    reason: דְּבַר అనే పదం సందర్భానుసారం ‘ఆజ్ఞ’ లేదా మరింత అక్షరార్థంగా ‘మాట’ అని అనువదించవచ్చు.
lexical_decisions:
- source_word: וְ/לֵוִי וּ/בִנְיָמִן
  choice: అయితే లేవీ, బెన్యామీను గోత్రాలను
  rationale: ముందటి లెక్కతో ఉన్న వ్యత్యాసాన్ని וְ సూచిస్తున్నందున ‘అయితే’ అని అనువదించాం. ఇక్కడ గోత్రపితల పేర్లు ఆయా గోత్రాలను సూచిస్తున్నందున సహజమైన తెలుగులో ‘గోత్రాలను’ చేర్చాం.
- source_word: לֹא פָקַד
  choice: లెక్కించలేదు
  rationale: జనగణన సందర్భంలో פקד అంటే లెక్కించడం లేదా సంఖ్య నమోదు చేయడం; ‘లెక్కించలేదు’ స్పష్టమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: בְּ/תוֹכָם
  choice: వారితోపాటు
  rationale: అక్షరార్థంగా ‘వారి మధ్య’; ఈ సందర్భంలో ముందుగా ప్రస్తావించిన లెక్కలో ఈ రెండు గోత్రాలను చేర్చలేదనే భావాన్ని ‘వారితోపాటు’ సహజంగా తెలియజేస్తుంది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ఈ రెండు గోత్రాలను లెక్కించకపోవడానికి కారణాన్ని పరిచయం చేసే కారణార్థక సంధి.
- source_word: נִתְעַב
  choice: అసహ్యంగా అనిపించింది
  rationale: నిఫాల్ రూపం ఆ ఆజ్ఞ యోవాబుకు తీవ్రంగా జుగుప్సాకరంగా లేదా ఆమోదయోగ్యం కానిదిగా కనిపించిందనే భావాన్ని ఇస్తుంది; ఈ తీవ్ర ప్రతికూల అర్థాన్ని సహజమైన తెలుగులో నిలిపాం.
- source_word: דְּבַר הַ/מֶּלֶךְ
  choice: రాజు ఆజ్ఞ
  rationale: דבר అనే పదానికి ‘మాట,’ ‘విషయం,’ ‘ఆజ్ఞ’ అనే అర్థాలు ఉండవచ్చు. సందర్భంలో ఇది జనగణన చేయమని రాజు ఇచ్చిన ఆదేశం కాబట్టి ‘ఆజ్ఞ’ను ప్రధాన పాఠంలో ఎంచుకున్నాం; ‘మాట’ అనే రూపాన్ని పాదసూచికలో నిలిపాం.
- source_word: אֶת יוֹאָב
  choice: యోవాబుకు
  rationale: భావోద్వేగం లేదా మూల్యాంకనాన్ని తెలిపే క్రియతో אֶת ప్రభావిత వ్యక్తిని సూచిస్తుంది; అందువల్ల ఆ ఆజ్ఞ యోవాబుకు అసహ్యంగా అనిపించిందనే భావం.
