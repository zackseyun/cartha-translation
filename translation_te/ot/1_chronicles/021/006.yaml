translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలిని ఉపయోగించాం. హీబ్రూ వాక్యంలో కర్త చివర్లో వెల్లడైనా, తెలుగులో అస్పష్టతను నివారించేందుకు ‘యోవాబు’ను మొదటి వాక్యభాగంలో స్పష్టంగా పేర్కొన్నాం.
