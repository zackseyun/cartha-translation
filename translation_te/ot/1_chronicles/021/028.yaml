source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֔יא בִּ/רְא֤וֹת דָּוִיד֙ כִּי עָנָ֣/הוּ יְהוָ֔ה בְּ/גֹ֖רֶן אָרְנָ֣ן הַ/יְבוּסִ֑י וַ/יִּזְבַּ֖ח שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/028.yaml
  text: At that time[a], when David saw that Yahweh had answered him at the threshing floor of Ornan the Jebusite, he sacrificed there.
translation:
  language: te
  text: ఆ సమయంలో, యెబూసీయుడైన ఓర్నాను నూర్పిడి కళ్లం వద్ద యాహ్వే తనకు జవాబిచ్చాడని దావీదు చూసినప్పుడు, అతడు అక్కడ బలి అర్పించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తనకు స్పందించాడని.” ఇక్కడి హీబ్రూ క్రియ, ముఖ్యంగా ప్రార్థనకు లేదా బలికి ప్రతిస్పందించే సందర్భంలో, జవాబివ్వడం లేదా స్పందించడం అనే అర్థాలను కలిగి ఉండగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: ఆ సమయంలో
  rationale: ఇది సాధారణ కాలసూచక పదబంధం. కథనంలోని ముందరి సంఘటనతో సంబంధాన్ని సహజంగా చూపుతుంది; క్షణమాత్రపు తక్షణతను అనవసరంగా చేర్చదు.
- source_word: בִּרְאוֹת
  choice: గ్రహించి
  rationale: మూల క్రియకు ‘చూడటం’ అనే ప్రాథమిక అర్థం ఉన్నా, ఇక్కడ దావీదు ఒక విషయాన్ని గుర్తించడాన్ని సూచిస్తుంది. ‘గ్రహించి’ ఆధునిక తెలుగులో సహజంగా ఉండి సందర్భార్థాన్ని అందిస్తుంది.
- source_word: כִּי
  choice: …అని
  rationale: దావీదు గ్రహించిన విషయాన్ని పరిచయం చేస్తుంది. కారణార్థకమైన ‘ఎందుకంటే’ అని కాకుండా విషయార్థకమైన ‘అని’ మూల వాక్యనిర్మాణానికి సరిపోతుంది.
- source_word: עָנָהוּ
  choice: తనకు జవాబిచ్చాడని
  rationale: ענה ఇక్కడ ప్రార్థన లేదా బలి సందర్భంలో దేవుడు జవాబివ్వడాన్ని సూచిస్తుంది. పూర్తయిన దైవిక స్పందనను తెలుగు వాక్యక్రమంలో సహజంగా తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో దాని ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: בְּגֹרֶן
  choice: నూర్పిడి కళ్లం దగ్గర
  rationale: גֹּרֶן ధాన్యాన్ని నూర్చే స్థలాన్ని సూచిస్తుంది. ‘నూర్పిడి కళ్లం’ స్పష్టమైన, సహజమైన తెలుగు పదబంధం; בְ యొక్క స్థానార్థాన్ని ‘దగ్గర’ తెలియజేస్తుంది.
- source_word: אָרְנָן הַיְבוּסִי
  choice: యెబూసీయుడైన ఒర్నాను
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించి, అతని జనవర్గ గుర్తింపును తెలుగులో విశేషణ రూపంగా సహజంగా ఇచ్చాం.
- source_word: וַיִּזְבַּח
  choice: బలి అర్పించాడు
  rationale: זבח బలి ఇవ్వడం లేదా అర్పించడాన్ని సూచిస్తుంది. ‘బలి అర్పించాడు’ ఆధునిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: שָׁם
  choice: అక్కడ
  rationale: సాధారణ స్థానవాచక క్రియావిశేషణాన్ని నేరుగా, సహజంగా అనువదిస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’ అని లిప్యంతరీకరించడం మూలంలోని నామాన్ని నిలుపుతుంది.
- issue: దేవుడు ‘జవాబిచ్చాడు’ అనే భావం
  choice: జవాబిచ్చాడు
  alternative: స్పందించాడు
  rationale: ענה అనే క్రియ ప్రార్థనకు లేదా బలికి వచ్చిన దైవిక ప్రత్యుత్తరాన్ని సూచించగలదు. ‘జవాబిచ్చాడు’ ఈ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది; అది ఏ రూపంలో జరిగిందో వాక్యం చెప్పనందున మరింత వివరణ చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. మూలంలోని కాలసంబంధం, విషయార్థక నిర్మాణం, స్థలసూచనలను నిలిపి, తెలుగులో అసహజమైన పదానువాదాన్ని నివారించాం.
