  to: ఆ సమయంలో, యెబూసీయుడైన ఓర్నాను నూర్పిడి కళ్లం వద్ద యాహ్వే తనకు జవాబిచ్చాడని దావీదు చూసినప్పుడు, అతడు అక్కడ బలి అర్పించాడు.[a]
