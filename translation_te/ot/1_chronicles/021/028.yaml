    issue: గ్రహించి renders בִּרְאוֹת interpretively.
    rationale: The Hebrew explicitly says “when David saw.” Although “realized” fits the context, it adds a cognitive inference not required by the source.
  - severity: low
    issue: దగ్గర is less direct than the Hebrew locative.
    rationale: בְּגֹרֶן means “at/on the threshing floor”; కళ్లం వద్ద gives the locative directly without suggesting merely nearby.
