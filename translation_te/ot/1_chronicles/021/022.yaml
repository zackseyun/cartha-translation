id: 1CH.21.22
reference: 1 Chronicles 21:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜יד אֶל אָרְנָ֗ן תְּנָ/ה לִּ/י֙ מְק֣וֹם הַ/גֹּ֔רֶן וְ/אֶבְנֶה בּ֥/וֹ מִזְבֵּ֖חַ לַ/יהוָ֑ה בְּ/כֶ֤סֶף מָלֵא֙ תְּנֵ֣/הוּ לִ֔/י וְ/תֵעָצַ֥ר הַ/מַּגֵּפָ֖ה מֵ/עַ֥ל הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/022.yaml
  text: Then David said to Ornan, “Give me the place of the threshing floor, so that I may build on it an altar to the LORD. Give it to me for the full price, so that the plague may be stopped from upon the people.”
translation:
  language: te
  text: 'అప్పుడు దావీదు ఓర్నానుతో ఇలా అన్నాడు: “నేను యెహోవాకు దానిమీద ఒక బలిపీఠం కట్టడానికి కళ్లం ఉన్న స్థలాన్ని నాకు ఇవ్వు. ప్రజల మీదనున్న తెగులు ఆగిపోయేలా, పూర్తి ధరకు దాన్ని నాకు ఇవ్వు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְקוֹם הַגֹּרֶן
  choice: ఈ కళ్లం స్థలాన్ని
  rationale: ‘కళ్లం’ ధాన్యం నూర్చే ప్రదేశాన్ని సహజంగా సూచిస్తుంది; సందర్భంలో వారి ఎదుట ఉన్న నిర్దిష్ట స్థలం కావడం వల్ల ‘ఈ’ వాడబడింది.
- source_word: מִזְבֵּחַ
  choice: బలిపీఠం
  rationale: బలులు అర్పించే నిర్మాణానికి ప్రామాణికమైన, సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: హీబ్రూ దైవనామమైన יהוהను పేరుగా ప్రతిబింబించే స్థిరమైన తెలుగు రూపం.
- source_word: בְּכֶסֶף מָלֵא
  choice: పూర్తి వెల చెల్లించి
  rationale: అక్షరార్థంగా ‘పూర్తి వెండితో’; సందర్భానుసారంగా ఎలాంటి తగ్గింపు లేకుండా పూర్తి ధర చెల్లించడాన్ని సూచిస్తుంది.
- source_word: וְתֵעָצַר
  choice: ఆగిపోయేలా
  rationale: నిఫాల్ రూపంలోని ‘ఆపబడుట/నిలిచిపోవుట’ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: מֵעַל הָעָם
  choice: ప్రజల మీదున్న
  rationale: తెగులు ప్రజలను పీడిస్తున్నదనే మూలపాఠంలోని స్థానిక రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: దైవనామం יהוה అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలంలో సాధారణ బిరుదు కాక దైవనామం ఉన్నందున దానిని పేరుగా నిలుపుకున్నాం; ఏ ప్రత్యేక మతశాఖ వ్యాఖ్యానాన్నీ చేర్చలేదు.
- issue: తెగులు ఆగడానికి బలిపీఠ నిర్మాణం మధ్య సంబంధం
  choice: “ఆగిపోయేలా” అనే ఉద్దేశార్థక సంబంధాన్ని నిలుపుట
  alternative: బలిపీఠమే స్వయంగా తెగులును ఆపుతుందని స్పష్టీకరించడం
  rationale: హీబ్రూ వాక్యం ఉద్దేశం/ఫలితాన్ని తెలిపినా కార్యసాధకతను సిద్ధాంతపరంగా వివరించదు; అందువల్ల ఆ ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ప్రత్యక్ష సంభాషణలో సహజమైన ఏకవచన ఆజ్ఞారూపం వాడబడింది; మూలపాఠంలోని పునరుక్త అభ్యర్థన నిలుపబడింది.
