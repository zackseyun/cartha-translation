source:
  edition: WLC
  text: וַ/יָּ֥בֹא גָ֖ד אֶל דָּוִ֑יד וַ/יֹּ֥אמֶר ל֛/וֹ כֹּֽה אָמַ֥ר יְהוָ֖ה קַבֶּל לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/011.yaml
  text: So Gad came to David and said to him[a], “Thus says Yahweh, ‘Choose for yourself—’”
translation:
  language: te
  text: 'గాదు దావీదు దగ్గరకు వచ్చి అతనితో ఇలా అన్నాడు: “యాహ్వే ఇలా అంటున్నాడు: ‘నీకోసం ఎంచుకో[a]—’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నీ కొరకు స్వీకరించు—”; తరువాతి వచనంలో చెప్పబడే ప్రత్యామ్నాయాల్లో ఒకదాన్ని ఎంచుకోమనే ఆదేశం ఈ సందర్భంలో ఉద్దేశించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: వచ్చి
  rationale: בוא అనే సాధారణ గమన క్రియను దావీదు ఉన్న స్థలాన్ని దృష్టికేంద్రంగా తీసుకుని సహజమైన తెలుగు కథనశైలిలో ‘వచ్చి’ అని అనువదించాం.
- source_word: גָד
  choice: గాదు
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: אֶל דָּוִיד
  choice: దావీదు దగ్గరకు
  rationale: వ్యక్తివైపు గమనాన్ని సూచించే אֶל భావాన్ని ఆధునిక సహజ తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וַיֹּאמֶר לוֹ
  choice: అతనితో ఇలా అన్నాడు
  rationale: אמרతో కూడిన పరోక్ష కర్మ సర్వనామాన్ని నిలుపుతూ, తరువాత వచ్చే ప్రత్యక్ష వాక్యానికి సహజంగా దారితీసే తెలుగు నిర్మాణం.
- source_word: כֹּה אָמַר
  choice: ఇలా అంటున్నాడు
  rationale: ప్రవక్త సందేశ సూత్రాన్ని ఆధునిక తెలుగులో సహజంగా, దేవుని ప్రస్తుత ప్రకటనగా అందిస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే లిప్యంతరీకరణతో ఉంచాం.
- source_word: קַבֶּל
  choice: ఎంచుకో
  rationale: తదుపరి వచనంలో చెప్పబడే ప్రత్యామ్నాయాల్లో ఒకదాన్ని స్వీకరించమనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది; ‘స్వీకరించు’ అనే మరింత అక్షరార్థాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: לָךְ
  choice: నీ కోసం నీవే
  rationale: దావీదు వ్యక్తిగతంగా ఎంపిక చేసుకోవలసిన బాధ్యతను సూచించే దాతృక/ప్రయోజనార్థక భావాన్ని తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలో ఉన్న వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో మార్చకుండా నిలిపాం. ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మరొక సాధ్యమైన లిప్యంతరీకరణ.
- issue: קַבֶּל యొక్క సందర్భార్థం
  choice: ఎంచుకో
  alternative: స్వీకరించు
  rationale: ఈ ఆజ్ఞ తరువాతి వచనంలో ఇవ్వబడే తీర్పు ప్రత్యామ్నాయాల్లో ఒకదాన్ని దావీదు తీసుకోవడాన్ని సూచిస్తుంది. అయినప్పటికీ మూలక్రియలోని ‘స్వీకరించు’ భావాన్ని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే సహజ కథనశైలితో పాటు ప్రవక్త సందేశ సూత్రానికి తగిన గంభీరతను నిలిపాం. మూలవాక్యంలోని అసంపూర్ణ ముగింపును దీర్ఘ గీతతో కాపాడాం.
