revisions:
- from: దావీదు ఆ స్థలం కోసం ఓర్నానుకు తూకం ప్రకారం ఆరువందల షెకెలుల బంగారం ఇచ్చాడు.[a]
  to: దావీదు ఆ స్థలం కోసం ఓర్నానుకు తూకంలో ఆరువందల బంగారు షెకెలులు ఇచ్చాడు.[a]
