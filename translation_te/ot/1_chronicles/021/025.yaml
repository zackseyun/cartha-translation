id: 1CH.21.25
reference: 1 Chronicles 21:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתֵּ֥ן דָּוִ֛יד לְ/אָרְנָ֖ן בַּ/מָּק֑וֹם שִׁקְלֵ֣י זָהָ֔ב מִשְׁקָ֖ל שֵׁ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/025.yaml
  text: And David gave Ornan six hundred shekels of gold by weight for the place[a].
translation:
  language: te
  text: దావీదు ఆ స్థలం కోసం ఓర్నానుకు తూకంలో ఆరువందల బంగారు షెకెలులు ఇచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2 సమూయేలు 24:24లోని సమాంతర వృత్తాంతం యాభై వెండి షెకెలులను ప్రస్తావిస్తుంది; ఇక్కడ దినవృత్తాంతముల గ్రంథం ఆరువందల బంగారు షెకెలులు అని చెబుతోంది. ఈ భేదం కొనుగోలు పరిధి వేరుగా ఉండడాన్ని గానీ, భిన్నమైన పాఠసంప్రదాయాన్ని గానీ ప్రతిబింబించవచ్చు.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ఇచ్చాడు
  rationale: נתן అనే క్రియకు సాధారణ అర్థం ‘ఇవ్వడం’. కొనుగోలు సందర్భం ఉన్నప్పటికీ, ‘చెల్లించాడు’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా హీబ్రూ పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: לְאָרְנָן
  choice: ఓర్నానుకు
  rationale: దినవృత్తాంతముల హీబ్రూ పాఠంలో ఉన్న పేరు ఓర్నాను; సమూయేలు గ్రంథంలోని సమాంతర వృత్తాంతపు పేరుతో దీనిని మార్చలేదు.
- source_word: בַּמָּקוֹם
  choice: ఆ స్థలం కోసం
  rationale: מָקוֹם అంటే ‘స్థలం’ లేదా ‘ప్రదేశం’. కొనుగోలు సందర్భంలో בְּ ఉపసర్గ ధర చెల్లించిన వస్తువును సూచిస్తున్నందున ‘ఆ స్థలం కోసం’ సహజంగా ఉంది.
- source_word: שִׁקְלֵי זָהָב
  choice: షెకెలుల బంగారం
  rationale: ప్రాచీన తూకపు ప్రమాణాన్ని మార్చకుండా, పదార్థం బంగారమని స్పష్టంగా తెలిపే సహజ తెలుగు నిర్మాణం.
- source_word: מִשְׁקָל
  choice: తూకం ప్రకారం
  rationale: షెకెలులు ఇక్కడ తూకపు ప్రమాణాలని స్పష్టం చేస్తూ హీబ్రూ పదాన్ని సహజ తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: שֵׁשׁ מֵאוֹת
  choice: ఆరువందల
  rationale: హీబ్రూ పాఠంలోని సంఖ్యను సమాంతర వృత్తాంతంతో సమన్వయపరచకుండా యథాతథంగా నిలిపింది.
theological_decisions:
- issue: 2 సమూయేలు 24:24లోని సమాంతర వృత్తాంతంతో సంఖ్య మరియు లోహంలో ఉన్న భేదం
  choice: ‘ఆరువందల షెకెలుల బంగారం’ అనే దినవృత్తాంతముల పాఠాన్ని యథాతథంగా ఉంచడం
  alternative: ఎద్దులు, కళ్లం కోసం యాభై వెండి షెకెలులు అని చెప్పే సమూయేలు వృత్తాంతంతో సమన్వయపరచిన అనువాదం
  rationale: దినవృత్తాంతముల హీబ్రూ పాఠం ఆరువందల బంగారు షెకెలులు అని స్పష్టంగా చెబుతుంది. భిన్న కొనుగోలు పరిధి లేదా వేరొక పాఠసంప్రదాయం సాధ్యమైనప్పటికీ, అనువాదం ఈ అంతర్గ్రంథ ఉద్రిక్తతను మౌనంగా తొలగించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘షెకెలు’ అనే ప్రాచీన ప్రమాణాన్ని పరిమాణ మార్పిడి చేయకుండా నిలిపి, ‘తూకం ప్రకారం’తో దాని స్వభావాన్ని స్పష్టం చేశాం.
