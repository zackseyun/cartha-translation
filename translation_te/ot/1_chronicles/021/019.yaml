source:
  edition: WLC
  text: וַ/יַּ֤עַל דָּוִיד֙ בִּ/דְבַר גָּ֔ד אֲשֶׁ֥ר דִּבֶּ֖ר בְּ/שֵׁ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/019.yaml
  text: So David went up at the word of Gad[b][a], which he had spoken in the name of Yahweh.
translation:
  language: te
  text: యాహ్వే నామంలో గాదు చెప్పిన మాట ప్రకారం[a] దావీదు పైకి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గాదు మాట విని.”
    reason: בִּדְבַר అనే పదబంధం మాటకు అనుగుణంగా లేదా ఆ మాటకు స్పందనగా చేసిన చర్యను సూచించగలదు.
lexical_decisions:
- source_word: וַיַּעַל
  choice: పైకి వెళ్లాడు
  rationale: עלה అనే క్రియలోని ‘ఎక్కి వెళ్లడం/పైకి వెళ్లడం’ అనే దిశాభావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בִּדְבַר גָּד
  choice: గాదు చెప్పిన మాట ప్రకారం
  rationale: בְּ ఇక్కడ ఆధారం లేదా అనుసరణను సూచిస్తుంది. ‘మాట ప్రకారం’ అనేది దావీదు గాదు ద్వారా అందిన ఆదేశాన్ని పాటించాడనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: אֲשֶׁר דִּבֶּר
  choice: చెప్పిన
  rationale: సంబంధ వాక్యం గాదు పలికిన మాటను వివరిస్తుంది; తెలుగు కృదంత రూపం మూలంలోని ముందుగా జరిగిన పలుకును సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: בְּשֵׁם יְהוָה
  choice: యాహ్వే నామంలో
  rationale: ప్రవక్త యాహ్వే అధికారంతో పలికాడనే భావాన్ని తెలియజేస్తూనే, ‘నామంలో’ అనే మూలభాషా రూపకాన్ని నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, వ్యక్తిగత నామానికి సమీపమైన తెలుగు లిప్యంతరీకరణగా ఇస్తుంది.
theological_decisions:
- issue: దైవనామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: హీబ్రూ పాఠంలో వ్యక్తిగత దైవనామం నేరుగా ఉంది. అందువల్ల బిరుదైన ‘ప్రభువు’తో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించబడింది.
- issue: ‘యాహ్వే నామంలో’ అనే పదబంధ భావం
  choice: మూలంలోని నామ-భాషను యథాతథంగా నిలుపడం
  alternative: యాహ్వే అధికారంతో
  rationale: ఈ పదబంధం అధికారాన్ని సూచించినప్పటికీ, ‘నామంలో’ అనే రూపం ఆ భావాన్ని పూర్తిగా వివరణాత్మకంగా మార్చకుండా మూలంలోని ధార్మిక భాషను, దాని విస్తృత భావసాధ్యతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘పైకి వెళ్లాడు’ ద్వారా స్థలదిశను, ‘నామంలో’ ద్వారా మూలంలోని ప్రవచనాధికార భాషను నిలుపుకున్నాం.
