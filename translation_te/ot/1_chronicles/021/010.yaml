id: 1CH.21.10
reference: 1 Chronicles 21:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: לֵךְ֩ וְ/דִבַּרְתָּ֨ אֶל דָּוִ֜יד לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה שָׁל֕וֹשׁ אֲנִ֖י נֹטֶ֣ה עָלֶ֑י/ךָ בְּחַר לְ/ךָ֛ אַחַ֥ת מֵ/הֵ֖נָּה וְ/אֶֽעֱשֶׂה לָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/010.yaml
  text: 'Go and speak to David[a], saying, ‘Thus says Yahweh: I am setting three things before you. Choose one of them for yourself, and I will do it to you.’'
translation:
  language: te
  text: 'వెళ్లి దావీదుతో ఇలా చెప్పు: ‘యాహ్వే ఇలా చెబుతున్నాడు: నేను నీ ముందుకు మూడు ఉంచుతున్నాను[a]. వాటిలో ఒకదాన్ని నీ కోసం ఎంచుకో; దానిని నేను నీకు కలిగిస్తాను.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నేను నీ మీద మూడు చాపుతున్నాను/విస్తరిస్తున్నాను.” హీబ్రూలో ‘మూడు’ దేనిని సూచిస్తుందో తెలిపే నామవాచకం లేదు; సందర్భంలో దావీదు వాటిలో ఒకదాన్ని ఎంచుకోవాలి.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ וְדִבַּרְתָּ אֶל דָּוִיד לֵאמֹר
  choice: నీవు వెళ్లి దావీదుతో ఇలా చెప్పు
  rationale: ఆజ్ఞార్థకమైన ‘వెళ్లు’ను, דִבֶּר אֶל అనే ‘ఒకరితో మాట్లాడు/చెప్పు’ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; לֵאמֹרను ‘ఇలా’ అనే ఉద్ధరణ పరిచయంతో చూపిస్తుంది.
- source_word: כֹּה אָמַר יְהוָה
  choice: యెహోవా ఇలా అంటున్నాడు
  rationale: ప్రవక్తీయ సందేశ సూత్రాన్ని సహజ తెలుగులో నిలుపుతూ, יהוה అనే దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరిస్తుంది.
- source_word: שָׁלוֹשׁ אֲנִי נֹטֶה עָלֶיךָ
  choice: నేను మూడు నీ మీదికి చాపుతున్నాను
  rationale: హీబ్రూలో ‘మూడు’కు సంబంధించిన నామవాచకం చెప్పబడలేదు. נֹטֶה యొక్క ‘చాపు/విస్తరించు’ భావాన్ని నిలిపి, ‘తీర్పులు’ లేదా ‘ఎంపికలు’ అని ముందుగానే నిర్దిష్టం చేయకుండా మూలంలోని అస్పష్టతను కాపాడుతుంది.
- source_word: בְּחַר לְךָ אַחַת מֵהֵנָּה
  choice: వాటిలో ఒకదాన్ని నీ కోసం ఎంచుకో
  rationale: בחר అనే ప్రత్యక్ష ఆజ్ఞను, לְךָలోని వ్యక్తిగత సంబంధాన్ని, אַחַת מֵהֵנָּהలోని భాగార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: దాన్ని నేను నీకు చేస్తాను
  rationale: לְךָ సందర్భానుసారం ‘నీకు’ లేదా ‘నీ మీద’ అనే పరిధిని కలిగి ఉంది. ‘నీకు చేస్తాను’ మూల నిర్మాణాన్ని దగ్గరగా అనుసరిస్తూ, శిక్షాత్మక భావాన్ని అనువాదంలో అతిగా వివరిచదు.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలపాఠంలోని ప్రత్యేక దైవనామాన్ని సాధారణ బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన ‘యెహోవా’ రూపంలో నిలిపాం; ఖచ్చితమైన ప్రాచీన ఉచ్చారణ నిర్ధారితం కాదు.
- issue: ‘మూడు’కు సంబంధించిన అంతర్లీన నామవాచకం
  choice: నామవాచకాన్ని సరఫరా చేయకుండా ‘మూడు’ అని ఉంచడం
  alternative: మూడు విషయాలు / మూడు ఎంపికలు / మూడు తీర్పులు
  rationale: హీబ్రూ పాఠం నామవాచకాన్ని పేర్కొనదు. తరువాతి వచనం వాటిని వివరిస్తుంది కాబట్టి, ఇక్కడ నిర్దిష్ట పదాన్ని చేర్చడం మూలంలోని ఉద్దేశపూర్వక సంక్షిప్తతను తగ్గిస్తుంది.
- issue: וְאֶעֱשֶׂה לָּךְలో לְךָ యొక్క భావం
  choice: దాన్ని నేను నీకు చేస్తాను
  alternative: దాన్ని నేను నీ మీదికి రప్పిస్తాను
  rationale: సందర్భం శిక్షను సూచించినా, హీబ్రూ నిర్మాణం సాధారణమైన ‘నీకు చేస్తాను’ అనే రూపంలో ఉంది. అందువల్ల సందర్భంలోని ఉద్రిక్తతను నిలిపి, మరింత వివరణాత్మకమైన ప్రత్యామ్నాయాన్ని ప్రధాన పాఠంలో పెట్టలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని అస్పష్టతను ప్రధాన పాఠంలో నిలిపి, అవసరమైన వివరణను పాదటిప్పణిలో ఇచ్చాం.
