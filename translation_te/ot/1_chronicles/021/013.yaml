id: 1CH.21.13
reference: 1 Chronicles 21:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר דָּוִ֛יד אֶל גָּ֖ד צַר לִ֣/י מְאֹ֑ד אֶפְּלָה נָּ֣א בְ/יַד יְהוָ֗ה כִּֽי רַבִּ֤ים רַחֲמָי/ו֙ מְאֹ֔ד וּ/בְ/יַד אָדָ֖ם אַל אֶפֹּֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/013.yaml
  text: Then David said to Gad[a], “I am in great distress. Please let me fall into the hand of Yahweh, for his mercies are very great; but do not let me fall into the hand of man.”
translation:
  language: te
  text: 'అప్పుడు దావీదు గాదుతో ఇలా అన్నాడు: “నేను తీవ్ర సంకటంలో ఉన్నాను. దయచేసి, నేను యాహ్వే చేతిలో పడనీయండి; ఎందుకంటే ఆయన కనికరాలు అపారమైనవి. అయితే మనిషి చేతిలో[a] నేను పడకుండునుగాక.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనుషుల చేతుల్లో.” హెబ్రీలో అక్షరార్థంగా ఏకవచనంలో “మనిషి చేతిలో” అని ఉంది; ఇది యాహ్వే చేతితో మానవ అధికారానికి మధ్య ఉన్న వ్యత్యాసాన్ని చూపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַר לִי מְאֹד
  choice: నేను తీవ్రమైన సంకటంలో ఉన్నాను
  rationale: ఈ హెబ్రీ నానుడి తీవ్రమైన వేదనను, చిక్కు పరిస్థితిని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా భావతీవ్రతను నిలిపింది.
- source_word: אֶפְּלָה נָּא
  choice: దయచేసి నన్ను … పడనివ్వు
  rationale: కోహోర్టేటివ్ రూపంతో కూడిన נָא అత్యవసరమైన వినయపూర్వక మనవిని వ్యక్తం చేస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘దయచేసి … పడనివ్వు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: בְיַד יְהוָה
  choice: యాహ్వే చేతిలో
  rationale: ‘చేతిలో’ అనే మూలభాషా రూపకం ఒకరి అధికారానికి లేదా తీర్పుకు అప్పగించబడటాన్ని సూచిస్తుంది; తరువాతి ‘మనిషి చేతిలో’ అనే వ్యత్యాసాన్ని కూడా నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పునర్నిర్మిత ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: כִּי רַבִּים רַחֲמָיו מְאֹד
  choice: ఎందుకంటే ఆయన కనికరాలు ఎంతో గొప్పవి
  rationale: רַחֲמִים యొక్క బహువచన రూపాన్ని ‘కనికరాలు’గా నిలిపి, רַבִּים మరియు מְאֹד తెలిపే విస్తారతను ‘ఎంతో గొప్పవి’గా వ్యక్తం చేసింది.
- source_word: וּבְיַד אָדָם אַל אֶפֹּל
  choice: అయితే మనిషి చేతిలో నన్ను పడనివ్వకు
  rationale: దైవిక అధికారానికి, మానవ అధికారానికి మధ్య ఉన్న వ్యత్యాసాన్ని నిలిపేందుకు אָדָם యొక్క ఏకవచన ప్రతినిధి భావాన్ని ‘మనిషి’గా అనువదించింది; ప్రతికూల మనవిని సహజ తెలుగులో తెలిపింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠం ప్రత్యేక దైవనామాన్ని నేరుగా ఉపయోగిస్తుంది. దానిని బిరుదుగా మార్చకుండా, Yahweh ఉచ్చారణకు దగ్గరైన ‘యాహ్వే’గా ఇచ్చింది.
- issue: యాహ్వే చేతి—మనిషి చేతి మధ్య వ్యత్యాసం
  choice: రెండు చోట్లా ‘చేతిలో’ అనే రూపకాన్ని నిలిపివేయడం
  alternative: యాహ్వే అధికారంలో / మనుషుల చేతుల్లో
  rationale: మూలంలోని సమాంతర నిర్మాణం దైవిక తీర్పు మరియు మానవ అధికారానికి మధ్య ఉన్న భావపూర్ణ వ్యత్యాసాన్ని ఉద్దేశపూర్వకంగా చూపుతుంది; దానిని వివరణాత్మకంగా సడలించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని ‘చేతి’ రూపకం, బహువచన ‘కనికరాలు,’ అలాగే దైవిక—మానవ అధికారాల మధ్య వ్యత్యాసం నిలిపివేయబడ్డాయి.
