id: 1CH.21.14
reference: 1 Chronicles 21:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּתֵּ֧ן יְהוָ֛ה דֶּ֖בֶר בְּ/יִשְׂרָאֵ֑ל וַ/יִּפֹּל֙ מִ/יִּשְׂרָאֵ֔ל שִׁבְעִ֥ים אֶ֖לֶף אִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/014.yaml
  text: So Yahweh sent a plague on Israel[a], and seventy thousand men of Israel fell.
translation:
  language: te
  text: కాబట్టి యెహోవా ఇశ్రాయేలుపై తెగులు[a] పంపాడు; ఇశ్రాయేలులో డెబ్బై వేల మంది పురుషులు మరణించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మహమ్మారి.’ హెబ్రీ పదం సాధారణంగా ప్రాణాంతకమైన వ్యాధి వ్యాప్తిని సూచిస్తుంది; తరచుగా అది దైవిక తీర్పు సందర్భంలో వస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, తెలుగులో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో ఉంచింది.
- source_word: וַיִּתֵּן
  choice: పంపాడు
  rationale: పదశః ‘ఇచ్చాడు’ అయినప్పటికీ, דֶּבֶר తో కూడిన సందర్భంలో ‘తెగులు పంపాడు’ అనేది సహజమైన తెలుగు ప్రయోగం; దేవుని ప్రత్యక్ష కార్యసాధకత్వాన్ని నిలుపుతుంది.
- source_word: דֶּבֶר
  choice: తెగులు
  rationale: ప్రాణాంతకంగా వ్యాపించే వ్యాధిని, ముఖ్యంగా తీర్పు సందర్భంలో, సూచించే హెబ్రీ పదానికి సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: בְּיִשְׂרָאֵל
  choice: ఇశ్రాయేలు మీదికి
  rationale: తెగులు ప్రజల మీదికి రావడాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וַיִּפֹּל
  choice: మరణించారు
  rationale: పదశః ‘పడిపోయారు’; ఈ తీర్పు సందర్భంలో అది మరణాన్ని సూచించే హెబ్రీ నుడికారం. తెలుగులో ‘పడిపోయారు’ అస్పష్టంగా ఉండగలందున ఉద్దేశించిన భావాన్ని స్పష్టంగా తెలిపింది.
- source_word: מִיִּשְׂרָאֵל
  choice: ఇశ్రాయేలీయుల్లో
  rationale: ఇశ్రాయేలు ప్రజలలోనుంచి ఆ సంఖ్య మరణించిందనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: שִׁבְעִים אֶלֶף אִישׁ
  choice: డెబ్బై వేల మంది
  rationale: אִישׁ సంఖ్య తరువాత సమూహార్థకంగా ఉంది. తెలుగులో ‘మంది’ మనుషులను లెక్కించే సహజ రూపం; అనవసరంగా లింగాన్ని విస్తరించదు లేదా బలవంతంగా నిర్దేశించదు.
theological_decisions:
- issue: తీర్పులో దేవుని కార్యసాధకత్వం
  choice: యెహోవా ... తెగులు పంపాడు
  alternative: యెహోవా ... తెగులు రావడానికి అనుమతించాడు
  rationale: హెబ్రీ పాఠం కార్యాన్ని నేరుగా యెహోవాకే ఆపాదిస్తుంది; ‘అనుమతించాడు’ అని మార్చడం మూలంలో లేని ధార్మిక మృదీకరణ అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. దైవనామం వ్యక్తినామంగా నిలుపబడింది; తీర్పులోని ప్రత్యక్ష దైవ కార్యసాధకత్వం మృదీకరించబడలేదు.
