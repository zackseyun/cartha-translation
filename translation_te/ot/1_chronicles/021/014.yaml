revisions:
- from: కాబట్టి యెహోవా ఇశ్రాయేలు మీదికి తెగులు[a] పంపాడు; ఇశ్రాయేలీయుల్లో డెబ్బై వేల మంది మరణించారు.
  to: కాబట్టి యెహోవా ఇశ్రాయేలుపై తెగులు[a] పంపాడు; ఇశ్రాయేలులో డెబ్బై వేల మంది పురుషులు మరణించారు.
  rationale: The revision preserves the Hebrew’s direct attribution of the plague to Yahweh, the plague terminology, and the death result, while explicitly rendering אִישׁ as “పురుషులు.” It also uses more idiomatic Telugu for the plague’s coming upon Israel. The footnote remains anchored to “తెగులు” and states the lexical alternative without adding doctrinal interpretation.
