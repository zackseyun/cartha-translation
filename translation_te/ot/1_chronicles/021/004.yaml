source:
  edition: WLC
  text: וּ/דְבַר הַ/מֶּ֖לֶךְ חָזַ֣ק עַל יוֹאָ֑ב וַ/יֵּצֵ֣א יוֹאָ֗ב וַ/יִּתְהַלֵּךְ֙ בְּ/כָל יִשְׂרָאֵ֔ל וַ/יָּבֹ֖א יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/004.yaml
  text: But the king’s word prevailed against Joab[a]. So Joab went out and went throughout all Israel[b], and he came to Jerusalem.
translation:
  language: te
  text: అయితే రాజు మాట యోవాబుపై పైచేయి సాధించింది[a]. కాబట్టి యోవాబు బయలుదేరి ఇశ్రాయేలు దేశమంతటా సంచరించి[b], యెరూషలేముకు వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజు ఆజ్ఞ యోవాబుపై పైచేయి సాధించింది.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఇశ్రాయేలు దేశమంతటా ప్రయాణించి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְבַר הַמֶּלֶךְ
  choice: అయితే రాజు మాట
  rationale: דָּבָר‌కు ప్రాథమికంగా ‘మాట/విషయం’ అనే అర్థం ఉంది; ఇక్కడ అది రాజు ఇచ్చిన అధికారపూర్వక ఆదేశాన్ని సూచిస్తుంది. ‘మాట’ హీబ్రూ అభివ్యక్తిని నిలుపుతుంది; ‘అయితే’ ముందటి వచనంలో యోవాబు తెలిపిన అభ్యంతరంతో ఉన్న వ్యత్యాసాన్ని చూపుతుంది.
- source_word: חָזַק עַל
  choice: యోవాబుపై పైచేయి సాధించింది
  rationale: ‘మీద బలపడింది’ అనే హీబ్రూ నుడికారం, యోవాబు ప్రతిఘటనను రాజు మాట అధిగమించిందని తెలియజేస్తుంది. ‘పైచేయి సాధించింది’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ బలాన్ని నిలుపుతుంది.
- source_word: וַיֵּצֵא יוֹאָב
  choice: కాబట్టి యోవాబు బయలుదేరి
  rationale: יָצָא సాధారణంగా ‘బయలుదేరు/వెళ్లిపోవు.’ ‘కాబట్టి’ రాజు మాట పైచేయి సాధించిన దాని పర్యవసానంగా జరిగిన చర్యను స్పష్టం చేస్తుంది.
- source_word: וַיִּתְהַלֵּךְ בְּכָל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేశమంతటా సంచరించి
  rationale: הָלַךְ హిత్పయేల్ రూపం ఇక్కడ అటూ ఇటూ ప్రయాణించడం లేదా ప్రాంతమంతటా తిరగడం అనే భావాన్ని ఇస్తుంది. ‘సంచరించి’ ఆ భావాన్ని సహజంగా తెలుపుతుంది; ‘దేశమంతటా’ జాతీయ భూభాగ వ్యాప్తిని సాధారణ పాఠకునికి స్పష్టం చేస్తుంది.
- source_word: כָּל יִשְׂרָאֵל
  choice: ఇశ్రాయేలు దేశమంతటా
  rationale: ఇది యోవాబు ప్రయాణం ఇశ్రాయేలు అంతటినీ ఆవరించిందని సూచిస్తుంది. తెలుగులో ప్రదేశార్థక సందర్భాన్ని సహజంగా తెలియజేయడానికి ‘దేశమంతటా’ వాడబడింది.
- source_word: וַיָּבֹא יְרוּשָׁלִָם
  choice: యెరూషలేముకు వచ్చాడు
  rationale: בּוֹא అంటే ‘వచ్చు/ప్రవేశించు.’ సందర్భం ప్రకారం తిరిగి వచ్చాడని భావించవచ్చైనా, మూలపాఠం కేవలం ‘వచ్చాడు’ అని చెబుతుంది; అందువల్ల ఆ పరిమితినే నిలిపాం.
