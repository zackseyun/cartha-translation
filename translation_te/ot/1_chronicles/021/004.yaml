translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని ‘రాజు మాట’ అనే రూపకాన్ని ప్రధాన పాఠంలో నిలిపి, సందర్భార్థమైన ‘ఆజ్ఞ’ను పాదసూచికలో ఇచ్చాం. హీబ్రూ క్రియల వరుసను తెలుగులో సహజమైన అసమాపక క్రియలతో అనుసంధానించాం.
