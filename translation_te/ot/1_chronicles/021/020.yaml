translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడాం. పాత గ్రాంథిక క్రియారూపాలను నివారించాం. ‘దాక్కొని ఉన్నారు’ అనే సహజ తెలుగు రూపంలో హీబ్రూ ఆత్మనేపద భావం అంతర్లీనంగా ఉన్నప్పటికీ, రూపసూక్ష్మత కోసం పాదటిప్పణి ఉంచాం.
