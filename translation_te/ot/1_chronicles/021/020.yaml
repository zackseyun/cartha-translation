  text: וַ/יָּ֣שָׁב אָרְנָ֗ן וַ/יַּרְא֙ אֶת הַ/מַּלְאָ֔ךְ וְ/אַרְבַּ֧עַת בָּנָ֛י/ו עִמּ֖/וֹ מִֽתְחַבְּאִ֑ים וְ/אָרְנָ֖ן דָּ֥שׁ חִטִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/020.yaml
  text: Ornan turned and saw the angel[a], and his four sons with him were hiding themselves, while Ornan was threshing wheat.
translation:
  language: te
  text: ఒర్నాను వెనక్కి తిరిగి దేవదూతను చూశాడు. అతనితో ఉన్న అతని నలుగురు కుమారులు దాక్కొని ఉన్నారు[a]; ఆ సమయంలో ఒర్నాను గోధుమలను నూర్చుతున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “తమను తాము దాచుకుంటూ ఉన్నారు.” హీబ్రూ హిత్పయేల్ రూపం ఈ ప్రతిబింబ భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: వెనక్కి తిరిగి
  rationale: שׁוב అనే క్రియకు ‘తిరుగు/వెనక్కి తిరుగు’ అనే ప్రాథమిక భావం ఉంది. దేవదూతను చూడటానికి జరిగిన శారీరక మలుపును ఈ సందర్భంలో సహజంగా తెలియజేస్తుంది; మూలంలో ప్రత్యేకమైన ‘ఇప్పుడు’ అనే కాలసూచక పదం లేనందున దాన్ని చేర్చలేదు.
- source_word: וַיַּרְא אֶת הַמַּלְאָךְ
  choice: దేవదూతను చూశాడు
  rationale: מַלְאָךְ అనే పదం ‘సందేశకుడు’ లేదా ‘దూత’ అని అర్థమవవచ్చు. అయితే ఈ దైవిక తీర్పు సందర్భంలో మానవేతర దూత ఉద్దేశించబడినందున ఆధునిక తెలుగులో ‘దేవదూత’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: וְאַרְבַּעַת בָּנָיו עִמּוֹ
  choice: అతనితో ఉన్న అతని నలుగురు కుమారులు
  rationale: ఈ పదబంధం ఒర్నానుకు చెందిన నలుగురు కుమారులు అతనితో ఉన్నారని చెబుతుంది. తెలుగు వాక్యనిర్మాణంలో సంబంధాన్ని స్పష్టంగా చూపడానికి ‘అతనితో ఉన్న’ అని ముందుంచడం సహజం.
- source_word: מִתְחַבְּאִים
  choice: దాక్కొని ఉన్నారు
  rationale: హిత్పయేల్ రూపంలోని ఆత్మనేపద/మధ్యమ భావాన్ని తెలుగు ‘దాక్కొను’ సహజంగానే వ్యక్తం చేస్తుంది; కృదంత రూపం కొనసాగుతున్న స్థితిని చూపిస్తుంది. మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: וְאָרְנָן דָּשׁ חִטִּים
  choice: ఆ సమయంలో ఒర్నాను గోధుమలను నూర్చుతున్నాడు
  rationale: ఈ ఉపవాక్యం ఒర్నాను అప్పట్లో చేస్తున్న నేపథ్య క్రియను తెలియజేస్తుంది. ‘ఆ సమయంలో’ సమకాలీన పరిస్థితిని స్పష్టం చేస్తుంది; דּוּשׁ ఇక్కడ కళ్లంలో గింజలను వేరుచేసే నూర్పిడి క్రియను సూచిస్తుంది.
- source_word: חִטִּים
  choice: గోధుమలు
  rationale: ఈ నామవాచకం సాధారణ ధాన్యాన్ని కాక ప్రత్యేకంగా గోధుమలను సూచిస్తుంది.
