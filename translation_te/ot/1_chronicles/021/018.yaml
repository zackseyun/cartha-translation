source:
  edition: WLC
  text: וּ/מַלְאַ֧ךְ יְהוָ֛ה אָמַ֥ר אֶל גָּ֖ד לֵ/אמֹ֣ר לְ/דָוִ֑יד כִּ֣י יַעֲלֶ֣ה דָוִ֗יד לְ/הָקִ֤ים מִזְבֵּ֨חַ֙ לַ/יהוָ֔ה בְּ/גֹ֖רֶן אָרְנָ֥ן הַ/יְבֻסִֽי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/018.yaml
  text: And the angel of Yahweh said to Gad to tell David that David should go up to set up an altar to Yahweh on the threshing floor of Ornan the Jebusite[a][b].
translation:
  language: te
  text: యాహ్వే దేవదూత[a] గాదుతో, దావీదు పైకి వెళ్లి యెబూసీయుడైన ఒర్నాను కళ్లంలో యాహ్వేకు ఒక బలిపీఠాన్ని నిలపాలని దావీదుకు చెప్పమన్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యాహ్వే దూత’ లేదా ‘యాహ్వే సందేశవాహకుడు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దావీదు పైకి వెళ్లి … నిలపవలెనని’; లేదా, ‘దావీదు పైకి వెళ్లాలని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְאַךְ יְהוָה
  choice: యాహ్వే దూత
  rationale: מַלְאַךְ అనే పదానికి ‘దూత’ లేదా సందర్భానుసారం ‘దేవదూత’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ పరలోక సంబంధమైన వ్యక్తి ఉద్దేశించబడినా, తెలుగు ‘దూత’ మూలపదంలోని సందేశవాహక భావాన్నీ సహజంగా నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: אָמַר אֶל גָּד לֵאמֹר לְדָוִיד
  choice: గాదుతో, … దావీదుకు చెప్పమన్నాడు
  rationale: హీబ్రూలోని ‘అన్నాడు … చెప్పడానికి’ అనే నిర్మాణాన్ని ఆధునిక తెలుగులో సహజమైన పరోక్ష ఆజ్ఞగా వ్యక్తం చేస్తుంది; గాదు సందేశాన్ని దావీదుకు అందించాలనే భావం స్పష్టంగా ఉంటుంది.
- source_word: כִּי יַעֲלֶה דָוִיד
  choice: దావీదు పైకి వెళ్లి … నిలపాలని
  rationale: עלה లోని ‘పైకి వెళ్లడం’ అనే దిశాభావాన్ని నిలుపుతూ, సందర్భంలోని ఆదేశబలాన్ని ‘నిలపాలని’ అనే పరోక్ష ఆజ్ఞా నిర్మాణంతో తెలిపింది.
- source_word: לְהָקִים מִזְבֵּחַ
  choice: ఒక బలిపీఠాన్ని నిలపాలని
  rationale: הקים అంటే ‘లేపడం, నిలపడం, స్థాపించడం.’ బలిపీఠం విషయంలో ‘నిలపడం’ మూలక్రియకు దగ్గరగా ఉండి తెలుగులో అర్థవంతంగా ఉంది.
- source_word: לַיהוָה
  choice: యాహ్వేకు
  rationale: లామెద్ సంబంధం లేదా అంకితాన్ని సూచిస్తుంది; ‘యాహ్వేకు’ బలిపీఠం ఆయన కోసం అంకితం చేయబడుతుందనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בְּגֹרֶן
  choice: కళ్లం మీద
  rationale: גֹרֶן ధాన్యం నూర్చే ‘కళ్లం.’ స్థల ఉపరితలాన్ని సూచించే בְּను ‘మీద’గా అనువదించడం ఈ సందర్భంలో సహజం.
- source_word: אָרְנָן הַיְבֻסִי
  choice: యెబూసీయుడైన ఒర్నాను
  rationale: వ్యక్తిపేరును ‘ఒర్నాను’గా లిప్యంతరీకరించి, జాతివాచకాన్ని సహజ తెలుగు విశేషణ నిర్మాణంలో ‘యెబూసీయుడైన’గా ఇచ్చాం.
theological_decisions:
- issue: יהוה అనే దైవనామం
  choice: యాహ్వే
  alternative: ప్రభువు / యెహోవా
  rationale: మూలపాఠంలో ఉన్న నాలుగు అక్షరాల ఒడంబడిక నామాన్ని బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం.
- issue: מַלְאַךְ యొక్క వ్యక్తిత్వ సూచన
  choice: దూత
  alternative: దేవదూత / సందేశవాహకుడు
  rationale: ఈ కథనంలో పరలోక సంబంధమైన దూత ఉద్దేశించబడుతున్నప్పటికీ, మూలపదంలోని విస్తృత ‘దూత, సందేశవాహకుడు’ భావాన్ని ప్రధాన పాఠంలో నిలిపి, మరింత నిర్దిష్టమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: יַעֲלֶה లోని ఆదేశబలం
  choice: పైకి వెళ్లి … నిలపాలని
  alternative: పైకి వెళ్లి … తప్పక నిలపాలని / పైకి వెళ్లి … నిలపవలెనని
  rationale: సందర్భం ఆదేశాన్ని సూచిస్తుంది; అయితే హీబ్రూ రూపం మాత్రమే తప్పనిసరితన స్థాయిని పూర్తిగా నిర్ణయించదు. అందువల్ల అతిగా బలపరచకుండా సహజమైన పరోక్ష ఆజ్ఞను వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పరోక్ష వాక్య నిర్మాణం వాడాం. ‘కళ్లం,’ ‘బలిపీఠం,’ ‘పైకి వెళ్లి’ వంటి పదాలతో మూలపాఠంలోని వ్యవసాయ స్థలం, ఆరాధనా వస్తువు, దిశాభావం నిలుపబడ్డాయి.
