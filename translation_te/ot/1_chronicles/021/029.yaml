id: 1CH.21.29
reference: 1 Chronicles 21:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִשְׁכַּ֣ן יְ֠הוָה אֲשֶׁר עָשָׂ֨ה מֹשֶׁ֧ה בַ/מִּדְבָּ֛ר וּ/מִזְבַּ֥ח הָ/עוֹלָ֖ה בָּ/עֵ֣ת הַ/הִ֑יא בַּ/בָּמָ֖ה בְּ/גִבְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/029.yaml
  text: The tabernacle of Yahweh, which Moses had made in the wilderness, and the altar of burnt offering were at that time on the high place at Gibeon.
translation:
  language: te
  text: మోషే అరణ్యంలో చేసిన యాహ్వే నివాస గుడారమూ దహనబలి బలిపీఠమూ ఆ సమయంలో గిబియోనులోని ఉన్నత స్థలంలో ఉన్నాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁכַּן
  choice: నివాస గుడారం
  rationale: దేవుడు తన ప్రజల మధ్య నివసించే పవిత్ర గుడారాన్ని సూచించే మూలపద భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవ నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో లిప్యంతరీకరించింది.
- source_word: אֲשֶׁר עָשָׂה מֹשֶׁה בַמִּדְבָּר
  choice: మోషే అరణ్యంలో చేసిన
  rationale: సంబంధ వాక్యాన్ని సంక్షిప్తంగా, సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: מִזְבַּח הָעוֹלָה
  choice: దహనబలి బలిపీఠం
  rationale: పూర్తిగా దహనం చేసి అర్పించే బలికి నియమించబడిన పీఠాన్ని సూచించే స్థిరమైన ఆరాధనా పదబంధం.
- source_word: בָּעֵת הַהִיא
  choice: ఆ సమయంలో
  rationale: కథనంలోని కాల నేపథ్యాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: בַּבָּמָה
  choice: ఉన్నత స్థలంలో
  rationale: ఆరాధనకు సంబంధించిన ఎత్తైన స్థలం అనే בָּמָה పదార్థాన్ని దాని సానుకూల లేదా ప్రతికూల విలువను ముందుగానే నిర్ణయించకుండా నిలుపుతుంది.
- source_word: בְּגִבְעוֹן
  choice: గిబియోనులోని
  rationale: ఉన్నత స్థలం గిబియోనులో ఉందని తెలుగులో సహజంగా అనుసంధానిస్తుంది.
- source_word: וּ
  choice: ','
  rationale: హీబ్రూ సంధానాన్ని తెలుగు జాబితా నిర్మాణం ద్వారా వ్యక్తం చేసింది; మూలంలో లేని ప్రత్యేక కాలసూచక పదాన్ని చేర్చలేదు.
theological_decisions:
- issue: దైవ నామం יְהוָה అనువాదం
  choice: యాహ్వే
  alternative: ప్రభువు
  rationale: మూలపాఠం వ్యక్తిగత దైవ నామాన్ని ఉపయోగిస్తుంది; దానిని బిరుదుగా మార్చకుండా యాహ్వే అని అందించడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: בָּמָה యొక్క ఆరాధనా విలువ
  choice: ఉన్నత స్థలం
  alternative: పూజాస్థలం
  rationale: ఈ సందర్భంలో అది మోషే గుడారం ఉన్న చట్టబద్ధమైన ఆరాధనా ప్రదేశం; అయినప్పటికీ మూలపదంలోని స్థలరూపకాన్ని మరియు ఇతర సందర్భాల్లో ఉండే ఉద్రిక్తతను వ్యాఖ్యానంతో తొలగించకుండా నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘నివాస గుడారం’, ‘దహనబలి బలిపీఠం’, ‘ఉన్నత స్థలం’ వంటి పదాలు ఆరాధనా సందర్భపు ఖచ్చితత్వాన్ని కాపాడుతాయి.
