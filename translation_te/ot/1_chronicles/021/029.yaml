revisions:
- from: మోషే అరణ్యంలో చేసిన యాహ్వే నివాస గుడారం, దహనబలి బలిపీఠం ఆ సమయంలో గిబియోనులోని ఉన్నత స్థలంలో ఉన్నాయి.
  to: మోషే అరణ్యంలో చేసిన యాహ్వే నివాస గుడారమూ దహనబలి బలిపీఠమూ ఆ సమయంలో గిబియోనులోని ఉన్నత స్థలంలో ఉన్నాయి.
