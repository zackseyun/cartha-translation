source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִיד֙ אֶל הָ֣/אֱלֹהִ֔ים חָטָ֣אתִֽי מְאֹ֔ד אֲשֶׁ֥ר עָשִׂ֖יתִי אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/עַתָּ֗ה הַֽעֲבֶר נָא֙ אֶת עֲו֣וֹן עַבְדְּ/ךָ֔ כִּ֥י נִסְכַּ֖לְתִּי מְאֹֽד־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/008.yaml
  text: Then David said to God[a], “I have sinned greatly in doing this thing. But now, please take away the guilt of your servant, for I have acted very foolishly.”
translation:
  language: te
  text: 'అప్పుడు దావీదు దేవునితో ఇలా అన్నాడు: “ఈ పని చేయడం ద్వారా నేను ఘోరంగా పాపం చేశాను. ఇప్పుడు దయచేసి నీ సేవకుని అపరాధాన్ని[a] తొలగించు; ఎందుకంటే నేను చాలా మూర్ఖంగా ప్రవర్తించాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ సేవకుని దోషాన్ని తొలగించు.” హీబ్రూ పదం అపరాధం, దోషభారం, లేదా ఆ దోషం వల్ల కలిగే బాధ్యతను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-క్రమరూపం కథనాన్ని ముందుకు నడిపిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘అప్పుడు’ సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: אֶל הָאֱלֹהִים
  choice: దేవునితో
  rationale: ఇక్కడ אֱלֹהִים ఇశ్రాయేలు దేవుణ్ణి సూచిస్తుంది; తెలుగులో సంభాషణను సూచించడానికి ‘దేవునితో’ సహజమైన రూపం.
- source_word: חָטָאתִי מְאֹד
  choice: ఘోరంగా పాపం చేశాను
  rationale: מְאֹד అనే తీవ్రతను, దావీదు ఒప్పుకోలులోని నైతిక భారాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: אֲשֶׁר עָשִׂיתִי אֶת הַדָּבָר הַזֶּה
  choice: నేను ఈ పని చేసి
  rationale: పాపానికి కారణమైన నిర్దిష్ట కార్యంతో ఒప్పుకోలును నేరుగా అనుసంధానిస్తుంది; ‘ఈ పని’ హీబ్రూ הַדָּבָר הַזֶּהను సహజంగా ప్రతిబింబిస్తుంది.
- source_word: וְעַתָּה
  choice: ఇప్పుడు
  rationale: ఒప్పుకోలు నుంచి విన్నపానికి వచ్చే మలుపును స్పష్టంగా సూచిస్తుంది; హీబ్రూ సంధిని తెలుగులో తప్పనిసరిగా విరోధార్థకంగా చేయదు.
- source_word: הַעֲבֶר נָא
  choice: దయచేసి ... తొలగించు
  rationale: హిఫిల్ ఆజ్ఞారూపం తొలగించడాన్ని సూచిస్తుంది; נָאలోని వినయపూర్వక విన్నపాన్ని ‘దయచేసి’ వ్యక్తం చేస్తుంది.
- source_word: עֲוֹן
  choice: అపరాధం
  rationale: ఈ పదం దోషకార్యం, అపరాధభారం, దాని ఫలిత బాధ్యత అనే పరస్పర సంబంధిత భావాలను కలిగి ఉంటుంది. ‘అపరాధం’ తెలుగులో ఈ విస్తృతిని కొంతవరకు నిలుపుతుంది; పాదసూచిక అస్పష్టతను వివరిస్తుంది.
- source_word: עַבְדְּךָ
  choice: నీ సేవకుని
  rationale: దేవుని ఎదుట దావీదు వినయపూర్వక స్వీయసంబోధనను తెలియజేస్తుంది; ఈ సందర్భంలో ‘బానిస’ కంటే ‘సేవకుడు’ సముచితం.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: విన్నపానికి కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: נִסְכַּלְתִּי מְאֹד
  choice: నేను చాలా మూర్ఖంగా ప్రవర్తించాను
  rationale: ఇది కేవలం ఒక లక్షణాన్ని కాక మూర్ఖంగా చేసిన ప్రవర్తనను సూచిస్తుంది; ‘చాలా’ מְאֹד తీవ్రతను నిలుపుతుంది.
theological_decisions:
- issue: దావీదు విన్నపంలో עָוֹן భావం
  choice: ప్రధాన పాఠ్యంలో ‘అపరాధం’ అని అనువదించి, పాదసూచికలో దోషభారం మరియు దాని వల్ల కలిగే బాధ్యత అనే భావాలను పేర్కొనడం
  alternative: ‘దోషం’ లేదా ‘అపరాధ శిక్ష’
  rationale: హీబ్రూ పదం పాపకార్యం, దాని దోషభారం, దాని ఫలిత బాధ్యతలను సూచించగలదు. ఒక్క భావానికే పరిమితం చేయకుండా ప్రధాన పాఠ్యం మరియు పాదసూచిక కలిసి నిజమైన అర్థవిస్తృతిని నిలుపుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఒప్పుకోలు-విన్నప శైలిని ఉపయోగించాం. మూలంలోని రెండు מְאֹד పదాల తీవ్రతను వరుసగా ‘ఘోరంగా,’ ‘చాలా’ అని వ్యక్తం చేశాం; עָוֹןలోని భావ అస్పష్టతను పాదసూచికలో నిలిపాం.
