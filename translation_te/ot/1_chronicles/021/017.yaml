  revised_text: 'అప్పుడు దావీదు దేవునితో ఇలా అన్నాడు: “ప్రజలను లెక్కించమని ఆజ్ఞ ఇచ్చింది నేనే కదా? పాపం చేసినవాడిని నేనే; ఎంతో దుర్మార్గంగా ప్రవర్తించినవాడిని నేనే. అయితే ఈ గొర్రెలు[a] ఏమి చేశాయి? యెహోవా, నా దేవా, దయచేసి నీ చెయ్యి[b] నా మీదా నా తండ్రి ఇంటివారి మీదా పడనివ్వు; కానీ నీ ప్రజల మీదికి తెగులు రానివ్వకు[c].”'
