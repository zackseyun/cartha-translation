source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֣יד אֶֽל הָ/אֱלֹהִ֡ים הֲ/לֹא֩ אֲנִ֨י אָמַ֜רְתִּי לִ/מְנ֣וֹת בָּ/עָ֗ם וַ/אֲנִי ה֤וּא אֲשֶׁר חָטָ֨אתִי֙ וְ/הָרֵ֣עַ הֲרֵע֔וֹתִי וְ/אֵ֥לֶּה הַ/צֹּ֖אן מֶ֣ה עָשׂ֑וּ יְהוָ֣ה אֱלֹהַ֗/י תְּהִ֨י נָ֤א יָֽדְ/ךָ֙ בִּ֚/י וּ/בְ/בֵ֣ית אָבִ֔/י וּֽ/בְ/עַמְּ/ךָ֖ לֹ֥א לְ/מַגֵּפָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/017.yaml
  text: Then David said to God[a], “Was it not I who ordered the people to be counted? I am the one who has sinned and done great evil. But these sheep—what have they done? O Yahweh my God, please let your hand be against me and against my father’s house[d][c][b], but not against your people for a plague.”
translation:
  language: te
  text: 'అప్పుడు దావీదు దేవునితో ఇలా అన్నాడు: “ప్రజలను లెక్కించమని ఆజ్ఞ ఇచ్చింది నేనే కదా? పాపం చేసినవాడిని నేనే; ఎంతో దుర్మార్గంగా ప్రవర్తించినవాడిని నేనే. అయితే ఈ గొర్రెలు[a] ఏమి చేశాయి? యెహోవా, నా దేవా, దయచేసి నీ చెయ్యి[b] నా మీదా నా తండ్రి ఇంటివారి మీదా పడనివ్వు; కానీ నీ ప్రజల మీదికి తెగులు రానివ్వకు[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఈ గొర్రెలు”; ఇది ప్రజలను సూచించే రూపకం.
    reason: cultural_note
  - marker: b
    text: “నీ చెయ్యి” అనేది ఇక్కడ దేవుని క్రియాశీల శక్తిని, ముఖ్యంగా తీర్పును సూచించే హీబ్రూ రూపకం.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “నీ ప్రజల మీద తెగులుగా ఉండనివ్వకు.” హీబ్రూ వాక్యనిర్మాణం సంక్షిప్తంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא אֲנִי אָמַרְתִּי לִמְנוֹת בָּעָם
  choice: ప్రజలను లెక్కించమని ఆజ్ఞాపించింది నేనే కదా?
  rationale: אָמַרְתִּי అక్షరార్థంగా ‘నేను చెప్పాను’; జనగణన ప్రారంభించడానికి దావీదు ఇచ్చిన అధికారిక ఆదేశమే సందర్భార్థం. ‘నేనే కదా?’ అలంకార ప్రశ్నను, వ్యక్తిగత బాధ్యతపై నొక్కును సహజ తెలుగులో నిలుపుతుంది.
- source_word: וַאֲנִי הוּא אֲשֶׁר חָטָאתִי
  choice: పాపం చేసినవాణ్ణి నేనే
  rationale: וַאֲנִי הוּא אֲשֶׁר లోని ఉద్ఘాటనను తెలుగు వాక్యాంతంలోని ‘నేనే’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: וְהָרֵעַ הֲרֵעוֹתִי
  choice: ఎంతో దుర్మార్గంగా ప్రవర్తించినవాణ్ణి నేనే
  rationale: క్రియావిశేషక ధాతురూపం మరియు సమాపక క్రియ కలయిక తీవ్రతను సూచిస్తుంది; ‘ఎంతో’ ఆ బలాన్ని సహజంగా అందిస్తుంది, ‘ప్రవర్తించాను’ క్రియాత్మక భావాన్ని నిలుపుతుంది.
- source_word: וְאֵלֶּה הַצֹּאן
  choice: గొర్రెలవంటి వీరు
  rationale: హీబ్రూలో అక్షరార్థంగా ‘ఈ గొర్రెలు’; అది ప్రజలను సూచించే రూపకం. తెలుగులో ఉద్దేశిత మనుషులు స్పష్టంగా ఉండేలా రూపకాన్ని ఉపమాన రూపంలో నిలిపింది.
- source_word: יְהוָה אֱלֹהַי
  choice: యెహోవా, నా దేవా
  rationale: దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగు సంప్రదాయ లిప్యంతరీకరణ ‘యెహోవా’గా ఇచ్చి, ప్రత్యక్ష సంబోధనను నిలిపింది.
- source_word: תְּהִי נָא יָדְךָ בִּי וּבְבֵית אָבִי
  choice: దయచేసి నీ చెయ్యి నా మీదా నా తండ్రి ఇంటివారి మీదా ఉండనివ్వు
  rationale: ‘చెయ్యి’ అనే హీబ్రూ రూపకాన్ని పరిష్కరించకుండా ఉంచింది; సందర్భంలో అది శిక్షాత్మక శక్తిని సూచిస్తుంది. ‘తండ్రి ఇల్లు’ను సహజ తెలుగులో కుటుంబ/వంశ సమూహార్థకంగా ‘తండ్రి ఇంటివారు’ అని అందించింది.
- source_word: וּבְעַמְּךָ לֹא לְמַגֵּפָה
  choice: కానీ నీ ప్రజల మీదికి తెగులు రానివ్వకు
  rationale: 'క్లిష్టమైన హీబ్రూ నిర్మాణం ఉద్దేశించే ప్రార్థనను సహజ తెలుగులో వ్యక్తం చేస్తుంది: ప్రజలు తెగులుకు గురికాకూడదు.'
theological_decisions:
- issue: יְהוָה దైవనామ అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: మూలంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ వంటి బిరుదుతో మార్చలేదు. ఆధునిక తెలుగు బైబిలు పాఠకులకు విస్తృతంగా పరిచయమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం; ‘యాహ్వే’ మరో సముచిత లిప్యంతరీకరణ.
- issue: దావీదు బాధ్యత మరియు ప్రజల నిర్దోషిత్వం మధ్య ఉద్రిక్తత
  choice: దావీదు తన పాపాన్ని ఉద్ఘాటిస్తూ ప్రజలను గొర్రెలుగా పేర్కొనే విజ్ఞాపనను యథాతథంగా నిలిపింది
  alternative: ప్రజలు పూర్తిగా నిర్దోషులని వివరణాత్మకంగా చెప్పడం
  rationale: ‘వీరు ఏమి చేశారు?’ అనే ప్రశ్నను దాని అలంకార, విజ్ఞాపన స్వభావంతోనే ఉంచాలి; వచనం చెప్పినదానికంటే అధికమైన సిద్ధాంత నిర్ణయాన్ని అనువాదంలో చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే ప్రత్యక్ష సంభాషణ శైలి. ‘ఆజ్ఞాపించింది నేనే కదా?’ మరియు పునరుక్త ‘నేనే’ ద్వారా మూలంలోని బాధ్యతా ఉద్ఘాటన నిలిపాం. ప్రధాన పాఠంలో రూపకాలను సాధ్యమైనంతవరకు నిలిపి, అపరిచితత్వాన్ని పాదసూచికల్లో వివరించాం.
