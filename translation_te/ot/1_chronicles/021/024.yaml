revisions:
- from: అయితే రాజైన దావీదు ఓర్నానుతో, “వద్దు; నేను దాని పూర్తి వెలను వెండిగా చెల్లించి తప్పకుండా కొంటాను. నీకు చెందినదాన్ని యెహోవా కోసం తీసుకోను; నాకు ఏమీ ఖర్చు కాకుండా దహనబలి అర్పించను” అన్నాడు.
  to: అయితే రాజైన దావీదు ఓర్నానుతో, “లేదు; నేను తప్పకుండా పూర్తి వెండి ధర చెల్లించి దానిని కొంటాను. ఎందుకంటే నీకు చెందినదాన్ని యాహ్వే కోసం తీసుకోను, నాకు ఏ ఖర్చూ లేకుండా దహనబలి అర్పించను” అన్నాడు.
