id: 1CH.21.24
reference: 1 Chronicles 21:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הַ/מֶּ֤לֶךְ דָּוִיד֙ לְ/אָרְנָ֔ן לֹ֕א כִּֽי קָנֹ֥ה אֶקְנֶ֖ה בְּ/כֶ֣סֶף מָלֵ֑א כִּ֠י לֹא אֶשָּׂ֤א אֲשֶׁר לְ/ךָ֙ לַ/יהוָ֔ה וְ/הַעֲל֥וֹת עוֹלָ֖ה חִנָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/024.yaml
  text: But King David said to Ornan[a], “No, for I will surely buy it for the full price in silver, because I will not take for Yahweh what is yours[b], nor offer up a burnt offering for nothing.”
translation:
  language: te
  text: అయితే రాజైన దావీదు ఓర్నానుతో, “లేదు; నేను తప్పకుండా పూర్తి వెండి ధర చెల్లించి దానిని కొంటాను. ఎందుకంటే నీకు చెందినదాన్ని యాహ్వే కోసం తీసుకోను, నాకు ఏ ఖర్చూ లేకుండా దహనబలి అర్పించను” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא כִּי
  choice: వద్దు;
  rationale: ఈ పదబంధం దృఢమైన నిరాకరణను తెలిపి, తరువాత దానికి కారణాన్ని ఇస్తుంది. తెలుగులో ‘వద్దు’ సహజంగా ఆ నిరాకరణను వ్యక్తం చేస్తుంది; తరువాతి వాక్యాలు కారణాన్ని స్పష్టం చేస్తాయి.
- source_word: קָנֹה אֶקְנֶה
  choice: తప్పకుండా కొంటాను
  rationale: క్రియకు ముందు ఉన్న infinitive absolute కొనుగోలు చేయాలనే దృఢనిశ్చయాన్ని బలపరుస్తుంది; ‘తప్పకుండా’ ఆ ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: בְּכֶסֶף מָלֵא
  choice: దాని పూర్తి వెలను వెండిగా చెల్లించి
  rationale: ఇది కొంత మొత్తం కాకుండా సంపూర్ణ ధరను వెండిలో చెల్లించడాన్ని సూచిస్తుంది. ‘పూర్తి వెల’ మరియు ‘వెండిగా చెల్లించి’ రెండూ ధర సంపూర్ణతను, చెల్లింపు పదార్థాన్ని కాపాడుతాయి.
- source_word: אֶשָּׂא
  choice: తీసుకోను
  rationale: ఈ సందర్భంలో נשׂא అంటే ఇతరునికి చెందినదాన్ని స్వీకరించడం లేదా తనదిగా తీసుకోవడం; సాధారణమైన ‘తీసుకోను’ ఈ భావాన్ని నేరుగా అందిస్తుంది.
- source_word: אֲשֶׁר לְךָ
  choice: నీకు చెందినదాన్ని
  rationale: హీబ్రూ పదబంధంలోని స్వామ్య భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לַיהוָה
  choice: యెహోవా కోసం
  rationale: ఇక్కడ దేవునికి సమర్పించే ఉద్దేశం ఉంది. ‘కోసం’ ఆ సమర్పణ సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; יהוהను వ్యక్తిగత దైవనామంగా ‘యెహోవా’ అని లిప్యంతరీకరించాం.
- source_word: וְהַעֲלוֹת עוֹלָה
  choice: దహనబలి అర్పించను
  rationale: עֹלָה పూర్తిగా దహనం చేసే బలిని సూచించే స్థిరమైన బలిపదం; ‘దహనబలి అర్పించడం’ ఆధునిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన రూపం.
- source_word: חִנָּם
  choice: నాకు ఏమీ ఖర్చు కాకుండా
  rationale: ఈ సందర్భంలో חִנָּם ఉచితంగా లేదా మూల్యం చెల్లించకుండా అనే భావం ఇస్తుంది. దావీదు తాను ఖర్చు భరించకుండా బలి అర్పించనని సందర్భానుసారంగా స్పష్టం చేయడానికి ఈ రూపం సహజంగా ఉంటుంది.
theological_decisions:
- issue: יהוה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: ప్రభువు; యాహ్వే
  rationale: మూలపాఠంలో నాలుగు అక్షరాల వ్యక్తిగత దైవనామం నేరుగా ఉంది. దాన్ని బిరుదుగా మార్చకుండా, తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే ‘యెహోవా’ రూపంలో నిలిపాం; ‘యాహ్వే’ కూడా సాధ్యమైన లిప్యంతరీకరణ.
- issue: חִנָּם యొక్క బలి సంబంధ భావం
  choice: నాకు ఏమీ ఖర్చు కాకుండా
  alternative: ఉచితంగా; ఏ వెలా చెల్లించకుండా
  rationale: ఈ వాక్యం ఆరాధన గురించి సాధారణ సిద్ధాంతాన్ని ప్రతిపాదించడంకన్నా, ఓర్నానుకు చెందినదాన్ని చెల్లింపులేకుండా తీసుకొని బలి అర్పించేందుకు దావీదు నిరాకరించడాన్ని చెబుతుంది. అందువల్ల భావాన్ని ఆ సందర్భానికే పరిమితం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. హీబ్రూలోని దృఢ నిరాకరణ, కొనుగోలు క్రియపై ఉద్ఘాటన, పూర్తి వెండి ధర, ఇతరుని స్వాస్థ్యం, ఖర్చులేని బలి అనే అంశాలు నిలుపబడ్డాయి. ప్రచురణ పాఠ్యంలో పాదటిప్పణులు అవసరం లేకపోవడంతో గుర్తులు చేర్చలేదు.
