source:
  edition: WLC
  text: וַ/יֵּ֨רַע֙ בְּ/עֵינֵ֣י הָ/אֱלֹהִ֔ים עַל הַ/דָּבָ֖ר הַ/זֶּ֑ה וַ/יַּ֖ךְ אֶת יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/007.yaml
  text: But this matter was evil in the sight of God[a], so he struck Israel.
translation:
  language: te
  text: అయితే ఈ విషయం దేవుని దృష్టికి చెడ్డదిగా అనిపించింది[a]; అందుచేత ఆయన ఇశ్రాయేలును దెబ్బతీశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని కళ్లకు చెడ్డదిగా కనిపించింది.’ హీబ్రూలో అక్షరార్థంగా, ‘దేవుని కళ్లలో చెడ్డదిగా ఉంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע
  choice: చెడ్డదిగా ఉంది
  rationale: ఈ క్రియ ఇక్కడ కేవలం అసంతృప్తిని కాక, దేవుని దృష్టిలో ప్రతికూలమైన లేదా నైతికంగా చెడ్డ మూల్యాంకనాన్ని సూచిస్తుంది. ‘చెడ్డదిగా ఉంది’ అనే రూపం ఆ బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: בְּעֵינֵי הָאֱלֹהִים
  choice: దేవుని దృష్టిలో
  rationale: హీబ్రూ నుడికారానికి అక్షరార్థం ‘దేవుని కళ్లలో.’ ‘దేవుని దృష్టిలో’ అనేది మూలంలోని మూల్యాంకన దృక్కోణాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: הָאֱלֹהִים
  choice: దేవుడు
  rationale: మూలపాఠంలో יהוה అనే దైవనామం కాక הָאֱלֹהִים ఉంది; అందువల్ల ‘ప్రభువు’ అని కాక ‘దేవుడు’ అని అనువదించబడింది.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: ఈ విషయం
  rationale: דבר అనే పదానికి విషయం, సంగతి, కార్యం వంటి విస్తృత అర్థాలున్నాయి. ఇక్కడ ‘ఈ విషయం’ సందర్భాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా సహజంగా సూచిస్తుంది.
- source_word: וַיַּךְ
  choice: దెబ్బతీశాడు
  rationale: נכה యొక్క ప్రాథమిక భావం ‘కొట్టు/దెబ్బతీయు.’ ‘దెబ్బతీశాడు’ తీర్పు తీవ్రతను నిలుపుతుంది; ఈ వచనం మాత్రమే స్పష్టంగా చెప్పని మరణార్థాన్ని ‘హతమార్చాడు’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును
  rationale: ప్రత్యక్ష కర్మ దేశమైన ఇశ్రాయేలు. మూలంలో లేని ‘ఇశ్రాయేలు ప్రజలను’ అనే విస్తరణ అవసరం లేదు.
- source_word: וַ ... וַ
  choice: అయితే ... అందుచేత
  rationale: మొదటి సంధి ముందరి కథనంతో స్వల్ప వ్యత్యాసాన్ని, రెండవది దేవుని మూల్యాంకనానంతర ఫలితాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తాయి.
theological_decisions:
- issue: దావీదు చేసిన జనగణనపై దేవుని మూల్యాంకనం మరియు అనంతర తీర్పు
  choice: ఆ విషయం దేవుని దృష్టిలో చెడ్డదని, అందుచేత ఆయన ఇశ్రాయేలును దెబ్బతీశాడని వచనం నేరుగా చెప్పే విధంగా అనువదించడం.
  alternative: దానిని కేవలం దేవునికి నచ్చని విషయంగా మృదువుగా చెప్పడం, లేదా ఇశ్రాయేలుపై వచ్చిన దెబ్బను న్యాయతీర్పు కానట్లుగా సడలించడం.
  rationale: హీబ్రూ బలమైన ప్రతికూల మూల్యాంకనాన్ని, దాని తరువాత దేవుని ప్రత్యక్ష చర్యను పేర్కొంటుంది. దావీదు చర్య తీర్పు పొందగా ఇశ్రాయేలు దెబ్బను భరించే కథనపరమైన ఉద్రిక్తతను అనువాదం పరిష్కరించకుండా యథాతథంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన గ్రంథశైలిలో. ‘దృష్టిలో’ అనే సహజ నుడికారంతో మూలంలోని ‘కళ్లలో’ అనే రూపకాన్ని వ్యక్తం చేశాం; అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
