id: 1CH.21.2
reference: 1 Chronicles 21:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֤יד אֶל יוֹאָב֙ וְ/אֶל שָׂרֵ֣י הָ/עָ֔ם לְכ֗וּ סִפְרוּ֙ אֶת יִשְׂרָאֵ֔ל מִ/בְּאֵ֥ר שֶׁ֖בַע וְ/עַד דָּ֑ן וְ/הָבִ֣יאוּ אֵלַ֔/י וְ/אֵדְעָ֖ה אֶת מִסְפָּרָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/002.yaml
  text: Then David said to Joab and to the commanders of the people[a], “Go, count Israel from Beersheba to Dan, and bring it to me, so that I may know their number.”
translation:
  language: te
  text: అప్పుడు దావీదు యోవాబుతోను ప్రజల అధిపతులతోను, “మీరు వెళ్లి బెయేర్షెబా మొదలుకొని దాను వరకు[a] ఇశ్రాయేలును లెక్కించండి. వారి సంఖ్య నాకు తెలిసేలా ఆ లెక్కను నా దగ్గరకు తీసుకురండి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “బెయేర్షెబా మొదలుకొని దాను వరకు” అనేది ఇశ్రాయేలు దేశపు ఒక అంచు నుంచి మరొక అంచు వరకు అని సూచించే హీబ్రూ నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: అప్పుడు ... అన్నాడు
  rationale: వావ్-కన్సెక్యూటివ్ కథనాన్ని ముందుకు నడిపిస్తుంది; ‘అప్పుడు’ దాని క్రమానుసార భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: שָׂרֵי הָעָם
  choice: ప్రజల అధిపతులు
  rationale: שָׂרִים అనే పదానికి అధికారులు, నాయకులు, సైనికాధికారులు అనే భావాలు ఉండవచ్చు. యోవాబు మరియు జనగణన సందర్భంలో ‘అధిపతులు’ పరిపాలనా-సైనిక భావాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: לְכוּ
  choice: మీరు వెళ్లి
  rationale: బహువచన ఆజ్ఞను సహజమైన తెలుగు వాక్య నిర్మాణంలో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: סִפְרוּ
  choice: లెక్కించండి
  rationale: ఇక్కడ ספר అంటే వ్యక్తులను లెక్కపెట్టడం లేదా సంఖ్య నిర్ధారించడం; ‘లెక్కించండి’ నేరుగా, సహజంగా ఉంది.
- source_word: אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును
  rationale: మూలంలోని సమష్టివాచకమైన ‘ఇశ్రాయేలు’ను విస్తరించి వ్యాఖ్యానించకుండా అలాగే ఉంచుతుంది.
- source_word: מִבְּאֵר שֶׁבַע וְעַד דָּן
  choice: బెయేర్షెబా మొదలుకొని దాను వరకు
  rationale: దేశపు దక్షిణ అంచు నుంచి ఉత్తర అంచు వరకు అన్న భౌగోళిక నుడికారాన్ని స్థలనామాలతోనే నిలుపుతుంది.
- source_word: וְהָבִיאוּ אֵלַי
  choice: ఆ లెక్కను నా దగ్గరకు తీసుకురండి
  rationale: హీబ్రూలో కర్మ స్పష్టంగా చెప్పబడలేదు. తెలుగులో అవసరమైన సూచనార్థక కర్మగా ‘ఆ లెక్కను’ వాడటం సందర్భంలోని జనగణన ఫలితాన్ని సహజంగా సూచిస్తుంది; ‘మొత్తం’ అని మరింత నిర్దిష్టం చేయదు.
- source_word: וְאֵדְעָה אֶת מִסְפָּרָם
  choice: వారి సంఖ్య నాకు తెలిసేలా
  rationale: కోహోర్టేటివ్‌లోని ఉద్దేశ్య భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, ‘వారి సంఖ్య’ అనే మూలపదబంధాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. ఆజ్ఞ బహువచనాన్ని ‘మీరు’తో స్పష్టం చేశాం; స్థలనామాలను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
