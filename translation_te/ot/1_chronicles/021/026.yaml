  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יִּבֶן֩ שָׁ֨ם דָּוִ֤יד מִזְבֵּ֨חַ֙ לַ/יהוָ֔ה וַ/יַּ֥עַל עֹל֖וֹת וּ/שְׁלָמִ֑ים וַ/יִּקְרָא֙ אֶל יְהוָ֔ה וַ/יַּֽעֲנֵ֤/הוּ בָ/אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם עַ֖ל מִזְבַּ֥ח הָ/עֹלָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/026.yaml
  text: There David built an altar to Yahweh and offered up burnt offerings and peace offerings. He called on Yahweh[a], and he answered him with fire from heaven on the altar of burnt offering.
translation:
  language: te
  text: అక్కడ దావీదు యెహోవాకు ఒక బలిపీఠం కట్టి, దహనబలులను, సమాధాన బలులను[a] అర్పించాడు. అతడు యెహోవాకు మొరపెట్టగా, యెహోవా ఆకాశం నుండి అగ్నితో దహనబలి బలిపీఠం మీద అతనికి జవాబిచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సమాధాన బలులు” అని అనువదించిన పదాన్ని “సహవాస బలులు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן שָׁם דָּוִיד מִזְבֵּחַ
  choice: అక్కడ దావీదు ఒక బలిపీఠం కట్టి
  rationale: హీబ్రూ కథనంలోని స్థల సూచనను, నిర్మాణ క్రియను సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: לַיהוָה
  choice: యెహోవాకు
  rationale: మూలంలోని దైవనామాన్ని వ్యక్తిగత నామంగా ప్రతిబింబిస్తూ, לְ సూచించే అంకిత దిశను ‘కు’తో తెలియజేస్తుంది.
- source_word: וַיַּעַל עֹלוֹת
  choice: దహనబలులను అర్పించాడు
  rationale: עֹלָה అనే పూర్తిగా దహించబడే బలి వర్గానికి తెలుగులో స్థిరమైన, స్పష్టమైన పదప్రయోగం.
- source_word: וּשְׁלָמִים
  choice: సమాధాన బలులను
  rationale: שְׁלָמִים పదంలోని శాంతి/సమగ్రత భావాన్ని నిలుపుతూ, గుర్తించదగిన సంప్రదాయ బలి పదాన్ని ఉపయోగిస్తుంది; సహవాస బలులు అనే అర్థసంభావ్యతను పాదసూచికలో ఇస్తుంది.
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: అతడు యెహోవాకు మొరపెట్టగా
  rationale: ఈ ప్రార్థనా సందర్భంలో ‘పిలిచాడు’ కంటే దేవుని సహాయం కోరడాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: וַיַּעֲנֵהוּ בָאֵשׁ מִן הַשָּׁמַיִם
  choice: యెహోవా ఆకాశం నుండి ... అగ్ని పంపి అతనికి జవాబిచ్చాడు
  rationale: హీబ్రూలో కర్త సందర్భం ద్వారా తెలిసినా, తెలుగులో స్పష్టత కోసం ‘యెహోవా’ను పునరుద్ఘాటించింది. בָאֵשׁ యొక్క సాధనార్థాన్ని సహజంగా తెలియజేయడానికి ‘అగ్ని పంపి’ అని అనువదించింది.
- source_word: עַל מִזְבַּח הָעֹלָה
  choice: దహనబలి పీఠం మీదికి
  rationale: అగ్ని దిగివచ్చిన గమ్యాన్ని עַל సూచిస్తుంది; ‘దహనబలి పీఠం’ బలిపీఠపు సంబంధాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: ప్రభువు
  rationale: మూలపాఠంలో ఉన్న ప్రత్యేక దైవనామాన్ని బిరుదుతో భర్తీ చేయకుండా తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంతో అందిస్తుంది.
- issue: అగ్నితో వచ్చిన దైవిక జవాబు
  choice: యెహోవా ఆకాశం నుండి అగ్ని పంపి జవాబిచ్చాడు
  alternative: అగ్ని ద్వారా అతనికి జవాబిచ్చాడు
  rationale: సంఘటనను కథనం చెప్పిన మేరకే ఉంచుతూ, అగ్ని బలిపీఠం మీదికి వచ్చిన దిశను సహజ తెలుగులో స్పష్టం చేస్తుంది; అదనపు ప్రతీకాత్మక వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. బలి సంబంధిత సాంకేతిక పదాలను పాఠకులకు పరిచితమైన రూపాల్లో ఉంచి, అవసరమైన పదార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
