  text: וַ/יִּשְׁלַח֩ הָ/אֱלֹהִ֨ים מַלְאָ֥ךְ לִֽ/ירוּשָׁלִַם֮ לְ/הַשְׁחִיתָ/הּ֒ וּ/כְ/הַשְׁחִ֗ית רָאָ֤ה יְהוָה֙ וַ/יִּנָּ֣חֶם עַל הָֽ/רָעָ֔ה וַ/יֹּ֨אמֶר לַ/מַּלְאָ֤ךְ הַ/מַּשְׁחִית֙ רַ֔ב עַתָּ֖ה הֶ֣רֶף יָדֶ֑/ךָ וּ/מַלְאַ֤ךְ יְהוָה֙ עֹמֵ֔ד עִם גֹּ֖רֶן אָרְנָ֥ן הַ/יְבוּסִֽי׀׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/015.yaml
  text: And God sent an angel to Jerusalem to destroy it[a], but as he was destroying it, Yahweh saw and relented concerning the calamity, and he said to the destroying angel, “Enough[b]; now withdraw your hand.” And the angel of Yahweh was standing by the threshing floor of Ornan the Jebusite.
translation:
  language: te
  text: దేవుడు యెరూషలేమును నాశనం చేయడానికి అక్కడికి ఒక దేవదూతను పంపాడు. అతడు దానిని నాశనం చేస్తుండగా, యెహోవా చూసి ఆ విపత్తు విషయంలో వెనక్కి తగ్గాడు[a]. నాశనం చేస్తున్న దేవదూతతో, “చాలు! ఇప్పుడు నీ చెయ్యి వెనక్కి తీసుకో[b]” అన్నాడు. మరియు యెహోవా దూత యెబూసీయుడైన ఓర్నాను కళ్లం వద్ద నిలబడి ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ విపత్తు విషయంలో తన మనసు మార్చుకున్నాడు.” ఇక్కడి హీబ్రూ పదబంధం దేవుడు విధ్వంసక తీర్పును కొనసాగించకుండా విరమించడాన్ని సూచిస్తుంది; “విపత్తు” ఇక్కడ నైతిక చెడును కాదు.
    reason: theological_ambiguity
  - marker: b
    text: హీబ్రూలో అక్షరార్థంగా, “నీ చెయ్యిని సడలించు.” అంటే, చేస్తున్న విధ్వంసక చర్యను నిలిపివేయి.
    reason: idiom
lexical_decisions:
- source_word: הָאֱלֹהִים
  choice: దేవుడు
  rationale: నిర్దిష్ట ఉపపదంతోను ఏకవచన క్రియాసందర్భంలోను ఇది ఇశ్రాయేలు దేవుణ్ణే సూచిస్తుంది.
- source_word: מַלְאָךְ
  choice: దూత
  rationale: తెలుగులో ‘దూత’ అనేది సందేశవాహకుడు అనే మూలభావాన్ని ఉంచుతూ, ఈ సందర్భంలో పరలోక సంబంధమైన వ్యక్తిని సహజంగా సూచిస్తుంది.
- source_word: לִירוּשָׁלִַם לְהַשְׁחִיתָהּ
  choice: యెరూషలేమును నాశనం చేయడానికి ... అక్కడికి
  rationale: లామెద్ సూచించే గమ్యాన్ని ‘అక్కడికి’తోను, శత్రుత్వ ఉద్దేశాన్ని ‘నాశనం చేయడానికి’తోను సహజమైన తెలుగు వాక్యక్రమంలో వ్యక్తం చేసింది.
- source_word: וּכְהַשְׁחִית
  choice: అతడు దానిని నాశనం చేస్తుండగా
  rationale: సమకాలీనంగా సాగుతున్న చర్యను, అది మధ్యలో ఆపబడిన భావాన్ని అస్పష్టత లేకుండా ఉంచుతుంది.
- source_word: וַיִּנָּחֶם עַל הָרָעָה
  choice: ఆ విపత్తు విషయంలో వెనక్కి తగ్గాడు
  rationale: נחם లోని చర్యను నిలిపివేయాలనే ప్రతిస్పందనను సహజంగా తెలియజేస్తూ, దేవుని స్పందన గురించిన వచనంలోని ఉద్వేగాన్ని తొలగించదు; רעה ఇక్కడ నైతిక చెడు కాదు, విధ్వంసక తీర్పు.
- source_word: הַמַּלְאָךְ הַמַּשְׁחִית
  choice: నాశనం చేస్తున్న దూత
  rationale: కృదంతంలోని కొనసాగుతున్న క్రియాశీల భావాన్ని తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: רַב
  choice: చాలు!
  rationale: ఈ సందర్భంలోని సంక్షిప్త ఆజ్ఞాత్మక ఉద్గారానికి సహజమైన సమానం.
- source_word: הֶרֶף יָדֶךָ
  choice: నీ చెయ్యి వెనక్కి తీసుకో
  rationale: చేతితో చేస్తున్న చర్యను ఆపమనే హీబ్రూ నుడికారాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: מַלְאַךְ יְהוָה
  choice: యెహోవా దూత
  rationale: మూలంలోని సంబంధపదబంధాన్ని నేరుగా అనువదిస్తూ ఆ దూత స్వరూపంపై అదనపు సిద్ధాంత నిర్ణయం చేయదు.
- source_word: גֹּרֶן אָרְנָן הַיְבוּסִי
  choice: యెబూసీయుడైన ఓర్నాను కళ్లం
  rationale: గోధుమలు మొదలైన ధాన్యాన్ని నూర్చే స్థలానికి సహజమైన తెలుగు పదం ‘కళ్లం’; వ్యక్తి, జాతి గుర్తింపులను మూలానుసారంగా ఉంచింది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన నామరూపాన్ని వాడుతూ, మూలంలోని ప్రత్యేక దైవనామాన్ని ‘ప్రభువు’గా మార్చకుండా నిలిపింది.
- issue: וַיִּנָּחֶם లో దేవుని ప్రతిస్పందన
  choice: వెనక్కి తగ్గాడు
  alternative: మనస్సు మార్చుకున్నాడు / విచారించాడు
  rationale: దేవుడు విపత్తును కొనసాగించకుండా ఆపిన కథనార్థాన్ని వ్యక్తం చేస్తుంది; అదే సమయంలో దేవుని స్పందనను తాత్త్వికంగా సమసిపోనివ్వదు.
- issue: מַלְאַךְ יְהוָה యొక్క గుర్తింపు
  choice: యెహోవా దూత
  alternative: యెహోవాయే దూతరూపంలో / సృష్టించబడిన దేవదూత
  rationale: ఈ వ్యక్తి స్వరూపంపై వచనం స్పష్టంగా నిర్ణయించనందున సంబంధపదబంధాన్ని యథాతథంగా ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలి. ‘చెయ్యి’ సాధారణ ఆధునిక రూపం; ‘కళ్లం’ వ్యవసాయ సందర్భానికి సహజమైన పదం. దైవనామం వ్యక్తినామంగా ఉంచబడింది; దేవదూత స్వరూపం, దేవుని స్పందన వంటి తాత్త్విక ప్రశ్నలు అనువాదంలో పరిష్కరించబడలేదు.
