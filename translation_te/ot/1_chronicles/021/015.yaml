  to: దేవుడు యెరూషలేమును నాశనం చేయడానికి అక్కడికి ఒక దేవదూతను పంపాడు. అతడు దానిని నాశనం చేస్తుండగా, యెహోవా చూసి ఆ విపత్తు విషయంలో వెనక్కి తగ్గాడు[a]. నాశనం చేస్తున్న దేవదూతతో, “చాలు! ఇప్పుడు నీ చెయ్యి వెనక్కి తీసుకో[b]” అన్నాడు. మరియు యెహోవా దూత యెబూసీయుడైన ఓర్నాను కళ్లం వద్ద నిలబడి ఉన్నాడు.
