id: 1CH.21.9
reference: 1 Chronicles 21:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל גָּ֔ד חֹזֵ֥ה דָוִ֖יד לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/009.yaml
  text: And Yahweh spoke to Gad[a], David’s seer, saying,
translation:
  language: te
  text: 'యాహ్వే[a] దావీదు దర్శియైన గాదుతో ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ: יהוה (YHWH); సంప్రదాయంగా ‘యెహోవా’ అని కూడా పలుకుతారు.'
    reason: దైవనామపు హీబ్రూ రూపం మరియు సంప్రదాయ ప్రత్యామ్నాయ ఉచ్చారణను తెలియజేయడం.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: చెప్పాడు
  rationale: కథనాన్ని ముందుకు నడిపించే ఈ క్రియను తెలుగులో సహజంగా ‘చెప్పాడు’ అని అనువదించాం; తరువాతి לֵאמֹר సూత్రంతో కలిసి ఇది రాబోయే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది.
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దైవనామమైన יהוהను బిరుదుతో భర్తీ చేయకుండా, దాని సాధారణ పండితప్రచలిత ఉచ్చారణను తెలుగులో లిప్యంతరీకరించాం.
- source_word: גָּד
  choice: గాదు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: חֹזֵה
  choice: దర్శి
  rationale: దర్శనం ద్వారా దేవుని సందేశం పొందే వ్యక్తిని సూచించే חֹזֶהకు ‘దర్శి’ నేరమైన, సంక్షిప్తమైన సమానం; విస్తృతార్థమున్న ‘ప్రవక్త’తో దీనిని కలపలేదు.
- source_word: דָוִיד
  choice: దావీదు
  rationale: హీబ్రూ వ్యక్తినామాన్ని స్థిరపడిన తెలుగు రూపంలో ఇచ్చాం.
- source_word: לֵאמֹר
  choice: ఇలా
  rationale: తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే హీబ్రూ సూత్రాన్ని తెలుగులో సహజమైన ‘ఇలా చెప్పాడు:’ నిర్మాణంతో వ్యక్తం చేశాం.
theological_decisions:
- issue: దైవనామం יהוהను అనువదించడం
  choice: యాహ్వే
  alternative: యెహోవా; ప్రభువు
  rationale: మూలపాఠంలో వ్యక్తిగత దైవనామమే ఉంది. అందువల్ల దానిని ‘ప్రభువు’ అనే బిరుదుతో భర్తీ చేయకుండా ‘యాహ్వే’గా లిప్యంతరీకరించాం; ‘యెహోవా’ సంప్రదాయ ప్రత్యామ్నాయ రూపం.
- issue: חֹזֵה అనే పదవిని వ్యక్తం చేయడం
  choice: దర్శి
  alternative: ప్రవక్త
  rationale: ఈ పదం దర్శన సంబంధమైన ప్రత్యేక భావాన్ని కలిగి ఉంది. ‘ప్రవక్త’ అనేది సాధ్యమైన విస్తృత వివరణ అయినా, మూలంలోని పదభేదాన్ని కాపాడేందుకు ‘దర్శి’ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడాం. ‘దావీదు దర్శియైన గాదు’ అనే సంబంధాన్ని స్పష్టంగా ఉంచి, తరువాతి వచనంలోని ప్రత్యక్ష వాక్యానికి మార్గం చూపేందుకు చివరలో ద్విబిందువు పెట్టాం.
