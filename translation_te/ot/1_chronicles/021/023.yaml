  to: 'ఒర్నాను దావీదుతో ఇలా అన్నాడు: “దాన్ని మీ కోసం తీసుకోండి. నా ప్రభువైన రాజు తనకు మంచిగా అనిపించినదాన్ని చేయవచ్చు.[a] ఇదిగో, దహనబలుల కోసం పశువులను[b], కట్టెలుగా వాడడానికి నూర్పిడి బండ్లను[c], ధాన్యార్పణ కోసం గోధుమలను[d] ఇచ్చాను. అన్నీ ఇచ్చాను.”'
  rationale: వచనంలోని ఒకే సురక్షితమైన సవరణ ఏమిటంటే, రాజు చేయవలసిన కర్తవ్యంలా వినిపించే “చేయాలి”ని, ఓర్నాను ఇచ్చే అనుమతి/ఆహ్వానాన్ని తెలిపే “చేయవచ్చు”గా మార్చడం. దీనితో హీబ్రూ నుడికారపు అక్షరరూపాన్ని పాదటిప్పణిలో కాపాడుతూ ప్రధాన పాఠం ఆధునిక తెలుగులో సహజంగా ఉంటుంది. ఇతర పదాలు మరియు అన్ని పాదటిప్పణి గుర్తులు నిలుపబడ్డాయి.
