source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אָרְנָ֤ן אֶל דָּוִיד֙ קַֽח לָ֔/ךְ וְ/יַ֛עַשׂ אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ הַ/טּ֣וֹב בְּ/עֵינָ֑י/ו רְאֵה֩ נָתַ֨תִּי הַ/בָּקָ֜ר לָֽ/עֹל֗וֹת וְ/הַ/מּוֹרִגִּ֧ים לָ/עֵצִ֛ים וְ/הַ/חִטִּ֥ים לַ/מִּנְחָ֖ה הַ/כֹּ֥ל נָתָֽתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/023.yaml
  text: And Ornan said to David, “Take it for yourself, and let my lord the king do what is good in his eyes. See, I have given the cattle for burnt offerings, the threshing sledges for wood, and the wheat for the grain offering. I have given it all.”
translation:
  language: te
  text: 'ఒర్నాను దావీదుతో ఇలా అన్నాడు: “దాన్ని మీ కోసం తీసుకోండి. నా ప్రభువైన రాజు తనకు మంచిగా అనిపించినదాన్ని చేయవచ్చు.[a] ఇదిగో, దహనబలుల కోసం పశువులను[b], కట్టెలుగా వాడడానికి నూర్పిడి బండ్లను[c], ధాన్యార్పణ కోసం గోధుమలను[d] ఇచ్చాను. అన్నీ ఇచ్చాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నా ప్రభువైన రాజు తన కళ్లలో మంచిదైనదాన్ని చేయాలి.” లేదా, “నా ప్రభువైన రాజు తనకు మంచిదనిపించినది చేయవచ్చు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఎద్దులను.” హీబ్రూ పదం సాధారణంగా పశువులను లేదా మరింత నిర్దిష్టంగా ఎద్దులను సూచించగలదు.
    reason: lexical_alternative
  - marker: c
    text: అంటే, ఈ నూర్పిడి పనిముట్లను బలికి ఇంధనంగా వాడేందుకు ఇస్తున్నాడు.
    reason: cultural_note
  - marker: d
    text: లేదా, “అర్పణ కోసం.” బలి సందర్భాల్లో ఈ హీబ్రూ పదం సాధారణంగా ధాన్యార్పణను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לָךְ
  choice: దాన్ని మీ కోసం తీసుకోండి
  rationale: లָךְలోని వ్యక్తిగత స్వీకరణ భావాన్ని సహజమైన గౌరవార్థక తెలుగులో నిలుపుతుంది.
- source_word: וְיַעַשׂ אֲדֹנִי הַמֶּלֶךְ הַטּוֹב בְּעֵינָיו
  choice: నా ప్రభువైన రాజు తన దృష్టికి మంచిదైనదాన్ని చేయాలి
  rationale: రాజు తన నిర్ణయం ప్రకారం చేయవచ్చనే అనుమతి/ఆహ్వాన భావంతో పాటు, ‘అతని కళ్లలో మంచిది’ అనే హీబ్రూ నుడికారపు రూపాన్ని కూడా కొంతవరకు నిలుపుతుంది.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: నా ప్రభువైన రాజు
  rationale: ఇక్కడ ఇది దేవునికి సంబంధించిన బిరుదు కాదు; దావీదును ఉద్దేశించిన రాజసభ గౌరవ సంబోధన.
- source_word: רְאֵה
  choice: ఇదిగో
  rationale: తరువాత చెప్పబోయే సమర్పణ వివరాలపై దృష్టి పెట్టించే ఉద్ఘాటనను సహజమైన కథన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: הַבָּקָר לָעֹלוֹת
  choice: దహనబలుల కోసం పశువులను
  rationale: בקר అనేది పశువులు లేదా మరింత నిర్దిష్టంగా ఎద్దులను సూచించగల సమూహవాచకం; ప్రధాన పాఠంలో విస్తృతార్థాన్ని ఉంచి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: הַמּוֹרִגִּים לָעֵצִים
  choice: కట్టెలుగా వాడడానికి నూర్పిడి బండ్లను
  rationale: מורגים అనే ప్రాచీన నూర్పిడి పనిముట్లను స్పష్టంగా సూచిస్తూ, అవి బలికి ఇంధనంగా ఉపయోగించబడతాయనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: הַחִטִּים לַמִּנְחָה
  choice: ధాన్యార్పణ కోసం గోధుమలను
  rationale: బలి సందర్భంలో מנחה సాధారణంగా ధాన్యార్పణను సూచిస్తుంది; దానికి కావలసిన పదార్థంగా గోధుమలను అక్షరార్థంగా నిలిపాం.
- source_word: הַכֹּל נָתָתִּי
  choice: అన్నీ ఇచ్చాను
  rationale: పూర్తి సమర్పణను సంగ్రహించే హీబ్రూ పర్ఫెక్ట్ భావాన్ని సంక్షిప్తమైన సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవార్థక సంభాషణను ఉపయోగించాం. రాజసభ గౌరవాన్ని నిలుపుతూ పురాతన లేదా అసహజ పదప్రయోగాన్ని తగ్గించాం; హీబ్రూ నుడికారాన్ని ప్రధాన పాఠంలో కొంత పారదర్శకంగా ఉంచి సహజ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
