    rationale: హీబ్రూ వాక్యరూపం ఇక్కడ ఓర్నాను రాజుకు తన ఇష్టానుసారం చర్య తీసుకునేందుకు అనుమతించే/ఆహ్వానించే భావాన్ని ఇస్తుంది; రాజు తప్పక చేయవలసిందే అనే భావాన్ని కాదు. అలాగే “తన దృష్టికి మంచిది” ఆధునిక తెలుగులో అసహజంగా ఉంది. ప్రధాన పాఠంలో సహజ నుడికారాన్ని వాడి, అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచడం ఉత్తమం.
