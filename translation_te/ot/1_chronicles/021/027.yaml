source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ לַ/מַּלְאָ֔ךְ וַ/יָּ֥שֶׁב חַרְבּ֖/וֹ אֶל נְדָנָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/027.yaml
  text: And Yahweh spoke to the angel[b][a], and he returned his sword to its sheath.
translation:
  language: te
  text: యాహ్వే దూతను ఉద్దేశించి పలికాడు[a]; అతడు తన ఖడ్గాన్ని దాని ఒరలో తిరిగి పెట్టాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యాహ్వే దూతతో అన్నాడు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతడు తన ఖడ్గాన్ని దాని ఒరలోకి తిరిగి పెట్టాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: యాహ్వే
  rationale: దేవుని వ్యక్తిగత నామమైన చతురక్షర నామాన్ని బిరుదుతో భర్తీ చేయకుండా, ఆధునిక తెలుగులో దాని ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וַיֹּאמֶר
  choice: మాట్లాడాడు
  rationale: אמר యొక్క ప్రాథమిక భావం ‘అను/చెప్పు.’ ఇక్కడ పలికిన మాటలు ఇవ్వబడనందున, దూతను ఉద్దేశించి పలికాడనే భావాన్ని సహజమైన తెలుగులో ‘దూతతో మాట్లాడాడు’ అని ఇచ్చాం; ‘ఆజ్ఞాపించాడు’ అని సందర్భార్థాన్ని మూలపాఠంలోకే చేర్చలేదు.
- source_word: לַמַּלְאָךְ
  choice: దూతతో
  rationale: מלאך అంటే ‘వార్తాహరుడు’ లేదా ‘దూత.’ ఖడ్గం పట్టుకున్న పరలోక జీవి గురించిన ఈ సందర్భంలో ‘దూత’ సరైన భావం.
- source_word: וַיָּשֶׁב
  choice: తిరిగి పెట్టాడు
  rationale: שוב హిఫీల్ రూపం ‘తిరిగి వెళ్లేలా చేయు/తిరిగి చేర్చు’ అనే భావమిస్తుంది. ఖడ్గాన్ని ఒరలో ఉంచడాన్ని తెలుగులో సహజంగా ‘తిరిగి పెట్టాడు’ అని చెప్పవచ్చు.
- source_word: חַרְבּוֹ
  choice: తన ఖడ్గాన్ని
  rationale: ప్రత్యయంతో కూడిన ఈ రూపం ‘అతని ఖడ్గం’ అని అర్థం. కర్తకే చెందినదని సహజంగా తెలుపడానికి ‘తన ఖడ్గాన్ని’ వాడాం.
- source_word: אֶל נְדָנָהּ
  choice: దాని ఒరలో
  rationale: נְדָן ఖడ్గాన్ని ఉంచే ‘ఒర.’ אֶל ఇక్కడ గమ్యాన్ని సూచిస్తుంది; ఖడ్గం ఒర లోపలికి చేరిన భావాన్ని తెలుగులో ‘ఒరలో’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: וַיָּשֶׁב (‘తిరిగి పెట్టాడు’) అనే క్రియకు కర్త ఎవరు?
  choice: వెంటనే ముందు ప్రస్తావించిన దూతనే సూచించేలా ‘అతడు’ అనే సర్వనామాన్ని ఉంచాం.
  alternative: యాహ్వే స్వయంగా ఖడ్గాన్ని తిరిగి చేర్చాడని వ్యాకరణ కర్తను యాహ్వేగా గ్రహించడం.
  rationale: కథన సందర్భంలో యాహ్వే పలికిన మాటకు స్పందనగా దూత తన ఖడ్గాన్ని ఒరలో పెట్టడం బలమైన పఠనం. అయినా మూలపాఠంలో కర్త పేరు మళ్లీ చెప్పబడలేదు; అందువల్ల ‘దూత’ అని స్పష్టీకరించకుండా ‘అతడు’ అనే సర్వనామంతో మూలంలోని సూచనాత్మకతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘యాహ్వే’ ద్వారా దైవనామం నిలుపబడింది; ‘ఖడ్గం,’ ‘ఒర’ వంటి సాధారణంగా అర్థమయ్యే పదాలు ఎంచుకోబడ్డాయి. మూలంలోని సర్వనామ సూచనను అతిగా స్పష్టీకరించలేదు.
