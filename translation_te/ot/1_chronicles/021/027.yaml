revisions:
- from: యాహ్వే దూతతో మాట్లాడాడు[a]. అప్పుడు అతడు తన ఖడ్గాన్ని దాని ఒరలో తిరిగి పెట్టాడు[b].
  to: యాహ్వే దూతను ఉద్దేశించి పలికాడు[a]; అతడు తన ఖడ్గాన్ని దాని ఒరలో తిరిగి పెట్టాడు[b].
  rationale: The revision makes the Hebrew addressee relation explicit in the main text while retaining a concise narrative style and the source’s implicit subject for the second clause. The second footnote is adjusted to idiomatic Telugu while preserving the ‘put back ... into its sheath’ alternative. The first footnote preserves the lexical ‘said’ alternative; its compact form is acceptable as a footnote gloss.
