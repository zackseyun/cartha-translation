source:
  edition: WLC
  text: וַ/יַּֽעֲמֹ֥ד שָׂטָ֖ן עַל יִשְׂרָאֵ֑ל וַ/יָּ֨סֶת֙ אֶת דָּוִ֔יד לִ/מְנ֖וֹת אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/001.yaml
  text: Then Satan stood up against Israel and incited David to count Israel[a][b].
translation:
  language: te
  text: అప్పుడు సాతాను[a] ఇశ్రాయేలుకు విరోధంగా నిలబడి, ఇశ్రాయేలును లెక్కించడానికి దావీదును ప్రేరేపించాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక విరోధి.’ హెబ్రీ పదమైన ‘సాతాన్’కు ‘విరోధి’ అనే అర్థం ఉండవచ్చు; లేదా అది ‘సాతాను’ అనే వ్యక్తిగత పేరు లేదా బిరుదుగా పనిచేయవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 2 సమూయేలు 24:1లో ఇశ్రాయేలుకు విరోధంగా యెహోవా కోపం రగులుకొని దావీదు ప్రేరేపించబడినట్లు చెప్పబడింది. దినవృత్తాంతాలు సాతానును నేరుగా ప్రేరేపించినవానిగా చూపుతున్నాయి; రెండు వర్ణనల్లో ఒకదానిని మరొకదానిలో కలిపివేయకుండా వాటి మధ్యనున్న ధార్మిక ఉద్రిక్తతను ఇక్కడ నిలిపి ఉంచాం.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: లేచి
  rationale: עמד అనే క్రియకు ప్రాథమికంగా ‘నిలుచు’ అనే అర్థం ఉన్నా, ఇక్కడ శత్రుత్వపూర్వక చర్యకు పూనుకోవడాన్ని సహజమైన ఆధునిక తెలుగులో ‘లేచి’ తెలియజేస్తుంది; మూలంలోని దృశ్యరూపాన్ని కూడా కొంత నిలుపుతుంది.
- source_word: שָׂטָן
  choice: సాతాను
  rationale: నిర్దిష్ట ఉపపదం లేకున్నా, సందర్భంలో ఇది వ్యక్తిగత ప్రత్యర్థికి పేరుగా లేదా బిరుదుగా పనిచేసే అవకాశం బలంగా ఉంది. అయితే ‘ఒక విరోధి’ అనే సాధారణ నామార్థం నిజమైన భాషాత్మక ప్రత్యామ్నాయం కాబట్టి పాదటిప్పణిలో ఉంచబడింది.
- source_word: עַל יִשְׂרָאֵל
  choice: ఇశ్రాయేలుకు విరోధంగా
  rationale: శత్రుత్వ సందర్భంలో עַל కు ‘విరోధంగా’ అనే అర్థం సహజం; ఇది ఇశ్రాయేలును లక్ష్యంగా చేసుకున్న ప్రతికూల వైఖరిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: וַיָּסֶת
  choice: ప్రేరేపించాడు
  rationale: סות హిఫిల్ రూపం ఒకరిని చర్యకు పురికొల్పడం లేదా రెచ్చగొట్టడం అనే భావాన్ని ఇస్తుంది. ‘ప్రేరేపించాడు’ కారణాత్మక పురికొల్పును తెలుపుతూ బలవంతం చేశాడనే అదనపు భావాన్ని మోపదు.
- source_word: לִמְנוֹת
  choice: లెక్కించడానికి
  rationale: מנה కు నేరుగా ‘లెక్కించు’ అనే అర్థం. ‘జనగణన చేయడానికి’ అనడం సందర్భానుకూలమైనా మూలం కంటే వివరణాత్మకం; అందువల్ల సరళమైన ‘లెక్కించడానికి’ ఎంచుకోబడింది.
- source_word: אֶת יִשְׂרָאֵל
  choice: ఇశ్రాయేలును
  rationale: మూలంలో కర్మగా కేవలం ‘ఇశ్రాయేలు’ ఉంది. ‘ఇశ్రాయేలు ప్రజలను’ అని విస్తరించకుండా, మూలంలోని సంక్షిప్తతను తెలుగు విభక్తితో నిలుపుతుంది.
theological_decisions:
- issue: שָׂטָן యొక్క గుర్తింపు మరియు అర్థం
  choice: వ్యక్తిగత విరోధి అయిన ‘సాతాను’
  alternative: ‘ఒక విరోధి’
  rationale: ఈ హెబ్రీ పదం సాధారణంగా ‘విరోధి’ అని కూడా అర్థమివ్వగలదు; అయితే ఈ సందర్భంలో వ్యక్తిగత సాతానును సూచించడం ఎక్కువ సంభావ్యంగా కనిపిస్తుంది. నిజమైన పదార్థ సందిగ్ధతను పాదటిప్పణిలో నిలిపి, ఏకపక్షంగా తొలగించలేదు.
- issue: 2 సమూయేలు 24:1తో కారణకర్త సంబంధం
  choice: దినవృత్తాంతాలలో సాతానును తక్షణ ప్రేరేపకునిగా ఉన్నట్లే అనువదించడం
  alternative: యెహోవా కోపమే ప్రేరేపించిందని ఈ వాక్యంలో సమన్వయపరచడం
  rationale: 2 సమూయేలు 24:1లోని వివరణను ఈ వాక్యంలోకి చొప్పించకుండా, రెండు వాక్యాల మధ్యనున్న ధార్మిక ఉద్రిక్తతను పాదటిప్పణి ద్వారా యథాతథంగా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘లేచి’ మరియు ‘ప్రేరేపించాడు’ సాధారణ పాఠకులకు సహజంగా ఉండి మూల హెబ్రీ క్రియల భావాన్ని తగినంతగా కాపాడుతాయి. ప్రధాన పాఠ్యంలో రెండు పాదటిప్పణి గుర్తులూ చేర్చబడ్డాయి.
