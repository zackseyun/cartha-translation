  text: וּ/בְנ֥/וֹ הַ/בְּכ֖וֹר עַבְדּ֑וֹן וְ/צ֣וּר וְ/קִ֔ישׁ וּ/בַ֥עַל וְ/נֵ֖ר וְ/נָדָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/036.yaml
  text: And his firstborn son was Abdon[a], then Zur, Kish, Baal, Ner, and Nadab.
translation:
  language: te
  text: అతని మొదటిపుట్టిన కుమారుడు అబ్దోను[a]; తరువాత సూరు, కీషు, బయలు, నేరు, నాదాబు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'హీబ్రూ వాక్యనిర్మాణం అక్షరార్థంగా: “అతని కుమారుడు, మొదటిపుట్టినవాడు: అబ్దోను; మరియు సూరు, మరియు కీషు, మరియు బయలు, మరియు నేరు, మరియు నాదాబు.” ప్రతి పేరుకు ముందున్న సంధిని తెలుగులో సహజమైన జాబితాగా ఇచ్చాం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנוֹ
  choice: అతని ... కుమారుడు
  rationale: ו వంశావళి జాబితాను కొనసాగిస్తుంది; తెలుగులో వాక్యప్రవాహం సహజంగా ఉండేందుకు ప్రత్యేకంగా ‘మరియు’ అనకుండా కొనసాగింపుగా వ్యక్తం చేశాం. בְנוֹ లోని మూడవ పురుష ఏకవచన స్వామ్యార్థాన్ని ‘అతని’ అని స్పష్టంగా నిలిపాం.
- source_word: הַבְּכוֹר
  choice: మొదటిపుట్టిన
  rationale: ‘జ్యేష్ఠుడు/పెద్దవాడు’ కంటే మూలపదంలోని జననక్రమ భావాన్ని నేరుగా, సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: עַבְדּוֹן
  choice: అబ్దోను
  rationale: వ్యక్తినామాన్ని తెలుగు బైబిలు నామరూపాలకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וְצוּר
  choice: తరువాత సూరు
  rationale: పేర్ల ముందు పునరావృతమయ్యే ו సంధులను తెలుగులో సహజమైన జాబితాగా చూపేందుకు మొదటి కొనసాగింపును ‘తరువాత’తో సూచించాం; ఇది ప్రధానంగా జాబితా కొనసాగింపే.
- source_word: וְקִישׁ
  choice: కీషు
  rationale: వ్యక్తినామాన్ని లిప్యంతరీకరించాం; సంధిని తెలుగు జాబితా నిర్మాణంలో అంతర్భాగం చేశాం.
- source_word: וּבַעַל
  choice: బయలు
  rationale: ఇక్కడ בַעַל వ్యక్తినామంగా ఉంది; దాని మతపరమైన అనుబంధాన్ని తప్పించేందుకు పేరు మార్చకుండా మూలరూపాన్ని లిప్యంతరీకరించాం.
- source_word: וְנֵר
  choice: నేరు
  rationale: వ్యక్తినామాన్ని తెలుగు ధ్వని, నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וְנָדָב
  choice: నాదాబు
  rationale: వ్యక్తినామాన్ని లిప్యంతరీకరించాం; చివరి సంధి తెలుగు జాబితా నిర్మాణంలో సహజంగా అంతర్భవించింది.
theological_decisions:
- issue: ఇశ్రాయేలీయ వంశావళిలో בַּעַל అనే వ్యక్తినామం
  choice: వ్యక్తినామంగా ‘బయలు’
  alternative: దైవనామ అనుబంధాన్ని నివారించేలా పేరును మార్చడం లేదా ఇతర నామసంప్రదాయంతో సమన్వయపరచడం
  rationale: హీబ్రూ పాఠం ఇక్కడ స్పష్టంగా בַּעַל అనే వ్యక్తినామాన్నే ఇస్తుంది. తరువాతి మతపరమైన సున్నితత్వాల కారణంగా దాన్ని మార్చడం కాకుండా మూలపాఠాన్ని యథార్థంగా ప్రతిబింబించాం; ఇది విగ్రహారాధనకు సమ్మతి కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వంశావళి శైలి. ‘మొదటిపుట్టిన’ అనే రూపం మూలపాఠపు జననక్రమ భావాన్ని నిలుపుతుంది; పేర్లు తెలుగు బైబిలు వినియోగానికి సన్నిహితంగా లిప్యంతరీకరించబడ్డాయి.
