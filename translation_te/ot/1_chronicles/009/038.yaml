id: 1CH.9.38
reference: 1 Chronicles 9:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִקְל֖וֹת הוֹלִ֣יד אֶת שִׁמְאָ֑ם וְ/אַף הֵ֗ם נֶ֧גֶד אֲחֵי/הֶ֛ם יָשְׁב֥וּ בִ/ירֽוּשָׁלִַ֖ם עִם אֲחֵי/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/038.yaml
  text: Mikloth fathered Shimeam[a]. They also lived opposite their brothers in Jerusalem[b], with their brothers.
translation:
  language: te
  text: మిక్లోతు షిమెయాముకు తండ్రి అయ్యాడు[a]. వారు కూడా యెరూషలేములో తమ సహోదరులకు ఎదురుగా[b], తమ సహోదరులతో కలిసి నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో ‘షిమెయాము’; సమాంతర వంశావళి రూపాలతో సమన్వయం చేయడం వల్ల కొన్ని అనువాదాలు ‘షిమెయా’ అని చదువుతాయి.
    reason: alternative_reading
  - marker: b
    text: ‘తమ సహోదరుల ముందు’ లేదా ‘తమ సహోదరుల సమీపంలో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְלוֹת
  choice: మిక్లోతు
  rationale: వ్యక్తి పేరును అనువదించకుండా, హీబ్రూ రూపానికి అనుగుణంగా తెలుగు లిపిలో ఇచ్చాం; ఆరంభ సంధికారకాన్ని తెలుగు వాక్యప్రవాహంలో ప్రత్యేకంగా చూపడం అవసరం లేదు.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో హిఫిల్ రూపం ‘కనడం/తండ్రి కావడం’ అనే పురుష వంశ సంబంధాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండే రూపాన్ని ఎంచుకున్నాం.
- source_word: אֶת שִׁמְאָם
  choice: షిమెయాము
  rationale: ఇక్కడి హీబ్రూ వ్యంజన రూపాన్ని అనుసరించి పేరును ‘షిమెయాము’గా లిప్యంతరీకరించాం; సమాంతర వంశావళులతో సమన్వయం చేసి ‘షిమెయా’గా మార్చలేదు.
- source_word: וְאַף הֵם
  choice: వారు కూడా
  rationale: సంధికారకం మరియు అదనపు ఉద్ఘాటనను సహజ తెలుగు వాక్యనిర్మాణంలో ‘కూడా’ ద్వారా తెలిపాం.
- source_word: נֶגֶד
  choice: ఎదురుగా
  rationale: స్థాన సంబంధమైన ‘ఎదురుగా/ముందుగా/సమీపంలో’ అనే భావపరిధిలో, మూలంలోని దిశాత్మక అస్పష్టతను ఎక్కువగా కాపాడే ‘ఎదురుగా’ను ఎంచుకున్నాం.
- source_word: אֲחֵיהֶם
  choice: తమ సహోదరులు
  rationale: హీబ్రూ పదానికి అక్షరార్థంగా ‘సహోదరులు’; వంశ లేదా బంధు సమూహాన్ని సూచించే అవకాశం ఉన్నా, సందర్భం బలవంతం చేయనందున విస్తృతార్థ పదంతో మార్చలేదు.
- source_word: יָשְׁבוּ
  choice: నివసించారు
  rationale: ఇక్కడ క్రియ స్థిర నివాసాన్ని సూచిస్తుంది; ‘నివసించారు’ ఆధునిక, గౌరవప్రదమైన తెలుగు.
- source_word: בִירוּשָׁלִַם
  choice: యెరూషలేములో
  rationale: స్థలపేరుకు ప్రామాణిక తెలుగు రూపంతో పాటు ‘లో’ అనే స్థాన విభక్తిని నిలిపాం.
- source_word: עִם אֲחֵיהֶם
  choice: తమ సహోదరులతో కలిసి
  rationale: עִם తెలిపే సహవాసాన్ని స్పష్టంగా వ్యక్తం చేస్తూ, మూలంలో రెండుసార్లు వచ్చిన ‘వారి సహోదరులు’ అనే పునరుక్తిని నిలిపాం.
