translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. వంశావళి సంక్షిప్తతను, ‘తమ సహోదరులు’ అనే మూల పునరుక్తిని, נֶגֶד పదంలోని స్థానార్థ వైవిధ్యాన్ని నిలిపాం.
