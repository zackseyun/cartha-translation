id: 1CH.9.1
reference: 1 Chronicles 9:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵל֙ הִתְיַחְשׂ֔וּ וְ/הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֖פֶר מַלְכֵ֣י יִשְׂרָאֵ֑ל וִ/יהוּדָ֛ה הָגְל֥וּ לְ/בָבֶ֖ל בְּ/מַעֲלָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/001.yaml
  text: So all Israel was enrolled by genealogy[a], and behold, they are written in the Book of the Kings of Israel[b]; and Judah was taken into exile to Babylon because of their unfaithfulness.
translation:
  language: te
  text: ఇశ్రాయేలీయులందరూ వంశావళి ప్రకారం నమోదు చేయబడ్డారు[a]. ఇదిగో, వారు ‘ఇశ్రాయేలు రాజుల గ్రంథం’లో లిఖించబడి ఉన్నారు. యూదావారు తమ నమ్మకద్రోహం వల్ల[b] బబులోనుకు చెరగా తీసుకుపోబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వంశావళులలో లెక్కించబడ్డారు’ లేదా ‘వంశావళి ప్రకారం పట్టికలో చేర్చబడ్డారు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తమ విశ్వాసభంగం వల్ల’ లేదా ‘తమ అవిశ్వాసం వల్ల.’ హెబ్రీ పదం నమ్మకాన్ని భంగపరచడం లేదా ద్రోహం చేయడం అనే భావాన్ని, తరచుగా దేవునిపట్ల ఉన్న నిబంధనాత్మక నమ్మకానికి సంబంధించి, కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְיַחְשׂוּ
  choice: వంశావళుల ప్రకారం నమోదు చేయబడ్డారు
  rationale: ఈ రూపం కేవలం లెక్కించడాన్ని కాకుండా వంశసంబంధాన్ని నిర్ధారించి వంశావళి పట్టికలో నమోదు చేయడాన్ని సూచిస్తుంది.
- source_word: וְהִנָּם
  choice: ఇదిగో, వారు
  rationale: పాఠకుని దృష్టిని తరువాతి నమోదుపై నిలిపే హెబ్రీ సమర్పణాత్మక ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: כְּתוּבִים
  choice: లిఖించబడి ఉన్నారు
  rationale: హెబ్రీ క్రియావిశేషణ రూపంలోని స్థిత్యర్థాన్ని—వారు రాతపూర్వకంగా నమోదై ఉన్నారనే భావాన్ని—కాపాడుతుంది.
- source_word: עַל סֵפֶר מַלְכֵי יִשְׂרָאֵל
  choice: ‘ఇశ్రాయేలు రాజుల గ్రంథం’లో
  rationale: పత్రసంబంధ సందర్భంలో עַל‌ను సహజ తెలుగు ప్రయోగమైన ‘గ్రంథంలో’గా అనువదించి, మిగతా పదబంధాన్ని ఒక నిర్దిష్ట రాజరిక దస్తావేజు శీర్షికగా చూపుతుంది.
- source_word: וִיהוּדָה
  choice: యూదావారు
  rationale: ‘యూదా’ ఇక్కడ దక్షిణ రాజ్య ప్రజలను సూచించే సమూహవాచకం; ‘యూదావారు’ అనే రూపం తెలుగు వాక్యంలో ఆ సమూహ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: הָגְלוּ
  choice: చెరగా తీసుకుపోబడ్డారు
  rationale: హొఫాల్ రూపంలోని కర్మణి భావాన్ని కాపాడుతూ, వారు స్వచ్ఛందంగా వెళ్లలేదు గాని బలవంతంగా దేశాంతరవాసానికి తరలించబడ్డారని స్పష్టం చేస్తుంది.
- source_word: לְבָבֶל
  choice: బబులోనుకు
  rationale: గమ్యస్థానాన్ని సూచించే לְకు సహజమైన తెలుగు రూపం.
- source_word: בְּמַעֲלָם
  choice: తమ విశ్వాసఘాతుకం కారణంగా
  rationale: מַעַל‌లోని నమ్మకద్రోహం లేదా ఒడంబడిక విశ్వాసాన్ని భంగం చేసే భావాన్ని సాధారణ తప్పుగా కుదించకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: בְּמַעֲלָם సూచించే యూదా అపరాధ స్వభావం
  choice: విశ్వాసఘాతుకం
  alternative: అపరాధం; అవిశ్వాసం
  rationale: మూలపదం సాధారణ తప్పుకంటే నమ్మకాన్ని భంగం చేసే ద్రోహాన్ని సూచిస్తుంది. ‘విశ్వాసఘాతుకం’ ఆ తీవ్రతను నిలుపుతుంది; అయితే పాఠ్యంలో లేని ఒడంబడిక వివరణను నేరుగా చేర్చదు.
- issue: הָגְלוּ క్రియలోని కర్మణి భావం
  choice: చెరగా తీసుకుపోబడ్డారు
  alternative: చెరకు వెళ్లారు
  rationale: హొఫాల్ రూపం యూదా ప్రజలు దేశాంతరవాసాన్ని స్వయంగా చేపట్టారని కాకుండా దానికి గురయ్యారని సూచిస్తుంది; అందువల్ల కర్మణి అనువాదం తీర్పు సందర్భాన్ని కాపాడుతుంది.
- issue: וִיהוּדָה లోని సమూహవాచక భావం
  choice: యూదావారు
  alternative: యూదా
  rationale: మూలంలోని ఏకవచన రాజ్యనామం ప్రజలను సమూహంగా సూచిస్తుంది. తెలుగు సహజత్వం కోసం ‘యూదావారు’ వాడినా, దానిని వ్యక్తుల జాబితాగా లేదా భూభాగంగా సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘ఇదిగో’ మూలంలోని ఉద్ఘాటనను నిలుపుతుంది; ‘లిఖించబడి ఉన్నారు’ అధికారిక వంశావళి నమోదు సందర్భానికి తగిన స్వల్ప గాంభీర్యాన్ని ఇస్తుంది. పుస్తక శీర్షికను ఉల్లేఖన చిహ్నాలతో గుర్తించాం.
