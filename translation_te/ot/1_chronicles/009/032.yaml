  to: కెహాతీయుల కుమారుల్లో కొందరు తమ సహోదరుల మధ్య నుండి వరుసగా అమర్చిన రొట్టెల బాధ్యత వహించేవారు; వారు ప్రతి విశ్రాంతిదినాన వాటిని సిద్ధం చేసేవారు.[a]
