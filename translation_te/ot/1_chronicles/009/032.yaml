translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. వంశపరమైన హీబ్రూ వ్యక్తీకరణను నిలిపి, ఆలయ సేవకు సంబంధించిన బాధ్యతను స్పష్టంగా తెలిపింది.
