id: 1CH.9.32
reference: 1 Chronicles 9:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִן בְּנֵ֧י הַ/קְּהָתִ֛י מִן אֲחֵי/הֶ֖ם עַל לֶ֣חֶם הַֽ/מַּעֲרָ֑כֶת לְ/הָכִ֖ין שַׁבַּ֥ת שַׁבָּֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/032.yaml
  text: And some of the sons of the Kohathites[a], from among their brothers, were in charge of the bread of the arrangement, to prepare it Sabbath by Sabbath.
translation:
  language: te
  text: కెహాతీయుల కుమారుల్లో కొందరు తమ సహోదరుల మధ్య నుండి వరుసగా అమర్చిన రొట్టెల బాధ్యత వహించేవారు; వారు ప్రతి విశ్రాంతిదినాన వాటిని సిద్ధం చేసేవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: దీనిని సంప్రదాయంగా ‘సన్నిధి రొట్టెలు’ అని కూడా అంటారు. హీబ్రూ మాట అక్షరార్థంగా క్రమంగా లేదా వరుసలుగా అమర్చి ఉంచిన రొట్టెలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: కొందరు
  rationale: మִן ఇక్కడ సమూహంలోని కొంతమందిని సూచించే విభాగార్థక ప్రయోగం; సహజమైన తెలుగులో ‘కొందరు’ ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: בְּנֵי הַקְּהָתִי
  choice: కహాతీయుల కుమారుల్లో
  rationale: కహాతీ వంశానికి చెందిన సభ్యులను సూచించే హీబ్రూ కుటుంబ/వంశ భాషను సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: מִן אֲחֵיהֶם
  choice: తమ సహోదరుల మధ్య నుండి
  rationale: రెండవ מִן విభాగార్థకమైనది; వారు తమ తోటి లేవీయులలోనుండి నియమించబడ్డారని సూచిస్తుంది. ‘సహోదరులు’ హీబ్రూ పదాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: עַל
  choice: బాధ్యత వహించి
  rationale: పరిపాలనా సందర్భంలో ఈ పదం పర్యవేక్షణ లేదా అప్పగించబడిన బాధ్యతను సూచిస్తుంది; ఆధునిక తెలుగులో ఈ ప్రయోగం సహజంగా ఉంటుంది.
- source_word: לֶחֶם הַמַּעֲרָכֶת
  choice: అమర్చిన రొట్టెలు
  rationale: క్రమంగా అమర్చి ఉంచబడిన రొట్టెలను సూచించే హీబ్రూ భావాన్ని సహజంగా తెలియజేస్తుంది; సంప్రదాయ పదప్రయోగాలను పాదసూచికలో ఇస్తుంది.
- source_word: לְהָכִין
  choice: వాటిని సిద్ధం చేసేవారు
  rationale: ఉద్దేశాన్ని తెలిపే క్రియారూపం; సందర్భం వల్ల సూచితమైన రొట్టెలను ‘వాటిని’ అని స్పష్టం చేసింది.
- source_word: שַׁבַּת שַׁבָּת
  choice: ప్రతి విశ్రాంతిదినాన
  rationale: పునరుక్త నామవాచకంలోని పంపిణీ/పునరావృత్తి భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
