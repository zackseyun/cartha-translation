id: 1CH.9.19
reference: 1 Chronicles 9:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/שַׁלּ֣וּם בֶּן ק֠וֹרֵא בֶּן אֶבְיָסָ֨ף בֶּן קֹ֜רַח וְֽ/אֶחָ֧י/ו לְ/בֵית אָבִ֣י/ו הַ/קָּרְחִ֗ים עַ֚ל מְלֶ֣אכֶת הָ/עֲבוֹדָ֔ה שֹׁמְרֵ֥י הַ/סִּפִּ֖ים לָ/אֹ֑הֶל וַ/אֲבֹֽתֵי/הֶם֙ עַל מַחֲנֵ֣ה יְהוָ֔ה שֹׁמְרֵ֖י הַ/מָּבֽוֹא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/019.yaml
  text: And Shallum son of Kore[a], son of Ebiasaph, son of Korah, and his brothers from his father’s house, the Korahites, were over the work of the service, keepers of the thresholds of the tent; and their fathers had been over the camp of Yahweh[b], keepers of the entrance.
translation:
  language: te
  text: కోరే కుమారుడైన షల్లూము, ఎబ్యాసాఫు కుమారుడు, కోరహు కుమారుడు, మరియు అతని పితృకుటుంబానికి చెందిన అతని సహోదరులైన కోరహీయులు సేవా పనిపై బాధ్యత వహిస్తూ, గుడారం గడపలను[a] కాపాడేవారు; వారి పితరులు యాహ్వే[b] శిబిరానికి బాధ్యులై, ప్రవేశాన్ని కాపాడేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గుడారం ద్వారాలను కాపాడేవారు.” హీబ్రూలో అక్షరార్థంగా “గుడారం గడపలను కాపాడేవారు.”
    reason: హీబ్రూ סִפִּים యొక్క సందర్భానుగుణమైన ప్రత్యామ్నాయ అర్థాన్ని తెలియజేయడం
  - marker: b
    text: హీబ్రూలో ఇది దేవుని వ్యక్తిగత నామమైన YHWH.
    reason: దైవనామపు మూలరూపాన్ని తెలియజేయడం
lexical_decisions:
- source_word: וְשַׁלּוּם
  choice: షల్లూము
  rationale: ముందటి జాబితాతో ఉన్న అనుసంధానం తెలుగులో వాక్యప్రవాహం ద్వారానే స్పష్టమవుతుంది; అసహజమైన ప్రారంభ ‘మరియు’ అవసరం లేదు.
- source_word: בֶּן קוֹרֵא בֶּן אֶבְיָסָף בֶּן קֹרַח
  choice: కోరే కుమారుడు, ఎబ్యాసాఫు మనుమడు, కోరహు మునిమనుమడు
  rationale: హీబ్రూ వంశావళి శ్రేణిని యథార్థంగా ఉంచుతూ, ఆధునిక తెలుగులో ప్రతి తరపు సంబంధం స్పష్టంగా తెలియజేస్తుంది.
- source_word: וְאֶחָיו לְבֵית אָבִיו
  choice: అతని పితృవంశానికి చెందిన అతని సహోదరులు
  rationale: ‘సహోదరులు’ మూలంలోని పురుష బహువచనాన్ని కాపాడుతుంది; ‘పితృవంశం’ కుటుంబ-కుల అనుబంధ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: הַקָּרְחִים
  choice: కోరహీయులు
  rationale: కోరహు వంశానికి చెందిన వారిని సూచించే హీబ్రూ జాతివాచక బహువచనానికి సరియైన తెలుగు రూపం.
- source_word: עַל מְלֶאכֶת הָעֲבוֹדָה
  choice: సేవాపనికి బాధ్యులై
  rationale: עַל ఇక్కడ పర్యవేక్షణ లేదా బాధ్యతను సూచిస్తుంది; ‘సేవాపని’ ఆలయసంబంధ కర్తవ్యాన్ని తెలియజేస్తూ తరువాతి సంఘపరమైన ‘పరిచర్య’ భావాన్ని రుద్దదు.
- source_word: שֹׁמְרֵי הַסִּפִּים לָאֹהֶל
  choice: గుడారపు గడపలను కాపాడేవారుగా
  rationale: סִפִּים యొక్క మూర్తమైన ‘గడపలు/ద్వారపు అంచులు’ భావాన్ని నిలుపుతుంది; אֹהֶל ను సాంకేతికంగా విస్తరించకుండా ‘గుడారం’గా అనువదిస్తుంది.
- source_word: וַאֲבֹתֵיהֶם
  choice: వారి పితరులు ... ఉండేవారు
  rationale: ఇది పూర్వతరాల విధిని వెనక్కి చూసి చెబుతుంది; ‘పితరులు’ కుటుంబపరమైన మూలభాషను నిలుపుతుంది.
- source_word: עַל מַחֲנֵה יְהוָה
  choice: యెహోవా శిబిరానికి బాధ్యులై
  rationale: מַחֲנֶה ను ‘శిబిరం’గా, עַל ను బాధ్యత భావంతో అనువదించాం; దైవనామాన్ని తెలుగు పాఠకులకు స్థిరంగా పరిచితమైన ‘యెహోవా’ రూపంలో ఉంచాం.
- source_word: שֹׁמְרֵי הַמָּבוֹא
  choice: ప్రవేశద్వారాన్ని కాపాడేవారుగా
  rationale: מָבוֹא ఇక్కడ లోపలికి వచ్చే స్థలం లేదా ప్రవేశాన్ని సూచిస్తుంది; సందర్భానుగుణంగా ‘ప్రవేశద్వారం’ సహజంగా ఉంటుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే; ప్రభువు
  rationale: మూలంలో బిరుదు కాక వ్యక్తిగత దైవనామమైన టెట్రాగ్రామటన్ ఉంది. తెలుగు బైబిలు వాడుకలో స్థిరపడిన నామరూపం ‘యెహోవా’; పాదసూచికలో దాని హీబ్రూ రూపాన్ని స్పష్టం చేశాం.
- issue: אֹהֶל కు మరింత సాంకేతికమైన ఆలయపదం వాడాలా
  choice: గుడారం
  alternative: ప్రత్యక్ష గుడారం; మందిరం
  rationale: హీబ్రూ పదం నేరుగా ‘గుడారం’ అని చెబుతుంది. చారిత్రకంగా పవిత్ర గుడారమే ఉద్దేశమైనా, మూలంలో లేని సాంకేతిక వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- issue: הַסִּפִּים ను కార్యపాత్రగా లేదా నిర్మాణభాగంగా చూపడం
  choice: గడపలు
  alternative: గుడారపు ద్వారాలు
  rationale: మూలపదం అక్షరార్థంగా గడపలు/ద్వారపు అంచులను సూచిస్తుంది. ‘ద్వారాలు’ సందర్భానికి సాధ్యమైనా, ప్రధాన పాఠ్యం మూర్తమైన మూలచిత్రాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. వంశావళి సంబంధాలను సహజ తెలుగు బంధుపదాలతో స్పష్టం చేశాం; ఆలయసేవకు సంబంధించి తరువాతి మతసంస్థల ప్రత్యేక పదజాలాన్ని నివారించాం.
