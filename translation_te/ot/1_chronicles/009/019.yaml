  rationale: వంశావళిలోని మూడు వరుస “కుమారుడు” సంబంధాలను యథాతథంగా పునరుద్ధరించాం; తరాల బంధాన్ని పునర్వ్యాఖ్యానించే “మనుమడు/మునిమనుమడు” పదాలను తొలగించాం. పాఠ్యంలోని దైవనామాన్ని POB నిర్ణయానికి అనుగుణంగా “యాహ్వే”గా మార్చాం. “గడపలు” అనే అక్షరార్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సందర్భోచితమైన “ద్వారాలు” ప్రత్యామ్నాయాన్ని సరైన పాదసూచిక-ఆధారంతో ఇచ్చాం.
