review_pass:
  verdict: revise
  source_fidelity: The genealogy must retain the repeated Hebrew formula “son of”; rendering Ebiasaph as Shallum’s grandfather and Korah as his great-grandfather changes the stated lineage. The divine name יהוה should follow the supplied POB audit decision, “Yahweh,” rather than “Jehovah.” The remaining duty descriptions basically reflect the Hebrew well.
  naturalness: The revised wording uses clear modern standard Telugu while retaining the formal genealogical and sanctuary-duty register. “పితృకుటుంబం” naturally conveys “father’s house” as a lineage group.
  terminology: “కోరహీయులు,” “సేవా పనిపై,” “గుడారం గడపలు,” and “ప్రవేశం” preserve the clan, service, threshold, and entrance terminology. “యాహ్వే” conforms to the stated POB rendering of the Tetragrammaton.
  issues:
  - severity: high
    issue: The genealogy is recast as grandson/great-grandson relationships.
    rationale: 'בן is repeated three times: Shallum is son of Kore, Kore son of Ebiasaph, and Ebiasaph son of Korah. The draft’s “మనుమడు/మునిమనుమడు” makes Shallum directly the grandson and great-grandson, altering the wording and genealogical syntax.'
  - severity: medium
    issue: יהוה is rendered “యెహోవా.”
    rationale: The supplied English POB audit trail explicitly adopts “Yahweh” for the divine name. The Telugu should correspond with “యాహ్వే,” without substituting a different traditional vocalization.
  - severity: low
    issue: The existing footnote only marks the divine name and leaves the threshold/gate lexical alternative unanchored.
    rationale: A threshold footnote, attached to “గడపలను,” preserves the concrete Hebrew wording while making the contextual “gates/doors” alternative available. The divine-name note is retained with a matching anchor.
  revised_text: కోరే కుమారుడైన షల్లూము, ఎబ్యాసాఫు కుమారుడు, కోరహు కుమారుడు, మరియు అతని పితృకుటుంబానికి చెందిన అతని సహోదరులైన కోరహీయులు సేవా పనిపై బాధ్యత వహిస్తూ, గుడారం గడపలను[a] కాపాడేవారు; వారి పితరులు యాహ్వే[b] శిబిరానికి బాధ్యులై, ప్రవేశాన్ని కాపాడేవారు.
  revised_footnotes:
  - marker: a
    text: లేదా, “గుడారం ద్వారాలను కాపాడేవారు.” హీబ్రూలో అక్షరార్థంగా “గుడారం గడపలను కాపాడేవారు.”
    reason: హీబ్రూ סִפִּים యొక్క సందర్భానుగుణమైన ప్రత్యామ్నాయ అర్థాన్ని తెలియజేయడం
