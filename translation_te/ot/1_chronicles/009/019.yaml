revisions:
- from: కోరే కుమారుడు, ఎబ్యాసాఫు మనుమడు, కోరహు మునిమనుమడు అయిన షల్లూము, అతని పితృవంశానికి చెందిన అతని సహోదరులైన కోరహీయులు సేవాపనికి బాధ్యులై, గుడారపు గడపలను కాపాడేవారుగా ఉన్నారు; వారి పితరులు యెహోవా[a] శిబిరానికి బాధ్యులై, ప్రవేశద్వారాన్ని కాపాడేవారుగా ఉండేవారు.
