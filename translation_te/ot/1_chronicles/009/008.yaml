  text: וְ/יִבְנְיָה֙ בֶּן יְרֹחָ֔ם וְ/אֵלָ֥ה בֶן עֻזִּ֖י בֶּן מִכְרִ֑י וּ/מְשֻׁלָּם֙ בֶּן שְׁפַטְיָ֔ה בֶּן רְעוּאֵ֖ל בֶּן יִבְנִיָּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/008.yaml
  text: and Ibneiah son of Jeroham[a], and Elah son of Uzzi, son of Michri, and Meshullam son of Shephatiah, son of Reuel, son of Ibnijah.
translation:
  language: te
  text: యెరోహాము కుమారుడు యిబ్నెయా[a], మిక్రీ కుమారుడైన ఉజ్జీ కుమారుడు ఏలా, యిబ్నియ్యా కుమారుడైన రెయూయేలు కుమారుడైన షెఫట్యా కుమారుడు మెషుల్లాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనంలోని వ్యక్తుల పేర్లు హీబ్రూ నుంచి లిప్యంతరీకరించబడ్డాయి. ఇతర అనువాదాల్లో వీటికి కొంత భిన్నమైన అక్షరరూపాలు కనిపించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: జాబితాలో సహజమైన విరామచిహ్నాలతో అనుసంధానం
  rationale: హీబ్రూలో ప్రతి పేరును కలిపే וְ పదాన్ని తెలుగులో ప్రతిసారీ ‘మరియు’ అని పునరావృతం చేయడం అసహజం; పేర్ల వరుసను కామాలతో సహజంగా తెలియజేశాం.
- source_word: יִבְנְיָה
  choice: యిబ్నెయా
  rationale: వ్యక్తి పేరును మసొరేటిక్ హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు / కుమారుడైన
  rationale: ఈ వంశావళి సందర్భంలో తక్షణ పితృసంబంధాన్ని సూచించే సహజ తెలుగు రూపం; సంబంధాల గొలుసును స్పష్టంగా ఉంచేందుకు ‘కుమారుడైన’ కూడా వాడాం.
- source_word: יְרֹחָם
  choice: యెరోహాము
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: אֵלָה
  choice: ఏలా
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: עֻזִּי
  choice: ఉజ్జీ
  rationale: ద్విత్వ జయిన్ ధ్వనిని ‘జ్జీ’తో ప్రతిబింబిస్తూ వ్యక్తి పేరును లిప్యంతరీకరించాం.
- source_word: מִכְרִי
  choice: మిక్రీ
  rationale: వ్యక్తి పేరును హీబ్రూ వ్యంజన, స్వర రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: מְשֻׁלָּם
  choice: మెషుల్లాము
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా, ద్విత్వ లామెద్‌ను ‘ల్లా’తో సూచిస్తూ లిప్యంతరీకరించాం.
- source_word: שְׁפַטְיָה
  choice: షెఫట్యా
  rationale: వ్యక్తి పేరును ఆంగ్ల సంప్రదాయ రూపం ద్వారా కాకుండా హీబ్రూ రూపం నుంచి నేరుగా లిప్యంతరీకరించాం.
- source_word: רְעוּאֵל
  choice: రెయూయేలు
  rationale: మసొరేటిక్ హీబ్రూ రూపాన్ని అనుసరించాం; ఇతర ప్రసార సంప్రదాయాల్లోని ‘రగూయేలు’ వంటి రూపాన్ని స్వీకరించలేదు.
- source_word: יִבְנִיָּה
  choice: యిబ్నీయా
  rationale: మొదటి యిబ్నెయా పేరుతో ఉన్న స్వరభేదాన్ని నిలుపుతూ హీబ్రూ రూపం నుంచి లిప్యంతరీకరించాం.
