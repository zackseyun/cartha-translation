  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి సంబంధాలు స్పష్టంగా కనిపించేలా సహజమైన కానీ గంభీరమైన శైలిని వాడాం. హీబ్రూ వాక్యంలో పునరావృతమయ్యే సంధికారకాన్ని తెలుగులో యాంత్రికంగా పునరావృతం చేయకుండా పేర్ల జాబితా ప్రవాహాన్ని కాపాడాం.
