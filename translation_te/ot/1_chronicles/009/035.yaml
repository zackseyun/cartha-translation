source:
  edition: WLC
  text: וּ/בְ/גִבְע֛וֹן יָשְׁב֥וּ אֲבִֽי גִבְע֖וֹן יעואל וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ מַעֲכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/035.yaml
  text: In Gibeon lived Jeiel the father of Gibeon[b][a], and his wife's name was Maacah.
translation:
  language: te
  text: గిబ్యోనులో గిబ్యోనుకు తండ్రియైన యెయీయేలు[a] నివసించాడు. అతని భార్య పేరు మయకా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా ‘గిబ్యోను తండ్రి.’ లేదా ‘గిబ్యోను స్థాపకుడు’ లేదా ‘గిబ్యోను అధిపతి.’ ఈ పేరును హీబ్రూ అక్షరరూపానికి అనుగుణంగా ‘యెయూయేలు’ అని కూడా లిప్యంతరీకరించవచ్చు; 1 దినవృత్తాంతాలు 8:29లోని సమాంతర వచనాన్ని పోల్చండి.
    reason: lexical_alternative; textual_variant
lexical_decisions:
- source_word: וּ/בְ/גִבְע֛וֹן
  choice: గిబ్యోనులో
  rationale: ప్రారంభ వావ్‌ను తెలుగు వాక్యంలో ప్రత్యేకంగా చూపకుండానే స్థలార్థాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: יָשְׁב֥וּ
  choice: నివసించాడు
  rationale: మూలంలో క్రియ బహువచన రూపంలో ఉన్నప్పటికీ, వెంట వచ్చే ఏకవచన వ్యక్తినామంతో కూడిన వంశావళి సూత్రాన్ని తెలుగులో సహజమైన ఏకవచనంగా అందించింది.
- source_word: אֲבִֽי גִבְע֖וֹן
  choice: గిబ్యోను తండ్రి
  rationale: మూలంలోని ‘గిబ్యోను తండ్రి’ అనే రూపాన్ని నిలిపి, స్థాపకుడు లేదా అధిపతి అనే సందర్భార్థాలను పాదటిప్పణిలో ఉంచింది.
- source_word: יעואל
  choice: యెయీయేలు
  rationale: మసొరా పఠన సంప్రదాయం మరియు 1 దినవృత్తాంతాలు 8:29లోని సమాంతర పాఠానికి అనుగుణమైన పేరురూపం; మరో ప్రతినిధీకరణను పాదటిప్పణిలో తెలిపింది.
- source_word: וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ
  choice: అతని భార్య పేరు
  rationale: హీబ్రూ నామవాచక వాక్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: מַעֲכָֽה
  choice: మయకా
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ.
