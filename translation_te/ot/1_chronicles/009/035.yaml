translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళి సందర్భానికి తగిన సంక్షిప్త, గౌరవప్రద శైలి. మూలంలోని అస్పష్టమైన ‘తండ్రి’ బిరుదును ప్రధాన పాఠంలో నిలిపి, సాధ్యమైన సందర్భార్థాలను పాదటిప్పణిలో ఇచ్చింది.
