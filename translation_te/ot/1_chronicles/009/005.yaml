  yaml_path: translation/ot/1_chronicles/009/005.yaml
  text: 'And from the Shilonites: Asaiah the firstborn and his sons[a].'
translation:
  language: te
  text: 'మరియు షిలోనీయులలోనుండి: జ్యేష్ఠుడైన అసాయా మరియు అతని కుమారులు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఈ వంశనామానికి ఉన్న మరో సంప్రదాయ గుర్తింపును అనుసరించి, “షేలోనీయులు” కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִן
  choice: లో
  rationale: మునుపటి వంశాల జాబితాతో ఈ అంశాన్ని కలిపే భావాన్ని తెలుగులో సహజమైన సమూహార్థక నిర్మాణం ద్వారా వ్యక్తం చేస్తుంది; ప్రారంభంలోని וּ యొక్క అనుబంధ భావం జాబితా సందర్భంలో నిలుస్తుంది.
- source_word: הַ/שִּׁילוֹנִי
  choice: షిలోనీయులలో
  rationale: ఏకవచన రూపంలో ఉన్న జాతి/వంశ సూచక పదం ఇక్కడ సమూహార్థంలో పనిచేస్తుంది. అందువల్ల వంశానికి చెందినవారిని సూచించే బహువచన రూపం సహజంగా ఉంది; హీబ్రూ స్వరపాఠంలోని ‘షిలోనీ’ గుర్తింపును అనుసరిస్తుంది.
- source_word: עֲשָׂיָה
  choice: అసాయా
  rationale: వ్యక్తి పేరును దాని హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించింది.
- source_word: הַ/בְּכֹר
  choice: జ్యేష్ఠుడైన
  rationale: కుటుంబంలో మొదట పుట్టిన కుమారుడు అనే నిర్దిష్ట భావాన్ని తెలియజేస్తుంది; కేవలం వయస్సులో పెద్దవాడు అనే అస్పష్ట భావానికి పరిమితం కాదు.
- source_word: וּ/בָנָיו
  choice: అతని కుమారులు
  rationale: בנים ఇక్కడ ‘పిల్లలు’ అనే సాధారణ అర్థం కాకుండా కుమారులను నిర్దిష్టంగా సూచిస్తుంది; అనుబంధాన్ని తెలుగులో జాబితా విరామంతో సహజంగా వ్యక్తం చేసింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన, గంభీరమైన శైలిని ఉపయోగించాం. ద్విబిందువు హీబ్రూ జాబితా నిర్మాణాన్ని స్పష్టంగా చూపిస్తుంది.
