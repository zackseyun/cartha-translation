id: 1CH.9.22
reference: 1 Chronicles 9:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: כֻּלָּ֤/ם הַ/בְּרוּרִים֙ לְ/שֹׁעֲרִ֣ים בַּ/סִּפִּ֔ים מָאתַ֖יִם וּ/שְׁנֵ֣ים עָשָׂ֑ר הֵ֤מָּה בְ/חַצְרֵי/הֶם֙ הִתְיַחְשָׂ֔/ם הֵ֣מָּה יִסַּ֥ד דָּוִ֛יד וּ/שְׁמוּאֵ֥ל הָ/רֹאֶ֖ה בֶּ/אֱמוּנָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/022.yaml
  text: All these who were chosen as gatekeepers at the thresholds were two hundred and twelve[a]. They were enrolled by genealogy in their villages. David and Samuel the seer established them in their office of trust.
translation:
  language: te
  text: గడపల వద్ద ద్వారపాలకులుగా ఎంపికైన వీరందరూ రెండువందల పన్నెండు మంది. తమ గ్రామాల్లో వీరి వంశావళి నమోదు చేయబడింది. దావీదు, దర్శియైన సమూయేలు వారిని వారికి నమ్మకంతో అప్పగించిన సేవలో స్థిరపరిచారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి విశ్వాస్యతను బట్టి వారిని స్థిరపరిచారు,” లేదా “వారి విశ్వాస్యతలో వారిని స్థిరపరిచారు.”
    reason: వచనాంతంలోని בֶּאֱמוּנָתָם అనే పదబంధం నమ్మకంతో అప్పగించిన సేవను గానీ, వారి విశ్వాస్యతను గానీ సూచించవచ్చు.
lexical_decisions:
- source_word: הַבְּרוּרִים
  choice: ఎంపికైన
  rationale: ఈ నిష్క్రియార్థక పదం ఒక సేవ కోసం ప్రత్యేకంగా ఎంచుకోబడినవారిని సూచిస్తుంది; ‘ఎంపికైన’ అనేది నియామక విధానాన్ని అదనంగా నిర్దేశించకుండా ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: לְשֹׁעֲרִים
  choice: ద్వారపాలకులుగా
  rationale: ఆలయ ప్రవేశద్వారాలను కాపాడే సేవకులను సూచించే స్పష్టమైన, ప్రస్తుత తెలుగు పదం.
- source_word: בַּסִּפִּים
  choice: ద్వారాల గడపల దగ్గర
  rationale: סַף యొక్క ప్రాథమిక అర్థమైన ‘గడప’ను నిలుపుతూ, ద్వారపాలకులు సేవచేసే స్థలాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: מָאתַיִם וּשְׁנֵים עָשָׂר
  choice: రెండువందల పన్నెండు మంది
  rationale: వ్యక్తుల సంఖ్యను తెలుగులో నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: בְחַצְרֵיהֶם
  choice: తమ గ్రామాల్లో
  rationale: వంశావళి, నివాస సందర్భంలో חָצֵר ఆలయ ప్రాంగణాలను కాక చిన్న గ్రామాలు లేదా నివాస స్థలాలను సూచిస్తుంది.
- source_word: הִתְיַחְשָׂם
  choice: వంశావళి ప్రకారం వీరి పేర్లు నమోదు చేయబడ్డాయి
  rationale: వంశ సంబంధిత అధికారిక నమోదును సూచించే హిత్పయేల్ రూప భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: יִסַּד
  choice: స్థిరపరిచారు
  rationale: ‘పునాది వేయడం/స్థాపించడం’ అనే మూలభావాన్ని పరిపాలనా ఏర్పాటుకు తగిన విధంగా అందిస్తుంది; తరువాతి సంఘపరమైన ‘అభిషేకించారు’ వంటి భావాలను చేర్చదు.
- source_word: הָרֹאֶה
  choice: దీర్ఘదర్శియైన
  rationale: సమూయేలుకు వాడిన ప్రత్యేకమైన ప్రాచీన బిరుదు ‘seer’ భావాన్ని ‘ప్రవక్త’గా సాధారణీకరించకుండా నిలుపుతుంది.
- source_word: בֶּאֱמוּנָתָם
  choice: ఈ విశ్వసనీయ బాధ్యతలో
  rationale: ద్వారపాలకుల అధికారిక, నమ్మకంతో అప్పగించబడిన బాధ్యతను ప్రధానంగా చూపుతూ, అֱמוּנָהలోని విశ్వసనీయత భావాన్ని కూడా నిలుపుతుంది.
theological_decisions:
- issue: వచనాంతంలోని בֶּאֱמוּנָתָם అర్థం
  choice: దావీదు, సమూయేలు వారిని ఒక విశ్వసనీయ బాధ్యతలో స్థిరపరిచారు
  alternative: వారి నమ్మకత్వాన్ని బట్టి వారిని స్థిరపరిచారు; లేదా వారి నమ్మకత్వంలో వారిని స్థిరపరిచారు
  rationale: వ్యాకరణ నిర్మాణం సంక్షిప్తంగా ఉండి, ‘అప్పగించిన నమ్మకమైన బాధ్యత’ లేదా ‘వారి నమ్మకత్వం’ అనే భావాలకు వీలు కల్పిస్తుంది. ఆలయ ద్వారపాలకుల నమోదు, సేవా ఏర్పాటు ప్రధాన సందర్భం కావడంతో బాధ్యత/అప్పగింత భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, నైతిక నమ్మకత్వ భావాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘ద్వారాల గడపలు,’ ‘వంశావళి ప్రకారం నమోదు,’ ‘దీర్ఘదర్శి’ వంటి పదాలు మూలపాఠ్య ప్రత్యేకతను నిలుపుతాయి. అస్పష్టమైన చివరి పదబంధానికి ప్రధాన పాఠ్యంలో సందర్భానుకూల అర్థం ఇచ్చి, ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
