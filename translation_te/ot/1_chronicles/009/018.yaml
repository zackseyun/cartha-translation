source:
  edition: WLC
  text: וְֽ/עַד הֵ֔נָּה בְּ/שַׁ֥עַר הַ/מֶּ֖לֶךְ מִזְרָ֑חָ/ה הֵ֚מָּה הַ/שֹּׁ֣עֲרִ֔ים לְ/מַחֲנ֖וֹת בְּנֵ֥י לֵוִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/018.yaml
  text: Until then they were at the king’s gate on the east[b][a]; they were the gatekeepers for the camps of the sons of Levi.
translation:
  language: te
  text: ఇప్పటివరకు[a] వారు తూర్పువైపున ఉన్న రాజద్వారం వద్ద ఉన్నారు; వారే లేవి కుమారుల శిబిరాలకు[b] ద్వారపాలకులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అప్పటివరకు’ లేదా ‘ఆ దశవరకు’ అని కూడా అనువదించవచ్చు. హీబ్రూ నుడికారం ఒక నిర్దిష్ట సమయం వరకు కొనసాగిన స్థితిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘విభాగాలకు’ లేదా ‘బృందాలకు’ అని కూడా అనువదించవచ్చు. ఇక్కడి హీబ్రూ పదం శిబిరాలను లేదా వ్యవస్థీకృత విభాగాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַד הֵנָּה
  choice: ఇప్పటివరకు
  rationale: ఈ హీబ్రూ కాలసూచక నుడికారం వర్ణకుడు మాట్లాడుతున్న సమయం వరకు కొనసాగిన స్థితిని సూచిస్తుంది. ‘ఇప్పటివరకు’ సహజమైన ఆధునిక తెలుగు; ఇతర కాలసంబంధ అర్థసాధ్యతలను పాదసూచికలో ఉంచాం.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: రాజద్వారం వద్ద
  rationale: בְ ఇక్కడ స్థానార్థకంగా ఉంది. ‘రాజద్వారం వద్ద’ అనేది ‘రాజు యొక్క ద్వారం’ అనే నిర్మాణాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: מִזְרָחָה
  choice: తూర్పువైపున ఉన్న
  rationale: దిశను సూచించే రూపం ద్వారం తూర్పు వైపున ఉన్నదని తెలియజేస్తుంది. సందర్భానికి తగిన స్పష్టత కోసం ఈ రూపం ఎంచుకున్నాం.
- source_word: הֵמָּה
  choice: వారే
  rationale: స్వతంత్ర సర్వనామంలోని ఉద్ఘాటనను తెలుగులో ‘వారే’ నిలుపుతుంది.
- source_word: הַשֹּׁעֲרִים
  choice: ద్వారపాలకులు
  rationale: ద్వారాలను కాపాడే నియమిత వ్యక్తులను సూచించే ఈ పదానికి ‘ద్వారపాలకులు’ స్పష్టమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: לְמַחֲנוֹת
  choice: శిబిరాలకు
  rationale: מַחֲנֶה యొక్క ప్రాథమిక అర్థమైన ‘శిబిరం’ను నిలిపాం. సందర్భంలో వ్యవస్థీకృత బృందాలు లేదా విభాగాలు అనే భావం కూడా ఉండవచ్చని పాదసూచిక తెలియజేస్తుంది.
- source_word: בְּנֵי לֵוִי
  choice: లేవి కుమారులు
  rationale: హీబ్రూ వంశావళి వ్యక్తీకరణను నేరుగా నిలుపుతూ, ‘లేవీయులు’ అనే సంక్షిప్త వ్యాఖ్యాన రూపాన్ని ప్రధాన పాఠ్యంలో ఉపయోగించలేదు.
