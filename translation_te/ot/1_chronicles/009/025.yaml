translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన సాధారణ శైలిని వాడాం. సేవా వంతు సందర్భాన్ని సహజంగా తెలియజేస్తూనే, మూలంలోని కాలపదబంధపు ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో నిలిపాం.
