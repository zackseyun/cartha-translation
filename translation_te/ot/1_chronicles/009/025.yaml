  to: వారి గ్రామాల్లో ఉన్న వారి సహోదరులు ప్రతి ఏడు రోజులకు ఒకసారి[a], కాలకాలానికి, వీరితో ఉండటానికి వచ్చేవారు.[b]
  rationale: The revision removes the unstated purpose “to perform service,” renders the recurring temporal idiom without over-specifying a rotational system, and supplies a source-based note for the final Hebrew phrase. The likely sense that the village-dwelling fellow Levites came to join those present is retained by “వీరితో ఉండటానికి వచ్చేవారు.”
