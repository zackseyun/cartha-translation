source:
  edition: WLC
  text: וַ/אֲחֵי/הֶ֨ם בְּ/חַצְרֵי/הֶ֜ם לָ/ב֨וֹא לְ/שִׁבְעַ֧ת הַ/יָּמִ֛ים מֵ/עֵ֥ת אֶל עֵ֖ת עִם אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/025.yaml
  text: And their brothers in their villages were to come in every seven days[a], from time to time[b], with these.
translation:
  language: te
  text: వారి గ్రామాల్లో ఉన్న వారి సహోదరులు ప్రతి ఏడు రోజులకు ఒకసారి[a], కాలకాలానికి, వీరితో ఉండటానికి వచ్చేవారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏడు రోజులపాటు”; హీబ్రూ పదబంధం బహుశా ఏడు రోజుల సేవా వంతును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “వీరితో”; ఇది అప్పటికే అక్కడ ఉన్నవారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: వారి సహోదరులు
  rationale: అక్షరార్థమైన ‘వారి సోదరులు’ అనే భావాన్ని నిలుపుతూ, లేవీయ సహవంశీయులను కూడా సూచించగల సందర్భానుకూల విస్తృతార్థానికి ‘సహోదరులు’ సరిపోతుంది.
- source_word: בְּחַצְרֵיהֶם
  choice: వారి గ్రామాల్లో ఉన్న
  rationale: חָצֵר అనే పదానికి ఆవరణ, నివాస సముదాయం, గ్రామం అనే అర్థాలున్నాయి; ఆలయ ప్రాంగణం వెలుపల నివసిస్తున్నవారి సందర్భంలో ‘గ్రామాలు’ సహజమైనది.
- source_word: לָבוֹא
  choice: వచ్చేవారు
  rationale: ל ఉపసర్గతో కూడిన క్రియారూపం సందర్భంలో నియమితంగా రావలసిన సేవా ఏర్పాటును సూచిస్తుంది; తెలుగులో పునరావృత నియమిత చర్యను ‘వచ్చేవారు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: לְשִׁבְעַת הַיָּמִים
  choice: ప్రతి ఏడు రోజులకు ఒకసారి
  rationale: ఈ పదబంధం ఏడు రోజుల సేవా వంతు లేదా విరామాన్ని సూచించే అవకాశమే ఎక్కువ; ‘ప్రతి ఏడు రోజులకు ఒకసారి’ ఆ చక్రార్థాన్ని స్పష్టంగా, అతివ్యాఖ్యానం లేకుండా అందిస్తుంది.
- source_word: מֵעֵת אֶל עֵת
  choice: వంతులవారీగా
  rationale: అక్షరార్థంగా ‘ఒక సమయం నుండి మరొక సమయానికి’; ఈ పరిపాలనా సందర్భంలో పునరావృతంగా నిర్ణయించిన వంతులను సూచిస్తుంది. ‘వంతులవారీగా’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: עִם אֵלֶּה
  choice: వీరితో కలిసి
  rationale: అక్షరార్థం ‘వీరితో’; సమీపంలో ప్రస్తావించిన సేవకులను సూచించే నిర్దేశక సర్వనామాన్ని నిలుపుతుంది.
