  text: וּ/מִן הַֽ/כֹּהֲנִ֑ים יְדַֽעְיָ֥ה וִ/יהוֹיָרִ֖יב וְ/יָכִֽין־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/010.yaml
  text: 'And from the priests: Jedaiah, Jehoiarib, and Jakin.'
translation:
  language: te
  text: యాజకులలోనుండి యెదయా, యెహోయారీబు, మరియు యాకీను ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן הַכֹּהֲנִים
  choice: యాజకుల్లో
  rationale: וּמִן introduces the priestly group represented in the list. In natural Telugu, the locative plural ‘యాజకుల్లో’ concisely expresses ‘and/from among the priests’; the preceding connective is implicit in the continuing list.
- source_word: יְדַעְיָה
  choice: యెదయా
  rationale: The personal name is transliterated from the Hebrew form into familiar Telugu biblical spelling.
- source_word: וִיהוֹיָרִיב
  choice: యెహోయారీబు
  rationale: The conjunction belongs to the Hebrew list structure; Telugu punctuation coordinates the names naturally. The name is transliterated rather than translated.
- source_word: וְיָכִין
  choice: యాకీను
  rationale: The final personal name is transliterated from Hebrew; Telugu list syntax makes a separate conjunction unnecessary in this compact verse.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యఖండాన్ని తెలుగులో సహజమైన సంపూర్ణ వాక్యంగా చేయడానికి ‘ఉన్నారు’ చేర్చబడింది.
