revisions:
- from: యెరోహాము కుమారుడైన అదాయా, పష్హూరు కుమారుడు; పష్హూరు మల్కీయా కుమారుడు. అలాగే అదీయేలు కుమారుడైన మయశై, యహజేరా కుమారుడు; యహజేరా మెషుల్లాము కుమారుడు; మెషుల్లాము మెషిల్లేమీతు[a] కుమారుడు; మెషిల్లేమీతు ఇమ్మేరు కుమారుడు.
