  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/עֲדָיָה֙ בֶּן יְרֹחָ֔ם בֶּן פַּשְׁח֖וּר בֶּן מַלְכִּיָּ֑ה וּ/מַעְשַׂ֨י בֶּן עֲדִיאֵ֧ל בֶּן יַחְזֵ֛רָה בֶּן מְשֻׁלָּ֥ם בֶּן מְשִׁלֵּמִ֖ית בֶּן אִמֵּֽר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/012.yaml
  text: and Adaiah son of Jeroham[a], son of Pashhur, son of Malchijah, and Maasai son of Adiel, son of Jahzerah, son of Meshullam, son of Meshillemith, son of Immer.
translation:
  language: te
  text: మరియు అదాయా యెరోహాము కుమారుడు; యెరోహాము పష్హూరు కుమారుడు; పష్హూరు మల్కీయా కుమారుడు. మరియు మయశై అదీయేలు కుమారుడు; అదీయేలు యహ్జేరా కుమారుడు; యహ్జేరా మెషుల్లాము కుమారుడు; మెషుల్లాము మెషిల్లేమీతు[a] కుమారుడు; మెషిల్లేమీతు ఇమ్మేరు కుమారుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హెబ్రీ పాఠంలో ఇక్కడ పేరు “మెషిల్లేమీతు”; మరోచోట దీనికి సంబంధించిన నామరూపం “మెషిల్లేమోతు”గా కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/עֲדָיָה
  choice: అదాయా
  rationale: మునుపటి వచనంలోని జాబితాను కొనసాగించే וַ భావాన్ని వాక్య నిర్మాణంలో కొనసాగింపుగా చూపి, వ్యక్తి పేరును హెబ్రీ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు / కుమారుడైన
  rationale: వంశావళి వరుసలో בֶּן‌కు సహజమైన అర్థం ‘కుమారుడు’; తెలుగు స్పష్టత కోసం ప్రతి సంబంధాన్ని విడివిడిగా వ్యక్తం చేశాం.
- source_word: יְרֹחָם
  choice: యెరోహాము
  rationale: హెబ్రీ వ్యక్తి పేరుకు తెలుగు లిప్యంతరీకరణ.
- source_word: פַּשְׁחוּר
  choice: పష్హూరు
  rationale: హెబ్రీ వ్యక్తి పేరుకు తెలుగు లిప్యంతరీకరణ; మధ్య హల్లుల క్రమాన్ని నిలిపాం.
- source_word: מַלְכִּיָּה
  choice: మల్కీయా
  rationale: హెబ్రీ పేరులోని వ్యంజన, స్వర రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: וּ/מַעְשַׂי
  choice: అలాగే ... మయశై
  rationale: וּ జాబితాలో మరో వ్యక్తిని కలుపుతుంది; מַעְשַׂי అనే సంక్షిప్త నామరూపాన్ని దీర్ఘమైన మయశేయాతో కలపకుండా లిప్యంతరీకరించాం.
- source_word: עֲדִיאֵל
  choice: అదీయేలు
  rationale: హెబ్రీ వ్యక్తి పేరుకు తెలుగు లిప్యంతరీకరణ.
- source_word: יַחְזֵרָה
  choice: యహజేరా
  rationale: హెబ్రీ ఆరంభ י మరియు ח ధ్వనులను తెలుగు పాఠకులకు చదవదగిన రీతిలో ప్రతిబింబించే లిప్యంతరీకరణ.
- source_word: מְשֻׁלָּם
  choice: మెషుల్లాము
  rationale: హెబ్రీ వ్యక్తి పేరుకు తెలుగు లిప్యంతరీకరణ; ద్విత్వ ల ధ్వనిని నిలిపాం.
- source_word: מְשִׁלֵּמִית
  choice: మెషిల్లేమీతు
  rationale: ప్రస్తుత మసొరేటిక్ పాఠంలోని מִית ముగింపును అనుసరించాం; ఇతర చోట్ల కనిపించే సంబంధిత ‘మెషిల్లేమోతు’ రూపంతో మార్చలేదు.
- source_word: אִמֵּר
  choice: ఇమ్మేరు
  rationale: హెబ్రీ వ్యక్తి పేరుకు తెలుగు లిప్యంతరీకరణ; ద్విత్వ మ ధ్వనిని నిలిపాం.
theological_decisions:
- issue: בֶּן పదం నేర కుమార సంబంధాన్నా, విస్తృత వంశసంబంధాన్నా సూచిస్తుంది?
  choice: కుమారుడు
  alternative: వంశస్థుడు
  rationale: ఈ వంశావళి నిర్మాణంలో సాధారణ, రూపపరంగా నిష్ఠగల అనువాదం ‘కుమారుడు.’ సందర్భం తప్పనిసరిగా దూర వంశస్థుడని నిర్ధారించనందున అలా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా, వంశావళి సంబంధాలు సాధారణ పాఠకునికి స్పష్టంగా ఉండేలా వాక్యాలను విభజించాం. పేర్లను అనువదించకుండా హెబ్రీ రూపాలకు దగ్గరగా లిప్యంతరీకరించాం; పాఠ్యంలో ప్రతి పేరుకు విభక్తి జోడించినప్పటికీ మూల నామరూపం గుర్తించదగినట్లుగా ఉంచాం.
