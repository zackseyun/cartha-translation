translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి శైలికి తగిన గౌరవప్రదమైన సంక్షిప్త నిర్మాణం వాడాం. తెలుగు సహజ పదక్రమం కోసం వంశపరంపరను పూర్వీకుని నుంచి ప్రధాన వ్యక్తివైపు అమర్చినా, ప్రతి ‘కుమారుడు’ సంబంధాన్ని అలాగే నిలిపాం. పాదసూచిక గుర్తును దానికి సంబంధించిన ‘నెటోఫాతీయుల గ్రామాల్లో’ అన్న పదబంధం వెంట ఉంచాం.
