reference: 1 Chronicles 9:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/עֹבַדְיָה֙ בֶּֽן שְׁמַֽעְיָ֔ה בֶּן גָּלָ֖ל בֶּן יְדוּת֑וּן וּ/בֶרֶכְיָ֤ה בֶן אָסָא֙ בֶּן אֶלְקָנָ֔ה הַ/יּוֹשֵׁ֖ב בְּ/חַצְרֵ֥י נְטוֹפָתִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/016.yaml
  text: and Obadiah son of Shemaiah[a], son of Galal, son of Jeduthun, and Berechiah son of Asa, son of Elkanah, who lived in the villages of the Netophathites.
translation:
  language: te
  text: మరియు యెదూతూను కుమారుడైన గాలాల్ కుమారుడైన షెమయా కుమారుడైన ఓబద్యా, అలాగే ఆసా కుమారుడైన ఎల్కానా కుమారుడైన బెరెక్యా, నెటోఫాతీయుల గ్రామాల్లో[a] నివసించేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నెటోఫా నివాస ప్రాంతాల్లో.’ హీబ్రూ జాతివాచక పదాన్ని ‘నెటోఫాతీయులు’ అనే ప్రజావాచకంగానో, ‘నెటోఫా’ అనే స్థలనామంగానో తెలుగులో వ్యక్తపరచవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עֹבַדְיָה
  choice: ఓబద్యా
  rationale: ముందున్న జాబితాతో సంబంధాన్ని తెలుగులో వాక్యప్రవాహం ద్వారా కొనసాగిస్తూ, వ్యక్తి పేరును హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడు / కుమారుడైన
  rationale: వంశావళి సందర్భంలో ప్రత్యక్షమైన సహజ అర్థాన్ని నిలుపుతూ ‘కుమారుడు’ అని అనువదించాం; తరాల మధ్య అంతరం ఉండే అవకాశాన్ని వచనం తానే స్పష్టపరచనందున ‘వంశస్థుడు’ అని మార్చలేదు.
- source_word: שְׁמַעְיָה
  choice: షెమయా
  rationale: వ్యక్తి పేరును ఆధునిక తెలుగు పాఠకులకు పలకడానికి అనువుగా, మూల ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించాం.
- source_word: גָּלָל
  choice: గాలాలు
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి సమీపంగా లిప్యంతరీకరించాం.
- source_word: יְדוּתוּן
  choice: యెదూతూను
  rationale: వ్యక్తి పేరును మూల రూపానికి సమీపంగా, తెలుగులో సహజంగా పలికే విధంగా లిప్యంతరీకరించాం.
- source_word: וּ/בֶרֶכְיָה
  choice: అలాగే ... బెరెక్యా
  rationale: וּ సంధి జాబితాలో మరో వ్యక్తిని కలుపుతోంది; తెలుగులో ‘అలాగే’ అని ఇవ్వడం ఆ అనుసంధానాన్ని స్పష్టంగా, సహజంగా ఉంచుతుంది.
- source_word: אָסָא
  choice: ఆసా
  rationale: ఇక్కడ ఇది కేవలం వ్యక్తి పేరు; అదనపు గుర్తింపును చేర్చకుండా లిప్యంతరీకరించాం.
- source_word: אֶלְקָנָה
  choice: ఎల్కానా
  rationale: వ్యక్తి పేరును ప్రాచుర్యంలో ఉన్న తెలుగు రూపానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: הַ/יּוֹשֵׁב
  choice: నివసించిన
  rationale: ఆర్టికల్‌తో ఉన్న హీబ్రూ కృదంతం బెరెక్యాను వివరించే సంబంధవాచక భావంలో ఉంది. తెలుగు వంశావళి వాక్యనిర్మాణంలో ‘నివసించిన’ సహజంగా ఆ నివాస సంబంధాన్ని తెలియజేస్తుంది.
- source_word: בְּ/חַצְרֵי
  choice: గ్రామాల్లో
  rationale: ఈ భౌగోళిక సందర్భంలో חָצֵר ప్రాంగణాలకన్నా చిన్న గ్రామాలు లేదా నివాస సముదాయాలను సూచిస్తుంది; ‘గ్రామాల్లో’ సాధారణ పాఠకులకు స్పష్టమైన రూపం.
- source_word: נְטוֹפָתִי
  choice: నెటోఫాతీయుల
  rationale: ఈ జాతివాచక రూపం నెటోఫాతో అనుబంధమున్న ప్రజలను సూచిస్తుంది. ‘నెటోఫాతీయుల గ్రామాలు’ మూలంలోని ప్రజావాచక నిర్మాణాన్ని నిలుపుతుంది; స్థలనామంతో అనువదించే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
