id: 1CH.9.13
reference: 1 Chronicles 9:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וַ/אֲחֵי/הֶ֗ם רָאשִׁים֙ לְ/בֵ֣ית אֲבוֹתָ֔/ם אֶ֕לֶף וּ/שְׁבַ֥ע מֵא֖וֹת וְ/שִׁשִּׁ֑ים גִּבּ֣וֹרֵי חֵ֔יל מְלֶ֖אכֶת עֲבוֹדַ֥ת בֵּית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/013.yaml
  text: And their brothers[a], heads of their fathers’ houses[c][b], were 1,760 mighty men of valor for the work of the service of the house of God.
translation:
  language: te
  text: వారి సహోదరులు[a], తమ పితృవంశ గృహాల ప్రధానులు, 1,760 మంది; వారు దేవుని గృహంలోని[c] సేవా పనికి బలసామర్థ్యాలు గలవారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వంశబంధువులు.’ ఇక్కడి హెబ్రీ పదం సొంత అన్నదమ్ములను మాత్రమే కాక, ఒకే వంశానికి చెందిన బంధువులను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పరాక్రమవంతులు,’ ‘సమర్థులు.’ ఈ పదబంధం బలం లేదా నిరూపిత సామర్థ్యాన్ని గౌరవార్థకంగా సూచిస్తుంది; ఈ సందర్భంలో అది తప్పనిసరిగా యుద్ధవీరులనే సూచించదు.
    reason: lexical_alternative
  - marker: c
    text: అంటే దేవాలయం.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: వారి సహోదరులు
  rationale: ఆఖ్ అనే హెబ్రీ పదం ఇక్కడ సొంత అన్నదమ్ములను మాత్రమే కాక విస్తృత వంశబంధువులను కూడా సూచించవచ్చు. మూలంలోని కుటుంబసంబంధ పదాన్ని నిలుపుతూ సహజమైన తెలుగు రూపాన్ని ఎంచుకున్నాం.
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: తమ పితృవంశ గృహాలకు అధిపతులు
  rationale: ఇది వంశావళి, పరిపాలన సందర్భాల్లో వాడే స్థిరమైన పదబంధం. ‘పితృవంశ గృహాలు’ అనే రూపం మూలంలోని בית אבות కుటుంబ-వంశ వ్యవస్థను కేవలం ‘కుటుంబాలు’గా కుదించకుండా తెలియజేస్తుంది.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: 1,760 మంది
  rationale: హెబ్రీ సంఖ్యా క్రమం నేరుగా 1,760ను సూచిస్తుంది; వ్యక్తుల సంఖ్య కావడంతో ‘మంది’ చేర్చడం సహజ తెలుగు.
- source_word: גִּבּוֹרֵי חֵיל
  choice: శక్తిసామర్థ్యాలు గలవారు
  rationale: ఈ గౌరవార్థక పదబంధం బలం, సామర్థ్యం, నిరూపిత యోగ్యతలను సూచించగలదు. సందర్భం యుద్ధం కాక దేవాలయ సేవ కాబట్టి ‘యోధులు’ అనే పరిమిత అర్థాన్ని రుద్దకుండా దాని బలమైన ప్రశంసాత్మక భావాన్ని నిలిపాం.
- source_word: מְלֶאכֶת עֲבוֹדַת
  choice: సేవాపని చేయడానికి
  rationale: מְלָאכָהలోని ‘పని’ భావాన్నీ עֲבוֹדָהలోని ‘సేవ’ భావాన్నీ ‘సేవాపని’ అనే సహజ సమాసంలో నిలిపాం.
- source_word: בֵּית הָאֱלֹהִים
  choice: దేవుని గృహం
  rationale: మూలంలో అక్షరార్థంగా ‘దేవుని గృహం’ ఉంది. ఇది దేవాలయాన్ని సూచించినప్పటికీ, హెబ్రీ రూపకాన్ని మరియు దాని ఆధ్యాత్మిక ప్రతిధ్వనిని నిలిపాం.
theological_decisions:
- issue: పురుష బహువచనంలో వంశబంధ పదం
  choice: సహోదరులు
  alternative: వంశబంధువులు
  rationale: ఈ యాజక వంశావళి సందర్భంలో పురుష కుటుంబాధిపతులు, పురుష సేవకులే ఉద్దేశించబడ్డారు. అందువల్ల మూలంలోని పురుష కుటుంబసంబంధ పదాన్ని తటస్థీకరించకుండా ఉంచాం; దాని విస్తృత అర్థాన్ని పాదటిప్పణిలో తెలిపాం.
- issue: దేవాలయానికి వాడిన పదం
  choice: దేవుని గృహం
  alternative: దేవుని ఆలయం
  rationale: మూలపాఠం ‘గృహం’ అనే పదాన్నే ఉపయోగిస్తుంది. అది ఆలయాన్ని సూచిస్తుందని పాదటిప్పణి స్పష్టం చేస్తుంది; ప్రధాన పాఠం మాత్రం మూలంలోని దైవశాస్త్రీయ రూపకాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని అనుసరించాం. మూలంలోని వంశపరమైన పరిపాలనా భాషను నిలుపుతూ, ‘సేవాపని’ మరియు ‘శక్తిసామర్థ్యాలు’ వంటి సహజ పదాలతో యుద్ధసంబంధ అర్థాన్ని అనవసరంగా రుద్దకుండా చూశాం.
