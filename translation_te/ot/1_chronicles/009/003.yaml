source:
  edition: WLC
  text: וּ/בִ/ירוּשָׁלִַ֨ם֙ יָשְׁב֔וּ מִן בְּנֵ֥י יְהוּדָ֖ה וּ/מִן בְּנֵ֣י בִנְיָמִ֑ן וּ/מִן בְּנֵ֥י אֶפְרַ֖יִם וּ/מְנַשֶּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/003.yaml
  text: And in Jerusalem some from the sons of Judah, and some from the sons of Benjamin, and some from the sons of Ephraim and Manasseh, lived there.
translation:
  language: te
  text: యెరూషలేములోనూ యూదా సంతతివారిలో కొందరు, బెన్యామీను సంతతివారిలో కొందరు, ఎఫ్రాయిము మరియు మనష్షే సంతతివారిలో కొందరు[a] నివసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూ భాషలో అక్షరార్థంగా, “యూదా కుమారులలోనుండి … బెన్యామీను కుమారులలోనుండి … ఎఫ్రాయిము, మనష్షే కుమారులలోనుండి.”
    reason: గోత్ర సంబంధాన్ని తెలిపే בני అనే హీబ్రూ పదబంధం యొక్క అక్షరార్థ రూపాన్ని చూపించడానికి.
lexical_decisions:
- source_word: וּ/בִ/ירוּשָׁלִַם
  choice: యెరూషలేములోనూ
  rationale: వావ్ సంధానార్థాన్ని ‘నూ’ ద్వారా ముందటి సందర్భంతో అనుసంధానిస్తూ, బి ఉపసర్గలోని స్థలార్థాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: יָשְׁבוּ
  choice: నివసించారు
  rationale: ישב ఇక్కడ స్థిరంగా ఉండడం లేదా నివాసం చేయడం అనే అర్థంలో ఉంది; ‘నివసించారు’ గౌరవప్రదమైన, సహజమైన తెలుగు రూపం.
- source_word: מִן
  choice: వారిలో కొందరు
  rationale: ప్రతి గోత్ర సమూహం నుండి కొంతమంది మాత్రమే విషయమని తెలుగులో స్పష్టమైన కర్తగా సహజంగా తెలియజేస్తుంది; మొత్తం గోత్రం నివసించిందనే భావాన్ని కలిగించదు.
- source_word: בְּנֵי יְהוּדָה / בְּנֵי בִנְיָמִן / בְּנֵי אֶפְרַיִם וּמְנַשֶּׁה
  choice: యూదా / బెన్యామీను / ఎఫ్రాయిము, మనష్షే సంతతివారు
  rationale: בני అనే గోత్ర-వంశ సంబంధ పదబంధాన్ని పదశః ‘కుమారులు’ అని కాకుండా, ఆధునిక తెలుగులో దాని సందర్భార్థాన్ని సహజంగా తెలిపే ‘సంతతివారు’గా అనువదించింది. మనష్షేకు בני పునరుక్తం కాకపోయినా, సమన్వయ నిర్మాణంలో అది రెండింటికీ వర్తిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. హీబ్రూ వాక్యంలోని గోత్రాల పునరుక్త నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపి, తెలుగులో స్పష్టమైన కర్త కోసం ‘కొందరు’ చేర్చబడింది.
