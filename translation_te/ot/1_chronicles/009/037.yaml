  text: గెదోర్, అహ్యో, జెకర్యా, మిక్లోత్.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/גְד֣וֹר
  choice: గెదోరు
  rationale: వావ్ సంధిని జాబితా నిర్మాణం ద్వారా సహజంగా వ్యక్తం చేసి, גְדוֹר అనే వ్యక్తి పేరును తెలుగు ధ్వనులకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: וְ/אַחְי֔וֹ
  choice: అహీయో
  rationale: אַחְיוֹ అనే వ్యక్తి పేరును అనువదించకుండా, హీబ్రూ ఉచ్చారణను సమీపించే విధంగా తెలుగులో లిప్యంతరీకరించాం.
- source_word: וּ/זְכַרְיָ֖ה
  choice: జెకర్యా
  rationale: זְכַרְיָה అనే పేరుకు ఆధునిక తెలుగు బైబిలు శైలిలో సులభంగా చదవదగిన లిప్యంతరీకరణను వాడాం; పేరులోని దైవనామ సంబంధ రూపాన్ని విడిగా వ్యాఖ్యానించలేదు.
- source_word: וּ/מִקְלֽוֹת
  choice: మిక్లోతు
  rationale: מִקְלוֹת అనే వ్యక్తి పేరును తెలుగు పదాంత ఉచ్చారణకు సహజంగా ఉండేలా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి పేర్ల జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. హీబ్రూలో ప్రతి పేరుకు ముందు ఉన్న వావ్ సంధిని తెలుగులో పదేపదే “మరియు” అని పునరావృతం చేయకుండా, విరామచిహ్నాలతో సహజమైన జాబితాగా వ్యక్తం చేశాం.
