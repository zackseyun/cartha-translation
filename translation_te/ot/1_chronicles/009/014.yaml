translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన గౌరవప్రద శైలి. పేర్లు హీబ్రూ ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించబడ్డాయి.
