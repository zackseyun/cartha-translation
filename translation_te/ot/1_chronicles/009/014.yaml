    issue: ‘కుమారుడు’ల గొలుసును ‘మనుమడు, మునిమనుమడు’గా మార్చారు.
    rationale: హీబ్రూ పాఠంలో ప్రతి సంబంధానికి בֶן (‘కుమారుడు’) ఉంది. వంశావళుల్లో ఇది కొన్నిసార్లు విస్తృత సంతతి సంబంధాన్ని సూచించవచ్చు; కనుక అక్షరార్థ తరాల దూరాన్ని నిర్దిష్టంగా చెప్పకూడదు.
  - severity: low
