revisions:
- from: లేవీయులలో మెరారీ కుమారుల వంశానికి చెందిన హష్షూబు కుమారుడు, అజ్రీకాము మనుమడు, హషబ్యా మునిమనుమడు అయిన షెమయా[a].
  to: 'మరియు లేవీయులలోనుండి: మెరారీ కుమారులవారికి చెందిన హషబ్యా కుమారుడు అజ్రీకాము, అతని కుమారుడు హష్షూబు, అతని కుమారుడు షెమయా.'
  rationale: 'సవరణ హీబ్రూ సంబంధక్రమాన్ని పూర్తిగా కాపాడుతుంది: షెమయా—హష్షూబు కుమారుడు—అజ్రీకాము కుమారుడు—హషబ్యా కుమారుడు; అతడు మెరారీ కుమారులవారిలోనివాడు. తెలుగు సహజ క్రమం కోసం పూర్వీకుని నుండి తరువాతి వ్యక్తికి పేర్లను అమర్చాం, కానీ ‘అతని కుమారుడు’ ద్వారా ప్రతి בֶן సంబంధాన్ని యథాతథంగా నిలిపాం. వంశపరంగా విస్తృతార్థం కలిగే అవకాశం ఉన్న చోట ‘మనుమడు/మునిమనుమడు’ వంటి నిర్దిష్ట తరాల పదాలను తొలగించాం.'
  reviewer_model: gpt-5.6-terra
