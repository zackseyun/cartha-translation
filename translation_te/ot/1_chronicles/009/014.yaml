  text: וּ/מִֽן הַ/לְוִיִּ֑ם שְׁמַֽעְיָ֧ה בֶן חַשּׁ֛וּב בֶּן עַזְרִיקָ֥ם בֶּן חֲשַׁבְיָ֖ה מִן בְּנֵ֥י מְרָרִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/014.yaml
  text: 'And from the Levites: Shemaiah son of Hasshub[a], son of Azrikam, son of Hashabiah, from the sons of Merari.'
translation:
  language: te
  text: 'మరియు లేవీయులలోనుండి: మెరారీ కుమారులవారికి చెందిన హషబ్యా కుమారుడు అజ్రీకాము, అతని కుమారుడు హష్షూబు, అతని కుమారుడు షెమయా.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִן הַ/לְוִיִּם
  choice: లేవీయులలో
  rationale: ముందటి జాబితాకు అనుసంధానించే וּను తెలుగు జాబితా ప్రవాహంలో సహజంగా అంతర్లీనంగా ఉంచి, מִן‌ను ‘లో’ అని అనువదించాం.
- source_word: שְׁמַעְיָה
  choice: షెమయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు లిపిలో ధ్వన్యనుసారంగా అందించాం.
- source_word: בֶן חַשּׁוּב בֶּן עַזְרִיקָם בֶּן חֲשַׁבְיָה
  choice: హష్షూబు కుమారుడు, అజ్రీకాము మనుమడు, హషబ్యా మునిమనుమడు
  rationale: వంశావళి శ్రేణిని తెలుగులో సహజంగా, తరాల సంబంధం స్పష్టంగా ఉండేలా అందించాం; మూలంలోని ప్రతి בֶן సూచించే వరుస సంబంధాన్ని నిలిపాం.
- source_word: מִן בְּנֵי מְרָרִי
  choice: మెరారీ కుమారుల వంశానికి చెందిన
  rationale: ఇక్కడ בְּנֵי ఒక విస్తృత గోత్ర/వంశ సమూహాన్ని సూచిస్తుంది; ‘కుమారుల వంశం’ రూపం మూలంలోని ‘కుమారులు’ అనే భావాన్ని మరియు విస్తృత వంశార్థాన్ని రెండింటినీ కాపాడుతుంది.
