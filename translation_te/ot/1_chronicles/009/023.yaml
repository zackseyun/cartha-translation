  yaml_path: translation/ot/1_chronicles/009/023.yaml
  text: They and their sons were over the gates of the house of Yahweh[a], that is, the house of the tent, as guards.
translation:
  language: te
  text: వారూ వారి కుమారులూ కాపలా విధుల కోసం యెహోవా మందిరపు, అంటే గుడారపు ఇంటి, ద్వారాల బాధ్యత వహించేవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మూలభాషలో: “గుడారపు ఇల్లు.” లేదా: “గుడారపు మందిరం.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם וּבְנֵיהֶם
  choice: వారూ వారి కుమారులూ
  rationale: సముచ్చయంతో కూడిన సర్వనామాన్ని సహజమైన తెలుగు వాక్యారంభంగా అందిస్తూ, בניםను వంశపారంపర్య పురుష సేవకులను సూచించే ‘కుమారులు’గా అనువదించాం.
- source_word: עַל הַשְּׁעָרִים
  choice: ద్వారాల బాధ్యత వహించారు
  rationale: ఈ పరిపాలనా సందర్భంలో עַל కేవలం ద్వారాల దగ్గర ఉండడాన్ని కాక వాటిపై పర్యవేక్షణ, బాధ్యతను సూచిస్తుంది.
- source_word: לְבֵית יְהוָה
  choice: యెహోవా మందిరపు
  rationale: ఈ పదబంధం ద్వారాలు యెహోవా ఆరాధనాస్థలానికి చెందినవని సూచిస్తుంది; దైవనామాన్ని ‘యెహోవా’గా లిప్యంతరీకరించాం.
- source_word: לְבֵית הָאֹהֶל
  choice: గుడారపు మందిరానికి
  rationale: ‘గుడారపు ఇల్లు’ అనే హీబ్రూ రూపాన్ని తెలుగులో అర్థమయ్యేలా అందిస్తూ, మందిరం–గుడార పరిశుద్ధస్థలం మధ్య ఉన్న సంబంధాన్ని చెరపకుండా ఉంచుతుంది.
- source_word: לְמִשְׁמָרוֹת
  choice: కాపలాదారులుగా
  rationale: ఈ నామవాచకం కాపలా సేవ లేదా పహారా బాధ్యతను సూచిస్తుంది; ఆధునిక తెలుగులో పాత్రను స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘యెహోవా మందిరం’ మరియు ‘గుడారపు మందిరం’ మధ్య సంబంధం
  choice: రెండవ పదబంధాన్ని మొదటిదానికి వివరణాత్మక సమానార్థక సూచనగా ‘అంటే’తో కలిపి, రెండు వ్యక్తీకరణలనూ నిలిపాం.
  alternative: ‘గుడారపు మందిరం’ను కేవలం ‘ప్రత్యక్ష గుడారం’గా మార్చడం, లేదా రెండింటిని వేర్వేరు స్థలాలుగా చూపడం.
  rationale: మూలపాఠం ప్రస్తుత మందిరసేవకు పూర్వపు గుడార పరిశుద్ధస్థలంతో ఉన్న కొనసాగింపును సూచించవచ్చు. రెండు పదబంధాలను ఉంచడం వల్ల ఆ చారిత్రక-దైవశాస్త్రీయ ఉద్వేగం ముందుగానే పరిష్కరించబడదు.
translation_notes:
  register: సామాన్య ఆధునిక పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ప్రామాణిక తెలుగు. ‘బాధ్యత వహించారు’ పర్యవేక్షణ భావాన్ని సహజంగా తెలుపుతుంది; ‘గుడారపు మందిరం’ మూలంలోని అసాధారణ సమాసాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
