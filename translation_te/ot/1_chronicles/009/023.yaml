revisions:
- from: వారూ వారి కుమారులూ యెహోవా మందిరపు ద్వారాల బాధ్యత వహించారు—అంటే, గుడారపు మందిరానికి కాపలాదారులుగా ఉన్నారు.[a]
  to: వారూ వారి కుమారులూ కాపలా విధుల కోసం యెహోవా మందిరపు, అంటే గుడారపు ఇంటి, ద్వారాల బాధ్యత వహించేవారు.[a]
  rationale: The revision keeps the two sanctuary expressions in apposition and makes both modify “doors,” while preserving the Hebrew’s guard-service nuance. It removes the unsupported “ప్రత్యక్ష” interpretation from the footnote.
