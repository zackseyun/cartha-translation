base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/027.yaml
  text: They spent the night around the house of God[a], because the duty of guarding it was upon them, and they were in charge of opening it morning by morning.
translation:
  language: te
  text: వారు దేవుని మందిరం చుట్టూ రాత్రి బసచేసేవారు; ఎందుకంటే దానికి కాపలా కాసే బాధ్యత వారిమీద ఉండేది. ప్రతి ఉదయం దాన్ని తెరవాల్సిన బాధ్యత కూడా వారిదే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “వారు తాళంచెవికి బాధ్యులుగా ఉండేవారు.” హీబ్రూ మాట తాళంచెవిని భద్రపరిచే బాధ్యతనైనా, దేవుని మందిరాన్ని తెరిచే బాధ్యతనైనా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּסְבִיבוֹת
  choice: చుట్టూ
  rationale: దేవుని మందిరాన్ని చుట్టుముట్టిన పరిసర ప్రాంతాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరం
  rationale: అక్షరార్థంగా ‘దేవుని ఇల్లు’; ఇక్కడ ఆలయ సముదాయాన్ని సూచిస్తున్నందున తెలుగులో గౌరవప్రదంగా, సహజంగా ‘దేవుని మందిరం’ అని ఇచ్చాం.
- source_word: יָלִינוּ
  choice: రాత్రి బసచేసేవారు
  rationale: రాత్రంతా అక్కడ ఉండడం లేదా బసచేయడం అనే భావాన్ని తెలియజేస్తుంది; కేవలం నిద్రపోయారని పరిమితం చేయదు.
- source_word: עֲלֵיהֶם מִשְׁמֶרֶת
  choice: దానికి కాపలా కాసే బాధ్యత వారిమీద ఉండేది
  rationale: ‘వారిమీద కావలి ఉండేది’ అనే హీబ్రూ ప్రయోగంలోని అప్పగించబడిన బాధ్యత భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: וְהֵם עַל הַמַּפְתֵּחַ
  choice: దాన్ని తెరవాల్సిన బాధ్యత కూడా వారిదే
  rationale: అక్షరార్థంగా ‘వారు తాళంచెవిమీద ఉండేవారు’; సందర్భంలో తాళంచెవి సంరక్షణ లేదా మందిరాన్ని తెరవడం అనే పరిపాలనా బాధ్యతను సూచించవచ్చు. ప్రధాన పాఠ్యంలో ఉదయానుదయం తెరవడం అనే సందర్భోచిత భావాన్ని ఇచ్చి, అస్పష్టతను పాదసూచికలో ఉంచాం.
- source_word: וְלַבֹּקֶר לַבֹּקֶר
  choice: ప్రతి ఉదయం
  rationale: పునరావృతమయ్యే దైనందిన చర్యను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
