  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ఆలయ కావలి సందర్భంలో ‘బసచేసేవారు’, ‘కాపలా కాసే బాధ్యత’ వంటి సాధారణంగా అర్థమయ్యే పదబంధాలు ఎంచుకోబడ్డాయి; הַמַּפְתֵּחַ లోని నిజమైన భావసందిగ్ధత పాదసూచికలో నిలుపబడింది.
