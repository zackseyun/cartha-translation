source:
  edition: WLC
  text: כִּ֣י בֶ/אֱמוּנָ֞ה הֵ֗מָּה אַרְבַּ֨עַת֙ גִּבֹּרֵ֣י הַ/שֹּׁעֲרִ֔ים הֵ֖ם הַ/לְוִיִּ֑ם וְ/הָיוּ֙ עַל הַ/לְּשָׁכ֔וֹת וְ/עַ֥ל הָ/אֹצְר֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/026.yaml
  text: For these four mighty gatekeepers[a], who were Levites[b], were entrusted with the chambers and with the storehouses of the house of God.
translation:
  language: te
  text: ఎందుకంటే లేవీయులైన ఈ నలుగురు సమర్థులైన ద్వారపాలకులు విశ్వసనీయులుగా ఉండి, దేవుని మందిరంలోని గదులపై, భాండాగారాలపై బాధ్యత కలిగివుండేవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “విశ్వసనీయులుగా” అనే మాటకు “నమ్మకంగా” అని కూడా అనువదించవచ్చు; హీబ్రూ పదం వారి బాధ్యతలోని నమ్మకత్వాన్ని నొక్కి చెబుతుంది. “భాండాగారాలు” అనే పదానికి “నిల్వగదులు” లేదా “ధనాగారాలు” అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని విధుల ఏర్పాటుకు వివరణను పరిచయం చేస్తుంది; తెలుగు వాక్యప్రవాహంలో కారణార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: בֶאֱמוּנָה
  choice: నమ్మకమైన బాధ్యతలో ఉన్నారు
  rationale: אֱמוּנָה లోని నమ్మకత్వం/విశ్వసనీయత భావాన్ని, అధికారిక బాధ్యత అప్పగించబడిన సందర్భంతో కలిపి వ్యక్తం చేస్తుంది; దానిని కేవలం ‘అప్పగించబడ్డారు’ అని చేసి మూలంలోని నమ్మకత్వ భావాన్ని కోల్పోకుండా చూస్తుంది.
- source_word: אַרְבַּעַת גִּבֹּרֵי הַשֹּׁעֲרִים
  choice: ఆ నలుగురు ప్రధాన ద్వారపాలకులు
  rationale: గִּבּוֹרֵי ఇక్కడ శౌర్యం కంటే ప్రాముఖ్యత, సామర్థ్యం లేదా ఉన్నత బాధ్యతను సూచించే అవకాశం ఎక్కువ; ‘ప్రధాన’ అనేది ఆలయ పరిపాలనా సందర్భంలో సహజంగా ఉంటుంది.
- source_word: הֵם הַלְוִיִּם
  choice: లేవీయులైన
  rationale: ద్వారపాలకులను లేవీయులుగా గుర్తించే సమానాధికార వాక్యభాగాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: וְהָיוּ עַל
  choice: బాధ్యులుగా ఉండేవారు
  rationale: עַל తో היה పర్యవేక్షణ లేదా బాధ్యతను సూచిస్తుంది; తెలుగు పరిపాలనా సందర్భంలో ఈ రూపం స్పష్టంగా ఉంటుంది.
- source_word: הַלְּשָׁכוֹת
  choice: గదులు
  rationale: ఆలయ సేవకు సంబంధించిన గదులను సూచిస్తుంది; ఆధునిక సాధారణ పాఠకులకు ‘గదులు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: הָאֹצְרוֹת
  choice: భాండాగారాలు
  rationale: אֹצָר లోని నిల్వగది మరియు ధనాగారం అనే రెండు సాధ్య భావాలనూ కొంతవరకు కలిగి ఉండే గౌరవప్రదమైన విస్తృత పదం.
- source_word: בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరం
  rationale: అక్షరార్థమైన ‘దేవుని ఇల్లు’ యొక్క ఆలయసంబంధ సూచనను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
