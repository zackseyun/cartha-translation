  register: ఆధునిక ప్రామాణిక తెలుగులో, ఆలయ పరిపాలనా సందర్భానికి తగిన గౌరవప్రదమైన కానీ సులభంగా అర్థమయ్యే శైలి. ‘ప్రధాన’ అనేది גִּבּוֹרֵי యొక్క సందర్భార్థాన్ని అందిస్తుంది; ‘నమ్మకమైన బాధ్యతలో’ మూలంలోని విశ్వసనీయత భావాన్ని స్పష్టంగా నిలుపుతుంది.
