id: 1CH.9.7
reference: 1 Chronicles 9:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מִן בְּנֵ֖י בִּנְיָמִ֑ן סַלּוּא֙ בֶּן מְשֻׁלָּ֔ם בֶּן הוֹדַוְיָ֖ה בֶּן הַ/סְּנֻאָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/007.yaml
  text: 'And from the sons of Benjamin: Sallu son of Meshullam[a], son of Hodaviah[c][b], son of Hassenuah.'
translation:
  language: te
  text: 'మరియు బెన్యామీను కుమారులలోనుండి: మెషుల్లాము కుమారుడైన సల్లూ, హోదవ్యా కుమారుడైన మెషుల్లాము, హస్సెనూవా కుమారుడైన హోదవ్యా.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో వంశావళి అంతటా ‘కుమారుడు’ అనే పదం పునరావృతమవుతుంది. అది నేరుగా కుమారుణ్ణి గానీ, మరింత విస్తృతమైన వంశస్థుణ్ణి గానీ సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִן
  choice: కుమారులలో
  rationale: מִן యొక్క ‘నుండి/లోనుండి’ భావాన్ని జాబితా సందర్భంలో సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; וְ ముందటి వాక్యంతో అనుసంధానిస్తుంది, అయితే తెలుగు జాబితాలో ప్రత్యేకంగా ‘మరియు’ అవసరం లేదు.
- source_word: בְּנֵי בִּנְיָמִן
  choice: బెన్యామీను కుమారులు
  rationale: మూలంలోని వంశావళి నుడికారాన్ని నిలుపుతుంది; ఇక్కడ ఇది బెన్యామీను గోత్రానికి చెందినవారిని సూచిస్తుంది.
- source_word: סַלּוּא
  choice: సల్లూ
  rationale: హీబ్రూ పేరుకు తెలుగు ధ్వన్యంతరీకరణ.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశావళిలో పదేపదే వచ్చే בֶּן‌ను యథాశక్తి స్పష్టంగా నిలుపుతుంది; ఇది ప్రత్యక్ష కుమారుణ్ణి లేదా విస్తృత వంశసంబంధాన్ని సూచించవచ్చు.
- source_word: מְשֻׁלָּם
  choice: మెషుల్లాము
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగు ధ్వన్యంతరీకరణ.
- source_word: הוֹדַוְיָה
  choice: హోదవ్యా
  rationale: WLC మసొరేతు పాఠంలోని రూపాన్ని అనుసరించిన ధ్వన్యంతరీకరణ.
- source_word: הַסְּנֻאָה
  choice: హస్సెనూవా
  rationale: ఈ వంశావళి సందర్భంలో వ్యక్తినామంగా గ్రహించి, హీబ్రూ ఉచ్చారణలోని ద్విత్వ స్ ధ్వనిని ప్రతిబింబించేలా ధ్వన్యంతరీకరించబడింది.
theological_decisions:
- issue: వంశావళిలో בֶּן సూచించే సంబంధం
  choice: ప్రధాన పాఠంలో ‘కుమారుడు’ అని అనువదించి, దాని విస్తృత వంశార్థ సాధ్యతను పాదటిప్పణిలో ఉంచడం
  alternative: ప్రతి చోట ‘వంశస్థుడు’ అని అనువదించడం
  rationale: మూలపాఠపు అధికారిక వంశావళి రూపాన్ని కాపాడుతూ, తరాలు సంక్షిప్తమై ఉండగల నిజమైన అనిశ్చితిని కూడా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలి. సంబంధాల అస్పష్టతను తొలగించకుండా, తెలుగు పాఠకుడికి క్రమం స్పష్టంగా ఉండేందుకు రెండవ ఉపవాక్యం విప్పి చెప్పబడింది.
