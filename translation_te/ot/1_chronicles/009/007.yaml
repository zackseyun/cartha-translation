revisions:
- from: 'బెన్యామీను కుమారులలో: మెషుల్లాము కుమారుడైన సల్లూ; మెషుల్లాము హోదవ్యా కుమారుడు, హోదవ్యా హస్సెనూవా కుమారుడు.[a]'
  to: 'మరియు బెన్యామీను కుమారులలోనుండి: మెషుల్లాము కుమారుడైన సల్లూ, హోదవ్యా కుమారుడైన మెషుల్లాము, హస్సెనూవా కుమారుడైన హోదవ్యా.[a]'
  rationale: The revision restores the full Hebrew genealogical sequence by explicitly linking each named person to the next ancestor, while retaining the formal genealogical register and the source's possible breadth of ‘son’ in the existing footnote. It also represents the opening conjunction.
