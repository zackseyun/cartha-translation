  text: וּ/מוֹצָ֖א הוֹלִ֣יד אֶת בִּנְעָ֑א וּ/רְפָיָ֥ה בְנ֛/וֹ אֶלְעָשָׂ֥ה בְנ֖/וֹ אָצֵ֥ל בְּנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/043.yaml
  text: And Moza fathered Binea[a], and his son was Rephaiah, his son Eleasah, his son Azel.
translation:
  language: te
  text: మోజా బిన్యాను కన్నాడు; రెఫాయా అతని కుమారుడు, ఎల్యాశా అతని కుమారుడు, ఆజేలు అతని కుమారుడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹצָא
  choice: మోజా
  rationale: వ్యక్తి పేరు; మసొరేటిక్ స్వరూపానికి అనుగుణంగా తెలుగులో లిప్యంతరీకరించబడింది.
- source_word: הוֹלִיד
  choice: కన్నాడు
  rationale: వంశావళి సందర్భంలో హిఫిల్ రూపం ఒకరికి తండ్రి కావడం లేదా కనడం అనే భావాన్ని ఇస్తుంది; ‘కన్నాడు’ సంక్షిప్తమైన, సహజమైన తెలుగు ప్రయోగం.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: ఇది ప్రత్యక్ష కర్మ సూచిక; తెలుగులో దీనికి విడిగా సమాన పదం అవసరం లేదు.
- source_word: בִּנְעָא
  choice: బిన్యా
  rationale: మసొరేటిక్ పఠనాన్ని ప్రతిబింబించే వ్యక్తి పేరు; తెలుగులో సహజంగా లిప్యంతరీకరించబడింది.
- source_word: וּרְפָיָה בְנוֹ
  choice: రెఫాయా అతని కుమారుడు
  rationale: హీబ్రూలో క్రియలేని వంశావళి పదబంధాన్ని దాని సంక్షిప్త నిర్మాణంతోనే తెలుగులో సహజంగా ఉంచుతుంది.
- source_word: אֶלְעָשָׂה בְנוֹ
  choice: ఎల్యాశా అతని కుమారుడు
  rationale: ‘అతని కుమారుడు’ అనే పునరుక్తిని నిలిపి, వంశపరంపరను స్పష్టంగా చూపిస్తుంది.
- source_word: אָצֵל בְנוֹ
  choice: ఆజేలు అతని కుమారుడు
  rationale: చివరి వంశావళి సభ్యుని పేరును లిప్యంతరీకరించి, కుమార సంబంధాన్ని యథాతథంగా నిలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గంభీర శైలి. మూలంలోని మొదటి క్రియ తర్వాత వచ్చే క్రియలేని ‘అతని కుమారుడు’ శ్రేణిని నిలిపి, అనవసరంగా ‘అయ్యాడు/ఉన్నాడు’ వంటి క్రియలను చేర్చలేదు.
