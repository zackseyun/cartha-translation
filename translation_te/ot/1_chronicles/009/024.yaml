  text: לְ/אַרְבַּ֣ע רוּח֔וֹת יִהְי֖וּ הַ/שֹּׁעֲרִ֑ים מִזְרָ֥ח יָ֖מָּ/ה צָפ֥וֹנָ/ה וָ/נֶֽגְבָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/024.yaml
  text: 'The gatekeepers were at the four directions: east[a], west, north, and south.'
translation:
  language: te
  text: ద్వారపాలకులు నాలుగు దిక్కుల్లో—తూర్పు[a], పడమర, ఉత్తరం, దక్షిణం—ఉండేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో అక్షరార్థంగా, “నాలుగు గాలులకు”; ఇక్కడ “గాలులు” అంటే నాలుగు దిక్కులు లేదా దిక్భాగాలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַרְבַּע רוּחוֹת
  choice: నాలుగు దిక్కుల్లో
  rationale: అక్షరార్థంగా ‘నాలుగు గాలులకు’ అయినా, వెంటనే వచ్చే నాలుగు ప్రధాన దిక్కుల జాబితా కారణంగా ఇక్కడ ప్రదేశసూచకంగా ‘నాలుగు దిక్కుల్లో’ అని సహజంగా అనువదించాం.
- source_word: יִהְיוּ
  choice: ఉండేవారు
  rationale: హీబ్రూ క్రియ సాధారణంగా ‘ఉండడం’ను తెలుపుతుంది; నియమించబడ్డారు లేదా నిలబెట్టబడ్డారు అనే భావాన్ని అదనంగా చేర్చకుండా సందర్భానుసార గతకాల రూపాన్ని వాడాం.
- source_word: הַשֹּׁעֲרִים
  choice: ద్వారపాలకులు
  rationale: ద్వారాల బాధ్యత వహించి వాటిని కాపాడే వ్యక్తులను సూచించే ప్రామాణికమైన, సహజమైన తెలుగు పదం.
- source_word: מִזְרָח יָמָּה צָפוֹנָה וָנֶגְבָּה
  choice: తూర్పు, పడమర, ఉత్తరం, దక్షిణం
  rationale: ఇవి వరుసగా నాలుగు ప్రధాన దిక్కులను సూచిస్తున్నాయి. יָמָּה అక్షరార్థంగా ‘సముద్రం వైపు,’ נֶגְבָּה ‘నెగెవు/దక్షిణం వైపు’ అయినప్పటికీ ఈ జాబితాలో సాధారణ దిక్సూచకాలే ఉద్దేశ్యం.
