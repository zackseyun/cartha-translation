translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. హీబ్రూ వాక్యంలోని సరళమైన స్థితి భావాన్ని నిలుపుతూ అనవసరంగా ‘నియమించబడ్డారు’ అనే అర్థాన్ని చేర్చలేదు.
