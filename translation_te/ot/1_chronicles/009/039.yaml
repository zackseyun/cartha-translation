id: 1CH.9.39
reference: 1 Chronicles 9:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/נֵר֙ הוֹלִ֣יד אֶת קִ֔ישׁ וְ/קִ֖ישׁ הוֹלִ֣יד אֶת שָׁא֑וּל וְ/שָׁא֗וּל הוֹלִ֤יד אֶת יְהֽוֹנָתָן֙ וְ/אֶת מַלְכִּי שׁ֔וּעַ וְ/אֶת אֲבִינָדָ֖ב וְ/אֶת אֶשְׁבָּֽעַל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/039.yaml
  text: Ner fathered Kish[a], and Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal.
translation:
  language: te
  text: నేరు కీషుకు తండ్రి అయ్యాడు; కీషు సౌలుకు తండ్రి అయ్యాడు; సౌలు యోనాతాను, మల్కీ-షూవా, అబీనాదాబు, ఎష్బయలు[a]లకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2 సమూయేలు 2:8లోను, దానికి సంబంధించిన ఇతర వాక్యభాగాల్లోను ఎష్బయలు ‘ఇష్బోషెతు’ అని పిలువబడ్డాడు.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో హిఫిల్ రూపం ఒక పురుషుడు సంతానానికి తండ్రి కావడాన్ని సూచిస్తుంది. ‘తండ్రి అయ్యాడు’ అనేది పాతకాలపు ‘కనెను’ కంటే ఆధునిక పాఠకులకు సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: נֵר
  choice: నేరు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగులో సహజంగా లిప్యంతరీకరించింది.
- source_word: קִישׁ
  choice: కీషు
  rationale: హీబ్రూ వ్యక్తినామానికి ప్రాచుర్యంలో ఉన్న తెలుగు రూపం.
- source_word: שָׁאוּל
  choice: సౌలు
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపం.
- source_word: יְהוֹנָתָן
  choice: యోనాతాను
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపం.
- source_word: מַלְכִּי שׁוּעַ
  choice: మల్కీ-షూవ
  rationale: హీబ్రూలో రెండు భాగాలుగా కనిపించినా ఇది ఒక వ్యక్తినామం; సంయుక్త నామ స్వరూపాన్ని చూపడానికి మధ్యగీత ఉంచింది.
- source_word: אֲבִינָדָב
  choice: అబీనాదాబు
  rationale: హీబ్రూ వ్యక్తినామానికి తెలుగులో సుపరిచితమైన రూపం.
- source_word: אֶשְׁבָּעַל
  choice: ఎష్బయలు
  rationale: దినవృత్తాంతాల హీబ్రూ మూలపాఠంలోని పేరునే అనుసరించింది; సమూయేలు గ్రంథంలోని భిన్న నామరూపంతో సమన్వయం చేయలేదు.
- source_word: וְ
  choice: మరియు అనే భావాన్ని విరామచిహ్నాలు, జాబితా నిర్మాణం ద్వారా తెలిపింది
  rationale: పునరావృత సంధులను తెలుగు సహజ వాక్య నిర్మాణంలో సెమీకోలన్లు, కామాలతో వ్యక్తం చేసింది; వంశక్రమం మాత్రం యథాతథంగా నిలిచింది.
- source_word: אֶת
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: ఇది హీబ్రూ ప్రత్యక్ష కర్మ సూచకం; తెలుగులో దీనికి స్వతంత్ర పదసమానం అవసరం లేదు, విభక్తి రూపాల్లో దాని వాక్యనిర్మాణ పాత్ర వ్యక్తమవుతుంది.
theological_decisions:
- issue: ఎష్బయలు అనే పేరు, సమూయేలు గ్రంథంలోని ఇష్బోషెతు అనే పేరు మధ్య సంబంధం
  choice: ప్రధాన పాఠంలో దినవృత్తాంతాల మూలరూపమైన ‘ఎష్బయలు’ ఉంచింది.
  alternative: ప్రధాన పాఠంలో ‘ఇష్బోషెతు’ అని పెట్టడం.
  rationale: మూలపాఠాన్ని మరో గ్రంథంలోని నామరూపానికి అనుగుణంగా మార్చకుండా, భిన్న రూపాన్ని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గంభీర శైలిని ఉపయోగించింది. పాతకాలపు ‘కనెను’ బదులు సహజమైన ‘తండ్రి అయ్యాడు’ అనే ప్రయోగాన్ని ఎంచుకుంది.
