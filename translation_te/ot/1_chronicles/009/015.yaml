base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/015.yaml
  text: and Bakbakkar[a], Heresh, and Galal, and Mattaniah son of Mica, son of Zichri[b], son of Asaph.
translation:
  language: te
  text: మరియు బక్బక్కరు, హేరెషు, గాలాలు, ఆసాపు కుమారుడైన జిక్రీ కుమారుడైన మీకా కుమారుడైన మత్తన్యా.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హీబ్రూలో “కుమారుడు” అనే పదం కొన్నిసార్లు మరింత దూరపు వంశస్థుణ్ణి కూడా సూచించవచ్చు; ఇక్కడ వంశావళి వరుసలో దానిని “కుమారుడు”గా అనువదించాం.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “మీకా” అనే పేరు హీబ్రూ రూపమైన מִיכָאను ప్రతిబింబిస్తుంది; కొందరికి పరిచితమైన “మీకా/Micah” రూపం హీబ్రూలో వేరుగా ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַקְבַּקַּר
  choice: బక్బక్కరు
  rationale: ముందటి జాబితాను కొనసాగించే ו సంధిని తెలుగులో సహజమైన వరుస నిర్మాణం ద్వారా సూచించాం; వ్యక్తి పేరును హీబ్రూ ధ్వనికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: חֶרֶשׁ
  choice: హేరెషు
  rationale: హీబ్రూ వ్యక్తి పేరును ఆధునిక తెలుగు పఠనానికి అనుకూలంగా, చివరి שׁ ధ్వనిని నిలుపుతూ లిప్యంతరీకరించాం.
- source_word: וְ/גָלָל
  choice: గాలాలు
  rationale: పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం; వరుసలోని సంధి తెలుగులో కామాలతో సహజంగా వ్యక్తమవుతుంది.
- source_word: וּ/מַתַּנְיָה
  choice: మత్తన్యా
  rationale: హీబ్రూ వ్యక్తి పేరును ధ్వన్యనుసారంగా లిప్యంతరీకరించాం; జాబితా చివరి సభ్యుడని తెలుగు వాక్య నిర్మాణం స్పష్టం చేస్తుంది.
- source_word: בֶּן
  choice: కుమారుడు
  rationale: వంశావళి గొలుసులో సాధారణమైన ప్రత్యక్ష అర్థాన్ని నిలిపాం; తెలుగులో సహజంగా చదవడానికి సంబంధాలను వెనుకనుంచి ముందుకు అమర్చాం.
- source_word: מִיכָא
  choice: మీకా
  rationale: ఇక్కడి ప్రత్యేక హీబ్రూ రూపం מִיכָאను ప్రతిబింబించేలా లిప్యంతరీకరించాం.
- source_word: זִכְרִי
  choice: జిక్రీ
  rationale: హీబ్రూ పేరులోని ז ధ్వనిని తెలుగు వాడుకకు అనుగుణంగా జతో, כְרִ సముచ్చయాన్ని క్రీతో సూచించాం.
- source_word: אָסָף
  choice: ఆసాపు
  rationale: హీబ్రూ పేరును తెలుగు బైబిలు నామరూపాలకు అనుకూలంగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: בֶּן పదం సూచించే వంశసంబంధ విస్తృతి
  choice: ప్రధాన పాఠ్యంలో ‘కుమారుడు’
  alternative: ‘వంశస్థుడు’
  rationale: ఈ వరుసలో בֶּן పదాన్ని దాని సాధారణ వంశావళి అర్థమైన ‘కుమారుడు’గా అనువదించాం; అయితే హీబ్రూలో అది కొన్నిసార్లు దూరపు వంశస్థుడినీ సూచించగలదనే అస్పష్టతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వంశావళి శైలిని వాడాం. హీబ్రూ వరుసలో ప్రతి పేరుకు ముందు ఉన్న సంధులను తెలుగులో పదేపదే ‘మరియు’గా పెట్టకుండా కామాల ద్వారా సహజంగా చూపించాం; వంశసంబంధ గొలుసును తెలుగు పఠనానికి స్పష్టంగా ఉండేలా ప్రతిలోమ క్రమంలో నిర్మించాం.
