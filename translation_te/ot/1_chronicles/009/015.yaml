    issue: The initial Hebrew conjunction וּ־ is not represented.
    rationale: The verse begins as a continuation of the preceding list. Telugu need not repeat ‘మరియు’ before every name, but one initial ‘మరియు’ preserves this function.
  - severity: low
    issue: The audit-trail lexical note for מִיכָא (Mica) is absent and has no anchor.
    rationale: A second footnote makes clear that the Hebrew form here is Mica, rather than silently assimilating it to the more familiar Micah form.
