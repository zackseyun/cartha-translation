  yaml_path: translation/ot/1_chronicles/009/006.yaml
  text: 'And from the sons of Zerah: Jeuel and their brothers[a], six hundred and ninety.'
translation:
  language: te
  text: మరియు జెరహు కుమారులలోనుండి యెవూయేలు, వారి సహోదరులు[a]—మొత్తం ఆరువందల తొంభై మంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెవూయేలు, అతని సహోదరులు—మొత్తం ఆరువందల తొంభై మంది.” యెవూయేలును వంశానికి ప్రాతినిధ్యం వహించే నాయకునిగా అర్థం చేసుకుంటే సంబంధాన్ని ఏకవచనంలో ఇలా తీసుకోవచ్చు. అయితే హీబ్రూ మూలంలోని ప్రత్యయం బహువచనంలో ఉంది; అక్షరార్థంగా “వారి సహోదరులు” అని ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִן בְּנֵי זֶרַח
  choice: జెరహు కుమారులలో
  rationale: మునుపటి జాబితాకు అనుసంధానంగా ‘జెరహు కుమారులలో’ అని అనువదించాం. వంశావళి సందర్భంలో ‘కుమారులు’ అనే మాట ప్రత్యక్ష కుమారులతోపాటు వంశస్థులను కూడా సూచించగలదు.
- source_word: יְעוּאֵל
  choice: యెవూయేలు
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు బైబిలు శైలికి తగిన విధంగా లిప్యంతరీకరించాం.
- source_word: וַ/אֲחֵי/הֶם
  choice: వారి సహోదరులు
  rationale: హీబ్రూ పదంలోని మూడవ పురుష బహువచన ప్రత్యయం ‘వారి’ అని ప్రత్యక్షంగా సూచిస్తుంది; ఏకవచనంగా సవరించకుండా మూలంలోని రూపాన్ని నిలిపాం.
- source_word: שֵׁשׁ מֵאוֹת וְ/תִשְׁעִים
  choice: మొత్తం ఆరువందల తొంభై మంది
  rationale: సంఖ్యను సహజమైన తెలుగు పదరూపంలో ఇచ్చి, ఇది నమోదైన వారి మొత్తం అని స్పష్టమయ్యేందుకు ‘మొత్తం’, వ్యక్తుల లెక్క కావడంతో ‘మంది’ చేర్చాం.
