translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళి జాబితాకు తగిన సంక్షిప్తమైన గంభీర శైలిని వాడాం. మూలంలోని బహువచన ప్రత్యయాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సాధ్యమైన ఏకవచన అవగాహనను పాదసూచికలో ఇచ్చాం.
