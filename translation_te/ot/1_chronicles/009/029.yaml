revisions:
- from: వారిలో కొందరు సామగ్రి బాధ్యతను, పవిత్ర సామగ్రి అంతటి బాధ్యతను, అలాగే మెత్తని పిండి, ద్రాక్షారసం, నూనె, సాంబ్రాణి, సుగంధ ద్రవ్యాల బాధ్యతను చేపట్టడానికి నియమించబడ్డారు.
  to: వారిలో కొందరు సామగ్రికీ, పవిత్రమైన సామగ్రి అంతటికీ[a], మెత్తని పిండికీ, ద్రాక్షారసానికీ, నూనెకీ, సాంబ్రాణికీ, సుగంధ ద్రవ్యాలకీ బాధ్యులుగా నియమించబడ్డారు.
  rationale: వాక్యాన్ని ‘బాధ్యులుగా నియమించబడ్డారు’ అనే సహజమైన నిర్మాణంతో సవరించాం. దీనివల్ల מְמֻנִּים యొక్క కర్మణి నియామక భావం మరియు పునరావృతమైన עַל సూచించే బాధ్యతా పరిధులు రెండూ నిలిచాయి. మూలంలోని కొంత అసాధారణమైన ‘సామగ్రి’ మరియు ‘పవిత్రమైన సామగ్రి అంతా’ అనే వరుసను కుదించకుండా భద్రపరిచాం. ఆంగ్ల ఆడిట్‌లో ఉన్న ప్రత్యామ్నాయాన్ని తెలుగు పాదటిప్పణిగా చేర్చాం.
