id: 1CH.9.29
reference: 1 Chronicles 9:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/מֵ/הֶ֗ם מְמֻנִּים֙ עַל הַ/כֵּלִ֔ים וְ/עַ֖ל כָּל כְּלֵ֣י הַ/קֹּ֑דֶשׁ וְ/עַל הַ/סֹּ֨לֶת֙ וְ/הַ/יַּ֣יִן וְ/הַ/שֶּׁ֔מֶן וְ/הַ/לְּבוֹנָ֖ה וְ/הַ/בְּשָׂמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/029.yaml
  text: And some of them were appointed over the vessels[a], over all the holy vessels, and over the fine flour, the wine, the oil, the frankincense, and the spices.
translation:
  language: te
  text: వారిలో కొందరు సామగ్రికీ, పవిత్రమైన సామగ్రి అంతటికీ[a], మెత్తని పిండికీ, ద్రాక్షారసానికీ, నూనెకీ, సాంబ్రాణికీ, సుగంధ ద్రవ్యాలకీ బాధ్యులుగా నియమించబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, పవిత్రస్థలానికి చెందిన సామగ్రి అంతటికీ.
    reason: כְּלֵי הַקֹּדֶשׁ అనే నిర్మాణానికి ‘పవిత్రమైన సామగ్రి’తో పాటు ‘పవిత్రస్థలానికి చెందిన సామగ్రి’ అనే సాధ్యమైన అర్థం కూడా ఉంది.
lexical_decisions:
- source_word: וּמֵהֶם
  choice: వారిలో కొందరు
  rationale: מִן ప్రత్యయంతో భాగార్థాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘వారిలో కొందరు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: מְמֻנִּים
  choice: నియమించబడ్డారు
  rationale: ఈ కర్మణి కృదంతం అప్పగించబడిన బాధ్యతను సూచిస్తుంది; ప్రత్యేక పదవిని ఊహించకుండా నియామక భావాన్ని నిలుపుతుంది.
- source_word: עַל
  choice: బాధ్యతను చేపట్టడానికి
  rationale: పునరావృతమైన עַל బాధ్యతా పరిధిని సూచిస్తుంది. తెలుగులో ‘మీద నియమించబడ్డారు’ కంటే ఈ రూపం సహజమైనది.
- source_word: הַכֵּלִים
  choice: సామగ్రి
  rationale: כְּלִי అనేది పాత్రలు, పనిముట్లు, ఇతర వస్తువులను కలుపుకొనే విస్తృత పదం; ‘సామగ్రి’ ఆ విస్తృతిని నిలుపుతుంది.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: పవిత్ర సామగ్రి అంతటి
  rationale: నిర్మాణం అక్షరార్థంగా ‘పవిత్రతకు/పవిత్రస్థలానికి చెందిన సామగ్రి అంతా’ అని ఉండవచ్చు. ప్రధాన పాఠం పవిత్ర స్థితిని నేరుగా తెలియజేస్తుంది.
- source_word: הַסֹּלֶת
  choice: మెత్తని పిండి
  rationale: సాధారణ పిండి కాక, అర్పణల్లో వాడే సన్నగా చేసిన ఉత్తమ పిండిని సూచిస్తుంది.
- source_word: הַיַּיִן
  choice: ద్రాక్షారసం
  rationale: יַיִן ద్రాక్షతో చేసిన మద్యపానీయాన్ని సూచిస్తుంది; తెలుగు బైబిలు శైలిలో ‘ద్రాక్షారసం’ సహజంగా ఉంటుంది.
- source_word: הַשֶּׁמֶן
  choice: నూనె
  rationale: మూలంలో ఒలీవ నూనె అని ప్రత్యేకంగా చెప్పలేదు; అందుచేత సాధారణ పదమే ఉంచబడింది.
- source_word: הַלְּבוֹנָה
  choice: సాంబ్రాణి
  rationale: לְבוֹנָה ప్రత్యేకంగా frankincense‌ను సూచిస్తుంది; తెలుగులో దానికి సాధారణంగా తెలిసిన పదం ‘సాంబ్రాణి’.
- source_word: הַבְּשָׂמִים
  choice: సుగంధ ద్రవ్యాలు
  rationale: ఆరాధనా తయారీలలో ఉపయోగించే పరిమళభరిత పదార్థాల విస్తృత భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: כְּלֵי הַקֹּדֶשׁ లో הַקֹּדֶשׁ భావం
  choice: పవిత్ర సామగ్రి
  alternative: పవిత్రస్థలపు సామగ్రి
  rationale: హెబ్రీ నిర్మాణం ‘పవిత్రమైన సామగ్రి’ లేదా ‘పవిత్రస్థలానికి చెందిన సామగ్రి’ అనే రెండింటినీ అనుమతిస్తుంది. సందర్భాన్ని అతిగా నిర్దిష్టం చేయకుండా ప్రధాన పాఠంలో గుణార్థం ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన గ్రంథశైలి, కానీ సాధారణ పాఠకుడికి సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని బాధ్యతా జాబితా పునరుక్తిని తెలుగులో సహజంగా కుదించి, అంశాలన్నింటినీ నిలిపింది.
