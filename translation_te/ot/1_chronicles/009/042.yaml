translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గౌరవప్రద శైలిని వాడాం. పేర్లు మూల హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించబడ్డాయి; పాదసూచిక గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
