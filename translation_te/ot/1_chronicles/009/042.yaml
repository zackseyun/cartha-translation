source:
  edition: WLC
  text: וְ/אָחָז֙ הוֹלִ֣יד אֶת יַעְרָ֔ה וְ/יַעְרָ֗ה הוֹלִ֛יד אֶת עָלֶ֥מֶת וְ/אֶת עַזְמָ֖וֶת וְ/אֶת זִמְרִ֑י וְ/זִמְרִ֖י הוֹלִ֥יד אֶת מוֹצָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/042.yaml
  text: Ahaz fathered Jarah[a], and Jarah fathered Alemeth, Azmaveth, and Zimri; and Zimri fathered Moza.
translation:
  language: te
  text: ఆహాజు యారహ్‌కు[a] తండ్రి అయ్యాడు; యారహ్ అలెమెత్‌కు, అజ్మావెత్‌కు, జిమ్రీకి తండ్రి అయ్యాడు; జిమ్రీ మోజాకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 దినవృత్తాంతాలు 8:36లోని సమాంతర వంశావళిలో ఇక్కడ ‘యారహ్’కు బదులుగా ‘యెహోయద్దా’ అని ఉంది. అయితే ఈ స్థలంలోని దినవృత్తాంతాల హీబ్రూ ప్రతులు ‘యారహ్’ అని చదువుతున్నందున, ప్రధాన పాఠంలో అదే ఉంచబడింది.
    reason: textual_variant
lexical_decisions:
- source_word: הוֹלִיד
  choice: కనెను
  rationale: వంశావళి సందర్భంలో ילד హిఫీల్ రూపం తండ్రిగా సంతానాన్ని కనడాన్ని సూచిస్తుంది. ‘కనెను’ సంక్షిప్తంగా, గౌరవప్రదంగా ఉండి పితృవంశ భావాన్ని నిలుపుతుంది.
- source_word: יַעְרָה
  choice: యారా
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: עָלֶמֶת
  choice: అలెమెతు
  rationale: హీబ్రూ వ్యక్తి పేరును తెలుగు ధ్వని విధానానికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: עַזְמָוֶת
  choice: అజ్మావెతు
  rationale: హీబ్రూ వ్యక్తి పేరును దాని ప్రధాన ధ్వనులను నిలుపుతూ లిప్యంతరీకరించాం.
- source_word: זִמְרִי
  choice: జిమ్రీ
  rationale: హీబ్రూ వ్యక్తి పేరును నేరుగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: מוֹצָא
  choice: మోజా
  rationale: హీబ్రూ వ్యక్తి పేరును నేరుగా తెలుగు లిపిలో ఇచ్చాం.
- source_word: וְ
  choice: మరియు/వాక్య అనుసంధానం
  rationale: హీబ్రూ సంధికారకాన్ని సహజ తెలుగు వంశావళి ప్రవాహంలో పునరుక్తి లేకుండా వాక్య విభజన, ‘;’ ద్వారా వ్యక్తం చేశాం.
- source_word: אֶת
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: నిర్దిష్ట ప్రత్యక్ష కర్మ సూచికకు తెలుగులో స్వతంత్ర పదసమానం లేదు; కర్మ విభక్తి ‘ను/ని’ ద్వారా దాని వాక్యనిర్మాణ పాత్రను చూపించాం.
