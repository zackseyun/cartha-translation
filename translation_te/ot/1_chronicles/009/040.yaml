  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בֶן יְהוֹנָתָ֖ן מְרִ֣יב בָּ֑עַל וּ/מְרִי בַ֖עַל הוֹלִ֥יד אֶת מִיכָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/040.yaml
  text: And the son of Jehonathan was Merib-baal[b][a], and Merib-baal fathered Micah.
translation:
  language: te
  text: యెహోనాతాను కుమారుడు మెరీబ్-బయలు[a][b]; మెరీబ్-బయలు మీకాకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ఈ వచనంలో తండ్రి పేరును హీబ్రూలో రెండు స్వల్ప భిన్న రూపాల్లో రాస్తుంది: మొదట ‘మెరీబ్-బయలు,’ తరువాత సంక్షిప్తంగా ‘మెరీ-బయలు.’ స్పష్టత కోసం అనువాదంలో రెండుచోట్లా ఒకే రూపం వాడాం.'
    reason: textual_variant
  - marker: b
    text: 1 సమూయేలు 14:49లో సౌలు కుమారుని పేరును ‘యోనాతాను’ అని ఇస్తుంది. ఇక్కడ దినవృత్తాంతాల గ్రంథంలోని హీబ్రూ రూపం ‘యెహోనాతాను.’
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בֶן
  choice: కుమారుడు
  rationale: בֶן అంటే ‘కుమారుడు.’ ముందున్న వంశావళితో అనుసంధానించే ו భావం తెలుగు వాక్యప్రవాహంలో సహజంగా అంతర్లీనంగా ఉంది.
- source_word: יְהוֹנָתָן
  choice: యెహోనాతాను
  rationale: ఇక్కడ ఉన్న యెహోనాతాను అనే హీబ్రూ రూపాన్ని, మరింత పరిచితమైన ‘యోనాతాను’గా మార్చకుండా లిప్యంతరీకరించాం.
- source_word: מְרִיב בָּעַל
  choice: మెరీబ్-బయలు
  rationale: రెండు భాగాలుగా రాసిన వ్యక్తి పేరును వాటి నిర్మాణం కనిపించేలా హైఫన్‌తో లిప్యంతరీకరించాం.
- source_word: וּ/מְרִי בַעַל
  choice: మెరీబ్-బయలు
  rationale: రెండోసారి పేరు కొద్దిగా సంక్షిప్త రూపంలో ఉన్నా, ఒకే వ్యక్తిని స్పష్టంగా సూచించేందుకు పూర్తి రూపాన్ని వాడాం; తేడాను పాదసూచికలో తెలిపాం.
- source_word: הוֹלִיד
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో హిఫిల్ రూపం ‘కనడం/తండ్రి కావడం’ అనే పురుష వంశ సంబంధాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘తండ్రి అయ్యాడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: אֶת מִיכָה
  choice: మీకాకు
  rationale: אֶת ప్రత్యక్ష కర్మ సూచిక; విడిగా అనువదించబడదు. מִיכָהను ‘మీకా’గా లిప్యంతరీకరించి, తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా ‘కు’ చేర్చాం.
