id: 1CH.9.33
reference: 1 Chronicles 9:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: WLC
  text: וְ/אֵ֣לֶּה הַ֠/מְשֹׁרְרִים רָאשֵׁ֨י אָב֧וֹת לַ/לְוִיִּ֛ם בַּ/לְּשָׁכֹ֖ת פטירים כִּֽי יוֹמָ֥ם וָ/לַ֛יְלָה עֲלֵי/הֶ֖ם בַּ/מְּלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/033.yaml
  text: These were the singers[a], heads of fathers’ houses of the Levites, in the chambers, free from other duties, for they were occupied in the work day and night.
translation:
  language: te
  text: వీరు గాయకులు[a]—లేవీయుల పితృకుటుంబాల పెద్దలు. గదుల్లో ఉన్న వీరు ఇతర విధుల నుండి మినహాయించబడ్డారు, ఎందుకంటే పగలూ రాత్రీ ఆ పని వారి బాధ్యతగా ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విడుదల పొందినవారు’ లేదా ‘మినహాయించబడినవారు.’ హీబ్రూలోని ఈ అరుదైన పదం, వారి నిరంతర గానసేవ కారణంగా వారు ఇతర విధుల నుండి మినహాయించబడ్డారని బహుశా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: గాయకులు
  rationale: שׁיר ధాతువు నుంచి వచ్చిన ఈ కృదంతం పాడే సేవలో ఉన్నవారిని సూచిస్తుంది; ‘గాయకులు’ ప్రత్యక్షమైన, సహజమైన అనువాదం.
- source_word: רָאשֵׁי אָבוֹת
  choice: పితృకుటుంబాల పెద్దలు
  rationale: దినవృత్తాంతాలలోని వంశ–సామాజిక నిర్మాణాన్ని నిలుపుతూ, ఆధునిక తెలుగులో అర్థమయ్యేలా ఉంది.
- source_word: לַלְוִיִּם
  choice: లేవీయుల
  rationale: ఈ పెద్దలు లేవీయులకు చెందినవారని సూచించే సంబంధాన్ని సహజమైన తెలుగు షష్ఠీ రూపంలో వ్యక్తం చేస్తుంది.
- source_word: בַּלְּשָׁכוֹת
  choice: గదుల్లో
  rationale: לשכה సంస్థాగత ప్రాంగణంలోని గదులను సూచిస్తుంది; మూలంలో స్పష్టంగా లేని ‘దేవాలయ’ అనే పదాన్ని చేర్చలేదు.
- source_word: פטירים
  choice: ఇతర విధుల నుంచి విడుదల పొందారు
  rationale: అరుదైన ఈ పదం ‘విడుదల పొందినవారు/మినహాయించబడినవారు’ అనే భావమిచ్చే అవకాశముంది. సందర్భం సూచించే ఇతర లేవీయ విధుల మినహాయింపును స్పష్టంగా, కాని పాదసూచికతో అనిశ్చితిని కాపాడుతూ తెలిపింది.
- source_word: כִּי
  choice: ఎందుకంటే
  rationale: వారు విడుదల పొందడానికి తరువాతి వాక్యభాగం కారణమని స్పష్టంగా తెలియజేస్తుంది.
- source_word: יוֹמָם וָלַיְלָה
  choice: పగలూ రాత్రీ
  rationale: నిరంతర బాధ్యతను సూచించే హీబ్రూ కాలజంటను సహజమైన తెలుగు నుడికారంతో నిలుపుతుంది.
- source_word: עֲלֵיהֶם
  choice: వారి బాధ్యతగా ఉండేది
  rationale: అక్షరార్థంగా ‘వారిమీద’ అయిన ఈ నుడికారం ఇక్కడ అప్పగించబడిన బాధ్యతను సూచిస్తుంది.
- source_word: בַּמְּלָאכָה
  choice: ఆ పని
  rationale: מלאכה అనే సాధారణ పదానికి ‘పని’ సరిపోతుంది; అది గానసేవేనని వచనం కంటే అధికంగా నిర్దిష్టం చేయదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. హీబ్రూ వాక్య నిర్మాణాన్ని తెలుగులో సహజంగా చేయడానికి రెండు వాక్యాలుగా విభజించబడింది; అరుదైన פטירים పదంలోని అనిశ్చితి పాదసూచికలో నిలుపబడింది.
