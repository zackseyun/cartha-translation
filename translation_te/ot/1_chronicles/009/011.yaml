source:
  edition: WLC
  text: וַ/עֲזַרְיָ֨ה בֶן חִלְקִיָּ֜ה בֶּן מְשֻׁלָּ֣ם בֶּן צָד֗וֹק בֶּן מְרָיוֹת֙ בֶּן אֲחִיט֔וּב נְגִ֖יד בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/011.yaml
  text: and Azariah son of Hilkiah[a], son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub, chief officer of the house of God.
translation:
  language: te
  text: హిల్కీయా కుమారుడైన అజర్యా—హిల్కీయా మెషుల్లాము కుమారుడు, మెషుల్లాము సాదోకు కుమారుడు, సాదోకు మెరాయోతు కుమారుడు, మెరాయోతు అహీటూబు కుమారుడు—దేవుని మందిరపు ప్రధాన అధికారి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాయకుడు,’ ‘అధిపతి,’ లేదా ‘పాలకుడు.’
    reason: నְגִיד అనే పదానికి నాయకత్వం, అధికారం, పర్యవేక్షణ అనే పరస్పర సంబంధిత అర్థాలు ఉన్నాయి.
lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  choice: అజర్యా కూడా ఉన్నాడు
  rationale: వావ్ సంధిని ముందున్న జాబితా కొనసాగింపుగా సహజమైన తెలుగులో ‘కూడా’తో వ్యక్తపరిచాం; పేరును హీబ్రూ ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: בֶן
  choice: కుమారుడు / కుమారుడైన
  rationale: వంశావళిలో పదేపదే వచ్చే בֶן‌ను మూలానికి సన్నిహితంగా ‘కుమారుడు’గా ఉంచాం. వంశావళులు కొన్నిసార్లు తరాలను సంక్షిప్తం చేయగలిగినా, పాఠ్యంలో ఉన్న సంబంధాన్ని ‘వంశస్థుడు’గా విస్తరించలేదు.
- source_word: חִלְקִיָּה
  choice: హిల్కీయా
  rationale: వ్యక్తి పేరును ఆధునిక తెలుగు లిపిలో హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: מְשֻׁלָּם
  choice: మెషుల్లాము
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: צָדוֹק
  choice: సాదోకు
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: מְרָיוֹת
  choice: మెరాయోతు
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: אֲחִיטוּב
  choice: అహీటూబు
  rationale: వ్యక్తి పేరును హీబ్రూ రూపానికి దగ్గరగా లిప్యంతరీకరించాం.
- source_word: נְגִיד
  choice: ప్రధాన అధికారి
  rationale: నియమించబడిన నాయకుడు లేదా పర్యవేక్షణ బాధ్యతగల అధికారి అనే భావాన్ని మందిర పరిపాలనా సందర్భంలో సహజంగా తెలియజేస్తుంది; ‘అధిపతి’ లేదా ‘నాయకుడు’ అనే ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: בֵּית הָאֱלֹהִים
  choice: దేవుని మందిరం
  rationale: అక్షరార్థంగా ‘దేవుని ఇల్లు’ అయినా, ఇక్కడ ఇశ్రాయేలు ఆరాధనా మందిరాన్ని సూచిస్తున్నందున ఆధునిక తెలుగులో స్పష్టమైన ‘దేవుని మందిరం’ను ఎంచుకున్నాం.
theological_decisions:
- issue: మందిర సూచనలో אֱלֹהִים అనువాదం
  choice: దేవుడు
  alternative: దేవుళ్లు
  rationale: ఇశ్రాయేలు ఆరాధనా మందిర సందర్భంలో ఈ పదం ఇశ్రాయేలు దేవుణ్ణే సూచిస్తుంది; అందువల్ల ఏకవచన రూపమే సందర్భానుసారంగా ఖచ్చితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడాం. వరుసగా వచ్చే ‘కుమారుడు’ సంబంధాలు ఎవరికి వర్తిస్తాయో స్పష్టంగా ఉండేందుకు వంశక్రమాన్ని చిన్న వాక్యాలుగా అమర్చాం. పాదసూచిక గుర్తును దాని అసలు సంబంధమైన ‘ప్రధాన అధికారి’ వద్ద ఉంచాం.
