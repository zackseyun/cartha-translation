  source_fidelity: వంశావళి సంబంధాలు, పేర్లు, మరియు అజర్యా దేవుని మందిరంతో సంబంధమైన నְגִיד అని చెప్పబడిన విషయం ముసాయిదాలో ఉన్నాయి. అయితే ‘కూడా ఉన్నాడు’ అనేది హీబ్రూ వావ్‌కు అవసరం లేని అస్తిత్వ-వాక్యాన్ని జోడిస్తుంది; అలాగే చివరి వాక్యాన్ని అజర్యాకు స్పష్టంగా అనుసంధానించడం మూలంలోని అప్పోజిషనల్ నిర్మాణాన్ని మరింత సన్నిహితంగా ప్రతిబింబిస్తుంది.
