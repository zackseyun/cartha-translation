  variant: modern standard Telugu
source:
  edition: WLC
  text: וּ/בְנֵ֖י מִיכָ֑ה פִּית֥וֹן וָ/מֶ֖לֶךְ וְ/תַחְרֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/041.yaml
  text: 'And the sons of Micah: Pithon, Melech, and Tahrea.'
translation:
  language: te
  text: 'మీకా కుమారులు: పీతోను, మెలెకు, తహ్రేయా.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: కుమారులు
  rationale: వంశావళి సూత్రంలో בן పదానికి సహజమైన తెలుగు బహువచనం. ఆరంభంలోని וְ పూర్వ వాక్యంతో అనుసంధానాన్ని సూచించినప్పటికీ, తెలుగు వంశావళి జాబితాలో దానిని ప్రత్యేకంగా ‘మరియు’ అని పలకకపోవడం సహజంగా ఉంటుంది.
- source_word: מִיכָה
  choice: మీకా
  rationale: హీబ్రూ వ్యక్తినామాన్ని దాని దీర్ఘ ī స్వరానికి అనుగుణంగా తెలుగు లిప్యంతరీకరణ చేశాం.
- source_word: פִּיתוֹן
  choice: పీతోను
  rationale: హీబ్రూ వ్యక్తినామాన్ని తెలుగు ఉచ్చారణకు అనుకూలంగా లిప్యంతరీకరించాం.
- source_word: וָמֶלֶךְ
  choice: మెలెకు
  rationale: ఇది ‘రాజు’ అనే సాధారణ నామంగా కాక వ్యక్తినామంగా ఉన్నందున అనువదించకుండా లిప్యంతరీకరించాం; జాబితాలోని హీబ్రూ సంధికారకాన్ని తెలుగులో కామాతో సహజంగా సూచించాం.
- source_word: וְתַחְרֵעַ
  choice: తహ్రేయా
  rationale: హీబ్రూ వ్యక్తినామాన్ని మూలంలోని హల్లులు, స్వరాలకు సమీపంగా తెలుగు లిప్యంతరీకరణ చేశాం; జాబితాలో చివరి పేరుకు ముందు ‘మరియు’ లేకుండానే తెలుగు పఠనం సహజంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన వంశావళి శైలి. పేర్లను అనువదించకుండా మూల హీబ్రూకు సమీపంగా లిప్యంతరీకరించాం.
