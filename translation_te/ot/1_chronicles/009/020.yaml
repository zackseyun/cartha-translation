source:
  edition: WLC
  text: וּ/פִֽינְחָ֣ס בֶּן אֶלְעָזָ֗ר נָגִ֨יד הָיָ֧ה עֲלֵי/הֶ֛ם לְ/פָנִ֖ים יְהוָ֥ה עִמּֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/020.yaml
  text: And Phinehas son of Eleazar had formerly been chief over them[a]; Yahweh was with him.
translation:
  language: te
  text: ఎలియాజరు కుమారుడైన ఫీనెహాసు గతంలో వారిమీద నాయకుడిగా ఉండేవాడు[a]; యాహ్వే అతనితో ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎలియాజరు కుమారుడైన ఫీనెహాసు వారిమీద గతంలో నాయకుడిగా ఉండేవాడు.” హీబ్రూ పదక్రమంలో “గతంలో” అనే కాలసూచనను “నాయకుడిగా ఉండేవాడు” అనే మాటలతో సన్నిహితంగా గానీ, మొత్తం వాక్యభాగంతో గానీ అనుసంధానించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִינְחָס
  choice: ఫీనెహాసు
  rationale: సంధానక అవ్యయం వావ్ ఇక్కడ తెలుగు వాక్యప్రవాహంలో ప్రత్యేకంగా ‘మరియు’ అని అనువదించాల్సిన అవసరం లేదు; పేరును సాధారణ తెలుగు బైబిలు రూపంలో లిప్యంతరీకరించాం.
- source_word: בֶּן אֶלְעָזָר
  choice: ఎలియాజరు కుమారుడైన
  rationale: హీబ్రూ వంశసంబంధ నిర్మాణాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలిపే రూపం.
- source_word: נָגִיד
  choice: నాయకుడు
  rationale: ఈ పదం అధికారంతో ముందుండే వ్యక్తిని సూచిస్తుంది. సందర్భంలోని సేవా-పరిపాలనా భావాన్ని ఉంచుతూ రాజరిక భావాన్ని అతిగా మోపకుండా ‘నాయకుడు’ అని అనువదించాం.
- source_word: הָיָה
  choice: ఉండేవాడు
  rationale: לְפָנִיםతో కలిసి గతకాలంలో కొనసాగిన స్థితిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: עֲלֵיהֶם
  choice: వారిమీద
  rationale: ముందు ప్రస్తావించిన వారిపై అధికారం లేదా పర్యవేక్షణ ఉన్నదనే భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: לְפָנִים
  choice: పూర్వకాలంలో
  rationale: మునుపటి కాలాన్ని సూచించే క్రియావిశేషణార్థాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: יְהוָה
  choice: యెహోవా
  rationale: దైవనామమైన టెట్రాగ్రామటన్‌ను బిరుదుతో భర్తీ చేయకుండా తెలుగులో సుపరిచితమైన వ్యక్తినామ రూపంగా అందించాం.
- source_word: עִמּוֹ
  choice: అతనికి తోడుగా ఉన్నాడు
  rationale: దైవసన్నిధి మరియు అనుగ్రహసహాయ భావాన్ని అతిగా వివరణ చేయకుండా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: יְהוָה అనే దైవనామం అనువాదం
  choice: యెహోవా
  alternative: యాహ్వే
  rationale: హీబ్రూ పాఠంలోని వ్యక్తిగత దైవనామాన్ని ‘ప్రభువు’ అనే బిరుదుతో మార్చకుండా ఉంచాం. తెలుగు పాఠకులకు విస్తృతంగా పరిచితమైన ‘యెహోవా’ రూపాన్ని ఎంచుకున్నాం.
- issue: עִמּוֹలోని దైవసన్నిధి భావం
  choice: అతనికి తోడుగా ఉన్నాడు
  alternative: అతనితో ఉన్నాడు
  rationale: మూలంలోని సంక్షిప్తతను కాపాడుతూ, తెలుగులో ఈ సందర్భానికి సహజమైన దైవసహాయ భావాన్ని వ్యక్తం చేశాం; ప్రత్యేక విజయమో ఆమోదమో అదనంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే చారిత్రక-ఆరాధనా సందర్భానికి తగిన గౌరవభరిత శైలి. మూలంలోని కాలసంబంధ అస్పష్టతను పాదటిప్పణిలో నిలిపాం.
