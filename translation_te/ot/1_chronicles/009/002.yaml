- from: తమ స్వాస్థ్యంలోని తమ పట్టణాల్లో మొదట నివసించినవారు ఇశ్రాయేలు ప్రజలు, యాజకులు, లేవీయులు, దేవాలయ సేవకులు[a].
  to: తమ స్వాస్థ్యాల్లో, తమ పట్టణాల్లో మొదట నివసించినవారు ఇశ్రాయేలు ప్రజలు, యాజకులు, లేవీయులు, దేవాలయ సేవకులు[a].
  rationale: The revision separates the two Hebrew locative expressions, preserving their relationship without adding an interpretation. All group names and the explanatory alternative for the Nethinim are retained.
