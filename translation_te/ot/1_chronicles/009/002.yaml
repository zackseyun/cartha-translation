translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; వంశావళి–చారిత్రక సందర్భానికి తగిన గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి. హీబ్రూ వాక్యంలోని వర్గాల జాబితాను యథాతథంగా నిలిపి, తెలుగులో అసహజంగా ఉండే ‘మొదటి నివాసులు’ బదులు ‘మొదట నివసించినవారు’ అని సహజీకరించబడింది.
