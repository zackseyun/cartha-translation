  text: וְ/הַ/יּוֹשְׁבִים֙ הָ/רִ֣אשֹׁנִ֔ים אֲשֶׁ֥ר בַּ/אֲחֻזָּתָ֖/ם בְּ/עָרֵי/הֶ֑ם יִשְׂרָאֵל֙ הַ/כֹּ֣הֲנִ֔ים הַ/לְוִיִּ֖ם וְ/הַ/נְּתִינִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/002.yaml
  text: The first inhabitants who lived in their possessions in their cities were Israel[a], the priests, the Levites, and the temple servants.
translation:
  language: te
  text: తమ స్వాస్థ్యాల్లో, తమ పట్టణాల్లో మొదట నివసించినవారు ఇశ్రాయేలు ప్రజలు, యాజకులు, లేవీయులు, దేవాలయ సేవకులు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నెతీనీయులు.” దేవాలయ సేవకు నియమించబడిన ఒక వర్గానికి వాడే సంప్రదాయ పేరు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיּוֹשְׁבִים הָרִאשֹׁנִים
  choice: మొదట నివసించినవారు
  rationale: యָשַׁב క్రియాభావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, הָרִאשֹׁנִים లోని కాలక్రమ ప్రాధాన్యాన్ని ‘మొదట’గా నిలుపుతుంది.
- source_word: בַּאֲחֻזָּתָם
  choice: తమ స్వాస్థ్యంలోని
  rationale: אֲחֻזָּה సూచించే సొంత భూభాగం లేదా వారసత్వపు ఆధీన స్థల భావాన్ని, అనవసరంగా న్యాయపరమైన అర్థాన్ని నిర్ణయించకుండా ‘స్వాస్థ్యం’గా అందిస్తుంది.
- source_word: בְּעָרֵיהֶם
  choice: తమ పట్టణాల్లో
  rationale: עָרִים కు సహజమైన తెలుగు సమానార్థకం ‘పట్టణాలు’; పునరావృతమైన స్వామ్యసూచనను కూడా నిలుపుతుంది.
- source_word: יִשְׂרָאֵל
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: హీబ్రూలోని సమూహవాచకమైన ‘ఇశ్రాయేలు’ను తెలుగు జాబితాలో వ్యక్తుల వర్గంగా స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: הַכֹּהֲנִים
  choice: యాజకులు
  rationale: ఆరాధనా సేవ చేసే ఈ వర్గానికి ప్రమాణమైన తెలుగు పదం.
- source_word: הַלְוִיִּם
  choice: లేవీయులు
  rationale: లేవి గోత్రానికి చెందిన ప్రత్యేక వర్గాన్ని సూచించే స్థిరమైన తెలుగు రూపం.
- source_word: וְהַנְּתִינִים
  choice: దేవాలయ సేవకులు[a]
  rationale: נְתִינִים దేవాలయ సేవకు అనుబంధమైన గుర్తింపు పొందిన వర్గాన్ని సూచిస్తుంది. ఆధునిక పాఠకులకు వారి విధిని స్పష్టంగా తెలియజేస్తూ, సంప్రదాయ లిప్యంతరీకరణను పాదటిప్పణిలో ఉంచుతుంది.
