    rationale: ఈ సంప్రదాయ పదబంధం దేవుని సన్నిధి భావాన్ని తెలియజేసినా, ముֹעֵד యొక్క ప్రాథమిక ‘సమావేశం/నిర్ణీత కలయిక’ అర్థాన్ని ఒక దశ దూరంగా ప్రతిబింబిస్తుంది. ఈ చిన్న వచనంలో నేరమైన పదప్రయోగం సాధ్యమూ సహజమూ కాబట్టి దానిని ప్రాధాన్యపరచాలి.
