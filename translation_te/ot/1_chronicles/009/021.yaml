  text: Zechariah son of Meshelemiah was gatekeeper at the entrance to the tent of meeting[a].
translation:
  language: te
  text: మెషెలెమ్యా కుమారుడైన జెకర్యా సమావేశ గుడారం ప్రవేశద్వారం వద్ద ద్వారపాలకుడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమావేశ గుడారం ద్వారం వద్ద ద్వారపాలకుడు.”
    reason: פֶּתַחకు ‘ప్రవేశద్వారం’కు బదులుగా ‘ద్వారం’ అనే పదప్రత్యామ్నాయం సాధ్యమే.
lexical_decisions:
- source_word: זְכַרְיָה
  choice: జెకర్యా
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: בֶּן
  choice: కుమారుడైన
  rationale: సమీప వంశావళి సందర్భంలో ఇది విస్తృతమైన ‘వంశస్థుడు’ అనే అర్థం కంటే ప్రత్యక్ష కుమార సంబంధాన్నే సూచిస్తుంది.
- source_word: מְשֶׁלֶמְיָה
  choice: మెషెలెమ్యా
  rationale: వ్యక్తి పేరును అనువదించకుండా తెలుగులో లిప్యంతరీకరించాం.
- source_word: שֹׁעֵר
  choice: ద్వారపాలకుడు
  rationale: ప్రవేశాన్ని కాపాడే బాధ్యతగల వ్యక్తి అనే భావాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: פֶּתַח
  choice: ప్రవేశద్వారం
  rationale: ఈ పదం ప్రవేశించే తెరువు లేదా ద్వారస్థలాన్ని సూచిస్తుంది; సందర్భంలో ‘ప్రవేశద్వారం’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: לְאֹהֶל
  choice: గుడారపు … దగ్గర
  rationale: לְ అనే సంబంధార్థక విభక్తిని తెలుగు వాక్యనిర్మాణంలో ప్రవేశద్వారం ఉన్న స్థలంతో కలిపి సహజంగా వ్యక్తం చేశాం.
- source_word: מוֹעֵד
  choice: ప్రత్యక్షపు
  rationale: אֹהֶל מוֹעֵד అనే స్థిర పవిత్రస్థల నామంలో దేవుడు తన ప్రజలను కలుసుకునే భావాన్ని తెలుగు బైబిలు సంప్రదాయంలో స్థిరపడిన ‘ప్రత్యక్షపు గుడారం’ వ్యక్తీకరిస్తుంది.
- source_word: אֹהֶל מוֹעֵד
  choice: ప్రత్యక్షపు గుడారం
  rationale: హీబ్రూ పవిత్రస్థల నామాన్ని ‘గుడారం’గా నిలుపుతూ, నియమిత కలయిక/సన్నిధి భావాన్ని తెలుగులో పరిచితమైన రూపంలో అందించాం; ‘మందిరం’ వంటి కాలానుచిత పదాన్ని వాడలేదు.
