source:
  edition: WLC
  text: וּ/מַתִּתְיָה֙ מִן הַ/לְוִיִּ֔ם ה֥וּא הַ/בְּכ֖וֹר לְ/שַׁלֻּ֣ם הַ/קָּרְחִ֑י בֶּ/אֱמוּנָ֕ה עַ֖ל מַעֲשֵׂ֥ה הַ/חֲבִתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/031.yaml
  text: And Mattithiah[a], from the Levites, the firstborn of Shallum the Korahite[b], was entrusted with the work of the flat cakes.
translation:
  language: te
  text: లేవీయులలో ఒకడైన మత్తిత్యా, కోరహీయుడైన షల్లూము మొదటిపుట్టిన కుమారుడు, పెనంపై తయారుచేసే రొట్టెల పనికి నమ్మకంగా బాధ్యత వహించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పెనంపై తయారుచేసే రొట్టెల పని అతనికి నమ్మి అప్పగించబడింది.” హీబ్రూ పదబంధం మత్తిత్యా నమ్మకంగా సేవ చేశాడని లేదా అతనికి నమ్మకమైన బాధ్యత అప్పగించబడిందని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַתִּתְיָה
  choice: మత్తిత్యా
  rationale: సందర్భంలోని పేర్ల జాబితా కొనసాగింపును తెలుగులో సహజమైన వాక్యప్రవాహంతో చూపిస్తూ, వ్యక్తిపేరును మూలభాషకు దగ్గరగా లిప్యంతరీకరించాం.
- source_word: מִן הַלְוִיִּם
  choice: లేవీయులలో ఒకడైన
  rationale: מן ఇక్కడ వర్గసభ్యత్వాన్ని సూచిస్తుంది; ఈ తెలుగు రూపం సహజంగా, స్పష్టంగా ఉంది.
- source_word: הוּא הַבְּכוֹר לְשַׁלֻּם
  choice: అతడు ... షల్లూము మొదటిపుట్టిన కుమారుడు
  rationale: בכור యొక్క ‘మొదటిపుట్టినవాడు’ అనే కుటుంబసంబంధ అర్థాన్ని నిలుపుతూ, తెలుగులో సంబంధాన్ని స్పష్టం చేయడానికి ‘కుమారుడు’ చేర్చాం.
- source_word: הַקָּרְחִי
  choice: కోరహీయుడైన
  rationale: కోరహు వంశానికి చెందినవాడనే కుటుంబ/వంశ విశేషణాన్ని తెలుగులో స్థిరమైన రూపంతో తెలిపాం.
- source_word: בֶּאֱמוּנָה
  choice: నమ్మకంగా నిర్వర్తించేవాడు
  rationale: ఈ పరిపాలనా సందర్భంలో పదం నమ్మకత్వాన్ని లేదా నమ్మి అప్పగించిన బాధ్యతను సూచించవచ్చు; ప్రధాన పాఠ్యంలో సహజమైన క్రియారూపాన్ని ఎంచుకుని, ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: עַל מַעֲשֵׂה
  choice: తయారీ బాధ్యతను
  rationale: על పర్యవేక్షణ/బాధ్యతను, מעשה ఇక్కడ ఆహార పదార్థం తయారీ పనిని సూచిస్తున్నందున రెండింటినీ సహజమైన తెలుగు పదబంధంగా అందించాం.
- source_word: הַחֲבִתִּים
  choice: పెనంపై చేసే రొట్టెల
  rationale: ఈ పదం పెనం లేదా పలుచని పాత్రపై తయారుచేసే ఒక రకమైన రొట్టెను సూచిస్తుంది; నిర్దిష్టంగా తెలియని ఆకారం లేదా ఆచారార్థాన్ని బలవంతంగా చేర్చకుండా వంటవిధానాన్ని తెలిపాం.
theological_decisions:
- issue: בֶּאֱמוּנָה సూచించే నమ్మకత్వమా లేక అప్పగించబడిన బాధ్యతా
  choice: ప్రధాన పాఠ్యంలో ‘నమ్మకంగా నిర్వర్తించేవాడు’
  alternative: ‘నమ్మి అప్పగించబడ్డాడు’ లేదా ‘నమ్మకమైన బాధ్యతలో ఉన్నాడు’
  rationale: హీబ్రూ పదబంధంలోని నిజమైన ద్వంద్వసాధ్యతను ప్రధాన పాఠ్యం మరియు పాదటిప్పణి ద్వారా కాపాడాం; ఏ ప్రత్యేక సిద్ధాంతార్థాన్నీ చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. పరిపాలనా బాధ్యతను సహజంగా తెలిపినా, בֶּאֱמוּנָה లోని అర్థసందిగ్ధతను పాదటిప్పణిలో కాపాడాం.
